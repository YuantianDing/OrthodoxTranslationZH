  - type: heading2
    text:
      ru: 'СВИДЕТЕЛЬСТВО ДУХА: ОТЕЦ СОФРОНИЙ И РУССКАЯ ЦЕРКОВЬ'
      cn: 圣灵的见证：索夫罗尼神父与俄罗斯教会
    children:
    - type: paragraph
      text:
        ru: 'В начале 90-х в монастырь приехали гости из России: в те годы – явление весьма редкое. Присутствуя на одной из очередных бесед старца с монастырской братией, некто из гостей попросил старца сказать последнее слово о монашестве. Старец, узрев в сей знаменательной встрече Промысл Божий, стал говорить, обращая свое слово ко всей Русской Церкви. Для старца эта встреча была особо волнующей, ибо на протяжении всего своего христианского пути старец глубоко преклонялся пред подвигом мученичества, который понесла РусскаяЦерковьв XX веке. Будучи на пороге своей смерти, старец в тот момент решился открыть то, что ему дано было жить за многие десятилетия в его неотступной молитве за РусскуюЦерковь, как это было явлено ему Духом Истины. В этой беседе старец со страхом посмел произнести сии дерзновенные слова: «Дух Божий извещает меня об истинности слов моих относительно Русской Церкви и ее богоданного Патриарха. Умоляю вас всех: послушайте слово, которое дает мне Бог и за которое вся ответственность ложится на меня»[193]. Они прозвучали как исповедь его пред всей Русской Церковью и как завет его всему русскому верующему люду.'
        cn: 九十年代初，有来自俄罗斯的客人来到修道院：那几年，这是一种非常罕见的现象。在一次长者与修道院修士们例常的谈话中，一位客人请求长者就修道生活发表最后的见解。长者在这场意义重大的会面中，洞察到上帝的旨意，便开始讲话，将其言语指向整个俄罗斯正教会。对长者而言，这次会面特别令人激动，因为在他整个的基督徒道路上，长者深深地敬仰着俄罗斯正教会在二十世纪所承受的殉道者的功绩。处于离世的门槛上，长者在那一刻决定揭示他几十年来在他为俄罗斯正教会不懈的祷告中所领受的，正如真理之灵向他所启示的。在这次谈话中，长者带着敬畏之心，竟敢说出以下这些大胆的话语：「上帝的灵向我宣告，关于我言语的真实性，是关于俄罗斯正教会及其上帝所赐的牧首。我恳求你们所有人：请听上帝赐予我的话语，我将为此负上全部责任。」[193] 它们如同他在整个俄罗斯正教会面前的告白，也是他留给所有俄罗斯信徒的遗训。
    - type: paragraph
      text:
        ru: 'Для старца Софрония, как и для его духовного отца и наставника прп.Силуана Афонского, гонимая РусскаяЦерковьявляла всему христианскому миру пример мученического подвига в своих страданиях за веру. В послереволюционные годы, созерцая духом мировую битву – веры во Христа Бога с неверием, старец ощущал, что самая напряженная схватка идет в России. Поэтому его молитва за верующих в этой стране была особенно горяча. Однако в Св. Пантелеимоновском монастыре на Афоне, где начал свой монашеский путь отец Софроний, отношение к Русской Патриаршей Церкви было далеко не благоприятным. В лице некоторых ее иерархов и священников афонские старцы видели «предателей» Христа, лицемерно сотрудничавших с атеистическим режимом. В письме к Д. Бальфуру старец тогда писал: «...афонские старцы неблагоприятно относятся к митрополиту Сергию... Я не скрывал своего расположения к Русской Патриаршей Церкви и поэтому подвергся некоторому преследованию»[194]. Старец вспоминал, как его вызвали однажды на собрание монахов и потребовали отречения от своих убеждений относительно Русской Церкви. Он молча слушал их обвинения и молился, прося у Бога вразумления и нужного слова. В какой-то момент он услышал в сердце: «Ну... теперь говори!» И отец Софроний стал говорить. Его слова – простые, но исходящие из данного ему свыше опыта – излагали истину как очевидный факт, не подлежащий дальнейшему обсуждению. После этого случая отношение к Русской Церкви в монастыре несколько переменилось. Ныне, в начале третьего тысячелетия, мы стоим пред видимым доказательством истины его слов, засвидетельствованной уже самой историей. Спустя несколько десятилетий, освобожденная от гнета коммунизма, РусскаяЦерковьвосстала из пепла как единственный непогрешимый свидетель истины Православия в России, сохранивший верность Своему Основополагателю – Христу. За семьдесят лет атеистической власти«врата ада не одолелиее»(см.Мф.16:18).'
        cn: 索夫罗尼长老，如同他的神圣教父及导师阿索斯山圣西卢安隐士一样，认为那遭受迫害的俄罗斯正教会，以其为信仰所受的苦难，向整个基督徒世界展现了殉道壮举的典范。在革命后的那些年里，长老以其灵性洞察力，默观着那场信奉基督上帝与不信的普世之战，他感受到最激烈的争斗正在俄罗斯进行。因此，他为这个国家的信徒所献的祈祷，格外炽热。然而，在阿索斯山圣庞泰莱蒙修道院——索夫罗尼神父开始其修道生涯的地方——对俄罗斯宗主教教会的态度却远非有利。阿索斯山长老们，在俄罗斯正教会的某些圣统（位）者和司祭身上，看到了基督的「背叛者」，他们伪善地与无神论政权合作。长老当时在致D.巴尔福的信中写道：「……阿索斯山长老们对都主教谢尔盖持不利态度……我并未隐藏我对俄罗斯宗主教教会的倾向，因此也遭受了某种程度的迫害」[194]。长老回忆说，有一次他被召集到修士会议上，被要求放弃他对俄罗斯教会的信念。他默默地听着他们的指责，并向上帝祈祷，恳求上帝赐予明智和合适的话语。某一刻，他听到心里有个声音说：「好了……现在可以说了！」于是索夫罗尼神父开始发言。他的话语——简单朴实，却源自他从上主所领受的经验——阐明了真理，如同一个不容进一步讨论的明显事实。在此事件之后，修道院对俄罗斯教会的态度有所转变。如今，在第三个千年之初，我们面对着他话语真实性的可见证据，这证据已由历史本身所证实。几十年后，从共产主义的压迫中解放出来的俄罗斯教会，如同唯一无误地见证俄罗斯正教真理的教会，从灰烬中崛起，她忠于自己的奠基者——基督。在七十年无神论统治之下，「阴间的门不能胜过她」(马太福音 16:18)。
    - type: paragraph
      text:
        ru: 'В годы Второй мировой войны, будучи уже в пустыне, часто целые ночи он молился за все народы, «как в некоем безумии»: это был внутренний крик к Богу о мире всего мира. Однако по-прежнему гонимые в России занимали первое место в его сознании. Молитва о них была в начале всех его молитв, и в средине, и в конце. Эта молитва навсегда связала старца невидимой духовной нитью с судьбой Русской Церкви.'
        cn: 在第二次世界大战期间，他那时已身在旷野，常常整夜为万民祈祷，「如同某种痴狂」：这是他向着上帝发出内心的呼喊，为着普世的和平。然而，在俄罗斯受迫害的人们，依然在他意识中占据首位。为他们祈祷，是他所有祈祷的开端、中部和结尾。这祷告将这位长老与俄罗斯教会的命运，以一条无形的属灵丝线永远地系在了一起。
    - type: paragraph
      text:
        ru: 'По приезде во Францию после войны старец естественно подал прошение о принятии его в клир Экзархата Русской Церкви. Старцу было чуждо сознание тех эмигрантов, которые разорвали литургическое общение с Патриаршей Церковью в силу своей оппозиции современному политическому положению вещей в России, считая борьбу с советскими властями самым существенным и самым важным моментом их жизни. В те годы принадлежать к юрисдикции Московской Патриархии во Франции, да и вообще на Западе, было связано с большими трудностями. Все посещавшие Русский храм Московской Патриархии считались «агентами Сталина» и неизбежно подвергались моральным притеснениям. За свою приверженность Русской Патриаршей Церкви старец вынужден был уйти и из Св. Сергиевского Института в Париже. Однако эти испытания старец переживал с благодарностью к Богу: в них он видел «некую норму соучастия» в страданиях русского православного народа. Старец говорил: «Церковьв России – это Церковь во аде». Его сильно влекло быть именно с ними, «во аде», вместе с ними и молиться. В 1958 году отец Софроний по официальному приглашению Московской Патриархии поехал в Россию с тайным намерением – остаться в Троице-Сергиевой Лавре и разделить судьбу страждущей Церкви. Когда он был на приеме у Святейшего Патриарха Алексия I и сообщил о своем желании, Святейший ответил ему: «Отец Софроний, придите завтра, и я дам вам ответ». На следующий день Патриарх сказал: «Отец Софроний, я не все могу». Старец вынужден был вернуться на Запад, однако живое соучастие в молитве со страждущим народом глубоко запечатлелось в его сознании. Старца потряс невероятный контраст, который представляла тогда жизнь в Советской России. С одной стороны – глубоко верующий народ: люди страдают от видения неверия прочих и плачут о тех, кто отказывается видеть столь явное, «очевидное» Бытие и присутствие Бога, переживая состояние неверных, как самое великое несчастье. С другой – неверующие, которые стыдятся, что среди них есть еще так много «предрассудков», и которые делают все, чтобы избавить «передовую» страну от этих пережитков старого «невежества».'
        cn: '战后抵达法国后，长老自然地递交了申请，请求被接纳进入俄罗斯教会驻外总主教区的圣职班。长老不认同那些移民的思想意识，他们因反对俄罗斯当代的政治局势而与宗主教教会断绝了礼仪共融，认为与苏维埃政权的斗争是他们生命中最实质、最重要的时刻。那些年，在法国，乃至整个西方，属于莫斯科宗主教区的管辖都伴随着巨大的困难。所有拜访莫斯科宗主教区俄国教堂的人都被视为「斯大林的特工」，并且不可避免地遭受道德上的压迫。由于他对俄罗斯宗主教教会的忠诚，长老甚至被迫离开了巴黎的圣谢尔盖学院。然而，长老带着对上帝的感恩之心，经历了这些考验：在其中，他看到了对俄罗斯东正教人民苦难「某种程度上的共同承受」。长老说：「俄罗斯的教会，是处于阴间的教会。」他强烈地渴望与他们同在，「处于阴间」，并与他们一同祷告。


          1958年，索夫罗尼神父应莫斯科宗主教区的正式邀请前往俄罗斯，怀着一个秘密的意图——留在圣三一谢尔盖大修道院，并分担受苦教会的命运。当他觐见至圣阿列克谢一世宗主教并告知了他的愿望时，至圣宗主教回答他说：「索夫罗尼神父，您明天再来，我给您答复。」第二天，宗主教说：「索夫罗尼神父，我并非无所不能。」长老被迫返回西方，然而，他与受苦人民在祷告中的活生生的共同承受深深地烙印在他的意识中。长老被当时苏维埃俄罗斯生活中呈现出的巨大反差所震惊。一方面是：虔诚的信徒群体，人们因看到他人的不信而痛苦，并为那些拒绝看到如此明显，「显而易见」的上帝的存在和临在之人哭泣，体验到不信者的状态是最大的不幸。另一方面是：不信者，他们羞于承认在他们当中仍有如此多的「迷信」，并且竭尽所能地将这个「先进」的国家从这些旧「无知」的残余中解救出来。'
    - type: paragraph
      text:
        ru: 'Особенно старцу запомнился один случай в храме Московской Духовной Академии, где он служил Литургию. В конце службы народ прикладывался ко кресту. Многие плакали. Но одна пожилая женщина плакала хотя и тихо, но как-то особо – с надрывом больного сердца. У старца от сострадания заболела душа, и он почувствовал, как надорвалось его сердце. Он взял крест в левую руку, правою удержал голову плачущей женщины и тихо спросил ее на ухо:'
        cn: 长者特别记住了在莫斯科神学院圣堂里的一件事，那时他正在那里举行事奉圣礼。事奉圣礼结束时，人们亲吻十字架。许多人哭了。然而，一位年迈的妇人虽是静静地哭泣，却以一种特别的方式——带着一颗病痛之心那种撕心裂肺的悲痛。怜悯之情令长老心灵为之痛苦，他亦感到自己的心如被撕裂。他用左手握着十字架，用右手托住那哭泣妇人的头，轻轻地在她耳边问道：
    - type: paragraph
      text:
        ru: – Какое у Вас горе?
        cn: – 您有什么苦楚吗？
    - type: paragraph
      text:
        ru: '– У меня сын неверующий, – ответила она и отошла с еще большим плачем. Старец остался пораженным глубиною ее страдания: оно было не меньшим, чем страдание матери, потерявшей единственного сына.'
        cn: ——「我的儿子不信主，」她回答道，然后带着更大的哭泣离开了。长老对她痛苦的深度感到震惊：这痛苦不亚于一位失去了独生子的母亲所承受的痛苦。
    - type: paragraph
      text:
        ru: 'После развала коммунистической системы началось духовное возрождение русского народа. При этом возникло немало новых церковных и внецерковных движений. В эти нелегкие годы, укрепленный внутренним свидетельством о правде Русской Церкви, старец призывал ее чад неколебимо держаться ее спасительного омофора. Некто из русских духовников поделился со старцем Софронием своими сомнениями, вызванными некоторыми явлениями в Русской Церкви. Старец в ответ написал: «...Умоляю Вашу Святыню послушать мой голос, грешного человека: держитесь всеми силами только Патриаршей Церкви. Держитесь даже до «исповедничества» (чтобы не сказать «мученичества», то есть даже до смерти). Спасение только в Ней. Все другие движения, как бы они ни были благочестивыми по внешнему их явлению, – западня вражия. Через них придет только раскол, ненависть, гибель общая.'
        cn: 共产主义体系崩溃之后，俄罗斯人民开始了属灵的复兴。与此同时，出现了不少新兴的教会内部与教会之外的运动。在这些艰难的岁月里，被俄罗斯教会真理的内在见证所坚固，长老呼吁她的儿女们坚定不移地持守她那救赎性的主教披肩（omophoron）的荫庇。有位俄罗斯的属灵指导者因俄罗斯教会中的一些现象而产生了疑虑，并与索夫罗尼长老分享。长老回复写道：「……我恳求您的圣德倾听我这罪人的声音：务必竭尽全力只持守宗主教教会。甚至要持守到『见证者身份』（不言『殉道者身份』），也就是说，甚至到死亡。救赎只在其中。所有其他的运动，无论它们外表上显得多么虔诚，都属于仇敌的罗网。借着它们只会带来分裂、仇恨和普遍的毁灭。」
    - type: paragraph
      text:
        ru: Пишу Вам сие с великим сознанием моей ответственности пред Богом и Церковью, искупленной драгоценной Кровию Воплощенного Сына Божия.
        cn: 我向您写下此信，怀着我对上帝以及对被道成肉身的上帝之子以宝血所救赎的教会所承担责任的深切认识。
    - type: paragraph
      text:
        ru: Какими бы ни были неизбежные недостатки – Она, и только Она найдет Свой верный путь. Так говорил в свое времяИоанн Златоуст; так говорил прп.Серафим Саровский. Так мыслят все подлинно боящиеся погрешить подвижники всех родов»[195].
        cn: 无论有何不可避免的缺陷——她，且唯有她能找到自己的正道。圣约翰金口曾如此说；圣塞拉芬·萨罗夫斯基长老也曾如此说。所有真正敬畏犯错的各类别苦修者都如此认为》[195]。
    - type: paragraph
      text:
        ru: Иеромонах Николай Сахаров
        cn: 修士司祭 尼古拉·萨哈罗夫
  - type: heading2
    text:
      ru: МОЛИТВА О ЕДИНСТВЕ[196]
      cn: 为合一的祷告[196]
    children:
    - type: paragraph
      text:
        ru: 'Господи Иисусе Христе, Агнче Божий, вземляй грех мира, восходом Твоим на Голгофскую Гору искупил еси ны от клятвы законныя и возставил еси Твой падший образ, на Кресте пречистеи руце Твои прострый, да чада Божия расточенная собереши во едино, и низпосланием пресвятаго Духа в соединение вся призвавый, Ты убо, Сый Отчее сияние; перед исходом Своим на сие великое мироискупительное священнодействие, молился еси Отцу Твоему, да будем вси едино, якоже Ты един еси со Отцем и Духом Святым, даждь убо нам благодать и мудрость исполнити сию заповедь на всяк день, и укрепи нас на подвиг тоя любве, юже заповедал еси нам, рекий: да любите друг друга, якоже возлюбих вы. Духом Твоим Святым даждь нам силу смирятися друг перед другом, поминая, яко аще кто больше любит, той и больше смиряется; научи нас молитися друг за друга, нести тяготы друг друга в терпении, и объедини нас союзом любве неразрушимыя во едино стадо послушных овец окрест возлюбленнаго отца нашего игумена, даруя нам и зрети в коемждо брате и сестре нашей образ Твоея неизреченныя славы и не забыти, яко брат наш есть наша жизнь.'
        cn: 主耶稣基督啊，上帝的羔羊，除去世人罪孽的祢，祢登上髑髅地，将我们从律法的咒诅中救赎出来，并复兴了祢堕落的形象；祢在十字架上伸出祢至洁的双手，为要将那分散的上帝的儿女召聚归一，并藉着圣灵的降临召集万有归于合一。祢，作为父的荣光；在祢前往这伟大的救世圣祭之前，祢曾向父祈祷，愿我们都合而为一，如同祢与父和圣灵合而为一一样。求祢赐予我们恩典与智慧，使我们每日都能遵行此诫命，并加固我们，使我们能为那祢所吩咐的爱而奋斗，正如祢所说：「你们要彼此相爱，正如我爱你们一样。」藉着祢的圣灵，赐予我们力量彼此谦卑，谨记：若有人爱得更多，他便更谦卑；教导我们彼此代祷，耐心背负彼此的重担，并以不可摧毁的爱之联盟将我们联合为一群顺服的羊，环绕着我们所爱的修道院长，赐予我们，使我们能在每位弟兄姐妹身上看到祢不可言喻之荣耀的形象，并且不要忘记，我们的弟兄是我们的生命。
    - type: paragraph
      text:
        ru: Ей, Господи, собравый нас от конец земли благоволением Твоим, сотвори нас быти воистину во едину семью, живущую единым сердцем, единей волей, единей любовию, яко един человек, по предвечному совету Твоему об Адаме первороднем. Утверди, защити и покрый место святое сие, еже насади Десница Твоя, и покрый е покровом Пречистыя Твоея Матере, честнаго Крестителя Твоего Иоанна, преподобнаго отца нашего Силуана, благословляяй и заступаяй коегождо зде живущих(имена), сохраняя же нас всех от тлетворных помыслов, от неподобающих слов или движений сердечных, могущих разрушите священное дело нашего служения, яко да созиждется обитель сия на камени евангельских Твоих заповедей местом исцеления, освящения и спасения, ради нас самих и ради всех притекающих семо, труждающихся и обремененных братьев и сестер наших, да обрящем вси покой в Тебе, кротком и смиренном Царе нашем, ныне и присно и во веки веков.
        cn: 吁，上主，祢以圣意将我们从地极召集，使我们真正成为一家人，同心、同德、同爱，如同一个人，依照祢关于原初亚当的永恒旨意。巩固、保护并覆庇这圣地，这祢的右手所栽种之地，并以祢至洁之圣母、祢尊贵的施洗者约翰、我们可敬的圣西拉（Siluan）之覆庇来荫庇它，祝福并代祷这里居住的每一位（姓名），保守我们所有人脱离腐朽的思想、不当的言语或心之意念，这些都可能破坏我们侍奉的神圣工作，使这修道院得以建立在祢福音诫命的磐石上，成为医治、圣化和拯救之地，为了我们自己，也为了所有来到此地、劳苦重担的弟兄姊妹，使我们所有人都能在祢，我们温柔谦卑的君王里，寻得安息，从今时直到永远，世世代代。
    - type: paragraph
      text:
        ru: Аминь.
        cn: 阿们。
    - type: heading4
      text:
        ru: notes
        cn: 笔记
      children: []
