  '[88]':
    ru: 'Отец Софроний использует философскую терминологию из диалектики онтологии. «Бывание» являет собой диалектический синтез двух понятий: «бытия» как тезиса и «небытия» как антитезиса.'
    cn: 索夫罗尼神父使用来自本体论辩证法的哲学术语。「生成」构成两个概念的辩证综合：「存有」作为正题，和「非存有」作为反题。
