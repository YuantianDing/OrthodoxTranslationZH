  '[108]':
    ru: Имеется в виду, что для Моисея Лицо (греч. Πρόσωπον τοῦ Θεοῦ) Бога осталось тайной (Исх.33:23), почему и был обетован Израилю «инойПророк»как восполнение Откровения (Втор.18:15–19).
    cn: 这意味着，对摩西而言，上帝的圣容（希腊语：Πρόσωπον τοῦ Θεοῦ）仍是奥秘（出埃及记 33:23），这也是为何以色列蒙应许得着「另一位先知」，以作为启示的成全（申命记 18:15-19）。
