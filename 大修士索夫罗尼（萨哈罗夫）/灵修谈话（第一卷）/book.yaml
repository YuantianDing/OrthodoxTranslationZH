  - type: paragraph
    text:
      ru: Книга представляет собой сборник бесед архимандритаСофрония Сахарова(1896–1993) – выдающегося духовного писателя-подвижника нашего времени, которые он проводил с братией монастыря, им построенного. В них затрагиваются вопросы православной аскетической культуры и богопознания, актуальные как для монахов, так и для всякого православного христианина.
      cn: 这本书是现代一位杰出的灵性作家兼苦行者——首席司祭索夫罗尼·萨哈罗夫（1896-1993）——与他所创建修道院的修士们所进行的一系列讲论集。这些讲论中探讨了东正教的苦修文化和识主等问题，这些问题无论是对修士还是对每一位东正教基督徒都具有现实意义。
  - type: paragraph
    text:
      ru: Предисловие
      cn: 序言
  - type: paragraph
    text:
      ru: «Поминайте наставников ваших, которые проповедовали вам слово Божие, и, взирая на кончину их жизни, подражайте вере их» (Евр.13:7)
      cn: 「记念你们的导师，他们曾向你们宣讲上帝的圣言；思想他们一生的结局，并效法他们的信心。」（希伯来书 13:7）
  - type: paragraph
    text:
      ru: АрхимандритСофроний Сахаров(1896–1993) – ныне один из наиболее известных и читаемых писателей-аскетов прошлого столетия. Его книги «ПреподобныйСилуан Афонский», «О молитве» и другие уже прочно вошли в сокровищницу православного предания.
      cn: 大司祭索夫罗尼·萨哈罗夫（1896–1993）如今是上个世纪最著名、阅读最广泛的灵修作家之一。他的著作《阿丰山的圣西卢安》、《论祷告》等，已然牢固地载入东正教的传承宝库中。
  - type: paragraph
    text:
      ru: В настоящем издании предлагаются беседы старца Софрония, которые он проводил с братией и паломниками Свято-Иоанно-Предтеченского монастыря с 1989 по 1993 год. В них отражен духовный опыт старца, который он стяжал более чем за полвека монашеского подвига и который он стремился передать своим молодым братьям-монахам.
      cn: 本版收录了索夫罗尼长老在1989年至1993年间，于圣施洗约翰修道院与修士们和朝圣者们所进行的谈话。这些谈话反映了长老通过逾半个世纪的修道功行所积累的灵性经验，以及他力求传授给年轻修士弟兄们的教诲。
  - type: paragraph
    text:
      ru: 'Отец Софроний начал свой жизненный путь в Москве. С детских лет он посвятил себя живописи. В 1922 году будущий подвижник выехал на Запад, чтобы продолжить занятие искусством вдали от смуты послереволюционных лет. Его молодые годы прошли в напряженном внутреннем поиске: как человек может достигнуть Вечности? В Париже ему было дано пережить богопосещение, которое затем перевернуло всю его жизнь: оставив живопись, он в 1925 году ушел в монахи на Святую Гору Афон. Шесть лет спустя он встретился с прп. старцем Силуаном. Эта встреча стала историческим событием, повлиявшим на всю нашу эпоху. Через прп. Силуана христианский мир получил богооткровенное слово спасения: «Держи ум твой во аде и не отчаивайся»[1]. Учение и опыт преподобного стали духовной основой в становлении самого отца Софрония.'
      cn: 索夫罗尼长老在莫斯科开启了他的生命旅程。自幼他便投身于绘画艺术。1922年，这位未来的苦行修士前往西方，以继续其艺术追求，远离后革命时代的动乱。他的青年时代在紧张的内在寻求中度过：人如何能抵达永恒？在巴黎，他经历了一次神圣的造访，这次经历彻底改变了他的一生：于是他放弃了绘画，于1925年成为修士，登上阿索斯圣山。六年之后，他遇到了圣西卢安长老。这次相遇成为了一个历史性事件，影响了我们整个时代。借由圣西卢安长老，基督徒世界领受了蒙上帝启示的救赎之言：「将你的心置于地狱，却不要绝望」[1]。这位圣者的教导和经验成为了索夫罗尼长老自身形成过程中的属灵基础。
  - type: paragraph
    text:
      ru: 'От своего великого наставника отец Софроний унаследовал и великое учение о том, как рождается духовное слово. Однажды на Афоне зашел разговор о том, как говорят совершенные. Старец Силуан сказал: «Они от себя ничего не говорят... Говорят лишь то, что дает им Дух»[2]. Следуя сей древней православной традиции, отец Софроний со священным страхом относился к каждому своему слову, будь то произнесенному или писанному. Ибо Сам Господь открыл для нас всё превосходящее значение каждого произнесенного слова:«за всякое праздное слово, какое скажут люди, дадут они ответ в день суда»(Мф.12:36). Он дал нам«пример»(ср.:Ин.13:15): Он никогда не говорил праздных слов. Более того, Сын, будучи Словом-Логосом Отца, от Себяничегоне говорил.«Слова, которые говорю Я вам, говорю не от Себя»(Ин.14:10)... но только«всё, что слышал от Отца Моего»(Ин.15:15). Чрез это самоумаление Своего «Я» Иисус Христос и явил Себя как«сияние славы и образ ипостаси»Отца (Евр.1:3) – любовь никогда«не ищет своего»(1Кор.13:5).'
      cn: 索夫罗尼长老从他伟大的导师那里，继承了关于属灵之言如何诞生的伟大教导。有一次，在阿索斯山，人们谈论到圣徒（完全者）是如何说话的。圣西卢安长老说：「他们从自己什么也不说……他们只说圣灵所赐予的」[2]。遵循这一古老的东正教传统，索夫罗尼长老怀着神圣的敬畏对待他说的每一个字，无论是口说的还是笔写的。因为上主亲为我们揭示了每一个口说之言的超凡意义：「凡人所说的一切闲话，在审判的日子，他们必要供出情由。」（马太福音 12:36）祂为我们立了「榜样」（参：约翰福音 13:15）：祂从未说过一句闲话。不仅如此，圣子，作为圣父的道（逻格斯），从自己什么也不说。「我所对你们说的话，不是凭着自己说的」（约翰福音 14:10）……而只是「从我父所听见的一切」（约翰福音 15:15）。借着祂「我」的这种自我谦抑，耶稣基督就显明了自己是圣父「荣耀的光辉，是祂本体的真像」（希伯来书 1:3）——爱永「不求自己的益处」（哥林多前书 13:5）。
  - type: paragraph
    text:
      ru: 'Ответственность за каждое свое слово отец Софроний ощутил еще глубже, став духовником на Афоне при монастыре Святого Павла. «Духовнику надлежит чувствовать ритм внутреннего мира всех и каждого из обращающихся к нему. С этой целью он молится, чтобы Дух Божий руководил им, давая нужное для каждого слово»[3]. Старец позднее вспоминал: «Сознавая себя далеко стоящим от должного совершенства, подолгу и с болью в сердце умолял я Господа не попустить мне ошибаться, удержать меня в путях действительной Его воли, внушать мне слова, полезные братьям. И в самый час беседы с человеком я старался держать «слух» ума моего на сердце, чтобы улавливать Божию мысль и часто даже слова, которые нужно сказать»[4]. Монахи любили его слово и приходили к нему за духовным советом и поддержкой из многих монастырей. Как-то раз он сказал: «Если человек прошел восемь часов, чтобы услышать слово, как возможно быть с ним небрежным?» Он ко всякому приходящему относился с величайшим вниманием и заботой, и ему платили за это глубокой благодарностью. Часто при многочисленной братии в афонских монастырях первостепенной заботой монастырского начальства становилась практическая организация жизни. Духовным наставникам порой было трудно уделить достаточно внимания каждому. Словесное окормление братии часто ограничивалось чтением в трапезной, исповедью и богослужением. Беседы на духовные темы велись между братьями редко, и то лишь между очень немногими. Поэтому старец по опыту знал, как необходимо духовное слово для молодых монахов и как важно учить их борьбе со страстями.'
      cn: 索夫罗尼长老在阿索斯山圣保罗修道院担任属灵导师后，对他所说的每一个字的责任感受得更加深刻。「属灵导师应当感受到每一个来到他面前之人的内在世界的韵律。为此，他祈祷愿上帝的圣灵引领他，赐予每个人所需的话语。」[3] 这位长老后来回忆道：「我意识到自己离应有的完美相去甚远，我长久地、心怀痛苦地恳求上主不要允许我犯错，保守我行走在祂真实的旨意中，启示我于弟兄们有益的话语。就在与人交谈的那一刻，我努力将我的『心耳』贴于心上，以便领悟上帝的思想，甚至常常是那些需要说的话语。」[4] 众修士喜爱他的话语，从许多修道院前来寻求他的属灵建议和支持。有一次，他说：「如果一个人走了八个小时，只为听到一句指引，又怎能对他粗心大意呢？」 他对待每一个前来的人都怀着极大的关注和关怀，而人们也对此报以深深的感谢。在阿索斯山修道院众修士众多的情况下，修道院管理层的首要关切常常是实际生活的组织安排。属灵导师们有时难以给予每个人足够的关注。对修士们的话语牧养常常仅限于斋堂里的阅读、告解和神圣礼仪。属灵主题的交谈在修士之间很少进行，而且仅限于极少数人之间。因此，这位长老根据经验深知属灵话语对年轻修士是何等必要，以及教导他们与情欲搏斗是何等重要。
  - type: paragraph
    text:
      ru: 'Когда отец Софроний вернулся в Западную Европу, Бог вверил ему словесное служение ради спасения многих людей. Однако он не чувствовал более той свободы в слове. Позднее старец написал: «Психология монахов, их терпение и выдержка настолько превосходили всё и всех, что я встретил в Европе, что я просто не находил ни слов, ни внешних форм общения. То, что монахи воспринимают с благодарностью, в Европе сокрушало людей»[5].'
      cn: 当索夫罗尼神父回到西欧时，上帝将言语事奉托付给他，为了拯救许多人。然而，他不再感到在言语上的那种自由。后来，这位长老写道：「修道士们的心理，他们的忍耐和坚韧，远超我在欧洲所遇到的一切和所有人，以至于我简直找不到言语，也找不到外在的交流形式。修道士们带着感恩之心所接受的，在欧洲却压垮了人们。」[5]
  - type: paragraph
    text:
      ru: 'По молитве старец знал духовные нужды людей и без того, чтобы ему говорили о них. Бывало и так: старец говорил с кем-либо, но по молитве слово было обращено не прямо к собеседнику, а косвенно к некоторым из слушающих. Так, некогда его посетила женщина из Румынии. Ей случилось присутствовать при разговоре отца Софрония с другими за трапезой. И вдруг она поняла, что всё, что он говорит, и есть ответ на все самые сокровенные ее вопросы. По окончании трапезы, пораженная, она обратилась к нему, и, прежде чем она продолжила, старец с любовью произнес: «Have I not answered all your questions?»[6]'
      cn: 借着祷告，长老便能知晓人们属灵的需要，甚至无需他们告知。有时也会如此：长老与人交谈时，借着祷告，他所说的话语并非直接对谈话者说的，而是间接对着一些听众说的。例如，有一次，一位来自罗马尼亚的女士拜访了他。她碰巧在索夫罗尼神父与他人共进餐食时的谈话中在场。她忽然明白，他所说的一切，正是她所有最深藏的问题的答案。餐食结束后，深受触动地她转向他，而在她继续说下去之前，长老慈爱地说道：「我岂不是已经回答了你所有的问题吗？」[6]
  - type: paragraph
    text:
      ru: 'Вокруг него стала собираться монашеская община еще со времени его служения во Франции в Сент-Женевьев-де-Буа. Старец много времени уделял беседам с братьями. Поначалу это были отдельные наставления братии, продиктованные обстоятельствами жизни, той или иной нуждой в конкретной ситуации. Старец со страхом осознавал силу слова Божия – оно«острее всякого меча обоюдоострого: оно проникает до разделения души и духа, составов и мозгов, и судит помышления и намерения сердечные»(Евр.4:12). Некоторые из братии по немощи были не в силах понести таковой «жестокости» (см.Ин.6:60) слова Божьего, ибо, как правило, оно, слово, не по человеку и превышает меру его падшей натуры. Однако старец по глубокой любви к каждому из братии желал спасения всех и ради этого прибегал к такому приему: он мог говорить строго наставления кому-либо из «сильных», тогда как слово по сути было обращено к кому-нибудь из «слабых», присутствовавших при разговоре.'
      cn: 早在他于法国圣女日内瓦-德布瓦事奉期间，修道团体就开始围绕他聚集。长老花费了大量时间与修士们交谈。起初，这些是对修士们个别的训示，是由生活环境或由特定处境中的某种需要所促成的。长老带着敬畏之心，意识到上帝之道的力量——它「比一切两刃的剑更锋利，甚至能刺入灵魂与灵、关节与骨髓的分界，并能辨明心中的思想和意念」(希伯来书 4:12)。有些修士因着软弱，无力承受上帝之道如此的「严厉」(参约翰福音 6:60)，因为通常，这道是不合乎人的，并且超越了人堕落本性的限度。然而，长老因着对每位修士深切的爱，渴望所有人的救赎，为此他采用了一种方法：他可能会对那些「刚强者」中的某一位严厉地训示，而实际上，这些话语是针对在场听谈话的「软弱者」中的某一位。
  - type: paragraph
    text:
      ru: 'Иногда в трапезной, во время чтения духовных писаний, старец обращал внимание братии на ту или иную мысль у святых отцов. Остановив чтение, он разъяснял прочитанное. В моменты особого вдохновения беседа продолжалась часами, вплоть до следующей трапезы. Подобное нередко случалось как в Сент-Женевьев-де-Буа, так и в Великобритании, куда община переехала в 1959 году. Так образовался монастырь св. Иоанна Предтечи в английском графстве Эссекс. В последние годы жизни старца беседы приняли более регулярный характер: братия собиралась вbureau– кабинете, где старец работал и встречался с людьми. Когда же число насельников возросло, беседы стали проводиться в монастырском храме в честь прп.Силуана Афонского. Атмосфера храма была наиболее подходящей для его бесед. Одному священнику, паломнику монастыря, старец предложил служить Литургию. Причастившись, старец по окончании службы сказал ему: «Я был за Вашей Литургией, а Вы приходите на мою»[7]. Имелась в виду беседа, которую отец Софроний проводил с братией в тот день. Эти слова – «литургия после Литургии» – наиболее верно отражают истинный характер бесед старца: произносимое им слово становилось тайноводителем благодати, неким продолжением литургического предстояния пред Лицом Господним. В этих беседах с особой силой ощущается, насколько тесно его догматическое видение было связано со всем ходом внутренней духовной жизни. Догмы Церкви имели реальное и непосредственное отношение к повседневности монастыря, к самым последним мелочам будничной жизни каждого монаха. В такой атмосфере через слово старца жизнь киновии освящалась и всякое малое действие приобретало значение космических измерений. Так, в жизни киновии старец видел прежде всего образ Божественного бытия – по подобию Святой Троицы[8]. «Там» взаимная любовь является содержанием жизни Каждой из Трех Божественных Ипостасей. Посему любовь и единство братии стали главенствующей темой его бесед: «Так в нашей монашеской жизни если мы не будем учиться любви, то я не знаю, какое оправдание можно было бы высказать в пользу монашества»[9].'
      cn: 有时在斋堂里，当阅读属灵著作时，长老会提请弟兄们注意圣教父的某个思想。他停止阅读，阐明所读的内容。在特别启迪的时刻，交谈会持续数小时，直到下一餐斋饭。这样的情形在圣女热纳维耶夫-德-布瓦和英国都屡见不鲜，该团体于1959年迁居英国。英国埃塞克斯郡的圣施洗者约翰修道院便是由此建立。在长老晚年时期，这些交谈变得更加规律：弟兄们会聚集在bureau——长老工作和接见众人的书房里。当住众人数增多时，交谈便开始在修道院里为纪念 прп. 阿索斯山圣西卢安而建的圣堂中举行。圣堂的氛围最适合他的交谈。长老曾邀请一位来修道院朝圣的司祭主持圣礼仪。领受圣体圣血后，长老在礼仪结束后对他说：「我已参加了您的圣礼仪，而您也来参加我的吧」[7]。这指的是索夫罗尼长老当天与弟兄们进行的交谈。这些话语——「圣礼仪后的圣礼仪」——最真实地反映了长老交谈的本质：他所宣讲的道成为了恩典的引导师，是某种程度上在上主圣颜前礼仪性站立的延续。在这些交谈中，人们特别强烈地感受到，他的教义性洞见与整个内在属灵生活的进程是多么紧密地相连。教会的教义与修道院的日常事务、与每一位修士日常生活中最微小的细节，都具有真实而直接的关系。在这样的氛围中，借着长老的话语，契诺维亚的生活蒙受祝圣，每一个微小的举动都获得了宇宙般的维度。因此，长老在契诺维亚的生活中，首先看到的是神圣存有的形象——依照圣三一的样式[8]。在「那里」，相互之爱构成了三个神圣位格中每一个的生命内涵。因此，弟兄们的爱与合一成为他交谈的首要主题：「所以，在我们的修道生活中，如果我们不去学习爱，那我不知道还能提出何种辩护来支持修道生活」[9]。
  - type: paragraph
    text:
      ru: 'Такое догматическое видение не было неким интеллектуальным вымыслом. Из бесед очевидно, что богословие уже стало егосостоянием. Это состояние жаждал старец передать, сообщить другим: «Я молюсь Богу о том, чтобы у вас утвердилось именно это состояние. И это есть наша «гносеология»[10]в Божественном пути. Это есть путь к истинному познанию истинного Бога – богословие как состояние нашего духа, живущего непрестанно в Боге Духе Святом»[11].'
      cn: 这种教义性的异象并非某种智识上的虚构。从谈话中显而易见，神学已成为他的生命状态。长老渴望将这种状态传达、告知他人：「我向 上帝 祷告，愿这种状态能真正在你们心中确立。这正是我们在神圣道路上的『认识论』[10]。这是通往真正认识真 上帝 的道路——神学作为我们灵魂的状态，持续不断地活在 上帝 圣灵 之中。」[11]
  - type: paragraph
    text:
      ru: 'Предлагаемые беседы особо важны тем, что они охватывают период последних четырех лет жизни старца. На пороге смерти Бог дал ему дерзновение говорить о себе то, что до того времени оставалось тайной его души пред Богом. В те годы отец Софроний написал: «Приближаясь к исходу моему в старческом возрасте, подавленный день и нощь телесными немощами, я становлюсь менее уязвимым людскими о мне суждениями. В силу этого я решился на еще большее обнаружение, теперь уже пред многими, того, что ревниво хранил от посторонних глаз доселе»[12]. Сие вовсе не было плодом некоего дешевого самолюбования или страстной обращенности на самого себя. Старец прекрасно знал, насколько быстро благодать Божия оставляет человека за подобные движения души. В нём горело желание видеть своих братьев, как и всех людей, причастниками тех же духовных дарований, которых сподобил его Бог: пред своим уходом он торопился передать им всё до конца. Поэтому слово старца, прошедшее через горнило покаяния, столь действенно исполняло всех присутствующих освящающей Божественной энергией – действенной силой, преображающей человеческие сердца.'
      cn: 这些讲道集尤其重要，因为它们涵盖了长老生命中最后四年的时期。临终之际，上帝赐予他坦然无惧，得以谈论那些在此之前在他灵魂深处，在上帝面前一直保守为秘密的事。那些年，索夫罗尼长老写道：「当我垂垂老矣，即将离世之时，日夜饱受肉体软弱的困扰，我变得不再那么容易被世人对我的论断所伤害。因此我决意在众人面前，进一步揭示那些我迄今为止严谨保守，不让旁人得见的事物」[12]。这绝非是某种廉价的自恋，或对自我的强烈专注的产物。长老深知，因着灵魂的此类动向，上帝的恩典会何等迅速地离开人。他心中燃着渴望，希望看到他的弟兄们，以及所有的人，都能领受上帝曾使他配得的那些相同的属灵恩赐：在他离世之前，他急于将一切完全传达给他们。因此，长老的话语，经过悔改的熔炉磨砺，如此有功效地充满所有在场者以圣化的神圣能量——一种转变人心的有功效力量。
  - type: paragraph
    text:
      ru: 'В прощальной беседе со Своими учениками Господь сказал им:«Вы уже очищены через слово, которое Я проповедал вам»(Ин.15:3). В предании Церкви нередки примеры, когда слово святых низводило благодать на слышавших, передавая их душам состояние святости. Достаточно вспомнить, как через слово«по молитве(Апостолов)поколебалось место, где были они собраны, и исполнились все Духа Святого»(Деян.4:31). Другие примеры: разговор Мотовилова с прп.Серафимом Саровским, когда Мотовилов вкусил сладость Духа Божественного и увидел святого во Свете Нетварном, или же встреча прп. Силуана с отцом Стратоником, когда во время беседы отец Стратоник пережил то состояние, о котором говорил прп. Силуан[13]. Подобное благодатное посещение пережил в 1932 году и Давид Бальфур, когда он говорил с отцом Софронием в библиотеке Св. Пантелеимоновского монастыря. Старец, проводивший дни свои в огненном плаче, в тот момент через простые слова беседы передал Бальфуру свое состояние. Бальфур пережил его как прикосновение бессмертного дыхания. Благоговейное чувство исполнило всю его душу, так что он не мог ничего говорить и даже боялся двигаться. Всё временное отпало и потеряло свой интерес. В этом безмолвном изумлении Бальфур провел около двадцати минут[14].'
      cn: 在祂与门徒的临别谈话中，上主对他们说：「你们因我所传给你们的道，已经洁净了。」(约翰福音 15:3) 在教会的圣传中，这样的例子并不少见，即圣人的话语将恩典降给听者，并将圣洁的状态传达给他们的灵魂。只需回想，借着使徒们的祈祷，他们聚集的地方如何震动了，他们就都被圣灵充满。(使徒行传 4:31) 其他例子有：莫托维洛夫与圣塞拉芬·萨罗夫斯基长老的谈话，当时莫托维洛夫品尝到了神圣之灵的甘甜，并在非受造之光中看到了圣人；或者圣西卢安长老与司祭斯特拉托尼克的相遇，当时在谈话期间，司祭斯特拉托尼克经历了圣西卢安所谈论的那个状态[13]。类似的恩典临到，大卫·巴尔福也在1932年经历过，当时他在圣潘捷列伊蒙修道院的图书馆与索夫罗尼长老交谈。这位长老，他把自己的日子都活在炽热的哀哭中，在那一刻，通过简朴的谈话话语，将自己的状态传达给了巴尔福。巴尔福将其经历为不朽气息的触碰。敬虔之情充满了他的整个灵魂，以至于他无法言语，甚至不敢动弹。一切暂时的都脱落了，并失去了其吸引力。在这无言的惊奇中，巴尔福度过了约二十分钟[14]。
  - type: paragraph
    text:
      ru: 'Беседы старца с братией являлись проводником того благодатного состояния, в котором сам старец пребывал после многолетнего монашеского подвига: «Мы должны сосредоточить всё наше внимание только на том, чтобы не согрешить ни пред Богом, ни пред человеком, ни пред вещами, – говорил он. – И из этой жизни, простой, но сосредоточенной на этой заповеди, рождается состояние человека, когда он бытийно уже связывается с Богом»[15]. Трудно найти слова, чтобы выразить это состояние, которое превосходит всё земнородное. «Словом выразить мы не можем, – сказал он в одной из бесед, – мы должны «попасть» в это состояние. И мы «попадаем» в это состояние, если Сам Бог приходит и вселяется в нас – непостижимо великий и могущественный и непостижимо смиренный»[16].'
      cn: 长老与弟兄们的开示，是长老本人在多年修道苦修之后所处恩宠状态的媒介：「我们必须将我们所有的注意力，仅仅集中在不向上帝、不向人、也不向事物犯罪之上，」他说道，「而从这种简单却专注于这条诫命的生活中，便会诞生出一种人的状态，在此状态下，他本体上已然与上帝相连结。」[15] 难以用言语来表达这种超越一切属地之物的状态。「我们无法用言语来表达，」他在一次谈话中说道，「我们必须『进入』这种状态。如果上帝亲自降临并居于我们之中，我们便会『进入』了这种状态——祂是不可思议地伟大而全能，又不可思议地谦卑的。」[16]
  - type: paragraph
    text:
      ru: Ни какие-либо внешние структуры, ни устав, ни административное устроение, а именно слово, вверенное ему Богом через прп. Силуана, он положил в основание монастыря. Ибо«слово Господнеи есть то, чтопребывает вовек»(1Пет.1:25), даже когда«небо и земля прейдут»(Мк.13:31). Слово, данное от Бога, есть сильнейшее орудие в домостроительстве спасения. Вечнодействующая сила его предвозвещена нам через пророка Исаию:«слово Мое, которое исходит из уст Моих... не возвращается ко Мне тщетным, но исполняет то, что Мне угодно, и совершает то, для чего Я послал его»(Ис.55:11).
      cn: 无论是任何外部结构，无论是规章制度，无论是行政管理，而正是由上帝藉着圣西卢安长老所托付于他的圣言，他将其奠立为修道院的根基。因为「上主的话语是那永远长存的」（彼得一书 1:25），即使「天地都要过去」（马可福音 13:31）。上帝所赐予的圣言，是救赎的圣工中最强有力的工具。它那永远生效的大能，已藉着先知以赛亚向我们预先宣示：「我口所出的话语……必不徒然返回于我，却要成就我所喜悦的，并在我差它去的目的上必然亨通」（以赛亚书 55:11）。
  - type: paragraph
    text:
      ru: 'Господь свидетелям Своего слова заповедал:«...не заботьтесь наперед, что вам говорить, и не обдумывайте; но что дано будет вам в тот час, то и говорите, ибо не вы будете говорить, но Дух Святый»(Мк.13:11). Старец поэтому почти никогда не готовился к беседе: не составлял предварительных набросков, не штудировал богословских книг. Каждый раз он шел на встречу с братьями со страхом и верою, молитвенно предстоя умом пред Престолом Божиим, – в надежде, что Бог не презрит его молитв и«Святый Дух научит...ив тот час, что должно говорить»(Лк.12:12). Его приводили полубольного, полуслепого, согнутого старостью. В храме его уже ждала братия, иногда и гости-паломники – в атмосфере исключительной важности собрания во имя Христа. Начинал старец с молитвы, испрашивая у Бога подать ему слово душеспасительное для всех присутствующих. В молитвенном пении все призывали Того, «Иже везде Сый и вся исполняяй». Затем старец обычно обращался к Божией Матери с такими словами:'
      cn: 主曾吩咐祂话语的见证者说：「…不要预先忧虑你们要说什么，也不要思虑；但在那时刻赐给你们什么，就说什么，因为说话的不是你们，乃是圣灵」（马可福音 13:11）。因此，长老几乎从不为谈话做准备：不准备初步草稿，不钻研神学书籍。每一次，他都带着敬畏与信心去会见修士弟兄们，在祷告中，心灵站立在上帝的宝座前，——希望上帝不会轻视他的祷告，并且「圣灵必在那时刻教导你们当说的话」（路加福音 12:12）。他被人带来时，半病着，半盲着，因年老而佝偻着。在圣堂里，他的修士弟兄们已在那里等候他，有时还有朝圣者客人——弥漫着因基督之名聚会所带来的非凡庄重气氛。长老以祷告开始，恳求上帝赐给他能救赎灵魂的话语，给所有在场的人。在祷告歌唱中，众人呼求那一位「祢无所不在，充满万有」。随后，长老通常转向圣母，以这样的话语说：
  - type: paragraph
    text:
      ru: «Пресвятая Владычице Богородице, рождшая всех святых святейшее Слово, ныне даждь нам слово, благоугодное Господу».
      cn: 至圣女君圣母，祢诞生了超越众圣者的至圣圣言，今请赐予我们蒙上主悦纳的言语。
  - type: paragraph
    text:
      ru: 'Затем – к святым, покровителям монастыря:'
      cn: 接着——向修道院的主保圣徒们：
  - type: paragraph
    text:
      ru: «Святый великий Иоанне, Предтече Господень и друже Христа Бога, призри милостивно на ны, доверившие тебе жизнь нашу и спасение, и сохрани нас... от всякого бедствия духовного, да унаследуем и мы Царство Христа Бога нашего».
      cn: 「圣大约翰，主之前驱，和基督上帝之友啊，请祢慈悲垂顾我们这些将我们的生命和救赎托付给祢的人，并保全我们脱离一切属灵的灾祸，好使我们也能承受我们基督上帝的神国。」
  - type: paragraph
    text:
      ru: «Преподобный отче наш, Силуане святый, приими нас, чад своих, и умоли Бога, чтобы мы восприняли учение твое, которое есть учение Самого Бога Духа Святаго».
      cn: 我等可敬的父，圣西卢安，垂纳我等，祢的儿女，并恳求上帝，好使我等领受祢的训诲，这即是圣灵上帝祂自己的训诲。
  - type: paragraph
    text:
      ru: 'Потом была долгая пауза: старец собирался внутрь воедино всем своим существом и напряженно искал слово молитвою. Сердце старца, утонченное многолетним плачем и страданиями, как некий чувствительный радар, было способно уловить самые тонкие движения Духа, который«дышит, где хочет»(Ин.3:8). И как бы войдя в этот поток вечности, он начинал говорить, вдруг преображаясь и раскрываясь в царственном величии своего слова. Говорил он медленно, как бы из сердца. При этом старец держался всегда очень естественно и просто. Не было в нем ничего напыщенного, неистинного, чего-либо напоминающего оракула, произрекающего пророчества. Нет. Просто порыв горячей молитвы к Богу, через его слово, захватывал и присутствующих и возносил их сознание в тот мир, где божественные реальности созерцаются как очевидности.'
      cn: 之后是一段漫长的停顿：老者用他整个生命完全地收敛于内，并以祷告恳切地寻求言语。老者的心，被多年的哀哭与苦难所磨砺得精微，如同一个敏锐的雷达，能够捕捉到圣灵最微细的动向，祂「随意而吹」（约翰福音 3:8）。他仿佛进入了这永恒的洪流，开始说话，突然间在他的言语中焕然一新，并展现出君王般的宏伟。他说话缓慢，仿佛是发自内心深处。同时，老者始终保持着非常自然和朴素的姿态。他身上没有任何夸张做作、不真实、或任何让人联想到一个宣讲预言的神谕者之处。不。仅仅是一股向着上帝炽热祷告的冲动，借着他的言语，感染了在场的众人，并将他们的意识提升到那个世界，在那里，神圣的实相被视为毋庸置疑的明证。
  - type: paragraph
    text:
      ru: 'Сам он как-то признался братии в одной из бесед, когда не было гостей: «Я всё время пытался вам объяснить, как рождается слово Божие в сердце человека. Этот процесс не так прост и вместе с тем очень ясен и чист. Каким образом вместо нашего страстного голоса услышать голос Бога нашего в сердце нашем? При всем невыразимо великом задании, стоящем пред нами, наша жизнь все-таки остается очень простою во внешнем проявлении своем. Когда были беседы наши в присутствии гостей, то, хотя мое слово обращается к новопришедшим, я заметил, что странным образом молитва о слове включает их. И включить их – это значит: изменить содержание беседы. Так что когда мы одни, то я свободнее держусь, несмотря на неодинаковые реакции и состояния людей, присутствующих здесь. Однако и в данном случае мы не освобождаемся совсем и не достигаем единства слова, поскольку наша беседа не может касаться одного и того же уровня для всех нас, ибо все мы стоим на разных уровнях»[17].'
      cn: 他自己有一次在没有客人的时候，在一次交谈中向弟兄们坦言道：「我一直试图向你们解释，上帝的话语如何在人的心中诞生。这个过程并非那么简单，但与此同时却又非常清晰和纯洁。我们该如何舍弃我们情欲的声音，在我们心中聆听我们上帝的声音呢？尽管摆在我们面前的任务是如此浩瀚，无法言喻，但我们的生活在外在表现上仍然非常简单。当我们在客人面前交谈时，尽管我的话语是针对新来者的，我注意到，关于话语的祷告以一种奇特的方式将他们包含进来。而将他们包含进来，这意味着：改变了交谈的内容。所以，当我们独处时，我更自由地表达自己，尽管在座的人们反应和状态各不相同。然而，即便如此，我们也并未完全自由，也无法达到言语的合一，因为我们的交谈不可能对所有人都触及同一个层面，因为我们都处于不同的层次」[17]。
  - type: paragraph
    text:
      ru: 'Велика была жажда старца видеть своих воспитанников обладателями «всей полноты Божией» (см.Кол.2:9). Поэтому его всегда занимал вопрос: как передать сей внутренний опыт грядущим поколениям, можно ли «воспитать» в других дар слова? Так, особой надеждой его наполняли слова Ветхого Завета, где говорилось о «школах пророков» (см.1Цар.19:20;4Цар.2:3). Он говорил братии: «Нам необходимо всем развиться до того, чтобы слышать безошибочно голос Господа. Этот подвиг требует постоянного, днем и ночью, внутреннего внимания. И так жизнь, простая по внешности, будет постоянным общением с Богом»[18]. Он верил, что двери к самым высоким мерам совершенства не закрыты ни для кого – через глубокое покаяние, огонь которого пожирает всё нечистое в человеке, через постоянное пребывание умом в Боге Господь по Своей милости может прийти и совершить всё Сам.'
      cn: 老者多么渴望看到他的受教者拥有「上帝一切的丰盛」（参见歌罗西书 2:9）。因此，他一直在思考一个问题：如何将这种内在经验传承给后代，能否在他人身上「培养」出言语的恩赐？因此，旧约中提及「先知学校」的话语（参见撒母耳记上 19:20，列王纪下 2:3）让他充满了特别的希望。他对弟兄们说：「我们所有人都必须发展到能够毫无错误地听到上主声音的程度。这一苦修要求昼夜不停地保持内在的专注。这样一来，看似简单的生活，就会成为与上帝恒常的交通。」[18] 他相信，通往最高程度完美境界的大门，没有向任何人关闭——通过深刻的忏悔（其火焰能吞噬人里面的一切不洁），以及思想上恒常与上帝同在，上主凭着祂的仁慈，会亲自降临并成就一切。
  - type: paragraph
    text:
      ru: 'Слово старца имело особый «вкус». Как и всякое духовное слово, в Боге рожденное, оно обладало всё тем же качеством: человек интуитивно распознавал в нём Истину. Его невозможно подделать, подменив истину внешней эрудицией или маской благочестия. Человек слышит голос вечности сердцем, не путем логических доказательств, а через внутреннее свидетельство, не поддающееся никакому анализу. Пройдя умный подвиг – долгий, болезненный и многотрудный, – мыслью старец уже неотступно пребывал в Боге и безвидно созерцал Его величие и мудрость, вливаясь в поток Его вечной воли. Память о Боге освящала всякое его действие и слово, и уже невозможным было для старца не«любить Его всем сердцем и всем умом, и всею душею, и всею крепостью»(Мк.12:33).'
      cn: 长老的言语有着独特的「味道」。如同凡在上帝里所生发的属灵话语一般，它都具备着同样的特质：人能直觉地辨认出其中的真理。这是无法伪造的，无法以外在的博学或虔敬的伪装来替代真理。人用心聆听永恒的声音，不是凭借逻辑的证明，而是通过内在的见证，这是任何分析都无法触及的。经过了漫长、痛苦且充满劳苦的智性苦修，长老的心意便已坚定不移地常住在上帝里，并以无形的方式默观祂的伟大与智慧，融入祂永恒旨意的洪流之中。对上帝的忆念圣化了他的一切行为与言语，如此一来，长老便无法不「尽心、尽意、尽性、尽力爱祂了」（马可福音 12:33）。
  - type: paragraph
    text:
      ru: 'Древнее афонское предание заповедует молодым монахам жить мыслью: «Все старцы святы, но мой старец – святее». Нетрудно было держаться этого правила тем, кто был со старцем Софронием. Однако его простота и доступность скрывали от умного взора современников его подлинные измерения, постижение которых постепенно приходит только теперь, когда его нет с нами.'
      cn: 古老的阿索斯传统教导年轻的修士们，当怀抱这样的意念生活：「所有长老都是圣的，但我的长老更是圣的。」对于那些曾与索夫罗尼长老一同生活的人来说，持守这条准则并不难。然而，他的朴素与平易近人，却将他真实的维度隐匿于他同时代人的敏锐目光之外，对这些维度的领悟，只有在他已不在我们身边时，才逐渐显现。
  - type: paragraph
    text:
      ru: 'В личном экземпляре его последней книги «Видеть Бога как Он есть» уже после смерти нашли заботливо вложенную им записку, адресованную всем тем, кого так возлюбила его душа:'
      cn: 在他离世之后，人们在他自己那本名为《如其所是地观看上帝》的遗作中，发现了一张他亲手细心夹入的字条，是致予所有他灵魂所深爱之人的：
  - type: paragraph
    text:
      ru: Мне нелегко покидать Вас, но я питаю некоторую надежду, что чрез эту книгу, совместно с другими моими книгами, Вы можете видеть мое «глубокое» сердце и мою мысль, которые я пытался выразить чрез мое слово, рожденное в горячей молитве со слезами. Всякий раз, когда Вы пожелаете, Вы можете, читая, быть со мною в плане Духа, особенно если этот род общения поддерживается также совместной молитвою.
      cn: 我难以离开您，但我怀着一丝希望，即借着这本书，以及我其他的书，您能看到我的『深切』之心和我的思想，我曾试图借着我的话语来表达这些，这些话语是在热切的含泪祷告中诞生的。每当您愿意时，您可以通过阅读，在圣灵的层面与我同在，尤其是当这种交通也借着共同的祷告来维系时。
  - type: paragraph
    text:
      ru: Иеромонах Николай Сахаров
      cn: 修士司祭 尼古拉·萨哈罗夫
- type: heading1
  text:
    ru: Духовные беседы. Том 1
    cn: 灵修谈话 卷一
  children: []
- type: heading1
  text:
    ru: 'Беседа 1: О совершенстве монашества и о возрождении Русской Церкви[19]'
    cn: 第一讲：论修道生活的完美与俄罗斯教会的复兴[19]
  children:
  - type: paragraph
    text:
      ru: 'Вопрос о совершенстве Русской Церкви. Пример Христа: Он молился за всего Адама и умирал за всех людей. Монашество: отдать жизнь другим и воспринять смерть. Цель монашества – уподобление Христу в Его смирении. Ограниченное видение совершенства. Монах – носитель всего Адама. От малых вещей до восприятия всего Адама. Монашество и мученичество: жизнь по заповедям Христа. Путь возрождения в России – единение вокруг Патриарха. Проповедь совершенства невозможна в падшем мире.'
      cn: '俄罗斯教会的完美问题。


        基督的榜样：祂为全人类祈祷，并为所有人受死。修道生活：将生命献给他人，并承受死亡。修道生活的目的，是效法基督的谦卑。对完美的有限视野。修士是全人类的承载者。从微小之事，到承载全人类。修道生活与殉道：遵照基督的诫命生活。俄罗斯的复兴之路，是围绕着宗主教的合一。在堕落的世界里，宣讲完美是不可能的。'
  - type: paragraph
    text:
      ru: Наше сегодняшнее собрание принимает особый характер в силу того, что наш дорогой гость из России теперь в конце своего посещения просил меня сказать ему последнее слово о монашестве.
      cn: 我们今日的聚会带有特殊的性质，因为我们来自俄罗斯的亲爱宾客，如今在他访问行将结束之际，请求我对他说关于修道生活的临别赠言。
  - type: paragraph
    text:
      ru: 'Недоведомый человеком в своей глубине промысл Бога дал Русской Церкви опыт исповедания и мученичества. Гуманизм марксистского типа был беспощаден в борьбе своей с верой в Бога, и никакие жертвы, никакая любовь не могли преодолеть озлобленности гонения со стороны большевиков. РусскаяЦерковьпережила исключительное истощание в страданиях за имя Христово. И этот факт приводит к тому, что теперь перед Русской Церковью ставится вопрос о совершенстве, исходя из извечного закона духовного: «Полнота истощания предваряет полноту совершенства»[20].'
      cn: 人无法在深度上彻知的上帝的摂理，赋予了俄罗斯教会信仰告白与殉道的经验。马克思主义类型的人道主义，在与对上帝的信仰的斗争中是无情的；任何牺牲、任何爱都无法克服布尔什维克方面迫害的恶毒。俄罗斯教会，在为基督之名的苦难中，经历了极度的虚己。而这一事实导致，如今俄罗斯教会面临着一个关于完善的问题，依据那永恒的属灵法则：「虚己的完全先于完善的完全」[20]。
  - type: paragraph
    text:
      ru: Когда предо мною поставлена задача – говорить о совершенстве, которое преследует монашество, то я должен напомнить, что об этом говорит апостол Павел:«я не мог говорить с вами, братья, как с духовными, но как с плотскими, как с младенцами во Христе. Я питал вас молоком, а не твердой пищей, ибо вы были еще не в силах, да и теперь не в силах»(1Кор.3:1–2).«Всякий, питаемый молоком, несведущ в слове правды, потому что он младенец. Твердая же пища свойственна совершенным, у которых чувства навыком приучены к различению добра и зла»(Евр.5:13–14).«Мудрость же мы проповедуем между совершенными»(1Кор.2:6). Видно, как, преподав великое и высокое учение, Апостол говорит о нём, как еще о молоке. А где совершенство? – Об этом разговор среди совершенных. Если «твердая пища» совершенных не была дана коринфянам и другим, и даже евреям, то что можем мы сказать о себе, о нашем времени? Сам Христос сказал:«Огонь пришел Я низвести на землю, и как желал бы, чтобы он уже возгорелся!»(Лк.12:49). Если Господь Сам о Своем учении говорит как «об огне, сведенном с неба на землю», то дерзнем ли мы говорить о совершенстве? Не удержит ли нас страх этого огня всепожирающего?
      cn: 当我被赋予任务，谈论修道生活所追求的全德时，我必须提醒大家，关于这点，使徒保罗曾说：「我从前对你们说话，弟兄们，不能把你们当作属灵的，只能把你们当作属肉体的，当作在基督里的婴孩。我给你们吃奶，没有给你们吃干粮，因为你们那时不能吃，就是如今还是不能。」 (哥林多前书 3:1-2) 「凡是吃奶的，在公义的道理上都没有经验，因为他是婴孩。惟独干粮是给那些完全人吃的，他们的感官因习练而能分辨善恶了。」 (希伯来书 5:13-14) 「然而，我们是在完全人中间传讲智慧。」 (哥林多前书 2:6) 我们可以看出，使徒在传授了伟大而崇高的教导之后，却仍称其为奶水。那么，全德在哪里呢？关于这一点，乃是完全人之间的对话。如果给完全人吃的「干粮」都没有赐给哥林多人和其他人，甚至连希伯来人也没有得到，那么，关于我们自己，关于我们这个时代，我们又能说什么呢？基督自己说：「我来是把火投在地上，我多么愿意这火已经燃烧起来！」 (路加福音 12:49) 如果主自己谈论祂的教导，称其为「从天上降到地上的火」，那么，我们还敢谈论全德吗？那吞噬一切的火焰，其恐惧难道不会阻止我们吗？
  - type: paragraph
    text:
      ru: Как я понимаю положение вещей, создавшееся в мире за последние десятилетия, у нас нет иного пути, как только проникнуть в тайну учения Христа, познать Христа в совершенстве, возможном для человека. Поэтому со страхом и благоговением сделаем всё же попытку говорить о монашестве как об искании действительно совершенного познания христианства.
      cn: 据我理解，近几十年来在世界上形成的现状，我们别无他途，唯有深入基督教诲的奥秘，以人类所能达到的完善程度来认识基督。因此，我们怀着恐惧与敬畏，姑且尝试谈论修道生活，视其为寻求对基督教真正完善的认识。
  - type: paragraph
    text:
      ru: 'В прошлом веке в Киеве был замечательный подвижник Парфений, друг митрополита Филарета Киевского. Получив схиму, он молился Божией Матери открыть ему смысл этой великой схимы. И, явившись ему, Божия Матерь сказала: «Схимник есть молитвенник за весь мир». Исходя из этого откровения, мы дальше будем говорить о путях к этому совершенству.'
      cn: 上一世纪，在基辅有一位杰出的苦行修士帕特尼，他是基辅都主教菲拉雷特的友人。领受了大品神品后，他向圣母祷告，祈求她向他揭示这大品神品的意义。圣母显现给他，对他说：「大品神品修士是为整个世界祷告的人。」基于这个启示，我们接下来将谈论达到这种圆满的途径。
  - type: paragraph
    text:
      ru: Сам Господь на Тайной Вечери сказал ученикам:«Я дал вам пример, чтобы... вы делали то же, что Я сделал вам»(Ин.13:15). А что видим мы во Христе? Я не знаю, как для других, но меня поражает и влечет именно образ Христа, восходящего на Голгофу, как Он, единый из всех людей, бывших на Земле, восхотел взять на Себя грехи всего мира, отдать Свою жизнь в чрезвычайных страданиях ради того, чтобы все мы освободились от«клятвызаконной» (см.Гал.3:13), от проклятия, лежащего на человечестве после первородного греха в раю (см.Быт.3:17). Нося в Самом Себе всего Адама, все народы всех времен, Господь умирал за всех (см.2Кор.5:14–15;Евр.2:9и т. д.). Никто из людей, конечно, не мог помогать Ему, и в евангельском описании мы видим, что вся Его мысль была обращена только к Отцу (см.Мф.26:39, 42;Мк.14:36;Лк.23:46и т. д.). Какой вывод можем мы сделать из нашего видения Христа, восходящего на Голгофу, чтобы отдать Свою жизнь и воспринять смерть, поразившую людей, даруя им Божественную Жизнь, по словам Его:«Заповедь новую даю вам, да любите друг друга; как Я возлюбил вас... Нет больше той любви, как если кто положит душу свою за друзей своих. Вы друзья мои, если исполняете то, что Я заповедую вам. Я... не называю вас рабами, ибо раб не знает, что делает Господин его; но Я вас назвал друзьями, потому что сказал вам всё, что слышал от Отца Моего»(Ин. 13:34, 15:13–15)? Мы видим, что перед Своим исходом на Голгофскую смерть Господь решил говорить о совершенстве Своим ученикам.
      cn: 主自己在最后的晚餐上对门徒说：「我给你们作了榜样，叫你们照我向你们所行的去行。」(约翰福音 13:15) 那么，我们从基督身上看到了什么呢？我不知道对其他人来说如何，但对我而言，正是基督登上各各他的形象令我震惊和吸引，祂是世上所有人类中独一无二的，祂甘愿将全世界的罪恶承担于自身，以极大的苦难献出自己的生命，好叫我们所有人从「律法的咒诅」中得释放（参 加拉太书 3:13），从伊甸园原罪之后落在人类身上的咒诅中得释放（参 创世记 3:17）。祂将整个亚当，将历代所有民族都承担于自身，主为所有人而死（参 哥林多后书 5:14-15，希伯来书 2:9等）。当然，没有人能帮助祂，在福音书的记载中我们看到，祂所有的心思都转向了父（参 马太福音 26:39，42，马可福音 14:36，路加福音 23:46等）。我们从对基督登上各各他的景象中能得出什么结论呢？祂在那里献出自己的生命，领受了击败世人的死亡，并赐予他们神圣的生命，正如祂所说：「我赐给你们一条新命令，乃是叫你们彼此相爱；正如我爱你们一样……人为朋友舍命，爱就没有比这更大的了。你们若遵行我所吩咐的，就是我的朋友了。我……不称你们为仆人，因仆人不知道主人所作的事；我却称你们为朋友，因我将从我父所听见的一切事都告诉了你们。」(约翰福音 13:34，15:13-15)？我们看到，在祂即将前往各各他受死之前，主决定向祂的门徒宣讲完全之事。
  - type: paragraph
    text:
      ru: 'И в чём состоит наша теперешняя задача? – В том, чтобы объяснить, как люди пришли к этому образу жизни – монашеству. Монашество не есть выдумка человека: оно является категорическим императивом нашего духа после того, как к нему прикоснется Дух Святой, как к нему прикоснется огонь любви Христовой, – Любви, Которая отдает Свою жизнь для того, чтобы другие жили, и воспринимает от них смерть. И это есть воистину монашество в своей глубине наиболее совершенной, понятое так, как о нём говорит Сам Господь:«если кто приходит ко Мне и не возненавидит отца своего и матери, и жены и детей, и братьев и сестерипритом и самой жизни своей, тот не может быть Моим учеником... кто хочет душу свою сберечь, тот потеряет ее, а кто потеряет душу свою ради Меня, тот сбережет ее»(Лк.14:26, 9:24).'
      cn: '我们当前的任务又是什么呢？——在于解释人们是如何来到这种生活方式的——即修道生活。修道生活并非人的臆想：它是我们精神的绝对命令，在圣灵触及它之后，在基督之爱的烈火触及它之后——这爱舍弃自己的生命，为使他人得以存活，并从他们那里领受死亡。这正是修道生活在其最深处、最完善的真实体现，正如同主自己所言：

        「如果有人到我这里来，不恨自己的父亲、母亲、妻子、儿女、弟兄、姐妹，甚至自己的性命，他就不能作我的门徒……凡是想要保全自己性命的，必丧失性命；凡是为我的缘故丧失性命的，必保全性命。」（路加福音 14:26，9:24）'
  - type: paragraph
    text:
      ru: Итак, та любовь, которую проявил Сам Христос (ср.Ин.13:1), есть совершенство. Но мы не способны к этой любви по гордости своей. И до наших дней удерживается неведение среди христиан о том, что заповедал Христос. Господь ожидает от нас «повторения» Его жизни на Земле. А ведь сколько людей противятся этому! Но если говорить до конца, то, в сущности, спасение мира было бы, если весь мир вдруг стал бы на путь подражания Христу – «отдавать свою жизнь, чтобы жили другие» (Мф.20:28;Мк.10:45).
      cn: 那么，基督自己所显明的爱（参阅 约翰福音 13:1），乃是全备。但我们因着自己的骄傲，无力行出这爱。甚至直到今日，基督徒中间仍存着对基督所吩咐的无知。上主期望我们「重演」祂在世上的生命。然而，有多少人抗拒这事啊！但若要说到底，那么，实质上，世界的救赎就会成就，如果全世界突然走上效法基督的道路——「舍弃自己的生命，好使他人得生」（马太福音 20:28，马可福音 10:45）。
  - type: paragraph
    text:
      ru: Обычно в мире идет борьба за доминацию[21]над слабейшим. Через убийство, часто масс, люди устанавливают свою власть над миром, и это есть путь мира во всех веках, это есть история нашей человеческой жизни. Но доминация через физическую силу над братом отнюдь не есть проявление величия человека. Величие человека проявляется именно в том христианском устроении, о котором говорит Господь:«Нет больше той любви, как если кто положит душу свою за друзей своих». И это есть конечная цель монашества – уподобление, возможно полное, Христу.
      cn: 通常在世上，人们为了凌驾于弱者之上的支配权[21]而争斗。人们通过杀戮，常常是大规模的杀戮，来确立他们对世界的权势。这便是世世代代世上的道路，这便是我们人类生活的历史。但通过体力凌驾于弟兄之上的支配，绝不是人之伟大的彰显。人之伟大恰恰体现在那种上主所说的基督教之建制中：「人若为朋友舍弃自己的性命，再没有比这更大的爱了。」 (约翰福音 15:13) 这便是修道生活的终极目标——尽可能完全地肖似基督。
  - type: paragraph
    text:
      ru: Христос, воистину безначальный Бог, в Своей Природе охватывает всё сущее, что сотворено Отцом через Него и Духа Святого. В силу этого во всех формах своего проявления вся космическая жизнь составляет единое общее бытие, но в разных степенях совершенства. И подобно тому, как мы, познавая космическое бытие, усматриваем в нём бесконечное количество слоев, от невидимого глазом атома до чудной системы галактик, так и в монашестве, – которое своим конечным намерением имеет полное уподобление Христу, «Имже вся быша», – наличествуют различные степени совершенства в различных его проявлениях. И то, что несет монах в своем уме, является показателем меры его восприимчивости к Откровению, нисходящему от Бога. В монашество могут прийти люди из всех слоев населения, и потому наблюдаются разделения среди монахов, ибо различно их проникновение в небесные тайны.
      cn: 基督，诚然是无始的上帝，在祂的本性中包含着一切存在，即父藉着祂和圣灵所创造的。因此，在其一切表现形式中，整个宇宙生命构成一个单一的共同存在，但其完善程度各异。正如我们认识宇宙存在时，在其间察觉到无限的层次，从肉眼不可见的原子，到奇妙的星系系统；同样，在修道主义中——其最终目的是完全效法基督，「万物藉祂而生」——亦存在着各种不同程度的完善，在其各种表现中。并且，修士心中所怀有的，是其对来自上帝的启示领受程度的标志。各阶层的人都能进入修道生活，因此，修士之间也出现了分化，因为他们对天国奥秘的领悟程度各不相同。
  - type: paragraph
    text:
      ru: 'Господь, пребывая с нами на Земле, говорил с народом на простом языке, полном образов из повседневной жизни, чтобы самые простые люди могли Его понять. Так, Он объяснил Апостолам:«вам дано знать тайны Царствия Божия, а прочим в притчах»(Лк.8:10). Но с великим страданием мы переживаем то печальное явление в жизни Церкви, что стоящий на низшей мере понимания не может понять ни мыслей, ни молитв, ни сил, ни созерцаний, ни любви, которыми обладают лица, наиболее способные к восприятию исходящего свыше Откровения. И апостол Павел очень остро переживал в своем апостольском служении этот момент: когда те, кто менее глубоко прозревает в познание божественных вещей, свое видение признают всё же концом совершенства и борются за то, чтобы остановить на их видении всё строение Церкви. Вот почему говорил он о том, что «напаяет людей молоком духовным». А что превышает их, что доступно пониманию лишь совершенных, – о том он говорит только в кругу совершенных. И добавляет при этом, что«все, желающие жить благочестиво... будут гонимы»(2Тим.3:12) даже внутри Церкви, поскольку есть люди, которые не только отвергают совершенство, но и борются против него. И отсюда наш страх говорить о совершенстве.'
      cn: 主在世上与我们同在时，用朴实的语言对百姓说话，这语言充满了日常生活的意象，为使最普通的人也能领悟祂。祂就这样向使徒们解释说：「上帝之国的奥秘已赐给你们去明白，至于其余的人，则用比喻。」（路加福音 8:10）但我们带着巨大的痛苦，经历着教会生活中一个令人悲哀的现象：那些处于较低理解程度的人，无法领悟那些思想、祷告、力量、默观和爱，而这些正是那些最能领受来自上方之启示的人所拥有的。使徒保罗在他的使徒事奉中，也曾非常敏锐地感受到这一点：即当那些对神圣事物认识得不够深入的人，仍将自己的见解视为完美的终极，并力图将教会的整个架构都停留在他们的见解之上。这就是为什么他说到「以属灵的奶水喂养人」。至于超越他们理解范围的，那些只有完美的人才能理解的——他只在完美的人圈子里谈论。祂还补充说：「凡立志敬虔度日……的，都将受逼迫。」（提摩太后书 3:12）甚至在教会内部也是如此，因为有些人不仅拒绝完美，甚至还与之为敌。因此，我们因此惧怕谈论完美。
  - type: paragraph
    text:
      ru: Испорченная наша натура не дает нам сил последовать примеру Христа. Поэтому рождается монашество как особый вид жизни в этом мире, как стремление уподобиться Христу, умирающему на Голгофе за всех,«чтобы... рассеянных чад Божиих собрать воедино»(Ин.11:52). Таким путем человек через хранение заповедей Христовых постепенно доходит до осознания себя Адамом. Нося в душе своей годами, изо дня в день, из часа в час, эту мысль, мы понемногу приготовляем себя к способности действительно воспринять в ее подлинном бытии заповедь Христа. Через эту заповедь мы становимся универсальными носителями всего космического бытия и Божественной жизни.
      cn: 我们堕落的本性没有给我们力量去追随基督的榜样。因此，修道生活便应运而生，作为今世一种独特的生活方式，作为一种渴望效法在各各他为众人而死的基督的生活，为要「使……上帝四散的儿女都聚集归一」（约翰福音 11:52）。循此途径，人通过遵守基督的诫命，逐渐达到自我认知为亚当的状态。将这思想年复一年，日复一日，时时刻刻承载于自己的灵魂中，我们便逐渐预备自己，以真正领受基督诫命在其真实存有中的能力。通过这诫命，我们成为整个宇宙存有和神圣生命的普世承载者。
  - type: paragraph
    text:
      ru: То, чего ждет от нас Господь, безмерно высоко, безмерно велико. И религия наша должна быть охарактеризована как религия абсолютного порядка. С небес сошел Христос, совершенный Бог, Творец всего сущего. И христианин, через свое послушание Христу, делается восприимчивым ко всему происходящему в мире человеческом. Странным образом, но получается так, что он, читая Откровение о падении человека, вдруг ощущает, что носит в себе этот грех, и в этом смысле он становится действительно чадом падшего Адама. Начинается монашество с очень маленьких вещей, но кончается тем, что человек молится за всего Адама, как за самого себя. Так, Господь на Страшном Суде скажет о последнем и малом человеке, что это Он Сам, осуждая тех, которые не послужили Ему, когда Он был в нужде (см.Мф.25:31–46).
      cn: 上帝对我们的期望，无限崇高，无限伟大。我们的宗教应当被描述为一种绝对秩序的宗教。基督自天降临，祂是全然的上帝，万有的创造者。基督徒借着对基督的顺服，变得能领受在属人的世界中发生的一切。奇妙的是，当他阅读关于人类堕落的启示时，竟然忽然感受到自己身负此罪，从这个意义上说，他确实成了堕落亚当的后裔。修道生活始于非常微小之事，却以人为全人类亚当祈祷、如同为自己祈祷而告终。如此，主在末日审判中将论及那最卑微、最小的人，说那正是祂自己，谴责那些在祂有需要时未曾服侍祂的人（参见马太福音 25:31-46）。
  - type: paragraph
    text:
      ru: 'То, о чём мы сейчас говорим, превосходит меру среднего понимания: оно кажется совершенно недоступным, невозможным. Но это есть следствие нежелания действительно последовать за Христом, каким бы болезненным ни было это шествие. Многие из людей за время коммунистической революции умирали мученической смертью. Но когда нет гонения, тогда в замену мученичества приходит монашество. Так было, когда победил царь Константин и христианство стало государственной верой, когда после первых трех веков мучений за Христа наступил мир, тогда наилучшие элементы христианские ушли в пустыню. И если будем рассматривать вещи с возможностью аналогии или повторения в истории, то надо было бы, чтобы и сейчас именно лучшие вошли в монашество.'
      cn: 我们现在所谈论的，超越了普通理解的范畴：它似乎完全无法企及，不可能实现。但这乃是不愿真正跟随基督的结果，无论这行程多么痛苦。在共产主义革命时期，许多人殉道而死。但当没有逼迫时，修道生活便取代了殉道。事情便是如此，当君士坦丁大帝得胜，基督教成为国教之时，当为基督受苦的前三个世纪结束后，和平降临时，那时，最优秀的基督徒便隐入了旷野。倘若我们以历史中类比或重演的可能性来看待事物，那么如今也当是那些最优秀的人进入修道生活。
  - type: paragraph
    text:
      ru: 'Мы здесь, маленькая группа монахов, исповедуем именно так, как я говорю, но мы не достигаем совершенства. Сам отец наш духовный Силуан пишет: «Лишь редкие минуты достигаю я заповедь Божию»[22]. Впрочем, бывают моменты, когда мы приближаемся к этому совершенству на короткое время. Монашество есть прежде всего духовная жизнь того порядка, как ее нарисовал нам Господь. Если в старости моей я позволяю себе идти до этих пределов, то не потому, что сам достиг этого, но потому, что так понимаю вещи теперь, а именно: что иного пути, как только Евангелие, для спасения человечества – нет! Иного Спасителя человечества, кроме Христа, – нет!'
      cn: 我们这里，一小群修士，正如我所说，如此信仰并宣认，但我们并未达到圆满。我们的神师圣西卢安父本人写道：「唯有在稀有的时刻，我才达到上帝的诫命」[22]。然而，会有一些时刻，我们为时短暂地接近这圆满。修道生活首先是属灵生活，是按照上主为我们描绘出的那种样式。若在我年迈之时，我允许自己走到这些界限，这并非因为我自己达到了它，而是因为我现在如此理解事物，亦即：除了福音之外，人类没有其他的救赎之路！除了基督之外，人类没有其他的救主！
  - type: paragraph
    text:
      ru: 'Многие говорят так: «Но если все станут монахами, то что же: мир умрет?» – Нет, не умрет, но будет всеобщее воскресение; и история мира кончится не катастрофой, а радостным торжеством и безболезненным переходом в бессмертную жизнь.'
      cn: '许多人这样说：「但如果所有人都成为修士，那又怎样呢？世界会消亡吗？」


        不，它不会消亡，反而是普世的复活；世界的历史不会以一场灾难告终，而是以喜乐的凯旋和无痛苦地过渡到不朽的生命。'
  - type: paragraph
    text:
      ru: Теперь, в конце моего слова, имея в виду всё вышесказанное, я с не меньшим страхом и трепетом позволяю себе высказывать мое мнение и о том, как РусскаяЦерковьможет восстать из пепла в большем величии духовном, чем в конце синодального периода. Возрождение всего богатства Русской Церкви теперь стоит в опасности из-за того, что многие совсем не понимают, как созидается жизнь Христовой Церкви, и действуют при отсутствии действительного опыта Божественной благодати. Прежде всего, всем необходимо осознать, что действительно по благому промыслу Бога о Русской Церкви в настоящее время руководство над нею вручено Святейшему Патриарху Алексию II. Лично я полагаю, что более подходящего человека, чем патриарх Алексий II, нет в данный момент! Этот скромный человек провел десятки лет как один из ближайших сотрудников великого патриарха Алексия I и служил всё время патриаршества великого молитвенника Пимена. Таким образом, содействуя ему во всех его предприятиях, мы дадим богоданному Патриарху возможность реализовать восстановление Церкви во всём ее могуществе. Пусть всякий храм, всякий монастырь, всякая школа, – всё, что принадлежало Русской Церкви и было похищено, – всё возвращаемое ныне государством Церкви присоединяется к всероссийскому стаду, ведомому ныне патриархом Алексием, и объединяется вокруг него. После того, как с Божией помощью удастся собрать уцелевшее материальное богатство, будем усердно просить у Бога подать нашим иерархам помощь для лучшей организации богословских семинарий и академий. И по достижении в этом плане единства всех станет возможным великий Собор Русской Православной Церкви и восстановление и исправление всего, что нужно исправить.
      cn: 现在，在我言论的结尾，考虑到以上所有内容，我怀着同样深切的恐惧与战兢，斗胆表达我的看法，关于俄罗斯教会如何能从灰烬中复兴，并在属灵的伟大上超越主教公会议时期的末期。俄罗斯教会所有丰盛的复兴如今正处于危险之中，因为许多人完全不明白基督教会的生活是如何建立起来的，并且在缺乏真实的神圣恩典经验的情况下行事。首先，所有人需要认识到，确实是依照上帝对俄罗斯教会的美善护理，当前对其的领导权已交付给至圣牧首阿列克谢二世。我个人认为，目前没有比牧首阿列克谢二世更合适的人选！这位谦卑的人作为伟大牧首阿列克谢一世最亲密的合作者之一，度过了几十年，并在伟大代祷者皮缅担任牧首的整个时期服事。如此一来，通过在牧首的所有事业中协助他，我们将赋予这位上帝所赐予的牧首机会，实现教会全面威能的复兴。愿每一个圣堂，每一个修道院，每一所学校——所有曾属于俄罗斯教会并被掠夺的一切——所有如今由国家归还给教会的，都归入现今由牧首阿列克谢带领的全俄罗斯羊群中，并围绕着他团结起来。在上帝的帮助下，成功收集到幸存的物质财富之后，我们将恳切地求上帝赐予我们的主教们帮助，以便更好地组织神学修院和神学学院。并且，当在此方面所有人达成合一之后，俄罗斯正教会的伟大公会议就将成为可能，以及所有需要改正的事物的复兴与改正。
  - type: paragraph
    text:
      ru: 'Недоведом для меня промысл Божий, давший мне задачу послужить великому подвижнику прп.Силуану Афонскому. Сидя у ног его, мне было дано слышать духовные слова этого избранника Божия. Наученный им, я смог написать его житие. Книга моя была принята с любовью подавляющим большинством подвижников Святой Горы и многими тысячами людей. Затем последовала моя деятельность как основателя монастыря, где идеалом стоит учение прп.Силуана Афонского. И вот, несмотря на все мои болезни и немощи физические, Господь сохранил меня до глубокой старости. Если примем во внимание мой возраст (девяносто шесть лет) и долготу моего служения в монашестве (шестьдесят семь лет), то я теперьde factoявляюсь одним из старейших духовников Православной Церкви. В силу этого ныне, преодолевая свой стыд за себя самого, все-таки скажу о том, что должно было бы остаться только между Богом и мною. Более полувека и на Афоне, и на Западе я молился с глубоким плачем о спасении Русской Церкви, как и теперь молюсь за всюЦерковьПравославную, где бы она ни была. Говорю об этом, чтобы слышащие мои слова были снисходительными в суждении обо мне. И еще последнее дерзание мое: скажу, что Дух Божий извещает меня об истинности слов моих относительно Русской Церкви и ее богоданного Патриарха. Умоляю вас всех: послушайте слово, которое дает мне Бог и за которое вся ответственность ложится на меня![23]Ибо только таким путем может быть спасена Русская ПравославнаяЦерковь...'
      cn: 我无法测度上帝的眷顾，竟赋予我任务，去服事伟大的苦修者——阿索斯山的圣西卢安长老。坐在他的脚边，我蒙恩聆听了这位蒙上帝拣选之人的属灵话语。蒙他教诲，我得以写下他的生平。我的著作蒙圣山绝大多数苦修者和成千上万的人们所爱接纳。随后，我展开了建立修道院的事工，其宗旨是阿索斯山的圣西卢安长老的教诲。如今，尽管我百病缠身，身体孱弱，上主却保守我直到这高龄。如果我们考虑到我的年龄（九十六岁）以及我在修道生活中侍奉的年限（六十七年），那么我如今事实上是正教会最年长的灵性导师之一。因此，此刻，我克服了自我羞愧，仍要说出那些本应只存在于上帝与我之间的事情。半个多世纪以来，无论是在阿索斯山，还是在西方，我都带着深切的哀哭为俄罗斯教会的救赎而祈祷，正如我现在为普世正教会，无论其身在何处，而祈祷一样。我提及此事，是为了让那些听闻我言语的人，在评判我时能够宽容一些。还有我最后一次的冒昧之言：我要说，上帝的圣灵向我启示，我的话语是真实的，关于俄罗斯教会及其蒙上帝所赐的牧首。我恳求你们所有人：听从这上帝赐予我的话语，而其全部责任将由我承担！[23]因为只有通过这种方式，俄罗斯正教会才能得蒙救赎……
  - type: paragraph
    text:
      ru: То, что я говорю сегодня, возможно, хотя бы в самой малой доле, повлияет на возрождение Русской Церкви. Я просил вас молиться обо мне, чтобы эту задачу я выполнил без порока. Но с вами, конечно, у меня особые отношения.
      cn: 我今天所讲的，或许哪怕是极小一部分，也会影响到俄罗斯教会的复兴。我曾请你们为我祷告，以便我能毫无瑕疵地完成这项任务。但是，当然，我与你们有特殊的关系。
  - type: paragraph
    text:
      ru: 'В своих писаниях прп. Силуан говорит о настоящем монашестве, которое большинству недоступно[24]. Он выражает это так: «Но это не для всех»[25], и замечает, что когда монашество служит людям внешне, – «и это хорошо, но это далеко до монашества»[26].'
      cn: 在圣西卢安的著作中，他谈到真正的修士生活，这生活是大多数人无法企及的[24]。他如此表达：「但这并非为所有人预备的」[25]，并指出当修士生活在外在层面侍奉人时——「这固然是好的，但这远非修士生活」[26]。
  - type: paragraph
    text:
      ru: 'Скажу вам: в том слове, которое предложил вам сегодня, я дерзаю говорить о «великой тайне» апостола Павла (см.1Тим.3:16). Он не сказал нам, какие беседы у него с совершенными. И по существу мое слово вам есть, конечно, дерзновение сверхчеловеческое. Но мы исходим из слов Самого Христа, что «Он дал нам пример, чтобы и мы делали то же, что Он сделал» (см.Ин.13:15), и чтобы мы «последовали Ему» (см.Мф.16:24). А в чём это «дело»? – В том, что Он «отдавал Свою жизнь» для того, чтобы спасти жизнь мира (см.Ин.6:51). Проповедовать это христианство совершенное в нашем одичалом мире невозможно. Даже в монастырях это доступно только немногим.'
      cn: 我要告诉你们：在我今天向你们提出的这番话语中，我竟敢谈论使徒保罗的「伟大的奥秘」（参见提摩太前书 3:16）。他没有告诉我们，他与那些达致完全者之间有怎样的谈论。实质上，我对你们说的这番话，当然是超越人类的僭越。但我们是基于基督祂自己的话语，即「祂给了我们一个榜样，使我们也照祂所做的去行」（参见约翰福音 13:15），并且使我们「跟随祂」（参见马太福音 16:24）。而这「所行」是什么呢？——在于祂「舍弃了自己的生命」，为了拯救世界的生命（参见约翰福音 6:51）。在我们这个野蛮化的世界中，传扬这种达致完全的基督教是不可能的。即使在修道院里，这也只对少数人是可及的。
  - type: paragraph
    text:
      ru: 'В моей книге описывается, как меня в келье посетил один пустынник, когда я был еще в монастыре. И он поведал мне слова Христа: «Я помилую всякого человека, который хотя бы однажды призвал имя Божие. Но те, которые хранят Мои заповеди, в Царстве будут Моими друзьями. А остальных Я только помилую»[27]. Я не высказал своего суждения об этом в книге, но в каком-то смысле скажу, – возможно, что это было настоящее явление Христа.'
      cn: 我的书里记载着，一个隐修士在我还在修道院里的时候，曾来我的斗室拜访我。他向我传达了基督的话：「我将怜悯所有哪怕只呼求过一次上帝之名的人。但那些遵守我诫命的人，在天国里将是我的朋友。至于其他人，我将只怜悯他们」[27]。我在书里没有对此发表我的判断，但从某种意义上说，——这或许是基督的真实显现。
  - type: paragraph
    text:
      ru: 'Итак, молитесь за всюЦерковьПравославную: будь то в Югославии, в Болгарии, в Румынии, будь то в России, в Греции, в Америке. Повсюду, где есть ПравославнаяЦерковь, своим духом она возмущает мир, и против нее ведется борьба усиленная, хотя более доброго слова, чем то, которое преподносит Православная Церковь, никто другой не говорит.'
      cn: 所以，请为整个正教会祈祷：无论是在南斯拉夫、保加利亚、罗马尼亚，无论是在俄罗斯、希腊、美国。无论何处，只要有正教会，她便以其灵搅动世界，一场猛烈的争战正针对她而进行，尽管没有人能说出比正教会所宣讲的更良善的话语。
  - type: paragraph
    text:
      ru: 'Итак, вы понимаете сегодняшнее дерзновение мое? – Перед всяким из нас может возникнуть этот вопрос: «Действительно, где же совершенство?» Читая писания старца, написанные им вскоре после Первой мировой войны, мы найдем слова об этом совершенстве: «Молиться за мир – это кровь проливать»[28]. О чём бы он ни писал, почти везде он в конце говорит о молитве за всего Адама... зная о том духовном состоянии, когда, по слову прп.Симеона Нового Богослова, каждый из нас должен осознать себя Адамом и носителем первородного греха[29]...'
      cn: 那么，你们明白我今日的这份大胆了吗？——我们每个人心中都可能升起这个问题：「真的，完美究竟在哪里呢？」阅读这位长老在第一次世界大战后不久所写下的著述时，我们会发现关于这种完美的论述：「为和平祷告——这便是倾洒自己的血」[28]。无论他写什么，他几乎总是在最后谈到为整个亚当祷告……深知那种灵性状态，届时，根据新神学家圣西默翁的话语，我们每个人都必须认识到自己就是亚当，是原罪的承担者[29]……
  - type: paragraph
    text:
      ru: В общем идея моя сказана. И носить в себе эту идею, свято молча о ней (потому что она невыносима для людей), – это уже великое дело. Где бы оно ни было сказано, это слово, – пусть оно говорится как-то где-то вне путей мира сего, – но оно должно быть сказано. И когда это сознание, которое мы видим в Боге Иисусе Христе, становится нашей мыслью (ср.Флп.2:5;1Кор.2:16), то, значит, нам сообщилась нетварная жизнь Самого Бога. И в этом спасение человека. Говорим о полном спасении.
      cn: 总而言之，我的理念已然阐明。将这理念承载于自身，对其保持神圣的沉默（因为对人而言，它是难以承受的），这已然是一件伟大的事工。无论这言语在何处被宣说——愿它以某种方式，在世俗的道途之外被宣说——但它必须被宣说出来。当这意识——我们所见于上帝耶稣基督之内的意识——成为我们的意念时（参阅 腓立比书 2:5，哥林多前书 2:16），那么，上帝自身那非受造的生命便已传达予我们了。在此之中，即是人的救赎。我们所言及的，是全然的救赎。
  - type: paragraph
    text:
      ru: Может быть, это слово будет опубликовано в журнале. Я не хочу, чтобы оно было в газетах, хотя бы даже и в патриаршей. Газета всё равно имеет характер «информации». А это слово, по существу, есть исповедание нашего понимания жизни во Христе и монашества особенно. И это исповедание тайны Божией для нас свято...
      cn: 也许这篇文字会发表在杂志上。我不希望它出现在报纸上，哪怕是宗主教区的报纸。报纸终究具有「信息」的性质。而这篇文字，实质上是我们对在基督内的生命，尤其是对修道生活的理解的告白。而这份对上帝奥秘的告白，对我们而言是神圣的……
  - type: paragraph
    text:
      ru: Странно, как всё происходит и течет жизнь в мире. По существу говоря, достаточно только посмотреть на дух, каким движим бывает человек. Вот, в течение двух тысячелетий был Дух, Который говорил о Божестве Христа, и это было всем ясно. А теперь вдруг отказываются понимать Христа как Бога! Хотя слова, которые Он сказал, ясно рисуют, что был с нами Бог, а не какой-то сумасшедший фантазер.
      cn: 世间万事万物的发生与流逝，生命的流转，真是奇特。实质而言，只需看人被什么样的灵所驱动，便已足够。看啊，在两千年间，曾有圣灵宣讲基督的神性，这对所有人来说都清清楚楚。而现在，人们突然拒绝将基督理解为上帝！尽管祂所说的话，清晰地描绘出是上帝与我们同在，而不是某个疯癫的空想家。
  - type: paragraph
    text:
      ru: Спасибо вам, что вы слушали. Спасибо вам за молитвы... На сегодня я кончил мое слово, и да будет благословение Божие на всех вас.
      cn: 感谢你们的聆听。感谢你们的祷告…… 今天我的话语已经讲完了，愿上帝的祝福降临在你们众人身上。
  - type: paragraph
    text:
      ru: 'Итак, мы начинаем монашескую жизнь не с молитвы за всю ПравославнуюЦерковь, где бы она ни была, а начинаем только с покаяния о нашем невежестве, о нашем неведении закона божественной жизни. Делаем маленькое дело повседневное: сажаем или собираем картошку, исполняем послушания, строим дом и так далее – так начинается. Но это – одна сторона жизни. А другая – как сказано в житии прп. Силуана: «И ходит человек сей ногами по этой земле, и руками Своими делает работу, но никто не знает, что духом он живет в Боге»[30]. Итак, это – наше монашество.'
      cn: 那么，我们开始修道生活，不是为普世正教会祈祷，无论它身在何处，而是只从悔改我们的无知开始，悔改我们不认识神圣生命法则的无知。我们做着日常的小事：比如种土豆或收土豆，遵行顺服，建造房屋等等——修道生活就是这样开始的。但这只是生命的一面。而另一方面——正如圣西卢安长老的生平所说：「此人双脚行走于这片土地，双手辛勤劳作，但无人知晓他灵里活在上帝之中。」[30]那么，这就是我们的修道生活。
- type: heading1
  text:
    ru: 'Беседа 2: О риске в духовной жизни, национализме и всечеловечестве[31]'
    cn: 第二讲：论灵修生活中的风险、民族主义与全人类[31]
  children:
  - type: paragraph
    text:
      ru: О риске свидетельства о самом себе. О Боге «ведомом». О названии книги «Видеть Бога». Вся жизнь во Христе связана с опасностью. О страхе ошибиться. Об опыте прп. Силуана и его наследии. Об опасности национализма. О благодати и богооставленности. Монашество способствует «жить всё человечество». О незаметном духовном росте.
      cn: '关于为自己作见证的风险。

        关于「被知晓的」上帝。

        关于书籍《看见上帝》的标题。

        在基督里的一切生命都伴随着危险。

        关于犯错的恐惧。

        关于圣西卢安长老的经验及其遗产。

        关于民族主义的危险。

        关于恩典与被上帝离弃。

        修道生活有助于「活出全人类」。

        关于不易察觉的属灵成长。'
  - type: paragraph
    text:
      ru: '...Старец Силуан пишет про одного монаха, который сказал ему: «Я за всю свою жизнь никого не обидел, никого не оскорбил»[32], и про другого, сказавшего: «Все меня любят, потому что я всем делаю послушание»[33].'
      cn: 圣西卢安长老写及一位修士，他对他说：「我一生中从未冒犯过任何人，也从未侮辱过任何人」[32]，以及另一位修士，他说道：「所有人都爱我，因为我对所有人都做顺从」[33]。
  - type: paragraph
    text:
      ru: 'Возникает вопрос: не опасно ли так говорить о самом себе, не навлечешь ли таким путем на себя большое искушение? – Да, конечно, навлечешь! И избежать этого невозможно. Но с самого начала нашей веры Апостолы вынуждались говорить в своей проповеди о том, что они были с Самим Богом (см.1Ин.1:1), такое долгое время! И конечно, всем монахам рекомендуется не говорить о таких вещах, чтобы не навлечь на себя излишнюю брань врага. Отрицательная сторона этого состоит в том, что когда вся жизнь о Христе должна быть скрыта, как научить детей и нарождающееся новое поколение учению Христа?'
      cn: 有一个问题出现了：这样谈论自己，难道不危险吗？难道不会因此给自己招致巨大的诱惑吗？——是的，当然会招致！这是无法避免的。但是，从我们信仰的一开始，使徒们就被迫在他们的讲道中谈论他们曾亲自与上帝同在（参1约翰福音 1:1），如此长的时间！而且当然，建议所有修士不要谈论这些事情，以免给自己招致仇敌过度的攻击。这不利的一面在于，当关于基督的全部生命都必须被隐藏时，如何教导孩子们和正在兴起的新一代基督的教义呢？
  - type: paragraph
    text:
      ru: 'Сам я взял на себя страшный риск (за который уже потерпел много весьма суровых слов против себя), написав эти две книги: о старце Силуане и, еще хуже, о себе самом – книгу «Видеть Бога как Он есть». Но я решился на это перед самой смертью: я жду ее прихода уже много лет (в предисловии к книге написано об этом). Однако не было и нет иного пути на Земле, где слишком силен враг Христа, и невозможно избежать этого действия – «рассказать». Когда я взял на себя ответственность основать маленькую обитель монашескую, то в душе моей было желание передать то, что дал мне Бог увидеть на Святой Горе Афон – и главным образом через Своего угодника Силуана. Я написал в своих книгах, что стесняюсь говорить о дарованиях Бога, но что нет иного пути, как только этот. Все вы меня видите; и из всего образа моей жизни вы, конечно, убеждались, что я вовсе не претендовал на место старца, но всегда почитал себя не старцем, а только братом вашим. И кто расположен добром, тот мог заметить это во мне. Я не считал себя вправе говорить авторитетное старческое слово кому бы то ни было из вас, а рассказывал просто о моей жизни и прежде всего о жизни старца Силуана.'
      cn: 我自己承担了巨大的风险（为此我已经承受了许多极其严厉的指责），写作了这两本书：一本是关于圣西卢安长老的，另一本，更糟糕的，是关于我自己的——《如其所是地观看上帝》一书。但我是在临近死亡时才下定决心这样做的：我已等待它的到来多年了（书中序言对此有所提及）。然而，在这地上没有，也从未有过别的道路，在这里，基督的仇敌过于强大，无法避免这个行动——「讲述」。当我承担起建立一座小型修道院的责任时，我的灵魂里就有一种愿望，想要传递上帝让我在阿索斯圣山所看见的一切——主要是通过祂的圣徒圣西卢安。我在我的书中写道，我羞于谈论上帝的恩赐，但除了这条道路别无他法。你们都看见我；并且从我整个的生活方式中，你们当然确信，我根本没有 претен夺长老的地位，而总是将自己视为不是长老，而只是你们的弟兄。凡心存善意者，都能在我身上察觉到这一点。我不认为自己有权向你们中的任何人说出权威的长老之言，而只是简单地讲述我的生活，并首先讲述圣西卢安长老的生活。
  - type: paragraph
    text:
      ru: 'Так же, как и все вы, каждый из вас, я хочу поклоняться Богу, Которого я знаю, а не Которого не знаю. В Троице-Сергиевой Лавре на одном храме написано «Ведомому Богу» в противовес словам Священного Писания, где упоминается алтарь в Афинах во имя «Неведомого Бога» (см.Деян.17:23). Этот вопрос – «Можем ли мы знать Бога, как Он есть или как Он НЕ ЕСТЬ?» – для меня не стоит в том смысле, что я христианин. А это значит, что Иисуса Христа я принимаю как Творца всего, что существует в Космосе, как нашего Бога. Если Он был с нами в нашей форме бытия и говорил на нашем языке, неужели цель Его была обмануть нас и показать Бога, как Он НЕ ЕСТЬ? Он дал нам заповедь:«Блаженны чистые сердцем, ибо они Бога узрят»(Мф.5:8). Если я добавлю слова: «так, как Он не есть», то представлю Христа обманщиком. Значит,«блаженны чистые сердцем, ибо узрят Бога»как Он есть в Самом Себе.'
      cn: 正如你们所有人，你们每一个人，我都渴望敬拜我所认识的上帝，而非我所不认识的上帝。在圣三一谢尔盖修道院的一座圣堂上写着「已知的上帝」，这与圣经中提到雅典有一座为「未识的上帝」而立的祭坛（使徒行传 17:23）的话语相对。「我们能否认识上帝，是认识祂的本相，还是认识祂的非本相？」——对我而言，因为我是基督徒，所以这个问题并不成立。这意味着，我接受耶稣基督为宇宙中一切受造物的创造者，为我们的上帝。如果祂曾以我们的存在形式与我们同在，并以我们的语言说话，难道祂的目的是要欺骗我们，向我们展示上帝的非本相吗？祂赐予我们诫命：「福哉，清心者，因为他们将得见上帝」（马太福音 5:8）。如果我加上这几个字：「祂的非本相」，那么我就是把基督描绘成一个欺骗者。这意味着，「福哉，清心者，因为他们将得见上帝」——是得见祂的本相。
  - type: paragraph
    text:
      ru: 'И когда наш друг и сподвижник отец N. дал титул моей книге «Видеть Бога как Он есть», то моей первой реакцией было взвесить: правильно ли это богословски? И конечно, отец N. не дикий человек: он сказал вещь совершенно правильную богословски. Сама форма – «видеть Бога как Он есть» – говорит просто о нашем стремлении знать Бога,«как Он есть»(1Ин.3:2). Я нигде не написал: «Я видел Бога, как Он есть! Приходите ко мне!» (как некоторые в Париже истолковали мою книгу), но писал то, что мне было дано, – то есть я жил свое покаяние перед Богом в тех пределах, в каких Он мне дал. Покаяние – это великий дар! И когда я говорю с вами, как брат, а не как какой-то учитель, который восседает на кафедре, то вы, конечно, остаетесь в свободе: или принять слово, как не мое, но как предание Церкви[34], или отвергнуть мое свидетельство, потому что видите меня, как я есть, «живьем».'
      cn: 当我们的朋友和同道N神父给我这本《看见上帝本相》的书起名时，我的第一个反应是衡量：这在神学上是否正确？当然，N神父并非一个狂悖之人：他所言在神学上是完全正确的。这个形式本身——「看见上帝本相」——只是述说我们渴望认识上帝，「祂的本相」(约翰一书 3:2)。我从未写过：「我已看见上帝的本相了！来找我吧！」（如同巴黎的一些人解释我的书那样），而是写下我所领受的——即，我在上帝赐予我的界限内，活出了我的忏悔。忏悔——这是一份伟大的恩赐！当我以兄弟的身份与你们交谈时，而非以某种高坐讲坛的教师身份，那么你们当然保有自由：或者接受这番话，不是作为我的话语，而是作为教会的圣传[34]；或者拒绝我的见证，因为你们看见我，就是我本来的样子，「活生生」地。
  - type: paragraph
    text:
      ru: 'Но все-таки как мог бы я исполнить то, о чём говорил в своей книге? Так, мне написал некто из облеченных высоким саном: «Вы свидетельствуете сами о себе, и Ваше свидетельство неверно». Итак, отвечая на вопрос: «Опасно ли говорить или не опасно?» – скажу: «Конечно, опасно!» Но вся жизнь во Христе всё время связана с опасностью. Самая главная, первая, неизбежная опасность – это совершить грех, хотя бы в мысли.'
      cn: 然而，我怎能做到我在书中谈论的那些事呢？譬如，一位获授高品圣职的人写信给我说：「您为自己作证，而您的见证是不真实的。」那么，在回答「谈论这些是否危险？」这个问题时，我会说：「当然，危险！」但是，在基督内的整个生命一直伴随着危险。最主要、最首要、最不可避免的危险，就是犯下罪过，哪怕是在思想上。
  - type: paragraph
    text:
      ru: Старец Силуан предложил мне прийти к нему после того, как меня посетил пустынник отец Владимир. И я пришел к старцу с великим благоговением. Я мысленно целовал землю, по которой ходил этот человек, и, может быть, по этой причине ни одно его слово не вызывало во мне сопротивления, но я принимал его с великой благодарностью и благоговением. И потому я решился написать о том, что в таких случаях духовник или старец открывается, может быть, до конца[35].
      cn: 圣西卢安长老建议我，在我被隐修士弗拉基米尔神父探望之后去找他。于是我带着极大的敬畏来到了长老那里。我在心里亲吻着这位行者曾踏过的土地，或许正因如此，他的任何一句话都没有在我心里引起抵触，相反，我都怀着极大的感激和敬畏接受了。也正因此，我决心写下，在这样的情况下，神师或长老会彻底地敞开自己[35]。
  - type: paragraph
    text:
      ru: Так и я, простите, многое написал в книге «Видеть Бога как Он есть». Моей идеей было дать ей название «Опыт одного православного монаха», но отец N. настоял – «Видеть Бога как Он есть». Конечно, отец N. всегда стремится к этому – видеть Бога, как Он есть. И он, и все мы отдаем себе в этом отчет... На мне лежит долг – сказать вам то, что мне было дано, независимо от того, так ли вы относитесь к моему слову, как я относился к слову святого Силуана, или нет. Я предал себя на суд всех. И сейчас не без трепета скажу вам, что я до сих пор полон страха, не сделал ли я какой ошибки в книге. Сам я, скорее, тип покаяния, чем утверждения чего бы то ни было, и не верю в непогрешимость человека, и поэтому, естественно, я ищу в книге моей, где я ошибся.
      cn: 恕我，我也是如此，在《按祂本相看见上帝》一书中写了许多。我本打算将其命名为《一位正教修士的经验》，但N神父坚持——《按祂本相看见上帝》。当然，N神父始终以此为目标——按祂本相看见上帝。他与我们所有人对此心知肚明……我肩负着一份义务，要将那被赐予我的向你们述说，无论你们是否像我对待圣西卢安的话语一样对待我的话语。我已将自己交付众人审断。而此刻，我仍不无战兢地告诉你们，我至今仍心怀恐惧，生怕自己在书中犯了任何错误。我本人，与其说是肯定一切的类型，不如说是忏悔的类型，我不相信人的无误性，因此，自然而然地，我在我的书中寻找自己哪里犯了错误。
  - type: paragraph
    text:
      ru: 'И вот вам, как наследникам моим, я предлагаю задачу: после моего ухода найдите путь растолковать, что ни в одном моем слове не было некоего ложного движения. То есть, несмотря на совершенно новую форму, которую нигде в прошлом не находим мы, эта книга полна предания православного. Я предполагаю, что терминология и все мои пояснения богословские верны с православной точки зрения.'
      cn: 于是，我向你们，作为我的继承者们，提出一项任务：在我离世之后，找出方法去阐明，在我的任何一句话中都没有任何虚假的动向。也就是说，尽管它拥有全然新颖的形式，这种形式是我们过去从未见过的，这本书却充满了东正教圣传。我设想，我的术语以及我所有的神学阐释，从东正教的观点来看都是正确的。
  - type: paragraph
    text:
      ru: 'Одна из самых важных сторон того, что я слышал от старца Силуана, – описание его молитвы, в которой он получил от Христа ответ: «Держи ум твой во аде и не отчаивайся»[36]. Две вещи совершенно поразили меня с самого начала, когда он говорил о явлении ему Господа. Видение длилось только момент, но в этом моменте открылась вечность. Почему я поверил в то, что Христос Всечистый явился ему и говорил, а не человек или какой-то другой дух? – Потому что он, будучи совершенно простым русским мужиком, почти безграмотным, вдруг получил дух молитвы за всего Адама – вещь, которую не вмещают самые знаменитые богословы. Для меня было ясно, что Сам Господь явился ему, потому что Он передал ему Свое собственное состояние – то, о котором говорит Силуан в писаниях своих: «Господу всех жалко...»[37]. И потому, я думаю, он далее пишет: «Я стал делать, как научил меня Господь... и мой ум очистился... и Дух свидетельствовал спасение»[38].'
      cn: 我从圣西卢安长老那里听到的最重要的事情之一，是对他的祷告的描述，在其中他从基督那里得到了回应：「将你的心智置于阴间，却不要绝望」[36]。当他谈到主向他显现时，有两件事从一开始就完全震撼了我。异象只持续了一瞬，但在这转瞬中，永恒被开启了。为什么我相信是至洁的基督向他显现并说话，而不是人或其他什么灵呢？——因为他，作为一个完全普通的俄罗斯农夫，几乎是文盲，却突然领受了为全人类亚当祷告的灵——这是最著名的神学家也无法容纳的事情。对我来说，很清楚是上主亲自向他显现，因为祂将自己的状态传给了他——也就是圣西卢安在他的著作中所说的：「上主怜悯所有人……」[37]。因此，我想，他接着写道：「我开始照着上主所教导我的去做……我的心智得到了洁净……圣灵也见证了救恩」[38]。
  - type: paragraph
    text:
      ru: 'Кто-то спросил свт.Филарета Московского, гениального иерарха русского: «Как Вы познаете: книги или учения – православные они или не православные?», и тот ответил: «По духу самого писания». Читая писания старца, на каждом шагу мы встречаем «примитив» человеческого сознания и вместе с тем – самое высокое познание, скрытое в этом «примитиве». Слушая старца, я, естественно, воспринимал его слова, вникая в их догматическое содержание. И его свидетельство было для меня важнейшим из всех, которые я получил с детских моих лет от учителей, профессоров и всех, кого бы то ни было.'
      cn: '有人问莫斯科的圣菲拉雷特，这位卓越的俄罗斯主教长：「您如何辨别一本书或一种教义——它们是正教的，还是非正教的呢？」他回答说：「凭着著作本身的精义。」


        阅读这位长老的著作时，我们处处遇到人类意识的「朴素性」，但同时——也遇到隐藏在这种「朴素性」中的最高认知。聆听这位长老时，我自然而然地领受他的话语，深入理解它们教义上的内涵。而他的见证，于我而言，比我童年以来从老师、教授以及所有其他人那里所获得的任何见证都更为重要。'
  - type: paragraph
    text:
      ru: Я пытался говорить вам об этой жизни, конечно, в надежде, наполняющей мое сердце, что вы продолжите учение старца и его влияние. А что касается меня, то по завещанию моему, вы попытайтесь найти слова более подходящие и точные для выражения того опыта, который был следствием моей встречи со старцем. Что же увидел я в нём такого, чего не нашел ни в одном из профессоров, которых мне дано было встретить как студенту? – Ни один из них не говорил с такой простотой и с такою уверенностью в Истине.
      cn: 我曾试图向你们谈论这种生命，当然，在我内心充满着希望，愿你们能延续长老的教导及其影响。至于我，按照我的遗愿，你们要努力寻找更合适、更精准的词语，以表达那种因我与长老相遇而产生的经验。那么，我在他身上看到了什么，是我作为学生曾有幸遇见的所有教授中，都未曾找到的呢？——他们中没有一人曾如此纯朴地，且对真理如此笃定地说话。
  - type: paragraph
    text:
      ru: 'Моим желанием было основать монастырь в духе прп. Силуана. Я до сих пор слышу от некоторых, что моя попытка имеет чисто утопический характер. Мне говорят люди: «Преодолеть в себе национализм невозможно». – «А тогда, – я думаю, – невозможно спасение». Если я националист и христианин по вере, то я суживаю Христа до этого понятия – «национальность». Понимаете, почему мне невозможно принять это сужение и почему для меня большим утешением является то, что хотя мы – маленькая группа, но нас одиннадцать национальностей! В молитве Силуана, который всё время призывает молиться за всё человечество от начала до конца, – конечно, нет национальности. Все эти национальные разделения стали следствием грехопадения. Мы нигде не видим проповеди христианства о ненависти. Значит, речь идет в христианской вере не об отвержении других национальностей, а о преодолении этой ограниченности через восхождение к молитве гефсиманской.'
      cn: 我的愿望是建立一座修道院，秉承圣西卢安长老的精神。直到如今，我仍听一些人说，我的尝试纯粹是乌托邦式的。人们对我说：「克服自身内的民族主义是不可能的。」——「那么，」我想，「救恩就无可能。」如果我是一个民族主义者，且在信仰上是基督徒，那么我就是把基督局限在「民族」这个概念里了。祢们明白吗，为何我无法接受这种局限，以及为何我们——虽然是一个小团体，却有十一个民族——这对我而言是莫大的安慰！在圣西卢安长老的祷告中，他始终呼吁为从始至终的全体人类祈祷——当然，其中没有民族性可言。所有这些民族分裂都是堕落的后果。我们从未在基督教的宣讲中看到关于仇恨的内容。这意味着，基督教信仰所关乎的，并非是排斥其他民族，而是通过上升到客西马尼的祷告，来克服这种局限性。
  - type: paragraph
    text:
      ru: 'Другой вопрос: при промыслительном отнятии благодати мы должны жить так, как будто бы благодать была с нами всегда, хотя она оставила нас в ощутимой форме. Сам Силуан так сказал: «Всё, чему научила нас благодать, мы должны сохранить до конца»[39]. И когда таким образом мы проявим нашу верность, тогда благодать сия дается в наше неотъемлемое достояние на всю вечность. Итак, когда в первом периоде благодать учит чему-нибудь, тогда всё идет легко «как по маслу»: человек всех любит, перед всеми смиряется, ни на кого не набрасывается с тем, чтоб эксплуатировать, никому не вредит, но ведет себя, как тот монах, который никого не обидел за всю свою жизнь. Но этот монах был еще молодым – ему было лет тридцать. Я сам знал и его, и другого монаха, который сказал, что его все любят, потому что он всем делает послушание. Конечно, я не писатель, а просто кающийся монах, но теперь, вспоминая этих и других людей, можно было бы написать огромную книгу – «Величие человеческого духа во Христе». Итак, если нас благодать учит в самом начале любить и желать сделать каждому добро больше, чем самому себе, как пишет Силуан[40], то, когда она отходит от нас, мы должны сохранить это как образ жизни нашей, как если бы благодать была с нами. И через это хранение мы покажем свою верность даже тогда, когда становится всё «больно». И тогда мы понимаем слова Христа:«если кто хочет идти за Мною, отвергнись себя, и возьми крест свой, и следуй за Мною»(Мф.16:24).'
      cn: 另一个问题是：当恩典蒙受神意旨意被收走时，我们应该如此生活，仿佛恩典始终与我们同在，尽管它以可感受的形式离开了我们。圣西卢安本人曾这样说：「恩典所教导我们的一切，我们都必须持守到底」[39]。而当我们以这种方式显明我们的忠诚时，这恩典便赐予我们，成为我们永恒中不可剥夺的产业。所以，当恩典在第一阶段教导任何事物时，一切都进行得十分顺利，「如行云流水」般：人爱所有人，在所有人面前谦卑，不攻击任何人以图剥削，不伤害任何人，而是行为像那位一生中从未冒犯过任何人的修士。但这位修士那时还很年轻——大约三十岁。我本人认识他，也认识另一位修士，他说，所有人都爱他，因为他对所有人都顺服。当然，我不是作家，而只是一位悔罪的修士，但现在，回想起这些以及其他人，足以写成一部巨著——「基督里人类精神的伟大」。所以，如果恩典在最初就教导我们爱，并渴望为每个人行善，甚于为自己行善，正如圣西卢安所写[40]，那么，当它离开我们时，我们必须将此作为我们的生活方式来持守，仿佛恩典仍与我们同在。并且通过这种持守，我们将显明我们的忠诚，即使在一切都变得「痛苦」之时。那时我们便领悟了基督的话语：「若有人愿意跟随我，就当舍己，背起他的十字架来跟从我。」(马太福音 16:24)。
  - type: paragraph
    text:
      ru: 'Крест Христов – многосложная вещь. Христианин не может не страдать в этом мире. Видеть тот дух, который царит в мировой жизни, – уже является великим страданием для христианина. Мир живет, имея цели свои, которые совсем не похожи на цели Христа. И мы должны жить в этом мире, чтобы все-таки совершить каким-то образом наш христианский путь. В общежитии это дается гораздо больше, чем в пустыне. Когда мы научаемся жить с другим человеком, то мы научаемся жить с миллионом подобных ему людей. Когда я знаю десять или пятнадцать человек, живущих здесь, то знаю миллионы и миллионы людей в глубинах веков прошлого и в современности: их жизнь проходит через меня. Итак, благодать учит этому; и это, как говорил Силуан, мы должны хранить до конца нашей жизни. И тогда нам будет дано спасение.'
      cn: 基督之十字架——是何等复杂深奥之事。基督徒在此世无法不经受苦难。洞悉世俗生命中弥漫之精神，对基督徒而言，已是莫大之苦楚。世界循其自身目标而活，而此目标与基督之目标全然相异。而吾人仍须生活于此世，以某种方式完成吾人之基督徒旅程。在共同生活中，此道成就远超于独居旷野。当吾人习于与他人共处，吾人便习于与百万计如他之人共处。当吾人认识此处十数人，吾人便认识那古往今来、现世之中亿万生灵：彼辈之生命穿越吾身。因此，恩典教授吾人此道；而此道，正如圣西卢安所言，吾人必须终身持守。届时，救赎方将赐予吾人。
  - type: paragraph
    text:
      ru: Второй период именуется «отнятием благодати в ее ощутимой форме» – когда человеку всякое христианское действие становится трудным. Этот период страшно болезненный и тяжелый, но совершенно необходимый для каждого из нас на путях спасения. Потому что в этой верности заветам Христа проявляются наш характер, наше решение, наша вера. И как Господь говорит, сначала дается благодать человеку без того, чтобы он что-нибудь сделал. Потом эта благодать отымается с тем, чтобы дать человеку проявить свою верность. И потом, когда он проявит «верностьв малом», дается ему в собственность его великое богатство – вечность (см.Лк.16:10).
      cn: 第二个时期被称为「恩典在可感知形式中的被收回」——即当人感到一切基督徒行为都变得艰难时。这个时期极其痛苦且沉重，但对我们每个人在救恩的道路上都是完全必要的。因为在这种对基督圣约的忠诚中，显露出我们的品格、我们的决心、我们的信心。正如主所言，恩典首先赐予人，无需他做任何事。随后这恩典被收回，以便让人显露出他的忠诚。然后，当他显出「在小事上的忠诚」时，他的丰盛财富——永恒，就赐予他作为产业（参路加福音 16:10）。
  - type: paragraph
    text:
      ru: В своих внешних формах монашество хранит некую простоту, «без всяких претензий», но в своем существе оно неимоверно грандиозно. Это должно остаться в душе каждого из нас. Если мы в монастыре хотим строить наше спасение, то монастырь дает огромнейшее преимущество – в том, что мы с доверием можем вести христианскую жизнь. В миру это опаснее, потому что человек неизбежно сразу делается предметом эксплуатации и рабства.
      cn: 从其外在形式看，修道生活保持着某种朴素，「不带任何企图」，但就其本质而言，它是极其宏伟的。这应当留在我们每个人的灵魂中。如果我们在修道院里寻求我们的救赎，那么修道院提供了一个巨大的优势——即，我们可以怀着信赖度过基督徒生活。在世俗世界中，这更危险，因为人必然立刻沦为被剥削和奴役的对象。
  - type: paragraph
    text:
      ru: 'Необходимо сохранить в себе это восприятие Христа: всё человечество – это единое дерево, и все мы или ветки, или листья, или плоды на этом дереве. Естественно для всякого христианина стать носителем в себе всего Адама. Всякий из нас должен стремиться к тому, чтобы жить всю историю человека от сотворения мира до последних судеб его. И тогда мы станем христианами. Я говорю об этом с дерзновением, подвергая себя опасности, как и всегда, когда идет речь об этом аспекте – универсальности христианской жизни. Вот мы опять подошли к берегам этого океана...'
      cn: 必须在自身中保有这种对基督的感知：整个人类——这是一棵独一的树，我们所有人，都是这棵树上的枝条，或是叶子，或是果实。对每个基督徒来说，自然而然地，要成为自身中全部亚当的承载者。我们每个人都应该努力，活出人类的全部历史，从创世直到他最终的审判。这样我们才能成为基督徒。我怀着胆量谈论此事，使自己身处危险之中，一如既往地，每当提及这个方面——基督徒生命的普世性时。看哪，我们又一次来到这片海洋的岸边了……
  - type: paragraph
    text:
      ru: 'Без контроля проходит рост нашего сердца перед Богом (ср.Лк.17:20). Мы не можем объяснить логически, каким образом развивается оно, начинает мыслить себя и «любитьближнего, как самого себя»(см.Мф.22:39), – так, как говорит прп. Силуан: «Брат есть наша жизнь»[41]. Мы не знаем, как это происходит, но постепенно сердце обучается этому. Мы не можем «контролировать» самих себя. Не логически, а единственно по состоянию нашего сердца мы судим о том, когда и в какой мере мы погрешили. Когда мы теряем благодать, то ощущаем это как следствие нашего действия, которое предшествовало. И как бороться с грехом – вот наша задача!'
      cn: 我们的心在上帝面前的成长是无法控制的（参路加福音 17:20）。我们无法逻辑地解释它（心）是如何发展，如何开始认识自己并「爱邻如己」（参马太福音 22:39）的——正如圣西卢安所说：「弟兄是我们的生命」[41]。我们不知道这如何发生，但心逐渐学习到这一点。我们无法「控制」自己。我们不是凭逻辑，而是单凭我们心的状态来判断我们何时以及在何种程度上犯了罪。当我们失去恩典时，我们感到这是我们之前行为的结果。那么，如何与罪恶搏斗——这就是我们的任务！
- type: heading1
  text:
    ru: 'Беседа 3: Об истощании[42]'
    cn: '讲论 3: 论虚己[42]'
  children:
  - type: paragraph
    text:
      ru: О гонении в России и привилегии страдать за Христа. Истощание – избрание Бога.
      cn: '关于俄罗斯的迫害，以及为基督受苦的特权。

        耗尽——上帝的拣选。'
  - type: paragraph
    text:
      ru: В самом начале этого века, когда я был еще малым мальчиком в школе, в то время настроение во всём мире было другое. И в России я чувствовал глубокий мир. Несмотря на это, когда молодой, но вдохновенный священник говорил детям о мучениках первых веков, Богу было угодно дать мне жить странную и неожиданную вещь – я сожалел, что живу в такую эпоху, когда нельзя страдать за Христа. И это переживание было очень сильным, хотя я был еще совсем мальчиком. И прошло десять-пятнадцать лет – в России началось гонение, страшнейшее из всех гонений в истории христианского мира. Странное действие благодати – апостол Павел говорит, что он сам«желал бы... быть отлученным от Христа»(Рим.9:3), лишь бы спаслись его братья. И когда я переживал мальчиком это состояние сожаления, конечно, это было в Духе Святом. Христос сказал о последних временах, что многих из вас«будут предавать в судилища»(см.Мк.13:9),«на мучения и убивать вас»(см.Мф.24:9),«но и волос с головы вашей не пропадет»без воли Бога (см.Лк.21:18). Итак, это событие – долгие семьдесят лет гонения – для меня было промыслом Бога. И многомиллионная Россия с глубоко благочестивым народом получила ту привилегию, о которой Апостол говорит:«вам дано ради Христа не только веровать в Него, но и страдать за Него»(Флп.1:29).
      cn: '在二十世纪初，当我还是个在校的小男孩时，那时全世界的氛围都与众不同。而在俄罗斯，我感受到了深刻的平安。尽管如此，当一位年轻而受圣灵感动的司祭向孩子们讲述初期教会的殉道者时，上帝却乐意让我体验到一件奇特而意想不到的事——我为此感到遗憾，因为我生活在一个无法为基督受苦的时代。这种感受非常强烈，尽管那时我还是个小男孩。


        又过了十到十五年——俄罗斯开始了迫害，这是基督徒世界历史上所有迫害中最可怕的。这是恩典奇妙的作为——使徒保罗说，他自己「宁愿自己被咒诅，与基督分离」（罗马书 9:3），只为叫他的弟兄们得救。而当我还是个男孩时体验到这种遗憾的心境，无疑，那是在圣灵里。基督论及末世时说，你们中的许多人「将被交给议会」（参马可福音 13:9），「遭受折磨并被杀害」（参马太福音 24:9），「但你们的头发一根也不会被损毁」，没有上帝的旨意（参路加福音 21:18）。


        因此，这件事件——长达七十年的迫害——对我来说是上帝的护理。于是，拥有数千万人口、且人民深具虔敬的俄罗斯，获得了使徒所说的特权：「因为你们蒙恩，不但是得以信服基督，而且要为祂受苦」（腓立比书 1:29）。'
  - type: paragraph
    text:
      ru: 'Говорю я сейчас в ответ на Ваше слово, чтобы сказать, что мы понимаем вас: вы живете такое же истощание, «кеноз», как и РусскаяЦерковь. Апостол Павел говорит об истощании Христа, что, когда оно дошло до степеней, недоступных для нас, тогда Он получил Имя, превысшее всех имен в этом веке и в будущем (см.Флп.2:9). В России мы видели полное разорение – всё было разрушено, сожжено. Сорок миллионов христиан были казнены, убиты варварским образом. И какЦерковь, мы видим и вас, доведенных в вашем истощании до последней капли крови. Но в том-то и дело, что в нашей христианской жизни это должно быть понято как избрание Бога. НашСимвол верыкончается так: «Чаю воскресения мертвых, и жизни будущего века». То, что было посеяно в бесчестии и в унижении, превратится в вечную славу (ср.1Кор.15:43). Я знаю, что я не пророк, но у меня есть чувство такое, что эпоха переменилась: с переменой положения Церкви и христианства в России наступил перелом и на всём земном шаре. И хотя ваше положение еще долго будет трудным, но все-таки это уже возрождение, ренессанс!'
      cn: 我现在回应您的话，是想说，我们理解您：你们正经历着同样的耗尽，同样的「虚己」（κένωσις），如同俄罗斯正教会一样。使徒保罗谈到基督的虚己，说，当祂的虚己达到我们所无法企及的程度时，祂便获得了超越今世和未来所有名号的名（参见腓立比书 2:9）。在俄罗斯，我们看到了彻底的毁灭——一切都被摧毁，被焚烧。四千万基督徒被处决，遭到野蛮的杀害。而作为正教会，我们也看到你们，你们的耗尽已至流尽最后一滴血的境地。但关键在于，在我们的基督徒生活中，这应当被理解为上帝的拣选。我们的信经以如下语句结束：「我期待死人的复活，以及来世的生命。」那在羞辱和屈辱中被撒播的，将转变为永远的荣耀（参阅哥林多前书 15:43）。我知道我不是先知，但我有一种感觉，时代已经改变了：随着俄罗斯正教会和基督教境况的改变，整个地球也迎来了转折点。尽管你们的处境在很长一段时间内仍将是艰难的，但这毕竟已是复兴，是文艺复兴！
  - type: paragraph
    text:
      ru: Страдания на кресте распятых становится богословием и источником дарований, недостижимых для других людей. Новый святой епископИгнатий Брянчаниновв свое время говорил, что «Крест – это кафедра наивысшего богословия»[43].
      cn: 被钉者在十字架上的苦难成为神学，以及其他人无法企及的恩赐的源泉。新圣者伊格纳提·布良恰尼诺夫主教曾说：「十字架是至高神学的教座」[43]。
  - type: paragraph
    text:
      ru: Итак, с этим сознанием мы вас встречали, и живем вас как родных, и молимся за вас в том же духе, как и за Россию, Югославию, Румынию, Болгарию и всякую другую страну, пережившую церковную катастрофу. И теперь, когда вы побыли с нами и поедете назад, я полон надежды, что ни один час вашего страдания не пройдет даром, но что именно теперь начинает из пепла воссоздаваться нашаЦерковь, но уже в большей славе духовной, чем в предыдущие века. И с этой мыслью, с этой молитвой мы отпускаем вас. Мы будем разделены снова географическим расстоянием, но единство в Духе не зависит от этих ничтожных расстояний.
      cn: 因此，带着这样的觉悟，我们迎接了你们，并视你们如亲人般相处，又以同样的精神为你们祷告，就像为俄罗斯、南斯拉夫、罗马尼亚、保加利亚以及任何其他经历过教会灾难的国家一样。而今，当你们与我们相处过后即将归去，我满怀希望，你们所受的每一刻苦难都不会白费，反而正是此刻，我们的教会正从灰烬中开始重建，并且将在属灵的荣耀上超越以往诸世纪。带着这份思绪，这份祷告，我们送别你们。我们将来会再次被地理距离所分隔，然而，在圣灵里的合一并不取决于这些微不足道的距离。
  - type: paragraph
    text:
      ru: Итак, да сохранит вас Бог и да даст вам«послужить»(см.Мк.10:45). Господь сказал:«кто хочет между вами быть первым, да будет вам рабом»(Мф.20:27). Таков характер нашего служения, и в этом смысле христианская религия отличается от всякой другой. Чем больше будем мы смиряться, тем ближе мы будем к Тому, Который«смирил Себя... даже до смерти, и смерти крестной»(Флп.2:8). И да благословит вас Бог. Ваши слезы не пропадают...
      cn: 那么，愿上帝保守你们，并愿祂使你们「服事」（参阅马可福音 10:45）。主曾说：「你们中间谁愿为首，就必作你们的仆人」（马太福音 20:27）。这就是我们事奉的性质，在这个意义上，基督宗教与任何其他宗教不同。我们越是谦卑，就越是接近那位「谦卑自己……甚至死，且死在十字架上」的（腓立比书 2:8）。愿上帝祝福你们。你们的眼泪没有白流……
- type: heading1
  text:
    ru: 'Беседа 4: О структуре монастыря[44]'
    cn: 第四讲：论修道院的结构[44]
  children:
  - type: paragraph
    text:
      ru: 'Национализм и всечеловеческий Христос. Ограничение Христа как впадение во мрак. О неприятии монастыря из-за не-национализма. Проявление всечеловеческого сознания в монастырской жизни. Универсализм христианский и нехристианский. Дух жизни, а не дисциплина: «Беспорядок – не важно». Сознание Христа как основа структуры. Чистая молитва восхищает от мелочей. Внешней аскезы мало.'
      cn: 民族主义与普世的基督。将基督受限如同堕入黑暗。论因非民族主义而不接纳修道院。普世意识在修道院生活中的体现。基督教的普世主义与非基督教的普世主义。生命之灵，而非纪律：「混乱并不重要。」基督意识作为结构的基础。纯净的祷告使人超脱于琐碎。外在的苦修不足。
  - type: paragraph
    text:
      ru: 'Кто видел Свет Нетварный и в этом Свете познал Христа Бога, уже никогда не сможет отказаться от познания, что Христос есть Истинный Бог, Создатель мира сего. Если Он – Создатель мира сего, «Имже вся быша», то как снизойдет наше мышление о Христе до идеи национальности, места рождения, времени, эпохи и так далее? Все века сотворены Им. Кто читает писания отца нашего Силуана, тот познает, что ему явился Христос. Ибо в сознании его всегда было всё человечество: он не мог ограничить Христа и сделать Его ни американцем, ни азиатом, ни европейцем, ни африканцем. Весь мир, весь космос – это есть Его дыхание, Его творческий Ум. Молитва моя о том, чтобы всем вам, пришедшим сюда, открылось это видение Христа. И тогда прекратятся всякие мелкие страсти, тогда в духе своем каждый из вас будет носить всё человечество, как отец наш Силуан: при встрече с грехом где бы то ни было он молился о спасении всего мира. И мы живем Христа как Бога-Создателя и Бога-Спасителя Мира.'
      cn: 谁见过那非受造之光，并在这光中认识了基督上帝，就再也无法拒绝这个认识，即基督是真上帝，是这世界的创造者。若祂是这世界的创造者，「万物皆因祂而有」，那么我们关于基督的思想怎会降格到国籍、出生地、时间、时代等等的概念呢？所有世代都是由祂所造。凡是阅读我们的父亲圣西卢安著作的，就会认识到基督曾向他显现。因为在他的意识中，全人类始终存在：他不能限制基督，使祂成为美国人、亚洲人、欧洲人或非洲人。整个世界，整个宇宙，都是祂的气息，祂那创造性的心智。我祈祷，愿所有来到此处的你们，都能够开启这种对基督的异象。那么所有琐碎的激情就会止息，那么你们每一个人，都将在自己的心灵中怀抱全人类，如同我们的父亲圣西卢安一样：无论在何处遭遇罪恶，他都会为整个世界的得救而祈祷。而我们则活出基督，作为创造万有之上帝和拯救世界之上帝。
  - type: paragraph
    text:
      ru: 'Я пришел говорить сегодня о структуре нашего монастыря. Во всём я стараюсь иметь основанием блаженного старца Силуана, великого богослова. После видения Христа ему была дана молитва за весь мир как за самого себя[45]. Мы, которые раздавлены и сведены до нуля сознанием индивидуальности, не можем понять его: мы боремся за мелочи. Но надо стяжать Христа-Бога, Который равен Отцу (см.Ин.10:30), Который единственно приводит нас к Отцу, и нет другого пути, как только через Него и в Нём (см.Ин.14:6).'
      cn: 我今天来谈谈我们修道院的结构。在凡事上，我都努力以蒙福的圣西卢安长老，这位伟大的神学家为根基。在看见基督后，他蒙赐了为整个世界如同为他自己一般的祷告[45]。我们这些被个体意识压碎并归零的人，无法理解他：我们为小事而争斗。但我们必须获得基督上帝，祂与父平等（参阅约翰福音 10:30），祂是唯一引我们到父那里去的，并且没有别的道路，唯独藉着祂并在祂之内（参阅约翰福音 14:6）。
  - type: paragraph
    text:
      ru: 'Хотя я говорю на русском языке, потому что мне так легче и ум мой не останавливается на искании слов, но перевести всё равно надо. Трудность нашего монастыря в том, что мы хотим сохранить вселенское, «всекосмическое» видение. И на каком языке мы будем говорить об этом?! Грубо говоря, я теперь не знаю Христа ни греческого, ни русского, ни английского, ни арабского, «ни... ни... ни...». Христос для меня всё – и всекосмическое, и сверхкосмическое бытие. Перед моей смертью я умоляю вас: оставьте всякую мелочь, устремите свой ум только к этому Христу. И тогда наш монастырь будет тем, чем мы хотим его видеть: местом и школою ко спасению вечному, где мы научаемся быть подобными Ему.'
      cn: 尽管我讲俄语，因为那样对我来说更容易，我的心智也不必停滞于寻词觅句，但无论如何还是要翻译。我们修道院的难处在于，我们渴望保存普世的，「全宇宙的」愿景。那么我们用什么语言来谈论这个呢？！粗略地说，我如今不认识一个希腊的基督，也不认识一个俄罗斯的、英国的、阿拉伯的基督，「无论是……还是……还是……」。基督对我而言是万有——既是全宇宙的，也是超宇宙的存有。在我离世之前，我恳求你们：舍弃一切琐碎之事，只将你们的心智专注在此基督身上。如此，我们的修道院就将成为我们所期望她成为的样子：一个通往永恒救恩的场所和学府，在那里我们学习效法祂。
  - type: paragraph
    text:
      ru: Писание много раз говорит о том, что Господь умер за весь мир, за грехи всего мира (см.Ин.1:29). И когда мы вносим ограничения в этого Христа, то теряем положительно все и впадаем во мрак. Начинается мрак ненависти между национальностями, вражда между социальными положениями и так далее.
      cn: 圣经多次说到，主为整个世界、为整个世界的罪而死 (参阅 约翰福音 1:29)。当我们给这位基督设下限制时，就确实失去了一切，并陷入黑暗。随之而来的是各民族之间的仇恨的黑暗，各社会阶层之间的敌对，等等。
  - type: paragraph
    text:
      ru: 'Читайте старца Силуана, где он говорит, что в этом мире у всех свое послушание: один – царь, другой – патриарх, третий – учитель или профессор, четвертый – рабочий[46]. «И это всё неважно»[47]: быть царем или быть рабочим – для старца нет разницы. Важно – кто больше любит Христа, кто «усваивает» Его, по слову Апостола:«Ибо в вас должны быть те же чувствования, какие и во Христе Иисусе»(Флп.2:5). То есть сами мы все должны носить глубоко в себе сознание, которое видим во Христе, и жить мир, как Адама, и молиться за всего Адама. Вот настоящее христианство православное! И умоляю вас: не отдайте никому этого Христа истинного, Творца всего мира и Спасителя Бога! Если вы Христа сведете до уровня национальности, то знайте, что вы во тьме. Можно видеть реальности жизни, разделяющие нас, но эти разделения могут быть преодолены человеческим усилием; а сознание Христа Бога дается Духом Святым.'
      cn: 请阅读圣西卢安长老的话，他说道，在这个世界上，人人都各司其顺服之责：一人是君王，一人是宗主教，一人是教师或教授，一人是工人[46]。「而这一切都不重要」[47]：无论是做君王还是做工人，对长老而言都没有区别。重要的是谁更爱基督，谁「融汇」祂，正如使徒所言：「你们当以基督耶稣的心为心」（腓立比书 2:5）。也就是说，我们所有人都应当将我们在基督里所看见的意识深藏于己心，并且如同亚当般地活在世上，为全人类祷告。这才是真正的东正教基督教信仰！我恳求你们：不要将这真正的基督，这位全世界的创造主和救主上帝，交给任何人！如果你们将基督降格为民族层面，那么你们要知道，你们是在黑暗中。我们可以看到生命中那些使我们分裂的实相，但这些分裂可以借着人的努力得以克服；而对基督上帝的意识，则是由圣灵所赐予的。
  - type: paragraph
    text:
      ru: Почему я говорю об этом сегодня, имея в виду структуру нашего монастыря? – Вы из опыта видите, как мало народу нас признает... За что такое отвержение? За то, что наш Христос есть беспредельный Бог? За то, что Он распинался не только за верующих, но и за всех человеков от Адама и даже до последнего, рожденного женою? За это нас отвергать? Но знайте еще то, что чем ближе мы к стопам Христа, идущего на Голгофу положить Свою жизнь за весь мир, тем меньше около нас людей.
      cn: 我今天为何谈及此事，考虑到我们修道院的结构？——你们从经验中看到，承认我们的人何其稀少……为何有如此的弃绝？是因为我们的基督是无限的上帝吗？是因为祂被钉十字架，不仅是为了信徒，也是为了自亚当以来所有的人，甚至是为了那由妇人所生的最后一个吗？要为此弃绝我们吗？但你们还要知道，我们越是靠近基督的脚踪，祂正走向各各他，为整个世界舍弃自己的生命，我们身边的人就越少。
  - type: paragraph
    text:
      ru: 'И когда я вижу вас, несколько человек, которые пришли сюда, привлеченные духом старца, блаженного Силуана, я радуюсь глубокой радостью. Однако я буду еще более глубоко радостен и уже неумирающей радостью, если вы усвоите то, что было дано явлением Христа блаженному Силуану. Задачу нашего монастыря я понял как помощь людям, которые читают слепо «Старца Силуана», совершенно не понимая, что этот человек получил дар ипостасной молитвы и всегда молился за весь мир. Итак, это учение старца лежит в основе нашего монастыря. Тех, кто приходит сюда, умоляю: усвойте дух нашего отца – Силуана! Тогда Нетварный Свет осенит вас, и в этом Свете вы увидите божественную беспредельность и невозможность свести Христа ни до какой другой формы, кроме Бога Абсолюта, Творца мира, неба и земли.'
      cn: 当我看到你们这些少数几位因着长老、真福西路亚的灵所吸引而来到这里的人时，我心中充满了深深的喜悦。然而，如果你们领受基督向真福西路亚显现时所赐予的一切，我将会更加深深地喜乐，并且拥有永不衰竭的喜乐。我将我们修道院的任务理解为帮助那些盲目阅读《长老西路亚》的人，他们完全不明白这个人获得了位格祷告的恩赐，并且总是为整个世界祷告。因此，这位长老的教导构成了我们修道院的基础。我恳求那些来到这里的人：领受我们父——西路亚的灵！届时，非受造之光将荫庇你们，并且在这光中，你们将看见神性的无限，以及基督除了是绝对的上帝、世界、天上和地上的创造主之外，不可能被归结为任何其他形式。
  - type: paragraph
    text:
      ru: Когда мы стоим перед задачей – создать такой монастырь, куда приходят люди, рожденные в разных странах, говорящие на разных языках, – то, конечно, практически мы имеем много трудностей. Но вы, все и каждый, помогите мне построить монастырь такого сознания! Читайте Св. Иоанна Богослова, который говорит, что Христос умер за весь мир,«загрехивсего мира»(1Ин.2:2)! В Евангелии самаряне сказали:«сами слышали и узнали, что Он истинно Спаситель мира, Христос»(Ин.4:42). То же вы видите и у апостола Павла, который говорит о том, что«нет уже Иудея, ни язычника... нет мужеского пола, ни женского»(Гал.3:28. ср.Кол.3:11), а«кто во Христе,тотновая тварь»(2Кор.5:17). Эта цель стоит перед нами.
      cn: 当我们面临一项任务——创建这样一个修道院，汇聚着生于不同国家、讲着不同语言的人们——那么，我们当然会在实践中遇到许多困难。但是，你们每个人，各位，请帮助我建造一个具有如此意识的修道院！请阅读圣约翰神学家所言，他说基督为整个世界而死，「为普世的罪」（约翰一书 2:2）！在福音书中，撒马利亚人说：「我们亲自听见了，知道这真是世界的救主，基督。」（约翰福音 4:42）。同样，你们也能在使徒保罗那里看到，他说：「不再有犹太人，也不再有希腊人……不再有男，也不再有女。」（加拉太书 3:28；参看 歌罗西书 3:11），而是「若有人在基督里，他就是新造的人。」（哥林多后书 5:17）。这个目标就摆在我们面前。
  - type: paragraph
    text:
      ru: Если мы полагаем эту мысль в основу нашего монастыря, то рождается огромное число мелких недоразумений у людей, которые отказываются от этого принципа, от нашей веры. Сколько раз я слышал о том, что кто-то из братьев или сестер недоволен тем, что служба будет на том или ином языке, вместо того чтобы сделать усилие и понять Литургию вообще и выучить языки. Тогда отпадут все мелочи. Тогда возможно будет единство наше во Христе. А иначе мы не воспримем такого Христа, как Сам Он хочет:«Видевший Меня видел Отца»(Ин.14:9). Когда мы «видим Отца во Христе», то видим в Нем Создателя мира сего, космоса, и наше мышление сплошь меняется.
      cn: 如果我们把这个思想作为我们修道院的基础，那么在那些拒绝这一原则、拒绝我们信仰的人们那里，就会产生大量的细小误解。我听过多少次，有弟兄或姊妹不满意礼仪要用这样或那样的语言，而不是努力去理解普世的圣礼，并学习这些语言。这样一来，所有细枝末节都会消失。这样我们的合一才可能在基督内实现。否则，我们就无法按祂自己所希望的方式来领受基督：「看见我的，就是看见了父」（约翰福音 14:9）。当我们「在基督内看见父」时，我们就会看见祂是这世界、是宇宙的造物主，我们的思想就会彻底改变。
  - type: paragraph
    text:
      ru: 'Я не встретил, чтобы кто-нибудь возражал прп.Симеону Новому Богослову, когда тот говорит, что через покаяние постепенно открываются для нас двери познаний Божественного мира[48]. Итак, путь к познанию этого Божественного мира лежит прежде всего через веру и любовь ко Христу и покаяние. Когда мы видим Христа, как Он есть, тогда мы начинаем видеть нас самих, какие мы маленькие, ничтожные грешники, и начинаем рыдать о себе. И по мере наших рыданий рождается в нас любовь ко всему миру, уничтожаются разделения, и всё становится едино во Христе. Итак, из опыта нашего мы увидели, что надо носить в себе прежде всего именно это сознание и тогда уже говорить о других предметах. Иначе, если мы и соблюдем всякую внешнюю дисциплину и порядок, сознание у нас будет «иудейское». То есть: иудеи«не вошли в преторию, чтобы не оскверниться, но чтобы можно было есть пасху»(Ин.18:28); они же отвергли Христа как Мессию и Спасителя мира, потому что Он пришел для всего мира, а не для них – для одних евреев. Как они откололись от Христа? – Они хотели Христа только для себя.'
      cn: 我从未见过有人反对圣西缅新神学家，当他说道，借着悔改，神圣世界知识的大门便会逐渐为我们敞开[48]。因此，认识这神圣世界的道路，首先在于通过对基督的信心与爱，以及悔改。当我们看到基督，祂的真貌时，我们便开始看到我们自己是多么渺小、卑微的罪人，并开始为自己哀哭。而随着我们的哀哭，我们心中便生出对全世界的爱，分裂被消除，万物在基督里合而为一。因此，从我们的经验中我们看到，首先必须在自己里面怀有这种意识，然后才能谈论其他事物。否则，即使我们遵守了一切外在的纪律与秩序，我们的意识仍将是「犹太式的」。也就是说：犹太人「他们自己却不进入总督府，免得沾染污秽，而能吃逾越节的筵席」（约翰福音 18:28）；他们却拒绝了基督是默西亚和世界的救主，因为祂是为全世界而来，而不是为他们——只为犹太人而来。他们是如何从基督那里分裂出去的呢？——他们只想要基督为他们自己。
  - type: paragraph
    text:
      ru: Я говорю сейчас с болью в сердце, но я не хочу, чтобы у вас болело сердце так, как у меня, а хочу, чтобы вы радовались тому, что вы нашли место, где мы можем свободно говорить о великом Боге нашем – Христе.
      cn: 我此刻心怀伤痛而言，但我不想让你们的心像我一样伤痛，而是希望你们能因找到一个地方，可以自由地谈论我们伟大的上帝——基督而欢欣雀跃。
  - type: paragraph
    text:
      ru: Существует так называемый «универсализм видения», который «в одну корзинку» складывает и Христа, и Будду, и Магомета, и Конфуция, и других – как великих или малых «учителей человечества». Одно время я сам увлекся этой идеей. Но мне вожделенно сознание Христа (ср.1Кор.2:16), Который носит в Себе весь этот мир. И в этом – универсализм христианской персоны.
      cn: 存在着一种所谓的「普世观」，它将基督、佛陀、穆罕默德、孔子以及其他——无论是伟大还是渺小的「人类导师」——都归入同一个篮子。一度，我本人也曾沉迷于这个理念。但我所渴求的是基督的意识（参见哥林多前书 2:16），祂在自身内承载着这整个世界。而这正是基督徒位格的普世性所在。
  - type: paragraph
    text:
      ru: Итак, в структуру нашей жизни постарайтесь положить то, что я сейчас сказал. Слово о Христе не имеет конца, не имеет границ (ср.Ин.21:25), и сегодня я хотел сказать несколько слов простых и понятных, чтобы нам жить по-христиански.
      cn: 所以，请努力将我刚才所说的，融入我们生命的结构之中。论基督之道无止境，无边际（约翰福音 21:25），而今天我希望能说几句简单明了的话，好使我们能按基督的方式生活。
  - type: paragraph
    text:
      ru: 'Научаются люди в общежитии тому, что через послушание они начинают постигать психологию других людей. Итак, научиться жить с одной матерью N. или матерью NN. – значит, научиться жить с миллионами подобных им людей, потому что среди миллиарда людей есть многие такие, как они. И так в общежитии можно превзойти всякие мелочи: царь я или столяр – это не важно. Важно сознание, что Христос есть Бог; и кто любит Его, тот в вечности будет рядом с Ним –«там, гдеОн» (см.Ин.12:26).'
      cn: 人们在修道团体生活中学习到的是，通过顺服，他们开始领悟他人的心理。因此，学习与一位N修女或NN修女一同生活，意味着学习与数百万像她们一样的人一同生活，因为在十亿人中，有许多人像她们一样。如此，在修道团体生活中就可以超越一切琐碎之事：我是君王还是木匠——这不重要。重要的是这种认知，即基督是上帝；凡爱祂的，在永恒中将与祂同在——「祂在哪里」（约翰福音 12:26）。
  - type: paragraph
    text:
      ru: 'Когда кто-либо приходит в наш монастырь, имея опыт других монастырей, у него может возникнуть идея, что у нас беспорядок и нет дисциплины. И я вовсе не хвалюсь, что у нас нет дисциплины или что у нас есть дисциплина: это – малый вопрос. Но как сохранить дух жизни – вот вопрос, стоящий перед нами...'
      cn: 当有人带着在其他修道院的经验来到我们修道院时，他可能会觉得我们这里杂乱无章，没有纪律。我丝毫不是在夸耀我们没有纪律，也不是在夸耀我们有纪律：这是一个小问题。但如何保持生命的灵性——这才是摆在我们面前的问题……
  - type: paragraph
    text:
      ru: Все дни и ночи я провожу в ожидании дня моего ухода. Я не знаю, что меня удерживает, но, я думаю, то, что вы еще недостаточно стали православными христианами и в вас живут разделения, неприязни и споры. Апостол Павел говорит, что хотя и бывают споры, в которых нажимают и преобладают, но лучше претерпеть обиду, чем обижать (см.1Кор.6:7). И если у нас будет дерзновение нести немощи нашего брата (ср.Гал.6:2), то при таком духе, конечно, останется единство. Итак, кто бы из вас ни думал, что у нас много беспорядка, помните, что это не важно! – Важно, чтобы было у нас полное сознание того, что мы в Духе Христа Бога. И тогда, как св. Иоанн Богослов говорит, между нами есть единение в общении духовном (см.Ин.17:23). А иначе будет с нами то, что случается в миру, и особенно в образованной среде, где царит страшное одиночество. Там каждый человек, стяжавший свое мировоззрение, дорожит им. И когда его мировидение не совпадает с другими, они не могут жить вместе. Но вы «будьтекак дети»(см.Мф.18:3), которых можно смешать и они сразу начинают быть в общении.
      cn: 我昼夜都在等候我离去的日子。我不知道是什么在羁留着我，但我认为，是你们还未充分成为东正教基督徒，并且在你们里面存有分裂、不睦和争论。使徒保罗说，尽管会有争论，其中有人强压和占优势，但与其伤害别人，不如忍受伤害 (参阅哥林多前书 6:7)。如果我们有勇气担当我们弟兄的软弱 (参阅加拉太书 6:2)，那么在这种精神下，合一必将存留。所以，无论你们中谁认为我们有诸多混乱，请记住，那不重要！——重要的是，我们必须充分意识到我们处于基督上帝的圣灵之中。这样，正如圣约翰神学家所说，我们之间在属灵的交通中便有了合一 (参阅约翰福音 17:23)。否则，我们就会像世俗世界，尤其是在知识分子圈中那样，那里弥漫着可怕的孤独。在那里，每个人都珍视自己所形成的、独有的世界观。当他的世界观与他人不合时，他们便无法共处。但你们要「像小孩子一样」(参阅马太福音 18:3)，他们可以被混在一起，立刻就能开始彼此交通。
  - type: paragraph
    text:
      ru: 'Итак, настоящая структура внутренняя строится таким порядком: мы веруем во Христа, распятого за грехи всего мира, как воплотившегося Сына Отчего, как воспринявшего наш образ бытия, и любим Его. И когда мы хотим соблюсти заповеди Его, то будем, рыдая на каждую ночь, просить Его дать нам силу идти вслед за Ним, а не за миром сим. Мы отошли от этого мира, потому что этот мир живет во вражде, во мраке...'
      cn: 那么，这真实的内部结构是这样建立起来的：我们信仰基督——祂为普世罪孽被钉十字架，作为道成肉身的父之子，取了我们存在的样式，并且爱祂。并且当我们想要遵守祂的诫命时，我们将每晚哭泣着祈求祂，赐予我们力量去追随祂，而非追随这世界。我们已经脱离了这个世界，因为这个世界活在仇恨之中，在黑暗之中……
  - type: paragraph
    text:
      ru: 'О главном я сказал: какое у нас должно быть настроение духовное. И тогда даже наша неорганизованная жизнь все-таки будет удобною для молитвы и для плача. А если мы введем какую-то дисциплину, если мы начнем отделяться друг от друга, потому что кому-то не нравится чей-то характер, то монастырь наш не будет иметь никакой цены. И я вовсе не хотел создавать такого монастыря, где были бы споры и мелкие человеческие расчеты...'
      cn: 关于主要的事情我已经说过：我们应该拥有怎样的属灵心境。这样一来，即使我们未加规整的生活，仍然会便利于祷告和哀哭。但如果我们实行某种规训，如果我们开始彼此隔离，只因有人不喜欢别人的性格，那么我们的修道院将毫无价值。我绝不想创立一个充满争执和细小属人算计的修道院……
  - type: paragraph
    text:
      ru: 'Когда я предложил вам спросить меня что-нибудь, то из вашего ответного молчания я уразумеваю смысл слов Христа, Который сказал:«в тот день вы не вопросите Меня ни о чём»(Ин.16:23). Когда весь наш ум обращен к Богу, то отпадают все вопросы. Вопрос только один: «Как вместить в себя этот дух и носить его?»'
      cn: 当我邀请你们向我提问时，你们的回应是沉默，从中我领悟了基督的话语的含义，祂曾说：「在那日，你们将一无所求于我」（约翰福音 16:23）。当我们所有的心思都转向上帝时，所有的疑问都消失了。问题只有一个：「如何将这灵容纳于自身并持守它？」
  - type: paragraph
    text:
      ru: 'Устремляя наш дух к единому Богу, мы можем достигнуть состояния чистой молитвы. А когда молитва становится чистою, тогда в человеке рождается видение иного порядка: всё, что он воспринял в этом мире – будь то из личного опыта или из школьного учения, – всё оставляется, всё «перешагивается». В состоянии чистой молитвы человек не знает ни своего возраста, ни социального, ни даже иерархического положения своего. Но он молится как вечный ум Первому Вечному Уму. И все эти мелочи – превзойдены... Когда мы вводимся в иную форму бытия, то мы живем в ней и знаем это через самую жизнь.'
      cn: 将我们的精神导向独一的上帝时，我们就能达到纯粹祷告的状态。而当祷告变得纯粹时，那时在人里面便生发出一种超越世俗的异象：凡他在这个世上所领受的一切——无论是来自个人经验，还是来自学校的教导——一切都被放下，一切都被「跨越」。在纯粹祷告的状态中，人不知道自己的年龄，也不知道自己的社会地位，甚至连自己的圣职等级也不知道。但他祷告，如同一个永恒的心智向着那首先的永恒心智。所有这些细枝末节——都被超越了…… 当我们被引入另一种存在形式时，我们便活在那其中，并通过那生命本身而认识它。
  - type: paragraph
    text:
      ru: 'Силуан увидел Христа, будучи почти безграмотным солдатом. И в каком он состоянии потом? – Полвека молитвы за весь мир: «Господи, дай всему миру познать Тебя Духом Твоим Святым»[49]. Но мы не можем чистой молитвы достигнуть иным путем, как только покаянием. Всякий акт, при котором мы отвергли Христа, отошли от Него, для нас становится поводом к глубокому плачу и покаянию. И через этот путь покаяния, очищаясь от всякой греховной страсти, мы вдруг становимся способными войти в область Божественного света. И тогда сразу открывается другая картина. Я вовсе не думаю за короткий час представить вам всё. Есть многие аспекты в богословской сфере, о которых мы можем говорить. Но прежде всего – вы, которые пришли сюда, имейте в уме своем и в сердце своем влечение ко Христу, Который восходит на Голгофу, чтобы разрушить клятву падшего Адама – всего Адама, а не только евреев, и не только русских, или французов, или другого народа, но всего мира. И тогда ничто иное уже вас не привлечет...'
      cn: 西鲁安在还是一个几乎不识字的士兵时，就看见了基督。之后他处于何种境况呢？——他为普世持续了半个世纪的祈祷：「上主，愿祢以祢的圣灵，使全世界都认识祢」[49]。然而，我们无法达到纯洁的祈祷，除悔改以外，别无他途。每一个我们在其中弃绝了基督、远离了祂的行为，对我们而言，都成为深刻痛哭与悔改的缘由。借着这条悔改的道路，洁净了我们一切罪恶的私欲，我们便忽然能够进入神圣光明的领域。于是，另一幅景象便即刻展现。我绝不认为能在短短一小时内，向你们呈现所有的一切。在神学领域中，有许多层面我们可以谈论。然而，首先——你们这些来到这里的人，在你们的思想和内心深处，要对基督怀有渴慕，祂登上髑髅地，为要解除堕落亚当的咒诅——是整个亚当，而不单单是犹太人，也不单单是俄罗斯人、法国人，或其他民族，而是整个世界。于是，再没有其他事物能够吸引你们了……
  - type: paragraph
    text:
      ru: И да даст Бог всем вам и каждому удержать эту настоящую веру. Не дайте никому украсть у вас это сознание! Оно дано нам Духом Святым. Молиться за весь мир и любить врагов – вовсе не ересь, как часто слышишь от людей, которые благочестие сводят к соблюдению постов или каким-нибудь другим внешним проявлениям аскезы. Этого мало и совсем не хватает. Надо переродиться в самой основе нашей...
      cn: 愿上帝赐予你们所有人以及每一个人持守这真实的信仰。不要让任何人从你们那里窃取这份觉悟！它乃由圣灵赐予我们。为整个世界祈祷并爱我们的仇敌——这绝非异端，如同你常听那些将虔敬归结为遵守斋期或任何其他苦修的外在表现的人所说的那样。这远远不够，也完全不足。我们必须在我们自身的根基上彻底重生……
- type: heading1
  text:
    ru: 'Беседа 5: Образ Иисуса Христа[50]'
    cn: 第五讲：耶稣基督的形象[50]
  children:
  - type: paragraph
    text:
      ru: 'О начертании образа на сердцах. Подвиг-мысль Христа – разорвать клятву Адама. Расширение сердца через заповеди Христа. Следовать и уподобиться Христу – значит изменить сознание. Опыт прп. Силуана: неистощимое вдохновение, превосходящее уставы. Вдохновение зависит не только от Бога, но и от нашего расположения. Об уподоблении Христу прп. Силуаном. О духовничестве и сердечном восприятии. Пребывать умом со Христом. Как бороться с помыслом.'
      cn: '论形象铭刻于心。

        基督的功勋思想——废除亚当的咒诅。

        通过基督的诫命拓展心灵。

        跟随并效法基督——意味着改变意识。

        圣西卢安长老的经验：取之不尽的灵感，超越规章。

        灵感不仅取决于上帝，也取决于我们的心意。

        关于圣西卢安长老对基督的效法。

        关于属灵指导和内心的领受。

        意念与基督同在。

        如何与意念争战。'
  - type: paragraph
    text:
      ru: 'Вот, предо мною сейчас довольно много присутствующих людей, но слово мое, по моей первой мысли, обращается к тем новым, молодым людям, которые пришли к нам и хотят с нами разделить труд монашеского пути. Прошу вас, имейте в виду, что слово мое сегодня предназначено для начальных монахов, а не для тех, кто уже много пережил и знает сам лучше меня. На сегодня моя идея: написать образ Иисуса Христа на ваших умах и в ваших сердцах.'
      cn: 看，现在在我面前有相当多的在在场之人，但我的话，依我最初的想法，是向着那些新来的、年轻的人，他们来到我们这里，并希望与我们分担修道之路的辛劳。请你们留意，我的话语今天是为了初学修士而设，而不是为了那些已经经历许多、比我更了解的人。今天我的想法是：将耶稣基督的圣像描绘在你们的意念中和你们的心里。
  - type: paragraph
    text:
      ru: '«О, несмысленные Галаты! кто прельстил вас не покоряться истине, вас, у которых перед глазами предначертан был Иисус Христос... у вас распятый? Сие только хочу знать от вас: через дела ли закона вы получили Духа, или через наставление в вере?»(Гал.3:1–2) Этими словами апостол Павел напоминает о своем намерении начертать образ Христа на умах и в сердцах галатов (ср.Гал.4:19). Конечно, я хотел бы присутствовать тогда там, когда вдохновенный апостол Павел говорил о Христе. В послании своем он не повторяет сказанного прежде, но мы понимаем, что он зажег небесным огнем сердца галатов, так что галатскаяцерковьстала одним из важных камней в строении христианской Церкви.'
      cn: «哦，愚昧的加拉太人哪！谁迷惑了你们，使你们不顺从真理呢？你们的眼前，耶稣基督已经活画在你们中间，被钉十字架了。我只愿从你们知道这一件事：你们受了圣灵，是因行律法呢？还是因听信福音呢？» (加拉太书 3:1-2) 使徒保罗用这些话提醒他们，他的意图是将基督的形象铭刻在加拉太人的心智与心灵之中 (参阅 加拉太书 4:19)。当然，我真希望当时能在那里，聆听受圣灵感动的使徒保罗宣讲基督。在他的书信中，他并未重复之前所说的话，但我们明白，他以天上的火焰点燃了加拉太人的心，以致加拉太教会成为基督教会建造中一块重要的基石。
  - type: paragraph
    text:
      ru: 'И теперь я хотел бы перед своей смертью молодым моим братьям и сестрам нарисовать на сердцах и умах их образ Христа – так, как Бог дал мне. Вы знаете выражение псалмопевца:«Разжжено слово Твое зело»(Пс.118:140). Вы видите меня в повседневности как развалину, но мне придется пользоваться словами все-таки Писания, а слова Писания как разожженный металл. Я не без страха говорю о том, что я хочу сделать, помышляя Бога-Отца, Который, по словам Самого Иисуса Христа, призывает нас к Сыну Своему. Как говорит Сам Христос:«Никто не может придти ко Мне, если не привлечет его Отец, пославший Меня; и Я воскрешу его в последний день»(Ин.6:44). Итак, в тех пределах, в которых Господь Бог, Отец наш, начертал и во мне образ Христа, я и дерзаю говорить вам. Как всегда, предо мною остается непреодолимая трудность говорить о Боге, потому что это – безбрежный океан. Поневоле приходится брать только некоторые моменты из святой жизни, которую дает нам Дух Святой в Церкви Христовой. И вот сейчас я во власти слова, которое говоритЦерковьо Христе: «Иже в шестый день же и час на кресте пригвождей в раи дерзновенный Адамов грех». Так слова Церкви рисуют«Человека Иисуса Христа»(ср.Рим.5:15), восходящего на Голгофу.'
      cn: 现今，在我临终前，我愿将基督的形象绘于我年轻的弟兄姐妹之心灵与思想中——正如上帝所赐予我的。你们知道诗篇作者的话语：「祢的话语极其精纯」（诗篇 118:140）。在日常生活中，你们视我如同朽坏之物，然而，我仍需引用圣经的话语，因为圣经的话语如同被烧红的金属。我怀着敬畏之心谈论我所欲行之事，思及圣父上帝，祂，按照耶稣基督自己的话语，召呼我们归向祂的圣子。正如基督自己所言：「若不是差我来的父吸引人，就没有人能到我这里来；到我这里来的，在末日我要使他复活」（约翰福音 6:44）。于是，在那限度内，即我们的父上主上帝已在我心中铭刻下基督的形象，我便敢于向你们宣说。一如既往，在我面前，谈论上帝仍是一项难以逾越的艰难，因为祂是无垠的海洋。不得已，我只能撷取圣洁生命中的一些片段，这圣洁生命是由圣灵在基督的教会中赐予我们的。现今，我被教会所宣说关于基督的话语所掌控：「在第六日第六时辰，祂被钉于十字架上，将亚当在乐园中僭妄的罪钉死。」于是，教会的话语描绘出「人耶稣基督」（参罗马书 5:15），攀上髑髅地（哥耳哥达）。
  - type: paragraph
    text:
      ru: Один из дорогих сердцу нашему святых, епископИгнатий Брянчанинов, подчеркивает замечательную вещь о том, что Господь, совершая сей Свой путь на Голгофу, имел пред Собою только Отца. И когда Он молился о чаше (см.Мф.26:39;Мк.14:36;Лк.22:42, и др.), то Он не думал о людях, которые приготовили Ему всякую скорбь, печаль, поругание, боль, распятие, позорную смерть, а всё это Он назвал чашею, которую дает Ему Отец[51]. Представляете себе, что Господь в те дни, величайшие в истории мира, думал только об Отце, и весь разговор Его был с Отцом; но подвиг Его был за всего Адама. Теперь можно мыслить о Нём как о единственном на всей Земле «Человеке».
      cn: 我们心中珍爱的一位圣徒，主教伊格纳季·布良恰尼诺夫，强调了一件非凡之事，即上主在行祂上髑髅地之路时，心中只有天父。当祂为那杯祷告时（参阅 马太福音 26:39，马可福音 14:36，路加福音 22:42, 等），祂没有去思想那些为祂预备了各种忧伤、悲痛、凌辱、痛苦、钉十字架、耻辱的死亡的人，而这一切祂都称之为天父赐予祂的杯[51]。试想，在那些世界历史上最伟大的日子里，上主心中只有天父，祂所有的交谈都只与天父进行；但祂的功绩却是为所有的亚当。现在，我们可以将祂视为全地上唯一的「人」。
  - type: paragraph
    text:
      ru: Меня эти слова поразили, когда я услышал их в церкви. В тот момент безвидно, но всё же как человека, я видел Христа, восходящего на Голгофу с этой мыслью. С какой мыслью? – Разорвать клятву, которую навлек на всю Землю грех Адама (см.Рим.5:18;1Кор.15:21–22). Адама мы мыслим как начало всего человеческого рода (см.1Кор.15:45). И если Апостол говорит, что мы должны иметь те же мысли, какие мы видим во Христе Иисусе (см.Флп.2:5), то и мы будем видеть глазами Христа весь мир во времени и пространстве, от Адама до последнего человека, имеющего родиться от жены в сей мир (ср.Гал.4:4).
      cn: 当我在教会中听到这些话时，它们使我深受震撼。那一刻，无形地，但我仍作为一个世人，看见基督怀着这个念头登上各各他。怀着怎样的念头？——乃是为要废除因亚当的罪而降临在全地的咒诅（参罗马书 5:18，哥林多前书 15:21-22）。我们视亚当为全人类的开端（参哥林多前书 15:45）。倘若使徒说，我们当持有在基督耶稣里所见的同样心思（参腓立比书 2:5），那么我们也将以基督的眼睛看待整个世界，在时间与空间之中，从亚当直到将由妇人降生于世的最后一人（参加拉太书 4:4）。
  - type: paragraph
    text:
      ru: Перейдем на другой аспект. И«пример»Христа (см.Ин.13:15), и заповеди Его, и особенно«любите врагов ваших»(см.Мф.5:44;Лк.6:27–28) – расширяют наше сердце и ум, и мы видим уже всё человечество как единую историю, с которою тесно связана и наша личная жизнь. И если нам помогает Господь так расширить наше сердце, что мы носим в себе всё человечество, то тогда получится, что мы переходим в состояние сотворенного Богом человека. Как Господь говорит в Писании:«сотворим человека по образу Нашему [и] по подобию»(Быт.1:26).
      cn: 让我们转向另一个方面。基督的「榜样」（参见约翰福音 13:15），祂的诫命，尤其是「爱你们的仇敌」（参见马太福音 5:44，路加福音 6:27-28），拓展我们的心智，并且我们已经看到全人类是一个统一的历史，而我们个人的生命也与这历史紧密相连。倘若上主帮助我们如此拓展我们的心，使我们内心怀有全人类，那么我们就会进入上帝所造之人的状态。正如上主在圣经中所说：「我们要照着我们的形象，按着我们的样式造人」（创世记 1:26）。
  - type: paragraph
    text:
      ru: 'В свое время апостол Павел, говоря о таком Христе, Который берет на Себя грехи всего мира, тем самым зажег сердца галатов на всю жизнь и даже после смерти. Тем самым он положил основной камень и нашей жизни – и в наших сердцах должен отразиться силою Духа Святого призыв Отца, согласно со словом Христа:«Никто не может придти ко Мне, если не привлечет его Отец»(Ин.6:44). То есть, чтобы по-настоящему иметь христианское сознание, мы, конечно, должны следовать за Христом, следовать с молитвою к Богу, к Духу Святому, Царю Небесному: «Прииди и вселися в ны, настави ны на всякую истину, привлеки сердца наши к горней любви, и спаси, Блаже, души наша».'
      cn: 当时，使徒保罗谈到这样一位背负世人罪孽的基督，从而点燃了加拉太人终其一生甚至死后的心。借此，他也为我们的生命奠定了基石——圣灵的能力也必将使父的呼召反映在我们的心中，遵照基督的话语：「若不是差我来的父吸引人，就没有能到我这里来的。」 (约翰福音 6:44)。也就是说，为了真正拥有基督徒的意识，我们当然应该跟随基督，以祷告跟随上帝，跟随圣灵，天上的君王：「降临并居住在我们里面，引导我们进入一切真理，吸引我们的心归向那属天的爱，并拯救我们的灵魂，至善者。」
  - type: paragraph
    text:
      ru: 'До Христа и вне Христа, за всю историю мира, никто другой нас этому не учит. Я хочу сказать вам, что был такой момент, когда эти слова дошли до моего сердца «иным порядком», исходящим от Самого Бога... О, если бы мне удалось, при моем жалком ныне состоянии, которое вы знаете и видите, помочь вам глубоко в сердце воспринять этот Образ, чтобы ваша монашеская жизнь навсегда исполнилась вдохновения свыше! Вся наша жизнь становится другою: не по внешности своей – внешне ничего нет, – а только по внутреннему сознанию нашему, которое нам дается по благодати Духа Святого. Жить всего Адама – очень многим покажется какой-то философской фантазией; но, конечно, не об этой философии идет речь в Евангелии. Это – состояние Христа, Который Сам, являясь и Творцом человека, и облекшись в нашу рабскую форму бывания, действовал в некоторые моменты,«как Человек...»(ср.Флп.2:5–7) и когда мы узреваем «такого» Человека, то естественно и в нас рождается желание уподобиться Ему; также тогда мы поймем и слова свт.Иоанна Златоустого: «Ад прият тело, и Богу приразися. Прият землю и обрете небо»[52].'
      cn: 在基督降生前和基督之外，在世界的全部历史中，没有其他人教导我们这一点。我想告诉你们，曾有那么一个时刻，这些话语以一种「独特的方式」抵达我的心，源自上帝本身……哦，但愿我能做到，在我现今这可怜的境况中——你们都知晓并亲见的——帮助你们在内心深处领受这个形象，以便你们的修道生活永远充满来自上天的启示！我们整个生命都变得不同：不是在外在表现上——外在并无任何改变——而仅仅是根据我们内在的意识，这意识是借由圣灵的恩典赐予我们的。活出全人类亚当的生命——在许多人看来，这似乎是某种哲学幻想；但当然，福音中所谈论的并非这种哲学。这是基督的境况，祂自己既是人类的创造者，又取了我们奴仆的生存形式，在某些时刻，祂行事「如同人一样……」（参阅腓立比书 2:5-7）。当我们凝视「这样」的人时，自然而然地，我们心中也生发出渴望变得像祂一样；同样在那时，我们也会明白圣师约翰·金口所说的话：「阴间吞噬了身体，却与上帝相遇。它吞噬了大地，却发现了天堂。」[52]
  - type: paragraph
    text:
      ru: 'Эту жизнь я назвал «вдохновением свыше». Наша беседа о сём предмете совпадает с днями, когда мы особо вспоминаем нашего духовного отца святого Силуана. Бог дал ему с самого начала монашества молитву за весь мир, за всего Адама – с глубоким плачем: большим, чем за самого себя. И опять подчеркиваю: имеется в виду «состояние» нашего духа, возможное только по действию благодати Божией, и в этом его качественное отличие от всякой философии и даже – скажу дерзкое слово – от всякой интеллектуальной теологии.'
      cn: 这生命我称之为「自上而来的灵感」。我们关于此事的谈论，恰逢我们特别纪念我们的属灵父亲圣西路亚的日子。上帝赐给他，从他修道之初，就为整个世界、为全人类祈祷，带着深沉的痛哭，比为他自己哭泣更甚。我再次强调：这指的是我们灵性的「状态」，唯独借着上帝恩典的运行方能实现，而这正是它与一切哲学，甚至——恕我斗胆说一句——与一切思辨神学的本质区别。
  - type: paragraph
    text:
      ru: 'Если такое вдохновение коснется нашего сердца, мои дорогие братья и сестры, то, повторяю, это вдохновение явится неистощимым, ибо в нём заключено начало вечной жизни, и, хотя телесный состав наш будет разлагаться, вдохновение сие будет жить в нас могучим образом, мощной силой. Тогда трудно тому, что именуется унынием, прикоснуться к нам, как бы мы ни страдали. Конечно, живя общиной, мы будем иметь многие внешние ограничения, как «программу» дня, некоторый «устав», какие-то «правила» и тому подобное; но Дух, исходящий от Бога Отца, превосходит все эти формы и правила. Внешне мы всё сие должны сохранить, ибо это утвердит нас, – имею в виду послушание и все другие методы воспитания монаха. Они необходимы для того, чтобы постепенно ввести нас в духовное состояние, в котором был и Сам Христос. Тогда мы увидим, что ничего банального, мелкого, ничтожного в жизни нет. У блаженного Силуана, в его очень простых и трогательных словах, говорится о монахе: «Ходит сей человек ногами по земле и работает руками, и никто не знает и не видит того, что духом он пребывает в Боге вечном»[53]. И если самое важное – пребыть духом в Боге, то легко будет сохранить всякие законы, всякие внешние правила, не будучи рабом какого бы то ни было ограничения.'
      cn: 我亲爱的弟兄姊妹们，如果这种灵感触及我们的心，那么，我重申，这种灵感将是无穷无尽的，因为其中蕴含着永生的开端；尽管我们的肉体将要朽坏，这灵感仍将以强大的方式、以沛然的力量活在我们里面。届时，那所谓的沮丧将难以触及我们，无论我们遭受何种苦难。当然，在团体生活中，我们会有许多外在的限制，比如每日的「作息安排」、某种「规章」、一些「规则」等等；但那出自父上帝的圣灵，超越所有这些形式和规则。外在而言，我们必须保留这一切，因为这会坚固我们——我指的是顺服以及所有其他培养修士的方法。它们是必要的，以便逐渐引导我们进入属灵状态，基督自己也曾处于这种状态。届时，我们就会看到，生命中没有什么是平庸、渺小或微不足道的。蒙福的西鲁安曾以他极其朴素而感人的话语，论及修士说：「此人双脚行走于大地，双手劳作，却无人知晓或看见他的灵，正永恒地安住在上帝之中。」[53] 那么，如果最重要的，是灵安住在上帝之中，那么，遵守一切律法、一切外在规则就变得轻而易举，而不至于成为任何限制的奴隶。
  - type: paragraph
    text:
      ru: 'О, как хотел бы я дать вам понять моими словами, что я в глубине души мыслю, когда я говорю о «вдохновении свыше». Конечно, я имею в виду вдохновение от Духа Святого; но оно зависит не только от Бога. Вы, быть может, скажете: «Что за странное слово?» (ср.Ин.6:60), но смысл его такой – Бог с человеком насильно ничего не делает. Он открывает нам образ Христа и затем оставляет нас в свободе – последовать или не последовать. В книге я написал: «Во Христе, воплощенном Логосе Отца, нам дано созерцать предвечную идею Бога о человеке»[54]. Когда нам дано от Бога узреть образ человека, задуманного Богом, тогда в нас появляется духовная жажда уподобиться Христу; тогда Богу дается место в нас. И в этом смысле говорим мы, что излияние на нас благодати зависит не только от Бога, хотя только у Него эта«жизнь»(см.Ин.1:4), но отчасти и от нашего расположения – принять или не принять.'
      cn: 哦，我多么希望用我的言语让你们明白，当我谈到「自上而来的灵感」时，我内心深处所想的是什么。当然，我指的是来自圣灵的灵感；但它不单单取决于上帝。你们或许会说：「这是何等奇异的言语？」(参约翰福音 6:60)，但它的意义是这样的——上帝对人从不强行施加任何事。祂向我们启示基督的形象，随后让我们自由选择——跟从或不跟从。在书中我曾写道：「在基督——父所道成肉身的道（Logos）之中，我们得以默观上帝关于人的永恒理念。」[54] 当我们蒙上帝恩赐，得以看见上帝所构想的人的形象时，那时我们里面便会生出一种效法基督的属灵渴望；那时上帝便在我们心中得了居所。并且在这个意义上，我们说，恩典倾泻在我们身上，不单单取决于上帝，尽管唯有祂拥有这「生命」(参约翰福音 1:4)，但也一部分取决于我们接受或不接受的意愿。
  - type: paragraph
    text:
      ru: 'Итак, я хотел бы вам, дорогие мои братья и сёстры, особенно те, что пришли недавно, передать сие: откройте ваши умы и сердца, чтобы Дух Святой начертал образ Христа в вас, и тогда всё монашеское житие наше будет как нечто совершенно неописуемое человеческим словом.'
      cn: 所以，我愿向你们，我亲爱的弟兄姊妹们，尤其是那些最近才来的，传递以下这些话：打开你们的心思和心怀，好让圣灵在你们里面刻画出基督的形象，这样一来，我们整个修道生活将会是某种人类言语完全无法言喻的境界。
  - type: paragraph
    text:
      ru: Христос и в Гефсимании, и на Голгофе жил всё время мыслью об Отце, так и мы будем жить; но мы будем жить скорее Христом, а не Отцом. Они нераздельны, но с нами Христос находится еще в «деле» (см.Ин.17:4) – как спасти нас, и мы только через Него приходим к Отцу (ср.Ин.14:6). Духа Святого мы узнаем по тому, что Он говорит нам – Он говорит то же, что сказал Христос. А если он говорит обратное, то это уже не есть Дух (ср.1Ин.2:22, 4:1–3;1Кор.12:3), третье Лицо Святой Троицы. Практически наша жизнь становится христоцентричной, так что на первом плане перед нами стоит, прежде всего, лик Христа.
      cn: 基督无论在客西马尼园，还是在各各他，都始终活在对天父的思念中，我们也当如此生活；但我们更多是靠基督而活，而不是靠天父。祂们是不可分离的，但与我们同在的基督仍然在「工作」中（参看约翰福音 17:4）——即如何拯救我们，而我们唯有通过祂才能来到天父面前（参阅约翰福音 14:6）。我们藉着圣灵对我们所说的话来认识祂——祂所说的与基督所说的相同。而如果祂所说的与此相反，那就不是圣灵，即圣三一的第三位格了（参阅约翰一书 2:22，4:1-3，哥林多前书 12:3）。实际上，我们的生活变得以基督为中心，以至于在我们面前，首先映入眼帘的，是基督的容颜。
  - type: paragraph
    text:
      ru: Итак, да благословит Господь ваш приход, мои молодые братья и сестры! Я готов служить вам до моего последнего издыхания.
      cn: 所以，愿上主赐福你们的到来，我年轻的弟兄姊妹们！我已准备好服侍你们直到我咽下最后一口气。
- type: heading1
  text:
    ru: 'Беседа 6: О прелести[55]'
    cn: 第六讲论：论妄念[55]
  children:
  - type: paragraph
    text:
      ru: 'О встрече с понятием «прелесть». Что такое прелесть и «звезда непрелестная». Критерий непрелестной жизни: «Сподоби Господи в день сей...» В отвлеченном богословии скорее возможны ошибки. Наша цель – «Кто живет просто...». Прп. Силуан – исключительное явление: не надо себя равнять с ним. Бог видит нас, а не мы Бога. О непонимании, что есть грех, – обвинение Бога. О смирении себя и богооставленности.'
      cn: 关于遇到「灵性妄念」这一概念。什么是「灵性妄念」以及「无妄念之星」。无妄念生活的标准：「恳求祢，上主，在今日…」。在抽象的神学中，更容易出现错误。我们的目标是：「活得朴素的人…」。圣西卢安是一个特殊现象：不要将自己与他等同。上帝看见我们，而非我们看见上帝。关于不理解何为罪，——这是对上帝的指责。关于谦卑自己以及被上帝离弃。
  - type: paragraph
    text:
      ru: 'Вот, я, естественно, радуюсь, когда встречаюсь с вами. Как Бог продлил мою жизнь, Ему единому известно. И до сих пор я живу каждый день непонятное состояние: как я живу, почему я живу, зачем? – Но для меня смысл в том, что я хотел бы передать вам весь мой опыт. Прежде всего положительный опыт, а не отрицательный. Он начался прежде, чем кто бы то ни было из вас явился на свет. Когда, возвратившись ко Христу, я начинал мой путь, то жил состояние ума, сердца и тела моего, в которое приводил меня Бог через молитву, – то есть состояние всего моего бытия. Тогда не было еще у меня понятия о том, что человек может ошибаться и что эти ошибки могут быть весьма трагическими и серьезными. Так, вся история человечества – ошибка Адама. Но они могут быть и малыми, едва заметными, едва отражающимися на нашем бытии земном.'
      cn: 我与你们相遇时，自然是欢喜的。上帝如何延长我的生命，唯有祂知晓。直到如今，我每天都活在一个莫名的状态中：我如何活着，为何活着，为了什么？——然而对我而言，其意义在于，我愿将我全部的经验传递给你们。首先，是积极的经验，而非消极的经验。它始于在你们中任何一人来到世上之前。当我归向基督、开始我的道路时，我就活在上帝通过祷告将我带入的我心、我意与我身体的状态中——即我整个的存有状态。那时，我尚未明白人是可能犯错的，并且这些错误可能极其悲惨且严重。就如，整个人类历史就是亚当的错误。但它们也可能是微小的，几乎不易察觉的，几乎不反映在我们属世的存有上。
  - type: paragraph
    text:
      ru: Я встретился с понятием «прелесть» (греч.:πλάνη, франц.:égarementилиillumination) в Сергиевском институте, когда стал одним из первых его студентов. Я впервые услышал это слово из уст митрополитаАнтония Храповицкого. Это был замечательный иерарх и, может быть, первый кандидат на реставрируемый патриарший трон в России, но по жребию ему не выпало стать Патриархом, и он уехал за границу, в Югославию, и стал во главе Зарубежной церкви. МитрополитАнтоний Храповицкийговорил о том, что даже на Афоне некоторые старцы – в прелести.
      cn: 我在圣谢尔盖学院（希腊语：πλάνη，法语：égarement 或 illumination）接触到了「прелесть」这个概念，当时我是该学院的首批学生之一。我第一次听到这个词，是出自都主教安东尼·赫拉波维茨基之口。他是一位杰出的圣职人员，而且，他或许是俄罗斯恢复中的宗主教宝座的首位候选人，但抽签决定他未能成为宗主教，他便去了国外，去了南斯拉夫，并成为海外教会的首脑。都主教安东尼·赫拉波维茨基说过，即使在阿索斯圣山，有些修士长也处于妄念之中。
  - type: paragraph
    text:
      ru: 'Это было, когда во мне уже появилось желание покинуть институт и уехать в монастырь: или на Валаам, или на Афон. В то время это слово имело какое-то мистическое значение. Действительно, люди боялись впасть в прелесть, и этот страх послужил для многих причиною отклонения от правильного мышления. Люди спокойны, когда кто-нибудь напьется допьяна и делает глупости – это не значит, что он «в прелести»; но если сказать, что Нетварный Свет посетил тебя, то моментально ответят: «Ах, это прелесть!» И это был очень серьезный момент в моей парижской жизни, и не только для меня, но для многих.'
      cn: 那时候，我心中已经生出了愿望，想要离开学院，去修道院：要么去瓦拉姆，要么去阿索斯山。那时，「修道院」这个词带着某种神秘的意义。的确，人们害怕陷入妄想，而这种恐惧对许多人而言成了偏离正确思想的原因。人们对有人喝得酩酊大醉并做傻事泰然自若——这不表示他「陷入妄想」；但如果说非受造之光造访了你，人们会立刻回答：「啊，那是妄想！」而这在我巴黎的生活中是一个非常严肃的时刻，不仅对我如此，对许多人也是如此。
  - type: paragraph
    text:
      ru: 'Вопреки тому, что говорил этот замечательный иерархАнтоний Храповицкий, по прибытии на Афон я поцеловал землю и сказал: «Все, чему меня будут учить отцы, я приемлю. Я оставляю свой ум в положении воспринимающего и никак не судьи». На Афоне тоже были страхи впасть в прелесть. Так у меня возникла необходимость выяснить, что же, собственно, это такое – «прелесть» и как ее понимать.'
      cn: 尽管这位杰出的主教安东尼·赫拉波维茨基所说的与此相反，我抵达阿索斯山后，亲吻了大地，并说道：「所有父亲们将教导我的，我全然接纳。我将我的心智安放在一个领受者的位置，绝非一个评判者的位置。」在阿索斯山，也有人害怕堕入妄想。因此我便有必要弄清楚，「妄想」究竟是什么，以及如何理解它。
  - type: paragraph
    text:
      ru: 'Живя на Афоне, я чувствовал себя под защитой молитв отцов и Божией Матери и всех святых. Поэтому я мог спокойно рассуждать, как понимать слово «прелесть». Русское слово «прелесть» совсем другого порядка, чем греческоеπλάνη, но речь идет о том же самом явлении. Разница в том, что греческий ум – философский, и он рождает богословские понятия, как философские. Например,покаяние(по-греческиμετάνοια) – это «изменение умного видения», апрелесть(πλάνη) – «заблуждение». Русские говорили о покаянии как о психическом чувстве. Это есть «сожаление о содеянном» – о том, что мы сказали или сделали, – когда мы говорим Богу: «Прости меня».'
      cn: 在阿索斯圣山生活时，我感到自己受到教父们、圣母以及所有圣徒祷告的护佑。因此，我得以平静地思考如何理解「прелесть」这个词。俄语词「прелесть」与希腊语πλάνη截然不同，但它们指的是同一种现象。区别在于，希腊人的思维是哲学性的，它以哲学的方式产生神学概念。例如，「покаяние」（希腊语为μετάνοια）是「心智洞见的改变」，而「прелесть」（希腊语πλάνη）则意为「迷失」。俄罗斯人则将「покаяние」视为一种心理感受。它是「为所作所为感到悔恨」——为我们所说或所做的一切——当我们对上帝说：「请祢饶恕我」时。
  - type: paragraph
    text:
      ru: 'Слово «прелесть» означает то, что не исходит от Единого Истинного Бога, но вдруг нам кажется великим и святым, и мы открываем сердце наше для этой ошибки. Когда святые отцы говорят о прелести, они имеют в виду также и свой опыт. И избежатьпрелестимы не можем: не говорю о всей жизни нашей, но об отдельных ее случаях.'
      cn: 词语「迷惑」是指那些不源自独一真神的事物，却突然在我们看来是伟大而神圣的，而我们却向此错误敞开了心扉。当圣教父们谈论「迷惑」时，他们也指他们自身的经验。我们无法避免「迷惑」：我不是说我们的一生，而是指其中个别的情况。
  - type: paragraph
    text:
      ru: 'Я понял слово «прелесть» так: когда какое-то духовное явление влечет меня к себе и я открываю ему сердце мое, то потом могу узнать, ошибся ли я или не ошибся, и через покаяние возвратиться к истине...'
      cn: 我对「прелесть」这个词的理解是：当某种灵性现象吸引我，且我向它敞开心扉时，那么之后我便能得知我是否犯了错，并藉着悔改回归真理……
  - type: paragraph
    text:
      ru: Всякий раз, когда мы совершаем или впадаем в грех какого бы то ни было порядка и плана – ментального, сердечного, телесного, – мы были жертвойпрелести. Мы совершаем грех потому, что он нас влечет.
      cn: 每当我们犯下或陷入无论何种类型和层面的罪中——思想的、心灵的、肉体的——我们都是妄念的受害者。我们犯罪，因为罪诱惑我们。
  - type: paragraph
    text:
      ru: В тропаре мучеников есть выражение «звездо непрелестная». Это слово стало для меня знаменательным. В состоянии, когда мученики отдают всё свое бытие Богу, они являются как «звезда непрелестная», то есть «кругом истинная, в которой нет следов неправды».
      cn: 在殉道者的颂词中，有一个表达是「不谬的星」。这个词语对我而言变得意义深远。在殉道者将自己的全部存在献给上帝的状态下，他们显现为「不谬的星」，也就是说，「全然真实，其中没有丝毫虚假痕迹」。
  - type: paragraph
    text:
      ru: 'Говорю вам об этом потому, что и до сего времени прелесть возможна повсюду – и на Святой Горе, и в Греции, и во Франции, и у нас вTolles-hunt Knights. Но как нам убедиться, что всё, превосходящее нашу меру уразумения, мы усваиваем как положительную истину? Где тот критерий, который мы можем избрать, чтобы определить, в прелести ли мы или на истинном пути? – Так, в молитве ко Ангелу-хранителю говорится: «Ангеле Божий, Хранителю мой святый, жизнь мою во страсе Христа Бога соблюди, ум мой утверди во истинном пути». И вот выход – эта молитва: «Ум мой утверди во истинном пути», или как сказано в псалме:«Дух Твой Благий наставит мя на землю праву... скажи мне, Господи, путь, воньже пойду, яко к Тебе взях душу мою»(Пс.142:10, 8).'
      cn: 我告诉你们这些，是因为直到如今，妄念仍可能遍布各处——无论是在圣山，还是在希腊，还是在法国，还是在我们Tolles-hunt Knights。但我们如何确信，凡是超越我们理解限度的所有事物，我们都能将其领受为一种积极的真理呢？我们可以选择哪个标准来确定我们是否身陷妄念，还是走在真理的道路上呢？——因此，在向守护天使的祷告中说道：「上帝的使者，我圣善的守护者，求祢保守我的生命，常存对基督上帝的敬畏，坚定我的心智，走在真理的道路上。」这就是出路——这个祷告：「坚定我的心智，走在真理的道路上」，又如诗篇中所说：「祢的圣善之灵必引我到平坦之地……上主啊，求祢指示我当行的路，因为我的灵魂仰望祢」(诗篇 142:10，8)。
  - type: paragraph
    text:
      ru: 'Об этом можно говорить много. Перейду непосредственно к тому, что для нас должно быть ограждением от падения и от уклонения на пути, чуждые духу Христа. Об этом мы молимся каждый день несколько раз: «Сподоби, Господи, в день сей, в вечер сей, в ночь сию без греха сохранитися нам». Каждый раз, когда мы впадаем в грех, мы были привлечены каким-то аспектом этого греха и совершили его в мыслях, в движениях сердца нашего, в наших действиях физических; понимать это – значит быть внимательным в течение всего дня и в течение всей ночи, чтобы не совершить греха. И это является характерным для монашеского пути...'
      cn: 关于这一点，可以谈论很多。我将直接谈及那对我们而言，应是防止我们堕落并偏离与基督之灵相悖之道的屏障。关于这一点，我们每天祷告数次：「主啊，求祢恩准我们今日、今晚、今夜得以无罪蒙保守。」每当我们陷入罪中时，我们便是被这罪的某个方面所吸引，并在思想中、在我们心中的意念中、在我们身体的行动中犯下了它；理解这一点，就意味着要在一整天和一整夜中保持警醒，以免犯罪。而这正是修道之路的特征……
  - type: paragraph
    text:
      ru: В посланиях, которые апостол Павел посылал новоявленным христианам из бывших язычников-идолопоклонников, он раскрывал невероятно великую картину христианского понимания бытия и Бога и вместе с тем говорил о повседневной жизни людей... Так нам надлежит сочетать оба аспекта в нашем видении умном, в нашем созерцании бытия космического и Бытия Божественного, то есть тварного и Нетварного.
      cn: 在使徒保罗致信给那些刚刚归信的基督徒，即曾是异教偶像崇拜者的书信中，他揭示了基督徒对存有与上帝的理解，一幅极其宏伟的图景，与此同时，他也谈及了人们的日常生活……因此，我们理当在我们的心智观照中，在我们的默观中，将宇宙的存有与神圣的存有，即受造的与非受造的，这两个层面结合起来。
  - type: paragraph
    text:
      ru: 'Как быть новоначальному монаху или новоначальному христианину вообще? Как нам провести день? – У некоторых ум влечется к отвлеченному богословию, и там возможны ошибки. Потому всё внимание должно быть обращено на то, чтобы благодать Святого Духа не оскорбить какой-нибудь дурною мыслию или дурным движением сердца... на то, как избежать какого бы ни было греха каждый раз, когда мы общаемся с братом или сестрой, – прежде всего чтобы никого не оскорбить. Когда Бог содействует нам в нашем «страдании» провести день без греха, тогда приходит благодать Святого Духа: мы нашей жизнью без греха создаем в себе свободную сферу для того, чтобы пришел Дух Святой Своею благодатию. И когда Он приходит, то мы имеем живое восприятие того, чему Он нас учит. И, как говорил старец Силуан, «всё, чему научила благодать с самого начала, надо хранить всю жизнь до конца»[56]. Необходим период, когда Бог оставляет нас. Тогда мы в страдальческом напряжении хотим действовать так, как будто бы Бог был с нами, хотя Он отнял от нас Свое ощутимое действие...'
      cn: 作为初入道的修士或一般的初信基督徒，我们该如何行？我们该如何度过每一天？——有些人的心智倾向于抽象神学，而这其中可能出现错误。因此，所有的注意力都应集中在如何不以任何恶念或心中邪念冒犯圣灵的恩典上……以及在每一次与弟兄姊妹交往时，如何避免任何罪过——首先是为了不冒犯任何人。当上帝协助我们在我们的「挣扎」中度过无罪的一天时，那时圣灵的恩典就会降临：我们借着无罪的生活，在自身内创造一个自由空间，以便圣灵借着祂的恩典降临。而当祂降临时，我们便能活泼地领悟祂所教导我们的一切。并且，正如圣西卢安长老所言，「恩典自始教导我们的一切，都要终生谨守，直至末了」[56]。有一个上帝离弃我们的时期是必须的。那时，我们便在苦痛的努力中，渴望如同上帝与我们同在般行事，尽管祂已收回了祂可感知的作为……
  - type: paragraph
    text:
      ru: Монах вначале ничем другим не занимается, как только тем, чтобы провести весь день без греха. И тогда приходит Дух Божий и открывает нам тайны Божественного Бытия, чего не достигает человек на путях отвлеченного богословия. Когда я говорю об этом преимуществе монашеской школы, это совсем не значит, что мое отношение к богословской науке чисто отрицательное. Нет, я этого не говорю, и в исторических условиях нашего падения это – необходимая вещь. Я сожалею только о том, что для многих из тех, которые затрачивают огромную энергию на изучение богословского предания Церкви, их интеллектуальное знание представляется как будто бы уже достигнутым совершенством. С отвлеченным богословием достигнуть совершенства невозможно. В исторической жизни власть в Церкви отдана не святым, а ученым, и в этом трагедия мира и Церкви.
      cn: 修士起初只致力于度过一整天而没有罪。于是，上帝的圣灵便降临，向我们启示神圣存在的奥秘，这是人借着抽象神学之道所无法达到的。当我谈到修道学派的这项优势时，这绝不意味着我对神学科学的态度是纯粹负面的。不，我不是这么说的，在我们的堕落这一历史条件下，这是一件必需的事。我只感到遗憾的是，对于许多耗费巨大精力研究教会神学传承的人来说，他们的智性知识仿佛被视作已然达成的完满。借着抽象神学是不可能达到完满的。在历史生活中，教会中的权柄没有被交托给圣者，而是交给了学者，这便是世界和教会的悲剧所在。
  - type: paragraph
    text:
      ru: 'Жизнь монаха начинается так, как учил этому преподобный старецАмвросий Оптинский. Он говорил: «Кто живет просто, с тем ангелов со сто, а кто мудрено, с тем ни одного». Так и я хотел бы сказать вам, что жизнь наша совсем простая. Это очень важно – никогда не надо ставить себе задачу достигнуть каких-то явных следов Божиего благоволения: чудотворения или чего-нибудь еще в этом роде. Никогда это не входит в наш план! А план наш выражается только в этом – «как бы не совершить греха». Я пытаюсь иногда говорить вам о грандиозной картине, которая открыта нам Богом в творении космоса, в творении человека«по образуЕгои по подобию»(см.Быт.1:26). Я это делаю для того, чтобы вы имели в виду не повседневную мелкую жизнь нашу, а бытие с Богом и обладание жизнью во всем ее объеме: и космическом, и Божием. Но я говорю и о том, что не надо воображать, будто мы ужетам, и не надо ставить себе это целью. Наша цель – «кто живет просто, с тем ангелов со сто».'
      cn: 隐修士的生活始于圣长老安布罗修（奥普金斯基）的教导。他曾说：「谁生活得单纯，谁就有百位天使相伴；谁生活得复杂，谁就一个也没有。」我也想对你们说，我们的生活是完全单纯的。这非常重要——绝不要给自己设定任务去达到上帝恩宠的任何明显痕迹：施行神迹，或诸如此类的事情。这绝不在我们的计划之内！而我们的计划只体现在这一点上——「如何才不犯罪」。我有时试图向你们讲述一幅宏伟的图景，是上帝在宇宙的创造中，在按「祂的肖像与样式」创造人时（参创世记 1:26），向我们揭示的。我这样做是为了让你们铭记的并非我们日常琐碎的生活，而是与上帝的共存，以及在生命的全部广度中拥有生命：既有宇宙性的，也有神性的。但我也说，绝不要幻想我们已然身处彼处，也绝不要将此作为目标。我们的目标是——「谁生活得单纯，谁就有百位天使相伴」。
  - type: paragraph
    text:
      ru: 'Почему я сегодня говорю так, как будто я беспокоюсь? – Да, я беспокоюсь, потому что, думая о уже бывших явлениях благоволения Божьего к нам, мы можем возбудить в себе желание ненужное, неверное, ложное, гибельное – достигнуть таких же дарований, как у старца Силуана. Поймите мою осторожность: мы находимся в опасности, потому что у нас невероятно великий отец – прп. Силуан. То, что с ним произошло, – редчайшее явление вообще в истории человечества. И если мы погонимся за теми же дарованиями, которые были у него, это будет ошибкой. Никогда не надо сравнивать себя с кем бы то ни было другим (ср.2Кор.10:12–14). Как бы ни был мал-велик пред Богом всякий из нас, Бог «занимается» с каждым человеком наедине сердечного общения. Обычный путь – не тот, который мы видим у прп. Силуана. Он, как и прп.Серафим Саровский, в самом начале пережил явление Христа. А нам надо иметь другую установку: христианин должен обычно думать о том, как умереть, очистившись покаянием. И тогда явится Христос человеку в вечности...'
      cn: 我今天说话，为何仿佛忧虑重重？——是的，我忧虑，因为当我们回想上帝已向我们显现的恩典时，我们内心可能会生发出一种不必要、不正确、虚妄且有害的愿望——渴望获得与圣西卢安长老同样的恩赐。请理解我的谨慎：我们正处于危险之中，因为我们拥有一位极其伟大的教父——圣西卢安。在他身上所发生的事，乃是人类历史上极其罕见的现象。如果我们一味追求他所拥有的同样恩赐，那将是一个错误。绝不可将自己与任何人作比较 (参阅哥林多后书 10:12-14)。无论我们每个人在上帝面前或渺小或伟大，上帝都以单独的心灵交通来「对待」每一个人。通常的道路，并非我们从圣西卢安那里所看到的。他，正如圣萨罗夫的塞拉芬一样，在起初就经历了基督的显现。而我们应当有另一种态度：基督徒通常应当思考，如何藉着悔改而洁净地死去。如此，基督便会在永恒中向那人显现……
  - type: paragraph
    text:
      ru: 'Одна из самых больших опасностей лежит в нашей способности воображать. Когда мы живем, не надо воображать, что Бог с нами и что мы видим Его: надо осознавать, что Бог видит нас. Такой подход спасет нас от уклонений в воображение: «я пророк», «я апостол», «я святой», «я такой», «я иной». Свободные от всякого воображения о себе, мы подвизаемся, и что Бог хочет, то Он совершает без нас через нас. Говорю вам о том, как прожить, чтобы избежать прелести. И когда мы пребываем в страдальческом состоянии всего нашего бытия – и духа, и ума, и сердца, и тела; когда мы кругом страдаем, подвизаясь за то, чтобы не совершить греха, – мы сами не думаем, что мы соучаствуем в страданиях Христа... Но Бог может признать это как соучастие в страданиях Христа (ср.2Кор.1:5) и может это нам приписать, следуя Своему Суждению, а не нашему. Наш путь – постоянно смирять себя, а возносить и прославлять – принадлежит Богу (ср.Мф.23:12). Так что не нужно нам заниматься тем, чтобы «подымать самих себя куда-то за волосы». Надо жить с очень смиренным сознанием. И если Бог дает что-либо, то бывает это в такой видимой форме, которая поражает воображение человека. Однако это – от Бога, а не от нас.'
      cn: '最大的危险之一存在于我们的想象力中。当我们活着的时候，不应当想象上帝与我们同在、我们看见祂：而是要意识到上帝看见我们。这种方法将使我们免于陷入想象的偏离中：「我是先知」、「我是使徒」、「我是圣徒」、「我是这样的人」、「我是那样的人」。摆脱了一切关于自己的想象，我们便奋力修道，而上帝所愿的，祂便无须凭借我们自己，却借着我们来成就。我告诉你们如何生活，以避免陷入属灵妄想。


        当我们整个存在——无论是灵、意、心，还是身体——都处于受苦的状态时；当我们四面受苦，为着不犯罪而奋力修道时——我们自己并不会认为我们参与了基督的苦难……但上帝可以承认这为参与了基督的苦难（参阅哥林多后书 1:5），并且可以将其归于我们，遵循祂的判断，而非我们的。我们的道路是不断地谦卑自己，而高举和荣耀则属于上帝（参阅马太福音 23:12）。所以我们无需致力于「把自己从头发上拉起来」。


        应当带着极其谦卑的意识生活。而如果上帝赐予了什么，那么这会以一种可见的形式出现，这种形式震撼人的想象力。然而这来自上帝，而非来自我们。'
  - type: paragraph
    text:
      ru: 'Самый трудный путь – когда в самом начале дается человеку явление Бога в великом Свете. Такой человек получает как бы «инъекцию» (укол), которая уподобляет его Христу в самом мышлении (ср.1Кор.2:16;Флп.2:5), в самом восприятии жизни. Сам Он шел на Голгофу с глубочайшим страданием – совершить акт, обратный тому, что совершил Адам. И как через ошибку Адама Бог проклял этот мир (см.Быт.3:17), так Христос Своим восхождением на Крест голгофский уничтожил эту клятву (ср.Гал.3:13) и сделал свободным вход в Царство Бога Отца. Итак, нам надлежит одновременно носить в себе и эту картину искупления нашего голгофским страданием и воскресением, и осознавать необходимость для нас идти путем, обратным тому, что совершил Адам в раю. Тогда жизнь наша будет согласной слову прп.Амвросия Оптинского: мы «живем просто, но с нами ангелов со сто, а кто мудрено – кто воображает, что он пророк, что он святой, – с тем ни одного».'
      cn: 最艰难的道路，乃是在一开始时，赐予人上帝在极大的光中的显现。这样的人仿佛领受了一剂「注射」（一针），使他在思想上（参阅哥林多前书 2:16，腓立比书 2:5）和对生命最深的感知上与基督相似。祂自己带着最深切的苦难走向了各各他，以完成一个与亚当所行的相反的行动。正如通过亚当的过犯，上帝咒诅了这个世界（参阅创世记 3:17），照样，基督借着祂在各各他登上十字架，消除了这个咒诅（参阅加拉太书 3:13），并使进入天父上帝的国度得以自由无碍。因此，我们必须同时在我们自身内保有这幅我们借着各各他的苦难与复活而得蒙救赎的图景，并认识到我们有必要走一条与亚当在乐园中所行的相反的道路。这样，我们的生命就会与圣安布罗西奥普京斯基的话语相符：我们「生活简朴，但有百位天使与我们同在；而那些故作聪明——那些自以为是先知、自以为是圣人的人——则一个天使也没有与他们同在。」
  - type: paragraph
    text:
      ru: 'Это очень важный момент, потому что обычно в миру едва найдешь человека, который понимает, что такое грех. Господь говорил иудеям:«есливы не поверите,что это Я– Тот, Который открылся Моисею на Синае АЗ ЕСМЬ,то вы умрете во грехах ваших»(см.Ин.8:24). Люди не могут понять, когда они грешат и когда не грешат, – это только Господь Сам открывает нам Духом Святым. Из-за этого во всем мире происходит то же, что и в раю с Адамом, когда с ним говорил Господь Иисус Христос, – Адам не хотел, чтобы его обвиняли:«Ты дал мнеэтужену,и она дала мне, и я ел»(см.Быт.3:12). Мы же будем стараться не обвинять Бога и не говорить Ему: «От Лица Твоего исходит судьба моя» (ср.Пс.16:2). Чего Ты хочешь от меня?» – Господь хочет, чтобы мы уподобились Ему в Его любви. А любовь Божия – любовь смиренная.'
      cn: 这是一个非常重要的时刻，因为通常在世间很难找到人能够理解什么是罪。上主对犹太人说：「你们若不信我就是那位在西奈山向摩西启示自己的『自有永有者』，你们就必死在你们的罪中。」(参阅约翰福音 8:24) 人们无法理解他们何时犯罪，何时不犯罪——这只有上主亲自藉着圣灵向我们启示。因此，在全世界所发生的事，与在乐园中亚当所发生的事如出一辙，当主耶稣基督与他说话时——亚当不愿被指责：「祢给了我这个女人，她给了我，我就吃了。」(参阅创世记 3:12) 我们则会努力不归咎于上帝，也不对祂说：「我的命运出自祢的面容。」(参阅诗篇 16:2) 「祢想从我这里得到什么呢？」——上主希望我们在祂的爱中效法祂。而上帝的爱，是谦卑的爱。
  - type: paragraph
    text:
      ru: 'Итак, пожалуйста, дорогие мои братья и сестры, подчеркните и запомните на всю жизнь: наша работа – все время смирять себя. Об этом Господь говорит:«смиряяй себя – вознесется»(см.Лк.14:11). Но возносить может только Бог (ср.Иак.4:6). А иначе получается картина, обратная нашему воображению: когда мы думаем взлететь к Богу, на самом деле мы остаемся на своем месте... А если не воображать, то Господь Сам к нам приходит. Моя задача трудная и ответственная, и я хотел бы исполнить мой долг перед вами действительно без греха. И то, что я вам сегодня говорил, пожалуйста, напишите на сердцах и умах ваших, и тогда вы будете совершать путь ваш в великом смирении и в твердости. Неизбежно будут часы, недели, годы, когда мы будем проводить время без живого ощущения в нас действующего Духа. Это важный период. Тогда мы можем проявить нашу верность в любви к Богу: не имея ощутимого действия благодати, мы живем так, как если бы она была с нами. В книге о старце Силуане я пишу о том, что он думал: «Если мы храним верно заповеди Божии, то придет время, когда благодать приходит и уже всегда остается с нами»[57].'
      cn: 所以，请我的弟兄姊妹们，铭记一生：我们的工作就是时刻谦卑自己。关于这一点，上主说：「凡谦卑自己的，必被升高」(路加福音 14:11)。但唯有上帝能升高人(参雅各书 4:6)。否则，结果将与我们想象的景象相反：当我们以为自己能飞向上帝时，实际上我们仍停留在原地……而如果我们不存幻想，上主祂自己就会来到我们身边。我的任务艰巨而责任重大，我希望能真正无罪地履行我对你们的职责。我今天对你们所说的一切，请铭刻在你们的心版和意念中，这样你们就将在极大的谦卑和坚韧中走完你们的路程。必然会有一些时刻、几周、几年，我们会经历没有圣灵在我们里面活跃的鲜活感受。这是一个重要的时期。那时我们可以显出我们对上帝之爱的忠诚：即使没有可感知的恩典之作用，我们也要如同恩典与我们同在一样生活。在论及圣西卢安长老的书中，我写到他曾这样想：「如果我们忠实地遵守上帝的诫命，那么时候将到，恩典就会降临并永远与我们同在」[57]。
  - type: paragraph
    text:
      ru: 'Итак, не надо торопиться. Некоторые отцы на Афоне после сорока и более лет получали благодать большую и только тогда познавали ее, перед смертью. И это – самый верный путь. Значит, бывает так: или в самом начале дается благодать совершенства, или в середине, или в конце. И самое твердое положение – когда в конце. И будем терпеть всю нашу жизнь (ср.Мф.24:13;Лк.21:19;1Пет.5:6), как будто мы еще только начинаем.'
      cn: 因此，不必着急。阿索斯山的一些教父，在四十年或更长时间之后才领受了更大的恩典，并只在临终前才认识到它。而这是最可靠的道路。这意味着情况可能是这样：圣善的恩典或在最开始时赐予，或在中间，或在末了。而最稳固的境况，是当它在末了时。而我们将忍耐我们的一生（参 马太福音 24:13，路加福音 21:19，彼得前书 5:6），仿佛我们才刚刚开始。
- type: heading1
  text:
    ru: 'Беседа 7: О вечности[58]'
    cn: 讲道七：论永恒[58]
  children:
  - type: paragraph
    text:
      ru: Цель наша – достигнуть Божественной вечности. Смертная память и временное. Приготовление к вечности. Вечность как преизбыток жизни во Христе. Как живут в вечности. Вечное бытие познается полностью только по смерти. О жизни по смерти.
      cn: 我们的目标是达到神性永恒。必死的记忆与暂时的。为永恒的预备。永恒乃是在基督里生命之丰盛。如何在永恒中生活。永恒的存在唯有在死亡之后方能完全被认识。关于死后的生命。
  - type: paragraph
    text:
      ru: Когда нам приходится говорить о Боге – о Боге вечном и прежде всех веков, – всякое наше слово как бы не достигает поставленной перед нами цели. Здесь (в монастыре) мы живем и несем все трудности этой жизни с тем, чтобы достигнуть Божественную вечность.
      cn: 当我们谈论上帝——谈论那位永恒的、在万世以先的上帝时——我们的每一个词语仿佛都未能达到我们所设定的目标。在这里（在修道院里），我们生活并承担着这生命中所有的艰难，以期达到神圣的永恒。
  - type: paragraph
    text:
      ru: Более семидесяти лет тому назад, будучи еще неразумным, я переживал посещение свыше. Это был особый дар Божий – смертной памяти. При смертной памяти характерно то, что всякая вещь или переживание обесценивается, если оно умирает. Всякое страдание человека – и наше, и наших братьев и сестер – теряет всякую ценность, если все будет поглощено смертью. И это так ясно! С такой силою это действует на душу, что действительно видишь отсутствие смысла жизни из-за смерти. Если все должно нестись в какую-то бездну забвения, то зачем страдать? – И так мне пришлось жить много лет. Я не боролся постоянно, а только иногда, против этой благодати, которая как бы «мешала» мне жить. Она обесценивала всякий мой труд в области искусства, она обесценивала все мои отношения с людьми, потому что эти отношения умирают, исчезают. И тогда это было так ярко:все, что не живет вечно, не имеет ценности!
      cn: 七十多年前，我尚不谙世事时，经历了一次从上而来的造访。这是一份来自上帝的特殊恩赐——死亡的忆念。死亡的忆念有一个特点，就是任何事物或经历，如果它终将逝去，便会失去价值。人类的一切苦难——无论是我们自己的，还是我们弟兄姊妹的——如果这一切都将被死亡吞噬，便会失去所有的价值。这何其清楚！它以如此强大的力量作用于我的灵魂，以至于我确实看到，因着死亡，生命是毫无意义的。如果一切都将归于遗忘的深渊，那为何还要受苦呢？——我就是这样度过了许多年。我并非持续不断地，而只是偶尔地反抗着这份恩典，这份恩典似乎「妨碍」了我生活。它使我在艺术领域的一切劳作都失去了价值，它也使我与人的一切关系都失去了价值，因为这些关系也会死亡、消逝。那时，这一点是如此鲜明：凡不永恒存在的，皆无价值！
  - type: paragraph
    text:
      ru: Однако Христос и все Откровение Нового Завета говорит нам главным образом о вечности и о путях к ней. Нам, сотворенным из ничто, трудно мыслить о вечном. Но мы встречаемся с этой вечностью, потому что мы живем в Церкви, аЦерковьесть приготовление к вечности. Почему? – Потому что есть пророчества и предсказания о нашем времени, высказанные две тысячи лет тому назад, что так будет. Значит, все наше «бывание» совершается по какому-то уже готовому плану, по какой-то программе. И в этих предсказаниях много сроков, исполнение которых отмечено историей. Значит, есть вечное. Если молитва к Богу, к Божией Матери и ко святым находит свой отклик, от них исходящий, то ясно, что они живут. Но как живут, мы сейчас не можем понять.
      cn: 然而，基督以及新约所有的启示主要地告诉我们关乎永恒以及通往永恒的道路。对于我们这些从虚无中被造的人而言，难以思考永恒。但我们与这永恒相遇，因为我们活在教会中，而教会正是为永恒所做的预备。为什么？——因为有两千年前所发出、关于我们时代的预言和预示，说事情会如此发生。这意味着，我们所有的「存在」是按着某个早已准备好的计划，按着某个程序进行的。而且在这些预示中，有许多期限，其应验已为历史所标记。这意味着，永恒是存在的。如果向着上帝、圣母以及诸圣者的祷告得到了从他们而来的回应，那么显然，他们是活着的。但他们如何活着，我们现在无法理解。
  - type: paragraph
    text:
      ru: 'Когда я был терзаем смертной памятью, тогда мне приходили мысли о вечности: как мыслить вечность? Как какое-то постепенное движение, которое никогда не кончается? Так мыслят многие, даже богословы. Они говорят о нашем вечном спасении как о непрестанном восхождении к Богу – Беспредельному, Бесконечному. Но не так говорит Священное Писание. Писание говорит, что есть возможность перехода от измерений временных к вечности (понятие «измерение» уже неприложимо к вечности). И когда мы называем Того, Кто от века и прежде всех веков, – «Отче наш», это не остается без ответа. И если кому-то дано жить эти слова: «Отче наш», если ощущать, что мы дети вечного Отца, тот понимает, что мы не можем каждый раз не переживать этот «удар» вечности по нашему бытию.'
      cn: 当我被死亡的记忆折磨时，那时我便思想永恒：如何思想永恒？如同某种永无止境的渐进运动吗？许多人，甚至神学家，都是这样思想的。他们谈论我们的永恒救赎，如同不断向上帝——那无限无垠者——攀升。然而，圣经并非如此说。圣经说，存在从时间维度过渡到永恒的可能性（「维度」这一概念已不适用于永恒）。当我们称呼那从亘古直到万古之先者为——「我们的父」时，这并非没有回应。若有人蒙赐活出这些话语：「我们的父」，若有人能感受我们是永恒之父的儿女，他便明白，我们每次都不能不经历这永恒对我们存在的「冲击」。
  - type: paragraph
    text:
      ru: 'В то время, когда я был еще под действием смертной памяти, у меня были наивные попытки писать о вечности. И вот я хочу прочитать вам этот наивный мой ход мысли о вечном:'
      cn: 当我还处在死亡记念的影响下时，我曾幼稚地尝试书写关于永恒的事。于是，我现在想给你们读一读我这番关于永恒的幼稚思绪：
  - type: paragraph
    text:
      ru: '«Во Христе мы имеем носителя предельных страданий и также высочайшей святости и блаженства. И в этом отличительная черта христианства. В сердце верующего сожительствуют наше тварное начало с нетварной силой Бога, наше повседневное истощание и могущество, уничижение и слава, время и вечность, боль и радость в предельном для естества нашего напряжении»[59]. Это написано было в состоянии, полном энергии, которое далеко отстоит от уныния, когда ни о чем не хочется думать. «Вечность я представляю себе как непротяженный акт неописуемо богатого содержания Бытия в никогда не умаляемой полноте. Вечность – преизбыток жизни. То, что мы воспринимаем здесь как страдание и даже умирание, в Царстве Божием явится самоистощающеюся любовью – любовью совершенною, не обращающеюся на себя, любовью, объемлющей весь мир, и Бога, и Собор святых. Любовь, торжествующая видеть все сие как ее богатство: она живет как свою радость – видеть других в славе, «сияющими,как солнце»(Мф.13:43)»[60].'
      cn: '«在基督里，我们拥有极致苦难的承担者，以及至高圣洁与至福。在此，便是基督教的独特之处。在信徒的心中，我们受造的本性与上帝非受造的大能共存着，我们日常的耗竭与大能，卑微与荣耀，时间与永恒，痛苦与喜乐，这一切都在我们本性所能承受的极致张力中»[59]。这番话写就之时，是在一种充满活力的状态下，远非那种万念俱灰、什么都不愿思考的忧郁境况。


        «我设想永恒是一种无延展的行动，其中蕴含着不可言喻的丰富存有（Бытия），且处于永不减损的圆满之中。永恒——是生命的盈溢。我们在此所感知为苦难甚至死亡的事物，在上帝的国度里，将显现为自我倾倒（истощание）之爱——一种完全的爱，不以自身为目的的爱，包容整个世界、上帝与诸圣相通的爱。这种爱，因视这一切为其财富而欢欣鼓舞：它以见证他人活在荣耀中为自身的喜乐，「发光如同太阳」（马太福音 13:43）»[60]。'
  - type: paragraph
    text:
      ru: И об этой вечности мы получили откровение, которое говорит, что«Бог есть Любовь»(см.1Ин.4:8). В нашей земной жизни любовь является самым драгоценным счастьем и блаженством. А «Божией любви свойственна ненасытимость»[61]. Много раз я встречал мысль о том, что если любовь насытима, то будет момент пресыщения. Но в том-то и дело, что любви Божией свойственна ненасытимость, что исключает пресыщение. И ненасытимость указывает на то, что это предельное напряжение не ослабляется ни на одно мгновение. «В любви Божией нет и не может быть пресыщения. Нет места и снижению или каким бы то ни было колебаниям в энергии жизни непреложной. И именно сия непреложность есть существо блаженства. И на Земле мука наша не в том, что мы болеем или сострадаем, но в том, что мы умираем от этих проявлений любви.
      cn: 关于这永恒，我们得到了启示，说「上帝是爱」（参阅 约翰一书 4:8）。在我们地上的生命中，爱是最宝贵的幸福和福乐。而「上帝的爱具有永不满足的特性」[61]。我曾多次遇到一种想法，即如果爱是可满足的，那么就会有满足以至于厌倦的时刻。但关键在于，上帝的爱具有永不满足的特性，这排除了满足以至于厌倦的可能性。而这种永不满足的特性表明，这种极度的张力一刻也不会减弱。「在上帝的爱中，没有，也不可能有满足以至于厌倦。在这坚定不移的生命能量中，没有丝毫的减弱或任何形式的波动。」而正是这种坚定不移的特性乃是福乐的本质。而在地上，我们的痛苦不在于我们生病或同情，而在于我们因这些爱的表现而死去。
  - type: paragraph
    text:
      ru: 'В грядущем Царстве Христа составным элементом явится неугасимое пламя благодарности Господу Иисусу, спасшему нас Своими страданиями... Наш восторг перед Ним перейдет в вечность. Там Его снисхождение, Его истощание, Его трагическая смерть вдруг станут проявлением беспредельной Божией любви. И в вечности мы будем жить этой любовью Христа. Там мы вечно пребудем в восхищении от созерцания всего «дела» (см.Ин.16:4) Христа: воплощение, бегство в Египет, благая весть о спасении, Фавор, Тайная Вечеря, молитва в Гефсимании, жажда на Кресте и умирание. Все сие в неразрывной связи с Его чудесами, беспредельной премудростью Его проповеди – всего, что Он совершил»[62].'
      cn: 在基督将临的国度里，将有一个组成部分，即对上主耶稣永不熄灭的感恩之火，祂以自身的苦难拯救了我们……我们对祂的狂喜将持续到永恒。在那里，祂的降临，祂的谦卑虚己，祂那悲剧性的死亡，突然间将成为上帝无限之爱的显现。而在永恒中，我们将靠着这基督的爱而活。在那里，我们将永远赞叹不已，因着默观基督的整个「事工」（参约翰福音 16:4）：道成肉身，逃往埃及，救赎的福音，塔博尔山，最后的晚餐，在客西马尼园的祷告，在十字架上的干渴，和死亡。所有这一切都与祂的奇迹、祂宣讲中无限的智慧——祂所成就的一切——有着密不可分的联系»[62]。
  - type: paragraph
    text:
      ru: 'Когда я говорил о вечности, некоторые спрашивали: «А что мы будем делать в вечности и какой смысл в вечности?» Тогда у меня вставал вопрос очень остро: «Откуда бытие?» Мы знаем как факт, что Бог есть. Мы можем констатировать, что Бытие есть, что оно подлинно. Мы пребываем в этом Бытии. Но как оно возможно, мы не понимаем и мыслим его как чистый факт. Все, что сейчас было сказано мною, превосходит наш опыт, потому что мы еще должны перейти в эту иную форму жизни, которая за гробом. И тогда мы будем знать, но без возможности сообщить оставшимся, о том, как и что совершается в вечности. Покидая чрево матери и приходя в этот мир, мы воспринимаем мысли, чувства и все прочее от тех, которые были в этой жизни прежде нас, – мы научаемся жить. Так и в вечности. Когда мы умрем, мы попадем в общество существ, которые не знают смерти и для которых ее нет. И как объяснить это другим людям, которые живут на Земле, борясь со всеми болезнями и мучаясь на каждом шагу от угрозы смерти? И остается только это удивление перед тем, что Бытие есть реальность, но откуда оно, мы не можем знать.'
      cn: 当我谈及永恒时，有些人会问：「我们在永恒中会做什么？永恒有什么意义？」那时，一个问题非常尖锐地浮现在我脑海中：「存在的源头是什么？」我们知道一个事实是：上帝是存在的。我们可以断定，存在是有的，它是真实的。我们身处于这存在之中。但它如何可能，我们不理解，并且将其视为一个纯粹的事实。我刚才所说的一切超越了我们的经验，因为我们尚未进入那死后的另一种生命形式。那时我们就会知道，但却无法告知留下的人，关于永恒中如何以及发生着什么。离开母腹来到这个世界时，我们从那些比我们先来到这世上的人那里接收思想、情感以及所有其他事物——我们学会了生活。永恒中亦是如此。当我们去世时，我们将进入一个众生的社会，这些众生不知道死亡，并且对它们而言，死亡是不存在的。而这又如何能向其他世人解释呢，那些生活在地球上，挣扎于各种疾病之中，并每一步都饱受死亡威胁折磨的人们？剩下的只有这种惊奇：面对着存在是真实这一事实，但它从何而来，我们却无法得知。
  - type: paragraph
    text:
      ru: Итак, я говорю сейчас об этом в значительной степени потому, что я сам каждую неделю ощущаю убавление во мне жизни. Я смотрю на вас и только в некоторых случаях догадываюсь по лицу, кто это; а в других даже догадаться не могу. Я слепну, глохну и все время постепенно как бы изолируюсь от жизни. Но проходит какой-то срок, и эта постепенность меня пугает. И вот, переживая теперь этот процесс постепенного умирания, я и хочу говорить с вами. Если Бог примет мою душу так, как Он принял миллионы и миллионы других, и я буду в Нем живым существом, то моя связь с вами не прервется и вы будете в моем сердце, содержанием моей молитвы.
      cn: 所以，我现在谈论这件事很大程度上是因为，我自己每周都感觉到我生命中的消减。我看着你们，只有在某些情况下能从面孔猜出是谁；而在其他情况下甚至都猜不出来。我视力衰退，听力减弱，并且一直在逐渐地与生命隔绝。但随着时间的推移，这种渐进性让我感到恐惧。于是，我现在正在经历这个逐渐死亡的过程，我才想和你们谈谈。如果上帝接纳我的灵魂，就像祂接纳了千千万万其他灵魂一样，并且我将在祂里面成为一个活生生的存在，那么我与你们的联系就不会中断，你们将会在我的心中，成为我祷告的内容。
  - type: paragraph
    text:
      ru: У нас уже было так много свидетельств о жизни после гроба. И с Силуаном столько было ярких проявлений того, что он слышит молитвы и видит нас. Многие удивлялись на Святой Горе, как скоро и точно он предвидит даже мысль нашу. Он гораздо строже со мною и «легче» с другими.
      cn: 我们已经有了如此之多关于墓后生命的见证。并且在圣西卢安身上，有如此之多鲜明的显现，表明他听见祷告并看见我们。许多人在圣山上惊异，他如何快速而准确地预知，甚至连我们的思想。他对我严厉得多，而对与他人相处则「轻松」得多。
  - type: paragraph
    text:
      ru: 'Моя мать умерла во время Второй мировой войны, в сороковых годах. Моя сестра Екатерина умирала в шестидесятых годах от рака. И другая моя сестра, Мария, была в госпитале рядом с нею, когда сама Екатерина была в коматозном состоянии от страшной боли. И вдруг Екатерина подымается от подушки и совсем ясно говорит: «Я сейчас видела маму, и она сказала, что она хочет, чтобы все мы умирали верующими»[63]. Екатерина не была церковным человеком. Я не знаю, верила она или не верила, но это – факт: она сказала эти слова. И когда кончила, опустилась снова на подушки и была уже мертвая. Значит, общение с умершими возможно. Оно не просто, не легко, но, конечно, действенно.'
      cn: 我的母亲在二十世纪四十年代，于第二次世界大战期间逝世。我的姊妹叶卡捷琳娜在六十年代时，因癌症渐趋死亡。我的另一位姊妹玛丽亚，当时正在医院里陪伴在她身边，那时叶卡捷琳娜本人正因剧烈疼痛而陷入昏迷。忽然，叶卡捷琳娜从枕上抬起身子，非常清晰地说：「我刚才看见了妈妈，她希望我们所有人都作为信徒而死去」[63]。叶卡捷琳娜并非一位教会里的人。我不知道她是否相信，但这是事实：她说了这些话。她说完之后，又重新倒在枕头上，就已离世了。这意味着，与逝者交通是可能的。它并非简单，并非轻易，但当然是有效的。
  - type: paragraph
    text:
      ru: 'И сколько было случаев того, что молитва за умерших меняла их состояние посмертное. Мне пришлось как-то раз совершать панихиду на могиле одной румынской дамы, близкой ко двору короля. Это было в Италии, когда я был в гостях у ее семьи. Мы молились о ней, и она была с нами в молитве. Ее могила была рядом с нами. При молитве присутствовала и миссис N. Позднее уже в Англии к миссис N. пришла некая румынская знакомая и сказала: «Я видела эту даму, за которую вы молились. Она пришла торжествующая, радостная, и совсем все переменилось». И назвала день и час нашей молитвы. Подумайте: умершая женщина смогла сообщить о том своей подруге – в тот же час! Так непостижимо связаны все эти узлы. И наша жизнь связана с Силуаном. О, какого нам дал Бог отца!..'
      cn: 有多少事例表明，为亡者祷告改变了他们身后的境况。有一次，我曾在一座与国王宫廷关系密切的罗马尼亚女士的墓前举行追思礼拜。这事发生在意大利，当时我正在她家做客。我们为她祷告，她在祷告中与我们同在。她的墓就在我们旁边。祷告时，N夫人也在场。后来，在英国，N夫人的一位罗马尼亚熟人来访，并对她说：『我见到那位你们曾为之祷告的女士了。她以得胜、喜乐之姿而来，一切都彻底改变了。』她还说出了我们祷告的日期和时间。想想看：一位已逝的女士竟然能够在同一时刻把这事告诉她的朋友！所有这些环节都如此不可思议地联系在一起。我们的生命也与西路按相关联。哦，上帝赐予了我们怎样的一位父亲啊！
  - type: paragraph
    text:
      ru: Это все так живо. Хотя я сейчас и медленно умираю, но не знаю, когда будет это, но я устал уже жить. И пожалуйста, прошу вас, молитесь, чтобы Господь дал мне кончину мирную, христианскую, безболезненную. И тогда я буду, может быть, еще более связан с вами, чем теперь.
      cn: 这所有的一切都如此鲜活。尽管我现在正慢慢死去，但我不知道这一切何时会到来，但我已活得疲惫不堪。我恳请你们，祈祷上主赐予我一个平和、基督徒式、无痛苦的善终。那么，也许我将与你们的连结比现在更紧密。
  - type: paragraph
    text:
      ru: 'В моей жизни было удивление перед тем, как вечный Бог мог облечься во временную форму бывания: я говорю о воплощении Бога. Как вообще все это возможно? Но это факт, и умалить его никак нельзя. Итак, я прошу вас, молитесь за меня, а я буду молиться за вас, если мне будет дано, потому что спасение – вещь столь великая! Подумайте: если человек-персона пребывает вечно с Богом, – это так велико, что, действительно, мы можем только удивляться премудрости Божией.'
      cn: 我的一生中曾对永恒的上帝竟能披戴暂时的存在形式感到惊奇：我说的就是上帝的道成肉身。这究竟如何可能呢？但这是事实，且绝不能贬低它。所以，我恳请你们为我祈祷，而我也会为你们祈祷，如果我蒙允，因为救恩——是如此伟大的事！请思考：如果作为位格的人永恒地与上帝同在——这如此伟大，以至于我们，确实，只能惊叹于上帝的至智。
  - type: paragraph
    text:
      ru: И да хранит вас Господь!
      cn: 愿主护佑您！
  - type: paragraph
    text:
      ru: '«Пойте Богу нашему, пойте: пойте Цареви нашему, пойте»(Пс.46:7–8)!'
      cn: 歌颂我们的上帝，歌颂：歌颂我们的君王，歌颂！(诗篇 46:7-8)
- type: heading1
  text:
    ru: 'Беседа 8: О принципах монашеской жизни[64]'
    cn: 第八讲：论修道生活的原则[64]
  children:
  - type: paragraph
    text:
      ru: 'О видении истинного критерия. Познание дается в единстве любви. О путях старца Иосифа и прп. Силуана. О смиренномудрии при богопознании. «Мы начинаем с азов». Идея единства прп. Силуана: как воплотить ее в нашей «семье». Как воспринять принцип жизни и вдохновение. Будьте «артистами». Наш Бог – живой, ипостасный.'
      cn: 关于对真正标准的认识。认识是在爱的合一中获得的。关于长老约瑟夫和圣西卢安的道路。关于在认识上帝时的谦卑心智。「我们从基础开始。」圣西卢安的合一理念：如何在我们的「家庭」中实现它。如何领受生命的原则和启发。成为「艺术家」。我们的上帝是活生生的，有位格的。
  - type: paragraph
    text:
      ru: 'Как всегда, предо мною безмерный океан открывающегося нам Бога! Как всегда, я воспринимаю Его мир сферически, ибо в сфере, как в круге, нет начала, нет конца: любая точка имеет то же значение. Поэтому не ждите от меня хорошо построенного слова. Сегодня я постараюсь найти способ объяснить некоторые практические пути монашеской жизни.'
      cn: 一如既往地，在我面前铺陈着向我们启示的上帝那无垠的海洋！一如既往地，我以球形的方式领悟祂的世界，因为在球体中，如同在圆圈中，没有始，没有终：任何一点都具有同样的意义。因此，不要指望我能措辞严谨。今天，我将尝试设法阐明隐修生活的一些实用途径。
  - type: paragraph
    text:
      ru: 'Я не хочу быть оригинальным. Я хочу следовать примеру бесспорных святых, представителей нашего учения:«Итак, еслиестькакое утешение во Христе, еслиестькакая отрада любви, еслиестькакое общение духа, еслиестькакое милосердие и сострадательность, то дополните мою радость: имейте одни мысли, имейте ту же любовь, будьте единодушны и единомысленны; ничегоне делайтепо любопрению или по тщеславию, но по смиренномудрию почитайте один другого высшим себя. Не о себетолькокаждый заботься, но каждый и о других. Ибо в вас должны быть те же чувствования, какие и во Христе Иисусе»(Флп.2:1–5). Эти слова апостола Павла точь-в-точь я готов повторить сегодня. Поэтому вы можете уследить, что ничего нового и экстравагантного я не позволяю себе. Метод мой такой. В самом начале моего афонского монашества я обратился к одному пустыннику с просьбой говорить мне о молитве, и вот как я пишу об этом. Этот подвижник, «усмотрев в моей просьбе желание услышать о великой молитве, ответил: “Будем говорить о том, что в пределах нашей меры. Беседа о том, что выше нас, может вмениться в празднословие”. Устыдился я от этих слов, но все же осмелился сказать: “Действительно, я желаю узнать о более совершенном, о том, что превосходит меня, превосходит мою меру, но это не потому что я претендую на высшее меня, нет, но потому что мне представляется необходимым иметь путеводящую звезду, чтобы проверять себя – на верном ли я пути. В древности мореплаватели ориентировались по невероятно далекой звезде; так я хотел бы иметь в духе видение истинного критерия, пусть чрезвычайно высокого, чтобы не успокоиться на том малом, что до сего времени познал я”. Тот святой муж согласился, что так мыслить не только допустимо, но и должно»[65].'
      cn: '我不愿标新立异。我愿效法无可争议的圣者们，效法我们教义的代表：


        「所以，在基督里有什么劝慰，有什么爱心的安慰，有什么圣灵的交通，有什么慈悲怜悯，你们就要使我的喜乐满足：存同样的心思，有同样的爱心，意念相同，一心一意。凡事不可因结党，不可因贪图虚浮的荣耀，却要凭着谦卑的心，看别人比自己强。各人不要单顾自己的事，也要顾别人的事。你们当以基督耶稣的心为心。」 (腓立比书 2:1-5)


        使徒保罗的这些话，我今天也准备一字不差地重复。因此，你们可以察觉，我并没有放任自己去说任何新奇或出格的话。我的方法是这样的。在我阿陀斯山修道生活的最初，我向一位隐修士请教关于祷告的事，我对此是这样记述的。这位苦行者，看出我的请求是想听关于伟大祷告的事情，便答道：「我们谈论那些在我们能力范围内的事吧。谈论那些超越我们的事，可能会被算作空谈。」我因这些话而感到羞愧，但仍鼓起勇气说：「确实，我渴望了解更完全的事物，那些超越我、超越我的限度之事，但这并非因为我觊觎高于我的境界，不，而是因为在我看来，有必要拥有一颗指路之星，以便检验自己——我是否走在正确的道路上。古时，航海者凭借一颗遥不可及的星辰来辨明方向；我也因此希望在灵里拥有一个真实标准的愿景，即便它极高，以免安于我迄今所了解的微末之事。」那位圣洁的修士同意，如此思考不仅是允许的，而且是必要的[65]。'
  - type: paragraph
    text:
      ru: 'Вы знаете склонность человека: едва ему что-то открылось, как он уже начинает гордиться – и при всем своем невежестве он может быть гордым. Так, имея пред собою принцип невероятно великий, что бы ни познали, мы будем смиряться. И это необходимо по первой заповеди Христа:«Блаженны нищие духом»(Мф.5:3). В моем завещании[66]я избрал то, что я лично считаю самым высоким, самым таинственным, сердечным желанием Христа. На Тайной Вечере Он сказал:«Се, заповедаю вам, да любите друг друга...»И«По тому узнают все, что вы Мои ученики, если будете иметь любовь между собою»(Ин.15:17;Ин.13:35). В самом завещании, конечно, я только указал на то наивысшее, что может быть с нами по вере нашей: единство по образу Святой Троицы. Господь не оставил нам сие в виде заповеди. Однако то, что Он говорил в молитве к Отцу перед самой Своей голгофской смертью, было, как я думаю, действительно последним и высочайшим:«да будут все едино, как Ты, Отче, во Мне, и Я в Тебе,таки они да будут в Нас едино»(Ин.17:21). Но, зная недостижимость для нас, после падения Адама, сей последней высоты и полноты обожения, я предложил вам это как критерий, чтобы вы судили, где вы: стали ли вы действительно учениками Христа или остановились где-то на середине пути.'
      cn: 你们知道人的习性：只要他稍有领悟，便立刻开始骄傲起来——即便他一无所知，也可能心生骄傲。因此，当我们面对一个无比伟大的原则时，无论我们认识到什么，我们都会谦卑下来。这也是必要的，正如基督的第一条诫命所言：「福哉心灵贫乏的人」（马太福音 5:3）。在我的遗嘱[66]中，我选择了那些我个人认为最崇高、最奥秘、发自基督内心的愿望。在最后的晚餐上，祂说：「我这样吩咐你们：要彼此相爱……」又说：「这样，所有人都会认出你们是我的门徒，如果你们彼此相爱的话」（约翰福音 15:17，约翰福音 13:35）。当然，在遗嘱本身，我只是指出了我们凭借信仰所能达到的最高境界：依照圣三的形象所达到的合一。上主并未将此留给我们作为一条诫命。然而，祂在祂哥尔哥法之死前向父祷告时所说的，我认为，那确实是最终极、最崇高的：「愿他们都合而为一，正如祢，父啊，在我里面，我在祢里面一样，愿他们也在我们里面合而为一」（约翰福音 17:21）。然而，我们知道，在亚当堕落之后，这最终的至高境界和完满的神化是我们无法达到的，所以我将此作为一项准则向你们提出，以便你们判断自己的境况：你们是真正成为了基督的门徒，还是停留在半途之中。
  - type: paragraph
    text:
      ru: У нас недавно был один старец, ученик знаменитого безмолвника Иосифа на Святой Горе. Я просил его сказать слово о высокой молитве, и он говорил нам о своих методах воспитания монахов – о дисциплине молитвы, постов, послушания, о различных подвигах и прочих деяниях монаха, ведущих к тому, чтобы каждый монах стал как бы молитвой пред Богом. И это великое дело. Однако, спрашивая пустынника, я имел мысль о том, что должно присутствовать в уме и в духе нашем как видение последней цели.
      cn: 我们最近有一位长老，他是圣山著名的隐修者约瑟夫的弟子。我请他讲一讲关于高等祈祷的事，他就向我们讲述了他培养修士的方法——关于祈祷、禁食、顺从的纪律，关于修士的各种苦行和其它修持，这些都旨在使每位修士在上帝面前都如同祈祷一般。这是一项伟大的功业。然而，当我询问这位隐士时，我心里想的是，在我们的心智和灵里，应该有什么作为最终目标的愿景。
  - type: paragraph
    text:
      ru: 'Имея опыт монашеской жизни на Афоне, я проходил эту школу так, как говорил о ней этот старец. Тем не менее, встретившись с отцом Силуаном, я тогда получил настоящий ответ на мой вопрос о совершенной молитве. От отца Силуана я услышал: «А я хотел бы только смирения Христова и молиться за всего Адама, как за самого себя»[67]. Те, которые знают путь вслед стопам Христа на Голгофу, в состоянии оценить это слово. Мы, как сыны Адама, должны носить в себе сознание всечеловеческое. Однако пал Адам, и мы стали неспособными воспринять эту высокую жизнь – божественную, вечную, согласно тому закону, который мы видим в Боге: «В предвечном рождении Сына Отец вложил в Него всю полноту Своего бытия» (ср.Кол.1:19).[68].'
      cn: 我在阿索斯山拥有修士生活的经验，我就是按照这位长者所说的那样，度过了这所学校。然而，当我遇见圣西卢安神父时，我那时才真正得到了关于完全祷告的问题的答案。我从圣西卢安神父那里听到：「我所愿的，只是基督的谦卑，并为所有亚当祈祷，如同为我自己一般。」[67] 那些知道如何跟随基督的脚步走向各各他的人，能够领会这句话的价值。我们，作为亚当的子孙，应该怀有普世的人性意识。然而，亚当堕落了，我们变得无法领受这种崇高的生命——即神圣的、永恒的生命，而这生命是依照我们在上帝身上所见的法则的：「在圣子在永恒中的诞生里，父将祂自身存在的全部丰盛倾注在祂里面。」（参歌罗西书 1:19）[68]
  - type: paragraph
    text:
      ru: 'Тем дорогим нам братьям и сестрам, которых мы получили по дару Божию, еще надлежит достигнуть умного видения – где конец нашего пути. Почему нам нужно видение конечной цели? – Если мы имеем эту «Полярную звезду», ось мира, невероятно далекую, то знаем направление и знаем, насколько мы еще далеки от нашей цели. Тогда мы избежим нелепой вещи, которая губит многих великих людей: каковы бы ни были наши познания, каким бы глубоким ни был наш опыт, мы никогда не вознесемся в мыслях своих, никогда не испытаем самодовольства, которое есть паралич духовный и даже смерть.'
      cn: 我们蒙上帝恩赐所得的亲爱的弟兄姐妹们，仍需达到属灵的洞见——那是我们道路的终点。为什么我们需要这最终目标的洞见呢？——如果我们拥有这颗「北极星」，这遥不可及的世界轴心，我们便知方向，并知道我们离目标还有多远。如此，我们便能避免一件荒谬之事，这事曾毁坏了许多伟大之人：无论我们的知识多么渊博，无论我们的经验多么深刻，我们绝不会在思想中自高，绝不会感到自满，因为自满是属灵的瘫痪，甚至是死亡。
  - type: paragraph
    text:
      ru: 'Почему я тороплюсь, будучи при смерти сказать вам эти слова? – Мы живем в великую эпоху истории человечества. Не зная положительно, но мы имеем много оснований думать, что история человека на Земле стоит пред опасностью своего конца. Такие эсхатологические настроения теперь свойственны всему миру. Поэтому с вами, получившими образование мира сего, надо говорить серьезно об этом пути. Наш путь – это, с одной стороны, последнее и наивысочайшее видение: «Да будем мы едины, как Отец и Сын», а с другой стороны, сознание нашей крайней немощи, когда мы не можем сохранить даже малых заповедей Христа. Как дерзнем мы говорить об этой высоте? Лично я стою пред таким явлением: хотя это видение и безмерно высоко и далеко превосходит всякую мою мысль, для меня оно было сдерживающим началом и все время рождало во мне чувство моего ничтожества. С другой стороны, мы не можем отказаться от веры в то, что Бог, творя нас по Своему образу ради полного подобия Ему, даст нам это подобие.'
      cn: 我为何急于在临近死亡之际向你们说这些话？——我们生活在人类历史的一个伟大时代。虽未能确知，但我们有充分理由认为世上人类的历史正面临终结的危险。这种末世论情绪如今已遍及全球。因此，对你们这些受过世俗教育的人，必须严肃地谈论这条道路。我们的道路，一方面是那最终极、最崇高的异象：「愿我们合而为一，如同父与子一般」；另一方面，则是我们对自身极度软弱的自觉，我们甚至无法持守基督的小小诫命。我们怎敢谈论这等高度呢？就我个人而言，我面对着这样一种现象：尽管这异象是如此无限高远，远远超越我的一切思想，但对我而言，它却是一个约束的开端，并且一直在我心中催生出我自身的虚无感。另一方面，我们不能放弃这样的信仰：上帝，祂照着自己的肖像创造我们，为的是使我们完全肖似祂，必将赐予我们这肖似。
  - type: paragraph
    text:
      ru: 'Самая жизнь телесная исходит от Творца нашего, тем более жизнь извечная Божества исходит только от Него (ср.Ин.10:28, 14и т. д.), и сами мы ничего не можем сделать (Ин.15:5). Итак, отсюда получается, что в монашестве мы начинаем с азов, наподобие школьного воспитания, традиционного во всем мире. Мы начинаем с очень примитивных по своему характеру подвигов: с послушания (отсечения своей индивидуальной воли, не могущей иметь характера потока вечной жизни в нас), с молитвы (как единственного, самого лучшего пути единения с Богом) и с других – воздержания, поста, бдения и прочее. Все направлено на то, чтобы победить греховные страсти как наследие Адама и чтобы соделать нас способными воспринимать жизнь от Самого Бога. Итак, зная последнюю высоту, не забудем, что мы в начальной школе. И когда мы соблюдаем все эти монашеские правила и стараемся провести в нашу жизнь, в наше сердце этот опыт – любить хотя бы нашу семью, как свою собственную жизнь, – то так создается в нас расположение принять уже беспредельную благодать Бога.'
      cn: 肉身生命源自我们的造物主，更何况神性永恒的生命唯独源自祂 (参阅 约翰福音 10:28，14等)，我们自己什么也做不了 (约翰福音 15:5)。因此，由此可知，在修道生活中我们从基础开始，就像全世界通行的学校教育一样。我们从本质上极其简朴的苦行开始：从顺服（即斩断我们个体意志，因其无法承载内在永生洪流的特性）开始，从祷告（作为与上帝合一的唯一且最佳途径）开始，以及从其他——节制、禁食、彻夜祷告等等开始。这所有的一切旨在战胜作为亚当遗产的罪恶情欲，并使我们有能力从上帝那里领受生命。因此，当我们知道这最终的高度时，不要忘记我们正处于小学阶段。当我们遵守所有这些修道规则，并努力将这种体验带入我们的生命，带入我们的内心——甚至爱我们的家人，如同爱我们自己的生命一样——那么在我们里面就会形成一种心态，以接受上帝无限的恩典。
  - type: paragraph
    text:
      ru: 'Откуда у меня эта идея? – От того источника, который вы все знаете: от прп. Силуана. В книге я описываю жизнь малограмотного человека-солдата Силуана, в котором Господь увидел возможность доверить ему Свое «последнее». И в то мгновение, в котором Силуану открылась вечность, ему было сообщено необычайно высокое состояние духа. Он стал молиться за всего Адама, как за самого себя. Все мы – клеточки великого тела всего человечества. Через нас проходит космическая и даже сверхкосмическая Божественная жизнь. И мы должны приготовить себя к уразумению сего, ибо тогда мы становимся подобными, отчасти, Адаму до падения и начинаем носить в себе все человечество, всего Адама, как нечто единое, созданное Богом.'
      cn: 我这想法从何而来？——源自你们都熟知的那个源头：圣西卢安长老。在书中，我描述了目不识丁的士兵圣西卢安的生平，上主在他身上看到了托付祂「最终」之事的可能性。就在永恒向圣西卢安显现的那一刻，他被赋予了一种异常崇高的精神状态。他开始为全人类（亚当）祈祷，视同为自己祈祷。我们都是全人类这伟大身体的细胞。借着我们流淌着宇宙的，乃至超宇宙的神圣生命。我们必须预备自己以领悟此事，因为那时我们便会，在某种程度上，变得像堕落前的亚当，并开始将全人类、整个亚当，作为一个由上帝所造的合一之物承载于自身。
  - type: paragraph
    text:
      ru: 'Теперь я хотел бы говорить о более «скромном». Если нам недоступно или не дано то, что получил Силуан, наш ближайший отец, то что нам делать? И вот я решился предложить вам нашу «семейную» жизнь. Нас немного: двадцать с небольшим человек. Зная, что у каждого из нас одна и та же цель, попробуем все мы осознать нашу жизнь как единую семью единого человека. Господь говорил Отцу в Своей последней молитве:«да будут все едино, какМы» (см.Ин.17:21). И это есть состояние наше: жить нашу семью так, чтобы каждый был нашим братом, и тогда мы восчувствуем себя в Боге таким образом, что всё и все – для каждого из вас. И как во Святой Троице нет ни большего, ни меньшего, так должно быть и с нами.'
      cn: 现在我想谈谈更「谦逊」的。如果我们无法获得或未被赐予圣西卢安，我们最亲近的教父所领受的，那我们该怎么办呢？于是我决定向你们建议我们的「家庭」生活。我们人数不多：二十余人。既然我们每个人都有着同一个目标，我们就试着去领悟，将我们的生活视作一个人的一个家庭。上主在祂最后的祷告中对天父说：「愿他们都合而为一，如同我们一样」（参阅约翰福音 17:21）。这就是我们的状态：如此生活在我们的家庭中，以至于每个人都是我们的弟兄，这样我们就能在上帝内感受到，一切和所有的人——都是为了你们每个人。并且如同在圣三一中，既无更大者，也无更小者，我们也当如此。
  - type: paragraph
    text:
      ru: Может быть, подходит психологический пример для объяснения того, что я хочу сказать, – пример матери. Мать любит своих детей и работает для них, становясь рабою. Хотя опыт жизни ее превышает опыт детей, она ни в чем не уничижает их. Если дети превосходят ее своими дарованиями, она ощущает их превосходство как свое собственное достоинство и счастье. Так же и мы должны были бы поступать по отношению к нашим братьям.
      cn: 也许，适合用来解释我想要说的话，是一个心理学上的例子——母亲的例子。母亲爱她的孩子们，并为他们劳作，甚至成为仆役。尽管她的生活经验远超孩子们，她却从不轻看他们。如果孩子们凭借他们的天赋超越她，她将他们的超越视为她自身的尊荣和幸福。同样地，我们也理应如此对待我们的兄弟们。
  - type: paragraph
    text:
      ru: 'Нам всем необходимо установить себе правило жизни такое. Когда мы принимаем кого-нибудь в члены братства, мы берем на себя долг – всю его жизнь заботиться о нем, до смерти. Это не есть «просто взять и потом выгнать как-нибудь». Нет! Это есть акт, когда мы становимся родными, членами одной и той же семьи. В значительной мере это осуществляется в молитве: каждого за все братство и всего братства за каждого. Почему я благодарен Богу, видя вас в этом монастыре, разных национальностей и поbackground?[69]– Потому что это соответствует моей идее: «Как я могу любить всего Адама? – А вот как: я займусь маленьким делом – любить этих людей, двадцать с небольшим человек, как моих братьев и сестер».'
      cn: 我们所有人都需要为自己确立这样一个生活法则。当我们接纳某人成为修士团的成员时，我们就担负起一项责任——终其一生关照他，直至他离世。这并非是「随意接纳之后再随意逐出」。不！这是一种让我们成为亲人、同一家庭成员的举动。这在很大程度上通过祷告来实现：每个人为整个修士团祷告，以及整个修士团为每个人祷告。为什么我在这座修道院看到你们，不同民族和背景的你们时，向上帝感恩？[69]——因为这与我的想法相符：「我如何能爱整个亚当呢？——就是这样：我将做一件小事——爱这些人，二十几个人，如同我的弟兄姊妹。」
  - type: paragraph
    text:
      ru: То, что я предложил вам в моем завещании, было очень кратким. Сейчас я объясняю его, чтобы, помня высшее видение нашей цели, вы сохранили бы смирение и если и не любовь, то хотя бы доброе сердце по отношению ко всякому приходящему к нам. Тогда наш подвиг был бы действительно разумным и полезным. Я высказал вам свою мысль, как она выливается в слова, не всегда одинаковые...
      cn: 我在遗嘱中向你们提出的，是非常简短的。现在我来解释它，以便你们记住我们目标的最高愿景，保持谦卑，即使不是爱，至少也要对所有来到我们这里的人怀有一颗良善的心。那么，我们的修功就将是真正明智而有益的。我向你们表达了我的思想，它是如何化为言语的，这些言语并非总是相同的……
  - type: paragraph
    text:
      ru: 'Скажу вам то, что я стесняюсь всегда говорить: читайте книгу о старце и его писания! И даже то, что я написал во второй книге, читайте! Скучно: потому что это всегда выше нашего ума, подобно тому, как если читать высшую математику при незнании даже средней. Однако читайте! Тогда постепенно какие-то выражения, касающиеся самого принципа нашей жизни, войдут в ваше сознание, как входит язык матери в сознание ребенка, становясь его собственным языком. Писание Нового Завета нам дано Самим Христом, но оно становится нашим языком, нашим мышлением. Потому мы можем сказать, что если мы мыслим так же, как мыслит Христос в Евангелии (см.Флп.2:5;1Кор.2:16), формулируя Свои заповеди, то мы получаем познание через общение в мудрости этих заповедей с мудростью Самого Бога.'
      cn: 我要告诉你们一件我总是羞于启齿的事：阅读关于那位长老的书和他的著作吧！甚至我写在第二本书里的，也请你们阅读！这令人感到枯燥：因为这总是超越我们的心智，就像在不懂初等数学的情况下阅读高等数学一样。然而，请阅读！那么，一些关于我们生命根本原则的表达，将逐渐进入你们的意识中，就像母亲的语言进入孩子的意识中，成为他自己的语言一样。新约圣经是基督亲身赐予我们的，但它成为了我们的语言，我们的思想。因此我们可以说，如果我们思想的方式，如同基督在福音中思想的方式一样（参腓立比书 2:5，哥林多前书 2:16），祂制定着祂的诫命，那么我们便通过在这些诫命的智慧中与上帝自己的智慧相通而获得认知。
  - type: paragraph
    text:
      ru: Что очень важно для нас? – В книге я написал, что Господь, благий Отец, открыл мне Сына Своего и я возлюбил Его всем моим существом[70]. И эта любовь превратилась в не покидающее меня (даже в моей слабости и болезни) ВДОХНОВЕНИЕ. Как бы я хотел, чтобы вы все восприняли это вдохновение! Когда попадается ученикам книга, которая не для их возраста, они очень скоро утомляются и устают. Так и вы будете уставать. Однако продолжайте! – Через повторение и увеличение опыта каждодневной жизни вы усвоите это, и характерно при этом, что нельзя торопиться в нашей жизни. Бог действует по-разному с нами. Самый редкий вид подвижников – те, кому с самого начала Бог являет совершенство. Тогда вся жизнь становится тяжким мученичеством. Человек, который вкусил любовь Бога, неизбежно и тяжко страдает в этом мире, где царят ненависть, братоубийство, эгоизм, стремление задавить брата своего, чтобы пообедать пожирнее. Все эти вещи, которыми, к сожалению, многие люди по неведению живут, причиняют нам страдания. Но не бегите от этих страданий.
      cn: 对我们而言，什么最重要呢？——我在书中写道，上主，那慈爱的天父，向我启示了祂的圣子，我便以我全部的生命去爱祂[70]。而这份爱化作了不曾离弃我的（即使在我的软弱与病痛中）启迪。我多么希望你们所有人都能领受这份启迪！当学生们读到一本不适合他们年龄的书时，他们很快就会疲倦和厌烦。你们也会如此感到疲倦。然而，请坚持下去！——借着日复一日的生活经验的重复与增长，你们将会领悟它。并且，值得一提的是，在我们生命中不能操之过急。上帝以不同的方式与我们同工。最罕见的苦行者类型是，那些上帝从一开始就向其显现完美境界的人。那么，他们的一生便会成为一场沉重的殉道。尝过上帝之爱的人，在这个世界上，必然且深重地受苦，这里充斥着仇恨、兄弟相残、自私自利，以及为了一顿更丰盛的午餐而压倒自己兄弟的欲望。所有这些事物，遗憾的是，许多人因无知而沉溺其中，都给我们带来苦难。但请不要逃避这些苦难。
  - type: paragraph
    text:
      ru: 'Те из вас, которые готовились стать музыкантами, знают, что искусство требует всего человека. Когда я был живописцам, если спал без снов, то на утро не знал, что мне делать: ибо я должен был продолжать писать и во время сна. И когда я ночью во сне работаю, то утром встаю и иду со свежей силой и пишу то, что мне нужно. Так я много раз говорил, что хорошо быть артистом[71]по характеру, чтобы наша жизнь всегда была вдохновенною: мы можем страдать, у нас нет сил, но вдохновение где-то, как какой-то поток энергии, течет постоянно. И тогда жизнь наша не знает уныния. Так будьте все вы артистами своей жизни и храните вдохновение, потому что ничего нет во всем бытии большего, чем Христос и Его учение! Все остальное, чем гордится человечество, блекнет в сравнении с тем, что дал нам Христос. Он говорил Своим ученикам:«блаженны очи, видящие то, что вы видите! ибо сказываю вам, что многие пророки и цари желали видеть, что вы видите, и не видели, и слышать, что вы слышите, и не слышали»(Лк.10:23–24). И теперь уже «руина», я действительно никогда не был богатым человеком – я бедный, я грешная земля, – но все равно благоволил Бог дать мне место у ног великого Силуана. И то, что я говорю, хотя и преложилось как-то в мое познание (и значит как бы «мое познание»), но исходит оно из его опыта...'
      cn: 你们中间那些准备成为音乐家的人，都知道艺术要求人献出全部。当我还是个画家的时候，如果我睡着没有做梦，那么第二天早上我就不知道该做什么：因为我甚至在睡梦中也必须继续作画。当我在夜里睡梦中工作时，那么早上我醒来，带着崭新的力量，去描绘我所需要描绘的。我曾多次说过，最好在性格上成为一名艺术家[71]，这样我们的生命就总是充满灵感：我们可能会受苦，我们可能会没有力量，但灵感却像某种能量流一样，一直在某个地方持续流动。如此，我们的生命就不会经历沮丧。愿你们都成为自己生命的艺术家，并保有灵感，因为在整个存在中，没有什么比基督和祂的教义更伟大的了！人类引以为傲的一切其他事物，与基督赐予我们的相比，都黯然失色。祂对祂的门徒说：「福哉那些看见你们所看见之事的眼睛！因为我告诉你们，有许多先知和君王想要看见你们所看见的，却没有看见；想要听见你们所听见的，却没有听见」(路加福音 10:23-24)。而现在，我已是「残垣断壁」，我确实从来不是一个富有的人——我贫穷，我是有罪的尘土——但上帝仍然施恩，赐予我在伟大的圣西卢安脚下的位置。而我所说的一切，尽管以某种方式转化成了我的认知（也就是说，仿佛是「我的认知」），但它却源自他的经验……
  - type: paragraph
    text:
      ru: 'Чтобы лучше понять мои слова о вечности персональной, ипостасной, читайте мою статью о принципе персоны в бытии Божественном и в бытии человеческом[72]! Персона, или лучше по-гречески «ипостась», носит в себе все бытие. И чтобы выразить это, я назвал это «ипостасным состоянием», по образу ипостаси Единородного Сына Божия. Когда вы встречаетесь с этой терминологией, знайте об этом. Есть понятие Живого Бога – это Бог персональный, ипостасный. У многих философов божество становится чем-то только мыслимым, а не сущим действительно, тогда как Бог сказал Моисею: «Бытие это Я. Ты хочешь знать, что такое бытие? Это Я, и кроме Меня ничего не существует. И Я создал все» (см.Исх.3:14). И это – Бог живой, Бог любви, а не отвлеченное божество, которое идет «дальше» персонального начала и которое есть «бог философов». А мы будем служить Богу Живому, доколе сами не станем ипостасью, персоной, лицом, как Христос. И вечная жизнь обетована этому лицу, этой ипостаси (ср.Ин.14:19).'
      cn: 为了更好地理解我关于位格性的永恒的言论，请阅读我关于在神圣的存有中和在人类的存有中位格原则的文章[72]！位格，或者更确切地按希腊语说，『位格』，在自身中承载着全部的存有。为了表达这一点，我称之为「位格状态」，仿照上帝独生之子的位格的形象。当你们遇到这种术语时，就请知晓这一点。有一个活的上帝的概念——这就是位格性的、本原性的上帝。在许多哲学家那里，神性变成了某种仅仅是思想之物，而非真实存有之物；然而上帝对摩西说：「存有即是我。你想知道什么是存有吗？就是我，除我以外一无所有。并且我创造了一切。」（参阅出埃及记 3:14）。而这——就是活的上帝，爱的上帝，而非抽象的神性，后者『超越』了位格的起始，并且是「哲学家们的上帝」。而我们将侍奉活的上帝，直到我们自己也像基督一样，成为位格、人格、面容。并且永恒的生命被应许给这个面容，这个位格（参阅约翰福音 14:19）。
  - type: paragraph
    text:
      ru: Храни вас Бог!
      cn: 上帝保守您！
- type: heading1
  text:
    ru: 'Беседа 9: Об организации жизни монастыря по принципу персоны[73]'
    cn: 第九讲：论修道院生活以位格为原则的组织[73]
  children:
  - type: paragraph
    text:
      ru: 'Устав и персона. Молитва в церкви, в келье и за мир. О сожительстве людей. О каждодневной борьбе со грехом на пути ко спасению. О неизбежности трений. Пример Христа: как видеть конечную цель. Наша «семья» – от Бога. Прп. Силуан и святые там, где Христос.'
      cn: '规矩与个人。


        在教堂里、在隐修室里，并为世界的祷告。关于人们的共同生活。关于每日在通往救赎的道路上与罪恶的争战。关于摩擦的不可避免性。基督的榜样：如何看见最终目标。我们的「家庭」——源自上帝。尊者圣西卢安以及圣者们在基督所在之处。'
  - type: paragraph
    text:
      ru: '...Если слово читается по записи, оно теряет свою жизнь. Так когда я говорю без записи, потерпите и вы мои недостатки, ибо теперь передо мною стоят две темы, чрезвычайно трудные и очень важные для всей жизни нашего братства.'
      cn: 如果话语是照着记录宣读的，它就失去了生命。那么，当我无稿发言时，也请你们宽容我的不足，因为现在我面前有两个主题，对我们整个弟兄会的生活来说，它们都异常艰难且极其重要。
  - type: paragraph
    text:
      ru: 'Раньше и теперь я нередко слышу некоторые указания от братьев и сестер на недостатки нашей организации. И я хотел вам объяснить один из самых важных вопросов: в основании всякой организации лежит какая-то идея. Самому мне пришлось жить на Афоне, соблюдая веками установленную дисциплину. И надо сказать, что я с глубоким благоговением отношусь к традициям Святой Горы. Однако если важна традиция Святой Горы, то можно сказать, что закон Моисеев был все-таки большего значения, чем дисциплина монашеского жития даже на Афоне. И тем не менее о законе Моисеевом святой апостол Павел говорит, что никакой закон не доводит до совершенства (см.Рим.3:20. ср.Гал.3:11). Законы, уставы, правила могут помогать в начале, но затем они останавливают прогресс. Есть конец всякому закону. А задача, стоящая пред человеком, образом Божиим, превосходит все границы.'
      cn: 从前和现在，我时常听到一些来自兄弟姐妹的、关于我们组织中不足之处的指教。我想向你们解释一个最重要的问题：任何一个组织的基础都建立在某种理念之上。我本人曾有幸在阿索斯山生活，遵守着数世纪以来既定的规程。而且必须说，我对圣山的传统怀有深切的敬畏。然而，如果圣山的传统很重要，那么可以说，摩西律法终究具有比阿索斯山的修道规程更重大的意义。但即便如此，关于摩西律法，圣使徒保罗说，没有任何律法能使人达到完全（参罗马书 3:20；比较加拉太书 3:11）。律法、规章、规则在开始时可能有所帮助，但之后它们会阻碍进步。任何律法都有尽头。而摆在人面前的、作为上帝肖像的任务，超越了一切界限。
  - type: paragraph
    text:
      ru: 'Помню, тридцать лет тому назад мне пришлось быть в одном монастыре около Оксфорда, и там духовный отец и игумения спросили меня об организации нашего братства. Я им сказал, что самое трудное в организации жизни монашеского общежития состоит в том, чтобы удержать единство дисциплины и вместе с тем оставить свободу для проявления персонального характера каждого из братии. Я говорю об этом персонализме, потому что Бог дал мне на пути встретить блаженного и святого отца Силуана, жизнь которого превосходила законы и традиции Святой Горы. Итак, помня апостола Павла, который гениально постиг невозможность никакого писаного закона для человеческого духа, и, с другой стороны, пример прп. Силуана, который дал мне Бог наблюдать восемь лет (частые контакты и беседы с ним оставили на мне эту печать), я не стал заботиться об уставах при организации нашей жизни. Есть какой-то минимум: скажем, надо в одно и то же время молиться, лучше в одно и то же время и питаться, так же – и в труде. А иначе – полный развал, так как очень трудно организовать вообще физиологическую жизнь человека.'
      cn: 我记得，三十年前我曾身在牛津附近的一座修道院，在那里，属灵导师和女院长问我关于我们兄弟会的组织方式。我告诉他们，组织修道院集体生活最困难的事情，在于保持纪律的统一性，同时又保留自由，让每位修士的个性得以展现。我谈及这种位格主义，因为上帝让我在人生道路上遇见了蒙福又圣洁的圣西卢安神父，他的生活超越了圣山的法则和传统。因此，我铭记使徒保罗——他天才般地领悟到，任何成文律法对人类精神而言都是不可能的；另一方面，我又想起上帝让我观察了八年的圣西卢安长老的榜样（与他频繁的接触和交谈在我身上留下了这种印记），我在组织我们的生活时，便没有去顾及规章制度。也有一些最低限度：比如说，必须在同一时间祈祷，最好也在同一时间用餐，劳动亦是如此。否则，便会彻底瓦解，因为要组织人的生理生活本就非常困难。
  - type: paragraph
    text:
      ru: 'Я решил исходить из данных опыта наших великих отцов, что два часа молитвы внимательной – это есть мера совершенных. Вот почему я предложил братьям два раза в сутки по два часа этой молитвы. Я вовсе не предполагал, что каждый из нас способен во все эти два часа принести молитву с умом, который ни на одно мгновение не отклонился бы от памяти присутствия Божия. Так, хотя внешне и установлено предложенное мною правило – два часа умной молитвы, – я не ждал совершенного его исполнения. Однако надеюсь, что постепенно все вы, мои братья и сестры, достигнете действительно той совершенной меры, возможной для человека. Помимо этих четырех часов умной молитвы, каждый из вас в меру своих сил может и должен молиться наедине в келье. И кроме того: каждое действие в течение дня сопровождается мыслью о Боге.'
      cn: 我决定基于我们伟大教父们的经验，即两个小时的专注祷告是达成完善者的尺度。这就是为什么我建议弟兄们每日两次，每次两小时进行这种祷告。我丝毫没有料想，我们每个人都能在这两个小时的全部时间里，以心思进行祷告，而心思片刻不偏离对上帝临在的记忆。因此，尽管表面上已经确立了我所建议的规矩——两个小时的心祷，但我并未期望其能完美地实现。然而，我希望你们所有人，我的弟兄姐妹们，能够逐渐达到人所能达到的那种确实完善的尺度。除了这四个小时的心祷之外，你们每个人都可以也应该按照各自的能力，在各自的小室中独处祷告。此外：白天之内的每一个行动都伴随着对上帝的思念。
  - type: paragraph
    text:
      ru: 'Это – не совершенная, но святая форма жизни повседневной: когда на каждый труд испрашивается благословение Божие. Каждое действие сопровождается молитвой. Пример: выходя из комнаты, можно, открывая дверь, говорить: «Покаяния двери отверзи мне, Жизнодавче. Утренеет дух мой ко Храму святому Твоему». И вот, этот простой выход, простое действие полно памяти о Боге. Так можно усовершенствовать всю нашу жизнь. Вставая с постели на молитву после короткого монашеского отдыха, можно молиться: «Господи, восставь меня, ленивого, от одра и сна моего. И даждь мне силу провести день в памяти о Тебе», и так далее.'
      cn: 这并非完美，却是一种圣洁的日常生活方式：每项工作都求取上帝的降福。每个行动都伴随着祷告。例如：走出房间时，可以边开门边说：「忏悔之门为我敞开，赐生命者啊。我的心灵向着祢的圣殿而苏醒。」于是，这个简单的离开，这个简单的行动，便充满了对上帝的忆念。如此，便能使我们的整个生命臻于至善。从短暂的修道式安歇中起床进行祷告时，可以这样祷告：「主啊，求祢把我这怠惰之人从我的卧榻和睡梦中唤醒，并赐我力量在对祢的忆念中度过这一天。」等等。
  - type: paragraph
    text:
      ru: 'Как бы мы ни организовывали нашу молитву, когда речь идет о совместном жительстве людей, неизбежно разных между собою, непременно будут какие-то неудобства для одного, или для другого, или для обоих. Непременно будут какие-то трения. Но урок того, как мы можем парировать этот недостаток, мы найдем в писаниях старца Силуана:'
      cn: 无论我们如何组织我们的祷告，当涉及人们共同生活时，他们之间必然存在差异，因此必定会给一方、或另一方、或双方带来一些不便。必定会存在一些摩擦。但关于我们如何能化解这一不足的教训，我们会在圣西卢安长老的著作中找到：
  - type: paragraph
    text:
      ru: '«Все хотят иметь мир, но не знают, как этого достигнуть. Паисий Великий раздражился и просил Господа избавить его от раздражительности. Явился ему Господь и говорит: “Паисие, если хочешь не раздражаться, то ничего не пожелай, никого не осуди и не возненавидь – и не будешь раздражаться”. Так каждый человек, если отсекает свою волю перед Богом и людьми, всегда будет мирен в душе, а кто любит волю свою, тот никогда не будет мирен.'
      cn: 「每个人都渴望拥有平安，却不知道如何达到。圣大帕西感到恼怒，并向上主祈求使他摆脱恼怒。上主显现给他，并说：「帕西啊，如果你想不恼怒，那么什么都不要企求，不要论断任何人，也不要憎恨——这样你就不会恼怒了。」同样，每个人如果在上帝和人面前斩断自己的意愿，他的灵魂将永远平安；而那喜爱自己意愿的人，他的灵魂将永无平安。」
  - type: paragraph
    text:
      ru: 'Душа, предавшаяся воле Божией, легко несет всякую скорбь и всякую болезнь, потому что и в болезни она молится и созерцает Бога: «Господи, Ты видишь мою болезнь; Ты знаешь, как я грешен и немощен; помоги мне терпеть и благодарить Твою благость». Господь облегчает болезнь, и душа чувствует Божию помощь и бывает весела пред Богом и благодарна.'
      cn: 顺服上帝旨意的灵魂，轻易地承受一切苦难和一切病痛，因为甚至在病痛中，她也祷告并默观上帝：「上主啊，祢看见我的病痛；祢知道我何等有罪又何等软弱；求祢帮助我忍受并感谢祢的美善。」上主减轻病痛，灵魂便感受到上帝的帮助，并在上帝面前喜乐感恩。
  - type: paragraph
    text:
      ru: 'Если постигнет тебя какая неудача, то думай: «Господь видит сердце мое, и если Ему угодно, то будет хорошо и мне, и другим», и так душа твоя всегда будут в мире. А если кто будет роптать: это не так, а это нехорошо, то никогда не будет мира в душе, хотя бы он и пост держал, и много молился.'
      cn: 如果你遭遇任何挫折，那么要思想：「主洞察我的心，并且如果这蒙祂悦纳，那么对我和对他人都会是好的。」如此你的灵魂将永远在平安中。而如果有人发怨言：「这不是这样，那也不好。」那么灵魂里就永不会有平安，即使他守斋，并且做了许多祷告。
  - type: paragraph
    text:
      ru: Апостолы имели великую преданность воле Божией; этим хранится мир. Также и все святые великие люди терпели все скорби, предаваясь на волю Божию.
      cn: 使徒们对上帝的旨意有极大的委顺；由此保守了平安。照样，所有伟大的圣徒们也忍受了所有的苦难，委顺于上帝的旨意。
  - type: paragraph
    text:
      ru: Господь нас любит, и потому мы можем ничего не бояться, кроме греха, потому что из-за греха теряется благодать, а без благодати Божией враг погонит душу, как ветер гонит лист сухой или дым.
      cn: 上主爱我们，因此我们除了罪以外，什么都不必惧怕，因为罪会使恩典丧失，而没有上帝的恩典，仇敌就会追赶灵魂，如同风吹赶枯叶或烟雾一般。
  - type: paragraph
    text:
      ru: Надо крепко помнить, что враги сами пали гордостью и нас всегда стараются толкнуть на ту же дорогу, и многих прельстили они. Господь сказал:«научитесь от Менякротости и смирению,иобрящетепокой душам вашим» (см.Мф.11:29).
      cn: 务必牢记，仇敌自己因骄傲而堕落，并且总是企图将我们推向同一条道路，他们也诱惑了许多人。上主说：「你们当向我学习温良与谦卑，你们的灵魂就必得享安息。」(马太福音 11:29)
  - type: paragraph
    text:
      ru: О, милостивый Господи, даруй нам мир Твой, как Ты дал мир Святым Апостолам:«мир Мой даю вам»(Ин.14:27).
      cn: 哦，慈悲的主啊，求祢赐予我们祢的平安，正如祢赐予平安给圣使徒们：「我把我的平安赐给你们」（约翰福音 14:27）。
  - type: paragraph
    text:
      ru: Господи, дай и нам насладиться миром Твоим. Святые Апостолы получили мир Твой, и на весь мир излили его, и, спасая народ, не теряли мира, и он в них не умалился.
      cn: 主啊，也让我们享受祢的平安。圣使徒们领受了祢的平安，并向全世界倾注了它，他们在拯救世人时未曾失却平安，平安在他们里面也未曾减损。
  - type: paragraph
    text:
      ru: Слава Господу и Его милосердию, что Он много нас любит и дает нам мир Свой и благодать Святого Духа.
      cn: 荣耀归于上主和祂的怜悯，因祂深深爱我们，并赐予我们祂的平安和圣灵的恩典。
  - type: paragraph
    text:
      ru: Как сохранить мир душевный среди соблазнов наших дней?
      cn: 如何在今日的诱惑中保持灵魂的平安？
  - type: paragraph
    text:
      ru: Судя по Писанию и по характеру народа нынешнего, мы живем последнее время, и все же надо сохранить мир душевный, без которого нельзя спастись, как сказал великий молитвенник земли Русской преподобный Серафим. При жизни преподобного Серафима, за молитвы его, Господь хранил Россию; а после него был другой столп, достигавший от земли до неба, – отецИоанн Кронштадтский. На нем мы остановимся, он нашего времени, и мы видели его молящимся, тогда как других мы не видели.
      cn: 根据圣经和现今世人的品性，我们正生活在末世，然而我们仍需持守心灵的平安，没有它就无法得救，正如俄罗斯大地上伟大的祈祷者，可敬的塞拉芬所言。在可敬的塞拉芬生前，因着他的祷告，上主保守了俄罗斯；而在他之后，又有一位从地上达到天上的支柱，——克朗施塔特的伊望神父。我们将把重心放在他身上，他属于我们这个时代，我们曾亲眼见他祷告，而其他人我们未曾亲见。
  - type: paragraph
    text:
      ru: Помним, как после Литургии, когда ему подали лошадь (экипаж) и он стал садиться, окружил его народ, ища благословения, и в такой сутолоке душа его непрестанно пребывала в Боге, и в такой толпе он не рассеивался и не терял душевного мира. Как же он достигал этого? – Вот наш вопрос.
      cn: 我们忆及，在圣礼后，当人们给他牵来马匹（马车），他正要上车时，人们将他团团围住，寻求祝福，在这样的熙攘中，他的灵魂持续地住在上帝之中，在这样的人群中，他没有分散心神，也没有失去内心的平安。他是如何达到这种境界的呢？——这就是我们的问题。
  - type: paragraph
    text:
      ru: 'Он этого достигал и не рассеивался, потому что любил народ и не переставал за него молиться Господу:'
      cn: 他达到了这一点，并且没有分心，因为他爱众人，并且不间断地为他们向上主祷告：
  - type: paragraph
    text:
      ru: “Господи, даруй мир Твой людям Твоим.
      cn: 主啊，赐予祢的子民祢的平安。
  - type: paragraph
    text:
      ru: Господи, даруй рабам Твоим Духа Твоего Святого, чтобы Он согревал сердца их любовью Твоею и наставлял их на всякую истину и добро.
      cn: 主啊，求祢赐予祢的仆人们祢的圣灵，使祂用祢的爱温暖他们的心，并指引他们进入一切真理与良善。
  - type: paragraph
    text:
      ru: Господи, хочу, чтобы мир Твой был во всем народе Твоем, который Ты возлюбил до конца и дал Сына Твоего Единородного, дабы спасти мир.
      cn: 主啊，我切愿祢的平安充满在祢的全体子民中，这祢爱到底的子民，甚至赐下祢的独生子，为要拯救世人。
  - type: paragraph
    text:
      ru: Господи, даруй им благодать Твою, чтобы они в мире и любви познали Тебя, и возлюбили бы, и сказали бы, подобно Апостолам на Фаворе:«Добро нам, Господи, быть с Тобою»(см.Мф.17:4).
      cn: 祢啊，赐予他们祢的恩典，使他们在平安与爱中认识祢，并爱慕祢，如同使徒们在他泊山上所说的：「主啊，我们在这里真好。」（马太福音 17:4）
  - type: paragraph
    text:
      ru: Так непрестанно молясь о народе, он сохранял мир душевный, мы же теряем его, потому что нет в нас любви к народу. Святые Апостолы и все святые желали народу спасения и, пребывая среди людей, пламенно молились за них. Дух Святой давал им силу любить народ; и мы, если не будем любить брата, то не сможем иметь мира.
      cn: 如此不住地为人民祷告，他保持着灵魂的平安，我们却失去了它，因为我们里面没有爱人民的心。圣使徒们和所有圣人都渴望人民得救，并且，当他们住在人中间时，热切地为他们祷告。圣灵赐予他们去爱人民的力量；而我们，如果我们不爱弟兄，就无法拥有平安。
  - type: paragraph
    text:
      ru: Пусть каждый подумает об этом.
      cn: 愿每个人都思考此事。
  - type: paragraph
    text:
      ru: Слава Господу, что Он не оставил нас сирых, но дал нам на землю Духа Святого. Дух Святой учит душу неизглаголанной любви к народу и жалости ко всем заблудшим. Господь пожалел заблудших и послал Сына Своего Единородного спасти их; и Дух Святой учит такой же жалости к заблудшим, которые идут во ад. А кто не стяжал Духа Святого, тот не хочет молиться за врагов.
      cn: 荣耀归于上主，因祂没有撇下我们为孤儿，却将圣灵赐予我们在此地上。圣灵教导灵魂对世人那无法言喻的爱，以及对所有迷失者的怜悯。上主怜悯迷失者，并差遣祂的独生子去拯救他们；圣灵也教导同样地怜悯那些走向地狱的迷失者。然而，凡未得圣灵者，就不愿为仇敌祷告。
  - type: paragraph
    text:
      ru: 'Преподобный Паисий Великий молился за своего ученика, который отрекся от Христа, и, когда он молился, явился ему Господь и говорит: “Паисие, за кого ты молишься; ведь он же отрекся от Меня?”, но Преподобный продолжал жалеть своего ученика, и тогда Господь сказал ему: “Паисие, ты Мне уподобился любовью”»[74].'
      cn: 圣大帕西修士为他背弃基督的门徒祈祷。当他祈祷时，上主向他显现，并说：「帕西，你为谁祈祷？他不是背弃了我吗？」但这位圣修士继续怜悯他的门徒。于是上主对他说：「帕西，你因着爱与我相似了。」[74]
  - type: paragraph
    text:
      ru: 'И дальше наш блаженный отец будет говорить о том, что надо любить и жалеть врагов и молиться за весь мир, за всего Адама. Это как раз и есть то, о чем я хочу говорить вам, прежде чем кончатся мои дни. Это есть то, о чем я пишу в неловких словах относительно принципа персоны в человеке. И это есть то, о чем меня спросили в том монастыре около Оксфорда: как сочетать дисциплину монашеской жизни, повседневный труд, послушание и все другие нужды?'
      cn: 接下来，我们蒙福的教父将会谈到，我们必须爱惜并怜悯敌人，并为整个世界，为全人类亚当祈祷。这正是我在我的日子结束之前想要告诉你们的。这正是我用笨拙的言语所写下的，关于人里面的位格原则。这正是在牛津附近的那个修道院里他们问我的问题：如何将修道生活的纪律、日常劳作、顺服以及所有其他需求结合起来？
  - type: paragraph
    text:
      ru: 'Этот пример, который дал мне Господь наблюдать перед моими глазами – человека, который достиг этой меры[75], стоит предо мною всегда как цель для всех и каждого из нас. Но путь к сему лежит через терпеливую и упорную борьбу со всяким проявлением в нас греха. В нашем правиле молитвенном мы несколько раз на богослужении в церкви слышим слова: «Сподоби, Господи, в день сей, или в вечер сей, или в ночь сию без греха сохранитися нам». Так вся забота наша о том, чтобы возможно меньше совершали мы грехов. Как бы мы ни жили, в нас остается некая тень несовершенства. Но все-таки жизнь в этой заботе приготовляет нас к получению благодати от Бога, когда человек молится за все человечество, как за самого себя. И это – мера Божественного совершенства. Мы можем наблюдать ее в писаниях отца Силуана. Надо организовать жизнь так, чтобы обеспечить духовный прогресс до тех пор, покамест не придет от Бога извещение как свидетельство Духа о спасении нашем.'
      cn: 这个榜样，是上主让我亲眼所见的——一位达到此等身量[75]的人，总是摆在我面前，作为我们每个人的目标。但通往此目标的道路，在于耐心而坚韧地与我们里面罪的一切显现争战。在我们的祷告规程中，我们多次在教会的神圣礼仪中听到这些话语：「上主，求祢使我们在这白日，或在这黄昏，或在这夜晚，得以无罪蒙保守。」因此我们所有的关注都在于，我们所犯的罪尽可能地少。无论我们怎样生活，我们里面总会留有某种不完美的阴影。然而，怀着这种关注而生活预备我们领受来自上帝的恩典，当人能为全人类祷告，如同为自己祷告一般之时。而这正是神圣完美的极致身量。我们可以在西路亚神父的著述中观察到这一点。我们需要这样规划生活，以确保属灵上的长进，直到来自上帝的印证到来，作为圣灵关于我们得救的见证。
  - type: paragraph
    text:
      ru: 'Итак, когда вы видите какие-нибудь недостатки в организации нашей жизни, не думайте, что игумен или духовники монастыря не знают об этом. Они знают, но нет возможности при организации жизни совместной устранить всякие трения. Однако что делать для того, чтобы все-таки уменьшить эти трения? – А вот что: надо закрыть глаза на многие неловкости и трудности повседневной жизни и думать день и ночь о нашей конечной цели – о спасении. Итак, будем все время иметь перед собою образ Христа, который восходит на Голгофу с тем, чтобы разорвать стальной обруч проклятия человечества за грех Адама.'
      cn: 那么，当你们在我们的生活组织中看到任何缺点时，不要认为院长或修道院的诸神师对此一无所知。他们知道，但在组织共同生活时，无法消除一切摩擦。然而，为了最终减少这些摩擦，该怎么做呢？——答案是：应当对日常生活中许多不便和困难视而不见，并且昼夜思想我们的最终目标——得救。那么，让我们时常将基督的形象摆在面前，祂登上各各他，为要粉碎人类因亚当之罪所受咒诅的钢铁镣铐。
  - type: paragraph
    text:
      ru: 'Конечно, все сие превосходит нашу силу, но если я позволяю себе сегодня говорить об этом, как и в другие дни, то что толкает меня на это? – Не будьте строги со мною, но я хочу всегда и во всем иметь «пример» в нашем Господе и Боге Иисусе Христе. В Евангелии от Марка говорится о случае, когда некий отец привел к Апостолам сына своего – малыша, одержимого бесом. Но Апостолы не могли помочь ему, и бесноватый мальчик оставался по-прежнему больным. Тогда этот отец дерзнул обратиться к самому Христу и сказал Ему: «Вот, мое несчастье – у меня сын болен. Исцели его Ты. Я привел его к Твоим ученикам, и они не смогли этого сделать». И Господь тогда говорит:«о, род неверный! доколе буду с вами? доколе буду терпеть вас?»(Мк.9:17–19) Их этих слов видно, как Бог Господь был опечален тем, что Его ученики не смогли сделать этого дела. Он торопился пойти на Голгофу и потому говорит: «Доколе Я буду с вами? Мне нужно сделать более важное дело». Так каждый из нас пусть будет носить в себе сознание, что перед нами стоит более важное дело, чем всякие мелочи повседневной жизни. И это – один из образов борьбы за совершенство.'
      cn: 当然，这一切都超越了我们的力量，但是，如果我今天，像往常一样，允许自己谈论这一切，是什么促使我这样做呢？— 请不要对我过于严苛，但我希望在任何时候，在任何事上，都能以我们的上主和上帝耶稣基督为「榜样」。马可福音中记载了一个事例，当一位父亲带着他被邪魔附身的小儿子来到使徒们面前。但使徒们无法帮助他，那被邪魔附身的男孩仍然病着。于是，这位父亲大胆地转向基督本人，对祂说：「看哪，我的不幸——我的儿子病了。祢来医治他吧。我带他来找祢的门徒，他们却无法做到。」主那时说：「嗳！这不信的世代啊！我与你们同在要到几时呢？我忍受你们要到几时呢？」(马可福音 9:17-19) 从这些话中可见，上帝上主因祂的门徒无法做成这件事而感到忧伤。祂急着要上各各他，因此说：「我与你们同在要到几时呢？我需要去做更重要的事情。」因此，我们每个人都应当怀有这样的意识，在我们面前摆着一件比日常生活中一切琐事更重要的事情。而这，正是为追求完美而奋斗的一种方式。
  - type: paragraph
    text:
      ru: 'Каждый день, каждую ночь, на каждом богослужении в храме повторяйте молитву вашу о всех и каждом из членов нашего братства. И тогда дух ваш будет вырастать и все мы будем жить как единая семья братьев и сестер. Вместо устава писаного требуется, чтобы наше сердце расширилось до тех пределов, когда мы заботимся о каждом из наших братьев и сестер. Для нас самих невозможно пойти к Богу, но Богу возможно прийти к нам, когда мы приготовляемся в этих малых размерах монастыря. Мы лежим на земле грешные, извращенные, но Он может снизойти до нас и освятить нас. Уподобиться Христу во всем: в мышлении, в реакциях, в поведении, – это есть совершенство для человека. Если воплотился Сын Отчий, то это ясно, что жизнь Христа, весь облик Его есть откровение для нас о предвечной мысли Бога о человеке. И тогда жизнь наша становится полною смысла, полною благословения Божия...'
      cn: 每天，每夜，在圣堂的每一次事奉圣礼中，为我们兄弟会中的所有成员以及其中每一个人诵念你们的祷告。如此一来，你们的灵性将会成长，我们众人就都将如同一个兄弟姐妹的大家庭般生活。取代成文的规章，所要求的是，我们的心能扩展到那样的境地，以至于我们能关怀我们的每一位兄弟姐妹。我们自身无法去到上帝那里，但当我们在修道院的这小小范围内预备自己时，上帝却可能来到我们这里。我们躺卧于尘世，罪恶而堕落，但祂可以俯就我们并圣化我们。在一切事上效法基督：在思想、在回应、在行为上——这就是人的完美。若父之子道成肉身了，那么这很清楚，基督的生命，祂的全部形像，就是对我们而言，关于上帝对人那先永恒之思想的启示。如此一来，我们的生命就变得充满意义，充满上帝的祝福……
  - type: paragraph
    text:
      ru: 'Беседа наша кончается, но я надеюсь, что вы будете внимательны к этому слову, потому что мы собрались здесь из самых разных стран мира и все по-разному воспринимаем жизнь. И как нам, исходя из нашего греховного состояния, возможно прийти ко Христу? – Скажу вам: у каждого из нас должна быть мысль, что семья наша не случайное собрание, а дана нам от Бога. И эту семью мы должны полюбить. Все мы столько лет причащаемся от единой Чаши, молимся одними и теми же словами, имея пред собою образ Христа и Его заповеди! Конечно, мы должны совершенствоваться и прийти (вот, страшно мне говорить об этом!)в состояние, которое мы видим у Силуана.'
      cn: 我们的谈话即将结束，但我希望你们能留意我的话语，因为我们从世界各地汇聚于此，并且对生命有着各自不同的领悟。那么，我们又该如何从我们有罪的状态出发，才能来到基督面前呢？——我要告诉你们：我们每个人都应该有这样的想法，我们的家庭并非偶然的聚会，而是上帝赐予我们的。我们应当爱这个家庭。这么多年来，我们所有人都领受着同一圣杯，诵念着相同的祷词，面前是基督的圣像和祂的诫命！当然，我们必须完善自己，并达到（哦，我说这话时感到有些畏惧！）圣西卢安所展现的那种境界。
  - type: paragraph
    text:
      ru: 'И благодарите Бога, что нам дал Господь такого великого отца. Читайте почаще его слова! Помню, я получил несколько писем со Святой Горы Афон и из других мест от людей, которые писали мне, что книга старца Силуана у них была рядом с Евангелием и они читали ее каждый день. Если люди имели только писания старца и так поступали, то мы имеем теперь его икону в иконостасе рядом со Христом – по слову Господа:«где Я, там и слуга Мой будет»(Ин.12:26). И вот, в иконостасе и на фресках – Бог и все, которые подобны Ему: и Матерь Его Святая, и Креститель, и Апостолы, и все наши отцы...'
      cn: 并且感谢上帝，因为上主赐予我们这样一位伟大的教父。经常诵读他的话语！我记得，我收到过几封来自阿索斯圣山和别处的信，信中人们告诉我，他们将圣西卢安长老的著作与福音书并列，并且他们每天诵读。如果人们仅仅拥有长老的著作并如此行事，那么我们现在拥有他的圣像，与基督一同置于圣像屏风上——正如上主所说：「我在哪里，我的仆人也要在那里」(约翰福音 12:26)。于是，在圣像屏风上和壁画中，有上帝以及所有像祂的人：还有祂的圣母，还有施洗者，还有使徒们，还有我们所有的教父们……
  - type: paragraph
    text:
      ru: Я еще предложу вам мое неловкое слово, чтобы нам быть вместе и жить единой идеей.
      cn: 我仍将向你们进献我的拙言，为使我们能同心合一，并以同一意念生活。
  - type: paragraph
    text:
      ru: И да благословит вас Господь!
      cn: 愿主赐福你们！
- type: heading1
  text:
    ru: 'Беседа 10: Как проводить Великий Пост[76]'
    cn: 第十讲：如何度过大斋期[76]
  children:
  - type: paragraph
    text:
      ru: Как провести Пост в видении конечной цели. О голгофской победе Христа. О великопостных богослужебных текстах. О живом предании Церкви. О различной выдержке у каждого. Радость выдерживается недолго. О некоторых деталях Поста. О Прощеном Воскресенье. Как препобеждаются искушения. Древо познания и разделения среди людей. Убавить себя велико пред Богом – как привлечь благодать. Апокалиптические настроения. Единство в Бытии как обожение. О молитве прп.Ефрема Сирина.
      cn: '如何以终极目标为导向守大斋。

        关于基督在哥耳哥法的胜利。

        关于大斋期的礼拜仪式文本。

        关于教会的活圣传。

        关于每个人不同的持守度。

        喜乐不易长久持守。

        关于大斋期的一些细节。

        关于宽恕主日。

        如何战胜诱惑。

        知识之树与人之间的分裂。

        在上帝面前贬抑自己是伟大的——如何吸引恩典。

        末世论的心态。

        在存有中的合一即神化。

        关于圣荣福叙利亚的厄弗冷的祷文。'
  - type: paragraph
    text:
      ru: 'Сегодня и вчера у меня болит сердце, и странным образом болит... И я молил Бога: «Не сейчас. Дай мне завершить дело жизни моей». И вот, в завершение дела жизни моей, я начну беседовать с вами о том, как провести Пост.'
      cn: 今天和昨天，我心痛，并且以一种奇怪的方式疼痛着……我向上帝祈求说：「不是现在。请让我的生命事业得以完成。」于是，在我的生命事业即将完成之际，我将开始与你们谈论如何度过大斋期。
  - type: paragraph
    text:
      ru: 'Я говорил вам уже о моем методе, который советую вам усвоить. Метод этот такой: увидеть нашу конечную цель и к ней идти, начиная с азов. Что касается Поста, надо поставить себе тот же принцип, но в уменьшенных масштабах. Надо понять, что пятьдесят дней Поста предложены нам для приготовления к восприятию воскресения из мертвых. И мы построим так видение свое: теперь начинаетсяподвиг. Наше вдохновение умножается при мысли о том, что сотни миллионов людей-христиан будут хранить сей Пост. Путь к воскресению для самого Бога воплощенного лежал через страдание. Тайну страданий мы поймем лишь после. Вначале мы принимаем это как условие нашего роста в Боге, как условие нашего развития для восприятия Слова Божия и усвоения путей Его в деятельной жизни.'
      cn: 我已经对你们说过我的方法，我建议你们学习掌握的。这个方法是：看清我们的最终目标，并从基础开始向它迈进。至于斋期，应该给自己设定同样的原则，但规模要缩小。应该明白，这五十天的斋期被赐予我们，是为了预备我们领受死而复活。我们将这样建立我们的愿景：现在，苦修开始了。一想到数亿基督徒将要遵守这斋期，我们的灵感便倍增。通往复活的道路，对道成肉身之上帝本身而言，也是通过受苦的。受苦的奥秘，我们只有在之后才能明白。起初我们接受它，作为我们在上帝里成长的条件，以及我们发展自身以领受上帝的圣言、并在实际生活中掌握祂的道路的条件。
  - type: paragraph
    text:
      ru: Итак, мы составим себе такую картину на Великий Пост и будем видеть, как один Человек на Земле решил, в Самом Себе, пойти на Голгофу и разорвать железный обруч проклятия за Адамов грех, претерпеть положительно все, на всей Земле никем не понятый, никем по-настоящему не воспринятый. И когда Он завершил это«дело»(см.Ин.4:34, 17:4), то сказал:"дерзайте,Я победил мир»(Ин.16:33).
      cn: 所以，在大斋期我们为自己描绘一幅这样的景象，并将看到，一位世上的人，凭祂自己，决定去往各各他，撕裂因亚当之罪而来的咒诅铁箍，完全忍受一切，在全地上无人理解，也无人真正领受。当祂完成这「工作」（参看 约翰福音 4:34，17:4），祂便说：「你们要勇敢，我已胜了世界。」（约翰福音 16:33）
  - type: paragraph
    text:
      ru: '«“Одним человеком грех вошел в мир“(Рим.5:12) – говорит апостол Павел, – и единым Человеком приходит спасение». Если перед нами будет стоять такая цель, то мы воспримем Великий Пост как святой период в жизни целого года. И когда мы с радостью несем телесный подвиг воздержания от пищи, то это не разрушает нас, а помогает во всех планах: и в духовном, и в физическом.'
      cn: 「罪是借着一人入了世界」（罗马书 5:12）——使徒保罗说——「救恩也借着一人而临到。」如果我们将此作为我们的目标，那么我们就会将大斋期视为全年生活中一个圣洁的时期。当我们以喜乐的心承担身体上禁食的苦功时，这并不会摧毁我们，反而有助于我们各个方面：无论是属灵的，还是身体的。
  - type: paragraph
    text:
      ru: Правда, я теперь на старости лет могу сказать, что у меня отнято это наслаждение Великого Поста. На Святой Горе, живя в монастыре, который был самый бедный и самый трудный в смысле поста, я переносил Великий Пост с радостью и легко. Теперь я этого сделать не могу. Я лишен этого благословения и счастья.
      cn: 确实，我如今在晚年可以说，我被夺走了圣大斋期带来的这份喜乐。在圣山，生活在一间就斋戒而言最贫困也最艰难的修道院中时，我曾带着喜乐和轻松地度过了圣大斋期。如今我却不能再这样了。我被剥夺了这份降福和幸福。
  - type: paragraph
    text:
      ru: В гениальном создании годового круга богослужений этот Пост занимает исключительное место. Службы Великого Поста, куда в значительной мере входят тексты из Ветхого Завета, являются учением, выраженным часто с невероятно высоким даром поэзии.
      cn: 在匠心独具的年度礼仪循环中，这个大斋期占据着独特的地位。大斋期的礼仪，其中大量采用了旧约经文，是一种教导，常常以其不可思议的崇高诗才来表达。
  - type: paragraph
    text:
      ru: Для примера приведу ирмосы канона, который будет петься:Помощник и Покровитель бысть мне во спасение, сей мой Бог, и прославлю Его, Бог Отца моего и вознесу Его, славно бо прославися. Вдохновляющие слова, заключающие в себе великий смысл – тот, что мы называем Преданием.
      cn: 我将引用即将咏唱的圣颂颂词（Hirmos）作为示例：上主是我的帮助和庇护，祂成了我的救恩。这位是我的上帝，我要荣耀祂，祂是我父亲的上帝，我要尊崇祂，因祂已在荣光中受荣耀了。这些是富有深意的鼓舞人心的话语——我们称之为圣传。
  - type: paragraph
    text:
      ru: Живое Предание прежде всего сказывается в духе жизни. Учение догматическое приходит позднее. Сначала сердце любит Господа и идет вслед Ему,«куда бы Он ни пошел»(Откр.14:4). А потом добавляется постепенно несравненное наслаждение постигать пути спасения сего мира... Итак, повторяю вам, покамест это не вкоренится в ваши сердца и в ваши умы, что такой путь есть путь спасения.
      cn: 活的圣传首先体现在生命的灵中。教义学说其后才出现。首先，心爱上主并跟随祂，「无论祂往何处去」（启示录 14:4）。然后，渐渐地增加的，便是领悟此世救赎之路的无比喜乐……因此，我再次对你们说，除非这根植于你们的心中和头脑中，即是，这样的道路乃是救赎之道。
  - type: paragraph
    text:
      ru: 'И хотя это так, в наше время, к сожалению, выдержка наших организмов, с детских лет потрясенных в плане нервной системы, страшно уменьшилась. В прежнее время много было подвижников, которые могли без еды проводить недели, месяцы, подражая воздержанию Христа, Его посту в пустыне сорок дней перед выходом на проповедь (см.Мф.4:2). Теперь это сравнительно редкое явление среди подвижников. Причем отмечаю с болью в сердце одно весьма жалкое явление: по соображениям медицинского порядка люди способны выносить пост, но ради Бога ничего не идет – потому что есть какой-то дух, который препятствует всякому делу в следовании Христу.'
      cn: 尽管如此，在我们这个时代，令人遗憾的是，我们身体的耐力——自幼年起在神经系统方面受到冲击的——大大减弱了。在过去，有许多苦修者能够不吃不喝数周、数月，效法基督的节制，祂在旷野禁食四十天，在出去传道之前（参见 马太福音 4:2）。如今，这在苦修者中间是一种相对罕见的现象。并且，我痛心地指出一种相当可悲的现象：出于医学上的考虑，人们能够忍受禁食，但为了上帝，却什么也做不了——因为有一种灵，阻碍着所有追随基督的努力。
  - type: paragraph
    text:
      ru: 'В прежние годы в монастыре те, кто мог, воздерживались до пятницы или даже до субботы. Но это было не для всех. Первый день вообще кухни нет. Начиная со второго дня готовится чай. Некоторые три дня не ели. Некоторые только два дня. Причем странное явление: первые дни очень тяжело даются. На второй день, во вторник, начинает кружиться голова. После этого, в среду, возможен перелом и облегчение поста для организма. Но для больных невозможен даже один день поста в силу их болезни.'
      cn: 往年在修道院里，那些能够做到的人会禁食，直到周五，甚至直到周六。但这并非人人都能做到。第一天完全不开伙食。从第二天开始供应茶水。有些人三天不进食。另一些人则只禁食两天。而且有一个奇怪的现象：最初的几天极其难熬。到了第二天，也就是周二，人会开始感到头晕目眩。此后，到了周三，可能会出现一个转折点，身体会感到禁食的负担减轻。但对于病人来说，由于他们的病情，即使禁食一天也是不可能的。
  - type: paragraph
    text:
      ru: 'На Афоне первый день Поста для многих был тяжел, потому что там были крепкие мужики. Выделения желез для пищеварения, не находя товара в желудке, начинали разрушать самый желудок. В таком случае надо им было в понедельник что-то есть, чтобы не повредить здоровья. Итак, я не готов сейчас перечислять всех вариаций органических, кому что нужно и кому что возможно. И мы держимся такого метода: не обязательно воздержание полное в течение всей недели; не обязательно даже до среды, до первой Литургии Преждеосвященных Даров; не обязательно даже и первый день провести совсем без пищи. Пусть каждый изберет по силе своей. Пусть каждый добровольно идет на тот подвиг, который перед нами открывается. И так они в состоянии будут пройти Пост без того, чтобы потерять настоящую его цель – встретить в нашей плоти тленной благодать Воскресения.'
      cn: 在阿陀斯山，斋期的第一天对许多人来说是艰难的，因为那里有强壮的汉子。消化腺的分泌物，因在胃里找不到「货物」，就开始损害胃本身。在这种情况下，他们需要在星期一吃些东西，以免损害健康。因此，我现在不准备列举所有的生理差异，以及谁需要什么，谁能做什么。我们秉持这样的方法：不一定非要在整个一周内完全禁食；甚至不一定非要等到星期三，等到首次预献圣礼仪典；甚至不一定非要完全不进食度过第一天。愿每个人依照自己的能力选择。愿每个人自愿承担展现在我们面前的那种苦修。这样他们就能守斋，而不失去其真正的目的——在我们必朽的肉体中迎接复活的恩典。
  - type: paragraph
    text:
      ru: 'Каждый год вам будет дано переживать парадоксальную вещь: Пост, со всеми подвигами плача, покаяния, бдения и так далее, мы можем выдержать пятьдесят дней. А Пасху – радость пасхальную – мы можем переживать очень короткое время, и потом у нас нет сил на радость. Казалось бы, естественнее наоборот: Постом – сокрушение, а затем – восторженная радость Воскресения, которая оживляет человека!'
      cn: 每年，你们都会经历一件自相矛盾的事：大斋期，连同哭泣、悔改、守夜等所有功修，我们却能坚持五十天。然而，逾越节——那逾越节的喜乐——我们却只能经历很短的时间，之后我们便没有力量去喜乐了。照理说，颠倒过来才更自然：大斋期是痛悔，而后是复活的狂喜之乐，那能使人活过来！
  - type: paragraph
    text:
      ru: 'Итак, я не предполагаю говорить вам о деталях организации Поста. У отцов Церкви записаны некоторые характерные черты, как проходит Пост. Но, считаясь с тем, что это трудно, мы делаем так: первую, четвертую и седьмую недели Поста мы практикуем большее воздержание, чем в остальные. Так как тело наше может быть разрушено бездействием, в церковной практике рекомендуются земные поклоны. И такие поклоны днем и ночью человек кладет, чтобы тело пребывало в движениях и в напряжении. Иначе для молодого тела отсутствие движений становится невыносимым и разрушительным. Поэтому в Церкви читаются молитвы с земными поклонами. Это, с одной стороны, выражение нашего смирения в покаянной молитве, а с другой – это физические движения, необходимые при отсутствии работ.'
      cn: 那么，我不打算与你们谈论大斋期安排的细节。教父们记载了一些大斋期是如何进行的特有方式。但鉴于这有难度，我们这样做：在大斋期的第一周、第四周和第七周，我们比其他周实行更严格的节制。因为我们的身体可能因缺乏活动而衰弱，所以在教会实践中建议行大拜。日夜行这样的礼拜，是为使身体保持运动和张力。否则，对于年轻的身体来说，缺乏运动会变得无法忍受并具有破坏性。因此，在教会中诵读伴随大拜的祷文。这，一方面是在忏悔祷告中我们谦卑的表达，而另一方面，这是在缺乏劳作时所必需的身体活动。
  - type: paragraph
    text:
      ru: 'Апостол Павел говорит: «Кто не трудится, тот и не ест» (1Тим.5:18):«трудящийся достоин награды своей». А в письме экзарху митрополиту Николаю я однажды написал: «...А мы, как и во всем, теперь изменили и это: кто не ест, тот не трудится». Когда не дают пищи, то не требуй работы! Нам Бог дал особую привилегию: мы свободны определять для себя наши условия. Мы не богаты помещением. У нас действительно не хватает места для удобного жилища. Но все-таки, если мы храним заповеди Христа, благодать не оставит нас. И когда благодать не оставляет, то молитва идет с успехом во всех условиях: и в труде-работе, и наедине в келье, и в храме. Итак, я вам сказал в немногих словах о предстоящем Великом Посте.'
      cn: 使徒保罗说：「若有人不肯作工，就不可吃饭」（1提摩太书 5:18）：「作工的人配得他的酬报。」而在我写给总主教尼古拉都主教的一封信中，我曾写道：「……而我们，一如我们改变了一切，如今也改变了这一点：谁不吃，谁就不作工。」当不给食物时，就不要要求工作！上帝赐予了我们一项特殊的特权：我们可以自由地为自己决定我们的条件。我们不富裕于房舍。我们确实没有足够的空间作舒适的居所。但无论如何，如果我们遵守基督的诫命，恩典就不会离开我们。当恩典不离开时，那么祷告在一切境况下都会成功：无论是在劳作中，还是独自在隐修室中，还是在圣堂中。所以，我已经简单几句告诉你们关于即将到来的大斋期。
  - type: paragraph
    text:
      ru: 'Вернусь снова к тому же, чтобы лучше отпечаталось в вашем сознании то, что я считаю принципиально необходимым: иметь конечную цель и к ней стремиться. Тогда мелкие стороны нашей повседневной жизни будут проходить без особого потрясения для нашего организма и для нашей психики. И это не только на Пост, но и после него и всегда, на всякий день: нам нужно помнить о цели и смысле нашего пребывания здесь. Мы собрались вместе, чтобы в едином духе любви ко Христу следовать вслед стопам Его, поддерживая друг друга. Помните, как в Евангелии написано:«Когда были они на пути, восходя в Иерусалим, Иисус шел впереди их, на достаточной дистанции,а они(ученики)ужасались и, следуя за Ним, были в страхе»(Мк.10:32)? – Так и мы будем со страхом следовать за Христом весь этот Великий Пост, чтобы потом пение «Христос Воскресе» вырвалось как «избыток жизни» (см.Ин.10:10) в нас. Очень хороший обычай – петь пасхальное славословие в воскресенье вечером в Прощеное Воскресенье.'
      cn: 我再回到同一个主题，为要让那在我看来根本必要之事，更好地铭刻在你们心中：就是要有一个终极目标并为之努力。如此，我们日常生活中琐碎的方面，就不会对我们的身体和我们的精神造成特别的震撼。这不仅是在大斋期，而且在大斋期之后，以及永远，在每一天：我们都需要记住我们在此的宗旨和意义。我们聚集在一起，为要在对基督的同一份爱之精神中，跟随祂的脚踪，彼此扶持。你们还记得福音书上是怎样写的吗？「当他们正在路上，上耶路撒冷去的时候，耶稣走在他们前面，保持着相当的距离，而他们（门徒）感到惊惧，跟着祂的时候，心中充满恐惧」（马可福音 10:32）？——照样，我们也将怀着敬畏，在这整个大斋期跟随基督，为要使「基督复活了！」的歌声，随后能作为「生命的丰盛」（参阅约翰福音 10:10）在我们里面爆发出来。有一个很好的习俗，就是在宽恕主日的周日晚上唱诵复活节颂赞。
  - type: paragraph
    text:
      ru: О Прощеном Воскресенье надо сказать несколько слов. Чрезвычайную важность имеет этот день, когда мы искренно просим друг у друга прощения. Когда это прощение дано с обеих сторон, то душа чувствует себя свободной и полна мира. И это условие свободы и мира страшно облегчает Пост... И к этому дню приготовьте себя, чтобы выбросить из сердца и ума всякую тень раздражения против брата...
      cn: 关于赦罪主日，需说几句话。这一天具有非凡的重要性，当我们彼此恳切地请求宽恕之时。当这宽恕得到双方的施予时，灵魂便感到自由，并充满平安。而这份自由与平安的条件，极大地缓解了大斋期……为这一日预备自己，好将针对弟兄的一切恼怒的阴影从心中和意念中摒弃……
  - type: paragraph
    text:
      ru: В самом начале Поста будут петь об Адаме, изгнанном из Рая, и это имеет значение. В историческом порядке позднее будет воспоминание о грехопадении Адама и решение Христа разорвать проклятие. В этом гениальном строении всего годового круга богослужений – в этой сумме богословия, молитвы и учения, которые представляют из себя книги Великого Поста, – все Предание написано, но всему дана форма молитвы, так что богословие становится содержанием всех молитв наших...
      cn: 在大斋期的最开始，将会歌唱被逐出乐园的亚当，这具有重要意义。在历史的进程中，稍后将会纪念亚当的堕落以及基督斩断诅咒的决断。在这整个礼仪年的卓越结构中——在这以大斋期书卷形式呈现的神学、祷告与教导的集大成中——整个圣传被记载下来，但所有都被赋予了祷告的形式，以至于神学成为我们所有祷告的内容……
  - type: paragraph
    text:
      ru: 'Вы простите меня: я сейчас говорил о деталях нашей жизни. Главную же цель я выразил вам в моем завещании. И умоляю вас забыть о моем ничтожестве и сохранить сие завещание. Я сказал там, что это нелегко. Однако каждый раз в подобные дни, как и в грядущее Прощеное Воскресенье, мы будем совершать этот подвиг и забудем все раны, нанесенные нам в жизни! И когда мы от сердца простим всем братьям нашим все, что накопилось в повседневности, полной труда, недоумений, теснот, лишений, то все это выбрасывается и дух наш освобождается и обретает свободу прощенного человека, избавленного от всех последствий греха и вдохновленного новой надеждой.'
      cn: 请你们宽恕我：我方才谈及我们生活中的细节。而我主要的宗旨已在我的遗训中向你们阐明。我恳求你们忘却我的微不足道，并谨守此遗训。我在其中说过，这并非易事。然而，每逢这般时日，就如将临的宽恕主日，我们将完成这一苦功，并忘却生命中加诸于我们的一切创伤！当我们由衷地宽恕我们所有的弟兄，宽恕一切在日常生活中所积聚的、满载着辛劳、困惑、窘迫和剥夺的一切时，那么这一切便被抛弃，我们的灵便得蒙释放，并获得一个蒙宽恕之人的自由，他已摆脱了罪的一切后果，并被新的希望所激励。
  - type: paragraph
    text:
      ru: Не надо удивляться, что рождаются недоразумения в жизни, особенно Постом. Но надо научиться препобеждать эти трудности, чтобы исполнить закон Христа, Который сказал:«прощайте, если что имеете на кого, дабы и Отец ваш Небесный простил вам согрешения ваши»(Мк.11:25). Тем самым, прощая грехи брату нашему или сестре нашей, мы входим в процесс спасения всего человечества. Каждый раз, когда появляются искушения или трудность какая (ибо невозможно избежать трений вследствие ограничений нашей плоти), надо непременно препобеждать это, и в этом проявится мудрость.
      cn: 不必诧异生活中会出现误解，尤其是在大斋期。但必须学会战胜这些困难，为要成就基督的律法。他说：「你们若有什么得罪人的事，就当饶恕人，好叫你们在天上的父也饶恕你们的罪过。」（马可福音 11:25）如此一来，藉着饶恕我们的弟兄或姊妹的罪过，我们便进入了全人类的救赎过程。每当出现诱惑或任何困难时（因为我们肉体的局限性，摩擦是不可避免的），就必须持续战胜它，如此便显出智慧来。
  - type: paragraph
    text:
      ru: Одна из возможных мыслей:«а от дерева познания добра и зла не ешь»(Быт.2:17) – потому, что это повлечет за собою разделение всех людей. Первое страшное преступление –«Каин убил Авеля»(см.Быт.4:8) – было в самом начале дней человеческой жизни. Силуан, наш блаженный покровитель, говорит, что «так началось». И Адам плакал о том, что все человечество будет жить в раздорах, войнах, взаимных убийствах, взаимных притеснениях и так далее, – что все пойдет против закона любви[77].
      cn: 一个可能的想法是：「不可吃善恶知识树上的果子」（创世记 2:17）——因为这会导致全人类的分裂。最初的可怕罪行——「该隐杀了亚伯」（参阅创世记 4:8）——发生在人类生命最初的那些日子。圣西卢安，我们蒙福的庇护者，说：「就这样开始了。」而亚当为之哭泣，因为全人类将生活在纷争、战争、彼此杀戮、彼此压迫等等之中——这一切都将违背爱之律法[77]。
  - type: paragraph
    text:
      ru: 'Какое приготовление предлагает нам старец Силуан для восприятия Пасхи? – Чем сильнее в нас Дух, тем легче мы забываем всякую рану и прощаем всякое оскорбление, нанесенные нам братом, и тем богаче будет изливаться на нас радость вечной жизни. Убавить себя – есть великий акт духовный перед Богом. Сам Господь умалил Себя (см.Флп.2:8). И мы читаем у нашего отца Силуана слова: «Благодать в меньших живет, а не в больших»[78]. Так дал ему познать Господь: чем больше смирится человек, чем больше он идет на подвиг обнищания – тем выше он становится пред Богом и тем больше его способность воспринять великую благодать (ср.Лк.14:11).'
      cn: 圣西лу按长老为我们提供了什么样的预备，以迎接复活节呢？——我们里面圣灵越是强烈，我们就越容易忘记一切伤痛，并原谅弟兄对我们所造成的一切侮辱，永生的喜乐就越会丰盛地倾泻到我们身上。降卑自己是一种在上帝面前的伟大属灵行动。主亲自虚己（参腓立比书 2:8）。我们在我们的教父西лу按那里读到这些话：「恩典住在卑微者中，而非在伟大者中」[78]。上主如此让他明白：人越是谦卑自己，越是投入到贫乏的属灵操练中，他在上帝面前就越高贵，他就越有能力领受伟大的恩典（参路加福音 14:11）。
  - type: paragraph
    text:
      ru: 'Наивно было бы думать нам, что как собрались мы, – есть человеческое дело: Сам Господь собрал нас. И если Господь собрал нас, будем подражать старцу Силуану. Он по праздничным дням в начале монашеской жизни служил в трапезе отцам и братьям и думал о том, какое блаженство дано ему: «служить тем, которых любит Господь». И однажды, как он пишет, служа братьям в трапезе, он вторично испытал благодать явления Христа[79]. И так как по закону духовному эти высшие состояния человеческое тело не выносит, то они даются один, много два раза в жизни[80], и потом они остаются как память и как знание в форме памяти в нас, но реально сила благодати отступает. Прп.Макарий Великийговорил, что отнятие благодати необходимо, дабы человек продолжал свою земную жизнь и деятельность[81]...'
      cn: 我们若以为我们的聚集是人的作为，那便是天真的想法：是上主亲自聚集了我们。既然上主聚集了我们，我们就当效法司拉温长老。他在修道生活初期，每逢节日便在斋堂服侍教父们和弟兄们，并思忖自己得到了何等的福分：「能服侍那些为上主所爱的人。」 有一次，据他记载，当他在斋堂服侍弟兄们时，他第二次经历了基督显现的恩典[79]。并且，按照属灵的法则，人的身体无法承受这些至高的境况，故而它们一生中仅赐予一次，最多两次[80]，之后，它们便以记忆的形式留存在我们里面，成为记忆和知识，但实际上，恩典的能力却会消退。圣马卡里大帝曾说，恩典的撤回是必要的，旨在使人能继续其属世的生命和活动[81]...
  - type: paragraph
    text:
      ru: 'Вы все с любовью слушали меня и постараетесь исполнить все сие в этом Посту. Почему я говорю: «в этом Посту»? – Потому что странным образом сейчас царит напряженная атмосфера в мире. И у верующих и у неверующих на устах все время есть слово «апокалипсис», «апокалиптические события», «апокалиптические ожидания». В какой форме придет конец, мы еще не знаем, но в нынешнем году это напряжение больше, чем было раньше. Попробуем этот Пост сделать постом борьбы за то, о чем я вас умолял: за единство, которое будет единством по образу Святой Троицы.'
      cn: 你们所有人都怀着爱心聆听了我的话，并会尽力在这个大斋期中实行这一切。我为何说：「在这个大斋期中」呢？——因为奇怪的是，现在世界上弥漫着一种紧张的气氛。无论是信徒还是非信徒，口中都常常有「末日」、「末日事件」、「末日期待」这些词。最终将以何种形式到来，我们尚不得而知，但今年的这种紧张感比以往任何时候都要强烈。让我们尝试将这个大斋期，变成一场为我曾恳求你们的事情而奋斗的大斋期：为合一而奋斗，这合一将是效法圣三一形象的合一。
  - type: paragraph
    text:
      ru: Почему молитва Иисуса Христа к Отцу перед самой смертью голгофской заключала в себе прошение о том, чтобы единство, которое существует в Бытии Самого Бога, было дано нам? – Это высшая форма обожения человека. И думать, что оно может осуществиться без боли, без распятия, – наивно. Большим страданием, терпением всех унижений и всех неправд мы выигрываем дар благодати всеобъемлющей любви. И тогда мы познаем Бога,как Он есть, то есть – как«любовь»(см.1Ин.4:8).
      cn: 为什么耶稣基督在各各他受难，临死之前向上帝之父的祷告，包含着这样一个恳求，即那存在于上帝自身本性中的合一能够被赐予我们？— 这是人的神化的最高形态。而认为它能够在没有痛苦、没有被钉十字架的情况下实现，——是天真的。借由巨大的苦难，忍受一切屈辱和一切不公，我们便赢得普世之爱的恩典的礼物。而那时我们便认识上帝的本相，也就是说——祂就是「爱」（参阅 约翰一书 4:8）。
  - type: paragraph
    text:
      ru: 'Вот это нам надо жить. Я мог бы говорить с вами долго о странном явлении: люди не замечают своих ошибок и судят другого человека. Так разрушается единство. Берегитесь всякой мысли против брата или сестры, потому что каждая мысль вносит трещину в стены крепости. Это совсем не малая вещь! Потому что, когда мы помышляем плохо о ком-нибудь и после выходим из своей комнаты и встречаем этого человека, следы этой дурной мысли действуют. И тогда другой человек отвечает в силу этого явления тем же. И никогда нельзя узнать, кто первый «начал». Потому мы молимся: «даруй мне зрети моя прегрешения». Отсутствие этого видения приводит к тому, что всякий человек думает, что он прав, и не замечает своих ошибок. Это даже иерархи делают и все мы. Так что берегитесь каждой дурной мысли у себя дома, и тогда дом наш устоит и мы спасение получим. А если мы будем прощать себе наши грехи, не понимая брата, тогда все развалится.'
      cn: 这正是我们当如何生活。我本可以和你们长谈这一奇特的现象：人们察觉不到自己的过错，却去论断他人。于是合一便被摧毁。当警惕一切针对弟兄或姊妹的念头，因为每一个念头都会在堡垒的城墙上凿开裂缝。这绝非小事！因为当我们对某人心存恶意，之后走出房间与此人相遇时，那恶念的痕迹便会起作用。彼时，另一个人也会因此现象而以同样的方式回应。于是，便永远无法知晓谁是第一个「开始」的。因此我们祷告说：「求祢赐我得见己之过犯。」缺乏此种洞察，便会导致每个人都自以为是，而察觉不到自身的过错。甚至圣统制下的主教们以及我们所有人亦是如此。所以，当警惕家中每一个恶念，如此我们的家宅方能岿然屹立，我们亦将获得救赎。而如果我们不体谅弟兄，却宽恕自己的罪过，那么一切都将土崩瓦解。
  - type: paragraph
    text:
      ru: 'Недавно был у меня один молодой человек, у которого произошел конфликт с его женой. А у них двое детей. И я говорил ему: «Смирись, и тогда избежим трагического распада семьи. И дети малые будут спасены от трагической формы жизни для детей, у которых разделились родители». Так и в нашей семье: будем бежать как от огня, как от яда змеи всякой тени распада. Будем строить нашу жизнь, чтобы действительно спасаться нам и чтобы усвоить тот дар Бога, который мы имеем в нашей свободе духа, – собраться и жить единой семьею.'
      cn: 最近有位年轻人来找我，他和他的妻子发生了冲突。他们还有两个孩子。我对他说：「降卑自己吧，这样就能避免家庭悲剧性的破裂。那些年幼的孩子们也将免于那种悲剧性的生活方式——对于父母离异的孩子来说。」在我们自己的家庭中也是如此：我们要像逃避烈火、逃避蛇毒一样，逃避任何一丝分裂的阴影。我们要建立我们的生活，这样我们才能真正得救，并能领受上帝的那个恩赐——我们在灵的自由中拥有这恩赐——就是团结起来，活成一个合一的家庭。
  - type: paragraph
    text:
      ru: 'Простите меня. Я говорю от сердца больного, и много говорю нескладно. Однако все-таки вы послушайте мое слово и увидите добрый плод нашей жизни. Прп.Серафим Саровскийговорил: «Стяжи мир, и вокруг тебя спасутся тысячи». Нас двадцать шесть человек. Так, если нам Бог поможет преодолеть наши страсти здесь и так по тысяче каждый спасет, то двадцать шесть тысяч людей пойдут в Рай!'
      cn: 请原谅我。我出于一颗病患的心说话，言语多有不当。尽管如此，你们仍请听我的话，并将看到我们生命中结出的善果。萨罗夫的圣塞拉芬曾说：「获得内心的平安，你的周围便有成千上万的人得救。」我们有二十六人。那么，如果上帝帮助我们在这里战胜我们的情欲，并且每个人就这样拯救一千人，那么两万六千人将进入天堂！
- type: heading1
  text:
    ru: 'Беседа 11: Пост и борьба с искушениями на пути к воскресению[82]'
    cn: 讲论十一：斋戒与搏斗试探以趋向复活[82]
  children:
  - type: paragraph
    text:
      ru: Об искушении Христа в пустыне. Постом может прийти к нам искушение. Враг нас искушает в меньшей мере, чем Христа. Искушения Постом во всех планах нашего бытия. Цель Поста – переживание воскресения через «чаяние», которое есть источник энергии. О двух победах и двух поражениях. Христос – путь для сынов падшего Адама. О физической борьбе со грехом до сердечной боли. О преимуществе умной духовной борьбы со грехом. О плотской брани и смертной памяти.
      cn: 关于基督在旷野受试探。在大斋期，试探可能临到我们。仇敌试探我们，程度不及试探基督。大斋期的试探，波及我们存在的各个层面。大斋期的目标，是通过「期盼」来经历复活，而「期盼」正是能量的源泉。关于两次胜利与两次失败。基督是堕落亚当众子的道路。关于身体上与罪恶争战，直至心痛。关于心智的属灵争战胜过罪恶的优势。关于肉体的争战与死亡的记忆。
  - type: paragraph
    text:
      ru: 'По примеру Христа, Который удалился в пустыню, в нашей традиции установлен Великий Пост – сорок дней:'
      cn: 效法基督——祂曾退隐旷野——在我们的传统中，设立了大斋期，为期四十天：
  - type: paragraph
    text:
      ru: '«Тогда Иисус возведен был Духом в пустыню, для искушения от диавола, и, постившись сорок дней и сорок ночей, напоследок взалкал. И приступил к Нему искуситель и сказал: если Ты Сын Божий, скажи, чтобы камни сии сделались хлебами. Он же сказал ему в ответ: написано – не хлебом одним будет жить человек, но всяким словом, исходящим из уст Божиих. Потом берет Его диавол в святой город и поставляет Его на крыле храма, и говорит Ему: если Ты Сын Божий, бросься вниз, ибо написано: Ангелам Своим заповедает о Тебе, и на руках понесут Тебя, да не преткнешься о камень ногою Твоею. Иисус сказал ему: написано также: не искушай Господа Бога твоего. Опять берет Его диавол на весьма высокую гору и показывает Ему все царства мира и славу их, и говорит Ему: все это дам Тебе, если, пав, поклонишься мне. Тогда Иисус говорит ему: отойди от Меня, сатана, ибо написано: Господу Богу твоему поклоняйся и Ему одному служи. Тогда оставляет Его диавол, и се, Ангелы приступили и служили Ему»(Мф.4:1–11).'
      cn: 「于是耶稣被圣灵引到旷野，受魔鬼的试探。他禁食了四十昼夜，后来就饿了。试探者前来对他说：『祢若是上帝之子，就吩咐这些石头变成面包吧。』耶稣回答他说：『经上记着说：人活着不是单靠面包，乃是靠上帝口中发出的一切言语。』魔鬼又带他进了圣城，叫他站在圣殿的顶上，对他说：『祢若是上帝之子，就跳下去吧；因为经上记着说：『他要为祢吩咐祂的众天使，他们要用手托着祢，免得祢的脚碰在石头上。』』耶稣对他说：『经上又记着说：不可试探你的上主上帝。』魔鬼又带他上了一座极高的山，将世上所有的王国与它们的荣华都指给他看，对他说：『这一切我都要赐给祢，只要祢俯伏敬拜我。』于是耶稣对他说：『撒但，退去吧！因为经上记着说：当敬拜你的上主上帝，单要事奉祂。』于是魔鬼离开了祂，看哪，有众天使前来服事祂。」(马太福音 4:1-11)
  - type: paragraph
    text:
      ru: 'Сегодня я не считаю возможным касаться всего содержания этого искушения, но по всему мы видим, что это было искушение на последнем «этаже». Дьявол еще не знал, с Кем он говорит, но Человек, с Которым он говорил, вызывал эти искушения: «Если Ты Сын Божий, сотвори это чудо...»; «Если Ты Сын Божий, то бросься, и Ангелы Тебя сохранят...»; возведя на высокую гору и показав все богатство этого мира, сказал: «Власть над всем этим миром дана мне – поклонись, и я дам Тебе ее...». И Господь победил все три искушения и сказал: «Иди за мною, сатано!» Так«Человек-Христос»(см.1Тим.2:5) победил мир. И потом, в конце Своего земного пути, Он сказал ученикам:"дерзайте,Я победил мир»(Ин.16:33).'
      cn: 今天我无法触及这试探的全部内容，但我们从一切迹象看，这是在最后「一层」的试探。邪魔尚不知他是在与谁说话，但他所对话之人，却引出了这些试探：「祢若是上帝之子，就变出这神迹吧……」；「祢若是上帝之子，就跳下去吧，天使会保守祢的……」；又将祂带到极高的山上，将世上一切的财富指示祂看，说：「这世上的一切权柄都已赐予我了——祢若俯伏敬拜我，我就把这一切都给祢……」于是，上主战胜了所有这三个试探，并说：「撒旦，退到我后面去吧！」如此，「神人基督」(参见提摩太前书 2:5)战胜了世界。之后，在祂尘世道路的尽头，祂对门徒说：「你们要刚强壮胆，我已经战胜了世界」(约翰福音 16:33)。
  - type: paragraph
    text:
      ru: Что характерно для этого искушения? – Сорок дней Господь постился, пребывая в постоянном напряжении духа. Когда же Он изнемог и силы Его тела естественным путем ослабели, тогда и приступил дьявол. И это значит, что, когда мы постимся и изнемогаем от поста, мы становимся легко подверженными искушениям врага.
      cn: 这个诱惑有何特点？——主禁食了四十日，持续处于精神的紧张之中。当祂筋疲力尽，身体的力量自然地衰弱之时，魔鬼便前来接近祂。这意味着，当我们禁食并因禁食而筋疲力尽时，我们便容易受到仇敌的诱惑。
  - type: paragraph
    text:
      ru: 'Мы не можем себя сравнивать со Христом. Его познание мира было абсолютным, божественным. Но и по человечеству, в Своем воплощении, Он оставался не простым человеком, как видно из беседы дьявола с Ним: «Если Ты Сын Божий – сотвори чудеса... бросься... поклонись: дам Тебе власть». Нас же враг искушает меньшими вещами, но которые потрясают нас, даже если мы и испытываем несомненно меньшую брань, чем Господь. Космические законы и энергии повсюду одни и те же: они проходят через нас. Когда Господь сказал:«Я победил мир», то, значит, эти испытания «прикасались» и к Нему, и Он их отвергал и побеждал. Но тот же космический дух приходит и к нам и потрясает нас. Так что борьба эта – космическая и даже сверхкосмическая. Поскольку Господь говорит:«Я победил мир», значит, Он стал сверхкосмическим.'
      cn: 我们不能将自己与基督相比。祂对世界的认知是绝对的，神圣的。然而，即使就祂的人性而言，在祂的道成肉身中，祂也并非一个普通人，从魔鬼与祂的对话中可见一斑：「如果祢是上帝之子——行神迹吧……跳下去吧……敬拜我吧：我就把权柄赐给祢。」然而，仇敌以较小的事物引诱我们，但这些事物却使我们感到震撼，即使我们所经历的争战无疑远小于上主所受的争战。宇宙法则与能量处处皆然：它们也穿透我们。当上主说：「我已胜过世界」时，那就意味着，这些考验也曾「触及」祂，而祂拒绝并战胜了它们。但同样的宇宙之灵也来到我们这里，并使我们感到震撼。因此这场争战是宇宙性的，甚至是超宇宙性的。既然上主说：「我已胜过世界」，那么，祂就成了超宇宙性的。
  - type: paragraph
    text:
      ru: Сейчас я хотел бы говорить с вами по этому поводу, потому что можно прожить этот Пост, не дав себе отчета ни в чем. И тогда в умном познании этот Пост пройдет без пользы. Я говорю «в умном познании», потому что самый Пост есть борьба со страстями, и борьба небесполезная и небезрезультатная...
      cn: 我现在想和大家谈谈这个话题，因为我们可以度过这个大斋期，却不对自己有任何反省。那么在理智的认知中，这个大斋期将毫无益处地过去。我说『在理智的认知中』，因为大斋期本身就是一场与情欲的搏斗，而且这场搏斗并非无益，也并非没有结果……
  - type: paragraph
    text:
      ru: 'Насколько я знаю (а я знаю очень мало из того, что вы переживали), скажу вам: у меня в сознании остались два случая страданий из ваших всех подвигов в течение этого Поста. Я почувствовал через молитву о вас, что было два случая потери терпения. И надо быть очень осторожными, потому что это сражение весьма опасно... Терпение касается всех форм нашей жизни: и телесные болезни, и мысленные наши брани, и духовное наше состояние – задеты все три плана, потому что Пост в воспоминание поста Христа и есть это испытание на всех уровнях. Например, мы не понимаем, почему плотские услаждения отнимают у нас дерзновение в молитве и даже энергию молитвы. Но пост есть одна из форм борьбы против страстей. Когда мы постимся, начинается тяжелый период ощущения всего нашего состава. Слабее всего у нас тело: оно очень скоро сдается и не может больше терпеть. Господь определил меру человека – сорок дней. И это есть совершенная мера. В других аскетических культурах существуют способы прожить и больше, чем сорок дней. Но там вся борьба идет по иным законам и на другом уровне. Есть и другие способы.'
      cn: 据我所知（而对于您所经历的，我知之甚少），我要告诉您：在您这个大斋期的所有属灵努力中，两次受苦的情形留存在我的意念里。我通过为您祷告而感觉到，有两次失去忍耐的情形。并且需要非常警惕，因为这场争战极其危险。忍耐关乎我们生命的一切形式：包括身体的疾病，以及我们思想的争战，和我们的属灵状态——这三个层面都受到触及，因为大斋期是为了纪念基督的禁食，并且这正是在所有层面的考验。例如，我们不明白为何肉体的逸乐会夺去我们在祷告中的坦然无惧，甚至祷告的活力。然而，禁食是抵御情欲的一种方式。当我们禁食时，一个艰难的时期便开始了，就是我们开始感受到我们自身的全部构成。我们最脆弱的是身体：它很快就会屈服，并且无法再忍受。上主为人设定了限度——四十天。而这是一个完美的限度。在其他苦修文化中，存在着能坚持超过四十天的方法。但在那样的情形下，所有的争战都遵循着不同的法则，并且是在另一个层面进行。还有其他的方法。
  - type: paragraph
    text:
      ru: 'Мы никогда не освобождаемся от борьбы со страстями. От плотской брани мы должны все время пребывать в большом напряжении внимания, чтобы тело наше не потребовало от нас того, что мешает духу нашему восходить к Богу. Итак, возможно приближение к нам мыслей на уровне, почти таком, какой показал Христос в Евангелии, но у нас такие испытания – крайне редкое явление. И другая задача наша прихода в мир: Господь«пришел... спасти мир»(Ин.12:47), победив все космические энергии, возведя нас в план Божественной жизни, уже запредельными, трансцендентными для сил Космоса. Мы живем на низшем плане, но все-таки постепенно воспитываемся для этой жизни. И когда (если Бог продлит жизнь всех нас) приступит снова Пост, будьте внимательны к этому. Вопрос идет не только о теле, но, прежде всего, о нашем вечном духе. И тогда посты ваши будут проходить с плодом на всех уровнях борьбы: и с плотскими страстями, и за психическую силу терпения, и за высшее познание ума о бытии. Итак, об этом я хотел говорить сегодня с вами, чтобы Пост этот не прошел бесследно для познания нашего.'
      cn: 我们从不会从与情欲的争战中解脱。为了我们的身体不向我们索求那阻碍我们灵性升向上帝之物，我们必须时刻在肉体的争战中保持高度警醒。那么，思想临近我们，其层面几乎可达基督在福音书中所显示的层面，但对我们而言，这样的试炼是极其罕见的现象。而我们来到世上的另一个任务是：主「来……为要拯救世界」（约翰福音 12:47），祂战胜了所有宇宙的能量，将我们提升至神圣生命的层面，这层面已超越并凌驾于宇宙诸力之上。我们生活在较低的层面，但仍在为此生命而逐渐受造就。并且，当（若上帝延长我们众人的寿命）斋期再次开始时，请对此多加留意。问题不仅在于身体，更在于我们永恒的灵魂。届时，你们的斋期将在所有争战的层面上结出果实：无论是在与肉体情欲的争战中，为着忍耐的精神力量，还是为着心智对存有的更高认识。那么，我今天想和你们谈论的就是这些，愿这斋期不致于对我们的认识毫无助益。
  - type: paragraph
    text:
      ru: 'Как результат, постом и молитвой мы приготовляемся к тому, что обетованно нам, то есть к воскресению. Мы встречаем Пасху: «Христос Воскресе!» – и празднуем наше общее воскресение, а не только Воскресение Христа. Как говорит свт.Иоанн Златоуств «Слове на Пасху»: «Воскрес Христос и мертвый ни един во гробе»[83].'
      cn: 因此，藉着禁食和祷告，我们预备自己，为了那应许给我们的，也就是为了复活。我们迎接复活节：「基督复活了！」——并庆祝我们共同的复活，而不单单是基督的复活。正如圣约翰·金口在《逾越节讲道》中所说：「基督复活了，墓中无一死者」[83]。
  - type: paragraph
    text:
      ru: 'Простите меня, что я позволяю себе говорить об этом: мне дана была смертная память, при которой все космическое бытие подвергалось смерти и подлежало своему концу. Но когда снизошла на меня милость Бога и я почувствовал в себе возможность вечной жизни, тогда для меня воскрес весь Космос. И отрицательный опыт смертной памяти вдруг превратился в познание, что смерти нет для нас.'
      cn: 请宽恕我竟敢谈论此事：我曾被赋予死亡的记忆，在此记忆中，一切宇宙万有都遭受死亡，并注定归于其终结。但是，当上帝的恩典降临于我身，我便感知到内在永生的可能，那时，整个宇宙万有便为我复活了。而那死亡记忆的负面经验忽然间转化成了这种认知：死亡于我们而言已不复存在。
  - type: paragraph
    text:
      ru: 'Мы созданы«по образу и по подобию»Безначального и Бессмертного Бога (см.Быт.1:26). Когда мы говорили о воскресении, то обращали внимание на последние словаСимвола веры: «Чаю воскресения мертвых...» Это чаяние-ожидание в нас есть та энергия, которая нас воскресит неизвестным образом. Те, которые«отошли отХриста» (Ин.6:66) и которые всецело во власти смерти, не могут этого делать: они не верят в воскресение.'
      cn: 我们被造「按照祂的形象，肖乎祂的样式」，是无始无终、不死不灭的上帝所造（参看创世记 1:26）。当我们谈论复活时，我们曾留意到信经的最后几句：「我期盼死者的复活...」。在我们之中的这种期盼——这种等候，乃是那股能量，将以我们所不知晓的方式使我们复活。那些「离弃了基督」（约翰福音 6:66）并且完全被死亡辖制着的人，无法做到这一点：他们不相信复活。
  - type: paragraph
    text:
      ru: 'Я хотел вам сказать эти немногие слова, чтобы у вас прошел Великий Пост с плодом и в сфере познания, и в сфере сознания, будучи сознательным подвигом во всех планах: в борьбе со страстями плотскими, в плане психического опыта терпения, в плане испытания нашей веры. И искушения могут быть разного напряжения: они могут поставить нас действительно на край гибели. Но когда мы выходим из этого состояния и живем Воскресение, тогда мы ощущаем эту победу: Христос«победил мир»(Ин.16:33) и«воскрес из мертвых»(Мф.28:7).'
      cn: 我想对你们说这几句话，为了让你们的大斋期过得富有成效，无论是在认知层面，还是在意识层面，并且在各个方面都是一场自觉的功修：在与肉体情欲的斗争中，在忍耐的心灵体验方面，以及在我们信仰的考验方面。而诱惑的程度可以各不相同：它们确实能将我们置于毁灭的边缘。但当我们走出这种状态，并活出复活时，那时我们才能感受到这胜利：基督「已经胜了世界」（约翰福音 16:33）并「从死里复活」（马太福音 28:7）。
  - type: paragraph
    text:
      ru: Есть люди, которые борются со страстями один или два раза за время вражеского нападения. Скажем, сто раз страсть приближалась к человеку и в двух случаях он противился. И ему кажется, что он подвижник. И таковой решается говорить другим о добродетелях, а сам девяносто восемь раз отступает. Потому что когда мы говорим о «мраке, в котором живет мир», то имеем в виду, что мир живет страстями и нашу жизнь мир не понимает. Люди уходят от Христа и от настоящего откровения о том, что такое человек.
      cn: 有些人，在仇敌攻击期间，只与情欲搏斗一两次。比如说，情欲一百次临近一个人，而他只在两次情况下抵制了。而他以为自己是苦行者。这样的人就敢于对他人谈论美德，而他自己却有九十八次退却。因为当我们谈论「世界所活在的黑暗」时，我们指的是世界活在情欲中，而且世界不理解我们的生命。人们背离基督，以及背离关于何为人之道的真正启示。
  - type: paragraph
    text:
      ru: Из этого евангельского случая, когда дьявол приступил ко Христу и сказал:«если Ты Сын Божий...», видно, что все мы чада Бога, Который сказал:«cотворим человека по образу Нашему [и] по подобию»(Быт. 1:26). И враг говорил со Христом сразу о последнем!
      cn: 从这个福音事例中，当魔鬼就近基督并说：「如果祢是上帝之子……」时，可见我们都是上帝的儿女，祂曾说：「我们要照着我们的形像，按着我们的样式造人」（创世记 1:26）。而仇敌立即就这最后一点与基督交谈！
  - type: paragraph
    text:
      ru: Есть люди, которые подвизаются, выдерживают подвиг, и из ста раз прикосновения страстного услаждения они девяносто восемь раз отвергают его с успехом, но один или два раза из ста вдруг как-то отступают. И для подвижника этот один или два раза переживаются, как кошмар. Он не думает учить других, потому что он сам себя не чувствует победителем страсти.
      cn: 有些人，他们践行灵修苦功，持守灵修功课，在一百次触碰情欲的欢愉中，有九十八次成功地拒绝了它，但一百次中，有一两次却突然有所退让。而对于这位修行者而言，这一两次的经历，如同噩梦一般。他不会想到去教导别人，因为他自己并不觉得自己是情欲的胜利者。
  - type: paragraph
    text:
      ru: 'Но опять-таки вынуждаюсь напомнить вам – пожалуйста, говорите каждый раз, если возможно, с сознанием: «Сподоби, Господи, в день сей, в вечер сей, в ночь сию без греха сохранитися нам»! Чем наша жизнь отличается от прочего мира? – Тем, что мы отвергаем услаждения страстями, чтобы пребыть в союзе с Богом.'
      cn: 然而，我再次不得不提醒你们 – 请你们若可能，每一次都带着心意说：「上主啊，求祢使我们配得，在这日间，在这晚间，在这夜间保守我们免于罪过！」我们的生命与世俗有何不同呢？—— 乃在于我们弃绝情欲的享乐，为要与上帝联合。
  - type: paragraph
    text:
      ru: Господь пришел и сказал:«Аз есмь путь»(Ин.14:6). Какой путь? – После падения Адама, когда все было потеряно, Господь восстановил в нас образ Божий, омраченный падением. Теперь, когда мы знаем Христа, мы стараемся жить, как Он. Однако бывают прикосновения испытаний, способных исказить нашу волю. Это вначале требует большого и болезненного напряжения.
      cn: 主来到并说：「我就是道路」(约翰福音 14:6)。是什么道路呢？——在亚当堕落之后，当一切都已失落之时，主在我们里面恢复了那被堕落所蒙蔽的上帝的形象。如今，当我们认识基督时，我们努力效法祂而生活。然而，会有试炼的临到，它们能够扭曲我们的意志。这在起初需要巨大的、痛苦的努力。
  - type: paragraph
    text:
      ru: Многие подвижники любили болезни, потому что болезнь облегчает борьбу со страстями плотскими. И так как мы еще не победили страсти, то мы не можем жить в полноте радость воскресения. Тем не менее частично все-таки мы ее живем.
      cn: 许多苦修者喜爱病痛，因为病痛减轻了与肉体情欲的争战。并且，既然我们尚未战胜情欲，所以我们不能活出完满的复活喜乐。尽管如此，我们仍旧部分地活出它来。
  - type: paragraph
    text:
      ru: 'И много раз мне приходилось встречаться с такими явлениями, что Пасха была для некоторых временем испытания и ощущалась как некий провал в бытии. «Христос воскрес, мертвый ни един во гробе», а я чувствую себя вдруг во власти смерти! Не только когда вы будете чувствовать фактическое преобладание над собою страстей, но и в самой борьбе помните, что ничего конечного нет, кроме Христа, и опирайтесь на Него. Может возникнуть ощущение: «Вот, пришла Пасха, а я все равно пребываю в смерти страстей». Но не надо поддаваться этому искушению, а надо верить в то, что мы действительно воскреснем; и не просто верить, но и чаять, как замечательно говорят святые отцы вСимволе веры. Я не только верю, что воскреснут мертвые, нет! – а жду этого воскресения.'
      cn: 我曾多次遇到这样的情况：复活节对于一些人而言是试炼的时刻，并被感受为存在中的某种塌陷。「基督复活了，墓中无一死者」，我却突然感觉自己被死亡所辖制！不仅当你们实际感受到诸情在你们身上占据上风时，即使在与它们搏斗时，也要记住：除基督之外，没有任何事物是终极的，要仰赖祂。可能会产生一种感觉：「看哪，复活节已经来了，我却仍然停留在诸情的死寂之中。」但不要屈服于这种诱惑，而要相信我们确实会复活；并且不仅仅是相信，更要切望，正如圣教父们在《信经》中所精妙言说的。我不仅仅相信死者会复活，不！——我是在等候这个复活。
  - type: paragraph
    text:
      ru: 'Говорите эти слова с большим чувством, проверяйте себя и познавайте характер этих явлений! Если говорим вСимволе веры«я ЖДУ воскресения мертвых» и в молитвах за умерших: «в НАДЕЖДЕ живота вечного усопшего раба Твоего упокой», – то подчеркиваем, что, умирая, мы будем ждать нашего воскресения, а пока:«в руце Твои предаю дух мой»(Лк.23:46). Всем вам желаю действительно жить Пасху с этим ожиданием нашего общего воскресения...'
      cn: 说出这些话时要充满感情，反省自己，并理解这些现象的本质！如果我们在《信经》中说：「我期盼死者复活」，并在为亡者祷告时说：「带着永生的希望，求祢使祢已故的仆人安息」，那么我们强调的是，逝去之时，我们将等待我们的复活，而在此之前则是：「我将我的灵魂交托在祢手中」（路加福音 23:46）。我祝愿你们所有人，都真正地活出逾越节，带着我们共同复活的这份期盼……
  - type: paragraph
    text:
      ru: Бывают периоды, когда действительно мы распяты в борьбе за то, чтобы провести день без греха, то есть чтобы грех не обладал нами...
      cn: 有些时候，我们确实在与罪的搏斗中被钉在十字架上，为了度过没有罪孽的一天，也就是说，为了罪不辖制我们……
  - type: paragraph
    text:
      ru: 'Сия борьба может достигать чрезвычайно глубоких напряжений, о чем я не говорил ни в книгах, ни с вами. Ибо не у всех есть достаточный разум понять это как следует. Но многие из подвижников боролись с плотскими страстями, причиняя себе боль. Читая жития святых, вы увидите, что, когда у некоторых были такого рода искушения, они жгли себя, дабы болью убить в себе это ощущение плотское. (Один святой жег свои пальцы, чтобы преодолеть это услаждение.) Когда эта страсть действовала в них, то они кусали себе пальцы, причиняли себе боль, по-настоящему достигая ее ударами по своему телу (больше всего по ногам, где нет органов). Этот способ очень опасен для некоторых: бить себя до тех пор, покамест боль не дойдет до сердца. Позывы к плотским услаждениям имеют странную силу: когда сильно действует в нас страсть, тогда не чувствуется боли от ударов. Только когда боль дойдет до сердца, тогда страсть прекращается.'
      cn: 这场斗争能够达到极其深刻的紧张状态，这一点我无论是在书中，还是对你们，都未曾提及。因为并非所有人都有足够的悟性恰当地理解这一点。但许多苦修者借着伤害自己，与肉体的情欲争战。阅读圣徒传记时，你们会看到，当一些人面临这类诱惑时，他们焚烧自己，为要借着痛苦扼杀自身这种肉体的感受。(有一位圣徒烧灼自己的手指，为要克服这种肉体的快感。)当这种情欲在他们里面作祟时，他们就咬自己的手指，伤害自己，甚至真正地通过打击自己的身体来达到目的（多半是打击腿部，因为腿部没有重要器官）。这种方法对某些人来说非常危险：捶打自己，直到痛苦达到内心。肉体快感的冲动拥有一种奇特的力量：当情欲在我们里面强烈作祟时，那时并不会感到捶打的痛苦。只有当痛苦达到内心时，那时情欲才会停止。
  - type: paragraph
    text:
      ru: Зачем это нужно? – Потому что каждый раз, когда мы сдаемся, страсть одерживает победу над нашей волей. И каждый раз, когда мы побеждаем услаждение плотское побоями, меняется вся структура наша, и тело начинает подчиняться настроению духа. То есть каждый раз, когда нам удается победить страсть такой болью, тело наше «приспосабливается» к тому, чтобы следовать за требованиями духа.
      cn: 为何这事是必需的呢？——因为每当我们屈服时，情欲便胜过我们的意志。并且每当我们以苦行击败肉体之乐时，我们的整个结构便会改变，身体便开始顺从灵的心境。也就是说，每当我们成功地以如此痛苦击败情欲时，我们的身体便会「适应」过来，以跟随灵的要求。
  - type: paragraph
    text:
      ru: 'Однако, по-настоящему, борьба наиболее эффективная – это борьба в духе. А побои – это одна из форм аскетической борьбы за то, чтобы приостановить в себе действие страсти, то есть не дать страсти овладеть тобою, не приять ее. Мне тоже пришлось причинять боль сердцу моему, чтобы остановить похотение страсти, но сам я предпочитаю другой способ борьбы: мне помогала смертная память. Поражающее действие ее в том, что человек воспринимает другое тело как труп, и искушение прекращается на этом без побоев. Святые Отцы очень ценили смертную память, потому что она убивает в нас страсть плотскую.'
      cn: 然而，真正最有效的争战，是在灵里的争战。而鞭打，则是苦修争战的一种形式，为的是制止自身情欲的运行，也就是说，不让情欲辖制你，不接纳它。我也曾不得不伤我心，为要止息情欲的贪恋，但我自己偏爱另一种争战方式：念死对我大有助益。它令人震撼的作用在于，人把另一个身体看作尸体，这样一来，诱惑便会止息，无须鞭打。圣教父们非常珍视念死，因为它能扼杀我们里面的肉体情欲。
  - type: paragraph
    text:
      ru: 'Бывают моменты смертельной схватки со страстью: «Или ты, или я, кто-то будет из нас живой!» И каждый раз победа в таких острых моментах перерождает тело и ум наши. Потом ум легко отталкивается от всякого образа страсти. Мы получаем «власть» уже не в силу поста, а в силу воспитания ума.'
      cn: 会有与情欲殊死搏斗的时刻：「不是你活，就是我活！」而每一次在这样严峻时刻的胜利，都使我们的身体和心智脱胎换骨。之后，心智便能轻易地抵制任何情欲的形相。我们获得「权柄」，不再是借由禁食的力量，而是借由心智的陶冶。
  - type: paragraph
    text:
      ru: Культура ума – вот что остается как наиболее эффективный способ борьбы со страстями. Я пишу об этом в книге о старце Силуане[84]– как бороться со страстью, «не отдать ума» и приучить наш ум отталкивать всякий образ страсти. И когда человек культивирует свой ум в этом плане, так что он более не слагается с позывом страсти, тогда страсть умирает. Сие относится не только к плотским искушениям, но и ко всякой иной страсти...
      cn: 心的修养——这才是抵制情欲最有效的方法。我在关于圣西卢安长老的著作中[84]写道：如何与情欲争战，如何「不将心神交托」，并训练我们的心智排斥一切情欲的意象。当人在此方面培养他的心智，以至于他不再与情欲的冲动相合时，情欲便消亡了。这不仅适用于肉体的诱惑，而且也适用于一切其他的情欲……
  - type: paragraph
    text:
      ru: Из моей практики на Афоне и на самом себе я заметил, что, когда меня оскорбляют, когда меня лишают чего-нибудь и грубо обращаются, тогда у меня уменьшается брань с плотью. Но были случаи, когда молодые монахи (их было очень мало) от скорби, наоборот, искали утешения в этом нервно-приятном плотском ощущении. Вот почему нужно быть очень осторожным во всем этом.
      cn: 我从我在阿索斯山的实践和亲身经历中注意到，当我受辱，被剥夺任何事物，并被粗暴对待时，我与肉体的争战便会减弱。但也有一些情况，当年轻修士们（他们人数极少）因忧苦，反而在这神经性的愉悦的肉体感受中寻求安慰。这就是为什么在所有这些事上都需要非常谨慎。
  - type: paragraph
    text:
      ru: Я очень боюсь, что плохо говорю, и все-таки, несмотря на всю мою нескладную речь, надеюсь, что-то останется в вашем сознании. Все вы – мне дорогие братья и сестры, о всех вас я молюсь. И будьте терпеливы. Бог каждого из нас испытывает на чем-нибудь...
      cn: 我非常害怕自己言语拙劣，然而，尽管我的言语笨拙不畅，我仍希望有些什么能留在你们的意识中。你们所有的人，都是我亲爱的兄弟姐妹，我为你们所有人祷告。并且请保持耐心。上帝在某件事上考验我们每一个人……
  - type: paragraph
    text:
      ru: И простите меня.
      cn: 并请宽恕我。
- type: heading1
  text:
    ru: 'Беседа 12: Богопознание через подвиг истощания и плача[85]'
    cn: 第12讲：通过虚己与哀哭的苦修功行认识上帝[85]
  children:
  - type: paragraph
    text:
      ru: 'О спасении и о тщетности богословской науки: через нее нельзя жить Бога. О бытийной связи с Богом через воздержание от греха. Об ипостаси в учении и примере прп. Силуана. Через брань с грехом приходит богопознание. Слезы – путь святых; порабощение – путь мира. Спасение – следовать за Христом в Его истощании: принять смерть от брата. Мы спасаемся в эпоху богопокинутости. Богословие как молитва и как состояние. О падении Адама, откровении «Аз есмь» и проповеди «Покайтесь!». Где нет любви – нет плача.'
      cn: '论救赎及神学研究的无益：无法通过它活出上帝。


        论通过戒绝罪恶与上帝的本体性联结。


        论在圣西卢安长老的教导与榜样中的位格。


        通过与罪的争战，获得神性认知。


        泪水是圣者的道路；奴役是世界的道路。


        救赎，是跟随基督在祂的虚己中：接受来自弟兄的死亡。


        我们得救是在上帝遭弃的时代。


        神学，作为祷告和一种状态。


        论亚当的堕落，论「我是自有永有者」的启示，以及「悔改！」的布道。


        哪里没有爱，哪里就没有悲泣。'
  - type: paragraph
    text:
      ru: 'Великий отец Церкви свт.Афанасий Александрийскийговорит, что нам необходимо повторять все имеющее тесное отношение к нашему спасению[86]. Утеря самых существенных моментов может стать препятствием к нашему спасению. Спасение – совсем не малая вещь. Спасение означает: из временного явления, «феномена», превратиться в существо богоподобное и вечное. И если так, то какая задача стоит перед нами в повседневной жизни?'
      cn: 伟大的教会教父亚历山大圣亚他那修主教说，我们需要反复思考所有与我们救恩密切相关的事物[86]。失去最主要的要点可能会成为我们救恩的障碍。救恩绝非一件小事。救恩意味着：从一个短暂的现象，一个「现象」中，转化成为一个与上帝相似并永恒的存有。既然如此，我们在日常生活中面临着怎样的任务呢？
  - type: paragraph
    text:
      ru: 'Есть фактически один путь воспитания в Церкви: через школы и богословскую науку. Но да будет позволено мне сказать, что этот путь все же не более чем паллиатив. Наше время особенно показывает «бестолковость» богословских наук. Через науку нельзя понять Бога экзистенциально и жить Им. А спасение как перерождение из временного «феномена» – значит стать подобным Богу, во исполнение молитвы Иисуса Христа к Отцу:«хочу, чтобы там, где Я, и они были со Мною»(Ин.17:24)... и«где Я, там и слуга Мой будет»(Ин.12:26).«Там»– это вовсе не географическое понятие, а чисто духовное.«Там»– в божественной вечности, «быть с Ним и видеть Славу Его» (см.Ин.17:24), значит, и самим быть в этой Славе. Живя в этом мире, где упущен путь молитвы и жизни по заповедям, где хотят заменить служение Богу и жизнь в Нем разговорами о Нем, мы все время подвергаемся влиянию этих расположений человека и рискуем потерять истинный путь к богопознанию и ко спасению, что является единственной целью монастырской жизни. Спасается человек не множеством научных сведений. Через эти сведения никак не дается нам состояние «видеть Бога,как Он есть»(см.1Ин.3:2). Поэтому большинству ученых нестерпимо это слово. Однако иное мы видим в Евангелии. Господь говорит:«Блаженны чистые сердцем,яко тииБога узрят» (Мф.5:8). Совершенно правильно для нас задуматься о словах Христа: «Как узрят чистые сердцем Бога? Как Он есть или как Он не есть?» Ученый ум склонится, конечно, к мысли: «как Он не есть». Но Христос думает иначе, и мы постараемся следовать за Христом.'
      cn: '实际上，教会中的培育只有一条道路：通过学校和神学科学。但请允许我指出，这条道路充其量不过是一种权宜之计。我们的时代尤其显明神学科学的「无益」。通过科学，无法从存在层面理解上帝并活在祂里面。而救恩，作为从暂时性的「现象」中获得重生，意味着变得与上帝相似，以成就耶稣基督向上帝之父的祷告：「我愿他们也在我所在之处，与我同在」（约翰福音 17:24）……以及「我在哪里，我的仆人也要在那里」（约翰福音 12:26）。「那里」绝非一个地理概念，而是一个纯粹的属灵概念。「那里」——是在神圣的永恒之中，「与祂同在并看见祂的荣耀」（参阅约翰福音 17:24），意味着我们自身也将置身于这荣耀之中。


        生活在这个世界上，祷告和遵守诫命的生活之路已被忽视，人们试图用谈论上帝来取代侍奉上帝和活在祂里面，我们不断地受到这些人类倾向的影响，并面临着失去通往认识上帝和救恩的真正道路的风险，而这正是修道生活的唯一目的。人的得救并非依靠众多的科学知识。通过这些知识，我们绝无法获得那种「得见上帝，正如祂所是」（参阅约翰一书 3:2）的状态。因此，对大多数学者而言，这个词是难以忍受的。


        然而，我们在福音书中看到的是另一番景象。上主说：「福哉！清心的人，因为他们必得见上帝」（马太福音 5:8）。我们完全有理由深思基督的话语：「清心的人将如何得见上帝？是见祂的本相，还是见非祂的本相？」学究之心，自然会倾向于这样的想法：「非祂的本相」。但基督的意念与此不同，我们将努力追随基督。'
  - type: paragraph
    text:
      ru: В чем смысл моего слова? – Мы должны сосредоточить все наше внимание только на том, чтобы НЕ СОГРЕШИТЬ ни пред Богом, ни пред человеком, ни пред вещами. И из этой жизни – простой, но сосредоточенной на этой заповеди – рождается состояние человека, когда он уже бытийно «связывается» с Богом.
      cn: 我所言的意义何在？——我们应当将我们所有的注意力都集中在一点上，那就是不得罪上帝，不得罪人，也不得罪事物。而从这种生活——这种简朴却专注于这条诫命的生活中——便诞生出一种人的状态，此时他已在本体上与上帝『关联』起来。
  - type: paragraph
    text:
      ru: Что значит прожить без греха? – Это значит жить по заповедям Христа. И кто до конца старается, тот через это старание удостаивается божественной помощи – благодати и живет так, как хочет Бог. Наше благословение в том, что мы дети великого Силуана. Он шел этим путем. И он явил нам образ Бога, осуществленный в жизни.
      cn: 无罪地度日意味着什么？——这意味着按照基督的诫命生活。而那坚持到底努力的人，便通过这努力蒙受神圣的帮助——恩典，并按照上帝的旨意生活。我们的福分在于，我们是伟大的西鲁安的孩子。他行走了这条道路。他向我们显明了在生活中得以实现的上帝的形象。
  - type: paragraph
    text:
      ru: 'В современном православном богословии, как и в современной науке, в психологии, в философии, люди заняты вопросом персоны. Я всегда предпочитаю другой термин: ипостась. По-гречески это выражается еще как πρόσωπον («лицо»). Но все-таки лучше использовать термин «ипостась» как богословское понятие, означающее осуществление подобия Богу. Тогда как слово «лицо» (πρόσωπον) останавливает нас психологически, поскольку мы ежедневно его употребляем. И вот, в этом человеке, прп. Силуане, мы видим актуализацию того, что дается Богом как потенция. Священное Писание выражает это такими словами:«сотворим человека по образу Нашему», и затем добавляет:«[и] по подобию Нашему»(Быт.1:26). Для того чтобы создалось подобие, чтобы мы стали по духу и по содержанию жизни своей подобными Богу, совершенно необходимо, чтобы чистой потенцией было заложено«по образу». Из этой потенции через подвиг жизни по заповедям Христа созидается и«по подобию». Для нашего спасения необходимо достигнуть хотя бы тень подобия, хотя бы создать в нас самих влечение к Богу при всем нашем ограничении. Я написал в моей книге, руководясь тем, что мне Бог показал через Силуана, что значит стать ипостасью по образу ипостаси воплощенного Логоса; как реагирует персона-ипостась на всякое явление жизни в мире.'
      cn: 在现代东正教神学中，犹如在现代科学、心理学、哲学中，人们关注「位格」（人格，person）的问题。我总是偏爱另一个术语：圣位（ипостась）。在希腊语中，它也表达为 πρόσωπον（「面容」）。但无论如何，最好还是使用「圣位」（ипостась）这个术语，作为一个神学概念，意指对上帝的肖似之实现。然而，「面容」（πρόσωπον）这个词在心理上阻碍了我们，因为我们日常生活中都使用它。在这位圣人圣西卢安身上，我们看到了由上帝所赐予的潜能之实现。圣经以这些话语表达了这一点：「我们要照着我们的形象造人」，然后又加上一句：「[也]照着我们的样式造人」（创世记 1:26）。为了创造出肖似，为了使我们在灵性上和生命的内容上肖似上帝，绝对有必要，使「按着形象」纯粹作为一种潜能被奠定。从这潜能中，通过按照基督的诫命而生活的苦修，「按着样式」也被建立起来。为了我们的救赎，即使只是达到肖似之影，即使只是在我们自身内产生对上帝的渴慕，也是必要的，尽管我们有种种限制。我在我的书中写道，借着上帝通过圣西卢安向我所启示的而得到引导，成为一个圣位，是依照道成肉身之圣言的圣位形象，这究竟意味着什么；以及「人格-圣位」如何回应世间生命的每一种现象。
  - type: paragraph
    text:
      ru: 'Как духовник, раньше я весьма часто встречался именно с такими вопросами: как можно не согрешить, как бороться со страстями, какой путь лежит к Богу, чтобы познать Его именно как Он есть, а не так, как древние эллины, поставившие алтарь в Афинах«неведомому Богу»(см.Деян.17:23). В Троице-Сергиевой Лавре я видел храм и надпись на нем: «Ведомому Богу». Эта претензия совершенно законная для человека. Но после нашего разложения морального рождаемся мы во грехах (ср.Пс.50:7) и живем в мире, который не молится, который боится Христа хуже всего. Посему Христос и говорит: «Если вы последуете Мне, товы будете ненавидимы всеми народами за имя Мое»(Мф.24:9). Мы все время должны поставлять себя в эту перспективу: как избежать греха. В основе своей весь трагизм истории есть следствие гордости. Тварь, которая возомнит себя Богом, становится дьяволом вследствие самообожения – вот сущность понятияпадение. Адаму был предложен именно этот путь (см.Быт.3:5); а Господь, Создатель наш, говорит иное.'
      cn: 作为一位属灵指导者，过去我常常遇到这样的问题：如何才能不犯罪，如何与情欲争战，哪条道路通向上帝，以便能按祂的真实所是来认识祂，而不是像古希腊人那样，在雅典设立祭坛献给「未识之神」（参使徒行传 17:23）。在谢尔盖圣三一修道院，我看见一座教堂，上面刻着：「献给已知之神」。这种要求对人类来说是完全正当的。然而，在我们道德堕落之后，我们生来就在罪中（参诗篇 50:7），并生活在一个不祷告、最害怕基督的世界里。因此基督说：「若你们跟随我，你们就将为我的名被万民憎恨」（马太福音 24:9）。我们必须始终将自己置于这种视角之下：如何避免罪。从根本上说，历史的所有悲剧都是骄傲的后果。一个自以为是上帝的受造物，因自神化而成为魔鬼——这就是「堕落」概念的本质。亚当曾被诱以这条道路（参创世记 3:5）；而我们的上主、我们的造物主，却另有教导。
  - type: paragraph
    text:
      ru: 'Итак, если мы будем стремиться в жизни нашей следовать каждую секунду тому, чтобы сохранить заповедь Бога, и в молитвах наших выражать это: «Сподоби, Господи, в день сей, в вечер сей, в ночь сию без греха сохранитися нам», тогда сие «без греха» даст возможность Духу Святому прийти в нас и открыть всякое ведение о Боге как Он есть. Откуда взял Иоанн Богослов, что«Бог есть Любовь»(1Ин.4:8), что«Бог есть свет, и нет в Нем никакой тьмы»(1Ин.1:5)? Он не имел никакого академического диплома как богослов. Но вот он сказал эти слова, и они являются основными догматами нашей жизни.'
      cn: 那么，如果我们努力在我们的生活中，每时每刻都遵循并谨守上帝的诫命，并在我们的祷告中表达这一点：「求祢，主啊，使我们在这白日、这夜晚、这夜间，都得以无罪地蒙保守。」那么这个「无罪」就会使圣灵得以进入我们里面，并开启关于上帝其本然的一切认识。约翰神学家从何处得知「上帝是爱」（约翰一书 4:8），以及「上帝是光，在祂里面毫无黑暗」（约翰一书 1:5）呢？他并没有作为神学家获得任何学术文凭。然而，他却说出了这些话语，并且这些话语成为了我们生命中的基本教义。
  - type: paragraph
    text:
      ru: 'Я говорю об этом, потому что скоро умру вполне естественным порядком. Я не знаю, как я живу до сих пор: уже сколько раз я доходил до смерти. Однако я хочу, чтобы вы были тверды действительно и не колебались, когда встретитесь с красноречием многих докторов богословия, которые доказывают все, что хотите, с великим искусством словесным. Теперь не помню, где и когда, я слышал об одном случае. Один профессор богословия в Академии перед своими слушателями-студентами гениально представил догмат о Святой Троице, но затем все погасил одной лишь фразой: «Кто хочет верить, тот пусть верует!» Этим он уничтожил свое слово.'
      cn: 我说这些，是因为我很快就会以完全自然的方式死去。我不知道我是如何活到现在的：我已多少次濒临死亡。然而，我希望你们确实坚固不移，不致动摇，当你们遇到许多神学博士的雄辩时，他们能以高超的言辞艺术，证明一切你们想要的。现在我不记得是在何处，又是在何时，我听说过一个事例。一位神学教授在学院里，在他的学生听众面前，巧妙地阐述了圣三位一体的教义，但是随后他只用了一句话，便将这一切都熄灭了：「谁想相信，就让谁相信吧！」借此，他摧毁了他自己的言语。
  - type: paragraph
    text:
      ru: 'Итак, перед нами стоит вопрос: каким путем мы можем спасаться? В ответ я приведу слова нашего блаженного отца Силуана: «Благодарю Тебя, Господа и Создателя моего, что Ты милостиво смирил душу мою и открыл мне путь, которым шли святые Твои. Ты любишь плачущих, и путем плача шли к Тебе все святые. Дай же мне, милостивый Господи, идти к Тебе путем святых Твоих, путем смиренного плача, который Ты показал мне»[87].'
      cn: '于是，我们面前出现了一个问题：我们能借着何种道路蒙拯救？作为回应，我将引述我们蒙福的教父圣西卢安的话语：


        「我感谢祢，我的上主和我的创造者，祢慈悲地降卑了我的灵魂，并向我显明了祢众圣徒所行走的道路。祢爱那哀哭者，并且借着哀哭的道路，众圣徒都走向了祢。求祢，慈悲的上主，让我行向祢，走祢众圣徒的道路，走祢所向我显明的、那谦卑哀哭的道路」[87]。'
  - type: paragraph
    text:
      ru: 'Что является уродством современного общества? – Посмотрите, куда ведут все школы! Как только человек восходит до высших академических степеней, так он снисходительно, скорее с презрением и невниманием смотрит на всех, кто ниже. Как для всякого человека, рожденного в этом мире: малейшее преимущество его в научном плане уже делает его гордым. Из-за этой гордости – тенденция покорить слабейших.'
      cn: 现代社会的丑陋之处是什么？——看看所有的学校引导向何方！一个人一旦升到最高学术等级，他就居高临下地、毋宁说带着蔑视和漠不关心来看待所有比他低的人。对于生于此世的每个人而言：他在学识上的最微小优势，就已经使他骄傲自大了。因为这种骄傲，便有了征服弱者的倾向。
  - type: paragraph
    text:
      ru: И так вся история человека приходит к результатам действительно кошмарным. Возьмите нашу эпоху. Технические изобретения, казалось бы, должны были сделать человека счастливым, удовлетворить человеческое желание знать все, овладеть законами природы. Но никогда не было так много самоубийств, как теперь. И ни одна политическая стратегия не привела к постройке общества, в котором удалось бы устранить порабощение людей теми, кто овладел средствами насилия.
      cn: 于是，人类的整个历史走向了确实是令人惊恐的结果。就拿我们这个时代来说吧。科技发明，似乎本应使人幸福，满足人类知晓一切、掌握自然法则的渴望。然而，自杀人数从未像现在这样多。也没有任何政治策略未能建立一个社会，在其中得以消除掌握暴力手段者对人的奴役。
  - type: paragraph
    text:
      ru: 'Что же Господь показал нам? – «Кто хочет спастись и прийти к Отцу, пусть последует за Мною» (ср.Ин.14:6). А что Он сделал? Он совлекся Своего всемогущества, Он облекся в сотворенную Им форму бывания (именно «бывания», а не «бытия»)[88]. Он прошел истощание даже до конца, которого мы не можем достигнуть, и отдал Себя на убиение, на распятие. И за то получил Он Имя, превысшее всякого другого имени в земной истории или на Небе (см.Флп.2:7–9). И Он предложил нам этот путь (ср.Ин.14:6). Мы, христиане, исповедуем Его как «единородного» от Отца – так, как говорит Он (см.Ин.1:18): мы не сравниваем Его ни с одним учителем человечества – такими, как Будда, как Магомет и даже как Моисей. Он не есть по рождению Своему человеческий сын, по снисхождению Своему и воплощению Он стал «Сыном Человеческим» (см. Мф.11и др.), оставаясь по существу Творцом всего существующего. ВСимволе верыговорится: «вся Тем быша». И в прологе Евангелия от Иоанна сказано:«Все через Него начало быть, и без Него ничто не начало быть, что начало быть»(Ин.1:3). И вот, Он совлекся всего этого и отдал Себя на распятие. Отсюда получается закон, который мы должны помнить на всякий час, – отдавая нашу жизнь другим, мы воспринимаем от них клевету, гонения, нищету, отвержение и даже смерть. Взамен того, что мы даем жизнь, люди нам платят тем, что нагружают нас своею смертью. И это наш путь. Господь говорит об этом: «Великоев человецех мерзость есть пред Богом»(Лк.16:15). Как нам переродиться и все «великоев человецех»считать за«мерзость пред Богом»? Каким образом стать человеком, который не является рабом ни гордости, ни тщеславия, ни носителем желания попирать брата своего? – Через любовь Христову, которая распята в этом мире. И за этот путь ненавидит нас мир, ибо это не путь «князя мира сего».'
      cn: 上主向我们展示了什么？——「凡愿得救并归向父的，让他跟随我。」（参阅约翰福音 14:6）而祂做了什么？祂卸下了祂的全能，祂穿上了祂所创造的「存在形式」（「бывания」而非「бытия」）[88]。祂甚至虚己至我们无法企及的尽头，并舍弃自己，任人宰杀，任人钉死在十字架上。因此，祂得到了一个超越地上或天上任何其他名号的名（参阅腓立比书 2:7-9）。祂向我们指明了这条道路（参阅约翰福音 14:6）。我们基督徒，宣认祂是父的「独生子」——正如祂所言（参阅约翰福音 1:18）：我们不把祂与人类的任何一位导师相比，无论是佛陀、穆罕默德，甚至是摩西。祂按其诞生而言并非人类的儿子，祂按其降凡与道成肉身而言成为了「人子」（参阅马太福音 11及其他），而祂的本质仍是万有的创造者。在《信经》中说：「万物皆借祂而有」。约翰福音的序言中写道：「万有是藉着祂而有的；凡已有的，没有一样不是藉着祂而有的。」（约翰福音 1:3）于是，祂卸下了这一切，并舍弃自己，任人钉死在十字架上。由此产生了一个我们应当时刻铭记的法则——当我们我们将生命给予他人时，我们便从他们那里承受诽谤、迫害、贫乏、拒绝，甚至死亡。我们付出生命，而人们却以其死亡来回报我们。这就是我们的道路。上主论及此事说：「人看为高尚的，却是上帝所憎恶的。」（路加福音 16:15）我们如何才能重生，并将一切「人看为高尚的」都视为「上帝所憎恶的」呢？如何才能成为一个人，既不为骄傲所奴役，也不为虚荣所奴役，也不怀有践踏自己弟兄的欲望？——借着那在此世被钉死的基督之爱。而世界正因这条道路而憎恨我们，因为这并非「这世上君王」的道路。
  - type: paragraph
    text:
      ru: 'В нашу эпоху спасение стало труднее, чем прежде. Раньше свидетельства Бога, творящего невероятные чудеса, были повседневным явлением. Как Петр, простой рыбак без образования, стал вдруг учителем человечества? Дал ему Господь власть молитвой своей воскрешать даже мертвых. Есть предсказание святых отцов четвертого века о том, что в последние времена Бог скроет от людей, от верных своих, где они. Они не будут творить чудеса и будут ощущать себя как бы покинутыми Богом, в состоянии истощания[89]. Это есть единственный верный путь, как пишет прп. Силуан, – путь слезный[90]. Самая главная борьба – со страстью гордости. Все, которые хотят властвовать над людьми, – погрешают: они не понимают власти, данной от Бога. Сам Бог не хочет властвовать над человеком, ожидая, чтобы человек в свободе своей любви к Богу определился как бог.'
      cn: 在我们这个时代，救赎比以往更加艰难。过去，上帝行不可思议之奇迹的见证是司空见惯的现象。彼得，一个没有受过教育的普通渔夫，如何忽然间成了人类的导师呢？是上主赐予他权柄，借着他的祷告甚至使死人复活。四世纪的圣教父曾有预言，在末后的日子里，上帝将向人们，向祂的忠信者隐藏他们身在何处。他们将不施行奇迹，并会觉得自己仿佛被上帝遗弃，处于一种枯竭的状态[89]。正如圣西卢安所写，这正是唯一的正确道路——泪水之路[90]。最主要的争战是与傲慢的私欲作斗争。所有那些渴望掌控他人的人都犯了错：他们不明白来自上帝的权柄。上帝祂自己不愿掌控人类，祂期待着人，在他自由地爱上帝中，确立自己为神。
  - type: paragraph
    text:
      ru: Итак, в чем задача сегодняшнего моего слова? – Из моих слов всякий, кто подумает, что я против богословской науки, ошибется. И сейчас мы говорим, в сущности, о «богословии». И все другие понятия, которые мы можем приобрести через богословскую науку, входят в состав нашей молитвы. Тогда богословие наше становится содержанием молитвы. После того, как достигнуто это состояние (то есть когда богословие становится содержанием нашей молитвы), следует новое состояние, более высокое – богословие как состояние нашего духа, живущего непрестанно в Боге и Духе Святом. Я молюсь Богу о том, чтобы у вас утвердилось именно это состояние. И это есть наша «гносеология»[91]... Это есть путь к истинному познанию истинного Бога. Всякое слово, которое произносит Иоанн Богослов в Евангелии, становится для нас догматом. Он говорит, как бы повествуя, но все его учение сплошь носит характер определенного и несомненного знания. Он не вступает в спор ни с кем, но он «говорит» положения, которые мы теперь исповедуем о Господе Иисусе Христе:«В начале было Слово, и Слово было у Бога, и Слово было Бог... Все через Него начало быть, и без Него ничто не начало быть, что начало быть»(Ин.1:1–3).
      cn: '那么，我今日之言的用意何在？——从我的话语中，任何认为我反对神学科学的人，就错了。而此刻，我们实质上是在谈论「神学」。并且所有我们能通过神学科学获得的观念，都会融入我们的祷告之中。如此一来，我们的神学就成为祷告的内容。在这种状态（即神学成为我们祷告的内容）达成之后，会有一种新的、更高的状态随之而来——神学作为我们精神的一种状态，持续不断地活在上帝和圣灵之中。我向祢上帝祷告，愿这种状态能在你们身上得以确立。这就是我们的「认识论」[91]……这是通向真理的上帝的真实认识的道路。圣使徒约翰神学家在福音书中所宣讲的凡是每一个字，都成为我们的教义。他说话，仿佛只是在叙述，但他所有的教导无一不带着明确而确凿的知识的特征。他不与任何人争辩，但他「宣说」那些我们现在对主耶稣基督所宣认的论点：

        「太初有道，道与上帝同在，道就是上帝……万物是藉着祂造的，凡被造的，没有一样不是藉着祂造的。」（约翰福音 1:1-3）'
  - type: paragraph
    text:
      ru: 'Так, наше христианство никогда не должно быть смешано ни с каким другим учением, существующим в мире: для нас существует только Евангелие.'
      cn: 因此，我们的基督教绝不应与世上任何其他教义相混淆：对我们而言，唯有福音。
  - type: paragraph
    text:
      ru: 'Господь не отвергал Ветхого Завета. Он пришел восполнить откровение, данное Моисею:"Азесмь сущий»(Исх.3:14). И второймоментВетхого Завета, который подразумевал Господь, – падение человека. Он пришел и начал Свою миссию спасения человека проповедью: «“покайтесь“(Мф.4:17)! Вот, вы совершили это преступление, о котором Я говорил вам. Вы съели плоды дерева, от которого Я заповедал вам не есть!» (ср.Быт.3:17)'
      cn: 上主并未废弃旧约。祂降临是为了成全赐予摩西的启示：「我就是那自有永有的」（出埃及记 3:14）。而旧约中上主所暗示的第二点，是人的堕落。祂降临，并以祂救赎人类的使命，借着宣讲：「「你们要悔改」（马太福音 4:17）！看哪，你们犯下了这罪行，就是我曾告诉你们的。你们吃了那树上的果子，就是我命令你们不可吃的！」（参阅创世记 3:17）
  - type: paragraph
    text:
      ru: Что такое «дерево познания Добра и Зла», плод которого они съели? – «Познание» библейское аналогично понятию «общение в бытии» и как таковое носит характер бытийный. Значит, они съели плод и совершили зло действительно. Отсюда падение, разделение с Богом. Отсюда, за всю многотысячелетнюю историю человечества, все эти кошмары и ужасы, которые мы видим каждый день. Таково последствие. И мы сейчас можем видеть ясно, что мир неизбежно умрет.
      cn: 「善恶知识树」是什么，他们所吃的果子又是什么？圣经中的「知识」类似于「在存有中的交通」这一概念，并且其本身带有存有性的特征。这意味着，他们吃了果子，并且确实地犯了恶。由此而来的便是堕落，以及与上帝的分离。由此，人类数千年来所经历的，以及我们每天所见的所有这些噩梦与恐怖景象，皆源于此。这就是后果。并且我们现在可以清楚地看到，世界将不可避免地走向死亡。
  - type: paragraph
    text:
      ru: Итак, не через «научное» познание богословских дисциплин, а через святую жизнь без греха нужно дойти до состояния, когда человек начинает «видеть Бога,как Он есть»(1Ин.3:2)...
      cn: 因此，并非通过对神学学科「科学的」认知，而是通过无罪的圣洁生活，人必须达到一种状态，当他开始「看见上帝，看见祂本来的样子」(约翰一书 3:2)...
  - type: paragraph
    text:
      ru: 'И моя молитва о том, чтобы вы послушали слово старца Силуана: путь святых – это путь плача любви. Где любовь – там есть плач. А где нет любви – там нет плача: даже в великих страданиях и муках, скажем во время войны, когда мы были свидетелями всякого рода издевательств над человеком побежденным, когда садизм стал повседневностью во всем мире, и там – нет плача. Я даже слышал о таком способе борьбы: чтобы преодолеть издевательства победителей, нужно ненавидеть их всем существом. Эта ненависть уменьшает боль, и тогда с побежденным ничего нельзя сделать. А Господь говорит:«любите враги ваша»(Мф.5:44). От этой любви рождается плач за согрешающих, за мучителей, которые не познали путь ко спасению и к жизни истинной по образу Божию.'
      cn: 我的祷告是希望你们聆听圣者圣西卢安的话语：圣者的道路是爱之哀哭的道路。何处有爱，何处便有哀哭。而何处无爱，何处便无哀哭：即使在巨大的痛苦和折磨中，比如说，在战争时期，当我们目睹各种对战败者的凌辱时，当虐待狂在全世界司空见惯时，即使在那里，也没有哀哭。我甚至听说过这样一种反抗方式：为了克服胜利者的凌辱，必须以整个生命去憎恨他们。这种憎恨可以减轻痛苦，那样一来，便无人能奈何战败者。然而上主说：「要爱你们的仇敌」（马太福音 5:44）。从这爱中生出哀哭，为着那些犯罪者，为着那些施虐者，他们尚未认识通往救赎和按照上帝形像的真生命之路。
- type: heading1
  text:
    ru: 'Беседа 13: Богопознание через уподобление Христу в Его всечеловечестве[92]'
    cn: '讲章 13: 藉着在基督的普世人性中效法祂而认识上帝[92]'
  children:
  - type: paragraph
    text:
      ru: Академическое образование и вера. Опыт Христа как основа жизни прп. Силуана. Что значит быть образом Бога. Христос как идеал человека. Об истинном богословии. «Не совершить греха» как путь к боговосприятию, по примеру прп. Силуана. Братство как путь к жизни в Боге и Богом. Подобие Христу в Его универсализме. Результаты научного богословия. Об экуменизме – как жизни без греха. Современное богословие – autour du pot. «Отче наш» есть истинная патрология.
      cn: '学术教育与信仰。

        基督的经验作为圣西卢安生命的基础。

        成为上帝肖像的含义。

        基督作为人的典范。

        关于真正的神学。

        「不犯罪」作为通往领受上帝的道路，效法圣西卢安的榜样。

        弟兄情谊作为通往在上帝内并借着上帝而生活的道路。

        肖似基督在其普世性中。

        科学神学的成果。

        关于大公合一——作为无罪的生活。

        现代神学——围绕着罐子。

        「我们的天父」是真正的教父学。'
  - type: paragraph
    text:
      ru: '...Кто-то мне сказал, что сегодня на беседу придут гости наши, дорогие нам о Христе братья и сестры. Многие из гостей сегодняшних знают русский язык. И мне лично, когда я ослабел от большой старости, легче всего говорить все-таки по-русски. Я должен предупредить гостей, что беседа наша идет регулярно в течение многого времени. И то, что вы услышите, это будет как бы кусок, вырезка из газеты, маленькая часть, или некая страница из книги. Но я должен говорить все-таки моим братьям и моим сестрам, которые пришли недавно.'
      cn: 有人告诉我，今天将有我们的客人前来参加座谈，他们是我们在基督里亲爱的弟兄姐妹。今天在座的许多客人懂得俄语。而我个人，年事已高，身体衰弱，还是说俄语最方便。我必须提醒各位来宾，我们的座谈是定期举行，并已经持续了很长时间。那么，你们今天所听到的，就像报纸上的一小段剪报，一个很小的部分，或者说一本书中的某一页。但我还是要对那些最近才来的弟兄姐妹们说。
  - type: paragraph
    text:
      ru: 'Итак, в чем моя забота о моих братьях и сестрах, дорогих мне о Христе? – В том, чтобы, живя в этом мире, они не стали жертвой какой-нибудь аберрации, касающейся путей спасения нашего в Боге. В древние времена вера во Христа была общею, и дети с самых юных лет приучались молиться Богу и жили Богом. В прежние годы можно было удержать «порядок» такой: человек шел в школу, где преподавалось научное богословие, уже приготовленный не только к вере во Иисуса Христа, но даже и к любви к Нему. Люди, подобно свт.Иоанну Кронштадтскому, кончали Академию, не теряя веры, – полные того опыта благодати, которая была дана им в детстве. В наше время воспитание детей – очень трудный момент. Школы наши поставлены в зависимость от сферы логики человеческой и земных интересов. Из-за потери веры родителями дети приходят в школу и учатся богословию так же, как и всякому другому предмету – химии, физике, географии, лингвистике и так далее. И это приносит страшный вред, потому что они привыкают жить Бога логически. А те, которым знакомо дыхание Духа Святого, понимают, что логика Аристотеля не годится для богословия, что та реальность, которая открывается нам, требует удаления от логики формальной и перехода к логике с категориями Самого Бытия, Которое Бог открывает нам Своим пришествием.'
      cn: 那么，我在基督里亲爱的弟兄姐妹们，我所关心的又是什么呢？—— 就是为了让他们活在这世上时，不要成为任何关乎我们在上帝里的得救之道的偏差的牺牲品。在远古时代，对基督的信仰是普遍的，孩子们自幼就被教导向上帝祷告，并活在上帝里。在过去那些年，还能维持这样的「秩序」：人们去学校，在那里教授着科学神学，而他们已经不仅对耶稣基督的信仰有所准备，甚至对祂的爱也已有所准备。人们，像圣伊望·克朗施塔特那样，毕业于神学院，却没有失去信仰——他们满载着幼年时所蒙受的恩典经验。在我们这个时代，孩童的教养是一个非常艰难的时刻。我们的学校已经变得依赖于人类的逻辑领域和世俗的利益。由于父母亲丧失了信仰，孩子们来到学校，学习神学，就如同学习任何其他科目一样——比如化学、物理、地理、语言学等等。而这带来了可怕的损害，因为他们习惯于以逻辑来理解上帝。而那些熟悉圣灵气息的人，明白亚里士多德的逻辑不适用于神学，明白那向我们启示的实相，要求我们摆脱形式逻辑，并转向一种具有「存有」本身的范畴的逻辑，这种「存有」是上帝以祂的降临向我们启示的。
  - type: paragraph
    text:
      ru: 'Эта аберрация теперь создается из-за того, что люди не подготовлены с юных лет (я бы сказал, «от чрева матери своея») к тому, чтобы жить Бога. Как они, рожденные по плоти, воспринимают то, что им преподается в богословских школах? – Как отвлеченные понятия о Боге: «вокруг и около». Отсюда получается, что самое выгодное положение – сначала пройти опыт жизни в Боге, как это дается в монастыре...'
      cn: 这种偏差现在是由于人们从幼年起（我甚至会说，「从母胎中」）就没有被预备好去活出上帝而造成的。他们这些按着肉体而生的人，又如何领会神学院里所教导他们的呢？——就如同关于上帝的抽象概念：「只是空泛的观念」。由此可见，最有益的境况是——首先要经历在上帝里的生命，如同修道院里所提供的……
  - type: paragraph
    text:
      ru: 'Итак, драгоценные для меня братья и сестры, снова мое слово будет о том же: наивысшее богословие относительно принципа ипостаси в Бытии Божественном и в бытии человеческом остается основной темой нашей. И при этом внимание наше концентрируется на вопросе: какой путь ведет к познанию Бога в Его персональном, ипостасном Бытии.'
      cn: 那么，我亲爱的弟兄姐妹们，我的话语将再次论及同一主题：在神性存有和人性存有中，关于位格原则的至高神学，依然是我们的主要主题。而与此同时，我们的关注点集中在一个问题上：哪条道路通向在祂位格性的、本位的存有中对上帝的认识。
  - type: paragraph
    text:
      ru: 'Почему нам так драгоценен прп. Силуан как наш великий духовный отец? Нам дана привилегия большая, чем когда-либо имели люди после потери великой благодати первых веков: этот человек, почти совсем безграмотный, покинув солдатскую казарму, пришел на Святую Гору и тогда, в самом начале, удостоился видения живого Господа. Но прежде этого явления он пережил один час в ясном видении вечной погибели. Это состояние! Сам он боялся даже говорить об нем – так оно тяжело. И когда он был сокрушен, то пошел в храм на монастырской мельнице, где он работал. И едва он произнес молитву: «Господи, Иисусе Христе, Сыне Божий», как увидел живого Христа[93]. Видение продолжалось мгновение, без слов, но вся жизнь его была затем отмечена тем, о чем мы хотим богословствовать.'
      cn: 为何圣西卢安作为我们伟大的属灵父亲，如此为我们所珍视？我们蒙赐了一项特权，比初代教会失去伟大恩典后的人们所拥有的任何特权都要大：这个人，几乎完全不识字，离开士兵兵营，来到圣山，就在那时，在一开始，蒙受了活生生的主的显现。但在这显现之前，他经历了一小时清晰的永恒灭亡的异象。这种状态！他自己甚至不敢谈论它——因为它如此沉重。当他心神破碎时，他去了修道院磨坊里的教堂，他就在那里工作。他刚一祷告：「上主，耶稣基督，上帝之子」，就看见了活生生的基督[93]。异象持续了片刻，没有言语，但他的一生随后都被我们想要进行神学论述的那个所标记。
  - type: paragraph
    text:
      ru: 'Откровение о Боге говорит нам, что после того, как был создан этот Космос со всем вещественным и животным миром, Бог говорит:«cотворим человека по образу Нашему [и] по подобию»(Быт.1:26). Итак, образ в нас живет по самому рождению нашему. Но что значит «по подобию»? – «По подобию» является целью нашей. И какое «подобие»: частичное или подобие глубокое, великое и вечное? – Конечно, второе верно. Человек создан быть с Богом, в единстве жизни Бога и человека. Содержание этого понятия «по подобию» – вот что является темой нашего самого последнего и важного богословия, которое люди утеряли: как живет в мире осуществленный образ Бога, как реагирует таковая ипостась по образу Ипостаси воплощенного Сына Божия, где пребывает ум этого человека днем и ночью, что бы он ни делал.'
      cn: 关于上帝的启示告诉我们，在创造了这宇宙及其所有物质和动物界之后，上帝说：「我们要照着我们的形像，按着我们的样式造人。」(创世记 1:26)。因此，形像从我们出生的那一刻起就活在我们里面。但「按着样式」是什么意思呢？——「按着样式」是我们的目标。并且是怎样的「样式」：局部的，还是深刻、伟大而永恒的样式？——当然，第二种说法是正确的。人被造是为了与上帝同在，在上帝与人生命的合一中。「按着样式」这个概念的内涵——这正是我们最晚近和最重要的神学主题，是人们已经失落的：上帝已实现的形像如何在世上生活，如此的位格如何按着道成肉身的上帝之子的位格作出回应，这个人的心智无论日夜，无论他做什么，都居于何处。
  - type: paragraph
    text:
      ru: 'Как достигнуть и познать это содержание подобия Богу? – Становясь подобными до тожества с Богом, мы получаем вечную жизнь в Боге. Вечная жизнь в Боге – это Сам Бог (ср.Ин.14:6). Его жизнь становится нашей жизнью. Господь открылся Моисею как"Азесмь сущий»(Исх.3:14). В этом понятии заключен смысл, что Бытие есть только Бог, Который нам открывается: сие Бытие было до появления космической жизни, созданной вечным, безначальным Богом. Конечно, нас естественно охватывает ужас: как мы, рожденные из ничего, подверженные всяким болезням, можем стать обладателями и носителями вечной и безначальной жизни Божества? Никакая человеческая логика не позволяет поверить так. Однако во Христе мы получили именно это откровение; и мы понимаем, какую предвечную идею о человеке имел Бог, когда Он говорил:«сотворим человека по образу Нашему [и] по подобию»(Быт.1:26). Для нас, христиан, воплощенный Сын Божий дает Откровение о предвечной идее Бога о человеке.'
      cn: '如何达到并认识这肖似上帝的内涵？


        — 通过变得与上帝肖似达到合一，我们便获得在上帝里面的永生。在上帝里面的永生，就是上帝本身（参阅约翰福音 14:6）。祂的生命成为我们的生命。上主向摩西启示为「我是自有永有的」（出埃及记 3:14）。在这个概念中蕴含着一个意义，即存在本身唯独是上帝，祂向我们启示：这存在早于宇宙生命的出现，宇宙生命是由永恒的、无始的上帝所创造的。当然，我们自然而然地被一种恐惧笼罩：我们这些从虚无中诞生、饱受各种疾病侵袭的人，如何能够成为神性那永恒而无始的生命的拥有者和承载者呢？任何人类的逻辑都无法让人如此相信。然而，在基督里我们恰恰领受了这一启示；并且我们明白，当上帝说「我们要照着我们的形像、按着我们的样式造人」（创世记 1:26）时，祂对人有着何等先于永恒的旨意。对于我们基督徒而言，道成肉身的上帝之子赐予我们关于上帝对人那先于永恒的旨意的启示。'
  - type: paragraph
    text:
      ru: 'Дистанция, разделяющая нас, рожденных во грехе, от Бога Святого и Безначального, непомерно велика даже для астрономов, которые живут это космическое бытие с такими страшными расстояниями. Как мы можем «перешагнуть» это препятствие? – Если мы являемся во времени, то, по естественной логике, мы должны умереть. Но вот Господь говорит:«Хочу, чтобы там, где Я, и слуга Мойбыл» (ср.Ин.12:26, 17:24). А Он Сам – Безначальный Бог, и душа хотела бы говорить только о сем принципе персоны, ипостаси в Боге и услаждать наше сердце и ум этим видением Откровения. Однако мы отдадим сейчас первое внимание... тому, как достигнуть сего начала. Логически это невозможно: математический ум говорит, что, сколько бы ни добавляли нулей к числу, все равно оно никогда не достигает безначального и бесконечного. А мы говорим, что «перешагиваем» сие препятствие и что мы созданы для того, чтобы носить в себе этого вечного Бога.'
      cn: 隔在我们这些生于罪中的人与圣洁无始的上帝之间的距离，大得无法衡量，即使是对于那些生活在这充满可怕距离的宇宙中的天文学家来说，也是如此。我们如何才能「跨越」这个障碍呢？如果我们存在于时间之中，那么按照自然的逻辑，我们必当死去。然而，上主说：「我愿我的仆人也在我所在的地方」（参看约翰福音 12:26，17:24）。而祂自己是无始的上帝，灵魂本愿只谈论上帝位格、本体的这一原则，并以这启示的景象来愉悦我们的心智。然而，我们现在将首先关注……如何才能达到这个开端。从逻辑上讲，这是不可能的：数学思维告诉我们，无论一个数字后面加上多少个零，它也永远无法达到无始和无限。然而我们说，我们「跨越」了这个障碍，并且我们被造是为了在我们自身内承载这位永恒的上帝。
  - type: paragraph
    text:
      ru: 'Итак, из этой программы высшего богословия мы переходим к практической жизни нашей. Что мы можем делать каждый день, чтобы приблизиться к этой цели – беспредельной, божественной жизни? С чего мы начнем нашу монашескую жизнь? – С того, чтобы каждый день первой заботой нашей было не совершить греха. Через этот аскетический подвиг – «не совершить греха» – очищается наш ум и сердце и все наше существо от мрака греха. И человек становится способным к непосредственному восприятию исходящего от Бога. Почему я привожу опять наш любимый пример – Силуана? Потому что он получил высшее богословское состояние (уже не как эрудицию, а каксостояние) в одно мгновение. Как мы можем стать, подобно Силуану, восприимчивыми к тому, что исходит от Духа Святого как познание о Боге истинном? – Мы должны беречься от всякой отрицательной мысли о нашем ближнем в маленьком кругу людей монастырского братства... Каждый человек по-разному все воспринимает, и если мы откроем сердце каждому в молитве нашей постоянной, то можем «усвоить» двадцать человек, чтобы жить с ними, как с братом и сестрой. Если каждый из нас является представителем какой-то многомиллионной группы подобных характеров в этом миллиардном человечестве, значит, мы можем жить уже со всеми этими миллионами. Что значит жить с ними? – Носить их в нашей молитве как драгоценное для нас существо. И кончается это тем, что сознание наше перерождается от общения со Христом, Который есть Бог Безначальный и Ипостасный Бог, и Сей Персональный Бог передает нам Свою жизнь. Я применил такое понятие «богослов»: прп. Силуан стал богословом не в школьном понимании этого слова, то есть получив диплом семинарии, академии или тому подобное, – нет! – но в том смысле, когда богословие есть состояние человека, живущего Богом и в Боге. И Бог действует в нем, и человек живет в Боге. Мы можемжитьэто богословие-состояние, читая Евангелие от Иоанна.'
      cn: 那么，从这门高等神学课程，我们转向我们的实际生活。我们每天能做些什么，以接近这个目标——无涯的、神圣的生命呢？我们的修道生活该从何开始呢？——从每天我们首要的关切是不犯罪开始。藉着这种苦修的功德——「不犯罪」——我们的心智和心灵以及我们的整个存在得以洁净，脱离罪恶的黑暗。于是人就能够直接领受来自上帝的事物。我为何再次举出我们所爱的榜样——圣西拉呢？因为他在一瞬间获得了一种至高的神学境界（不再是作为学识，而是一种境界）。我们如何才能变得如同西拉一样，能够领受那来自圣灵之物，作为对真上帝的认识呢？——我们必须警惕在修道院弟兄团体的那个小圈子里，关于我们近人的一切负面的念头……每个人对事物的领受方式各不相同，而如果我们以恒常的祷告向每一个人敞开心扉，那么我们就能「同化」二十个人，好与他们如同兄弟姐妹般生活。如果我们每一个人都是代表某个拥有数百万类似性情群体的（个体），在这个亿万人口的人类中，这意味着我们就可以与所有这数百万（人）一同生活了。与他们一同生活意味着什么呢？——在我们的祷告中承载着他们，如同我们珍贵的存在。而这最终导致我们的意识通过与基督的共融得以蜕变，祂是无始的上帝，也是位格的上帝，而这位具位格的上帝将祂的生命赐予我们。我运用了「神学家」这个概念：圣西拉之所以成为神学家，并非依照这个词的学院派理解——也就是说，并非通过获得神学院、宗教学府或类似的文凭——不！而是在这样的意义上：当神学是一个人活在上帝之中、并以上帝而活的境界时。上帝在他里面运行，人也活在上帝之中。我们可以通过阅读《约翰福音》来活出这种神学境界。
  - type: paragraph
    text:
      ru: 'Что же есть то естественное состояние, которое уподобляет Богу-Христу? – Символом нашей веры является Крест: потому что, восходя на Голгофу, чтобы быть распятым по любви к миру за грехи мира, Христос нес в Себе не еврейский род (как того хотели бы евреи), не римлян, не греков, не скифов, а все человечество. И называется оно «весь Адам»: Христос нес всего Адама. И молитва за всего Адама, которая была дана Силуану видением Христа, была такой: «Господи, дай всему миру познать Тебя Духом Святым». На каждый момент, встречаясь с дефектами человека, он мыслил, что все человечество поражено этой болезнью, которую апостол Павел назвал «закономгреха»(см.Рим.7:25). И каждый раз, сталкиваясь с преступлениями, недоумениями, гонениями, развратом, – чем бы то ни было, он всегда мыслил так: «Это потому, что они не познали Бога Духом Святым». А если бы познали Его Духом Святым, то, конечно, человечество жило бы другою жизнью. Это была бы неописуемая гармония любви вечной.'
      cn: 那么，那使人肖似上帝-基督的自然状态究竟是什么呢？——我们信仰的象征是十字架：因为基督升上各各他，为要出于对世人的爱，为了世人的罪而被钉死在十字架上，祂所背负的并非犹太民族（正如犹太人所愿），并非罗马人，并非希腊人，并非斯基泰人，而是全人类。它被称为「整个亚当」：基督背负了整个亚当。而那借由基督的异象赐予西拉万的、为整个亚当所作的祷告，是这样的：「上主啊，愿普世万民借由圣灵认识祢。」在每个时刻，当他遇到人的缺陷时，他认为全人类都感染了使徒保罗称之为「罪的律」的这种疾病（参罗马书 7:25）。而每当他面对罪行、困惑、迫害、败坏——无论是什么——他总是这样想：「这是因为他们未曾借由圣灵认识上帝。」而如果他们借由圣灵认识了祂，那么，人类当然会过着另一种生活。那将是永恒之爱的莫可名状的和谐。
  - type: paragraph
    text:
      ru: 'Так начинается эта «наука» с очень простого: с терпеливого отношения к каждому человеку. Опыт показал, что даже в браке при самой глубокой любви человеческой невозможно обойтись без конфликтов. А конфликты не мыслятся в Божественном Бытии.'
      cn: 这门「学问」的开端非常简单：即以忍耐对待每一个人。经验表明，即使在婚姻中，即便有着最深沉的人间之爱，也无法避免冲突。而冲突在神圣的存有中是不可思议的。
  - type: paragraph
    text:
      ru: 'Итак, когда я покину вас, пожалуйста, спасайтесь от этой аберрации – от академических дипломов. Однажды я встретил здесь на дороге нашего монастыря одного человека, который сказал, что он получил звание доктора богословия. И я ему ответил: «Что же вы хотите, это ценится выше, чем святость в нашем омраченном мире».'
      cn: 那么，当我离开你们的时候，请你们要避开这种反常——避开那些学术文凭。有一次，我在这里，在我们修道院的路上遇到一个人，他告诉我他获得了神学博士的头衔。我回答他说：「你还能指望什么呢？在我们这被蒙蔽的世界里，这被看重得比圣洁更高。」
  - type: paragraph
    text:
      ru: А к чему привели нас эти школы? – К тому, чтобы вырабатывать стандартные какие-то существа, которые говорят о вещах, никогда не пережитых. Откуда этот мрак в нашей Церкви? Откуда эти расколы?
      cn: 然而这些学校把我们引向了什么呢？——其结果是培养出某种标准化的存在，他们谈论着从未亲身经历过的事物。这黑暗在我们的教会中从何而来？这些分裂从何而来？
  - type: paragraph
    text:
      ru: Я уже не раз говорил вам, но Дух толкает меня на повторение. Прежде чем я уйду от вас – а конец моей жизни, конечно, близок, – я хотел бы, чтобы вы спаслись от аберрации, которой страдает современный мир в плане богословия, чтобы не создавал никто неверных теорий о Боге, которые разделили христианский мир. Подумайте, в Женевском Центре всемирного единения Церквей больше двухсот докторов богословия с разными мнениями! Откуда это? Ведь Бог единый!
      cn: 我已不止一次对你们说过，但圣灵催促我重申。在我离开你们之前——我的生命之终结，无疑已临近——我希望你们能摆脱现代世界在神学上所受的偏差，以免有人创造出关于上帝的错误理论，这些理论已分裂了基督信仰世界。试想，在日内瓦的普世教会合一中心，有两百多位神学博士，他们的意见各不相同！这是为何？上帝是独一的！
  - type: paragraph
    text:
      ru: 'И как получается, что существуют конфессии, которые ненавидят других и гонят? Теперь гонение на Православие по всему миру. А чем мы вызываем эту ненависть? Мы боимся «и муху обидеть», а нас ненавидят больше, чем преступников. И это совсем не фантазия, как мы знаем по опыту. Но«да не смущается сердце ваше: веруйте во Христа Бога» (см.Ин.14:1) и продолжайте эту жизнь. Он сказал: «КакМеня возненавиделибез причины (см.Ин.15:25), так и выбудете ненавидимы имени Моего ради»(см.Мк.13:13). Итак, не потеряйте основного видения: жизни без греха!'
      cn: 那么，为何会有一些宗派憎恨并迫害他人呢？如今，正教在全世界正遭受迫害。我们又因何而招致这份憎恨呢？我们连「伤害一只苍蝇」都唯恐不及，然而我们所受的憎恨却甚于罪犯。这绝非空想，如我们所亲身经历的。然而，「你们心里不要忧愁：要信靠基督上帝」（约翰福音 14:1），并继续这样的生活。祂曾说：「世人怎样无故地憎恨我（约翰福音 15:25），你们也必因我的名而被憎恨」（马可福音 13:13）。所以，不要失去这核心的愿景：就是无罪的生活！
  - type: paragraph
    text:
      ru: 'Я не принимаю участия в экуменическом движении. Но моя идея была такова: соберитесь и рассуждайте, как можно прожить без греха. Приходят двести докторов богословия, и каждый говорит свои глупости, обнаруживая свое неведение и невежество. Приведем одно из заблуждений: люди изучают все религии, и в этом теоретическом познании истории всех религий и содержания учений они видят универсальность свою. А Господь нам говорит:«Один у вас Отециодин Учитель – Христос»(см.Мф.23:8–9). И этот Учитель-Христос носит в Себе все создание. Итак, будем идти вслед стопам Христа, Который носит в сознании Своем эту трагедию и умирает за Свою веру.'
      cn: 我不参与普世合一运动。但我的想法是：聚集起来，讨论如何才能过上无罪的生活。两百位神学博士前来，每个人都道出自己的谬论，显露出他们的无知和愚昧。举一个谬误为例：人们研究所有宗教，并且在这种对所有宗教的历史及其教义内容的理论性认知中，他们看到了自己的普世性。而上主对我们说：「你们只有一位父，也只有一位导师——基督」（马太福音 23:8-9）。而这位导师——基督，在祂自身中承载着一切受造之物。因此，让我们追随基督的脚步，祂在自己的意识中承载着这场悲剧，并为祂的信仰而死。
  - type: paragraph
    text:
      ru: В течение семидесяти лет в России у власти были гуманисты марксистского типа, которые думали, что спасают мир от заблуждения. Они силою хотели искоренить восприятие Бога из сознания людей. Это духовное пленение продолжалось семьдесят лет. Прообразом этого было Вавилонское семидесятилетнее пленение еврейского народа – носителя первых принципов Откровения.
      cn: 在七十年间，马克思主义式的人道主义者在俄罗斯掌权，他们自以为正在将世界从谬误中拯救出来。他们试图强行从人的意识中根除对上帝的认知。这种精神上的囚禁持续了七十年。这的预表是犹太民族在巴比伦七十年之被掳——他们是启示之最初原则的承载者。
  - type: paragraph
    text:
      ru: 'Совсем простая молитва: «Господи, сподоби нас без греха сохранитися в сей день, в сию ночь», на которую способны даже дети, – это есть истинный путь. Тогда мы смотрим на науку как подобает: наука сама по себе никак и никого не спасает и не дает бытийного познания о Боге, а толькоtoujours autour du pot[94]– «всегда вокруг да около».'
      cn: 一句极其简单的祷告：«祢啊，使我们今日、今夜无罪得以蒙保守»，连孩童也能做到——这便是真正的道路。那时我们才能以应有的方式看待科学：科学本身绝不能拯救任何人，也不能赐予关于上帝的本真知识，而只是toujours autour du pot[94]——「总是在原地打转」。
  - type: paragraph
    text:
      ru: 'И спорят люди из-за мелочи: когда разбираешь, о чем они спорят, не понимаешь, как эти ученые люди могут быть такими невеждами. Я не буду говорить о том, что, казалось бы, очевидно из Откровения. И как люди не понимают этого! Но что мне дорого: чтобы вы знали об этом и не прельстились и не заблудились. Мы видим, что иногда люди, невежественные духовно, живущие противно духу Христа, распятого по любви, стоят во главе церковных течений. В этом трагизм истории.'
      cn: 人们为琐事争论不休：当你探究他们争论的是什么时，你不明白这些有学问的人如何会如此无知。我不会谈论那些似乎显而易见出自启示的事情。而人们如何不明白这一点！但我所珍视的，是让你们知道这一点，而不至于被诱惑、不至于迷失。我们看到，有时那些属灵上无知、其生活与因爱而被钉死的基督精神相悖的人，却站在教会潮流的前沿。这就是历史的悲剧。
  - type: paragraph
    text:
      ru: 'Итак, чтобы открылось в нас истинное познание, будем держаться только этого принципа: «Сподоби, Господи, в день сей без греха сохранитися нам»...'
      cn: 所以，为了使我们里面显明真正的认识，我们就当唯独持守这一原则：「愿祢，上主，恩准，在今日无罪地保守我们」……
  - type: paragraph
    text:
      ru: Так, «Our Father...» is our true patrology[95].
      cn: 所以，『我们的父……』是我们真正的教父学[95]。
- type: heading1
  text:
    ru: 'Беседа 14: О хранении ума в Боге[96]'
    cn: 讲论 14：论心思在上帝里的保守[96]
  children:
  - type: paragraph
    text:
      ru: 'О силе и глубине смысла каждодневных молитв. О прп. Силуане: где он пребывал умом по примеру Христа. Отражение помыслов через хранение ума в Боге. Человек есть чудо: «земля», живущая и мыслящая Бога. Чувство связи с Богом – начальная цель нашего подвига. От памятования о Страшном Суде к покаянию, уподобляющему нас Христу. Как перейти умом к Богу. О святогорце Серафиме: «унижает только грех». О нескончаемом покаянии. О перерождающей силе слова по молитве. Послушание приводит к истинному Бытию.'
      cn: '关于日常祈祷的力量和深刻意义。

        关于圣西路按：他的心智如同基督一般，常住在何处。

        借着将心智保守在上帝之中，反省诸思。

        人是奇迹：「尘土」，却活出上帝并思念上帝。

        与上帝相连之感——我们苦修的最初目标。

        从记念末日审判到使我们与基督肖似的悔改。

        如何将心智转向上帝。

        关于圣山修士塞拉芬：「唯有罪才使人屈辱。」

        关于不止息的悔改。

        关于借着祈祷，话语所具有的重生的力量。

        顺服引向真正的存有。'
  - type: paragraph
    text:
      ru: Не раз я говорил вам, что я благодарю Бога, Который продлил мою жизнь и Который дает мне радость общения с вами, хотя я уже, как сам себя чувствую, полная развалина. И все-таки я вынуждаюсь говорить с вами о путях ко спасению.
      cn: 我曾不止一次地对你们说过，我感谢上帝，祂延长了我的生命，并赐予我与你们相交的喜乐，尽管我，正如我自己的感觉，已经是个完全的朽坏之躯了。然而，我仍不得不与你们谈论通往救赎的道路。
  - type: paragraph
    text:
      ru: 'На каждый день мы повторяем многие молитвы, сколько бы мы ни прожили на Земле. Имею в виду историю Церкви, которая хранит молитвы, данные еще Самим Господом Иисусом Христом, как, скажем, «Отче наш». И сейчас мы будем говорить опять о путях, как нам достигнуть «Отца нашего, иже на Небесех». Мы так слабы и раздавлены каждый день, что нам трудно подняться от земли. И как можем мы, расслабленные, прийти к Нему?.. Как мы, лежащие долу на земле, можем получить от Бога дар вечной божественной жизни. Конечно, как апостол Павел говорил, надо быть«безумным»(см.1Кор.3:18), чтобы поверить в Откровение о будущем веке, данное нам через Иисуса Христа Духом Святым.Символ Верынашей кончается так: «Чаю (то есть ожидаю «с терпением и с нетерпением») воскресения мертвых и жизни будущего века. Аминь». Повторяйте эту молитву и, пожалуйста, не дайте никому украсть у нас настоящий смысл того, что мы произносим в храме! Когда мы говорим «Отче наш» – это страшное слово – и приходит настоящее чувство Его присутствия, то мы чувствуем себя действительно такими ничтожными, такими маленькими! Когда мы произносим слова «чаю воскресения мертвых», в этом чаянии заключена живая сила, которая нас воскресит, – сила веры. Так, перед нами как монахами стоит одна и та же задача на каждый день, как бы долго ни длилась наша жизнь. Если мы живем разумно и сознательно пред Лицом Бога, тогда мы получим настоящее действие Божие – благодать.'
      cn: 每天我们重复许多祷告，无论我们在这世上活多久。我指的是教会的历史，她保存着甚至是由主耶稣基督亲自赐予的祷告，比如，「我们的父」。而现在我们将再次谈论，我们如何才能达到「我们在天上的父」的途径。我们每天如此软弱和备受压榨，以至于我们难以从地上站起来。而我们这松弛无力之人，怎能来到祂那里呢？我们这些俯伏在地的人，如何能从上帝那里获得永恒神圣生命的恩赐呢？当然，正如使徒保罗所说，必须是「愚拙的」（参见哥林多前书 3:18），才能相信这圣灵通过耶稣基督赐予我们的，关于未来世代的启示。我们的《信经》以如下结尾：「我盼望（也就是『带着耐心和急切』地期待）死人的复活和来世的生命。阿们。」重复这个祷告，并且，请你们不要让任何人从我们这里窃取我们在圣堂中所诵念的真正意义！当我们说「我们的父」时——这是个可畏的词语——并且祂真实临在的感觉降临时，我们确实感到自己是如此的卑微，如此的渺小！当我们诵念「我盼望死人的复活」这些词语时，这盼望中蕴含着使我们复活的活生生的力量——信德的力量。如此，在我们这些修士面前，每天都摆着同一个任务，无论我们的生命持续多久。如果我们明智而自觉地生活在上帝的圣容面前，那么我们将获得上帝真实的作为——恩典。
  - type: paragraph
    text:
      ru: 'Я благодарен Богу за то, что Он привел меня к ногам блаженного отца нашего Силуана. Я помню всегда его житие, в котором есть очень замечательные минуты, моменты. Подумайте: у безграмотного отца в бедной русской деревне мальчик четырех лет слушал слова книгоноши, который не верил в Бога, и спрашивает отца: «Как ты меня учишь молиться, а вот он говорит, что Бога нет?» Безграмотный мальчик в бедной крестьянской русской семье – и вдруг такая мысль! И отец, исполненный мудрости, отвечает: «Не слушай его, этого книгоношу, он глупый (отец сказал просто: «дурак»), а я думал, что он ученый и начитанный человек». Прошло пятнадцать лет, и вдруг Силуан слышит от кухарки их артели, которая ходила в Сезеново на могилу подвижника Иоанна Сезеновского, что тот был святым. И некоторые из стариков повторили: «Да, это был святой человек». И в уме и сердце Силуана возникла мысль: «Если он святой, то Бог с нами». И через эту наивную формулу вдруг он исполнился благодати[97]...'
      cn: 我感谢上帝，祂引导我来到我们真福西路瓦长老的脚下。我总能记得他的生平，其中有许多非常奇妙的时刻和瞬间。你们想想看：在一个贫穷的俄罗斯村庄里，一个不识字的父亲家里，一个四岁的男孩听了一个不信上帝的书贩的话，他问父亲：「您教我祷告，可是他却说没有上帝？」一个贫穷俄罗斯农民家庭里不识字的男孩——突然间竟然有了这样的想法！而父亲，充满智慧地回答说：「不要听他的，这个书贩的，他是愚蠢的（父亲直接说：「蠢货」），而我原以为他是个有学问、饱读诗书的人。」十五年过去了，西路瓦突然从他们劳动队的厨娘那里听到，那个厨娘曾去塞泽诺沃瞻仰塞泽诺沃的苦修者约安的坟墓，说约安是一位圣人。接着，一些老人也附和说：「是的，那是一位圣人。」于是西路瓦的心中和头脑里浮现出一个念头：「如果他是圣人，那么上帝就与我们同在。」而通过这个天真的公式，他突然间就充满了恩典[97]...
  - type: paragraph
    text:
      ru: 'Как-то раз с другими товарищами по роте он был в Петербурге, в столичном трактире, где играла музыка, где было много света. Они заказали себе хороший ужин с водкой и весело беседовали. А Силуан молчал. Тогда один из товарищей говорит: «Симеон (как звали тогда Силуана), ты почему молчишь?» А Симеон отвечает: «Сейчас мы сидим здесь, слушаем музыку, пьем водку, а я думаю об Афоне: сегодня всю ночь там будут молиться. Какой ответ дадим мы на Страшном Суде – и какой они?» И один из солдат говорит: «Какой человек этот Симеон. Мы здесь веселимся, пьем водку и слушаем музыку, а он умом на Афоне и на Страшном Суде».'
      cn: 有一次，他和连里的战友们在彼得堡，一个首都的酒馆里，那里有音乐演奏，灯火通明。他们点了一份丰盛的晚餐和伏特加，愉快地交谈着。而圣西卢安却沉默不语。于是其中一个战友说：「西缅（当时圣西卢安的名字），你为什么不说话？」西缅回答说：「我们现在坐在这里，听着音乐，喝着伏特加，而我却在想着阿索斯山：今天晚上，那里的人将彻夜祷告。在可怕的审判中，我们将如何作答——而他们又将如何作答？」于是其中一个士兵说：「西缅这个人真是了不起。我们在这里寻欢作乐，喝着伏特加，听着音乐，而他的心思却在阿索斯山和可怕的审判上。」
  - type: paragraph
    text:
      ru: 'Эту историю я привожу как бы в продолжение того, о чем мы уже говорили: как располагать нашим собственным умом. Когда мы читаем Евангелие, то, по слову апостола Павла, мы должны мыслить о том же и так же, как мыслил и жил Сам Христос (см.Флп.2:5). А как Он жил? Возьмем любой пример. Когда Он был в Вифании в доме Марии, Марфы и Лазаря, Мария помазала драгоценным миром ноги Христа, воскресившего Лазаря (см.Ин.12:3). И Иуда соблазнился уже тогда, когда у Симона-фарисея Христос оставил женщину целовать Его ноги (см.Лк.7:37–50), – это был страшный момент для Христа. И во второй раз, когда было подобное проявление к Нему любви со стороны женских душ и сердец, ученики соблазнялись, а Иуда пошел предать Его (см.Ин.12:4, 13:2). Но что Господь думал, когда Мария возливала на Него это драгоценное миро: где был Его ум? – Он сказал Апостолам:«Она... предварила помазать тело Мое к погребению»(см.Мк.14:8). Судя по этому ответу, Он думал о предстоящих Ему страданиях и смерти.'
      cn: 我讲这个故事，可以看作是我们已经谈过的话题的延续：关于如何安排我们自己的心思。当我们阅读福音书时，根据使徒保罗的话，我们应当思想基督自己所思想的，并以祂所生活的方式去生活（参见腓立比书 2:5）。那么祂是如何生活的呢？让我们举一个例子。当祂在伯大尼马利亚、马大和拉撒路的家里时，马利亚用宝贵的香膏涂抹了使拉撒路复活的基督的脚（参见约翰福音 12:3）。犹大早在那时就因此跌倒了，就是在法利赛人西门家里，基督允许一个妇人亲吻祂的脚时（参见路加福音 7:37-50）——这对基督来说是一个可怕的时刻。而第二次，当女性的心灵和心意向祂表达爱时，门徒们跌倒了，而犹大则去出卖了祂（参见约翰福音 12:4，13:2）。但是，当马利亚把这宝贵的香膏浇在祂身上时，上主在想什么呢？祂的心思在哪里呢？——祂对使徒们说：「她……是为我的安葬预先膏抹我的身体」（参见马可福音 14:8）。从这个回答来看，祂思想的是祂将要来临的苦难和死亡。
  - type: paragraph
    text:
      ru: Когда на нас нападают мелкие страстные помыслы, мы должны научиться переходить умом в мир Божественный, который открылся нам через Иисуса Христа и Духа Святого. Хранить наш ум постоянно в Боге – вот что нужно нам, монахам. Так мы должны жить и научиться этому. Поэтому монашеская жизнь организована таким образом, что все вращается около храма и в храме, удерживая мысль нашу в Боге.
      cn: 当细小的私欲意念侵袭我们时，我们必须学会让心神进入神性的世界，这世界是藉着耶稣基督和圣灵向我们开启的。将我们的心神恒常地安住在上帝之中——这正是我们修士所需要的。我们就当如此生活，并学会如此。因此，修士生活便如此安排，以致于一切都围绕着圣堂并在圣堂中运转，将我们的意念持守在上帝之中。
  - type: paragraph
    text:
      ru: Мы, как маленькие дети, стоим на берегу великого безбрежного океана и робко лазаем и ныряем в мелкие прибрежные воды. Так и сейчас мы хотим погрузиться в эти воды океана. Но у берега вода та же самая, что и где-то далеко.
      cn: 我们如同孩童，立于浩瀚无垠的海洋之滨，怯生生地爬入或潜入那浅滩之水。如今，我们亦渴望浸入这海洋之水。然而，岸边的水与远处深广之水，实为同一。
  - type: paragraph
    text:
      ru: 'Всякий раз, когда плотские помыслы или житейские заботы снижают нас до земли и даже до раздражения против брата или сестры, как нам восставать? – Мы должны держать ум свой в Боге и помнить о Страшном Суде. Тогда вся наша жизнь и всякий момент ее проходят в совершенно иной атмосфере. Это развивает в нас ответственность пред Богом, сотворившим все – весь этот Космос, и пред всем созданием Божиим. От маленьких действий наших каждый день результат будет тот, что Дух Святой может прийти к нам. Об этом прп.Исаак Сиринсказал: «Очисти место, и придет Дух Святый, и научит»[98]. Так Дух Святой учит и тех безграмотных мужиков, каким был отец старца Силуана и сам прп. Силуан. Имея такие примеры, и мы попробуем жить каждый день в этой атмосфере, и тогда мы получим искомое.'
      cn: 每当肉体的意念或世俗的忧虑将我们拉低到世俗，甚至使我们对弟兄或姐妹感到恼怒时，我们当如何才能重新振作起来呢？——我们当将我们的心智持守在上帝之中，并谨记末日审判。那么，我们的一生及其每个瞬间便会在一种截然不同的氛围中度过。这会在我们里面培养出对上帝的责任感，祂创造了万有——整个宇宙，以及对上帝所有受造物的责任感。我们每天细微的行动，其结果将是圣灵得以来到我们这里。关于这一点，圣伊萨克·叙利亚人（可敬者）说：「洁净其处，圣灵必来，且必教导。」[98] 如此，圣灵也教导那些不识字的农夫，就像圣西卢安长老的父亲，以及圣西卢安长老本人（可敬者）一样。鉴于这些榜样，我们也当尝试每天生活在这样的氛围中，那么我们就会得到所寻求的。
  - type: paragraph
    text:
      ru: 'Многим людям тяжело поверить в это. Странным образом они не понимают этого чуда – из земли взят человек и о чем думает этот человек: он забывает Землю и живет духом в вечном Боге! Это уже есть чудо. Даже в молитвах и в словах Откровения Божиего говорится о человеке: «От земли взят еси и в землю отыдеши» (ср.Быт.3:19). И вот эта «земля» мыслит то, о чем мы беседуем сегодня.'
      cn: 许多人难以相信这事。奇怪的是，他们不明白这个奇迹——人是从尘土而出，他所思所想的，竟是忘记尘土，并以灵活在永恒的上帝里！这本身就是一个奇迹。甚至在祷告中以及上帝启示的话语中，都谈论到人：「你从尘土而来，也必归于尘土」（创世记 3:19）。而这「尘土」所思考的，正是我们今天所谈论的。
  - type: paragraph
    text:
      ru: 'Вы знаете, что я говорю без всякого приготовления, что все мое приготовление только в молитве. И какое слово я вам скажу, сам не знаю заранее. Но есть у нас одна основная цель: все-таки мы должны преодолеть присутствие в нас смерти. Итак, человек, из земли взятый, получает дыхание от Творца и является живою душою, а потом – и подобным Сыну Божию воплощенному: персоной, ипостасью. Пожалуйста, прошу вас, удержите этот принцип.'
      cn: 你们知道，我说话没有任何准备，我所有的准备都只在祷告中。至于我会对你们说什么，我自己也不知道。但我们有一个基本的目标：那就是我们终究要克服我们里面死亡的存在。所以，人，从尘土中被取出的，领受了造物主的呼吸，并且成为一个有生命的魂，而后，并且相似于道成肉身的上帝之子：一个位格，一个位体。请你们持守这个原则。
  - type: paragraph
    text:
      ru: Сейчас мы беседуем о том, как управить наш ум, чтобы он непрестанно был в Боге. Жизнь человека становится тогда такой, как будто кто-то его приподнял немножко на воздух и привязанным держит над землею. Во всяком случае, я испытываю такое ощущение. Сам я подняться не могу, но кто-то другой меня подымает. И создается такое чувство, что мы живем как бы привязанные...
      cn: 我们现在讨论如何管理我们的心智，使它能持续不断地在上帝之中。那时，人的生命会变得如此，仿佛有人将他稍微托起，悬于空中，并将其系住，使之浮于地面之上。无论如何，我体会到这种感受。我无法自行提升，但有另一个人将我提升。于是产生这样一种感觉，我们仿佛被系住般地生活着……
  - type: paragraph
    text:
      ru: Не мышление отвлеченное о Боге, а постоянное чувство нашей связи с Ним является одной из начальных целей нашего подвига. В одной из наших последующих бесед, если Бог благоволит, будем говорить о том, какой результат явится в нашем духе от того, что мы помним о Страшном Суде. Видя, насколько мы не соответствуем заповедям Бога, мы не решаемся даже глядеть на Небо. Но и отказаться от этого мы не можем. Когда мы думаем о Страшном Суде, то видим себя, какие мы низкие, все время живем на земле:«Человек, яко трава... яко цвет сельный, тако отцветет»(Пс.102:15). Но придет Дух Святой к нам и даст нам то, о чем мы с такой тайной любовью думаем каждый день и каждый час.
      cn: 并非对上帝抽象的思考，而是我们与祂之间持续不断的联结感，是我们修持的最初目标之一。在我们接下来的某次谈话中，若上帝恩准，我们将讨论，当我们记念可畏的审判时，这将在我们的灵魂中产生何种结果。当我们看到自己何等不符合上帝的诫命时，我们甚至不敢仰望天国。但我们也无法放弃这一切。当我们思想可畏的审判时，我们看见自己是何等卑微，始终活在地上：「人如草芥……如野花般开谢」(诗篇 102:15)。但圣灵将降临我们，并赐予我们那我们每天每时都以如此隐秘的爱所思念的一切。
  - type: paragraph
    text:
      ru: 'Через покаяние в нас рождается особая благодать: сожаление о чем бы то ни было, соделанном нами в жизни нашей повседневной. Покаяние должно быть единственным путем нашим к Богу. Покаянию свойственно возрождать нас и делать подобными Самому Христу. Однако в меру Его мы не достигаем. И, таким образом, покаяние на Земле не имеет конца[99].'
      cn: 借着悔改，在我们里面生出一种特殊的恩典：对我们日常生活中所行的任何事物的懊悔。悔改应当是我们通往上帝的唯一道路。悔改有其特性，即使我们重生，并使我们变得像基督本身。然而，我们无法达到祂的程度。因此，世上的悔改没有终点[99]。
  - type: paragraph
    text:
      ru: Итак, наша задача – смотреть внимательно за собой и не дать никому восхитить наш ум в другие сферы, кроме того Бытия, которое принес нам Господь Иисус Христос от Отца Своего.
      cn: 因此，我们的任务是仔细看顾自己，不让任何人把我们的心神夺入其他的领域，除了那由主耶稣基督从祂的父那里为我们带来的存有。
  - type: paragraph
    text:
      ru: Вы видите, как я обессилел от старости и от болезней – я сам это понимаю. Но когда мы беседуем с вами, то слово сводится не к красноречию и не к тому, чтобы говорить о чем-то как поэты, нет! Наша жизнь простая, однако постоянно в Боге.
      cn: 您看见我因年迈和疾病而力衰，我自己也明白这一点。但当我们与您交谈时，我们的话语并非雄辩辞藻，也并非像诗人那样谈论什么，不！我们的生活简朴，然而却恒常在上帝之中。
  - type: paragraph
    text:
      ru: 'Теперь я укажу только маленький практический способ, как переходить умом на мысль богоугодную. Когда нам приходит какая-нибудь мысль, которая не соответствует закону Евангельскому, мы говорим: «Господи, исцели мой ум». Когда в сердце нашем появляются раздражение или подобное, мы говорим: «Господи, исцели мое сердце». Это принимает общий характер борьбы, и мы безгласно, но кричим внутренно: «Господи, исцели всего меня... Приди ко мне, лежащему на земле, и воздвигни меня от моих низких мыслей и страстей, от низких движений сердца моего!» Так проходит наша борьба.'
      cn: 现在我只指出一个微小而实用的方法，如何让心思转向蒙上帝悦纳的念头。当任何念头临到我们，不符合福音律法时，我们便说：「主啊，医治我的心思。」当我们的心中出现烦躁或类似情绪时，我们便说：「主啊，医治我的心。」这便成了我们普遍争战的特征，我们无声地，却在内心呼喊：「主啊，医治我的全人……愿祢降临我这仆倒在地之人，并从我低下的念头和情欲，以及我心中低下的冲动中，将我扶起！」我们的争战就是这样进行的。
  - type: paragraph
    text:
      ru: 'И какую бы работу мы ни делали, когда мы любим Бога, тогда память о Боге пребывает в нас неотступной. Силуан говорил: «Любить Бога не мешает никакая работа»[100].'
      cn: 无论我们做什么工作，当我们爱上帝时，对上帝的记念就持续不断地常在我们心中。西路亚长老说：「爱上帝，任何工作都不会阻碍。」[100]
  - type: paragraph
    text:
      ru: 'Другой монах отец Серафим мне сказал: «Нет такой работы, которая бы унижала человека!», то есть даже если это скромная работа: чистить дом, варить кашу, мыть посуду или что-нибудь в этом роде. Нет ничего в этих работах, что унизило бы человека. Унижает человека только грех.'
      cn: 另一位修士塞拉芬神父对我说：「没有哪种工作会贬低一个人！」也就是说，即使那是一份卑微的工作：打扫房屋、煮粥、洗碗或诸如此类。这些工作中没有什么会贬低一个人。唯有罪会贬低人。
  - type: paragraph
    text:
      ru: 'Я помню один урок этого монаха отца Серафима. Его келья была недалеко от моей, и я нередко проходил мимо него. Мы встречались довольно часто. Один раз я был болен. Он увидел меня и говорит:'
      cn: 我记得这位修士塞拉芬神父的一个教训。他的小室离我的不远，我也不时从他旁边经过。我们见面相当频繁。有一次我病了。他看见了我，便说：
  - type: paragraph
    text:
      ru: – Смотрю я на тебя. Ты скоро умрешь.
      cn: – 我看着你。你快死了。
  - type: paragraph
    text:
      ru: 'Я спросил:'
      cn: 我问：
  - type: paragraph
    text:
      ru: – А как скоро?
      cn: – 那多快呢？
  - type: paragraph
    text:
      ru: – Я полагаю, – отвечает он, – что тебе только два года жить.
      cn: 「我猜想，」他回答说，「你只有两年可活了。」
  - type: paragraph
    text:
      ru: – Отче Серафиме, – я ему говорю, – значит, вы меня не считаете монахом?
      cn: ——塞拉芬神父，——我对他说，——那么，您不认为我是个修士吗？
  - type: paragraph
    text:
      ru: – Почему ты так говоришь?
      cn: – 你为什么这么说？
  - type: paragraph
    text:
      ru: – Я боюсь, что вы меня вводите в заблуждение, потому что я думаю каждый день о смерти, а вы мне говорите – два года я буду жить еще.
      cn: ——我害怕，您在误导我，因为我每天都想着死亡，而您却告诉我——我还有两年可活。
  - type: paragraph
    text:
      ru: 'Тогда он ответил:'
      cn: 于是他回答说：
  - type: paragraph
    text:
      ru: '– Если бы я сказал тебе: «еще шесть лет», и тогда не хватит нам дней для покаяния.'
      cn: ——如果我对你说：「还有六年」，那时，我们的日子就不够用来悔改了。
  - type: paragraph
    text:
      ru: 'Так он сумел ответить достойно на мой «укор». Было бы интересным рассказывать о многом из того, что мне пришлось пережить на Афоне. У меня была своя забота: как мне перемениться всем моим существом, чтобы стать действительно христианином. Но если бы я был писателем и записывал бы все случаи и беседы, то даже в мое время на Афоне можно было бы написать Патерик нисколько не хуже, чем древние Патерики. Но об этом уже не приходится жалеть.'
      cn: 于是，他得以合宜地回应我的「指责」。若要讲述我在阿索斯山所经历的许多事情，会是件有趣的事。我有我自己的挂虑：我该如何使我的整个存有都转变，以便真正成为一个基督徒。但若我是一位作家，并且记录下所有的事例与谈话，那么即使在我身处阿索斯山之时，也能写出一部丝毫不会比古代教父言行录逊色的教父言行录。但对此已经无需感到遗憾。
  - type: paragraph
    text:
      ru: 'Со мною был такой случай. Мне как-то пришлось побывать в женском монастыре вLouvainв Бельгии. Когда я ехал туда, то было странное ощущение: у меня не было никакого слова к тем монахиням, с которыми мне предстояло говорить. По моем приезде собралось довольно большое количество монахинь и даже пришла старая игуменья, и все ждали от меня слова. Я сказал им: «У меня нет никакого слова, никакой мысли, но если вы хотите, чтобы мы беседовали о чем-либо актуальном для вашей жизни, то задайте мне вопрос!» И одна из монахинь, которая была учительницей в школе, говорит: «Скажите нам слово о послушании». И когда я начал говорить о послушании, то прошло больше часу, я не мог остановить слово свое. И они все сидели как застывшие и внимательно слушали. Так, я иногда хотел бы, чтобы вы тоже мне поставили вопрос. Ибо, как опыт показал, когда мы читаем приготовленное уже слово, то в нем вдруг исчезает жизнь и оно перестает действовать. А когда оно рождается из самой нужды жизни, тогда оно обладает энергией, которая действительно может перерождать людей.'
      cn: 我曾有这样一次经历。我曾有一次，必须到访比利时鲁汶（Louvain）的一座女修道院。当我前往那里时，有一种奇怪的感觉：对于那些我将要与之交谈的修女们，我没有任何话语。我抵达后，相当多的修女聚集起来，甚至连年迈的院长也来了，所有人都期待着我说话。我对她们说：「我没有任何话语，没有任何想法，但如果你们希望我们讨论任何与你们生活息息相关的事情，那么请向我提问！」于是，其中一位在学校里担任教师的修女说：「请给我们讲讲关于顺服的话语。」当我开始谈论顺服时，一个多小时过去了，我无法停止我的话语。她们都如同凝固了一般，全神贯注地聆听着。因此，我有时也希望你们能向我提问。因为，正如经验所示，当我们阅读一篇已经准备好的话语时，其中的生命突然消失了，它便停止了作用。而当它从生命的真实需要中诞生时，它便拥有一种能量，确实能够使人得到重生。
  - type: paragraph
    text:
      ru: 'Так, я начал говорить монахиням о послушании: к чему оно приводит, как оно, будучи монашеским подвигом, вводит нас в поток Божественной воли. И конец сему подвигу – человек повторяет слова Христа: «Аз есмь». Тогда нам дается опыт Бытия, опыт «быть», а не просто «бывать»; и Бытие, исходящее от Бога Самого, становится нашей жизнью.'
      cn: 于是，我开始对修女们讲论顺从：它会引向何处，以及它作为一种修道苦修，如何将我们引入神圣旨意的洪流中。而这种苦修的终点是：人重复基督的话语：「我就是」。那时，我们被赐予存有的体验，即「是」的体验，而并非仅仅是「时而存在」；并且这源于上帝本身的存有，成为了我们的生命。
  - type: paragraph
    text:
      ru: Так и вы иногда помогайте мне... Пожалуйста, молитесь каждый за каждого и за всех. И все вместе да молимся мы о каждом человеке, о каждом брате...
      cn: 你们也如此，偶尔帮助我吧…… 请你们每个人都为彼此祷告，也为所有的人祷告。并且让我们大家一同为每一个人，为每一位弟兄祷告……
- type: heading1
  text:
    ru: 'Беседа 15: Наше спасение – в нашем единстве[101]'
    cn: 第十五讲：我们的救赎在于我们的合一[101]
  children:
  - type: paragraph
    text:
      ru: 'О рождении слова для присутствующих. О сочетании беспредельно великого с самым простым в нашей жизни. Праведнику закон не лежит: надо слушать голос Бога. О недоразумениях. Прп. Силуан – пример свободы от всякой конкуренции. Наше спасение – в единстве. От молитвы за монастырь до молитвы за всего Адама. Следуйте духовникам. О трудности при частичности понимания у некоторых. О сохранении общего принципа. О сверхобразной молитве. Трудно найти язык для слова.'
      cn: '关于话语在与会者中的生成。

        关于无限伟大者与我们生命中最朴素者的结合。

        律法不拘义人：当聆听上帝的声音。

        关于误解。

        圣西卢安长老——脱离一切竞争的自由之典范。

        我们的救赎，在于合一。

        从为修道院祷告，直到为全人类亚当祷告。

        遵从神师。

        关于某些人在部分理解时的困难。

        关于持守总体原则。

        关于超形相祷告。

        难以找到表达话语的语言。'
  - type: paragraph
    text:
      ru: Сегодня я попросил вас прийти на беседу нашу – внутримонастырскую.
      cn: 今天我请诸位来参加我们院内的谈话。
  - type: paragraph
    text:
      ru: 'Мы сейчас допускаем гостей на наши собрания, всегда очень интимные, как и интимна заповедь Божия. Я все время пытался вам объяснить, как рождается слово Божие в сердце человека. Этот процесс не так прост и вместе с тем очень ясен и чист. Каким образом вместо нашего страстного голоса услышать голос Бога нашего в сердце нашем? При всем невыразимо великом задании, стоящем пред нами, наша жизнь все-таки остается очень простою во внешнем проявлении своем. Когда были беседы наши в присутствии гостей, то, хотя мое слово обращается к новопришедшим, я заметил, что странным образом молитва о слове включает их. И включить их – это значит: изменить содержание беседы. Так что когда мы одни, то я свободнее держусь, несмотря на неодинаковые реакции и состояния людей, присутствующих здесь. Однако и в данном случае мы не освобождаемся совсем и не достигаем единства слова, поскольку наша беседа не может касаться одного и того же уровня для всех нас, ибо все мы стоим на разных уровнях.'
      cn: 我们现在允许客人参加我们的聚会，这些聚会总是非常亲密的，正如上帝的诫命是亲密的一样。我一直试图向你们解释，上帝的道是如何在人的心中诞生的。这个过程并不简单，但同时又非常清晰和纯净。怎样才能在我们的心中听到我们上帝的声音，而不是我们充满情欲的声音呢？尽管我们面前矗立着一项不可言喻的伟大任务，但我们的生活在其外在表现上仍然非常简单。当我们的谈话有客人在场时，尽管我的话语是针对新来的人，我注意到，奇妙的是，关于圣道的祷告也把他们囊括在内了。而把他们囊括在内——这意味着：改变谈话的内容。所以当我们单独在一起时，尽管在场的人们反应和状态各不相同，我仍会更自由地表达。然而，即便在这种情况下，我们也未能完全释放，也未能达到言语的合一，因为我们的谈话不可能触及对我们所有人来说都相同的层面， ибо我们都处于不同的层面。
  - type: paragraph
    text:
      ru: 'Особенно теперь, когда наш монастырь вырастает в значительно большую группу людей, для меня становится как бы необходимым снова и снова повторять вам: стройте этот монастырь своею молитвой, не забывая великой цели спасения, даже если в повседневной жизни вы делаете самые простые работы. Сие беспредельно великое с самым простым повседневным соединяются как-то естественно.'
      cn: 尤其现在，当我们的修道院壮大为一个规模大得多的人群时，对我而言，似乎变得有必要一次又一次地向你们重申：你们要以自己的祷告来建立这座修道院，莫忘救赎的宏伟目标，即使你们在日常生活中所做的是最朴实的工作。这无限伟大的事，与最朴实的日常事务，某种程度上是自然而然地结合起来的。
  - type: paragraph
    text:
      ru: Когда ум наш весь направлен к Богу, когда нет у нас другой жизни, кроме Бога, тогда мы освобождаемся от некоторых внешних форм, которые называются обычно «каноном» или «правилом». Правило, как нечто обязательное для повторения годами и десятилетиями, как показал опыт, остается все-таки и необходимым, и стесняющим. Апостол Павел просто говорит:«праведнику закон не лежит»(см.1Тим.1:9). Кто хочет быть движим Духом Святым, тот не должен быть связан и не может быть связан правилами.
      cn: 当我们的心思意念全然归向上帝，当我们除了上帝之外别无他生，那时我们便脱离了某些外在形式，这些形式通常被称为「规条」或「规则」。规则，作为数十年如一日必须重复之事，经验表明，它仍然既是必要的，又是束缚人的。使徒保罗直言：「律法不是为义人设立的」（提摩太前书 1:9）。凡愿被圣灵引导者，就不应受规条的束缚，也不能受规条的束缚。
  - type: paragraph
    text:
      ru: 'О чем бы я ни говорил в присутствии посторонних людей, я всегда склоняюсь к мысли – понимают ли они вообще монашество. Но монашество в сознании людей, надо сказать, далеко не соответствует подлинному величию этой культуры. Эта культура духа есть наш подвиг. Нам необходимо всем развиться до того, чтобы слышать безошибочно голос Господа. Этот подвиг требует постоянного, днем и ночью, внутреннего внимания. И так жизнь, простая по внешности, будет постоянным общением с Богом. Те, которые приходят извне, не могут увидеть настоящего процесса нашей жизни. Даже когда одни мы собираемся, все-таки мы не достигаем единства духа: не потому, что нет у нас желания, а потому, что у нас различный опыт. И каждый в пределах своего опыта понимает вещи.'
      cn: 无论我在外人面前谈论什么，我总是倾向于思考——他们是否真正理解修道生活。但必须说，修道生活在人们的意识中，远远不符合这门文化的真正伟大之处。这种灵性文化是我们的苦修。我们所有人都必须成长到能够无误地听见主的声音。这项苦修要求持续不断地，日夜不息地保持内在的警醒。如此，这在外表上简朴的生活，将会是与上帝持续不断的交通。那些从外面来的人，无法看见我们生命中真实的进程。甚至当我们独自聚会时，我们仍然未能达到灵性上的合一：这并非因为我们缺乏意愿，而是因为我们的经验各有不同。并且每个人都在自己经验的范围内理解事物。
  - type: paragraph
    text:
      ru: Что касается новопришедших, мы узнаем в них родных нам по духу людей. И, конечно, задачей нашей является включить их в нашу жизнь, чтобы община наша стала как бы единым человеком.
      cn: 至于新来的人，我们认出他们是我们在灵里的亲人。当然，我们的任务是将他们融入我们的生活，使我们的团体仿佛成为一个整体的人。
  - type: paragraph
    text:
      ru: 'Когда мы усваиваем эту мысль, тогда устраняется страшно много разных недоразумений. Тогда исчезает некое «соревнование», и всякое благое дело, всякое доброе слово строит наш монастырь, укрепляет его. И, наоборот, всякое слово, которое есть проявление нашей немощи, наших страстей, а не Божественной воли, разрушает монастырь. Помните это, пожалуйста! Я вынуждаюсь говорить вам об этом усиленно, потому что, как это ни странно, у меня нет еще чувства такого, что все вы делаете так, как я вас прошу, – то есть молитесь за всех и каждого, и за общую нашу жизнь, и за каждого человека. Если бы вы приняли мою мысль, то жизнь наша потекла бы совсем иначе. Я пытаюсь получить слово, чтобы объяснить яснее мою мысль. И скажу правду: я сейчас не имею такого слова. Ибо еще не достигли мы сознания, что в жизни монастыря общежительного выражается идеальная форма человеческой жизни на Земле.'
      cn: 当我们领会了这一思想，就能消除极其多的各种误解。于是，某种「竞争」便会消失，每一个善工，每一个善言，都在建立和巩固我们的修道院。反之，每一个言语，凡是表现出我们的软弱、我们的私欲，而非上帝的旨意的，都会毁坏修道院。请诸位记住这一点！我不得不竭力向你们讲明这一点，因为，尽管这听起来很奇怪，我还没有那种感觉，认为你们所有人都按照我所要求你们的去做——也就是说，为所有的人和每一个人祈祷，也为我们共同的生活祈祷，也为每一个人祈祷。如果你们接受了我的想法，那么我们的生活就会全然不同。我试图寻得一个词语，以便更清楚地解释我的想法。我说实话：我现在还没有这样的词语。因为我们还没有达到这种意识，即在共住制修道院的生活中，体现着人类在世上理想的生活形式。
  - type: paragraph
    text:
      ru: 'Возьмем пример из слов бесконечно дорогого для нас отца нашего духовного Силуана. Он говорит, что есть некоторые, которым поручается послушание быть царем, другим – быть патриархом, третьим – выполнение какой-нибудь работы менее общей, специальной, и, наконец, даже быть простым плотником. И дальше он пишет: «И все это неважно»[102]. Вы видите свободу этого человека от всякой зависти, от всякой конкуренции, от всякого отталкивания.'
      cn: 让我们以我们无限敬爱的灵性之父圣西卢安的话语为例。他指出，有些人被赋予顺从的使命去作君王，另一些人作宗主教，还有一些人则去完成一些不那么普遍，而是特殊的工作，最后，甚至作一个普通的木匠。他接着写道：「所有这一切都无关紧要」[102]。你们看到这个人免于一切嫉妒，免于一切竞争，免于一切排斥的自由。
  - type: paragraph
    text:
      ru: Да поможет мне Бог разъяснить эту мысль. Когда через молитву вашу за всех и каждого вырастет в вас это сознание – необходимости нашего единства в Боге, тогда вы встанете на путь истинный. Вы можете молиться и в келье, вы можете молиться и во время наших служб. Постоянно молитесь! Я пытался написать это и в моих книгах, начиная с первой, которая есть самая важная, – о святом Силуане. Когда всякий выполняет свою работу согласно его дарованиям, тогда исчезает повод к какой бы то ни было конкуренции, или зависти, или еще чего-нибудь подобного. Каждое доброе дело, кем бы оно ни было сделано, станет нашей жизнью, если мы спасемся.
      cn: 愿上帝助我阐明此思。当你们为众人及每个人代祷，借此祈祷，你们心中生发出我们在上帝里合一之必要性的意识时，那时你们便行在真道上。你们可以在修道室中祈祷，也可以在我们的礼仪期间祈祷。恒常祈祷！我曾试图在我的书作中将此写下，始于第一本，那也是最重要的一本——关于圣西卢安的。当每个人都依照他所蒙的恩赐各尽其职时，那时导致任何竞争、嫉妒或类似事物的缘由便会消失。倘若我们得救，每一件善行，无论由谁完成，都将成为我们的生命。
  - type: paragraph
    text:
      ru: 'Да поможет мне Господь найти слова, а вам да поможет Господь унаследовать некоторые начала великой культуры, я бы сказал, величайшей из всех культур, которые ведомы человеку на Земле. Я с удовольствием слышал слова одного из новых членов нашего братства, который сказал: «Жить вместе требует большой мудрости от каждого из нас». Молодой человек, молодая душа, но вот, понял он, что это совсем не малая вещь. Подумайте, Господь говорит ученикам Своим: «Если вы имеетелюбовь между собою, товы Мои ученики, и всякий узнает в вас, что вы таковые, то есть Мои ученики» (см.Ин.13:35). Отсюда, пожалуйста, поймите чрезвычайную важность – перешагнуть некоторый эгоизм. Все, что бы ни было сделано, – все должно войти в нашу спасенную жизнь. И если у нас есть это сознание, тогда вы увидите, что жизнь течет совсем иным порядком. На Земле более четырех миллиардов людей. Но вот нам Господь дал быть маленькой группой людей, собранных через единство нашей веры во Христа Иисуса. И эта малая часть человечества от всего человеческого тела пусть будет заботой каждого из вас: это – моя семья, это – моя жизнь, и все, что я делаю, – я делаю для того, чтобы укрепить эту жизнь. Из единства, и крепкого единства между нами, родится великое спасение. Пожалуйста, усвойте этот принцип, усвойте это начало, усвойте это правило! И так судите о самих себе: если мы живем в малой группе людей и у нас остаются элементы какого-то сравнения с другими, конкуренции, компетиции и т. п., то мы еще не на добром пути. Боритесь с этим элементом, который разделяет наши жизни.'
      cn: 愿上主帮助我找到合适的言辞，也愿上主帮助你们继承一些伟大文化的基石，我会说，它是世上人类所知一切文化中最伟大的。我欣然听到我们团契中一位新成员的话，他说：「同居共处需要我们每个人有极大的智慧。」 一个年轻人，一颗年轻的灵魂，但他明白了，这不是一件小事。思想一下，上主对祂的门徒们说：「你们若彼此相爱，众人因此就认出你们是我的门徒了，即是说，是我的门徒了。」（约翰福音 13:35）因此，请理解其极其重要性——去超越某些自私。凡所行的，一切都应当进入我们已蒙拯救的生命。倘若我们有此意识，那么你们会看到，生命以完全不同的方式流淌。世上有超过四十亿人口。但上主却让我们成为一小群人，借由我们对基督耶稣的信仰而合一。愿人类这个整体中的这一小部分，成为你们每个人的关切：这是我的家庭，这是我的生命，凡我所行的，都是为了巩固这生命。从我们之间的合一，以及坚固的合一中，将会诞生伟大的救赎。请领受这一原则，领受这一开端，领受这一规条！并且这样审察你们自己：倘若我们生活在这一小群人中，而我们仍存有与他人比较、竞争、较量等因素，那么我们尚未走在正确的道路上。抵制这个因素，它正分裂着我们的生命。
  - type: paragraph
    text:
      ru: Каждый человек, при всей своей неповторимой персональности, все-таки является как бы представителем определенного класса или рода людей. И когда мы научимся в этих монастырских пределах единству, тогда я буду благодарен Богу и тогда мой долг будет исполнен пред вами. Итак, если вы в молитве за жизнь нашего монастыря достигнете того, что она, наша жизнь, пусть отчасти, но все-таки будет сообразной заповедям Христа, то раскроет Бог перед нами двери – и мы сможем вместить в наше сердце уже несравненно большее число людей и с несравненно большею любовью.
      cn: 每个人，尽管他拥有其独一无二的个性，却仍然可说是代表着某一类或某一种人。而当我们在这修道院的范围之内学会了合一，那时我将向上帝感恩，我对你们的职责也将完成。因此，如果你们在为我们修道院的生命祈祷时，能使其达到，即我们的生命，即使是部分地，但仍将符合基督的诫命，那么上帝就会在我们面前敞开大门——我们就能以无与伦比的爱，将远超以往数量的人容纳进我们的心中。
  - type: paragraph
    text:
      ru: 'В чем трудность моего положения? – Я поставил для себя невозможную задачу – быть проводником духа нашего духовного отца Силуана. Сам я не достигаю его состояния. Но я хочу, чтобы все вы достигли именно состояния Силуана: не какого-то интеллектуального, просто отвлеченного мышления, а реального состояния нашего духа. Отсюда, в силу этой любви к каждому члену нашей семьи, рождается желание послушать всякого другого человека.'
      cn: 我的处境有何难处？——我给自己设定了一个不可能的任务——成为我们的神父圣西卢安的灵的引导者。我自己尚未达到他的境界。但我希望你们所有人都达到的正是圣西卢安的境界：不是某种智性的、仅仅是抽象的思维，而是我们灵的真实状态。由此，因着对我们家庭中每一个成员的这份爱，便产生了倾听每一个人的愿望。
  - type: paragraph
    text:
      ru: 'Мы не можем избежать законов общественной жизни человечества на Земле. И одно из их проявлений есть то, что, молясь за всех, мы в большей степени молимся за тех, на кого пала большая ответственность, то есть за игумена и за духовника. Попробуйте иметь в сознании своем мысль: «Такого игумена и таких духовников дал нам Бог». И учитесь постепенно следовать им, так, чтобы совесть наша действительно не укоряла нас ни в чем. И тогда придет извещение от Духа Божиего, что мы спасаемся. Старец Силуан сказал об этом в таких словах: «Я стал делать, как научил меня Господь, и ум мой очистился, и Дух свидетельствовал спасение»[103].'
      cn: 我们无法避免人类在地上社会生活的法则。而它们的一个表现是，为所有人祈祷时，我们更甚地为那些肩负更大责任的人祈祷，也就是说，为修道院院长和神师祈祷。试着在你的意识中持有这个念头：「上帝赐予我们这样的修道院院长和这样的神师。」并学习逐渐地顺从他们，这样，我们的良心就确实不会在任何事上谴责我们。这样，来自圣灵的告知就会到来，即我们得救了。圣西卢安长老对此说了这样的话：「我开始照着上主所教导我的去做，我的心智得以洁净，圣灵也见证了救恩」[103]。
  - type: paragraph
    text:
      ru: 'Что есть трудного в нашей церковной жизни? – Часто люди, занимающие ответственные места, настаивают на своем частичном понимании как на чем-то окончательно совершенном и отвергают все другое. Но вот апостол Павел пишет, что хотя есть разные служения у людей, но все должно быть по Богу и приводить к единству и к любви (см.1Кор.12:6след). Всякое появление разделения нарушит нашу жизнь и не даст нам спасения. Если мы просим Бога в молитве о чем-либо и кто-то другой, а не мы, «реализовал» эту молитву, то мы отвергаем всякую идею «почему не я?». Бог услышал мою молитву и сделал то дело, о котором я молился, хотя и кто-то иной реализовал его. И если это дело приводит к славе, то я не буду завидовать его славе. Пусть он получает славу за сделанное, а для меня важна реализация нашей общей цели. А цель наша – единство духа в вечном порыве любви в Боге вечном, когда не будет больше времени, согласно клятве Ангела в Апокалипсисе:«и клялся... Ангел... что временибольшене будет»(см.Откр.10:5–6). И тогда уже нет никаких колебаний, но вся жизнь – и Бога, и всех людей – есть моя жизнь, хотя я ничего не сделал. Вы понимаете этот оттенок: одно дело – «чтобы было по-моему», как диктует наша страсть честолюбия, или властолюбия, или стремления к доминации[104]; и другое – когда человек свободен от этого стремления к доминации, и кто бы ни сделал доброе дело – «да будет вечно благословенно Имя Бога нашего!».'
      cn: 我们教会生活中有什么困难呢？——那些身居要职的人常常坚持他们片面的理解，认为那是全然完美的，并否认其他一切。然而，使徒保罗写道，尽管人们有各种不同的服事，但一切都应按上帝的旨意，并且带来合一与爱（参见哥林多前书 12:6及以下）。任何分裂的出现都将扰乱我们的生活，并使我们无法获得救恩。如果我们在祷告中向上帝祈求某事，而「实现」这个祷告的不是我们，而是另一个人，那么我们就摈弃一切「为什么不是我？」的念头。上帝听到了我的祷告，并成就了我所祷告的事情，尽管是由他人来实现的。而如果这件事情带来了荣耀，我也不会嫉妒他的荣耀。让他因所做的而获得荣耀吧，而对我而言，重要的是我们共同目标的实现。而我们的目标是——在永恒的上帝中，在爱中永恒的激荡下达到精神的合一，当时间不再存在时，依照启示录中天使的誓言：「并起誓……天使……说，时间将不再有」（参见启示录 10:5-6）。到了那时，便不再有任何犹豫，而是所有生命——无论是上帝的，还是所有人的——都是我的生命，尽管我什么也没有做。你们明白这其中的细微之处吗：一件事是——「要按我的意思来」，正如我们野心、权力欲或支配欲的激情所支配的[104]；而另一件事是——当一个人摆脱了这种支配欲时，无论谁做了善事——「愿我们上帝的圣名永远蒙福！」
  - type: paragraph
    text:
      ru: Вы, может быть, скажете, что я говорю какие-то вещи, которые неясны, и надо было бы указать на конкретные случаи. Но, взяв конкретный случай, мы упускаем из виду сам принцип жизни.
      cn: 你们也许会说，我所说的一些事情并不清楚，并且应该指出具体的例子。然而，若我们只着眼于具体的例子，我们就会忽略了生命的根本原则。
  - type: paragraph
    text:
      ru: 'Как я пишу в книге: старец Силуан, наш отец духовный, держался такого правила – если ему было дано после видения Христа жить все человечество в сердце своем, то он хотел сохранить это на всю жизнь[105]. Так и мы, при наших слабостях, при нашей мысли о самих себе, должны как-то освободиться от всякого эгоизма... Я не думаю, что это дело можно совершить за несколько минут. Для этого надо много молиться, и страдать, и жить – так, чтобы это вошло в наше существо как его свойство и состояние...'
      cn: 正如我在书中所写：圣西卢安长老，我们的属灵父亲，持守着这样一条原则——如果在他得见基督之后，获准将全人类活在他的心中，那么他希望毕生保守这一点[105]。同样，我们，带着我们的软弱，带着我们对自己的思虑，必须以某种方式摆脱一切自私……我不认为这事能在几分钟内完成。为此需要多多祷告，并受苦，并且生活——好让这一切进入我们的存在，成为其固有的属性与状态……
  - type: paragraph
    text:
      ru: Я все время пытался говорить, прося Бога открыть вам настоящее содержание моего слова. Молитесь, и Бог вам откроет настоящий смысл того, что я сказал. Молитесь и старайтесь усвоить это.
      cn: 我一直都在努力地讲，恳求上帝向你们启示我所言说之话语的真实内容。你们要祷告，上帝就会向你们启示我所说之话语的真实意义。你们要祷告，并努力领会它。
  - type: paragraph
    text:
      ru: Когда мы говорим об конкретных образах в молитве, то, по существу говоря, мы молимся еще несовершенно. Молитва выше образов конкретных, это – чистый ум. Когда мы перейдем в другую сферу и будем жить уже вне времени и вне пространства, но сверхвременно и сверхпространственно, там не будет образов конкретных, а только – состояние, которое превосходит всякую форму. Вот почему так трудно говорить, выражая это нашим словом...
      cn: 当我们谈及祷告中的具体形象时，那么，从本质上说，我们仍在以不完全的方式祷告。祷告超越具体形象，它是纯粹的心智。当我们进入另一个领域，并生活在时间之外和空间之外，而是超乎时间与超乎空间时，那里将没有具体形象，而只有一种超越一切形式的状态。这就是为什么用我们的话语来表达它，是如此困难……
  - type: paragraph
    text:
      ru: Итак, пожалуйста, без того, чтобы это видели приходящие к нам, то есть не проявляя внешне, – молитесь постоянно и за пришедших, и за живущих, и вообще за все наше существо. И тогда молитва от простых вещей, маленьких и повседневных, постепенно будет восходить до молитвы о всем мире. Молитесь и за меня. Я тридцать лет молчал и только теперь, перед уходом, решаюсь говорить.
      cn: 那么，请您不让来访者看到，也就是说，不作外在显露，持续不断地祈祷，为了那些前来的人，那些活着的人，以及我们全部的存在。这样一来，祷告会从简单、细微、日常的事物，逐渐升华，直到为整个世界祈祷。也请为我祈祷。我沉默了三十年，而直到现在，在我即将离世之际，才敢开口。
  - type: paragraph
    text:
      ru: И пусть каждый из вас делает все, как для своей семьи. Отец или мать семьи живет всю семью в сердце своем, всех детей вместе, все условия общественные, а дети беззаботно заняты чем-нибудь частичным...
      cn: 愿你们每个人都像为自己的家庭一般，做一切事。家中的父亲或母亲，心中装着全家人，装着所有孩子，装着所有社会境况，而孩子们则无忧无虑地忙碌于某些局部之事……
- type: heading1
  text:
    ru: 'Беседа 16: Богопознание и становление персоны[106]'
    cn: 讲道 16：对上帝的认知与位格的形成[106]
  children:
  - type: paragraph
    text:
      ru: Молитва спасает от давления материи. Трагедия незнания Бога. О нищете духовной. О пределах возможностей твари. Персональность Абсолюта как основа богоподобия человека. О предвечном замысле Бога о человеке во Христе. Проблема повторения молитв. Боговидение как цель монашества.Ис.11:1–2. Проблема персоны еще не решена. Молитва о всем Адаме есть выражение персоны. Монашество и школы пророков. Об умалении измерений христианства. О двух родах смирения. О хранении вдохновения.
      cn: '祷告使人脱离物质的重压。

        不认识上帝的悲剧。

        论属灵的贫乏。

        论受造物的能力极限。

        绝对者的位格性是人肖乎上帝的基础。

        论上帝在基督里对人永恒的旨意。

        重复祷告的问题。

        瞻仰上帝作为修道生活的目标。(以赛亚书 11:1-2)

        位格问题尚未解决。

        为全体亚当的祷告是位格的表达。

        修道生活与先知学校。

        论基督教维度的缩减。

        论两种谦卑。

        论保守感动。'
  - type: paragraph
    text:
      ru: Снова сверх всяких ожиданий Господь дает мне радость быть с вами.
      cn: 再次，超乎一切预料，主赐予我与你们同在的喜乐。
  - type: paragraph
    text:
      ru: 'Какова наша жизнь на Земле? – Вся эта материя, которая окружает нас и поддерживает жизнь, заставляет нас слишком много внимания отдавать всему земному. И это постоянство давления нашей повседневности убивает ум, и он становится менее восприимчивым к тому, что мы же сами произносим. Мы сотни раз и тысячи раз повторяем: «Отче наш». Но живем ли мы это сознание – или сознание наше заполнено мелкими страстями? Или, скажем, слова «Царю Небесный» – здесь речь идет о Самом Боге Духе Святом. А как относится наше сердце к этим словам: «Царю Небесный, прииди и вселися в ны, настави ны на всякую истину, спаси души наша»? – Это крик души нашей. Сие не должно забыть никогда: надо, чтобы это было лейтмотивом нашей монашеской жизни.'
      cn: 我们在世上的生命是怎样的？— 环绕我们并维持生命的所有这些物质，使我们过于专注于一切属世之事。而我们日常生活中持续不断的压力，扼杀着心智，使其对我们亲口所说的话语变得不那么敏锐。我们重复了成百上千次：「我们的天父」。但我们是否活出这种意识——抑或我们的意识被琐碎的情欲所占据？又或者，我们来说「天上的君王」这句祷词——这里指的是上帝圣灵本身。而我们的心又是如何对待这些话语的呢：「天上的君王，求祢降临，住在我们里面，引导我们进入一切真理，拯救我们的灵魂」？— 这是我们灵魂的呼喊。这绝不可忘怀：它必须成为我们修士生活的基调。
  - type: paragraph
    text:
      ru: 'Мы – наследники величайшей и драгоценнейшей традиции. Отцы наши научили нас, как преодолевать ежедневные мелочи: всякое наше земное действие через молитву мы обращаем в духовное общение с Богом. Просыпаясь, мы молим Бога:«Восставь меня(ср.Пс.40:11) силою Твоею, благодатию Духа Святаго, на делание духовное; на то, чтобы никакая вещь не прервала моего чувства о Тебе, Боге моем!»... Мы начинаем одеваться и говорим: «Господи, Ты видишь, я обнажен от всякого ведения истины Твоея. Молю Тебя, не оставь меня обнаженным, но облачи меня светом познания Твоего, – Ты, Который живешь во Свете неприступном!» Начинаем мы умываться: «Господи, омый всякую скверну со всего тела жизни моей в мире сем». Промываем глаза и говорим: «Дай мне очи видеть Царство Твое, Свет Твой». Открываем дверь и говорим: «Покаяния двери отверзи мне, Жизнодавче. Утренеет дух мой к Тебе, Богу моему». И так все время. В этом наше маленькое дело, однако через это «маленькое дело» мы можем установить постоянную связь с Богом, Который есть Дух. Так постепенно прелагается наша повседневность, исполненная труда, усталости, скуки, уныния, болей, недоумений, страданий. И самое главное из этих страданий – неведение: «То, что я живу, – не есть Свет Божества... А Ты мне дай Свет Твоего познания!»'
      cn: 我们是这最伟大、最宝贵传统的继承者。我们的教父们教导我们如何克服日常琐事：我们借着祷告，将每一个世俗的行为都转变为与上帝的属灵交通。醒来时，我们向上帝祷告：「愿祢以祢的能力，借着圣灵的恩典复兴我（参阅 诗篇 40:11），去行属灵的事工；好使任何事物都不能打断我对祢，我的上帝，的感悟！」……我们开始穿衣时说：「上主啊，祢看见，我赤身露体，缺乏一切对祢真理的认识。我恳求祢，不要让我赤身露体，但愿祢以祢认识的光明将我披戴——祢，那位住在不可接近之光中的！」我们开始洗漱时说：「上主啊，洗净我今生在世生命整个躯体上的一切污秽。」我们清洗眼睛时说：「赐我眼睛，得见祢的国度，祢的光。」我们打开门时说：「赐生命者啊，为我敞开悔改之门。我的灵向祢，我的上帝，如朝曦般升起。」如此，一直如此。这就是我们的小小善工，然而借着这「小小善工」，我们能够与上帝——祂是灵——建立恒久的联系。如此，我们那充满了劳苦、疲惫、烦闷、沮丧、痛苦、困惑和苦难的日常生活，便逐渐地被转化。而在这些苦难中，最重要的是无知：「我之所活，并非神性的光……而祢，愿祢赐予我祢认识的光！」
  - type: paragraph
    text:
      ru: 'Недавно отец N., исполняя духовническое свое служение, услышал от одной женщины: «Я хочу знать, что хочет Господь. Я пришла сюда в монастырь, чтобы узнать это. Мне не нужно говорить ни о моей боли, ни о слабости, ни о крепости моей. Я хочу знать волю Божию, и тогда этого мне достаточно. Я жажду знать Бога, но я во тьме неведения, и это убивает меня». От этого неведения все мы страдаем.'
      cn: '最近，N长老在履行其属灵指导职责时，听到一位女士说：

        「我想知道主想要什么。我来到这修道院，就是为了知道这个。我不需要谈论我的痛苦，也不需要谈论我的软弱或刚强。我想知道上帝的旨意，这样就足够了。我渴望认识上帝，但我身处无知的黑暗中，这让我痛苦不堪。」

        我们都因这种无知而遭受痛苦。'
  - type: paragraph
    text:
      ru: К нам приходит больной человек со смертельной болезнью, и что мы будем делать? – Молиться! Происходит борьба в духе. Болезнь не только явление физиологическое, но и духовное испытание человека.
      cn: 一个身患绝症的病人来到我们这里，我们该怎么办？——祈祷！一场属灵的争战正在进行。疾病不仅是生理现象，更是人属灵的试炼。
  - type: paragraph
    text:
      ru: 'Итак, будучи созданными по образу и по подобию Божию, мы в этом мире все время страдаем, сознавая свою недостаточность, свое неведение. Я приближаюсь к концу своих дней – не знаю, как я живу, – и все равно: это страдание от неведения терзает и меня. Терзало меня это неведение с самого начала. И я думаю, что сие явление имеет себе отклик в словах Христа:«Блаженны нищие духом, ибо ваше есть Царствие Божие»(Лк.6:20). Еще Господь сказал: «Все вы, верующие в Меня,в миресембудете иметь скорби»(см.Ин.16:33). И одна из страшных скорбей – это не ведать волю Божию. Но если мы пришли в монастырь, в эту школу для вечной жизни, то пойдем путем отцов, которые во всю долготу дней своей жизни терзались нищетою духа. Ибо явление нам Бога во плоти поставило нас пред живым Абсолютом-Богом.'
      cn: 所以，我们既是按照上帝的形象和样式被造的，在这世上就无时不刻地受苦，觉察到自己的不足和无知。我已临近生命的尽头——我不知道自己是怎样活着的——然而：这种因无知而来的痛苦依然折磨着我。这种无知从一开始就折磨着我。我想，这现象在基督的话语中得到了回应：「福哉，神贫的人，因为上帝的国是你们的。」（路加福音 6:20）主还曾说：「凡信入我的人，在这世上必有苦难。」（参见约翰福音 16:33）而其中一个可怕的苦难，就是不晓得上帝的旨意。但如果我们来到修道院，这为着永生而设的学校，就当走教父们的道路，他们一生之久都为神贫所折磨。因为上帝以肉身向我们显现，把我们置于活生生的绝对者——上帝面前。
  - type: paragraph
    text:
      ru: 'Одно из наших недоумений, над которым работают сейчас тысячи и тысячи умов человеческих, – разрешить вопрос нашего происхождения: откуда человек, какие у него возможности, не безумство ли последовать за Христом, Который призывает нас быть с Ним в вечном Царстве как дети Отца Небесного (см.Ин.11:52) и, в этом смысле, братья Самого Христа.'
      cn: 我们所困惑的一个问题，就是现今成千上万的人类心智正在努力探究的，即解决我们起源的问题：人从何而来，他拥有怎样的可能性，以及跟随基督是否是狂妄之举——基督呼召我们与祂同在永恒的国度里，作为天父的儿女（参见约翰福音 11:52），并在此意义上，成为基督祂自己的弟兄。
  - type: paragraph
    text:
      ru: 'Прошлый раз мы говорили об иконе, на которой иконописец попытался выразить момент, когда великий пророк Моисей получил Откровение от Бога:"Аз есмьсущий»(см.Исх.3:14), – по-гречески: ΕΓΩ ΕΙΜΙ Ο ΩΝ. Это был ответ на жажду сего великого пророка. На иконе, написанной у нас, выражено напряжение пророка пред этим Откровением. И Господь наш Иисус Христос не отвергал сие Откровение, но восполнил его. Итак, что же замечательного в Синайском Откровении? – Тот, Кто сотворил весь этот мир, вдруг говорит: «ЭтоЯ», и представляется человеку, и говорит с ним.'
      cn: 上次我们谈到了一个圣像，在它上面，圣像画家试图表达伟大的先知摩西从上帝那里领受启示的那一刻：「我是那自有者」（参出埃及记 3:14），——希腊文：ΕΓΩ ΕΙΜΙ Ο ΩΝ。这是对这位伟大先知渴求的回应。在我们这里绘制的圣像上，表达了先知在这一启示面前的紧张。而我们的上主耶稣基督并未否定这一启示，而是使其得以圆满。那么，西乃山的启示有什么非凡之处呢？——创造了这整个世界的祂，忽然说：「是我」，并向人显现，且与人交谈。
  - type: paragraph
    text:
      ru: 'Сие слово«Я»означает, что Бог, сотворивший Своим повелением все космическое бытие и затем человека, есть Лицо –«Я(Аз) есмь». И когда мы читаем Библию, эту дивную книгу, первые страницы лежат ее в основе всего, вплоть до явления Христа и восполнения Откровения. Когда был сотворен весь мир, с животными и растениями, Господь сказал:«cотворим человека по образу Нашему [и] по подобию»(Быт.1:26). И так возник наш богословский вопрос о персоне: что значит персона? Наши греческие отцы нашли слово, которое восполняет понятие персоны другим именем, «ипостась» (лат. «субстанция»), то есть «база для всего, что существует». И что значит быть созданным по образу Божию и по подобию? Как мы можем стать персонами-ипостасями, подобными ипостаси воплощенного Сына Отчего? Должен сказать, что это есть та богословская проблема, о которой мы уже много раз говорили... Бог открылся нам как Персона:"Аз есмьсущий», и Он сотворил нас не так, как прочую тварь:«да будет свет... да будет твердь, и т.д. –и бысть свет... и бысть твердь, и т.д.» (см. Быт.1и след.), но создан был человек из чего-то уже существующего, – и это было завершением творения. После Откровения, восполненного Христом и Святым Духом, мы уже не ждем никакого другого.'
      cn: 「我」这个词语意谓，上帝，祂以自己的命令创造了整个宇宙万有，随后又创造了人类，是一位格——「我（阿兹）是」。当我们阅读圣经这本奇妙的书时，其最初的篇章乃是一切的基础，直至基督的显现与启示的圆满。当整个世界，包括动物和植物被创造之后，上主说：「我们要照着我们的形像、按着我们的样式造人」（创世记 1:26）。于是，我们关于位格的神学问题便产生了：位格是什么意思？我们的希腊教父们找到了一个词，它以另一个名称来补充位格这个概念，即「位格」（希腊语：ὑπόστασις，拉丁语：substantia），意谓「一切存有之基础」。那么，按着上帝的形像和样式被造又意味着什么呢？我们如何能成为位格——一个个具体的位格，类似于道成肉身之圣父之子的位格呢？我必须说，这正是我们已多次谈及的那个神学问题……上帝向我们启示祂自己是一位格：「我是自有者」，并且祂创造我们，并非像创造其他受造物那样：「要有光……要有穹苍，等等——就有了光……就有了穹苍，等等」（参看 创世记 1 章及后续经文），但人却是用某种已存在之物造的——而这是创造的完成。在基督和圣灵所圆满的启示之后，我们已不再期待任何其他的启示了。
  - type: paragraph
    text:
      ru: 'У нас возникает вопрос – как осуществить то, что нам открыто Богом: «Если Ты существуешь как Персона, как Ипостась, то как я могу уподобиться Тебе?»'
      cn: 我们产生一个问题——如何实现上帝向我们所启示的：『祢若以位格、以实有的形式存在，那我如何才能效法祢？』
  - type: paragraph
    text:
      ru: 'Когда это слово Откровения о Персоне дано нам, мы хотим познать его содержание, чтобы превратить наш подвиг в подвиг разумный:куда мы стремимся. Если мы не будем делать так и отдадим предпочтение повседневным заботам о еде, об одежде, о тепле, о комнатах, о встречах и так далее – всему, что на Земле каждый день окружает нас, то как мы можем через всю эту гущу психической и физической жизни проникнуть к абсолютному Духу? Кто-нибудь скажет: «Да, но Вы уже говорили нам об этом, и мы знаем». Но одно дело помнить эти слова, другое дело – реализовать их в нашем подвиге. Если в нас присутствует это напряжение – возвратиться к Богу после падения и стать воистину вечными детьми Отца Небесного, то мы неизбежно встречаемся с этими вопросами. И мы думаем: «Если Бог есть Персона, то как это Откровение отражается в нашем земном бытии?» Говорю «в нашем», потому что к нам относятся слова «по образу и по подобию», а не к прочей твари.'
      cn: 当这关于位格的启示之言赐予我们时，我们渴望明了其内容，以使我们的属灵操练成为有理性的修行：即我们所追求的方向。倘若我们不如此行，反而偏爱日常的忧虑，诸如衣食住行、会面等等——一切每日在地上环绕我们的事物，那么我们又怎能穿透这精神与肉体生活的稠密纷繁，抵达那绝对的灵？或有人会说：「是的，但您已向我们谈及此事，我们亦已明了。」然而，铭记这些言语是一回事，在我们的属灵操练中实现它们则是另一回事。倘若我们心中存在这份恳切——即在堕落之后归向上帝，并真正成为天父永恒的儿女，那么我们便无可避免地会遇到这些问题。于是我们思忖：「倘若上帝是位格，那么这份启示又如何在我们的尘世存在中得以体现呢？」我言「在我们的」，是因为「按着形像和样式」这句话是针对我们而言的，而非针对其他的受造之物。
  - type: paragraph
    text:
      ru: 'Когда мы говорим о том, как мы можем уподобиться и где пределы возможностей человека, то скажу вам не без боли, что человечество слишком несправедливо живет по отношению к Богу. Вот, святойГригорий Богословпишет: «Мы есть тварь, но тварь сия получила заповедь от Творца стать богом»[107]. Это призвание Бога нельзя, не должно забывать. Мы спрашиваем: до каких мер доходит наше подобие Богу? – И уже не в Ветхом Завете, а в Новом мы находим ответ в словах св. Иоанна Богослова:«мы... будем подобны Ему, потому что увидим Его, как Он есть»(1Ин.3:2). О, этот чудный Иоанн! Юноша, он ходил за Христом и осязал эту Истину руками, созерцал Ее глазами (см.1Ин.1:1)... И он говорит, что пока мы еще не достигли того состояния, которое нам заповедано, – но когда нам будет дано откровение от Духа Святого о том, как Бог есть, тогда мы станем подобны Ему... И все мы хотим знать, как Он есть (а не как Он не есть, не «неведомый Бог» (см.Деян.17:23)), и видеть, чтобы подражать Ему. Итак, нам даны эти слова драгоценнейшего сердцам нашим Иоанна Богослова:«Мы будем подобны Ему». В чем подобны? – В образе бытия, как и апостол Павел говорит про Христа:«будучи образом Божиим, Он принялобраз раба»(Флп.2:6–7)...'
      cn: 当我们谈论我们如何能与祂相似以及人能力的限度时，我会怀着不小的痛苦告诉你们，人类对待上帝的生活方式是多么不公。看哪，圣格列高利·神学家写道：「我们是受造物，但这个受造物从造物主那里领受了成为神的诫命。」[107] 上帝的这个呼召绝不能、也不应被遗忘。我们问道：我们与上帝的相似能达到何种程度？——答案并非仅限于旧约，而在新约中，我们在圣约翰·神学家的话语中找到了答案：「我们……将要像祂，因为我们必得见祂的真体。」(约翰一书 3:2) 哦，这位奇妙的约翰！他年少时就跟随基督，用手触摸这真理，用眼睛瞻仰这真理（参见约翰一书 1:1）…… 他说，我们尚未达到那受命要达到的境界，但当圣灵向我们启示上帝的真体时，那时我们就会与祂相似…… 我们都渴望知道祂的真体（而非祂不是什么，并非「未识之神」（参见使徒行传 17:23）），并能得见，从而效法祂。因此，我们拥有了对我们之心至宝贵的约翰·神学家的这些话语：「我们将来要像祂。」在何事上相似？——在存在的样式上，正如使徒保罗论及基督时所说：「祂本有上帝的形像，反倒取了奴仆的形像」（腓立比书 2:6-7）……
  - type: paragraph
    text:
      ru: Понимаете ли вы принцип монашеской жизни, когда целью монашеской науки есть «увидеть Бога,как Он есть»(1Ин.3:2)? Многие богословы говорят о невозможности для нас видеть Бога,«как Он есть». Но повторю опять перед вами слова – Господь сказал:«Блажени чистии сердцем, яко тии Бога узрят»(Мф.5:8). Читая богословов, идеи которых полны апофатизма, и читая эти слова:«блажени чистии сердцем», я думаю о том, чтобы очистить мое сердце от всякой мысли, неугодной Богу, от всякого движения сердца нашего, противного закону любви Отчей. Ибо когда сердце наше свободно от всякой злой мысли, тогда узрим мы Бога, «как Он не есть», по-богословски, или«как Он есть»? Для меня несомненно –«как Он есть». Иначе выходит абсурд:«Блажени чистии сердцем, яко тии Бога узряткак Он не есть». Получается, весь мир заблуждается, – весь мир верующих в то, что Бог сотворил космос? Есть и другие формы понимания Откровения Бога – нехристианские. Даже в библейском Ветхом Завете еще есть некая незрелость, и чаяние восполнения этого Откровения в сознании Израиля[108].
      cn: 你们理解修道生活的原则吗？当修道学问的目标是「看见上帝本来的样子」（约翰一书 3:2）时。许多神学家谈及我们不可能看见上帝本来的样子。但我再次在你们面前重复这些话——主说：「福哉清心者，因为他们必得见上帝」（马太福音 5:8）。阅读那些思想充满否定神学（apophatism）的神学家时，并阅读这些话：「福哉清心者」时，我想到要洁净我的心，脱离一切不蒙上帝喜悦的意念，脱离我们心中一切违背天父之爱律法的波动。因为当我们的心脱离一切邪恶意念时，那时我们是看见上帝「祂不是祂所是的样子」，按神学而言，还是「祂本来的样子」？对我而言，毫无疑问——是「祂本来的样子」。否则就荒谬了：「福哉清心者，因为他们必得见上帝祂不是祂所是的样子。」难道整个世界都误入歧途了吗——整个信仰上帝创造了宇宙的世界吗？还有其他理解上帝启示的形式——非基督教的。甚至在《圣经》的《旧约》中，仍存在某种不成熟，以及在以色列人的意识中对这一启示得到补充的期盼[108]。
  - type: paragraph
    text:
      ru: 'Так созидается богопознание – очень медленно проникая во все наше существо, – и человек становится «рожденнымсвыше»(см.Ин.3:3): не от плоти на Земле, а от Бога Свыше рожденным. И когда Господь даст кому-нибудь перешагнуть порог неведения Бога, который был у эллинов ἀγνώστῳ Θεῴ[109], тогда начинается совсем другая жизнь во всех ее проявлениях – как у пророка Исаии:«И произойдет отрасль от корня Иессеева, и ветвь произрастет от корня его; и почиет на нем Дух Господень, Дух премудрости и разума, Дух совета и крепости, Дух ведения и благочестия»(Ис.11:1–2)... Значит, если «мы станемподобны»(1Ин.3:2), все эти проявления живого личного Абсолюта должны быть сообщены нам: «Дух мудрости, Дух любви, Дух всеведения». И имея перед нами такую цель, как можем мы увлечься чем бы то ни было другим? Но переход от нашего земного состояния в состояние «видеть Бога,как Он есть»осуществляется Самим Богом. Он может прийти и дать жить Себя, как Он есть. Здесь, касаясь этой мысли, мы заметим, что не до конца становится человек подобен Богу, то есть он не становится единосущным Богу. Тем не менее ему сообщаются все свойства Божии, кроме происхождения: мы сотворены из ничто. Хотя, если быть точным, нельзя сказать «из ничто»: ибо человек создан из чего-то, что уже было[110].'
      cn: 这样，对上帝的认识便得以建立——极其缓慢地渗透入我们整个存在——人也因此成为「重生」的（参约翰福音 3:3）：不是从地上肉身所生，而是从高天之上的上帝所生。当上主允许人跨越对上帝无知的门槛时，这正是希腊人所说的「未识之神」[109]，那时，一种截然不同的生命，及其一切彰显，便开始了——正如先知以赛亚所说：「必有枝条从耶西的根而出，有树枝从他根上长出；上主的灵必安歇在他身上，是智慧和悟性的灵，是谋略和力量的灵，是知识和虔敬的灵。」（以赛亚书 11:1-2）……这意味着，如果「我们成为像他一样」（约翰一书 3:2），活生生的、位格性的绝对者的所有这些彰显，都必须被传达给我们：「智慧的灵，爱的灵，全知的灵」。而当我们面前有这样一个目标时，我们怎能被任何别的事物所吸引呢？但从我们尘世的状态，过渡到「得见上帝，正如祂所是」的状态，是由上帝亲自完成的。祂可以降临，并使人活出祂的真实所是。在这里，谈及此思想时，我们注意到人并未完全变得与上帝相似，也就是说，他不会与上帝同质同体。尽管如此，上帝的一切属性都将传达给他，除了其源始性：我们是从虚无中被造的。然而，若要精确地说，不能说「从虚无中」：因为人是从某种已经存在的事物被造的[110]。
  - type: paragraph
    text:
      ru: 'И вот, перед нами стоят вопросы: как понимать человека как «ипостась» по образу Ипостаси воплощенного Сына Божия, то есть как «персону»? Где проявления этой персоны? Как от индивидуального состояния человек может перейти к персональному: к ипостасной форме бытия? (Простите меня, я становлюсь немножко «безумным», говоря о всех этих вещах.) – До сих пор проблема персонализма христианского не явлена еще в завершенном виде в Церкви. Еще трудятся много умов богословских над тем, как понимать эту ипостасную форму бытия. Я лично дерзнул сказать, что на Земле мало кому дается этот опыт ипостасного бытия[111]. Одно из существенных его проявлений, которое дается человеку, – это есть молитва за всего Адама с плачем, подобным плачу Христа в Гефсиманском саду. Мы не достигаем напряжения Самого Иисуса Христа, но аналогия должна существовать. И вот почему нам важно все-таки знать, сначала хотя бы умственно, какая перед нами стоит задача, что значит «обожение» человека.'
      cn: 于是，摆在我们面前的问题是：如何理解人作为「位格」——依照道成肉身的上帝之子的位格形象，也就是说，如何理解人作为「人格」？这种人格的体现何在？人如何能从个体状态转变为人格化的状态：转变为位格性的存在形式？（请原谅我，我在谈论所有这些事时变得有些「疯狂」。）——迄今为止，基督教人格主义的问题尚未在教会中以完整形式显现。许多神学头脑仍在努力探究如何理解这种位格性的存在形式。我个人斗胆说，在世上，很少有人能获得这种位格性存在的体验[111]。它的一个重要体现，即人所能获得的，是为全人类（阿丹）的哭泣祷告，类似于基督在客西马尼园中的哭泣。我们无法达到耶稣基督本身的程度，但这种类比必须存在。这就是为什么我们仍然需要知道，即使起初只是在理智上，我们面临的任务是什么，以及「成神」对人意味着什么。
  - type: paragraph
    text:
      ru: Я все время подчеркиваю постепенность восхождения к этому состоянию, но это положение не исчерпывает всего. В нашем отце Силуане мы видим пример «опрокинутого» порядка. Ему было дано жить сознание вечной разлуки с Богом. И то сознание, о котором он говорит, что «ясно виделась погибель вечная»[112], было для него опытом ада. И Господь без слов явился ему и без слов передал ему Свое состояние[113]. Подчеркиваю снова и снова, что одно дело – интеллектуальное понимание этой молитвы, подобной гефсиманской, другое – явление этой молитвы в нас.
      cn: 我一直强调达到这种状态的渐进性，但这说法并非涵盖一切。在我们的父西路亚身上，我们看到一个「颠倒」次序的例子。他蒙受了活出与上帝永远隔绝的意识。他所说的，那「清楚看见永远的沉沦」[112]的意识，对他而言，是地狱的经历。而主向他无言地显现，并无言地将祂的状态传达给他[113]。我一再强调，对这如同客西马尼园般的祷告，理性的理解是一回事；而这祷告在我们内心的显现，又是另一回事。
  - type: paragraph
    text:
      ru: Что характерно для этого откровения о гефсиманской молитве? – То, что Силуан, который по нашим меркам об образовании был безграмотным человеком, после явления ему Христа вдруг начал молиться за все человечество с великим плачем. И это уже не психологическое состояние интеллектуального человека, не философская мысль, а бытийное состояние, факт бытия.
      cn: 关于客西马尼园的祷告，这个启示有何特点？——其特点在于，以我们的标准衡量，圣西卢安是一个文盲，然而在基督向他显现之后，他突然开始为全人类带着极大的哭泣而祷告。这已不再是知识分子的心理状态，也不是哲学思想，而是一种本体性的状态，一个存在的事实。
  - type: paragraph
    text:
      ru: 'И то, о чем мы говорим как о нашей последней цели, ему было дано таким образом! Он был водим Духом Святым в молитве своей. Конечно, его молитва не прекращалась ни днем, ни ночью. Эта молитва не давала ему спать, и спал он, сидя на табурете, то есть стуле без спинки. Четыре-пять раз в сутки он садился и на двадцать минут, на полчаса погружался в сонное состояние и снова вставал на молитву. Мы не можем быть, как он: это был гигант и физической силы.'
      cn: 我们所说的，作为我们最终目标的一切，就是以这种方式赐予他的！他在自己的祷告中受到圣灵的引导。当然，他的祷告不分昼夜从未间断。这祷告使他无法入睡，他坐在凳子上睡觉，也就是没有靠背的椅子。每天四到五次，他会坐下，二十分钟，或者半小时陷入睡眠状态，然后再次起身祷告。我们不能像他一样：他是一位体力上的巨人。
  - type: paragraph
    text:
      ru: 'Было в нем и другое проявление, помимо молитвы за всего Адама, за все человечество. Он пишет, что когда после первого падения его в плотской помысел духовник ему сказал: «Никогда не принимай плотских помыслов», за сорок шесть лет своего монашества он никогда не принял ни одного помысла.'
      cn: 除了为全人类始祖亚当，为全人类祷告之外，他身上还有另一种彰显。他写道，当他第一次陷入肉欲思念之后，他的神师对他说：「绝不要接纳肉欲思念。」在他修道四十六年间，他从未接纳过任何一个思念。
  - type: paragraph
    text:
      ru: 'Что встретил я в прп. Силуане и что потом поразило мое сознание? – В старце нам дан опыт персоны, и то, что пишет этот отец, являет уже ипостасный образ бытия. Маскаль, большой профессор-богослов Англиканской Церкви, с огромной эрудицией в творениях отцов – и западных, и восточных, – в своем отзыве о Силуане говорит, что нет параллели ему среди писаний, оставленных нам отцами, в которых говорилось бы с такою убедительностью о необходимости любви к врагам[114]. Итак, по реакции персоны на происходящее мы судим о том, что есть персона. В данном случае в моих книгах я даю описание этой персоны, но, как и в Евангелии, там многое сокрыто от людей непонимающих. И мы просим о Евангелии:Господи, сподоби нас услышать Евангелие Твое: то есть что скрыто за евангельскими словами. Вот эта персона-ипостась – Силуан – имел плач о гонителях как естественную для него реакцию на происходившее гонение на РусскуюЦерковьи в других местах мира против Христа: «Дай, Господи, Духом Святым всем этим людям познать Тебя!» Вот – молитва персоны-ипостаси!'
      cn: 我在圣西卢安身上发现了什么，又是什么随后震撼了我的意识？ – 在这位长老身上，我们获得了位格的经验，而这位教父所写的，则已然显明了位格性的存在样式。圣公会的神学教授马斯卡尔，一位对西方和东方教父著作皆有渊博学识的学者，在他对圣西卢安的评价中指出，在教父们留给我们的著作中，没有能与圣西卢安相匹敌的，能如此令人信服地论述爱仇敌的必要性[114]。因此，我们根据一个位格对所发生之事的反应，来判断何谓位格。在本例中，我的书中对此位格有所描述，但就像在福音书中一样，许多东西对不理解的人是隐藏的。我们为福音祈求：「主啊，求祢使我们配得聆听祢的福音」：也就是说，聆听隐藏在福音言语背后的真理。圣西卢安——这位位格本体——为逼迫者哀哭，这是他对正在发生的对俄罗斯教会以及世界其他地方对抗基督的逼迫的自然反应：「主啊，求祢藉着圣灵，使所有这些人认识祢！」这就是位格本体的祷告！
  - type: paragraph
    text:
      ru: 'Мы знаем, что, когда Господь говорит:«будьте совершенны, как совершен Отец ваш Небесный»(Мф.5:48), Он связывал эти слова с заповедью:«А Я говорю вам: любите врагов ваших»(Мф.5:44).'
      cn: 我们知道，当上主说：「你们应当完全，如同你们的天父是完全的」（马太福音 5:48），他将这些话与诫命联系起来：「但我告诉你们：要爱你们的仇敌」（马太福音 5:44）。
  - type: paragraph
    text:
      ru: 'Тот, кто«перешелужеввечнуюжизнь»(см.Ин.5:24), переходит еще отсюда, и реакции его на события – другие. Что меня удивляло в этом человеке Силуане? – Это действительно подобие Богу: он жил страдание всякого человека, с которым говорил или общался. Во всяких трудностях этой жизни он сострадал человеку. Но когда он оставался один, то молился за всего Адама. Он не думал, что спасение возможно на Земле «устроить» без того, чтобы все знали Бога Духом Святым... Простите, что я говорю так, но когда я встретился с ним и когда он сказал: «Придите ко мне, мы будем говорить», то я подумал, что этот человек, получивший от Бога такие дарования, есть дар всему человечеству.'
      cn: 那「从死亡进入永生」（参阅约翰福音 5:24）的人，甚至从这里就已转变，他对事件的反应也与众不同。是什么让我在这位圣西卢安长老身上感到惊奇？——这确实是效法上帝的样式：他亲身体验着与他交谈或接触的每个人的苦难。在今生的一切艰难中，他都对人怀有怜悯。但当他独处时，他会为全人类（亚当）祈祷。他并不认为救赎可以在世上「成就」，除非所有人都藉着圣灵认识上帝……请原谅我这样说，但当我遇到他，当他说道：「到我这里来，我们聊聊吧」时，我便想，这个从上帝那里获得如此恩赐的人，是全人类的礼物。
  - type: paragraph
    text:
      ru: В моей богословской попытке создать образ персоны я руковожусь тем, что Бог дал мне видеть конкретно в этом человеке. Это не есть какая-то фантазия, нет! Это были факты бытия. Как и богословие у отцов часто есть «рассказ» о том, что им дано было видеть или переживать. Такой «рассказ» мы имеем в Евангелии от Иоанна:«так возлюбил Бог мир,яко и Сына Своего Единородного дал есть»(Ин.3:16)... Евангелист говорит об этом как о факте, не подлежащем никакому сомнению или обсуждению. И это есть богословие как состояние человека.
      cn: 在我神学上试图塑造一个位格形象时，我所依据的是上帝具体让我在此人身上所看见的。这绝非任何幻想，不！这些是存有的事实。正如教父们的神学，常常是关于他们被赐予看见或体验到的「讲述」。我们在《约翰福音》中有这样的「讲述」：「上帝爱世人，甚至将祂的独生子赐予世人」（约翰福音 3:16）... 福音书作者将其作为一个不容置疑或讨论的事实来说明。这就是作为人的状态的神学。
  - type: paragraph
    text:
      ru: 'Когда я говорю о старце Силуане, я благодарю Бога: несмотря на то, что я всегда больной, Бог как-то продлил мою жизнь доныне, когда я могу говорить с вами. И прежде чем я пойду в мою «новую постель»[115]внутри земли, которая уже готова в двадцати метрах от моей постели, я хочу передать вам его учение.'
      cn: 当我谈及西路亚长老时，我感谢上帝：尽管我常年抱病，上帝却以某种方式将我的生命延续至今，以便我能与你们交谈。并且在我进入我的「新卧榻」[115]——即泥土之中——之前，那卧榻离我的床铺只有二十米，且已预备妥当，我愿将他的教导传达给你们。
  - type: paragraph
    text:
      ru: И когда вы проникнетесь этим сознанием, тогда вы найдете настоящий путь монашеский, который есть высочайшее откровение об образе жизни нашей для достижения спасения. В этом отношении монашеская школа стоит выше всякой другой из всех, какие знает Земля. Когда в Писании библейском говорится о школах пророческих, нам не ясно, как была организована жизнь в «школахпророков»(см.1Цар.19:20). Для нашего же времени я хотел бы прежде, чем уйду отсюда, чтобы вы осознали и видели последствие явления Христа Силуану, которое есть молитва за весь мир с плачем большим, чем за самого себя...
      cn: 当你们浸润于这份觉悟之中，你们就会找到真正的修道之路，这乃是关于我们生活样式、为达成救恩的至高启示。就此而言，修道学派超乎世上所知的一切其他学派。当圣经中提及先知学校时，我们并不清楚在「先知学校」中生活是如何安排的（参看 撒母耳记上 19:20）。而就我们这个时代而言，我希望在我离去此处之前，你们能够领悟并看见基督向圣西卢安显现的果效，这便是带着为全世界，甚于为自己而有的哀哭的祷告...
  - type: paragraph
    text:
      ru: Есть люди, которые низводят христианство слишком низко до земли. Но истинно христианское сознание, конечно, такое –«небо и земля прейдут, но Мои слова не прейдут»(Мф.24:35), как говорит Господь. Это совершенно иной план мышления, видения жизни.
      cn: 有些人将基督教降格到过于属世的地步。但真正的基督徒觉悟，当然是这样的——「天地要废去，我的话却不能废去」（马太福音 24:35），正如主所说。这是一种完全不同的思维层面和生命观。
  - type: paragraph
    text:
      ru: 'Что дано было видеть Силуану? – Различие между аскетическим пониманием смирения и Христовым смирением. Аскетическое понимание смирения: «я хуже всех» – мы встречаем и у отцов... Но про Христово смирение, свойственное Самому Богу как атрибут Божий, говорит только Силуан. Я нигде не встретил подобного понимания. «Но иное, – говорит он, – неописуемое смирение Господне»[116]. И когда он умирал, я спросил его: «Старец, Вы хотите умереть?» В ответ он мне сказал эти слова: «Я еще не смирился»[117].'
      cn: 西鲁安看到了什么？——苦修主义对谦卑的理解与基督的谦卑之间的区别。苦修主义对谦卑的理解是：「我比所有人都差劲」——这种理解我们也在教父们那里遇到过……但论到基督的谦卑，即上帝本身所固有的、作为上帝属性的谦卑，则只有西鲁安谈到过。我未曾在任何地方遇到过类似的理解。「但另一种，」他说，「是无法言喻的主的谦卑。」[116] 当他弥留之际，我问他：「长老，您想死吗？」他这样回答我：「我还没能变得谦卑。」[117]
  - type: paragraph
    text:
      ru: 'Он пишет: «Скучает душа моя о Господе»[118], – состояние этого смирения Христова человеческая плоть не выносит. Он жил его, это Христово смирение, но не в полноте. В полноте – только во время откровения; а если бы оно продолжилось, то плоть земная не выдержала бы[119].'
      cn: 他写道：「我的灵魂渴慕上主」[118]，——基督这种谦卑的状态，人的肉身无法承受。他活出了这种基督的谦卑，但不是在完全中。在完全中，只在启示的时候；而如果它持续下去，那么属地的肉身就无法承受了[119]。
  - type: paragraph
    text:
      ru: 'Эта новая черта в его богословии – необычайно высокого порядка: «Иное – смирение человека, и иное – неописуемое смирение Христа». «Неописуемое» почему? – Потому что Христос явил очень многие вещи, которые говорят о Его абсолютности Божественной. Но люди видели скорее тело, и ум их не постигал, что совершается. Сам же Господь сказал, что«если быим не были явлены эти дела,то не имели бы греха»(см.Ин.15:24). Но когда явлены нам эти дела, тогда мы стоим в истине, тогда мы разумеем, Кто есть Христос. Так, со Христом получается странная вещь: Он и недостижимый, и Он вместе с нами «идет рука в руку».'
      cn: 这一神学中的新特征具有非凡的高度：「人的谦卑是一回事，基督那不可言喻的谦卑又是另一回事。」「不可言喻的」为何如此？因为基督彰显了许多事物，表明祂绝对的神性。但人们更多地看见的是肉身，他们的心智未能领悟所成就的。主自己曾说：「若是没有向他们显明这些事，他们就没有罪了」(见 约翰福音 15:24)。但当这些事向我们显明时，那时我们便立于真理之中，那时我们便领悟基督是何许人。因此，在基督身上有一件奇特之处：祂既是不可企及的，祂又与我们「携手同行」。
  - type: paragraph
    text:
      ru: 'И да будет Его благословение на всех вас, возлюбленные мои братья и сестры. И помните это и никому не давайте восхитить от вас этого видения, чтобы жизнь ваша, постоянно трудная, до отчаяния, не явилась для вас смертью духовной. Но для нас до конца уподобиться Христу недостижимо, хотя бы внешне мы и сделали то же самое, что Христос: потому что у Него была иная форма сознания.'
      cn: 愿祂的祝福临到你们所有人，我亲爱的弟兄姐妹。并且记住这一点，不要让任何人从你们那里夺走这异象，以免你们那持续艰辛、甚至绝望的生命，不致于成为你们的属灵死亡。然而，我们要完全效法基督是无法达到的，即使我们外表上做了与基督同样的事情：因为祂拥有不同的意识形式。
  - type: paragraph
    text:
      ru: Что печально в наше время? – Что многие люди, стоящие на высоких, по-человечески говоря, уровнях культуры, слепы по отношению ко Христу и не узнают Его Божества. Больше того – чем люди ученее, тем труднее им принять, что Христос и есть Тот, Кто сказал:«да будет свет. И бысть свет»(Быт.1:3), что «Имже вся быша», как говорят святые отцы вСимволе Веры, и что«все чрез Него начало быть, и без Него ничто не начало быть, что начало быть»(Ин.1:3)...
      cn: 现今时代有何可悲之处？ — 在于许多人，那些按人的标准而言，处于高文化水平的人，对基督盲目，且不认同祂的神性。更有甚者 — 人越是有学识，就越难接受基督就是那位曾说：「要有光。就有了光」（创世记 1:3），圣教父们在《信经》中说的「万物藉祂而有」，以及「万物是藉着祂造的；凡被造的，没有一样不是藉着祂造的。」（约翰福音 1:3）
  - type: paragraph
    text:
      ru: Моя основная задача состоит в том, чтобы вы восприняли вдохновение, которое никогда не умаляется. Мы можем быть до конца сокрушены трудностями жизни, но вдохновение, которое принес нам Христос, о котором Он говорит как об огне (см.Лк.12:49), мы должны сохранить. Тогда ваше монашество будет настоящим. А если сохранить только внешние делания и уставы – этого еще мало. И далеко мало...
      cn: 我的主要任务在于，让你们领受永不衰减的灵感。我们可能会被生命的重重困难彻底摧毁，但是，基督带给我们的灵感，祂称之为火（参阅路加福音 12:49），我们必须保守它。那么，你们的修道生活才是真实的。如果仅仅保守外在的功课和规章——这还远远不够。而且远远不足…
- type: heading1
  text:
    ru: 'Беседа 17: Путь к познанию Бога[120]'
    cn: 讲道十七：认识上帝的道路[120]
  children:
  - type: paragraph
    text:
      ru: О любви к Богу. Только Бог – истинное Бытие. О словах «без Меня не можете делать ничего». Наша забота – включиться в поток Божественной жизни. Бытие – едино. Преодоление греха праотца. Бытийное содержание заповедей Христа. Смерть преодолевается через истощание. Следование Христу путем страдания. О восприятии Божественных энергий. О «званых и избранных» и предопределении.
      cn: '论爱上帝。

        唯独上帝是真实的存有。

        论「离了我，你们就不能作什么」这句话。

        我们的职责是融入神性生命的洪流。

        存有是独一的。

        克服原祖之罪。

        基督诫命的存有内容。

        死亡藉着虚己得以克服。

        藉苦难之道跟随基督。

        论神圣能量的领受。

        论「蒙召者与蒙选者」以及预定。'
  - type: paragraph
    text:
      ru: 'Каждый раз я начинаю мою беседу с вами, выражая радость мою от нашей встречи. Странны пути Божии: несколько прошедших дней я был в состоянии полного расслабления и не думал, что продлится жизнь моя. Но вот снова я с вами и снова радуюсь нашей беседе.'
      cn: 我每次与你们展开对话，都会表达我因我们相遇而由衷的喜悦。上帝的道路何其奇妙：过去的几天，我曾处于一种全然松弛的状态，并且不曾想我的生命还会延续。但看，我又和你们在一起，又一次为我们的交谈而喜乐。
  - type: paragraph
    text:
      ru: 'Господь Своим явлением поставил нас перед тем, что Он есть в существе Своем: Он есть истинный Бог – безначальный, беспредельный. И когда мы удостаиваемся веровать в Него, то постепенно любовь наша к Нему ведет нас на путь Его заповедей. Любя Его, мы сохраняем заповеди Его (см.Ин.14:21). И когда храним заповеди, тогда мы стоим пред созерцанием великого безбрежного океана.'
      cn: '上主藉着祂的显现，使我们面对祂的本质：祂是真上帝——无始的，无限的。

        当我们蒙准信靠祂时，我们对祂的爱便逐渐引领我们走上祂诫命的道路。爱祂，我们便遵守祂的诫命（参阅 约翰福音 14:21）。

        当我们遵守诫命时，我们便立于对那浩瀚无垠之海洋的默观之中。'
  - type: paragraph
    text:
      ru: Естественно, мы все хотим знать Бога нашего. Древние греки поставили алтарь«Богу Неведомому»(Деян.17:23). А мы все хотим знать нашего Бога и в нашей вере ходить как бы при свете солнца, когда мы видим не только то, что близко, но и то, что далеко. И сколько бы мы ни жили на Земле, непрестанно расширяется поле нашего зрения и углубляется наша любовь к Создавшему нас.
      cn: 当然，我们都渴望认识我们的上帝。古希腊人曾设立了一个祭坛，献给「未识之神」（使徒行传 17:23）。而我们都渴望认识我们的上帝，并在我们的信仰中，好像在阳光下行走，那时我们不仅能看见近处的，也能看见远处的。无论我们在地上活多久，我们的视野都会不断扩展，我们对创造我们的那位所怀的爱也会不断深化。
  - type: paragraph
    text:
      ru: 'После падения мы живем нашу смерть. Сказано было в Раю: «Если съедите от плода сего дерева, тосмертию умрете»(см.Быт.2:17). И эта смерть вошла в бытие нашего человеческого мира еще от первых дней. Так что когда мы собираемся вместе и хотим говорить о безначальном Боге, то двойное чувство охватывает нас: с одной стороны – как бы замолчать, замкнуться в себе и в восторге созерцать то, что творит наш Бог и Отец; с другой – перед нами стоит задание – построить наш вечный дом, наш вечный храм. И как мы можем строить этот дом? Какое основание положим мы этому строению? Так или иначе, сами своею силою мы не можем вырваться из того отрицательного опыта, в который нас поставил грех праотца.'
      cn: 堕落之后，我们活在我们的死亡之中。在乐园里曾有言：「你们若吃这树上的果子，就必定死」（创世记 2:17）。而这死亡自最初之日起，便进入了我们人类世界的存在。因此，当我们聚集在一起，想要谈论无始的上帝时，一种双重的情感便攫住我们：一方面，仿佛应该噤声，退回内心，并满怀狂喜地默观我们的上帝和父所行的一切；另一方面，摆在我们面前的是一项任务——建造我们永恒的家，我们永恒的圣殿。我们又如何能建造这个家呢？我们将为这建筑奠定怎样的根基呢？无论如何，单凭我们自己的力量，我们无法挣脱那始祖的罪将我们置身于其中的负面经验。
  - type: paragraph
    text:
      ru: Когда мы начинаем любить Отца нашего, Иже на Небесех, через Сына, Которого даровал нам Отец, и Духа Святого, тогда вместе с этой любовью, еще не свободные от страстей, мы живем и восторг, и страдание наше, потому что спасение наше недостоверно. В нас«действует смерть»(ср.2Кор.4:12) – последствие греха. В проведенные мною дни стояния на грани смерти мой ум влекло только это видение.
      cn: 当我们开始爱我们在天上的父，透过父所赐予我们的圣子，以及圣灵时，连同这份爱，我们仍未脱离诸情欲，却也经历狂喜，并经历我们的苦痛，因为我们的救恩尚未确定。在我们里面，「死亡在作工」（参阅哥林多后书 4:12）——这是罪的后果。在我经历濒临死亡的那些日子里，我的心智只被这景象所吸引。
  - type: paragraph
    text:
      ru: 'Говорю, как всегда, моим дорогим братьям и сестрам, вновь пришедшим к нам: наши беседы вызваны необходимостью общения, цель которого – вместе жить возможно глубже данное нам Откровение. Вы, молодые, начинаете жизнь: у вас еще другой порядок и иные мысли, чем у меня. И сегодня я хотел бы войти в ваше состояние, чтобы беседовать с вами не о том, что я живу на конце моей жизни, а о том, что вы встречаете на пути своем. Так, я бы хотел, чтобы кто-нибудь из вас сказал, какой вопрос стоит пред ним в данный момент, который хочет душа его разрешить благоприятно. Отвечая, я мог бы говорить о том, что и сам жил за мои почти семьдесят лет монашества...'
      cn: 我一如既往地对我亲爱的弟兄姊妹们，那些新近来到我们当中的人说：我们的交谈是出于交流的需要，其目的是为了我们一同尽可能更深地活出那赐予我们的启示。你们，年轻人，才刚刚开始生活：你们的秩序和思想与我不同。而今天我希望进入你们的状态，以便与你们交谈的不是我生命末期的生活，而是关于你们在自己人生道路上所遇到的。因此，我希望你们当中有人能说出，此刻他们面临着什么问题，他们的灵魂渴望能顺利解决的。在回答时，我就可以谈谈我自己在我将近七十年的修道生活中也曾经历过的...
  - type: paragraph
    text:
      ru: 'Вопрос отца N.: Как понять слова Христа, сказанные в Евангелии от Иоанна:«без Меня не можете делать ничего»(Ин.15:5); и«Никто не может придти ко Мне, если не привлечет его Отец, пославший Меня»(Ин.6:44), – в соотношении со свободой человеческой и с возможностью самоопределения для человека?'
      cn: N.神父的提问：如何理解记载在约翰福音中基督的话语：「离了我，你们什么都不能做」（约翰福音 15:5）；以及「若不是差我来的父吸引人，就没有人能到我这里来」（约翰福音 6:44）——这些话与人的自由以及人自我决定的可能性有何关联？
  - type: paragraph
    text:
      ru: 'Конечно, это есть существенный вопрос, который не оставляет нас до конца нашего земного пути. Почему Господь сказал: «А без Меня не можете творить ничего»? Когда мы мыслим о бытии вообще – и о Боге, и о твари, – то каким-то странным образом в нас живет интуиция, что бытие единое, а не есть множество различных образов бытия. И когда живём, только если станем обиталищем Отца, Сына и Святого Духа. И если нет Его с нами – Бога, – то мы бессильны, мы во тьме, и мы во власти смерти. Вот почему, я думаю, Он говорит:«без Меня не можете делать ничего»(Ин.15:5). Потому что нет другой жизни, кроме той, о которой говорится в Прологе Евангелия от Иоанна:«Все чрез Него начало быть, и без Него ничто не начало быть, что начало быть»(Ин.1:3), и нет иного Бога, иного Бытия. Мы сами создать новое бытие не можем, так что весь смысл наш только в том, чтобы получить вечное Бытие от безначального Бога, Который открылся нам.'
      cn: 当然，这是一个本质性的问题，它一直伴随着我们，直到我们尘世旅途的终点。为什么上主说：「离了我，你们就不能做什么」？当我们思考一般意义上的存在时——无论是上帝，还是受造物——我们心中以某种奇妙的方式存留着一种直觉，即存在是统一的，而非多种多样的存在形式。并且，我们唯有成为父、子和圣灵的居所，才能存活。倘若祂——上帝——不与我们同在，那么我们便是无力的，我们身处黑暗，我们受死亡的辖制。这就是为什么我想祂说：「离了我，你们就不能做什么」（约翰福音 15:5）。因为没有别的生命，唯独那在约翰福音序言中所述说的生命：「万物是藉着祂造的；凡被造的，没有一样不是藉着祂造的」（约翰福音 1:3），也没有别的上帝，别的存在。我们自身不能创造新的存在，所以我们全部的意义只在于从那无始无终的上帝那里获得永恒的存在，那向我们启示自己的上帝。
  - type: paragraph
    text:
      ru: 'Конечно, я ничего не могу сделать из того, что принадлежит Богу. Тот же божественный Иоанн говорит, что, когда мы узрим Его, тогда«будем подобны Ему, потому что увидим Его, как Он есть»(1Ин.3:2). И весь путь получается такой: мы должны стать «сосудом для Духа Святого» и «обиталищем для Отца и Сына» (ср.Ин.14:23) и, мы можем добавить, Духа Святого. Временное обитание исключается при этом: если мы становимся обиталищем вечного Бога безначального, то, конечно, на вечность вселяется в нас Отец и Сын и Дух Святой. Это есть чисто положительное восприятие евангельских слов.'
      cn: 当然，我对于属于上帝的一切都无能为力。那位神圣的约翰也说，当我们看见祂时，那时，「我们将要像祂，因为我们必得见祂的真体」（约翰一书 3:2）。而整个道路就是如此：我们必须成为「圣灵的器皿」，以及「圣父与圣子的居所」（参阅约翰福音 14:23），并且，我们也可以补充说是圣灵的居所。在此，临时的居留是被排除的：如果我们成为永恒的、无始的上帝的居所，那么，当然，圣父、圣子和圣灵将永远地居住在我们里面。这就是对福音话语的纯粹积极的领受。
  - type: paragraph
    text:
      ru: Однако весь наш опыт показал нам, что мы должны пройти отрицательный опыт истощания, наш отрицательный опыт смерти. И когда мы по-христиански живем, то мы живем и полноту Бытия безначального, бесконечного, и в то же время мы – постоянно в этом теле, которое нас связывает. И мы не достигаем ничего абсолютного, а все в нас относительно.
      cn: 然而，我们所有的经验都向我们表明，我们必须经历负面的枯竭经验，我们负面的死亡经验。当我们以基督徒的方式生活时，我们活出了那无始无终的、无限的「存有」的丰满，但同时，我们又不断地身处于这捆绑我们的身体之中。我们无法达到任何绝对的事物，而我们里面的一切都是相对的。
  - type: paragraph
    text:
      ru: 'Господь, Творец наш, Святая Троица, вел совет предвечный:«сотворим человека по образу Нашему [и] по подобию»(Быт.1:26), – и мы, христиане, строим жизнь на этом откровении: наше бытие есть образ Божественного бытия. Первородный грех внес отрицательный момент в нашу жизнь. И Христос, Который явился в сей мир, конечно, был не понятен никому. Как жил Этот Человек? – Он не хотел иметь никакой собственности на Земле: Он не имел ни дома, ни иного чего-либо (Лк.9:58)... Явление Его, Рождество Его было в самых бедных условиях (см.Лк.2:7). И как можно узреть в этом явлении абсолютного Бога, Творца Космоса? И Христос говорит, что, когда Отец действует в нас (ср.Ин.6:44, и др.), мы начинаем видеть величие Божие в этом истощании.'
      cn: 上主，我们的造物主，圣三一举行了永恒的会议：「让我们照着我们的形象[和]样式造人」（创世记 1:26），——而我们基督徒，则以此启示为基础构建生命：我们的存在是神圣存在的形象。原罪给我们的生活带来了消极的因素。而基督，祂降临到这个世界，当然，对任何人而言都是难以理解的。这个人是如何生活的？——祂不想在地上拥有任何财产：祂既没有房屋，也没有其他任何东西（路加福音 9:58）……祂的显现，祂的诞生是在最贫困的条件下发生的（参 路加福音 2:7）。又如何能在这显现中看见绝对的上帝，宇宙的造物主呢？基督说，当父在我们里面行动时（参 约翰福音 6:44及其他经文），我们便开始在这虚己中看到上帝的伟大。
  - type: paragraph
    text:
      ru: 'Чтобы следовать за Христом (см.Ин.12:26), как Он говорит, действительно надо уготовиться терпеть всякую скорбь и болезнь, всякое возможное страдание. И как возможно выбирать это страдание и эту болезнь? Никто не может сам последовать за Христом, потому что первое условие: надо брать на свои рамена крест. Кто может избирать этот страшный путь страданий Христа? Итак, нужна какая-то интуиция свыше, которая привлекает человека ко Христу. Апостол Павел хорошо сказал, что если нет воскресения, то христианин – самое несчастное существо на Земле (см.1Кор.15:13–19). По-человечески говоря, никто не может согласиться последовать за Христом, если не будет ему открыто, что это Сын возлюбленный Отца.'
      cn: 为了跟随基督（参阅约翰福音 12:26），正如祂所言，确实需要准备好忍受各种忧患和疾病，以及各种可能的苦难。那么，又怎能选择这苦难和这疾病呢？没有任何人能凭自己跟随基督，因为首要的条件是：必须肩负起自己的十字架。谁能选择基督这可怕的受苦之路呢？因此，需要某种来自上方的直觉，吸引人归向基督。使徒保罗说得好，如果没有复活，那么基督徒是世上最不幸的生灵（参阅哥林多前书 15:13-19）。从人的角度来说，除非向他启示这位是天父所爱的儿子，否则任何人都不会同意跟随基督。
  - type: paragraph
    text:
      ru: 'Мне кажется, что в этом вопросе заключено некоторое колебание: если без Него мы не можем творить и мы Его просим делать, а Он не делает, как понять это положение:«Просите и дастся вам»(см.Мф.7:7)? Мы просим и очень долго не получаем даже маленьких вещей.'
      cn: 在我看来，这个问题中包含着某种困惑：如果没有祢我们无法成就任何事，而我们祈求祢去做，但祢却不照做，我们该如何理解这句教导：「你们祈求，就给你们」（参见马太福音 7:7）？我们祈求了很久，甚至连微小的事物都没有得到。
  - type: paragraph
    text:
      ru: 'Итак, потенциально в нас живет Сам Бог, и мы получаем бытие-жизнь Самого Бога, так что Бог и человек идут совсем рядом. Когда мы говорим о воплощении Сына Отчего, то стоит перед нами вопрос: как возможно, чтобы абсолютное Существо могло воплотиться в эту болезненную плоть? – Наша природа сотворена Богом. Получается, что Христос облекся и взял на Себя, в Свою Ипостась нашу природу, способную страдать, но – природу, созданную Им Самим. Она не есть нечто чуждое для Него. В Своем рождении от Девы Он избежал того, что соприкасается с грехом. Если Он Сам сотворил эту природу и мог явиться в этой природе, получается и обратное решение, что мы, рожденные в этой природе, можем воспринять Бога – Творца. Так, когда говорит Господь в Совете Своем предвечном:«сотворим человека по образу Нашему [и] подобию»(Быт.1:26), то мы стоим пред Абсолютом.'
      cn: 因此，上帝亲自潜在地居住在我们里面，我们领受上帝祂自己的存有与生命，以上帝与人全然并行不悖。当我们谈论圣父之子的道成肉身时，我们面前就有一个问题：绝对的存有者如何可能化身进入这病弱的肉身？——我们的本性是上帝所创造的。由此可见，基督穿戴并取了我们的本性，纳入祂自己的位格中，这本性是能够受苦的，但却是祂自己所创造的本性。它对祂而言并非异质之物。祂借由童贞女降生，避免了与罪相关的部分。如果祂自己创造了这本性，并能显现于这本性之中，那么反过来也成立，即我们这些生于这本性中的人，能够领受上帝——造物主。因此，当上主在祂永恒的议会中说：「我们要照着我们的形像、按着我们的样式造人」（创世记 1:26）时，我们就站在绝对者面前。
  - type: paragraph
    text:
      ru: 'И каждодневный опыт показывает нам нашу немощь, нашу смерть, отсутствие в нас любви, отсутствие ясного ощущения, что хорошо и что плохо. Мы бьемся как рыба об лед в этом мире. Вековая жизнь Православия и христианства вообще связана с постоянным исканием. И когда мы хотим знать Бога, у нас возникает вопрос: как возможно, чтобы абсолютное Существо восприняло эту относительную форму бывания. А вместе с тем: как мы, рожденные в этой земной плоти, можем явиться носителями Божественного могущества. Если мы хотим рассуждать об этом, то на каждом шагу можем испытывать недостаточность нашего интеллекта решить эти вопросы. Но вопросы эти решаются самой жизнью. Мы находимся еще в периоде творения, о чем Господь сказал:«Отец Мой доныне делает, и Я делаю»(Ин.5:17). Еще не завершилось до конца«дело»(см.Ин.4:34, 17:4) Бога, спасающего мир.'
      cn: 日常经验向我们显明我们的软弱、我们的死亡、我们里面缺少爱，以及缺少对何为善、何为恶的清晰认知。我们在这个世上徒劳挣扎。东正教乃至广义上的基督教的悠久生命，总是与不断的寻求相关联。当我们想要认识上帝时，我们心中会产生一个问题：绝对的存有怎能取这种相对的存在形式呢？与此同时，我们这些生于这属地肉身之中的人，怎能成为神圣权能的承载者呢？如果我们想对此加以论述，那么在每一步我们都可能感受到我们智力的不足，无法解决这些问题。然而这些问题是由生命本身来解决的。我们仍处于创造时期，正如上主所说：「我父作工直到如今，我也作工。」（约翰福音 5:17）上帝救赎世界的「工作」（参看 约翰福音 4:34，17:4）尚未完全完成。
  - type: paragraph
    text:
      ru: 'Натура наша создана по образу безначального Абсолюта, Который говорит: АЗ ЕСМЬ СУЩИЙ, «Бытие – это Я, и ничего другого нет, кроме Меня». Если Бог о Себе говорит«Аз», значит, Он – Лицо, Персона. Как это Откровение отражается в нас? Как оно отзывается на нашей повседневной жизни? Как мы можем стать подобными Богу персонами? Когда мы проводим внимательно наши дни, то мы все время стоим пред какими-то еще не раскрывшимися для нас тайнами. Но через самые старания жить по заповедям Христа-Бога мы понимаем, что никто другой ничего более совершенного не дал нам...'
      cn: 我们的本性是照着无始的绝对者的样式被造的，祂说：「我是自有永有的」，又说：「存在即是我，除我之外，别无他物。」如果上帝论及自己说「我」，这就意味着祂是一个位格，一个个体。这个启示如何在我们身上反映出来？它又如何在我们的日常生活中回应？我们如何能成为与上帝相似的位格？当我们仔细度过我们的日子时，我们总是站在一些尚未向我们揭示的奥秘面前。但是，通过我们竭力遵行基督-上帝的诫命，我们明白，没有人能给予我们更完美的了……
  - type: paragraph
    text:
      ru: 'Опять я возвращаюсь мыслию моей к нашему отцу Силуану. Он пишет, что, когда мы не понимаем путей Божиих, все-таки говорим Богу: «Да будет воля Твоя»[121]. И так в нашей жизни на Земле, полной страданий, болей, смерти, мрака, когда мы предадимся на Его волю, которую еще не понимаем, – тогда приходит к нам благодать Святого Духа, и мы живем Бога как Отца, самого дорогого, самого близкого.'
      cn: 我的思绪再次回到我们的西路亚长老。他写道，当我们不明白上帝的道路时，仍然对上帝说：「愿祢的旨意成就」[121]。于是，在我们世上这充满了苦难、痛苦、死亡和黑暗的生命中，当我们把自己交托于祂那尚不明白的旨意时，圣灵的恩典便会临到我们，我们便以上帝为父而活，祂是那最亲爱的、最亲近的。
  - type: paragraph
    text:
      ru: Итак, не логическое разрешение возможно в этом моменте, нужен опыт бытия самого. Если мы созданы по образу и по подобию, то, значит, для нас приготовлено Царство бесконечное. И в великом страдании совершает христианин свой путь. Так, на Земле Христос не гонится за тем, чтобы раздавить других могуществом (см.Мф.20:28;Мк.10:45), а берет на Себя их немощи. Христианство, которое мы, православные, живем, действительно есть сплошное страдание. Но в этом страдании вдруг где-то находит себе путь золотая нитка тончайшей интуиции нашего родства с безначальным Богом.
      cn: 所以，此刻，逻辑上的解决之道并不可行，需要的是存在本身的经验。如果我们是照着形象和样式被造的，那么，无限的国度就是为我们预备的。并且基督徒在巨大的苦难中行完自己的道路。因此，在地上，基督并非追求以自己的权势压倒他人（参 马太福音 20:28，马可福音 10:45），而是担当他们的软弱。我们东正教徒所活出的基督教，确实是全然的苦难。但在这苦难中，一条我们与无始的上帝相亲的至为精微的直觉所形成的金线，忽然在某处为自己寻得了道路。
  - type: paragraph
    text:
      ru: Итак, творение человека еще не закончено. Может быть, завершается оно в опыте святых, как прп. Силуан. Он говорит, что и Бога живем мы как Отца, самого дорогого, самого близкого. Эта вещь очень трудно выразимая нашим словом. Бытие Божественное – бесстрастное. И каким образом нас поражает эта «болезнь любви»? Христос сказал:«Нет больше той любви, как если... душу свою положит человек за друзей своих»(Ин.15:13), за других людей. Это – путь к тому, как возможно стать персоною, подобною Персоне воплощенного Сына Божия. И то, что мыслил Христос на Земле, те реакции, которые мы видим в Нем, весь строй Его мысли и чувств мы хотим воспринять (Флп.2:5) – и не можем, потому что это слишком больно.
      cn: 所以，人的受造尚未完成。或许，它在圣者的经验里得以完满，如同圣西卢安长老。他曾言，我们以上帝为父而活，祂是最亲爱、最亲近的。这事极难用我们的话语表达。神圣的存有是无私欲的。而这「爱之病」又以何种方式临到我们呢？基督曾言：「没有比这更大的爱了，就是……人舍弃自己的灵魂，为朋友们」（约翰福音 15:13），为着其他人。这是通往一种可能：成为一位位格，相似于道成肉身的上帝之子的位格。而基督在世上所思所想的，我们从祂身上所见的那些反应，祂整个思想和情感的架构，我们渴望领受（腓立比书 2:5）——却不能，因为这过于痛苦。
  - type: paragraph
    text:
      ru: Духовное восприятие в христианской жизни очень глубоко и неизъяснимо тонко. В сущности говоря, уже не интеллектом нашим постигаем мы эту любовь Отца и Сына и Святаго Духа... Человеческое слово, рожденное в твари, не способно выразить это по-настоящему. Но когда мы действительно веруем во Христа, тогда вселяется в нас Дух Святой, и где-то в глубине некая тончайшая интуиция открывает нам, что это – Бог, это – наш Отец. Словом выразить мы не можем, мы должны «попасть» в это состояние. И мы «попадаем» в это состояние, если сам Бог приходит и вселяется в нас – непостижимо великий и могущественный и непостижимо смиренный.
      cn: 基督徒生命中的属灵感知非常深刻，且难以言喻地精微。实质上说，我们已不再是借着我们的理智来领悟这父、子、圣灵的爱……在受造物中诞生的人的言语，无法真正地表达出来。但当我们真正信靠基督时，圣灵便会内住在我们里面，并且在深处某个地方，某种极其精微的直觉向我们启示，这就是上帝，这就是我们的父。我们无法用言语表达，我们必须「进入」这种状态。若是上帝亲自降临并内住在我们里面，我们便「进入」这种状态——祂是不可思议地伟大且全能，又不可思议地谦卑。
  - type: paragraph
    text:
      ru: 'Как говорит наш отец – Силуан, есть смирение аскетическое: мы живем и чувствуем себя неспособными жить по заповедям, начинаем ненавидеть себя и говорить, что «я хуже всех». И это уже есть смирение. «Но, – говорит прп. Силуан, – иное смирение Христа. Оно безотносительно, в нем нет ни сравнения, ни различения – ничего. Это абсолютное смирение Бога»[122]. И когда это смирение Божественное касается нас, то радость нам доставляет не могущество наше раздавить брата, а любовь к брату, которая становится содержанием нашей жизни. И приходит странное чувство «услаждения» уже духовного, божественного порядка от того, что человек чувствует себя меньшим других и не стремится к власти. Это есть Божественное смирение, про которое прп. Силуан говорит: «Оно неизъяснимо», потому что выражаемое на нашем человеческом языке оно становится противоречивым.'
      cn: 正如我们的教父圣西卢安所言，存在一种苦修的谦卑：我们活着，却觉得自己无力按照诫命生活，便开始憎恨自己，并说「我比所有人都差」。而这便是一种谦卑。「然而，」圣西卢安说，「基督的谦卑则另当别论。它无涉一切，其中既无比较，也无分别——一无所有。这是上帝绝对的谦卑」[122]。而当这种神圣的谦卑触及我们时，给予我们喜悦的，不再是我们压倒弟兄的力量，而是对弟兄的爱，这爱成为我们生命的内容。于是，一种奇特的「愉悦」感便油然而生，这愉悦已是属灵的，神圣的境界，因为它源自人感到自己比他人微小，且不寻求权力。这就是神圣的谦卑，圣西卢安论及此说：「它是无法言喻的」，因为若用我们人类的语言来表达，它便会变得自相矛盾。
  - type: paragraph
    text:
      ru: 'Что же делать нам в этом состоянии, в котором мы пребываем? – Продолжать терпеливо учиться жизни Христа в Его истощании. И тогда придет ответ, не словесный, а бытийный, потому что человек должен прийти во Христе в состояние, когда сам он говорит: «Ныне в Тебе и Тобою аз есмь». И тогда исполняется в нас превечный замысел: мы становимся подобными Тому, Кто сказал «АЗ ЕСМЬ СЫЙ».«Аз есмь», – говорит и человек.'
      cn: 我们处于这种状态中，该怎么办呢？——继续耐心地学习基督在祂虚己中的生命。于是答案将会到来，不是言语上的，而是本体性的，因为人必须在基督里达到一个状态，当他自己说：「如今，在祢里面并借着祢，我乃是。」于是，在我们里面，那亘古的旨意便得以成就：我们便变得像那位说了「我是自有永有者」的。「我乃是，」人也如此说。
  - type: paragraph
    text:
      ru: Почему мы беседуем об этой жизни, которая превышает «средний» уровень христианства? – Потому что нам нужно знать, к чему мы призваны. В этом и есть монашество. Храня заповеди Христа, мы делаем себя способными к восприятию уже самой энергии Божества – благодати. Так, слова Христа:«Никто не может придти ко Мне, если не привлечет его Отец»(Ин.6:44), связаны с идеей, что Бог сотворил природу человека способною познавать. И при тварности нашей эта способность познавать Бога делает заповедь Божию как бы обязательною, потому что заповедь и есть то, что соответствует Бытию Божественному. И тогда мы через наше старание жить по заповедям во Христе видим, как наш ум становится способным постигнуть смысл слов апостола Павла, что мы «были избраны до сотворениямира»(см.Еф.1:4). Жизнь по-христиански требует от нас внимания к тому, где наш ум. А ум наш может идти в ТО, ЧТО ЕСТЬ до сотворения мира (я не говорю «было», но что «есть»), и сие не рождается от Земли, а есть нечто, исходящее от Бога.
      cn: 为何我们谈论这种超越了基督教「平均」水平的生命？——因为我们需要知道我们被召是为了什么。这就是修道生活。遵守基督的诫命，我们使自己能够领受上帝本有的能量——即恩典。如此，基督的话语：「若不是差我来的父吸引人，就没有人能到我这里来」（约翰福音 6:44），与上帝创造了人的本性，使其能够认识的观念相关联。并且，尽管我们是被造物，这种认识上帝的能力使得上帝的诫命似乎是必然的，因为诫命正是与上帝的本体相符的。于是我们借着在基督里努力遵行诫命，看到我们的心智变得能够领悟使徒保罗的话语的意义，即我们「在创立世界以前就被拣选了」（参以弗所书 1:4）。基督徒的生活要求我们留意我们的心智在哪里。而我们的心智可以进入在创立世界以前就「存在着」的境地（我不是说「曾有」，而是说「现存」），这并非源于大地，而是某种源自上帝的事物。
  - type: paragraph
    text:
      ru: 'Вопрос отца NN.: Все ли люди получают это призвание от Бога, без которого нельзя найти Бога, быть со Христом или знать Христа?'
      cn: NN神父的问题：所有人是否都从上帝领受这呼召，若无此呼召便无法寻得上帝，无法与基督同在，或无法认识基督？
  - type: paragraph
    text:
      ru: Я думаю, отче дорогой, что до конца мы выразить не можем существование взаимоисключающих положений. В нормальной логике, где есть «или – или», исключается третье, а здесь не исключается, и потому мы говорим, что приходится отказываться от выражения словами нашей формальной логики...
      cn: 我认为，亲爱的神父，我们无法完全表达相互排斥之命题的存在。在正常的逻辑中，那里有「非此即彼」，第三者被排除，而在此处却不被排除，因此我们说，我们不得不放弃用我们形式逻辑的言语来表达……
  - type: paragraph
    text:
      ru: 'Здесь мы должны вспомнить, что, творя человека, Господь имел известный план. И в самой натуре нормального человека заложено стремление искать Абсолюта. Так что «званые» – все люди, ибо мы сотворены для того, чтобы быть с Богом, но«избранных», которые принимают это призвание, – немного (см.Мф.22:14). И здесь возникает удивительно трудный вопрос. Как быть, когда мы встречаем людей, не способных верить: та же ли это природа, или уже нечто другое? Но быть образом Абсолюта и удовлетворяться только вкусным обедом или удобной постелью – не свойственно человеку, который хранит в себе образ Бога. Итак, все призваны только к этому; все – «званые» по природе самой, от самого создания. И мы стоим перед этим вопросом, который мы никак не можем разрешить словесно... Мы не можем выразить это словами еще и потому, что реакции каждого человека, всякого сердца – совершенно персонального порядка: Бог создал сердца наедине и говорит с человеком в сердце.'
      cn: 在此我们必须忆及，上主在创造人时，有着既定的计划。且在正常人的本性中，被赋予了这种寻求绝对者的渴望。因此，「蒙召者」是所有的人，因为我们受造是为了与上帝同在；但「被拣选者」（即接受此呼召者）却为数不多（参马太福音 22:14）。于是这里出现了一个极其困难的问题。当我们遇到无法相信的人时，该如何是好：这究竟是同一种本性，抑或已是某种不同的东西？但作为绝对者的形象，却只满足于一顿美餐或一张舒适的床榻——这不符合那心中存有上帝形象之人的本性。因此，所有人蒙召皆为此道；所有人在其本性上，自被造之初，便都是「蒙召者」。而我们正面临着这个问题，一个我们无论如何也无法用言语解答的问题……我们之所以无法用言语表达这一点，还因为每个人、每颗心的反应都是完全个人化的：上帝独自创造了人心，并在人心中与人对话。
  - type: paragraph
    text:
      ru: 'В чем можно увидеть, что совершил Христос уже как человек? – В том, что Отец отдал Его в полную власть врагам. Христос взывал к Нему в Гефсиманском саду, Он взывал к Нему на Голгофе: Отец не склонился прийти к Нему (см. Мф.26и след.; Мф.27и т. д.). Но после, как апостол Павел говорит,«дал Ему имя выше всякогоиногоимени»(Флп.2:9) и на земле, и на небе. Значит, какой вывод возможен? – Я принимаю всякую скорбь, потому что я знаю, что Отец наш действительно Благий. И если мы претерпеваем все, вплоть до смерти, сохраняя полную веру в то, что Отец мой Благий, тогда по вере нашей бывает то же, что со Христом: Отец прославляет человека славою, которая безначальна. Человек призван к этому. Итак, званые – все от самого сотворения мира. Все дети Адама призваны к этому. Но избрание уже зависит от нас: если мы терпим и следуем за Богом, несмотря на все страдания. Путь этот неизъясним человеческим словом.'
      cn: 我们能从何处看出，基督作为人，已经成就了什么？——在于圣父将祂完全交予仇敌权柄之下。基督在客西马尼园向祂呼求，祂在各各他山向祂呼求：圣父并未俯就降临于祂（参 马太福音 26章及续；马太福音 27章等等）。但其后，正如使徒保罗所言，「又赐给祂超乎万名之上的名」（腓立比书 2:9），无论在地上，还是在天上。那么，能得出什么结论呢？——我接受一切的悲苦，因为我知道我们的圣父确实是恩慈的。并且，如果我们忍受一切，直至死亡，仍完全相信我的圣父是恩慈的，那么，因着我们的信德，就如同基督所经历的那样：圣父便以无始的荣耀，荣耀那人。人受召为此。所以，蒙召者——自世界受造之初，即是所有的人。所有亚当的子嗣都为此受召。但拣选已取决于我们：如果我们忍受苦难并跟随上帝，尽管面对一切磨难。此路非人言所能尽述。
  - type: paragraph
    text:
      ru: Молитесь за меня, потому что я, видите, не способен дать ответ, но я думаю, что его, этого ответа, и нет. До последнего Суда всемирного мы не сможем дать ответ положительный.«Мы ходим верою, а не»ясным«видением»положения (см.2Кор.5:7), как апостол Павел, гениальный человек, который пережил опыт, действительно, Бога и является примером для нас даже до сих пор.
      cn: 请为我祈祷，因为，你看，我无法给出答案，但我认为，这个答案，根本就不存在。在普世的最后审判之前，我们无法给出肯定的答案。「我们凭信心行事，而不是凭『清晰的』眼见」（参阅哥林多后书 5:7），正如使徒保罗——一个极具天赋的人，他确实经历了上帝，并且直到如今仍是我们的榜样。
  - type: paragraph
    text:
      ru: 'У некоторых богословов есть мысль такая: сотворил Бог мир и вложил в него потенциальность, так что мир будто бы должен естественно идти своими путями и остаться будто бы без Бога, подобно тому, как маленькое семя, в котором заключена вся программа, становится колоссальным деревом. Так программа мира была написана с момента сотворения Адама. И когда Бог оставляет человека, Он считает, что мы должны сами решить вопрос с тем, что нам было дано в творении. И Он медлит и не отвечает, ждет, когда мы сами постигнем это. Так у некоторых богословов есть эта идея, что потенциально человек рождается с возможностью естественного развития в Боге, если мы принимаем, что человек создан по образу Божию и по подобию.'
      cn: 有些神学家有这样的想法：上帝创造了世界，并在其中注入了潜力，以至于世界似乎应该自然而然地沿着自己的道路发展，并且似乎脱离了上帝，就像一颗小小的种子，其中蕴含着全部程序，最终长成参天大树一样。因此，世界的程序从亚当受造之时便已写就。当上帝离开人时，祂认为我们应该自行解决在受造之中所得到的问题。祂迟延不答，等待我们自行领悟。因此，有些神学家持有这样的观点：如果我等认同人是照着上帝的形象和样式受造的，那么人在潜能上生来就具备在上帝里面自然发展的可能性。
  - type: paragraph
    text:
      ru: 'В чем вред современной науки для жизни вечной? – В том, что ученые отвергают Откровение. А оно необходимо нам, потому что из нашего опыта мы не можем решить вопросы о Боге: Бог должен открыться нам. И так возникает трудность в том, чтобы выразить, до каких пределов идет вложенная в нас потенциальная сила – «до каких» и «почему».'
      cn: 现代科学对永生有何危害？——在于科学家们否认启示。然而这启示于我们是必需的，因为凭我们自身的经验，我们无法解决关于上帝的问题：上帝必须向我们启示祂自己。于是便产生了一个难题，即是去表达赋予我们内在的潜能究竟达到何种限度——「达到何种限度」以及「为何如此」。
  - type: paragraph
    text:
      ru: 'Лично я живу так: «Сам я ничего не могу сделать»(ср.Ин.15:5). У русского народа было замечательное выражение: «Без Бога – ни до порога!»'
      cn: 我个人是这样生活的：「我靠自己什么也做不了」(参见 约翰福音 15:5)。俄罗斯民族有一个很棒的表达：「离了上帝，寸步难行！」
  - type: paragraph
    text:
      ru: 'В словаре Даля хорошее выражение приводится. Представитель господствующего сословия общества говорит: «Хотя мы умнее мужика, морально можем стоять ниже мужика». И это невозможно отнять у человека. Когда было крепостное право, люди несли это бремя с терпением. Отец нашего духовного покровителя Силуана был крепостной, то есть раб. Значит, никакое положение социальное не мешает человеку идти к Богу. И даже существует такой контраст: те, которые удовлетворяются их положением как первенствующего элемента в обществе, меньше способны полюбить Бога, чем страдающий раб.'
      cn: 达利词典中记载了一个很好的说法。社会上层阶级的一位代表说道：「虽说我们比农夫聪明，但道德上可能低于农夫。」而这一点是无法从人身上剥夺的。在农奴制时期，人们忍耐着承受这重担。我们的属灵主保圣西卢安的父亲是个农奴，也就是说，是个奴隶。这表明，任何社会地位都不能妨碍人走向上帝。甚至存在这样一种对比：那些满足于自己在社会中居首地位的人，比受苦的奴隶更不具备爱上帝的能力。
  - type: paragraph
    text:
      ru: 'Так что в нашем подходе к жизни мы, христиане, не должны мыслить так, как мыслил, скажем, Маркс. У Бога Своя правда. И Силуан говорит: «Один имеет послушание быть царем, другой имеет послушание быть патриархом, третий – еще какое-нибудь достоинство, четвертый простой рабочий». И он добавляет: «И это неважно»[123]. Он сам был рабочим и не завидовал императору. Он проходил свою военную службу в императорской гвардии и видел Александра III, участвуя в парадах. И не было в нем следа зависти, но он просто говорит: «Это неважно. Но кто больше любит, тот в вечности ближе будет к Богу, к Отцу и ко Христу». И тогда исполнятся слова Христа:«хочу, чтобы там, где Я, и... слуга Мойбыл» (см.Ин.12:26, 17:24), иначе говоря, «чтобы слуга-верующий был подобен Ему во всем как друг» (см.Ин.15:14).'
      cn: 所以，在我们对待生活的态度上，我们基督徒不应该像，比如说，马克思那样思考。上帝有祂自己的真理。西鲁安说：「有人蒙召作君王，另有人蒙召作宗主教，第三个人蒙召担任某种尊贵的职位，第四个人只是一个普通的工人。」他补充道：「这并不重要」[123]。他自己曾是一名工人，并且不嫉妒皇帝。他曾在皇家卫队服役，参与过阅兵，并见过亚历山大三世。他心里没有一丝嫉妒的痕迹，但他只是说：「这并不重要。但谁爱得更多，谁在永恒中就更接近上帝、接近圣父和基督。」如此，基督的话语就得以应验：「我愿我在哪里，我的仆人也（在那里）」(参约翰福音 12:26，17:24)，换句话说，「愿信主的仆人在凡事上都像祂，如同朋友一般」(参约翰福音 15:14)。
  - type: paragraph
    text:
      ru: Простите и молитесь за меня. Не идите на испытание путей Божиих, как только со страхом и осторожностью, потому что пути Божии непонятны для человека. Они часто имеют совсем особый характер, и в Писании сказано:«пути Мои – не пути ваши»(см.Ис.55:8). Так мы освобождаемся от общепринятого мышления, свойственного, скажем, при строении государственной жизни. Самое главное для нас – любить Бога«всем сердцем, всем умом», всею силою – всем существом нашим (см.Мк.12:30)...
      cn: 请宽恕并为我祷告。不要去考验上帝的道路，只当带着敬畏和谨慎，因为上帝的道路人所不解。它们常常具有截然不同的特质，圣经中说：「我的道路非同你们的道路」（参 以赛亚书 55:8）。如此，我们便从那种普遍接受的思维方式中得以解脱，例如，在构建国家生活时所特有的。对我们来说，最重要的就是「全心、全意、全力」——我们全部的生命来爱上帝（参 马可福音 12:30）。
- type: heading1
  text:
    ru: 'Беседа 18: Путь к богоподобию[124]'
    cn: '讲论 18: 肖神之路[124]'
  children:
  - type: paragraph
    text:
      ru: Могут ли стать духовными плотская любовь и артистическое вдохновение? Прп. Силуан о борьбе со своим характером. Об изначальной святости Богородицы. Победа над помыслами сверхкосмична. О страстной и о Божественной любви. Как прп. Силуан перешел в вечность. Бессилие философии и науки для духовной жизни. Дух заповедей как состояние. «Чем совершеннее любовь, тем святее жизнь».
      cn: '肉身之爱与艺术灵感能否圣化？

        圣西卢安长老论与自身性情的搏斗。

        论圣母原初的圣洁。

        战胜意念是超宇宙的。

        论情欲之爱与神圣之爱。

        圣西卢安长老如何进入永恒。

        哲学与科学于属灵生命之无能为力。

        诫命之灵乃是一种状态。

        「爱越是完全，生活就越圣洁。」'
  - type: paragraph
    text:
      ru: Снова я радуюсь быть с вами, хотя и силы мои совершенно оставили меня. Некто из вас недавно мне задал много вопросов, дать ответы на которые я не в силах, ибо«мы ходимне твердым знанием, новерою»(ср.2Кор.5:7) – в Божество Христа.
      cn: 我再次欢喜与你们同在，尽管我的力量已完全离弃了我。你们中有人最近问了我许多问题，我无力回答，因为「我们行事为人，不是凭着确凿的知识，而是凭着信心」（参阅2哥林多后书 5:7）——相信基督的神性。
  - type: paragraph
    text:
      ru: 'Во Франции некий ребенок, ставший впоследствии священником, меня спросил: «А почему это так?» Не зная, что ответить, я сказал: «Потому!», и он остался доволен этим ответом. И мы часто встречаемся с этой сложностью, будучи поставлены уже пред свершившимся фактом, видимым и осязаемым. И если кто-нибудь нас спросит: «Почему это так?», то мы не в силах дать ответ. Ибо мы предстоим всегда пред чудом, пред актом творения этого мира, который превыше человека. Человеку надлежит приобщиться Богу на веки вечные и унаследовать полноту Божества. Итак, каждый раз, когда мы подавлены нашим неведением и недопониманием, – все тот же ответ: Бог творит мир согласно Своим замыслам, которые для нас непостижимы.'
      cn: 在法国，有个孩子，后来成为了神父的，问我：「这为什么会这样呢？」我不知如何回答，便说：「就是因为这样！」而他对这个回答感到满意。而我们经常遇到这种困境，当我们面对着一个可见可触、已然发生的事实。如果有人问我们：「这为什么会这样呢？」我们便无力给出回答。因为我们总是面对着奇迹，面对着这世界的创造之举，那是超乎人所能及的。人理当归属于上帝，直到永永远远，并承受上帝之丰盛。因此，每当我们因自己的无知和不解而感到沮丧时——答案始终是：上帝按照祂自己的旨意创造世界，这些旨意是我们无法领会的。
  - type: paragraph
    text:
      ru: Если мы знаем конечную цель Бога, если мы веруем во Христа как нашего Творца, как Бога, Который есть Дух Абсолютный, Безначальный, – то мы чувствуем себя как бы во свете, помогающем не претыкаться нам на разные камни – суровые камни всяких сомнений (ср.Ин.11:9). И, следуя заповедям Христа, мы как бы совершаем путешествие разумное, но тем не менее, по существу, все остается тайной.
      cn: 如果我们知晓上帝的最终目标，如果我们信仰基督是我们的创造主，是那绝对的、无始的灵之神，那么我们就会感觉自己仿佛置身于光明之中，这光明帮助我们不至于跌倒在各种磐石上——即各种疑虑的坚硬磐石（参阅约翰福音 11:9）。并且，遵循基督的诫命，我们仿佛踏上了一段理智的旅程，然而，本质上一切仍是奥秘。
  - type: paragraph
    text:
      ru: Вопрос. Каким образом плотские, естественные дарования человека превращаются в духовные?
      cn: 问题：人的属肉体、自然的天赋是如何转变为属灵的呢？
  - type: paragraph
    text:
      ru: 'Этот вопрос возник в связи с тем, что пишет прп.Иоанн Лествичник. Он наблюдал такие явления: некоторые люди, страдавшие до одержимости от страстных движений и от страстей, в конце концов победили их[125]. Получается так, что кто не имел этой борьбы, тот как будто бы и не знает, в чем дело. Как объяснить? Как, например, у прп. Марии Египетской, св. Марии Магдалины и др. плотская любовь до одержимости вдруг стала Божественной? И сколько людей – может быть, большинство – остается почти нетронутыми в своем неведении! Ответить на этот вопрос я так же не могу, как не мог ответить на некоторые другие вопросы «почему?» и «что делать?».'
      cn: 这个问题产生，是因为圣梯约翰所写。他观察到这样的现象：有些人，遭受着近乎着魔的情欲冲动和私欲的痛苦，最终战胜了它们[125]。结果是，那些未曾经历这种挣扎的人，似乎并不了解其中的缘由。如何解释呢？例如，在埃及的圣玛丽亚长老、圣抹大拉的玛丽亚以及其他圣徒身上，近乎着魔的肉体之爱怎会突然变得神圣起来？而有多少人——也许是大多数人——几乎未被触动，仍在他们的无知之中！我也无法回答这个问题，就像我无法回答其他一些「为什么？」和「该怎么办？」的问题一样。
  - type: paragraph
    text:
      ru: Сам я заметил, что те, которые одарены каким-нибудь артистическим талантом, вдохновляются в духовной жизни скорее, чем те, которые этих дарований не имеют и даже иногда не знают, что значит вдохновение.
      cn: 我本人注意到，那些赋有某种艺术才能的人，在灵性生活中更容易获得灵感，相比那些不具备这些恩赐、甚至有时不明白灵感为何物的人。
  - type: paragraph
    text:
      ru: 'Но когда мы коснулись этих вопросов в беседе с прп. Силуаном, то тут все теории разрушились. Вопрос был поставлен так: «Как будто бы человек может обладать некоторыми способностями и талантами. И если у него нет этих талантов, то что ему делать? Он ничего не понимает, ничего не ищет, ничего не жаждет».'
      cn: 然而，当我们与圣西卢安（St. Silouan）交谈中触及这些问题时，那时，所有的理论都瓦解了。问题是这样提出的：「仿佛人可能拥有某些才能和天赋。如果他没有这些天赋，那他该怎么办？他什么也不明白，什么也不寻求，什么也不渴望。」
  - type: paragraph
    text:
      ru: 'Тогда же мы остановились со старцем Силуаном на вопросе о людях, одержимых страстями. У некоторых страсти принимают слишком бурную форму, которая омрачает ум, и человек «делает то, что не хочет» (см.Рим.7:16), как говорит апостол Павел. И мы отметили некоторые факты, когда путем аскетических подвигов некоторые монахи сумели сломать свой характер – буйный, бурный, страстный – и стали людьми кроткими и тихими: больше, чем те, которые по природе своей были таковыми.'
      cn: 那时，我们和圣西卢安长老就着被情欲所辖制的人们的问题停了下来。对某些人而言，情欲表现得过于猛烈，以至于遮蔽了心智，人便「行他所不愿意的」（参罗马书 7:16），正如使徒保罗所说。我们也注意到了一些事实，当通过苦修的努力，某些修士成功地打破了自己那狂暴的、猛烈的、充满情欲的性格，成为性情温顺安静的人：甚至超过了那些天生如此的人。
  - type: paragraph
    text:
      ru: 'В этой беседе я спросил старца Силуана:'
      cn: 在这段对话中，我问了长老圣西卢安：
  - type: paragraph
    text:
      ru: – Действительно, получается так, что как будто бы лучше сначала быть одержимым страстями и потом начать битву за чистоту жизни, которую требуют заповеди Христа.
      cn: ——确实，结果似乎是这样：仿佛最好是先被情欲所胜，然后再开始为基督的诫命所要求的生命洁净而争战。
  - type: paragraph
    text:
      ru: 'Он сказал:'
      cn: 他说：
  - type: paragraph
    text:
      ru: '– Да, те, которые борются с естеством своим страстным, имеют некоторое преимущество, потому что для них этот вопрос принимает трагическую форму и напряжение. Но если взять пример Божией Матери, то все наши теории рушатся. Она по естеству всегда была кроткой и тихой, и, будучи таковой, Она дошла до способности воспринять Божественное Слово. Без каких бы то ни было страстных буйств, с детских лет Она вошла в молитву и достигла высочайших мер совершенства. Если, не обладая страстями и не страдая от их буйной силы, Божия Матерь взошла на такую ступень кротости и святости, то получается, что вовсе не надо быть носителем больших страстей, сомнений и вообще трагических конфликтов внутри самого себя – то есть того состояния, о котором жалуется А. С. Пушкин:'
      cn: ——是的，那些与自身情欲本性搏斗的人，具有某种优势，因为对他们而言，这个问题呈现出悲剧性的形式和紧张状态。但若以圣母为例，我们所有的理论都将崩溃。她本性上一直都是温柔而宁静的，并籍此达到了领受圣言的能力。她没有任何情欲的狂暴，自童年起便进入了祷告，并达到了完美的至高尺度。如果圣母在没有情欲、也没有因其狂暴力量而受苦的情况下，达到了如此谦和与圣洁的境地，那么这表明，人根本无需承载巨大的情欲、疑虑以及内在的悲剧性冲突——也就是普希金所抱怨的那种状态：
  - type: paragraph
    text:
      ru: Кто меня враждебной властью Из ничтожества воззвал, Душу мне наполнил страстью, Ум сомненьем взволновал?[126]
      cn: '谁以敌对的权能，

        将我从虚无中唤出，

        使我的灵魂满溢热情，

        又让我的心智为疑虑所激荡？[126]'
  - type: paragraph
    text:
      ru: Это – прекрасное описание человека страстного.
      cn: 这是对一个热情之人的美妙描述。
  - type: paragraph
    text:
      ru: 'Итак, мы стоим пред тайной творения вечных богов, которые вечно будут пребывать как друзья и родственники-братья Иисуса Христа (см.Ин.15:14, 20:17) и как чада Небесного Отца, – в этом цель. Но мы рождаемся, взятые от земли. И возьмем данный момент: как, «взятые от земли», мы сейчас думаем о том, что принадлежит сфере духа?'
      cn: 于是，我们面对着创造永恒的诸神的奥秘，他们将永远作为耶稣基督的朋友和亲属弟兄 (参见约翰福音 15:14，20:17)，并作为天父的儿女而存留——这便是目标。但我们生来是取自尘土的。让我们审视此刻：作为「取自尘土」的我们，现在如何思考那属于灵性领域的事物呢？
  - type: paragraph
    text:
      ru: 'С самим Силуаном что было? – В бурные годы его юности он пал с женщиной. В начале монашества, когда он пришел в монастырь, у него было искушение. Мы не знаем, в какой форме и какой силы, но только духовник ему сказал: «Не принимай страстных плотских помыслов», и он стал бороться с этим. И за сорок шесть лет он не принял ни одной страстной мысли[127]. Как это могло произойти, мы не понимаем. Я в житии его счел необходимым указать, что это был человек чрезвычайной силы[128]. И будучи нормально здоровым, как получилось, что он за полвека не имел плотской мысли? Мы этого вообразить не можем. Но с ним, как правильно кто-то заметил, это произошло после явления ему Христа. После того, как он испытал это видение – в одно мгновение, он сказал, что все тело его было исполнено Духа Святого. А кто не имел этого опыта, какой любовью будут они преодолевать свои плотские страсти, если само естество как бы принуждает человека к некоторым актам? Законprocreation(деторождения) есть космический закон. И потому, когда кто побеждает этот закон в самом себе, тот становится в некоторых аспектах своей жизни уже «сверхкосмическим», то есть вечным.'
      cn: 圣西卢安自己呢，发生了什么？——在他动荡的青年时期，他曾与一女子犯了罪。在他初入修道院时，他曾遭遇诱惑。我们不知道这诱惑的形式和强度如何，但他的属灵导师只告诉他：「不要接纳带有情欲的肉体意念。」他就开始为此而奋斗。在四十六年里，他没有接纳过一个带有情欲的意念[127]。这如何可能发生，我们不得其解。我在他的圣徒传中，认为有必要指出他是一个拥有非凡力量的人[128]。他本是一个身体健康的人，怎么可能在半个世纪里不曾有肉体意念呢？我们对此无法想象。但对他而言，正如有人恰当地指出，这发生在基督向他显现之后。在他经历这个异象之后——就在一瞬间，他说他的整个身体都充满了圣灵。而那些没有这种经历的人，他们将用何种爱来克服自己的肉体情欲呢？如果连人的本性似乎都在迫使人做出某些行为。生育（繁衍）的法则是一个宇宙法则。因此，当有人在自身内战胜这个法则时，那人就在其生命的某些方面已经成为「超越宇宙的」，亦即永恒的。
  - type: paragraph
    text:
      ru: 'Один англичанин, очень образованный, хороший человек мне говорил: «Мне непонятно, почему грешно любить не свою жену? Я не вижу греха в такой любви». И как можно ему объяснить это? Но мы видим, что апостол Павел, перечисляя все грехи, которые отделяют нас от Бога, больше всего говорит о плотской страсти (см.1Кор.6:9;Гал.5:19;Еф.5:3; Кол.3и т.д.). Как получилось, что этот род любви противоречит Божественной любви? – Мы можем это констатировать, даже на своем опыте, но объяснить – не можем: «Почему так?» Почему в акте творения вечных богов понадобился этот негативный опыт, мы этого не понимаем. Тем не менее Откровение говорит, что некоторые войдут за завесу восьмого дня.'
      cn: 一位英国人，他受过高等教育，为人很好，他对我说：「我不明白，为什么爱非己之妻是罪？我在这种爱中看不到罪。」又如何能向他解释呢？但我们看到，使徒保罗在列举所有使我们与上帝分离的罪时，最多谈到肉体的激情（参见哥林多前书 6:9，加拉太书 5:19，以弗所书 5:3；歌罗西书 3 等）。这种爱如何竟与神圣之爱相悖呢？——我们能够证实这一点，甚至从我们自己的经验中也能证实，但我们却无法解释：「为什么会这样？」为什么在创造永恒的神祇之举中需要这种负面经验，我们不理解这一点。尽管如此，《启示录》说，有些人将进入第八日的幔内。
  - type: paragraph
    text:
      ru: 'Покамест мы не дошли до этого состояния, когда мы свободны от всего: от страстей и всех земных форм их – от нашего «тела», когда мы способны к Божественной жизни. И Силуан вкусил на мгновение любовь Христа – до такой степени, что ему хотелось страдать за Христа. Иначе говоря, это услаждение Божественной любви так сильно, что, чтобы умерить и успокоить его, надо пройти мученическую кончину...'
      cn: 直到我们达到这种状态，那时我们摆脱了一切：摆脱了情欲及其一切属世的形式——摆脱了我们的「肉体」，那时我们能够过上属神的生活。圣西卢安也曾片刻尝到基督的爱，到了他渴望为基督受苦的程度。换言之，这属神之爱的甘甜是如此强烈，以至于为了平息和安抚它，必须经历殉道而死……
  - type: paragraph
    text:
      ru: 'Опять: мы не понимаем ничего. И когда мы обсуждаем этот вопрос: как плотское превращается в духовное, то мы безгласны. Но вот что происходит: в житии старца на основании его записок я пишу, что, желая молиться чисто, он видел бесов, наполняющих его келью. И когда он хотел поклониться Богу пред иконой, то между иконой и им стояла фигура огромного размера беса, который ожидал поклонения себе. И когда он сел на табурет и стал молиться: «Господи, в чем дело? Я хочу Тебе молиться и не могу». Господь ему указал на гордость как причину его страданий. Тогда Силуан молился, крича Богу: «Но помоги мне! Что я могу мыслить и делать, чтобы мне смириться?» Господь говорит: «Держи ум твой во аде и не отчаивайся»[129]. Что можем мы сказать об этих словах? – Только одно: в сущности, ничего не понятно – что значит «держать ум во аде»? Однако далее мы читаем у Силуана: «Я стал так делать, как научил меня Господь, и ум мой очистился... и Дух свидетельствовал спасение»[130]. Так он перешел в иное состояние, которое бывает редко даже в истории христианской Церкви. Он перешел в это состояние благодаря своей вере и дару слышать слово Самого Христа.'
      cn: 再次：我们一无所知。而当我们讨论这个问题时：肉体如何转化为属灵的，我们便无言以对。但事情是这样的：在长老的生平中，根据他的札记我写道，他渴望洁净地祈祷时，看见魔鬼充满了他的隐修室。而当他想在圣像前向上帝敬拜时，一个身形庞大的魔鬼立于圣像与他之间，期待自身受拜。于是他坐在一张凳子上，开始祈祷说：「主啊，怎么回事？我想要向祢祈祷，却不能。」上帝向他指明，骄傲是他苦难的原因。于是圣西卢安向上帝呼喊着祈祷：「但请祢帮助我！我能思想和做什么，才能使自己谦卑呢？」上帝说：「将你的心智置于阴间，不要绝望」[129]。对于这些话，我们能说什么呢？——唯有一点：本质上，我们一无所明——「将心智置于阴间」是什么意思呢？然而，我们接着读到圣西卢安写道：「我开始照着上帝所教导我的去行，我的心智得以洁净……圣灵见证了救恩」[130]。他就这样进入了另一种境界，这在基督教会的历史中，也是罕见的。他之所以进入这种境界，是借着他的信德和倾听基督本人的话语的恩赐。
  - type: paragraph
    text:
      ru: 'Так и мы живем только верой во Христа, но ничего по-настоящему объяснить ни научно, ни философски, ни аскетически мы не можем. В начале русской революции в семнадцатом году были дебаты о безбожии, и министр просвещения Луначарский сказал: «Мне пришлось много путешествовать, посетить много кафедральных соборов, я видел большие произведения живописи, чудеса архитектуры, я слышал музыку, которою услаждался; но Бога я не видел». Тогда встал один старик-врач и сказал: «Я хирург. Теперь я кончил свою работу, но расскажу вам про мое прошлое. Мне пришлось делать много операций, и трепанаций черепа, и открывать грудь, видеть сердце, я ощущал в руках мозг человека, но мысли там я не нашел». Вы видите, какая тайна. Что такое мозг? – «кусок мяса», а каким образом рождается в нем мысль о вечности? И это явление совсем другого порядка.'
      cn: 我们也是如此，只凭着对基督的信仰而活，但我们无法从科学、哲学或苦修的层面真正解释任何事情。在一九一七年俄国革命之初，曾有过关于无神论的辩论，教育部长卢那察尔斯基说道：「我曾游历多方，参观过许多座主教座堂，我见过宏伟的绘画作品，建筑的奇迹，我聆听过令我愉悦的音乐；但我没有见到上帝。」于是，一位老年医生站起来说：「我是一名外科医生。现在我已经完成了我的工作，但我想告诉你们我的过往。我曾做过很多手术，包括颅骨穿孔术，也曾开胸，看见心脏，我曾用手触摸人的大脑，但我并未在那里找到思想。」你们看，这是何等奥秘！大脑是什么？——「一块肉」，然而，永恒的思想又如何从中诞生？这是一个完全不同层面的现象。
  - type: paragraph
    text:
      ru: 'Итак, каким образом страстная любовь прелагается в Божественную? – Мы знаем, что одержимые страстной любовью умирали, как ее жертвы, и немногие покаянием переходили в план Божественной любви. И этот переход от естественной, физической любви к любви Божественной связан с болезненным процессом многолетней аскетической борьбы. Почему у некоторых борьба с этой страстью, которую монах давно уже не хочет, берет тридцать–сорок лет, а у Силуана эта страсть была отрезана в одну секунду? Как мы можем объяснить это явление? С отцом N., не раз гуляя или сидя, мы разговаривали о том, что когда мы посмотрим кругом себя, то все, что бы ни было, нам кажется невероятным, «невозможным». Так оно и есть: мы ничего не понимаем – все «невозможно».'
      cn: 那么，情欲之爱是怎样转变为神圣之爱的呢？我们知道，被情欲之爱所困的人，作为它的牺牲品而亡；只有少数人藉着悔改，才转化到神圣之爱的境界。而这种从自然的、肉体的爱到神圣之爱的转变，与多年苦修争战的痛苦历程相关联。为什么对于一些修道士来说，与这种他早已不愿拥有的情欲的争战，需要三四十年的时间，而在圣西卢安身上，这种情欲却在顷刻间被斩断了呢？我们如何能解释这种现象？我们不止一次地与N神父散步或坐谈时，讨论过当我们环顾四周，万事万物都令我们感到不可思议，「不可能的」。事实正是如此：我们什么都不明白——一切都「不可能」。
  - type: paragraph
    text:
      ru: 'Но какой вывод из всего этого мы делаем? – Старец Силуан говорит: «Я стал так делать, как научил меня Господь... и ум мой очистился... и Дух свидетельствовал спасение»[131], которое есть переход в измерение вечности от измерений времени. Так теперь и для нас: объяснить ничего по-настоящему мы не можем, но, когда мы заповедь Христа принимаем как единственный закон всего нашего бытия – и временного, и вечного, тогда мы совершаем путь к тому, чего не может понять большинство людей, которые не хранят заповедей. И получается так: когда мы храним эти заповеди, то дух, заключенный в них, становится, странным образом, нашим состоянием. И тогда все в нас меняется, и все процессы нашего внутреннего бытия становятся другими. Но самый трудный момент этого вопроса все-таки остается: если Силуана посетил Господь и дал ему такую силу, что за полвека при самом сильном теле он никогда не принял плотской мысли, то что делать нам? – Некоторые говорят: «Надо, чтобы Господь Сам пришел к нам, вселился в нас и делал бы так, как Он заповедал, потому что по своей воле и своим подвигом мы не можем перейти в это состояние». И если сами мы не можем, то какая неправда со стороны Бога осуждать нас, – и даже на вечные муки!'
      cn: 然而，我们从这一切中得出什么结论呢？——圣西卢安长老说：「我照着上主所教导我的去行……我的心思意念就洁净了……圣灵也见证了救恩」[131]，这救恩就是从时间的维度过渡到永恒的维度。如今对我们而言亦是如此：我们无法真正解释任何事，但当我们把基督的诫命视为我们整个存有——无论是暂时的还是永恒的——的唯一法则时，我们便踏上了一条道路，这条道路是大多数不遵守诫命的人所无法理解的。结果便是：当我们遵守这些诫命时，那么蕴含在其中的精神，便奇妙地成为了我们的状态。于是我们里面的一切都改变了，我们内在存有的一切过程也都变得不同了。然而，这个问题的最困难之处依然存在：如果上主曾临访圣西卢安，并赐予他如此大的力量，以至于在半个世纪里，尽管他拥有强健的身体，却从未接受过肉体的思想，那么我们该怎么办呢？——有些人说：「需要上主亲自来到我们这里，内住于我们之中，并照着祂所吩咐的去行，因为凭着我们自己的意愿和我们的苦修，我们无法进入这种状态。」而如果我们自己做不到，那么上帝审判我们又何其不公呢，——甚至判处我们永恒的痛苦！
  - type: paragraph
    text:
      ru: 'Как показывает нам ежечасный опыт нашей жизни, через нас проходят энергии, неведомые нам, которые порождают те или иные движения. Человек есть существо «инодвижное», по-гречески ἑτεροκίνητος. Если мы такие ἑτεροκίνητοι, то почему Бог осуждает нас? – Это людям непонятно. Если мы подумаем, что человек – это марионетка, которая всецело движется другой волей, то Бог бесчестен: если прп. Силуан молился за весь мир с глубоким плачем, почему другим не приходит эта молитва, а только он молился так? Так философски следуя, мы не можем перейти от нашего плотского жития к жизни чистого духа... Если вы хотите идти верным путем – каким Сам Господь заповедал, – «не претыкаясь ни о какие камни» (как бывает, когда идем вне света заповеди) (см.Ин.12:35), то жизнь определяется иным порядком. И тогда наше плотское состояние переходит в духовное. Как это возможно, я не понимаю; как плоть становится духом, это необъяснимо для меня.'
      cn: 正如我们生命中每时每刻的经验向我们展示的，某些我们未知、穿过我们自身的能量，产生了这样或那样的运动。人是一种「受异力推动」的受造物，希腊语称作 ἑτεροκίνητος。如果我们是这样的 ἑτεροκίνητοι，那么上帝为何要谴责我们？——这世人难以理解。如果我们认为人是一个完全被其他意志所驱动的木偶，那么上帝就是不公义的：如果可敬者圣西卢安为整个世界深切哭泣地祈祷，为什么这种祈祷没有临到其他人，而唯独他如此祈祷呢？如此循着哲学思路，我们就无法从我们肉体的生命过渡到纯粹灵性的生命……如果你们想走正道——即上主亲自所吩咐的——「不至于跌倒在任何石头上」（就像我们行走在诫命之光外时所发生的那样）(参约翰福音 12:35)，那么生命就由另一种秩序来决定。如此一来，我们肉体的状态便过渡到灵性的状态。这如何可能，我不明白；肉体如何成为灵，这对我来说是无法解释的。
  - type: paragraph
    text:
      ru: 'Мне пришлось быть духовником на Афоне, где тысячи людей подвизаются, чтобы сохранить заповеди Христа. Я наблюдал людей самых простых, у которых не было никакого внешнего образования мира сего, но они пребывали в состоянии благодати: и их движения, их реакции на происходящее были иными – не так, как у других. Так, когда монах встречается с каким-нибудь грубым существом, то такой человек вызывает в нем сострадание, и монах молится за него: «Господи, исцели человека, раба Твоего». И молитвою от одного человека переходит ко многим и от многих ко всему Адаму. Этот процесс мы можем наблюдать и применять даже в нашей жизни. Но как это осуществляется? – Конечно, присутствием Бога. Если Бог не хочет известной нечистоты и мы воздерживаемся от нее, то Он приходит и Ему удобнее быть с нами. Но если мы принимаем недобрые мысли, то Ему трудно быть с нами, поскольку нет никакого согласия и никакой гармонии между Духом нашего Бога и нами самими. Так что сегодня мы остановимся на этом недоумении – мы по-настоящему ничего не знаем. Был гениальный человек в Греции – Сократ, который сказал: «Οἶδα ὅτι οὐδὲν οἶδα» («Знаю, что я ничего не знаю»).'
      cn: 我曾作为神父在阿索斯山，那里有成千上万的人刻苦修道，为了遵守基督的诫命。我观察到那些最纯朴的人，他们没有任何属世的教育，但他们却常处于恩典的状态：他们的举动，他们对所发生之事的反应都与众不同——不像其他人那样。例如，当一位修士遇到某种粗暴的人时，这样的人在他心中激起了怜悯，这位修士就为他祈祷：「上主啊，医治祢的仆人。」借着祈祷，这怜悯从一个人身上转移到许多人身上，又从许多人身上转移到全人类（亚当）身上。我们可以观察到这个过程，甚至可以在我们的生活中运用。但这又是如何实现的呢？——当然，是借着上帝的临在。如果上帝不喜悦某种不洁，而我们又戒绝它，那么祂就会降临，并且祂便更容易与我们同在。但如果我们接受不善的意念，那么祂就难以与我们同在，因为我们的上帝的圣灵与我们自己之间没有任何一致与和谐。所以今天我们停留在这种困惑上——我们其实什么都不知道。希腊曾有一位天才人物——苏格拉底，他曾说过：「Οἶδα ὅτι οὐδὲν οἶδα」（「我只知道自己一无所知」）。
  - type: paragraph
    text:
      ru: 'Так и мы, христиане, знаем только то, что следование заповедям Христа приводит к определенным результатам. А именно: к тому, что человек переходит от земных измерений к измерениям вечной жизни спасенных. И когда он видит злодея, это естественным порядком вызывает в нем сострадание к нему – к человеку, объятому смертью. Мы знаем это состояние, но объяснить, как оно бывает, не можем. Итак, можно сделать такой вывод из нашей сегодняшней беседы: «Я знаю, что я ничего не знаю. Однако если я живу по заповедям Христа, то меня охватывает огонь Его любви». Так, плотская любовь становится уже любовью Божественною не иначе как через веру во Христа и через хранение Его заповедей.'
      cn: 同样，我们基督徒只知道遵行基督的诫命会带来某些确定的结果。即是：人从属世的维度转向蒙受救赎者之永生维度。当他看见一个恶人时，这自然而然地在他里面引发了对那个恶人的怜悯——对这个被死亡所笼罩的人的怜悯。我们知道这种状态，但无法解释它是如何发生的。因此，我们可以从今天的谈话中得出这样的结论：「我知道我一无所知。然而，如果我按照基督的诫命生活，祂的爱火就会将我包围。」如此，属肉体的爱唯有通过对基督的信仰并遵守祂的诫命，才能成为神圣的爱。
  - type: paragraph
    text:
      ru: 'Силуан говорил про Божию Матерь, что мало что знаем мы из Ее жизни на земле и что полноту любви Ее к Сыну и Богу Своему мы разуметь не можем. «Но мы знаем, что чем больше любовь, тем больше страданий душе»[132]. Итак, если мы вступаем на монашеский путь с любовью ко Христу, то совершенно естественным порядком получается, что наш дух страдает от боли. И дальше Силуан говорит: «Чем полнее любовь, тем полнее познание Бога». Значит, в состоянии любви мы познаем Бога Любви. И он продолжает: «Чем горячее любовь, тем пламеннее молитва»[133]. И все эти три положения, когда я читаю их, меня поражают, но самое сильное впечатление производит последнее, четвертое положение, действительно уже сверхчеловеческое: «Чем совершеннее любовь, тем святее жизнь»[134].'
      cn: 西卢安谈到圣母时说，我们对她在世上的生平知之甚少，也无法理解她对她的圣子和上帝之爱的完全。「但我们知道，爱越深，灵魂所受的痛苦就越多」[132]。因此，如果我们怀着对基督的爱踏上修道之路，那么我们的精神饱受痛苦便是完全自然而然的结果。西卢安接着说：「爱越完全，对上帝的认识就越完全。」这意味着，在爱之中，我们认识爱之上帝。他又继续说：「爱越炽热，祷告就越恳切」[133]。当我读到这所有三点时，它们都令我惊叹，但最后一个，第四点，给我留下了最深刻的印象，这确实已经是超越人性的了：「爱越完善，生命就越圣洁」[134]。
  - type: paragraph
    text:
      ru: 'Если Божия Матерь была охвачена огнем совершенной любви, то естественное следствие отсюда: все Ее движения мысли и сердца – это все было свято. И так мы становимся ἑτεροκίνητοι, потому что эта любовь уже не человеческая, а безначальная любовь Самого Бога. Эта Божественная любовь становится содержанием нашей собственной жизни. И когда мы познаем сие и достигнем этого состояния, тогда уйдут от нас недоумения. И как Господь сказал, что, «когда вы узрите Меня,в тот день вы не спросите Меня ни о чем»(Ин.16:23). Однако пока мы в процессе борьбы со страстями. И не надо оправдывать себя легко за какие-нибудь поступки наши или слова: монаху свойственно быть строгим к себе. Когда мы знаем мысль Христа, то всякое отступление от Христовых заповедей мы рассматриваем как преступление.'
      cn: 如果圣母被完全之爱的火焰所笼罩，那么由此而来的自然结果便是：她所有的思想和心灵的活动——这一切都是圣洁的。于是我们成为了 ἑτεροκίνητοι，因为这份爱不再是属人的，而是上帝本身那无始无终的爱。这份神圣之爱成为了我们自身生命的内容。当我们认识到这一点并达到这种状态时，困惑便会从我们身上离去。正如主曾说：「当你们看见我时，在那一天，你们将不再问我任何事」（约翰福音 16:23）。然而，目前我们仍在与情欲搏斗的过程中。并且，不可轻易为我们自己的任何行为或言语开脱：严于律己是修士的本分。当我们认识基督的思想时，任何偏离基督诫命的行为，我们都视之为罪行。
  - type: paragraph
    text:
      ru: 'Снова и снова мы будем говорить о том, каким образом создается подобие Христу в нас. В тропаре о преподобных говорится:В тебе, отче, известно спасеся еже по образу, приим бо крест, последовал ecu Христу, и деючи учил ecu презирати убо плоть, преходит бо, прилежати же о душе, вещи бессмертней, темже и со ангелы сорадуется, преподобне отче, дух твой... Когда мы говорим:Преподобный отче Силуане, моли Бога о нас, мы говорим, что он подобен Христу и весьма подобен – «преподобен». По-гречески это слово не существует, и в этом смысле я люблю больше тропарь по-славянски, чем по-гречески, потому что «...ἐν σοί, ὁσιε πάτερ» – «ὁσιος» не носит в себе этой идеи: сначала по образу созданный и потом по подобию. Как мы можем стать «подобными», а еще больше – «преподобными», «весьма подобными»? В этом тропаре большой смысл –такмы должны жить: для монахов полагается «преподобная» жизнь... Для каждого человека это свой особый путь, но каждый по плану Божию должен уподобиться Христу во всем и стать преподобным. И это моя молитва, чтобы все вы стали преподобными отцами и преподобными матерями.'
      cn: '我们将反复地谈论，如何在我们里面塑造肖似基督的样式。在纪念敬虔圣人的颂词中说：


        父啊，在祢里面，按着形像所存的得以救赎，这是人所共知的；因为祢背负了十字架，跟从了基督，并且以行动教导人轻看这必朽的肉体，因它终将逝去，转而关顾那不朽的灵魂。因此，敬虔的父啊，祢的灵魂也与天使一同欢欣……


        当我们说：「敬虔的西路亚圣父啊，为我们向上帝祈祷！」我们是在说他肖似基督，并且极其肖似——「преподобен」。在希腊语中，这个词不存在，在这个意义上，我更喜欢斯拉夫语的颂词，而不是希腊语的颂词，因为「...ἐν σοί, ὁσιε πάτερ」——「ὁσιος」本身不包含这个概念：先是按着形像被造，然后是按着肖似。我们如何才能变得「肖似」，甚至更进一步，成为「преподобными」，「极其肖似」呢？这个颂词意义重大——我们应该这样生活：对于修士们来说，这是一种「преподобная」的生活……对于每个人来说，这都有其独特的道路，但每个人都应该按照上帝的计划，在一切事上肖似基督，并成为 преподобный。这也是我的祷告，愿你们所有人都能成为 преподобный 圣父和 преподобная 圣母。'
  - type: paragraph
    text:
      ru: Испытания – это другой вопрос. И мы попробуем его коснуться с большим страхом, ибо испытания проходят уже на высоте последних определений. Когда же кончается жизнь человека, то он ответственен за все свои дела. И ему предстоит решить и определиться на вечность...
      cn: 试炼——这是另一个问题。我们将带着巨大的畏惧来尝试触及它，因为试炼已在最终定论的高度上进行。当一个人的生命走到尽头时，他将对自己的所有行为负责。他将要决定并为永恒而定下归宿……
- type: heading1
  text:
    ru: 'Беседа 19: О нашем изначальном богоподобии и падении[135]'
    cn: '讲论十九: 论我们本初的肖乎上帝与堕落[135]'
  children:
  - type: paragraph
    text:
      ru: Наша основа – Откровение, а не дедукция.Мк.9:23; Лк.8иИн.10– о «спасении верою». Вера есть действенное проявление силы Божией в нас. Опасно говорить об «обожении» (Ин.10:34). Мы образ Божий, но уязвленный грехом. Об усвоении сознания «богосыновства» и реальности падения.
      cn: 我们的基础是启示，而非演绎。马可福音 9:23；路加福音 8 与约翰福音 10——关于「因信得救」。信心是上帝的德能在我们里面有力的彰显。谈论「成神」是危险的（约翰福音 10:34）。我们是上帝的肖像，但为罪所伤。关于「上帝嗣子」意识的领受，以及堕落的真实性。
  - type: paragraph
    text:
      ru: 'Сегодня я хочу говорить с вами по очень серьезному вопросу: как мы должны жить. И прошу вас быть очень внимательными.'
      cn: 今天我希望与大家谈谈一个非常严肃的问题：我们应当如何生活。并且恳请各位务必非常专注。
  - type: paragraph
    text:
      ru: 'Прошлый раз мы говорили, когда затронули проблему персоны, что мы исходим из Откровения библейского, а не из достижений нашего ума, идущего к Богу снизу. Нашего опыта недовольно для того, чтобы утверждать, что мы чада Божии. Это возможно только через Откровение, где Бог говорит о Себе, что Он почитает Себя Отцом нашим, и дал молитву «Отче наш». Так, сегодня я хочу продолжить разговор наш о необходимости иметь догматическое видение, верное, правильное, чтобы, с одной стороны, совершать наш путь«достойно звания»(Еф.4:1), а с другой действительно без порока. Этот путь лежит через неизъяснимые бездны. Однако когда приходит видение этой бездны Бога, то о каких путях говорить? – В той сфере нет ни вперед, ни назад, ни направо, ни налево, ни вверх, ни вниз: то есть нет никаких отношений. Так, величие христианского пути понимается совсем не просто. Почему я прошу вас быть очень внимательными к каждому слову? – Потому что это всем нам важно. И я говорю всем и каждому: «Do not be in a hurry!» – «Не торопитесь!» (Сам я должен торопиться, потому что я не знаю, когда во мне прекратится жизнь.)'
      cn: '上次我们谈到，当我们触及位格问题时，我们是基于圣经的启示，而非基于我们自下而上趋向上帝的心智所取得的成就。我们的经验不足以断言我们是上帝的儿女。这只有通过启示才可能，在其中上帝论及祂自己，说祂尊自己为我们的父亲，并赐予了「我们的父」的祷文。


        因此，今天我想继续我们的谈话，关于拥有正确无误的教义性视野的必要性，以便一方面，使我们的道路「与蒙召的恩相称」(以弗所书 4:1)，另一方面，确实纯全无疵。这条道路要穿过无法言喻的深渊。然而，当这上帝之深渊的异象显现时，还有什么道路可言呢？——在那领域中没有往前，也没有往后，没有向右，也没有向左，没有向上，也没有向下：也就是说，没有任何关系。因此，基督徒道路的伟大绝非轻易就能理解的。我为什么请求你们对每一个字词都格外留心呢？——因为这对我们所有人都很重要。我更对所有人，对每一个人说：「Do not be in a hurry！」——「不要着急！」（我自己必须加快脚步，因为我不知道我的生命何时会终止。）'
  - type: paragraph
    text:
      ru: Итак, сегодня мы поговорим о том, какую основную мысль мы должны иметь в себе, чтобы совершать путь безопасно и результативно. Прочитаем некоторые выдержки из Евангелия, которое для нас, конечно, Откровение par excellencë
      cn: 那么，今天我们来谈谈，我们心中当怀揣着何种核心思想，才能安全且有效地行路。我们将阅读一些福音书的摘录，对我们而言，福音书无疑是至上的启示。
  - type: paragraph
    text:
      ru: '«Иисус сказал ему: если сколько-нибудь можешь веровать, все возможно верующему. И тотчас отец отрока воскликнул со слезами: верую, Господи! помоги моему неверию»(Мк.9:23–24).'
      cn: 耶稣对他说：「你若能信，在信的人，凡事都能。」随即孩子的父亲流着泪呼喊说：「我信，主啊！求祢帮助我的不信！」(马可福音 9:23-24)
  - type: paragraph
    text:
      ru: '«Он сказал ей: дерзай, дщерь! вера твоя спасла тебя; иди с миром»(Лк.8:48).'
      cn: 他遂对她说：「女儿，放心吧！你的信德拯救了你；你平安地去吧。」（路加福音 8:48）
  - type: paragraph
    text:
      ru: '«Иисус отвечал им: не написано ли в законе вашем: Я сказал: вы боги? Если Он назвал богами тех, к которым было слово Божие, и не может нарушиться Писание, – Тому ли, Которого Отец освятил и послал в мир, вы говорите: богохульствуешь, потому что Я сказал: Я Сын Божий?»(Ин.10:34–36)'
      cn: 耶稣回答他们说：「在你们的律法上，岂不是写着：『我曾说：你们是神』吗？ 祂既称那些领受上帝之道的人为神，而经文是不能废弃的，—— 你们向那父所分别为圣、又差遣到世间来的，竟说祂是亵渎的，只因我说『我是上帝之子』吗？」(约翰福音 10:34-36)
  - type: paragraph
    text:
      ru: Сии евангельские стихи суть основа моего слова. Вера не есть нечто онтологически бездейственное или некое только психологическое состояние человека. Иначе, молясь Богу в таком состоянии, мы ничего не получаем, потому что такая вера есть не более чем психология. Таково мнение многих в современной жизни и даже тех, которые специально посвятили себя психологии как научной попытке раскрыть бытие Бога и смысл бытия.
      cn: 这些福音经文是我论述的基础。信仰并非是本体论上无所作为之物，也非人的某种仅仅是心理的状态。否则，在这种状态下向上帝祷告，我们一无所获，因为这样的信仰不过是心理活动。这是现代生活中许多人的观点，甚至包括那些专门致力于心理学，将其作为一种科学尝试以揭示上帝的存有和存有之意义的人。
  - type: paragraph
    text:
      ru: Если вы, братья мои и сестры мои, хотите действительно построить свою жизнь по-христиански, избегайте колеблющихся слов научной психологии. Поверьте, что Откровение, данное Богом человеку, есть действительно нечто соответствующее реальности вечного бытия Божественного. Вера есть – например, у больных – способность производить внутреннюю энергию, которая побеждает болезнь. Вы знаете, что очень легко поддаваться болезни и терять всякое мужество в борьбе с нею. Но вы знаете также случаи выздоровления, когда «вера твоя спасе тя» от всяких болезней, даже от слепоты. Итак, вера есть действенное проявление силы Божией в нас.
      cn: 假如你们，我的弟兄姐妹们，想要真正地以基督徒的方式建立自己的生活，就要避免科学心理学中那些摇摆不定的言语。你们要相信，上帝赐予人类的启示，确实是与神圣永恒存在之现实相符的。信仰是——例如，在病人身上——一种产生内在力量的能力，能够战胜疾病。你们知道，疾病是如此容易使人屈服，并且使人在与它抗争时失去一切勇气。但你们也知道一些康复的例子，在那时，「你的信救了你」，使你脱离一切疾病，甚至脱离失明。因此，信仰是有效彰显上帝在我们里面的力量。
  - type: paragraph
    text:
      ru: 'Приводя слова псалмопевца, Господь дает нам Откровение:«вы – боги»(Пс.81:6). И мы должны верить этому так, как это написано. Тогда мы можем построить свою жизнь, как христиане, по-настоящему. Иначе нет никакого видения цели наших поступков. Но кто-нибудь скажет: «Это небезопасно поверить, что все мы боги». И это совершенно верно. Мы знаем много случаев, когда люди теряли меру в этом. Так, мне раз пришлось читать: в Америке группа индейцев крестилась и приняла христианство. И потом, возвращаясь домой, они подумали перейти реку, по водам шагая. И в порыве своей веры все вступили на воду и утонули. Я сам, к сожалению, был свидетелем, как люди, поверив в то, что мы боги, перешли меру и потеряли настоящее сознание. И эти слова послужили ко вреду.'
      cn: 引用诗篇作者的话，上主赐给我们启示：「你们是神」(诗篇 81:6)。我们当相信这一点，正如经上所记。如此一来，我们才能真正活出基督徒的生命。否则，我们的行为就没有目标可循。然而，有人会说：「相信我们都是神，这是不安全的。」这完全正确。我们知道很多例子，当人们在此事上失去了分寸。例如，我曾读到：在美洲，有一群印第安人受洗归主，接受了基督教。接着，在回家路上，他们想踏水渡河。在他们信心的冲动下，所有人都走入水中并淹死了。遗憾的是，我自己曾亲眼目睹，人们相信我们是神，越过了分寸，失去了真正的清醒。而这些话语却造成了危害。
  - type: paragraph
    text:
      ru: Но где выход для нас? – Об этом «выходе» я и хочу говорить сегодня. Если мы принимаем Откровение, что мы созданы«по образуБожию[и] по подобию»(Быт.1:26), если мы принимаем выражение Ветхого Завета, что «человек есть бог», то как нам удержаться при таком сознании в той мере его, которая не заразила бы нас гордостью? Да, мы верим, что Бог сотворил нас по образу Своему и по подобию. Да, мы верим в то, что Он Сам хочет называться «Отче наш» и дает нам эту молитву, чтобы мы осознали себя детьми Бога Живого. Но как удержаться во смирении? Один из ярких случаев выражения этого пути мы находим у прп.Иоанна Дамаскинав его Службе об усопших, в Панихиде:Образ есмь Твоея славы, аще и язвы ношу моих прегрешений. И это и есть мера, которой мы должны держаться...
      cn: '但我们的出路何在？——我今天想谈论的正是这「出路」。如果我们接受启示，相信我们是「按着上帝的形象[和]样式」（创世记 1:26）受造的，如果我们接受旧约中「人是神」的说法，那么，我们如何才能在这样的意识下持守其分寸，不被骄傲所感染呢？是的，我们相信上帝按祂的形象和样式创造了我们。是的，我们相信祂自己愿意被称为「我们的父」，并赐给我们这祷文，使我们认识到自己是永生上帝的儿女。但我们如何才能持守谦卑呢？这一道路的一个鲜明事例，我们可以在圣约翰·大马士革的安魂礼仪中的安魂祷词中找到：


        我乃是祢荣耀的形象，虽则我背负着我的罪愆的伤痕。


        这正是我们应当持守的尺度……'
  - type: paragraph
    text:
      ru: И если мы будем говорить внутри нашего сердца, что действительно мы почтены Богом быть Его образом и подобием, и реальность нашей жизни не соответствует этой вере, то как быть, чтобы не разрушить этой веры и, с другой стороны, не потерять смирение? – Нужно носить это сознание, горькое сознание наше того, что мы живем несоответственно воле Божией, вызвавшей нас к бытию, что мы омрачили образ Его грехом. Вместо всеобъемлющей любви мы живем в раздорах, в разделениях; и исчезает из видения человеческого настоящая цель Бога. Мы как будто бы не способны воспринять познание без того, чтобы не возгордиться. Однако при христианском подходе, хотя бы человек и пребывал в наивысшем для Земли состоянии, он остается смиренным. Никакая сумма познаний, никакие высокие состояния нашего духа, действительные состояния от Бога, не делают человека гордым. Как Сам Христос, всеведущий, всемогущий, говорит:«научитесь отМене, яко кроток есмь и смирен сердцем»(Мф.11:29). Так, мне пришлось видеть на Святой Горе, а иногда и в миру, что люди пребывали в высокой мере благодати и в то же время были полны смирения.
      cn: 如果我们内心深处承认，我们确实蒙上帝尊荣，成为祂的形象和样式，然而我们生活的现实却与此信仰不符，那么，我们该如何行，才不至于摧毁这信仰，而另一方面又不失去谦卑呢？——我们需要怀抱这种认知，我们痛苦地意识到，我们活得不符合上帝的旨意，这旨意召我们存在，我们因罪而玷污了祂的形象。我们本应拥有包容一切的爱，然而我们却活在纷争和分裂之中；于是，上帝真正的目的便从人的视野中消失了。我们仿佛无法接受认知而不因此生出骄傲。然而，在基督信仰的方式中，即使一个人处于地上最高的境地，他依然保持谦卑。任何知识的总和，任何我们灵性上的高深境地，（这些境地是真正源自上帝的），都不会使人变得骄傲。正如基督自己，祂是全知全能的，祂说：「你们当学我的样式，因为我心里柔和谦卑」（马太福音 11:29）。因此，我在圣山曾见到，有时也在世俗中，有些人身处高深的恩典之中，同时又满怀谦卑。
  - type: paragraph
    text:
      ru: 'Если мы посмотрим на свою жизнь, то увидим, что она онтологически не соответствует нашему происхождению. Однако знать при этом, что яязвы ношу моих прегрешений, – значит: совместить веру в величие происхождения нашего с познанием, что мы не «там», что мы потеряли это достоинство. И тогда, живя по заповедям Христа евангельским, мы переживаем это состояние, как вернейшее чувство, что Бог есть наш драгоценный Отец. Оно приходит как смиренное чувство, не как гордость, которая хочет сокрушить своего брата. Тогда мы живем в покаянии, а «покаяние, – как я дерзнул написать в моей книге, – на земле не имеет конца»[136]. Ибо говорить о конце покаяния – значит говорить о нашем совершенном подобии Христу, воскресшему из мертвых и восходящему ко Отцу. Этой меры едва достигают единицы на целые поколения.'
      cn: 如果我们审视自己的生命，我们会发现它本体上不符合我们的本源。然而，与此同时知道我身负我罪愆的创伤，这意味着：将我们本源的伟大信仰与我们不在「那里」、我们已经失去了这尊严的认知结合起来。于是，按照福音中基督的诫命生活，我们便体验到这种状态，作为最真确的感觉，即上帝是我们宝贵的父。它作为一种谦卑的感觉而来，而非作为骄傲，那种想要击垮自己弟兄的骄傲。于是我们生活在悔改之中，而「悔改，——正如我斗胆在我的书中写道——在地上没有终结」[136]。因为谈论悔改的终结，就意味着谈论我们与基督完美的相似，那位从死者中复活并升到父那里的基督。这种程度，世世代代中几乎只有寥寥数人能够达到。
  - type: paragraph
    text:
      ru: 'Когда мы осознаем свое происхождение, как говорит о нем Откровение, и когда мы язвы прегрешений носим на себе, тогда появляется глубокий плач покаяния и чувство неисцелимости нашей болезни своими силами; и мы молимся, чтобы Бог Сам пришел с исцелением Своим, силою Своею победил в нас все пороки и все страсти смертоносные. И пожалуйста, имейте все это в виду, чтобы не утонуть в «чрезмерной» вере: «Я могу ходить по водам, как Господь ходил», чтобы не возноситься в своем сознании: «О, я сын Божий!». Все это приходит совсем иначе, нормальным и верным путем через покаяние и плач. И сердце наше доходит до того состояния, когда Бог может сказать ему о Своей любви. Тогда душа чувствует, что Бог есть Самый близкий, Самый драгоценный Отец наш. Об этом прекрасно пишет наш старец, ныне прославленный святой, Силуан.'
      cn: '当我们 осозна自己的本源，正如神圣启示所言，并且当我们背负着罪愆的创伤，那时便会生发出深切的忏悔之哭泣，以及靠自身力量无法治愈我们病痛的感觉；我们便恳求上帝，愿祢亲自带着祢的医治临到，以祢的能力胜过我们里面的一切邪恶和一切致命的私欲。


        并且，请大家务必谨记这一切，以免沉溺于「过度的」信仰中，以为「我能像上主那样行走在水面上」，以免在自己的意识中自高自大，说：「哦，我是上帝之子！」。所有这一切都以截然不同的方式临到，通过忏悔和哭泣，以正常而正确的道路实现。我们的心便达到那样的境地，上帝能向它倾诉祂的爱。那时，灵魂便会感受到，上帝是我们最亲近、最宝贵的父亲。对此，我们的长老，即如今已受尊崇的圣者西лу安，曾有精妙的论述。'
  - type: paragraph
    text:
      ru: 'Итак, на сегодня я хочу ограничиться только этим словом: о двойственности нашего состояния. Да, онтологически я по происхождению своему сын Божий, «сотворенный, не рожденный», а не как Христос «рожденный, несотворенный»[137]. И Он по существу есть Бог, а мы боги только по благодати, как образ и подобие Его славы.'
      cn: 那么，至于今天，我只想谈论这一个词：关于我们状态的双重性。是的，从本体论上讲，我按我的本源是上帝之子，「被造而非受生」，而不像基督是「受生而非被造」[137]。而祂在本质上是上帝，而我们，仅凭恩典，是神，作为祂荣耀的肖像和样式。
  - type: paragraph
    text:
      ru: 'Пожалуйста, запишите это на сердцах ваших и держите это всю свою жизнь, до конца. Тогда из самой жизни вам откроется путь, которым ведет нас Господь. И мы избежим того, чтобы возгордиться, когда придет вдруг то, что было совсем невозможным: слава чудотворения, ясновидения и других даров. Когда это Божий дар, то нет гордости, нет тщеславия, а есть нечто совсем другое: состояние, которое дается свыше по благодати.'
      cn: 请将此铭记在你们的心中，并终生持守，直至末了。那么，从生命本身，那条主引导我们的道路就会向你们显明。这样，当那曾被认为绝无可能之事突然降临时——诸如行奇迹的荣耀、先见之明以及其他的恩赐——我们便能避免骄傲自大。当这是上帝的恩赐时，便没有骄傲，没有虚荣，而是全然不同的一种状态：那是籍着恩典从上方所赐予的。
  - type: paragraph
    text:
      ru: Значит, программа наша –образ есмь неизреченный Твоея славы, аще и язвы ношу моих прегрешений. И так мы сохраним традицию наших отцов.
      cn: 因此，我们的计划是祢不可言喻的荣耀的形象，尽管我背负着我过犯的创伤。如此，我们便能持守我们教父们的传统。
  - type: paragraph
    text:
      ru: Господь сказал:«кто хочет быть первым, будь... всем слугою и... всем рабом»(Мк.9:35, 10:44). Так Господь дает нам указание о том, где никто другой не был до Него, и мы знаем теперь об этих тайнах через Него. Это так понятно! Наша жизнь во всем должна основываться на Откровении библейском, и прежде всего евангельском. И никаких других философий, идущих снизу, собственно, и не надо... Если мы действительно веруем Откровению, что мы чада Божии, то, когда мы выпадаем из неизреченной славы и живем в позоре страстей, тогда душа так страдает от этого! Потерять эту красоту Божественную и влачиться, как бессловесные животные некие, в грязи – так будем мы плакать неизреченным плачем! Неизреченным почему? – Потому, что горечь этого сознания так велика, что кончаются слова. Старец говорит, что, когда приходит любовь Божия с силою, тогда нет больше слов[138]. От большой любви нет слов. И здесь от большого покаяния нет слов.
      cn: 上主说：「凡愿意为首的，就必作……众人仆役，并……众人的奴仆」（马可福音 9:35，10:44）。上主如此指示我们，祂之前无人曾到之处，我们现今藉着祂得以知晓这些奥秘。这何等清晰明了！我们的生命在凡事上都应当奠基于圣经的启示，而首先是福音的启示。其他那些源于地上的哲学，实际上，根本是不需要的……如果我们确实信靠启示，即我们是上帝的儿女，那么，当我们从那不可言喻的荣耀中坠落，生活在情欲的羞辱之中时，那时灵魂就因此承受极大的痛苦！失去这神圣的美善，在泥泞中爬行，如同某种无理性的动物般——我们必将发出不可言喻的哀哭！为何是不可言喻的？——因为这种意识的苦楚是如此巨大，以至于言语都已耗尽。长老说，当上帝的爱带着能力降临时，那时便再无言语[138]。因着极大的爱，言语已失。在此，因着深切的悔改，言语亦失。
  - type: paragraph
    text:
      ru: 'Молитесь за меня! Молитесь друг за друга! Молитесь за каждого брата и каждую сестру! И тогда из маленькой группы людей вдруг придет понимание уже беспредельности вечной. А если мы начнем с конца, то будет так, как мне говорил духовник: «Кто начинает с последних степеней любви Божией, тот кончает ничем. А кто начинает покаянием и крепко держится его, тот получит и будет умирать в состоянии славы Божественной любви»...'
      cn: 为我祷告！彼此代祷！为每一位弟兄和每一位姊妹祷告！那么，从一小群人中，忽然就会领悟到那永恒的无限。但如果我们从结局开始，就会像我的神师对我所说的那样：「谁从上帝之爱的最后阶段开始，谁就一无所获。而谁从悔改开始，并坚守它，谁就必有所得，并将在神圣之爱的荣耀状态中死去。」
- type: heading1
  text:
    ru: 'Беседа 20: Спасение через любовь, а не богатство интеллектуальных познаний[139]'
    cn: 第20讲：救赎通过爱，而非智识的丰富[139]
  children:
  - type: paragraph
    text:
      ru: Спасение достигается через любовь. О последнем слове старца Силуана (ср.1Кор.13и свт.Иоанн Кронштадтский). Разделения христианства из-за недопонимания заповеди о любви. Монашество как школа любви и спасения. О соблюдении заповедей. О хранении от греха. Заповеди Христа сверхкосмичны. Об откровении предвечной идеи о человеке во Христе. О необходимости знания последней цели монашества.
      cn: 救赎借由爱达致。关于长者圣西卢安的遗言（参阅 哥林多前书 13章 与 圣伊望·克朗施塔特）。基督教的分裂因误解爱的诫命。修道生活作为爱与救赎的学校。关于遵守诫命。关于保守免于罪。基督的诫命是超越宇宙的。关于在基督内启示人那永恒的理念。关于认知修道生活的最终目的的必要性。
  - type: paragraph
    text:
      ru: Опять и опять благодарю Бога, Который дает мне радость встречаться с вами...
      cn: 我再次又再次感谢上帝，是祂赐予我与你们相遇的喜乐。
  - type: paragraph
    text:
      ru: 'Как бы ни была хороша дорога, водитель машины все время должен регулировать ход своего автомобиля: менять скорость, изменять немного направление или поворачивать и так далее. Так и в нашей жизни: хотя пред нами нарисован путь отцами, Апостолами и Самим Христом, все равно мы все время должны вести машину по той линии, которая должна быть выдержана, чтобы прибыть к нашей последней цели.'
      cn: 无论道路多么平坦顺畅，驾车者始终需要调整其汽车的行进：改变速度，稍微改变方向，或者转弯，等等。我们的生命亦是如此：尽管摆在我们面前的道路已由教父们、使徒们和基督亲自勾勒出，我们仍然必须不断地驾驭这辆车，使其沿着必须坚持的路线行进，以便抵达我们最终的目标。
  - type: paragraph
    text:
      ru: 'И вот сегодня я хочу сказать нашим новым братьям и сестрам, что не в количестве познаний сила спасения, а в образе жизни: не гностический, а этический аспект жизни нашей – вот что спасает. Спасает та любовь, которую заповедал нам Господь, когда на Тайной Вечере Он сказал:«любите друг друг»(Ин.15:17). Это совсем не значит, что мы против каких бы то ни было познаний. Наоборот, заповедь Божия понуждает нас «искать» (см.Мф.7:7) и овладеть полнотою знания, – той полнотою, которою Сам Господь является (см.Ин.17:3). Однако хотя бы и абсолютным было наше знание, и все-таки спасение не в этом, а спасение – в образе жизни. Вы уже заметили, что у меня нет порядка хронологического в беседах с вами на определенные предметы, заранее установленные, как это обычно бывает в школах богословских. Но так течет жизнь.'
      cn: 如今我想对我们新的弟兄姊妹说，救赎的力量不在于知识的多寡，而在于生活方式：不是诺斯底主义的，而是我们生命伦理的层面——这才是拯救我们的。拯救我们的是那爱，就是主在最后的晚餐上吩咐我们的，祂说：「你们要彼此相爱」（约翰福音 15:17）。这绝不意味着我们反对任何形式的知识。相反，上帝的诫命敦促我们「寻求」（参阅马太福音 7:7），并掌握知识的丰盛——那丰盛就是主自己（参阅约翰福音 17:3）。然而，即便我们的知识是绝对的，救赎仍不在此，救赎在于生活方式。你们已经注意到，我在与你们谈论预先确定的特定主题时，并没有按时间顺序，就像神学院里通常那样。但生活正是如此。
  - type: paragraph
    text:
      ru: И вот сегодня я хочу сказать братьям и сестрам, что, хотя мы разделяем труд на физический и интеллектуальный, все равно – единство и спасение приходят только через любовь. И весьма горько отметить, что в нас живет страшная склонность к доминации и к превосходству, к тому, чтобы видеть другого низшим, – и это губит человека. Часто мы встречаемся с тем положением, что люди внешне полны информации во всякого рода областях познания, но внутренне не научились любить.
      cn: 我今天想对弟兄姐妹们说，尽管我们把劳动分为体力劳动和脑力劳动，但是合一与救赎仍然唯独通过爱才能获得。并且，令人非常痛心地注意到，在我们之中存在着一种可怕的倾向，倾向于支配和优越，倾向于视他人为低下——这会毁灭人。我们常会遇到这样的情况，人们在外表上充满了各样知识领域的信息，但在内心深处却没有学会爱。
  - type: paragraph
    text:
      ru: 'В моей книге о старце Силуане я привожу в конце жизнеописания последнее слово его. Я сказал ему:'
      cn: 在我的关于长老圣西卢安的书中，我在他生平记述的末尾引用了他最后的话。我对他说：
  - type: paragraph
    text:
      ru: – Жалею, что я постоянно больной и нет у меня сил посвятить больше времени богословию.
      cn: ——我惋惜，我总是生病，力不从心，不能将更多时间奉献给神学。
  - type: paragraph
    text:
      ru: 'Он со свойственной ему кротостью и тихостью спросил:'
      cn: 他以其特有的温良与恬静问道：
  - type: paragraph
    text:
      ru: – И вы считаете это великим?
      cn: ——您认为这是伟大的吗？
  - type: paragraph
    text:
      ru: Я держался с ним, сознавая, что он есть высший дар благоволения Божия о мне. И, конечно, я не мог ответить на его вопрос.
      cn: 我持守着他，深知他乃是上帝临到我身上的至高恩惠。而，当然，我无法回答他的问题。
  - type: paragraph
    text:
      ru: 'После некоторого молчания он говорит:'
      cn: 在一段沉默之后，他说：
  - type: paragraph
    text:
      ru: '– Велико только одно: смириться, низложить гордость, которая мешает любить[140].'
      cn: – 唯有一事至大：谦卑，制伏骄傲，因为骄傲阻碍去爱[140]。
  - type: paragraph
    text:
      ru: 'Я назвал это последним словом, потому что и Господь говорит о том же на Тайной Вечере. И апостол Павел говорит об этом:«...и я покажу вам путь еще превосходнейший. Если я говорю языками человеческими и ангельскими, а любви не имею, то я – медь звенящая или кимвал звучащий. Если имеюдарпророчества, и знаю все тайны, и имею всякое познание и всю веру, так чтомогуи горы переставлять, а не имею любви, – то я ничто. И если я раздам все имение мое и отдам тело мое на сожжение, а любви не имею, нет мне в том никакой пользы. Любовь долготерпит, милосердствует, любовь не завидует, любовь не превозносится, не гордится, не бесчинствует, не ищет своего, не раздражается, не мыслит зла, не радуется неправде, а сорадуется истине; все покрывает, всему верит, всего надеется, все переносит. Любовь никогда не перестает, хотя и пророчества прекратятся, и языки умолкнут, и знание упразднится. Ибо мы отчасти знаем, и отчасти пророчествуем; когда же настанет совершенное, тогда то, что отчасти, прекратится. Когда я был младенцем, то по-младенчески говорил, по-младенчески мыслил, по-младенчески рассуждал; а как стал мужем, то оставил младенческое. Теперь мы видим как бы сквозьтусклоестекло, гадательно, тогда же лицем к лицу; теперь знаю я отчасти, а тогда познаю, подобно как я познан. А теперь пребывают сии три: вера, надежда, любовь; но любовь из них больше»(1Кор.12:31–13:13). Сильнее сказать невозможно.'
      cn: '我将此称为最终之言，因为主在最后的晚餐上也谈及此事。圣使保罗也论及此：


        「……我将指示你们一条更卓越的道路。我若能说人间与天使的方言，却没有爱，我就成了鸣响的铜锣，发声的铙钹。我若有先知恩赐，又明白一切奥秘，拥有一切知识；我若有全备的信德，能移山倒海，却没有爱，我仍是虚无。我若散尽我的全部家财，舍身被焚，却没有爱，于我毫无益处。爱是恒久忍耐，施予慈悲；爱不嫉妒，爱不自夸，不张狂，不行无礼，不求己益，不轻易动怒，不计算人的恶，不喜欢不义，只与真理同乐；包容一切，相信一切，盼望一切，忍受一切。爱永不止息，纵然先知恩赐将归于无有，方言将止息，知识将废除。因为我们现在所知道的有限，所说预言的也有限；但等到那完全的来到，这有限的就必废除。我作孩童的时候，话语像孩童，心思像孩童，意念像孩童；既成了大人，就把孩童的事丢弃了。我们如今仿佛对着模糊的镜子观看，恍惚不清；那时就要面对面了。我如今所知道的有限，那时就要完全认识，正如我被完全认识一样。如今常存的，有这三样：信、望、爱；其中最大的是爱。」（哥林多前书 12:31-13:13）


        再无更强之言。'
  - type: paragraph
    text:
      ru: И в слове, которое я назвал «последним словом» прп. Силуана, в очень короткой формуле заключена та же сила любви спасающей и являющейся центром всей жизни и Самого Божества. В писаниях свт.Иоанна Кронштадтскогоречь идет только об этом. И у многих других святых, кого мы ни возьмем, все сводится к этому. Поэтому прежде всего мы должны хранить любовь и стремиться к ней.
      cn: 在我所称之为圣西卢安长老「最后的言语」的这篇文字中，以一个非常简短的表述，蕴含着同样的爱之力量，这爱是救赎性的，并且是整个生命乃至上帝本体的中心。在圣伊望克朗施塔特主教的著作中，所论述的也唯有此。在许多其他的圣人那里，无论我们提及哪一位，一切都归结于此。因此，首先我们应当持守爱，并努力追求这爱。
  - type: paragraph
    text:
      ru: Если бы была любовь, весь христианский мир был бы единым по образу единства Святой Троицы. Если христианский мир разбит на части, то только потому, что христиане не хранят заповедей Господних. Столько разговоров, столько интеллектуальных усилий с каждой стороны убедить, что она владеет лучшим, ни к чему не привели в нашем веке, когда начались всемирные движения христиан.
      cn: 如果有爱，整个基督徒世界将是合一的，如同圣三一的合一形像。如果基督徒世界四分五裂，那只因为基督徒没有谨守上主的诫命。各方为了说服自己拥有最优，付出了如此多的言论和智力努力，然而，在我们这个基督徒普世运动开始的时代，这些都毫无成效。
  - type: paragraph
    text:
      ru: Так, в нашей монашеской жизни, если мы не будем учиться любви, то я не знаю, какое оправдание можно было бы высказать в пользу монашества. Нет его! Любовь до желания пострадать за Христа и пролить кровь возможна и вне монашества. Но монашество наше – это есть особая организация всего времени в соответствии с нашим желанием спасаться, то есть стать способными воспринять вечную жизнь от Бога. Когда мы полны этого понимания, тогда приходит к нам вдохновение, которое никогда не покидает человека, даже если внешне человек может быть доведен до последнего истощания и даже быть убит, как сказал Господь:«не бойтесь убивающих тело и потом не могущих ничего более сделать»(Лк.12:4).
      cn: 因此，在我们的修道生活中，如果我们不学习爱，那我不知道修道生活还能有什幺正当理由可言。没有！那种为基督受苦甚至流血的爱，在修道生活之外也是可能的。但是，我们的修道生活是对所有时间的一种特殊安排，以符合我们得救的愿望，也就是说，使我们能够从上帝那里领受永生。当我们完全领悟到这一点时，那时，一种灵感便会降临我们，这种灵感永远不会离弃人，即便在外表上，人可能被折磨至极度枯竭，甚至被杀害，正如上主所说：「不要怕那些杀身体以后不能再做什么的」（路加福音 12:4）。
  - type: paragraph
    text:
      ru: Итак, не какие-то функции в земной жизни спасают человека, а спасает человека только жизнь по заповедям Бога. Когда хранит человек заповеди эти, и хранит их действительно, с чувством, что их изрек Господь как последнее откровение людям о том, как живет Сам Бог, тогда наша жизнь вся становится другою. И хотя внешне ничего не видно, но вся красота и сила, все могущество вечной жизни – внутри человека. И научаемся мы этому великому таинству любви Божией постепенно. Монашество наше основано на тех принципах, которые приводят к этой цели.
      cn: 所以，并非世俗生活中的某些功用能拯救人，唯有按照上帝的诫命而生活才能拯救人。当人持守这些诫命，并真正地持守它们，怀着一种感觉，即它们是上主所宣告的，是祂对人关于上帝自身如何生活的最终启示时，我们整个生命都变得不同了。纵然外表上看不出什么，然而所有的美与力量，永恒生命的一切权能，都在人内心之中。我们也逐渐地学习着上帝之爱这伟大的奥秘。我们的修道生活乃是基于那些导向这目标的原则。
  - type: paragraph
    text:
      ru: 'Жизнь наша полна напряжения: все дни и ночи проходят в заботе о том, чтобы избежать греха. Вот одна душа недавно к нам приходит и говорит: «Когда я была свободна от веры и жила без Бога, то у меня не было проблем и жизнь текла просто. А теперь ни дня, ни ночи я не имею покоя». И новоначальная душа это выражает в молитве просто, перед Богом: «Господи, что Ты сотворил со мною? Я теперь не нахожу ни места, ни мгновения, когда я была бы спокойна». Так и монашеская жизнь – это есть напряжение предельное человеческих сил и внимания. Однако снаружи монахов можно уподобить проводам электричества высокого напряжения, на которые могут маленькие птицы садиться сверху и сидеть спокойно, тогда как по этим проводам течет энергия, которая двигает поезда, освещает дома, все согревает, – вся жизнь движется только ею.'
      cn: 我们的生命充满张力：日日夜夜都在努力避免犯罪。看，最近有一位灵魂来到我们这里说：「当我没有信仰、没有上帝的时候，我没有问题，生活过得简单。但现在我日夜不得安宁。」这位初信的灵魂在上帝面前，以简单的祷告表达出来：「上主啊，祢对我做了什么？我现在找不到任何一个地方，任何一个片刻，能让我感到平静。」修道生活亦是如此——它是人类力量和专注的极致张力。然而，从外面看，修士们可以被比作高压电线，小鸟可以安然地落在上面栖息，而这些电线中却流淌着推动火车、照亮房屋、温暖万物的能量——全部生命都唯独因此而运行。
  - type: paragraph
    text:
      ru: Итак, я сегодня хотел вам подсказать, чтобы в заботе своей изучить наше богословие и обогатить себя познаниями опыта отцов, читая их труды и произведения, – вы поняли, что все-таки спасает не обилие этих познаний, а любовь – та любовь, которую заповедал Господь (см.Ин.15:13).
      cn: 那么，我今天想对你们建议：在你们努力研习我们的神学，并藉着阅读教父们的著作与作品，以他们的经验智慧来充实自己的过程中——你们便会明白，最终拯救的并非这些知识的丰盛，而是爱——主所命令的那份爱 (参阅约翰福音 15:13)。
  - type: paragraph
    text:
      ru: Хочу оставить только это маленькое слово и призвать ваше внимание к тому, чтобы вы стояли твердо на этом пути, и это наилучший метод усвоить заповеди Христа. Когда мы полны веры, что Господь Иисус Христос есть Творец мира нашего и что заповеди Его – сверхкосмического содержания, тогда страх пред величием их приводит к тому, что человек не может оторваться от корректирующего действия на него этих заповедей. Как я говорил, человек ведет автомобиль, все время регулируя ход машины, даже на хорошей дороге, так наши заповеди, которые Господь нам дал, есть водитель наш...
      cn: 我想只留下这小小的提醒，并呼吁你们留意，要在这条道路上坚定不移地站立，而这是领受基督诫命的最佳方法。当我们满怀信德，相信主耶稣基督是我们的世界的创造者，并且祂的诫命是超宇宙性的内容时，那时，在它们宏伟的面前所产生的敬畏，会使人无法脱离这些诫命对他所起的校正作用。正如我所说，人驾驶汽车，始终调节着车辆的运行，即使在良好的道路上也是如此，同样，上主赐给我们的诫命，就是我们的向导...
  - type: paragraph
    text:
      ru: 'Одна монахиня из Югославии пишет: «О, как я благодарна Богу». Монахиня эта бросила университет, прервав свою работу, и пошла в монастырь. «И теперь, – говорит она, – я попала в высшую школу, в наивысочайшую школу, и сердце мое полно желания, чтобы Господь дал мне силы пребыть до конца в этом состоянии». Она пишет так: «Подумайте, конец этой жизни – вечная жизнь в Боге! Чего большего можно ожидать?» Так вот, я желаю вам всем пережить этот опыт, который и я переживал, и многие другие из вас; и вы, новопришедшие, переживите тот же самый опыт...'
      cn: 一位来自南斯拉夫的修女写道：「哦，我多么感谢上帝啊！」这位修女放弃了大学，中断了学业，去了修道院。「而现在，」她说道，「我进入了一所高等学府，一所至高无上的学府，我的心充满渴望，愿上主赐予我力量，让我能在这状态中持守到底。」她这样写道：「想一想，今生的终结——是在上帝里的永生！还能奢求什么呢？」这样说来，我祝愿你们所有人都能经历这种体验，我以及你们当中的许多人也都经历过；还有你们，新来的（人），愿你们也经历同样的体验……
  - type: paragraph
    text:
      ru: У меня нет сил больше говорить, но сохраните то слово, что дал мне Бог. И так живите в мире. И когда сердце ваше преодолеет все мелкие препятствия психологические и достигнет сей любви в наших маленьких масштабах, как это ни странно, вы приготовитесь к восприятию состояния благодати, когда в любви своей человек охватывает весь мир. Но это состояние не может быть создано искусственно. Мы идем путем всегда как бы только начальной школы. Но происходит с нами изменение, и наше сердце более не любит противное тому, что заповедал Господь.
      cn: 我已无力多言，但请谨记上帝所赐予我的话语。如此生活在平安中。当你们的心克服了所有细微的心理障碍，并在我们微小的尺度上达成了这份爱，尽管这听来有些不可思议，你们将预备好去领受恩典的状态，那时人以其爱拥抱整个世界。但这种状态无法人为地被创造出来。我们所行的道路，始终仿佛只是初级学堂。但我们自身会发生变化，我们的心不再爱那与上主所命令的相悖的事物。
  - type: paragraph
    text:
      ru: 'И хотя я теперь как развалина и руина, но все-таки то, что я говорю вам, остается в силе: это – правда нашей жизни в Боге великом, Творце Неба и Земли, Который облекся в нашу плоть и явил нам Себя и какими мы должны быть. То есть когда мы видим Христа воплощенного, то мы созерцаем предвечную идею Бога о человеке[141]. Вы видите, как Господь Своим явлением, Своими заповедями увлекает наш ум в такие сферы, как состояние Самого Божества до сотворения мира. Об этом страшно говорить, но начинается это с самых простых поступков. Игумен говорит: «Принесите, пожалуйста, уголь на кухню». Вы насыпаете ведро и несете. И этот акт приготовляет вас к великому восприятию любви. А если вы не будете делать так, то не достигнете ничего. Но знать последнюю цель монашеской жизни мы должны с самого начала. Тогда мы сможем установить правильный путь. Не когда претендуем быть уже на высоте заповедей, то есть претерпев обожение, нет! – а теперь, когда мы полны страстей и греха, постепенно, через послушание, через служение другим, через проявление любви и терпения мы приготовляем себя к высшему состоянию...'
      cn: 尽管我现在如同废墟和残骸，但我所告诉你们的，依然有效：这就是我们在伟大的上帝——天地创造者中的生命真理，祂取了我们的肉身，并向我们显现了祂自己，以及我们应当成为何样。也就是说，当我们看到道成肉身的基督时，我们所默观的，是上帝关于人的永恒理念[141]。你们看，上主如何以祂的显现，以祂的诫命，将我们的心智引入这样的境界，就像世界受造之前神性自身的状态。谈论此事令人敬畏，但这却始于最简单的行为。掌院说：「请把煤炭带到厨房去。」你舀满一桶，然后提着走。而这行为预备你领受那伟大的爱。如果你不这样做，就一无所获。但我们必须从一开始就知道修道生活的最终目标。这样我们才能确立正确的道路。不是当我们自以为已达诫命的高峰，也就是经历了神化之后，不！——而是现在，当我们充满情欲和罪恶时，逐渐地，通过顺服，通过侍奉他人，通过彰显爱与忍耐，我们预备自己进入更高的境界……
  - type: paragraph
    text:
      ru: Итак, да хранит вас Господь. И молитва моя о том, чтобы вы действительно восприняли вдохновение свыше.
      cn: 那么，愿上主保守你们。而我的祷告是祈愿你们确实领受从上而来的默感。
- type: heading1
  text:
    ru: 'Беседа 21: Величие монашеского призвания[142]'
    cn: '讲论 21: 修道召叫的崇高[142]'
  children:
  - type: paragraph
    text:
      ru: 'Монашество есть величайшая культура на Земле, борьба против страстей и жизнь пред Лицом Божиим. Опыт живописи как раскрытие внутренней красоты. О Литургии. О порабощении греху. Жизнь без греха через подвиг. Заповеди Христа выявляют грех. «Невозможность» заповедей Христа. Об умном подвиге: всякий помысел не по Евангелию есть грех. Как бороться с помыслами.'
      cn: '修道生活是世上最伟大的文化，是与情欲的争战，并活在上帝面前。

        绘画经验作为内在美的显现。

        论礼仪。

        论对罪的奴役。

        通过苦修达至无罪的生活。

        基督的诫命显明罪。

        基督诫命的「不可能」。

        论心智的苦修：凡是不符合福音的意念都是罪。

        如何与意念争战。'
  - type: paragraph
    text:
      ru: 'Привычка жить в Боге дает возможность жить так, как будто бы всегда ты окружен беспредельным и безбрежным океаном. Это – духовная «сфера», и представляется она действительно как таковая: где ни тронь – все как будто бы и начало, и конец, и середина. И когда нужно говорить о нашей жизни, то приходится как бы сузить все горизонты и остановиться вниманием лишь на некоторых ее аспектах.'
      cn: 习惯活在上帝之中，使得人得以如此生活，仿佛总是被无边无际、浩瀚无涯的海洋所环绕。这是一片属灵的「境界」，而它也确实就是如此呈现的：无论触及何处——一切仿佛都是起始、终结与居中。而当我们谈论我们的生命时，便不得不仿佛将所有视域收窄，而只将注意力集中在其某些方面。
  - type: paragraph
    text:
      ru: 'За мою, простите, сравнительно долгую жизнь монашескую я встречался со многими бестолковыми и даже глупыми представлениями о монашестве. Монашество есть культура, которая, по моему глубокому убеждению, не имеет себе равной в мире сем. Однако не скоро входит человек в состояние, когда он способен увидеть эту красоту,«и глубину,и высоту» (см.Еф.3:18), как говорит апостол Павел; в состояние, о котором великий, гениальный поэт, ученый и аскет прп.Иоанн Дамаскинговорил:Образ есмь неизреченныя Твоея славы, аще и язвы, ношу моих прегрешений. Подумайте: чтобы сказать такие слова в присутствии Самого Бога и говорить Богу: «Аз есмь образ Твоей великолепной славы», какие состояния молитв, какие состояния посещения Нетварным Светом должны предшествовать такому поэтическому выражению! И когда удается узреть эту красоту, тогда человек познает страдания, каких мир не знает.'
      cn: 在我，恕我直言，相对漫长的修道生涯中，我曾遇到许多关于修道生活愚蠢甚至荒谬的观念。修道生活是一种文化，依我深信不疑的看法，在这世上无与伦比。然而，人并非很快就能进入一种境地，能看见这般美善，「何其深广，何其高超」（参阅以弗所书 3:18），正如使徒保罗所言；进入到一种境地，关于此，伟大的、才华横溢的诗人、学者兼苦修者圣伊望·大马士革曾说：「我是祢不可言喻之荣耀的肖像，纵然背负着我罪孽的伤痕。」试想：要在上帝面前说出这样的话，并对上帝说：「我是祢辉煌荣耀的肖像」，怎样的祈祷境界，怎样被非受造之光照临的境况，才能先于如此诗意的表达啊！而当人得以看见这种美善时，那时人便会经历世人所不知的苦楚。
  - type: paragraph
    text:
      ru: После того как увидел монах неизреченную славу Божию, он видит себя окруженным низкими, мелкими страстями – мрачную жизнь, далекую от Света Божественного. Тогда тот же прп.Иоанн Дамаскинговорит:Плачу и рыдаю, когда помышляю о смерти. Это есть плач о смерти – уродливой смерти, поразившей человечество. И тот, кто узрел неизреченную славу, когда видит это бесславие смертное наше, плачет и рыдает.
      cn: '在修士瞻仰了上帝不可言喻的荣耀之后，他看到自己被卑微、渺小的诸情欲所包围——那是一种远离神圣之光的黑暗生命。于是同一位圣约翰·大马士革说：


        当我思想死亡之时，我哭泣，我悲叹。这是为死亡而发的哭泣——为那击打人类的丑陋死亡。而那瞻仰过不可言喻之荣耀的人，当他看见我们这死的耻辱时，他哭泣并悲叹。'
  - type: paragraph
    text:
      ru: Я говорю об этом сегодня потому, что слишком много раз за мою монашескую жизнь я слышал уродливые высказывания о монашестве, даже в общей церковной жизни, от тех, кто не познал в такой же мере, как прп.Феодор Студит, что монашеский образ жизни есть последняя и высшая благодать...[143]Ибо речь все время идет о жизни пред Лицом Бога – великого и святого, тогда как некоторые думают, что монашеская жизнь – бестолковая жизнь и не полезная миру... Да, не полезная миру, когда речь идет о пище для свиней! Монашество «готовит пищу» для ангелов. Но, как мне показал опыт, мы должны начинать с азов. И потом Бог дает созерцание высшей красоты и неизреченной славы до последних степеней. Это созерцание приходит не от нашего подвига. Многие думают, что монашество только для неграмотных мужиков и бедных женщин – отребья мира. Простите, что я выражаюсь сегодня так грубо и резко, но я говорю это на основании моего опыта.
      cn: 我今天说这些，是因为在我度修道生活的岁月中，我太多次听到关于修道生活的丑陋言论，甚至在一般的教会生活中，来自那些不像圣西奥多·斯图狄特（Theodore Studite）那样，没有充分认识到修道生活是最终和最高的恩典的人……[143]因为这始终是关于在伟大而神圣的上帝面前的生活，然而有些人却认为，修道生活是毫无意义的，对世界无益的……是的，对世界无益，如果是指给猪的食物！修道生活「预备食物」为天使。但是，正如我的经验所示，我们必须从基础开始。然后上帝赐予对至高美善和不可言喻之荣耀的默观，直到最后的阶段。这种默观并非源于我们的苦修。许多人认为修道生活只适合不识字的乡下汉子和贫困的妇女——世界的渣滓。请原谅我今天言辞如此粗鲁和尖锐，但我根据我的经验说这些话。
  - type: paragraph
    text:
      ru: Когда я был живописцем и стремился к настоящему искусству, которое трансцендирует видимый мир и предчувствует другой мир – умный, не зримый глазами, то напряжение становилось непрестанным и днем, и ночью. Для человека тогда каждое слово, каждая мысль, каждое движение его говорят о присутствии Бога. Живущие вне Бога не могут созерцать эту красоту. Собственно, с великой силой созерцается эта красота, когда нисходит на нас Нетварный Свет Божества.
      cn: 当我是一名画家，并追求那种超越可见世界、预感到另一个理智的、非肉眼所见的真正艺术时，这种专注便昼夜不息。对于那时的人来说，他的每一个言语、每一个思想、每一个动作，都述说着上帝的临在。那些生活在上帝之外的人，无法默观这份美。事实上，当非受造的上帝之光降临到我们身上时，这份美便以极大的力量被默观着。
  - type: paragraph
    text:
      ru: Сказав вам несколько слов этих, я все-таки возвращаюсь к тому, как проходят наши дни. Из того страстного состояния, в котором мы рождаемся, нам надлежит перейти в состояние человека, как его мыслил Бог прежде, чем создал мир. Однако реальность нашей жизни все-таки такова, что мы постоянно видим себя атакуемыми всякого рода страстями.
      cn: 说了这几句话，我仍然回到我们的日子是如何度过的。从我们生而有之的情欲状态中，我们理当进入人的状态，就像上帝在创造世界之前所构想的那样。然而，我们生活的现实仍然是这样的：我们不断地发现自己受到各种情欲的攻击。
  - type: paragraph
    text:
      ru: 'Монашеская жизнь есть умная жизнь. Под действием благодати Божией ум человека очищается и становится носителем верховных видений и сам называется верховным умом. И этот верховный ум у монахов постоянно в работе. Одно из самых частых явлений, когда мы живем умным видением, – совершение Литургии: как возможно, что кусок хлеба, испеченный человеческим трудом, приносится в алтарь и становится Телом Самого Бога Иисуса Христа? Мы веруем, что когда мы призываем Отца ниспослать Духа Святого на предлежащие Дары, то призывание всех сих Имен и молитвенное ожидание от Бога превращается в событие духовного порядка. И видимый Хлеб, не меняя своей феноменальной, то есть видимой глазами, сущности, становится онтологически совершенно другою реальностью. Мы ведь принимаем Тело и Кровь Самого Бога не как человеческое тело, как оно есть теперь, не как человеческую кровь, а под видом Хлеба и Вина. И мы живем Святые Дары, созерцая их верою. Так, на Литургии как явление, «феномен» мы телесно видим Хлеб, а как данное по уму высшему, по вере нашей (ибо это превышает наше понимание умом) мы созерцаем Тело Самого Бога.'
      cn: 隐修生活乃是智性生活。在上帝恩典的作用下，人的心智得以洁净，成为至高洞见的载体，其自身也因此被称为至高心智。隐修士们的这一至高心智持续运作。当我们活在智性洞见中时，最常见的现象之一便是圣礼仪的举行：一块由人的劳作烘焙而成的饼，怎可能被呈献到祭台，并成为上帝耶稣基督本体的圣体呢？我们确信，当我们呼求圣父降下圣灵在所呈献的圣物上时，所有这些圣名的呼求以及对上帝的祷告期盼，便会转化为一件属灵秩序的事件。那所见的饼，不改变其现象性的，亦即肉眼可见的本质，却在本体论上成为截然不同的实在。我们所领受的上帝本体的圣体与宝血，并非如今之所是的人类身体，也并非人类血液，而是在饼与酒的形相之下。我们凭信德默观圣圣物，并借此而活。因此，在圣礼仪中，作为现象，作为「现象」本身，我们肉身所见的乃是饼；而作为依循至高心智所赐予的，凭着我们的信德（因为这超越我们心智的理解），我们默观上帝本体的圣体。
  - type: paragraph
    text:
      ru: 'Это один из наиболее сильных моментов из того, о чем я хочу говорить вам: каким образом мы, рожденные во грехах, как говорит Давид в псалме:«Се бо, в беззакониих зачат есмьаз, и во гресех роди мя мати моя»(Пс.50:7), можем достигнуть освящения всего нашего бытия: и духа, и ума, и даже тела.'
      cn: 这是我想要和你们谈论的内容中，最有力的一个点：我们这些生于罪中的人，正如大卫在诗篇中所说：「诚然，我是在不法中受孕，我的母亲在罪中生了我」(诗篇 50:7)，如何能达到我们整个生命的圣化：包括我们的灵、心智，乃至身体。
  - type: paragraph
    text:
      ru: Так, когда мы со страстями боремся, мы в сфере умного видения переходим на другой план. Это не есть монашеская жизнь – ходить, подняв брови, раскрыть глаза без мысли, улыбаться и «положить язык на плечо». Нет! Это постоянное напряжение и борьба с врагом; а враг есть ум космических измерений.
      cn: 这样，当我们与情欲搏斗时，我们就在灵性洞察的领域进入了另一个层面。这不是修道生活——走路时扬着眉毛，双眼无神地张开，微笑，并且「把舌头搭在肩上」。不！这是一种持续的紧张，以及与仇敌的搏斗；而仇敌是具有宇宙量级的智慧。
  - type: paragraph
    text:
      ru: Характер наших бесед – семейный, между монахами. Присутствующие друзья наши весьма близки к нам, и мы не стыдимся говорить в их присутствии.
      cn: 我们的交谈具有家庭式的性质，是在修士之间进行的。我们在场的朋友与我们非常亲近，在他们面前说话我们也不觉得羞愧。
  - type: paragraph
    text:
      ru: 'Кто-нибудь невежественный скажет: «Какая гордость у этих монахов!» Я подчеркиваю, невежественный человек, потому что и Сам Бог, при всем Своем беспредельном величии, – смиренный. И если мы живем истинно в Боге Истинном, то, как бы Он ни возносил нас, какими бы знаниями мы ни обладали, мы будем смиренными, как говорит об этом замечательно отецСилуан Афонский: «Хотя бы каждый день Бог возводил меня в созерцание небесной славы, я все-таки буду плакать о своих грехах»[144]...'
      cn: 某个无知的人会说：「这些修士多么骄傲啊！」我强调，这是一个无知的人所说，因为甚至上帝本身，尽管祂拥有无限的威严，也是谦卑的。如果我们真正在真上帝里面生活，那么，无论祂如何高举我们，无论我们拥有怎样的知识，我们都会是谦卑的，正如阿索斯山长老圣西卢安对此所言甚是精妙：「即使上帝每天将我提升至默观天上荣耀的境地，我仍会为自己的罪哭泣」[144]……
  - type: paragraph
    text:
      ru: Начало монашеской жизни – это борьба со страстями, которая требует не только ума, но и мудрости. Помню, я говорил о том, как переходить от помыслов, которые нас осаждают, к состоянию должной, чистой молитвы. И сегодня, беседуя о начале жизни духовной как о борьбе со страстями, мы будем говорить об умном видении действия страстей в нашей жизни.
      cn: 隐修生活之始，是与诸情欲的争战，这不仅需要理智，更需要智慧。我记得，我曾讲过，如何从那些围困我们的意念，过渡到合宜而纯洁的祈祷状态。而今天，在谈论作为与诸情欲争战的属灵生活之始时，我们将谈论关于理智对诸情欲在我们生命中之作用的洞见。
  - type: paragraph
    text:
      ru: 'Когда внутреннее внимание человека-монаха находится в постоянном предельном напряжении, то естественно человек развивается и становится чрезвычайно чутким ко всякому движению мысли внутри нас. Прп. Никодим Афонский, начальник великого «Добротолюбия», назвал свою книгу «Невидимая брань». Итак, наша жизнь проходит в этой умной сфере, где, как говорит прп. Силуан, наш ум с умом врага в борьбе[145]. Есть много движений, которые нам кажутся совершенно нормальными, но которые, по существу, умерщвляют человека, – и с ними мы боремся: «со страстями», потому что человек «страдает». Когда он становится рабом греха, то, по слову Самого Христа, он теряет возможность жить в доме Отца. В Евангелии так говорит Господь:«всякий, делающий грех, есть раб греха. Но раб не пребывает в доме вечно; сын пребывает вечно»(Ин.8:34–35).'
      cn: 当修士的内在注意力处于持续的极致张力中，人自然而然地发展，并变得极其敏锐，对于我们内心思想的每一个动向。阿丰斯山的圣尼哥底母，这部伟大《爱圣》的编纂者，将他的书命名为《不可见的争战》。那么，我们的生命就在这个心智领域中度过，在那里，正如圣西拉所说，我们的心智与仇敌的心智在争战中[145]。有许多动向，它们在我们看来完全正常，但本质上却使人死亡——我们与之搏斗的，是「诸情欲」，因为人「受苦」。当他成为罪的奴仆时，那么，按照基督自己的话语，他就失去了住在天父家中的机会。在福音书中，上主如此说：「凡犯罪的，就是罪的奴仆。奴仆不能永远住在家里；儿子却是永远住在家里。」(约翰福音 8:34-35)。
  - type: paragraph
    text:
      ru: 'Почему мы молимся столько раз каждый день: «Сподоби, Господи, в день сей без греха сохранитися нам»? – Это великое прошение сказано отцами, потому что не чист человек от греха, хотя бы только он прожил один час. Поэтому прожить день, или вечер, или ночь, или утро без греха – это есть великое достижение. Такие достижения достаются не без труда, не без болезни. Так что монашеская жизнь по натуре своей есть всегда жизнь, полная напряжения, полная болезней, полная скорбей. Поскольку заповеди Бога нашего Иисуса Христа превосходят всякую человеческую относительную меру, ибо носят характер абсолютности, постольку монах никогда не знает покоя. Хотя бы он творил чудеса, он все равно знает себя грешным человеком.'
      cn: 为何我们每日如此多次祷告：「求祢恩准，上主，使我们今日免于犯罪」？——这是一个伟大的祈求，是众教父所言，因为人并不洁净，无法离罪，哪怕他只活了一个小时。因此，能活过一日，或一晚，或一夜，或一晨，而无犯罪——这便是一个伟大的成就。这样的成就并非不劳而获，并非毫无痛苦。所以说，隐修生活就其本质而言，永远是一种充满张力、充满痛苦、充满忧患的生活。既然我们上帝耶稣基督的诫命超越一切人类相对的尺度，因为它们带有绝对性，所以隐修士永远不知道安宁。哪怕他施行奇迹，他仍然知道自己是一个有罪的人。
  - type: paragraph
    text:
      ru: 'Но какие способы борьбы со страстями? – Здесь нам придется учиться годами и годами. Это не университетский курс четыре-пять лет – это курс на всю жизнь, до конца. Шестьдесят седьмой год я монах и скажу вам, истину скажу: я не лениво прожил многие годы и не знаю, что со мной будет. Я чувствую себя недостойным Бога.'
      cn: 可是，与情欲搏斗的方式又有哪些呢？——在这里，我们需要年复一年地学习。这不是为期四五年的大学课程——这是一门持续一生、直到终了的课程。我做了六十七年修士，我要告诉你们，我说的是真话：我没有懒惰地度过许多年，但我不知道我的结局会如何。我感到自己不配上帝。
  - type: paragraph
    text:
      ru: 'Если мы будем говорить о том, как бороться со страстями, то в нашем умном видении мы будем судить, что есть грех, только при посредствии заповедей Христа. Сам человек не познает своего греха. И потому Господь в Евангелии сказал:«есливынеповерите,что ЯТот, Который открылся Моисею на Синае АЗ ЕСМЬ СЫЙ,то умрете во грехахсвоих» (см.Ин.8:24). Так, когда речь идет о Божественной святости, это превосходит всех нас. И потому, естественным образом, при нормальном сознании монаха все воспринимается так, как Сам Господь заповедал:«вы, когда исполните все повеленное вам, говорите: мы рабы ничего не стоящие»(Лк.17:10).'
      cn: 如果我们谈论如何与情欲搏斗，那么在我们明智的洞察中，我们将唯独藉着基督的诫命来判断何为罪。人自身无法认识自己的罪。因此上主在福音中说：「如果你们不信我是那在西奈山上向摩西启示的『我是自有永有者』，你们就必死在自己的罪中」（参阅约翰福音 8:24）。因此，当谈及神圣的圣洁时，这超越了我们所有人。因此，自然而然地，在修道者正常的心智中，一切都被如此看待，正如上主亲自命令的：「你们做完一切所吩咐的，就说：我们是无用的仆人」（路加福音 17:10）。
  - type: paragraph
    text:
      ru: 'По мере того, как из года в год, изо дня в день вы будете читать Евангелие, придет к вам понимание того, что заповедь Христа превышает нас и что вместе с тем мы должны ее сохранить. Получается такое мышление контрадикционное[146]: с одной стороны, это невозможно, а с другой стороны, это поставлено нам в долг. Это невозможно, когда мы живем сами, своим умом, своими силами. Но когда бывает Бог с нами, тогда это становится возможным (ср.Лк.18:27). Блаженный Силуан говорит: «Но и тогда это еще не совершенство»[147], ибо совершенство на Земле недоступно и нереализуемо.'
      cn: 随着你们年复一年、日复一日地阅读福音，你们会明白基督的诫命超越我们，而同时我们又必须持守它。于是产生了一种矛盾的思想[146]：一方面，这是不可能的；另一方面，这又是我们应尽的本分。当我们凭自己、凭着自己的理性、凭着自己的力量而活时，这是不可能的。但是，当上帝与我们同在时，这就变得可能（参 路加福音 18:27）。圣西卢安说：「然而，即使在那时，这仍然不是完美的境界」[147]，因为在地上的完美是无法达到的，也是无法实现的。
  - type: paragraph
    text:
      ru: 'В монашеском подвиге отличительной чертой являются мудрость и разум: это – священная жизнь. Люди не видят этого и не знают. Однако монашество есть, поФеодору Студиту, третья степень благодати – высшая[148].'
      cn: 在 мона修功修中，智慧与悟性是其显著特点：这是一种神圣的生命。人们看不到这一点，也不知道。然而，根据圣提奥多尔·斯图迪特的说法， мона修生活是恩典的第三等级——最高的等级[148]。
  - type: paragraph
    text:
      ru: И как совмещаются в нас эти противоречия логические? Получается некоторое несовпадение с нормальной логикой, ибо наша формальная логика не годится для выражения нашей жизни.
      cn: 那么，这些逻辑上的矛盾是如何在我们里面并存的呢？这造成了与正常逻辑的某种不符，因为我们的形式逻辑不足以表达我们的生命。
  - type: paragraph
    text:
      ru: 'Если Господь сказал:«без Меня не можететворитиничего» (см.Ин.15:5), то мы спрашиваем Его: «В таком случае, когда мы не творим, вина Твоя? Ты со мною не сотрудничаешь. Я сам не могу. Эта жизнь только у Тебя, и Ты отказываешься, а мне ставишь это в ответственность?» Получается, как будто бы в чем-то нет склейки. Но то бытие, в котором мы вращаемся, оно не подлежит тем же самым категориям относительности и исключения, как это требует формальная логика. Мы должны ощущать себяобязаннымижить свято, то есть без греха.'
      cn: 如果上主说了：「离了我，你们就不能作什么」（参阅 约翰福音 15:5），那么我们便问祂：「既然如此，当我们不作为时，是祢的过错吗？祢不与我合作。我自己不能。这生命唯独在祢那里，而祢却拒绝，反而将这责任归于我？」这样看来，似乎有些地方未能完全契合。然而，我们所置身其中的那个存在，它不受制于形式逻辑所要求的那些相同的相对性和排斥范畴。我们应当感到自己有义务过圣洁的生活，也就是说，无罪。
  - type: paragraph
    text:
      ru: И когда приходит к нам какая-либо страсть, сначала в форме мысли-помысла, тогда мы начинаем борьбу. Прошлый раз я говорил о борьбе с помыслом, который нас атакует.
      cn: 当任何一种情欲临到我们时，首先是以意念-试探的形式，那时我们就开始争战。上次我谈到关于与攻击我们之试探的争战。
  - type: paragraph
    text:
      ru: 'Сегодня я хотел бы говорить более общим порядком. Всякая мысль, которая не соответствует по духу заповедям Евангелия, есть грех. И мы должны избежать его. А как избежать? – Когда появляется в нас действие мысли какой-либо, тогда мы кричим: «Господи, исцели мой ум! Господи, исцели мое сердце! Господи, исцели всего меня! Ты видишь, как я терзаюсь, когда меня, как раба, мучает мысль, бессмысленная по существу. Молю Тебя, защити меня! Ты знаешь, что у меня нет другого желания, как только жить по заповедям Твоим. Заповедь Твоя есть наивысший закон для всего моего бытия: и временного, и вечного. Ты дал мне полюбить заповеди Твои. Ты дал мне Свет Твой, чтобы видеть красоту Божественной жизни. И ныне спасай меня от власти страстных похотений!» Так можно начать беседу с Богом против страсти.'
      cn: '今天我想更广义地谈谈。凡是在精神上不符合福音诫命的意念，就是罪。我们应当避免它。


        那么，如何避免呢？——当某种意念的活动在我们心中生出时，我们便呼喊：「主啊，医治我的心智！主啊，医治我的心！主啊，医治我的全人！祢看见我如何受折磨，当那本质上毫无意义的意念，像奴仆一样苦害我时。我恳求祢，保护我！祢知道我别无他愿，唯愿照祢的诫命而活。祢的诫命是我整个存有——无论是暂时的，还是永恒的——的最高法则。祢赐予我爱祢诫命的心。祢赐予我祢的光，以看见神圣生命的美善。而今，求祢将我从情欲的权势中拯救出来！」


        如此，我们便可以开始与上帝进行一场抵制情欲的对话。'
  - type: paragraph
    text:
      ru: 'Иногда это может быть монолог, иногда это принимает форму диалога. Пример редчайших диалогов в жизни вселенской Церкви мы находим у прп. Силуана: когда он терзался нападениями врагов, тогда, всею силою души своей желая молиться чисто Богу, сказал Христу:'
      cn: 有时这可能是一段独白，有时它会采取对话的形式。在普世教会生活中，我们从圣西鲁安那里找到了一个极其罕见的对话例子：当他被仇敌攻击而饱受折磨时，他便用灵魂的全部力量，渴望纯洁地向上帝祷告，并对基督说：
  - type: paragraph
    text:
      ru: – Ты видишь, я хочу молиться Тебе, но враги мне мешают.
      cn: – 祢看见，我想要向祢祈祷，但是仇敌阻挠我。
  - type: paragraph
    text:
      ru: 'Господь ответил:'
      cn: 主回答说：
  - type: paragraph
    text:
      ru: – Гордые так страдают всегда.
      cn: – 骄傲的人总是这样受苦。
  - type: paragraph
    text:
      ru: 'И тогда – диалог:'
      cn: 于是 – 对话：
  - type: paragraph
    text:
      ru: – Господи, научи меня, как я могу смиряться!
      cn: – 主啊，教导我，我如何才能谦卑自己！
  - type: paragraph
    text:
      ru: 'И короткий, но действительно трагический и сверхтрагический ответ:'
      cn: 而一个简短但确实是悲剧性、甚至超乎悲剧的回答是：
  - type: paragraph
    text:
      ru: – Держи ум твой во аде и не отчаивайся![149]
      cn: – 持守你的心在地狱中，且不要绝望！[149]
  - type: paragraph
    text:
      ru: 'И это относится к науке – как мы можем прожить день или ночь без греха. Всякая страсть человеческая, поскольку она принадлежит к миру тварному, имеет свои форму, образ и энергию. Верховный ум руководит нами в этой невидимой брани с врагом при помощи благодати, и таким путем, такой молитвой – монологом или диалогом – мы выходим из беседы с врагом и начинаем беседу с Самим Богом. Этот переход от беседы со страстями к беседе с Богом – вот что важно! И если мы все время беседуем с Богом, то, конечно, Бог станет содержанием нашей жизни. А Сам в Себе Он есть извечная«Жизнь», никогда же не умаляемая (ср.Ин.14:6). И независимо от того, с какой страстью мы боремся: будь то плотская страсть, будь то сребролюбие, будь то властолюбие, будь то сластолюбие и так далее, – все равно, принцип, по существу, остается один и тот же: НЕ ОТДАТЬ УМА ВРАГУ...'
      cn: 这同样关乎这门学问——我们如何能无罪度过白昼与黑夜。人的每一情欲，既然属于受造界，就都有其形式、形像与能量。至高的心智在与仇敌的这场无形争战中，借着恩典的帮助引导着我们，借由这种方式，这种祷告——无论是独白式还是对话式——我们脱离与仇敌的交谈，开始与上帝亲身交谈。这种从与情欲的交谈转向与上帝的交谈——这才是至关重要的！如果我们始终与上帝交谈，那么，上帝自然就会成为我们生命的内涵。而祂在自身之中，就是永恒的「生命」，永不匮乏（参阅约翰福音 14:6）。无论我们与何种情欲争战：无论是肉欲，无论是贪财，无论是贪权，无论是贪乐，等等——原则上，其本质始终如一：就是不要将心智交予仇敌……
  - type: paragraph
    text:
      ru: Так, жизнь монаха есть умная жизнь, преисполненная мудрости. Монашество не противно природе человека, а выше естества человека. Когда правильно, с аскетической точки зрения и с духовной, совершается этот подвиг, тогда не возникает заболеваний психических. Люди растут в своем познании бытия в его глубинах. Подумайте, отцы это плотское воздержание назвали «целомудрием» (греч. σωφροσίνη)! Почему они не назвали целомудрием, т.е. полнотою мудрости, даже большую ученость, а именно этот момент? – В измерениях умного видения мы в монашестве по Богу преодолеваем то, что является космическим законом (когда преодолеваем, а не когда падаем). Если человек в этом подвиге преодолевает космический закон, то он становится сверхкосмическим. Однако у монаха видимость – «феномен» (как Святые Дары в Литургии) остается очень скромным. «Феномен» – это то, что мы видим. «Ноумен» – это то, что есть в нас. Так вся наша жизнь проникнута, с одной стороны, «феноменальными» явлениями, которые мы видим, а с другой стороны, то, что происходит в уме нашем («ноумен»), – совсем другое. Потому люди, которые подходят к суждению о монашестве, не учитывая всего этого, полные невежды в монашестве. И это невежество, к сожалению, даже среди церковных кругов наличествует.
      cn: 确实地，修士的生活是一种心智生活，充满着智慧。修道主义不与人的本性相悖，而是超越人的自然本性。当这项苦修从苦修学角度和属灵角度正确进行时，就不会出现精神疾病。人们在对存有及其深度的认识上不断增长。想想看，教父们将这种肉体的节制称作「贞洁」（希腊语：σωφροσίνη）！为何他们没有把「贞洁」，即智慧的丰满，甚至更渊博的学识，称作「贞洁」，而是偏偏称作这个时刻呢？——在心智洞见的维度中，我们在修道生活中靠着上帝，超越了宇宙法则（当我们超越时，而不是当我们堕落时）。如果一个人在这项苦修中超越了宇宙法则，那么他就变得超宇宙。然而，修士的外在可见之物——「现象」（如同礼仪中的圣体圣血）——依然非常不起眼。「现象」——是我们所看到的。「本体」（ноумен）——是我们内在所是。因此，我们整个生命都渗透着，一方面是我们所见的「现象性」事物，另一方面发生在我们心智中的事物（「本体」），则完全不同。因此，那些在评判修道主义时，没有考虑到这一切的人，是完全不懂修道主义的门外汉。而这种无知，很遗憾地，甚至存在于教会圈子中。
  - type: paragraph
    text:
      ru: 'И, опять и опять, в борьбе со страстью наш ум будет падать, цепляясь, как треножник, где-то за землю. Но придет время, когда и мы, из-за нашего напряжения жить по заповеди Божией, разовьемся и станем чуткими, как Ангелы. Тогда монахом-человеком ощущается всякое малейшее движение атмосферы, всякая мысль человеческая, противная Богу, – в себе, прежде всего, и, когда нужно, в других. Почему получается так нескладно? – Потому что я вижу себя в грехе и борюсь с грехом, а в брате моем я не вижу греха. И вместе с тем, как могу я быть духовником, если я не вижу греха брата моего? Значит, должно быть совмещение видения и своего греха, и той же самой болезни в брате нашем. Так что вначале лучше всего видеть только свои грехи: «Сподоби, Господи, в день сей без греха сохранитися нам», и«все»остальное«приложится вам»(Мф.6:33).'
      cn: 而且，一次又一次地，在与情欲的搏斗中，我们的心智会跌落，像三脚架一样挣扎着附着在大地上。但时日将到，那时我们因努力持守上帝的诫命，会获得长进，变得像天使一般敏锐。那时，修士——人能感受到气氛中每一个最细微的动向，感受到每一个违背上帝的人类思想——首先是在自己里面，并且在需要时，也在他人里面。为何会如此不协调呢？——因为我看见自己处于罪中并与罪搏斗，但在我的弟兄里面，我却看不见罪。然而，如果我看不见我的弟兄的罪，我又怎能作一位神师呢？因此，必须同时看见自己的罪，以及我们弟兄身上同样的疾患。所以起初最好只看见自己的罪：「主啊，求祢使我们今日得以无罪蒙保守」，并且「这一切就都加给你们了」（马太福音 6:33）。
  - type: paragraph
    text:
      ru: 'А принцип борьбы со страстями – не отдать ума и сердца страстным помыслам, но переходить от сих помыслов, которые приносит нам враг, на беседу и молитву с Богом. В моей маленькой новой книге я пишу, что «молитва есть нескончаемое творчество»[150]. То, что я сегодня говорил вам, – лишь маленький намек на нечто из этого нескончаемого боя. Да, это бой, это сражение! Господь сказал:«мужайтесь: Я победил мир»(Ин.16:33).'
      cn: 而与情欲争战的原则，不是将理智和心灵交付给情欲的思虑，而是要从这些由仇敌带给我们的思虑，转向与上帝交谈和祈祷。在我这本小小的、新近出版的书中，我写道：「祷告是无尽的创造」[150]。我今天对你们所说的，不过是对这场无尽争战中某个层面的微小提示。是的，这是一场搏斗，这是一场争战！主说：「你们要壮胆：我已战胜了世界。」(约翰福音 16:33)
  - type: paragraph
    text:
      ru: 'Опять и опять: мы должны помнить слова апостола Павла к филиппийцам как один из самых основных принципов нашей жизни:«внасдолжны бытьте же мысли,те же чувствования, чтово Христе Иисусе»(см.Флп.2:5), – то есть чтобы ум наш стал подобным уму апостола Павла (ср.1Кор.4:16), который говорит:«А мы имеем ум Христов»(1Кор.2:16). Когда наша мысль совершенно совпадает с тем, что включают в себя заповеди, тогда умом нашим мы разумеваем, что попадаем в сферу Божественного мышления. Нам нужно знать об этом, чтобы дорожить этим и не дать, по неведению, всему этому пройти, не оставив следа в нас. После нескольких лет упорного труда аскетической монашеской жизни это умное видение пребудет с нами все время...'
      cn: 一遍又一遍：我们必须铭记使徒保罗致腓立比人的话语，将其作为我们生命中最基本的原则之一：「在我们里面，应当有与基督耶稣同样的心思和意念」（腓立比书 2:5）——也就是说，为了让我们的心智变得像使徒保罗的心智（参阅哥林多前书 4:16），他说道：「我们却有基督的心智」（哥林多前书 2:16）。当我们的思想与诫命所包含的一切完全吻合时，那时，我们便通过我们的心智领悟到，我们进入了神圣思想的领域。我们必须明白这一点，好去珍视它，不至于因为无知，而让这一切逝去，不在我们里面留下任何痕迹。在数年苦修的修道生活辛劳之后，这种心智的洞见将一直与我们同在……
- type: heading1
  text:
    ru: 'Беседа 22: О борьбе за пребывание умом в Боге[151]'
    cn: 讲道 22：论以心神安住于上帝的争战[151]
  children:
  - type: paragraph
    text:
      ru: Страсть имеет свой образ. Борьба за несосложение ума с помыслом творческой молитвою. Опасность плотских помыслов. Держать ум в Боге можно только силою Самого Бога. Приход Бога как освобождение от рабства материи. Методы борьбы за вырывание ума у помысла. Надо, чтобы сам Бог пришел к нам. Трагедия мира – грех самообожения. Обожение через пребывание умом в Любви Божией.
      cn: '情欲有其形象。

        借着创造性祷告，争取心智不与意念苟合。

        肉体意念的危险。

        唯有借着上帝自身的能力，才能将心智持守在上帝里。

        上帝的来临，即是从物质奴役中得蒙释放。

        将心智从意念中拔出的争战方法。

        必须让上帝亲自来到我们这里。

        世界的悲剧是自我神化的罪。

        借着心智住在上帝的爱中而达致成神。'
  - type: paragraph
    text:
      ru: 'Когда мы говорили о том, как можно победить отдельный помысел, который нападает на нас, пленяет ум, оскверняет все, что в нас, внутри, это было слово только о деталях нашего общего подвига. Я хотел бы найти самую простую формулу для того, чтобы выяснить с вами этот глубокий и чрезвычайно важный для нас вопрос. Получается так: когда мы теоретически излагаем что-либо, то это кажется так просто и так ясно. Но в действительной жизни нашей это совсем не просто. И надо всю жизнь свою пребыть в аскетическом напряжении и, прежде всего, в умном трезвении и в умной молитве.'
      cn: 当我们谈论如何战胜一个攻击我们、俘虏我们的心智、玷污我们里面一切的个别意念时，这只是关于我们总体灵修功课细节的话语。我希望能找到一个最简单的方法，以便和你们一起探讨这个对我们来说既深刻又极其重要的问题。事情是这样的：当我们理论性地阐述某事时，它看起来是如此简单和清晰。但在我们真实的生活中，这却一点也不简单。而且我们必须一生都处于苦修的张力之中，并且，首先是在心智警醒和心祷之中。
  - type: paragraph
    text:
      ru: 'После падения и «вы-падения» Адама из мира Божественного в мир тварный всякая страсть имеет свой образ. И когда нас пленяет какой-нибудь отдельный помысл, мы переходим к мышлению о том, как бороться со всеми страстями, вместе взятыми. Я уже говорил вам о принципе: не отдать ума, когда страсть какая-нибудь прилагается к нам и влечет на грех. Монах должен научиться управлять своим умом и постоянно смотреть – где он, наш ум. Если ум в страстных образах, то это оскверняет всего человека: и ум, и душу, и даже тело. И наоборот, когда ум наш, уязвленный по благодати свыше любовию Христовою, влечется туда, где Он, Христос, тогда происходит обратное: ум наш и все существо наше освящается, возвышается, приближается к Богу и с годами становится способным так освоиться с Богом, что и день и ночь – всегда человек умом пребывает в Боге.'
      cn: 亚当堕落并「坠出」神圣世界进入受造世界之后，各种情欲都带上其自身的形像。当某个单一意念将我们俘虏时，我们便转向思考如何与所有情欲一同争战。我曾对你们说过一个原则：当某种情欲附于我们并引我们犯罪时，切勿将心智交出。修士必须学会掌管自己的心智，并不断地省察——我们的心智在何处。若心智停留在情欲的形像中，这就会玷污整个人：即心智、灵魂，甚至身体。反之，当我们的心智被从高处而来的基督之爱所触动，并被吸引到基督所在之处时，那么相反的情形就会发生：我们的心智和我们整个存在都会被圣化、提升、亲近上帝，并且随着岁月的流逝，变得能够如此习惯于与上帝同在，以至于无论昼夜，人都能在心智上常与上帝同在。
  - type: paragraph
    text:
      ru: 'При этом есть одна тонкая деталь: никакая страсть не может в нас действовать, если наш ум свободен и не в образах этой страсти. Только тогда приобретает силу над нами страстный помысел, когда мы умом нашим соприкасаемся с образами страстей и живем ими.'
      cn: 此外，有一个微妙的细节：没有任何情欲能在我们心中作祟，如果我们的心智是自由的，并且不活在这情欲的意象之中。只有当我们的心智与情欲的意象有所接触，并沉湎其中时，情欲的思念才会在我们身上得势。
  - type: paragraph
    text:
      ru: Научиться вырывать ум наш от всякой мысли, направленной в сторону греха, – это великая наука. Начинается она очень просто. Вы уже знаете, что перевести внимание ума нашего на другой предмет возможно различными путями. Наилучший путь – когда Господь с нами. Тогда все превращается в молитву благоговейной любви к Богу и в слезах покаяния забывается страстный мир греха. Но не всегда удается нам пребыть в такой молитве. Бог оставляет нас, чтобы мы сами потрудились. И вот, когда какой бы то ни было страстный образ атакует нас, необходимо вырвать наш ум оттуда и «разделиться» с этим образом страсти. Тогда образы страстей не принимают действительной, активной силы, а остаются в пассивном состоянии.
      cn: 学习将我们的心思从一切导向罪的念头中抽离，是一门伟大的学问。它起始于非常简单之处。你们已经知道，将我们心思的注意力转移到另一个对象上，有多种途径。最好的途径是当主与我们同在之时。届时，一切都将转化为对上帝的虔敬之爱的祷告，并在悔罪的泪水中，那充满情欲的罪恶世界便被遗忘。然而，我们并非总能常存于这般祷告之中。上帝暂时离我们而去，好让我们自己去劳作。于是，当任何一种情欲的形象攻击我们时，我们必须将心思从那里抽离，并与这情欲的形象「分离」。届时，情欲的形象便不会获得真实而主动的力量，而是保持在被动的状态。
  - type: paragraph
    text:
      ru: Есть немало молитв, которые хорошо знать, но можно и самим создать, так как «молитва есть непрестанное творчество»[152]. И когда мы не находим в себе силы сразу вырваться вниманием ума от страсти, тогда наилучшим путем бывает огненное покаяние, крик к Богу:Свободы меня от власти сих духов! Возведи ум мой на Небо, где Ты пребываешь, Боже мой! Избавь меня от адского пленения страстей!
      cn: '有不少祷文值得熟知，但也可以自己创作，因为「祷告是持续不断的创造」[152]。当我们发现自己没有力量立刻将心思从情欲中挣脱出来时，那么最好的方式就是火热的忏悔，向着上帝的呐喊：


        救我脱离这些灵的权势！将我的心思提升到祢所居住的天上，我的上帝啊！将我从情欲的地狱般囚禁中解救出来！'
  - type: paragraph
    text:
      ru: Можно молиться и так, как сказано в одной из молитв, приписываемой прп.Исааку Сирину:Возведи ум мой, долу скитающийся низко, к Тебе в небеса, где Ты живеши, Господи.
      cn: 人也可以这样祷告，正如一篇归于叙利亚的圣以撒名下的祷文所说的：主啊，提升我那在尘世间低徊游荡的心智，到祢在诸天之中所居住之处。
  - type: paragraph
    text:
      ru: Есть хорошая короткая молитва к Ангелу-хранителю:Ангеле Божий, хранителю мой святый, живот мой соблюди во страсе Христа Бога, ум мой утверди во истиннем пути и к любви горней уязви душу мою. Эта молитва очень помогает сразу вырвать наш ум этими словами:ум мой утверди во истиннем пути и к любви горней уязви душу мою. И когда так проводим мы время, не позволяя нашему верховному уму сливаться с грязными страстями, оскверняющими всего человека, мы можем с несравненно меньшим трудом проводить борьбу со страстными помыслами.
      cn: '有一段很好的向守护天使献上的短祷：

        上帝的天使，我圣洁的守护者，保守我的生命常存对基督上帝的敬畏，坚定我的心智行走在真理的道路上，并使我的灵魂被那属天之爱所刺透。这段祷告能立即以这些话语帮助我们将心智从中拔出：坚定我的心智行走在真理的道路上，并使我的灵魂被那属天之爱所刺透。当我们这样度过时光，不容许我们至高的心智与那污秽的激情融合，污染整个人格的，我们就能以不可比拟的、更小的努力来与那些激情意念搏斗。'
  - type: paragraph
    text:
      ru: Область, где мы особенно должны внимать себе, – это физиология нашей жизни и то, что заложено в нашем организме как путь к произведению на свет себе подобных – прокреации. Даже когда это движение бывает в нас как физиологически естественное, и тогда монах вырывается из него. И когда таким путем идет монах, то его ум освящается и очищается и постепенно становится утонченным аппаратом, который улавливает малейшие движения страстей в окружающей его атмосфере. К этому состоянию приходит аскет постепенно, долгим опытом. И таким образом сохраняется он без греха.
      cn: 我们尤其当警醒自守的领域，是我们生命的生理机能，以及我们身体中被赋予的、作为生育后代之路的——生殖。即使这冲动在我们里面是生理上自然的，修士也要从中挣脱出来。当修士走在这条道路上时，他的心意就被圣化和洁净，并逐渐成为一个敏锐的器官，它能察觉周围氛围中最小的激情冲动。苦行者凭借长期的经验，逐渐达到这种状态。这样一来，他就保守自己没有罪。
  - type: paragraph
    text:
      ru: Вообще наша жизнь в Боге требует необычайно глубокого проникновения в тайны Бытия Божественного. При этом нам не дано проникать в них нашими силами. Но когда Бог дает нам благодать Свою, то Он причащает нас Своей жизни.
      cn: 一般来说，我们在上帝里的生命需要异常深刻地参透神圣存有的奥秘。然而，我们无法凭自己的力量参透它们。但是，当上帝赐予我们祂的恩典时，祂就使我们分享祂的生命。
  - type: paragraph
    text:
      ru: Созданные из ничто, взятые от земли (см.Быт.2:7), мы не способны познавать Бога. И совершенно необходимо, чтобы Бог Сам открывался нам. Если после падения враг располагает возможностью входить во внутреннюю нашу жизнь и там порабощать нас, то тем более Богу доступно проникнуть в нас и действовать внутри нас. Только таким путем, сохраняясь от всякого греха, возможно иметь наш ум постоянно возрастающим в своей способности познавать Бога через Божественную любовь. Так, помните, дорогие братья мои и сестры мои, что никакая страсть не может действовать в нас активно, если мы удерживаем ум свой в Боге.
      cn: 从虚无中被创造，取自尘土（参看创世记 2:7），我们无法认识上帝。并且，绝对必要的是，上帝亲自向我们启示祂自己。如果在堕落之后，仇敌拥有能力进入我们内在的生命，并在那里奴役我们，那么，上帝就更能够渗透进我们里面，并在我们里面运行。唯有通过这种方式，保持自身免于一切罪恶，才可能使我们的心智不断增长其通过神圣的爱来认识上帝的能力。因此，我亲爱的弟兄姊妹们，请记住，如果我们把心智持守在上帝里面，任何情欲都不能在我们里面主动地运行。
  - type: paragraph
    text:
      ru: 'Окружающая нас материальная реальность подавляет нас своим постоянным присутствием. Конечно, мы будем скользить «вниз». Но если мы постоянно будем держаться правила и хранить наш ум в путях истины, в заповедях Христа Бога, то, конечно, прогресс наш будет очень быстрым. Собственно, ничего детерминированного нет. Это странная вещь: Бог, беспредельно превосходящий нас, по временам кажущийся нам далеким, дальше звездных миров, может нас посетить и действовать в нас полной силой. Но, как я пытался объяснить в книге о старце[153], Бог действует редко таким путем. Почему? – Потому что, когда уязвится действительно душа любовью Бога (как пишет наш блаженный покровитель прп. Силуан: «Ты дал мне насладиться Духом Твоим Святым, и душа моя возлюбила Тебя»[154]) и когда кто с самого начала получает сильную благодать, возможную, по существу говоря, только для совершенных, тогда путь становится страшно тяжелым. В этом состоянии человек не может выполнять своего долга в нашем земном мире. Он будет пребывать в постоянном восхищении. Однако Бог оставляет человека, и он с болезнью ищет Бога, чтобы снова Тот действовал в нем со всею силою Своею.'
      cn: 我们周围的物质现实以其持续不断的存在压抑着我们。当然，我们会「向下」滑落。但如果我们持续不断地遵守规矩，并将我们的心智保持在真理的道路上，在基督上帝的诫命中，那么，我们的进步无疑会非常迅速。事实上，没有什么事是注定的。这是一件奇特的事：上帝，无限地超越我们，有时在我们看来遥远，远超星辰世界，却能探访我们，并在我们里面以完全的力量运行。但是，正如我在那本关于长老的书[153]中曾试图解释的，上帝很少以这种方式运行。为什么？——因为，当灵魂真正被上帝的爱所刺透（正如我们蒙福的庇护者，圣西卢安长老所写：「祢使我享受到祢的圣灵，我的灵魂便爱慕了祢」[154]），并且当某人从一开始就领受强大的恩典，这恩典实质上只可能赐予那些达到完全的人时，那条道路就会变得极其艰难。在这种状态下，人无法在我们这个尘世间履行自己的本分。他将持续地处于狂喜之中。然而，上帝会离开这个人，而他便带着痛苦寻求上帝，以便上帝能再次以祂的全部力量在他里面运行。
  - type: paragraph
    text:
      ru: 'Мы, долу влачащиеся, можем найти и должны найти многие разные пути освобождения нашего внимания. Когда нам не удается побеждать молитвою страстные помыслы, будем читать. Если нельзя читать, будем рассуждать, где-то найдем работу некую или какого-то человека другого и поговорим с ним: лишь бы быть свободными от этой страсти. И это – болезненная и долгая аскеза: освобождать наш ум и переносить его внимание в другую область, и прежде всего туда, где пребывает Господь, по совету и заповеди апостола Павла (см.Флп.4:7;Кол.3:2;Рим.12:2; Еф.4и др). Так, «долу», то есть низкими земными страстями, порабощенный ум бессилен бывает сам подняться до неба. Но боритесь всеми путями: трудом, прогулкой, какой-нибудь работой, интеллектуальной или физической, беседой с братом и т.п. Все это – маленькие вещи сами по себе, но результат, получаемый от этого рода борьбы, чрезвычайно драгоценен.'
      cn: 我们这些在下方挣扎的人，可以也必须找到许多不同的途径来解放我们的注意力。当我们无法借着祷告战胜情欲思虑时，就去阅读。如果无法阅读，就去思考，或者去某个地方找点事做，或者找另一个人交谈：只要能摆脱这种情欲就行。而这是一种痛苦而漫长的苦修：解放我们的心智，并将它的注意力转移到另一个领域，首先是转移到上主所在之处，这乃是依照使徒保罗的建议和诫命（参见 腓立比书 4:7，歌罗西书 3:2，罗马书 12:2；以弗所书 4章等）。因此，被「下方」，即被低下的世俗情欲所奴役的心智，本身是无力升至天上的。但要通过一切途径去争战：借着劳作、散步、某种工作（无论是脑力还是体力劳动）、与弟兄交谈等等。所有这些本身都是小事，但从这种争战中获得的结果却极其宝贵。
  - type: paragraph
    text:
      ru: Мне естественно после почти семидесяти лет монашества знать об этом. И вам я могу сказать, мои молодые братья и сестры, что не приходится торопиться в нашей жизни. Рост наш зависит от промысла Божия о нас. Иногда получается так, что монах живет долгую жизнь, полвека, и еще не знает смысла монашества.
      cn: 在将近七十年的修道生活之后，我自然地了解此事。我也可以告诉你们，我年轻的弟兄姐妹们，在我们的生命中，无需着急。我们的成长取决于上帝对我们的安排。有时会发生这样的情况，一位修士度过了漫长的一生，半个世纪，却仍然不了解修道的真谛。
  - type: paragraph
    text:
      ru: Вы видите, с каким трудом ищу я путей объяснить вам то, что происходит в бытии тварном. Во всем бытии, которое нас окружает, даже видимое является необычайно глубокою тайною. И жить нам приходится все время пред очами этой тайны, ожидая, когда она, эта тайна святая Самого Бога, пожелает открыться нам. Итак, зная по опыту своему, что это совсем не малая вещь и не легко дается, я все-таки говорю об этом, потому что надлежит вам знать с самого начала о том, что возможно для Бога сделать с человеком; о том, как мы можем достигнуть нашего блаженства через пребывание в Боге. Нашим естественным умом, или рассудком, мы проникнуть в эти тайны не можем. Это лежит вне способностей нашего духа, поэтому всегда необходимо, чтобы Господь Сам открывался нам.
      cn: 你们看，我多么努力地寻求向你们解释在受造的存有中发生着什么。在所有环绕着我们的存有中，甚至可见之物仍是一个异常深奥的奥秘。而我们必须时刻生活在这奥秘的眼前，等待着它——这上帝本身的圣洁奥秘——何时愿意向我们开启。所以，凭着我的经验，我知道这绝非小事，且不易得获，但我仍旧谈论此事，因为你们从一开始就应当知道：上帝能对人成就什么；以及我们如何能通过寓居于上帝之中而达致我们的福乐。凭着我们自然的理智，或者悟性，我们无法洞悉这些奥秘。这超越了我们精神的能力，所以，总是必须上主亲自向我们开启。
  - type: paragraph
    text:
      ru: Надо жизнь свою построить не на наших догадках, а на Откровении Божием. Трагизм событий окружающего нас мира связан с отвержением этого пути. Грехсамообожения– вот что терзает человека и убивает его. В моей книге, изданной в Париже, есть маленькая глава «О молитве, превосходящей всякий трагизм»[155]. Что действительно горько видеть, что действительно погружает душу нашу в великую скорбь – это то, что путь, открытый нам Христом и Духом Святым, люди отвергли, забыв, что только Тот, Кто сотворил нас, знает доподлинно все. Никакая человеческая наука не способна проникнуть «туда». И получается наша жизнь простая, а вместе с тем чрезвычайно глубокая и богословски возводящая нас на высоту.
      cn: 我们的生命不应建立在自己的臆测之上，而应建立在上帝的启示之上。环绕着我们的世界所发生的诸般事件的悲剧性，与拒绝这条道路相关联。自我神化的罪——这正是苦害人并置人于死地的。在我那本于巴黎出版的书中，有一个短小篇章题为《论超越一切悲剧性的祷告》[155]。真正令人痛苦地看到、真正使我们的灵魂沉浸于巨大悲痛之中的——乃是人们拒绝了基督和圣灵向我们开启的道路，忘记了唯有那创造我们的，才真正知道一切。任何人类科学都无法洞察「那里」。于是，我们的生命就因此而变得简单，但与此同时却极其深刻，并在神学上将我们提升到崇高的境界。
  - type: paragraph
    text:
      ru: 'Когда мы говорим о путях борьбы в словах коротких: «не отдать ума», «управлять нашим умом», «контролировать ум, все время направляя его на свет заповедей Христа», – из этих мелочей (кажущихся в своей реализации мелочами) создается великая и вечная жизнь. И это и есть цель монаха. Но монашество – это с самого начала до последнего издыхания напряженное внимание: как нам избежать греха, как нам приучить наш дух пребывать в атмосфере любви Божией. И так как спасение есть обожение человека, то в чем состоит обожение? – В том, что человеку, взятому от земли, созданному из ничто, дается власть, возможность, жизнь – жить жизнью Самого Бога...'
      cn: 当我们用简洁的言语谈论争战之道时——「不交出心神」、「掌管我们的心神」、「掌控心神，使其始终导向基督诫命之光」——正是从这些看似微不足道（在其实践中显为微小）的琐事中，伟大的、永恒的生命便由此而生。这正是修士的宗旨。然而，修道生活，乃是从始至终，直至最后一息，都要求我们保持警醒与专注：我们如何规避罪愆，我们又如何训练我们的心神，使其安住于上帝之爱的氛围之中。既然救赎即是人的「成神」，那么，「成神」何在？——在于人——这从土中被取来，从虚无中被造的生命——被赐予权柄、可能性与生命，去活出上帝自身的生命……
  - type: paragraph
    text:
      ru: Вы, дорогие мне братья и сестры, постарайтесь с самого начала вашего подвига не потерять ни одного дня для созидания нашего спасения.
      cn: 你们，我亲爱的弟兄姊妹们，务要努力，从你们属灵功修的伊始，一天也不要失去，为着我们救恩的建立。
- type: heading1
  text:
    ru: 'Беседа 23: О жизни в афонской пустыне[156]'
    cn: 讲论 23：关于阿索斯旷野的生活[156]
  children:
  - type: paragraph
    text:
      ru: Об исходе в пустыню. О молитве, когда забывается мир. О соборе старцев 1938 г. О слове архиеп.Василия Кривошеина. О своем духовническом служении. О разговоре с монахом. О Нетварном Свете.
      cn: 关于出离入旷野。关于当世界被遗忘时的祷告。关于1938年的长老会议。关于瓦西里·克里沃舍因总主教的言论。关于他自己的属灵指导事奉。关于与一位修士的对话。关于非受造光。
  - type: paragraph
    text:
      ru: Да будет Слава Господня благословенна отныне и до века.
      cn: 愿上主的荣耀受颂扬，从今直到永远。
  - type: paragraph
    text:
      ru: Я снова за эти дни собирался мыслями моими на уходе отсюда. С убавлением моих сил, с постепенным увеличением изоляции, на которую я осужден из-за своей старости, не имея возможности ни читать, ни слышать, – я думаю, что «дело» мое кончено... Поэтому я решился рассказать вам о последних днях старца и о первых днях моей жизни по его кончине.
      cn: 我这几天又一次心中思忖着要离开这里。随着我气力的衰减，随着我因年迈而被判的日益加深的隔绝——既不能阅读，也不能聆听——我想，我的「事工」已然完结……故此，我决定告诉你们关于这位长老的最后时日，以及他逝世后我生命的最初时日。
  - type: paragraph
    text:
      ru: 'Когда отец Силуан еще был молод, он серьезно заболел и, ожидая своей кончины, просил игумена Мисаила дать ему благословение на великую схиму. Игумен Мисаил, этот чудный человек, говорит ему: «На схиму Бог тебя благословит, но умрешь ты не скоро», и сказал ему, что с ним будет, точно не помню теперь. Но когда начался тридцать восьмой год, Силуан сказал: «По словам игумена, смерть моя должна прийти в этом году».'
      cn: 当圣西卢安神父还年轻的时候，他得了重病，并在等待他的离世时，请求院长米赛尔赐予他受大圣像衣的祝福。院长米赛尔，这位奇妙的人，对他说：「上帝会祝福你受圣像衣，但你不会很快离世。」他还告诉圣西卢安将来会发生什么，具体我现在记不清了。但当第三十八年开始时，圣西卢安说：「按院长的话说，我的离世应该会在今年。」
  - type: paragraph
    text:
      ru: Незадолго до этого я испросил благословения у игумена, того же святого и чудного мужа Мисаила, разрешить мне пользоваться калибою. На самом деле, это был хороший дом для жизни пожилых людей, которые хотели кончать свою жизнь на Афоне. Он отстоял от монастыря приблизительно на пятнадцать минут ходу по направлению к югу в сторону Дафни, порту Святой Горы. И там я бывал, когда был свободен от богослужений. (В монастыре нас было двое диаконов. Когда присутствовать надо было на всех службах, тогда мало оставалось свободного времени, а когда я был свободен от моей череды, то я больше проводил времени там.)
      cn: 不久之前，我向院长，就是那位圣洁而奇妙的人米赛尔求得了祝福，允许我使用一间隐室。实际上，那是一间不错的住处，专供那些想要在阿索斯圣山度过余生的老年人居住。它距离修道院大约十五分钟的步行路程，往南朝着达夫尼，也就是圣山的港口方向。当我没有礼仪职务时，我就会在那里待着。（在修道院里，我们有两个辅祭。当需要参加所有礼仪时，那么就很少有空闲时间了；而当我轮值休息时，我就会在那里待更多时间。）
  - type: paragraph
    text:
      ru: Сложна была моя жизнь на этой калибе. Я был моложе большинства отцов. Жизнь на такой калибе многими рассматривалась как большая привилегия. Но, как вы знаете по моей книге, Бог даровал мне сокрушение о моих грехах, отчаяние за самого себя и долгий и обильный плач[157].
      cn: 我在这隐修棚里的生活曾是艰难的。我比大多数修道父更年轻。在这样的隐修棚里的生活，被许多人视为极大的殊荣。然而，正如你们从我的书中得知，上帝赐予我为我的罪孽而痛悔、为我自己而绝望，以及长久而丰沛的哭泣[157]。
  - type: paragraph
    text:
      ru: Там было много бесед, о которых я хотел бы говорить с вами.
      cn: 在那里有很多交谈，我希望能与你谈论。
  - type: paragraph
    text:
      ru: 'Однажды спросил меня Силуан:'
      cn: 有一天圣西卢安问我：
  - type: paragraph
    text:
      ru: – Удобно ли Вам молиться на этой калибе?
      cn: – 您在这间隐修室祷告方便吗？
  - type: paragraph
    text:
      ru: 'Я ответил:'
      cn: 我回答说：
  - type: paragraph
    text:
      ru: – Да, удобно. По временам мне кажется, что я забываю мир. Но я помню свое тело.
      cn: – 是的，安适。时而我感觉，我将世界遗忘。但我记得我的身体。
  - type: paragraph
    text:
      ru: 'Удивился я реакции моего отца Силуана:'
      cn: 我诧异于我的父亲圣西卢安的反应：
  - type: paragraph
    text:
      ru: – А тело – что такое тело? Не есть ли это мир?
      cn: — 而身体——身体是什么呢？它难道不就是这个世界吗？
  - type: paragraph
    text:
      ru: 'Я стоял перед этим чудным явлением, и сравнение такое пришло: я – у подножия великой горы, вершина которой скрывается в тучах. Эти слова: «А что такое тело, как не мир?» – возбуждали во мне мысль. Но я не утомлял его вопросами, а воспринимал его слова в надежде, что придет момент и Бог даст мне понять настоящий их смысл.'
      cn: 我站在这奇妙的景象前，脑海中浮现出这样一个比喻：我——立于一座巍峨高山的山脚下，它的山顶隐没在云雾之中。这些话语：「身体若不是世界，那又是什么呢？」激起了我的思索。但我并未用问题烦扰他，而是领受着他的话语，怀着这样的希望：时机将会到来，上帝会让我明白它们真实的含义。
  - type: paragraph
    text:
      ru: В своем сознании через молитву за всего Адама отец Силуан пришел к тому, что тело наше связывает нас – все человечество – во единого Адама.
      cn: 在他的意识中，藉着为着全人类亚当的祷告，西路亚修士领悟到，我们的身体将我们——全人类——联结归入一个亚当。
  - type: paragraph
    text:
      ru: 'Наши беседы, которые даровал нам Господь, все время полны удивления моего старцу: как он стал действительно живою персоною, действительно подлинным христианином!'
      cn: 我们的谈话，是上主赐予我们的，我始终对这位长者充满惊奇：他是如何真正地成为一个活生生的人，真正地成为一个真正的基督徒的！
  - type: paragraph
    text:
      ru: 'В начале тридцать восьмого года он сказал мне: «Когда я умру, Вам лучше испросить благословения и пойти в пустыню, потому что я вижу вас слабым и жизнь в монастыре превышает ваши силы».'
      cn: 在三十八年初，他对我说：「当我去世后，您最好请求赐福，然后去旷野，因为我看到你很软弱，而修道院的生活超出了你的力量。」
  - type: paragraph
    text:
      ru: 'Я постараюсь удержаться от анализа многих деталей. Скажу только, что, когда старец скончался, я действительно пошел к духовнику и сказал: «Может быть, мне лучше жить на пустыне, как пустынники Святой Горы, на Каруле?» И духовник отец Сергий ответил мне: «Да, отец Софроний, идите на пустыню, Бог Вас благословит». Отца Сергия рукополагал в священники епископ Николай Охридский, великий муж, который и меня рукоположил в диакона. И отец Сергий, который очень добро и хорошо относился ко мне, дал мне благословение пойти на пустыню, но сказал: «Вы, конечно, понимаете, что моего благословения не довольно. Вы должны пойти к игумену и у него просить благословения».'
      cn: 我将尽量避免分析许多细节。我只想说，当长老安息后，我确实去找了神师，问道：「也许我最好住在旷野里，像圣山卡鲁利亚的旷野隐修者一样？」神师谢尔盖教父回答我：「是的，索夫罗尼教父，去旷野吧，上帝会祝福祢。」谢尔盖教父是由奥赫里德的尼古拉主教祝圣为司祭的，他是一位伟人，也曾祝圣我为执事。谢尔盖教父对我非常仁慈和友善，他祝福我去旷野，但又说：「祢当然明白，我的祝福是不够的。祢必须去见院长，向他求取祝福。」
  - type: paragraph
    text:
      ru: 'Пошел я к игумену Мисаилу, Бог да помилует меня молитвами его, и говорит игумен: «Бог благословит, отец Софроний. Идите и молитесь на пустыне. Но знайте, что моего благословения не довольно, нужно, чтобы вы получили согласие и совета старцев монастыря».'
      cn: 我去见伊古门米赛尔，愿上帝因他的祷告怜悯我，伊古门说：「愿上帝赐福你，索夫罗尼神父。去荒野祈祷吧。但要知道，我的祝福还不够，你需要获得修道院长老们的同意和建议。」
  - type: paragraph
    text:
      ru: Игумен был болен и не приходил на собрания старцев монастыря, а во главе его бывал председателем заместитель игумена. Я сказал ему о том, что хотел бы уйти на пустыню и хочу отдать себя на суд отцам. Он согласился, и скоро последовал собор старцев, на который я был приглашен.
      cn: 院牧病了，不来参加修道院长老们的聚会，而是由副院牧担任主席。我对他说，我想退隐到荒漠中，并且想将自己交由众父审断。他同意了，很快便召开了长老会议，我也受邀参加了。
  - type: paragraph
    text:
      ru: 'На этом собрании старцев – которое я и теперь ясно вижу, как отпечаталось это тогда в моем сознании, – первым встал иеромонах Виссарион, секретарь игумена, мягкий, тонкий, осторожный человек. Он сказал: «Отец Софроний, этот шаг очень большой и важный, о котором Вы просите совет старцев. И вот мое мнение: Вы останьтесь еще на год в монастыре и тогда, если помысел Ваш не меняется, идите на пустыню». У отца Виссариона мне приходилось бывать часто, потому что у него была особая келья, контора секретаря игумена. При всем моем уважении к отцу Виссариону я ничего не ответил на его слова.'
      cn: 在这次长老会议上——我现在依然清楚地看见，如同它当时铭刻在我的意识中一般——第一个站起来的是维萨里昂修士司祭，他是修道院长的秘书，一位温和、细致、谨慎的人。他说：「索夫罗尼神父，您所请求长老们提供建议的这一步，非常重大且重要。这是我的建议：您再在修道院里留一年，然后，如果您的意念没有改变，就去旷野吧。」我常去维萨里昂神父那里，因为他有一间特别的独修室，也是修道院长秘书的办公室。尽管我对维萨里昂神父非常尊敬，但我对他的话没有做任何回应。
  - type: paragraph
    text:
      ru: 'Вторым встал отец Матфей. Он был немножко старше годами отца Силуана и из того же села, как и Силуан... но, странно, при этом он держал себя с ним как бы больший и властный. Но теперь, после смерти старца, он вдруг сказал такие слова, подойдя ко мне через всю комнату: «Отец Софроний, куда Вы идете? Думаете ли Вы найти что-нибудь большее, чем Силуан? Итак, если Силуан спасался в монастыре, спасайтесь и Вы в монастыре!» Я опять ничего не ответил.'
      cn: '第二位站起来的是修士马太。他年纪比修士圣西卢安稍长，并且与圣西卢安来自同一个村庄……但奇怪的是，他却自居比圣西卢安更高，且更具权威。然而现在，在长老去世之后，他忽然走过整个房间来到我面前，说了这样一番话：

        「修士索夫罗尼，您要去哪里？您认为能找到比圣西卢安更伟大的东西吗？那么，既然圣西卢安在修道院里获得了救赎，您也当在修道院里获得救赎！」

        我再次什么也没回答。'
  - type: paragraph
    text:
      ru: 'Встал очень суровый старец Иосиф, начальник библиотеки монастыря, который очень много читал и почитал себя большим знатоком духовной жизни. (Я был помощником библиотекаря.) И он строго говорит мне: «Отец Софроний, если Вы уйдете, то нет Вам благословения от игумена служить». Я говорю Иосифу: «Если батюшка говорит, чтобы я не служил, скажу Вам, что я иду на пустыню не для того, чтобы служить. Иная мысль у меня для пустыни. Но вот что скажите мне: запрещает ли игумен мне и причащаться?» Мой спокойный ответ выбил его из колеи. Он говорит: «Нет, отец Софроний, я не спрашивал отца игумена, это я, чтобы испытать Вас, сказал такие слова. А игумен не сказал ничего мне, и разговора у нас не было».'
      cn: 一位非常严厉的老修士约瑟夫站了起来，他是修道院图书馆的馆长，读过很多书，并且自视为灵修生活的大师。（我当时是图书馆的助理。）他严厉地对我说：「索夫罗尼长老，如果你走了，那么你就没有从院长那里得到的侍奉的祝福。」我对约瑟夫说：「如果院长说不让我侍奉，我要告诉你，我去旷野不是为了侍奉。我对旷野另有想法。但请你告诉我：院长是否也禁止我领受圣体？」我平静的回答让他措手不及。他说：「不，索夫罗尼长老，我没有问过院长，这些话是我为了考验你而说的。院长什么也没对我说，我们之间也没有过这番谈话。」
  - type: paragraph
    text:
      ru: 'Тогда Иустин-иеромонах, который был заместителем игумена, кроткий, тихий муж, решил сказать слово (он сидел тогда на отдельном кресле посреди большой комнаты, где проходили собрания собора старцев). И он, обращаясь к Виссариону, говорит: «Отец Виссарион, я полагаю, что для испытания помысла отца Софрония год слишком много». И говорит мне: «Вот что, отец Софроний: пробудьте до Пасхи здесь в монастыре, и если Ваш помысел не меняется, то тогда с Богом идите на пустыню!»'
      cn: 那时，尤斯丁修士长老——他是修道院院长的副手，一个温和、安静的人——决定发言（他那时正坐在大房间中央一个独立的椅子上，那里正在举行长老会议）。他转向维萨里昂说道：「维萨里昂神父，我认为要考验索夫罗尼神父的意念，一年时间太长了。」他对我说道：「索夫罗尼神父，是这样：您先在这里的修道院待到复活节，如果您的意念没有改变，那么，愿上帝与您同在，去隐修吧！」
  - type: paragraph
    text:
      ru: 'После того как заместитель игумена сказал эти слова, я поднялся со своего стула, сделал ему земное поклонение и говорю: «Благословите, батюшка». Тем был положен конец вопросу обо мне на соборе старцев. Собор постановил мне остаться в монастыре с начала октября тридцать восьмого года до Пасхи тридцать девятого.'
      cn: 在副院牧说了这些话之后，我从椅子上站起来，给他做了个大俯伏，说：「请祝福，神父。」至此，关于我的问题就在长老会议上结束了。会议决定我从三十八年十月初开始留在修道院里，直到三十九年复活节。
  - type: paragraph
    text:
      ru: 'Скажу вам, что странным было ко мне отношение в монастыре. Я четырнадцать лет прожил там, и мне некогда было говорить ни с кем. Со всех моих работ я торопился прийти в мою комнату, чтобы плакать о себе самом. И мой уход произвел странное впечатление: отцы-монахи обиделись на меня, думая: «Вот, он уходит из монастыря, как будто бы здесь неудобно спасаться».'
      cn: 我告诉你们，我在修道院里受到的对待很奇怪。我在那里住了十四年，从未有时间与任何人交谈。每次完成我的劳作，我都会匆匆回到我的房间，为我自己哀哭。而我的离开却造成了一种奇怪的印象：修士教父们对我感到被冒犯，心里想：「看哪，他离开了修道院，好像在这里修道得救很不方便似的。」
  - type: paragraph
    text:
      ru: 'После ко мне приходили многие за те полгода, которые я провел с октября по апрель. Среди приходивших убеждать меня был и отец Василий, впоследствии ставший Архиепископом Брюссельским. Пришел он ко мне в келью и говорит: «Отец Софроний, я в «Лествице» святого Иоанна нашел место, из которого ясно видно, что Вы не должны идти на пустыню». Но я всем, которые приходили убеждать меня, говорил: «Я сам ищу воли Божией. Я боюсь идти на пустыню. Я думаю так, что я малодушный и слабый. Если меня встретят такие посещения вражеских сил, которые атаковывали старца Силуана, то я не выдержу, не смогу». И страх этот заставлял меня искать как можно больше благословений, но законных благословений: духовника, игумена и собора старцев.'
      cn: 之后，在我从十月到四月度过的那半年里，许多人来找我。在那些前来劝服我的人当中，也有瓦西里神父，他后来成为了布鲁塞尔大主教。他来到我的小室对我说：「索夫罗尼神父，我在圣约翰的《天梯》中找到了一个地方，从中可以清楚地看到您不应该去旷野。」 但我对所有前来劝服我的人说：「我自己正在寻求上帝的旨意。我害怕去旷野。我认为我胆怯而软弱。如果我遇到像攻击圣西卢安长老那样来自仇敌势力的攻击，那么我将无法承受，我不能够。」而这种恐惧促使我寻求尽可能多的祝福，但必须是合法的祝福：来自属灵父亲、院长和众长老的合议。
  - type: paragraph
    text:
      ru: 'Я говорю отцу Василию: «Отец Василий, если Вы придете ко мне и принесете пять тысяч мест из святых отцов, и великих и малых, а я Вам укажу только одно, мое место, – и мое будет сильнее Ваших пяти тысяч». Смысл этого ответа был таков – я искал благословения законным путем, от «инстанций», традиционно полномочных на это благословение: духовника, игумена и собора старцев. Я думал это благословение противопоставить всем и каждому. И правду сказать, Бог дал мне пустыню благословенную. Он же и выгнал меня из пустыни, довольно суровым образом. Когда я уже отдал старую мою калибу-пустыню, которую видели некоторые из наших отцов, посетивших Афон, и не было больше у меня средств взять другую, я перешел из Карули в другую пустыню – пещеру в пределах монастыря Святого Павла.'
      cn: 我告诉瓦西里神父说：「瓦西里神父，假如您到我这里来，带来五千处选自无论大小的诸圣教父的篇章，而我只指给您一处，我自己的篇章——我的那处将比您的五千处更有力量。」这个回答的含义是：我在循合法途径寻求祝福，来自那些传统上拥有赐予此祝福权柄的「机构」：属灵导师、院长和长老会议。我以为能用这祝福来对抗所有人与物。说句实话，上帝赐予我一处蒙福的隐修荒漠。祂却也把我逐出了那隐修荒漠，方式颇为严酷。当我已交还了我旧有的隐修小屋——这处隐修荒漠，曾经有几位探访过阿索斯山的本会教父见过它，而我已无力再另觅一处时，我便从卡鲁利亚迁到另一处隐修荒漠——一处位于圣保罗修道院辖区内的山洞。
  - type: paragraph
    text:
      ru: 'В Свято-Павловской обители игумен хотел иметь духовника. На Афоне духовник не должен быть в пределах монастыря. Надо, чтобы духовник был совершенно чужд административной власти в монастыре, для того чтобы исповедь была искренней и чистой, а не заигрыванием ради благоволения духовника. Еще в тридцать восьмом году старец Силуан как-то сказал мне: «Когда вы будете духовником, то принимайте людей, не лишайте их слова Божия, потерпите их». Я тогда был едва живой и подумал, что старец не знает, как мог бы я выдержать столько лет. Я еще молодой, чтобы быть мне духовником на Святой Горе; и эта мысль выпала совершенно из моего сознания. И, только будучи уже на пустыне, я вспомнил про слова старца Силуана...'
      cn: 在圣保罗修道院，院长想要一位灵修指导者。在阿索斯山，灵修指导者不应该在修道院内。必须让灵修指导者完全脱离修道院的行政权力，以便告解是真诚而纯洁的，而不是为了博取灵修指导者的恩惠而故作姿态。早在三十八年，圣西卢安长老曾对我说过：「当您成为灵修指导者时，就要接纳人们，不要剥夺他们的上帝之道，忍耐他们。」那时我疲惫不堪，心想长老不知道我如何能熬过这么多年。我还年轻，无法在圣山担任灵修指导者；这一想法就完全从我的意识中消失了。然而，直到我已经在旷野中，我才想起了圣西卢安长老的话语……
  - type: paragraph
    text:
      ru: 'В это время Греция была под оккупацией немцев. Я пришел на пустыню незадолго до войны – на Пасху, а в августе уже разразилась война. Когда пришел ко мне секретарь игумена Святого Павла отец Феодосий – очень умный человек, осторожный и серьезный – и сказал, что их игумен хочет меня поставить духовником в монастыре, то я вспомнил слова старца Силуана: «Когда вы будете духовником...» Но в момент нашей беседы со старцем мне показалось это слово излишним, потому что я сам не знал, дойду ли до комнаты моей. (Мне надо было пройти больше ста пятидесяти ступенек, чтобы подняться от кельи Силуана до моей.) Так я стал духовником и переехал в пещеру недалеко от обители Св. Павла. Благословенны эти места.'
      cn: 当时，希腊正处于德国人的占领之下。我在战前不久——那是在复活节——来到了旷野，而八月战争就已经爆发了。当圣保罗修道院院长的秘书，西奥多修神父——一位非常聪明、谨慎而严肃的人——来告诉我他们的院长想任命我为修道院的属灵导师时，我便想起圣西卢安长老的话：「当你们成为属灵导师时……」然而，在我和长老交谈时，我觉得这句话是多余的，因为我自己都不知道能否走到我的房间。（我需要走超过一百五十级台阶，才能从圣西卢安的修士独居室走到我的房间。）于是我便成了属灵导师，并搬到了圣保罗修道院附近的一个洞穴里。这些地方蒙受祝福。
  - type: paragraph
    text:
      ru: Как-то прошел потопный дождь, и вода проникла через толщу массива, где была моя пещера. Раньше всегда сухая, пещера стала зимой полна воды. Сама по себе зима в Греции короткая, но все-таки получалось, что шесть месяцев я проводил в пещере, где было слишком много воды. Сто ведер в день я выносил воды из моей кельи и спал под двумя железными листами, чтобы защитить кровать мою от воды, падающей сверху...
      cn: 有一次，降下了倾盆大雨，雨水穿透了我山洞所在的厚实岩层渗入进来。以前素来干爽的山洞，到了冬天却积满了水。希腊的冬季本不漫长，但即便如此，我还是在积水过多的山洞里度过了六个月。每天我从我的小室里舀出一百桶水，并且睡在两片铁板下方，为的是保护我的床铺免受上方落水之扰……
  - type: paragraph
    text:
      ru: 'Быстро проходит час этих воспоминаний о Святой Горе. Если бы я по традиции принадлежал к Русской Церкви, то я бы носил схиму со словами: «Свят, Свят, Свят»... и, только издали видя меня, говорили бы: «У-у-у-у, схимники идут!» Но я воспитался на Афоне. И там было мне приятно видеть, что игумена часто можно и не узнать, не отличить от послушника. И я пишу в брошюре моей «Об основах православного подвижничества», что на Афоне совсем другие порядки. Получается, пятьдесят с лишним лет, как я схимник, и уже с тридцать пятого года давно должен был бы ходить как схимники в России, но вот, я хожу свободно...'
      cn: 关于圣山的这些回忆，时光迅速流逝。如果我按传统属于俄罗斯教会，那我就会披上大圣服，口诵着「圣哉，圣哉，圣哉」...并且，人们只消远远看见我，就会说：「哦——哦——哦——哦，大圣行修士来了！」但我是受教于阿索斯山。在那里，我高兴地看到，修道院院长常常不为人所识，无法与初学修士区分。我在我那本《论东正教苦修生活之基础》的小册子中写道，在阿索斯山上，规矩截然不同。算起来，我作为大圣行修士已经五十多年了，并且自三十五年以来，我本应早就像俄罗斯的大圣行修士那样行事，然而，我却自由自在地行走着...
  - type: paragraph
    text:
      ru: Вот, немножко из биографии моей на Афоне рассказал я вам перед кончиною своей. Но я сам не знаю, когда умру.
      cn: 看啊，我向你们讲述了一点点我阿索斯山上的生平，是在我离世之前。但我自己也不知道，我何时会离世。
  - type: paragraph
    text:
      ru: 'И мысль моя о том: в чем я не выполнил моего долга перед вами? Теперь, когда умаляются мои способности воспринимать жизнь, память моя ослабела, увеличивается слепота, которая не дает мне читать, и глухота заставляет меня носить аппараты, так что мои уши полны шума, – чего я не доделал? Но я буду говорить с вами до последних дней, до последнего издыхания моего...'
      cn: 而我的思绪是：我在何处没有尽到我在你们面前的职责？如今，当我感知生命的能力正在衰退，我的记忆力衰退了，盲目日益加重，使我无法阅读，而耳聋迫使我佩戴助听器，以致我的双耳充满噪音——我还有何事未竟？但我仍会与你们说话，直到我的末日，直到我最后一口气息...
  - type: paragraph
    text:
      ru: 'Я хотел сегодня говорить с вами еще по другому поводу. Недавно у нас был визит одного русского священника. И он в частной беседе говорит мне:'
      cn: 我今天还想跟你们谈谈另外一件事。最近我们接待了一位俄罗斯神父。他私下里对我说：
  - type: paragraph
    text:
      ru: – Отец Софроний, возможно ли в нашу эпоху видеть Нетварный Свет?
      cn: 索夫罗尼神父，在我们这个时代是否可能看到非受造光？
  - type: paragraph
    text:
      ru: – Я пишу об этом. Вы читали?
      cn: – 我正在写这件事。您读过吗？
  - type: paragraph
    text:
      ru: – Нет.
      cn: – 不。
  - type: paragraph
    text:
      ru: – Ну хорошо, возьмите у наших отцов книги мои, где я пишу об этом.
      cn: ——好吧，去我们的教父那里取我的书吧，我在其中写了关于这个的。
  - type: paragraph
    text:
      ru: 'Самая постановка вопроса на меня произвела впечатление, что у него настроение такое: когда-то в первые три столетия гонений Бог действовал чудесами и явными заступлениями, а потом прекратил эти действия, и веками их уже не было. Но этот человек принадлежит к группе людей, которые логически заключают, что в наше время Бог не является как Свет. И следовательно, кто видит Свет, тот видит что-нибудь другое, а не подлинно Нетварный Фаворский Свет. Конечно, когда так меня спрашивают, что я могу сказать? Я осужден на молчание.'
      cn: 这个问题本身的提出方式，给我留下了这样的印象：他抱持着这样一种看法——在最初三个世纪的迫害中，上帝曾一度以奇迹和明确的护佑施行作为，之后便停止了这些作为，且数个世纪以来都不再发生。但这个人属于这样一群人，他们逻辑性地得出结论，认为在我们的时代，上帝不再以圣光显现。因此，凡是看见圣光的人，他所看见的是别的东西，而非真正非受造的塔博尔圣光。当然，当人们这样问我时，我能说什么呢？我被判缄默无言。
  - type: paragraph
    text:
      ru: Вот и отец N., будучи в России, встретил некую женщину, которая то же говорила, что Бог перестал действовать так, как раньше, и что теперь нет больше старцев и что все это общее явление – «так действует Бог теперь».
      cn: N神父也是如此，他在俄罗斯时遇到了一位女士，她也同样地说，上帝不再像以前那样行事了，而且现在也没有长老了，所有这一切都是普遍现象——「上帝现在就是这样行事的。」
  - type: paragraph
    text:
      ru: 'Я говорю вам об этом потому, что такой подход не есть путь к познанию. Те же самые слова и строй мышления были во временаСимеона Нового Богослова...[158]В сорок пятом гимне святой Симеон говорит о тех, кто отрицает Свет, в котором является Бог и который есть Сам Бог, – что они неправильно мыслят и, в сущности, впадают в ересь[159]. А у Симеона, ставшего Силуаном, написано в главе «О смирении»: «Некоторые говорят, что это раньше когда-то было, а теперь все это устарело». И со свойственной ему скромностью старец говорит, что это неправильное мышление: «У Господа никогда ничто не умаляется, а только мы изменяемся, делаемся плохими и так теряем благодать»[160].'
      cn: 我告诉你们这一点，是因为这样的方式并非通向认知的道路。同样的话语和思维模式，早在新神学家西默盎的时代就有了……[158]在第四十五首圣诗中，圣西默盎论及那些否定圣光——上帝借此显现且这圣光即是上帝本身——的人，说他们思维有误，并且，实质上陷入了异端[159]。而由西默盎（Simeon）成为圣西卢安（Silouan）的著作中，在题为《论谦卑》的章节里写道：「有些人说，这些东西以前有过，但现在都已经过时了。」并且，以其固有的谦逊，这位长老说道，这是错误的思维：「在主那里，从来没有任何事物会减少，而只是我们改变了，变得败坏了，因此失去了恩典。」[160]
  - type: paragraph
    text:
      ru: 'От Бога ли было то благословение мне или не от Бога – мне самому трудно да и невозможно говорить. Но я полагаю, что если тот Свет, о котором я пишу, приводит нас к ощущению изначального Божества Самого Христа, как это было с апостолом Павлом на пути в Дамаск (см.Деян.22:6, 8), то это тот Божественный Свет, который был и на Фаворе (см.Мф.17:2). Я слишком маленький человечек, чтобы дальше говорить об этом, но все-таки хочу сказать: если этот Свет свидетельствует о Божестве воплощенного Логоса Отца, как признать верным убеждение, что теперь, кто видит Свет, тот впадает в большую ошибку – в прелесть? Еще о многом нам предстоит говорить, и маленький кусочек из того, что произошло со мною, сегодня пусть войдет в мой рассказ и в мою исповедь перед вами, дорогие мне братья и сестры...'
      cn: 那个临到我的祝福，究竟是来自上帝，还是不来自上帝——我自己难以言说，甚至不可能言说。但我确信，如果我所提及的那光，引领我们感受基督自身的本体神性，如同使徒保罗在大马士革路上所经历的（参见使徒行传 22:6，8），那么这便是那曾显现于他泊山的神圣之光（参见马太福音 17:2）。我是何等渺小之人，无法就此多言，但我仍想说：如果这光见证了圣父道成肉身之道的神性，那么，怎能认同这样的信念为正确，即如今凡是见到这光的人，都犯下了严重的错误——陷入迷惑之中呢？我们还有许多事情要谈论，而今日，就让我将发生在我身上的一小段经历，纳入我的叙述，并向我亲爱的弟兄姊妹们，作此告白...
  - type: paragraph
    text:
      ru: Молитесь за меня, и да хранит вас Господь...
      cn: 请为我祈祷，愿主保守你们……
- type: heading1
  text:
    ru: 'Беседа 24: «Как я хочу, чтобы вы все были поэтами»[161]'
    cn: '讲论 24: 《我多么希望你们都能成为诗人》[161]'
  children:
  - type: paragraph
    text:
      ru: О Великом Посте. О необходимости вдохновения. О посте Христа в пустыне. О подобии Христу в вечности. Мы должны стать вдохновленными поэтами и мужественными подвижниками. О восприятии нетварной жизни Бога. Интеллект и «безумство веры». О ненависти к себе в любви к Богу и ближнему. О страданиях Христа по любви к человеку. Пример св. Иоанна Предтечи. О памяти Последнего суда. От малого к беспредельному.
      cn: '论大斋期。

        论灵感的必要性。

        论基督在旷野的禁食。

        论在永恒中肖似基督。

        我们当成为蒙受灵感的诗人与英勇的苦修者。

        论对上帝的非受造生命的领悟。

        理智与「信德的愚拙」。

        论在爱上帝与爱近人中对自己的憎恨。

        论基督因爱世人而承受的苦难。

        圣约翰洗者先驱的榜样。

        论对末日审判的记忆。

        自微小臻于无限。'
  - type: paragraph
    text:
      ru: Сегодня слово мое опять к вам, братья мои и сестры, которые пришли недавно. Через две недели начинается Великий Пост. И я хочу говорить немного теперь о посте.
      cn: 今天我的话又对你们说，我那些刚来不久的弟兄姊妹们。两周后大斋期就开始了。我现在想稍微讲讲斋戒。
  - type: paragraph
    text:
      ru: Сколько раз говорилось о том, что мы можем вложить в наши действия, в наши слова тот или иной смысл. Как и что мы можем сделать, чтобы превратить этот Великий Пост из пугающего во вдохновляющий? Когда с вдохновением встречает монах Великий Пост, то пост проходит действительно как период вдохновения, как приготовление к тому, чтобы воспринять свет Воскресения. А если человек боится, то он может повредить свое здоровье, и пост для него будет мучением. Пусть каждый из вас остановит свой дух, свой ум на каком-нибудь образе святом, для того чтобы вдохновиться.
      cn: 多少次提到，我们能够将这样或那样的意义注入我们的行动和言语之中。我们能做些什么，以将这个大斋期从令人恐惧的转变为鼓舞人心的呢？当修士怀着鼓舞的心情迎接大斋期时，那么斋期确实会像一个鼓舞的时期一样度过，就像为领受复活之光所做的准备。而如果一个人感到恐惧，他可能会损害自己的健康，并且斋期对他来说将是折磨。愿你们每个人都让自己的心神、自己的理智停驻在某个圣像上，以便得到鼓舞。
  - type: paragraph
    text:
      ru: Я вам скажу о тех мыслях, которые были для меня драгоценными. Что заметил я в жизни мира, мира людского и мира вообще, всего животного царства? – Только человек способен остановить себя воздержанием, когда пред ним есть пища, – человек, которому дан дух как образ Бога Вечного, творящего из ничего. Остановитесь на этой мысли. Итак, если мы воздерживаемся от пищи, или от сна, или от чего-либо еще, – все сие содействует возрастанию в нас того, что прилежит к образу Божию. Очистить наш образ Бога, омраченный грехом, – вот задача перед нами! Когда живет в нас эта идея, тогда не бессмысленным будет воздержание наше. Итак, великая задача, которую ставит перед собою наша жизнь монашеская, – уподобиться Самому Христу, как и Он воспринял человеческий образ, проявив Свое Божество.
      cn: 我将与你们分享那些对我而言珍贵无比的思想。我在世俗生命中，在人类世界，乃至整个动物王国里，注意到了什么呢？——唯有人能以节制止住自己，当他面前有食物时——这人被赋予了灵魂，作为永恒上帝的肖像，那从无中创造万物的上帝。请停下来思考这一想法。所以，若我们节制饮食，或节制睡眠，或节制其他任何事物——所有这一切都有助于在我们里面增长那属于上帝肖像的部分。洁净我们那被罪所玷污的上帝肖像——这就是我们面前的任务！当这一理念活在我们里面时，我们的节制就不再是毫无意义的了。所以，我们修道生活所设定的伟大任务，就是要效法基督本身，正如祂取了人性的形像，彰显了祂的神性。
  - type: paragraph
    text:
      ru: Этот пост установлен в память сорокадневного поста Самого Господа в пустыне, где Он был со зверями и где в конце Он допустил до Себя даже демона и разговаривал с ним (см.Мк.1:13). Что мы можем избрать из содержания жизни Самого Христа, как мы ее угадываем из Евангелия, из традиции, из посланий апостольских? Вот апостол Павел, сей гениальный поэт, говорит, что «мы, люди, должны иметь те же мысли,те же чувствования, что и Христос» (см.Флп.2:5.).
      cn: 这个斋期是为纪念吾主亲自在旷野禁食四十昼夜所设立的，祂在那里与野兽同在，最终甚至允许恶魔靠近自己并与它交谈（参阅 马可福音 1:13）。我们能从基督自身的生命内涵中，正如我们从福音书、从圣传、从使徒书信中所领会到的，选取些什么呢？使徒保罗，这位卓越的诗人，说：「我们人类应该拥有与基督相同的思想，相同的感受」（参阅 腓立比书 2:5）。
  - type: paragraph
    text:
      ru: В чем тайна? – В том, что если мы уподобимся Богу воплощенному, то это переходит и в вечность, которая до сотворения мира. Человеческая ипостась должна развиться в нас и вместить в себя мысль Самого Христа.
      cn: 奥秘何在？那就是：如果我们肖似道成肉身的上帝，那么这便会延伸至那创世以先的永恒。人的位格必须在我们之内得以发展，并容纳基督本人的意念于其内。
  - type: paragraph
    text:
      ru: 'Что надо иметь в своем уме, чтобы не смутиться мелким характером многих наших действий, которые связаны с постом и вообще с подвигом монашеского образа жития? – Надо, чтобы тот «смысл»[162], который мы видели во Христе, был бы и в нас. У Иоанна Богослова есть такое замечательное выражение: «Мы знаем, что«мы... дети Божии, но еще не открылось, что будемпо уходе из этого мира.Знаем только, – говорит он, –что, когда увидим Его, как Он есть, и мы сможем стать, как Он:подобнымиЕму»(см.1Ин.3:2). Так что, пожалуйста, мои молодые братья и сестры, помните это и будьте «творцами» своими, как указывает свт.Григорий Богослов, – творцами всего, начиная с мелочей. И так из мелких действий наших мы незаметно приготовим дух наш и существо к восприятию уже нетварного Божественного дыхания. Подобно гениальному поэту, гениальному богослову, гениальному философу – апостолу Павлу (ср.1Кор.4:16), будем и мы все строителями нашего вечного в Боге спасения.'
      cn: 我们心中需存何种念头，才不致于为我们许多行为的琐碎性质所困扰，这些行为与斋戒以及普遍与修士生活方式的苦修相关？– 我们需要，我们在基督里所见的那个「意义」[162]，也存在于我们里面。圣约翰神学家有这样一段绝妙的表达：「我们知道我们是上帝的儿女，但尚未显明我们离世之后将如何。我们只知道，——他说——当我们看见祂的本相时，我们也能变得像祂一样：肖似祂。」（参约翰一书 3:2）因此，请你们，我年轻的弟兄姐妹们，记住这一点，并做自己的「创造者」，正如圣格列高利神学家所指出的那样——成为万物的创造者，从琐碎之事开始。这样，从我们细微的行动中，我们便会不知不觉地预备我们的灵魂和本体，以迎接那非受造的属神气息。犹如那位才华横溢的诗人、才华横溢的神学家、才华横溢的哲学家——使徒保罗（参哥林多前书 4:16），我们都将成为我们在上帝里永恒救恩的建造者。
  - type: paragraph
    text:
      ru: «Чаю воскресения мертвых». Произнося эти словаСимвола веры, мы должны помнить, что это – состояние духа, который ожидает пришествия Христа. И это ожидание наше есть результат нашего творчества; это есть и будет та энергия, которая непременно воскресит нас.
      cn: 「我盼望死人复活。」当说出《信经》的这些话语时，我们必须记住，这是一种期盼基督降临的属灵状态。而这份期盼，乃是我们属灵创造的成果；这正是那股必将使我们复活的能力，现在是，将来也是。
  - type: paragraph
    text:
      ru: О, как я хочу, чтобы вы все стали поэтами! Без творческого вдохновения трудно провести даже единый день как подобает христианину. Итак, приближаясь к этому посту, откроем сердце и ум наши к предстоящему нам воскресению, как и Господь перед Своею проповедью постился сорок дней в пустыне и был со зверями.
      cn: 哦，我多么希望你们所有人都能成为诗人！没有创造性的灵感，甚至连一天都难以度过，如同一位合宜的基督徒那样。因此，在临近这个大斋期之际，让我们敞开我们的心与灵，迎接那即将临到我们的复活，正如主在祂传道之前，在旷野禁食了四十天，并与野兽同在。
  - type: paragraph
    text:
      ru: Итак, сегодня я сказал несколько слов, чтобы остановить ваш ум на предстоящем нам подвиге. К этому хочу добавить, что надо быть не только поэтом, но и мужественным борцом. Сказал Господь, что«Царство Небесное беретсятрудом и подвигом, и употребляющие усилие восхищают его»(см.Мф.11:12). Когда мы живем на Земле, то наш опыт жизни в этом теле показывает, что нужно постоянно пить, есть, спать, отдыхать, чтобы наполнять тело новой биологической энергией для жизни. Так и в духовном плане – мы должны питать свою душу, свой ум с усилиями.
      cn: 那么，今天我说了几句话，是为了使你们的心神专注在我们即将到来的功修上。对此，我想要补充的是，一个人不应仅仅是诗人，而且应是一位勇敢的斗士。主曾说：「天国是努力进入的，努力的人就得着了」（马太福音 11:12）。当我们活在世上时，我们在这肉身中的生活经验表明，我们需要不断地饮、食、睡、息，以便为身体补充新的生物能量来维持生命。在属灵的层面也是如此——我们必须带着努力滋养我们的灵魂和心神。
  - type: paragraph
    text:
      ru: 'Вы знаете выражение, часто иронически употребляемое: «О, он вмуках творчества». Так говорить можно о всяком художнике во всякой области искусства. Таким путем, начиная с очень малого, мы расположим себя к явлению в нас Самого Бога. И наша вера – в то, что действительно мы получаем нетварную жизнь Самого Бога. Когда мы «подражаемБогу»(см.Еф.5:1) воплощенному – говорю о Христе, – то это переходит затем и в план духа после нашей смерти. Если мы были подобны Ему на Земле, как Он был, то будем подобны Ему и в Его безначальной вечности.'
      cn: 你们知道一个表达，常用作讽刺意味：「哦，他正处于创作的痛苦中。」这种说法可以用于艺术任何领域的任何艺术家。循着这条道路，从非常微小之处开始，我们将使自己预备好，迎接上帝亲自显现于我们之中。而我们的信仰在于，我们确实领受了上帝本身的非受造的生命。当我们「效法上帝」(见以弗所书 5:1) 成为肉身的——我指的是基督——那么这随后也会转入属灵的层面，在我们死后。如果我们在地上如同祂一样，正如祂所是，那么我们也将像祂一样，在祂那无始无终的永恒之中。
  - type: paragraph
    text:
      ru: 'Вот видите, какие слова мы произносим: безначальная вечность Бога будет сообщена нам! Такое дерзновение не есть ли признак нашего безумия? Но вот гениальный Павел говорит о том, что такое«безумие»спасает мир (см.1Кор.1:23). То, что обетовал нам Христос, земной ум не вмещает. Наш ум может быть весьма одаренным силою на научное мышление или действие, на философию и на многое другое, однако не на то, чтобы поверить в вечность. А в вечность могут поверить даже дети, как говорил Господь (см.Лк.10:21). Так вот, видите: и сегодня все тот же порыв наш к Богу Небесному, все тот же Дух увлекает нас следовать за Христом.'
      cn: 你们看，我们说出怎样的话语啊：上帝无始的永恒将要赐予我们！如此的胆量，难道不是我们愚妄的标记吗？然而，你们看，才华横溢的保罗论到，这样的「愚妄」拯救世界（哥林多前书 1:23）。基督应许给我们的，属地的悟性无法容纳。我们的悟性可能在科学思维或行动、在哲学以及许多其他方面都禀赋异禀，然而却不具备相信永恒的能力。然而，甚至孩童也能相信永恒，正如上主所言（路加福音 10:21）。如此，你们看：就在今天，我们对天上的上帝仍是那同样的炽热冲动，仍是那同样的圣灵引领我们跟随基督。
  - type: paragraph
    text:
      ru: 'Немного прошло времени с тех пор, как я слышал от одного человека: «Я устал страдать, я больше не хочу страдать. Я ищу покоя, радости, счастья земного, и душа моя отвращается от страданий». Хотя говорил это человек православный, но, по существу говоря, мыслит он не по-православному. Чтобы быть способным охватить любовью затем всю тварь, мы должны пережить много болезненных состояний и много страданий. Но энергию для этих страданий дает заповедь Христа о ненависти к себе (см.Лк.14:26), любви нашей к Богу и к ближнему.'
      cn: 距离我从一个人那里听到以下这些话，已经过去了一段时间：「我厌倦了受苦，我不想再受苦了。我寻求平安、喜乐、地上的幸福，我的灵魂厌恶苦难。」虽然说这话的人是东正教徒，但从本质上讲，他的思想并非出自东正教。为了能够随后用爱拥抱所有的受造物，我们必须经历许多痛苦的状态和许多磨难。但给予这些磨难力量的是基督关于恨自己的诫命（参 路加福音 14:26），以及我们对上帝和邻舍的爱。
  - type: paragraph
    text:
      ru: Вот я говорил вам о вещах, в сущности, страшных. В дни жизни воплощенного Бога на Земле Иисус Христос был единственный Человек, Который, дав заповедь о ненависти к себе в любви к Богу и ближнему, пошел на Голгофу не для того, чтобы спасать Себя; а Он пошел на все страдания, полный любви к человеку-человечеству. О, этот образ – Человек! И те, которые пережили это видение, не смогут найти нигде больше ничего подобного.
      cn: 我刚才对你们说的，实质上是些可怕的事。在道成肉身的上帝在世为人之时，耶稣基督是唯一的一位人，祂赐下了关于恨恶自己，以爱上帝和爱近人为目的的诫命，走上哥尔哥达，并非为了拯救自己；而是祂承受了所有的苦难，充满着对人——全人类的爱。哦，这形象——人！凡是体验过这异象的人，将再也无法在任何地方找到任何相似的事物。
  - type: paragraph
    text:
      ru: 'Господь нам заповедал то, что Он Сам исполнил: по любви к ближнему Он отдал Себя на все страдания (см.Ин.15:13), и не только на смерть, но на смерть, которая переживалась как проклятие в Ветхом Завете:«проклят всяк висяй на древе»(Гал.3:13). Мы не достигаем мер, которые видим во Христе, и мы понимаем, почему отцы наши – и первый из всех Креститель Иоанн – узрели во Христе Бога. Это чудный пример: Иоанн. Когда его самого люди готовы были признать за ожидаемого Мессию, он сказал: «Нет! Но есть Другой,грядыйвпереди меня, Он есть Спасительмира!» (см.Ин.1:27, 29) Как часто люди на Земле, получая огромную власть над многими другими людьми, склонны считать только себя достойными такой власти! А вот св. Иоанн нашел в себе силы отказаться от этой роли и сказать, как он сам жил, вдохновленный видением Христа (см.Ин.3:26–36).'
      cn: 上帝吩咐我们祂自己所成就的：因着对近人的爱，祂将自己献上，承受一切苦难（参见约翰福音 15:13），不仅是死，更是那在旧约中被视为咒诅的死：「凡挂在木头上的，都是被咒诅的」（加拉太书 3:13）。我们达不到我们在基督身上所见的尺度，因此我们明白为何我们的教父们——以及所有教父之首，施洗者约翰——认出基督是上帝。这真是一个奇妙的榜样：约翰。当人们准备好要承认他为所盼望的默西亚时，他却说：「不！却有另一位，在我前面将要来的，祂是世人的救主！」（参见约翰福音 1:27，29）多少次，世人当他们获得掌控许多人的巨大权柄时，往往只认为自己配得上这样的权柄！然而，圣约翰却在自己里面找到力量，拒绝这个角色，并宣告他是如何生活的，他的一生受到基督异象的启发（参见约翰福音 3:26-36）。
  - type: paragraph
    text:
      ru: Когда ум наш восходит к этому созерцанию Христа, восходящего на Голгофу, то, понятно, останавливается в нас слово. И мы почитаем Его как Бога – уже в молчании. За предстоящие пятьдесят дней поста каждый из вас будет переживать трудные минуты, и тогда мы будем вспоминать Христа, проведшего в пустыне сорок дней и сорок ночей.
      cn: 当我们的心智升华至这番默想基督登上髑髅地，言语自然在我们心中止息。我们已然在静默中尊崇祂为上帝。在即将到来的五十天大斋期中，你们每个人都将经历艰难时刻，届时我们将追忆基督在旷野中度过四十昼夜。
  - type: paragraph
    text:
      ru: 'Перед самым началом Великого Поста есть служение «великого прощения». Когда мы в нашем маленьком кругу будем смиренно просить у братьев наших прощения во всем, чем мы погрешили пред ними в мышлении нашем, тогда помните и о Страшном Суде. Сказано, что Господь придет во славе. И когда сядет Он на престоле Своем,«соберутся пред Ним все народы», от сотворения человека до последнего, рожденного от жены (см.Мф.25:31–32). Так переносите свой ум от вещей маленьких, которые, однако, являются образом других вещей, безграничных – вот что требуется. В пятой главе Евангелия от Матфея есть много слов Христа, восполняющих закон Моисеев:«сказано древним: не убивай... А Я говорю вам... cказано древним: не прелюбодействуй... А Я говорю вам...»и так далее. И каждый раз от всех заповедей Ветхого Завета Он переходил к беспредельному значению каждой из них (см.Мф.5:21, 22, 27, 28, и т. д).'
      cn: 就在大斋期即将开始之前，有一项「大宽恕」侍奉。当我们在这小小的圈子里，谦卑地向我们的弟兄请求宽恕，为我们心思意念中、在他们面前所犯的一切过犯时，那时也要思想起那可畏的审判。经上说，上主必在荣耀中降临。当祂坐在祂的宝座上时，「万民都聚集在祂面前」，从人类受造之时起，直到那最后一位、由妇人所生的人（参 马太福音 25:31-32）。因此，你们当将心思意念从那些渺小的事物上转移，这些渺小的事物，却又是其他无限事物的表象——这就是所要求的。在马太福音第五章中，有许多基督的话语，成全摩西的律法：「你们听见有话说：『不可杀人』……只是我告诉你们……你们听见有话说：『不可奸淫』……只是我告诉你们……」等等。并且每一次，祂都从旧约的所有诫命，转而阐明每一条诫命那无限的意义（参 马太福音 5:21，22，27，28等）。
  - type: paragraph
    text:
      ru: 'Так и я сейчас пытаюсь предложить вам, как ваш брат, употреблять этот способ для того, чтобы сделать нашу жизнь плодоносною: от маленьких вещей переходите к беспредельному!'
      cn: 因此我现在也试着以你弟兄的身份向你建议，采用这种方式，好使我们的生命结出果实：从微小之事渐进于无限之境！
- type: heading1
  text:
    ru: 'Беседа 25: Прощеное Воскресенье: «Блажен ум, иже не иде на совет нечестивых»[163]'
    cn: 第二十五讲：赦罪主日：「福哉，心智不从不敬虔者的计谋」[163]
  children:
  - type: paragraph
    text:
      ru: 'Прощение: от храма до космических измерений. «Блажен ум, иже не иде на совет злых помыслов». О пребывании в Боге. Нам нужно жить словом Христа, но без воображения. Роль нашего воления. Бог есть смирение. О прощении друг друга. Триодь и кенотический аспект. «Чаю воскресения мертвых».'
      cn: '赦免：从圣殿到宇宙维度。

        「福哉那心智，不随从恶念的计谋。」

        关于居于上帝内。

        我们需要活出基督的圣言，但不凭想象。

        我们意愿的作用。

        上帝即是谦卑。

        关于彼此赦免。

        三歌集和虚己面向。

        「我期待死者复活。」'
  - type: paragraph
    text:
      ru: 'В прошлую беседу Господь дал нам слово о предстоящем подвиге Великого Поста. Сегодня я хотел бы сказать вам несколько слов о той священной молитве, которая будет в конце этой недели, с просьбой о прощении всех наших скольжений ко греху друг перед другом. Чтобы слово мое было подтверждено Священным Писанием, я приведу слова первого Псалма:'
      cn: 在上次的讲道中，上主赐予了我们关于即将到来的大斋期灵修苦修的话语。今天，我愿对你们说几句话，关于本周末将要举行的那个神圣祷告，其中将请求赦免我们彼此之间所有滑向罪的过犯。为使我的话语得到圣经的印证，我将援引诗篇第一篇的话语：
  - type: paragraph
    text:
      ru: '«Блажен муж, иже не иде на совет нечестивых, и на пути грешных не ста, и на седалищи губителей не седе: но в законе Господни воля его, и в законе его поучится день и нощь. И будет яко древо насажденое при исходищих вод, еже плод свой даст во время свое, и лист его не отпадет: и вся, елика аще творит, успеет»(Пс.1:1–3).'
      cn: 「福哉那人，他不行恶人的计谋，不站罪人的道路，不坐讥诮者的座位；唯他以上主的律法为乐，昼夜默想祂的律法。他必像一棵树，栽于水流旁，按时候结果子，叶子也不凋零。凡他所行的，尽都亨通」(诗篇 1:1-3)。
  - type: paragraph
    text:
      ru: 'Эти слова псалма повторяются на богослужениях очень часто. Итак, опираясь на эти слова, я скажу, что предстоящая молитва о прощении грехов наших у всех братьев и сестер наших будет происходить здесь – в маленьком доме, в маленьком храме. Но как и всегда: хотя мы получаем опыт в маленьких размерах, умом мы должны переходить в измерения космические.'
      cn: 这些圣咏的词句在礼拜中经常重复。所以，援引这些词句，我要说，我们所有弟兄姊妹即将举行的、为我们罪得赦免的祷告，将会在这个小房子里，在这个小圣堂里举行。但正如往常一样：尽管我们在微小的尺度中获得经验，但在心智上，我们应当进入宇宙的维度。
  - type: paragraph
    text:
      ru: 'Подражая псалму, я бы сказал так: «Блажен наш ум, когда он отказывается идти на беседу с дурными помыслами, толкающими на те или иные формы греха». Но не достаточно только отказа от беседы с оскверняющими все наше бытие страстными мыслями, а нужен еще и переход от этих маленьких размеров до – я решаюсь сказать, – до размеров Страшного Суда. В богослужениях первой седмицы много будет говориться об Адаме и Суде. Так что переноситесь умом в эти великие судьбы всего мира, хотя нам дается опыт в совсем маленьких размерах. Вообще надо по-монашески привыкнуть всякое обстоятельство использовать для восхождения ума нашего к Богу. Необходимо приучить наш ум к тому, чтобы он жил всегда в Боге.'
      cn: 仿效诗篇，我会这样说：「福哉我们的心智，当它拒绝与恶念交谈，这些恶念驱使人陷入这或那形式的罪」。然而，仅仅拒绝与玷污我们整个存在的激情思想交谈是不够的，还需要一个转变，从这些微小的层面——我敢说——直到末日审判的层面。在大斋期第一周的礼仪中，将会大量谈及亚当和审判。所以，你们要用心智转移到这些关乎全世界的伟大命运中，尽管我们所获得的经验是在非常微小的层面。总之，我们应该像修道人一样习惯利用一切境遇，以使我们的心智上升到上帝那里。有必要训练我们的心智，使它永远活在上帝里面。
  - type: paragraph
    text:
      ru: В беседе Христа с учениками на Тайной Вечере есть такие слова, что «Он есть Лоза истинная, и Отец Его есть Виноградарь, Который всех тех, кто живут Его Сыном, очищает от всякого греха». Апостолам же говорит Господь:«Вы уже очищены через слово, которое Я проповедал вам»(см.Ин.15:1–3).
      cn: 在基督与门徒在最后的晚餐上的谈话中，有这样的话：「祂是真葡萄树，祂的父是栽培的人，祂洁净凡住在祂儿子里的，除去一切的罪。」上主又对使徒们说：「你们因我所讲给你们的道，已经洁净了。」(参阅约翰福音 15:1-3)
  - type: paragraph
    text:
      ru: 'Вы видите: если мы будем отталкиваться от плохих мыслей, если все время ум наш будет пребывать в связи с безначальной вечностью Бога нашего, то сами слова о Нем освящают нас и очищают от всякой скверны. Так что когда есть в душе человека стремление отстать от греха, перестать грешить, то у него есть путь к Богу через слово. И Слово, прежде всего, есть Воплощенный Логос Отца, Иисус Христос (ср.Ин.14:9).'
      cn: 你们看：如果我们摒弃恶念，如果我们的心思念虑时时与我们上帝那无始的永恒相连，那么，关于祂的话语本身就能圣化我们，并洁净我们脱离一切污秽。因此，当一个人灵魂里有远离罪恶、停止犯罪的渴望时，他就有了通过圣言通往上帝的道路。而圣言，首先是父的道成肉身之逻格斯，耶稣基督（参看约翰福音 14:9）。
  - type: paragraph
    text:
      ru: Когда мы читаем Евангелие от Иоанна, то все время мы призываемся к тому, чтобы жить со Христом, Его Именем и Его словами (см.Ин.6:33, 15:7, 17:8, 1:12, 3и мн. др).
      cn: 当我们阅读约翰福音时，我们一直被呼召，要与基督、祂的名和祂的话语一同生活（参阅 约翰福音 6:33，15:7，17:8，1:12，3及许多其他经文）。
  - type: paragraph
    text:
      ru: Переход духовный от мелких явлений к великим событиям совершается человеком в уме. Если мы хотим быть очищены словом, то откроем слову Христа сердца наши и будем «поучатьсяв законе Его день и ночь».
      cn: 属灵的转变，从微小的事物到伟大的事件，是在人的心思中完成的。如果我们想要被圣言洁净，就当向基督的圣言敞开我们的心，并且「昼夜思想祂的律法」。
  - type: paragraph
    text:
      ru: 'Вот видите, нам дана возможность действия невероятно великого: как рожденные, взятые из земли, можем мы перейти в формы и измерения Божественной вечности. Логически это невозможно, но Бог так создал человека. И все мы должны строить наше спасение через жизнь по заповедям Христа, через хранение слова Его, которое обожает человека.'
      cn: 你看，我们被赋予了成就极其伟大的行动之可能性：作为受生、取自尘土之人，我们能够进入神圣永恒的形式和维度。从逻辑上讲，这是不可能的，但上帝如此创造了人。而我们所有人都应当通过按照基督的诫命生活，通过持守祂珍爱人类的话语，来成就我们的救赎。
  - type: paragraph
    text:
      ru: 'Переход этот не должен совершаться как акт воображения каких-то событий из жизни Христа, – воображения, которое рисует Христа в нашем уме, как мы Его мыслим. Этого нам делать не рекомендуется отцами нашими. Но что Сам Господь говорит? – Чтобы мы любили Его. И «если любим Его, то сохраним исловоЕго» (см.Ин.14:23), ограждаясь тем самым от всякого помысла, оскверняющего все существо наше. Без всяких актов воображения, но через память слова Христова мы можем перейти от осквернения к вечному спасению. И это в нашей воле: это зависит от нас. И когда мы будем делать это маленькое дело соответственно нашим маленьким силам, то может прийти к нам великая сила Бога. А мы себя приготовляем только тем, что «поучаемся в этом словедень и ночь»; тем, что храним наш ум от всякого союза с помыслами, которые внушают нам совершать грех.'
      cn: 这个转变不应作为一种想象基督生平中某些事件的行为来完成——这种想象在我们心中描绘出我们所构想的基督。我们的教父不建议我们这样做。但上主自己说了什么呢？——要我们爱祂。并且「我们若爱祂，就必遵守祂的道」（参阅 约翰福音 14:23），借此抵御一切污染我们整个存在的思虑。不借任何想象行为，而是借着记忆基督的圣言，我们才能从污秽走向永恒的救赎。这就在于我们的意志：这取决于我们。当我们按照我们微小的力量做这件小事时，上帝的伟大能力便可能临到我们。而我们唯独借着「昼夜默想这道」来预备自己；借着保守我们的心智，使其不与一切诱使我们犯罪的思虑结合。
  - type: paragraph
    text:
      ru: Великая вещь – святость. И мы привыкаем чувствовать себя грешниками. И это хорошо. Но все-таки слово Божие совершает с нами то, что даже мы можем стать святыми. Не отрезан от нас путь к вечной святости великого нашего Творца. Все нам дано от Бога Предвечного, Которому свойственна великая предвечная любовь.
      cn: 圣洁是伟大的事。我们习惯于感到自己是罪人。这也很好。但上帝的圣言却在我们身上成就了这事，使我们甚至能够成为圣徒。通往我们伟大造物主永恒圣洁的道路并未对我们隔绝。一切都由永恒的上帝赐予我们，祂具有伟大的、永恒的爱。
  - type: paragraph
    text:
      ru: 'Так через малые дела мы встанем на путь любви ко Христу. И любовь Христова, которую отказался воспевать прп. Силуан как превосходящую всякий разум и всякое слово[164], – об этой любви Христа мы говорим, что она исходит от Бога, Который смирен. Выражаясь в формах Священного Писания, мы можем сказать, что«Бог естьсмирение» (ср.1Ин.4:8). И смиренному Богу свойственна смиренная любовь, а не свысока. А когда речь идет о таком смирении, тогда речь идет и об истощании. Смиренная любовь Бога – потому что Он смирен – делает любовь кенотическою. Бог, сотворивший Словом Своим все сущее, воплотился и жил, унижая Себя до пределов, нам недоступных. Это есть характерная черта любви Божией: она – самоистощающаяся, кенотическая. Так Господь, чтобы восприняли Его слово, до Своего распятия на Голгофе мыл ноги Апостолам и говорил:«Я дал вам пример, чтобы и вы делали то же, что Я сделал вам»(Ин.13:15).'
      cn: 如此，借着微小之事，我们就能踏上爱基督的道路。而基督的爱，是圣西卢安教父拒绝歌颂的，因其超越一切理智和言语[164]，— 关于基督的这份爱，我们说它是来自谦卑的上帝的。若以圣经的形式表达，我们可以说：「上帝就是谦卑」（参 约翰一书 4:8）。而谦卑的上帝所固有的乃是谦卑的爱，而非高高在上的。当谈及如此的谦卑时，也就是在谈论自我虚空。上帝谦卑的爱 — 因为祂是谦卑的 — 使这爱成为虚己之爱。上帝，以祂的圣言创造了万有，道成肉身，并活在世上，贬抑自己，达到我们所不能及的极限。这是上帝之爱的特征：它是自我虚空的，虚己的。于是上主，为了使人领受祂的话语，在祂被钉十字架于各各他之前，为使徒们洗脚，并说：「我给你们做了榜样，叫你们照着我向你们所做的去做。」（约翰福音 13:15）
  - type: paragraph
    text:
      ru: 'В любви человеческой есть любовь, которая несколько больше, чем все другие человеческие проявления, приближается к этому виду кенотической Божественной любви, – это любовь матери: она все переносит от своего младенца; она готова на все унизительные формы служения своему младенцу. Это есть кенотическая любовь матери.'
      cn: 在人类的爱中，有一种爱，比所有其他的人类表现，更接近这种虚己的上帝之爱——那就是母亲的爱：她能忍受自己婴孩的一切；她乐意以一切卑微的形式服侍自己的婴孩。这就是母亲的虚己之爱。
  - type: paragraph
    text:
      ru: И Господь смиряется перед нами, как мать перед ребенком. Если бы Он являлся нам в Своем могуществе, мы боялись бы к Нему подойти, мы боялись бы на Него взглянуть. А чтобы не испугать человека, Он воспринял на Себя наше телесное бытие,existence, то есть «бывание» (это малоупотребительное русское слово, которое, как понятие философское, соответствует понятиюexistence).
      cn: 主在我们在面前降卑自己，如同母亲在孩子面前一般。如果祂以祂的威能向我们显现，我们就会害怕靠近祂，我们就会害怕仰望祂。为了不使人受惊，祂取了我们肉身的存有，即 existence，也就是「бывание」（这是一个不常用的俄语词，它作为一个哲学概念，与 existence 这一概念相对应）。
  - type: paragraph
    text:
      ru: И вот, когда мы по любви ко Христу вдруг исполняемся видением величия Божественного смирения, тогда ложится на нас печать Божия, и жизнь наша может стать святою и полною величия при всех своих рабских формах, в которых выражается этот кенозис-истощание.
      cn: 于是，当我们在对基督的爱中，忽然被神性谦卑的伟大异象所充满时，上帝的印记便盖在我们身上；我们的生命便能成为圣洁而充满伟大，尽管它一切奴仆般的形态，这当中所彰显出的，便是这虚己-倾倒。
  - type: paragraph
    text:
      ru: 'Вот я так беспорядочно говорю вам о многих вещах, но вы приведите все это в порядок и не презирайте этого слова и помните:«Блажен муж, иже не идет на совет нечестивых», и перефразируйте: «Блажен наш ум, который не идет на беседу с дурными помыслами; блажен ум, который поучается день и ночь в любви Божией» (ср.Пс.1:1–2). Писание говорит о поучении«в законе», но, в сущности говоря, Евангелие уже не закон, а есть нечто другое. Поэтому можно говорить, что ум наш поучается не в законе Господнем, а в ЛЮБВИ Господней.'
      cn: 如今我如此无序地向你们讲述许多事情，但你们要将这一切整理有序，且不可轻蔑这番话，并请谨记：「福哉那不从恶人计谋的人」，并转述为：「福哉我们的心智，它不与邪恶的意念交谈；福哉那昼夜受上帝之爱教诲的心智」（参阅诗篇 1:1-2）。圣经提及「在律法中」的教诲，但实质而言，福音已非律法，而是全然不同的事物。因此，可以说我们的心智并非受上主律法之教诲，而是受上主之爱（的教诲）。
  - type: paragraph
    text:
      ru: 'Итак, приготовьтесь, дорогие мои братья и сестры, к той молитве, которую совершаем мы здесь в монастыре в субботу только для братьев и сестер, а в воскресенье – всеобщую с пришедшими к нам богомольцами. Пожалуйста, помыслите об этом поглубже и молитесь о всеобщем прощении для всего мира, вспоминая Христа, Который говорит:«Я дал вам пример, и выпоступайте так же» (см.Ин.13:15). А какой пример? – Он взял на Себя грехи всего мира. И в страхе идем мы за Христом, идущим впереди нас, – как это описывается в Евангелии: ученики«ужасались и, следуя за Ним, были в страхе»(ср.Мк.10:32), потому что Он восходил к Иерусалиму пережить суд синедриона, пережить побои, оплевание и смерть.'
      cn: 那么，预备好，我亲爱的弟兄姐妹们，为了那场祷告，我们在这里的修道院里周六仅为弟兄姐妹们举行，而周日则是与前来我们这里的朝圣者们一起的全体祷告。请各位对此深思，并为全世界的全体宽恕而祷告，纪念基督所说的话：「我给你们作了榜样，你们也要照样行。」（参 约翰福音 13:15）。那么，是怎样的榜样呢？——祂担当了全世界的罪。我们也在惧怕中跟随走在我们前面的基督，——正如福音书中所描述的：门徒们「都惊骇，跟从的，也害怕。」（参 马可福音 10:32），因为祂上耶路撒冷去，经受公议会的审判，经受鞭打、唾弃和死亡。
  - type: paragraph
    text:
      ru: Нас охватывает тот же священный ужас, когда во время Великого Поста как-то усиленно подчеркивается в богослужениях, что эта любовь, идущая до полного самоистощания, самопожертвования, вызывает гонения и ненависть от людей мира сего. Это непонятное таинство, но мы знаем это. Мы знаем, что не хотим никакого зла никому, и все-таки Господь сказал:«вы будете ненавидимы всеми народами»(см.Мф.24:9). И когда нас ненавидят, тогда мы уподобляемся Христу, страдающему на Голгофе.
      cn: 当大斋期期间，在圣事礼仪中以某种方式被着重强调：这直到完全的自我耗尽、自我牺牲的爱，会招致世人的迫害和仇恨时，我们被同样的圣洁的敬畏所笼罩。这是一个费解的奥秘，但我们知道。我们知道我们不愿加害于任何人，然而上主说：「你们要为万民所恨恶」（参见 马太福音 24:9）。当我们被仇恨时，那时我们就与在各各他受难的基督相似。
  - type: paragraph
    text:
      ru: 'Итак, драгоценные мои братья и сестры, я сказал вам немного слов, и вы думайте обо всем этом все эти дни вплоть до Страстной недели и затем святой Пасхи, святого Воскресения Христова, о которойСимвол верыговорит: «Чаю воскресения мертвых». Это все будем носить мы в сердце нашем. И тогда энергия вечной жизни, которая заключена во слове Божием, перейдет к нам. И мы будем под действием этой энергии всегда, даже когда мы спим...'
      cn: 所以，我亲爱的弟兄姐妹们，我已对你们说了几句话，你们要在这所有的日子里思考这一切，直至圣周，以及随后的圣逾越节、圣基督复活节，信经对此说道：「我盼望死人复活。」所有这一切，我们都要铭记在心。那么，蕴藏于上帝圣言中的永生之能，就将临到我们。我们就会常在这能量的作用之下，甚至在我们睡眠时亦然……
- type: heading1
  text:
    ru: 'Беседа 26: О цельности духовной жизни[165]'
    cn: 讲论 26：论灵修生活的整全[165]
  children:
  - type: paragraph
    text:
      ru: 'О заблуждении тех, кто говорит: «Теперь нет старцев». Для России надо сплотиться вокруг Патриарха. История человечества. О разрушениях в России. Христос тот же во веки. О духовном руководстве. Послушание как культура богопознания. О трех периодах духовной жизни. Послушание – путь к чистой молитве. Не приписывать себе ничего! О слове игумена Мисаила. О состояниях без опыта Голгофы. О тех, кто думает, что духовные дары в наше время невозможны.'
      cn: '关于那些说「现在没有长老了」之人的谬误。

        对于俄罗斯来说，需要围绕宗主教团结起来。

        人类历史。

        关于俄罗斯的毁坏。

        基督直到万古仍是那位。

        关于属灵指导。

        顺服作为识神文化。

        关于属灵生命中的三个时期。

        顺服——通往纯洁祷告之路。

        不要将任何事物归于自己！

        关于修道院长米撒伊尔的话语。

        关于没有各各他经历的状态。

        关于那些认为属灵恩赐在我们这个时代不可能的人。'
  - type: paragraph
    text:
      ru: 'Снова и снова благодарю Бога, давшего мне радость видеть вас и говорить с вами. За истекшие последние годы, с тех пор как аппаратура современная открыла во мне страшные болезни, отчасти или даже главным образом из-за возраста, я теряю зрение и слух. Это делает изоляцию мою все более и более полною. Но скажу вам: то, что досталось мне не без боли за истекшие годы и особенно когда, по благоволению Господню, я был в пустыне, по существу своему остается во мне. У меня уже нет силы представить все должным образом. Каждое слово требует особого усилия. Опять повторяю, что мое обращение – к новопоступившим братьям и сестрам, и если старшие присутствуют, то присутствуют для единства духа и предания жизни. Вы уже многое делаете, но никогда невозможно достигнуть того момента, когда вдруг все становится излишним. Повторение некоторых положений, которые стали нашим познанием в силу воплощения единородного Сына и Слова Отчего, сошествия Святого Духа наЦерковь, в существе своем остается верно. И когда мы говорим о вере нашей, то не надо забывать, что всякое слово может иметь великое значение. Ибо Господь говорит:«небо и земля прейдут,словесаМои не прейдут» (Мф.24:35). Каким-то образом все мы, после долгого подвига, должны пребыть в том состоянии, когда мы ощущаем правду этих слов, то есть дыхание Божественной безначальной вечности и историю человека на Земле, которая имеет свой конец.'
      cn: 再次又再次感谢上帝，祂赐予我喜乐，得以见到你们并与你们交谈。在过去的这些年里，自从现代设备揭示了我身患的可怕疾病以来，部分地，甚至主要是因为年事已高，我正在失去视力和听力。这使得我的隔绝越来越彻底。但我告诉你们：我这些年来并非没有痛苦所领受的一切，尤其当，蒙上主恩眷，我在旷野时，这一切在其本质上仍留在我里面。我已没有力量妥善地呈现这一切。每一个词语都需要特别的努力。我再次重申，我的讲话是针对新加入的弟兄姊妹的，而如果长辈们在场，那么，他们是在场为了灵性的合一与生命的传承。你们已经做了很多，但永远不可能达到那个时刻，届时一切突然变得多余。重复某些教导——这些因着独生子，即父的圣言的道成肉身，圣灵降临于教会而成为了我们的认识——在其本质上依然是真实的。而当我们谈论我们的信仰时，就不要忘记，每一个词语都可能具有重大的意义。因为上主说：「天地要废去，我的话却不能废去。」 (马太福音 24:35) 以某种方式，我们所有的人，在长期的属灵操练之后，都应当处于那种状态：当我们感受这些话语的真实性时，也就是神圣无始永恒的气息，以及人类在世上的历史，这历史终将有其结局。
  - type: paragraph
    text:
      ru: Сегодня вам, дорогие, драгоценные для меня братья и сестры, я хочу говорить о цельности духовной жизни, принципы которой с первых моментов христианского существования остаются незыблемыми и непоколебимыми.
      cn: 今天，我亲爱的、对我而言宝贵的弟兄姐妹们，我想谈论属灵生命的整全性，其原则自基督徒生命最初的时刻起就保持不可动摇和坚定不移。
  - type: paragraph
    text:
      ru: Сегодня моя мысль обращается к тому, чтобы указать и утвердить в вашем сознании ту золотую традицию, которую дал Бог мне узнать на Афоне. Я попал в монастырь в такой период, когда там были люди великого духа. Я имею в виду игумена Мисаила, старца Силуана, многих духовников и недуховников, которые были действительно на высоте христианского духа. И это есть предание жизни. То, что совершил Господь в историческое время, когда Он был с нами на Земле, остается живым и полным энергии на все века:«небо и земля прейдут,словеса жеМои не прейдут» – и не только словеса, но и Его примеры.
      cn: 今天我的思绪转向，是要在你们的意识中指明并确立那黄金般的传统，是上帝赐予我在阿索斯山所认识的。我进入修道院时，正值一个时期，那时那里有许多拥有伟大灵性的人。我指的是院长米赛尔、长老圣西卢安，以及许多神师和非神师，他们确实达到了基督徒精神的至高境界。而这正是生命的圣传。上主在历史时期所成就的，当祂与我们一同在地上时，永世长存，充满活力：「天地都要废去，我的话却不能废去」（马太福音 24:35）——不仅是祂的言语，更是祂的榜样。
  - type: paragraph
    text:
      ru: Явление Христа нам дало откровение о предвечной идее Бога о человеке. Очень многие из основ всей нашей духовной жизни уже были выражены Апостолами в самом начале жизни Церкви по Воскресении и Вознесении Господнем. Господь объемлет и носит в Себе всю вечность. Непротяженно Он объемлет все века. Как говорят многие святые отцы, Бог независтлив и его желание – видеть людей равными Себе[166].
      cn: 基督的显现赐予我们关于上帝对人那永恒理念的启示。我们整个属灵生活的诸多基本要素，早在上主复活与升天之后，在教会初期就已由使徒们表达出来。上主怀抱并于祂自身承载所有的永恒。祂无延展地包容所有的时代。许多圣教父们说，上帝并非嫉妒的，祂的愿望是看到人们与祂自身平等[166]。
  - type: paragraph
    text:
      ru: 'Когда мы говорим о нашей жизни во Христе теперь, то слово наше касается как современного положения вещей, так и безвременного, вечного. За последнее время я слышал некоторые слова, которые обнаружили появление больших заблуждений в такой огромной стране, как Россия. Наши два брата провели достаточное время в современной России. Разруха, причиненная семидесятилетним, самым безумным гонением против Христа, действительно разорилаЦерковь. И так как за эти семьдесят лет народ был отрезан от настоящего учения и опыта Церкви за истекшие века, то сейчас в сознании этих людей наблюдается большая путаница. На вопрос одного старца из России: «Что мне делать в связи с тем водоворотом всяких нелепых идей?», я по опыту моей жизни ответил ему не о деталях, а о структуре Церкви и предложил ему быть включенным в эту структуру, во главе которой в настоящее время стоит патриарх Алексий II. Надо, чтобы все возвращающиеся церкви, школы и так далее прилеплялись к этому столпу и утверждению. ИЦерковьнайдет свой путь... Разрушив всю аскетическую и богословскую культуру, большевики – безумцы в своем неправильно понятом гуманизме – все извратили и сожгли библиотеки. Но одно они оставили целым по промыслу Божию – структуру Церкви. Единство Церкви, цельность ее возможна только теперь через соединение в этой структуре. Говорю об этом, потому что появились странные идеи в этом большом море русских людей, любящих Христа, но не всегда разумною любовью, как полагается.'
      cn: 当我们现在谈论我们在基督里的生命时，我们的言语既关乎当下的境况，也关乎那超越时间、永恒之事。近来，我听到一些言论，显露出在俄罗斯这样广袤的国度中出现了巨大的谬误。我们的两位弟兄在现代俄罗斯花费了相当长的时间。由持续七十年、最为疯狂的对基督的迫害所造成的破坏，确实使教会败落了。并且由于这七十年间人民被切断了与教会历代真实教导和经验的联系，所以现在这些人的意识中存在着巨大的混乱。针对一位来自俄罗斯的长者提出的问题：「面对这股荒谬思想的漩涡，我该怎么做？」我凭着我生命的经验，没有回答他细节，而是回答了教会的结构，并建议他融入这个结构，这个结构目前由牧首阿列克谢二世位居其首。必须让所有正在恢复的教会、学校等等，都依附于这个支柱和根基。于是教会将找到自己的道路……布尔什维克摧毁了所有的苦修文化和神学文化——这些在其错误理解的人道主义中变得疯狂的人——扭曲了一切，焚烧了图书馆。但借着上帝的安排，有一件事他们完整地保留了下来——那就是教会的结构。教会的合一，其完整性，如今唯有通过融入这个结构才能实现。我之所以谈及此事，是因为在这片爱基督的广大俄罗斯人民的海洋中，出现了一些奇怪的想法，但他们的爱并非总是如所应当的那样合乎理性。
  - type: paragraph
    text:
      ru: 'Одна из идей, что якобы Господь в наше время действует не так, как Он действовал раньше, что Сам Господь изменился. Так, я слышал идею, что в наше время нет старцев, что Господь перестал давать их Церкви. А путь старчества касается великой науки о вечности – науки о послушании. Те молодые люди, которые теперь поставлены на места, откуда они могут влиять, к сожалению, проявляют ненужную самоуверенность, предполагая, что только они видят истину. Прочитав немногие книги, изданные неправославными богословами и историками, они уклонились в другие совершенно понятия даже о структуре Церкви. Духовная жизнь – вся единая, и она оставляет ощущение простоты. Когда через заповедь Божию, сохраненную годами с великим подвигом даже до крови, достигнуто бесстрастие, это состояние – такое простое, ясное. Проблематика становится все более и более обширной при отсутствии этого бесстрастия и этого познания о Боге. Однако Господь не изменяется:«Поминайте наставников ваших, которые проповедывали вам слово Божие, и, взирая на кончину их жизни, подражайте вере их. Иисус Христос вчера и сегодня и во веки Тот же»(Евр.13:7–8). Старец Силуан то же пишет в главе «О смирении»: «Господь много пожалел меня и дал мне разуметь, что всю жизнь надо плакать. Таков путь Господень. И вот теперь пишу, жалея тех людей, которые, подобно мне, горделивы и потому страдают. Пишу, чтобы учились смирению и обрели покой в Боге.'
      cn: 其中一种想法是，认为上帝在我们这个时代行事不再像祂从前那样，祂自己已经改变了。例如，我曾听过一种想法，认为在我们这个时代没有长者，上帝已不再将他们赐予教会。而长者之道关乎一门关于永恒的伟大科学——即顺服的科学。那些年轻人，他们如今被安置在能够发挥影响力的位置上，遗憾的是，表现出不必要的自负，假设只有他们才看到真理。在阅读了几本由非东正教神学家和历史学家出版的书籍后，他们完全偏离了原有的观念，甚至连对教会的结构也如此。属灵生命完全是合一的，它给人一种单纯的感觉。当通过上帝的诫命，经过多年，以巨大的苦修，甚至流血而持守，达到了无情欲时，这种状态就是如此简单、明晰的。在缺乏这种无情欲和对上帝的认知时，问题变得越来越广泛。然而，上帝不改变：「你们要记念引导你们的，传上帝之道给你们的人，察看他们为人的结局，要效法他们的信心。耶稣基督昨日、今日、直到永远是一样的。」(希伯来书 13:7-8)。圣西卢安长老在《论谦卑》一章中也写道：「主大大怜悯我，并使我明白，一生都当哭泣。这就是主的道路。如今我写下这些，怜悯那些人，他们像我一样骄傲，因此受苦。我写是为了让他们学习谦卑，并在上帝中找到安息。」
  - type: paragraph
    text:
      ru: Некоторые говорят, что это раньше когда-то было, а теперь все это устарело; но у Господа никогда ничто не умаляется, а только мы изменяемся, делаемся плохими и так теряем благодать; а кто просит, тому Господь дает все, не потому, что мы этого стоим, но потому, что Господь милостив и нас любит. Я пишу об этом, потому что душа моя знает Господа»[167]...
      cn: 有些人说，这在过去曾是存在的，而现在这一切都已过时了；但上主那里，从未有任何事物减损，而只是我们改变了，变得败坏了，从而失去了恩典；而凡祈求的，上主就赐予他一切，并非因为我们配得这些，而是因为上主是慈悲的，并且爱我们。我写下这些，因为我的灵魂认识上主»[167]...
  - type: paragraph
    text:
      ru: 'Бесподобное по жестокости гонение разрушило культуру в России: культуру аскетическую и культуру богословскую. Три поколения были лишены всякой возможности воспитываться в Церкви. И теперь появилась странная идея, что Господь в наше время не дает старцев, что каждый из нас должен читать и строить по своему разуму свое спасение и даже жизнь в Церкви. При этом они ссылаются на святого епископаИгнатия Брянчанинова. Это особый случай в церковной жизни. Сам Брянчанинов, будучи аристократом, двадцати шести лет был уже игуменом, когда он всего только два года пробыл послушником. Несомненно, это был благодатный муж. Однако, как аристократ, он учился не у «мужиков», а читая отцов-аскетов. И сейчас возможны такие случаи, когда мы живем рассеянные, где нет духовника, опытного в жизни, и, конечно, людям, поставленным в начальственное положение, приходится читать книги, но все-таки надо избегать той мысли, что они по книгам могут научиться и управлять Церковью. Ибо неизменным остается основной принцип нашей жизни: «Да будет воля Твоя, яко на небеси и на земли».'
      cn: 史无前例的残酷迫害摧毁了俄罗斯的文化：苦修文化和神学文化。三代人被剥夺了所有在教会中受教养的机会。而今却出现了一种奇怪的想法，认为主在我们时代不再赐予长者，认为我们每个人都应该凭自己的理智去阅读和构建自己的救赎，甚至包括在教会中的生活。他们同时引用圣主教伊格纳季·布良恰尼诺夫的话。这是教会生活中一个特殊的例子。布良恰尼诺夫本人，身为贵族，二十六岁时就已是修道院院长，当时他仅仅当了两年见习修士。毫无疑问，他是一位蒙恩之人。然而，作为一个贵族，他并非向「农夫们」学习，而是通过阅读苦修教父们的著作。而今，在某些情况下也是可能的，当我们生活分散，身边没有经验丰富的神师时，当然，对于那些身居管理职位的人，必须阅读书籍，但无论如何，我们必须避免这样的想法：认为他们可以通过阅读书籍来学习并管理教会。因为我们生活的基本原则始终不变：「愿祢的旨意行在地上，如同行在天上。」
  - type: paragraph
    text:
      ru: 'Как мы будем познавать волю Божию? Об этом – великая наука православной Церкви. Об этой культуре, равной которой не знает Земля, хотелось бы говорить огненным словом! Когда я поступил в монастырь Святого Пантелеимона на Афоне, там я слышал такие слова: старые монахи смотрели как на безумного на того, кто, прожив в монастыре менее десяти лет, уже говорил о духовных вещах. Опыт научил этих монахов тому, что есть три периода духовной жизни: начальный – первая благодать, второй – отнятие благодати ощутимой и предоставление человеку проявить свое произволение, третий – возврат благодати уже в более совершенной форме как неотъемлемое достояние.'
      cn: 我们当如何 позна上帝的旨意？关于这，是东正教教会的一门伟大学问。关于这世间无与伦比的文化，真盼能以炽热之言辞论及！当我进入阿索斯山的圣潘捷列伊蒙修道院时，我在那里听到这样的话：老修士们对那些在修道院里居住未满十年，就已经谈论属灵之事的人，视之为疯癫。经验教导这些修士们，属灵生命有三个阶段：初始阶段——第一重恩典；第二阶段——有感恩典被收回，并允许人显明其自由意志；第三阶段——恩典的回归，已以更完备的形式，作为不可剥夺的产业。
  - type: paragraph
    text:
      ru: В сущности, духовниками должны быть люди, прошедшие все эти три периода. Кто знает только одно, то есть благодать Божию, тот еще далек от совершенства. Богу угодно поставить человека в прямую борьбу с врагом, как Сам Он в пустыне был искушен дьяволом и обращался с ним так, как свойственно Господу, Он действовал действительно свято даже с врагом (см.Мф.4:1–11).
      cn: 本质上，神师应当是那些经历过所有这三个阶段的人。那些只了解其中一个，也就是说只了解上帝的恩典的人，离完美还很远。上帝乐意使人置身于与仇敌直接的争战中，正如祂自己在旷野受魔鬼试探，并且以主所固有的方式对待它；祂即使对仇敌，其行事也确实圣洁 (参看马太福音 4:1-11)。
  - type: paragraph
    text:
      ru: 'Так, научиться этой брани человек должен прежде, чем стать во главе монастыря, епархии и всей Церкви. А впечатление у тех, кто впервые получает благодать, как будто бы действительно они впервые открывают свет Христов. Я не обвиняю их, потому что все разбито. И в этом водовороте страшном не приходится ждать чистого разумения ни от кого. И потому я – за структуру: тогда вечно останетсяЦерковь, так построенная, и постепенно встанет на путь познания Бога.'
      cn: 因此，人必须在成为修道院、教区和整个教会的领袖之前，学会这场争战。而那些首次领受恩典的人，他们的感受仿佛他们确实是首次开启基督之光一般。我并不责怪他们，因为一切都已破碎。在这可怕的漩涡中，不可能指望从任何人那里获得纯粹的悟性。因此，我主张建立结构：如此建立的教会才能永远存留，并逐渐走上认识上帝的道路。
  - type: paragraph
    text:
      ru: 'В этом послушании заключены многие аспекты нашей жизни. В моей брошюре об «Основах православного подвижничества» я говорю о том, что послушание старцу дает возможность послушнику возноситься в сферу чистой молитвы. Всякое пристрастие к земному в них умалено послушанием и доверием к игумену. В книге я говорю о том, как старец Силуан спросил игумена: «Как монах может узнать волю Божию?» И этот благословенный избранник, великий муж Мисаил сказал: «Мое первое слово он должен принять как выражение Божией воли и, следовательно, действовать так»[168]. Слово старца становится словом, исходящим от Бога, и должно быть соблюдено.'
      cn: 在这顺服中，包含了我们生命的许多方面。在我的小册子《东正教苦修基础》中，我谈到，对长老的顺服使受教者得以升入纯净祷告的境界。在他们里面，对尘世的一切执着因着顺服和对掌院的信任而得以减少。在书中，我谈到圣西卢安长老如何问掌院说：「修士如何能得知上帝的旨意？」而这位蒙福的被选者，伟大的米赛尔说：「我的第一句话，他必须将其视为上帝旨意的表达，因此，便照此行事。」[168]长老的话语成为源自上帝的话语，并且必须被遵守。
  - type: paragraph
    text:
      ru: 'Заповедь Божия превосходит нас. Мы никогда не достигаем ее извечного совершенства. И кто разумеет этот аспект, тот будет жить в страхе: как бы ему не ошибиться в чем-либо. И этот путь послушания есть наилучший. Тогда человек становится свободным для действия благодати Божией уже непосредственно на его сердце. Но, получая через послушание даже и великое дарование, вплоть до чудотворения, он ничего не приписывает себе и все хранит, как дар свыше, подобно тому как Божия Матерь слагала«в сердце Своем»каждое слово (см.Лк.2:19). Простите меня: я говорю о том, что я уже писал. Но читайте почаще эти слова, потому что там написано согласно с золотой, древней, основной традицией. Это совсем не моя выдумка, а это есть предание жизни от первых веков.'
      cn: 上帝的诫命超越我们。我们永远无法达到它那永恒的完美。凡是领悟到这一点的人，他就会生活在恐惧中：唯恐自己在任何事上有所差错。而这顺从的道路是最上好的。那么人就得以自由，以便上帝的恩典能直接在他的心中运行。然而，即使通过顺从获得了伟大的恩赐，甚至到了行神迹的地步，他也不将任何事归于己，并且将一切珍藏为来自上天的恩赐，正如圣母将每一个字「存记在心中」（参 路加福音 2:19）。请原谅我：我在谈论我已写过的东西。但请您们更常阅读这些话语，因为那里所写的是符合那黄金般、古老而根本的传统。这绝非我的杜撰，而是来自最初数世纪的生命圣传。
  - type: paragraph
    text:
      ru: Что замечается и что подлежит исправлению в жизни каждого христианина и каждой Церкви? – Надо жить непременно по заповедям Божиим. И через это старание жить по заповеди человек перерождается. Он становится необычайно чутким к атмосфере духовной, ограничиваясь вначале монастырем, группой лиц, потом Церковью, и так доходит до пределов безграничных.
      cn: 在每个基督徒和每个教会的生命中，有什么是值得注意的，又有什么是需要修正的呢？——务必按照上帝的诫命而活。借着这种努力去按照诫命生活，人便会重生。他变得对属灵的氛围异常敏锐，起初局限于修道院、一群人，然后是教会，如此便达到无限的境地。
  - type: paragraph
    text:
      ru: 'Игумен Мисаил сказал старцу Силуану: «Первое слово мое пусть монах примет как выражение воли Божией». Из книги ясно, что он непрестанно молился. Это человек, который совершил много чудес и который проявил редкую форму прозрения, как говорили о нем, – он говорил старцу дальше: «Но если человек не принимает мое слово окончательно, то я отступаю как человек и говорю: “Делайте, как вы понимаете!”». И нет у него другого слова.'
      cn: 院长米撒依尔对长老西路亚诺说：「我的第一句话，愿修士将其视为上帝旨意的表达。」从书中可知，他不间断地祷告。他是一位行了许多奇迹的人，并且，正如人们所说的，他展现了一种罕见的洞察力——他继续对长老说：「但是，如果一个人不最终接受我的话，那么我就以一个人的身份退让，说：『照你所理解的去做吧！』」他再没有别的话了。
  - type: paragraph
    text:
      ru: 'Я был поставлен Божиим промыслом в необычайно благоприятные условия жизни. То, что я говорю вам, есть следствие того дара Божия, который дал мне Господь (я не знаю, почему). Что со мною было? – Расскажу вам один яркий случай. Игумен говорил: «Слишком велика честь попасть в русло извечной воли Божией». Это уже приготовление к вечности. Как-то он меня позвал и сказал, что монастырь нуждается в людях, которые знают греческий язык: «Итак, Вы, отец Софроний, изучайте греческий язык». Я сделал земной поклон, как полагается на Святой Горе, и направился к двери. Он позвал: «Отец Софроний!» Я обернулся, стою безмолвно. Он говорит: «Бог дважды не судит. Если вы сделаете это за послушание мне, то я отвечаю пред Богом за это. А Вы идите в мире и работайте»[169]. Этот человек – избранник Божий, – когда сказал так, то все шесть месяцев, потраченные на изучение греческого языка, меня, который никогда не знал мира настоящего, окружал мир. Был момент, когда я заболел и думал, что я умру. И тогда было чувство: «Если сейчас меня призовет Господь, то я на половине буквы прерву мою работу и пойду на суд». Мне несвойственно было такое дерзновение пред Богом, но оно было дано по слову его. Так и вы имейте эти живые примеры как руководящие в жизни нашей монастырской, и вы познаете то, о чем я говорю. У старца есть замечательные слова, которые многим неразумным могут показаться гордыми или как заблуждение. Старец говорит: «Пишу я сие, потому что я познал Бога»[170]. И каждый из нас желает служить Богу, Которого он знает, а не служить«Богу неведомому»и «недоведомому» (см.Деян.17:23).'
      cn: '我蒙上帝的护理，被置于异常有利的生活条件之中。我对你们所说的，是主赐予我的那份上帝恩赐的结果（我不知道为什么）。我身上发生了什么？——我给你们讲一个鲜明的例子。院长曾说：「能进入上帝永恒旨意的轨道，是极大的荣耀。」这已是对永恒的预备。有一次他叫我过去，说修道院需要懂希腊语的人：「因此，索夫罗尼神父，您去学习希腊语吧。」我便依照圣山上的规矩行了大叩拜，然后走向门口。他喊道：「索夫罗尼神父！」我转过身，一言不发地站着。他说：「上帝不会两次审判。如果您因顺服我而做这件事，那么我将在上帝面前为此负责。而您则平安去工作吧」[169]。这人——上帝的选民——这样说了以后，我在学习希腊语的整个六个月里，我这个从未真正认识和平的人，却被和平环绕着。


        有一个时刻，我病了，以为自己会死。于是我有一种感觉：「如果主现在召唤我，我会在一个字母学到一半时中断我的工作，并去受审判。」我本不具备在上帝面前如此的胆量，但这胆量是因他的话语而赐予的。你们也要以这些活生生的例子为我们修道院生活中的指导，你们就会明白我所说的一切。


        长老有句精彩的话语，许多无知之人可能会觉得这话说得傲慢或是一种谬误。长老说：「我写下这些，是因为我认识了上帝」[170]。我们每个人都渴望事奉他所认识的上帝，而不是事奉「未知之神」和「未曾认识之神」（参使徒行传 17:23）。'
  - type: paragraph
    text:
      ru: 'Старчество – как пророчество: оно не подлежит административному действию иерархии. Старец – это человек, со страхом проживший много лет в заповедях Божиих: он может говорить другим, как он понимает. И это хорошо. А те, которые недавно начали ощущать благодать Божию, должны быть очень осторожными – до тех пор, покамест не пройдут«долинусмерти» (ср.Пс.22:4) испытаний, искушений. Тогда они приобретают силу суждения. Иначе они повторяют какие-нибудь слова, не зная их настоящего содержания.'
      cn: 长老职分，如同先知职分，它不隶属于圣统制的行政管辖。长老是这样一个人，他怀着敬畏之心，多年生活在上帝的诫命中：他可以对他人言说他所理解的。这本是好的。然而那些才刚开始感受上帝恩典的人，必须极其谨慎——直到他们经过试炼和诱惑的『死亡幽谷』（诗篇 22:4）。那时他们才获得分辨力。否则，他们只会重复一些话语，却不知道其真正的内涵。
  - type: paragraph
    text:
      ru: 'Я мог бы рассказать вам и другие случаи, подобные тому. Но читайте вы книгу о старце, и вы не станете жертвой этой наивной идеи, что Бог перестал давать старцев. В патериках написано, как молодой брат сказал, что нет старцев, и получил ответ, что не старцев нет, а послушников нет[171]. Гордый юноша презирает стариков, и для него, конечно, нет старца, нет духовного отца. И сколько бы они ни читали прпп.Исаака Сирина,Ефрема Сирина,Симеона Нового Богослова, свт.Григория Паламу– все равно они не познают того, что дается за послушание: чистая молитва, свободная от всех страстей греховных. Ни одна академия не дает этого своим ученикам, а только жизнь монашеская, где с полным доверием к игумену и к духовнику монах следует их указаниям.'
      cn: 我还可以告诉你们其他类似的情况。但是，你们若读一本关于长老的书，就不会成为这种天真的想法的受害者，认为上帝不再赐予长老。在教父言行录中记载着，一个年轻的修士说没有长老了，并得到回应说，并不是没有长老，而是没有听命者了[171]。骄傲的年轻人蔑视长者，当然，对他而言，就没有长老，没有神师。无论他们读多少圣西里亚的以撒、圣叙利亚的以弗所、圣新神学家西默翁、圣格列高利·帕拉马的著作——他们仍然无法领悟那通过听命而赐予的：纯洁的祷告，摆脱一切罪恶情欲的束缚。没有任何一所神学院能将此赐予其学生，唯有修道生活，在其中，修士完全信赖院长和神师，并遵从他们的指示。
  - type: paragraph
    text:
      ru: 'Когда человек начинает жить по заповедям Божиим, он восходит сначала на Голгофу и потом на Елеонскую гору для Вознесения. Людям, не прошедшим на опыте эти состояния, не дано право судить (ср.1Кор.2:15). Многие святые выдержали это, но особенно прп.Симеон Новый Богословв этом отношении является примером. Ему до монашества было дано узреть Нетварный Свет. И многие уже в конце десятого столетия, тысячу лет тому назад, думали так же, как теперь: что в первые века Господь действовал с особой силой, когда люди, уверовавшие во Христа, жадно стремились умереть за Него, а в десятом веке уже этого не было[172]. А прп. Симеон говорит, что было, потому что Господь не меняется, а все время остается Тот же, – как писал апостол Павел[173], как писал через тысячу лет прп. Силуан, наш великий отец.'
      cn: 当人开始依照上帝的诫命生活时，他首先登上各各他，然后登上橄榄山，为了升天。那些没有亲身经历过这些状态的人，没有被赋予评判的权利（参阅哥林多前书 2:15）。许多圣人经受住了这一切，但尤其是圣西缅新神学家，在这方面是一个榜样。他在修道前，被赐予看见那未受造之光。并且在十世纪末，即一千年前，许多人就和现在一样地认为：在最初的几个世纪，上主以特别的力量行事，那时，信奉基督的人们热切地渴望为祂而死，而到了十世纪时，这种情况已不复存在[172]。然而，圣西缅说，那时依然存在，因为上主永不改变，祂始终如一——正如使徒保罗所写[173]，正如一千年后，我们的伟大教父圣西卢安所写。
  - type: paragraph
    text:
      ru: Конечно, читайте книги, получайте образование! Но самое большое дело в монашестве – через послушание предаться на волю Божию. Тогда Господь дает то, чего не познают никакие академики, – чистую молитву.
      cn: 当然，阅读书籍，获得学识吧！但是，修道生活中最重要的事情是——借由顺服，将自己交付于上帝的旨意。那么，主便会赐予那任何学者都无法认识的事物——纯洁的祷告。
  - type: paragraph
    text:
      ru: И об этом настоящем монашестве я хотел бы говорить с вами без конца. Хотя должен сказать вам, что, отрезанный слепотою от книг, сидя в моем некоем затворе, когда мои возможности общаться с приходящими в монастырь уже умалились, я за последние годы страшно много потерял. Но то, что перст Божий пишет, когда Бог склоняется на наше покаяние, – это не подлежит забвению. Вы, наверно, уже почувствовали, что жизнь духовная во Христе грандиознее великого океана.
      cn: 关于这种真正的修道生活，我愿意与你们长谈不休。不过我必须告诉你们，由于失明而无法读书，独自幽居在某个隐修之处，当我已经没有什么机会与前来修道院的人们交流时，我在过去的这些年里失去了很多很多。然而，当上帝俯就我们的悔改之时，上帝的指头所书写的，是不容遗忘的。你们，想必已经感受到了，基督里的属灵生命比浩瀚的海洋更为宏伟。
  - type: paragraph
    text:
      ru: Итак, на сегодня отпустите меня с миром. И я молюсь, чтобы Господь дал вам этот мир, который мне дал Господь по молитвам игумена Мисаила, память которого я чту глубоко. И да хранит вас Господь...
      cn: 那么，今天请允许我平安离去。我祈求上主赐予你们这平安，这平安是上主藉着我深深敬仰的伊古缅米撒伊尔的祷告赐予我的。愿上主保守你们……
- type: heading1
  text:
    ru: 'Беседа 27: Страдания, через которые познается единство человечества, как путь спасения в наше время[174]'
    cn: 讲道 27：苦难——借此得以认识人类的合一——作为现今时代的救赎之道[174]
  children:
  - type: paragraph
    text:
      ru: Постижение человечества через со-страдание. Наше время – сугубо тяжелое. О молитвеннике за весь мир. Об аде нелюбви. О нашей неспособности к исихазму. О нашем спасении через скорби, характерные для нашего века. Об отсутствии культуры сердца при обилии культуры интеллекта.
      cn: '通过悲悯体认人性。

        我们的时代——极其艰难。

        论为普世代祷者。

        论无爱之地狱。

        论我们对静修的无能。

        论我们借由我们时代特有的苦难获得救赎。

        论心灵文化的缺乏，而理智文化则甚为丰沛。'
  - type: paragraph
    text:
      ru: 'Благословенно имя Бога нашего, Бога в Троице: Отца и Сына и Святаго Духа.'
      cn: 愿我们上帝——三位一体的上帝：父、子和圣灵——的圣名受颂扬。
  - type: paragraph
    text:
      ru: В последнее время, как вы знаете, я часто пребываю совершенно без сил и лишен общения с вами. Теперь, кончая жизнь и ожидая исхода моего каждый день и каждый час, я, странным образом (а может быть, и естественным образом), вспоминаю первые дни моего монашества. В двадцать пятом году я прибыл на Афон, чтобы там остаться монахом. Это было шестьдесят семь лет тому назад.
      cn: 近来，如您们所知，我常常全然无力，且与您们断绝了交通。如今，生命将尽，每日每时都在等待我的离世，我却以一种奇特的方式（或许，也是以一种自然的方式）回想起我修道生涯的最初时日。一九二五年，我抵达了阿索斯山，为了在那里留下来作一名修士。这已是六十七年前的事了。
  - type: paragraph
    text:
      ru: 'Пережив страдания Первой мировой войны и последовавших затем катастроф – частичных и общих, людских и космических, – я теперь могу сказать, что война эта естественным образом породила во мне мысль о всем человечестве, ибо все человечество принимает участие в мировой войне. В предсказаниях Самого Христа в Евангелиях (Мф.24:6;Лк.21:9) много говорится о конце дней и о скорбях, тяжелых для всего мира, на долгие годы. Я, как живописец, тянулся во Францию, которая в тот исторический момент была первенствующею страною в сфере моего искусства. И хотя война кончилась победоносно для Франции, царило ощущение ничтожности результатов войны в моральном плане – она разрушила многие ценности и многие люди погибли. Господь говорит странным образом: «Когда выуслышитеобо всем этом...подымите головы ваши... не ужасайтесь, ибо надлежит всему тому быть»(Мф.24:6;Лк.21:28). Однако горе не принимало таких глубоких форм, как теперь. Страдание и отчаяние в то время были значительно меньшими и легче выносимыми, чем теперешние.'
      cn: 经历第一次世界大战以及随之而来的灾难——无论是局部的还是普遍的，是人间的还是宇宙的——我现在可以这样说，这场战争自然地在我心中激发起关于全人类的思考，因为全人类都参与了这场世界大战。在福音书中，基督亲自的预言里（马太福音 24:6，路加福音 21:9），提到了许多关于末日以及持续多年、普世性的深重苦难。我，作为一个画家，心向法国，因为在那个历史时期，法国在我的艺术领域中居于主导地位。尽管战争以法国的胜利而告终，但在道德层面，人们普遍感到战争的结果微不足道——它摧毁了许多价值观，许多人因此丧生。上主以一种奇特的方式说道：「当你们听见这一切的时候……你们就当抬起头来……不要惊惶，因为这一切是必然要发生的」（马太福音 24:6，路加福音 21:28）。然而，那时的悲痛并未达到如此深重的程度，像现在这样。那时的苦难与绝望远比现在的要轻微且更容易承受。
  - type: paragraph
    text:
      ru: 'Почему я говорю сейчас об этом? – Потому что перед нами, монахами наших дней, стоит вопрос: как построить нашу монашескую жизнь, чтобы мы не потеряли спасения в Боге. Ибо в творении спасенных в Боге Духом Святым людей – смысл всей истории.'
      cn: 为什么我现在要谈论这个？——这是因为我们这些当代的修士，面临着一个问题：我们该如何构建我们的修道生活，才不至失去在上帝里的救恩。因为在圣灵使人在上帝里获得救恩这一事上，蕴含着全部历史的意义。
  - type: paragraph
    text:
      ru: Во времена первого издания «Добротолюбия», собрания отеческих творений, люди обладали несравненно большим терпением, несравненно большей надеждой на спасение, чем теперь. Условия мировой жизни переменились, и люди вступают в брак и рождают детей в иных условиях, нежели прежде. Во многих отношениях есть облегчения, но рождение в сей мир теперь есть гораздо более трудная проблема, чем раньше. Интеллектуальное состояние мира в тот момент, когда я пришел к монашеству, и то, которое я теперь наблюдаю, колоссально различны. Но сказано апостолом Павлом слово, что прежние отцы Ветхого Завета – великаны духа, исполины веры – не достигли тех откровений, которых достигали Апостолы:«да не без нас совершенство примут»(Евр.11:39–40).[175]. Как имевший благоволение Божие пройти все формы монашества, скажу вам, что в организации нашей жизни монашеской мы не можем удержать образ жизни наших отцов. Непременно надо рассчитать жизнь так, чтобы все было по силам.
      cn: 在《爱心之美》这部教父作品集首次出版之时，人们拥有着较之现今无可比拟的巨大耐心，对救赎亦有着无可比拟的巨大盼望。世界的生活条件已经改变，人们在与从前不同的条件下结婚生子。在许多方面都有了便利，但现今出生于此世，是一个比以往更困难得多的问题。我受召进入修道生活之时，世界的智性状态，与我现今所观察到的，截然不同。但使徒保罗曾言，即旧约时代的先祖们——那些灵性的伟人，信德的巨擎——并未达至使徒们所达至的那些启示：「好叫他们若没有我们，就不能得着完全。」（希伯来书 11:39-40）[175] 作为蒙受上帝恩祐，经历了修道生活所有形式的人，我要告诉你们，在组织我们的修道生活时，我们无法维系我们先祖的生活方式。务必如此规划生活，好叫一切都力所能及。
  - type: paragraph
    text:
      ru: 'После Первой мировой войны естественно появилась мысль о мировой жизни: дух человека мыслит все человечество более тесным образом, чем раньше. Я еще застал на Афоне времена «Добротолюбия». Они не прекратились и до сих пор. Из многих случаев молитвы за весь мир, поражавших меня, я выносил великую радость и благодарность Богу за то, что люди стали мыслить все человечество.'
      cn: 第一次世界大战之后，关于普世生命的思想自然而然地出现了：人的精神比以往更紧密地思索着全人类。我还在阿索斯圣山遇上过《爱善集》的时代。它们至今未曾止息。在许多令我深受震撼的为普世代祷的场合中，我获得了极大的喜乐和对上帝的感恩，因为人们已经开始思索全人类了。
  - type: paragraph
    text:
      ru: 'Помню один замечательный момент, который навсегда отпечатался в моем сознании. Это было в самом начале моего монашества, в 1925 или 1926 году. Я пришел на берег моря и увидел там старца с длинной четкой на триста узлов. Я подошел к нему близко со страхом, свойственным новоначальным, и молча стоял, наблюдая, как он молится. А он сидел на большом камне и тянул четку. Наконец я возымел дерзость все-таки попросить его: «Отче, молись обо мне». Я просил об этом, потому что когда я покинул Францию в двадцать пятом году, то дух «отчаяния» уже владел мною, хотя в менее тяжкой форме, чем теперь. И вот, раздавленный этим отчаянием, я просил его: «Отче, молись обо мне». Он посмотрел на меня и говорит: «Ты видишь эту четку? Я тяну ее за весь мир. Я молюсь за весь мир. И ты там, в моей молитве». Трудно объяснить, почему и сколько времени нам нужно на ту или иную реакцию, но, в общем, я не ушел с первым словом. И через некоторое время опять, живя в себе отчаяние тех дней, я сказал: «Отче, молись обо мне». Он говорит: «Я же тебе сказал, что я за весь мир молюсь. И ты здесь, в этой молитве». Через несколько мгновений опять я повторил мою просьбу, потому что глубока была моя скорбь, и снова в третий раз сказал робко: «Отче, молись обо мне». Он добро посмотрел на меня и говорит: «Я же тебе сказал, что ты здесь, – показывает на четку, – что тебе больше надо? Ты здесь, в этой молитве моей за весь мир». Отошел я, пораженный состоянием духа этого старца. «Я молюсь за весь мир; ты там, чтобы не «расколоться» нам на мелочи, на детали».'
      cn: 我记得一个非凡的时刻，它永远铭刻在我的意识中。那是我修士生涯的开端，在1925或1926年。我来到海边，在那里见到一位手持一条三百结长念珠的长者。我带着初入道者特有的畏惧，走近他，默默地站着，看着他祈祷。而他坐在一块大石头上，拨弄着念珠。最终我鼓起勇气，终于开口请求他：「教父啊，请为我祈祷。」我之所以这样请求，是因为当我在二十五年离开法国时，「绝望」之灵已然掌控了我，尽管其严重程度不如现在。于是，我被这绝望压垮，再次请求他：「教父啊，请为我祈祷。」他看着我，说道：「你看见这条念珠了吗？我为全世界拨弄它。我为全世界祈祷。而你就在那里，在我的祈祷中。」很难解释我们为何以及需要多长时间才能做出某种反应，但总而言之，我并没有因为他这第一句话就离开。于是过了一会儿，我又仍然身处那几日的绝望之中，说道：「教父啊，请为我祈祷。」他说：「我不是跟你说了吗，我为全世界祈祷。而你就在这里，在这祈祷中。」几分钟后，我又再次重复了我的请求，因为我的忧伤深重，并再次第三次怯生生地说：「教父啊，请为我祈祷。」他和善地看着我，说道：「我不是跟你说了吗，你就在这里——他指着念珠——你还需要什么呢？你就在我为全世界所作的这祈祷中。」我离开了，被这位长者的精神状态深深震撼。「我为全世界祈祷；你就在那里，这样我们才不会因琐事、因细节而『分裂』。」
  - type: paragraph
    text:
      ru: 'Только приехав тогда на Афон и встретившись с такой формой молитвы, я, конечно, был поражен. Я все думал: «Как мыслит этот старец, молящийся за весь мир, – во времени, в пространстве, все ли человечество от Адама до наших дней? Или его мысль была еще более глубокой и объемлющей?»'
      cn: 唯有那时抵达阿陀斯山并遇到这种祈祷形式，我无疑感到震惊。我一直在想：「这位为全世界祈祷的长老是如何思考的呢？——是在时间里，在空间里，是指从亚当到我们这个时代的所有人类吗？抑或他的思想更为深邃、更为包罗万象呢？」
  - type: paragraph
    text:
      ru: За эти почти семьдесят лет монашества мне пришлось пережить очень многие тяжкие моменты, потому что, когда мы молимся за кого-либо, молитва вводит нас в ту духовную сферу, в которой живет предмет нашей молитвы.
      cn: 在这近七十年修道生活中，我不得不经历过许多艰难时刻，因为当我们为某人祷告时，祷告将我们带入那个属灵领域，在其中，我们祷告的对象生活着。
  - type: paragraph
    text:
      ru: Дорогие мои братья и сестры, я все время стараюсь удержать в вашем сознании мысль о том, что мы не какие-то отдельныеentités[176], отрезанные от других. Нет! – Мы живем в этом мире, где все соединено, где одно связано с другим. Итак, я предложил вам условия жизни, которые соответствовали бы структуре интеллектуальной и телесной современных людей, приходящих к монашеству.
      cn: 亲爱的弟兄姊妹们，我一直努力在你们的意识中保持这样一个想法：我们并非某种与他人隔绝的独立个体[176]。不！我们生活在这个世上，万物相互连接，彼此关联。因此，我向你们建议了这样一种生活条件，它将契合当代寻求修道之人的心智与身体结构。
  - type: paragraph
    text:
      ru: 'И как я был обрадован, говоря недавно с одним человеком об обстоятельствах, слагающихся тяжелым бременем на наших спинах! Я посоветовал ему молиться Богу так: «Ты, Господи, защити нас. Ты видишь наше бессилие противостать против этих волн космических страданий». Я сказал ему: «И когда вы молитесь за себя, за монастырь, за братьев-сестер, то молитесь до того предела, чтобы говорить уже:Господи, защитиНАС!». Потому что во многих отношениях мы вполне имеем право сказать, что ад – это есть нечто производимое отсутствием любви в людях. Люди живут не любовью, а ненавистью. И тогда я сказал этому человеку: «Молитесь за монастырь, за всех нас:защити нас, Господи, дай нам маленький угол на Земле, где мы могли бы совершать Тебе Литургию, приносить Тебе молитву Гефсиманскую. И только до этих пор молитесь:Защити нас, потому что мы не можем пожелать ничего дурного кому бы то ни было».'
      cn: 我是多么地喜悦啊，近日与一人交谈时，谈到那些压在我们背上沉重重担的处境！我建议他这样向上帝祷告：「祢，上主啊，保护我们。祢看见我们无力抵抗这宇宙性苦难的洪流。」我告诉他：「当你们为自己、为修道院、为弟兄姐妹祷告时，那么就祷告到这样的地步，以至于能说：『上主啊，保护我们！』」因为在许多方面，我们完全有权利说，地狱是人类缺乏爱所产生之物。人们不是以爱生活，而是以恨生活。于是我告诉这个人：「为修道院、为我们所有人祷告：上主啊，保护我们，赐予我们在地上一个小小角落，在那里我们可以向祢举行事奉圣礼，向祢献上客西马尼的祷告。并且只祷告到这个程度：保护我们，因为我们无法希望任何人遭遇任何不测。」
  - type: paragraph
    text:
      ru: 'И радовался я ответу: «Но естественно, если мы здесь стараемся молиться за всего Адама, за все человечество, то как в то же самое время мы будем желать что-либо недоброе творящим нам смертельную скорбь?» Смотрите, как соотносятся тот афонский старец, который мне говорил: «Ты здесь, в этой четке», и современный человек, который говорит: «Если мы молимся за всего Адама, то как и кому мы можем пожелать недоброе?»'
      cn: 我因这回答而欢喜：「这很自然，如果我们在这里努力为所有的亚当祈祷，为全人类祈祷，那么，我们怎能在同一时间希望任何不好的事临到那些给我们带来致命忧伤的人呢？」看，那位对我说「你在这里，在这串念珠里」的阿索斯老者，与一位现代人所说的如何相互关联：「如果我们为所有的亚当祈祷，那么我们怎能对谁希望不好的事呢？」
  - type: paragraph
    text:
      ru: Я молчу, ищу слова – объяснить величие этогомомента. Мы неспособны к тем подвигам, о которых написано в «Добротолюбии». Но мы должны построить наше спасение также во всей полноте, – спасение, принесенное нам Христом и Духом Святым.
      cn: 我沉默着，寻找词语，以解释这一刻的伟大。我们无力完成《爱善集》中所记载的那些功绩。但我们必须同样全然地构建我们的救恩——这救恩是由基督和圣灵带给我们的。
  - type: paragraph
    text:
      ru: В самом начале моего монашества я был раздавлен страданием мира как последствием мировой войны. Теперь эти страдания увеличились. И уже к той форме исихазма – безмолвия, в которой пребывали наши отцы и деды, мы менее способны. И это показал современный опыт. Когда мы останавливаем наш интеллект на одном и том же призывании имени, то он утомляется стоянием в этой форме молитвы.
      cn: 在我修道生涯之初，我曾因世界大战所造成的苦难而备受重压。如今，这些苦难增添了。而且，对于我们的父辈和祖辈所持守的那种寂静主义——寂默的形式，我们已不再那么能胜任了。现代的经验也印证了这一点。当我们让我们的理智停驻在同一个圣名呼求上时，它便会因持守这种祷告形式而疲乏。
  - type: paragraph
    text:
      ru: Итак, если мы неспособны теперь к такому безмолвию, к такому монашеству, то значит ли, что мы потеряли спасение? – Нет. В начальные годы своего монашества я читал о пророчествах отцов древнейших времен III–V веков. В одном из пророчеств говорилось, что люди в последнее время станут неспособными к аскетической жизни, подобно людям древних веков. «Но, – добавляет один из отцов, – монахам будут посланы великие скорби. И кто претерпит эти скорби, будут в Царстве большими тех, которые в древности воскрешали мертвых»[177].
      cn: 那么，如果我们现在无法做到这种静默，这种修道生活，那是否意味着我们失去了救赎？——不。在我修道生活的初期，我读到过古代（三至五世纪）教父们的一些预言。其中一个预言提到，末世的人们将无法做到如同古人一般的苦修生活。「但是，」其中一位教父补充道，「巨大的苦难将被赐予修士们。凡忍受这些苦难的，将在天国里比那些古时使死人复活的更伟大」[177]。
  - type: paragraph
    text:
      ru: Сила зла современного организованного мира так велика, что при всей молитве, при всем напряжении нашего духа мы не достигаем победы над этим духом мира. Мы раздавлены страданиями, находящими на нас извне. Но такую форму страданий, может быть, дал Господь только теперь, а не раньше.
      cn: 现代有组织世界的邪恶力量如此强大，以至于我们尽管竭尽全力祈祷，尽管我们全副精神都紧绷着，我们仍无法战胜这世界的灵。我们被从外而来的苦难压垮了。但或许，上主只在此刻才赐予了这种形式的苦难，而非往昔。
  - type: paragraph
    text:
      ru: Молитва за всего Адама – по завету старца нашего, прославленного святого, – возносит нас в различные сферы. В те дни, когда я приехал на Афон, образованных людей там было очень мало. С трудом некоторые могли читать и писать, когда приезжали на Афон, и потом развивались, читая святых отцов. Но, будучи так мало осведомлены о делах всего мира, они молились за весь мир. И тот старец не хотел прекратить молитву ради просьбы одного послушника. В какой сфере пребывал этот старец и в какой сфере пребывает современный интеллектуально развитый человек? Если мы сравним уровень духовного состояния, то в чью пользу будет сравнение? Они жили меньше событиями этого мира, не зная современных достижений науки, техники и так далее, но дух их пребывал в вечности, и молитва их была о вечном спасении. И если ум современных интеллигентов даже на несколько мгновений или минут не может устоять в вечном, то кто живет в более высоком мире?
      cn: 为全人类（亚当）的祷告——按照我们被尊为圣者的长老的训谕——将我们提升到不同的境界。在那些日子里，当我来到阿索斯山时，那里受过教育的人非常少。一些人来到阿索斯山时，几乎不能读写，之后通过阅读教父们的著作而得到长进。然而，他们对世事知之甚少，却为整个世界祷告。那位长老不愿意仅仅为了一个初学修士的请求而停止祷告。这位长老处于何种境界之中，而当代智力发达的人又处于何种境界之中呢？如果我们比较属灵状态的层次，那么比较的结果会偏向谁呢？他们较少受今世事件的影响，不了解现代科学、技术等方面的成就，但他们的灵居于永恒之中，他们的祷告是为着永恒的救恩。如果当代知识分子的心智甚至连片刻或数分钟都无法在永恒中持守，那么谁是生活在更高境界中的人呢？
  - type: paragraph
    text:
      ru: 'Что есть состояние духа человеческого, который живет всего Адама естественным образом, призывая постоянно Имя: «Господи, Иисусе Христе, Сыне Божий, помилуй мя грешнаго»? – Такая личная молитва выливается в молитву космической силы, как мы видим на примере прп.Серафима Саровского. И теперь мы живем в мире несравненно более богатом технически и образованном, но выше ли эта форма жизни? Так что если сравнить, то в конечном итоге мы должны признать, что древние отцы наши стояли выше нас не только в области умной молитвы, но и в общем состоянии духа. Через призывание имени Христа мы вводимся в этот мир страдающий, и это есть великое дело.'
      cn: 人之精神状态为何，他以全然亚当式的本性而活，持续不断地呼求圣名：「上主，耶稣基督，上帝之子，怜悯我这罪人吧」？——如此的个人祷告汇聚成一种宇宙性的力量祷告，正如我们从萨罗夫的圣塞拉芬长老的榜样中所见。而今我们生活在一个在技术上和教育上都无比富足的世界，但这种生命形式是否更高级呢？因此，如果加以比较，那么最终我们必须承认，我们的古代教父们超越了我们，不仅在心祷的领域，而且在整体的精神状态上。藉着呼求基督的圣名，我们被引入这个受苦的世界，而这是一件伟大的事。
  - type: paragraph
    text:
      ru: 'Итак, помните: мы должны построить свое спасение в иных условиях, и мы строим его, как нам кажется, разумно, а не легкомысленно.'
      cn: 那么，请记住：我们必须在不同的条件下构建自己的救赎，并且在我们看来，我们是理智地而非轻率地构建它。
  - type: paragraph
    text:
      ru: 'На смерть одного поэта другой поэт русский писал в XIX веке: «...но не найдет отзыва тот глагол, что страстное земное перешел»[178]. Мы живем в мире удивительно образованном, но в сфере духа люди слишком далеки от того состояния, в котором они должны были бы быть. Чтобы понять состояние безмолвного старика, который молится за весь мир, надо жить это состояние. Для интеллектуального человека представляется богатством большая осведомленность о событиях, о достижениях научных и т. д. при страшно низкой культуре сердца. Господь говорит, что оскудеет«любовь»в последнее время (см.Мф.24:12). И мы не видим, чтобы мир богател бы любовью. «Наоборот, – говорит Он, – умножитсяскорбьи страдание» (ср.Мф.24:21). Итак, когда вы вступаете в эту монашескую жизнь с большим терпением и смирением, помните, что вы входите в страдания Самого Христа Бога нашего в Гефсиманском саду. И те, которые не живут эту молитву, которые не рыдают глубоким плачем в молитве за весь мир, нас считают сумасшедшими: для них это безумие.'
      cn: 在十九世纪，另一位俄国诗人在一位诗人逝世之际写道：「……但那越过地上激情的话语，将不会得到回应」[178]。我们生活在一个教育程度惊人的世界里，但在精神领域，人们离他们本应达到的状态太过遥远了。要理解那位为整个世界祈祷的寂静老人的状态，就必须亲身活出这种状态。对于一个知识分子来说，丰富的时事知识、科学成就等等，被视为财富，却伴随着极其低下的心之教养。主说，在末世，「爱」将日渐冷淡（参 马太福音 24:12）。我们也没有看到世界因爱而富足起来。「相反，」祂说，「悲伤和苦难将增多」（参 马太福音 24:21）。因此，当你们带着极大的忍耐和谦卑进入这修道生活时，你们要记住，你们正进入在客西马尼园里我们主基督上帝的受苦。那些不活出这种祈祷的人，那些不在为整个世界祈祷时深切哭泣的人，把我们视为疯子：对他们而言，这是疯狂。
  - type: paragraph
    text:
      ru: Итак, окружающий нас мир сделал колоссальный прогресс в смысле техническом, но не в культуре сердца в христианском смысле – сердца, открытого для страданий всего человечества, и во времени и в пространстве.
      cn: 因此，我们周围的世界在技术层面上取得了巨大的进步，但在基督教意义上的心灵文化上却没有——一个向全人类的苦难敞开的心，无论在时间上还是在空间上。
  - type: paragraph
    text:
      ru: 'Те догматические и теоретические формулы, которые мы употребляем в нашем разговоре, нужны для осознания разумного конца нашего подвига. Кто-нибудь, действительно мудрый, может сказать мне: «Отче, вы безумный человек! Новоначальным вы говорите о таких вещах. Этот«Огонь»принес Господь с небес (см.Лк.12:49), и когда Он пришел на Землю, то единственно Он был носителем этого Духа. Как вы новоначальным монахам говорите об этом?!» Да, я знаю, что это немножко безумно – говорить об этих состояниях новоначальным. В первые дни христианства, когда были так свежи слова Христа, апостол Павел сказал, что «Он, Христос, вошелза завесу» Восьмого дня и там, где Он, должен быть наш ум (см.Евр.6:19). Так что вы видите, и апостол Павел делает ту же «ошибку», что я: он говорит новоначальным людям и называет «молоком» то, что, по существу говоря, мы переживаем, как огонь небесный.'
      cn: 我们在交谈中使用的那些教义性和理论性的规范，是为了帮助我们领悟我们苦修的合理终点。某个真正有智慧的人可能会对我说：「神父，您是个疯子！您竟然对初学者讲论这样的事。这『火焰』是主从天上带来的（参见路加福音 12:49），当祂降临到地上时，唯独祂是这圣灵的承载者。您怎么能对初学修士讲论这些呢？！」是的，我知道对初学者讲论这些状态，确实有些疯狂。在基督教初期，当基督的言语如此鲜活时，使徒保罗曾说，「祂，基督，在第八日进入幔内」，在祂所在之处，我们的心思意念也当在那里（参见希伯来书 6:19）。所以您看，使徒保罗也犯了我同样的「错误」：他对初学者们讲论，并称之为「奶」，而那些事物，实质上我们体验为天上火焰。
  - type: paragraph
    text:
      ru: Но все равно будем молиться за весь страждущий мир, готовые и сами переживать эти страдания. Молитесь за меня тоже... Думайте и о том, в каких духовных сферах должен вращаться наш ум.
      cn: 但无论如何，我们仍要为这整个受苦的世界祈祷，并准备好自己也去经历这些苦难。你们也要为我祈祷... 你们也要思想，我们的心思意念当在何种属灵领域中萦绕。
  - type: paragraph
    text:
      ru: Так вы, дорогие мои братья и сестры, держите крепко эту линию молитвы. Помните всегда Христа, Который в свое время один восходил на Голгофу, неся всю скорбь всего мира.
      cn: 那么，我亲爱的弟兄姐妹们，你们要紧紧持守这条祷告的路线。永远记住基督，祂曾独自登上各各他，背负着全世界的苦难。
- type: heading1
  text:
    ru: 'Беседа 28: О сыноположении[179]'
    cn: '讲论 28: 论嗣子名分[179]'
  children:
  - type: paragraph
    text:
      ru: 'Всякое место – во спасение. Смысл иконографии «Лествицы». «Ныне начах». О разных духовных возрастах в одном монастыре и трудностях. О предложенной молитве. Наш принцип – заповеди Христа. О сыноположении: «Твой есмь аз». О двух сокрушенных сердцах. О гонении на совершенство. Наш путь – сострадание и единство.'
      cn: '任何地方皆为救赎。

        《天梯》圣像画的意义。

        「我今已开始」。

        关于同一座修道院中不同的属灵年龄与所遇困难。

        关于建议的祷告。

        我们的原则——基督的诫命。

        关于嗣子名分：「我属祢」。

        关于两颗忧伤痛悔的心。

        关于对成全的逼迫。

        我们的道路——怜悯与合一。'
  - type: paragraph
    text:
      ru: Да будет имя Господне благословенно и прославлено во веки веков!
      cn: 愿上主的名受称颂，并被荣耀，直到永永远远！
  - type: paragraph
    text:
      ru: 'Снова я благодарю Бога, дающего мне возможность говорить с вами. В нашей свободе духовной самым лучшим сегодня будет говорить о том, что нам нужно и что нам может понадобиться в будущем. В каком-то смысле это чисто практические проблемы, стоящие пред нами, – проблема избрания места, где мы можем строить наше вечное спасение во свете Бога нашего. За это время я имел несколько встреч, одна из которых навела меня на мысль говорить с вами об очень важной проблеме: где и как нам спасаться?'
      cn: 我再次感谢上帝，祂赐予我与你们交谈的机会。在我们的属灵自由中，今天最好的就是谈论我们所需要的，以及我们未来可能需要的事物。在某种意义上，这些是摆在我们面前纯粹的实际问题——择地问题，即我们在我们上帝的光中，可以在哪里建立我们的永恒救恩。在这段时间里，我有几次会面，其中一次启发我与你们谈论一个非常重要的问题：我们该在哪里，以及如何获得救恩？
  - type: paragraph
    text:
      ru: 'Конечно, самое главное, чтобы то место, которое мы избрали или куда нас «пихнули», было бы именно тем, которое соответствует нашим желаниям и нашей потребности удобно строить свое спасение. Придя в какое бы то ни было место, мы можем оказаться в обстановке, которая во многих своих аспектах нам непонятна. Но если мы не понимаем, то это совсем не значит, что место, которое нам дал Бог, не соответствует нам. Ибо в самом начале нашей жизни мы никак не можем надеяться на свое собственное рассуждение. И если мы не способны в самом начале разобраться, то надо с плачем упасть пред Богом и сказать: «Ты меня наставь на землю праву, где я смогу строить мое спасение». И Господь всякое место может устроить так, что оно будет ко спасению. Так препобеждаем мы в самом начале наши колебания. Но когда жизнь наша прогрессирует во всех планах, тогда встает очень серьезный вопрос: насколько далеко позволено пойти в духовном преуспеянии именно в данном месте? – Одной из вечных книг для монашества нашего является «Лествица» святого Иоанна Синайского. В иконографии есть изображения, где Господь протягивает руку достигшему высшей степени, последней ступеньки лестницы. На других иконах той же «Лествицы» мы не видим того, чтобы наша рука была уже в руке Христа Спасителя, как спасенных. Есть в этом какая-то сдержанность – невозможно человеку-монаху достигнуть этой степени совершенства. И, практически говоря, если мы обойдем все монастыри земли, мы увидим разные степени дерзновений у «водящих» – игуменов. Где границы дерзновения? На самом деле этих границ нет, но в этом безграничном океане иногда ставятся какие-то ограничения.'
      cn: 当然，最重要的是，我们所选择的，或被「推」到（的）地方，恰好就是那个符合我们的愿望和需要，以便利我们建立救恩。无论来到什么地方，我们都可能发现自己处于一种境况中，在许多方面对我们来说是不可理解的。但是，如果我们不理解，这绝不意味着上帝赐予我们的地方不适合我们。因为在我们生命的最初，我们绝不能指望依靠自己的判断。那么，如果我们一开始无法理清思绪，就必须带着哭泣俯伏在上帝面前说：「祢引导我走上正直的土地，在那里我能建立我的救恩。」而上主能安排每一个地方，使之有助于救恩。这样，我们就在一开始战胜了我们的动摇。但是，当我们的生命在各个方面都有所进展时，就会出现一个非常严肃的问题：在这个特定的地方，在灵性进步上，我们被允许走多远呢？——对于我们的修道生活而言，其中一本永恒的著作是圣约翰·西奈山的《天梯》。在圣像画中，有一些描绘，上主伸出手，伸向那些达到最高阶、天梯最后一级的人。在同一部《天梯》的其他圣像画中，我们没有看到我们的手已经握在救主基督手中，如同得救者一样。这里面包含着某种克制——修道者不可能达到这种程度的完美。实际上，如果我们走遍世上所有的修道院，我们会看到「引导者」——修道院院长——有不同程度的胆量。胆量的界限在哪里？实际上，这些界限并不存在，但在这无边的海洋中，有时会设置一些限制。
  - type: paragraph
    text:
      ru: 'Я говорю сегодня об этом вовсе не потому, что кто-либо из вас носит в себе сомнение: ошиблись ли они в выборе места. Нет, но хочу, чтоб у вас, которые соприкасаетесь со многими приходящими сюда людьми, были возможности опереться на какие-то принципы и дать нужный ответ. Вы заметили с самого начала, что наш принцип – все время держать в уме своем:«Ныне начах»– только теперь я начинаю жить по заповедям Христа (см.Пс.76:11), делая первые шаги по духовным ступеням, указанным нам в Евангелии Самим Христом. И здесь возникает необходимость уяснить, где нам позволено остановиться или докуда нам позволено идти.'
      cn: 我今天谈论此事，绝不是因为你们中有人心存疑惑：他们是否选错了地方。不，我只是希望，你们这些与许多来到这里的人接触的人，能够依凭一些原则，并给出恰当的回答。你们从一开始就注意到，我们的原则是始终铭记在心：「我今开始」——唯独现在我才开始按照基督的诫命生活（参 诗篇 76:11），在属灵的阶梯上迈出第一步，这阶梯是基督亲身在福音中向我们指明的。于是这里就有必要澄清，我们获准停留在何处，或者我们获准走到何方。
  - type: paragraph
    text:
      ru: 'Как обычно, я все строю на основании своей жизненной практики. В конце первой части книги о блаженном Силуане я говорю о моей встрече с отцом Трофимом. Он много лет неизменно нес послушание на огороде. Он был большой любитель покаянного плача и жил свято. Но в беседе, приводимой в книге, я говорю:'
      cn: 像往常一样，我所构筑的一切都建立在我的生活实践之上。在讲述真福圣西卢安的该书第一部分的末尾，我谈到了我与特罗菲姆神父的相遇。他多年来始终如一地履行着在菜园里的顺服义务。他是一个极爱忏悔之哭的人，并过着圣洁的生活。但在那段书中所引述的对话中，我说：
  - type: paragraph
    text:
      ru: – Отец Трофим, что же Вы не заметили за полвека жизни с Силуаном, где[180]он был, что он знал, как любил его Господь?
      cn: – 图罗菲姆神父，在与西路按共同生活的半个世纪里，您难道就没有注意到他曾身在何处[180]，他知晓什么，上主是如何爱他的吗？
  - type: paragraph
    text:
      ru: 'Сам отец Трофим с осторожностью относился ко всяким видениям и всему, что превосходит меру человека кающегося, живущего еще в борьбе с грехом, еще не победившего своих страстей... И вот, он мне говорит:'
      cn: 托菲姆神父本人对各种异象以及一切超越悔罪者（即仍在与罪恶搏斗、尚未战胜其情欲之人）限度的事物都怀有谨慎态度…… 于是，他这样对我说：
  - type: paragraph
    text:
      ru: – При жизни я любил отца Силуана.
      cn: – 生前我爱长老圣西卢安。
  - type: paragraph
    text:
      ru: 'Разговор был после того, как он прочитал записки Силуана, которые я дал ему и читая которые он вынес впечатление, что Силуан достиг меры великих Отцов. Тогда я спрашиваю:'
      cn: 这次谈话发生在他读完我给他的西鲁安的札记之后，他阅读这些札记后，得出印象，认为西鲁安已达到了伟大教父的身量。于是我问：
  - type: paragraph
    text:
      ru: – И как Вы остановились на таком решении?
      cn: ——那么，您是如何做出这样一个决定的呢？
  - type: paragraph
    text:
      ru: – Смерть его меня убедила в этом.
      cn: ——他的死亡使我确信了这一点。
  - type: paragraph
    text:
      ru: 'Я говорю:'
      cn: 我说：
  - type: paragraph
    text:
      ru: – Полвека жизни Вам недостаточно было, чтобы узнать его, и только смерть показала Вам, что сей муж достиг совершенства?[181]
      cn: ——半个世纪的生命，难道还不足以让您认识他，而唯有死亡才向您显明这位男子达到了完美境界吗？[181]
  - type: paragraph
    text:
      ru: 'Итак, по какому-то непостижимому для меня Промыслу меня толкнуло как бы сильным ветром в монастырь святого Пантелеимона, и там я положил начало своему монашеству. Я узнал Силуана после того, как ему стал известен мой ответ отцу Владимиру на вопрос «Как спасаться?». – «Стой на грани отчаяния, а когда невмоготу, выпей чашку чая». Это слово моего отчаяния убедило Силуана, что мне можно говорить о том, о чем с другими отцами не удавалось. То есть даже отец Трофим – один из лучших отцов, блаженный и, конечно, спасенный, – был прав, когда не хотел выходить за границы покаяния. И большего он не мог понести, и большего он не мог воспринять. Тот уровень, на котором жил блаженный Силуан, или тот горний хребет, по которому он шествовал, служа Богу, стоял много выше уровня, которого достиг отец Трофим при жизни своей на Земле. Так в одном и том же монастыре можно увидеть и высшие степени познания, возможного для человека; и «средние» меры святости (не совершенства, но все-таки святости); и даже – невежество. Пример тому отец Владимир, ученик отца Трофима, – у него, как сказал старец Силуан, было недостаточное понятие о том, что превосходит меру покаяния. И Силуан всю жизнь был как бы «придавленный» в своем монастыре. «Придавленный» – из-за черты, свойственной действительно людям бесстрастным: они подчиняются другим и не пытаются доминировать.'
      cn: 于是，出于我所无法领悟的某个神圣的天意，我仿佛被一阵强风推入了圣潘捷列伊蒙修道院，并在那里开启了我的修道生涯。我认识了圣西卢安，是在他得知我对弗拉基米尔修士所提问题「如何得救？」的回答之后。——「站在绝望的边缘上，当你再也无法忍受时，就喝一杯茶。」我这绝望之言使圣西卢安确信，他可以向我讲述那些他无法与其他修士谈论的事情。也就是说，即便是特罗菲姆修士——他曾是最好的修士之一，蒙福的，并且无疑已得救的——他不愿超越忏悔的界限是正确的。他无法承受更多，也无法领受更多。蒙福的圣西卢安所处的境界，或者说，他侍奉上帝时所行走的那个属天的山脊，远高于特罗菲姆修士在世时所达到的境界。因此，在同一个修道院里，人们可以看到人类所能达到的最高认识境界；以及「中等」程度的圣洁（虽非完美，却依然是圣洁）；甚至还有——无知。弗拉基米尔修士就是一例，他是特罗菲姆修士的门徒——正如圣西卢安老修士所言，他对于超越忏悔界限的事物理解不足。圣西卢安在他所在的修道院里，一生仿佛都「被压抑着」。这种「被压抑」是由于真正无情欲之人所固有的特质：他们顺从他人，不寻求掌控。
  - type: paragraph
    text:
      ru: 'Игумен в своей заботе имеет лиц самого разного духовного возраста. С каждым возрастом он считается: как надо действовать, что можно ожидать, что можно потребовать от человека, врученного ему Божиим Промыслом. Ибо в монастыре должна быть возможность жить для людей всех духовных возрастов: от начала до конца.'
      cn: 院长在他所关怀的人群中，有着各式各样属灵年龄的人。他会根据每个属灵年龄段的人，斟酌应如何行事，可以期待什么，以及可以向借由上帝护理交托给他的人提出什么要求。因为在修道院里，应该能够让所有属灵年龄的人，从开始到结束都能生活。
  - type: paragraph
    text:
      ru: Многое встречал я за свою жизнь и на Афоне, и вне Афона. Помните эту икону восхождения грешных людей к Богу? На ней иконографически изображено, как монах достиг ее вершины и рука Господня объемлет его руку, означая, что он «спасен», «достиг совершенства». И эти слова, которые превзошли уровень страстей греховных, для людей непонятны. «Как это такое, зачем?» Люди не выдерживают этого. И можно найти много монастырей, где ставится барьер духовным восхождениям из-за несовершенств руководства игуменского. Если мы в своем сердце допустим мысль, что нам закрыты двери к совершенству, то тогда действительно для многих будет невозможным не погибнуть под тяжестью отчаяния.
      cn: 我一生中经历过许多事，无论是在阿索斯山，还是在阿索斯山之外。你们记得那幅描绘罪人升向上帝的圣像吗？圣像上以图像方式描绘着，一位修士如何达到了它的顶峰，并且上主的手环抱着他的手，象征着他「已得拯救」，「已臻至善」。而这些超越了罪恶情欲层面的话语，对世人而言是难以理解的。「这是怎么回事，为何如此？」人们无法承受。我们可以发现许多修道院，在其中，精神上的提升会遇到阻碍，原因在于院长领导层的不足。如果我们心中容许这样的想法，认为通向圆满的门已向我们关闭，那么对于许多人来说，确实不可能不在绝望的重压下沉沦。
  - type: paragraph
    text:
      ru: Итак, драгоценные мои братья и сестры, ту молитву, которую я предложил вам[182], богословскую, читайте со всем вашим сердцем, с горячей верою. И тогда вы увидите, что раскрываются двери, которые раньше были закрыты. Вам откроются пути, которые были загромождены препятствиями. Наше положение замечательно тем, что в данных нам условиях мы можем, действительно, строить нашу жизнь, наше спасение, имея такого наставника, как блаженный Силуан.
      cn: 那么，我亲爱的弟兄姐妹们，你们要全心全意、怀着火热的信心去诵读那个我向你们提出的[182]神学祷告。那时你们就会看到，曾经紧闭的门会敞开。曾被障碍物堵塞的道路会向你们敞开。我们的境况之所以奇妙，是因为在赐予我们的条件下，我们确实能够建立我们的生命和救赎，并且拥有一位像真福西卢安那样的导师。
  - type: paragraph
    text:
      ru: 'Монах Ювеналий, о котором я говорил в книге «Видеть Бога»[183], как-то сказал: «Я люблю читать жития святых, как люди из грешных вдруг становятся вечно блаженными, получают дар сыноположения, становятся святыми великими». Так и мы – каждый из нас может сказать: «Грешный я человек, я еще далеко не достиг совершенства, но я буду стараться сделать это в данном мне месте». Я так говорю, не потому что будто бы кто-то из вас колеблется. Нет! Но это есть вечная боязнь за наше спасение: где мы должны быть, как мы можем совершить этот путь?'
      cn: 尤维纳利修士，我曾在《看见上帝》一书[183]中提到过他，有一次说道：「我喜欢阅读圣徒的生平，看罪人如何突然间变得永远蒙福，领受得着嗣子名分的恩赐，成为伟大的圣徒。」我们也是如此——我们每个人都可以说：「我是一个罪人，我还远远没有达到完善，但我会努力在我所处之地做到这一点。」我这样说，并非因为你们中间仿佛有人动摇。不！但这却是对我们救恩的永恒恐惧：我们应该在哪里，我们如何能走完这条道路？
  - type: paragraph
    text:
      ru: 'Наш принцип такой: сохранить евангельские заповеди Христа – это значит победить греховные страсти и достигнуть Божественного бесстрастия. В чем была трудность блаженного Силуана, к ногам которого допустил меня Господь? – Он почитал и действенно уважал каждого человека, но до конца о Боге говорить он не мог, хотя жаждала душа его говорить «о том, о чем знают все небеса», как он пишет в своих записках[184].'
      cn: 我们的原则是：遵守基督的福音诫命，就是战胜罪恶的情欲，并达到神圣的无情欲境地。蒙福者圣西卢安的难处何在，上主曾容许我来到他的脚前？——他尊崇并切实尊重每一个人，但他无法完全谈论上帝，尽管他的灵魂渴望谈论「关于那诸天都知晓之事」，正如他在自己的札记中[184]所写。
  - type: paragraph
    text:
      ru: 'И когда мы стоим перед этими примерами, то возникает вопрос: где взять силу вдохновения, чтобы жить по-христиански? Каким образом, грешное и слабое существо, человек вдруг становится способным говорить о сыноположении?'
      cn: 当我们面对这些榜样时，便会产生一个问题：我们从何处获得那激发人心的力量，好能活出基督徒的生命呢？一个罪恶而软弱的受造物，一个人，如何能突然变得有能力谈论嗣子名分呢？
  - type: paragraph
    text:
      ru: 'В Псалтири есть такие слова:«Твой есмь аз, спаси мя»(Пс.118:94). Когда я произношу эти слова, то я раздвоен. Ибо, обращаясь к Богу:«Твой есмь аз», я говорю сам о себе самом; однако за этим выражением скрыта и другая мысль, недостаточно выраженная: «До тех пор, покамест Ты Сам, Боже, не скажешь: Да, ты – сынМой:(ср.Пс.2:7), я не могу быть уверенным в моих словах:«Твой есмь аз...»Только моих слов не хватает: нужно еще, чтобы Ты свидетельствовал и моей душе, и, если хочешь, кругом меня о том, что я – сын Твой».'
      cn: 诗篇中有这样的话语：「我是祢的，求祢拯救我」（诗篇 118:94）。当我我说出这些话语时，我心存矛盾。因为，当我向上帝说：「我是祢的」时，我是在谈论我自己；然而，在这句话语背后隐藏着另一个尚未充分表达的思想：「直到祢自己，我的上帝，说：是的，祢是我的儿子（参阅诗篇 2:7），我才能确信我所说的：『我是祢的……』」光凭我的话语是不够的：还需要祢对我的灵魂，并且，如果祢愿意，也在我周围，来见证我确实是祢的儿子。」
  - type: paragraph
    text:
      ru: 'Однажды я посетил одного старца, заведовавшего много лет Старым Руссиком[185], и провел у него в келье немало времени. Он мне поведал о своей жизни и рассказал об одном из видений. Он был болезненным ребенком и не мог нести трудов крестьянской жизни. И действительно, тяжела работа крестьянская. И вот однажды он говорит родителям:'
      cn: 有一次，我拜访了一位负责管理斯塔雷-鲁西克[185]多年的长老，并在他的小室里待了相当长的时间。他向我讲述了自己的生平，并讲述了他所见过的一个异象。他自幼体弱多病，无法承担农家生活的劳作。确实如此，农家劳作是艰辛的。于是有一天，他对父母说：
  - type: paragraph
    text:
      ru: – Отдайте меня в монастырь.
      cn: ——把我送进修道院。
  - type: paragraph
    text:
      ru: 'Они отвечают:'
      cn: 他们回答说：
  - type: paragraph
    text:
      ru: – Ну, голубчик, ты не годишься; в монастыре надо работать.
      cn: – 唉，孩子，你不适合；在修道院里得劳作。
  - type: paragraph
    text:
      ru: – Но все равно – отдайте меня.
      cn: – 但无论如何，把我交出去。
  - type: paragraph
    text:
      ru: 'И вот мать берет этого мальчика, подводит к иконе Божией Матери и говорит Ей: «Отныне Ты будь Мать ему: я не могу; я отдаю Тебе на заботу этого мальчика, сына моего». И после этой молитвы матери, когда она отдала своего сына Богородице, он уснул. И во сне видит большой зал, престол Царя в конце этого зала; и сидит Владыка Царь, и кругом стоят множество важных людей, приближенных к Царю. И туда его приводит Женщина, Которая была Божия Матерь, и оставляет его коленопреклоненным пред Царем. И Царь говорит одному из стоящих рядом: «Пойди, посмотри, что у него там, в узелке». Тот человек взял из рук этого мальчика узелок, развязывает его и говорит: «Здесь – два сердца сокрушенных». Тогда Царь встал со Своего трона, подошел к мальчику и говорит: «Итак, ты – сын Мой».'
      cn: 于是，母亲抱起这个孩子，领他到圣母圣像前，对她说道：「从今以后，祢作他的母亲吧：我无能为力；我将这个孩子，我的儿子，交托给祢照管。」在母亲的这次祷告之后，当她将自己的儿子交托给圣母之后，他睡着了。他在梦中看见一个大殿，殿堂的尽头是君王的宝座；君王主宰者坐在其上，周围站着许多重要的、亲近君王的人。有一位女子领他到那里，这位女子正是圣母，将他留在君王面前，让他跪下。君王对一位站在旁边的人说：「去，看看他包裹里有什么。」那人从这孩子手中接过包裹，解开，说道：「这里有两颗忧伤破碎的心。」于是，君王从祂的宝座上站起来，走向孩子，说道：「那么，你就是我的儿子了。」
  - type: paragraph
    text:
      ru: 'Вы представляете силу молитв и матери, и мальчика, и Самой Божией Матери?! Бог поднялся с престола и говорит: «Ты – сын Мой». Те, которые не пережили подобных вещей, не могут их понять. Прп.Иоанн Лествичникпишет, что если кому-нибудь не было дано пережить нечто Духом Святым, то он не может понять этого. С другими людьми, которые не достигли этой степени, но проводят подвижническую жизнь, бывает так, что, не достигая этих высот, они не принимают слов своих братьев и говорят: «Оставьте его: он в прелести». И то, что является даром Духа Святого, у этих благочестивых людей перетолковывается и превращается в болезненное состояние дурного качества.'
      cn: 你们能想象母亲和孩子，以及圣母本人的祷告的力量吗？！上帝从宝座上起身，说：「你是我儿子。」那些没有亲身经历过类似事情的人，无法理解它们。圣约翰·列斯维奇尼克写道，如果一个人没有被圣灵赐予去经历某事，那么他就无法理解。而另一些没有达到这种境界，但却过着苦修生活的人，他们的情况是，由于未曾达到这些高度，便不接受自己弟兄的话，反而说：「别管他了：他陷入了迷惑。」而那些本是圣灵恩赐的东西，在这些虔诚的人那里，却被曲解，并变成了一种恶劣的病态。
  - type: paragraph
    text:
      ru: 'Так, есть люди, которые достигли состояния, когда говорит Господь: «Да, ты сын Мой», и когда говорит человек:'
      cn: 是的，有些人已经达到了这样一种状态，以上主说：「是的，你是我的儿子」的时候，并且当人说：
  - type: paragraph
    text:
      ru: – Твой есмь аз, спаси мя!
      cn: – 我属祢，拯救我！
  - type: paragraph
    text:
      ru: – Да, ты Мой, – отвечает Бог.
      cn: – 是的，你是我的，– 上帝回答说。
  - type: paragraph
    text:
      ru: И тогда эти слова«Твой есмь аз», произнесенные молящимся, становятся уже фактом вечного бытия.
      cn: 于是，当祷告者说出「我是祢的」这些话语时，它们就已成为永恒存在的一个事实。
  - type: paragraph
    text:
      ru: 'Много можно было бы рассказать случаев, трогающих сердце. Но довольно этого: люди достигают сыноположения через Сына по Божеству, в безначальном Божестве. Прп.Иоанн Лествичникговорит, что три слова есть однозначащие: бесстрастие, любовь и сыноположение[186].'
      cn: 有许多感人肺腑的事例可以讲述。但这已然足矣：人通过圣子，按其神性，在无始之神性中达到嗣子的名分。尊者约翰·思梯子说，三个词语同义：离情绝欲、爱德和嗣子名分[186]。
  - type: paragraph
    text:
      ru: 'Итак, когда вы вращаетесь с людьми, живущими в Боге, это становится влекущею силою, так что и мы жаждем этого состояния. Но путь к этому действительно трудный и сложный. Нам нужны помощники, игумены, отцы духовные, которые бы помогали нам идти. Почему вдруг сказал Господь в известный момент: «Да, ты сын Мой»? Как может жить этот монах на земле? – Да очень просто и естественно! И когда это совершается в подлинном смысле, тогда нет ни театра, ни чего-то искусственного, а все просто и воистину вне греха.'
      cn: 那么，当你与活在上帝里的人来往时，这便成为一种牵引的力量，以至于我们也渴慕这种境况。但通往这境况的道路确实艰难而复杂。我们需要帮助者，需要院长，需要属灵父亲，他们会帮助我们前行。为何上主在某个时刻忽然说：「是的，你是我的儿子」？这位修士如何在地上生活呢？——哦，非常简单而自然！当这在真实的意义上成就时，那时就没有矫揉造作，也没有任何虚假伪饰，而一切都只是简单而真实地远离罪恶。
  - type: paragraph
    text:
      ru: Итак, мы, маленькое братство здесь, можем и должны использовать этот дар Божий и жить так, чтобы Господь принял нас как Своих детей. Говорить об этом предмете невероятно трудно, потому что во многих местах читают святых отцов без разумения и запрещают думать о сыноположении. Однако пример живой сыноположения –Серафим Саровский. В меньшей степени и в совсем другой форме внешне это было и с Силуаном, которому было дано с самого начала увидеть Господа; но никто не мог поверить ему, и он жил, скрывая сие почти полвека.
      cn: 那么，我们这儿的小兄弟团能够并且应当使用上帝的这份恩赐，并如此生活，好使上主接纳我们为祂的子女。谈论此事极其困难，因为在许多地方，人们阅读圣教父的著作却缺乏理解，并禁止思考蒙受上帝收纳为子女的身份。然而，蒙受上帝收纳为子女的活生生典范是萨罗夫的圣塞拉芬。程度较轻，且外在形式完全不同的是圣西卢安，他从一开始就被赐予看见上主的恩典；但没有人能相信他，他因此隐藏此事将近半个世纪。
  - type: paragraph
    text:
      ru: Сегодня моя беседа, может быть, кажется вам банальной, но на самом деле все-таки слова, которые были даны нам сегодня, нужно принимать нам всем во внимание. Все мы будем бороться за то, чтобы достигнуть во исполнение заповедей Христа. Та молитва, которую я предложил вам, имеет целью соделать богословие нашим состоянием, сделать каждого из нас «со-трудником» с Самим Богом Вечным, «сотрудником» во спасение людей.
      cn: 今天我的谈话，也许在你们看来是陈腐的，但实际上今天赐予我们的话语，我们所有人都需要加以留意。我们所有人，都将为之努力争战，以求遵行基督的诫命。我向你们提出的那篇祷告，旨在使神学成为我们的景况，使我们每个人都成为与永恒的上帝本身「同工」之人，成为在拯救世人上的「同工」。
  - type: paragraph
    text:
      ru: 'В Пантелеимоновском монастыре был один старый монах очень низкого роста. И он сорок лет и утром и вечером работал на кухне, торжествуя: он готовит пищу для возлюбленных Самим Богом людей. Видите, как возможно ум свой поставить в такое расположение, когда самые обычные дела становятся вечными заслугами человека. Каждому из вас наш добрый игумен старается дать то, что наиболее приемлемо, и тем облегчить нашу трудную жизнь. Здесь наша жизнь тяжелее, чем на Афоне. И так, когда вы здесь бываете раздавлены большою скорбью, эта скорбь не только в вас самих: она есть следствие благодати Божией как со-страдание людям, всему миру. И если мы действительно будем бороться за единство, о котором Сам Христос молился Отцу Своему, то мы окажемся сотрудниками Самого Бога. Какое дело нам поручено – это неважно: варить ли пищу на кухне, петь ли гимны Божественные на клиросе, или, наконец, облеченным священным саном служить Литургию – Божественное Таинство Превращения хлеба и вина в Тело и Кровь Самого Бога.'
      cn: 在潘捷列伊蒙修道院里，有一位身材非常矮小的年老修士。他早晚在厨房里工作了四十年，满怀得胜的喜悦：因为他为蒙上帝亲自眷爱的人们预备食物。你们看，这如何可能将自己的心智置于这样一种状态，以至于最寻常的事务都能成为人永恒的功绩。我们善良的院长努力为你们每个人提供最适宜的，从而减轻我们艰难的生活。在这里，我们的生活比在阿索斯山更为艰苦。所以，当你们在这里被巨大的悲痛压倒时，这悲痛不只在你们自身之内：它乃是上帝恩典的果效，作为对人类、对整个世界的同情。并且如果我们真正为基督亲自向祂的父所祈祷的合一而奋斗，那么我们就会成为上帝亲自的同工。无论我们被托付何种事务，这都不重要：无论是在厨房里烹煮食物，无论是在唱诗班席上咏唱神圣的圣诗，或者，最终，是身披圣职服侍圣礼——这神圣的圣事，即饼和酒转化为上帝亲自的圣体和宝血。
  - type: paragraph
    text:
      ru: 'Итак, помните, как того бедного мальчика Господь поднял со словами: «Ты сын Мой». Если мы удержим правильную мысль, унаследованную к нашему спасению у отца Силуана, то, где бы мы ни были, куда бы мы ни пошли, где бы мы ни работали, – все равно мы войдем в атмосферу «Божественного страдания» Христа. Бог бесстрастный, и вместе с тем любовь Божественная в этом мире всегда страждущая. И когда у вас бывают скорби, когда к вам обращается кто-нибудь со своей нуждой, отдайте все лучшее, что есть в душе вашей, каждому человеку, и тогда вы обрящете покой и своей душе.'
      cn: 那么，请记住，主是如何扶起那个贫困的男孩，并对他说：「你是我的儿子。」如果我们持守着那为了我们的救赎而从圣西卢安神父那里继承下来的正确思想，那么，无论我们身在何处，无论我们去往何方，无论我们从事何种工作——我们都必然会进入基督「神圣受苦」的氛围之中。上帝是无受苦的，然而与此同时，在这世上的神圣之爱却总是受苦的。每当你们遭遇忧伤，当有人带着他们的需要向你们求助时，就将你们灵魂中所有最美好的，给予每一个人，那么你们的灵魂也将寻得安宁。
  - type: paragraph
    text:
      ru: И на сей раз простите меня и благословите меня, и да хранит вас Господь...
      cn: 这一次也赦免我，并祝福我，愿上帝保守你们……
- type: heading1
  text:
    ru: 'Беседа 29: От этики к онтологии[187]'
    cn: 第二十九讲：从伦理学到本体论[187]
  children:
  - type: paragraph
    text:
      ru: '«Покайтесь!»: от этики к онтологии. Евангельский пример богатого юноши. О разных уровнях: Мария и Марфа. О вопросе персоны. «У великого Бога проси только великое». О страданиях Адама: Христос как ответ на них. О понимании «языка» Христа через следование Ему. Через терпение дается ощущение бытия. О сыноположении: «Твой есмь аз».'
      cn: '«悔改吧！»：从伦理到存有论。

        福音中富有的少年人的例子。

        关于不同的层次：马利亚和马大。

        关于位格问题。

        「在伟大的上帝那里，只当求伟大的事物。」

        关于亚当的苦难：基督是它们的答案。

        关于通过跟随基督来理解基督的「语言」。

        借着忍耐才能获得对存有的感受。

        关于儿女的名分：「我属于祢」。'
  - type: paragraph
    text:
      ru: Да будет благословен час сей, который дает нам благий наш Господь. В мире и спокойствии мы можем говорить об отдельных пунктах нашего долгого пути.
      cn: 愿这时刻蒙受祝福，是我们的良善上帝所赐予的。在平安与宁静之中，我们得以谈论我们漫长旅程中的个别要点。
  - type: paragraph
    text:
      ru: Чуден наш путь – он превосходит наш ум; и изнемогает дух наш следовать за«примером» Христа (ср.Ин.13:15), Бога нашего, «принесшегона землю огонь»любви Отчей (см.Лк.12:49).
      cn: 我们的道路何等奇妙——它超越我们的理智；我们的灵性力不从心，难以效法我们的上帝基督的「榜样」（参阅约翰福音 13:15），祂曾「将火带到地上」（见路加福音 12:49），这火乃是天父之爱。
  - type: paragraph
    text:
      ru: Сегодня я остановлюсь на вопросе покаяния и сыноположения. Несмотря на то что в своих предельных формах эти состояния убегают от всякого человеческого слова, мы все-таки будем «безумствовать» и будем говорить, по силе нашей, о вещах, которые беспредельно, неизъяснимо велики и грандиозны.
      cn: 今天我将着重探讨悔改和嗣子名分的问题。尽管这些境况在其极致形式中超越一切人类言语所能表达，我们仍将『妄言』，尽我们所能地论述那些无限、无法言喻地伟大而宏伟的事物。
  - type: paragraph
    text:
      ru: Сколько раз уже повторялось, что мы начинаем наше путешествие с маленького шага покаяния. Конец же этого пути, по нашим понятиям, естьобожениечеловека. Когда мы дерзаем говорить о таких вещах, многие боящиеся люди стесняются и стыдятся. Но если бы они знали, каким страхом полна наша душа ошибиться в каком бы то ни было слове, касающемся святейшей всех и вся – Любви Отчей!
      cn: 已被反复提及多少次了，我们是带着悔改的小小一步开始我们的旅程的。然而这旅程的终点，按照我们的理解，是人的成神。当我们敢于谈及此类事物时，许多心怀畏惧的人会感到局促不安和羞耻。但如果他们知道，我们的灵魂满溢着何等深切的恐惧，唯恐在任何一个词语上犯错，因它关乎那超越一切、至圣的天父之爱！
  - type: paragraph
    text:
      ru: Но как подойти к этой теме? – Итак, отложив на время некоторые детали, мы будем говорить о существе дела.
      cn: 然而，该如何探讨此主题呢？——那么，暂且搁置某些细节，我们将谈论事情的实质。
  - type: paragraph
    text:
      ru: 'Начало проповеди Христа есть слово«покайтесь»(Мф.4:17). И когда мы рассматриваем его, то, как и в многих других словах Христа, находим очень много, я бы сказал, «уровней»; и мы еще должны найти язык для всего этого. И вот, я бы назвал два уровня покаяния: один – в пределах этики, другой – когда говорится уже не об этических вещах, а о самой вечности, то есть о Боге. Первое касается уровня человеческого творческого разума, и человек не может и не понимает даже, как возможно различить эти два вида покаяния. Первый я бы назвал «этическим актом», другой же – «переходом с одной орбиты на другую, вечную». Сейчас не будем пытаться объяснить, возможно или невозможно от временного перейти к вечному или от этического к онтологии.'
      cn: 基督讲道的开端是「悔改」一词（马太福音 4:17）。当我们审视它时，就像在基督的许多其他话语中一样，我们发现其中有非常多，我称之为「层面」；而我们还需要为这一切找到一种语言。于是，我愿称之为悔改的两个层面：一个是在伦理的范畴内，另一个则是不再涉及伦理事物，而是关于永恒本身，即关于上帝。第一个关乎人类创造性理性的层面，而且人不能，甚至不理解如何可能区分这两种悔改。第一个我会称之为「伦理行为」，而另一个则是「从一个轨道转向另一个永恒的轨道」。现在我们不尝试解释，是否可能从暂时的转向永恒，或者从伦理转向本体论。
  - type: paragraph
    text:
      ru: 'Пример глубокого и красивого акта покаяния можно видеть в евангельском юноше, который жаждал Божественной вечности и спросил Христа, что должен он сделать, чтобы перейти от времени к вечному. Господь с любовью посмотрел на этого юношу и говорит:'
      cn: 在福音书中的少年身上，可以看到一个深刻而美好的悔改行为的例子，他渴望着神圣的永恒，并问基督他应该做什么才能从时间走向永恒。主慈爱地看着这个少年，说：
  - type: paragraph
    text:
      ru: – Сохрани заповеди...
      cn: – 谨守诫命……
  - type: paragraph
    text:
      ru: – Какие?
      cn: – 哪些？
  - type: paragraph
    text:
      ru: – Не убивай; не прелюбодействуй; не кради...
      cn: ——不可杀人；不可奸淫；不可偷盗……
  - type: paragraph
    text:
      ru: 'Отвечает юноша:'
      cn: 少年回答说：
  - type: paragraph
    text:
      ru: – От юности моей я сохранил это; чего еще не доделал?
      cn: – 自幼年起，我便保守了这；还有什么是我没有完成的呢？
  - type: paragraph
    text:
      ru: 'Тогда Господь говорит ему:'
      cn: 于是主对他说：
  - type: paragraph
    text:
      ru: – Если хочешь быть совершенным, то оставь все прочее, все твои имения, все твои знания и нищий следуй за Мною.
      cn: — 如果你想要成为完全的，那么撇下所有其他的一切，你的一切产业，你的一切知识，并且一无所有地跟随我。
  - type: paragraph
    text:
      ru: Не выдержал юноша (см.Мф.19:16–22).
      cn: 少年人未能承受（参 马太福音 19:16-22）。
  - type: paragraph
    text:
      ru: Из евангельского повествования мы видим, что этот юноша был благочестивый еврей того времени, когда свершилось ожидание человечеством Мессии. В нравственном смысле, этически, он стоял на высокой степени, но есть другая, большая, – которая относится уже к сфере Божественного, Нетварного и Изначального Бытия. Итак, этот пример показывает, что есть много разных градаций духовных состояний людей. И переход от временного к вечному кажется невозможным, как невозможен переход от числа к бесконечному в математике. Это две вещи несравнимые.
      cn: 从福音书的记述中我们看到，这位少年是一个虔诚的犹太人，正是在人类对默西亚的期盼得以成就的时期。在道德意义上，伦理上，他处于高尚的境地，但还有另一个，更高的境地——这已属于神圣的、非受造的和最初的存有之范畴。因此，这个例子表明，人的属灵状态有许多不同的层次。而从暂时的过渡到永恒的似乎是不可能的，就像在数学中，从有限的数过渡到无限是不可能的。这是两件无法比较的事物。
  - type: paragraph
    text:
      ru: 'Другой пример: были в Вифании две сестры – Марфа и Мария. Обеих любил Христос, и обе любили Христа и веровали, что это Он – Мессия. И вот, когда Он пришел к ним, Марфа заботилась о многих вещах, оказывая гостеприимство и занимаясь хозяйством, а Мария, когда приблизился к ней Носитель такого Духа, каким был Христос, села у ног Его в жажде слушать каждое Его слово. И что же? – Когда Марфа, перегруженная ежедневными работами и заботами и всеми неловкими вещами хозяйства, обратилась ко Христу и сказала:«СкажиМарии, чтобы онамне помогла», то Господь ответил с любовью:«Марфа, Марфа, ты заботишьсяс такою любовью сейчас о приеме, ноМариябольшую частьизбрала. Этачастьуженеотымется отнее»(см.Лк.10:38–42).'
      cn: 另一个例子是：在伯大尼有两姐妹——马大和马利亚。基督爱她们俩，她们俩也爱基督，并相信祂就是默西亚。当祂来到她们那里时，马大为许多事操心，招待客旅，料理家务；而马利亚，当那身负基督那般圣灵者靠近她时，则坐在祂的脚前，渴望聆听祂的每一句话。结果如何呢？——当马大被每日的工作、操劳以及所有不便的家务所重压时，便转向基督说：「请告诉马利亚，叫她来帮助我。」主便慈爱地回答说：「马大，马大，你现在如此爱心地为接待而操心，但马利亚选择了上好的福分。这福分是不能从她那里夺去的。」(参见路加福音 10:38-42)
  - type: paragraph
    text:
      ru: 'Видите, какая разница: план любви этической, или видимой, наших нормальных человеческих отношений, – похвальный, но еще не дающий нам вечности Божественной. А Господь говорит:«небо и земля прейдут,словеса жеМои не прейдут» (Мф.24:35).Читая эти слова Христа, мы невольно вспоминаем:В начале было Слово, и Слово было у Бога, и Слово было Бог»(Ин.1:1). Видите, как близко две сестры жили между собою, и вместе с тем какая огромная дистанция была в их жажде. Одна, Мария, готова принять в обстановке небрежности и повседневных недоглядок, и другая же показует всю свою любовь в каждом внешнем проявлении. Видите разницу уровней: один –«В начале бе Слово», и другой – любовь«всем сердцем и всемумом» (ср.Мф.22:37), но еще не выходящая за пределы возраста духовного, который мы назвали этическим. Так и в других немногих евангельских примерах находим мы глубочайшие мысли, идеи и проявления жизни, о которых, перейдя на иную терминологию, мы скажем, что это – «вторая ступень», это уже не этика, а онтология.'
      cn: 你们看，这是何等不同：伦理的，或者说可见的，我们正常人际关系中的爱之计划——固然值得称赞，但却未能赋予我们神圣的永恒。然而，主说：「天地要废去，我的话却不能废去。」（马太福音 24:35）诵读基督这些话语时，我们不禁回想起：「太初有道，道与上帝同在，道就是上帝。」（约翰福音 1:1）你们看，两姐妹彼此生活得多么亲近，而她们的渴慕之间却有着多么巨大的距离。其中一位，马利亚，准备好在被忽视和日常疏忽的环境中接受，而另一位则在每一个外在表现中展现出她全部的爱。你们看这层级的差异：其一，「太初有道」，而其二，是「尽心尽性」的爱（参 马太福音 22:37），但这种爱尚未超出我们称之为伦理的属灵阶段的范畴。同样，在其他一些福音书的例子中，我们也发现了极其深刻的思想、观念和生命表现，关于这些，如果我们转用另一种术语来说，我们会称之为「第二阶段」，它已不再是伦理学，而是本体论。
  - type: paragraph
    text:
      ru: 'Последнее время на Земле мы встречаемся с контрастным явлением: с попранием, самым невероятным по жестокости, всего человеческого, с одной стороны, и, с другой, – со стремлением постичь человеческую личность: что такое человек как персона, где ум персоны вращается.'
      cn: 最近一段时间在地上，我们遇到了一种对比鲜明的现象：一方面，是以最不可思议的残忍践踏一切人性的东西；另一方面，是力求领悟人的位格：人作为位格是什么，以及位格的心灵的焦点所在。
  - type: paragraph
    text:
      ru: Когда в нас начинает расти персональное начало, тогда, живя в любой тюрьме, мы уже выходим духом на безграничные пространства сотворенного Космоса. Человек уже не видит внешнего, а живет внутренним. И его созерцание беспредельных, бездонных пропастей нельзя определить никаким человеческим словом.
      cn: 当我们内在的个人性开始滋长时，那时，即便身陷任何监狱，我们的灵性也已超越，进入受造宇宙那无边无际的广阔空间。人便不再注视外在之物，而是活在内在之中。而他所默观的，那无边无际、深不可测的深渊，是任何人类言语都无法界定的。
  - type: paragraph
    text:
      ru: 'Что сказать о тех бездонностях, которые открываются человеку, погружающемуся в любовь Христову? Эти бездны абиссональные – какого характера и откуда они? внешние они или внутренние? – Мы не можем ни понять, ни определить этого, и только через покаяние онтологического порядка мы можем войти в этот мир. Но и тогда остается неведомым для человека: та беспредельность, которая открывается пред ним, – существует ли она «объективно», или это есть состояние нашего ума, созданного по образу Ума Творца, Самого Бога?'
      cn: 对于那些向沉浸于基督之爱中的人所敞开的深渊，我们该说些什么呢？这些无底深渊——它们具有何种性质，来自何处？它们是外在的，还是内在的？——我们既无法理解，也无法界定它；并且唯有通过本体论上的悔改，我们才能进入这个世界。但即便如此，对于人来说，这依然是未知的：呈现在他面前的那无限性，它是否「客观」存在，抑或这只是我们心智的一种状态——这心智是按造物主，即上帝本身的心智形象所造的？
  - type: paragraph
    text:
      ru: 'Сей Ум, сей Дух Господь назвал Отцом:«Бог есть Дух»(Ин.4:24). И вот мы спрашиваем себя: Сей Дух – как Он к нам прикоснется, не убив нас? В начале моей жизни на Афоне мой духовный отец сказал такие слова: «Смотри, не обращайся к Богу с малыми просьбами, но у великого Бога проси и ты только великое». Тогда получается контраст: человек, беднейший и ничего не имеющий, вдруг ощущает себя обладателем беспредельных богатств Бога во всем творчестве Его. Подход к этому происходит совершенно спокойно, в обычных житейских формах, а если есть возможность, то и физически человек освобождается от всего и живет только Сим Богом.'
      cn: 这个心智，这个灵，主称之为父：「上帝是灵」（约翰福音 4:24）。于是我们自问：这个灵——祂如何触及我们，而不杀死我们？我在阿陀斯山生活的初期，我的神父说了这样一番话：「听着，不要向上帝提出微小的请求，但要向伟大的上帝只求伟大的事。」于是便产生了一个对比：人，一个最贫乏且一无所有的人，突然间感受到自己拥有上帝无限的丰盛财富，在祂所有的创造之中。走向这一切的方式是完全平静的，以普通的日常生活形式。若有可能，甚至在身体上也从一切中解脱出来，并且只与这位上帝同在。
  - type: paragraph
    text:
      ru: 'Да, мы можем почувствовать, что этот мир создан Умом и Волею того Духа, Которого мы называем Богом и Богом-Отцом: «Создадимчеловека по образу Нашему [и] по подобию»(Быт.1:26). И трудно нам избрать пункт, откуда начать говорить об этой великой трагедии, которой мы все раздавлены. Страдания всего мира, тысячелетия – становится непонятным, как Бог мог сотворить такое, когда в страданиях дальше нельзя идти? В чем дело? Что совершил Адам? Мне хотелось бы говорить об этой великой трагедии, которая меня самого раздавливала уже тысячи раз. Как возможно терпеть такие страдания всех тысячелетий, пройденных с того момента, когда сказано:«Да будет свет»(Быт. 1, 3)? – В христианской этике нас поражает картина"Человека», одного"Человека»(ср.1Тим.2:5), восходящего на Голгофу, чтобы взять на Свои плечи всю тяготу проклятия Земли и бремя всех страстей. Итак, этически, мы не видим ничего более грандиозного, ничего более святого, чем Христос. Говорю об этом, потому что ум наш может воспринять реальность бытия Бога, но не знать еще, какого характера этот Дух великий.'
      cn: 是的，我们能够感受到这个世界是由我们称之为上帝和父上帝的那位圣灵的理智和意志所创造的：「我们要照着我们的形像，按着我们的样式造人」（创世记 1:26）。我们很难选择一个起点，来讲述这场我们所有人均被压垮的巨大悲剧。整个世界千年来的苦难，令人费解，上帝怎会创造出这样的世界？当苦难已至无法忍受的地步时，问题何在？亚当做了什么？我想谈谈这场巨大的悲剧，它已将我本人压垮了成千上万次。怎能忍受自那时起经历的数千年来如此深重的苦难，自从「要有光」（创世记 1:3）这句话被说出之时起？——在基督教伦理中，我们被这样一幅画面所震撼：一位「人」，一位独一的「人」（参阅 提摩太前书 2:5），登上各各他，将大地一切咒诅的重负和所有情欲的担子，都担在自己的肩上。因此，从伦理角度来看，我们看不出有比基督更伟大、更神圣的事物。我之所以这样说，是因为我们的心智可以感知上帝存在这一事实，但却可能尚不了解这位伟大圣灵的性情。
  - type: paragraph
    text:
      ru: 'В мои молодые годы пришлось мне читать слова Пушкина: «Кто меня враждебной властью из ничтожества воззвал?» Была мысль у поэта, что мир страдает, – и если страдает мир, то каков Он, Создатель этого мира? Но вот приходит Его Сын, чтобы говорить с тем человеком, который создан по образу Божию и по подобию; и мы созерцаем предвечную мысль Бога-Творца нашего о человеке. И если человек видит себя во Христе изначально таким благим, как Сам Бог, явившийся на Земле, то, конечно, если нам показано это Духом Святым, мы уже никуда не можем уйти от этого великого Акта Божественного бытия. Значит, не Создатель наш виноват в этих страданиях, а существо, подобное Ему потенциально, – человек, образ Бога-Абсолюта.'
      cn: 在我年轻的时候，我曾读到普希金的话：「是谁以仇敌的权能，将我从虚无中召来？」诗人有此思虑，认为世界在受苦——倘若世界受苦，那么这世界的创造者，祂究竟是怎样的呢？然而，祂的儿子来了，为要与那按照上帝的形象和样式被造之人对话；我们由此默观我们造物主上帝关于人类的永恒思想。倘若人在基督里，将自己视为本初即是如此良善，正如亲自降世的上帝那样，那么，当然，倘若这由圣灵向我们显明，我们便再也无法脱离这伟大的神圣存有之行动。这就意味着，这些苦难并非我们的创造者所致，而是那在潜能上与祂相似的存有——即人，上帝——绝对者的形象。
  - type: paragraph
    text:
      ru: 'И вот, Его мы имя призываем: «Господи Иисусе Христе, Сыне Отечь, вземляй грех мира, помилуй нас. Вземляй грехи мира, приими молитву нашу. СедяйодеснуюОтца, Ты един воистину Свят». И нет конца нашего преклонения пред Тем Образом, по Которому создан человек.'
      cn: 我们呼求祂的名：「主耶稣基督，父之子，除去世人罪孽的，怜悯我们。除去世人诸罪的，垂听我们的祈祷。坐于父右的，祢唯独是圣哉。」我们对那人被造所本的形像，崇敬永无止境。
  - type: paragraph
    text:
      ru: Итак, когда человек своим умом и сердцем возводится в Божественную сферу, то после все время ум его носится именно в этих сферах. И как можно уйти «оттуда»? Все превосходит наш ум, наши возможности, и ни одна попытка ума нашего не приводит к тому, чтобы достичь откровения о глубинах Самого Божества.
      cn: 所以，当人以其心智与心灵被提升至神圣境界时，此后，他的心智便时刻萦绕于这些境界之中。人又怎能「从那里」离开呢？一切都超越我们的心智，超越我们的能力，我们心智的任何尝试都无法达至关于上帝自身深奥的启示。
  - type: paragraph
    text:
      ru: Простите меня, дорогие мои. Мне уже мало времени осталось говорить вам, и потому я тороплюсь. Говоря вам, я вовсе не претендую на что-либо, кроме как передать вам биение сердца. Ибо дальше нам страшно говорить, потому что Господь призывает нас следовать за Ним. А Он куда идет? – В Гефсиманский сад, ночью, после этого на Голгофу.
      cn: 请原谅我，我亲爱的们。我所剩的对你们说话的时间已经不多了，因此我急切地想要说。我对你们说话时，我完全无意奢求什么，除了将我的心跳传递给你们。因为接下来我们害怕说下去，因为主呼召我们跟随祢。而祂要往哪里去呢？——往客西马尼园，在夜里，此后往各各他。
  - type: paragraph
    text:
      ru: 'Итак, становясь христианами и видя страдания всего мира, мы начинаем как-то понимать «язык» Христа. Апостолы Иоанн и Иаков попросили дать им сестьодеснуюи ошуюю Христа. И Христос сказал: «Аможете ливыпить чашу и креститься крещением, которым Якрещаюсь?» Они говорят:«Можем». Как Отец всех нас, Христос отвечает с любовью: «Да, выбудете пить чашуи примете крещение, которое принял Сам Я» (см.Мк.10:35–39). И мы, как дух, «пьем чашу и крещаемся, как Господь крестился». Как это мудро устроено в Церкви отцами: мы постепенно из мелких вещей вдруг возводимся в видение величия даже в мелочах. И это есть настоящий Человек, образ Бога. И за то, чтобы восстановить в себе сей омраченный грехом и низкими страстями образ, идет борьба наша – аскетическая борьба монахов. Тогда ум наш перерождается и видит вещи в ином порядке и в ином свете. Однако это совсем не значит, что он освободился от страстей...'
      cn: 于是，我们成为基督徒，目睹这世界的苦难，便开始某种程度上理解基督的「语言」。使徒约翰和雅各请求让他们坐在基督的右边和左边。基督便说：「你们能喝我所要喝的杯吗？能受我所受的洗礼吗？」他们说：「我们能。」基督，如同我们众人的父，满怀慈爱地回答：「是的，你们必喝我所喝的杯，也要受我所受的洗礼。」（参阅马可福音 10:35-39）我们作为灵魂，「喝那杯，并受上主所受的洗礼。」教父们在教会中如此智慧地安排：我们逐渐地从微小之事中，突然升华，甚至在微末之处也得见其伟大。这就是真正的「人」，上帝的肖像。而为了在我们自身中恢复这被罪恶和低级情欲所玷污的肖像，我们的斗争正在进行——隐修士们的苦修斗争。那时，我们的心智便会重生，并以不同的秩序和不同的光亮看待事物。然而，这完全不意味着它已摆脱了情欲……
  - type: paragraph
    text:
      ru: 'В настоящую эпоху внешний мир отходит от Христа, и это самый печальный, трагический, ужасный аспект событий нашего времени: потерять второй раз Христа, как потерял его Адам в раю, – как возможно?! Но будем терпеть маленькие трения в повседневной нашей жизни и как бы не видеть скольжений между нами к гневу, к неприязни, к чему бы то ни было, – потому что нужно видеть страдания человека, а не его дурные стороны. По существу, это «материал» для великого бытия, о котором мы не можем еще говорить. А начинается наш путь тем, чем кончаю я почти каждое слово: в самых мелочах пребывайте умом там, где Господь,«за завесою»(см.Евр.9:3) Восьмого дня, – пребывайте умом там, а телом жить приучайтесь в этих условиях. Дух человека поставлен в них для того, чтобы начать ощущать бытие. И Господь с нами часто обращается, как будто бы Он даже не понимает нашей немощи. И нельзя было бы потерпеть такого мира, если Христос – не Бог. А если Бог, то тогда«все возможно»(Мк.9:23). И мы Сему Отцу нашему при всех страданиях говорим: «Слава Тебе, Богу вышнему, слава Тебе во веки веков».'
      cn: 在这个时代，外在的世界离弃基督，而这是我们时代事件中最悲哀、最悲惨、最可怕的一个方面：第二次失去基督，就像亚当在乐园中失去祂一样——这怎么可能呢？！但我们要忍受日常生活中细微的摩擦，并且要做到仿佛看不见我们彼此之间在愤怒、厌恶或任何事物上的滑落——因为需要看到人的苦难，而不是他的恶劣一面。实质上，这是那伟大存有的「素材」，我们尚不能谈论它。而我们的道路始于我几乎每句话的结尾：在最微小之处，你们的心思意念要停留在上主所在之处，「幔子后面」（参见希伯来书 9:3）的第八日——你们的心思意念要停留在那里，而身体则要习惯在这些环境中生活。人的灵被置于其中，是为了开始感受存有。而上主常常与我们相处，仿佛祂甚至不明白我们的软弱。倘若基督不是上帝，那么这样的世界是无法忍受的。但如果祂是上帝，那么「凡事都可能」（马可福音 9:23）。而我们，在这所有的苦难中，对我们的圣父说：「荣耀归于祢，至高之上帝，荣耀归于祢，直到永永远远。」
  - type: paragraph
    text:
      ru: 'Когда Израиль получил сыноположение? – Когда мы молимся Богу, то, по завету духовника афонского, не будем обращаться к Богу с малыми просьбами, но у Великого Бога будем просить только великое. Однако надо разделять эти два момента: где кончается этический мир и где начинается Божественная онтология.'
      cn: 以色列何时获得了作儿女的名分？——当我们向上帝祷告时，要按照一位阿索斯山神师的教诲，不要向上帝提出微小的祈求，而要只向伟大的上帝祈求伟大的事。然而，我们必须区分这两个方面：伦理世界在哪里终结，以及神圣本体论在哪里开始。
  - type: paragraph
    text:
      ru: Есть такое выражение в Псалме:«Твой есмь аз, спаси мя»(Пс. 118, 94) . Когда мы говорим эти слова, то они могут показаться чрезмерными в своем дерзновении. Как ты, человече, говоришь:«Твой есмь аз, спаси мя»? Разве Бог имеет нужду в тебе? Разве то, что ты делаешь, так велико, что и Сам Бог должен прийти тебе навстречу?
      cn: 诗篇中有这样一句话：「我属祢，求祢拯救我」（诗篇 118:94）。当我们说出这些话时，它们可能显得过于僭越。你这人，怎能说「我属祢，求祢拯救我」呢？难道上帝需要你吗？难道你所做的事如此伟大，以至于连上帝自己都必须前来帮助你吗？
  - type: paragraph
    text:
      ru: 'Но наступает момент, когда вдруг Бог говорит человеку:«Сын Мой ecи ты, Аз днесь родих тя»(Пс.2:7). Когда мы молимся:«Твой есмь аз, спаси мя», мы не должны перешагивать этический план. Можно просить действительно усыновления, но утверждать его мы не можем; это доступно только Самому Богу. Так в раю наш праотец сделал глупый шаг: достигнуть обожения помимо Самого Бога, – шаг наивный, младенческий.'
      cn: 但总有这样一个时刻，上帝突然对人说：「你是我的儿子，我今日生了你」（诗篇 2:7）。当我们祈祷说：「我是祢的，拯救我」时，我们不应越过伦理层面。我们可以确实请求被收纳为嗣子，但我们不能声称自己已是嗣子；这唯独上帝自己才能赋予。因此在乐园中，我们的原祖迈出了愚蠢的一步：妄图在上帝之外达成「神化」——这一步是天真、幼稚的。
  - type: paragraph
    text:
      ru: 'Итак, когда Бог Сам вносит эту «поправку» и говорит: «Да, ты сын Мой», тогда усыновление принимает уже извечный характер. Но если я говорю: «Я Твой», то говорю это только в пределах моей этической натуры: «Я лучшего не вижу, чем Ты. Но Ты спаси меня. Это совсем не значит, что я Твой сын, доколе Ты Сам не свидетельствуешь обо мне, что я Твой сын».'
      cn: 那么，当上帝亲自作出这「修正」并说：「是的，你是我的儿子」时，这嗣子关系便具有了永恒的特质。但如果我说：「我是祢的」，我说的这话只在我伦理本性的范畴之内：「我没看到有比祢更好的。但祢拯救我。这根本不意味着我是祢的儿子，直到祢亲自为我作证，说我是祢的儿子。」
  - type: paragraph
    text:
      ru: Мы читаем в Евангелии о том, что был слышен глас Отца:«Сын МойЕси; послушайтеЕго»(см.Мф.3:17; Мф.17и парал). Итак, понадобилось свидетельство Самого Отца, чтобы утвердить последнюю силу реальности этого положения, что Иисус Христос есть Сын Отца (см.Ин.12:38).
      cn: 我们在福音中读到，曾有天父的声音发出：「祢是我的爱子；要听从祂。」(参阅 马太福音 3:17；马太福音 17章及平行经文)。因此，需要天父自己的见证，以确立这实况的最终效力，即耶稣基督是天父的圣子(参阅 约翰福音 12:38)。
- type: heading1
  text:
    ru: 'Беседа 30: О богоудаленности[188]'
    cn: 第三十讲：论与上帝的疏离[188]
  children:
  - type: paragraph
    text:
      ru: 'О слове Божием. Иконография и образ Божий. О случае с отцом N. О богоудаленности нашей эпохи: «Так нужно для вечности». Колебания и немощь – наш путь. Об отступлении энергии радости. О боли, рождающей молитву за весь мир.'
      cn: 论上帝之道。圣像学与上帝的形象。论N神父的事件。论我们时代与上帝的疏远：「永恒所需如此。」动摇与软弱——我们的道路。论喜乐活力的消退。论生出为整个世界祷告的痛苦。
  - type: paragraph
    text:
      ru: Нам невозможно объяснять каждый раз новым лицам, что представляют собой наши «праздники свиданий» – собраний вместе.
      cn: 我们不可能每一次都向新面孔解释，我们的「约会节」——即聚集在一起的聚会——究竟代表着什么。
  - type: paragraph
    text:
      ru: Желание наше – Духом Святым жить там, где призывается имя Его. Когда мы прикасаемся к Слову Божию, то, конечно, не избежать нам страха, не избежать нам и радости. Сколько раз мы говорили и еще раз повторим, что каждый день и на всякое время и на всякий час мы стараемся жить в святом месте, а место сие есть храм.
      cn: 我们的愿望是：靠着圣灵，生活在祂的名被呼求之处。当我们触及上帝圣言时，我们当然无法避免恐惧，也无法避免喜乐。我们已说过多少次，现在再重复一遍：每一天，每一时每一刻，我们都努力生活在圣所之中，而此圣所便是圣殿。
  - type: paragraph
    text:
      ru: Чем освящается храм? – Тем, что мы, стремясь не оскорбить Духа Святого, стараемся уловить каждое Его слово. Эти слова написаны теперь на сердцах наших:христиане должны говорить всегда из того, что дает им Дух, а не философствовать. Если вы испытаете, какЦерковьи массы людей реагировали на проповедь святых Апостолов, то, конечно, вам захочется сохранить эту радость и эту печальную любовь к миру. Почему я говорю со страхом о Слове Божием? – Потому что начинается Евангелие словами:«В начале было Слово, и Слово было у Бога, и Слово было Бог»(Ин.1:1). Все обладающие способностью различать, в каком духе человек беседует, скажут о последовательности слов в Прологе Евангелия святого Иоанна Богослова, что человек так не говорит. И бесполезно исследовать, как пытались некоторые, все философские творения, откуда это выражение у Иоанна Богослова. Оттого ли, что он вращался в кругах философских и среди наивысших людей своего времени? – Нет, даже наивысшие люди не могли бы так говорить. Смысл слов сих открывается не толкованиями человеческими, а ощущением заключенной в них, в этих словах, жизни.
      cn: 圣殿何以成圣？——乃因我们竭力不冒犯圣灵，力求捕捉祂的每一个言语。这些话语如今已铭刻于我们心间：基督徒应当时常从圣灵所赐予的发出言语，而非进行哲学思辨。假若您体验过，圣教会和大众对圣使徒们的宣讲有何反应，那么，您定会渴望保有这份喜乐，以及这份对世界的忧郁之爱。我为何对上帝的圣言怀着敬畏而言说？——因为福音书以这些话语开篇：「太初有道，道与上帝同在，道就是上帝」（约翰福音 1:1）。凡能分辨人以何等精神交谈者，都会论及圣使徒、神学家约翰福音序言中话语的连贯性，并言说人不能如此言说。试图探究所有哲学著作，以期寻得约翰神学家此番表述的源头，乃是徒劳无益的，尽管有些人曾为此努力。是因为他曾流连于哲学圈，周旋于他那个时代最杰出的人物之间吗？——不，即使是最杰出的人物也无法如此言说。这些话语的深意并非由人类的诠释所揭示，而是通过感受其中所蕴含的生命。
  - type: paragraph
    text:
      ru: Я позволил себе говорить сегодня об этом, потому что у нас в монастыре мы имеем нового гостя, очень нам дорогого гостя – иконописца N. Это искусство, или ремесло, он сам избрал для своей жизни духовной. Это значит, что когда он пишет икону, то думает ли он непосредственно о том или не думает, но, по существу, он живет сознанием, что человек создан по образу Божию. «Икона» в переводе с греческого означает «образ». Один профессор Сергиевского института рассказал мне замечательный случай. Он сам патролог и благочестивый человек. И он говорил, что, смотря на простых женщин, которые приходили целовать икону, он отметил какое-то родство душ тех, кто целует, и того, кто изображен. Так, это проявление духа человеческого в сфере нашей земной жизни живет в иконописце, когда тот трудится над созданием иконы – Христа Бога Божией Матери, или святых.
      cn: 我今天冒昧谈及此事，是因为我们修道院有一位新客人，一位我们非常珍视的客人——圣像画家N。这项艺术，或者说这门手艺，是他自己为自己的属灵生命所选择的。这意味着，当他绘制圣像时，无论他是否直接思考那一点，但从本质上讲，他活在一种意识之中：人是照着上帝的形象所造的。「圣像」一词在希腊语中意为「形象」。谢尔吉耶夫学院的一位教授给我讲述了一个非凡的例子。他本人是一位教父学专家，也是一位虔诚的人。他曾说，当他看着那些前来亲吻圣像的普通妇女时，他注意到亲吻者与被描绘者之间存在某种灵魂上的亲密关系。如此，这种人类精神在我们尘世生活领域中的显现，便存在于圣像画家之中，当他致力于绘制圣像之时——无论是基督上帝、圣母，还是众圣徒的圣像。
  - type: paragraph
    text:
      ru: Вы знаете, что уже семь или восемь лет, как я остался без чтения, потому что мои глаза больше не видят печатных букв. Мыслью я все время в ожидании прихода того момента, когда мой контакт с этим миром прервется. До сих пор я живу энергией, которая заключена в древе всего Адама. События наших времен делают наш век исключительно важным. Мне иногда кажется, что Господь Бог, отступая от нас, одним этим негативным движением отступления погружает нас в наши страсти, и мы живем страстями этого мира. И велики страдания души человека, когда отступает от нас действенная, ощутимая благодать Святого Духа.
      cn: 你们知道，我已经有七八年不能阅读了，因为我的眼睛再也看不见印刷的字迹了。我的思绪一直都在等待那一刻的到来，那时我与这个世界的联系将中断。至今我仍然靠着那股蕴含在全人类亚当根源中的生命力而活着。我们时代的诸多事态使我们的时代格外重要。我有时会觉得，上主上帝从我们退去时，仅凭这一个消极的退离之举，便将我们投入到我们的私欲之中，而我们就活在这世间的私欲中。当那有效的、可感受的圣灵恩典从我们退去时，人类灵魂的痛苦是何等巨大啊。
  - type: paragraph
    text:
      ru: 'Удаление Бога после двух невероятно тяжелых мировых войн – Первой и Второй – привело к тому, что весь мир погружен в кризис и не находит исхода ни в чем. И когда мы молимся Ему о всем мире, то все-таки Он отвечает: «Да, страдает человек. И благоволит душа Моя о тех, которые молятся за других людей, за страждущих, за всего Адама. Но оставьте это так, как есть, не смущайтесь тем, что неизбежны войны, не смущайтесь тем, что люди, страдая, действительно доходят до края того, что можно назвать краем терпения боли». Вопрос-то мой вот в чем: «Господи! если столько людей со слезами, с воздыханиями взывают к Тебе: Помилуй нас! помилуй нас и мир Твой!», и Он медлит миловать нас... А Он говорит в Евангелии: «Услыша обо всем этом,подымите головы ваши, иботак должнобыть»(см.Мк.13:7;Лк.21:28). Наша земная жизнь – временная; не здесь мы достигаем своего конца, своего осуществления как лица, как образа Божия в его полноте. Да, это сильный вопрос ко Христу и к Отцу и к Духу Святому...'
      cn: 在两次极其惨烈的世界大战——第一次和第二次——之后，上帝的被移除导致整个世界陷入危机，在任何事上都找不到出路。而当我们为整个世界向祂祈祷时，祂仍然回应说：「是的，人正在受苦。我的灵魂喜爱那些为他人、为受苦之人、为全人类亚当祈祷的人。但就让它这样吧，不要因战争不可避免而困扰，不要因人们在受苦中确实达到了忍受痛苦的极限而困扰。」我的问题在于：「上主啊！如果如此多的人流着泪，带着叹息向祢呼求：怜悯我们！怜悯我们和祢的世界！」，而祂却迟迟不怜悯我们...然而祂在福音书中说：「听到这一切，就当抬起你们的头，因为事情必然如此。」(参 马可福音 13:7，路加福音 21:28)。我们的地上生命是暂时的；我们并非在此达到我们的终点，并非在此实现我们作为位格，作为上帝在祂丰满中的形象。是的，这是对基督、对父以及对圣灵的一个有力的问题...
  - type: paragraph
    text:
      ru: «Прииди и вселися в ны, Душе Святый, Утешителю Благий».
      cn: 降临并内住于我们中，圣灵，至善的辅慰者。
  - type: paragraph
    text:
      ru: 'На наших глазах разлагаются империи, умирают миллионы людей от голода, от болезней. «Где же Ты, создавый нас?» И Господь отвечает: «Так нужно для вечности». Человек создан по образу Божию и по подобию. Человек должен охватить своею любовью не только человечество, но и всю тварь. И Господь радуется, когда мы молимся за страдающих, но Сам медлит прийти и исцелить. Почему? – Потому что Он все может. Он говорит:«Не убойтесь убивающих телои потомне могущихничего сделать дальше; нобойтесь того, ктои по убиении может еще наказать» (см.Мф.10:28). Это значит, что Он и по убиении и по смерти нашей может восставить нас в большей славе. Может быть, уже никогда мы не будем такими, как мы сейчас себя живем: лишенными любви и света.'
      cn: 在我们眼前，帝国衰朽崩塌，数百万人死于饥饿和疾病。「祢在哪里呢，创造我们的祢？」而上帝回答说：「永恒需要如此。」人是照着上帝的形像和样式被造的。人当以其爱涵盖不仅是全人类，也包括一切受造之物。而上帝欢喜，当我们为受苦者祷告时，但祂自己却迟迟不来医治。为何？——因为祂无所不能。祂说：「不要惧怕那些杀害身体，之后就不能再做什么的；但要惧怕那位在杀害之后，还能惩罚的。」（马太福音 10:28）这意味着，祂即或在我们被杀害并死亡之后，也能在更大的荣耀中使我们复活。也许我们再也不会像现在这样生活了：缺乏爱和光明。
  - type: paragraph
    text:
      ru: 'Моя душа радуется, когда я вижу вас, дорогих братьев и сестер, как вы отдаете свою радость, свою силу и свою молитву приходящим. Но после смерти: что мы можем сделать? – А Господь может все делать всегда. И вот, эти слова «так должнобыть»(см.Мк.13:7) мы, доколе не умрем и не достигнем последнего суда, понять до конца их не можем. Безумием было бы думать, что Господь благоволит страданиям. Он Сам проявил такую любовь, которая будет поражать нас во все века и в вечности. И когда Он приходит, то мы говорим Ему: «Господи, где же Ты был вчера или час тому назад?» Но странно, Он приходит, утешает нас свидетельством Своего присутствия, и уже нам нечего спросить у Бога. Так мы испытываем немощь нашего тварного существа: постоянные колебания, постоянные умножения или уменьшения боли и страдания, тьмы и света. Но, зная этот путь, мы постараемся вопиять и к Божией Матери, и ко всем святым, и к Самому Богу, чтобы дал нам терпение и силу на это терпение.'
      cn: 当我看见你们，亲爱的弟兄姊妹们，将自己的喜乐、力量和祷告献给前来的人时，我的灵魂欢欣。但死后呢？我们又能做什么呢？——然而主总能做一切事。并且，看哪，这些话语「这是必然的」（参 马可福音 13:7），我们只要还未离世并抵达最后的审判，就无法完全理解它们。若认为主喜悦苦难，那是愚蠢的。祂自己展现了如此的爱，这爱将使我们在万世和永恒中惊叹不已。而当祂降临时，我们就对祂说：「主啊，祢昨日或一小时前在哪里？」然而，奇妙的是，祂降临，以祂同在的见证安慰我们，而我们再也无话可向上帝询问。如此，我们体验到我们受造之物的软弱：持续的动荡，以及痛苦与折磨、黑暗与光明的持续增减。然而，深知此道，我们将努力向圣母、向众圣者、并向至高的上帝呼求，求祂赐予我们忍耐，并赐予我们面对这忍耐的力量。
  - type: paragraph
    text:
      ru: 'Да простит мне Бог, что я хочу сказать о себе самом. Более полувека тому назад, будучи еще на Афоне, я много болел и поражался болями, – и я хвалил Бога, удивляясь, как Он мог сотворить эту плоть, через которую я страдаю. Теперь не так. Я умом могу возрадоваться о путях Бога, но нет уже энергии радости. И я сожалею, что не могу вам принести эту радость. Призываю вас к терпению, к внимательному молитвенному состоянию с постоянным исканием воли Божией. Да поможет нам Господь Духом Святым пребыть во свете Его заповедей. И вот, призывая вас ко всему этому, я попрошу вас помнить всякие чудеса Божиего промысла, который нас «протерпел» до сих пор. Наше время невыносимое. Я человек небезошибочный, могу ошибаться на каждом шагу, да и ошибаюсь. Однако скажу вам: мне приходит часто мысль, что все-таки наступили апокалиптические времена. И мы будем строить наш домик, бедный домик по сравнению с другими, с большим рвением, чтобы воздать хвалу Богу, Спасителю нашему.'
      cn: '愿上帝宽恕我，竟欲言己之事。半个多世纪以前，我尚在阿索斯圣山之时，多病缠身，饱受痛苦折磨，我赞美上帝，惊叹祂何能造此肉身，使我受此磨难。如今则不然。我虽能凭心智为上帝的道路而欢欣，然喜乐之活力已然消逝。我亦深感遗憾，未能将这份喜乐带给你们。


        我呼吁你们要忍耐，要以专注之祷告状态，不断寻求上帝的旨意。愿主藉圣灵帮助我们，常存祂诫命的光中。如此，在呼吁你们行此诸事之际，我恳请你们铭记上帝护理的一切奇迹，祂至今仍「忍耐着」我们。


        我们的时代是难以忍受的。我并非一个不会犯错之人，每一步都可能犯错，且确有犯错。然而我告诉你们：我常有此念头，那便是末日（启示录）时代终究已然降临。我们将建造我们的陋室，与他人相比甚是简陋的陋室，带着极大的热忱，为要将赞美归于上帝，我们的救主。'
  - type: paragraph
    text:
      ru: 'Вчера вернулся из Греции наш старый сотрудник по постройке монастыря, отдавший все свои силы, отец N. Он поехал туда ради строительства нашего монастыря. Скажу вам: я встретил его с особым трепетом, потому что, как описывали, падение было приблизительно с четырехметровой высоты среди всяких камней и забора. Он кувыркался на этих камнях, перевертывало его с одной стороны на другую, и чудом остался невредим. Удар и падение были, несомненно, смертоносны, но вот, мы имеем его с нами опять.'
      cn: 昨天，我们修建修道院多年的同工，倾尽所有心力的N神父，从希腊回来了。他去那里是为了我们修道院的建造。我告诉你们：我怀着特殊的敬畏迎接了他，因为据他们所描述的，他当时是从大约四米高的地方跌落的，掉在各种石头和栅栏之间。他在这些石头上翻滚着，不断地翻来覆去，却奇迹般地毫发无损。这次撞击和跌落，无疑是致命的，然而，看哪，他现在又回到了我们身边。
  - type: paragraph
    text:
      ru: Некоторые из вас помнят, как вдруг я был брошен с высоты амвона на землю неизвестно какою силою. И я наверняка был бы убит, если бы не успел задеть одним пальцем края железа и отвести мою голову от удара смертельного. Вот, видите, этот маленький храм нам дался так дорого, но за то, что мы строим его с таким трудом, я думаю, Господь даст нам дыхание, объемлющее все творение Божие. И будем помнить эти чудеса, потому что, помня их, мы привыкнем духом нашим жить в этой атмосфере и всякая другая, не исходящая от Бога, не будет нам нравиться...
      cn: 你们中有些人可能还记得，我曾突然被不知何种力量从讲道台高处抛下，落到地上。我必定会被击毙，若不是我及时用一根手指触碰到铁的边缘，并使我的头部避开了致命一击。瞧，你们看，这座小小的圣殿我们付出如此巨大的代价才得以拥有，但正因为我们如此辛劳地建造它，我想，上主会赐予我们气息，包含着上帝的全部创造。并且我们将记住这些奇迹，因为记住它们，我们的心灵将习惯于生活在这种氛围中，而任何其他不源自上帝的，都将不会令我们喜悦……
  - type: paragraph
    text:
      ru: 'Я говорю как будто бы высокие слова, но о них вы будете читать и читаете у святых отцов, у прп.Исаака Сирина, – когда от сильной, острой и глубокой боли молится человек за всю тварь[189]. Но когда приходит это состояние по дару Духа Святого, то помните, что тогда Он – с нами, что мы не одни. Мы не можем создать в себе как бы искусственно эти высокие состояния, но когда Бог за смиренную мысль дает нам некоторые из действительно высоких мыслей и состояний, то это приходит так тихо, так просто, что никакого движения нет ни к тщеславию, ни к чему-нибудь подобному. Это натуральная, естественная для духа человеческого жизнь – жизнь по образу Бога, подобная жизни Его Самого. Вот, видите, какое явление: за последний месяц я так сильно болел, а нынче не могу оторваться от вас и все говорю, говорю, говорю; но все-таки отдохните от меня.'
      cn: 我仿佛在说些高深的话语，但你们会在圣教父们的著作中读到，也正在读到这些，在圣依撒格叙利亚人那里——当一个人因强烈、尖锐而深沉的痛苦，为一切受造物祈祷时[189]。然而，当这种状态借由圣灵的恩赐到来时，那么请记住，那时祂——与我们同在，我们并非独自一人。我们无法仿佛人工般地在自身中创造出这些高深的状态，但当上帝因谦卑的意念而赐予我们一些真正高深的意念和状态时，那么它的到来是如此的宁静，如此的纯朴，以至于没有任何引向虚荣或任何类似事物的冲动。这乃是人类灵性所固有的、自然的生命——是效法上帝形象的生命，与祂自身之生命相似。看哪，你们看这是何等的现象：过去这一个月我病得多么严重，但如今我却无法与你们分开，一直地说着，说着，说着；但无论如何，请你们还是歇歇吧。
  - type: paragraph
    text:
      ru: И Господь Бог да благословит вас всех...
      cn: 愿上主上帝赐福你们所有的人……
- type: heading1
  text:
    ru: Прощальная беседа[190]
    cn: 临别讲论[190]
  children:
  - type: paragraph
    text:
      ru: 'О богоданном слове. О богоизбрании на монашескую жизнь. О единстве с братией по кончине. О страданиях как усвоении жизни Христа. О совершенстве христианской веры. О нашей жизни как боли Христа. О склепе: «и по смерти будем неразлучны...»'
      cn: '关于上帝所赐之言。

        关于蒙上帝拣选入修道生活。

        关于离世后与弟兄们的合一。

        关于苦难乃是对基督生命的效法。

        关于基督徒信仰的完全。

        关于我们的生命是基督的苦痛。

        关于墓穴：「即便离世，我们也将永不分离……」'
  - type: paragraph
    text:
      ru: Буди имя Господне благословенно отныне и до века!
      cn: 愿上主的名是可称颂的，从今时直到永远！
  - type: paragraph
    text:
      ru: 'Господь сказал, как заповедь Свою: «Возлюбите Меня и в этой любви храните заповеди Мои» (ср.Ин.14:23). Через хранение заповедей мы приходим к привычке, к навыку жить в постоянной памяти Христа: Его жизни, Его примера, Его заповедей. Итак, прошу вас, дорогие братья мои и сестры, примите легко и с миром эти слова, – как не мои слова, а ответ на тот призыв, с которым обращается Господь к нам.'
      cn: 上主曾以祂的诫命说：「爱我，并在这爱中遵守我的诫命」（约翰福音 14:23）。通过遵守诫命，我们养成习惯，形成习性，活在对基督的恒常忆念中：忆念祂的生平，祂的榜样，祂的诫命。因此，我恳请你们，我亲爱的弟兄姐妹们，以轻松和平和的心态接受这些话语——它们并非我的话语，而是对上主向我们发出的呼召的回应。
  - type: paragraph
    text:
      ru: 'Если вы услышите теперь некоторые вещи, которые Господь говорил на Тайной Вечере пред Своим исходом, пожалуйста, не оскорбляйтесь этим, ибо Господь сказал: «Не приготовляйте слово, ибо оно дастся вам от Духа Святого. И не вы будете говорить, а Дух, исходящий от Отца» (см.Мк.13:11). Избрав Пречистую Деву Марию, сотворивши Ее путем к воплощению Своему, Господь тем самым соединяется со всеми нами и в образе мышления. Итак, решено: вы мне даете право говорить, следуя примеру Господа. Потому что Он сказал:«Я дал вам пример, чтобы и вы делали то же»(Ин.13:15).[191].'
      cn: 如果你们现在听到上主在祂离世前，于最后的晚餐上所说的某些事，请不要因此感到被冒犯，因为上主说：「不要预备说什么话，因为圣灵会把话赐给你们。说话的将不是你们，而是那从父而出的圣灵。」 (参见马可福音 13:11)。上主拣选了纯洁童贞的圣母玛利亚，使她成为祂道成肉身之路，上主借此与我们所有人连结起来，包括在思想方式上。因此，我们决定：你们赋予我说话的权利，效法上主的榜样。因为祂说：「我已给你们立了榜样，叫你们也照样去做。」 (约翰福音 13:15)。[191]。
  - type: paragraph
    text:
      ru: 'Скажу вам, что эти последние месяцы были для меня великим уроком. Мне трудно расстаться с вами. И вместе с тем, хотя Господь и продлил дни мои совершенно неожиданно, мое желание было увидеться с каждым из вас отдельно, хотя бы два слова сказать. Но как-то не удается это в нашей жизни; и мы принимаем сей промысл Божий как путь Креста. Вы, которые пришли сюда, – вы избрали нас, а не мы вас. Про Своих учеников Господь сказал:«Не вы Меня избрали, а Я вас избрал»(Ин.15:16). Этот путь таков: Дух Господень избирает вас и действует в вас помимо нас. Что значит «помимо нас»? – Что мы сами живем «не двигаясь»: не стараемся привлечь кого-то каким-либо образом. Мы живем в простоте нашей, и вы приходите сюда, водимые Духом Святым, потому что жизнь наша, извне видимая людьми, проста, ничего снаружи не видно, но эта жизнь – сплошь распятие. Но вы ли избрали нас – и за то Дух Божий почивает на вас, – или мы вас: ныне мы«все едино», и я говорю это каждому из вас, дерзновенно повторяя сии слова Христа (см.Ин.17:21). Когда мы живем здесь, как будто бы ничего особенного нет, но то, что превалирует над всем прочим, невидимо для глаз мира сего.'
      cn: 我告诉你们，这几个月对我来说是极大的教训。我很难与你们分离。然而，尽管上主出乎意料地延长了我的岁月，我仍渴望能与你们每个人单独见面，哪怕只是说几句话。但在我们的生活中，这似乎未能实现；我们接受这神圣的旨意，作为十字架的道路。你们这些来到这里的人——是你们拣选了我们，而不是我们拣选了你们。关于祂的门徒，上主曾说：「不是你们拣选了我，而是我拣选了你们」（约翰福音 15:16）。这条道路是这样的：上主的圣灵拣选了你们，并且在我们之外在你们里面运行。「在我们之外」是什么意思呢？——意思是，我们自己是「静止地」生活着：不试图以任何方式吸引任何人。我们生活在我们的简朴之中，你们来到这里，是由圣灵引导的，因为我们的生活，从外面看来是简单的，外面什么也看不出来，但这种生活完全是受难。但无论是你们拣选了我们——为此，上帝的圣灵安歇在你们身上——还是我们拣选了你们：如今我们「都合而为一」，我将此话告诉你们每个人，勇敢地重复着基督的这些话语（参见约翰福音 17:21）。当我们生活在这里时，仿佛没有什么特别之处，但那超越一切的，是今世之眼所看不见的。
  - type: paragraph
    text:
      ru: Я не думаю, что смерть по телу может быть для нас разделом. Нет!.. Смерть моя, по мнению врачей, все-таки уже почти очевидна. Некоторые дают мне всего несколько дней. Они ошибались; может быть, и на сей раз ошибаются. Дело наше сейчас, подвиг наш в том, чтобы преодолеть пределы времени и материи, вещества нашего тела, чтобы пребыть едиными и после моего ухода. Это не потому, что я какой-то «особенный». Но так Дух мне говорит в сердце моем. Я грешный человек; и не достигаю я заповеди Бога живого, потому что эта заповедь объемлет весь мир, все сущее, вне времени, вне пространства. Господь сказал на Тайной Вечери:«Я живу, и вы будете жить»(Ин.14:19). Так я с вами должен остаться живым.
      cn: 我不认为肉身的死亡能把我们分开。不！依医生之见，我的死亡终究已经几乎显而易见。有些人断言我只剩下数日。他们曾错了；也许，这一次他们也错了。我们目前的任务，我们的功修，在于克服时间与物质的界限，克服我们身体的质料，以便在我离去后仍能合一。这并非因为我有何「特别」之处。但圣灵如此在我的心里对我言说。我是一个罪人；我达不到活上帝的诫命，因为这诫命囊括了整个世界，一切存在者，超越时间，超越空间。上主在神秘晚餐上说：「我活着，你们也要活着」（约翰福音 14:19）。如此，我与你们必须依然活着。
  - type: paragraph
    text:
      ru: Нашему возлюбленному духовному отцу, Силуану, Бог без слов открылся в видении в начале монашеского подвига. Продолжайте терпеть наш труд невероятный и нам всем без Христа недоступный. Путь наш – отдать свою жизнь ради жизни другого. И нет любви большей, чем та, когда душа человека готова на всякую смерть за благо ближнего. Господь сказал о такой любви, что«нет большей любви»(см.Ин.15:13). Итак, позволю себе говорить, так как вы уже высказали готовность пребыть в слове и соединении мышления нашего и сердец наших. Сотни свидетельств были того, что Господь слышит молитвы из этого места.
      cn: 我们的挚爱教父圣西卢安，上帝在修道苦修之初，在异象中无言地启示了自己。请您继续忍受我们这不可思议的劳苦，它也是我们所有人在没有基督的情况下无法达成的。我们的道路是：为了他人的生命而献出自己的生命。也没有比这更大的爱：当人的灵魂为了近人的益处而准备好面对任何死亡。上主谈到这种爱时说，「没有比这更大的爱」（参阅约翰福音 15:13）。那么，请允许我发言，因为您已经表达了留于言语之中，并与我们的思想和心灵相结合的意愿。有数百个见证表明，上主听取了来自这个地方的祷告。
  - type: paragraph
    text:
      ru: 'Итак, будьте спокойны в сердце своем и при моем пребывании, и при моем уходе телесном (ср.Ин.14:1, 27): мы НЕ РАЗДЕЛЕНЫ...'
      cn: 所以，你们心里要平静，无论我在场，还是我肉身离去之时（参 约翰福音 14:1，27）：我们并未分离……
  - type: paragraph
    text:
      ru: 'Да, я молчу не потому, что у меня нет слова, но потому, что мне трудно произнести эти слова. Господь сказал о Своих учениках Богу в молитве к Отцу: «В час сейЯ осихмолю; не о всем мире молю, но о нихкоторых(см.Ин.17:9)...Я посылаю, как овецпосредиволков» (см.Мф.10:16). Так, вы потерпите эту жизнь! Она построена странным образом – как будто бы ничего нет особенного. Но есть воистину нечто превысочайшее и величайшее – любовь Отца, любовь Сына, любовь Духа Святого с нами. Молясь за каждого из вас по имени, я, конечно, связан с каждым из вас теми узами, о которых можно говорить как о принадлежащих Царству вечному, – узами вечной любви, непоколебимой во веки веков. Нам трудно это воспринять. Апостолы некоторые говорили об этом с большим дерзновением, чем мы позволяем себе. Но наше бедное начало все-таки есть действие Бога Самого, и, как говорят архиереи на службе: «И утверди виноград сей,егоженасади десница Твоя». У меня безвыходное положение – я сам нетерпеливый, хотя отдал мою жизнь на служение другим. Сколько дней, сколько ночей я провел с Богом, в молитве, которую можно ли назвать молитвой, потому что она есть «скрежет зубов»?'
      cn: 是的，我沉默不是因为我无话可说，而是因为我难以说出这些话语。上主在向父的祷告中论及祂的门徒们说：「在这时刻，我为这些人祷告；我不是为全世界祷告，而是为那些人（约翰福音 17:9）……我差遣他们，如同羊进入狼群中」（马太福音 10:16）。所以，你们要忍受这生命！它以奇特的方式被建造——仿佛没有什么特别之处。但确实存在着某种超越一切且至为伟大的事物——父的爱，子的爱，以及圣灵与我们同在的爱。我为你们每个人按名祷告时，我当然与你们每个人连结着那些可以称之为属于永恒国度的纽带——那是永恒之爱的纽带，在世世代代中永不动摇。我们难以领会这一点。有些使徒论及此事时，比我们所容许自己的更具胆量。但我们贫乏的开始终究是上帝自己的作为，并且，如同主教们在事奉中所说：「并坚固祢右手所栽种的这葡萄树」。我处于一个绝境——我自己是缺乏忍耐的，尽管我已将我的生命奉献给对其他人的服侍。我与上帝一同度过了多少个白天，多少个夜晚，在祷告中——这还能被称为祷告吗？因为那（祷告）是「咬牙切齿」吗？
  - type: paragraph
    text:
      ru: 'Итак, драгоценные мои братья и сестры, я в конце моего пути говорю вам: в любви нашей ко Христу пребудем непоколебимы! Всякое недоумение, всякое страдание наше несите, как жизнь Христа. Есть многие пути к «абсолютному» в жизни человечества, но нет никого, кто бы сравнился со Христом. Итак, не оторвитесь от Христа ни при каких трудностях. Если положил нам Господь умирать, будем умирать с сознанием Его любви, которая привела Его на крест. Я надеюсь, что подлинно действуют в нас слова Христа:«Я живу, и вы будете жить»(Ин.14:19).'
      cn: 所以，我亲爱的弟兄姊妹们，我在旅途的终点对你们说：愿我们在对基督的爱中坚不可摧！我们所有的困惑，我们所有的苦难，都要背负，如同基督的生命。在人类生命中有许多通向「绝对」的道路，但没有任何人能与基督相比。所以，无论遇到何种艰难，都不要与基督分离。如果上主定意让我们死亡，我们就带着祂的爱而死，这爱将祂带上了十字架。我希望基督的话语真正在我们里面运行：「我活着，你们也要活着」（约翰福音 14:19）。
  - type: paragraph
    text:
      ru: Каждое слово Христа – это есть сама Божественная вечность. Никому не отдайте Христа! Пусть Он будет единственным Царем нашего сердца со Отцом и Духом Святым. Итак, верить во Христа – это есть действенная жизнь, жизнь Самого Христа. Как Он страдал за всякую тварь и за весь мир, так будем и мы молиться Богу. И в трудные минуты пусть нами овладевает плач гефсиманский. Но и у нас бывает так, что после некоторого подобия гефсиманскому плачу, когда Дух Вечный касается нас, тогда мы живем подлинно; тогда начинается наша бессмертная жизнь; и тогда совсем в другом виде предстает пред нами Абсолютный Бог. Наша вера христианская есть последнее совершенство; и никто да«не отлучит нас от любви»Христовой, как и Павел говорил! (см.Рим.8:39) Я сейчас сказал эти слова независимо от апостола Павла. Но вот, видите, мы говорим тем же языком, о той же жизни, как Апостолы и все святые, свидетели Божества Христова.
      cn: 基督的每一个圣言，就是神圣永恒的本体。不将基督拱手于人！愿祂与圣父和圣灵一同，成为我们心中唯一的君王。因此，信仰基督，就是满有作为的生命，是基督本身的生命。正如祂为一切受造物和整个世界受苦，我们也当如此向上帝祈祷。并且在艰难的时刻，愿客西马尼园的哀哭能攫住我们的心。但我们也常常如此：在某种程度上经历客西马尼园般的哀哭之后，当永恒的圣灵触动我们时，那时我们才真正地活着；那时我们不朽的生命才开始；那时，绝对的上帝便以截然不同的面貌呈现在我们面前。我们的基督信仰是最终极的圆满；愿无人能「使我们与基督的爱隔绝」，正如保罗所言！(参见罗马书 8:39) 我方才所言并非援引使徒保罗之语。但你们看，我们正说着同样的语言，论及同样的生命，正如众使徒和所有圣者，他们都是基督神性的见证人。
  - type: paragraph
    text:
      ru: 'Вот, я благодарный Богу за то, что очутился здесь, принесенный молодыми моими братьями. Я прошу Бога дать мне слово, и слова толпой толпятся, и мне хочется выбрать то, что по естеству своему есть вечная жизнь: когда мы начинаем подобно Христу страдать за всю тварь, тогда во Христе и со Христом мы живемвечную жизнь.'
      cn: 我要感谢上帝，因为我在此地，是由我年轻的弟兄们带来的。我求上帝赐予我话语，话语如潮水般涌来，我愿选择那本质上是永生的话语：当我们开始效法基督为所有受造之物受苦时，那时，我们在基督里并与基督同在，就活出永生。
  - type: paragraph
    text:
      ru: 'Итак, я благодарю вас, что вы слышали мое слово. Ухожу я, уверенный в том, что Господь каждого из вас приносил Своею рукою. И не легка наша жизнь; кто ее не знает, тот не знает боли Христовой. И вот, на сегодня я кончаю мой разговор с вами в трех словах: отдать нашу жизнь, чтобы жили другие; утешать всех приходящих, бедных, не имущих иного утешителя в мире сем; и так, служа Богу в Его страдающих братьях и сестрах наших, мы соединяемся в этой любви с Самим Христом навеки.'
      cn: 那么，我感谢你们听了我的话语。我要离开了，深信是主用祂的手将你们每一个人带来此处。我们的生命并不轻松；凡不了解这生命的人，就不了解基督的苦痛。于是，今天我用三句话结束与你们的谈话：献出我们的生命，为使他人得生；安慰所有前来的人，贫穷的，以及在这世上没有其他安慰者的人；这样，通过在祂受苦的弟兄姐妹身上事奉上帝，我们就在这爱中与基督自己永永远远结合为一。
  - type: paragraph
    text:
      ru: 'Наш план теперь: построить склеп здесь для всех. Если устроить кладбище и каждого погребать отдельно, то нашей территории хватит ненадолго. Итак, мы строим теперь склеп. Там будут лежать гробы, там будут наши останки... Но будет радость, что и по смерти мы неразлучны.'
      cn: 我们现在的计划是：在这里为大家建造一座墓穴。如果建立墓地，并将每个人单独安葬，那么我们的土地将不够用，持续不了多久。因此，我们现在建造墓穴。那里将存放棺木，那里将存放我们的遗骸……但会有一种喜乐，就是即使在死亡之后，我们也将永不分离。
  - type: paragraph
    text:
      ru: Итак, да будет благословение Господне на вас на всех, братьях моих и сестрах.
      cn: 那么，愿主的祝福临到你们众人，我的弟兄姊妹们。
  - type: heading2
    text:
      ru: Завещание[192]
      cn: 遗训[192]
    children:
    - type: paragraph
      text:
        ru: 'Возношу славословие Богу нашему, дающему мне радость видеть вас собранными сегодня воедино. Я не знаю дня, когда умру, но опыт ближайших прошлых лет научил меня ждать конца моей жизни каждый день. По воле Господа на меня выпал долг свидетельствовать о нашем духовном отце Силуане, которого Он показал мне в его подлинном величии. Преисполненный сознания моей малости, я произношу эти слова, исполненный великого страха. То, чему я научился у его ног при жизни его, я не хочу сохранить только для себя, но горю желанием сообщить всем вам в той полноте, в которой благоволил Господь открыть мне Своего избранника. Хочу и молюсь Богу, чтобы Он открыл вам чаяние моего сердца: передать вам воспринятое мною как мое завещание.'
        cn: 我向上帝献上颂赞，祂赐予我喜乐，能看到你们今天齐聚一堂。我不知自己何时将离世，但近几年的经历教会我日日预备生命的终结。按照上主的旨意，我承担了为我们的属灵教父圣西卢安作见证的义务，上主曾向我显明他真正的伟岸。我深知自己的卑微渺小，怀着巨大的敬畏说出这些话语。我从他生前座下所学到的，我不愿只为自己保留，却切望将这一切，以那样的丰盛，告知你们所有人，正如上主喜悦向我启示祂的蒙拣选者那般。我愿并向上帝祈祷，祂能向你们启示我内心的切盼：将我所领受的，作为我的遗训，传达给你们。
    - type: paragraph
      text:
        ru: 'В монашеском общежитии, в идеальном порядке, ставится целью достижение того единства, о котором молился Христос:«да будут все едино, как Ты, Отче, во Мне, и Я в Тебе,таки они да будут в Нас едино»(Ин.17:21); то есть по образу единства Святой Троицы. Един есть Бог, но единый в трех Ипостасях-Лицах; и по словам откровения Св. Библии:«сотворим человека по образу Нашему [и] по подобию»(Быт.1:26), нужно увидеть, что в безначальном уме Творца нашего человек задуман как один, единый, но в большом числе ипостасей. В этом чудном единстве каждый, в каком-то смысле, внутри своей ипостаси является центром всего: все и всё – для него. Он же все свое и всего себя отдает для всех и каждого. Нет ни большего, ни меньшего. Каждый, нося в молитве своей всех членов общины, стремится достигнуть того, что поставлено перед нами как заповедь: «любитьближнего, как самого себя»(см.Мф.22:39), то есть как «свою» жизнь. Если члены монашеской общины действительно разумно носят в себе сие задание, то они благотворно влияют один на другого в общем подвиге достигнуть единства в Боге. Создается при этом совмещение усилий, тесное сотрудничество, конвергенция в порыве благочестивого творчества, обеспечивающего восхождение в духовную сферу Царства Святой Троицы.'
        cn: 在修道院的团体生活中，在理想的秩序中，其目标是达到基督所祈求的那个合一：「使他们都合而为一，正如祢，父啊，在我里面，我在祢里面一样；愿他们也在我们里面合而为一」(约翰福音 17:21)；也就是说，效法圣三一的合一形象。上帝是独一的，却在三个位格中合一；并且根据圣经的启示之言：「我们要照着我们的形象，按着我们的样式造人」（创世记 1:26），必须看到，在我们创造者的无始之心中，人被构想为独一的一个，却拥有众多位格。在这个奇妙的合一中，每个人，在某种意义上，在他自己的位格之内是万物的中心：一切和万有——都为他。他却将他的一切和他的全部自我奉献给所有人，以及每个人。没有更大，也没有更小。每个人，在他的祷告中担负着团体所有的成员，力求达到那作为诫命呈现在我们面前的：「爱你的邻人如同你自己」（参马太福音 22:39），也就是说，如同「自己的」生命。如果修道院团体成员确实明智地担负着这个任务，那么他们会彼此产生有益的影响，在旨在上帝里达到合一的共同苦修中。于是便产生了努力的结合、紧密的合作，以及在虔敬创造的冲动中汇聚，这确保了上升到圣三一王国的属灵领域。
    - type: paragraph
      text:
        ru: Монашеское общежитие является самым благоприятным условием для расширения нашего сознания до тех пределов, которые поставлены пред нами как конечная цель, как реализация образа и подобия Богу в «человеке-человечестве»:«чтобы они были едино, как и Мы»(Ин.17:11). Подвиг сей, будучи безмерно великим, конечно, не может быть легким. Это есть тот «узкийпуть», полный глубоких страданий, о котором говорит Христос (см.Мф.7:14). Всю нашу жизнь мы можем расти, движимые словом и примером Самого Христа, доколе не достигнем«единстваверы и познания Сына Божия, в мужа совершенного, в меру полного возраста Христа»(Еф.4:13).
        cn: 共住制修道生活是最有利的条件，能使我们的意识扩展到那些被置于我们面前作为最终目标的极限，即在「人-人类」中实现上帝的形象和样式：「使他们合而为一，正如我们合而为一。」（约翰福音 17:11）这项功修，既是无限伟大的，自然不会是轻松的。这就是那充满深沉苦难的「窄路」，基督所说的（参阅马太福音 7:14）。我们一生中，被基督自己的话语和榜样所激励，我们可以不断成长，直到我们达到「信仰上的合一和对上帝之子的认识，成为一个完全的人，达到基督丰满身量的尺度。」（以弗所书 4:13）
    - type: paragraph
      text:
        ru: Спасение состоит в восприятии дара Божественной жизни в ее извечнойполноте. Говоря о «полноте», мы имеем в виду ипостасную форму бытия. Полноту мы мыслим каклюбовь, которой свойственно совершенство познания, и сие в силу общения в самом бытии.
        cn: 救赎在于领受神圣生命在其永恒圆满中的恩赐。谈及«圆满»，我们指的是存有的位格性形式。我们将圆满理解为爱，其所固有的认识之完美，是因着在存有本身的共融而得以成就的。
    - type: paragraph
      text:
        ru: 'Не вредно повторять, чтолюбовьперемещает жизнь любящего в лицо возлюбленного: существование возлюбленных мною лиц становится содержаниеммоейжизни. Если я всем моим существом люблю Бога, по смыслу первой заповеди:«возлюби Господа Бога твоего всем сердцем твоим и всею душею твоею, и всем разумением твоим»(Мф.22:37), то я весь целиком пребываю в Нем. И только так Его бытие становитсямоим. Если я, подобно Христу,«до конца»(Ин.13:1) люблю всех, то бытие всех силою любви делается моим бытием. И это не только в смысле объема содержания, но и качества, через преображение благодатью Божиею моей человечности. И так это явится особым родом нашего пребывания в Боге и Бога в нас. И это есть –живая вечность, то есть персональная, ипостасная.'
        cn: 屡次重申并非无益，即爱将爱者之生命迁入被爱者之位格：我所爱诸位格之存有，成为我生命之内容。若我以我全部之存有爱上帝，依循首要诫命之意旨：「你要尽心、尽性、尽意爱上主你的上帝。」（马太福音 22:37），则我全然、完整地住于祢内。唯有如此，祂的存有方能成为我的。若我，如同基督，爱众人「到底」（约翰福音 13:1），则众人之存有，借爱之大能，亦成为我的存有。而这不仅在内容广度上，更在性质上，借上帝之恩典，使我之人性蒙受圣化而实现。如此，这将呈现为一种独特的方式，即我们住于上帝内，以及上帝住于我们内。而此即是——活的永恒，亦即位格性的、本位性的。
