  '[34]':
    ru: 'Отец Софроний подразумевает традицию отцов-исихастов, «боговидцев», особенно прп.Симеона Нового Богослова(949–1022). Сей великий святой, поведав свой опыт Боговидения, неоднократно подвергался осуждению от тех, кто, цитируяИн.1:18:«Бога не видел никто никогда», обвиняли его в прелести. Его ответ о том, «что возможно нам видеть Бога» и «всякий чистый сердцем в настоящей еще жизни узревает Бога», см.: Прп.Симеон Новый Богослов. Слово 63 // Там же. Т. 2. М., 1890. С. 110–112. Ср.: Гимн XXXII «Где преподобный Симеон с изумлением рассказывает о том, как он видел Бога...» // Божественные гимны. Перевод иером. Пантелеимона. Сергиев Посад, 1917. С. 136 след.'
    cn: 索夫罗尼长老意指寂静主义教父们，「见神者」的传统，尤其是新神学家圣西缅（949–1022）。这位伟大的圣人，在阐述了他见神的经验之后，多次遭到那些人的谴责，他们引用（约翰福音 1:18）：「从来没有人见过上帝」，指控他陷入神恩妄想。他对于「我们可能见到上帝」以及「凡是心怀纯洁的人，在今生就能见到上帝」的回应，参见：新神学家圣西缅。《言论63》//同上。卷2。莫斯科，1890。页110–112。另可参阅：《圣诗第三十二首》：「圣西缅惊叹地讲述他是如何见到上帝的......」//《神圣圣诗集》。耶罗蒙克潘捷列伊蒙译。谢尔吉耶夫波萨德，1917。页136及之后。
