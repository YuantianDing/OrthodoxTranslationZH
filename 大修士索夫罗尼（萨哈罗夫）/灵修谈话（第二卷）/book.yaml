  children:
  - type: heading2
    text:
      ru: 'Беседа 1: О программе монашества[1]'
      cn: 讲论一：论修道主义的纲领[1]
    children:
    - type: paragraph
      text:
        ru: Программа монашества – соблюдение заповедей Христа. О трагедии эгоизма и ее преодолении. Зависть как признак присутствия эгоизма в нас. Единство духа как путь к спасению. О своем исходе и привязанности к братии. О выборе языка для бесед. Как прийти к Богу. Молитва и пребывание в Боге как смысл монашества
        cn: '修道生活的纲领——遵守基督的诫命。

          关于利己主义的悲剧及其克服。

          嫉妒——作为我们里面存在利己主义的标记。

          精神的合一——作为通往救赎的道路。

          关于自己的离世以及对弟兄们的依恋。

          关于用于交谈的语言选择。

          如何走向上帝。

          祷告以及在上帝里存留——作为修道生活的意义。'
    - type: paragraph
      text:
        ru: Всех вас приветствую и прошу молитв в помощь мне. Цель моя – помочь вам бороться против «рутинности» в монашеской жизни, так, чтобы подлинно пребывать умом там, где Христос:одеснуюОтца. Однако те средства, которые я имею в моем распоряжении, весьма скудны...
        cn: 我向诸位致以问候，并请求你们为我代祷，以助我一臂之力。我的目标是帮助你们在修道生活中对抗「例行公事」，以便你们的心思意念能真正地安住于基督所在之处：在父的右边。然而，我手头所拥有的方法却非常贫乏……
    - type: paragraph
      text:
        ru: 'Святые Отцы, такие как Лествичник и другие аскеты, требуют от монаха постоянного умного пребывания в Боге. Жизнь повседневная полна впечатлений и перебивает в нас эту созерцательную жизнь в Боге. Прошлый раз я говорил о том, как мы должны сознавать себя, живя в этом мире среди множества людей. Одна из самых главных задач в программе монашества – чрез соблюдение заповедей Христа достигнуть состояния бесстрастия, то естьосвящения: когда никакое явление духовное уже не может в нас перебить видение бесстрастного Бога. Если говорить о бесстрастии как цели нашей жизни и смысле нашего прихода сюда, в монастырь, – тогда весь стиль нашей жизни меняется.'
        cn: 圣教父们，例如阶梯圣约翰以及其他苦修者，要求修士们持续地在上帝内进行心智临在。日常生活充满了各种印象，并中断了我们内里这种在上帝内的默观生活。上一次我谈到，当我们在世上众人之中生活时，我们应当如何认识自己。修道生活中最重要的任务之一，是借由遵守基督的诫命来达到无情欲，亦即成圣的状态：那时，没有任何属灵现象能再中断我们对无情欲之上帝的瞻望。如果我们谈及将无情欲作为我们生命的目标以及我们来到此处，来到修道院的意义——那么我们生活的整个方式就会改变。
    - type: paragraph
      text:
        ru: Результатом падения стало то, что человек из образа Божия, из образа Абсолютного Существа «выпал» в сознание, которое мы теперь именуемэгоизмом. Эгоизм стал для нас признаком этого падения и присутствием в нас гибели – смерти.
        cn: 堕落的结果是，人从上帝的形象、从绝对存有的形象中「坠入」了我们现在称之为自我中心主义的意识。自我中心主义对我们而言，成了这次堕落的标记，以及我们内里毁灭——即死亡——的在场。
    - type: paragraph
      text:
        ru: 'Хотя откровение Божие дано в этой форме – «ЭГО», «АЗ»: «АЗ ЕСМЬ СЫЙ»[2], однако здесь это слово «ЭГО», «АЗ» – самое замечательное слово, потому что означаетперсону, аперсонане живет замкнуто в своемэго.'
        cn: 尽管上帝的启示是以这种形式赐予的——「ЭГО」，「АЗ」：「АЗ ЕСМЬ СЫЙ」[2]，然而在这里，「ЭГО」，「АЗ」这个词语是最卓越的，因为它意指位格，而位格并非封闭地活在自己的「ЭГО」中。
    - type: paragraph
      text:
        ru: 'Эгоизм – действительно причина всех трагедий жизни человека, человечества на земле. Это есть положение, обратное тому, к которому мы призваны заповедью Божией: Богом заповедано любить всякого ближнего, всякого со-человека, как самого себя. Конечно, я имею в виду понимание евангельское, а не Ветхого Завета. Ветхий Завет говорил: «Возлюби ближнего твоего, как самого себя, и возненавидь врага»; а Господь заповедал: «А Я говорю вам: любите враги ваша»[3]. Так что хотя Ветхий Завет давал нам многие примеры очень высоких состояний молитвы и видений, однако все-таки это далеко отстоит от евангельской заповеди: «А Я говорю вам: любите враги ваша». В книге о старце Силуане я пишу о том, что эта заповедь Христа придает всем другим заповедям характер абсолютный, вечный и беспредельный. Из-за нее христианство остается для мира как бы «смертью» – смертью эгоизму. И потому Господь говорит: «Будете ненавидимы всеми имени Моего ради»[4]. Очень возможно, что даже мы, монахи, устанем и утомимся от этого слова, потому что оно не дается нам никак. Мы изнемогаем в молитве, чтобы сохранить заповедь Бога. Проходят годы, десятилетия – и мы не достигаем искомого. От этого утомления рождается отталкивание. Но я умоляю вас, имейте в виду: это отталкивание есть голос смерти в нас! Хотя и трудно говорить об этой заповеди, потому что все мы далеко отстоим от высоты Божиего слова, но лучше все-таки говорить о ней, чем о чем бы то ни было другом. Иначе все становится опустошенным, и мы ничего не получим тогда для нашей жизни в Боге, которая есть жизнь вечная.'
        cn: 自我中心——确实是人类生命、人类在地上一切悲剧的根源。这正是与我们蒙上帝诫命所召之处境相反的情形：上帝所诫命的，是爱每一个近人，每一个同胞，如同自己。当然，我指的是福音的理解，而非旧约的理解。旧约说：「当爱你的近人如同自己，并憎恨你的仇敌」；而主诫命说：「但我告诉你们：爱你们的仇敌」[3]。所以，虽然旧约给我们提供了许多极高的祷告境界和异象的例子，然而，这仍然远远不及福音的诫命：「但我告诉你们：爱你们的仇敌」。在我写西拉长老的书里，我提到基督的这条诫命赋予所有其他诫命以绝对的、永恒的、无限的特质。因为它，基督教对世人而言，仿佛是「死亡」——是自我中心的死亡。因此主说：「你们将为我的名被众人恨恶」[4]。很有可能，甚至我们这些修士，也会厌倦并疲乏于这番话，因为它丝毫不能为我们所达致。我们在祷告中精疲力竭，以便持守上帝的诫命。岁月流逝，几十年过去——而我们仍未达到所求的。从这种疲乏中，产生出抗拒。但我恳求你们，请注意：这种抗拒是死亡在我们里面的声音！尽管谈论这条诫命很困难，因为我们所有人都远远不及上帝之话语的高度，但最好还是谈论它，胜过谈论其他任何事物。否则，一切都将变得空虚，我们那时将一无所获，为了我们在上帝里的生命——那是永恒的生命。
    - type: paragraph
      text:
        ru: 'Один из признаков нашего эгоизма – присутствие в нас некоего чувства зависти. От этого чувства надо бежать, как от черной смерти. Настоящая христианская жизнь освобождает нас от зависти. В Евангелии есть прекрасная притча о блудном сыне. Когда Бог устроил пир на небесах, потому что падший сын вернулся в лоно Отца, то старший сын, который не знал падения, вдруг пал жертвой этой зависти: «Я всю жизнь Тебе работаю, и Ты мне никогда этого не устроил!». А Отец отвечает: «Все, что принадлежит Мне, – принадлежит и тебе. И поэтому радоваться надо о спасении... Сей брат был мертв и ожил, пришел к нам»[5]. И если так верить: «все, что имеет Бог, будет наше», темная страсть зависти не найдет места в нас. Вы знаете из Евангелия: Пилат видел, что по зависти предают Христа; не за истинные какие-нибудь преступления, а только потому, что Он возбудил в них зависть Своими божественными чудесами. Как видите, зависть эта убила Бога! Она же убивает брата! Итак, когда в нас появляется движение зависти, тогда мы должны понимать, что мы во власти темной смерти. А мы должны жить так, чтобы не только не завидовать, но даже радоваться каждый раз, когда кто-либо превосходит нас в чем бы то ни было. И если у нас будет верная установка, то эта страсть, которая разрушает все в жизни людей, не найдет в нас места, и наша жизнь станет совсем другою по роду своему. Тогда легко устанавливается единство духа, и жизнь нашего братства будет полна действительно Божественного присутствия...'
        cn: 我们自我中心的迹象之一，便是我们内心存在某种嫉妒之情。我们必须避开这种情感，如同避开黑死病。真正的基督徒生活使我们从嫉妒中得以释放。福音书里有一个关于浪子的美丽寓言。当上帝在天上设宴，因为那个堕落的儿子回到了父亲的怀抱时，那从未堕落的长子，却突然成了这种嫉妒的受害者：「我一生都事奉祢，祢却从未为我设过这样的宴席！」父亲回答说：「我一切所有的都是你的。所以应当为这救恩欢喜快乐……你这兄弟是死而复活，回到我们这里的。」[5]若是如此相信：「上帝所有的一切，都将是我们的」，那么嫉妒的黑暗情欲便不会在我们心中找到立足之地。你们从福音书中知道：彼拉多看出，他们是因嫉妒才出卖基督的；并非为了任何真实的罪行，而仅仅因为祂用祂神圣的奇迹激起了他们的嫉妒。你们看，这嫉妒竟杀害了上帝！它同样杀害弟兄！所以，当嫉妒的念头在我们心中升起时，我们就必须明白，我们正处于黑暗死亡的权势之下。而我们应当这样生活：不仅不嫉妒，甚至每次当有人在任何方面超越我们时，我们都欢喜快乐。如果我们有正确的观念，那么这种摧毁人类生活中一切的情欲便不会在我们心中找到立足之地，我们的生活也将因此变得截然不同。那么，圣灵的合一便能轻易确立，我们弟兄团体的生活也将充满真实的上帝临在……
    - type: paragraph
      text:
        ru: Перед исходом моим я хочу написать это на ваших сердцах, чтобы вы действительно жили в Боге и ничего другого не было бы в вашем сознании. Не дайте никаким образом и никому вырвать из вашего духовного сознания Христовой любви, которая не знает зависти, но радуется о спасении всякого человека. Это сводится к тому, что вы молились бы и утром, и вечером, и в храме, и вне храма о том, чтобы сохранить заповедь Божию о любви к ближнему. Об этом моя молитва к Богу. Через любовь к ближнему мы познаем и любовь Бога. Конечно, я хотел бы, чтобы в каждом из нас молитва била ключом изнутри, чтобы та суета, которая создается приходом к нам большого числа людей с самыми разными настроениями, никак бы не искоренила из нас этого сознания. И тогда мы будем жить действительно так, что спасение Божие будет все ближе и ближе ко всем нам. Было бы так печально прийти в монастырь – и вместо вечного освобождения обрести осуждение и погибель!
        cn: 在我离世之前，我想把这些话刻在你们的心上，好使你们真正活在上帝之中，并且你们的心思意念中不再有任何其他事物。绝不要以任何方式、绝不要让任何人从你们的属灵意识中夺去基督的爱，这爱不知嫉妒，却为每个人的得救而喜乐。这归结为：你们早晚，无论在圣堂里、在圣堂外，都当祈祷，为的是谨守上帝爱邻人的诫命。这就是我向上帝的祷告。藉着爱邻人，我们方能认识上帝的爱。当然，我希望我们每个人心中的祷告都能如泉水般涌出，以免因大量带着各样情绪的人来到我们这里所造成的世俗纷扰，绝不能将这份意识从我们心中根除。这样，我们便会真正地生活，以致上帝的救恩会离我们所有人越来越近。来到修道院却如此悲惨——不但没有获得永恒的解脱，反而招致定罪和灭亡！
    - type: paragraph
      text:
        ru: 'Итак, простите меня, что я говорю вам об этом: я живу в ожидании исхода моего. Но когда вы придете к концу ваших дней, тогда вам яснее будет мое состояние. Я сейчас живу и не живу. Мое состояние часто бывает так плохо, что я отягощаюсь жизнью и говорю Богу: «Господи, скажи мне «умри», и я умру». Но непонятным для меня образом вдруг это состояние смерти во всем моем существе сменяется молитвой и словом к вам. Как я живу – я не знаю. Почему я живу? – Может быть, потому что сердце мое не может оставить вас здесь, на Земле. Когда кто-нибудь из вас отсутствует, я все время в молитве, чтобы Бог сохранил вас всех и каждого.'
        cn: 那么，请原谅我向你们说起这些：我活着，在等待我的离世。但当你们来到你们时日的尽头时，那时你们会更清楚我的境况。我现在活着，却又仿佛没有活着。我的境况常常糟透了，以至于我被生命所累，并向上帝说：「上主啊，请祢对我说『死吧』，我便会死去。」但以我无法理解的方式，突然间，在我整个存在中的这种死亡境况，转变为祷告和对你们所说的话。我如何活着——我不知道。我为何活着？——也许是因为我的心无法将你们留在这里，在地上。当你们中的任何一人不在时，我总是处于祷告之中，祈求上帝保守你们所有人，以及每一个人。
    - type: paragraph
      text:
        ru: Конечно, мне легче говорить об этих вещах на русском языке, который усвоился мне с первых дней моей жизни. Когда я перехожу на другой язык, все время ищу, что могу я сказать на этом языке.
        cn: 当然，我更容易用俄语谈论这些事情，这门语言从我生命的最初几天起就已为我所习得。当我转换到另一种语言时，我总是在寻找我能用那种语言说些什么。
    - type: paragraph
      text:
        ru: 'Простите, расскажу вам такой комический случай. Одна дама в Москве время своего дневного туалета решила отдать на изучение испанского языка, чтобы читать в подлиннике «Дон Кихота» Сервантеса. Конечно, я не могу состязаться с Сервантесом: вряд ли найдется какая-нибудь душа, которая будет изучать русский язык, чтобы читать меня. Сервантес окажется победителем. Но все-таки и старец Силуан, иСерафим Саровский, иНил Сорский, – все они и многие другие говорили по-русски. И хорошо знать этот язык.'
        cn: 请原谅，我给你们讲一个这样的滑稽例子。莫斯科有位女士，她决定把日常梳妆打扮的时间用来学习西班牙语，以便能阅读塞万提斯《堂吉诃德》的原著。当然，我无法与塞万提斯匹敌：恐怕没有哪个人会为了阅读我的作品而去学习俄语。塞万提斯终究会是胜利者。但无论如何，圣西卢安长老、萨罗夫的塞拉芬、索尔斯基的尼尔——他们和许多其他人都讲俄语，而且他们精通这门语言。
    - type: paragraph
      text:
        ru: 'Приходят к нам люди как бы потерянные: они не знают, как приступить к жизни по Богу. И что сказать им, с чего начать? В моей жизни был случай. Некая душа была присуждена врачами к скорой смерти от всецело поразившего ее рака. Совсем больную, ее катали в кресле. И когда ей, по смертельной болезни, дана была великая схима, то она спросила меня: «Ну, что я теперь буду делать?» – Я говорю: «Смотрите на Бога и говорите Ему о своей нужде». И она начала так делать. Прошло больше тридцати лет с того времени – она живет и молится. И это живой случай.'
        cn: '有人来到我们这里，仿佛迷失了方向：他们不知道如何开始以上帝为中心的生活。那么，该对他们说什么，该从何开始呢？


          在我生命中曾有这样一个事例。有一个灵魂被医生宣判即将死亡，因为癌细胞已完全侵蚀了她。奄奄一息的她，被人推着坐在轮椅上。当她因着致命的疾病领受了大品戒时，她问我：「那么，我现在该做什么呢？」 我说：「仰望上帝，并向祂倾诉你的需要。」 她便开始照着做。从那时起，三十多年过去了——她依然活着并持续祷告。这是一个活生生的事例。'
    - type: paragraph
      text:
        ru: Когда-то я отступил от Бога, от молитвы. И потом вдруг мне было дано вернуться к Нему. Я начал молиться. И молитва вошла в меня, как вулкан, и остановить ее было невозможно. Молитва есть такое состояние, когда действительно мы можем соединиться с нашим Богом Творцом. И в этой молитве есть смысл монашества. Всякий другой образ жизни менее благоприятен для такой молитвы. Мы оставляем в стороне заботу о ком бы то ни было, в плане материальном. Это не значит, что мы никогда не помогаем материально, – мы делаем это постоянно. Но главная забота наша – не в этом, а в том, чтобы пребывать в Боге. В миру страдания – как распятие – могут удерживать людей в молитве. Но нам, монахам, надо удержаться в молитве от одного сознания, что в нас еще живет смерть, и искать, как победить эту смерть...
        cn: 曾几何时，我曾偏离上帝，偏离了祷告。然后，突然之间，我蒙受恩典回归于祂。我开始祷告。祷告如同火山一般进入我心中，并且无法阻止它。祷告是这样一种状态，在其中我们确实地能够与我们的创造主上帝合一。在这种祷告中蕴含着修道生活的意义。任何其他的生命方式都更不利于这种祷告。我们将对任何人的物质层面的关怀置于一边。这并不意味着我们从不施以物质上的帮助——我们持续不断地这样做。但我们主要的关怀不在于此，而在于恒久地住在上帝里。在世俗中，苦难——如同被钉十字架一般——能够使人持守在祷告中。但我们，作为修士，需要从一个觉悟中持守在祷告中，即死亡仍活在我们里面，并寻求如何战胜这死亡……
  - type: heading2
    text:
      ru: 'Беседа 2: О величии призвания к полноте богоподобия[6]'
      cn: 第二讲：论蒙召达致全然肖乎上帝之崇高[6]
    children:
    - type: paragraph
      text:
        ru: О совместимости повседневных работ с величием призвания. О персональности Божественной и человеческой. Усвоение принципа ипостаси чрез хранение заповедей в монашестве. О слове Христа и спасении. Наша задача – стать святыми. Величие – в смирении. Об исходе. Не снижайте объем откровения Христа. О триедином богоподобии человека
        cn: '论日常工作与神圣召叫的伟大之兼容性。

          论神性与人性的位格。

          借由在修道生活中遵守诫命，领会位格性原则。

          论基督的圣言与救赎。

          我们的任务是成为圣徒。

          伟大在于谦卑。

          论离世。

          不要削弱基督启示的丰盛。

          论人对三一上帝的肖似。'
    - type: paragraph
      text:
        ru: 'Когда я прихожу беседовать с вами – кто стали для меня ближайшими и самыми дорогими, у меня странное чувство, что жизнь ваша проходит в суете, что у нас все плохо организовано. У нас нет времени по-настоящему держать ум в Боге и делать все наши работы: кухню, уборку, прием гостей и так далее. Мне кажется, что, когда вы замучены всякими мелкими работами повседневности, говорить при этом о самых великих предметах нашей веры и нашего стремления как-то не получается: такой контраст, как будто бы нельзя «соединить».'
        cn: 当我前来与你们——在我心中已是至亲至爱之人——交谈时，我有一种奇怪的感觉，觉得你们的生活流于尘世的喧嚣，觉得我们的一切都杂乱无章。我们没有时间真正将心思置于上帝之中，同时完成我们所有的工作：厨房、清洁、接待客人等等。我觉得，当你们被各种日常琐事所缠累时，在此情况下谈论我们信仰和追求中最伟大的事物，似乎是行不通的：如此的悬殊，仿佛是无法「结合」的。
    - type: paragraph
      text:
        ru: Но с чем бы хотел я бороться, так это с идеей, что если организовать жизнь иначе, то станет более возможным богословский подход к каждому моменту, к каждому акту. Здесь было бы большой ошибкой думать, что для проникновения в тайны Божии возможно организовать какую-то школу.
        cn: 但我想要驳斥的是这样一种观念，认为如果以不同的方式组织生活，那么对每个时刻，每个行动的神学进路就会变得更有可能。在这里，认为为了深入上帝的奥秘而组织某种学校，将是一个大错误。
    - type: paragraph
      text:
        ru: Моя формация духовная всецело зависела от моей встречи с блаженным Силуаном. Этот человек, пришедший в монастырь совсем скоро после военной службы, работал на мельнице, где надо было приготовлять муку на тысячи людей. Братство монастыря достигало всецело двух тысяч, и сотни паломников постоянно приезжали и жили месяцами и годами. В этой суматохе он жил, и в этой суматохе явился ему Господь. Он не освободился от этой повседневной сутолоки, но все-таки он пережил явление Христа, и как-то сочеталось одно с другим. Его жизнь была не менее трудной, чем каждого из нас здесь. Мы видим себя в повседневности больными, усталыми, разбитыми телом. Можем ли мы сочетать это с действительным богословием? – Да, можем, если только понимать богословие как должно, а не в порядке школьной науки.
        cn: 我的灵性塑造完全取决于我与蒙福者圣西卢安的相遇。这个人，在服役结束后不久便来到修道院，在磨坊里工作，需要为成千上万的人准备面粉。修道院的修士团体总数达到两千人，还有数百名朝圣者不断前来，居住数月甚至数年。他在这种喧嚣忙乱中生活着，上主在这种喧嚣忙乱中向他显现。他并未从这日常的纷扰中解脱出来，但他仍然经历了基督的显现，而且两者以某种方式结合在一起。他的生活并不比我们这里任何一个人的生活不艰难。我们在日常生活中发现自己病弱、疲惫，身体困顿。我们能否将此与真正的神学结合起来呢？——是的，我们能，只要我们如其所是地理解神学，而不是将其作为一门学术学科。
    - type: paragraph
      text:
        ru: Из примера старца мы видим, что даже если организовать жизнь безмолвную, о которой так прекрасно говорит прп.Исаак Сирин, то еще не обязательно, что будет явление Бога нам. В этой страшной напряженной борьбе – принять сотни, многие сотни людей в монастыре и накормить их – старец мог жить одновременно идею, которую получил от видения Господня, – молиться за всего Адама, как за самого себя. Вы все отлично понимаете, что молиться за всего Адама, как за самого себя, – это есть предел совершенства на земле. Как сочеталось это величие призвания с повседневной работой – я сам не знаю.
        cn: 从这位长者的例子中我们看到，即使能安排一种寂静的生活，如圣以撒·叙利亚人对此有如此美好的论述，那也并不一定意味着上帝会向我们显现。在这可怕而紧张的斗争中——要接纳数百、甚至许多数百的人进入修道院并供养他们——这位长者却能同时践行他从主的异象中所领受的理念——即为整个亚当祈祷，如同为自己一般。你们都非常清楚，为整个亚当祈祷，如同为自己一般，——这便是世上完美的极致。这种崇高的呼召与日常工作是如何结合的——我本人也不知道。
    - type: paragraph
      text:
        ru: 'Я жил и молился, рыдал годами, но у меня было четырнадцать мелких функций на моих плечах в монастыре. И эти четырнадцать поручений не мешали мне жить непрестанно в Боге умом, потому что все я делал за послушание: добросовестно, но бесстрастно. Я не был привязан ни к чему, и мой ум мог быть свободным в Боге при всей этой массе мелких обязанностей и работ. Все это возможно, и я молюсь об этом, конечно, но и вы молитесь о том, чтобы Бог дал нам эту возможность сочетать видение Его величия и жизнь в атмосфере Его смиренной любви.'
        cn: 我生活着，祈祷着，流泪多年，但我在修道院肩负着十四项琐碎的职责。而这十四项差事并未妨碍我以心神不住地活在上帝之中，因为我所做的一切都是出于顺服：认真尽责，却无私情。我不依恋任何事物，我的心神得以在上帝之中自由，尽管有如此大量的琐碎职责和工作。这一切都是可能的，我当然为此祈祷，但你们也祈祷，求上帝赐予我们这个机会，将觐见祂的伟大与在祂谦卑的爱之氛围里生活结合起来。
    - type: paragraph
      text:
        ru: Так что если я сегодня коснусь вопроса о предельном в аскетическом мире православного монаха, то это не будет какой-то искусственной материей, но совершенно допустимой жизненной программой. Я хотел бы видеть, что ваши сердца это приняли.
        cn: 那么，如果我今天触及关于正教修士苦修世界中极境的问题，这不会是某种人为之物，而是一种全然可行的生命方案。我愿意见到你们的心领受了这一点。
    - type: paragraph
      text:
        ru: Итак, перейдем к тому, что есть человек, какие его отношения с Богом, где последние возможности для твари.
        cn: 那么，让我们来探讨人是什么，人与上帝的关系如何，以及受造物最终的可能性在哪里。
    - type: paragraph
      text:
        ru: В основе нашей христианской антропологии лежит идея, откровенная от Бога свыше, – идея богоподобия[7], причем богоподобия полного, а не частичного. Бог – надмирный, и человек, пребывая в Боге, становится надмирен. Образ и подобие Абсолюта, он носит в себе самом сознание, трансцендирующее все, что он видит в пределах земного существования. Бога христианин живет как Отца и как Персону. И себя самого осознает как личность-ипостась. По той благодати, которую мы получаем от Бога, теперь мы знаем, что Абсолютное Бытие может быть только персональным. Ибо Бог наш есть Бог Живой, Сущностный, а не отвлеченная философская идея. И человек-персона в своей персональности видит образ-отражение абсолютности Божией, еще не вполне актуализированной, но все же – глубоко осознанной.
        cn: 我们的基督教人类学的基础是这样一个理念，它是从上主而来的启示——即神肖[7]的理念，而且是完全的，而非部分的。上帝是超世的，而人，在上帝之内时，也变得超世。作为绝对者的形象与肖像，他自身怀有这样一种意识，这意识超越了他所见的一切在尘世存在范围内的事物。基督徒将上帝体验为父和位格。并将自己领悟为「人格-位格」。借着我们从上帝所领受的恩典，我们现在知道，绝对存有只能是位格性的。因为我们的上帝是活的、存有性的上帝，而非抽象的哲学理念。并且，人格化的人在他的位格性中，看到了上帝之绝对性的形象-映照，这绝对性尚未完全实现，但却已是深刻被领悟的。
    - type: paragraph
      text:
        ru: Между Богом и человеком есть и должна быть некая соизмеримость при всей несоизмеримости. Если бы мы отвергли сие откровение, то стало бы совершенно невозможным какое бы то ни было истинное познание, то есть соответствующее действительности Божественного Бытия.
        cn: 在上帝与人之间，尽管二者全然不可相称，却存在并且应当存在某种相称性。如果我们否认了这一启示，那么任何真实的认识，即任何符合神圣本体实情的认识，都将变得完全不可能。
    - type: paragraph
      text:
        ru: Мы всегда говорим о христианском персонализме. Этот персонализм христианский свое наиболее совершенное выражение имеет в молитвенном движении всеобъемлющей любви. В акте сей Христоподобной любви христианин отдает себя без остатка другим – возлюбленным. Прежде всего – Богу, а затем, силою Духа Святого, – всему прочему. В этой кенотической любви он трансцендирует самого себя. Любовь живет в другом, а не в себялюбии. И возлюбленные составляют жизнь христианина. Но, живя в другом, персона-любовь не перестает быть сама собою. Через этот выход из своих эгоистических пределов любовь приходит к обладанию всем, к единению всего в самой себе внутренне. Эгоистический индивидуализм неизбежно вносит обособление и разделение через борьбу за свое временное бывание.
        cn: 我们总谈论着基督教位格主义。这种基督教位格主义，其最完美的体现乃在于全然之爱的祷告运动中。在这种效法基督的爱之行动中，基督徒将自己毫无保留地献给他人——即那些蒙爱者。首先是献给上帝，接着则借由圣灵的能力，献给一切其余的。在这种虚己之爱中，他超越了其自身。爱寓于他者之中，而非在自爱里。而那些蒙爱者构成了基督徒的生命。然而，位格之爱虽寓于他者之中，却不停止其为自身。透过这种走出其自私界限的行动，爱便能拥有万有，达到万有在其内在的合一。自私的个人主义，却不可避免地借由为自身暂时性存在的争斗，带来孤立与分裂。
    - type: paragraph
      text:
        ru: Человек-ипостась по образу и по подобию Человеку-Христу в своей конечной завершенности явится носителем всей полноты Божественного и тварного бытия. То есть он становится богочеловеком. Во Святой Троице каждая Ипостась имеет в Себе всю абсолютную полноту двух других, не уничтожая Их, не сводя Их только к содержанию Своей жизни, но и Сама сия Ипостась входит всецело в Их бытие, утверждая тем Их ипостасность.
        cn: 依照人-基督的形象和样式的人-位格，在其最终的完成中，将显现为全部神圣与受造存有的丰满承载者。也就是说，他成为神人。在圣三一中，每个位格在自身中拥有另两个位格的全部绝对丰满，不消灭祂们，不将祂们仅仅归结为其自身生命的内涵，反而这个位格自身全然进入祂们的存有，从而确认了祂们的位格性。
    - type: paragraph
      text:
        ru: Так и во многоипостасном бытии человеческом каждая личность призвана вместить в себе всю полноту всечеловеческого бытия, никак не устраняя прочих личностей, но входя в их жизнь как существенное содержание ее. И этим движением она утверждает персональность и других. Таким образом создается единое бытие, выраженное в догмате о единой Сущности в трех Ипостасях. Человечество должно явиться единым естеством во множестве ипостасей. Такова творческая идея Бога, сотворившего человека по образу Своему и по подобию.
        cn: 同样地，在人类多重位格的存在中，每个位格都被召在自身内容纳全人类存在的全部丰盛，绝不排斥其他的位格，而是进入他们的生命，作为其本质性的内容。借由这一行动，它也肯定了他者的位格性。如此就形成了统一的存在，这在关于独一本体在三位格中的教义中有所表达。人类应当在众多的位格中显现为独一的本性。这就是上帝的创造性理念，祂是按照自己的形像和样式创造人的。
    - type: paragraph
      text:
        ru: Чрез полную веру и долгий подвиг человек должен достигнуть подобия Богу даже до тожества, сначала уразуметь и затем реализовать в своей свободе предвечный замысел о нас Творца. Таков смысл заповеди Христа:«Будьте совершенны, как совершен Отец ваш Небесный»[8]. Уклоняясь от того труда (чтобы не сказать – распятия), с которым связано осуществление богоподобия в нас, мы унаследуем могильную тьму. По данной нам свободе самоопределения мы, конечно, можем игнорировать столь высокое призвание, требующее от нас всех сил нашего существа. Но нельзя нам изменить предвечную идею, предвечный замысел Бога о нас, свести нашу природу до уровня животных, то есть временного бывания вне вечного света Божества.
        cn: 通过完全的信仰和长期的苦修，人应该达到肖似上帝，甚至达到与上帝合一的境界，首先领悟，然后在自己的自由中实现创造者关于我们预设的永恒旨意。这就是基督诫命的意义：「你们要完全，像你们的天父完全一样」[8]。逃避那项努力（更确切地说——钉十字架），即与我们内在肖似上帝之实现相关的努力，我们将继承墓穴般的黑暗。依据我们被赋予的自我决定的自由，我们当然可以忽视如此崇高的呼召，它要求我们奉献我们存在的全部力量。但我们不能改变上帝关于我们预设的永恒理念和永恒旨意，将我们的本性降至动物的水平，也就是说，在神性的永恒光芒之外，过一种暂时的存在。
    - type: paragraph
      text:
        ru: В этих формулировках сказано о самом существенном, что есть в жизни нашей. Но усваивается эта жизнь чрез хранение заповедей Христа. Условия монашества с его принципом послушания создают человека способным обнять всех в своей любви. И это мы должны сохранить в нашем монастыре. Моя молитва все время о том, чтобы каждый из нас осознал, что эта маленькая семья есть моя жизнь. И страдание или болезнь кого бы то ни было из нас есть действительно наша общая болезнь.
        cn: 在这些表述中，阐明了我们生命中最根本的。然而，这种生命是借着遵守基督的诫命得以领受的。修道生活的条件，及其顺服的原则，造就人能在其爱中拥抱所有人。而这，我们必须在我们的修道院里保守。我一直以来的祷告是，愿我们每个人都能领悟，这个小小的家庭就是我的生命。并且，我们中任何一个人的痛苦或疾病，确实是我们共同的疾病。
    - type: paragraph
      text:
        ru: 'Господь сказал апостолам: «Имейте любовь между собою, через это узнают, что вы Мои ученики»[9]. Никто кроме Христа не говорил о такой любви, о которой Он принес нам богатые откровения. И будем помнить эти слова Христа и жить ими. В таком случае и мы, скромные, маленькие, нищие люди, станем подобными апостолам первых времен. Это жизнь единая, со времени пришествия Христа на землю: она сохраняется до сих пор каждым человеком, который хочет постичь заповедь Божию.'
        cn: 上主对使徒说：「你们要彼此相爱，借此众人就认出你们是我的门徒」[9]。除了基督，没有人论及过这样的爱，祂为此给我们带来了丰盛的启示。我们也要记住基督的这些话语，且依此而活。如此一来，我们这些谦卑、微小、贫乏的人，就会变得像初代的使徒一样。这是自基督降临世上以来，一脉相承的生命：直到如今，凡是愿意领悟上帝诫命的人，仍由他们保守着。
    - type: paragraph
      text:
        ru: 'Читая Евангелие, мы стоим перед загадками, которых никак не можем понять, в которые никак не можем проникнуть. Но наша цель – понять, о чем идет речь... Можно быть простым человеком, без рефлексии на происходящее с нами, и, живя глубоко в Боге, не давать себе настоящего отчета. Я часто встречал на Афоне: монах весь в Боге, Бог с ним, но он живет просто и естественно, потому что эта жизнь для него единственная, естественная жизнь. Когда мы получаем такого порядка откровения от Бога, то мы понимаем слова Евангелия: кто отвергает Христа, будет прощен, но тот, кто отвергает слово Его, будет осужден этим словом[10]. Потому что самый великий грех, самое страшное падение – отвергнуть любовь Отца и Творца нашего, «Который так возлюбил мир, что отдал Сына Своего Единородного, дабы всякий верующий в Него не погиб, но имел жизнь вечную»[11], дабы в Нем и чрез Него, Христа, соделать каждого из нас возлюбленным сыном Отца Небесного. Все те, кто устремляются к Божественному образу бытия помимо Христа, в сущности не понимают, что влекутся они к тому небытию, из которого вызваны волею Бога. А те, кто всем лицом обратились к плоти мира сего, разлагаются заживо в крушении своих судеб или в гигантских катастрофах мировых войн и в подобном сему.'
        cn: 阅读福音书时，我们面对着一些奥秘，我们无论如何都无法理解，也无法深入其中。然而我们的目标是理解，其中所讲述的是什么... 一个人可以是简单的人，不对发生在我们身上的事进行反思，而活在上帝深处，却未能真正地反省自己。我在阿索斯圣山（Athos）经常遇到：修士全然活在上帝里，上帝与他同在，但他活得简单而自然，因为这种生活对他来说是唯一且自然的生活。当我们从上帝那里领受这类启示时，我们便理解福音书中的话语：谁拒绝基督，他将被赦免，但谁拒绝祂的话语，谁将因此话语而被定罪[10]。因为最大的罪、最可怕的堕落，就是拒绝我们父和创造主的爱——「祂如此爱世人，甚至将祂的独生子赐予，使所有信祂的人不致灭亡，反得永生」[11]，以便在祂里面，并藉着祂——基督，使我们每个人成为天父的蒙爱之子。所有那些在基督之外，追求神圣存在方式的人，实际上并不明白，他们正被吸引向那虚无，他们曾藉上帝的旨意从其中被召唤出来。而那些全然转向这世俗肉体的人，则在他们命运的崩溃中活生生地腐朽，或在世界大战的巨大灾难以及诸如此类的事情中。
    - type: paragraph
      text:
        ru: 'Когда мы носим в себе, в нашем сознании, эти евангельские слова, то всякую мысль и всякий помысл, которые соответствуют этому состоянию, мы принимаем, и все, что противоречит, мы отвергаем. И так, проникая в духовное познание не только какинтуицию, но и какуразумение, мы создаем более прочную почву для того, чтобы строить наше спасение. Перед нами открывается содержание всей космической жизни, и то, что не угодно Богу, мы должны немедленно отвергать. Господь в пустыне был искушен дьяволом. И мы видим, что Господь не остановился ни на одном предложении дьявола, но немедленно отверг их[12]. И Он наш Господь, и Учитель, и Бог. Он нам пример[13]. Вот так мы будем строить нашу жизнь, наше спасение. Все, что не соответствует сему Примеру, мы отвергаем, и все, что соответствует, мы принимаем, и это становится нашей жизнью. Если Силуану после того, как явился ему Господь, было дано иметь видение всего человеческого бытия, свойственное Христу, то и нам как ученикам его должно быть нормальным иметь это сознание. Мы сами не можем пережить явление Бога. Это слишком сильно для нас и даже для такого гиганта, как Силуан, – он говорит, что если бы продлилось видение еще один миг, то он бы умер. Эта мысль, которую сегодня хотел высказать перед вами, не усваивается за короткий момент. Если у вас будет желание слушать дальше, то я готов говорить еще и еще о том же: потому что жизнь эта настолько велика, глубока и прекрасна, что ум наш, когда увлечется этим видением святости Бога, сам становится святым.'
        cn: 当我们将这些福音的言语怀藏于心，深植于我们的意识中时，每一个与此状态相符的思想和意念，我们都接受；而一切与之相悖的，我们都弃绝。如此，我们深入属灵的认知，不仅是凭直觉，更是凭悟性，从而为建造我们的救恩奠定了更坚实的基础。整个宇宙生命的内涵在我们面前展开，而凡不蒙上帝喜悦的，我们都当立即弃绝。主曾在旷野受魔鬼的试探。我们看到，主没有接受魔鬼的任何提议，而是立即弃绝了它们[12]。祂是我们的主，是导师，是上帝。祂是我们的榜样[13]。如此，我们便将建造我们的生命，我们的救恩。凡不符此榜样的，我们都弃绝；而凡相符的，我们都接受，这便成为我们的生命。如果圣西卢安在主向他显现之后，被赐予了基督所特有的、对整个人类存有的洞见，那么，我们作为祂的门徒，也应当自然地拥有这种意识。我们自身无法承受上帝的显现。这对我们来说太强烈了，甚至对像圣西卢安那样的巨人来说也是如此——他说，如果那异象再持续一瞬，他就会死去。我今天想在你们面前阐述的这个思想，无法在短暂的时间内被领会。如果你们愿意继续听下去，我乐意就此多说：因为这种生命如此伟大、深邃而美丽，以致我们的心思，当被上帝神圣性的异象所吸引时，便也变得圣洁。
    - type: paragraph
      text:
        ru: Прославление старца связано именно с тем, что его ум был вечно в Боге, в Боге святом, и сам он стал святым. И наша задача здесь – «стать святыми». И когда перед нами стоит эта задача, тогда многие мелочи проходят незаметно. Как только теряем мы это видение Бога, так все эти мелочи принимают характер раздражительный, человек начинает отягощаться, отвергать и так далее и в конце концов теряет мысль о Боге. А если удерживать мысль о Боге, то те условия, в которых мы живем, возможны для спасения.
        cn: 一位长老受尊荣，正是由于他的心神永在圣洁的上帝之中，并且他自己也成为了圣者。而我们在此的任务是——「成为圣者」。当此任务摆在我们面前时，许多琐事就会变得无关紧要。一旦我们失去了这对上帝的洞察，所有这些琐事就会变得令人烦躁，人就开始感到重负、排斥等等，最终失去对上帝的念想。而若能持守对上帝的念想，那么我们所处的那些环境，也为救赎所可能。
    - type: paragraph
      text:
        ru: 'Я тороплюсь теперь, будучи уже немолодым, передать это вам прежде моего ухода... И я молюсь, чтобы Бог дал всем вам (и, конечно, прежде всего тому, кто несет общую жизнь на своих плечах: игумену) – мудрость и силу на усвоение этой жизни. Я хочу сказать вам такое слово: «Никому, никому на земле не дайте снижать христианскую идею! Удержите полноту видения православного!»'
        cn: 我现在急于，因我已不再年轻，在我离去之前将此传授给你们……我祈祷，愿上帝赐予你们所有人（当然，首先是那位肩负共同生活重担的人：修道院院长）智慧和力量，来领受这生命。我想对你们说这样一句话：「绝不允许地上任何人，任何人，降低基督教的理念！坚守正教的完全异象！」
    - type: paragraph
      text:
        ru: 'Пример старца Силуана для меня обязательный. Вчера я говорил об этом с англичанином, посетившим нашу обитель. И он спросил:'
        cn: 长老圣西卢安的榜样对我而言是必须遵循的。昨天我与一位访问了我们修道院的英国人谈及此事。然后他问道：
    - type: paragraph
      text:
        ru: – Не гордость ли это?
        cn: – 这不是骄傲吗？
    - type: paragraph
      text:
        ru: 'Я ему ответил:'
        cn: 我回答他：
    - type: paragraph
      text:
        ru: – Пример Христа, Который Сам есть Бог, нам говорит о возможности быть носителем полноты Божественной жизни и оставаться смиренным, как смирен сам Бог, давший нам заповедь учиться у Него смирению[14].
        cn: – 基督的榜样，祂本身就是上帝，告诉我们，我们有可能成为神圣生命的丰盛的承载者，并保持谦卑，如同上帝本身是谦卑的，祂曾赐给我们命令，要我们向祂学习谦卑[14]。
    - type: paragraph
      text:
        ru: Итак, величие жизни сохраняется в смиренном духе, а не в гордом. Любовь гордая, снисходительная оскорбляет человека. И Господь любит нас не гордой любовью, а любовью, пример которой мы можем видеть в матерях. Мать – рабыня своего ребенка, и всякое служение своему ребенку она совершает без чувства унижения. Этот пример помогает понять, что содержание нашей жизни, как бы оно ни было богато, не должно изменить в нас смиренного духа.
        cn: 因此，生命的伟大维系于谦卑的灵，而非骄傲的灵。骄傲的、居高临下的爱会冒犯人。而主爱我们，并非以骄傲的爱，而是以一种我们可以在母亲身上看到其榜样的爱。母亲是她孩子的仆役，她对孩子所做的一切服事，都没有丝毫屈辱感。这个榜样帮助我们明白，无论我们生命的内涵多么丰盛，都不应改变我们内在的谦卑之灵。
    - type: paragraph
      text:
        ru: 'Да даст мне Господь силу беседовать с вами и оставить вам как наследство, чтобы это было написано на ваших сердцах: не дайте снижать объем откровения через Христа никому. Но сознание, что ничего нет выше Христа, не должно нас сделать гордыми и снобами, ибо это никак не соответствует характеру Божией любви. Так мы должны вместить в себя то, что дал нам Господь, – это есть единственно подлинный свет вечной жизни. И мы никого «другого» не знаем и не имеем нужды знать на земле для нашей жизни, хотя можем об этом знать интеллектуально и помогать другим.'
        cn: 愿上主赐予我力量与你们交谈，并留给你们一份遗产，使其铭刻在你们的心中：绝不要让任何人削弱借着基督所启示的丰盛。然而，意识到没有什么是高于基督的，不应使我们变得骄傲和势利，因为这丝毫与上帝之爱的本性不符。因此，我们应当领受上主所赐予我们的，——这就是唯一真实的永生之光。在世上，为了我们的生命，我们既不认识任何「别的」人，也没有必要去认识，尽管我们可以在智性上了解这一点并帮助他人。
    - type: paragraph
      text:
        ru: 'При этом не надо никогда переходить на установку, как бы сказать, «комплекс преимущества», самопреувеличения и так далее. Мы должны быть свободны от этого. И надо удержать разумное сознание того, что дал нам Бог и от чего были в восторге наши отцы. ИВасилий Великийв своей Литургии говорит: Ὁ ὄντως Ὤν Θεός. В этом выражении высказывается его дух-сознание: «Вот, мы обрели, действительно, вечного Бога» – «обретохом веру истинную, нераздельней Троице покланяемся».'
        cn: 与此同时，我们绝不可陷入那种——可以说——「优越情结」、自我夸大等等的心态。我们当摆脱这一切。并且，我们当持守对上帝所赐予我们的一切，以及我们的教父们曾为此欣喜若狂的一切的理性认知。大圣巴西略在他的《礼仪》中说：「真存者上帝。」在这句表达中流露出他的心神意识：「看哪，我们确实寻得了永恒的上帝」——「我们寻得了真信仰，我们敬拜那不可分割的圣三一。」
    - type: paragraph
      text:
        ru: 'У всех нас есть интуиция, что Бог – единый и нет другого Бога, кроме истинного Творца всего этого космоса. Единый, но три Лица... Как говорится в СимволеАфанасия Великого: Бог Отец, Бог Сын, Бог Дух Святой, но не три Бога, а один Бог.И сказал Бог: СОТВОРИМчеловека по образу Нашему и по подобию Нашему, и да владычествуют они над рыбами морскими...[15],«СотворимЧЕЛОВЕКА» – это единственное число, и потом:«и да владычествуютОНИ» – множественное. Бог единый, и Он сказал: «СОТВОРИМ». И это характерно для принципа персоны. Персона не живет в себе. Отец всего Себя излил в Сына и Духа Святого. Итак, человечество становится многоипостасным, но это единый человек. И опыт нашей молитвы дает нам возможность усвоить это логически не усвояемое положение. Мы живем это через Христа, через ту молитву, которую дает Христос, распятый за всего Адама. И мы начинаем уразумевать единство человечества не потому, что это соответствует или не соответствует логике Аристотеля, а потому, что это соответствует логике бытия самого. И тогда мы переходим от обычной отвлеченной логики к логике самого бытия, как оно открывается нам. Итак, христианин не может жить в пределах логики формальной.'
        cn: 我们所有人都有一个直觉，即上帝是独一的，并且除了祂之外别无他神，祂是这整个宇宙的真实创造者。祂是独一的，却有三个位格……正如《亚他那修信经》所言：圣父上帝，圣子上帝，圣灵上帝，但并非三位上帝，而是一位上帝。上帝说：「我们要照着我们的形像、按着我们的样式造人，使他们管理海里的鱼……」[15] 「我们要造人」——这是单数，而之后「使他们管理」——则是复数。上帝是独一的，并且祂说：「我们要造。」这正是位格原则的特征。位格并非独存的。圣父将祂的全部倾注于圣子和圣灵之中。因此，人类变成了多位格的，但这仍是一个独一的人。而我们祷告的经验使我们能够理解这个逻辑上难以理解的境况。我们通过基督活出它，通过基督——那为全体亚当被钉十字架的——所赐予的祷告。我们开始领悟人类的合一，并非因为它符合或不符合亚里士多德的逻辑，而是因为它符合本体的逻辑。于是我们便超越了寻常的抽象逻辑，进入本体的逻辑，正如它向我们启示的那样。因此，基督徒不能活在形式逻辑的限制之内。
  - type: heading2
    text:
      ru: 'Беседа 3: О многоипостасном единстве всего Адама и его воплощении в монастырской жизни[16]'
      cn: 第三讲论：论整个亚当的多位格合一及其在修道生活中的体现[16]
    children:
    - type: paragraph
      text:
        ru: Завещание – единство монастыря во имя Силуана. О явлении Христа Силуану. О молитве за всего Адама, как за самого себя. Путь к вселенской молитве – «Держи ум твой во аде». Адам-человек – образ многоипостасного троического единства, который живется в Литургии. О служении монастыря. Универсализм Христа – в любви, а не в познании. Наше служение другим – в нашем единстве. Слово о Боге – океан
        cn: '圣西卢安修道院的遗训——合一


          论基督向圣西卢安的显现

          论为整个亚当祈祷，如同为自己一般

          通往大公祈祷之路——『持守你的心在阴间』

          人类，即亚当——多位格三一合一的形像，在神圣礼仪中活出

          论修道院的侍奉

          基督的普世性——在爱中，而非在认识中

          我们对邻人的侍奉——在我们的合一中

          论及上帝的言说——海洋'
    - type: paragraph
      text:
        ru: 'Во имя Отца, и Сына, и Святаго Духа Бога нашего. Да даст мне Господь силу отверсти уста и теперь, на конце дней моих, высказать вам самую глубокую мысль мою как завещание. Слово мое перед смертью полно заботы о том, чтобы монастырь не умер теперь, в периоды трудных испытаний. Никогда духовная жизнь не проходит без борьбы, но молитва, которая есть единственная основа всей нашей жизни, всегда найдет путь между всех волн. И как маленькая лодка с апостолами не погибла в море, так не погибнет и эта маленькая лодка – наш монастырь. Сейчас для меня вы – люди – составляете самое важное из того, что я оставляю, умирая. Говорю «умирая» не потому, что я сейчас умру: этого я не знаю. Но вообще, естественным образом, моя жизнь кончается. И я оставляю вас в каком-то смысле одинокими, потому что на меня выпала роль посредника между Силуаном и вами, а жизнь всех нас здесь обусловлена, конечно, нашим единством во имя Силуана. Моя молитва о том и день и ночь – говорю я ее словами или не говорю, – чтобы дал всем вам Господь состояние духовное, которое воистину является богословием человека, человеческого духа. Всем нам дал Господь великого учителя, Силуана. Если вы все будете едины, объединенные словом Силуана и духом его, то выдержите всякое нападение. И Господь защитит ваше бытие и на земле, и на небе.'
        cn: 奉我们的上帝圣父、圣子、圣灵之名。愿上主赐我力量，使我此刻，在我生命的尽头，开口向你们倾诉我最深邃的思想，作为遗嘱。我临终之言，充满着忧虑，唯恐修道院在这艰难考验的时期不会消亡。灵性生命从不离争战，然而祷告，作为我们整个生命的唯一根基，必将穿越一切波涛，寻得路径。正如载着使徒的小船未曾在海中沉没，这艘小船——我们的修道院——也必不会沉没。现在，对于我而言，你们——人——是我临终所留下的最重要的。我说「临终」，并非因为我此刻就会死去：这我并不知道。但总的来说，自然而然地，我的生命正在走向终点。我在某种意义上将你们留下，使你们孤单，因为我承担了在圣西卢安和你们之间的中介者角色，而我们所有人的生命在这里，当然，是由我们以圣西卢安之名所持的合一所决定的。我日夜的祷告便是为此——无论我口中是否道出——愿上主赐予你们所有人一种灵性状态，这状态真确是人、人的灵性的神学。上主赐予我们所有人一位伟大的导师，圣西卢安。如果你们所有人都合一，藉着圣西卢安的言语和他的精神而联合，那么你们将抵挡住一切攻击。上主必将护佑你们的存有，无论在地上，抑或在天上。
    - type: paragraph
      text:
        ru: 'В прошлом наша жизнь руководилась тем, что я воспринял от моего общения с Силуаном. Конечно, я не предполагаю сегодня говорить много о том, что писал в свое время наш блаженный отец, прославленный ныне Вселенскою Церковью: книга эта остается с вами, и главные пункты все сказаны. Не все поймут мою книгу, не легка она для всех тех, кто мало жил аскетически. Но кто знает действительно по опыту то, что пишем старец Силуан и, отчасти, я, тот поймет, что я рисовал портрет Силуана, когда говорил о богословии персоны-ипостаси. Этот пункт нелегко усваивается и просто человеческими усилиями даже и не может быть охвачен. Ибо это дается только Духом Святым как благодать свыше от Отца исходящего Света. Итак, мое завещание, и молитва, и просьба о том, чтобы все вы, на кого я оставляю будущее монастыря, были едины, как один человек. И когда у нас установится это желаемое единство в духе, тогда вся жизнь пойдет иначе, потому что все мысли, молитвы и призывания имени Бога будут совершаться в атмосфере вашего единства в Боге и через участие Силуана.'
        cn: 在过去，我们的生活由我与圣西卢安交往中所领受的来指导。当然，我今天不打算多谈我们那位蒙福的教父——他如今已被普世教会所尊崇——当年所写的一切：这本书仍与你们同在，并且所有主要观点都已阐明。并非所有人都会理解我的书，它对于那些很少过苦修生活的人来说并不容易。但凡是真正从经验中知晓圣西卢安长老，以及在某种程度上我所写内容的人，就会明白，当我谈论位格-本原的神学时，我是在描绘圣西卢安的肖像。这一点不易领会，并且仅仅凭着人的努力，甚至无法掌握。因为这唯有由圣灵赐予，作为来自上方、出自发出之光的父的恩典。因此，我的遗训、祷告和请求是，愿你们所有我将修道院的未来托付给的人，能够合一，如同一人。当我们在灵里建立起这种渴望的合一之时，那时整个生活就会截然不同，因为所有的思想、祷告和呼求上帝之名，都将在你们在上帝里的合一的氛围中，并透过圣西卢安的参与而进行。
    - type: paragraph
      text:
        ru: 'Если мы ищем воистину спасения во Христе, то нам нужно быть, как апостол Павел говорит, воистину исполненными мыслями, и чувствами, и энергией Самого Господа Иисуса Христа[17]. Я не думаю, что я безумный человек, потерявший всякую меру от какой-то гордости. Дикое слово я сказал вам: лучше было бы признавать себя безумным! Но мое безумие в вере, что в момент видения Христа Живого Силуан действительно был исполнен силою Его вечного слова. Больше того скажу вам: мне, не претендующему знать все, не пришлось видеть большего явления, чем Силуан. Если вы будете исследовать писания Святых Отцов (опять я говорю вам, что не претендую знать все), то, быть может, действительной параллели Силуану не найдете. Будучи совсем малограмотным солдатом, он увидел Христа после того, как дано ему было пережить убийственное действие богооставленности, когда «вечная погибель была совершенно ясна». Доведенный до этого предела истощания, он вошел вцерковьи увидел Христа. Все видение длилось лишь мгновение, но в этом мгновении была вечность и безмерность объятий любви Божией. Сам он пишет о том, что емухотелось страдать за Христа[18], – до такой степени он был исполнен силою любви Самого Христа – любви несозданной, любви, свойственной Самому Богу как Его атрибут! И когда вы будете читать Силуана (я бы хотел, чтоб это было постоянным вашим делом, хотя бы по нескольку строк), то увидите, что он до конца дней жил состояние вдохновения, данного ему видением Живого Христа в Духе Святом.'
        cn: 如果我们真正在基督里寻求救恩，那么我们就需要像使徒保罗所说的那样，真正地被主耶稣基督本人的思想、情感和能力所充满[17]。我不认为我是一个疯癫之人，因为某种骄傲而失去所有分寸。我对你们说了一个狂野的词：最好是承认自己疯癫！但我的疯癫在于这样的信仰，即在瞻仰活生生的基督的那一刻，圣西卢安确实被祂永恒话语的力量所充满。我还要告诉你们：对于我这个不自称无所不知的人来说，没有比圣西卢安更伟大的显现是我曾见过的。如果你们会研读圣教父们的著作（我再次告诉你们，我不自称无所不知），那么，也许你们找不到与圣西卢安真正相平行的。他本是个完全不识字的士兵，在被允许经历被上帝遗弃的致命影响之后，他瞻仰了基督，当时「永远的沉沦已完全清晰」。被逼到这枯竭的极限，他进入了教堂，瞻仰了基督。整个异象只持续了一瞬间，但在这瞬间中蕴含着上帝之爱的拥抱的永恒和无量。他自己写到，他渴望为基督受苦[18]——他如此被基督本人的爱之力所充满——那是非受造的爱，作为上帝自身的属性，唯独祂才具有的爱！而当你们阅读圣西卢安的著作时（我希望这能成为你们的日常功课，哪怕只读几行），你们就会看到，他直到生命尽头都活在那被赋予的感动状态中，那感动是由他在圣灵中瞻仰活生生的基督的异象所赐予的。
    - type: paragraph
      text:
        ru: 'Как выражалось внешне его делание? – Почти всякий вопрос, который вставал перед ним, он всегда сводил к необходимости молиться за весь мир, за всего Человека. В его сознании это выражалось по-разному. Так, он писал: «Когда я умру и явлюсь пред лицом возлюбленного Бога моего Иисуса Христа, то умолю Его за весь род христианский». Потом говорит: «Но когда увижу Его как Он Есть, от красоты Его я потеряю всякую способность думать о чем бы то ни было другом. И от великой любви ничего не смогу сказать. И опять, и опять приходит ко мне мысль: «Когда умру, явлюся пред Ним, то умолю Его за весь род человеческий»[19]. Уже не говорит «христианский», а «человеческий». В этом можно видеть, что он стал «персоной», «ипостасью», «лицом» уже в богословском смысле, как богословское понятие. Персона и мыслит, и чувствует, и живет, как Сам Христос. Итак, этот характер персоны-ипостаси во Христе выражается в молитве за весь мир, как за самого себя. Если вам Бог даст увидеть через Силуана этот момент христианской жизни, то, конечно, вы будете едино, и спасение, конечно, придет как богатое излияние Божьего Света. Путь к этому спасению указан нам тоже через Силуана Самим Христом: «Держи ум твой во аде и не отчаивайся». Никто не может понять этого выражения и онтологического содержания этих слов без опыта, данного человеку Самим Богом. Таков объем человека: он выходит за пределы всех понятий индивидуалистического порядка!'
        cn: 他的修行外在是如何体现的呢？——几乎每一个呈现在他面前的问题，他总是将其归结为为整个世界、为全体人类祈祷的必要性。在他的意识中，这以不同的方式体现。例如，他写道：「当我离世，呈现在我所挚爱的上帝——耶稣基督的面前时，我将为所有基督徒恳求祂。」接着他说：「但当我看见祂的本相时，因祂的荣美，我将失去思考其他任何事物的能力。并且因着那伟大的爱，我将无法言语。然后，那个念头又一次又一次地来到我心中：『当我离世，呈现在祂面前时，我将为全人类恳求祂』[19]。」他不再说「基督徒」，而是说「人类」。从中可以看出，他已经成为神学意义上的「人格」、「位格」、「个体」，即一个神学概念。这样的人格思考、感受并生活，如同基督祂自己。因此，这种在基督里的人格-位格的特质，就体现为如同为自己般为整个世界祈祷。如果上帝使你通过圣西卢安看到基督徒生命的这一刻，那么，你必会与之一体，并且救恩必将如上帝圣光的丰盛倾泻而至。达致此救恩的道路，也是基督祂自己通过圣西卢安指示给我们的：「将你的心智置于地狱中，却不要绝望。」除非拥有由上帝祂自己赐予人的经验，否则无人能理解这个表达及其这些话语的本体论内容。这就是人的广度：他超越了所有个人主义范畴的概念！
    - type: paragraph
      text:
        ru: 'В моем писании (жалком, конечно, по сравнению с тем, что можно было бы сделать, но все-таки) я говорю о некоторых чертах этого понятия персоны во Христе: что заключено в человеке. Ему свойственна полнота сознания всего мироздания. И сие сознание, которое мы чаем получить как спасение, идет по линии – «за всего Адама, как за самого себя». Итак, если Господь даст всем нам хотя бы некоторую аналогию этому сознанию, то мы будем едины. Единство наше будет как один человек.'
        cn: 在我的著述中（固然拙劣，与本应可成就者相比，更是如此，但终究），我论及基督内位格概念的某些特征：亦即蕴藏于人内的。他所固有的是对整个受造界意识的圆满。而此意识，我们期盼获得作为救赎的，循着「为全人类亚当，如同为自己」这一路线。因此，若上主赐予我们所有人哪怕只是此意识的某种类比，我们就将合而为一。我们的合一将如同一人。
    - type: paragraph
      text:
        ru: В предвечном совете Святой Троицы, по откровению, написано:«Сотворим человека по образу Нашему и по подобию»[20]. Не написано «сотворим людей или народы по образу Нашему», а сотворим «человека по образу Нашему и по подобию». И первый Адам, получивший это откровение, есть корень всего дерева, которое есть человечество. На этом корне мы зиждемся, и растем, и живем. И здоровье, и болезнь этого колоссального дерева отзываются на нас. Богом нам дана Божественная Литургия, совершая которую, мы постепенно проникаем в сферу Духа, где века сжимаются до потери своей долготы, где все события великого творения мира предстают нам как единый непротяженный акт. В Литургии можно действительно жить все человечество по духу Христа Бога. И это видение стало содержанием моей жизни, моего бытия.
        cn: 在圣三位一体的永恒会议中，依据启示，写道：「我们要照着我们的形象，按着我们的样式造人」[20]。没有写道「我们要照着我们的形象造人或造民族」，而是造「照着我们的形象，按着我们的样式造人」。而领受这启示的最初的亚当，是整棵树的根，这棵树就是人类。在这根上，我们立足，生长，并活着。这棵巨大之树的健康与疾病都影响着我们。上帝赐予我们神圣礼仪，借着举行这礼仪，我们逐渐深入圣灵的领域，在那里，诸世代被压缩，以至于丧失其漫长性，世界伟大创造的一切事件都以一个不延展的单一行动呈现在我们面前。在礼仪中，我们可以真正地依照基督上帝的精神活出全人类。而这异象成为了我生命、我存在的全部内容。
    - type: paragraph
      text:
        ru: Когда Господь заповедал Своим двенадцати ученикам пойти в мир, то ЧТО были эти двенадцать человек? И ЧТО есть мы здесь – одиннадцать человек? Но и мы можем быть орудием для служения миру и обрести чрез это свое спасение. Мы легко останемся едины, зная, что ничего нет большего и более близкого ко страдающему за весь мир Христу, чем то, что нам говорит Силуан. И когда мы будем едины, то крепость нашего места беззащитного, без забора, открытого для всех диких зверей, будет гораздо прочнее всех стен. И тогда наш монастырь может получить от Бога благоволение и благословение действительно послужить людям.
        cn: 当上主命令祂的十二门徒往普世去时，那这十二个人是「什么」？那我们这儿——这十一个人是「什么」呢？但我们也可以是服侍世界的工具，并借此获得自己的救恩。我们将轻易地保持合一，因为我们知道，没有什么比圣西卢安所言更伟大，也没有什么比它更能亲近那为整个世界受难的基督了。当我们合一之时，我们这毫无防备、没有围墙、向所有野兽敞开之地的坚固，将比所有围墙都要坚固得多。这样一来，我们的修道院就能从上帝那里获得恩宠与祝福，真正地服侍人群。
    - type: paragraph
      text:
        ru: 'Учение старца в каждом его писании доходит до последних пределов. Так, о покаянии он говорит, что мы каемся, мы не безгрешны, поскольку мы не достигаем того состояния, чтобы жить все человечество как содержание нашей жизни. Это есть УНИВЕРСАЛЬНОСТЬ ХРИСТА. Ее нельзя понимать как «универсализм познания», подобно тому как склонны мыслить некоторые из ученых: когда человек знает и христианство, и буддизм, иислам, и Конфуция, и марксизм, и все прочее. Универсализм – это не знание различных аспектов человеческого бытия на земле, а любовь Христа, которая объемлет все. И любовь, которая казалась мне прежде чем-то недостойным и чувствительным, потом в моем сознании раскрылась как бытийная сила, соединяющая воедино. Отец любит Сына и, конечно, любит Духа Святого, и Сын любит Отца, и Дух Святой, от Отца исходящий, конечно, смотрит на Отца. Так, эта любовь есть вечное единство Святой Троицы, и в этом общении Ипостасей заключено абсолютное бытие Бога.'
        cn: 长老的教诲，在他的每一篇著作中都达到了极致。比如，关于忏悔，他说我们忏悔，我们并非无罪，因为我们尚未达到那样的境地，将全人类视为我们生命的全部内容。这便是基督的普世性。这不能被理解为「认知上的普世主义」，如同一些学者所倾向于认为的那样：当一个人既了解基督教，又了解佛教、伊斯兰教、孔子学说、马克思主义以及所有其他事物。普世主义并非是对地上人类存在的不同方面的了解，而是基督那包罗万有的爱。而那在我看来曾是某种不配且感性的爱，后来在我意识中展开，成为一种将万物合而为一的存在性力量。父爱子，当然也爱圣灵；子爱父；而圣灵，从父发出，当然也仰望父。因此，这份爱是圣三一的永恒合一，而在这位格间的相通中，蕴含着上帝的绝对存在。
    - type: paragraph
      text:
        ru: Итак, утвердившись в учении Силуана и в его видении, выраженном в простых словах, вы будете едино и будете радоваться этому единству; и будете знать, чему учить других людей, которым Бог еще не дал сего познания. И так мы сможем служить людям, принося им Слово Жизни, Вечной Жизни; и сами спасаться через это. И когда не будет между нами недоразумений и распада нашей жизни изнутри, то, имея эту силу единства в нас самих, мы сможем принимать других людей, обращенных в православие. И доколе мы едины, наше действие будет действительно действенным. А если мы будем распадаться, то не сможем совершать наше служение должным образом.
        cn: 因此，在圣西卢安的教导和其以朴素言语表达的异象中得以确立后，你们将是合一的，并将为此合一而欢欣；并将知道如何教导那些上帝尚未赐予这知识的人。如此，我们就能服侍他人，带给他们生命之道，永生之道；并借此得以救赎自己。当我们之间不再有误解，并且我们的生命不再从内部瓦解时，那么，当我们自身拥有这合一的力量时，我们就能接纳那些皈依东正教的其他人。并且只要我们是合一的，我们的行动就将是真正有效的。但如果我们瓦解，我们就无法妥善地履行我们的服侍。
    - type: paragraph
      text:
        ru: 'Когда мы начинаем говорить о Боге, то мы стоим на берегу великого океана. И нет конца этой жизни и слову. И вместе с тем каждое слово, по существу, должно отражать целое: так же, как Бог всегда един и каждое действие Божие представляет Его в полноте. Он не делится на частицы. А делим Его мы, потому что не в силах вместить всего. И вот знайте, что для меня сейчас ваше собрание является самым дорогим местом на земле; и о нем я думаю больше всего перед уходом. Молитва моя все эти тридцать лет была только о том, чтобы Господь услыхал молитву старца: «Даждь всем народам земли познать Тебя Духом Святым». Аминь...'
        cn: 当我们开始谈论上帝时，我们就站在一片浩瀚海洋的岸边。这生命没有尽头，言语亦然。然而，每一个词语，本质上都必须反映出整体：正如上帝始终是独一的，并且祂的每一个行动都完整地彰显了祂。祂不被分割成碎片。然而，是我们分割了祂，因为我们无力完全领受。并且请你们知道，对我而言，现在你们的聚会是世上最珍贵的地方；在我离去之前，我最牵挂的就是它。我这三十年来的祷告，只为一事：愿上主垂听那位长老的祷告：「愿祢赐予地上万民借着圣灵认识祢。」 阿们……
    - type: paragraph
      text:
        ru: 'Итак, всем я приношу мою просьбу: в этот важный момент жизни нашего монастыря как-то осознать, что мы призваны единым Богом и любовью к Нему. Спасибо, что вы слушали... у меня ослабело сердце и нет сил больше говорить. Я хотел бы говорить, как огонь, но не выходит. Я – угасающий уголь, да... Но когда этот огонь прикасается к нам, тогда мы становимся способными жить и ад, и Царство Отца...'
        cn: 那么，我向所有人提出我的请求：在我们修道院生命中这个重要的时刻，某种程度上认识到我们蒙独一的上帝以及对祂的爱所召。谢谢你们聆听……我的心力已弱，再也没有力气说话了。我本想如火焰般说话，却未能如愿。我是一块正在熄灭的炭火，是的……但是当这火焰触碰到我们时，那时我们便能够经历地狱和天父的国度……
    - type: paragraph
      text:
        ru: Моя молитва о том, чтобы все мы любили и доверяли себя друг другу совершенно, кто бы ни был. Нет препятствий к доверию, когда мы едины в действии нашем.
        cn: 我祷告，愿我们所有人都能完全地彼此相爱，并彼此信赖，将自己托付给对方，无论对方是谁。当我们在行动上合一之时，信赖便毫无阻碍。
    - type: paragraph
      text:
        ru: (Братия поет кондак Пятидесятницы) «Егда языки слия, разделяше языки Вышний, егда же огненные языки раздаяше, в соединение вся призва..."
        cn: '（弟兄们咏唱五旬节颂歌）

          「当至高者混淆众语，使万民分散之时，祂却分赐火焰般的舌头，召集万有归于合一……」'
  - type: heading2
    text:
      ru: 'Беседа 4: О даре единства, о человеке в этом мире и о национализме[21]'
      cn: 讲论 4：关于合一的恩赐，关于世上之人以及关于民族主义[21]
    children:
    - type: paragraph
      text:
        ru: 'Наш монастырь – дар от Бога в стремлении к многонациональному единству. Во Христе нет ни мужеского пола, ни женского. Божия Матерь – высочайший образ Бога. Об отношении между человеком и материальным миром: мы часть тела всего Адама. Ход мысли у нас и у мира. Святогорцы о смерти. Христа не надо защищать: Он – Властелин мира. Страдания христиан – жатва святых. Еврейский национализм и истинный Мессия. Евангельский случай с хананеянкой и кесарийская исповедь Петра'
        cn: 我们的修道院——上帝在追求多民族合一中的恩赐。在基督里不分男女性别。圣母——上帝的至高形象。关于人与物质世界的关系：我们是整个亚当身体的一部分。我们与世界的思维方式。圣山修士们论死亡。基督无需被保护：祂是世界的主宰。基督徒的苦难——圣徒的收成。犹太民族主义与真正的默西亚。福音书中迦南妇人的事例与彼得在凯撒利亚的认信。
    - type: paragraph
      text:
        ru: 'Вы знаете, что у нашего Бога – «всё наоборот»,upside down, и все, что думает мир, никак не применимо к жизни христианской. Нужно знать путь до самого конца – пока не пройдем дверь во «святило Божие». И как объяснить: чем более мы внимательны ко всему, что проходит чрез наш ум в сердце, тем сильнее впечатление, что мы духовно не только не прогрессируем, но, наоборот, становимся хуже и хуже? Наша ситуация никак не улучшается. Парадоксальна сия идея – чем больше мы осознаем свое ничтожество, тем больше наш прогресс. И, таким образом, мы не видим прогресса в нашей жизни здесь. Проходят годы, и мы себя видим такими же, и еще хуже, чем прежде. И вот почему необходимо знать путь до конца.'
        cn: 你们知道，在我们的上帝那里，一切都是「颠倒的」，世人所思所想，皆无法应用于基督徒的生命。我们需要知晓这条道路，直至末了，直到我们穿过进入「上帝圣所」的门。那么，如何解释呢？我们越是留意一切进入我们心智、直至心灵的事物，就越是强烈地感觉到，我们在灵性上不仅没有进步，反而变得越来越糟？我们的境况丝毫没有好转。这个想法是矛盾的——我们越是 осозна自己的卑微，我们的进步就越大。因此，我们在此生看不到进步。岁月流逝，我们却发现自己一如既往，甚至比以前更糟。这就是为什么有必要知晓这条道路，直至末了。
    - type: paragraph
      text:
        ru: 'В гениальной книге «Лествица» прп. Иоанна есть такие слова:'
        cn: 在圣约翰的卓越巨著《天梯》中，有这样的话语：
    - type: paragraph
      text:
        ru: '«Прежде всего, честный отче, нужно нам иметь духовную силу, чтобы помогать тем, которых мы дерзнули вести во Святая Святых и покусились показать им Христа, на таинственной их и сокровенной трапезе почивающего. Ибо когда сии руководимые находятся еще в преддвериях святилища, и мы видим, что толпа хотящих им воспрепятствовать войти угнетает и утесняет их, тогда мы обязаны взять их за руку, как младенцев, и освободить от сей толпы, то есть от бесовских помыслов. А если они еще очень младенчественны или немощны, то нужно их и на плечи взять, и понести, пока они пройдут дверь сего поистине тесного входа, ибо тут обыкновенно бывает самое давление и теснота. Потому и говорил о ней некто: ...сие труд есть предо мною,дóндежевниду во святило Божие(Пс.72:16–17)"[22].'
        cn: 「首先，尊敬的教父啊，我们需要拥有属灵的力量，以帮助那些我们胆敢引领他们进入至圣所、并力图向他们展示那安息在他们奥秘而隐秘的筵席上的基督的人。因为当这些被引导者仍处于圣所的门槛时，而我们看见那群试图阻止他们进入的人正在压迫并困扰着他们，那时我们就有义务像对待婴孩一样牵着他们的手，将他们从这群人中解救出来，也就是说，从魔鬼的意念中解救出来。而如果他们仍非常稚嫩或软弱，那么就需要将他们抱在肩上，背负着他们，直到他们通过这扇真正狭窄的入口之门，因为通常正是在这里，会有最大的压迫和困境。因此，有人论及此事说：「…此事于我实属不易，直等到我进入上帝的圣所。」(诗篇 72:16-17)"[22]。
    - type: paragraph
      text:
        ru: 'Нам никогда не должно забывать, почему мы здесь, зачем мы пришли в монастырь, какая цель у нас. Потому что если мы забудем это, то жизнь наша из самой важной и святой станет ничтожной, никчемной и бесполезной. Если наш ум и сердце не стремятся к конечному моменту встречи с Богом живым для вечной жизни в Нем и с Ним, тогда наша жизнь становится будничной: мы портим свое настроение и спорим из-за пустяков, забывая великое. Но если в нас преобладает это стремление, то маленькие споры из-за мелочей не будут иметь такого сильного влияния на нашу жизнь, как до настоящего времени мы еще иногда замечаем.'
        cn: 我们绝不应该忘记我们为何在此，为何来到修道院，我们的目的是什么。因为如果我们忘记了这一点，那么我们的生命将从至关重要和神圣的，变得毫无价值、徒劳无益且毫无用处。如果我们的心志和心灵不渴求与永生上帝相遇的最终时刻，不渴求在祂内、与祂同在的永生，那么我们的生活就会变得世俗平凡：我们会破坏自己的心境，并为琐事争吵，忘记了伟大的事物。但如果这种渴求在我们里面占主导地位，那么因琐事引起的小争执就不会对我们的生活产生如此强烈的影响，不像我们至今有时仍会察觉到的那样。
    - type: paragraph
      text:
        ru: 'Перед тем, как оставить учеников и восходить к Отцу, Христос сказал: «Шедше убо научите все языки, крестяще их во имя Отца и Сына и Святаго Духа, учаще их блюсти вся, елико заповедах вам; и се Аз с вами есмь вовсядни до скончания века. Аминь»[23]. Вы видите, как думал, как мыслил Христос! Вот почему мне так дорога наша маленькая община: потому что у нас есть какое-то стремление к тому, чтобы охватить «все языки». Я благодарен Богу за то, что Он уже дал нам. И я хотел бы, чтобы все вы действительно удержали в вашем сознании дар от Бога нам за молитвы Силуана.'
        cn: 这就是为什么我们这个小团体对我如此宝贵：因为我们有一种愿望，要拥抱「万民」。我感谢上帝已经赐给我们的，也愿你们所有人真切地在意识中持守：这是上帝因圣西卢安的祷告赐给我们的恩赐。
    - type: paragraph
      text:
        ru: 'Потом апостол Павел продолжает: «...во Христе нет ни мужеского пола, ни женского»[24]. В каком смысле нет? – В высшем смысле нет. В нашем стремлении к Богу пол – явление не первостепенное: это одна из трудностей, которую мы должны перешагнуть. И тогда мы живем нормальной жизнью. Однако, как нам показал опыт, этот «прогресс» недоступен мышлению очень многих и даже благочестивых людей. Их тенденция – учитывать всегда самое низшее:ce que est le plus bas. Конечно, все мы в опасности падать, но если Бог дает иное, то почему отказываться от этого? Возьмите пример: апостола Павла осуждали очень многие – он говорит, что «только нам не разрешено иметь женщину-помощницу, а другие апостолы имеют...»[25]. Так и в суждениях о нашей обители[26]: люди хотят низвести нас на низший уровень, в яму. Но когда человек забывает половой момент нашей жизни, помня только о принципе персоны, и возносится умом к Богу, тогда это есть дар Божий, а не какой-то поганый бессмысленный риск.'
        cn: 使徒保罗接着说：「……在基督里，不分男或女」[24]。在何种意义上不分？——在更高的意义上不分。在我们寻求上帝的过程中，性别并非首要之物：这是我们必须跨越的众多困难之一。那时我们才能活出正常的生活。然而，根据我们的经验，这种「进步」是许多人甚至虔诚之士的思想所无法企及的。他们的倾向总是考虑最低层面的事物：最低的（事物）。当然，我们都有堕落的危险，但如果上帝赐予不同的恩典，我们为何要拒绝呢？举个例子：使徒保罗曾被许多人谴责——他说：「唯独我们不被允许拥有女助手，而其他使徒却有……」[25]。同样，在对我们修道院[26]的评断中：人们想把我们贬低到最低的层面，推入深渊。但当一个人遗忘我们生命中的性别因素，只记住位格的原则，并且心智升华，归向上帝时，这便是上帝的恩赐，而非某种污秽而毫无意义的风险。
    - type: paragraph
      text:
        ru: Как тогда те, кто мыслят еще по-плотски, могут молиться Божией Матери? Получается, что в отношении к Божией Матери есть еще этот человеческий элемент у многих. Но по существу – Она ведь есть высочайший образ Бога, которыйau-delà, за пределами всех этих мелких явлений. Почему не рискнуть нам, со слезами, со страхом, вступить на этот путь, чтобы понять величие Божией Матери? Тогда мы будем Ей молиться не какNotre Dame(«Нашей Даме»), но как Существу, в высшей степени обоженному и подобному Богу.
        cn: 那么，那些仍然凭肉体来思考的人，如何能向圣母祷告呢？由此可见，在对待圣母的态度上，许多人仍然带有这种人的成分。但就其本质而言，她却是上帝至高的形象，她超越了、凌驾于所有这些微不足道的现象之上。我们为何不带着眼泪，怀着敬畏之心，踏上这条道路，去理解圣母的伟大呢？那时，我们将向她祷告，不再视她为「我们的夫人」（Notre Dame），而是一位在最高程度上被神化并与上帝相似的存在者。
    - type: paragraph
      text:
        ru: Прежде, чем прийти сюда, я подумал попросить вас всех написать мне, какой вопрос перед вами стоит в данный момент, чтобы мне говорить о том, что реально, практически занимает нас. И вот я получил записку, большими французскими буквами:«Question. La relation entre l’homme et le monde matériel»[27].
        cn: 在来这里之前，我曾想请你们所有人都写信告诉我，你们目前面临着什么样的问题，好让我所谈论的，是真正、实际地关乎我们的。于是我收到了一张纸条，上面用大写的法文写着：「问题。人与物质世界的关系」[27]。
    - type: paragraph
      text:
        ru: 'Такой вопрос мог бы стать темой для доктората, и невозможно на него ответить за несколько минут. Когда я получил эту записку, мне вспомнился момент, когда я жил в келье в километре от монастыря, чтобы иметь возможность вести жизнь безмолвника. Однажды, когда я уходил в свой «исихастирион», старец Силуан спросил меня:'
        cn: 这样的问题足以成为一篇博士论文的题目，不可能在几分钟内给出答案。当我收到这张便条时，我忆起一段往事：那时我住在离修道院一公里外的一间小室里，以便能过上静默修行者的生活。一天，当我走向我的「静修所」时，圣西卢安长老问我：
    - type: paragraph
      text:
        ru: – Ну как?
        cn: ——怎么样？
    - type: paragraph
      text:
        ru: 'Я отвечаю ему:'
        cn: 我回答他：
    - type: paragraph
      text:
        ru: – Я молюсь, и мне кажется, что я забываю мир, но я чувствую тело свое.
        cn: ——我祷告，我觉得我忘记了世界，但我感觉到我的身体。
    - type: paragraph
      text:
        ru: 'Тогда Силуан говорит:'
        cn: 于是圣西卢安说：
    - type: paragraph
      text:
        ru: – А что такое тело наше, как не этот мир?
        cn: ——我们的身体，不就是这世界吗？
    - type: paragraph
      text:
        ru: 'Подумайте: годами мы разделяем общую трапезу – все мы едим одну и ту же пищу, которая готовится для всех нас. И тело, хотя у каждого свое, но составлено оно из тех же элементов, как у других. И эта короткая беседа старца обнаруживает эту же мысль и также открывает нам огромную картину: тело наше, состоящее из тех же элементов, есть часть колоссального дерева – человечества. Значит, если мы не забываем нашего тела, это и есть «мир». И когда мы мыслим таким порядком, наша жизнь перестает быть банальной, и приходит сознание, о котором говорит Силуан, наш отец: молитва за все «тело», за всего Адама[28].'
        cn: 试想：多年来，我们共享同一餐食——我们所有人吃的都是同样的、为我们所有人预备的食物。我们的身体，尽管每个人都有自己的，但它却是由如同他人的身体一样的元素构成。这位长者的简短谈话揭示了同样的思想，也向我们展现了一幅宏伟的图景：我们由同样的元素构成的身体，是人类这棵庞大树木的一部分。这意味着，如果我们不忘记我们的身体，这便是「世界」。当我们以这种方式思考时，我们的生活就不再平庸，并生发出我们的教父圣西卢安所说的一种意识：为整个「身体」——为全人类亚当[28]——而祷告。
    - type: paragraph
      text:
        ru: Скажу вам страшную вещь. Когда мы живем как христиане в этом мире, то мы убеждаемся, что мышление этого мира нигде не совпадает со Христом и ход нашего мышления никак не совпадает с мышлением этого мира. Недавно мы читали в житииПахомия Великого, что когда та или иная эпидемия уносила много жизней монахов, то они считали это жатвой святых. А для других – это несчастье...
        cn: 我要告诉你们一件令人震惊的事。当我们作为基督徒生活在这世上时，我们确信这世界的思想在任何方面都与基督不思想不符，并且我们思想的方式绝不与这世界的思想相符。最近我们读到在大圣帕科米传中，当这样或那样的瘟疫夺去许多修士的生命时，他们认为那是圣徒的收割。然而对其他人来说，这却是灾祸……
    - type: paragraph
      text:
        ru: 'В начале войны, когда была уже угроза нашествия немцев и болгар в Грецию, вспомнилось какое-то пророчество о том, что придут враги и изобьют всех святогорцев-монахов. И какие реакции! Я был еще в монастыре. Все боялись этого времени. И мой духовник, архимандрит Кирик, говорит:'
        cn: 在战争之初，当德国人和保加利亚人入侵希腊的威胁已经出现时，有人想起了一个预言，说敌人会来并殴打所有圣山修士。反应何其强烈啊！我那时还在修道院里。所有人都害怕那个时刻。而我的精神导师，院长基里克，说：
    - type: paragraph
      text:
        ru: – О-о-о-о-о, с нами этого не будет! Это было с Пахомием, с другими монахами-отцами за их святую жизнь. А как мы живем, так можем быть уверены, что Господь этого нам не попустит!
        cn: – 噢，不不不不不，这事不会发生在我们身上！这事发生在了帕霍米（Pachomius）身上，也发生在了其他修道父老身上，因为他们圣洁的生活。至于我们是如何生活的，我们大可以确信，主不会容许这事临到我们！
    - type: paragraph
      text:
        ru: 'Я вышел на пустыню, и вот один из карульцев говорит:'
        cn: 我到了旷野，看哪，一个卡鲁尔人说：
    - type: paragraph
      text:
        ru: '– А когда они придут меня резать, я скажу: дайте мне ваше оружие поцеловать прежде, чем оно убьет меня!'
        cn: – 当他们前来宰割我时，我将说：请让我在它杀我之前，亲吻你们的武器！
    - type: paragraph
      text:
        ru: 'Был у меня монах, послушник одного замечательного подвижника Калиника. И мы разговаривали об этом предмете. Он и говорит:'
        cn: 我曾有一位修士，他是杰出苦行者卡利尼克的一名初学修士。我们谈论起此事。他就说：
    - type: paragraph
      text:
        ru: '– Вот что я думаю: если они придут, надо, чтоб они нас всех зарезали. Но только дома и книги оставили бы.'
        cn: ——我是这样想的：如果他们来了，就应该让他们把我们所有人都杀了。但只留下房屋和书籍就好了。
    - type: paragraph
      text:
        ru: – Почему так? – спрашиваю я.
        cn: – 为什么会这样？ – 我问道。
    - type: paragraph
      text:
        ru: '– Потому что, когда они увидят наши дома и книги, скажут: здесь были святые люди... Но, если останется хотя бы один из нас в живых, он научит всех их презирать: все эти книги, все это святое...'
        cn: ——因为，当他们看到我们的房屋和书籍时，就会说：这里曾有圣人……但是，如果我们中哪怕只剩下一个人活着，他就会教唆他们所有人轻蔑：所有这些书籍，所有这些神圣之物……
    - type: paragraph
      text:
        ru: 'Или возьмем тот факт, что евреи в Иерусалиме не хотят иметь Гроб Христа и не терпят присутствие христиан. Как можно относиться к этому явлению? Можно отрезать себя от других и поставить себя в условия всей иудейской истории и всех евреев вообще – с горькими моментами гонений и презрений и теперешней их огромной силой и влиянием. Психологически мы, может быть, и поймем их. Но когда мы знаем, что Христос есть Бог, «Имже вся быша», тогда реакция наша другая. Она не есть односторонний подход. Где сознание тех евреев, которые делают зло, обладая в какой-то исторический момент реальной силой разрушать? Против кого они борются? Мы видим, что они во мраке. И если так, то гораздо больше оснований рыдать и плакать за евреев, чем за христиан, потому что евреи не познали Христа и до сих пор ведут себя по отношению к Нему, как будто бы это какой-то еврей, который смутил мир[29]. Нет, это Бог, Который сотворил нас и все прочее: «Имже вся быша».'
        cn: 或者我们来看这个事实，即在耶路撒冷的犹太人不希望拥有基督的圣墓，并且不能容忍基督徒的存在。我们该如何看待这种现象？我们可以将自己与他人隔绝，并将自己置于整个犹太历史以及所有犹太人的普遍处境之中——带着他们被压迫和受蔑视的苦涩时刻，以及他们现今巨大的力量和影响力。从心理层面，我们或许会理解他们。但当我们知道基督是上帝，「万物藉祂而生」，那么我们的反应就不同了。这不是一种片面的看法。那些在某个历史时刻拥有真实毁灭力量而作恶的犹太人，他们的意识在哪里呢？他们究竟在对抗谁呢？我们看到他们身处黑暗之中。既然如此，就有更多的理由为犹太人哭泣和哀恸，而不是为基督徒，因为犹太人尚未认识基督，并且至今仍然对待祂，好像祂只是某个搅扰世界的犹太人[29]。不，这位是上帝，祂创造了我们和一切其他的事物：「万物藉祂而生」。
    - type: paragraph
      text:
        ru: 'И защищать Христа у нас нет нужды, потому что, как Он сказал в Евангелии: «Дадеся Мне всякая власть на небеси и на земли»[30]. За истекшие семьдесят лет гуманисты-коммунисты в сознании своей правды гнали Церковь и Христа. Но сломались в конце концов – они, а не Христос. Так будет со всяким народом, со всяким человеком, который пойдет на брань со Христом. Весь космос в Его руке, в Его власти: «Дадеся Мне всякая власть на небеси и на земли». Значит, когда нас гонят и убивают, то это как историческое явление можно жить трагически. Но, с другой стороны, Господь собрал, может быть, сорок миллионов мучеников из России за эти семьдесят лет. И если бы нам было дано это видение спасенных, то мы забыли бы все страдания, перенесенные за это время.'
        cn: 我们无需保卫基督，因为正如祂在福音书中所说：「天上地下所有的权柄都赐给我了」[30]。在过去的七十年里，人文主义的共产主义者们自以为是地迫害了教会和基督。但最终是他们，而不是基督，崩溃了。任何民族，任何个人，凡是与基督争战的，都将如此。整个宇宙都在祂手中，都在祂的权柄之下：「天上地下所有的权柄都赐给我了」。那么，当我们被逼迫和杀害时，这作为一个历史现象，可以被悲剧性地经历。但是，另一方面，上主在这七十年里，或许从俄罗斯召集了四千万殉道者。而如果赐予我们得以一窥这些蒙救赎者的景象，我们就会忘记在这段时间里所承受的一切苦难。
    - type: paragraph
      text:
        ru: 'Первые три века дана была благодать страдать за Христа, за исповедание Его Божества. Еще мальчиком в школе я слушал священника, который говорил нам, маленьким детям, о мучениках первых веков. Это был молодой и прекрасный священник с академическим образованием. Слушая его, я подумал: как жалко, что теперь гонения против христиан стали невозможны и нельзя стать мучеником за Христа. И что же? – Прошло несколько лет, и вдруг начинается гонение, которому не было равного в истории: по жестокости, по безумию, по уверенности, что они гонят зло. Семьдесят лет – и потом рухнуло это. Вот, была дана возможность страдать и умирать за Христа. Во всех лагерях ГУЛАГа были прежде всего христиане.'
        cn: '最初的三个世纪，曾赐予了为基督受苦、为宣认祂的神性的恩典。我还是个在校的小男孩时，曾听一位司祭向我们这些小孩子们，讲述最初几个世纪的殉道者。那是一位年轻、出色的司祭，拥有学术背景。听着他的话，我心想：多么可惜啊，现在对基督徒的迫害已不可能发生，也无法再为基督殉道了。


          结果呢？——几年过去了，忽然间，一场迫害开始了，其残酷、其疯狂，以及他们确信自己正在驱逐邪恶的那种笃信，在历史上都无出其右。七十年——之后，它就崩溃了。看哪，为基督受苦并殉道的机会曾被赐予了。在古拉格的所有营地里，首要的都是基督徒。'
    - type: paragraph
      text:
        ru: В чем скандал между евреями и Христом? Они по ошибке ждали Мессию только для еврейского народа. И если этот Христос относится ко всем народам одинаково, Он не настоящий Мессия. А Христос пришел для всего мира. И первый Собор, который описан в Деяниях Апостолов[31], говорит, как апостолы разорвали узкое восприятие «Христа как Мессии только для евреев».
        cn: 犹太人与基督之间的冲突何在？他们错误地以为默西亚只为犹太民族而来。而且如果这位基督对待所有民族都一视同仁，祂就不是真正的默西亚。然而基督却降临是为了整个世界。而第一次大公会议，记载于《使徒行传》[31]中，讲述了使徒们如何打破了「基督是仅仅为犹太人而来的默西亚」这种狭隘的认知。
    - type: paragraph
      text:
        ru: 'Очень хорошо описан этот случай в Евангелии, когда апостолы шли в Кесарии и женщина кричала: «Помилуй меня, моя дочь больна»[32]. Христос тогда уходил из Иерусалима, где все богословы и книжники говорили апостолам: «Он не может быть Мессией, Он пришел для всех народов, но Писание говорит, что Мессия обетованный есть тот, кто придет только для евреев». И Господь боролся с этим искушением апостолов косвенно через эту женщину: «Я не пришел к самарянам, Я пришел только к погибшим чадам Израиля»[33]. Но на самом деле Христос так не думал. В этой короткой истории запутано много – длительный спор о том, как понимать Мессию. И когда Он уже исцелил дочь ее, сказав женщине: «Велика твоя вера, будет тебе, как ты хочешь», тогда Он спросил: «А вы за кого принимаете Меня?» И Петр сказал: «Ты – Христос, Сын Бога живаго»[34]. Страшно интересное и важное место Евангелия: только после того как апостолы исповедали Христа как Сына Бога живаго, Господь сказал: «ТЕПЕРЬ среди вас есть некоторые, которые увидят Царство, пришедшее в силе». И после этого Евангелие молчит: шесть дней они молча шли до Фавора. И уже на Фаворе, в нетварном Свете, они услышали голос Отца: «Сей есть Сын Мой возлюбленный, послушайте Его»[35].'
        cn: 这件事在福音书中记载得非常详尽，当时使徒们走到凯撒利亚，有个妇人喊着说：「可怜我吧！我的女儿病了。」[32]当时基督正离开耶路撒冷，那里的神学家和经师们都对使徒们说：「他不可能真是默西亚，他为所有民族而来，但圣经说，那应许的默西亚只为犹太人而来。」上主便间接地通过这妇人来与使徒们的这个诱惑搏斗，说：「我不是为撒玛利亚人而来，我只为以色列家迷失的羊而来。」[33]但实际上基督并非如此想。在这简短的故事中，许多事情交织缠绕——一个关于如何理解默西亚的长期争论。当祂已经治好那妇人的女儿，并对妇人说：「妇人，你的信德是大的！照你所愿的，给你成就吧。」随后祂便问道：「你们说我是谁呢？」伯多禄回答说：「祢是基督，是永生上帝之子。」[34]福音中一个极其有趣且重要的部分是：只有在使徒们认信基督是永生上帝之子后，上主才说：「如今，你们中间有些人，必会看见那带着能力而来的王国。」此后福音书便保持沉默：他们默默地走了六天，直到大博尔山。而到了大博尔山上，在那非受造之光中，他们听到了父的声音说：「这是我的爱子，你们要听从祂！」[35]
    - type: paragraph
      text:
        ru: Когда наша жизнь основана на том, что Христос есть не какой-то пророк, а наш Творец и Бог, создавший нас по образу Своему и по подобию, тогда ясно, почему заповедал апостол Павел:«Не о себе только каждый заботься, но каждый и о других. Ибо и в вас должны быть те же чувствования, какие и во Христе Иисусе. Он, будучи образом Божиим, не почитал хищением быть равным Богу, но уничижил Себя Самого, приняв образ раба, сделавшись подобным человекам и по виду став как человек; смирил Себя, быв послушным даже до смерти, и смерти крестной»[36].
        cn: 当我们的生命建立在基督并非某个先知，而是照着自己的肖像和样式创造了我们的创造者和上帝这一事实之上时，那么，使徒保罗为何如此诫命就清楚了：「各人不要单顾自己的事，也要顾别人的事。你们当以基督耶稣的心为心。祂本有上帝的形像，不以自己与上帝同等为强夺的，反倒虚己，取了奴仆的形像，成为人的样式；既有人的样子，就自己卑微，存心顺服，以至于死，且死在十字架上。」[36]
    - type: paragraph
      text:
        ru: У нас должны быть те же мысли, что мы видим и во Христе, Боге нашем, то есть мы должны мыслить так же, как Сам Бог. Если мы будем помнить, что через сохранение заповедей Он будет с нами неотлучно, то тогда наша жизнь примет совсем другой характер. Но если мы забудем об этом, то жизнь наша станет никчемной, бедной, никуда не годной.
        cn: 我们应当怀有那我们在我们的上帝基督里所见的同样意念，也就是说，我们应当像上帝本身那样思考。如果我们牢记，借着遵守诫命，祂将永不分离地与我们同在，那么我们的生命将呈现出截然不同的特质。但如果我们忘记这一点，那么我们的生命将变得毫无价值、贫乏不堪、一无是处。
    - type: paragraph
      text:
        ru: 'Дай Бог нам всем никогда не потерять вдохновения следовать за Христом. Господь говорит: «Аз есмь Путь». Как Он страдал в этом мире, так и мы неизбежно должны страдать, если мы исполнены желания следовать за Ним. Нам невозможно избежать страданий, если мы хотим быть христианами. И тогда, может быть, мы поймем, Кто Сей – Христос, и увидим Свет Нетварный, и тогда вся наша жизнь станет преображенной... Да будет нам так. Когда мы сами будем жить этой жизнью, мы поможем другим спасаться.'
        cn: 愿上帝恩赐我们所有人，永不失去跟从基督的灵感。主说：「我就是道路。」祂如何在世上受苦，如果我们充满渴望跟从祂，我们也必将受苦。如果我们想成为基督徒，便无法避免受苦。那么，也许我们就会明白，这位基督是何许人也，并看见非受造之光，届时我们整个生命就将得到转化……愿我们如此。当我们亲身活出这生命时，我们就会帮助他人得救。
    - type: paragraph
      text:
        ru: Мы читали теперьСимеона Нового Богослова. Как проповедовать ТАКОГО Христа? Это невозможно... Надо, чтобы и вселенский Патриарх, и каждый епископ, и каждый монах носили в себе молитву за весь мир, как за самого себя. Впереди еще колоссальное расстояние, которое нам нужно пройти, чтобы произошла перемена всего сознания, когда человек, по образу Христа мыслящий, жил бы все человечество и даже Бога в самом себе. И тогда наша жизнь вовсе не будет глупой и бессмысленной, а исполненной всякого разума и вдохновения.
        cn: 我们现在读了新神学家西默盎。如何宣讲这样的基督？这是不可能的……需要普世牧首、每一位主教和每一位修士都在自身内承载着为整个世界的祈祷，仿佛为自身一般。前方还有巨大的距离，是我们需要跋涉的，为了使整个意识发生转变，届时，那依照基督形象思想的人，将在自身内活出全人类，甚至活出上帝。届时，我们的生命将绝不会是愚蠢和毫无意义的，而是充满着一切理智与灵感的。
  - type: heading2
    text:
      ru: 'Беседа 5: О смертной памяти, слове Христа и богоподобии[37]'
      cn: 第五讲：论死亡记忆、基督圣言与肖似上帝[37]
    children:
    - type: paragraph
      text:
        ru: О смертной памяти. Смерть – плод греха. Христос «погасил» грех Адама. О подражании Христу и Его слову. Молитва и Литургия как вечная жизнь. «Если кто в Боге, тому нет нужды читать книги». Наше общение через молитву. О хранении совести по отношению к вещам
        cn: '关于对死亡的记忆。

          死亡是罪的果实。

          基督「熄灭」了亚当的罪。

          关于效法基督和祂的话语。

          祷告和礼仪如同永生。

          「若有人在上帝里，就无需阅读书籍。」

          我们通过祷告进行的交通。

          关于在对待事物上保守良心。'
    - type: paragraph
      text:
        ru: 'Когда, по Промыслу Божию, мне была дана смертная память, еще не понимая ничего, я жил это так: я умираю, перехожу в небытие. Что такое «небытие»? – Отсутствие всякой энергии жизни, отсутствие сознания. И тьма потерянного сознания пугала меня: если я действительно умираю, то что будет со всем, что я познал? А мне было дано жить в то время величественную картину космического бытия. И для меня, в пределах моей персоны, умирает весь мир, если есть смерть. Она была для меня событием чрезвычайной важности, через которое я воспринимал бытие мира: есть жизнь или есть только смерть, когда все – и Бог, и космос – только преходящие явления. Иначе говоря: как возможно, чтобы человек умер?'
        cn: 按着上帝的旨意，当必死之念被赐予我时，我尚不明白任何事，我如此体验着它：我正在死去，我归于虚无。何为「虚无」？——是任何生命能量的缺席，是意识的丧失。而丧失意识的黑暗令我恐惧：若我确实死去，那我所认识的一切将何去何从？那时，我蒙恩体验到宇宙存有的宏伟景象。对我而言，在我个人范畴内，若死亡确实存在，则整个世界随之死去。对我而言，那是极其重要的事件，我借此感知世界的存有：究竟是生命存续，抑或只有死亡，当一切——无论是上帝还是宇宙——都不过是转瞬即逝的现象时。换言之：人怎能死去呢？
    - type: paragraph
      text:
        ru: 'И Христос пришел к нам и показал, ЧТО есть человек в сознании нашего Бога Отца и Творца. Конечно, смерть не существует: Бог не создавал смерти. Однако Он сказал Адаму, что жизни кроме Него нет. «И если ты съешь от этого дерева познания добра и зла, от которого Я тебе говорю: не ешь, то ты умрешь, оторванный от Меня»[38]. Для меня как христианина весь мир живет только потому, что Господь произнес известные слова: «Да будет свет», «Да будет твердь» и так далее[39]. И весь мир есть не что иное, как результат Его воли, Его мышления. Из всего хода событий мы видим, что для создания бессмертного человека нужно, чтобы он прошел и негативный опыт. По смыслу Откровения и как говорит Василий Великий в своей Анафоре, «в соблюдении заповедей была наша вечная жизнь». И если мы нарушим заповедь, то мы теряем Бога и вечную жизнь.'
        cn: 基督来到我们中间，并向我们启示，在我们的上帝、父和造物主的意识中，人究竟是什么。当然，死亡并不存在：上帝并未创造死亡。然而祂对亚当说，除祂以外，没有生命。「你若吃了这分辨善恶树上的果子，就是我吩咐你不可吃的，你就必死，与我隔绝」[38]。作为基督徒的我而言，整个世界之所以存活，仅因上主发出了著名的言语：「要有光」、「要有穹苍」等等[39]。整个世界无非是祂的旨意和祂的心思的产物。从所有事件的进程中，我们看到，要创造不朽的人，他需要经历负面体验。按照启示的意义，并且正如大巴西略在他的圣祭祷文中说：「我们的永恒生命在于遵守诫命。」而如果我们违犯诫命，那么我们就会失去上帝和永恒的生命。
    - type: paragraph
      text:
        ru: 'Нам очень трудно понять ход творения человека: почему нужны такие болезни, такие страдания всей твари? Многие, конечно, мыслят, что лучше было бы не создавать такого мира, где все страдают и все умирает.'
        cn: 我们非常难以理解人的受造历程：为什么会有这样的病痛，以及临到一切受造物的如此苦难？当然，许多人认为，最好不要创造这样一个万物受苦并死亡的世界。
    - type: paragraph
      text:
        ru: 'Но для нас этот вопрос стоит иначе. О грехопадении сказано, что «плод запрещенного древа показался Еве прекрасным на вид и приятным на вкус»[40]. И вот это явление привело к смерти. А Господь, придя на землю спасти нас, умирает, чтобы погасить грех Адама. Один из самых замечательных тропарей, которые мы поем Постом: «Иже в шестый день же и час на Кресте пригвождей в раи дерзновенный Адамов грех». Чем замечателен этот тропарь? – Он говорит нам о том, в каком настроении и с какой мыслью шел Христос на Крест: страданием и смертью погасить услаждение, которое послужило причиной падения. Мы не понимаем, почему нужны страдания. Так много останется еще для нас неясным, но мы принимаем бытие, которое нам дано, как оно есть.'
        cn: 但对我们而言，这个问题则另当别论。论及堕落，经上说：「那禁树的果子在厄娃看来悦人眼目，尝来甘美宜人」[40]。而正是这一现象引致了死亡。主降临世间拯救我们，受死，为要平息亚当的罪。我们大斋期所咏唱的最美妙的圣歌之一是：「祢在第六日，第六时，于十字架上钉死亚当在乐园中恣意妄为的罪孽。」 这首圣歌为何如此美妙？——它告诉我们基督是怀着怎样的心情和意念走向十字架的：祂要以受苦和死亡来平息那曾作为堕落之因的享乐。我们不明白为何需要苦难。对我们而言，仍有如此多的事情模糊不清，但我们接受这如其所是地被赐予我们的存在。
    - type: paragraph
      text:
        ru: 'По-разному люди толкуют наше бывание-existence; но для нас, христиан, конечно, основание для всех решений – Сам Христос, и мы следуем по Его стопам. Великий апостол Павел оставил замечательное слово: «В вас должны быть те же чувствования и мысли, что во Христе»[41].'
        cn: 人们以不同的方式诠释我们的存在（бывание）；但对于我们基督徒而言，当然，所有决定的基础是基督祂自己，我们追随祂的足迹。伟大的使徒保罗留下了一句卓越的话语：「在你们里面，当有与基督耶稣同样的情怀和心思。」[41]
    - type: paragraph
      text:
        ru: Поэтому не соблазняйтесь, если я буду говорить о Христе как о первом «примере»[42]для нас. Теперь, кончая мою жизнь, я хочу вам отдать мою жизнь в плане духа.
        cn: 因此，若我将基督称为我们首要的「榜样」[42]，你们不必困惑。现在，在我生命行将结束之际，我愿将我的属灵生命给予你们。
    - type: paragraph
      text:
        ru: 'Господь говорит, что «небо и земля прейдут, слова же Мои не прейдут»[43]. Слово не есть только простое содрогание атмосферы. Слово есть подлинная жизнь: Вечная Жизнь. И если мы говорим в перспективе Евангелия, то и наше слово не умирает. Слово есть Жизнь и Дух, и то, что оно выражает, пребудет с нами, даже когда мы оставим это тело.'
        cn: 主说：「天地都要过去，我的话却永不废去」[43]。话语不只是大气的简单震动。话语是真实的生命：永恒的生命。如果我们是从福音的角度来说，那么我们的言语也不会消亡。话语是生命和灵，以及它所表达的，会与我们同在，即使我们离开这身体。
    - type: paragraph
      text:
        ru: Я немножко в страхе – быть понятым неверно. Говоря о Христе как примере для нас, я подразумеваю, что если мы мыслим так, как заповедал Господь, то мышление наше уже не есть наше человеческое, а мышление Самого Бога. Хотя я не могу сказать, как Христос, что «мое слово не прейдет», но если я говорю согласно Его слову, предложенному нам как путь ко спасению, то и я, как человек, могу сказать, что все видимое – и небо, и земля – прейдет, но те слова, которые мы имеем как нашу жизнь, не прейдут. Ибо то, что Господь называет Своим Словом, для меня есть Его дар. Всем нам, монахам, надевшим это одеяние черное, надо иметь сознание того, что мы должны ассимилировать и воспринять жизнь и мышление Самого Христа; стать с Ним, действительно, как дети с отцом и ученики с учителем, то есть способными жить жизнью Самого Бога. И когда мы войдем в Его жизнь полностью, то, конечно, это будет «обожение».
        cn: 我有点害怕——怕被误解。当我说基督是我们的榜样时，我指的是，如果我们的思想如同主所吩咐的那样，那么我们的思想就不再是属人的，而是上帝本身的思想。虽然我不能像基督那样说「我的话永不废去」，但如果我所说的是依照祂的话语——那作为我们得救之路而赐予我们的话语——那么我，作为一个凡人，也可以说，一切可见之物——包括天和地——都将过去，但那些我们作为生命所拥有的言语，却永不废去。因为主所称作祂自己的「道」，于我而言，就是祂的恩赐。我们所有身披这黑色僧袍的修士，都当意识到我们必须融会贯通并领受基督本身的生活和思想；真正地与祂合一，如同儿女与父亲，学生与老师，也就是说，能够活出上帝本身的生活。而当我们完全进入祂的生命时，那当然就是「神化」了。
    - type: paragraph
      text:
        ru: 'Критерием всего является Слово-Христос. Апостол Павел говорит, что все подвергнется испытанию огнем[44]. И если наше слово верно, то оно не может сгореть, ибо речь идет о вечной жизни в Боге, а не о чем-нибудь другом. И если мы носим в себе это сознание, то мелочи жизни повседневной перестанут действовать на нас убийственно. Когда мы молимся Богу и молитва наша переходит известную грань, становясь действительным погружением в Бога, тогда мы соединяемся с Богом в самой жизни нашей. Так, молитва наша есть единственный путь для соединения с Богом – путь самого бытия. Говоря слова: «Отче наш», надо помнить, что мы обращаемся к ОТЦУ: Самому Отцу Иисуса Христа. И если мы полностью живем слова «Отче наш», то эта молитва содрогает все наше бытие. Так, те молитвы, которые мы произносим в храмах за Литургией, – есть вечная жизнь, которую принес нам Господь.'
        cn: 一切的标准就是圣言——基督。使徒保罗说，一切都将受火的考验[44]。并且，如果我们的言语是真实的，它就不能被烧毁，因为它关乎在上帝里的永恒生命，而非关乎别的什么。并且，如果我们里面存有这种意识，那么日常生活的琐事就不会再对我们产生致命的影响。当我们向着上帝祷告，并且我们的祷告超越了某个界限，真正地沉浸在上帝之中时，那时我们就在我们生命本身之中与上帝结合。因此，我们的祷告是与上帝结合的唯一道路——是存在之途。当我们说出：「我们的天父」这些话时，必须记住，我们是向着『父』——耶稣基督他自己的父说话。并且，如果我们完全活出「我们的天父」这些话语，那么这个祷告就震撼我们全部的存在。因此，我们在圣堂中在神圣礼仪中诵念的那些祷告，就是上主带给我们的永恒生命。
    - type: paragraph
      text:
        ru: И тогда наши отношения ко всему происходящему будут исполнены серьезного сознания важности каждого человека, важности каждого жеста, важности всякого общения с другим человеком! Весь процесс нашей жизни, и особенно в трудные минуты, есть процесс творения Богом подобных Ему богов. В моем слове «О духовничестве» я сказал, что «духовник – соучастник с Богом Отцом и Богом Сыном и Богом Духом Святым в создании вечных богов». Это слово должно быть нами воспринято как нормальное, а не как нечто гордое.
        cn: 那么，我们对所发生的一切事物的关系，将充满着严肃的意识：意识着每个人的重要性，每个举动的重要性，以及与他人每次交流的重要性！我们生命的整个过程，尤其在艰难的时刻，是上帝创造那与祂相似的神的过程。在我题为《论灵修指导》的文章中，我曾说过：「灵修神父——是与上帝圣父、上帝圣子和上帝圣灵一同参与创造永恒之『神』的同工。」这句话应当被我们视为正常的，而非某种骄傲之言。
    - type: paragraph
      text:
        ru: 'Господь говорит апостолам: «Если вы будете едино в любви, тогда все познают, что вы Мои, то есть Христовы, ученики»[45]. Читая Евангелие, пожалуйста, помните эти слова Христа, и сделайте нашу жизнь такой, чтобы мы любили друг друга, чтобы наша жизнь была единая жизнь. Старайтесь применять их ко всякому случаю нашего общения. Тогда придет спасение ко всем вам, и тогда вы станете способными помогать и другим, неся им слово о спасении. Но начинать надо с того, чтобы самим жить заповедь Божию с великим трудом: в постах и молитвах, в скорбях и болезнях.'
        cn: 主对使徒们说：「如果你们在爱中合一，那么所有人都会知道你们是我的门徒，也就是基督的门徒。」[45] 当阅读福音时，请记住基督的这些话语，并使我们的生活如此，以至于我们彼此相爱，使我们的生活是合一的生活。努力将它们应用于我们交往的每一个场合。那么救恩就会临到你们所有人，那么你们就能够帮助他人，将救恩的话语带给他们。但首先我们必须付出极大的辛劳，亲身活出上帝的诫命：在禁食和祷告中，在苦难和疾病中。
    - type: paragraph
      text:
        ru: Все мы должны воспринять полноту откровения о Боге и о человеке. Сейчас нам кажется, что мы безмерно далеки от этого. Но, может быть, это кажется нам, а для Самого Христа нетрудно прийти и говорить с нами, как Он говорил с Лукой и Клеопой по дороге в Эммаус[46].
        cn: 我们所有的人都应当领受关于上帝和关于人的丰满启示。现在我们觉得，我们离这事无限遥远。但是，这或许只是我们自己的感觉，而对于基督祂自己来说，前来与我们交谈并不困难，就像祂在前往以马忤斯的路上与路加和革流巴交谈一样[46]。
    - type: paragraph
      text:
        ru: 'Есть странные слова у Отцов: «Если кто в Боге, тому нет нужды читать книги», ибо жизнь воспринимается непосредственно от Бога, без книг, как подлинная реальность. Нам дан такой пример в нашем духовном отце Силуане. Прежде, чем он стал читать книги, ему явился Господь. И Силуан жил уже, подобно Господу, все человечество как нечто связанное с ним самим.'
        cn: 教父们有些奇异的话：「若有人在上帝里，他就不需要阅读书籍，」因为生命是直接从上帝那里领受的，不藉书籍，作为真实的实相。在我们的属灵教父圣西卢安身上，我们便有这样一个榜样。在他开始阅读书籍之前，上主便向他显现了。于是圣西卢安的生活，便仿佛上主一般，将全人类都视为与他自身紧密相连的。
    - type: paragraph
      text:
        ru: 'Два или три дня тому назад мы стояли с отцами около дерева у Ambergate, и я сказал им: «Посмотрите, огромное дерево! И каждый лист напоен силой, и все дерево здорово». Человечество подобно дереву: если я лист на этом дереве, листы которого полны жизни, – то и я полон жизни. Но теперь дерево это больное. И в его болезни для нас, христиан, нормально молиться так, как Сам Господь молился за весь мир, – с таким чувством, что это моя жизнь. И тогда космическая жизнь проходит через меня в своем массивном потоке. Ибо это сознание, что мы – неотделимая часть человечества, свойственно христианину.'
        cn: 两三天前，我们和教父们在安伯盖特（Ambergate）旁的一棵树下站着，我对他们说：「看啊，这棵巨大的树！每一片叶子都充满生机，并且整棵树都很健康。」人类就像一棵树：如果我是这棵树上的一片叶子，这棵树的叶子都充满生命，那么我也充满生命。但如今这棵树病了。而在它的病痛中，对我们基督徒而言，这样祷告是正常的，就像上主亲自为整个世界祷告一样——怀着「这是我的生命」这样的感受。于是，宇宙的生命以其宏大的洪流穿过我。因为这种意识，即我们是人类不可分割的一部分，是基督徒所固有的。
    - type: paragraph
      text:
        ru: 'Я чувствую себя перед лицом этого бытия, которое раскрывает для нас Господь, как перед явлением чрезмерно великим, о котором не знаешь, как говорить, каким словом. Но я хотел бы передать вам этот «огонь». Не тот огонь, который пожигает во аде, а огонь, о котором говорит Христос: «Я пришел, чтобы свести огонь на землю, и как хочу, чтобы он возгорелся в сердцах людей»[47].'
        cn: 我在面对这般存在时感到，这是上主为我们所启示的，仿佛面对一个极其伟大的显现，不知该如何言说，不知该用何种言语。然而我愿将这「火」传递给你们。不是那在地狱中焚烧的火，而是基督所说的火：「我来是要把火投在地上，我多么渴望它已燃起在人的心中！」[47]
    - type: paragraph
      text:
        ru: 'В поучении о трех образах молитвы Симеона Нового Богослова есть очень важные слова о том, что молящийся, по заповеди Христа, должен хранить совесть свою перед Богом, перед братом – ближним своим – и даже по отношению к вещам[48]. Вы читали у Силуана: «Листок на дереве, и ты его сорвал без нужды?» Для него оторвать листок от ветки значило лишить его жизни: даже жизнь листка для него была болезненна. Это совсем не сентиментальность, а совершенно другое восприятие всего бытия: и Божественного, и человеческого, когда мы храним совесть даже по отношению к вещам. Да и просто по человеческой логике что такое все эти вещи? Господь так устроил: животный мир живет только тем, что производит природа, а человек должен все себе вырабатывать сам. В этом его отличие. И какую бы «вещь» мы ни взяли – все это труд человека. И, осознавая сие, мы будем очень внимательны ко всякому предмету: зря не разобьем. Сам Господь, Который благословил пять хлебов и пять тысяч насытивший, после сказал: «Соберите все, чтобы ничто не пропало»[49]. (Некоторые толкователи этого места говорят, что Его хотели сделать царем для войны: «Раз Он такой, что может накормить столько людей, надо Его сделать царем, чтобы сражаться с Римом»; потому что одним из важнейших предметов заботы об армии было: как накормить солдат. А здесь пожалуйте – одним словом пять тысяч накормлено! А Он убежал от них и от учеников своих молиться наедине).'
        cn: '在新神学家西默翁关于祈祷三式的教诲中，有非常重要的话，指出祈祷者依照基督的诫命，应当在上帝面前、在弟兄——他的近人——面前、甚至在对待物件[48]方面保守自己的良心。你们在西拉那里读过：「树上的一片叶子，你却无故将其摘下？」对他而言，从树枝上摘下一片叶子，意味着剥夺它的生命：甚至叶子的生命也令他感到痛苦。这绝非感伤主义，而是对整个实有——无论是神圣的还是属人的——一种完全不同的领受：即便是对物件，我们也保守着良心。


          况且，单凭人的逻辑来看，所有这些物件是什么呢？上主如此安排：动物界仅凭大自然所生产的而生存，而人则必须自己劳作所得一切。这便是人的不同之处。无论我们选取哪一件「物件」——这一切都是人的劳动所得。因此，意识到这一点，我们将对每一样物件都非常小心：不会无故将其打碎。上主自己，祂曾祝福五饼，使五千人得以饱足，之后说：「把所有剩下的都收拾起来，免得有丝毫浪费。」[49] (对此处的某些解经家认为，人们想拥祂为王，以便发动战争：「既然祂能喂饱这么多人，我们应该立祂为王，以便与罗马作战」；因为军队关注的最重要事项之一，就是如何喂饱士兵。而在这里——请看——一句话就喂饱了五千人！而祂却逃离他们和祂的门徒，独自去祈祷了)。'
    - type: paragraph
      text:
        ru: Мое слово на сегодня кончается. Мой долг исполнен. И молитесь за меня, чтобы Бог дал мне слово, отвечая на желание кого бы то ни было из вас. Тогда и моя молитва за вас будет иметь силу. Так все мы станем единая «вода живая»[50]. О жизни в Боге можно говорить без конца, но можно говорить и молча, без слов. И я хотел бы, чтобы после моей смерти действительно это было бы вашей жизнью. Но, чтобы достигнуть этого, каждый из вас должен молиться за всех членов нашего братства. И так мы будем строить единую жизнь.
        cn: 我今天的话语结束了。我的职责已履行。并请为我祷告，愿上帝赐予我话语，以回应你们中任何人的愿望。如此，我为你们的祷告也将有力量。如此我们所有人都将成为合一的「活水」[50]。关于在上帝里的生命，可以无止境地谈论，但也可以静默无言地谈论。而我希望，在我去世之后，这真正成为你们的生命。然而，为了达到这一点，你们每个人都应该为我们兄弟会的所有成员祷告。如此，我们将建造合一的生命。
  - type: heading2
    text:
      ru: 'Беседа 6: О монашестве, опытном богопознании и жизни вместе[51]'
      cn: 第六讲：论修道、经验性的识神与共同生活[51]
    children:
    - type: paragraph
      text:
        ru: Выбор жизни – монашество как Литургия. Монашество – вера в жизнь, а не в смерть. Молитва о больном, как он «жил Бога». Об опытном богопознании. Монашество как память о Боге и жизнь в Нем. Перед лицом смерти. Жизнь в монашестве – служение Литургии. О жизни вместе. О преступлении Адама. Человек – не компьютер. Ассимиляция новых людей (о пчелах)
        cn: '生命的选择——修道生活即神圣礼仪。

          修道生活——是对生命的信仰，而非对死亡的信仰。

          为病人祷告，关于他如何「活出上帝」。

          关于对上帝的经验性认识。

          修道生活——作为对上帝的记忆和在祂内的生命。

          面临死亡。

          修道生活——侍奉神圣礼仪。

          关于共同生活。

          关于亚当的过犯。

          人——不是计算机。

          新人的同化（关于蜜蜂）。'
    - type: paragraph
      text:
        ru: 'Сверх ожиданий я снова имею радость общения с вами. Эти дни я был, действительно, – «никуда». А сегодня Бог дал мне силы. И много произошло событий в нашей жизни за эти дни: к нам пришла новая сестра. Мы ее знаем уже несколько лет, и нам было трудно принять ее, потому что у нас нет места, как нет и помещения для приема гостей. И вот вчера я говорю ей: «Теперь все проблемы жизненные решены». Какие проблемы у молодых людей? Во-первых, род жизни – брак или безбрачие; потом – профессия; и третье, самое главное, но в наше время забытое многими, – духовный вопрос: как жить духовно. Я сказал новой сестре: «Теперь все эти проблемы отпадают». Это не значит, что работать надо меньше, нет – работы больше, чтобы заработать эту привилегию, но это уже совсем другая установка сердца и ума. Всей нашей жизни дает свою окраску то, что мы избрали как нечто самое главное для нас. Если человек коммерсант, банкир или фабрикант, все, что он ни делает, он все время фабрикант-бизнесмен. Есть люди ученые, артисты: все, что они ни делают, это наука или искусство. Так и в монастыре. Если мы отказались от всего прочего и сделали главным предметом – Бога и жизнь с Ним, то всякое дело, которое мы делаем: готовим ли мы на кухне, стрижем траву, печатаем книги, делаем иконы, принимаем гостей, – входит уже в Божественную Литургию, Литургию как центр нашей жизни. И ничего другого у нас нет.'
        cn: '超乎预期，我再次喜乐地与你们相交。这几天我真是「一事无成」。而今天上帝赐予我力量。这几天我们生活中发生了许多事：一位新姊妹来到我们这里。我们认识她已经好几年了，接纳她对我们来说很困难，因为我们没有地方，也没有接待客人的房间。昨天我对她说：「现在所有人生问题都解决了。」年轻人有什么问题呢？首先是生活方式——婚姻或独身；其次是职业；第三，也是最重要的一点，但在我们这个时代却被许多人遗忘了——一个属灵的问题：如何在灵性上生活。我对新姊妹说：「现在所有这些问题都消失了。」这并不意味着工作量减少了，不——工作量反而增加了，为的是获得这项特权，但这已经是一种截然不同的心志和思维。


          给我们整个生命赋予其色彩的是我们所选择的、对我们来说最重要的东西。如果一个人是商人、银行家或制造商，无论他做什么，他始终是一个制造商兼商人。有些人是学者、艺术家：无论他们做什么，那就是科学或艺术。修道院也是如此。如果我们放弃了所有其他的一切，并将上帝和与祂同生活作为主要内容，那么我们所做的任何事情——无论是在厨房烹饪、修剪草坪、印刷书籍、制作圣像、接待客人——都已融入了神圣礼仪中，将礼仪作为我们生命的中心。我们再无其他。'
    - type: paragraph
      text:
        ru: 'Вопрос избрания жизни, конечно, один из самых великих. Как мы себя определим в жизни, какую цель мы поставим перед собою – зависит от нашего самосознания. Избрать монашество христианское – я подчеркиваю, христианское – это значит: принять антропологию евангельскую.'
        cn: 生命的选择问题，当然是最重大的问题之一。我们如何在生命中界定自己，为自己设定何种目标——取决于我们的自我意识。选择基督徒的修道生活——我强调，是基督徒的——这意味着：接受福音的人类学。
    - type: paragraph
      text:
        ru: 'Пред кем бы то ни было из нас стоит вопрос: где границы человеческих возможностей? И если мы избираем христианское монашество, это значит, что мы верим не в смерть, а в жизнь: мы верим, что человек умереть не может. И в этом смысле монашество – подлинное монашество, – конечно, есть наивысшая форма жизни. Это совсем не какой-то спектакль, театральное величие, нет! – Все очень просто и смиренно. И так жизнь проходит непонятным для людей образом.'
        cn: 我们每个人都面临一个问题：人类可能性的边界在哪里？而如果我们选择基督徒修道生活，这意味着我们相信的不是死亡，而是生命：我们相信人不会死亡。在此意义上，修道生活——真正的修道生活——当然是生命最高的形式。这绝非某种表演，戏剧性的宏伟，不！——一切都非常简单且谦卑。生命就这样以一种世人无法理解的方式度过。
    - type: paragraph
      text:
        ru: 'Если говорить о значении школы, то цель того или иного учебного или научного учреждения в некоторых случаях маленькая – просто научить читать и писать, в других – дать среднее образование, в третьих – высшее и, наконец, изучается высшая академическая наука и так далее. Так и здесь: все зависит от того, на каком уровне мы построим нашу жизнь.'
        cn: 谈到学校的意义，任何一个教育或科研机构的目标，在某些情况下是很小的——仅仅是教人读写；在另一些情况下是提供中等教育；在第三种情况下是提供高等教育；而最终，则是研究最高深的学术科学，等等。这里也是如此：一切都取决于我们将生活建立在何种层面上。
    - type: paragraph
      text:
        ru: 'Вы все, мои братья и сестры, знаете некоегоN., который страдал прогрессивным параличом. У него есть жена и двое дочерей. Он был неизлечимо болен. Пришел сюда, и мы молились над ним: он сидел в кресле. И после молитвы я ему говорю: «Мы – не чудотворцы, мы простые грешные люди, но мы все-таки молились Богу о Его милосердии к Вам». И вдруг он с блестящими от счастья глазами говорит: «Но я жил Бога за время молитвы, и это для меня важнее всякого исцеления». Меня поразило, что внешняя обстановка была очень тихой. Что именно пережил этот человек? Он был с высшим образованием и достаточно богатый материально, чтобы жить в условиях интеллектуального комфорта... Как огромное большинство образованных людей, он был безразличным к вере, к Церкви. И его жена была настроена скорее против Церкви. Что меня тронуло: не было никакого движения – ничего, что бы заставило его сказать: «Но я жил Бога!».'
        cn: 你们所有的人，我的弟兄姊妹们，都认识某某N.，他患有进行性麻痹症。他有妻子和两个女儿。他病入膏肓，无法治愈。他来到了这里，我们为他祷告：他坐在椅子上。祷告之后，我对他说：「我们不是行神迹者，我们只是普通的罪人，但我们仍然向上帝祷告，求祂施怜悯于祢。」突然，他双眼闪烁着幸福的光芒说：「但在祷告的时候，我活出了上帝，而这对我来说，比任何医治都更重要。」令我震惊的是，外在的环境非常宁静。这个人到底经历了什么？他受过高等教育，物质上相当富有，足以过着心智舒适的生活……像绝大多数受过教育的人一样，他对信仰和教会都漠不关心。而他的妻子更是倾向于反对教会。令我感动的是：没有任何动静——没有任何外在的东西促使他说：「但我活出了上帝！」
    - type: paragraph
      text:
        ru: 'Если по нашей вере есть вечный и предвечный Ум, Который сотворил все, то каким путем человек узнает, что сей Творец всего прикоснулся к нему? Если существует возможность для человека узнать прикосновение этого вечного Духа, то, значит, в человеке наличествует способность к познанию не только материального мира или космического бытия, нас окружающего, но даже и большего... И когда интуиция Бога начинает прикасаться чаще и чаще к человеку, то он меняется во всех своих проявлениях, в оценках – во всем. Как и этот человек, который сказал: «Но я жил Бога!» и который был обречен на смерть: он после этой молитвы шел на смерть спокойно и с радостью, и вся семья его переменила свою жизнь.'
        cn: 如果按照我们的信仰，存在着一位永恒且先于一切存在的理智，祂创造了万有，那么人将如何得知这位万有之创造者触及了他呢？如果人有可能得知这永恒的圣灵的触及，那么，这意味着人内里存在着一种认识的能力，不仅能认识我们周围的物质世界或宇宙存在，甚至能认识更超越的一切……当来自上帝的直觉开始更频繁地触及人时，他就在他所有的表现、评判——在一切方面都改变了。就像有个人说过的：「但我活出了上帝！」而他当时已被判处死刑：他在这次祷告之后，平静喜乐地走向死亡，他的全家都改变了他们的生活。
    - type: paragraph
      text:
        ru: Каждый строит свою жизнь по тому видению, которое ему дано. Есть так называемый «научный опыт», «опытная наука», но есть «наука» и в монашестве. По опыту прикосновений Божиих меняется все восприятие. И то, что раньше привлекало и было великим в нашем сознании как житейская потребность, вдруг становится ничтожным.
        cn: 每个人都按照他所领受的异象来构建自己的生活。有所谓的「科学经验」、「经验科学」，但在隐修生活中也有「科学」。因着上帝触碰的经验，所有的感知都改变了。而那些曾吸引我们，并在我们意识中被视为伟大的世俗所需，突然变得微不足道了。
    - type: paragraph
      text:
        ru: 'Господь все знает, ибо Он сотворил мир. Он сказал: «Научитесь от Меня, яко кроток есмь и смирен сердцем»[52]. Никакая логика человеческая, никакая философия или наука не могут нам доказать ни того, что есть Бог, ни того, что Его нет; ни решить проблемы, действительно живет ли человек после того, как он покидает мертвое тело, или нет.'
        cn: 上主洞悉万物，因为祂创造了世界。祂说：「你们当学我的样式，因为我心里柔和谦卑」[52]。任何人类的逻辑，任何哲学或科学，都既无法向我们证明上帝是否存在，也无法证明祂不存在；也无法解决人离开必死的身体之后，是否真的依然活着的问题。
    - type: paragraph
      text:
        ru: 'Человек, который никогда не испытал Бога, может обладать большими познаниями земной науки. И когда он видит верующего человека, говорит: «Он сумасшедший». И верующий человек, который пережил Бога, на неверующего смотрит с большим состраданием: «Он не знает самого главного!». Симеон Новый Богослов пишет об опыте Бога, после которого все коренным образом меняется. И уже нельзя объяснить, как, но жизнь переменилась. И обычная аристотелевская логика уже оставляется, потому что люди переходят в сферу иных измерений.'
        cn: 一个从未体验过上帝的人，可能拥有渊博的世俗科学知识。当他看到一个信徒时，便会说：「他疯了。」而曾体验过上帝的信徒，则以极大的同情心看待不信者，说：「他不知道那最重要的事情！」新神学家西缅写道，关于对上帝的体验，在此之后一切都将根本性地改变。而且已经无法解释是如何改变的，但生命已然转变。并且，寻常的亚里士多德式逻辑已被摒弃，因为人们进入了另一维度的领域。
    - type: paragraph
      text:
        ru: И, значит, к чему все сводится в монашестве? – К тому, как организовать свою жизнь, чтобы все обстоятельства, всякая работа и т. д. не мешали помнить Бога.
        cn: 那么，这一切在修道生活中，最终归结为何呢？——归结于如何安排自己的生活，好使所有境遇、一切劳作等等，都不妨碍我们记住上帝。
    - type: paragraph
      text:
        ru: 'Но где Он – Бог? Какой Он? Вот для нас – особое благословение, что Он явился среди нас и жил с нами[53]. И Он есть основа для наших решений. Решение о том, есть ли Бог или нет и какой Бог, – это Христос. И мы называемся христианами, потому что следуем Ему. Религия наша совсем не есть результат нашей философии или вывод нашего рассудка. Нет! – Это явление Бога человеку, как в этом случае с больным, который сказал: «Но я жил Бога, и это важнее всякого исцеления». Почему важнее? Потому что в болезни своей он переживал ужасное состояние постепенного притупления всех его способностей: он терял память, зрение, возможность движения и так далее. Все было отнято, во всем он был ограничен и не мог жить уже сам собою, и за ним надо было ухаживать.... Но вот он вдруг ощутил, что он уже не умирает, и в этом было действие молитвы.'
        cn: 但祂在哪里？祂是怎样的上帝？对我们而言，这是一个特别的福分，因为祂显现于我们中间，并与我们同住[53]。祂是我们做出决定的基础。关于上帝是否存在以及祂是怎样的上帝，这个决定就是基督。我们被称为基督徒，因为我们跟随祂。我们的信仰绝不是我们哲学的产物，也不是我们理智的推论。不！——这是上帝向人显现，正如那个病人所说的情况：「但我活出了上帝，这比一切医治都更重要。」为何更重要？因为在他的病痛中，他经历了一种可怕的状态，他所有的能力都在逐渐迟钝：他失去了记忆、视力、行动能力等等。一切都被夺走了，他在各方面都受到限制，无法再依靠自己生活，需要人照料……但他突然感到自己不再会死去，这其中有祷告的作为。
    - type: paragraph
      text:
        ru: 'С больными людьми молитва действеннее не потому, что у них больная психология, а потому, что перед ними остро стоит вопрос: «Вот ты теперь будешь умирать!», подобный тому, который поставил Пушкин: «Дар напрасный, дар случайный, жизнь, зачем ты мне дана? И какой судьбою странной ты на казнь осуждена...». Поэт удивлялся: как может умереть то, что он переживал в часы вдохновения?! «И какой судьбою странной ты на казнь осуждена...». – Это первое сомнение в том, что человек умирает.'
        cn: 与患病之人，祷告更为有效，不是因为他们有病态的心理，而是因为在他们面前，一个问题尖锐地摆着：「看哪，你现在就要死了！」 类似于普希金提出的那个问题：「虚妄之恩，偶然之物，生命啊，你为何被赋予我？又以何等奇特之命运，你被判处刑罚…」 诗人诧异道：在他灵感迸发时所经历的一切，怎能死去？！「又以何等奇特之命运，你被判处刑罚…」——这是对人会死亡的第一个怀疑。
    - type: paragraph
      text:
        ru: 'Возьмем такой пример, уже совсем-совсем «ощутимый для рук наших», – со старцем Силуаном. Сколько людей мы видели уже, которые исцелились или у которых разрешилось недоумение или проблема жизненная по молитве к нему! И что удивительнее всего – это происходит моментально! Как будто бы он сам присутствует там, где решается вопрос. И это было не только с православными, но и с инославными, которые приняли Православие из-за этого явления: вдруг сердце переживает присутствие духа любви сего святого человека! И все в жизни меняется! И это опыт, который столетиями повторяется.'
        cn: 让我们举这样一个已经是彻彻底底「触手可及」的例子——关于圣西卢安长老。我们已经看到多少人，借由向他祈祷，而获得医治，或者生命中的困惑或问题得以解决！而最令人惊奇的是，这发生得如此迅速！仿佛他本人就在问题解决之处亲身在场。这不仅发生在东正教徒身上，也发生在非东正教徒身上，他们因为这个现象而接受了东正教：突然间，心感受到这位圣人爱之灵的临在！并且生命中一切都改变了！这是一个几百年来反复出现的经验。
    - type: paragraph
      text:
        ru: 'И так мы строим всю нашу жизнь. Мы живем, полагая в основу нашего мировидения Откровение Бога, которое дано через Библию. Когда мы начинаем что-то понимать о нашем бессмертном духе, как он живет вечность, то иначе воспринимаем слова Священного Писания: «В тот день, когда ты съешь этот плод, ты умрешь смертию»[54]. В Литургии Василия Великого сказано, что в сохранении заповеди Адаму было дано обетование вечной жизни. Но Адам совершил преступление против любви Божией... А в чем состояло преступление? В том, что Адам поставил Бога на второе место. И то, что Бог рекомендовал ему не делать, – он сделал. И был удовлетворен этим: «Это было прекрасно на вид и вкусно»[55]. И после падения все наследники Адама понесли уже не то изначальное, каким был создан Адам, а жили с этим ядом преступления против любви Отчей. Так все мы умираем смертию как наследники Адама, ибо корень у человечества – один. О нем сказано в Священном Писании, где Троичный Бог говорит: «Сотворим человека по образу Нашему и по подобию». И этот «образ и подобие» умирает от нашего невнимания и неверия, доколе огонь веры не загорится в сердце без какого-либо предварительного логического рассуждения. И так мы начинаем: сначала – по вере, потом опыт превращается в надежду, когда последствия молитвы вдруг становятся явными, и третья степень – когда человек живет любовь и уже не умирает. И это – победа над грехом.'
        cn: 就这样，我们建造我们一生的生活。我们活着，以上帝通过圣经所赐予的启示为我们世界观的根基。当我们开始理解我们不朽的灵魂，它如何活过永恒时，我们就会以不同的方式理解圣经的话语：「在你吃那果子的日子，你必死。」[54] (创世记 2:17) 圣巴西略的礼仪中说道，在遵守诫命之中，亚当被给予了永生的应许。但亚当犯下了违背上帝之爱的罪行……那么，这罪行何在呢？在于亚当将上帝置于次位。以及上帝建议他不要做的事——他却做了。并为此感到满足：「这果子悦人眼目，尝着甘甜。」[55] (创世记 3:6) 堕落之后，亚当所有的后裔所承受的已不再是亚当被创造时那最初始的状态，而是带着这违背父爱之罪行的毒液生活。就这样，我们所有人都必死，作为亚当的后裔，因为人类的根源——只有一个。圣经中论及此，三位一体的上帝说道：「我们要照着我们的形象，按着我们的样式造人。」(创世记 1:26) 而这『形象与样式』因我们的不留心和不信而死去，直到信心的火焰在心中燃起，不需任何先前的逻辑推理。就这样我们开始：首先——凭着信心；然后，经验转化为希望，当祷告的果效突然显明时；第三个阶段——当人活出爱并且不再死去时。而这——就是战胜罪恶的胜利。
    - type: paragraph
      text:
        ru: 'Мы еще будем говорить, как это созидается. Об этом можно говорить веками, и можно говорить молчанием. Почему молчанием? Потому что всякое слово наше не достигает той цели, которую мы ставим перед собою. Передать весь наш опыт и сознание через слово – это не достигается скоро. Ибо Божественная жизнь невозможна, если человек построен, как компьютер, то есть, иначе говоря, «детерминированный». Отличие наше от компьютера в том, что мы не детерминированы. И эту свободу дает нам пережить опыт Бога. Люди рождаются для вечности, сохраняя свою человечность и сознание своей личности не как результат какого-то процесса, уже другим лицом построенного. С человеком не так, как с компьютером: какую конструкцию даст ему строитель, так он и работает. У человека свой разум и свои импульсы; он может отказаться, капризничать, а может согласиться и жить в любви.'
        cn: 我们还会继续探讨，这是如何建造起来的。关于这一点，可以谈论数个世纪，也可以用沉默来表达。为什么是沉默？因为我们的任何言语都无法达到我们给自己设定的目标。通过言语传递我们所有的经验和意识，这无法很快达成。因为，如果人被构造得像一台电脑，也就是说，换言之，是「被决定的」，那么神圣的生命是不可能的。我们与电脑的区别在于，我们不是被决定的。上帝的体验让我们得以经历这种自由。人们为着永恒而生，保留着他们的人性以及他们人格的意识，这并非某个已由他人建造的过程所产生的结果。人不同于电脑：建造者给予它什么样的构造，它就那样工作。人有自己的理性（心智）和自己的冲动；他可以拒绝，可以任性，也可以同意并活在爱中。
    - type: paragraph
      text:
        ru: 'Наш монастырь сейчас переживает очень важный период: надо ассимилировать новых людей... Я видел, как отецN. употребляет особый трюк с пчелами. Если соединить два разных улья, то там будет война между пчелами. Чтобы отвратить эту войну, он их окуривает дымом, так что все они пахнут одинаково и начинают жить вместе. И когда приходят новые братья или сестры, то мы вспоминаем этот метод отцаN.: чтобы было согласие в основной идее.'
        cn: 我们的修道院现在正经历一个非常重要的时期：需要吸纳新人……我曾见过N神父使用一种对待蜜蜂的特殊技巧。如果把两个不同的蜂巢结合起来，蜜蜂之间就会发生战争。为了避免这场战争，他会用烟熏它们，这样它们闻起来都一样，然后就开始一起生活了。因此，当有新的修士或修女到来时，我们就会想起N神父的这个方法：以使大家在根本思想上达成一致。
    - type: paragraph
      text:
        ru: 'У нас трюк есть и с гостями. Посетителям приятно, что они входят в нашу жизнь, в нутро ее. Но это привилегия, за которую мы должны дорого платить. Надо все делать нам самим. У нас нет ни помещений, ни гостиницы. И теперь, когда надо сделать все дела, как быть с гостями: ведь они приезжают издалека, и каждый хочет, чтобы его путешествие было не зря. К нам приезжают из Канады, из Америки, из Европы, из Греции, из Новой Зеландии, из Австралии. И даже сибиряки! (Так раньше все боялись этого имени «Сибирь». Теперь это стало почетным местом. Новосибирск – это все равно что Оксфорд). Мы принимаем гостей, действительно, с любовью, но потом – идем все вместе работать. И раньше, когда мы приехали сюда, было много времени на личный контакт, а теперь, когда так много приезжает людей, мы потеряли этот комфорт для личных бесед... И так мы живем, покамест не кусаемся.'
        cn: 我们在接待客人方面也有一套诀窍。访客们很高兴能融入我们的生活，进入其核心。但这是一种特权，我们为此必须付出高昂的代价。我们必须亲力亲为。我们既没有房舍，也没有旅馆。那么现在，当我们必须处理所有事务时，该如何对待客人呢？毕竟他们远道而来，每个人都希望自己的旅程不虚此行。来自加拿大、美国、欧洲、希腊、新西兰、澳大利亚的客人都会来我们这里。甚至还有西伯利亚人！（以前所有人都害怕「西伯利亚」这个名字。现在它已成为一个受人尊敬的地方。新西伯利亚就如同牛津一样）。我们确实怀着爱心接待客人，但之后——我们便一起去工作。以前，我们刚到这里时，有充裕的时间进行私人交流，但现在，随着来访人数如此之多，我们失去了那种进行私人交谈的舒适感……我们就这样生活着，只要大家不互相争吵就好。
  - type: heading2
    text:
      ru: 'Беседа 7: О послушании и других путях духовного преуспеяния[56]'
      cn: 第七讲：论顺服及其他属灵精进的途径[56]
    children:
    - type: paragraph
      text:
        ru: 'О достигнутой полноте и безначальном начале. О путях духовного обучения. О послушании. О бесстрастии. О любви божественной. Признак достижения Бога – расширение бытия. Образ Бога – многоипостасное единство. Послушание приводит к «АЗ ЕСМЬ». О хранении заповедей. Энергия воскресения – в нашей вере: о «чаянии» и «от-чаянии». О «haute tension» и «relaxation»[57]'
        cn: 关于已达致的圆满和无始之始。关于属灵学习之道。关于顺从。关于无私欲。关于神圣之爱。达致上帝的标志是存有的扩展。上帝的形象是多位格的合一。顺从导向「我是」。关于遵守诫命。复活之能在于我们的信德：关于「盼望」和「绝望」。关于「高度张力」和「松弛」[57]
    - type: paragraph
      text:
        ru: 'Хотя я беден теперь и нет у меня энергии, но все-таки я радуюсь каждой встрече с вами. Я вижу много лиц, которые не являются членами монастыря официально, но связаны с нами Духом во единую семью. И когда мне нужно говорить, то я нахожусь в странном положении. На Тайной Вечере Господь сказал ученикам: «Вы уже не рабы Мои, но друзья. И Я сказал вам все, что слышал от Отца Моего»[58]. Так, мне кажется, что я сказал вам все – и писанным, и устным словом, что я слышал от отца моего блаженного Силуана. Но Господь в ту же самую ночь говорит: «Еще многое должен Я вам сказать, но вы не в силах нести сейчас». Получается сочетание достигнутой полноты и, вместе с тем, еще безначального начала! Когда человеку дана молитва к Богу и он плачет всем своим существом, нуждаясь в единении с Богом, то, конечно, Бог – с ним. Но человек может узнать, что с ним Бог, а может и не узнать, живя только свое горе. Так и в нашей жизни здесь: мы можем узнать, что Бог с нами, и в этом смысле уже быть совсем в иной сфере бытия. И теперь от вас, которые составляют монастырь, зависит сделать его местом живого присутствия Бога.'
        cn: 尽管我现在贫乏无力，但我依然为每一次与你们的相遇而欢欣。我看到许多面孔，他们并非修道院的正式成员，却藉着圣灵与我们联结成为一个家庭。而当我需要讲话时，我便处于一个奇异的境地。在最后的晚餐上，主对门徒说：「你们不再是我的奴仆，而是我的朋友。我已将从我父那里所听到的一切都告诉了你们。」[58] 如此，在我看来，我已将一切都告诉了你们——无论是笔述的，还是口传的，我从我的先父，蒙福的西鲁安那里所听到的。但就在那一夜，主又说：「我还有许多事要告诉你们，但你们现在担当不了。」这就形成了一种结合：已臻达的圆满，同时，却又是一个无始的开端！当一个人被赐予对上帝的祷告时，他以其全部生命哭泣，渴望与上帝合一，那么，上帝当然与他同在。但人可以认识到上帝与他同在，也可以不认识，只活在自己的悲痛之中。在我们此地的生活中也是如此：我们可以认识到上帝与我们同在，从这个意义上说，我们便已置身于一个完全不同的存在领域。而现在，这取决于你们，修道院的成员们，使它成为上帝活生生临在之地。
    - type: paragraph
      text:
        ru: В школах мира сего веками создавалась система постепенного обучения детей, вплоть до последних степеней, когда человек вводится в мировое мышление целиком и принимает уже участие деятельное. Но у нас совсем другой порядок. Помните, я говорил вам об особенном характере монастыря как школы, где люди учатся достигать Бога молитвой?
        cn: 在今世的学校中，几个世纪以来建立了一套循序渐进地教导儿童的体系，直到最高的阶段，届时，人被完全引入到世俗思维中，并已经积极地参与其中。但在我们这里，则完全是另一种秩序。你们还记得吗，我曾对你们说过，修道院作为一所学校，有着其特殊的性质，人们在那里学习通过祷告达到上帝？
    - type: paragraph
      text:
        ru: 'Вот Силуан – странное, необъяснимое явление: вдруг на мгновение увидел Христа в Его силе извечного Божества! Прежде, чем что-либо пройти, он уже был возведен до последних доступных человеку на земле степеней. Так может быть с каждым из нас. Но может быть и иначе, подобно тому, как обучают Отцы: они постепенно сообщают людям о Боге. Однако Бог не следует этой системе. Он вдруг кому-то открывается целиком, и потом сей человек страдает без конца в этом мире, потому что познал иную сферу бытия – бытия подлинного, несокрушимого. Так, душа моя жаждет говорить вам об этом несокрушимом бытии, и от вас зависит: воспринять или не воспринимать. Но иногда это и не зависит от человека. Так, когда мы оказываемся лицом к Лицу Самого Бога, мы ни о чем не можем спросить: у нас нет никакого вопроса.'
        cn: 圣西拉——一个奇怪的、无法解释的现象：他突然间，一瞬间，看见了基督在祂永恒神性的力量中！在他经历任何事之前，他便已被提升到人在世上所能达到的最高境界。如此，也可能发生在我们每个人身上。但也可能以另一种方式，就像教父们教导的那样：他们逐渐地向人们传达关于上帝的事。但上帝并不遵循这套系统。祂突然间向某人完全地显现自己，于是这个人便在这世上无休止地受苦，因为他认识了另一种存在的境界——那真实、不可摧毁的存在。因此，我的灵魂渴望向你们讲述这不可摧毁的存在，而这取决于你们：接受或不接受。但有时，这并不取决于人。如此，当我们与上帝本体面对面时，我们什么都问不出来：我们没有任何问题。
    - type: paragraph
      text:
        ru: 'В прошлый раз я старался говорить с вами и потом сказал: «Ну, спросите меня о чем-нибудь, чтобы я знал, о чем говорить». И никто меня не спросил. И Господь сказал: «Когда увидите Меня, то вы ни о чем не спросите»[59]. Всякое общение в духе есть уже молитва. Мы на богослужениях читаем веками, из века в век одни и те же тексты.'
        cn: 上一次我尝试着与你们交谈，然后我说：「那，你们问我一些什么吧，好让我知道该讲些什么。」 结果没有人问我。 主说：「当你们看见我时，你们就什么都不会问了」[59]。 任何在灵里的交通，就已经是祷告了。 我们在礼拜仪式中，几个世纪以来，从一个世纪到另一个世纪，都读着相同的文本。
    - type: paragraph
      text:
        ru: 'Но вот, готовясь теперь ко встрече с вами, я спросил одного из самых младших братьев: «А ты что хочешь, чтобы я говорил? О чем говорить?». И он без всяких колебаний сказал: «О послушании!». Что лежит за этим жестом – «о послушании»? – У него мысль такая: рожденный в условиях падения, он имеет кровь, в которой течет грех. И ему хочется изменить и кровь, и дух, который владеет им по рождении – «Во гресех роди мя мати моя», чтобы быть έτεροκίνητος (по-русски – «инодвижный») и чтобы в жилах потекла кровь Христа, а не кровь падшего Адама.'
        cn: '然而现在，当我准备与你们相会时，我问了一个最年轻的弟兄：「你希望我说什么？我该讲些什么？」他毫不犹豫地回答说：「关于顺从！」


          这「关于顺从」的举动背后蕴含着什么？他有这样的想法：他生于堕落的境况之中，他的血脉中流淌着罪。他渴望改变自己的血脉，以及那在他出生时就掌控他的灵——「我的母亲在罪中生了我」——为了成为 έτεροκίνητος (俄语译为「由他者而动」)，并且让基督的宝血，而非堕落亚当的血，流淌在自己的血管中。'
    - type: paragraph
      text:
        ru: 'Когда мы умом идем к Абсолютному Существу – Богу, то этот путь кажется нам бесконечно длинным. В прошлый раз я сравнил это с Полярной звездою: на каком расстоянии она находится от нас! Сколько веков скорости света! Как мы можем достигнуть сие далекое от нас светило?! И вдруг мы обнаруживаем, что этот невероятно великий путь может быть сокращен. И Господь может встать рядом с нами и сказать: «О, бестолковые и медленные сердцем понять и веровать!»[60].'
        cn: 当我们以心智走向绝对存有者——上帝时，这条道路对我们而言似乎是无限漫长的。上一次我将这比作北极星：它与我们相距何其遥远！以光速需行多少世纪啊！我们怎能抵达这与我们遥远的光源呢？！然而，我们突然发现，这条极其漫长的道路能够被缩短。上主能站在我们身旁说：「哦，愚拙而心里迟钝的人，难以明白和相信！」[60]
    - type: paragraph
      text:
        ru: 'Мы все время живем в этом контрасте: или попадаем в сферу недвижной вечности, или выпадаем из нее в тревоги этой жизни. Но все время мы, конечно, связаны с Ним: и молитвой, и верой, и умом, и телом. И вот, когда этот брат спросил «о послушании», то ясно, что в его уме стоял вопрос: «Как я могу совлечься своей воли, которая течет в крови моей?». Эта возможность дается в монастыре, но не в миру. Потому что в монастыре собраны люди, которые живут Богом: одни – больший срок, другие – меньший, а иные только приходят. И поручается монастырь человеку, который имеет общее видение нашего духовного бытия, так что мы можем довериться ему: как он скажет. Мы выполняем волю не нашу, а волю другого человека. Это унизительное положение для культуры века сего – быть «инодвижным», то есть не владеть самим собою и не строить свою жизнь, «как я хочу», но как-то пассивно отдаться в руки другого. И путь получается страшно долгий: посты, молитвы – десять, двадцать, сорок лет, кому как дано. Иногда после сорока лет человек еще даже не понимает, что есть бесстрастие, что значит быть очищенным от греха. Мне Бог дал особое благословение – по кончине моего отца Силуана я, по его совету, ушел в пустыню. Позднее я был приглашен быть духовником в Монастыре святого Павла, где я встречал людей, которые были в состоянии бесстрастия и совершенно не понимали своего состояния. Оно казалось им совершенно естественным. А бесстрастие достигается исключительно по дару Божию и совсем не так часто: это простое состояние человека, который ничего особенного не видит, но свободен от греховных движений и способен воспринять поток любви Божией.'
        cn: 我们总是在这种对比中生活着：要么进入不动永恒的领域，要么从其中坠入今生的忧虑。但我们始终，当然，都与祂相连：藉着祷告、藉着信心、藉着心智、藉着身体。于是，当这位弟兄问及「顺服」时，显然，他心中有个问题：「我如何才能摆脱那流淌在我血液中的自我意志？」这种可能性是在修道院中赐予的，而非在尘世。因为在修道院里聚集着以上帝为生命的人们：有些时日较长，有些时日较短，还有些才刚刚到来。修道院被托付给一个人，他对我们的灵性存在有整体的洞见，这样我们就可以信赖他：照他所说的去做。我们遵行的不是我们自己的意志，而是另一个人的意志。这对于今世的文化而言是一个屈辱的境况——即成为「受他动者」，也就是说，不掌握自己，不按照「我所愿」来建造自己的生命，而是某种程度上被动地把自己交到另一个人手中。而这条道路漫长得惊人：禁食、祷告——十年、二十年、四十年，视各人蒙受的恩赐而定。有时，四十年后，一个人甚至还不明白何为无情欲，摆脱罪恶意味着什么。上帝赐予我一个特别的祝福——在我的司祭圣西卢安（Silouan）离世后，我遵照他的建议，去了旷野。后来，我受邀在圣保罗修道院担任属灵导师，在那里我遇到了一些人，他们处于无情欲的状态，却完全不明白自己的这种状态。这状态在他们看来是完全自然的。而无情欲的实现完全是出于上帝的恩赐，并且并非经常发生：这是一种简单的人类状态，即一个人不认为有什么特别之处，但已脱离罪恶的冲动，并能够领受上帝之爱的洪流。
    - type: paragraph
      text:
        ru: 'Когда мы говорим о любви Божией, то под словом «любовь» надо разуметь нечто совершенно особое: не то, что подразумевают, говоря о любви в этом мире. Духовная любовь выражается в том, что всем существом мы бываем соединены с возлюбленным Богом. И это единение совсем иного порядка, чем то, что знает земля. Трудность наша в том, что сейчас, в наши дни, культура падения стала основой всей жизни. А нам приходится избирать обратный путь. Однако мы живем в этом мире и у «них» власть мира сего. Из опыта выходит, что совсем не просто перейти от методов этого мира к методам христианства. Оно, христианство, кажется противоречивым, но по существу там нет противоречия. Но есть и другие, внешние признаки того, достигли мы Бога или еще далеки от Него. Если следовать евангельскому слову, то совершенство переживается как любовь ко всему миру без различия, кто враг и кто не враг. Возьмем сознание, скажем, молодых людей – жениха и невесты: каждый из них мыслит себя уже в единстве двух. От этого единства в любви рождаются дети. И получается, что, говоря о себе, они живут себя как два или три человека, с ребенком. Больше того – семья растет, расширяется круг их восприятия, и они могут уже жить не только себя двоих, но включая детей, друзей и других родных. Так постепенно расширяется кругозор человека. И когда он говорит «Я», то в это «Я» включены все возлюбленные его. Так, если нами владеет дух Христа, то, говоря «Я», мы не можем отличить нашего «Я» от сознания Все-человека.'
        cn: 当我们谈论上帝之爱时，对「爱」这个词，我们必须理解其具有某种全然特殊性：而非此世所言之爱。属灵的爱体现在，我们以全然的存在与蒙爱之神合一。而这种合一，具有全然不同的层次，迥异于大地所知的合一。我们的困难在于，现今，在我们这时代，堕落的文化已成为全部生命的根基。而我们却必须择取一条反向的道路。然而我们生活在这个世界上，而「他们」拥有这世界的权柄。经验表明，从这世界的行事方式转向基督信仰的行事方式绝非易事。基督信仰，它似乎是矛盾的，但就其本质而言，其中并无矛盾。但也有其他的，外在的迹象表明，我们是否已抵达上帝，抑或仍远离祂。若依循福音之言，那么圆满便被体验为对整个世界的爱，不论其为敌或非敌。让我们以，比方说，一对年轻人——新郎和新娘的意识为例：他们每个人都已将自己视为两人一体。从这份在爱中的合一，诞生了孩子。于是，便成了，当他们谈论自己时，他们仿佛活出两个或三个人，包括孩子在内。不仅如此——家庭在壮大，他们的感知圈在扩展，他们便能不再只活出他们两人，而是包括孩子、朋友以及其他亲属。如此逐渐地，人的视野便扩展开来。而当他言及「我」时，那么在这「我」中，便囊括了他所有所爱之人。如此，若基督之灵内住于我们，那么，当我们言及「我」时，我们便无法将我们的「我」与「全人类」的意识区分开来。
    - type: paragraph
      text:
        ru: Во Христе жизнь становится расширенным бытием, безграничным. И когда мы имеем заповедь «люби ближнего своего, как самого себя», то слова «как самого себя» надо воспринимать так, что весь человек, весь Адам есть мое бытие. И это характерно для жизни христианской.
        cn: 在基督里，生命变得扩展且无限的存有。当我们领受了「爱你的邻人如同你自己」这条诫命时，那么「如同你自己」这句话，我们应当这样理解：所有人，整个亚当，就是我的存有。而这正是基督徒生命的特征。
    - type: paragraph
      text:
        ru: '«Весь человек» упоминается в Писании: «И рече Бог: создадим человека по образу нашему и по подобию». Не сказано «сотворим людей», а «сотворим человека». И в этом проявляется именно то сознание, о котором Господь говорит: возлюби ближнего своего, как самого себя. Подготовка к этому пониманию была долгою. В Ветхом Завете заповедь любви имела границы: люби еврея, как самого себя, и ненавидь врагов своих. Это нужно было в борьбе за их физическое существование. Но Христос всем заповедям придал измерения безграничные. И так нам нужно постепенно входить в эту жизнь по мере того, как дается нам молитва: когда вы молитесь у себя, молитесь за всех и каждого! И добавляйте: «И за молитвы его, или за молитвы их, помилуй меня». Так постепенно будет расширяться наше сознание. И это тоже связано с вопросом о послушании...'
        cn: 「全人」在圣经中被提及：「上帝说：『我们要照着我们的形像，按着我们的样式造人。』」(创世记 1:26) 圣经中并未说「造人」（复数），而是「造人」（单数）。这正显明了 上主所说的意识：爱祢的邻人如同自己。对这种理解的预备是漫长的。在旧约中，爱的诫命是有界限的：爱你的犹太人如同自己，并憎恨你的仇敌。这是为了他们肉体上的生存而进行的斗争所必需的。但基督赋予了所有诫命无限的维度。因此，我们需要随着祷告赐予我们而渐渐地进入这种生活：当你独自祷告时，要为所有人、为每一个个体祷告！并加上：「借着他/她的祷告，或借着他/她们的祷告，求祢怜悯我。」如此，我们的意识将渐渐扩展。而这，也与顺服的问题相关联……
    - type: paragraph
      text:
        ru: 'Некто сказал: «Хорошо, послушание к игумену!» Нет, не только к игумену! В нашей организации, конечно, единство воли выражает прежде всего игумен. Но нашеattitude[61]таково, чтобы по отношению к каждому человеку мы были готовы исполнить его волю, а не нашу. И тогда постепенно расширяется наше сознание, и вдруг может прийти действительно неожиданно для самих нас плач за всего Адама. Так послушание монастырское начинается с мелочей, с самой скромной работы, но кончается сознанием «АЗ ЕСМЬ».'
        cn: 有人说：「好啊，对院长顺服！」不，不仅是对院长！在我们这个团体中，意志的合一当然首先通过院长表达。但我们的attitude[61]是，针对每一个人，我们都准备好去遵行他的意志，而非我们自己的。这样，我们的意识就逐渐扩展，并且，对于我们自己而言，确实可能出乎意料地突然涌现出为全人类亚当而哭泣。如此，修道院的顺服始于琐事，始于最卑微的工作，但终结于「我是」的意识。
    - type: paragraph
      text:
        ru: 'Так из простых маленьких актов послушания строится наше отношение: «Я не хочу иметь волю моей падшей крови, а хочу, чтобы в жилах моих потекла жизнь Самого Бога». Если Бог создал нас по образу Своему для жизни, подобной Ему, то, согласно с этим откровением, это и является нашей целью. И день и ночь нас обдержит сила Божиего влечения. Это может происходить таким порядком, что человек не понимает сам, где он и что он.'
        cn: 这样，从简单微小的顺从行为中，我们的关系得以建立：「我不愿拥有我堕落血肉的意志，而愿上帝祂自己的生命流淌在我的血管中。」如果上帝按照祂的形象创造了我们，为了活出像祂一样的生命，那么，根据这个启示，这就是我们的目标。并且日夜，我们被上帝牵引的力量所笼罩。这可能会以这样一种方式发生：人自己不明白他身在何处，他又是谁。
    - type: paragraph
      text:
        ru: 'Нам сказано: «Храните заповеди!». Но как? – Мы не способны сохранить заповедь Божию: это приходит постепенно к нам (хотя может прийти и внезапно). Начиная отрезать движения своей воли ради исполнения иной воли, человек придет к тому, что он будет готов потом перед Богом – сохранить Его заповеди. Мы должны удержать эту установку с горячностью и вдохновением: тогда получатся плоды нашей жизни во Христе, и образ нашего мышления совершенно переменится. Мышление падшего мира не воспринимает безначальное. Это выходит из его логики совершенно. Мы сами рождаемся как тварные существа, в известный момент, и мы не способны к безначальному. Но приходит это сознание, когда, следуя Слову-Христу, и человек говорит: «Ныне, Христе, в Тебе и Тобою аз есмь».'
        cn: 我们被告知：「谨守诫命！」但如何呢？我们无法遵守上帝的诫命：这会逐渐来到我们这里（尽管也可能突然降临）。当人开始克制自己意志的冲动，为了遵行另一种意志时，他便会达到一种境地，那时他将在上帝面前准备好——遵守祂的诫命。我们必须怀着这份意向，带着炽热和启发；如此，我们便会在基督里结出生命的果实，并且我们的思维方式也将彻底改变。堕落世界的思维不领会无始之物。这完全超出了它的逻辑。我们自身作为受造物在某个特定的时刻降生，并且我们无法领会无始之物。但当人追随圣言——基督时，这种意识便会降临，并且人会说：「如今，基督啊，我在祢里面，也借着祢而存在。」
    - type: paragraph
      text:
        ru: Так из самых малых вещей мы можем вдруг превратить и сделать нашу жизнь исполненною присутствия Бога безначального.
        cn: 如此，从最微小的事物中，我们能够忽然间转化并使我们的生命充满无始上帝的临在。
    - type: paragraph
      text:
        ru: 'ЧитаяСимвол веры, помните последние слова его: «Чаю воскресения мертвых и жизни будущего века!». – Так надо жить: «Я ожидаю». Ибо энергия воскресения – в нашей вере. Это момент страшно важный. Мне пришлось встречаться с людьми, которые говорят: «Я вовсе не хочу вечной жизни, я вовсе не хочу никакого вашего обожения». Не понимая значения своих слов, они сами осуждают себя на вечное разлучение с Богом. Потому что в словах «чаю воскресения мертвых» заключена энергия воскресения. Но, конечно, «воскресения» не такого, как некоторые ожидали, что воскресший Христос вернется в той же плоти и будет продолжать свое дело. Нет! – «Воскресения»: уже в иной форме бытия. Ибо жить во плоти не является нашей конечной целью, которая есть процесс создания богов, то есть вечных друзей Бога Отца нашего. И так, от-чаяние есть потеря того сознания, что Бог хочет даровать нам свою извечную жизнь. Мир живет в отчаянии. Люди сами себя осудили на смерть.'
        cn: 阅读信经时，请记住其最后的语句：「我期待死人复活，并期待来世的生命！」—— 人当如此生活：「我期待。」因为复活的能量，就在我们的信仰中。这是至关重要的时刻。我曾遇到一些人，他们说：「我根本不想要永生，我根本不想要你们所说的任何神化。」他们不明白自己言语的意义，就自己判定自己永远与上帝分离。因为在「我期待死人复活」这句言语中，蕴含着复活的能量。但当然，这种「复活」并非一些人所期待的，即复活的基督将以同样的肉身回来并继续他的事工。不！—— 这「复活」：乃是在另一种存在形式中。因为活在肉身中并非我们的最终目标，我们的最终目标是成神的过程，亦即成为我们父上帝永远的朋友。因此，绝望是失去了那种意识，即上帝愿将祂的永恒生命赐予我们。世人活在绝望之中。人们自己宣判了自己死刑。
    - type: paragraph
      text:
        ru: 'Есть два рода аскетических настроений. Один из них выражается в медитации и как быrelaxation[62]для того, чтобы интеллект наш пошел в мир чистой мысли. Но путь Христа – другой. Из этих двух путей –relaxationи напряжение – напряжение есть наш путь. В нашем монашеском бытии мы обучаемся не тому, чтобы быть в состоянииrelaxationи созерцать умом, нет, мы напряжены все время, как струна, до последнего напряжения. И старайтесь удержать эту струну всегда натянутой. В молитве нашей, когда мы стоим в храме, наши мышцы напряжены и внимание наше там. И наша молитва не есть покой бесстрастной мысли, идущей за пределы всех страданий земли. Нет, мы живем страдания всего Адама. И это есть наша жизнь. Извне монашеская жизнь – спокойная. Но я могу сравнить это с линией высокого напряжения: идет по этой линии энергия, которая движет поезда, заводы, согревает дома, но птичка может сесть на этот провод. Так и христианин – это есть такой «провод, на который может сесть птичка» без всякого вреда. И вместе с тем это такая энергия, которая может, действительно, взорвать весь мир. Так, внешне в нашей жизни ничего особенного нет, но внутри, через готовность к послушанию, мы постоянно находимся в напряжении: как пребыть неподвижным в вечной мысли Бога о человеке. И это важно. Это и есть школа монашеская: через малый подвиг послушания человек переходит в безначальное бытие Бога нашего, о чем нельзя говорить логически.'
        cn: '苦修有两类倾向。其中之一体现在默想和某种程度的relaxation[62]中，为的是让我们的理智进入纯粹思想的世界。但基督的道路则不同。在这两种道路中——relaxation和紧张——紧张是我们的道路。在我们的修道生活中，我们所学的，并非是要处于relaxation和心智观想的状态，不，我们始终像琴弦一样紧绷着，直到极致的紧张。并且努力保持这根琴弦始终紧绷。在我们的祷告中，当我们站在圣堂里时，我们的肌肉是紧张的，我们的注意力也在那里。我们的祷告并非是一种无情欲的思想所带来的安宁，那种思想超越世间一切苦难。不，我们活出整个亚当的苦难。这就是我们的生活。


          从外部看，修道生活是平静的。但我可以用高压线来比喻它：能量在这条线上流动，推动火车、工厂，温暖房屋，但小鸟可以落在上面。基督徒也是如此——他就是这样一根「小鸟可以落在上面却不受任何伤害的电线」。但与此同时，这又是一种确实能够引爆整个世界的能量。所以，我们生活的外在并没有什么特别之处，但在内在，通过甘心顺服，我们持续处于紧张状态：如何在上帝关于人的永恒思想中保持不动。这很重要。这就是修道学校：通过顺服这小小的功修，人进入我们上帝无始无终的存在，这是无法用逻辑来阐述的。'
    - type: paragraph
      text:
        ru: 'Так, сохраните это положение: снаружи ничего не видно, а внутри – напряжение. И тогда мы улучим вход в вечное царство Христа.'
        cn: 那么，请保持这个状态：外表上什么都看不见，而内里——却是张力。如此，我们便能获得进入基督永恒国度的门径。
  - type: heading2
    text:
      ru: 'Беседа 8: Господь восходил на Голгофу, чтобы спасти всех[63]'
      cn: 第八讲：主登上各各他，为了拯救所有人[63]
    children:
    - type: paragraph
      text:
        ru: Мы – спутники Христа в Его следовании на голгофское распятие за всего Адама. Мгновенным было восприятие Христа прп. Силуаном и прп. Серафимом, но наш путь – постепенный. О покаянии и расширенном видении своего греха как Адамова. О наслаждении быть послушником в монастыре. О двуедином пути радости о Боге и страданий Христовых. О напряжении в церковной молитве (no relaxation). Вдохновение зависит и от Бога, и от нас самих. О пути к подобию-обожению
        cn: 我们是基督的旅伴，追随祂走向各各他的受难，为了全体亚当。圣西卢安长老和圣塞拉芬长老对基督的领受是即刻的，但我们的道路是渐进的。论悔改，以及对自身罪过作为亚当之罪的扩展看见。论在修道院中作为修士的喜乐。论因上帝而有的喜乐与基督苦难的双重统一之路。论教会祈祷中的专注（不可松懈）。灵感既取决于上帝，也取决于我们自身。论通往肖似与神化之路。
    - type: paragraph
      text:
        ru: Как и в прошлые беседы, сегодня мое слово обращено к тем молодым братьям и сестрам, которых дал нам Бог. Моей целью является помочь им понять, почему они здесь и какая цель конечная стоит перед всеми нами. Тогда – далека ли цель или близка – они, наши драгоценные братья и сестры, будут уже шествовать по этому пути с глубоким сознанием самой его сущности.
        cn: 像往日几次交谈一样，今天我的话语是向那些年轻的弟兄姊妹们说的，他们是上帝赐予我们的。我的目标是帮助他们明白他们为何在此，以及摆在我们所有人面前的终极目标是什么。如此一来，无论目标是远是近，他们——我们宝贵的弟兄姊妹们——就将带着对这条道路本质的深刻体悟，行进在这条道路上。
    - type: paragraph
      text:
        ru: 'Мое слово сегодня к вам, дорогие братья и сестры, будет изложено в беспорядке, потому что говорить мы будем и о «начале», и о «конце». Перед нами стоит БЕСКОНЕЧНО ВЕЛИКИЙ Бог, Которому мы хотим служить, но в нас самих живет нечто, математически говоря, БЕСКОНЕЧНО МАЛОЕ: наше эгоистичное сознание. Если наш ум будет двигаться от абсолютного и положительного бытия к той форме существования, которая нам дана и которую мы носим в себе, то, правда, дистанция кажется настолько колоссальной, что, по-славянски говоря, «изумеваем» мы.'
        cn: 我今天对你们说的话，亲爱的弟兄姊妹们，将会是散乱无章的，因为我们既要谈及「开始」，也要谈及「结束」。在我们面前的是一位无限伟大的上帝，我们渴望事奉祂，但在我们自身中却活著某种东西，从数学角度而言，是无限微小的：我们自私的意识。如果我们的心智从绝对和肯定的存在，走向那被赐予我们并为我们自身所承载的生命形式，那么，确实，这距离显得如此巨大，以至于，用斯拉夫语来说，我们「惊异不已」。
    - type: paragraph
      text:
        ru: 'Но в чем контраст и почему трудно мне говорить об этом? – Потому что то, что для нас кажется совершенно недоступным, для Бога легко и возможно. Когда в Евангелии апостолы говорят: «Если так, то кто может спастись?», то есть если заповеди Христа превосходят наше сознание и силы, то Господь отвечает:«Человекам это невозможно, Богу же все возможно»[64].'
        cn: 但反差何在，我为何难以谈论此事呢？——因为对我们来说看似完全不可企及的事物，对上帝而言却是轻而易举，凡事皆有可能。当使徒们在福音书中说：「若是这样，谁能得救呢？」——也就是说，如果基督的诫命超越了我们的认知和能力，上主便回应说：「在人这是不能的，在上帝却凡事都能」[64]。
    - type: paragraph
      text:
        ru: 'Я повторяюсь, но повторения необходимы, поскольку их плодом будет познание. Вот хочу снова указать вам пример Господа, Который восходил на Голгофу, чтобы спасти всего Адама[65]. Измерения сознания Христа открываются нам понемногу в Церкви, являя нам истинные измерения и Его акта: смерть Его обняла всю тварь, всего Адама. И как далеко до этого нашему сознанию! Мы живем маленькое братство. И нам надо еще так много и усердно молиться – с плачем и с болью в сердце, чтобы Бог дал нам понять, что это наша семья, что мы спутники в нашем подвиге последовать стопам Христа. Если мы даже этого маленького круга людей не носим еще в своем сознании, то как возможно, чтобы мы жили всего Адама, в веках и пространствах? Явно, что «человекам это невозможно», как сказал Господь.'
        cn: 我在重复，但重复是必要的，因为其果实将是认知。我愿再次向你们指出主（基督）的榜样，祂登上各各他，为了拯救整个亚当[65]。基督意识的维度在教会中一点点地向我们显明，从而向我们显明祂行动的真正维度：祂的死亡拥抱了所有受造物，整个亚当。而我们的意识与此相距何等遥远！我们生活在一个小小的弟兄团体中。我们还需要如此多、如此恳切地祈祷——带着泪水和心中的痛苦，愿上帝使我们明白，这就是我们的家人，我们是追随基督足迹的属灵操练中的同伴。如果我们甚至未能将这小小的人群圈子承载在自己的意识中，那么我们又怎能活出整个亚当，跨越时代与空间呢？显然，「这在人是不可能的」，正如主所说。
    - type: paragraph
      text:
        ru: 'Но, вот, все вы знаете наших современников – Серафима Саровского иСилуана Афонского. И Серафим Саровский, и Силуан были приблизительно в возрасте двадцати восьми лет, когда они увидели Христа. И самый близкий к нам, конечно, Силуан. Он стал молиться за всего Адама, с великим плачем, большим, чем за самого себя. Как на кресте «ВО ЕДИНОМ ЧАСЕ разбойника раеви сподобил еси», так и с Серафимом и Силуаном: это был лишь один момент, когда явился им Христос. И за этот момент Господь передал им Свое состояние и измерение Своего сознания. Для Силуана уже не существовал Адам первых библейских страниц как какая-то «идея», «легенда» или совершенно безумная поэтическая фантазия. Нет! – Это было реальное состояние, при котором весь Адам живется внутри человека. Итак, путь для нас, с одной стороны, невозможно далекий, а с другой – такой короткий: в один момент Христос достигает нас.'
        cn: 然而，你们都知道我们的同时代人——萨罗夫的塞拉芬和阿索斯的圣西卢安。萨罗夫的塞拉芬和圣西卢安大约都在二十八岁时见到了基督。当然，最接近我们的，是圣西卢安。他开始为整个亚当哀哭祷告，那哀哭之深，甚至超过为他自己。如同在十字架上，「祢在一个时辰内就使那强盗得入乐园」，萨罗夫的塞拉芬和圣西卢安也是如此：那只是基督向他们显现的一个瞬间。就在这一个瞬间，上主将祂的境界和意识的维度传达给了他们。对于圣西卢安而言，圣经最初几页中的亚当不再是一种「观念」、「传说」，或纯粹是疯狂的诗意幻想。不！那是一种真实的状态，在其中，整个亚当活在人的内里。因此，对我们而言，这条道路，一方面是遥不可及的，而另一方面，却是如此短暂：在一个瞬间，基督就触及我们。
    - type: paragraph
      text:
        ru: И когда мы движемся между этими двумя полюсами – бесконечно великим Богом и бесконечно малым нашим эгоистическим состоянием после падения Адама, то как сочетать это, как говорить об этом? Вековой опыт Церкви показал, что такие случаи, как с Серафимом и с Силуаном, совсем редки в истории Церкви. Быть может, потому, что нет пути аскетического более болезненного, чем путь тех, которые в самом начале узрели Христа. Всякий из нас, едва начинает жить во Христе, уже страдает от несогласия и конфликта между сознанием Христа и сознанием мирового нашего существования. Христианину негде приклонить главу[66]. Но жить это состояние не всем дано в одинаковой мере. Поскольку духовной базой нашего существования здесь являются пример, молитвы и писания нашего возлюбленного отца Силуана, мы носим в своем сознании идею, что для Бога все возможно в одно мгновение, но сами мы идем путем, который рекомендуют нам Отцы, то есть – постепенно, через ежедневный подвиг в молитве, усваивать сознание Христа, восходящего на Голгофу. Вы, конечно, уже знаете и веруете и живете сознанием, что Христос искупил всех нас и что каждый из нас, как бы он ни был мал и ничтожен, пребывает в Его сознании от века. Если мы носим это в себе, то ум наш, конечно, будет направлен к восхождению на Голгофу, и вся наша жизнь пойдет иным порядком. Содержание каждого момента будет, несомненно, большим, чем в нашей прежней жизни.
        cn: 当我们在这两个极点之间摆动时——无限伟大的上帝，以及亚当堕落后我们无限渺小的自我主义状态——我们该如何将其结合，又该如何谈论呢？教会千百年来的经验表明，像塞拉芬和圣西卢安那样的事例在教会历史上是极其罕见的。或许是因为，没有比那些在起初就看见基督之人所走的苦修之路更痛苦的了。我们每个人，一旦开始活在基督里，就已深受不和谐与冲突的折磨，这种不和谐与冲突存在于基督的意识与我们世俗存在的意识之间。基督徒无处安歇[66]。然而，并非所有人都能以相同的程度活出这种状态。鉴于我们在此存在的属灵基础是我们挚爱的父圣西卢安的榜样、祷告和著作，我们心中怀着一个念头，即在上帝那里，一切都可能在瞬间实现，但我们自己所走的道路，是教父们建议我们的，也就是说——通过每日在祷告中的苦修，逐渐领受攀登各各他基督的意识。你们当然已经知道、相信并活在这一意识中，即基督已经救赎了我们所有人，并且我们每个人，无论多么渺小和微不足道，从亘古以来就存在于祂的意识之中。如果我们内心怀着这份认知，那么我们的心智，当然会导向攀登各各他，我们整个生命也将以不同的方式前行。每一个时刻的内涵，无疑将比我们以往的生活更为宏大。
    - type: paragraph
      text:
        ru: 'Некто из новопришедших спросил меня: «Как можно получить дух покаянной молитвы?». Из вопроса очевидно, что спросивший меня не пережил трагически никакого греховного момента, и это меня радует – значит, пришли к нам еще не пораженные до конца состоянием окружающего нас мира. Но это совсем не значит, что мы святы и нет у нас греха. Конечно, грех присутствует в нас во всем своем объеме, но сами видеть его мы в том состоянии, в котором пришли, не можем. И никто из людей не может знать решительно измерений греха каждого из нас пред Богом. Об этом знает только Сам Бог. Так, Господь говорил Своим современникам: «Если вы не уверуете, что это Я, Кто открылся Моисею на Синае, то умрете во своих грехах»[67]. Конечно, без Христа, без Духа Святого мы не можем видеть греха. По существу говоря, мы должны круглый год читать молитву преподобногоЕфрема Сирина: «Дух же целомудрия, смиренномудрия, любве, терпения, покаяния, умиления, послушания даждь мне. ДАРУЙ МНЕ ЗРЕТИ МОИ ГРЕХИ...». И это надо носить в своем сознании на каждый день: тихонько, без всяких жестов, никому извне непонятно. И тогда постепенно получится картина, что грех Адамов есть грех всех нас. И тогда рождается в нас молитва покаянная – за себя и затем, до конца – за все человечество. Переродить нашу падшую природу и сделать ее сплошь освященною словом Христа и деланием-жизнью по заповедям Его есть задача, которая нормально требует исторически многих лет. И так в монастырях мы начинаем наше шествие ко Христову сознанию, расширенному до космических и сверхкосмических измерений.'
        cn: '一位新来者问我：「如何才能获得悔改祷告的灵？」从问题中显而易见，问我的人尚未悲剧性地经历任何罪恶时刻，这令我欣喜——这意味着，来到我们这里的人，尚未被我们周遭世界的境况完全侵蚀。但这绝不意味着我们是圣洁的，也没有罪。当然，罪以其全部面貌存在于我们之中，但在我们初来乍到的那种状态下，我们自己无法看见它。而且，在上帝面前，没有人能确切地知晓我们每个人罪的程度。唯有上帝自己知晓这一切。正如主对祂的同代人说：「你们若不信我是，就必死在你们的罪中。」[67]当然，没有基督，没有圣灵，我们无法看见罪。


          实际上，我们应该全年诵读圣师叙利亚的以法莲的祷告文：「求祢赐我贞洁、谦卑、仁爱、忍耐、悔改、痛悔、顺服之灵。求祢使我看见我的罪……」而这，必须日复一日地存留于我们的意识中：悄无声息地，不带任何姿态，不为外人所理解。于是，我们会逐渐明白，亚当之罪就是我们所有人的罪。届时，我们心中便会生出悔改的祷告——先是为自己，然后，直至最终，为全人类而悔改。重塑我们堕落的本性，并通过基督的话语和依照祂诫命而行的生活，使其完全得以圣化，这是一项通常需要数十年光阴的任务。因此，在修道院中，我们开始我们的旅程，迈向基督的意识，这意识被扩展到宇宙性与超宇宙性的范畴。'
    - type: paragraph
      text:
        ru: 'Мы начинаем маленькими актами послушания, отказываясь от маленькой индивидуальной воли нашего падшего тела, сознания, психики нашей. Таким путем мы можем жить, наслаждаясь тем, что Бог дал нам форму монашеской жизни. Почему я говорю вам: «наслаждаясь»? – Простите меня, но мне Бог дал это наслаждение в начале моей монашеской жизни. Я с благоговением мыслил и в молитвах моих поминал игумена и тех, кто с ним сотрудничал, – все они заботились о жизни всего монастыря, но мой ум был совершенно свободен от житейских забот: их забота дала мне возможность быть беззаботным в плане земли. В моей статье «Об основах православного подвижничества» я говорю о том, что чрез послушание нам может быть дана чистая молитва, которую едва ли достигают самые большие философы и даже богословы[68]. Быть в этом состоянии чистого ума, который стоит непрестанно пред лицом Абсолютного Бога, – вот в чем есть действительно «пришедшее в силе Царство Небесное»[69].'
        cn: 我们从小的顺从行为开始，放弃我们堕落的身体、意识和心神中小的个人意志。通过这种方式，我们可以享受上帝赐予我们的修道生活形式，并以此生活。我为何对你们说：「享受」呢？请原谅我，但上帝在我的修道生活之初就赐予了我这种享受。我怀着敬畏之心思想，并在祷告中记念院长以及与他一同工作的同道们——他们所有人都为整个修道院的生活操劳，但我的心神完全摆脱了世俗的烦恼：他们的操劳使我得以在尘世事务上无忧无虑。在我的文章《论东正教苦修的根基》中，我谈到通过顺从，我们得以领受纯洁的祷告，这是即使是再伟大的哲学家，甚至是神学家也难以达到的[68]。处于这种纯洁心神的状态，持续不断地站在绝对的上帝面前——这正是「带着能力降临的天国」[69]的真实体现。
    - type: paragraph
      text:
        ru: Быть послушником – это дар свыше, который мы должны усвоить. Каждый из нас должен думать, что он совершает грех, если на просьбу или нужду брата отвечает отталкиванием. Пусть самая первая реакция будет следствием нашего постоянного состояния готовности предпочесть волю брата нашего, а не свою. Таким путем мы придем к тому, чтобы вырваться из узких рамок эгоистического состояния падения нашего. И подвиг этот для многих может быть тяжел.
        cn: 成为初学修士是来自上天的恩赐，我们应当将其领受。我们每个人都应该认为自己犯了罪，如果面对弟兄的请求或需要，却冷淡地加以推拒。愿我们最首要的反应是源于我们时刻准备着的状态，宁愿选择我们弟兄的意愿，而非自己的。循此途径，我们就会挣脱我们自私堕落状态的狭隘桎梏。而这份苦修对许多人来说可能会很艰巨。
    - type: paragraph
      text:
        ru: 'Новоначальные, прошедшие высшие школы и университеты, все вы являетесь жертвой воспитания в этом мире, и отказаться вам от своих помышлений и воли, претерпевая истощание, может быть весьма трудным. Как говорит прп.Иоанн Лествичник, «послушник стоитодеснуюраспятого Христа»[70]. И когда мы заняты этим вопросом, тогда все наши движения – и ума, и сердца нашего – есть уже движения в иной сфере бытия. И тогда становится неважным, кто что делает. Говорю словами Силуана, нашего благословенного великого отца: «В этом мире у каждого свое послушание: один – царь, другой – патриарх, третий – учитель, четвертый – столяр... И это неважно!»[71]. В его сознании не было и тени зависти – ни к богатым, ни к властным. Он говорил, что это – неважно, но кто любит Христа, тот, соответственно силе и напряжению своей любви, будет ближе к Богу, и это – важно. Если Бог даст вам это сознание, тогда вы освободитесь от всякого движения зависти (не хочу я употребить слово «зависти», но какое-то другое, менее жестокое слово). Оставляем мы всех и каждого жить на земле так, как они хотят: у нас нет никакого посягательства на их жизнь. Для нас вся жизнь исходит от лица Самого Бога, как это мы видим у Христа. По Евангелию, Он совершал Свой акт, противоположный акту Адама в Раю, и все время носил в Своем сознании Отца и с Ним говорил, с Отцом, а не с теми, которые распинали и убивали Его. Про них Он сказал: «Господи, прости, они не знают, что они творят»[72]; а пред Ним было вольное страдание, противоположное акту Адама.'
        cn: 初入道者，受过高等教育、大学毕业的你们，都是这世俗教育的牺牲品，对你们而言，放弃自己的思想和意志，承受虚己，可能极其困难。正如可敬者约翰·思梯尼（攀登者）所说：「听命者立于被钉十字架的基督右边」[70]。当我们关注这个问题时，我们一切的运动——无论是思想的，还是心灵的——都已是进入另一存在领域的运动了。那时，谁做什么也就不重要了。我引用我们蒙福的伟大教父圣西卢安的话说：「在这世上，人人都有自己的本分：有的是君王，有的是牧首，有的是教师，有的是木匠……这都无关紧要！」[71]。在他的意识中，丝毫没有嫉妒的阴影——无论对富人还是对有权势者。他曾说，这些都无关紧要，但谁爱基督，谁就会根据其爱德的力量和程度，更亲近上帝，这才是重要的。如果上帝赐予你们这种意识，你们就会摆脱一切嫉妒的情绪（我不想用『嫉妒』这个词，而想用另一个不那么残酷的词）。我们让每个人都随心所欲地在这世上生活：我们对他们的生活没有任何侵犯。对我们而言，所有的生命都源自上帝的圣颜，正如我们在基督身上所看到的。根据福音书记载，祂所行的与亚当在乐园中的行为截然相反，祂的意识中始终存有父（上帝），并与父（上帝）交谈，而不是与那些将祂钉死并杀害祂的人交谈。祂论及他们说：「祢啊，赦免他们，因为他们不知道自己在做什么」[72]；而祂面前乃是自愿受难，与亚当的行为截然相反。
    - type: paragraph
      text:
        ru: 'В чем наш подвиг? – В том, чтобы победить нашу индивидуальную греховную волю, став носителями сознания Самого Бога, то есть Христа. В чем задание? – В том, чтобы мы мыслили, как мыслит Сам Бог, и в том, чтобы мы видели вещи, как Сам Бог их видит. И от малых вещей получается результат колоссальный, грандиозный, который может поражать всякого человека: «И как это возможно?».'
        cn: 我们的属灵功修是什么？——在于战胜我们个体有罪的意志，成为上帝自身的意识，也就是基督的承载者。任务是什么？——在于我们思想，如同上帝本身所思想的，并在于我们看见事物，如同上帝本身所看见的。而从微小的事物中，会产生出巨大、宏伟的结果，这能使所有人感到惊异：『这怎么可能呢？』
    - type: paragraph
      text:
        ru: 'Итак, да даст Господь всем вам, дорогие мои братья и сестры, носить в себе сознание Христа и понемногу, терпеливо, на каждый день, нести подвиг отсечения своей индивидуальной воли ради того, чтобы войти в поток предвечной и вечной воли Самого Бога: «Да будет воля Твоя яко на небеси и на земли» сердца нашего. И когда мы попадем в этот всемирный, и до-мирный, и сверх-мирный поток воли Божией, тогда мы почувствуем, что в нас, в наших жилах, потекла вечная жизнь. И тогда то, что логически было для нас невозможным, вдруг станет фактом нашей жизни.'
        cn: 那么，愿上主赐予你们所有人，我亲爱的弟兄姊妹们，怀有基督的意识，并且日复一日，循序渐进，耐心而行，承担起割舍个人意志的苦修，为了进入上帝自身那先于诸世并永恒的旨意之洪流中：「愿祢的旨意成就，如同在天上，也在我们心中的地上。」当我们进入这普世的、先于世界的、超乎世界的上帝旨意之洪流中时，那时我们将会感受到，永恒的生命已在我们体内，在我们血管中流淌。届时，对我们而言在逻辑上不可能的事，将会突然成为我们生命的现实。
    - type: paragraph
      text:
        ru: 'Итак, да благословит Бог ваш приход к нам, дорогие новые братья мои и сестры. Приготовьтесь шествовать двойным путем: путем радости о Боге и путем страданий воплощенного Слова Отчего. Этот путь есть постоянное сочетание если не Голгофы, то Гефсимании, и если не Гефсимании, то иных состояний страдающего Христа с ощущением новой жизни в нас. К Божией Матери весь мир обращается в скорби с просьбой о помощи, и некоторым святым дано было видеть Божию Матерь, молящуюся непрестанно за весь мир. Молитва за весь мир, конечно, есть следствие страдающей всеобщей любви Христовой, и эта любовь уже неразрушима, и в этой любви – и великолепие, и мудрость, и смысл, и сила, и красота, – все, что хотите. И тогда страдания не живутся на земле как смерть, а как проявление, в той или иной форме, все той же известной любви Отчей. Итак, да вдохновитесь вы на эту жизнь и положите крепкое начало в себе.'
        cn: 那么，我亲爱的新弟兄姐妹们，愿上帝赐福你们来到我们这里。预备好行走双重道路：一条是因上帝而有的喜乐之路，另一条是道成肉身之父道（圣言）的苦难之路。这条道路是恒久的结合，若非髑髅地，便是客西马尼；若非客西马尼，便是基督受苦的其他境况，伴随着我们内在新生生命的感受。整个世界在苦痛中向圣母祈求帮助，并且有些圣者曾蒙恩得见圣母为整个世界不停地代祷着。为整个世界的代祷，当然是基督那受苦的普世之爱的结果，并且这爱已是不可摧毁的；在这爱中，有着宏伟、智慧、意义、力量和美丽——一切你们所愿的。这样，苦难在地上便不再被活成死亡，而是以这样或那样的形式，显明着那一直以来为人所知的父爱。那么，愿你们被激励去投入此生，并在自己里面奠定坚实的基础。
    - type: paragraph
      text:
        ru: 'Я вспоминаю другой вопрос новопришедших: «Скажите, отец Софроний, что делать мне, когда я стою в церкви на общей молитве?». Конечно, это чудные часы – находиться в помещении, где кто-то призывает имя Господне! Чтобы не рассеивалось внимание, христианские аскеты держат себя в большом напряжении тела, а не так, как свойственно людям, ищущимrelaxationв медитациях. И когда кругом вас призывают имя Господне и вы живете в этой атмосфере, то это с годами перерождает всю вашу природу: не сразу, а постепенно, через причащение Тела и Крови Христа. Молитесь, чтобы Господь Своим присутствием дал нам зреть наши грехи и прегрешения – всю нашу греховность как состояние вследствие падения Адама.'
        cn: 我回想起初来者问的另一个问题：「请问，索夫罗尼神父，当我在教堂里参加公共祷告时，我该怎么做呢？」 当然，这是美好的时光——身处有人呼求上主圣名的空间！为使注意力不致分散，基督徒苦行者使身体保持高度的紧张，而非像那些在默想中寻求relaxation的人那样。当你周围都在呼求上主圣名，并且你生活在这种氛围中时，那么这会随着岁月，将你整个本性转化：不是立刻，而是循序渐进地，借着领受基督的圣体和宝血。祷告，祈求上主借着祂的临在，让我们得以看见我们的罪恶和过犯——我们所有的罪性，视作亚当堕落所导致的一种状态。
    - type: paragraph
      text:
        ru: Вдохновение, которое необходимо для христианской жизни, понимается как дар Духа Святого, но это не зависит от одного Бога. От Него исходящее, оно может достигнуть нас, только если мы сами принимаем и хотим этого. Ибо должна быть гармоническая связь двух воль – и Бога Самого, и нашей воли.
        cn: 基督徒生活所必需的灵感，被理解为圣灵的恩赐，但这并非仅取决于上帝。从祂（上帝）而出，唯有当我们自己接受并愿意时，它才能临到我们。因为必须有两种旨意的和谐联结——即上帝本身的旨意，以及我们的旨意。
    - type: paragraph
      text:
        ru: 'Если Господь и как человек восходил на Голгофу с сознанием космическим и сверхкосмическим, то, конечно, весь акт Его принимает характер сверхкосмический. Другие, распятые с Ним, не носили этого сознания, и их страдания были другого порядка, чем страдания Христа. Так и вы – начиная с «Господи, помилуй мя, грешного» – постепенно дойдете до всемирного сознания, когда наше существование уже неотделимо от всего тела человечества. И тогда наша молитва приобретет уже измерения космические. А покамест кричите: «Господи, помилуй мя, грешного!». И не надо думать, что мы уже владеем последним, но хорошо знать об этом пути и о том, что преподается в этой школе, которая называется «монастырь». Потому что люди смотрят снаружи и ничего не видят и говорят: «Что они там бездельничают?!». И чуждо им сознание, которое носил в Себе Христос и которое Он хочет сообщить нам, чтобы мы были подобными Ему Самому – на всю вечность. Если у нас есть конфликт со Христом вместо абсолютной гармонии, то ни нам, ни Христу не будет возможным жить Вечное Царство в гармонии, ему свойственной. Итак, мы хотим усвоить постепенно сознание Самого Бога нашего и через это улучить то, что Отцы называют обожением. Спасение и есть обожение, которое состоит в усвоении богоподобного сознания, а не в том, что мы становимся богами для других.'
        cn: 如果上主作为人登上各各他时，带着宇宙性和超宇宙性的意识，那么，当然，祂的整个行动就具有超宇宙性的特征。其他与祂一同被钉十字架的人，没有怀有这种意识，他们的苦难与基督的苦难是不同层级的。你们也是如此——从「上主，求祢怜悯我这罪人」开始——将逐渐达到普世意识，那时我们的存在就与全人类的整体密不可分。那么，我们的祷告就将获得宇宙性的维度。而现在，请呼喊：「上主，求祢怜悯我这罪人！」并且不必认为我们已经拥有了终极之物，但要好好了解这条道路，以及在这所被称为「修道院」的学校中所传授的一切。因为人们从外面看，却什么也看不到，便说：「他们在那儿做什么闲事？！」并且他们不理解基督所怀有的、以及祂希望传达给我们的意识，好使我们在永恒中与祂自己相似。如果我们与基督之间存在冲突而非绝对的和谐，那么，无论是我们还是基督，都不可能以其固有的和谐生活在永恒国度中。因此，我们希望逐渐领受我们上帝自己的意识，并借此获得教父们所称的「成神」。救赎即是成神，它在于领受神性的意识，而非我们成为他人的神明。
  - type: heading2
    text:
      ru: 'Беседа 9: О восприятии греха, покаянии, богоподобии, молитве и других аскетических вопросах[73]'
      cn: 讲道 9：关于对罪的认知、悔改、肖似上帝、祷告以及其他苦修问题[73]
    children:
    - type: paragraph
      text:
        ru: В монастыре утончается наше восприятие всякого греха. О болезнующем покаянии. Цель подвига – богоподобие в наших реакциях. Слово инодвижно. Об Иисусовой молитве. О ее должном произнесении. О крестном знамении. Практическое положение монастыря. О никогда не умаляемом вдохновении. О мирском надмевающем «всезнании» и христианском смиренно-мудрственном познании
        cn: '在修道院中，我们对任何罪的感知都变得敏锐。

          关于痛悔。

          苦修的目标——在我们的反应中肖似上帝。

          话语独运。

          关于耶稣祷文。

          关于它恰当的诵念。

          关于划十字圣号。

          修道院的实践境况。

          关于从不减弱的灵感。

          关于世俗那令人傲慢的「无所不知」以及基督徒那谦卑智慧的认知。'
    - type: paragraph
      text:
        ru: Каждый раз, когда Бог дает мне видеть вас, собранных воедино, естественно, радуется мое сердце. Это новое явление в нашей жизни, когда мы собираемся каждую неделю, и я думаю, что нам нужно укрепить этот добрый обычай, используя всякий час данной нам жизни для построения нашего спасения. Мало единой беседы на полчаса. Я бы хотел, чтобы и кто-то другой говорил о иных аспектах. Слава Богу, мы могли бы это делать.
        cn: 每当上帝使我看见你们聚集在一起，我的心自然欢喜。我们每周聚集，这是我们生活中的一个新现象，我认为我们需要巩固这个美善的习俗，利用我们生命中被赐予的每一小时，为了建立我们的救恩。仅仅半小时的一次交谈是不够的。我希望也能有其他人谈论其他的方面。感谢上帝，我们本可以做到这一点。
    - type: paragraph
      text:
        ru: 'Вчера на долгой прогулке я спрашивал всех и каждого, о чем вы хотите, чтобы я сказал сегодня, и все были в затруднении. Я понимаю это затруднение. В данный момент мне пришла мысль об одном странном явлении в жизни монаха: покамест он жил в миру, рассеянный на многие стороны ум его не улавливал происходящего внутри. Но когда приходит он в монастырь, то ум его сосредоточивается внутрь, и он все больше и больше видит в себе отступлений от заповедей Христа. И получается впечатление, что, придя в монастырь, человек становится хуже и хуже, а не лучше. Это не потому, что человек имеет больше плохих мыслей в монастыре, чем в миру, нет, но потому, что, сосредоточиваясь внутри, он видит все недостатки в себе самом острее, и страдает от них, и говорит: «Я стал хуже, чем когда-то был в миру». С первородным грехом можно себе вообразить такое сравнение: на операционном столе лежит больной, врачи открывают его тело и повсюду видят присутствие раковых новообразований. Так происходит и с нами – наша реакция на все, что бы ни встретилось нам в жизни, должна была бы быть согласной с заповедью Христа, но, где бы нас ни «открыли», мы видим, что этого нет. И мы начинаем страдать от этого и ищем выхода, но выход вот в чем: не в том, что мы видим себя лучшими, а выход в познании, что таков наш путь. И если раньше мы не беспокоились о каком-то грехе, даже на деле совершенном, то в монастыре мы беспокоимся о том, что к нам прикасаются мысли недобрые: мысли тщеславия, превосходства, иногда самодовольства и так далее. Читая жития святых, вспоминайте слова отца Ювеналия, который был моим соседом на Афоне, в монастыре. Он мне сказал так: «Отец Софроний, я люблю читать жития святых. Мне приятно видеть, и слышать, и узнавать, как они спаслись из греховного состояния». Итак, в монастыре, в этом благословенном учреждении Духа Святого, утончается наше восприятие вообще всякого отступления от закона любви Отчей. Если мы созданы по образу Бога Любви, Любви абсолютной, то мы ждем в самих себе проявления этого «образа и подобия» и страдаем, если мы еще не в том состоянии, когда всякая наша реакция естественным образом соответствует этому Богу Любви.'
        cn: 昨天在一次长久的散步中，我询问了每一个人，你们今天希望我说些什么，每个人都感到为难。我理解这种为难。此时此刻，我想到了修道者生活中一个奇怪的现象：当他在尘世中生活时，他那心神分散于多方面的思绪无法察觉内在发生的一切。但当他来到修道院时，他的心神便专注向内，他在自身中越来越多地看到违背基督诫命之处。于是就给人一种印象，仿佛一个人来到修道院后，变得越来越糟，而非越来越好。这不是因为一个人在修道院里比在尘世中有更多不好的念头，不是的，而是因为，当他专注向内时，他更敏锐地看到自己所有的缺点，并因此而痛苦，说：「我比在尘世中时更差劲了。」关于原罪，可以想象这样一个比喻：一位病人躺在手术台上，医生打开他的身体，随处可见癌性赘生物的存在。我们也是如此——我们对生活中所遇到的一切事物的反应，本应符合基督的诫命，然而，无论我们在何处被「打开」，我们都发现并非如此。于是我们开始为此而痛苦，并寻求出路，但出路在于：并非我们认为自己变好了，而在于认识到，这就是我们的道路。如果以前我们对某种罪过不以为意，即便那罪过是实际犯下的，那么在修道院里，我们则担心不好的念头会触及我们：诸如虚荣、优越感，有时甚至是自满的念头等等。阅读圣徒传记时，请回想尤维纳利耶神父的话，他曾是我在阿索斯圣山修道院的邻居。他这样对我说：「索夫罗尼神父，我喜欢阅读圣徒传记。我很高兴看到，听到，并了解到他们是如何从罪恶的状态中得救的。」因此，在修道院里，在这个圣灵所赐福的机构中，我们对于任何偏离父性之爱律法的情形，感知变得更为敏锐。如果我们是照着爱之上帝，那绝对之爱的形象被造的，那么我们便期待在自身中显现出这种「形象与样式」，而当我们尚未达到那种一切反应都能自然地符合这位爱之上帝的状态时，我们便会感到痛苦。
    - type: paragraph
      text:
        ru: Как мы можем сделать наш дух обнимающим все в своем движении любви ко всей твари и к Богу и плачущим в молитве? – Мы знаем из чтений житий святых, из их поучений и писаний, что никто из них не прошел свой путь без временных отступлений, падений или скольжений во грех. Все без исключения спасались покаянием. Так что, когда появляется у нас чувство, что мы действительно – порождение тьмы адской, это есть должный результат духовной науки. И, как вы знаете, в молитвах Великого поста есть постоянная просьба о том, чтобы Бог открыл нам «двери покаяния» – сей царский путь из мрака греховного и смерти к Богу Отцу в Его Царство, освященное незаходящим Солнцем.
        cn: 我们如何能使我们的精神，在其向着一切受造物和向上帝的爱的运动中拥抱万有，并在祷告中哭泣呢？——我们从阅读圣徒的生平、从他们的教诲和著作中得知，他们中无人能不经历暂时的背离、跌倒或滑入罪中，便走完自己的道路。所有人无一例外地都因着悔改而得救。因此，当我们产生一种感觉，认为我们确实是地狱黑暗的产物时，这便是灵性科学应有的结果。而且，如你所知，在大斋期的祷告中，持续不断地恳求上帝为我们敞开「悔改之门」——这条君王之路，从罪恶与死亡的黑暗中，通往上帝圣父被永不落之日所圣化的国度。
    - type: paragraph
      text:
        ru: 'Вот мы с вами беседуем, и в моем сердце бьются слова: мы должны быть благодарны Богу за то, что нам дано покаяние через явление во плоти Сына Божия, без Которого ничто не было создано, то есть, иначе говоря, Бога и Творца нашего. В Символе веры сказано: «Имже вся быша», как и в начале Евангелия:«...и без Него ничтоже бысть, еже бысть»[74]– через Него все получило жизнь. Парадоксальное явление: покаяние – по ощущению своему – есть болезнь, болезненное сожаление о том, каковыми мы являемся и проявляем себя на каждый день. Чем болезненнее оно становится, тем больше действует оно в перерождении нашем в «нового человека»[75]и в возвращении к совершенному образу создавшего нас Бога. И хотя это есть болезненное ощущение, но оно как-то странно удовлетворяет покаянный дух грешника, и мы начинаем любить это состояние покаяния.'
        cn: 我们此刻与您交谈，我的心中涌动着这样的话语：我们应当感谢上帝，因为我们蒙受了悔改的恩赐，借由上帝之子道成肉身——祂是万物赖以被造者，换言之，祂是我们的上帝和造物主。在信经中说道：「万物皆藉祂而有」，正如在福音书开篇所言：「……凡被造的，没有一样不是藉着祂造的。」[74]——借由祂，万物皆得了生命。一个悖论性的现象：悔改——就其感受而言——是一种病痛，一种痛苦的悔恨，悔恨我们每日所是和所行的样子。它越是痛苦，它就越能发挥作用，使我们重生为「新人」[75]，并回归到创造我们的上帝那完美的形象。尽管这是一种痛苦的感受，但它却以某种奇特的方式，满足了罪人悔改的灵魂，我们也开始爱上这种悔改的状态。
    - type: paragraph
      text:
        ru: Мы все время идем путем обвинения нас самих, и если в нас обнаруживается место, то Бог Сам спускается в наш «подвал», темный подвал (не говорю «этаж», а «подвал»), и возносит нас к Себе. И когда Он спускается в наш «подвал», то странным образом Его присутствие делает все блаженным Царством Отца.
        cn: 我们一直走在自我谴责的道路上，并且，如果我们里面有了空间，上帝祂自己就降入我们的「地下室」，那漆黑的「地下室」（我说的不是「楼层」，而是「地下室」），并将我们提升到祂那里。而当祂降入我们的「地下室」时，祂的临在就奇妙地使一切都变为蒙福的父的国度。
    - type: paragraph
      text:
        ru: 'Вот мне приходит мысль такая: возьмем дерево и стукнем по нему. Этот звук есть его реакция, естественно свойственная его природе. Если мы возьмем другой предмет, какой-нибудь металл, то получится другой звук, другая реакция. А наша реакция на всякое явление в жизни должна быть той, которая предписана нам заповедью. Стать человеком, реакции которого подобны реакциям Бога, – вот цель нашего подвига. Итак, если происходит процесс, когда мы видим себя все хуже и хуже, то это Бог Премудрый (в молитвах древних сказано «хитрый») так устраивает, что мы действительно страдаем, болеем этим и хотим освободиться.'
        cn: 我有一个这样的想法：我们拿一棵树，敲打它。这个声音就是它的反应，是它本性固有的。如果我们拿另一个物体，比如某种金属，就会发出不同的声音，产生不同的反应。而我们对生活中一切现象的反应，应该符合诫命为我们所规定的。成为一个反应与上帝的反应相似的人，——这就是我们苦修的目标。因此，如果存在这样一个过程，当我们看到自己越来越差时，那么这就是智慧的上帝（在古代祷文中称作「狡黠的」）如此安排，使我们真正为此受苦，为此病痛，并渴望得解脱。
    - type: paragraph
      text:
        ru: 'Дух наш пребывает в постоянном движении и так живет, как будто бы бестолково, без всякой логики, подобно моему слову. Но эти колебания нашего духа внутри нас иногда могут принимать страдальческий и трагический характер. Несмотря на весь наш подвиг, на все наше старание, нам ничего не удается: наши реакции не такие, как у предметов, – свойственные их естеству. А наше естество должно быть подобным Богу.'
        cn: 我们的灵处于不断的运动之中，并且活得仿佛杂乱无章、毫无逻辑，就像我的话语。但我们灵里这些波动有时会呈现出苦难和悲剧的性质。尽管我们所有克己苦修，尽管我们一切的努力，我们却一无所成：我们的反应不像物体那样——它们本性所固有的。而我们的本性应当像上帝。
    - type: paragraph
      text:
        ru: 'Но почему беспорядочно слово, когда я ищу единого слова? – Если мы будем говорить серьезно, то коснемся очень важного явления, что мы – инодвижные существа: какая-то другая сила двигает нами. И вот та сила, которую вы представляете здесь, отражается в моем слове. И само слово есть отражение того, что дни наши проходят так же бестолково, как я говорю. Мы все время кружимсяautour du pot(«вокруг да около»), мы все ищем. А моя попытка – собратьdans le pot... чтобы все происходило уже внутри этогоpot, этого сосуда. И этоautour du potестественно, покамест мы не переживем действительного пришествия Духа Божия в нас. Тогда все соединяется...'
        cn: 但为何当我寻求一个独一的词语时，言语却如此纷乱无章呢？——如果我们认真地谈论，就会触及一个非常重要的现象，即我们是「他动」的受造物：某种别的力量在推动着我们。而这股你们在此所呈现的力量，正反映在我的言语中。言语本身也是一种反映，反映着我们的日子过得同样漫无目的，就像我所说的。我们总是围绕着这个「锅」打转（意即兜圈子），我们都在寻找。而我的尝试是把一切都收集到「锅」里……好让一切都发生在这个「锅」里，这个器皿中。而这种围绕着「锅」打转是自然的，直到我们真正经历上帝之圣灵在我们内的降临。那时，一切就都连结起来了……
    - type: paragraph
      text:
        ru: 'Молитва именем Иисуса заповедана Им Самим: «Просите во имя Мое»[76]. Но применение этого образа молитвы в жизни нашей повседневной требует большой осторожности. На Афоне духовная жизнь очень удобна, потому что она обеспечена извне. Там монахи могут посвящать этой молитве восемь, и двенадцать часов, и больше... Но это не для всех, далеко не для всех. И даже когда постоянно действует молитва, она действует иным путем, без ясного участия нашего мозга. Молитва двигается как бы в самом сердце, а ум наш может быть занят чем-нибудь другим. И тогда мы можем исполнить заповедь Апостола – всегда молиться, «непрестанно молиться»[77].'
        cn: 耶稣圣名祷文是祂亲自诫命的：「奉我的名求」[76]。然而，将这种祷告方式运用于我们的日常生活中，需要极大的谨慎。在阿索斯山，属灵生活非常便利，因为它有外在的保障。那里的修士们可以投入八小时、十二小时甚至更多时间在这祷告上...但这并非适用于所有人，远远不是适用于所有人。甚至当祷告持续不断地运行，它也是以另一种方式运行的，没有我们大脑的清晰参与。祷告仿佛在心底运行，而我们的心智可能在忙碌着别的事情。这样一来，我们就能遵行使徒的诫命——常常祷告，「不住地祷告」[77]。
    - type: paragraph
      text:
        ru: 'Для всех и каждого – своя мера. На Афоне в одном монастыре чуть ли не четыре часа надо повторять эту молитву, помимо богослужебных часов. И опыт показал, что даже при отсутствии нужд житейских не может выдержать человек такой молитвы. Лично я с самого начала предложил три часа утром и три часа вечером, а потом свел это до двух часов утром и двух часов вечером. То есть, по правилу монастырскому, четыре часа посвящены этой молитве. «Именем Моим бесов ижденут», – говорит Христос[78]. Настолько действенно сие великое Имя! И Бог относится к нам с большой деликатностью, потому что могут быть даны часы молитвы, когда не может произнести человек имя Христа, потому что оно слишком грандиозно. Это немножко похоже на то, когда мы молимся и говорим: «Отче наш». Бог может дать такое сознание, когда дальше этих двух слов – «Отче наш» – дух уже ничего не может сказать. Так, когда произносит человек это имя – «Иисусе Христе, Сыне Отечь, вземляй грех мира, помилуй мя грешнаго», – переживание этих слов может и должно быть потрясающим и увлекающим все наше естество. Наверное, так будет на Небе. Но на земле, в этом теле, мы не выдержим этого и, конечно, скоро покинем сей мир. Поэтому делание молитвы продолжается годами, десятилетиями, с терпением и ожиданием, когда Сам Бог придет в нас жить Его имя. Конечно, таинство имени Божиего велико. Каков смысл слов Христа: «во имя Мое»? Получается какое-то разделение Его Самого и Его имени? Но, так или иначе, мы молимся именем Самого Христа, и говорим в церкви: «Господи Иисусе Христе, Сыне Божий, помилуй нас», и повторяем то же самое. Но это есть не бессмысленное повторение, а молитва – одна и та же, чтобы удержать ее силу целиком с нами. Некоторым кажется бесполезным это повторение: «Господи помилуй, Господи помилуй, Господи помилуй, Господи помилуй...».'
        cn: '每个人都有自己的度量。在阿索斯圣山，某座修道院里，除了神圣礼仪时间之外，几乎要花四个小时重复这祷告。而经验表明，即使在没有世俗需求的情况下，人也无法承受如此长时间的祷告。我个人从一开始便建议早上三小时、晚上三小时，后来又将其缩减为早上两小时、晚上两小时。也就是说，按照修道院的规矩，有四个小时是专门为此祷告所设。


          「奉我的名，他们必驱逐鬼魔」，——基督如此说道[78]。这个伟大的圣名是如此地有效！上帝以极大的温柔对待我们，因为可能会有这样的时候，人无法说出基督的圣名，因为祂是如此的宏伟庄严。这有点像我们祷告时说：「我们的父。」上帝可能会赐予一种意识状态，那时人的灵除了「我们的父」这两个词之外，已无法再说出任何东西。因此，当人说出这个圣名——「主耶稣基督，父的圣子，除免世罪者，求祢怜悯我这罪人」——对这些话语的体验可能也必定是震撼人心并完全吸引我们整个本性的。或许，在天国中会是如此。但在地上，在这肉身中，我们无法承受如此，并无疑会很快离开这个世界。因此，祷告的操练持续经年累月，甚至数十年，带着耐心和期待，直到上帝亲自来到我们里面活出祂的圣名。


          当然，上帝圣名的奥秘是伟大的。基督所说「奉我的名」这些话语的意义是什么？这是否意味着祂自身与祂的圣名之间存在某种分离呢？然而，无论如何，我们都奉基督的圣名祷告，并在教会中说：「主耶稣基督，上帝之子，求祢怜悯我们」，并重复同样的话。但这并非毫无意义的重复，而是一种祷告——同一的祷告，为要完整地将它的力量维系在我们身上。有些人觉得这种重复毫无益处：「主啊，怜悯！主啊，怜悯！主啊，怜悯！主啊，怜悯！……」'
    - type: paragraph
      text:
        ru: 'На Афоне один монах, который был раньше губернатором, спросил меня:'
        cn: 在阿陀斯山，一位曾是总督的修士问我：
    - type: paragraph
      text:
        ru: – Отец Софроний, не кажется ли Вам излишним, что сорок раз говорят «Господи помилуй, Господи помилуй, Господи помилуй»? Ну скажи три раза, и довольно!
        cn: – 索夫罗尼神父，您不觉得人们重复四十次「上主，求祢怜悯！上主，求祢怜悯！上主，求祢怜悯！」是过多的吗？说三次就够了！
    - type: paragraph
      text:
        ru: 'Я говорю:'
        cn: 我说：
    - type: paragraph
      text:
        ru: '– В Церкви принято, что иногда повторяют только один раз, иногда – двенадцать, а иногда сорок – на разные вкусы людей. Потому что есть люди, которые хотят говорить это день и ночь... Так что надо терпеть, не все молятся одинаково: Церковь молится по-разному.'
        cn: ——在教会里，惯例是：有时只念诵一遍，有时十二遍，有时四十遍——以适应人们不同的喜好。因为有些人想昼夜不停地念诵它……所以需要宽容，并非所有人以同样的方式祷告：教会以不同的方式祷告。
    - type: paragraph
      text:
        ru: 'Но, правда, технически эта молитва выполняется всегда как-то, я бы сказал, «дефективно». Какой недостаток в этом есть? Один старец говорил «Κύριε ἐλέησον», ускоряя: «Кирие элейсон, Кирие элейсон, Кир... сон, Кир... сон». И, конечно, так не должно быть. Но как выработать способ сказать сорок раз «Господи помилуй, Господи помилуй, Господи помилуй, Господи помилуй, Господи помилуй...», чтобы удержать ум? Что значит «помилуй»? – «Исцели мой грех, сделай меня способным воспринимать Твою волю». Вот что такое «помилуй»! Говорится слово «помилуй», потому что я прошу Бога о милости – снизойти до меня.'
        cn: 然而，实际上，这种祷告的进行总是，可以说，有些「缺陷」。这其中有什么不足之处呢？一位长老在念诵「Κύριε ἐλέησον」时，加速念成：「基里耶 埃雷伊森，基里耶 埃雷伊森，基尔……森，基尔……森」。当然，不应该这样。但是，如何才能找到一种方法，念诵四十遍「上主，怜悯我，上主，怜悯我，上主，怜悯我，上主，怜悯我，上主，怜悯我……」而能保持心神专注呢？「怜悯我」是什么意思？——「医治我的罪，使我能够领受祢的旨意。」这才是「怜悯我」的真义！之所以说「怜悯我」这个词，是因为我祈求上帝的怜悯——俯就于我。
    - type: paragraph
      text:
        ru: 'Эти слова «Κύριε ἐλέησον» по-гречески и по-русски звучат немножко иначе, чем по-французски: «Seigneur aie pitié», или по-английски: «Lord, have mercy». Французы не любят слово «pitié», и что с ними делать?'
        cn: 这些词「Κύριε ἐλέησον」在希腊语和俄语中，听起来略有不同于法语的「Seigneur aie pitié」或英语的「Lord, have mercy」。法国人不喜欢「pitié」这个词，那该拿他们怎么办呢？
    - type: paragraph
      text:
        ru: Но может прийти молитва в такое состояние, когда Бог с нами и произнесение Его имени действительно как огонь пожигает нас. Так надо было бы произносить и «Отче наш». По существу говоря, если мы один раз за всю нашу жизнь скажем эти слова с их подлинным смыслом, соответствующим реальности самого бытия, – «Отче наш» – довольно этого. В этом тайна, как переродиться из нашего состояния греховного в такое, которое ожидает от нас Господь.
        cn: 但祈祷可能会达到这样一种状态，当上帝与我们同在，并且呼唤祂的名确实如火一般焚烧我们。如此也当诵念「我们的天父」。实际上说来，倘若我们一生中只有一次，以其真实的意义，且与存有的真实本身相符的方式，诵念这几个字——「我们的天父」——也就足够了。这便是奥秘所在，如何从我们有罪的状态脱胎换骨，变为上主所期盼的状态。
    - type: paragraph
      text:
        ru: 'Так, вопрос молитвы именем Иисусовым занимает очень важное место в жизни Церкви, ибо это есть вопрос спасения мира, потому что Христос есть Спаситель мира. Очень многое не зависит от нас, но можно сказать и обратное – от нас зависит многое. В Церкви установилось молиться так: «Господи Иисусе Христе, Сыне Божий, помилуй мя грешнаго», – прежде как покаянная молитва. Но «грешнаго» мы говорим, только когда молимся в одиночку: мы не можем сказать, что наш брат грешный. Поэтому, когда говорим: «помилуй нас», слово «грешный» не произносится. Мы делаем согласно Посланиям Апостолов, где все члены той или иной поместной Церкви – святые. И чем глубже наше болезненное ощущение присутствия в нас греха, тем больше получается результат от каждого призывания имени Божиего. Но еще многие-многие годы надо говорить эту молитву, пока не срастется все наше существо с именем Христа, Спасителя нашего.'
        cn: 因此，关于耶稣圣名祷文的问题在教会生活中占据着非常重要的地位，因为这事关世界的救赎，也因为基督是世界的救主。许多事情不取决于我们，但也可以反过来说——许多事情取决于我们。在教会中，人们习惯这样祷告：『我主耶稣基督，上帝之子，怜悯我这罪人！』——这起初是一种忏悔祷文。但是『这罪人』这个词，我们只在独自祷告时才说：我们不能说我们的弟兄是罪人。因此，当我们说：『怜悯我们』时，『罪人』这个词就不说出来。我们这样做是依循使徒书信的教导，在其中，某个地方教会的所有成员都被称为圣徒。我们对自身罪恶存在的痛苦感受越深，每一次呼求上帝之名所产生的果效就越大。但是，还需要许许多多年诵念这祷文，直到我们整个存在与基督——我们的救主——的圣名完全结合为止。
    - type: paragraph
      text:
        ru: В статье «О молитве Иисусовой»[79]целью моей было удержать многих людей от доверия к некоторым писаниям, которые извращают традицию Церкви. В этой статье я хотел подчеркнуть то, что несомненно принадлежит к традиции. Это очень сжатое, короткое описание. Но тайна этой молитвы, так же как тайна Христа, – необъяснима, и дается жить ее, эту тайну, опытом.
        cn: 在《论耶稣祷文》[79]一文中，我的目的是使许多人不再信任某些歪曲教会传统的著作。在本文中，我想强调那些无疑属于传统的事物。这是一个非常精炼、简短的描述。但这祷文的奥秘，正如基督的奥秘一样，是无法解释的，且唯有透过经验方能活出这奥秘。
    - type: paragraph
      text:
        ru: Блаженный Силуан говорил мне, что в деревне некоторые младенцы, умирая, делали крестное знамение. Кто, какой дух двигает этих младенцев сделать крестное знамение? А многие монахи испытали такое положение, когда от подвига и усталости, скорбей и болезней, от вражеских нападений человек ощущает себя подавленным, и тело его становится парализованным. И как выйти из этого состояния паралича? – Если я в состоянии двинуть на несколько сантиметров рукой и сделать знамение креста, то я моментально освобождаюсь от этого паралича. Но иногда даже этого нельзя сделать. Тогда ищешь другой способ, как перекреститься. Сила крестного знамения есть «Сила Честнаго и Животворящего Креста». Так же и с именем Христа – мы познаем его силу из опыта. И никак нельзя объяснить словами, почему.
        cn: 圣西卢安告诉我，在村子里，有些婴儿在弥留之际会划十字圣号。是谁，是何种灵推动这些婴儿划十字圣号呢？而许多修士也经历过这样的境况：当人因苦修与疲惫、忧患与疾病，以及仇敌的攻击而感到心神压抑时，他的身体会变得麻痹。而如何摆脱这种麻痹状态呢？——如果我能将手移动几厘米，并划十字圣号，我就立刻从这种麻痹中解脱出来。但有时甚至连这都无法做到。那时便寻找另一种方法，如何划十字圣号。十字圣号的力量就是「尊贵与赐生命十字架的力量」。同样，基督的圣名也是如此——我们从经验中认识它的力量。而绝无法用言语解释，为何如此。
    - type: paragraph
      text:
        ru: 'Итак, мы взяли за правило малую «дозу»: четыре часа в день вместе молиться Иисусовой молитвой. Наша жизнь здесь – не такая, как на Афоне, где можно жить проще. Мы здесь постоянно «натянуты», и эта натянутость и напряжение связаны с тем, что мы слишком близко живем с миром. Но я думаю, что когда-нибудь положение нашего монастыря изменится – он станет более зрелым. А пока мы все время созидаем, нам надо построить еще жилища и так далее – все своим трудом.'
        cn: 于是，我们定下了一个小小的定规：每天一同诵念耶稣祷文四小时。我们这里的生活，不像阿陀斯山那样，在那里可以活得更简单。我们这里一直处于「紧绷」状态，而这种紧绷与张力，则是因为我们与尘世生活得太近了。但我以为，终有一天，我们修道院的境况会改变——它会变得更加成熟。而在此期间，我们一直都在建设，我们还需要建造更多的居所等等——这一切都靠我们自己的劳动。
    - type: paragraph
      text:
        ru: 'Господь сказал: «Даром вы получили, даром давайте»[80], но, простите, даром нам ничего почти не дается. Все дарования Божии, конечно, не подлежат оплате деньгами, и они даются как чистый дар, но в практической жизни нашей мы за все должны платить. Вот сейчас мы говорим, собравшись в этом данном нам промыслом Божиим храме. Мы должны платить за электричество! Но за то, что мы обслуживаем приходящих к нам, как рабочие в отеле, за то, что мы принимаем их на исповедь и служим Литургию, они оставляют нам немного денег, которые не покрывают наших расходов. Но все-таки мы существуем, и я надеюсь, что дальше будет еще лучше. Благодаря тому, что мы никого не отягощаем прошением о деньгах и помощи, мы сохраняем нашу свободу духовную, которой другие не имеют. И это очень важный момент в нашей жизни. Я бы хотел, чтобы все вы – и сестры, и братья – поняли, сколь важен каждый труд, который мы несем здесь, для того, чтобы существовал этот монастырь, как он есть: и как видимое явление, материальное, и, самое важное, – как «живое», как люди. И в условиях православной диаспоры на Западе, конечно, мы не можем быть оплачены, как в автокефальных церквах. Поэтому что бы вы ни делали – это есть борьба за нашу духовную свободу. Когда мы все делаем сознательно, тогда это не отягощает нас, и Бог дает нам энергию на работу и труд.'
        cn: 主说：「你们白白地得来，也要白白地舍去」[80]，但恕我直言，我们几乎没有什么是白白得到的。上帝的所有恩赐，当然，是无法用金钱偿付的，它们都是纯粹的恩赐，但在我们实际的生活中，我们必须为一切付出代价。我们现在正是在上帝的旨意所赐予我们的这座圣堂里聚会交谈。我们必须支付电费！但因为我们服侍来到我们这里的人，就像酒店里的工作人员一样，因为我们接受他们的告解，并举行事奉圣礼，他们给我们留下一点点钱，这些钱甚至不足以支付我们的开销。但无论如何，我们依然存在，我希望未来会更好。我们不因请求金钱和帮助而加重任何人的负担，正因如此，我们得以保持我们的属灵自由，这是其他人所没有的。这是我们生活中一个非常重要的时刻。我希望你们所有人——姊妹和弟兄们——都能明白，我们在这里所承担的每一个劳动是多么重要，以便这个修道院能够存在，既是可见的、物质的现象，最重要的是，是作为「活生生的」，作为人而存在。在西方东正教侨民的条件下，当然，我们不可能像在自主教会那样获得报酬。所以无论你们做什么——这都是为了我们的属灵自由而进行的斗争。当我们自觉地做这一切时，这就不会成为我们的负担，上帝就会赐予我们工作的能量和力量。
    - type: paragraph
      text:
        ru: 'В нашей жизни нет ничего, что не имело бы важного значения. Все важно, потому что все связано с Великим Богом. И этот Великий Бог говорит: «Смотрите, да не презрите единого от малых сих»[81]. Сейчас, говоря об этом, скажу вам: мне долгое время было свойственно смеяться над собою, когда приходила тщеславная мысль. Но когда я прочитал об этом и больше почувствовал это слово: «Смотрите, да не презрите единого от малых сих», то я пришел к мысли, что я тоже один из этих малых. И, значит, если Бог заботится обо мне, то моя жизнь тоже не есть нечто малое, но из-за Бога – великое. Так, когда мы живем здесь, от наших мыслей, устроения и мышления жизнь наша исполняется глубочайшего смысла и красоты, хотя внешне ничего нет.'
        cn: 在我们生命中，没有什么是不具重要意义的。一切皆重要，因为一切都与伟大的上帝相关联。而这位伟大的上帝说：「看哪，不可轻蔑这小子里的一个」[81]。现在，谈及此事，我要告诉你们：我曾长时间习惯于嘲笑自己，每当虚荣的念头生起时。但当我读到此事，并更深切地感受到这句话：「看哪，不可轻蔑这小子里的一个」时，我便想到，我也是这些小子中的一个。如此一来，如果上帝眷顾着我，那么我的生命也不是渺小的，而是因着上帝而伟大。如此，当我们在此生活时，我们的思想、心志和思索，使我们的生命充满了最深远的意义和美，尽管外在并无一物。
    - type: paragraph
      text:
        ru: 'Моя молитва всегда остается той же: чтобы Господь дал всем вам никогда не убегающее от вас ВДОХНОВЕНИЕ. Вы знаете, конечно, – многие из вас и по опыту, что главным образом художники, артисты и поэты живут постоянно своей мыслью. Так у нас: не какие-то мечты поэта, а реальность и присутствие Самого Бога день и ночь не оставляет нас.'
        cn: 我的祷告始终如一：愿主赐予你们所有人永不离弃的灵感。你们当然知道——你们中的许多人也有亲身经验——主要是画家、演员和诗人，他们总是生活在自己的思想之中。我们也是如此：并非诗人的某种梦想，而是上帝祂自身的真实与临在，昼夜不离弃我们。
    - type: paragraph
      text:
        ru: 'В молитве Василия Великого, которую мы читаем при входе в алтарь, говорится: «Даровавый нам небесных тайн откровение!». И когда мы действительно поймем, что Бог дал нам откровение Своих вечных истин, тогда мы «заболеем» (простите, что так говорю) этим неумаляемым вдохновением. И тогда в жизни нашей – в каких бы условиях она ни проходила, какие бы трудности ни встречались – ничто не может угасить этого пламени.'
        cn: 在圣大巴西略的祷文中，我们进入祭台时诵读的，有这样一句：「赐予我们天上奥秘的启示！」而当我们真正领悟到，上帝已将祂永恒真理的启示赐予我们时，我们就会为此『深深着迷』（请原谅我这样说），被这永不减退的灵感所充满。于是，在我们的一生中——无论处于何种境况，无论遭遇何等艰难——没有什么能熄灭这火焰。
    - type: paragraph
      text:
        ru: В еврейском мире до пришествия Христа все совершалось через исторические события, и так учился народ постигать промысл Божий. У нас, христиан, богопознание углубилось, и духовный мир стал на место исторических событий. Раньше Пасха была празднованием перехода через Чермное море, теперь наша Пасха – духовная, со Христом. Но первая Пасха была прообразом новозаветной Пасхи.
        cn: 在基督降临之前的犹太世界中，一切都通过历史事件而成就，人民也由此学习领悟上帝的旨意。对于我们基督徒而言，对上帝的认识更加深刻了，并且属灵的世界取代了历史事件的位置。以前，逾越节是庆祝跨越红海的节期；如今，我们的逾越节是属灵的，是与基督同在的。然而，最初的逾越节是新约逾越节的预表。
    - type: paragraph
      text:
        ru: 'Итак, дай Бог всем нам ощущать «небесных таинств откровения». Мы живем здесь, и того, что нам постоянно свойственно носить в себе, мир не знает и не хочет знать. Почему не хочет знать? Я бы не сказал, потому что они знают нечто большее, но потому, что они не знают этого большего. В мире, в котором мы живем, общество построено таким образом, что оно совсем не соответствует Царству Христову. Особенно пирамида этого мира заметна в университетах: люди думают, что они уже достигают высот познания, и с презрением относятся к другим, а в сущности их познания как туман рассеются от солнца. Это не есть знание, о котором говорит Христос: «Вечная жизнь в том, чтобы знали Тебя, Бога Отца, и кого Ты послал в мир, Иисуса Христа»[82]. Но практически, в этом мире, за высшее почитается наука и техника. И нам нужно знать это и не смущаться и не думать, что для нас является честью, когда нас приглашают в миру. Подобно тому, как нелепо входить в храм с сознанием, что ты делаешь честь Богу, войдя туда.'
        cn: 那么，愿上帝赐予我们所有人感受「天国奥秘的启示」。我们生活在此地，而我们持续不断地承载于自身之中的，世界不认识，也不愿认识。为何不愿认识？我不会说，是因为他们认识更伟大的事物，而是因为他们不认识这更伟大的事物。在我们生活的世界中，社会的构建方式全然不符合基督的国度。尤其是在大学里，这世界的金字塔结构尤为显著：人们以为自己已达知识的顶峰，且轻蔑对待他人，而实际上，他们的知识如同雾气，将随日头消散。这并非是那种知识，基督所言：「永生在于认识祢——独一的真上帝，并认识祢所差遣到世上的耶稣基督」[82]。但实际上，在这个世界中，科学与技术被尊为至高。我们需要认识到这一点，且不要困惑，也不要以为，当世俗邀请我们时，那是我们的荣耀。这如同怀着你进入圣殿是给上帝增添荣耀的心态，是荒谬的。
    - type: paragraph
      text:
        ru: Часто не все обладают даром суждения о живописи, о поэзии, о чем-нибудь другом, потому что не знают тайн искусства или науки. Так мир не знает того, о чем говорим мы, – о наивысшем образовании как цели, которую ставит перед собою монастырь, – достигнуть познания и знать Отца и Иисуса Христа, Его Сына. Это есть вечная жизнь. Это есть высочайшая точка для человека. Это есть то, чем заняты люди в монастыре, и вся культура и наука монастырская сводится к этому пункту.
        cn: 常常，并非所有人都有对绘画、对诗歌或对其他任何事物的判断恩赐，因为他们不了解艺术或科学的奥秘。同样，世人也不知道我们所谈论的——即修道院为自己设定的，那至高教育的目标——就是要达到对圣父和祂的圣子耶稣基督的认识与了解。这就是永生。这对人而言是最高的顶点。这就是修道院里的人所致力追求的，并且修道院的全部文化和学术都归结于此。
    - type: paragraph
      text:
        ru: 'Для Духа Святого чужда всякая гордость, и в Священном Писании она называется нечистотою. А мир живет гордостью! Она культивируется как аристократизм и превосходство ученых людей. Но они сами не знают, что, гордясь, они закрывают дверь для Духа Святого. Правильное отношение христианина – при обладании всеми знаниями, которые вообще возможны для человека в плане земли и Неба, – пребыть кротким и смиренным, как Господь, Который Сам про Себя сказал: «Научитесь у Меня, яко кроток есмь и смирен сердцем»[83].'
        cn: 对圣灵而言，任何骄傲都是陌生的，且在《圣经》中，它被称为不洁。然而这世界却活在骄傲之中！骄傲被培植为贵族气质和学者的优越感。但他们自己却不知道，因着骄傲，他们就向圣灵关闭了门。一个基督徒的正确态度是——即使拥有凡人可能获得的一切关于地上和天上的知识——仍要保持柔和谦卑，像上主一样。祂自己曾论及祂自己说：「你们当学我的样式，因为我心里柔和谦卑」[83]。
    - type: paragraph
      text:
        ru: 'Так что цель наша не в знаниях, хотя и их мы должны иметь, и не в функции, когда ценится функция какая-то в общественной организации, будь то министра, или президента, или даже короля. Старец Силуан говорит: «Это неважно». И никакой зависти нет у него к сильным мира сего: у них своя работа, своя должность. Но высшая цель есть любовь – как говорит Силуан: «Кто больше любит Бога, тот глубже знает Его»[84]. Почему любовь и ведение – это есть единое в вечности духовной? Почему заповедано все время любить? – Потому что любовь соединяет в самом бытии. А когда у нас есть отталкивание, защита и так далее, то это – лишение жизни. А если есть молитва, любовь и слезы, то это приближает нас к высшей науке, когда мы знаем Отца, и Сына, и Святого Духа.'
        cn: 所以，我们的目标不在于知识，虽然我们也应该拥有知识，也不在于某个职能，即便是在公共组织中受人珍视的职能，无论是部长、总统，甚或国王的职能。长老圣西卢安说：「这不重要。」他对世上的强权者毫无嫉妒：他们有自己的工作，自己的职位。但至高的目标是爱——正如圣西卢安所说：「谁更爱上帝，谁就更深地认识祂」[84]。为何爱与认识——在属灵的永恒中是合一的？为何命令人要常常去爱？——因为爱在本体中结合。而当我们有排斥、防卫等等时，那便是生命的剥夺。而如果有了祷告、爱与泪水，这便会使我们接近至高的学问，即我们认识圣父、圣子和圣灵的学问。
  - type: heading2
    text:
      ru: 'Беседа 10: О борьбе с помыслами, о кресте монашества и об усердии ко спасению[85]'
      cn: 第十讲：论与意念的争战、修道的十字架以及为得救的热心[85]
    children:
    - type: paragraph
      text:
        ru: Каким образом монахи должны приветствовать друг друга. Мы должны избегать физических контактов. Борьба со страстными помыслами. Монастырь – высшая школа, но связана со страданиями и преследованиями. Размышления о кончине и готовности к ней. Если мы будем пренебрегать нашим собственным спасением, Бог тоже пренебрежет им
        cn: 修士们应当如何彼此问安。我们应当避免肢体接触。与情欲意念的争战。修道院是至高学府，但却与苦难和逼迫相连。默想离世，并为其作好准备。倘若我们轻忽我们自己的救恩，上帝也必轻忽它。
    - type: paragraph
      text:
        ru: Надо постоянно помнить, зачем мы здесь. И последней нашей цели мы никак не должны забывать. Но путь наш может быть очень далеким, как может он быть и очень сокращенным – пришествием самого Бога.
        cn: 我们应不断记着，我们为何在此。并且，我们绝不能忘记我们最终的目标。但我们的道路可能非常遥远，也可能非常缩短——借着上帝的亲自降临。
    - type: paragraph
      text:
        ru: 'Кто-то из вас спросил меня: «А как надо приветствовать друг друга среди монахов и сестер?» – Не во всех монастырях одинаково. Гораздо сложнее дело обстоит в монастырях русских. Проще обстоит дело на Афоне. И еще проще у нас. В Пантелеймоновском монастыре на Афоне с самых первых дней моего монашества я встретил такой обычай – младший приветствует старшего просьбой благословить: «Благословите, отче!». И старший отвечает: «Бог благословит». Эта форма «благословите» существует на Афоне как общая. Так приветствуют друг друга монахи.'
        cn: 你们中有人问我：「修士和修女之间该如何彼此问候呢？」——各修道院的情况不尽相同。在俄罗斯的修道院里，情况要复杂得多。阿索斯山的情况则比较简单。而在我们这里则更简单。在阿索斯山的圣潘捷列伊蒙修道院里，从我修道生涯的最初几天起，我就遇到了这样一个习俗——年幼者通过请求赐福来问候年长者：「请赐福，神父！」而年长者则回答说：「上帝会赐福的。」这种「请赐福」的问候方式在阿索斯山是一种普遍的做法。修士们就是这样彼此问候的。
    - type: paragraph
      text:
        ru: 'Надо сказать, что среди монахов Афона существует неписаное правило, что монахи друг к другу не прикасаются телом: никогда не приветствуют друг друга рукопожатием. И вообще избегают всякого прикосновения со всяким телом, даже животных.'
        cn: 应当说明的是，在阿索斯山的修士中，存在着一个不成文的规定，即修士之间互不以身体接触：他们绝不以握手问候彼此。而且，他们普遍避免与任何身体接触，甚至包括动物的身体。
    - type: paragraph
      text:
        ru: 'Говоря такую вещь, сам я хожу носимый руками двух монахов: они меня водят, поддерживая. Но это совсем другое положение вещей: это не потому, что я слишком капризный, а потому, что тело мое разлагается.'
        cn: 说到此事，我本人行走时是由两位修士用手托着的：他们扶持着我前行。但这完全是另一种光景：这并非因为我过于任性，而是因为我的身体正在朽坏。
    - type: paragraph
      text:
        ru: 'Вообще хорошо иметь правилом и то, что монах не видит своей наготы. Старается все сделать так, чтобы не видеть себя самого и тем более – тела другого. Это происходит потому, что необходимо сосредоточить наше внимание на самом главном и не дать глазу нашему отвлекать нас тем, что он видит, от мысли о Боге. И когда монах сосредоточен, тогда он полон нелегких впечатлений от самого себя. Тогда его внимание сосредоточивается на его внутреннем мире, и он следит за всякой своей реакцией на что бы то ни было. Таким образом он учится овладевать помыслами, которые его посещают. «Овладеть помыслом» значит отнять у него всякую власть над нами, когда этот помысл противен духу заповедей Христа. Эта наука – как освободить нас от всякого рабства посторонним, чуждым нашей цели мыслям – приобретается после долгого опыта или скоро – при действии благодати. Обычное явление в мире: человек является рабом посещающих его мыслей и никак не может от них отделаться. Некоторые доходят до состояния, когда они становятся жертвой определенной мысли, что называется idée fixe, «идеей фикс», и не могут от нее освободиться. И эта борьба требует от нас действительного подвига и знания, как бороться.'
        cn: '通常而言，僧侣奉行不见自身赤裸的准则，是好的。他努力做到一切，以期不见自己本身，更不必说不见他人的身体。之所以如此，乃是因为我们必需将注意力集中在最主要的事情上，并且不让我们的眼睛因其所见的，而使我们从对上帝的思念中分心。


          而当僧侣集中注意力时，那时他充满了来自自己本身的、不易承受的感受。那时他的注意力就集中在他内在的世界，并且他观察自己对任何事物的每一种反应。如此一来，他学习驾驭临到他的意念。「驾驭意念」意味着，当这意念违背基督诫命的精神时，便夺走它对我们的一切权柄。


          这门学问——即如何将我们从一切奴役于那些与我们目标无关、格格不入的思绪中解放出来——是在长期的经验之后获得的，抑或在恩典的作为下迅速获得的。


          在世俗中常见的现象是：人成为临到他的思绪的奴隶，并且无法摆脱它们。有些人甚至达到一种状态，即他们成为某种特定思绪的受害者，这被称为「idée fixe」，「固定观念」，并且无法从中解脱。而这场斗争需要我们付出真正的功行，以及如何去战斗的知识。'
    - type: paragraph
      text:
        ru: 'Говоря с вами, я обращаюсь к нашим новым братьям и сестрам. Кто из вас читал мою книгу, помнит, как некий римо-католический доктор Хризостом приехал посетить монастырь. И, беседуя с монахами, он удивился, что они читают такие книги, как «Лествица»,Авва Дорофейи т. д. Монах Василий, говоривший с этим католическим доктором богословия, рассказал об этом старцу Силуану. И старец ответил, что мы не только читаем, но и сами могли бы написать такие же книги. Но так как есть уже прекрасные книги, то монах не думает о том, чтобы прибавить еще книг: достаточно старых книг. А когда появится нужда, говорит он, тогда появятся и новые книги, эквивалентные древним[86].'
        cn: 当我与你们交谈时，我是在对我们新的弟兄姐妹们说话。你们当中读过我的书的人会记得，一位罗马上帝教的克里索斯托姆博士曾来拜访修道院。他与修士们交谈时，感到惊讶他们竟然阅读诸如《天梯》、阿跋多罗斐等等之类的书籍。与这位上帝教神学博士交谈过的修士瓦西里，将此事告诉了长老圣西卢安。长老回答说，我们不只阅读，而且我们自己也能写出同样的书籍。但既然已经有如此美好的书籍，所以修士不考虑再增加书籍：那些古老的书籍就足够了。他说，而当出现需要时，那么也会出现与古代书籍相当的新书籍[86]。
    - type: paragraph
      text:
        ru: 'Теперь о моем положении по отношению к вам: из того, что уже написано в книгах, каждый из вас может выбрать себе нужное чтение в тот или иной момент. И говорить вам о том, что я писал, как будто бы излишне. Читая сами, вы можете выбирать те тексты, которые говорят о путях к стяжанию Духа Святого. И в моей книге коротко, сжато, но описан этот путь: от начала до конца. Я, как автор книги, не могу рекомендовать, чтобы вы читали ее с большим вниманием. В этой книге описаны различные способы борьбы с помыслом, как надо вести себя, чтобы не оскорбить Духа Святого, Который должен быть с нами на всем пути нашем; как оскорбляется Дух Святой плохим помыслом или каким-нибудь страстным пожеланием.'
        cn: 现在关于我对你们的立场：从那些已经写在书中的内容，你们每个人都可以在某个时刻选择自己所需的读物。而对你们说我所写的内容，似乎是多余的。你们自己阅读时，可以选择那些论及获得圣灵途径的文本。而在我的书中，这条道路从始至终都得到了简短而精炼的描述。我，作为这本书的作者，不能建议你们要怀着极大的关注去阅读它。在这本书中描述了与意念争战的各种方式，以及如何行事为人以免冒犯圣灵——祂当与我们一切的道路上同在；圣灵如何借着邪恶的意念或任何情欲的渴望而被冒犯。
    - type: paragraph
      text:
        ru: Пожалуйста, изучайте этот вопрос сами, читая книги о борьбе со страстями. Если вы возьмете, скажем, небольшой отрывок текста из «Лествицы» Иоанна Синайского – одно, два или три из его изречений – и весь день сосредоточите внимание на том, о чем он говорит, – тогда это станет вашим достоянием духовным, уже освоенным.
        cn: 请你们自己研究这个问题，阅读关于与情欲搏斗的书籍。如果你们拿，比如说，圣约安·西奈的《天梯》中的一小段文本——他的一句、两句或三句格言——并且整日专注于他所说的内容，那么这就会成为你们属灵的财富，并且是已领悟的。
    - type: paragraph
      text:
        ru: В то время, когда я был на Афоне, никто из монахов не окормлялся беседами с игуменом. Только в Новом Афоне, где собрались многие образованные люди и богословы, стали беседовать игумены, но не повсюду. Итак, остается необходимым для каждого из вас потратить десять-двадцать минут в день на чтение, но такое чтение, которое связано с вниманием, как надо бороться со страстями.
        cn: 当我在阿索斯圣山时，没有一个修士通过与修道院长交谈获得灵性指导。只有在新阿索斯，那里聚集了许多受过教育的人士和神学家，修道院长们才开始进行交谈，但并非所有地方都如此。因此，对你们每个人来说，仍然有必要每天花十到二十分钟阅读，但这种阅读要与专注联系起来，即关于如何与情欲搏斗的阅读。
    - type: paragraph
      text:
        ru: 'Апостол Павел считает, что как результат падения Адама в нас живет «закон греха»[87]: мы рождаемся во грехах, самое зачатие наше есть беззаконие –«Се бо в беззаконии зачат есмь и во гресех роди мя мати моя»[88]. И отрицательное отношение к Богу есть наше свойство после падения. И бороться против этого закона греха – вот в чем наука монастыря. По своей цели монастырь является наивысшей школой, которую знает земля, потому что цель, поставленная монастырем, превышает всякую человеческую науку: как из раба греховного закона стать свободным в любви Божественной, свободным господином в космическом бытии. И этот момент важный для нас. Как будто бы все очень доступно – и вместе с тем превышает меру человека. Мера человека меньше, чем Евангелие. Так, апостол Павел говорит, что Евангелие, проповеданное нам, не «по человеку», то есть измерения бытия человеческого менее грандиозны, чем те, о которых нам говорит Евангелие. И мы сами, своей силой никак не можем победить закон греха, когда мы чувствуем, что Господь Бог не живет в нас, когда многие реакции наши есть страстные, греховные движения. Как сделать, чтобы Господь вселился в нас, чтобы вечная Божественная жизнь стала нашей жизнью и цель наша была бы достигнута? – Для этой борьбы необходим ПОДВИГ, связанный с большим напряжением и болезнями.'
        cn: 使徒保罗认为，亚当堕落的结果是「罪的律法」[87]活在我们里面：我们生在罪中，我们受孕本身就是不法——「看哪，我是在罪孽里生的，我母亲在罪中怀了我」[88]。而对上帝的否定态度是我们堕落后的本性。而与这罪的律法搏斗——这就是修道院的学问所在。就其目标而言，修道院是世上最高的学校，因为修道院所设定的目标超越了人类的一切学问：如何从罪恶律法的奴仆，在神圣的爱中变得自由，成为宇宙存在中的自由主宰。而这一点对我们来说很重要。仿佛一切都触手可及——然而却超越了人的尺度。人的尺度小于福音。因此，使徒保罗说，我们所传的福音不「合乎人的」，也就是说，人类存在的维度不如福音所告诉我们的那些宏大。而我们自己，凭着自己的力量，绝无法战胜罪的律法，当我们感到主上帝不住在我们里面时，当我们许多的反应都是情欲的、罪恶的冲动时。如何才能让主全居在我们里面，让永恒的神圣生命成为我们的生命，并实现我们的目标呢？——为了这场搏斗，必要的乃是苦修，它与巨大的张力和苦痛相连。
    - type: paragraph
      text:
        ru: 'Когда вы пришли сюда и сказали: «Я хочу быть монахом», это значит, что вы избрали Христа, Который говорит:«Возьми крест свой и следуй за Мною»[89], подобно тому как Сам Он взял и нес Свой крест. Все мы избрали тяжелый путь. Все мы избрали путь страданий, изоляции, неприязни от мира, гонений и так далее. И этого монах не должен забывать. И когда постигают его трудные испытания, будь то внешние или внутренние, – монах должен быть терпеливым. Человек один не в состоянии следовать за Христом. Два или три по крайней мере должны быть соединены. Только Сам Христос мог быть единственный на всей земле, который боролся с врагом. Но никто из нас не может быть, как Христос. Хорошо нам соединиться в группу, носящую единую цель в сердце своем и в уме. И это есть общежитие монашеское.'
        cn: 当你们来到这里并说：「我愿做一名修士」，这意味着你们选择了基督，祂说：「背起你的十字架，跟随我吧」[89]，正如祂自己背负并忍受了祂的十字架。我们都选择了这条艰难的道路。我们都选择了苦难、隔绝、世界的厌恶、迫害等等的道路。修士不应忘记这一点。当他遭遇艰难的考验时，无论是外在的还是内在的，修士都当忍耐。独自一人无法跟随基督。至少要有两三个人联合起来。只有基督自己才能独自一人在全地上与仇敌争战。但我们没有人能像基督那样。我们最好能结合成一个团体，在心和意念中怀着同一个目标。这就是修士的修道团体生活。
    - type: paragraph
      text:
        ru: 'Вот сейчас я говорю с вами после того, как мне пришлось пережить несколько дней большого ухудшения моего физического состояния. И когда я в таком кризисном и болезненном состоянии, то, конечно, естественна только одна мысль и забота: об исходе отсюда. И я, правду сказать вам, теперь удивляюсь, что Бог дал мне силу и радость снова видеть вас. Я был «в опасности», говоря по-человечески. Да даст мне Господь, за ваши молитвы, сохранить тот мир, который сейчас Он дал мне. И единственное, что меня задерживает, – это забота о вас. Вы пришли сюда, где еще не до конца построена жизнь: ни внешне, ни внутренне. Мы еще ищем, как нам быть, столь тесно связанным и зависящим от мира сего. Как я хочу, чтобы все вы вдохновились на этот долгий путь, чтобы построили свое спасение, следуя отчасти Силуану. «Отчасти»: поскольку недоступно человеку то, что происходило с Силуаном. Но, принимая его учение, мы можем достичь пусть и не полное подобие, но некоторую аналогию Силуану в его дарованиях и в тех испытаниях, которым он подвергся.'
        cn: 我现在与你们说话，是在我经历了数日身体状况严重恶化之后。当我处于这样危急而痛苦的状态时，自然而然地，只有一个念头和一份牵挂：就是离开此处。我向你们说实话，现在我很惊奇，上帝赐予我力量和喜乐，再次见到你们。若按人的说法，我曾「处于危险之中」。愿上主因着你们的祷告，赐予我保有祂现在赐予我的那份平安。唯一让我留下的，是对你们的牵挂。你们来到这里，生活尚未完全建立起来：无论是外在的，还是内在的。我们仍在寻求，在如此紧密相连并依赖于这世界的情况下，我们该如何存在。我多么希望，你们所有人都被激励踏上这条漫长的道路，建造你们自己的救恩，在某种程度上效法圣西卢安。「在某种程度上」：因为圣西卢安所经历的，是人所无法企及的。然而，藉着领受他的教导，我们能够达到，即使不是完全的相似，也能在某种程度上与圣西卢安相类，在他的恩赐中，以及在他所经受的考验中。
    - type: paragraph
      text:
        ru: 'Отчасти в мою цель сегодня при беседе с вами входит этот элемент: приготовить вас к моей смерти. Потому что некоторые из вас говорят мне: «А что нам делать после Вашей смерти?» Когда я был со старцем Силуаном, я опирался на него. Благодаря ему я освободился от сомнений и неуверенности, которые свойственны при нашем неведении пути. Я был допущен к ногам Силуана так легко и просто! И когда он почти что внезапно скончался, как я описываю в моей книге, то первое время у меня было чувство огромного и страшного сиротства. Но через неделю от меня было отнято это чувство. И я пошел уже один тем путем, которым он вел меня. Очень скоро после того мне пришлось стать духовником для монахов. Так некоторые из вас, когда я умру, могут ощутить некую потерю. Но, конечно, моя молитва о том, чтобы все вы получили дар от Бога – пойти намеченным нами путем уже без меня. Старайтесь удержать то, о чем мы говорим, потому что это – как дух, невидимый, но полный жизни, он может быть потерян нами легко. Оставляя вас, я думаю, что, может быть, удвоится о вас попечение со стороны самого Силуана и со стороны Иоанна Крестителя. Говоря с вами сейчас, я приготовляю вас к моей смерти. Но вот уже четыре с половиной года, как, по мнению врачей, я должен был умереть, а я, проходя один за другим кризис, еще живой. И даже сегодня, когда я едва поднимаюсь с постели, не знаю, когда я умру. Я бы хотел, чтобы вы меня отпустили...'
        cn: 我今天与你们的谈话，部分目的在于此：预备你们面对我的死亡。因为你们中有些人对我说：「您离世之后我们该怎么办呢？」当我与圣西卢安长老在一起时，我曾依靠着他。借着他，我摆脱了在不识道路时所固有的疑惑和不确定性。我曾如此轻易且简单地被允许到圣西卢安的脚边！而当他几乎是突然地逝世时，正如我在我的书中所描述的，起初我有一种巨大而可怕的孤儿感。但在一周之后，这种感觉便从我身上被夺走了。而我便独自一人前行在他曾引领我的那条道路上。之后很快，我便不得不成为修士们的司祭。如此，你们中有些人，当我离世时，可能会感受到某种失去。然而，当然，我祈祷你们所有人都从上帝那里获得恩赐——在没有我的情况下，继续走我们所指明的道路。你们要努力持守我们所谈论的，因为它——如同一个灵，虽不可见，却充满生命，它可能轻易地被我们失去。当我离去时，我想，也许来自圣西卢安本人以及来自施洗者约翰对你们的照护会加倍。现在与你们交谈时，我正在预备你们面对我的死亡。然而，至今已有四年半了，依医生之见，我本该死去，但我，在经历了一次又一次的危机后，依然活着。甚至今天，当我勉强从床上起身时，我也不知道我何时会死去。我希望你们能让我走……
    - type: paragraph
      text:
        ru: 'Итак, слово старца остается с вами. И меньшего значения – мое слово, тоже остается с вами. Я сказал то, что хотел: это мое завещание вам. Может быть, я еще буду жить, но с каждым днем силы мои убавляются. Но я остаюсь мирным. Мне самому теперь уже трудно стало жить. Мое тело заставляет меня все время как-то быть им занятым: как вытерпеть боли, как провести день, как провести ночь, – все теперь стало сложной проблемой.'
        cn: 那么，长老的话语就与你们同在。并且，我那意义较小的话语，也与你们同在。我已尽言我心：这是我给你们的遗训。也许我还会活着，但我的力量日渐衰减。但我依然保持平安。对我自己而言，现在活着已变得艰难。我的身体迫使我一直以某种方式被它所困扰：如何忍受痛苦，如何度过白天，如何度过夜晚——所有这一切现在都成了复杂的问题。
    - type: paragraph
      text:
        ru: Могут перемениться обстоятельства жизни монастыря. Если вы будете свое дело делать как надо, то Господь сохранит вас. Если вы будете небрежными к своему спасению, небрежным станет и Бог. Итак, сохраните должное напряжение монашеское и, главным образом, богослужение литургическое. И разве есть какое-нибудь не литургическое положение?! Все в нашей жизни – это непрерывная Литургия. Итак, храните эту Литургию. Иногда, не зная и не понимая цены тому, что дает Бог, мы можем быть небрежными. Так, в басне петух, напав на жемчужное зерно, счел его ненужным. Так и в Писании говорится, что посланные видеть землю обетованную не оценили ее как нужно иуничижили землю желанную[90].
        cn: 修道院的生活境况可能会有变化。如果你们妥善地尽自己的本分，那么上主就会保守你们。如果你们对自己的救恩懈怠，上帝也会变得懈怠。因此，保持应有的修道张力，并且，主要地，保持礼仪性事奉。难道还有什么非礼仪性的境况吗？！我们生命中的一切，都是一场不间断的礼仪。因此，守护这场礼仪。有时，我们不了解也不明白上帝所赐予之物的价值，就可能会变得懈怠。正如在寓言故事中，一只公鸡偶然发现了一颗珍珠，却认为它毫无用处。同样，圣经中也记载，那些被派去查看应许之地的人，没有按其应有的价值来评价它，并且轻视了那片美地[90]。
    - type: paragraph
      text:
        ru: И да хранит вас Господь.
        cn: 愿上主保守你们。
  - type: heading2
    text:
      ru: 'Беседа 11: О наследии Силуана, о подвиге общежития и о святости[91]'
      cn: 讲论11：论圣西卢安的遗产，论集体生活的苦修，以及论圣洁[91]
    children:
    - type: paragraph
      text:
        ru: О трех задачах о. Софрония. О редчайшем даре старцу Силуану. Какова природа откровения. «Последнее слово» прп. Силуана. Аскетическое смирение и смирение Христово. Богословие и реальный духовный опыт. Жить в мире друг с другом связано с подвигом. О святости. Все трудности возникают от нашего неведения
        cn: 关于索夫罗尼长老的三个任务。关于赐予圣西卢安长老的稀世恩赐。启示的本质是什么。尊者圣西卢安的「最后遗言」。苦修的谦卑与基督的谦卑。神学与真实的属灵经验。彼此和睦共处与属灵功修相关联。关于圣洁。一切困难皆源于我们的无知。
    - type: paragraph
      text:
        ru: Теперь я хотел бы окончить мою жизнь в покое от сознания того, что наша «задача» воистину исполнена со страхом Божиим и как должно. За последние годы имя нашего блаженного покровителя, и отца, и «деда» – Силуана – проникло во многие места земли, удаленные от нас. Первой моей задачей было дать свидетельство о Силуане, что я и сделал в своей книге, написанной через десять лет после его смерти. Я торопился с этим делом, и первые экземпляры послал на Святую Гору Афон, где были живы те, кто его знали и которые прожили с ним сорок и пятьдесят лет в одном монастыре. Для исполнения второй задачи я вынужден был исповедать свою жизнь. Это дело было гораздо труднее, потому что открывать свое сердце, действительно, и опасно, и больно. Остается третье, что вы все должны выполнить уже без меня, – восполнить то «дело», которое я сделал, «популяризируя», но наиболее корректным образом, самое ядро идеи нашего отца Силуана.
        cn: 现在我希望能平安地结束我的生命，带着我们「任务」已确实完成、敬畏上帝且如其所当的确信。在过去的几年里，我们蒙福的主保圣人、我们的父亲和「祖父」——圣西卢安——的名声已传遍了世上许多远离我们的地方。我的首要任务是为圣西卢安作见证，我确实也做到了，在我那本他离世十年后写成的书中。我匆忙地完成了这件事，并将最初的几份寄往阿索斯圣山，那里仍有许多认识他的人活着，他们曾与他一同在一个修道院里居住了四十年、五十年。为了完成第二个任务，我不得不坦陈我的生命。这件事要困难得多，因为敞开自己的心，确实既危险又痛苦。剩下的是第三件事，那是你们所有人在我不在后必须完成的——以最正确的方式，去补足我所做的「普及化」工作，即普及我们父亲圣西卢安思想的核心。
    - type: paragraph
      text:
        ru: 'С нами на освящении храма в день старца Силуана был замечательный аскет и гениальный духовник отец Емельян. Он сказал слово для меня чрезвычайной важности, а именно: если бы те рукописи, которые я предлагаю в книге старца, попали в их руки без меня, то, по его словам, они не раскрыли бы настоящего содержания его слов. И теперь, насколько я могу судить об этом и жить это: Силуану было дано нечто исключительно грандиозное. История земли не знает более высокого подвига, чем тот, который предложил ему Сам Господь.'
        cn: 在圣西卢安长老的庆日，与我们一同参加圣殿祝圣礼的，有位卓越的苦修者和富有天赋的告解师——叶梅利扬神父。他说了席对我而言极为重要的话，也就是：假如那些我在长老书中呈现的手稿，在我缺席的情况下落入他们手中，那么，按他所说，他们就无法揭示（长老）话语的真实内涵。而现在，据我所能对此作出判断并活出（它）来看：圣西卢安被赐予了某种极其宏伟的事物。人间的历史不知有比上主亲自赐予他的那（功勋）更为崇高的。
    - type: paragraph
      text:
        ru: 'Как расшифровать откровение, которое дал ему Господь и после которого он сказал: «Я стал делать так, как научил меня Господь, и ум мой очистился, и Дух (конечно, Божий Дух, Святой Дух) свидетельствовал спасение»[92]? – В этой беседе ему было дано от Бога жить то, что передавал ему Христос словами: «Держи ум твой во аде». В книге я все сие указываю, но в очень «легкой» форме. Теперь это должно быть «раскрыто» более солидно. Проникнуть до последней глубины в то, что было дано Силуану, я не знаю, кому дается. Исаак Сирин говорит, что единицы на поколение познают эти высшие состояния, но «популяризировать» это очень полезно[93]. В журналеIrénikonиспанский монах написал, что слово, данное Силуану от Самого Христа, помогло очень и очень многим[94]. Итак, частичное проникновение в смысл дано, я думаю, всем нам.'
        cn: 如何解读上主所赐予他的启示，在此之后他说道：「我照着上主所教导我的去行，我的心智便洁净了，而灵（当然是上帝的灵，圣灵）也为救恩作证」[92]？——在这次谈话中，上帝赐予他去活出基督以这些话语所传达给他的：「让你的心智留在地狱里。」在书中我指出这一切，但形式非常「浅显」。现在这应被「揭示」得更扎实。至于参透圣西卢安所蒙受的启示之最深处，我不知这是赐予谁的。叙利亚的以撒说，每一代只有少数人能认识这些至高境界，但「普及」它非常有益[93]。在《Irénikon》杂志上，一位西班牙修士撰文指出，基督亲赐给圣西卢安的教诲帮助了非常非常多的人[94]。因此，对意义的部分参透，我想，是我们所有人都蒙受的。
    - type: paragraph
      text:
        ru: И, конечно, надо писать, как нам дано понимать его. Задача эта действительно великая. Сам старец говорил, что даже на Афоне нельзя говорить всем и каждому это слово. Через книгу это «прошло», а на словах говорить это страшно. Это – действительно огонь, к которому страшно приближаться[95].
        cn: 当然，我们应该照着我们被赐予理解他的方式去书写。这项任务确实是伟大的。长老本人说过，即使在阿索斯山，也不能向所有人、向每一个人说出这个词。通过书籍，这得以「流传」，但口头说出来则令人畏惧。这——确实是火，靠近它令人畏惧[95]。
    - type: paragraph
      text:
        ru: 'Но мы оставляем задачу – самим приблизиться ко Христу, отдав Ему роль – приблизиться к нам. Мы не дерзаем делать так, как нас учит старец Силуан, потому что это выше наших сил, но Сам Господь может снизойти и дать нам все. И тогда (да простит мне Бог мою дерзость и дерзновение) мы сможем помочь многим и многим людям найти истинный путь к Богу Вечному. Это слово может «раздавить» совершенно, как тяжелый камень, о котором говорит Христос: «...на кого он упадет, того раздавит»[96]. Однако старцу было дано это слово, и оно вызвало в нем восторг. После того как Силуан получил это откровение и стал делать так, как научил его Господь, он увидел, что ему Бог дал оружие, способное побеждать всякое зло. И он воспел хвалу Богу, удивляясь, как он, бедный и ничтожный человек, получил от Самого Бога откровение о сущности первородного греха и о путях к восстановлению подобия Божиего в человеке. Ему было трудно принять сие только для себя, и он стал молиться за весь мир, чтобы Господь Духом Святым дал понять это всему человечеству.'
        cn: 但我们放弃了自己亲近基督的任务，却把亲近我们的角色交给了祂。我们不敢像圣西卢安长老教导我们的那样去做，因为这超出了我们的能力，但上主自己能够俯就并赐予我们一切。到那时 (愿上帝饶恕我的僭妄和大胆)，我们就能帮助许多、许多人找到通往永恒上帝的真正道路。这番话可能会像重石一样，将人完全「压碎」，正如基督所说：「……谁被这石头砸上，就要被砸得粉碎」[96]。然而，长老却被赐予了这番话，这在他心中激起了狂喜。圣西卢安领受了这启示，并开始按照上主所教导的去做之后，他便看到上帝赐给了他一件能战胜一切邪恶的武器。于是他歌颂上帝，惊奇地发现，他这贫贱卑微之人，竟从上帝自己那里领受了关于原罪本质以及在人里面恢复上帝肖像途径的启示。他难以独自领受这事，于是开始为全世界祈祷，愿上主借圣灵使全人类明白此事。
    - type: paragraph
      text:
        ru: 'Когда нечто действительно великое и божественное приходит к нам, тогда мы живем это откровение как естественное и свойственное нам состояние. В нем нет элемента сравнения, как, например, в аскетическом выражении «я хуже всех». Но когда приходит божественное смирение, оно вне всякого сравнения, что свойственно Абсолютному Бытию. Тогда нет идеи: «Вот, на какую высоту вознесен человек!», как нет и следов тщеславия или гордости, а есть только самый ФАКТ, который живет человек как свое собственное состояние. Так, когда мы получаем откровение о Высшем, то узнаем его происхождение из того, что оно естественно нам по природе нашей и никак не рождает в нас ни тщеславия, ни гордости, ни превосходства.'
        cn: 当真正伟大而神圣之物降临我们时，我们便将此启示视为自身自然且固有的状态而活出。在其中，没有比较的成分，例如在苦修的表达「我比所有人都差」中那样。但当神圣的谦卑降临之时，它超越一切比较，这正是绝对存在所固有的。那时，没有这样的念头：「看哪，人被提升到了何等的高度！」也没有虚荣或骄傲的痕迹，而只有那个事实本身，人将之视为自己的状态而活出。因此，当我们领受关于至高者的启示时，我们便从它本质上与我们相合这一点，得知其源头，并且它绝不会在我们里面生出虚荣、骄傲或优越感。
    - type: paragraph
      text:
        ru: 'Итак, по мере возможности, я буду говорить об этом предмете, пока я жив, чтобы передать возможно большему числу наших братьев и сестер слово, пришедшее от Бога в мир сей через Силуана. То, что оно не рождает ни тщеславия, ни гордости, каждый из нас может понять, читая его слова. Он говорит о самых страшных и больших вещах просто и естественно, и там действительно нет ни гордости, ни возношения. Силуан говорит, что был такой момент, когда в конце утрени воспели «Хвалите...», раскрылось небо, исчезла крыша храма, и он видел Давида, воспевающего Бога. Об этом явлении он спрашивал четырех наиболее опытных отцов, и никто не решился ему сказать, какого происхождения было это явление[97]. Но он сам говорит: «Однако оно приносило мне помыслы тщеславия». И, значит, для самого Силуана анализом всякого откровения (от Бога оно или нет) было отсутствие тщеславия. Когда даются самые высокие состояния, они живутся как самые естественные для нас. Так что в Царстве Христа все будут обладать этим познанием, но не будет великого греха – гордости.'
        cn: 那么，尽可能地，只要我活着，我就会谈论这个主题，以便将这圣言——藉着圣西卢安从上帝那里来到这个世界的——传达给尽可能多的弟兄姊妹。这圣言既不滋生虚荣，也不滋生骄傲，我们每个人读他的话语时都能明白。他谈论那些最可怕和最重大的事情时，简单而自然，其中确实没有骄傲，也没有自高。圣西卢安说曾有这么一个时刻，在晨祷结束时，当众人歌唱「赞美……」时，天空敞开了，圣殿的屋顶消失了，他看见大卫歌颂上帝。关于这个异象，他曾询问过四位最有经验的教父，但没有人敢告诉他，这个异象究竟源于何处[97]。但他自己说：「然而，它却给我带来了虚荣的念头。」因此，对于圣西卢安本人来说，衡量任何启示（无论它是否来自上帝）的标准，就是有没有虚荣。当赐予最崇高的境地时，它们被体验为对我们而言最自然不过的。因此，在基督的国度里，所有人都会拥有这种认知，但不会有骄傲这个大罪。
    - type: paragraph
      text:
        ru: 'Я пишу о том, что именовал «последним словом»[98]. Истерзанный лихорадкой на Святой Горе Афон, я был лишен сил настолько, что мне было трудно подыматься по лестнице и не хватало сил читать Отцов. Я сказал Силуану:'
        cn: 我写的是我称之为「最终之言」[98]的事。在圣山阿陀斯，我被热病折磨，虚弱到连上楼梯都困难，也没有力气阅读圣教父们的著作。我对圣西卢安说：
    - type: paragraph
      text:
        ru: – Жалею, что у меня нет сил заняться глубже богословием.
        cn: – 遗憾自己力不从心，无法更深入地钻研神学。
    - type: paragraph
      text:
        ru: 'И он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – И вы думаете, что это – великое дело? Велико только смириться, потому что гордость мешает любить.
        cn: – 那么您认为，这是件伟大的事吗？唯有谦卑才是伟大的，因为骄傲阻碍爱。
    - type: paragraph
      text:
        ru: 'Ему самому было дано не только аскетическое смирение, но и неизъяснимое смирение Христово. Это учение о двух видах смирения – один из пунктов необычайно важных и глубоких в писаниях старца Силуана. Одно – онтологически свойственно Богу: потому что Бог есть смирение, и другое смирение – аскетическое: в нем есть элемент сравнения: «Я хуже всех». Когда, умирая, старец сказал: «Я еще не смирился»[99], то, конечно, если понимать старца в контексте его опыта, речь шла о Христовом смирении – нетварном, которое онтологически свойственно Богу. И потому я позволил себе написать как «последнее слово» то, что многим людям академического характера может показаться наивным. Но для Силуана наоборот: наивно думать, что академическая эрудиция дает это состояние. Из его слов ясно, что, при всем своем уважении к богословию научному, он все-таки предпочитал другое. И это «другое», конечно, должно быть характерным для нашего монастырского жития.'
        cn: 他自身被赐予的不仅是苦修式的谦卑，更是不可言喻的基督的谦卑。这种关于两种谦卑的教导，是长老圣西卢安著述中极其重要而深刻的论点之一。其中一种是本体上为上帝所固有的：因为上帝就是谦卑；而另一种谦卑是苦修式的：它包含着比较的成分：「我比所有人都差」。当长老临终时说：「我尚未达到谦卑」[99]时，那么，当然，如果从他的经验语境来理解长老的话，他所指的是基督的谦卑——那未受造的、本体上为上帝所固有的谦卑。因此，我允许自己将那些可能在许多学术性人士看来显得天真的话语，写成「最后的言语」。但对圣西卢安而言则恰恰相反：认为学术博学能带来这种境界是天真的。从他的话语中可以清楚地看出，尽管他尊重学术神学，他仍然更偏爱另一种。而这种「另一种」，当然，应该成为我们修道院生活的特征。
    - type: paragraph
      text:
        ru: 'Сейчас мой ум и слово скользят в этом «направлении» – познание Бога, как Он есть, а не как Он не есть. Итак, познание Бога, как Он есть, не зависит от академического образования. Иными словами, монах спасается самым простым трудом: он может быть поваром всю жизнь, мыть посуду, а духом быть в Боге и с Богом, и Бог – в нем. Так что в монашеской жизни нет того, что мы видим в богословских учреждениях-школах, где считается кто-то выше, а кто-то – ниже и соответственно взаимоотношения носят характер снобизма. В монашеской жизни самая скромная работа иногда помогает спасению, потому что ум при такой работе совершенно свободен для пребывания в Боге. Выполняя свою работу, бесстрастно, но очень аккуратно и добросовестно, монах сохраняет свой ум постоянно в Боге.'
        cn: 现在我的心智和言语滑向这个「方向」——认识上帝之本相，而非其非本相。因此，认识上帝之本相，并不取决于学术教育。换言之，修士借由最简朴的劳作得救：他可以一生为厨师，洗涤器皿，而灵在上帝内并与上帝同在，且上帝在他之内。所以，在修道生活中，没有我们所见于神学院校中的那种现象——在那里，某人被视为更高，某人更低，相应的，彼此关系带有傲慢的性质。在修道生活中，最卑微的工作有时有助于得救，因为心思在这种工作中完全自由，得以常住上帝之内。在履行其工作时，不带情欲，但极其细致和尽职，修士使其心思恒常保持在上帝之内。
    - type: paragraph
      text:
        ru: 'Богословие академическое и монашескую жизнь можно еще сравнить с таким положением, когда человек живет в какой-нибудь глуши и вот попалась ему книга о Лондоне как самом замечательном городе, многолюдном, полном многих памятников и так далее. И человек с увлечением читает эту книгу, и смотрит на фотографии, и своим односельчанам рассказывает об этих чудесах. А другой человек живет в Лондоне. И спросят его:'
        cn: 学术神学和修道生活还可以比作这样一种情形：一个人住在某个偏僻之地，然后他偶然得到一本关于伦敦的书，这本书将伦敦描述为一座最非凡的城市，人口众多，充满许多古迹，等等。这个人就入迷地读这本书，看着照片，并向他的同乡们讲述这些奇迹。而另一个人则住在伦敦。倘若有人问他：
    - type: paragraph
      text:
        ru: – Знаете ли вы такой-то памятник?
        cn: – 你知道某某纪念碑吗？
    - type: paragraph
      text:
        ru: – Нет, не знаю...
        cn: – 不，我不知道……
    - type: paragraph
      text:
        ru: 'Но он живет в Лондоне как гражданин города. И придет время, когда он будет знать весь город, все это царство и станет «почетным гражданином Лондона»: «Free man of the city of London». Так то, что одни рассказывают по книжкам, другие живут на опыте.'
        cn: 但他住在伦敦，是这座城市的公民。时日将到，他将认识整个城市，这整个国度，并成为「伦敦荣誉市民」：「Free man of the city of London」。因此，一些人从书本上讲述的，另一些人则通过经验生活着。
    - type: paragraph
      text:
        ru: 'И простите мне то, что я иногда хвалюсь: один из наших друзей, профессор Галитис, спросил знаменитого богослова Романидиса:'
        cn: 请原谅我有时会夸耀：我们的一位朋友，伽利提斯教授，询问了著名的神学家罗马尼德斯：
    - type: paragraph
      text:
        ru: – А что Вы думаете о книге про Силуана?
        cn: – 您觉得关于圣西卢安的那本书怎么样？
    - type: paragraph
      text:
        ru: 'Романидис ответил:'
        cn: 罗曼尼迪斯回答说：
    - type: paragraph
      text:
        ru: – Они знают это по опыту, а мы только по книжкам.
        cn: – 他们凭经验知道这事，而我们只凭书本。
    - type: paragraph
      text:
        ru: Так человек может находиться в состоянии, когда на него нисходит Нетварный Свет, и не знать, что с ним. Но в действительности он пребывает в этом Свете и живет это состояние как совсем естественное для него.
        cn: 一个人可以处于这样一种状态：有非受造光降临在他身上，而他却不知道那是什么。但实际上，他安住在这光中，并体验这状态为对他而言全然自然的。
    - type: paragraph
      text:
        ru: Когда мы живем в монастыре, знайте достоверно, что никакая функция сама по себе не возносит человека и никакая самая простая работа не унижает его.
        cn: 当我们在隐修院生活时，你们当确切地知道，没有任何职务其本身能使人升高，也没有任何最卑微的工作会贬低他。
    - type: paragraph
      text:
        ru: 'Мне как-то сказал один монах на Афоне: «Никакая низкая работа не унижает человека, а унижает только грех». Отсюда и эта церковная молитва – «Сподоби, Господи, без греха сохранитися нам...»: «Господи, сподоби нас прожить без греха». И живите эту молитву как можно интенсивнее.'
        cn: 有一次，阿索斯山的一位修士对我说：「没有任何卑微的工作会贬低一个人，而唯有罪才会贬低他。」由此也引申出这句教会祷文：「主啊，求祢使我们得蒙保守，免于犯罪……」——这可理解为：「主啊，求祢使我们无罪度日。」并且尽可能热切地活出这祷文。
    - type: paragraph
      text:
        ru: И помогайте друг другу, и будем жить вместе как один человек. Сказано, что, если ты хочешь научиться чему-нибудь, какой-нибудь добродетели, поселись с человеком, у которого эта добродетель уже освоена, и ты научишься сам. Очень важно для нас – иметь братьев, сестер и делиться этой жизнью. К глубочайшему сожалению, у людей, живущих в миру, почти никогда не бывает этой привилегии, а им приходится жить все время в атмосфере культивирования греха. Так что дорожите своей монашеской семьей, где люди хотят всем своим существом воспринять добродетель от Самого Бога. Молитесь друг за друга, каждый за всех и все за каждого, чтобы дал нам Бог прожить вместе, и знайте, что это связано с подвигом.
        cn: 彼此帮助，我们将合一地生活。有言道，若你渴望学习某种德行，就与已经掌握这种德行的人住在一起，这样你就能亲自学会。拥有弟兄姊妹并分享这份生命，对我们来说至关重要。令人深感遗憾的是，生活在世俗中的人几乎从未拥有这种特权，他们不得不一直生活在滋养罪恶的氛围中。所以，要珍惜你们的修道家庭，在那里，人们全心全意地渴望从上帝本身领受德行。彼此代祷，每个人为众人，众人为每个人，祈求上帝赐予我们共同生活，并要知道，这与苦修是紧密相连的。
    - type: paragraph
      text:
        ru: Когда я был еще живописцем во Франции, в Париже, у меня произошел перелом (я решился оставить живопись и пойти в монахи). Мое ателье было в павильоне одной французской дамы. Я не знаю, как она догадалась об этом, но, придя в мое ателье и рассматривая написанный мною портрет, она сказала:«Oh, Monsieur Sakharoff, comme il est difficile dʼêtre saint! Il faut être gentil avec tout le monde, toujours, toujours, et avec tout le monde, mais il y en a beaucoup de gens si désagréables!»[100]. Так, она думала, что святость – этоgentillesse[101].
        cn: 当我还在法国巴黎做画家的时候，我经历了一个转折点（我决定放弃绘画，去修道）。我的画室在一座法国女士的凉亭里。我不知道她是怎么猜到的，但她来到我的画室，看着我画的一幅肖像画，她说：「Oh, Monsieur Sakharoff, comme il est difficile dʼêtre saint! Il faut être gentil avec tout le monde, toujours, toujours, et avec tout le monde, mais il y en a beaucoup de gens si désagréables!」[100]（哦，萨哈罗夫先生，成为圣人多么困难啊！你必须对所有人，总是，总是，对所有人都要友善，但有许多人是如此令人不快！）于是，她认为圣洁就是友善[101]。
    - type: paragraph
      text:
        ru: 'В нашем состоянии падения всякая заповедь подчеркивает наше отличие от истинного образа Божия в нас. Все заповеди противоположны нашему естественному движению в состоянии падения. И то, о чем мы говорим, – стать как единый человек, согласно заповеди Господа ученикам Своим, – дается неизбежно подвигом, а не как нечто естественное нам. И надо иметь в виду, что даже в маленькой монастырской среде бывают минуты, когда трудным становится брат или сестра. И как быть«gentil avec lui»[102]? – Итак, для вас я предлагаю: «Любите друг друга»[103], потому что мы действительно единая семья. И когда будут трудности в этой семье, то, пока я жив, отдайте мне заботиться о том, чтобы устранить трудность, дабы кто-нибудь не ошибался.'
        cn: 在我们堕落的状态中，每一条诫命都强调我们与我们内在真实之上帝的肖像的不同。所有诫命都与我们在堕落状态中的自然倾向相悖。我们所谈论的——依照上主吩咐祂门徒的诫命，成为合一的人——必然要通过苦修才能获得，而非如自然之事赋于我们。并且要记住，即使在小的修道院环境中，也会有片刻弟兄或姊妹变得难以相处。那该如何《待他温柔》[102]呢？——所以，我向你们建议：《彼此相爱》[103]，因为我们确实是一个家庭。当这个家庭中出现困难时，那么，在我活着的时候，将排除困难的责任交给我，免得有人犯错。
    - type: paragraph
      text:
        ru: 'Все трудности возникают от нашего неведения. Моим духовником был архимандрит Кирик в монастыре святого Пантелеймона. Дьяконом я часто служил с ним. И один раз мы служили в церкви, посвященной святителю Митрофану. Там на аналое была икона, на которой и Христос, и Божия Матерь, и Креститель, и ангелы, и святые, – все стояли просто в одну шеренгу, как солдаты, то есть не так, как обычно в Деисусном чине, где они молятся Христу. И перед Литургией о. Кирик спросил меня: «Знаешь ли ты, что такое невежество?». – Я ответил: «Я не совсем понимаю Ваш вопрос, потому что сознавать свое невежество мне свойственно». – А он говорит: «Вот я скажу тебе: одно неведение – еще не невежество, два – еще не невежество, три, четыре, пять – еще не невежество, но когда семь! (а их было семь фигур) – тогда это невежество».'
        cn: '一切困难皆源于我们的无知。我的神师是圣潘捷列伊蒙修道院的长老基里克。我作执事时，常与他一同侍奉。有一次，我们在一座献给圣主教米特罗凡的教堂里侍奉。圣像架上有一幅圣像，上面有基督、圣母、施洗者、众天使和众圣徒，都像士兵一样，笔直地站成一排——也就是说，不像通常的代祷圣像群那样，他们在向基督祈祷。


          在圣礼前，基里克神父问我：「你可知何为愚昧？」我答道：「我不太明白您的问题，因为察觉自己的愚昧对我而言是自然的。」他说：「我来告诉你：一个无知，还不算愚昧；两个——还不算愚昧；三个、四个、五个——还不算愚昧；但当有七个的时候！ （那里有七个人物）——那才是愚昧。」'
    - type: paragraph
      text:
        ru: Итак, неизбежно у каждого из нас всегда есть какое-то неведение, которое еще не есть невежество. Неведение свойственно всем нам, ибо «всё знают» только дураки. Такое «всезнание» уже есть невежество.
        cn: 那么，我们每个人都必然总是会有某种未知，这尚不等于无知。未知是我们所有人固有的，乃因唯有愚者才「无所不知」。这种「无所不知」便是无知。
    - type: paragraph
      text:
        ru: Когда приходят новые люди, то молитвою мы создаем единое бытие в Боге. И это связано с подвигом, ибо это – выше нашего естества в состоянии падения. Поэтому будут часы, будут, может быть, даже и более длинные сроки, когда кто-то находится в состоянии неблагополучном в отношении к другому лицу. Тогда это препобеждается молитвой, и, если мы победим, Господь будет с нами. Простите меня, но то, что я сказал вам, я говорил от сердца. И молитва моя, конечно, всегда за всех вас и за каждого из вас.
        cn: 当有新人到来时，我们就藉着祷告，在上帝内建立起合一的生命。而这与属灵的劳作相关，因为这超越了我们堕落状态中的本性。因此，会有一些时日，甚至可能更长的时间，当某人与他人关系不睦时。那时，这就能藉着祷告而全然胜过，若我们得胜，上主就必与我们同在。请原谅我，但我告诉你们的这些话，乃是发自肺腑的。当然，我的祷告也始终是为你们众人，也为你们每个人。
  - type: heading2
    text:
      ru: 'Беседа 12: О единстве всех как заповеди жизни[104]'
      cn: 第12篇讲论：论及万众的合一，作为生命的诫命[104]
    children:
    - type: paragraph
      text:
        ru: 'О заповеди Христа: да едино будут. Усвоение слов Христа чрез чтение Евангелия. О нетерпении Господа и о наших трениях.Ин.12:26– богоподобное бытие. О последних днях мира. Атомизация человечества как последствие грехопадения Адама. Унаследование смерти от Адама и жизни от Христа. О кротости игумена'
        cn: 论基督的诫命：愿他们合而为一。藉着阅读福音书来领受基督的话语。论上主的不容忍和我们的纷争。(约翰福音 12:26)——肖似上帝的存有。论世界的末日。人类的原子化，乃是亚当堕落的后果。从亚当承受死亡，从基督承受生命。论院长的谦和。
    - type: paragraph
      text:
        ru: 'Слова Самого Христа в Его молитве к Отцу являются для нас завершением всего плана сотворшего нас Бога. Нет ничего более высокого и совершенного, чем то, что заповедал Господь на Тайной Вечере, и особенно после Вечери в Своей молитве к Отцу. Нам необходимо знать эти слова Христа, хотя они и не даны в форме заповеди. Нам неизвестно, почему Он сказал: «Се заповедую вам, да любите друг друга»[105], а в молитве к Отцу: «Да будут все едино, как Мы: Ты, Отче, во Мне и Я в Тебе – как Мы едино»[106]. Для меня нет никакого сомнения, что эти слова перед голгофской смертью имеют самое высокое значение из всего, что говорил Господь. Уподобиться Святой Троице в нашем единстве есть беспредельный предел наших исканий. Это есть последняя глубина плана Божия о нас. Мы сами никогда не сможем своими силами создать в нас ту жизнь, о которой говорит Господь. Но когда в наших молитвах – каждого из нас за всех других и всех других за каждого из нас – мы будем мыслить о заповеди Христа и о конечном завершении нашего обожения, тогда мы, не создавая в себе этой жизни, располагаем себя для ее восприятия. Потому что в молитве за всех и каждого из братьев и сестер мы идем навстречу молитве Христа. И тогда Ему легко встретить нас и даровать нам то, что нам невозможно достичь самим, но что мы уже горячо желаем в сердцах наших.'
        cn: 基督本人在祂向父的祷告中所说的话，对我们而言是创造我们的上帝整个计划的最终成全。没有什么比上主在最后的晚餐上所吩咐的，尤其是在晚餐之后在祂向父的祷告中所说的，更高尚、更完善的了。我们有必要知道基督的这些话语，尽管它们并非以诫命的形式赐予。我们不知道祂为何说：「看哪，我吩咐你们，要彼此相爱」[105]，而在祂向父的祷告中却说：「愿他们都合而为一，像我们一样：父啊，祢在我里面，我在祢里面——像我们合而为一」[106]。对我而言，毫无疑问，这些在各各他受死之前的话语，在上主所说的一切话语之中，具有最高的意义。在我们的合一中效法圣三一，是我们寻求的无限极限。这是上帝关于我们计划的最终深度。我们自己永远无法凭自己的力量，在我们里面创造上主所说的那种生命。但当我们在祷告中——我们每个人为所有其他人，以及所有其他人为我们每个人——思想基督的诫命，并思想我们成神的最终成全时，那时我们并非在我们里面创造这种生命，而是为接受它做好准备。因为在为所有弟兄姐妹中的每一个人祷告时，我们迎向基督的祷告。那时，祂便容易与我们相遇，并将我们凭自己无法达到的，但我们心中已经热切渴望的，赐予我们。
    - type: paragraph
      text:
        ru: 'Чтобы проникнуть глубже в смысл слов Христа, мы должны усердно читать Евангелие и внимательно останавливаться на каждом Его слове. И так мы достигнем того, что слова Его проникнут в сердце наше и мы будем носить их в себе как нашу собственную жизнь. Таких слов, которые драгоценны для нас, немало в Евангелии, и каждый из нас должен «воспитывать» в себе слова Христа. Так мы становимся детьми Бога. И где Он Сам, там и мы будем, по Его обетованию[107]. Чтобы вошла в нас, в наши глубокие сердца, жизнь самого Христа, мы, конечно, должны разуметь не только Его заповеди, но видеть в Нем Его глубокое сердце, которое Он раскрывал Отцу Своему в Своей молитве: «Да будут все едино, как Он и Отец едино суть»[108], что Он не выразил как заповедь. Не сразу мы усваиваем настоящее содержание слов Христа. Они постепенно входят в нас. Сначала эти слова могут быть для нас как бы извне приходящими, и лишь постепенно они обнимут наше сердце и ум и будут нашими словами. И те, которые пришли к нам недавно, должны знать и конечную идею, которую мы положили в основу нашего монастыря. Молитвенно останавливаясь на этих словах Господа, мы постепенно войдем таким путем еще более глубоко в Его интимную жизнь. И затем всю нашу жизнь мы построим так, чтобы питаться нам Его словом, в котором заключена вечная жизнь, – как Он Сам сказал: «Небо и земля прейдут, словеса Мои не прейдут»[109].'
        cn: '为了更深入地领会基督的话语的意义，我们必须勤勉地阅读福音书，并仔细地停留在祂的每个字句上。如此，我们将达到祂的话语渗透我们的心，我们并将它们承载在我们自己里面，如同我们自己的生命。在福音书中，这样对我们来说宝贵的话语并不少见，我们每个人都应该在自己里面「培养」基督的话语。这样，我们就成为上帝的儿女。并且祂自己在哪里，我们也将会在哪里，按照祂的应许[107]。为了基督自己的生命能够进入我们里面，进入我们深邃的心中，我们当然不应该仅仅理解祂的诫命，而是要在祂里面看到祂深邃的心，祂在自己的祷告中向祂的父所启示的：「愿他们都合而为一，正如祂与父原为一」[108]，这并不是祂以诫命形式表达的。


          我们并不能立刻领会基督话语的真实内涵。它们是逐渐进入我们里面的。起初，这些话语对我们来说可能仿佛是外来的，只有逐渐地，它们才会拥抱我们的心和思想，并成为我们自己的话语。而那些最近来到我们这里的人，也应该知道我们作为修道院基础的最终理念。借着祷告停留在上主的这些话语上，我们将逐渐地通过这种方式，更深入地进入祂的亲密生命。然后，我们将这样建造我们的一生，以便我们以祂的话语为滋养，在其中蕴藏着永恒的生命——正如祂自己所说：「天地将要废去，我的话语却永不废去」[109]。'
    - type: paragraph
      text:
        ru: 'Есть один эпизод в Евангелии, когда некий отец привел своего бесноватого сына и просил апостолов изгнать беса из его сына, и они не возмогли. Тогда отец пришел ко Христу и сказал Ему об этом. И Господь с некоторым нетерпением сказал: «О, доколе Я буду с вами, доколе терплю вас, маловеры»[110]. Конечно, Господь торопился исполнить Свое «дело»[111]на земле. И даже Он проявил «нетерпение». Таким образом (простите меня) вы поймете и мое желание перед моим исходом передать вам все.'
        cn: 福音书中有一个记载，讲到有一位父亲带着他那被鬼附的儿子来到使徒们面前，请求他们将鬼从他儿子身上赶出去，但他们未能做到。于是这位父亲来到基督面前，并把这件事告诉了祂。主带着些许不耐地说道：「唉，我与你们同在要到几时呢？我忍受你们要到几时呢？你们这些小信的人啊！」[110] 当然，主急于在地上完成祂的「工作」[111]。甚至祂也表现出了「不耐」。这样一来（请原谅我），你们也会理解我在这离世之前，渴望将一切都传授给你们的愿望。
    - type: paragraph
      text:
        ru: Маленькие события повседневной жизни, конечно, неизбежно связаны с некоторыми трениями и недоразумениями. Но как мы можем преодолеть их, сохраняя полноту любви к братьям и сестрам? – Старшие из вас много раз слышали об этом и знают, а младшим, которые пришли, я открою тайну. Для этого необходимо иметь пред собою нашу великую цель, которая превосходит всякую человеческую мысль, и стремиться к этой цели. Когда вдохновенное искание впитать в себя истину овладеет нами, тогда маленькие недоразумения будут решаться в духе братской любви, взаимного доверия и не нарушат нашей жизни. Старайтесь изгнать из себя всякую мысль против брата, против сестры. Считайте всякий такой момент как бы трещиной в стенах нашего храма... Помните, пожалуйста, это правило нашей аскетики и нашего подвига – никогда не забывать о конечной цели, которая стоит пред нами! И тогда вы увидите, что наша маленькая жизнь принимает характер светоносный и божественный.
        cn: 日常生活中的小事，当然不可避免地伴随着一些摩擦和误解。但我们如何才能克服它们，同时保持对弟兄姊妹全然的爱呢？——你们当中年长的，已经多次听过并深知此事；而对于新来的年轻人们，我将揭示这个奥秘。为此，必须将我们伟大的目标置于自身面前，这目标超越了人类一切思想，并努力趋向这个目标。当受圣灵感动的寻求真理的渴望占据我们时，那时，小小的误解就会在弟兄之爱、互相信任的精神中被解决，且不会破坏我们的生活。努力将心中任何针对弟兄、针对姊妹的思想驱逐出去。要将每个这样的时刻视为我们圣殿墙壁上的裂缝……请谨记，这是我们苦修与我们功行的原则——永远不要忘记那摆在我们面前的最终目标！这样，你们就会看到，我们这微不足道的生命将会展现出光明而神圣的特质。
    - type: paragraph
      text:
        ru: 'Господь сказал: «Хочу, чтобы там, где Я, там и слуга Мой был бы со Мною»[112]. Что значит «там быть, где Он»? – Это значит иметь образ бытия, свойственный Самому Богу. Чтобы сделать нашу жизнь здесь полною смысла, мы, конечно, должны усердно изучать все. Мы должны понимать, что Господь единственно Ему свойственным чудом дал нам есть Тело Свое и пить Свою Кровь, чтобы мы были все едино в Нем – от Его Плоти, от Его Крови. Начиная с малого, мы незаметно расположим Бога доверить нам Свою благодать, и так преобразится все наше бытие. И вместо жалкого, рабского бывания нашего на земле, по обетованию неложному Самого Христа, мы получим иную жизнь[113].'
        cn: 主说：「我愿我在哪里，我的仆人也与我同在那里」[112]。这「与祂同在」意味着什么？——这意味着拥有与上帝本身相称的生存方式。为了使我们在此的生命充满意义，我们当然必须勤勉地学习一切。我们必须明白，主以祂独有的奇迹，将祂的圣体赐给我们吃，将祂的宝血赐给我们喝，旨在使我们都在祂内合而为一——由祂的圣体而来，由祂的宝血而来。从小事开始，我们将不知不觉地促使上帝将祂的恩典托付给我们，于是我们整个的生存将得以改变。并且，取代我们在世上悲惨、奴役般的生存，依照基督本身真实不谬的应许，我们将获得另一种生命[113]。
    - type: paragraph
      text:
        ru: 'Господь сказал о последних днях мира, что будет великая скорбь, в которую погрузится вся земля. Бедствия достигнут таких размеров, что от одного ожидания этих бедствий многие будут умирать. В Его словах есть указания об этих грядущих бедствиях: землетрясениях, бурях, болезнях, войнах. Его учеников, то есть христиан подлинных, будут ненавидеть повсюду на Земле. И Господь говорит: «И это должно быть»[114]. Но добавляет: «Когда вы увидите все это, то подымите ваши лица к Небу, ибо приблизилось ваше избавление»[115]. Читайте Евангелие и ничему не удивляйтесь, но только носите в себе то сознание, которое предлагает нам Господь в Своих словах!'
        cn: 主曾说起世界的末日，将有大患难笼罩全地。灾难将极其严重，以至于许多人仅仅因着预料这些灾难就会丧命。祂的话语中指明了这些将要临到的灾难：地震、风暴、疾病、战争。祂的门徒，亦即真正的基督徒，将会在普世各地被恨恶。主又说：「这一切都必要发生」[114]。但祂又补充道：「当你们看见这一切的时候，就当仰望天空，因为你们的救赎临近了」[115]。阅读福音书，不要对任何事感到惊讶，但只当在自身中存留主在祂的话语中向我们提出的那份意识！
    - type: paragraph
      text:
        ru: 'Поделюсь с вами тем, что в моем сердце: когда бывают между нами маленькие недоразумения, которых избежать нельзя, то не придавайте значения этим маленьким испытаниям. Нося в себе образ Христа, имейте в виду, что Он есть откровение предвечной идеи Бога о человеке. Всегда имейте только эту мысль, и тогда все станет легким. Я надеюсь, что постепенно из всех моих бесед и заметок создастся настоящая картина того, что я ношу в моем сознании. Это может воистину спасти нашу жизнь от всех бедствий. В нашей жизни повседневной мы привыкаем видеть происходящие войны или другие несчастья, как будто бы они естественны для нас. Это потому, что, читая библейское откровение о грехе Адама, мы не улавливаем космического и сверхкосмического значения его падения. Мир расколот на многие части и до такой степени, что греки отдельного человека называют «атомом». «Атом» по смыслу – «то, что не может быть разрезано». И такая «атомизация» всего человечества привела к тому, что теперь даже в браке, о котором Господь сказал: «Что Бог соединил, человек да не разделяет»[116], – уже есть расколы. Даже там не видят люди возможности жить вместе. И задача перед нами – как из этого «атома», или по-латински «индивидуума», от этой формы бытия перейти к тому, чтобы каждый из нас сначала осознал себя наследником Адама и потом, как сын его, впитав в себя сознание Адама, жил бы все человечество как свою жизнь. Это трудно выразить словами. Так, некоторые могут подумать: не была ли молитва Силуана за всего Адама следствием какой-то идеи, а не действительной реальности? Это неверно вот почему: Адам во всей своей полноте вовсе не есть человеческая идея, а самая конкретная действительность. И когда мы станем персонами-ипостасями по образу ипостаси Самого Христа, тогда мы будем носить в себе все человечество. И познавать его мы будем сначала, переживая нашу собственную драму. Мы – клеточки великого тела человечества. И когда человечество больно и болезнь проходит через сие великое тело, то это отражается на всех нас. Живите каждое событие как откровение о происходящем во всем космосе. Мы не вне этого пространства, мы внутри. Немногое, что я сказал сегодня, довольно для того, чтобы думать годами, жить это в молитве, жить это всем сердцем и умом.'
        cn: 我想与你们分享我心之所念：当我们之间发生一些不可避免的小小误解时，不要重视这些小小的考验。心中怀着基督的形象，请记住，祂是上帝关于人类的永恒观念的启示。永远只持守这一思想，那么一切都会变得轻松。我希望，渐渐地，从我所有的谈话和笔记中，将会形成一幅真实图景，展现我心识中所怀的。这能真正将我们的生命从一切苦难中拯救出来。在我们的日常生活中，我们习惯于看待发生的战争或其他不幸，仿佛它们对我们来说是自然的。这是因为，当我们阅读圣经中关于亚当之罪的启示时，我们未能领会他堕落的宇宙性和超宇宙性意义。世界被分裂成许多部分，并且分裂到如此程度，以至于希腊人将个体的人称为「原子」。「原子」的含义是「不可再分割之物」。而人类的这种「原子化」导致了，如今甚至在婚姻中——主曾说过：「上帝所配合的，人不可分开」[116]——也已出现了分裂。甚至在那里，人们也看不到共同生活的可能性。摆在我们面前的任务是——如何从这种「原子」的、或拉丁语称为「个体」（индивидуум）的存在形式，转变到我们每个人首先认识到自己是亚当的后嗣，然后，作为他的子孙，吸纳亚当的意识，将全人类视为自己的生命而生活。这难以用言语表达。因此，有些人可能会想：圣西卢安为全人类亚当的祷告，是否只是某种观念的产物，而非真实的现实？这是错误的，原因如下：全备的亚当绝非人类的观念，而是最具体的现实。当我们按照基督本体的位格形象，成为位格（ипостась）时，那时我们将把全人类承载于自身之内。我们将首先认识它，通过体验我们自身的悲剧。我们是人类这伟大身体的细胞。当人类患病时，并且疾病穿过这伟大的身体时，这就会反映在我们所有人的身上。活出每个事件，将其视作一个启示，启示着整个宇宙中正在发生的一切。我们并非置身于这个空间之外，我们置身其中。我今天所说的这些微薄之语，足以让你们思考数年，在祷告中活出它，用全心和全智活出它。
    - type: paragraph
      text:
        ru: 'И обо мне, пожалуйста, молитесь, чтобы Господь даровал мне слово истинное. Он сказал:«Аз есмь путь, истина и жизнь»[117]. И я думаю так: если Господь истина и если мое слово основано на том, что Он открыл нам, то, может быть, даже при всей скудости моей, слово мое все-таки остается верным. Если мы не можем измерить грех Адама, который все-таки не есть беспредельный, и если он превосходит наше понимание, то тем более превосходит его и предвечная и вечная Жизнь Самого Христа.'
        cn: 也请为我祈祷，求上主赐予我真理的话语。祂说：「我就是道路、真理、生命」[117]。我便如此想：如果上主是真理，如果我的话语建立在祂向我们所启示的一切之上，那么，或许，即便我如此贫乏，我的话语仍能是忠实的。如果我们无法衡量亚当的罪，尽管这罪并非无限的，并且它超越了我们的理解，那么，基督自身那先于永恒并永恒的生命，就更要超越我们的理解了。
    - type: paragraph
      text:
        ru: 'В ирмосе Великого канонаАндрея Критскогоговорится: «Помощник и покровитель бысть мне во спасение, сей мой Бог, и прославлю Его, Бог отца моего, и вознесу Его». Этот замечательный ирмос выражает то, что как от Адама мы унаследуем последствие его греха – смерть, так от новых людей, рожденных во Христе, мы унаследуем вечную жизнь. Это зависит от вашей веры и вашего доверия. Для меня Силуан – «отец мой», и, когда я пою этот ирмос, «Бог отца моего» есть мой Бог...'
        cn: 在安德烈·克里特大圣颂歌的伊尔莫斯中唱道：「祂是我的帮助者和护佑者，使我得救；祂是我的上帝，我要颂扬祂；祂是我父的上帝，我要高举祂。」这个卓越的伊尔莫斯表达了：就像我们从亚当那里继承了他的罪的后果——死亡一样，我们也从在基督里重生的人那里继承了永生。这取决于你的信仰和你的信赖。对我而言，圣西卢安是「我的父」，而当我唱诵这个伊尔莫斯时，「我父的上帝」就是我的上帝……
    - type: paragraph
      text:
        ru: Вот я молчу, сказав вам драгоценное для меня слово...
        cn: 我就此沉默了，在向你们说了对我而言珍贵的话语之后……
  - type: heading2
    text:
      ru: 'Беседа 13: Через послушание к воскресению[118]'
      cn: 第13讲论：借着顺服通向复活[118]
    children:
    - type: paragraph
      text:
        ru: О чаянии как энергии воскресения. О неспособности понести пасхальную радость. Обретение мощей прп. Серафима как залог воскресения. О пути к воскресению через распятие послушания. Об отталкивании от слова Христова. О терпении как реакции на непонятное слово духовника. Воскресение уже в нас есть как вера. Об ответственности послушника за слово духовника
        cn: '论盼望是复活的能量。

          论无力承受逾越节的喜乐。

          论寻获可敬者塞拉芬圣髑是复活的保证。

          论通过顺从的十字架通往复活的道路。

          论排斥基督的圣言。

          论忍耐是对神父不明白话语的回应。

          复活已在我们里面，是信德。

          论顺从者对神父话语的责任。'
    - type: paragraph
      text:
        ru: Я жду слова от Бога, чтобы говорить с вами сегодня. Наступили дни, когда мы готовимся торжествовать воскресение человека. Я не говорю – воскресение Христа как нечто единственное. Действительно, в каком-то смысле Его воскресение – единственное событие, но в общем-то речь идет о нас самих, о нашем воскресении.
        cn: 我正在等候来自上帝的话语，以便今天与你们交谈。时日已至，我们正在预备欢庆人的复活。我所说的并非是——基督的复活是独一无二的事件。确实，在某种意义上，祂的复活是独一无二的事件，但总的来说，所谈论的是我们自己，是我们的复活。
    - type: paragraph
      text:
        ru: 'Мы читаем Символ веры. В конце его наши мудрые Отцы поместили такие слова: «Чаю воскресения мертвых и жизни будущего века. Аминь». Если мы «чаем воскресения мертвых», то, конечно, воскресения для вечности. А вечность рождает в нас мысль о неколеблемости, как и апостол Павел в Послании к евреям говорит о «Царствии непоколебимом»[119]. Если вы подумаете основательно, что такое ожидание воскресения мертвых, то я надеюсь, что каждому из вас придет интуиция: мы потому ждем воскресения мертвых, что для нас это реальность – подлинная реальность вечного бытия. И если в нас есть это ожидание, то энергия этого ожидания непременно воскресит нас. Если мы действительно стараемся на каждый день обогащать наше разумение и понимание жизни во Христе Боге, то каждый день нечто прибавляется. Итак, когда мы произносим – «чаю воскресения мертвых», мы говорим это так же, как «я жду обеда»: обед будет – он готовится. Так, для нас воскресение есть реальность, которая действительно вечно существует.'
        cn: 我们诵读信经。在其末了，我们智慧的教父们置入了这样的话语：「我期待死人的复活，并来世的生命。阿们。」如果我们「期待死人的复活」，那么，当然是为了永恒的复活。而永恒则在我们心中产生关于坚定不移的念头，正如使徒保罗在希伯来书信中论及「不可摇动之国」[119]。如果你们深入思考，死人的复活之期待究竟是什么，那么我希望，你们每个人都会生发直觉：我们之所以期待死人的复活，是因为对我们而言，那是一个真实——永恒存在的真正真实。并且，如果这期待存在于我们里面，那么这份期待的能量必将使我们复活。如果我们确实努力，每日丰富我们对在基督上帝里生命的领悟和理解，那么每天都会有所增添。因此，当我们诵念——「我期待死人的复活」时，我们如此说，如同说「我期待午餐」：午餐会有的——它正在准备中。同样，对我们而言，复活是一个真实，它确实永恒存在着。
    - type: paragraph
      text:
        ru: 'Но иногда случается в нашей жизни очень печальный опыт: когда приходит день Пасхи, то у нас хватает силы на очень короткое время воспринимать радость воскресения. Вот мы сейчас продолжаем Великий пост, который длится пятьдесят дней вместе со Страстной неделей. И это для нас – естественное состояние: мы выносим пост пятьдесят, и сто, и даже триста дней в году, но радость воскресения мы способны жить едва несколько часов. Почему так? – Потому что когда мы восприняли Евангелие Христа как действительное Слово Того, Кто сотворил весь этот мир, космос, то мы ждем абсолютную непоколебимость Его Царства, а жизнь наша протекает в постоянных изменениях. Ничто не стоит. Как будто бы весь опыт этой жизни идет против нашей идеи об абсолютном Бытии. И все-таки Оно есть.'
        cn: 然而有时在我们的生命中，会发生一个非常悲伤的经历：当复活节来临之时，我们只拥有足够的力量在非常短暂的时间内感知复活的喜乐。看哪，我们现在正继续守大斋期，它连同圣周一共持续五十天。而这对于我们而言，是一种自然的状态：我们每年能够守斋五十天，一百天，甚至三百天，然而我们却只能勉强活出复活的喜乐几个小时。为何如此？——因为当我们领受基督的福音，将其作为那位创造了这整个世界和宇宙的真实圣言之时，我们便期待祂的国度拥有绝对的不可动摇性，然而我们的生命却在持续的变化中流逝。万物无有恒常。仿佛这生命的全部经历都与我们关于绝对存有的观念相悖。然而祂却确实存在。
    - type: paragraph
      text:
        ru: Вот, вчера мне читали письмо из Петербурга о том, как там обрели мощи Серафима Саровского. Он умер в 1833 году. И теперь, когда несли его мощи, народ торжественно пел величание ему, как живому, и потом стал петь пасхальные песнопения. Так что в нас живет надежда на вечную Пасху, вечное воскресение.
        cn: 你看，昨日有人给我读了一封来自彼得堡的信，讲的是在那里如何寻获了萨罗夫的塞拉芬的圣髑。他于1833年去世。而如今，当人们抬着他的圣髑时，民众庄严地向他颂唱着赞词，如同他仍活着一般，接着又开始唱复活节圣歌。因此，我们心中怀着盼望，期待着永恒的逾越节，永恒的复活。
    - type: paragraph
      text:
        ru: Но как нам быть в нашей жизни на каждый день? Идем мы к духовникам нашим, они говорят сегодня одно, а завтра другое. Что нам с ними делать? – Духовник к каждому приходящему относится так, как нужно сему лицу, а не «вообще», по теории. И когда мы сами, приходя к духовникам, колеблемся, они Духом Божиим двигаются только на то, чтобы сказать слово утверждения. Так слово их зависит от нашего расположения, но еще и от общих условий жизни. Если приходящий к духовнику человек постоянно колеблется, нигде не стоит, то духовник не может найти для него слово, которое бы устранило раз и навсегда какое бы то ни было колебание. Духовник говорит то, что может помочь человеку в данный момент.
        cn: '那么，我们如何在日常生活中行事呢？我们去见我们的神父，他们今天说一套，明天又说另一套。我们该如何对待他们呢？


          – 神父对待每一位来访者，都是根据那个人的具体需要，而不是「泛泛而论」，也不是基于理论。当我们自己去见神父时，心生犹豫，他们便被圣灵感动，只为说出一句确证的话语。因此，他们的话语取决于我们的心境，但也取决于我们生活的整体状况。如果一位去见神父的人总是心意不定，毫无立足之地，那么神父就无法为他找到一个能一劳永逸地消除任何犹豫的话语。神父所说的，是能帮助那个人在当下这一刻的话语。'
    - type: paragraph
      text:
        ru: После некоторого опыта с духовниками мы начинаем усваивать в себе начала, на которых существует ожидаемое нами Царство. И это знание вдруг становится действительно близким к тому, что говорят нам духовные отцы.
        cn: 在与神师有过一些经验之后，我们开始在自身内领悟我们所期盼的国度赖以存在的原则。而这种认识突然变得真正地接近神师们所告诉我们的。
    - type: paragraph
      text:
        ru: 'Но что делать духовнику и что делать монаху? – Мы говорили ранее об ответственности духовника за свое слово и за своего ученика. Организация жизни нашей такова, что в основе ее лежит идея – как преодолеть нашу индивидуальность, но не персональность. Поэтому, когда мы приходим в монастырь, перед нами стоит программа: «Да будет воля Твоя, яко на небеси и на земли». Вначале человек не может различить, что принадлежит вечной воле Божией и что есть временное. Но он решает вопрос так: «Всякую мою мысль я отвергаю заранее, и принципом моей жизни становится полное недоверие к самому себе». Но как быть, когда человек уже научается многому и даже может предвидеть, что ему скажет духовник? – Одна из самых замечательных книг – весьма простая по всему и понятная, но чрезвычайно глубокомудрая – писания аввы Дорофея, ученика Варсонуфия Великого и пророка Иоанна. Там он говорит про себя: у него возник вопрос. И вместе с вопросом родилось в нем сознание: «Если я пойду к старцу, то заранее знаю, что он скажет. Если старец скажет так, то зачем к нему идти?». Но он все равно идет к духовнику, говоря себе: «Если это – моя мысль, то это не от Бога, и я отвергаю ее». И правда: духовник сказал ему, как он и думал. Но он рассуждает: «Теперь это от Бога, а раньше это было искушение!»[120].'
        cn: 但灵修导师和修士该如何做呢？——我们早前谈到过灵修导师要对自己的言语和门徒负责。我们生活的组织方式，其核心思想是——如何克服我们的个体性，而非人格性。因此，当我们进入修道院时，面前摆着一个纲领：「愿祢的旨意成就，如同在天上，也在地上。」起初，人无法分辨何者属于上帝永恒的旨意，何者是暂时的。但他解决这个问题的方式是：「我预先拒绝我的一切想法，我生命的原则就是完全不信任自己。」然而，当一个人已经学会了很多，甚至能够预见到灵修导师会说什么时，又该怎么办呢？——有一本最杰出的书，它通篇极其朴实易懂，却又极其深奥智慧，那就是多罗斐修士的著作，他是大瓦尔撒努斐和先知约翰的门徒。他在其中谈到自己：他产生了一个疑问。随之，在他心中生出一个念头：「如果我去找长老，我预先就知道他会说什么。如果长老会那样说，那又何必去找他呢？」但他无论如何还是去了灵修导师那里，对自己说：「如果这是我自己的想法，那么它就不是出于上帝的，我便拒绝它。」果真如此：灵修导师像他所想的那样告诉了他。但他这样思忖：「现在这出于上帝了，而之前那只是试探！」[120].
    - type: paragraph
      text:
        ru: 'Теперь вы знаете, как «эксплуатировать» духовников. Когда вы спрашиваете духовника, и он говорит вам какое-нибудь слово, и вы потом делаете по слову духовника, никогда и нигде не говорите, что «я сделал так, потому что мне сказал духовник». Почему? – Потому что духовник для нас – как ангел служения во спасение наше. Мы обращаемся к нему, чтобы узнать волю Божию, и потом несем всю ответственность только мы, а не духовник. Не надо говорить: «А мне духовник так сказал!» Нет! – «Я так делаю, и вся ответственность лежит на мне».'
        cn: 现在你们知道了如何「利用」神师。当你们向神师请教，并且他给了你们一些指点，之后你们按着神师的指点去行，永远不要在任何地方说：「我这样做是因为神师告诉我的。」为什么呢？——因为神师对我们而言，犹如一位事奉的天使，为了我们的救恩。我们向他请教，是为了明了上帝的旨意，之后所有的责任都由我们独自承担，而不是神师。不要说：「可是神师就是这样告诉我的！」不！——「我这样做，所有的责任都由我承担。」
    - type: paragraph
      text:
        ru: У апостола Павла говорится о «непоколебимом Царствии»[121]– о Царстве, где нет никаких колебаний или изменений. И как найти настоящий путь к вечному? – Этот путь – в монашеской жизни. Когда мы идем к духовнику, то мы оставляем его решать вопрос молитвою к Богу. И слово его мы принимаем как от Бога, хотя по всему это может относиться к совершенно маленькой релятивной вещи нашей повседневной жизни. Скажем, повару говорит игумен приготовить жареную картошку. Казалось бы, совсем пустая вещь! Но, сделав так, как он сказал, мы сохраним самый принцип жизни, когда ничто не совершается по нашей индивидуальной воле. Вот «относительности» такого порядка мы живем почти все время на каждый день.
        cn: 使徒保罗谈及「不可动摇的王国」[121]——一个没有任何动摇或变化的王国。那么，如何才能找到通往永恒的真正道路呢？——这条道路，就在修道生活中。当我们去见神师时，我们就将问题交由他藉着向上帝的祈祷来解决。并且，我们接受他的话语如同来自上帝，尽管就其全部而言，这可能只关乎我们日常生活中一件非常微小、相对的事物。譬如说，方丈吩咐厨师烹制炸土豆。这看似一件多么微不足道的事啊！然而，照他所说的去做，我们便能持守生命最根本的原则，即没有任何事情是按我们个人意志完成的。我们几乎每天都生活在这样一种「相对性」之中。
    - type: paragraph
      text:
        ru: 'И тогда крепнет в нас глубокое понимание слов: «Да будет воля Твоя». Потому что всякое, даже маленькое, послушание действует страшно сильно на нас: мы вечно распятые. А что значит быть распятым? – Это значит, что и руки твои, и ноги твои прибиты гвоздями, и ты не можешь ими двинуть: ничего нельзя сделать. И когда человек так распят, то перед ним бытие встает в виде Креста, который выражает и абсолютность, и временную нашу релятивность. Так, если Бог даст вам жить таким порядком, то вы увидите быстрый прогресс в жизни духа. Но если у вас не будет этого понимания, то можно прожить сорок лет и еще ругаться и спорить из-за пустяка. Так, старец как-то увидел двух священников-иеромонахов, которые прожили более сорока лет в монастыре и спорили, где кому стоять. Для Силуана это было ужасно: после сорока лет такой жизни в подвиге – спор за место!'
        cn: 于是，在我们心中生发对这些话语的深刻理解：「愿祢的旨意成就」。因为每一个，即使是微小的顺从，都对我们有着极其强大的作用：我们是永远被钉在十字架上的。那么，被钉在十字架上是什么意思呢？——这意味着你的手脚都被钉子钉住，你无法移动它们：什么也做不了。当人这样被钉在十字架上时，存在便以十字架的形式呈现在他面前，十字架既表达了绝对性，也表达了我们暂时的相对性。这样，如果上帝让你们以这样的方式生活，你们将在灵性生命中看到快速的进步。但是，如果你们没有这种理解，那么即使活了四十年，也可能还在为琐事争吵和争论。就像有一次，一位长老看到两位神父修士，他们在修道院里生活了四十多年，却还在争论谁该站在哪里。对西拉来说，这实在太可怕了：在如此苦修的生活四十年之后——竟然为了一个位置争论！
    - type: paragraph
      text:
        ru: 'Я спросил недавно одного из вас: «В чем ваша трудность?» И ответ был такой: «Трудность моя в том, что я люблю Слово Христа, я хочу жить по Нему и в Нем, но все мое существо психофизическое сопротивляется». И тогда получается положение, о котором пишут в Патериках. Старец спросил своего ученика:'
        cn: '我最近问了你们中的一位：「你的难处是什么？」


          他回答说：「我的难处在于，我爱基督的圣言，我渴望照着祂而活，并在祂里面生活，但我的整个身心都在抗拒。」


          于是，就出现了教父言行录中所记载的这样一种情况。一位长老问他的门徒：'
    - type: paragraph
      text:
        ru: – Ну, друже, как ты смотришь на меня теперь?
        cn: 「那么，朋友，你现在怎么看我？」
    - type: paragraph
      text:
        ru: – О, ты ангел Божий.
        cn: – 哦，你是上帝的天使。
    - type: paragraph
      text:
        ru: 'Проходит некоторое время:'
        cn: 过了一段时日：
    - type: paragraph
      text:
        ru: – Как ты теперь смотришь на меня, брат?
        cn: ——你现在怎么看我，弟兄？
    - type: paragraph
      text:
        ru: – Человек...
        cn: ——人……
    - type: paragraph
      text:
        ru: 'Проходит еще некоторое время, и опять он спрашивает:'
        cn: 又过了一段时日，他又问道：
    - type: paragraph
      text:
        ru: – А теперь как ты смотришь на меня?
        cn: – 那现在你如何看我？
    - type: paragraph
      text:
        ru: – А так, – говорит, – что, хотя бы ты и доброе слово сказал, мне тяжело. Как будто бы оно не от Бога, а от врага[122].
        cn: 「是这样，」他说，「即使你说了良言，我也感到沉重。仿佛它不是来自上帝，而是来自仇敌[122]。」
    - type: paragraph
      text:
        ru: 'И наш брат спросил меня, как объяснить это явление в нашей жизни. Апостол Павел говорит: «Говори и во время удобное, и против удобного времени, и не вовремя»[123]. Если речь идет о подвижнике настоящем, то, конечно, когда его психофизический состав не в силах поднять заповедь Божию, он будет кричать к Богу. Ибо заповедь Божия превосходит уровень психофизический. И когда ум наш не может понять, то он отталкивается от этого предмета. Подобно тому, как каждый из нас в школах или каждый ученый человек, работая, вдруг нарывается на нечто, чего он не может понять.'
        cn: 我们的弟兄问我，如何解释我们生活中的这种现象。使徒保罗说：「无论时机合宜，还是时机不便，甚至不在时机，都要讲说。」[123] 如果谈及的是真正的苦修者，那么，当然，当他的身心结构无法承担上帝的诫命时，他会向上帝呼求。因为上帝的诫命超越了身心层面。而当我们的心智无法理解时，它就会排斥这个事物。就如同我们每个人在学校里，或者每个学者，在工作时，突然遭遇一些他无法理解的事物一样。
    - type: paragraph
      text:
        ru: 'Люди, потеряв настоящую идею спасения во Христе, не терпят всего, что связано с шествием вслед Христу: «Все, что превосходит меру моего понимания, мне тяжело».'
        cn: 人们，在失去了在基督里真正的救赎理念后，无法忍受一切与跟随基督的道路相关的事物：「凡是超越我理解能力范围的，都让我感到吃力。」
    - type: paragraph
      text:
        ru: 'Приведу один из случаев в научной жизни. Когда Эйнштейн говорил большому собранию математиков в Германии о своей теории, то из двухсот человек, ведущих ученых и профессоров, присутствовавших на этом собрании, только два-три поняли, о чем он говорил. Потом эта теория стала достоянием очень многих. Так и в жизни духовной. Я лично посоветую вам держаться той линии, на которую «натолкнул» меня Бог, когда я был со старцем Силуаном: если я чего-нибудь не понимаю, то не возражаю ему, не отвергаю его слово и не сужу о нем – я оставляю это на промысл Божий, который мне потом поможет проникнуть в настоящий смысл сказанного. Невозможно прийти в то состояние, в котором был Силуан, без присутствия Бога и Его великой силы внутри человека. Так, когда в нас нет этой силы, тогда нам становится тяжело. Но если вы избрали монашеский путь, то я, по положению моему, счел нужным сказать вам: «Терпите все это!».'
        cn: '我举一个科学生活中的例子。当爱因斯坦在德国向一个大型数学家会议讲述他的理论时，在那次会议上出席的两百名领先的科学家和教授中，只有两三个人明白他所说的。后来，这理论被许多人所掌握。属灵生活中也是如此。


          我个人建议你们坚持那条上帝「引导」我的路线，那是我与圣西卢安长老在一起时所领受的：如果我有什么不明白的，我就不反对他，不拒绝他的话，也不论断他——我将其交托给上帝的旨意，祂日后会帮助我领悟所说之话的真正意义。没有上帝的存在和祂伟大的力量在人里面，就不可能达到圣西卢安所处的那种境地。因此，当我们里面没有这力量时，我们就会变得艰难。但如果你们选择了修道之路，那么我，依照我的身份，认为有必要告诉你们：「忍受这一切！」'
    - type: paragraph
      text:
        ru: 'Терпите и другое! Сейчас наступает трудная и торжественная неделя – страданий Христа, и мы называем ее Страстной неделей. И после страданий вдруг придет радость: «Христос воскресе!», которая потом снова «сломается». Терпите эти вещи! Все, что ломается в нас и отталкивает от нас заповеди Христа, – все это не принадлежит к абсолютному Божественному Бытию. А мы хотим достигнуть его во Христе и через Христа.'
        cn: 也要忍受其他一切！现在，艰难而庄严的一周——基督受难周——即将到来。受难之后，喜乐会突然降临：「基督复活了！」，但这喜乐之后又会再次「破碎」。忍耐这些事！凡是我们里面破碎的，以及那些将我们推离基督诫命的一切，都不属于绝对的上帝性存在。而我们渴望在基督里并通过基督来达到它。
    - type: paragraph
      text:
        ru: 'Я сделаю теперь короткий вывод: если мы чаем воскресения мертвых, значит, в нас уже присутствует энергия воскресения, но еще не в подавляющем порядке, еще не как нечто абсолютно твердое. Приготовьтесь к воскресению, и да будет благословен всякий ваш шаг, чтобы сделать дело наше, чтобы наша жизнь действительно привела нас «туда, где Господь»: «Хочу, чтобы слуга Мой был там, где Я»[124].'
        cn: 我现在做一个简短的结论：如果我们期待死者的复活，那么，复活的能量就已经存在于我们里面了，但尚未以压倒性的方式，尚未如某种绝对坚固之物。预备自己迎接复活，愿你们的每一步都蒙受祝福，为了成就我们的工作，使我们的生命确实引领我们「到主所在之处」：「我愿我的仆人，在我所在之处。」[124]
    - type: paragraph
      text:
        ru: Можно было бы говорить еще и еще – слово о Боге никогда не кончается, как поток солнца, который заливает землю, сообщая ей свою бесконечно великую энергию. Так и со Христом, Который есть Солнце правды. Будем ловить лучи Его на нашей земле, чтобы перейти потом за заветную грань в жизнь вечную...
        cn: 还可以不断地说下去——论及上帝的言语永无止境，如同阳光的洪流普照大地，将其无限宏伟的能量传达给大地。对基督亦是如此，祂即是公义的日头。让我们在这世间捕捉祂的圣光，以便之后越过那应许的界限，进入永生……
    - type: paragraph
      text:
        ru: Я желаю вам хорошей Пасхи, чтобы опыт ваш во Христе углублялся и принимал бы характер все более и более грандиозный.
        cn: 祝您复活节蒙福，愿您在基督内的经历得以深化，并越发呈现出宏大壮丽的特质。
  - type: heading2
    text:
      ru: 'Беседа 14: Проблема единства Церкви[125]'
      cn: '讲论 14: 教会合一的问题[125]'
    children:
    - type: paragraph
      text:
        ru: 'Впечатления от беседы с владыкойN.: о невозможности дать логический ответ на вопросы о разделении христиан и гонении на них. Молитва за всех как реакция-ответ на разделение. О невозможности пожертвовать нашим видением ради единства Церквей. Спор с Богом: судит не Отец, а Сын Человеческий. О гонении на православных как тесном пути истощания самого Христа. О горькой чаше православных'
        cn: 与N主教谈话的印象：关于无法逻辑性地回答基督徒分裂以及他们受迫害的问题。为众人祷告，作为对分裂的回应。关于无法为了教会合一而牺牲我们的理解。与上帝争辩：审判的不是父，而是人子。关于对正教徒的迫害，作为基督自身虚己的窄路。关于正教徒的苦杯。
    - type: paragraph
      text:
        ru: Снова я благодарю Бога, Который сподобил меня опять видеть вас и говорить с вами.
        cn: 我再次感谢上帝，祂降恩使我得以再次见到你们并与你们交谈。
    - type: paragraph
      text:
        ru: 'ОтецN. предложил мне сегодня тему: он сказал, что есть очень важный момент в моих ответах журналисту, сопровождавшему епископа, недавно посетившего наш монастырь.'
        cn: N.神父今天给我提出了一个主题：他说，在我对那位陪同最近访问我们修道院的主教的记者所作的回答中，有一个非常重要的点。
    - type: paragraph
      text:
        ru: Епископ тогда сидел и больше молчал, я был напротив, а журналист слева от епископа. Инициативу беседы довольно решительно взял в свои руки журналист, а епископ спокойно слушал. Я был немножко, как говорится,disappointed[126]из-за этого.
        cn: 当时主教坐着，多半保持沉默，我坐在对面，而记者则在主教左侧。记者相当果断地掌握了谈话的主动权，而主教则平静地聆听。我对此有点，正如常说的，disappointed[126]。
    - type: paragraph
      text:
        ru: 'Журналист спросил меня:'
        cn: 记者问我：
    - type: paragraph
      text:
        ru: '– Если все мы – христиане: и римо-католики, и англикане, и протестанты, и православные, то, скажите, почему такой разлад у нас в христианском мире? Мы разделены!'
        cn: – 如果我们都是基督徒：罗马上帝教徒、圣公会信徒、新教徒和东正教徒，那么，请问，为什么在基督教世界中我们会有如此大的不和呢？我们是分裂的！
    - type: paragraph
      text:
        ru: 'Я был поставлен в трудное положение: я впервые принимал этого епископа и говорил с этим журналистом. И для меня было непонятным – на каком уровне отвечать на его вопрос. Ведь евангельское Откровение это безбрежный и глубочайший океан, в духовном смысле можно сказать, бездонный, ибо нет конца Божеству Христа. И в этом океане есть различные меры глубины.'
        cn: 我身处困境：我是第一次接待这位主教，并与这位记者交谈。当时，我并不清楚该在哪个层面回答他的问题。因为福音的启示是一片无边无际、极其深邃的海洋，从属灵意义上说，可以说是无底的，因为基督的神性是无穷无尽的。而在这片海洋中，有着不同深浅的层次。
    - type: paragraph
      text:
        ru: 'И я отклонил его, но он продолжил:'
        cn: 而我拒绝了他，但他继续道：
    - type: paragraph
      text:
        ru: – Почему некоторые христиане распятые, а другие их гонят?
        cn: – 为什么有些基督徒被钉死在十字架上，而另一些却逼迫他们？
    - type: paragraph
      text:
        ru: 'В общем все вопросы его, которые начинались со словаpourquoi– «почему», были об одном и том же: «Возможно ли соединение Церквей? И как?». Я не ответил ни на один, потому что на каждый из них можно отвечать на разном уровне глубины, как в безбрежном океане. К тому же моя книга уже переведена на арабский язык, и, значит, мне лучше было молчать в ответ на эти трагические вопросы.'
        cn: 总的来说，他所有以"pourquoi"——「为什么」这个词开头的问题，都围绕着同一个主题：「教会的合一可能吗？又该如何实现呢？」我一个也没有回答，因为对其中任何一个问题，都可以在不同深度的层面进行回答，仿佛在无垠的海洋中。再者，我的书已经译成了阿拉伯语，那么，面对这些悲剧性的问题，我最好保持沉默。
    - type: paragraph
      text:
        ru: 'Я ему ответил:'
        cn: 我回答他：
    - type: paragraph
      text:
        ru: – Нет логического ответа на ваши вопросы...
        cn: ——对你们的问题没有逻辑答案。
    - type: paragraph
      text:
        ru: 'И дальше я не пошел, но, беседуя с вами, я скажу, «почему». Потому что все в Евангелии превосходит нашу человеческую меру. Как говорил апостол Павел: «Евангелие наше не от человеков и не по мере человека»[127]. Итак, нет логического ответа, потому что все принимается верою – как говорит Господь: «Веруйте в Бога и в Меня веруйте»[128]. Это вопрос совсем не логики, а веры.'
        cn: 我没有再深入下去，但是，在与你们交谈时，我会告诉你们「为什么」。因为福音中的一切都超越了我们人类的尺度。正如圣使徒保罗所说：「我们的福音不是出于人，也不是凭着人的尺度」[127]。因此，没有逻辑上的答案，因为一切都是凭着信德接受的——正如上主所说：「你们要信上帝，也要信我」[128]。这根本不是一个关于逻辑的问题，而是关于信德的问题。
    - type: paragraph
      text:
        ru: 'Самое важное для нас – знать, как реагировать на трагические обстоятельства разделения христиан. Но я позволил себе говорить ему, что в нашей духовной жизни мы стараемся следовать учению нашего великого старца Силуана. Как он реагирует – мы можем судить об этом по его писаниям. После того, как Силуану было дано мгновение видеть живого Христа, ему передалось Его состояние. Христос носит в Себе все человечество как Творец всего сущего. И Силуан получил дар – жить всего Адама как свою жизнь. Все, что происходит сейчас в человечестве, – весь этот разлад и трагические столкновения, все несчастья земли, он жил как следствие непонимания нашего. И он молился за всего Адама, как написано на его иконе: «Господи милостивый, молю Тебя, дай всему миру, всем народам, всякому человеку познать Тебя Духом Святым»[129].'
        cn: 对我们来说最重要的，是知道如何应对基督徒分裂的悲剧性境况。但我容许自己对他说，在我们的灵性生活中，我们努力追随我们伟大的长老圣西卢安的教导。他的反应如何，我们能通过他的著作来判断。在圣西卢安曾被赐予片刻得见活生生的基督之后，祂的状态便传递给了他。基督作为万有的创造者，在祂自身内承载着全人类。圣西卢安也获得了恩赐，将整个亚当活出来作为他自己的生命。如今在人类中发生的一切——所有这些不和、悲剧性的冲突，地上的一切不幸——他都将其视为我们不理解的后果。并且他为整个亚当祈祷，正如在他的圣像上所写的：「慈悲的上主啊，我恳求祢，愿祢赐予全世界、所有的民族、每一个世人，借着圣灵来认识祢」[129]。
    - type: paragraph
      text:
        ru: Итак, в нашей жизни, когда вопрос заключен в вере, а не в логическом доказательстве, нам важнее знать – КАК РЕАГИРОВАТЬ.
        cn: 因此，在我们生活中，当问题在于信仰而非逻辑证明时，对我们而言，更重要的是知道——如何回应。
    - type: paragraph
      text:
        ru: Конечно, слово старца идет на глубинах, недостижимых для среднего человека. В моей книге о нем я пишу, что Христос пришел и опрокинул пирамиду человеческого бытия. И внизу, в вершине этой опрокинутой пирамиды, находится Он Сам. И все, кто следуют за ним, погружаются в эту глубину.
        cn: 当然，长老的话语深入至一般人无法企及的深处。在我关于他的书里，我写道，基督降临并倾覆了人类存在的金字塔。在下方，在这倾覆的金字塔的顶点处，是祂自己。而所有跟随祂的人，都沉潜于这深度之中。
    - type: paragraph
      text:
        ru: 'Итак, вопрос о том, как возможно соединение Церквей, я отклонил, сказав только: «Я понимаю, что всем нам тяжело».'
        cn: 因此，关于教会如何可能联合的问题，我避开了，只说了：「我明白我们所有人都很艰难。」
    - type: paragraph
      text:
        ru: Почему нам, православным, невозможно отказаться от своего видения, от нашей жизни во Христе и нашего понимания Его Откровения? – Потому что мы понимаем все по-разному. Западу не дано было постигнуть в полноте Откровение о принципе персоны-ипостаси в бытии Божественном и в бытии человеческом, как мы имеем в Православии.
        cn: 为什么我们这些东正教徒不可能放弃自己的视野、我们基督里的生命以及我们对祂启示的理解呢？— 因为我们对一切的理解方式不同。西方未能完全领悟关于位格原则在上帝存有中和在人类存有中的启示，就像东正教所拥有的一样。
    - type: paragraph
      text:
        ru: 'Другие привыкли воспринимать Христа и Откровение в данной им мере. Они любят то, что они познали. И трагизм в том, что различна глубина понимания Откровения, данного во Христе и сошедшим на Церковь Духом Святым. Англиканская Церковь предлагает свою форму единения – через единство Англиканской Церкви во всем мире. Некоторые назвали ееEglise-bridge– церковь как мост для единства. Римо-католики мыслят единство не иначе, как подчинение всех римскому епископу. Поскольку это связано с личной интуицией каждого человека, логически мы не можем доказать ничего. Это вопрос есть только веры, и, как апостол Павел говорит: «Верою ходим, а не ведением»[130].'
        cn: 另一些人则习惯于在他们所领受的限度内领受基督与启示。他们喜爱他们所体认的。而悲剧之处在于，对那在基督内所授予、并藉圣灵降临于教会的启示，其理解的深度各不相同。圣公会提出了它自己的合一形式——借由全世界圣公会的合一。有些人称其为Eglise-bridge——一座作为合一之桥的教会。罗马公教徒认为合一，无非是所有人顺服于罗马主教。既然这关联着每个人个人的直觉，从逻辑上我们无法证明任何事。这是一个纯粹信仰的问题，并且，正如使徒保罗所说：「我们行事为人是凭着信心，不是凭着眼见」[130]。
    - type: paragraph
      text:
        ru: 'Отец N.: Мне казалось, что важны не столько его вопросы, сколько методология Вашего ответа: нельзя стараться ответить на все вопросы, и надо перейти на другую грань. Чтобы получить ответ, надо перейти в план молитвы и стяжания Святого Духа. И тогда все становится ясным. И Вы тогда показали на икону старца, где написано: «Умоляю Тебя, милосердного Господа, да все народы познают Тебя Духом Святым».'
        cn: N神父：我觉得，重要的与其说是他的问题，不如说是祢回答的方法论：不能试图回答所有问题，并且需要转向另一个层面。为了得到答案，需要进入祷告和对圣灵的领受的境地。这样一来，一切都变得明晰。祢当时指着一位长老的圣像，上面写道：「我恳求祢，怜悯的 上主，愿所有民族借着圣灵认识祢。」
    - type: paragraph
      text:
        ru: 'Отец Софроний: Как отметил отецΝ., хорошо нам всем остановиться умом на том, что мы многого понять не можем. Больше того, почему школы богословские всех уровней не могут удовлетворить человечество? – Потому что основная установка их направлена на то, как свести Откровение до предмета научного исследования, то есть логики. А вопрос не в логике, а в вере – верою ходим и ею спасаемся.'
        cn: 索夫罗尼长老：正如 Ν.长老所言，我们所有人都最好在心智上停驻于这一点，即我们许多事物都无法理解。更进一步说，为什么各级别的神学院无法满足人类的需求呢？—因为它们的主要方向是要把启示简化为科学研究的对象，也就是逻辑。而问题不在于逻辑，而在于信德——我们凭信德而行，也凭信德而得救。
    - type: paragraph
      text:
        ru: 'Почему мы не можем дать всему простого логического объяснения? – Перейдем теперь на нашу жизнь. И вы простите, что я буду говорить о себе. В моей жизни был момент, когда я возлюбил учение Христа всем моим существом, но жизни в полноте по заповедям Его я не достигал. И в этом была моя боль, сильно и глубоко поразившая всего меня на всех уровнях. Господь сказал, что будет суд над каждым из нас и будет подведен итог нашей жизни. Но я жил эту невозможность жить по-христиански как один из самых трагических моментов всего моего бытия: «Почему я не могу жить по заповедям Христа?». Я доходил до отчаяния и молился Богу: «Как Ты будешь меня судить? Твой суд неправеден! Судья должен быть в тех же условиях, в каких живу я. И если, живя в моих условиях, он сохранил заповеди, то он имеет право судить меня». В моем уме был пример апостолов – они подвергались изгнанию из синагоги за то, что следовали за Христом. И потому Господь сказал им: «Вы сядете на двенадцати престолах судить двенадцать колен Израилевых»[131]. И прошу прощения у Бога за мою молитву, скандальную молитву, когда я говорил: «Ты не имеешь права судить меня, если я не могу остаться живым без пищи, без воздуха, без сна и так далее. А Ты во всем этом не имеешь нужды». И был мне ответ: «Отец не судит никого, но весь суд отдал Сыну, потому что Он есть Сын Человеческий»[132]. И в этих словах, которые, в сущности, были повторением слов евангельских, мне был дан ответ, что Господь жил в условиях несомненно более трудных, чем я. И так Он победил и ответил на мой вопрос. Никто не может сказать, что Его условия были лучшими, чем самого бедного человека. Он скитался по разным местам – у Него не было ни дома, ни места, где приклонить главу.'
        cn: 为什么我们不能给一切事物一个简单的逻辑解释？——现在让我们转向我们的生活。请您原谅，我要谈论我自己。在我的生命中曾有一个时刻，我以我全部的生命来爱慕基督的教导，但我却未能完全按照祂的诫命生活。这正是我的痛苦，强烈而深刻地打击了我整个身心，在各个层面。上主曾说，我们每个人都将受审判，我们的生命将被总结。但我把这种不可能按照基督徒的方式生活，视为我整个存在中最悲惨的时刻之一：「为什么我不能按照基督的诫命生活？」我陷入绝望，并向上帝祷告：「祢将如何审判我？祢的审判是不公义的！审判者必须处于和我同样的生活境况中。如果他生活在我的境况下，仍能遵守诫命，那么他才有权审判我。」在我的心中有使徒们的榜样——他们因跟随基督而遭到犹太会堂的驱逐。因此，上主对他们说：「你们将坐在十二个宝座上审判以色列的十二个支派」[131]。我向上帝请求宽恕，为了我的祷告，这个冒犯性的祷告，当我说道：「祢没有权利审判我，如果我不能在没有食物、没有空气、没有睡眠等等的情况下存活。而祢在这一切上都毫无需求。」我得到了一个答复：「父不审判任何人，却将一切审判的权柄交给了子，因为祂是人子」[132]。而这些话语，本质上是福音书话语的重述，我得到了一个答案，就是上主所生活的境况无疑比我所处的更艰难。祂就是这样得胜的，并回答了我的问题。没有人能说祂的境况比最贫穷的人更好。祂四处漂泊——祂没有家，也没有可以枕头的地方。
    - type: paragraph
      text:
        ru: 'И почему Ему «дадеся всякая власть на небеси и на земли»[133]? – Потому что из Божественной формы Своего бытия Он воспринял нашу рабскую форму «бывания», и таким образом Он, конечно, подвергся великому истощанию. И Его истощание переходит все грани, доступные для нас, которые хотим следовать за Ним. Подумайте: Он был оставлен в Гефсимании без ответа! И в последний момент Своей жизни, распятый на Кресте, Он говорит Отцу: «Почему Ты оставил Меня?»[134].'
        cn: 那么为什么祂「天上地下所有的权柄都赐给祂了」[133]？——因为祂从祂神圣的存在形式中，取了我们奴仆的样式，因此祂无疑地经受了极大的虚己。而祂的虚己超越了我们这些想要跟随祂的人所能企及的一切界限。试想：祂在客西马尼园被弃置不顾，无人回应！而在祂生命的最后一刻，被钉在十字架上，祂对父说：「祢为什么离弃我？」[134]。
    - type: paragraph
      text:
        ru: 'Так и мы задаемся вопросом, когда мы поставлены в условия, по-человечески непонятные. Мы стремимся любить врагов и молиться за всего Адама, как за нашу жизнь. Почему мир нас ненавидит? Господь предсказал, что «вы будете ненавидимы за имя Мое во всем мире, всеми народами»[135]. Мы видим, как Православная Церковь подвержена сейчас всем разрушительным влияниям власти князя мира сего. И мы спрашиваем: «Почему мы находимся в таком положении?». – Потому что в этом истощании Православной Церкви дан опыт и путь к познанию истощания Самого Иисуса Христа как человека. Христос воспринял позорную смерть, в той форме, которая делала всякого человека презренным и проклятым: по словам Писания,проклят всяк висяй на древе[136]. Потому и говорится, что Он взял на Себя проклятие мира и тем искупил все человечество. И так Он оставил всем нам пример, чтобы следовать за Ним. И путь этот Он называет «тесным»[137], и мало таких людей, которые видят и находят его.'
        cn: 同样地，当我们被置于人所不解的境地时，我们也会自问。我们力求爱仇敌，并为全人类祷告，如同为我们的生命一般。为何这世界憎恨我们？上主预言道：「你们将为我的名被普世万民所憎恨」[135]。我们看到，如今东正教会正遭受这世界之君王权势的一切破坏性影响。于是我们发问：「我们为何会身处此境？」——因为在东正教会的这种虚己中，我们被给予了经验和道路，以认识作为人的耶稣基督自身的虚己。基督承受了羞辱的死亡，其形式使所有人受鄙视和咒诅：按圣经的话说，「凡挂在木头上的，都是被咒诅的」[136]。因此才说，祂将世人的咒诅担在了自己身上，并以此赎回了全人类。祂就这样给我们所有人留下了榜样，叫我们效法祂。祂将这条道路称为「窄的」[137]，且鲜少有人能看见并寻得它。
    - type: paragraph
      text:
        ru: 'Мы говорим об этом между нами не для того, чтобы ответить людям иного понимания Откровения. Нам тяжело и горько, но мы пьем эту чашу, как Чашу Самого Христа. Самые беспомощные в мире – христиане, и самые неприятные для мира – это мы, православные. И хотя на земле было бы удобнее нам жить не по православному, но мы не можем отказаться от Православия. И всю эту «кашу» – семидесятилетнее господство необычайной ненависти ко Христу со стороны марксистов – было дано пережить Русской Церкви. Мы ясно видим, что марксисты не понимали того, что они делают, подобно распинавшим Христа, о которых Господь молился Отцу: «Отче, прости им, ибо не знают, что они делают»[138].'
        cn: 我们私下谈论此事，并非旨在回应那些对启示有不同理解之人。我们心怀沉重与苦涩，但我们饮下这杯，如同基督亲自所饮的杯。世上最无助的是基督徒，而世上最令人生厌的，是我们东正教徒。尽管在这世上，若不以东正教徒的方式生活，对我们而言会更加舒适，但我们无法舍弃东正教信仰。而所有这番「乱局」——马克思主义者对基督非比寻常的仇恨长达七十年的统治——俄国教会蒙受了经历这一切的命运。我们清晰地看到，马克思主义者并不理解他们正在做的事，就像那些钉死基督的人一样，主曾为他们向父祷告说：「父啊！赦免他们；因为他们所做的，他们不晓得。」[138]
  - type: heading2
    text:
      ru: 'Беседа 15: Сила помысла и обладание над ним[139]'
      cn: 讲论十五：意念的力量与对其的驾驭[139]
    children:
    - type: paragraph
      text:
        ru: Мысль – энергия, отражающаяся на жизни всего монастыря. Оfilioque. Об обладании над нашими помыслами для удержания ума в Боге. Живите себя все как одну семью. Ответственность за наши мысли даже при богооставленности
        cn: 思想是一种能量，反映在整个修道院的生活中。Ofilioque。关于掌控我们的意念，以便将心智保持在上帝里面。你们所有人都要像一个家庭一样生活。即使被上帝离弃，我们仍需为我们的思想负责。
    - type: paragraph
      text:
        ru: 'И опять, в присутствии дорогих гостей, слово мое обращается и сегодня к моим братьям и сестрам. И простите меня за то, что в слабости моей, когда у меня нет энергии, слово мое, конечно, может быть довольно тяжким. Но вот о чем я хочу говорить сегодня: всякая мысль, отрицательная или добрая, даже когда мы наедине в келье своей, есть энергия и сила, отражающаяся на жизни всего монастыря. Когда мысль – положительная, когда это – горячая молитва друг за друга и каждого за всех и всех за каждого, тогда крепнут стены монастыря. И наоборот, когда мысли наши идут отрицательным путем и вместо любви мы осуждаем брата нашего, тогда рождаются в стенах монастыря трещины и все разваливается.'
        cn: 再次，在各位尊敬的宾客面前，我的话语今天也转向我的弟兄姊妹们。请原谅我，因为在我的软弱中，当我缺乏精力时，我的话语，确实，可能相当沉重。但今天我想要谈论的是：每一个念头，无论是消极的还是良善的，即使我们独自在自己的修道室里，都是一种能量和力量，反映在整个修道院的生命之上。当念头是积极的，当那是为彼此、每个人为众人、众人为每个人的热切祷告时，修道院的墙垣便会得以坚固。反之，当我们的念头走向消极的道路，我们非但不爱反而论断我们的弟兄时，修道院的墙垣内便会产生裂痕，一切都瓦解。
    - type: paragraph
      text:
        ru: Итак, «сподоби, Господи, в день сей без греха сохранитися нам», то есть не иметь ни одной греховной мысли.
        cn: 所以，«求祢，上主，使我们今日得以保守无罪»，也就是说，没有一丝一毫的罪恶思想。
    - type: paragraph
      text:
        ru: 'Возьмем такой случай наших дней. Обретены были мощи святого Серафима Саровского. Полтора века назад он молился в пустыне на камне. И до сих пор его молитва действует. Отсюда, естественно, рождается в нас вопрос: куда идет каждая наша мысль? Каких пределов достигает она? – Господь говорит в Евангелии: «Небо и земля прейдут, словеса Мои не прейдут». Вот пример Серафима Саровского – он кричал к Богу только за себя самого: «Боже, милостив буди мне, грешному!», но по последствиям мы видим, что молитва его имеет космические влияния на всю историю человеческого бытия. Через сто пятьдесят лет и больше она продолжает действовать и возбуждать в миллионах душ радость воскресения.'
        cn: 让我们看看当今的一个事例。圣塞拉芬·萨罗夫斯基的圣髑被发现了。一个半世纪前，他在旷野中磐石上祷告。直到如今，他的祷告依然在起作用。由此，我们自然会产生疑问：我们的每一个思想都去向何方？它能达到怎样的界限？——主在福音书中说：「天地都要废去，我的话却永不废去。」(马太福音 24:35) 这就是塞拉芬·萨罗夫斯基的例子——他只为自己向上帝呼喊：「上帝啊，怜悯我这个罪人吧！」然而从结果来看，我们看到他的祷告对人类生存的整个历史都产生了宇宙性的影响。经过一百五十年甚至更久，它依然持续发挥作用，并在千百万灵魂中激发起复活的喜乐。
    - type: paragraph
      text:
        ru: 'А куда идут наши мысли? – Вот, у Н. Гоголя есть повесть о старосветских помещиках, мысль которых не перешагивала через ограду их имения. А наша мысль – перешагивает ли пределы нашего монастыря? Или идет куда-то дальше пределов и даже до беспредельности? Если мы осознаем важность факта нашего мышления, то, конечно, мы будем проводить нашу монашескую жизнь с большой осторожностью. Молитва Серафима – «Боже, милостив буди мне, грешному!» – уже полтора века потрясает мир. Сколько людей хотят носить его имя! А ведь он как будто бы боролся только за свое спасение: «Боже, милостив буди мне, грешному».'
        cn: 那么，我们的思想会去往何处呢？你看，果戈理有一篇关于旧式地主的小说，他们的思想从未逾越自家庄园的围墙。那么我们的思想呢？它是否跨越了我们修道院的界限呢？还是去往了那些界限之外更远的地方，甚至达到了无边无际的境地呢？如果我们能够意识到我们思想事实的重要性，那么，我们当然就会极其谨慎地度过我们的修道生活。塞拉芬的祷词——「上帝啊，求祢怜悯我这个罪人！」——已经震动了世界一个半世纪之久。多少人渴望承继他的名号！然而他似乎仅仅是为他自身的救赎而奋斗：「上帝啊，求祢怜悯我这个罪人」。
    - type: paragraph
      text:
        ru: 'Другой пример: блаженный отец наш, великий старец Силуан. Он рыдал больше, чем за самого себя, молясь за всего Адама. Силуан пишет: «Когда я умру, то умолю Господа за весь христианский мир», и дальше: «Но, если я увижу Лицо Господа Бога Безначального, я забуду про мир», и опять: «Когда умру и явлюсь пред Лицо Христа, умолю Его за весь мир»[140]. Из этих слов вы видите, куда шла его мысль. И я не сомневаюсь, что энергия его молитвы так же отражается в космических судьбах всего мира, как отражалась молитва Серафима Саровского,Антония Великогоили любого другого святого. Ощущаем ли мы его энергию и мысль, идущую до последних пределов, или пропускаем это без внимания? Поскольку человек создан по образу Бога-Абсолюта, то, как мы видим из примеров, которые я привел, человеческая мысль может идти страшно глубоко. Когда мы получаем благодать Духа Святого, то наше слово и мысль идут в беспредельность. А когда Бог оставляет нас с нашими силами, то вдруг наша мысль не идет никуда.'
        cn: 另一个例子是，我们蒙福的教父，伟大的长老西尔瓦。他哭泣，比起为他自己，更是为所有亚当祈祷。西尔瓦写道：「当我离世时，我将为整个基督徒世界恳求上主。」接着说：「但是，如果我得见无始无终之上主上帝的圣容，我将忘记这个世界。」又说：「当我离世并现于基督圣容前时，我将为整个世界恳求祂。」[140]从这些话语中，你们可以看到他的思想趋向何方。我毫不怀疑，他的祈祷之力同样反映在整个世界的宇宙命运中，如同萨罗夫的塞拉芬、大安东尼或任何其他圣徒的祈祷所反映的那样。我们是否感受到他直达极限的能量和思想，抑或我们对此不加留意？既然人是照着绝对的上帝的肖像所造，那么，正如我所引述的例子所见，人的思想可以深邃至极。当我们领受圣灵的恩典时，我们的言语和思想便会迈向无限。而当上帝任凭我们凭借自己的力量时，我们的思想便会突然寸步难行。
    - type: paragraph
      text:
        ru: 'Одно из наиболее трагических событий в истории человечества: раскол христианства на различные исповедания. Наша Церковь учит об исхождении Святого Духа только от Отца, а на Западе говорят: «и от Сына!» – и веками мы разделены. Лично я предпочитаю нашу мысль и оставляю других мыслить, как они хотят. А наша мысль идет за пределы бытия мира и говорит о том, КАК был Бог тогда, прежде создания мира, как исходил Дух Святой и как был Отец единым началом и Сына, и Святого Духа. В Евангелии от Иоанна мы читаем, что по воскресении Своем Господь дунул на учеников Своих и сказал: «Приимите Духа Святого»[141]. Больше того, можно сказать, что Дух Святой действует не только во Христе, но, вселившись во святых Своих, Он действует и в людях. Получается впечатление, что от такого человека, как Серафим Саровский или Силуан Афонский, исходят энергия, действие, любовь Духа Святого. Но в Своем личном бытии ипостасном Дух Святой исходит только от Отца. И это прежде создания мира.'
        cn: 人类历史上最悲剧的事件之一：基督教分裂为不同的宗派。我们的教会教导圣灵仅从父发出，而西方则说：「和子！」——我们因此被分隔了数世纪。我个人偏爱我们的观点，而任由他人按其所愿思考。而我们的观点则超越了世界的存在，论及上帝在创世之前是如何的，圣灵是如何发出的，以及父是子与圣灵唯一的本源。我们在约翰福音中读到，主在复活之后，向祂的门徒吹气，并说：「你们受圣灵」[141]。此外，可以说圣灵不仅在基督里行动，而且居住在祂的圣徒们之中，也在人们里面行动。这样就给人一种印象，仿佛从像塞拉芬·萨罗夫斯基或圣西卢安·阿索斯基这样的人身上，发出圣灵的能力、行动和爱。但在圣灵位格的本有存在中，祂只从父发出。这乃是创世以前的事。
    - type: paragraph
      text:
        ru: 'Если мы остановимся на этих чертах человеческой мысли, то в повседневной жизни монашеской мы будем очень осторожны с каждым движением нашего ума, с каждым движением нашего сердца. Совсем недавно некто из гостей мне сказал: «Вот, я прихожу в храм, и совсем ненужные мысли – кто как одет, ходит или говорит и так далее – часто перебивают всю мою Литургию». Человек образованный, воспитанный, однако не знает он монашеской науки борьбы с помыслом. И мы должны учиться этой борьбе до полного обладания нашим бытием. Но начинаем мы с самых малых вещей. Маленькие повседневные работы ничего не требуют в плане умственном. Копаем ли мы землю в саду, занимаемся ли писанием иконы или служим Литургию и так далее – наша мысль всегда пребывает в Боге. И тогда мысль освящает всю нашу жизнь. Мы поступили в школу, диплом которой мы получим после смерти, а не при жизни. В течение нашей жизни мы не достигаем Абсолюта, но мы мыслим о Нем. И вот это – наша работа повседневная.'
        cn: 如果我们审视这些人类思想的特质，那么在我们日常的修道生活中，对我们心智的每一个动向，对我们内心的每一次触动，都将格外谨慎。不久前，有位客人对我说：「看，我来到圣堂，那些完全不必要的思绪——比如谁穿什么衣服，谁怎么走路或说话等等——常常打断我整个事奉圣礼。」他是个有教养、有修养的人，然而他却不了解修道人对抗意念的学问。而我们必须学习这种争战，直到完全掌控我们的存有。但我们从最微小的事物开始。日常微小的工作在心智层面并不要求什么。无论我们是在花园里挖土，还是绘制圣像，抑或举行事奉圣礼等等——我们的思想总是安住在上帝之中。如此，思想便圣化了我们整个生命。我们进入了一所学校，它的文凭将在我们死后而非生前获得。在我们一生中，我们无法抵达绝对者，但我们思念着祂。这就是我们日常的工作。
    - type: paragraph
      text:
        ru: 'Если мы живем таким порядком, тогда каждый день для нас будет вырастанием и приготовлением к вечной жизни в Боге и с Богом. Так мы можем войти в дух монашества, чтобы и нам быть подобными истинным монахам: прпп. Серафиму, Сергию, Силуану Афонскому, Иоанну Лествичнику, Ефрему Сирину и другим прочим святым и апостолам. Если вы хотите укрепить стены монастыря, молитесь друг за друга и живите всех как одну семью. И таким путем мы поможем братьям нашим и сестрам, которые приходят к нам как гости и сомолитвенники.'
        cn: 如果我们如此生活，那么每一天对我们而言都将是成长与预备，进入在上帝里并与上帝同在的永生。如此，我们就能进入修道精神，好使我们也能像那些真正的修士们：例如可敬的塞拉芬、谢尔盖、阿丰的圣西卢安、阶梯的约翰、叙利亚的以弗所，以及其他众圣徒和使徒们一样。如果你们想要加固修道院的墙垣，就要彼此代祷，并且把所有人当作一个家庭般生活。如此一来，我们就能够帮助我们的弟兄和姊妹，那些以客人和同祷者的身份来到我们这里的人。
    - type: paragraph
      text:
        ru: 'Итак, пожалуйста, помните о величии и человеческого слова, не только Божественного, когда Господь сказал: «Да будет свет» и «бысть свет». Но также и про наше человеческое слово, когда оно попадает в русло слова Самого Христа, мы можем сказать, что все видимое – и солнце, и луна, и земля – прейдет, а слова наши не прейдут. Почему? – Потому что они есть плод живущего в нас Христа. Итак, наша жизнь совсем простая, смиренная и скромная, но это смирение не должно отнимать от нас мысли и разумения о слове Бога. И когда мы осознаем ответственность пред всем человечеством за каждую нашу мысль, тогда мы стоим на верном пути.'
        cn: 那么，请记住人的话语的伟大，不仅是神圣的，当上主说：「要有光」便「有了光」时。但也关于我们人的话语，当它流入基督祂自己话语的河道时，我们可以说，所有的可见之物——太阳、月亮和大地——都将过去，而我们的话语却不会过去。为什么呢？——因为它们是住在我们里面的基督的果实。那么，我们的生活是完全简单、谦卑而朴素的，但这种谦卑不应剥夺我们对上帝话语的思虑和理解。而当我们意识到对全人类的责任，为我们的每一个思想负责时，那时我们便站在正确的道路上。
    - type: paragraph
      text:
        ru: И дай вам Бог силы удержаться на этом монашеском пути и быть ответственными за всякую нашу мысль, за всякое наше слово и даже за всякое движение нашего сердца. Ибо мы без слов можем изводить энергию благодетельную от сердца и без слов можем ранить брата и повредить его жизни.
        cn: 愿上帝赐予你们力量，使你们坚守这条修道之路，并对我们每一个思想、每一句言语，甚至心灵的每一次动念负责。因为我们无须言语，便能从心中发出有益的能量；无须言语，也能伤害弟兄，并损害他的生命。
  - type: heading2
    text:
      ru: 'Беседа 16: Принцип персоны «лицом к Лицу» как основа нашего подвига[142]'
      cn: 第16讲论：『面对面』的位格原则，作为我们灵修操练的基础[142]
    children:
    - type: paragraph
      text:
        ru: Наш подвиг – борьба против смерти в Адаме за жизнь во Христе, Который есть воистину Сущий. О персональной основе нашего подвига – «лицом к Лицу». «Верую» – не абстракция, а личное ведение, синтез которого в имени Христа. О сердце и «сердиться». От личного предстояния Богу до восприятия всего Адама. Отпадение от веры из-за технического прогресса. Наше развитие – не через психофизические упражнения, а через заповеди Бога, чтобы усвоить Его Жизнь. Проблема персоны решена в Евангелии
        cn: 我们的苦修，是在亚当里反抗死亡，为的是在基督里的生命，祂是真正那「自有永有者」。关于我们苦修的个人基础——「面对面」。「我信」并非抽象概念，而是个人的认识，其综合体是在基督之名里。关于心以及「生气」。从个人在上帝面前的侍立，直到接纳整个亚当。因为技术进步而离弃信仰。我们的发展并非通过身心练习，而是通过上帝的诫命，为了领受祂的生命。位格问题在福音中得以解决。
    - type: paragraph
      text:
        ru: Мы благодарны Господу, Который нас сподобил собраться вновь воедино во Имя Его...
        cn: 我们感谢主，祂使我们蒙恩得以再次合一地奉祂的名聚集。
    - type: paragraph
      text:
        ru: 'Сегодня мое внимание обращено на то, что является исключительно характерным для нашей христианской веры. Согласно откровению Бога о Себе Самом, которое лежит в основе нашей веры, Он единственный есть воистину «Сущий» (греч. – «ΕΓΩ ΕΙΜΙ Ο ΩΝ», фр. – «Je suis Celui Qui suis»; англ. – «I AM THAT I AM»). И кроме Него никого и ничего не было, как и дальше, чем Он, никого нет, согласно пророческому слову[143]. Итак, Он есть единственный Творец всего видимого и мыслимого мира. И без Него, по выражению Евангелия от Иоанна, «ничтоже бысть еже бысть». В Нем – жизнь человека. Это положение является самым главным моментом нашей веры, постигнуть которое нам необходимо. Откровение говорит о том, что мы дети первого Адама, нарушившего завет любви между Богом Отцом и человеком. Иногда люди пытаются своим умом постигнуть, почему Господь допустил рядом с древом жизни нетленной стоять древу познания добра и зла. Процесс создания нетленных богов, друзей-братьев Христа, является тайной для нас. И не нам судить, почему, но мы останавливаемся вниманием на фактах: это есть так. Адам нарушил союз с Богом. И так как нет другого источника жизни, то, конечно, после грехопадения в человеческом роде начала действовать смерть. Апостол Павел говорит: «Единым человеком пришел в мир грех и все его последствия; и единым Христом пришло спасение»[144]. В чем состоит спасение во Христе? – Ослепленные грехом, мы стали ходить во мраке неведения, после того как отпали от единения с Богом. И теперь весь наш подвиг сводится к тому, чтобы грех, который является нарушением любви Отчей, был бы отнят от нас и взамен смерти была бы дана нам Жизнь Самого Бога, согласно плану Бога о человеке. Итак, борясь со всяким проявлением греха в нас, мы боремся за то, чтобы освободиться от последствий смерти. Мы веруем в Бога, Который сказал: «АЗ ЕСМЬ СУЩИЙ» и Который есть Бог персональный. В Нем жизнь, в Нем все. И вне Его все существует только по Его благоволению.'
        cn: '今天我的注意力集中在我们基督教信仰所独有的特点上。根据上帝关于祂自己的启示，这启示构成了我们信仰的基础，祂是唯一真正「自有永有者」（希腊语：「ΕΓΩ ΕΙΜΙ Ο ΩΝ」，法语：「Je suis Celui Qui suis」；英语：「I AM THAT I AM」）。而且除了祂以外，过去没有任何人、任何事，将来也没有任何比祂更超越的存在，正如先知所言[143]。如此，祂是所有可见与可思世界的唯一的创造者。并且，正如约翰福音所言，「凡受造的，没有一样不是借着祂造的」。在祂里面，有人的生命。这一论点是我们信仰最核心的要点，我们必须领悟它。


          启示告诉我们，我们是第一个亚当的子孙，他破坏了上帝圣父与人之间的爱之圣约。有时人们试图用自己的理智去理解，为什么上主允许不朽的生命树旁立着善恶知识树。创造不朽的诸神、基督的友伴和弟弟兄的过程，对我们来说是一个奥秘。并且，我们无权判断缘由，但我们专注于事实：它就是如此。亚当破坏了与上帝的盟约。并且，由于没有其他生命之源，所以，当然，在人类堕落之后，死亡便开始在人类中运作。使徒保罗说：「罪因一人进入世界，及其一切后果；救恩因独一的基督而来。」[144]


          基督里的救恩是什么？——我们被罪蒙蔽，在与上帝的合一中堕落之后，便在无知的黑暗中行走。而现在我们所有的属灵操练都归结于：那作为违背父之爱的罪，能够从我们身上被夺走，并取代死亡，上帝自己的生命能够赐予我们，这都符合上帝对人的计划。如此，我们与自身中一切罪的显现争战，乃是为了争取从死亡的后果中获得自由。我们信奉上帝，祂曾说：「我就是自有永有者」，并且祂是位格化的上帝。在祂里面有生命，在祂里面有万有。并且，在祂之外，万物的存在只凭祂的恩慈和旨意。'
    - type: paragraph
      text:
        ru: 'Когда мы проводим дни наши, как подобает тем, кто живут в монастыре, – в покаянии, то всякий подвиг, все усилия с нашей стороны будут направлены к тому, чтобы не совершать греха. Но это еще «негативные» действия: мало того, чтобы мы не совершили греха, – надо, чтобы Сам Бог «пришел и вселился в нас», чтобы Он жил в нас и составлял нашу жизнь.'
        cn: 当我们度日，如同那些住在修道院的人那样——在忏悔中，那么我们所有的苦修，所有我们这边的努力，都将指向不犯罪。但这仍然是「消极的」行动：我们仅仅不犯罪还不够，——还须上帝亲自「降临并居住在我们里面」，祂才能活在我们里面，并构成我们的生命。
    - type: paragraph
      text:
        ru: Почему я останавливаю ваше внимание на этом моменте? – Потому что в наше время существует страшно много нелепых, извращенных путей к Абсолюту, которые приведут, конечно, к еще более глубокой ночи греха и смерти. Нет жизни, кроме Бога. Нет света иного, кроме Бога, Который есть «Свет, в Нем же нет никакой тьмы»[145]. И все наше усилие направлено к тому, чтобы Бог нам даровал Свою жизнь. И для нас, христиан, во всем Учитель и Наставник – Христос.
        cn: 为什么我要提请您注意这一点呢？——因为在我们这个时代，存在着极其多的荒谬、扭曲的通向绝对者的途径，当然，这些途径会引向更加深沉的罪恶与死亡的黑夜。除了上帝之外，再无生命。除了上帝之外，再无其他的光，祂就是「光，在祂里面毫无黑暗」[145]。我们一切的努力，都是为了让上帝将祂的生命赏赐给我们。而对我们基督徒而言，在一切事上，基督就是我们的导师和训诲者。
    - type: paragraph
      text:
        ru: 'Мы сейчас пели молитву ко Святому Духу, «Сокровищу благих», «Жизни нетленныя подателю»: «прииди и вселися в ны». Слово Отчее, пришедшее к нам во плоти, и Дух Святой, сошедший в огненных языках на апостолов и на нас, верующих, есть Бог личный, а не какое-то безличное космическое явление вообще. Поэтому нельзя склониться к тому, чтобы взять просто натуру человека, как она есть, и посредством тех или иных упражнений и медитаций развить способности этой природы. У нас нет этой цели: сей путь не приводит ко спасению. В нашей установке молитвенной мы всегда предстоим как персоны пред Персоной Бога. И этого не должно потерять нам. Господь сказал: «Вы не можете творить без Меня ничего»[146]. Почему? – Потому что в Нем заключено наше бытие вечное, в Нем же и силой Его наличествует в нас и временное бывание, то есть наше видимое и ощутимое существование. Все от Него. И всегда наша установка должна быть персональной, что сказывается в Символе веры, где Отцы дали краткое изложение основ ее.'
        cn: 我们方才咏唱了献给圣灵的祷文，献给「万善的宝藏」、「不朽生命的赐予者」的祷文：「来，居我心间」。圣父之道，以肉身降临于我们，以及圣灵，以火焰的舌头降临于使徒和我们这些信徒——祂们是有位格的上帝，而非某种普遍的、无位格的宇宙现象。因此，不能倾向于仅仅取人之本性，原原本本地，并借由这样或那样的练习和冥想，来发展这本性的能力。我们并无此目标：此路不导向救赎。在我们的祷告姿态中，我们总是作为位格，侍立于上帝的位格面前。我们不应丧失这一点。上主曾说：「离了我，你们什么也不能做」[146]。为何？——因为我们的永恒存在，皆蕴藏在祂之内；在祂之内，也藉祂的大能，我们才拥有暂时的此在，亦即我们可见可感的存在。万有皆源于祂。并且，我们的根本姿态应当始终是有位格的，这体现在《信经》之中，教父们在那里给出了其基本要义的简要阐述。
    - type: paragraph
      text:
        ru: 'Символ начинается словом «Верую...». Обратите внимание на замечательное явление: немы веруем– то есть все, «вообще». Нет! но я говорю Богу:«Веруюво Единого Бога Отца...». И если мы говорим это сознательно, то все прочие слова этого Символа мы должны носить как наше личное ведение. Каждый из нас, человек, почтен как полный образ Бога. И каждая персона, каждый человек должен носить в себе все: и Бога, и тварный мир. Когда мы так будем настроены, постоянно, день и ночь, думая о Боге, то у нас все приходит в форму некоторого «синтеза». И этот синтез – в имени Христа: «Господи Иисусе Христе, Сыне Бога Живаго, вземляй грех мира, помилуй нас». Мы призываем Его имя с сознанием нашей персональной ответственности за каждое наше дело и движение сердца. И всякую «теорию» мы должны отклонить: она будет грехом.'
        cn: 信经以「我信...」一词开始。请注意一个奇特的现象：不是我们（全体）相信——也就是说，是所有的人，「普遍地」相信。不！而是我对上帝说：「我信独一的上帝，全能的父...」。并且，如果我们自觉地说出这话，那么这信经所有其余的词语，我们也当作为我们个人的体认来承载。我们每个人，作为人，都蒙受尊崇，拥有上帝的完整肖像。并且，每个位格，每个人都应当在自身之内承载一切：既承载上帝，也承载受造的世界。当我们持守着这种心境，日夜不断地思念着上帝时，那么我们的一切都会进入某种「综合」的形式。而这种综合就在基督之名中：「主耶稣基督，永生上帝之子，除去世人罪孽者，求祢怜悯我们。」我们呼求祂的名，带着对我们每一个行动和内心每一次动念的个人责任意识。并且，我们应当摒弃一切「理论」：因为它将是罪。
    - type: paragraph
      text:
        ru: 'Иногда в исихазме допускается некоторое «отступление» для того только, чтобы объяснить, где сердце или ум. Потому что когда сердце физиологически здорово, то человек не чувствует его: его «нет». Но когда человека раздражить и утомить, то он начинает «сердиться». И тогда он понимает, где у него «сердце». А так, если ребенка спросить:'
        cn: 有时，在静默主义中，允许有某种「偏离」，仅仅是为了解释心或理智在哪里。因为当心脏在生理上健康时，人是感觉不到它的：它「不存在」。但当一个人被激怒并疲惫时，他就会开始「生气」。而那时，他就会明白他的「心」在哪里。而这样，如果问一个孩子：
    - type: paragraph
      text:
        ru: – Где твое сердце?
        cn: – 你的心在哪里？
    - type: paragraph
      text:
        ru: 'Он покажет:'
        cn: 祂将显明：
    - type: paragraph
      text:
        ru: – Здесь.
        cn: – 这里。
    - type: paragraph
      text:
        ru: 'Итак, простите меня, – я снова повторяю: пожалуйста, до последнего дыхания вашего не утеряйте нашей культуры подвига и молитвы православной, то есть – ПОСТОЯННОГО ПРЕДСТОЯНИЯ ЛИЦОМ К ЛИЦУ.'
        cn: 因此，请原谅我，——我再次重复：请务必，直到您最后一息，不要失去我们东正教的苦修与祷告文化，亦即——持续地面对面侍立在祂面前。
    - type: paragraph
      text:
        ru: Задача сия невероятно грандиозна. Нам не приходится удивляться, что многие отпадают от веры во Христа. Это слишком великая вещь. Технический прогресс вовсе не является прогрессом и духовным. Читая наших древних Отцов, мы видим, что они жили Богом гораздо глубже, чем наша современность. Так, технический «прогресс», необходимый для того, чтобы физиологически существовало человечество, не является чем-то «высшим» и по отношению к откровению Бога.
        cn: 此事无比宏伟。我们不必感到惊讶，许多人背离了对基督的信仰。这是一件太伟大的事。技术进步绝非精神上的进步。阅读我们古代的教父们，我们看到他们活在上帝之中远比我们现代要深得多。因此，技术上的「进步」，为了人类生理上的存续所必需的，甚至在上帝的启示面前，也并非是某种「更高」的事物。
    - type: paragraph
      text:
        ru: 'До последнего дыхания мы будем проводить нашу жизнь в сознании, что Бог нас видит, так чтобы ничего у нас не было имперсонального, безличного: никаких психофизических упражнений, которые могут содействовать тому или иному «развитию» в нас. Скажем, спортсмены развиваются физически, ученый человек развивается трудом научным; и можно специально развивать интеллект, можно развивать тело и стать большим спортсменом (но бестолковым человеком). А если мы живем по заповедям Бога, то хотя в нас и может происходить процесс развития интеллектуального и даже физического, но это не наша «техника». Наша культура является следствием нашей веры и молитвы. Постоянное предстояние Богу приведет к тому, что мы будем жить внутренне, постепенно воспринимая жизнь, исходящую от Самого Бога. И в этом наша задача – чтобы жизнь Бога стала нашей жизнью:«His life is Mine»[147].'
        cn: 直到我们最后一口气，我们都将在意识到上帝看见我们的知觉中度过此生，以免我们内里没有任何非位格、无位格的事物：没有任何可能助益于我们内在的某种「发展」的心理生理练习。例如，运动员通过身体锻炼发展，学者通过科学研究发展；并且，人可以专门发展智力，也可以发展身体并成为一名杰出运动员（但却是一个不通事理的人）。但如果我们按照上帝的诫命生活，那么，尽管我们内在可能会发生智力甚至身体的发展过程，但这并非我们的「技巧」。我们的文化是我们的信仰和祷告的产物。持续地侍立在上帝面前将会使我们过内在的生活，逐渐领受那源自上帝自身的生命。而这正是我们的任务——使上帝的生命成为我们的生命：「祂的生命是我的」[147]。
    - type: paragraph
      text:
        ru: 'Нужно предупредить также молодых людей: в наше время многие торопятся страшно быстро достигнуть космического сознания и сверхкосмического, то есть божественного. Наш путь медленный: мы, которые наследуем через родителей наших смерть греховную, перерождаемся не сразу. Как победить эту смерть? Как это ни покажется странным, но метод – стараться провести каждый день без греха – приведет к познанию абсолютного Бога, которое недостижимо человеческой наукой, ибо явится следствием действия Самого Бога. Отсюда, надо быть терпеливым: пять лет – еще мало, десять лет – еще мало, двадцать лет – еще недостаточно, сорок лет – и этого может не хватить, еще надо терпеть и никак не сдаваться. Скучно, но сдаваться не надо.'
        cn: 也需要提醒年轻人：在我们这个时代，许多人急切地、极其迅速地想达到宇宙意识和超宇宙意识，也就是神性意识。我们的道路是缓慢的：我们这些通过我们的父母继承了罪恶之死的人，无法立即重生。如何战胜这种死亡呢？听起来可能有些奇怪，但这个方法——努力做到每天无罪——将引领人认识绝对的上帝，这种认识是人类科学无法企及的，因为这将是上帝亲自作为的结果。因此，必须要有耐心：五年还太短，十年还太短，二十年还不够，四十年——这可能也还不够，还需要继续忍耐，绝不能放弃。这很枯燥，但绝不能放弃。
    - type: paragraph
      text:
        ru: 'Еще раз повторю, чтобы была яснее основная идея сегодняшнего слова: В БОГЕ ПЕРСОНАЛЬНОМ НИЧЕГО НЕТ ИМПЕРСОНАЛЬНОГО. И в нашей жизни по образу персонального Бога мы должны стать персонами, способными носить в себе все: и жизнь космическую, и благодать Бога, то есть жизнь вечную.'
        cn: 我再重复一遍，为了让今天话语的主要思想更清晰：在位格化的上帝中，没有什么是非位格化的。在我们的生活中，按照位格化的上帝的形象，我们应该成为位格，能够承载一切：既包括宇宙的生命，也包括上帝的恩典，也就是永恒的生命。
    - type: paragraph
      text:
        ru: 'Проверяйте себя, чтобы ничего имперсонального не было. Мы должны жить как персоны – ответственные за всякое свое действие, за всякую нашу мысль. И когда придет молитва, которую Господь дал нашему отцу Силуану, тогда человек может сказать: «Ныне в Тебе, Христе, и АЗ ЕСМЬ». Так из совсем маленьких вещей слагается невероятно великий результат, который превосходит границы всего релятивного.'
        cn: 审视自己，确保没有非位格性的事物。我们应当活出位格——为我们的一切行为、我们的一切思想负责。当那祷文来临时，就是上主赐予我们的圣西卢安神父的祷文，那时人便能说：「此刻在祢里面，基督啊，我亦是。」如此，从极微小的事物中汇聚成一个不可思议的伟大结果，它超越了所有相对事物的边界。
    - type: paragraph
      text:
        ru: 'В настоящее время богословы заняты проблемой персоны. И научная психология, и философия заняты той же самой проблемой. Но у нас эта проблема разрешена давным-давно. Каким образом разрешена? – Мы видим Христа, и мы видим Его действия: Он взял на Себя грехи всего мира, молился в Гефсиманском саду, восходил на Голгофу. Вот Человек-Персона! Когда Он говорит: «Дерзайте, Я победил мир»[148], то призывает нас к той же самой победе, которую совершил Он Сам.'
        cn: 目前，神学家们正关注于位格问题。科学心理学和哲学也都关注于同样的问题。但对我们而言，这个问题早就解决了。是如何解决的呢？——我们看到基督，我们看到祂的行动：祂担当了全世界的罪，在客西马尼园祷告，登上髑髅地。这就是人——位格！当祂说：「你们要刚强，我已胜过了世界」[148]时，祂就召叫我们去赢得祂自己所成就的同样的胜利。
  - type: heading2
    text:
      ru: 'Беседа 17: Откровение Бога как основа нашей веры[149]'
      cn: 讲道 17：上帝的启示是我们信仰的基础[149]
    children:
    - type: paragraph
      text:
        ru: Стяжание духовного видения – дар Бога, подаваемый на пути следования Христу. О вдохновении, не знающем умаления. Явление Бога-Персоны Моисею. Уподобиться Богу, стать персонами – конечная наша цель. Отношения с Богом – отношения любви. Отсечение своей воли и смиренное служение в монастыре приготовляет к восприятию благодати Бога. Жизнь без греха по евангельским заповедям подготавливает к восприятию откровения о Боге. Путь святого старца Силуана ко спасению. О любви и единстве во Христе. О свободе самоопределения и последствиях падения Адама. Богоявление нашим отцам и предкам – основа нашей веры. Абсолютная власть Христа вылилась в форму истощания
        cn: 得着神视——是上帝在跟随基督的道路上所赐予的恩赐。论及那永不衰减的启示。上帝位格向摩西的显现。肖似上帝，成为有位格者——是我们最终的目标。与上帝的关系——是爱的关系。弃绝己意并在修道院中谦卑地事奉，使人预备领受上帝的恩典。依循福音诫命的无罪生活，预备人领受关于上帝的启示。圣长老圣西卢安通向救赎的道路。论及在基督里的爱与合一。论及自决的自由以及亚当堕落的后果。上帝向我们的教父及先祖的显现——是我们信仰的基础。基督的绝对权柄以虚己的形式体现。
    - type: paragraph
      text:
        ru: Как всегда, я, конечно, радуюсь встрече с вами. Но чем ближе мой исход, тем горячее мое желание оставить вам, хотя бы отчасти, то, что я, тоже «отчасти», воспринял по дару Божию – от встречи с великим старцем Силуаном.
        cn: 一如既往，我当然很高兴与你们相会。然而，我的离去越临近，我留下给你们的愿望就越炽热——即使是部分地，我从与伟大的长老西路按相遇中，藉着上帝的恩赐，也「部分地」领受到的那些。
    - type: paragraph
      text:
        ru: 'Недавно я получил письмо, в котором протестантский богослов, хорошо знакомый с Православием, вспоминаетблаженного Августина, говорящего своим прихожанам: «Если вы меня попросите указать вам на путь, то я могу вам сказать: это – Иисус Христос. Но дать вам глаза видеть так, как я вижу, – я не в силах. Это есть дело самого Бога». Мы уже говорили, как нам стяжать «духовные глаза», которые бы видели, как увидел Его Павел[150], как увидели Его Петр на Фаворе, Иоанн, Иаков, как другие отцы увидели Его, восходящего на Голгофу, чтобы разорвать клятву грехопадения Адама.'
        cn: '我最近收到一封信，其中一位熟稔东正教的新教神学家，追忆了真福奥古斯丁对他的平信徒们说的话：


          「如果你们要求我指明道路，我可以告诉你们：祂就是耶稣基督。然而，赐予你们眼睛，使你们能像我一样看见，——我无能为力。那是上帝自己的事。」


          我们已经谈过，我们当如何获取「属灵的眼睛」，使它们能看见，像保罗[150]看见祂那样，像彼得、约翰、雅各在他泊山看见祂那样，像其他教父看见祂走向各各他那样，为要撕毁亚当堕落的诅咒。'
    - type: paragraph
      text:
        ru: 'Один из вас спросил меня: «Что есть вдохновение?» – Так, если и пред вами откроется эта картина, то вы узнаете о вдохновении, приходящем из той сферы бытия, где нет умаления. И если сердца ваши воспримут сие вдохновение, оно вас уже никогда не оставит. Мы можем страдать, быть унижены, смиряться недугами, но это видение Христа пребудет с нами как «неизлечимая болезнь». Я говорю «неизлечимая болезнь», потому что любовь ко Христу, которая родится в нашем сердце, – неистощима, но она связана с болью.'
        cn: 你们中的一位曾问我：「何为灵感？」——那么，若此景象也向你们显现，你们就会知晓那灵感，它来自那存在之境，在那里没有衰减。若你们的心领受此灵感，它将永不离弃你们。我们或许会受苦，蒙受屈辱，忍受疾病的折磨，但这基督的异象将与我们同在，如同「不治之症」。我说「不治之症」，因为对基督的爱，那在我们心中诞生的爱，是取之不尽的，但它与痛苦相连。
    - type: paragraph
      text:
        ru: 'Во все века богословы искали слова, которыми можно было бы выразить ясно Откровение Божие, полученное во Христе Иисусе. Церковь всегда живет со Христом, но в разных условиях, поэтому теперь понадобились некоторые другие слова. Так, когда Бог говорит: «Сотворим человека по образу Нашему и по подобию», как нам понять это подобие и образ? До каких степеней оно доходит? И сегодня мы будем говорить об аспекте, который занимает умы и сердца современных богословов: о персоне. Хотя слово «персона» не новое, но нова установка.'
        cn: 历世历代，神学家们都在寻求言语，能够清晰地表达在基督耶稣里所领受的上帝的启示。教会始终与基督同活，但在不同的境况下，因此现在需要另一些词汇。譬如，当上帝说：「我们要照着我们的形象，按着我们的样式造人。」我们该如何理解这样式和形象？它达到何种地步？而今天我们将谈论一个方面，它占据着现代神学家的心思意念：关于位格。尽管「位格」一词并非新词，但其提法却是新的。
    - type: paragraph
      text:
        ru: 'Я хочу дать вам, моим братьям и сестрам, кто начинает жизнь, маленькую схему, которая, может быть, облегчит вам подход к этому великому Откровению об образе и подобии. Открываясь Моисею как «Аз есмь Сущий», Бог положил тем самым начало нашей веры, глубокой веры. Что замечательно в этом Откровении? Бог говорит о Себе: «Я есмь Бытие»; «все, что существует, – все это изошло из Меня». И первое слово – Аз – означает, что Он есть Персона.'
        cn: 我想将这份小小的纲要，给我的弟兄姊妹们，即那些刚开始灵修生活的人，或许能帮助你们更容易地理解这一关于形象与样式的伟大启示。当上帝向摩西启示自己是「自有永有者」时，祂便以此奠定了我们信仰的开端，一种深刻的信仰。这个启示有什么奇妙之处呢？上帝论及祂自己说：「我是那『存在』」；「凡一切存在的，都源于我」。而这第一个字——「我」（Аз）——意味着祂是一个位格。
    - type: paragraph
      text:
        ru: 'Если мы говорим о персоне в ее истоках и в ее вечном бытии, то, конечно, это только Бог, Кто является Персоной. И если Господь сотворил нас по образу Своему и по подобию, то, значит, и мы должны стать подобными персонами, похожими на Него. Это есть наша конечная цель. Если Бог сотворил богов сначала как потенцию, а не как уже актуализированных лиц-персон, то необходим процесс самоопределения с нашей стороны по отношению к Богу: «Скажи нам, как мы можем Тебе уподобиться?».'
        cn: 如果我们谈及位格的本源及其永恒的存有，那么，当然只有上帝是位格。如果上主照着祂的形像和样式创造了我们，那么，我们也就应当成为像祂那样的位格。这是我们的终极目的。如果上帝起初创造「众神」是作为一种潜能，而非已然显现的位格，那么我们就需要对上帝进行一个自我定位的过程：「请告诉我们，我们如何才能与祢相似？」
    - type: paragraph
      text:
        ru: 'На нашей иконе Моисей изображен следуя традиции Церкви – великой традиции, в которой мы хотим пребыть. Внизу вы видите маленькую икону, с Синая, где было явление Бога Моисею в несгораемой купине: «Аз есмь Сущий». Здесь этот момент явления изображен немножко иначе. Если вы посмотрите, на нашей иконе у Моисея запечатлено выражение предельного напряжения к Богу: он как бы замер и видит небесные сферы, внимая тому, что говорит ему Дух: «Аз есмь Сущий»[151].'
        cn: 在我们的圣像上，摩西被描绘成遵循着教会的传统——一项我们希望常存其中的伟大传统。在下方您可以看到一幅来自西奈山的小圣像，那里曾有上帝在燃烧却不焚毁的荆棘丛中向摩西显现，说：「我是自有永有的。」在这里，这个显现的时刻被描绘得略有不同。如果您仔细看，在我们的圣像上，摩西脸上刻画着对上帝极度凝神的表情：他仿佛凝滞不动，看见了天上的领域，聆听着圣灵对他说的话：「我是自有永有的。」[151]
    - type: paragraph
      text:
        ru: 'Отсюда началась наша Церковь и вера. По вере Отцов, это был Христос, Кто сказал: «Аз есмь Сущий». И начал Свое самооткровение, указав на персональный характер Бога. Тем самым Предание исповедует Живого Бога, а не метафизику отвлеченного мышления философа. Отношения наши с Богом – отношения любви. Любовь может принимать многие виды, и мы не сможем за короткий час коснуться всего.'
        cn: 从此处，我们的教会和信仰开始了。按照教父们的信仰，是基督，祂曾说：「我是自有永有的。」并开始祂的自我启示，指出了上帝的位格特征。借此，圣传宣认活的上帝，而不是哲学家抽象思维的形而上学。我们与上帝的关系是爱的关系。爱可以采取许多形式，我们无法在短短一小时内触及一切。
    - type: paragraph
      text:
        ru: 'Картина, открывающаяся во Христе, превосходит все, что знает человек. Подобно тому как родившийся на суше впервые подходит к океану: он не видит концов. Так из этого «океана» мы возьмем маленькой чашкой какую-то долю этой животворящей воды и будем говорить об этой чашечке.'
        cn: 在基督里所显现的图景，超越人所知的一切。如同一个生于陆地之人，首次来到海洋面前：他望不见尽头。因此，我们将从这「海洋」中，用小杯取一小部分赐生命的水，并谈论这小杯。
    - type: paragraph
      text:
        ru: 'Если Бог есть Персона, то как нам быть? Куда стремиться? Как мы можем построить нашу жизнь, чтобы быть чадами Такого Бога? И этот вопрос стоит перед нами в монашеской школе. У нас нет никакой карьеры мира сего, но каждый ищет путей к наиболее глубокому познанию о Боге. И опять вспоминаются чудные слова нашего благословенного великого старца Силуана: «Иной есть царь, иной – патриарх, иной – какой-нибудь деятель, а иной есть простой рабочий-столяр». И Силуан говорит: «И это неважно»[152]. Какой подход у этого человека! Даже о таких положениях, как императора или патриарха, он говорит: «И это ничего не значит... это – послушание в земной жизни. А вся соль в том, что кто больше любит Бога, тот в Царствии Его будет ближе к Богу в силу своей большей любви, а не в силу своего иерархического, социального или церковного положения». Я хотел бы, чтобы это сообщилось нашему сердцу. Наша жизнь простая и скромная. Мы служим гостям, какstaff[153]служителей в отеле; мы служим им и как священники; и когда они принимают слово наше, то служим им словом; мы готовим для них пищу. И все это имеет очень скромный вид. И вся «карьера» наша никуда не выходит. Видите, здесь – стены, и окна – высоко, не долезешь, убежать невозможно!'
        cn: 如果上帝是一位格，那么我们当如何行呢？我们当往何处努力呢？我们又当如何建造我们的生命，好成为这样一位上帝的儿女呢？而这个问题就摆在我们修道学校的面前。我们没有这世上的任何事业，但每个人都在寻求通往对上帝最深刻认识的道路。我们蒙福的伟大长老西路亚那奇妙的话语再次浮现在脑海中：「有人是君王，有人是牧首，有人是某种活动家，而有人则是一位普通的木匠工人。」而西路亚说：「这都不重要。」[152]这人是何等的心态啊！甚至对于皇帝或牧首这样的地位，他也说：「这都不算什么……这只是地上生命中的一份顺服。而所有的精髓在于，谁更爱上帝，谁就在祂的国度里因着自己更深的爱而更靠近上帝，而不是因着其等级、社会或教会的地位。」我希望这番话能够传达到我们的心间。我们的生活简单而朴素。我们服侍宾客，如同旅馆里的staff[153]工作人员；我们也像司祭一样服侍他们；当他们接受我们的话语时，我们就以话语服侍他们；我们为他们准备食物。而这一切都显得非常谦卑。而我们所有的「事业」都止步于此。你们看，这里是围墙，窗户又很高，攀爬不上去，也无法逃离！
    - type: paragraph
      text:
        ru: 'Итак, как мы можем стать персонами, образом персонального Бога? Я все время подчеркивал вам то, чему сам научился: мы начинаем с самых маленьких вещей. Но, когда каждый в своем служении терпеливо делает так, держась установки – сохранить жизнь по заповедям евангельским, – он приготовляет себя для восприятия благодати Бога. Мы есть существа тварные и живем силою, исходящею от Бога Творца, и сами не можем создать этой жизни, из самих себя.'
        cn: 那么，我们如何才能成为位格，成为具有位格的上帝的形象呢？我一直向你们强调我自己所学到的：我们从最微小的事物开始。但是，当各人在其事奉中耐心地如此行，秉持着按照福音的诫命保守生命的意向时，他就预备自己，为了领受上帝的恩典。我们是受造物，并靠着出自创造者上帝的能力而活，我们自己不能从自身创造这生命。
    - type: paragraph
      text:
        ru: 'Причем что характерно (и я хочу это подчеркнуть) – в вопросе спасения, или, по церковной терминологии, в сотериологии нашей христианской, на первом месте стоит не какое-то научное познание – богатое или малое, а этика: наше спасение определяется этическим началом. Мы повторяем молитву на каждый день: «Сподоби, Господи, в день сей без греха сохранитися нам». В этих словах выражается весь смысл нашего предстояния Богу.'
        cn: 尤其值得注意的是（我希望强调这一点）——在救赎问题上，或者，按照教会术语，在我们的基督教救赎论中，居于首位的并非某种——无论是丰富还是微薄的——科学认知，而是伦理：我们的救赎是由伦理原则决定的。我们每天重复诵念这句祷词：「上主，求祢使我们今日得以无罪保守己身。」在这些话语中，表达了我们侍立于上帝面前的全部意义。
    - type: paragraph
      text:
        ru: 'Как мы можем не согрешить? – Когда в плане этическом мы живем согласно с евангельскими заповедями, тогда мы приготовляем себя – и как сердце-любовь, и как мышление-ум – к восприятию откровения от Бога. Непрестанное напряжение – «получить от Бога милость» – должно определять наш характер. Так, на иконе – Моисей, онемелый, смотрит в напряжении... Библия ничего не повествует о пророке в тот момент, а только о Боге, как Он заговорил из огненного куста. Но мы знаем, что Моисей, как и другие пророки, жил в напряженном стремлении узреть Бога, как Он есть. Он искал ответа: «Что есть бытие? Откуда оно? Кто виновник?» – и так далее. И как человек, он не мог создать себе правильного представления о Боге. Но Господь открыл ему: «Аз есмь Сущий» – в ответ на его молитву. – «Да, ныне ты говоришь со Мною, и знай, что бытие все исходит от Меня», – как сказано в Евангелии от Иоанна: «И без Него ничтоже бысть, еже бысть».'
        cn: 我们怎样才能不犯罪？——当我们在伦理层面，依照福音的诫命而生活时，那时我们便预备自己——既是心之爱，也是思之智——以领受来自上帝的启示。一种不懈的努力——即是「从上帝那里获得恩典」——应当塑造我们的品格。正如圣像所示——摩西，缄默无言，神情专注地凝视着……《圣经》在那一刻并没有记载关于这位先知的任何事，而只是关于上帝，祂如何从燃烧的荆棘中发声。但我们知道，摩西，像其他先知一样，生活在一种紧张的渴求中，渴望能得见上帝的本相。他寻求答案：「何为存在？它从何而来？谁是它的肇因？」——诸如此类的问题。而作为一个凡人，他无法为自己建立一个关于上帝的正确认知。但上主回应他的祷告，向他启示：「我是自有永有的」。——「是的，现在你正与我说话，且当知万有皆源于我」——正如（约翰福音 1:3）所说：「凡被造的，没有一样不是借着祂造的」。
    - type: paragraph
      text:
        ru: 'Так, в монашеской школе нашей, очень скромной на вид, по существу, заложено то же стремление: мы хотим устроить нашу жизнь так, чтобы, подобно Моисею, мы все время были в этом состоянии напряжения. Какую бы работу я ни делал – император ли я, патриарх, ученый, столяр или простой рабочий, это не важно, а важно мое устремление к Богу. И это устремление должно быть смиренным, то есть исполненным сознания, что мы сами не в состоянии даже постигнуть Божественного Бытия. Но мы просим Бога: «Открой нам Лицо Свое... Дай мне увидеть Тебя, как Ты есть! Мое сердце влечется к Тебе, но я не знаю Тебя! Итак, дай мне познать Тебя, как Ты есть!» Это есть наша основная жажда: знать нашего Бога.'
        cn: 如此，在我们这所表面上非常简朴，但实质上蕴含着同样心志的修道学校里：我们渴望如此安排我们的生活，以便如同摩西一般，我们始终保持这种灵性上的全神贯注状态。无论我从事何种工作——无论我是皇帝、宗主教、学者、木匠，亦或是普通工人——这都不重要，重要的是我向上帝的奔赴的心志。而这种心志必须是谦卑的，也就是说，充满着一种自觉，即我们自身甚至无法完全领悟神性本体。但我们向上帝祈求：「向我们显露祢的圣容……让我得见祢的本相！我的心渴慕祢，但我却不认识祢！因此，求祢让我认识祢的本相！」这是我们最深切的渴望：认识我们的上帝。
    - type: paragraph
      text:
        ru: 'Как всегда, я говорю с вами, братья мои и сестры, о том, что мне Господь благоволил показать в лице нашего покровителя небесного – великого Силуана. Это явление было не как какой-то удар, подобный молнии, но как великий поток Духа, который постепенно открывался передо мною. Что меня поразило в этом человеке? – Ему было дано видеть, что вне Бога  – нет спасения. И он жил час особого испытания – как неизбежность гибели. И, сокрушенный этим видением, он вошел в храм и сказал: «Господи Иисусе Христе», – и увидел живого Христа! И Христос не сказал ему никаких слов, но сообщил ему Свое, Христово, состояние. И это видение было коротким моментом, мгновением. Если бы оно продлилось, как пишет Силуан, он бы, не выдержав, умер[154].'
        cn: 一如既往地，我的弟兄姊妹们，我与你们谈论上主恩准向我显明之事，借着我们天上主保——伟大的圣西卢安——的形象。这显现并非如雷电般的一击，而是如圣灵的洪流，在我面前逐渐敞开。在这个人身上，什么使我深受震撼？——他蒙允看见，即在上帝之外——无救恩。他曾活在一个特殊的考验时刻——如同灭亡的必然。他被这景象所击垮，走进圣殿，说道：「上主耶稣基督啊」，——并看见了活生生的基督！基督没有对他讲任何话，而是将祂自己，基督的状态，传达给了他。这显现只是短暂的一刻，一瞬间。若是它持续下去，正如圣西卢安所写，他便会因无法承受而死去[154]。
    - type: paragraph
      text:
        ru: Писание говорит, что «мысли Мои – не мысли человеческие, расстояние между Моим мышлением и человеческим безмерно велико»[155].
        cn: 圣经说：「我的思想并非人的思想，我的思维与人的思维之间距离无量之大」[155]。
    - type: paragraph
      text:
        ru: На каком основании дерзаю я говорить о том, что Господь передал Силуану Свое состояние как последствие видения? Господь, единственный Человек на земле, взял на Себя грех всего мира[156]... И Силуан, будучи только что вышедшим из казармы молодым солдатом, стал вдруг молиться за всего Адама, за все человечество – и в пространствах космических, и в длительности веков. Философски это состояние можно как-то усвоить в отвлеченном мышлении, но не как состояние. А то, что было у Силуана – молитва за всего Адама со многими слезами, большими, чем за самого себя, – есть дух Христа, восходящего на Голгофу.
        cn: 我凭什么敢于说，主将祂的境界作为异象的后果传递给了圣西卢安？主，这世上唯一的人，承担了整个世界的罪[156]……而圣西卢安，当时只是一个刚从兵营出来的年轻士兵，突然开始为着全人类的始祖亚当，为着全人类祈祷——无论是在宇宙的广阔空间中，还是在漫长的时间维度里。从哲学上讲，这种境界可以在抽象的思维中某种程度上被领会，但不能作为一种真实的境界本身。但圣西卢安所拥有的——那为着全人类的始祖亚当的祈祷，所流的许多眼泪比为他自己流的更多——正是那登上各各他的基督的灵。
    - type: paragraph
      text:
        ru: И когда нам открывается такой Христос, тогда мы можем, подобно Иоанну Крестителю, узнать в человеческой форме Всемогущего Бога. Но опять-таки говорю, что это восприятие носит характер этический.
        cn: 当这样的基督向我们显现时，我们便能仿效施洗约翰，在人的形体中认出全能的上帝。但我再次重申，这种领会带有伦理性质。
    - type: paragraph
      text:
        ru: 'Иной момент – догматический. И когда мы слышим слова «Да будут все едино, как Мы едино»[157], то что проникает в наше догматическое сознание? – Мы говорим: «Бог Отец, Бог Сын, Бог Дух Святый», и мы же начинаем наше исповедание веры: «Верую во Единого Бога». Это никак не укладывается в формальную логику. Но это логика самого бытия. Триипостасный Бог, но Он один. И человеков множество, но в идее Бога – человек один.'
        cn: 另一个方面——教义上的。当我们听到话语「愿他们都合而为一，正如我们合而为一」[157]，那什么渗透进我们的教义认知中呢？——我们说：「上帝圣父，上帝圣子，上帝圣灵」，而我们开始我们的信仰告白：「我信独一上帝」。这绝不符合形式逻辑。但这是存有自身的逻辑。三位格的上帝，但祂是独一的。人有许多，但在上帝的意念中——人是独一的。
    - type: paragraph
      text:
        ru: 'Когда ученики спорили, где им сидеть на Тайной Вечере (то есть было некое «местничество»), Господь им сказал: «Заповедь новую даю вам, да любите друг друга»[158]. Если мы действительно любим, то любовь, которой мы научились от Бога, – отдает себя в жертву. Христианин, подобно Богу, любит не свысока. (Про Симеона Нового Богослова говорили, что, встречая детей, он кланялся им с истинным почитанием. Так, когда я был во Франции в Сент-Женевьев священником на кладбище, там прислуживал мальчик, сын священника. Ему было всего четыре-пять лет. И я кадил ему с уважением. И он с великим чувством отвечал на это уважение чем-то подобным). Христос не преподал как заповедь: «Да будете вы все едино, как Мы едино», то есть Отец, Сын и Дух Святой. Но это Он выразил Отцу в молитве. И нам открылось бытие особого порядка, которое никак не укладывается в перспективе формальной логики Аристотеля. Там категориями служат отвлеченные понятия. В нашем христианском бытии мы должны перейти на иную логику, где категориями становится то, что открывает нам Бог. И если Бог в Писании говорит: «Сотворим человека по образу Нашему и по подобию», то это не должно выпадать из нашего сознания: Он сказал не «миллиарды людей – толпы», ачеловека... И когда говорит Христос Отцу в молитве: «Как Мы едино», – подчеркивается многоипостасное единство Бога, что Бог все-таки один. И когда нос наш задирается кверху, неплохо вспомнить слова Христа, чтобы контролировать себя, насколько мы далеки от этого состояния.'
        cn: 当门徒们在最后的晚餐上争论他们该坐在哪里时（即存在某种「争位」之态），上主对他们说：「我赐给你们一条新诫命，就是要你们彼此相爱」[158]。如果我们真正地爱，那么我们从上帝那里学到的爱，是将自己献为祭物。基督徒，如同上帝，爱时不居高临下。（人们谈及新神学家西缅时说，他遇见孩童，便向他们鞠躬，带着真诚的敬意。同样，当我在法国圣热讷维耶夫担任墓园司祭时，有一个男孩，司祭的儿子，在那里协助。他只有四五岁。我也向他敬香，带着敬意。而他带着深深的情感，以类似的方式回应了这份敬意。）基督并未将此作为诫命颁布：「愿你们都合而为一，如同我们合而为一」，即圣父、圣子和圣灵。但这乃是祂在祷告中向圣父所表达的。于是，一种特殊秩序的存有向我们显明，这绝不符合亚里士多德形式逻辑的视角。在那种逻辑中，范畴是由抽象概念构成的。在我们的基督徒存有中，我们必须转向另一种逻辑，在其中，范畴成为上帝向我们所启示的一切。如果上帝在圣经中说：「我们要照着我们的形像、按着我们的样式造人」，那么这不应从我们的意识中脱离：祂说的不是「亿万的人——群众」，而是「人」……当基督在祷告中对圣父说：「如同我们合而为一」，这强调了上帝的多位一体性，强调了上帝终究是独一的。而当我们的鼻孔朝天时，不妨回想基督的话语，以便自我省察，我们与这种境界相去何远。
    - type: paragraph
      text:
        ru: Но, вот, сейчас «жмут» меня слова. Сказать вам? – Это великое состояние! Когда оно приходит к человеку в форме благодати, то живется самим человеком как единственно естественное и нормальное состояние. И как будто бы даже не о чем говорить, все так ясно и естественно!
        cn: 但现在，言语『压迫』着我。要告诉你们吗？——这是一种伟大的状态！当它以恩典的形式临到人时，人自身就会体验到这是唯一自然而正常的状态。仿佛甚至无话可说，一切都如此清晰而自然！
    - type: paragraph
      text:
        ru: 'Какой разлад принесло падение Адама! Как трагичны все эти пять с лишним тысяч лет, по преданию, с сотворения Адама и падения его! Господь говорил с Адамом в Раю. Но Адам, почувствовав в себе свободу самоопределения, пал гордостью: «Я сам буду себя строить». И это есть начало «человекобожия», о котором так много говорят люди, и особенно в нашу эпоху: «Отойди, Бога нет! Бог – это человек». Наша вера в том, что мы созданы Богом, а не мы создаем Бога. И в основе нашей веры лежит не философия, как бы гениальна она ни была, а явление (теофания) – Богоявление нашим отцам и предкам. И то, что Господь вложил в сердце одного (скажем, в начале – Авраама), то уже было вложено во все человечество как идея. И эта наша традиция хорошо выражена в ирмосе канона Андрея Критского: «Сей мой Бог, и прославлю Его, Бог отца моего, и вознесу Его».'
        cn: 亚当的堕落带来了何等的分裂啊！根据传统，自亚当受造并堕落以来，这五千多年的时光是何等悲剧啊！上主在乐园中与亚当交谈。然而亚当在自身内感受到自我决定的自由后，却因骄傲而堕落，心想：「我将建造我自己。」而这便是「人神论」的开端，人们多有谈论此论，尤其是在我们这个时代，常说：「走开，没有上帝！人就是上帝。」我们的信仰在于我们是受上帝所造，而非我们创造上帝。我们信仰的根基不在于哲学，无论它多么高明，而在于显现（神显）——上帝向我们的列祖和先祖的显现。上主所赐予某人内心深处的（例如，起初是亚伯拉罕），早已作为一种理念注入了全人类的心中。而我们的这一传统很好地体现在克里特岛的安德烈之正歌的连颂词中：「这是我的上帝，我要荣耀祂；我父亲的上帝，我要尊崇祂。」
    - type: paragraph
      text:
        ru: 'Открывшись как Персона, Бог создает нас по образу Своему и по подобию. То есть мы должны жить подобно тому, как живет Сам Бог. Но начинаем мы в нашей школе монашеской с очень маленького смиренного дела, и дальше – «не подымаем носа». Но это маленькое дело послушания монашеского есть начало нашего спасения. Мы не хотим сделать, как Адам, который захотел вдруг жить по своей воле. Так, отсекая волю нашу с разумом, мы постепенно готовим свой ум и сердце к восприятию того, что выражено в молитве Христа к Отцу: «Да будут все едино, как Мы едино»[159].'
        cn: 以上帝的位格显现，上帝照着祂的形象和样式创造我们。也就是说，我们应当像上帝自己生活那样去生活。但我们是在我们的修道学校中，从一件非常微小而谦卑的事情做起，并且之后——不自高自大。但这件修道上的顺服的微小事情，是我们救赎的开始。我们不想像亚当那样做，他突然想按自己的意志生活。这样，我们用理智斩断我们的意志，逐渐预备我们的心智和心灵，以领受那在基督向父的祷告中所表达的：「愿他们都合而为一，正如我们合而为一一样」[159]。
    - type: paragraph
      text:
        ru: 'Начало нашей веры – «Яхве! Аз есмь Сущий»; после которого Моисей восходит воспринять закон. Хотя закон для нас после Откровения Христа становится уже узким и образ жития персоны-ипостаси не укладывается в его рамках, все-таки закон приготовил людей, способных восприять воплощение Бога. В веках богословы мучаются тем, как объяснить, что Христос есть Бог, Который сотворил весь этот мир. Ибо мы Его знаем как человека, и смиренного человека: Его осудили, Его били, на Него плевали, Его ненавидели...'
        cn: 我们信仰的开端——「雅威！我是自有永有者」；此后摩西上山领受律法。虽然在基督的启示之后，律法对我们而言已变得狭隘，且位格化之生命的形象无法被其框架所容纳，然而，律法仍然预备了能够领受上帝降世成人的人们。历代的神学家都为此而困扰，即如何解释基督是创造这整个世界的上帝。因为我们认识祂是人，一个谦卑的人：祂被判罪，祂被鞭打，祂被人吐唾沫，祂被人憎恨……
    - type: paragraph
      text:
        ru: 'Но вот затем Господь сказал: «Восхожу к Отцу Моему», и заповедал: «Шедше по всей земле, крестите во имя Отца, и Сына, и Святого Духа»[160]. И это есть наша вера. И кроме христианского, нет никакого другого откровения, которое мы приемлем как истинное.'
        cn: 但此后主曾说：「我要升到我的父那里」，并吩咐说：「往普天下去，奉父、子、圣灵之名给他们施洗」[160]。这就是我们的信仰。此外，除了基督教的启示，我们不接纳任何其他启示为真实的。
    - type: paragraph
      text:
        ru: 'Как Бог, сотворивший наше естество, Сам мог облечься в эту форму существования – мы не можем понять. Но, вот, констатировать этот факт мы можем: «Да, Он был во плоти». Некоторые возражают: «Да, но как вы говорите: Он сказал: Дадеся Мне всякая власть на небеси и на земли[161], а мы просим многие вещи у Бога, и Он медлит дать их. И верующие в Него живут стесненные и униженные». В жизни нашего монастыря был приятный случай. Я спросил одного из наших братьев: «Если бы у Вас была абсолютная власть, что бы Вы теперь сделали, когда такая суматоха во всем мире? В России и во многих других странах – коммунизм; во Вьетнаме – война, и так далее». И он мне отвечает: «Если бы я имел абсолютную власть, то не мог бы ее нигде применить, именно из-за ее характера абсолютности». Так, когда мы видим, что Христос наш как будто бы неспособен сделать многое, о чем мы Его просим, то, может быть, это потому, что Он думает, как этот монах: «Если у Меня абсолютная власть и воля, то, вот, Я отдаю Себя на Распятие». Бьют Его по щеке и плюют на Него: «Где же Твоя абсолютная власть?». А власть эта абсолютная выразилась в форме истощания, соответствующего абсолютному Богу.'
        cn: 上帝，祂创造了我们的本性，祂自己怎能穿上这种存在的形体——我们无法理解。但是，我们确实能够肯定这个事实：「是的，祂曾道成肉身。」有些人反驳说：「是的，但正如你们所说：祂曾说：天上地下所有的权柄都赐给我了[161]，然而我们向上帝求许多事，祂却迟迟不肯赐予。祂的信徒也生活得窘迫和受辱。」在我们修道院的生活中，曾发生一个有意思的事件。我曾问我们的一位修士：「假如你拥有绝对的权力，当全世界如此混乱之际，你现在会做什么？俄罗斯和许多其他国家正处于共产主义之下；越南正经历战争，等等。」而他回答我：「如果我拥有绝对的权力，我将无法在任何地方运用它，正是因为其绝对性的本质。」如此，当我们看到我们的基督，仿佛无法成就我们向祂所求的许多事情时，或许是因为祂像那位修士一样思考：「如果我拥有绝对的权力和意志，那么，我就将自己交付于受难于十字架。」人们击打祂的脸颊，吐唾沫在祂身上：「祢绝对的权力在哪里呢？」而这种绝对的权力，则以虚己的形式体现出来，恰与绝对的上帝相称。
    - type: paragraph
      text:
        ru: И да будет Господь милостив к нам и даст нам пребыть в вере христианской до конца, как бы ни было это трудно.
        cn: 愿上主怜悯我们，并赐我们持守基督教信仰，直到终局，无论这有多么艰难。
  - type: heading2
    text:
      ru: 'Беседа 18: Как стать персоной и жить как личностный дух[162]'
      cn: 第18讲：如何成为位格并以位格性的灵而活[162]
    children:
    - type: paragraph
      text:
        ru: 'Сотворение по образу Божию есть становление наше как богоподобных персон. Реализация в нас персонального начала чрез жизнь по заповедям Христа. Богословие школьное и бытийное: как состояние и как молитва. О памяти Божией на всякий шаг. Задача – найти богословско-догматическое выражение опыта прп. Силуана. Как «держать ум во аде» и иных путях. О сравнении с прп.Максимом Исповедником'
        cn: 按照上帝的肖像受造，是我们成为肖似上帝的位格。藉着按照基督的诫命生活，在我们之内实现位格的肇始。学院神学与存有神学：作为一种状态，也作为一种祷告。关于在每一步中对上帝的记忆。任务是为圣西卢安长老的经验找到神学-教义上的表达。如何「将心置于地狱」及其他途径。关于与圣马克西姆宣信者的比较。
    - type: paragraph
      text:
        ru: 'Вновь и вновь я воздаю хвалу Господу, Который мне дает радость общения с вами. Сегодня я вижу и чувствую в моем сердце присутствие гостей, и я вынужден предупредить их, что наши внутримонастырские беседы в настоящий момент адресованы новопришедшим. Мне кажется, вы уже довольно прочно усвоили, что наш путь и вера строится на откровении свыше и никак не является постулатом нашего интеллекта. Бог открылся в Своих Персонах как «Аз есмь Сущий». После этого идет другой момент Откровения: будучи персональным, Бог-Троица ставит пред Собой задачу сотворения человеческого бытия по Своему образу и подобию. Момент сотворения по образу Божию и по подобию значит, что человек есть существо, по природе своей весьма близкое Богу. Наша природа сотворена логически необъяснимым образом: мы приведены в бытие как потенция, а не как уже реализованные существа. И если Сам Христос сказал, что «Бог есть дух»[163], то и человеческая персона должна пониматься как дух. Для сотворения такого «бога» необходимо, чтобы наше существование начиналось в материальном теле. И как мы уже говорили, лучше не задаваться вопросом, «почему» и «как», но можно только констатировать факт. Как, будучи сотворенными как потенция, мы можем стать персонами, подобными Самому Богу? И как можем мы построить наше спасение, актуализируя изначальное желание Бога о нас: «Сотворим человека по подобию Нашему»?'
        cn: 我一次又一次向上主献上赞美，是祂赐予我与你们相交的喜乐。今日，我在心中看见并感受到客人的临在，我不得不提醒他们，我们修院内部的讲论目前是面向初来者的。我想，你们已经相当牢固地领会了，我们的道路与信仰是建立在来自上方的启示之上的，绝非我们智力的某种公设。上帝以祂的位格启示自己为「我是自有永有的」。此后，启示的另一个面向是：圣三一上帝既是个体的（位格性的），便将按祂的肖像和样式创造人类存有作为自己的使命。按上帝的肖像和样式创造的时刻意味着，人是一个其本性与上帝极其接近的生命体。我们的本性以一种逻辑上无法解释的方式被创造：我们以潜能而非已然实现的生命体被带入存在。并且，如果基督亲自说过「上帝是灵」[163]，那么人的位格也应被理解为灵。为了创造这样一个「神」，我们的存在必须始于物质的身体。并且，正如我们之前所说，最好不要追问「为什么」和「如何」，而只能确认这一事实。作为以潜能被创造的我们，如何能成为与上帝本身相似的位格呢？并且我们又如何能构建我们的救赎，实现上帝对我们最初的愿望：「我们要照着我们的样式造人」？
    - type: paragraph
      text:
        ru: Как можем мы стать персонами из таких, каковые мы есть? – Наш путь есть жизнь по заповедям Христа. И божественный характер заповедей открывается нам по мере нашего аскетического стремления воистину стать «богоносными».
        cn: 我们如何才能从我们现在的状态中，成为位格呢？——我们的道路是遵行基督诫命的生活。而诫命的神圣特质，则随着我们苦修的努力，真正成为「背负上帝者」的程度而向我们显明。
    - type: paragraph
      text:
        ru: В прошлый раз мы остановились молитвой нашей на предвечном факте бытия Бога. И Сей безначальный Абсолют благоволил создать нас с целью, чтобы мы вошли в Его вечность как Его дети и Его друзья. Когда мы встречаемся с богословием в условиях богословской школы, то стоит проблема, как в логическом синтезе создать некую непротиворечивую систему, чтобы преподнести откровение Бога.
        cn: 上次，我们的祷告停在了上帝亘古常存的事实上。而这位无始的绝对者乐意创造了我们，目的在于使我们作为祂的儿女和祂的朋友进入祂的永恒。当我们接触神学时，在神学院的语境下，便面临着一个问题：如何在逻辑综合中建立一个不自相矛盾的体系，以呈现上帝的启示。
    - type: paragraph
      text:
        ru: 'Подходить к проблеме богословия можно под разными углами. Первое богословие – детское: «Есть Бог, Боженька». И ребенок ощущает и воспринимает Бога неким образом, который мы уже не помним, давно пройдя этот период. И поскольку Бог создал нашу природу согласною с Его природой, постольку в нас есть особое чувство – интуиция, через которую мы ощущаем прикосновение Божиего Духа.'
        cn: 探讨神学问题可以从不同的角度着手。首先是孩童的神学：「有上帝，有上帝呀。」孩童以某种方式感受并领悟上帝，这种方式我们早已度过那个阶段，因此已不复记忆。既然上帝创造了我们的性情，使之与祂的性情相符，所以我们里面有一种特殊的感觉——直觉，通过这直觉，我们感受圣灵的触碰。
    - type: paragraph
      text:
        ru: Школа монашеская отличается от школы богословской, организованной в исторических условиях жизни мира. Монашество есть особая школа, где каждый день, каждый момент и каждое слово ставятся в связь с бытием Бога чрез жизнь по заповедям Его. И если богословские школы приводят к возможности «научно» выражать содержание Откровения Божия, то в монашеской жизни богословское образование никак не может быть организовано подобно школе.
        cn: 修道学校有别于在世俗生活历史条件下建立的神学学校。修道生活是一种特殊的学校，在这里，每一天、每一刻和每一个词语，都通过遵行祂的诫命而活，与上帝的存有建立关联。如果神学学校使人能够「科学地」表达上帝启示的内容，那么在修道生活中，神学教育绝不能以学校的形式来组织。
    - type: paragraph
      text:
        ru: 'Мы напрягаемся в нашей молитве «дотронуться до одежды нашего Бога», образно говоря, и Бог отвечает на наши движения различно. Нашему покровителю, отцу Силуану, Он открылся в более совершенной форме, чем многим и очень многим академическим богословам! Как будто бы совершенно опрокинутый порядок: вот, человеку открылся Бог с первого момента так, что потом всю жизнь свою он пытался сохранить в духе данное ему откровение без слов. Итак, если для Бога возможно сообщить Себя одному человеку, то, значит, это возможно Ему и с каждым из нас.'
        cn: 我们努力在我们的祷告中，形象地说，是「触碰我们上帝的衣裳」，而上帝以不同的方式回应我们的举动。我们的主保圣徒，司禄盎神父，上帝向他启示自己的形相，比之于许多，甚至非常多的学术神学家，都要更为完美！这仿佛是一个完全颠覆的秩序：你看，上帝从最初的一刻起就向人启示了自己，以至于他随后一生都试图在灵里保守这无言的启示。所以，如果上帝能够向一个人启示祂自己，那么，祂也能向我们每个人启示自己。
    - type: paragraph
      text:
        ru: Создав человека по образу Божию, то есть как существо, которому свойственна свобода в высшем смысле слова, Бог не насилует человека и не делает ничего с ним без самого человека, а бережно присутствует на пути его. И то, что человек способен воспринять, то Бог и дает. Итак, в монастырском бытии мы все-таки ближе подходим к восприятию Бога, чем в логической структуре богословского образования в школах. Наша «школа» идет только по линии соблюдения заповедей Божиих. В этом отличие системы монашеской от системы школьной. В школах разрешается жить как хочешь; достаточно лишь, чтоб ты интеллектуально освоил положения учения. А у нас прежде всего стоит вопрос, как «провести день без греха».
        cn: 按照上帝的形像创造了人，也就是说，是作为一个在最高意义上拥有自由的存在，上帝不强迫人，也不在人自身意愿之外对人做任何事，而是温柔地临在于人的道路上。并且人能够领受什么，上帝就赐予什么。因此，在修道院生活中，我们比在学校神学教育的逻辑结构中更接近于对上帝的领受。我们的「学派」只循着遵守上帝诫命的路线而行。这就是修道系统与学校系统的区别。在学校里，你可以随心所欲地生活；只要你智力上掌握了教义的各项要点即可。而在我们这里，首先要解决的问题是，如何「无罪地度过一天」。
    - type: paragraph
      text:
        ru: Итак, богословие может быть различных форм. Самое первое богословие, начиная с детских лет, есть то, что составляет содержание наших молитв. Процесс развития этого содержания может и должен совершаться в течение всей жизни.
        cn: 所以，神学可以有不同的形式。最初的神学，从孩提时代开始，就是构成我们祷告的内容。这一内容的发展过程可以并且应当在整个人生中得以发展。
    - type: paragraph
      text:
        ru: 'В другом виде богословие есть состояние человека. Вчерашний вечер мы провели с профессором богословия из Греции. Он подчеркивал, что наша вера и жизнь основаны на Откровении, а не на догадках человеческих. Приведя нам маленький отрывок из Евангелия от Иоанна, он замечательно сказал: «Иоанн просторассказывает, и его рассказ для нас – это сплошь Откровение».'
        cn: 从另一个角度看，神学是人的状态。昨晚，我们与一位来自希腊的神学教授共度。他强调，我们的信仰和生命是建立在启示之上，而非人的臆测之上。在向我们引用了一小段约翰福音后，他精彩地说道：「约翰只是在叙述，而他的叙述对我们来说，完全是启示。」
    - type: paragraph
      text:
        ru: 'Одним из наилучших примеров богословия как молитвы является Литургия Василия Великого. Ее анафора – сплошь богословие и все время напряжение молитвы. Но Евангелие от Иоанна – еще более высокое богословие, когда состояние человека уже совпадает с Божественным проявлением. И пример тому – Иоанн Богослов. С богословием такого порядка мы встречаемся в писаниях Святых Отцов: они рассказывают о том, что было дано от Бога. Их богословие не носит характера логически выстроенных терминов. Нет! – Они «рассказывают». И, простите, я тоже поступил так, потому что нет другого пути. В моих книгах я описываю только то, что сам пережил по воле Бога, когда предался этой воле. Видите, я поставил условие: «когда предался этой воле».'
        cn: 最佳范例之一是圣巴西略礼仪，它将神学作为祷告来呈现。其感恩经尽是神学，且始终充满祷告的张力。而《约翰福音》则是更高阶的神学，当人的状态已与神圣的显现相吻合之时。其典范即是圣使徒约翰，神学家。此等层次的神学，我们在圣教父的著作中亦可见到：他们所讲述的，是上帝所赐予的。他们的神学不带有逻辑建构的术语的特征。不！——他们是「讲述」。并且，恕我直言，我也如此行了，因为别无他法。在我的著作中，我只描述那些我自己按照上帝的旨意所经历的，当我顺服于这旨意之时。你们看，我设了一个条件：「当我顺服于这旨意之时」。
    - type: paragraph
      text:
        ru: 'Так, я умолял вас много раз: молитесь друг за друга, соединяйтесь в этом усилии, чтобы каждый из вас имел возможность посвятить как можно больше времени молитве и богословию. Та жизнь, которая начинается с послушания (если это послушание понято должным образом), по виду простая, но раскрывает сердце человека до беспредельности. Когда человек живет по заповедям Божиим, то в нем раскрываются возможности нашей природы: эти возможности не имеют границ. Мы так близки к Богу, настолько родные Ему, что наша жизнь должна была бы быть с самого начала сплошным пребыванием в сфере несозданного Божества. Каждый раз, когда мы не соединены с Богом, мы выпадаем из этого духовного мира и становимся «плотью»[164], в которой Бог не благоволит жить. Мы должны научиться тому, как, делая всякую работу, пребывать в Боге. Строим ли мы здание, где можем собраться для Литургии; приготовляем ли место, где человек может отдыхать; готовим ли ему пищу и так далее, – все эти вещи можно свести до страшной нищеты, и, по существу говоря, они никак не должны мешать пребывать в высшем состоянии богообщения.'
        cn: 所以，我已多次恳求你们：要彼此代祷，并为此努力联合起来，好使你们每个人都能有尽可能多的时间投入到祷告和神学中。那种以顺服开始的生活（如果这种顺服被正确地理解），表面上看似简单，却能将人的心开启到无限的境界。当人按照上帝的诫命而活时，他本性中的各种可能性便会被揭示出来：这些可能性是没有边界的。我们如此亲近上帝，与祂如此亲密，以至于我们的生命从一开始就应该完全停留在未受造之神性的领域中。每一次我们没有与上帝相联时，我们就会从这个属灵的世界中坠落出来，并成为「肉体」[164]，上帝不愿居住其中。我们必须学会如何，在做任何工作时，仍能与上帝同在。无论是建造一栋我们可以聚集举行圣礼的建筑；还是预备一个供人休息的地方；或是为他准备食物等等，——所有这些事，都可以被简化到极端的贫乏，而且，从本质上说，它们绝不应该妨碍我们停留在与上帝相通的最高境界中。
    - type: paragraph
      text:
        ru: Когда мы начинаем действительно бороться за то, чтобы ум наш пребыл в Боге день и ночь, тогда вся наша природа меняется и жизнь наша становится совсем другою. Теперь, когда число братии возросло, от прежних форм организации нашей жизни должны мы перейти к тому, чтобы монашеская жизнь в каждом ее дне рождала бы в нас молитву к Богу, соединяющую нас с Богом воедино.
        cn: 当我们真正开始努力争取让我们的心智昼夜都常在上帝之中时，那时我们整个本性就会改变，我们的生活也会变得完全不同了。如今，随着修士人数的增加，我们必须从过去的生活组织形式，转变为让每天的修道生活都能在我们心中生发出向上帝的祷告，将我们与上帝合而为一。
    - type: paragraph
      text:
        ru: 'Я предлагаю старшим братьям и сестрам задачу – найти богословское выражение тому опыту, который был дан нашему отцу духовному, великому Силуану. Понесем эту жертву. Писаниям старца свойственны некая неопределенность, нестрого отточенные термины, простые выражения: его записки – простой разговор, но в его простых словах заключена невероятно высокая жизнь. Их можно и нужно формулировать уже как догматическое богословие.'
        cn: 我向兄长和姊妹们提出一项任务——为那赐予我们灵性父亲、伟大的圣西卢安的经验，找到神学上的表达。让我们奉献这牺牲。这位长老的著作具有某种不确定性，术语不甚严谨，表达朴素：他的笔记是简单的言谈，但在他朴素的言语中，蕴含着难以置信的崇高生命。现在就可以并且应该将它们形成为教义神学。
    - type: paragraph
      text:
        ru: 'Спасается человек не теоретическим богословием, а посредством моральной, этической жизни, чистой от всякого греха: «Сподоби, Господи, без греха сохранитися нам». А полнота познания возможна в Церкви, и тогда спасение получит более совершенную форму. Господь дал заповедь: «Не ешь от этого древа, потому что когда ты съешь этот плод, то ты смертию умрешь»[165].'
        cn: 人得救并非靠理论神学，而是通过纯净无罪的道德伦理生活：「恳求祢，上主，保全我们无罪。」而完备的认识唯有在教会中方可实现，届时救赎将获得更完善的形式。上主赐下诫命：「不可吃这树上的果子，因为你吃它的日子必定死。」[165]
    - type: paragraph
      text:
        ru: 'Итак, значит, по мере нашего напряжения, каждый день и каждую ночь в нас будут происходить какие-то процессы, не подлежащие контролю, но все-таки осознаваемые нами. И придет момент, когда мы ощутим себя действительно связанными с Богом по самому естеству нашему. «Как, из этой плоти выходя, мы будем существовать как личный дух?» – такое сознание личного духа: вот что надо выработать нам ради спасения. Чем больше вы будете стараться жить по заповедям, тем глубже будет проявляться в нас интуиция присутствия Божия.'
        cn: 因此，这意味着，随着我们的努力，每天每夜在我们里面都会发生一些无法掌控、但我们仍能意识到的进程。并且会有一个时刻，我们会真切地感受到自己按我们自身的本性与上帝真正地连接起来。「我们如何才能脱离这肉身，作为个体之灵而存在呢？」——这种对个体之灵的意识：这正是我们为了救赎所需要培养的。你们越是努力遵行诫命，上帝临在的直觉就会在我们里面越发深刻地显现出来。
    - type: paragraph
      text:
        ru: 'Вы простите мне, но опять-таки я все время «кручусь», ища молитвою слово от Бога. Немного нас, но как-то все по-разному воспринимают мое слово, и нельзя найти беспротиворечивый синтез даже в нашем маленьком кругу. Когда отсутствует эта возможность, тогда мы должны действительно молиться: «В чем дело? Почему в нас живет смерть взаимного непонимания?». Ведь в завершенном спасении у людей, миллиардов ипостасей, будет единая воля. А здесь, как говорилиМакарий Египетскийи некоторые другие Отцы, каждый человек имеет свою волю[166].Арсений Великийговорил, что на небе у всех единая воля, а здесь, на земле, каждый человек «тянет к себе»[167]. Так будем учиться жить по-христиански, и тогда познание Бога придет не интеллектуальным путем, а онтологическим, через саму жизнь.'
        cn: 请您原谅我，但再一次，我总是在「打转」，借着祷告寻求上帝的话语。我们人数不多，但不知为何，每个人对我的话语理解都不同，甚至在我们这个小圈子里，也无法找到一个毫无矛盾的综合。当这种可能性缺失时，那时我们确实应当祷告：「到底是怎么回事？为什么在我们里面存在着互相不理解的死亡呢？」因为在圆满的救赎中，人类，亿万个位格，将会有一个统一的意志。而在此地，正如埃及的马卡里和一些其他教父所说，每个人都有自己的意志[166]。大圣阿瑟尼说，在天上所有人的意志都是统一的，而在此地，在地上，每个人都「为自己着想」[167]。那么，让我们学习以基督徒的方式生活，那么对上帝的认识就会到来，不是通过智力途径，而是通过本体论的方式，通过生活本身。
    - type: paragraph
      text:
        ru: 'Еще я хотел вас попросить: пожалуйста, когда кто-нибудь из наших братьев или сестер отсутствует, молитесь усиленно за каждого отсутствующего, за каждого болящего. Живите, как единый человек.'
        cn: 我还要请求你们：当我们的弟兄姐妹中有人缺席时，请为每一位缺席者、为每一位病患恳切祷告。你们当活得如同一个人。
    - type: paragraph
      text:
        ru: И простите меня. Все-таки, несмотря на всю неорганизованность моего слова, вы пребыли час в этом напряжении.
        cn: 请原谅我。然而，尽管我的话语如此散漫无章，你们仍在这种紧张中停留了一个小时。
    - type: paragraph
      text:
        ru: Итак, «что же нам делать и чего не делать?». – Делать любовь. «И чего не делать?». – Не делать греха. Вот и вся программа.
        cn: 那么，「我们该做什么，不该做什么呢？」——行爱。「那不该做什么呢？」——不犯罪。这就是全部的纲领了。
    - type: paragraph
      text:
        ru: 'Вопрос: Как преподобные Серафим и Силуан жили состояние «Держи ум твой во аде и не отчаивайся»?'
        cn: 问题：圣塞拉芬和圣西卢安是如何践行「将你的心智置于地狱之中，却不要绝望」这一状态的呢？
    - type: paragraph
      text:
        ru: 'Отец Софроний: Вот Вы затронули один из самых высоких вопросов в нашей православной аскетической культуре. До явления ему Господа Силуан в течение одного часа пребывал отлученным от Бога: Бог покинул его. У него есть страшные слова в описании своего состояния: «И мне ясно было, что я вечно погибаю». Это отлучение от Бога было предельным напряжением: это был, как мы говорим по-гречески, «кеносис», а по-русски «истощание». И когда после этого напряжения явился ему Господь, то не сказал ему никакого слова. Но позднее, когда Господь сказал ему: «Держи ум твой во аде», – слово Его имело отношение к тому страшному часу, который предварил видение Христа. И Силуан получил ответ на свое переживание о вечном аде как откровение от Бога вечного спасения. Каждый раз, когда мы отчаиваемся, по существу говоря, мы совершаем грех против любви Отчей. И когда мы так глубоко будем переживать всякий грех, который разлучает нас от Отца, тогда мы будем рыдать за все человечество. И это приблизит нас ко Христу, умирающему на Голгофе. После такой смерти следует воскресение.'
        cn: 索夫罗尼长老：您触及了我们东正教苦修文化中一个最崇高的问题。在上主向他显现之前，西鲁安在一个小时内处于被上帝离弃的状态：上帝离弃了他。他用可怕的言语描述自己的状态：「我清楚地知道，我将永远沉沦。」这种与上帝的隔绝是一种极度的张力：这就是我们希腊语所说的「kenosis」，俄语则称作「истощание」（虚己）。而当这种张力过后上主向他显现时，并没有对他说任何话语。但后来，当上主对他说：「将你的心智置于地狱中」，祂的话语就与那预示基督显现的可怕的一个小时有关。西鲁安对他关于永恒地狱的经历得到了回应，作为来自上帝的永恒救赎的启示。每当我们绝望时，实际上，我们就是在犯抵触天父之爱的罪。而当我们如此深刻地体验到每一个使我们与天父分离的罪时，那时我们就会为全人类哭泣。这将使我们更接近那在各各他山上受死的基督。在这样的死亡之后，便是复活。
    - type: paragraph
      text:
        ru: 'Так, читая Силуана, мы должны понять, почему Господь говорит ему: «Держи ум твой во аде и не отчаивайся».'
        cn: 因此，在阅读西拉恩时，我们应当明白为何上主对他说：「将你的心智置于地狱，切勿绝望。」
    - type: paragraph
      text:
        ru: 'Почему так творит Господь и почему это есть наивысшая степень и наивысшая форма всей культуры аскетической? – Потому что грехопадение, отлучившее нас от единства с Богом, погрузило нас в страсти, и люди стали жить страстями. А когда человек умом пребывает во аде, тогда ни одна страсть не действует в нем: ни гордость, ни тщеславие, ни властолюбие, ни жадность материалистическая, ни плотская жизнь – ничто. Пред человеком – чистый абсолютный мрак, внушающий страшное отчаяние. И Господь говорит ему: «Держи ум твой во аде, который ты познал, но не отчаивайся», потому что в это время человек живет вне греха и страстей. И если он живет так, то он дает Богу место прийти и быть в нем. Господь дал этот опыт блаженному Силуану, когда он переживал вечное отлучение от Бога, вечную гибель.'
        cn: '为什么上主如此行事，以及为什么这是整个苦修文化的最高境界和最高形式？


          – 因为堕落使我们与上帝的合一隔绝，将我们沉浸在情欲中，人们开始活在情欲中。而当人的心智处于地狱之中时，那时没有任何一种情欲在他里面起作用：无论是骄傲、虚荣、权欲、物质贪婪，还是肉欲生活——一概不能。在人面前是纯粹绝对的黑暗，令人产生可怕的绝望。上主对他说：「让你的心智处于你所认识的地狱中，但不要绝望」，因为在此时，人活在罪恶和情欲之外。如果他如此生活，那么他就是让上帝得以进入并居于他里面。上主将这个经历赐予蒙福的西路亚，当时他正经历着永恒地与上帝隔绝、永恒的毁灭。'
    - type: paragraph
      text:
        ru: 'Бог есть огонь, и приближаться к этому огню надо с величайшим смирением. Поэтому будьте осторожны с этим огнем. Для нас состояние, которое дано было жить Силуану, еще далеко не есть реальность. От страдания, которое он – Силуан – пережил, родилось состояние, когда он жил жизнью всего Адама. И это было не философское, а духовное состояние человека. Как мы можем держать ум во аде, подобно тому состоянию, в каком был Силуан? – Мы можем познать это в пределах нашего опыта, когда нас отягощает уныние. При унынии Отцы установили как общее правило – самопорицание: во всем обвинять себя. Это состояние ниже того, о котором мы читаем в житии Силуана. Но это – царский путь, оставленный нам Отцами. Итак, когда что-нибудь плохое происходит, человек говорит: «Это я виноват – если бы у меня не было плохих помыслов и если бы я был исполнен любви Христовой, то этого не было бы». И человек тоскует, печалится за себя и так вырастает постепенно в любви к Богу. Но любовь тех степеней, о которой мы читаем в житии Силуана, – это редкое явление в истории Церкви.'
        cn: 上帝是火，并且必须带着极大的谦卑靠近这火。因此，对这火要小心谨慎。对我们而言，那赐予圣西卢安所体验的境况，仍然远非现实。从他——圣西卢安——所经历的苦难中，诞生了一种境况，那时他活出了全部亚当的生命。并且这不是一种哲学性的，而是一种属灵的人类境况。我们如何才能像圣西卢安所处的境况那样，将心智置于阴间呢？——我们可以在我们的经验范围内认识这一点，当忧郁重压我们时。在忧郁时，教父们确立了一条普遍规则——自我谴责：在一切事上归咎自己。这种境况低于我们在圣西卢安的生平中读到的。但这是教父们留给我们的一条君王之道。于是，当发生一些不好的事时，人会说：「这是我的过错——假如我没有坏意念，并且假如我充满了基督的爱，那么这事就不会发生。」并且人会为自己忧伤、悲痛，并且这样逐渐在对上帝的爱中成长。但我们在圣西卢安的生平中读到的那种程度的爱，在教会历史上是一个罕见的现象。
    - type: paragraph
      text:
        ru: Вот, мы говорим о послушании – простое, маленькое дело; а он переживает послушание совершенно иным порядком. И представьте, что когда он встречается в жизни с грехом в людях, то от молитвы за них он затем переходит ко всему Адаму и молится со слезами исцелить и спасти всего Адама. Философски мы можем лишь немного связать этот переход, но как духовное состояние это живется на опыте, о котором пишет сам Силуан, когда о тех, кто не познал Бога, он рыдал больше, чем за самого себя. Мы легко умом можем догадаться, о чем идет речь, но пребыть в этом состоянии почти полвека – это невероятное явление. И это состояние человека уже приближает его ко Христу, Который восшел на Голгофу не за отдельную нацию, скажем, евреев или греков, но за всего Адама. И именно это состояние свойственно Христу как Богу. В таком состоянии человек начинает разуметь, что значит быть персоною. Если Бог открылся как Персона, то в таком опыте мы можем иметь понятие о персоне. Конечно, имеется в виду персона как идеальный образ и подобие Бога. В человеческих терминах говорить о персоне недостаточно. Когда человек становится персоною по образу воплощенного Логоса Отца, это уже естьобожение.
        cn: 你看，我们谈论顺服——一件简单、微小的事；但他体验顺服的方式却截然不同。并且，想象一下，当他在生活中遇到人们的罪时，他便从为他们祈祷，进而转向了全人类（亚当），并流泪祈求医治和拯救全人类（亚当）。从哲学层面，我们只能稍微理解这种转变，但作为一种属灵状态，这通过经验得以活出，关于这一点，圣西卢安自己写道，当他为那些不认识上帝的人哭泣时，他哭得比为自己还多。我们很容易在理智上猜到所指的是什么，但在这状态中停留将近半个世纪——这是一个不可思议的现象。这种状态已经使人接近基督，祂登上髑髅地（各各他）不是为了某个特定的民族，例如犹太人或希腊人，而是为了全人类（亚当）。而这种状态正是基督作为上帝所固有的。在这样的状态中，人开始明白成为一个位格意味着什么。如果上帝以位格的形式启示自己，那么在这种经验中，我们就能对位格有一个概念。当然，这里所指的位格是作为上帝的理想肖像与样式。用人类的术语来谈论位格是不够的。当人按照父所道成肉身的道（逻格斯）的肖像成为一个位格时，这已经是神化了。
    - type: paragraph
      text:
        ru: Итак, видите, мы так часто говорим о персоне. Началом опыта персоны является молитва за весь мир с глубоким плачем, молитва, которую можно назвать гефсиманской молитвой. Тогда человек понимает, что такое персона. Так что, видите, от телесной плотской формы, от земли взятой, мы видим дух человека, объемлющего в любви всю тварь, носящего внутри себя Бога. Вот состояние будущего века!
        cn: 那么，你们看，我们如此频繁地谈论位格。位格经验的开端是为整个世界带着深沉的哭泣所献上的祈祷，一种可以称之为客西马尼式祈祷的祷告。那时人才能明白什么是位格。所以，你们看，从肉身的、属血肉的形体，从那取自尘土的，我们看到了人的灵，在爱中拥抱整个受造界，并在自身之内承载着上帝。这就是未来世纪的境况！
    - type: paragraph
      text:
        ru: 'Многие полюбили Силуана, но у него есть одно выражение: «Я молюсь за весь мир, за все человечество, но я буду рад, если хотя бы один человек послушает меня и понесет покаяние»[168]. И один студент богословского факультета в Афинах сказал: «Почему Силуан говорит:хотя бы один человек? Может быть, даже еще нет такого человека?». Вот, у этого студента была интуиция, насколько предельно высоко напряжение этой культуры аскетической. Она видит в человеке отражение Божественной Персоны и осуществляет в нас в наивысшей форме образ и подобие Бога.'
        cn: 许多人喜爱圣西卢安，但他有一个说法：「我为整个世界、为全人类祷告，但我会很高兴，如果至少有一个人听从我并悔改」[168]。一位雅典神学院的学生说：「为什么圣西卢安说：至少一个人呢？或许甚至还没有这样的人？」这位学生有一种直觉，关于这种苦修文化的张力达到了何等极致的高度。它视人为神圣位格的映照，并在我们里面以最高形式实现上帝的形象与样式。
    - type: paragraph
      text:
        ru: Будем благоговейно носить в себе слова старца Силуана и знать, о чем идет речь. И тогда мы разумно можем отдать себе отчет, насколько мы еще далеки от того, какими должны быть.
        cn: 让我们怀着敬畏将西路按长老的话语珍藏于心，并深明其义。如此，我们便能明智地省察自身，看我们离应有的样式还有多远。
    - type: paragraph
      text:
        ru: 'Вопрос: А были святые, которые спаслись другим путем и не говорили о том, чтобы «держать ум во аде...»?'
        cn: 难道有圣徒是经由别的途径得救，而未曾谈及「将心置于地狱中……」的吗？
    - type: paragraph
      text:
        ru: 'Отец Софроний: Трудно мне ответить на Ваш вопрос вот почему: Господь сказал: «Аз есмь Путь», а Вы говорите: «Другой путь»... И нет другого пути ко Отцу, как только чрез Христа. Он говорит: «Никто не приходит ко Отцу, кроме как чрез Меня»[169]. Но можно сказать, что многие спаслись, не неся такого подвига, как, скажем, Силуан и другие: через жизнь по заповедям, спокойную и мирную, через неделание зла. Когда я впервые выпустил книгу о старце, еще во Франции, митрополит Серафим сказал: «Ну, какой чудак этот отец Софроний, и что он говорит: «Держи ум твой во аде»?! Надо держать ум наш в Боге, а не во аде».'
        cn: 索夫罗尼长老：我很难回答您的这个问题，原因如下：主曾说：「我就是道路」，而您却说：「另一条道路」……此外，除了藉着基督，没有别的道路能到父那里。祂说：「若不藉着我，没有人能到父那里去」[169]。但可以说，许多人得救了，他们并未承受像西路按长老和其他人那样的苦修：透过遵行诫命、平静安宁的生活，以及不作恶。当我第一次在法国出版这本关于长老的书时，都主教塞拉芬说：「哎呀，索夫罗尼长老真是个怪人，他竟说：「把你的心神置于地狱之中」？！我们应该把心神置于上帝之中，而不是地狱之中。」
    - type: paragraph
      text:
        ru: 'Силуан описывает одного молодого человека, приехавшего с Карпат на Афон. И этот человек сказал: «За мою жизнь я никого не опечалил, не оскорбил». И Силуан, выслушав эти слова, подумал: «Вот, за таких людей Бог хранит землю». Так что внешне пути могут быть разные, не обязательно монашество, но по существу своему другого пути нет: «Если кто хочет спасти душу свою, пусть погубит ее и несет Мой крест»[170]... Говорить иначе трудно. Так, Господь сказал, что верующий в Него берет крест, добавив: «В мире будете скорбны, но дерзайте: Я победил мир»[171]. Почему все мы будем скорбны в этом мире? – Потому что, когда появляется в нас жажда, чтобы любовь Христа царствовала в мире, мы видим обратное. Весь мир страдает, и любовь Христова в этом мире неизбежно страдает: вместо проявления любви – проявления ненависти, отвержения, унижения человека. Так, есть такое парадоксальное выражение: «Хочешь видеть святых – иди во ад».'
        cn: '圣西卢安描述了一位从喀尔巴阡山来到阿索斯山的年轻人。这位年轻人说：「我一生中从未使任何人忧伤，也未曾冒犯任何人。」圣西卢安听了这些话，心想：「看哪，正是为了这样的人，上帝才保全了这片大地。」


          所以，外在的道路可能各不相同，不一定是修道生活，但就其本质而言，别无他途：「若有人愿意救自己的魂，就让他丧掉它，并背负我的十字架吧」[170]……否则很难说。这样，主说过，凡信他的人，都要背负十字架，并补充说：「在世上你们将有苦难，但你们要刚毅：我已战胜世界。」[171]


          为什么我们所有人在这世上都会有苦难呢？— 因为，当我们内心渴望基督的爱能在这世上掌权时，我们所看到的却是恰恰相反的。整个世界都在受苦，基督的爱在这世上也不可避免地遭受痛苦：取代爱的彰显的，是仇恨、拒绝和对人的贬低。于是，有这样一个矛盾的说法：「想看见圣徒吗？去往地狱吧。」'
    - type: paragraph
      text:
        ru: 'Так что внешне можно говорить о множестве путей: на всех путях можно спастись. Но, по существу-то говоря, все-таки путь есть один – это Сам Христос.'
        cn: 所以，从外在而言，我们可以谈论有许多道路：在所有这些道路上都可以得救。然而，从本质上讲，道路终究只有一条——那就是基督祂自己。
    - type: paragraph
      text:
        ru: 'Вопрос: У многих Отцов греческих, например у Максима Исповедника, есть очень изощренные понятия и развита техника логическая... Делали они это для защиты христианского учения от внешней мысли, или это нужно внутренне, для спасения?'
        cn: 问题：许多希腊教父，例如宣信者马格西姆，有非常精妙的概念并发展了逻辑技巧…… 他们这样做是为了保护基督教教义免受外来思想侵害，还是这是内在的，为了救赎所需？
    - type: paragraph
      text:
        ru: 'Отец Софроний: Это нужда и для всякого христианина.'
        cn: 索夫罗尼神父：这对任何一个基督徒而言，也是一种必需。
    - type: paragraph
      text:
        ru: – Но старец Силуан обходится без этих понятий!
        cn: 但长老圣西卢安不用这些概念！
    - type: paragraph
      text:
        ru: 'Отец Софроний: О нет, он говорит о том же, но в других терминах. У Силуана тот же путь, что и у Максима Исповедника. Но Максим Исповедник, когда его били и резали язык, говорил: «Может быть, Господь простит мне грехи мои». Видите, как он принял страдание? Выражаем мы различно, но все-таки жизнь – единая. И то, о чем говорит Силуан, нисколько не ниже того, что говорит Максим Исповедник: это та же высшая сфера...'
        cn: 索夫罗尼长老：哦，不，他说的是同一件事，但用了不同的措辞。圣西卢安所走的道路，与大圣马ксим告白者所走的是一样的。但大圣马ксиm告白者，当他被毒打、舌头被割掉的时候，他说：「或许，上主会赦免我的罪过。」你们看，他是怎样接受苦难的？我们表达的方式不同，但生命终究是合一的。圣西卢安所说的，丝毫不比大圣马ксиm告白者所说的低：这是同一崇高境界……
    - type: paragraph
      text:
        ru: 'Исторически есть необходимость в богословских школах, но для жизни в Боге вечном это необязательно. Силуан не получил никакого образования. Однако Бог нашел путь сообщить ему Свою жизнь, ибо состояние, которое дано было жить Силуану, было состояние Самого Христа. Это видно из его слов: «Иное смирение аскетическое: «я хуже всех», и иное смирение Христово, неописуемое». Люди, изощренные интеллектуально, выразили бы это как релятивное смирение аскетическое и абсолютное смирение Бога. Последнее «неописуемо», его ничем выразить нельзя, но это было реальное состояние, в котором Силуан жил. Он есть действительно дар Божий нашему веку.'
        cn: 从历史上看，神学院是有其必要的，但对于永恒的上帝生活来说，这并非强制性。西卢安没有受过任何教育。然而，上帝寻得了途径将祂的生命传达给他，因为西卢安蒙恩得以活出的那种境况，就是基督自己的境况。这从他的话语中可见：「苦修式的谦卑是一种，那就是『我比所有人都要差』；而基督的谦卑则又是另一种，是无法言喻的。」那些智力超群之人，会将这表达为相对的苦修式谦卑与绝对的上帝谦卑。后者是「无法言喻」的，无法用任何事物表达，但这是西卢安所活出的真实境况。他的确是上帝赐予我们这个时代的恩赐。
    - type: paragraph
      text:
        ru: У Максима был необычайно острый интеллект и поразительная интуиция. Он защищал исповедание двух воль во Христе – против монофелитства. Надо сказать, что все богословие Отцов и христология шли по линии того, чтобы разобраться, каким образом во Христе Божество могло соединиться с человечеством. Первые четыре Вселенских Собора занимались, главным образом, христологией. Так что, преимущественно, богословие первых веков было христологией. Но можно выражать это богословие словами и не жить как состояние; а можно не выражать и жить его.
        cn: 马克西姆拥有非凡敏锐的才智和惊人的直觉。他捍卫了在基督内两重意志的信仰告白——对抗基督一志论。必须指出，所有教父神学和基督论都旨在阐明在基督内神性如何能与人性结合。最初的四次大公会议主要关注基督论。因此，最初几个世纪的神学主要是基督论。然而，人们可以用言语表达这种神学，却并未将其作为一种生命状态而活；而另一些人则可以不表达它，却真正地活出它。
    - type: paragraph
      text:
        ru: 'Я думаю (да простит мне Бог, что я говорю о себе), мне дал Бог к Силуану глубокое благоговение. Я целовал умом землю, по которой он ходил. И, быть может, поэтому он говорил со мною откровенно о том, что скрывал от других. Но мой ум, если хотите, занимал «среднее место»: то, что я слышал от Силуана, у меня прелагалось в догматическом мышлении. Но, конечно, я не пришел в меру ни Максима, ни Силуана.'
        cn: 我想（愿上帝赦免我，因我谈论自己），上帝赐予我对圣西卢安深厚的敬畏。我在心智上亲吻他曾走过的土地。并且，也许因此，他向我坦诚地谈论他向他人隐瞒的事。但我的理智，如果你们愿意，占据着「中间位置」：我从圣西卢安那里听到的，在我这里被转化为教义性思维。但是，当然，我既未能达到马克西姆的境界，也未能达到圣西卢安的境界。
    - type: paragraph
      text:
        ru: 'Люди спасаются этической жизнью, а не гностической. И когда тот человек говорит: «Я никого не оскорбил за мою жизнь», то это этика, а не гносис. Но прочнее, когда к этой этике присоединяется и догматическое разумение.'
        cn: 人们蒙拯救是借着伦理生活，而非灵知生活。当那人说：「我一生中从未冒犯过任何人」，那是伦理，而非灵知。然而，当这伦理与教义上的明悟相结合时，则更为坚实。
    - type: paragraph
      text:
        ru: 'Есть у Силуана слово такое: «А кто не любит врагов, спасение того не достоверно». И Маскаль, богослов англиканский, говорит, что о любви к врагам, как Силуан, никто другой не писал: он не имеет себе параллелей.'
        cn: 圣西卢安有这样一句话：「凡不爱仇敌的，其救赎就不得确实。」 圣公会神学家马斯卡尔说，关于爱仇敌，再没有人像圣西卢安那样写过；他无人能及。
    - type: paragraph
      text:
        ru: 'Господь Сам говорит: «Любите враги и будете подобны и совершенны, как Отец». Любовь к врагам есть уже совершенство Отца. И святые пребывают в этом состоянии. Силуан жил во время коммунистической революции безбожной. Реакцией на гонение, которому подверглась христианская Церковь, был у Силуана великий плач о непознавших Бога. Когда он говорил: «Дай Тебя познать всему миру», туда входили и эти гонители. И если мы перенесем наше сознание в этот план, то он действительно жил совершенной жизнью. Не может человек писать так, как Силуан, если сам не пережил этого: «А кто не любит врагов, спасение того не достоверно».'
        cn: 上主亲自说：「要爱仇敌，这样你们就会像父一样，成为完全的。」爱仇敌就已是父的完全。圣徒们就居住在这种状态中。圣西卢安生活在无神论的共产主义革命时期。对基督教会所遭受迫害的回应，是圣西卢安为那些不认识上帝的人发出的伟大哀哭。当他说：「愿全天下都认识祢」，这些迫害者也包括在其中。如果我们把意识转移到这个层面，那么他确实过着一种完全的生活。如果一个人自己没有经历过这一切，他就无法像圣西卢安那样书写：「凡不爱仇敌者，其救恩不可靠。」
    - type: paragraph
      text:
        ru: Храни Вас Господь.
        cn: 愿主保守您。
  - type: heading2
    text:
      ru: 'Беседа 19: Как преумножить ревность по Богу[172]'
      cn: 第19讲：如何增进对上帝的热心[172]
    children:
    - type: paragraph
      text:
        ru: Богопознание через Откровение. Потенциал персоны в нас. Богословие как воспринятое. «Да будут все едино». Как говорит духовный отец? Как стать преподобными Богу. Как жить единство все-человека. О трех рождениях. О преимуществах киновии. О борьбе с помыслом. Откровение как основа жизни. Молитва обо всем мире как выражение персоны
        cn: '借着启示对上帝的认识

          我们里面的位格潜能

          被领受的神学

          「愿众人都合而为一。」

          神师如何说？

          如何成为肖似上帝者？

          如何活出全人类的合一？

          论三种诞生

          论共生修院的益处

          论与意念的争战

          启示作为生命的基础

          为全世界的祷告，作为位格的表达'
    - type: paragraph
      text:
        ru: 'Вчерашняя беседа касалась очень существенных моментов нашей жизни в Боге. И лучше всего для нас – сознавать наше неведение и возгревать в себе жажду Бога. Мы стоим пред необозримым, безбрежным океаном. И что бы мы ни знали, сколько бы ни накопляли знаний, все это – капля воды из этого великого океана. Мы всегда чувствуем жажду знать Бога лучше, быть действительно соединенными с Ним. Бог – Бытие Безначальное, Творец всего, что существует во всем космическом бытии, и ничто из того, что есть, не имеет самостоятельного бытия, как бытие Самого Бога. Необходимо для нас, чтобы Сей Дух, о котором говорил Господь: «Бог есть дух», сначала Сам открылся нам и дал бы нам познать Себя, как Он есть в Самом Себе.'
        cn: 昨天的谈话涉及了我们活在上帝里的生命中非常重要的方面。对我们来说，最好的就是意识到我们的无知，并在自身中燃起对上帝的渴望。我们正站在一个无边无际、浩瀚无垠的海洋面前。无论我们知道什么，无论我们积累了多少知识，所有这一切都只是出自这浩瀚海洋中的一滴水。我们总渴望更深地认识上帝，真正与祂联合。上帝是无始的本体，是整个宇宙存在中一切存在物的创造者，并且一切存在物中没有一样具有独立的本体，如同上帝自身的本体。对我们来说，有必要让这位灵——正如上主所说：「上帝是灵」——首先亲自向我们显明祂自己，并使我们认识祂在自身中本来的样子。
    - type: paragraph
      text:
        ru: Нет возможности научным путем, то есть организованным логически опытом, дойти до познания законов бытия. Бог не подлежит такого порядка знанию. В начале бытия человека в Раю он говорил с Богом непосредственно. После падения состояние беседы с Богом было прервано, и люди, живущие на земле, не все одинаково способны слышать голос Бога невидимого и безначального. И Бог открывался человеку уже через отдельных личностей – пророков или праведников, и от них человечество воспринимало познание о Боге и, веруя в Его бытие, устраивало свою жизнь соответственным образом.
        cn: 无法借由科学途径，即通过有逻辑组织的经验，达到对存在法则的认知。上帝不属于此类知识的范畴。在人类存在的最初，在乐园中，他直接与上帝对话。堕落之后，与上帝对话的状态被中断了，而生活在地上的人们，并非都能以同样的方式听见那不可见、无始无终的上帝的声音。于是上帝便借着特定的个体——先知或义人——向人启示自身，人类从他们那里领受了对上帝的认知，并信赖祂的存在，从而以相应的方式安排自己的生活。
    - type: paragraph
      text:
        ru: 'Почти два года тому назад я был в очень плохом состоянии здоровья. И тогда, ожидая конца моих дней, помню, я оставил вам мое «завещание». В этом «завещании» я старался кратко, но усердно указать вам на один из самых важных моментов всего нашего бытия: если человек создан «по образу и по подобию» Бытию Божественному, как мы можем применить это в нашей жизни.'
        cn: 将近两年前，我的健康状况非常糟糕。那时，我预料自己来日无多，记得我给你们留下了一份我的「遗嘱」。在这份「遗嘱」中，我力求简明扼要而恳切地向你们指出我们整个生命中最重要的一点：如果人是依照上帝的本性，『照着形像和样式』受造的，我们如何在生活中应用这一点。
    - type: paragraph
      text:
        ru: 'Итак, передо мной сейчас несколько путей говорить. Но почему-то мой ум остановился на мысли, что Бог есть Персона. Один из наиболее важных моментов в бытии всего тварного мира – когда Бог открылся Моисею как Персона: «Аз есмь Сущий»[173]. Если мы «созданы по образу и по подобию» безначального Бога, то что существенного для нас в этом Откровении и как оно отражается или влияет на нашу жизнь?'
        cn: 那么，现在摆在我面前有几种论述方式。然而不知为何，我的心思停留在一个念头上，那便是上帝是一位格者。在整个受造世界的存有中，其中一个最重要的时刻是上帝向摩西启示自己是一位格者，他说：「我是自有者」[173]。如果我们是照着无始上帝的肖像和样式受造的，那么这个启示对我们而言有何实质意义？它又如何反映或影响我们的生命呢？
    - type: paragraph
      text:
        ru: 'Ведь мы рождаемся не как уже готовое совершенное существо, способное познавать Бога, как Он есть, а как потенция, как лист белой бумаги, на котором рукою Бога будет написано познание о Нем. Монастырь и монашеская жизнь и есть школа сего познания Бога: «Сия же есть жизнь вечная, да ведают Тебя, единого истинного Бога, и Егоже послал еси в мир, Иисуса Христа»[174]. «Знать Бога» всем нашим существом – не простая интеллектуальная догадка, нет! – Библейское понятие «знания» есть слияние в самом бытии, а не отвлеченное познание. Так, познание Бога дается чрез пребывание в Нем. И тогда богословие принимает характер рассказа. И библейское Откровение – это рассказ. К сожалению, среди очень многих современных людей: и образованных, и необразованных, теперь распространено мнение об этом Откровении как о некоем «мифе», «сказке». И они думают, что наивно последовать ему и строить жизнь на этой «сказке». Но вот когда мы принимаем это Откровение и строим нашу жизнь на нем, то все меняется.'
        cn: 我们诞生时并非一个已经完备的、能按上帝本相认识祂的完美受造物，而是一种潜能，如同白纸一张，上帝之手将在其上书写对祂的认识。修道院和修道生活正是认识上帝的这所学校：「认识祢——独一的真上帝，并认识祢所差遣到世上的耶稣基督，这就是永生。」[174] 「认识上帝」并非我们整个生命中简单的智力猜测，绝非如此！圣经中「认识」的概念是在存在本身中的融合，而非抽象的认知。因此，认识上帝是通过住在祂里面而赐予的。于是，神学便呈现出叙事性。并且圣经中的启示——也是一个叙事。遗憾的是，在许多现代人中，无论是受过教育的还是未受教育的，现在普遍流行一种观点，认为这个启示是某种「神话」、「童话」。他们认为，追随这个「童话」并以此构建生活是天真的。然而，当我们接受这个启示并以此构建我们的生活时，一切都改变了。
    - type: paragraph
      text:
        ru: Ибо об этом Откровении Господь говорил в Своем пришествии во плоти в мир сей как об истинном познании Бога. Если взять библейское Откровение как принцип-начало всего нашего бытия, то человек становится великим чудом и грандиозным явлением. И если мы осознаем идею Бога о нас, то естественным следствием будет жажда знать Его, жить с Ним, слиться с Ним воедино.
        cn: 因为关于这个启示，上帝在祂道成肉身降临这世上时，曾称其为真正认识上帝。如果我们把圣经的启示作为我们整个存在的原则和开端，那么人就会成为一个伟大的奇迹和宏伟的现象。而且如果我们领悟到上帝对我们的意念，那么自然的结果将是渴望认识祂，与祂同活，并与祂合而为一。
    - type: paragraph
      text:
        ru: 'Очень важный момент: знать о себе – кто мы и что мы. Пред нами – великая задача: стать подобными Богу, Творцу нашему, носителями в себе Божественной вечности. Об этом очень хорошо говорится в тропаре преподобным: «В тебе, Отче, спасеся известно ЕЖЕ ПО ОБРАЗУ...» – мы созданы по образу и по подобию. И дальше говорится, что «презирать надо плоть, заботиться о душе – вещи бессмертной». И потом, по-славянски, кончается этот тропарь поразительно чудным словом: «темже и со ангелы срадуется, преподобне Отче, дух твой». «Пре-подобный» – то есть «весьма подобный» Богу. По-гречески ὅσιος, но я лично страшно люблю славянское слово «преподобный».'
        cn: 至关重要的一点是：了解自己——我们是谁，我们是什么。摆在我们面前的，是一项伟大的任务：变得像我们的造物主上帝一样，在自身中承载着神性的永恒。对此，在敬虔圣徒的赞词中说得非常好：「在你里面，父啊，那照着形像而存的，已然得救，众所周知……」——我们是按形像和样式被造的。接着又说，『应当轻看肉身，关顾灵魂——那不朽的事物。』然后，用斯拉夫语，这首赞词以一个惊人而美妙的词语结束：「因此，敬虔的父啊，你的灵魂也与众天使一同欢欣。」「Пре-подобный」——也就是说，「非常像」上帝。希腊语是 ὅσιος，但我个人非常喜欢斯拉夫语的词语「преподобный」。
    - type: paragraph
      text:
        ru: 'Если мы созданы по подобию, то как нам стать «преподобными», то есть «весьма подобными», Богу? – Это и есть школа монастырская. И, конечно, сердца наши полны ожидания, что все вы, принятые с такою любовью к нам в дом, жили бы этой мыслью: человек, понимаемый как человечество, – один, и жить нам надо, как один человек. Силуан, блаженный и преподобный, говорит, что «брат наш есть наша жизнь»[175]. Молитесь за каждого из братьев! Молитесь до того состояния, когда вам действительно дорог каждый член братства! Что сказать? Я болел сердцем, что не все по-настоящему восприняли мое горячее желание – чтобы вы жили в Боге великом и святом, а не в мелких интересах повседневной жизни.'
        cn: 如果我们是照着上帝的形像被造的，那么我们该如何才能成为「可敬的」（преподобные），也就是「非常肖似」上帝的人呢？——这正是隐修院的学校。当然，我们的心充满着期待，希望你们所有蒙如此深爱被接纳到我们家中之人，都当怀抱这一思想：人，若被理解为全人类，是合一的，而我们应当像一个人那样生活。圣西卢安（Силуан），这位福哉者和可敬者说：「我们的弟兄就是我们的生命」[175]。为每一位弟兄祈祷吧！祈祷直到这样一种境地，就是你们真心珍视弟兄会中的每一位成员！我该说什么呢？我心中痛苦，因为并非所有人真正领会了我热切的愿望——那就是你们当生活在伟大而神圣的上帝之中，而不是被日常生活中琐碎的利益所缠绕。
    - type: paragraph
      text:
        ru: 'В моем «завещании» я говорил о самом интимном желании Христа, которое Он не выразил как заповедь, но о котором Он просил в Своей молитве, обращенной к Отцу: «Да будут все едино, как Мы (то есть Отец, и Сын, и Дух Святый) едино»[176]. Подчеркивая этот момент, я, конечно, думал, что каждое сердце загорится огнем желания уподобиться Христу. Как можем мы, сущие невежды, достигнуть этого, находясь во тьме нашего неведения?'
        cn: 在我的《遗训》中，我谈到了基督最深切的渴望，这渴望祂并未以诫命的形式表达，而是在祂献给父的祷告中祈求的：「愿他们都合而为一，正如我们（即父、子和圣灵）合而为一。」[176] 强调这一点时，我当然认为每颗心都会燃起肖似基督的炽热渴望。我们这些蒙昧无知之人，身处我们无知的黑暗中，又怎能达到这一点呢？
    - type: paragraph
      text:
        ru: В нашей жизни с одной стороны – нельзя торопиться, а с другой – грех потерять время, данное нам для познания Бога, на другие вещи.
        cn: 在我们的生命中，一方面不可仓促，另一方面，将上帝赐予我们认识祂的时间，虚掷于其他事物，则是一种罪过。
    - type: paragraph
      text:
        ru: Сколько раз я говорил вам о моей трудности беседовать с вами. Какой? – Среди вас есть зрелые люди, которые знают все, что я говорю, но есть и новоначальные. И как говорить об этой жизни такому кругу людей?
        cn: 我多少次告诉过你们，我与你们交谈有多么困难。是什么困难呢？——在你们当中，既有已经成熟、明白我所说一切的人，也有初入教者。那么，要如何对这样一群人谈论这种生活呢？
    - type: paragraph
      text:
        ru: Итак, мы решили говорить с новоначальными о совершенстве. Педагогически это в наше время необходимо. Молодые люди, начинающие искать Бога, будучи в Церкви, рассуждают о том, кого иметь им как духовного отца. Все они ищут уже совершенного отца, и это прежде чем сделать что-нибудь действительно существенное. Но когда этот отец говорит им о жизни во Христе, то часто они просто не делают того, что им говорят.
        cn: 于是，我们决定与初学者们谈论全德。从教育学角度来看，这在我们这个时代是必要的。那些开始寻求上帝、身在教会之中的年轻人，思考着他们应该以谁为属灵父亲。他们所有人都已在寻求一位已臻全德的父亲，而这甚至是在他们做任何真正实质性的事之前。但当这位父亲告诉他们关于在基督里的生活时，他们却常常根本不去做那些对他们所说的话。
    - type: paragraph
      text:
        ru: 'С каждым человеком у Бога есть своя особая беседа. Всякое сердце человеческое создано Богом втайне от других. Но о чем может говорить отец духовный? – Никто из благоразумных отцов не скажет: «Я совершенный!». Но все равно на каждом духовном отце лежит долг говорить о том, чтоемудано: что знает духовник, то и говорит. И о чем приходится говорить? – О том, что всякое проникновение в глубинные слои Божественного бытия связано с великим страданием всего нашего существа и прежде всего нашего духа. И когда новоначальным говоришь об этом страдании проникнуть в познание извечного Бога, то они изнемогают. Но все-таки я продолжаю говорить вам с молитвой к Богу, чтобы жажда любви к Нему и познания Его все возрастала. К этому сознанию относятся слова: «Блаженны нищие духом»[177].'
        cn: 上帝与每个人都有其独特的交流。每一颗人心皆由上帝隐秘于他人所造。但属灵之父能谈论什么呢？ – 任何明智的教父都不会说：「我已臻完善！」但即便如此，每位属灵之父仍有责任讲述其所领受的：属灵之父所知的，便宣讲出来。那么，必须谈论什么呢？ – 便是，任何渗透进达神圣存在之深层，都与我们整个存有、尤其是我们的灵的巨大苦痛紧密相连。而当你向初信者讲述这份苦痛，以求渗透进达对永恒上帝的认知时，他们便会感到力竭。但即便如此，我仍持续对你们宣讲，并向祢（上帝）祈祷，愿对祢的爱与对祢的认知之渴望不断增长。这份认知与此话语相关联：「福哉，神贫者」[177]。
    - type: paragraph
      text:
        ru: 'Творя бытие человека по образу Своему и по подобию, Бог повторяет Себя. Нет другого начала в безначальном бытии, кроме нашего Бога, открывшегося нам. Все едино, и Он единое Начало и Принцип всего. Так, чтобы проникнуть в это таинство спасения нашего, я просил вас усердно молиться друг за друга и реализовать в нашем маленьком кругу то, о чем говорит Господь, имея в виду всего Адама: «Да будут все едино, как Отец, и Сын, и Дух Святый едино суть».'
        cn: 当上帝照着祂的形像和样式创造人的时候，祂复现了自己。在无始的存有中，除了向我们启示了的我们的上帝，没有别的开端。万有合一，而祂是万有的唯一开端和本原。如此，为了能够深入我们救赎的奥秘，我曾请你们恳切地彼此代祷，并在我们的小圈子中实践上主所说的，指着全人类亚当而言：「愿一切都合一，正如圣父、圣子和圣灵本为一体。」
    - type: paragraph
      text:
        ru: Когда мы серьезно хотим использовать данную нам жизнь и разумно совершать путь нашего монашеского подвига, необходимо, чтобы сердце наше жаждало Бога. И эта жажда Бога отвлекает внимание наше от маленьких деталей повседневной жизни во плоти. Духом нашим мы все время заняты Богом.
        cn: 当我们认真地想要使用赐予我们的生命，并明智地完成我们修道苦行的道路时，我们的心就必须渴慕上帝。而这种对上帝的渴慕将我们的注意力从肉身日常生活中微小的细节上转移开。我们的灵时时刻刻都专注于上帝。
    - type: paragraph
      text:
        ru: Забота наша – без греха сохранитися в сей час, в сей день, в сию ночь.
        cn: 我们的关切是：在此时辰、在今日、在今夜保守自己无罪。
    - type: paragraph
      text:
        ru: Моя брошюра о монашестве кончается словамиГригория Богослова, что человек рождается от отцов по плоти – это первое рождение. Потом он рождается в Боге. И третий период, по словам сего великого святого, – когда человек сам становится своим отцом. «Стать своим отцом» значит – стать ответственным за всякое свое движение, за всякое слово[178]. Если нам поставлено как заповедь и задание, «любить ближнего, как собственную нашу жизнь», то как мы можем обидеть брата или сестру грубым словом?
        cn: 我的关于修道的这本小册子，以圣格里高利·神学家的话语作结，论及人从肉身的父母而生——这是第一次诞生。随后，他诞生于上帝之中。而第三个时期，依这位伟大圣者所言，是当人自己成为自己的父亲。「成为自己的父亲」意味着要对自己的每一个举动负责，对自己的每一句话[178]负责。若我们被赋予的诫命与任务是「爱邻人如同爱我们自己的生命」，那么我们怎能用粗暴的言语伤害弟兄或姊妹呢？
    - type: paragraph
      text:
        ru: 'Вы помните по книге моей, что когда я сказал блаженному старцу Силуану:'
        cn: 您还记得我的书中所述，当我向蒙福的长者西拉安说时：
    - type: paragraph
      text:
        ru: – Я жалею, что у меня мало сил (да, я был болен малярией) заниматься богословием.
        cn: – 我遗憾我气力不足（是的，我曾患有疟疾），无法研习神学。
    - type: paragraph
      text:
        ru: 'А он ответил:'
        cn: 而他回答说：
    - type: paragraph
      text:
        ru: – Вы почитаете это за великое дело? Велико только одно – смириться, ибо гордость мешает любить[179].
        cn: ——您认为这是件伟大的事吗？伟大的事只有一件——谦卑，因为骄傲阻碍爱[179]。
    - type: paragraph
      text:
        ru: Так, когда мы любим, отбросив всякую гордость и заботясь о нашей общей жизни, тогда от малой группы мы перешагиваем внезапно ко всему человечеству, ко всему Адаму. Эта ступень необходима для нас. В моем «завещании» я говорил вам, что общежитие есть самая удобная дорога ко спасению – даже с богословской точки зрения. Но когда мне дано бывает от Бога любить ближнего и молиться за него, тогда я реально ощущаю в себе присутствие Духа. И Он любезен нам. Мы отдаемся Ему всецело, без сопротивления. И Духом Своим Господь ведет нас к молитве за всего человека.
        cn: 这样，当我们去爱，摒弃一切骄傲，并关怀我们的共同生活时，我们便从一小群人突然跃升至全人类，跃升至所有的亚当。这一步对我们是必不可少的。在我的「遗嘱」中，我曾告诉过你们，共同生活是最便捷的救赎之路——即便从神学角度来看也是如此。然而，当上帝赐予我去爱我的近人并为他祷告时，那时我便真实地感受到圣灵在我里面的临在。祂对我们是如此可亲可爱。我们将自己全然交托给祂，毫无抗拒。上主借着祂的圣灵引导我们为全人类祷告。
    - type: paragraph
      text:
        ru: 'Вот вам путь практический: меня раздражил брат чем-нибудь, и как я могу молиться? – Я могу молиться так, скажем:'
        cn: 这就是一个实际的途径：我的弟兄因某事使我恼怒了，那么我该如何祷告呢？我可以这样祷告，比如说：
    - type: paragraph
      text:
        ru: «Господи Иисусе Христе, подавый мир Твой Твоим ученикам пред восходом Твоим на Голгофу и Пресвятаго Духа дар ниспославый после Вознесения Своего от Отца в наследие нам, неотъемлемое в веках, Господи, дай и нам знать этот Дух».
        cn: 主耶稣基督啊，祢在登上各各他之前赐祢的门徒平安，并在祢升天之后，从父那里赐下至圣圣灵的恩赐，作为我们世代永存、不可剥夺的产业。主啊，也求祢使我们认识这圣灵。
    - type: paragraph
      text:
        ru: 'И умом мы переносимся в духовное состояние Его мира: «Мир Мой даю вам»[180].'
        cn: 我们藉着心智，被带入祂平安的灵性状态中：「我的平安赐予你们」[180]。
    - type: paragraph
      text:
        ru: «Господи, если возможно, а Тебе все возможно, дай всем нам выйти из мрака наших страстей, дай нам не ранить брата, а любить его и давать ему жизнь».
        cn: 主啊，若有可能，而于祢万事皆能，求祢赐我们众人脱离我们情欲的黑暗，求祢赐我们不伤害弟兄，而是爱他，并赐予他生命。
    - type: paragraph
      text:
        ru: И таким путем уходя от малого недоразумения в жизни, вы естественно переходите к молитве за всего человека.
        cn: 循着这样的途径，当你从生活中的细微误解中摆脱出来时，你便自然而然地转向为全人类祈祷。
    - type: paragraph
      text:
        ru: 'Вот вам один из путей, как побеждать малое раздражение. Человек встретился с кем-то, кто порицает его и даже хочет уязвить его, причинить ему вред, напоить его ядом. Как удержаться нам от всякой мести? – Так, как учил нас и учит своим писанием Силуан, – мы молимся за всего Адама: «Мир Твой подавый человекам, еще сый с нами Христе, даждь и нам этот мир». И если вы будете так молиться, то увидите чудо в себе: от состояния гнева и мрака сердце вдруг переходит в состояние любви и молитвы. Пожалуйста, не презирайте этого слова! Применяйте его всегда, и вы увидите результаты!'
        cn: 这里给你们一个方法，如何战胜微小的恼怒。一个人遇见了某人，斥责他，甚至想要伤害他、损害他、给他灌毒。我们如何才能克制自己，不施行任何报复呢？——正如圣西卢安教导我们，并以他的著述教导我们的那样，我们为整个亚当祈祷：「基督啊，祢将祢的平安赐予世人，当祢仍与我们同在时，也求祢将这平安赐予我们。」如果你们这样祈祷，就会在自己身上看到奇迹：心就会突然从愤怒和黑暗的状态，转变为爱与祈祷的状态。请不要轻视这教诲！务要常常运用它，你们就会看到结果！
    - type: paragraph
      text:
        ru: 'Как бороться против плохого помысла? – Молитвой: «Господи, не дай погибнуть никому из нас, всех нас просвети. Ты видишь, как все мы, гонимые и томимые неведением, падаем в грех и преступление. Ты привлеки сердца наши к Себе». Так наша жизнь от самых простых форм может перейти уже в Божественную вечность.'
        cn: 如何对抗恶念？ – 藉着祷告：«主啊，不要让我们中任何一人灭亡，求祢普照我们众人。祢看见我们所有人，如何被无知所驱使和折磨，坠入罪恶与过犯。求祢吸引我们的心归向祢。» 如此，我们的生命便能从最朴素的形式，转化进入神圣的永恒。
    - type: paragraph
      text:
        ru: Наша вера совсем не наивна, как думают многие из современных людей. Когда мы строим нашу жизнь на Откровении, данном нам от Бога, и вождем нашим являются заповеди Христа, тогда, при всем нашем невежестве, мы действуем так, как будто живем во свете всеведения и не претыкаемся во тьме на камни, лежащие на пути... Попробуйте построить жизнь на этих принципах, и вы увидите, что Откровение библейское не есть наивная сказка, но тайна, невыразимая по существу нашим человеческим словом, «человеческим» после падения.
        cn: 我们的信仰绝非天真，不像许多现代人所想的那样。当我们将生命建立在上帝所赐的启示之上，并以基督的诫命为我们的引领时，尽管我们全然无知，我们行事却如同生活在全知之光中，不在黑暗中绊倒在路上的石头。试着将生命建立在这些原则之上，你就会看到圣经的启示并非天真的童话，而是一个奥秘，其本质无法用我们人类的言语表达——那是堕落后的「人类」言语。
    - type: paragraph
      text:
        ru: 'И вот, прошу вас: приложите все силы к тому, чтобы молиться за всех нас. Если мы по невежеству нашему совершаем грехи, то говорим: «Духом Твоим Святым дай нам познать Тебя»[181]. Эта молитва начертана на хартии на иконах Силуана. Выбрал этот текст Успенский, который написал первую икону старца Силуана. У него был богословский ум, и он избрал действительно центральный текст, в котором выражено всеобщее положение, свойственное персоне – преподобному образу Бога. Как реагирует персона, как ее узнавать? Вот мы открываем Евангелие и читаем: «Шедше проповедуйте ВСЕМУ МИРУ, ВСЕМ НАРОДАМ, ВСЯКОМУ ЯЗЫКУ, крестяще их во Имя Отца, и Сына, и Святаго Духа»[182]. Кто живет Духом, тот поймет эти слова не как наивную сказку, а как состояние уже спасенного человека. Старец говорит: «Я стал делать так, как научил меня Господь, и ум мой очистился, и Дух свидетельствовал спасение»[183]. Когда наш блаженный преподобный Силуан учит молиться за весь мир, в его словах отражается то, что он действительно стал персоною, «преподобной» личностью – «подобной», «весьма подобной» Богу-Христу. Попробуйте жить по заповедям Его, возлюбите их, как разумные существа, потому что, когда мы будем хранить заповеди Христа, у нас появится очень тонкая интуиция, что в заповедях Его заключена вечная жизнь и нет ничего более совершенного во всем мире. И когда приходит к нам эта интуиция, мы познаем, что Христос, исторический человек, по существу Своему есть и безначальный Бог. Никаких других доказательств мы дать не можем, но те, у кого была детская вера, перешагнут бездну небытия и войдут в Царство Бога вечного, а наивные ученые нашего века останутся, если не покаются, во мраке неведения.'
        cn: 于是，我恳求你们：竭尽全力地为我们所有人祷告。若我们因自己的无知而犯罪，就说：「愿祢的圣灵使我们认识祢」[181]。这祷文被书写在圣西卢安圣像上的纸卷上。是乌斯宾斯基选择了这段文本，他绘制了圣西卢安长老的第一幅圣像。他心怀神学洞见，确实选择了一段核心文本，其中表达了一个普遍的境况，这境况是属于位格的——即肖似上帝的形像。一个位格如何回应？我们又如何辨认它？我们打开福音书，读到：「你们要去，向全世界、万族万民、各方各语宣讲，将他们奉父、子、圣灵的名施洗」[182]。凡在圣灵中生活的人，就能理解这些话语，不是把它当作一个天真的童话，而是当作一个已经蒙受救赎之人的境况。长老说：「我照着上主所教导我的去行，我的心智便得以洁净，圣灵也见证了救赎」[183]。当我们蒙福的尊者圣西卢安教导我们为全世界祷告时，他的话语反映出他确实成为了一个位格，一个「肖似上帝的」人——「肖似」且「极其肖似」上帝——基督。你们要尝试按祂的诫命生活，并且爱慕这些诫命，如同有理智的受造物一般，因为当我们遵守基督的诫命时，我们就会产生一种极其敏锐的直觉，即在祂的诫命中蕴含着永生，并且在全世界没有任何事物比这更完美。当这种直觉临到我们时，我们就会认识到，基督，这位历史中的人，按其本质而言，祂也是那无始无终的上帝。我们无法提供任何其他证据，但那些拥有孩童般纯真信仰的人，将跨越虚无的深渊，进入永恒上帝的国度，而我们这个时代天真的学者们，若不悔改，则将留在无知的黑暗中。
    - type: paragraph
      text:
        ru: Простите меня, и да хранит вас Господь.
        cn: 请原谅我，愿主保守您。
    - type: paragraph
      text:
        ru: Да будет благословен Бог.
        cn: 愿上帝受赞美。
  - type: heading2
    text:
      ru: 'Беседа 20: О любви, познании и вере[184]'
      cn: 第20讲论：论爱、认识与信[184]
    children:
    - type: paragraph
      text:
        ru: Знать есть любить. Вера в воскресение уже есть воскрешающая энергия. О смертной памяти
        cn: '认识即是爱。

          对复活的信，本身就是使人复活的能量。

          关于忆念死亡'
    - type: paragraph
      text:
        ru: Да будет благословен час сей, когда Господь дает мне радость общения с вами. Мысль моя о том, что вся судьба, вся жизнь и бытие наше – истекают от Вечного Бога. И сам опыт показывает нам, что молитву, которую мы приносим Богу, Он слышит и отвечает нам. Правда, Он отвечает медленнее, чем мы хотели бы, но «не нам Его переделывать». В те минуты, когда Он приходит спасать нас, конечно, мы ощущаем Его жизнь. И характерна для нее жажда знать и любить Его. Когда мы говорим «знать и любить», то это почти одно и то же – в вечности знание есть следствие любви. Любовь же есть производитель соединения с Богом призываемым. И так вся наша жизнь на земле проходит в этом стремлении.
        cn: 愿此蒙福时辰，上主赐予我与你们相交的喜乐。我心思想着，我们一切的命运、生命与存有，皆源自永恒的上帝。且经验本身向我们显明，我们向祂献上的祷告，祂垂听并回应我们。诚然，祂回应的速度比我们所愿的要慢，但「我们不能改造祂」。在祂前来拯救我们的那些时刻，当然，我们感受着祂的生命。而其特征是，渴求认识并爱慕祂。当我们说「认识与爱慕」时，这几乎是同一回事——在永恒中，认识是爱的结果。爱便是与受呼唤之上帝结合的促成者。于是，我们在地上的一切生命，都耗费在这渴慕之中。
    - type: paragraph
      text:
        ru: 'Окружающая действительность налагает на нас свою тяготу. Эта действительность странного порядка: никогда не стоит на месте. Ничто не непоколебимо. Все изменяется. А нам надо искать бытие непреклонное.'
        cn: 周遭的现实将它的重负加于我们。这现实有着奇特的本性：它永不停滞。无物不动摇。万物皆变。而我们当寻求那坚固不移的存有。
    - type: paragraph
      text:
        ru: 'Как возможно воскресение? Где та сила, которая воскресит жизнь, уже растлевшую в могиле? – Отцы наши составили Символ веры, который является руководителем в нашей жизни. Потому повторяем мы на каждый день, на каждую молитву: «Верую во Единаго Бога Отца» и так далее. Из Евангелия мы знаем, что такое вера: она есть животворящая сила, способная воспринять жизнь даже тогда, когда человек разбит болезнями или возрастом. И вот Отцы заключили Символ веры словами: «Чаю воскресения мертвых и жизни будущего века». Я уже говорил вам об этом, но опять-таки все время я толкаюсь молитвою на повторение, чтобы это утвердилось во всех нас. Мы живем Богом нашим во времени: каждый час нашей жизни, в каждом деле, которое мы ни начинали бы, в этих земных переменах, неустойчивости и труде. Из-за навязчивости природы нашей смертной, когда мы живем и постоянно узнаем о смерти близких или далеких нам людей, мы в каком-то смысле все время разлагаемся. И где та созидающая сила? Казалось бы, если мы живем молитвою, то все время должно расти в нас влияние Духа Божия, Жизни непоколебимой. А мы этого не ощущаем – ощущаем только иногда, когда усиливается и углубляется наша молитва. Но вот Символ начинается словом «Верую», «I believe», и кончается словом другого порядка: «чаю – ожидаю воскресения мертвых». И так вера наша переходит в акт уже иного порядка. Я не только верую, но ЖДУ этого. Само это ожидание – «чаю воскресения мертвых» – уже есть энергия, которая непременно и неуклонно нас воскресит. В церковных молитвах об усопших говорится: «В надежде живота вечного усопшие». И характерно для христиан умирать, чтобы реализовать то, ради чего мы созданы, то есть ради жизни, подобной Самому Богу. Я утомляю вас, повторяясь, но не жалею об этом, ибо надеюсь, что постоянное и разумное повторение все-таки даст нам ощутить, что именно сия энергия – как власть воскресить из мертвых – выражается в слове «чаю». Так мы действительно будем разумно стяжевать в себе эту энергию несозданную. «Несозданную» означает, что по природе своей она принадлежит вечному Богу и сама является вечным Бытием. В нашем видении Бога все, что нетварно, принадлежит Божественному порядку, а все, что сотворено, тоже принадлежит Богу, но в порядке творения. И это творчество является процессом, который мы называем «временем». В конечном осуществлении нашей жизни времени больше не будет, и содержание ее изменится, исполнившись бесконечной силою жизни Самого Бога. В Символе веры говорится о тех действиях, которые предпринял Господь и Бог наш ради нашего спасения – «нас ради человек и нашего ради спасения сшедшего с небес».'
        cn: 复活何以可能？那将已在坟墓中腐朽的生命复活的能力何在？——我们的教父们撰写了信经，它是我等生命中的指引。因此，我们每日、每次祷告时都重复：「我信独一上帝父」，等等。我等从福音中得知信德为何：它是赐予生命的能力，即使当人被疾病或年岁摧残时，亦能领受生命。而教父们以这些话语结束了信经：「我盼望死人复活，并来世的生命。」我已向你们提过此事，但祷告总是敦促我不断重复，好使这真理在我们所有人心中确立。我等凭着我们的上帝活在时间中：在我们生命中的每个时刻，在我们所开始的每一件事中，在这些世俗的变迁、无常和劳苦中。由于我们必朽本性的纠缠不休，当我们活着并不断得知亲近或疏远之人的死亡时，我们都在某种意义上不断地朽坏。那创造性的能力何在？似乎，如果我们凭着祷告而活，那么圣灵——那不可动摇之生命——的影响就应当在我们里面不断增长。然而我们感受不到这些——只有当我们的祷告得以增强和深化时，我们才偶尔感受得到。但信经以「我信」（英文「I believe」）一词开始，并以另一种性质的词语结束：「我盼望——我期待死人复活。」于是我们的信德便转变为一种已属另一种次序的行动。我不仅相信，我更期待着这事。这份期待本身——「我盼望死人复活」——本身就是一种能量，它必然且坚定不移地将我们复活。在教会为亡者所做的祷告中说：「亡者在永生之希望中安息。」基督徒的特征是死亡，以便实现我们被造的目的，即为了获得一种类似上帝本身的生命。我重复赘述，使你们感到疲倦，但我不为此感到遗憾，因为我希望持续而有意识的重复，终将使我们感受到，这能量——作为使死人复活的权能——正体现在「我盼望」这个词语中。如此，我们便能真正有意识地在我们自身内获得这未被造的能量。「未被造的」意即，就其本性而言，它属于永恒的上帝，自身就是永恒的存有。在我们对上帝的理解中，一切未受造之物都属于神圣的秩序；而一切受造之物，虽然也属于上帝，但却属于受造的秩序。而这创造之工是一个我们称之为「时间」的过程。在我们生命的最终实现中，时间将不再存在，其内容将改变，充满上帝本身生命那无限的能力。信经中提及我们的上主与上帝为了我们的救赎所采取的行动——「为我等世人，并为我等救赎，从天降临」。
    - type: paragraph
      text:
        ru: 'Конечно, состояние болезни, которая называется «старость», толкает меня на мысль о смерти. Но это совсем не значит, что вам она должна быть чужда, поскольку вы еще молоды. Психологически вам не приходится думать постоянно о смерти, но духовно это неправильно. В опыте Святых Отцов-аскетов мы видим нередко ссылки на особый род благодати, которая именуется «смертная память». И она может появиться у человека совсем молодого: правда, по благодати, после того как Бог даст пережить Свою близость к человеку. Тогда эти слова становятся понятными. Окружающая жизнь непрестающим образом давит на нас и как будто хочет заглушить в нас смертную память, и есть многие вещи, которые мешают нашему духу возноситься к Богу в чистоте своей мысли о Нем.'
        cn: 当然，这种被称为「衰老」的疾病状态，促使我思考死亡。但这绝不意味着，死亡对你们而言应该陌生，因为你们还年轻。心理上，你们不必持续思考死亡，但从属灵角度看，这是错误的。在苦修圣教父们的属灵经历中，我们时常看到提及一种特别的恩典，它被称为「念死」。而它可能出现在一个非常年轻的人身上：诚然，这是出于恩典，是在上帝使人经历祂与人的亲近之后。那么，这些话就变得明了了。周遭的生命持续不断地重压着我们，仿佛想要扼杀我们心中的念死，且有许多事，妨碍我们的心神以其对上帝的纯洁思念升向上帝。
    - type: paragraph
      text:
        ru: 'Самые лучшие намерения встречают страшное сопротивление. И отсюда у некоторых Отцов явилось чувство, что этот мир тесен, как бочка. Гоголь кончает одну из своих повестей: «Скучно на этом свете, господа». Но если бы он знал наше время, то, воображаю, на каждой бы из своих страниц он писал бы эти слова. Я ощущаю этот мир тесным, как «каменный мешок». Так называли тюремные камеры Петропавловской крепости русские люди.'
        cn: 最美好的意愿总会遭遇可怕的阻力。因此，一些教父们生出一种感觉，觉得这个世界狭窄，如同木桶。果戈理在他的一部小说结尾写道：「这个世上真无聊啊，先生们。」但是如果他知道我们这个时代，那么，我想象着，他会在自己的每一页上都写下这些话。我感觉这个世界狭窄，如同一个「石袋」。彼得保罗要塞的囚室，俄罗斯人就是这样称呼的。
    - type: paragraph
      text:
        ru: 'Но все-таки все мое глубокое желание, чтобы вы помнили слова: «Чаю воскресения мертвых».'
        cn: 然而，我所有深切的愿望是，愿你们谨记这些话：「我仰望死者复活。」
    - type: paragraph
      text:
        ru: 'Почему Отцыотчаяниесчитают грехом и страстью? – Отказаться от того, что Бог уготовал для нас, есть большой грех. Итак, да сохранит Бог нас от этого греха, когда мы говорим: «О, как я устал от жизни сей». Но когда мы действительно чаем воскресения мертвых, то там скрывается энергия-сила, которая воскресит нас.'
        cn: 为什么教父们认为绝望是罪和私欲？——拒绝上帝为我们所预备的，是极大的罪。因此，愿上帝保守我们脱离这罪，当我们说：「唉，我多么厌倦今生啊。」但当我们真正盼望死人复活时，那里就蕴藏着那将使我们复活的能量——力量。
  - type: heading2
    text:
      ru: 'Беседа 21: О борьбе с помыслом[185]'
      cn: 讲论二十一：论与意念的争战[185]
    children:
    - type: paragraph
      text:
        ru: О борьбе с помыслом молитвою. Борьба с помыслом – борьба за единство нашей общины. Необходимо самоосуждение в отношениях с ближним. В этой борьбе суть монашества. О двух молитвах за единство. Монастырь – «мой-наш» дом. «Вонми, Небо» – как проявление персоны. О неизбежности страданий. Мирная ектения и Божественный образ триединства
        cn: 论借祷告抵御意念。与意念争战，乃是为我们团契的合一而争战。在与近人的关系中，必须进行自我谴责。修道生活的本质便是在这场争战之中。关于为合一而发的两种祷告。修道院是『我的-我们的』家。『留心听啊，诸天』——作为位格的彰显。关于苦难的不可避免性。平安连祷文与三一上帝的神圣形象。
    - type: paragraph
      text:
        ru: 'Тем, кто начинает свою монашескую жизнь, возможно, полезным будет знать, как бороться с атакующими нас нехорошими помыслами. Если мысль несет в себе энергию или идею негативную, я молюсь: «Господи, огради мой ум: Ты видишь, в своем помрачении он влечется к вещам гибельным, разрушающим спасение». И повторяя эту молитву: «Господи, удержи мой ум», я перебиваю путь для дурной мысли и живу спокойнее, потому что призывание имени Божиего спасает меня от рабства находящих мыслей. Если в сердце моем я усматриваю движение недоброе, то говорю: «Господи, исцели мое сердце, исцели меня от страстных помыслов. Дай мне мысль о Тебе, о Твоих путях, о свете Твоих повелений». И так я перебиваю всякую атаку всякой дурной мысли. Такого рода борьба не прекратится даже до последнего издыхания, по свидетельству наших Святых великих Отцов. Когда приходят ко мне дурные мысли, нарушающие мой мир душевный, я говорю Господу: «Ты пред восходом Твоим на Голгофу предал ученикам Твоим мир Твой. Во благоволении Твоем излей на мя силу Твоего мира и дай мне в Духе Святом любить Тебя и следовать хранению заповедей Твоих, как Ты сказал: «Кто любит Меня, тот заповеди Мои сохранит».'
        cn: 对于那些开始修道生活的人，也许有益于知道如何对抗攻击我们的邪恶思想。如果一个思想带着负面的能量或意念，我就祷告说：「主啊，护卫我的心思：祢看见，在它的昏蒙中，它被引向毁灭性的、毁灭救恩的事物。」我重复这个祷告：「主啊，约束我的心思」，我就截断了恶念的路径，我也活得更平静，因为呼求上帝之名将我从涌现的思想的奴役中拯救出来。如果我在我心中察觉到不善的动念，我就说：「主啊，医治我的心，医治我，使我脱离情欲的思想。赐我关于祢的思想，关于祢的道路，关于祢诫命的光芒。」这样我就截断了任何一个恶念的任何攻击。这种争战甚至直到最后一口气都不会停止，正如我们圣大教父们所见证的。当恶念来到我这里，打扰我内心平安时，我对主说：「祢在上升加略山之前，将祢的平安赐予了祢的门徒。凭着祢的慈爱，求祢将祢平安的力量倾注于我，并在圣灵中赐我爱祢，并遵行祢的诫命，正如祢所说：『谁爱我，谁就遵守我的诫命』。」
    - type: paragraph
      text:
        ru: 'Чтобы молиться за всех людей, с которыми мы имеем общение и которые как будто бы рассеивают наш ум, надо делать так, как говорит наш блаженный старец Силуан. Рассказывая про святогоИоанна Кронштадтского, он пишет: «Когда был он в толпе, то как мог сохранить он память о Боге? – Молитвою за эту толпу: «Господи, излей мир Твой на людей Твоих. Господи, обрадуй достояние Твое пришествием света Твоего. Господи, посети всех страждущих и мучимых дурными мыслями или страстями. Господи, помяни всякое страдание всякого человека и прииди к нам на помощь». И тогда, говоря такую молитву, пребывая в толпе, вы сохраните мысль вашу всецело и в Боге, и в любви к ближнему[186].'
        cn: 为了所有与我们有交往的、以及那些似乎会分散我们心神的人祈祷，我们应当照着我们蒙福的老者圣西卢安所说去行。他在讲述圣约安·克隆施塔特的生平时写道：「他身处人群之中时，又怎能持守对上帝的记忆呢？——乃是借着为这群人献上的祷告：『上主，愿祢的平安倾注于祢的子民。上主，以祢的光的降临使祢的产业欢欣。上主，求祢眷顾一切受苦之人，以及那些被恶念或情欲所折磨的人。上主，求祢记念每个人的一切苦难，并来帮助我们。』这样，当你在人群中诵念这祷文时，你将能将你的心念全然持守，既在上帝之中，又在爱近人之中[186]。」
    - type: paragraph
      text:
        ru: Такого делания нашего духа не надо избегать никогда, как бы будничны ни были наши дни, исполненные видимыми трудами над материей, которая вечно сопротивляется духу. И тогда вы сохраните мир и дух ваш привыкнет жить в Боге. И после того, как перейдет душа после долголетнего опыта земли в иной мир, оставив свое физическое тело, тогда «нового» будет немного, потому что по существу мы уже приучили дух наш жить по духу заповедей Господних.
        cn: 这种我们灵性上的操练绝不可避免，无论我们的日子多么平凡，充满了与那永远抵制灵的物质的可见劳作。如此，你们将保守平安，并且你们的灵也将习惯活在上帝之中。而当灵魂，在经历了多年的尘世经验后，离开其肉身，进入另一个世界时，那时，「新的」将很少，因为实质上我们已经使我们的灵习惯于按照上主诫命的灵而生活。
    - type: paragraph
      text:
        ru: Когда посещают нас плохие мысли о ком бы то ни было, боритесь с этой худой мыслью о брате вашем или сестре вашей! Тогда вы сохраните единство жизни, единство любви в Духе Бога нашего. Люди не знают того, что когда они помышляют что-либо недоброе, будучи у себя в углу, в своей «берлоге», то они разрушают великое тело всего человечества. От этих дурных мыслей и негативных расположений к брату сам человек разбивается и чувствует свое несчастье.
        cn: 当有恶念临到我们，无论关于任何人，务要抵制这种关于你的弟兄或你的姊妹的不良念头！这样，你就能保守生命的合一，爱的合一，在我们上帝的圣灵里。人们并不知道，当他们在心中怀有任何不善的意念时，即使他们身处自己的角落，在自己的「巢穴」中，他们也在摧毁全人类的伟大身体。由于这些恶念和对弟兄的消极情绪，人自身也会破碎，并感受到自己的不幸。
    - type: paragraph
      text:
        ru: 'Это очень тонкая вещь: мы никогда не можем быть уверенными, что дурная мысль наша есть не первичная мысль, а отражение нерасположения, несимпатии, гнева или раздражения против меня сестры моей или брата моего. Но всякая недобрая мысль, которая появится во мне, все-таки отразится негативно на моих отношениях. Сердце другого человека ощущает эту недобрую энергию. И тогда получается, что как будто бы наша идея дурная о брате нашем есть действительно правдивая, то есть соответствующая действительному настроению брата моего. Тогда утверждается неприязненное отношение и может доходить до страсти. И так как мы никогда не знаем, я повторяю, действительно ли наши мысли были чисты или эти дурные мысли пришли сначала к нам, а потом к нашему брату или сестре, отсюда лучше всегда каяться во всякой своей дурной мысли пред Богом и пред братом внутренне, признавая виновником себя, а не другое лицо. Тогда во всех случаях будет выигрыш духовный для самого человека. Если он начал плохо мыслить и кается, то тем самым он угашает огонь разложения. Если начал другой, то пред Богом любовь к врагам нашим проявляется в этой форме – в моем покаянии, а не в обвинении брата моего. И так, по слову апостола Павла, «мы соблюдем закон Христов»[187].'
        cn: '这是一件非常微妙的事情：我们永远无法确定，我们的恶念并非是最初的念头，而是我的姊妹或弟兄对我的不满、反感、愤怒或烦躁的反映。但任何在我心中生起的不善念头，终究会对我的关系产生负面影响。另一个人的心会感受到这种不善的能量。这样一来，就好像我们对弟兄的恶念是真实不虚的，也就是与我弟兄的真实心境相符的。于是，敌意就得以确立，甚至可能演变成情欲。


          又因为我们永远不知道，我重申，我们的思想是否真正纯洁，还是这些恶念是先来到我们这里，然后才来到我们的弟兄或姊妹那里，因此，最好总是为自己的一切恶念在上帝和弟兄面前内心忏悔，承认过错在于自己，而非他人。那么在所有情况下，这个人自己都会获得属灵的益处。如果他开始有恶念并忏悔，那么他因此熄灭了败坏的火焰。如果是另一个人先开始的，那么在上帝面前，我们对仇敌的爱就以这种形式显现——即在我的忏悔中，而不是在指责我的弟兄中。如此，正如使徒保罗所言，「我们便成全了基督的律法」[187]。'
    - type: paragraph
      text:
        ru: Если с обеих сторон есть действие именно этого порядка, то таким образом, – ведя очень скромную борьбу, но со всяким плохим помыслом, со всякой негативной, недоброй мыслью о брате нашем, не отдавая сердце наше тому, что разрушает нас, – можем мы устроить настоящую монашескую жизнь. Так постепенно весь наш состав научится пребывать в заповедях Господних. А эти заповеди нас и просвещают, и освящают, и дают нам силу и разум, потому что исходят от великого Бога любви.
        cn: 如果双方都有这种次序的行动，那么如此一来，——藉着一场非常谦卑的争战，但对抗着每一个恶念，对抗着每一个对我们弟兄的消极、不善的念头，不把我们的心交给那摧毁我们的事物，——我们就能建立真正的修道生活。如此渐渐地，我们整个身心将学会安住在上主的诫命中。而这些诫命不仅光照我们，也圣化我们，并赐予我们力量和智慧，因为它们源自那伟大的爱之上帝。
    - type: paragraph
      text:
        ru: 'При помощи моих братьев я обрел две хорошие молитвы за наш монастырь и думаю перевести их на другие языки и отдать вам всем, и просить выучить их, если возможно, наизусть и молиться на каждый день, повторяя эти молитвы. И тогда вы увидите результат. Одна из них взята из жизнеописания преподобного Сергия: он молил Бога сохранить его обитель, и, какую бы бурю ненависти, каких бы нападений и злодеяний ни перенес этот монастырь, – он сохранен был Богом от разрушения, постигшего другие монастыри. И до сих пор тысячи и тысячи людей притекают к его мощам, испрашивая его благословения, называя его «игуменом страны нашей Российской». Другая молитва – одного игумена греческого, и я предложу вам ее на втором месте после молитвы преподобного Сергия.'
        cn: 借着我的弟兄们，我得到了两篇美好的祷文，是为了我们的修道院的。我打算将它们翻译成其他语言，并分发给你们所有人，请求你们如果可能的话，将它们背诵下来，并且每天藉着重复这些祷文来祈祷。这样一来，你们就会看到结果。其中一篇取自可敬者谢尔盖的生平记述：他向上帝恳求保守他的修道院，并且，无论这个修道院经历了怎样的仇恨风暴，怎样的袭击和邪恶行径，——它都被上帝保守，免受了临到其他修道院的毁灭。并且直到如今，成千上万的人涌向他的圣髑，祈求他的祝福，称他为「我们俄罗斯国土的院长」。另一篇祷文是出自一位希腊院长，我将把它作为第二篇，在可敬者谢尔盖的祷文之后，呈献给你们。
    - type: paragraph
      text:
        ru: То, что есть «местного» в этих молитвах, я, конечно, предлагаю вам устранить и воспользоваться содержанием этих молитв. И тогда вы удержите монастырь в самых тяжелых обстоятельствах.
        cn: 这些祷告中凡是『地方性』的成分，我当然建议你们去除，而应利用这些祷告的内容。这样一来，你们就能在最艰难的环境下维系住修道院。
    - type: paragraph
      text:
        ru: Что страшит меня в будущем? Если вы не будете учиться побеждать всякую дурную мысль, то поставите в опасность самое существование монастыря. Но если вы молитесь о монастыре как о месте, которое дал всем нам Господь, то, конечно, цель спасения души нашей будет достигнута по милости Божией.
        cn: 未来有什么令我恐惧的吗？如果你们不学会战胜一切恶念，就会危及修道院自身的存在。但如果你们为修道院祈祷，视其为主赐予我们所有人的地方，那么，当然，我们灵魂得救的目标就会藉着上帝的恩典而达成。
    - type: paragraph
      text:
        ru: 'Я в шутку говорю так: «Господи, сохрани мой-наш дом». – «Мой-наш дом!». Если это дом, данный мне Богом для спасения, то можно сказать, что это «мой дом», а можно говорить, что это и «наш дом». Итак, «мой-наш дом».'
        cn: 我开玩笑地这样说：「主啊，保守我的-我们的家。」——「我的-我们的家！」如果这是一个上帝赐予我为得救而有的家，那么可以说，这是「我的家」，也可以说，这是「我们的家」。所以，「我的-我们的家」。
    - type: paragraph
      text:
        ru: 'Некто на экзамене сказал профессору: «У отца Софрония я беру мысли, по которым можно угадать, где говорит персона». Подумайте: Христос заповедал: «Шедше, научите всеязы́цы(все народы), крестяще их во имя Отца и Сына и Святаго Духа», – это говорит Персона-Бог. Есть и слова Моисея: «Внемли, небо! Слушай, земле!»[188]. Вы видите, персона призывает все небо слушать его слово и всю землю – так говорит персона! Так, приятно находить выражение персоны в Священном Писании, и в жизни нашей, и в писаниях Святых Отцов. Дерзновение персоны было у Силуана, когда он говорил «народам всей земли» и молился «о народах всей земли». И то, что говорят эти персоны, действительно исцеляет сердца наши и делает жизнь нашу исполненною света и мира. Почаще просите Бога нашего, Иисуса Христа: «Господи, даждь мне познать мир Твой. Господи, излей и на мою бедную главу потоки мира Твоего». И так вы будете жить, шествуя благословенным путем.'
        cn: 某人曾在考试中对教授说：「我从索夫罗尼长老那里汲取思想，借此可以辨识出何处是『位格』在说话。」试想：基督曾训谕：「你们要去，使万民作我的门徒，奉父、子、圣灵的名给他们施洗」，——这是位格——上帝——在说话。还有摩西的话语：「天哪，要侧耳听！地啊，要倾耳闻！」[188]。你们看，位格在呼唤整个天空聆听祂的话语，也呼唤整个大地——这就是位格在说话！如此，寻得位格的表达令人欣喜，在圣经之中，在我们的生命之中，也在圣教父们的著述之中。位格的坦然无惧，圣西拉长老也曾拥有，当他向「全地万民」说话时，并为「全地万民」祈祷时。而这些位格所言说的一切，确实医治着我们的心，并使我们的生命充满光明与平安。你们要时常恳求我们的上帝，耶稣基督：「主啊，愿我认识祢的平安。主啊，愿祢将祢的平安之流倾泻在我这贫乏的头上。」如此，你们将生活，行走在蒙福的道路上。
    - type: paragraph
      text:
        ru: 'Когда мы говорим Богу: «Скажи мне, Господи, путь, в оньже пойду, Дух Твой благий наставит мя на землю праву (на правильный путь)»[189], те же выражения надо применить и к нашему дому и на таких молитвах, как «столпах», построить монастырь. И вам дает Господь теперь эту задачу.'
        cn: 当我们对上帝说：「上主啊，求祢指示我当行的道路，祢的美善之灵必引导我进入正直之地（在正确的道路上）」[189]时，同样的表达也应适用于我们的家，并且要以这些祷告为「支柱」，来建造一座修道院。上主现在将这项任务交托给你们。
    - type: paragraph
      text:
        ru: 'Конечно, никто не сможет изменить слов Христа: «В мире скорбны будете; но дерзайте: Я победил мир»[190]. Через добрые мысли и добрую молитву о всех мы должны по мере возможностей избежать скорбей, трудностей, болезней и сохранить этот мир. И начинайте богослужение с мыслью: «Благословен Бог наш», и потом: «Миром Господу помолимся». Эта ектения называется Великою, и она действительно великая по своему содержанию: «Миром Господу помолимся. О мире всего мира, благостоянии святых Божиих церквей и соединении всех, Господу помолимся», – «кричит» дьякон от лица всей земли.'
        cn: 当然，没有人能改变基督的话语：「在世上，你们有苦难；但你们要放心：我已经胜了世界。」[190] 借着美好的思想和为众人的美好祷告，我们应当尽力避免苦难、困难、疾病，并保守这份平安。并以这样的思想开始事奉圣礼：「愿我们的上帝蒙受称颂」，然后是：「让我们平安地向上主祈祷。」这次连祷被称为大连祷，它内容上确实是伟大的：「让我们平安地向上主祈祷。为全世界的平安，为上帝众圣教会的稳固，并为众人的合一，让我们向上主祈祷。」——执事「呼喊」着，代表着全地。
    - type: paragraph
      text:
        ru: 'Когда я был в пустыне на Афоне, мне приходилось служить в пустых храмах, и я думал: «Вот, сколько страдающих людей в мире сейчас заняты непосильным, утомительным или болезненным трудом; а мне дана радостькричатьот лица земли Богу:Миром Господу помолимся!». Так и вы молитесь «о мире всего мира, благостоянии святых Божиих церквей и соединении всех». Каком соединении? – Мы так разъединены, что ценно, конечно, всякое видимое единение. Но нам нужно мыслить о «соединении всех по образу единства Бога нашего, Святой Троицы».'
        cn: 当我在阿索斯山上的荒野时，我不得不常在空无一人的教堂里举行礼拜，我思忖着：「看啊，世上有多少受苦之人此刻正忙于繁重、令人疲惫或痛苦的劳作；而我却蒙赐喜乐，能从大地的名义向上帝呼喊：『让我们以平安向上主祈祷！』」你们也当如此祈祷：「为普世的和平，为圣上帝众教会的稳固，和所有人的合一。」怎样的合一？——我们如此分裂，以至于任何可见的合一，当然都弥足珍贵。但我们必须思考「按照我们上帝、圣三一的合一形象而实现的所有人的合一。」
    - type: paragraph
      text:
        ru: Так, читая Священное Писание и выбирая некоторые слова, вы построите свою жизнь, которая внешне останется скромной, но по содержанию своему – с утра до вечера и всю ночь, даже когда мы спим, – мир Христов будет с вами. И моя молитва о том, чтобы этот мир был со всеми вами.
        cn: 因此，藉着阅读圣经并拣选某些话语，你们将建立起自己的生活，这生活在外表上将保持谦逊，但在其内容上——从早到晚，并整夜，甚至当我们睡着时——基督的平安将与你们同在。而我的祷告是，愿这平安能与你们所有人同在。
    - type: paragraph
      text:
        ru: Это так легко забыть – как бороться с помыслом. А как бороться? – Молиться за всех. Да даст Господь вам расположение хранить мои слова!
        cn: '这太容易忘记了——如何与意念争战。

          那么，该如何争战呢？

          ——为众人祷告。

          愿上主赐予你们心意，以谨守我的话语！'
  - type: heading2
    text:
      ru: 'Беседа 22: Метод умной борьбы против страстей[191]'
      cn: 第二十二讲：对抗诸情欲的心智斗争之法[191]
    children:
    - type: paragraph
      text:
        ru: 'Что значат слова «постом и молитвой». Где «шатается» наш ум? Всякая тварная вещь имеет свой страстный образ. После Христова Воскресения и Вознесения наш ум должен быть с Ним – на Небе за завесой восьмого дня. Путь борьбы – умный. Мы следуем Христу умом. Чрез победу над страстью достигается сопребывание со Христом. Хранение ума как простой и эффективный путь. О борьбе с плотскими приражениями. Победа как достижение эквилибра. Наш подвиг – не психология. Непонимание людьми Божественного смирения. О Христовом смирении: евангельские примеры. О сверхнаучном опыте прп. Силуана'
        cn: 「藉着禁食与祷告」这些话语意味着什么？我们的心智在何处「游荡」？每一个受造之物都有其情欲的样式。在基督复活与升天之后，我们的心智当与祂同在——在天上，在第八日的幔子后。争战之道是属心智的。我们藉着心智跟随基督。藉着战胜情欲，便能达到与基督同在。守护心智作为一条简单而有效的路径。论及与属肉体的侵扰的争战。胜利作为达到平衡。我们的苦修并非心理学。世人对神圣谦卑的不理解。论及基督的谦卑：福音书中的例子。论及圣西卢安长老超乎科学的经验。
    - type: paragraph
      text:
        ru: Опять и опять благодарю Бога, давшего мне силы встретить вас и говорить о том, что необходимо нам, избравшим монашеский путь. Как можно победить навязчивый помысл, который не дает нам найти покоя и установить наши действия в духе заповедей?
        cn: 再次又再次地，我感谢上帝，祂赐予我力量与你们相遇，并谈论我们这些选择了修道之路的人所必需之事。如何才能战胜那缠扰的思虑，它不让我们寻得安宁，并使我们的行动符合诫命的精神呢？
    - type: paragraph
      text:
        ru: Конечно, эта борьба с помыслом входит в монашеское делание вообще борьбы со страстями. И сегодня я молю Бога дать мне силы говорить вам то, что действительно на потребу.
        cn: 当然，这种与妄念的斗争属于普遍意义上与情欲斗争的修道功修。今天我恳求上帝赐予我力量，对你们说出真正切合你们所需的话语。
    - type: paragraph
      text:
        ru: 'В Евангелии есть такой случай: некто привел сына своего, одержимого бесом. И когда ученики спросили Христа: «Почему мы не смогли изгнать беса из него?», Господь, изгнавший единым словом терзавшего юношу беса, сказал им: «Сей род изгоняется постом и молитвою»[192]. Господь дал нам самые общие положения, содержание которых мы должны раскрыть в долгом подвиге. Пост, понимаемый чаще как внешняя диета, тем более становится строгим, чем меньше человек отдает ум свой на духовную борьбу. Вообще же пост, конечно, говорит о необходимости воздержания от всего, что несогласно с духом заповеди. «Постом и молитвою!». Так, пост и молитва в своих внешних формах умножаются, если мы мало отдаем внимания умному деланию.'
        cn: 在福音书中，有这样一个事例：有人带来他被鬼附着的儿子。当门徒问基督说：「为什么我们不能将鬼从他身上赶出去呢？」主仅仅凭一句话就赶出了那折磨少年人的鬼，然后对他们说：「这一类的鬼，是藉着禁食和祷告赶出去的。」[192]上主赐给我们最普遍的原则，其内容我们必须在漫长的属灵奋进中加以揭示。禁食，常常被理解为外在的饮食控制，人若越少将心思投入到属灵的争战中，它就变得越发严苛。然而，总而言之，禁食无疑是指有必要禁绝一切不符合诫命精神的事物。「藉着禁食和祷告！」因此，如果我们很少关注心意上的操练，禁食和祷告在其外在形式上就会增多。
    - type: paragraph
      text:
        ru: 'Мы должны иметь контроль над нашим умом: где он, наш ум, (простите за резкое выражение) «шатается», по каким грязным дорогам он ходит? Необходимо удержать его от его прогулок там, где не следует и где он набирается грязи и страстей, оскверняя тем самым всю нашу жизнь! Надо нам учиться тому, как от такого помысла перейти к другому, который бы освящал всю нашу жизнь и приготовлял бы ум наш к жизни грядущего века.'
        cn: 我们必须掌控我们的心思：我们的心思，（恕我直言，用个不雅的词）在哪里「游荡」，它行走在哪些污秽的道路上？必须阻止它在不该去的地方游荡，在那里沾染污秽和情欲，从而玷污我们整个生命！我们需要学习如何从这样的意念转到另一个意念，它能圣化我们整个生命，并预备我们的心思进入那将临之世的生命。
    - type: paragraph
      text:
        ru: 'Теперь же я буду говорить вам об общем делании монаха борьбы со страстями. После падения Адама всякая страсть принадлежит тварному миру. Всякая страсть имеет ту или иную форму, тот или иной образ, свойственный ей в зависимости от ее характера. Так, наш принцип я коротко выражаю словами: «Не отдать ума, держать его под контролем», по совету великого Павла-апостола.'
        cn: 现在我将向你们讲述僧侣与诸情欲争战的普遍功修。亚当堕落之后，一切情欲都属于受造世界。一切情欲都有其固有的、这样或那样的形体和样式，这取决于其特性。因此，我将我们的原则简要地表述为：「不要放弃心神，要将其掌控住」，这遵照伟大的使徒保罗的建议。
    - type: paragraph
      text:
        ru: После того, как Господь воскрес и восшел на небеса, наш ум должен быть там, где Он, то есть за завесою восьмого дня. Если мы удерживаем в своем сознании необходимость контроля над нашим умом и аскетики, которая удерживает ум за завесой восьмого дня, то, вместо того чтобы осквернять все наше бытие страстями и греховными помыслами, сама мысль будет освящать его.
        cn: 在主复活升天之后，我们的心思理当在祂所在之处，也就是说，在第八日的幔子之后。倘若我们在自己的意识中谨记着管束我们心思的必要性，以及那使心思持守在第八日幔子之后的禁欲苦修，那么，非但不会用诸情欲和有罪的意念玷污我们整个的存在，这心思本身反而会圣化它。
    - type: paragraph
      text:
        ru: 'Почему надо «не отдать ума»? – Возможно, подобно некоторым Отцам, вы захотите испытать, как действует страстный помысл и следить, куда он ведет. Но наш путь к победе над греховными страстями иной: как остановить помысл, не дать внимания тому движению, которым ум одержим... И когда мы не отдаем ума, то никакая страсть не может действовать.'
        cn: 为什么需要「不将心智交出去」？——或许，你们会像某些教父一样，想去试验有罪的意念是如何运作的，并留意它引向何方。但是，我们战胜罪性情欲的道路却不同：即如何制止意念，不给予心思被其所缠扰的动向以关注……而且，当我们不将心智交出去时，任何情欲都无法发作。
    - type: paragraph
      text:
        ru: 'Максим, великий подвижник, сказал: «Дай телу воздержание и пост по силе его, а остальное отдай уму». Итак, мы будем следить за тем, чтобы наш ум никак не соединился с образом той страсти, которая стучит в дверь сердца нашего, чтобы привлечь нас к греховному акту. И получается, что наша аскетическая борьба зависит от культуры нашего ума. Никакая другая аскетическая культура в мире сем не знает подобного тому, что говорит Господь наш Иисус Христос, Творец мира, Им же «вся быша»[193]. Когда мы отдаем ум, чтобы следовать за Христом, куда бы Он ни пошел, то все наше существо освящается Его Божественной святостью. Так, не отдавая ума страстному помыслу, образу той страсти, которая хочет нас привлечь к греху, и переводя его в подвиг следования Христу, мы совершаем наш монашеский путь. Когда нам дается победить атаку всякой страсти, то ум наш, следуя за Христом, приготовляется к вечному бытию, «со-бытию» с Ним – с Христом, со Отцом и Духом Святым.'
        cn: 马克西姆，伟大的苦行者，说：「让身体按其能力，保持节制和禁食，而其余的则交给心思。」因此，我们将留意，我们的心思绝不要与那诱惑我们进入罪恶之行的激情之像结合，那激情之像正叩击我们心扉。于是，我们的苦修斗争取决于我们心思的修养。在这个世界上，没有任何其他的苦修文化知晓与此类似的事，就是我们上主耶稣基督所说的，祂是世界的创造者，借着祂，「万物得以存在」[193]。当我们把心思交托，以跟随基督，无论祂往何处去，那么我们整个生命就藉着祂神圣的圣洁而被圣化。这样，不将心思交予那情欲的思想，即那引诱我们犯罪的激情之像，而是将其转变为跟随基督的苦修，我们便走完了我们的修道之路。当我们得以战胜一切激情的攻击时，我们的心思，跟随基督，就预备好进入永恒的存有，与祂——与基督、与父和圣灵——「同在」。
    - type: paragraph
      text:
        ru: 'Скажем, нас беспокоит помысл неприязни: кто-то нас оскорбил. И стучится в дверь сердца нашего страсть отомстить обиду. Всякая страсть может осуществить себя в действии только при участии и внимании нашего ума к помыслу ее. Если мы выбрасываем из нашего ума образы людей, оскорбивших нас, и сам акт оскорбления, то мы – победили: страсть не действует в нас, и, сохранив принцип «не отдать ума», мы живем свободно. Таким путем воспитывается наш ум пребывать вечно с Богом, даже когда мы спим. Но это дается не скоро и не всем сразу.'
        cn: 假设我们为敌意的念头所困扰：有人侮辱了我们。报复羞辱的激情敲击着我们心门。任何激情唯有当我们的心思参与并关注其念头时，才能在行动中实现自身。如果我们把那些侮辱我们之人的形象以及侮辱行为本身从心思中抛开，那么我们便得胜了：激情便无法在我们里面运作，并且，通过持守「不交出心思」的原则，我们自由地生活。通过这样的方式，我们的心思得到培养，使之能永远与上帝同在，甚至当我们睡觉的时候。但这并非一蹴而就，也并非人人都能立刻做到。
    - type: paragraph
      text:
        ru: 'Главным при таком делании становится послушание. Все мы начинаем с малых вещей: свою волю мы отдаем мышлению нашего духовного отца или игумена. Так, в этом простом и маленьком акте послушания – умного послушания, – мы освобождаем свой ум от житейских забот. И тягота их падает всецело на нашего духовного отца или игумена. А мы пребываем свободными от них, и ум наш целиком может отдаться Богу. Когда ум занят Богом, Который, конечно, и Чистый, и Пречистый, то и ум наш становится чистым. И этот опыт чистого ума дается только в монастырях. Почему? – Потому что только в монастырях, а не в общей жизни мира, мы можем отдать себя рассуждению человека, который живет нашим Богом большее время, чем мы. И отец наш духовный, не будучи подобно нам одержим страстями, находит лучший исход. Так, самым простым методом мы вдруг восходим туда, куда не поднимается никакая интеллектуальная эквилибристика.'
        cn: 在这样的灵修实践中，顺服成为最主要的。我们都从微小之处开始：我们将自己的意志交托给我们的属灵父亲或修道院长的思想判断。如此，在这简单而微小的顺服——智性的顺服——的行动中，我们从世俗的烦恼中释放了我们的心智。它们的重担则全然落在我们的属灵父亲或修道院长身上。而我们则摆脱了这些重担，我们的心智得以完全献给上帝。当心智专注于上帝时——祂当然是纯洁的，更是至圣至洁的——我们的心智也变得纯洁。这种纯洁心智的经验唯有在修道院中才能获得。为何如此？——因为只有在修道院中，而非世俗的共同生活中，我们才能将自己交托给一个比我们更多时间活在上帝中的人的判断。我们的属灵父亲，不像我们一样受制于诸般情欲，能找到更好的出路。如此，通过最简单的方法，我们忽然升华至一个任何智性平衡技巧都无法企及的境界。
    - type: paragraph
      text:
        ru: 'Помните слова старца: «Я стал так делать, как научил меня Господь, и ум мой очистился, и Дух свидетельствовал спасение»? Только такой дух чистый, который больше связан с сердцем, чем с умом. Так и Господь говорит:«Блажени чистии сердцем, яко тии Бога узрят»[194].'
        cn: 你们可记得长老的言语：「我就照着上主所教导我的去做，我的心思便洁净了，圣灵也见证了救恩」？唯有如此洁净的灵，才更多地与心相连，而非与心思相连。上主也如是说：「福哉，心里洁净的人，因为他们必得见上帝」[194]。
    - type: paragraph
      text:
        ru: Таким образом монах обучается богословствовать, пребывая в делании послушания. И, по мнению таких святых, как Симеон Новый Богослов и другие, называемые «νηπτικοί πατέρες», то есть «те, которые проводили жизнь трезвенную умную жизнь», – только такой ум – чистый – годится для подлинного богословия. Таким путем монашеская жизнь ведет нас к созерцаниям богословским высочайшего порядка.
        cn: 如此一来，修士在顺从的操练中学习进行神学思辨。并且，根据诸如新神学家西默盎等圣徒，以及其他被称为「νηπτικοί πατέρες」（也就是说，「那些度过警醒理智生活的人」）的观点，唯有如此纯洁的心智才适于进行真正的神学探讨。循此途径，修道生活引领我们达到最崇高的神学默观。
    - type: paragraph
      text:
        ru: Вот, впечатление создается такое, что как будто бы все довольно просто и вместе с тем удивительно эффективно.
        cn: 所以，给人留下这样一种印象，仿佛一切都颇为简单，而与此同时却惊人地有效。
    - type: paragraph
      text:
        ru: 'Почему мы говорим «не отдать ума»? – Потому что всякая страсть, имея тот или иной образ, внешний или мысленный, приносит с собой ограничение, свойственное тварному миру. Из страстей не все одинаково действуют в человеке, но в общем порядке можно сказать, что самая тяжелая борьба для человечества – это плотская страсть: она предлагает вначале услаждение, а потом превращается в смерть. С этой страстью плотскою, образ которой стучится в наше сознание, – борьба тяжелее, чем с другими. Тысячелетний опыт монашества показал, что не отдавать ума таким страстным приражениям есть высочайшая культура: ибо, не отдавая ума образам плотской страсти, мы освобождаемся и страсть становится бездейственною. В начале это не так просто, покамест человек молодой и развивается для того, чтобы быть способным для прокреации. И казалось бы, космический закон прокреации превосходит нас. Но когда чрез умный подвиг достигается чистота ума, свободного от внешних помыслов, связанных с этой страстью, тогда человек становится совсем другим. И Отцы назвали это состояние «целомудрием».'
        cn: 我们为何说「不献出心智」？——因为任何情欲，无论是以何种形象——外在的或内心的——都会带来局限，这是受造界所固有的。在诸多情欲中，并非所有都以相同方式在人里面作用，但总的来说可以说，人类最艰难的争战是肉体情欲：它最初提供享乐，但随后转变为死亡。与这种肉体情欲——其形象叩击着我们的意识——的争战，比与其他情欲的争战更为艰难。千年修道经验表明，不献出心智于此类情欲侵袭，是最高的修养：因为，不献出心智于肉体情欲的形象，我们便得以自由，情欲也变得无力。起初这并非易事，当人年轻并正在发展以便能够生育时。而且，似乎宇宙的生育法则超越了我们。但当通过心智的苦修，达到心智的纯洁，脱离了与此情欲相关的外在意念时，那么人就变得全然不同了。圣教父们将此状态称为「贞洁」。
    - type: paragraph
      text:
        ru: Тысячелетний опыт показал, что когда правильно совершается этот подвиг, то есть чрез послушание и воздержание во всем, чрез пост и молитву, то человек не повреждается ни психически, ни интеллектуально. Если в большинстве случаев потеря эквилибра нормального человека возможна по двум причинам – при гордости и при плотской брани, то, побеждая и ту, и другую страсть, человек сохраняет свое равновесие и способность ко всякому разумному действию.
        cn: 千年经验表明，当这项苦修正确进行时，即通过顺服和凡事上的节制，通过禁食和祷告，人在精神上和智力上都不会受损。如果在大多数情况下，一个正常人的平衡失调可能出于两个原因——在于骄傲和肉体的争战，那么，通过战胜这两种情欲，人就能保持自己的平衡并具备一切理智行为的能力。
    - type: paragraph
      text:
        ru: Скажу вам из опыта. В свое время я страшно увлекался философией. Эквилибристика ума, свободно двигающегося в космической жизни и пространстве, доставляет большое наслаждение, но не спасает в том плане, о котором говорят заповеди Христовы.
        cn: 我从经验中告诉你们。我当年曾极其沉迷于哲学。心智在宇宙生命与空间中自由驰骋的思辨平衡技艺，能带来极大的愉悦，但却不能在基督诫命所提及的层面带来救赎。
    - type: paragraph
      text:
        ru: 'Есть в современных религиозных движениях другие понимания духовной жизни. Я лично предлагаю вам держаться нашей системы воспитания ума. Мы понимаем это воспитание иначе, особенно когда речь идет о созерцании. Созерцание для нас совсем не психоанализ, а это есть состояние духа нашего, когда реальности Божественного мира становятся очевидностью. Другие (я воздержусь от некоторых имен) понимают это как тонкий психический анализ мышления и всякого действия. Мы так не живем: это путь науки в ее современной форме – психологии.'
        cn: 在现代的宗教运动中，对属灵生活存在着其他的理解。我个人建议你们秉持我们心智培育的体系。我们对这种培育的理解有所不同，尤其当谈及默观时。对我们而言，默观绝非精神分析，而它乃是我们心灵的一种状态，此时神圣世界的真实性变得显而易见。其他人（我将避免提及某些名字）将其理解为对思维与一切行为的精微心理分析。我们不如此生活：这乃是科学以其现代形式——心理学——的道路。
    - type: paragraph
      text:
        ru: Из всех страстей самые страшные, конечно, плоть и гордость. Если с плотью борьба сводится к тому, чтобы не отдать ума, то с гордостью – «держи ум твой во аде».
        cn: 在所有情欲中，最可怕的，当然是肉身和骄傲。如果与肉身的争战，归结为不让心智失守，那么与骄傲的争战（则是）——『将你的心智持守在地狱中』。
    - type: paragraph
      text:
        ru: 'Понятие духовных людей о гордости или о плотской брани отличаются от понятия людей, живущих в миру. Не скрою, для меня огромной печалью является то, что лучшее познание, которое принес на землю Господь Иисус Христос, людьми пренебрегается. Пренебрежение это доходит даже до парадокса: люди стыдятся сказать, что они христиане. Но из этих людей, которые отходят от Христа, никто не имеет понятия о Божественном смирении. Бог, Который всемогущ, беспределен в Своих творческих актах, Он – смиренный. Но смирение Его совсем иного порядка, чем то, как понимают его люди. Оно может быть только даром свыше.'
        cn: 属灵之人对骄傲或肉体之争的理解，与活在世俗中的人不同。我不讳言，令我深感悲痛的是，主耶稣基督带到世上的最好认识，被人轻忽了。这种轻忽甚至达到了荒谬的地步：人们羞于承认自己是基督徒。但在这些偏离基督的人中，没有人理解神圣的谦卑。上帝，祂是全能的，祂的创造行动是无限的，祂是谦卑的。但祂的谦卑，与人们所理解的，是全然不同的层次。它只能是来自上天的恩赐。
    - type: paragraph
      text:
        ru: 'У нашего блаженного отца есть замечательное богословское учение. При всем моем невежестве мне кажется, что никто, как Силуан, не различает два рода смирения: он говорит, что иное – аскетическое смирение и иное – Христово Божественное, которое неописуемо, в котором нет элементов относительности. Оно носит характер абсолютный и никакого сравнения с чем-нибудь другим не имеет. Тогда как аскетическое смирение относительно и выражается принципом «я хуже всех», Христово смирение свойственно Его любви. Это смирение, которому Господь рекомендует учиться, подражая Ему, не тварное, а свойственное Самому Богу[195].'
        cn: 我们蒙福的教父有一卓越的神学教导。以我之无知，我认为没有人能像圣西卢安那样区分两种谦卑：他说道，一种是苦修的谦卑，另一种是基督神圣的谦卑，是无法言喻的，其中没有相对性。它具有绝对的性质，与任何事物都无可比拟。然而，苦修的谦卑是相对的，并以「我比所有人更差」的原则来体现。基督的谦卑是祂的爱所固有的。这种谦卑是主建议我们效法祂去学习的，并非被造的，而是上帝本身所固有的[195]。
    - type: paragraph
      text:
        ru: 'Многие спрашивают: «Почему человек, живя очевидно воздержной и разумной жизнью, говорит: «Я хуже всех»? Что это – ложное смирение?». – Нет, это совсем другое... Скажем, мы ощущаем наши боли, когда болеем. И когда боль превосходит наше терпение, мы думаем, что страдаем больше всех. Так и для стремящегося к смирению подвижника отсутствие этого смирения, выражающееся в том, что человеку приходят высокие мысли о самом себе, – уже есть страшная борьба. Именно в такой момент борьбы Силуан воззвал к Богу: «Господи, научи меня, как могу я смириться?» – и получил ответ Христа: «Держи ум твой во аде»[196].'
        cn: 许多人问：「为什么一个人，明明过着明显克制和理智的生活，却说：『我比所有人都要差』呢？这是虚假的谦卑吗？」 ——不，这完全是另一回事……打个比方，我们生病时会感受到痛苦。当痛苦超出我们忍耐的限度时，我们就会认为自己比所有人都要受苦。同样，对于一个致力于追求谦卑的修道者而言，缺乏这种谦卑，具体表现为人会产生对自身的傲慢思想——这本身就已经是一场可怕的争战了。正是在这样一场争战中，圣西卢安向上帝呼求：「上主啊，教导我，我该如何谦卑呢？」——并得到了基督的回答：「持守你的心智于地狱中。」[196]
    - type: paragraph
      text:
        ru: 'Читая внимательно Евангелие, вы увидите, что на земле Господь действовал и Сам согласно слову «Держи ум твой во аде» в борьбе с гордостью – самой ужасной из страстей. Когда Он совершал какое-нибудь исцеление и кругом Него стояли люди, ошеломленные величием чуда, то Он говорил Своим апостолам: «Знайте, что Сын Человеческий будет предан суду и Его осудят на смерть»[197]. Когда жена некая поливала драгоценное миро на Его главу, Он думал о Своем погребении[198]. Так, будучи Богом по существу в изначальной Своей Персоне, Он все-таки шел таким путем. И нам, монахам, необходимо знать Его путь. Ибо даже если мы изучим все богословские системы и удержим все знания в нашей памяти и в нашем умном видении, но не победим гордости, то все это – напрасно.'
        cn: 仔细阅读福音书，你会看到，在世上，主亲自行动，也遵照「保持你的心在阴间」这句教诲，在与骄傲——这最可怕的激情——的斗争中。当祂行了某种医治，环绕在祂身旁的人们被神迹的宏伟所震惊时，祂就对祂的使徒们说：「你们须知，人子将被交予审判，并被判处死刑」[197]。当有妇人将宝贵的香膏浇在祂头上时，祂思念着自己的安葬[198]。如此，祂虽是按其本体在祂原始的位格中为上帝，却仍走了这样的道路。而我们这些修士，必须知晓祂的道路。因为即便我们研习了所有神学体系，并将所有知识都保持在我们的记忆和我们的理智之见中，但若不战胜骄傲，这一切都是徒然的。
    - type: paragraph
      text:
        ru: Итак, пока сосредоточимся на том, чтобы чрез скромную и простую жизнь стараться убежать умом от образов страсти. Когда вы атакованы страстными помыслами, пойдите и поработайте, или встретьтесь с кем-нибудь, или, что еще лучше, молитесь. И так всякими путями – чтением, молитвой, беседой, работой – помогайте себе отвлечься от помыслов страсти.
        cn: 那么，目前让我们专注于藉着谦逊而简朴的生活，努力让心思摆脱情欲的影像。当你被情欲的意念侵扰时，去工作，或与人相会，或，更好的是，祈祷。如此，藉着各种途径——阅读、祈祷、交谈、工作——帮助自己从情欲的意念中转移心神。
    - type: paragraph
      text:
        ru: 'А с гордостью борьба идет осуждением себя как недостойного Бога, на все века. Вы видите, как все в монастырской жизни, о которой мы сейчас говорим, не похоже ни на что другое. Возьмите нашего отца – Силуана: один час его ум созерцал неизбежность вечной гибели. Он сам говорил потом, как страшен этот дух. И тогда явился Господь без слов и радостным взглядом Своим восхитил его до небес. И в одно мгновение он познал состояние духа, о котором великие философы и богословы могут рассуждать лишь отвлеченно. Не подумайте, что я говорю с какой-то неприязнью к науке! – Нет, но я говорю о том, что одна наука хотя и обогащает наш дух, но без опытной жизни не спасает нас.'
        cn: 而与骄傲的斗争，则在于永远谴责自己不配得上帝。你们看，我们现在所谈的修道院生活中，所有的一切是多么与众不同。以我们的教父——圣西卢安为例：有一个小时，他的心智默观着永恒灭亡的必然性。他自己后来讲过，这个灵是多么可怕。然后上主显现了，没有言语，并以祂喜乐的目光将他提升至天堂。就在那一瞬间，他认识到了一种属灵的状态，而伟大的哲学家和神学家只能抽象地论述这种状态。请不要认为我对科学怀有任何敌意！——不，但我所说的是，单纯的科学虽然能丰富我们的心灵，但若没有经验的生活，它就不能拯救我们。
  - type: heading2
    text:
      ru: 'Беседа 23: Вечность и время во Христе: проблема календаря[199]'
      cn: 第二十三讲：基督里的永恒与时间：历法问题[199]
    children:
    - type: paragraph
      text:
        ru: Мысли о смерти. Новый Завет говорит о вечности. Монашеская жизнь как встреча с Богом лицом к Лицу. О гефсиманской молитве как молитве за всего Адама. Христос сострадал всему миру и всем людям. Монашество как исполнение заповеди «Да любите друг друга». Преслушание Адама в корне всего древа человечества. Космическая любовь в нашей малой общине. Как достигнуть вечности. О должном христианском мышлении. Об искажении христианства. Об отказе в общении из-за календаря. Время – условие тварного бытия. Заповеди Христа меняют структуру нашей жизни. Для реализации персоны необходимо покаяние
        cn: '关于死亡的思索。

          新约论及永恒。

          隐修生活是与上帝面对面的相遇。

          关于客西马尼的祷告，是为全体亚当的祷告。

          基督怜悯整个世界和所有人。

          隐修生活：对「你们要彼此相爱」这一诫命的履行。

          亚当的悖逆乃整个人类之树的根源。

          在我们的小团体中的普世之爱。

          如何达致永恒。

          关于合宜的基督徒思维。

          关于基督教的扭曲。

          关于因历法而拒绝共融。

          时间是受造存在的条件。

          基督的诫命改变我们生命的结构。

          为了位格的实现，悔改是必要的。'
    - type: paragraph
      text:
        ru: Да будет благословенно имя Бога нашего. Каждый раз возобновляется во мне радость от свидания с вами. Но также каждый раз, когда нужно говорить о Боге великом и преславном, к сердцу приближается нежный, но все-таки страх. Этот океан великолепен, но не легко усвояется. И, как всегда, я буду держаться принципа говорить о том, что каждое путешествие начинается единым шагом, но само по себе оно имеет целью далеко отстоящую от нас жизнь.
        cn: 愿我们上帝之名蒙福。每一次与你们相见，我心中便重燃喜乐。然而，每一次当需要谈论伟大而荣耀的上帝之时，心中便感到一丝温柔却又真实的畏惧。这片汪洋宏伟壮丽，却不容易领悟。并且，一如既往，我将秉持一个原则来谈论：每段旅程都始于一步，但其本身的目标，却是远离我们现世的生命。
    - type: paragraph
      text:
        ru: Как всегда, я буду говорить бестолково и непостроенно, но как Бог даст мне слово. И вы простите меня, потому что с каждым днем я теряю свои человеческие способности, но все-таки остаюсь в сознании величия цели, предстоящей пред нами. Быть может, теперь приблизился мой день, когда я должен уйти к Богу, создавшему меня. Но, как вы знаете, на ваших глазах я уже умираю двадцать с лишним лет. Так и теперь не знаю, когда придет тот страшный час встречи с Богом лицом к Лицу.
        cn: 一如既往，我将语无伦次、杂乱无章地说话，但唯愿上帝赐我话语。也请你们原谅我，因为我一天天丧失着人的能力，但我依然清醒地意识到摆在我们面前这伟大目标的宏伟。也许现在我的时日已近，就是我当回到那创造我的上帝身边的日子。但如你们所知，在你们眼前，我已垂死二十余年。因此，我仍不知那与上帝面对面相遇的可畏时刻何时降临。
    - type: paragraph
      text:
        ru: 'Когда я помышлял об этом часе и в прошлом и в настоящем, то сознавал, что весь наш опыт, касающийся окружающего нас пространства, где движутся небесные тела и вместе с тем земля наша: весь опыт и трудности и радости познания, и сам труд искания познания, – все нужно превратить в приготовление к встрече с Тем, Кто создал этот мир и нас. И чем больше мы «останавливаемся» на Нем, тем больше мы ощущаем беспредельность и вечность. Вся жизнь во Христе Боге, все Писание Нового Завета собственно говорит только о вечности и о приготовлении к этой вечности.'
        cn: 当我思忖着此一时辰，无论过去抑或现在，便意识到：我们关乎周遭空间，即天体运行、我们的地球亦在其中的全部经验；我们认知的全部经验，以及其间的艰难与喜乐，甚至那寻求认知的劳作本身——这一切都应化为与那位创造了这世界与我们者的相遇的预备。我们越是「止息」于祂，就越能感受那无限与永恒。基督神里的一切生命，以及新约全书，都只论及永恒以及对这永恒的预备。
    - type: paragraph
      text:
        ru: Господь благоволил послать мне испытания многочисленные и многообразные.
        cn: 上主恩慈地赐予我众多而多样的考验。
    - type: paragraph
      text:
        ru: Одним из этих испытаний была монастырская жизнь на Афоне. По ее благодетельному действию я понял, что общежительная форма монашества наиболее полезна для расширения нашего сознания, для приготовления к встрече со Христом Богом. Что я имею в виду, когда говорю о «приготовлении к встрече лицом к Лицу с Богом Создателем нашим и Спасителем нашим»? – Он сотворил нас по образу и по подобию Своему, и предо мною стоит задача освоить Его жизнь – беспредельную, всеобъемлющую. Когда Господь молился в Гефсимании, Он имел в Себе мысль о всем Адаме. Об этом прекрасно говорят Симеон Новый Богослов и не менее прекрасно – наш духовный отец Силуан. Согласно Откровению мы верим, что следствием падения Адама было то, что мы, рожденные после падения, восприняли его жизнь и состояние, в котором он вышел из Рая, то есть его греховное и страшное настроение и разрыв с Богом.
        cn: 这些考验之一，是在阿索斯山的修道生活。藉着其有益的作用，我明白共住制的修道形式，对于拓展我们的意识、预备我们与基督上帝相遇最为有益。当我谈及「预备与我们的创造者和我们的救主上帝面对面相遇」时，我指的是什么呢？——祂照着自己的形象和样式创造了我们，摆在我面前的任务是领受祂的生命——那无限的、包罗万有的生命。当上主在客西马尼园祷告时，祂心中怀有关于整个人类的想法。圣西缅新神学家对此有精辟的论述，我们的神师圣西卢安的论述亦同样精辟。根据启示，我们相信亚当堕落的后果是，我们这些在堕落之后出生的人，承受了他从乐园出来时的生命和状态，也就是说，他那罪恶而可怕的心境以及与上帝的决裂。
    - type: paragraph
      text:
        ru: 'Когда Господь пришел на землю, то Он прежде всего сказал: «Покайтесь!»[200]. Это слово было продолжением беседы Бога с Адамом в Раю[201]. Полагая в основу нашей жизни эту заповедь Господню – «покайтесь», сначала мы живем Адамово наследие не как Адамово, но как наше собственное состояние. Начинаю я мое покаяние с МОЕГО состояния греховного. И, странным образом, чем горячее и глубже мое покаяние, тем ближе становлюсь я к Адаму. После многих лет плача и рыданий появляется сознание близости Адама. От него, от его времени вошел грех в мир. И покаяние наше в нашем грехе приводит нас к нему – к Адаму. Содержание жизни Адама становится содержанием нашей жизни. Но наше сознание идет дальше и глубже, чем Адамово, не потому, что мы сами по себе глубже и больше, чем Адам, но потому, что Господь дал нам заповеди, которые превышают Адама. Воплотившись и живя с нами, Господь дал нам понятия, которые, конечно, превосходят меру человека.'
        cn: 当上主降世时，祂首先说：「悔改罢！」[200]。这句话是上帝与亚当在乐园中对话的延续[201]。将上主这「悔改罢」的诫命作为我们生命的根基，我们最初活出亚当的遗产，并非将其视为亚当的，而是作为我们自己的境况。我从我自己的罪性境况开始我的悔改。而且，奇妙的是，我的悔改越是火热和深刻，我就越是接近亚当。经过多年的哭泣和哀号，便会生出与亚当亲近的意识。罪是从他，从他所处的时代进入世界的。而我们为自己的罪所行的悔改，将我们引向他——引向亚当。亚当生命的内容，成为了我们生命的内容。但我们的意识比亚当的更深远，并非因为我们自身比亚当更深刻、更伟大，而是因为上主赐予了我们超越亚当的诫命。上主道成肉身并与我们同住，赐予了我们无疑超越人的尺度的概念。
    - type: paragraph
      text:
        ru: Бог сотворил нас по образу Своему и по подобию, и, творя человека таким образом, Он повторяет Себя в нас, и каждый из нас повторяет в себе Бога.
        cn: 上帝创造了我们，是按着祂的形象和样式；并且，当祂如此创造人时，祂在我们里面重复祂自己，而我们每个人也都在自己里面重复上帝。
    - type: paragraph
      text:
        ru: Господь сострадал миру во всей его полноте. Как Симеон Новый Богослов говорит, что Он принял смерть и за верных, и за неверных; и за тех, которые благословляли, и за тех, которые проклинали; и за тех, которые воздерживались от греха, и за тех, которые жили грехом, – за всех Он умер, чтобы спасти всех. А Силуан говорит, что когда к нашему сердцу прикоснется любовь Христова – любовь, которая привела Его на Голгофу, тогда и мы становимся преисполнены тем, что свойственно Христу, Богу, воплотившемуся и ставшему человеком. И эта цель стоит перед нами.
        cn: 主怜悯了整个世界。正如新神学家圣西默盎所说，他承受了死亡，是为了信者，也为了不信者；是为了那些祝福的，也为了那些咒诅的；是为了那些远离罪恶的，也为了那些活在罪中的——他为众人而死，为要拯救众人。而圣西卢安说，当基督的爱——那引领他上各各他的爱——触及我们的心时，那时我们便被基督所特有的充满，那正是道成肉身、成为人的上帝所固有的。而这目标就摆在我们面前。
    - type: paragraph
      text:
        ru: 'Уже года полтора или два тому назад я говорил, когда был сильно болен, о некоторой вещи, которую я хотел, чтобы вы восприняли как мое завещание. Я сам не чувствую себя отцом, но многие из вас называют меня отцом. И как они хотят видеть во мне отца, так и я хочу, чтобы они усвоили то, что получил я от моего отца – Силуана (я ничего не имею своего): сознание наше должно быть подобным гефсиманскому сознанию Христа, молящегося до кровавого пота. И мы не должны презирать этого, а жить жизнью Самого Христа.'
        cn: 大约一年半或两年前，当我病重时，我曾说过一件事，我希望你们将其视为我的遗嘱。我自己不觉得自己是父亲，但你们中许多人称我为父亲。既然他们想把我视作父亲，我也希望他们能领受我从我的父亲——西路按——那里所得到的（我一无所有）：我们的意识应当与基督在客西马尼园时祈祷至血汗淋漓的意识相似。我们不应轻视这一点，而应活出基督自己的生命。
    - type: paragraph
      text:
        ru: 'Меня поразило, что Иоанн Богослов, описывая Тайную Вечерю Христа, говорит, как Господь дал заповедь новую апостолам: «Да любите друг друга»[202]. И для каждого из нас монашеская жизнь прежде всего должна поставить своей целью жить братство наше как единого человека. Из-за этого общежительная форма монашества особенно удобна для постижения и для достижения этой цели. Хотя в моей личной жизни семь лет в пещере как отшельник были даром Божиим и благоприятным временем для молитвы за все человечество, всего Человека.'
        cn: 令我印象深刻的是，圣约翰神学家在描述基督的秘密晚餐时，讲述了上主如何将一条新诫命赐予使徒们：「你们要彼此相爱」[202]。对我们每个人而言，修道生活首要目标应当是，使我们的修士团契能如一体般生活。因此，共住制修道形式尤其适宜于领悟和达成这一目标。尽管在我个人生活中，在洞穴中作为隐士的七年是上帝的恩赐，并且是为全人类、为那整全的人祷告的蒙福时期。
    - type: paragraph
      text:
        ru: 'Господь дал Адаму заповедь: «А от древа сего познания добра и зла не ешьте, потому что умрете смертию»[203], и чрез пребывание в заповеди ему была обетована вечная жизнь. Он был поставлен во главу Рая, чтобы ведать и участвовать в устроении его. Но вот он пал страшным падением, которое до сих пор поражает весь мир. И если мы хотим спасения нашего, то, конечно, нужно действительно положить основанием нашей монашеской жизни молитву за всего человека. Но начинается эта молитва с маленького опыта – с маленького общежития в несколько человек. И потом, когда это достигнуто, вдруг пред нами раскрывается великое море любви Христовой. Общежительная жизнь важнее, чем пустынническая. Но и своевременная пустынническая жизнь может быть действительно даром благодати Божией. Живя в пустыне, человек может молиться о всем человечестве. Расширяется его ум, и он от времени переходит к вечности, от пределов всякого рода к беспредельности Божественной. В пустыне драгоценно то, что вечность становится ощутимою и как бы заставляющею забыть время. У меня лично появилась странная мысль по отношению к вечности: если бы не было вечности, времени тоже не было бы. И Бог, пребывающий в вечности, сотворил мир так, что форма бытия этого мира связана со временем, с переменами: подъемы, падения, любовь и обратная ей ненависть, – все проходит человек. И чем дальше углубляется он в покаянии за свои грехи и за свои страсти, тем глубже он постигает покаяние Адамово, о чем прекрасно говорит Силуан.'
        cn: 上主给了亚当一道诫命：「至于那分辨善恶树上的果子，你不可吃，因为你吃的日子，必定死」[203]，藉着遵守这诫命，他蒙应许得享永生。他被立为乐园之首，好管理并参与其治理。然而他却可怕地堕落了，至今仍冲击着整个世界。若我们渴望得救，那么，当然，我们需要真正地将为全人类的祈祷作为我们修道生活的根基。但这祈祷始于一个小小的经验——始于几个人组成的小型修道团体。而当这达成之时，在我们面前忽然展开基督之爱的大海。修道团体生活比隐修生活更重要。然而，适时的隐修生活确实可以是上帝恩典的恩赐。人在旷野中生活，可以为全人类祈祷。他的心智得以扩展，他从时间过渡到永恒，从各样的限度走向神性的无限。在旷野中，宝贵之处在于永恒变得可感知，并且仿佛使人遗忘时间。我个人有过一个奇特的想法，关于永恒：若没有永恒，时间亦将不复存在。而上帝，居于永恒之中，创造了世界，使得这世界的存在形式与时间、与变迁相关：兴衰起伏，爱与爱反面的憎恶——人经历这一切。他越是深入忏悔，为自己的罪和情欲，就越深刻地领悟亚当的忏悔，这一点圣西卢安（Silouan）说得极好。
    - type: paragraph
      text:
        ru: 'Но как передать эту жизнь? – Слова не действуют, пример не учит, потому что его не видят. И как пробудить в сердцах ваших сознание вечности Божественной, когда все изменяется? – Наш отец плакал в молитве за все человечество больше, чем за самого себя. Когда он каялся в своих грехах, то постепенно, проникая в сущность греха и падения Адама вообще, он становился носителем космического сознания. Силуан, который был одарен как поэт, говорил, что когда плакал Адам, то вся пустыня мира слушала его в великом молчании. Так и Серафим Саровский, когда «кричал» к Богу о себе только: «Милостив буди мне, грешному», постепенно становился, действительно, Адамом. Так молитва Серафима Саровского из личной стала космической, действуя до сих пор, и он мог предсказать, что будет «Пасха» в России в таком-то году, когда обретутся его мощи. Каждый раз, когда какой-нибудь человек хочет носить имя «Серафим», это событие происходит в пределах души воспринимающего имя. Но оно связано с тем фактом, что молитва Серафима Саровского стала по характеру своему космической. Так же и от отца нашего Силуана мы научаемся постепенно покаянию, которое возведет нас в то же самое состояние, когда мы, каждый из нас, становимся Адамом.'
        cn: 但如何传递这生命？——言语无效，榜样不教导，因为它不被看见。又如何唤醒你们心中对神圣永恒的意识，当一切都在改变时？——我们的父亲在祷告中为全人类哭泣，甚于为他自己。当他为自己的罪悔改时，他便逐渐地，深入罪的本质以及亚当普遍的堕落，成为了宇宙意识的承载者。圣西卢安，他拥有诗人般的天赋，曾说当亚当哭泣时，整个世界的旷野都以巨大的寂静倾听着他。同样，萨罗夫的塞拉芬，当他仅仅为自己向 上帝「呼喊」：「求祢怜悯我这罪人」时，便逐渐地，真正地，成为了亚当。如此，萨罗夫的塞拉芬的祷告从个人的变成了宇宙性的，至今仍在发挥作用，他还能预言俄罗斯将在某年迎来「逾越节」，彼时他的圣髑将被寻获。每当有人想要佩戴「塞拉芬」这个名字时，这个事件便发生在领受此名之人的灵魂深处。但这与一个事实相关联，即萨罗夫的塞拉芬的祷告，其性质已变为宇宙性的。同样，我们从我们的父亲圣西卢安那里，逐渐学习悔改，这悔改将我们提升到同样的状态，即我们每个人都成为亚当的状态。
    - type: paragraph
      text:
        ru: 'Когда входит душа наша в Божественную сферу жизни, то, конечно, человек реальнее ощущает вечность, чем время. И тогда многие слова евангельские становятся «нашими», то есть выражающими наше состояние. Нам нужно воспринять слово Христа так, чтобы оно стало нашим словом. И даже такие страшные выражения, как «небо и земля прейдут, но словеса Мои не прейдут»: по телу я умираю, но что есть мое тело? – земля, от которой я взят и куда опять пойду. «Небо и земля прейдут», то есть космическое бытие не есть вечное бытие.'
        cn: 当我们的灵魂进入神圣的生命领域时，人当然会比感知时间更真实地感知永恒。于是，许多福音中的话语成为「我们的」，也就是说，表达了我们的状态。我们需要如此领受基督的话语，使之成为我们自己的话语。甚至这样可怕的言辞，例如「天地将废去，但我的话语永不废去」：我肉身会死亡，但我的肉身是什么？——尘土，我从其中被取，也将归于其中。「天地将废去」，也就是说，宇宙性的存在并非永恒的存在。
    - type: paragraph
      text:
        ru: 'Почему я говорю с такою, я сказал бы, печалью? – Потому что желание сердца моего: чтобы вы усвоили сие, чтобы отошел от вас образ мышления, который является извращением жизни христианской. Мне трудно говорить об этом, потому что многие больные души не способны услышать это слово. Многие люди живут не вечность во Христе, а какую-то странную форму земной жизни. При отсутствии видения вечности время и дни для них становятся единственной реальностью: и они спорят о календарях. Когда я был на Афоне, произошла реформа календарная: Церковь Вселенская хотела уточнить время жизни с теми принципами, которые были заложены в начале. И в начале получалось, что равноденствие было девятого марта, а потом оно стало двадцать второго. И эта перемена касается, главным образом, внешней жизни человеческого общества, чтобы не сказать – государственной жизни. И превращать эту сторону в догмат и даже разрывать литургические отношения есть последствия этого недомыслия и отсутствия опыта вечности во Христе. Все проходит на земле. Мне за двадцать два года моей жизни на Афоне было больно видеть, как некоторые, даже хорошие, люди думают только о днях, а не о вечности. И так, странным образом, ожесточаются сердца этих людей. Уже закрыты двери сердец их. Они не могут понять ни гефсиманской молитвы, ни голгофской жертвы, ни идей Симеона Нового Богослова или Силуана о том, что каждый из нас должен уподобиться первому человеку по содержанию своей жизни – то есть стать Адамом.'
        cn: 为何我说话带着，我该说，如此的忧伤？——因为我内心深切的渴望是：你们能领受这训诲，让那扭曲了基督徒生命的思维模式从你们身上除去。我难以启齿谈论此事，因为许多病弱的灵魂无法听闻此言。许多人活着的不是在基督里的永恒，而是某种奇怪的世俗生活形式。当缺乏对永恒的洞见时，时间与日子便成了他们唯一的现实：于是他们争论起历法。我在阿索斯山时，发生了一场历法改革：普世教会希望根据最初奠定的原则来修订生活的时日。最初，春分是三月九日，后来变成了二十二日。而这种改变主要关乎人类社会的外在生活，甚至可以说——是国家生活。将这方面变为一项教条，甚至因此断绝礼仪上的共融，正是这种思虑不周和缺乏在基督里永恒经验的后果。世上万物皆会逝去。我在阿索斯山生活了二十二年，痛心地看到一些人，即便是好人，也只顾及日子，而非永恒。就这样，这些人的心以一种奇特的方式变得刚硬。他们的心门已经关闭。他们无法理解客西马尼园的祷告，无法理解髑髅地的牺牲，也无法理解新神学家圣西缅或圣西卢安的思想——即我们每个人都应当在生命内容上效法始祖，也就是说，成为亚当。
    - type: paragraph
      text:
        ru: 'От отсутствия сознания, которому учат нас святые Отцы наши, мы извращаем христианство, возводя условия государственной и общественной жизни в догмат. Это совсем неверная вещь. Подлинная молитва происходит в пределах не земной жизни, а Божественной: «Боже, милостив буди мне, грешному...», «Господи, помилуй нас и мир Твой».'
        cn: 缺乏我们圣教父所教导的意识，我们便扭曲了基督教，将国家和公共生活的条件提升为信条。这是完全错误的。真正的祷告发生于属神性而非属尘世的生命领域中：「上帝啊，求祢怜悯我这罪人……」、「上主啊，求祢怜悯我们和祢的世界」。
    - type: paragraph
      text:
        ru: Я говорю об этом беспорядочно, но в ходе нашей беседы я следую тому, как мне дается слово. Я не читаю по бумаге заранее записанное, а только ищу молитвой, что в сердце моем возникает.
        cn: 我谈论此事漫无章法，但在我们的交谈中，我顺应着话语如何赐予我。我不宣读事先写在纸上的内容，而只是借着祷告，寻求我心中所生发的一切。
    - type: paragraph
      text:
        ru: 'Так, я говорю сейчас об этом, потому что двое из наших братьев были в России. И там, после великой благодати мученичества, вдруг – такое маленькое, тесное, узколобое сознание о времени! Наших братьев спросили: «По какому стилю вы служите?». И для них это «новый стиль» и «старый стиль». И когда мы перешли на стиль, которым живет государство, то мы не ощутили никакой потери от этого, но мы сохранили наше доброе расположение и к тем, и к другим. Кто такие другие и кто те? Те, «которые считают дни», как апостол Павел говорил[204]. А есть другие, которые погружены молитвой и душою, всем сердцем, всею силою своею в вечного Бога.'
        cn: 所以，我现在谈论此事，因为我们有两位弟兄在俄罗斯。而在那里，在殉道者的伟大恩典之后，突然——一种如此狭小、局限、偏狭的时间观念！有人问我们的弟兄们：「你们按照什么历法事奉？」对他们而言，这便是「新历」与「旧历」。而当我们转换到国家所使用的历法时，我们并未因此感受到任何损失，但我们对这两类人都保持了良善的心意。谁是那些「另一些人」，谁又是「那些人」呢？「那些人」就是「斤斤计较日子的人」，正如使徒保罗所言[204]。而还有「另一些人」，他们以祷告、灵魂、全心、全力，全然浸没在永恒的上帝之中。
    - type: paragraph
      text:
        ru: 'Так, я хотел бы, братья мои дорогие, чтобы вы понимали вещи так, как нужно их понимать, – так, как учил нас Господь и Его апостолы, и Святые Отцы: «Небо и земля прейдут, а словеса Мои не прейдут». И когда Ему говорили евреи: «Ты ли, который не имеешь пятидесяти лет, видел Авраама?», Господь ответил со свойственным Ему сознанием: «Прежде Авраам не бысть, АЗ ЕСМЬ»[205]. И потому говорит Господь: «Ешьте Мое Тело, пейте Мою Кровь, и тогда будете носителями вечной жизни Моей. А кто не пьет Моей Крови, кто не ест Моей Плоти, тот потеряет жизнь»[206].'
        cn: 那么，我亲爱的弟兄们，我希望你们能以应有的方式理解事物——正如上主、祂的使徒们和圣教父们教导我们的那样：「天地都将过去，我的话语却永不废去。」当犹太人对祂说：「你还没有五十岁，岂见过亚伯拉罕吗？」上主以祂固有的自觉回答说：「还没有亚伯拉罕，我就是。」[205] 因此上主说：「吃我的身体，喝我的血，你们就必承载我的永生。凡不喝我的血，不吃我的肉的人，必丧失生命。」[206]
    - type: paragraph
      text:
        ru: 'Итак, скользнула моя беседа к этому положению: время есть условная, свойственная твари форма существования – existence, а вечность – это форма бытия вечного Бога, в Которого мы веруем. И при таком сознании мы сможем глубже понимать слова Христа и заповеди Его. Почему? – Потому что когда заповеди Его становятся законом, единственным законом нашего бытия: и временного, и вечного, тогда весь строй нашей жизни меняется. И когда человек восчувствует свое спасение во Христе и увидит других людей, которые не хотят Христа, то в нем появляется естественным порядком сострадание к тем, которые не понимают и не принимают Христа. Мучительное сознание, что эти люди отпадают от вечной жизни в Боге, рождает молитву за всего Адама. Старец Силуан говорит, что когда прикоснется любовь, то сердце человека хочет всем спасения. Тогда не будет ожесточения сердец, которое приводит к расколам, к ненависти и к совершенной потере образа жизни христианской.'
        cn: 于是，我的谈话转向了这一论点：时间是受造物固有的、有条件的存在形式，而永恒则是我们所信仰的永恒上帝的存有形式。在这样的认知下，我们就能更深入地理解基督的话语和祂的诫命。为什么呢？——因为当祂的诫命成为我们存有的法律，即无论是暂时的还是永恒的，唯一的法律时，我们生活的整个结构都会改变。当一个人深切感受到他在基督里的救恩，并看到其他不愿接受基督的人时，他就会自然而然地对那些不理解和不接受基督的人产生怜悯。这种痛苦的意识，即这些人正在脱离上帝里的永生，催生了为全人类（亚当）的祷告。圣西卢安长老说，当爱触及，人的心就渴望所有人都得救。那时就不会有心的刚硬，这种刚硬导致分裂、仇恨以及对基督徒生活方式的彻底丧失。
    - type: paragraph
      text:
        ru: Я на этом остановлюсь. И вы, как всегда, простите мне бестолковый мой язык и нескладную речь, но почувствуйте ее сущность. Старайтесь проникнуть чрез покаянную молитву в глубины сознания христианского, поскольку покаянная молитва – настоящая. Всякий из нас носит в себе тот или иной образ греха и согрешает. Отсюда для нас естественной является покаянная молитва. Но чудным образом именно так рождается персона-ипостась по образу Христа, воплощенного Логоса Отца.
        cn: 我就到此为止。各位，请一如既往地原谅我这笨拙的言语和不流畅的话语，但请感受其内在实质。你们当努力藉着忏悔祷告，深入基督徒意识的深处，因为忏悔祷告是真实的。我们每个人都身怀着某种形式的罪，并且犯着罪。因此，忏悔祷告对我们而言是自然的。但奇妙的是，正是借由这种方式，依照基督——即道成肉身的父之圣言——的形象，诞生了人格-位格。
    - type: paragraph
      text:
        ru: И моя молитва за то, чтобы вы все поняли путь Христа, который мучителен для нас, но который, действительно, спасает нас. И да хранит вас Господь.
        cn: 我的祷告是，愿你们所有人都能明白基督的道路，这道路对我们而言是充满苦楚的，但它确实拯救我们。愿上主保守你们。
  - type: heading2
    text:
      ru: 'Беседа 24: Ипостась как состояние обоженного человека[207]'
      cn: 第二十四讲：位格作为成神之人的状态[207]
    children:
    - type: paragraph
      text:
        ru: Христос – воплощенный Бог. Бог открылся как Ипостась и как многоипостасное Бытие. Человек как образ и подобие. Отражение Бога в Его творении. О тожестве по благодати, а не по сущности. О необходимости «синергии». О самооткровении Бога в Его заповедях. О заповеди «Научите все народы». Об ипостасной молитве, объемлющей все человечество
        cn: 基督是道成肉身的上帝。上帝启示了自己，作为位格，也作为多位格的存有。人是上帝的肖像与样式。上帝在祂受造物中的反映。关于按着恩典而非按着本体的同一性。关于「协同」的必要性。关于上帝在祂诫命中的自我启示。关于「教导万民」的诫命。关于涵盖全人类的位格祷告。
    - type: paragraph
      text:
        ru: Цель моей беседы с вами сегодня – предложить вам самую краткую формулу всей той системы, о которой у нас идет уже долгий разговор. Итак, как будто мы никогда не прерывали его, начнем сейчас нашу беседу.
        cn: 我今天与你们交谈的目的，是向你们提出关于我们已长时间探讨的整个体系中最为简明的公式。那么，仿佛我们从未中断过一般，我们现在就开始我们的交谈吧。
    - type: paragraph
      text:
        ru: Итак, сам я ничего не знаю. Все мое знание, все разумение мое – Христос. Как христианин, я верую, что Христос есть наш Творец. Бог пришел к нам во плоти нашей, в той самой форме существования, которую Он, Господь, сотворил. Его воплощение не было нечто другое, постороннее Ему, нет! – Это было нечто свойственное Ему, потому что Сам Он сотворил эту природу. Пришел Он через девственное воплощение, вочеловечился Он подлинным образом. Во время жития Своего Он говорил о том, что в Законе всякая йота и всякая черта окончательно установлена и от людей не подлежит изменению[208]. И мы знаем, что Закон приготовил людей высокого порядка, которые оказались способны восприять воплощенного Бога.
        cn: 那么，我自己一无所知。我所有的知识，我所有的理解，都是基督。作为基督徒，我相信基督是我们的造物主。上帝来到我们中间，以我们肉身的样式，以祂，上主，所创造的那同一存在形式。祂的道成肉身并非是某种与祂无关的、外在于祂的东西，不！这乃是与祂本性相符的，因为祂自己创造了这本性。祂借着童贞女的受孕道成肉身，祂以真实的方式降生成人。在祂在世为人期间，祂曾说过，律法中每一点画都已最终确立，并且不能由人来改变[208]。我们也知道，律法预备了品格高尚之人，他们被发现能够领受道成肉身的上帝。
    - type: paragraph
      text:
        ru: Итак, никакая черта не подлежит изменению от нас, но все же всякая черта подлежит восполнению от Самого Господа. Ссылаясь на Ветхий Завет, Господь нигде не проявил Себя противником данного в Ветхом Завете Откровения.
        cn: 因此，没有任何一条特质是可由我们更改的，但每一条特质却有待于主亲自成全。主在引述旧约时，从未显明自己是旧约中所赐下的启示的反对者。
    - type: paragraph
      text:
        ru: 'Бог открылся Моисею как Персона: АЗ ЕСМЬ СУЩИЙ. Конечно, мы веруем, что это был Сам Христос, Который говорил Моисею: АЗ ЕСМЬ СУЩИЙ[209]. Итак, если Господь говорит о Себе как о Персоне, встает пред нами вопрос: как это понимать? – А так, что как Персона, как Ипостась Бог пребывает в Своем бытии вечном. Говоря об ипостасном образе бытия, мы говорим о бытии Самого Бога. Итак, если в один момент Он сказал: АЗ ЕСМЬ СУЩИЙ, то в том же библейском Откровении Господь говорит о Себе во множественном числе:Сотворим человека по образу Нашему и по подобию[210]. И эти два момента я хочу подчеркнуть сегодня как наиболее простую основу всего дальнейшего богословия нашего о человеке и о спасении.'
        cn: 上帝向摩西启示自己是一位位格：「我是那自有者」。当然，我们相信那正是基督自己对摩西说话：「我是那自有者」[209]。那么，如果上主论及祂自己作为一位位格，我们面前就有一个问题：这该如何理解呢？——这样说来，就是作为位格，作为本体，上帝存有于祂永恒的存有中。当我们论及本体的存有方式时，我们论及的是上帝自己的存有。那么，如果祂在一个时刻说：「我是那自有者」，那么在同一圣经启示中，上主以复数形式论及祂自己：「让我们照着我们的形像、按着我们的样式造人」[210]。而这两点我今天想要强调，作为我们关于人类和救赎的一切后续神学中最简单的基础。
    - type: paragraph
      text:
        ru: 'Итак, если Бог говорит: «Сотворим человека по образу Нашему и по подобию», что мы можем при этом мыслить о человеке? – Лично я, как вы уже знаете, положил в основу всей моей жизни Откровение свыше, а не догадку снизу. И Откровение свыше говорит о человеке как созданном по образу Бога и по подобию Ему. Иными словами, и человек должен явиться как персона, как подлинный образ и подобие.'
        cn: 那么，如果上帝说：「我们要照着我们的形象，按着我们的样式造人」，我们对此能如何思考人呢？——就我个人而言，如你们所知，我已将我全部生命的根基置于来自上方的启示，而非来自下方的猜测。而来自上方的启示说，人是照着上帝的形象和祂的样式被造的。换言之，人也当作为一个位格，作为真实的形象和样式而显现。
    - type: paragraph
      text:
        ru: 'Но когда мы так живем человека, согласно Откровению Божественному, что должны мы учитывать в отношении человеческой персоны, ипостаси? – Это выражено очень хорошо в тропаре к преподобным:В тебе, отче, известно спасеся еже по образу: приим бо крест, последовал еси Христу и деючи учил еси презирати убо плоть: преходит бо; прилежати же о души, вещи бессмертней. Темже и со ангелы срадуется, преподобный отче, дух твой. Надо сказать, что на славянском языке этот тропарь звучит богословски очень глубоко, так как подчеркивается подобие, великое подобие, Самому Богу, тогда как на других языках не сказано «преподобный». И когда мы говорим о душе, конечно, мы имеем в уме ипостасный принцип бытия.'
        cn: '但当我们如此生活为人，依照神圣启示时，我们应当如何看待人的位格，亦即其本体呢？——这在致可敬者的圣颂中表达得非常好：


          尊贵的父啊，在你里面，照着上帝形象所存的，已蒙救赎，这是众所周知的；

          因你背负十架，跟随了基督，

          并以你的行为教导人轻看肉体，因其是必朽的；

          却要致力于灵魂，那不朽的事物。

          因此，尊贵的父啊，你的灵魂与众天使一同欢欣。


          应当指出的是，在斯拉夫语中，这段圣颂在神学上听起来非常深刻，因为它强调了肖似，极大的肖似，即对上帝本身的肖似，然而在其他语言中则没有说到「преподобный」这个词。当我们谈论灵魂时，当然，我们心中所想的是位格性的存有原则。'
    - type: paragraph
      text:
        ru: 'Подобие Богу – но, спрашивается, до каких пределов? Ведь можно говорить о беспредельности, потому что речь идет о вечности. Но можно поставить вопрос и в другом смысле: абсолютно ли подобным становится человек Богу или между ним и Богом остается некая онтологическая дистанция? Говоря о сотворении человека по образу Бога и по подобию, мы, по сути, хотим сказать, что Бог в человеке повторяет Себя Самого. Мы говорим в Символе веры: «Верую во Единаго Бога Отца, Вседержителя, Творца небу и земли, видимым же всем и невидимым». Когда Бог творит человека, есть ли это творение существенно отличное от Него, нечто другое, не то, что Он? Или Он просто повторяет Себя в созданных по образу и по подобию и сообщает им Свою жизнь, как она у Него Самого от века? – Итак, Он не творит нового бытия, а призывает нас к участию в Его предвечной жизни.'
        cn: 肖似上帝——但问题是，到何种程度？因为我们可以谈论其无限性，因为这里指的是永恒。但我们也可以从另一个层面提出问题：人是否会变得与上帝绝对相似，抑或在他与上帝之间，仍存在某种本体论上的距离？当我们谈论人是照着上帝的形象和样式被造时，我们，本质上是想说，上帝在人里面重复了祂自己。我们在信经中说：「我信独一上帝，全能的圣父，创造天地万物以及一切有形无形之物。」当上帝创造人的时候，这个受造物是否与祂本质上有所不同，是某种不同的东西，而非祂本身？抑或祂只是在那些照着形象和样式被造者中重复祂自己，并将祂的生命赋予他们，正如祂自己从亘古就拥有那生命一样？——如此看来，祂并非创造新的存有，而是呼召我们参与祂的预永恒生命。
    - type: paragraph
      text:
        ru: 'Как монах-аскет, я привык мыслить, что нет никакой аскетики вне какой бы то ни было области культуры, или религии, или парарелигии, но каждое из явлений в истории человечества имеет свою идеологическую основу. Наша же «идеология» есть нечто более основное: это догматическая база; этомоментыв бытии Бога Самого, открытые нам через Откровение. Итак, чтобы наша монашеская жизнь текла разумно, нам нужно знать подвижничество наше как имеющее свою догматическую базу.'
        cn: 作为一名苦修修士，我习惯于这样思考：没有任何苦修是独立于任何文化领域、或宗教、或准宗教之外的，但人类历史上的每一种现象都有其意识形态基础。而我们的「意识形态」则更为根本：它是教义基础；它是上帝自身存在中的时刻，借着启示向我们显明。因此，为了使我们的修道生活明智地展开，我们需要了解我们的苦修是有其教义基础的。
    - type: paragraph
      text:
        ru: 'Я начал словами: «Я ничего не знаю», и теперь продолжаю эту мысль. Я не определяю себя сам, кто и что «есмь аз», но я следую верою Откровению свыше и приемлю его как познание о том, что Бог мыслит о человеке. По выражению Священного Писаниясотворим по образу Нашему и по подобиюмы есть подобие и образ Самого Бога. Никакая человеческая наука подобного дерзания не может себе позволить. Но в нашей дерзновенной молитве, в предельном страдании и смирении, Бог говорит нам о том, как Он мыслит о нас. Невозможно, чтобы мы соделались бытием само-сущным, безначальным – это принадлежит Самому Богу, но мы образ и подобие Его, и это надо понимать как содержание нашей жизни.'
        cn: 「我一无所知」，并且我现在继续阐述这个想法。我不自行定义我是谁和是什么，但我凭信跟随来自上方的启示，并接受它作为关于上帝如何看待人的知识。按照《圣经》的表述——「我们要照着我们的形像、按着我们的样式造人」——我们就是上帝本身的样式和形像。没有任何人类科学能够允许自己有如此的胆量。但在我们大胆的祷告中，在极度的苦难和谦卑中，上帝告诉我们祂如何看待我们。我们不可能成为自存、无始的存有——这唯独属于上帝本身——但我们是祂的形像和样式，而这必须理解为我们生命的内涵。
    - type: paragraph
      text:
        ru: 'Опять вопрос: в чем же заключается различие между Богом и нами? По выражению Отцов, то, что Бог есть по Своему безначальному естеству, по сущности Своей, тем человек становится – носителем сего, сей жизни – по дару благодати. Мы не становимся Ему единосущными; весь порядок нашей жизни в Боге удерживает тотмомент, что мы – тварь, а не по существу боги. Итак, в плане сущности мы отличаемся от Бога: неизменным остается в насмоменттварности. Выражаясь богословским языком, мы – подобие Богу в плане энергии, а не в плане сущности, и в этом порядке мы можем быть подобны Богу даже до тожества.'
        cn: 又一个问题：上帝与我们之间的区别何在？按照教父们的说法，上帝按其无始的本性、按其本质所是的那一切，人则是借着恩典的恩赐，成为这生命的承载者。我们不与祂同本质；我们在上帝里生活的全部秩序都保持着一个事实，即我们是受造物，而非本质上的神。因此，在本质层面，我们与上帝不同：我们受造的这一事实在我们里面保持不变。用神学语言来说，我们是在神能层面，而非本质层面与上帝相似，并且在这种秩序下，我们甚至可以相似于上帝，达到同一的程度。
    - type: paragraph
      text:
        ru: Сказанное мною есть цель, а не завершенное спасение. Мы можем стать подобными Ему до тожества только через жизнь по заповедям Его, через покаяние, достигая того, что заповедь Бога становится как бы единственным законом всего нашего бытия. Тогда нам передаются состояния Бога, и мы становимся способными воспринять их. Заповедь Христа превосходит наше нынешнее состояние падения. И заповедь, если мы ее творим, ставит нас пред весьма радостным откровением, что заповеди Бога суть не нечто «внешнее», а откровение Бога, как Он есть в Самом Себе. Между заповедью Бога и Им Самим нет никакого разногласия. Итак, не в настоящем состоянии падения, а в заключительном моменте нашего становления в Боге мы становимся носителями жизни Самого Бога. Итак, если Бог есть Персона, то мы становимся подобными Ему, как спасенные Им, и пребываем тварными персонами, но «преподобными» – подобными Самому Богу в веках до бесконечности.
        cn: 我所说的乃是目标，而非完满的救赎。我们唯有通过遵行祂的诫命而生活，通过悔改，方能达到与祂的完全肖似，直至上帝的诫命仿佛成为我们整个存有的唯一律法。届时，上帝的状态便会传予我们，我们也便能领受它们。基督的诫命超越我们目前堕落的状态。而诫命，若我们遵行它，便使我们面对一个极其喜乐的启示：即上帝的诫命并非某种「外在」之物，而是上帝在祂自身中的启示。在上帝的诫命与祂自身之间，没有任何不一致之处。因此，并非在我们目前堕落的状态中，而是在我们于上帝中得以成全的最终时刻，我们才成为上帝自身生命的承载者。因此，若上帝是位格，我们便会变得肖似于祂，作为被祂所救赎之人，并且仍是受造的位格，但却是「极肖似的」——即肖似上帝自身，在永世里直至无穷。
    - type: paragraph
      text:
        ru: 'Кратко я выразил вам сегодня то, что можно, и хорошо, положить в основу нашей монашеской жизни. Когда мы впадаем в это русло нашего богословского размышления, то встречаемся с мыслью: как проявляется персона-ипостась в жизни? Как она реагирует на все? Если мы остановим глаз наш духовный на этом, тогда жизнь наша станет более разумною и подобное «внимание» примет характер уже знания пути к Богу. Как всегда, я предлагаю вам обратиться к тому, что мы получили от нашего блаженного покровителя старца Силуана.'
        cn: 我今天已向你们简要地表达了那些可以、并且很好地作为我们修士生活基础的事物。当我们进入这神学思考的领域时，便会遇到一个念头：位格-本体如何在生活中显现？它如何回应一切？如果我们我们将我们属灵的眼睛聚焦于此，那么我们的生命将变得更加明智，而这种「留心」将具备通向上帝之路的知识的特质。一如既往，我建议你们参考我们从我们蒙福的庇护者圣西卢安长老那里所领受的。
    - type: paragraph
      text:
        ru: 'Итак, «мы есмы боги»[211]по содержанию нашей жизни, а не по сущности. Иначе говоря, даже до предела обоженные святые не являются Богом для человека, но суть боги по содержанию и по форме бытия своего. В чем подобие? Подобие – в образе бытия: как Бог живет, так и мы должны жить, когда реализуется наше спасение. А спасение, как мы всегда говорим, начинается с очень маленьких актов – послушания, покаяния, смирения, воздержания.'
        cn: 那么，「我们是神」[211]按我们生命的内容，而非按其本质。换言之，甚至那些达到极致被神化的圣徒对人类而言并非上帝，但按其生命的内容和形式而言，他们是神。相似之处何在？相似之处在于生命的样式：上帝怎样生活，我们也当如此生活，当我们的救恩实现之时。而救恩，正如我们常说的，始于非常微小的行动——即顺服、悔改、谦卑、节制。
    - type: paragraph
      text:
        ru: Итак, в аскетической жизни нашей нам надо войти в опыт того, как проявляется принцип ипостаси, персоны, в тварном человеке; каковы реакции человека-персоны на все происходящее кругом него и с ним; по каким словам его мы можем судить о том, насколько приближается он в своем мышлении к ипостасной форме бытия, свойственной персоне.
        cn: 那么，在我们的苦修生活中，我们需要进入一种体验，即位格（人格）的原则是如何在受造的人身上显现的；作为人格的人，对发生在他周围和发生在他身上的一切，都有哪些反应；凭着他的哪些话语，我们能够判断，他在他的思想中，在多大程度上接近了人格所特有的位格存在形式。
    - type: paragraph
      text:
        ru: Возьмем яркий и бесконечно могущественный пример проявления персоны в эпилоге Евангелия от Матфея. Господь говорит ученикам:Идите научите все народы[212]. В этом выражении «все народы», конечно, мы усматриваем уже Персону Бога. И это – Божественная форма бытия, которая объемлет все тварное.
        cn: 让我们来看一个鲜明且无限全能的位格彰显的例子，它出现在马太福音的结语中。主对门徒说：「去，教导万民[212]。」当然，在这个「万民」的表达中，我们已经看出上帝的位格。而这是一种神圣的存有形式，它涵盖着一切受造物。
    - type: paragraph
      text:
        ru: 'Как пример я могу вам привести сегодня в утешение слова нашего духовного покровителя Силуана. Он молился о том, чтобы Бог просветил все народы, всякого человека Духом Святым[213]. Из этой молитвы видно, что ему была дана благодать молитвы уже ипостасной. Приведу пример из писаний старца. Он говорит, что душа, познавшая Духом Святым Господа, мыслит так: «Когда я умру, то умолю Господа за весь христианский род». И опять приходит мысль: «Но как возможно, чтобы, созерцая вечный Лик Бога-Творца, я сохранил бы в себе память о твари?». И опять душа говорит: «И все-таки когда я явлюсь пред Богом, то умолю Его о всем человечестве»[214]. Видите, какая постепенность? Сначала он говорит, что, «когда умру, умолю Бога о всем христианском роде», потом вдруг возводится в созерцание вечного Лика Божиего и оттуда обращается уже более совершенно: «умолю о всем мире». В этом движении души, органически вполне нормальном, сказывается подвиг наш православный монашеский; и в сем писании нашего блаженного отца Силуана мы видим персону.'
        cn: 作为一个例子，今天我可以向你们引用我们属灵主保圣西卢安的话语，作为安慰。他祈求上帝借着圣灵光照所有的民族，每一个个体的人[213]。从这祷告中可见，他已经被赐予了位格化的祷告恩典。我将引用一个出自这位长老著作的例子。他说，借着圣灵认识了上主的灵魂会这样想：「当我去世时，我将为整个基督徒民族恳求上主。」而又一次，一个念头浮现：「但怎会可能，当我瞻仰造物主上帝永恒的圣容时，我还会心中存留对受造物的记忆呢？」而灵魂又说：「然而，当我出现在上帝面前时，我仍会为全人类恳求祂。」[214]你们看，这循序渐进是多么明显？首先他说，「当我去世时，我将为整个基督徒民族恳求上帝」，之后突然被提升至瞻仰上帝永恒的圣容，并从那里以更完全的方式转向上帝：「我将为全世界恳求。」在灵魂这种本质上完全正常的动向中，显明了我们东正教修道者的属灵操练；而在我们荣福教父圣西卢安的这篇著作中，我们看到了位格。
    - type: paragraph
      text:
        ru: Так, когда мы войдем в эту колею богословской мысли, тогда приобретем, как естественную и беструдную, способность контроля над своим умом, над своим сердцем. И молитва наша не будет только призыванием Бога в трагических положениях, но и умным разумением конечной цели Господа, Творца и Бога нашего.
        cn: 如此，当我们进入这种神学思想的轨迹，那时我们将获得一种自然的、不费力的能力，去控制自己的心智和心灵。我们的祷告将不再仅仅是在悲剧性的境况中呼求上帝，而且是对我们上主、造物主和上帝的终极目标的明智理解。
    - type: paragraph
      text:
        ru: Жизнь Самого Христа естественным образом сообщается нашему уму и сердцу. Не как-то нарочито, но каким-то естественным движением души мы живем трагедию всего мира особенно в наши дни, когда сотни миллионов людей стоят на грани смерти от голода. Наша Литургия становится приношением за все человечество.
        cn: 基督本人的生命自然地临在于我们的心思和心灵。这不是出于刻意，而是借着灵魂某种自然的律动，我们体验着整个世界的悲剧，尤其是在我们这个时代，当亿万人正处于饿死的边缘时。我们的礼仪成为为全人类所作的献祭。
    - type: paragraph
      text:
        ru: Итак, дорогие мои братья и сестры, сохраним всю серьезность нашего пути монашеского! Аминь.
        cn: 因此，我亲爱的弟兄姊妹，让我们持守我们修道之路的全部严肃吧！阿们。
  - type: heading2
    text:
      ru: 'Беседа 25: О поучении в смирении Христовом[215]'
      cn: 第二十五讲：论在基督谦卑中的教诲[215]
    children:
    - type: paragraph
      text:
        ru: 'Пост – время подражания Христу. О духовной последовательности жизни Христа: Кесария, Фавор, Голгофа. Апостолы – свидетели Божества на Фаворе. Об усвоении жизни Христа. Чаша Христа – Его истощание – недостижима человекам. Исход Христа как явление Его Божественного смирения. «Будьте как дети». Непостижимость победоносного истощания и смирения Христа. Смущение из-за рабских форм нашего покаяния. Пример Господа и Его смирения. Духовники должны уподобляться Христу в Его самоуничижении. О страдании христиан в России. Чем глубже подражание Христу, тем ярче в нас ипостасное начало'
        cn: '斋期——效法基督的时节。


          关于基督生命中的灵性进路：凯撒利亚、塔博尔山、各各他。使徒们——在塔博尔山上神性的见证人。关于活出基督的生命。基督的苦杯——祂的虚己——是人无法企及的。基督的离世，是祂神性谦卑的彰显。「你们要像小孩子。」基督得胜的虚己和谦卑是不可测度的。因我们奴仆式的悔改形式而感到困惑。主的榜样和祂的谦卑。神师们应当在基督的自我虚己中效法祂。关于俄罗斯基督徒的苦难。对基督的效法越深，我们里面的位格性源始就越发彰显。'
    - type: paragraph
      text:
        ru: 'Как нам сделать жизнь Христа нашей жизнью? – Читая Евангелие и другие книги, узнавая о том, как провел Свою жизнь Господь на Земле, – мы, по совету Самого Христа, следуем Его «примеру»[216]: Он дал нам образ, как надо жить, чтобы нейтрализовать последствия греха нашего праотца Адама. И видя, как действовал Христос, так и мы стараемся действовать, и особенно посвящено этому время Великого поста. Господь пришел на землю, чтобы спасти Адама. Адам сделал попытку стать богом помимо Бога. Такой гордый порыв! А Господь открыл нам, что Он, Творец всего сего космоса, – Он смиренен в сердце Своем.'
        cn: 我们如何让基督的生命成为我们的生命？ – 通过阅读福音书和其他书籍，了解主在世上是如何度过祂的生命的，我们，按照基督本人的建议，追随祂的「榜样」[216]：祂给了我们一个榜样，教导我们如何生活，以抵消我们原祖亚当罪的后果。并且，看到基督如何行事，我们也努力照样行事，尤其是大斋期的时间，就是为此而奉献的。主来到地上，为要拯救亚当。亚当曾试图在上帝之外成为神。这是多么骄傲的冲动！而主则向我们启示，祂，这整个宇宙的造物主，在心中是谦卑的。
    - type: paragraph
      text:
        ru: Церковное последование Великого поста, Страстной недели и Воскресения немного отличается от исторического хода событий, ибо шествие Христа на Голгофу началось с того момента, когда апостолы уже исповедали Его не только как великого пророка, но и как Сына Божия, единосущного Отцу. Этот момент чрезвычайно важен.
        cn: 大斋期、圣周和复活节的教会仪轨与历史事件的进程略有不同，因为基督前往髑髅地的历程始于使徒们已经宣认祂不仅是伟大的先知，而且是与父同质的上帝之子那一刻。这一刻至关重要。
    - type: paragraph
      text:
        ru: 'В течение Своей земной жизни Господь несколько раз избегал смерть – Его хотели побить камнями. Не зная, о чем идет речь, мы могли бы сказать: «Вот, Ты пришел умирать за нас, но вот мы видим, что Ты уклоняешься, когда Тебя хотят побивать камнями». Но Иоанн Богослов прекрасно говорит: «Его час еще не пришел»[217]. Надо было, чтобы ученики не только исповедали устами Петра, что Он – Сын Божий, но действительно узрели бы сие откровение и могли быть свидетелями Его Божества. Когда они шли в Кесарии Каппадокийской, тогда Господь спросил: «А вы за кого Меня считаете?». И Петр ответил Ему: «Ты – Христос, Сын Бога живаго». После этого Господь говорит: «Среди вас есть некоторые, которые узрят Царство в силе еще прежде, чем они покинут этот мир». Шествие к горе Фавор продолжалось приблизительно шесть дней, молча. Взошли на гору с Ним Его обычные сомолитвенники: Петр, Иаков и Иоанн. И Христос молился – и явились Ему два мужа, как говорит Лука-евангелист, – Моисей и Илия, наиболее яркие представители всего Ветхого Завета. И они беседовали со Христом о Его предстоящем исходе во совершение Его дела искупления Адама.'
        cn: 在祂尘世生命中，主几次避开了死亡——人们曾想用石头打死祂。若不明白事情的真意，我们或许会说：「看哪，祢是为我们而死，但我们看到，当人们想用石头打死祢时，祢却躲开了。」但是，福音书作者约翰说得极好：「祂的时候还没有到」[217]。必须如此，为要使门徒们不仅藉彼得之口宣认祂是上帝之子，而且要真正看见这启示，并且能成为祂神性的见证人。当他们在卡帕多西亚的凯撒利亚时，那时主问道：「你们认为我是谁？」彼得回答祂说：「祢是基督，永生上帝之子。」此后，主说：「你们中间有些人，甚至在他们离开这个世界之前，将会看到上帝的国带着能力降临。」前往他泊山的行程大约持续了六天，寂静无声。与祂一同上山的是祂平时一同祷告的同伴：彼得、雅各和约翰。基督在祷告——于是有两个人向祂显现，正如福音书作者路加所说，就是摩西和以利亚，他们是整个旧约最杰出的代表。他们与基督交谈，关于祂即将到来的离世，为要完成祂对亚当的救赎工作。
    - type: paragraph
      text:
        ru: После того как апостолам на горе Фавор явлено было нетварное Божество Христа и тем самым появились свидетели Его Божественного характера как Единородного Сына, от Отца рожденного, Христос мог позволить уже отдать Себя на смерть ради искупления Адамова греха. Иначе – если бы не было на земле никакого свидетеля Божества Христа – Его считали бы в лучшем случае одним из величайших пророков. Но, по нашей вере, Христос не был только пророк в обычном смысле этого слова, хотя в Его служении есть элемент пророческий; но Сам Он не от плоти рожденный человек, а воплотившийся Бог.
        cn: 在塔博尔山，当基督的非受造性神性向使徒们显现，从而出现了祂作为由父所生的独生子的神性特质的见证人之后，基督便可以允许自己为赎买亚当的罪而献身于死亡。否则——如果世上没有任何基督神性的见证人——祂充其量只会被视为最伟大的先知之一。但是，根据我们的信仰，基督并非只是寻常意义上的先知，尽管在祂的事奉中有先知的要素；祂自己并非肉身所生的人，而是道成肉身的上帝。
    - type: paragraph
      text:
        ru: 'Мне всегда печально, что праздник Преображения Господня перенесен из этого исторического хода событий на август и заменено это празднование в начале Великого поста воспоминанием об Адаме. Мне кажется, что было бы возможным сохранить последовательность, когда после того, как Господь преобразился на горе, Он уже прямо пошел на Голгофу, потому что были свидетели Его Божества. То есть, когда появились эти свидетели[218], Христос мог уже пойти на подвиг, обратный тому, что совершил Адам. Нам, христианам, свойственно видеть единого Человека, восходящего на Голгофу с идеей взять на себя грехи всего мира. Непонятным никому другому образом Он совершил этот подвиг ради спасения всего Адама: путь к искуплению Адама и подвиг Его превосходят наше разумение. Господь говорит апостолам Иакову и Иоанну, которые восхотели сестьодеснуюи ошуюю Его: «Можете ли вы пить чашу, которую Я пью, и креститься крещением, которым Я крещусь?». Это было и трогательно, и наивно, как с их стороны последовал такой ответ: «Можем!»[219]. Никто из человеков не может испить чашу Христа и совершить подобно Ему свое истощание. Говоря о снисхождении Христа, о Его kenose-истощании, мы стоим перед картиною, которую никак не можем уразуметь простым нашим мышлением. Он – безраздельный Владыка всего мира, и Он отдает Себя на все унижения.'
        cn: 我总是感到忧伤，因为主的显圣容节从这一历史事件的进程中被移至八月，并且在大斋期开始时，这一庆节被亚当的纪念所取代。我认为，保持这一连贯性是可能的，即当上主在山上显圣容之后，祂就直接走向了髑髅地，因为有了祂神性的见证者。也就是说，当这些见证者出现时[218]，基督就可以去完成一项圣功，与亚当所行的相反。我们基督徒惯于如此看待：一位独一之人，登上髑髅地，怀着担当全世界罪孽的意念。祂以旁人无法理解的方式，完成了这项圣功，为了拯救全体亚当：救赎亚当的道路和祂的圣功，都超越了我们的理解。上主对使徒雅各和约翰说，他们曾想坐在祂的左右两边：「你们能喝我所喝的杯，受我所受的洗吗？」这既感人又天真，因为他们的回答竟是如此：「我们能！」[219]。没有任何世人能够饮尽基督的杯，并像祂一样完成自我的虚己。谈到基督的降卑，谈到祂的虚己——倾空，我们面对着一幅景象，我们绝无法以我们简单的思维来理解。祂是全宇宙无上的主宰，并且祂甘愿承受所有的屈辱。
    - type: paragraph
      text:
        ru: 'Однако мы постепенно проникаем в тайну любви Бога к нам. Мы как-то начинаем ощущать через откровение Христа, что Бог есть смирение. Этим объясняется, что любовь Его не гордая, а смиренная. И этот характер Божественного смирения Христа проявляется в Его словах, когда Он поставил маленького мальчика перед Собою и сказал: «Если кто не станет подобен сему мальчику, тот не способен к Царству Небесному»[220], или когда Он говорил, что наименьший будет великим в Царствии Божием. Видите опрокинутую пирамиду устроения человеческого общества? Смиренные унаследуют Царство прежде всего.'
        cn: 然而，我们渐渐地深入上帝对我们之爱的奥秘。我们某种程度上开始借着基督的启示感受，上帝就是谦卑。这就解释了，祂的爱不是骄傲的，而是谦卑的。而基督这种神圣谦卑的特质，显明在祂的话语中，当祂把一个小男孩放在自己面前说：「若不变得像这小孩，就不能进入天国」[220]，或者当祂说，那最卑微的将在上帝的国里成为伟大的。你们看见人类社会体系那颠倒的金字塔了吗？谦卑的人将首先继承天国。
    - type: paragraph
      text:
        ru: Итак, когда мы знаем, что Христос есть Бог, мы стараемся проникнуть в тайну всех Его проявлений. «Никтоже приидет ко Отцу, токмо через Христа», единосущного Отцу Сына Божия, и мы всячески стараемся во все проявления нашей жизни влить смысл, чтобы жизнь Самого Христа стала нашей, чтобы нам унаследовать Царство вечное со Отцем и Сыном и Святым Духом.
        cn: 于是，当我们知道基督是上帝时，我们努力深入祂一切显现的奥秘。「无人能到父那里，唯独藉着基督」，即是与父同体的上帝之子。我们竭力将意义注入我们生命的一切显现之中，好使基督自己的生命成为我们的，好使我们与父、子和圣灵一同承受永恒的国度。
    - type: paragraph
      text:
        ru: 'Господь смирением победил врага. Помимо сего основного положения есть еще один аспект в Его проявлениях, который нас научает подражать Христу не как-то просто в воображении. Христос явился в «рабьем зраке»[221]. И в чем для многих соблазн и «скандал»? – Мне много раз пришлось слышать мнение людей, что мы, человеки, образ Божий, должны сохранить свое достоинство даже в молитве и в наших предстояниях Богу. У нас в монастыре был с визитом некто, занимающий высокое положение в инославной Церкви. Глядя на фреску Преображения, он спросил: «А где же Петр?». – Ему указали Петра. – «О, что вы сделали с ним! Петр в таком унижении! Где же его dignity, его достоинство?!».'
        cn: 上主以谦卑战胜了仇敌。除了这核心要义之外，祂显现的另一方面也教导我们，并非仅仅凭想象来效法基督。基督以「奴仆的形像」[221]显现。而对许多人而言，其诱惑与「冒犯」又何在呢？——我曾多次听闻人们的观点，认为我们人类，作为上帝的肖像，即便在祷告中以及在我们的侍立上帝面前时，也应当保守自己的尊严。我们修道院曾有位访客，是位在非东正教教会中身居高位者。他看着一幅变容节的湿壁画，问道：「彼得在哪里？」——人们指给他看彼得。——「哦，你们对他做了什么！彼得竟如此受辱！他的尊严，他的dignity又在哪里呢？！」
    - type: paragraph
      text:
        ru: 'И есть одна сторона православного покаяния пред Богом, которая смущает многих инославных: мы падаем на колени на землю, мы лицом и лбом своим прикасаемся к земле и тем выражаем наше рабство перед Ним, помня Его слова, которые Он сказал перед этим мальчиком: «Если кто не смирится так, как сей мальчик, то не войдет в Царство Небесное».'
        cn: 并且，东正教在上帝面前悔改的一个方面，让许多异信者感到困惑：我们跪倒在地，我们用脸和额头触碰地面，并以此表达我们在祂面前的奴仆身份，铭记祂在那个小男孩面前所说的话：「若有人不谦卑自己像这小男孩一样，就不能进天国。」
    - type: paragraph
      text:
        ru: 'Но Сам Господь, без Которого ничто не может произойти, – Он умалил Себя до такой степени, что люди самого низкого социального класса могли Его оскорблять, плевать на Него, ударять Его, давать Ему пощечины, и причинять всяческие другие унижения. Если Сын Божий совершил сие, то, конечно, стоит вопрос: почему понадобилось такое унижение и такие рабские формы для выражения любви? – Я полагаю, что правильною мыслью будет то, что Господь, имея предвечное бытие Свое в духе смирения, выразил Свою предвечную любовь в рабских формах. И мы следуем Ему в этих рабских формах проявления нашего покаяния пред Богом, выражающихся в земных поклонах. Мы постом делаем огромное число поклонов на каждый день. Потом, когда после распятия нашего мы совоскреснем со Христом, то уже будем принимать Его и беседовать с Ним стоя, как сыны с отцом. Но в сей жизни мы будем выражать наше покаяние, подчеркиваю, в рабских формах, потому что покаяние не унижает человека. Когда кто сознает себя хуже всякой твари, тогда он бывает выше всякой твари: тогда он прикасается нетварному бытию. Итак, не смущайтесь выражать в низших рабских формах наше покаяние, чтобы потом мы стояли, как сыны Божии пред Богом, уже не в рабских формах, а сыновних.'
        cn: 但上主自己，离了祂，就一无所成——祂自卑到了一个地步，以至于最下层社会的人能够侮辱祂、向祂吐唾沫、殴打祂、掌掴祂，并施加各种其他羞辱。既然上帝之子行了此事，那么，当然就有一个问题：为何需要如此的自卑与如此奴仆般的形貌来表达爱？——我以为正确的想法是，上主在谦卑之灵中拥有祂的先在永恒存有，并以奴仆般的形貌表达了祂的先在永恒之爱。我们也效法祂，以这些奴仆般的形貌来表达我们向上帝的悔改，这些形貌体现在俯伏叩拜之中。我们在斋戒中每日行大量的叩拜。然后，当我们被钉十字架之后，与基督一同复活时，我们就将站立着迎接祂并与祂交谈，如同众子与父亲一般。但在此生中，我强调，我们将以奴仆般的形貌表达我们的悔改，因为悔改并不贬低一个人。当人自觉比万物都差劣时，那时他就高于万物：那时他就触及了非受造的存有。因此，不要感到不安，以最卑微的奴仆形貌来表达我们的悔改，好使我们日后能像上帝之子般站立在上帝面前，不再以奴仆般的形貌，而是以儿子的形貌。
    - type: paragraph
      text:
        ru: 'Бог смиренен в самом существе Своем, и Его истощание чрез воплощение носит характер смирения. Если бы Он Сам не смирялся, тогда, может быть, мог бы нас кто-то обвинить: «Но ведь Господь не смирялся так, как вы». Но Господь смирился: мыл ноги мужикам безграмотным, людям самых низких слоев общества человеческого. Итак, эти формы рабские есть любовь. Когда мы молимся Богу, Который повелением Своим создал весь этот космос, каждому из нас свойственно думать: «Ну, станет ли Господь думать обо мне, приклонит ли Он теперь к моему слову ухо Свое, чтобы внимательно послушать меня?». Нам страшно говорить с таким Существом. И чтобы мы не боялись, во всех проявлениях Христа в Его всекосмическом акте искупления Адама есть любовь смиренная Бога, когда Он предстает пред нами в таких жалких формах: Он был распят среди разбойников, брошен в тюрьму и так далее.'
        cn: 上帝在其本体中是谦卑的，祂借着道成肉身的虚己带有谦卑的特质。倘若祂自己不谦卑，那么，也许会有人指责我们：「但是上主并没有像你们这样谦卑啊。」但上主却谦卑了：祂洗了那些不识字的农夫的脚，洗了人类社会最底层的人们的脚。因此，这些仆役的形式就是爱。当我们向那一位上帝祷告时，祂以自己的命令创造了整个宇宙，我们每个人都会自然而然地想：「唉，上主会想到我吗？祂现在会垂听我的话语，仔细听我说话吗？」我们感到害怕与这样的存在对话。为了使我们不致恐惧，在基督所有的显现中，在祂救赎亚当的宇宙性行动中，都有上帝谦卑的爱，当祂以如此卑微的形式出现在我们面前时：祂被钉在十字架上，与强盗同列，被投入监狱，等等。
    - type: paragraph
      text:
        ru: 'Я позволю себе сейчас высказать приходящую мне мысль о действиях духовных отцов. Иногда и духовные отцы уподобляются Христу в Его самоунижении, чтобы люди не смущались и не боялись говорить духовнику какие угодно грехи. И духовник все несет: «О, это я знаю! О, это так мы, люди, поступаем!».'
        cn: 我现在斗胆提出一个我心中浮现的，关于灵性父亲们行事方式的想法。有时，灵性父亲们也会效法基督在祂的自我谦卑中，好叫人们不至于困惑不安，也不至于害怕对他们的灵性父亲说出任何种类的罪愆。于是，灵性父亲默默承受这一切：「哦，这我知道！哦，我们人类就是如此作为的！」
    - type: paragraph
      text:
        ru: Эта традиция мне стала знакомою, когда я был в пустыне на Афоне. Мне рассказывали про некоторых духовников, знаменитых тем, что к ним приходили грешники, совершившие много преступлений, и уже не боялись говорить им. Будучи святым, отец брал на себя все грехи, чтобы дать мужество исповеднику высказать свои деяния.
        cn: 这项传统，是我在阿索斯山的隐修地时所了解的。他们告诉我，有一些神师因这样的事迹闻名：犯下诸多罪行的罪人会来找他们，并且不再害怕向他们倾诉。作为一位圣者，这位神父承担了所有的罪，为的是给予告解者勇气，使他能够说出自己的行为。
    - type: paragraph
      text:
        ru: 'Теперь перейдем к нашему вопросу. Чем больше человек старается подражать Христу, тем в большей мере он становится ипостасью по образу Ипостаси воплощенного Логоса. И когда человек старается жить со Христом, призывая Его имя и размышляя о Его жизни, и действовать так, как действовал или отвечал бы в Своих реакциях Господь, то постепенно создаетсяперсона: образ и подобие Ипостаси Самого Бога. Земной человек, зараженный гордостью первого грехопадения, должен прийти в иное сознание – к раскаянию в нашем преступлении гордом против Бога смиренного.'
        cn: 现在我们来谈谈这个问题。一个人越是努力效法基督，他就越是在道成肉身的圣言的位格的肖像中，成为一个位格。当一个人努力与基督同活，呼求祂的名，默想祂的生平，并照着主所行或祂在回应中所作的那样去行事时，一个位格便逐渐形成，即上帝本人的位格的肖像与样式。凡被首次堕落的骄傲所感染的尘世之人，必须达致另一种意识——为我们骄傲地干犯谦卑的上帝之罪行而悔改。
    - type: paragraph
      text:
        ru: Конечно, всегда, когда мы читаем Нагорную беседу Христа, ощущаем чрезвычайно сильный огонь. Если посмотреть, как Господь заповедал нам вести себя и как Он Сам вел Себя, то в наших земных условиях современности мы должны были бы жить, как христиане первых веков. Поражающее вдохновение трех первых столетий вошло в историю человечества. Уже в апостольских посланиях есть слова о том, что первые христиане терпели все гонения, отнятие имуществ, лишение прав и жизни. И ныне послал Господь пить эту чашу людям, живущим в большой стране, где семьдесят лет бушевало демоническое гонение. И многим миллионам людей православной России было дано умирать за исповедание Христа...
        cn: 当然，每当我们阅读基督的《登山宝训》，便会感受到一股异常炽热的火焰。若是审视上主如何教导我们行事为人，以及祂自身如何行事，那么在我们现今的世俗环境中，我们本应像初代基督徒一样生活。那令人震撼的灵感，在最初的三个世纪里融入了人类历史。早在使徒书信中就有提及，初代基督徒忍受了一切的迫害，财产被剥夺，权利与生命被褫夺。而今，上主使生活在一个大国中的人们饮此苦杯，在那里，恶魔般的迫害肆虐了七十年。而数百万俄罗斯东正教徒被赋予了为主基督的信仰而死的恩典……
    - type: paragraph
      text:
        ru: Жутко говорить о некоторых формах, которые принимает настоящее отступление от Христа. Вы знаете, что некоторые книгоиздательства отказываются брать духовные книги. И даже те издательства, которые были основаны с целью их издания, переходят постепенно к тому, что духовные книги у них в последней категории. Я боюсь, что такое презрение к религии опаснее открытых демонических гонений.
        cn: 令人心悸的是，谈及如今背离基督的叛教所呈现的某些形式。你们知道，一些出版社拒绝出版属灵书籍。甚至连那些当初成立旨在出版这类书籍的出版社，也逐渐将属灵书籍列为他们出版的最后一类。我担心，这种对宗教的蔑视比公开的魔鬼迫害更为危险。
    - type: paragraph
      text:
        ru: 'И наш подвиг, невидимый ни для кого, остается во всей своей силе в глазах Бога. И мы должны были бы поступать так, как говорит Господь: они хотят взять у тебя твою рубашку – отдай им и хитон; они хотят, чтобы ты работал на них одно поприще, – работай вдвое больше; молитесь за обижающих вас, молитесь за гонителей, молитесь за всех тех, которые творят злое против вас. И тогда, говорит Господь, любя врагов ваших, и вы станете сынами Всевышнего Отца.'
        cn: 我们的善功，虽无人可见，但在上帝眼中，仍保有其全部力量。而我们应当按主所说的去行：他们若要取你的衬衫，连外衣也给他们；他们若要你为他们走一里路，就走两里；要为那侮辱你们的祷告，为那迫害你们的祷告，为所有那些对你们行恶的祷告。于是，主说，爱你们的仇敌，你们就将成为至高者天父的儿女。
    - type: paragraph
      text:
        ru: 'Вы видите теперь структуру духовной жизни и сохраните ее в вашем сознании. О ней говорить можно без конца, ибо это есть Нетварный Свет в своих земных проявлениях. Это есть совершенство, которое выражается в самых маленьких и низких работах. Так мы приготовляемся восходить на Голгофу со Христом, чтобы потом с Ним и воскреснуть, по словуИоанна Дамаскина: «Сораспинахся Тебе вчера, днесь восстаю с Тобою в славе Воскресения».'
        cn: 您现在看到了属灵生命的结构，并将其铭记于心。关于它，可以永无止境地谈论，因为这正是非受造之光在其属世的显现中。这正是完美，它体现在最微小和最卑微的工作中。如此，我们预备自己与基督一同登上加略山，以便日后与祂一同复活，正如大马士革的圣约翰所言：「我昨日与祢同钉十架，今日与祢一同复活，在复活的荣耀中。」
    - type: paragraph
      text:
        ru: Сегодня наша маленькая беседа нам дорога тем, что она всецело связана со Христом. И берегите это достояние – нашу любовь ко Христу, потому что нет ничего большего во всем космическом бытии. Нет ничего более святого, более мудрого, более прекрасного для созерцания, чем Христос...
        cn: 今天我们的小小交谈之所以珍贵，是因为它全然与基督相连。请珍视这份宝藏——我们对基督的爱，因为在整个宇宙万有中，再没有什么比这更伟大的了。再没有什么比基督更神圣、更智慧、更美丽可供默观的了……
    - type: paragraph
      text:
        ru: Да хранит вас Господь, мои дорогие.
        cn: 愿主护佑你们，我亲爱的。
    - type: paragraph
      text:
        ru: И возгревайте в себе этот огонь любви ко Христу!
        cn: 并且在你们里面挑旺这爱基督的火！
  - type: heading2
    text:
      ru: 'Беседа 26: О трех периодах духовного роста и о тайне рождения слова в сердце[222]'
      cn: 第二十六讲：关于灵性成长的三个时期和圣言在心中诞生的奥秘[222]
    children:
    - type: paragraph
      text:
        ru: Когда слово вдохновлено Духом Святым. О языке богословских выражений. О необходимости знания этапов духовной жизни. Путь христиан – подобие воплощенному Слову. О трех периодах духовной жизни. Великая схима как молитва за весь мир. ОПарфении Киевском. О признаках второго и третьего периодов духовной жизни. О духовном росте. О пользе наших собраний
        cn: '当言语蒙圣灵启发之时。

          关于神学表达的语言。

          关于认识属灵生命阶段的必要性。

          基督徒的道路——肖似道成肉身之圣言。

          关于属灵生命之三个阶段。

          大圣袍——为普世所献的祷告。

          关于基辅的帕尔费尼。

          关于属灵生命第二与第三阶段的标志。

          关于属灵成长。

          关于我们聚会的益处。'
    - type: paragraph
      text:
        ru: 'Во святом Евангелии мы читаем следующие слова – Господь сказал:Когда же поведут предавать вас, не заботьтесь наперед, что вам говорить, и не обдумывайте, но что дано будет вам в тот час, то и говорите, ибо не вы будете говорить, но Дух Святый[223]. В известной вам книге о Силуане говорится, как он с большим вниманием слушал чудного кавказского подвижника Стратоника на приеме в келлии отца Досифея. И на другой день при встрече со Стратоником Силуан задал вопрос: «Как говорят совершенные?». Стратоник попросил: «Скажите Вы мне сами об этом», и Силуан ответил: «Они не говорят от себя, от своего ума, но только то, что дает им Дух»[224]. Уже не один раз я говорил с вами о тайне рождения слова в сердце человека по молитве. Эти два источника – Священное Писание и беседы Силуана со Стратоником – легли для меня в основу моих бесед с вами, когда я говорил с закрытыми глазами, без всякой предварительной подготовки, оставляя за молитвой руководство всем ходом моей беседы. Вскользь здесь замечу, что Дух в таких случаях ищет видеть всех присутствующих и направляет слово Свое в зависимости от восприимчивости того или иного лица из присутствующих. Этим объясняется то явление, что Дух говорит просто и о вещах примитивных.'
        cn: 在圣福音书中，我们读到以下的话——主说：「当人把你们带去交官的时候，不要预先思虑要说什么，也不要筹划；但在那个时刻赐给你们什么，就说什么，因为说话的不是你们，而是圣灵[223]。」你们熟知的关于圣西卢安的书籍中提到，在多西菲修士的隐修室里的一次会面中，他如何全神贯注地聆听了奇妙的高加索苦修者史特拉托尼克。而第二天，当他再次遇到史特拉托尼克时，圣西卢安提出了一个问题：「完全人是如何说话的？」史特拉托尼克请求道：「请您自己告诉我吧。」而圣西卢安回答说：「他们不是凭自己，不是凭自己的心思说话，而只说圣灵所赐予他们的[224]。」我已不止一次地和你们说过关于藉着祷告在人心中生出话语的奥秘。这两个来源——圣经和圣西卢安与史特拉托尼克的对话——构成了我与你们交流的基础，当我闭着眼睛，没有任何事先准备地说话时，将我所有交流的引导权交托给祷告。在此我顺便指出，在这种情况下，圣灵寻求洞悉所有在场的人，并视乎在场每个人的领受能力而引导祂的话语。这就解释了这样一种现象：圣灵说话简单明了，并且谈论的是简朴的事物。
    - type: paragraph
      text:
        ru: Когда же перед нами встает вопрос создания теории, тогда человеческая речь может уклоняться от примитивных начал к более сложному языку. Вы знаете, сердце мое жаждет, чтобы все вы научились этому таинству, сей великой культуре духа.
        cn: 当我们面临建立理论的问题时，人类的言语就可能从原始的开端转向更复杂的语言。你们知道，我的心渴望你们所有人都学会这奥秘，这伟大的精神文化。
    - type: paragraph
      text:
        ru: Но сегодня мое внимание остановлено на создании богословской теории нашей жизни в надежде, что придет день, когда в вашем разумном сознании укрепится правильное понимание и слов Священного Писания, и примеров Святых. Закончу пока на этом малом замечании о великой «нетайной тайне» культуры духа, в надежде, что Господь даст нам время «поучаться день и ночь в Его слове»[225], где каждое слово «разжено зело».
        cn: 但我今日的关注点在于建立一种关于我们生命的神学理论，盼望有一天，在你们理性的意识中得以巩固对圣经话语和圣徒榜样的正确理解。暂且以这小小的评论作结，关于精神文化的伟大「非秘密的奥秘」，盼望上主赐予我们时间，「昼夜思想他的话语」[225]，其中每个字都「极其灼热」。
    - type: paragraph
      text:
        ru: И ныне, как всегда при встрече с вами, у меня есть чувство, что то, о чем мы будем беседовать, уже укрепилось в вашем сознании. И все же сегодня решаюсь говорить с вами на одну тему, весьма болезненную в жизни нашей Церкви. Тема сия касается духовников и настоятелей-игуменов. Когда на кого-либо выпадает пастырское или духовническое служение, то очень часто лицо, избранное на сие служение в Церкви, само не знает, с чего начинать, что в середине, к чему стремиться и чем кончать. Так было бы и со мною, когда монастырь святого Павла на Святой Горе попросил меня взять на себя служение духовника для монашествующих. Но по промыслу Бога призыв на это служение был предварен встречей с блаженным старцем Силуаном. Мне хочется, во-первых, подчеркнуть тот факт, что с явлением Господа старцу Силуану было сообщено состояние совершенных. Таким образом, я знал, если не из своего опыта, то из опыта старца, о конечной цели нашей христианской жизни на земле. Но это знание еще не давало бы мне полноты видения, и, естественно, у меня возникла нужда – видеть весь этот путь от начала до конца, без чего я был бы неспособен к духовническому служению святым аскетам Афона. Так возникло во мне сознание необходимости не только опытного познания, но и придания ему теоретической формы. Иными словами, мне нужно было найти богословское основание в библейском ветхозаветном и новозаветном Откровении.
        cn: 而今，一如既往，每当我与您们相遇时，我总感觉我们即将谈论之事，已在您们意识中扎根。然而今日，我仍决意与您们谈论一个在教会生活中非常痛苦的议题。此议题关乎神师与院长-修道院住持。当某人蒙召承担牧养或神师之圣职时，那个被教会选立担任此圣职的人，常常自己也不知道该从何开始，如何在其间行事，当追求什么，又如何结束。若非如此，我亦会如此，当时圣山上的圣保罗修道院请求我承担修士们的灵修导师（神师）圣职。但因着上帝的旨意，这份圣职的呼召，先于我与蒙福长老圣西卢安的相遇。我首先要强调一个事实，即当上主向长老圣西卢安显现时，他蒙受了全备圣者的境况。因此，我便知道了我们基督徒地上生命的最终目标，即便非出自我的经验，亦出自长老的经验。然而，这知识尚未给予我完整的洞见，自然而然地，我便产生了一种需要——即要从始至终地看清这整个道路，否则我将无力承担亚丰圣隐修士的神师圣职。于是，我内心便生发了一种意识，即不仅需要经验性的认识，而且需要为其赋予理论形式。换言之，我需要从圣经旧约与新约的启示中找到神学上的基础。
    - type: paragraph
      text:
        ru: 'Так во мне зародилось познание пути Божия: мы призваны достигнуть уподобления воплощенному Слову Отчему. И это я хотел объяснить вам за последние годы в моих беседах, касающихся проблемы персоны. Я имел пред собою пример первых и первоверховных апостолов Христа. Некоторые из них изложили отчасти, как они восприняли Христа Бога, но наиболее полное изложение апостольского откровения мы находим в посланиях апостола Павла. Однако даже и он был бы неспособен создать окончательную систему богословия, не требующую никакого пополнения.'
        cn: 如此，在我心中萌生了对上帝之路的认识：我们受召以达致与道成肉身的父的道的肖似。而这正是我在过去几年里，在我那些关于位格问题的讲论中，想要向你们阐明的。我以基督的首批及首席使徒们为榜样。他们中的一些人，部分地阐述了他们如何领受了基督上帝，但我们发现，使徒启示最完整的阐述，是在使徒保罗的书信中。然而，即使是他，也无法建立一个终极的神学体系，无需任何补充的。
    - type: paragraph
      text:
        ru: 'Итак, в данный момент дерзнем со смиренной молитвой приложить к уже данным нам сведениям результаты нашей эпохи и нашего времени. Начнем с теории трех периодов, о которой говорили Силуан и Стратоник: как действует благодать призвания на первых шагах нашего познания путей через непосредственное учение от Бога. Этот период – основоположный для всей нашей жизни. Он длится в среднем до семи лет. После начнется другой опыт: отнятие ощутимой благодати, когда от каждого аскета ожидается жизнь, как если бы первая благодать совершенная непрестанно пребывала с ним в своей силе. Это для того, как говорил блаженный Силуан, чтобы мы сами проявили мудрость и жили непорочно все, чему научила нас благодать за первый период. И сам Силуан говорил, что все, чему научила его благодать, он хранил всю свою жизнь[226].'
        cn: 那么，此刻，我们敢于怀着谦卑的祷告，将我们时代和此时的成果附加上已赐予我们的知识。我们将从锡路安和斯特拉托尼克所论及的三阶段理论开始：召叫的恩典如何在我们认识上帝之道最初的几步中，借着来自上帝的直接教导而发挥作用。这个时期是我们整个生命的基础。它平均持续至多七年。之后将开始另一种经验：可感知的恩典被收回，此时，每一位苦修者都被期待过一种生活，仿佛那最初的、完美的恩典始终以其力量与他同在。蒙福者锡路安曾说，这是为了让我们自己展现智慧，并且在恩典于第一个时期所教导我们的一切事上，过着纯洁无瑕的生活。锡路安自己也曾说，恩典所教导他的一切，他一生都持守着[226]。
    - type: paragraph
      text:
        ru: Характерным для второго периода является то, что понятие или сознание греховных движений в нас обостряется и утончается. И у аскета создается впечатление, что он потерял благодать и уже духовно не прогрессирует, а регрессирует. И это впечатление может привести нас к тому, что мы будем искать прошлых наших состояний как лучших перед Богом. И вот, как это ни странно, это неверно! Ибо второй период есть доверие Бога к аскету, который уже сохранил доверенное ему богатство, после чего оно из неправедного превращается в вечное обладание человека. Господь это выразил в притче о неправедном богатстве, согласно Евангелию от Луки[227].
        cn: 第二个时期的特点是，我们内在罪性冲动的观念或意识变得更加敏锐和精微。于是禁欲者会产生一种印象，认为自己已失去了恩典，并且在灵性上不再进步，反而退步了。而这种印象可能导致我们寻求过去的状态，认为它们在上帝面前是更好的。然而，说来也奇怪，这是不正确的！因为第二个时期是上帝对禁欲者的信任，这位禁欲者已经保守了所托付给他的财富，在此之后，这财富便从不义之财转变为人永远的拥有。上主在关于不义之财的比喻中表达了这一点，载于路加福音[227]。
    - type: paragraph
      text:
        ru: 'Теперь о третьем периоде: человек-христианин, прошедший два первых периода, обычно останавливается на молитве за всего Адама и тем уподобляется Христу, предавшему Себя на распятие за всего Адама. Это становится более частым явлением, чем в прежние эпохи. Основание для такого утверждения мы находим в книге «Записки сибирского миссионера». Это – отрывок очень важной темы для жизни всей Церкви.'
        cn: 如今谈及第三个时期：已经历前两个时期的基督徒，通常会专注于为全人类亚当祈祷，并因此效法基督，祂为全人类亚当将自己交于受难。这比以往的时代成为一种更加常见的现象。这一论断的依据，我们可以在《西伯利亚传教士札记》一书中找到。这是一个对于整个教会的生命而言非常重要的话题的片段。
    - type: paragraph
      text:
        ru: В первые дни его аскетической жизни на Афоне чрез явление живого Господа Силуану сообщено было состояние Самого Христа в конце Его земного пути, то есть – состояние голгофского плача и голгофской смерти. Господь умер на Голгофе за спасение не какого-либо отдельного народа или частей человечества, но всего человечества – всего Адама, по выражению Святых Отцов. Но если взять жизнь огромного числа монахов-подвижников, то многие не имеют опыта Силуана в самом начале. И борясь со страстями своими, чтобы сообразовать свою натуру с заповедями Христа Бога, они кончают тем, с чего Силуан начинал.
        cn: 在他苦修生活的最初日子里，在阿索斯山，通过活生生的上主向圣西卢安的显现，传达了基督祂自己在祂尘世生命终结时的状态，也就是说——客尔瓦略山的哀哭和客尔瓦略山的死亡之状态。上主死在客尔瓦略山，并非为了某个特定的民族或人类的某些部分之得救，而是为了全人类——用圣教父们的话说，是为了整个亚当的得救。但是，如果审视绝大多数修道士苦修者的生命，那么许多人在一开始就没有圣西卢安那样的经验。他们与自己的情欲争战，以使自己的本性符合基督上帝的诫命，最终他们达到了圣西卢安所开始的那个境地。
    - type: paragraph
      text:
        ru: 'История подвижничества знает, как великий подвижник девятнадцатого века Парфений Киевский, восприняв последнюю степень монашества – великую схиму, в молитве спросил Божию Матерь: «Что же значит великая схима?». И получил он ответ: «Великая схима есть молитва за весь мир», по слову Богоматери. И этот период великой схимы есть последний в жизни монаха. Это – третий период, когда снова приходит первая благодать в ее совершенной форме – как молитва за всего Адама. И сие является концом жизни аскета.'
        cn: 苦修史记载，十九世纪的伟大苦修者基辅的帕弗尼，在领受了修士的最高阶——大圣衣之后，在祷告中问圣母：「大圣衣究竟意味着什么呢？」他得到了回答：「大圣衣是为全世界的祈祷，」圣母如此说道。大圣衣的这一时期是修士生命中的最后阶段。这是第三个时期，此时最初的恩典以其完美的形态再次降临——即为全人类亚当的祈祷。而这便是苦修者生命的终结。
    - type: paragraph
      text:
        ru: 'И так Стратоник и Силуан разделяют три ступени монашеского подвига: первый период – когда человек научается непосредственно благодатью; второй – когда аскету дается от Бога проявить свою любовь и расположение сохранить заповеди Бога; и, наконец, третий период, менее длительный, чем второй, – когда благодать, вверенная подвижнику в начале, становится реализованной через проявленное им терпение и верность. И обычно этот период недолгий и кончается преподобной смертью по телу.'
        cn: 于是，斯特拉托尼克和圣西卢安将苦修功行划分为三个阶段：第一个时期——当人直接蒙受恩典教导时；第二个时期——当苦修者蒙上帝所赐，以显明其爱和保守上帝诫命的意愿时；最后，第三个时期，比第二个短——当起初托付给苦修者的恩典，借由他所展现的忍耐和忠诚而得以实现时。并且这个时期通常不长，并以肉身的圣善之死告终。
    - type: paragraph
      text:
        ru: Сие познание было дано уже в золотой век египетского монашества. И сие познание, хотя бы только теоретическое, а не пережитое еще собственным опытом, необходимо для всех, на кого возлагается служение игумена или духовника.
        cn: 这项认知早在埃及修道主义的黄金时代就已然被赋予。而这项认知，纵然只是理论性的，而非尚未亲身经历的，对所有肩负院长或神师事奉的人而言，都是必要的。
    - type: paragraph
      text:
        ru: 'На сей день я сочту это довольным, чтобы легче было постепенно усвоить это. Сами того не замечая, вы будете вырастать духовно. Господь сказал, что Царство Небесное возрастает в нас без возможности наблюдения за тем, как это происходит[228]... И будем молиться, чтобы открылся нам этот дивный путь: как из младенца, рожденного во чреве матери – в сущности говоря, из ничего, вдруг вырастает носитель всечеловеческого сознания Адама; вдруг появляется человек, способный подражать предвечно рожденному Сыну Иисусу Христу! Если мы задумаемся над этим чудом, то мы действительно исполнимся благодарности Богу.'
        cn: 截至今日，我以此为足，以便更容易地逐步领会。你们将不知不觉地在灵性上成长。主曾说，天国在我们里面成长，而我们无法察觉其发生过程[228]。我们也要祷告，愿这奇妙的道路向我们显明：一个生于母腹的婴孩——实质上是从无中生有——如何忽然成长为全人类亚当意识的承载者；如何忽然出现一个人，能够效法那从亘古而生的子，耶稣基督！如果我们深思这奇迹，我们就必真正充满对上帝的感恩。
    - type: paragraph
      text:
        ru: И да будет Ему вечная слава, даже от нас, немощных, во веки веков.
        cn: 并愿永远的荣耀归于祂，甚至从我们这些软弱的人，直到永永远远。
  - type: heading2
    text:
      ru: 'Беседа 27: Монастырь, как школа спасения чрез единство, послушание и доверие, согласно духу преп. Силуана[229]'
      cn: 讲道二十七：修道院，作为通过合一、顺服与信赖而达致救赎的学校，依照圣西卢安的精神[229]
    children:
    - type: paragraph
      text:
        ru: О грандиозном наследии прп. Силуана. Стать учеником прп. Силуана – значит охватить весь мир. Образ и подобие означает жить жизнью Бога. Наша цель стать христианами до полного богоуподобления. Потеря вдохновения невознаградима. От tabula rasa ко спасению от смерти. Восприятие Христа как Бога уже спасительно. Стройте жизнь через боль душевную и телесную. О послушании и доверии к игумену. Игумен Эмельянос о недопонимании между старцами и молодыми. Примеры неразумного расчленения братства в делании послушания. О терпении игумена. Монастырь как «трамплин» в Царство Небесное
        cn: '关于圣西卢安的宏伟遗产。

          成为圣西卢安的门徒，意味着拥抱整个世界。

          形象与肖像意味着活出上帝的生命。

          我们的目标是成为基督徒，直至完全的肖似上帝。

          灵感的丧失是无法弥补的。

          从tabula rasa（白板）到从死亡中得救。

          将基督视为上帝，本身就已是救赎。

          通过灵魂和身体的痛苦来建造生命。

          关于顺服与对院长的信任。

          院长埃米利亚诺斯关于长者与年轻人之间的误解。

          在实行顺服时，不理智地分裂弟兄团体的例子。

          关于院长的忍耐。

          修道院是进入天国的「跳板」。'
    - type: paragraph
      text:
        ru: Да, I am not at my best[230], и все равно надо говорить. А вы помогите мне молитвами вашими.
        cn: 是的，我不在最佳状态[230]，但无论如何我仍需说话。而请你们以你们的祷告帮助我。
    - type: paragraph
      text:
        ru: 'Вот сейчас мы молились сначала Богу, потом Божией Матери, потом Крестителю, потом Силуану. Подумайте: его имя теперь призывается на всех материках, и он наш отец ближайший! Помышляя о нем, мы думаем, какую грандиозную жизнь дал нам Бог, когда мы видим, как Силуан, наш брат и отец, воспринимает слова молитв, обращенных к нему и в Америке, и на Дальнем Востоке, и здесь у нас, и повсюду. И одна женщина сказала: «Он близкий и скоро отвечает». Для него нет расстояний. Так же старец Порфирий сказал кому-то: «После смерти я буду ближе к вам». Почему? – Потому что смерть уничтожает расстояние: уже нет его. И мы видим, что любовь Силуана в молитве за всего Адама проникает по всему миру, пусть настроенному иначе. Он молился за весь мир, и теперь мир стал – его. И мы, став учениками Силуана, конечно, поставили себе условие, вытекающее из заповеди Христа, – охватить весь мир.'
        cn: 刚才我们先向上帝祈祷，然后向圣母、施洗约翰和圣西卢安祈祷。你们想想：他的名字如今在各大洲被呼求，他是与我们最亲近的父亲！默想他时，我们想到上帝赐予我们何等宏伟的生命；我们看见圣西卢安——我们的弟兄和父亲——怎样领受从美洲、远东、此地和世界各处向他献上的祷词。一位妇人说：「他很亲近，而且很快回应。」对他而言没有距离。长老波尔菲里也曾对人说：「我死后会离你们更近。」为什么呢？因为死亡消除了距离，它已不复存在。我们看见，圣西卢安为全亚当祈祷的爱遍及全世界，即使世界的心意并不相同。他曾为整个世界祈祷，如今世界成了他的。我们既成为圣西卢安的门徒，便由基督的诫命给自己定下目标：拥抱整个世界。
    - type: paragraph
      text:
        ru: 'Великий Бог, сотворивший видимый космос, сотворил и нас – подобными Ему потенциально. Бог сказал: «Сотворим человека по образу Нашему и по подобию». И заповедал нам быть подобными Ему. И мы должны решительно пойти на этот путь. Стать христианином – это дело необычайно грандиозное. И вот, вы все пришли сюда с этой целью.'
        cn: 伟大的上帝，祂创造了可见的宇宙，也创造了我们，使我们潜在地肖似祂。上帝说：「我们要照着我们的形象，按着我们的样式造人。」祂也命令我们要肖似祂。我们也应该坚定地走上这条道路。成为一名基督徒，这是一件非凡宏伟的事。那么，你们都为着这个目标来到了这里。
    - type: paragraph
      text:
        ru: Человек есть дух – дух бессмертный. Человек есть разум – разум вечный. Человеку дано прикоснуться ко свету Премудрости Божией. И вот мы живем каждый день в этой атмосфере, и каждый день вырастает наше сознание.
        cn: 人是灵——不朽的灵。人是理性——永恒的理性。人被赋予触及上帝的圣智之光。于是我们每天生活在这种氛围中，我们的意识也每一天都在成长。
    - type: paragraph
      text:
        ru: «Ты, Господи, сотворивый нас по образу Твоему, пребудь с нами и научи нас следовать стопам Твоим. Мы, взятые из ничто, сегодня Тобою призваны быть с Тобою, и мы сознаем нашу немощь. Приди же Ты, создавый нас, и Сам научай нас жить подобною Тебе жизнью».
        cn: 「祢，上主啊，照祢的形象创造了我们，求祢与我们同在，并教导我们追随祢的脚踪。我们这些从虚无中被造的，今日蒙祢召选与祢同在，我们也深知自身的软弱。求祢降临，创造了我们的祢，并亲自教导我们过一种与祢相似的生命。」
    - type: paragraph
      text:
        ru: Великое, необычайно великое дело – быть христианином, поняв и уразумев величие дара Божия. Все это настолько превосходит наше явление в теле, что мы, конечно, не находим ни слов, ни способов выразить наше удивление перед Богом.
        cn: 成为基督徒，若能理解并领悟上帝恩赐的伟大，这便是一件伟大、非凡伟大的事。这一切是如此超越我们肉身的存在，以至于我们当然找不到言语，也找不到方式来表达我们对上帝的惊叹。
    - type: paragraph
      text:
        ru: 'Некоторые из вас пришли сорок лет тому назад, некоторые – совсем недавно. Мне дано было пережить многое и дожить до солидной старости. Но, кончая мой путь, я, возлюбивший вас, хочу, чтобы вы были ограждаемы ангелами Бога нашего и совершали свой путь до полного уподобления Богу. Итак, это место для нас имеет достоинство и задачу, которую назвать «великой» было бы совсем недостаточно. И я перед уходом моим умоляю вас: не будьте наивными! Постарайтесь действительно проникнуть в необычайно драгоценное, что дал нам Бог: быть с Ним в вечной любви! Но задание это связано, как мы видим, с большими трудами в этой жизни и в этом теле. Бессмертный дух и космический разум даны нам от Бога. И потерять это бойтесь и стыдитесь.'
        cn: 你们中的一些人是四十年前来到这里的，另一些人则是在最近才来。我被赐予经历许多，并活到高龄。然而，在我的生命旅程即将结束之际，我，这爱着你们的人，希望你们能蒙受我们上帝的众天使的守护，并将你们的道路完成至完全肖似上帝。因此，对我们而言，这个地方具有尊贵和一项使命，若称之为「伟大」，则远远不足以形容。在我离去之前，我恳求你们：不要天真！你们要努力真正领悟那无比珍贵的，就是上帝所赐予我们的：与祂同在永恒的爱中！然而，正如我们所看到的，这项使命与在此生和此躯中巨大的劳苦联系在一起。不朽的灵和宇宙的理性是上帝所赐予我们的。失去这一切，你们当感到恐惧和羞耻。
    - type: paragraph
      text:
        ru: Каждый из нас должен достигнуть меры совершенного Адама. Будучи носителями сей великой идеи, ведите себя так, чтобы быть достойными доверия Бога. Это достигается нашим подвигом – борьбой за переход к вечному бытию еще в нашей форме существования на земле. Чем дальше проходит время нашей жизни, тем расширеннее становится наше видение мира, и в молитве нашей охватываем мы все бытие космическое, потому что весь космос создан ради человека. Нелегка эта работа. Странным образом Господь связал жизнь в Нем и любовь Его – с глубоким страданием. И вы, драгоценные мои братья и сестры, пришедшие сюда, не утеряйте этого вдохновения! Невознаградима потеря дара Божия!
        cn: 我们每个人都应达到完美亚当的身量。作为这一伟大理念的承载者，你们的行为应当如此，好使你们配得上上帝的信任。这要通过我们的修行——为进入永恒存在而进行的争战，甚至在我们于世间的这种存在形式中——来达成。我们的生命时间越是流逝，我们对世界的视野就越发广阔，在我们的祷告中，我们包罗了宇宙的全部存在，因为整个宇宙都是为人而造。这项工作并不轻松。上主奇妙地将祂里面的生命和祂的爱与深切的苦难联系在一起。还有你们，我亲爱的弟兄姐妹们，来到这里的你们，不要失去这灵感！上帝恩赐的失落是无法弥补的！
    - type: paragraph
      text:
        ru: Рождается человек теперь не так, как первый Адам, который был единственным человеком в мире. Мы рождаемся от отцов и матерей наших, как маленькие дети, какtabula rasa, окруженные колоссальной организацией всей мировой жизни. И научиться всему надо постепенно. Так, мы вырастаем среди различных течений мысли, целей и так далее. И нам надо выбрать все то, что нас ведет к нашей последней цели, которая определяется словом «спасение». А в чем спасение? – Спасение от смерти, поразившей нашего праотца и вместе с тем всех нас. Но мы уже намного спасены тем, что восприняли Христа как Бога и Творца нашего, Творца особого порядка, Который творит нас по образу и подобию. Он создает нашу жизнь и вместе с тем обращается с нами, как с подобными Себе существами.
        cn: 人类如今的诞生方式已不同于第一个亚当，他曾是世上唯一的人。我们由父母而生，如同幼小的孩童，如tabula rasa，被整个世界生命那庞大的组织所环绕。并且一切都需要循序渐进地学习。如此，我们在各种思想流派、目标等等之中成长。而我们需要选择所有能引领我们达到终极目标的事物，这目标由「救赎」一词所定义。那么，救赎为何？——救赎脱离死亡，那曾击倒我们原祖，并且也击倒了我们所有人的死亡。但我们已在很大程度上得蒙救赎，因我们领受基督为我们的上帝和造物主，一位特殊秩序的造物主，祂按照自己的形象和样式创造我们。祂创造我们的生命，并且同时对待我们，如同与祂相似的存有。
    - type: paragraph
      text:
        ru: 'Я скоро уйду из этой жизни, а вам надо будет остаться после меня и продолжить борьбу за спасение. Будьте разумными в своем поведении! Будьте готовы на боль телесную в трудах ежедневных! Примите боль душевную, когда мы живем в этом грубом, извращенном падением мире! Все вы, и каждый из вас, должны работать над тем, чтобы стать как единый человек. Молитесь друг за друга, чтобы молитва соединила всех нас во Святом Духе, в духе заповедей Христа, когда ничего нет «чужого». Так Господь говорит старшему сыну в притче о блудном сыне: «Все Мое – Твое»[231].'
        cn: 我很快就要离开此生了，而你们却要在我之后留下，并继续为救赎而争战。你们要在行为上明智！你们要准备好在每日的劳作中承受肉体的痛苦！你们要接受灵魂的痛苦，因为我们生活在这个粗鄙的、因堕落而败坏的世界中！你们所有人，以及你们每一个人，都当致力于成为一个合一的人。你们要彼此代祷，使祷告能将我们所有人连结在圣灵之中，连结在基督诫命的精神之中，当再无「外物」之时。主如此对浪子比喻中的长子说：「我一切所有的都是你的。」[231]
    - type: paragraph
      text:
        ru: 'Необходимым при постройке монастыря является согласие воль. Если каждый человек, каждый из нас будет тянуть в свою сторону, то мы будем разрывать тело нашей собственной совместной жизни. Если все мы согласимся работать вместе, то, несмотря на все несовершенства, наше единство будет созидательным. Всякие словесные споры и движения – «оттолкнуться от того, что я не мыслю» – разрушают жизнь. Но, по Божиему плану, так устроена жизнь человека, что есть отцы, есть сыны и есть младенцы. И вы предоставьте тому, кто назначен вашим отцом, строить жизнь. Это великая культура послушания, отсечения своей воли – маленькой, индивидуальной воли – ради реализации воли Отца, как говорит Господь в молитве: «Да будет воля Твоя яко на небеси и на земли».'
        cn: 修建修道院时，意志的合一是必要的。如果我们每个人都各自为政，那么我们就会撕裂我们自身共同生活的身体。如果我们所有人都愿意同心协力，那么，尽管存在所有不完美之处，我们的合一仍将是富有建设性的。任何言语上的争执，以及「排斥我所不思想的」此类举动，都会破坏生命。然而，按照上帝的计划，人的生命被如此安排：即有父、有子、有婴孩。并且你们要让那位被任命为你们的父去建造生命。这是顺服的伟大修为，割弃自身意志——那微小、个体的意志——为了实现父的旨意，正如上主在祷告中所说：「愿祢的旨意行在地上，如同行在天上。」
    - type: paragraph
      text:
        ru: Все вы должны бороться, молясь за всех и каждого, чтобы стать единою семьею и так спасаться.
        cn: 你们所有人也都应当奋斗，替所有人以及每一个人祈祷，以便成为一个家庭，并从而得救。
    - type: paragraph
      text:
        ru: Итак, дорогие мои, не соотносите слово сие со мною, а принимайте его как бы отдельно от меня. Я – маленький человечек, но то слово, которое нам дано от Бога, от Иисуса Христа, я приношу вам по положению моему. Напишите его на сердцах ваших и молитесь, и когда огонь молитвы коснется вас, то, какое дело вы ни совершаете, все равно – вечный Бог с вами.
        cn: 所以，我亲爱的，不要把这番话与我关联，而要将它当作是与我无关的来领受。我只是个渺小的人，但这从上帝、从耶稣基督那里赐予我们的话语，我按照我的职分将它带给你们。将它写在你们的心上并祈祷，当祈祷的火焰触及你们时，那么，无论你们正在做什么事，永恒的上帝都与你们同在。
    - type: paragraph
      text:
        ru: При строении монастыря приходится думать о том, что в монастыре сожительствуют люди, горевшие огнем Божиего Закона, с теми, которые едва приближаются к этому Закону и к этому пламени.
        cn: 在修建修道院时，必须考虑到修道院里共居着那些被上帝律法的火焰所炽热的人，与那些刚刚才接近这律法和这火焰的人。
    - type: paragraph
      text:
        ru: 'Сейчас мне приходит воспоминание из моей прошлой жизни, когда я был духовником на Святой Горе, в монастыре Симоно-Петра. Тогда это было упадочное время, и не так много приходило людей в монашество. И приходившие молодые монахи не удовлетворялись старцами, а старцы отягощались молодыми, потому что новопришедшие делали много глупостей. И когда старцы говорили мне о том, что делают новоначальные, то я сказал им, что эти люди пришли к вам из мира, который живет совсем по другим правилам. Все их реакции воспитаны в этом мире – чуждом христианскому монастырю. А молодым я советовал не смотреть на то, что старцы, якобы «утомленные», живут, как кажется, мало духом: «Нет, почитайте старших! Поскольку все то, что они говорят вам, как я слышал, действительно достойно к приятию». Так вот и вам говорю. Насколько бы ни были многими недостатки мои, слово, которое я вам говорю, относится к тому, что Господь назвал «вечною жизнью». Каждый из вас, смотрите на это место как на великий дар Бога и стройте его с любовью. Избегайте всяких споров. И тогда этот дом будет вашим домом.'
        cn: 我现在忆起我过去的生活中，当我在圣山，西蒙佩特拉修道院做神师的时候。那时是衰微的时代，且不那么多的人前来修道。而那些前来修道的年轻修士不满足于长者们，长者们则被年轻人所困扰，因为新来者做了许多蠢事。当长者们对我说及新入门者所做之事时，我就对他们说，这些人是从世界来的，那个世界是按完全不同的规矩生活着。他们所有的反应都是在这个世界里养成的——一个对基督徒修道院来说是陌生的世界。而我对年轻人则建议，不要去看长者们，他们似乎「疲惫」，看上去灵性不足：「不，要敬重长者！因为他们对你们所说的一切，据我所闻，确实值得接受。」所以我现在也对你们说。无论我的缺点有多少，我对你们所说的话，都关乎上主所称的「永生」。你们每个人，都要把这个地方看作是上帝的伟大恩赐，并以爱心去建造它。避免一切争执。那么这个家就将是你们的家。
    - type: paragraph
      text:
        ru: 'Вы слышали поучения о том, что духовником должен быть один. Как Авва Дорофей пишет: «Во многе совете есть спасение, но советник один». В монастырях общежительных жизнь сложнее. Игумен есть средоточие всего. И к его слову надо относиться с учетом того, что он первый ответственный пред Богом. А если так, то дайте ему сказать слово и послушайтесь его.'
        cn: 你们听过这样的教导，说神师应当只有一个。正如多罗斐修士长所写：「众议多则得拯救，但建言者一人足矣。」在团体修道院中，生活更为复杂。院长是一切的中心。并且对于他的话语，应当怀着这样的认识来对待：他是在上帝面前负有首要责任的人。既然如此，就让他说出话语，并顺从他。
    - type: paragraph
      text:
        ru: Мы все строим вместе, но неизбежны некоторые пробелы в нашем понимании вещей. И потому будем терпеливы к каким-нибудь расхождениям и трениям, которые возникают при общей работе.
        cn: 我们都在一同建造，但我们对事物的理解上不可避免地存在一些空白。因此，对于在共同工作中出现的任何分歧和摩擦，我们当保持忍耐。
    - type: paragraph
      text:
        ru: Скажу вам маленькую вещь. Если сердце человека настроено добро и он хочет добра каждому из братьев и сестер, то, когда он встречает маленькое сопротивление, как некую «маленькую булавку», – это стоит ему очень дорого. Если сопротивление случается не один раз, а повторяется, то сердце от боли перестает искать общения с тем, у кого иголка.
        cn: 我告诉你们一件小事。如果一个人的心存良善，并且他希望每个弟兄姐妹都好，那么，当他遇到一点点阻力，就像某种「小针」一样时，这会让他付出非常沉重的代价。如果阻力不只发生一次，而是反复出现，那么，他的心便会因痛苦而停止寻求与那个有「针」的人相通。
    - type: paragraph
      text:
        ru: 'Я надеюсь, что вы все поймете это из самого опыта жизни. Рассуждайте так: что бы ни случилось, в каждом акте проявляется человек, как он есть. И нет, по существу говоря, маленьких дел. Есть менее важные дела, но каждое все-таки имеет свою важность и значение.'
        cn: 我希望你们都能从生命的亲身经历中明白这个。你们要这样思考：无论发生什么，在每一个行动中，人都会显现出他的本相。而且，从本质上说，没有小事。有些事情不那么重要，但每一件仍然具有它自身的重要性和意义。
    - type: paragraph
      text:
        ru: 'И вот на сегодняшний день я кончаю беседу и призываю вас: не допустите ошибки! Не портите это место! Сделайте это место, как говорится, «трамплином» в Царство Божие. Глупое слово пришло, спортивное: «трамплином», но, может быть, оно подходит.'
        cn: 至此，我结束今天的讲论，并呼吁你们：不要犯下错误！不要毁坏这个地方！请将这个地方，如俗话所说，变为进入上帝之国的「跳板」。一个听起来有些滑稽的词语浮现在脑海，一个体育用语——「跳板」——但或许它很合适。
    - type: paragraph
      text:
        ru: Так вот, будем мы желать и жить так, чтобы наш отец Силуан радовался, а не плакал и рыдал.
        cn: 这样说来，我们当愿望并如此生活，好使我们的父圣西卢安喜乐，而非哭泣和悲叹。
  - type: heading2
    text:
      ru: 'Беседа 28: «Вонми, небо, и возглаголю»: покаяние и апофатика[232]'
      cn: 讲道 28：「上天哪，请侧耳听，我将宣讲」：悔改与否定神学[232]
    children:
    - type: paragraph
      text:
        ru: О жизни с вдохновением Духа Святого. О том как удержать ум. Правило для новоначальных. Постижение откровения благодатью. О жизни без греха. Когда богословие становится содержанием молитвы. Молитва покаяния – сверхкосмична. Надо удержать наш ум там – за завесой восьмого дня. О борьбе со страстями и Божественном бесстрастии. Как говорить о Боге? О неописуемом Божественном смирении. Вселенское покаяние, которое охватывает всю историю человека. Учение прп. Силуана. О том, как живет персона. Покаянию нет конца на земле
        cn: '关于在圣灵启发下的生活。

          关于如何持守心神。

          初入道者的准则。

          藉着恩典领悟启示。

          关于无罪的生活。

          当神学成为祷告的内容时。

          忏悔祷告是超宇宙性的。

          我们应当将心神持守在那里——在第八日的幔子之后。

          关于与私欲的争战以及神圣的无私欲境。

          如何谈论上帝？

          关于不可言喻的神圣谦卑。

          普世性的悔改，其涵盖了人的全部历史。

          圣西卢安的教导。

          关于位格如何生活。

          在地上，悔改无止境。'
    - type: paragraph
      text:
        ru: 'Да будет благословенно имя Господне во веки веков! Я снова имею благословение свыше встретиться с вами и говорить о том, что есть последнее наше желание и последняя цель. Каждодневная жизнь материального космоса в такой мере подавляет в нас духовную мысль своей массой, что нам необходимо как-то преодолевать власть над нами этого видимого мира и освобождать наш ум для проникновения в Откровение, данное нам чрез воплощенного Логоса Отца. Церковная пасхальная служба меньше пользуется Ветхим Заветом и меньше говорит о Святом Духе, а концентрирует наше внимание на факте воскресения Христа, ибо на нем основана вера наша. И богослужение изменило молитву нашу: начиная наши беседы, до Пасхи мы всегда обращались к Духу Святому – Царю Небес, от Отца исходящему. А теперь мы поем: «Христос воскресе из мертвых!». Влечется наш ум к этому событию – центральному и величайшему из всех других событий сотворенного мира. Но я не хочу остановиться только на этом событии: наша жизнь повседневная проходит, во всяком случае должна проходить, во вдохновении, исходящем от Духа Святого. В Символе веры нашей сказано о Духе Святом, что Он «говорил пророками» в Ветхом Завете.'
        cn: '愿上主之名，世世无穷，永蒙颂赞！


          我再次蒙受从上而来的祝福，能与你们相聚，并谈论我们最终的渴望和最终的目标。物质宇宙的日常生活以其庞大的重压，如此程度地压制我们内在的属灵思想，以至于我们必须设法克服这可见世界对我们的辖制，并释放我们的心智，以便能深入领悟那借着道成肉身的父之逻各斯（Logos）赐予我们的启示。教会复活节礼仪较少引用旧约，也较少谈及圣灵，而是将我们的注意力集中在基督复活的事实上，因为我们的信仰即建立于其上。礼仪也改变了我们的祷告：在开始我们的谈话时，复活节前，我们总是向圣灵——那出自父的、天上的君王——祷告。而如今我们咏唱：「基督从死者中复活了！」我们的心智被牵引到这一事件上——它是受造世界中所有其他事件里最核心和最伟大的。但我不想只停留在这一事件上：我们的日常生活正在进行，无论如何，都应当在源自圣灵的灵感中进行。在我们的信经中，论及圣灵时说道，祂在旧约中「曾藉众先知说话」。'
    - type: paragraph
      text:
        ru: 'В молитве к Ангелу-хранителю сказано: «Ангеле Божий, Хранителю мой святый, живот мой соблюди во страсе Христа Бога, ум мой утверди во истинном пути, и к любви горней уязви меня (направь меня)».'
        cn: '在向守护天使的祷告中如此说：


          上帝之天使，我圣洁的守护者，

          愿祢在敬畏基督上帝中保守我的生命，

          在真实的道路上坚定我的心志，

          并使我心为天上的爱所刺透（引导我）。'
    - type: paragraph
      text:
        ru: 'Так мы молимся, чтобы по благодати Духа Святого наш ум пребывал бы там, где должно ему быть: «Ум мой утверди во истиннем пути и к любви горней уязви душу мою». Этот «истинный путь», конечно, – жизнь Самого Бога.'
        cn: 因此我们祷告，好使借着圣灵的恩典，我们的心智能住在它该在的地方：「愿祢坚定我的心智于真实之道，并以属天之爱刺透我的灵魂。」这「真实之道」，当然，就是上帝自身之生命。
    - type: paragraph
      text:
        ru: Исходя из опыта всей моей прошлой жизни, я считаю нам всем необходимым воспитать наш ум, чтобы он как бы по естеству своему знал единственное движение – пребыть в атмосфере Царства Христова.
        cn: 基于我此生过往全部的经历，我认为我们所有人都必须培养我们的心智，好让它仿佛出于其本性，只知晓唯一的动向——即安住于基督国度的氛围之中。
    - type: paragraph
      text:
        ru: Если подходить богословски к библейским событиям, то самым важным началом Откровения было, конечно, явление Бога Моисею со словами «Аз есмь Сый (Сущий)», когда говорил из купины неопалимой Логос Отца. И дальше Дух Святой внушал слова, которые необходимы человеку, чтобы нам знать природу нашу. Ибо при неправильном понимании нашей природы люди или совсем не допускают веры воскресению нашему в Боге, или же преувеличенно думают о человеке – как будто бы он не нуждается в Боге.
        cn: 如果从神学角度来看圣经事件，那么最重要的启示开端，当然是上帝向摩西的显现，并用「我是那自有永有者」的话语说话，那时是圣父的道从燃烧的荆棘中讲话。其后，圣灵默示了人类所必需的话语，为使我们认识我们的本性。因为对我们的本性理解不正确，人们或者根本不接受我们在上帝里复活的信仰，或者过分地高估人——仿佛他不需要上帝一般。
    - type: paragraph
      text:
        ru: Когда Сей Дух Божий касается сердца человека, то раскрывает его до беспредельности, и то, что невозможно человеку помыслить, когда он живет по-плотски, то открывает Дух Святой.
        cn: 当这上帝的灵触及人的心时，就使其无限地敞开；并且，当人过着属肉体的生活时，他所无法思量的事物，圣灵就将其启示出来。
    - type: paragraph
      text:
        ru: 'И Господь сказал, что побеждается власть греха над нами постом и молитвою. Пост часто понимается неверно. Иногда он не только не содействует нам к проникновению в глубины Божественной жизни, но просто убивает нашу плоть. Великий святой нашей Церкви, великий богослов Максим Исповедник дает нам очень важное определение: «Дай телу подвиг по силам его, а остальное внимание обрати на ум».'
        cn: '上主曾说，罪在我们身上的权势是藉着禁食与祷告得以战胜的。禁食常常被误解。有时，它不仅无助于我们深入神圣生命的深处，反而仅仅是杀死我们的肉身。我们教会的伟大圣者、伟大的神学家马克西姆·承圣者，赐予我们一个极其重要的定义：

          「给予身体力所能及的苦修，而将其余的心神转向悟性。」'
    - type: paragraph
      text:
        ru: Есть вещи в духовном христианском мире, которых понять мы простой человеческой логикой не можем, но которые становятся яснее только через опыт благодати, когда нам дано бывает пребыть в состоянии созерцания подлинного и когда содержание Откровения становится для нас очевидностью.
        cn: 在属灵的基督信仰世界中，有些事物我们无法凭借单纯的人类逻辑去理解，但它们唯独通过恩典的体验才能变得更加清晰，当我们蒙赐得以停留于真实的默观状态之中时，以及当启示的内容对我们而言成为明证之时。
    - type: paragraph
      text:
        ru: 'При встрече с вами, мои драгоценные братья и сестры, теперь, готовясь каждый день к исходу, я хотел бы, чтобы ваши умы утвердились во истинном пути. Взятая в общем порядке жизнь христианина настолько грандиозна, что одному человеку невозможно претендовать иметь опыт, исчерпывающий все. Но все-таки наше духовное состояние должно по содержанию своему включать огромное количество опытных ведений, чтобы как-то проникнуть в тайну Божественной жизни. В Боге нет греха. К трагическому положению весь мир привело грехопадение. И все уродство греха мы, по существу говоря, не понимаем, если Духом Святым не откроется нам. Самые образованные люди нашего времени не понимают этого. Когда мы молимся: «Сподоби, Господи, в день сей без греха сохранитися нам», то страшно трудно нам самим судить, без греха ли мы провели день или где-то тайным образом грех действует в нас так тонко, что мы не можем дать себе отчет. Почему и говорит Псалмопевец:От тайных моих очисти мя(Пс.18:13).'
        cn: 在这次与你们相遇时，我亲爱的弟兄姊妹们，如今每日预备着归主，我愿你们的心志能坚固在真道之上。总而言之，基督徒的生命是如此宏大，以至于一个人不可能声称拥有穷尽一切的经验。然而，我们属灵的光景其内容应当包含大量的经验性洞见，以便能多少洞悉神圣生命的奥秘。在上帝里面没有罪。堕落使整个世界陷入了悲惨境地。而罪的一切丑恶，我们实际上并不理解，除非有圣灵向我们启示。我们时代最有学识的人都不明白这一点。当我们祷告：「上主啊，求祢使我们今日得蒙保守，免于犯罪」时，那么我们自己很难判断，我们这一天是否毫无罪愆地度过，或者罪在某处以隐秘的方式如此精微地在我们里面运行，以至于我们无法察觉。因此诗篇作者说：「求祢洗净我的隐而未现的罪」（诗篇 18:13）。
    - type: paragraph
      text:
        ru: 'В прошлый раз я привел вам некоторые слова из Великого канона Андрея Критского. Конечно, это выдающееся произведение, на примере которого мы можем учиться. Столь замечательный момент: «Вонми, небо! Внушай, земле!»[233]. Это – глас кающегося. Смотрите, какое странное положение: один человек кается в своих грехах, но это событие рассматривается как сверхкосмическое! И дерзновение это захватывает нас: «Вонми, небо, к тому, что я буду говорить!» – глас кающегося человека. Понимаете разницу человека, во Христе возрожденного, от человека, не знающего Христа? И Моисей и за ним другие сыны Адама употребляли эти слова с дерзновением. Покаяние человека – это событие необычайно трагическое и необычайно великое. Так, Силуан пишет о том, что плач Адама заставлял всю тварь умолкать и внимать этому плачу. Конечно, это чудная вещь, когда святой Андрей приносит Богу свою молитву, воспоминая все содержание Ветхого Завета и Нового Завета и обетование о конце мира, о последнем Суде над человеком. Так этот пример постепенно должен быть повторен в нас самих, когда в едином человеке живет весь Ветхий и Новый Завет до последнего чаяния-ожидания: «чаю воскресения мертвых». И как Андрей Критский начинает с сотворения мира: «Первозданного Адама грехопадению поревновав», от первого человека до последнего Суда, – так и мы носим в себе память об этом.'
        cn: 上次我给你们引用了克里特的安德烈大圣歌中的一些话。当然，这是一部卓越的作品，我们可以从中学习。如此美妙的时刻：「穹苍，请听！大地，请侧耳！」[233]。这是忏悔者的声音。看哪，多么奇特的境况：一个人忏悔自己的罪，但这事件却被视为超越宇宙的！而这胆量攫住了我们：「穹苍，请听我所要说的！」——一个忏悔者的声音。你们明白在基督里重生之人与不认识基督之人之间的区别吗？摩西和他之后的亚当其他子孙都曾带着胆量使用这些话语。人的忏悔——这是一个非同寻常的悲剧性事件，也是一个非同寻常的伟大事件。因此，圣西卢安写道，亚当的哭泣使所有受造物都静默下来，并倾听这哭泣。当然，当圣安德烈向 上帝献上他的祷告，回忆起旧约和新约的所有内容，以及关于世界末日、关于人类末次审判的应许时，这是一件奇妙的事。因此，这个榜样应当在我们自身中逐渐重现，当在一个人里面，整个旧约和新约，直到最后的渴望——期盼：「我期盼死者的复活」都活生生地存在。正如克里特的安德烈从世界的受造开始：「效法首生亚当的堕落」，从第一个人直到末次审判——我们也怀着对这一切的记忆。
    - type: paragraph
      text:
        ru: 'Не потому ли мы встречаемся со странным явлением: наше обычное законоведение говорит о том, что я могу быть судим как преступник, если я сам совершил что-то. Но когда это преступление совершено кем-нибудь другим, то я свободен от ответа. Это не совсем верно. Почему? – Потому что Господь все время обращается с нами так, как будто бы мы уже совершенны в Нем Самом. И мы каемся и просим прощения, выражая это часто рабскими движениями, падая на землю, прижавшись лбом к полу, к земле. Мы каемся за мир. Значит, Господь говорит с нами, как уже с ответственными за все. И если через меня проходит космическая жизнь, та же самая, которая проходила и через нашего праотца Адама, то единство наше с Адамом является совсем понятным и естественным.'
        cn: 难道我们不是正因此遇到一个奇怪的现象吗：我们通常的法学告诉我们，如果我亲自犯了罪，我就会被判为罪犯。但当这罪行是由别人所犯时，我就无需负责。这不完全正确。为什么？——因为上主始终待我们，就好像我们已经在祂里面是完全的了。而我们忏悔并请求宽恕，常常以奴仆般的姿态来表达，俯伏于地，额头紧贴地面，紧贴大地。我们为这世界忏悔。这意味着上主与我们对话，就如同我们已经对一切都负有责任的人。如果宇宙的生命通过我流淌，那与我们的原祖亚当所流淌的是同一个生命，那么我们与亚当的合一就变得完全可理解和自然了。
    - type: paragraph
      text:
        ru: 'Когда мы присутствуем при совершении Литургии Василия Великого, если дух наш возлюбил пришествие Христа, то каждый раз с большим трепетом любви повторяем мы содержание этой космической Литургии: все наше исповедание веры там предложено в сжатой форме. И это богословие есть содержание нашей молитвы. В Литургии есть выражение: вспоминается «Крест, Гроб, Воскресение... и паки второе пришествие». Некоторые богословы Европы говорят: «Как неразумно! Как можно вспоминать то, чего еще не было?». Но дело в том, что мы носим в своем сознании этот путь Бога при создании богоподобных человеков. Как содержание всей Библии явилось вдохновенным моментом в творении Андрея Критского, так и каждую службу мы начинаем мыслью о всем мире: «о мире всего мира», «благостоянии святых Божиих церквей и соединении всех». Но что я отметил за самим собою и в каком-то смысле просто из общения с моими братьями и сестрами? – Привыкшие к этим словам, мы совсем не думаем о бытийном содержании этого прошения – «о мире всего мира», «благостоянии святых Божиих церквей во всем мире и о соединении всех...». «Соединение» это есть единство любви Христовой. Так будем носить в себе это сознание и начинать службы, будучи внимательными к словам нашей литургической молитвы!'
        cn: 当我们参与圣大巴西略礼仪时，如果我们的心灵爱慕基督的降临，那么我们每一次都以巨大的爱之敬畏重复着这普世礼仪的内容：我们所有的信仰告白都在其中以精炼的形式呈现。这神学就是我们祷告的内容。在礼仪中有一个表达：提及「十字架、坟墓、复活……以及再次的第二次降临」。一些欧洲神学家说：「何等不智！怎能忆念尚未发生之事？」但事实是，我们在自己的意识中承载着上帝在创造与神相似之人时所行的这条道路。正如整部《圣经》的内容是克里特岛的安德烈创作时所受启发的时刻，同样，我们每一次事奉都始于对整个世界的思念：「为整个世界的平安」，「为上帝众圣教会的稳固及其所有成员的合一」。但我观察到我自己有什么，以及在某种意义上，从与我的兄弟姐妹们的简单交流中我发现了什么？——我们习惯了这些话语，却全然不思索这个祈求的存有性内容——「为整个世界的平安」，「为全世界内上帝众圣教会的稳固及其所有成员的合一……」这里的「合一」就是基督之爱的统一。那么，让我们内心怀着这种意识，并开始事奉，同时留意我们礼仪祷告的言辞！
    - type: paragraph
      text:
        ru: Подвиг монашеский есть борьба со страстями. Но нелегко говорить о том, что есть Божественное бесстрастие. Услаждение страстями приводит нас к удалению от Бога. Я сейчас прошу Бога о том, чтобы выразить непостижимо трудную вещь. Что такое бесстрастная и безгрешная любовь нашего Бога? – Я все время воздерживаюсь говорить об этом, потому что всякая человеческая формула внесет нечто несвойственное Божественному бытию; поэтому как бы приходится все время прибегать к молчанию и ждать, когда, по действию Духа Святого в нас, откроется нам истинный путь. Ибо язык наш создавался в этом мире вещей и он не соответствует тому, чтобы говорить о Боге. И вместе с тем нет другого пути. Невозможно встать на истинный путь без того, чтобы пребыть умом уже вне времени, в Божественной вечности. И речь идет о спасении именно в этом плане. Нам очень трудно вообразить себе, что мы, созданные по образу Божию и по подобию Ему, являемся важным событием даже для Него Самого. Но Бог Творец решил воплотиться и быть с людьми, чтобы показать нам всем, что мы созданы так, что можем получить в вечное обладание жизнь Самого Бога. И эта таинственная жизнь невыразима на человеческом языке.
        cn: 修士的功修即是与情欲的搏斗。但要论及何为属神的无情欲状态，并非易事。沉溺于情欲会使我们远离上帝。我此刻祈求上帝，好能表达一件难以言喻的艰难之事。我们的上帝那种无情欲且无罪的爱是什么？——我一直克制着不谈论此事，因为任何人为的表达方式都会引入一些与属神存有不相符的事物；因此，仿佛必须始终保持缄默，并等待，待圣灵在我们内运行，真正的道路向我们开启。因为我们的语言是在这个物质世界中形成的，它并不适合用来谈论上帝。然而，与此同时，别无他途。若不让心智已然超乎时间之外，安住在属神的永恒之中，就不可能踏上真道。而救恩正是就此层面而言。我们很难想象，我们这些按上帝形象和样式受造的，对他自己而言，也是一件重要的事件。但造物主上帝决定降世成人，与人同在，是为了向我们所有人显明，我们受造的方式，是能够永远拥有上帝他自己的生命。而这种奥秘的生命是人类语言所无法表达的。
    - type: paragraph
      text:
        ru: 'Итак, когда мы говорим о нашей жизни монашеской, то, быть может, я отягощаю вас словом о конечной цели ее. Но я не стыжусь этого делать, потому что каждый раз при этом я говорю вам: «А начинаем мы с азов». Говоря о конце, я не забываю начала.'
        cn: 那么，当我们谈论我们的修道生活时，或许我用关于其最终目标的话语使你们感到沉重。但我并不为此感到羞耻，因为每当此时，我都会对你们说：「而我们是从基础开始的。」谈论着结局，我并没有忘记开端。
    - type: paragraph
      text:
        ru: 'Опять возьмем событие, имя которому Силуан. Подумайте, он в одно мгновение слышит молитву и того, кто в Америке, и того, кто на Афоне, и того, кто в другой части населенного мира! Как это ему удается, мы не понимаем. Но мы видим, что он знает нас. Многие молитвы многих людей, о которых нам пишут, говорят о его способности почти предупреждать наш вопрос, предвидя его, и очень быстро... Такой случай произошел с монахом, который получил имя Силуан. И так как «Силуан» есть новое явление в Церкви, монах все-таки мысленно спросил: «Хорошо, как я могу узнать, слышит ли Силуан мою молитву?». И в это время подходит к нему другой монах и говорит: «Вот, у меня есть частица мощей Силуана. Эти мощи благоухают». Это был немедленный ответ на мысль того монаха. Замечательное событие! Мы знаем другие случаи и явления, но не частые.'
        cn: 让我们再次谈及一个名为圣西卢安的事件。试想，他竟能在转瞬之间听到身在美国者的祷告，身在阿索斯山者的祷告，以及身处世界其他居住区者的祷告！他如何做到这一点，我们不得而知。但我们看到，他认识我们。许多人寄来的众多祷告都说明他有能力几乎预先回应我们的问题，仿佛他已预见到，而且速度非常快……有这样一个事例发生在一个名叫圣西卢安的修士身上。并且由于「圣西卢安」在教会中是一个新近的现象，这位修士还是在心里想道：「那么，我如何能知道圣西卢安是否听到了我的祷告呢？」就在这时，另一位修士走近他并说：「看，我有一块圣西卢安的圣髑碎片。这些圣髑散发着芬芳。」这是对那位修士心念的即时回应。多么奇妙的事件！我们还知道其他类似事例和现象，但并不常见。
    - type: paragraph
      text:
        ru: 'Так, сам Силуан говорит о том, что все Небо видит все совершающееся на земле. И если мы будем знать об этом, то наше поведение будет иным – исполненным сознания, что и Бог, и все святые знают каждое мое движение: внешнее и внутреннее, особенно ума или сердца. Имея такого порядка свидетельство, и мы попробуем жить просто, но все-таки внимательно, чтобы не совершать никакого греха. А это мы можем сделать только с плачем, умоляя Бога сохранить нас от этого. И когда человек сохранится, тогда он говорит уже как подлинное лицо-персона: «Вонми, небо! Слушай, земле!» – глаголы кающегося человека. Тогда в наших головах и сердцах все совершающееся на земле будет вызывать реакции, не похожие на обычные человеческие реакции. И вся наша жизнь может получить характер освящения словом Господа, о котором Он говорит: «Небо и земля прейдут, а словеса Мои не прейдут». Итак, нам нужно быть очень внимательными к каждому слову и к каждому движению нашего сердца или нашего ума. Наконец тогда человек вдруг увидит, какой есть путь Бога, как Сам Бог живет в Самом Себе – о чем уже невозможно говорить человеческим словом. Всю жизнь монашескую наш драгоценный старец отец Силуан рыдал за то, чтобы Господь открыл Себя всему миру... Силуан пишет: «Говорю я с вами, потому что я знаю Господа». Но этот человек, который «знал Господа», жил среди многих монахов верующих и далеко не всеми был понят. Жизнь Силуана, повторяю, не общий образец. Ему с первых дней монашеского подвига было дано ощутить Божественное нетварное смирение Бога, и он говорил, что смирение Христа неописуемо. Носить его в себе и быть под его действием постоянно человек не может – он выходит из этого мира. Вы знаете, что для многих людей последняя ступень монашеской жизни – это смириться и считать себя хуже всякой твари. А то, о чем говорит Силуан, идет дальше этого – он говорит о смирении Христовом, действительно, как Божественном состоянии. Это атрибут Божественной любви.'
        cn: 诚然，圣息路亚本人曾说，整个天界都看见地上所发生的一切。若我们得知此事，我们的行为将有所不同——将充满此一觉悟：即上帝与所有圣徒都知晓我的每一个举动，无论是外在的还是内在的，尤其是我的心思和心灵。拥有如此确凿的见证，我们也会尝试简朴地生活，但仍然要警醒，以免犯任何罪。而这我们唯有通过流泪方能做到，恳求上帝保守我们免于此。当人蒙受保守之时，他便能以一个真实的位格发言：「天哪，请垂听！地啊，请倾耳！」——这是悔改之人的话语。届时，在我们思想与心灵中，地上所发生的一切将会激起不似寻常人类的反应。我们整个生命便可借由上主的话语而获得成圣的特质，祂曾说：「天地将要废去，而我的话语绝不废去。」因此，我们需要对我们心灵或心思的每一个词语和每一个举动都非常警醒。最终，届时人将突然看见上帝的道路是怎样的，上帝如何居于祂自身之中——这一切已非人类言语所能描述。在他整个修道生活中，我们可敬的长老父息路亚曾为此而哭泣，祈求上主向全世界显明祂自己……息路亚写道：「我与你们交谈，因为我认识上主。」然而这个人，「认识上主」的人，生活在许多虔信的修士之中，却远未被所有人理解。我重申，息路亚的生命并非普遍的典范。从他修道苦行的最初之日起，他便被赐予去感受上帝神圣的、非受造的谦卑，他曾说，基督的谦卑是不可言喻的。将其常存己身，并恒常处于其作用之下，人无法做到——因为他便超脱这个世界了。你们知道，对许多人而言，修道生活的最后阶段就是谦卑下来，并认为自己比任何受造物都更卑微。而息路亚所说的远超于此——他所说的是基督的谦卑，诚然是一种神圣的状态。这是神圣之爱的属性。
    - type: paragraph
      text:
        ru: 'Итак, покаянная молитва есть путь «как войти в...». А без сей молитвы всякое научное богословие – это есть «ходить вокруг да около». Конец покаяния, как я дерзнул писать в книге моей, означал бы совершенное уподобление Христу, возносящемуся на Небо и сидящемуодеснуюОтца. Смотрите, какие слова! Господь говорит: «Я победил мир», «Господь восходил на Небо, чтобы сестьодеснуюОтца» – с каким сознанием живут христиане! И когда мы стараемся познать сей ум христианский, то понятными становятся слова, которые говорит св. Андрей в своем каноне: «Из-за греха и страстей я погубил красоту своего ума».'
        cn: 因此，悔罪祷告是「如何进入…」的道路。而若无此祷告，一切学术神学 – 这便是「只在周遭徘徊」。悔罪的终极，正如我在拙作中胆敢写到的，将意味着彻底肖似升入天堂、且坐在父的右边的基督。你们看，这是何等的话语！主言说：「我已胜过了世界」，「主升入了天堂，为要坐在父的右边」——基督徒是怀着何等意识而活的啊！而当我们努力认识这基督徒的心智时，那些话语就变得可理解了，即圣安德烈在其圣歌中说到的：「我因罪恶与情欲，失落了我心智之美。」
  - type: heading2
    text:
      ru: 'Беседа 29: О Литургии[234]'
      cn: 第二十九讲：论礼仪[234]
    children:
    - type: paragraph
      text:
        ru: Литургия – ощущение победоносной Пасхи. О преложении хлеба в Тело Христа. Жизнь по заповедям Христа. «Смертию смерть поправ». Отец Софроний не познал уныние из-за отчаяния. Об обожении через Причастие. Всякая Литургия – что-то новое. Об особенной глубине Литургии св. Василия Великого
        cn: 礼仪——凯旋逾越节的感受。关于饼变质为基督的圣体。遵照基督的诫命生活。「藉死亡践踏死亡。」索夫罗尼长老未曾因绝望而体会沮丧。关于借由圣领而达成的成神。每次礼仪都是一种新事物。关于圣大瓦西里礼仪的独特深度。
    - type: paragraph
      text:
        ru: Слава Богу, давшему мне случай еще видеть вас и говорить с вами...
        cn: 感谢上帝，祂赐予我机会再次见到你们并与你们交谈……
    - type: paragraph
      text:
        ru: 'Я спросил сегодня уN., о чем можно было бы говорить. И он без всякой медлительности прямо говорит: «О Литургии!». Итак, я сделаю послушание человеку, который захотел жить Литургию.'
        cn: 我今天问了N.，可以谈论什么。他就毫不迟疑地直接说：「论圣礼仪！」于是，我就会顺服这个想要活出圣礼仪的人。
    - type: paragraph
      text:
        ru: 'Мне трудно говорить о Литургии. По-разному в различные периоды давал мне Бог жить Литургию. Но в начале моего монашества был чудный период, продолжавшийся несколько лет: каждый раз после Литургии было ощущение Пасхи, победоносной и светоносной! Это тем более странно, что, живя Литургию с ее потрясающим и вместе с тем нежным захватом всего духа нашего в сферу самой Литургии, сам я жил только свое отчаяние! Я никак не мог вообразить себя достойным спасения! И когда я читал молитвы: «Верую, Господи, и исповедую, яко Ты еси воистину Христос, Сын Бога живаго, пришедый в мир грешныя спасти, от них же первый есмь аз...», – меня охватывал тихий ужас пред величием тайны Литургии! Раскрыть ее подлинное, бытийное содержание потребует от нас многого подвига. И слова «яко Ты еси воистину Сын Бога живаго, пришедый в мир грешныя спасти» будут звучать совсем иначе в душах наших, потому что, живя каждый день этим и только этим, мы странным образом становимся способными видеть во всем, что совершил Христос, невероятное чудо Бога. Как Он, сотворивший человека по образу Своему и по подобию, хочет жить с человеком!?'
        cn: 我难以言说事奉圣礼。在不同的时期，上帝以不同的方式赐予我体验事奉圣礼。但在我修道生涯的初期，有过一段奇妙的时期，持续了数年：每次事奉圣礼之后，都有一种凯旋的、光明的逾越节感觉！这尤其令人感到奇异，因为，在体验事奉圣礼之时，它以其震撼人心的、同时又温柔的方式，将我们整个心灵摄入事奉圣礼自身的领域，我自己却只活在绝望之中！我实在无法想象我自己配得上救恩！当我诵读祷文：「主啊，我信并承认，祢确实是基督，永生上帝之子，降世为要拯救罪人，我就是罪人中的罪魁……」时，一种寂静的恐惧攫住了我，面对事奉圣礼的奥秘的伟大！揭示它真实的存在性内容，将需要我们付出许多苦修的努力。而「祢确实是永生上帝之子，降世为要拯救罪人」这些话语，将在我们灵魂中回响得完全不同，因为，我们每天以此为生，并仅仅以此为生，我们就会以一种奇异的方式，能够从基督所成就的一切事上，看见上帝那不可思议的奇迹。祂是何等，竟然愿意与那按照祂的形像和样式创造的人同住！？
    - type: paragraph
      text:
        ru: 'Мне пришлось слышать дикие слова относительно нашей Литургии, обвиняющие христиан в каннибализме, потому что они едят плоть и кровь Человека! В Евангелии написано, что когда Господь сказал об этом, то многие отошли, говоря: «Кто может послушать это жестокое слово?!»[235]. Но Бог подходит к этому иначе. Через совершение этого Таинства обычный тварный хлеб прелагается по слову Бога, сотворшего небо и землю, в Тело Христово. Приходит момент, когда это становится без объяснения ясным. Вместе с тем приходит и понимание, что действительно Христос есть Бог, потому что все Его действия преисполнены необычайного величия и необычайной любви к человеку. И когда мы говорим эти слова: «яко Ты еси воистину Сын Бога живаго, пришедый в мир грешныя спасти», мы видим, как действительно мудро спасает Он человека!'
        cn: 我曾听闻关于我们礼仪的荒谬言论，指控基督徒是食人族，因为他们食人之肉，饮人之血！福音书上记载，当主论及此事时，许多人便离去，说道：「这话甚难，谁能听呢？！」[235] 然而，上帝对此却另有安排。借由这件圣事的施行，普通受造之饼，借着创造天地之上帝的话语，被转化成为基督的圣体。总有一天，这会不言自明。与此同时，人们也领悟到基督确实是上帝，因为祂的一切作为都充满了非凡的威严与对人类非凡的爱。当我们诵念这些话语时：「祢诚然是永生上帝之子，降世为拯救罪人而来」，我们便看到祂是何等智慧地拯救了人类！
    - type: paragraph
      text:
        ru: 'Когда мы живем по заповедям Христа, то, естественно, в нас развивается чувство восприятия Духа Его во всех событиях Его мироискупления. Вот сейчас, в пасхальный период, мы поем: «смертию смерть поправ». Это действительно так, но все-таки наш ум не улавливает этого. Только живя Литургию – насколько это возможно и доступно нам – всем нашим существом, мы постепенно становимся чуткими ко многому, что проходит незамеченным у тех, которые не знают Христа, и не любят Его, и не живут по заповедям Его. Как странно Он заповедями Своими дает нам почувствовать всю бытийную правду этих слов: «смертию смерть поправ»! И все-таки это превосходит наш ум, и мы никак не можем охватить все то, что сказано этими словами! Итак, простите, – я хотел бы, чтобы все вы жили то действительно пасхальное состояние, которое Господь дал мне жить первые годы.'
        cn: 当我们遵行基督的诫命时，自然而然地，我们心中会生发出对祂圣灵的感知，在祂救赎世间的所有事件中。就在现在，在复活节期中，我们咏唱：「借死亡践踏了死亡」。这确实如此，但我们的心智却无法全然领会。唯有以我们整个生命来活出礼仪——在我们力所能及的范围内——我们才能逐渐变得敏锐，感知到许多在那些不认识基督、不爱祂、不遵行祂诫命的人那里未被察觉的事物。何其奇妙，祂竟通过祂的诫命，使我们感受到「借死亡践踏了死亡」这些话语中全部的存有性真理！然而这仍然超越我们的心智，我们根本无法完全领会这些话语所蕴含的一切！那么，请原谅我，——我愿你们所有人都能活出那种真正的复活节状态，那是上主在最初几年赐予我活出的。
    - type: paragraph
      text:
        ru: Мне стыдно говорить, но с тех пор, как Господь оторвал меня от видения тварного мира и людей и привлек меня к Себе, я никогда не знал, что такое уныние! В отчаянии от самого себя я остро жил мою недостаточность, когда я представлял себе Царство Христа и вместе с тем – пасхальную радость Воскресения. Иоанн Лествичник отмечает, что овцы Христовы в знойные часы дня как бы засыпают от исходящего огня от солнца и уже чувствуют себя плохо[236]. Так многие монахи, не в силах будучи понять Литургию, засыпают духовно, и сама Литургия не так уж действует на них.
        cn: 我惭愧地说，自从主将我从对受造世界和人类的关注中抽离出来，并吸引我归向祂自己以来，我从未体验过何为忧郁！在对我自己的绝望中，当我思量基督的国度以及随之而来的复活节复活的喜乐时，我深刻地体验到了自己的不足。阶梯约翰指出，基督的羊群在白日炎热的时辰，仿佛因太阳散发的火焰而昏昏欲睡，并已感觉不适[236]。同样，许多修士因无法领悟神圣礼仪，便在灵性上沉睡了，而神圣礼仪本身对他们也就不再有那么大的作用了。
    - type: paragraph
      text:
        ru: Когда мы получаем частицу Тела Христова и несколько капель Его Крови, то поражаемся, до какой степени Он хотел соединиться с нами! И в этих актах мы видим, что Сам Бог, создавший нас, конечно, сотворил все до конца – все, нужное для нашего спасения. Но от нас все-таки требуется труд, подвиг, мудрое терпение на каждый день.
        cn: 当我们领受基督圣体的一小部分和祂宝血的几滴时，我们便惊叹，祂是何等地渴望与我们结合！在这些行动中，我们看到，那创造我们的上帝自己，当然，已经完成了所有的一切——所有为了我们得救所需的一切。但我们仍然需要劳作、功修以及每一天的智慧忍耐。
    - type: paragraph
      text:
        ru: 'То, о чем мы можем только мыслить, но никак не можем выразить словами, остается, действительно, невыраженным. Но даже то, что поддается в какой-то мере выражению человеческим словом, – даже это становится необъятным океаном. Вот странная вещь, действительно: я уже живу в рясе шестьдесят семь лет, и каждый раз Литургия есть нечто новое, единственное! Невозможно привыкнуть к этому. И когда мы приобретаем покой в глубоком сердце нашем от близости к Богу, тогда, конечно, нам легче служить людям. И я хотел бы, чтобы и вы говорили от сердца, полного благодарности Христу за то, что Он нашел пути для того, чтобы соединяться с нами.'
        cn: 我们只能思考却完全无法用言语表达的事物，确实仍是无法表达的。但即使是那些在某种程度上可以用人类语言表达的事物——即使是这些，也变成了浩瀚无垠的海洋。确实，这是一件奇异的事：我穿上修士服已经六十七年了，但每一次，神圣礼仪都是全新的、独一无二的！人无法对此习以为常。当我们因着亲近上帝而在我们内心深处获得平安时，那时，我们当然就更容易服事众人了。我也希望你们能发自内心而言说，充满着对基督的感恩，因祂为与我们联合而找到了道路。
    - type: paragraph
      text:
        ru: 'Литургия Василия Великого действительно космическая по сфере произносимого слова! Слыша эти молитвы, излагающие догматы нашей веры, действительно постепенно мы входим в настоящие измерения Литургии. И сама наша природа изменяется от эгоистической к природе, которая соответствует заповедям Христа Бога. Блаженный Силуан это выразил словами: «Брат наш есть наша жизнь». Сам Господь на Страшном Суде скажет, что каждый малый человек – это Он Сам. И когда к нам придет это состояние, пусть в своих еще примитивных формах, то, конечно, потекут слезы из сердца, исполненного благодарной любви.'
        cn: 大圣巴西略礼仪就其所宣讲之道言范围而言，确实是普世性的！聆听这些阐明我们信仰教义的祷告，我们确实渐渐地进入了礼仪真实的维度。甚至我们自身的本性也从自私的本性，改变为与基督上帝的诫命相符的本性。圣西卢安以此言语表达：「我们的弟兄是我们的生命。」上主自己在末日审判中将会说，每一个微小的人都正是祂自己。当这种状态，即便仍以其原始的形式，临到我们时，当然，眼泪将从那充满感恩之爱的心中涌流而出。
    - type: paragraph
      text:
        ru: Итак, да будет благословенно имя Господне во веки веков! И молитесь за меня.
        cn: 所以，愿主的名直到永永远远蒙称颂！并请为我祷告。
  - type: heading2
    text:
      ru: 'Беседа 30: О богоподобной свободе человека[237]'
      cn: 讲论三十：论人的肖乎上帝的自由[237]
    children:
    - type: paragraph
      text:
        ru: Наш дух сотворен Богом, а не родителями. Небесное Царство восхищается великим подвигом. Желание передать монахам свой энтузиазм по постройке монастыря. Как сделать сей монастырь домом молитвы. Об опыте свободы на Афоне. Каждое действие есть литургический акт. О принципе персоны и многоипостасном Абсолюте. Об энергии общения в нас. О восприятии жизни безначальной. Бог есть Дух. О книгах без опыта богопознания. Мы живем наше ничтожество. Да сохранит нас Бог на верном пути
        cn: '我们的灵由上帝所造，而非父母。

          天国赞叹伟大的苦修。

          愿望将自己对修道院建造的热忱传达给修士们。

          如何使这座修道院成为祷告之家。

          关于在阿索斯山的自由经验。

          每一个行动都是一项礼仪行动。

          关于位格原则以及多位格的绝对者。

          关于在我们之中的交契能量。

          关于领受无始无终的生命。

          上帝是灵。

          关于缺乏认识上帝经验的书籍。

          我们活出我们的虚无。

          愿上帝保守我们在正途上。'
    - type: paragraph
      text:
        ru: Вот снова наше ожидаемое собрание и мы опять вместе, для того чтобы преодолеть непрестанное давление окружающей нас материи и вознестись духом к Тому, Кто превыше всякого ведения. Это собрание и ожидаемое, и сверх ожиданий. Я на каждый день жду смерти, каждую ночь я думаю о ней. Так проходит моя жизнь. И смерть приходит часто, становится рядом, и потом уходит, ничего не совершив. Воспользуемся тем, что она ведет себя так, и продолжим разговор.
        cn: 瞧，我们期待的聚会又到了，我们再次聚集，为了克服周遭物质永不止息的重压，并藉着灵提升到那超越一切知识的祂那里。这聚会既是所期待的，又超越了期待。我日日等待着死亡，夜夜思量着它。我的生命便如此度过。死亡也常降临，伫立在旁，随即又离去，一无所成。既然它如此行事，我们便借此机会，继续谈话。
    - type: paragraph
      text:
        ru: Жизнь в Боге как будто бы очень однообразная. Человек, стремящийся жить по-христиански, становится «однодумом». И эту думу духовную, которая связана с нашей верой в вечного Бога и в вечное спасение всех нас, надо сохранить в суете наших житейских дел.
        cn: 在上帝里的生活似乎非常单调。一个力求以基督徒方式生活的人，就成了「一念之人」。而这一念属灵之思，它与我们对永恒上帝的信仰和我们所有人的永恒救赎相关联，必须在世俗事务的喧嚣中得以持守。
    - type: paragraph
      text:
        ru: 'Есть так много, о чем говорить, и так мало, что можно сказать! В моих книгах многое написано из того, о чем я хотел бы говорить сегодня: о свободе человеческого духа, творимого Богом непостижимым образом. Итак, начало нашего бытия – это рождение наше в теле. У нас впечатление такое, что жизнь духовная и умная тоже зарождается в теле, которое мы получаем от родителей наших. Но по природе своей этот дух совсем другой. По мере того, как мы оставляем этот дух расти в нас, мы понимаем его происхождение от Бога: «Отче наш, Иже еси на небесех, да святится имя Твое, да приидет Царствие Твое, да будет воля Твоя, яко на небеси и на земли сердца нашего» – мы взываем к безначальному Отцу, и, в сущности говоря, только ради этого и стоит жить! Но мы подавлены работой на каждый день, и кругом нас материя, которая все время давит на нас. Получается впечатление, что мы еще не получили жизнь по-настоящему. Но и Господь говорит, что Царство Небесное восторгается большим подвигом и трудом и те, кто трудятся, восхищают его. Это – замечательный момент, когда мы слышим эти слова глубоким сердцем нашим. И выходит, что мы сами – строители нашей вечной жизни. Бог творит нас «потенциально», и потом все происходит: и дары Божии, и наши тварные искания Его любви вечной.'
        cn: 有如此多的内容可谈，而能言说的却如此之少！在我的书中，许多今天我本想谈论的内容已经写下：关于上帝以不可思议的方式所创造的人类精神的自由。因此，我们存在的开端，乃是我们肉身中的降生。我们仿佛觉得，属灵的生命和理性的生命也同样萌生在我们从父母那里所领受的肉身之中。但按其本性，这精神却完全不同。随着我们让这精神在我们内里成长，我们便明白它源自上帝：「我们在天上的父，愿祢的名被尊为圣，愿祢的国降临，愿祢的旨意行在天上，也行在我们心地的地上。」——我们向那无始无终的父祈求，说到底，也唯有为此而活，才值得！然而，我们被日常的工作所压迫，周围的物质也无时无刻不在压制着我们。由此看来，我们仿佛尚未真正获得生命。但上主也曾言，天国是被大力夺取的，而那些努力争取的，就夺取了它。当我们以我们内心深处领受这些话语时，这是一个非凡的时刻。由此可见，我们自己正是我们永恒生命的建造者。上帝「潜在地」创造了我们，然后一切都得以发生：既有上帝的恩赐，也有我们受造者对祂永恒之爱的寻求。
    - type: paragraph
      text:
        ru: Сама жизнь при постройке монастыря заставляет нас работать с камнями и кирпичами, с гравием и всякой землею. И как связать жизнь нашего духа с необходимостью таких работ? – Не без борьбы. Потому что с Богом нам не всегда легко. Скорее редко бывает нам легко, а больше – труд, непонимание и наша узость, неспособная воспринять Дух Бога. Как побороть это влияние материи на нас?
        cn: 建造修道院的生活本身，迫使我们与石块、砖块、砂石以及各种泥土一同劳作。那么，如何将我们的灵性生命与这些劳作的必要性联系起来呢？——这并非没有一番争战。因为我们与上帝同行并非总是轻松的。毋宁说，我们鲜少感到轻松，更多的是辛劳、不解以及我们狭隘的心思，无法领受上帝的圣灵。我们如何战胜物质对我们的这种影响呢？
    - type: paragraph
      text:
        ru: 'Когда я был в вашем возрасте, тогда мне было странным образом радостно трудиться и употреблять усилие для борьбы за освоение Царством любви Отца безначального. Мы живем в этом мире, как в тесной тюрьме. Каким-то контрастом кажется слово о свободе. Но бывают моменты, когда посещает нас Бог Своею силою (богословски – энергией), и тогда становится ясным видение, что мы рождены от Бога и призваны иметь ту же жизнь, которую имеет Сам наш Творец. Говорить о свободе и о путях к ней мне не просто... Странным образом устроен наш дух вечный: для него мысль приемлема только тогда, когда это есть мысль об Абсолюте безначальном, а мы нуждаемся в этих земных работах. Я прожил все, что вы сейчас живете, и у меня теперь совсем другая жизнь, чем у вас. И я хотел бы передать вам восторг нашего духа, когда призывает нас Бог бороться за созидание нашего дома духовного.'
        cn: 当我像你们这般年纪时，我以一种奇妙的喜悦，辛勤劳作并努力奋斗，为争取在无始之父的爱之国度中扎根并深入其中。我们生活在这个世界上，如同身处狭窄的监狱。关于自由的话语，似乎形成了一种对比。然而，有些时刻，上帝以祂的能力（神学上称之为——能量）眷顾我们，那时，我们便清楚地看见，我们是从上帝而生，并被召要拥有与我们创造主本身相同的生命。谈论自由以及通往自由的道路，对我来说并非易事……我们永恒的灵以一种奇特的方式被造：对它而言，唯有当那思想是关于无始之绝对者的思想时，才是可接受的，但我们却需要从事这些尘世的劳作。你们现在所经历的一切，我都曾经历过，而我现在的生活与你们完全不同。我希望将我们灵的狂喜传递给你们，当上帝召唤我们，为建造我们属灵的家园而奋斗时。
    - type: paragraph
      text:
        ru: 'В судьбе нашего монастыря наблюдается удивительный план Бога: мы начинали с «ничего», подобно творению Бога из «ничего», и каждый шаг давался нам большим усилием. И теперь, когда стало недостаточно места, нам дал Бог новое пространство для постройки нашего монастыря. Примите постройку нового дома как задачу от Бога. Нам Господь дал преимущество совместить жизнь в нашей литургической молитве и наш медленный прогресс в строительстве кирпичного дома и храма из камней. И вот потерпите теперь несколько лет, но стройте дом и стройте храм.'
        cn: 在我们修道院的命运中，显明了上帝奇妙的计划：我们从「无」开始，就像上帝从「无」中创造万物一样，每一步都需我们付出巨大的努力。而如今，当空间不足时，上帝赐予了我们新的空间，用于建造我们的修道院。你们当接受新房的建造，作为上帝所赐的任务。上主赐予我们特权，将我们礼仪祷告中的生活，与我们建造砖房和石殿缓慢的进程结合起来。所以，请忍耐几年，但要建造房屋，并建造圣殿。
    - type: paragraph
      text:
        ru: 'Итак, снова начинается томительный процесс, и те, которые нудятся и работают сознательно, в результате овладеют Царством вечным. Никогда не надо упускать, что все мы здесь собраны для того, чтобы жить вечно с Богом. И в этом смысл всех моих бесед с вами – как мы можем сделать это место, наш монастырь, домом молитвы и постройки нашей жизни во Христе Иисусе и через Него стать детьми Отца Небесного: «Отче наш, Иже еси на небесех».'
        cn: 于是，这煎熬的过程又重新开始，而那些劳苦并自觉地工作的人，最终将拥有永恒的国度。我们绝不可忽略，我们所有人都聚集在此，是为了与上帝永恒地同住。这正是我与你们所有谈话的意义所在——我们如何能使这个地方，我们的修道院，成为祷告之所，以及在基督耶稣里建造我们的生命，并藉着祂成为天父的儿女：「我们在天上的父。」
    - type: paragraph
      text:
        ru: Как я хочу вам передать все, мои драгоценные братья и сестры! Стройте монастырь, и параллельно этому будет строиться ваш духовный храм, вечный уже и нерукотворенный. Тогда наше бедненькое и маленькое место станет для нас драгоценным.
        cn: 我多么想把这一切都传达给你们，我亲爱的弟兄姊妹们！建造修道院吧，与此同时，你们属灵的圣殿也将被建造，这圣殿是永恒的，并非人手所造的。那么，我们这贫瘠狭小之地就将对我们变得宝贵。
    - type: paragraph
      text:
        ru: Много раз мне приходилось задумываться над тем, возможно ли образование человека провести только по линии положительной, избегая отрицательных опытов. Когда я приехал на Афон и оказался в условиях афонского монастыря, там был игумен и другие старцы, которые заботились о жизни монастыря вообще и каждого члена. И тогда я почувствовал себя в свободе отдаться всецело мыслью Богу. Эта свобода была для меня таким великим даром! Маленького уголка моей кельи мне было достаточно, чтобы охватить весь мир в молитве моей.
        cn: 我曾多次深思，是否可能只循着积极的路线来塑造人的教养，而避免负面的经验。当我来到阿索斯山，身处阿索斯山修道院的环境中时，那里有位院长及其他长老，他们关顾着整个修道院的生命以及每一位成员。于是我感到获得了自由，能够全心全意地将我的思想献给上帝。这份自由对我而言是如此巨大的恩赐！我斗室的一隅，足以让我在我的祷告中包罗整个世界。
    - type: paragraph
      text:
        ru: Теперь многие люди, приходя к духовникам, жалуются об одиночестве. Но, по существу говоря, когда мы действительно живем Божеством Христа, тогда мы не знаем одиночества. Говорю вам по опыту моему, потому что я был в пустыне семь лет, и никогда не прикоснулось ко мне ощущение, что мне чего-то не хватает, то есть какой-то компании, но в духе была полнота общения с Богом и с человеком.
        cn: 如今，许多人来到神师面前，抱怨他们的孤独。然而，从本质上讲，当我们真正以基督的神性生活时，那时我们便不认识孤独。我凭我的经验告诉你们，因为我在旷野居住了七年，从未有缺憾感触及我，即，觉得缺少某种陪伴，但在灵里却与上帝和人享有完全的共融。
    - type: paragraph
      text:
        ru: Когда мы во всем ограничиваемся, от всего отказываемся и хотим слышать только имя Бога, Его слова, Его заповеди, призывать Его, быть с Ним связанными всем существом, тогда всякое дело становится литургическим актом великого значения. И так каждый – и каждая сестра, и каждый из отцов – пусть не думает, что он занят ничтожным делом, скажем, когда надо посеять картошку, посеять бобы, поливать их и так далее, торопиться, уставать... Что бы вы ни делали – все делается для созидания храма и для Литургии. Тогда наш дух войдет в тот момент, который исторически происходил две тысячи лет тому назад, когда Христос еще был с нами на земле, и сольется с ним. Тогда сократится время, и две тысячи лет станут прозрачны, как слово. Таким же образом и все возрасты истории, хотя бы их было и миллионы лет, в нашем сознании свяжутся в единый клубок молитвы. Неразгаданная тайна бытия, бытия ипостасного, персонального – странным образом живет этот принцип в каждом из нас и даже в Самом Боге. И это начало постоянно ищет того, что является Абсолютом.
        cn: 当我们处处设限，放下一切，只愿聆听上帝的圣名、祂的话语、祂的诫命，呼求祂，以我们的全人与祂相连时，那么每一件工作都将成为意义非凡的礼仪行动。因此，无论是姐妹，还是教父，都不要以为自己所做的是微不足道之事。例如，当需要播种土豆、播种豆子、浇灌它们等等，匆忙劳累时……无论你们做什么——一切都是为了建造圣殿和为了圣礼。那时，我们的灵将进入两千年前基督仍在地上与我们同在的历史时刻，并与之融合。那时，时间将缩短，两千年将变得清澈如话语。同样地，所有历史的时代，即便它们有数百万年之久，在我们意识中也将系结成一团祷告。本是的未解之谜——位格性的本是、个体性的本是——这个原则奇妙地活在我们每个人里面，甚至在上帝自己里面。而这个开端不断地寻求那作为绝对者的。
    - type: paragraph
      text:
        ru: И почему не довольно одного себя, чтобы жить? – Нам дано Откровение, что в безначальном бытии Бога – не Один, а Три. И человек, даже который мыслил бы постоянно только о бесконечном и безначальном, странным образом имеет нужду сказать об этом другому лицу и жить вместе. Это есть со-общение, общение в бытии. Особенно монашеское общежитие дает нам возможность осуществлять это общение.
        cn: 而为什么仅仅靠自己就不足以生活呢？——启示已赐予我们，即在上帝无始的存有中，祂并非一位，而是三位。而人，即使他会不断地只思考无限与无始的事物，却奇特地有需要将此事告知另一个人并共同生活。这便是共融，一种在存有中的共融。尤其是修道团体的共同生活，它赐予我们实现这种共融的机会。
    - type: paragraph
      text:
        ru: 'И так Бог не мыслится уже нами как Единоипостасный: полнота откровения о Боге Триипостасном показывает, что даже Бог живет общением с другим Лицом, с другой Ипостасью. Так дорожите тем, что в нашей семье вы можете жить действительно постоянной молитвой за всех, кто собран воедино в этом месте.'
        cn: 于是，我们不再将上帝视为独一位格者：关于三位一体上帝启示的丰满表明，甚至上帝也生活在与另一个位格、另一位格的相通之中。因此，请珍惜在我们的家庭中，你们能够为所有在此地聚集为一的人，活出真正恒久的祷告。
    - type: paragraph
      text:
        ru: Для того чтобы постоянно была с нами энергия общения, я рискну дать вам как образец молитву о нашем единстве. И тогда вы увидите, как зарождается в нас чисто духовная сила, в которой мы ощущаем свободу. Так постепенно из малейших вещей рождается великая вечность. В моей книге я написал, что по завершении сего процесса нашей жизни, если мы спасены Богом, мы получаем жизнь безначальную по существу и забудем даже наше земное происхождение.
        cn: 为了让交流的能量持续与我们同在，我冒昧地给你们一个关于我们合一的祷告作为范本。这样你们就会看到，在我们里面如何孕育出纯粹属灵的力量，在这力量中我们感受到自由。如此逐渐地，从最微小的事物中诞生出伟大的永恒。在我的书中我写道，在我们生命这过程结束后，如果我们蒙上帝所救，我们将获得本质上无始的生命，甚至会忘记我们的属地起源。
    - type: paragraph
      text:
        ru: 'Мы начинаем с азов, постепенно выполняя маленькие вещи: с того, как мыслить добро о всех и каждом, о всех братьях и о всех сестрах; с того, как не принимать плохих мыслей, не допускать, чтобы злой дух овладевал сердцами нашими, вводя в осуждение; с того, как сохранить восторг общения с каждым другим лицом.'
        cn: '我们从基础开始，循序渐进地完成小事：

          从如何对所有人，对每一个个体，对所有的弟兄姊妹都心存善念；

          从如何不接受恶念，不容许恶灵占据我们的心，使我们陷入论断；

          从如何保持与每一个人交通的喜悦。'
    - type: paragraph
      text:
        ru: Я постараюсь дать эту молитву не как обязательное правило, но как образец того, о чем молиться, чтобы победить давление материи на нас и перевести все в область духа, потому что «Бог есть дух»[238]. Так постепенно мы будем восходить в иную форму бытия, которую невозможно описать в словах или дать понять о ней тем, кто опытно не испытал сего.
        cn: 我将尝试提供这祷文，不作为强制性规则，而是作为祈祷的范本，以战胜物质对我们的压迫，并将一切转入精神的领域，因为「上帝是灵」[238]。如此，我们便会逐渐升入另一种存在形式，这种形式无法用言语描述，亦无法让未曾亲身经历之人领悟。
    - type: paragraph
      text:
        ru: 'Ко мне сейчас пришла страшная мысль: многие книги написаны о христианстве людьми, которые не имеют опыта Бога, людьми, у которых интеллект земного порядка. Как избежать влияния этих умов? – Недавно мне пришлось беседовать с гостями. Наши собеседники были дорогие для нас люди. И мы рассуждали о том, что в современном мире появляются книги, написанные теми, кто имеет только земное образование и никогда по существу не жил Бога. Мы говорим о духе, а для них этот дух является мифом. И если бы они жили Бога, у них было бы другое мышление.'
        cn: '我现在突然产生了一个可怕的念头：许多关于基督教的书籍，是由那些没有上帝经验、且智慧只属乎属世秩序的人撰写的。如何避免这些头脑的影响？


          —— 最近我与客人进行了一次交谈。我们的交谈对象都是我们珍视的人。而我们探讨了在当今世界中，出现了由那些只拥有属世教育、且从未真正活出上帝的人所撰写的书籍。我们谈论的是圣灵，但对他们而言，这圣灵却是一个神话。而如果他们活出上帝，他们的思维方式就会不同。'
    - type: paragraph
      text:
        ru: Когда вы молитесь Богу о самих себе, и о всех братьях и сестрах ваших, и дальше вплоть до всего человечества, ваш дух привыкнет жить именно в этой форме, когда многие факты станут неопровержимы в своей истине.
        cn: 当你为自己、为所有你的弟兄姊妹、并进而直至全人类向上帝祷告时，你的灵会习惯正是以这种形式生活，届时，许多事实在其真理中将变得无可辩驳。
    - type: paragraph
      text:
        ru: Это странная вещь – человек! Он вызван к бытию повелением Бога Творца, и мы сами живем наше происхождение из ничего, исполненные сознанием нашей нищеты. Но вот Христос принес нам мысль и надежду и даже энергию иной жизни. И как Он странно обращается с нами! Вот те, которым поручено служение духовническое – быть духовником, понимают, о чем я говорю. Как вдруг этот возникший из ничего человек начинает говорить о законах вечного бытия? Это страшно интересная вещь, что Бог оставляет нас самих творить, а Сам Он стоит или напротив нас, или рядом с нами и говорит о том, какой Он есть в Самом Себе. Мы не воспринимаем всего, что Он говорит. Однако, при Его содействии, Духом Святым мы постепенно входим в духовное видение, и оно приводит нас в восторг пред Богом нашим и Отцом, Который творит нас из ничего.
        cn: 人——多么奇异的存在啊！他是借着创造主上帝的命令被召而有，而我们自己活出我们从虚无而来的起源，充满着对自身贫乏的认知。但你看，基督为我们带来了思想、希望，乃至另一种生命的活力。而祂待我们是何等奇妙啊！那些受托于神师圣职的人——即是做神师的——明白我所说的。这个从虚无中而来的人怎能突然开始谈论永恒存在的法则呢？这是一件非常有趣的事：上帝让我们自己去创造，而祂自己则或与我们相对，或与我们并立，并述说祂自身之所是。我们无法完全领会祂所说的一切。然而，在祂的同工下，并借着圣灵，我们逐渐进入属灵的洞见，这使我们在我们的上帝和父面前感到狂喜，祂从虚无中创造了我们。
    - type: paragraph
      text:
        ru: А сейчас моя молитва о том, чтобы Господь сохранил всех нас во истинном пути.
        cn: 而现在我的祷告是，愿主保守我们众人都在真道上。
    - type: paragraph
      text:
        ru: Он Сам есть наш Путь[239].
        cn: 祂自己是我们的道路[239]。
