  children:
  - type: heading2
    text:
      ru: О Молитве
      cn: 论祷告
    children:
    - type: heading3
      text:
        ru: Молитва нескончаемое творчество
        cn: 祷告是无尽的创造。
      children:
      - type: paragraph
        text:
          ru: 'Молитва есть бесконечное творчество, высшее всякого иного искусства или науки. Чрез молитву входим мы в общение с Безначальным Бытием. Или иначе: жизнь Самосущего Бога входит в нас по этому каналу. Молитва есть акт наивысшей мудрости, всепревосходящей красоты и достоинства. В молитве – святое упоение нашего духа. Но пути сего творчества сложны. Тысячи раз переживем мы и пламенное устремление к Богу, и повторяющиеся отпадения от Света Его. Часто и многообразно ощутим мы неспособность нашего ума подняться к Нему; иногда будем стоять на грани как бы безумия и с болезнью в сердце высказывать Ему наше бедственное состояние: «Ты дал мне заповедь Твою – любить, и я принимаю ее всем моим существом; но вот, во мне самом не обретаю силы этой любви... Ты есть Любовь; прииди же Ты Сам и вселись в меня, и совершай во мне все то, что Ты заповедал нам, ибо заповедь Твоя неизмеримо превышает меня... Изнемогает мой ум постигать Тебя. Не может мой дух проникнуть в тайны жизни Твоей... хочу во всем творить волю Твою, но дни мои истекают в безвыходных противоречиях... Страшусь потерять Тебя за те злые мысли, что в сердце моем; и страх этот распинает меня... Прииди же и спаси меня утопающего, как спас Ты Петра, дерзнувшего пойти к Тебе навстречу по морским водам» (ср.:Мф. 14:28–31).'
          cn: '祷告是无尽的创造，超越任何其他艺术或科学。借着祷告，我们进入与无始的存有的交通。或者换句话说：自有永有的上帝的生命借着这个渠道进入我们里面。祷告是至高智慧、全然超卓之美与尊严的行动。在祷告中，有我们灵的圣洁陶醉。但这创造的道路是复杂的。我们会成千上万次地经历炽热地奔向上帝，以及反复从祂的光中堕落。我们常常并以各种方式感受到我们的心智无法提升到祂那里；有时我们会站在仿佛疯狂的边缘，并带着心里的痛苦向祂倾诉我们悲惨的境况：


            「祢赐予我祢的诫命——去爱，我全心全意地接受它；但是，看哪，在我自己里面却找不到这种爱的力量……祢是爱；那么，请祢亲自降临并住在我里面，在我里面成就祢所吩咐我们的一切，因为祢的诫命远远超越我……我的心智疲惫不堪，无法领悟祢。我的灵无法深入祢生命的奥秘……我渴望在一切事上遵行祢的旨意，但我的日子却在无解的矛盾中消逝……我害怕因我心中的那些恶念而失去祢；这恐惧使我备受煎熬……那么，请祢降临并拯救我这沉沦之人，就像祢拯救彼得一样，他曾大胆地在海面上行走，向祢走去。」(马太福音 14:28-31)'
      - type: paragraph
        text:
          ru: 'По временам нам кажется, что действие молитвы слишком медлительно: несоразмерно краткости нашего существования; и крик вырывается из груди: «Поторопись!». Он не всегда сразу откликается на наш призыв. Как некий плод на дереве, Он оставляет душу нашу быть опаленною солнцем, вынести удары холодных и жгучих ветров, томиться жаждой или выносить потоки дождей. Но если мы не выпустим из рук наших край Его ризы, то увидим благой результат.'
          cn: 有时我们觉得祷告的果效过于缓慢：与我们短暂的存在不成比例；一声呼喊从我们胸膛中迸发而出：「快些！」祂并非总是立即回应我们的呼求。祂像树上某个果子一样，任由我们的灵魂被太阳炙烤，承受冰冷与炽热之风的打击，饱受干渴，或经受倾盆大雨的冲刷。但如果我们不从我们手中放开祂衣裳的边角，我们就必看见良善的果效。
      - type: paragraph
        text:
          ru: Нам необходимо пребывать в молитве возможно большее время, чтобы Его непобедимая сила проникла в нас и сделала бы нас способными противостоять всем разрушительным влияниям. И когда возрастет в нас сила сия, тогда радость надежды на окончательную победу воссиявает в нас.
          cn: 我们应当尽可能多地恒久祷告，好叫祂那不可战胜的力量渗透我们，并使我们能够抵挡一切破坏性的影响。当这力量在我们里面增长时，那时，对最终胜利的盼望之喜乐便会在我们里面照耀。
      - type: paragraph
        text:
          ru: 'Молитва непременно восстановит в нас то Божественное дыхание, которое «вдунул Бог в лицо Адама» и в силу которого«Адам стал душою живою»(Быт. 2, 7). Молитвою возрожденный дух наш начинает удивляться великой тайне Бытия. И особый восторг могучим потоком заливает наш ум: «Бытие! Какая чудная тайна... Как оно возможно?.. Дивен Бог, и творение Его дивно». Переживем мы смысл слов Христа:«Я пришел для того, чтобы(люди)имели жизнь и имели с избытком»(Ин. 10, 10). Избыток! И это воистину так.'
          cn: 祷告必将恢复我们里面那神圣的气息，这是「上帝吹入亚当鼻孔」的，并因此「亚当就成了有灵的活人」(创世记 2:7)。藉着祷告，我们重生的灵开始惊叹于伟大的存有之奥秘。一种特别的狂喜以沛然洪流倾注我们的心智：「存有啊！这是何等奇妙的奥秘……它怎能存在？……上帝是奇妙的，祂的创造也是奇妙的。」我们将体会基督这些话语的意义：「我来了，是要叫人得生命，并且得的更丰盛」(约翰福音 10:10)。丰盛！这确实是如此。
      - type: paragraph
        text:
          ru: 'Но снова и снова о том же: жизнь сия парадоксальна, как парадоксально все учение Господа:«Огонь пришел Я низвести на землю, и как желал бы, чтобы он уже возгорелся»(Лк. 12, 49). Всем нам, сынам Адама, необходимо пройти чрез сие небесное пламя, пожигающее корни смертоносных страстей. Иначе не увидим мы сей Огонь преложившимся в Свет новой жизни, потому что в нашем падении горение предваряет просвещение, и не наоборот. Итак, благословим Господа и за опаляющее действие Его любви.'
          cn: 但一再又一再地，还是关于同一件事：这生命是悖论的，正如上主的一切教导都是悖论的：「我来是把火投在地上，我多么切望它已经燃起来！」(路加福音 12:49)。我们所有亚当之子，都必须经过这属天的火焰，它焚烧着致死情欲的根源。否则我们就无法看到这火焰转化为新生命的光，因为在我们堕落的状态中，焚烧先于光照，而非反之。因此，让我们赞颂上主，也赞颂祂那焚烧之爱的作为。
      - type: paragraph
        text:
          ru: Мы многого еще не знаем, и все же хоть и"отчасти"(1Кор. 13, 9), но ныне и нам ведомо, что для нас нет иного пути для того, чтобы стать«сынами воскресения»(Лк. 20, 36), сынами Божьими, чтобы соцарствовать с Единородным. Как бы ни был болезнен процесс нашего воссоздания, чрез какие бы то ни было терзания и подчас агонии проводил нас Бог, – все в конце станет благословенным. Если приобретение научной эрудиции требует долголетнего, напряженного труда, то стяжание молитвы еще и несравненно большего.
          cn: 我们仍有许多未知，尽管「一部分」（哥林多前书 13:9），但如今我们也已得知，对我们而言别无他途，才能成为「复活的子民」（路加福音 20:36），成为上帝的儿子们，以便与独生子一同为王。无论我们重塑自身的过程多么痛苦，无论上帝使我们经历何种折磨，以及有时是极度的痛苦，——最终一切都将蒙福。如果获得学术博学需要长年累月、艰苦卓绝的努力，那么祈祷的获得则需要更加无可比拟的努力。
      - type: paragraph
        text:
          ru: 'Когда Евангелие и Послания становятся нашей повседневной реальностью, тогда мы начинаем ясно видеть, насколько наивными были наши прежние представления о Боге и жизни в Нем. Таинственна Премудрость данного нам Откровения: оно далеко превосходит человеческое воображение.«Не видел того глаз, не слышало ухо, и не приходило то на сердце человеку, что приготовил Бог любящим Его»(1Кор. 2, 9). Даже малейшее прикосновение к нам Божественного Духа является славою, не сравнимою с содержанием жизни без Бога.'
          cn: 当福音与书信成为我们日常现实时，我们便开始清楚看见，我们以往对上帝以及在祂里面生活的观念是何等幼稚。赐予我们的启示所蕴含的智慧是奥秘的：它远远超越了人的想象。「眼睛未曾看见，耳朵未曾听见，人心也未曾想过，上帝为爱祂之人所预备的。」(哥林多前书 2:9)。即使圣灵对我们有丝毫的触碰，那也是荣耀，是无法与没有上帝之生活的任何内容相比的。
      - type: paragraph
        text:
          ru: 'Подлинная молитва, единящая нас с Всевышним, есть не что иное, как свет и сила, сходящие на нас с небес. Она по сущности своей трансцендирует наш план. В этом мире нет источника энергии для нее. Если я хорошо питаюсь, чтобы тело мое было сильным, то плоть моя бунтует, и требования ее растут: ей не до молитвы. Если я смиряю плоть чрезмерным постом, то на некоторое время в болезненном воздержании создается благоприятная почва для молитвы, но затем тело изнемогает и отказывается следовать за духом. Если я общаюсь с хорошими людьми, то, случается, испытываю душевное удовлетворение, иногда же получаю новый психический или интеллектуальный опыт, но весьма редко импульс для глубокой молитвы. Если я одарен умственно для серьезной научной работы или для художественного творчества, то мой успех явится поводом к тщеславию, и становится невозможным найти глубокое сердце: место духовной молитвы. Если я богат материально и занят тем, чтобы использовать связанную с богатством власть, или возможность воплотить некоторые из моих идей, или удовлетворить моим эстетическим или душевным пожеланиям, то душа моя не восходит к Богу, как мы Его познали чрез Христа. Если я ухожу в пустыню, отрекшись от моих имений, то и тогда сопротивление всех космических энергий парализует мою молитву. И так без конца.'
          cn: 真正的祷告，使我们与至高者合一的，无非是那从天上降到我们身上的光与力量。它就其本质而言，超越了我们的层面。在这个世界上，没有它的能量来源。如果我饮食充足，为了使我的身体强壮，那么我的肉身就会反叛，它的要求会不断增长：它根本无暇顾及祷告。如果我通过过度禁食来制伏肉身，那么在一段时间内，在这种痛苦的克制中，会为祷告创造有利的土壤，但随后身体就会疲惫不堪，并拒绝追随灵。如果我与好人交往，那么有时我会感到心灵的满足，有时也会获得新的心理或智力体验，但却很少能获得深刻祷告的动力。如果我智力出众，适合严肃的科学工作或艺术创作，那么我的成功就会成为虚荣心的缘由，使我无法找到一颗深邃的心灵：属灵祷告的所在。如果我物质富有，并忙于使用与财富相关的权力，或忙于实现我的一些想法，或忙于满足我的审美或心灵愿望，那么我的灵魂就不会升向上帝，正如我们通过基督所认识祂的那样。如果我隐退到旷野中，舍弃我的财产，那么即便那时，所有宇宙能量的阻力都会麻痹我的祷告。如此这般，无穷无尽。
      - type: paragraph
        text:
          ru: Истинная молитва к Богу истинному есть общение с Духом Божиим, Который молится в нас; Он дает нам знать Бога; Он возводит дух наш в состояние созерцания вечности. Как сходящая Свыше благодать, молитвенный акт превышает наше земное естество, в силу чего ему противится тленное тело, неспособное к восходу в сферу духа; противится интеллект, бессильный вместить беспредельность, колеблемый сомнениями, отталкивающийся от всего, что превосходит его разумение. Молитве сопротивляется социальная среда, в которой мы живем, которая организовывает свою жизнь с иными целями, диаметрально противоположными молитве. Молитву не терпят неприязненные духи. Но только она, молитва, возрождает тварный мир из его падения, преодолевая его косность и инерцию великим напряжением духа нашего в следовании заветам Христа.
          cn: 真正的祷告，是向着真实的上帝，是与上帝的圣灵相通，这圣灵在我们里面祷告；祂使我们认识上帝；祂将我们的灵提升到默观永恒的境界。祷告的行为如同从高天降下的恩典，超越了我们属世的本性，因此朽坏的肉身抗拒它，因其无法上升到灵的领域；理智也抗拒它，因其无力容纳无限，被怀疑所动摇，排斥一切超出其理解范畴的事物。我们所处的社会环境也抗拒祷告，它以与祷告全然相反的目的来组织其生活。敌对的灵也不容忍祷告。但唯有它，这祷告，使受造界从其堕落中复兴，借着我们灵在遵行基督圣训时的巨大张力，克服其迟钝和惰性。
      - type: paragraph
        text:
          ru: 'Труден подвиг за молитву: меняются состояния нашего духа: иногда молитва течет в нас, как могучая река, иногда же сердце становится иссохшим. Но пусть всякое снижение молитвенной силы будет возможно кратким. Молиться – нередко значит высказать Богу наше бедственное положение: бессилие, уныние, сомнения, страхи, тоску, отчаяние, – словом, все, что связано с условиями нашего существования. Высказать, не изыскивая изящных выражений и даже логической последовательности... Часто сей способ обращения к Богу явится началом молитвы-беседы.'
          cn: 祷告的功修是艰难的：我们灵性的状态时常变化；有时祷告在我们里面流淌，如同奔腾的河流；有时心却变得枯干。但愿祷告力量的任何减弱都尽可能短暂。祷告常常意味着向 上帝 倾诉我们困苦的境况：无力、沮丧、疑惑、恐惧、忧郁、绝望——简而言之，一切与我们生存状况相关的事物。倾诉时，不刻意寻找优美的措辞，甚至不讲究逻辑顺序……常常，这种与 上帝 交流的方式将成为祷告式交谈的开端。
      - type: paragraph
        text:
          ru: 'Иногда мы будем в волнах Божией любви, которую по наивности поймем односторонне, как нашу любовь к Нему. Со мною так бывало: я не дерзал думать, что беспредельно великий Творец всего может Своим вниманием остановиться на мне, ничтожном и гадком. И я говорил: «О, если бы было возможно, чтобы Ты любил меня так – как я люблю Тебя... Видишь ли Ты, как сердце мое жаждет Тебя день и ночь? Склонись ко мне; яви мне Твое Лицо; сделай меня таким, каким Ты хочешь видеть созданных Тобою; таким, какого Ты, Всесвятой, сможешь принять и любить...». Я не знал, что говорю (Лк. 9, 33); я не смел подумать, что это Он Сам молится во мне.'
          cn: 有时，我们会沉浸在上帝的爱中，却又天真地将其单方面理解为我们对祂的爱。我曾有过这样的经历：我不敢奢望，那无限伟大的万物创造者会将其关注停留在像我这般卑微而污秽之人身上。于是我说道：「哦，如果祢能像我爱祢一样爱我，那该多好……祢可曾看见，我的心日夜渴慕祢？俯就于我；向我显现祢的圣容；使我成为祢所希望祢所造之人那样；成为祢，这位至圣者，所能接纳和爱的人……」我并不知道自己所言为何（路加福音 9:33）；我不敢去想，这正是祂自己在我的里面祷告。
      - type: paragraph
        text:
          ru: Созерцать святость и смирение Бога – поражает душу, и она с великим благоговением внутренне поклоняется Ему в любви. Такая молитва переходит иногда в видение несозданного Света.
          cn: 默观上帝的圣洁与谦卑，震撼灵魂，灵魂便以极大的敬畏，在爱中于内心深处敬拜祂。这样的祷告有时会转化为未受造之光的异象。
      - type: paragraph
        text:
          ru: 'Чтобы мы познавали исходящие от Бога дары, Он, после посещения, оставляет нас на время. Странное впечатление производит богооставленность. В молодости я был живописцем (боюсь, что и до сих пор он не совсем умер во мне). Этот естественный дар пребывал внутри меня. Я мог утомляться, не иметь сил на работу, не быть вдохновленным; но я знал, что дар сей есть моя натура. Когда же Бог покидает, тогда ощущается некий провал в самом бытии; и не знает душа – возвратится ли когда-нибудь Ушедший. Он – иной по природе Своей; Он скрылся, и я остался пуст; и пустоту эту страшную переживаю, как смерть. С Его приходом мне было явлено нечто прекрасное, милое сердцу, превосходящее мое самое дерзновенное воображение. И вот, я снова в том состоянии, которое раньше казалось мне нормальным, удовлетворительным, а теперь оно ужасает меня: представляется слишком животным-скотоподобным... Я был введен в дом великого Царя; я знал, что я родственник Ему, но вот опять я не больше, чем бездомный скиталец.'
          cn: 为了使我们认识从上帝而来的恩赐，祂在探访之后，暂时离开我们。被上帝离弃感产生一种奇异的感受。我年轻时曾是位画家（我恐怕，直到如今他仍未完全在我里面消逝）。这份天赋一直在我内在。我可能感到疲惫，没有力气工作，没有灵感；但我知道这份恩赐是我的天性。然而当上帝离去时，在存在的本体中就感受到某种断裂；灵魂不知——那位离去者是否还会归来。祂的本性与众不同；祂隐匿了，我变得空虚；这份可怕的空虚，我体验如同死亡。随着祂的到来，我被启示了某些美好、合乎我心意的，超越我最放胆的想象的事物。而今，我再次处于那种曾在我看来正常、令人满意的状态，而现在却令我恐惧：它显得过于动物性——像牲畜一般... 我曾被引领进入伟大君王的家；我知道我是祂的亲属，但现在我又不过是个无家可归的流浪者。
      - type: paragraph
        text:
          ru: 'Чрез смену состояний познаем мы различие природных даров от тех, что нисходят как благоволение Свыше. Чрез покаянную молитву я удостоился первого посещения, чрез молитву же, но более горячую, я надеюсь возвратить Его. И действительно: Он приходит. Часто, и даже обычно Он меняет образ Своего прихода. Так я непрестанно обогащаюсь познаниями в плане Духа: то в страдании, то в радости, но я расту. Увеличивается моя способность пребывать в прежде неведомой сфере более длительные сроки.'
          cn: 借着状态的更迭，我们得以认识自然的恩赐与那些自上而降的恩宠之间的区别。借着悔罪的祷告，我蒙受了首次临访；而借着祷告，却是更加炽热的祷告，我希望祂能再次降临。的确如此：祂降临了。祂常常，甚至通常，改变祂降临的方式。如此我便不断地在灵性方面得以丰富：时而在苦难中，时而在喜乐中，但我仍在长进。我在先前未曾知晓的境域中停留更久的能力增强了。
      - type: paragraph
        text:
          ru: 'Стань твердо умом в Боге, и придет момент, когда бессмертный Дух прикоснется к сердцу. О, это прикосновение Святого святых. Его нельзя сравнивать ни с чем: оно восхищает наш дух в область нетварного Бытия; уязвляет сердце любовью, непохожею на то, что обычно мыслят люди под этим словом. Свет ее, любви сей, изливается на всю тварь, на весь мир людской в его тысячелетнем явлении. Любовь сия ощутима физическим сердцем, но по роду своему она духовная, нетварная, как исходящая от Бога.'
          cn: 将心智坚定地立于上帝之中，终会有一个时刻，不朽的圣灵将触及人心。哦，这是至圣者的触碰。这（触碰）是无可比拟的：它将我们的灵提升至非受造之存有的境界；以爱刺透人心，这爱非同世人通常所理解的爱。这爱之光倾泻于所有受造之物上，倾泻于整个人类世界及其千年的显现之中。这爱可由肉身之心感知，但就其本质而言，它是属灵的，非受造的，如同源自上帝一般。
      - type: paragraph
        text:
          ru: 'Животворящий Дух Божий посещает нас, когда мы пребываем в состоянии смиренной открытости для Него. Он не насилует нашей свободы; Он окружает нас Своей нежной теплотой; Он приближается к нам так тихо, что мы можем и не заметить Его сразу. Не должно ждать, чтобы Бог ворвался внутрь нас силою, без нашего согласия. О, нет: Он уважает человека, смиряется пред Ним: Его любовь смиренная; Он любит нас не свысока, а как нежная мать своего больного младенца. Когда мы открываем для Него наше сердце, то непреоборимо сильно чувство, что Он нам «родной», и душа преклоняется пред Ним в умиленной любви.'
          cn: 赐生命的上帝之灵造访我们，乃是在我们对祂保持谦卑敞开之时。祂不侵犯我们的自由；祂以祂温柔的温暖环绕我们；祂悄然走近我们，以至于我们可能不会立刻察觉祂。我们不该期待上帝会不经我们同意，便以强力闯入我们里面。哦，不！祂尊重人，在人面前谦卑：祂的爱是谦卑的；祂爱我们并非高高在上，而是像一位温柔的母亲爱她生病的婴孩一样。当我们为祂敞开我们的心时，便会有一种不可抗拒的强烈感受——祂对我们而言是「至亲」的，我们的灵魂也以深情敬爱俯伏在祂面前。
      - type: paragraph
        text:
          ru: Божественная любовь, которая есть глубинный характер живой вечности, в этом мире не может не страдать. Смягченному подвигом и посещением благодати сердцу бывает дано жить, пусть отчасти, любовь Христову, объемлющую всю тварь в бесконечном сострадании всему сущему. Ныне – я пленник Христа-Бога. Я познал себя вызванным из ничтожества; по природе своей человек – ничтожество. Но, несмотря на сие, мы ждем от Бога сострадания и уважения. И вдруг, всемогущий открывается нам в Своем неописуемом смирении. Это видение умиляет душу, поражает ум, и мы невольно склоняемся пред Ним. И сколько бы мы ни стремились уподобиться Ему в смирении, мы видим себя бессильными достигнуть Его абсолютность.
          cn: 神圣之爱，乃是活泼永恒的深邃品性，在这世上不能不经受苦难。因着苦修和恩典的临到而变得柔和的心灵，被赐予去活出（哪怕只是部分地）基督的爱，那爱以无限的慈悲包容一切受造物。如今——我是基督-上帝的囚徒。我认识到自己是从虚无中蒙召而出的；就其本性而言，人乃是虚无。然而，尽管如此，我们仍从上帝那里期待着慈悲与尊重。突然之间，全能者在祂那不可言喻的谦卑中向我们显现。这景象使灵魂感动，震撼心智，我们便不由自主地在祂面前俯伏。无论我们多么努力地在谦卑上效法祂，我们都发现自己无力企及祂的绝对。
      - type: paragraph
        text:
          ru: 'Смирение Христово – всепобедительная сила. В своем истощании и служении нам оно не знает унижения: оно неизменно пребывает божественно-величественным в своем существе. Выражаемое в словах наших – оно представится противоречивым. Смирение есть атрибут Божественной Любви, которая в своей открытости для твари кротко принимает все раны от созданных Им.'
          cn: 基督的谦卑——全然得胜的力量。在祂的虚己和对我们的服事中，祂不知羞辱：祂在本质中始终保持着神圣的威严。若用我们的话语表达，它将显得是矛盾的。谦卑是神圣之爱的属性，这神圣之爱在祂对受造物的开放中，温柔地承受着来自祂所创造之物的一切创伤。
      - type: paragraph
        text:
          ru: 'Видение Бога ставит человека пред необходимостью внутреннего самоопределения по отношению к Нему. В существе своем всякое наше действие непременно или приближает нас к Богу, или, наоборот, удаляет. Отсюда всякое начинание совершается в страхе, именуемом Божиим. Боится душа не только явно недоброго дела, но и мысли, могущей опечалить Духа Святого, Которого она возлюбила. Невыразимо велика дистанция между нами и Богом. Мы видим себя недостойными Святого святых; сердце сокрушается от томительного сознания себя нищим. Не сразу понимаем мы, что именно это явление есть уже начало приближения к Богу. Первая заповедь блаженств – «Блаженны нищие духом» – как бы органически приводит к последующим степеням: к плачу, кротости, алканию и жажде правды, к милосердию, чистоте сердца, к первым живым восприятиям нашего богосыновства; что приводит нас к горестному конфликту с миром страстей, к разрыву с неищущим Царства правды; к гонениям, поношениям, злословиям и прочему. Когда противостояние христианского духа духу мира сего достигает своего апогея, тогда жизнь последователя Христа подобна распятию, пусть на невидимом кресте. Это время весьма страшное и вместе спасительное: чрез внутренние, нередко связанные и с внешними обстоятельствами, страдания нашего духа побеждаются страсти, преодолевается и власть мира над нами, и даже смерть: наступает уподобление распятому Христу.'
          cn: 上帝的显现使人必须面对自身在与祂关系中的内在自我定位。实质上，我们的一切行为必然要么使我们亲近上帝，要么反之使我们远离祂。因此，每一个开端都在敬畏上帝中完成。灵魂所惧怕的，不仅是明显不善的行为，更是那能够使她所爱的圣灵忧伤的思想。在我们与上帝之间，存在着无法言喻的巨大距离。我们认为自己不配得见圣中之圣；心灵因着对自己贫乏的痛苦认知而破碎。我们并非立刻明白，正是这种现象，已经是亲近上帝的开端。福哉八端的第一端——「福哉，神贫者！」——仿佛自然而然地引领我们进入接下来的阶段：哀恸，温柔，饥渴慕义，怜恤，心地纯洁，以及对我们上帝之子身份的首次活泼感受；这引导我们与情欲世界产生痛苦的冲突，与不寻求义之国度的人决裂；遭受逼迫、辱骂、毁谤以及其他种种。当基督徒的精神与这世界的精神达到顶峰时，基督追随者的生命便犹如被钉十字架，即便是在一个看不见的十字架上。这时期极其可畏，同时也是具有拯救性的：通过我们灵里内在的（常常也与外在环境相关的）苦难，情欲被战胜，世界对我们的权势被克服，甚至死亡也被超越：于是便达到了与被钉十字架的基督相似的境界。
      - type: paragraph
        text:
          ru: 'Однако и на сей высшей ступени должно сохраниться смирение духа. Самый опыт покажет, что как только на смену ощущению «нищеты» приходит удовлетворение собою, так вся сия скала духовных восхождений рушится, и дом наш опустошается (ср.:Мф. 23, 38): Бог уже не с нами. Так – доколе не смирится снова сердце и не воззовет к Нему с болью. Из этих смен переживаний душа постигает тайну путей спасения; страшится она всего, что противно смирению; молитва ее очищается; ум и сердце не увлекаются ничем посторонним, не желают ничего кроме Бога. Чрез молитву всем существом вливается в молящегося сила новой жизни. Дальнейший восход: начало познания об образе неземного бытия.'
          cn: 然而，即使在此最高阶层，心灵仍需保持谦卑。经验自会表明，一旦「贫乏」感被自我满足所取代，这整座属灵攀升的磐石便会崩塌，我们的家园也会荒芜（参阅：马太福音 23:38）：上帝便不再与我们同在。如此，直到心灵再次谦卑，并带着痛苦向祂呼求。通过这些经验的更迭，灵魂领悟了救赎之道的奥秘；她惧怕一切与谦卑相悖之事；她的祷告得以洁净；思想和心灵不为任何外物所牵引，除了上帝别无所求。借着祷告，新生命的力量以其全人注入祷告者之中。进一步的攀升是：对属天生命样式认识的开端。
      - type: paragraph
        text:
          ru: 'Наше земное существование обусловлено временем и пространством. Но что есть ВРЕМЯ? Возможны многоразличные определения: время есть «место» нашей встречи с Творцом; время есть процесс актуализации замысла Божия о твари:«Отец Мой доселе делает, и Я делаю»(Ин. 5, 17). Творение еще не закончено:«...ходите, пока есть свет, чтобы не объяла вас тьма; ходящий во тьме не знает, куда идет. Пока свет с вами, веруйте в свет, да будете сынами света»(Ин. 12:35–36). Каждому из нас уделено некоторое «свое время»; короткое, но достаточное для обретения спасения. Творческая идея Бога в творении осуществляется:«...у Бога не останется бессильным никакое слово»(Лк.1, 37). На Голгофе, умирая, Господь сказал: «СОВЕРШИЛОСЬ»... Придет другой момент, когда снова будет сказано подобное сему слово; о нем пишется в Апокалипсисе:«И Ангел... поднял руку свою к небу, и клялся живущим во веки веков... что ВРЕМЕНИ больше не будет»(Откр. 10:5–6).'
          cn: 我们的尘世存在受制于时间与空间。然而，何谓时间？有多种可能的定义：时间是我们与造物主相遇的「场所」；时间是上帝关于受造物的旨意得以实现的进程：「我父作事直到如今，我也作事」（约翰福音 5:17）。创造尚未完成：「……趁着有光，行走吧，免得黑暗临到你们；在黑暗里行走的，不知道往哪里去。你们趁着有光，信从光，使你们成为光明之子」（约翰福音 12:35-36）。我们每个人都被赐予了各自的「时间」；虽短促，却足以获得救赎。上帝在创造中的创世理念正在实现：「……因为在上帝，没有一句话是不带着能力的」（路加福音 1:37）。在髑髅地，主临终时说：「成了！」……另一个时刻将到来，那时类似的话语将再次被说出；在《启示录》中记载：「那天使……向天举起右手，指着那活到永永远远……起誓说：『时间将不再存在了』」（启示录 10:5-6）。
      - type: paragraph
        text:
          ru: 'Доколе мы в этом «теле греха», а следовательно и в мире сем, дотоле не прекратится аскетическая борьба с «законом греха», действующим в нашей плоти (ср.:Рим. 6, 6, 7:23). Видя себя немогущими преодолеть сию смерть нашими усилиями, мы впадаем в некое отчаяние о нашем спасении. Как это ни странно, но нам необходимо жить это тягостное состояние, – переживать его сотни раз, чтобы оно глубоко врезалось в наше сознание. Нам полезен этот опыт ада. Когда мы носим в себе сию муку годами, десятилетиями, то она становится постоянным содержанием нашего духа, неизгладимою язвою на теле жизни нашей. И Христос сохранил раны от гвоздей распятия на Теле Своем даже по воскресении:«...пришел Иисус, и стал посреди, и говорит им: мир вам!.. И показал им руки и ноги и ребра Свои»(Ин. 20:19–20).'
          cn: 只要我们在这「罪的身体」中，从而也在这世上，苦修的挣扎就不会停止，与那在我们的肉体中运行的「罪的律法」进行挣扎 (参阅 罗马书 6:6，7:23)。看到我们凭自己的努力无法克服这死亡，我们便陷入某种关于我们救赎的绝望之中。尽管这听起来很奇怪，但我们有必要活出这令人痛苦的状态——经历它数百次，以便它深深地刻入我们的意识。这地狱的经验对我们是有益的。当我们多年、数十年地承受着这苦痛，它就成了我们灵的恒常内容，我们生命之躯上不可磨灭的创伤。基督甚至在祂复活之后，仍在祂的身体上保留了受难时钉子的伤痕：「……耶稣来了，站在他们当中，说：『愿你们平安！』……他便将手和脚、又肋旁指给他们看。」(约翰福音 20:19-20)。
      - type: paragraph
        text:
          ru: Из опыта адских мучений должна рождаться молитва за весь род людской, как за самого себя (Мф. 22, 39). Всякое наше состояние мы духом переносим из тесных рамок нашей индивидуальности на все человечество; таким образом всякий наш опыт становится откровением о совершающемся в веках в человеческом мире, и наше духовное с ним слияние принимает характер ощутимой реальности.
          cn: 应当从地狱般的磨难经验中，生发为全人类如同为自己一般的祷告（马太福音 22:39）。我们借着灵将我们的一切境况，从我们个体性的狭隘框限中，转移到全人类；如此一来，我们的一切经验都成为关于历世历代在人类世界中所发生之事的启示，而我们与它的灵性融合则呈现出可感知的真实性。
      - type: paragraph
        text:
          ru: 'Господь открыл нам подлинный смысл заповеди«Возлюби ближнего твоего, как самого себя»(Мф.22:39) в ее Божественной беспредельности. Прежний, т.е. в пределах Закона Моисеева, объем сей заповеди касался только еврейского народа:«Не мсти и не имей злобы на сынов народа твоего, но люби ближнего твоего, как самого себя»(Лев. 19, 18). Христос же распространил ее на всех людей, на все века:«Вы слышали, что сказано: люби ближнего твоего и ненавидь врага твоего. А Я говорю вам: любите врагов ваших, благословляйте проклинающих вас, благотворите ненавидящим вас, и молитесь за обижающих вас и гонящих вас; да будете сынами Отца вашего небесного»(Мф. 5:43–45). Единородный Сын Отца небесного дал нам это познание: в Писании – чрез беседу с законником (см.: Лк. 10и далее); в жизни же нашей Духом Своим Святым. Сам Он исполнил все сие в полноте, завершенной в Гефсимании и на Голгофе. И мы, входя в дух сей заповеди, уподобляемся Богу.'
          cn: 主向我们启示了诫命「爱你的邻人如同爱你自己」(马太福音 22:39) 在其神圣的无限性中的真正意义。以往，也就是说，在摩西律法的范围之内，这条诫命的范围只涉及犹太民族：「不可复仇，也不可对你本族的人怀恨，却要爱你的邻人如同爱你自己」(利未记 19:18)。而基督将其扩展到所有人，直到万古千秋：「你们听过有话说：爱你的邻人，恨你的仇敌。但我告诉你们：要爱你们的仇敌，祝福咒骂你们的，善待恨你们的，并为那凌辱你们、迫害你们的祷告；这样，你们就可以作你们在天之父的儿女」(马太福音 5:43-45)。天父的独生子赐予我们这认识：在圣经中，是借着与律法师的对话（参：路加福音 10章及以后）；而在我们的生命中，则是借着祂的圣灵。祂自己圆满地完成了这一切，在客西马尼和各各他达到圆满。而我们，进入这条诫命的精神，就效法上帝。
      - type: paragraph
        text:
          ru: 'Много раз приходил я в отчаяние от самого себя вследствие неспособности моей пребывать постоянно в духе заповедей Христовых. В эти горькие часы я думал: Господь Сам сказал, что Он не от мира сего (Ин. 8, 23). Он сошел с небес (Ин. 3, 13), я же целиком именно от сего мира: от земли, которую топчу моими же ногами. Он,«сущий на небесах»(Мф. 6, 9), не разлучился от Отца, живя с нами; и как возможно, чтобы я был ТАМ, ГДЕ ОН? Он свят, я же не могу вырвать себя из «тела» всемирного Адама, который в падении своем превратил сей мир во ад, «положил его во зле» (ср.:1Ин. 5, 19), где и я лежу вместе с ним (миром).'
          cn: 许多次，我因自己无能持续地活在基督的诫命精神中而陷入绝望。在这些苦涩的时刻，我思忖：主自己说过，祂不属于这世界（约翰福音 8:23）。祂自天降下（约翰福音 3:13），而我却完完全全属于这世界：属于我用我自己的脚所践踏的土地。祂，「在天上的」（马太福音 6:9），与我们同住时未曾与父分离；我怎可能在祂所在之处呢？祂是圣洁的，我却无法将自己从普世亚当的「身体」中挣脱出来，亚当在自己的堕落中将这世界变成了地狱，「将其置于邪恶之中」（参阅：约翰一书 5:19），我也与它（世界）一同躺卧在那里。
      - type: paragraph
        text:
          ru: 'Быть не от мира сего – что значит? Не что иное, как «родиться свыше». Я не видел конца моему горю: отказаться от искания единства с Ним – невозможно; осудить себя на разлуку с Его Светом – есть ад, поражающий меня ужасом. Горе мне, во грехах рожденному. И кто спасет меня от тьмы кромешной? Кто преобразит самую природу мою так, чтобы она стала способною быть неразлучно с Тем, Кто есть Свет, в котором нет ни единой тьмы?'
          cn: 不属这世界——这作何解释？无非就是「重生」。我看不见自己忧苦的尽头：放弃寻求与祂合一——这是不可能的；判自己与祂的光分离——这是地狱，令我恐惧战栗。我苦啊，生于罪恶之中。又有谁能将我从极深的黑暗中拯救出来呢？谁能将我这本性改变，使其能与那光，即绝无丝毫黑暗者，永不分离呢？
      - type: paragraph
        text:
          ru: 'Я рожден во грехах. Я унаследовал невероятно огромное наследство: ПАДЕНИЯ АДАМА; падения, умноженного затем в веках его сынами; падения, к которому и я прилагаю на каждый день что-нибудь. И рыдаю от видения себя таким. И когда рыдания мои истощают меня, приводят меня на край смерти, и я беспомощно повисаю над бездной тьмы, тогда неизъяснимым образом приходит тонкая любовь из иного мира, и с нею Свет. Конечно, это есть рождение Свыше; еще не полное, но все же освобождение от власти смерти темной, начало бессмертия. Да, нам предстоит еще долгий подвиг, чтобы дар Божий возрастал в нас. И когда он (дар сей чудный) начинает созревать и своим благоуханием проникать в поры нашего«тела греха»(Рим. 6, 6), тогда уходит от нас страх смерти, и мы освобождаемся от разновидного"рабства"(ср.:Евр.2, 15). И в обретенной святой свободе всем желаем добра.'
          cn: 我生于罪中。我继承了极其巨大的遗产：亚当的堕落；这堕落，随后又被他的子孙世代加剧；这堕落，我日复一日地也在其中有所添加。因见到自己这般光景，我恸哭不已。当我的哭泣耗尽我的心力，将我引向死亡的边缘，我无助地悬浮在黑暗的深渊之上时，一种无法言喻的方式，来自另一个世界的纤柔之爱降临，并伴随着光。当然，这就是从上头而来的重生；虽然尚未完全，但仍是从黑暗死亡权势中的释放，是不朽的开始。是的，我们仍有漫长的苦修之路，为使上帝的恩赐在我们里面增长。当这（奇妙的恩赐）开始成熟，并以其芬芳渗入我们「罪身」（罗马书 6:6）的毛孔时，死亡的恐惧便从我们身上消退，我们便从各种「奴役」（参：希伯来书 2:15）中得以释放。并且在这所获得的圣洁自由中，我们愿所有人得享良善。
      - type: paragraph
        text:
          ru: 'На сострадательную молитву за людей вдохновляет любовь Христова; в ней совместно участвуют и душа, и тело. Несение скорбей за грехи брата в подобной молитве становится общением в искупительных страстях Господа:«Христос... пострадал за грехи наши, праведник за неправедных... Он пострадал за нас, оставив нам пример, дабы мы шли по следам Его»(1Петр. 3, 18, 2:21). Сораспинаться Ему есть дар Духа Святого. Благоволит Отец наш небесный, когда мы болеем, видя преткновения братьев наших. По духу заповеди: люби ближнего, как самого себя – мы должны соболезновать друг другу; необходимо, чтобы создалась как бы круговая порука, соединяющая всех нас пред лицом Бога, Творца нашего.'
          cn: 对人的怜悯祷告，是受到基督之爱的激励而发出的；在其中，灵魂与身体共同参与。在这样的祷告中，为兄弟的罪承受苦痛，就成为对上主救赎受难的交通：「基督……曾为我们的罪受苦，义的代替不义的……祂为我们受苦，给我们留下榜样，叫我们跟随祂的脚踪行。」(彼得前书 3:18，2:21) 与祂同钉十字架是圣灵的恩赐。我们的天父悦纳，当我们因看见我们弟兄的跌倒而感到痛苦时。根据「爱邻如己」的诫命精神，我们应当彼此同心受苦；必须形成一种如同盟约般的相互关联，将我们所有人都连接在我们创造主——上帝的面前。
      - type: paragraph
        text:
          ru: 'В молитвенном томлении души о спасении людей заключена животворная сила и святая радость. Неземной, но богоподобный характер христианской жизни в том, что в ней сочетаются чудным образом и скорбь, и радость, глубина и высота, прошлое и настоящее и будущее в многовековой истории земли. Как солнце посылает свои лучи во всех направлениях, наполняя теплом и светом окружающее его пространство, так и Свет и тепло любви Христовой прорывает все ограничения, выводя наш дух в беспредельность. Какой поэт найдет достойные слова, чтобы выразить благодарное удивление за данную нам жизнь? В ней умирание прелагается в жизнь вечную чрез воскресение:«...кто потеряет душу свою ради Меня, тот обретет ее»(Мф. 16, 25).«Истинно говорю вам: если пшеничное зерно, падши в землю, не умрет, то останется одно; а если умрет, то принесет много плода. Любящий душу свою потеряет ее; а ненавидящий душу свою в мире сем сохранит ее в жизнь вечную»(Ин. 12:24–25).'
          cn: '在灵魂为人类得救而恳切祷告的渴望中，蕴含着生命赐予之力与神圣的喜乐。基督徒生命的性质，并非属世，却是肖乎上帝的，在于其中奇妙地结合着忧伤与喜乐，深度与高度，以及地球漫长历史中的过去、现在与未来。正如太阳向四面八方发射光芒，以温暖和光明充盈其周遭空间，同样，基督之爱的光与热突破一切限制，将我们的精神带入无限之中。哪一位诗人能找到配得的言辞，以表达对这赐予我们的生命，那充满感恩的惊奇？在这生命中，死亡借着复活转化为永生：

            「...谁为我失丧生命，谁就得着生命。」(马太福音 16:25)

            「我实实在在地告诉你们：一粒麦子若不落在地里死了，仍旧是一粒；若是死了，就结出许多子粒来。爱惜自己生命的，就丧失生命；在这世上恨恶自己生命的，就要保全生命直到永生。」(约翰福音 12:24-25)'
      - type: paragraph
        text:
          ru: 'Медлительным кажется нам процесс усвоения Свыше данного человечеству Откровения. И это не только в жизни людской массы, но и в личном подвиге каждого из нас. Вот два показателя: 1) Синайское Откровение: АЗ ЕСМЬ СЫЙ – потребовало от еврейского народа пятнадцать веков, прежде чем явилось некоторое число людей, способных воспринять восполнение сего Новым Заветом (Мф. 5:17–19). 2) Двадцать веков прошло с того момента, когда в нетварном Свете на Горе Фаворской и затем в сошествии Святого Духа в Сионской Горнице – дано было миру совершенное Откровение о Боге Святой Троице. А много ли таких, что действительно усвоили его? Нелегко ассимилируется нами жизнь Бога. И те, что возлюбили пришествие Христа – Агнца Божия, не вмещают полноты изливаемого на них благословения. До боли страдают всю свою жизнь те, что в горячем порыве веры взяли на свои рамена крест и последовали за Ним (Мф. 16, 24). Укреплялись они надеждой по исходе отсюда войти в ту светоносную сферу, «где Он»:«Кто Мне служит, Мне да последует; и где Я, там и слуга Мой будет; и кто Мне служит, того почтит Отец Мой»(Ин. 12, 26).'
          cn: '我们觉得人类领受并内化上帝所赐启示的过程是缓慢的。这不仅体现在普罗大众的生活中，也体现在我们每个人个人的属灵奋斗中。这就是两个例证：


            一）西奈山的启示：「我是自有永有的」——耗费了犹太民族十五个世纪，才出现少数能够领受这启示在新圣约中圆满的人（马太福音 5:17-19）。

            二）自那时起，已过去二十个世纪，当在塔博尔山上的非受造之光中，继而在锡安楼中圣灵降临之际——世界领受了关于至圣三位一体上帝的完美启示。然而，真正领受并内化它的人又有多少呢？


            上帝的生命并不容易被我们所同化。而那些爱慕基督——上帝的羔羊——降临的人，也无法全然承载倾泻在他们身上的祝福的丰盛。那些在信心的炽热激情中，毅然背负起自己的十字架并跟随了祂（马太福音 16:24）的人，一生都深陷痛苦之中。他们以希望为力量，期盼在离开此世后，能进入那充满光明的境域——「有祂的所在」：


            「若有人事奉我，就当跟随我；我在哪里，我的仆人也要在哪里；若有人事奉我，我父必尊重他。」（约翰福音 12:26）'
      - type: paragraph
        text:
          ru: Какою бы ни была огненною вера христианина, задание«преобразить уничиженное тело»наше так, чтобы оно стало«сообразным телу Господа»(Фил. 3, 21), требует многолетнего подвига поста и покаянной молитвы. В длительном процессе этого подвига раскрывается дотоле недоведомый объем Адамова падения. Сие видение дается не всем в равной мере. Но возможны, хоть и не часто, случаи, когда Дух Божий проведет кающегося чрез недоступные другим бездны.
          cn: 无论基督徒的信仰何等炽热，那「转变我们卑贱的身体」，使其「与主的身体相似」（腓立比书 3:21）的任务，都需要多年禁食与悔罪祷告的苦修功行。在这长期的苦修功行过程中，亚当堕落那此前未曾知晓的深度便会显明出来。此番洞见并非人人均等地获得。然而，尽管不常有，圣灵仍可能引领悔罪者穿越他人无法企及的深渊。
      - type: paragraph
        text:
          ru: 'Вера в абсолютного Бога должна быть свободною от всякого колебания. За годы моей жизни на Афоне я не помню такого момента, когда бы прикоснулось к моему уму и сердцу сомнение. Но были случаи, когда болезненное от долгой молитвы сердце отталкивалось от Бога: «О, это выше моих сил!» Последствия, однако, подобных мгновений бывали весьма положительными.'
          cn: 对绝对上帝的信仰，应当完全没有丝毫动摇。在我阿索斯山生活那些年里，我不记得有哪一刻怀疑曾触及我的心智和心灵。但是，也曾有这样的情况：当因长期祷告而痛苦的心拒绝了上帝，说：「哦，这已超出我的力量！」然而，这类时刻所带来的后果，却曾是非常积极的。
      - type: paragraph
        text:
          ru: 'Мы прежде всего и больше всего любим Христа. Чем полнее любовь, тем больнее переживается всякое нарушение гармонии. Даже при наличии долгого опыта и знания «механизма» подобных испытаний мы не без страха обнаруживаем в себе возможность нового падения. Отсюда молитва с глубоким плачем к Богу: «исцели меня до конца». И Он исцеляет. И сердце с радостью благодарит Бога: любовь, казавшаяся до того совершенною, возвышалась качественно и с умноженным разумением благости Господа.'
          cn: 我们首先也最深切地爱基督。爱越是丰满，对任何失和之处的感受就越是痛苦。即使我们拥有长期的经验，且知晓此类试炼的「机制」，我们仍不免恐惧地在自身内发现再次跌倒的可能性。由此，我们向着上帝发出深深哭泣的祷告：「彻底医治我」。而祂医治了。于是心灵喜乐地感谢上帝：先前看似圆满的爱，在质上得以升华，并带着对上主良善倍增的领悟。
      - type: paragraph
        text:
          ru: 'Усиленной молитве свойственно увлекать и сердце, и ум в их движении к вечному настолько, что все прошлое забывается, и нет в уме мысли о земном будущем; в душе единственная забота: не потерять ТАКОГО Бога; перестать быть недостойным Его. Чем сильнее наше влечение к Беспредельному, тем медлительнее кажется нам наше приближение к Нему. С одной стороны томящее ощущение своего ничтожества, с другой – созерцание неисповедимого величия Искомого – делает невозможным достоверное суждение о нашем действительном положении: приближаемся ли мы к Богу или удаляемся? В созерцании святости Бога человек растет быстрее, чем прогрессирует в своей способности сообразовать свою жизнь с заповедью. Отсюда впечатление, что расстояние между нами и Богом не перестает возрастать. В научной работе всякое новое открытие, не будучи конечным, обнаруживает наше прежнее неведение и тем самым как бы расширяет область неведомого и недоведомого, впереди лежащего.'
          cn: 恳切的祷告倾向于吸引心和智在它们向着永恒的运动中，如此以至于所有过去都被遗忘，并且心中没有对地上未来的思虑；灵魂中唯一的忧虑是：不失去这般的上帝；不再不配于祂。我们对无限者的吸引力越强，我们的接近祂就显得越慢。一方面是自身渺小所带来的苦闷感受，另一方面是对所寻求者那不可言喻的伟大之处的默观——使得对我们真实状况的可靠判断成为不可能：我们是正在接近上帝还是正在远离？在默观上帝的圣洁中，人成长得更快，甚于他在使自己的生命与诫命相符的能力上的进步。由此产生一种印象，即我们与上帝之间的距离似乎不断增长。在科学工作中，每一个新的发现，都不是最终的，它揭示我们过去的无知，并因此，仿佛拓宽了前方那未知和不可知领域的范围。
      - type: paragraph
        text:
          ru: Умное видение цели нам может быть дано в кратчайший момент, независимо от физического возраста, но практическое осуществление того, что предвосхищено интуитивно, может потребовать напряжения всей жизни; и даже при этом с необязательным успехом. В области науки и искусства наличествуют некоторые точки опоры для суждения; иначе обстоит с духом, влекущимся к Безначальному.
          cn: 智性对目标的洞察可以在最短暂的瞬间赐予我们，不取决于肉身年龄；然而，将直觉预见到的事物付诸实践，可能需要毕生的努力；即便如此，也未必能成功。在科学与艺术领域，存在一些可供判断的依据；然而对于那被牵引向无始者的灵而言，情况则不然。
      - type: paragraph
        text:
          ru: Известно, что и артист, и философ, и ученый – действительно могут страдать в своем творческом борении, хотя задача их воистину ничтожна по сравнению с нашей.
          cn: 众所周知，艺术家、哲学家和科学家，在他们的创造性搏斗中确实会受苦，尽管他们的任务与我们的相比，着实微不足道。
      - type: paragraph
        text:
          ru: 'Когда молящийся ум христианина бывает оторван от своего пребывания в Вечном дурными помыслами, тогда страх, разумеется, духовный, овладевает им. Видеть себя в рабстве низким страстям, отвлекающим его от Бога, – оскорбляет его до боли великой. От отчаянного горя молитва собирается внутрь, в самую сердцевину существа нашего и принимает форму «спазмы»: весь человек сжимается воедино, подобно крепко сжатому кулаку. Молитва становится воплем без слов. Это одно из самых горестных переживаний: сознавать себя в темной яме греха, недостойным Святого святых. И нет иного – легкого пути для преодоления страстей.'
          cn: 当基督徒那祈祷的心灵被恶念从其对永恒的安住中抽离时，那时，恐惧——当然是属灵的恐惧——便会掌控他。看到自己被低级情欲奴役，使他远离上帝——这令他感到巨大的痛苦和羞辱。在绝望的悲痛中，祷告会向内收敛，进入我们存在的至深核心，并呈现出一种「痉挛」的形式：整个人的存在收缩成一团，如同紧握的拳头。祷告变成无言的呼求。这是最悲痛的体验之一：意识到自己身陷罪恶的黑暗深渊，不配进入至圣所。并且没有其他更轻松的道路来战胜这些情欲。
      - type: paragraph
        text:
          ru: Всякое христианское «дело» непременно сопрягается с подвигом; любовь же, как высшее из всех дел, требует и наибольшего труда. Жизнь христианина, в своем внутреннем существе, есть следование за Христом:"Что тебе(до кого бы то ни было иного)? Ты иди за Мною»(ср.:Ин. 21, 22). В силу этого каждый верующий в той или иной мере повторит путь Господа, – но не своею силою возьмет он крест на рамена свои, чтобы идти в Гефсиманию и далее на Голгофу:"...ибо безНегоне можем мы делать ничего»(ср.:Ин.15, 5). И кому было дано сие страшное благословение, те предвосхитили воскресение свое; удел других – вера в милосердие Божие.
          cn: 每一个基督徒的「善工」都必然与灵修功课相连；而爱，作为一切善工中至高的，则需要最大的辛劳。基督徒的生命，在其内在本质中，是跟随基督：「那与你何干？你只管跟随我吧！」(参阅：约翰福音 21:22)。因此，每一位信徒都将在某种程度上重走上主的道路，但他并非凭自己的力量背负十字架，扛在他的肩上，以便前往客西马尼，并继续前行，直至各各他：「……因为离了祢，我们什么也不能做。」(参阅：约翰福音 15:5)。而那些领受了这可畏的祝福的人，他们预尝了自己的复活；其他人的归宿，则是相信上帝的慈悲。
      - type: paragraph
        text:
          ru: 'Так благоволил о нас Отец небесный: все земнородные должны«взять крест свой», чтобы унаследовать жизнь вечную (ср.:Мф. 16:24–25). Уклоняющиеся от крестоношения – не избегнут рабства страстям и пожнут от плоти тление (Гал. 6, 8;Рим. 8, 13). Заповеданная любовь к Богу и ближнему исполнена глубочайших страданий, но им сопутствует небесное утешение (ср.:Мрк. 10:29–30): душу животворит тот мир, который преподал Господь апостолам пред своей Голгофой. Когда же дух человека вводится в сферу светоносной любви Бога и Отца нашего, тогда забываются все боли и душа неизъяснимо блаженствует (Ин. 12, 50, 17:3). Так женщина,«когда родит младенца, уже не помнит скорби от радости, потому что родился человек в мир»(Ин. 16, 21). Так и еще более радуется христианин, когда в разуме и глубоком чувстве сознает себя рожденным в Боге для вечности.'
          cn: 天父如此施恩于我们：凡生于尘世者，皆当「背起自己的十字架」，方能承受永生（参阅：马太福音 16:24-25）。凡规避背负十字架者，必不能免于情欲的奴役，并要从肉体收败坏（加拉太书 6:8，罗马书 8:13）。所命令的对上帝和邻人的爱，充满着最深切的苦难，但天上的慰藉与这些苦难相伴（参阅：马可福音 10:29-30）：那平安，即主在祂的各各他之前所赐给使徒的平安，使灵魂得生。当人的精神被引入我们上帝和父那光照之爱的领域时，所有的痛苦都被遗忘，灵魂则不可言喻地蒙福（约翰福音 12:50，17:3）。正如妇人，「当她生下婴孩时，就不再因喜乐而记念其忧愁，因为有一个人降生到世上」（约翰福音 16:21）。基督徒也同样，甚至更加喜乐，当他在理性与深切的感受中，意识到自己已在上帝里为永恒而生时。
      - type: paragraph
        text:
          ru: Естественно верующему ревниво хранить истину данного Церкви Откровения в его, если возможно, полноте и чистоте. Многовековый опыт Церкви убедительно показал, что всякое отступление от пути заповедей евангельских удаляет от того познания, в котором заключена вечная жизнь (Ин. 12, 50, 17:3). Мы не в силах достигать совершенство заповедей, но от нас зависит проявить максимальное прилежание, и тогда остальное завершит Он Сам. В труде нашем стяжать любовь Христову дается нам созерцать недоступность святости Бога, а вместе и безмерность Его смирения. Сила евангельских заповедей в том, что они естественно вводят в беспредельность Божественного Бытия. Душа блаженно удивляется пред Богом; она в восторге пред Его предвечным величием, она поражена и Его снисхождением к нам в воплощении. Во всем ее Учитель Христос (Мф. 23, 8). Без Него человечество неизбежно погибнет в глубинном мраке своей злобы. Христос – Свет миру; чрез Него явлена истина и«от полноты Его все мы принимаем и благодать на благодать»(ср.:Ин. 8, 12;Ин. 1:16–17). Смиренный«Бог гордым противится, смиренным же дает благодать»(1Петр. 5, 5;Мф. 23, 12). Благодать есть Его, Бога, жизнь, и Он дает Свою жизнь стремящимся к подобию Ему.«Кто унижает себя, тот возвысится»(Мф. 23, 12). В силу этого принципом нашей аскетики является движение к самоумалению, к «бесконечно» малому, и никак не гордая потуга к самовозвеличению. Наш путь есть путь апофатического подвига чрез наше «истощание» в следовании Христу, истощившему Себя даже до крестной смерти (ср.:Фил. 2:5–9). Чем глубже идем мы «вниз», тем радикальнее очищаемся от последствий гордого падения нашего Праотца Адама. И когда сердце наше становится чистым (Мф. 5, 8), тогда вселяются в нас и Отец, и Сын, и Дух Святой, и мы вводимся в непоколебимую реальность Божьего Царства, где неисповедимое величие слито воедино с соответствующим ему смирением и кротостью.
          cn: 信徒自然会热切地持守赐予教会之启示的真理，若可能，在其完全与纯粹之中。教会数世纪的经验有力地表明，任何偏离福音诫命之道都会使人远离那样的认知，其中蕴含着永生（约翰福音 12:50，17:3）。我们无力达到诫命的完全，但我们有责任尽最大的勤勉，其余的则由祂亲自成全。在我们努力获取基督之爱时，我们得以默观上帝神圣的不可企及，以及祂无限的谦卑。福音诫命的力量在于，它们自然而然地引领我们进入神性存在体的无限。灵魂在上帝面前幸福地惊叹；它对祂永恒的威严感到狂喜，它也为祂在道成肉身中对我们的屈尊降卑所震撼。在一切事上，基督是它的导师（马太福音 23:8）。没有祂，人类必将在自身邪恶的深沉黑暗中灭亡。基督是世界之光；藉着祂，真理得以显明，并且「从祂的丰盛里，我们都领受了，而且恩上加恩」（参：约翰福音 8:12，约翰福音 1:16-17）。谦卑：「上帝抵挡骄傲的人，赐恩典给谦卑的人」（彼得前书 5:5，马太福音 23:12）。恩典是祂——上帝的生命，祂将自己的生命赐予那些寻求效法祂的人。「凡自卑的，必升为高」（马太福音 23:12）。因此，我们苦修的原则是趋向自我微小化，趋向「无限」微小，绝非骄傲地追求自我高举。我们的道路是表否认的功修之路，藉着我们在跟随基督时的「虚己」，效法祂虚己甚至至于死在十字架上（参：腓立比书 2:5-9）。我们越是「向下」深入，就越是彻底地洁净，脱离我们先祖亚当骄傲堕落的后果。当我们的心变得洁净时（马太福音 5:8），那时，圣父、圣子、圣灵就都居住在我们里面，我们就被引入上帝之国那不可动摇的实相之中，那里，莫测的威严与与之相应的谦卑和温柔融为一体。
      - type: paragraph
        text:
          ru: Само воплощение Бога-Слова есть тоже истощание, онтологически свойственное божественной любви. Отец истощает Себя всего в Рождении Сына. И Сын ничего не присваивает Себе, но все отдает Отцу. Наше же истощание выражается в том, что мы оставляем все, что нам дорого на земле, во исполнение заповеди:«...если кто хочет идти за Мною, отвергнись себя и возьми крест свой... ибо кто хочет душу свою сберечь, тот потеряет ее; а кто потеряет душу свою ради Меня, тот обретет ее»(Мф. 16:24–25). И снова:«Так всякий из вас, кто не отрешится от всего, что имеет, не может быть Моим учеником»(Лк 14, 33).
          cn: 圣言的道成肉身本身也是一种虚己，是神圣之爱在本体上固有的一种。圣父在圣子的诞生中将自己完全虚己。而圣子丝毫没有为自己所占有，而是将一切都归还圣父。而我们的虚己则体现在，我们为了遵守以下诫命，放弃地上一切我们所珍爱的事物：「……若有人要跟随我，就当舍己，背起他的十字架来……因为凡要救自己生命的，必丧掉生命；凡为我丧掉生命的，必得着生命。」(马太福音 16:24-25) 并且又说：「这样，你们无论何人，若不撇下一切所有的，就不能作我的门徒。」(路加福音 14:33)
      - type: paragraph
        text:
          ru: 'И это есть путь Бога Живого.«Один законник... искушая Иисуса, сказал: Учитель, что мне делать, чтобы наследовать жизнь вечную? Иисус же сказал ему: в законе что писано? как читаешь? Он сказал в ответ: возлюби Господа Бога твоего всем сердцем твоим, всею душой твоею, и всей крепостью твоею, и всем разумением твоим, и ближнего своего, как самого себя. Иисус сказал ему: правильно отвечал ты; так поступай и будешь жить»(вечною жизнью в Боге) (ср.:Лк. 10:25–37). На вопрос законника:«А кто мой ближний?»– Господь ответил притчею о добром самарянине, существенный смысл которой в то время лежал в плане заповеди:«Любите врагов ваших, и благотворите... не ожидая ничего; и будет вам награда великая, и будете сынами Всевышнего»(Лк. 6, 35).'
          cn: '这就是活生生的上帝的道路。

            「有一个律法师……试探耶稣说：『夫子，我该做什么才能承受永生？』耶稣对他说：『律法上写的是什么呢？你是怎样读的呢？』他回答说：『你要爱上主你的上帝，尽你的心、尽你的魂、尽你的力量、尽你的全意，又爱你的近人如同自己。』耶稣说：『你回答得对。你这样做就必得生。』」（在上帝内承受永生）（参：路加福音 10:25-37）。针对律法师「谁是我的近人呢？」的问题，上主用好撒玛利亚人的比喻作了回答，当时其主要意义在于一条诫命：「爱你们的仇敌，也要善待他们……不指望有什么回报；你们的赏报就必是大的，你们也必是至高者的子女。」（路加福音 6:35）。'
      - type: paragraph
        text:
          ru: 'О состоянии нашего духа, когда нам дается свыше благодать любить врагов, старец Силуан говорил как об опыте божественной вечности еще в пределах сей жизни. Он говорил и писал: «Кто не любит врагов, тот еще не познал Бога, как должно Его знать».'
          cn: 关于我们神魂的境况，圣西卢安长老曾说，当从上方赐予我们爱仇敌的恩典时，这乃是在此生之内对神圣永恒的体验。他曾说也曾写道：「凡不爱仇敌的，就尚未如其当识地认识上帝。」
      - type: paragraph
        text:
          ru: 'От себя дерзну добавить в пояснение сей благодати: кто чрез озарение нетварным Светом Духа Святого внутри себя живет переход «от смерти в жизнь вечную», тот естественно сострадает всем тем, кто лишен сего блага. Будучи вне смерти, таковой освобожден от страха бедствий и знает мысль Отца о нем:«Сын Мой! ты всегда со Мною, и все Мое – твое»(ср.:Лк. 15, 31). И если все, что имеет Отец, дается нам, то становится душе единственно свойственным – «радоваться и веселиться», когда бывший мертвым брат оживает к славе нетленной в Царстве Бога Живого (ср.:Лк. 15, 32).'
          cn: 我冒昧为这恩典补充解释：凡在自己内在借着圣灵的非受造之光的照耀，活出「从死亡进入永生」之过渡的人，自然会怜悯那些被剥夺了这福分的所有人。既然他已超越死亡，这样的人就被从灾难的恐惧中释放出来，并明白天父对他的心意：「我儿啊！你常与我同在，我所有的一切都是你的」（参：路加福音 15:31）。并且若天父所有的一切都赐给了我们，那么灵魂唯一适合做的就是——「欢喜快乐」，当那曾死去又复活的弟兄，在活上帝的国度中活出不朽的荣耀时（参：路加福音 15:32）。
      - type: paragraph
        text:
          ru: 'Быть христианином – значит веровать в воскресение мертвых; надеяться на усыновление нас Отцом Небесным, – получить божественный образ бытия, – стать по дару любви Отчей тем, что Сам Он есть по существу Своему, т.е. богом. Таковы обетования Бога и Отца нам, уверовавшим во Христа Иисуса как Сына Единородного и Единосущного Отцу. Великий грех умалять данное нам в Духе Святом откровение о Человеке, как он, Человек, задуман Богом, прежде чем был сотворен сей видимый мир. Наказание за сей грех – неверия в воскресение – носит особый характер: это есть наше собственное самоосуждение: мы отказываемся от дара нашего Творца. Почему же мы отказываемся? Больше всего и прежде всего потому, что Дар Отчий стяжается с великим трудом, многими страданиями. Тема сия чрезвычайно глубока, и кто в силах представить ясно сие задание людям, стоящим на различных уровнях сознания и разума? И кто сможет изобразить должным образом также совершенно особый восторг нашего духа, когда при Свете Божества нам открываются премудрые пути Бога Живого?'
          cn: 成为基督徒，意味着信仰死者的复活；希望我们被天父收纳为义子——获得神圣的生命样式——藉着父的爱之恩赐，成为祂按其本质所是的，即是神。这些是上帝与父赐给我们的应许，凡信仰基督耶稣为父的独生子和同质之子的人。贬低圣灵中赐予我们的关于人（ Человек ）的启示，即人（ Человек ），在创造这可见世界之前，是怎样被上帝构思的，乃是极大的罪过。对此罪——不信复活——的惩罚具有特殊性质：这正是我们自己的自我定罪：我们拒绝了我们造物主的恩赐。那么，我们为何拒绝呢？最主要和首先是因为，父的恩赐需以巨大的努力和诸多苦难来获得。此主题极其深奥，谁能向处于不同意识和理智层面的人清晰地阐明此项任务呢？谁又能恰当地描绘我们精神中那全然独特的狂喜，当在神性之光中，那活生生的上帝的智慧之道向我们显明时呢？
      - type: paragraph
        text:
          ru: Но как можем мы верить в возможность воскресения для вечности после нашей смерти по телу? Все переживания наши нам кажутся связанными именно с сим телом, с его восприятиями. Даже мышление наше мы ощущаем как движение некоей энергии в нашем вещественном мозгу и сердце... Не всем давался опыт состояний молитвы, когда дух наш освобождается от материальных уз, от условий времени и пространства. Далеко до сего. Но вот, мы верим в науку наивною верою, несмотря на ее очевидную относительность. И все же ради усвоения ее последних достижений с детского возраста мы отдаем себя на десятилетия небезболезненных усилий. В своих наивысших формах духовный подвиг идет безмерно дальше всякой человеческой науки, но в начальных стадиях он прост и даже радостен. Попытаюсь изъяснить подлинную причину отказа людей следовать Христу Истине.
          cn: 但我们怎能相信，在我们肉身死亡之后，仍有可能复活，直到永恒呢？我们所有的经历，在我们看来，似乎都与这肉身及其感知紧密相连。甚至我们的思想，我们也感知到仿佛某种能量在我们这物质的脑与心中流动……并非所有人都曾获得过祷告状态的经验，那时我们的灵脱离了物质的枷锁，脱离了时间与空间的限制。离此境甚远。然而，我们带着一份天真的信心相信科学，尽管它有显而易见的相对性。但即便如此，为了掌握它最新的成就，我们从幼年起，就投入了数十载非无痛苦的努力。属灵的功修在其最高形式中，远超任何人类科学，但在初始阶段，它却简单甚至充满喜乐。我将尝试阐明人们拒绝追随基督——那真理的真正原因。
      - type: paragraph
        text:
          ru: '«О Христе проповедуется, что Он воскрес из мертвых: как же некоторые из вас говорят, что нет воскресения мертвых? Если нет воскресения мертвых, то и Христос не воскрес. А если Христос не воскрес, то и проповедь наша тщетна, тщетна и вера наша... И если мы в сей только жизни надеемся на Христа, то мы несчастнее всех человеков... Для чего и мы ежечасно подвергаемся бедствиям? Я каждый день умираю...»(1Кор. 15:12–14;1Кор. 15, 19;1Кор. 15:30–31).'
          cn: «我们宣讲，基督已经从死人中复活了：那么你们中间怎会有人说没有死人复活的事呢？如果死人没有复活，那么基督也就没有复活。如果基督没有复活，那么我们的宣讲就是虚空的，我们的信德也是虚空的……如果我们只在今生对基督抱有希望，那么我们就是所有人类中最悲惨的了……我们又为何每时每刻都遭受苦难呢？我天天都在死亡……»(哥林多前书 15:12-14，哥林多前书 15:19，哥林多前书 15:30-31)。
      - type: paragraph
        text:
          ru: '«Тогда подошли к Нему сыновья Зеведеевы, Иаков и Иоанн, и сказали: Учитель! мы желаем, чтобы Ты сделал нам, о чем попросим. Он сказал им: что хотите, чтобы Я сделал вам? Они сказали Ему: дай нам сесть у Тебя, одному по правую сторону, а другому по левую, в славе Твоей. Но Иисус сказал им: не знаете, чего просите. Можете ли пить ЧАШУ, которую Я пью, и креститься крещением, которым Я крещусь? Они отвечали: можем. Иисус же сказал им: чашу, которую Я пью, будете пить, и крещением, которым Я крещусь, будете креститься»(Мк. 10:35–39).'
          cn: «那时，西庇太的儿子们，雅各和约翰，来到祂面前，对祂说：「老师啊！我们愿祢为我们成就我们所求的一切。」祂对他们说：「你们要我为你们做什么？」他们说：「愿我们一人坐在祢的右边，一人坐在祢的左边，在祢的荣耀里。」耶稣对他们说：「你们不知道所求的是什么。我所喝的杯，你们能喝吗？我所受的洗，你们能受吗？」他们说：「我们能。」耶稣说：「我所喝的杯，你们固然要喝；我所受的洗，你们固然要受」 (马可福音 10:35-39)。
      - type: paragraph
        text:
          ru: '«Иисус отошел от учеников на вержение камня, и, преклонив колена, молился, говоря: Отче! о если бы Ты благоволил пронести ЧАШУ сию мимо Меня!.. и находясь в борении, прилежнее молился; и был пот Его, как капли крови, падающие на землю»(Лк. 22:41–44).'
          cn: 「耶稣离开门徒约一块石头之遥，屈膝祷告说：父啊！若是祢愿意，求祢将这杯从我面前挪去！……祂在挣扎中，祷告得更加恳切；祂的汗珠如同血点滴落在地上。」(路加福音 22:41-44)
      - type: paragraph
        text:
          ru: Что есть в существе своем сия ЧАША Христова? Глубина сей тайны скрывается от нас. В нашей попытке следовать Христу путем хранения Его заповедей – мы неизбежно и непрестанно пьем некую чашу, но того, о чем мыслил и что переживал Христос в «тот час», мы не постигаем в полноте. Однако нечто аналогичное непременно совершается и с нами, как и Он Сам сказал:«Чашу, которую Я пью, будете пить»(Мр. 10, 39). Таинственна ЧАША Христа, но и наша чаша скрыта от чуждых глаз.
          cn: 在其本质中，这基督的杯究竟是什么？这奥秘的深奥向我们隐藏着。在我们通过遵守祂的诫命来跟随基督的尝试中，我们不可避免地、持续不断地饮着一个杯，但对于基督在「那一刻」所思所历的，我们无法完全领悟。然而，某种类似之事也必然发生在我们身上，正如祂自己所说：「我所饮的杯，你们也要饮。」 (马可福音 10:39) 基督的杯是奥秘的，但我们的杯也隐藏于外人眼中。
      - type: paragraph
        text:
          ru: '«И если мы только в этой жизни надеемся на Христа, ТО МЫ НЕСЧАСТНЕЕ ВСЕХ ЧЕЛОВЕКОВ», – сказал Павел (1Кор. 15, 19). Да, это именно так и есть. Но в чем же является необъяснимым сие благословенное «НЕСЧАСТИЕ» для не последовавших за Христом? В том, что вообще все реакции Духа Христова на все, совершающееся вокруг нас, – глубоко различны, часто диаметрально противоположны духу детей мира сего. Вот пример: Иуда вышел из Сионской Горницы, чтобы предать Господа на распятие, и в тот момент раскрылись уста Его, и Он сказал:«Ныне прославился Сын человеческий, и Бог прославился в Нем»(Ин. 13, 31). И так на каждом шагу в Евангелии мы усматриваем, что Господь жил в ином плане Бытия; там, где все преломления проходят чрез призму иного рода. И кто хочет знать о сей тайне хотя бы отчасти, тот должен взять на рамена свои крест свой и всецело предаться в волю Отца Небесного. Нет иного пути. И нет еще конца конфликту между Христом и миром сим.'
          cn: 「我们若靠着基督，只在今生有指望，就比众人更可怜了，」——保罗说（哥林多前书 15:19）。是的，正是如此。然而，这蒙福的「不幸」，对于那些未曾跟随基督的人而言，其不可解之处究竟在哪里呢？在于基督之灵对我们周围所发生的一切事所作的一切反应，与这世上之子的灵相比，是迥然不同的，常常是截然相反的。举个例子：犹大从锡安楼房出来，为了出卖上主，使祂被钉十字架，就在那一刻，祂的口张开了，祂说：「如今人子得了荣耀，上帝也在人子身上得了荣耀」（约翰福音 13:31）。因此，我们在福音书的每一步都看到，上主生活在一种不同的存在层面；在那里，一切的折射都通过另一种棱镜。凡是想至少部分了解这奥秘的人，就必须背起自己的十字架，并将自己完全交托于天父的旨意。别无他途。而基督与这世界之间的冲突也尚未终结。
      - type: paragraph
        text:
          ru: 'Глубока моя любовь и благодарность к Церкви, в недрах которой открывалось мне Божество Иисуса Христа и образ явленного Им человечества. Сей «образ» видим мы в жизни отдельных людей, как и в нас самих, – умаленным; полная реализация его, образа, принадлежит будущему веку, но и нечастые в истории приближения к нему вызывают восторг в душе. Нормально христианину жаждать уподобиться Господу: обнять мир любовью, как Он обнимает его; подобно Ему не иметь врагов, т.е. быть свободным от ада ненависти к кому бы то ни было, согласно Его, Христа, заповеди:«А Я говорю вам: любите врагов ваших, благословляйте проклинающих вас, благотворите ненавидящим вас, и молитесь за обижающих вас и гонящих вас; да будете сынами Отца небесного»(Мф. 5:44–45). Но никто из сынов Адама не может жить так своею силою. Сие возможно не иначе, как если Дух Святой наполнит сердце человека присущей Ему вечностью. Без Него мы не можем сохранить заповеди Божией (ср.:Ин. 15, 5).'
          cn: 我对教会有着深厚的爱与感恩，正是在其怀抱中，耶稣基督的神性以及祂所彰显的人性形象向我启示。这「形象」我们看到，无论是在个别信徒的生命中，还是在我们自己里面，都是微小的；这形象的完全实现，则属于未来的世代。然而，即便是在历史上不常有的对此形象的接近，也足以在灵魂中激起喜乐和赞叹。基督徒渴望效法主是正常的：像祂一样用爱拥抱世界；像祂一样没有敌人，也就是说，免于对任何人的仇恨之深渊，按照祂，基督的诫命：「但我告诉你们：要爱你们的仇敌，为那咒骂你们的祝福，善待那憎恨你们的，并为那凌辱你们和迫害你们的祷告；这样你们就成了天父的儿女。」（马太福音 5:44-45）。但亚当的任何一个后裔都无法凭自己的力量这样生活。除非圣灵以祂固有的永恒充满人的心，否则这不可能实现。没有祂，我们无法持守上帝的诫命（参：约翰福音 15:5）。
      - type: paragraph
        text:
          ru: Да, жажда уподобиться Господу естественна христианину. Однако«тесны врата и узок путь», ведущие в сию божественную жизнь (ср.:Мф.7, 14). Змея, чтобы сбросить с себя ставшую ненужною шкуру, проходит через узкие щели; так и всякий человек, чтобы спастись, должен пройти через весьма «тесные врата», чтобы совлечься «кожаных одежд», приобретенных в падении нашем (ср.:Быт. 3, 21).
          cn: 诚然，对基督徒而言，渴望效法主是自然而然的。然而，「门是窄的，路是狭的」，引向这神性的生命 (参：马太福音 7:14)。蛇为了蜕去身上无用的旧皮，必须穿过狭窄的裂缝；同样，每个人为了得救，也必须经过这极其「窄的门」，以脱去我们因堕落而获得的「皮衣」（参：创世记 3:21）。
      - type: paragraph
        text:
          ru: 'Тот, Кто сказал:«Я есмь путь и истина и жизнь»(Ин. 14, 6), дал нам такие заповеди:«Если кто приходит ко Мне, и не возненавидит отца своего, и матери, и жены, и детей, и братьев, и сестер, а притом и самой жизни своей, тот не может быть Моим учеником»(Лк. 14:26–27, 33; ср.:Мф. 16:24–25). Из этих слов видим,«КТО есть сей»(Мф. 21, 10). Если бы Христос в Своем ИПОСТАСНОМ бытии не был единосущным Отцу и Святому Духу Богом, явившимся в плоти нашей, а только подобным нам тварным существом, то онтологически не могли бы Ему прийти такие идеи. Если бы Иисус Христос не был Богом по существу своему, то достаточно было бы сей заповеди, чтобы и все прочее содержание Евангелия стало бы неприемлемым. Два тысячелетия опыта Церкви неизменно подтверждают«великую благочестия Тайну: Бог явился во плоти, оправдал Себя в Духе»(1Тим. 3, 16). Воспринятый верою как безначальный Господь, Христос становится для нас Светом вечности, и слова Его открывают нам недомысленные глубины Бытия Божьего.'
          cn: 那一位曾说过的：「我就是道路、真理、生命」（约翰福音 14:6），曾赐给我们这样的诫命：「凡到我这里来的，若不恨自己的父亲、母亲、妻子、儿女、弟兄、姊妹，甚至自己的性命，就不能作我的门徒」（路加福音 14:26-27，33；参：马太福音 16:24-25）。从这些话语中，我们看到「这是谁？」（马太福音 21:10）。如果基督在祂的位格性的存有中，不是与父和圣灵同质的上帝，在我们的肉身中显现的，而只是一个与我们相似的受造物，那么，从存有论的角度来看，祂就不可能产生这样的思想。如果耶稣基督就其本质而言不是上帝，那么仅凭这一诫命，就足以使福音的所有其他内容变得不可接受。教会两千年的经验始终证实着「敬虔的奥秘是伟大的：上帝在肉身中显现，在圣灵中称义」（提摩太前书 3:16）。凭着信心被领受为无始之上主的基督，成为我们永恒的光，祂的话语向我们揭示上帝的存有中无法思议的深度。
      - type: paragraph
        text:
          ru: По неведомому для меня Промыслу я был допущен к ногам избранника Бога Вышнего – Силуана. Наблюдая его подвиг, благоговейно слушая его наставления, и я, ничтожнейший из людей, смог отчасти узреть тайну пути ко спасению. На конце дней моих я дерзаю поведать о том, что ревниво скрывал прежде. Я говорю здесь в тех пределах и о тех формах, в которых мне было дано жить Богом.
          cn: 按照我所不知的上帝旨意，我蒙准来到至高上帝的蒙选者——西卢安的脚前。观察他的苦修，恭敬地聆听他的教诲，连我这最微不足道的人，也得以部分地窥见救赎之路的奥秘。在我的时日终结时，我敢于讲述我曾小心翼翼隐藏的事。我在此所言，是在上帝所赐予我生活的那些限度内，并以那些形式。
      - type: paragraph
        text:
          ru: 'На других страницах пишу я о моем страшном преткновении: о самовольном и гордом удалении от Откровения, данного нам во Христе. Но Отец, да будет Имя Его благословенно во все века, явил мне Сына Своего во Свете незаходимом, и тем дал мне восчувствовать мой грех с такою силою, что я десятилетиями рыдал, припадая к земле лицом в моем отчаянии от моего безобразия. Мой акт отхода от Бога предстал мне в своей инфернальной мерзости, и я ощутил острый стыд за себя; я стал отвратительным для себя самого; я презирал себя, и мое презрение нашло себе сродного спутника: ненависть. Я не скажу, что я ненавидел отца моего или мать и прочих сродников или друзей. Мне доставало ненависти к самому себе, а о других я как-то и не думал. Моя тоска по Богу причиняла мне великую боль, настолько, что я забывал о всем остальном, пребывая наедине с Ним. Не знаю я, простил ли мне Господь вполне мой грех, но сам я не могу простить себе того, что сделал. Чрез мою личную трагедию – я жил трагедию Праотца Адама в его вековом потомстве: в сменяющихся поколениях насельников земли. Этим каналом приходила ко мне молитва за весь мир.'
          cn: 在其他篇章中我写道，关于我可怕的跌倒：我自作主张、心存骄傲地远离了在基督里赐予我们的启示。然而，父——愿祂的名在万世万代蒙称颂——在永不落的圣光中向我启示了祂的圣子，从而使我如此强烈地感受到了我的罪，以至于我数十年来一直哭泣，俯伏在地，在我因自己的丑陋而生的绝望中。我背离上帝的行为以其地狱般的憎恶呈现在我面前，我为自己感到极度的羞耻；我变得令自己厌恶；我鄙视自己，而我的鄙视找到了它的同伴：仇恨。我不会说我恨我的父亲或母亲以及其他亲戚或朋友。我有足够的恨意指向我自己，而我根本没有想到其他人。我对上帝的思念给我带来了巨大的痛苦，如此之甚，以至于当我与祂独自相处时，我忘记了其他一切。我不知道主是否完全赦免了我的罪，但我自己无法原谅我所做的一切。透过我个人的悲剧，我活出了原祖亚当在他绵延世代的后裔——即地上世代更替的居民——中的悲剧。通过这个通道，为整个世界的祷告临到我。
      - type: paragraph
        text:
          ru: 'Я жил спонтанно, без анализа моих переживаний. Мне было не свойственно подсматривать за собою. Я просто отдавался нашедшей на меня Божией силе. Но я не смел подумать, что Он Сам творит во мне молитву: я переживал сию силу как мою собственную. И лишь когда отошел от меня огонь покаяния, тогда я уразумел, что Христос давал мне благословение приближаться к Нему.'
          cn: 我过着随性的生活，不曾分析我的经历。我不习惯审视自己。我只是将自己全然交托于临到我身上的上帝的能力。但我不敢想是祂自己在我里面运行祷告：我将这力量体验为我自己的。唯有当悔改的烈火从我身上消退时，那时我才领悟，基督赐予我祝福，使我得以亲近祂。
      - type: paragraph
        text:
          ru: 'Только Сам Дародатель Бог доподлинно знает, в какой мере Он изливал на меня радость познавать Его любовь. Благодаря старцу Силуану  и мои духовные очи раскрылись, чтобы увидеть, что заповедь Христа возлюбить Его до ненависти к себе – есть Откровение о законе Божественной Любви: той, которою Сам он возлюбил нас.'
          cn: 唯有赐恩者上帝祂自己真切地知道，祂以何等程度将认识祂之爱的喜乐倾泻在我身上。藉着圣西卢安长老，我的属灵之眼也得以开启，为要看见，基督的诫命——爱祂，甚至恨恶自己——乃是关于神圣之爱法则的启示：即是祂自己爱我们的那种爱。
      - type: paragraph
        text:
          ru: 'Если бы заповеди возлюбить Бога всем существом нашим и ближнего, как самого себя, – исходили от какого бы то ни было пророка, человека по тварной природе своей, то в них не было бы смысла, нами искомого. Но мы приняли сие от Бога пред нами. Хранить их мы можем не иначе, как«совлекшись ветхого человека»и«облекшись в нового»(ср.:Кол. 3, 9;Еф. 4, 24): Христа, с небес сошедшего (ср.:1Кор. 15, 47).'
          cn: 如果爱上帝尽心、尽性、尽意、尽力，并爱邻如己的诫命，是出自任何先知，一个受造之物的人，那么它们就不具备我们所寻求的意义了。但我们是从上帝那里领受了这些诫命。我们唯有如此方能遵守它们，即「脱去旧人」和「穿上新人」（参阅：歌罗西书 3:9，以弗所书 4:24）：这新人就是从天降下的基督（参阅：哥林多前书 15:47）。
      - type: paragraph
        text:
          ru: Когда мы живем в духе евангельских предписаний, тогда мы уже обожены, потому что безначальная жизнь пронизывает нас. Нам заповедано – любить. Любовь же соединяет в бытии. Полнота любви приводит к тому, что мы любим до забвения о самих себе. «До забвения», т.е. до ненависти к себе.
          cn: 当我们活在福音的训诫精神中时，我们便已然被神化了，因为无始之生命穿透我们。我们受命去爱。而爱则在存有中结合。爱的圆满导致我们爱到忘却自我。「至于忘却」，即至于憎恶自我。
      - type: paragraph
        text:
          ru: 'Содержание жизни напряженно молящегося человека – подобно безбрежному океану живой воды. Наш дух непрестанно обогащается, но не столько количеством новых слов или понятий, сколько углублением уже пережитых-стяжённых опытов. На предыдущих страницах я пытаюсь привести некоторые примеры тонкой и в то же время глубокой аскетической брани с убивающими нас страстями. Годами и даже десятилетиями длящиеся многие смены состояний страдания или утешения, свыше сходящего, воспитывают все же наш дух, делая его более способным к новым формам мышления и восприятия бытия вообще: ум привыкает безвидно мыслить весь мир, сердце же – молитвенно, с любовной болью носить в себе сей мир в его совокупности. В подобном акте духовного синтеза пребывает зрелая молитва христианина, предстоящего Богу всем умом, всем сердцем (ср.:Лк. 10, 27) в их слиянии воедино. Бессильный выражать словом все, что он носит в себе, подвижник нередко молится без слов, но опять-таки в глобальном разумении всего познанного им, или в полном погружении в Боге до забвения о земле. В беспорядочном внешне описании процессов жизни человеческого духа – речь идет о постепенном переходе из индивидуальной формы бывания в ипостасно-персональный образ бытия в Боге вечном. Систематизированное, аналитическое очертание восхода к сей жизни – дать невозможно. Не находим мы сего и в творениях святых великих отцов нашей Церкви. Схоластическая систематизация материала возможна до некоторой степени в концептуальных богословских трудах, но никак и никогда в живых словах о подлинной жизни нашего духа.'
          cn: 竭力祷告之人的生命内容——如同浩瀚的活水海洋。我们的精神不断被丰富，但并非通过新增的词语或概念的数量，而是通过对已然经历和获得的经验的深化。在前几页中，我试图列举一些与致我们于死地的私欲进行精微而又深刻的苦修争战的例子。持续多年乃至数十年之久的，从上方降下的、苦难或慰藉的诸多状态的转变，终究陶冶着我们的精神，使其更能适应新的思维形式和对存在本身的感知：理智习惯于无形地思想整个世界，而心灵——则以祷告的方式，带着爱痛将这世界整体容纳于自身之中。基督徒成熟的祷告，即是以上帝为中心，全心、全意（参：路加福音 10:27）融合为一，以这种属灵的综合行为而存在。苦修者因无力用言语表达内心所承载的一切，故而常常无言祷告，但这种祷告又是在他对所知一切的整体理解之中，或完全沉浸于上帝之中，以至于忘却尘世。在看似无序地描述人类精神生命进程的背后——所指的，是从个体存在的形式，逐渐过渡到在永恒上帝中的位格性存在样式。要对达致此种生命的进阶，进行系统化、分析性的概貌描述——是不可能的。我们甚至在我们教会的伟大圣教父们的著作中也找不到这样的描述。经院式的材料系统化在概念性的神学著作中，可以在一定程度上实现，但绝不可能在关于我们精神真正生命的活泼话语中实现。
      - type: paragraph
        text:
          ru: Да пребудет слава Богу, Спасителю нашему, во все века  непреложною.
          cn: 愿荣耀归于我们的救主上帝，永不改变地存留，直到永远。
      - type: paragraph
        text:
          ru: '«Боже, Ты знаешь безумие мое, и грехи мои не скрыты от Тебя»(Пс. 68, 6)... Ныне я живу в уничиженном виде, Ты же, Христе, зовешь меня к вере и принятию Откровения, что Отец любит нас, как любит Он Тебя, Своего Единородного Сына:«Сам Отец любит вас, потому что вы возлюбили Меня... Не о них же только молю, но и о верующих в Меня по слову их: да будут все едино: как Ты, Отче, во Мне, и Я в Тебе, так и они да будут в нас едино; да уверует мир, что Ты послал Меня... и возлюбил их, как возлюбил Меня»(Ин. 16, 27, 17:20–23).'
          cn: 「上帝啊，祢知道我的愚妄，我的罪愆也向祢隐藏不住」(诗篇 68:6)。如今我身处卑微，祢啊，基督，却呼召我归向信仰，并领受这启示：父爱我们，如同祂爱祢，祂的独生子一般：「父自己爱你们，因为你们爱我……我不但为这些人祈求，也为那些因他们的话信我的人祈求：使他们都合而为一；正如祢，父啊，在我里面，我在祢里面，使他们也在我们里面合而为一；使世人可以信祢差遣了我……并且爱他们，如同爱我一样」(约翰福音 16:27，17:20-23)。
      - type: paragraph
        text:
          ru: Безмерно велико дерзание наше по вере во Христа. Недаром блаженный Павел говорит, что«безумие Божие сильнее человеческой мудрости». Что плотскому рассудку кажется совершенным безумием – то для верующих есть премудрость и сила, жизнь и свет (ср.:1Кор. 1:18–30;Кол. 2, 14;Кол.3:18–19).
          cn: 我们因信基督而有的勇毅，是何等宏大啊！无怪乎，蒙福的保罗说：「上帝的愚拙胜过人的智慧。」凡在肉体的理智看来是全然的愚妄，对信徒而言却是至高的智慧、能力、生命与光（参见：哥林多前书 1:18-30，歌罗西书 2:14，歌罗西书 3:18-19）。
      - type: paragraph
        text:
          ru: 'Но если для всякого человека дерзание быть христианином есть акт, превосходящий меру человека, то что скажу я о себе? Мне от детских лет усвоилось сознание моего ничтожества; я даже пред людьми бездерзновенен. И все же: посетил меня малый Свет, и я поверил во Христа-Бога. Затем последовало более обильное излияние Света в связи с моей в Него верой, и вера моя углубилась новым познанием.'
          cn: 但若对任何人而言，敢于成为基督徒是一个超越人衡量尺度的行为，那我该如何谈论自己呢？从我幼年起，我的卑微无有便内化为我的意识；我甚至在人面前也缺乏勇气。然而，一道微光临到我，我便信了基督-上帝。随后，因着我对祂的信仰，更丰盛的圣光倾泻而至，我的信仰也借着新的认识得以深化。
      - type: paragraph
        text:
          ru: Как бы ни был я воистину «ничто», но Нетварный Свет являлся мне именно за веру во Христа. Мой ум преодолел стену рассудка, недоумевавшего, бессильного понять, что Персона-Ипостась обладает всеобъемлющим познанием настолько, что от Него не скрывается ничто во всем космическом бытии:«ни один воробей не упадет на землю без (воли) Отца нашего... у нас же и волосы на голове все сочтены... и нет ничего сокровенного, что не открылось бы, и тайного, что не было бы узнано»(Мф. 10:26, 29–30)...«И нет твари, сокровенной от Него, но все обнажено и открыто пред очами Его»(Евр. 4, 13).
          cn: 无论我确实多么「一无所有」，但非受造之光却正是因为我对基督的信仰而显现给我。我的心思逾越了理智的藩篱，这理智困惑不解，无力理解，位格本体拥有无所不包的知识，以至于在整个宇宙万有之中，没有什么是隐藏在祂面前的：「若没有我们父亲的（旨意），一只麻雀也不会落在地上……我们头上的头发也都被数算过……并没有任何隐秘的事不被揭示，也没有任何秘密的事不被知晓。」(马太福音 10:26，29-30)「并且在祂面前，没有受造物是隐藏的，但一切在祂眼前都是赤露敞开的。」(希伯来书 4:13)。
      - type: paragraph
        text:
          ru: Мои отношения с Богом носят исключительно личный характер. Вне личных отношений нет понятия о грехе; вне сего нет любви между человеком и Богом; вне сего нет и не может наличествовать бытийное познание Бога; вне сего все поглощено смертью, все утопает в самом настоящем не-бытии.
          cn: '我的与上帝的关系是完全私人的。

            在个人关系之外，没有罪的观念；

            在此之外，人与上帝之间没有爱；

            在此之外，没有，也不可能存在对上帝的本体性认知；

            在此之外，一切都被死亡所吞噬，一切都沉溺于最真实的非存在之中。'
      - type: paragraph
        text:
          ru: 'То, о чем я собираюсь сейчас писать, происходило более полвека тому назад. Период напряженный: весьма многое, вернее, все мне было неясным. А жизнь так коротка! И Бог так безмерно велик и далек! Кто научит меня идти к Нему прямым путем, не теряя времени на блуждания по чужим дорогам? Я, конечно, искал такого человека или таких людей, которые могли бы мне быть помощью, наставниками. Но тот факт, что снизошла на меня некая сила, дотоле мне неведомая, – молитва, которую нельзя было остановить ни днем, ни ночью, естественно сделал сию последнюю моей опорой на всякий момент. И были случаи, когда чрез молитву я получал вразумления, как я верую, от Бога. Приведу некоторые примеры, которые положили на мне печать, которые стали для меня камнями в основании моей жизни.'
          cn: 我将要写下的事情，发生在半个多世纪以前。那是一个紧张的时期：许多事情，不，确切地说，一切对我都是不明确的。而生命如此短暂！而上帝如此无限伟大和遥远！谁能教我走上通往祢的直路，不将时间浪费在旁门左道上呢？我当然寻求过这样一个人，或者这样一些人，他们能成为我的帮助和导师。然而，某种我此前从未知的力量降临到我身上——那是祷告，白天黑夜都无法停止的祷告，这自然而然地使后者成为了我每时每刻的依靠。也曾有过这样的情况，我借着祷告，获得了来自上帝的启示，如同我所信的。我将列举一些例子，它们在我身上留下了印记，成为了我生命的基础石。
      - type: paragraph
        text:
          ru: Не прозревая правды Божией в судьбах человечества и вообще всех людей, взятых в отдельности своей, я томился во мраке, владевшем мною. Я бывал подобен малому ребенку, во всем беспомощному. Испытывая нужду что-то понять, я становился нетерпеливым от боли душевной и ждал помощи от Бога. И Господь снисходил к моему невежеству и не оскорблялся моею дерзостью, но, как мать, сострадал мне и спешил с ответом. И это не один, а много-много раз. Подобным же образом Он обращался с многострадальным Иовом, бурно выражавшим свои протесты.
          cn: 未能洞察上帝的真理在人类的命运中，以及所有个体的世人身上，我煎熬于那笼罩我的黑暗中。我就如同一个凡事全然无助的稚子。渴望有所领悟，我因灵魂的痛苦而变得焦躁不安，并等候上帝的帮助。而主俯就我的无知，并不因我的僭妄而受冒犯，反而如同慈母一般，怜悯我，并急忙给予答复。且不止一次，乃是许许多多次。同样地，祂也对待多受苦难的约伯，他曾激烈地倾吐自己的抱怨。
      - type: paragraph
        text:
          ru: 'Вот один из моих случаев: это было во Франции, в двадцатых годах, до моего отъезда на Афон (1925). Я долго с плачем молился Богу: «Найди средства спасать мир; всех нас – развращенных и жестоких»... Особенно горячею бывала молитва за «малых сих», за нищих и угнетенных. К концу ночи, уже на исходе сил, я на время потерял молитву из-за пришедшей мне мысли: «Если я так, всею силою моего сердца, сострадаю человечеству, то как понять Бога, безучастно смотрящего на злострадания многих миллионов, созданных Им же Самим людей? Почему Он допускает неисчислимые насилия одних над другими?» И так я обратился к Нему с безумным вопросом: «Где Ты?..» И в ответ услышал в сердце слова: «Разве ты распялся за них?»... Эти кроткие слова, произнесенные Духом в сердце моем, потрясли меня: Тот, Кто распялся, ответил мне как Бог.'
          cn: 这是我的一个经历：它发生在法国，在二十年代，在我前往阿索斯山之前（1925年）。我流泪向上帝长久祷告：「求祢寻找方法拯救世界；拯救我们所有人——这些堕落而残忍之人。」我的祷告尤其炽热，是为了这些「小弟兄」，为了贫穷和受压迫之人。夜尽时分，我已筋疲力尽，我因心中涌现的一个念头而一度失去了祷告：「如果我如此，用我全心的力量，怜悯着人类，那如何理解上帝，祂竟无动于衷地看着祂亲手创造的千百万人的苦难？为什么祂允许无数的人彼此施加暴力？」于是我转向祂，带着一个近乎疯狂的问题：「祢在哪里？……」作为回应，我心中听到这些话：「难道你曾为他们被钉十字架吗？」……这些温柔的话语，是圣灵在我心中说的，震撼了我：那位被钉十字架者，以上帝的身份回应了我。
      - type: paragraph
        text:
          ru: 'Короткий ответ Бога обычно заключает в себе сущность дела. Божие слово приносит в душу новое, особое чувство бытия; сердце испытывает прилив светоносной жизни; ум вдруг постигает дотоле скрытые смыслы. Прикосновение к нам творческой энергии Бога – нас новотворит. Полученное таким путем познание не подобно философской интеллекции: вместе с уразумением положения – всему существу человека сообщается иной образ существования: ведение Бога сливается с потоком молящейся любви к Нему.'
          cn: 上帝简短的答复通常蕴含着事情的要旨。上帝的话语为灵魂带来一种崭新而独特的存有感；心体验到光明生命的涌流；悟性突然领悟到迄今隐藏的意义。上帝创造性的神能触及我们——使我们新造。以此方式获得的认知不像哲学性的理智认知：伴随着对境况的领悟——人的整个存有被赋予另一种存在方式：对上帝的认知与对祂祈祷的爱之涌流融合为一。
      - type: paragraph
        text:
          ru: 'Что же мыслил я в то время по получении ответа от Бога? Вот что: если Бог такой, каким явил Его распятый Христос, то все мы и только мы повинны во всяком зле, наполняющем всю историю человечества. Бог явил Себя в нашей плоти, какой Он есть. Но мы не просто отвергли Его: мы убили Его позорною смертью. Я увидел духом, что не отсутствие сострадания к нам в Боге причина людских терзаний, но исключительно злоупотребление человеком даром свободы.'
          cn: 在从上帝那里得到回应后，我当时在想些什么呢？就是这样：如果上帝是那被钉十字架的基督所启示的那个样子，那么我们所有的人，且唯有我们，应对充斥着人类整个历史的一切罪恶负有罪责。上帝在我们的肉身中启示了祂自己本来的样子。但我们不只是拒绝了祂：我们以可耻的死亡杀害了祂。我在灵里看见，人类的苦难并非是由于上帝对我们缺乏怜悯，而唯独是由于人滥用了自由的恩赐。
      - type: paragraph
        text:
          ru: 'В споре моем с Ним – Он победил. Сначала залил меня горький стыд за безумно-гордую мысль: будто я сострадателен более, чем Он. От стыда пришло покаянное самоосуждение. Затем все преодолела радость. Господь не только не осудил меня за дерзость, но даже излил на мою главу обильное благословение. Позднее я понял, что и сама сострадательная молитва та была Его действием во мне.'
          cn: 在我与祂的争辩中，祂得胜了。首先，为着那狂妄自大的念头——仿佛我比祂更有怜悯心——苦涩的羞耻感将我淹没。从这羞耻中，生发出悔罪的自我定罪。随后，喜乐胜过了一切。主不仅没有为我的僭越而定罪我，反而将丰盛的祝福倾倒在我的头上。后来我才明白，那怜悯的祷告本身，也是祂在我里面的行动。
      - type: paragraph
        text:
          ru: 'Пойду дальше. Описать данные мне опыты духовные – задача непростая. Я жил в разорванности человека, поставленного на грани двух миров: этого – видимого, и другого – невидимого, умопостигаемого, небесного. Тем, что говорю, что я был «поставлен на грани двух миров», хочу показать, что происходившее превосходило меня: не я бывал инициатором, но Живой Бог, в святые руки Которого я впал (ср.:Евр. 10, 31). Мой дух хотя и страдал, но все же был увлечен в удивление Богу.'
          cn: 我将继续。描述那些赐予我的灵性体验，并非易事。我活在人性的断裂之中，被置于两个世界的边缘：此世——可见的，以及另一个——不可见的，智性可领悟的，属天的。我如此说，即我「被置于两个世界的边缘」，是想表明所发生的一切超越了我：并非我主动发起，而是永生的上帝，我跌入祂圣洁的双手之中（参：希伯来书 10:31）。我的心灵虽然受苦，但依然被吸引，进入对上帝的惊奇之中。
      - type: paragraph
        text:
          ru: Опыт показал мне – насколько инертна наша природа в грехе. Даже такие молитвы, как приведенная выше, не сразу излечивают нашу падшую натуру. Под непрестанно возрастающим напором внешних событий нашего века, принимающих все более и более угрожающий характер, я опять и опять возвращался к борьбе с Богом. Теперь я отдаю себе отчет, что хотя на поверхности моя жизнь протекала без видимых от людей преступлений, но в глубине, духовно, я был и есмь тьма.
          cn: 经验向我表明——我们的本性在罪中是多么地惰性。即使是上述这样的祷告，也无法立刻治愈我们堕落的本性。在我们这个时代持续增长的、外部事件的压力下，这些事件正变得越来越具威胁性，我一次又一次地回到与上帝的挣扎中。现在我意识到，尽管表面上我的生活进行着没有世人可见的罪行，但在深处，在灵性上，我过去是、现在也是黑暗。
      - type: paragraph
        text:
          ru: 'Конечная цель молитвы – неизменна в веках, но, не теряя единства инициального устремления, в ходе жизни она непрестанно меняется в своем содержании. Иногда она объемлет весь мир, в его совокупности, иногда же сосредоточивается на нуждах данного момента. Различные положения могут явиться ее импульсом: личное покаяние, сострадание ближним, просьба о помиловании их; искание просвещения в недоумениях; выражения благодарности Богу за Его благой промысл, или восторга пред Богом-Спасителем. И многое Другое.'
          cn: 祷告的最终目的历代不变，但在不失其初始向往之统一性的前提下，其内容在生命进程中不断变化。有时它涵盖整个世界，在其整体之中；有时则专注于当下的需要。各种境况都可以成为其动因：个人的忏悔，对近人的怜悯，为他们恳求赦免；在困惑中寻求启迪；为上帝良善的护理表达感谢，或在救主上帝面前的崇敬。以及许多其他。
      - type: paragraph
        text:
          ru: 'Жажду Бога, Свет, от Него исходящий, и действующую в нас силу Его – как изображать? Я сознаю свою полную неспособность: вижу, что не избегаю повторений как бы того же самого. Впадаю в утомительные излишества или бываю слишком кратким.'
          cn: 渴慕上帝，渴慕从祂而出之光，以及在吾人内运行的祂的力量——当如何描绘？我深知自己全然无能：我看出自己不免重复，仿佛在述说同一件事。我或陷入冗长乏味之赘述，或过于简短。
      - type: paragraph
        text:
          ru: 'Не раз моя молитва (если возможно так назвать то, что бывало со мною в действительности) доходила до недопустимой дерзости. Продолжая видеть царящим во всем мире кошмар насилий владык и князей земли над «своими же братьями» (см.:Мф. 23, 8), я в горечи сердца говорил: «Если Ты создал все, что существует; если без Тебя ничто не начало быть (см.:Ин. 1, 3), то все эти гнусные преступники, способные проливать кровь миллионов и миллионов людей по всей вселенной ради немногих дней извращенного удовольствия господствовать над бедными страдальцами, – то не они повинны суду, и не они ответственны... Ты, как Творец всего, единственный виновник неисчетного горя земли...». Тяжким было это искушение: я стоял на грани отчаяния и как бы безумия; дурного отчаяния: не виделось никакого исхода. И опять посетил меня Господь: Его мир коснулся сердца моего и мысль моя потекла по иному руслу: Отец послал Сына Своего, чтобы спасти мир; и Его они убили. Но вот Он воскрес как Победитель смерти и уже как Царь вечности«совершит суд Свой над народами по правоте»(Пс. 9, 9;Евр. 10, 31).'
          cn: 不只一次，我的祷告（如果能这样称呼我身上实际发生过的事）达到了不可容忍的僭妄。当我继续看到暴行之恐怖在全世界肆虐，地上的君王和领主对「自己的弟兄」施以残暴（参阅马太福音 23:8），我内心痛苦地说道：「如果祢创造了万有；如果没有祢，一无所有得以存在（参阅约翰福音 1:3），那么所有这些可憎的罪犯，他们能在全宇宙倾泻千千万万人的鲜血，只为了数日扭曲的，凌驾于可怜受难者之上的享乐——那么他们不该受审判，他们也无须负责……祢，作为万有的创造者，是地上无数痛苦唯一的祸首……」这诱惑是沉重的：我站在绝望与近似疯狂的边缘；一种糟糕的绝望：看不见任何出路。于是上主再次眷顾了我：祂的平安触及了我的心，我的思想也转向了另一条方向：父差遣祂的圣子，为要拯救世界；而他们却杀害了祂。但看，祂已复活，成为死亡的胜利者，并作为永恒的君王「将按公义审判万民」（诗篇 9:9，希伯来书 10:31）。
      - type: paragraph
        text:
          ru: Итак, что же? Не в пределах земли разрешается вопрос о добре и зле. Пошедшие на заклание, как овцы,«не противясь злому»(см.:Мф. 5, 39), уподобятся Сыну Отчему (Ис. 53, 7) и совоскреснут с Ним во славе неувядаемой.
          cn: 那么，究竟如何呢？善恶的问题并非在尘世间得到解决。那些如羊羔般被牵去宰杀的，「不抵挡恶人」(参：马太福音 5:39)，将与上帝之子相似（以赛亚书 53:7），并与祂一同在不朽的荣耀中复活。
      - type: paragraph
        text:
          ru: 'Горе мне, что я вторично боролся с Богом в той же самой перспективе. Но вся моя дальнейшая жизнь нуждалась в категорическом решении вопроса, ставшего затем кардинальным для всего христианства: как реагировать на гонения со стороны князя (князей) мира сего? Господь нам дал благодать мыслить, как Сам Он мыслит: ап. Петр вел себя в Гефсиманском саду «по-человечески» (ср.:Мф. 16:22–23). Но Христос сказал ему:«Вложи меч в ножны; неужели Мне не пить чаши, которую ДАЛ МНЕ ОТЕЦ?»(Ин. 18:10–11).'
          cn: 祸哉我，我竟然第二次在同一视角下与上帝争战。但我此后的一生，都需要明确地解决一个问题，这个问题后来对整个基督教都变得至关重要：如何回应来自于这世界的君王（众君王）的迫害？上主赐予我们恩典，使我们能像祂自己一样思考：使徒彼得在客西马尼园的表现是「出于人意」的（参阅：马太福音 16:22-23）。但基督对他说：「收刀入鞘！难道我父所赐给我的杯，我不喝吗？」（约翰福音 18:10-11）。
      - type: paragraph
        text:
          ru: Таким был для меня путь непосредственного наставления Свыше чрез молитву. Так раскрывался для меня смысл послания к Ефесянам (см. 3 гл.) о глубине и широте и высоте замысла Божия о нас. Наша земная жизнь, в сущности, не более чем краткий момент, данный нам Благим Отцом, чтобы мы проникли в превосходящую разумение кенотическую любовь Христову. Вне сего пути никто не сможет «исполниться ВСЕЮ ПОЛНОТОЮ БОЖИЕЮ». Здесь мы повешены на крестах, пусть еще невидимых; но только таким образом можем мы постигнуть величие человека и неисследимую бездну Божественного Бытия. Невозможно на нашем языке выразить ниспосылаемое нам Отцом богатство крестным путем.
          cn: 对我而言，这就是通过祷告而来自上天的直接训诲之路。如此，致以弗所书（参 3 章）中关于上帝对我们的旨意的深度、宽度和高度的意义，便对我显明了。我们的尘世生命，实质上不过是仁慈的父赐予我们的短暂片刻，为要使我们洞悉那超越悟性的基督的虚己之爱。脱离此道，无人能「充满上帝的全部丰盛」。在此，我们被悬挂在十字架上，尽管它们尚不可见；但唯有如此，我们方能领悟人的崇高以及神性存有那不可测度的深渊。用我们的语言无法表达圣父借由十字架之路所赐予我们的丰盛。
      - type: paragraph
        text:
          ru: 'Бог неделим в Себе. Когда Он приходит, то приходит весь, и как Он есть в Своем предвечном Бытии. Мы не вмещаем Его. Он открывает нам Себя чрез ту «точку», в которую мы стучим:«стучите, и отворят вам»(Лк. 11, 9). Он говорит короткую фразу, но не хватит жизни, чтобы исчерпать ее содержание. Мы благоговейно ощущаем Его Отечество: мы видим, что Он жаждет сообщить нам Свою безначальную Жизнь: иметь нас до совершенства подобными Сыну Своему, Который есть «печать разнообразная Отца». Непостижим замысел Его о нас. Из «ничто» Он творит равных Ему богов. И все наше существо в умилении поклоняется Ему; не в страхе пред суровым Владыкой, но в смиренной любви к Отцу.'
          cn: 上帝在祂自身内是不可分割的。当祂来临时，祂是全然来临的，并以祂在自身前无始的存有中本然的样子降临。我们无法完全容纳祂。祂通过我们所叩击的那个「点」向我们启示祂自己：「叩门，就给你们开门」（路加福音 11:9）。祂说了一句简短的话语，但即便穷尽一生，也无法完全领悟其内涵。我们虔敬地感受祂的父性：我们看到祂渴望将祂那无始的生命赐予我们：使我们臻于完美，肖似祂的儿子，祂是「父的各样印记」。祂对我们的旨意是无法测度的。祂从「无有」中创造出肖似祂的「神」。我们全部的存有都在柔情中敬拜祂；不是出于惧怕严厉的君王，而是出于对父的谦卑之爱。
      - type: paragraph
        text:
          ru: 'Господь сохранил меня от всяких связей, рвать которые было бы трудно. Итак, когда я стал нуждаться в свободе от какой бы то ни было ответственности за другую жизнь, я располагал ею. Я благодарил Бога за сей обо мне промысл Его. Я был спокоен при мысли, что если я умру, то от этого никому не будет ущерба. Великим было мое счастье: я безбоязненно мог идти на всякий риск, даже до смерти. Мой ум всем вниманием погрузился внутрь, и там пребывал безысходно годами. Молитва менялась в своих формах и силе: не всегда влекла меня с одинаковой властью; по временам же я отдавался ей без насыщения. И если бы тогда (еще во Франции, до моего отъезда на Афон) я захотел ее остановить, то не смог бы. В те благословенные дни я бывал и самым несчастным на земле, и вместе блаженным до преизбытка.'
          cn: 上主保守我脱离一切牵连，若要斩断将会甚是艰难。因此，当我需要免于对另一生命的任何责任的自由时，我便拥有了它。我感谢上帝为我所施的护理。我思想此点便深感平安：即便我将死去，也无人会因此蒙受损失。我的幸福是何其之大：我能毫无畏惧地冒一切风险，甚至甘赴死亡。我的心思以全副心神潜入内心，并且在那里年复一年地难以脱离。祷告的样式与力量各有不同：它并非总以同等的能力牵引我；但有时我却毫无餍足地委身于它。倘若那时（那时我仍在法国，尚未启程前往阿索斯山），我想要停止它，我亦不能做到。在那些蒙福的日子里，我曾是世上最不幸之人，同时也满溢着至极的福乐。
      - type: paragraph
        text:
          ru: Иногда незримый огонь касался верха моей головы и быстро пронизывал мое тело до ног, и пламенная молитва с великим плачем за мир овладевала мною.
          cn: 有时，无形的火焰触及我的头顶，并迅速贯穿我的身体直至脚底，而炽热的祷告，连同为世界的极大哀哭，便全然占据了我。
      - type: paragraph
        text:
          ru: Большей частью тогда я молился, стоя на коленях, прижавшись лбом к полу. Когда же изнемогало тело, я засыпал, но в моем ясном сознании я не прекращал молиться и ощущал себя спящим. Лишь проснувшись, я мог понять, что тело мое спало, потому что не всегда оно было в том положении, в котором я молился.
          cn: 多数时候，那时我跪着祷告，额头贴地。但当身体支撑不住时，我便睡着了；但在我清醒的意识中，我却不曾停止祷告，并感觉到自己是睡着的。唯有醒来时，我才能明白我的身体是睡着了的，因为它并不总是在我祷告时的那个姿势。
      - type: paragraph
        text:
          ru: Два раза на улицах Парижа из-за молитвы я терял восприятие материального мира вокруг меня. Я благополучно добирался до того места, куда направлялся. Жалею до некоторой степени, что не было со мною такого свидетеля, который описал бы мое поведение в подобные моменты.
          cn: 在巴黎的街道上，我曾两次因着祷告而失去对我周围物质世界的感知。我平安地到达了我要去往的地方。我有些遗憾，当时身边没有一位见证人，能够描述我在那类时刻的举动。
      - type: paragraph
        text:
          ru: 'Однажды (в Париже) я был на вечере широкоизвестного поэта, читавшего свои произведения. Было много изысканной публики. Все было организовано исключительно корректно с общественной точки зрения. В полночь я возвращался к себе По дороге я думал: как соотносится это проявление человеческого творчества, одного из наиболее благородных, с молитвою? Войдя к себе в комнату, я начал молитву: «Святый Боже, Святый Крепкий, Святый Бессмертный»... И вот: тонкое пламя незримо и нежно пожигало на поверхности моего лица и груди нечто легкое как воздух, однако несогласное с Духом Божиим.'
          cn: '有一次（在巴黎），我参加了一个晚会，一位广为人知的诗人正在朗诵他自己的作品。现场有许多高雅的听众。从社交角度来看，一切都组织得极其得体。半夜时分，我回到了自己的住处。在路上，我在思考：这种人类创造性的表现——人类最高贵的表现之一，与祈祷又如何关联呢？走进我的房间后，我开始祈祷：「圣哉上帝，圣哉大能者，圣哉不死者」……


            就在那时，一缕纤细的火焰无形无迹地、轻柔地燃尽着我脸部和胸部表面上某种轻如空气之物，然而那物却与圣灵不相符。'
      - type: paragraph
        text:
          ru: Внутренне я жил удивительный процесс борьбы между влечением к искусству и молитвою. Последняя победила страсть живописца, но нелегко и нескоро. Затем, в Богословском Институте, она же помогала мне сосредоточивать внимание на преподаваемых предметах. Приходилось бороться с этим своеобразным препятствием, драгоценным в самом себе. Моей жизни в институте благоприятствовало то обстоятельство, что у меня была отдельная комната над квартирами профессоров, где я мог молиться в привычной мне позиции. И все же при всем моем интересе к церковным наукам моя духовная нужда – пребывать в молитве – терпела ущерб, и я уехал на Афон.
          cn: 在我内心深处，我经历着一场奇特的斗争，介于对艺术的向往与祷告之间。后者战胜了画家的热情，但并非轻易且耗时颇久。接着，在神学研究院中，祷告也帮助我将注意力集中在所教授的科目上。我不得不与这个独特的障碍搏斗，而这个障碍自身而言弥足珍贵。我在学院里的生活得益于这样一个情况：我在教授公寓的上方有一间独立的房间，在那里我可以采用我习惯的姿态祷告。然而，尽管我对教会学问抱有浓厚兴趣，我那恒常祷告的属灵需要却遭受了损害，于是我便前往阿索斯山。
      - type: paragraph
        text:
          ru: Там, на Святой Горе, моя жизнь вошла в свою колею. Едва ли не каждый день после литургии меня наполняла пасхальная радость. И, как это ни странно, моя непрестанная молитва, подобно вулканическому извержению, исходила из глубокого отчаяния, что вселилось в сердце мое. Два состояния, кажущиеся диаметрально противоположными, совмещались внутри меня. Пишу совершенную правду. Я сам не понимал, что происходит со мною? Внешне я был благополучен не менее множества людей.
          cn: 在圣山那里，我的生命步入了正轨。几乎每天在礼仪之后，我都被逾越节的喜乐充满。并且，这听起来多么奇怪，我那不住的祷告，犹如火山爆发般，出自盘踞在我心中深深的绝望。两种看似截然对立的状态，在我心中并存着。我所写的乃是十足的真理。我自己也不明白，我身上发生了什么？从外表看，我和许多人一样安好。
      - type: paragraph
        text:
          ru: 'Позднее мне выяснилось положение вещей: Господь дал мне благодать покаяния (Лк. 24, 47). Да, это была благодать. Едва ослаблялось во мне отчаяние, охладевала и молитва, и смерть ощупывала сердце. Чрез покаяние мое бытие расширилось так, что духом я касался и ада, и Царства. С начала первой мировой войны (1914) слышание о тысячах смертей на фронтах в моем сознании погрузило все космическое бытие в непроницаемый мрак абсурда. Ни смерти, ни абсурда я не мог принять. Тогда внутрь меня вошла мысль-дух: все, что познал, все, что я возлюбил и что живит и вдохновляет меня, – все положительно, и даже Сам Бог – умирает во мне и для меня, если я вполне исчезаю... Сильным было это переживание: оно приняло форму: человеческое Я может стать центром-вместилищем всего мироздания.'
          cn: 后来我才明白事情的真相是：主赐予我悔改的恩典（路加福音 24:47）。是的，那是恩典。我里面的绝望刚一减弱，祷告也随之冷淡，死亡就触摸我的心。借着悔改，我的存在得以扩展，以至于藉着我的灵，我触及了地狱和天国。自第一次世界大战（1914年）开始，听闻前线成千上万的死亡，在我的意识中，将所有宇宙性的存在都浸入了无法穿透的荒谬黑暗之中。我无法接受死亡，也无法接受荒谬。那时，一个思想-灵进入我里面：我所认知的一切，我所爱的一切，以及那使我活过来并启发我的一切——所有这一切都是实在的，甚至上帝自己——如果我彻底地消失了，也会在我里面并为了我而死去……这是一种强烈的体验：它呈现出这样的形式：人的「我」能够成为整个受造界的中心-容纳者。
      - type: paragraph
        text:
          ru: 'Я жил в двух мирах: один из них я воспринимал чрез зрение, чрез слух и другими телесными чувствами; в другом мире я только духом: там я весь «слух», весь ожидание; я напрягал мое «зрение», но иным образом видел... Сии два столь различных мира в молитве не разделялись. Днем она, молитва, текла в мире ощутимом; ночью же уносила меня в «умную сферу» (не знаю, как именовать ту беспредельность, что обнимала меня). Когда читал Евангелие, то все слова мне казались знакомыми, но что скрывается за каждым из них в Самом Бытии Божием – я не постигал. Одно мне было разительно ясно: все во Христе, Сыне Божием; и только в Нем. И Ему я молился. Призывал я также и Отца, чтобы исходящий от него Дух Истины снизошел даже до меня, чтобы наставить на всякую истину (Ин. 16, 26, 16:13). Мое искание Сокровенного Бога встречало отзвук в Ветхом Завете: много слов находил я там для выражения моих нужд. Мне были близки негодующие взрывы Иова; и я стонал подобно пророкам, что явились до Христа; почерпал вдохновение на молитву в псалмах; но действительно учился только по Новому Завету, чрез призму которого воспринимал все прочее, откуда бы оно ни исходило. Мой голод познать Бога был неутолим: сколько бы я ни молился, как бы глубоко ни вздыхал, все равно – я не насыщался. Таковою была на Афоне моя «чаша»: горе и радость сливались в ней, растворяя одно другим. Пред моим умом не было путей: весь я был одно недоумение; и боль наполняла всего меня. Но именно в атмосфере духовной боли рождалось постижение величия Человека. И не есть ли сия святая боль один из каналов, чрез который Вышний Бог непосредственно общается с созданием Своим, давая ему постепенно знание не только о тварном-космическом бытии, но и о Самом Себе?'
          cn: 我曾活在两个世界中：其中一个世界，我藉着视觉、听觉和其他身体感官来感知；在另一个世界里，我唯独凭着灵：在那里，我全神贯注地「聆听」，全然地等候；我竭力「观看」，但却是以另一种方式看见……这两个截然不同的世界在祷告中并不分离。白天，这祷告在可感知的世界中流淌；而到了夜晚，它则将我带入「心神领域」（我不知如何称呼那拥抱着我的无垠）。当我阅读福音书时，所有的词语对我而言都似曾相识，但每个词语背后，在上帝的本体存有中隐藏着什么，我却无法领悟。有一件事对我来说异常清晰：万有都在基督，上帝之子里面；并且唯独在祂里面。我也向祂祷告。我也呼求父，好使从祂而出的真理的灵降临，甚至临到我，为要引导我进入一切真理（约翰福音 16:26，16:13）。我对隐秘上帝的寻求，在旧约中得到了回应：我在那里找到了许多话语来表达我的需要。约伯那些愤慨的爆发令我感同身受；我也像基督降世前的先知们一样呻吟；我从诗篇中汲取祷告的灵感；但我真正学习的唯有新约，我藉着新约的视角来理解其他一切，无论它们源自何处。我认识上帝的饥渴无法满足：无论我祷告多少，无论我叹息多深，我仍未得饱足。这便是我在阿索斯圣山的「杯」：苦与乐在其中交融，彼此消溶。在我心神面前没有道路可寻：我整个人都充满了困惑；痛苦也充满了我的全身。然而正是在属灵痛苦的氛围中，领悟到「人」的伟大诞生了。这圣洁的痛苦不正是其中一个管道，借此至高上帝直接与祂的受造物沟通，逐步赐予它认识，不仅关乎受造的宇宙存有，而且关乎祂自己吗？
      - type: paragraph
        text:
          ru: 'Блаженному старцу Силуану в момент явления ему Живого Господа было дано познать всем его существом «неописуемое Божественное Смирение». Слово старца было действенным для многих, и даже для меня, тяжкодумного. Итак, благодаря старцу – мне стало очевидным, что в основе всех трагедий человеческого рода лежит падение в гордость. Страсть сия есть сама сущность ада: поистине – сатанинские глубины. Сейчас пишу и с острым стыдом вспомнил: этот богохульный и завистливый дух, задолго до встречи со старцем, однажды принес мне помысл: «Почему Христос Единородный, а не я?»... Одно мгновение, но злой огонь опалил мое сердце... Бог спас меня. Больше того: как-то приоткрылась мне тайна всех падений.'
          cn: 至福长老圣西卢安，在活生生的上主向他显现的那一刻，他的整个存在都被恩赐去体会「不可言喻的神圣谦卑」。长老的言语对许多人都是有力的，甚至对我这个思想沉重之人也是如此。因此，藉着长老，我明白了人类一切悲剧的根基乃是堕入骄傲。这种罪性乃是地狱的本质：真真切切的——撒旦式的深渊。我此刻书写时，带着尖锐的羞愧回忆起：这个亵渎上帝又充满嫉妒的灵，早在遇见长老之前，有一次给我带来了一个念头：「为什么基督是独生子，而不是我呢？」...一瞬间，但邪恶的火焰烧灼了我的心...上帝拯救了我。不仅如此：所有堕落的奥秘，某种程度上也向我启示了。
      - type: paragraph
        text:
          ru: Бог спас меня, и углублялась моя любовь к Нему. Но навсегда осталось во мне сознание, что никто не спасается своею силою. Никто не может быть уверенным, что пришедший к нему тот или иной помысл не овладеет им на вечность. Господь в пустыне вышел победителем во всех искушениях от сего духа (Мф. 4:1–11).
          cn: 上帝拯救了我，我对我祂的爱也日益加深。然而在我心中永远存留着一个认知，即任何人都无法凭着自己的力量得救。任何人都无法确信，临到他的某个念头不会永远地辖制他。主在旷野里得胜了来自这灵的所有试探 (马太福音 4:1-11)。
      - type: paragraph
        text:
          ru: 'Бог спас меня. Но я был в ужасе от одного факта, что такие помыслы могут придти ко мне. Я думал: «Нет мне надежды на спасение... Богу невозможно принять меня на вечность таким, как я есмь (см.:Ин. 17:21–23). Да и мне было бы слишком тяжко быть с Ним, если нужно всегда бороться со страстями».'
          cn: 上帝拯救了我。但是，我却因一个事实而惊恐万分，即这样的思虑竟然会临到我身上。我想着：「我得救无望了……上帝不可能接纳我进入永恒，就我本来的样子（参阅：约翰福音 17:21-23）。而且，对我而言也会太过艰难，如果我需要永远与情欲争战。」
      - type: paragraph
        text:
          ru: 'Поразительно заботливым был о мне Промысл Божий: именно в нужный момент Господь допустил меня до встречи с Силуаном. Благодаря ему в моей внутренней жизни наступил решительный перелом. Он объяснил мне «держать ум во аде – и не отчаиваться». Велика моя благодарность к отцу и старцу моему. Я увидел, что и меня в прошлом Господь вел к тому же, но я был слишком туп, чтобы уразуметь Божие водительство. Благодаря Силуану и мне было дано начало познания путей Господних, и я с трепетом благословляю Имя Его.'
          cn: 上帝的护理对我而言是如此奇妙且充满眷顾：正是在恰当的时刻，上主容许我与圣西卢安相遇。借着他，我的内在生命迎来了一个决定性的转折。他向我解释了「持心于地狱中——却不绝望。」我对我的父，我的长老怀着深切的感恩。我明白了，过往上主也曾同样引导我，但我那时太过愚钝，未能明了上帝的带领。借着圣西卢安，我也得以开始认识上主的道路，我便怀着敬畏的心，称颂祂的圣名。
      - type: paragraph
        text:
          ru: '«Кто любит Меня, тот соблюдет слово Мое»... «Кто имеет заповеди Мои и соблюдает их, тот любит Меня»... «Не любящий Меня не соблюдает слов Моих»... «Не принимающий Меня имеет судию себе: слово, которое Я говорил, оно будет судить его в последний день»(Ин. 12, 48, 14:23, 21, 24).'
          cn: 「爱我的人，必遵守我的话语」... 「那有我的诫命又遵守的，这人就是爱我的」... 「不爱我的人，不遵守我的话语」... 「弃绝我的人，自有审判他的；我所说的话语，这话语要在末日审判他」(约翰福音 12:48，14:23，21，24)。
      - type: paragraph
        text:
          ru: 'И на Афоне, как и до монашества, моя молитва не раз бывала прервана богоборческими мыслями. Так, в один момент мучительного стояния на суде слова Божия, я ощутил мою крайнюю беспомощность пребывать в духе заповедей Его при всех моих стараниях, и я говорил такие безумные слова: «Ты не имеешь права судить меня. Чтобы по всей правде быть моим судьею, Ты Сам должен быть поставлен в равные со мною условия... Ты бесконечен в могуществе безначального Бытия, а я в тварности моей подобен червю».'
          cn: 在阿索斯山，一如在修道之前，我的祷告屡次被抵挡上帝的思想所中断。就这样，在某一刻，在上帝话语的审判前痛苦地站立着，我感受到我极度的无助，尽管我竭尽全力，仍无法活在祂诫命的精神中。我竟说出如此疯狂的话：「祢没有权利审判我。若要完全公义地成为我的审判者，祢自己也必须被置于与我平等的境况中……祢在无始的存有之大能中是无限的，而我在我的受造性中如同虫豸一般。」
      - type: paragraph
        text:
          ru: 'Молитва моя была обращена к Богу «вообще». Но все же я получил на нее ответ в сердце моем:«Отец не судит никого, но весь суд отдал Сыну... потому, что Он – Сын человеческий...»(Ин. 5:22–27). До того времени множество раз эти слова были прочитаны мною, но они не воспринимались мною в таком смысле. Я был посрамлен: мне стало стыдно: я всегда жил в условиях значительно более легких, чем те, в которых прошла земная жизнь Христа. Воистину Он имеет право судить весь мир. Нет никого, кто превзошел бы Его своими страданиями. Внешне многие перенесли и доныне переносят ужасные пытки в застенках современных тюрем, но качественно Его ад, «ад любви», болезненнее всех прочих.'
          cn: 我的祷告是向「一般而言」的上帝发出的。然而，我在我心中得到了回应：「父不审判任何人，但将一切审判都交托了子…因为祂是人子…」(约翰福音 5:22-27)。在那之前，我曾无数次读过这些话，但我从未以这样的意义去领会它们。我感到羞愧：我感到惭愧：我总是生活在远比基督尘世生命所经历的境况更轻松的境况中。诚然，祂有权柄审判全世界。没有人能在苦难上超越祂。从外表看，许多人曾忍受，并且至今仍在忍受现代监狱牢房中的可怕酷刑，但从本质上讲，祂的地狱——「爱之地狱」——远比所有其他的更痛苦。
      - type: paragraph
        text:
          ru: '«Отец... весь суд отдал Сыну, потому что Он – Сын человеческий». Но в чем этот суд? В том, что Он показал, что сохранить заповедь Отца возможно для человека, и это при всех положениях, какие только могут постигнуть нас в этом мире. Нет мне оправдания, когда я ссылаюсь на мою «человеческую» немощь. Подобно сему, последовавшие Христу во время Его земной жизни получили право вместе с Ним судить мир:«Разве не знаете, что святые будут судить мир»(1Кор. 6, 2). Ап. Петр спросил Господа:«Вот, мы оставили все и последовали за Тобою: что же будет нам? Иисус же сказал им: истинно говорю вам, что вы, последовавшие за Мною, в пакибытии, когда сядет Сын человеческий на престоле славы Своей, сядете и вы на двенадцати престолах судить двенадцать колен Израилевых»(Мф. 19:27–28).'
          cn: 「父……将一切审判都交给了子，因为祂是人子。」但这审判是什么呢？就是祂显明，人能够遵守父的诫命，而且是在这世上一切可能临到我们的境况下。当我援引我「人性的」软弱时，我没有辩解的余地。照样，在祂地上生活期间跟随基督的人，获得了与祂一同审判世界的权利：「岂不知圣徒要审判世界吗？」（哥林多前书 6:2）使徒彼得问主说：「看哪，我们已经撇下一切跟从祢了，我们将来要得什么呢？」耶稣对他们说：「我实实在在地告诉你们，你们这些跟从我的人，在更新之时，当人子坐在祂荣耀的宝座上时，你们也要坐在十二个宝座上，审判以色列的十二个支派。」（马太福音 19:27-28）
      - type: paragraph
        text:
          ru: 'Почему так? Ответ на этот вопрос находим в Евангелии: 1) Родители слепорожденного боялись иудеев, которые решили, что, если«кто признает Его за Христа(т.е. Мессию),того отлучать от синагоги»(Ин. 9:22, 34). 2)«и из начальников многие уверовали в Него; но... не исповедовали, чтобы не быть отлученными от синагоги»(Ин. 12, 42).«Изгонят вас из синагоги; даже наступит время, когда всякий, убивающий вас, будет думать, что он тем служит Богу»(Ин. 16, 2). Немалым был риск подвергнуться в то время социальному остракизму. Апостолы, однако, решились на сей подвиг; почти все они были убиты за проповедь Евангелия; отсюда их «право» судить не последовавших Христу.'
          cn: '为什么会这样呢？这个问题的答案，我们可以在福音书中找到：

            1) 那生来瞎眼之人的父母害怕犹太人，因为犹太人已经决定，「无论何人，若认祂为基督（即弥赛亚），就必将他赶出会堂」（约翰福音 9:22，34）。

            2) 「就是官长中，也有好些信祂的；只是……他们不认，恐怕被赶出会堂」（约翰福音 12:42）。「他们要将你们赶出会堂；并且时候将到，凡杀害你们的，就以为是事奉上帝」（约翰福音 16:2）。在那时，遭受社会排斥的风险不小。然而，使徒们却毅然决然地承担了这项伟大的功绩；他们几乎所有人都因宣讲福音而被杀害；因此，他们拥有审判那些不跟随基督之人的「权利」。'
      - type: paragraph
        text:
          ru: '«Сам Отец любит вас, потому что вы возлюбили Меня»(Ин. 16, 27). Не без печали вспоминаю годы моей молодости, когда значение сих святых слов скрывалось от меня. Думаю: веками повторяются многие с небес сошедшие слова в самых различных сочетаниях, но не вызывают должного отзвука в окаменелых сердцах, в погасшей для вышнего мира мысли. А ведь было немало мгновений, когда сии глаголы давались Свыше человекам, подобные громам, потрясающим сердца, и молниям, просвещающим сознание людей. Они нисходили на нашу землю из сокровенного Царства, как спасительное откровение о неизреченной премудрости Отца Небесного, о Его к нам любви, о великой тайне Бытия.'
          cn: 「父自己爱你们，因为你们爱我」(约翰福音 16:27)。我不无忧伤地回想起我年轻的岁月，当这些圣言的意义曾向我隐藏时。我思忖：千百年来，许多从天上降临的话语以各种不同的组合重复着，却未能在顽石般的心中，在对至高世界已然熄灭的思想中，激起应有的共鸣。然而，曾有许多时刻，这些言语从至高者那里赐予人类，如同震撼心灵的雷鸣，和照亮人类意识的闪电。它们降临到我们的地上，从那隐秘的国度，作为一份救赎性的启示，关于天父不可言喻的智慧，关于祂对我们的爱，关于存在之宏伟奥秘。
      - type: paragraph
        text:
          ru: В течение столетий произносились священные слова без соответствующего внимания, и, возможно, в силу этого утеряли свою изначальную мощь; ту, которую имели они, впервые являясь сознанию пророков, апостолов и святых. Найдутся ли иные способы выражения глубинного смысла данного нам познания о Боге великом? Любовь к Нему ищет своего выявления в таких формах, жизненной энергии которых не могло бы умалить всегубительное время.
          cn: 数个世纪以来，圣言被诵念，却未能获得应有的关注，也许因此，它们失去了其原本的威力；那威力是它们在初次显现于先知、使徒与圣者们的意识中时所拥有的。是否还能找到其他方式，来表达那赐予我们关于伟大上帝的认识的深层含义？对祂的爱寻求以这样的形式彰显：其生命的活力不会被吞噬一切的时间所减损。
      - type: paragraph
        text:
          ru: Пред нашими глазами совершается невыразимо великое чудо творения мира, творения богов (Ин. 10, 34;Пс. 81, 6), которое еще не завершилось (Ин. 5, 17). «Завершение» обетовано в грядущем веке. Но и теперь уже, когда нетварный Свет нисходит на нас, сей духовный процесс вызывает в недрах нашего духа восхищение, возносит мысль в обетованное нам Царство.
          cn: 在我们眼前，正在成就着无法言喻的伟大奇迹——世界的受造，以及诸神的受造（约翰福音 10:34，诗篇 81:6），这奇迹尚未完成（约翰福音 5:17）。「完成」已蒙应许，在那将临的世代。然而，即便现在，当那非受造之光降临于我们身上时，这一属灵过程仍在我们灵性深处唤起一种赞叹，并将我们的思绪提升至那应许给我们的天国。
      - type: paragraph
        text:
          ru: 'Стяжание сего Царства Отчей любви связано со многими страданиями (Мф. 11, 12, 25:34). Томится сердце до глубокой «боли» от сознания понесенной человеком потери. Я говорю о духовной, метафизической боли и хочу, чтобы читатель правильно понял меня. В словах наших всегда наличествует некая текучесть: с переменой опыта меняется содержание понятий и смысл, влагаемый в те же самые по звукам слова Божии, и слова литургических текстов – выходили из уст, как пламя. В таком состоянии я пребыл три дня, и затем умалилась интенсивность переживания. Но память о нем резцом выгравировал Господь в уме и сердце моем. И я молю Его – не отвергнуть меня в старости моей; ни в день смерти моей (Пс. 70, 9).'
          cn: 修得这天父之爱的国度，伴随着诸多苦难 (马太福音 11:12，25:34)。心神憔悴，因着人所蒙受的失落之自觉，而产生深切的「痛苦」。我所说的是属灵的、形而上的痛苦，我希望读者能正确理解我。我们的言语中总有某种流动性：随着经验的改变，观念的内涵，以及被赋予到那些听起来一模一样的上帝话语中的意义，都随之改变，而礼仪经文的词语——则如同火焰一般从口中发出。我在这状态中停留了三天，然后，这经历的强度便减弱了。但对它的记忆，上主却用刻刀雕刻在我的心智和心中。我便向祂祈求——不要在我年老时弃绝我；也不在我死的那天 (诗篇 70:9)。
      - type: paragraph
        text:
          ru: Апостол Павел заповедал нам«ходить достойно звания»(Еф. 4, 1). Но в чем оно? Опять дадим слово ему же.«Мне, наименьшему из всех святых, дана благодать – благовествовать...неисследимое богатство Христово,и открыть всем... домостроительство тайны, скрывавшейся от вечности в Боге, создавшем все Иисусом Христом... в Котором мы имеем дерзновение и надежный доступ чрез веру в Него... чтобы вы, укорененные и утвержденные в любви, могли постигнуть... что широта и долгота, и глубина, и высота, и уразуметь превосходящую разумение любовь Христову, дабы вам исполниться всею полнотою БОЖИЕЮ. А Тому, Кто действующею в нас силою может сделать несравненно больше всего, чего мы просим, или о чем помышляем... слава... от века до века»(Еф. 3гл.).
          cn: 使徒保罗吩咐我们「行事为人与蒙召的恩相称」（以弗所书 4:1）。但它又是什么呢？让我们再次听他本人怎么说。「我，就是众圣徒中最小的，蒙了这恩典，去传扬……基督那测不透的丰盛，又使众人明白……这奥秘的安排，这奥秘是万古以来隐藏在上帝里的，这位上帝藉着耶稣基督创造了万有……我们因信祂，得以坦然无惧，深信不疑地来到上帝面前……使你们在爱中生根立基，就能领会……那阔、长、高、深，并认识基督那超越人所能理解的爱，使你们得以上帝一切的丰盛充满。但愿荣耀归于祂，祂能照着运行在我们心里的能力，充充足足地成就一切，超过我们所求所想的……荣耀……直到万代，永永远远。」（以弗所书 第3章）
      - type: paragraph
        text:
          ru: Итак, наше звание и призвание – стать сынами Бога и Отца, чрез Единородного и Единосущного, Предвечного и Безначального Сына Его, и носителями ВСЕЙ ПОЛНОТЫ Божией (ср.:Ин. 16, 27;Ин. 17:21–26).
          cn: 所以，我们的蒙召与天职，是藉着祂的独生、同性同体、在万古之先并无始的儿子，成为上帝和父的儿子们，并成为上帝全部丰盛的承载者（参阅：约翰福音 16:27，约翰福音 17:21-26）。
      - type: paragraph
        text:
          ru: Продолжу говорить о некоторых других явлениях, которых никак не мог бы ожидать, будучи таковым, как я есмь. Не раз мне было дано созерцать Божественный Свет. Нежно объятый им, я бывал полон неземной любовью. В некоторых случаях внешний мир терял свою материальность и становился невидимым. Происходившее со мною принадлежало иному плану бытия. Когда же недоведомым мне образом восстанавливалось обычное мироощущение, тогда тонкая печаль проникала в душу в связи с возвращением в плотскую жизнь.
          cn: 我将继续谈论其他一些现象，这些现象以我之身是绝不可能预料到的。我曾不止一次地得以默观神圣之光。被其温柔环绕时，我便充满不属世的爱。在某些情况下，外部世界失去了它的物质性，变得不可见。发生在我身上的事，属于另一种存有层面。而当寻常的对世界的感知以一种我所不知的方式恢复时，一种细微的忧伤便渗透到灵魂中，因为回归了肉身的生活。
      - type: paragraph
        text:
          ru: 'Иногда мне приходила мысль, что я мог бы не возвратиться; молитва из временной может стать вечным состоянием души. Видение Света непременно слито с воскрешающей нас благодатью, и покинуть землю в таком состоянии есть благословение. Мы знаем из Жития преп.Серафима Саровского, что он скончался во время молитвы: душа его оставила тело еще не мертвое: он держал в руке горящую свечу.«Честна пред Господом смерть преподобных Его»(Пс. 115, 6). Не такою ли смертью должны все мы переходить от этой жизни?«Истинно, истинно говорю вам: слушающий слово Мое, и верующий в пославшего Меня ИМЕЕТ жизнь вечную; и на суд НЕ приходит, но перешел от смерти в жизнь»(Ин. 5, 24).«Истинно, истинно говорю вам: кто соблюдет слово Мое, тот не увидит смерти вовек»(Ин.8, 51).'
          cn: 有时我曾想到，我或许不会归回；祈祷从暂时的状态能成为灵魂永恒的状态。对圣光的瞻视必然与使我们复活的恩典融为一体，并以如此状态离开尘世乃是一种福佑。我们从萨罗夫的圣塞拉芬长老生平中得知，他在祈祷时离世：他的灵魂离开了尚未死亡的身体：他手中握着一枝燃着的蜡烛。「在上主眼前，祂圣者的死是可贵的」（诗篇 115:6）。我们岂非都当以这样的死亡从今生迁往彼生？「我实实在在地告诉你们，听我的话，又信那差我来的，就有永生；不至于定罪，乃是已经出死入生了」（约翰福音 5:24）。「我实实在在地告诉你们，人若遵守我的话，就永不尝死味」（约翰福音 8:51）。
      - type: paragraph
        text:
          ru: 'Молитва есть энергия особого порядка: она есть слияние двух действий: нашего – тварного, и Божьего – нетварного. Как таковая, она и в теле, и вне тела; вне даже мира сего, пространственного и временного. Когда мы в благом ужасе от видения святости Бога и в то же время в отчаянии от нашего крайнего недостоинства такого Бога, то молитва становится могучим порывом духа, разрывающим тесное кольцо тяжелой материи. Наше данное тело должно «одухотвориться» (ср.:1Кор. 15, 50)."Наше(духовное)жительство на небесах, откуда мы ожидаем и Спасителя, Господа нашего Иисуса Христа, который уничиженное тело наше преобразит так, что оно будет сообразно славному телу Его, силою, которою Он действует и покоряет Себе все»(Фил. 3:20–21).«Итак, если мы(духовно)воскресли со Христом, то(естественно)ищем горнего(небесного),где Христос сидитодеснуюБога»(ср.:Кол.3, 1).'
          cn: 祷告是一种特殊秩序的能量：它是两种行动的融合：我们的——受造的，以及上帝的——非受造的。如此说来，它既在身体内，也在身体外；甚至超乎这个世界之外，超乎空间的和时间的。当我们因看见上帝的圣洁而心生敬畏，同时又因我们对如此的上帝极度不配而感到绝望时，祷告就成为一股强大的灵性冲动，撕裂重物质的紧密束缚。我们这现有的身体必须「灵化」（参阅：哥林多前书 15:50）。「我们（灵性上）的居所乃在天上，我们从那里等候救主，我们的上主耶稣基督降临；祂将我们卑贱的身体改变形状，使之与祂荣耀的身体相似，借着祂所运用能叫万有归服自己的大能。」（腓立比书 3:20-21）「所以，如果我们（灵性上）与基督一同复活，那么（自然地）就当寻求上面的事（属天的事），那里有基督坐在上帝的右边。」（参阅：歌罗西书 3:1）
      - type: paragraph
        text:
          ru: О, этот дар молитвы! В своем порыве к возлюбленному Богу-Отцу – она ненасытна; чрез нее вступаем мы в иной образ бытия, не пространственно, но качественно превосходящего сей мир. Не опьяненным воображением возбужденная, ни рассудочной философией руководимая – душа ищет путей там, где нет путей. Некая внутренняя интуиция движет ее, душу, связанную невидимыми, но нерасторжимыми цепями «закона греха»; нерасторжимыми нашими собственными усилиями, но лишь действием Вседержителя-Бога, Спасителя нашего. В каком образе может быть представлена борьба души за свое освобождение? Напрашивается аналогия с телом, которое при несносных болях все приводится в движение, пытаясь уклониться от болей; подобно сему «движется» душа в молитвенном плаче, чтобы преодолеть свою боль, соединившись с Богом.
          cn: 啊，这祈祷的恩赐！在其向着所爱的上帝——父的热切追求中，祈祷永不餍足；藉着她，我们进入另一种存在模式，这模式并非空间上，而是品质上超越此世。非由被陶醉的幻想所激发，亦非由理性哲学所引导——灵魂在无路之处寻求出路。某种内在的直觉推动着它，这灵魂被「罪的律法」那无形却不可断裂的锁链所束缚；这些锁链凭我们自身的力量是不可断裂的，唯独藉着全能的上帝，我们的救主，的作为方可断裂。灵魂为其自身解放所作的斗争可以被描绘成何种形象呢？一个类比自然而然地浮现出来，那便是身体，当其遭受难以忍受的痛苦时，会全身动弹，试图躲避这些痛苦；与此相似，灵魂在祈祷的哀哭中「动弹」，为了克服自身的痛苦，藉着与上帝联合。
      - type: paragraph
        text:
          ru: 'Из моего опыта могу сказать: есть два рода отчаяния: одно – чисто негативное, губящее человека духовно и затем телесно. Другое – благословенное. О нем я и не перестаю говорить. Через отчаяние сего порядка пришло ко мне возрождение во Свете. Мне совсем не легко исповедать пред людьми о излившемся на меня благоволении Всевышнего. Я никогда не мог понять, почему так со мною! Таким, как я есмь? Сначала незримый для меня Свет дал мне увидеть мой внутренний ад; затем и весь тварный мир в его временном бывании, в его подверженности умиранию. Я носил в себе это страшное видение долго, долго. Я бывал подавлен абсурдностью всего в этом мире, исполненном страданий, убивающих всякую возникающую жизнь. Но, как сие ни странно, новая жизнь стала биться внутри стократно: молитва непрерывным потоком заливала сердце, увлекая за собою и ум; часто с возрастающей силой; иногда же настолько, что исторгала мой дух в бездонность иного пространства, не похожего на то, что мы воспринимаем обычно. В одно и то же время я бывал сведен до ничтожества и вместе с тем получал не поддающийся учету опыт углубленного мировидения, и даже прикосновений к вечности.'
          cn: '从我的经验来看，我可以说：绝望有两种。一种是全然负面的，先在灵性上、而后在肉体上毁灭人。另一种则是蒙福的。我从未停止谈论这种绝望。借着这种绝望，我在光中得了重生。


            在众人面前承认至高者倾注在我身上的恩眷，对我来说绝非易事。我从未明白，为什么会这样临到我！像我这样的人？


            起初，那对我而言不可见的光，使我得以看见我内心的地狱；随后，又让我看见整个受造世界，在其暂时的存在中，在其必朽坏的境况中。我心中带着这可怕的景象，长久，长久。我曾被这个世界一切事物的荒谬所压倒，这世界充满了痛苦，扼杀一切勃发的生命。


            然而，这多么奇怪，新的生命却在我内心中百倍地搏动起来：祷告如不息的洪流涌入我心，将我的心智也牵引而去；常常力量日益增强；有时甚至如此之甚，以至于将我的灵投入到另一个无底的虚空之中，那与我们通常所感知的全然不同。在同一时间，我被贬抑至虚无，而与此同时，我也获得了无法估量的经验，那是对世界更深邃的洞见，甚至触及了永恒。'
      - type: paragraph
        text:
          ru: 'Мучительно непрестанно сознавать свою нищету: от тяготы сей сокрушаются даже кости... Но странно: когда ослаблялось это святое сокрушение, тогда я умирал духовно. Я не понимал природы сего явления. Лишь позднее блаженный Силуан объяснил мне: «Господь так воспитывает нас, чтобы мы не утеряли смирения». Тогда и я отчасти уразумел тайну сего пути. Бывало в прошлом: как живописец, я переживал ощущение торжества, победы: я «схватил» то, чего искал: я приблизился к выражению той красоты, что открывалась мне. Но быстро исчезал сей восторг: опять я терзался видением моих промахов. Так, и еще больше, с Богом: Он не дает нам покоя; на какой-то миг утешает душу, прикасается огнем Своим к сердцу, восхищает ум в видение Его славы, – и снова скрывается, чтобы мы не подумали, что достигли полноты познания Его. Удел наш на земле – быть«нищими духом». Едва обнимет нас ложный покой удовлетворения собою, как немедленно Дух Жизни, от Отца исходящий, покидает нас.'
          cn: '痛苦地持续意识到自己的贫乏：这重担甚至使骨头都碎裂了……但奇怪的是，当这圣洁的痛悔减弱时，我在灵性上便死去了。我不明白这现象的本质。直到后来，蒙福的西路亚向我解释道：「主如此教导我们，为使我们不失去谦卑。」那时我也部分地领悟了这道路的奥秘。


            过去常常，像一个画家，我体验到一种凯旋的胜利感：我「抓住」了我所寻找的；我接近了表达那向我显现的美。但这狂喜很快就消失了：我又因看见自己的失误而备受折磨。同样，在上帝那里更是如此：祂不给我们安宁；在某个瞬间祂安慰灵魂，以祂的火焰触碰人心，将悟性提升至见祂荣耀的异象中——然后又隐藏起来，为免我们以为已达致对祂的完全认识。我们地上的本分是作「灵里贫乏的人」。虚假的自我满足的平安一旦拥抱我们，生命之灵，那从父而出者，便立刻离开我们。'
      - type: paragraph
        text:
          ru: 'Из опыта этих смен уяснилась и мне структура заповедей блаженства, а именно: в основе всего духовного прогресса лежит истомляющее ощущение своей «нищеты». Но это сознание есть источник молитвенной энергии и вместе тот солидный фундамент, на котором зиждется все здание спасения даже до вершины его, за которой следует«великая награда на небесах»(ср.:Мф. 5:3–16).'
          cn: 从这些转变的经验中，我也清楚地明白了真福八端的结构，亦即：一切属灵进步的基础在于令人耗竭的『贫乏』感。然而这种意识是祷告活力的源泉，同时也是那坚实的基础，其上建立着整个救恩的殿堂，直至其顶峰，在其之后便是『在天上的大赏赐』(参：马太福音 5:3-16)。
      - type: paragraph
        text:
          ru: 'И опять, и вновь: в основе всех зол лежит гордость: в ней смерть и тьма. Святое же бесстрастие свойственно смирению, которое низводит человека до ощущения самого себя «ниже всякой твари» и неизъяснимым образом возносит чрез это превыше всего тварного.'
          cn: 再者，又一次：一切邪恶的根源都在于骄傲：其中有死亡与黑暗。而圣洁的无情欲，则为谦卑所固有，它使人自觉「低于一切受造物」，并以不可言喻的方式，借此超越一切受造物。
      - type: paragraph
        text:
          ru: 'Христианин-подвижник в своей по Богу жизни не должен уподобляться ни поэтам, ни писателям, ни психологам, ни философам, ни ученым. В своем обращении к Богу он устремляется вперед, не обращаясь на самого себя. То, что он действенно живет в молитве, оставит в его существе неизгладимый след, но увидит его в себе аскет лишь по прошествии долгого времени, когда внимание его ума остановится на прошлом. Тяга к Богу, в начале подвига, бывает настолько интенсивна, что дух человека в своем напряженном движении к Всевышнему взирает исключительно на Него Единого. Душа кающегося, видящего себя невыразимо далеким от искомой Истины, вся становится ноющей раной и умоляет уже возлюбленного начальной любовью Господа о милости и снисхождении к ней. Чувство греха, разрушившего наше богоподобное существо, порождает непередаваемое сожаление о том состоянии, в котором мы так долго пребывали; которое сделало нас вовсе недостойными Святого святых: может ли такой Господь принять меня, до конца растленного? Предстоит душа как бы на Страшном Суде. И чем сокрушительнее боязнь приговора, тем напряженнее молитва раскаяния. В часы перерыва телесного предстояния Богу делами повседневности существенная установка духа не меняется: он всей силой пребывает в том же движении к Богу.'
          cn: 基督徒苦行者在他属神的生命中，不应效法诗人、作家、心理学家、哲学家，也不应效法科学家。在他转向上帝时，他奋力向前，不回顾自身。他有效地活在祷告之中，这将在他的存有中留下不可磨灭的印记；但这位苦行者唯有在漫长的时间过后，当他的心意停留在过去之时，才能在他自身中看到它。在苦修之初，对上帝的渴慕是如此强烈，以至于人的精神在他紧张地朝向至高者的运动中，唯独仰望那独一的祂。悔改者的灵魂，看见自己与所寻求的真理相距遥远得难以言喻，完全成了一道隐隐作痛的伤口，并恳求那已凭着初始之爱所爱慕的上主，赐予他怜悯和俯就。罪的感觉，它摧毁了我们肖似上帝的存有，产生了对我们如此长久以来所处状态的难以言喻的悔恨；这悔恨使我们完全不配侍立于至圣者面前：这样一位上主怎能接纳我这已全然败坏之人呢？灵魂站立，如同在末日审判面前。判决的恐惧越是令人心碎，悔改的祷告就越发紧张恳切。在日常事务打断身体侍立于上帝面前的那些时刻，精神的本质性定位并未改变：它以全部力量，依然停留在朝向上帝的同一运动之中。
      - type: paragraph
        text:
          ru: 'На пятом году моего монашества вот что случилось со мной: игумен монастыря св. Пантелеймона, архимандрит Мисаил, однажды позвал меня к себе и дал мне «послушание» – учиться греческому языку, так как монастырь имел нужду в знающих этот местный язык и потому необходимый во всех сношениях с внешним миром, духовным и официальным.'
          cn: 在我修道生涯的第五年，发生了一件事：圣潘特莱蒙修道院的院长，掌院修士米撒伊尔，有一次把我叫到他那里，并给了我一项『顺服任务』——学习希腊语，因为修道院需要懂得这门本地语言的人，因而这门语言在与外界的一切往来中都是必需的，无论是属灵的还是官方的往来。
      - type: paragraph
        text:
          ru: 'Я сделал положенный по традиции поклон, чтобы получить благословение на предстоящий мне труд. И когда я уже почти дошел до выхода из кабинета, он остановил меня и сказал: «Отец Софроний, Бог дважды не судит. Если вы исполняете возложенное на вас за послушание мне, то я явлюсь ответственным пред Богом, а вы пребывайте в мире». Говорил он, опустив голову на грудь, как бывает обычно при молитве; в голосе его отражалась серьезность, которую он придавал своему слову. Отправившись от него в библиотеку, чтобы взять там нужные для изучения греческого языка книги, я возвратился в келию; открыв грамматику аттического диалекта, я естественно сосредоточил внимание на читаемом. И что же? Я физически ощутил, как мой ум выходит из сердца, подымается до лобной части черепа и далее движется в направлении к книге. В тот момент мне стало ясно, что мой ум безысходно днем и ночью пребывал в сердце в течение семи лет моей покаянной молитвы. Я, по слову игумена, оставался спокойным внутренне. Сокрушенный болезнью (малярией), я пересиливал телесную немощь, чтобы учиться языку возможно большее число часов каждый день. Помню, однажды, когда я писал упражнения, мне, изнуренному, пришла мысль: если сейчас я услышу призыв к Суду, что будет со мною? В глубине сердца был покой: «Я встану и в мире пойду на Суд Божий». Этот момент теперь я особенно отмечаю, потому что он был вовсе не похож на усвоившееся мне настроение предстояния суду в большом страхе. Итак, за молитвы игумена был дан мне опыт такого мира. Мое новое занятие отнимало от меня возможность прежней молитвы, но благодать в весьма чудной форме неведомого мне дотоле мира не оставляла меня несколько месяцев моего усилия овладеть греческим языком. Так Бог не покинул меня, но и сердце мое тоже не отлучалось от Него.'
          cn: '我依传统行了叩拜，以领受为我即将开始的劳作所求的祝福。当我快要走到办公室门口时，他叫住了我，说道：「索夫罗尼长老，上帝不会两次审判。如果你因着对我的顺服而履行了托付给你的事，那么我将向上帝负责，而你则在平安中存留吧。」他说话时，垂着头，抵在胸前，如同平时祷告时那样；他的声音中流露出他对自己的话语所赋予的严肃性。


            从他那里离开后，我去了图书馆，在那里取了学习希腊语所需的书籍，然后回到自己的修道室；我打开了一本阿提卡方言的语法书，自然而然地将注意力集中在所读的内容上。结果如何？我切身感受到我的心智如何从心中出来，上升到颅骨的额部，并进一步朝着书本的方向移动。在那一刻，我清楚地明白，我的心智在我悔罪祷告的七年间，日夜无休止地存留在心中。我，按照伊古门的吩咐，内心保持着平静。被疾病（疟疾）所击垮的我，克服着肉体的虚弱，为了每天尽可能多地学习语言。


            我记得，有一次，当我正在做练习时，一个念头浮现在疲惫不堪的我心中：「如果我现在听到审判的召唤，我将如何？」在我的心深处，有着平安：「我将起身，并在平安中走向上帝的审判。」我现在特别提到这个时刻，因为它与我此前习惯的、在巨大恐惧中面对审判的心情完全不同。因此，藉着伊古门的祷告，我获得了如此平安的体验。我的新工作剥夺了我过去祷告的机会，但圣宠以一种我前所未知的、奇妙平安的形式，在我努力掌握希腊语的几个月里并未离开我。就这样，上帝没有离弃我，我的心也从未远离祂。'
      - type: paragraph
        text:
          ru: 'Прошли месяцы учения, и Господь благоволил мне дать снова отчаянную молитву покаяния. Чтобы возродиться нам в Боге, нам нужен ужас от нас самих, как мы есть. Отвращение к живущей в нас гадостной, богопротивной страсти гордости, изгнавшей нас с позором из Царства Отца светов. Спасение от нее в заповеди Христа: любить Бога до ненависти к себе (ср.:Лк. 14, 26). Тема эта чрезвычайно важна, и я знаю, что исчерпать эту сторону духовной жизни христианина не смогу, сколько бы я ни писал.'
          cn: 几个月的学习过去了，上主施恩，让我得以再次作绝望的悔罪祷告。为了我们得以在上帝里重生，我们需要因我们自身本相而生出恐惧。对活在我们里面那卑劣、悖逆上帝的骄傲情欲的憎恶，正是它将我们羞耻地逐出了众光之父的国度。从这情欲中得救，就在基督的诫命里：爱上帝，以至于恨恶自己（参阅：路加福音 14:26）。这个主题极其重要，我也知道，不论我写多少，都无法详尽阐述基督徒灵性生活的这一层面。
      - type: paragraph
        text:
          ru: 'Я назвал овладевшее мною отчаяние великим даром Свыше. Но я осознал это не ранее, чем по прошествии тридцати лет труда; быть может даже и более. Я не искал помощи от людей, потому что я был захвачен, как сухой лист ветром; меня крутил он, не давая понять смысла, что творится со мною; я ничего не понимал; я никого не мог спросить, потому что не мог сформировать и вопроса. Бытие космическое бурно раскрывалось моему уму, – с быстротою, не позволявшею мне остановиться рассудком ни на чем. Это было похоже на безумие, но особого порядка, не подлежащее компетенции психиатров. Начинался процесс моего отхода от мира. Что-то легло между мною и людьми: у меня терялся интерес к общению с ними: исчезали один за другим пункты для контакта. Мир искусства: живопись, музыка, поэзия, литература, театр и проч. – все сие, составлявшее ранее главное содержание и смысл моего бытия, бледнело и стало казаться несерьезным делом, чисто детской забавой. И это было нелегким для меня: временами, в первый период, я бывал мучительно раздираем между двумя центрами: страсть живописца и молитва. Так – доколе молитва не победила всех иных действий в мире сем. Есть только одно задание: найти истинного Бога, т.е. Творца всяческого бытия, и вечно жить слитно с Ним.'
          cn: 我将笼罩我的绝望称为一份从上而来的伟大恩赐。然而，直到三十年的劳作之后——或许更久——我才意识到这一点。我没有向人寻求帮助，因为我被它卷动，如同被风席卷的枯叶；它将我卷动，不让我明白在我身上所发生之事的意义；我什么都不明白；我无法询问任何人，因为我甚至无法形成一个问题。宇宙性的实有在我的心智中汹涌地展开，其速度之快，使我的理智无法停留在任何事物上。这就像是疯狂，但属于一种特殊的秩序，不属于精神科医生能力范围之内。我开始了一个脱离世界的过程。有什么东西横亘在我与人之间：我失去了与他们交流的兴趣：接触点一个接一个地消失了。艺术世界：绘画、音乐、诗歌、文学、戏剧等等——所有这些，曾是我存在的主要内容与意义，都黯然失色，并开始显得不严肃，纯粹是孩童的玩乐。这对我来说并不容易：有时，在初期，我曾被痛苦地撕扯于两个中心之间：一位画家的热情与祷告。如此——直到祷告战胜了在此世所有其他的行为。只有一个任务：找到真正的上帝，亦即一切实有的创造者，并永远与祂融为一体。
      - type: paragraph
        text:
          ru: 'Не безумно ли подобное дерзание для такого человечка, как я? С Богом вовсе не легко и не просто: Он слишком велик для нас. Он – «Огнь поядающий», Он – Свет неприступный. Он бросил Свой Огонь на нашу землю и пожигает наши сердца. С другой стороны, и я – дело Его рук. Он облекся в нашу плоть, чтобы чрез сей экран мы могли бы взирать на Него. Отсюда надежда, идущая далее всякой безнадежности."Дерзайте", – сказал он (ср.:Ин. 16, 33). Думаю, что появление внутри нас сего огня – есть пришествие дыхания Божией вечности в нас. К тому же:«У Бога не останется бессильным никакое слово... и блаженна уверовавшая; потому что совершится сказанное ей от Господа»(Лк. 1, 37, 45).'
          cn: 对于像我这样的小人物，如此的胆敢岂非愚妄之举吗？与上帝同行绝非易事，亦非简单：祂对我们而言过于伟大。祂是『焚烧的烈火』，祂是不可接近的光。祂将祂的火投在我们的地上，焚烧我们的心。另一方面，我亦是祂手中的工作。祂取了我们的肉身，为要借着这屏幕，我们得以仰望祂。由此生发希望，超越一切绝望。『你们要壮胆！』祂说（约翰福音 16:33）。我想，这火在我们里面出现，就是上帝永恒气息降临在我们里面。此外：『在上帝那里，没有一句话是无能的……福哉那信了的人，因为主对她所说的话，都要实现！』（路加福音 1:37，45）。
      - type: paragraph
        text:
          ru: Познав на самом себе превратность нашего естества, я живу неизменно в страхе. Сей страх именуется Божиим. Он не похож на страх животный; в нем самом заключена и премудрость, и ведение, и любовь, и сила. Но встреча с великим Богом, Которого мы не в силах вместить, и Которого мы не можем не любить, дает нам сознавать, что мы еще неописуемо далеки от того, что поставлено пред нами как святая цель и смысл всего нашего бытия.
          cn: 亲身认识到我们本性的乖僻，我始终生活在惧怕中。这惧怕被称为上帝的。它不像动物般的惧怕；在它本身之内蕴含着智慧、明达、爱与力量。然而，与伟大的上帝相遇，我们无法容纳祂，我们无法不爱祂，这使我们意识到，我们仍然难以言喻地远离那摆在我们面前的、作为神圣目标和我们整个存在意义的一切。
      - type: paragraph
        text:
          ru: 'Петр, по Тайной Вечери, с пафосом сказал:«Если и все соблазнятся о Тебе, я никогда не соблазнюсь». Все мы знаем, что последовало весьма скоро после сего исповедания:«И вспомнил Петр слово, сказанное ему Иисусом: прежде нежели пропоет петух, трижды отречешься от Меня. И, вышед вон, плакал горько»(Мф. 26:33, 75).'
          cn: 彼得在最后的晚餐之后，慷慨激昂地说：「即使所有人都因祢跌倒，我也绝不会跌倒。」我们都知道，在这番表白之后，很快就发生了什么事：「彼得想起耶稣对他说的话：鸡叫以先，你要三次不认我。他就出去，痛哭。」（马太福音 26:33，75）
      - type: paragraph
        text:
          ru: Писано:«Совершенная любовь изгоняет страх... Боящийся не совершен в любви»(1Ин. 4, 18). Я знаю, что я не совершен в любви, но это не устраняет того факта, что и я люблю Бога. И вот, именно сия любовь порождает во мне страх пребывать недостойным ответа. Сокрушаются кости мои, когда вижу внутри себя хотя бы малые колебания. Не помню, чтобы в течение моей жизни на Афоне сомнение приближалось к моему уму или сердцу. Однако, когда я возвратился в Европу, тогда, соприкасаясь с людьми иного духа, я испытал исходящую от них энергию, которая, подобно холодному ветру, неприятно ощупывала сердце и как-то смущала ум. Чуждая Духу Христову, она на какой-то момент нарушает внутренний мир, вызывает ум на некую борьбу. Познанное мною по дару Свыше в молитве любви в пустыне преодолевало встречные негативные влияния:«закон духа жизни во Христе Иисусе освободил (и) меня от«власти духа мира сего» (ср.:Рим. 8, 2).
          cn: 经上记着说：「完美的爱驱除惧怕...惧怕的人在爱里未臻完美」（约翰一书 4:18）。我知道我在爱里未臻完美，但这并不抹煞我也爱上帝的事实。然而，正是这份爱在我心中产生了惧怕，惧怕自己不配蒙受回应。我心骨为之碎裂，当我察觉到自己内心哪怕是丝毫的动摇时。我不记得在我阿索斯山的生活中，怀疑曾靠近我的思想或心灵。然而，当我回到欧洲时，接触到那些异于我灵的人们，我感受到一股从他们身上散发出的能量，这股能量如同寒风，令人不适地触碰着我的心，并在某种程度上搅扰了我的思想。这股能量与基督的圣灵格格不入，它在一时之间扰乱了内心的平安，并引发思想进行一场争战。我籍着至高者的恩赐，在旷野中爱之祈祷里所领悟的，克服了迎面而来的负面影响：「基督耶稣里生命圣灵的律法也使我从这世俗之灵的权势中得了释放」（参阅罗马书 8:2）。
      - type: paragraph
        text:
          ru: Петр восстал; но могу ли я быть уверенным в себе? Пока сердце ощущает присутствие Бога, мы в мире и в восхищении от любви к Нему. Но когда Он отступает Своим ощутимым действием, то снова сознание немощи моей до боли опечаливает меня. Крестный подвиг в той или иной мере до старости сопровождает меня. Мне кажется, что я познал меру человека; и это знание дает мне свободу при встречах с кем бы то ни было. Но в прошлом познал я и встречи с иными силами, безмерно могущественными для моего ничтожества. В те жуткие времена спасало меня Имя Христа Иисуса. Молюсь, да будет со мною так же даже до конца, и без конца. В часы промыслительной богооставленности возбуждается внутри нас пламенная молитва, и в ее объятиях дух с радостью усматривает свое родство со Христом и уподобление Ему возрастает. ГОСПОДЬ сотворил нас по образу Своему; следовательно, и мы в Нем становимся «господами». Утверждаемые Его силою – мы созерцаем всякого рода зло в тварном мире, но оно, зло, теряет власть над нами. В этом наше «господство», необходимое для «непоколебимого Царства».
          cn: 彼得曾失足；但我岂能确信自己？只要内心感受到上帝的同在，我们便安享平安，并因对祂的爱而欢欣赞叹。但当祂以其可感知的作为隐退时，我的软弱意识便再次使我悲痛不已。十字架的苦修或多或少地伴随我直至年迈。我似乎已经认识到人的尺度；而这知识使我在与任何人相遇时都感到自由。但在过去，我也曾遭遇其他势力，对我这微不足道的存在而言，它们是无限强大的。在那些可怖的时刻，是基督耶稣的圣名拯救了我。我祈祷，愿祂也如此与我同在，直到终结，并永无止境。在按着天意被上帝离弃的时刻，我们内心便燃起炽热的祷告，在祷告的怀抱中，人的灵便欣然洞察自己与基督的亲缘关系，并日益肖似于祂。上主照着祂的形象创造了我们；因此，我们也在祂里面成为「主宰」。蒙祂大能所坚固的我们，便能默观受造界中各式各样的邪恶，但这邪恶，却失去了辖制我们的权柄。这便是我们的「主宰之权」，是「那不可动摇之国」所必需的。
      - type: paragraph
        text:
          ru: «Еще раз поколеблю не только землю, но и небо». Слова «еще раз» означают изменение колеблемого, как сотворенного, чтобы пребыло непоколебимое»(Евр. 12:26–27). Недоведомо нам, какому последнему испытанию подвергнется вся тварь. Необходим нам благоговейный страх, доколе не пройдем все тварные пороги и не преисполнимся нисходящею от Бога нетварною жизнью.
          cn: 「『再一次震动，不但是地，连天也要震动。』『再一次』这些话，是指明被震动的、作为受造之物将要改变，好使那不可震动的得以存留。」(希伯来书 12:26-27) 我们不知道，整个受造物将经受怎样的最后考验。我们必须怀有敬畏之惧，直到我们跨越所有的受造门槛，并且被从上帝而降的非受造生命充满。
      - type: paragraph
        text:
          ru: 'Христос-Бог беспределен в Своем могуществе: Дух Его наполняет все бездны. Но и в Своем «истощании» Он также недостижим для нас. Когда в безвидном молчании мы предстоим Богу, в полном обнажении совокупности нашего бытия, тогда глубины нашей природы раскрываются и для нас самих. Чрез всецелую сосредоточенность – СТЯНУТОСТЬ всего вовнутрь нашей личности – дается нам увидеть, что бытие всего человечества в истоках своих и по природе своей – есть ЕДИНОЕ БЫТИЕ, ЕДИНЫЙ ЧЕЛОВЕК. Отсюда «естественное» движение нашего духа к молитве за всех людей, за ВСЕГО АДАМА, как за самого себя. Отсюда же приходит уразумение слов Христа:«да будут (все) едино, как Мы едино»(см.:Ин. 17:21–23).'
          cn: 基督上帝在祂的能力中是无限的：祂的圣灵充满一切深渊。但在祂的「虚己」中，对我们而言祂同样是无法企及的。当我们在无形无相的寂静中侍立于上帝面前，在我们存在之整体的全然裸呈之中，我们本性的深处也向我们自己显露。通过全然的专注——万物内敛于我们的位格之中——我们得以看见，全人类在其根源和本性上的存在，是同一的存在，是同一的人。由此，我们灵性中「自然」的律动导向为所有人的祈祷，为那全然的亚当祈祷，如同为自己一样。由此我们也领悟了基督的话语：「愿（他们）都合而为一，正如我们合而为一」（参阅：约翰福音 17:21-23）。
      - type: paragraph
        text:
          ru: 'В покаянной молитве за свои грехи мы научаемся переживать трагедию всего человечества чрез самих себя. Если я так болезную всем моим существом в силу моих всякого рода срывов на каждом шагу, – если за всеми моими падениями скрывается изначальное падение в лице Праотца нашего, оторвавшее все человечество от Бога и Отца нашего, то нормально мне в личных моих страданиях познавать бытийно страдания всех людей. Но возможно и обратное: в моей радости – увидеть радости всего мира. Так научается христианин сострадать всем страждущим, сорадоваться всем радующимся.'
          cn: 在为自己的罪作忏悔祷告时，我们学习到通过我们自己来体验全人类的悲剧。如果我因我每一步的各种跌倒，而令我整个身心都如此痛苦，——如果在我所有的跌倒背后，隐藏着我们原祖身上的那最初的堕落，那堕落使全人类与我们的上帝和父断绝了关系，那么对我而言，在我个人的苦难中，在本体上认识所有人的苦难是自然的。但反过来也是可能的：在我的喜乐中，看见全世界的喜乐。基督徒就这样学会了怜悯所有受苦的人，与所有喜乐的人一同喜乐。
      - type: paragraph
        text:
          ru: 'Если грех в своей глубинной сущности есть всегда преступление против любви Отчей, то полное восстановление погубленной любви возможно не иначе, как чрез тотальное покаяние, которое раскрыло бы нам до конца, если возможно, что сие преступление значит, когда мы его берем в плане вечности. «Отче Благий, исцели меня, прокаженного; обнови меня, растленного грехом... Отче Святый, всего меня освяти: и ум, и сердце, и самое тело мое... я согрешил пред Тобою, и ныне умираю вдали от Тебя... прими меня по множеству сострадания Твоего и милосердия Твоего».'
          cn: '如果罪在其深层本质上总是对父爱的冒犯，那么，所失之爱的完全复原，唯有通过彻底的悔改方能实现。这悔改将——如果可能的话——向我们彻底揭示，当我们从永恒的视角审视这罪行时，它究竟意味着什么。


            「仁慈的父啊，医治我这麻风病者；更新我这为罪所败坏者……圣父啊，圣化我全身：包括我的心智、我的心，甚至我这身体本身……我在祢面前犯了罪，如今却远离祢而死……求祢按着祢丰盛的怜悯和慈悲接纳我。」'
      - type: paragraph
        text:
          ru: '«Иисус сказал ему: столько времени Я с вами, и ты не знаешь Меня, Филипп?»(Ин. 14:9). Мария Магдалина –«обратилась назад и увидела Иисуса стоящего, но не узнала, что это Иисус. Иисус говорит ей: жена! что плачешь? кого ищешь? Она, думая, что это садовник, говорит ему: господин! если ты вынес Его, скажи мне, где ты положил Его, и я возьму Его. Иисус говорит ей: Мария! Она, обратившись, говорит Ему: Раввуни!»(Ин. 20, 14–16). Лука и Клеопа на пути в Эммаус не узнали в приблизившемся к ним Иисуса, и только когда Он«преломил... хлеб»и подал им,«открылись у них глаза и они узнали Его»(Лк. 24, 13). Так нечто подобное может произойти и с нами: Он приблизится к нам, Он будет беседовать с нами, и мы«не узнаем Его», т.е. того, что это есть Он, великий Бог; великий, но кроткий и невыразимо смиренный. И когда наступит момент и мы УЗНАЕМ Его, тогда душа наша возлюбит Его, почерпнутое из сего познания вдохновение преисполнит нас до блаженства. И познанное таким образом вдохновение уже никогда нас не покинет. Мы сможем бывать в различных испытаниях и болезненных состояниях, но оно, сие дивное вдохновение, всегда будет с нами: иногда как тихий мир, иногда как палящее пламя, иногда как наплыв светоносных мыслей, иногда как радостный плач в молитве.'
          cn: «耶稣对他说：我与你们同在这么久了，你还不认识我吗，腓力？»(约翰福音 14:9)。抹大拉的马利亚——«转过身来，看见耶稣站着，却不知道是耶稣。耶稣对她说：妇人！你为什么哭？你找谁呢？她以为是园丁，就对他说：先生！如果你把祂搬走了，请告诉我你把祂放在哪里了，我好去取祂。耶稣对她说：马利亚！她转过身来，对祂说：拉波尼！»(约翰福音 20:14-16)。路加和革流巴在往以马忤斯的路上，没有认出走近他们的耶稣，直到祂«掰开...饼»并递给他们，«他们的眼睛就开了，他们才认出祂来»(路加福音 24:13)。同样的事情也可能发生在我们身上：祂会靠近我们，祂会与我们交谈，而我们«认不出祂»，也就是说，不知道那是祂，那位伟大的上帝；祂是伟大的，却是温柔且难以言喻地谦卑的。当那一刻来临，我们认出祂时，那时我们的灵魂就会爱慕祂，从这认识中汲取到的灵感将充满我们，直至进入福乐。这以这种方式被认识到的灵感将永远不会离开我们。我们可能会经历各种试炼和痛苦的状态，但它，这奇妙的灵感，将永远与我们同在：有时如宁静的平安，有时如炽热的火焰，有时如涌现的光明思想，有时如祷告中喜乐的哭泣。
      - type: paragraph
        text:
          ru: И многое сему подобное, но чему нет во всем мире подобного, кроме того, что лишь от Него Единого исходит.
          cn: 以及许多与此相仿之事，但在全世界，都找不到与之相仿的，除了那唯独从祂而来者。
  - type: heading2
    text:
      ru: Молитва преодолевает трагизм
      cn: 祷告克服悲剧性
    children:
    - type: paragraph
      text:
        ru: 'С понятием трагедии я впервые встретился в мои юные годы не из опыта жизни, а из чтения книг. Мое представление тогда было таковым: пред умом человека открывается нечто, влекущее его всецело. В былые времена предмет влечения называли «идеалом». Для достижения интуитивно восхищенного – человек решается на всякий труд, на все страдания, вплоть до риска самою жизнью. Однако, когда бывает достигнут предмет искания, тогда обнаруживается жестокий обман: реальность не соответствует тому, что предносилось уму, и естественно следующее за сим разочарование оскорбленного духа приводит к тяжелой, а часто и уродливой смерти.'
        cn: 我在年少时首次接触到悲剧的概念，并非来自生活经验，而是来自阅读书籍。我那时的理解是这样的：在人的心智面前，呈现出某种事物，全然地吸引着他。在过去，这种吸引之物被称作「理想」。为了达到那个直觉上令人神往之物，人决定承担一切劳苦、承受一切苦难，甚至冒着生命的危险。然而，当所寻求之物被达到时，便会发现残酷的欺骗：现实与心智所预示的不符，随之而来的，受辱灵魂的自然失望导致沉重，且往往是丑陋的死亡。
    - type: paragraph
      text:
        ru: 'Различные идеалы предстают сильным людям. Часто это есть притязания на высшую власть. Так было с Борисом Годуновым. В борьбе за реализацию сокровенного желания и он, подобно множеству предшественников в истекших веках, не избежал кровавого преступления. Достигнув же своей цели, он увидел, что не получил того, чего ожидал: «Достиг я высшей власти... но счастья нет моей душе».'
        cn: 不同的理想呈现在强大的人面前。常常这就是对最高权力的觊觎。鲍里斯·戈东诺夫亦是如此。在实现其夙愿的斗争中，他也犹如数世纪以来他的众多先辈一样，未能免于流血的罪行。然而，当他达到自己的目标时，他发现他并未得到他所期望的一切：「我已达到了最高权力......但我的灵魂却没有幸福。」
    - type: paragraph
      text:
        ru: Иные искания – в плане духа, искусства или науки – более благородны. Гению открываются умные видения, которых он не сможет реализовать, ибо они превосходят меру достижимого в сем мире. Убедившись в своей недостаточности осуществить в совершенстве свое инициальное видение, ставшее единственным смыслом его бытия, он претерпевает глубокий надлом в духе и погибает. Особенно часто сей вид роковой развязки наблюдается у поэтов.
        cn: 其他的追求——在灵性、艺术或科学方面——更为崇高。智慧的异象向天才敞开，但他却无法将其实现，因为它们超越了此世可达成的界限。当他确信自己无力完美地实现他最初的异象——那已成为他存在的唯一意义——时，他便在灵性上遭受深刻的崩溃，并因此消亡。这种致命的结局尤其常在诗人身上可见。
    - type: paragraph
      text:
        ru: Не без трепета наблюдал я, и наблюдаю еще, судьбы мира. Человеческая жизнь, на каком бы уровне мы ее ни взяли, трагична в своих проявлениях. Даже любовь полна острых противоречий и нередко фатальных кризисов. Так, на всяком земном явлении от самого зарождения положена печать разложения.
        cn: 我曾不无战兢地观察，至今仍在观察世界的命运。人的生命，无论我们从何种层面来看，就其表现而言，都是悲剧性的。甚至爱情也充满尖锐的矛盾，并常常伴随着致命的危机。可见，在一切属世的现象上，从其萌芽之时，就被盖上了腐朽的印记。
    - type: paragraph
      text:
        ru: 'Я был еще молодым (18), когда на мою долю выпало переживать исторические события, трагизм которых превзошел все, что я встретил в книгах: говорю о первой мировой войне и последовавшей за нею (в России) социальной революции, со всеми ужасами, связанными с подобными предприятиями. Жуткая картина – обвал большой империи. Жестка схватка и беспощадна, когда «труждающиеся и обремененные» в своем отчаянии решаются на борьбу за свои права и достоинство. Я жил в самой гуще страданий многомиллионных масс: начался длительный «смертельный бой».'
        cn: 我当时还很年轻（18岁），却遭遇了历史事件，其悲剧性超越了我所有在书中读到的：我指的是第一次世界大战以及随之而来的（在俄罗斯）社会革命，以及与此类事业相关的一切恐怖。那是一幅可怕的景象——一个大帝国的崩塌。当「劳苦担重担之人」在绝望中决定为自己的权利和尊严而斗争时，这场搏斗既残酷又无情。我就生活在数百万民众苦难的中心：一场漫长的「殊死搏斗」开始了。
    - type: paragraph
      text:
        ru: 'Параллельно с этим во мне самом рушились юношеские мечты и надежды, что странным образом соединилось с новым углубленным разумением смысла бытия вообще. Умирание и гибель слились с возрождением. Бытие грандиозно в своих корнях и безмерно величественно в своих целях. Если стремимся мы к интегральному познанию всего существующего, если мы в глубинах нашего сознания не теряем из виду Бытия Абсолютного, то дух наш склонится к принятию всего происходящего в тварном космическом бытии. Создатель мира сего – вечно живет. Он в основе нашего бытия, и Его сила достаточна, чтобы воскресить нас по смерти нашей. Но опыт смерти нам нужен, чтобы мы знали, что мы вызваны волею Отца Небесного из «ничто». Самопознание необходимо нам, чтобы всякий шаг наш совершался в согласии с подлинным, непоколебимым Бытием. О, сие нелегко, непросто: сотни раз приблизится к нам огонь ужаса, все внутри нас сожмется от крайней боли. Но Он – победил и нас зовет следовать за Ним. Следуя за Ним, мы, конечно, на каждом этапе испытаем свойственную ему, этапу, муку. Дух наш возмутится страхом, и в мыслях наших мы, возможно, вступим с Ним в спор, слагая на Него вину всех страданий. Нам нужна твердая вера, чтобы не отпасть от Него. Но если ночь нашего неведения была пронизана сверканием молнии хотя бы однажды; если при свете сей божественной молнии в душу запало решение: или с Ним, в Его Абсолютности, или лучше смерть совершенная – среднего нет – то, возможно, и нам дастся радость победы вечной.'
        cn: 与此同时，我内在的少年梦想与希望也随之崩塌，这以一种奇特的方式与对存在意义的全新、深刻的理解结合起来。死亡与毁灭与重生融为一体。存在在其根源中是宏伟的，在其目的中是无限庄严的。如果我们致力于对一切现有事物的整合性认知，如果我们意识深处不曾将绝对存在（Absolute Being）忘却，那么我们的心灵就会倾向于接受受造宇宙存在（created cosmic being）中所发生的一切。这个世界的创造者——永恒地活着。祂是我们存在的根基，祂的力量足以在我们死后使我们复活。但死亡的经历对我们而言是必需的，好让我们知道，我们是因着天父的旨意从「虚无」中被召唤出来的。自我认知对我们是必要的，好使我们每一步的行动都与真实、不可动摇的存在相一致。哦，这绝非易事，绝不简单：恐惧之火将数百次临近我们，我们内在的一切将因极度的痛苦而收缩。但祂——已经得胜，并呼召我们跟随祂。跟随祂，我们当然会在每个阶段都经历该阶段固有的痛苦。我们的心灵会因恐惧而骚动，在我们的思想中，我们或许会与祂争辩，将一切苦难的罪过归咎于祂。我们需要坚定的信心，以免从祂那里跌落。但如果我们的无知之夜至少曾一次被闪电的光芒穿透；如果在这神圣闪电的光照下，一个决定已深植于灵魂：要么与祂同在，在祂的绝对性之中，要么不如完全的死亡——没有中间选择——那么，或许我们也会被赐予永恒胜利的喜乐。
    - type: paragraph
      text:
        ru: 'Если Отец Небесный привлек нас к Сыну Своему Единородному и Собезначальному, показав нам хотя бы в меру нашей тесной восприимчивости абиссальную мудрость Слова-Логоса Своего и неприступную высоту Любви Его, то мы увидим, что в Боге нет трагедии. Сия последняя наличествует только в судьбах людей, идеал которых не перешел земных границ. Христос – вовсе не трагический тип. Его всекосмическим страданиям также чужд сей элемент. Любовь Христа во все времена Его пребывания с нами на земле была многострадальною:«О, род неверный и развращенный! доколе буду с вами? доколе буду терпеть вас?»(Мф. 17, 17). О Лазаре и его сестрах Он плакал (Ин. 11, 35); скорбел Он о жестокосердии иудеев, избивающих пророков (Мф. 23и далее); в Гефсимании душа Его"скорбеладажедо смерти", и«пот Его был, как капли крови, падающие на землю»(Мф. 26, 38;Лк. 22, 44). Он жил трагедию всего человечества, но не в Нем Самом пребывала она. Это ясно из Его слов, которые сказал Он Своим ученикам за, быть может, короткий час до Гефсиманской мироискупительной молитвы:«Мир Мой даю вам»(Ин. 14, 27). И еще:«Я не один, потому что Отец со Мною. Сие сказал Я вам, чтобы вы имели во Мне мир. В мире скорбны будете, но мужайтесь: Я победил мир»(Ин. 16:32–33). И опять за несколько недель до Голгофы:«Иисус начал открывать ученикам Своим, что Ему должно идти в Иерусалим, и много пострадать... и быть убиту, и в третий день ВОСКРЕСНУТЬ»(Мф. 16, 21). И снова:«Не плачьте обо Мне, но плачьте о себе и о детях ваших»(Лк. 23, 28). Не в Нем трагизм, а в нас.'
        cn: 如果天父吸引我们归向祂的独生子，那与祂同始同终的圣子，向我们显明（即使是按我们狭隘的领受能力而言）祂圣言（逻各斯）那深邃的智慧和祂那高不可攀的爱，那么我们就会明白，在上帝那里没有悲剧。这悲剧只存在于那些理想未曾超越尘世界限的人的命运之中。基督绝非悲剧性的人物。祂那普世的苦难也远离这个元素。基督的爱在祂与我们同在世间的所有时间里，是多苦多难的：「嗐，这又不信又悖谬的世代啊！我与你们同在要到几时呢？我忍受你们要到几时呢？」(马太福音 17:17)。祂为拉撒路和他的姐妹哭泣(约翰福音 11:35)；祂为犹太人的铁石心肠，为那些杀害先知的人而忧伤(马太福音 23及以后)；在客西马尼，祂的灵魂「忧伤以至于死」，而「汗珠如大血点滴在地上」(马太福音 26:38，路加福音 22:44)。祂活出了全人类的悲剧，但悲剧并不存在于祂自身之内。这从祂的话语中显而易见，祂也许是在客西马尼那救赎世界的祷告前短暂的一小时，对祂的门徒们说：「我将我的平安赐给你们」(约翰福音 14:27)。又说：「我不是独自一人，因为父与我同在。我对你们说这些事，是要叫你们在我里面有平安。在世上你们有苦难，但你们可以放心，我已经胜了世界。」(约翰福音 16:32-33)。此外，在各各他之前几周：「耶稣开始向祂的门徒们显明，祂必须往耶路撒冷去，受许多的苦……并且被杀，第三日 复活。」(马太福音 16:21)。还有：「不要为我哭泣，要为你们自己和你们的儿女哭泣」(路加福音 23:28)。悲剧不在于祂，而在于我们。
    - type: paragraph
      text:
        ru: Подобно сему и христианин, получивший дар любви Христовой, при всем сознании еще не достигнутой полноты, избегает трагизма всепоглощающей смерти; в болезненном сострадании и плаче в молитве за мир он не становится жертвой безысходного отчаяния безвозвратной гибели. Более ясным бывает видение – когда молитва каким бы то ни было образом войдет в вековой поток Гефсиманской
        cn: 照样，基督徒，尽管完全意识到尚未达到圆满，但领受了基督之爱恩赐的，便避免了吞噬一切之死亡的悲剧性；他在为世界祈祷时的痛苦怜悯和哀哭中，也不会成为无可挽回之灭亡的绝望受害者。异象会变得更为清晰——当祷告以任何方式进入客西马尼的永恒洪流时
    - type: paragraph
      text:
        ru: 'И странно, и горестно: мир в массе своей не принимает Духа Божия, и молитва возвращается к молящемуся не только с чувством безрезультатности, но еще и с умноженной скорбью. Но это, конечно, неверное ощущение. Да, искомого изменения духовной атмосферы вселенной не произошло, но если бы не было молящихся, то«власть тьмы»(Лк. 22, 53) усиливалась бы с еще большей динамикой.'
        cn: 这既是奇特的，也是悲苦的：世人总体上不领受圣灵，祷告回到祈祷者身上，不仅带着徒劳无功的感觉，甚至还带着倍增的忧伤。但这当然是一种错误的感受。诚然，宇宙属灵气氛所寻求的改变并未发生，但若没有祈祷者，那么「黑暗的权势」（路加福音 22:53）便会以更强的势头增强。
    - type: paragraph
      text:
        ru: 'Те, что еще не имели описанного опыта с силою, легко все же поймут меня, если молились за мир или отдельных дорогих им людей, вдохновленные Богом. Сердце при такой молитве, часто быстро, входит в самую жизнь того или тех, за кого молится, и знает, что с ними. Это: или радость и покой, или тревога и печаль, иногда же жуткий мрак ада, и подобное сему зло. Молящийся ощущает сии состояния, как его собственные. И это своего рода аберрация: в действительности чрез молитву душа видит-живет-сливается с теми, о ком молитва. Если при этом испытываемое нами тягостное чувство прелагается на радость или успокоение, то это верный знак, что молитва наша была услышана: больной будет поправляться, отчаянный получит свет надежды, грозившая беда минует, и подобное.'
        cn: 那些尚未有过所述与那力量相关体验的人，如果他们曾受上帝启示，为世界或个别所爱之人祷告，便会容易理解我。在这样的祷告中，心灵常常迅速地进入到他或他们（为之祷告之人）的生命深处，并知晓他们的境况。这境况或是喜乐与平安，或是焦虑与忧伤，有时甚至是地狱般的可怕黑暗，以及诸如此类的恶。祷告者感受到这些状态，仿佛是他自己的。这是一种偏差：实际上，通过祷告，灵魂看见-活出-融合于那些被祷告之人。如果在此过程中，我们所经历的沉重感受转变为喜乐或平静，那么这就是一个确凿的迹象，表明我们的祷告已被垂听：病人将会康复，绝望者将获得希望之光，逼近的灾祸将消弭，等等。
    - type: paragraph
      text:
        ru: 'Именно таковое общение в бытии с людьми и даже вообще мира сего свойственно подлинной молитве. Охват происходящего в мире может возрастать до убегающих от определения широт. Жизнь молящегося духа – может, да и должна, получить космические измерения, которых требуют от нас евангельские заповеди Христа. В нем человек становится воистину универсальным: не в смысле философского синкретизма, а по объему и масштабности захвата реального бытия; по приближению к последним граням возможного живого опыта в духе.'
        cn: 正是这种在存有中与人、甚至与整个世界相通的特质，为真诚的祈祷所固有。祈祷对世间万象的涵盖，可以扩展到无法界定的广度。祈祷之灵的生命——可以，也理应——获得宇宙性的维度，这正是基督福音诫命对我们的要求。在此其中，人真正变得具有普世性：并非是在哲学融合主义的意义上，而是就其对真实存有的把握之广度与规模而言；就其在灵性中，逼近可能之活生生经验的极限而言。
    - type: paragraph
      text:
        ru: 'Один из случаев быстрого ответа на молитву я привожу в книге «Старец Силуан» (стр. 110). Сам блаженный старец сказал мне, что, по прочтении письма митрополита, он обратился к Господу и с первого же слова почувствовал в сердце мир и радость. Он, старец, сразу же ответил письмом, что «дочь этой женщины-матери жива и счастлива». Дальнейшие розыски подтвердили верность чувства старца. Сама дочь сказала посетившей ее женщине-иностранке: «Скажите маме, что я благополучна и счастлива с моим мужем. Но очень прошу маму не повторять подобного шага, чтобы не повредить мне и мужу». Это было в эпоху Сталина, когда всякий контакт с людьми из-за границы ставил лицо под подозрение и в опасность ссылки в Сибирь.'
        cn: 祷告蒙迅速应允的一个事例，我将其收录在《长老圣西卢安》一书（第110页）中。蒙福的长老本人告诉我，说他在读完总主教的信后，便向上主祷告，而就在祷告的第一句话中，他心中便感受到了平安与喜乐。他，长老，立刻回信说：「这位妇人-母亲的女儿活得好好的，很幸福。」随后的寻访证实了长老感觉的准确性。女儿本人告诉了探访她的外国妇人：「请告诉妈妈，我与丈夫过得很好，很幸福。但我恳请妈妈不要再采取类似的行动，以免给我和丈夫带来损害。」这事发生在斯大林时代，那时，任何与国外人士的接触都会使当事人遭受怀疑，并面临被流放至西伯利亚的危险。
    - type: paragraph
      text:
        ru: Опыт трагизма земных судеб нам необходим. Он показывает пределы наших тварных дарований в их отрыве от сотрудничества с Богом. Нормально после краха всех наших усилий и страданий раскрыться для новых горизонтов уже иного мира, неизмеримо высшего. Тогда вместо «рокового конца», в большинстве случаев гениев человечества, наступает благословенное начало, которое может явиться человеку как Свет Воскресения, как вхождение в нетленный мир, где нет места трагедии, ибо царит безначальная вечность.
        cn: 尘世命运的悲剧性经验对我们而言是必要的。它揭示了我们受造恩赐在脱离与上帝合作时所能达到的极限。在我们所有的努力和苦难崩塌之后，敞开迎接一个无可衡量地更高远、属于另一个世界的新境界，这是正常的。于是，取代了（在人类天才的绝大多数情况下出现的）「宿命的结局」，一个蒙福的开端随之而来。这开端可以向人显现为复活之光，显现为进入那不朽的世界，在那里悲剧没有容身之处，因为无始的永恒在那里掌权。
    - type: paragraph
      text:
        ru: Наш собственный опыт приводит к констатации того факта, что человечество в массе своей даже до сего дня не доросло до евангельского христианства. Отказываясь от Христа как Вечного Человека и прежде всего как Истинного Бога в какой бы то ни было форме, под каким бы то ни было предлогом, люди теряют Свет безначального Царства и славу богосыновства.«Отче! которых Ты дал Мне, хочу, чтобы там, где Я, и они были со мною, да видят славу Мою, которую Ты дал Мне, потому что возлюбил Меня прежде основания мира»(Ин. 17, 24). Те, кто прикоснулись к святому пламени любви Духа Святого, пребывают умом в Его, Духа Святого, Царстве, томясь жаждою стать достойными сынами его. Действием Духа Святого, от Отца исходящего, преодолевается грех отталкивания от любви Отчей, явленной нам чрез Сына (ср.:Ин. 8, 24). Ощутив Христа как Бога-Спасителя, мы духом восходим за грани времени и пространства; в ту форму бытия, к которой неприложимо понятие «трагедии».
        cn: 我们的亲身经验使我们不得不承认一个事实：大多数人类甚至直到今日，尚未成长到福音的基督信仰的程度。无论以何种形式、何种借口，当人们弃绝基督——这位永恒的人，以及首先是真上帝——时，他们便失去了无始之国的圣光和神子之荣。「父啊！祢所赐给我的人，我愿我在哪里，他们也同我在哪里，叫他们看见祢所赐给我的荣耀，因为在创立世界以前，祢就已经爱我了。」(约翰福音 17:24) 那些触及圣灵之爱的圣火的人，他们的心智安住在祂——圣灵的国度里，渴望成为这国度里配得的儿子。借着从父而出的圣灵的工作，我们克服了排斥天父之爱的罪，这爱是借着圣子向我们显明的（参阅 约翰福音 8:24）。 感受到基督是上帝——我们的救主，我们便在灵里超越了时间与空间的界限，进入一种「悲剧」的概念无法适用的存在形式。
  - type: heading2
    text:
      ru: О болезненной молитве, в которой рождается человек для вечности.
      cn: 论及痛苦的祷告，人在其中为永恒而诞生。
    children:
    - type: paragraph
      text:
        ru: 'Ныне по всей земле рассеяны люди, ищущие ответа на свои искания. Неутоленная духовная жажда многих – вот историческое событие истинно трагическое. Немало таких, которые стоят на грани отчаяния. Каждый из них в свою меру, в глубинах своего духа страдает от бессмысленности современной жизни. Безутешны они в горе своем: недостаточно своих индивидуальных усилий, чтобы высвободиться из охватившего мир смятения и остановить свой ум на самом важном (ср.:Лк. 10, 42).'
        cn: 如今，遍布全地散居着人们，他们正寻求自己所探求之事的答案。许多人未蒙满足的灵性饥渴——这乃是一个真正悲剧性的历史事件。处于绝望边缘的人为数不少。他们每一个人，都在各自的程度上，在他们灵性的深处，遭受着现代生活虚妄性之苦。他们在他们的悲痛中无法得慰藉：他们个人的努力不足以摆脱弥漫世界的混乱，也无法使他们的心神专注于最要紧的事上（路加福音 10:42）。
    - type: paragraph
      text:
        ru: 'Нашу эпоху некоторые склоняются характеризовать как похристианскую. Я же лично, в пределах моих познаний истории мира и христианства, убеждаюсь, что христианство, в его подлинных измерениях, еще никогда не было воспринято широкими массами, как должно. Государства претендовали на именование «христианские», и народы их носили маску благочестия,«силы же его отреклись»(2Тим. 3, 5): жили и живут по-язычески. Как ни странно, но именно христианские государства веками держат большую часть вселенной в железных тисках рабства; в последние же годы окутали мир мрачною тучею ожидания апокалиптического огня:«нынешние небеса и земля... сберегаются огню на день суда и погибели нечестивых человеков»(2Петр. 3, 7;Лк. 21, 34–35).'
        cn: 我们的时代，有些人倾向于将其描述为后基督教时代。而我个人，在我对世界历史和基督教的认知范围内，确信基督教，在其真实的层面，从未如其本应被广泛大众所接受。许多国家声称自己是「基督教」国家，其国民也戴着虔诚的面具，「却弃绝了它的实意」（提摩太后书 3:5）：过去和现在都以异教徒的方式生活。奇怪的是，恰恰是那些基督教国家，几个世纪以来，将大部分世界束缚在奴役的铁钳之中；而在近年，又以一种期待默示录之火的阴霾乌云笼罩了世界：「现在的诸天和地……被留存，待火焚烧，直到不虔敬之人受审判和灭亡之日」（彼得后书 3:7，路加福音 21:34-35）。
    - type: paragraph
      text:
        ru: В современном кризисе христианства среди народных масс вполне оправдано усмотреть бунт естественной совести против тех извращений, которым подверглось евангельское учение в его исторических судьбах.
        cn: 在当代的基督教危机中，在普通大众中，完全有理由将其视为自然良知对福音教义在其历史命运中所遭受的那些扭曲的一种反叛。
    - type: paragraph
      text:
        ru: 'Мы снова живем в атмосфере первых веков нашей эры: нам«дано ради Христа не только веровать в Него, но и страдать за Него»(Фил. 1, 29). Не раз приходила ко мне радость при мысли, что моя жизнь в ее главной части совпала с гонениями на христианство: это дает мне острее ощущать себя христианином, осознавать ни с чем несравнимую честь в подобные времена следовать за Единородным Сыном Отца в Его шествии на Голгофу. Гонения повсюду, но в различных формах. Однако ни одна из них не легка. Да избавит Бог любви всякую душу от бедствия быть гонителем хотя бы по отношению к«единому от малых сих»(Мф. 18, 10).'
        cn: 我们再次生活在公元最初几个世纪的氛围中：我们「蒙恩不单是得以信服祂，更是得以为主受苦」(腓立比书 1:29)。我曾不止一次地感到喜悦，一想到我的生命，在其主要部分，与对基督教的迫害相吻合：这使我更敏锐地感受到自己是基督徒，意识到在这样的时代，追随父的独生子，踏上祂前往各各他的征途，是一种无可比拟的荣耀。迫害无处不在，但形式各异。然而，没有一种是轻松的。愿爱之上帝拯救每一个灵魂，脱离成为迫害者的灾祸，即使是对「这小子里的一个」而言(马太福音 18:10)。
    - type: paragraph
      text:
        ru: 'В «страдании за Него» заключается особое благословение и даже избрание: страждущий самим ходом внешних обстоятельств ставится в непрестанную связь с Иисусом Христом, – вводится в сферу Божией любви, – ставится богоносцем. Есть два вида богословия: один – широко знакомый в истекших веках: профессиональная кафедра эрудита; другой – быть сораспятым со Христом (см.:1Петр. 4, 13;Рим. 8, 17;2Тим. 2, 11–12;Фил. 3, 10;Откр. 1, 9и др.), – знать Его в тайниках сердца. Первый из сих двух видов доступен множеству интеллектуально одаренных в порядке философского предпочтения. Действительная вера в Божество Христа, выражающаяся в жизни по духу заповедей Его, при этом не обязательна. Второй – есть богословие исповедничества, рожденного глубоким страхом Божиим в огне пламенного покаяния, вводящего в бытийную реальность явлением Нетварного Света. Школьное богословие в соединении с живой верою – дает благие результаты. Но оно легко «вырождается», становится отвлеченной теорией, перестает быть тем, что наблюдается в жизни апостолов, пророков, отец наших, т.е. прямым действием Бога в нас:«Никто не может прийти ко Мне, если не привлечет его Отец, пославший Меня... У пророков написано: и будут все научены Богом»(Ин. 6, 44–45).«Всякий, слышавший (в сердце) от Отца и научившийся, приходит ко Мне».'
        cn: 「为祂受苦」蕴含着特殊的福佑，甚至是一种拣选：受苦者借由外在环境的进程本身，被置于与耶稣基督不间断的联结中，被引入上帝之爱的领域，成为「负神者」。神学有两种：一种是过去数世纪中广为人知的，即学识渊博者的专业教席；另一种是与基督同钉十字架（参：彼得前书 4:13，罗马书 8:17，提摩太后书 2:11-12，腓立比书 3:10，启示录 1:9及其他），在内心深处认识祂。这两种中的第一种，对许多在智力上天赋异禀者而言，以哲学偏好的方式是可及的。对基督神性的真实信仰，即在依照祂诫命的精神而活的生活中体现出来的信仰，在此并非必需。第二种是认信的神学，它源于对上帝的深刻敬畏，在炽热悔改的烈火中诞生，借由非受造之光的显现，将人引入本体性实相中。学院派神学若与活泼的信仰相结合，会带来美好的果效。但它容易「退化」，变成抽象的理论，不再是我们在使徒、先知和我们的教父们生命中所观察到的，也就是说，不再是上帝在我们里面直接的作为：「没有人能到我这里来，除非差我来的父吸引他……在先知书中写着：他们都要蒙上帝的教训」（约翰福音 6:44-45）。「凡听见（在心中）父的教训又学习的，都到我这里来。」
    - type: paragraph
      text:
        ru: 'Святая Троица есть Бог Любви. Любовь, о которой говорится в Евангелии, есть нетварная жизненная энергия Божества безначального. Свойство ее, любви, соединять в самом бытии. Пребывающий в таком единстве с Богом постепенно прогрессирует в умном осознании происходящего с ним.«А нам Бог открыл ведение (о Нем) Духом Своим: ибо Дух все проницает, и глубины Божии... мы приняли не духа мира сего, а Духа от Бога, дабы знать дарованное нам от Бога: что и возвещаем не от человеческой мудрости изученными словами, но изученными от Духа Святого»(1Кор. 2, 10–13).«Ты Христос, Сын Бога Живого». И по слову Христа:«не плоть и кровь открылиему (Петру)сие, но Отец,... Сущий на небесах»(Мф. 16, 16–17).«Великая благочестия тайна: Бог явился во плоти, оправдал Себя в Духе, показал Себя ангелам, проповедан в народах, принят верою в мире, вознесся во славе»(1Тим. 3, 16). И это есть естественный рост в Духе чрез пребывание в Божественной области хранением заповедей Христа. Ум вдруг схватывает познание и формулирует его в человеческих словах. Сие приходит, как вспышки молнии, при сердце, разжженном любовью. Это – та светоносная вечность, к которой все мы призваны (ср.:1Петр. 2, 9). Накопление в опыте Церкви подобных моментов озарения сознания нашего органически привело к сведению их воедино. Так появляется первая попытка систематизации живого богословия, произведенная святымИоанном Дамаскином, мужем, богатым и своим собственным опытом. Срыв этого чудного восхождения к Богу в неисследимом богатстве высшего познания произведен, при упадке живого опыта, тенденцией подвергать данные Откровения критике нашего рассудка; склонением к «философии религии». Последствие: схоластические суммы богословия, в которых опять-таки больше именно философии, чем Духа жизни.'
        cn: 圣三一乃是爱之上帝。福音中所言说的爱，是那无始之神性的非受造的生命能量。其属性，即爱的属性，在于使其在自身存在中合一。凡在如此与上帝合一中存留者，便在对他自身所发生之事理智的认知中逐渐进益。«因为上帝已用祂的圣灵向我们启示了（关于祂的）知识：因圣灵洞察一切，甚至上帝的深奥之事……我们所领受的并非这世界的灵，而是从上帝而来的圣灵，好使我们能明白上帝所恩赐给我们的一切：且我们传讲这些，并非用人类智慧所教导的言语，而是用圣灵所教导的言语»（哥林多前书 2:10-13）。«祢是基督，永生上帝之子»。并且，按照基督的话语：«并非血肉向他（彼得）启示了这事，而是那在天上的父»（马太福音 16:16-17）。«敬虔的奥秘是伟大的：上帝显现于肉身，在圣灵中得以称义，曾显现给天使看，在列国中被宣讲，在世上被信仰接纳，在荣耀中被接升天»（提摩太前书 3:16）。而这便是在圣灵中借着存留在神圣的领域中，并借由遵守基督的诫命所带来的自然成长。理智突然领悟了知识，并以人类的言语将其阐述出来。这事如同闪电般迸发，临到那被爱点燃的心。这便是那我们所有人都被召唤前往的光明永恒（参看：彼得前书 2:9）。在教会经验中，我们意识里类似启明的时刻的累积，有机地导致了将它们汇集到一起。于是，由圣约翰·大马士革这位拥有丰富自身经验的人，进行了第一次将活生生的神学系统化的尝试。这种通向上帝、进入最高认知那不可测度之丰盛的奇妙升华，其崩溃是在活生生经验衰落的情况下，因着将启示的数据置于我们理性批判之下的倾向；以及倾倒于「宗教哲学」而造成的。后果便是经院主义的神学总集，在其中，正是哲学多于生命的圣灵。
    - type: paragraph
      text:
        ru: 'Действенно быть в Боге и с Богом дается или"детям"(Мф. 18, 3, 11:25), или божественно безумствующим, подобно великому Павлу (см.:1Кор. 4, 8–10; 1–20). Он писал о себе:«Но что было для меня преимуществом, то ради Христа я почел тщетою. Да и все (вообще) почитаю тщетою ради превосходства познания Христа Иисуса, Господа моего. Для Него я от всего отказался, и все почитаю за сор, чтобы приобресть Христа... чтобы познать Его и силу воскресения Его, и участие в страданиях Его, сообразуясь смерти Его, чтобы достигнуть воскресения мертвых»(Фил. 3, 7–11). Павел исполнил завет Господа, сказавшего:«Так всякий из вас, кто не отрешится от всего, что имеет, не может быть Моим учеником»(Лк. 14, 33).«От всего, что имеет»в плане тварного бытия, в его отверженности от Бога, в его самоутверждении.«Верующие суть сыны Авраама... и благословляются сним» (Гал. 3, 7–9и 29). Итак, нам нужно последовать примеру нашего по духу отца Авраама: взять в руки огонь и нож, и взойти на высокое место, чтобы принести Богу во всесожжение все, что нам дорого по плоти. Тогда и мы услышим:«Теперь Я знаю тебя... и благословляя благословлю тебя»(Быт. 22). И это есть верный путь к блаженной вечности: на всем ином остаются следы смерти. Только при условии"до конца"(Ин.13, 1) преданного следования Христу открываются в нас высшие потенции нашей природы и мы становимся способными воспринять Евангелие в его вечном измерении. Решимость «оставить все» (Мф. 19, 27–30) – приводит нас к порогу между временем и вечностью, и мы начинаем созерцать реальности иного, нетленного Бытия, дотоле скрывавшиеся от нас. Бог не насилует нашу свободу: не ворвется Он Сам внутрь нашего сердца, если мы не расположены открыть Ему вход:«Се стою у двери и стучу. Если кто услышит голос Мой, и отворит дверь, войду к нему»(Апок. 3, 20). И чем шире открываем, тем изобильнее Нетварный Свет заполняет наш внутренний мир.'
        cn: 真实地在上帝里面并与上帝同在，是赐予「孩童」（马太福音 18:3，11:25）或行神圣愚拙者，如同伟大的保罗（参：哥林多前书 4:8-10，1-20）。他论及自己说：「然而，我先前以为于我有益的，现在因基督的缘故，我都当作虚无了。不但如此，我将一切都看作亏损，因我以认识我主基督耶稣为至宝。为祂的缘故，我放弃了一切，并将一切看作粪土，为要得着基督……为要认识祂，并认识祂复活的大能，且参与在祂的苦难中，效法祂的死，为要达到死人中的复活。」（腓立比书 3:7-11）保罗遵行了上主的教诲，祂曾说：「这样，你们无论何人，若不舍弃他一切所有的，就不能作我的门徒。」（路加福音 14:33）「他一切所有的」是指在受造的存在中，其对上帝的弃绝，及其自我肯定。「信仰之人是亚伯拉罕的子嗣……并与他同蒙祝福。」 （加拉太书 3:7-9，29）因此，我们需要效法我们属灵之父亚伯拉罕的榜样：手持火与刀，登上高处，为要将我们肉身所珍爱的一切，献给上帝作全燔祭。那时，我们也将听到：「现在我知道你了……我必大大赐福于你。」（创世记 22）这便是通往蒙福永恒的可靠道路：在所有其他事物上都留下了死亡的痕迹。唯有在「到底」（约翰福音 13:1）忠贞不渝地跟随基督的条件下，我们本性中更高的潜能才能得以开启，我们才能有能力领受其永恒维度中的福音。「舍弃一切」（马太福音 19:27-30）的决心，引领我们到达时间与永恒之间的门槛，我们便开始默观另一个不朽的存有的实相，这些实相在此之前一直对我们隐藏着。上帝不侵犯我们的自由：祂不会自己闯入我们的内心，如果我们不乐意为祂敞开入口的话：「看哪，我站在门外叩门。若有听见我声音就开门的，我便进到他那里去。」（启示录 3:20）我们敞开得越宽广，那非受造之光就越丰盛地充满我们的内心世界。
    - type: paragraph
      text:
        ru: Испытанная нами любовь к Богу и Его к нам – радикально меняет и психику, и мышление наше. Всякая вражда между людьми – машины смонтированы людьми, но носят характер безличных, чтобы не сказать бесчеловечных, аппаратов, с безразличием раздавливающих миллионы людских жизней. Бессильный изменить по существу нетерпимые, однако узаконенные преступления социальной жизни народов, в моей молитве, вне всяких видимых образов, я почувствовал присутствие распятого Христа. Я жил Его страдание духом настолько ясно, что физическое видение«вознесенного от земли»(Ин. 12, 32) нисколько не усилило бы моего соучастия в Его боли. Какими бы ничтожными ни были мои переживания, но они углубляли мое познание Христа в Его земном явлении, чтобы спасти мир.
        cn: 我们所体验到的对上帝的爱以及祂对我们的爱，彻底改变了我们的精神和思想。人与人之间的一切仇恨——就像由人组装、却呈现出无人格，甚至非人性的机器，冷漠地碾碎着数百万人的生命。面对各民族社会生活中那些本质上不可容忍、却被合法化的罪行，我无力改变，然而在我的祷告中，超脱于一切可见的形象之外，我感受到了被钉十字架的基督的临在。我以灵如此清晰地体验着祂的苦难，以至于肉体的看见那「从地上被举起来的」（约翰福音 12:32），丝毫也不会增强我分担祂痛苦的程度。无论我的体验多么微不足道，但它们加深了我对基督在世上显现的认知，为要拯救世界。
    - type: paragraph
      text:
        ru: Дивное откровение дано нам в Нем. Он влечет наш дух к Себе величием Своей любви. Душа моя с плачем благословляла и благословляет Бога и Отца, благоволившего открыть нам Духом Святым ни с чем и ни с кем несравнимую святость и истинность Сына Своего чрез постигающие нас малые испытания.
        cn: 奇妙的启示在祂里面赐予我们。祂以其爱的宏伟吸引我们的灵归向祂自己。我的灵魂流着泪，曾称颂并仍在称颂上帝和父，祂乐意藉着圣灵，又藉着临到我们的小小磨砺，向我们启示了祂圣子那无与伦比的圣洁与真理。
    - type: paragraph
      text:
        ru: 'Благодать, даруемая в начале ради привлечения и обучения, иногда бывает неменьшей, чем у совершенных; однако это вовсе не значит, что она усвоена получившим сие страшное благословение. Усвоение Божиих дарований требует длительного испытания и усиленного подвига. В полноте перерождение падшего человека в"нового"(Еф. 4, 22–24) совершается в три периода: первый, начальный – призыв и вдохновение на предстоящий подвиг; второй – оставление «ощутимой» благодатью и переживание богооставленности, смысл которой в том, чтобы предоставить подвижнику возможность явить верность Богу в свободном разуме; третий, заключительный – вторичное стяжание ощутимой благодати и хранение ее, связанное уже с умным познанием Бога.'
        cn: 起初为吸引和教导而赐予的恩典，有时并不逊于那些完全人所得到的；然而这绝不意味着领受了这可畏祝福的人已将其汲取。汲取上帝的恩赐，需要长期的考验和加倍的修持。堕落之人完全地重生为「新人」（以弗所书 4:22-24），在三个时期内完成：第一，初始阶段——蒙召和面对将要展开的修持的激励；第二——被「可感受的」恩典所离弃，以及经历被上帝遗弃，其意义在于为修持者提供机会，使其在自由的理智中显明对上帝的忠诚；第三，总结阶段——再次获得可感受的恩典并保守它，这已与对上帝的智性认识相关联。
    - type: paragraph
      text:
        ru: '«Верный в малом и во многом верен; неверный в малом неверен и во многом... Итак, если вы в неправедном богатстве не были верны: кто поверит вам истинное? И если в чужом не были верны: кто даст вам ваше?»(Лк. 16, 10–12). Кто в первичный период был наставляем самим действием благодати в молитве и всяком ином добре, и во время длительной богооставленности живет так, как будто бы благодать неизменно пребывала с ним, таковой, по долгом испытании его верности, получит"истинное"богатство, в уже неотъемлемое вечное обладание; иными словами: благодать срастается с природой тварной, и обе сии: благодать и тварная природа – становятся едино. Этот заключительный дар есть обожение человека; сообщение ему божественного образа бытия, безначального, святого; преображение всего человека, чрез которое он становится христоподобным, совершенным.'
        cn: «在小事上忠心的，在大事上也忠心；在小事上不忠心的，在大事上也不忠心……那么，如果你们在不义的钱财上不忠心，谁会把真正的托付给你们呢？如果你们在别人的东西上不忠心，谁会把你们自己的给你们呢？» (路加福音 16:10-12)。谁在最初阶段受到恩典本身作用的指引，在祷告和一切其他善行中有所领受，并且在漫长的蒙上帝离弃期间，生活得如同恩典恒久与他同在一般，这样的人，在经过对其忠诚的漫长考验之后，将获得「真正的」财富，进入不可剥夺的永恒拥有；换言之：恩典与受造的本性融为一体，这两者：恩典与受造的本性——成为一。这最终的恩赐便是人的神化；赋予他神圣的存在样式，是无始的、圣洁的；是整个人之变容，借此他变得肖似基督，成为完全的。
    - type: paragraph
      text:
        ru: 'Те же, что не пребыли верными"в чужом", по выражению Господа, утеряют то, что получили в начале. Здесь мы усматриваем некую параллель с притчей о талантах:«поручил им имение свое. И одному дал он пять талантов, другому два, иному один, каждому по его силе... подолгомвремени, приходит господин рабов тех, и требует у них отчета... получивший пять... принес другие пять талантов, и говорит: господин! пять талантов ты дал мне, вот, другие пять... я приобрел на них. Господин его сказал ему: хорошо, добрый и верный раб! в малом ты был верен; над многим тебя поставлю;войди в радость господина твоегоПодошел также и получивший два... и сказал... вот, другие два таланта я приобрел на них... хорошо, добрый и верный раб! в малом ты был верен; над многим тебя поставлю;войди в радость господина твоегоПодошел и получивший один талант, и сказал: господин! я знал тебя, что ты... жестокий... и убоявшись... скрыл талант твой в земле: вот тебе твое. Господин же в ответ: лукавый раб и ленивый... возьмите у него талант, и дайтеимущемудесять талантов... а у неимущего отнимется и то, что имеет»(Мф. 25, 14–29и далее).'
        cn: '那些未能按上主的话，在「别人的」事上忠心持守的，将失去他们起初所领受的。在此我们看到与按才干受托的比喻某种相似之处：


          「把自己的财物托付给他们。他给了一个五他连得，一个二他连得，一个一他连得，照着各人的才干……过了许久，那些仆人的主人来了，和他们算账……那领了五他连得的，又带着另外的五他连得来，说：主啊！祢曾交给我五他连得，请看，我又赚了另外的五他连得。他的主人对他说：好，你这又良善又忠心的仆人！你在小事上忠心，我要把许多事派你管理；进来享受你主人的快乐吧。那领了二他连得的也上前来，说：主啊！祢曾交给我二他连得，请看，我又赚了另外的二他连得……好，你这又良善又忠心的仆人！你在小事上忠心，我要把许多事派你管理；进来享受你主人的快乐吧。那领了一他连得的也上前来，说：主啊！我知道祢是严厉的……我就害怕，去把祢的一他连得埋藏在地里：请看，祢的本钱在这里。他的主人回答说：你这又恶又懒的仆人！……夺过他这一他连得来，给那有十他连得的……凡没有的，连他所有的也要夺过来。」(马太福音 25:14-29及后续经文)'
    - type: paragraph
      text:
        ru: 'И эта притча, как и предыдущая, неприложима к обычным человеческим отношениям, но только к Богу: Господин не взял от того, кто потрудился над талантами и удвоил их, но все, и данное, и им приобретенное трудом, – все отдал ему в его владение, как совладельцу:«ВОЙДИ В радость(обладание царством)ГОСПОДИНА ТВОЕГО». И когда неиспользованный талант оказался свободным, то и его отдает Господин«имущему десять... ибо всякому»трудящемуся над дарами Божиими«ДАСТСЯ И ПРИУМНОЖИТСЯ»(Мф. 25, 29).'
        cn: 这则比喻，如同前一则一样，不适用于普通的人际关系，而唯独适用于上帝：主人并未从那辛劳使用才干并使其翻倍的人那里取走什么，而是将一切——包括所赐予的和他劳作所得的——尽数归他所有，如同共同的拥有者：「进入你主的喜乐（即拥有天国）吧。」而当那未被使用的才干变得空置时，主人也将它交给「那拥有十个的……因为凡是」为着上帝的恩赐而辛劳之人，「都必将有所得，且更要加添」（马太福音 25:29）。
    - type: paragraph
      text:
        ru: 'СвятойИоанн Лествичникговорит, что ко всякой науке, ко всякому искусству, ко всякой профессии – возможно привыкнуть и делать дело уже без особого усилия. Но никому, никогда не давалось молиться без труда; особенно, если имеется в виду нерассеянная молитва, совершаемая умом в сердце. Если кто-либо испытывает сильное влечение к этой молитве, то у него может появиться трудно реализуемое желание: бежать отовсюду; скрываться от всех; зарыться в глубь земли, туда, где не виден и самый свет дневного солнца; туда, где оставлена всякая забота о преходящем. И это понятно: нормально всем скрывать от постороннего взгляда свою интимную жизнь, а молитва сия обнажает самое ядро души, не переносящее никакого прикосновения к себе, кроме руки Создавшего нас.'
        cn: 圣约翰·阶梯者说，对于每一种学问、每一种艺术、每一种职业，都可以习惯，并且无需特别的努力就能完成。但是从来没有人能不费力地祈祷；尤其如果指的是那种在心中由心神完成的无散乱的祈祷。如果有人对这种祈祷感受到强烈的吸引，那么他可能会生出一个难以实现的愿望：逃离一切；躲避所有人；埋入地底深处，在那里，甚至白日的阳光都不可见；在那里，一切对世俗事物的挂虑都被弃置。这也是可以理解的：每个人将自己的私密生活隐藏起来，不让外人窥视，这是很自然的，而这祈祷却暴露了灵魂最深的核心，它不容忍任何触碰，除了创造我们的那只手。
    - type: paragraph
      text:
        ru: 'Каким болезненным разрывам подвергается такой человек в попытках найти настоящее место для искомой молитвы. Как веяние из иного мира, эта молитва приводит к различным конфликтам: и внутренним, и внешним. Один из них – борьба со своим телом, которое не замедлит обнаружить свое бессилие следовать стремлениям духа; часто телесные нужды достигают такой степени страданий, что заставят дух сойти с высоты молитвы к попечению о нем, иначе тело умрет.'
        cn: 这样的人在努力为他所寻求的祷告寻找真正的安身之处时，要经历多少痛苦的断裂啊。这祷告如同来自另一世界的气息，引发各种冲突：既有内在的，也有外在的。其中之一是与他身体的争战，这身体很快就会显露其无力追随精神的渴望；身体的需要常常达到如此程度的痛苦，以至于会迫使精神从祷告的高度降下，转而关照身体，否则身体就会死亡。
    - type: paragraph
      text:
        ru: 'Другое внутреннее борение; особенно в начале: как возможно забыть тех, кого любить заповедано, как самого себя? Богословски – это встает перед умом, как нечто противоположное смыслу заповеди; этически – как недопустимый «эгоизм»; мистически – как погружение во тьму совлечения; туда, где нет никакого упора для духа, где возможна потеря сознания реальности сего мира. И наконец, страх, ибо неведомо нам: угодно ли наше предприятие Господу?'
        cn: 另一个内在的挣扎；尤其是在初期：怎能忘记那些被命令要爱如己的人呢？从神学角度看，这在心智中呈现为与诫命意义相悖的事物；从伦理角度看，如同不可容许的「利己主义」；从奥秘角度看，如同沉浸在剥脱的幽暗中；在那里，灵性毫无所依，并可能失去对这世界现实的觉知。最后，恐惧，因为我们不知晓：我们的努力是否蒙上主悦纳？
    - type: paragraph
      text:
        ru: 'Аскетическое совлечение всего тварного, когда таковое бывает только следствием напряжения нашей человеческой воли, слишком негативно. Уму ясно, что негативный акт, как таковой, не может привести к позитивному, конкретному обладанию искомым. Да, невозможно изложить всех колебаний ума в такие периоды. Одни из них: я ушел от твари, но Бога нет со мною. Не это ли есть «тьма кромешная» – сущность ада? Многие другие, нередко страшные для души состояния выпадут на долю искателя чистой молитвы. Возможно, что все сие неустранимо на этом пути. Опыт показывает, что молитве свойственно пронизывать обширные области космического бытия.'
        cn: 苦修式的弃绝一切受造物，当其仅仅是我们人类意志力紧张的结果时，是过于消极的。心智清楚地知道，消极的行为，其本身无法带来对所求之物的积极、具体的拥有。是的，在这些时期里，心智所有的动摇是无法述尽的。其中之一是：「我已离开了受造物，但上帝却不与我同在。」这不正是「外面的黑暗」——地狱的本质吗？许多其他的，常令灵魂恐惧的状态，将降临到纯洁祈祷的寻求者身上。也许所有这一切在这条道路上是无法避免的。经验表明，祈祷往往能穿透宇宙实存的广阔区域。
    - type: paragraph
      text:
        ru: Заповеди Христа самою природою своею преодолевают все ограничения; душа стоит над безднами, где неопытный дух наш не видит никаких путей. Что сотворю? Я не вмещаю открывшейся бездны; я вижу свою малость, бессилие; временами куда-то падаю. Но предавшаяся в руки Бога Живого душа естественным образом обращается к Нему, и Он нетрудно достигает меня, где бы я ни был.
        cn: 基督的诫命，其本质超越一切限制；灵魂立于深渊之上，在那里，我们缺乏经验的灵看不见任何道路。我该怎么办呢？我无法容纳这显现的深渊；我看见自己的渺小与无力；有时我仿佛堕入某处。然而，将自己交托于永生上帝手中的灵魂，会自然地归向祂，而祂无论我身在何处，都能轻易触及我。
    - type: paragraph
      text:
        ru: В начале душа страшится, но, не раз спасенная молитвою, постепенно укрепляется в надежде, становится более мужественною там, где раньше оно – мужество – казалось совсем неуместным.
        cn: 灵魂起初是恐惧的，但屡次借着祷告蒙受拯救之后，它渐渐在盼望中得以坚固，并在那先前连这刚毅本身都似乎全然不合时宜之处，变得更加刚毅。
    - type: paragraph
      text:
        ru: 'Пытаюсь писать о невидимой брани нашего духа. Пережитые мною опыты не давали достаточного основания считать их уже обретенною вечностью. Думаю, что доколе мы в этом материальном теле, неизбежно скольжение нашего восприятия к видимым аналогиям. Что будет, когда мы окончательно перешагнем телесность и временность – еще неведомо. Повторяюсь: в той беспредельности нет видимых путей. Страх, не животный, доводит напряжение внимания до предела сил. При всех колебаниях, удерживать себя в равновесии дается только молитвою. Вопль души, часто без слов; или в кратких словах:«Господи, спаси меня»(Мф. 14, 30).'
        cn: 我试图书写关于我们灵魂的无形争战。我所经历的经验，不足以让我将它们视为已经获得的永恒。我认为，只要我们仍在这物质的身体里，我们的感知就不可避免地会滑向可见的类比。当我们最终跨越身体性和时间性时，会发生什么——这仍是未知。我重复一遍：在那无边无际之中，没有可见的道路。那种恐惧，并非动物性的恐惧，它将注意力的紧张程度推至力量的极限。尽管有所有的动摇，唯有借着祷告才能保持自身的平衡。那是灵魂的呐喊，常常是无言的；或是以简短的言语：「主啊，救我！」（马太福音 14:30）。
    - type: paragraph
      text:
        ru: 'Вспоминаю то время, когда я оставил мое занятие искусством и, казалось, отдался целиком Христу. Многие выдающиеся представители русской культуры – духовной и гуманистической – не без пафоса говорили, что мир вступил в трагическую эпоху; все, ответственно живущие, должны понять нравственную необходимость включиться в этот трагизм, охватывающий всю вселенную, – разделить его, – содействовать в меру сил нахождению благоприятного исхода, и подобное. Я с глубоким уважением слушал этих замечательных людей, но не мог последовать им: внутренний голос говорил мне о моей непригодности для подобной роли. Так, я не переставал умолять Бога привести меня в то место, в такие условия, где бы я, потерянный невежда, смог найти спасение. В молитвах я предложил Богу мой план, мои сроки; и Он исполнил все с математической точностью: я был брошен любящей рукой в среду подвижников Афона.'
        cn: 我忆起那个时候，当我放弃了我的艺术追求，并且，看似完全奉献给了基督。许多杰出的俄罗斯文化代表——无论是属灵的还是人文主义的——不无激昂地说道，世界已进入了一个悲剧性的时代；所有负责任地生活着的人，都应明白道德上的必要性，投入到这弥漫整个宇宙的悲剧中，——分担它，——竭尽所能地促成一个有利的结果，诸如此类。我怀着深深的敬意聆听着这些杰出人士，但我无法跟随他们：内心的声音告诉我，我不适合扮演那样的角色。于是，我不停地恳求上帝将我带到那样的地方，那样的境况中，在那里，我这个迷失的无知之人，能够寻得救恩。在祷告中，我向上帝献上了我的计划、我的时限；而祂以数学般的精准实现了这一切：我被一只充满爱的手投入了阿索斯山修道士的群体之中。
    - type: paragraph
      text:
        ru: 'Там, на Святой Горе, я обрел нужную мне обстановку: долгие богослужения, главным образом ночами; простые, не требующие интеллектуального напряжения работы; возможность жить в послушании, без мысли о том, как игумен и его сотрудники, монастырские старцы, управляют всеми делами обители. Свободный от всех житейских проблем, я мог молиться беспрерывно день и ночь. Мало времени оставалось на чтение книг; иногда полчаса, а то и менее сего в день. Но Господь был со мною; и я не отрывался от Него ни на краткие минуты. Мое сердце горело непрестанно; мой ум, как на скале, стоял в слове Божием. Не скрывались в душе никакие движения, чуждые Духу Христа, вызываемые сильными атаками неприязненных сил. Я молился как безумный от охватывавшего меня ужаса быть таким, как я был и есмь; мое сердце и мой ум стали полем сражения между Христом и Врагом, колоссом космических измерений. В тот период я ходил по невидимому канату над пропастями. Некое странное отчаяние захватывало меня со всех сторон, как воды объемлют утопающего. Говорю «странное», потому что когда оно, отчаяние, отходило от меня, я как бы умирал духовно. Из этого отчаяния, как из вулкана, исторгалась горячая молитва, подобно ап. Петру, я кричал Христу Вседержителю:«Господи, спаси меня».'
        cn: 在圣山那里，我找到了我所需要的环境：漫长的礼拜仪式，主要在夜间举行；简单、不耗费心力的工作；能够生活在顺服中，无须考虑院长和他的同工们——修道院的长老们——是如何管理修道院所有事务的。摆脱了所有世俗的问题，我能够昼夜不停地祈祷。几乎没有时间阅读书籍；有时每天半小时，甚至更少。但主与我同在；我片刻也未曾离开祂。我的心持续燃烧；我的心智如同屹立在磐石上，扎根于上帝的圣言之中。没有任何异于基督之灵的冲动在灵魂中隐藏，那是由敌对势力的强烈攻击所引起的。我如同疯子般祈祷，因为那攫住我的恐惧——我竟然是我过去和现在这般模样；我的心和我的心智成了基督与仇敌——这宇宙量级的庞然巨物——之间的战场。在那个时期，我行走在看不见的钢丝上，底下是万丈深渊。一种奇怪的绝望从四面八方攫住我，如同水淹没溺水者一般。我说「奇怪」，是因为当它，那绝望，从我身上退去时，我就像是灵性上死去了。从这绝望中，就像从火山中，喷发出热切的祈祷，如同使徒彼得，我向全能的基督呼喊：「主啊，救我！」
    - type: paragraph
      text:
        ru: 'Так с неравной силой напряжения проходили месяцы, годы. Описать всего невозможно. Позднее сложилось сознание: мне было попущено сие за мое гордое, безумное падение. Я увидел, что следование за Христом-Богом как-то естественно бросает человека в безбрежные океаны духа. Жить во Христе – значит восчувствовать Его как воистину Победителя смерти:«Свет... пришел в мир... не судить, но спасти мир... Овцы Мои... идут за Мною. И Я даю им жизнь вечную, не погибнут вовек; и никто не похитит их из руки Моей»(Ин. 10, 27–28, 12:46–47и другие).'
        cn: '如此，在不均等的张力中，月复一月，年复一年地过去了。要描述这一切是不可能的。后来，我领悟到：我蒙允许经历这一切，是因着我骄傲、疯狂的堕落。我明白，跟随基督-上帝，某种程度上是自然而然地将人投入无垠的灵性海洋。活在基督里，意味着真切地感受祂是真正战胜死亡的胜利者：


          「光……来到世上……不是要审判，乃是要拯救世界……我的羊……跟随我。我赐给他们永生；他们永不灭亡，谁也不能从我手里把他们夺去。」(约翰福音 10:27-28，12:46-47及其他)'
    - type: paragraph
      text:
        ru: 'В те дни я напал на дерзновенные слова преп.Исаака Сирина: «Творящих знамения, чудеса и силы в мире не сравнивай с безмолвствующим с ведением. Бездейственность безмолвия возлюби более, нежели насыщение алчущих в мире и обращение многих народов к поклонению Богу» (cл.56). Я никогда не отваживался сравнивать себя с отцами или применять к себе их слова вполне, но некоторая аналогия опыта должна наличествовать, иначе навсегда мы останемся вне истинного познания духовных реальностей. Мой ум не шел на риск раскрыть адекватно то состояние, в котором пребывал святой Исаак, высказывая сие, превосходящее меру человека, видение. И сейчас я скажу относительно меня самого лишь немногое.'
        cn: '在那些日子里，我看到了叙利亚的圣以撒那大胆的言辞：


          「在世上行神迹、奇事和异能的人，不要与那带着真知静默的人相比较。你要爱慕静默的无为，胜过在世上使饥饿者饱足，以及使许多民族归向上帝并敬拜祂。」（论56）


          我从未敢于将自己与教父们相比较，也从未完全将他们的话语应用于自身，但某种经验上的类比必须存在，否则我们永远无法置身于对属灵实相的真知之外。我的心智不愿冒险充分地阐明圣以撒在宣讲这超越人类限度的洞见时所处的状态。而现在，就我自己而言，我只说一点点。'
    - type: paragraph
      text:
        ru: Неведомая для меня благость Бога в первые годы моего обращения ко Христу «жестоко» бросала меня в беспредельность, давая мне ощутить мое ничтожество, мое истощание, мое «ничто». Чрез этот дар очищалось мое сердце от смертоносной язвы гордости и становилось способным в любви и мире созерцать Бога, – воспринимать от Него новую жизнь, нетленную.
        cn: 对我而言未识的上帝的良善，在我皈依基督的最初几年里，曾「严厉地」将我投入无垠之中，使我感受我的卑微、我的枯竭、我的「虚无」。藉着这份恩赐，我的心得以洁净，脱离傲慢那致命的毒疮，并变得能够在爱与平安中默观上帝——从祂那里领受新的、不朽的生命。
    - type: paragraph
      text:
        ru: Все мы, потомки Адама, носим в себе последствия его падения, о котором говорит Откровение; но не все живут его с одинаковой глубиною осознания онтологических измерений сего бедствия. Глубинный психоанализ Человека – образа Божия – начинается с первых страниц библейского Откровения, а не с родильного дома. Гордость, как явная или скрытая тенденция к самообожению – извратила сердца людей; едва мы увидим в себе некоторые признаки духовного восхождения, как этот змий подымает свою голову и тем омрачает ум, пресекает видение, удаляет от Бога. Теперь вижу, что мое крайнее невежество в начальный период оказалось для меня спасительным. В молитве моего отчаянного покаяния Господь давал мне непосредственно наставления, и тщеславие не прикасалось ко мне. Напрашивается вывод, что до конца сокрушенный раскаянием дух наш – оказывается способным к восприятию действий Божиих. Приведенные выше слова святого Исаака в том смысле соответствовали моей духовной истории, что познать Истинного Бога было для меня важнее всех событий мировой политической жизни. Моя жажда Бога была существеннее, чем все остальные стороны здешнего бывания. Без сего знания – о человеке и Боге – я ощущал себя во мраке; вне Христа не было никакого исхода из темного подвала. Да и во всей вселенной я видел лишь отвратительный узел людских страстей. «Узел» – неразрешимый ударом материального меча.
        cn: 我们所有人，亚当的后裔，都背负着他堕落的后果，启示对此有所提及；但并非所有人都带着对这灾难的本体论维度同等深刻的认识而生活着。对人类——上帝的形象——的深度精神分析，始于圣经启示的开篇数页，而非从产房开始。骄傲，无论是显露的还是隐藏的，作为一种自我神化的倾向——败坏了人心；一旦我们在自己身上看到某些属灵上升的迹象，这条蛇便会抬起头来，从而蒙蔽心智，阻碍洞见，使人远离上帝。现在我明白，我在初期极度的无知，反而对我而言是救赎性的。在我绝望忏悔的祷告中，上主直接赐予我教导，虚荣没有沾染我。显而易见的结论是，我们那被悔恨彻底破碎的心灵——能够感知上帝的作为。上述圣以撒的话语在某种意义上与我的属灵经历相符，即认识真上帝对我而言，比世界上所有的政治生活事件都更为重要。我对上帝的饥渴，比此世存在的所有其他方面都更为本质。没有这份知识——关于人和上帝——我感到自己身处黑暗之中；离开基督，就没有从黑暗地窖中解脱的任何出路。甚至在整个宇宙中，我只看到一个令人憎恶的人类情欲之结。「这个结」——无法以物质之剑一击而解。
    - type: paragraph
      text:
        ru: «Человек родился в мир»(Ин.16, 21). Я увидел его чрез Христа. Он, человек, богоподобная ипостась, рождается как потенция; проходит процесс своего становления, сначала в пределах сего мира, затем должен достигнуть сверхкосмических измерений чрез следование Христу, победившему мир (космос):«Мужайтесь; Я победил мир»(космос) (Ин. 16, 33).
        cn: «人诞生于世» (约翰福音 16:21)。我借着基督看到了他。他，即人，肖似上帝的位格，作为一种潜能而诞生；经历其自身形成的进程，首先在此世界的范围内，然后必须借着跟随基督——祂战胜了世界（宇宙）——达到超宇宙的维度：「你们要刚毅；我已经战胜了世界」（宇宙） (约翰福音 16:33)。
    - type: paragraph
      text:
        ru: 'Я повторяюсь: Господь даровал мне благодать смертной памяти и благословенного отчаяния. «Смертная память» ставит человека пред вечностью, сначала в ее отрицательном аспекте: все бытие видится объятым мраком смерти. Затем снисходит на душу Свет Богоявления, с победой над смертью. «Отчаяние» же было следствием осознания моей далекости от Бога. Сии два: смертная память и отчаяние явились крыльями для перелета через бездну. Страшный и длительный опыт сей был Божиим благодеянием: благодаря ему снято было с сердца моего «древнее покрывало», не допускавшее меня до разумения новозаветного Откровения во Христе и Духе Святом (ср.:2Кор.3, 13–18).'
        cn: 我重复一遍：上主赐予我死亡记忆的恩典和蒙福的绝望。「死亡记忆」将人置于永恒之前，首先以其负面维度呈现：一切存有皆被死亡的黑暗所笼罩。随后，显现之光降临于灵魂，带着战胜死亡的胜利。而「绝望」则是我意识到与上帝疏远的结果。这二者：死亡记忆和绝望，化作了双翼，助我飞越深渊。这可怕而漫长的经历乃是上帝的恩泽：借着它，从我的心上被除去「古老的帕子」，那帕子曾使我无法领悟在新约中、在基督里并藉圣灵的启示（参阅：哥林多后书 3:13-18）。
    - type: paragraph
      text:
        ru: 'Все нелепое и страшное на мировой сцене; все банальное и скучное в людской повседневности – в результате слагается в противоречивую, но все же грандиозную картину. И великое, и малое – все так или иначе отражается в каждом из нас. Из многих контрастов: зла и добра, мрака и света, печали и радости, безумия и мудрости, любви и ненависти, немощи и силы, созиданий и разорении, рождений и смертей – создается всеохватывающее видение Бытия. От неисчислимого множества навязанных терзаний и издевательств – унижен человек, попрано его достоинство. Душа в отчаянии от этого зрелища. И вдруг до ее, души, сознания донеслись слова Христа:«ЧЕЛОВЕК РОДИЛСЯ В МИР»– в их вечном значении даже для Бога. И от этой радости забываются все бывшие ранее болезни и скорби.'
        cn: 世上一切荒谬可怖之事；人间日常一切平庸乏味之景——最终汇聚成一幅矛盾却依然宏伟的图景。伟大的与渺小的——都以某种方式映照在我们每个人的心中。从众多对比之中：恶与善，黑暗与光明，忧愁与喜乐，疯狂与智慧，爱与恨，软弱与力量，创造与毁灭，生与死——构成了对「存在」的包罗万象的洞察。因着无数强加的折磨与欺凌——人被贬低，其尊严被践踏。灵魂因此景象而陷入绝望。蓦然间，抵达了她的意识，她的灵魂意识，基督的话语：「人诞生于世」——这话语所蕴含的永恒意义，甚至对上帝亦然。于是，因着这份喜乐，昔日的一切病痛与忧愁尽皆忘却。
    - type: paragraph
      text:
        ru: 'Заповеди Христа выражены в немногих простых словах, но чудным образом следование им приводит к тому, что дух наш раскрывается в томящей жажде обнять«все небесное и земное»(Еф. 1, 10) в заповеданной любви. А разве мыслимо, чтобы вызванные из «ничто» обладали такой силой? Конечно, невозможно нам, если мы исходим из самих себя, вместить в сердце все мироздание. Но Сам Творец всего сущего явился в нашем образе бывания и действенно показал, что природа наша создана способною обнять не только тварный космос, но и воспринять полноту Божественной жизни. Без Него мы не можем сотворить ничего (ср.:Ин. 15, 5), но с Ним и в Нем все становится доступным: не без «боли», которая нам необходима во-первых для того, чтобы мы осознали себя свободными личностями (ипостасями), во-вторых – чтобы на Суде Господь смог даровать нам Свою жизнь в неотъемлемое от нас обладание (ср.:Лк. 16, 10–12).'
        cn: 基督的诫命以寥寥数语表达，但奇妙的是，遵从它们会使我们的心灵在切切的渴慕中展开，在诫命中命定的爱中拥抱「天上地上一切所有的」（以弗所书 1:10）。难道能思议，从「虚无」中被召出者竟拥有如此大的能力吗？当然，如果只凭我们自身，我们不可能在心中容纳整个受造界。但那万有的创造主亲自以我们的存在样式显现，并切实地表明，我们的本性被创造得不仅能拥抱受造的宇宙，而且能领受神圣生命的丰满。离了祂，我们不能作什么（参照：约翰福音 15:5），但与祂同在并活在祂里面，一切都变得可得：并非没有「痛苦」，这「痛苦」对我们而言是必要的，首先是为了使我们意识到自己是自由的位格，其次是为了让上主在审判日能够将祂的生命赐予我们，成为我们不可剥夺的拥有（参照：路加福音 16:10-12）。
    - type: paragraph
      text:
        ru: 'Переноситься умом при всяком страдании нашем в мировые измерения – уподобит нас Христу. Такая направленность мысли сделает каждое явление в нашем индивидуальном бывании откровением о происходящем в мире людском. Чрез нас пройдут потоки космической жизни, и мы сможем живым опытом познавать и Человека в веках временных, и даже Сына человеческого в Его двух естествах. Именно так, в болезнях, растем мы до космического и метакосмического самосознания. Проходя чрез опыт истощания в следовании за Христом, сораспинаясь Ему, мы становимся восприимчивыми к беспредельно великому Божественному Бытию. В изнурительной покаянной молитве за весь мир – мы духовно сливаемся со всем человечеством: становимся универсальными по образу универсальности Самого Христа, носящего в Себе все существующее. Умирая с Ним и в Нем, мы уже отсюда предвкушаем воскресение.'
        cn: 在我们的一切苦难中，将心神提升至普世的维度，这会使我们肖似基督。这种心意的定向会使我们个体生命中发生的每一个现象，都成为关于人类世界中所发生之事的启示。宇宙生命的洪流将穿过我们，我们便能以活生生的经验去认识历代历时中的人，甚至认识人子在祂二性中的真实。正是如此，在苦难中，我们成长，达致宇宙性的和超宇宙性的自觉。通过在追随基督中经历虚己的经验，与祂同钉十字架，我们便变得易于接受那无限伟大的神圣存有。在为整个世界的刻苦悔罪祈祷中，我们在灵性上与全人类合一：我们变得普世性，肖似基督自身普世性的样式，祂在自身内承载着一切所存在之物。与祂同死并在祂里面死去，我们便已在此世预尝复活。
    - type: paragraph
      text:
        ru: 'Господь страдал за всех нас. Его страдания воистину покрывают все болезни истории нашей по падении Адама. Чтобы познать как должно Христа, и нам самим необходимо включиться в Его страдания и переживать ВСЕ, если возможно, как и Он Сам. Так и только так познается Христос-Истина; т.е. бы-тийно, не отвлеченно, не чрез психологическую или умственную веру, не преложившуюся в жизненный акт. В начале моего возврата ко Христу уже с несколько углубленным разумением того, Кто есть Иисус, изменилось сердце мое, и по иным направлениям пошла моя мысль. Из переживаемых мною внутренних конфликтов я спонтанно переносился в мир людской, и чрез это пришло ко мне сострадание всему человечеству. Из этого опыта родилось понимание, что всем нам нужно жить выпадающие на нас испытания не только в узких рамках нашей индивидуальности, но непременно исходить духом из оков телесной ограниченности на мировые просторы. Иными словами: сознавать, что чрез нас проходят потоки все той же космической жизни, которая течет в жилах всякого человека. Это, казалось бы, естественное психологическое движение привело меня к тому, что я стал переживать постигавшие людей болезни, бедствия, распри, вражды, стихийные катастрофы, войны и подобное с умноженным соболезнованием. В этом нормальном в существе импульсе оказался корень, из которого вырос для меня драгоценный плод: жить все человечество, как самого себя, как мою собственную жизнь. Именно сие предписано нам заповедью –«возлюби ближнего твоего, как самого себя»(Мф. 22, 39), конечно, в христианском понимании:«а кто мой ближний?»(Лк. 10, 29–37). Разрастаясь и усиливаясь с годами, мое сознание естественно шло к последним границам мира, к преодолению сих пределов: к Беспредельному. С благодарностью к Богу вспоминал я все нелегкое, перенесенное мною за время первой мировой войны; страшные разрушения, казалось, всей государственной жизни страны; революционные сражения по всем просторам России, с неустранимыми опасностями для всех и каждого; крайние стеснения во всем потребном для нормальной жизни; отрыв от того, что важно и дорого душе и уму; мучительное стояние пред безумием всего происходящего... Так вошел я в трагизм современной истории. Позднее проник уже к ее истокам: библейскому повествованию о падении Человека.'
        cn: 主为我们众人受苦。祂的受难确实覆盖了亚当堕落后我们历史上的一切病痛。为了如其所应地认识基督，我们自己也必须参与祂的受难，并尽可能地像祂自己那样去经历这一切。唯有如此，真理基督方能被认识；也就是说，在存有中，而非抽象地，也非通过未转化成生命之行动的心理或理智上的信仰。在我开始回归基督之时，对耶稣是谁已有了稍深的认识，我的心改变了，我的思想也转向了不同的方向。在我所经历的内心冲突中，我自发地被带入人类世界，并由此对全人类产生了怜悯。从这个经验中，我领悟到：我们所有人都需要经历临到我们身上的试炼，不仅是在我们个体狭隘的框架内，更必须在精神上挣脱身体有限性的桎梏，进入广阔的世界。换言之：要意识到，那流淌在每个人血脉中的宇宙生命之流也穿过我们。这种看似自然的心理运动使我开始以加倍的同情心去感受临到人们的疾病、灾难、纷争、仇恨、自然灾害、战争以及类似的一切。在这个本质上正常的冲动中，我发现了一个根源，从中为我长出了一个宝贵的果实：将全人类当作自己来活，如同活我自己的生命。这正是诫命所吩咐我们的——「要爱你的邻人如同你自己」（马太福音 22:39），当然，这是在基督徒的理解中：「谁是我的邻人呢？」（路加福音 10:29-37）。随着岁月增长和加强，我的意识自然地走向世界的最终边界，走向超越这些界限：走向无限者。我怀着对上帝的感恩，回忆起第一次世界大战期间我所承受的一切艰难；那似乎是全国政治生活整体的可怕破坏；俄国全境的革命战役，对每个人都构成不可避免的危险；正常生活所需一切的极度匮乏；与灵魂和思想所看重和珍爱之物的分离；痛苦地面对所有发生之事的疯狂……于是我进入了现代历史的悲剧性之中。后来，我已深入到它的源头：圣经中关于人类堕落的叙述。
    - type: paragraph
      text:
        ru: Потрясающая картина. И это еще не конец:«Еще раз поколеблю не только землю, но и небо»(Евр.13, 26).
        cn: '令人震撼的景象。而这还未终结：

          「再一次，我将震动的不只是地，更是天」 (希伯来书 13:26)。'
    - type: paragraph
      text:
        ru: 'Так я приблизился к великой тайне «образа Божия» в нас: Персоне. Он открылся нам в Имени – АЗ ЕСМЬ СЫЙ. Да, мы образ Его. Предстоя Ему в молитве, дух наш одновременно и торжествует, и болезнует: торжество – от созерцания реальностей, превосходящих земное воображение; болезнование – от ощущения своего ничтожества, никак не могущего вместить Божьего дара. Так от самого начала нашего Свыше рождения томится душа. Мы, конечно, растем, но сей рост кажется нам медлительным и к тому же мучительным. Можно сказать, что вся христианская жизнь сводится к«болезням рождения»для вечности (ср.:Ис. 26, 17–18по Септуагинте).'
        cn: 于是我接近了我们里面「上帝的形象」这一伟大奥秘：即位格。他在圣名——「我是自有永有的」中向我们启示了自己。是的，我们是祂的形象。在祷告中立于祂面前时，我们的灵同时既欢庆，又痛苦：欢庆——来自于默观那些超越地上想象的实相；痛苦——来自于感受到自身的渺小，无论如何都无法容纳上帝的恩赐。如此，从我们从上而生的那一刻起，灵魂便备受煎熬。我们当然在成长，但在我们看来，这种成长是缓慢的，而且是痛苦的。可以说，整个基督徒生命都归结为为了永恒的「诞生的痛苦」（参阅：以赛亚书 26:17-18，根据七十士译本）。
    - type: paragraph
      text:
        ru: Вижу, что непрестанно мой ум возвращается на то же самое видение, от которого не могу оторваться, с которым начал родниться более полувека тому назад. Господь поглощает меня всецело. Я и вижу окружающую меня обстановку, и не вижу ее. Мой глаз скользит по ней в те отрезки времени, когда я занят неустранимыми нуждами повседневности.
        cn: 我看到，我的心智不停地回到同一个异象上，我无法挣脱它，半个多世纪以前我就开始与之结缘。上主完全地吞噬了我。我既看见我周围的环境，又看不见它。我的目光在那些时段掠过它，那是我忙于不可避免的日常所需的时候。
    - type: paragraph
      text:
        ru: 'Но сплю ли я или бодрствую – Бог объемлет меня теснее, чем воздушная атмосфера. За истекшие десятилетия благодать многообразно изливалась на меня потоками. Временами, как широкая река; иногда, как водопад, т.е. падение на главу мою«воды живой»(Ин. 4, 10).  Бывает и бывало – раскрывалась предо мною необозримая ширь океанская; или, как невесомое ничтожество, повисал я в своеобразной умной бездне... и сейчас я словно потерянный: написанное мною не более, чем набросок величественной панорамы в альбоме живописца. Душа моя хочет петь гимны Богу, с такою любовью пришедшему мне, убогому, навстречу, но нет у меня достойных Его слов.'
        cn: 然而，我或睡或醒——上帝环抱我，比空气更紧密。在过去的几十年里，恩典以多样的方式如洪流般倾泻于我。有时，如宽阔的河流；有时，如瀑布，即，那「活水」倾降在我的头上（约翰福音 4:10）。时而有之，昔日亦然——在我面前展现出无边无际的海洋广阔；或，我如无重的虚无，悬浮在一种独特的理性深渊中……而此刻我仿佛迷失：我所写下的，无非是画家画册中一幅宏伟全景的草稿。我的灵魂渴望向上帝歌唱赞美诗，祂以如此的爱降临，迎接我这贫乏之人，但我却没有配得上祂的言语。
  - type: heading2
    text:
      ru: О духовническом служении (Из записок Афонского Духовника)
      cn: '论属灵指导事奉

        （摘自阿索斯山一位属灵指导者的札记）'
    children:
    - type: paragraph
      text:
        ru: 'Неожиданный и непонятный Промысл Божий поставил меня в такое положение, при котором в течение ряда лет я был зрителем духовной жизни многих подвижников Святой Горы. Некоторые из них располагались открывать мне то, чего, наверное, не сообщали другим. Восхищало меня видеть избранников Божиих, скрытых за их смиренным видом. Иногда они сами, хранимые Богом, не понимали, сколь богатое благословение почивает на них. Им было дано прежде всего усматривать в самих себе недочеты; по временам до такой степени, что они как бы не дерзали и помыслить, что Бог почивает в них и они в Нем. Некоторые из них были введены в созерцание Нетварного Света, но не узнали они об этом событии, отчасти потому, что мало знакомились с творениями святых отцов, описывающих сей образ благодати. Их неведение ограждало их от возможного тщеславия. По преданию православного духовничества, я не объяснял им, что в сущности ниспосылает им Господь. Чтобы помогать подвижнику благочестия, нужно так говорить с ним, чтобы смирялось сердце его и ум, так как без этого дальнейшему восхождению будет положена преграда. Я помнил о том, как старец Анатолий, на Старом Русике, сказал Силуану, тогда еще молодому послушнику: «Если ты теперь такой, то что же ты будешь под старость?» (Старец Силуан, стр.18). Этими словами он, старец Анатолий, на долгие годы бросил Силуана в пламя таких искушений, из которых, правда, он вышел победителем, но весьма дорогой ценой. Сила данного ему боговидения превзошла динамизм вражеских нападений, и из своей исключительной духовной битвы он вышел обогащенным, как лишь немногие за всю историю Церкви, и оставил нам в научение свое слово о различии аскетического смирения от «неописуемого Христова смирения». Но и для него риск гибели был великим, как и для каждого христианина, и вообще человека. Гордость – составляет ядро духовного падения: чрез гордость люди становятся подобными демонам. Богу свойственна смиренная любовь, в пламени которой приходит искупление падших для Царства Отца Небесного.'
        cn: 意想不到且难以理解的上帝的圣意，使我置身于这样一种境地，在此境地中，我多年以来亲眼目睹了许多圣山苦修者的属灵生活。他们中的一些人愿意向我敞开，透露那些他们大概没有告诉别人的事情。令我赞叹不已的是，能看到隐藏在他们谦卑外表之下的上帝的选民。有时他们自己，蒙上帝保守的，却不明白有何等丰盛的恩典安息在他们身上。他们首先被赐予在自己身上察觉到不足之处；有时甚至到了如此地步，以至于他们几乎不敢设想上帝安息在他们里面，他们也在上帝里面。他们中的一些人曾被引入对非受造之光的默观，但他们并未认识到这一事件，部分原因在于，他们很少研读描述这种恩典形式的圣教父著作。他们的不知情保护他们免受可能的虚荣。按照东正教神师传统，我没有向他们解释上主实质上赐予他们的是什么。为了帮助虔诚的苦修者，必须这样与他交谈，以便他的心和心思得以谦卑，因为若无此，更进一步的提升将受到阻碍。我记得安那托利长老，在老鲁西克，对西拉说，那时他还是一个年轻的初学者：「如果你现在是这样，那么你到老年会变成什么样子？」（西拉长老，第18页）。借着这些话，他，安那托利长老，将西拉投入了此类试探的火焰中，长达多年，尽管他从中胜出，却付出了极其昂贵的代价。赐予他的神视之力超越了仇敌攻击的猛烈攻势，而从他非凡的属灵争战中，他变得更加丰盛，像教会历史上仅有的少数人一样，并留下他的话语教导我们，关于苦修式谦卑与「基督那不可言喻的谦卑」之间的区别。但对他而言，沉沦的危险也是巨大的，就像每个基督徒，乃至所有人类一样。骄傲——构成了属灵堕落的核心：人通过骄傲变得如同魔鬼。谦卑的爱是上帝固有的属性，在其火焰中，堕落者得以救赎，以进入天父的国度。
    - type: paragraph
      text:
        ru: Духовнику надлежит чувствовать ритм внутреннего мира всех и каждого из обращающихся к нему. С этой целью он молится, чтобы Дух Божий руководил им, давая нужное для каждого слово.
        cn: 神父理当体会每一个向他求教之人的内心世界节奏。为此，他祈祷上帝的圣灵引领他，赐予适合每个人的话语。
    - type: paragraph
      text:
        ru: 'Служение духовника и страшно, и увлекательно; болезненно, но вдохновляюще. Он«соработник у Бога»(ср.:1Кор. 3, 9). Он призван к наивысшему творчеству; к несравненной чести: творить богов для вечности во Свете нетварном. Во всем, конечно, ему пример (Ин. 13, 15) Христос. Вот его учение:«Истинно, истинно говорю вам: Сын ничего не может творить Сам от Себя, если не увидит Отца творящего: ибо что творит Он, то и Сын творит также. Ибо Отец любит Сына и показывает Ему все, что творит Сам. И покажет Ему дела больше сих, так что вы удивитесь. Ибо, как Отец воскрешает мертвых и оживляет, так и Сын оживляет, кого хочет»(Ин. 5:19–21).'
        cn: '灵修导师的职事，既可畏又引人入胜；既痛苦又鼓舞人心。他是「上帝的同工」（参阅：哥林多前书 3:9）。他蒙召去从事最高的创造；去领受无与伦比的尊荣：在非受造的光中，为永恒造就神。当然，在一切事上，基督是他的榜样（约翰福音 13:15）。以下是祂的教导：

          「我实实在在地告诉你们：子从自己什么都不能做，除非祂看见父在做；因为父所做的，子也照样做。因为父爱子，把祂自己所做的一切事都指给祂看；并且还要把比这些更大的事指给祂看，叫你们惊奇。因为父怎样叫死人复活，赐他们生命，子也照样随自己的意思赐人生命」（约翰福音 5:19-21）。'
    - type: paragraph
      text:
        ru: 'Велик труд найти надлежащие слова для сообщения слушателю духовных состояний. Необходимо, чтобы и сам духовник в своем личном опыте познал прежде, если возможно, всю шкалу духовных состояний, о которых он дерзает говорить другим. В «Слове к пастырю» святой Иоанн Синайский (Лествица) о сем предмете говорит так: «Кормчий духовный тот, кто получил от Бога и чрез собственные подвиги такую духовную крепость, что... и от самой бездны может избавить обуреваемую душу... Истинный учитель тот, кто непосредственно от Бога принял книгу духовного разума, начертанную в уме перстом Божиим, т.е. действием осияния, и не требует прочих книг... Учителям неприлично преподавать наставления, выписанные из сочинений других... Наставляя низших, сам сначала учись Свыше... Ибо земное не может исцелить земных» (Гл. 1:2).'
        cn: '寻觅恰当的词语以向听者传达属灵状态，是一项巨大的挑战。属灵导师本人也必须，若有可能，首先在他个人的经验中，认识他敢于向他人谈论的所有属灵状态的谱系。在《致牧者之言》中，圣伊奥安·西奈（登阶者）论及此事时这样说：


          「属灵的舵手是那从上帝并借着自身的修持，领受了如此属灵力量的人，他……甚至能从最深的深渊中解救饱受风暴冲击的灵魂……真正的导师是那直接从上帝那里领受了属灵智慧之书的人，这书由上帝的指头铭刻在他的心智中，亦即借着光照的作用，并且不再需要其他的书……导师们不应当传授从他人的著作中抄录下来的指导……在指导不如自己的人时，你自己首先要从上头学习……因为属世的不能医治属世的。」 (第1章：2)'
    - type: paragraph
      text:
        ru: Именно таковые наставления и сам я получил, вступая в подвиг духовнического служения. В существе дела сего имеется в виду рождение слова от Бога в сердце по молитве. Так преп.Серафима Саровскогокто-то назвал прозорливым, но он ответил, что он вовсе не такой, но что он молится во время беседы с человеком, и первая мысль, появившаяся от молитвы в сердце, должна почитаться как данная от Бога.
        cn: 正是这样的训诲，我在步入神师事奉的苦修之时，自己也领受了。就这事情的本质而言，其意在于藉着祷告，上帝的话语在心中生发。因此，当有人称圣塞拉芬·萨罗夫斯基长老为明察之人时，他却回答说他根本不具此种能力，而是在与人交谈时祷告，并且由祷告在心中生发的第一个念头，应被尊为上帝所赐。
    - type: paragraph
      text:
        ru: Если людям, пришедшим к священнику с надеждой услышать от него ясно волю Божию, вместо того он даст указание, исходящее от его собственного рассуждения, могущего быть неугодным Богу, то тем самым бросит их на неверный путь и причинит некоторый вред. Тот же преп. Серафим сказал, что когда он говорил «от своего ума, то бывали ошибки». И блаженный Силуан добавил один раз при беседе о сем предмете, что «ошибки» могут быть нестрашными, но могут быть и весьма важными; как и сам он пострадал в начале своей монашеской жизни.
        cn: 如果人们怀着从神父那里清楚地听到上帝旨意的希望来到神父面前，他反而给出基于他个人判断的指示，而这判断可能不蒙上帝悦纳，那么他就会把他们引入歧途，并造成某种损害。同一位可敬的塞拉芬说过，当他「凭着自己的心思」说话时，「就出现过错误」。蒙福的圣西卢安有一次在谈及此事时补充说，「错误」可能并不可怕，但也可能非常重要；正如他本人在修道生活初期所经历的痛苦一样。
    - type: paragraph
      text:
        ru: Сознавая себя далеко стоящим от должного совершенства, подолгу и с болью в сердце умолял я Господа не попустить мне ошибаться, удержать меня в путях действительной Его воли, внушать мне слова, полезные братьям. И в самый час беседы с человеком я старался держать «слух» ума моего на сердце, чтобы улавливать Божию мысль и часто даже слова, которые нужно сказать.
        cn: 深知自己距离应有的完美境界甚远，我曾长久地、怀着心痛向上主恳求，求祢不要允许我犯错，保守我行走在祢真实旨意的道路上，并赐予我能造福弟兄的话语。甚至在与人交谈的时刻，我也努力将我心思的「听觉」保持在心上，以便领会上帝的心意，甚至常常是需要说出的话语。
    - type: paragraph
      text:
        ru: 'Следование святому принципу православной традиции на практике встречается с невероятными трудностями. Люди образованные крепко держатся иного начала: своего разума. Всякое слово иерея для них является просто человеческим, и потому подлежащим критическому обсуждению. Последовать указанию духовника без рассуждения было бы для них безумием. То, что видит и разумеет духовный, того вовсе не воспринимает душевный и отрицает, потому что живет в ином плане (ср.:1Кор. 2:10, 13). Встречаясь с людьми, руководящимися своими собственными импульсами и отталкивающимися от слова, данного иерею по молитве, я отказывался испрашивать от Бога открыть пришедшему Его святую и всесовершенную волю. Таким путем я не ставлю их в положение борьбы с Богом, говоря им лишь мое личное мнение, хотя бы и подтвержденное ссылкой на творения св. отцов или Священное Писание, я оставляю их свободными от богоборчества, и как бы в праве безгрешно отклонить мой совет, как только человеческий. Конечно, это далеко отстоит от искомого нами в таинствах Церкви.'
        cn: 在实践中遵循东正教的圣洁原则，会遇到极大的困难。有学识的人则牢牢坚守另一个根基：他们自己的理性。对他们而言，司祭的每一句话都只是出于人意的，因此应该受到批判性讨论。对他们来说，不加判断地遵循属灵导师的指引，会是疯狂之举。属灵的人所看到并领悟的，属魂的人则根本无法领会并且否认，因为他生活在另一个层面（哥林多前书 2:10，13）。当我遇到那些凭自己的冲动行事，并且拒绝那因祷告而赐予司祭的话语的人时，我拒绝向 上帝 祈求，以向来访者显明 祂 圣洁又全备的旨意。这样做，我便不会让他们处于与 上帝 争战的境地；我只告诉他们我个人的看法，即使这看法有圣教父著作或圣经的引用作证；我让他们免于与 上帝 争战，并且仿佛有权无罪地拒绝我的建议，只将其视为人意的。当然，这与我们在教会圣事中所寻求的相去甚远。
    - type: paragraph
      text:
        ru: 'В наше время массового отступления от христианства священническое служение становится все более и более трудным. В своем стремлении изводить людей из ада, созданного их же противоречивыми страстями, он постоянно встречается с поразившей их смертью. Самое ощущение времени принимает странный характер: то оно нудно-тягучее, то исчезает, как не сущее, потому что нет осмысленных исканий.'
        cn: 在我们这个大规模背弃基督教的时代，圣职事奉变得越来越困难。在他努力将人们从由他们自己矛盾的激情所造成的地狱中引出时，他不断地遇到那已临到他们身上的死亡。时间本身的感受变得奇特：时而它冗长乏味，时而它消失不见，如同不存在一般，因为没有有意义的寻求。
    - type: paragraph
      text:
        ru: Невозможно понимать людей. Они или слепы и «не знают, что делают», или страдают духовным и умственным дальтонизмом. Часто видят вещи в диаметрально противоположном освещении, подобно фотографическому негативу... Узнать при этом действительную реальность жизни бывает уже невозможно. При таком положении не остается места никакому слову. Движения святой любви воспринимаются ими враждебно; терпеливое смирение представляется им лицемерием; расположение служить следствием мелкой заинтересованности. Характерно при этом, что самый дух христианского непротивления злу делает их неумеренно дерзкими; священников оскорбляют незаслуженно больно; приписывают такие намерения, о которых сами они вовсе не мыслили; беспощадно унижая, их обвиняют в гордости; всей своей установкой делают неудобным присутствие священника и в то же время осуждают за уклонение его от контакта в подобных условиях. И так без конца.
        cn: 理解人是不可能的。他们要么是盲目的，「不知道他们所做的是什么」，要么患有属灵和智力上的色盲症。他们常常以截然相反的光线看待事物，如同照片底片一般……在这种情况下，认识生活的真实现实已然不可能。在这种处境下，任何言语都无处可容。神圣之爱的举动被他们视为敌意；忍耐的谦卑在他们看来是虚伪；乐于服侍被认为是出于微末的私利。与此同时，一个特点是，基督教非抵抗恶的这种精神本身，使他们变得过度放肆；他们无缘无故地重伤神父；他们归咎于神父们从未有过的意图；在无情羞辱的同时，他们又指责神父们骄傲；他们以自己的全部姿态，让神父在场感到不适，同时又谴责神父在这种情况下避开接触。如此循环往复，永无止境。
    - type: paragraph
      text:
        ru: 'Благословляю Бога, открывшего нам тайну этого явления. Господь предупредил нас словом Своим, научил нас примером Своим. И если бы не так, то невозможно было бы не стать жертвою полного отчаяния. Один епископ, с горячностью отдававший себя на служение страждущим, многих спасший от внутренних и внешних катастроф, однажды написал мне: «я стал бояться любви». Я позднее понял его слова так: те, которые получили от него пользу, привязывались к нему и в начале помогали ему в его святом служении; но затем, войдя в доверие, ставши необходимыми, посягали на его свободу, ставя повсюду затруднения, если он отдавал себя вновь пришедшим. В то время, когда я получил от него сие письмо, я еще не понимал страшного смысла его слов. Он открылся мне за годы моего служения в Европе. Я вспоминал не раз и продолжаю вспоминать до сего времени парадоксальные слова: я стал бояться любви.'
        cn: 我颂赞上帝，祂向我们揭示了这一现象的奥秘。主以祂的话语警戒我们，以祂的榜样教导我们。若非如此，我们就无法不沦为彻底绝望的牺牲品。一位热忱地献身于服侍受苦者、并拯救了许多人脱离内在和外在灾难的主教，有一次写信给我说：「我开始害怕爱了。」我后来这样理解他的话：那些从他那里受益的人，便依附于他，起初也帮助他进行他神圣的服侍；但后来，获得信任后，变得不可或缺后，便侵犯他的自由，如果他将自己献给新来的人，他们就会处处制造障碍。当时我收到他此信时，还不明白他话语中可怕的深意。这深意是在我在欧洲服侍的那些年里才向我显明的。我不止一次地回忆起，并且直到现在仍不断回忆起那些矛盾的话语：「我开始害怕爱了。」
    - type: paragraph
      text:
        ru: 'Но вместе с тем становится видимым и иной аспект в служении нашем. К священнику люди относятся так же, как к Богу: отвергают его со страшной легкостью, как нечто непотребное, с уверенностью, что как только Он им понадобится, они позовут Его, и Он не откажется придти.«Отче, прости им, ибо они не знают, что делают»(Лк. 23:34).'
        cn: 然而与此同时，在我们的事奉中也显现出另一个方面。人们对待司祭，如同对待上帝一样：极其轻易地弃绝他，视其为无用之物，并深信一旦他们需要祂，他们就会呼唤祂，而祂不会拒绝前来。「父啊，赦免他们！因为他们所做的，他们不晓得。」(路加福音 23:34)
    - type: paragraph
      text:
        ru: 'По моем приезде во Францию из Греции (Святой Горы) я встретился с людьми, от которых отвык за 22 года моей жизни там. Особенно за последние годы, когда я стал духовником для нескольких сот монахов всех видов аскетической жизни Афона. Не скрою, я был совершенно «дезориентирован». Психология монахов, их терпение и выдержка настолько превосходили все и всех, что я встретил в Европе, что я просто не находил ни слов, ни внешних форм общения. То, что монахи воспринимают с благодарностью, в Европе сокрушало людей. Многие оттолкнулись от меня, считая меня ненормально жестким, даже до извращения евангельского духа любви. И я принимал эти отзывы с пониманием, что «нормы» аскетов-монахов и нормы людей западной культуры глубоко различны. Нет сомнений, самым «ненормальным» как для людей времен «Великого Инквизитора», так и для наших современников был бы Христос. Кто может слушать Христа, или тем более последовать Ему? То, что монахам давалось десятилетиями плача, люди современные думают получить за короткий промежуток времени, а иногда за несколько часов приятной «богословской» беседы. Слова Христа, всякое Его слово пришло в сей мир свыше; оно принадлежит к сфере иных измерений и усвояется не иначе, как путем долгой молитвы со многим плачем. Без этого условия оно пребудет навсегда непонятным человеку, как бы он ни был «образован» даже богословски. Некто сказал мне: «Когда живешь под грузом непонятного, то задыхаешься». Да, все мы люди неизбежно сокрушаемся, когда пытаемся всеми силами понять слово Христа. Сам Господь сказал:«Кто упадет на этот камень, разобьется; а на кого он упадет, того раздавит»(Мф. 21, 44). Встречаясь с этим свойством слова Христа, мы постепенно уразумеваем, что оно раскрывает пред нами вечные сферы безначального Духа. И затем все, что противится в нас слову Христа, мы живем как наличие смерти в нас. Итак, мы пребываем в состоянии глубокой раздвоенности: с одной стороны – благодарность, сладким ножом разрывающая наше сердце; с другой – нестерпимый стыд за самого себя и также ужас пред далекостью цели.'
        cn: 当我从希腊（圣山）抵达法国后，我遇到了一些人，他们是我在那里生活了22年所不习惯的。尤其是在近几年，当时我已成为阿索斯山数百名各种苦修生活修士的神师。我不讳言，我完全「迷失了方向」。修士们的心理状态、他们的忍耐和坚韧，远远超越了我身在欧洲所遇到的一切和所有人，以至于我简直找不到言语，也找不到外在的沟通方式。修士们心怀感恩所领受的，在欧洲却使人们感到崩溃。许多人疏远了我，认为我异常严苛，甚至扭曲了福音的爱之精神。我以理解的心态接受了这些反馈，深知苦修修士的「规范」与西方文化人群的规范大相径庭。毫无疑问，无论是对于「大法官」时代的人，还是对于我们的同代人而言，最「不正常」的都将是基督。谁能聆听基督，更何况追随祂呢？修士们通过数十载的流泪（祷告）方才领受的，现代人却以为可以在短时间内，有时甚至在几小时愉快的「神学」交谈中获得。基督的言语，祂的每一句话，都来自上方，降临到这世上；它属于另一维度的领域，除非通过长时间的祷告并伴随许多泪水，否则无法领会。若无此条件，它将永远对人而言是不可理解的，无论他受过多高的「教育」，即便在神学上亦然。有人对我说：「当你生活在无法理解的重压之下时，你会窒息。」是的，我们所有人都不可避免地会感到崩溃，当我们竭尽全力试图理解基督的圣言时。主亲自说：「谁跌在这石头上，就必跌碎；这石头掉在谁身上，谁就必被砸得粉碎。」 (马太福音 21:44) 当我们面对基督圣言的这一特性时，我们逐渐领悟到，它向我们揭示了无始之圣灵的永恒领域。然后，我们生命中一切抵挡基督圣言的事物，我们都体验为死亡在我们里面的存在。因此，我们处于一种深刻的分裂状态：一方面是感恩，如同甜美的刀刃般撕裂我们的心；另一方面是无法忍受的自我羞愧，以及对目标遥远性的恐惧。
    - type: paragraph
      text:
        ru: Всякому христианину необходимо постоянное устремление к Свету Христа и решимость претерпеть все последствия такого устремления в пределах земли. Только тогда достигаем мы уразумения евангельского слова, и приходит оно без возможности «наблюдения», как это происходит, потому что речь идет о неописуемом реальном пребывании с нами Бога.
        cn: 每个基督徒都必须持续地渴慕基督之光，并决心忍受此种渴慕在地上所带来的一切后果。唯有如此，我们方能领悟福音的话语，它便降临，并非藉着『观察』它如何发生，因为这关乎上帝不可言喻的真实同在。
    - type: paragraph
      text:
        ru: Во всякой другой сфере человеческой культуры возможно наблюдение «прогресса», но не в нашей жизни. Часто Дух Святой отступает от нас за те или иные движения сердца нашего или мысли нашей. Но возможно оставление и в силу того, что сей Дух видит нас успокоенными и довольными уже полученным или достигнутым, и отступает, чтобы показать нам, как мы еще далеки от того, какими должны мы быть...
        cn: 在人类文化的任何其他领域，都能观察到「进步」，但在我们的生活中却不能。常常圣灵因我们心中或思想的某些动向而从我们这里退去。但这种离开也可能是因为圣灵看到我们心安理得、满足于已经得到的或已经成就的，便退去，为要向我们显明，我们离我们当成为的样子还有多远……
    - type: paragraph
      text:
        ru: 'Монаху нести труд духовничества вовсе не просто. С одной стороны, ему лично ПОЛЕЗНО, когда о нем люди имеют весьма отрицательное мнение, так как осуждения со стороны людей помогают ему смиряться. От болезненного сердца возносится к Богу более глубокая молитва. Легче дается крик к Богу о спасении всего мира, так как сам он живет страданием, подобным страданию столь великого множества людей на земле. С другой стороны, если он несет служение духовного отца, то всякое дурное слово о нем внушает недоверие к нему со стороны лиц, которые нуждаются в наставлении, в утешении, в поддержке. Печаль его становится двойною: за себя самого, живущего недостойно званию своему, с другой – за вред, наносимый всей Церкви, всему человечеству, когда разрушается авторитет священнослужителей. Непослушание слову духовных отцов равносильно отвержению слова Самого Христа. (Приемляй вас, Мене приемлет, и отвергающий вас, Мене отвергает).'
        cn: 修士承担神师的职分绝非易事。一方面，当人们对他抱有极其负面的看法时，对他个人而言是有益的，因为来自世人的指责有助于他谦卑。从痛苦的心中向上帝献上更深切的祷告。他自己活在苦难之中，类似于地上如此众多人的苦难，因此更容易向上帝呼求拯救全世界。另一方面，如果他肩负着神师的职事，那么任何关于他的恶言都会使那些需要教导、需要安慰、需要支持的人对他产生不信任。他的忧伤变为双重：一重是为他自己，因他活得不配其位分；另一重是为了对整个教会、整个人类造成的损害，即当神职人员的权威被破坏时。不顺从神师的话语，等同于弃绝基督自己的话语。（凡接纳你们的，就是接纳我；凡弃绝你们的，就是弃绝我。）
    - type: paragraph
      text:
        ru: Так важно, чтобы среди священников или епископов было самое настоящее взаимное уважение, почитание. Чтобы прекратились между ними обвинения друг друга, борьба за власть, зависть к превосходящим своими дарованиями. Даже если и есть некоторые недостатки в том или другом служителе Церкви (а кто совершен из людей?), лучше внушать верующим доверие к тем священникам, к которым они легко могли бы практически обращаться в силу географических условий или еще почему-либо. Самое доверие христиан к священнослужителям будет источником вдохновения для последних сказать истинное слово. Мы знаем из слов Самого Господа, что «на Моисеевом седалище» восседают недостойные лица, и все же Христос говорил народу, чтобы они слушались своих пастырей, соблюдали повелеваемое ими, не подражая их образу жизни или деяниям.
        cn: 如此重要，即在司祭或主教之间，存在着真正彼此的尊重、敬重。以使他们之间停止彼此的指责、权力斗争，以及对才能卓越者的嫉妒。即使这一个或那一个教会事奉者确实存在一些缺点（世人中谁是完全的呢？），最好是使信徒们对那些司祭产生信任，他们能够因地理条件或其它任何原因而方便地向他们求助。基督徒对圣职人员的这种信任本身，将成为激励后者说出真理之言的源泉。我们从上主自己的话语中得知，「坐在摩西位上的」有不配之人，尽管如此，基督仍对民众说，要听从他们的牧者，遵守他们所吩咐的，而不要效法他们的生活方式或行为。
    - type: paragraph
      text:
        ru: Старец Силуан не имел определенного духовника в течение всей своей монастырской жизни. Обращался к тому, кто в данный момент был ближе, свободнее принять. Предварительно он молился, чтобы Господь благоволил о нем и через духовника дал ему оставление грехов и исцеление души.
        cn: 长老圣西卢安在他整个修道生活中，没有固定的神师。他会求助于当时最亲近、最方便接待他的人。此前，他会先祷告，祈求上主眷顾他，并借着神师赐给他罪的赦免和灵魂的医治。
    - type: paragraph
      text:
        ru: 'Когда я имею дело с больными, тогда внимание мое направлено на их духовное состояние: знают ли они Бога и уповают ли на Него? Страдания же, боли и даже житейские катастрофы отступают на второй план. Как бы ни казалась ничтожною причина страданий человека, их нельзя презирать. Часто, и даже слишком часто, источником скорбей бывают неутоленные искания страстей греховных. Даже и в таких случаях духовник думает только об одном: как возможно исцелить человека сего. У людей, истомленных нищетой и трудами, и малый повод может вызвать великую боль, и на глубину болезни обращена его, духовника, молитва. Соболезнование всякому горю людскому естественно вызывает в душе духовного отца молитву. И что весьма характерно служителю Христа – так это узрение начальной вины всех бедствий и тягостных судеб вселенной. В сердце его скопляются муки всего мира, и он молится с печальным сердцем за всех и за всё.'
        cn: 当我处理病患之事时，我的注意力便集中在他们的灵性状况上：他们是否认识上帝并信赖祂？而痛苦、疼痛，甚至世俗的灾难，则退居次要位置。无论一个人受苦的原因看似多么微不足道，都不可轻视这些苦楚。常常，甚至过于频繁地，悲伤的根源在于未能满足的罪恶情欲的追求。即使在这种情况下，神父也只思考一件事：如何可能治愈这个人。对于那些被贫困和劳作所耗竭的人们，即使是微小的缘由也可能引发巨大的痛苦，而神父的祷告则指向其病痛的深处。对人类一切苦难的同情，自然地在灵父的灵魂中唤起祷告。而基督的仆役所特有的，则是洞察宇宙中一切灾难和沉重命运的最初罪咎。在他的心中，聚集着全世界的苦难，他便以一颗悲伤的心为所有人和一切事物祷告。
    - type: paragraph
      text:
        ru: На Святой Горе я значительно легче встречался с больными монахами, чем по приезде в Европу с живущими в миру. Первые (монахи) внутренне обращены к Богу, и все переводилось в духовный план. В Европе же превалируют психические напряжения; благодаря чему вынуждается духовник проявлять соучастие в том же плане, чтобы помогать людям. У одра таких больных, случалось, я включался в их страдания и духом, и душевно, и даже телесно, так что и тело мое молилось за них. Редко, но все же бывали случаи, что Бог принимал мои молитвы и исполнял то, о чем я просил Его. Неясным осталось для меня, почему иногда при меньшем напряжении молитвы моей ход болезни изменялся положительным образом, тогда как в другие времена при более глубоком молении состояние больного не улучшалось видимо.
        cn: 在圣山，我遇到生病的修士要比我来到欧洲后遇到那些世俗中人更容易得多。前者（修士们）内心转向了上帝，一切都被转化到属灵的层面。然而在欧洲，心理上的紧张占据主导；因此，这迫使属灵导师也要在同样的层面表现出同理心，以便帮助人们。在这些病人床前，我有时会投入到他们的痛苦中，无论是灵性上，还是在心灵上，甚至在肉身上，以至于我的身体也为他们祷告。很少见，但有时也会发生，就是上帝垂听了我的祷告，并成就了我所向祂祈求的。对我来说，这仍然不清楚，为什么有时我的祷告张力较小时，病情会积极地好转，然而在另一些时候，即使是更深入的祷告，病人的状况也未见明显改善。
    - type: paragraph
      text:
        ru: Заметил я, что если во время молитвы за кого-либо в душе происходило преломление скорби сердца на покой и радость, то это явление всегда бывало верным признаком, что молитва услышана, и дано исцеление тому лицу.
        cn: 我注意到，如果在为某人祷告之时，心灵中，心里的忧伤破碎而转化为平安与喜乐，那么这一现象总是一个确凿的迹象，表明祷告蒙垂听，并且那人已蒙医治。
    - type: paragraph
      text:
        ru: 'Я не искал дара исцелять болезни тел. При молитве за недугующих я все предавал в волю Бога, Который знает, что нужно для каждого ради его спасения. Я совсем не уверен, что такая установка, т.е. избегание моего личного воздействия, была причиной бесплодности многих моих молитв. Я никак не хотел стать «чудотворцем»: мысль об этом почти пугала меня. И все же, как бы вразрез сему, были случаи, когда молитва оставалась безрезультатной и верующий печальным – приходила мысль, что священнослужителям необходимо свидетельство от Бога, что Он слушает их молитвы и удовлетворяет их прошения. Умножение помощи просящим о помощи чрез священника укрепляло бы веру многих вЦерковь. Да и Сам Господь молился Отцу:«Отче... прославь Сына Твоего, да и Сын Твой прославит Тебя»(Ин. 17, 1).'
        cn: 我没有寻求医治身体疾病的恩赐。为患病者祷告时，我将一切都交托于上帝的旨意，祂知道每个人为着自己的救赎所需的一切。我完全不确定，这种做法，即避免我个人施加影响，是否是我许多祷告没有结果的原因。我丝毫不想成为「行神迹者」：一想到这几乎令我恐惧。然而，仿佛与此相悖，曾有这样的情况，祷告仍然没有结果，并且信徒感到悲伤——我心里产生了一个念头，即神职人员需要来自上帝的见证，证明祂垂听他们的祷告并应允他们的祈求。借着神父向寻求帮助者增多的帮助，会坚定许多人对教会的信心。甚至主自己也向父祷告：「父啊……求祢荣耀祢的儿子，好叫祢的儿子也荣耀祢」（约翰福音 17:1）。
    - type: paragraph
      text:
        ru: Чаще случается при молитве за живых, что сердце наше переживает преложение скорби на радость. Но нечто подобное происходит и при молитве об уже умерших, и даже много времени тому назад. Чудное событие -встретить в духе живым образом давно умерших, прежде даже неведомых нам лиц. Такое общение с потусторонним миром особенно свойственно молитве святым. Но бывает, хотя не часто, и при молитве за усопших, ведомых или неведомых, сердце получает извещение об их состоянии, благом или тяжком. Неложное единение в Духе Святом с душами людей, недавно или много веков тому назад усопших, свидетельствует об их персональной вечности в Боге нашем. Встреча нашей любви с любовью тех, кто в нашем уме во время молитвы«преподает нам некое дарование духовное к утверждению нашему»(ср.:Рим. 1, 11–12).
        cn: 更常发生的是，在为活人祷告时，我们的心会经历忧伤转化为喜乐。但类似的事情也会发生在为已故之人，甚至是很久以前去世的人祷告时。奇妙的事件是，在灵里以鲜活的方式相遇那些早已去世的、甚至是我们以前素未谋面的人。这种与彼世的交通，特别适合向圣徒祷告时。但有时也会发生，尽管不常，在为已故之人祷告时，无论是我们所认识的还是不认识的，心会得到关于他们境况的告知，无论是福乐的还是沉重的。这种在圣灵里与那些无论是近期还是几世纪前去世的人的灵魂的真实合一，见证着他们在我们的上帝里的个人永恒。这是我们的爱与那些人的爱的相遇，他们在祷告时，在我们心中「将一些属灵的恩赐传授给我们，以坚固我们」（参阅：罗马书 1:11-12）。
    - type: paragraph
      text:
        ru: 'Люди возлюбили тьму, в которой смерть, и отвергают Свет, который есть жизнь, и временная, и вечная. Если у духовника сердце, любящее народ Божий, то душа его исполняется глубокого сострадания, когда он находится в состоянии невозможности передать им свет-жизнь. Я не раз останавливался на странном аспекте духовного служения; и это естественно, потому что в практической жизни это сопутствует духовнику все дни его подвига:«смерть действует в нас, а жизнь в вас», – писал ап. Павел коринфянам (2Кор. 4, 12). Мало сего: за несение света жизни многие ненавидят служителей Христа, как прежде нас возненавидели Самого Господа:«Если мир вас ненавидит, знайте, что Меня прежде вас возненавидел... Помните слово, которое Я сказал вам: раб не больше господина своего. Если Меня гнали, будут гнать и вас; если Мое слово соблюдали, будут соблюдать и ваше»(Ин. 15:18, 20).'
        cn: 人们爱上了黑暗，其中有死亡，并拒绝了那既是暂时的也是永恒的生命之光。如果一位神父拥有一颗爱上帝子民的心，那么当他发现自己无法将光——生命传达给他们时，他的灵魂就会充满深深的怜悯。我不止一次地思考过灵性侍奉中一个奇特的方面；这是很自然的，因为在实际生活中，它伴随着神父他苦修的每一个日子：「死亡在我们身上发动，生命却在你们身上发动。」——使徒保罗如此写信给哥林多人（哥林多后书 4:12）。不仅如此：因为传扬生命之光，许多人憎恨基督的仆役，正如他们先于我们憎恨了上主祂自己：「如果世人恨你们，你们知道，他们恨我比恨你们更早……你们要记住我所说的话：仆人不大于他的主人。如果他们逼迫了我，他们也会逼迫你们；如果他们遵守了我的话语，他们也会遵守你们的话语。」（约翰福音 15:18，20）。
    - type: paragraph
      text:
        ru: 'Духовник при встрече с лицами, которые говорят ему о своих видениях, заботится прежде всего о том, чтобы верно распознать источник видения: было ли оно истинно дано Свыше, или только порождением возбужденной фантазии, или следствием влияния неприязненных духов. Задача подчас трудная и чрезвычайно ответственная. Если данное от Бога мы припишем сопротивной силе, то рискуем впасть в хулу на Духа Святого (ср.:Мф. 12:28–31). И наоборот: если демоническое действие признаем за Божественное, то толкнем доверяющего нам исповедника на почитание демонов. Отсюда всем без исключения духовникам необходима усердная и постоянная молитва вообще и на каждый отдельный случай, чтобы Сам Господь сохранил его от погрешностей в суждениях своих.'
        cn: 灵修指导者在与向他讲述自己异象的人相遇时，首要关切的是准确辨识异象的来源：它是否真正来自上天，或者仅仅是激动幻想的产物，或者是由敌对之灵影响的结果。这项任务有时是困难的，且责任极其重大。如果我们把上帝所赐的归咎于敌对势力，那么我们就冒着堕入对圣灵亵渎的危险（参见：马太福音 12:28-31）。反之亦然：如果我们把魔鬼的作为认作是神圣的，那么就会把信任我们的告解者推向崇拜魔鬼。因此，所有灵修指导者无一例外地都需要殷勤和恒久的祷告，无论是总体而言，还是针对每一个具体情况，以便上主亲自保守他免于判断上的失误。
    - type: paragraph
      text:
        ru: 'Когда духовнику положение вещей неясно, то у него в распоряжении остается «психологический прием»: предложить исповеднику быть недоверчивым ко всякого рода особенным явлениям. Если видение было действительно от Бога, то в душе его, исповедника, будет превалировать смирение, и он спокойно примет совет быть трезвенным. В обратном случае возможна реакция негативная и стремление доказать, что видение не могло быть иначе, как от Бога. Тогда есть некоторое основание усомниться в этом. Конечно, такой метод не более, чем паллиатив, и прибегать к нему не должно легкомысленно. Опыт показал, что когда кто-либо искушает брата своего, то тем самым толкает его на раздражение и огорчение.'
        cn: 当灵修导师对事情原委不明朗时，他仍可采用一种「心理策略」：建议告解者不轻信任何特殊的现象。若异象确实来自上帝，那么在他（告解者）的灵魂中，谦卑将会占据主导地位，他便会平静地接受要警醒自守的建议。反之，则可能会出现负面反应，并力图证明异象只可能来自上帝。那么，便有一定理由对此产生怀疑。当然，这种方法仅仅是权宜之计，不应轻率地采用。经验表明，当有人试探自己的弟兄时，这便会使他陷入恼怒和悲伤。
    - type: paragraph
      text:
        ru: Всем нам даны те же самые заповеди; отсюда следует, что все люди в глазах Господа – равны. Ни для кого не закрыт восход до последних степеней, до«полноты возраста Христова». В грядущем веке земная иерархия, и социальная, и церковная, может нередко оказаться опрокинутой:«Бог избрал безумное мира, чтобы посрамить мудрых, и немощное мира... чтобы посрамить сильное; и незнатное мира и уничиженное... чтобы упразднить значащее»(см.:1Кор. 1:26–28, 15:24–28).
        cn: '赐予我们所有人的都是相同的诫命；由此可见，在上主眼中，所有人都是平等的。没有人被阻挡攀登到最高的境界，直至达到「基督丰满的身量」。在将来的世代中，地上的等级制度，无论是社会的还是教会的，常常可能被颠覆：

          「上帝拣选了世上愚拙的，为要叫有智慧的羞愧；又拣选了世上软弱的……为要叫强壮的羞愧；也拣选了世上卑贱的，被人轻视的……为要废掉那有势力的。」(参见：哥林多前书 1:26-28，15:24-28)'
    - type: paragraph
      text:
        ru: 'Духовные «старцы» не обязательно иереи или монахи. Это показала история русской Церкви XVIII и XIX веков, когда целые ряды подвижников благочестия, носителей великой благодати, уклонялись от священства и монашества, чтобы сохранить за собою свободу подвига, вне контроля официально установленных органов. Это печальное и разрушительное для всей жизни Церкви явление не всегда обуславливалось анархическими настроениями против самого принципа иерархии; из чтения книг о таких героях духа легко увидеть, что многие из них были воистину высокого духа богобоязненные люди, удостоившиеся явных благословений и дарований Свыше. Их жизнь не вызывала благоволения ни со стороны церковной иерархии, ни со стороны государственных административных властей и учреждений. Избегание некоторыми священства и монашества объяснялось еще и тем, что как только человек наденет рясу, так все и каждый считают себя вправе судить этих служителей Христа. Судить в подавляющем числе случаев неправедно, неприязненно, клеветнически. Особо одаренные из них весьма часто подвергались даже грубым гонениям, потому что их жизнь была выше разумения стоящих у кормила власти. История нашей Церкви полна подобных случаев, и нет нужды называть их по именам. Кто много и усердно молится, тому характерны переходы от одного состояния в другое; нередко от острого страдания к глубокой радости; от отчаяния к созерцанию и вдохновенной надежде; от долгого плача к сладкому миру, и подобное. От многих и длительных молитв, от внимательного воздержания во всем – утончаются восприятия: душа становится подобною самому чувствительному слуховому аппарату, ярко реагирующему на едва уловимые звуки, и даже на уже неслышимые движения воздуха. Когда же дух наш переживет сотни и более раз то подъемы, то падения, тогда и то, и другое усваивается душою настолько, что она как бы непрестанно носит в себе и царство, и ад. Многим, возможно, это покажется парадоксальным, но по существу это есть признак умножающейся любви; приближение к уподоблению Христу. Вот, ап. Павел пишет о себе:«Кто изнемогает, с кем бы и я не изнемогал? Кто соблазняется, за кого бы я не воспламенялся?»(2Кор. 11, 29). Римлянам же он заповедал:«Радуйтесь с радующимися и плачьте с плачущими»(Рим. 12, 15). Согласно пастырскому принципу отцов – никто не должен заповедовать своим пасомым деяний, которых сам не совершил. Не думаю, чтобы ап. Павел был в этом отношении менее строгим, чем отцы. Обращения к пастырям людей, переживающих трудные для них испытания, не могут быть регламентированы или организованы произвольно; невозможно определить такие-то часы для приема скорбящих и иное время для радующихся. Отсюда следует, что всякий пастырь, во всякое время должен быть в состоянии плакать с плачущими и радоваться с радующимися... изнемогать с впадающими в отчаяние и восставлять в вере соблазняющихся. Но и здесь, как во всей нашей жизни, – первый пример Сам Господь. Из евангельской истории, и особенно последних дней и часов Его, мы видим, как Он жил совместно недостижимую для нас полноту и страдания, и торжества победы; и смерть, и неотъемлемую от Него Божественную славу:«вы знаете, что через два дня будет Пасха, и Сын Человеческий предан будет на распятие», «...отныне не буду пить от плода виноградного до того дня, когда буду пить с вами НОВОЕ ВИНО В царстве ОТЦА МОЕГО»... «Боже Мой, Боже Мой! для чего Ты оставил Меня?»... «истинно говорю тебе: НЫНЕ ЖЕ БУДЕШЬ СО МНОЮ В РАЮ»... «...и был пот Его, как капли крови, падающие на землю»... «Отче, прости им, ибо не знают, что делают»... «Душа Моя скорбит смертельно»... «Ты ли Христос, Сын Божий? Иисус говорит ему: ты сказал; даже сказываю вам: отныне узрите Сына Человеческого, сидящегоодеснуюСилы, и грядущего на облаках небесных».'
        cn: '属灵的「长者」不一定是神父或修士。俄罗斯教会在十八、十九世纪的历史表明了这一点，那时有整整一批虔敬的苦修者，伟大恩典的承载者，他们避开圣职和修道生活，为的是保持其灵修的自由，不受官方设立机构的控制。这种令人悲伤并对整个教会生活具有破坏性的现象，并非总是由反对等级制度本身原则的无政府主义情绪引起的；从阅读关于这些属灵英雄的书籍中，不难看出，他们中有许多人真是心灵高尚、敬畏上帝的人，配得来自上天的明显祝福和恩赐。他们的生活既未得到教会等级制度的青睐，也未得到国家行政当局和机构的认可。有些人避开圣职和修道生活，还有一个原因是因为，一旦一个人穿上法衣，所有人都会认为自己有权审判这些基督的仆人。而在绝大多数情况下，这种审判是不公正的、充满敌意的、诽谤性的。他们中特别有恩赐的人，常常遭受粗暴的迫害，因为他们的生活超越了掌权者的理解。我们教会的历史充满了此类事件，没有必要一一列举。


          那些大量且热切祈祷的人，其特点是从一种状态过渡到另一种状态；往往是从极度的痛苦转向深刻的喜乐；从绝望转向默观和受启发的希望；从长久的哭泣转向甘甜的平安，诸如此类。由于大量而持久的祈祷，以及在一切事上的谨慎节制——感知变得敏锐：灵魂变得像最灵敏的听觉设备，对微不可察的声音都能强烈反应，甚至对已经听不见的空气流动也能反应。当我们的灵经历数百次甚至更多的起伏跌宕时，那时，这两种状态都被灵魂吸收内化到如此程度，以至于它仿佛持续不断地承载着天堂和地狱。对许多人而言，这或许会显得自相矛盾，但本质上，这是不断增长的爱的标志；是趋近于效法基督。看，使徒保罗这样论及自己：「有谁软弱，我不同他软弱呢？有谁跌倒，我不同他焦急呢？」(哥林多后书 11:29)。他却这样吩咐罗马人：「与喜乐的人一同喜乐；与哀哭的人一同哀哭。」(罗马书 12:15)。根据教父们的牧养原则——任何人都不应吩咐其羊群做自己未曾做过的事。我认为，使徒保罗在这方面不会比教父们宽松。


          那些经历艰难考验的人们向牧者求助，是不能被随意地规定或组织的；不可能为接见悲伤者设定某些时间，为喜乐者设定另一些时间。由此可见，每一位牧者，在任何时候都应该能够与哀哭者同哭，与喜乐者同乐……与陷入绝望者一同软弱，并扶起那些跌倒者，使他们重拾信心。然而在此，如同在我们整个生命中——首要的榜样是主自己。从福音书的记载，特别是祂最后几天和几个小时里，我们看到，祂如何同时活出对我们而言遥不可及的苦难的丰满、胜利的凯旋；以及死亡，和祂不可分割的神性荣耀：


          「你们知道，过两天就是逾越节，人子将被交给人钉在十字架上，」

          「……从今以后，我不再喝这葡萄汁，直到我在我父的国里同你们喝新的那日子。」

          「我的上帝，我的上帝！祢为什么离弃我？」

          「我实在告诉祢：今日祢就要同我在乐园里了」……

          「……祂的汗珠如大血点滴在地上。」

          「父啊，赦免他们，因为他们所做的，他们不晓得。」

          「我心里极其忧伤，几乎要死。」

          「祢是基督，上帝之子吗？」耶稣对他说：「你说了。然而我还要告诉你们：从今以后，你们要看见人子坐在大能者的右边，驾着天上的云降临。」'
    - type: paragraph
      text:
        ru: 'И с нами, если мы действительно храним слово Христа, повторится все пережитое Им, хотя и с меньшей силой. Неисследима глубина Христовых страданий. Включаясь в них, мы получаем возможность познания высоты Божьего замысла о нас и достижения совершенства любви. По смерти нашей, страдания перестанут быть убийственными, как это бывает с нашим земным «составом»: они не смогут уже причинять ущерб НОВОЙ ЖИЗНИ, в избытке дарованной нам в наследие неотъемлемое. Дух человека сохраняет способность соболезновать всем, лишенным славы Божией, – подлинно сострадать, – но это будет лишь как многоразличные выявления всеобъемлющей любви: смерть не обладает спасенными во Христе. Здесь, на земле, духовные муки иногда доводят нас до порога смерти; но часто, в ответ на молитву, нисходит на нас благодатная сила и восстанавливает разрушенное; иногда даже с умножением жизненной энергии в нас. Если бы мы были способны хотя бы в малой степени проникнуть в безмерную скорбь Божией Матери при кресте, то нам стало бы ясным, что без содействия Свыше перенести их земное тело не может. Но любовь Духа Святого, пребывавшая на Ней со дня Благовещения, преодолела смертную боль: Она осталась жива, узрела Воскресшего Сына Своего возносящимся на небо, ниспославшего от Отца Духа Святого на рожденную в кровиЦерковь.'
        cn: 并且，在我们身上，如果我们确实遵守基督的话语，祂所经历的一切，都将重现在我们身上，尽管力量较小。基督所受苦难的深度，深不可测。参与其中，我们便能有机会认识上帝对我们旨意的崇高，并达至爱的完美。在我们死后，苦难将不再是致命的，如同它对我们地上「构成」所做的那样：它们将无法再损害新的生命，那丰盛地赐予我们作为不可剥夺之产业的生命。人的灵仍然能够同情所有被剥夺上帝荣耀的人——真正地怜悯他们——但这仅仅是包罗万象之爱的多方彰显：死亡对在基督里得救的人没有权柄。在此地上，属灵的痛苦有时将我们推到死亡的边缘；但往往，回应祷告，恩典的力量降临在我们身上，并修复被毁坏的；有时甚至使我们内在的生命能量倍增。即使我们能稍稍深入理解圣母在十字架旁那无量的悲伤，我们就会明白，凡尘之躯若无来自上天的帮助，是无法承受的。然而，圣灵的爱，从报喜之日就常住在她身上，胜过了致命的痛苦：她得以存活，亲眼看见她复活的圣子升天，并从父那里差遣圣灵，到那在血中诞生的教会。
    - type: paragraph
      text:
        ru: Все те, что знакомы с историей Церкви Христовой, знают – с каким трудом искались во все века такие выражения ее догматического сознания, о Боге ли, о самой ли себе (Церкви), которые удерживали бы от различных родов уклонений, деформирующих духовную жизнь ее членов, взятых отдельно, и ее бытия в целом.
        cn: 所有熟悉基督教会历史的人都知道——在所有时代，教会以何等艰辛寻觅着她的教义意识的表述，无论是关于上帝的，还是关于她自身（教会）的，旨在阻止各种偏离，这些偏离扭曲着她个别成员的属灵生命，以及她整体的存在。
    - type: paragraph
      text:
        ru: 'Нам свойственна уверенность, исходящая из векового опыта, что всякому члену Церкви открыт путь к совершеннейшим, возможным на земле и на небе, степеням богопознания. И это независимо от какого бы то ни было социального происхождения или иерархического положения. Возьмем для примера ближайших к нам по времени преп.Серафима Саровскогоили старца Силуана; митрополитаФиларета МосковскогоилиИоанна Кронштадтского. Мы могли бы возвратиться к самому началу нашей Церкви – апостолам, бывшим бедными рыбарями. Довольно сего. И если бы было иначе, то пришлось бы поставить такие восхождения в Божественные сферы в зависимость от человеческой школы. Господь Самим Собою показал, что Бог-Отец часто бывает ближе к «малым» и обездоленным людям:«Семьдесят учеников возвратились с радостью, и говорили: Господи! и бесы повинуются нам о имени Твоем. Он же сказал им: видел сатану, спадшего с неба, как молнию. Се, даю вам власть наступать на змей, и скорпионов, и на всю силу вражью; и ничто не повредит вам. Однако ж тому не радуйтесь, что духи вам повинуются; но радуйтесь тому, что имена ваши написаны на небесах. В тот час возрадовался духом Иисус, и сказал: славлю Тебя, Отче, Господи неба и земли, что Ты таил сие от мудрых и разумных и открыл младенцам. Ей, Отче! Ибо таково было Твое благоволение. И обратившись к ученикам, сказал: все предано Мне Отцом Моим; и кто есть Сын, не знает никто, кроме Отца, и кто есть Отец (не знает никто), кроме Сына, и кому Сын хочет открыть»(Лк. 10:17–22).«И дивились иудеи, говоря: как Он знает Писания, не учившись? Иисус, отвечая им, сказал: Мое учение не Мое, но пославшего Меня. Кто хочет творить волю Его, тот узнает о сем учении, от Бога ли оно, или Я (как человек) Сам от Себя говорю»(Ин. 7:15–17).'
        cn: '我们有一种源自数世纪经验的确信：每一位教会成员都有一条通往至为完全的、地上和天上所能达到的认识上帝之境的道路。这与任何社会出身或圣职地位无关。让我们以时代上离我们最近的几位为例：圣谢拉芬·萨罗夫斯基或长老圣西卢安；都主教菲拉雷特·莫斯科或约翰·克伦施塔特。我们也可以追溯到我们教会的开端——那些曾是贫穷渔夫的使徒们。止于此。若非如此，那么就不得不将这种攀登神圣领域的能力归因于人类的学识。上主亲自表明，上帝父常常更亲近「卑微者」和受苦的人：「那七十个门徒欢喜地回来，说：上主啊，因祢的名，连鬼也服了我们。耶稣对他们说：我曾看见撒但从天上坠落，像闪电一样。看哪，我已赐给你们权柄，可以践踏蛇和蝎子，又胜过仇敌一切的能力，绝没有什么能伤害你们。然而，不要为鬼服了你们而欢喜，却要因你们的名字记录在天上而欢喜。』就在那时，耶稣被圣灵感动而欢喜，说：父啊，天地的主，我颂赞祢，因为祢将这些事向聪明智慧的人隐藏起来，却向婴孩显明。是的，父啊，因为祢的旨意本是如此。接着，他转过身对门徒说：我的一切都已由我父交托给我；除了父，没有人知道子是谁；除了子，也没有人知道父是谁，除了子所愿意启示的人。」(路加福音 10:17-22)


          「犹太人就诧异，说：这个人没有学过，怎么会明白经书呢？耶稣回答他们说：我的教训不是我自己的，而是那差我来者的。人若愿意遵行他的旨意，就会知道这教训是出于上帝，还是我凭着自己说的。」(约翰福音 7:15-17)'
    - type: paragraph
      text:
        ru: 'Человеческая наука дает инструмент для выражения опыта, но знания, подлинно спасающего, сообщить не может без содействия благодати. Знание Бога есть знание бытийное, а не отвлеченно-интеллектуальное. Тысячи и тысячи профессиональных богословов получают высшие дипломы, но в существе остаются глубокими невеждами в области Духа. И это потому, что не живут они согласно заповедям Христа; и в силу сего лишаются света богопознания. Бог есть Любовь. А Любовь сия стяжевается путем сокрушающего кости покаяния и страха Божия:«не бойтесь убивающих тело, и потом не могущих ничего более сделать... бойтесь того, кто, по убиении, имеет власть ввергнуть в геенну: ей, говорю вам, того бойтесь»(Лк. 12:4). По утверждению отцов нашей Церкви, без прохождения чрез огненную печь страха Божия любовь Божественная не вселяется в душу. Сия Любовь объемлет всю тварь; она соединяет со Всемогущим Владыкой, Богом Любви; она есть Свет, драгоценность, ни с чем не сравнимая. Потерять этот перл – страшно душе. Природа страха Божия неописуема, как все в Боге нашем. Можно как-то говорить об «узле» духовного состояния человека: вера во Христа есть начало Любви, но еще предрассветный Свет. Вера сия пробуждает глубокое покаяние внутри нас и некий страх утерять обретенное сокровище, т.е. Бога. Чрез молитвенный плач раскаяния очищается наше существо, и тогда рождается надежда. Надежда, как большая степень любви к Богу, умножает страх не удостоиться вечного с Ним пребывания. При каждом восхождении духа нашего к большей любви непременно проходим мы чрез умноженный страх. Когда же великая Любовь Христова коснется сердца и ума нашего, тогда в пламени этой святой Любви дух наш объемлет всю тварь великим состраданием любви, и чувство перехода в вечность Божию приобретает непреодолимую силу. Это событие грандиознее всех иных событий в истории падшего мира: Бог соединяется с человеком воедино.'
        cn: '人类科学提供了表达经验的工具，但若无恩典的襄助，却无法传达真正能救赎的知识。对上帝的认识是关乎存有（本体）的认识，而非抽象的理智认识。成千上万的专业神学家获得了高等文凭，但在本质上，在圣灵领域仍是深度的无知者。这是因为他们不按照基督的诫命生活；因此丧失了对上帝的认识之光。上帝是爱。而这爱是通过碎心裂骨的悔改和对上帝的敬畏而获得的：


          「不要惧怕那些杀身体的，以后不能再作什么的……倒要惧怕那杀害之后，有权柄把人扔进地狱里的。是的，我告诉你们，要惧怕祂！」(路加福音 12:4)。


          按照我们教会教父们的 утвер，若不经过对上帝的敬畏之火炉，神圣的爱就不能居于灵魂之中。这爱环抱一切受造物；它使我们与全能的主宰、爱的上帝联合；它是光，是无与伦比的珍宝。失去这珍珠，对灵魂而言是可畏的。对上帝的敬畏的本质是无法言喻的，正如我们上帝中的一切。我们可以勉强地谈论人类灵性状态的「枢纽」：对基督的信仰是爱的开端，但它仍是黎明前的光。这信仰在我们内心唤醒了深刻的悔改，以及某种惧怕，唯恐失去所获得的宝藏，即上帝。通过悔罪的祷告之泪，我们的存有（本质）得以洁净，此时，盼望便得以诞生。盼望，作为对上帝之爱的更高程度，倍增了惧怕，唯恐不配与祂永远同在。每当我们的心灵向上攀升以达至更大的爱时，我们必然会经历倍增的敬畏。当基督的伟大之爱触及我们的心与意时，此时，在这圣爱的火焰中，我们的心灵便以极大的爱的怜悯环抱一切受造物，并且进入上帝永恒的感觉获得了不可抗拒的力量。这一事件比堕落世界历史上所有其他事件都更为宏伟：上帝与人合而为一。'
    - type: paragraph
      text:
        ru: 'Простите меня: я не в силах воплощать в слова «избыток жизни», дарованной нам во Христе. Не вижу, как возможно приступить к тому, чтобы изобразить как-то тот чудесный, при всей парадоксальности, клубок заполняющей сердце жизни. Вот, я ненавижу себя, как я есмь. От этой ненависти к себе молитва становится как бы безумною, всепоглощающею и вырывает меня из всего тварного; переносит дух мой в светоносную беспредельность, неописуемую бездну. Там я забываю горечь тяжкой ненависти к себе: все становится Любовью Бога в тотальном отвлечении от себя. Так странно сплетаются – ненависть к себе с любовью к Богу. То же со страхом: он пожирает меня до большой боли, но Любовь исцеляет эту боль, и я не помню страха. Но когда дух наш возвращается от этого пира Любви Божией во Христе, тогда снова привходит страх удаления от того Света, от той Жизни: не навсегда ли сие?'
        cn: 请原谅我：我无法用言语表达那在基督里赐予我们的「丰盛的生命」。我不知如何才能着手描绘那奇妙、尽管充满悖论、盈满我心的生命之团。看哪，我憎恨我此刻的样式。出于这种对自我的憎恨，祷告变得仿佛疯狂，全然吞噬一切，并将我从一切受造之物中抽离；将我的灵带入光明无垠、莫可名状的深渊。在那里我忘记了对自我的深重憎恨的苦涩：一切都在全然的忘我之中，成为上帝的爱。憎恨自我与爱上帝竟如此奇妙地交织在一起。恐惧也是如此：它吞噬我，带来剧烈的痛苦，但爱医治了这痛苦，我便不再记得恐惧。但当我们的灵从这在基督里上帝之爱的盛宴中回来时，恐惧便再次涌入，害怕远离那光、远离那生命：难道这并非永恒？
    - type: paragraph
      text:
        ru: 'Сам человек не хочет возвращаться в сей мир, но любовь к Богу-Христу неотрывна от любви к ближнему – сочеловеку. Пребывать и действовать в условиях земной повседневности возможно не иначе, как при сниженной благодати. В состоянии крайней напряженности молитвы – как и о чем будешь говорить с людьми, страдающими в борьбе за хлеб и жилище, за семью или супружескую связь, за неудачу в делах или от болезней, своих или дорогих близких душ, и подобное сему? Не поможешь человеку, если презираешь его примитивные нужды. В служении христианском неотступно сострадание любви. Нужно: или принять в свое сердце трудности и горе пришедших, или обратное: войти в их сердце, в их терзания, стать с ними едино. Вынуждаешься стоять при этом в опасности вступить с ними в борьбу, заразиться их спорливостью, раздражиться их противоречиями и непослушанием; нередко же и неприязнью к тебе. Им служишь, им отдаешь приобретенное десятилетиями плача святое достояние, а они тобою же недовольны. Бросить их? Или умирать за них, как умирали все апостолы и их наследники-пастыри?'
        cn: 人自己不愿回到这世上，但对上帝基督的爱与对近人——对同胞——的爱是不可分离的。在世俗的日常生活中存活与行动，唯有在恩典减弱的情况下才有可能。在极度紧张的祷告状态下，你将如何、以及谈论什么来与那些因争夺面包和居所、因家庭或婚姻关系、因事业失败或因自己或亲爱之人的疾病而受苦的人，以及诸如此类的事交流呢？如果你蔑视人原始的需求，你便无法帮助他。在基督徒的事奉中，爱之怜悯是不可或缺的。必须：要么将前来之人的困难与悲伤接纳到自己心中，要么反其道而行之：进入他们的内心，进入他们的痛苦，与他们合一。在此过程中，你被迫身陷险境，可能与他们争斗，被他们的好辩所感染，被他们的矛盾与不顺服所激怒；而且常常，还会面临他们对你的敌意。你服事他们，将你经过数十年哭泣而获得的圣洁遗产奉献给他们，然而他们却对你不满。抛弃他们吗？抑或为他们而死，正如所有使徒及他们的继承者——牧者们——所做的？
    - type: paragraph
      text:
        ru: '«В труде и в изнурении, часто в бдении, в голоде и жажде, часто в посте, на стуже и в наготе... ежедневное стечение людей, забота о всех Церквах. Кто изнемогает, с кем бы я не изнемогал? Кто соблазняется, за кого бы я не воспламенялся?»(2Кор. 11:27–29). И опять он же:«ныне, как и всегда, возвеличится Христос в теле моем, жизнью ли то, или смертью. Ибо для меня жизнь – Христос, и смерть – приобретение. Если же жизнь по плоти доставляет плод моему делу, то не знаю, что избрать. Влечет меня то и другое: имею желание разрешиться и быть со Христом, потому что это несравненно лучше; а оставаться во плоти нужнее для вас. И я верно знаю, что останусь и пребуду со всеми вами, для вашего успеха и радости в вере»(Фил. 1:20–25).'
        cn: «在辛劳与困乏中，常常警醒不寐，在饥渴中，常常禁食，在寒冷与赤身露体中……每日涌来的人群，为众教会的挂虑。谁软弱，我不同他一同软弱呢？谁跌倒，我不为此心如火焚呢？»(哥林多后书 11:27-29)。他又说：「现在，一如既往地，基督都将在我的身体中被尊崇，无论是生是死。因为对我而言，活着是基督，死了是益处。但若在肉身活着，能使我的工作结果子，我就不知道该选择什么了。我被二者所牵引：我渴望离世与基督同在，因为那好得无比；但为你们的缘故，仍旧活在肉身是更有必要的。我确知我必存留，并与你们众人同在，为着你们信心的长进与喜乐。」(腓立比书 1:20-25)。
    - type: paragraph
      text:
        ru: 'В подобном разрыве живут обремененные пастырским служением. С одной стороны ясное сознание, что нет пользы человеку,«если он приобретает весь мир, а душе своей повредит»(ср.:Мр. 8, 36); с другой – повеление Господа:«идите, научите все народы, крестя их во имя Отца, и Сына, и Святого Духа»(Мф. 28, 19).«Даром получили, даром и давайте»(Мф. 10, 8). Параллельно с этим идет мысль: самая насущная нужда людского мира в том, чтобы ЗНАТЬ ИСТИННОГО БОГА (Ин. 17, 3). Но как найти Его? Итак, необходимо, чтобы ЗНАНИЕ Бога пребыло на земле, чтобы люди не блуждали, как овцы без пастыря. Это знание настолько важно, что преп. Исаак Сирии говорит страшную вещь, трудно понимаемую и не без боли воспринимаемую: «Творящих знамения, чудеса и силы в миру не сравнивай с безмолвствующим с ведением. Бездейственность безмолвия возлюби паче, нежели насыщение алчущих в мире и обращение многих народов к поклонению Богу», (преп.Исаака СиринаСлово 56-е, стр.280).'
        cn: 背负牧职重担的人们就活在这种两难之中。一方面，他们清楚地觉悟到，人若赚得了全世界，却赔上了自己的灵魂，又有何益处呢？（参见：马可福音 8:36）另一方面，却是上主的命令：「你们要去，教导万民，奉父、子、圣灵的名给他们施洗。」（马太福音 28:19）「你们白白地得来，也要白白地舍去。」（马太福音 10:8）与此同时，一个念头浮现：人世间最迫切的需要，便是认识真上帝（约翰福音 17:3）。但如何才能寻见祂呢？因此，有必要让对上帝的认识存留在地上，免得人们像没有牧人的羊群一样迷失。这知识是如此重要，以至于圣哉叙利亚的以撒说了一件令人震惊的事，这事难以理解，并非不带痛苦地被领受：「在世间行神迹、奇事和异能者，不要与那以知识而静默者相提并论。你要爱那静默中的无为更甚于在世间使饥者饱足，以及使许多民族归向上帝的敬拜。」（圣哉叙利亚的以撒，《第56篇讲道》，第280页）。
    - type: paragraph
      text:
        ru: 'Возлюбить внешнюю бездейственность безмолвия более, чем насыщение алчущих? Есть два вида алчущих: телесно и духовно.«Наступают дни, – говорит Господь Бог, –когда Я пошлю на землю голод, – не голод хлеба, не жажду воды, но жажду слышания слов Господних. И будут ходить от моря до моря и скитаться от севера к востоку, ища слова Господня, и не найдут его. В тот день истаявать будут от жажды красивые девы и юноши, которые клянутся грехом Самарийским и говорят: «жив бог твой, Дан! и жив путь в Вирсавию!» – Они падут и уже не встанут»(Амос. 8:11–14). Ныне наблюдается повсюду смятение духа, непрестающее возрастать отчаяние. Книг издается как никогда много, но, к сожалению, большинство из них носит характер синкретический, с попытками склеить в единое целое разнородные элементы, часто в самом ядре своем противоречивые и практически несовместимые; откуда умножающаяся растерянность. СвятойИсаак Сиринпокаяние и разумное безмолвие считал наиболее верным путем к глубокому познанию Бога и жизни в Нем. И именно это, что так редко на земле, считал он наиважнейшим делом. Утеря истинного боговедения, данного нам Христом и Духом Святым, была бы ничем не вознаградимым ущербом для всего мира.'
        cn: 爱慕外在的静止静默，甚于饱足饥饿者吗？饥饿者有两种：身体上的和灵魂上的。「日子将到，——上主 上帝说，——我必使饥荒临到地上，人饥饿非因无饼，干渴非因无水，乃因不听上主的话。他们必漂流，从这海到那海，从北边到东边，奔跑寻求上主的话，却寻不着。当那些日子，美貌的处女和少年人必因干渴发昏。那些指着撒玛利亚罪过起誓，说：『但哪，你的神是活的！别是巴的路是活的！』的人，他们必跌倒，永不能再起来。」（阿摩司书 8:11-14）如今随处可见心神不宁，绝望不断加剧。书籍出版之多前所未有，然而，遗憾的是，其中大多数带有混合主义的性质，试图将异质元素拼凑成一个整体，这些元素在核心上常常是相互矛盾且实际上互不相容的；因此，迷茫日增。叙利亚的圣以撒认为，悔改和理性的静默是通向对上帝的深入认识并活在祂里面最可靠的道路。而这正是世上如此稀有之事，他却认为是最重要的事工。失去由基督和圣灵赐予我们的真知上帝之道，将是对整个世界无法弥补的损失。
    - type: paragraph
      text:
        ru: 'Многих встретил я, проходящих серьезный кризис в плане духа. При общении с ними я вспоминал мой кризис, длившийся годами с предельным для меня напряжением. Когда победила во мне молитва, я бросил мою профессию (живописца) и поступил в Богословский Институт в Париже. Там собрались хорошие молодые люди и состав профессоров был на должной высоте. Но меня «душила» молитва день и ночь, и я оставил Институт, чтобы отправиться на Афон, где вся жизнь сосредоточена главным образом на богослужении и молитве. Слушать курсы по церковным наукам было в то время для меня невозможным, так как, отдавая силу внимания моего ума на усвоение преподаваемых предметов, я не находил затем в себе ту цельность устремления к Богу, с которой уже сроднился в предшествующее время. Мне было ясно, что если я жажду познать Бога, то я должен отдать себя Ему в большей мере, чем я отдавался искусству. Вечность Божия влекла меня. Но, покидая Францию, я все же сжигал мосты позади себя, чтобы, в случае колебаний, не смог затем возвратиться к прежнему. Я пережил одну минуту искушения: подымаясь от моря к монастырю, я был атакован мыслью: вот, ты добровольно идешь в пожизненную тюрьму! И это был единственный случай за всю мою жизнь, когда сердце мое на мгновение колебалось. Сейчас я вспомнил о нем, но в течение десятилетий я никак не обращался к прошлому: впереди, безмерно далеко искомое мною, а у меня всего лишь немного быстротекущих дней. Душа моя иссохла в суете этого мира, и мне нужна живая вода, исходящая от Творца моего и «текущая в жизнь вечную». Я пишу и все время удерживаю себя, чтобы не говорить тем языком, который по существу единственно возможен для выражения мучительной боли всего моего состава, в искании моем Бога Спасителя моего. Все тело мое также молилось, сжимаясь тесно воедино. Лоб, крепко прижатый к земле; слезы текли ручьями, горящие, растворяя внутри меня жесткие камни страстей. Печаль сердца моего была сильнее, глубже, чем возможна она при какой бы то ни было потере земной. Я стремился открыть себя Богу всего, до конца. Я умолял Его не отвергнуть меня от Лица Своего; дать мне познать истинный путь к Нему; отстранить от меня всякое заблуждение, могущее отвести меня в сторону. Я знал мою низость, мою скверну, мое невежество, уродство, развращение и изнемогал от видения себя таким, как я есмь. И нужда моя исцелиться силою Духа Святого была подобною нужде молодого, жадно тянущегося к жизни, но нещадно убиваемого какою-либо болезнью. Бог открылся мне еще до ухода в богословскую школу. На Афон я приехал свободный от сомнений в истинности Сына Божия, Который только и может мне открыть Отца Своего. Но я был во аде: Святому Святых невозможно принять такую мерзость. И крик мой об обновлении меня во всех планах моего существа был воплем в пустыне... боюсь сказать – в пустыне космической, не земной. И боль была вневременной.'
        cn: 我遇到许多正在经历严重灵性危机的人。与他们交流时，我回想起我那持续数年，并带给我极度煎熬的危机。当祷告在我里面得胜时，我放弃了我的职业（画家），并进入巴黎的神学研究院。那里聚集着优秀的年轻人，教授团队也达到了应有的高度。但祷告日夜「窒息」着我，我便离开了研究院，前往阿索斯山，那里的全部生活主要集中在礼拜和祷告上。当时，对我而言，听教会科学的课程是不可能的，因为当我将心智的专注力用于吸收所教授的科目时，我便无法再发现自己内心那种对上帝的全然渴慕，那种我在之前已然熟悉和契合的渴慕。我很清楚，如果我渴望认识上帝，我就必须将自己更多地奉献给祂，比我奉献给艺术更多。上帝的永恒吸引着我。但是，在离开法国时，我仍然烧掉了身后的桥梁，以便在动摇时，我无法再回到过去。我经历了一分钟的诱惑：从海边攀登到修道院时，我被一个念头袭击了：「看哪，你正自愿走进一座终身监狱！」这便是我一生中唯一的一次，我的心在那一瞬间动摇了。现在我回想起了它，但几十年来我从未回首过去：在我所寻求的无边遥远的前方，而我拥有的只是些许转瞬即逝的日子。我的灵魂在这个世界的虚妄中枯竭了，我需要活水，源自我的创造主，并「涌流向永生」。我写着，却一直克制着自己，不用那种本质上唯一能表达我整个存有在寻求我的救主上帝时所承受的痛苦的语言。我的全身也一同祷告着，紧密地收缩在一起。额头紧紧贴着大地；泪水如泉涌般流淌，炽热地溶解着我内心诸般情欲的坚石。我内心的悲伤更加强烈，更加深沉，超过了任何世俗损失可能带来的悲伤。我渴望将自己完全、彻底地向上帝敞开。我恳求祂不要将我从祂的面容前弃绝；赐我认识通向祂的真理之道；除去我一切可能引我偏离的谬误。我深知自己的卑劣、污秽、无知、丑陋、堕落，并因看到自己本来的面目而精疲力竭。我被圣灵能力医治的需要，就像一个渴望生命却被病痛无情摧残的年轻人的需要。在进入神学院之前，上帝就已向我启示了祂自己。我来到阿索斯山时，已摆脱了对上帝之子真实性的怀疑，唯有祂才能向我启示祂的父。但我身处阴间：至圣者不可能接纳如此可憎之物。我为我存在各个层面上的更新所发出的呼喊，是在旷野中的哀号……我甚至不敢说——是在宇宙的旷野中，而非尘世的旷野。那痛苦是超越时间的。
    - type: paragraph
      text:
        ru: Пережитое мною, с одной стороны, помогало мне в моем служении как духовника, сначала на Святой Горе, с монахами, затем в Европе, с людьми различных возрастов, психических состояний и интеллектуальных уровней, и с другой – вводило меня в ошибки. Я думал, что все люди стремятся к Богу с одинаковой силой, и в этом была моя ошибка. Судить по себе было не всегда правильным.
        cn: 我所经历的，一方面帮助了我作为神师的事奉，先是在圣山与修士们，后来在欧洲与各种年龄、精神状态和智力水平的人们相处时，另一方面也使我犯了错误。我以为所有人都以同样的热切渴慕上帝，这就是我的错误所在。以己度人并非总是正确的。
    - type: paragraph
      text:
        ru: Глубоким было мое сознание моего убожества, но, несмотря на сие, я не мог отказаться от наложенного на меня духовнического служения. Я его не искал никак. Вообще я ничего не искал в мире сем в то время, потому что все мое существо влеклось к Богу, пред Которым я так тяжко согрешил. Самоосужденный, я умом жил во аде. Лишь моментами я испытывал скорбь от неприязни некоторых отцов и братьев монастыря, вообще же мне было глубоко безразлично, какое положение я занимаю в этом веке, или как ко мне относятся старшие и младшие меня. Я не знал зависти. Не существовало для меня такого общественного или даже и иерархического ранга, который мог бы утолить огонь, пожиравший мою душу. Быть может, присутствие этого огня внутри меня вызывало раздражение некоторых на меня; быть может в силу этого горения мое поведение было не совсем обычным для людей? Кто знает. Только всею силою я нуждался в прощении от Бога и не внимал ничему другому.
        cn: 我深切地意识到自己的卑微，然而，尽管如此，我无法拒绝那加诸于我的神师事奉。我丝毫没有寻求它。那时，我在这世上根本不寻求任何东西，因为我的整个存在都被吸引到上帝那里，在祂面前我犯下了如此严重的罪。自我定罪的，我的心思意念活在阴间。只有在某些时刻，我因修道院里一些教父和弟兄的厌恶而感到忧伤；而总的来说，我内心深处毫不在意我在今生占据何种地位，或长于我者和幼于我者如何待我。我不认识嫉妒。对我而言，不存在任何世俗的，甚至神品等级的位阶，能够止息那吞噬我灵魂的火焰。也许，我内在的这团火焰引起了一些人对我的恼怒；也许，正是由于这股燃烧，我的行为对世人而言才不甚寻常？谁知道呢。我只是竭尽全力地需要来自上帝的赦免，并不理会任何其他事物。
    - type: paragraph
      text:
        ru: 'Незадолго до своей кончины старец Силуан неожиданно для меня однажды сказал: «Когда вы будете духовником, не отказывайтесь принимать приходящих к вам». В тот час я чувствовал себя на краю моих физических сил, будучи изнуренным лихорадкой, которая в легкой форме мучила меня в те годы. Не знал я, сколько времени осталось мне жить, и потому не обратил внимания на слова старца. Я думал: старец не знает, насколько я болен. Действительно, немедленно исчез из моего сознания его завет.'
        cn: 在他安息前不久，西卢安长老有一天出乎我的意料地对我说：「当你成为神师时，不要拒绝接纳前来就你的人。」那时，我感到自己的体力已达极限，当时一种轻微的发热，那些年一直折磨着我，令我精疲力尽。我不知道自己还能活多久，因此没有留意长老的话。我想：长老不知道我病得如此严重。确实，他的遗训立刻从我的意识中消失了。
    - type: paragraph
      text:
        ru: 'Вспомнил я о них через четыре или пять лет, когда, тоже неожиданно, я был приглашен игуменом архимандритом Серафимом быть духовником в их монастыре Святого Павла. Конечно, я за послушание старцу Силуану не возразил ни слова и сказал, что я приду к ним в назначенный день. Выпавший на меня подвиг духовничества коренным образом переменил мою жизнь, но не к углублению, а к потере благодати. Целостность моего прежнего искания была нарушена. Непрерывность пребывания во «внутреннем человеке» ослаблялась сосредоточением внимания на том, что говорили мне приходившие ко мне на исповедь. Я знал, что ТАМ, ВНУТРИ, НАЧАЛО И ТАМ КОНЕЦ И ЗАВЕРШЕНИЕ; ОТТУДА ИСХОД И ТУДА ВОЗВРАТ. Без напряженной молитвы из сердца, не испросив от Бога слово и благословение на всякое время, – суетным будет духовническое служение; без постоянного вразумления Свыше дажеЦерковьпревратится в одну из полуслепых сил мира сего, столкновением которых (сил) вносится разрушение в жизнь вселенной. В чем труд духовника? В тщательной работе над каждым человеком, чтобы помочь ему войти в область мира Христова; содействовать внутреннему возрождению и преображению людей благодатью Святого Духа; сообщить мужество малодушным на подвиг жизни по заповедям Господним. Словом – духовное образование всех и каждого. «Образование» от слова образ. Один сербский епископпрекрасно писал на эту тему: какой или чей образ строится современными школами? Какая из школ знает, что человек создан по образу Бога безначального. И Он явился на земле и открылся человеку; и мы теперь знаем, что истинное образование состоит в том, чтобы восстановить в потомках Адама образ Христа, погубленный в падении.'
        cn: 四五年后，我才回想起他们。那时，我也同样出乎意料地，被院长大司祭塞拉芬邀请，去他们在圣保罗修道院里担任神师。当然，为了顺从长老圣西卢安，我一言未发地应允了，并说我会在指定的那天去他们那里。这降临在我身上的神师之苦修，从根本上改变了我的生命，但并非使我深化，而是使我失去了恩典。我先前寻求的完整性被破坏了。在「内在之人」中持续保持的状态被削弱了，因为我的注意力都集中在了那些前来向我告解的人所说的话语上。我知道，在那里，在里面，是肇始，也是终结和圆满；在那里是源头，也是归宿。若没有发自内心的恳切祷告，若未能时时从上帝那里求得话语与祝福——神师的事奉就会是虚妄的；若没有持续不断的自上而下的训诲，即使是教会，也会变成这世上半盲的力量之一，这些力量的冲突会为宇宙的生命带来毁灭。神师的劳苦何在？在于细致地在每个人身上下功夫，以帮助他进入基督的平安之境；借着圣灵的恩典，促成人们内在的重生与圣变；赐予胆怯者勇气，使其有能力依循上主的诫命去生活，完成此生之苦修。简而言之——就是对所有人的、每个人的属灵教育。「教育」一词源自「形像」。一位塞尔维亚主教对此主题写得极好：「现代学校正在塑造何种形像？或说，谁的形像？哪一所学校知道，人是按照无始无终的上帝的形像被造的呢？而祂降临于世，并向人启示了自己；如今我们知道，真正的教育在于在亚当的后裔中，恢复那因堕落而失去的基督形像。」
    - type: paragraph
      text:
        ru: 'Духовник в своем служении стоит в необходимости всегда молиться за людей, близких и далеких. В этой молитве он погружается в новую для него жизнь. Молясь за тех, что пребывают в отчаянии от непреодолимых трудностей борьбы за существование, он испытывает беспокойство, тревогу за них. Молясь за больных, он ощущает их душевный страх пред смертью. Молясь за пребывающих во аде (страстей), сам он переживает адское состояние. Все сие он живет внутри себя самого, как свою муку. Но в действительности это не он сам: он лишь воспринимает и несет тяготы других лиц. В первый момент он сам не понимает, что же происходит; он в недоумении, почему снова и даже больше прежнего он атакован страстями, многих из которых он не знал в прошлом. Лишь позднее он узнаёт, что введен в борьбу за жизнь других; что молитва его настигла духовную действительность тех, за кого она приносится Богу. Он охвачен дыханием смерти, поразившей человеческий род. И его личная молитва, и литургическая принимают космические измерения. Борьба за жизнь вверенных ему Промыслом Всевышнего иногда длится недолго: несколько слов из сердца к Богу любви; но бывают случаи и длительного состязания. Отдавая свою жизнь, он, духовник, и себя самого еще не живет как совершенно свободного от страстей; он молится за других, как за самого себя, ибо их жизнь слилась с его жизнью. Он кается за себя и за других. Он умоляет о помиловании «всех нас». Его покаяние становится покаянием за весь мир, за всех человеков. В этом движении его духа есть уподобление Христу, взявшему на Себя грехи мира. Тяжка сия молитва: никогда не видится искомый результат: мир в целом отталкивает сию молитву с неприязнью.'
        cn: 灵修导师在他的侍奉中，必须常常为身边的人，也为远方的人祷告。在这祷告中，他沉浸于对他而言新的生命中。为那些因挣扎求生而遭遇难以逾越的困境，从而陷入绝望的人祷告时，他为他们感到不安，感到忧虑。为病人祷告时，他感受到他们面对死亡时的灵魂恐惧。为那些身处地狱（情欲之苦）中的人祷告时，他自己也经历着地狱般的状态。所有这一切，他都在他自己之内经历，视作他自己的磨难。但实际上这并非他自己：他只是感知并承担着他人的重担。起初他自己不明白到底发生了什么；他困惑不解，为何情欲再次侵袭他，甚至比以前更甚，其中许多情欲是他过去未曾认识的。后来他才明白，他已被卷入为他人生命而战的搏斗中；他的祷告触及了那些被献上给上帝之人属灵的实相。他被侵袭人类全族的死亡气息所缠绕。他的个人祷告和礼仪祷告都获得了宇宙性的维度。为那些蒙至高者（上帝）的护理所托付给他的人的生命而进行的搏斗，有时并不长久：几句发自内心给爱之上帝的话语；但有时也存在漫长的较量。在奉献自己生命的同时，他，这位灵修导师，自身也尚未活出完全摆脱情欲的状态；他为他人祷告，如同为自己祷告，因为他们的生命已与他的生命融合。他为自己也为他人忏悔。他恳求施怜悯于「我们所有的人」。他的忏悔变成了为整个世界，为所有人类的忏悔。在他灵魂的这般运行中，存在着对承担世人罪恶的基督的效法。这祷告是沉重的：从未见到所寻求的结果；整个世界都厌恶地排斥这祷告。
    - type: paragraph
      text:
        ru: 'Молитва покаяния неописуемо чудный дар нам Небесного Отца:«Тогда отверз им ум к уразумению Писаний. И сказал им: так написано, и так надлежало пострадать Христу, и воскреснуть из мертвых в третий день, и проповедану быть во Имя Его покаянию и прощению грехов во всех народах...»(Лк. 24:45–47).'
        cn: '悔改的祷告是天父赐予我们无法言喻的奇妙恩赐：

          「于是开启他们的心智，使他们明白圣经。又对他们说：『照经上所写的，基督本该如此受苦，第三日从死里复活；并且人要奉祂的名传悔改与赦罪的道给万民……』」

          （路加福音 24:45-47）'
    - type: paragraph
      text:
        ru: 'Начало проповеди Христа –«Покайтесь, ибо приблизилось царство небесное»(Мф. 4, 17), утерянное нами. Ясно, что это было не иное что, как продолжение начавшегося в раю – великого разговора между Богом и человеком (ср.: Быт. 3и далее). Призываемые Богом к покаянию Адам и Ева отказались признать свою неправду. Ева малодушно обвиняла Змея, Адам же нагло и Еву, и Самого Бога, давшего ему такую жену.'
        cn: 基督讲道的开端——「你们当悔改，因为天国近了」（马太福音 4:17），却被我们遗失了。显然，这不过是在乐园里开始的、上帝与人之间伟大对话的延续（参阅：创世记 3 及以下各章）。被上帝呼召悔改的亚当和夏娃拒绝承认自己的过犯。夏娃怯懦地指责那蛇，亚当却厚颜无耻地，既指责夏娃，也指责上帝本身，是祂赐给了他这样一个妻子。
    - type: paragraph
      text:
        ru: 'Тягуче протекали век за веком; в их нудном течении изведало человечество последствия разрыва с Богом-Отцом. Появились души, приготовленные многообразными страданиями к восприятию отчасти общения с Богом: тогда было дано Синайское Откровение. Чрез закон Моисеев избранные люди жили пред Лицом Невидимого Вседержителя и возросли духом до способности дальнейшего примирения с Ним; и тогда явился во плоти Тот, Кто беседовал с Адамом и Евою в тот день, когда началась трагическая история человечества. Так восстановилось прерванное на тысячелетия наше непосредственное общение с Персоной Творца мира.'
        cn: 漫长世纪缓缓流逝；在其沉闷的流逝中，人类尝遍了与上帝圣父断裂的后果。有灵魂出现了，它们因诸般苦难而预备好去领受部分与上帝的交通：那时，西乃启示便赐下了。借着摩西律法，蒙拣选的人们生活在不可见的全能者面前，并灵性得以成长，达到能进一步与祂和好的地步；于是那时，那一位以肉身显现了，祂曾在人类悲剧史开始的那日与亚当和夏娃交谈。如此，我们便恢复了中断了数千年的、与世界创造者的位格之间直接的交通。
    - type: paragraph
      text:
        ru: 'Господь открыл нам тайны Бытия Божественного и бытия тварного. Но все"Дело"Его (Ин. 17, 4) настолько грандиозно, что ни око ума нашего не может вместить даже деталей его (Дела), ни энергия сердца обнять любовью чудеса Его. В слове на Пасху св.Иоанн Златоустговорит: «Ад огорчился, ибо был низложен: принял тело, но столкнулся с Богом; принял землю, а встретил небо; принял то, что видел, и впал в то, чего не видел». Именно так бывает с нами, когда решаемся последовать Иисусу Христу. Мы видим человека в тварной плоти, но в действительности Он Бог; мы созерцаем Его идущим без сопротивления на неправедную казнь, но узнаём в Нем нашего Творца и Спасителя; мы слышим из Его уст наши обычные слова, но чрез них нам открывается вечность Абсолютного Бытия.'
        cn: 上主向我们揭示了神圣的存有和受造的存有的奥秘。然而，祂全部的「工作」（约翰福音 17:4）是如此的宏伟，以至于我们心智的眼睛连其细节都无法容纳，我们的心灵之力也无法以爱拥抱祂的奇迹。在复活节讲道中，圣约翰金口说道：「地狱忧伤了，因为它被制服了：它接受了身体，却遭遇了上帝；它接受了大地，却遇到了天堂；它接受了它所看见的，却陷入了它所未曾看见的。」当我们决意追随耶稣基督时，我们正是如此。我们看见一个人在受造的血肉之中，但实际上祂是上帝；我们默观祂毫无抵抗地走向不义的处决，但我们在祂里面认出我们的造物主和救主；我们从祂口中听见我们寻常的话语，但藉着这些话语，我们被启示了绝对存有的永恒。
    - type: paragraph
      text:
        ru: 'Чем полнее устремляется дух наш вслед Иисусу Назарянину, тем разительнее становится контраст между Его небесным миром и видимой реальностью нашей вселенной. Одним из первых последствий прародительского падения было братоубийство. И с того времени вся история наша полна преимущественно этим грехом. Естество Всечеловека оказалось разорванным в клочья: встречаясь с себе подобными, люди уже не узнают самих себя: единства всем нам общей жизни. Борясь за свое индивидуальное существование, они убивают братьев, не разумея, что тем же самым жестом погружают и себя в общую смерть. На смену союзу любви в души людей проникла губительная страсть: доминировать над ближними, чтобы обеспечить себе и детям комфортабельную жизнь. В силу этого ослепления весь наш мир погрузился в моря крови, в атмосферу вражды, в кошмар взаимных истреблении. Грех прародителей внес повсюду распад. От одержимости духом братоубийства человечество до сего дня не только не освободилось, но продолжает еще более погрязать в смертоносном дурмане. Опыт веков не научил людей. Победа насилием в этом мире всегда и неизбежно временна; при переходе в вечность она явится нескончаемым позором.'
        cn: 我们的灵越是全然地追随拿撒勒人耶稣，祂那属天的世界与我们宇宙的可见现实之间的对比就越发鲜明。原祖堕落的最初后果之一便是手足相残。自那时起，我们的全部历史就主要充满着这种罪。普世人类的本性被撕裂成碎片：当人们与同类相遇时，他们已无法认出自己——那我们共同生命的合一。为了争取各自的个体生存，他们杀害兄弟，却不明白同样的举动也将自己投入到普遍的死亡之中。取代了爱的结合，一种毁灭性的情欲进入了人们的灵魂：即支配邻人，以确保自己和子女舒适的生活。由于这种盲目，我们的整个世界都沉浸在血海之中、仇恨的氛围之中、相互残杀的梦魇之中。原祖的罪将瓦解带到了各处。人类不仅至今未能从手足相残之灵的附缠中解脱出来，反而继续更深地陷入致命的迷醉之中。历经的岁月并未教导人们。在这个世界上以暴力取得的胜利，总是且必然是暂时的；当进入永恒之时，它将显为无尽的羞辱。
    - type: paragraph
      text:
        ru: «Все вы братья, – сказал Учитель-Христос,  –Один у вас Отец, Который на небесах»(Мф. 23, 8–9).
        cn: 「你们都是弟兄，——基督老师说，——你们只有一位父，祂在天上。」 (马太福音 23:8-9)
    - type: paragraph
      text:
        ru: 'Господь Иисус Христос – самое великое чудо – пришел на землю, чтобы спасти нас; но и Его они убили. Однако «поражение Пастыря» в плане видимом в сфере Духа вечного было несравненной победой (Мф. 26, 31): победой и в страданиях преданной любви, принесшей неувядающий плод. Так будет и с теми, кто последует Его стопам. Любящие Христа сохранят слово Его, и в конце всего они окажутся истинными победителями и упокоются с Ним во царствии Его (ср.:Ин. 16, 33).'
        cn: 主耶稣基督——最大的奇迹——降世是为了拯救我们；但他们竟将祂杀害。然而，「牧者被击打」在可见层面，在永恒圣灵的领域，却是一场无可比拟的胜利（马太福音 26:31）：一场在受苦的奉献之爱中取得的胜利，带来了不朽的果实。凡跟随祂脚步的人也将如此。爱基督的人必持守祂的话语，并且在万事终结之时，他们将显为真正的得胜者，并与祂在祂的国度里得享安息（参：约翰福音 16:33）。
    - type: paragraph
      text:
        ru: Духовническое служение в условиях нашей эпохи – задание сверхчеловеческое. Трудно спасаться в наши дни массовой апостасии. Современники Иисуса«вышли с мечами и кольями, чтобы взятьЕго... но Господь сказал им:теперь ваше время и власть тьмы»(ср.:Лк. 22:52–53).
        cn: 在我们这个时代，灵修指导事奉是一项超乎人力的任务。在如今这个大规模背教的时代，得救实属不易。耶稣的同代人「带着刀剑和棍棒出来捉拿祂……但上主对他们说：现在是你们的时候，也是黑暗掌权的时候」（参：路加福音 22:52-53）。
    - type: paragraph
      text:
        ru: 'Не сгустилась ли еще более сия инфернальная «тьма» в наши дни? Ибо не перестает возрастать отчаяние у насельников нашей планеты, и до крови тяжко молиться за сей мир, как он есть. Приведу одну из моих молитв к Богу Вышнему: Открой сердцу моему тайны Твои; яви мне грешному Твою сокровенную от века Премудрость; Духом Твоим Святым просвети умные очи сердца моего, чтобы мог я узревать Твой благой промысл о всем роде людском даже в самых ужасных событиях современности. Дай душе моей силы терпеливой любви, ибо я изнемогаю в тленной плоти моей от узрения и еще более от слуха о нестерпимых пытках, совершающихся по всей земли над плененными братьями... Ты не раз давал мне уверенность в окончательной победе Света Твоего, и все же – Ты видишь, я изнурен в служении моем.'
        cn: '难道在我们今日，这炼狱般的「黑暗」没有变得更加深沉吗？因为我们这星球的居者们心中绝望不止息地增长，并且为着这世界的现状祷告，艰辛至极，如同淌血。我将呈上我献给至高上帝的其中一个祷告：


          愿祢向我心敞开祢的奥秘；愿祢向我这罪人显明祢那从亘古隐藏的智慧；愿祢以祢的圣灵光照我心智的眼目，使我能得以洞察祢那关乎全人类的神圣护理，即使是在这时代最恐怖的事件中。愿祢赐予我灵魂忍耐的爱的力量，因为我这必朽的肉身因着所见，更因着所闻那些正在全地上施加在我那些被囚弟兄们身上无法忍受的酷刑而力不能支……祢曾不只一次赐予我确信祢之光最终的胜利，然而——祢看，我在我的侍奉中已精疲力竭。'
    - type: paragraph
      text:
        ru: С молодых лет стою я в скорбном недоумении от развертывающейся предо мною картины. Но бывали часы странного торжества, когда крайнее безумие всего удостоверяло меня в неизбежности наличия иного «полюса» в бытии мира – Премудрости. Я не постигал ее, но она вливала в душу надежду преображения твари, и молитва о всем мире возрождалась в сердце, и Свет незаходимый исцелял мою душу.
        cn: 从年轻时起，我便一直处于一种忧伤的迷茫之中，面对展现在我面前的景象。但也曾有过奇异的荣光时刻，那时万物的极度荒谬使我深信，在世界的本有中必然存在着另一个「极」——即圣智。我未曾领悟她，但她将受造物得蒙转化的希望倾注入我的灵魂，为普世的祷告在我心中复苏，而那不灭之光医治着我的灵魂。
    - type: paragraph
      text:
        ru: 'При молитве о людях сердце нередко ощущает духовное или душевное состояние тех, о ком приносится Богу молитва. Благодаря сему, духовник может переживать их «судьбы»: довольство и счастье в любви, изнеможение в трудах, страхи от грядущих на них бедствий, ужасы отчаяния и подобное сему. Вспоминая пред Господом болящих, он духом склоняется над одрами миллионов людей, в каждый данный момент смотрящих в лицо смерти, пребывающих в мучительной агонии. Переводя внимание на умерших, иерей естественно умом идет в тот мир и соучаствует или в спокойной преданности души Богу, или в испуге пред неведомым, поражающем воображение прежде, чем постигнет самый факт ухода из этого мира. И если стояние у постели только одного умирающего в агонии дает нам видение, потрясающее своим контрастом с нашим представлением о первозданном человеке, то мысль духа нашего о всех страдальцах земли становится превышающей меру выносливости нашей психики и даже тела. Для священника и духовника это чрезвычайно ответственный порог: что сотворить? Закрыть ли глаза на все ради нормального всем нам инстинкта самосохранения, или же пойти дальше? Без предварительного подвига глубокого покаяния по дару Свыше это «дальше» недоступно человеку. По существу речь уже идет о следовании за Христом в Гефсиманский сад и на Голгофу, чтобы вместе с Ним, Его силою, жить трагедию мира, как свою ЛИЧНУЮ; сверхвременно и сверхпространственно в духе обнимать сострадательной любовью весь род наш, погрязший в неразрешимых конфликтах. Сердцевина всемирной трагедии в том, что нами забыто и даже отвергнуто изначальное призвание наше. Всегубительная страсть гордости преодолевается только тотальным покаянием, чрез которое нисходит на человека благословение Христова смирения, творящее нас чадами Отца Небесного.'
        cn: 当为他人祷告时，心常常感受到那些为之向上帝呈献祷告之人的属灵或属魂状态。借此，灵修指导者能够经历他们的「命运」：在爱中的满足与幸福，在劳作中的力竭，来自将临于他们身上的灾祸的恐惧，绝望的恐怖，以及诸如此类。在主面前纪念病患之人时，他的灵俯身于千百万人之床榻之上，这些人此时此刻正直面死亡，处于煎熬的临终挣扎之中。将注意力转向已逝之人时，司祭自然地在心智上进入那个世界，并一同经历，或灵魂对上帝的平静奉献，或对未知事物的恐惧，那恐惧在领悟到离开这个世界的真正事实之前便已震撼了想象力。若只是站在一个正在临终挣扎之人的床边，便赐予我们一个景象，这景象以其与我们对原初之人的观念的对比而令人震撼，那么我们灵性的思虑，关于地上所有的受苦者，便变得超越了我们魂性甚至身体的忍耐限度。对于司祭和灵修指导者而言，这是一个极其重大的门槛：该如何行？是对所有这一切视而不见，为了我们所有人正常的自我保存本能，抑或更进一步？若没有事先凭借自上而来的恩赐而作的深刻忏悔功修，这个「更进一步」是人所无法达到的。从本质上说，这已关乎跟随基督进入客西马尼园和各各他，以便与祂一同，借着祂的能力，将世界的悲剧，如同自己的个人悲剧般活出；在灵里超越时间和空间，以怜悯之爱拥抱我们全人类，这人类沉溺于无法解决的冲突之中。世界性悲剧的核心在于，我们遗忘了甚至弃绝了我们最初的呼召。毁灭一切的骄傲之情，唯有通过彻底的忏悔才能克服，借着这忏悔，基督之谦卑的降福便降临于人身上，使我们成为天父的儿女。
    - type: paragraph
      text:
        ru: 'Не только наш психофизический состав отказывается включиться в мироискупительную молитву и жертву любви Иисуса Христа, но и дух наш страшится сего события, и ум не в силах подняться «туда», на гору, высочайшую духовно всех иных гор, где Господь предал Свой дух в руки Отца.«Человекам это невозможно, но не Богу; ибо все возможно Богу»(Мр. 10, 27). Восход «туда» осуществляется без предварительной идеи о сем событии; возносится душа как бы естественным образом в собственной молитве раскаяния о своих грехах, о своем падении, которое единит ее (душу) чрез это состояние со всеми истекшими веками истории человечества, и это вдруг, неожиданно, ненамеренно. В напряженном плаче о себе самой душа, по дару Духа Святого, вводится бытийно в сущность нашего греха в его метафизическом измерении – как выпадения из блаженной нетленной жизни во Свете, исходящем от Лица Отца всяческих. Это не философское созерцание, не интеллектуальное богословствование; это – ФАКТ нашего бытия: в падении Адама человечество оттолкнулось от Бога. Что действительно страшно, так это то что в нашем ослеплении мы не видим нашего греха. Его природа приоткрывается нам чрез веру в Божество Христа.'
        cn: 不仅我们的心理生理构成拒绝融入耶稣基督那赎世的祈祷和爱之牺牲，而且我们的精神也惧怕此事，我们的心智也无法升到「那里」，那属灵上高于所有其他山峦之处，主在那里将祂的灵交于父手。「对于人这是不可能的，但对于上帝则不然；因为在上帝，凡事都是可能的」（马可福音 10:27）。升到「那里」的发生，没有对此事的预先想法；灵魂仿佛自然而然地升华，在她自己为自己罪孽的忏悔祷告中，为她自己的堕落而悔，这状态使其（灵魂）藉着这种情境与人类历史所有已逝的时代联合起来，而这是突然的、意想不到的、并非刻意的。在为她自己而发出的强烈哭泣中，灵魂，藉着圣灵的恩赐，在存有上被引入我们罪的本质，进入其形而上维度中——作为从那蒙福的、不朽的、存在于光中的生命中的坠落，这光出自万有之父的圣容。这并非哲学沉思，并非智性上的神学思辨；这是一个——我们存有的事实：在亚当的堕落中，人类疏远了上帝。真正可怕的是，在我们的盲目中，我们看不见我们的罪。它的本质藉着对基督神性的信仰向我们揭示出来。
    - type: paragraph
      text:
        ru: '«Иисус сказал: Я отхожу, и будете искать Меня; и умрете во грехе своем. Куда я иду, вы не можете прийти... вы от нижних, Я от вышних; вы от мира сего, Я не от сего мира. Потому Я и сказал вам, что вы умрете во грехах своих: ибо если не уверуете, что это Я(Который сотворил вас),то умрете во грехах своих. Тогда сказали Ему: кто Ты? Иисус сказал им: прежде всего, Я то, что и говорю вам»(Ин. 8:21–25).'
        cn: 耶稣说：「我要离去了，你们要寻找我；并且死在你们的罪中。我去的地方，你们不能到。你们是属下界的，我是属上界的；你们是属这世界的，我不属这世界。所以我才对你们说，你们要死在自己的罪中：因为你们若不信我是那一位（就是创造你们的），你们就要死在自己的罪中。」那时他们对祂说：「祢是谁？」耶稣对他们说：「从起初我就是我所告诉你们的。」（约翰福音 8:21-25）
    - type: paragraph
      text:
        ru: 'Так мы познаём, что наш личный грех есть грех всего мира людского. И священническая молитва о прощении грехов миру есть покаяние о всем человечестве. Простите меня: я не вижу словесного подхода к тому, о чем идет речь. Каждый, кто истинно кается в своих преступлениях против любви Отчей, силою Самого Бога переносится в эту таинственную ныне для нас сферу. Я маленький человек, но я принадлежу великому телу всечеловечества и не могу вырвать себя оттуда. Мой грех я сначала живу именно как только мой; но позднее раскрывается для меня, что это ТОТ ЖЕ САМЫЙ ГРЕХ, что описывается в Библии, в книге Бытия (гл. 3). Я ничтожен, но не ничтожно происходящее во мне; не ничтожно и в очах Создавшего меня. Ведь и Он Сам «истощил» Себя до «уничижения», крайнего, непостижимого нам. Он совершил сие, будучи по естеству Своему беспредельно великим Богом; и это – чтобы спасти нас.'
        cn: 如此我们便认识到，我们的个人之罪乃是全人类的罪。并且司祭为世人赦罪的祷告，乃是为全人类的忏悔。请原谅我：我找不到用语言来表述正在论及之事的方法。凡是为自己违背父之爱的罪愆而真实忏悔的人，便借着上帝自身的力量被带入此一如今对我们而言仍是奥秘的境域。我是一个渺小的人，但我属于全人类这个伟大的身体，并且无法将自己从中抽离。我的罪起初我确实只将其视为我自己的；但后来向我显明，这乃是圣经《创世记》（第三章）所描述的那同一个罪。我微不足道，但发生在我里面的事并非微不足道；在创造我的上帝眼中也绝非微不足道。因为祂自己也「虚己」，乃至「降卑」到一种极端的、我们不可测度的地步。祂成就了这事，尽管按其本性祂乃是无限伟大的上帝；而这乃是为了拯救我们。
    - type: paragraph
      text:
        ru: Вот уже многие годы, как я стараюсь внушить обращающимся ко мне, чтобы они воспринимали постигающие их испытания не только в границах их индивидуального существования, но и как откровение о том, чем и как живет и жило истекшие тысячелетия все человечество. Всякое переживание и радости, и боли может стать для нас новым познанием, необходимым для нашего спасения. Когда мы чрез нас самих живем весь мир людской, всю историю человечества, тогда разрываем замкнутый круг нашей «индивидуальности» и выходим на просторы «ипостасной» формы бытия, становясь победителями смерти, причастниками божественной беспредельности.
        cn: 许多年来，我一直努力向那些向我求助的人灌输，要他们将所遭遇的考验，不仅视为其个体生存的范畴，更视为一项启示，揭示了在已逝的千年里，全人类赖以生存和生活的方式与内容。任何经历，无论是喜悦还是痛苦，都能成为我们新的认知，对于我们的救赎而言是必需的。当我们藉着我们自己，活出整个人类世界、整个人类历史时，那么我们就打破了我们「个体性」的封闭循环，进入了「位格」形式存在的广阔境地，成为死亡的得胜者，神圣无限性的参与者。
    - type: paragraph
      text:
        ru: 'Сей дивный путь никому, кроме христиан, неведом. В начале опыт такого исхода из тесной тюрьмы индивида может показаться парадоксальным: сами мы пребываем в страдании, сокрушающем нас, и где найдем силу духа обнять состраданием те миллионы людей, которые в каждый данный момент страдают подобно нам, и быть может, и даже наверное – еще больше? Если у нас радость, это еще как-то доступнее, но когда с нашей болью мы не способны справиться, сострадание же множеству лишь увеличит и без того несносное наше мучение. Однако, проделайте сие, и вы увидите, как в глубоком плаче молитвы о всем страждущем человечестве проявится энергия иного порядка, не от мира сего. Этот новый вид сострадания, нисходящего Свыше, отличается от первого, замкнутого в себе, тем, что оно уже не убивает, а оживотворяет нас. Горизонты нашей личной жизни раздвигаются безмерно, и многие места Евангелия и Посланий становятся понятными, как бы словом о нас самих... больше того: нашим уже словом. Пример:«Всякое наказание в настоящее время кажется не радостью, а печалью; но после наученным чрез него доставляет мирный плод праведности»(Евр. 12, 11). Или:«...взирая на Начальника и Совершителя веры Иисуса, Который, вместо предлежащей Ему радости, претерпел крест, пренебрегши посрамлением, и восселодеснуюпрестола Божия...»(Евр. 12, 2). Открыванием себя для большего страдания в духе преодолеваем наше индивидуальное испытание. Так особенно будет в конце: смертию преодолевается смерть, и обретается сила Воскресения.'
        cn: 这奇妙的道路，除了基督徒，无人知晓。起初，这种从个体狭隘牢笼中解脱的经验可能显得自相矛盾：我们自己身处痛苦，被其击垮，又到哪里去寻得精神力量，以同情拥抱那千百万在当下像我们一样，甚至可能，甚至必然承受更多苦难的人呢？若我们有喜乐，这尚且更容易些；但当我们无法承受自身的痛苦时，对大众的同情只会增加我们本已难以忍受的折磨。然而，请你如此行，你将看见，在为全人类受苦者深切哭泣的祷告中，会显现出一种不同寻常、不属于这世界的能量。这种从天而降的新型怜悯，不同于那第一种自我封闭的怜悯，因为它不再扼杀我们，而是使我们得以活过来。我们个人生命的视野无限拓展，《福音》和《书信》中的许多经文变得易于理解，仿佛是关于我们自己的话语……不仅如此：它们更是我们自己的话语。例如：「凡管教的事，当时不觉得快乐，反觉得愁苦；后来却为那经过锻炼的人结出平安的义果。」（希伯来书 12:11）又如：「……仰望那信德的创始者与成全者耶稣，祂因那摆在前面的喜乐，便忍受了十字架，轻看了羞辱，便坐在了上帝宝座的右边……」（希伯来书 12:2）借由在灵里向更大的苦难敞开自己，我们战胜了自身的个人试炼。在末了尤其如此：借着死亡战胜了死亡，并获得了复活的力量。
    - type: paragraph
      text:
        ru: Всем нам необходимо много молиться, чтобы чрез горячую и многолетнюю молитву, особенно покаянную, трансформировать нашу падшую натуру настолько, чтобы она стала способною усвоить открывшуюся нам Безначальную Истину. И сие прежде, чем мы покинем сей мир. Христос, явивший нам в нашей плоти сию Истину, – влечет нас к Себе и призывает следовать за Ним. Наше вечное с Ним пребывание в Царстве непоколебимом зависит от нашего ответа на Его призыв. Безмерное величие стоящей пред нами задачи наводит страх на сердце наше и ум. Страх любви, потому что мы можем оказаться совершенно недостойными Бога. Страх пред болезненным подвигом, потому что«Царство... СИЛОЮ берется»(Мф. 11, 12). Неописуема сия брань. Побежденному злою гордостью или низкими страстями грозит«тьма кромешная»(ср.:Мф. 8, 12;Мф. 13:41–43). И с другой стороны:«Побеждающему дам сесть со Мною на престоле Моем, как и Я победил, и сел с Отцом Моим на престоле Его. Имеющий ухо да слышит, что Дух говорит...»(Откр.3:21, 22).
        cn: 我们所有人都需要多多祷告，以便通过热切而多年的祷告，尤其是悔罪的祷告，转变我们堕落的本性，使其能够领受那向我们启示的无始真理。这一切须在我们离开此世之前完成。基督，祂以我们的肉身向我们显明此真理，祂吸引我们归向祂，并呼召我们跟随祂。我们与祂在那不可动摇的国度里永恒的同在，取决于我们对祂呼召的回应。摆在我们面前的任务其宏伟浩瀚，令我们的心与灵感到惧怕。这是一种爱的惧怕，因为我们可能全然不配上帝。也是对那痛苦的功修的惧怕，因为「天国……是凭能力夺取的」（马太福音 11:12）。这场属灵争战是无法言喻的。被邪恶的骄傲或卑贱的私欲所胜者，将面临「外面的黑暗」（参阅：马太福音 8:12，马太福音 13:41-43）。而另一方面：「得胜的，我必赐他在我的宝座上与我同坐，就如我得了胜，与我的父一同坐在祂的宝座上。凡有耳的，就当听圣灵所说的话！」（启示录 3:21，22）。
    - type: paragraph
      text:
        ru: 'Нам предстоит грандиозная битва, но битва особая, святая, непохожая на братоубийственные войны, заполнившие историю нашего мира со времени первого убийства Авеля братом его Каином. Общий для всех нас и единственный подлинный враг – наша смертность. Мы должны страдальчески бороться против живущей в нас смерти, начиная с самих себя. Евангелие Господа принадлежит иному плану, высшему, надмирному: все в нем«не по человеку и не от человека»(ср.:Гал. 1:11–12). Преступно умалять его вечные измерения, потому что тогда оно утеряет для людей притягательную силу и даже смысл. Конечно, заповеди Христа:«любите врагов ваших... будьте совершенны, как совершен Отец ваш небесный»– превосходят наш ум и нашу силу. Но Христос в плоти нашей явил сие совершенство: «Онпобедил мир». Значит и нам может быть дана победа, когда мы с Ним. О Своем слове Христос выразился, что оно есть семя:«семя есть слово Божие»(Лк. 8, 11). Пусть пребудет оно в нас как семя не от мира сего; по кончине, попав в родные для него условия, оно даст нетленный плод.'
        cn: 我们将面临一场宏大的争战，但这是一场特殊的、神圣的争战，不同于自该隐杀害其兄弟亚伯以来就充斥着我们世界历史的兄弟阋墙的战争。我们所有人的共同敌人，也是唯一的真正敌人，是我们的必死性。我们必须在受苦中争战，对抗那居住在我们里面的死亡，从我们自己开始。主的福音属于一个不同的、更高、超世的层面：其中的一切「不是出于人，也不是借着人」（参阅：加拉太书 1:11-12）。贬低它永恒的维度是罪过，因为那样它将失去对人的吸引力，甚至失去意义。当然，基督的诫命：「爱你们的仇敌……你们要完全，像你们的天父完全一样」——超越了我们的理智和我们的能力。但基督在我们的肉身中显明了这完全：「他已经胜了世界。」这意味着当我们与他同在时，我们也可以获得胜利。基督论及祂自己的话语时，说它就是种子：「种子就是上帝的道」（路加福音 8:11）。愿它在我们里面存留，如同不属于这世界的种子；在此生终结后，当它进入对它而言固有的环境时，它将结出不朽坏的果实。
- type: heading1
  text:
    ru: Часть Вторая
    cn: 第二部分
  children:
  - type: heading2
    text:
      ru: О молитве Иисусовой
      cn: 论耶稣祷文
    children:
    - type: paragraph
      text:
        ru: В наше время молитва Именем Иисуса становится широко распространенной на всех материках. Многое, написанное о ней, заслуживает серьезного внимания; но параллельно сему было высказано немало нелепых идей. Ввиду этого я решил написать краткий трактат о ней, чтобы, с одной стороны, предупредить благочестивых делателей ее о непроторенных дорогах, и с другой – утвердить основные богословские и аскетические положения этой великой духовной культуры.
        cn: 当今，耶稣圣名祷文正遍布各大洲，广为流传。许多论述它的著述值得严肃对待；然而，与此相伴，也有不少荒谬的观念被发表。有鉴于此，我决定撰写一篇关于它的简短专论，一方面是为了警示虔诚的行持者，使他们不至于误入歧途，另一方面是为了确立这一伟大灵性文化的基本神学与苦修原则。
    - type: paragraph
      text:
        ru: 'Теория сей молитвы может быть изложена на нескольких страницах, но практическое применение ее в христианской аскетике связано с такими трудностями, что с давних времен отцы и учители Церкви всячески убеждали искателей этого образа соединения с Богом приступать к ней со страхом, искать руководителя, прошедшего сей подвиг. Я вовсе не надеюсь исчерпать этот исключительно важный вопрос, но поставил себе ограниченную задачу: представить здесь нечто из того, чему я был научен во время моей жизни на Святой Горе, в монастыре и в пустыне. Совершенно избежать в этой попытке повторений того, о чем уже было написано другими авторами – невозможно. Но, полагаю, подобные повторения не только могут быть не лишними, а даже и необходимыми для освещения предмета в иных контекстах.'
        cn: 这种祷告的理论可以在几页纸上阐述，但其在基督徒苦修中的实际应用伴随着如此多的困难，以至于自古以来，教会教父和教师们极力规劝寻求这种与上帝结合方式的人，要怀着敬畏之心去接近它，并寻求一位已完成此苦修的指导者。我绝不指望穷尽这个极其重要的问题，但我给自己设定了一个有限的任务：在此呈现一些我在圣山、修道院和旷野生活中所学到的东西。在这次尝试中，完全避免重复其他作者已写过的内容——是不可能的。但是，我认为，这样的重复不仅可能不是多余的，而且甚至是必要的，以便在其他语境中阐明这一主题。
    - type: paragraph
      text:
        ru: 'Господь в последние часы Своей жизни с нами сказал:«Доныне вы ничего не просили во Имя Мое; просите и получите, чтобы радость ваша была совершенна... Истинно говорю вам: о чем ни попросите Отца во Имя Мое, даст вам»(Ин. 16:24, 23). Эти слова Христа являются и догматическим, и аскетическим основанием для молитвы Его Именем.'
        cn: '主在祂与我们同在的生命最后几个小时里说：

          「迄今你们没有奉我的名求过什么；祈求，就必得着，使你们的喜乐得以完全……我实在告诉你们：你们无论奉我的名向父求什么，祂必赐给你们」 (约翰福音 16:24，23)。基督的这些话语，是奉祂的名祈祷的教义与苦修基础。'
    - type: paragraph
      text:
        ru: 'Нет сомнений, что ученики Христа соблюдали эту заповедь. Тем более это достоверно, что они уже познали силу Его Имени, когда были посланы, как «агнцы среди волков», нести людям мир, исцелять больных, возвещать приближение Царствия Божия:«Семьдесят учеников возвратились с радостью, и говорили: «Господи, и бесы повинуются нам о Имени Твоем», и другой случай:«мы видели человека, Именем Твоим изгоняющего бесов»(Лк. 10, 17, 9:49). Таким образом, история молитвы Именем Иисуса начинается с апостольских времен. Не сохранились словесные формулы их молений личных, но весь Новый Завет полон свидетельств, что они совершали многие поразительные чудеса сим Именем.'
        cn: '毫无疑问，基督的门徒遵守了这条诫命。更为确凿的是，当他们被派遣如同「羊羔在狼群中」，给人们带来平安，医治病人，宣告上帝之国的临近时，他们已经认识到祂圣名的力量：

          「那七十个门徒欢喜地回来，说：『上主啊，甚至污鬼也因祢的圣名而服从我们。』」另有一次：「我们看见一个人奉祢的名赶鬼。」（路加福音 10:17，9:49）。因此，奉耶稣圣名祷告的历史始于使徒时代。他们个人的祷告词形式未能保留下来，但整部新约圣经充满证据，证明他们借着这圣名行了许多奇妙的奇迹。'
    - type: paragraph
      text:
        ru: Но что значит Имя Божие? Чтобы молиться «во Имя» – нужно ли понимать его значение, его свойства, его природу? Да, необходимо даже, чтобы «радость наша была совершенна».
        cn: 但上帝之名意味着什么呢？为了「奉祂的名」祷告，是否需要理解祂的意义、祂的属性和祂的本质呢？是的，这是必要的，甚至是为了「使我们的喜乐得以完全」。
    - type: paragraph
      text:
        ru: Глубины жизни во Христе – неисчерпаемы; усваиваются они в длительном процессе с великим напряжением всех наших сил. И постижение содержания и смысла Имени Божьего стяжевается лишь постепенно. Обрадовать наше сердце может и мимолетное призывание его; и это ценно. Но не должно останавливаться на полпути. Коротко наше пребывание здесь, и должно использовать каждый час так, чтобы созревало наше познание Бога. Когда же сольются воедино и радость сердца, и свет ума, тогда мы приближаемся к совершенству.
        cn: 在基督里的生命之深奥是取之不尽的；它们是在一个漫长的过程中，倾尽我们所有的心力方能领会的。而对上帝之圣名的内容与意义的领悟，也只能逐渐修得。哪怕是瞬间的呼求其名，也能使我们的心喜悦；而这本身就是宝贵的。但是不应半途而废。我们在此世的居留是短暂的，因此必须利用每时每刻，好让我们的对上帝的认识得以成熟。当心的喜乐与心智之光融合为一之时，那时我们便接近了完全。
    - type: paragraph
      text:
        ru: 'С великой культурой этой молитвы я встретился на Святой Горе. Естественно, я желал учиться у отцов – как они понимают сей важнейший аспект христианской аскетики. Приехал я на Афон в 1925 году. Незадолго перед тем там произошли бурные споры о природе Имени Божьего. В напряжении самих споров, подобных богословской полемике XIV века о природе Фаворского Света, было допущено с обеих сторон немало поступков, которых не должно было бы быть среди людей, предавших свои души в руки Святого Вседержителя. Есть в этой полемике некая аналогия с вековыми распрями между номиналистами и реалистами, идеалистами и рационалистами. По временам они затихают, чтобы затем снова вспыхнуть в иной форме. Наблюдается наличие двух различных естественных расположении: с одной стороны – пророки и поэты; с другой – ученые и технократы. Я не предполагаю останавливаться на внешней стороне происходивших в то время событий, но предпочитаю внимательно всмотреться в существо проблемы, чтобы воспринять нетленное познание, свыше сходящее, которого удостоились святые подвижники, любители умного делания. Жизнь каждого из нас находится в теснейшей связи с нашими представлениями о мире, о нас самих и о Боге. Молитва в своих конечных степенях требует возможно ближайшего познания о подлинном образе Божественного Бытия.«Возлюбленные! мы теперь дети Божии: но еще не открылось(вполне),что будем. Знаем(по опыту),что, когда откроется, будем подобны Ему, потому, что увидим, КАК ОН ЕСТЬ»(1Ин. 3, 2). И мы также знаем из тысячелетнего опыта всего нашего рода, что наш естественный ум, предоставленный самому себе в нашем данном состоянии, не может в своем мышлении о Боге пойти далее некоторых догадок. Необходимо, чтобы Бог Сам явился человеку, дав ему познание о Себе. Подобно тому, как в жизни каждого из нас Бог открывается постепенно, так и в истории человечества, как она представлена в Библии,«многократно и многообразно»(Евр. 1, 1) являлся Он отцам и пророкам с возрастающей силой и глубиной.'
        cn: 我在圣山与这种祷告的深厚文化相遇。自然地，我渴望向教父们学习——他们如何理解基督徒苦修生活这最重要的方面。我于1925年抵达阿索斯山。在此不久前，那里发生了关于上帝之名本质的激烈争论。在这些争论本身的紧张气氛中，类似十四世纪关于塔沃尔之光本质的神学论战，双方犯下了不少本不该存在于那些将灵魂交托给圣全能者手中之人中间的行为。这场论战中存在某种类比，与唯名论者和实在论者、唯心论者和理性主义者之间历时已久的争执相似。它们有时会平息，随后又以另一种形式重新爆发。可以观察到两种不同的自然倾向：一方面是先知和诗人；另一方面是学者和技术官僚。我不打算详述当时事件的表面情况，而是宁愿仔细审视问题的实质，以便领受那自上而来的不朽知识，这是圣苦修者和热爱心智操练之人所获得的。我们每个人的生命，与我们关于世界、关于我们自身和关于上帝的观念有着最紧密的联系。祷告在其最终阶段，要求尽可能地接近认识神性存有之真实样貌。「亲爱的，我们现在是上帝的儿女：但我们将来如何，还未完全显明。我们知道（根据经验），当祂显现时，我们将像祂，因为我们将看见祂的本来面目。」(约翰一书 3:2) 我们也从我们整个族类千年来的经验中得知，在我们当前的状态下，我们凭其自身发展的自然理性，在其关于上帝的思维中，无法超越某些猜测。上帝必须亲自向人显现，赐予他关于祂自身的认识。正如在我们每个人的生命中，上帝是逐渐启示的，同样，在人类历史中，正如圣经所呈现的，祂「多次多方」（希伯来书 1:1）向先祖和先知显现，带着日益增长的能力和深度。
    - type: paragraph
      text:
        ru: 'Первое упоминание о еще неясном призывании Бога:«У Сифа... родился сын, и он нарек ему имя: Енос; тогда начали призывать Имя Господа»(Быт. 4, 26). Затем открывается Бог Аврааму, Исааку и Иакову со все расширяющимся горизонтом:«Являлся Я Аврааму, Исааку и Иакову с именем «Бог Всемогущий», а с именем Моим ЯХВЕ – не открылся им»(Исх.6, 3). Восполнил Бог откровение о Себе:«И сошел Господь в облаке, и остановился близ него(Моисея)и провозгласил Имя ЯХВЕ. И прошел Господь пред лицом его и возгласил:  Господь, Господь, Бог человеколюбивый и милосердый, долготерпеливый и многомилостивый и истинный, сохраняющий [правду и являющий] милость в тысячи родов, прощающий вину и преступление и грех, но не оставляющий без наказания, наказывающий вину отцов в детях и в детях детей до третьего и четвертого рода»(Исх. 34:5–7). Итак, сначала Бог открылся Моисею как ПЕРСОНАЛЬНЫЙ и единственно воистину СУЩИЙ, с неведомыми еще атрибутами. Последующее откровение раскрывало свойства сего АЗ ЕСМЬ как Бога милостивого и человеколюбивого. Но и это было неясным, и Моисей сознавал неполноту усвоенного им познания.'
        cn: 首次提及尚不明晰的对上帝的呼求：「塞特……生了一个儿子，起名叫以挪士；那时人开始求告上主的名」（创世记 4:26）。随后，上帝向亚伯拉罕、以撒和雅各启示自己，其视野日益扩展：「我曾向亚伯拉罕、以撒、雅各显现，称自己为『全能的上帝』，至于我的名『雅威』，我未曾向他们显明」（出埃及记 6:3）。上帝又补充了关于祂自己的启示：「上主在云中降下，停在他（摩西）旁边，宣告雅威之名。上主在他面前经过，宣告说：上主，上主，是有怜悯有恩惠的上帝，不轻易发怒，并有丰盛的慈爱和信实，为千代的人存留 [公义和显明] 慈爱，赦免罪孽、过犯和罪恶，却不以有罪的为无罪，必追讨父辈的罪孽，自子及孙，直到三四代」（出埃及记 34:5-7）。因此，起初上帝向摩西启示自己为一位位格性的、唯一真实存在的上帝，带着当时尚不为人知的属性。随后的启示揭示了这位「我是」的属性，即祂是一位有怜悯和满有慈爱的上帝。但即便如此，这仍是不明晰的，摩西也深知自己所领受的知识是不完全的。
    - type: paragraph
      text:
        ru: 'Пророки также не достигали искомой полноты; но из слов Исаии:«Так говорит Господь, Искупитель... Святой Израилев... Я – Господь первый, и в последних Я – тот же... чтобы вы знали... что это Я: прежде Меня не было Бога, и после Меня не будет»(Ис. 43:14, 41:4, 43:10).  Сей Бог – «Первый и Последний» – открылся как Абсолют Персональный, живой; не как некое отвлеченное «Все-Бытие» или трансперсональное Всеединство и подобное сему. Итак, очевидно, что дух израильских пророков был направлен к Перво-Бытию, к Тому, Кто от Начала. Именно эта установка характерна человеку – образу Абсолюта. Он не останавливается ни на чем, что бы то ни было, промежуточном. Из библейского повествования мы видим, что всякое новое откровение воспринималось, как Богоявление, как Его непосредственное действие. В связи с этим и самое Имя переживалось как Присутствие Бога. В Имени заключена двойная сила: с одной стороны, ощущение Живого Бога, с другой – познание о Нем. Откуда страх призывать Имя всуе (Исх. 20, 7). По мере обогащения откровения о свойствах Божиих, о действиях Его – углублялось и боговедение вообще. Но несмотря на уверенность израильтян, что они избранный народ, что Всевышний открывается им, не прекращался до явления Христа стон пророков в молитве к Богу – придти на землю и дать о Себе воистину полное познание, жажда которого неотъемлема от духа человека.'
        cn: 先知们也未能达到所寻求的完全；但从以赛亚的话语中：「上主——以色列的救赎主，以色列的圣者如此说……我——上主是首先的，在末后的我也是如此……为要使你们知道……是我：在我以前没有上帝，在我以后也必没有。」(以赛亚书 43:14，41:4，43:10)。这位上帝——「首先的与末后的」——启示为一位人格性的、活生生的绝对者；而非某种抽象的「万有存在」，或超人格性的万有合一以及诸如此类的事物。如此，显而易见，以色列先知的精神是导向那原始存有，导向那自起初就存在者。正是这种取向是人的特征——作为绝对者之形像的人。他不会停滞于任何事物，无论是任何中间性的事物。从圣经的叙述中我们看到，每一个新的启示都被视为显现上帝，是祂直接的作为。与此相关，连上帝的圣名也被体验为上帝的临在。在这圣名中蕴含着双重力量：一方面，是对活生生的上帝的感受，另一方面，是对祂的认识。由此产生了妄称上帝之名的敬畏（出埃及记 20:7）。随着上帝属性的启示不断丰富，关于祂的作为，神学知识也普遍加深了。但尽管以色列人确信他们是蒙拣选的民族，且至高者向他们启示自己，在基督显现之前，先知们向上帝的祷告中，那恳求从未停止——求祂降临于世，并赐予关于祂自己的真正完全的认识，对这种认识的渴慕是人类精神不可或缺的一部分。
    - type: paragraph
      text:
        ru: 'Открывался Бог и как Промыслитель, Избавитель, Спаситель и многое иное, но все в умах людей оставалось покрыто вуалью. Иаков в трагический момент своей жизни, возвращаясь от Лавана в родные места, где еще жил брат его Исав, встречи с которым он боялся, ночью, оставшись один вдали от общего стана, боролся с Богом: нелегко прошли годы в дому Лавана; страшна встреча с Исавом. Искал он благословения и защиты, но в напряженной борьбе: состязаясь с Ним, обвиняя Его (Быт. 32, 24).'
        cn: 上帝显明自己是护理者、救赎者、救主以及许多其他方面，但这一切在人们的心中仍然被面纱遮蔽着。雅各在他生命中的一个悲剧性时刻，当他从拉班那里回到故乡时，他的兄弟以扫仍然住在那里，他害怕与以扫相遇。夜晚，他独自一人远离营地，与上帝摔跤：在拉班家中的那些年并不容易；与以扫的相遇令人恐惧。他寻求祝福和保护，但在一场紧张的争战中：与祂较力，责备祂（创世记 32:24）。
    - type: paragraph
      text:
        ru: 'Та же борьба в жизни пророков Илии и Ионы. Первый молился:«Довольно уже, Господи; возьми душу мою, ибо я не лучше отцов моих... возревновал я о Господе Саваофе, ибо сыны Израилевы оставили завет Твой, разрушили Твои жертвенники и пророков Твоих убили мечом; остался я один, но и моей души ищут, чтобы отнять ее»(3Цар. 19:4, 10). Иона же говорил: Господи, Ты послал меня с таким насилием пророчествовать ниневитянам о грядущей на них гибели за их нечестие, зная, что Ты не сделаешь сего с ними, ибо«Ты Бог благий и милосердый, долготерпеливый и многомилостивый, и сожалеешь о бедствии. И ныне, Господи, (когда мое пророчество не сбылось и я посрамлен)возьми душу мою от меня, ибо лучше мне умереть, нежели жить»(Ион. 4:2–3).'
        cn: 先知以利亚和约拿的生活中也有同样的挣扎。前者祷告说：「这已经够了，上主啊；求祢取走我的灵魂，因为我并不比我的列祖更好……我为上主万军之主心怀热切的嫉妒，因为以色列子民离弃了祢的圣约，毁坏了祢的祭坛，又用刀杀了祢的先知们；只剩下我一人，但他们也寻求我的性命，要夺去它。」（列王纪上 19:4，10）约拿却说：「上主啊，祢以如此强制的方式差遣我，向尼尼微人预言因他们的不敬虔而将临到他们的毁灭，而祢明明知道祢不会那样对待他们，因为『祢是恩慈怜悯的上帝，不轻易发怒，且有丰盛的慈爱，并转意不降灾祸。』现今，上主啊，(当我的预言没有应验，而我蒙羞时)求祢取走我的灵魂，因为我死了比活着还好。」（约拿书 4:2-3）
    - type: paragraph
      text:
        ru: 'Еще разительнее случай с Иовом:«Погибни день, в который я родился, и ночь, в которую сказано: «зачался человек»... да омрачит его тьма и сень смертная... да страшатся его, как палящего зноя... Ночь та, да не сочтется она в днях года... да будет она безлюдна; да не войдет в нее веселие. Да проклянут ее проклинающие день... пусть ждет она света, и он не приходит, и да не увидит она ресниц денницы за то, что не затворила дверей чрева матери моей и сокрыла горести от очей моих. Для чего не умер я, выходя из утробы, и не скончался, когда вышел из чрева? ...Теперь бы лежал я и почивал (в великом покое небытия)... там беззаконные перестают наводить страх... малый и великий там равны (в своем ничтожестве) и раб свободен от господина своего. Там узники наслаждаются покоем... На что дан страдальцу свет, и жизнь огорченным душою, которые ждут смерти, и нет ее, которые... обрадовались бы до восторга... что нашли гроб? НА ЧТО ДАН СВЕТ ЧЕЛОВЕКУ, ПУТЬ КОТОРОГО (к познанию Бога) ЗАКРЫТ, И КОТОРОГО БОГ ОКРУЖИЛ МРАКОМ?»(Иов. 3:3–23).'
        cn: '更为惊人的，是约伯的遭遇：

          「愿我出生的那日消亡，愿人说『胎儿成形』的那夜消亡！……愿黑暗和死荫笼罩它……愿人像惧怕烈日酷暑一样惧怕它……那一夜，愿它不被计算在年岁中……愿它荒凉无人；愿欢乐不进入其中。愿诅咒白昼的人咒诅它……愿它等候光明，光却不来，愿它看不见黎明的眼睑，因为它没有关闭我母亲子宫的门，也没有将悲伤从我眼中隐藏。我为何不出母腹就死，不离开母胎就绝气呢？……现在我就会躺卧安息（在虚无的极大平静中）……在那里，作恶之人不再施加恐惧……在那里，渺小与伟大都平等（在他们的虚无中），奴隶摆脱了主人的辖制。在那里，囚犯享受安宁……为何将光赐予受苦者，将生命赐予心中苦闷者？他们等候死亡却得不着，他们……甚至狂喜……因寻得坟墓？为何将光赐予一个人，其道路（通向上帝的认识）被阻断，并且上帝以黑暗环绕他呢？」(约伯记 3:3-23)。'
    - type: paragraph
      text:
        ru: В судьбах наших всегда есть нечто общее с каждым из них. Боролся Израиль с Богом; а кто из нас не борется? Весь мир даже доселе погружен в отчаяние, нигде не находя исхода. В томительном борении вся земля обвиняет Его в страданиях своих. Жизнь – непростая вещь, и нелегко проникнуть в глубинный смысл Бытия.
        cn: 在我们的命运中，总是存在着与他们每个人共通之处。以色列曾与上帝搏斗；而我们当中，谁又不曾搏斗呢？整个世界甚至直到如今都沉浸在绝望之中，任何地方都找不到出路。在痛苦的挣扎中，整个大地都指责祂造成自身的苦难。生命并非易事，并且不容易洞悉存在的深层意义。
    - type: paragraph
      text:
        ru: Дар напрасный, дар случайный,
        cn: 虚空的礼物，偶然的礼物，
    - type: paragraph
      text:
        ru: Жизнь, зачем ты мне дана?
        cn: 生命，你为何赐予我？
    - type: paragraph
      text:
        ru: Иль зачем судьбою тайной
        cn: 抑或，为何以隐秘的命运？
    - type: paragraph
      text:
        ru: Ты на казнь осуждена?
        cn: 你被判处死刑了吗？
    - type: paragraph
      text:
        ru: Кто меня враждебной властью
        cn: 谁将我藉着仇敌的权柄
    - type: paragraph
      text:
        ru: Из ничтожества воззвал,
        cn: 从虚无中召出，
    - type: paragraph
      text:
        ru: Душу мне наполнил страстью,
        cn: 祂以激情充满我的灵魂，
    - type: paragraph
      text:
        ru: Ум сомненьем взволновал?
        cn: 疑虑搅动了心智吗？
    - type: paragraph
      text:
        ru: Так в глубокой горести писал поэт, выражая, по существу, то же, что многострадальный Иов.
        cn: 诗人就在这深切的忧伤中写道，实质上表达了与多受苦难的约伯相同的内容。
    - type: paragraph
      text:
        ru: 'Оставаться всегда подавленным мраком неведения – и унизительно, и отвратительно скучно. Дух наш ищет непосредственной беседы с НИМ, Тем, «Кто меня... из ничтожества воззвал»; Кто нарушил мой покой не-бытия и бросил в эту бессмысленную и даже гнусную трагикомедию. Мы хотим знать: в ком неправда? В нас ли самих, или в Нем, Творце? Нам кажется, что мы пришли в сей мир помимо нашей воли, быть может, против нашего согласия. Помнит ли кто из нас такой момент, когда он был спрошен: хочешь ли родиться в эту жизнь? Открывая, конечно, заранее – какова она. Имели ли мы возможность отказаться от дара сего? Правы ли мы, приписывая «безумие Богу»? (ср.:Иов. 1, 22).'
        cn: 始终被无知的黑暗所压制——这既是屈辱的，也是令人厌恶的乏味。我们的灵渴望与祂直接交谈，祂是那位「把我……从虚无中召唤出来」的；祂打破了我非存在的安宁，并将我投入这无意义甚至可憎的悲喜剧中。我们想知道：谁是不义的？是我们自己，还是祂，造物主？我们觉得，我们来到这世界并非出于我们的意愿，也许是违背我们的同意的。我们中有谁记得这样一个时刻，当他被问到：你愿意出生到这个生命中来吗？当然，是事先揭示它会是怎样的。我们是否有机会拒绝这份礼物呢？我们将「愚妄归于上帝」是否正确呢？(参：约伯记 1:22)。
    - type: paragraph
      text:
        ru: Вот, я слышу иной голос:«Я свет миру; кто последует за Мною, тот не будет ходить во тьме, но будет иметь свет жизни»(Ин. 8, 12).«Кто жаждет, иди ко Мне, и пей. Кто верует в Меня, у того... из чрева потекут реки воды живой»(Ин. 7:37, 38). Не принять ли мне с верою этот призыв Христа и действительно бороться за достижение Царства непреложной любви Отца; идти путем, который Он, Христос, указал нам? Если нам не дано сотворить ничего из «ничто», то и сама идея о вечности не может родиться в нас. Ее присутствие в нас было бы онтологически невозможным. Внимательно наблюдая за ходом окружающей нас действительности, мы замечаем, что всякая реальная нужда имеет в космическом бытии возможность удовлетворения, только нужно найти доступ к сему средству. В истории научного прогресса многие казавшиеся чрезмерно дерзновенными идеи – осуществились ныне на наших глазах. Почему бы мне усомниться, что и моя жажда блаженного бессмертия и вечного единения с Творцом также осуществима?
        cn: '看哪，我听见另一个声音说：「我是世界的光；跟从我的，就不在黑暗里走，必要得着生命的光。」(约翰福音 8:12)


          「人若渴了，可以到我这里来喝。信我的人，从他腹中要流出活水的江河来。」(约翰福音 7:37，38)


          我岂不当凭着信心接受基督的这个呼召，并且真正地为着达到天父那不变之爱的国度而奋斗；走祂，就是基督，为我们所指明的道路呢？如果我们无法从「无」中创造出任何东西，那么关于永恒的观念本身也无法在我们心中产生。它在我们当中的存在，在本体论上将是不可能的。仔细观察我们周围现实的进程，我们注意到，每一种真实的需要，在宇宙的存有中都有得到满足的可能，只是需要找到通达此种手段的途径。在科学进步的历史中，许多看似过于大胆的想法，如今已在我们眼前实现。我为何要怀疑我的对福乐永生以及与造物主永远合一的渴望也是可以实现的呢？'
    - type: paragraph
      text:
        ru: 'Как радикально меняется все, когда вдруг раскроется сердце принять призыв Христа. Каждый момент становится драгоценным, исполненным глубокого смысла. И страдания, и радости – чудно сливаются с новым подвигом. Лестница до небес – пред нашими глазами.«Отныне имя тебе будет... Израиль, ибо ты боролся с Богом, и человеков будешь одолевать»(Быт. 28, 12;Быт. 32– 29). А об Имени Моем не спрашивай, ибо оно чудно, и ты еще не способен воспринять Его. И все же ты благословен.«И взошло солнце... и хромал он на одно бедро»: путь к познанию совершенному еще не открылся, но предвидение было уже дано. Оно будет углубляться в сознании пророков, и будут сказаны многие пламенные глаголы о долженствующем придти Предвечном Слове Отца; и совершенный Свет, в котором нет ни единой тьмы, явится нам во всей силе Своей.'
        cn: 当心突然敞开以接受基督的呼召时，一切是何等彻底地改变。每一个时刻都变得宝贵，充满深意。痛苦与喜乐，奇妙地与新的属灵争战融为一体。通往天堂的天梯就在我们眼前。「从今以后你的名字将是……以色列，因为你与上帝角力，并且你将胜过人。」（创世记 28:12，创世记 32:29）至于我的名，你不要询问，因为它是奇妙的，你还不能领受祂。尽管如此，你是蒙福的。「太阳升起……他就瘸了一条腿」：通向完全认识的道路尚未开启，但预见已经赐予。它将在先知们的意识中深化，并且将有许多炽热的言语被宣讲，论及那将要来临的、父的永恒圣言；以及那全然的光，其中没有一丝黑暗，将以祂完全的力量向我们显现。
    - type: paragraph
      text:
        ru: 'Рискованна борьба с Богом: она может привести к погибели, но она же может сделать нас могущими побеждать «ветхого человека», изуродованного люциферической гордостью. Побеждать смирением:«И человеков будешь одолевать». Как? Смирением.«И сказал Иаков: Боже отца моего Авраама и Боже отца моего Исаака... Избавь меня от руки брата моего Исава, чтобы он, пришедши, не убил меня и матери с детьми»(Быт. 27, 41;Быт. 32–11).«Взглянул Иаков, и увидел, и вот, идет Исав, и с ним четыреста человек... и пошел (Иаков)... и поклонился до земли семь раз, подходя к брату своему. И побежал Исав к нему навстречу, и обнял его, и пал на шею его, и целовал его, и плакали»(Быт. 33– 4). Смягчился Исав, ненавидевший Иакова, обманом похитившего принадлежавшее ему благословение отца их Исаака. В Иакове-Израиле нам дан образ смиренного покаяния.'
        cn: '与上帝的搏斗充满风险：它可能导致灭亡，但它也能使我们有能力战胜被路西法式傲慢所摧残的「老我」。藉着谦卑得胜：「你将胜过人。」如何？藉着谦卑。


          「雅各说：『我祖亚伯拉罕的上帝啊，我父以撒的上帝啊……求祢救我脱离我哥哥以扫的手，免得他来杀我，以及母亲和孩子们。』」(创世记 27:41，创世记 32:11)。


          「雅各举目观看，看哪，以扫来了，他带着四百人……(雅各)走上前去……并且在走到他哥哥面前时，七次俯伏于地。以扫跑来迎接他，抱住他，伏在他颈项上亲吻他，两人都哭了。」(创世记 33:4)。


          以扫的心软化了，他原是憎恨雅各的，因雅各曾以诡计夺取了他们父亲以撒本应属于以扫的祝福。在雅各，即以色列，身上，我们得到了一个谦卑悔改的榜样。'
    - type: paragraph
      text:
        ru: Переживаемый во всем мире духовный кризис не есть ли приготовление к новому великому возрождению? Ведь то, что совершается ныне в душах отдельных людей, может произойти и во множестве душ. И это может придти, как мощный потоп; как ослепительная молния в полуночной тьме. Данный нам отрезок истории может и должен был бы стать периодом усвоения нами бытия во всех его измерениях. Самые страдания наши становятся во свете этой надежды развертыванием пред нами величественной картины:«День дню передаетглагол,и ночь ночи открываетразум"(Пс. 18, 3), если проведены в молитве, которая достигает «пределов вселенной»... «от края небес исход ее (молитвы), и движение ее до края их, и ничто не укрывается от теплоты ее» (молитвы). Она и нас согревает и веселит. Она есть канал, по которому сообщается откровение Свыше.
        cn: '全世界正在经历的属灵危机，难道不是为一次新的伟大复兴所做的准备吗？因为如今在个别人心中所成就的，也可以在众多的心中发生。它可能降临，如同汹涌的洪水；如同午夜黑暗中刺眼的闪电。赐予我们的这段历史，能够且理应成为一个让我们领受存在的全部维度的时期。在这希望的光照下，我们的苦难本身也成为了在我们面前展开的宏伟画卷：

          「白昼向白昼宣讲言语，黑夜向黑夜启示知识」(诗篇 18:3)，如果是在祷告中度过的，这种祷告能达到「宇宙的极处」……「它的发源从天边而来，它的运行直到天边，没有什么能躲避它的热力」(祷告)。它也温暖我们，使我们喜乐。它是管道，借此从上而来的启示得以传达。'
    - type: paragraph
      text:
        ru: «Да будет Имя Бога нашего благословенно отныне и до века».
        cn: 愿我们上帝的圣名被称颂，从今时直到永远。
    - type: paragraph
      text:
        ru: 'Последовательность откровения о Боге, представленная в Священном Писании, в значительной мере совпадает с процессом нашего личного прогресса – возрастаем мы в познании подобно праотцам и отцам нашим: сначала люди схватывают понятие о Высшем Существе. Затем все новые и новые атрибуты Его становятся познаваемыми для человеческого духа; и так приходит час страшного синайского"АЗ ЕСМЬ"(Быт. 22, 14). В последующие века углубляется опыт и разумение, хотя и не достигает еще совершенства, доколе не придет Ожидаемый.'
        cn: 上帝启示的顺序，在圣经中呈现，在很大程度上与我们个人进步的过程相符——我们在认知中成长，就像我们的列祖和父辈们一样：首先人们领会了至高存在的概念。接着，祂一个个新的属性变得可为人类的灵所认知；于是就来到了令人敬畏的西奈山上的「我就是」时刻（创世记 22:14）。在随后的几个世纪里，经验和领悟得以深化，尽管尚未达到完全，直到那受期待者到来。
    - type: paragraph
      text:
        ru: 'Тот, Кто превыше всякого Имени в своей Сущности, раскрывается сотворенным «по образу» разумным существам во множестве имен: Вечный, Всеведущий, Всемогущий, Вседержитель; Свет, Жизнь, Красота, Мудрость, Благость, Истина, Любовь, Праведный, Спасающий, Святый, Освящение и другие. В каждом из них и чрез каждое из них мы испытываем прикосновение к нам Единого Бога, и в силу Его неделимости мы имеем Его всего. Так достойно мыслить, но вместе с тем ни одно из них не дает нам полноты постижения, «как Он есть». Его Бытие в своей сущности превосходит все Имена. И все же Он продолжает открываться в Именах.'
        cn: 这位在其本体中超乎一切名号的，向那些被造「照其肖像」的理性受造物，在众多名号中显明自身：永恒者、全知者、全能者、掌管万有者；光、生命、美、智慧、良善、真理、爱、公义者、拯救者、圣者、圣化及其他。在每个名号中，并借由每个名号，我们都体验到独一上帝对我们的触及，且因其不可分割性，我们拥有祂的全然。如此思考是合宜的，但与此同时，这些名号无一能让我们全然领悟「祂的所是」。祂的本体存在超乎一切名号。然则，祂仍继续在名号中显明自身。
    - type: paragraph
      text:
        ru: 'Двадцать веков тому назад по нашему счислению пришел Он, ТОТ, Кого ожидали народы, Логос Отца. Надмирный в Своей Сущности Творец нашего естества – воспринял«образ раба, сделавшись подобным (нам) человекам, и по виду став, как человек»(Фил. 2, 7). Безначальное Слово Отца«стало плотью и обитало с нами»(Ин. 1, 14). Вечный проявил Себя во времени. Откровение принесло нам новое Имя: ИИСУС, Спаситель, или БОГ-СПАСИТЕЛЬ. Великий Свет вошел в жизнь мира. Наступила новая эпоха. Священною была история от Адама до Моисея; священна она с момента синайского богоявления; тем более священна с момента пришествия Христа.'
        cn: 按照我们的纪年，二十个世纪以前，祂来了，万民所期盼的那一位，父的道。在祂的本体中超乎世界，我们本性的创造者——取了「奴仆的形像，成为与人相似的，并外形上像一个人一样」（腓立比书 2:7）。父那无始的道「成了肉身，并居住在我们中间」（约翰福音 1:14）。永恒者在时间中显明了自己。启示带给我们一个新的名字：耶稣，救主，或 上帝-救主。伟大的光进入了世界的生命中。一个新的纪元到来了。从亚当到摩西的历史是神圣的；从西奈山上帝显现的那一刻起，它就是神圣的；从基督降临的那一刻起，它就更加神圣了。
    - type: paragraph
      text:
        ru: Были и ранее того идеи о Боге-Спасителе, но с иным содержанием, в ином измерении, с несравненно меньшей конкретностью.«Народ, сидящий во тьме, увидел свет великий, и сидящим в стране и тени смертной воссиял свет»(Мф. 4, 16).
        cn: '甚至在那之前也有关于上帝-救主的观念，但其内涵不同，维度不同，具体性也无可比拟地更少。

          «坐在黑暗里的百姓看见了大光，坐在死荫之地的人，有光照耀他们.» (马太福音 4:16)'
    - type: paragraph
      text:
        ru: 'Имя Иисус прежде всего открывает нам смысл или цель прихода Бога во плоти: «нашего ради спасения». Восприятие Богом нашего естества указывает на возможность и для нас стать сынами Бога. Наше сыноположение заключается в сообщении нам божественной формы бытия:«В Нем обитает вся полнота Божества телесно»(Кол. 2, 9). По вознесении Он восселодеснуюОтца и уже и как Сын Человеческий. Вот как говорит Он сам:«Славу, которую Ты дал Мне, Я дал им, да будут едино, как мы едино. Я в них, и Ты во Мне: да будут совершены воедино, и да познает мир, что Ты послал Меня, и возлюбил их, как возлюбил Меня. Отче! которых Ты дал Мне, хочу, чтобы там, где Я, и они были со Мною, да видят славу Мою, которую Ты дал Мне, потому что возлюбил Меня прежде сложения мира... Я открыл им Имя Твое и открою, да любовь, которою Ты возлюбил Меня, в них будет, и Я в них»(Ин. 17:22–26).'
        cn: 耶稣之名首先向我们揭示上帝道成肉身的意义或目的：「为我们的救赎」。上帝取受我们的人性，指明了我们也能成为上帝之子的可能性。我们的嗣子地位在于将神圣的存有形式传达给我们：「上帝一切的丰盛，都有形有体地居住在祂里面」（歌罗西书 2:9）。升天之后，祂坐在了父的右边，并且，也是以人子的身份。祂自己是这样说的： 「祢赐给我的荣耀，我已赐给他们，使他们合而为一，正如我们合而为一。我在他们里面，祢在我里面：使他们完完全全地合而为一，让世人知道是祢差遣了我，并且爱他们，如同爱我一样。父啊！祢所赐给我的人，我愿我在哪里，他们也同我在那里，让他们看见祢所赐给我的荣耀，因为祢在创立世界以前就已经爱我了……我已将祢的名指示他们，并且还要指示他们，好使祢爱我的爱在他们里面，我也在他们里面。」（约翰福音 17:22-26）
    - type: paragraph
      text:
        ru: 'Ум наш в удивлении замолкает пред этой тайной: Творец облекся в тварное; Вечный и Невидимый воспринял на Себя временную и изменчивую форму бытия; Дух, стоящий далее всякой мысли – соделался плотью и дал нам возможность осязать Его руками, взирать на Него телесными очами; Бесстрастный подвергся страданиям; Жизнь безначальная связала Себя с умиранием.'
        cn: 我们的心智在这奥秘面前惊叹地默然无声：造物主披戴了受造之物；永恒且不可见者亲自取了暂时且会改变的存有形式；超乎一切思念的灵——成了肉身，并赐予我们用手触摸祂、用肉眼瞻仰祂的可能；无受难者承受了苦难；无始的生命使自己与死亡相连。
    - type: paragraph
      text:
        ru: 'Философствующий ум, предоставленный самому себе, не может согласиться с евангельской проповедью: для него это безумие. Абсолют философов от своих творцов не получил разрешения истощать себя даже до рабьего зрака (ср.:Фил. 2, 7). Воображаемый ими Абсолют, по существу, есть небытие (в полном смысле этого слова). До пришествия Христа были умы, создававшие весьма увлекательные теории о таком отвлеченном Абсолюте; и для нас не ново появление в наши дни тех же тенденций. К сожалению, многие становятся жертвой этой духовной аберрации. Великий Павел воспел в связи с этим гениальный гимн:«...написано: погублю мудрость мудрецов, и разум разумных отвергну... ибо... благоугодно было Богу безумием проповеди спасти верующих. Ибо и иудеи требуют чудес, и еллины ищут мудрости; а мы проповедуем Христа распятого, для иудеев соблазн, а для еллинов безумие. Для самих же призванных... Христа, Божию силу и Божию Премудрость. Потому что безумное Божие мудрее человеков, и немощное Божие сильнее человеков»(1Кор. 1:19–25).'
        cn: 沉溺于哲学的思辨之心，若听凭自身，无法认同福音的宣讲：对它而言，这乃是愚妄。哲人所构想的「绝对」，并未获得其创造者的许可，来倾空自己，甚至降至奴仆的形像（参：腓立比书 2:7）。他们所设想的「绝对」，就其本质而言，乃是虚无（在完全意义上）。在基督降临之前，曾有心智创立了关于这等抽象「绝对」的引人入胜之理论；而当今出现同样的倾向，对我们而言并非新鲜事。遗憾的是，许多人成为了这种属灵偏差的牺牲品。伟大的保罗就此吟唱了一首非凡的赞美诗：「……经上记着说：『我要灭绝智慧人的智慧，废弃聪明人的聪明。』……因为上帝乐意藉着宣讲的愚妄，拯救那些相信的人。因为犹太人要求神迹，希腊人寻求智慧；而我们却是宣讲被钉十字架的基督，这对犹太人是绊脚石，对希腊人是愚妄。然而，对那些蒙召的……基督，上帝的能力和上帝的智慧。因为上帝的愚妄比人更智慧，上帝的软弱比人更强壮。」（哥林多前书 1:19-25）
    - type: paragraph
      text:
        ru: «Слово стало плотью и обитало с нами»(Ин. 1, 14). Мы не постигаем, как это возможно, но не исключаем, что Тот, Кто сотворил наше естество, мог воспринять сие в Свою Ипостась. Он не воспринял новую, иную ипостась, человеческую; пребывая в Своей извечной Ипостаси Бога, Он соединил в Ней Божескую природу с природой тварной. Во плоти явил нам совершенство Отца, с исключительной силой показал совместимость Бога и Человека.
        cn: 「圣言成为血肉，居住在我们中间」（约翰福音 1:14）。我们无法领悟这如何可能，但我们不排除创造我们本性的祂，能将此纳入祂的位格之中。祂并未取受一个新的、不同的、人类的位格；祂仍留于自己永恒的上帝位格之中，在其中，祂将神性与受造本性联合起来。祂在血肉之躯中向我们显明了父的完全，并以非凡的力量展现了上帝与人的相容性。
    - type: paragraph
      text:
        ru: 'Христос принес нам познание Святой Троицы: Отца и Сына и Святого Духа. Моисей под Именем ЯХВЕ – АЗ ЕСМЬ разумел единую Персону. Слово и Дух для него являлись энергиями Единого Сущего. Нам же открыто, что и Логос, и Дух – суть Ипостаси, равнодостойные Отцу: Единый в своей сущности – множествен в Ипостасях. Образ сего Бога: Единая природа Человека во множестве ипостасей.'
        cn: 基督带给我们对圣三一的认识：圣父、圣子和圣灵。摩西借着名号雅威——我是自有永有的，理解为一个独一的位格。对他而言，圣言和圣灵是独一存有者的能量。但对我们而言，圣言和圣灵则被启示为与圣父同等尊荣的位格：其本质为一，其位格为多。这位上帝的形象是：人类的独一本性存在于多个位格之中。
    - type: paragraph
      text:
        ru: Имя «АЗ ЕСМЬ» в силу единства Бога приложимо и ко всей Троице и к каждой Ипостаси отдельно. Как и многие другие Имена, и сие может и должно быть понимаемо и как общее (нарицательное) Имя, и как собственное каждому Лицу. Подобно тому, как Имя «Господь» относится ко всем трем Лицам и вместе служит как собственное Имя каждого из трех Лиц. То же возможно сказать и о Имени ИИСУС – т.е. Бог Спаситель. Но в опыте молитвы мы употребляем сие Имя ИИСУС исключительно как собственное Имя Христа, Второго Лица Святой Троицы.
        cn: 「自有永有」这个名字，因上帝的独一性，既适用于整个三位一体，也分别适用于每个位格。如同许多其他名字一样，这个名字既可以也应该被理解为一个普遍（或称谓性）的名字，也可以被理解为每个位格的专有名字。类似于「上主」这个名字，它既适用于三位一体的所有位格，同时又作为每个位格的专有名字。关于「耶稣」这个名字——即「上帝拯救者」——也可以这样说。但在祷告的经历中，我们只将「耶稣」这个名字作为基督，圣三位一体的第二位格的专有名字来使用。
    - type: paragraph
      text:
        ru: 'В древности познание о Божестве давалось человеческому духу чрез Имена, открывавшие главным образом свойства Божии, атрибуты: могущество, вездеприсутствие, всеведение, промысл, славу и подобное. Моисею же Имя ЯХВЕ было дано как собственное Имя. Чрез воплощение Логоса Отца мы соприкасаемся с Богом в такой форме, в такой полноте, что не ждем уже дальнейших восполнений, но нуждаемся только в подвиге жизни по заповедям, чтобы воспринять дар в его подлинных измерениях: Он жил с нами, в условиях нашего падения; Он говорил нам на нашем языке; Он снизошел до нас в такой степени, что мы Его осязали; Он в видимом зраке явил нам Невидимого Отца в совершенстве; Он открыл нам все, что касается отношений между Богом и человеком. Принесенное Им спасение имеет исключительно конкретный характер. Свою проповедь Он начал с призыва:«Покайтесь, ибо приблизилось Царство небесное»(Мф. 4, 17). В этой проповеди мы усматриваем продолжение Его беседы с Адамом в раю (Быт. 3и далее).'
        cn: 在古时，对神性的认识是借着圣名赐予人类精神的，这些圣名主要启示了上帝的属性：能力、无所不在、全知、神圣旨意、荣耀等等。然而，雅赫维这圣名是作为专有圣名赐予摩西的。借着父上帝圣言的道成肉身，我们以这样一种形式、这样一种圆满与上帝相会，以至于我们不再期待进一步的补充，而只须要在遵守诫命的生活中进行属灵的挣扎，以便在恩赐的真实维度中领受它：祂与我们同住，在我们堕落的境况中；祂用我们的语言向我们说话；祂降卑到我们这里，到了如此程度，以至于我们能够触摸到祂；祂在可见的形象中完美地向我们彰显了那不可见的父上帝；祂向我们启示了一切关乎上帝与人之间关系的一切。祂所带来的救赎具有极其具体的性质。祂以呼召开始了祂的讲道：「你们要悔改，因为天国近了」（马太福音 4:17）。在这讲道中，我们看到了祂在乐园中与亚当对话的延续（创世记 3章及以后）。
    - type: paragraph
      text:
        ru: 'Велико Имя АЗ ЕСМЬ; велико Имя Святой Троицы; так же велико и Имя ИИСУС. О Его Имени возможно сказать многое: оно неисчерпаемо в своем содержании; оно принадлежит Тому, Кому все сущее обязано своим бытием:«Все чрез Него начало быть, и без Него ничто не начало быть, что начало быть. В Нем жизнь, и жизнь была свет человеков»(Ин. 1– 4). Он – «в начале»; т.е. Он есть принцип всего мироздания. Во внутритроичной жизни Он обращен к Отцу; в акте же творения тот же Логос обратился к сотворенным по образу Его.'
        cn: 伟大的名是『我是那我是』；伟大的名是圣三一；同样伟大的也是耶稣的名。关于祂的名，可说的有许多：其内涵取之不尽；它属于那万有都因祂而得以存在者：「一切都是藉着祂造的；凡被造的，没有一样不是藉着祂造的。在祂里面有生命，这生命就是人的光」(约翰福音 1:3-4)。祂是『在起初』的；即，祂是整个创世的本源。在圣三一的内在生活中，祂面向着父；而在创造的行动中，同一位逻各斯则转向了那些按祂的肖像被造之物。
    - type: paragraph
      text:
        ru: 'Имя Иисус и как смысл-познание, и как «энергия» Бога по отношению к миру, и как собственное Имя Его – онтологически связано с Ним. Оно есть духовная реальность; Его звуковая сторона может сливаться с его реальностью, но не обязательно. По звуку оно давалось многим смертным, но когда мы молимся, мы произносим его с иным содержанием, с иной установкой духа нашего. Оно для нас – мост между нами и Им; оно канал, по которому к нам приходят потоки божественной силы. Как исшедшее от Святого Бога – оно свято и освящает нас чрез призывание его. С этим Именем и чрез него молитва принимает некую осязаемость: оно соединяет нас с Богом. В нем, этом Имени, присутствует Бог, как в некоем сосуде – драгоценной вазе, полной благоухания. Чрез него Надмирный становится ощутимо имманентным. Как божественная энергия – оно исходит от Сущности Божества и божественно само по себе.'
        cn: 耶稣之名，既作为意义-认知，又作为上帝对世界的一种「能量」，亦作为祂本身的圣名，在本体论上与祂相连。它是一种属灵的实在；它的声音层面可以与它的实在融合，但并非必然如此。按其发音，它曾被赋予许多凡人，但当我们祷告时，我们以不同的内涵，以我们心志的另一种设定来诵念它。对我们而言，它是我们与祂之间的桥梁；它是一个渠道，借此，神圣力量的洪流涌向我们。作为从圣洁上帝所发出的，它本身是圣洁的，并借着对它的呼求来圣化我们。借着这名并经由它，祷告获得某种可感性：它使我们与上帝连结。在这名之中，上帝临在，如同在一个容器中——一个充满芬芳的珍贵花瓶。借着它，超越世界的（那位）变得可感知地内在于我们。作为神圣能量，它源自上帝的神性本体，并且其本身就是神圣的。
    - type: paragraph
      text:
        ru: Когда мы молимся с сознанием изложенного выше, молитва становится и страшным, и в то же время торжественным актом. В древности была дана заповедь – не призывать Имени Бога всуе; Господь же дал заповедь и обетование «просить Отца во Имя Его». Все Имена Божии раскрылись нам чрез пришествие Христа в их более глубоком значении, и мы должны были бы трепетать, как это происходит со многими подвижниками, среди которых мне довелось жить, произнося Святое Имя Иисуса. Дерзко сказать, что и я мог бы быть свидетелем живым, что достойное призывание сего Имени делает присутствие Вечного Бога заполняющим все наше существо; уносящим ум в иные сферы; сообщающим нам особую энергию новой жизни. Свет Божественный, о котором нелегко говорить, приходит с этим Именем.
        cn: 当我们带着对以上所述的意识祷告时，祷告就变得既是可畏的，同时也是庄严的行动。在古时曾赐下诫命——不可妄称上帝的圣名；而上主却赐下诫命和应许：「奉祂的名向父祈求」。上帝所有的圣名藉着基督的降临，以其更深远的意义向我们显明了，我们本应战栗，正如我曾有幸与许多苦行修士生活时，他们所经历的那样，当称诵耶稣的圣名时。斗胆而言，我亦能成为活的见证，即，对这圣名的配得称诵，会使永生上帝的临在充满我们的整个存有；将心智带入别样的境界；赋予我们新生命特有的能量。难以言喻的神圣之光，伴随着这圣名而来。
    - type: paragraph
      text:
        ru: 'Мы знаем, что не только Имя Иисус, но и все другие Имена, открытые нам Свыше, онтологически связаны с Ним – Богом. Мы знаем сие из опыта Церкви. Все таинства в Церкви нашей совершаются чрез призывание Имен Божиих, и прежде всего святой Троицы: Отца и Сына и Святого Духа. Все наше богослужение основано на призывании Имен Божиих. Мы не приписываем им, как звуковым явлениям, магической силы, но произносимые в истине исповедания веры и в состоянии страха Божия, благоговения и любви – мы воистину имеем Бога совместно с Его Именами. Многие поколения священнослужителей сохранили познание о силе Имени Бога и совершали таинства с глубоким ощущением присутствия Живого Бога. Им открылась тайна священнодействия Божественной Литургии. Для них не было сомнений, что Кровь и Тело Христа пред нами в своей подлинной реальности. Над ними было призвано Имя Того, Который когда произносит слово, то слово становится «фактом».«И сказал Бог: да будет свет. И стал свет.»(Быт. 1:3)'
        cn: 我们知道，不仅是耶稣之圣名，而且所有其他从上而启示给我们的圣名，在本体上都与祂——上帝——是相连的。我们从教会的经验中得知这一点。在我们教会中所有的圣事，都是通过呼求上帝之圣名而举行的，首先是呼求至圣三位一体：圣父、圣子和圣灵。我们所有的礼仪都是基于对上帝之圣名的呼求。我们不认为它们作为声音现象具有魔法力量，但当它们在信仰告白的真理中被宣读时，并在敬畏上帝、虔诚和爱中被宣读时，我们就确实拥有上帝，与祂的圣名同在。许多代神职人员保留了关于上帝之圣名力量的认识，并带着对永生上帝临在的深刻感受举行圣事。向他们显明了神圣礼仪的圣事性施行奥秘。对他们而言，毫无疑问，基督的宝血和圣体是以其真实本体临在于我们面前的。在它们（宝血和圣体）之上，呼求了那位圣者的圣名，祂一发话，话语就成为「事实」。「上帝说：要有光，就有了光。」(创世记 1:3)
    - type: paragraph
      text:
        ru: Забвение об онтологическом характере Имен Божиих, отсутствие опыта сего в молитвах и тайносовершениях – опустошило жизнь многих. Для них молитва и самые таинства теряют свою вечную реальность. Литургия становится из Божественного акта простым воспоминанием, психологическим или ментальным. Многие дошли до того, что считают молитву бесполезной потерей времени, особенно, если по молитве их о наших житейских нуждах не совершилось того, о чем они просили... А соединение с Богом нашего существа – не есть ли самое важное чудо нашего бытия? Это есть та «благая часть», которая не отнимается от нас смертью. Факт воскресения нашего в Боге – вот что стоит в центре нашего внимания как последний смысл нашего явления в мир. Любовь ко Христу, заполняющая всего человека, радикальным образом изменяет нашу жизнь. Он -Богочеловек – соединил в Самом Себе сии два, и чрез Него мы имеем доступ к Отцу. Есть ли что большее, что возможно желать?
        cn: 遗忘上帝圣名的本体性，在祷告和圣事中缺乏这方面的体验——使得许多人的生命变得空虚。对他们来说，祷告和圣事本身都失去了其永恒的实相。礼仪从一个神圣的行动，变成了仅仅是心理上或观念上的回忆。许多人甚至到了这样的地步，认为祷告是无用的时间浪费，尤其是当他们为我们生活所需之事祷告后，所求的并未成就时……而我们本性与上帝的结合——难道不是我们存有中最重要的奇迹吗？这就是那「美好的一份」，是死亡不能从我们夺去的。我们在上帝里的复活这一事实——这正是我们关注的焦点，作为我们显现于世的终极意义。充满整个人对基督的爱，从根本上改变了我们的生命。祂——神人——在祂自身中结合了这两者，并且藉着祂，我们得以进到父那里。还有什么比这更伟大的，是我们所能渴望的吗？
    - type: paragraph
      text:
        ru: 'Те, что возлюбили Христа и Имя Его, наслаждаются чтением Евангелия и вообще Священного Писания. Имена Божии, исходящий от них Смысл и Свет влекут к себе дух человека, и он ничем другим не может увлечься. С каким высоким вдохновением говорит Петр:«Нет другого Имени под небесем, данного человекам, которым належало бы... спастись.»Или:«серебра и золота нет у меня; а что имею, то даю тебе: во Имя Иисуса Христа Назорея встань и ходи»(Деян. 4:12;Деян.3:6). В другом случае апостолы«возвысили голос к Богу и сказали: Владыко Боже, сотворивый небо и землю и все, что в них... воззри на угрозы их(царей и властителей мира сего: Иродов и Пилатов с язычниками и народом израильским),и дай рабам Твоим со всею смелостью говорить слово Твое, тогда как Ты простираешь руку Твою на исцеление и на соделание знамений и чудес Именем Святого Сына Твоего Иисуса. И по молитве их поколебалось место, где они были собраны, и исполнились все Духа Святого и говорили слово Божие со дерзновением... и великая благодать была на всех их»(Деян. 4:24–33).'
        cn: 那些爱慕基督和祂圣名的人，都喜乐于阅读福音书以及所有的圣经。上帝的圣名，以及从其中所发出的意义与光照，吸引人的灵魂，以致他无法被其他任何事物所吸引。彼得怀着何等崇高的灵感说道：「在天下人间，没有赐下别的名，我们可以靠着得救。」又如：「金银我都没有，只把我所有的给你：我奉拿撒勒人耶稣基督的名，你起来行走吧！」(使徒行传 4:12，使徒行传 3:6)。在另一个场合，使徒们「同心合意地高声向上帝说：主宰的上帝啊，祢是创造天地和其中万物的！求祢鉴察他们的恐吓（指着这世上的君王和掌权者：希律和彼拉多，以及外邦人和以色列民），并赐祢的仆人们放胆讲论祢的道，同时祢伸出祢的手，医治疾病，并行神迹奇事，都是借着祢圣子耶稣的名。」「他们祷告完了，聚会的地方震动，他们就都被圣灵充满，放胆讲论上帝的道……并且，极大的恩典临到他们众人。」(使徒行传 4:24-33)。
    - type: paragraph
      text:
        ru: И так все Священное Писание от начала до конца полно свидетельством о Боге чрез Имена Его. И не престает наслаждаться дух наш при встрече со святыми словами, и благословляет душа Бога, давшего нам сей бесценный дар.
        cn: 于是，全部圣经从头至尾都借着祂的诸圣名，充满着对上帝的见证。我们的灵每逢遇到圣言，便不住地享受，而我们的灵魂也称颂上帝，祂将这份无价的恩赐赐予我们。
    - type: paragraph
      text:
        ru: 'Медлительно развивается человек в сфере познания о Боге. Пройдут годы и годы, прежде чем раскроется в сознании нашем величественная картина Бытия: творение мира с его космическими силами и явлениями, и человека, когда«Господь Бог.... вдунул в лице его дыхание жизни»(Быт. 2, 7). Человек является связующим принципом между Богом и прочей тварью, так как в нем происходит сложение тварных космических энергий с Нетварною. Всякая энергия, исходящая от Бога, из Сущности Божества, и сама богословами именуется «божеством». Сущность, однако, несообщима человеку, но жизнь Божественная соединяется с человеком силою Божественного действия. Акт обожения совершается чрез нетварную благодать. Наиболее ярким примером в Новом Завете является Фаворское откровение: в зримом апостолами Свете они услышали голос Отца: «Сей есть Сын Мой возлюбленный». И Свет, и Голос (то и другое неизъяснимы) – все было «божеством».'
        cn: 人在对上帝的认识领域中缓慢地发展。年复一年，那庄严的创世图景才能在我们的意识中展开：世界的被造，连同其宇宙力量与现象，以及人类的被造，届时「上主上帝……将生命之气吹入他鼻中」（创世记 2:7）。人是联结上帝与其余受造物的纽带，因为在他身上，受造的宇宙能量与非受造之能结合在一起。任何源自上帝、源自神性本体的能量，其自身也被神学家称为「神性」。然而，本体是人不可沟通的，但神圣的生命藉着神圣行动的力量与人联合。神化之举藉着非受造的恩典得以实现。新约中最鲜明的例子是他泊山的启示：在使徒们所见的圣光中，他们听见了父的声音：「这是我的爱子」。圣光与圣音（两者皆不可言喻的）——一切都是「神性」。
    - type: paragraph
      text:
        ru: Всем нам необходимо учиться различать энергии по их происхождению; неспособность разобраться в этом вопросе замедлит процесс нашего роста в духе.
        cn: 我们所有人都需要学习分辨能量的来源；无法弄清这个问题将会减缓我们灵性成长的过程。
    - type: paragraph
      text:
        ru: 'Нелишне подчеркнуть, что в молитве Именем Иисуса мы не имеем ничего автоматического или магического. Если мы не подвизаемся соблюдать заповеди Его, то напрасным будет и призывание Имени. Сам Он сказал:«Многие скажут Мне в тот день: Господи, Господи! не от Твоего ли Имени мы пророчествовали? и не Твоим ли именем бесов изгоняли? и не Твоим ли Именем многие чудеса творили? И тогда объявлю им: Я никогда не знал вас; отойдите от Меня делающие беззаконие»(Мф. 7:22–23). Очень важно, чтобы мы уподобились Моисею, который терпеливо нес подвиг, как бы видя Того, Кто невидим (ср.:Евр. 11, 27), и призывать Его с сознанием онтологической связи Имени с Именуемым, с Персоной Христа. Любовь к Нему будет возрастать и совершенствоваться по мере того, как умножается и углубляется наше познание о жизни возлюбленного Бога. Когда мы по-человечески любим кого-либо, то с приятным чувством произносим имя любимой персоны и не утомляемся повторением. Так и еще безмерно больше с именем Господа. Когда любимое нами лицо все более и более раскрывается пред нами в своих дарованиях, то возрастает и ценность его для нас, и мы с радостью усматриваем в нем новые черты. Так происходит с именем Иисуса Христа. Мы с захватывающим интересом открываем в Его Имени новые тайны путей Божиих, и сами становимся носителями той реальности, которая заключена в имени. Чрез это живое познание в самом опыте жизни нашей причащаемся вечности:«Сия есть вечная жизнь, да знают Тебя, единого истинного Бога, и посланного Тобою Иисуса Христа»(Ин. 17, 3).'
        cn: 不无必要强调的是，在以耶稣之名祷告时，我们所拥有的并非任何自动或魔术性的东西。如果我们不安守祂的诫命而奋斗，那么呼求这圣名也将是徒劳的。祂自己曾说：「许多人在那日要对我说：『主啊，主啊，我们不是奉祢的名说预言吗？不是奉祢的名赶鬼吗？不是奉祢的名行了许多异能吗？』那时我就要向他们宣告说：『我从来不认识你们；你们这些作恶的人，离开我去吧！』」（马太福音 7:22-23）。极为重要的是，我们应当效法摩西，他忍耐地背负着奋力，如同看见了那不可见的（参：希伯来书 11:27），并带着圣名与受称呼者、与基督之位格本体论联系的意识来呼求祂。对祂的爱将增长并趋于完善，随着我们对所爱上帝之生命的认识增多并深化。当我们以人的方式爱某人时，就会怀着愉悦的心情说出所爱之人的名字，并且不厌倦重复。对于上主之名更是如此，而且是无限地更甚。当我们所爱之人以其恩赐在我们面前越来越多地显现时，它对我们的价值也随之增长，我们便欣喜地在其中发现新的特质。耶稣基督之名亦是如此。我们以引人入胜的兴趣在祂的圣名中发现上帝道路的新奥秘，并亲自成为那蕴含于圣名中之实相的承载者。借着我们生命经验中这种活泼的认知，我们得以领受永恒，因为「认识祢——独一的真上帝，并认识祢所差来的耶稣基督，这就是永恒的生命。」（约翰福音 17:3）。
    - type: paragraph
      text:
        ru: Господи Иисусе Христе, Сыне Божий, помилуй нас и мир Твой.
        cn: 主耶稣基督，上帝之子，怜悯我们和祢的世界。
    - type: paragraph
      text:
        ru: 'Имя Иисус было дано по откровению Свыше. Оно исходит из вечной Божественной сферы, и никак не является измышлением земного разума, хотя и выражено тварным словом. Откровение есть акт – энергия Божества, и, как таковая, принадлежит иному плану и трансцендирует космические энергии. В своей надмирной славе Имя Иисус – метакосмично. Когда мы произносим сие Имя Христа, призывая Его к общению с нами, то Он, все наполняющий, внимает нам и мы входим в живой контакт с Ним. Как предвечный Логос Отца, Он пребывает в нераздельном единстве с Ним, и Бог-Отец чрез Слово Свое вступает в общение с нами. Христос Единородный совечный Сын Отца, и потому говорит, что «никто не приходит к Отцу, как только чрез Него» (ср.:Ин. 14, 6). Имя Иисус – значит Бог-Спаситель; как таковое, оно может быть отнесено ко Святой Троице; возможно отнесение его к каждой Ипостаси отдельно. Но в молитве нашей Имя Иисус употребляется исключительно как собственное Имя Богочеловека, и ум наш обращен при этом вниманием к Нему.«В Нем обитает вся полнота Божества телесно», говорит апостол Павел (Кол.2, 9). В Нем не только Бог, но и весь род человеческий. Молясь Именем Иисуса Христа, мы ставим себя пред абсолютной полнотой и Нетварного Перво-Бытия, и бытия тварного. Чтобы войти в область сей полноты Бытия, мы должны вселить Его в нас так, чтобы Его жизнь стала и нашей, чрез призывание Имени Его, согласно заповеди: Господи, Иисусе Христе, Сыне Божий, помилуй мя грешного.«Соединяющийся с Господом есть один дух с Господом»(1Кор. 6, 17).'
        cn: '耶稣之名是按着自上而来的启示被赐予的。它源自永恒的属神领域，绝非属世理性的构想，尽管以受造的言语表达。启示乃一行动——神性之能动，因此它属于另一个层面，并超越宇宙的能动。在其超世的荣耀中，耶稣之名是超宇宙的。


          当我们诵念基督的此名，呼求祂与我们相通时，祂这位充满万有的，便垂听我们，我们便与祂进入活的联系。作为圣父的先在圣言，祂与圣父处于不可分割的合一之中，圣父上帝也借着祂的圣言与我们相通。基督是圣父的独生与同永之子，因此祂说：「若不借着祂，没有人能到父那里去」（参阅：约翰福音 14:6）。


          耶稣之名意为「上帝-救主」；因此，它可以归于圣三一，也可单独归于每个位格。然而在我们的祷告中，耶稣之名被专属地用作神人的专有之名，我们的心智也因此而转向祂。使徒保罗说：「神性的一切丰盛，都有形有体地居住在祂里面」（歌罗西书 2:9）。在祂里面，不仅有上帝，也有全人类。


          借着耶稣基督之名祷告时，我们将自己置于绝对的丰盛面前，也就是非受造的初始存有，以及受造的存有二者。为了进入这丰盛存有的领域，我们必须将祂内住于我们内，以致祂的生命也成为我们的生命，借着呼求祂的圣名，依照以下诫命：「主耶稣基督，上帝之子，怜悯我这罪人。」


          「与主联合的，便是与主成为一灵」（哥林多前书 6:17）。'
    - type: paragraph
      text:
        ru: 'Я остановился на догматическом понимании молитвы Именем ИИСУСА в значительной мере потому, что за последние десятилетия много раз пришлось мне встречаться с извращенным взглядом на практику этой молитвы. Наиболее недопустимыми являются смешения ее с йогой, с буддизмом и даже с «трансцендентальной медитацией», и подобное сему. Радикальное различие всех этих уклонений с христианством состоит в том, что в основе нашей жизни лежит Откровение о Боге ЛИЧНОМ: АЗ ЕСМЬ. Все другие пути отводят ум человека от личных взаимоотношений между Богом и молящимся в область отвлеченного трансперсонального Абсолюта, в имперсональную аскетику.'
        cn: 我之所以着重于对耶稣圣名祷文的教义性理解，很大程度上是因为在过去的几十年里，我多次不得不面对关于这种祷文实践的扭曲看法。最不可接受的是，有人将其与瑜伽、佛教，甚至与「超觉静坐」混淆，以及诸如此类的情况。所有这些偏离与基督教之间的根本性差异在于，我们生命的根基乃是对位格上帝的启示：「我就是」。所有其他道路都使人的心智偏离上帝与祈祷者之间位格性的关系，转向抽象的超位格绝对者领域，进入非位格化的苦修。
    - type: paragraph
      text:
        ru: Медитация, как отвлечение нашего ума от всяких образов, может давать нам ощущение успокоения, мира, исхода из условий времени и пространства, но в ней отсутствует сознательное предстояние Богу личному; в ней нет действительной молитвы, т.е. лицом к Лицу. Это может привести к тому, что увлеченный медитацией удовлетворится психическими результатами подобных экспериментов, и, что хуже всего, восприятие Живого Бога, Абсолюта Персонального станет для него чуждым. Нередки безумные попытки за короткий срок достигнуть «космического сознания» и даже иметь опыт непосредственного общения с Сверх-Личным Абсолютом. По существу же этого рода аскетика становится уходом от Бога Истинного, от воистину Сущего.
        cn: 冥想，作为让我们的心思意念脱离一切形象的方式，能够带给我们平静、安宁以及超脱时空束缚的感觉，但其中却缺少对位格上帝的自觉临在；其中没有真正的祷告，即面对面。这可能导致沉迷于冥想的人会满足于此类实验所带来的精神结果，并且，最糟糕的是，对永生上帝——那位位格的绝对者——的感知会变得与他格格不入。在短时间内达到「宇宙意识」，甚至拥有与超位格绝对者直接交流的经验，这种疯狂的尝试并不少见。但就其本质而言，这种禁欲主义成为了对真上帝——对那真正存在的——的背离。
    - type: paragraph
      text:
        ru: 'Евангельское учение говорит не только о Боге Личном, но и о личном бессмертии спасаемых. Достигается сие чрез победу над миром страстей. Великая, грандиозная задача; но Господь сказал: «Дерзайте, Я победил мир»; и мы знаем, что нелегка была сия победа. И опять Христос учит:«Входите тесными вратами; потому что широки врата и пространен путь, ведущие в погибель, и многие идут ими; потому что тесны врата и узок путь, ведущие в жизнь, и немногие находят их. Берегитесь лжепророков...»(Мф. 7:13–15). В чем погибель? В том, что люди покидают открывшегося нам Живого Бога, устремляясь в то «ничто», из которого вызваны к бытию ради сообщения им бессмертного блаженства в форме богосыновства, чрез вселение в них Бога святой Троицы.'
        cn: 福音教导不仅论及位格的上帝，而且论及蒙救赎者的个人不朽。这借着胜过情欲的世界而得以实现。这是一项伟大而宏大的任务；然而上主说：「你们要刚强，我已胜过了世界」；而且我们知道这胜利并非易事。基督又教导说：「你们要进窄门；因为引向毁灭的门是宽的，路是广阔的，而且走这条路的人很多；因为引向生命的门是窄的，路是狭隘的，而且找到它们的人很少。你们要提防假先知……」（马太福音 7:13-15）。何谓毁灭？毁灭在于，人们离弃了向我们显现的活上帝，奔向那「虚无」，他们本是从这「虚无」被召唤而存在，为的是借着圣三一上帝居住在他们里面，赐予他们以上帝之子的形式的不朽福乐。
    - type: paragraph
      text:
        ru: 'Чтобы поверить Христу, нужно: или иметь детскую простоту:«если не обратитесь и не будете, как дети, не войдете в Царство небесное»(Мф. 18, 3); или уподобиться в безумном дерзновении Павлу, который говорит:«Мы безумны Христа ради... мы немощны... мы в бесчестии... мы как сор для мира, как прах, попираемый всеми доныне»(1Кор. 4:10–13); и однако:«никто не может положить другого основания, кроме положенного, которое есть Иисус Христос»(1Кор. 3, 11).«Умоляю вас: подражайте мне, как я Христу»(1Кор. 4, 16).'
        cn: '为了相信基督，需要：

          或者拥有孩童般的单纯：「如果你们不回转，变成像小孩子一样，就绝不能进入天国」(马太福音 18:3)；

          或者在疯狂的勇气中效法保罗，他说：「我们为基督的缘故成了愚妄人……我们是软弱的……我们是受屈辱的……我们成了世上的污秽，万物中的渣滓，直到如今」(哥林多前书 4:10-13)；

          然而：「除了那已经立好的根基，就是耶稣基督，没有人能立别的根基」(哥林多前书 3:11)。

          「我恳求你们：效法我，如同我效法基督一样」(哥林多前书 4:16)。'
    - type: paragraph
      text:
        ru: 'Космическое сознание в христианском опыте дается в молитве, подобной Гефсиманской молитве Господа, а не в философском трансцензусе. «И сказал им: ...так надлежало...(Лк.24:46) проповедану быть во ИМЯ ЕГО покаянию и прощению грехов во всех народах... Вы же сохранено нерассеянным, и ум установится рядом с сердцем или даже и войдет вовнутрь. Опыт покажет, что этот способ даст уму возможность видеть не самое физическое сердце, но то, что в нем происходит: какие чувства возникают в нем; какие мысленные образы приближаются извне. Такая практика приведет к тому, что монах будет чувствовать свое сердце и пребывать вниманием ума в нем (сердце), уже не прибегая к «психосоматической технике».'
        cn: 宇宙意识在基督徒的经验中，是通过类似于主客西马尼祷告的祈祷得来的，而非通过哲学的超越。「又对他们说：……照此本是应当的，（路加福音 24:46）当奉祂的名，传讲悔改与罪得赦免的道给万民……」而你们若能保持心思不散乱，心智就会安顿在心旁，甚至进入其中。经验将会表明，这种方法将使心智得以看到的，并非是物理上的心脏本身，而是其中所发生的一切：比如其中产生了怎样的感受；怎样的思绪意象从外部临近。这样的实践将导致修士能够感受到自己的心，并使心智的注意力安住于其中（心中），不再需要借助「身心技术」。
    - type: paragraph
      text:
        ru: 'Искусственный прием может помочь начинающему найти место, где должно стоять вниманием ума при молитве и вообще во всякое время. Однако чрез такой способ настоящая молитва не достигается. Она приходит не иначе, как через веру и покаяние, являющиеся единственным основанием для подлинной молитвы. Опасность психотехники, как показал долгий опыт, в том, что есть немало людей, слишком большое значение придающих самому методу. Во избежание вредной деформации духовной жизни молящегося – начинающим подвижникам с древних времен рекомендуется иной образ, значительно более медленный, но несравненно более правильный и полезный, а именно: сосредоточивать внимание на Имени Иисуса Христа и на словах молитвы. Когда сокрушение о грехах достигает известной степени, тогда ум естественно идет на соединение с сердцем.'
        cn: 人为的方法可以帮助初学者找到心神的注意力在祷告时以及任何时候都应驻留之处。然而，借着这种方式，真正的祷告无法成就。它唯有通过信仰和悔改才能临到，而这两者才是真正的祷告的唯一根基。正如长期经验所示，心理技术的危险在于有许多人过于重视方法本身。为了避免祷告者灵性生命有害的扭曲，自古以来就建议初阶苦修者采用另一种方式，虽然慢得多，但无比正确且有益，即：将注意力集中于耶稣基督的圣名上以及祷告词上。当为罪痛悔达到一定程度时，心神便自然而然地与心结合。
    - type: paragraph
      text:
        ru: 'Полная формула молитвы: ГОСПОДИ ИИСУСЕ ХРИСТЕ, СЫНЕ БОЖИЙ, ПОМИЛУЙ МЯ ГРЕШНОГО. Начинающему предлагается именно эта формула. В первой части молитвы мы исповедуем Христа-Бога, воплотившегося нашего ради спасения. Во второй – раскаяние признаем наше падение, нашу греховность и искупление. Соединение догматического исповедания с покаянием делает молитву более полною в ее положительном содержании.'
        cn: 祷文的完整形式是：主耶稣基督，上帝之子，求祢怜悯我这罪人。对于初学者，正是建议使用这个祷文。在祷文的第一部分，我们认信基督是上帝，祂为我们的救赎而道成肉身。在第二部分——悔改中，我们承认我们的堕落、我们的罪性，以及救赎。教义上的认信与悔改的结合，使得这个祷文在其积极的内涵上更加完全。
    - type: paragraph
      text:
        ru: 'Возможно установить некоторую последовательность в процессе развития этой молитвы:'
        cn: 或许可以在这种祷告的发展过程中确立某种次序：
    - type: paragraph
      text:
        ru: УСТНАЯ:мы произносим молитву устами, сосредоточивая наше внимание на Имени и словах.
        cn: 口祷： 我们用口诵念祷文，将我们的注意力集中在圣名和话语上。
    - type: paragraph
      text:
        ru: УМНАЯ:мы не двигаем устами, но произносим Имя Иисуса Христа и прочее содержание мысленно.
        cn: 智性祷告：我们不动嘴唇，而是默念耶稣基督的圣名以及其他内容。
    - type: paragraph
      text:
        ru: УМНО-СЕРДЕЧНАЯ:ум и сердце соединены в своем действии; внимание заключено внутри сердца, и там произносится молитва.
        cn: 心智合一：智与心在行动中合一；注意力收敛于心内，并在那里诵念祷告。
    - type: paragraph
      text:
        ru: САМОДВИЖНАЯ:молитва утвердилась в сердце и без особого усилия воли сама произносится внутри сердца, привлекая туда внимание ума.
        cn: 自行：祷告在心中确立，无需特别的意志努力，它便自行在心内诵念，吸引心思的注意力到那里。
    - type: paragraph
      text:
        ru: БЛАГОДАТНАЯ:молитва действует, как нежное пламя внутри нас, как вдохновение Свыше, услаждающее сердце ощущением любви Божией и восхищающее ум в духовные созерцания. Иногда соединяется с видением Света.
        cn: 恩宠的祷告：祷告发挥作用，如同我们内心温柔的火焰，如同自上而来的灵感，借由上帝之爱的感受使心甘甜，并使心智在属灵的默观中得以超拔。有时与圣光的神视相结合。
    - type: paragraph
      text:
        ru: 'Постепенное восхождение в молитве является наиболее достоверным. Вступающему на поприще борьбы за молитву настойчиво советуется начинать с устной молитвы, доколе не усвоится она нашим телом: языком, сердцем, мозгом. Длительность этого периода различна у каждого; чем глубже покаяние, тем короче путь.'
        cn: 祷告中的循序渐进的进升最为稳妥。对于踏上为祷告而争战之路的人，郑重建议他们从口祷开始，直到口祷被我们的身体——舌头、心和大脑——所同化。这个时期的长短因人而异；悔改越深，道路越短。
    - type: paragraph
      text:
        ru: Практика умной молитвы может быть на время связана с психосоматической техникой, т.е. носить характер ритмического или неритмического произношения молитвы умом посредством вдыхания при первой части и выдыхания при второй, как описано выше. Такое делание может быть полезным, если при этом не теряется из виду, что каждое призывание Имени Христа должно быть неразлучно с Ним, Его Персоной, неотрывно от Лица Бога. Иначе молитва превращается в техническое упражнение и становится грехом против заповеди:«Не произноси Имени Господа Бога твоего напрасно»(Исх. 20, 7;Втор. 5, 11).
        cn: 净心祷告的实践可以暂时与身心技巧结合，即呈现为有节奏或无节奏地在心中诵念祷文，借着在祷文第一部分时吸气，第二部分时呼气，如上文所述。如此的行持可能是有益的，如果在此过程中没有忘记，每一个呼求基督圣名的行为必须与祂、祂的位格不可分离，不可脱离上帝的圣颜。否则，祷告就会变成一种技术性操练，并成为违反诫命的罪：「不可妄称上主——你上帝的圣名」（出埃及记 20:7，申命记 5:11）。
    - type: paragraph
      text:
        ru: 'Когда внимание ума установится в сердце, тогда становится возможным полный контроль происходящего внутри сердца, и борьба со страстями принимает разумный характер. Молящийся видит врагов, приближающихся извне, и может отгонять их силою Имени Христа. Сердце при таком подвиге утончается и становится прозорливым: интуитивно знает о состоянии того лица, о котором приносится моление. Таким образом совершается переход от умной молитвы к умно-сердечной, – после чего даруется молитва самодвижная.'
        cn: 当心神的专注安立于心中时，那么就能完全掌控心中所发生的一切，并且与情欲的争战也变得理智起来。祈祷者能看见从外逼近的仇敌，并且能藉着基督圣名的力量将其驱逐。心灵在这种苦修中变得精微，并能成为洞察的：能够直观地了解受其代祷之人的状态。如此便实现了从心神祷告到心神居心祷告的转变——之后便被赐予自动祷告。
    - type: paragraph
      text:
        ru: Мы стремимся предстоять Богу в единстве и целостности нашего существа. Призывание в страхе Божием Имени Спасителя, соединенное с постоянным старанием жить согласно заповедям, приводит постепенно к блаженному единству всех наших сил, прежде разбитых падением. В этом чудном, но болезненно трудном подвиге никогда не должно спешить. Бог не насилует нашу волю, но и Его невозможно заставить силою сделать что бы то ни было.
        cn: 我们力求以我们存在的统一与完整侍立在上帝面前。在敬畏上帝中呼求救主之名，并结合持续不断地努力按照诫命生活，这逐渐引领我们达到我们所有力量的蒙福的统一——这些力量之前因堕落而破碎。在这项奇妙却又痛苦艰难的属灵操练中，绝不可急于求成。上帝不强迫我们的意志，但人也无法强迫祂以任何方式行事。
    - type: paragraph
      text:
        ru: Достигаемое усилием воли чрез психотехнику – не удерживается надолго, и что важнее, не соединяет нашего духа с Духом Бога Живого.
        cn: 通过心理技术藉意志努力所获得的，无法长久维系，而更重要的是，不能使我们的灵与永生上帝的圣灵联合。
    - type: paragraph
      text:
        ru: В условиях современного мира молитва требует сверхчеловеческого мужества, так как ей противится совокупность космических энергий. Устоять в нерассеянной молитве означает победу на всех уровнях натурального существования. Путь сей долог и тернист, но приходит момент, когда луч Божественного Света прорежет густой мрак и создаст пред нами прорыв, сквозь который мы увидим Источник этого Света. Тогда молитва Иисусова принимает измерения космические и метакосмические.
        cn: 在当今世界中，祷告需要超凡的勇气，因为有宇宙诸能量的聚合与之对抗。坚立于专注的祷告中，意味着在自然存在的各个层面上都取得胜利。这条道路漫长而坎坷，但会有一个时刻来到，当一道神圣之光刺破浓密的黑暗，并在我们面前开辟一道突破口，透过它，我们将看见这光的源头。那时，耶稣祷告将取得宇宙性的和超宇宙性的维度。
    - type: paragraph
      text:
        ru: '«Упражняй себя в благочестии. Ибо телесное упражнение мало полезно; а благочестие на все полезно, имея обетование жизни настоящей и будущей. Слово сие верно и всякого приятия достойно, ибо мы для того и трудимся... что уповаем на Бога Живого, Который есть Спаситель всех человеков... Проповедуй сие и учи»(1Тим. 4:7–11). Следовать сему учению апостола явится наивернейшим путем к Искомому нами. Мы не думаем об искусственных средствах достижения обожения: мы веруем, что Бог пришел на землю, и открыл нам тайну греха, и дал нам благодать покаяния, и мы молимся: «Господи Иисусе Христе, Сыне Божий, помилуй мя грешного», – в надежде прощения и примирения во Имя Его. Слов – «помилуй мя грешного» – мы не оставляем всю нашу жизнь. Полная победа над грехом возможна не иначе, как чрез вселение в нас Самого Бога, что и явится обожением нашим, в силу которого станет возможным непосредственное созерцание Бога,«как Он есть». Полнота христианского совершенства в пределах земли недостижима.'
        cn: 「操练自己，以敬虔为念。因为操练身体，益处还少；惟独敬虔，凡事都有益处，因有今生和来生的应许。这话是可信的，是十分可敬的。我们劳苦，正是为此，因为我们已将盼望寄托于永生的上帝，祂是所有人类的救主。传扬这些事，并且教导人。」(提摩太前书 4:7-11)遵从使徒的这一教训，乃是通往我们所寻求之事的，最可靠的途径。我们不思虑达成神化的，人为的途径：我们相信，上帝降世，向我们揭示了罪的奥秘，并赐予我们悔改的恩典，我们祷告：「主耶稣基督，上帝之子，求祢怜悯我这罪人！」盼望因祂的名而得赦免与和好。我们一生都未曾放下——「怜悯我这罪人」——这些话。全然战胜罪恶，唯有借由上帝亲自居住在我们之内方能实现，这也即是我们的神化，借此将能直接默观上帝，「如祂所是」。基督徒圆满的圣善境地，在世间范围内是无法达成的。
    - type: paragraph
      text:
        ru: Св. Иоанн Богослов пишет так:«Бога никто никогда не видел; Единородный Сын, сый в недре Отчем, Он явил»(Ин. 1, 18). И он же утверждает, что в грядущем веке наше обожение завершится, потому что«увидим Его, КАК ОН ЕСТЬ»(1Ин. 3, 2).«...Всякий, имеющий надежду сию... очищает себя, так как Он чист...всякий, пребывающий в Нем, не согрешает; всякий согрешающий не видел Его, не познал Его»(1Ин. 3,3–6). Полезно впитать содержание сего послания, чтобы призывание Имени Иисуса стало действенным, спасительным; чтобы«мы перешли от смерти в жизнь»(1Ин. 3, 14), чтобы мы облеклись силою Свыше (ср.:Лк. 24, 49).
        cn: 圣约翰神学家如此写道：「从来没有人见过上帝；独生子，在父怀里的，祂已将祂显明」（约翰福音 1:18）。他也主张，在将临的世代，我们的神化将得以完全，因为「我们将看见祂的本相」（约翰一书 3:2）。「...凡有这盼望的，就洁净自己，正如祂是洁净的；凡住在他里面的，就不犯罪；凡犯罪的，是未曾看见祂，也未曾认识祂」（约翰一书 3:3-6）。吸取这封书信的内容是裨益的，好使呼求耶稣圣名变得有功效、能救赎；好使「我们已经出死入生」（约翰一书 3:14），好使我们被自上而来的能力所披戴（参：路加福音 24:49）。
    - type: paragraph
      text:
        ru: Одна из самых замечательных книг, творений отцов-аскетов, есть «Лествица» Иоанна Синайского. Ее читают новоначальные монахи, она же служит авторитетным коррективом и для «совершенных». (Быть может излишне говорить, что совершенство на земле никогда не бывает полным). Подобно сему можно рассуждать и о молитве Иисусовой. Ею молятся при всякой работе благочестивые простые люди; ею заменяют церковные службы, ее «умом» произносят монахи, находясь в храме во время богослужений; она же составляет преимущественное занятие монахов в келиях и пустынников-исихастов.
        cn: 西奈的约翰所著《阶梯》一书，是苦修教父最杰出的著作之一。初学修士阅读此书，它也同时是「已臻完善者」的权威性校正。（或许不必多言，世上的完善永不完全。）同样地，我们也可以论述耶稣祷文。虔诚的平信徒在任何劳作中都会诵念它；它能代替教会礼仪，修士在圣堂内参与事奉圣礼时，则「以心神」诵念它；它更是修士在小室中以及隐修者-静修者的主要操练。
    - type: paragraph
      text:
        ru: Делание сей молитвы теснейшим образом связывается с богословием Имени Божьего. Она имеет глубокие догматические корни, как и вообще всей аскетической жизни православных гармонически сопутствует догматическое сознание. Она воистину в некоторых из своих форм становится огнем, пожирающим страсти (ср.:Евр. 12, 29). В ней заключена божественная сила, восставляющая мертвых грехами; светом просвещающая ум, сообщая ему способность видеть действующие в «космосе» силы; она же дает возможность созерцать совершающееся внутри нашего сердца и ума:«она проникает до разделения души и духа, составов и мозгов, и судит чувствования и помышления сердечные»(Евр. 4, 12).
        cn: 此祷告的实行与上帝之名的神学紧密相连。它拥有深厚的教义根基，正如东正教徒的整个苦修生活普遍和谐地伴随着教义意识一般。它确实以其某些形式，成为吞噬情欲的烈火（参阅：希伯来书 12:29）。其中蕴含着神圣力量，使罪所死的复生；以光照亮心智，赋予其看见在「宇宙」中运作之力量的能力；它也使人得以默观我们内心和心智中正在发生之事：「它穿透至魂与灵、骨节与骨髓的分界，并审判心中的情意与思虑」（希伯来书 4:12）。
    - type: paragraph
      text:
        ru: Благоговейное делание этой молитвы приводит человека ко встрече со многими скрытыми в атмосфере противодействующими энергиями. Приносимая в состоянии глубокого покаяния, она проникает в область, лежащую за пределами«мудрости мудрецов и разума разумных»(1Кор. 1, 19). В своих наиболее интенсивных проявлениях она требует или большого опыта, или наставника. Всем без исключения необходима бдительная осторожность, дух сокрушения и страха Божия, терпения всего находящего на нас. Тогда она становится силою, соединяющею наш дух с Духом Божиим, дающею чувство живого присутствия внутри нас вечности, как предварительно проводила нас по безднам тьмы, скрытой в нас.
        cn: 虔敬地实行此祷文，能引人与弥漫在氛围中许多隐藏的对抗性能量相遇。若在深切悔罪的状态中呈献此祷文，它便能穿透那超越「智慧人的智慧和通达人的通达」的领域（哥林多前书 1:19）。在其最强烈的表现中，它需要丰富的经验或一位导师。无一例外，所有人皆需警醒的谨慎、破碎之灵、敬畏上帝的恐惧，以及忍受临到我们的一切。那么它便成为一种力量，将我们的灵与上帝的灵联结起来，赋予我们内在永恒鲜活存在之感，如同它先前曾引领我们穿过隐藏在我们里面的黑暗深渊。
    - type: paragraph
      text:
        ru: Сия молитва – великий дар Неба человеку и человечеству.
        cn: 这篇祷文是上天赐予个人和全人类的伟大恩赐。
    - type: paragraph
      text:
        ru: Насколько важно пребывание (чтобы не сказать – упражнение) в молитве – показывает и самый опыт. Считаю дозволенным провести параллель с естественной жизнью нашего мира и привести примеры из известных нам фактов современной нам повседневности.
        cn: 祷告中的存留（毋宁说是操练）的重要性，经验本身也显明了。我认为不妨与我们世界的自然生活作一类比，并从我们所熟知的当代日常生活中举例。
    - type: paragraph
      text:
        ru: Спортсмены, приготовляясь к предстоящим им состязаниям, в течение долгого времени повторяют одни и те же номера, чтобы в момент самого испытания проделать все движения, хорошо уже усвоенные, быстро, уверенно и как бы механически. От количества упражнений зависит и качество исполнения. Вот еще расскажу об одном факте; это произошло в кругу лиц, знакомых мне. Конечно, я повторю здесь то, что слышал от одного из ближайших к действующим лицам человека. В одном европейском городе два брата женились почти одновременно на двух девушках. Одна из них – доктор медицины, большого ума и сильного характера. Другая – более красивая, живая, интеллигентная, но не слишком интеллектуальная. Когда приблизилось время родить для обеих, то свой первый опыт они решили совершить, следуя незадолго перед тем появившейся теории «безболезненных родов». Первая, доктор медицины, быстро поняла весь механизм этого акта и после двух-трех уроков определенной гимнастики оставила упражнения, уверенная, что она все поняла и в нужный момент реализует свои познания. Другая имела очень примитивное представление об анатомическом строении своего тела, но не была расположена заняться теоретической стороной, а просто с усердием отдалась повторению предписанного комплекса движений тела; достаточно освоившись, пошла на предстоящую операцию. И что же вы думаете? Первая, в момент родов, с начала появления болей, позабыла все свои теории и родила с большим трудом, «в болезни» (см.:Быт. 3, 16). Другая же без болей и почти без труда.
        cn: '运动员们在为即将到来的比赛做准备时，会在很长一段时间里反复练习相同的动作，以便在真正的考验时刻，能够快速、自信地、并且仿佛机械般地完成所有已经熟练掌握的动作。练习的数量决定了执行的质量。我还要讲一个事实；这发生在我认识的人圈子里。当然，我在这里重复的，是从一个与当事人非常亲近的人那里听来的。


          在一个欧洲城市里，两兄弟几乎同时娶了两名年轻女子。其中一位是医学博士，聪明过人，性格坚强。另一位则更美丽、活泼、有教养，但并非特别知性。当她们两人都临近分娩时，她们决定第一次尝试，遵循不久前出现的「无痛分娩」理论。


          第一位，那位医学博士，很快理解了这一过程的全部机制，在上了两三堂特定的体操课后，就停止了练习，确信自己已经完全理解，并在需要时能运用所学。另一位对自己身体的解剖结构了解甚少，但她不愿涉足理论层面，而是单纯地、勤奋地重复练习所规定的整套身体动作；充分掌握之后，就去进行了即将进行的分娩。那么，您猜结果如何？第一位，在分娩时，疼痛一开始出现，就忘记了自己所有的理论，历经千辛万苦才生产，正如「在痛苦中」（创世记 3:16）。而另一位却无痛且几乎毫不费力地分娩了。'
    - type: paragraph
      text:
        ru: Так будет и с нами. Понять «механизм» умной молитвы для современного образованного человека – легко. Стоит ему помолиться две-три недели с некоторым усердием, прочитать несколько книг, и вот, сам он уже может к числу написанных добавить свою. Но в час смерти, когда весь наш состав подвергается насильственному разрыву; когда мозг теряет ясность и сердце испытывает или сильные боли, или ослабление, тогда все наши теоретические знания пропадут и молитва может потеряться.
        cn: 我们也是如此。对现代受过教育的人来说，理解理智祷告的「机制」是容易的。只要他带着一些热心祷告两三周，读几本书，那么，他自己就能在已有的著作中增添自己的著作了。但在死亡之时，当我们整个的生命构成遭受强行的撕裂；当大脑失去清明，心遭受剧烈的疼痛或软弱无力时，那时我们所有的理论知识都将消逝，祷告也可能随之失去。
    - type: paragraph
      text:
        ru: 'Необходимо молиться годами. Читать немного, и только то, что находится в том или ином соприкосновении с молитвой и по своему содержанию содействует усилению влечения к покаянной молитве во внутреннем заключении ума. От долговременности молитва станет природой нашего существа, естественной реакцией на всякое явление в духовной сфере: будь то свет или тьма; явление святых ангелов или демонических сил; будь то радость или скорбь; словом, во всякое время, при всех обстоятельствах.'
        cn: 必须经年累月地祷告。少读，并且只读那些与祷告有所关联，其内容有助于增强人在心思的内在归束中对悔罪祷告的渴慕的文字。由于长久的祷告，祷告将成为我们存在的本性，对灵性领域中一切现象的自然反应：无论是光明还是黑暗；无论是圣天使的显现还是邪魔势力的出现；无论是喜乐还是悲伤；简言之，在任何时候，在所有境况下（都如此）。
    - type: paragraph
      text:
        ru: С такою молитвою наше рождение для вышнего мира может действительно стать «безболезненным».
        cn: 借着这样的祷告，我们为更高世界的诞生确实能够成为「无痛的」。
    - type: paragraph
      text:
        ru: Кратка книга Нового Завета, открывающая нам последние глубины безначального Бытия; теория Иисусовой молитвы также не требует длиннот. Недостижимо в пределах земли явленное нам Христом совершенство; не поддается описанию множество испытаний, чрез которые проходит подвижник сей молитвы. Делание этой молитвы странным образом приводит дух человека к встрече с «силами», скрытыми в «Космосе». Она, молитва Именем Иисуса, вызывает борьбу против него этих космических сил, лучше же сказать:«мироправителей тьмы века сего,... духов злобы поднебесных»(Еф. 6, 12). Вознося человека в сферы, лежащие за гранями земной мудрости, сия молитва в своих высших формах требует «ангела верна наставника».
        cn: 新约圣经是一本简短的书卷，它向我们揭示了无始之存有的最终深邃；耶稣祷文的理论同样不需要冗长的阐述。基督向我们显明的完善，在尘世的界限内是无法企及的；这祷文的修持者所经历的众多试炼，是难以描述的。实行这祷文，奇特地引导人的灵魂去遭遇隐藏在「宇宙」中的「势力」。它，即奉耶稣之名的祷文，引致这些宇宙势力与那修持者为敌的争战，不如说，是与「这黑暗世界的掌权者，……天空属灵气的恶魔」（以弗所书 6:12）的争战。这祷文将人提升至位于尘世智慧界限之外的境界，在其最高的形态中，它需要「一位忠诚的天使导师」。
    - type: paragraph
      text:
        ru: По существу своему молитва Иисусова стоит выше всякой внешней формы, но практически, вследствие неспособности нашей стоять в ней «чистым умом» долгое время, ради дисциплины верующие пользуются четкой. На Святой Горе Афона наиболее распространена четка, имеющая 100 узлов, разделенных на четыре части (по 25 каждая). Число молитв и поклонов на день и ночь определяется соответственно силе каждого и реальной житейской возможности.
        cn: 就其本质而言，耶稣祷文超越任何外在形式，但实际上，由于我们无法长期「以纯净的心灵」持守其中，为了灵修规训，信徒们会使用念珠。在阿索斯圣山，最为普遍的是拥有100个结的念珠，分成四部分（每部分25个）。每日每夜的祷文和拜跪数量，则依照各人的力量和实际生活可能性而定。
  - type: heading2
    text:
      ru: Практика
      cn: 实践
    children:
    - type: paragraph
      text:
        ru: В данной главе я попытаюсь возможно кратко изложить наиболее существенные моменты великой культуры сердца и самые здравые советы для этого подвига, с которым я встретился на Святой Горе.
        cn: 在本章中，我将尝试尽可能简要地阐述我在圣山所遇到的伟大的心之文化最为精要的方面，以及为此功修最为健全的建议。
    - type: paragraph
      text:
        ru: Многие годы монахи произносят молитву устно, не ища искусственных способов соединения ума с сердцем. Внимание их обращено на то, чтобы согласовать свою повседневную жизнь с заповедями Христа.
        cn: 多年以来，修士们口头诵念祷文，不寻求人为的方式来连接心思与心灵。他们的注意力则在于，使自己的日常生活与基督的诫命相符。
    - type: paragraph
      text:
        ru: 'Вековой опыт сей аскезы показал, что ум соединится с сердцем по действию Божию, когда монах пройдет солидный опыт послушания и воздержания, когда его ум, сердце и самое тело «ветхого человека» в достаточной мере освободятся от власти греха. Однако в прошлом, и в настоящее время отцы иногда разрешают прибегать к искусственному методу сведения ума в сердце. Для этого монах, дав телу удобное положение и наклонив голову к груди, мысленно произносит молитву, тихо вдыхая воздух со словами: «Господи Иисусе Христе (Сыне Божий)» и затем выдыхая кончает молитву: «помилуй мя (грешного)». Во время вдыхания внимание ума сначала следует движению воздуха и останавливается на верхней части сердца. При таком делании чрез некоторое время внимание может быть сохранено нерассеянным, и ум установится рядом с сердцем или даже и войдет вовнутрь. Опыт покажет, что этот способ даст ему возможность видеть не самое физическое сердце, но то, что в нем происходит: какие чувства возникают в нем; какие мысленные образы приближаются извне.'
        cn: 这项苦修的历代经验表明，当修士经历了扎实的顺服与节制经验，当他的心神、心以及「旧人」的肉身充分地从罪的权势下获得自由时，心神将借由上帝的作为与心结合。然而，在过去和现在，教父们有时会允许采用一种人工的方法，将心神引入心。为此，修士让身体处于舒适的姿势，并将头垂向胸部，在心中默诵祷文，轻轻吸气时念诵：「主耶稣基督（上帝之子）」，然后呼气时以「求祢怜悯我（罪人）」结束祷文。在吸气时，心神的注意力首先跟随空气的运动，并停留在心的上部。借由这样的实践，过了一段时间后，注意力可以保持不分散，心神将安住于心旁边，甚至进入其内部。经验会表明，这种方式将使他能够看见的不是物理上的心，而是其中发生的一切：什么样的感觉在其中心生；什么样的思想图像从外部靠近。
    - type: paragraph
      text:
        ru: Такая практика приведет к тому, что монах будет чувствовать свое сердце и пребывать вниманием ума в нем (сердце), уже не прибегая к «психосоматической технике».
        cn: 这样的操练将使修士感受到自己的心，并且心智的专注会安住在其中（心里），不再需要借助「身心技术」。
  - type: heading2
    text:
      ru: Молитва Именем Иисуса применима во всех обстоятельствах
      cn: 奉耶稣之名的祷告在所有境况中都适用。
    children:
    - type: paragraph
      text:
        ru: 'Кто действительно верит, что евангельские заповеди даны Единым Истинным Богом, тот в самой этой вере черпает силу на жизнь по образу Христа. Верующий не позволяет себе критического подхода к слову Господню, но себя ставит на его суд. Таким путем он познаёт себя как грешника и сокрушается о своем жалком состоянии. Отсутствие сокрушения о грехах показатель, что ему еще не открылось видение того образа, по которому задуман человек прежде создания мира. Всякий истинно кающийся не ищет высшего созерцания: он всецело занят борьбою с грехом, со страстями. Лишь по очищении от страстей, хотя бы еще несовершенном, естественно и не насильственно предстают ему озаренные Светом духовные горизонты, дотоле неподозреваемые, и ум и сердце восхищаются любовью Божией. Тогда перестраивается наше естество, разбитое падением, и двери в область бессмертия приоткрываются.'
        cn: 凡是真正相信传福音的诫命是由独一真上帝所赐的，他就在这信仰中汲取力量，以基督的形象生活。信者不容许自己以批判的态度对待上主的话语，而是将自己置于话语的审判之下。如此一来，他便认识到自己是罪人，并为自己可悲的境况而痛悔。对罪缺乏痛悔是一个迹象，表明那人被构想成的、世界被创造之前的形象异象尚未向他显明。每一个真正忏悔的人都不寻求更高的默观：他全身心投入与罪、与情欲的搏斗中。只有在情欲得到洁净之后，哪怕这洁净尚不完全，那些被圣光照亮的、他此前从未想到的属灵地平线，才会自然而非强制地向他显现，他的心智和心灵便会为上帝的爱所倾倒。那时，我们因堕落而破碎的本性便会得到重塑，通往不朽之境的大门也便会渐渐敞开。
    - type: paragraph
      text:
        ru: Путь к святым созерцаниям лежит чрез покаяние. Доколе владеет нами мрачная гордость, несвойственная Богу, Свету, в котором нет ни единой тьмы, дотоле мы не приняты в Его вечность. Но страсть сия исключительно тонка, и мы сами не в силах распознать ее присутствие в нас до конца. Отсюда наша усердная молитва:«От тайных моих очисти меня и от умышленных удержи раба Твоего, чтобы не возобладали мною. Тогда я буду непорочен и чист от великого развращения. Да будут слова уст моих и помышление сердца моего благоугодны пред Тобою, Господи, твердыня моя и избавитель мой»(Пс. 18:13–15).
        cn: '通往圣善默观的道路在于借由悔改。只要黑暗的骄傲——这与上帝、与那毫无黑暗的光不相称的——仍在辖制我们，我们就不能被接纳进入祂的永恒。然而，这情欲极其精微，我们自己也无力彻底辨识其在我们自身中的临在。因此，我们恳切的祷告是：


          「求祢洁净我隐秘的过犯，并保守祢的仆人脱离任意妄为之罪，使之不致辖制我。如此我便纯全无瑕，远离大罪。愿我口中的言语、我心中的意念，在上主祢面前蒙悦纳。上主啊，祢是我的磐石，我的救赎主。」(诗篇 18:13-15)'
    - type: paragraph
      text:
        ru: 'Никто из нас, сынов Адама, не видит ясно своих грехов. Только в часы озарения Божественным Светом освобождаемся мы от этих страшных оков. И если сего нет, то хорошо с плачем взывать: «Господи, Иисусе Христе, Сыне Божий, помилуй мя грешного».'
        cn: 我们这些亚当的子孙，没有人能清楚看见自己的罪过。唯有在神圣之光照耀的时刻，我们才得以从这些可怖的枷锁中解脱。倘若没有这般光照，那么以哭泣呼求是好的：「主啊，耶稣基督，上帝之子，求祢怜悯我这罪人。」
    - type: paragraph
      text:
        ru: 'Ревностное следование заповедям Христа приводит человека к встрече со всеми возможными событиями в духовной космической сфере: один он не в силах ни сопротивляться, ни ясно разуметь, что губит и что спасает. В отчаянии он будет призывать Имя Бога Живого. И блажен будет, если посетит его луч Света из неприступной области Божества, который выявит подлинную природу всякого явления. Но если Свет еще не пришел, то все же не должно страшиться, но крепко молиться: «Господи, Иисусе Христе, Сын Бога Живого, помилуй мя», и снизойдет спасительная сила непременно.'
        cn: 热情地遵从基督的诫命，会使人遭遇在属灵宇宙领域中所有可能发生的事件：凭他自己，他既无力抵抗，也无法清晰地明辨何为毁灭，何为拯救。在绝望中，他必会呼求永生上帝的圣名。福哉他，如果一道光芒从不可企及的上帝神性领域临到他，这光芒将揭示每一个现象的真实本性。但如果光尚未降临，那么仍然不应惧怕，而是要恳切地祷告：「主耶稣基督，永生上帝之子，求祢怜悯我。」救赎的力量必将降临。
    - type: paragraph
      text:
        ru: 'В начале подвига мы не постигаем путей, указанных Богом; мы пытаемся уклониться от тяжелой борьбы с«огненными искушениями»(1Петр. 4, 12). Мы можем пребывать в мучительном состоянии непонимания: почему Бог, любовь всесовершенная, благоволил путь к Нему сделать действительно моментами страшным. Мы умоляем Его: открыть нам тайну путей спасения. Постепенно просвещается наш ум, и сердце собирает силу последовать Христу и чрез наши малые страдания приобщиться Его страданиям. Необходимо нам пережить и боль, и ужасы, чтобы нам раскрылись глубины бытия и мы сделались бы способными к заповеданной любви: вне страданий человек остается духовно ленивым, полуспящим, чуждым Христовой любви. Зная это, мы, когда сердце наше уподобляется бездействующему вулкану, согреваем его призыванием Имени Христа: «Господи, Иисусе Христе, Сын Бога Живого, помилуй мя».'
        cn: 在苦修之初，我们不领悟上帝所指引的道路；我们试图逃避一场与「火炼的试探」（彼得前书 4:12）进行的艰苦争战。我们可能会处于一种痛苦的、不解的状态中：为何上帝，这全然的爱，竟乐意祂的道路在某些时刻变得如此可怖。我们恳求祂：向我们揭示救赎之路的奥秘。我们的心智逐渐被光照，我们的心也集聚力量追随基督，并借着我们微小的苦难，参与到祂的苦难之中。我们必须经历痛苦与恐惧，以使存在的深层向我们敞开，我们得以拥有受命的爱：若无苦难，人仍会灵性懒惰、半睡不醒、与基督的爱格格不入。深知此理，我们当心如同休眠的火山时，便借着呼求基督的圣名来温暖它：「主耶稣基督，永生上帝之子，求祢怜悯我。」
    - type: paragraph
      text:
        ru: И пламя Божией любви действительно прикоснется к сердцу.
        cn: 并且，上帝之爱的火焰确实会触及人心。
    - type: paragraph
      text:
        ru: Стяжать молитву Именем Иисуса – значит стяжать вечность. В самые тяжкие минуты разложения нашего физического организма – молитва «Иисусе Христе» становится одеянием души; когда деятельность мозга нашего прекратится и все прочие молитвы станут трудны для памяти и произношения, тогда ставший нам интимно-ведомым исходящий от Имени свет боговедения пребудет неотъемлемым от духа нашего. После того, как мы видели кончину отцов наших, умерших в молитве, крепка наша надежда, что мир небесный, превосходящий всякий ум, навеки обымет и нас. «Иисусе, спаси меня... Иисусе Христе, помилуй, спаси... Иисусе, спаси меня... Иисусе Боже мой».
        cn: 获得耶稣圣名祷文，就是获得永恒。在我们肉身最深重瓦解的时刻——「耶稣基督」的祷文成为灵魂的衣裳；当我们的大脑活动停止，所有其他祷文都难以忆起和诵念时，那对我们而言已变得亲密熟知、源自圣名的神知之光，将与我们的灵不可分离地同在。在我们目睹了那些在祷告中离世的教父们之后，我们的希望是坚定的，那超越一切悟性的属天平安，也将永远拥抱我们。「耶稣，拯救我……耶稣基督，求祢怜悯，拯救……耶稣，拯救我……耶稣，我的上帝。」
    - type: paragraph
      text:
        ru: Торжество – тихое, святое – знать Бога любви – пробуждает в душе глубокое соболезнование всему человечеству. Сей всечеловек – есть моя природа, мое тело, моя жизнь и любовь. Я не могу совлечься моей «природы», оторваться от моего «тела», постоянно разорванного враждой одних «клеток» против других, составляющих единый по существу организм. Сие великое тело «все-человека» непрестанно находится в состоянии болезненного разрыва его частей, нам неподвластных. Болезнь представляется неизлечимою. И это есть наш удел в плане земли. Плачет душа до изнеможения в молитве, но спасение придет не иначе, как если сами люди в своей свободе возжелают сего. «Любите врагов ваших» – вот в чем и исцеление исторической жизни, и спасение для вечности. Познавший силу любви к врагам познал Господа Иисуса, распявшегося за врагов; предвосхитил таковой и воскресение свое, и Царство Христа Победителя, (см.:Ин. 17:21–23;Ин. 11:51–52;Еф. 2:14–17;1Кор. 3, 22и др.).
        cn: 安静、圣洁的庄严——认识爱之上帝——在灵魂深处唤醒对全人类深切的同情。这普世之人，是我的本性，我的身体，我的生命和爱。我无法脱离我的「本性」，无法与我的「身体」分离，这身体不断被一些「细胞」与另一些「细胞」之间的敌意所撕裂，而这些细胞本质上构成了一个统一的有机体。这「普世之人」的伟大身体，持续处于其各部分痛苦撕裂的状态中，而这些部分是我们无法掌控的。这病症似乎是无法治愈的。而这便是我们尘世的命运。灵魂在祷告中哭泣，直到筋疲力尽，但救赎唯有在人们以其自由意志渴望此之时方能到来。「爱你们的仇敌」——这便是历史生命的医治，亦是永恒的救赎。认识到爱仇敌之力量的人，便认识了为仇敌被钉十字架的上主耶稣；这样的人也预先领受了自己的复活，以及基督得胜者的国度（参见：约翰福音 17:21-23，约翰福音 11:51-52，以弗所书 2:14-17，哥林多前书 3:22等）。
    - type: paragraph
      text:
        ru: «Господи Вседержителю, Христе Иисусе, помилуй нас и мир Твой».
        cn: 主宰万有的主啊，基督耶稣，求祢怜悯我们和祢的平安。
    - type: paragraph
      text:
        ru: 'В мире человеческого духовного бытия только христианство дарует опыт и нетварного Света Божества, и кромешной тьмы ада. Подобная полнота познания дается исключительно чрез Христа-Бога и Духа Святого. В истории аскетического действия наших отцов мы видим, что им бывало дано бытийно созерцать преисподний мрак. И сие в такой мере, что эти люди исключительного мужества десятилетиями рыдали в молитвах своих. Но кто может поведать об этом? От лишенных живого опыта скрывается сия тайна, скрывается до времени всеобщего последнего Суда (ср.: Мф. 25и далее).'
        cn: 在人类精神存在的领域中，唯有基督教赐予那未受造的上帝之光的经验，以及地狱幽暗的经验。如此圆满的认知唯独借着基督-上帝和圣灵而得。在我们教父们的苦修事迹中，我们看到他们曾蒙受亲身默观幽冥之暗的恩赐。并且达到如此境地，以至于这些具备卓越勇气的人数十载在其祷告中哭泣不止。然谁能言说此事呢？对于那些未曾拥有活泼经验的人，此奥秘被隐藏着，一直隐藏到普世末日审判的时刻 (参：马太福音 25章及后续经文)。
    - type: paragraph
      text:
        ru: «Господи, Иисусе Христе, спаси нас».
        cn: 主啊，耶稣基督，求祢拯救我们。
    - type: paragraph
      text:
        ru: Велик дар – созерцать вечность в неприступном Свете Божества. Испытавшие сие блаженство не стремятся к стяжанию временных ценностей. Благодать этой силы не пребывает неотступно с человеком, и Свет умаляется в душе. Лишение ТАКОГО Бога вызывает страдание всего нашего существа, – но подобные оставления необходимы всем и каждому, чтобы не почил никто на лаврах, но продолжил свое следование за Господом, восходящим на Голгофу, высочайшую из всех гор в плане духа. Как бы ни была беспомощна подобная попытка, она все же перерождает человека, сообщая ему новую силу для восприятия подобия Христу.
        cn: 是何等伟大的恩赐啊，能于不可亲近的神性之光中默观永恒！凡经历过这份福乐的人，便不渴求积攒暂时的价值。这份力量的恩典不会恒久不离地与人同在，而光在灵魂中亦渐趋黯淡。失去如此的上帝，会令我们整个存有都受苦——然而，类似的被撇弃是每一个人都不可或缺的，为的是不让任何人安于现状，反而继续追随那位正攀登髑髅地的上主，髑髅地在灵性层面上乃众山之巅。无论这种尝试多么无力，它依然能使人重获新生，赋予他新的力量，去领受基督的形像。
    - type: paragraph
      text:
        ru: «Иисусе, Спасе наш, спаси меня грешного».
        cn: 耶稣啊，我们的救主，求祢拯救我这罪人。
    - type: paragraph
      text:
        ru: 'Когда молимся в тихом и уединенном месте, тогда нередко всякие ненужные мысли назойливо собираются вокруг ума, отрывая его внимание от сердца. Молитва кажется бесплодною, потому что ум не участвует в призывании Имени Иисуса, и только уста механически повторяют слова. Когда же кончается молитва, то обычно помыслы удаляются, оставляя нас в покое. В этом нудном явлении есть, однако, смысл: призыванием Имени Божия мы приводим в движение все тайное, скрывающееся внутри нас; молитва уподобляется снопу лучей света, брошенному на темное место нашей внутренней жизни, и открывает нам, какие страсти или привязанности гнездятся внутри нас. В таких случаях надо усиленно произносить Святое Имя, чтобы покаянное чувство возрастало в душе.'
        cn: 当我们在安静和僻静的地方祷告时，各种无益的念头常常烦扰地聚集在心智周围，使它的注意力从心上引开。祷告似乎毫无果效，因为心智没有参与呼求耶稣的圣名，而仅仅是口唇机械地重复着言语。然而，当祷告结束时，那些念头通常会离去，让我们得到安宁。在这种枯燥乏味的现象中，却有其意义：借着呼求上帝的圣名，我们启动了所有潜藏在我们里面的隐秘之物；祷告如同投射到我们内在生命黑暗之处的一束光芒，向我们揭示哪些情欲或依恋盘踞在我们里面。在这种情况下，必须加倍恳切地诵念圣名，以便悔罪之情在灵魂中滋长。
    - type: paragraph
      text:
        ru: «Господи, Иисусе Христе, Сыне Божий, помилуй мя грешного».
        cn: 主，耶稣基督，上帝之子，求祢怜悯我这罪人。
    - type: paragraph
      text:
        ru: 'Наш дух, нетленный по замыслу Божию о нас, томится в тюремной камере страстей греховных. Чем глубже боль наша от сознания нашей далекости от Бога в силу греха, тем напряженнее порыв нашей души к Богу, и она молится с великой тоской, со многим плачем, ища единения с Ним. И Он не презирает сокрушенного сердца и приходит к нам; и «глубокое» сердце человека осознает свое родство с Ним, «ощутимо» присутствующим и действующим внутри нас. Из этого видно, что и тело наше, свойственным ему образом, воспринимает дыхание Бога Живого: «Иисусе, Сыне Бога Живого, помилуй нас».'
        cn: 我们的灵，依照上帝对我们不朽的旨意，却在罪恶情欲的牢狱中备受煎熬。我们越是深切地感受到，因着罪的缘故我们与上帝的疏远所带来的痛苦，我们的灵魂便越是强烈地渴望奔向上帝，它带着极大的愁苦、泪流满面地祷告，寻求与祂合一。而祂不轻看忧伤痛悔的心，并来到我们这里；并且人「深沉的」心，也意识到自己与祂的亲缘关系——祂「可感知地」临在于我们里面并运行。由此可见，我们的身体也以其特有的方式，领受着活上帝的气息：「耶稣啊，活上帝之子啊，求祢怜悯我们。」
    - type: paragraph
      text:
        ru: 'Наследие, оставленное нам отцами: их учение и повествования о дарах Божиих – включают также и указания путей к боговидению, т.е. той борьбы, которую вели они во внутреннем мире своем с живущим в каждом из нас«законом греха»(Рим. 7, 23), этим трагическим последствием первого великого падения человека. Всякий, вступивший на поприще многогранной битвы за стяжание святой вечности, встретится, между прочим, с необходимостью противостоять разлагающему влиянию окружающего нас мира, отталкивающегося от молитвы; наилучший щит при этом опять-таки: «Господи, Иисусе Христе, помилуй нас и мир Твой».'
        cn: 父辈留给我们的遗产——他们的教导以及关于上帝恩赐的记述——也包括指向神视之道的指引，也就是他们在其内心世界所进行的争战，与居住在我们每个人之内的「罪的律法」（罗马书 7:23）相抗衡，这乃是人类第一次大堕落的悲剧性后果。凡是踏上为获取神圣永恒而进行的多元争战之途的人，都将特别遭遇需要抵抗我们周围世界的瓦解性影响，这世界是排斥祷告的；对此，最好的盾牌依然是：「上主，耶稣基督，求祢怜悯我们和祢的世界。」
    - type: paragraph
      text:
        ru: 'Имя Иисуса Христа для верующего подобно высокой крепостной стене. Нелегко врагу проникнуть чрез тяжелые железные врата внутрь обманом, если внимание наше не рассеивается на внешние предметы. Молитва Его Именем дает душе силу не только противостоять вредным влияниям извне, но и больше того: возможность влиять на среду, в которой живем: как бы исходить из внутренней глубины сердца и общаться с братьями в любви и мире. Умножающийся мир и любовь, заповеданная Богом, – становятся источником горячей молитвы за весь мир. Дух Христа выводит нас на просторы любви, обнимающей всю тварь. В таком состоянии душа с великим чувством молится: «Господи, Иисусе Христе, Спасителю наш, помилуй нас и мир Твой».'
        cn: 耶稣基督之名对于信徒而言，犹如一道高大的城墙。如果我们的心神不被外物所分散，仇敌便不易通过诡计，穿过沉重的铁门进入内部。借着祂的圣名祷告，不仅赐予灵魂力量去抵挡来自外部的有害影响，更能影响我们所处的环境：仿佛从内心深处发出，在爱与和平中与弟兄们交通。逐渐增多的和平与上帝所诫命的爱，成为为整个世界热切祷告的源泉。基督之灵引领我们进入爱的广阔天地，拥抱一切受造物。在这样的状态下，灵魂带着深切的感受祷告：「主耶稣基督，我们的救主，求祢怜悯我们和祢的世界。」
    - type: paragraph
      text:
        ru: Бог никогда не насилует волю человека; но и Его невозможно силою заставить сделать что бы то ни было. В молитве нашей мы стремимся предстать в единстве и целостности нашего существа; прежде всего в соединении ума с сердцем. Чтобы достигнуть сего блаженного соединения двух наиглавнейших сил нашей личности – мы не прибегаем ни к каким искусственным средствам (психотехнике); в начале мы приучаем ум вниманием стоять в молитве, как нас учат отцы; т.е. внимательно произносить Имя Иисуса Христа и прочие слова молитвы. Сосредоточенное призывание Имени Божия с повседневным усилием жить согласно заповедям Евангелия приводят к тому, что и ум, и сердце естественно сливаются в едином действии.
        cn: 上帝从不强迫人的意志；但也不可能用强力迫使祂做任何事。在我们的祷告中，我们努力达到我们本性的统一与完整；首先是理智与心灵的结合。为了达到我们位格这两种最重要的力量——理智与心灵——神圣的结合，我们不借助任何人为的方法（心理技术）；起初，我们训练理智以专注立于祷告中，正如教父们所教导我们的；也就是说，专注地诵念耶稣基督的圣名以及祷告中的其他话语。专注地呼求上帝的圣名，并伴随着每日努力按照福音的诫命生活，这便会使得理智与心灵自然地在一个行动中合一。
    - type: paragraph
      text:
        ru: 'В подвиге нашем мы никогда не должны спешить. Необходимо отбросить идею: сделать максимум в минимальный срок. Опыт веков показал, что достигнутое путем психотехники соединение не удерживается надолго; и что важнее – не соединяет дух наш с Духом Бога Живого. Пред нами стоит вопрос вечного спасения в глубоком смысле. Для этого все наше естество должно переродиться: из плотского сделаться духовным. И когда Господь находит нас способными воспринять Его благодать, тогда не медлит Он придти в ответ на наше смиренное призывание. Его пришествие иногда бывает настолько всепоглощающим, что и сердце, и ум всецело заняты только Им; сей видимый мир уступает место реальности иного порядка, высшего. Ум перестает мыслить дискурсивно: он весь становится вниманием. Сердце же приходит в трудноописуемое состояние: оно полно страха, но благоговейного, животворящего. Дыхание при этом бывает сдержанным: Бог зрится и внутри, и вне. Он все наполняет, и весь человек: дух-ум, сердце-чувство, и даже тело слитно живут только Богом.'
        cn: 在我们的灵修苦功中，我们绝不可急躁。我们必须抛弃「在最短时间内取得最大成就」的念头。几个世纪的经验表明，通过心理技术达成的结合无法持久；更重要的是，它无法将我们的精神与活的上帝的圣灵联合起来。摆在我们面前的，是关于永恒救赎的深层问题。为此，我们全部的天然本性必须蜕变：从属肉体的变为属灵的。当上主发现我们能够领受祂的恩典时，祂便不迟延，降临以回应我们谦卑的呼求。祂的降临有时会如此全然地占据一切，以至于心与悟性全然专注于祂；这个可见的世界让位于另一种更高、更深层面的实相。悟性不再进行推论性思维：它全然成为专注。而心则进入一种难以言喻的状态：它充满恐惧，但那是敬畏的，赐予生命的。此时呼吸变得内敛：上帝在内在外都被洞见。祂充满一切，而整个的人：灵-悟性，心-情感，甚至身体都与上帝融为一体，唯独以上帝为生。
    - type: paragraph
      text:
        ru: «Господи, Иисусе Христе, Боже наш, помилуй нас и мир Твой».
        cn: 主耶稣基督，我们的上帝，怜悯我们和祢的平安。
    - type: paragraph
      text:
        ru: Я дерзнул говорить о том, что монах обычно хранит внутри, как драгоценную тайну, из страха, что «Иисус уклонится от толпы» (ср.:Ин. 5, 13). Когда я жил еще в монастыре, мне было дано сие, но с большей силой по выходе моем на пустыню. Там, в уединении, я испытывал присутствие Бога Живого до забвения о мире. Невозможно адекватно описывать опыт Божиих посещений. Они не повторяются все в той же форме, но едва ли не каждый раз привходит нечто новое, и иная последовательность.
        cn: 我冒昧谈论了僧侣通常深藏于内、视作珍贵奥秘的事物，唯恐「耶稣避开了众人」（参：约翰福音 5:13）。我还在修道院时，蒙受了这恩赐，但当我进入旷野之后，这恩赐以更大的力量降临。在那里，在独处中，我体验到活生生之上帝的临在，甚至忘却了尘世。无法充分描述上帝造访的经验。它们并非总是以相同的形式重复，但几乎每一次，都有新的事物临到，并伴随着不同的次序。
    - type: paragraph
      text:
        ru: 'Помню, как призывание Имени Иисуса Христа слилось с пришествием (невидимым) Его Самого; и с того момента сие Чудное Имя, да и другие Имена Божии, значительно более прежнего являются для меня каналами единения с Ним. В то время я был уже иереем. Совершение Божественной литургии также приняло иной характер: это был не только акт благочестивой, чистой от колебаний веры, но ощущение всем моим существом ФАКТА присутствия Бога, совершающего Таинство. Тогда ощутил я глубоко смысл и реальность, заключенные в словахВасилия Великого: «Ты даровал нам небесных тайн откровение» (ср.: молитва приношения). Да, Господь и нам, последним из всех людей, открывает тайну священнодействия.'
        cn: 我记得，呼求耶稣基督之圣名，融合于祂（无形的）降临之中；从那一刻起，这奇妙的圣名，以及其他上帝的圣名，对我而言，远胜从前，成为与祂合一的渠道。当时我已是司祭。举行神圣礼仪也呈现出不同的特质：这不仅是敬虔的、纯粹且无丝毫动摇的信德行为，而是我整个身心对「上帝——施行奥秘者」之临在这一事实的感受。那时我深刻地感受到了蕴含在大巴西略（瓦西里）圣言中的意义与真实：「祢赐予我们天上奥秘的启示」（参阅：呈献祷文）。是的，上主也向我们，这世上至微的人，揭示了圣仪的奥秘。
    - type: paragraph
      text:
        ru: 'Много после сего приходило умных постижений действенности литургического служения, но не знаю, найду ли я слова для выражения пережитого мною? Литургия, как Божественный акт, воспринимается всем существом: нет вопросов – КАК это возможно? Пред иереем это очевидность бытийного факта. «Приимите – это есть Тело Мое... Пиите – это есть Кровь Моя». И раньше я причащался не без веры, не без любви, но с менее ярким сознанием происходящего.Чрез призывание Имени Иисуса Христа был дан мне опыт блаженного, но и вместе страшного присутствия Вечного Бога. Конечно, это не значит, что такая последовательность обязательна для всех.правды оно же испытывает некоторое «стеснение»; таким образом, через молитву совершается неусыпный внутренний контроль над каждым движением нашего духа; ни одна мысль, никакое слово не избегает сего. Это следствие непрестанной молитвы позволяет свести грехи наши до возможного минимума.'
        cn: 此后很久，曾有许多关于礼仪事奉效能的聪慧领悟临到我，但我不知我能否找到言语来表达我所体验的？圣礼，作为一项神圣的行动，被整个生命所领受：毫无疑问——这怎么可能？在司祭面前，这是存在事实的明证。「领受吧——这是我的身体……饮用吧——这是我的血……」甚至以前，我也并非没有信德，并非没有爱德地领受圣体圣血，但对所发生之事的意识没有那么鲜明。透过呼求耶稣基督之圣名，我获得了一种蒙福的，但同时也是可畏的永恒上帝的临在体验。当然，这并不意味着这样的次第对所有人都是必然的。然而，它也感受到某种「局促」；如此一来，借由祷告，我们精神的每一个活动都受到永不懈怠的内在监管；没有任何一个思想，没有任何一个言语能逃脱这一点。这是恒常祷告的后果，使得我们的罪孽降至可能的最低限度。
    - type: paragraph
      text:
        ru: 'С первых слов литургии: «Благословено Царство Отца и Сына и Святаго Духа» – приходит милостивый ответ Бога. Не всегда с одинаковой интенсивностью. Литургический канон требует особенно ответственного внимания; наивысшим же является момент эпиклезиса. Иерей, и с ним все присутствующие в храме, обращаются к Богу-Отцу с прошением – ниспослать Духа Святого. И Сей приходит и совершает то, о чем была молитва.'
        cn: 从礼仪的开端，即「是蒙福的圣父、圣子、圣灵的国度」这几句开始，上帝仁慈的回应便随之而来。并非总是强度一致。礼仪规程要求格外认真的关注；而最高潮的时刻则是呼求圣灵的时刻（epiklesis）。祭司与所有在圣堂中的信众，向着上帝圣父祈求——降下圣灵。而圣灵便临到，并成就了所祈求的一切。
    - type: paragraph
      text:
        ru: 'Чрез Литургический Акт я научился созерцать жизнь Христа-Человека. Прежде, чем сказать апостолам: «Приимите – сие есть Тело Мое», Он втайне молился Отцу. Он не сказал этих страшных слов как Вседержитель, но как Сын Человеческий, научая нас не сотворить ни единого внутреннего движения, носящего характер «самообожения». Я положил это разумение в основание моей жизни во Христе: я молюсь Отцу, как тварь; я жду спасения только как дара любви Свыше; усыновления ищу не иначе, как чрез Христа; освящения и просвещения только чрез Духа Святого. Все сии Три – Отец, Сын и Дух Святой – в моем глубоком сознании – Единая Жизнь, Единое Царство, Единый Свет, Единая Любовь. В Каждом из Них абсолютная полнота Божества. Они разделяются во мне нераздельно. Они сливаются во мне неслиянно. Это – вечный факт Божеского Бытия, печать Которого жажду воспринять при сознании моего полного недостоинства. Я не  пытаюсь объяснять Святое Триединство чрез логическую абстракцию. Я благоговейно живу эту великую Тайну, чрез откровение которой мне дан ответ на все мои вопросы.'
        cn: 借着礼仪行动，我学会了默观人子基督的生命。在对使徒们说：「领受吧——这是我的身体」之前，祂在暗中向父祷告。祂并非以全能者的身份说出这些可畏的言语，而是以人子的身份，教导我们不要产生任何带有「自我神化」性质的内心动向。我把这一领悟置于我在基督里的生命之基石上：我向父祷告，如同受造物一般；我期盼救赎，唯独将其视为自上而来的爱之恩赐；我寻求儿女的名分，只通过基督；成圣与光照唯独通过圣灵。这三位——父、子、圣灵——在我深刻的意识中，是同一的生命，同一的国度，同一的光，同一的爱。在祂们每一位中，都拥有神性的绝对丰满。祂们在我内，分而不可分；祂们在我内，合而不可合。这乃是神性存有的永恒事实，我渴望在全然意识到自己的不配时，领受其印记。我不试图借着逻辑抽象来解释神圣三一。我虔敬地活出这伟大的奥秘，通过这奥秘的启示，我所有的疑问都得到了回答。
    - type: paragraph
      text:
        ru: 'Наше рождение и затем рост на Земле есть не что иное, как творческий процесс, в течение которого мы усваиваем бытие в доступной нам мере, в надежде, что не завершенное здесь познание будет восполнено до совершенства за пределами этой формы нашего существования. Когда в нашем духовном видении сливаются все пережитые нами опыты как в едином центре нашей персоны; когда и мрачный ад, и нетварный Свет соединяются в нашем духе как познанные нами реальности, тогда мы начинаем понимать значение Имени Иисус – то есть Спаситель. Он, Свет безначальный, «истощил Себя до рабьего зрака», до сошествия во ад, чтобы изъять оттуда Адама. И мы ныне зовем Его в молитве: «Иисусе, Сыне Бога Живого, Спасе наш, помилуй нас и мир Твой».'
        cn: 我们的降生及随后的尘世成长，无非是一个创造性的过程，在此过程中，我们按我们所能达到的程度领受存在，寄望于此地未完成的认知，将在我们此种存在形式之外被补足至完善。当我们所有经历过的体验，在我们属灵的视野中，如同汇聚于我们个人本位的单一中心；当那幽暗的阴间，以及那未受造之光，在我们灵里结合为我们所认知的实相，那时我们便开始领悟耶稣之名的意义——即救主。祂，那无始之光，「虚己，取了奴仆的形像」，甚至降至阴间，为要将亚当从那里救拔出来。我们如今在祷告中呼求祂：「耶稣，永生上帝之子，我们的救主，怜悯我们和祢的世界。」
    - type: paragraph
      text:
        ru: 'Имя Божие, открытое людям, служило связью между Богом и нами. Именем Божиим, лучше сказать – Именами Божьими совершаются в Церкви все таинства. Во Имя Божие должно твориться всякое дело. Чрез призывание Имени Всевышнего – Его присутствие становится живым, постоянно ощущаемым: сердце мирно, когда дело наше по воле Господа, и в каждом случае уклонения в какую-либо сторону от правды, оно же испытывает некоторое «стеснение»; таким образом, через молитву, совершается неусыпный внутренний контроль над каждым движением нашего духа; ни одна мысль, никакое слово не избегает сего. Это следствие непрестанной молитвы позволяет свести грехи наши до возможного минимума.'
        cn: 启示予世人的上帝之名，乃是连接上帝与我等之间的纽带。藉着上帝之名，更确切地说——藉着上帝诸名，教会内一切圣事均得以成就。在上帝之名内，凡事都当成就。藉着对至高者之名的呼求，祂的临在便成为活泼的、持续可感的：当我等之事合乎上主旨意时，心中平安；而在任何偏离真理的情况下，心便会感到某种「拘束」；如此一来，藉着祷告，便成就了不倦的内在监管，针对我等灵性之每一个动向；无一思念，亦无一言语，能逃脱此监管。此不倦祷告之果效，使我等之罪得以减少，至于可能的最低限度。
    - type: paragraph
      text:
        ru: «Господи, Иисусе Христе, Сыне и Слове Бога Живого, помилуй нас».
        cn: 主啊，耶稣基督，永生上帝之子及圣言，求祢怜悯我们。
    - type: paragraph
      text:
        ru: '«Сподоби, Господи, в день сей без греха сохранитися нам». Так молимся мы по утрам. Но только тонкое присутствие Духа Божия в нас дает возможность пребывать в действенном внутреннем трезвении духа нашего.«Никто не может назвать Иисуса Господом, как только Духом Святым»(1Кор.12, 3). Снова убеждаемся, что чрез умное призывание Имени Господня спасаемся мы от погрешностей в делах и словах наших: «Господи Иисусе, Ты Свет, пришедый спасти мир, просвети умные очи сердца моего, да буду достоин без преткновений, как при свете дня, совершать путь мой пред Лицом Твоим» (ср.:Ин. 11:9–10).'
        cn: «求祢，上主，恩准我们今日免于犯罪。» 我们如此在清晨祈祷。然而，唯有圣灵在我们里面精微的临在，才使我们能够持守内在有效的灵性警醒。《若非藉着圣灵，没有人能称耶稣为主。》（哥林多前书 12:3）我们再次深信，藉着心智的呼求上主之名，我们得以免于在行为和言语上的过失：「上主耶稣，祢是那降世拯救世界的光，光照我心智之眼，使我配得，如同在白昼的光中，毫无绊跌地在祢面前行我的路。」（参照：约翰福音 11:9-10）
    - type: paragraph
      text:
        ru: Чтобы делание молитвы приводило к тем результатам, о которых с таким восторгом говорят наши отцы и учители, необходимо следовать их учению. Первое условие – вера во Христа как Бога-Спасителя; второе – сознание себя погибающим грешником. Это сознание может достигать такой глубины, что человек ощущает себя худшим всех других; и это ему предстает как очевидность, не в силу внешне соделанных актов, но как увидение своей удаленности от Бога и себя – как потенциального носителя всякого зла.
        cn: 为了使祷告的操练能带来我们的教父和导师们如此热切谈论的那些结果，就必须遵循他们的教导。第一个条件是，相信基督是上帝-救主；第二个条件是，认识到自己是一个沉沦的罪人。这种认识可以达到如此的深度，以至于人会觉得自己是比所有人都更坏的；并且这在他看来是显而易见的，不是因为外在所行的事，而是因为他看到了自己与上帝的疏远，并且看到了自己是潜在的各种邪恶的载体。
    - type: paragraph
      text:
        ru: Чем больше смиряемся мы в болезненном покаянии, тем быстрее молитва наша достигает Бога. Когда же мы теряем смирение, тогда никакие подвиги не помогают нам. Действие в нас гордости, осуждения братьев, превозношение и неприязнь к ближним – далеко отбрасывают нас от Господа.
        cn: 我们在痛苦的悔改中越是谦卑，我们的祷告就越快达到上帝。然而，当我们失去谦卑时，任何善功都无益于我们。骄傲在我们里面作祟，论断弟兄，自高自大，以及对近人的厌恶——这一切都使我们远远地远离上主。
    - type: paragraph
      text:
        ru: 'К Богу мы приходим, как последние грешники. Мы искренне осуждаем себя во всем. Мы ничего не воображаем, ничего не ищем, кроме прощения и помилования. Таково наше постоянное внутреннее состояние. Мы умоляем Самого же Бога помогать нам не оскорблять нашими гнусными страстями Духа Святого; не причинить никакого вреда брату нашему (всякому человеку). Мы осуждаем себя, как недостойных Бога, на адские муки. Мы не ждем никаких особых дарований Свыше, но лишь стремимся всеми силами постигнуть истинный смысл заповедей Христа и жить согласно с ними. Мы взываем: «Господи, Иисусе Христе, Сыне Божий, помилуй нас и мир Твой». И Бог слышит нас, и приходит к нам спасение.«И будет: всякий, кто призовет имя Господне (в подобном расположении духа), спасется»(Иоиль 2, 32).'
        cn: '我们来到上帝面前，如同最末的罪人。我们真诚地在一切事上定罪自己。我们不存任何幻想，不寻求任何事物，除了赦免和怜悯。这就是我们恒常的内在状态。我们恳求上帝祂自己帮助我们，不以我们可憎的情欲冒犯圣灵；不加害我们的弟兄（即所有人）。我们定罪自己，为不配上帝的，应受地狱的苦刑。我们不期望任何来自上天的特殊恩赐，而只愿竭尽全力领悟基督诫命的真义，并照着它们生活。我们呼求：「主耶稣基督，上帝之子，怜悯我们和祢的平安。」上帝就垂听我们，救恩就临到我们。


          「凡求告上主之名的（存着如此心境的），必得拯救。」(约珥书 2:32)'
    - type: paragraph
      text:
        ru: '«Покайтеся»(Мф.4, 17). Нам должно строго воспринять призыв Христа: изменить радикально образ нашей внутренней жизни и наше мировидение; наши отношения к людям и ко всякому явлению в тварном бытии: не убивать врагов, но побеждать их любовью. Помнить, что нет зла абсолютного; абсолютно только безначальное Благо. И сие Благо заповедало нам:«любите врагов ваших... благотворите ненавидящим вас... будьте совершенны, как совершен Отец ваш небесный»(Мф. 5:44, 48). Предать себя на заклание за братьев – лучшее орудие вырвать их из рабства клеветнику-дьяволу и приготовить души их к принятию Бога, Который хочет спасти всех людей. Нет такого человека, в котором не присутствовал бы в той или иной мере свет, потому что Бог просвещает«всякого человека, приходящего в мир»(Ин. 1, 9). Заповедь – «не противься злому» – есть максимально эффективная форма борьбы со злом. Когда насилию противятся теми же средствами, к которым прибегает творящий неправду, тогда возрастает динамика мирового зла. Убийство неповинных невидимым часто образом перемещает моральные силы человечества на сторону того добра, за которое умер невинный. Не так, когда с обеих сторон наступает та же недобрая тенденция доминировать. Победа физической силою не длится вечно. Бог, сый свет святой и чистый, отступает от преступников; последние отпадают от единственного источника жизни, и умирают:«Не мстите за себя, возлюбленные, но дайте место гневу Божию. Ибо написано: «Мне(принадлежит)отмщение, Я воздам, говорит Господь. И так... не будь побежден злом, но побеждай зло добром»(Рим. 12, 19, 21).'
        cn: 「悔改吧」（马太福音 4:17）。我们应当严格地领受基督的召唤：彻底改变我们内在生活的样式和我们的世界观；改变我们与人以及与受造界一切现象的关系：不杀戮仇敌，而是以爱战胜他们。要记住，没有绝对的恶；唯有无始的善才是绝对的。这善也命令我们说：「爱你们的仇敌……善待那些恨你们的人……你们要完全，如同你们的天父是完全的」（马太福音 5:44，48）。为弟兄们舍己受死——这是最好的工具，能将他们从诽谤者——魔鬼的奴役中解救出来，并预备他们的灵魂去接受上帝，祂愿意拯救所有的人。没有一个人，不在某种程度上拥有光，因为上帝光照「一切生到世上来的人」（约翰福音 1:9）。「不要抵挡那恶的」这一诫命，是与恶作斗争最有效的方式。当人们以行不义者所采用的相同手段抵挡暴力时，世上的邪恶动态就会增长。杀害无辜者，常常以无形的方式，将人类的道德力量转向那无辜者为之而死的良善一方。但当双方都出现那种欲求主导的恶意倾向时，情况就并非如此了。依靠物质力量的胜利不会永远持续。上帝，祂是圣洁纯净的光，远离罪犯；罪犯便从唯一生命的源头坠落，继而死亡：「亲爱的，不要为自己伸冤，宁可让步，听凭上帝的愤怒。因为经上记着：『伸冤在我，我必报应。』上主说。所以……你不可为恶所胜，反要以善胜恶。」（罗马书 12:19，21）。
    - type: paragraph
      text:
        ru: 'Люди, носители лишь относительной правды, в фанатической борьбе за торжество их идеи разлагают цельность бытия, и в конечном итоге приводят все к гибели. В своем ослеплении они абсолютизируют положительный аспект их политической доктрины и готовы отстранять всех тех, кто хотел бы увидеть жизнь вселенной построенною на лучших, более гуманных началах; и конечно, прежде всего на заповедях Христа, убитого за Свою проповедь любви. В современном мире евангельские слова Христа принимают особенно актуальный характер:«услышите о войнах и о военных слухах. Смотрите не ужасайтесь: ибо надлежит всему тому быть; ...и вы(христиане)будете ненавидимы всеми народами за имя Мое... и по причине умножения беззаконий, во многих охладеет любовь... и тогда придет конец»(Мф. 24:6–14).'
        cn: 那些只持有相对真理的人，在狂热地为他们的思想的胜利而斗争中，瓦解了存在的整体性，并最终导致一切走向毁灭。在他们的盲目中，他们将其政治学说中积极的一面绝对化，并准备排斥所有那些希望看到宇宙生命建立在更美好、更人道的原则之上的人；当然，首先是建立在基督的诫命之上，祂因宣讲爱而被杀害。在当代世界，基督福音中的话语显得尤为切合时宜：「你们将要听见打仗和打仗的风声。你们要谨慎，不要惊慌，因为这些事是必须有的；……你们（基督徒）要为我的名被万民恨恶……只因不法的事增多，许多人的爱心才渐渐冷淡了……那时，结局就来到。」(马太福音 24:6-14)。
    - type: paragraph
      text:
        ru: '«Господи, Иисусе Христе, Сыне Божий, помилуй нас и мир Твой». Мир весь погружен в распри: между государствами с различными социальными строями; между расами и классами; верованиями и идеологиями и подобное. При современных средствах массовых разрушений и уничтожении – все и повсюду живут в атмосфере«ожидания бедствий, грядущих на вселенную»(Лк. 21, 26). И вот, мы стоим перед сплетением трудноразрешимых парадоксов. С одной стороны, мы не можем оставаться спокойными, ибо мы принадлежим к семье людской, с общими во многих моментах судьбами; с другой – слова Христа:«Когда начнет это сбываться, тогда восклонитесь, и поднимите головы ваши, потому что приближается избавление ваше»(Лк. 21, 28). Не здесь подробнее останавливаться над описанием уже создавшихся положений апокалиптического напряжения; но мы не оставим сильного оружия, которое дал нам Господь: молитву: «Господи, Иисусе Христе, Сыне Бога Живого, помилуй нас и мир Твой», и доколе это будет практически возможным – совершение литургической жертвы.'
        cn: 「主耶稣基督，上帝之子，求祢怜悯我们和祢的世界。」整个世界沉浸在纷争之中：在不同社会制度的国家之间；在种族和阶级之间；在信仰和意识形态之间，以及诸如此类。在现代大规模破坏和毁灭的手段之下，所有人，在所有地方，都生活在「等候那将临普世的灾祸」的氛围之中（路加福音 21:26）。于是，我们正面临着诸多难以解决的悖论交织而成的局面。一方面，我们无法保持平静，因为我们属于人类大家庭，在许多方面命运与共；另一方面，是基督的话语：「当这些事开始应验时，你们要挺身昂首，因为你们的救赎近了」（路加福音 21:28）。我们不在此详细描述已经形成的末世性紧张局面；但我们不会放弃上主赐予我们的强大武器：祷告：「主耶稣基督，永生上帝之子，求祢怜悯我们和祢的世界」，并且只要在实际操作上可行——施行圣祭。
    - type: paragraph
      text:
        ru: '«И создал Господь Бог человека из праха земного, и вдунул в лицо его дыхание жизни, и стал человек душою живою»(Быт. 2:7). И мы влечемся к Нему, томимые жаждой соединиться с Ним вечным образом. И Сам Он ждет нас с любовью. Жажда Бога – постоянная окраска нашего земного бывания; с ней собираемся мы и умирать. Сам Христос при кончине на кресте воскликнул: «жажду». Он и «алкал» (Мф. 21, 18), и жаждал, и «томился» (Лк. 12, 50), чтобы мы познали Отца. И мы томимся на земле, опечаленные кошмарным беспрерывным зрелищем насилий, убийств, ненависти, и жаждем придти к Отцу, и призываем Имя Единородного Сына Его: «Господи, Иисусе Христе, Сыне Божий, помилуй нас».'
        cn: 「上主上帝用地上的尘土造了人，又将生命的呼吸吹进他的面容里，人就成了一个活的魂灵。」(创世记 2:7) 我们被祂吸引，饱受渴慕之苦，渴望以永恒的方式与祂结合。而祂自己也满怀慈爱地等候我们。对上帝的渴慕是我们地上生存永恒的底色；我们也将带着这渴慕而逝去。基督自己在十字架上临终之时大声喊道：「我渴了。」祂也「饿了」(马太福音 21:18)，也渴了，也「心急如焚」(路加福音 12:50)，为使我们认识父。而我们也在地上煎熬着，被那可怕而无休止的暴力、杀戮、仇恨景象所悲伤，并且渴慕来到父的面前，并呼求祂独生子的圣名：「主耶稣基督，上帝之子，怜悯我们。」
    - type: paragraph
      text:
        ru: '«Тогда отверз им ум к уразумению Писаний и сказал им: так написано, и так надлежало пострадать Христу и воскреснуть из мертвых в третий день, и проповедану быть ВО ИМЯ ЕГО ПОКАЯНИЮ во всех народах...»(Лк. 24, 45–47). Если Имя Его дает нам радость познания тайны любви Безначального к нам, то, конечно, возлюбим мы и самое Имя. В нем содержится «домостроительство тайны, скрывавшейся от вечности в Боге, создавшем все Иисусом Христом»,«избравшем нас в Нем прежде создания мира, чтобы мы были святы и непорочны пред Ним в любви, предопределив усыновить нас Себе чрез Иисуса Христа»(Еф. 1:4–5, 3–9).'
        cn: 「于是开他们的心窍，使他们能明白圣经，又对他们说：照经上所写的，基督必受害，第三日从死里复活，并且人要奉祂的名传悔改的道，直到万邦……」(路加福音 24:45-47)。如果祂的圣名赐予我们认识那无始者对我们之爱奥秘的喜乐，那么，我们当然也会爱这圣名本身。在其中蕴含着「奥秘的经纶，这奥秘是自永世以来就藏在借着耶稣基督创造万有的上帝里面」，「祂在创立世界以前，在祂里面拣选了我们，使我们在爱里，在祂面前成为圣洁，没有瑕疵；又按着自己的意旨所喜悦的，预定我们借着耶稣基督得儿子的名分」(以弗所书 1:4-5，3-9)。
    - type: paragraph
      text:
        ru: «Господи, Иисусе Христе, Сыне Единородный, помилуй нас».
        cn: 主耶稣基督，独生子，求祢怜悯我们。
    - type: paragraph
      text:
        ru: 'Многолетняя молитва трансформирует нашу падшую природу настолько, что она становится способною воспринять освящение чрез открывшуюся нам Истину; и это – прежде, чем мы покинем сей мир (ср.:Ин. 17, 17): «Господи, Иисусе, помилуй нас».'
        cn: 经年累月的祷告能转化我们堕落的本性，使其能够借着向我们启示的真理而领受圣化；而这，是在我们离开此世之前（参：约翰福音 17:17），即「上主耶稣，求祢怜悯我们。」
    - type: paragraph
      text:
        ru: 'Безмерное величие стоящей пред нами задачи внушает нам страх. Нам сказано, что«Царство силою берется, и употребляющие усилия восхищают его»(Мф. 11, 12). Длительный подвиг покажет нам, что в евангельском откровении все принадлежит иному, высшему плану. Ослепительный Свет Божества отражается в нашем плане как заповеди:«Любите врагов ваших... будьте совершенны, как совершен Отец...»(Мф. 5, 44, 48). Только вселение Того, Кто дал нам сии заповеди, поможет исполнить повеленное. Отсюда наш крик к Нему: «Господи, Иисусе Христе, Сын Бога Живого, помилуй нас».'
        cn: 我们面前任务的无限宏伟令我们心生恐惧。我们被告知，「天国是努力进入的，努力的人就得着了」（马太福音 11:12）。漫长的灵修努力将向我们揭示，在福音的启示中，一切都属于一个不同的、更高的层面。神性的耀眼光辉在我们的层面上反映为诫命：「爱你们的仇敌……你们要完全，像你们在天上的父完全一样……」（马太福音 5:44，48）。唯有赐予我们这些诫命者的内住，方能帮助我们遵行所吩咐的。因此我们向祂呼求：「主啊，耶稣基督，永生上帝之子，求祢怜悯我们。」
    - type: paragraph
      text:
        ru: 'Призывание Имени Господа постепенно соединяет с Ним. Частично это происходит даже тогда, когда молящийся еще не разумеет,"КТО ЭТО"(Мф. 21, 10), и еще неясно ощущается исходящая от Имени сила освящения. Всякое дальнейшее продвижение, однако, непременно связывается со все углубляющимся осознанием нами греховности, доводящей нас до отчаяния. Тогда мы с возрастающей энергией призываем чудное Имя: «Иисусе, Спасе мой, помилуй мя».'
        cn: 呼求上主之名使人逐渐与祂结合。部分地，这甚至在祈祷者尚未明了「这是谁」（马太福音 21:10），并且尚未清楚地感受到源自圣名的成圣力量时，就已经发生。然而，一切更深远的进益，必然与我们对自身罪性的日益深切的体认相关联，此罪性将我们引向绝望。于是，我们以日益增长的热忱呼求这奇妙的圣名：「耶稣，我的救主，怜悯我。」
    - type: paragraph
      text:
        ru: Святое Предание, драгоценнейшее наследие нам от Самого Господа чрез апостолов и отцов Церкви, учит нас пребывать в нищете духовной, в сознании нами присутствующей в нас смерти греховной, если мы действительно стремимся стоять в истине.«Если говорим, что не имеем греха, обманываем себя, и истины нет в нас. Если исповедуем грехи наши, то Он, будучи верен и праведен, простит нам грехи наши и очистит нас от всякой неправды. Если говорим, что мы не согрешили, то представляем Его лживым, и слова Его нет в нас»(1Ин. 1:8–10).
        cn: 圣传，这从上主亲自藉着使徒和教会的教父们赐予我们的最宝贵遗产，教导我们安住于灵性上的贫乏，并意识到我们内在的罪性死亡，如果我们确实渴望站立在真理之中。「如果我们说自己没有罪，便是欺骗自己，真理就不在我们里面。我们若认自己的罪，神是信实的，是公义的，必赦免我们的罪，洗净我们一切的不义。我们若说自己没有犯过罪，便是以神为说谎的，神的道就不在我们里面了」（约翰一书 1:8-10）。
    - type: paragraph
      text:
        ru: «Господи Иисусе Христе, Боже наш, помилуй мя грешного».
        cn: 主耶稣基督，我们的上帝，怜悯我罪人。
    - type: paragraph
      text:
        ru: 'С каким напряжением живут люди постигающие их смертельные болезни, например, рак, с таким же, а иногда и большим ужасом живут некоторые присутствие в них греховных страстей, отлучающих от Господа. Таковые истинно сознают себя «хуже всех»; искренне видят себя во тьме кромешной. Тогда внутрь их собирается наибольшая энергия молитвы-покаяния. Последнее может достигать такой степени, что ум их останавливается и не находит слов, кроме: «Иисусе, спаси мя грешного».'
        cn: 凡察觉到自己患有致命疾病，例如癌症的人，内心是何等紧张不安；同样地，甚至怀着更大的恐惧，有些人因他们心中存在着使他们与上主隔绝的罪恶情欲而生活着。这样的人真切地意识到自己「比所有人都糟」；他们真诚地看见自己身处极深的黑暗之中。那时，在他们内心深处会汇聚起最大的祷告与悔罪的能量。后者可以达到这样一种程度，以至于他们的理智停滞，找不到任何言语，除了这句：「耶稣，求祢拯救我这罪人。」
    - type: paragraph
      text:
        ru: 'Спасительно для нас, если растет в нас отвращение от греха, переходящее в ненависть к самому себе. Иначе мы в опасности сжиться с грехом, который так многогранен и тонок, что мы обычно и не замечаем его присутствия во всех наших действиях, даже по виду благих. Труден, но и прекрасен подвиг – погрузить наш верховный ум в невидимый центр нашей личности с призыванием Имени Иисуса Христа, без веры в Которого никто не может прозревать действующего внутри нас смертельного яда греха. Чрез такую борьбу со злом, живущим внутри нас, нам откроются не только глубины нашего собственного бытия, но и таинственные бездны космической жизни. Тогда дух наш отойдет от мелких и поверхностных явлений повседневности и в «ужасе» от самого себя познает святую силу иной молитвы, иного плана, взывая: «Господи Иисусе, Спасе мой, помилуй, помилуй мя, окаянного».'
        cn: 于我们有益的是，如果我们里面对罪恶的厌恶增长，进而转化为对自己的憎恨。否则，我们就有与罪恶共存的危险，因为它如此多面且细微，以至于我们通常察觉不到它存在于我们所有的行为中，即使是那些表面看来良善的行为。将我们至高的心思沉浸于我们人格中那不可见的中心，并呼求耶稣基督的圣名——这项功修既艰难又美好。若不信靠祂，无人能洞察那作用于我们内在的致命罪毒。透过如此与居住在我们里面的邪恶搏斗，我们将得以看见的，不仅是我们自身存在的深渊，更是宇宙生命那奥秘的无底深渊。那时，我们的灵将远离日常生活中琐碎而肤浅的现象，并在对自身的「惊惧」中，认知到一种不同祷告、不同层面的圣洁力量，呼求着：「主耶稣啊，我的救主啊，怜悯我，怜悯我这可怜人。」
    - type: paragraph
      text:
        ru: 'О молитве Именем Иисуса Христа можно говорить в терминах Писания и Творений святых отцов. А именно: она есть пожирающий страсти огонь (ср.:Евр. 12, 29); она есть свет, просвещающий наш ум; делающий его проницательным и дальнозорким; способным видеть все, совершающееся внутри нас. Про нее достойно говорить словами Послания к евреям: «она действенна и острее всякого меча обоюдоострого; она проникает до разделения души и духа, составов и мозгов, и судит помыслы и намерения сердечные, и нет ничего в глубинах духа нашего, сокровенного от нее, но ВСЕ ОБНАЖЕНО И ОТКРЫТО при свете ее» (Евр. 4:12–13).'
        cn: 关于耶稣基督圣名祷文，可以从圣经和圣教父著述的角度来谈论。具体而言：它是一团吞噬情欲的烈火（参：希伯来书 12:29）；它是一道光，照亮我们的心智，使其变得敏锐而有远见，能够看清我们内心所发生的一切。关于它，值得用希伯来书中的话来说：「它是活泼而有功效的，比一切两刃的剑更锋利；它能刺入，甚至将魂与灵、骨节与骨髓分开，并辨明心中的思想和意念，并且在我们灵的深处，没有什么能向它隐藏，反而在它的光照下，一切都是赤露敞开的。」 (希伯来书 4:12-13)
    - type: paragraph
      text:
        ru: Делание этой молитвы приводит человека к встрече со многими силами, скрытыми в «Космосе»; она вызывает великую брань против него со стороны этих космических сил, лучше же сказать:«мироправителей тьмы века сего, духов злобы поднебесных»(Еф.6, 12). Победа, однако, приходит при покаянии «до ненависти к себе» (ср.:Лк. 14, 26). Образ сей битвы описан в Откровении св. Иоанна:«Они победили его (дьявола и сатану, обольщающего всю вселенную) кровью Агнца и словом свидетельства Своего, И НЕ ВОЗЛЮБИЛИ ДУШИ СВОЕЙ ДАЖЕ ДО СМЕРТИ»(Апок. 12:11, 9).
        cn: 践行这祷告引导人与隐藏在「宇宙」中的许多力量相遇；它引起一场对抗他的大争战，来自这些宇宙力量，更好的说法是：「这世代黑暗的掌权者，在天空的邪恶之灵」（以弗所书 6:12）。然而，胜利是藉着「至于恨恶自己」的悔改而来的（参：路加福音 14:26）。这场争战的景象记载于圣约翰的《启示录》中：「他们胜过了他（迷惑普天下的魔鬼和撒旦），藉着羔羊的血和他们所见证的道，并且不爱惜自己的性命，甚至于死」（启示录 12:11，9）。
    - type: paragraph
      text:
        ru: 'При пламенном покаянии молитва сия возносит дух человека в сферы, лежащие за пределами достижения«мудрости мудрецов...века сего"(1Кор. 1:19–20). Страшно говорить о ней: проведя предварительно по безднам тьмы кромешной, скрытой внутри нас, она затем соединяет дух наш с Духом Божиим воедино, и еще отсюда дает нам жить святую вечность. Во все века отцы поражались величием дара сего падшему миру: Господи, Иисусе Христе, Едине Святый, Едине истинный Спаситель всех, Помилуй нас и мир Твой.'
        cn: 在炽热的悔改中，这祷告将人的灵提升到超越「今世智慧人的智慧……今世的」所能及的领域（哥林多前书 1:19-20）。谈论它令人敬畏：它先将我们引向隐藏在我们内在的极深幽暗的深渊，然后将我们的灵与上帝的圣灵合而为一，并从此处就让我们活出神圣的永恒。在所有时代，教父们都惊叹于此恩赐对堕落世界的伟大：「主啊，耶稣基督，祢是独一的圣者，祢是独一的、所有人的真正救主，求祢怜悯我们和祢的世界。」
    - type: paragraph
      text:
        ru: 'Восторгает нас красота тварного мира, но в то же время с еще большей силой влечется наш дух к нетленной красоте Безначального Божеского Бытия. С поразительной ясностью Господь Иисус приоткрыл нам надмирный свет Небесного Царства. Созерцание сего великолепия освобождает нас от последствий падения, и благодать Духа Святого восстанавливает в нас первозданный образ и подобие Божие, явленный нам Христом в нашей плоти; и теперь призывание Его Имени является нашей непрестанной молитвой: «Господи, Иисусе Христе, Спасе наш, помилуй нас и мир Твой».'
        cn: 受造世界的美丽令我们赞叹，然而与此同时，我们的心灵却以更大的力量被吸引至无始之神圣存有那不朽的华美。主耶稣以惊人的明晰向我们启示了天国那超世的圣光。默观这华美使我们从堕落的后果中得以释放，圣灵的恩典在我们里面恢复了基督在我们的肉身中向我们显明的、起初的上帝的形象和样式；如今，呼求祂的名是我们不间断的祷告：「主啊，耶稣基督，我们的救主，怜悯我们，并赐祢平安。」
    - type: paragraph
      text:
        ru: Эта молитва в своей последней реализации соединяет нас вполне со Христом. Человеческая ипостась при этом не уничтожается, не растворяется в Божественном Бытии, как капля воды в океане. Личность человека неразрушима в вечности."АЗ ЕСМЬ";«Я есмь... истина и жизнь». «Я свет миру»(Ин. 8, 58, 14:6, 9:5). Бытие, Истина, Свет не суть отвлеченные понятия, безличные сущности – «ЧТО», но «КТО». Там, где нет персональной формы бытия, там нет и живущего; подобно тому, как нет там ни добра, ни зла; ни света, ни тьмы. Там вообще ничего не может быть:«Без Него ничтоже бысть, еже бысть.В Нем была жизнь»(Ин. 1:3–4).
        cn: 这祷告在其最终圆满时，将我们与基督完全联合。在此之中，人的位格不被消灭，也不像水滴入海洋一般，消融于神圣的存有之中。人的位格在永恒中是不可毁灭的。"我是自有永有的"；"我就是……真理和生命"；"我就是世界的光"（约翰福音 8:58，14:6，9:5）。存有、真理、光并非抽象的概念，并非无位格的实体——一个「什么」，而是一个「谁」。在没有位格化的存有形式之处，那里就没有生命；正如那里既无善也无恶，也无光也无暗。那里根本什么也无法存在："凡被造的，没有一样不是借着祂造的。生命在祂里面"（约翰福音 1:3-4）。
    - type: paragraph
      text:
        ru: «Господи, Иисусе Христе, Сыне Бога Живого, помилуй нас и мир Твой».
        cn: 「主耶稣基督，活的上帝之子，怜悯我们和祢的世界。」
    - type: paragraph
      text:
        ru: 'Когда с призыванием Имени Иисуса соединяется пришествие Несозданного Света, тогда особенно ясно открывается нам значение сего Имени; тогда возможен опыт«Царствия Божия, пришедшего в силе»(Мр. 9, 1), и дух молящегося улавливает голос Отца:«Сей есть Сын Мой возлюбленный; Его слушайте»(Мр. 9:1–7). И мы молимся: «Господи, Иисусе Христе, Единородный Сыне Отца, помилуй и спаси нас».'
        cn: 当呼求耶稣之名与非受造之光的降临结合时，此名的意义便特别清晰地向我们显现；那时便能体验到《上帝之国带着能力降临》(马可福音 9:1)，并且祷告者的灵能捕捉到父的声音：《这是我的爱子；你们要听祂》(马可福音 9:1-7)。于是我们祷告：「主耶稣基督，父的独生子，求祢怜悯并拯救我们。」
    - type: paragraph
      text:
        ru: 'Христос явил нам в Себе Отца:«видевший Меня – видел Отца»(Ин. 14, 9). Теперь мы знаем Отца в той мере, в какой познали Сына:«Я и Отец – едино есмы»(Ин. 10, 30). Итак: Сын являет Отца, и Отец свидетельствует о Сыне; и мы молимся: «Сыне Божий, Единородный, помилуй и спаси нас и мир Твой».'
        cn: 基督在祂自身中向我们启示了父：「看见我的，就是看见了父」(约翰福音 14:9)。如今我们认识父，乃是藉着我们认识子：「我与父原为一」(约翰福音 10:30)。因此：子启示父，父为子作证；于是我们祷告说：「上帝之子，独生子，怜悯并拯救我们和祢的世界。」
    - type: paragraph
      text:
        ru: '«Все предано Мне Отцом Моим, и никто не знает Сына, кроме Отца; и Отца не знает никто, кроме Сына, и кому Сын хочет открыть»(Мф. 11, 27). Сына же мы знаем постольку, поскольку пребываем в духе Его заповедей. Без Него мы бессильны подняться до заповеданной нам высоты, так как в заповедях раскрывается жизнь Самого Бога. Отсюда крик наш к Нему: «Господи, Иисусе Христе, Собезначальный Отцу Сыне, помилуй мя; прииди и вселися в мя со Отцом и Духом Святым по обетованию Твоему (Ин. 14, 23)...Господи, Иисусе, помилуй мя грешного».'
        cn: 「我父将一切都交付了我；除了父，没有人认识子；除了子和子所愿意启示的人，没有人认识父」(马太福音 11:27)。我们认识子，仅限于我们住在祂诫命的精义之中。没有祂，我们无力达到所受命的高度，因为在诫命中，上帝自己的生命得以显现。因此，我们向祂呼求：「上主，耶稣基督，与父同始无终之子，怜悯我！照祢的应许，偕父和圣灵降临住在我内（约翰福音 14:23）……上主，耶稣，怜悯我这罪人。」
    - type: paragraph
      text:
        ru: 'В Ветхом Завете Имя Отца было ведомо, но созерцался Он во мраке непостижимости. Христос же явил нам Отца с предельной конкретностью в Себе; Он раскрыл истинный объем всего, что было дано до Него чрез Моисея и пророков.«Я во Отце и Отец во Мне»(Ин. 14, 11):«Я и Отец – едино есмы»(Ин. 10, 30).«Я открыл им Имя Твое, и открою (до полноты), да любовь, которою Ты возлюбил Меня, в них будет, и Я в них»(Ин. 17, 26). Познание Имени Отца есть познание и Его, Отчей, к нам любви. Призывая Имя Иисуса, вводимся в область Божественной Жизни, и Отец, и Сын, и Дух Святой – даны нам в Имени Иисуса: «Господи, Иисусе Христе, Сыне Божий, помилуй нас и мир Твой».'
        cn: 在旧约中，父的圣名是为人所知的，但祂在不可测度的幽暗中被默观。基督却在祂自身内以极度的具体性向我们显明了父；祂揭示了藉着摩西和先知们在祂之前所赐予的一切的真实范围。「我在父里面，父在我里面」（约翰福音 14:11）：「我与父原为一」（约翰福音 10:30）。「我已将祢的名指示他们，且要指示（直到完全），使祢爱我的爱在他们里面，我也在他们里面」（约翰福音 17:26）。认识父的圣名，就是认识祂对我们那父性之爱。呼求耶稣的圣名，我们就进入神圣生命的领域，父、子和圣灵——都借由耶稣的圣名赐予我们：「主耶稣基督，上帝之子，求祢怜悯我们并赐予我们祢的平安。」
    - type: paragraph
      text:
        ru: 'Призывать Имя Иисуса с возможно полным сознанием того, что оно несет в себе, значит уже реально быть в единстве с Богом Святой Троицей. Сей Бог открылся нам в Его новом отношении к человеку: уже не как Творец, но как Спаситель мира: как Свет Истины и истинной вечности: «Господи, Иисусе Христе, Сыне Предвечного Отца, помилуй нас».'
        cn: 带着对它所蕴含的意义尽可能完全的意识来呼求耶稣圣名，就已然真实地与圣三一上帝合一了。这位上帝在祂与人新的关系中向我们启示了自己：不再是作为造物主，而是作为世界的救主；作为真理之光和真正的永恒：「主啊，耶稣基督，永恒之父的圣子，求祢怜悯我们。」
    - type: paragraph
      text:
        ru: 'Богословие Имени и богословие иконы имеют общие черты. Взирая на икону Христа, мы духом восходим в личный контакт с Ним. Мы исповедуем Его явление во плоти: Он – и Бог, и человек; всецелый человек и совершенное подобие Божие. Мы идем дальше красок и линий, в мир умный, духовный. Так и в призывании Имени мы не останавливаемся на звуках, но живем смыслом. Звуки могут изменяться в зависимости от различия языков, но содержание-познание, заключенное в Имени, пребывает неизменным: «Господи, Иисусе Христе, спаси нас».'
        cn: 圣名神学与圣像神学有共通之处。当我们瞻仰基督圣像时，我们在灵里升华，与祂建立个人联系。我们宣认祂道成肉身：祂既是上帝，又是人；是完全的人，又是上帝的完美肖像。我们超越色彩与线条，进入那可智性理解的、属灵的世界。同样，在呼求圣名时，我们不停留在声音上，而是活在意义之中。声音可以随语言的不同而改变，但蕴含于圣名之中的内容-领悟却恒久不变：「主耶稣基督，拯救我们。」
    - type: paragraph
      text:
        ru: 'Одно звуковое призывание Имени Божия недостаточно:«Не всякий, говорящий Мне: Господи, Господи! войдет в Царство; но исполняющий волю Отца Моего небесного. Многие скажут Мне в тот день: Господи! не от Твоего ли Имени мы пророчествовали? Не Твоим ли Именем бесов изгоняли? и не Твоим ли Именем многие чудеса творили? и тогда объявлю им: Я никогда не знал вас; отойдите от Меня, делающие беззаконие»(Мф. 7:21–23). Нелегко нам слышать эти слова: страшен суд Божий: «Господи, Иисусе, помилуй и спаси мя грешного».'
        cn: 单单口头呼求上帝之名是不够的：「凡称呼我『主啊，主啊』的人，不能都进天国；惟有遵行我天父旨意的人，才能进去。当那日，必有许多人对我说：『主啊，主啊，我们不是奉祢的名传道吗？不是奉祢的名赶鬼吗？不是奉祢的名行许多异能吗？』我就明明地告诉他们说：『我从来不认识你们；你们这些作恶的人，离开我去吧！』」(马太福音 7:21-23)。我们听闻这些话语并不容易：上帝的审判是可畏的：「主耶稣，求祢怜悯并拯救我这罪人。」
    - type: paragraph
      text:
        ru: 'Сознавая обетованное нам чрез Христа сыноположение, прославим Создавшего нас. Призывая Имя Иисуса Христа, дадим ему звучать в нас со свойственными ему силою и величием; пусть оно сотворит нас причастниками славы Его: пусть чрез Имя сие вселится в нас Его мир, превосходящий всякий разум (ср.:Ин. 14, 27;Фил. 4, 7). После многих лет молитвы сим Именем да даст нам Бог познать полноту заключенного в нем откровения: Чудный Советник; Бог крепкий; Отец Вечности; Князь мира; Господь Саваоф (Ис.9, 6, 8:18;Деян. 4, 12). «Господи, Иисусе Христе, Сыне Бога Живого, помилуй нас и мир Твой».'
        cn: 意识到我们借着基督所蒙受的嗣子名分，让我们颂赞创造我们的上帝。呼求耶稣基督的圣名，愿它带着其固有的能力与威严在我们里面回响；愿它使我们成为祂荣耀的分享者；愿借着这圣名，祂那超越一切理智的平安居于我们之内（参看：约翰福音 14:27，腓立比书 4:7）。经过多年以这圣名的祷告，愿上帝使我们认识这圣名中包含的启示之全备：奇妙的谋士；全能的上帝；永恒之父；和平之君；撒巴沃特上主（以赛亚书 9:6，8:18，使徒行传 4:12）。「主啊，耶稣基督，永生上帝之子，求祢怜悯我们及祢的平安。」
    - type: paragraph
      text:
        ru: 'В смирении должны мы призывать Имя Божие. Вот, Христос, Владыка мира, воплотившись, как человек смирял Себя даже до крестной смерти. И потому превознесено Имя Его превыше всякого имени, именуемого не только в сем веке, но и в будущем: Отец посадил Его«одесную Себя на небесах... поставил Его... главою Церкви, которая есть Тело Его, полнота Наполняющего все во всем»(ср.:Еф. 1:20–23).'
        cn: 在谦卑中，我们应当呼求上帝之名。看哪，基督，世界之主，道成肉身，作为人，谦抑自己，甚至至于十字架上的死亡。正因为如此，祂的名已得高举，超越万名之上，不但在今世，也在来世所称的：父使祂坐在天上自己的右边……又使祂……作教会的元首，教会是祂的身体，是那充满万有者在万有中充满的丰盛» (参阅：以弗所书 1:20-23)。
    - type: paragraph
      text:
        ru: «Господи Иисусе Христе, Боже наш, помилуй нас, иЦерковьТвою, и мир Твой, молитвами Богородицы, святых апостолов и всех от века святых Твоих».
        cn: 主耶稣基督，我们的上帝，求祢怜悯我们，和祢的教会，和祢的世界，藉着圣母、圣使徒们以及从亘古以来所有祢的圣徒们的代祷。
    - type: paragraph
      text:
        ru: Путь наших отцов требует крепкой веры и долготерпения, тогда как наши современники пытаются схватить все духовные дары, включая даже непосредственное созерцание Абсолютного Бога, нажимом и в короткий срок. Нередко среди них встречается склонность провести параллель между молитвою Именем Иисуса и йогой, или «трансцендентальной медитацией» и подобное сему. Полагаю нужным указать на опасность такого заблуждения – опасность смотреть на молитву как на простейшее и легкое «техническое» средство, приводящее к непосредственному единению с Богом. Считаю необходимым категорически подчеркнуть радикальное различие между Иисусовой молитвой и всеми иными аскетическими теориями. Заблуждаются все те, что стремятся мысленно совлечься всего преходящего, относительного, чтобы таким образом перешагнуть некий невидимый порог, осознать свою безначальность, свое «тожество» с Истоком всего сущего; чтобы возвратиться к Нему, слиться с Ним, безымянным трансперсональным Абсолютом; чтобы растворить в океане сверхмысленного и свою персональность, смешивая сию последнюю с индивидуализированною формою природного существования. Аскетические усилия подобного рода дали некоторым возможность подняться до металогического созерцания бытия; испытать некий мистический трепет, познать состояние молчания ума, по выходе сего последнего за пределы временных и пространственных измерений. В подобных опытах человек может ощущать покой совлечения непрестанно меняющихся явлений видимого мира; раскрыть в себе свободу духа и созерцать умную красоту.
        cn: 我们教父的道路要求坚固的信仰和恒久的忍耐，而我们的同时代人却试图通过强求，在短时间内攫取所有属灵恩赐，甚至包括直接默观绝对的上帝。他们之中不乏有人倾向于将耶稣祷文与瑜伽、或「超觉冥想」等类似事物划等号。我认为有必要指出这种谬误的危险性——即将祷告视为一种最简单、最轻省的「技术」手段，能够带来与上帝直接合一的手段。我认为有必要明确强调耶稣祷文与所有其他苦修理论之间的根本性区别。所有那些致力于意念上摆脱一切变幻无常的、相对的事物，以此跨越某个无形的门槛，认识到自己的无始性，自己与万物本源的「同一性」；以便回归到祂那里，与这位无名的超个人绝对者融合；以便在超思维的海洋中溶解自己的位格，将后者与个体化的自然存在形式相混淆的人，都陷入了谬误。这种苦修努力使某些人得以提升至超逻辑的存在默观；体验到某种神秘的战栗，并在心智超越时空界限之后，领悟到心智寂静的状态。在这种体验中，人可能会感受到摆脱不断变化的可见世界现象所带来的平静；在自身内发现精神的自由，并默观理性的美。
    - type: paragraph
      text:
        ru: Конечное развитие такой имперсоналистической аскетики многих привело к усмотрению божественного начала в самой природе человека; к тенденции к самообожению, лежащей в основе великого Падения; прозреть в себе некую «абсолютность», которая по существу есть не что иное, как отражение Божией Абсолютности в созданном по образу; испытать влечение к возврату в то состояние покоя, в котором человек был, якобы, до явления своего в этот мир; во всяком случае, после опыта совлечения может родиться в уме этот род мысленной аберрации. Я не ставлю в данном случае пред собою цели перечислить все вариации умственных интуиции, но скажу из моего собственного опыта, что Бога Истинного, Живого, т.е. Того, Который есть «о онтос Он», – во всем этом НЕТ. Это есть естественный гений человеческого духа в его сублимированных движениях к Абсолюту. Все созерцания, достигаемые на этом пути, суть самосозерцания, а не Богосозерцание. В этих положениях мы раскрываем для себя красоту еще тварную, а не Перво-Бытие. И во всем этом нет спасения человеку.
        cn: 这种非位格主义苦修主义的最终发展，导致许多人将神性本原视为人自身天性的一部分；导致了一种自我成神的倾向，这倾向正是大堕落的根源；在自身中洞察到某种「绝对性」，这本质上无非是上帝的绝对性在按其形象所造之物中的反映；体验到一种回归到那种安宁状态的吸引，据称人在此世显现之前曾处于这种状态；无论如何，在经历「脱离」之后，这种思想上的偏差可能会在心中滋生。在此我无意列举心智直觉的各种变体，但我将从自己的经验出发来说明，真实的、活的上帝，即那「ο онтос Он」（真正存有者），在所有这一切中，并不存在。这只是人类精神在趋向绝对者的升华运动中所展现的自然天赋。在这条道路上所达成的一切默观，皆为自我默观，而非默观上帝。在这些境况中，我们为自己揭示的，仍是受造之美，而非原始存有。而在这所有的一切中，人是得不到救恩的。
    - type: paragraph
      text:
        ru: 'Начало подлинного избавления в несомненном, всецелом принятии Откровения:«Аз есмь Сый»...«Аз есмь Альфа и Омега, первый и последний»(Апок. 1, 10). Бог – Абсолют Личный, Троица единосущная и нераздельная: на сем Откровении строится вся наша христианская жизнь. Сей Бог вызвал нас из небытия в жизнь сию. Познание сего Живого Бога и проникновение в тайну путей творения Его освобождает нас от мрака наших собственных, снизу идущих идей об Абсолюте; спасает нас от влечения, не осознанного, но все же губительного, к уходу от всякого существования – бывания. Сотворены мы с тем, чтобы быть приобщенными Божественному Бытию подлинного Сущего. Христос указал нам сей длинный путь:«Тесны врата и узок путь, ведущие в жизнь»(Мф. 7, 14). Постигая глубины мудрости Творца, мы принимаем страдания, в которых стяжевается вечность Божия. И когда осиявает нас Свет Его, тогда мы совмещаем в себе созерцание двух концов бездны: с одной стороны, мрак ада, с другой – торжество победы. Мы бытийно вводимся в область Божественной нетварной Жизни. И ад теряет власть над нами. Нам дается благодать: жить состояние Воплощенного Логоса – Христа, сходящего во ад как Победитель. Мы тогда, силою Его любви, объемлем всю тварь в молитве: «Иисусе, Вседержитель Благий, помилуй нас и мир Твой».'
        cn: 真正得救的开端在于毫无疑问、完全接纳启示：「我就是那自有者」……「我是阿拉法，我是俄梅戛；我是首先的，我是末后的」（启示录 1:10）。上帝是位格性的绝对者，三位一体，同质而不可分割：我们的全部基督徒生活都建立在这一启示之上。这位上帝将我们从虚无之中召唤到此生。认识这位活生生的上帝，并深入祂创造之道途的奥秘，使我们从自身那些源于低层、关于绝对者的观念之黑暗中获得自由；拯救我们脱离一种吸引力，这吸引力虽未被察觉，却依然是毁灭性的，使我们趋向于舍弃一切存在——本体。我们受造是为了得以分享真正自有者的神圣存有。基督指示了我们这条漫长的道路：「导向生命，那门是窄的，路是小的」（马太福音 7:14）。领悟造物主智慧的深邃，我们接纳苦难，在其中我们得获上帝的永恒。当祂的光照耀我们时，我们便能同时在自身内观照深渊的两端：一方面是地狱的黑暗，另一方面是胜利的凯旋。我们在本体上被引入神圣的非受造生命领域。地狱便对我们失去权柄。我们蒙受恩典：去活出道成肉身之圣言——基督——的状态，即祂作为得胜者降入阴间。那时，藉着祂爱的大能，我们在祷告中拥抱一切受造之物：「耶稣，至善的全能者，怜悯我们和祢的平安。」
    - type: paragraph
      text:
        ru: 'Откровение Персонального Бога всему придает сей дивный характер. Бытие не есть некий детерминированный космический процесс, но Свет неописуемой любви Божественных и тварных персон. Свободное движение духов, исполненное разумного сознания всего сущего и самосознания. Вне сего – нет смысла ни в чем, но только смерть. Молитва же наша становится живой встречей нашей тварной персоны с Персоной Божественной, т.е. абсолютного порядка. И выражается она обращением к Слову Отца: «Господи, Иисусе Христе, Собезначальный Слове Безначального Твоего Отца, помилуй нас, вселися в ны, спаси нас и мир Твой».'
        cn: 位格上帝的启示，赋予万物此奇妙特质。存有并非某种被决定的宇宙过程，而是神圣与受造位格不可言喻之爱的光辉。诸灵的自由运行，充满对万有的理性意识与自我意识。离此之外，万事万物便毫无意义，唯有死亡。而我们的祷告，便成为我们受造位格与神圣位格，即绝对秩序的活泼相遇。而它则通过呼求天父的圣言而表达：「主耶稣基督，祢无始之父共始的圣言，怜悯我们，居于我们之中，拯救我们与祢的平安。」
    - type: paragraph
      text:
        ru: 'Начало постижения мудрого плана о нас Творца и Бога нашего стимулирует нашу любовь к Нему, и мы в молитве испытываем новое вдохновение. Созерцание божественной Премудрости в красоте мира влечет наш дух к новому восходу, который уже отрывает нас от всего тварного. Отрыв сей не есть некое философское витание в сфере чистых идей, как бы ни казались они нам привлекательными; ни художественно-поэтическое творчество; но захват всего существа нашего энергией неведомой дотоле жизни. К возвышению духа нашего превыше всего тварного приводит нас Евангелие, в котором мы начинаем усматривать Акт Божественного Самооткровения. Это есть вступление в благодать богословия, не как человеческой науки, но как состояния богообщения. Слово Господне мы не ставим на суд нашего низменного рассудка, но самих себя судим во свете данного познания. В нашем естественном после сего стремлении сделать евангельское слово содержанием всего нашего бытия мы освобождаемся от власти над нами страстей и силою Бога-Иисуса побеждаем космическое зло, гнездящееся внутри нас. Мы действенно познаем, что Он, Иисус, есть единственный в собственном смысле Спаситель-Бог, и молитва христианская совершается непрестанным призыванием Его Имени: «Господи, Иисусе Христе, Сыне Божий и Боже, помилуй нас и мир Твой».'
        cn: 领悟我们的造物主和上帝关于我们的智慧计划的开端，激发我们对祂的爱，使我们在祷告中体验到新的灵感。在世界的美中默观神圣智慧，将我们的精神牵引至一个新的升华，这升华已将我们从一切受造之物中抽离。这种抽离并非在纯粹理念领域中某种哲学性的漫游，无论它们对我们看起来多么有吸引力；也不是艺术诗性的创作；而是我们整个存在被一种此前未知的生命能量所攫取。福音将我们引领至精神超越一切受造之物的提升，在福音中我们开始洞察神圣自我启示的行动。这就是进入神学恩典的门径，并非将其作为一门人类科学，而是作为与上帝交通的状态。我们不将主的道置于我们卑微理性的审判之下，而是根据这既有知识来审判我们自身。在此之后，我们自然而然地努力将福音的道化为我们整个存在的内容，从而从激情对我们的掌控中得以自由，并借着上帝-耶稣的力量，战胜盘踞在我们内在的宇宙性邪恶。我们切实地认识到，祂，耶稣，是真正意义上唯一的救主-上帝，而基督徒的祷告是藉着不住地呼求祂的圣名而完成的：「主耶稣基督，上帝之子和上帝，怜悯我们和祢的平安。」
    - type: paragraph
      text:
        ru: 'Великий вопрос, ставший трагической проблемой для всего человечества: где подлинное Бытие, и где мираж нашего падшего воображения? Где воистину живая вечность, и где обманчивые притяжения нашего духа к сознаваемым нашим же умом идеям? Является ли принцип персоны-ипостаси ограничительным сам по себе, и следовательно – недостойным и неприложимым к Богу, или воистину именно сей принцип есть образ Живого Абсолюта: АЗ ЕСМЬ СЫЙ? От того или иного решения нашего зависит все наше будущее. Если мы остановимся на мысли, что принцип персоны сам в себе есть лимитативный, то в аскетическом подвиге нашем мы будем делать все, чтобы превзойти в нас самих сие начало. И наоборот: если мы воспримем его как единственно возможный образ Бытия Абсолюта, то в восторге от вливающейся в нас силы мы будем молиться: «Отче наш, Иже еси на небесех...» или: «Господи, Иисусе Христе, Сыне Отчий, помилуй нас, включи нас в Твою жизнь, исцелив нас от всякого следа убивающего нас греха». Если обетованное нам во Христе чрез воскресение бессмертие есть личное, то никак не захотим мы«совлечься, но облечься, чтобы смертное поглощено было жизнью. На сие самое и создал нас Бог и дал нам залог Духа»(2Кор. 5:4–5).'
        cn: 伟大的问题，已成为全人类的悲剧性难题：真实的存有何在？我们堕落想象力的幻象又何在？真正活泼的永恒何在？我们灵性趋向我们心智所意识到的观念而受到的欺骗性吸引又何在？位格-本体（hypostasis）原则，其自身是否具有限制性，因此不配且不适用于上帝？或着，这一原则确实是活泼绝对者的形象：我即我是（АЗ ЕСМЬ СЫЙ）？我们未来的全部，皆取决于我们的此一或彼一抉择。如果我们持此想法，认为位格原则本身是有限的，那么在我们的苦修善功中，我们就会竭尽全力，以求超越我们自身中的这一本原。反之亦然：如果我们将其视为绝对者存有之唯一可能的形象，那么因那涌入我们生命中的力量而欣喜若狂时，我们便会祷告：「我们在天上的父……」或是：「上主耶稣基督，天父之子，求祢怜悯我们，将我们纳入祢的生命，治愈我们脱离一切杀害我们的罪恶痕迹。」若基督藉复活所应许我们的不朽是位格性的，那么我们绝不愿「被剥去，而是被穿上，好使那必死的被生命吞灭。为此，上帝创造了我们，并赐予我们圣灵的凭据。」（哥林多后书 5:4-5）。
    - type: paragraph
      text:
        ru: «Христе Иисусе, восставший из мертвых, помилуй нас».
        cn: 基督耶稣，从死里复活的，垂怜我们。
    - type: paragraph
      text:
        ru: '«Если не уверуете, что это Я(Который открылся Моисею на Синае),то умрете в грехах своих»(Ин. 8, 24);«Авраам... рад был увидеть день Мой; и увидел, и возрадовался»(Ин. 8, 56);«Являлся я Аврааму, Исааку и Иакову с именем «Бог всемогущий»; а с именем Моим «Иегова» не открылся им»(Исх. 6, 3; ср.:Деян. 7, 2).«...Если бы вы верили Моисею, то поверили бы и Мне: потому что он писал о Мне...»(Ин. 5, 46).«И начав от Моисея, из всех пророков изъяснил им сказанное о Нем во всем Писании»(Лк. 24, 27). Так в нашей духовной смерти мы утеряли чувство греха, и ныне без Христа и благодати Святого Духа не можем видеть его в себе. Грех же, по существу своему, есть всегда преступление против любви Божией. Возможно такое преступление не иначе, как если «АЗ ЕСМЬ», то есть Бог Абсолютный, Персонален и наши с Ним отношения глубоко персональны. Нет иной веры, религии, где бы так раскрывалась тайна греха. Вот, святойЕфрем Сирин, исполненный Духа Святого, молился: «Даруй ми зрети моя прегрешения»; и все отцы говорили, что видеть свой грех есть нечто большее, чем иметь явления Ангелов. Итак, мы, познавая сокровенное от века, в умилении сердца зовем:'
        cn: 「若不信我是（那在西奈山向摩西显现者），就必死在你们的罪中」（约翰福音 8:24）；「亚伯拉罕……欢喜盼望看见我的日子；既看见了，就快乐」（约翰福音 8:56）；「我曾以「全能的上帝」之名向亚伯拉罕、以撒、雅各显现；却未曾以我的名「上主」向他们显现」（出埃及记 6:3；参：使徒行传 7:2）。「……你们若信摩西，也必信我，因为他书写的是关于我的事……」（约翰福音 5:46）。「于是从摩西开始，又从众先知书上，凡经上所指着自己的话，都给他们讲解明白了」（路加福音 24:27）。因此，在我们灵性的死亡中，我们丧失了罪的感受，如今没有基督和圣灵的恩典，我们无法在自身内看见它。罪，就其本质而言，总是对上帝之爱的冒犯。这样的冒犯之所以可能，唯有当「我是」（АЗ ЕСМЬ）——即那绝对的、具有位格的上帝——存在，且我们与祂的关系是深刻的位格性关系。没有其他的信仰、宗教，能够如此揭示罪的奥秘。看哪，圣厄弗仑·叙利亚人，满溢着圣灵，曾如此祷告：「求祢赐我看见自己的罪愆」；且所有教父都曾说过，看见自己的罪孽是更伟大的事，甚于得见天使的显现。因此，我们领悟那自古隐藏的奥秘，在心中充满感动地呼求：
    - type: paragraph
      text:
        ru: «Господи, Иисусе Христе, помилуй мя грешного, спаси мя, падшего».
        cn: 主耶稣基督，怜悯我这罪人，拯救我这堕落的。
    - type: paragraph
      text:
        ru: 'Великая благочестия тайна: Бог явился во плоти, оправдал Себя в Духе, показал Себя Ангелам, проповедан в народах, принят верою в мире, вознесся во славе. Все мы – наследники Адама, павшего люциферическим падением. Созданному по образу Божию – идея обожения свойственна, но вопрос стоит о средствах достижения сей цели, сего задания. Если мы тварь, а не Перво- и Само-Бытие, то безумно полагать, что мы сможем стать «равными Богу», обходя Его.'
        cn: 敬虔的伟大奥秘是：上帝在肉身显现，在圣灵中被称义，被天使看见，被传于列邦，在世上蒙信接纳，在荣耀中被接升天。(提摩太前书 3:16) 我们所有人都是亚当的继承者，堕入了路西弗式的堕落。按照上帝的形象被造的——神化（theosis）的观念是其固有的，但问题在于达成此目标、此任务的手段。如果我们是受造物，而非本初与自存之存在，那么妄想我们能够变得「与上帝平等」而绕过祂，是极其荒谬的。
    - type: paragraph
      text:
        ru: 'Базой нашей жизни – является «явление Бога во плоти». Если неотъемлемо от нас чаяние обожения, то путь к нему чрез усвоение жизни Бога, показавшего нам Себя в нашей форме существования; да, мы должны впитать в себя Его слово, Его Дух; уподобиться Ему во всех наших проявлениях. И чем полнее подобие наше Ему в этом мире, тем полнее и совершеннее наше обожение. Опять апостол Павел говорит: Соединяющийся (чрез молитву и причащение) с Господом есть един дух с Господом; и так мы молимся:'
        cn: 我们生命的基础，是「上帝道成肉身」。如果神化的渴望对我们是不可或缺的，那么达到神化的道路是借着领受上帝的生命，这位上帝以我们的存在形式向我们显现了祂自己；是的，我们必须吸纳祂的圣言，祂的圣灵；在我们所有的表现中与祂相似。我们在这个世界上与祂越是完全相似，我们的神化就越是完全和完善。使徒保罗又说：「与上主联合的（人）（借着祷告和领圣体），便与上主成为一灵」；我们因此这样祷告：
    - type: paragraph
      text:
        ru: «Господи Иисусе Христе, Единородный Сыне Отчий, Ты Един упование наше, с Тобою и чрез Тебя приведи нас ко Отцу... помилуй мя, грешного».
        cn: '主耶稣基督，

          父的独生子，

          祢是我们唯一的盼望，

          靠着祢，并藉着祢，

          引领我们归向父……

          怜悯我这罪人。'
    - type: paragraph
      text:
        ru: 'Вечная жизнь в недрах Святой Троицы – смысл евангельского зова. Но сие Царство... силою берется, и употребляющие усилие восхищают его. Необходимо самопринуждение, потому что тесны врата и узок путь, ведущие в жизнь, и немногие находят их. И когда мы, христиане, не соглашаемся идти вместе с теми, что «не находят», потому что не хотят, тогда создаются конфликты: мы становимся неугодными сынами мира сего: такова доля возлюбивших Христа. Когда Господь с нами, тогда все страдания Земли кажутся не страшными, потому что Ним мы перешли от смерти в жизнь. Но неизбежны для нас часы и даже периоды богооставленности: Боже Мой, Боже Мой! для чего Ты оставил Меня? И если при этом мы терпим отвержение со стороны людей, то отчаяние может принять весьма глубокую форму, и мы призываем Его, Того, Кто Сам искушен был, и потому может и искушаемым помочь.'
        cn: 在圣三一怀抱中的永生——这就是福音呼召的意义。然而这国度……是被勉强夺取的，努力的人就夺取了它。必须自我勉强，因为引向生命的门是窄的，路是狭的，找到它们的人很少。当我们基督徒不愿与那些「不愿寻找」的人同行时，就会产生冲突：我们成了这世界不喜悦的儿子：这就是爱基督之人的份。当上主与我们同在时，地上的一切苦难都显得不那么可怕了，因为借着祂，我们已经出死入生。然而，神弃的时刻甚至时期对我们来说是不可避免的：我的上帝，我的上帝！祢为何离弃我？若在此期间我们又遭受人的弃绝，那么绝望就会变得极其深重，我们就呼求祂，那位自己也曾受过试探的，因此也能帮助受试探之人。
    - type: paragraph
      text:
        ru: «Господи Иисусе, спаси мене, утопающаго, яко спасл еси Петра».
        cn: 主耶稣，拯救我这沉溺之人，如同祢拯救了彼得。
    - type: paragraph
      text:
        ru: 'В подвиге молитвы каждый идет до доступной ему меры. Нелегко найти самого себя: пределы своих сил. Водимые Духом Святым – никогда не перестают осуждать себя, как недостойных Бога. В минуты же тяжкого отчаяния они позволяют себе на время отойти от края бездны, где стоят духом, чтобы дать передышку психике и телу, и затем снова идут стоять над пропастью. Но и отдыхает ли он или в периоды покоя – в глубинах сердца всегда остается некая рана, которая не допускает подвижника предаться гордой о себе мысли. Аскетическое смирение становится все более укорененным в душе и как бы уже натурой его. Скорби и болезни – характерны нашему земному шествию. Без этого никто из сынов Адама не устоит в смирении. Претерпевшие же удостоятся дара «Христова смирения» (Мф. 11, 29), о котором старец Силуан говорит, что «оно неописуемо», ибо подлежит иному, высшему плану бытия. Стяжание сего дара возможно чрез постоянную память Христа и молитву к Нему: «Господи, Иисусе Христе, Великий и Святый Боже, Ты Сам научи мя смирению Твоему... молю Тя, помилуй мя грешного».'
        cn: 在祈祷的功修中，每个人都达到其力所能及的程度。找到自己并不容易：自己的力量的限度。被圣灵引导的人——从不停止自责，认为自己不配于上帝。然而，在极度绝望的时刻，他们允许自己暂时远离他们以灵站立的深渊边缘，以期让精神和身体得到喘息，然后再次回到深渊之上站立。然而，无论是他在休息，还是在平静的时期——在心灵深处总会留存某种创伤，这不让苦修者沉溺于骄傲自满的念头。苦修式的谦卑在灵魂中变得越来越根深蒂固，仿佛已成为其本性。苦难与疾病——是我们尘世旅途的特点。没有这一点，亚当的任何子孙都无法持守谦卑。然而，忍受苦难的人将被赋予「基督的谦卑」的恩赐（马太福音 11:29），关于这一点，圣西卢安长老说，「它是无法言喻的」，因为它属于另一个更高层次的存有平面。获得此恩赐是可能的，借由对基督的持续忆念和向祂的祷告：「主啊，耶稣基督，伟大而圣洁的上帝，祢亲自教导我祢的谦卑……我恳求祢，怜悯我这罪人。」
    - type: paragraph
      text:
        ru: 'Итак, только огнем покаяния переплавится наша природа: слезной молитвой убиваются в нас корни страстей: призыванием Имени Иисуса очищается, возрождается и освящается наше естество:«Вы уже очищены чрез слово, которое Я проповедал вам. Пребудьте во Мне...»(Ин. 15:3, 4;Ин. 17, 17). И каким образом пребыть? Вам дано Мое Имя, и во Имя Мое Отец даст вам все, чего ни попросите:«... чего ни попросите от Отца во Имя Мое, Он даст вам»(Ин.15, 16).'
        cn: '于是，唯有借着悔改的火焰，我们的本性才能得以炼净：借着含泪的祷告，我们里面诸情欲的根方能被根除：借着呼求耶稣圣名，我们的本性得以洁净、重生和成圣：


          「你们因我讲给你们的道，已经洁净了。你们要常在我里面……」(约翰福音 15:3，4，约翰福音 17:17)


          那么，要如何常在呢？我的圣名已赐予你们，并且奉我的圣名，父必赐给你们一切你们所求的：


          「……凡你们奉我的名向父所求的，祂必赐给你们。」(约翰福音 15:16)'
    - type: paragraph
      text:
        ru: «Господи Иисусе Христе, Единый, воистину безгрешный, помилуй мя, грешного».
        cn: 主耶稣基督，祢是唯一的、确实无罪的，求祢怜悯我这罪人。
    - type: paragraph
      text:
        ru: Отцы наши наставляют нас молиться Именем Иисуса, не часто меняя формулу. Но, с другой стороны, время от времени это необходимо для обновления внимания, для усиления даже молитвы, когда ум переходит в богословские созерцания или расширяется сердце, чтобы обнять весь мир. Так Именем Христа Иисуса возможно покрывать всякое внутреннее и внешнее событие; таким образом сия дивная молитва становится всеобъемлющей, универсальной, космической.
        cn: 我们的教父们教导我们借耶稣之名祷告，不要频繁地改变祷文形式。然而，另一方面，偶尔这样做是必要的，以更新注意力，乃至加强祷告，当心智进入神学默观之时，或心灵拓宽，以拥抱整个世界。如此，借基督耶稣之名，能够覆盖每一个内在和外在的事件；如此一来，这奇妙的祷告便成为包罗万象的、普世的、宇宙性的。
