title:
  ru: Письма
  cn: 信件
authors:
- ru: Преподобный Паисий Святогорец
  cn: 阿陀斯人圣帕伊西乌斯
document:
- type: heading4
  text:
    ru: Введение
    cn: 导论
  children:
  - type: paragraph
    text:
      ru: Предисловие к русскому изданию
      cn: 俄文版序言
  - type: paragraph
    text:
      ru: От греческих издателей
      cn: 来自希腊出版者
  - type: paragraph
    text:
      ru: Предисловие к русскому изданию
      cn: 俄文版序言
  - type: paragraph
    text:
      ru: 'Блаженной памяти старец Паисий пользуется большой известностью и почитанием во всем православном мире. На русском языке выходили его книги: «ПреподобныйАрсений Каппадокийский», «Отцы-святогорцы и святогорские историии книги, посвященные ему: «Когда чужая боль становится своей» и «Архондарик под открытым небом» священникаДионисия Тациса, а также другие публикации.'
      cn: 蒙福的、安息中的长老派西奥斯（Паисий）在整个东正教世界享有盛誉和敬重。他的以下书籍已以俄语出版：《卡帕多基亚的圣阿塞尼奥斯》（Преподобный Арсений Каппадокийский）、《圣山教父与圣山故事》（Отцы-святогорцы и святогорские истории），以及致力于他的书籍：神父迪奥尼西奥斯·塔齐斯（Дионисий Тацис）所著的《当他人的痛苦成为自己的痛苦》（Когда чужая боль становится своей）和《露天迎宾室》（Архондарик под открытым небом），以及其他出版物。
  - type: paragraph
    text:
      ru: Настоящая книга представляет собой собрание писем, адресованных старцем сестрам монастыря святого апостола и евангелиста Иоанна Богослова в Суроти (Фессалоники), основателем которого он был и насельниц которого духовно окормлял до самой своей кончины. Главное внимание в этих письмах уделено монашеской жизни, и ступившие на путь иночества или готовящиеся к этому найдут для себя в них бесценное сокровище духовного опыта и мудрые наставления, помогающие в деле спасения души. Благочестивые миряне также могут получить от чтения писем великую пользу, поскольку, по словам старца, евангельский идеал и заповеди Христовы едины для всех нас.
      cn: 本书是这位长老写给他所创立的苏罗提（塞萨洛尼基）圣使徒和圣史约翰神学家修道院的修女们的信件合集。他直到临终都一直担任该修道院的精神导师。这些信件主要关注修道生活，踏上修道之路或正为此做准备的人们将在其中找到无价的精神经验宝藏和智慧的教导，这些教导有助于灵魂的得救。虔诚的平信徒也可以从阅读这些信件中获得巨大的益处，因为，用这位长老的话来说，福音的理想和基督的诫命对我们所有人都是一致的。
  - type: paragraph
    text:
      ru: Поучения старца проникнуты подлинно святоотеческим духом и передают важнейшие духовные истины, ибо учение святых отцов он глубоко воспринял и воплощал в своей собственной жизни. Написаны они простым языком, с остроумием и подчас с юмором. Старец часто использует сравнения, метафоры и игру слов, выражая свои мысли своеобразно и ярко.
      cn: 这位长老的教导充满了真正的教父精神，并传达了最重要的属灵真理，因为他深刻领会了圣教父们的教义，并将其体现在自己的生活中。这些教导以朴实的语言写成，其中不乏机智，有时还带有幽默。这位长老经常使用比较、比喻和双关语来表达他的思想，独具特色且生动鲜明。
  - type: paragraph
    text:
      ru: Надеемся, что, по молитвам старца Паисия, его книга в переводе на русский язык поможет нашим читателям в их духовной жизни и спасении души.
      cn: 我们希望，借由派西奥斯长老的代祷，他的书在翻译成俄语后，能帮助我们的读者在他们的属灵生命和灵魂得救方面受益。
  - type: paragraph
    text:
      ru: Издательство просит молитв о упокоении души рабы Божией Дэспины Сурмели-Киустелиду, оказавшей большую помощь в издании этой книги.
      cn: 出版社请求为上帝的仆人戴斯皮娜·苏尔梅利-基乌斯特利杜的灵魂安息祈祷，她为本书的出版提供了巨大帮助。
  - type: paragraph
    text:
      ru: От греческих издателей
      cn: 来自希腊出版者
  - type: paragraph
    text:
      ru: Эти письма были написаны блаженным старцем Паисием († 1994) и отправлены им в исихастирий святого апостола и евангелиста Иоанна Богослова.
      cn: 这些书信是由蒙福的长老派西奥斯（† 1994）所写，并由他寄送给圣使徒及福音传扬者约翰神学家的静修所（hesychasterion）。
  - type: paragraph
    text:
      ru: Они были подготовлены к изданию за несколько месяцев до смерти старца, однако он просил издать их после его кончины с приложением его завещания, удостоверяющего и подтверждающего подлинность и сохранность текста писем.
      cn: 这些书信在长老离世前几个月就已准备好出版，但他要求在自己去世后将其出版，并附上他的遗嘱，以证明和确认这些书信文本的真实性和完整性。
  - type: paragraph
    text:
      ru: Исихастирий[1]святого апостола и евангелиста Иоанна Богослова.
      cn: 圣使徒和圣史约翰·神学家[1]的静修院。
  - type: paragraph
    text:
      ru: Успение Божией Матери, 1994 г.
      cn: 圣母安息，1994 年。
- type: heading1
  text:
    ru: Письма
    cn: 书信
  children: []
- type: heading1
  text:
    ru: Письмо в виде завещанияВ исихастирий святого евангелиста Иоанна Богослова, Суроти
    cn: 书信——以遗嘱形式致苏罗提，圣福音传扬者约安尼斯神学家的静修院
  children:
  - type: paragraph
    text:
      ru: Сегодня, 2 февраля 1988, на Сретение Господне, я счел своевременным написать и послать это письмо в исихастирий святого евангелиста Иоанна в Суроти старице Филофее с сестрами как своего рода завещание, ибо не знаю, когда умру, и не хочу, чтобы после моей смерти возникли какие-то проблемы.
      cn: 今日，1988年2月2日，在主进圣殿日，我视时机成熟，提笔撰写并寄送此信至苏罗提（Souroti）的圣福音传道者约翰静修院（hesychasterion），给斐洛塞娅（Philothei）修女长及其修女们，作为一份遗嘱。因为我不知何时会离世，不希望在我死后出现任何问题。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Исихастирию святого евангелиста Иоанна в Суроти, старице Филофее с сестрами, принадлежат святые мощи преподобного Арсения Каппадокийского и право повторного издания двух написанных мною книг: «Отец Арсений Каппадокийский»[1]и «Старец Хаджи-Георгий Афонский».'
      cn: 圣福音传道者约翰在苏罗提（Souroti）的伊西哈斯蒂里翁（Hesychasterion），属于年长修女菲洛忒伊（Philothei）及她的姐妹们，拥有可敬者阿塞尼奥斯（Arsenios）卡帕多基亚人的圣髑以及再次出版我所撰写的两本书的权利：《阿塞尼奥斯长老，卡帕多基亚人》[1]和《哈吉-格奥尔基长老，阿索斯山人》。
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: Тот же исихастирий святого евангелиста Иоанна в Суроти имеет право на издание всех моих неизданных тетрадей и писем, посланных мною в свое время, а также записей, сделанных сестрами во время наших общих бесед. Таким образом, на все, написанное мною с 1967 до нынешнего 1988 года и до самой моей смерти, имеют права, о которых я сказал выше, только старица Филофея с сестрами, живущие в исихастирии святого евангелиста Иоанна в Суроти. Другие сестры, уехавшие в Александруполис[2]с отцом Поликарпом, не имеют на это права, потому что не послушались моего совета и, очевидно, не получили пользы от всего того, чему я учил их многие годы. Поэтому теперь я только молюсь о том, чтобы им помог Христос. Аминь.
      cn: 圣史徒约翰（Saint John the Evangelist）在苏罗提（Souroti）的这座静修院（hesychastirion）拥有出版我所有未曾付梓的笔记本、我彼时发出的信函、以及姐妹们在我们的共同交谈中所做记录的权利。因此，对于我从1967年至今（1988年）直至我辞世所写的一切，如上文所述的权利仅归于菲洛塞亚（Philothea）修女长和与她一同住在苏罗提圣史徒约翰静修院的姐妹们。其他前往亚历山德鲁波利斯[2]并与波利卡普神父（Father Polycarp）同住的姐妹们，不享有此项权利，因为她们没有听从我的建议（counsel），并且显然没有从我多年教导的一切中获益。因此，我现在只为基督能帮助她们而祈祷。阿门。
  - type: paragraph
    text:
      ru: Итак, сегодня, в день Сретения Господня, в присутствии отцов, подтверждающих это мое письмо своими подписями, и невидимо пребывающего с нами Христа, я пишу и посылаю его и прошу, чтобы все упоминаемое мною в нем было принято со вниманием и соблюдено. Молюсь, чтобы вы сподобились доброго свидетельства в день Суда Божия и вечного Царства Христова. Аминь.
      cn: 那么，今天，在主进圣殿日，在以他们的签名确认我这封信件的教父们，以及无形中与我们同在的基督面前，我写下并发送此信，并请求信中我所提及的一切都能被审慎接受并遵行。我祈祷你们能在上帝审判之日和基督的永恒王国里得蒙美好的见证。阿门。
  - type: paragraph
    text:
      ru: С великой любовью о Христе монах Паисий. Святая Гора. «Панагуда», келлия монастыря Кутлумуш[3].
      cn: 怀着对基督深沉的爱，修士帕伊西奥斯。圣山。「帕纳古达」，库特卢穆修道院小室[3]。
  - type: paragraph
    text:
      ru: 'Свидетели отцы: 1. иеромонах Паисий; 2. иеромонах Арсений; 3. монах Исаия.'
      cn: 见证的教父：1. 圣职修士帕伊西奥斯；2. 圣职修士阿尔谢尼；3. 修士以赛亚。
- type: heading1
  text:
    ru: Письмо второеМолодым людям, хотящим стать монахами
    cn: 第二封信 致希望成为修士的年轻人
  children:
  - type: paragraph
    text:
      ru: Калива[4]Честнаго Креста, 19.3.1973 г.
      cn: 卡利瓦[4]尊贵十字架，1973年3月19日。
  - type: paragraph
    text:
      ru: Сестра старица Филофея, благословите!
      cn: 费洛菲娅姐妹老修女，请赐福！
  - type: paragraph
    text:
      ru: Я написал это письмо, сшитое в тетрадь[5], чтобы послать в Афины молодым людям, которые хотят стать монахами и которые много раз просили меня о помощи, потому что, помимо трудностей от плачевного мирского окружения и мирского образа мыслей их родителей, еще большее зло им принесли своими протестантскими идеями некие духовники-иеромонахи, повторяющие всякие нелепости некоторых модернистских монастырей и монахов нашего времени. Однако в конце концов я это письмо не отправил, и одной из самых серьезных причин этого была боязнь сделать Капсалу[6]местом духовного туризма.
      cn: 我写下这封装订成册的信[5]，打算寄给雅典的那些希望成为修士的年轻人。他们多次向我寻求帮助，因为除了令其悲伤的世俗环境和父母的世俗思想带来的困难外，一些神父-修士（hieromonks）因其新教思想给他们带来了更大的伤害，他们重复着我们这个时代某些现代化修道院和修士的各种荒谬说法。然而，最终我没有寄出这封信，其中一个最主要的原因是担心卡普萨拉[6]会变成一个属灵旅游的地方。
  - type: paragraph
    text:
      ru: Я решил сжечь его, но пожалел, потому что трудился три дня, чтобы написать его, а также поскольку видел в нем нечто доброе, что может помочь сестрам в их ежедневном подвиге.
      cn: 我决定烧掉它，但又于心不忍，因为我费了三天时间才写成它，而且也因为我看到其中有某些美好的东西，可以帮助姊妹们完成她们日常的属灵操练（podvig）。
  - type: paragraph
    text:
      ru: Надеюсь, что вы меня правильно поймете и не осудите за головомойку, которую я устроил, потому что нужно было показать, что такое православное монашество, чтобы эти модернисты увидели свое бедственное положение, устыдились и в будущем перестали говорить протестантские глупости.
      cn: 我希望您能正确理解我，不要因为我所做的一番斥责而谴责我，因为有必要展示什么是东正教的修道主义，以便让这些现代主义者看到他们自己的悲惨境地，感到羞愧，并在将来停止说新教的蠢话。
  - type: paragraph
    text:
      ru: Радуйтесь[7].
      cn: 欢喜吧[7]。
  - type: paragraph
    text:
      ru: Ваш брат монах Паисий. Первая седмица святой четыредесятницы 1973 года.
      cn: 你的弟兄，修士帕伊西奥斯。1973年圣大斋期第一周。
  - type: paragraph
    text:
      ru: Слава Отцу и Сыну и Святому Духу
      cn: 荣耀归于父、及子、及圣灵
  - type: paragraph
    text:
      ru: 'Перед тем как моя неумелая рука начнет писать, хорошо будет попросить прощения у всех благочестивых читателей за то, что я, безграмотный, дерзаю писать, тогда как и греческого языка не знаю достаточно хорошо. Возможно, то, что я делаю, показывает, что со мной что-то не в порядке, но я, к сожалению, не знаю причины этого. Мне кажется, что я пишу из-за сочувствия к новоначальным монахам, однако откуда мне знать, не был ли причиной этого мой огромный скрытый эгоизм, которого сам я не смог различить? Поэтому прошу вас: если это так, молитесь, чтобы Бог помиловал меня.'
      cn: 在我的拙劣之手开始写作之前，最好先向所有虔敬的读者请求原谅，因为我，一个不识字的人，竟敢动笔写作，而我甚至对希腊语的了解也不够好。或许我所做的，显示出我自身有些不对劲，但我很遗憾不知道其原因。在我看来，我是出于对初入道（的）修士的同情而写作，然而，我又怎能知道，这是否是我巨大的、隐藏的、连我自己也未能察觉的自我中心主义（egoism）所致呢？因此，如果真是如此，我请求你们：请为我祈祷，愿上帝怜悯我。
  - type: paragraph
    text:
      ru: То, что я испытываю сочувствие к новоначальным монахам и тревогу за них, – правда, потому что, будучи новоначальным, я много пострадал, прежде чем обрел то, чего желал. Естественно, никто не был виноват в том, что я страдал, кроме множества моих грехов (я страдал, чтобы расплатиться хотя бы за некоторые) и равным образом моей неотесанности, бывшем второй причиной того, что я страдал, ибо я вверял себя первому встречному. Благодарю Бога за все, потому что все мне было очень полезно. Кроме ржавчины ветхого моего человека, которую сбивали эти удары, и опыта, который они мне оставили, они умягчили мое жестокое сердце, и я с состраданием молюсь за новоначальных, чтобы они сразу же нашли подходящие условия и стали благоискусными согласно своему призванию.
      cn: 我对初入教的（*或作「初发心」*）修士所怀有的同情和对他们的忧虑是真实的，因为作为初发心者，我在找到我所渴望的之前遭受了许多痛苦。自然，我受苦不是任何人的错，除了我众多的罪（我受苦是为了偿还哪怕只是一部分）以及同样我的粗糙不文（*或作「粗野」*），这是我受苦的第二个原因，因为我将自己托付给了遇到的第一个人。我为一切感谢上帝，因为一切对我都是非常有益的。除了这些打击所敲落的我的旧人的锈迹，以及它们留给我的经验之外，它们还软化了我刚硬的心，我怀着怜悯为初发心者祷告，愿他们能立即找到合适的条件，并按照他们的呼召成为技艺精湛的（*或作「老练」*）。
  - type: paragraph
    text:
      ru: Итак, одна из главнейших причин, по которой страдают новоначальные, состоит в том, что они не находят подходящих старцев, которые могли бы им помочь, так как большинство из нас, к сожалению, старики, а не старцы. Естественно, что и суждения у новоначальных детские, потому они и ошибаются. Например, новоначальный сразу же приходит в умиление, когда видит немощного монаха, потому что думает, что он большой подвижник, или, если у него длинная и седая борода, он кажется ему очень почтенным, и новоначальный на основании этих критериев сразу же вверяет ему себя и, хотя начало его пути было хорошим, плывет не в ту сторону. Спасшись от бурного моря житейского и взяв курс к пристани, но не умея правильно рассуждать, он часто садится на дряхлый корабль и терпит кораблекрушение или вверяет себя неопытному капитану, который топит его в пучине морской.
      cn: 因此，初学者受苦的主要原因之一在于他们找不到合适的长老来帮助他们，因为我们中的大多数人，很遗憾，是老人而不是长老。很自然，初学者的判断是幼稚的，因此他们会犯错误。例如，初学者一看到一个软弱的修士，就会立刻心生感动，因为他认为这是一个伟大的苦行者；或者，如果他留着又长又白的胡须，他会觉得他非常可敬。初学者会立刻根据这些标准将自己托付给他，尽管他道路的开端是好的，但他却驶向了错误的方向。他从人生风暴的大海中得救，并朝着港口的方向前进，但由于不善于正确地论断，他经常登上了一艘破旧的船，遭遇了海难，或者将自己托付给了一位没有经验的船长，这位船长将他淹没在海底深渊之中。
  - type: paragraph
    text:
      ru: Простите меня за то, что говорю резко, и за всякое еще более суровое слово, которое встретите далее, так же как и за всю мою грубость, которая, вероятно, у меня есть, ибо человеку нелегко увидеть ее самому, но обычно другие со стороны видят ее более ясно. Также я хотел бы, чтобы вы помолились, дабы Бог помиловал меня и я смог бы жить хотя бы отчасти так, как пишу, потому что я только составил себе понятие обо всем этом. И да укрепит меня Бог положить начало, потому что я, к сожалению, до сих пор нахожусь в чине стариков, а не старцев. Но я не теряю надежды, потому что у меня есть много знакомых, которые за меня молятся, и Благий Бог поможет мне по их молитвам.
      cn: 请原谅我的言辞唐突，也请原谅您在下文中可能遇到的任何更严厉的词句，以及我可能有的所有粗鲁之处，因为人很难看清自己的粗鲁，但通常旁人能看得更清楚。我还希望您能代我祈祷，好让上帝怜悯我，使我能至少部分地按照我所写的那样去生活，因为所有这些，我不过是给自己描绘了一个概念而已。愿上帝加给我力量去开始实行，因为可悲的是，我至今仍处于「老人」的等级，而非「长老」（старцев）。但我并未丧失希望，因为我有许多认识的人为我祈祷，仁慈的上帝会因着他们的祈祷帮助我。
  - type: heading2
    text:
      ru: Миссия монаха
      cn: 隐修者的使命
    children:
    - type: paragraph
      text:
        ru: Прежде чем я предложу новоначальным монахам свой маленький опыт, хорошо было бы дать им несколько советов, чтобы помочь им, пока они по той или иной причине еще находятся в миру, потому что эта небольшая помощь, возможно, укрепит их на всем протяжении их монашеского пути.
        cn: 在向初入教门（初级）的修士们（monks）提供我的微薄经验之前，最好先给他们一些建议，以帮助他们，因为他们可能因各种原因仍处于世俗之中，因为这小小的帮助可能会在他们整个修道之路上坚固他们。
    - type: paragraph
      text:
        ru: Пока новоначальный еще находится в миру, главнейшим вопросом для него является вопрос о том, как найти монахолюбивого духовника, так как большинство духовников нашего времени являются монахоборцами и всячески выступают против монашества, ссылаясь при этом чаще всего на Великих Василиев с их василиадами[8], общественной деятельностью и т.д.
        cn: 当一个初学者仍身处俗世之时，对他而言最主要的问题是如何找到一位爱慕修士（монахолюбивого）的属灵导师（духовника），因为我们这个时代的大多数属灵导师都是反修士（монахоборцами）的，他们千方百计地反对修道生活，而最常引用的依据是伟大的巴西琉斯们（Великих Василиев）及其巴西琉斯主义（василиадами）[8]、社会活动等等。
    - type: paragraph
      text:
        ru: 'Не хочу говорить о жизниВасилия Великогодо того, как он начал основывать свои василиады, но просто выскажу свой помысел, что сделал бы Василий Великий, если бы жил в наше время. Я думаю, что он опять нашел бы себе пещеру и взял в руки четки, видя, как пламя любви (от его василиад и от других святых отцов) распространилось повсюду – не только среди верующих, но и среди неверующих, которые вместе участвуют в работе Департамента социального обеспечения[9], заботящегося даже о членах Духовных благотворительных собраний (по одной лишь справке о бедности). Коротко говоря, Департамент социального обеспечения ежедневно взывает: «Святые отцы нашего времени, оставьте дела человеколюбия нам, мирянам, потому что мы не можем делать ничего другого, а вы занимайтесь чем-то более духовным».'
        cn: 我不想谈论大巴西略在他开始创建他的瓦西利亚德（巴西略会院）之前的生活，我只是要表达我的想法：如果大巴西略生活在我们这个时代，他会做什么。我想，他会再次找到一座洞穴，拿起念珠，因为他看到爱的火焰（来自他的瓦西利亚德和其他圣教父的）已经遍布各处——不仅在信徒中，而且在非信徒中，他们一起参与到社会福利部门[9]的工作中，甚至照顾「属灵慈善集会」的成员（只需一张贫困证明）。简言之，社会福利部门每天都在呼喊：「我们这个时代的圣教父们，将慈善工作留给我们平信徒吧，因为我们做不了别的事情，而你们去做一些更属灵的事情吧。」
    - type: paragraph
      text:
        ru: 'Однако, к сожалению, некоторые клирики не только не делают этого, потому что этого не понимают, но и препятствуют тем, которые это понимают и хотят всецело отдать себя Христу, и ощущают настойчивый призыв к уходу из мира. То есть мало того, что новоначальный монах многое слышит от мирян, он еще кучу всего слышит и от клириков, которые по своему безрассудству даже от монахов требуют оставить пустыню и прийти в мир, чтобы заниматься общественной деятельностью ради человеколюбия. Хорошо было бы назвать некоторые из венцов, которые они им сплетают: «лентяи», «индивидуалисты», «трусы» и так далее, – поскольку считают самих себя героями, подвизающимися в грешном обществе, а монахов трусами, которые уходят, чтобы только спасти свою душу.'
        cn: 然而，遗憾的是，一些教士不仅没有这样做，因为他们不理解这一点，反而阻碍了那些理解并希望将自己全然献给基督，并感受到一种强烈的、要求他们离开世界的呼召的人。也就是说，初入修道的修士不仅从平信徒那里听到了许多，他还从教士那里听到了许多，这些教士由于他们的轻率，甚至要求修士放弃旷野，来到世间，从事公共活动，以实践仁爱。最好能列出他们为修士编织的一些「花冠」：「懒汉」、「个人主义者」、「懦夫」等等，——因为他们认为自己是那些在罪恶社会中争战的英雄，而修士则是只为救赎自己的灵魂而离去的懦夫。
    - type: paragraph
      text:
        ru: 'Не понимаю, как они не могут уразуметь великой миссии монаха?! Монах уходит далеко от мира не потому, что ненавидит мир, но потому, что любит мир и этим способом может больше помочь ему своей молитвой в делах, которые не могут совершиться благодаря человеческим усилиям, но только при божественном вмешательстве. Так Бог спасает мир. Монах никогда не говорит: «Я спасу мир», но молится о спасении всего мира так же, как и о своем собственном. Когда Благий Бог услышит его молитву и поможет миру, он опять-таки не говорит: «Я спас мир», но – «Бог».'
        cn: 我不理解他们如何不能领悟修士的伟大使命？！修士远离世界，不是因为他憎恨世界，而是因为他爱世界，并且通过这种方式，他能以他的祷告，在那些无法藉着人力、而只能藉着神圣干预才能成就的事情上，更多地帮助世界。上帝就是这样拯救世界的。修士绝不会说：「我将拯救世界，」但他为整个世界的救赎祷告，就像他为自己的救赎祷告一样。当至善的上帝垂听他的祷告并帮助世界时，他仍然不会说：「我拯救了世界，」而是说：「上帝。」
    - type: paragraph
      text:
        ru: Итак, если говорить коротко, монахи – это радисты Матери Церкви, и, следовательно, если они уходят далеко от мира, то и это делают из любви, ибо уходят от «радиопомех» мира, чтобы иметь лучшую связь и больше и лучше помогать миру.
        cn: 所以，简而言之，修士们是母教会的无线电操作员（radiyisty），因此，如果他们远离世界，他们这样做也是出于爱，因为他们是远离世界的「无线电干扰」（radiopomekh），以便获得更好的联系，并更多、更好地帮助世界。
    - type: paragraph
      text:
        ru: 'Безрассудное требование, которое, как я сказал, предъявляют некоторые клирики, то есть чтобы монахи вышли в мир, высказывают и некоторые неразумные солдаты, когда их отряд подвергается опасности, то есть чтобы радист оставил свою рацию и вступил в перестрелку, как будто положение будет спасено, если к двумстам другим винтовкам присоединится еще одна. Когда радист кричит во все горло, чтобы выйти на связь: «Алло, алло, Душа!» и так далее, то другие думают, что он кричит впустую. Однако разумные радисты не слушают, когда их ругают, но изо всех сил стараются выйти на связь, а затем просят немедленной помощи у генерального штаба (Души), и тогда прибывают большие силы авиации, бронетанковых войск, флота и таким образом бывает спасено положение, а не перестрелкой этих солдат. Точно так же и через монахов действуют божественные силы посредством их молитвы, а не их собственные ничтожные силы. Мы же в наше время, когда зло чрезвычайно усилилось, имеем большую нужду во вмешательстве Божием.'
        cn: 我所说的那种有些教士提出的无理要求，即要求修士回到世上，也为一些不理智的士兵在他们的队伍遭遇危险时提出。他们要求无线电员放下他的无线电台，参与到交火中，仿佛再多一支步枪加入到两百支步枪中，就能挽救局势。当无线电员大声呼喊以建立联系时：「喂，喂，灵魂！」，其他人则认为他是在徒劳地喊叫。然而，理智的无线电员不会听从那些斥责他们的人，而是竭尽全力地建立联系，然后请求总参谋部（灵魂）立即给予援助，这时，强大的空军、装甲部队、海军力量就会到达，局势也因此得以挽救，而不是靠那些士兵的交火。同样地，神圣的力量也通过修士的祈祷发挥作用，而不是靠他们自身微不足道的力量。在我们这个时代，邪恶已极度猖獗，我们亟需上帝的干预。
    - type: paragraph
      text:
        ru: Другое дело, если монах в течение какого-то времени находится в миру, когда этого требует необходимость, – тогда он помогает своей личной духовной силой, которую ему даровал Бог. Но это дело он считает побочным, а главное для него всегда молитва. Естественно, он так же поступает и находясь в своей келлии, где пользуется рукоделием как побочным занятием, и, если увидит, что кто-нибудь возле него страдает, помогает ему тем, что имеет. Также если к нему придет кто-нибудь со своими проблемами, он все оставляет и пытается помочь ему и своими человеческими силами, чем может.
        cn: 另一回事是，如果一位修士由于需要而在世俗中待了一段时间——那时他用上帝赐予他的个人灵性力量去帮助别人。但他将这件事视为次要的，而对他而言，主要的永远是祷告。自然地，他在自己的小室中也是这样行事，将手工劳作作为次要的事务，而如果他看到身边有人受苦，他就用自己所有的一切去帮助他。同样地，如果有人带着他们的问题来找他，他会放下一切，尽他所能地用他的人类力量去帮助他。
    - type: paragraph
      text:
        ru: То есть целью монаха не является усердное занятие рукоделием или собирание множества денег, чтобы помогать бедным, потому что для него это духовное падение. Монах может помогать тоннами, а не килограммами (когда, например, случится засуха, он своими молитвами может наполнить все амбары мира). Так Бог«восставляет от землинищагои от гноищавозвышаетубогаго» (1Цар. 2:8). Не будем забывать, что совершил пророк Илия[10].
        cn: 换言之，修士的目的不是热切地从事手工劳作，或聚集大量金钱以帮助穷人，因为这对修士而言是属灵的堕落。修士可以以「吨」而非「公斤」来帮助人（例如，当发生干旱时，他可以通过自己的祈祷来填满世上所有的谷仓）。因此，上帝「使贫寒人从尘土中起来，从粪堆中提拔穷乏人」（撒母耳记上 2:8）。我们不要忘记先知厄里亚所行的[10]。
    - type: paragraph
      text:
        ru: Монахи не оставляют пустыню, чтобы пойти в мир и помочь там какому-нибудь бедняку или посетить какого-нибудь больного в больнице и принести ему апельсин или другое утешение (то, что обычно делают миряне, дело, которое от них взыщет Бог). Монахи молятся обо всех больных, чтобы они получили двойное здравие, и Благий Бог сжаливается над Своим созданием и помогает им выздороветь, чтобы они и сами помогали другим, трудясь как хорошие христиане.
        cn: 修士不会离开旷野，去往世间，以帮助那里的某个穷人，或探望医院里的某个病人，并给他带去一个橘子或其他的慰藉（这是平信徒通常所做的事，是上帝将向他们追索的事）。修士为所有的病人祈祷，愿他们获得双重的健康，而良善的上帝怜悯祂的受造物，并帮助他们康复，使他们自己也能帮助他人，像好的基督徒一样劳作。
    - type: paragraph
      text:
        ru: Монахи также не посещают заключенных, потому что сами являются добровольно заключенными по великому усердию, которое имеют к своему Благодетелю и Спасителю Христу; и Христос подает обильную любовь Своим усердным детям – монахам, и когда они находятся в «темнице» (обители), присутствие и любовь Христовы превращают ее в рай. Монахи молятся и просят Христа, чтобы всю ту райскую радость, которую они ощущают, Он подал всем нашим заключенным братьям, которые находятся в тюрьмах в миру. И Благий Бог умилостивляется ради любви Своих добрых детей и источает утешение в душах заключенных и часто даже освобождает их.
        cn: 修士们也不去探访囚犯，因为他们自己出于对他们的施恩者和救主基督所怀的极大的热忱，是自愿的囚徒；而基督将丰沛的爱赐予祂热忱的孩子们——修士们，当他们身处「牢狱」（隐修院）之中时，基督的临在与爱将其转变为天堂。修士们祈祷并恳求基督，将他们所感受到的全部那份天堂般的喜乐，赐予我们所有在世间监狱中的受囚禁的弟兄。而良善的上帝因着祂良善的孩子们的爱而被感动，将慰藉倾注于囚犯的灵魂之中，并常常甚至释放他们。
    - type: paragraph
      text:
        ru: 'Кроме этих заключенных, монахи помогают также другим – заключенным с большей строгостью и навечно, а не на десять или двадцать лет, которые имеют и большую нужду в помощи. Это наши усопшие осужденные братья, которых монахи посещают особым образом и приносят им много духовных прохладительных напитков. Благий Бог помогает усопшим и одновременно извещает об этом монахов посредством какой-то невыразимой радости, которую источает у них в душе после их болезненной молитвы о наших усопших братьях, как будто говоря: «Не скорбите, чада Мои, Я помог и усопшим».'
        cn: 除了这些被监禁者，修士们也帮助其他的——那些受到更严厉、终身监禁而非十年或二十年监禁的被监禁者，他们对帮助有着更大的需要。这些就是我们已故的被定罪的弟兄，修士们以一种特殊的方式探望他们，并为他们带来许多属灵的清凉饮品。良善的上帝帮助已故者，同时藉着某种难以言喻的喜乐将此事告知修士们，这喜乐在他们为我们已故弟兄痛苦的祈祷之后，从他们灵魂深处涌流出来，仿佛在说：「不要忧伤，我的孩子们，我已经帮助了已故者。」
    - type: paragraph
      text:
        ru: 'Может быть, кто-то скажет: «Разве нужно просить, чтобы Бог помог?» Безусловно, нужно просить; и Бог особенно умилостивляется, когда мы сострадаем своему ближнему и просим Его, чтобы Он помог, потому что тогда Бог вмешивается без насилия над свободой. Здесь также видно великое духовное благородство Бога, Который даже диаволу старается не давать повода для возражений. Поэтому Бог хочет, чтобы мы просили Его вмешательства, и хочет вмешаться немедленно, чтобы помочь Своему созданию. Естественно, если бы Бог захотел, то уже сейчас загнал бы диавола в ад, однако оставляет его нам – опять-таки для нашего блага, потому что ударами своей злобы, которые тот нам наносит, он стряхивает с нас всю пыль.'
        cn: 也许有人会说：「难道有必要祈求上帝帮助吗？」 当然有必要祈求；当我们怜悯我们的近人并祈求他（上帝）帮助时，上帝尤其会开恩，因为那时上帝的介入不会违背自由意志。在此，也可见上帝伟大的属灵高贵，他甚至努力不给魔鬼提出异议的借口。因此，上帝希望我们祈求他的介入，并且希望立即介入，以帮助他所创造的。当然，如果上帝愿意，他现在就可以把魔鬼赶入地狱，但他却把它（魔鬼）留给我们——这也是为了我们的益处，因为魔鬼以其恶毒对我们施加的打击，能够将我们身上所有的尘埃抖落干净。
    - type: paragraph
      text:
        ru: Всем тем, что я сказал и что скажу ниже, мне хотелось бы подчеркнуть великую миссию монаха, которая есть нечто более серьезное, чем человеческие дела человеколюбия. Ибо еще прежде, чем стать монахом, он уже совершил такое же дело человеколюбия и раздал все, как сказал Христос юноше (См.Мф. 19:21), а также самого себя отдал Христу (своему богатому Отцу). Таким образом теперь, уже будучи чадом Божиим (как нестяжательный монах), он имеет часть в достоянии Бога и все, чего хочет, просит у своего Милостивого Отца, и Отец его щедро подает ему Свои милости, если нет опасности, что они повредят Его бедным чадам.
        cn: 所有我已说和将要说的，我都想强调修士的伟大使命，它比属人的仁爱之事更为严肃。因为在他成为修士之前，他已经完成了同样的仁爱之事，并如基督对那少年人所说的（参阅马太福音 19:21），变卖了他的一切，也将他自己献给了基督（他富有的父亲）。因此，如今作为上帝的儿女（作为不占私产的修士），他拥有上帝产业的一部分，凡他所愿，都向他仁慈的父祈求，而他的父会慷慨地赐予他恩惠，除非存在会伤害到祂贫乏儿女的危险。
    - type: paragraph
      text:
        ru: Итак, много новоначальный слышит от некоторых клириков, которые пытаются отвратить его от этой великой миссии монашества, но также много и от мирян. Кроме того, о чем не принято говорить (не принято, конечно, среди серьезных людей), говорят, что монах – это мертвая вещь, потому что у него нет детей и т.д.
        cn: 因此，许多初入教门者从一些神职人员那里听到了许多话语，这些人试图使他偏离修道的这一伟大使命，但他也从许多平信徒那里听到了许多话语。此外，关于不宜提及的事情（当然，在严肃的人们中间不宜提及），他们说修士是一种死寂之物，因为他没有孩子等等。
    - type: paragraph
      text:
        ru: Не хочу спрашивать тех, кто так говорит, есть ли у них дети, потому что именно в этом состоит цель брака и только в таком случае имеет смысл их жизнь, в то время как у монаха другая миссия – девство, «иное житие». Но тех, у которых есть дети, я хотел бы спросить, помогли ли они им обеспечить себе рай или помогли им только в материальном? Так что же из этого следует? Монахи, заинтересованные в спасении душ человеческих, являются более любвеобильными отцами, чем отцы по плоти, и имеют больше детей, чем самый многодетный отец, потому что все создания Божии они считают своими детьми и братьями и с состраданием молятся, чтобы все люди достигли своего предназначения – близости к Богу.
        cn: 我不想问那些这样说的人他们是否有孩子，因为这正是婚姻的目的，也只有这样他们的生命才有意义，而修道士有不同的使命——守贞，「另一种生活」。但我希望问那些有孩子的人，他们是帮助孩子确保获得了天堂，还是只在物质上帮助了他们？那么，这说明了什么？那些关心人类灵魂得救的修道士，比血缘上的父亲更有爱心，并且比最多子女的父亲拥有更多的孩子，因为他们将上帝所有的受造物都视为自己的孩子和弟兄，并以同情心祈祷，愿所有人都能达成他们的最终目的——与上帝亲近。
    - type: paragraph
      text:
        ru: Так как некоторым нелегко понять духовное возрождение, которое монахи совершают в людях, упомяну, как они способствуют даже телесному деторождению. Хотя сами они девственники даже в отношении помыслов, однако, если имеют дерзновение к Богу, разрешают неплодие многих матерей, будучи живыми или усопшими. Следовательно, монахи рождают даже будучи умершими, если являются святыми. Естественно, монахи не помогают людям с амвона, проповедуя Евангелие, чтобы просветились большие и малые, потому что монахи живут по Евангелию. Так Евангелие проповедуется более убедительным способом – примером, чего жаждет мир, особенно сегодняшний, потому что в наше время в большей или меньшей степени все образованны и могут говорить о великих истинах, о которых прочитали и которые, тем не менее, не имеют никакой связи с большинством проповедников, постоянно отягощающих свою совесть делами, при виде которых остается лишь вздохнуть.
        cn: 由于有些人不易理解修士在人身上所施行的属灵重生（возрождение），我将提及他们如何促进甚至肉身的生育。尽管他们自身在心思意念上也是守贞者，但若他们对上帝有勇气（дерзновение），无论是活着还是已故，他们都能消除许多母亲的不孕。因此，如果修士是圣徒，他们甚至在死后也能生育。自然地，修士不是从讲道坛上向人们宣讲福音，以使或大或小的都得到启蒙，因为修士是按福音生活的。因此，福音是以一种更具说服力的方式——即榜样——来宣讲的，这也是世人，尤其是今日世界所渴望的，因为在我们这个时代，所有人或多或少都受过教育，都能谈论他们所读过的伟大真理，然而这些真理与大多数传道者却没有任何关联，这些传道者不断地以他们的行为加重自己的良心，而目睹这些行为，只会让人叹息。
    - type: paragraph
      text:
        ru: Коротко говоря, монахи не просто фонарики, которые светят на улицах городов, чтобы люди не спотыкались, а удаленные маяки на скалах, направляющие своими вспышками корабли мира, благодаря которым корабли находят путь из пучины морской и достигают своей цели.
        cn: 简言之，修道士不只是照亮城市街道防止人们绊倒的灯笼，而是岩石上遥远的灯塔，用他们的闪光指引世界的船只，船只借此从海洋深渊中找到出路，并达到他们的目标。
    - type: paragraph
      text:
        ru: Поэтому родители не должны препятствовать своим детям, когда Бог призывает их стать монахами (радистами Церкви), потому что эта миссия очень велика и выше того, что они сами приносят Богу своей собственной миссией. Миряне в определенные дни ходят вцерковьи обещают Богу зажечь свечу, маленькую или большую, а монах каждую ночь проводит в бдении в церкви и всего себя обещал Христу и горит от Его любви, Его славословит и Его благодарит за себя и за весь мир.
        cn: 因此，父母不应该阻止他们的孩子，当上帝召唤他们成为修士（教会的无线电操作员）时，因为这项使命非常伟大，并且高于他们以自己的使命献给上帝的一切。平信徒在特定的日子里去教会，向上帝承诺点燃一根蜡烛，或小或大，而修士则每晚在教会里守夜，他已将自己完全许诺给基督，因祂的爱而燃烧，赞美祂、感谢祂，既为他自己，也为整个世界。
    - type: paragraph
      text:
        ru: Я просто не могу понять действий некоторых клириков и мирян, которые борются против монашества! Если и армия считает связь артериями тела армии, и наша Церковь точно так же относится к монашеству – эти благословенные люди, которые борются против монашества, хотел бы я знать, какой церкви принадлежат?
        cn: 我就是无法理解一些神职人员和平信徒反对修道生活的行为！如果连军队都认为动脉是军队身体的连结，而我们的教会也同样看待修道生活——这些反对修道生活的蒙福之人，我想知道，他们属于哪个教会？
  - type: heading2
    text:
      ru: Подготовка в миру
      cn: 在俗世中的预备
    children:
    - type: paragraph
      text:
        ru: Поэтому, возлюбленные мои братия, в личном порядке призванные Христом в Его ангельский чин (радистов Церкви), старайтесь по мере сил найти прежде всего монахолюбивого духовника, чтобы он помогал вам и следил за вами, пока вы еще находитесь в миру. Предпочтительнее духовник женатый – достаточно, чтобы он был монахолюбивым, – чем иеромонах-монахоборец. Также, пока вы еще находитесь в миру, будьте внимательными к тому, о чем я буду писать далее и ко всему прочему.
        cn: 因此，我亲爱的弟兄们，你们是基督以个人名义召入祂天使品级（教会的无线电操作员）的人，要尽力首先寻找到一位爱慕修道的神师，好让他在你们尚居于世俗之中时帮助你们、照看你们。一位已婚的神师——只要他是爱慕修道的——要比一位反对修道的修士司祭更值得选择。此外，在你们尚居于世俗之中时，要对接下来我要写的一切和其他所有事情保持警惕。
  - type: heading2
    text:
      ru: О хранении душевной и телесной чистоты
      cn: 论保守灵魂与肉体的洁净
    children:
    - type: paragraph
      text:
        ru: Предпочтительнее тебе общаться с детьми младше тебя, которые являются ангелочками, чем с детьми старше тебя или твоего возраста, если они дьяволята. Лучше для тебя жить вдалеке от мирского окружения и находиться с Богом, чем вращаться в мирском окружении (ради того, чтобы тебя не считали якобы необщительным) и незаметно отчуждиться от Бога.
        cn: 对于你来说，最好是与那些比你年幼、如同小天使一般的孩子们交往，而不是与那些比你年长或与你同龄、如同小恶魔一般的孩子们交往。对你来说，最好是远离属世的环境并与上帝同在，而不是流连于属世的环境中（仅仅是为了不被认为是所谓的不合群）并悄悄地与上帝疏远。
    - type: paragraph
      text:
        ru: Полезнее для тебя казаться дурачком женщинам (а девушке – юношам) ради твоего духовного благоразумия и чистоты и нести и этот тяжелый крест, потому что этот тяжелый крест скрывает в себе всю силу и премудрость Божию, и тогда ты будешь сильнее Самсона и мудрее премудрого Соломона.
        cn: 为了你的属灵谨慎和纯洁，你最好在女人面前显得像个傻瓜（而对于女孩来说，则是在青年人面前显得像个傻瓜），并背负起这个沉重的十字架，因为这个沉重的十字架隐藏着上帝全部的力量和智慧，届时你将比参孙更强壮，比最有智慧的所罗门更有智慧。
    - type: paragraph
      text:
        ru: Когда идешь, лучше читать молитву и не смотреть направо и налево, даже если твои родственники будут думать, что ты их якобы презираешь и не хочешь с ними разговаривать, чем смотреть по сторонам и получать вред, и вдобавок быть неправильно понятым мирскими людьми, которые все понимают лукаво.
        cn: 当你行走时，最好诵念祷文，不要左顾右盼，即便你的亲属会认为你好像轻蔑他们，不愿与他们交谈，也比东张西望、遭受损害，并且额外地被以世俗之人误解要好，因为他们对一切都理解得诡诈。
    - type: paragraph
      text:
        ru: В тысячу раз лучше для тебя после службы убегать от людей, подобно дикарю, чтобы сохранить свое духовное благоразумие и то, что получил от службы, чем сидеть и глазеть на шубы (или на галстуки – девушке) и духовно одичать от ран, которые враг нанесет тебе в сердце.
        cn: 在事奉之后，你宁可像个野人一样逃离人群，以保持你的属灵谨慎和你在事奉中所得之物，这比你坐着凝视皮大衣（或领带——如果是女性）而因仇敌在你心中所施加的创伤，在灵性上变得野蛮，要好一千倍。
    - type: paragraph
      text:
        ru: Полезнее, если у тебя нет работы и ты можешь использовать свое время для духовных занятий, пойти на свиноферму, уподобиться свиньям, вываляться вместе с ними в грязи, а затем вернуться домой, помыться, сменить одежду и почувствовать облегчение после душа, чем соблазниться и пойти в бар или на дискотеку, чтобы твоя душа вывалялась в грязи удовольствий, с тяжелым чувством вернуться домой и потом ощущать в душе этот ад и тяжесть сердечную.
        cn: 「没有工作，而你可以利用时间进行属灵操练时，更有益处的做法是：去养猪场，像猪一样，和它们一起在泥浆中打滚，然后回家，洗个澡，换身衣服，感受淋浴后的轻松；而不是受引诱去酒吧或迪斯科舞厅，让你的灵魂在享乐的污泥中打滚，带着沉重感回家，之后在灵魂中感受到那样的地狱和心里的重负。」
    - type: paragraph
      text:
        ru: Лучше тебе пойти в курятник и послушать, как размеренно кудахчут куры, чем соблазниться, пойти в соседний дом и завести с женщинами разговор о духовных предметах (или девушке – с мужчинами), ибо, сколько бы это дело ни казалось духовным, оно скрывает в себе множество вражиих сетей. Поэтому юношам, которые хотят вести девственную жизнь, лучше избегать женщин, как диавола (как и девушкам юношей), – и я верю, что Христос не осудит их, потому что они делают это из-за немощи своего возраста, – чем осмелеть и быть ободранными, как маленькие деревца, ободранные козами, и стать ни на что не годными.
        cn: 你最好去鸡舍听听母鸡有规律的叫声，也比被引诱，到邻居家与妇女们（或者少女与男人们）谈论属灵事物要好；因为无论此事看起来多么属灵，它都隐藏着许多仇敌的网罗。因此，想要过童贞生活的青年人，最好像躲避魔鬼一样躲避妇女（正如少女躲避青年人一样），——我相信基督不会定他们的罪，因为他们这样做是出于其年龄的软弱，——也好过壮起胆子，像被山羊啃光的小树一样被剥得精光，变得毫无用处。
    - type: paragraph
      text:
        ru: Для молодого – является ли его плоть бодрой или вялой – предпочтительнее сурово подвизаться, чтобы стяжать мужество, чем терпеть вред от своей непокорной плоти или – вялому – от своего слабого женского характера, то есть от женских эмоций и изнеженности.
        cn: 对于年轻人来说——无论他的肉体是充满活力还是萎靡不振——宁可严格地进行苦修，以获取勇气，也不愿遭受其不顺服的肉体所带来的损害，或——对于萎靡不振的人来说——遭受其软弱的女性性格，即女性情感和柔弱所带来的损害。
    - type: paragraph
      text:
        ru: Брат мой, смотри на эти мои необходимые суровые слова как на колючую проволоку для ограждения твоего маленького духовного деревца, пока не вырастут твои ветви, ибо Мать Церковь ожидает от тебя плодов.
        cn: 我的弟兄，请将我这些必要的、严厉的话语，视作一道铁丝网，用以围护你那幼小的属灵树苗，直到你的枝条长大，因为母教会期盼你结出果实。
    - type: paragraph
      text:
        ru: Итак, если ты сейчас будешь внимательным, то позже кроме плодов принесешь еще и густую и прохладную тень и примешь под свой покров не только овец, но и несчастных коз, которые по благодати Божией больше уже не будут вредить тебе, только ты им будешь помогать.
        cn: 这样，如果你现在是专注的，那么之后除了果实，你还会带来浓密而凉爽的树荫，并接纳到你的荫蔽之下，不仅是羊，还有那些不幸的山羊。藉着上帝的恩典，它们将不再伤害你，你只会帮助它们。
    - type: paragraph
      text:
        ru: Постарайся, чтобы твоя работа и твое окружение, пока ты еще находишься в миру, как-то помогали тебе, для того чтобы ты имел некоторую возможность получать пользу во время своей работы, приходил домой спокойным и тебе было бы легче сосредоточиться. Тогда твой подвиг будет легче.
        cn: 尽力使你的工作和你的环境，在你尚处于俗世之时，以某种方式帮助你，好让你在工作期间有机会获得益处，平静地回到家中，并更容易集中精神。这样，你的苦修（podvig）就会更容易。
  - type: heading2
    text:
      ru: Духовное чтение
      cn: 属灵阅读
    children:
    - type: paragraph
      text:
        ru: Для твоего сосредоточения вообще, а особенно при молитве, и для укрепления твоей души необходимо чтение Нового Завета и книг святых отцов, которые помогают понять его. Пока не заводи привычки читать Ветхий Завет, чтобы не повредить себе, потому что еще не имеешь доброго духовного устроения и неправильно поймешь его, тогда как позже, когда достигнешь бесстрастия, все принесет тебе пользу и приведет тебя в умиление, а сейчас сам твой возраст тебе не полезен.
        cn: 为了你总体的专心，尤其是在祷告时，以及为了坚固你的灵魂，研读《新约》和圣教父的书籍是必要的，这些书籍有助于理解《新约》。暂且不要养成阅读《旧约》的习惯，以免伤害自己，因为你尚未拥有良好的属灵安排（*устроение*），你会错误地理解它；而等到以后，当你达到无情欲（*бесстрастия*）时，一切都会使你得益，并使你进入痛悔（*умиление*），但现在，你自身的年龄对你无益。
    - type: paragraph
      text:
        ru: Очень полезны жития святых, «Отечник» или «Эвергетинос»[11], весь полностью, «Лествица», «Невидимая брань», святой Ефрем и «Лавсаик». Также хорошо читать авву Исаака. Несмотря на то, что это, как считается, книга для преуспевших, однако и новоначальным она помогает понять более глубоко смысл жизни и изгнать из себя все виды комплексов, если они есть.
        cn: 阅读圣徒生平、《教父言行录》或《常施者》[11]全书、《天梯》、《不可见的战争》、圣厄弗雷姆的著作以及《乐萨伊克》都非常有益。阅读阿爸伊萨克的著作也很好。尽管这被认为是一本为进阶者（преуспевших）而写的书，但它也帮助初学者（новоначальным）更深入地理解生命的意义，并驱逐（изгнать）自身内部存在的各种情结（комплексов）。
    - type: paragraph
      text:
        ru: Если будешь читать отеческие книги, они согреют твою душу, и помогут усердно подвизаться ради подражания святым, и одновременно оставят тебе великое смирение, поскольку ты будешь сравнивать самого себя со святыми. Это, естественно, изгонит все иллюзии, возникшие у тебя раньше, когда ты считал себя чуть ли не святым, сравнивая себя с хиппи и так далее, ибо только Бог ведает сердца человеческие, тогда как мы судим«по наружности»(Ин. 7:24).
        cn: 如果你阅读教父们的书籍，它们将温暖你的灵魂，并帮助你殷勤地苦修，以效法圣徒；同时，它们也会为你留下极大的谦卑，因为你将把自己与圣徒们进行比较。这自然会驱逐你早先产生的一切幻想，那时你曾把自己与嬉皮士等等相比较，认为自己几乎就是圣徒了，因为唯有上帝知晓人心，而我们却是「按外貌判断」（约翰福音 7:24）。
    - type: paragraph
      text:
        ru: Грязных журналов и так далее не бери в руки, и пусть их вообще не будет в твоем доме, чтобы как-нибудь случайно, под действием твоего возраста, ты не поддался врагу и не взял их, потому что ты не только получишь рану, но еще и приобретешь лукавого (врага), который будет издеваться над тобой, даже если ты покаешься и будешь об этом жалеть.
        cn: 不要拿取污秽的杂志等（物），也不要让它们出现在你的家里，免得不知怎么地，因着你的年龄作用，你屈服于仇敌并拿取它们，因为你不仅会受到创伤，还会获得那个恶毒的（仇敌），它甚至会在你悔改并为此感到懊悔时，嘲弄你。
    - type: paragraph
      text:
        ru: Также бунтарские книги и издания, в которых затрагиваются церковные темы, не читай, если хочешь иметь покой, потому что ты еще не готов к таким серьезным темам. Тебе нужны книги, которые помогут тебе в покаянии. Если хочешь помочь Церкви, исправь себя самого, и сразу исправится одна частичка Церкви. Если бы это делали все, естественно, исправилась бы Церковь.
        cn: 同样，叛逆性的书籍和刊物，涉及教会主题的，如果你想要拥有平安，就不要阅读，因为你尚未准备好处理此类严肃主题。你需要的是有助于你忏悔（покаянии）的书籍。如果你想帮助教会，就修正你自己，教会的一个微小部分（частичка）会立刻得到修正。如果每个人都这样做，教会自然就会得到修正。
    - type: paragraph
      text:
        ru: Поэтому ограничься отеческими книгами, о которых я упомянул, и избегай безвкусных книг некоторых современных писателей, которые только дают своим книгам громкие названия, чтобы вызвать духовный интерес, но от их чтения лишь устаешь, как корова, когда ее ясли полны соломы, устает целый день жевать и в конце концов не дает и стакана молока.
        cn: 因此，你要局限于我所提到的教父典籍，并避开一些现代作家那些毫无品味的著作。这些作家只是给自己的书冠以响亮的名称，以期激起属灵的兴趣，但阅读他们的书只会使人疲倦，如同牛槽中堆满稻草时，牛整日咀嚼却筋疲力尽，到头来连一杯奶也产不出来。
    - type: paragraph
      text:
        ru: Перед тем как начать чтение святых отцов, помолись хотя бы две минуты, чтобы Бог просветил тебя и ты понял божественные мысли. Если у тебя нет времени, когда читаешь, не нужно спешить закончить главу, потому что наша цель не заканчивать главы, но что-то оставить у себя в голове.
        cn: 在你开始阅读圣教父的著作之前，至少祷告两分钟，祈求上帝光照你，使你明白神圣的思想。如果你阅读时没有时间，不必急于读完一章，因为我们的目的不是读完章节，而是让一些东西留在你的脑海里。
    - type: paragraph
      text:
        ru: Также неполезно удовлетворяться только тем, чтобы читать и восхищаться святыми, потому что то же делают люди мирские, которые с жадностью читают о новых похождениях Тарзана и радуются. Наша же цель – духовная, и мы должны понемногу с помощью духовных подвигов подталкивать себя к жизни святых отцов. Поэтому, когда читаем, будем подобны корове, которая предпочитает клевер соломе и, после того как поест, долго жует жвачку, превращая таким образом пищу в молоко.
        cn: 同时，仅仅满足于阅读和赞叹圣徒，也是无益的，因为世俗之人也这样做，他们贪婪地阅读泰山（Tarzan）的新历险记并欢呼雀跃。而我们的目标是属灵的，我们必须借助属灵的苦修（подвигов），一点点地推动自己迈向圣教父们的生活。因此，阅读时，我们要像奶牛一样，它喜欢三叶草胜过干草，吃饱后会长时间地反刍，从而将食物转化为牛奶。
    - type: paragraph
      text:
        ru: Когда я говорю «жевать жвачку», то имею в виду не изучение кожуры, что обычно делают некоторые филологи, которые изучают красивый цвет апельсиновой кожуры, внимательно считают поры этой кожуры и не уделяют внимания плоду, чтобы извлечь для себя множество отеческих витаминов. То есть не изучают святого с его святой жизнью и божественными подвигами, чтобы получить пользу, или то, что он сказал, но – в какой день месяца он это сказал и была ли его борода вся белая, с проседью или вся черная. Этого вида жевание жвачки подобно жеванию бесплодной коровы, которая ни молока не дает, ни телится, но только накапливает жир с множеством токсинов и кончает у мясника.
        cn: 当我谈到「反刍」（жевать жвачку）时，我指的并非去研究果皮——一些文献学家常做的那种研究：他们研究橘子皮美丽的颜色，仔细数着这果皮的毛孔，却不关注果实本身，以便从中汲取许多教父（отеческих）的维生素。也就是说，他们不去研究圣人及其圣洁的生活和属神的苦修（подвигами），以获得益处，或者不研究他所说过的话，却去研究他是在这个月的哪一天说的，以及他的胡须是全白、带有灰白，还是全黑。这种类型的反刍，就像一头贫瘠的母牛在反刍，它既不产奶，也不产犊，而只是堆积脂肪与大量毒素，最终落到屠夫手中。
    - type: paragraph
      text:
        ru: Постарайся по мере сил иметь у себя дома для чтения относительное безмолвие и, если это возможно, отдельную комнату, чтобы почувствовать атмосферу келлии, ибо это очень поможет тебе как-то найти себя и одновременно придаст тебе духовные силы, чтобы преодолеть всякого рода трудности со спокойствием, без нервозности.
        cn: 尽你所能，在家中为阅读保持相对的静默，并且，如果可能，有一间单独的房间，以便感受「隐修室」（келлия）的氛围，因为这将极大地帮助你以某种方式找到自我，同时，它将赋予你属灵的力量，让你能平静地、毫无神经质地克服各种困难。
  - type: heading2
    text:
      ru: Приготовление родителей, братьев и сестер
      cn: 父母、弟兄和姊妹的预备
    children:
    - type: paragraph
      text:
        ru: Необходимо, наряду с прочими твоими приготовлениями, чтобы ты постепенно подготовил и своих родителей, рассказав им о своей божественной цели (о том, что станешь монахом), чтобы позже они не были застигнуты врасплох и не впали бы в уныние. Ты можешь стать причиной того, что с их здоровьем случится что-то плохое от внезапной новости в случае, если у них есть какие-то болезни, и в монастыре они, может быть, устроят скандал. Поэтому попытайся, насколько это для тебя возможно, развязать все свои мирские узлы, чтобы в монастыре быть готовым связать свою жизнь с братией и спокойно молиться по четкам.
        cn: 除了你其他的准备工作之外，你还需要逐步地预备你的父母，告诉他们你的神圣目标（即你将成为修士），以免他们日后措手不及，陷入沮丧。如果你突然告知此事，而他们又有某些疾病，这可能会导致他们的健康出现问题，而且他们或许会在修道院里闹出事端。因此，请尽你所能解开你所有的世俗羁绊，以便在修道院里，你能够准备好将你的生命与弟兄们结合，并平静地用念珠祈祷。
    - type: paragraph
      text:
        ru: Постарайся приготовить своих родителей на языке, который они могут понять, а не на евангельском и святоотеческом (поскольку они не знают его или не хотят понимать), чтобы тебе не стать причиной того, что они будут поносить святых отцов и согрешат.
        cn: 尝试用你的父母能理解的语言来预备他们，而不是用福音书和教父的语言（因为他们不了解或不愿理解），免得你成为他们亵渎圣父们并犯罪的原因。
    - type: paragraph
      text:
        ru: На протяжении всего времени, пока будешь в миру, гляди в оба, а особенно, когда твои родители уже будут знать о том, что ты уходишь от них в монастырь, потому что тогда они найдут тебе еще и невест, чтобы связать тебя и женить, для того чтобы ты не ушел от них и они не лишились бы твоего присутствия. (Как будто те, кого они женят, находятся возле них!)
        cn: 在你身处尘世的这段时间里，务必双目警醒，尤其当你的父母已经知道你要离开他们进入修道院时，因为那时他们还会为你物色新娘，来束缚你，使你结婚，目的是让你不能离开他们，而他们也不会失去你的陪伴。（就好像那些被他们安排结婚的人会留在他们身边一样！）
    - type: paragraph
      text:
        ru: Поэтому, брат мой, удаляйся от застолий и так далее, даже от семейных, потому что они расставляют тебе сети. И если ты попадешься один раз, второго уже не нужно, потому что ты уже попался навсегда. Хотя если ты спросишь родителей, довольны ли они своей мирской жизнью, то они, несмотря на то, что сами ее пожелали, безусловно, скажут, что разочарованы, однако при этом пытаются впутать в эту жизнь души, которые Богом призваны к ангельской жизни, а некоторые родители для достижения своей цели используют даже сатанинские средства. Вы, конечно, понимаете, насколько несчастными могут они сделать тогда своих детей, не говоря уже о грехе, который они берут на себя.
        cn: 因此，我的弟兄，你要远离宴席等等，即便是家庭的宴席也要远离，因为它们正在为你布设罗网。如果你被捕获一次，就不需要第二次了，因为你已经被永远捕获了。虽然如果你问问父母，他们是否满意自己的属世生活，那么他们，尽管是自己选择了这种生活，无疑会说他们很失望，但与此同时，他们却试图把那些被上帝召叫去过天使般生活的灵魂卷入这种生活之中，而有些父母甚至使用撒旦的手段来达到自己的目的。你当然明白，他们那时会使自己的孩子变得多么不幸，更不用说他们自己所承担的罪了。
    - type: paragraph
      text:
        ru: Поэтому ради большей безопасности убегай от застолий и т.д. И зачем нам это нужно? Мы не соглашаемся ни с их мирскими радостями, ни с их мирскими печалями, потому что относимся к ним по-другому. Так зачем же нам это?
        cn: 因此，为了更大的安全，请逃离宴席等等。我们为何需要这些呢？我们既不赞同他们的世俗欢乐，也不赞同他们的世俗忧愁，因为我们对它们的看法不同。那么，我们为何需要这些呢？
    - type: paragraph
      text:
        ru: В общем, избегай всего, что возбуждает (пусть и немного) ветхого твоего человека, если хочешь иметь душевное и телесное здравие, которое будет тебе необходимо в монастыре, в который ты уйдешь позже. Тебе нужно знать, что любая твоя рана из-за невнимательности в миру – малая или большая – создаст в монастыре задержку в развитии и тогда понадобится опытный духовный врач, чтобы следить за тобой, и тебе придется терпеть боль во время «перевязок».
        cn: 总而言之，如果你想拥有灵魂和身体的健康，这健康将在你日后将要离开并前往的修道院中对你至关重要，那么就要避免一切会（哪怕是轻微地）激起你旧人（指属血气的旧有性情）的事物。你需要明白，你在世俗中因疏忽而导致的任何创伤——无论是微小的还是巨大的——都会在修道院中造成发展上的延滞，那时将需要一位经验丰富的属灵医生来照看你，而你将不得不忍受「包扎」时的痛苦。
  - type: heading2
    text:
      ru: Семейные обязанности
      cn: 家庭义务
    children:
    - type: paragraph
      text:
        ru: Если ты хочешь стать монахом, но у тебя есть больные родители или старики, о которых некому позаботиться, младшие братья или незамужние сестры, будь внимательным, чтобы не встать и не уйти, прежде чем посоветуешься, потому что тогда и ты будешь страдать от угрызений совести в монастыре, и те, которые останутся без поддержки, возможно, будут роптать.
        cn: 如果你想成为一名修士，但你却有生病的父母或年迈的老人无人照料，或有年幼的弟弟妹妹或未出嫁的姊妹，要小心，不要在征求建议之前就起身离开，因为那样，你在修道院里也会遭受良心不安的折磨，而那些失去扶持的人，也可能会抱怨。
    - type: paragraph
      text:
        ru: Тем более не уходи не посоветовавшись, если ты по природе очень чувствителен, потому что враг тогда будет бороться с тобой с помощью сверхчувствительности, чтобы тебя еще больше утончить и сломать (то есть навести на тебя или тоску, или безумие, или что-то еще худшее – сохрани Боже!). А если ты посоветуешься, то тебя не только ничто не будет мучить, но с тобой будут еще и молитвы духовника, который позаботится о том, чтобы все твои семейные вопросы были улажены, ибо тогда он принимает ответственность на себя.
        cn: 尤其当你本性非常敏感时，不要在没有征求建议的情况下离开，因为仇敌届时将借由过度的敏感性与你争战，目的是进一步磨损和击垮你（即，给你带来忧郁、或癫狂，或更糟的事情——愿上帝保全！）。而如果你征求了建议，那么不仅不会有任何事物折磨你，而且你还将拥有神师的祈祷，他会关照你所有家庭事务都得以平稳处理，因为那时他就将责任承担在自己身上了。
    - type: paragraph
      text:
        ru: Если в этом случае не посоветуешься и уйдешь с верой в Бога и в то, что Он всесилен и может устранить все твои семейные препятствия, это, конечно, хорошо, и Бог может, как поистине всесильный, даже если у тебя пятнадцать незамужних сестер, прекрасно устроить их в один день. Однако поскольку мы не знаем, совершается ли наш уход по причине такой великой веры в Бога или мы хотим сами устроиться, тогда как имеем в душе большой недостаток любви, то не будем доверять себе и в этом случае, но опять-таки посоветуемся. Конечно, если у нас действительно такая великая вера в Бога, – это является очень хорошим признаком духовного здравия.
        cn: 如果在此情形下，你不去征求建议，而是怀着对上帝和祂全能的信心离去，相信祂能消除你所有的家庭阻碍，这当然是好的。上帝作为一位真正全能者，甚至能在一日之内，妥善安排好你那十五个未婚的姐妹。然而，既然我们不知道我们的离去是出于对上帝如此大的信心，还是我们只是想自己解决问题，而内心却有着极大的爱心不足，那么我们就不该在这种情况下信任自己，而应再次征求建议。当然，如果我们确实对上帝有如此大的信心，那么这是属灵健康的一个极好标志。
    - type: paragraph
      text:
        ru: Итак, когда действительно необходимо позаботиться о родных, как я сказал, и вера твоя невелика, не делай ничего свыше своих сил, но спокойно останься и помогай, пока есть нужда в твоем присутствии. Совершай с ревностью духовные подвиги, ибо это немногое имеет великую ценность в очах Божиих, и Бог не лишит тебя Своей благодати, видя любовь, которую ты оказываешь другим, и то, что, ты страдаешь в чужом климате.
        cn: 因此，正如我所说的，当确实需要照顾亲人，而你的信心又微弱时，不要做任何超出你能力范围的事情，而要平静地留下来并帮助他们，直到你的在场不再是必需。要热切地进行属灵操练，因为这微小的事情在上帝眼中具有极大的价值，而上帝看到你向他人所施予的爱，以及你身处异地所承受的苦楚，就不会使你失去祂的恩典。
    - type: paragraph
      text:
        ru: Брат мой, ты должен знать, что Бог очень праведен и не поступит с тобой несправедливо, если ты позже уйдешь в монастырь, но будет подталкивать тебя Своей божественной рукой, чтобы ты поднимался через ступеньку по лестнице добродетели, либо, если ты вообще не сможешь уйти в монастырь по благословной причине из-за своих обязанностей, приготовит тебе одну из прекрасных райских обителей. Поэтому в данном случае помогай с радостью и будь спокоен, не ворча на других, что они якобы препятствуют тебе. Неполезно, брат, с одной стороны, давать им немного хлеба, с другой – поливать его ядом, потому что никто перед нами не виноват. Возможно, что эти препятствия нам на пользу и благодаря им мы сможем лучше подготовиться, и, следовательно, наша собственная духовная незрелость является причиной того, что на нас остаются наши семейные обязанности.
        cn: 我的弟兄，你当知道，上帝是极其公义的，即使你晚些时候进入修道院，祂也不会对你不公，祂会以祂神圣的手推动你，让你在德行之梯上一步步攀登；或者，如果你由于责任，因着蒙福的缘由根本无法进入修道院，祂也会为你预备一处美好的天堂居所。因此，在这种情况下，要乐意提供帮助，保持平静，不要抱怨他人似乎在阻碍你。我的弟兄，一方面给他们一点面包，另一方面却用毒药浸泡它，这是无益的，因为在我们面前没有人是有过错的。或许这些阻碍对我们有益，借着它们我们能够更好地预备自己，因此，我们自身的属灵不成熟才是我们家庭责任仍然在我们身上的原因。
    - type: paragraph
      text:
        ru: Итак, прославь Бога, будь мирным, подготовься как можно лучше, считай себя в мыслях послушником и тихо подвизайся по мере своих сил.
        cn: 所以，当荣耀上帝，保持平安，尽可能最好地预备自己，在思想上视自己为一名初学生，并安静地按你的力量进行属灵操练。
    - type: paragraph
      text:
        ru: В случае если у тебя есть незамужние сестры, будь осторожен, чтобы не укорять их и не говорить им, что ты остаешься в миру из-за них. Говори им, что ты еще не готов, иначе они, несчастные, будут вынуждены выйти замуж поспешно, чтобы освободить тебя. Однако это будет рабством и для них, а позже и для твоей совести, и тогда твоя душа будет постоянно порабощена беспокойством.
        cn: 若你有未婚的姐妹们，要小心，不要责备她们，也不要对她们说你因为她们而留在世上。告诉她们你还没有准备好，否则她们，这些不幸的人，会被迫仓促嫁人，以便让你得自由。然而，这对她们来说是一种奴役，之后也会奴役你的良心，届时你的灵魂将不断地被忧虑所奴役。
    - type: paragraph
      text:
        ru: Если ты по благословной причине остаешься в миру ради своих старых и беспомощных родителей, а они требуют, чтобы ты женился, тогда как ты чувствуешь призыв к монашеству, будь осторожным, чтобы не уступить им в этом, иначе пострадаешь.
        cn: 如果因合乎祝福（благословной）的原因，你留在世上是为了你年迈和无助的父母，而他们要求你结婚，但你却感到有修道的呼召，务要小心，不要在这方面屈服于他们，否则你会受苦。
    - type: paragraph
      text:
        ru: Не печалься, брат, оттого что они поплачут один раз, потому что жизнью, которой ты не желал, они сделают тебя несчастным, и тогда ты сам всю свою жизнь будешь плакать. Кроме того, будет страдать и другое лицо, которое перед тобой ни в чем не виновато.
        cn: 弟兄，不要因为他们会哭一次而忧伤，因为你所不愿过的生活，他们会使你不幸，那时你将终生哭泣。此外，另一个在你面前毫无过错的人也将受苦。
    - type: paragraph
      text:
        ru: Было бы неплохо, думаю, таких родителей, которые стремятся во что бы то ни стало женить своих детей и не принимают во внимание призыва Божия к ангельскому чину, взять и заключить в разные монастыри и принудить их, пусть и в течение недолгого времени, в старости, хранить целомудрие и вести аскетическую жизнь в посте, бдении, молитве. Это будет очень полезно для того, чтобы они в будущем научились почитать свободу человека, которую почитает Сам Бог, и помогали своим детям соответственно призыву, дарованному им Богом, а не заставляли их мучиться.
        cn: 我认为，对于那些不惜一切代价要让自己的孩子结婚、而不顾上帝对天使般的圣秩（即修道生活）的召叫的父母，最好的办法是，把他们带走，关进不同的修道院，强迫他们，即使只是在一段不长的时间内，在年老时守贞洁，并在禁食、守夜和祷告中过一种苦修生活。这将非常有用，能使他们在将来学会尊重人的自由——上帝自己也尊重这种自由——并根据上帝赐予给他们孩子的召叫来帮助他们，而不是强迫他们受苦。
    - type: paragraph
      text:
        ru: Также следовало бы такую же епитимью наложить и на некоторых матерей, которые дают обет отдать своих детей с малых лет в монастырь, тогда как самим монашеская жизнь кажется тяжелой, и заставляют своих детей мучиться, если они решатся уйти в монастырь, а также если они не пойдут в монастырь и женятся (если они чувствительны, то будут страдать от угрызений совести).
        cn: 同样也应当对某些母亲施加同样的补赎，她们许愿将自己的孩子在幼年时就送入修道院，而她们自己却觉得修道生活很艰难，并强迫自己的孩子受苦，如果他们决定进入修道院，以及如果他们不进入修道院而结婚（如果他们是敏感的人，他们会遭受良心上的谴责）。
    - type: paragraph
      text:
        ru: Конечно, некоторых матерей как-то можно оправдать (как матерей), когда они приходят в отчаяние во время болезни ребенка и из-за скорби дают обет отдать его в монахи. Думаю, что Благий Бог не принимает во внимание такого рода обеты, и молодых людей не должна мучить совесть, если они, выросши, увидят, что не могут стать монахами. Пусть со спокойной совестью создают семью и живут, насколько это для них возможно, со Христом. Пусть не беспокоятся и о своей матери, давшей обет, потому что Бог ведал страдания матери в таких обстоятельствах.
        cn: 当然，某些母亲（作为母亲）在孩子生病期间陷入绝望并因忧伤而许愿将孩子献给修道生活，或许尚可理解。我认为良善的上帝不会顾及这类誓愿，并且如果这些年轻人长大后发现自己无法成为修士/修女，他们的良心不应受到煎熬。让他们以平静的良心组建家庭并生活，尽其所能与基督同在。对于许愿的母亲，他们也不必担忧，因为在这种情况下，上帝知道母亲的苦楚。
    - type: paragraph
      text:
        ru: Нужно заключить в темницу и кормить одним хлебом в малом количестве тех матерей, которые из-за женского эгоизма, чтобы похвастаться перед другими благочестивыми женщинами тем, что у них сын священник, заставляют своих детей становиться иногда архимандритами (конечно, таких случаев меньше), не думая, подходит ли характер ребенка для девства или нет. Конечно, если ребенок окажется усердным, то будет сурово подвизаться, чтобы преуспеть, и увенчается от Христа мученическим венцом; но если не будет усердным, – упаси Боже! – причинит зло и себе и Церкви.
        cn: 那些出于女性的自我中心，为了向其他虔诚的女性夸耀自己有个儿子是神父，而强迫自己的孩子去当神父，甚至有时当上修士大司祭（当然，这种情况较少），却不考虑孩子的性格是否适合守童贞的母亲，应当被关进监狱，只给少量面包充饥。当然，如果孩子是热心的，他将严峻地苦修以求精进，并从基督那里获得殉道者的冠冕；但如果他不热心——愿上帝阻止这种情况发生！——他将损害自己和教会。
    - type: paragraph
      text:
        ru: Таким образом, вопрос о девстве не решается матерью, но мать должна помогать всем своим детям сохранять девство, пока они маленькие, а когда они вырастут, родители опять-таки должны помогать тем из них, которые хотят вести девственную жизнь и дальше, стать монахами. Тогда они получат честь за то, что помогли исполнить Божие призвание.
        cn: 因此，关于童贞（贞洁）的问题并非由母亲决定，但母亲必须帮助她所有的孩子在年幼时保持童贞（贞洁），当他们长大成人后，父母则再次必须帮助那些希望继续过童贞（贞洁）生活的人成为修士（修女）。这样，他们将因帮助实现上帝的呼召而获得荣耀。
  - type: heading2
    text:
      ru: Удаление от мира
      cn: 脱离世界
    children:
    - type: paragraph
      text:
        ru: Итак, когда придет благословенный час уходить из мира в монастырь, сначала проверь себя, цело ли твое сердце и принадлежит ли оно полностью тебе, или, может быть, кто-то взял частицу твоего сердца себе. Не дерзни, брат, уйти в монастырь, прежде чем не овладеешь своим сердцем полностью, потому что иначе потерпишь неудачу. Даже если один его процент будет отдан любви к кому-либо, позже враг будет причинять тебе беспокойство, потому что утвердится в 1%-ной части твоего сердца и будет сражаться против тебя иногда через плоть, а иногда через помыслы, и плохо будет, если он полностью овладеет им потом, когда ты уже станешь монахом и когда будет «впереди омут, а сзади стремнина»[12].
        cn: 那么，当离开世界进入修道院的蒙福时刻来临时，首先要检查你自己，你的心是否完整，是否完全属于你，或者，是否有人取走了你心的一部分归于自己。弟兄，在完全掌控你的心之前，切勿胆敢进入修道院，因为否则你将失败。即使它百分之一的部分被献给对某个人的爱，日后仇敌也会给你带来困扰，因为它将确立在你心中那百分之一的部分里，并有时通过肉体，有时通过意念与你争战，如果你后来已成为修士，当「前有深潭，后有急流」[12]时，它若完全掌控你的心，那将是糟糕的。
    - type: paragraph
      text:
        ru: Если кто-то только борим плотью, это не является препятствием для того, чтобы он стал монахом; достаточно, если для него не актуальна тема брака. Если же она и была для него когда-то актуальна, достаточно, если он давно разорвал брачные узы и сам полностью располагает своим сердцем.
        cn: 如果某人仅被肉体所困扰（борим плотью），这并不妨碍他成为一名修士；只要婚姻的议题对他不再是切身问题（актуальна）。而如果婚姻曾是他切身的问题，只要他早已断绝了婚姻的联系（брачные узы），并完全掌握了自己的心，那就足够了。
    - type: paragraph
      text:
        ru: Конечно, человек, который в силу своего живого характера больше борим со стороны плоти, больше будет подвизаться, чтобы укротить ее, и, несомненно, много боровшийся получит бо́льшую награду от Бога – достаточно ему подвизаться со смирением, в посильном посте и бдении с молитвой. Тогда Благий Бог во всем помогает и сразу же источает в душе бесстрастие и тишину вместе со Своей любовью и нежностью к чадам, которые подвизаются, чтобы сохранить Его заповеди, и желают спастись.
        cn: 当然，一个人，因着他生动的性格，更多地受到肉体的争战，就更要苦修来制伏它，而且，毫无疑问，那争战良多的人将从上帝那里获得更大的奖赏——只要他以谦卑、尽其所能的禁食、守夜和祷告来苦修就够了。那时，良善的上帝在一切事上帮助他，并立刻将无情欲（*besstrastie*，不动心）和平静倾注到他的灵魂之中，连同祂对那些努力持守祂诫命并渴望得救之儿女的爱与温柔。
    - type: paragraph
      text:
        ru: 'Другой серьезный вопрос, к которому тебе нужно отнестись внимательно, прежде чем стать монахом: необходимо целиком вверить своих родителей и все их касающееся Богу, чтобы ты имел мир в монастыре и родители твои имели все благословения Божии и здесь и в иной жизни (если уходишь по благословению своего духовника). Абсолютное вверение их Богу само по себе уже является постоянной молитвой о них. Следовательно, тебе нет необходимости ни думать о них как о своих, ни даже молиться о них, ибо все это ты отдал Богу вместе с самим собой.'
        cn: 在你成为修士之前，另一个你需要认真对待的严肃问题是：你必须将你的父母和所有与他们相关的事情完全托付给上帝，这样你才能在修道院中获得平安，你的父母也才能在此世和来世获得上帝的一切祝福（如果你是带着你的神师的祝福离开的话）。将他们绝对地托付给上帝本身就是为他们献上的持续不断的祷告。因此，你没有必要将他们视为你自己的，甚至也不必为他们祷告，因为所有这些你都已连同你自己一同交给了上帝。
    - type: paragraph
      text:
        ru: 'Если поступишь так, брат, то это очень поможет тебе стяжать любовь ко всем, то есть тот вид любви, какой имеет и Бог. Выходя из пределов малой любви к своей маленькой семье, постепенно войдешь в великую семью – Церковь и будешь иметь великую любовь ко всем и любить равно всех людей. Твоя любовь к одним будет выражаться через радость, а к другим – через сострадание. Ты всех будешь считать своими братьями, потому что все мы – дети Евы (члены великой семьи Адама и Бога). Тогда уже и в своей молитве будешь говорить: «Боже, помоги сначала тем, у кого есть большая нужда – живым или усопшим нашим братьям». Тогда твое сердце будет отдано всему миру и у тебя ничего больше не будет, кроме великой любви, которая есть Христос.'
        cn: 如果你这样做，弟兄，那会对你非常有益，助你获取对所有人的爱，也就是上帝拥有的那种爱。走出对你小家庭的有限之爱，你将逐渐进入伟大的家庭——教会，并将拥有对所有人的大爱，平等地爱所有人类。你对一些人的爱将通过喜乐来表达，对另一些人的爱则通过怜悯来表达。你将视所有人为你的弟兄，因为我们都是夏娃的孩子（亚当和上帝这个伟大家庭的成员）。那时，你在祷告中也会说：「上帝啊，请先帮助那些有巨大需要的人——无论是我们活着的弟兄还是已故的弟兄。」那时，你的心将献给整个世界，你将不再拥有任何其他东西，只有那伟大的爱，那爱就是基督。
  - type: heading2
    text:
      ru: Избрание монастыря
      cn: 选择修道院
    children:
    - type: paragraph
      text:
        ru: Начиная с Божией помощью монашескую жизнь и оставив свою земную родину, будь осторожен, чтобы случайно не увлечься первым же монастырем, который встретится на твоем пути, и сразу же не поступить в него.
        cn: 在上帝的帮助下开始修道生活并离开你的尘世故乡时，务要小心，以免偶然被你道路上遇到的第一个修道院所吸引，并立即进入其中。
    - type: paragraph
      text:
        ru: Прежде всего узнай, какие монастыри более духовные, войди в общение с духовными старцами и посоветуйся. Затем отметь для себя две-три более духовные обители и поживи в них сначала просто как паломник, записывая свои впечатления от каждой из них. Потом выясни, какая из всех этих обителей имеет лучшие духовные условия, и уже после этого поступай в монастырь. Записи своих впечатлений о других монастырях сохраняй до тех пор, пока не утвердишься, потому что враг может напоминать тебе о других монастырях для того, чтобы изгнать тебя из обители и заставить скитаться. Пусть у тебя будет это оружие, и ты будешь бороться с ним своими «за» в отношении твоей обители и в отношении других своими «против», которых было больше.
        cn: 首先，你要了解哪些修道院更具灵性，与那些属灵的长老们建立交通并征求他们的建议。然后，为你自己挑选两三个更具灵性的修道院，先以朝圣者的身份在其中居住一段时日，记录下你对每个修道院的印象。之后，弄清楚在所有这些修道院中，哪一个拥有更好的属灵条件，然后才能进入该修道院。你对其他修道院的印象记录要保留下来，直到你站稳脚跟为止，因为仇敌可能会提醒你关于其他修道院的事情，目的是将你赶出你所在的修院，迫使你四处漂泊。让这些记录成为你的武器，你可以用支持你所在修院的「赞成」以及反对其他修院（那些有更多「反对」之处的修院）的「反对」来与仇敌争战。
    - type: paragraph
      text:
        ru: 'Поступая таким образом (вначале как простой паломник), поищи место, которое принесет тебе покой, и подходящий образ монашеской жизни: будет ли это общежительный монастырь, исихастирий или келлия и т.д.[13]Когда я говорю «исихастирий», – имею в виду не находящиеся в миру, но находящиеся на Святой Горе, в которых живут один или два отшельника в одной каливе. В большинстве же калив нет даже храма.'
        cn: 在这样做时（起初作为一个普通的朝圣者），请寻找能带给你安宁的地方，以及一种合适的修道生活方式：是共住制修道院、静修所（hesychasterion）还是小室（kellia）等等[13]。当我说「静修所」时，我指的不是世俗中的，而是那些位于圣山，仅有一或两名隐修士居住在一所简陋居所（kaliva）内的静修所。大多数这样的简陋居所甚至没有圣堂。
    - type: paragraph
      text:
        ru: Исихастирии в миру являются, по сути, общежительными монастырями, однако некоторые благоговейные архиереи признают их исихастириями и таким образом избавляют от появляющихся иногда владык, которые входят подобно «добрым тещам» и создают проблемы, тогда как у благословенных такое множество других проблем в епархиях. То есть эти исихастирии являются киновиями, но, благодаря признанию их исихастириями, им не причиняют беспокойства владыки.
        cn: 世俗中的静修院[Исихастирии в миру]实质上是共住修道院，但一些虔诚的都主教[архиереи]将其认可为静修院[исихастирия]，如此便能免除一些有时出现的、如同「好岳母」般进入并制造问题的「主教」[владык]的干扰，而那些蒙福之人[благословенных]在教区中已经有如此多的其他问题了。也就是说，这些静修院是共住生活[киновии]，但由于被认可为静修院，主教就不会打扰它们。
    - type: paragraph
      text:
        ru: При выборе монастыря, если ты болезнен, прими во внимание климат. На северных склонах гор и на открытых освещенных местах, а также там, где растительности немного, климат всегда здоровый. Место на солнечной стороне, где увидишь белые камни и невысокие дубы, – самое здоровое, и вода там очень хорошая. А где увидишь темные камни и земляничные деревья[14], – влажно, если только обитель не располагается на склоне горы и не освещается солнцем. В тенистых ложбинах, даже если там растут сосны, все равно влажно. Также там, где растут каштаны, бывает высокая влажность, за исключением тех случаев, когда деревьев немного и растут они на солнечной стороне на склоне горы.
        cn: 在选择一座修道院时，如果你体弱多病，请考虑其气候。在山脉的北坡和开阔的、光照充足的地方，以及植被稀疏的地方，气候总是健康的。在阳光充足的一侧，如果你看到白色石头和矮小的橡树，那里的环境是最健康的，水质也非常好。而如果你看到深色的石头和草莓树[14]，那里的环境则潮湿，除非修道院位于山坡上并被阳光照射。在阴凉的低谷地带，即使那里生长着松树，仍然是潮湿的。同样，在栗树生长的地方，湿度会很高，除非树木稀少，且它们生长在山坡上阳光充足的一侧。
    - type: paragraph
      text:
        ru: Конечно, тому, кто болезнен и не имеет большого самоотречения, хорошо принять во внимание и климат монастыря, чтобы позже не роптать и не быть вынужденным перейти в другую обитель. Однако, если такой человек оказался невнимательным и попал в не совсем здоровый климат, для него лучше проявить небольшое снисхождение к самому себе в отношении аскезы, чтобы потом не изнашивать одеял и чтобы другие не были вынуждены изнашивать свою обувь, посещая его, и при этом не тратили денег и не испытывали трудностей.
        cn: 当然，对于那些体弱多病且缺乏大舍己精神的人来说，最好将修道院的气候也考虑在内，以免日后发怨言，或被迫迁往另一座修道院。然而，如果这样的人疏忽大意，落入了一个不太健康的气候中，那么对他而言，最好是在苦修方面对自己略微宽容一些，以免日后穿破被褥，也避免他人被迫穿破鞋子去看望他，从而浪费金钱和经历艰难。
    - type: paragraph
      text:
        ru: Если, брат мой, ты ошибешься и поступишь в монастырь с более или менее влажным климатом, то в худшем случае нанесешь вред своей плоти. То, к чему нужно стремиться больше всего, – это чтобы весь духовный климат твоего монастыря был здоровым, для того чтобы не потерпела вреда твоя душа, тем более если ты сам немного болезнен духовно. Когда я говорю «болезнен духовно», то имею в виду не только малые или большие плотские немощи, но и болезненное состояние ума. То есть когда природа человека лукава, он думает всегда лукаво и даже в чистом видит лукавство. (Хотя дух мира сего считает людей лукавых умными, но поскольку они лукавы, постольку больны духовно.) Такие люди сильно нуждаются в святом окружении, чтобы освятиться. Они нуждаются в очень хорошем «питании», чтобы поправиться духовно. А юноши, у которых нет лукавства, здоровые духовно, своей детской простотой вместе со всей своей духовной нищетой (смирением) похожи на бедных детей (самых здоровых), у которых кровь с молоком.
        cn: 如果，我的弟兄，你选错了，进入了一个气候或多或少潮湿的修道院，那么最坏的情况下，你损害的只是你的肉体。你最应该努力争取的，是你的修道院的整个属灵气氛（或译：精神气候）是健康的，为的是你的灵魂不至受损，尤其是如果你自己在属灵上就有些病态。当我说「属灵上病态」时，我指的不仅是或大或小的肉体上的软弱，也指心智的病态。也就是说，当一个人的本性是诡诈的，他总是思想诡诈，甚至在纯洁的事物中也看到诡诈。（虽然这世界的灵认为诡诈的人是聪明的，但他们越是诡诈，就越是属灵上病态。）这样的人非常需要圣洁的环境来得以成圣。他们需要非常好的「滋养」来在属灵上康复。而那些没有诡诈的年轻人，属灵上是健康的，他们孩子般的纯朴连同他们所有的属灵的贫乏（谦卑），就像贫穷的孩子（最健康的）一样，他们的血液（像）牛奶。
    - type: paragraph
      text:
        ru: Поэтому обрати внимание как на духовный климат – в случае, если ты духовно болезненный, – так и на своего духовного врача, чтобы он исцелил тебя.
        cn: 因此，请你留意属灵的氛围——在你属灵上患病的情况下——也要留意你的属灵医师，好让他治愈你。
    - type: paragraph
      text:
        ru: 'Постарайся, насколько возможно:'
        cn: 我会尽我所能：
    - type: paragraph
      initial:
        ru: '1.'
        cn: '1.'
      text:
        ru: чтобы твой старец был духовным человеком, имеющим добродетели, и больше подвижником, чем учителем. Хорошо, если он стал капитаном из юнг, так что не будет на чужих спинах испытывать монашескую науку, которую выучил по книгам, или же от природы имеет большую любовь с рассуждением, сочувствует своим детям и не стремится послать их сразу же в рай – по примеру Диоклетиана[15]. Старец должен быть очень строгим только по отношению к себе, тогда как по отношению к другим должен иметь большую любовь (но не показную, ложную, любовь), а также великое рассуждение, ибо если нет рассуждения, то и любовью (подобной любви Илия[16]) он опять-таки причинит зло своим чадам, и тогда придет гнев Божий и на него, и на его чад. Также послушнику очень полезно, если его старец по возрасту старше его, по крайней мере, лет на восемнадцать-двадцать, ибо это вызывает у послушника естественное уважение;
        cn: 以确保你的长老是一位有德行的属灵人，并且是一位修行者多于一位教师。如果他是一位从水手成长起来的船长，那便很好。这样，他就不会在他人的背上来试验他从书本上学到的修道学问，或者他天生就具有极大的爱心与分辨力，能体恤他的孩子们，并且不会急于将他们立刻送入天堂——效法戴克里先[15]的榜样。长老只应当对自己非常严厉，而对他人则必须怀有极大的爱（但不是虚假、做作的爱），以及极大的分辨力。因为如果没有分辨力，那么即使是怀着爱（类似以利亚[16]的爱），他仍会给他的孩子们带来伤害，那时，上帝的愤怒就会降临到他自己和他的孩子们身上。此外，如果他的长老在年龄上比他大至少十八到二十岁，这对受教者（послушник）也非常有益，因为这会使受教者产生自然的尊重；
    - type: paragraph
      initial:
        ru: '2.'
        cn: '2.'
      text:
        ru: чтобы старец жил простой жизнью – без забот и излишних мирских попечений и совершенно не искал своей собственной пользы (чтобы быть духовно свободным), а искал лишь пользы для души послушника и вообще пользы для Матери Церкви (это, конечно, очень поможет послушнику никогда не внимать помыслам идти и якобы спасать души человеческие в миру, но у него будет доверие к своему старцу, который сам благословит его и пошлет помогать миру, если увидит в его желании что-то истинное);
        cn: 使长老过一种简单的生活——没有忧虑，没有多余的世俗挂虑，并且完全不寻求自身的益处（以便在灵性上获得自由），而只寻求对顺从者的灵魂有益处，并且总体上寻求对母教会的益处（这当然会极大地帮助顺从者，使其永不听从那些关于前往世间并声称拯救人类灵魂的意念，但他会对他的长老抱有信任，如果长老看到他的愿望中有真实之处，他自己会祝福并派遣他去帮助世间）；
    - type: paragraph
      initial:
        ru: '3.'
        cn: '3.'
      text:
        ru: чтобы старец был другом безмолвия и молитвы и мог и тебя связать с Богом через молитву, для того чтобы ты обрел действительную радость божественного утешения, ибо эта небесная сладость перенесет твои ум и сердце из мира на небо. (Потому что когда монах не чувствует в своей келлии сладости любви Божией, Его ласки и ощутительного присутствия и когда он не чувствует, что Пречистая, как его Матерь, с ним в его келлии, и не говорит с Ней, как маленький ребенок, иногда рассказывая Ей о своих скорбях, а иногда о радости, тогда чем он отличается от несчастных детей из детского дома?)
        cn: 好让这位长老成为静默与祷告的朋友，也能通过祷告将你与上帝联系起来，好让你获得神圣慰藉的真实喜乐，因为这种属天的甘甜会将你的心智与心灵从世界带到天上。（因为当修道士在他的修道室中感觉不到上帝之爱的甘甜、祂的爱抚和可感知的临在，当他感觉不到至圣者，如同他的母亲，与他同在他的修道室中，并且不与她交谈，如同一个小孩子，有时向她诉说他的悲伤，有时诉说他的喜乐时，那么他与育幼院中不幸的孩子们又有什么区别呢？）
    - type: paragraph
      text:
        ru: Поэтому старцу необходимо иметь вышеуказанные черты, чтобы помочь тебе, особенно вначале, чтобы ты не вспоминал о ложных мирских радостях и чтобы затем у тебя в душе не увеличивалась пустота.
        cn: 因此，长者有必要具备上述特征，以便帮助你，尤其是在最初阶段，使你不再回想虚假的世俗欢乐，并避免随后你心中的空虚加剧。
    - type: paragraph
      text:
        ru: Очень хорошо, если монастырь удален от мира и от исторических мест и мирского шума. Даже самые почитаемые монастыри часто уклоняются от своей настоящей цели, потому что часто доходят до того, что превращаются из монастырей в торговые заведения. Поэтому некоторые владыки – и очень справедливо – хотели бы владеть ими сами, так как монахи должны любить нестяжание, хранить которое они обещали Богу. Однако, к сожалению, они не ограничиваются необходимым и простым – как для себя, так и для монастыря в целом. Они не могут удержаться чтобы не принимать от верующих пожертвования, и не побуждают их самих помогать нашим нищим братьям, которые страдают. Но что делают? Собирают даже пот бедных и наполняют им множество лампад и колоколов, думая, что так славословится Бог. Однако такого рода благочестие подобно благочестию многих русских клириков, которые – сами того не желая – стали причиной того, что лампады, паникадила и колокола стали пушками, стреляющими по самой Церкви Христовой.
        cn: 非常好，如果修道院远离尘世、远离历史古迹和世俗的喧嚣。即使是最受尊崇的修道院也常常偏离其真正的目标，因为它们常常沦为贸易场所。因此，一些主教——这是非常公正的——希望自己拥有它们，因为修士们应当爱慕不贪财，这是他们向上帝许诺要持守的。然而，不幸的是，他们并不满足于必需和简单的事物——无论是对于自身还是对于整个修道院而言。他们忍不住接受信徒的捐赠，却不鼓励信徒们自己去帮助那些受苦的贫穷弟兄。那么他们做了什么？他们甚至收集穷人的汗水，并用它装满无数的油灯和钟，以为这样就是在赞美上帝。然而，这种虔诚类似于许多俄罗斯教士的虔诚，他们——自己并不情愿地——成了这样一种情况的原因：油灯、多枝吊灯和钟变成了炮弹，射向基督的教会自身。
    - type: paragraph
      text:
        ru: 'Будь осторожным, брат, чтобы не соблазниться тем, что я упомянул: ни мирской вежливостью, которую увидишь, ни мирской любовью, ни мирскими удобствами, которые тебе предложат, ни каким-то мирским порядком, какой увидишь в монастыре, потому что всякий мирской порядок в монастыре является великим беспорядком.'
        cn: 当心，弟兄，不要被我提到的东西所诱惑：不要被你所看到的世俗礼貌所诱惑，不要被世俗之爱所诱惑，不要被他们向你提供的世俗便利所诱惑，也不要被你在修道院里看到的某种世俗秩序所诱惑，因为修道院里的任何世俗秩序都是极大的混乱。
    - type: paragraph
      text:
        ru: Итак, все мирское в монастыре считай за петлю, которая в конце концов задушит тебя внутренним беспокойством, потому что ты уже будешь находиться в монастыре и не сможешь этим пользоваться, как хотел бы, и будешь страдать. Даже если у тебя появится возможность и ты это получишь, то опять-таки увеличишь пустоту в душе и окажешься совершенно лишенным Христа, а внутри твоей великой пустоты будет большое душевное беспокойство – такое же, какое мучит человека более других богатого материальными благами.
        cn: 因此，你在修道院中应将一切世俗之物都视作陷阱，它们终将以内在的忧虑窒息你，因为你既已身在修道院，便无法如你所愿地使用它们，并将因此受苦。即便你有了机会并获得了这些东西，你反而会增加灵魂中的虚空，彻底地失去基督；而在你巨大的虚空之中，将是巨大的、折磨人心的忧虑——就像那折磨着拥有最多物质财富之人一样的忧虑。
    - type: paragraph
      text:
        ru: Кто сомневается, что со всем современным комфортом монастырь может действовать более удобно? Если бы у каждого монаха была рядом мама, которая ухаживала бы за ним, то, конечно, это было бы удобством. И если бы в церкви ставили магнитофон, чтобы он воспроизводил звуки (молитвы), то, конечно, это было бы отдыхом, и еще большим отдыхом было бы, если бы стасидию[17]переделали в кровать. Нет сомнений, что для аскета было бы удобно, если бы у него была маленькая машинка специально для того, чтобы перебирать четки, и кукла-аскет, которая падала бы и вставала, творя за него поклоны и молитву по четкам, а сам он купил бы себе мягкий матрац, чтобы лежать и давать отдых своей исстрадавшейся плоти. Конечно, все это приносит облегчение плоти, но душу опустошает и делает несчастной, оставляя ей только женские эмоции и беспокойство.
        cn: 谁会怀疑，有了所有现代化的舒适设施，修道院可以更方便地运作呢？如果每个修士身边都有一个照顾他的妈妈，那当然会是一种方便。如果在教堂里放置一个磁带录音机，让它播放声音（祷告），那当然会是一种休息，如果把唱诗台（stasia）[17]改造成一张床，那会是更大的休息。毫无疑问，对于一位苦修者来说，如果他有一台专门用来拨动念珠的小机器，和一个可以替他行大拜和念诵念珠祷告，能够倒下又站起来的苦修者人偶，那将是方便的，而他自己则可以买一个柔软的床垫，躺在上面，让他受苦的肉体得以休息。当然，所有这一切都给肉体带来了缓解，但却使灵魂空虚，变得不幸，只给她留下女性的情绪和不安。
    - type: paragraph
      text:
        ru: 'Поэтому, брат мой, раз уж ты благополучно отправился к чему-то высшему, смотри, чтобы тебе, хотя ты ушел от мирского, опять не закончить тем же мирским. Не забывай, зачем ты ушел из мира, и стремись к жизни более высокой, чем мирская, чтобы твой уход из мира и твоя монашеская жизнь имели смысл. Иначе – горе твоему плаванию. Не говорю: «Горе тебе из-за того, что ты причинил скорбь своим родителям», потому что они получат свою награду от Бога.'
        cn: 因此，我的弟兄，既然你已顺利地启程前往某种更高的境界，请留意，即使你已离开世俗，也不要最终又回到同样的世俗之事。不要忘记你为何离开世界，并努力追求一种高于世俗的生活，好使你离开世界和你的修道生活具有意义。否则，你的航程就悲惨了。我不是说：「你给你父母造成了痛苦，所以你悲惨了」，因为他们将从上帝那里得到他们的奖赏。
    - type: paragraph
      text:
        ru: Другое, к чему ты должен быть внимательным и что тоже очень важно, – чтобы мотивы, которые побуждают тебя любить твоего старца, были чистыми, а не нездоровыми. То есть не увлекайся старцем, если он твой земляк (будь в этом особенно осторожен). Пусть на тебя не производит впечатления только его большая или седая борода и почтенный вид. Также оттого, что он очень худой, не считай его большим подвижником (тогда как он может быть худым от природы). Также не пытайся стать его послушником из-за того, что у него громкое имя, – это обнаружит самую большую твою духовную болезнь, если ты новоначальный монах в возрасте, а не маленький ребенок с детским умом.
        cn: 你必须留意的另一点，同样非常重要——促使你爱你的长老的动机必须是纯洁的，而非不健康的。也就是说，不要因为长老是你的同乡就迷恋他（在这方面要特别小心）。不要仅因为他有着大而花白的胡须和可敬的外表就对他印象深刻。也不要因为他很瘦，就认为他是大苦行者（而他可能只是天生就很瘦）。同样，不要因为他声名显赫就试图成为他的顺服者——如果你是年长的初学修士，而不是心智如同小孩的小童，这会暴露你最大的属灵疾病。
    - type: paragraph
      text:
        ru: Если ты девушка, то тоже проверь себя, чтобы случайно не увлечься старицей потому, что она очень образованна или очень красива, или потому, что у нее мужественный характер, ибо и это все – тоже болезнь, а больным душам нужна помощь, чтобы они очистили свою любовь, выводя из себя все духовные токсины, и не занимались выращиванием мирских плодов в пустыне.
        cn: 如果你是女性，你也要省察自己，以免偶然地被一位女长老吸引，因为她受过高等教育，或非常美丽，或因为她拥有男性气质的性格；因为所有这些也都是一种病，而有病的灵魂需要帮助，使她们能洁净自己的爱，将所有属灵的毒素从自身中排出，而不是在荒漠中种植世俗的果实。
  - type: heading2
    text:
      ru: Монашество и мирское мудрование
      cn: 隐修与属世的思想
    children:
    - type: paragraph
      text:
        ru: Итак, нам, монахам, нужно избегать в жизни монастыря, насколько это возможно, современных средств и чтить пустыню, приспосабливая себя к ней, чтобы и пустыня даровала нам свой святой покой и мы получили бы помощь для опустошения нашей души от страстей. Неправильно желание приспособить пустыню к нашему мирскому «я», ибо это грех непочтения к пустыне.
        cn: 因此，我们这些修士，需要尽可能地避免在修道院生活中使用现代工具，并尊崇旷野（或：沙漠、荒漠），使自己适应它，好让旷野也赐予我们它那神圣的宁静，并使我们在将灵魂从情欲中掏空（或：净空）的过程中获得帮助。想要让旷野适应我们世俗的「自我」是错误的，因为这是对旷野不敬的罪。
    - type: paragraph
      text:
        ru: Если кто-то из монахов-модернистов хочет, может построить монастырь на крыше многоэтажного дома, для того чтобы иметь все мирские удобства, какие хочет, чтобы наслаждаться электрическим светом или подниматься на третье небо на лифте, – и пусть оставит пустыню в покое.
        cn: 如果任何一位现代派的修士愿意，他可以在一栋多层房屋的屋顶上建一座修道院，为了拥有他想要的一切世俗便利，为了享受电灯或乘坐电梯升到三重天，——让他把旷野（或：沙漠）留给它自己吧。
    - type: paragraph
      text:
        ru: К сожалению, некоторые такие монахи вместе со всем своим мирским мудрованием переносят в пустыню также весь свой мирской дух и все свои мирские средства[18], постоянно заняты изменениями и переделками, внешним благоустройством, кирпичами и кучей цветочных горшков и не знают, что такое четки, а знают только попечения, хорошую еду и кирпичи. Все это присуще плотским людям, которые являются кирпичами – брением, а не духом Божиим. (Я не имею в виду новооткрытые монастыри, где трудятся, чтобы иметь крышу над головой).
        cn: 很遗憾，有些这样的修士，连同他们全部世俗的智慧，也将他们全部的世俗精神和全部的世俗手段[18]带入了旷野，他们持续不断地忙于改变和重新设计、外部的整修、砖块和一堆花盆，他们不知道什么是念珠，而只知道挂虑、美食和砖块。所有这些都是属乎肉体的人的特征，他们是砖块——是泥土，而非上帝的灵。（我说的不是那些新开的修道院，他们在那里劳作是为了有一个遮风避雨之处。）
    - type: paragraph
      text:
        ru: Итак, если монах не обретет духовного делания, если не получит помощи от старца и будет постоянно занят внешним, то неизбежно духовно одичает и не сможет усидеть у себя в келлии, даже если его свяжут. Ему всегда будет нравиться общаться с людьми, проводить с ними экскурсии, говорить о куполах и археологии, показывать им горшки с разными цветами, устраивать для них богатые мирские обеды и покоить только внешних, мирских, людей[19]. Если разобраться, какого рода этот покой, то можно увидеть, что это не покой, но через это занятие люди просто немного забывают о своих скорбях, а затем опять возвращаются к состоянию душевного беспокойства, потому что мирское мудрование подобно червю, который точит дерево.
        cn: 因此，如果一位修士没有获得属灵的操练，如果没有得到长老的帮助，并且一直忙于外在之事，那么他将不可避免地在灵性上变得野蛮（或「孤立」），无法待在自己的小室里，即使把他捆绑起来也不行。他总是喜欢与人交往，带他们参观，谈论穹顶和考古学，给他们看装有各种花卉的盆栽，为他们准备丰盛的世俗宴席，只安抚外在的、世俗的人[19]。如果仔细探究这种安抚是哪一类，就会发现这不是安抚，而只是人们通过这种忙碌稍微忘记了自己的悲伤，然后又回到了精神不安的状态，因为世俗的思虑（「世俗的智慧」）就像蛀蚀树木的蠹虫。
    - type: paragraph
      text:
        ru: 'Следовательно, монастыри имеют духовную цель, и в них не должно быть мирской стихии, но небесная, для того чтобы души наполняла райская сладость. В мирском мы не можем соревноваться с мирянами, потому что у мирян все равно больше возможностей. Что из этого следует? Несчастные миряне хотят от нас, монахов, чего-то более высокого, а нам, чтобы достичь более высокого, нужно избегать всякого человеческого утешения. Ибо мы не сможем почувствовать божественное утешение (райскую сладость), если не будем избегать мирских утешений и если наше мирское мудрование не умрет совершенно. Нужно, чтобы мирское мудрование, умерев, стало перегноем и чтобы в нас выросло божественное мудрование, ибо божественные наслаждения не рождаются из телесных наслаждений, но из телесных скорбей, возникающих при подвижнической жизни, которую ведут сознательно и с рассуждением ради любви ко Христу Его прилежные чада, чтобы совлечь с себя ветхого человека (мирского). Добрый Отец после этого питает Своих детей райской пищей, когда они еще находятся на земле, и они с радостью «играюще поют»[20]: «Воскресения день…»[21]– если, конечно, подвижнически преодолели великую четыредесятницу, великую пятницу на кресте, духовно воскресли и теперь уже постоянно переживают Светлую седмицу, то есть празднуют Воскресение не однажды в год, но для них постоянно «Пасха, Господня Пасха»[22].'
        cn: 因此，修道院拥有属灵的目的，其中不应存在世俗的元素，而应是天上的元素，好让灵魂充满乐园的甘甜。在世俗的事上，我们无法与平信徒竞争，因为平信徒无论如何都拥有更多的可能性。由此得出什么结论呢？不幸的平信徒希望从我们修士这里得到一些更高层次的东西，而我们若要达到更高层次，就需要避免一切人为的慰藉。因为，除非我们避免世俗的慰藉，除非我们的世俗思虑彻底死亡，否则我们将无法感受到神圣的慰藉（乐园的甘甜）。世俗的思虑需要死亡并成为腐殖质，神圣的思虑需要在我们里面成长，因为神圣的享乐并非源于肉体的享乐，而是源于为着爱基督，祂的勤勉儿女们有意识、有分辨地过苦修生活时所产生的肉体上的悲伤，以便脱去旧人（世俗的人）。在那之后，慈爱的父用乐园的食物喂养祂的儿女们，即便他们仍身在地上，他们快乐地「嬉戏歌唱」[20]：「复活之日…」[21]——当然，前提是他们苦修地克服了大利四十日，克服了十字架上的大礼拜五，在灵性上复活了，并且现在持续经历光明周，也就是说，他们不是一年一次庆祝复活节，而是对于他们而言，持续地是「逾越节，主的逾越节」[22]。
    - type: paragraph
      text:
        ru: 'Благий Бог наш сделал жизнь человека очень сладкой, в хорошем смысле этого слова – духовном, однако мы, злосчастные, иногда превращаем ее в мучение, потому что не сбрасываем с себя мирского мудрования и не воспринимаем вещи духовно. И тогда мы делаем свою жизнь сладкой в дурном смысле этого слова и хотим никогда не умирать, и с годами усиливается наше оханье от тревожного ожидания и душа наша наполняется беспокойством. То есть мы, окаянные люди, часто доходим до того, что хотим удержать нашу душу в нашей столетней изможденной плоти с помощью капельницы, и говорим: «Жизнь сладка», и боимся умереть; тогда как для человека, умершего для мира и духовно воскресшего, совершенно не существует тревожного ожидания, страха и беспокойства, потому что и саму смерть он ждет с радостью, так как пойдет ко Христу и будет радоваться, и тому, что живет, он опять-таки радуется, потому что и живет со Христом и на земле отчасти ощущает райскую радость и спрашивает себя, есть ли в раю радость выше той, которую он ощущает на земле.'
        cn: 我们良善的上帝使人的生命非常甜蜜，是在这个词的好意义上——即属灵的意义上，然而我们这些不幸的人，有时却把它变成了煎熬，因为我们没有摆脱世俗的意念，没有以属灵的方式看待事物。这样，我们就使自己的生命在那个词的坏意义上变得甜蜜，并且渴望永不死去；随着岁月的流逝，我们因焦虑的等待而发出的呻吟日益加剧，我们的灵魂充满不安。也就是说，我们这些可怜的人，常常到了这样的地步：想用点滴来 удержи我们百岁衰弱的肉体中的灵魂，并说：「生命是甜蜜的」，害怕死去；然而对于一个向世界死去并属灵复活的人来说，焦虑的等待、恐惧和不安是完全不存在的，因为他甚至以喜乐等待死亡，因为他将去到基督那里并欢欣喜乐；他活着，他也同样欢欣喜乐，因为他与基督同活，并且在地上部分地感受到天堂的喜乐，他自问，天堂里是否有比他在地上所感受到的更高的喜乐。
    - type: paragraph
      text:
        ru: 'Вот какова сладкая жизнь в ее настоящем и хорошем смысле. Хотя истинные монахи понимают, что то, что они получают в этой жизни, есть лишь часть райской радости и что в раю она будет больше, но при этом из-за большой любви к своему ближнему хотят еще пожить на земле, чтобы помочь людям молитвой, для того чтобы в дела мира вмешался Бог и мир получил помощь. Блаженны эти монахи, и молитвами их да помилует Бог и меня, остающегося, к несчастью, окаянным. Я бы очень хотел, чтобы Благий Бог удостоил всех нас, монахов, последовавших ангельской жизни, того, чтобы мы достигли меры этих монахов и постоянно день и ночь говорили: «Слава Богу, что я живу, слава Богу, что умру!»'
        cn: 这就是甜蜜生活在其真实且美好的意义上。虽然真正的修士们明白，他们在这生命中所领受的只是天堂喜乐的一部分，并且在天堂中它将更为宏大，但同时，出于对邻人的深爱，他们仍愿意多活在世上，以便通过祈祷来帮助人们，使上帝干预世俗事务，让世界得到帮助。这些修士是有福的，愿上帝借着他们的祷告也怜悯我，这个不幸依然可怜的人。我非常希望良善的上帝恩准我们所有跟随天使般生活的修士，使我们能达到这些修士的程度，并能日夜不断地说：「荣耀归于上帝，我活着！荣耀归于上帝，我将死去！」
    - type: paragraph
      text:
        ru: Такова ангельская жизнь, которой еще на земле начинают жить монахи, облеченные в ангельский образ (будь то юноша или девушка), который (ангельский образ) превращает оба пола в два ангельских крыла и посредством чистой любви очень высоко возносит души, так что уже не существует плотского различия:«несть мужеский пол, ни женский»(Гал. 3:28).
        cn: 这就是天使般的生活，修士们（无论青年还是少女），穿上天使的形像，在世上就开始了这种生活，这（天使的形像）将两性转变为天使的两翼，并借着纯洁的爱将灵魂高高地托举起来，以至于肉体的区分不再存在：「并不分男，不分女」（加拉太书 3:28）。
    - type: paragraph
      text:
        ru: Итак, этой жизнью, которой еще здесь живут монахи, будут жить также все те, которые удостоятся рая, ибо в раю не будут жениться и выходить замуж, но будут,«яко ангели», – так сказал Христос саддукеям  (См.Мф. 22, 30). Поэтому мы, монахи, день и ночь должны благодарить и славословить Бога за эту великую честь, которую Он нам даровал, призвав нас в Свой ангельский чин, чтобы мы получили полную духовную возможность уподобиться ангелам на земле.
        cn: 因此，借着这生活，就是修道士们在此地仍在过的生活，所有那些蒙恩配得进入天堂的人也将过上。因为在天堂里，人将不娶不嫁，而是「像天使一样」——基督对撒都该人如是说（参 马太福音 22:30）。所以，我们这些修道士，应当昼夜感谢和颂赞上帝，因为祂赐予了我们这份极大的尊荣，呼召我们进入祂的天使的等次，使我们能获得完全的属灵可能性，在地上就效法天使。
    - type: paragraph
      text:
        ru: Прими все это во внимание, мой новоначальный брат, и стремись достигнуть желаемого; раз уж ты отправился в путь хорошо, будь внимателен ко всему, что я сказал, чтобы и закончить его хорошо.
        cn: 我初学的弟兄，请将这一切铭记于心，并努力达成你的愿望；既然你已良好地启程，就要留心我所说的一切，好使你也能圆满地完成这段路程。
    - type: paragraph
      text:
        ru: Кроме юношей, которые должны воздавать великую благодарность Богу, давшему им такую великую честь, о которой я сказал – за ангельский чин, хорошо было бы, чтобы и родители этих юношей смогли осознать ту великую честь, которую им даровал Бог, соблаговоливший вступить с ними в родство.
        cn: 除了那些应该向赐予他们如此伟大荣耀——正如我所说的——即天使品级的上帝，献上极大感谢的青年人之外，这些青年人的父母若是也能认识到上帝所赐予他们的那份伟大荣耀，就是乐意与他们结为亲属，那就好了。
  - type: heading2
    text:
      ru: Начало монашеского жития
      cn: 修道生活的开始
    children:
    - type: paragraph
      text:
        ru: После того как ты уже выберешь лучший монастырь (или келлию, или исихастирий и т.д.), найдешь лучшие духовные условия и получишь внутреннее удостоверение о своем старце, нужно будет «бросать якорь», делая поклон послушника, когда ты будешь испытывать и одновременно будут испытывать тебя.
        cn: 在你选定最好的修道院（或会室、或静修所，等等），找到最好的属灵条件，并获得内心对你长老的确认之后，你将需要「抛锚」，在你（同时）被考验以及考验他人的时候，向长老行顺服者之跪拜礼。
    - type: paragraph
      text:
        ru: Если хочешь положить хорошее начало и в духовном здравии продвигаться по своему монашескому пути, чтобы ты не утомлялся сам и не утомлял других, прежде всего открой свое сердце твоему старцу и исповедайся ему за всю жизнь. Смотри на это, брат мой, как на необходимость, потому что всякий больной, приходя в больницу, рассказывает историю своей болезни, чтобы самому получить от врача наибольшую помощь. Будь осторожен, чтобы случайно не скрыть какого-нибудь своего плана (якобы духовного), потому что позже сам пострадаешь от своего плана, когда окажешься вне плана Божия и будешь подвизаться своими собственными ничтожными человеческими силами, а не Божиими.
        cn: 如果你想有一个好的开端，并在你的修道之路上以属灵的健康不断前进，使你自己不致疲倦，也不致使他人疲倦，首先，向你的长老敞开你的心扉，并向他告明你一生的罪。我的弟兄，你要将此事视为必要，因为凡来到医院的病人，都会讲述自己的病史，好从医生那里得到最大的帮助。要小心，切勿偶然隐藏了你自己的任何计划（即便是声称属灵的），因为日后你会因你自己的计划而受苦，那时你将发现自己处于上帝的计划之外，并以自己微不足道的人类力量而非上帝的力量来修行。
    - type: paragraph
      text:
        ru: Если хочешь попасть в святой Божий план, вверь все Богу, выброси все свои планы и заберись на спину своего старца, как благоразумный ребенок, не брыкаясь, и будь благодарен ему за то, что он переносит тебя на своей спине в рай, к Богу, и даст Ему за тебя ответ.
        cn: 如果你想要进入上帝神圣的计划，将一切都交托给上帝，抛弃你所有的计划，像一个明智的孩子一样，不踢不闹地爬上你的长老（或神师）的背，并对他心怀感恩，因为他背负着你进入天堂、到达上帝那里，并要为你在祂面前交账。
    - type: paragraph
      text:
        ru: Кроме генеральной исповеди, тебе хорошо было бы также открывать ему и все свои помыслы каждый день, пока не достигнешь здорового состояния. И это тоже считай для себя необходимым, как больной, который обследуется вначале каждый день, чтобы избавиться от высокой температуры.
        cn: 除了总告解之外，你最好也能每日向他敞开你所有的意念（помыслы），直到你达到一个健康的状态。而且，把这事也视为对你而言是必要的，就像一个病人起初每日都要接受检查，为要摆脱高烧一样。
  - type: heading2
    text:
      ru: Послушание
      cn: 顺服
    children:
    - type: paragraph
      text:
        ru: Истинно, что в первое время для новоначального часто недостаточно одних усилий старца, пока дело не наладится, если старец хочет исполнить работу хорошо, зная великую ответственность за душу своего послушника, которую он принял на себя. Поэтому, брат мой, помоги и ты своему старцу в спасении твоей души своим слепым послушанием.
        cn: 确实，在最初阶段，对于初学者来说，仅仅依靠长者（старец）的努力常常是不够的，除非事情走上正轨——如果长者想要很好地完成工作，他知道自己为他所接受的修道弟子（послушник）的灵魂所承担的巨大责任。因此，我的弟兄，你也当以你盲目的顺从（послушание）来帮助你的长者拯救你的灵魂。
    - type: paragraph
      text:
        ru: Чтобы не уставать в послушании и не брыкаться, нужно понять его смысл, для того чтобы почувствовать его необходимость, и только тогда послушание тебя освободит, потому что послушание не рабство, но свобода.
        cn: 为了在顺从中不至疲倦，不至反抗，你必须理解它的意义，从而感受到它的必要性。只有这样，顺从才会使你得着自由，因为顺从不是奴役，而是自由。
    - type: paragraph
      text:
        ru: 'Итак, когда ты поймешь, что твой старец несет на себе ответственность за тебя и что он заботится о твоем спасении и все, что ни делает, – делает для твоего добра, а не для того, чтобы тебя мучить, тогда ты будешь радоваться, слыша от него: «не то» или «не это», или «пойди сюда», или «не ходи туда», потому что ты поймешь, что все делается для твоего добра, чтобы уберечь тебя от всякого зла посредством опыта, который он приобрел на основании происшедшего с ним самим или с другими. Тогда ты будешь радоваться, исполняя послушание и спрашивая, и даже в мелочах не захочешь поступать по своему разуму, чтобы не допустить промаха, однако из почтения к старцу – чтобы не утомлять его – будешь делать то, что просветит тебя делать Бог, а твое сердце внутренне опять будет подчиненным.'
        cn: 因此，当你明白你的长老对你负有责任，他关心你的救恩，并且他所做的一切，都是为了你的益处，而不是为了折磨你时，那时你会因听见他说：「不是那个」或「不是这个」，或「到这里来」，或「不要去那里」而欢喜，因为你会明白，一切都是为了你的益处而做，是为了借着他自己或他人所发生的事件而获得的经验，来保护你免受一切邪恶。那时，你会欢喜地遵行听命和询问，甚至在小事上也不愿按自己的理智行事，以免失误。然而，出于对长老的敬重——以免使他疲倦——你会做神光照你去做的事，而你的内心深处仍将是顺从的。
    - type: paragraph
      text:
        ru: К сожалению, эту великую тайну послушания, которое есть свобода, враг скрывает и представляет послушнику совершенно в ином свете и таким образом мучает и послушника, заставляя его считать себя рабом, и старца, который, подобно ремесленнику, не может обтесать его. Тогда послушник все благодетельные орудия и удары, которые применяет к нему старец, считает истязаниями мучеников, а старца своего часто считает Диоклетианом.
        cn: 不幸的是，仇敌隐藏了顺从（即自由）这一伟大的奥秘，并以完全不同的光景将其呈现给顺从者，以此来折磨顺从者，使他认为自己是奴隶；也折磨他的长老，使长老如同一个手艺人，无法雕琢他。这时，顺从者就将长老施用在他身上的一切有益的工具和击打，都视作殉道者的酷刑，而将自己的长老常常视作戴克里先。
    - type: paragraph
      text:
        ru: 'Часто послушник принимает их с радостью, но начинает думать, что, если будет терпеть, получит от Бога два венца: преподобного и мученика (бессмыслица, являющаяся не чем иным, как великим обольщением лукавого (врага)).'
        cn: 侍从（послушник）常常欣然接受它们，但开始心想，如果他能忍受，他将从上帝那里获得两个冠冕：敬虔者（преподобный）和殉道者（мученик）的冠冕（这是一种毫无意义的想法，它无非是那恶者（敌人）的巨大欺骗（обольщение））。
    - type: paragraph
      text:
        ru: Как хорошо бывает послушнику, когда он поймет смысл послушания и обретет свободу, и старец будет свободно трудиться над его душой! Тогда оба радуются и веселятся, и тогда Христос – там, где«два или трие собрани»(Мф. 18:20), – ибо в противном случае могут быть двое или трое и с ними лукавый.
        cn: 对于见习修士而言，当他领悟了顺服的意义并获得了自由，而长老也能自由地为他的灵魂劳作时，他将多么美好！那时，两人都欢喜快乐，基督也就在「有两三个聚集」（马太福音 18:20）之处——因为否则，可能有两三个聚集，但恶者也与他们同在。
    - type: paragraph
      text:
        ru: Во время испытания, если тебе будет трудно, смирись перед своим старцем и расскажи ему о своих трудностях. Если опять будешь испытывать затруднения, опять смирись, ибо он или забыл, или хочет проверить у тебя «пульс» – сколько у тебя стойкости. Одновременно молись, чтобы Бог укрепил тебя и просветил твоего старца.
        cn: 在你遭受试炼时，如果感到艰难，要谦卑地来到你的长老面前，告诉他你的难处。如果再次感到困境，就再次谦卑，因为他或者已经忘记，或者想检验你的「脉搏」——你拥有多少坚忍。同时要祈祷，求上帝坚固你，并光照你的长老。
  - type: heading2
    text:
      ru: Контакты с посетителями и братиями
      cn: 与来访者和弟兄们的接触
    children:
    - type: paragraph
      text:
        ru: Одним из серьезнейших вопросов, который нельзя оставить без внимания, особенно новоначальному, является вопрос о посетителях. Тебе нужно не только избегать их, но и со смирением попросить старца, чтобы твоя келлия была подальше от монастырской гостиницы, для того чтобы ты мог забыть мир и все мирское. Если же возможно, пусть твой старец поместит тебя среди преуспевших отцов, чтобы ты мог видеть последователей святых подвижников. Потому что хороший пример поможет тебе так, как не поможет множество книг.
        cn: 其中一个最严肃的问题，尤其是对于初学者来说，是不能被忽略的，那就是关于访客的问题。你不仅要避开他们，而且要谦卑地请求你的长者，让你的小室远离修道院的客栈，以便你能够忘记世界和所有世俗之事。如果可能，让你的长者把你安置在那些有成就的教父中间，好让你能看到圣洁苦行者的追随者。因为一个好的榜样对你的帮助，是许多书籍都无法比拟的。
    - type: paragraph
      text:
        ru: Мы должны знать, что новоначальный (юноша) подобен магнитофону и может записать в своем чистом уме и хорошее, и плохое. Новоначальный также похож на фотоаппарат и запечатлевает все, что видит. Если увидит плохое, враг покажет ему во сне непристойное кино и осквернит его по причине юности его возраста.
        cn: 我们必须知道，初入教者（年轻人）就像一台录音机，可以在他纯净的心灵中录下好的和坏的。初入教者也像一台照相机，会摄下他所看到的一切。如果他看到不好的事物，仇敌就会在梦中向他展示不雅的电影，并因他年龄尚轻而玷污他。
    - type: paragraph
      text:
        ru: Поэтому позаботься о том, чтобы находиться вдали от посетителей и гостиницы, пока не забудешь мирское и твой внутренний мир не изменится от духовного изменения божественной любви, которая загорится в твоем сердце и затем сожжет весь мусор (злые помыслы), который будет бросать тебе в душу лукавый.
        cn: 因此，要努力远离访客和客栈，直到你忘却世俗，且你的内在世界因着那神圣之爱的属灵转变而发生变化。这爱将在你心中点燃，随后焚烧那恶者抛入你灵魂中的所有垃圾（恶念）。
    - type: paragraph
      text:
        ru: Будь внимателен, пока ты еще новоначальный, чтобы не прельститься помыслом вступать в общение с посетителями для того, чтобы якобы помочь им, ибо такое желание обнаруживает болезнь. Если даже ты видишь в себе добродетель, то должен знать, что эта твоя добродетель полна мирских токсинов. Поэтому избегай посетителей, чтобы для начала очиститься от токсинов.
        cn: 你尚是初学之人，要保持警醒，以免被一种思念所诱惑，就是为了所谓的帮助来访者而与他们交往，因为这种愿望显露了病态。即便你觉得自己有美德，你也应当知道，你这美德充满了世俗的毒素。因此，要避开来访者，以便首先洁净自己，除去毒素。
    - type: paragraph
      text:
        ru: Если иногда чувствуешь небольшую сладость, не думай, что стяжал это своими великими подвигами, потому что это шоколадка маленькому ребенку от Доброго Отца, услаждающего тебя, чтобы ты трудился и питался сладостями из райской кондитерской, которую Он тебе показал. Также и позже, когда Он будет дарить тебе уже не маленькие подарки, но целый дар великой и непрестанной сладости, пусть твой помысел не говорит тебе опять, что это за твои дела, но – от Бога. Наши дела – грехи и великая неблагодарность нашему благодетелю Христу. Конечно, у всех людей есть какие-то грехи и неблагодарность, и впредь нам нужно из благодарности приносить Христу хотя бы свое покаяние и не удаляться от Него.
        cn: 如果有时你感到些微的甜美，不要以为这是你通过伟大的苦修所获得的，因为这是良善之父给小孩子的巧克力，祂使你感到甜美，好让你劳作并以祂向你展示的、来自天堂糖果店的甜食为食。同样，以后当祂赐予你不再是小礼物，而是完整的一份巨大且持续不断的甜美之恩赐时，不要让你的心思再次对你说，这是因为你的行为，而要说——这是来自上帝的。我们的行为是罪和对我们施恩者基督的巨大不感恩。当然，所有人都有一些罪和不感恩，往后我们需要出于感恩，至少将我们的悔改献给基督，并且不远离祂。
    - type: paragraph
      text:
        ru: Думаю, что после той великой жертвы, которую Христос принес ради нас, будет великой неблагодарностью с нашей стороны опять попасть в ад и опечалить Его. Поэтому лучше, чтобы нас удерживали от греха, для того чтобы мы не попали в ад, не огонь геенны, приводящий нас в трепет, а большое усердие и большая любовь к нашему благодетелю Христу (пламенная любовь). Коротко говоря, мы должны не попасть в ад благодаря усердию, чтобы не опечалить Христа.
        cn: 我认为，在基督为我们献上那伟大的祭献之后，我们若再次堕入地狱并使祂忧伤，将是极大的忘恩负义。因此，最好是抑制我们犯罪的，不是地狱之火——那使我们颤栗的硫磺火——而是对我们的施恩者基督的巨大热忱和伟大的爱（炽热的爱）。简而言之，我们必须通过热忱来避免堕入地狱，以免使基督忧伤。
    - type: paragraph
      text:
        ru: Итак, брат мой, мы должны быть внимательны, чтобы никогда не удаляться от Христа и иметь с Ним постоянную связь через молитву; и хорошо было бы, чтобы нашей молитве предшествовало внимание, чтобы не случилось того, о чем говорит Давид:«и молитва его да будет в грех»(Пс. 108:7).
        cn: 因此，我的弟兄，我们必须谨慎，以免我们永远离开基督，并藉着祷告与祂保持不断的连结；而最好是我们的祷告之前要有专注，以免发生大卫所说的事情：「愿他的祷告变为罪」（诗篇 108:7）。
    - type: paragraph
      text:
        ru: 'Будь внимательным во время молитвы, но еще больше до молитвы, чтобы не иметь лишних бесед во время выполнения послушания. Благодаря этому потом будешь молиться без отвлечения и без ран в душе, ибо большое количество слов производит множество недоразумений. Если хочешь поговорить – Христос с радостью ждет, чтобы Его дети говорили с Ним. Избегай даже разговоров на духовные темы, когда нет святости, потому что они с духовного начинаются и осуждением заканчиваются. Если другие обсуждают или осуждают и так далее – тебя это не должно интересовать, но лишь твои собственные грехи и искание милости Божией через непрерывное собеседование с Ним: «Господи, Иисусе Христе…»'
        cn: 在祷告时要专注，但在祷告前更要专注，以免在履行顺服使命（послушания）时进行不必要的交谈。借此，你随后就能不分心、心灵不受创伤地祷告，因为大量言语会产生许多误解。如果你想说话，基督正欢喜地等待祂的孩子们与祂交谈。即使在没有圣洁的情况下，也要避免谈论属灵话题，因为它们以属灵开始，却以论断告终。如果他人正在议论、论断等等，你不必关心，你只需关注你自己的罪，并借着与祂不间断的交谈来寻求上帝的怜悯：「主耶稣基督啊……」
    - type: paragraph
      text:
        ru: Всегда имей только хорошие помыслы обо всех, поскольку, даже если другие и осуждают и так далее, у них, может быть, нет других грехов, кроме этого, и это их злословие станет причиной того, что они смирятся и поплачут перед Богом и соединятся с Ним; тогда как у нас, брат мой, множество грехов и нам достаточно этого, чтобы плакать.
        cn: 你当永远只对所有人怀有美好的意念，因为即使他人论断等等，他们或许除了这一点之外没有其他的罪，并且他们的诽谤会成为他们谦卑、在上帝面前哭泣并与祂联合的原因；而我们，我的弟兄，则有许多的罪，这些罪已足够让我们哭泣。
    - type: paragraph
      text:
        ru: Для тебя лучше по возможности избегать этих собраний, равно как и любопытства, потому что мы собираем хлам помыслов, а потом теряем много сил, чтобы его вымести. Всегда будем иметь добрые помыслы и не будем принимать лукавых телеграмм, если хотим, чтобы наше сердце очистилось и лукавые машины нашего завода (сердца) превратились в хорошие машины. Тогда уже он из золота будет делать святые чаши, из разбитых колоколов – паникадила и даже из выброшенной старой бумаги – чистые салфетки. Однако когда сердце лукаво, то и хорошее золото оно считает бронзой и делает из него либо пули, либо пушки. Поэтому сердце должно очиститься добрыми помыслами по отношению ко всем и непринятием телеграмм от лукавого, ибо«от сердца исходит»все злое (Мф. 15:19) и опять-таки«от избытка... сердца уста глаголют»(Мф. 12:34).
        cn: 你最好尽可能避免参加这些聚会，也避免好奇心，因为我们聚拢了思虑的垃圾，之后又要花费大量力气来清除它。如果我们希望我们的心得以洁净，并且我们工厂（心）的邪恶机器转化为良善的机器，我们就要常常持有良善的思虑，不接受那恶者的电报。那样一来，它就会用黄金制作圣杯，用破碎的钟制作吊灯，甚至用被丢弃的旧纸制作洁净的餐巾。然而，当心是邪恶的时候，它甚至会把好的黄金视为青铜，并用它来制作子弹或大炮。因此，心必须藉着对所有人的良善思虑和不接受那恶者的电报而得以洁净，因为「从心里发出」一切恶事（马太福音 15:19），并且「心里所充满的，口里就说出来」（马太福音 12:34）。
    - type: paragraph
      text:
        ru: Итак, когда человек оставляет злые мысли и перестает совершать зло, тогда к нему приближается благость Божия и приходит уже детская невинность с духовной зрелостью и божественным рассуждением, и он уже знает сердца человеческие и не делает человеческих выводов. И самое важное тогда то, что, отличая святого от преступника, он тем не менее и преступника считает лучшим себя, с состраданием любит его и молится о спасении своего брата. Молится он также о его покаянии, думая, что, вероятно, тот мог бы совершить еще большие злодеяния, однако поборол себя и ограничился меньшими. Принимает во внимание также условия, в которых он вырос, наследственность и все дурные предпосылки, которые ему были даны и которые примет во внимание Праведный Бог. Одновременно он обличает себя за то, что, может быть, не ответил на многие благоприятные возможности, которые дал ему Бог, и молится со смирением и состраданием, и Благий Бог помогает преступнику, и милует его, и одновременно удваивает Свою благодать благоразумному Своему рабу:«добре, рабе благий и верный»(Мф. 25:21).
        cn: 因此，当一个人弃绝邪恶思想并停止作恶时，上帝的良善就靠近他，而带着属灵成熟和神圣明辨的孩童般纯真也随之而来，他已洞察人心，不再做出属人的结论。那时最重要的事情是，即使他能区分圣徒与罪犯，他仍然认为该罪犯比自己更好，怀着怜悯爱他，并为他弟兄的得救祈祷。他也为该罪犯的悔改祈祷，心想：或许那人本可以犯下更大的罪恶，但他却战胜了自己，仅限于较小的恶行。他也考虑到该罪犯成长的环境、遗传以及所有给他带来的恶劣前提条件，而公义的上帝会考虑到这一切。与此同时，他谴责自己，因为他或许没有回应上帝赐予他的许多有利机会，他带着谦卑和怜悯祈祷，而良善的上帝帮助了那罪犯，怜悯了他，同时也加倍地赐福给祂这明智的仆人：「好，你这又良善又忠心的仆人」（马太福音 25:21）。
    - type: paragraph
      text:
        ru: К сожалению, некоторые из нас не смотрят на вещи божественным оком, а потому и самих себя делают несчастными и обнаженными от дарований, и Бога опечаливают своим несчастным состоянием и ставят Его в трудное положение. То есть, если Он дает нам некое дарование, мы тут же начинаем гордиться, и беда в том, что мы своим гордым поведением раним души других. Если же не дает, то, видя наше несчастное положение, как Добрый Отец, скорбит о нас, потому что имеет великие богатства, чтобы даровать их нам.
        cn: 很遗憾，我们中有些人不用属神的眼光来看待事物，因此使自己变得不幸，并赤裸地失去了神恩，又用我们不幸的景况使上帝忧伤，并使祂处于困境。也就是说，如果祂赐予我们某种神恩，我们立刻就开始骄傲，而问题在于，我们以骄傲的行为伤害了其他人的灵魂。如果祂不赐予，那么，这位良善的父（Father）看到我们不幸的景况，就为我们忧伤，因为祂拥有丰盛的财富可以赐予我们。
    - type: paragraph
      text:
        ru: Как хорошо было бы, если бы мы познали самих себя! Тогда смирение стало бы уже нашим неизменным состоянием и Бог сделал бы нас богатыми Своими божественными дарами. Тогда бы уже перестали действовать духовные законы («возносяйся смирится»(Лк. 14:11)), поскольку мы всегда ходили бы смиренно и не падали и постоянно получали бы благодать Божию, которая неизменно дается смиренным.
        cn: 如果我们认识了我们自己，那将是多么美好！那样，谦卑就已成为我们不变的状态，而上帝就会以祂神圣的恩赐使我们富足。那时，属灵的法则（「凡高举自己的，必降为卑」（路加福音 14:11））就会停止作用，因为我们总是谦卑地行走，不会跌倒，并会持续领受上帝的恩典，这恩典是恒常赐予谦卑之人的。
  - type: heading2
    text:
      ru: Пользование келлией
      cn: 使用斗室
    children:
    - type: paragraph
      text:
        ru: Попытайся, насколько возможно, кроме общения с людьми, избегать также всякого человеческого утешения, если хочешь ощутить божественное утешение, которое не сравнимо ни с чем человеческим. Поэтому полюби свою келлию, свой улей, ибо это поможет тебе сосредоточиться, и ты будешь собирать мед добродетелей, которые будут услаждать тебя больше меда.
        cn: 尽你所能，除了与人交流之外，也要避免任何属人的慰藉，如果你渴望感受到神圣的慰藉，那慰藉是任何属人的事物都无法比拟的。因此，要热爱你的修士居室，你的蜂巢，因为它将帮助你集中精神，而你将采集到美德的蜂蜜，它们会比蜂蜜更使你甘甜。
    - type: paragraph
      text:
        ru: Твоя келлия поможет тебе подняться высоко с помощью умиления, которое она тебе принесет, и божественной любви, которая возгорится в твоем сердце. Тогда твоя келлия будет уже твоим любимым домом, а также домом Божиим, в котором ты будешь жить свободно и просто, как маленький ребенок в доме своего отца, ощущающий безопасность и безмерную любовь своих родителей.
        cn: 你的小室会帮助你借由它带给你的心恸（umilenie）和在你心中燃起的神圣之爱而高高升起。那时，你的小室就已经是你心爱的家，也是上帝的家，你将在其中自由、简单地生活，如同一个在父亲家中感受到父母的安全感和无量之爱的小孩子一样。
    - type: paragraph
      text:
        ru: Итак, стоит потрудиться, чтобы превратить свою келлию как бы в маленькую церковь, украсив ее иконами и всем остальным, что поможет нам чтить ее, для того, чтобы она создавала у нас благоговейное настроение и притягивала нас, и даже наши помыслы сосредоточивши бы на молитве и вообще на наших духовных обязанностях[23], располагая нас исполнять их с радостью. Конечно, бывают дни, когда или от усталости, или по болезни мы не можем исполнять их как следует. Плохо, когда мы совершенно оставляем их, потому что враг пользуется этим и овладевает нашим сердцем. В таких случаях нам нужно опять хоть что-нибудь делать, пусть и самое малое, как делают хорошие солдаты, которые, когда не могут наступать, дают отдельные очереди из дзота, и враг не приближается. А потом при первой же возможности они идут в атаку с тяжелым вооружением и побеждают врага.
        cn: 因此，值得我们努力将自己的斗室（келлия）转化为一间小小的教堂，用圣像和所有其他能帮助我们敬重它的东西来装饰它，以便它在我们心中营造出一种虔敬（благоговейное）的情绪，吸引我们，甚至让我们的意念（помыслы）集中于祷告，并集中于我们的一般属灵责任[23]上，促使我们带着喜乐去履行它们。当然，有些日子，我们可能因为疲倦或疾病而无法妥善履行这些责任。但若我们完全放弃它们，那就不好了，因为仇敌会利用这一点，占据我们的心。在这种情况下，我们必须再次做点什么，哪怕是最微小的事，就像优秀的士兵那样：当他们无法进攻时，他们会从碉堡里发射零星的排射，这样仇敌就不会靠近。然后，一旦有机会，他们就会使用重型武器发动攻击，并战胜仇敌。
  - type: heading2
    text:
      ru: Осторожность за пределами келлии
      cn: 在斗室之外的谨慎
    children:
    - type: paragraph
      text:
        ru: Брат мой, когда выходишь за пределы своей келлии, помни о враге, который готов к нападению. И беда в том, что он зол и не только ищет повода, но и сам создает поводы для того, чтобы завлечь тебя под обстрел и наносить тебе раны.
        cn: 我的弟兄，当你走出你的小室时，请记住那准备好发动攻击的仇敌。祸患在于，他既邪恶又不只寻找借口，他还会自己创造借口，以便引诱你进入炮火之下，并伤害你。
    - type: paragraph
      text:
        ru: Подражай опять-таки хорошему солдату, который, выходя из дзота, держит наготове автомат. Так и ты держи в руках свои четки и бодрствуй, чтобы из-за какой-нибудь небольшой неосторожности не расточить свое богатство, которое с таким трудом собрал в келлии.
        cn: 你也要再次模仿一名好士兵，他从掩体（дзот）中出来时，会让他的自动步枪随时准备好。你也要这样，把你的念珠（четки）拿在手里，保持警醒（бодрствуй），以免因某种微小的粗心大意而浪费了你费尽心力在你的隐修室（келлии）中积聚的财富。
    - type: paragraph
      text:
        ru: Пусть четки никогда не выходят из твоих рук, потому что это шнур, за который мы дергаем один-два-пять-десять раз, заводя двигатель, пока наконец духовное масло не разогреется и наша духовная машина непрестанной молитвы не тронется с места. Даже когда твоя машина тронется с места, не оставляй их, чтобы и других это не побудило оставить их, хотя они еще не тронулись с места.
        cn: 勿让念珠从你手中离开，因为这是我们拉动一、二、五、十次以启动引擎的绳索，直到属灵的油终于被加热，我们那不间断祷告的属灵机器开始启动为止。即便你的机器已经启动了，也不要丢弃它们，以免这会促使其他尚未启动机器的人也丢弃它们。
    - type: paragraph
      text:
        ru: 'Выходя из своей келлии, во избежание всякого зла (помимо происходящего от любопытства), ограничь свое многословие краткими словами: «Благослови» и «Как благословите». Тогда и Бог благословит тебя, и все будут тебя любить, и ты никогда не впадешь в искушение, потому что диавол будет обезоружен и сам будет вынужден постоянно лежать ниц и помимо своего желания воздавать тебе почтение.'
        cn: 从你的隐修室出来时，为了避免一切邪恶（除了那些源于好奇心的），将你的多言限制在简短的词语中：「请祝福」和「如你所祝福的」。那时，上帝也会祝福你，所有的人都会爱你，你也绝不会陷入试探，因为魔鬼会被解除武装，他自己也会被迫持续俯卧在地，并违背自己的意愿向你致敬。
    - type: paragraph
      text:
        ru: 'Если встретишь какого-нибудь болтуна, не отворачивайся от него, но скажи, что спешишь, и уйди с любовью. Хорошо было бы, чтобы ты удалился прежде, чем он тебя заметит. Однако, если ты уже встретился с ним, не беги от него с поспешностью, чтобы не обидеть его. И, если увидишь, что он кого-то осуждает, скажи ему с любовью: «Брат, тебе нужно было бы осуждать меня, окаянного, а не других, которые лучше меня». Берегись, чтобы не обличить его, независимо от того, велик он или мал, потому что это наглость, а также чтобы не укорить его, ибо тогда и Бог погнушается тобой и не только не поможет тебе избавиться от множества твоих недостатков, но заберет Свою благодать и попустит тебе стать еще большим болтуном, чем тот брат. Можешь, если хочешь, не слушать его и непрестанно молиться на протяжении небольшого промежутка времени, когда вынужден будешь терпеть своего брата, чтобы не обидеть его, раз уж он нездоров духовно.'
        cn: 如果你遇到某个饶舌的人（ болтуна），不要避开他，但要说你很匆忙，并怀着爱离开。最好是在他注意到你之前离开。然而，如果你已经遇到他，不要急匆匆地逃离他，以免冒犯他。而且，如果你看到他正在论断某人，要怀着爱告诉他：「弟兄，你应该论断我这可怜的人，而不是论断那些比我好的人。」你要小心，不要指责（обличить）他，无论他是伟大（велик）还是渺小（мал），因为这是傲慢无礼（наглость）；也不要斥责（укорить）他，因为那样上帝也会厌恶你，不仅不会帮助你摆脱你众多的缺点，反而会收回祂的恩典，容许你变得比那位弟兄更加饶舌。如果愿意，你可以不听他说话，并在你不得不忍耐你的弟兄的那一小段时间里，持续地祈祷，以免冒犯他，因为他在属灵上是不健康的。
  - type: heading2
    text:
      ru: Непрестанная молитва и познание самого себя
      cn: 不间断祷告与自我认知
    children:
    - type: paragraph
      text:
        ru: 'Для творения непрестанной молитвы, если хочешь, используй простой способ, если ты сам человек простой и можешь не понять действительный смысл писаний отцов-исихастов «Добротолюбия» и впасть в прелесть. Ибо некоторые, к несчастью, не ставят своей целью совлечение с себя ветхого человека, покаяние, смирение и не пользуются аскезой как вспомогательным средством для освящения души, чтобы глубоко почувствовать свою греховность, ощутить великую нужду в милости Божией и чтобы со сладкой болью произносить: «Господи Иисусе Христе, помилуй мя», но начинают с сухой аскезы и стремятся к божественным наслаждениям и свету, постоянно умножая количество четок и в помыслах представляя себя святыми от математического подсчета прочитанных четок. Они, само собой разумеется, сооружают себе скамейку точно по сантиметрам, и все остальное, то есть склонение головы и дыхание, у них точно такое, о каком пишут святые Каллисты и Григории в «Добротолюбии», тогда как это всего лишь вспомогательные средства. После этого они начинают думать, что находятся уже почти рядом со святыми, и непрерывно молятся по четкам. Как только они начинают верить, что стали святыми, приходит лукавый (враг) и ставит перед ними «телевизор», а затем следуют внушенные врагом пророчества и т.д.'
        cn: 若你渴望进行不间断的祷告，如果你自己是一个平信徒，可能无法理解静修主义教父们《爱善集》中的著述的真正含义，并可能陷入「普列列斯特」（прелесть，即灵性上的自欺与妄想），那么，你可以使用一个简单的方法。因为，不幸的是，有些人并非以脱去旧人、悔改、谦卑为目标，也并非利用苦修作为使灵魂成圣的辅助工具，以便深刻感受自己的罪孽、体会到对上帝恩典的巨大需要，并以甜蜜的痛苦来诵念：「主耶稣基督，求祢怜悯我」；相反，他们从僵硬的苦修开始，渴望神圣的愉悦和光，不断增加念珠的数量，并在意念中凭着数学般计算所念诵的念珠次数，想象自己是圣人。他们，毋庸置疑地，会精确地按照厘米来制作自己的凳子，并且，他们会精确地做到圣卡利斯托斯和圣格里戈里斯在《爱善集》中所描述的一切——即头部倾斜的角度和呼吸方式，而这仅仅是辅助手段。此后，他们开始认为自己已经几乎与圣人并肩，并用念珠不停地祷告。一旦他们开始相信自己已成为圣人，那恶者（仇敌）就会出现，并在他们面前设置一台「电视机」，紧接着是仇敌所灌输的预言等等。
    - type: paragraph
      text:
        ru: 'Поэтому, брат мой, не ищи в своей молитве ничего другого, кроме покаяния: ни света, ни чудес, ни пророчеств – и вообще никаких дарований, но только покаяния. Покаяние принесет тебе смирение, смирение принесет тебе благодать Божию, и Бог вместе со своей благодатью подаст тебе все, что нужно для твоего спасения, и все, что нужно для помощи душам других людей.'
        cn: 因此，我的弟兄，在你的祷告中不要寻求别的东西，除了悔改：不要寻求光、不要寻求神迹、不要寻求预言——总而言之，不要寻求任何恩赐，而只寻求悔改。悔改会带给你谦卑，谦卑会带给你上帝的恩典，而上帝连同祂的恩典会赐予你一切关乎你得救所需之物，以及一切关乎帮助他人灵魂所需之物。
    - type: paragraph
      text:
        ru: Эти вещи очень простые, и нет причин их усложнять. Следуя этому, мы будем ощущать молитву как потребность и будем произносить ее часто, и наше сердце будет ощущать сладостную боль, произнося молитву, и Сам Христос будет источать в нашем сердце Свое сладкое утешение.
        cn: 这些事情都非常简单，没有理由将其复杂化。遵循此点，我们会将祷告感受为一种需求，并会经常诵念祷告，而我们的心会在诵念祷告时感受一种甜美的痛苦，基督自己也会将祂甜美的慰藉倾注在我们的心中。
    - type: paragraph
      text:
        ru: Итак, молитва не утомляет, но снимает утомление; она утомляет только тогда, когда мы не понимаем ее смысла и смысла того, что говорят святые отцы. Когда мы поймем нужду в милости Божией, мы не будем понуждать себя к молитве, но сама эта нужда, как голод, будет принуждать нас к тому, чтобы мы открывали уста и «сосали грудь», подобно младенцу, и чувствовали себя в то же время в полной безопасности, как ребенок, находящийся в объятиях своей матери и радующийся при этом.
        cn: 因此，祷告不会使人疲倦，而是消除疲倦；它（祷告）只有在我们不理解其意义，不理解圣教父们所言之意义时，才会使人疲倦。当我们理解了对上帝怜悯（或：慈悲）的需求时，我们就不会强迫自己去祷告，而是这种需求本身，如同饥饿一样，会迫使我们张开嘴，「吮吸乳房」，如同婴儿一般，同时又感到完全的安全，如同一个在母亲怀抱中并为此而喜悦的孩子。
    - type: paragraph
      text:
        ru: 'Как «радистам», которыми мы, монахи, являемся, нам нужно иметь постоянную связь с Богом и, если это возможно, для большей безопасности находиться в «непрерывном прослушивании», чтобы каждую секунду получать щедро подаваемые божественные силы. Конечно, враг не успокаивается и постоянно нападает различными способами. Однако мы можем его использовать как бесплатного рабочего, чтобы он помогал нам в непрестанной молитве. Когда, например, он принесет нам злые или хульные помыслы, начнем молитву и скажем лукавому: «Хорошо, что ты подтолкнул меня, потому что я забыл моего Христа». Если мы будем поступать таким образом и захотим удержать лукавого, он не останется, потому что не настолько глуп, чтобы работать даром и делать для нашей души добро.'
        cn: 作为「无线电操作员」的我们——这些修士们——需要与上帝保持持续的连接，并且，如果可能，为了更大的安全，要处于「不间断监听」之中，以便每一秒钟都能接收到慷慨赐予的神圣力量。当然，仇敌不会安歇，并不断地以各种方式攻击。然而，我们可以利用他，让他成为一个免费的工人，来帮助我们进行不间断的祈祷。例如，当他给我们带来恶念或亵渎的念头时，我们就开始祈祷，并对那恶者说：「你推了我一把，做得好，因为我差点忘了我的基督。」如果我们这样做，并且想要留住那恶者，他是不会留下来的，因为他还没有愚蠢到白白工作，为我们的灵魂做益处。
    - type: paragraph
      text:
        ru: 'Или, если мы захотим заняться «тонкой работой», возьмем по очереди свои самые сильные страсти и замеченные нами в течение дня грехи и будем просить со смирением милости Божией, чтобы избавиться от них, говоря: «Господи, Иисусе Христе…». Таким образом страсти будут искореняться и одновременно у нас останется добрая привычка к молитве, а не стремление только к внешней привычке молиться, отчего возникают ложное мнение о себе и прелесть.'
        cn: 或者，如果我们要从事「精微的工作」，就轮流审视我们最强烈的激情和我们白天所犯的、已被注意到的罪，并以谦卑之心祈求上帝的怜悯，好让我们摆脱它们，口中说：「主，耶稣基督啊……」 如此，激情（情欲）就会被根除，同时我们也会养成良好的祷告习惯，而不是仅仅追求外在的祷告习惯，后者会产生虚假的自我认知和普雷列斯特（прелесть）。
    - type: paragraph
      text:
        ru: Итак, когда человек предварительно познает самого себя и начинает чувствовать свою великую греховность и великие благодеяния Божии, тогда его сердце приходит в сокрушение, каким бы гранитным оно ни было, и настоящие слезы сами собой льются из глаз, и человек уже не принуждает себя ни к молитве, ни к слезам. Потому что смирение и усердие постоянно сверлят сердце, источники слез увеличиваются, и рука Божия постоянно ласкает усердное чадо, которое трудится без устали.
        cn: 因此，当一个人预先认识自己，并开始感受到自身巨大的罪性和上帝巨大的恩泽时，他的心就会进入痛悔之中，无论它曾经多么坚硬如花岗岩，真正的泪水都会自然而然地涌出眼眶，而人再也不需要强迫自己去祷告或流泪。因为谦卑和热忱不断地穿透他的心，泪水的泉源增多，而上帝的手不断地抚慰着那不倦劳作、热忱的儿女。
    - type: paragraph
      text:
        ru: Когда борешься со своей греховностью и производишь свою «тонкую работу», прежде всего всегда имей надежду на Бога и удерживай ее крепко, чтобы она никогда не оставляла тебя. Те грехи, которые не являются плотскими, можешь тщательно исследовать, чтобы принуждать себя к смирению. Однако плотские грехи не исследуй совсем, просто считай себя грязным бурдюком, полным нечистоты. Не дерзай также творить молитву о людях, имеющих плотские грехи, не только потому, что это является дерзостью, пока ты сам не примирился с Богом, но и потому, что после этого враг будет днем осквернять тебя нечистыми помыслами, а ночью показывать тебе непристойное кино и осквернять тебя.
        cn: 当你与自己的罪性搏斗并进行你的「细微工作」时，首先总是要对上帝怀有希望，并紧紧抓住它，使它永不离弃你。对于那些非属肉体的罪，你可以仔细探究，以便强迫自己谦卑。然而，对于肉体的罪，则完全不要探究，只管认为自己是一个装满污秽的肮脏皮囊。也不要胆敢为有肉体之罪的人们祈祷，这不仅因为在你尚未与上帝和好时这是僭越，而且因为在此之后，仇敌会在白天用不洁的意念玷污你，在夜里给你看下流的电影并玷污你。
    - type: paragraph
      text:
        ru: Если во сне с тобой произойдет нечто подобное, отнюдь не исследуй этого, так же как некоторых обстоятельств в твоей жизни (опять-таки плотской природы), от которых Бог избавил тебя, как цыпленка от когтей ястреба, – потому что это опасно. Часто случается, что враг бросает гранату, чтобы убить солдата, и Бог сохраняет его, не допуская, чтобы произошел взрыв, и солдат спасается, но через некоторое время садится, неразумный, и начинает с любопытством рассматривать гранату, и она, оттого что ее трогают, взрывается и разрывает его на части. То же самое может случиться и с юношей, когда он занимается рассматриванием плотских грехов. Поэтому, когда мы заворачиваем себя в грязный бурдюк, безопасность больше.
        cn: 如果梦中你遇到了类似的事情，千万不要探究它，正如你生命中（同样是肉体性质的）某些情境，上帝像把小鸡从鹰爪下救出一样，使你摆脱了它们，——因为这是危险的。常有这样的事发生：仇敌扔出手榴弹，想杀死士兵，而上帝保全了他，不让爆炸发生，士兵得救了；但过了一会儿，这个愚蠢的士兵坐下来，好奇地察看手榴弹，结果手榴弹因被触碰而爆炸，将他炸得粉碎。同样的事情也可能发生在一个年轻人身上，当他开始检视肉体的罪时。因此，当我们把自己裹在一个肮脏的皮囊里时，安全系数更大。
  - type: heading2
    text:
      ru: Духовное чтение
      cn: 属灵阅读
    children:
    - type: paragraph
      text:
        ru: Читай по возможности жития святых, в которых главное внимание уделяется покаянию, чтобы получить пользу.
        cn: 请尽可能阅读那些以悔改为主要关注点的圣徒传记，以便获得益处。
    - type: paragraph
      text:
        ru: Догматические книги не бери в руки, потому что они не для новоначальных. Однако и позже, если ты необразован, не читай их, потому что как от «Добротолюбия» человек необразованный может впасть в прелесть, поскольку понимает его по-другому, точно так же и догматические книги могут привести его к другой прелести. Из-за прелести от чтения «Добротолюбия» у него возникнет производимое лукавым успокоение вследствие ложного мнения о себе, что он немного ниже (как он думает по своему смирению!) святогоГригория Синаита, а из-за безграмотного толкования догмата он будет считать себя святымМарком Эфесским, тогда как на самом деле будет диким зверем со страшным упрямством.
        cn: 教义书籍不要拿在手中，因为它们不适合初学者。然而，即使是以后，如果你没有受过教育，也不要阅读它们，因为就像没有受过教育的人可能会因误解《爱善集》而陷入妄想（prelest）一样，教义书籍也可能使他陷入另一种妄想。由于阅读《爱善集》所产生的妄想，他会因对自己产生了错误的看法而获得由邪恶者制造的安宁，他认为自己（以他自己的谦卑想法！）只比圣格里戈里奥斯·西奈特低一点，而由于对教义的无知解读，他会认为自己是圣马尔科斯·埃费索斯，而实际上他将是一个具有可怕固执的野兽。
    - type: paragraph
      text:
        ru: Естественно, подходящее чтение тоже является заботой старца, однако я и по этому поводу просто выскажу свое мнение. Вначале нам для освящения себя необходимо прочитывать одну главу из Евангелия, потому что оно изгоняет все злое. Также необходимы святоотеческие книги, чтобы ты смог понять Евангелие, потому что все святоотеческие книги являются ручьями, которые берут начало в Евангелии.
        cn: 当然，合适的阅读也是长老的关切（забота），但我对此也只是表达我的意见。首先，为了圣化我们自己，我们需要诵读一章《福音书》，因为它驱逐一切邪恶。圣教父书籍也是必要的，这样你才能理解《福音书》，因为所有圣教父书籍都是源于《福音书》的溪流。
    - type: paragraph
      text:
        ru: Если мы пойдем вдоль ручья, то найдем источник и не будем блуждать в лощинах, как протестанты. Очень полезны жития святых, ибо в них каждый может найти витамины, которые нужны его душе; хорошо также читать жития святых, память которых празднуется в этот день. Также для каждого монаха необходим святойИоанн Лествичник(в подлиннике)[24], как и «Евергетинос» (или «Отечник»), «Лавсаик», «Луг Духовный», святой Ефрем, «Невидимая брань», «Добротолюбие» (если ты образован), кроме 4-го тома, об умной молитве[25], потому что тут тебе нужно иметь опыт, чтобы понять его, и одного только образования тебе будет недостаточно (может помочь только опытный руководитель, который крайне необходим). Потому что существует опасность, как я уже сказал, спутать свои убогие слезы с многоценными слезами святых отцов и впасть в прелесть; тем более это опасно для чувствительных по характеру.
        cn: 如果我们沿着溪流走，就会找到源头，而不是像新教徒那样在山谷中迷失方向。圣徒生平非常有用，因为每个人都能在其中找到他的灵魂所需的维生素；阅读当天纪念的圣徒的生平也是好的。对于每一位修士而言，圣伊奥阿尼斯·雷斯维奇（原版）[24]也是必需的，正如《恩惠之源》（或《教父言行录》）、《乐园》（或《乐萨伊克》）、《灵性草地》、圣叶夫雷姆、《看不见的争战》、《爱美》（如果你受过教育），但第四卷关于心祷的部分除外[25]，因为在这里你需要有经验才能理解它，仅仅教育是不够的（只有经验丰富的指导者才能帮助你，这是极其必要的）。因为如我已经说过的，存在着一种危险：将自己贫乏的眼泪与圣教父们宝贵的眼泪混淆，并陷入「普雷列斯特」（注：此词指属灵的欺骗或妄想）；对于性情敏感的人来说，这尤其危险。
    - type: paragraph
      text:
        ru: Та же самая опасность, и даже еще большая, подстерегает читающих святогоСимеона Нового Богослова, потому что многие не только слезы, но и божественную любовь святого путают со своими эмоциями, а чистую любовь святого к своему старцу – со своей собственной, эмоциональной, а часто также и нездоровой, полной духовных токсинов, и с трудом это понимают.
        cn: 同样的危险，甚至更大的危险，潜伏在阅读圣西美翁新神学家的人们身上，因为许多人不仅将圣徒的眼泪，还将圣徒的神圣之爱与自己的情感混淆，并将圣徒对其长老的纯洁之爱与他们自己那种情绪化的，且往往也是不健康的、充满属灵毒素的爱混淆，而他们很难理解这一点。
    - type: paragraph
      text:
        ru: Особенно внимательными нужно быть женщинам (по причине их характера) и не читать святого Симеона, если их души не приобрели мужественности. Чтобы их любовь очистилась и чтобы они духовно возмужали, необходимы как помощь старицы, так и их собственные усилия, чтобы они направили весь свой подвиг против изнеженности, производящей эту плесень. Лекарством может служить «закаливание», а также ограничение самыми необходимыми стирками и мытьем, и от закаливания (от телесного страдания, соединенного с разумом и рассуждением) придет двойное здоровье, а от этого здоровья родятся божественные наслаждения.
        cn: 尤其需要格外小心的是妇女（因为她们的性格），如果她们的灵魂没有获得刚毅，就不要阅读圣西默翁的著作。为了使她们的爱得到洁净，为了使她们在灵性上成熟，既需要女长老的帮助，也需要她们自己的努力，好使她们将全部的苦修导向抵制柔弱，因为正是柔弱产生了这种霉菌。药方可以是「磨练」，以及将洗衣和洗浴限制在最必需的范围，而从磨练（来自与理性和辨识力结合的身体痛苦）中将获得双重的健康，从这种健康中将诞生神圣的喜悦。
    - type: paragraph
      text:
        ru: Поэтому, брат мой, без колебаний отсекай все, что становится причиной твоего удаления от Христа, как бы больно тебе ни было. Мы должны знать, что Христос вменит нам это в мученичество, и когда мы страдаем больше, несомненно, нас можно считать великомучениками и исповедниками, потому что мы на деле исповедуем нашу святую веру и храним святые заповеди Христовы.
        cn: 因此，我的弟兄，要毫不犹豫地斩断一切让你远离基督的事物，无论你感到多么痛苦。我们必须知道，基督会将此算作我们的殉道，而当我们受苦更多时，无疑，我们可以被视为伟大的殉道者和宣信者，因为我们以行动宣认我们的圣洁信仰，并遵守基督的圣洁诫命。
    - type: paragraph
      text:
        ru: Помимо того что я упомянул, впоследствии тебе очень поможет авва Исаак, потому что он помогает понять глубочайший смысл жизни и, если человек, верующий в Бога, имеет какой-то большой или маленький комплекс, помогает ему изгнать его. Даже непродолжительное чтение аввы Исаака изменяет душу своими многочисленными «витаминами».
        cn: 除了我所提及的以外，往后阿爸伊萨克会给你带来很大的帮助，因为他帮助人理解生命最深层的意义，并且如果一个信仰上帝的人，有任何或大或小的情结，他能帮助人将其驱除。即使是短暂地阅读阿爸伊萨克，也能以其众多的「维他命」改变灵魂。
    - type: paragraph
      text:
        ru: Правда, что некоторые старцы не рекомендуют авву Исаака, чтобы послушники не ушли от них в пустыню… Однако авва Исаак не советует идти в университет ни ученикам начальной школы, ни тем, кто еще не закончил гимназию[26]. Поэтому старец должен помочь послушникам понять святого, чтобы они получили великую пользу от его богодухновенной книги.
        cn: 诚然，一些长老不建议（阅读）阿巴·伊萨克，以免受训者离开他们去往旷野……然而，阿巴·伊萨克既不建议小学生，也不建议尚未完成文科中学教育的人去上大学[26]。因此，长老应该帮助受训者理解这位圣者，以便他们能从他那本受上帝启示的书中获得巨大的益处。
    - type: paragraph
      text:
        ru: Когда новоначальный обнаруживает такие симптомы (хочет уйти в пустыню), хотя не закончил еще даже духовной гимназии, это показывает, что у него пустая голова. Когда я говорю «пустая», то не имею в виду, что она совершенно пустая, потому что у него в пустой голове есть мысль о своем величии[27]. Поэтому ему нужна помощь, чтобы он увидел ее и выбросил из головы, для того чтобы к нему приблизился Бог и дал ему Свои божественные мысли, ибо одна единственная наша мысль о своем величии не позволяет приблизиться к нам всем божественным мыслям Бога. Однако что делает лукавый враг? Когда, подобно врачу, он обследует новоначального, чтобы найти его больное место, и стучит ему по голове, то, если услышит в пустой голове «тук-тук», делает ему в голову укол, впрыскивает в нее гордость и сводит его с ума. Тогда новоначальный сурово подвизается, однако лишь бьет воздух, а воздух бьет его (1Кор. 9:26).
        cn: 当一个初入信仰的人显露出这样的迹象（想去隐居修道），虽然他甚至都还没完成灵修预备阶段，这表明他头脑空虚。当我说「空虚」时，我指的不是完全空无一物，因为在他空虚的头脑里存有他关于自己伟大的想法[27]。因此，他需要帮助来认清并从头脑中摒弃这个想法，以便上帝能靠近他，赐予他神圣的想法，因为我们关于自己伟大的那一个想法，阻碍了上帝所有的神圣想法靠近我们。然而，那狡猾的仇敌做了什么呢？当他像医生一样检查初入信仰的人，寻找其病灶，敲击他的头时，如果听到空虚的头里发出「笃笃」声，他就会在他的头里注射一剂，将骄傲注入其中，使他发疯。这时，初入信仰的人就严厉地苦修，但他只是击打空气，而空气反击他（哥林多前书 9:26）。
    - type: paragraph
      text:
        ru: Поэтому прежде, чем мы начнем какую бы то ни было духовную работу, нам нужно выбросить на помойку свое самомнение, почувствовав к нему отвращение, потому что иначе все, что бы мы ни делали, мы будем истолковывать с помощью своего «эго-словаря» и превращать в сало своего плотского «я», и своим «толстосвинокожием» будем постоянно увеличивать свою духовную бесчувственность. То есть, когда старец будет делать послушнику строгие замечания за очень большие проступки, послушник будет оставаться бесчувственным, имея помысел, что старец делает замечания для того, чтобы испытать его, поскольку он уже достиг степени святости.
        cn: 因此，在我们开始任何属灵工作之前，我们都需要把自己的自负（самомнение）扔进垃圾桶，并对它感到厌恶，因为否则，我们所做的一切都会被我们用自己的「自我词典」（«эго-словаря»）来解释，并转化为我们肉体「自我」（плотского «я»）的脂肪，而我们的「厚猪皮」（«толстосвинокожием»）将不断增加我们的属灵麻木不仁（бесчувственность）。也就是说，当长老因为极大的过失而对顺服者提出严厉的批评（замечания）时，顺服者将保持麻木不仁，心怀一种意念（помысел），即长老提出批评是为了考验他，因为他已经达到了圣洁的程度。
    - type: paragraph
      text:
        ru: Такого рода «тонкую работу» проделывает бес с теми, о которых я сказал, и они рано или поздно впадают в великое искушение.
        cn: 这种「精微的工作」是魔鬼对那些我所说过的人所做的，他们迟早会落入巨大的试探之中。
    - type: paragraph
      text:
        ru: Итак, нам нужно возгнушаться своим «я» и думать только о своем окаянстве, чтобы сначала примириться с Богом. Лишь после этого к смиренному рабу приходит великая любовь, и эта божественная любовь зажигает в нем огонь его собственной любви (как к Богу, так и к ближнему). Тогда он отдает всего себя другим с мыслью, что он ничто, земля, и радуется оттого, что другие будут приносить на ней плоды.
        cn: 因此，我们必须厌恶自己的「我」（「я」），只思想自己的可怜光景，好首先与上帝和解。唯有在这之后，那伟大的爱才会降临到这谦卑的仆人身上，而这神圣的爱点燃了他自身之爱的火焰（无论是对上帝的爱还是对邻人的爱）。那时，他将自己完全献给他人，心里想着自己不过是虚无、是泥土，并因他人在其上结出果实而欢喜快乐。
    - type: paragraph
      text:
        ru: 'Для этого монаху очень полезно затворяться в своей келлии и не иметь общения с другими людьми, потому что благодаря этому он на всех людей начинает смотреть как на святых. Итак, брат мой, попытайся полюбить свою келлию, и пусть все предметы твоей келлии будут подвижническими: циновка, простая скамейка, доски, мешковина или темная тряпка вместо скатерти, – чтобы и это переносило тебя в Фиваиду и Нитрию и напоминало тебе о ставших невещественными святых отцах. Пусть не будет у тебя кресел, шпона и нейлона, которые постоянно будут похищать твой ум, обращать его к миру и напоминать тебе о многих предметах, после чего помыслы будут осквернять тебя. Очень полезно тебе прочитывать перед молитвой хотя бы небольшой отрывок из «Отечника» в аскетической обстановке твоей келлии, чтобы твое сердце согрелось и благодаря «Отечнику» отступили все заботы, связанные с послушанием, для того чтобы ты мог молиться нерассеянно.'
        cn: 对于此，修士关锁在自己的独修室中，不与其他人交往是极有益处的，因为借此他开始将所有人视作圣者。因此，我的弟兄，尝试去爱你的独修室，并让你独修室中的所有物品都成为苦修性的：草垫、简朴的长凳、木板、粗麻布或深色的布代替桌布，——好让这一切将你带入提拜德（The拜德）和尼特里亚，并使你忆起那些已成为非物质的圣教父们。你不要有扶手椅、饰面胶合板和尼龙，这些会不断窃取你的心智，将它转向世界，并使你忆起许多事物，在此之后意念就会玷污你。在你祈祷前，在你独修室的苦修环境中，阅读哪怕是《教父言行录》的一小段引文，对你是极有益处的，好让你的心温暖起来，并借由《教父言行录》，使所有与顺服相关的挂虑退去，以使你能够专心地祈祷。
  - type: heading2
    text:
      ru: Подвижничество
      cn: 苦修主义
    children:
    - type: paragraph
      text:
        ru: Так как у новоначальных обычно бывает – и должна быть – большая ревность, то, чтобы им сильно не повредить себе чрезмерным и безрассудным подвижничеством, хорошо и по этому поводу дать два совета, ибо часто такие новоначальные уподобляются бурному потоку, который сразу спускает всю свою воду, и после этого в нем не остается ни капли ни для него самого, ни для проходящего путника. Кроме того, засыхает и то, что дерзнуло вырасти на его берегах. Новоначальный может также потерять терпение и начать роптать, если пошатнется его здоровье. Поэтому нужно всегда стремиться к большей духовной выгоде и подвизаться с рассуждением.
        cn: 既然初信者通常拥有——且理应拥有——极大的热忱，那么为了避免他们通过过度和欠缺思虑的苦修而严重损害自己，就这一方面最好给出两条建议。因为这类初信者常常如同湍急的溪流，一下子倾泻了所有的水，之后便滴水不剩，无论是对自己还是对路过的旅人都毫无助益。此外，那些敢于在其岸边生长的植物也会枯萎。如果初信者的健康动摇，他们也可能失去耐心并开始抱怨（रोптать）。因此，必须时刻追求更大的属灵益处，并带着明辨（рассуждение）去苦修。
    - type: paragraph
      text:
        ru: Так как наше тело связано с душой и задача плоти состоит в том, чтобы подчиняться духу и послушно служить ему для приведения души в доброе устроение, то то, что я скажу, будет в некотором смысле врачебным средством и диетой для тела, от которого нам нужна только отчасти его сила, а не его бесчинства. Поэтому уход за осленком (плотью) должен производиться с рассуждением, с подходящим ячменем, чтобы мы могли удержать его в узде и чтобы он не бесчинствовал, не лягался и как-нибудь – упаси Бог! – не сбросил нас в пропасть. И беда в том, что плоть низвергает душу в ад, тогда как осленок своего наездника – самое большое, в пропасть и не вредит душе своего хозяина.
        cn: 既然我们的身体与灵魂相连，而肉体的任务是顺服于精神，并顺从地服事它，以使灵魂达到良善的境地，那么我将要说的，在某种意义上将是身体的药方和饮食（疗法），我们需要的只是它一部分的力量，而不是它的放纵。因此，对这小驴驹（肉体）的照料必须审慎，用适量的大麦，以便我们能用缰绳勒住它，使它不致放纵、不致踢腿，以及——求主保佑！——不致以某种方式把我们摔下深渊。而灾难在于，肉体将灵魂投入地狱，而小驴驹顶多是把它的骑手摔入深渊，并不会伤害其主人的灵魂。
    - type: paragraph
      text:
        ru: 'Однако часто случается следующее: хотя наша плоть и стала как скелет, тем не менее не перестает брыкаться (бесчинствует). Тогда мы, чтобы смирить ее, еще большое ограничиваем себя в пище и удваиваем подвиги, но она, несмотря на это, остается зверем.'
        cn: 然而，常常发生以下情况：尽管我们的肉体变得像个骨架，它却仍然没有停止踢踹（放肆）。这时，我们为了制服它，进一步限制食物，并将苦修加倍，但它对此却毫不理会，仍然保持着野兽的样子。
    - type: paragraph
      text:
        ru: В таком случае с нами происходит то же, что и с тем неразумным крестьянином, который оставляет своего осла голодным и перегружает его, чтобы укротить, поскольку тот постоянно брыкается, в то время как несчастное животное не виновато, но всему виной негодное седло, которое ранит ему спину. То есть хотя у нас часто эгоизм, гордость, осуждение, соединенное с отсутствием любви, являются причиной того, что мы отгоняем благодать Божию и к нам приближается лукавый (враг), чтобы разжечь огонь в наших сухих костях, но мы усиливаем посты и духовные подвиги, поклоны и так далее, чтобы смирить плоть. Однако плоть не смиряется, потому что у нас в душе не хватает смирения и любви.
        cn: '在这种情况下，发生在我们身上的事，与发生在那个不理智的农民身上的事一样。他让他的驴子饿着肚子，又给它过载，目的是驯服它，因为驴子不停地踢蹶，而这可怜的动物并没有错，一切都归咎于那伤了它背部的劣质鞍子。


          也就是说，尽管我们身上常常是自私、骄傲、论断，加上缺乏爱，这些是我们驱赶上帝的恩典、使恶者（仇敌）得以靠近的原因，好在我们的枯骨中点燃火焰，但我们却加强禁食和属灵操练、叩拜等等，来克制肉体。然而，肉体并未被克制，因为我们灵魂中缺少谦卑和爱。'
    - type: paragraph
      text:
        ru: Поэтому в тех случаях, когда к нам приходит плотская брань и мы, немного попостившись и совершив бдение с молитвой, видим, что эта брань продолжается, тогда нужно сделать вывод, что «течет в другом месте»[28]. Немедленно падем ниц пред Христом и прежде всего попросим у Него прощения, а также помолимся, чтобы Он просветил нас и мы узнали свою ошибку и то, какого человека ранили или обидели, чтобы и у него попросить прощения. Как только мы со смирением испросим у Христа прощение, плотское пламя сразу же уходит, а мы запоминаем причину брани, и это помогает нам смиряться еще больше, благодаря чему к нам приходит обильная благодать Божия.
        cn: 因此，在那些肉体争战临到我们，而我们稍微禁食、守夜并祷告之后，却发现这场争战仍在持续的情况下，就必须得出结论：「它从别处流来」[28]。我们应立即俯伏在基督面前，首先恳求祂的宽恕，也祷告求祂光照我们，使我们认识自己的错误，以及我们伤害或冒犯了何人，以便也向那人请求宽恕。一旦我们谦卑地祈求基督的宽恕，肉体的火焰便会立即消退，而我们记住了这场争战的原因，这有助于我们更加谦卑，借此，丰盛的上帝恩典便临到我们。
    - type: paragraph
      text:
        ru: Следовательно, в данном случае являемся причиной мы, а не плоть, ибо мы не сострадали брату, который оступился, и не поставили себя на его место, для того чтобы оказать ему большее сострадание, но строго осудили его. Поэтому Бог и отнял у нас Свою благодать, сработали Его духовные законы, и мы попали в руки лукавого, который помучил нашу плоть и одновременно осквернил нашу душу.
        cn: 因此，在这种情况下，原因在于我们，而不在于肉体，因为我们没有对失足的弟兄怀有同情，也没有将自己置于他的位置，以便对他施以更大的怜悯，而是严厉地论断了他。故此，上帝也收回了祂的恩典，是祂属灵的法则在起作用，我们落入了那恶者的手中，他折磨了我们的肉体，同时玷污了我们的灵魂。
    - type: paragraph
      text:
        ru: Напротив, естественная плотская брань у молодых проходит сразу же благодаря небольшой аскезе, как я уже сказал, потому что Христос умилостивляется над Своими подвизающимися чадами и сразу помогает им, ибо не хочет, чтобы страдало Его создание. Ведь и Сам Он сказал нам об этом в Своем святом Евангелии:«Иго бо Мое благо, и бремя Мое легко есть»(Мф. 11:30). Однако и нам необходимо быть кроткими и смиренными сердцем (См.Мф. 11:29).
        cn: 相反地，年轻人天然的肉体争战会因着微小的苦修而立即消逝，正如我已说过的那样，因为基督会对祂那些竭力修持的儿女施予怜悯，并立即帮助他们，因为祂不愿祂的受造之物受苦。因为祂自己也已经在祂的神圣福音中向我们说了这话：「因为我的轭是容易的，我的担子是轻省的」（马太福音 11:30）。然而，我们也必须心里柔和谦卑（参见马太福音 11:29）。
    - type: paragraph
      text:
        ru: 'Несомненно, у многих молодых возникнет вопрос: «Почему Бог попускает нам терпеть брань от беса блуда, хотя у нас есть и другие страсти (гордость и т.д.) и хотя существуют другие бесы?»'
        cn: 无疑，许多年轻人会产生疑问：「为何上帝容许我们忍受淫邪之魔的争战，尽管我们还有其他的激情（骄傲等等），而且也存在其他的邪魔？」
    - type: paragraph
      text:
        ru: Мне кажется, что так как девство предшествует двум другим нашим обетам – нестяжания и послушания – и так как гордость является наибольшим грехом, а осуждение лишено любви, но мы не хотим этого понять, то юноша за своим духовным состоянием следит обычно только через плоть. Если он будет бесстрастным, то подумает, что у него все в порядке, и может впасть в такую спячку, что не будет замечать других страстей, которые скрываются у него в душе.
        cn: 依我看，鉴于贞洁先于我们另外两项誓愿——不贪财（нестяжания）和顺服（послушания），且鉴于骄傲是最大的罪，而论断缺乏爱，但我们却不愿明白这一点，那么青年人通常只通过肉体来关注自己的属灵状态。如果他能达到无情欲（бесстрастным）的状态，他就会以为自己一切都好，并可能陷入一种沉睡，以至于觉察不到其他隐藏在他灵魂中的情欲（страстей）。
    - type: paragraph
      text:
        ru: Итак, Бог попускает бесу блуда смирять послушника против его воли, и, когда он приобретет смирение, Бог опять приближается к нему. Если сказать коротко, демон блуда через встряску дает юноше понять, что у него не все в порядке.
        cn: 因此，上帝允许淫邪的邪魔（бес блуда）违背顺从者（послушник）的意愿去贬抑他，而当他获得了谦卑时，上帝便再次靠近他。简而言之，淫邪的魔鬼（демон блуда）通过震动使年轻人明白，他并非一切安好。
  - type: heading2
    text:
      ru: Рассудительность в отношении поста
      cn: 关于守斋的明辨（或：慎思、审慎、辨识）
    children:
    - type: paragraph
      text:
        ru: Кроме тех причин неестественной плотской брани, о которых я упомянул, нужно уделить внимание и другим моментам, которые тоже становятся причиной усиления брани, как, например, вопросу питания.
        cn: 除了我所提及的那些非自然肉体争战的原因之外，还需要关注其他一些方面，它们同样会成为争战加剧的原因，例如饮食问题。
    - type: paragraph
      text:
        ru: Прежде всего нужно выбросить сковородку, чтобы она больше не «поджаривала»[29]нашу плоть и чтобы мы не заработали себе язву желудка.
        cn: 首先，我们必须扔掉煎锅，好叫它不再「煎烤」[29]我们的肉体，也叫我们不再给自己招惹来胃溃疡。
    - type: paragraph
      text:
        ru: Все вареное полезно с сырым растительным маслом. Из растительных продуктов нужно избегать горчицы[30], которая производит разжжение плоти.
        cn: 所有煮熟的食物配上生植物油都是有益的。在植物性食物中，必须避免芥末[30]，它会产生肉体的煽动。
    - type: paragraph
      text:
        ru: Если кого-то борет сон, ему следует избегать из растительной пищи латука, большого количества листьев одуванчика, еще в большей степени – мака[31], отрубей пшеницы (остающихся после того, как она будет размолота на хлеб) и чеснока.
        cn: 如果有人受到睡意的困扰，他应该在植物性食物中避免食用莴苣、大量的蒲公英叶，更要避免食用罂粟[31]、小麦麸（在小麦被磨成面包粉后剩下的部分）以及大蒜。
    - type: paragraph
      text:
        ru: Плотскую брань вызывает молоко в консервных банках (особенно когда его употребляют постоянно в сгущенном виде). Полезно натуральное молоко, которое вызывает у нас сон, если мы страдаем бессонницей, подобно тому как липовый отвар вызывает в этом случае сон.
        cn: 对肉体之战（$\pi\lambda o\tau\sigma\kappa\alpha\gamma\quad\beta\rho\alpha\nu$）而言，罐装牛奶会引起它（特别是当人持续饮用炼乳时）。天然牛奶是有益的，如果一个人遭受失眠之苦，天然牛奶会引发睡意，就像椴树（$\lambda\acute{\iota}\pi o\beta o\acute{\iota}$）煎剂在这种情况下会引人入睡一样。
    - type: paragraph
      text:
        ru: Европейский чай (который растет в Китае) прогоняет сон, когда мы хотим совершать бдение, точно так же, как и кофе. Чашечка кофе не только помогает бдению, но оказывает также большую помощь молодым, когда они испытывают естественную плотскую бурю. То есть иногда случается, что внезапно на нас находит плотское облако, ум помрачается, тело расслабляется и т.д. И хотя в таких случаях необходим подвиг, у человека оказываются безоружными и ум, который пребывает как бы опьяненным, и плоть, которая впадает в расслабление и просит сна, еды и так далее (то есть всего противоположного). Итак, в подобных случаях (которым предшествует духовное нерадение) очень помогает чашечка кофе (либо две при необходимости), которая вызывает бодрость и сразу же изгоняет все это плотское опьянение и одновременно сонливость и расслабление, а также чувство голода, и дает человеку все необходимые условия для того, чтобы подвизаться в посте, бдении и молитве с поклонами и в других духовных подвигах, и благодаря этому он получает двойное здравие.
        cn: 欧洲茶（产自中国的）驱散睡意，当我们需要守夜（бдение）时，它和咖啡一样有效。一杯咖啡不仅有助于守夜，对那些经历自然肉体风暴的年轻人也有很大帮助。也就是说，有时会突然有一片肉体的乌云降临到我们身上，心智变得昏暗，身体松弛等等。尽管在这种情况下需要苦修（подвиг），但人却会发现，他的心智变得毫无防备，如同被灌醉了一样，肉体则陷入松弛，要求睡眠、食物等等（即所有相反的东西）。因此，在这种情况下（此前往往是属灵上的疏忽（нерадение）），一杯咖啡（如果需要，也可以两杯）会非常有帮助，它能唤醒精神，并立即驱走所有这种肉体的醉态，同时消除睡意和松弛，以及饥饿感，它为人提供了所有必要的条件，使其能够投入到斋戒、守夜、带着拜功（поклоны）的祷告以及其他属灵的苦修中，并因此获得双重的健康。
    - type: paragraph
      text:
        ru: 'Очень полезен мед, однако он производит сильное разжжение плоти, и молодым лучше избегать большого количества меда, так же как большого количества сливочного масла и сыра. Мед можно есть утром: растворить одну чайную ложку в стакане теплой воды и пить, если хочется хорошего и полезного напитка, который очень помогает пищеварению и при запорах. В этом случае помогают также вареные смоквы, печеный или вареный лук, а больше всего – дикий лук-порей, особенно если мы будем употреблять его с сырым растительным маслом.'
        cn: 蜂蜜非常有益，然而它会极大地激发肉体的欲望，所以年轻人最好避免大量食用蜂蜜，就像应避免大量食用黄油和奶酪一样。蜂蜜可以在早上食用：将一茶匙蜂蜜溶于一杯温水中饮用，如果你想要一种有益且健康的饮品，这种饮品对消化和便秘非常有帮助。在这种情况下，煮熟的无花果、烤熟或煮熟的洋葱也有帮助，而最有帮助的是野韭葱（leek），特别是如果我们将其与生植物油一同食用的话。
    - type: paragraph
      text:
        ru: Сырой лук можно использовать в пищу, пока он свежий. Если он старый, нужно оставить его на холоде, чтобы из него вышла горечь, или подождать, пока он не начнет прорастать. Только тогда он не будет вредить и создавать нарушений в органах пищеварения, которым, если они уже нездоровы, очень вредит даже дождевая вода, особенно натощак.
        cn: 新鲜的生洋葱可以食用。如果它已经不新鲜了，就必须将它放置在冷处，让它的苦味（「 горечь」）散发出来，或者等到它开始发芽。只有这样，它才不会伤害（「 вредить」）并引起消化器官的紊乱（「 нарушений」），而如果这些消化器官本已不健康，那么即使是雨水，特别是空腹饮用时，都会对它们造成极大的伤害（「 вредит」）。
    - type: paragraph
      text:
        ru: За трапезой избегай вина (особенно если ты молод), ибо оно вызывает разжжение и плотскую брань вместе с головокружением, и враг тогда вооружается оружием, которое ты сам ему предоставил.
        cn: 在用膳时要避免饮酒（尤其是如果你年轻），因为酒会引起炽热和肉体争战，同时伴有眩晕，这时仇敌就用你亲自提供给他的武器来武装自己。
    - type: paragraph
      text:
        ru: Если ты человек старый или молодой, но болезненный, употребляй небольшое количество вина, которое немного восполнит твою скудную пищу. Вино очень помогает истощенным старцам и истощенным молодым, страдающим недержанием мочи, и укрепляет их почки. Также вино помогает тем, у которых желудок слабый и не принимает воды (как только они выпьют воды, желудок сразу ее извергает). В таких случаях очень полезно налить в стакан на два сантиметра вина, затем наполнить его водой и пить эту подкрашенную вином воду, потому что нельзя полностью отказаться от воды, ибо она необходима для почек.
        cn: 如果你是年长者或年轻但体弱多病的人，就饮用少量的葡萄酒，它能稍微弥补你贫乏的食物。葡萄酒对精疲力竭的年长者和患有尿失禁（不持尿）的精疲力竭的年轻人非常有帮助，并能强健他们的肾脏。葡萄酒也对那些胃虚弱、不接纳水的人有帮助（他们一喝水，胃就立刻将水吐出）。在这种情况下，将葡萄酒倒入杯中约两厘米高，然后用清水将杯子注满，饮用这种用葡萄酒调色的水是非常有益的，因为你不能完全拒绝水，因为它对肾脏是必需的。
    - type: paragraph
      text:
        ru: В случае задержки мочеиспускания очень эффективна ерука (вид травы), а еще больше верблюжья колючка, которая растет в Синайской пустыне и которую нужно есть сырой или с небольшим количеством растительного масла (простой салат).
        cn: 在排尿延迟（尿潴留）的情况下，石竹（一种草药）非常有效，而骆驼刺则更有效。骆驼刺生长在西奈沙漠，需要生吃或拌少量植物油（制作简单的沙拉）食用。
    - type: paragraph
      text:
        ru: Не полезно пить много воды, особенно вечером, потому что это вызывает вздутие живота и плотскую брань. Кроме того, это вздутие живота препятствует правильному дыханию при непрестанной молитве. Поэтому хорошо избегать всяких солений, которые приносят вред, а также большого количества сладостей, вызывающих жажду, и большого количества орехов, которые вызывают не только жажду, но и брань, и употреблять легкую, простую пищу, чтобы получить помощь для духовного взлета своей молитвы.
        cn: 喝大量的水没有益处，尤其是在晚上，因为它会引起腹胀和肉体的情欲争战。此外，这种腹胀会妨碍在不停的祷告中进行正确的呼吸。因此，最好是避免一切会带来伤害的腌制食品，以及大量会引起口渴的甜食，和大量不仅会引起口渴，还会引起争战的坚果，并且要食用清淡、简单的食物，以获得对自己祷告精神提升的帮助。
    - type: paragraph
      text:
        ru: Насколько это возможно, надо избегать вообще любой жирной пищи и соусов, которые засаливают душу, а также солений и консервов, потому что они вредят не только телу, но и душе разжжением и потом, который выделяется из тела и заставляет человека постоянно мыться, потому что иначе он будет распространять зловоние, как турок, не мазанный святым миром. А с помощью подвижнической жизни человек становится некоторым образом невещественным и, хотя не моется, сияет и благоухает.
        cn: 「尽可能地，必须完全避免任何油腻的食物和酱汁，因为它们使灵魂变得咸涩；也需避免腌制品和罐头，因为它们不仅伤害身体，也通过发炎（ разжжением）和身体排出的汗液来伤害灵魂，这汗液迫使人不断地洗澡，否则他就会像一个没有涂抹圣膏油（святым миром）的土耳其人那样散发恶臭。但藉着苦修（подвижнической）的生活，人某种程度上变得非物质化（невещественным），即使不洗澡，他仍旧散发光芒与馨香。」
    - type: paragraph
      text:
        ru: Однако нам нужно обращать внимание не только на саму пищу, но и на установленные часы ее приема, чтобы это оказывало свою помощь в нашем духовном подвиге, потому что и это имеет большое значение. Лучше утром в три часа по византийскому времени (девять часов по мирскому) обедать, а в десять часов по византийскому (четыре по мирскому) ужинать. Ужин должен быть немного недосоленным, как я уже сказал, чтобы не приходилось пить много воды ни во время еды, ни во время переваривания пищи, потому что это вредно. Можно пить воду по прошествии хотя бы трех часов после еды. Тогда не будет пучить желудок, потому что его сок не будет разбавляться большим количеством воды, и он будет хорошо переваривать пищу, и после еды не будет изжоги.
        cn: 然而，我们不仅需要关注食物本身，也要关注规定好的进食时间，以使这能为我们的属灵操练提供帮助，因为这也具有重大意义。最好是在拜占庭时间上午三点（世俗时间九点）用午餐，在拜占庭时间十点（世俗时间四点）用晚餐。如我已经说过，晚餐应该稍微少放一点盐，以免在进食期间或在消化食物期间需要喝大量的水，因为这是有害的。在饭后至少过了三个小时，才可以喝水。那时，胃就不会鼓胀，因为胃液不会被大量的水稀释，它会很好地消化食物，而且饭后也不会有胃灼热。
    - type: paragraph
      text:
        ru: Хорошо также избегать разнообразия в пище, не только потому, что поступать так прилично монахам, но и потому, что разнообразие всегда производит расстройство пищеварения, так как часто одни продукты не сочетаются с другими.
        cn: 避免食物的多样化也是好的，这不仅因为这样做合宜于修士，还因为多样化总是会造成消化紊乱，因为各种食物之间往往不相搭配。
  - type: heading2
    text:
      ru: Поклоны
      cn: 叩拜
    children:
    - type: paragraph
      text:
        ru: Если есть рано вечером (в четыре часа дня по мирскому времени), то вечером можно с легкостью молиться и даже делать через три-четыре часа после еды земные поклоны – конечно, немного, – но молитву Иисусову и малые поклоны вечером можно творить почти сразу по прочтении повечерия. Обычно большое количество земных поклонов хорошо делать после пробуждения, чтобы разогрелся мотор и наша духовная машина тронулась с места для молитвы.
        cn: 如果傍晚（按照世俗时间是下午四点）进食，那么晚上就可以轻松地祷告，甚至可以在饭后三到四个小时进行拜伏——当然，数量要少——但是耶稣祷文和小的拜伏几乎可以在诵读晚课后立即进行。通常，大量的拜伏最好在醒来后进行，以使「发动机」（motor）预热，我们的属灵机器可以启动，开始祷告。
    - type: paragraph
      text:
        ru: 'Конечно, этого распорядка нужно придерживаться, пребывая в своей келлии. Находясь в гостях, нужно есть все, что предложат: будь то соленое, будь то кислое, будь то консервы или соления. Также не следует применять своего устава к чужим монастырям или домам. Поэтому хорошо пребывать в своей келлии и постоянно исполнять свой устав, который приносит пользу. В таком случае надо делать то, что можно: класть или великие поклоны, или малые и читать молитву. Однако если кто-то поздно поел, то сразу же после еды земных поклонов ему лучше не делать или если делать, то немного и при этом сильно не наклоняться, но лишь преклонять колени, сохраняя прямое положение тела.'
        cn: 当然，人需持守这份作息安排，乃是在自己的隐修室（келлия）里时。若在客舍中，则需吃下一切所提供的：无论是咸的、酸的、罐头还是腌制食物。同样地，也不应将自己的定规（устав）强加于他人的修道院或家中。因此，最好是留在自己的隐修室里，并持续遵行自己那带来益处的定规。在这种情况下，人应该做力所能及的：可以行大拜（великие поклоны）或小拜（малые поклоны），并诵读祷文。然而，如果有人进食过晚，那么饭后最好不要立即行大拜，或者如果要行，也要少行，且不要过度弯曲身体，只屈膝即可，保持身体直立。
    - type: paragraph
      text:
        ru: Поклоны, как я уже сказал, очень помогают после сна, когда мы встаем ночью, а для юношей полезны также перед тем, как лечь вечером в постель, по прошествии четырех часов после еды. Поклоны не только способствуют разогреву нашей духовной машины для молитвы, но доставляют также множество других благ. Прежде всего, с их помощью мы поклоняемся Богу и со смирением испрашиваем Его милости. Второе благо состоит в том, что смиряется необузданная плоть и приходит тишина и бесстрастие плоти. И третье – в том, что они дают нам телесное здравие, удаляя плесень изнеженности, и к человеку приходит двойное здоровье.
        cn: 如我已言，大拜（大叩首）在睡后、当我们夜间起身时非常有益，对于青年人来说，在晚间上床睡觉前，于饭后四小时进行也大有裨益。大拜不仅有助于为我们的属灵机器预热以进行祷告，也带来了诸多其他的益处。首先，借着它们，我们敬拜上帝并谦卑地祈求祂的怜悯。第二个益处是，它能制伏不羁的肉体，使肉体达致静默与无情欲（бесстрастие）。第三个益处是，它们赐予我们身体的健康，除去娇生惯养的霉气，使人获得双重的健康。
    - type: paragraph
      text:
        ru: Те, которые устают от поклонов, могут делать их также в промежутках, понемногу после каждой четки. Такой способ, благодаря разнообразию, доставляет отдых человеку и полезен при молитве.
        cn: 那些因行大拜（поклоны）而疲惫的人，也可以在间歇中行大拜，在每颗念珠（четки）之后做一点点。这种方式，由于其多样性，能使人得到歇息，并在祷告中有所裨益。
  - type: heading2
    text:
      ru: Рассудительность в отношении сна
      cn: 关于睡眠的明辨
    children:
    - type: paragraph
      text:
        ru: Кроме поклонов, которые не нужно делать после еды, потому что это очень вредно, вреден, и даже еще больше поклонов, сон сразу же после еды (особенно молодым, потому что вызывает плотскую брань).
        cn: 除了那些不应在饭后行的、因其非常有害的拜礼（поклонов）之外，饭后立即睡觉也是有害的，甚至比（饭后行）拜礼更甚（尤其是对年轻人，因为它会引起肉体的争战 [плотскую брань]）。
    - type: paragraph
      text:
        ru: 'Молодым очень вредит утренний сон, потому что он вводит в искушение. Еще больше вреда бывает, когда служба заканчивается очень рано и юноша соблазняется: ест и ложится в постель. Даже небольшое количество пищи является в таком случае огнем. Конечно же, я имею в ввиду здоровых юношей, а не болезненных, чья плоть и так уже смирилась болезнью, как плоть старика – старостью.'
        cn: 清晨的睡眠对年轻人非常有害，因为它会引人进入试探。更大的伤害发生在礼拜结束得很早，而年轻人受到引诱：他吃了东西，然后躺在床上。在这种情况下，即使少量的食物也是一把火。当然，我指的是健康的年轻人，而不是那些多病的，他们的肉体已经因疾病而顺服，如同老人的肉体因年老而顺服一样。
    - type: paragraph
      text:
        ru: Молодым лучше засыпать рано вечером, чтобы получить пользу от полезных для сна часов, которые длятся до полуночи[32], а также для того, чтобы избежать помраченного и вводящего в искушение сна после полуночи, ибо четыре часа до полуночи приносят столько пользы, сколько приносят все восемь часов после полуночи.
        cn: 年轻人最好在傍晚早些时候入睡，以便从午夜前持续的、对睡眠有益的时辰中获益[32]，同时也为了避免午夜后昏沉和诱惑性的睡眠，因为午夜前的四个小时带来的益处，抵得上午夜后的所有八个小时带来的益处。
    - type: paragraph
      text:
        ru: Монахи в возрасте, а также те молодые, которые достигли бесстрастия или по природе кротки и которые имеют такую возможность, могут получить духовную пользу от молитвы, которая совершается от заката солнца до полуночи, потому что это хорошие часы, полезные как для молитвы так и для сна (не потому, что существуют хорошие и плохие часы).
        cn: 年长的修士，以及那些已达到「无情欲」（*apatheia*）或本性温和、且有此条件的年轻修士，可以从日落到午夜进行的祈祷中获得属灵的益处，因为这是一段良好的时间，对于祈祷和睡眠都有益处（并非因为存在好或坏的时间）。
    - type: paragraph
      text:
        ru: В любом случае нужно стремиться к большей духовной пользе. А наибольшая духовная польза для юноши, думаю, состоит том, чтобы засыпать рано вечером (если есть влажность, то и сразу после захода солнца) и вставать на молитву в полночь.
        cn: 在任何情况下，都应力求获得更大的属灵益处。而对于一个年轻人来说，我认为最大的属灵益处在于早早入睡（如果天气潮湿，则在日落后立即入睡），并在午夜起身祈祷。
    - type: paragraph
      text:
        ru: Когда стемнеет, перед тем как лечь в постель, необходимо помолиться (хотя бы немного почитать Иисусову молитву), чтобы очистились ум и сердце. Также, пока лежим в постели, нужно постоянно произносить молитву Иисусову, чтобы заснуть с молитвой и чтобы эта молитва продолжалась даже во время сна. Тогда человек чувствует, что молится и во сне, и это действительно так, потому что после пробуждения продолжается неоконченная молитва. Это, конечно, является хорошим знаком и обнаруживает духовную зарю в душе человека.
        cn: 当夜幕降临，在上床睡觉之前，有必要进行祈祷（至少稍微念诵耶稣祷文），以使心智和心灵得以洁净。同样，当我们躺在床上时，需要持续不断地诵念耶稣祷文，以便带着祈祷入睡，并且让这祈祷甚至在睡眠期间也能持续。那时，人会感觉到自己甚至在睡梦中也在祈祷，这确实是事实，因为醒来之后，未完成的祈祷会继续下去。当然，这是一个好兆头，它显露出人灵魂中的属灵晨曦。
    - type: paragraph
      text:
        ru: 'Для достижения такого состояния очень полезно перед тем, как лечь, осенить крестным знамением подушку, скрестить руки, повернуться немного на правый бок и проверить себя, готовы ли мы к иной жизни или нет. Ибо откуда знать: может быть, мы заснем и уже никогда не проснемся, но умрем? Лежа в таком положении с такими мыслями о смерти, хорошо прочитать несколько заупокойных тропарей, а затем постоянно творить молитву Иисусову, потому что все это способствует освящению нашей души.'
        cn: 为了达到这样的状态，非常有益的做法是：在躺下之前，用十字圣号划过枕头，交叉双手，稍微转向右侧，并省察自己，我们是否已为另一种生活（来生）做好了准备。因为我们怎能知道：或许我们睡着了，就永远不会醒来，而是死了呢？以这种姿势躺着，带着对死亡的这些思考，最好诵读几个为亡者祈祷的短颂（тропарей），然后持续诵念耶稣祷文，因为所有这些都有助于我们灵魂的圣化。
    - type: paragraph
      text:
        ru: Однако, когда мы невнимательны и не подвизаемся духовно, но питаем здоровую плоть жирной и обильной пищей (особенно молодые), спим после еды (потому что обилие еды вызывает сонливость), ложимся на мягкую постель без молитвы и позволяем своему уму вращаться в миру и «снимать кино», тогда, естественно, плоть разжигается, а лукавый (враг) начинает крутить перед нами во сне непотребные фильмы, оскверняя нас. Поэтому не нужно сваливать все на диавола, ибо в большинстве случаев мы сами виноваты, поскольку бываем невнимательны.
        cn: 然而，当我们不谨慎且不在灵性上殷勤操练，反而用肥美丰盛的食物喂养健康的肉体（尤其是年轻人），饭后睡觉（因为饮食过量会引起睡意），不作祷告就躺在柔软的床上，并且容许自己的心智在世俗中游荡并「拍电影」时，那么，肉体自然就被点燃了，而那恶者（仇敌）就开始在梦中给我们放映不洁的「电影」，玷污我们。因此，我们不应该把一切都归咎于魔鬼，因为在大多数情况下，我们自己是有过错的，因为我们没有保持谨慎。
  - type: heading2
    text:
      ru: Внимание в духовном подвиге
      cn: 属灵操练中的专注
    children:
    - type: paragraph
      text:
        ru: Таким образом, на протяжении всего дня необходимо внимание, то есть наблюдение за своим умом и за всем тем, о чем я сказал раньше, чтобы не согрешать и ночью, потому что враг то, чего не может сделать с нами днем, пытается сделать во время сна, хотя бы осквернив или возбудив в нас мирскую похоть, несмотря на то, что днем, в состоянии бодрствования, душа не принимала нечистых помыслов. Итак, монах, носящий на себе ангельский образ, не принимает скверных помыслов ни днем, ни ночью, к которой он готовится еще днем, и его жизнь не сравнима с жизнью мирян. Потому что жизнь монаха даже в своем естественном плане проходит в вышеестественных духовных подвигах. Монах проводит эту вышеестественную, ангельскую жизнь, нося плоть, сделавшуюся невещественной. Отсюда видна разница между жизнью монаха и жизнью мирянина. То есть если мирянин возжелает монашеской келлии с ее благоговейной обстановкой, возжелает монашеской жизни и будет ей хоть немного подражать, то, без сомнения, войдет в рай. Однако, если монах хотя бы просто захочет спальни женатых и почувствует хотя бы слабое желание их жизни, то пойдет в ад, если сразу не исповедается, не поплачет и в другой раз не будет внимательным. Когда я говорю «поплачет», имею в виду сердечные слезы, воздыхания, соединенные с сердечным сокрушением, самоукорением и т.д.
        cn: 因此，在整日之中都需要警醒，即对自己的心智以及我先前所说的一切保持观察，以免在夜间犯罪，因为仇敌试图在睡眠期间做白天无法对我们做的事，哪怕只是玷污我们或在我们里面激发世俗的情欲，尽管白天在清醒的状态下，灵魂并未接受不洁的思想。所以，肩负着天使形像的修士，无论是白天还是夜晚，都不会接受污秽的思想；他甚至在白昼就开始为夜晚做准备，而他的生活是平信徒的生活无法比拟的。因为修士的生活，即使在其自然层面，也是在超越自然的属灵苦修中度过的。修士过着这种超越自然的、天使般的生活，他虽然带着肉体，但肉体已变得非物质化。由此可见修士的生活和平信徒的生活之间的差异。也就是说，如果平信徒渴慕修士的隐修室及其虔敬的环境，渴慕修士的生活，并多少加以模仿，那么他毫无疑问将进入天堂。然而，如果修士哪怕仅仅是渴望已婚人士的寝室，并对他们的生活产生哪怕一丝微弱的欲望，那么他就会下地狱，除非他立刻告解，哭泣，并且下一次保持警醒。当我提到「哭泣」时，我指的是发自内心的眼泪、叹息，伴随着心灵的痛悔、自我谴责等等。
    - type: paragraph
      text:
        ru: Поэтому для нас, монахов, особенно необходимо внимание (и «трезвящиеся» отцы иначе называются «внимательными» отцами[33]), и мы должны быть внимательны ко всему, что способствует чистоте.
        cn: 因此，对于我们修士而言，警醒（「醒悟的」教父也被称作「警醒的」教父[33]）是特别必要的，我们必须警醒一切有助于纯洁的事物。
    - type: paragraph
      text:
        ru: Кроме всего остального, очень полезно, чтобы наша кровать была простая, из деревянных досок, а вместо матраца на ней лежало одеяло или что-нибудь потолще – для старых и болезненных молодых, чтобы они не мучались, будучи не в состоянии сомкнуть глаз.
        cn: 除此之外，我们（的床）最好是简单、由木板制成的，而床垫则用毯子或稍微厚实一点的东西代替——对于年迈的和体弱多病（的）年轻人，（这样做是）为了他们不至于因为无法合眼而受折磨。
    - type: paragraph
      text:
        ru: Если кто-то хочет немного поспать, чтобы отдохнуть, а сна нет, тогда нужно выяснить, не пуст ли желудок. И если он совершенно пуст, не повредит один сухарь, и сон сразу же придет.
        cn: 若有人想稍微睡一会儿以作休息，却睡不着，这时需要查明胃是否空着。若胃完全空着，吃一块干面包无妨，睡眠会立刻到来。
    - type: paragraph
      text:
        ru: 'Если человек чувствует какое-то общее беспокойство и невозможно определить, чем оно вызвано, и при этом он не может заснуть, то тогда, если он молодой, пусть немедленно встает и использует это время для исполнения своих духовных обязанностей. Иначе у него сначала возникнет нервное состояние, затем прекратится молитва, а потом лукавый принесет ему скверные помыслы и будет мучить его на кровати, переворачивая с боку на бок и разжигая его плоть. Если же это будет происходить часто, тогда обо всем нужно рассказать старцу: во-первых, чтобы тот выделял ему время для отдыха днем, и, во-вторых, чтобы тот нашел причину, по которой все это происходит, чтобы он исцелился. Если беспокойство вызвано желудком и так далее, тогда очень полезно стать на колени, опереться руками на высокие подушки или на стол и произносить Иисусову молитву, пока не придет сон.'
        cn: 如果一个人感到某种普遍的忧虑不安，却无法确定是由什么引起的，并且在这种情况下他无法入睡，那么，如果他年轻，就应该立刻起身，利用这段时间来履行他的属灵职责。否则，他首先会产生神经紧张的状态，接着祷告会停止，然后那恶者会给他带来污秽的思想，并在床上折磨他，让他翻来覆去，并点燃他的肉体情欲。如果这种情况经常发生，那么应该把一切都告诉长老：第一，为了让长老给他白天休息的时间；第二，为了让长老找出发生这一切的原因，以便他得以痊愈。如果忧虑不安是由胃部或其他原因引起的，那么跪下，将双手撑在高枕头或桌子上，并诵念耶稣祷告，直到睡意降临，是非常有益的。
    - type: paragraph
      text:
        ru: Необходимо наблюдение старца, чтобы новоначальный получал помощь от его опыта, а не шел путем проб и ошибок и из-за этого не страдал.
        cn: 需要一位长老的观察，以便初入者能从他的经验中获得帮助，而不是走上反复试验的道路，并因此遭受痛苦。
  - type: heading2
    text:
      ru: Духовная радость
      cn: 灵性喜乐
    children:
    - type: paragraph
      text:
        ru: Конечно, чтобы иметь преуспеяние в монашеской жизни, необходимо быть умным, мужественным, подвизаться с большой ревностью, дерзновением и великой надеждой на Бога, нужно все лучшее отдать Богу, сильно любить Его и трепетать греха, а не смерти. Нужно радоваться тому, что кожа и кости заключают в себе здравие души, и не печалиться из-за потери килограммов и жира, который полезен только червям.
        cn: 诚然，为了在修道生活中取得成功，必须是明智的、勇敢的，以极大的热忱、坦然无惧和对上帝的巨大希望而奋斗；必须将一切最好的献给上帝，深深地爱他，并战兢于罪，而非死亡。人应当欢喜于皮肤和骨骼包含着灵魂的健康，而不应因体重的减轻和脂肪的失去而忧伤，因为脂肪只对蠕虫有用。
    - type: paragraph
      text:
        ru: Итак, святое подвижничество (с рассуждением) вместе с великим самоотречением, которое рождается от великой веры и сильной любви к Богу, приносит человеку подлинную радость в его жизни, и он радуется тому, что живет, потому что его сердце летает, как на крыльях, славословя благодетеля Бога, а также тому, что умрет, потому что опять пойдет к Богу и там будет продолжать свое славословие.
        cn: 因此，圣洁的苦修（带着明辨/分辨力），以及由对上帝巨大的信心和强烈的爱所产生的巨大舍己/自我否定，为人的生命带来了真实的喜乐，他为自己活着而感到喜乐，因为他的心像插上了翅膀般飞翔，颂扬施恩者上帝；他也为自己将要死去而感到喜乐，因为他将再次回到上帝那里，并在那里继续他的颂赞。
    - type: paragraph
      text:
        ru: Если сказать коротко, он чувствует одинаковую радость как оттого, что живет, так и оттого, что умрет. Без сомнения, в раю будет лучше, потому что в этой жизни он получает от Бога только часть райской радости. Но поскольку и эта радость на земле столь велика, а другой – большей – он еще не знает, то он чувствует совершенную радость. Так и Христос сказал нам:"ЦарствиеНебесноевнутрь вас есть»(Лк. 17:21).
        cn: 如果用一句话概括，他感受到的喜乐是相同的，无论是因着活着，还是因着将要死去。毫无疑问，在天堂会更好，因为在今生他从上帝那里获得的只是天堂喜乐的一部分。但既然这份在世间的喜乐已经如此之大，而另一种——更大的——他尚未知晓，那么他就感受到了完全的喜乐。正如基督也曾对我们说：「上帝的国就在你们里面」（路加福音 17:21）。
    - type: paragraph
      text:
        ru: Конечно, невозможно понять это умом, если человек вместе с плотью не отдаст подвижничеству ради любви Христовой также своего ума и не захочет казаться другим безумным Христа ради и бессильным Христа ради, чтобы получить силу и премудрость Христову от Его распятия. То есть человек начинает понимать это лишь после того, как распнет себя на своем кресте и станет в малой степени невещественным, благодаря подвижничеству, после того, как умрет для мира и воскреснет духовно.
        cn: 当然，要用理智去理解这是不可能的，除非一个人连同肉体，也为了基督的爱而将自己的心智（*ум*）献给苦修（*подвижничество*），并且愿意为了基督的缘故而显得对他人是愚妄的，为了基督的缘故而显得是无力的，这样才能从祂的受难（*распятие*）中获得基督的力量与智慧（*премудрость*）。也就是说，人只有在将自己钉上自己的十字架，并且在苦修的帮助下，在某种程度上变得非物质化（*невещественный*），在对世界死去并灵性地复活之后，才能开始理解这一切。
    - type: paragraph
      text:
        ru: Только монахи, которые переживают это воскресение, могут понять заключенных в аду, которые удалены от Бога (потому что это и есть ад). И поскольку они чувствуют, как те страдают, а себя видят постоянно радующимися, то просят Бога, чтобы Он, если это возможно, заменил ими хотя бы одного страдающего в аду, который не знал Бога ни на земле, ни там, в аду, и постоянно мучится. Вместе с радостью оттого, что они заменят хотя бы одного находящегося в аду, о чем монахи постоянно просят Бога, они испытывают великое веселие, и я думаю, что из-за их великой любви, которая достигает даже ада, эта маленькая часть ада превращается в рай, потому что, где любовь – там и Христос, а где Христос – там радость.
        cn: 只有体验到这种复活的修道士才能理解被囚禁在炼狱（因为这就是炼狱）中那些远离上帝的人。而且，因为他们感受到那些人的痛苦，而自己则持续地喜乐，他们就祈求上帝，如果可能，让他们自己代替炼狱中哪怕是一个受苦的人，这个人无论是在地上还是在那里，在炼狱中，都不认识上帝，并且持续地受煎熬。除了因他们能代替哪怕是一个炼狱中的受苦者而产生的喜乐（修道士们持续地为此祈求上帝）之外，他们也体验到极大的欢欣。我认为，正是因为他们伟大的爱，这爱甚至能达到炼狱，炼狱的这微小部分也就转变成了天堂，因为哪里有爱，哪里就有基督；而哪里有基督，哪里就有喜乐。
    - type: paragraph
      text:
        ru: Монахи молятся не только о живых и умерших, но даже о самых несчастных из всех – о демонах, которые, к несчастью, хотя уже и прошли тысячи лет, постоянно изменяются к худшему и укореняются в своем зле.
        cn: 修士们不仅为活人与死人祷告，甚至也为所有生灵中最不幸者——为恶魔们祷告。不幸的是，恶魔们虽然已经经历了数千年，却持续地朝着更坏的方向改变，并在其邪恶中根深蒂固。
    - type: paragraph
      text:
        ru: 'Когда-то один монах, имевший большое сострадание, упав на колени, просил в своей молитве о следующем: «Ты Бог и, если хочешь, можешь найти способ, чтобы спаслись и эти несчастные демоны, которые, хотя вначале имели столь великую славу, сейчас имеют крайнюю злобу и мирское коварство и, если бы Ты не защищал нас, уничтожили бы всех людей». И вот, как только он, молясь с состраданием, произнес эти слова, видит рядом с собой песью голову, которая высовывает язык и передразнивает его. Мне кажется, Бог попустил это, чтобы монах понял, что Бог готов принять демонов – достаточно им только покаяться, однако они сами не желают своего спасения.'
        cn: 从前，有一位极富怜悯之心的修士，他跪下，在他的祷告中请求以下之事：「您是上帝，如果您愿意，您就能找到一种方法，使这些可怜的恶魔也能得救。虽然它们起初曾拥有如此大的荣耀，但现在却充满了极端的 злоба（恶意/毒恨）和世俗的阴谋诡计（мирское коварство），如果您不保护我们，它们会毁灭所有的人。」 就在他带着怜悯之心说出这些话并祷告时，他看到身边出现了一个狗头，它伸出舌头，嘲弄地模仿（передразнивает）他。在我看来，上帝允许发生此事，是为了让这位修士明白：上帝愿意接纳恶魔——只要它们肯悔改就足够了，然而它们自己却不愿（желают）得救。
    - type: paragraph
      text:
        ru: Из этого случая, кроме великой любви монахов, которую они приобретают от того же рода любви Божией, не имеющей пределов, видна также великая любовь Бога, Который готов спасти даже демонов, несмотря на все бесчисленные преступления, которые ими совершены, – достаточно им лишь покаяться.
        cn: 从这个事例中，除了修道士们从那种毫无界限的属神之爱中所获得的巨大爱心以外，也显明了上帝那伟大的爱。他甚至愿意拯救恶魔，尽管他们犯下了无数的罪行，——只要他们肯悔改。
  - type: heading2
    text:
      ru: Покаяние
      cn: 忏悔
    children:
    - type: paragraph
      text:
        ru: Поэтому ни один грешник никогда не должен отчаиваться – достаточно ему только покаяться. Потому что и грехов у него меньше, чем у диавола, и есть то смягчающее обстоятельство, что он сотворен из земли и по неосторожности поскользнулся и испачкался.
        cn: 因此，任何一个罪人都不应该绝望——只要他悔改就足够了。因为他的罪孽比魔鬼的少，而且还有一个减轻罪责的情形，那就是他由尘土所造，因疏忽而失足跌倒，沾染了污秽。
    - type: paragraph
      text:
        ru: Мы не имеем оправдания, когда не хотим покаяться и исповедаться, но желаем оставаться запачканными. Есть люди, которые, думая, что впадут в тот же грех, не исповедуются, то есть к старой грязи прибавляют еще большую. Хотя, если у них испачкается одежда, они ее стирают и следят, чтобы она не была грязной, и, если на ней опять появляются пятна, счищают их.
        cn: 当我们不愿悔改和告解，却希望继续保持污秽时，我们是无可辩护的。有些人以为自己会再犯同样的罪，所以就不去告解，也就是说，他们在旧的污垢上又添了更大的污垢。然而，如果他们的衣服弄脏了，他们就会去清洗，并注意不让它变脏；如果又出现了污渍，他们就会把它们擦掉。
    - type: paragraph
      text:
        ru: 'Следует знать, что даже самые духовные люди, и те не застрахованы в своей жизни от опасности. Поэтому они постоянно страхуют себя в Боге, имеют надежду лишь на Бога, и перестают надеяться только на свое «я», потому что «я» приносит все духовные несчастья. Поэтому монахи, чтобы преуспеть духовно и оказать другим большую и действенную помощь, никогда не употребляют слово «я» и никогда не говорят: «Мы спасем мир», но тихо молятся, и Бог спасает мир.'
        cn: 必须知道，即使是最属灵的人，在他们的生命中也并非没有危险。因此，他们持续地在上帝内寻求保障，唯独对上帝抱有希望，并停止仅仅寄希望于自己的「我」，因为「我」带来了所有属灵的不幸。因此，修士们为了在灵性上长进，并能给予他人更大且有效的帮助，他们从不使用「我」这个词，也从不讲：「我们将拯救世界」，而是静静地祈祷，而上帝拯救世界。
    - type: paragraph
      text:
        ru: Итак, что следует из всего вышесказанного? Монахи не лентяи, не эгоисты, не неудачники, но по своей воле отказываются от успеха в мирском смысле (по человеческому разумению) и преуспевают духовно.
        cn: 那么，从以上所有内容中可以得出什么？修士们不是懒惰者，不是利己主义者，也不是失败者，而是凭着自己的意愿放弃了世俗意义上的成功（按人的理解），并在精神上取得了成功。
    - type: paragraph
      text:
        ru: Монахи являются добрыми евангельскими юношами, которые, когда Христос призывает их, не прельщаются ни богатством, ни своей молодостью, но жертвуют всем этим и следуют за Христом, неся свой крест, и приобретают таким образом многоценную жемчужину (Мф. 13:46), не связывая себя суетностью обманчивой жизни, ибо они понимают, что рано или поздно все обратится в прах и все мирские счастливцы испустят свою несчастную душу.
        cn: 修士们是良善的福音派青年人，他们当基督呼召时，不为财富所诱惑，也不为自己的青春所诱惑，而是牺牲这一切，跟随基督，背负自己的十字架，并因此获得了那颗极宝贵的珍珠（马太福音 13:46），不让自己被欺骗性生活的虚荣所束缚，因为他们明白，迟早一切都将化为尘土，所有世间的幸福者都将交出他们不幸的灵魂。
    - type: paragraph
      text:
        ru: Благий Бог да просветит нас и да даст всем нам доброе покаяние, чтобы все мы удостоились благаго рая. Аминь.
        cn: 愿良善的上帝光照我们，并赐予我们所有人美好的忏悔，使我们所有人都配得上那良善的天国。阿门。
    - type: paragraph
      text:
        ru: И ныне…
        cn: 以及现在……
    - type: paragraph
      text:
        ru: Единородный Сыне и Слове Божий…[34]
        cn: 独生子、上帝的圣言……[34]
    - type: paragraph
      text:
        ru: С любовью о Христе монах Паисий.
        cn: 在基督里的爱中，修士派西欧斯。
- type: heading1
  text:
    ru: Письмо третьеМаленькое благословение – немного «орешков»
    cn: 第三封信小小的祝福——少许「坚果」
  children:
  - type: paragraph
    text:
      ru: Калива Честнаго Креста, 21 ноября 1975 г.
      cn: 圣十字卡利瓦，1975年11月21日
  - type: paragraph
    text:
      ru: Помощь наша – Введение Пресвятой Богородицы![35]
      cn: 我们的帮助——是至圣上帝之母进堂！[35]
  - type: paragraph
    text:
      ru: '"Слава Тебе, Господи, слава Тебе, Святый, слава Тебе, Царю!"[36]'
      cn: 「荣耀归于您，主啊，荣耀归于您，圣者啊，荣耀归于您，君王啊！」[36]
  - type: paragraph
    text:
      ru: Снова благодарю Благаго Бога, что Он не гнушается мною (Своим сопливым ребенком), но, подобно любящему Отцу, во всякое время подает мне Свои благословения, и особенно в светлые праздничные дни, как, например, сегодня – в праздник Введения Пресвятой Богородицы, который с особым благоговением празднуют те, которые посвятили себя Богу, подражая Божией Матери.
      cn: 我再次感谢良善的上帝，祂不厌弃我（祂流着鼻涕的孩子），而是像慈爱的父亲一样，随时赐予我祂的祝福，尤其是在光明的节日里，比如今天——至圣上帝之母进殿节。那些效法上帝之母、将自己奉献给上帝的人，以特别的敬畏庆祝这个节日。
  - type: paragraph
    text:
      ru: Раз уж мне нечего больше послать, я решил послать это сегодняшнее благословение своим сестрам, потому что братья должны посылать своим сестрам благословения, особенно когда находятся в отъезде. Не имеет значения, велико их благословение или нет, потому что сестры ценят больше братское внимание и заботу, которую ощущают в этом выражении любви. Имея такой помысел, я и сам осмелился послать вам немного духовных орешков.
      cn: 既然我没有别的东西可送，我决定把今日的这份祝福送给我的姐妹们，因为弟兄们理应给他们的姐妹们送去祝福，尤其是在离家外出之时。他们的祝福是丰盛还是微薄并不重要，因为姐妹们更加珍视她们在这份爱的表达中所感受到的弟兄般的关注和关怀。怀着这样的想法，我也敢于给你们寄去一些属灵的小坚果。
  - type: paragraph
    text:
      ru: Конечно, если бы мое духовное состояние было хорошим, то и благословение было бы большим и лучшим, и орехи не имели бы такой толстой скорлупы или большой скорлупы и маленькой сердцевины, какие вы увидите. Некоторые из них, как вы увидите чем-то похожи друг на друга, но тем не менее между ними есть небольшое отличие, как между грецкими и лесными орехами. Но и орехов одного вида, поскольку они мелкие, есть нужно много – опять-таки не для того, чтобы насытиться, ведь благословение посылается не для насыщения.
      cn: 当然，如果我的精神状态良好，那么降福（或：恩福）也会更大更好，而且这些坚果也不会有那么厚的壳，或者像你将看到的，有大壳和小仁。你将看到，其中一些坚果彼此间有些相似之处，但在它们之间仍有细微的差别，就像核桃和榛子（或：榛果）之间的差别一样。但即使是同一种类的坚果，因为它们很小，也需要吃很多——再次声明，这不是为了饱腹，因为降福（或：恩福）的赐予并非为了饱腹。
  - type: paragraph
    text:
      ru: 'Ах, если бы у меня было много орехов и я мог бы их вам послать! Но, к сожалению, находясь на чужбине, я не приобрел духовного преуспеяния, в отличие от других отцов, которые с ревностью и усердием трудились и духовно обогатились. Со мной произошло то, о чем говорит пословица: ленивый в молодости – бедный в старости. Сейчас я, конечно, набрался ума. Но какой в этом прок, когда мои телесные силы уже истощились и я не могу трудиться? Единственное, что у меня осталось, – это надежда на великое благоутробие Божие, и я надеюсь, что по вашим молитвам буду помилован даром.'
      cn: 啊，要是我有很多核桃，可以寄给你们就好了！但不幸的是，身处异乡，我没有获得属灵的进益，这与那些怀着热忱和勤奋劳作并得以属灵富足的其他教父们不同。在我身上发生了那句谚语所说的事情：年少懒惰，年老贫穷。当然，我现在是长了智慧。但这有什么用呢？我的身体力量已经耗尽，无法劳作。我剩下的唯一的东西，就是对上帝伟大怜悯的盼望，我盼望，藉着你们的祷告，我能白白地获得怜恤。
  - type: paragraph
    text:
      ru: От всего сердца желаю вам доброго духовного преуспеяния и доброго просвещения, чтобы вы уже сейчас смогли понять то, что я, к сожалению, понял только в старости.
      cn: 我全心全意地祝愿您获得美好的属灵长进和良好的启迪，好让您现在就能明白我可悲地直到年迈才明白的事情。
  - type: heading2
    text:
      ru: Монашество
      cn: 修道主义
    children:
    - type: paragraph
      text:
        ru: Как я убедился, для того, чтобы соединиться с Богом, нужно сначала освободиться от мира и возлюбить подвижничество ради Бога, чтобы получить благодать и постепенно стать земным ангелом, конечно, подвизаясь со смирением, потому что черные ангелы Люцифера подвизаются больше всех, но что пользы – у них совсем нет смирения.
        cn: 我确信，要与上帝联合，首先必须摆脱世界，并为上帝的缘故而爱慕苦修，以领受恩典，并逐渐成为地上的天使。当然，要在谦卑中苦修，因为路西法的黑暗天使们比任何人都苦修得更多，但这有什么益处呢？他们完全没有谦卑。
    - type: paragraph
      text:
        ru: Перед тем как начать ангельское жительство, человеку нужно хорошо усвоить, что, будучи монахом, он больше поможет себе и миру через молитву и молчаливую проповедь (через пример), даже материально (опять-таки через молитву), простирая руки к небу и собирая облака, чтобы выпал дождь, если наступила засуха, а не простирая руки к богачам, чтобы потом помогать беднякам.
        cn: 在开始天使般的生活（жительство）之前，人需要好好领悟，作为一名修士，他更多地是通过祷告和沉默的宣讲（通过榜样），甚至是以物质的方式（再次，也是通过祷告），来帮助自己和世界——他伸展双手向着天空，聚集云彩，以便在干旱来临时降下雨水，而不是伸展双手向着富人，然后用所得去帮助穷人。
    - type: paragraph
      text:
        ru: И уж конечно не следует терпеть в обители голых туристов, чтобы собирать деньги и затем одевать бедных людей, потому что это уловка лукавого, хотящего отчуждить монаха от благословений Божиих и обмирщить его. Подлинное же удаление монаха от мира ради Христа делает его богатым добродетелями.
        cn: 当然，修道院里也不应容忍赤身裸体的游客，以便募集金钱而后施舍给穷人，因为这是那恶者的诡计，意在使修士远离上帝的祝福，使其世俗化。修士为基督之缘故而真正地远离世界，才会使他拥有丰富的德行。
    - type: paragraph
      text:
        ru: Те, которые по благодати Божией достигли познания суетности этой жизни, получили наибольшее дарование. Для них не является необходимым дар прозорливости, потому что человеку достаточно предвидеть спасение своей души[37]и предпринимать наилучшие духовные меры, чтобы спастись.
        cn: 那些因着上帝的恩典达到了对今世虚妄的认知的人，获得了最大的天赋。对他们来说，预见之恩（дар прозорливости）并非必需，因为人足以预见自己灵魂的救恩[37]并采取最佳的属灵措施，以便得救。
    - type: paragraph
      text:
        ru: Помысел говорит мне, что наибольшим врагом спасения нашей души, даже большим, чем сам диавол, является мирской дух, потому что он сладко влечет нас к себе, но в конце концов приносит нам вечную горечь. А если бы мы увидели самого диавола, то нас охватил бы страх, и мы вынуждены были бы прибегнуть к Богу, обеспечивая себе таким образом рай.
        cn: 一个意念告诉我，我们灵魂救恩最大的仇敌，甚至比魔鬼本身更大的仇敌，是世俗之灵，因为它甜蜜地将我们牵引向它自己，但最终却带给我们永远的苦楚。而如果我们看到了魔鬼本身，我们就会被恐惧所抓住，并且被迫奔向上帝，如此便能确保我们获得天堂。
    - type: paragraph
      text:
        ru: Монахи, которые соревнуются в мирском прогрессе с мирянами, показывают тем самым, что ошиблись в выборе своего пути. Да и сами они могут удостовериться в этом из мирского беспокойства в душе, которое испытывают.
        cn: 那些在世俗进步上与平信徒竞争的修士，借此表明他们在选择自己的道路上犯了错误。他们自己也可以从他们所经历的、内心中的世俗不安中确证这一点。
    - type: paragraph
      text:
        ru: Самым большим беспорядком в монастыре является мирской порядок с военной дисциплиной, которая не только утомляет, особенно современный уставший мир, но и изгоняет святую простоту и расточает все духовные и телесные силы на земное, из-за чего человек забывает Бога. Тогда как мы видим великую простоту Божию, простирающуюся и на Его творение, например на Его небесные фонарики (звезды). С какой простотой Божественная рука рассыпала их, не используя отвеса и уровня, и как люди отдыхают, глядя на них! Тогда как мирские фонари, выстроенные в ряд, очень утомляют.
        cn: 在修道院里，最大的混乱莫过于世俗的秩序，以及军事化的纪律，这不仅使人疲惫，尤其是现代疲惫的世界，而且驱逐了神圣的简朴，并将所有属灵和属肉体的力量浪费在属世之事上，以致人忘记了上帝。然而，我们看到上帝的大简朴，甚至延伸到祂的创造物上，例如祂的天上灯笼（星星）。上帝的手以何等的简朴将它们洒落，没有使用铅垂和水平尺，人们看着它们时又如何安歇！然而，排成一列的世俗灯笼却使人非常疲惫。
    - type: paragraph
      text:
        ru: Поэтому если мы хотим жить по-ангельски, то должны избегать не только мира, но и мирского духа и подвизаться по-святоотечески, чтобы легко совершить духовный взлет. Даже толстые куры – если бы могли удалиться от того места, где копаются в мусоре, от обильной пищи и человеческого порядка в маленьких курятниках и похудели – могли бы летать, как птицы небесные.
        cn: 因此，如果我们想过天使般的生活，就必须避免的不仅是世界，也要避免世俗的灵，并以教父的方式进行苦修，以便轻松地完成灵性上的飞升。即使是肥硕的母鸡，如果能远离它们在垃圾中刨食的地方、远离丰盛的食物和小型鸡舍中的人类秩序并瘦下来，它们也能像天上的飞鸟一样飞翔。
    - type: paragraph
      text:
        ru: Внешнее безмолвие в соединении с рассудительным подвижничеством очень быстро приносит также внутренний покой (мир души), без которого невозможна тонкая духовная работа, потому что насколько удаляется человек от мира, настолько мир удаляется из его души, и тогда мирские помыслы исчезают, ум человека очищается и он становится человеком Божиим.
        cn: 外在的静默，若与审慎的苦修相结合，会非常快地带来内在的平静（灵魂的平安），缺少了内在的平静，精微的属灵工作就不可能进行。因为人远离世界多少，世界就从他的灵魂中远离多少，届时世俗的思虑便会消失，人的心智得到洁净，他就成为属神的人。
    - type: paragraph
      text:
        ru: Очистившийся монах, который, будучи живым, облекается в черный саван (рясу), умирает для мира и через таинство ангельского образа[38]внутренне облекается в покаяние, – совершает этим самое великое в своей жизни чудо, и ему уже не нужно совершать другие чудеса в своей жизни.
        cn: 一个洁净了自己的修士，他在活着的时候披上黑色的殓布（长袍），向世界而死，并通过天使形像的奥秘[38]在内心披上了悔改，——他以此成就了自己生命中最大的奇迹，并且他不再需要在生命中行其他奇迹了。
    - type: paragraph
      text:
        ru: Помысел говорит мне, что большую ценность имеют живые иконы, ставшие ангелами, нежели те, которые пишут лучшие иконописцы. Однако монахи, которые не подвизаются, чтобы стать ангелами, но ложно успокаивают себя только тем, что поменяли место жизни, мирское имя и одежду, хотя не изменись при этом внутренне, похожи на тех несчастных душевнобольных, которые одевают военную форму, офицерскую фуражку, сами вешают себе награды (изображая из себя генералов) и любуются собой, но мирские люди только смеются над ними.
        cn: 一个念头（Помысел）告诉我，那些成为天使的、活生生的圣像比最好的圣像画师所绘制的圣像更有价值。然而，那些没有奋力（подвизаются）成为天使，却只是错误地安慰自己——仅仅是改变了生活地点、世俗名字和衣着，而内心（внутренне）并未改变的修士们，就如同那些可怜的精神病人一样：他们穿上军装，戴上军官帽，自己给自己佩戴勋章（假装自己是将军），并自我陶醉，但世俗的人们只是嘲笑他们。
    - type: paragraph
      text:
        ru: 'Большое воодушевление и небольшой эгоизм простительны новоначальным монахам, если они юны возрастом: так и малые дети радуются своим первым зубам и первым шагам. А взрослым это уже неприлично.'
        cn: 对于初入教的修道士，如果他们年纪尚轻，则巨大的鼓舞和轻微的自私是可被宽恕的：正如幼小的孩童会为他们的第一颗牙齿和第一步而欢喜。但对于成年人而言，这已是不合宜的。
    - type: paragraph
      text:
        ru: Нам не принесет пользы одно лишь хорошее начало, которое мы полагаем, уходя из мира, если мы не закончим хорошо – на небе.
        cn: 我们所定意的那个好开端，即当我们出离世界时，它所带给我们的益处是有限的，除非我们能以美好的方式结束——在天堂。
    - type: paragraph
      text:
        ru: Древние святые отцы были очень внимательны, подвизались с великим самоотречением, уклонялись от мира, воздерживались от всего, очень любили Бога и всякую духовную пищу для спасения своей души и предпочитали пресную вареную пищу для плоти, и таким образом становились святыми. Но в наше время, к сожалению, многие из нас не имеют горячей веры и любви к Богу и поэтому остаются безразличными к подвижничеству, пренебрегают пресной пищей и таким образом постепенно, сами того не замечая, становятся «пресными» отцами[39].
        cn: 古代的圣教父们非常警醒，以极大的自我舍弃（самоотречением）进行苦修，避世，在一切事上保持节制（воздерживались от всего），极其爱慕上帝和一切为拯救灵魂的属灵食粮，他们偏爱清淡的水煮食物来滋养肉体，并因此成为了圣者。但在我们的时代，很遗憾，我们中有许多人没有火热的信仰和对上帝的爱，因此对苦修保持冷漠，忽视清淡的食物，并因此逐渐地、在自己都没有察觉的情况下，成为了「清淡的」（「пресными」）教父[39]。
    - type: paragraph
      text:
        ru: 'Мирские люди усиленно подвизаются на стадионах, стараясь преуспеть в суетном: метают ядра и копья, ногами и головой подбрасывают мяч в воздух и бьют воздух. Напротив, для монахов подвиг имеет большой смысл, потому что с его помощью они стремятся совлечь с себя ветхого человека, борясь одновременно с душевными страстями (через внимание к чувствам, молитву, соединенную со всегдашним смирением и любовью даже к врагам, – то есть способом совершенно противоположным мирскому), побеждают крепких демонов и увенчиваются от Христа. Таким образом они получают рай, а не никчемный мирской кубок.'
        cn: 世俗之人努力在体育场上争竞，试图在虚妄之事上取得成功：他们投掷铅球和标枪，用脚和头将球抛向空中并击打空气。相反，对于修士而言，苦修具有重大的意义，因为借着它，他们力求脱去旧人，同时与灵魂的激情搏斗（通过对感官的留意、与恒常的谦卑和爱甚至爱仇敌相结合的祈祷——即一种与世俗完全相反的方式），战胜强悍的魔鬼，并从基督那里得着冠冕。因此，他们获得的是天堂，而非毫无价值的世俗奖杯。
    - type: paragraph
      text:
        ru: Православное воздержание и вообще духовные упражнения всегда направлены к наивысшей духовной цели – к освящению души. Тогда как другая, мирская, аскеза, как, например, у прельщенных йогов и так далее, направлена на то, чтобы тело сделать гибким, для того чтобы выкручивать себе руки и ноги, как у бумажного карайоза[40], и получать похвалы неразумных людей, а затем издевательства насмешливых демонов.
        cn: 正教的节制和一切属灵操练，总是指向最高的属灵目标——灵魂的成圣。而另一种世俗的苦修，例如受迷惑的瑜伽行者等等（的苦修），则是为了让身体变得灵活，以至于像纸制的卡拉吉奥兹[40]那样扭曲自己的手脚，得到不理智之人的赞扬，随后得到嘲讽的恶魔的讥笑。
    - type: paragraph
      text:
        ru: Подвижничество, совершаемое ради любви Христовой, скрывая в себе стремление к спасению души, которую любит Христос, очень услаждает и покоит своей утомительностью душу, укрепляет тело, а также приносит бесстрастие, потому что благодаря ему смиряются бесчинные движения тела, и тогда оно может обходиться меньшим количеством пищи, ибо этого бывает достаточно, когда в душе мир, а в теле – кротость.
        cn: 为基督之爱所行的苦修（ подвижничество），因其内含着对基督所爱之灵魂的救赎渴望，故而以其疲乏来极大地愉悦并安抚灵魂，坚固身体，亦带来无情欲状态（бесстрастие）。这是因为苦修使身体不规矩的动作（бесчинные движения）变得谦卑，身体便得以只需较少的食物，因为当灵魂处于平安，身体处于温顺时，这一点点就已足够。
    - type: paragraph
      text:
        ru: 'Разнообразие блюд, и особенно жирных, неприлично не только монахам, но и благочестивым мирянам, за исключением, конечно, праздников – ради радости дня, во славу Божию, – или случаев, когда нужно оказать гостеприимство по любви. Речь не идет также о больных, потому что для них пост может быть отменен: им достаточно славить Бога в своих болезнях, чтобы увенчаться, подобно святым мученикам.'
        cn: 多种多样的菜肴，尤其是油腻的，不仅对于修士，而且对于虔诚的平信徒来说，都是不合宜的，当然，例外情况是为了节日的喜乐、为荣耀上帝而设的节日，或因爱心需要款待客人的场合。这里也不涉及病人，因为对他们来说，禁食可以取消：他们只需在疾病中赞美上帝，就能像圣殉道者一样得冠冕。
    - type: paragraph
      text:
        ru: Для здоровых юношей воздержание является самой крепкой уздой против страстей, необходимой для того, чтобы господствовал дух и царил двойной мир. Тогда в чистоте сердца они могут уже чисто смотреть на людей, как ангелы смотрят на ангелов. Те же, которые не воздерживаются и живут необузданно, даже на ангелов смотрят плотски, как жители Содома  (Быт. 19, 5), удалившиеся от Бога. Естественным следствием этого является то, что любящие свою хорошо откормленную плоть и удобства жизни любят людей плотски и их духовно разрушает собственная плоть.
        cn: 对于健康的青年人来说，节制是抵抗情欲的最坚固的缰绳，这是必要的，以使心神（spirit）得以主宰，双重的平安得以统治。那时，他们就能以一颗纯洁的心看待众人，如同天使看天使一般。而那些不节制、生活放纵的人，甚至以肉体的方式看待天使，如同那些远离上帝的所多玛居民一样（创世记 19:5）。由此产生的自然结果是，那些爱自己被喂养得很好的肉体和生活便利的人，也会以肉体的方式爱人，他们自己的肉体在灵性上摧毁了他们。
    - type: paragraph
      text:
        ru: Хотящие, чтобы их плоть была как скелет от подвижничества, тем самым почитают ее, как святые мощи, и любят ее, как доброго друга своей души, а также всех людей любят тогда непорочной любовью как образы Божии, как своих братьев.
        cn: 那些渴望自己的肉体因苦修而如骨架般的人，借此尊崇它，如同圣髑（святые мощи）一般，并爱它，如同自己灵魂的良善朋友；同时，他们也以纯洁的爱（непорочной любовью）去爱所有的人，视他们为上帝的肖像（образы Божии），视为自己的弟兄。
    - type: paragraph
      text:
        ru: Невинный младенец смотрит на все невинно, и все смотрят на него, как на ангелочка, даже если он нагой, потому что он одет божественной благодатью невинности. Взрослые же – если не станут немного невещественными благодаря подвижничеству, чтобы к ним пришла божественная благодать непорочности, – будучи хоть немного обнаженными, сильно соблазняют плотских людей, а духовным людям кажутся очень бесстыдными.
        cn: 一个无辜的婴孩看万物都是无辜的，万物看他都像个小天使，即便他是赤裸的，因为他穿着神圣的无罪之恩典。至于成年人——如果他们不因苦修而变得稍微非物质化一些，以致于神圣的纯洁之恩典临到他们——他们若稍有裸露，就会强烈地诱惑属肉体的人，并在属灵的人看来是极其无耻的。
    - type: paragraph
      text:
        ru: В общении с мирскими людьми нужно быть очень осторожными, никогда не допускать вольности и не позволять им вмешиваться в духовные вопросы, чтобы не повредить себе и им, потому что у них другой Устав и другой канонарх…[41].
        cn: 在与俗世之人交往时，需要非常谨慎，绝不可容许放肆，也不要让他们干涉属灵的问题，以免对自己和他们造成损害，因为他们有不同的规程（Устав）和不同的读经官（канонарх）……[41]。
    - type: paragraph
      text:
        ru: Чистые помыслы очень очищают душу и делают бессильным все оружие блудного беса. Тогда враг не может уже вести брань ни с помощью помыслов, ни через плотское возбуждение, и эта детская невинность предохраняет человека от опасности лучше всего остального, потому что тогда в чистом теле сохраняется чистая душа, а в чистой душе пребывает благодать Божия.
        cn: 纯洁的意念（помыслы）极大地洁净灵魂，并使淫邪之魔（блудного беса）的所有武器失效。那时，仇敌就不能再借助意念，也不能通过肉体上的激动来进行争战。这种孩童般的纯真比其他一切都能更好地保护人免受危险，因为那时，纯洁的灵魂被保存在纯洁的身体里，而上帝的恩典则寓居于纯洁的灵魂之中。
    - type: paragraph
      text:
        ru: Те, которые принимают нечистые помыслы, а также пекутся о плоти, питая ее и покоя, и при этом говорят, что лукавый борется с ними по зависти, клевещут на диавола.
        cn: 那些接受不洁思想，并照顾肉体、喂养它和让它安歇的人，却说那恶者因嫉妒而与他们争战，这是在诽谤魔鬼。
    - type: paragraph
      text:
        ru: Те, которые без уважительной причины пренебрегают своими духовными обязанностями и остаются безразличными к своим мелким грехам, очень скоро рухнут, как деревья, которые вдруг падают от множества червей, а не от топора.
        cn: 那些无故忽略自身属灵职责，并对他们的微小罪过保持漠不关心的人，很快就会垮塌，如同树木突然间因大量虫蛀而非斧头砍伐而倒下一样。
    - type: paragraph
      text:
        ru: В мире нет человека сильнее, чем тот, кто сражается с человекоубийцей[42]и безжалостно бьет свои страсти, отсекая их и духовно освобождаясь от рабства страстей.
        cn: 在世上，没有人比那与杀人者[42]争战、无情地击打自身情欲、将其截断并从情欲的奴役中获得属灵自由的人更刚强。
    - type: paragraph
      text:
        ru: Если человек сурово подвизается, но не может отсечь свои страсти, то обычно это значит, что в нем есть гордость, которая постоянно пускает свои ростки. Иногда страсти не отступают, так как у нас есть предрасположенность к гордости или же Бог испытывает нас, чтобы мы подвизались еще больше, получили большую награду и чтобы благодаря этому утешились малодушные и боязливые, чтобы они стали мужественными, подвизались и не отчаивались, видя, как другие преуспевают, а сами они остаются на месте.
        cn: 如果一个人严苛地修苦行，但却不能断除自己的情欲，那通常意味着他内里有骄傲，这种骄傲不断地长出新芽。有时情欲不退却，是因为我们有倾向于骄傲的倾向，抑或是上帝在试炼我们，好让我们修更多的苦行，获得更大的赏报，并借此使心胸狭隘和胆怯的人得到安慰，让他们变得勇敢，去修苦行，不至于绝望，因为他们看到别人进步，而自己却停滞不前。
    - type: paragraph
      text:
        ru: Часто Благий Бог, чтобы мы не потерпели вреда, не показывает нам наших противников, потому что подвизающийся каждый день вступает в брань со все большим количеством бесов. Насколько сил мы прикладываем к тому, чтобы с корнем вырвать страсть, настолько больше врагов собирается и тащит ее снизу за корни. Тогда, хотя продвижения не видно, оно тем не менее существует и душа преуспевает сильнее, потому что больше смиряется, больше подвизается и понуждает себя прибегать в молитве к Богу. В этом смиренном состоянии разочарования (в себе самом) кроется хорошее духовное состояние.
        cn: 通常，良善的上帝为了不让我们遭受损害，不会向我们展示我们的对头，因为每日争战的人会与数量不断增加的恶魔进行搏斗。我们越是努力从根源上拔除激情（或译：情欲，思虑），越多的仇敌就聚集起来，从下面拉住它的根。这时，尽管进步看不见，但进步确实存在，并且灵魂更加长进，因为她更加谦卑，更加争战，并强迫自己以祷告投靠上帝。在这种谦卑的（对自身）失望状态中，隐藏着良好的属灵状态。
    - type: paragraph
      text:
        ru: В начале духовной жизни Бог из любви не попускает человеку познать свою греховность и множество благодеяний Божиих, для того чтобы он не отчаялся, особенно если он – чувствительное создание Божие. Поэтому не будем отчаиваться, но всегда с надеждой, смирением и ревностью будем подвизаться, и тогда все наши страсти по благодати Божией постепенно уйдут, потому что грозовые тучи не остаются на небе постоянно, но уходят и опять появляется солнце. Надежда и терпение изгоняют зиму с ее холодами и приносят весну с хорошей погодой, которая разогревает землю солнечными лучами и постилает свой зеленый ковер. Не будем ожидать духовной весны, пока не переживем духовной зимы, чтобы умерли все духовные насекомые. Не будем ждать того, чтобы в нас выросло божественное, если сначала не умрет человеческое, то есть пока земля, заросшая мирской травой, не будет духовно перепахана и пока в нее не упадет зерно пшеницы, чтобы произвести настоящие пшеничные стебли, которые приносят обильный плод.
        cn: 在属灵生命的开始阶段，出于爱，上帝不容许一个人认识到他的罪性以及上帝的诸多恩惠，以免他陷入绝望，特别是当他是一个敏感的上帝的受造物时。因此，我们不要绝望，而要常常怀着盼望、谦卑和热忱去奋战（podvizat'sya），这样我们所有的情欲（strasti）都将借着上帝的恩典逐渐消逝，因为雷雨云不会永远停留在天空中，而是会散去，太阳会再次出现。盼望和忍耐（terpenie）驱逐了伴随着寒冷的冬季，带来了伴随着好天气的春天，春天用阳光温暖大地，铺上了它的绿色地毯。我们不要期待属灵的春天，除非我们经历了属灵的冬天，好让所有属灵的昆虫（nasekomye）死去。我们不要期待神圣的事物在我们里面成长，除非属人的部分先死去，也就是说，除非被属世杂草覆盖的土地得到属灵的耕耘，除非一粒麦子落入其中，长出真正的麦秆，带来丰盛的果实。
    - type: paragraph
      text:
        ru: Конечно, плуг земледельца пашет настолько глубоко, насколько позволяет земля. Если послушник неподатливый, он самому себе вредит тем, что мешает земледельцу[43]пахать глубоко. И естественно после этого, что в саду его сердца много пырея. Старец не несет ответственности за это, потому что его ответственность соразмерна послушанию, которое оказывает ему послушник.
        cn: 当然，农夫的犁耙能耕耘多深，取决于土地允许的程度。如果见习修士（послушник）不顺从（неподатливый），他就是伤害自己，因为他阻碍了农夫[43]深耕。此后，他心园中有许多毒麦（пырея）就是很自然的结果。长老对此不负有责任，因为他的责任与见习修士向他所展现的顺服（послушанию）是相称的。
    - type: paragraph
      text:
        ru: Старец является зеркалом послушника. Если послушник не отражает своего сердца в старце, то неизбежно будет осмеян миром за покрывающие его грязные пятна. А уголек для каждения, хотя и весь черный, но когда попадет в руки пономаря и тот его сначала разожжет, чтобы из него вышли дым и сера, а затем положит на него ладан и принесет жертву Богу, – наполняет храм благоуханием.
        cn: 长者是顺从者的镜子。如果顺从者没有把自己的心映照到长者身上，那么他身上所覆盖的污点就不可避免地会被世人嘲笑。而那用于焚香的炭块，虽然通体漆黑，但是当它落入司香平信徒之手，司香平信徒先将它点燃，让烟和硫磺从其中散出，然后放上乳香，献祭于上帝，——它便能以馨香充满圣殿。
    - type: paragraph
      text:
        ru: Юноши, которые не ощущают необходимости послушания, чтобы предохраняться советами старших от искушений, но свободно живут по своей воле, вскоре получают от врага смертельные раны, и он берет их в плен, потому что мирская свобода ведет к духовному рабству.
        cn: 那些不觉得有必要服从、以便借助长者的建议来抵御试探，而是随心所欲自由生活的青年人，很快就会从仇敌那里受到致命的创伤，仇敌会俘虏他们，因为世俗的自由会导向属灵的奴役。
    - type: paragraph
      text:
        ru: Сумевшие отсечь свою волю с большой легкостью рассекают путы страстей и освобождаются от духовной оккупации человекоубийцы. Для монаха следствием следования своей воле бывает прелесть. Мирянин же, который верит своему помыслу, обычно заканчивает в психбольнице.
        cn: 那些能够弃绝自己意志的人，能以极大的轻松斩断激情的枷锁，并从那杀人者的精神占领中获得解放。对于修士而言，顺从自己意志的后果是自欺。而平信徒如果相信自己的思念，通常会以进入精神病院告终。
    - type: paragraph
      text:
        ru: Самого большого успеха лукавый достигает тогда, когда ему удается хотя бы немного испортить помыслы послушника относительно его старца. Тогда новоначальный падает сам, как обрушивается купол, если вынуть из его вершины один кирпич.
        cn: 恶者最大的成功，是在他设法哪怕是稍微破坏了顺服者关于其长老的意念（помыслы）之时达到的。那时，初学者（новоначальный）自己就会跌倒，如同一个圆顶（купол），如果从其顶端取出一块砖，它就会崩塌一样。
    - type: paragraph
      text:
        ru: Те, которые с простотой вверяют себя своему духовному отцу, продвигаются вперед в полной безопасности и не устают (потому что старец несет их на своих плечах) и с радостью достигают рая. Тогда как с послушниками, которые пытаются избежать послушания, случается то же, что с резвыми бычками, которые постоянно дергают за привязь, пока не вытащат кол, и потом как сумасшедшие бегут за ограду, запутываются в кустах и, если кто-нибудь им не поможет – Боже сохрани! – погибают, задушенные ветками.
        cn: 那些以纯朴之心将自己托付于其属灵父亲的人，会完全安全地向前迈进，且不会疲惫（因为这位长者将他们背负在自己的肩上），并怀着喜乐抵达天国（天堂）。然而，那些试图逃避顺服的顺从者（ послушниками ），他们所遭遇的，就像那些活泼的小公牛一样，它们不断拉扯着绳索，直到把木桩拔出，然后像疯了一样跑出围栏，被灌木丛缠住，如果没人帮助他们——上帝保佑！——就会被树枝勒死而灭亡。
    - type: paragraph
      text:
        ru: Новоначальный не должен ни подвизаться по своей воле, но только под наблюдением старца, ни отрываться по своей воле от братии, будучи еще незрелым, чтобы якобы больше подвизаться в пустыне, потому что незрелые смоквы, когда их срезают с дерева, становятся негодными и вместо меда источают молоко, показывая этим, что еще нуждаются в «кормлении грудью». Как младенцы нуждаются, чтобы мать два-три года кормила их своим молоком, чтобы они выросли телесно, так и новоначальный должен «питаться молоком» в обители, где принял постриг, по крайней мере три года, а потом Бог благословит его на отшельничество, если пустыня будет полезна его душе.
        cn: 新入门者不应凭自己的意志修苦行，而只应在一位长老的监督之下；也不应在他尚不成熟时，凭自己的意志离开弟兄们，声称要在旷野中修习更多的苦行。因为不成熟的无花果，当它们被从树上摘下时，就会变得毫无用处，流出的不是蜜而是乳汁，这表明它们仍需要「哺乳」。正如婴孩需要母亲用自己的乳汁喂养两三年才能在身体上成长一样，新入门者也必须在他受剪发礼的修道院中「饮乳」，至少三年。此后，如果旷野对他的灵魂有益，上帝会祝福他去过隐修生活。
    - type: paragraph
      text:
        ru: Новоначальный не должен эгоистически принуждать себя к подвижничеству, потому что не получит духовной пользы, но лишь повредит себе телесно и станет ни на что не годным. Так и незрелая дыня не поспеет оттого, что ее будут много мять, но поспеет в свое время и сама обнаружит свою зрелость ароматом. Те, которые подвизаются эгоистически, с самонадеянностью, мучаются и подрываются на мине самонадеянности. Те же, которые подвизаются со смирением и подчиняются с благоговением, уже в сей жизни вкушают небесный мед, который беспрестанно источается в их сердцах от этого духовного сжатия – благоговения[44](страха Божия).
        cn: 初学者不应自私地强迫自己进行苦修，因为他得不到属灵的益处，只会伤损他的身体，并变得一无是处。就像未熟的甜瓜，不会因为多揉捏而成熟，而会在它自己的时间成熟，并以其芳香来显明自己的成熟。那些自私地、凭着自恃而苦修的人，受尽折磨，并被自恃的地雷所炸毁。而那些凭着谦卑苦修，并以敬畏顺服的人，在今生就尝到了天上的蜜，这蜜因着这种属灵的压制——即敬畏（对上帝的敬畏）——不断地从他们的心中涌出[44]。
    - type: paragraph
      text:
        ru: Послушник вначале должен быть очень внимательным, чтобы не быть нерадивым, но положить доброе начало, потому что если при изготовлении свечи ее фитиль впитает воду, то будет негодным, сколько его ни погружай в расплавленный воск, так как все время будет шипеть. Так и послушник, если не положит доброго начала, постоянно будет роптать, мучиться сам и мучить других.
        cn: 初入修习的修士首先必须非常留心，以免陷于疏忽，而要打下良好的基础；因为若在制作蜡烛时，它的灯芯吸入了水，那么无论将它浸入熔化的蜡中多少次，它都将是无用的，因为它会一直发出嘶嘶声。同理，初入修习的修士若没有打下良好的基础，就会不断地抱怨，折磨自己，也折磨他人。
    - type: paragraph
      text:
        ru: Дерзость является наибольшим врагом послушника, потому что изгоняет благоговение, за чем следует бесчувствие с непокорностью и безразличием вначале к мелким грехам, к которым он привыкает и на которые смотрит уже как на естественные, но при этом в глубине души не имеет покоя, а одну лишь тяжесть. Он даже не может понять, что с ним происходит, потому что его сердце покрыто жиром, и не чувствует своего упрямства. Бесчувственного человека сколько ни бей, у него будет болеть только тело. Тогда как чувствительный и ревностный получает глубокую рану даже от одного слова, чувствует даже самый мелкий свой проступок, часто считает его большим прегрешением и страдает от духовного кровотечения, когда жестокие люди безрассудно пытаются очистить его маленькую ранку своими грубыми ногтями.
        cn: '大胆是顺从者的最大敌人，因为它驱逐了敬畏，随之而来的是麻木不仁与不顺从和冷漠，最初是对微小的罪。他习惯了这些微小的罪，并将其视为理所当然，但同时，在他的内心深处并没有平安，只有沉重。他甚至无法理解自己身上发生了什么，因为他的心被脂肪覆盖，感觉不到自己的固执。


          一个麻木不仁的人，无论你怎样鞭打他，疼痛的只会是身体。然而，一个敏感和热忱的人，即使只是一个词语也会受到深深的伤害，他甚至能感受到自己最小的过错，常常将其视为重大的过犯，并在受到属灵流血之苦时，那些残忍的人会鲁莽地试图用他们粗糙的指甲去清理他微小的伤口。'
    - type: paragraph
      text:
        ru: Послушнику, у которого есть духовные микробы, горячая любовь вначале обычно вредит, тогда как внешне холодное сердце старца дезинфицирует его и вносит в его душу благоговение с помощью этого божественного утеснения внешней холодностью.
        cn: 对于一个有着属灵病菌的初学修士，开始时热烈的爱通常会造成伤害，而长者外表冰冷的心则能为他消毒，并借助这种神圣的、外在冰冷的压制（утеснения），将敬畏带入他的灵魂中。
    - type: paragraph
      text:
        ru: Очень чувствительный и ревностный послушник имеет нужду в большой любви рассудительного старца, чтобы тот притормаживал его ревность и он не повредил бы себе сразу своим подвижничеством. Так и альпинисты постепенно увеличивают время своих переходов, хотя в первые дни у них много энергии, и таким образом поднимаются на высокие вершины, не выбиваясь в первые же дни из сил на половине пути.
        cn: 一位十分敏感而热切的初学修士，需要一位有辨识力的长老的巨大爱心，以便长老可以抑制他的热心，使他不至于立即因苦修而伤害自己。登山者也是如此，他们逐渐增加行进时间，尽管在最初几天他们精力充沛，但他们以这种方式攀登高耸的顶峰，而不至于在最初几天就在半途耗尽体力。
    - type: paragraph
      text:
        ru: Если у старца нет большого опыта, но зато есть большая любовь и великое смирение, он сильно помогает своим духовным чадам с помощью опыта более опытных, с которыми советуется, а также с помощью благодати Божией, которую постоянно получает за свое великое смирение. Однако если человек, не достигший зрелого возраста, начинает набирать себе молодых послушников, то тем самым обнаруживает великую гордость, которая пропитала его до мозга костей, и уподобляется младенцу, который рождается с бородой (уроду), а те, которые следуют за ним, показывают этим повреждение своего ума или сердца.
        cn: 如果这位长老没有丰富的经验，但却拥有伟大的爱和极大的谦卑，他会通过向那些经验更丰富的人征求建议，以及通过他因极大的谦卑而不断获得的上帝的恩典，来大大地帮助他的神（属灵）儿女们。然而，如果一个尚未达到成熟年龄的人开始为自己招募年轻的听命者，那么他此举就暴露了那浸透他骨髓的巨大骄傲，并等同于一个生来就带着胡须的婴儿（畸形），而那些跟随他的人则表明了他们的心智或心灵有所损伤。
    - type: paragraph
      text:
        ru: Те которые не имели возможности жить в подчинении у старца, но имели доброе расположение и внутренне покорный дух, тоже получили великую благодать Божию.
        cn: 那些没有机会在一位长老的顺服下生活，但有良善的倾向和内在顺从的灵的人，也获得了伟大的上帝之恩典。
    - type: paragraph
      text:
        ru: Духовно больны некоторые священники, которые изучают психологию, чтобы помогать душам (человеческим искусством). И удивительно, что их учителя-психологи не верят в Бога и не признают существования души или признают своим особым образом (почти все). Этим подобные священники показывают, что больны духовно и нуждаются в святоотеческом обследовании. Выздоровев, они сами будут различать эту духовную болезнь и одновременно познают благодать Божию, чтобы впредь использовать в отношении страждущих душ действие божественной благодати, а не человеческое искусство.
        cn: 有些神父在灵性上是病态的，他们研究心理学（以人的技艺）来帮助灵魂。令人惊奇的是，他们的心理学老师不相信上帝，不承认灵魂的存在，或者以他们自己的特殊方式（几乎所有人）来承认。这些神父通过此举表明他们在灵性上是病态的，需要教父式的审视。痊愈后，他们自己就能分辨出这种灵性疾病，同时认识到上帝的恩典，以便日后对受苦的灵魂施以神圣恩典的作为，而非人的技艺。
    - type: paragraph
      text:
        ru: Когда человек получает помощь и начинает верить в Бога и будущую жизнь, то есть начинает понимать глубочайший смысл жизни, кается и изменяет свою жизнь, тогда к нему немедленно приходит божественное утешение вместе с благодатью Божией, которая изменяет его и изгоняет всю его дурную наследственность. Так было со многими людьми, которые покаялись, подвизались с ревностью и смирением, получили прощение грехов, стали святыми, и сейчас мы с благоговением почитаем их и просим их молитв, хотя прежде они и имели множество страстей и дурную наследственность.
        cn: 当一个人得到帮助并开始相信上帝和未来的生命，即开始理解生命最深层的意义，悔改并改变自己的生活时，神圣的安慰会立即随同上帝的恩典降临到他身上。这恩典会改变他，驱逐他所有的不良遗传。许多人就是如此，他们悔改，带着热忱与谦卑奋力修行，获得了罪的赦免，成为了圣徒。虽然他们以前有着许多的激情（*激情：指情感或欲望的失序状态，传统神学用语*）和不良遗传，但我们现在仍怀着敬畏之心尊崇他们，并恳求他们的代祷。
    - type: paragraph
      text:
        ru: Например, хотя преподобный Моисей Мурин и был прежде самым кровожадным разбойником с наследственной злобой, однако, как только он уверовал в Бога, покаялся и начал подвизаться, сразу же исчезли все его страсти, его посетила благодать Божия, и он удостоился принять даже дар пророчества. Тонкостью своих духовных чувств он превзошел дажеАрсения Великого, который происходил из знатнейшей аристократической римской семьи, имел наследственные добродетели и большую научную образованность.
        cn: 例如，尽管可敬的莫伊西·穆林（Моисей Мурин）以前是最嗜血的强盗，怀有祖传的 злоба（恶意），然而，他一旦信靠上帝，悔改并开始苦修，他所有的情欲（страсти）就立刻消失了，上帝的恩典（благодать Божия）降临了他，他甚至被授予了接受预言恩赐的资格（дар пророчества）。他以其属灵情感的细腻（Тонкостью своих духовных чувств）超越了阿塞尼·维利基（Арсения Великого），后者出身于最显赫的罗马贵族家庭，拥有祖传的美德和渊博的科学教育（большую научную образованность）。
    - type: paragraph
      text:
        ru: Следовательно, благодать Божия – это все, и душе может помочь только благодатный духовник, имеющий веру, любовь, сострадание к душе, поскольку знает ее великую ценность. Он помогает ей в покаянии, приносит ей облегчение с помощью исповеди, освобождает ее от гнетущей ее тяжести и ведет в рай. Он устраняет помысел, которым лукавый мучает чувствительную душу, и она исцеляется. Нет большей болезни в мире, чем помысел, то есть когда диавол внушает человеку с помощью помыслов, что с ним что-то не так. В таких случаях нет лучшего врача, чем опытный духовник, который своей святостью вызывает к себе доверие и отгоняет все эти помыслы от чувствительных созданий Божиих, исцеляя души и тела без лекарств – одной лишь благодатью Божией – и обеспечивая им рай.
        cn: 因此，上帝的恩典就是一切，唯有拥有信心、爱、对灵魂的怜悯，并深知其巨大价值的具恩典之功的（благодатный）神师，才能帮助灵魂。他通过悔改来帮助它，通过告解来减轻它的痛苦，使它摆脱压抑它的重负，并将它引向天堂。他消除那恶者用来折磨敏感灵魂的「意念」（помысел），使灵魂得以痊愈。世上没有比「意念」更大的疾病了，即魔鬼通过「意念」向人灌输他有问题。在这种情况下，没有比经验丰富的神师更好的医生了，他们以其圣洁赢得信任，并靠着上帝的恩典——而非药物——驱散所有这些「意念」对上帝敏感的受造物的困扰，治愈他们的灵魂和身体，并确保他们得享天堂。
  - type: heading2
    text:
      ru: Любовь
      cn: 爱
    children:
    - type: paragraph
      text:
        ru: Духовная любовь выше, чем та, которую имеют братья по плоти, потому что делает людей родственниками по Христу, а не по матери. Те, которые имеют такую чистую (благородную) любовь, исполнены доброты, потому что в них пребывает Христос и в их лицах отображается Божество. Конечно, Христова любовь не может войти в нас, если прежде мы не исключим из своей любви самих себя, не отдадим ее полностью Богу и Его образам[45]и если не будем всегда отдавать себя другим, не желая при этом, чтобы другие отдавали себя нам.
        cn: 属灵的爱比肉身兄弟姊妹之间的爱更高，因为它使人因基督而非母亲成为亲属。拥有这种纯净（高尚）之爱的人，充满良善，因为基督居于他们之内，且在他们的面容上映照出神性。当然，基督的爱无法进入我们里面，除非我们首先将自己从爱中排除，不将爱完全献给上帝和祂的形像[45]，并且除非我们总是将自己给予他人，而不同时期望他人将自己给予我们。
    - type: paragraph
      text:
        ru: Те которые сильно болезнуют о спасении всего мира, помогают ему по-своему (подвизаясь) и со смирением вверяют себя в руки Божии, чувствуют величайшую в мире радость, и жизнь их становится непрестанным славословием, потому что их душа летает, как на крыльях, подобно ангелам, день и ночь славословя Бога. Тогда как те, которые безразличны к спасению своей души и пытаются найти радость и покой в этой суетной жизни, постоянно мучаются, запутываются в бесконечных мирских шестеренках и уже здесь переживают адские мучения.
        cn: 那些极其挂念整个世界救赎的人，以他们自己的方式帮助世界（通过苦修），并谦卑地将自己交托在上帝手中，他们感受到世间至大的喜乐，他们的生命变成了一种不间断的颂赞，因为他们的灵魂像生了翅膀一样飞翔，如同天使，日夜颂赞上帝。然而，那些对自身灵魂的救赎漠不关心，并试图在这虚妄的生命中寻找喜乐与安宁的人，却持续受折磨，陷入无尽的世俗齿轮中，并已在此处经历地狱的苦难。
    - type: paragraph
      text:
        ru: Ревностные люди, пребывающие в небесном славословии, с радостью принимают испытания и прославляют за них Бога так же, как и за благословения. Они постоянно получают благословения Божии и потому внутренне тают от благодарности к Богу, выражая ее всеми возможными способами духовно, как чада Божии.
        cn: 在天上赞颂中常存的热心人们，欢喜地接受考验，并为此赞美上帝，就像为所领受的祝福赞美祂一样。他们不断地领受上帝的祝福，因此内心因对上帝的感恩而融化（「taut」），并以一切可能的方式，在属灵上，作为上帝的儿女，表达这份感谢。
    - type: paragraph
      text:
        ru: 'Благий Бог подает нам обильные благословения и всегда все делает для нашего блага. Он создал весь мир, чтобы тот служил и приносил себя в жертву человеку: от растений до животных и птиц, от малого до великого. Даже Сам Бог принес Себя в жертву, чтобы спасти человека. Однако многие из нас, к несчастью, остаются безразличными ко всем благодеяниям Божиим и ранят Его своей великой неблагодарностью и бесчувствием, хотя Он и дал нам вместе со всеми прочими Своими благами наследственную совесть.'
        cn: 良善的上帝（Бог）赐予我们丰盛的祝福，并且始终为着我们的益处而行一切事。祂创造了整个世界，使世界服事并献身于人：从植物到动物和飞禽，从微小到宏大。甚至上帝自己也献上了自己，以拯救人。然而，不幸的是，我们中的许多人对上帝一切的 благодеяния（善行/恩惠）仍然漠不关心，并以我们极大的不感恩和麻木不仁来伤害祂，尽管祂赐予了我们连同所有其他 благо（美好事物/福益）一起的 наследственная совесть（遗传良知）。
    - type: paragraph
      text:
        ru: Совесть является первым законом Божиим, который он начертал глубоко в сердце первозданных людей и который впоследствии каждый из нас, рождаясь, получает от своих родителей, как ксерокопию. Те, которые утончают свою совесть через ежедневное исследование самих себя, уже чувствуют себя чужими этому миру, и мирским людям их утонченное поведение кажется странным. Однако те, которые не исследуют своей совести, не получают пользы ни от духовного чтения, ни от советов старцев. Они не могут соблюдать и заповедей Божиих, потому что становятся уже бесчувственными.
        cn: 良知是上帝的第一条法律，他将其铭刻在最初被造之人的内心深处，而我们每个人在出生时都从父母那里获得了它的「影印本」。那些通过每日省察自己来磨砺（或译：「使之精微」）良知的人，已经感觉自己与这个世界格格不入，他们的精微行为在世俗之人看来是怪异的。然而，那些不省察自己良知的人，无法从属灵阅读或长老的建议中获益。他们也无法遵守上帝的诫命，因为他们已经变得麻木不仁。
    - type: paragraph
      text:
        ru: Чувствительные и ревностные люди, соблюдающие все с точностью, обычно испытывают несправедливое отношение со стороны бесчувственных, постоянно уступая им из любви, однако любовь Божия всегда пребывает с ними. Часто от своей большой чувствительности они сами себя мучают, преувеличивая свои небольшие прегрешения или беря на себя чужие ошибки. Однако Бог опять услаждает их Своей райской добротой и духовно укрепляет их.
        cn: 敏感且热忱的人，那些严格遵守一切（事物）的人，通常会遭受无情之人的不公正对待，他们不断地出于爱而让步于后者，然而上帝的爱总与他们同在。他们常因自己的高度敏感而折磨自己，夸大自己微小的过失，或承担别人的错误。然而，上帝再次以祂属天堂的（『天堂的』对应 『райской』，但『天堂的』在中文语境中更贴合）良善使他们甜蜜，并在灵性上坚固他们。
    - type: paragraph
      text:
        ru: Те, которые ранят или обижают чувствительных людей, внутренне не являются людьми.
        cn: 那些伤害或冒犯敏感之人的人，在内在并非人。
    - type: paragraph
      text:
        ru: 'Называющие себя чувствительными и утверждающие, что имеют любовь и деликатность и терпят несправедливости со стороны других людей, но при этом говорящие: «Пусть им Бог воздаст», подвергаются осмеянию от лукавого, сами того не понимая, потому что таким образом проклинают с вежливостью. В этой жизни все люди сдают экзамены, чтобы попасть в иную жизнь, вечную, – чтобы попасть в рай. Помысел говорит мне, что это вежливое проклятие ниже духовного проходного бала.'
        cn: 那些自称敏感，并声称拥有爱心和细腻、能忍受他人的不公，但同时却说：「愿上帝报应他们」的人，在自己不明白的情况下，正遭受着那恶者的嘲笑，因为他们是以这种有礼貌的方式在诅咒。 在此生中，所有人都正在经历考试，以便进入另一个永恒的生命——进入天堂。一个意念告诉我，这种有礼貌的诅咒低于属灵的及格分数。
    - type: paragraph
      text:
        ru: Кто обижает других, тот навеки обижает самого себя, а кто с радостью принимает обиды, которые ему причиняют, заслуживает вечного воздаяния с избытком.
        cn: 凡是冒犯（或：伤害）他人者，他就是永远地冒犯（或：伤害）了他自己；而凡是带着喜乐接受他人加诸其身的冒犯（或：伤害）者，他配得永远丰盛的报偿。
    - type: paragraph
      text:
        ru: Часто Благий Бог отдает добрых людей в руки злых, чтобы они отдали им свою доброту и заслужили небесную награду.
        cn: 通常，良善的上帝（Благий Бог）会将良善的人交付到邪恶人的手中，为的是叫他们将自己的良善赐予那些邪恶的人，并因此赢得天上的奖赏。
    - type: paragraph
      text:
        ru: Каждый человек получит плату от того хозяина, на которого работал. Тот, кто работает для Христа, получит"сторицею"здесь и«живот вечный»(Мк. 10:30), а кто работает на черного хозяина, тому он делает жизнь черной еще здесь.
        cn: 每个人都将从他所侍奉的主人那里获得工价。那为基督工作的人，将「百倍」获得今世的赏赐和「永生」（马可福音 10:30），而那为黑暗的主人工作的人，他甚至在此世就使他的生命变得黑暗。
    - type: paragraph
      text:
        ru: 'Те, которые работают для Христа, но с гордостью, портят свои добродетели, подобно тому как портится яичница, когда в нее попадет помет: тогда она годится только на то, чтобы ее выбросили вместе со сковородой.'
        cn: 那些为基督工作，但怀着骄傲的人，会败坏自己的美德，就像煎蛋卷里落进了粪便：那时，它只配连同煎锅一起被扔掉。
    - type: paragraph
      text:
        ru: Те же, которые смиренно трудятся, приобретают добродетели и смиренно, по любви, расточают свой тайный жизненный опыт, являются самыми большими благодетелями, потому что подают духовную милостыню и очень помогают душам немощным и изнемогшим в вере. Те же, которые сами бросаются в мир ради любви, выбросив перед этим все мирское из своей души, летают в небе и мир не владеет ими.
        cn: 那些谦卑地劳作、获得美德、并谦卑地出于爱心散播自己隐秘的生命经验的人，是最大的施惠者（благодетелями），因为他们施予属灵的怜悯（милостыню），并极大地帮助那些软弱（немощным）和在信仰上筋疲力尽（изнемогшим）的灵魂。而那些为了爱，将自己投入世界，但在此之前已将所有世俗之物从自己的灵魂中抛弃的人，他们翱翔于天际，世界无法拥有他们（мир не владеет ими）。
    - type: paragraph
      text:
        ru: Любовь в соединении с внешней нестяжательностью способствует приобретению внутренней нестяжательности – нестяжательности в отношении страстей. Оба эти вида нестяжательности делают человека богатым добротой Божией.
        cn: 爱与外在的弃绝财物相结合，有助于获得内在的弃绝财物——即对诸情欲的弃绝财物。这两种弃绝财物都使人富足于上帝的良善。
    - type: paragraph
      text:
        ru: Добрые люди, конечно, не держат в своем сердце зла, но также и доброту свою они не держат для самих себя. Поэтому у них нет красивых вещей и их не волнует мирская красота. Таким образом они являют свою горячую веру в Бога и свою великую любовь.
        cn: 心地善良的人，当然不会在他们心中存留邪恶，但他们的良善也不会为他们自己保留。因此，他们没有华美之物，世俗的美丽也不会使他们烦心。如此，他们便彰显出他们对上帝炽热的信仰和伟大的爱。
    - type: paragraph
      text:
        ru: Нет никого умнее человека милостивого, который дает земные, тленные, вещи и покупает нетленные, небесные. Точно так же нет никого неразумнее лихоимца, который постоянно собирает и постоянно лишается, пока, наконец, на все собранное им состояние не покупает себе ада. Те, которые теряют себя ради материальных предметов, совершенно потеряли рассудок, потому что теряют Христа.
        cn: 没有人比施怜悯的人更聪明，他付出地上的、会朽坏的事物，却买来不会朽坏的、天上的事物。同样，没有人比贪婪的人更不理智，他不断地聚敛，又不断地失去，直到最后，他用自己所聚敛的全部财产买来了地狱。那些为了物质对象而丧失自我的人，完全失去了理智，因为他们失去了基督。
    - type: paragraph
      text:
        ru: Кем обладают материальные предметы, тем всегда обладают смущение и душевное беспокойство, потому что иногда он боится, чтобы у него не забрали его вещей, а иногда – чтобы у него не взяли души.
        cn: 那些拥有物质财物的人，总是拥有困惑和心灵不安，因为他有时害怕自己的财物不被夺走，有时又害怕自己的灵魂不被取走。
    - type: paragraph
      text:
        ru: Скупой, повредивший свои руки сжиманием богатства, сжал также свое сердце и сделал его каменным. Чтобы исцелиться, ему нужно посетить несчастных людей, почувствовать сострадание к ним, и тогда он будет вынужден постепенно разжать свои руки, а его каменное сердце смягчится и станет человеческим, и так для него отверзутся врата рая.
        cn: 吝啬者，因紧握财富而损伤了双手，也紧紧地攥住了自己的心，使之心如顽石。要得医治，他需要去探访不幸的人们，感受对他们的怜悯，如此他将被迫逐渐松开他的双手，而他那颗石头般的心也将软化，变成一颗人（的心），如此，天堂之门将为他敞开。
    - type: paragraph
      text:
        ru: Доброта смягчает и открывает сердце, как масло – заржавевший замок.
        cn: 仁慈软化并开启人心，如同油脂之于锈锁。
    - type: paragraph
      text:
        ru: Приближающиеся к страдающим тем самым естественным образом приближаются к Богу, потому что Бог всегда пребывает возле Своих страдающих чад.
        cn: 那些接近受苦之人的人，以这种方式自然地接近上帝，因为上帝总是居于祂受苦的儿女身边。
    - type: paragraph
      text:
        ru: Бог духовно укрепляет и освобождает от крестов (испытаний) Своих усердных чад, которые помогают поднимать кресты своим собратьям.
        cn: 上主以灵性力量坚固并释放祂那些热忱的孩子们，使其脱离十字架（考验），而这些孩子们则帮助他们的弟兄姐妹们举起各自的十字架。
    - type: paragraph
      text:
        ru: Размышляющие о великих крестах, которые несли праведники, никогда не унывают из-за своих небольших испытаний, понимая, что хотя и оступались в своей жизни больше, чем праведники, однако страдают меньше, чем они.
        cn: 默想义人所背负的巨大十字架的人，绝不会因自己微小的试炼而灰心，他们明白，尽管自己在生命中的跌倒比义人更多，但所受的苦却比他们更少。
    - type: paragraph
      text:
        ru: Страдающие без вины уподобляются Христу. Также блаженны страдающие за свои грехи, потому что они расплачиваются за них в этой жизни.
        cn: 无辜受苦者，与基督相似。那些因自己的罪孽而受苦的人，也是有福的，因为他们是在今生为自己的罪付出代价。
    - type: paragraph
      text:
        ru: Не сострадающие страждущим страдают смертельной духовной болезнью – немилосердием. Те, которые раздражаются из-за стонов больных и ропщут, так как не могут из-за них сосредоточиться, страдают от множества духовных болезней.
        cn: 不怜悯受苦之人的，患上了致命的属灵疾病——不仁慈。那些因着病患的呻吟而烦躁不安、抱怨不止，因为无法因此集中精神的人，正受着众多属灵疾病的困扰。
    - type: paragraph
      text:
        ru: Истинно любящие и правильно подвизающиеся переносят с любовью, жертвуют собой, лишают себя всего ради своего ближнего и покоят его, потому что он есть Христос.
        cn: 真诚爱慕并正确奋斗的人，带着爱心忍受，牺牲自己，为了他们的邻人而剥夺自己的一切，并使邻人得到安息，因为他就是基督。
    - type: paragraph
      text:
        ru: Те которые всегда желают, чтобы другие отдавали себя им, а сами ничего не дают другим и постоянно просят у Бога, не отдавая Ему даже своих грехов (через покаяние), совершенно отчуждаются от Бога и сами себя предают в руки человекоубийцы. Поскольку они возделали любовь к самим себе, то естественно, что в душе их выросло великое беспокойство и они испытывают адские муки уже в этой жизни.
        cn: 那些总是渴望他人将自己献给他们，而自己却不给予他人任何东西，并不断向上帝祈求，甚至不（通过悔改）将自己的罪孽献给祂的人，他们完全与上帝疏远，并将自己交到杀人犯（即魔鬼）手中。因为他们培养了对自己的爱，所以他们的灵魂中自然滋生了极大的不安，他们在这辈子就已经体验到地狱的痛苦了。
    - type: paragraph
      text:
        ru: Тех, которые не становятся на место своих страждущих собратьев, оставляет Бог, и тогда они падают, получают ушибы и таким образом учатся сострадать. Тогда как те, которые постоянно сострадают и проявляют участие к другим, оставаясь безразличными к самим себе, получают помощь от Бога, и о них заботятся и Бог, и люди.
        cn: 对于那些不肯站到受苦弟兄位置上的人，上帝会离弃他们，那时他们就会跌倒、受伤，并因此学会同情。而那些持续地同情并关怀他人，对自己保持漠不关心的人，则会得到上帝的帮助，并受到上帝与人的照管。
    - type: paragraph
      text:
        ru: Когда человек отдает свое сердце Богу, тогда и ум его пленяется любовью Божией, так что он становится безразличным ко всему мирскому, постоянно думая о Небесном Отце. Охваченный божественной любовью, он день и ночь, как ангел, славословит своего Творца.
        cn: 当一个人把自己的心献给上帝时，他的心思亦被上帝的爱所俘虏，以至于他对于一切世俗之物都变得漠不关心，持续思念着天父。他被神圣的爱所攫住，日夜不息，如天使般颂赞他的造物主。
    - type: paragraph
      text:
        ru: Одних лишь благодеяний Божиих, если поразмыслить о них, достаточно, чтобы возбудить ревностное сердце. Тем более, если человек помыслит также о множестве своих грехов и великом милосердии Божием!
        cn: 单单是上帝的仁慈作为，如果对其深思，就足以唤醒一颗热忱的心。更何况，如果一个人也思及自己罪孽的众多和上帝伟大的怜悯！
    - type: paragraph
      text:
        ru: Подвизающиеся и чувствующие свою греховность и благодеяния Божии, а также вверяющие себя великому Его благоутробию с большой безопасностью и меньшим телесным трудом возводят свою душу в рай, если имеют благое произволение.
        cn: 那些力行苦修、感受自身罪孽和上帝的恩惠、并将自己交托给祂伟大的慈悲的人，如果他们怀有良善的意愿，就能以极大的稳妥和较少的身体劳苦，将自己的灵魂提升至天堂。
    - type: paragraph
      text:
        ru: Подвизающиеся много, с большим благоговением, достигшие некоторым образом ангельского состояния и питающиеся уже райским медом, все равно не приносят Богу ничего значительного в сравнении тем, что Он принес нам. Потому что сами они едят мед, а Ему приносят воск. Сами едят сладкие плоды, а Богу в кадиле приносят смолу деревьев. Следовательно, мы ничего не делаем и ничего не приносим Богу в сравнении с Его великими благодеяниями к нам. Хотя Бог создает для нас из наших помоев и даже из навоза прекрасные плоды и мы питаемся ими, однако мы, окаянные люди, превращаем потом эти прекрасные плоды в навоз!
        cn: 那些努力修行的人，怀着极大的敬畏，在某种程度上达到了天使的状态，并已以乐园的蜂蜜为食，即便如此，他们所献给上帝的，与祂为我们所做的相比，仍然微不足道。因为他们自己享用蜂蜜，献给祂的却是蜂蜡。他们自己享用甜美的果实，献给上帝的香炉中的却是树脂。因此，与祂对我们的伟大恩惠相比，我们所做的和所献给上帝的，实在算不得什么。尽管上帝用我们的污秽，甚至用粪便，为我们创造出美好的果实，并让我们以此为食，然而我们这些可怜的人，随后却又将这些美好的果实变成了粪便！
    - type: paragraph
      text:
        ru: Как благость Божия все использует во благо, так и мы, Его создания, тоже все должны использовать во благо, чтобы приносить пользу и самим себе, и другим.
        cn: 正如上帝的良善（或：恩泽）利用万物带来益处，我们作为祂的受造物，也当利用万物带来益处，以便使我们自身和他人获益。
    - type: paragraph
      text:
        ru: Добрые люди получают пользу даже от падений своих собратьев, используя их как надежные тормоза, чтобы быть осторожными и не попасть под откос. А лукавые, к несчастью, не получают пользы даже от чужих добродетелей, потому что переводят их на свой язык с помощью своего лукавого словаря и из-за этого помрачаются тьмой человекоубийцы, духовно вредят самим себе и другим, всегда огорчаются и огорчают этой своей духовной мрачностью своих собратьев, в то время как облачная погода вызывает огорчение только у людей, страдающих от печали.
        cn: 良善的人甚至能从他们的弟兄们的跌倒中获益，将其用作可靠的制动器（刹车），以便保持谨慎，不致滑落。而那些邪恶的人，不幸地，甚至无法从他人的美德中获益，因为他们使用自己的邪恶词典，将这些美德「翻译」成他们自己的语言，并因此被「杀人者」的黑暗所遮蔽，他们在属灵上伤害自己和他人，总是感到忧愁，并用他们这种属灵的阴沉来使他们的弟兄们感到忧愁，而阴云密布的天气只会让那些遭受忧伤折磨的人感到不快。
    - type: paragraph
      text:
        ru: Доброта является одним из многих свойств Божиих, поэтому всегда источает радость, разгоняет тучи, утешает сердца, как весенние лучи солнца, которые изводят из земли цветы и согревают даже змей, так что те выползают из своих холодных нор, чтобы тоже порадоваться доброте Божией.
        cn: 良善是上帝众多属性中的一个，因此它总能涌流出喜乐、驱散乌云、安慰人心，就像春日的阳光，它能使花朵破土而出，甚至能温暖蛇类，以至于它们从冰冷的洞穴中爬出来，也来分享上帝良善的喜悦。
    - type: paragraph
      text:
        ru: Злонравные люди постоянно задыхаются от помыслов и обдают холодом своих холодных сердец и душат помыслами страдающих людей, когда те приходят к ним за утешением. Добрые же своей духовной (благодарностью) любовью, соединенной с состраданием, душат демонов, освобождают души и источают своим собратьям божественное утешение.
        cn: 心地邪恶的人持续地被意念所窒息，并向他们冰冷的心灵散发寒气，当受苦的人们来到他们这里寻求慰藉时，他们便用意念勒住（窒息）这些受苦的人。而善良的人则用他们属灵的（感恩的）爱，这爱与怜悯结合在一起，勒住（窒息）恶魔，释放灵魂，并向他们的弟兄们倾流出神圣的慰藉。
    - type: paragraph
      text:
        ru: Горячая духовная любовь делает людей чувствительных еще более чувствительными, а бесстыдных – более бесстыдными.
        cn: 热烈的属灵之爱使敏感的人更加敏感，使无耻的人更加无耻。
    - type: paragraph
      text:
        ru: Сироту, особенно если у него нет матери, даже если он будет как ежик, нужно обнять с состраданием и горячей любовью, чтобы он сначала согрелся, осмелел и чтобы отверзлось его сердце.
        cn: 孤儿，尤其是如果他没有母亲，即使他像一只刺猬，也需要以怜悯和热切的爱去拥抱他，使他首先温暖起来，鼓起勇气，并使他的心扉敞开。
    - type: paragraph
      text:
        ru: Однако ревностному сироте с его порывами нужны хорошие тормоза, чтобы он не переутомился, показывая свою великую благодарность, и не повредил себе.
        cn: 然而，这位热忱的孤儿带着他的冲动，需要良好的制动系统（刹车），以防他因表现出自己巨大的感激之情而过度劳累，并因此伤害到自己。
    - type: paragraph
      text:
        ru: Горячая любовь Христова питает лучше всякой вещественной пищи, давая душе и телу множество калорий, а также зачастую без лекарств исцеляет неизлечимые болезни и успокаивает души.
        cn: 基督炽热的爱比任何物质的食物滋养得更好，它为灵魂和身体提供大量的热量，而且常常无需药物就能治愈不治之症，并使灵魂得到安宁。
    - type: paragraph
      text:
        ru: Те, которые не жертвуют своим телесным здоровьем ради любви Христовой и боятся пренебречь своим телесным покоем, не находят себе духовного успокоения ни в этой жизни, ни в будущей, вечной.
        cn: 那些不为基督之爱而牺牲其身体健康、并害怕忽视其身体安宁的人，无论在今生，还是在未来的、永恒的生命中，都找不到属灵的安宁。
    - type: paragraph
      text:
        ru: Те, которые по своей чистой любви готовы пожертвовать даже жизнью, защищая своих собратьев, подражают Христу. Они поистине являются величайшими героями, потому что даже смерть их боится, ибо они презрели ее ради любви. Они побеждают смерть и обретают под надгробным камнем ключи вечности, легко достигая вечного блаженства.
        cn: 那些出于其纯洁的爱、甚至愿意牺牲生命来保护他们的弟兄的人，是在效法基督。他们是真正最伟大的英雄，因为甚至死亡都惧怕他们，因为他们为了爱而蔑视了死亡。他们战胜了死亡，并在墓碑下获得了永恒的钥匙，轻松地达成了永恒的至福。
    - type: paragraph
      text:
        ru: Для чувствительного человека предпочтительнее один раз погибнуть ради любви, спасая своего ближнего, чем оказаться равнодушным или струсить, а затем всю жизнь страдать от угрызений совести.
        cn: 对于一个敏感的人来说，宁可为爱一次舍弃生命，去拯救他的邻人，也比变得冷漠或胆怯，然后一生遭受良心谴责的痛苦要好。
    - type: paragraph
      text:
        ru: Пожертвование ради собрата скрывает в себе великую любовь ко Христу. Имеющие благое произволение подать милостыню, но ничего не имеющие и страдающие из-за невозможности это сделать, подают милостыню кровью своего сердца.
        cn: 为弟兄的奉献隐藏着对基督的伟大爱慕。拥有施舍意愿，却一无所有，并因无法施舍而受苦的人，他们是用自己心头的血来施舍。
    - type: paragraph
      text:
        ru: Желающие мученически пострадать ради любви Христовой при отсутствии мучителей могут проявить эту свою любовь, которой горят их сердца, в телесном подвиге, совершаемом ради душ усопших, которые горят в огне, чтобы те получили хотя бы небольшое облегчение.
        cn: 那些渴望为基督的爱受殉道之苦的人，在没有行刑者（mučitele）的情况下，可以通过身体上的苦修（telesnom podvige）来展现他们心中燃烧的这份爱，而进行苦修是为了那些在火中燃烧的逝者的灵魂（duš usopših），以便他们能获得哪怕是一点点的慰藉（oblečenie）。
    - type: paragraph
      text:
        ru: Безразличные и немилосердные люди, которые думают только о себе, бесчувственно насыщая себя, наполняют одновременно свои сердца большим беспокойством, внутренне страдают от угрызений совести и мучаются уже в этой жизни. Тогда как милосердные, всегда питая своей любовью других, неизменно бывают насыщены любовью Божией и Его обильными благословениями.
        cn: 冷漠和无情的人，那些只考虑自己、麻木地使自己饱足的人，同时用极大的不安填满了他们的心，他们内心承受着良心的责备，并在这生命中就受苦了。而仁慈的人，总是以他们的爱滋养他人，总是被上帝的爱和祂丰盛的祝福所充满。
  - type: heading2
    text:
      ru: Смирение
      cn: 谦卑
    children:
    - type: paragraph
      text:
        ru: 'Блаженны люди, уподобившиеся смиренной земле, которая, хотя ее все попирают, всех носит с любовью и питает с нежностью, как добрая мать, которая дала нам вещество для нашей плоти при нашем создании. Также с радостью она принимает то, что мы бросаем на нее: от хороших плодов до грязных помоев, которые она тихо перерабатывает в витамины, щедро подаваемые ею вместе с ее плодами как добрым, так и злым людям без всякого различия.'
        cn: 那些效法谦卑的土地的人是有福的，这土地虽然被所有人践踏，却以爱心承载万有，并以温柔滋养万有，如同善良的母亲，在我们受造之时赐予我们肉身的物质。同样，我们投掷在她身上的一切，她都欣然接受：从美好的果实到污秽的泔水，她都静静地将其转化为维生素，并毫不区别地、慷慨地将它们连同她的果实一起，赐予善良和邪恶的人。
    - type: paragraph
      text:
        ru: Оказывается, что смиренный человек является самым сильным в мире, потому что и побеждает, и поднимает множество тяжестей[46]других людей с помощью своей легкой совести. Хотя он и испытывает к себе пренебрежение и несправедливость из-за чужих прегрешений, которые по любви присваивает себе, но внутренне ощущает величайшую в мире радость, потому что пренебрег этим суетным миром. Оскорбления, несправедливости и так являются лучшим ланцетом для согрешивших, потому что с их помощью очищаются старые раны. А для невиновных они являются топором палача, и тех, которые с радостью ради любви Христовой принимают их, можно считать мучениками.
        cn: 结果证明，谦卑之人是世上最强有力的人，因为他既战胜了重担，又凭借其轻省的良心举起了许多[46]其他人的重负。虽然他因着他人的罪过（这些罪过他出于爱而归于自己）而遭受轻视和不公，但在内心深处，他感受到了世界上最大的喜乐，因为他轻看了这个虚妄的世界。侮辱和不公本就是针对犯罪之人的最佳柳叶刀，因为借助它们，旧伤得以洁净。而对于无辜者而言，它们则是刽子手的斧头，那些为着基督的爱而欣然接受它们的人，可被视为殉道者。
    - type: paragraph
      text:
        ru: Взрослые люди, не принимающие оскорблений и строгих замечаний, чтобы исцелиться или получить награду (в случае их невиновности), неразумнее маленьких детей, которые не хотят даже слушать врача, боясь уколов (чтобы он не уколол их иглой), а потому постоянно страдают от жара и кашля.
        cn: 成年人若不接受冒犯和严厉的指正，以获得医治或（在他们无辜的情况下）得到奖赏，他们比那些甚至不愿听医生的话，害怕（医生用针头）给他们打针的小孩更加不智。这些小孩因此而持续遭受发烧和咳嗽的痛苦。
    - type: paragraph
      text:
        ru: Мы должны быть более признательны тем, которые нас укололи и благодаря которым вышли занозы из нашей души, чем тем, которые даром вскопали наше поле и показали нам наше скрытое неизвестное сокровище.
        cn: 我们应该对那些刺痛了我们，并因此使我们灵魂中的芒刺得以拔出的人，比对那些白白耕耘了我们的田地、向我们展示了我们隐藏的未知宝藏的人，更加心存感激。
    - type: paragraph
      text:
        ru: Нет пользы, если человек натирает себе колени при бесчисленных поклонах и одновременно не устраивает себе головомойку[47]с помощью смирения (внутренних поклонов). Тот, кто просит у Бога смирения, но не принимает человека, которого Бог посылает ему для смирения, не знает, чего просит, потому что добродетели не покупаются, как товар в магазине (на вес, сколько мы захотим), но Бог посылает нам людей для нашего испытания, чтобы мы потрудились, стяжали смирение и получили венец.
        cn: 一个人若在无数次的俯伏叩拜中磨破了自己的膝盖，却不以谦卑（内在的俯伏叩拜）来给自己进行「洗头」[47]，这是毫无益处的。那向上帝祈求谦卑，却不接受上帝为使他谦卑而差遣给他的人，他并不知道自己在求什么，因为德行不是像商店里的商品那样可以买到的（按我们想要的重量），而是上帝差遣人来考验我们，使我们劳苦，以获取谦卑并赢得冠冕。
    - type: paragraph
      text:
        ru: Тот, кто со смирением сгибается и принимает удары от других, избавляется от полноты, приобретает духовную красоту, какую имеют ангелы, и проходит через узкие врата рая.
        cn: 那带着谦卑顺服、承受他人击打的人，就脱离了圆满（饱足），获得了天使所拥有的属灵之美，并穿过了天国窄门。
    - type: paragraph
      text:
        ru: Блажен человек, который избавился от полноты и шествует тесным путем Господним, неся чужую поклажу (клевету и т.д.) и предоставляя людям возможность посредством клеветы сплетать для него нетленные венцы, потому что тем самым он обнаруживает истинное смиренномудрие, которое беспокоится не о том, что говорят люди, но о том, что скажет Бог в день Суда.
        cn: 有福的人，是那摆脱了（事物之）丰盛，并踏上主那窄路的人，他背负着他人的行囊（诽谤等等），并给予人们通过诽谤为他编织不朽花冠的机会，因为他籍此显明了真实的谦卑智慧，这谦卑智慧所担忧的不是人说什么，而是上帝在审判之日将说什么。
    - type: paragraph
      text:
        ru: Тот, кто серьезно разговаривает с клеветником или глупым человеком, пытаясь найти взаимопонимание, показывает, что и с ним самим не все в порядке, потому что злонравный человек хуже глупца, так как его ум помрачен злобой и эгоизмом.
        cn: 与诽谤者或愚昧人认真交谈，试图达成相互理解的人，表明他自己也有问题，因为恶毒之人比愚昧人更糟，因为他的心智已被邪恶和自私所蒙蔽。
    - type: paragraph
      text:
        ru: Имеющие же смирение имеют также доброту и божественное просвещение и не спотыкаются о препятствия лукавого на всем протяжении своего духовного пути.
        cn: 拥有谦卑的人，也拥有良善和神圣的启迪，在他们整个属灵旅程中，不会被那恶者设置的障碍绊倒。
    - type: paragraph
      text:
        ru: Большинство искушений создаем мы сами, выставляя свое «я» при общении с другими, то есть желая возвысить себя. Никто не поднимается на небо через мирское возвышение, но лишь через духовное понижение. Ходящий низко ходит всегда в безопасности и никогда не падает.
        cn: 大多数试探都是我们自己造成的，通过在与他人交往时展现我们的「我」，即渴望抬高自己。没有人能通过世俗的抬高升入天堂，而唯有通过属灵的降低。走得低的人总是走在安全之中，从不跌倒。
    - type: paragraph
      text:
        ru: Тот, кто без совета совершает свое духовное шествие, сбивается с пути, сильно устает и отстает. Если он не смирится и не начнет спрашивать – пусть даже позже, – то с трудом достигнет своей цели. Те же, которые советуются, шествуют с легкостью, в безопасности, их покрывает и просвещает благодать Божия, потому что они смиряются.
        cn: 那未得建议便开始其灵性旅程的人，会偏离道路，深感疲惫并落后。如果他不肯谦卑并开始询问——即便是在以后——他也很难达成目标。而那些寻求建议的人，则轻松而安全地前行，他们被上帝的恩典所遮盖和光照，因为他们是谦卑的。
    - type: paragraph
      text:
        ru: Те, которые делают все просто, с благими помыслами и открывают все свои помыслы старцу, а также в великом смирении уверены, что не имеют ничего хорошего, хотя и подвизаются с большой ревностью, скрывают в себе величайшее духовное сокровище, о котором не знают ни сами они, ни другие люди. Благодаря этому оно не расточается ими самими и другие не похищают его.
        cn: 那些凡事简单地、带着良善的意念去行，并将自己所有的意念都向长老敞开的人，以及那些在极大的谦卑中确信自己没有任何美好之处的人，即使他们以极大的热忱来修行，却在自身内隐藏着一份极其伟大的精神宝藏，对此，他们自己和他人都不知晓。正因如此，它既不会被他们自己挥霍散尽，也不会被他人盗取。
    - type: paragraph
      text:
        ru: 'Если кто-то смирится перед очень смиренным и чувствительным человеком, то получит много пользы. А если смиришься перед человеком, не знающим смирения: попросишь его совета или расскажешь ему о своих недостатках, то сделаешь его еще более гордым и наглым.'
        cn: 如果有人在一位非常谦卑和敏感的人面前谦抑自己，他将获得很多益处。但是，如果你在一位不认识谦卑的人面前谦抑自己：向他征求建议，或告诉他你的缺点，那么你只会使他变得更加骄傲和放肆。
    - type: paragraph
      text:
        ru: Человек, не имеющий смирения и добрых помыслов, полон сомнений и вопросов. И так как от этого он постоянно оказывается удрученным, поначалу ему нужен старец с великим терпением, чтобы постоянно объяснять ему все, пока не очистятся его ум и сердце, чтобы он сам мог ясно видеть.
        cn: 一个人，若没有谦卑和良善的思念（或译：意念），就充满了疑惑和问题。由于这一点，他不断地感到沮丧，最初他需要一位具有极大耐心的长老，来不断地向他解释一切，直到他的心智和心得到洁净，使他自己能够清楚地看见。
    - type: paragraph
      text:
        ru: 'Смиренный и добрый человек, имея чистоту, а также внутренний и внешний покой, имеет и духовную глубину: он глубоко постигает божественные мысли и, живя божественными тайнами, получает еще большую пользу, а его вера еще сильнее возрастает.'
        cn: 谦卑良善的人，因着拥有纯净以及内里与外在的安宁，也就拥有了属灵的深度：他深入领悟属神的思想，并在属神的奥秘中生活，得到更大的益处，而他的信德也更强烈地增长。
    - type: paragraph
      text:
        ru: Гордый бывает не только помраченным, но и постоянно внутренне и внешне обеспокоенным, а также из-за своего эгоистического легкомыслия всегда останавливается на поверхности вещей, не имея возможности проникнуть в их глубину, где скрыты божественные жемчужины, чтобы духовно обогатиться.
        cn: 骄傲的人不仅心智昏暗，而且经常在内里和外在感到烦乱不安；此外，由于他的自私轻率，他总是停留在事物的表面，无法穿透它们的深处，因为那里隐藏着属神的珍珠，可使人在灵性上得以富足。
  - type: heading2
    text:
      ru: Молитва
      cn: 祷告
    children:
    - type: paragraph
      text:
        ru: Душа, которую все еще волнуют красоты чувственного мира, обнаруживает тем самым, что в ней еще жив суетный мир, а потому ее привлекает творение, но не Творец, брение, но не Бог. Не имеет значения, чистое это брение или грязь греха, потому что человек сродствен Духу Божию и духом соединяется с Богом через молитву.
        cn: 一颗仍然被感官世界的美丽所牵动的灵魂，正表明了虚妄的世界仍在她里面活着，因此她被受造物吸引，而非造物主；被尘土吸引，而非上帝。无论是纯净的尘土还是罪恶的污泥都没有分别，因为人与上帝的圣灵有亲属关系，并通过祷告以精神与上帝结合。
    - type: paragraph
      text:
        ru: Сосредоточенность безмолвной жизни (в пустыне) очень способствует молитве, поскольку создает для нее благоприятные условия. Однако и само по себе безмолвие является таинственной молитвой и очень помогает молитве, как человеку – кожное дыхание.
        cn: 静默生活（在旷野中）的专注对于祷告非常有益，因为它为祷告创造了有利的条件。然而，静默本身也是一种奥秘的祷告，对祷告大有帮助，如同皮肤呼吸之于人。
    - type: paragraph
      text:
        ru: Молитва в соединении с недосыпанием питает душу, если она при этом духовно бодрствует, и дает ей безопасность, какую ребенок ощущает на руках у матери. Ребенок, который с нетерпением стремится попасть в объятия своей матери, сосет ее грудь и насыщается ее сладкой нежностью и любовью, умнее, чем мы, взрослые, избегающие соединения с Богом через молитву, которую часто считаем трудовой повинностью.
        cn: 祷告与睡眠不足相结合能滋养灵魂，如果灵魂在此时是属灵地警醒的，并给予它安全感，如同孩子在母亲怀中感受到的安全感。那个迫切渴望投入母亲怀抱、吮吸她的乳房并被她甜蜜的温柔与爱所饱足的孩子，比我们这些成年人更聪明，我们躲避通过祷告与上帝结合，而这祷告我们常常视作劳役。
    - type: paragraph
      text:
        ru: Нет людей блаженнее тех, которые наладили связь с небесной радиостанцией и связаны с Богом по проводу благоговения. И нет людей более несчастных, чем те, которые прервали свою связь с Богом и с тревогой кружатся по свету и крутят ручки приемников, пытаясь поймать радиостанции мира, чтобы хоть ненадолго забыть великое беспокойство своей выбитой из колеи жизни.
        cn: 没有比那些与「天堂广播站」建立联系，并借由「敬畏之线」与上帝相连的人更蒙福的了。也没有比那些切断了与上帝的联系，惶恐不安地在世上盘旋，转动着收音机的旋钮，试图捕捉世俗电台，以期哪怕只是短暂遗忘其脱轨生活所带来的巨大不安的人更不幸的了。
    - type: paragraph
      text:
        ru: Блаженны те, которые имеют в своем сердце ось – Христа и в радости непрестанно вращаются мыслью вокруг Его святого имени, произнося «Господи, Иисусе Христе, Сыне Божий, помилуй мя».
        cn: 那些心中有基督为轴，并且在喜乐中思想不停地围绕着祂的圣名旋转，诵念「主耶稣基督，上帝之子，怜悯我」的人是有福的。
    - type: paragraph
      text:
        ru: Безмолвие в удалении от мира очень быстро приносит душе внутреннее безмолвие при помощи подвижничества и непрестанной молитвы. Тогда человек уже не беспокоится внешним беспокойством, потому что у него, по сути, только тело пребывает на земле, а ум находится на небе.
        cn: 远离世界的寂静非常快地藉着苦修和不间断的祷告，将内在的寂静带给灵魂。那时，人不再受外在烦扰的困扰，因为他，从本质上说，只有身体留在地上，而心智则居于天上。
    - type: paragraph
      text:
        ru: В таком состоянии находились святые отцы – сделавшиеся невещественными люди, которые почти ничем не отличались от ангелов, потому что, как и ангелы, день и ночь пребывали на небе, непрестанно молясь умом.
        cn: 圣父们就处于这样一种状态——他们成了非物质的人，几乎与天使无异，因为他们像天使一样，日夜待在天上，不停地以心祈祷。
    - type: paragraph
      text:
        ru: Сердце же, плененное суетным миром, душу держит истощенной, а ум помраченным. Находящийся в таком состоянии если и кажется человеком, по сути является духовным выкидышем.
        cn: 然而，被虚妄世界所掳获的心，使灵魂保持枯竭，而心智则陷于昏暗。处于这种状态下的人，即使看似人形，其本质上乃是属灵的流产儿。
    - type: paragraph
      text:
        ru: Бдение вместе с молитвой дают здоровье и жизнь в духовном возрастании, потому что очищают и утончают ум, смиряют непокорную плоть, согревают сердце любовью к Богу, благодаря чему душа принимает божественную благодать.
        cn: 警醒（守夜）与祷告一道，在属灵成长中赐予健康与生命，因为它们洁净并精微化心智（努斯，nous），降伏不顺从的肉体，以对神的爱温暖人心，由此灵魂领受神圣恩典。
    - type: paragraph
      text:
        ru: Ночная молитва намного полезнее дневной, как и ночной дождь полезнее растениям, чем дневной.
        cn: 夜间的祷告比白昼的更有益处，正如夜间的雨水对植物比白昼的更有益处一样。
    - type: paragraph
      text:
        ru: Те, которые подвизаются в бдении и молитве, даже если и погружаются ненадолго в дремоту, умилостивляют Бога больше, чем те, которые насытились сном и поэтому не хотят спать. И даже те, которые задремали в стасидии, в тысячу раз лучше тех, которые спят в кровати. Однако не следует все свои силы расточать на суетные предметы, которые в один день превратятся в прах, а затем отдавать Богу свои усталость и зевоту, подобно жертве, которую принес Каин (Быт. 4, 3). Если наша усталость возникла по уважительной причине и нас клонит ко сну, тогда предпочтительнее позволить сну украсть у нас одну-две минуты во время бдения и отступить естественным образом, чем предварительно изгонять его с помощью кофе и из-за этого прийти в возбужденное состояние, особенно если у нас немирный характер. Предпочтительнее чуть меньше пободрствовать в чистой молитве, чем заставить себя провести без сна ночь, не получив духовной пользы, а затем весь день пролежать трупом.
        cn: 那些在彻夜不寐（бдение）和祷告中苦修的人，即便只是短暂地陷入瞌睡，也比那些饱食睡眠因此不想睡的人更能取悦上帝。甚至那些在诗班座位（стасидия）上打盹的人，也比那些睡在床上的人好上千倍。然而，我们不应当将自己所有的精力浪费在将在一天内化为尘土的虚妄之物上，然后才将自己的疲惫和哈欠献给上帝，如同该隐所献上的祭物（创世记 4:3）。如果我们的疲惫是由于正当的理由而产生的，并且睡意袭来，那么更可取的是让睡眠在彻夜不寐时从我们身上偷走一两分钟，然后自然地退去，而不是事先用咖啡将其驱逐，并因此陷入兴奋状态，尤其是如果我们性情不安宁（немирный характер）的话。更可取的是，在纯洁的祷告中少守夜一会儿，而不是强迫自己整夜不睡，没有获得属灵的益处，然后整日像尸体一样躺着。
    - type: paragraph
      text:
        ru: Чистой молитве очень способствует удаление от мирского шума и множества людей или, если это возможно, пребывание в совершенном уединении.
        cn: 对于纯净的祷告，远离世俗的喧嚣和众多的人群，或者，如果可能，处于完全的隐修（退隐）状态，对此非常有益。
    - type: paragraph
      text:
        ru: 'Когда человек находится в уединении, душа его чувствует себя легко, сердце с благоговением изливается перед Богом, постепенно разбивает покрывающую его грубую скорлупу и освобождается от нее, Человек начинает умиляться не только тогда, когда думает о Боге, но и когда слышит или встречает при чтении Его имя. Тогда сердце его играет и лобызает это имя с великим благоговением. Так же действует на него имя Христа или Божией Матери: душа его внутренне услаждается.'
        cn: 当一个人独处时，他的灵魂感到轻快，心灵以敬畏之心倾注在上帝面前，逐渐打破并摆脱那覆盖着它的粗糙外壳。这个人开始变得柔和（或译作「心生感动」），不仅在思念上帝时如此，而且在听到或阅读时遇到祂的名字时也是如此。那时，他的心在跳动，并以极大的敬畏亲吻（或译作「爱抚」）这个名字。基督或上帝之母的名字也以同样的方式作用于他：他的灵魂在内心得到慰藉（或译作「喜乐」）。
    - type: paragraph
      text:
        ru: Монаху подобает пребывать в уединении и находить для себя наибольшее успокоение в молитве, когда он находится один в своей келлии. Ведь потому он и называется монахом, чтобы жить уединенно[48]с Богом и непрестанно с Ним беседовать – вместо того чтобы разговаривать с людьми. Насколько избегаешь бесед с людьми, настолько большую получаешь пользу от молитвы и настолько большую пользу приносишь своей молитвой людям, потому что мирские споры, даже если кто-то будет их просто слушать, являются духовными радиопомехами, препятствующими непрестанной молитве, особенно вначале. Поэтому крайне необходимо внимание как вначале, чтобы собрать свой ум, так и впоследствии – чтобы не впасть в прелесть.
        cn: 隐修士应当处于隐居状态，并在他独自一人在他的隐室（келлии）里时，在祷告中为自己找到最大的平静。因为他之所以被称为隐修士（монах），就是为了与上帝独自一人[48]生活，并与祂不间断地交谈，而不是与人交谈。你越是避开与人的交谈，就越能从祷告中得到益处，并用你的祷告给人们带来更大的益处，因为世俗的争论，即使只是听，也是属灵的「无线电干扰」，妨碍不间断的祷告，尤其是在开始阶段。因此，极需专注，无论是在开始时收集自己的心智，还是在后来，以避免堕入「妄想」（прелесть）之中。
    - type: paragraph
      text:
        ru: Очень полезно чтение святых отцов, потому что святые отцы истолковывают Евангелие своей евангельской жизнью. Также полезно исследование самих себя в отношении своей греховности, неблагодарности и множества изливаемых на нас благодеяний Божиих. Все это естественным образом приносит смирение и после этого неизменно – благодать Божию. Духовное чтение согревает душу и усиленно понуждает ее к молитве и подвигу. Исследование самих себя приносит смирение и понимание необходимости молитвы и милости Божией. Поэтому перед тем как начать отсчитывать четки, хорошо было бы сосчитать свои грехи и многочисленные благодеяния Божии.
        cn: 阅读圣教父的著作非常有益，因为圣教父们以他们福音般的生活来阐释福音。同样有益的是，省察我们自身在罪性、不知感恩和上帝向我们倾注的诸多恩惠方面的状况。所有这一切自然而然地带来谦卑，并且在此之后——必然地——带来上帝的恩典。灵性阅读使灵魂温暖，并强有力地推动它去祈祷和修行。省察自身带来谦卑，并使人理解祈祷和上帝慈悲的必要性。因此，在开始数念珠之前，最好能数算自己的罪过和上帝无数的恩惠。
    - type: paragraph
      text:
        ru: Во время молитвы, когда ум отвлекается на непристойные предметы или они сами вспоминаются помимо нашего желания, не нужно вступать с врагом в спор, потому что если даже все адвокаты соберутся вместе, то не смогут справиться с одним бесенком. Эти помыслы могут быть изгнаны только пренебрежением к ним, точно так же, как и хульные помыслы. (Конечно, враг еще довольно долго будет лаять, но потом уйдет.) Человек не должен смущаться из-за богохульств диавола, но только из-за своих личных грехов, а также должен надеяться на беспредельное благоутробие Божие, ибо отсутствие надежды на Бога – дело рук лукавого.
        cn: 在祈祷时，当心智被不端的事物所吸引，或者这些事物不情愿地被回忆起来时，不必与仇敌争辩，因为即使所有律师聚集在一起，也无法对付一个小鬼。这些意念只能通过对它们的轻蔑而被驱逐，正如亵渎的意念一样。（当然，仇敌还会吠叫相当长一段时间，但之后会离开。）人不应因魔鬼的亵渎而烦乱，而只应为自己个人的罪孽而烦乱，同时也应寄望于上帝无限的仁慈（благоутробие），因为对上帝缺乏希望乃是那恶者的所作所为。
    - type: paragraph
      text:
        ru: Собрать ум в сердце во время молитвы очень помогает небольшое удерживание дыхания, но не постоянное, потому что это телесное сжатие вредит сердцу. Конечно, сердце очищается не от сжатия подобного рода, но от усердного и смиренного покаянного воздыхания, когда оно исходит из глубины сердца, принося божественное утешение. Когда же человек утесняет себя эгоистически и без рассуждения, тогда телесное сжатие приносит отчаяние и душевную тяжесть.
        cn: 在祷告期间将心神收聚于心中，适度的屏息非常有助益，但不宜持续不断，因为这种身体的压迫会伤害心脏。当然，心的洁净并非来自这种压迫，而是来自恳切和谦卑的悔罪叹息，当它从心底发出时，会带来神圣的慰藉。然而，当一个人以自我中心且不加辨别地自我压迫时，身体的压迫只会带来绝望和心灵的沉重。
    - type: paragraph
      text:
        ru: Когда человек подвизается с надеждой – приходит божественное утешение и душа ясно ощущает ласку любви Божией. Тогда Бог привлекает к Себе сердце человека, и руки перебирают четки с радостью, вызываемою этой божественной теплотой. Конечно, вначале необходима некоторая усердная настойчивость, соединенная с рассуждением, пока не разогреется наш духовный мотор и душа не тронется с места в непрестанной молитве.
        cn: 当一个人带着盼望苦修时——神圣的慰藉便会降临，灵魂清晰地感受到上帝之爱的爱抚。那时，上帝吸引人心归向祂自己，双手带着由这种神圣温暖所激发的喜悦，拨动念珠。当然，起初需要某种热切的坚持，并结合判断力，直到我们的属灵马达被预热，灵魂在不间断的祷告中启动。
    - type: paragraph
      text:
        ru: Очень полезно разнообразие в бдении. Если человек находится один, то пусть сначала делает земные поклоны, затем поясные, а после этого читает молитву Иисусову сидя или коленопреклоненно. И пусть повторяет это несколько раз соответственно времени, которым располагает. Этот способ очень полезен, потому что дает духовное оживление и с помощью духовных движений – поклонов – изгоняет усталость от неподвижности; также он изгоняет сонливость и приносит ясность ума во время молитвы.
        cn: 在守夜（бдение）时，多样性是非常有益的。如果一个人独自一人，那么让他先做大拜（земные поклоны），然后做俯首拜（поясные），在此之后，让他或坐着或跪着诵念耶稣祷文（молитву Иисусову）。让他根据自己所拥有的时间，重复这样做几次。这种方法非常有用，因为它带来了属灵的振奋，并且借着属灵的运动——即拜——驱除了因静止不动而产生的疲劳；它也驱除了睡意，并在祷告时带来心智的清明。
    - type: paragraph
      text:
        ru: Неумеренный физический труд и вызываемые им утомление и рассеяние изгоняют трезвение и делают грубой душу, особенно если он выполняется со спешкой. Ибо, когда мы оставляем молитву Иисусову и свои духовные обязанности, враг постепенно захватывает наши духовные высоты и сражается с нами как через плоть, так и через помыслы. Он выводит из строя все наши душевные и телесные силы и прерывает наше общение с Богом. Следствием этого является пленение нашей души страстями.
        cn: 过度的体力劳作及其所引起的疲惫和分心（ рассеяние）会驱逐清醒（ трезвение），并使灵魂变得粗糙，尤其是当这种劳作是匆忙完成时。因为，当我们舍弃耶稣祷文和我们的属灵职责时，仇敌就会逐步占据我们的属灵高地，并通过肉体和意念（ помыслы）与我们争战。它会使我们所有的灵魂和身体的力量失灵，并切断我们与上帝的交通（общение）。其结果就是我们的灵魂被情欲（ страстями）所掳。
    - type: paragraph
      text:
        ru: Однако труд с рассуждением, особенно для новоначальных, очень полезен, потому что приносит человеку двойное здоровье и благословение Божие. Потому что тогда он не только обеспечивает себя всем необходимым, но может также другим давать что-нибудь как благословение, благодаря чему прославляется имя Божие и прощаются грехи его усопших сродников[49]. Монах должен иметь духовное благородство, то есть сам должен раздавать благословения[50], а не жить за счет благословений других, будучи молодым и здоровым[51]. Духовное благородство очень полезно, потому что дает душе крылья, а внутренний мир при этом поддерживает тело с помощью меньшего количества пищи.
        cn: 然而，带着辨识力（rasuzhdeniem）的劳作，特别是对于初入教门者（novonachal』nykh）而言，非常有用，因为它给人带来双重的健康和上帝的祝福（blagoslovenie Bozhiye）。因为那样，他不仅能为自己预备一切所需，还能将一些东西作为祝福分施给他人，借此上帝的名得着荣耀，并且他已故亲属的罪过也得蒙赦免[49]。修士（Monakh）应当拥有属灵的贵气（dukhovnoye blagorodstvo），也就是说，他自己应当分施祝福[50]，而不是靠着他人的祝福生活，尤其是当他年轻而健康时[51]。属灵的贵气非常有益，因为它给予灵魂翅膀，而内心的平安（vnutrenniy mir）与此同时能用较少的食物来维系身体。
    - type: paragraph
      text:
        ru: Вещи, изготавливаемые со спокойствием и молитвой, освящаются сами, а также освящают людей, которые ими пользуются. Тогда как вещи, изготавливаемые со спешкой и нервозностью, передают это демоническое состояние другим людям. Спешная работа с беспокойством является чертой мирских людей. Монаху же подобают внутренний и внешний мир, благоговение и непрестанная молитва для освящения его души и молитва о душах его собратьев, у которых нет такой возможности молиться.
        cn: 带着平静与祈祷所制作的事物，自身便得以成圣，也圣化使用它们的人。而那些带着急躁与紧张所制作的事物，则将这种魔性的状态传递给他人。带着忧虑的急切工作是世俗之人的特征。然而，与此相称的修士（monk）则应拥有内在与外在的平安、敬畏以及不间断的祈祷，以圣化他的灵魂，并为他的弟兄们的灵魂祈祷——他们没有这样的机会去祈祷。
    - type: paragraph
      text:
        ru: Если рукоделие будет производить шум, то тогда очень полезно негромкое псалмопение, пока душа не достигнет состояния божественной отрешенности, когда она уже не слышит шума или слышит его только когда захочет, или, лучше сказать, когда ум спускается с неба. Рукоделие должно быть простым, чтобы руки привыкли работать сами, не имея нужды в помощи ума.
        cn: 如果手工活会发出噪音，那么轻柔的赞美诗咏唱就非常有益了，直到灵魂达到神圣超脱的状态，那时它就不再听见噪音，或者只有在它想听时才听见，更确切地说，只有当心智从天上降下时才听见。手工活必须简单，这样手就能习惯于自己工作，无需心智的帮助。
    - type: paragraph
      text:
        ru: Нужна большая осторожность, чтобы не растратить на рукоделие всех своих телесных сил, иначе потом мы будем не в состоянии исполнять свои духовные обязанности или будем исполнять их без желания и смотреть, когда же будет крестик у четок, чтобы закончить поклоны, которые полезнее всех остальных духовных упражнений.
        cn: 需要极大的谨慎，以免将全部体力耗费在手工劳作上，否则之后我们将无法履行我们的属灵义务，或者会心不甘情不愿地履行，并盼望念珠上的十字标记何时出现，好结束那些比所有其他属灵操练更有益处的跪拜。
    - type: paragraph
      text:
        ru: С помощью коленопреклонений мы смиренно поклоняемся Богу и испрашиваем Его милости, чтобы Он простил нам наши грехи; поэтому они и называются «метаниями»[52]. Поклоны за самих себя и за наших собратьев (живых или усопших) – это самое главное наше рукоделие, выполнение которого требует бесконечного труда, было бы только усердие приносить покаяние. А если мы теряем покой, заботясь о других, ничтожных, вещах[53], несущественных, то в конце концов теряем свою душу.
        cn: 借着跪拜（коленопреклонений），我们谦卑地敬拜上帝，并祈求祂的恩慈，愿祂赦免我们的罪；因此，它们也称为「跪拜（метаниями）」[52]。为我们自己和我们的弟兄（活着的或已故的）所行的跪拜，是我们最重要的「手艺」（рукоделие），其完成需要无尽的劳苦，只要有诚心去献上悔改。而如果我们为着其他微不足道的、不重要的事物[53]而忧虑，失去平安，那么最终我们就会丧失自己的灵魂。
    - type: paragraph
      text:
        ru: Коленопреклонения бывают многочисленными, когда сердце играет от благодарности Богу, потому что душа выражает свои чувства также и через это внешнее ликование – через поклоны, которые приносят обилие благодати и телесное бесстрастие.
        cn: 当内心因对上帝的感恩而悸动时，会出现无数次跪拜，因为灵魂也通过这种外在的欢庆——通过带来丰盛恩典和身体上的无情欲的跪拜——来表达自己的情感。
    - type: paragraph
      text:
        ru: Многочисленные поклоны убирают у новоначальных их неестественно большие животы и помогают им подняться на духовные высоты добродетелей, как если бы они легко и без одышки поднимались на горные вершины.
        cn: 对于初入教者而言，大量的拜伏（проскинесис）会消除他们不自然的巨腹，并帮助他们提升到德行的属灵高度，仿佛他们可以轻松、毫不气喘地攀登到山顶。
    - type: paragraph
      text:
        ru: Если же мы не будем подвизаться, то будем стоять на месте или будем продвигаться вперед медленно. Но если у нас будет по крайней мере большое смирение, то тогда рука Божия вознесет нас на небо даром.
        cn: 如果我们不愿操练灵性（podvizat'sya），那么我们将停滞不前，或者只能缓慢地向前迈进。但如果我们至少拥有巨大的谦卑，那么上帝之手将白白地把我们举升到天堂。
    - type: paragraph
      text:
        ru: А если у нас – Боже сохрани! – нет даже смирения, то мы стремительно покатимся вниз. Если человек хочет стяжать духовное здравие, то должен усиленно подвизаться, имея великое смирение и не смотря на других и не осуждая их, но лишь самого себя.
        cn: 而倘若我们——求主保守！——连谦卑都没有，那么我们就会迅速地向下滚落。如果一个人想要获取属灵的健康，他就应当刻苦修行，怀有极大的谦卑，不看顾他人，不评判他们，而只看顾和评判他自己。
    - type: paragraph
      text:
        ru: Те, которые больны и не могут подвизаться телесно, могут подвизаться духовно с помощью трезвения и непрестанной молитвы, чтобы искоренить свои душевные страсти, а также могут постоянно размышлять о святых страстях Господних, чтобы благодаря им их собственные болезни сделались для них сладкими. Также они могут прославлять Бога своим терпением и получить мученический венец.
        cn: 那些生病而无法进行身体苦修的人，可以通过警醒（трезвение）和不间断的祷告来进行属灵的苦修，以根除他们内心的情欲（душевные страсти）。他们也可以持续默想主的圣受难（святых страстях Господних），使自己的病痛因此变得甘甜。此外，他们可以通过忍耐来荣耀上帝，并获得殉道者的冠冕（мученический венец）。
    - type: paragraph
      text:
        ru: 'Во время, установленное для молитвы, когда другие подвизаются, исполняя свое правило, тот, кто не может делать земных поклонов, пусть делает поясные или, по крайней мере, пусть произносит молитву Иисусову и не спит – если он не болен и не имеет уважительной причины для оставления правила. Всегда нужно проверять себя: есть ли у нас уважительная причина оставить свои духовные обязанности или нет, чтобы не сделаться духовно праздными и чтобы враг, который никогда не спит, но постоянно думает, как причинить нам великое зло, не совершил на нас внезапное нападение.'
        cn: 在规定的祷告时间，当其他人正在竭力履行他们的定规时，那些不能做大拜的人，就让他们做小拜，或者，至少，让他们诵念耶稣祷文而不睡觉——如果他不是生病，且没有正当理由放弃定规。我们总是需要自省：我们是否有正当的理由放弃我们的属灵义务，以免我们变得属灵上懈怠，又以免那从不睡觉、却不断思索如何给我们造成大恶的仇敌，对我们发动突然的袭击。
    - type: paragraph
      text:
        ru: Поэтому, если мы увидим себя духовно омертвевшими, а свое сердце заледеневшим, нужно посетить какого-нибудь подвижника, чтобы ожить, а также человека больного, чтобы заставить наше сердце сострадать ему, помочь ему с любовью, согреться благодаря любви и оттаять.
        cn: 因此，如果我们发现自己在灵性上已经死亡，并且心已冻结，就需拜访一位苦修者（podvizhnik）以求复苏，也需拜访一位病人，以迫使我们的心怜悯他，以爱帮助他，因爱而温暖并解冻。
    - type: paragraph
      text:
        ru: Когда человек имеет духовное здоровье и удаляется от людей для того, чтобы больше помочь им своей молитвой, тогда всех людей он считает святыми, а себя одного – грешным.
        cn: 当一个人拥有属灵的健康，并为了更多地以自己的祷告帮助人们而远离人群时，他将所有人视为圣徒，而唯独自己是罪人。
    - type: paragraph
      text:
        ru: Очень полезной бывает пустыня (при таком хорошем духовном устроении) вместе с всецелым преданием себя Богу, со свободной от забот и сосредоточенной, «безмолвной» головой, чтобы душа могла делать большие духовные скачки[54]. Однако в таком случае нужна большая осторожность, чтобы не впасть в прелесть. Поэтому голова подвижника должна быть очень крепко заперта, чтобы лукавый не вложил ему в душу помысел гордости и не прельстил его мечтаниями и ложным светом, который не возводит в рай, но низвергает в ад. Лукавый представляет пропасти в виде садов и таким образом обманывает немощные создания Божии. Конечно, тот, кто духовно здоров, не гонится в этой жизни даже за истинным светом, но ищет лишь милости Божией, и Бог подает то, в чем нуждается Его создание.
        cn: 在这样美好的属灵安排下，旷野是非常有益的（于此）——连同将自己全然交托给上帝，以一个没有忧虑、集中且「静默」的头脑，好让灵魂能做出巨大的属灵飞跃[54]。然而，在这种情况下，需要极大的谨慎，以免陷入虚妄（*prelest』*）。因此，苦修者的头脑必须被非常牢固地锁住，以免那恶者将骄傲的意念植入他的灵魂，并以幻象和虚假的亮光来迷惑他——这虚假的亮光不能将人提升到天堂，却将人投入地狱。那恶者将深渊描绘成花园，并以这种方式欺骗上帝软弱的受造物。当然，那在灵性上健康的人，即使是真正的亮光，在此生也不去追逐，而只寻求上帝的怜悯，而上帝则会赐予祂的受造物所需要的东西。
    - type: paragraph
      text:
        ru: Монахи, живущие в монастыре, благодаря братской взаимопомощи, находятся в большей безопасности, чем исихасты[55], которые живут в уединении, но это при условии, если между ними нет ссор (и они не едят друг друга), потому что при меньшем самоотречении они могут преуспеть духовно. А исихасту нужно иметь большое самоотречение, чтобы вырыть себе сначала могилу, а затем с великим смирением и рассуждением начать свой духовный подвиг, непрестанно трезвясь и молясь.
        cn: 那些在修道院生活的修士，由于弟兄间的互助，比隐居的静修者[55]更为安全，但前提是他们之间没有争吵（且他们不彼此吞噬），因为带着较少的自我否定，他们也能在灵性上取得进展。至于静修者，则需要有巨大的自我否定，先为自己掘好坟墓，然后以极大的谦卑和明辨开始他们的灵修苦行（podvig），不断地保持警醒和祷告。
    - type: paragraph
      text:
        ru: Новоначальный, который убегает от безопасности киновии и, движимый эгоизмом, затворяется в келлии (хочет быть затворником), похож на человека, которого запирают в сумасшедший дом. Если он к тому же по своей природе склонен к унынию и замкнут, то его начинают душить помыслы и внутреннее беспокойство. Если у него есть хотя бы немного смирения, то он возвращается в киновию и спасается, а если упорствует – погибает.
        cn: 逃避隐修院（киновия）的安全保障，并受自我主义（эгоизм）驱使，将自己关在小室（келлия）里（想成为隐士）的初学者（новоначальный），就像一个被关进疯人院的人。如果他天性又倾向于忧郁（уныние）和封闭，那么思想（помыслы）和内心的不安就会开始扼杀他。如果他哪怕只有一点点谦卑，他就会回到隐修院并得救；如果他固执己见，就会灭亡。
    - type: paragraph
      text:
        ru: Естественный путь для монаха – сначала подчинить себя наставнику, пройти обучение и подвизаться всегда с большим смирением, испрашивая с благоговением милости Божией. Таким образом монах постепенно восходит на Голгофу, распинается, а затем духовно воскресает и начинает радоваться ангельской радостью, славословя Бога подобно ангелам.
        cn: 对于修士而言，自然的路径是：首先顺服于一位导师，接受训练，并始终以极大的谦卑来苦修，怀着敬畏之心恳求上帝的怜悯。如此，修士便会逐渐登上各各他，被钉死，随后在灵性上复活，开始享受天使般的喜乐，像天使一样颂赞上帝。
    - type: paragraph
      text:
        ru: Те же, которые живут духовной жизнью по-мирски, то есть если у них постоянно Пасха и они не переживут сначала великой четыредесятницы и распятия, не могут духовно воскреснуть и возлюбить Христа, потому что сами не пострадали, чтобы ощутить Христовы страдания, которые Он претерпел ради нашего спасения, и затем насладиться любовью Христовой и духовно обезуметь от божественной любви, будучи всецело поглощенными небом.
        cn: 然而，那些以世俗方式过属灵生活的人，即如果他们总是在过逾越节（复活节），却没有首先经历大四旬期和被钉十字架，他们就不能在灵性上复活并爱慕基督。这是因为他们自己没有受苦，从而感受不到基督为我们的救恩所承受的苦难，也就无法随后享受基督的爱，并因着神圣之爱而在灵性上心醉神迷（精神错乱），完全被天国所吞没。
    - type: paragraph
      text:
        ru: Итак, когда человек не продвигается по естественному пути духовной жизни через распятие к воскресению, чтобы пережить небесное пасхальное духовное состояние, он еще более несчастен, чем мирские люди. Ибо последние еще могут что-то понять, если с ними заговорят о божественной любви[56], тогда как те, которые отправились в путь к небесной любви и высшим радостям, но взирают и на мирские радости (безгрешные), останавливаются на середине дороги, подобно жене Лотовой (Быт. 19, 26), а потому их сердце бесчувственно, как камень, и они соблазняются самим словом «божественная любовь», когда читают о ней в книгах нашей Церкви.
        cn: 因此，当一个人未能按着属灵生命的自然道路，即通过「被钉十字架」而达致「复活」，以体验属天的逾越节属灵状态时，他比世俗之人更加不幸。因为，如果与后者谈论神圣的爱[56]时，他们或许还能理解一些；然而，那些已踏上通往属天之爱与至高喜乐之路，却仍然顾盼世俗喜乐（即便无罪）的人，他们停滞在道路的中间，如同罗得的妻子（创世记 19:26）一样。因此，他们的心如石头般麻木不仁，以至于当他们在我们教会的书籍中读到「神圣的爱」这个词时，反而会因此被诱惑。
    - type: paragraph
      text:
        ru: 'Такие люди больше всех нуждаются в молитве, чтобы Бог сотворил чудо: превратил их сердца из каменных в человеческие, духовные, для того чтобы они могли любить Бога, ибо только Бог может«от камения… воздвигнути чада Аврааму»(Мф. 3:9), как говорит Евангелие.'
        cn: 这样的人比任何人都更需要祷告，好让上帝行神迹：将他们石心变为属人的、属灵的心，使他们能够爱上帝，因为正如《福音书》所言，唯有上帝能「从这些石头中，给亚伯拉罕兴起子孙」（马太福音 3:9）。
  - type: heading2
    text:
      ru: Богословие
      cn: 神学
    children:
    - type: paragraph
      text:
        ru: Богословие есть слово Божие, которое воспринимают лишь чистые, смиренные и духовно возрожденные души, но не красивые рассудочные слова, составляемые с помощью филологического искусства и содержащие в себе юридический или мирской дух.
        cn: 神学是上帝的话语，只有纯净、谦卑、并在灵性上重生了的灵魂才能领受，而不是用语文学技巧所构建的美丽理智词句，它们内含法理或属世的精神。
    - type: paragraph
      text:
        ru: Искусственные слова ничего не говорят душе человека, как не может разговаривать красивая статуя, разве что если слушатели очень мирские и удовлетворяются просто красивыми речами.
        cn: 人造的词语对人的灵魂毫无意义，正如一座美丽的雕像无法交谈一样，除非听众非常世俗，并仅仅满足于漂亮的言辞。
    - type: paragraph
      text:
        ru: Богословие, которое изучается как наука, обычно исследует предметы с исторической точки зрения, и потому понимает их внешне и, поскольку при этом отсутствуют подвижничество в святоотеческом духе и внутренний жизненный опыт, наполнено сомнениями и вопросительными знаками, ибо никто не может умом постигнуть божественную благодать, если сначала не будет подвизаться, чтобы ее ощутить и чтобы она начала в нем действовать.
        cn: 作为一门科学研究的神学，通常从历史的视角来考察主题，因此只是外在地理解它们。由于缺乏教父精神的苦修实践和内在的生命经验，它充满了疑虑和问号，因为若非先进行苦修以感受神圣的恩典，并让它开始在自身内运作，没有人能凭心智领悟这恩典。
    - type: paragraph
      text:
        ru: Тот, кто думает, что сможет познать тайны Божии с помощью внешнего научного умозрения, подобен безумцу, который хочет увидеть рай в телескоп.
        cn: 那认为能借助外部科学推测来认识上帝奥秘的人，就像一个试图用望远镜观看天堂的疯子。
    - type: paragraph
      text:
        ru: Подвизающиеся по-святоотечески, благодаря посещению благодати Святого Духа, становятся богословами-практиками. Если кто-нибудь из них, кроме внутреннего образования души, имеет также внешнюю образованность, то может описывать божественные тайны и правильно их истолковывать, как это делали многие святые отцы.
        cn: 那些按照教父传统进行苦修的人，由于圣灵恩典的降临，成为了实践性的神学家。如果他们中的任何一位，除了内在的灵魂教育（образования души）之外，也拥有外在的教育（образованность），那么他就可以描述神圣的奥秘并正确地解释它们，正如许多圣教父所做的那样。
    - type: paragraph
      text:
        ru: Однако если человек не сроднится душой со святыми отцами и пожелает перевести что-нибудь из их творений или написать о них, то из-за своего духовного помрачения нанесет оскорбление и святым, и себе самому, и миру. Также неверно поступает человек, который богословствует, используя чужое богословие, потому что он похож на бездетного человека, который усыновляет чужих детей, а затем выдает их за своих, представляя себя многодетным отцом. Святые отцы выносили из своих сердец божественное слово или свой опыт из духовной брани против зла и огня искушений и смиренно его исповедовали или описывали, чтобы помочь последующим поколениям. Они делали это из любви, которую никогда не приписывали себе самим, признавая также, что их смирение и все их дарования – от Бога.
        cn: 然而，如果一个人在灵魂上不亲近圣教父们，却希望翻译他们作品中的一些内容或撰写关于他们的文章，那么由于他属灵的昏暗，他会侮辱圣者、他自己和世界。同样，一个人若使用他人的神学进行神学思考（或「神学论述」），其行为也是错误的，因为他就像一个没有孩子的人，收养了别人的孩子，然后将他们冒充为自己的孩子，把自己装扮成一个多子女的父亲。圣教父们从心中流淌出神圣的言语，或者他们与邪恶进行属灵争战以及经历试探之火的经验，并谦卑地宣认或描述出来，以帮助后代。他们这样做是出于爱，他们绝不将这爱归功于自己，同时也承认他们的谦卑和他们所有的恩赐都源于上帝。
    - type: paragraph
      text:
        ru: Те, которые выдают дарования Божии за свою собственность, являются самыми бесстыдными и самыми несправедливыми людьми в мире, потому что несправедливо относятся к Богу, но еще хуже – к самим себе. Ибо они сами являются причиной отнятия божественной благодати, которую Бог у них забирает, чтобы они не оказались еще более неблагодарными и не пали из-за своего великого тщеславия.
        cn: 那些把上帝的恩赐当作自己的财产的人，是世上最无耻、最不公义的人，因为他们对上帝不公，但对自己更糟。因为他们自己就是神圣恩典被取走的缘由，上帝将恩典从他们那里收回，以免他们变得更加忘恩负义，并因其巨大的虚荣心而跌倒。
    - type: paragraph
      text:
        ru: Те, которые за все благодарят Бога и постоянно со смирением следят за собой, а также, богословствуя, с добрым душевным расположением созерцают создания Божии, становятся самыми истинными богословами. При этом они могут быть даже неграмотными, подобно простым пастухам, которые день и ночь следят на пастбищах за погодой и благодаря этому становятся хорошими метеорологами.
        cn: 那些为一切感谢上帝并持续谦卑地审视自己的人，以及那些在神学思考中以良善的灵魂性情默观上帝创造之物的人，成为了最真实的神学家。他们甚至可以是文盲，就像那些日夜在牧场关注天气的普通牧羊人一样，正因此，他们成为了优秀的气象学家。
    - type: paragraph
      text:
        ru: Те, которые живут просто, с добрым душевным расположением и добрыми помыслами, и стяжали внутреннюю простоту и чистоту, даже вышеестественные вещи видят очень просто, как естественные, потому что у Бога все просто и Он не применяет большей силы для вышеестественного, а меньшей – для естественного, но одну и ту же силу для всего. Потому что у Бога все очень просто, как и Сам Он прост, что и явил нам Его Сын на земле Своей святой простотой.
        cn: 那些生活朴素，带着良善的内心倾向和良善的思想，并获得了内在的朴素与纯洁的人，甚至会以非常简单的方式看待超乎自然的事物，如同看待自然的事物一样，因为在上帝那里，一切都是简单的，祂不会为了超乎自然的事物而运用更大的力量，也不会为了自然的事物而运用更小的力量，而是对一切都运用同一种力量。因为在上帝那里，一切都非常简单，正如祂本身是单纯的一样，祂的儿子在地上也以其神圣的朴素向我们显明了这一点。
    - type: paragraph
      text:
        ru: Если человек стяжал чистоту, за которой следует простота со своей горячей верой и благоговением, то в него вселяется Святая Троица, и тогда, с помощью божественного просвещения, он легко находит ключи к божественным мыслям, имея возможность изъяснить богодухновенные слова очень простым и естественным образом, не ломая голову.
        cn: 若一个人获得了纯净，继而是带着其火热的信心与敬畏的朴素，则圣三一会居于其内。那时，借着神圣的启迪，他便能轻易找到通往神圣思想的钥匙，得以用极其朴素与自然的方式阐释神所默示的言语，无需绞尽脑汁。
    - type: paragraph
      text:
        ru: Люди толкуют слова святых соответственно чистоте или лукавству своего душевного расположения и соответственно этому приносят себе и другим пользу или вред. Часто человек приносит вред по неопытности, хотя и имеет доброе расположение. Например, кто-то не знает, что на свете, кроме красного вина, есть еще и белое, и потому бросает в него красную краску, чтобы оно якобы стало хорошим, но оно после этого вызывает у людей отравление. Если же человек и не неопытен, и не лукав, но живет человеческой логикой и справедливостью, то опять-таки оскорбит Дух Божий, а также себя самого и других.
        cn: 人们根据自己心性意向的纯洁或奸诈来解释圣徒的话语，并因此给自己和他人带来益处或损害。一个人常常因为缺乏经验而造成损害，尽管他有良善的意向。例如，有人不知道世界上除了红葡萄酒还有白葡萄酒，因此他往白葡萄酒里扔红色染料，想让它变得「好」，但这样做之后它却使人中毒。如果一个人既不是缺乏经验，也不是心存奸诈，而是依照人的逻辑和公义行事，那么他仍然会冒犯上帝之灵，也冒犯他自己和他人。
    - type: paragraph
      text:
        ru: 'Человеческой логикой и справедливостью живут евангельские делатели первого и третьего часа (Мф. 20:1–15), которые вступают в спор с хозяином, считая, что с ними поступили несправедливо. Однако сердцеведец Бог, со всей точностью Своей божественной справедливости, заплатил даже за томительное ожидание, в котором находились работники одиннадцатого часа, пока не нашли себе работу. Хотя по Своей божественной справедливости, которая полна милосердия и любви, Он мог дать работникам одиннадцатого часа еще большую плату, потому что они, несчастные, сильно страдали душой и устали больше других работников, которые устали телесно, трудясь большее время. Но как мы, окаянные люди, можем вместить нашим ограниченным умом эту Его божественную справедливость, равно как и своей ограниченной любовью Его беспредельное милосердие? Поэтому любовь Божия ограничилась тем, чтобы всем дать одинаковую плату, которая им была обещана, для того чтобы не соблазнить еще больше тех, которые себя любили больше, чем других. И когда Он говорил им: «Я не обижаю вас, не за такую ли плату мы договорились?» – то хотел сказать: «Я хозяин с щедрой любовью и божественной справедливостью, которую вы не можете понять», – а не: «Я хозяин, и ни с кем не считаюсь», потому что Бог – наш Отец, а мы – Его чада, и все люди знают Его Отеческую любовь, потому что Он был распят, чтобы спасти нас и вновь ввести в рай.'
        cn: 福音书中，在第一时辰和第三时辰工作的工人（马太福音 20:1-15），是凭着人类的逻辑和公义而活的，他们与主人争辩，认为自己受到了不公正的对待。然而，洞察人心的上帝，以祂神圣公义的全部精确性，甚至为第十一时辰的工人在找到工作前的煎熬等待付了工价。尽管祂本可以以充满怜悯和爱的神圣公义，给予第十一时辰的工人更高的工价，因为这些不幸的人在灵魂上遭受了巨大的痛苦，比那些在肉体上疲惫于更长时间劳作的工人更加疲惫。但是，我们这些可怜的人，如何能以我们有限的头脑来理解祂的神圣公义，又如何能以我们有限的爱来理解祂无限的怜悯呢？因此，上帝的爱仅限于给予所有人他们被应许的同样工价，以免使那些爱自己甚于爱别人的人受到更大的引诱。当祂对他们说：「我没有亏负你，我们不是说好了这个工价吗？」——祂想表达的是：「我是带着慷慨的爱和你们无法理解的神圣公义的主人，」——而不是：「我是主人，我不理会任何人，」因为上帝是我们的父，我们是祂的儿女，所有人都知道祂的父爱，因为祂被钉十字架是为了拯救我们，并再次带我们进入乐园。
    - type: paragraph
      text:
        ru: Если бы мы могли выйти за рамки своего «я» (любви к самим себе), то вышли бы за пределы земного тяготения и все предметы видели бы, как они есть, божественным оком – ясно и глубоко. Поэтому сначала нужно выйти из мира в пустыню и там подвизаться со смирением, покаянием и молитвой, чтобы опустошиться от своих страстей, счистить с себя духовную ржавчину и приобрести высокую электропроводность, для того чтобы затем принять божественную благодать и стать настоящими богословами.
        cn: 如果我们能超越自己的「我」（对我们自己的爱），那么我们就能超越地心引力，并以神圣的眼睛——清晰而深刻地——看到万物如其所是。因此，首先需要走出世界，进入旷野，在那里以谦卑、悔改和祷告来苦修，以便从自己的情欲中被倒空，将自身的属灵锈迹清除干净，并获得高导电性，以便随后接受神圣的恩典，成为真正的神学家。
    - type: paragraph
      text:
        ru: 'Если человек не очистит своих духовных проводов от ржавчины, то постоянно будет происходить короткое замыкание и он будет наполняться мирскими теориями и сомнениями с вопросительными знаками. Тогда он уже не богословствует, так как имеет мирское душевное состояние, но занимается филологией исторической или исследованиями юридическими и математическими. Например, был ли Христос прибит тремя или четырьмя гвоздями и сколько было воинов, когда Его распинали? Однако при этом мы не замечаем того, что имеет значение, а именно: что Христос распялся за наши грехи, чтобы спасти нас, и что Он пострадал больше чем все святые мученики. Ибо им Он подавал Свою божественную помощь, но Сам при Распятии совершенно не применял божественной силы, испытывая страшную боль ради любви, потому что обе Его руки и обе Его ноги были пробиты. Были ли две Его ноги пробиты одним или двумя гвоздями – это не имеет значения. Достаточно того, что обе они были пробиты и что Он страдал от боли и испил желчь, чтобы даровать нам сладость и вечное пребывание с Ним в раю, ибо Он – наш любящий Отец.'
        cn: 如果一个人没有清除他属灵线路上的锈蚀，那么就会不断发生短路，他就会被世俗的理论和带着问号的疑虑所充满。那时，他就不会再进行神学思考了，因为他拥有的是世俗的灵魂状态，而是从事历史的语文学研究，或是法律和数学的研究。例如，基督是被三根还是四根钉子钉住的？祂被钉十字架时有多少士兵？然而，我们却忽略了那具有意义的事情，即：基督为我们的罪而被钉十字架，以便拯救我们，并且祂所受的苦难比所有圣殉道者更多。因为祂曾赐予他们神圣的帮助，但在被钉十字架时，祂自己却完全没有动用神圣的力量，为了爱而承受了可怕的痛苦，因为祂的两只手和两只脚都被穿透了。祂的两只脚是被一根还是两根钉子穿透，这并不重要。重要的是，它们都被穿透了，祂忍受了痛苦，并喝下了苦胆，为的是赐予我们甜蜜和与祂在天堂永远的同在，因为祂是我们慈爱的父。
  - type: heading2
    text:
      ru: Отцы Церкви
      cn: 教父
    children:
    - type: paragraph
      text:
        ru: В древности святые отцы сначала уходили в пустыню и, подвизаясь, опустошались от своих страстей. Не имея своих собственных планов и программ, они вручали себя в руки Божий и избегали всяких званий и власти, даже когда достигали меры святости – за исключением лишь тех случаев, когда Мать Церковь нуждалась в их помощи. Тогда они оказывали послушание воле Божией, и имя Божие прославлялось их святой жизнью. Они становились духовными донорами, приобретя сначала в пустыне с помощью хорошей духовной пищи и неусыпного наблюдения духовных отцов духовное здоровье.
        cn: 在古代，圣教父们首先隐退到旷野，并在那里借着苦修，使自己从情欲中虚空。他们没有自己的计划或方案，而是将自己交托在上帝手中，并避免一切头衔和权柄，即便当他们达到了圣洁的程度时也是如此——唯一的例外是，当母教会需要他们的帮助时。那时，他们顺服于上帝的旨意，上帝的圣名因他们的圣洁生活而得荣耀。他们成了灵性上的「供体」，起初他们在旷野里，借着良好的属灵食粮和属灵父亲们不倦的观察，首先获得了属灵的健康。
    - type: paragraph
      text:
        ru: Однако, к сожалению, в наше время многие из нас, поддавшись мирской любви, которая не имеет духовного основания, желают якобы сделать добро и отдать свою кровь, тогда как наша кровь полна духовных микробов, и мы таким образом приносим еще больший вред.
        cn: 然而，可悲的是，在我们这个时代，我们中的许多人屈服于世俗之爱——这种爱缺乏属灵基础——表面上渴望行善和献出自己的血，可我们的血液却充满属灵的微生物，我们以这种方式带来了更大的危害。
    - type: paragraph
      text:
        ru: Но если бы мы жили по-святоотечески, то все были бы духовно здоровы, так что нашему здоровью завидовали бы все инославные. Тогда они и без проповеди оставили бы все свои болезненные заблуждения и спаслись. Потому что сейчас наше святоотеческое предание не воодушевляет их, ибо они хотят видеть также и наше отеческое его продолжение, наше подлинное сродство с нашими святыми.
        cn: 然而，如果我们能按照教父的方式生活，那么所有人都会在灵性上健康，以致于所有异教徒都会羡慕我们的健康。那时，他们即使没有宣讲，也会放弃所有他们痛苦的谬误并得救。因为现在我们的教父传统并不能激励他们，因为他们也想看到我们的教父传统的延续，看到我们与我们的圣徒之间真正的亲缘关系。
    - type: paragraph
      text:
        ru: В наше время, к сожалению, умножились слова и книги, но уменьшился опыт, потому что люди опять подпали под влияние мирского духа, который постоянно стремится к удобствам и избегает телесного труда. То есть большинство из нас находит себе покой во многом чтении и в малом применении прочитанного к себе, если такое применение вообще существует. Мы лишь восхищаемся святыми подвижниками нашей Церкви, не понимая, сколько они трудились, потому что мы не трудились, чтобы быть в состоянии понять их труд, полюбить их и подвизаться с ревностью, чтобы им подражать.
        cn: 在我们这个时代，令人遗憾的是，言语和书籍增多了，但经验却减少了，因为人们再次屈服于世俗精神的影响，这种精神不断地追求安逸并逃避身体上的劳苦。也就是说，我们中的大多数人在大量的阅读中寻得安宁，却很少将所读的内容应用到自身，如果说这种应用完全存在的话。我们只是钦佩我们教会的神圣苦修者，却不理解他们付出了多少劳作，因为我们没有劳作，因而无法理解他们的劳苦，去爱他们，并以热诚去苦修，以效法他们。
    - type: paragraph
      text:
        ru: Те же, которые подвизаются с ревностью, не давая себе покоя, и все делают не выпячивая своего «я», очень положительно помогают другим, потому что только благодаря этому обретают покой души имеющих нужду в помощи и только благодаря этому обретет внутренний покой их собственная душа как в сей жизни, так и в будущей.
        cn: 但那些以热忱竭力奋斗、不给自己安宁、并且所行一切皆不凸显自身「我」的人，则非常正面地帮助了他人。因为唯有借着此，他们才获得了那些需要帮助之人的灵魂安宁；也唯有借着此，他们自身的灵魂才能在今生和来世获得内在的安宁。
    - type: paragraph
      text:
        ru: Те, которые стремятся к власти, хотя находятся еще во власти страстей, а также выдают свои личные интересы за духовные и даже прибегают к мирским властям, чтобы те решили церковные проблемы, уже оставлены благодатью Божией.
        cn: 那些寻求权力，尽管仍处于情欲的权势之下，并且将自身的个人利益冒充为属灵的利益，甚至求助于世俗的权力，以期他们解决教会问题的人，早已被上帝的恩典所离弃了。
    - type: paragraph
      text:
        ru: Пусть лукавый не смеется над нами, приводя слова апостола Павла:«Требую суда кесарева»(Деян. 25:11), потому что апостол Павел тогда оказался во власти кесаря и, получив перед этим от Бога извещение, что ему должно проповедать Христа и в Риме, потребовал суда кесаря для того, чтобы его отвезли в Рим (за казенный счет).
        cn: 莫让那恶者讥笑我们，引述使徒保罗的话：「我向凯撒上诉。」（使徒行传 25:11）。因为使徒保罗那时已处于凯撒的权下，并且在此之前已领受了来自上帝的通知，知道他必须在罗马宣讲基督，故他要求凯撒的审判，是为了能让他被送往罗马（由国库承担费用）。
    - type: paragraph
      text:
        ru: Если человек пытается ставить церковные вопросы в православном духе, но делает это только для того, чтобы его повыше поставили в Церкви, может ли он получить благословение Божие?
        cn: 如果一个人试图以正教精神提出教会问题，但这样做只是为了让他在教会中获得更高的地位，他能否得到上帝的赐福？
    - type: paragraph
      text:
        ru: Также не должно восхищаться теми, которые очень хорошо и православно ставят церковные вопросы, когда сами еще недостаточно высоко стоят в Церкви и смущают ее своими безрассудными крайностями или послаблениями.
        cn: 同样，不应羡慕那些对教会事务提出非常优秀且符合正教立场的观点的人，如果他们自己在教会中的位置尚未足够高，且以其不理智的极端或放纵来扰乱教会。
    - type: paragraph
      text:
        ru: Противоположные крайности всегда приносят вред Матери Церкви, и те, которые придерживаются их, сами страдают от этого, потому что два противоположных конца[57]обычно сильно ранят. Это похоже на то, как если бы одной крайности держался бесноватый, больной духовным бесстыдством (презрением ко всему), а другой – сумасшедший, у которого безумная ревность соединилась с узколобием. И тогда – упаси Бог! – сторонники двух крайностей постоянно будут сражаться друг с другом и не разберешься, кто прав, кто виноват[58].
        cn: 相反的极端总是会给圣教会带来损害，而那些固守它们的人，自己也会因此受苦，因为两个对立的端点[57]通常会造成严重的伤害。 这就像是，一个极端被一个被邪灵附身、患有属灵无耻（蔑视一切）的病人所持守，而另一个极端则被一个精神错乱的人所持守，他的疯狂的狂热与狭隘的心胸结合在一起。而那时——求主保佑！——两个极端的支持者将不断地相互争斗，你将无法分辨谁对谁错[58]。
    - type: paragraph
      text:
        ru: Те, которые смогут сблизить эти две крайности, чтобы они соединились, увенчаются от Христа двумя нетленными венцами.
        cn: 那些能够使这两个极端（两者）靠近，以致它们得以联合的人，将从基督那里领受两个不朽的冠冕。
    - type: paragraph
      text:
        ru: Не нужно создавать проблемы в Церкви и преувеличивать те небольшие человеческие нестроения, которые всегда в ней присутствуют, чтобы не причинить большего зла, чему лукавый только радуется.
        cn: 不应在教会内制造问题，也不应夸大教会中一向存在的人类微小失序（нестроения），以免造成更大的恶，因为那恶者（лукавый）只会因此而欢喜。
    - type: paragraph
      text:
        ru: Тот, кто, заметив небольшой беспорядок, начинает сильно возмущаться и изо всех сил порывается якобы исправить его (в порыве гнева), похож на бестолкового пономаря, который, увидев, что течет свеча, сразу же бросается к ней, желая якобы поправить ее. Но при этом он сметает на своем пути людей и подсвечники, создавая во время богослужения еще больший беспорядок.
        cn: 一个注意到微小不当之处，就立即开始强烈愤慨，并竭尽全力、声称要纠正它（在怒火的冲动中）的人，就像一个糊涂的司事，他看到一支蜡烛在滴蜡，就立刻冲过去，声称想要把它弄好。但他在这样做时，却把路上的会众和烛台都扫翻了，在礼拜仪式中制造了更大的混乱。
    - type: paragraph
      text:
        ru: К сожалению, в наше время много людей, возмущающих Мать Церковь. Те из них, которые имеют образование, приняли догмат умом, а не духом святых отцов. Другие, неграмотные, ухватились за догмат зубами, а потому и скрежещут зубами, когда берутся спорить о церковных вопросах. И так от всех них Церковь получает больший вред, чем от врагов Православия.
        cn: 很遗憾，在我们这个时代，许多人使圣母教会（Mother Church）不安。他们中那些受过教育的人，是用心智接受了教义（dogmat），而不是用圣教父们的圣灵。另一些不识字的人，则用牙齿抓住了教义，因此当他们开始争论教会问题时，就咬牙切齿。因此，教会从所有这些人那里受到的损害，比从正教（Orthodoxy）的敌人那里受到的损害更大。
    - type: paragraph
      text:
        ru: 'Те, которые оправдывают свою злобу тем, что они якобы должны обличать других, не желая обличать самих себя, или тем, что необходимо огласить то, что происходит в Церкви, – даже те вещи, о которых не принято говорить, и при этом ссылаются на заповедь:«Повеждь Церкви»(Мф. 18:17), – пусть начнут со своей малой церкви: семьи или братии. И если это покажется им хорошим делом, тогда пусть позорят и Мать Церковь. Хорошие дети, думаю, никогда не будут клеветать на свою мать. Но многие безрассудные православные, к сожалению, дают еретикам обилие полемического материала, и православные города и села захватываются иеговистами и прочими сектантами, которые постоянно расширяют свою миссионерскую деятельность.'
        cn: 那些为自己的恶意辩解的人，声称他们必须指责（或：揭发）他人，却不愿指责（或：揭发）自己，或者声称有必要公开教（会）中发生的事情——甚至那些不宜谈论的事情，并且引用诫命：「告诉教会」（马太福音 18:17）——让他们从自己小小的教会：家庭或弟兄开始吧。如果这在他们看来是好事，那么就让他们也羞辱母教会吧。我想，好孩子绝不会诽谤自己的母亲。但不幸的是，许多鲁莽的正教徒为异教徒提供了大量的论战材料，正教的城镇和乡村被上主见证人和其他宗派主义者所占据，而他们则不断扩大自己的传教活动。
    - type: paragraph
      text:
        ru: Духовным, рассудительным отцам известно, что этой демонической деятельностью (выставлением на позор клира и Церкви) они многих сделали иеговистами. А также всему миру известно, что таким неправославным способом еще ни одного иеговиста не удалось сделать православным.
        cn: 属灵、有分辨力的教父们知道，通过这种魔鬼的活动（将教士阶层和教会公开展现于羞辱之中），他们使许多人成为了上主见证会成员。同时，全世界也都知道，通过这种非正教的方式，至今仍未成功使任何一位上主见证会成员回归正教。
    - type: paragraph
      text:
        ru: Благий Бог терпит нас с любовью и никого не выставляет на позор, хотя и знает, как сердцеведец, наше греховное состояние. Также и святые никогда не оскорбляли грешного человека перед другими людьми, но с любовью и духовной деликатностью тайным образом способствовали исправлению зла. Мы же, несмотря на то, что являемся грешниками, делаем обратное (как лицемеры).
        cn: 良善的上帝带着爱忍受我们，不将任何一个人暴露于羞辱，尽管祂作为知心者，知道我们有罪的状态。同样，圣徒们也从未在他人面前冒犯一个有罪的人，而是以爱和属灵的精微（delicacy），暗中促进（帮助）邪恶的改正。然而，我们，尽管是罪人，却做着相反的事情（如同伪君子）。
    - type: paragraph
      text:
        ru: Только человеку, находящемуся под властью демона, простительно выставлять людей на позор (конечно тех людей, на которых демон имеет право) перед посторонними, напоминая им об их прошлом, чтобы поколебать немощные души. Нечистый дух не выносит на свет добродетели людей, но лишь их немощи. Однако люди, свободные от страстей и не имеющие в себе зла, исправляют зло добром. Если они вдруг увидят небольшую нечистоту, которая не очищается, то покрывают ее плитой, чтобы она не вызвала чувства брезгливости у кого-нибудь другого, кто ее заметит. Те же, которые выгребают мусор наружу, похожи на кур, которые копаются в…
        cn: 只有处于魔鬼权势之下的人，才可被原谅将人（当然是那些魔鬼有权柄辖制的人）在陌生人面前公开羞辱，提醒他们过去的事情，以此来动摇软弱的灵魂。不洁之灵不将人的德行显于光中，而只显露他们的软弱。然而，那些没有情欲、内心没有恶的人，以良善来纠正邪恶。如果他们突然看到一点点无法洁净的不洁之物，他们就会用石板将其覆盖，以免让其他注意到它的人产生厌恶感。而那些将垃圾向外掏出的人，则像那些在……中刨食的母鸡。
    - type: paragraph
      text:
        ru: Не является искренним и прямым ни тот, кто говорит кому-то правду в лицо, ни тот, кто ее публикует, но тот, кто имеет любовь и истинную жизнь и говорит с рассуждением, когда нужно и что нужно.
        cn: 那既不是真心实意的，也不是直接了当的：无论是当面告知某人真相的人，还是公布真相的人。真心实意、直接了当的是：拥有爱和真实生命，并且在需要时、按需要说的带着辨别的言语的人。
    - type: paragraph
      text:
        ru: Те, которые безрассудно обличают других, пребывают в духовном помрачении и злобе. Люди им представляются чурбанами, и они безжалостно обтесывают их и, несмотря на то, что люди от этого страдают, радуются тем квадратам, которые из них делают (в стиле кубистов)!
        cn: 那些不理智地指责别人的人，停留在属灵的昏暗和恶毒之中。在他们看来，人们就像木桩，他们无情地削凿他们，尽管人们因此受苦，他们却为自己从中做成的那些方块（以立体派风格！）而欢欣鼓乐！
    - type: paragraph
      text:
        ru: Те, которые спешат стать духовниками, хотя у самих еще много духовных токсинов, уподобляются недозрелой терпкой айве, которая, сколько бы сахара в нее ни сыпали, не может стать хорошим вареньем, а если и делается вареньем, то быстро прокисает. Трогательные слова и великие истины имеют ценность лишь тогда, когда исходят из истинных уст. И вмещают их только души, имеющие доброе произволение, и большие люди с чистым умом.
        cn: 那些急于成为神师的人，即使他们自己仍有许多精神毒素，也如同未成熟的、涩口的木瓜，无论往里面撒多少糖，都不能成为好的果酱；即使做成了果酱，也会很快变酸。感人的言语和伟大的真理只有从真实的口中说出才有价值。而只有拥有良善意愿的灵魂，以及心智洁净的伟大之人才能容纳它们。
    - type: paragraph
      text:
        ru: 'Внутренняя чистота прекрасной души истинного человека украшает его и внешне: божественная сладость любви Божией делает сладостным даже его внешний вид. Внутренняя красота души, духовно украшая и внешне освящая человека и выдавая его из-за присутствия в нем благодати Божией, украшает и освящает и саму убогую одежду, которую носит облагодатствованный человек Божий.'
        cn: 内在纯净的至真之人的美好灵魂，也在外表上妆点了他：神圣的上帝之爱的甘甜，使他甚至外表也甘甜宜人。灵魂的内在美，在属灵上妆点并外在圣化着人，因着他里面上帝恩典的同在而彰显他，也妆点并圣化了那位承受上帝恩典的人所穿着的简朴衣裳。
    - type: paragraph
      text:
        ru: Большую ценность имеет благословенный человек, который изменился внутренне и освятился внешне, нежели все люди, которые постоянно изменяют лишь внешность (одежду), а внутренне сохраняют своего ветхого человека вместе с его археологическими грехами.
        cn: 一个在内里改变、在外表成圣的蒙福之人，比所有那些只不断改变外表（衣着）而内里仍旧保留其旧人及其「考古级」罪恶的人，具有更大的价值。
    - type: paragraph
      text:
        ru: Большую ценность имеет одно слово смиренного человека с духовным опытом, которое он с сочувствием износит из самых глубин своего сердца, чем неудержимое многословие внешнего человека, с большой скоростью слетающее с его образованного языка, который не убеждает души людей, потому что является плотью, а не огненным языком Святой Пятидесятницы.
        cn: 一位具有属灵经验的谦卑之人，从他内心最深处怀着同情而说出的一个词语，比之外在之人以极快速度从其受过教育的舌头奔涌而出的滔滔不绝、难以抑制的多言，拥有更大的价值。后者无法使人的灵魂信服，因为它是肉体，而非圣五旬节的火焰之舌。
  - type: heading2
    text:
      ru: Гордость
      cn: 傲慢
    children:
    - type: paragraph
      text:
        ru: Самым большим гордецом является не тот, кто с гордостью хвалит себя, но тот, кто хвалится своим смирением.
        cn: 最大的骄傲者不是那个骄傲地赞美自己的人，而是那个夸耀自己谦卑的人。
    - type: paragraph
      text:
        ru: Тот, кто оправдывает себя, когда грешит, превращает свое сердце в пристанище для бесов и будет грешить еще больше и разрушать себя своим эгоизмом, если не сокрушит свое «я». Тот, кто оправдывает свои страсти, постепенно впадает в тяжкую болезнь, и тогда его выдает кашель[59].
        cn: 当人在犯罪时为自己辩护，他便将自己的心变成了邪魔的巢穴，他会犯更多的罪，并因自己的自我主义而毁灭自己，除非他打碎自己的「我」（ego）。那为自己的情欲辩护的人，会逐渐陷入重病，那时咳嗽就会将他暴露出来[59]。
    - type: paragraph
      text:
        ru: 'Тот, кто не осознает своей греховности и гордится, страдает от двух болезней (духовных): от чесотки и лишая[60]. Как бы он ни хотел скрыть свои раны и выглядеть прилично – зуд все равно будет его мучить, он будет чесаться и этим выдаст себя.'
        cn: 那不觉察自身罪性而骄傲的人，患有双重（属灵的）疾病：疥癣和皮癣[60]。无论他如何想要隐藏自己的伤口，表现得体面——瘙痒仍然会折磨他，他会搔痒，并因此暴露自己。
    - type: paragraph
      text:
        ru: Не терпящие замечаний даже от людей, которые их любят, терпят насмешки со стороны людей, мыслящих по-мирски, и в конце концов остаются кривыми брусьями и сами делаются духовно непригодными, как кривые доски, которые не поддаются рубанку столяра и не могут быть использованы для изготовления мебели, но заканчивают тем, что их используют для заливки бетона или для строительных лесов, так что их топчут ногами и пачкают, пока они не испортятся и не окажутся в огне.
        cn: 那些甚至不愿忍受爱他们之人给予的建议的人，却忍受着按世俗方式思考之人的嘲弄，最终仍然是弯曲的木料，他们自己也变得灵性上毫无用处，如同那些不服从木匠的刨子、无法被用于制作家具的弯曲木板，它们最终被用于浇筑混凝土或用作脚手架，在那里它们被踩踏、弄脏，直到它们腐烂并最终落入火中。
    - type: paragraph
      text:
        ru: Очень гордый, особенно если он гневлив, не получает пользы даже от очень смиренного, когда тот перед ним смиряется, но становится в большинстве случаев более наглым, хотя даже диавол исчезает перед лицом смирения. Поэтому божественная благодать уходит от гордого и переходит к смиренному.
        cn: 一个非常骄傲的人，尤其是当他易怒时，即使面对一个在他面前谦卑的人，也得不到益处，反而在大多数情况下变得更加放肆，尽管魔鬼在谦卑面前也会消失。因此，神圣的恩典会离开骄傲的人，而转向谦卑的人。
    - type: paragraph
      text:
        ru: Высоко думающий о себе обнаруживает тем самым, что он вне себя (безумен), ибо вместо того, чтобы благодарить Бога за все доброе, что Тот ему даровал, он оскорбляет Его, считая своей собственностью дарования Божии.
        cn: 一个对自己评价甚高的人，就此显明他是在「身外」（意指心智失常/疯狂），因为他非但没有为上帝赐予他的一切良善感谢祂，反而冒犯了祂，将上帝的恩赐视为自己的所有物。
    - type: paragraph
      text:
        ru: Те, которые постоянно гордятся, постоянно оскорбляют самих себя, потому что у них никогда уже не будет духовных взлетов, но одни падения, пока они не разобьются, так как не имеют сердечного сокрушения и смиренномудрия.
        cn: 那些持续骄傲的人，持续地在冒犯他们自己，因为他们将永不会再有属灵的飞升，而只有跌落，直到他们被击碎，因为他们不具备心碎和谦卑智慧。
    - type: paragraph
      text:
        ru: Те, у которых в этом мире не бывает падений, хотя у них есть мирская гордость, обнаруживают тем самым, что их гордость превысила всякие пределы (достигла сатанинской степени) и что их падение совершилось с задней стороны высокой вершины (как падение Денницы)[61].
        cn: 那些在此世间没有跌倒的人，虽然他们拥有世俗的骄傲，却由此表明他们的骄傲已超越了一切界限（达到了撒旦的程度），并且他们的跌倒是从高耸顶峰的背面发生的（如同晨星的坠落）[61]。
    - type: paragraph
      text:
        ru: Тот, кто имеет большую гордость, хуже бесноватого, потому что гордость постоянно раздувает его, пока он наконец не лопнет. Тогда как человек, в котором есть нечистый дух, не только мучается и искупает свои грехи (или приобретает венец, если он сам не был причиной своего состояния), но по необходимости и смиряется перед людьми, и Бог в конце концов освобождает его, так что его душа получает сугубую пользу.
        cn: 怀有巨大骄傲的人，比被邪灵附体的人更糟，因为骄傲不断地吹胀他，直到他最终爆裂。而一个身上有不洁之灵的人，不仅受苦并赎清自己的罪（或者，如果他本人不是造成这种状态的原因，则获得冠冕），而且必然在人前谦卑下来，上帝最终也会释放他，以至于他的灵魂获得双倍的益处。
    - type: paragraph
      text:
        ru: Гордость сильно препятствует благодати Божией, а гордый помысел оскверняет наши добродетели, подобно птичьему помету, когда он попадает в яичницу, которая тогда годится только на то, чтобы ее выбросили вместе со сковородой.
        cn: 骄傲极大地阻碍了上帝的恩典，而骄傲的意念玷污了我们的美德，如同鸟粪落入炒鸡蛋中，这时炒鸡蛋就只配与煎锅一同被扔掉。
    - type: paragraph
      text:
        ru: Те, которые могут терпеть очень гордых, не льстя им, являются самыми смиренными, самыми верными и самыми праведными людьми, потому что гордые будут их постоянно оскорблять и уничижать.
        cn: 那些能够容忍极度骄傲之人，却不谄媚他们的人，是最谦卑、最忠信和最正直的人，因为骄傲之人会持续地侮辱和贬低他们。
    - type: paragraph
      text:
        ru: Мы должны быть более благодарны тем, которые нас смиряют, обижают и огорчают, нежели тем, которые кормят нас почестями и сладкими словами или вкусной едой и сладостями, потому что огорчения являются самым лучшим лекарством для души.
        cn: 我们应当更加感谢那些使我们谦卑、冒犯我们和使我们忧伤的人，而不是那些用荣誉、甜言蜜语、美味的食物或甜点来喂养我们的人，因为忧伤是灵魂最好的良药。
    - type: paragraph
      text:
        ru: Не будем исследовать, справедливо или несправедливо нас огорчили, по любви или по злобе, были ли мы виноваты меньше или на нас вообще не было никакой вины, но будем с радостью принимать духовную пользу, которую нам доставляет всякое духовное испытание, а также за все будем славить Бога и благодарить людей, которые нас обидели.
        cn: 我们不要去究察，令我们忧伤之事是公正的还是不公正的，是出于爱还是出于恶意，我们的过错是少一些还是完全没有过错，而是要以喜乐之心接受任何一种精神考验带给我们的属灵益处，并为此称颂上帝，感谢那些冒犯我们的人。
    - type: paragraph
      text:
        ru: Удары необходимы для спасения нашей души, потому что они очищают душу. Чем больше бьют по одежде и трут ее, тем больше она очищается, подобно тому как осьминог или каракатица от множества ударов размягчаются и очищаются от чернил[62].
        cn: 打击对于我们灵魂的救赎是必要的，因为它们能洁净灵魂。一件衣服被击打、揉搓得越多，它就越洁净，就像章鱼或墨鱼，因着众多的击打而变软并清除墨汁一样[62]。
    - type: paragraph
      text:
        ru: Наоборот, мирские ласкательство и похвалы очень вредят душам, поврежденным духовно, а для людей добродетельных являются воздаянием в этой суетной жизни, если они не скрывают свои добродетели. Похвалы должны быть меньше наших добродетелей, если мы хотим, чтобы чаша духовных весов в день Суда склонилась к праведным и мы узрели бы лицо Божие.
        cn: 相反，属世的奉承和赞扬对那些精神上受损的灵魂是非常有害的，而对于有德行之人，如果他们不隐藏自己的美德，这些赞扬就是在这虚妄生命中的报偿。我们若希望在审判之日，属灵天平的秤盘倾向义者，使我们得以瞻仰上帝的面容，那么这些赞扬就必须少于我们的美德。
    - type: paragraph
      text:
        ru: Горе нам, когда нас расхваливают, как хорошие арбузы, хотя внутри мы тыквы! (Горе тебе, окаянный Паисий!)
        cn: 我们被夸赞为好西瓜，尽管内里却是南瓜时，我们就有祸了！（你这可怜的帕伊西奥斯，你有祸了！）
    - type: paragraph
      text:
        ru: 'Горе и трижды горе человеку, который невнимателен и производит впечатление, что он святой, потому что тогда он наносит себе вред навеки, ибо, когда умрет, никто не будет молиться о упокоении его души, хотя у него будет нужда в этом, но все будут ублажать его. (К несчастью, я и в этом не был внимателен и совершил преступление против своей души: молитесь, чтобы Благий Бог упокоил мою душу.)'
        cn: 祸哉！三倍的祸哉！临到那不警醒（невнимателен），却给人圣洁印象的人，因为如此他便永远损害了自己。当他逝世时，无人会为他灵魂的安息祈祷，尽管他需要这些，但所有人都将称赞他（ублажать его）。（不幸的是，我在这一点上也不警醒，并且冒犯（совершил преступление）了自己的灵魂：请祈祷，愿良善的上帝使我的灵魂安息。）
    - type: paragraph
      text:
        ru: 'Мирской покой, а также самодовольное успокоение в помыслах никогда не приносят душе покоя: ни в сей жизни, потому что тогда она лишается божественного утешения, ни в будущей – но начинают мучить человека уже здесь, перерастая в нестерпимые вечные мучения.'
        cn: 世俗的安宁，以及思想中自满的平静，绝不会给灵魂带来安宁：在今生不会，因为那时它失去了神圣的慰藉；在来世也不会——但它们会从这里就开始折磨人，并演变为无法忍受的永恒折磨。
    - type: paragraph
      text:
        ru: Человек, которого огорчает то, что он упал в глазах других людей из-за своей невнимательности, и которого не огорчает то, что он огорчил Христа, постоянно будет огорченным и лишенным утешения, постоянно будет падать, пока не изменит образ своего поведения и не смирится. Только тогда он спасется от падений в этой жизни и от вечного падения, которое его ожидает.
        cn: 一个人，若因自己疏忽大意而在他人眼中失足而感到忧伤，却不因自己使基督忧伤而感到忧伤，他将持续处于忧伤和缺乏慰藉之中，他将持续跌倒，直到他改变自己的行为模式并谦卑下来。唯有那时，他才能从今生的跌倒以及那等待着他的永恒的跌落中得救。
    - type: paragraph
      text:
        ru: Тот, кто радуется, когда его хвалят люди, осмеивается демонами.
        cn: 那在人赞美他时而喜乐的人，被邪魔嘲笑。
    - type: paragraph
      text:
        ru: У тщеславного никогда нельзя найти духовных плодов, а если и найдется несколько, то они будут гнилыми, тогда как смиренный, благодаря тому что имеет духовную нищету (Мф. 5:3), имеет духовное богатство.
        cn: 在虚荣的人那里，绝找不到属灵的果实；即便能找到一些，它们也会是腐烂的。然而，谦卑的人，因为拥有「心灵的贫乏」（马太福音 5:3），却拥有属灵的财富。
    - type: paragraph
      text:
        ru: Мирские люди, которые телесно питаются обильной пищей, а душевно – хвалебными словами, остаются голодными и пустыми духовно. Престолы и власть, которых они домогаются, останутся в этом суетном мире, а сами они останутся со своими мечтами, которые в иной жизни будут их мучить еще больше, потому что станут для них причиной лишения небесных благ. Тогда как те, которые подвизались духовно и предпочитали скудную пищу и убогую скамейку (престолам) и сами сажали себя на скамью подсудимых, то есть сами себя осуждали, освобождаются от осуждения Праведного Судии в день Суда и наследуют рай, как усердные чада Божии.
        cn: 那些在肉体上以丰盛食物滋养自己，而在灵魂上以赞美之词喂养自己的平信徒，在精神上仍是饥饿和空虚的。他们所追求的宝座和权力将留在这个虚妄的世界里，而他们自己则将带着自己的梦想留下来，这些梦想将在另一生中使他们遭受更多折磨，因为这些梦想将成为他们丧失天国福祉的原因。然而，那些在精神上刻苦修行、更喜爱粗茶淡饭和简陋的板凳（胜过宝座），并自行将自己置于被告席上，即自我谴责的人，在审判日将免于公义审判者的定罪，并作为上帝殷勤的子女承受乐园。
    - type: paragraph
      text:
        ru: Когда мы в сей жизни ищем себе оправдания и избегаем укоризн, – показываем этим, что в нас еще живо мирское мудрование и что в нашей печали совсем нет покаяния, но одно человекоугодие, которое отравляет душу и тело источаемой им желчью.
        cn: 当我们今生寻求为自己辩护并躲避责备时，——我们由此表明，在我们里面世俗的思辨仍旧活跃，并且在我们的忧愁中完全没有悔改，而只有取悦于人，它以其所流出的苦胆毒害灵魂和身体。
    - type: paragraph
      text:
        ru: Тот, кто усердно плачет оттого, что огорчил своими грехами Христа, незамедлительно принимает божественное утешение – соответственно силе своей печали.
        cn: 那殷勤地因着自己的罪恶冒犯了基督而哭泣的人，会立即领受神圣的安慰——这安慰与他忧伤的程度相称。
    - type: paragraph
      text:
        ru: Ревностная и чувствительная душа не получит пользы от подробного рассмотрения своих проступков, пока не укрепится духовно, потому что лукавый борется с нею с помощью сверхчувствительности, вызывая в ней беспокойство. Лукавый не идет против, но вместе с нами по течению. То есть он пытается усилить плач и печаль, чтобы заставить душу чрезмерно скорбеть и чтобы задушить ее беспокойством.
        cn: 热切而敏感的灵魂，在属灵上尚未得坚固之前，不会从详细审察自己的过失中得益，因为那恶者会利用其超敏性来与她争战，并在她里面激起不安。恶者并非逆流而动，而是与我们顺流而下。也就是说，他试图加剧哭泣和忧伤，好让灵魂过度悲痛，并用不安将其窒息。
    - type: paragraph
      text:
        ru: Женщины, естественно, бывают сильнее боримы сверхчувствительностью, которую возбуждает лукавый, так как здесь им не помогает их большое сердце и слабый, по сравнению с мужским, рассудок (ибо у мужчин больше рассудочности и мужества, но меньше сердечности).
        cn: 女性自然地更常被由那恶者激起的过度敏感性所攻击（боримы），因为她们巨大的心和相较于男性来说较弱的理智（рассудок）在此处无法帮助她们（因为男性拥有更多的理智性和勇气，但较少的心性）。
    - type: paragraph
      text:
        ru: Но если ум женщины окажется хоть и небольшим, но отточенным в лукавстве, а в ее характере будет больше злобы и меньше любви, и это она будет считать мужеством и будет гордиться этим, тогда – Боже упаси! – в непогрешимости она может превзойти даже римского папу, а в жестокости – Муссолини.
        cn: 但是，如果一个女人的心智（ум）即便很小，却在诡计（лукавстве）上磨练得十分锋利，并且在她的性格（характере）中，恶毒（злобы）多于爱（любви），而她却将此视为刚毅（мужеством）并以此为荣，那么——求主保佑！——在「绝无谬误」（непогрешимости）上，她甚至可以超越罗马教宗（римского папу），在残酷（жестокости）上，则可以超越墨索里尼（Муссолини）。
    - type: paragraph
      text:
        ru: Большим, чем сам диавол, врагом человека является злоба в соединении с гордостью. Мало того, что они оскверняют добродетели и делают их бесполезными, они также изнуряют тело и мучат душу.
        cn: 比魔鬼本身更大的仇敌，是与骄傲结合在一起的恶意（злоб）。它们不仅玷污了德行，使其变得毫无用处，它们还使身体衰弱，并折磨灵魂。
    - type: paragraph
      text:
        ru: Как одна маленькая дырочка в банке с консервами может ее испортить, потому что пропускает воздух, так и один-единственный гордый помысел, проникая в голову человека, заставляет его высоко думать о себе[63], и все его добродетели становятся негодными.
        cn: 正如罐头盒上的一个小孔能使它变质，因为它让空气进入，同样，一个唯一的骄傲念头，一旦进入人的头脑，就会使他自视甚高[63]，他所有的美德都会变得毫无价值。
    - type: paragraph
      text:
        ru: Чаще всего наибольший ущерб нам причиняет эгоизм, потому что он является самым резвым и строптивым исчадием гордости.
        cn: 通常对我们造成最大伤害的是自我主义，因为它乃是骄傲最活泼、最倔强的孽种。
    - type: paragraph
      text:
        ru: Если бы не было этого «я» и люди знали бы только «ты» и «он», в мире царили бы смирение, любовь и благословение Божие. Люди тогда на земле жили бы, как в раю. Благий Бог да подаст сие благословение Своим созданиям. Аминь.
        cn: 如果没有这个「我」，而人们只知道「你」和「他」，那么谦卑、爱和上帝的祝福就会在世上掌权。那时人们在地上生活，就会如同在天堂一样。愿良善的上帝将此祝福赐予祂的受造物。阿门。
  - type: heading2
    text:
      ru: Искушения
      cn: 试探
    children:
    - type: paragraph
      text:
        ru: Испытания, попускаемые Богом, соответствуют нашим силам, но к ним, к сожалению, часто присоединяются насмешки или нерассудительность немилосердных людей, и тогда уже мы сгибаемся. Сильный ветер ломает тонкие деревья и с корнем вырывает из земли те, у которых нет глубоких корней, тогда как деревьям, имеющим глубокие корни, он помогает пустить корни еще глубже.
        cn: 上帝所容许的考验，与我们的力量相称，但不幸的是，它们常常伴随着不仁慈之人的嘲讽或不审慎的行为，这时我们便会屈服。强风折断细弱的树木，并将根系不深的树木连根拔起，而对那些根系深厚的树木，它则助其扎根更深。
    - type: paragraph
      text:
        ru: Однако Богу неугодно дикое и бессердечное отношение к другим людям, когда одних вырывают с корнем, а других ломают, но Ему угодно милосердие, потому что и Сам Он милосерден. Ему угодны желание помочь, любовь и сострадание к ближним, потому что люди не деревья, но образы Божии.
        cn: 然而，神不喜悦那种野蛮且无情地对待他人的态度，那种将一些人连根拔起，将另一些人折断的态度；祂所喜悦的是怜悯，因为祂自己也是怜悯的。祂喜悦帮助的意愿，喜悦对邻人的爱与同情，因为人不是树木，而是神的肖像。
    - type: paragraph
      text:
        ru: Конечно, никто не может повредить человеку, кроме самого человека.
        cn: 诚然，除了人自己，没有人能伤害人。
    - type: paragraph
      text:
        ru: Через посылаемые Богом испытания каждый человек испытывается и сам узнает свое духовное состояние, принуждается к смирению и затем получает прощение своих грехов, если смиренно и с радостью принимает все эти испытания как лекарство для своей души, а также с терпением прославляет и благодарит Бога. Счастье для нас, что Бог попускает нам испытания, потому что иначе в день Суда мы имели бы и скрытые страсти, и чрезмерные требования. Если бы Он закрыл на это глаза и принял нас в рай в таком состоянии, в каком мы находились бы тогда, то и там мы показали бы себя. Поэтому Он здесь попускает нам искушения, чтобы они вытряхнули из нас пыль, для того чтобы наша душа очистилась с помощью скорбей и слез и мы были вынуждены прибегать к Богу в поисках спасения.
        cn: 通过上帝降下的考验，每个人都受到试炼，并由此了解自己的属灵状态，被迫走向谦卑，随后获得罪的赦免，如果他谦卑且满怀喜乐地接受所有这些考验，视之为他灵魂的良药，并耐心赞美和感谢上帝。对于我们来说，上帝允许我们经历考验是我们的幸福，因为否则在审判之日，我们就会带着隐藏的激情和过度的要求。如果祂对此视而不见，接纳我们以那时的状态进入天堂，那么我们在那里也会显露出来。因此，祂在这里允许我们经历试探，好让它们抖掉我们身上的尘土，以便我们的灵魂在忧患和泪水中得以洁净，而我们也被迫寻求上帝以获得救赎。
    - type: paragraph
      text:
        ru: Самые несчастные в мире люди те, которые удалены от Бога. Они не будут счастливыми ни в этой жизни, ни в будущей – вечной. Но еще несчастнее этих людей бесы, которые тысячи лет назад удалились от Бога и продолжают в своей злобе и гордости удаляться от Него, оставаясь нераскаянными.
        cn: 世上最不幸的人，是那些远离上帝的人。他们在今生和未来的永恒生命中都不会幸福。但比这些人更不幸的是邪魔（бесы），它们在数千年前就远离了上帝，并继续在它们的邪恶与骄傲中远离祂，保持着不悔改的状态。
    - type: paragraph
      text:
        ru: Самыми же блаженными людьми являются те, которые показали величайшее покаяние, соединенное с душевной болью и внутренним сокрушением, и таким образом сокрушили гордого врага, смирили свою непокорную плоть подвигами, подчинив ее духу, и принесли своим покаянием (обращением к Богу) величайшую радость небу.
        cn: 然而，最蒙受祝福的人是那些展现出最伟大的、与心灵的痛楚和内在的痛悔相伴的忏悔（покаяние），并因此击碎了骄傲的仇敌，以苦修（подвигами）制服了他们悖逆的肉体，使其顺服于灵，并以他们的忏悔（обращением к Богу）为天堂带来了最大的喜乐。
    - type: paragraph
      text:
        ru: Когда грех пребывает в душе человека на протяжении долгого времени, тогда диавол приобретает на него больше прав и тогда, чтобы он нас оставил, нам нужно разрушить старый дом и построить новый[64].
        cn: 当罪恶长久地驻留在人灵魂之中时，魔鬼便在他身上获得了更多的权利。那时，为了让他（魔鬼）离开我们，我们需要拆毁旧房，建造新房[64]。
    - type: paragraph
      text:
        ru: Имеющих в себе беса от рождения ждет великое воздаяние, если они не будут роптать, пока не освободятся по благодати Божией. Те же, которые сами стали причиной своей одержимости, сами должны и подвизаться.
        cn: 那些生来就被鬼附身的人，若在蒙受上帝恩典得释放之前不抱怨，则有伟大的报偿等待着他们。而那些自己造成被附身的人，则必须自己去努力奋斗（подвизаться）。
    - type: paragraph
      text:
        ru: Родившиеся со множеством наследственных страстей, подвизавшиеся, чтобы отсечь их, и стяжавшие добродетели достойны похвалы более, чем получившие в наследство от родителей долги и сумевшие их отдать и приобрести большое состояние.
        cn: 那些携带着诸多遗传性情欲而生、曾竭力克制并最终根除它们、且获得了诸般美德的人，比那些从父母那里继承了债务、却设法偿还并积累了巨额财富的人，更值得称赞。
    - type: paragraph
      text:
        ru: Не нужно беспокоиться в этой жизни о несправедливостях, которые причинили нам люди или бесы, потому что это не беспокоит и Бога, ибо Он записывает все эти несправедливости и хранит их с процентами в Своей небесной сберегательной кассе.
        cn: 在今生，我们无需为人们或邪灵对我们所施加的不公而忧虑，因为这同样不会令上帝忧虑，祂记录所有这些不公，并将其及其利息一同储存于祂的天上储蓄所中。
    - type: paragraph
      text:
        ru: Неразумен человек, ищущий человеческой справедливости, и еще неразумнее тот, кто не забывает обид, причиненных ему другими людьми, и добра, которое он сделал для других.
        cn: 寻求人的公义的人是不明智的，而不忘记别人所加诸于他的冒犯，以及他为别人所做的善事的人，就更不明智了。
    - type: paragraph
      text:
        ru: Нужно быть более благодарными к тем, которые отнеслись к нам неблагодарно, чем к тем, которые постоянно нас благодарят, воздавая нам в этой суетной жизни.
        cn: 对那些以不感恩待我们的人，我们要比对那些不断感谢我们、在这虚妄生命中报答我们的人，更加感恩。
    - type: paragraph
      text:
        ru: Также наилучшим пожеланием для нас должно быть незаслуженное проклятие, если мы принимаем его молчаливо и с добротой.
        cn: 同样地，对于我们而言，如果我们以静默和良善（之心）接受，那么最好的祝愿应当是不配得的咒诅。
    - type: paragraph
      text:
        ru: Конечно, пребывающие с Богом не могут быть прокляты, потому что в них нет зла, но одно добро, и какое бы зло ни делали этим освященным людям, оно теряет силу, а они чувствуют в себе великую скрытую радость.
        cn: 当然，那些与上帝同在的人不可能被咒诅，因为他们里面没有邪恶，而只有良善。无论对这些被祝圣的人施加何种邪恶，它都会失去力量，而他们在自身内感受到巨大的隐秘喜乐。
    - type: paragraph
      text:
        ru: Люди же, удаленные от Бога, всегда безутешны и мучаются вдвойне, потому что тот, кто не верит в Бога и будущую жизнь, не только остается безутешным, но и душу свою осуждает на вечные мучения.
        cn: 那些远离上帝的人，总是没有安慰，并承受双倍的痛苦，因为不相信上帝和未来生命的人，不仅依然得不到安慰，而且还将自己的灵魂定罪于永恒的苦难。
    - type: paragraph
      text:
        ru: Люди, которые не верят в Бога или верят в Него меньше, чем в свое «я», несут миру разрушение. Однако им не удается исполнить свои бесовские планы, потому что даже если эти злые люди смогут собраться вместе, то сразу же начинают грызть друг друга и рассеиваются злыми бесами, ибо диавол, который сводит их вместе, не имеет ни любви, чтобы их сдружить, ни смирения, чтобы они могли выносить друг друга, ни терпения, и таким образом зло рассеивается, не успев сделать великого зла.
        cn: 不信靠上帝，或相信祂少于相信他们「自我」的人，给世界带来毁灭。然而，他们无法执行他们的魔鬼式计划，因为即使这些邪恶的人能够聚集在一起，他们立刻就开始互相撕咬并被邪恶的邪魔驱散，因为召集他们在一起的魔鬼，既没有爱来使他们成为朋友，也没有谦卑来使他们能够彼此忍耐，也没有耐心，这样，邪恶在尚未造成巨大恶果之前就消散了。
    - type: paragraph
      text:
        ru: 'Мирской дух, к несчастью, постоянно оттачивает ум людей в лукавстве, и они считают, что добились успеха, когда обижают своих собратьев и при этом еще слышат о себе: «Какой ловкий! Прямо как дьявол», – хотя при этом и страдают от внутренних угрызений совести (этого малого ада).'
        cn: 不幸的是，属世的灵不断磨砺人的心智，使其变得狡诈，而当他们伤害自己的同胞、却仍听到有人议论他们说：「多么机灵！简直就像魔鬼一样」时，他们便自认为取得了成功——尽管此时他们正遭受着内在良心（这小小的地狱）的折磨。
    - type: paragraph
      text:
        ru: Нет большего огня, чем внутреннее жжение совести, которая постоянно мучает душу и, как червь, точит ее в этой жизни. Но еще сильнее ее будет точить в жизни иной, будущей, червь неусыпающий, если человек не покается в сей жизни и не искупит нанесенные своим собратьям обиды, хотя бы своим благим произволением, если он не может этого сделать по-другому.
        cn: 没有比良心内在的灼烧更大的火焰了，它不断地折磨着灵魂，像一条虫子，在今生啃噬着它。但是，如果一个人在今生不悔改，不在今生弥补他给他的弟兄们造成的伤害，哪怕是凭着他良善的意愿，如果他不能以其他方式做到的话，那么在另一个、未来的生命中，那不眠的虫子将会更厉害地啃噬他。
    - type: paragraph
      text:
        ru: Нераскаянный человек является самым неразумным человеком в мире не только потому, что у него постоянно тяжесть на душе, так как он не кается, чтобы освободиться от этого малого ада, ведущего к еще худшему, вечному, но и потому, что лишается на земле райских радостей, которые продолжаются и бывают намного сильнее в раю, возле Бога.
        cn: 未悔改之人是世上最不明理之人，不仅因为他因着不悔改而心头常感重负，无法从这通向更糟之永恒小地狱中得释放，也因为他被剥夺了地上的天堂之乐，而这种快乐会在天堂、在上帝身边持续，并会强大得多。
    - type: paragraph
      text:
        ru: Нет в мире большей радости, чем любовь Божия, которая еще в этой жизни вместе с божественной нежностью подается в изобилии ревностным чадам Божиим и которая может быть лишь пережита, но не выражена словами. Но еще больше та любовь, которую Бог сохраняет для нас в раю и не подает нам сейчас, потому что мы не можем вместить ее в своих бренных сердцах!
        cn: 世上没有比上帝之爱更大的喜乐了，上帝之爱在今生就与神圣的温柔一同丰盛地赐予热诚的上帝儿女，这种爱只能被经历，不能用言语表达。但更大的爱，是上帝为我们在天堂里所存留的、现在尚未赐予我们的爱，因为我们这必朽坏的心无法容纳它！
  - type: heading2
    text:
      ru: Святость
      cn: 圣德
    children:
    - type: paragraph
      text:
        ru: В огне искушений святые стяжали святость и духовный опыт, который они оставили в наследство нам, их последователям, чтобы мы предохраняли себя от коварства человекоубийцы.
        cn: 在试探之火中，圣徒们获得了圣洁和属灵的经验，他们将其作为遗产留给了我们，他们的追随者，以便我们保护自己，免受那杀人者（注：指魔鬼）的诡计。
    - type: paragraph
      text:
        ru: Святые подъяли великие подвиги против страстей и победили, и благодаря этому получили от Христа победные венцы и обильную благодать, и сейчас помогают нам на небе своими молитвами. Мы же должны воздавать им за это великой благодарностью и благоговением.
        cn: 圣者们曾举起伟大的苦修（подъяли великие подвиги）来对抗（против）诸情欲（страстей），并获得了胜利（победили）。正因此，他们从基督那里领受了胜利的冠冕（победные венцы）和丰沛的恩典（обильную благодать），而今在天上以他们的代祷帮助我们（помогают нам на небе своими молитвами）。我们则当为此向他们献上（воздавать им за это）巨大的感谢（великой благодарностью）和敬畏（благоговением）。
    - type: paragraph
      text:
        ru: Тот, кто почитает святых, без сомнения, намного больше почитает Пресвятую Богородицу. Точно так же, как почитающий Пресвятую Богородицу еще больше почитает Святую Троицу.
        cn: 那敬重众圣者的，无疑更加敬重至圣提奥托科斯（Theotokos，上帝之母）。正如敬重至圣提奥托科斯的，更加敬重神圣三一（Holy Trinity）。
    - type: paragraph
      text:
        ru: Святые не смущаются, как люди, когда мы почитаем меньшего святого больше другого, большего, потому что они святые и у них нет человеческой мелочности. Святые имеют, конечно, человеческую святость, но не божественное совершенство, которое имеет Христос. Поэтому не нужно смущаться, если мы заметим какое-нибудь небольшое несовершенство среди множества добродетелей святых. Опять же не нужно брать в пример несовершенств, которые были у святых в начале их духовного пути, оправдывая тем самым свои немощи. Ибо Бог в начале их духовного пути учил их, забирая у них ненадолго Свою благодать, чтобы они познали свою человеческую немощь, смирились, а затем восприняли сугубую благодать для того, чтобы мы имели пример для подражания.
        cn: 圣人不似世人那般为我们尊崇一位次要的圣人胜过另一位更伟大的圣人而感到困扰，因为他们是圣人，他们没有人类的鸡毛蒜皮。圣人当然拥有属人的圣洁，但没有基督所拥有的神性完美。因此，如果我们在圣人众多的美德中注意到些许微小的瑕疵，我们也不必因此而困扰。同样，我们也不应拿圣人在他们灵修道路之初所曾有的不完美作为榜样，以此为自己的软弱辩护。因为上帝在他们灵修道路的起始教导他们，暂时收回了祂的恩典，好使他们认识到自己属人的软弱、变得谦卑，然后领受加倍的恩典，以致我们有可效法的榜样。
    - type: paragraph
      text:
        ru: Также откуда нам знать, не было ли большинство немощей, которые показывали святые, притворством, с помощью которого они скрывали свою святость? Потому что если бы святые выдавали[65]свою святость, то у них ее не было бы и они не были бы и святыми.
        cn: 此外，我们如何得知圣徒们所显现的大多数软弱，不是一种伪装，借此来隐藏他们的圣洁呢？因为如果圣徒们宣扬[65]自己的圣洁，那么他们就没有圣洁，也就不再是圣徒了。
    - type: paragraph
      text:
        ru: Поэтому мы должны относиться к ним с большим благоговением и быть очень благодарными по отношению даже к неизвестным святым, которые молчаливо помогают нам своими молитвами и молчаливым примером своего великого смиренномудрия, из-за которого они – как мне говорит помысел – усердно просили Бога, чтобы Он оставил их в неизвестности и чтобы люди их не почитали, а они продолжали бы помогать людям тем же способом, как и при жизни – втайне (Мф. 6, 4).
        cn: 因此，我们应该怀着更大的崇敬之心对待他们，并对那些甚至不知名的圣徒心怀感激。他们以他们的祷告和他们伟大谦卑智慧的静默榜样，默默地帮助着我们。因为这份谦卑智慧，——我的思念告诉我——他们曾恳切地祈求上帝，求祂让他们保持不为人知，不被人敬奉，而他们则将继续以与生前相同的方式——秘密地——帮助人们（马太福音 6:4）。
    - type: paragraph
      text:
        ru: 'Каждый святой шел своим особым путем духовного подвига, а потому и теперь помогает нам своим особым святым способом, а также обращается к каждой душе на том языке, на котором она разговаривает и который может понять, чтобы она получила пользу. Все святые подвизались ради любви Христовой: святые мученики пролили свою кровь, преподобные отцы пролили пот и слезы, поставили над собой духовные опыты, как хорошие фармацевты, сами пробовали горькое ради любви к образу Божию, оставив после себя духовные рецепты, с помощью которых мы предохраняемся от зла или излечиваемся от своих старых духовных болезней, приобретаем здоровье и, если поревнуем уподобиться им в подвиге, становимся святыми.'
        cn: 每位圣徒都走过自己独特的属灵苦修之路，因此，他们现在也以自己独特的圣洁方式帮助我们，并以每颗灵魂所使用的、所能理解的语言向其说话，好让它得益。所有圣徒都是为了基督的爱而苦修：圣殉道者流了他们的血，可敬的教父们流了汗水和眼泪，他们将自己置于属灵的实验之中，如同优秀的药剂师，为了爱上帝的形象而亲自品尝苦涩，留下属灵的药方，我们借此得以防范邪恶或治愈我们旧有的属灵疾病，获得健康；并且，如果我们热心效法他们的苦修，我们也将成为圣徒。
    - type: paragraph
      text:
        ru: 'Конечно, ни все подвиги преподобных: их посты, бдения и так далее, ни муки всех святых мучеников не могут сравниться со страданиями нашего Господа, потому что всем им Своей божественной силой помогал Христос, услаждая Своей великой любовью их страдания. Поэтому меч палача у горла казался им приятнее смычка скрипки. Для Себя же Христос совсем не использовал Своей божественной силы, перенося великую боль в Своем чувствительном теле ради великой любви к Своему созданию, только ощутив которую, наш внутренний человек будет настоящим человеком. Иначе он будет более бесчувственным, чем бесчувственные создания Божии, потому что солнце ощутило страдания Господни и померкло, будучи не в силах смотреть на них, и земля убоялась, когда увидела их, и камни распались, и гробы сотряслись так сильно, что разбудили многих давно усопших и выпустили их, чтобы они выразили свое возмущение против неблагодарности людей к своему благодетелю и избавителю Богу.'
        cn: '诚然，所有圣贤的苦修——他们的禁食、彻夜祈祷等等，以及所有圣殉道者的痛苦，都无法与我们主所受的苦难相比。因为基督以祂的神圣力量帮助了他们所有人，用祂伟大的爱抚慰了他们的苦难。因此，对他们而言，刽子手架在喉间的剑似乎比小提琴的琴弓更令人愉悦。


          而基督为祂自己则完全没有使用祂的神圣力量，祂在自己敏感的身体里承受了巨大的痛苦，只因对祂所创造之物的伟大爱。唯有感受到这份爱，我们的「内在之人」才会成为真正的人。否则，他就会比上帝无感动的造物更加麻木不仁。因为太阳感受到了主的苦难，它熄灭了，不忍观看；大地看到了苦难，就惧怕了；磐石崩裂；坟墓猛烈地震动，以至于唤醒了许多早已逝去的人，并让他们出来，以表达他们对人类忘恩负义、不领情于他们的施恩者和救主上帝的不满。'
    - type: paragraph
      text:
        ru: Поэтому, раз мы не принесли Христу ничего своего, по крайней мере, не будем Его огорчать, но принесем Ему свою благодарность и с великим благоговением будем праздновать Его Святые Страсти[66]. Также, чтобы нам самим получить помощь, с благоговением будем почитать наших святых, которые ради любви Христовой пролили либо кровь, либо пот и слезы. И, слушая их синаксарий «В тойже день память святаго…»[67], будем стоять прямо и с благоговением, как солдаты, стоящие по стойке смирно, когда зачитывают имена их героически павших собратьев.
        cn: 因此，既然我们未曾将我们自己的任何东西献给基督，至少，我们不应使祂忧伤，而应向祂献上我们的感谢，并怀着极大的敬畏庆祝祂的神圣受难[66]。同样，为了我们自己得到帮助，我们应怀着敬畏尊敬我们的圣徒，他们为了基督的爱流了血，或流了汗和泪水。并且，当我们听到他们的《日课》中「在同一天，纪念圣徒……」[67]时，我们应站直，怀着敬畏，如同士兵立正站好，当他们英勇牺牲的战友的名字被宣读时那样。
  - type: heading2
    text:
      ru: Рассуждение
      cn: 论述
    children:
    - type: paragraph
      text:
        ru: Рассудительное подвижничество в соединении со смирением и любовью очень быстро и при меньших телесных трудах делает человека святым.
        cn: 有辨识力的苦修，若与谦卑和爱结合，能非常迅速地使人成圣，且只需较少的身体劳作。
    - type: paragraph
      text:
        ru: Насколько человек продвигается в духовной жизни, следя за собой, настолько открываются очи его души и настолько лучше он видит свои недостатки и множество благодеяний Божиих. Благодаря этому человек внутренне смиряется и приходит в сокрушение, после чего естественным образом приходит благодать Божия, божественное просвещение, и человек становится более рассудительным.
        cn: 一个人越是藉着省察自己而在灵性生命中进深，他的灵魂的眼睛就越是敞开，他就越能更清楚地看到自己的缺点以及上帝的诸多恩惠。借此，人内在降卑并进入痛悔，此后上帝的恩典、神圣的启迪便自然地降临，人也变得更有辨识力。
    - type: paragraph
      text:
        ru: Очень чувствительному и усердному Бог не позволяет познать всю его греховность и множество Своих благодеяний, чтобы он не отчаялся, но открывает ему все это по мере его преуспеяния и укрепления. Также человеку, имеющему гордость, Бог не помогает отсечь его страсти, чтобы тот не стал еще более гордым. Когда же он возгнушается собой по причине постоянных падений, познает свою немощь и смирится, тогда к нему приближается благодать Божия и с ее помощью он начинает подниматься по духовной лестнице вверх через ступеньку.
        cn: 对于那非常敏感且热切的人，上帝不容许他完全知晓自己的所有罪恶和祂（上帝）众多的恩惠，以免他绝望。但祂会按照他长进与刚强的程度，向他启示这一切。同样地，对于一个有骄傲的人，上帝不帮助他断绝他的情欲，以免他变得更加骄傲。然而，当他因持续的跌倒而厌弃自己，认识到自己的软弱并谦卑下来时，上帝的恩典就靠近他，借助这恩典，他开始跨越阶梯，在属灵的阶梯上向上攀升。
    - type: paragraph
      text:
        ru: Поэтому не следует взвешивать святость своих собратьев на человеческих весах, ибо один Бог, как сердцеведец, знает глубины сердец человеческих.
        cn: 因此，不应以人的尺度衡量弟兄们的圣洁，因为只有独一的上帝，作为知晓人心者（heart-knower），才了解人心深处。
    - type: paragraph
      text:
        ru: Сильнее всего склонит Бога к милости в день Суда труд, который мы проделали над своим ветхим человеком.
        cn: 在审判之日，我们为自己的旧人所付出的努力，最能促使上帝施予怜悯。
    - type: paragraph
      text:
        ru: Выше достоинство того, кто стяжал добродетели путем подвига, нежели того, кто родился с природными добродетелями и должен удвоить их, чтобы услышать:«Добре, рабе благий»(Мф. 25:21).
        cn: 那借由苦修而获得美德的人，其尊贵高于那生来就拥有自然美德的人；后者必须使其美德加倍，方能听见：「好，你这善良的仆人」（马太福音 25:21）。
    - type: paragraph
      text:
        ru: Конечно, все люди имеют немного рассуждения, однако, к сожалению, мы в большинстве своем применяем его не по отношению к себе, но по отношению к нашим собратьям (чтобы… кому-нибудь не показалось, что они лучше других[68]) и оскверняем его своим судом, осуждением и требованием, чтобы исправились другие, хотя нам следовало бы требовать исправления только от самих себя, не решающихся ревностно подвизаться, отсекать свои страсти и освободить свои души, чтобы возлететь в небо.
        cn: 当然，所有人都具备一点点分辨力，然而，遗憾的是，我们大多数人并非将其用于自身，而是用于我们的弟兄（为了……不让任何人觉得他们比别人更优秀[68]），并通过我们的评断、定罪和要求他人改正的行为来玷污它，尽管我们本应只要求自己改正，我们这些不敢热切地奋斗、斩断自己的情欲并解放自己的灵魂以飞升天国的人。
    - type: paragraph
      text:
        ru: Те, которые не решаются с ревностью начать подвиг, но влачат свою жизнь, не думая о времени, всегда будут подавленными и больными духовно и телесно. А данные им Богом дарования, за которые Он спросит, становятся для них в конце концов бесполезными.
        cn: 那些不以热诚决心开始修行（苦修）的人，却只是拖延自己的生命，不思考时间（的宝贵），他们将永远在精神上和身体上是压抑和病态的。而上帝赐予他们的恩赐，上帝将为此向他们追问，这些恩赐最终对他们来说毫无用处。
    - type: paragraph
      text:
        ru: Умный и рассудительный человек, благодаря своему духовному преуспеянию, с пользой употребляет не только дарования Благаго Бога и то добро, которое сделали ему люди, но и обиды, уничижения и тому подобное со стороны своих собратьев, которые он приписывает злобе человекоубийцы. Такой человек и о диаволе скорбит из-за его ужасного состояния так же, как о печальном состоянии своей души, и ищет милости Божией.
        cn: 有智慧和明辨力的人，藉着他的属灵长进，不仅有益地使用至善之神所赐的恩赐，以及人向他所行的善，也同样有益地使用他弟兄所施加的侮辱、轻蔑和诸如此类之事，他将这些归咎于杀人者的恶毒。这样的人也为着魔鬼可怕的境况而感到悲伤，正如他为着自己灵魂可悲的境况而悲伤一样，并寻求神的怜悯。
    - type: paragraph
      text:
        ru: Самоукорение и самоосуждение очень способствуют тому, чтобы с наших душевных очей спала пелена и мы начали хорошо видеть.
        cn: 自责和自我定罪极有助于揭去遮蔽我们灵魂之眼的帷幔，使我们开始清晰地看见。
    - type: paragraph
      text:
        ru: Чувствительные люди должны быть очень осторожными в самоукорении, потому что лукавый пытается превратить чувствительность в отчаяние (через сверхчувствительность). Самоукорение должно всегда сопровождаться упованием на Бога. Если такой человек замечает в своей душе тяжесть, то это значит, что лукавый уже приложил к делу свою руку.
        cn: 敏感的人在自责中必须非常谨慎，因为那恶者（或译：那狡猾者）试图将敏感转化为绝望（通过过度敏感）。自责必须总是伴随着对上帝的信靠（或译：仰赖）。如果这样的人察觉到自己的灵魂中有了重负（或译：沉重），那就意味着那恶者已经插手（或译：施展了手段）。
    - type: paragraph
      text:
        ru: Если человек сильно болезнует о своей греховности и неблагодарности к Богу, но имеет великую надежду на Бога, то получает от Него великое утешение. Не нужно отчаиваться, если мы подвизаемся, но не видим никакого продвижения, а одни лишь нули. Все мы, люди, своими усилиями можем только рисовать нули – кто больше, кто меньше. Христос же, видя наши слабые человеческие усилия, ставит перед нашими нулями единицу, и тогда они приобретают цену, и мы замечаем небольшое продвижение. Поэтому нужно не отчаиваться, но надеяться на Бога.
        cn: 如果一个人强烈地为自己的罪孽深重和对上帝的不感恩而痛苦，但对上帝怀有极大的希望，那么他就会从上帝那里获得巨大的慰藉。我们不必绝望，即使我们竭力奋斗，却看不到任何进步，而只是一片空白（用「零」形容）。我们所有人，凭着自己的努力，能画出来的只有「零」——有多有少。而基督呢，看到我们微弱的人类努力，就会在我们所画的「零」前加上一个「一」，这样它们就有了价值，我们也能察觉到微小的进步。因此，我们不必绝望，而应当仰望上帝。
    - type: paragraph
      text:
        ru: Отчаиваться нужно только в своем «я». Нужно постараться как можно быстрее сокрушить его, пока оно не сокрушило нас самих. Эгоистично подвизающиеся в посте, бдении и так далее мучают себя без всякой духовной пользы, потому что бьют воздух, а не бесов. Вместо того чтобы прогонять от себя искушения, они еще больше привлекают их к себе и, как следствие, сталкиваются при подвиге с большими трудностями (чувствуют удушье от тяжести на сердце). Тогда как у тех, которые много подвизаются с великим смирением и великой надеждой на Бога, сердце радуется, а душа летает, как на крыльях.
        cn: 绝望只当针对自己的「我」。我们必须尽快努力将其粉碎，以免它粉碎我们自己。那些以自我为中心的方式，在斋戒、守夜等等方面进行苦修的人，他们折磨自己，却没有任何属灵益处，因为他们是击打空气，而不是击打恶魔。他们非但没有将试探从自己身边赶走，反而更进一步将它们吸引过来，结果在苦修时遭遇了更大的困难（感受到心头的重压导致的窒息感）。然而，那些带着伟大的谦卑和对上帝的巨大希望而多多苦修的人，他们的心欢喜，灵魂则如生双翼般飞翔。
    - type: paragraph
      text:
        ru: Всякое наше действие и всякая добродетель нуждаются в смирении, любви и рассуждении, которое является солью добродетелей. Поэтому Христос и говорит в Евангелии:«Всяка жертва солию осолится»(Мк. 9:49).
        cn: 我们的一切行动与一切美德都需要谦卑、爱，以及作为美德之盐的明辨。因此，基督在福音中说：「凡祭物必用盐腌」（马可福音 9:49）。
    - type: paragraph
      text:
        ru: Лучше есть дважды в день, но меньше и иметь больше смирения и легкий желудок, чем есть единожды в день и раздувать желудок пищей, а голову гордостью.
        cn: 最好是一天吃两次，但少吃一点，拥有更多的谦卑和轻松的胃，而不是一天只吃一次，用食物把胃撑大，用骄傲把头脑塞满。
    - type: paragraph
      text:
        ru: Рассуждение сильно способствует воцарению в душе мира, который очень полезен для подвижничества, потому что дает душе и телу больше сил, чем вещественная пища. А если нет внутреннего мира, то и самые лучшие продукты становятся ядовитыми от множества желчи, которую человек постоянно выделяет, и приносят вред его душе и телу.
        cn: 审慎极大地有助于在灵魂中建立平安。这平安对苦修非常有用，因为它赋予灵魂和肉体比物质食物更多的力量。但是，如果没有内在的平安，那么即使是最好的食物也会因为人不断分泌的大量胆汁而变得有毒，并给他的灵魂和肉体带来损害。
    - type: paragraph
      text:
        ru: Питающиеся любовью Божией часто безразличны к вещественной пище или же, когда едят, не чувствуют ее, потому что и в это время ощущают присутствие Божие и питаются сладким благословением Его любви.
        cn: 那些以上帝的爱为食的人，常常对物质的食物漠不关心，或者当他们进食时也感觉不到食物的味道，因为即使在那时，他们也感受到上帝的临在，并以祂的爱的甘甜祝福为食。
    - type: paragraph
      text:
        ru: Желание хорошей пищи является приманкой лукавого. Если человек не отсекает его, попадает на удочку врага и жарится вместе со своим жиром на сковороде своей разжженной плоти. Наоборот, стремление к духовной пище отрывает сердце от всего земного и возносит душу на небеса, и там она вкушает ангельскую пищу.
        cn: 对美食的渴望是那恶者的诱饵。如果一个人不将它断绝，他就会上仇敌的钩，并与他自己的肥肉一同在他燃烧的肉体的煎锅上被煎炸。反之，对属灵食粮的渴望使心脱离一切属世之事，并将灵魂提升至诸天之上，在那里她品尝天使的食物。
    - type: paragraph
      text:
        ru: Тех, которые не удерживают своего сердца от вещественных желаний, не являющихся необходимыми (не говоря уже о плотских похотях), и не собирают своего ума в сердце, чтобы всецело, вместе с душой, отдать их Богу, но оставляют их без надзора, ожидает сугубая беда.
        cn: 那些不约束自己的心，使其脱离不必要的物质愿望（更不必说肉体情欲），且不将自己的心智收拢于心，好使心智与灵魂一同全然献给给上帝的人，反而任其不受看管，则有双重的祸患在等待着他们。
    - type: paragraph
      text:
        ru: Когда отсутствует бдительность, тогда в голове не бывает и ума (его похищает лукавый), и мы остаемся с одним телом без ума, как чурбаны. Когда позже нам все же удастся собрать свой ум, он оказывается загруженным мусором, который лукавый использует для растопки. С его помощью он разжигает наш чурбан (плоть) и насмехается над нами, приплясывая со злобной радостью.
        cn: 当警惕缺席时，头脑中便没有理智（它被那恶者窃走了），我们只剩下身躯而没有理智，如同木桩一般。当我们后来仍设法汇聚起自己的理智时，它却已装满了垃圾，那恶者用这些垃圾来作引火之物。借此，它点燃我们的木桩（肉体），并以恶毒的喜悦跳着舞来嘲笑我们。
    - type: paragraph
      text:
        ru: Чтобы ум нас не оставлял, нужно приучить его непрерывно повторять в сердце сладкое имя Иисуса, и мы достигнем духовного преуспеяния. Если ум отсутствует, то это все равно, что дом без хозяина. Такой дом приходит в запустение.
        cn: 为了使我们的心智不离开我们，我们需要训练它在心中持续不断地重复诵念耶稣的这甜美的圣名，这样我们就能达到属灵的精进。如果心智缺席，那就像是房屋没有主人一样。这样的房屋会变得荒芜。
    - type: paragraph
      text:
        ru: Если мы бываем невнимательны во время духовного чтения, то не получаем от него никакой пользы, но только попусту тратим время и напрасно утомляем себя, потому что ничего после не можем вспомнить, как бывает, когда ум рабочего в типографии занят чем-то посторонним и он забывает наносить краску на буквы. Станки тогда будут работать вхолостую и ничего не отпечатают.
        cn: 如果我们在灵修阅读时心不在焉，那么我们就不会从中得到任何益处，而只是白白浪费时间并徒然使自己疲劳，因为事后我们什么也记不起来，就像印刷厂工人的心神被外物占据而忘记在字母上涂墨时所发生的情况一样。那时机器就会空转，什么也印不出来。
    - type: paragraph
      text:
        ru: Тот, кто внимателен во время чтения, но при этом удовлетворяется одним только чтением и не применяет ничего из прочитанного для своего духовного роста, похож на крестьянина, которому лень браться за плуг и который находит себе густую тень, постоянно читает книги по агрономии и многому учится теоретически, но остается несчастным бездельником.
        cn: 那个在阅读时很专注，但却满足于仅仅阅读，而没有将所读的任何内容用于自己的精神成长的人，就像一个懒得拿起犁的农夫，他给自己找了一片浓密的树荫，不断阅读农学书籍，并在理论上学到了很多，但仍然是一个不幸的懒汉。
    - type: paragraph
      text:
        ru: Женщины тоже находят великое утешение в чтении и могут получить от него больше пользы, чем мужчины, потому что у них меньше рассудочности и больше веры. Однако, к сожалению, немногие из них получают от чтения пользу и продвигаются в духовной жизни, потому что в большинстве случаев, когда они берутся за себя, начинаются причитания, и они продолжают причитать и заниматься микроскопическими духовными исследованиями, вместо того чтобы начать отсекать сперва грубые страсти, а затем малые, которые по благодати Божией постепенно исчезают сами.
        cn: 妇女在阅读中也能找到极大的慰藉，并且比男性获得更多的益处，因为她们的理智性（рассудочности）较少而信仰（веры）更多。然而，遗憾的是，她们中很少有人能从阅读中受益并在属灵生命中取得进步，因为在大多数情况下，当她们开始自省时，就陷入了哀叹（причитания）之中，并持续哀叹和进行微观的（микроскопическими）属灵研究，而不是首先开始对付粗重的激情（грубые страсти），然后对付较小的激情（малые），后者会靠着上帝的恩典逐渐自行消逝。
    - type: paragraph
      text:
        ru: Хотя большинство женщин имеют большие предпосылки к духовной жизни, они не достигают большого преуспеяния. У них меньше рассудочности, но это не только не вредит, а, наоборот, бывает полезным в отношении веры. Мужчины же своей рассудочностью расшатывают свою веру. Также в женщинах от природы заложена любовь, и они могут отдать себя Богу вместе со своим сердцем, тогда как мужчинам нужно много труда, чтобы их сердце начало трудиться для Бога. А если сердце не трудится, человек ничем не отличается от каменной статуи.
        cn: 虽然大多数女性拥有更强的精神生活前提，但她们并没有取得重大的进步。她们的理性（рассудочность）较少，但这不仅无害，反而对信仰有所助益。而男性则以他们的理性动摇自己的信仰。同样地，女性天生具有爱心，她们能将自己连同心一同献给上帝，而男性则需要付出大量的努力，才能使他们的心开始为上帝而工作。如果心不工作，人就与一座石像无异。
    - type: paragraph
      text:
        ru: 'Следовательно, все мы – мужчины и женщины – имеем предпосылки к духовной жизни и не можем найти оправдания для своей лени: достаточно нам только захотеть применить те способности, которыми Бог одарил нас, чтобы достигнуть рая и оказаться близ Него. Тогда обрадуется и Он, и мы – Его чада.'
        cn: 因此，我们所有人——无论男女——都具有迈向属灵生活的前提条件，也无法为自己的懒惰找到借口：我们只需愿意运用上帝赋予我们的那些能力，就能达到天堂并亲近祂。那时，祂将喜悦，我们——祂的儿女——也将喜悦。
    - type: paragraph
      text:
        ru: Как Благий Бог всегда относится к нам с любовью и добротой и призывает нас в рай, так и мы не должны по-варварски поступать со своими собратьями, успокаивая себя тем, что таким суровым обращением посылаем души в рай.
        cn: 正如良善的上帝（Благий Бог）总是以爱和良善对待我们，并召唤我们进入天堂，我们也绝不应该野蛮地对待我们的弟兄，以「通过这种严酷的对待来送灵魂上天堂」作为自我安慰。
    - type: paragraph
      text:
        ru: Тот, кто поступает с другими по-варварски якобы для того, чтобы принести их душам духовную пользу, хуже Диоклетиана, потому что он был идолопоклонником, а не христианином.
        cn: 那个据称为了给他们的灵魂带来属灵益处而野蛮对待他人的人，比戴克里先（Diocletian）更糟糕，因为戴克里先是一个偶像崇拜者，而非基督徒。
    - type: paragraph
      text:
        ru: Христос не говорит нам, чтобы мы убивали людей своим варварским обращением и отсылали их в рай, но чтобы помогали своим собратьям для того, чтобы нам всем вместе пойти в рай. Конечно, претерпевающие мучения от христиан имеют даже большую награду, чем мученики, если терпят с радостью и не осуждают своих мучителей, но благодарят их за помощь в избавлении от грехов или за награду (если они ни в чем не повинны) и венец, который получат от Христа благодаря им.
        cn: 基督并非告诉我们，要用野蛮的对待方式杀戮人，并将他们送往天堂，而是要我们帮助自己的弟兄，好使我们大家一同进入天堂。当然，那些从基督徒那里忍受折磨的人，若带着喜乐忍受，不判定（定罪）他们的施虐者，反而感谢他们帮助自己摆脱罪恶，或者（若他们全然无辜）感谢他们因着自己而从基督获得奖赏和冠冕，他们获得的奖赏甚至比殉道者更大。
    - type: paragraph
      text:
        ru: 'Если страстный человек делает замечание эгоисту, происходит то же, что бывает, когда огниво бьет по кремню: искры разлетаются во все стороны. Однако если этот безрассудный человек сделает замечание человеку чувствительному, то может его сильно ранить, как если бы какой-нибудь дикарь взял металлическую щетку и начал вычищать соринку из глаза младенца.'
        cn: 如果一个充满激情的人对一个自私的人提出意见，所发生的事情就如同燧石击打火石：火花四溅。然而，如果这个鲁莽的人对一个敏感的人提出意见，那么可能会深深地伤害他，就像某个野蛮人拿起金属刷，开始从婴儿的眼中清理一粒尘屑。
    - type: paragraph
      text:
        ru: Также тот, кто эгоистически и возбужденно (из-за своих страстей) проповедует слово Божие, похож на ежа, который несет на своих колючках виноградины, чтобы накормить своих детей, но из-за своих нервных движений больше ранит их, чем кормит, особенно если они маленькие и нежные.
        cn: 同样，那自私地、并（因自己的情欲）激动地宣讲上帝圣言的人，像一只刺猬，它用自己的尖刺驮着葡萄喂养它的幼崽，但因其神经质的动作，它更多的是刺伤了它们，而非喂养了它们，尤其是当它们幼小而柔嫩的时候。
    - type: paragraph
      text:
        ru: Имеющие рассуждение имеют также благородную любовь и смирение и даже горькую правду делают сладкой благодаря своей доброте, произносят ее с большой простотой, и она приносит большую пользу, чем сладкие слова, как и горькие лекарства полезнее сладких сиропов.
        cn: 那些具有明辨力（рас-суждение）的人也拥有高尚的爱和谦卑，甚至能使苦涩的真理因他们的良善而变得甘甜，他们以极大的单纯说出它，它所带来的益处，比甜言蜜语更大，正如苦药比甜糖浆更有益处一样。
    - type: paragraph
      text:
        ru: Внутренняя любовь всегда выдает себя, потому что даже внешний облик человека она делает сладостным, украшая его божественной благодатью, которая, сияя, не может скрыться.
        cn: 内在的爱总会显明自身，因为即使是一个人的外在形貌，它也使其甜美，以神圣的恩典妆饰他；这恩典因其光芒四射，故无法隐藏。
    - type: paragraph
      text:
        ru: 'Ангел, будучи ангелом, всегда источает вокруг себя то, что имеет: радость и небесное веселие. А демон, закамуфлированный под ангела, источает смущение (то, что имеет) или немного возбуждает сердце телесно, чтобы прельстить душу плотским наслаждением, представляя его якобы духовным, божественным.'
        cn: 天使，因其是天使，总是散发着他所拥有的：喜悦和天上的欢愉。而伪装成天使的恶魔，则散发着混乱（他所拥有的），或者稍稍在肉体上激发内心，以便以肉体的愉悦来诱惑灵魂，将其呈现为一种所谓的属灵的、神圣的愉悦。
    - type: paragraph
      text:
        ru: Смиренный человек, даже если будет неопытным, отличит ангела Божия от беса, потому что духовно чист и сроден ангелу. А эгоист и плотской человек не только легко прельщается лукавым, но еще и сам передает свои лукавство и плотолюбие другим людям, вредя своими духовными микробами немощным душам.
        cn: 谦卑之人，即便不曾有经验，也能分辨出上帝的天使与邪灵，因为他在属灵上是洁净的，并且与天使同类。而自我中心（egoist）和属肉体（плотской）的人，不仅容易被那恶者诱惑（прельщаться），他还会将自己的诡诈（лукавство）和贪恋肉体（плотолюбие）传染给他人，用他属灵的微生物（микробы）伤害软弱的灵魂。
    - type: paragraph
      text:
        ru: Облагодатствованный человек Божий передает другим божественную благодать и изменяет плотских людей, освобождая их от рабства страстям, и таким образом приближает их к Богу, и они получают спасение.
        cn: 被神恩宠的人，将神的恩典传予他人，并改变属肉体的人，使他们从情欲的奴役中得释放，从而使他们亲近上帝，并获得救赎。
    - type: paragraph
      text:
        ru: Те, которые удаляются от Христа, лишаются божественного просвещения, потому что оставляют солнечную сторону и, безрассудные, идут туда, где нет солнца. Как следствие, они оказываются простуженными и больными духовно. Все мы наделены от Бога соответствующими дарованиями, но не все используем их на благо, для спасения своей души и душ своих собратьев. В большинстве случаев большинство из нас используют их во вред себе и другим.
        cn: 那些远离基督的人，被剥夺了神圣的启迪，因为他们离开了向阳的一面，愚昧地走向没有太阳的地方。结果，他们在属灵上变得感冒和病弱。我们所有人都从上帝那里被赋予了相应的恩赐，但并非所有人都用这些恩赐来行善，以拯救自己的灵魂和弟兄们的灵魂。在大多数情况下，我们大多数人使用它们来伤害自己和他人。
    - type: paragraph
      text:
        ru: Если человек кроткий и бесстрастный по природе получает помощь от своего характера для своего духовного развития, то человек с живым или гневливым характером получает вдвое большую помощь от силы, заложенной в его характере, стоит ему лишь использовать ее против своих страстей и лукавого.
        cn: 如果一个人性情温和、自然无情欲（бесстрастный），他的性格有助于他的属灵发展，那么一个性情活泼或易怒的人，只要他将性格中固有的力量用来对抗自己的情欲（страсти）和那恶者（лукавый），他就能获得双倍的帮助。
    - type: paragraph
      text:
        ru: Те, которые в своей мирской жизни были невнимательны и приобрели дурные привычки, пусть теперь безропотно переносят брань с лукавым, не допуская худых желаний. Подвизаясь таким образом, они очистятся и достигнут меры чистых людей, которые не знали больших грехов, не приобрели дурных привычек и не испытывают сильной брани.
        cn: 那些在他们的世俗生活中不谨慎，并养成了坏习惯的人，现在应当毫无怨言地忍受与那恶者的争战，不容许邪恶的欲望。如此争战，他们将得到洁净，并达到那些纯净之人的程度。他们未曾犯下大罪，未曾养成坏习惯，也不经历强烈的争战。
    - type: paragraph
      text:
        ru: Всем нам нужна большая внимательность, чтобы не принимать лукавых телефонных звонков от врага (дурных помыслов) и не осквернять тем самым«храм... Святаго Духа»(1Кор. 6:19), чтобы от нас не ушла благодать Божия и мы не впали в помрачение.
        cn: 我们所有人都需要高度的警醒，以免接听仇敌（恶念）打来的邪恶电话，从而玷污了「圣灵的殿」（哥林多前书 6:19），以免上帝的恩典离我们而去，使我们陷入昏暗之中。
    - type: paragraph
      text:
        ru: 'Человек, следящий за своей духовной чистотой и хранящий ее, хранит также божественную благодать, видит все чистым и использует даже нечистое, делая его хорошим на своем хорошем духовном заводе: из макулатуры он делает чистые салфетки, листы, тетради и так далее, из разбитой бронзы он изготавливает подсвечники и канделябры, из золота – святые чаши. Напротив, человек, который одобряет лукавство и мыслит лукаво, из хорошего делает плохое, как военный завод, который производит боеприпасы и из золота отливает пули и гильзы для снарядов, потому что так устроены его машины.'
        cn: 一个关注并保守自己属灵纯洁的人，也保守着神圣的恩典，他看到一切都是洁净的，甚至利用不洁净的事物，通过他良好的属灵「工厂」使其变好：他用废纸制作洁净的餐巾纸、纸张、笔记本等等；他用破碎的青铜制作烛台和多枝烛台；他用黄金制作圣杯。相反，一个赞同诡诈、心思诡诈的人，却把好的变成坏的，就像一个兵工厂，生产弹药，用黄金铸造子弹和炮弹弹壳，因为他的「机器」就是这样构造的。
    - type: paragraph
      text:
        ru: Поэтому никогда не будем допускать худых помыслов, но будем постоянно делать добро, если хотим, чтобы плохой завод нашего сердца стал хорошим.
        cn: 因此，我们绝不可容许恶念，而要持续行善，如果我们渴望我们心中那邪恶的「工厂」能变成好的。
    - type: paragraph
      text:
        ru: Не нужно подвизаться с болезненной схоластичностью, чтобы потом нас не душило внутреннее беспокойство (при борьбе с помыслами), но нужно подвизаться проще, надеясь на Христа, а не на себя. Христос весь любовь, доброта и утешение. Он никогда не душит, но подает обилие духовного кислорода – божественного утешения. Одно дело – тонкое духовное делание и другое – болезненная схоластичность, которая душит внутренним беспокойством (от внешнего неразумного насилия), вызывающим головную боль.
        cn: '（此文本为灵修指导类，应力求精确）


          我们不必以病态的学院派态度来修持苦行，以免后来内心不安扼住我们的咽喉（在与意念搏斗时），而应更单纯地修持苦行，信靠基督，而非依靠自己。基督全然是爱、良善与安慰。祂从不令人窒息，反而赐予丰沛的属灵氧气——神圣的安慰。精微的属灵操练是一回事，而病态的学院派态度是另一回事，后者以内部的不安扼住人的咽喉（源于外部不理智的强迫），引发头痛。'
    - type: paragraph
      text:
        ru: Также не нужно навязываться со схоластичностью другим, чтобы после этого у нас не болела голова от вопроса, как их убедить, если мы много раз говорим им об истине, а они не знают истины, но знают только ложь. (Это все равно что заводить часы, у которых сорвана пружина.) Также лучше избегать тех, которые, хотя и знают истину, понимают ее по-своему, доказывая с ее помощью свои идеи, чтобы нам не уставать без пользы и не бросаться великими истинами, потому что, если стена глиняная, к ней не пристает штукатурка из извести, но только из глины, смешанной с соломой.
        cn: 此外，我们也不必以烦琐的学究气（scholasticity）去强加于他人，以免之后我们因「如何说服他们」这个问题而头痛——如果我们将真理多次告诉他们，而他们却不认识真理，只认识谎言。（这就像给一个发条已断的钟上发条。）同样，最好避开那些虽然认识真理，却按自己的方式理解真理，并以此来证明自己想法的人，以免我们徒劳地疲惫，并（将）伟大的真理弃置不顾，因为如果墙是泥土的，石灰灰泥不会附着，只有混合了稻草的泥灰才能附着。
    - type: paragraph
      text:
        ru: Те, которые находятся в состоянии гнева или возмущения и обличают состояние, в котором находится мир, чтобы якобы принести в мир добро и духовную тишину, похожи на сильный порывистый ветер, который, желая успокоить море, грозит ему и обрушивает на него поднимаемые им пенящиеся волны, пуская корабли ко дну в открытом море и в бухте.
        cn: 那些处于愤怒或愤慨状态，并指责世界所处状态，声称要将良善和属灵的宁静带入世界的人，就像一阵强劲的疾风，它想要使大海平静，却威吓它，并将自己所掀起的泡沫翻滚的波浪倾泻其上，使得船只在公海和海湾中沉没。
    - type: paragraph
      text:
        ru: Не будем пытаться якобы утихомиривать других, если сами не имеем внутренней душевной тишины. Также не будем искать у своего духовника тишины, если не примирились внутренне с тем человеком, которого ранили или обидели, когда есть возможность его найти. Также не будем приводить на исповеди смягчающих обстоятельств, потому что для нашей совести они становятся отягчающими обстоятельствами.
        cn: 我们不应试图表面上安抚他人，如果自己不拥有内在的灵魂宁静。同样，我们不应向自己的神师寻求宁静，如果内心没有与那个被我们伤害或冒犯的人和解，当有可能找到他的时候。同样，我们不应在告解时提出减轻罪责的情形，因为对于我们的良心而言，它们会变成加重罪责的情形。
    - type: paragraph
      text:
        ru: Смиренного и чувствительного человека не будем сурово укорять, потому что можем при этом возвести на него обвинение в том, чего он не совершал, и он согнется под его тяжестью.
        cn: 我们不应严厉斥责谦卑且敏锐的人，因为我们可能因此给他强加未曾犯下的罪名，而他会在这重负下弯腰。
    - type: paragraph
      text:
        ru: Эгоиста и упрямца не следует смирять словами, но молитвой и смиренным поведением, потому что, если мы будем настаивать на своем, он вскипит, а сами мы устанем, вспотеем и расстроимся.
        cn: 不当用言语，而当用祷告和谦卑的行为去降伏一个自私和固执的人，因为，如果我们坚持己见，他会勃然大怒，而我们自己则会疲惫不堪、汗流浃背、心烦意乱。
    - type: paragraph
      text:
        ru: Безрассудное поведение в большинстве случаев производит большее зло, чем поведение сумасшедших, которые разбивают головы, потому что безрассудные люди своими резкими словами уязвляют чувствительные сердца и часто смертельно их ранят (приводят души в отчаяние).
        cn: 无理性的行为在多数情况下会造成比疯子砸破头颅更大的恶，因为无理性的人以其尖锐的言语刺伤敏感的心灵，并常常将其致以致命伤（使灵魂陷入绝望）。
    - type: paragraph
      text:
        ru: Также много зла приносит лицемерная мирская вежливость, потому что, доверяя ей, человек обольщается, раскрывает свое сердце и, в конечном итоге, напрасно растрачивает свое благоговение на мирского человека, который вообще не знает, что значит благоговение. (Как если бы кто-то давал золотые лиры тем, которые видели только бронзовые драхмы.)
        cn: 伪善的世俗礼貌也带来许多邪恶，因为人信赖它，就受了迷惑，敞开了自己的心，最终将自己的虔敬白白浪费在一个根本不懂得虔敬为何物的世俗之人身上。（这就如同一个人把金里拉给了那些只见过青铜德拉克马的人。）
    - type: paragraph
      text:
        ru: Также не будем впустую терять время, давая духовные наставления людям, которые хотят только вести мирские споры и эгоистически высказывать свое мнение.
        cn: 同样，我们也不应浪费时间，对那些只想进行世俗争论和自私地表达自己观点的人给予灵性指导。
    - type: paragraph
      text:
        ru: Нужно быть осторожными в беседах со знакомыми людьми, если у нас нет общих тем для разговора, потому что такие беседы начинаются с духовного и заканчиваются женскими сплетнями. И тогда мы не только теряем время, но и душу теряем из-за осуждения, потому что у нас нет права осуждать ни отдельных людей, ни происходящее вокруг нас, но если мы можем, то должны, с болью поговорив об этом, постараться в чем-то исправить положение дел. Также мы не должны осуждать мертвых, потому что души всех людей, к счастью для нас, находятся в руках Божиих, и мы, я надеюсь, обретем у Него милость.
        cn: 在与熟人交谈时，我们必须保持谨慎，如果彼此没有共同的交谈主题，因为此类交谈通常始于属灵之事，却终于妇女间的流言蜚语。这样，我们不仅浪费了时间，更会因论断而失丧灵魂，因为我们没有权利论断任何个人，也没有权利论断我们周围发生的一切。但如果我们可以，那么就应当怀着痛苦谈论此事，并努力在某些方面改善事态。同时，我们也不应论断已逝之人，因为所有人的灵魂，对我们而言是幸事，都在上帝的手中，而我希望，我们将在祂那里获得怜悯。
    - type: paragraph
      text:
        ru: Каждый православный христианин обязан пробуждать у инославных доброе беспокойство, чтобы они поняли, что находятся в заблуждении, не успокаивали себя напрасно и не лишились как в этой жизни богатых благословений Православия, так и в иной жизни больших и вечных благословений Божиих.
        cn: 每一位东正教基督徒都有责任唤起异教徒（非东正教徒）良善的不安（或「良善的困扰」），以便他们明白自己正处于迷误之中，不致徒然地自我安慰，不致在这世上失去东正教丰富的祝福，也不致在来世失去上帝更大和永恒的祝福。
    - type: paragraph
      text:
        ru: Тот, кого мы должны беспощадно осуждать (и имеем на это право), – это наше злое «я». Если сами мы не накажем его в этой жизни за содеянные им грехи и если не отсечем при этом свои злые желания, они будут нас мучить вечно.
        cn: 我们必须无情地谴责（而且有权如此行）的——是我们邪恶的「自我」。如果我们在今生不因它所犯下的罪而惩罚它，如果不在此刻断绝我们邪恶的欲望，它们就会永远折磨我们。
    - type: paragraph
      text:
        ru: Следовательно, для нас вовсе необязательно знать, когда будет второе пришествие Господне, потому что, умирая, каждый будет судим соответственно тому состоянию, в котором его застанет смерть.
        cn: 因此，我们根本没有必要知道主第二次降临将在何时，因为每个人在离世时，都将根据死亡临到他时所处的状态而被审判。
    - type: paragraph
      text:
        ru: Благий Бог да подаст нам доброе покаяние, чтобы мы как Его чада унаследовали рай, который Он как любящий Отец уготовал нам. Аминь.
        cn: 慈爱的上帝愿赐予我们良好的悔改，使我们作为祂的儿女，能继承祂作为慈爱的父为我们预备的天堂。阿门。
  - type: heading2
    text:
      ru: Письмо третье. Духовные лекарственные травы
      cn: 第三封信。属灵的药草
    children:
    - type: paragraph
      text:
        ru: Калива Честного Креста, 13.1.1971 г.
        cn: 圣十字架隐修小屋，1971年1月13日
    - type: paragraph
      text:
        ru: Сестры во Христе, благословите!
        cn: 在基督里的姊妹们，请赐福！
    - type: paragraph
      text:
        ru: Несколько дней назад получил ваши письма и решил послать вам немного духовных лекарственных трав. Конечно, своих собственных у меня нет, но в саду Божией Матери[69]их хватает. Я имею в виду одного подвижника-монаха, с которым я был хорошо знаком и который принес моей душе очень много пользы. О его травах я и рассказываю вам, чтобы вы знали, какие из них он давал против каждой страсти. Может оказаться, что сейчас они вам не нужны, однако пусть хранятся про запас – ведь все мы люди. Итак, я беру эти листы, которые тоже не мои, и заворачиваю в них чужие травы.
        cn: 几天前我收到了您的信件，并决定给您寄送一些精神性的草药。当然，我自己没有，但在上帝之母的花园[69]里有很多。我指的是一位我非常熟悉、给我的灵魂带来极大益处的修道士（苦修者）。我正告诉您关于他的草药，以便您知道他针对每一种情欲所施用的药材。或许现在您不需要它们，但请将它们储存起来以备不时之需——毕竟我们都是凡人。因此，我拿起这些叶子，它们也不是我的，并用它们包裹住别人的草药。
    - type: paragraph
      text:
        ru: А так как наибольшей болезнью является гордость, которая изгнала нас из рая на землю, а с земли пытается низвести нас в ад, начну с нее.
        cn: 既因骄傲乃是最大的病，它将我们从天堂驱逐到地上，又企图将我们从地上贬入地狱，我将从它开始。
    - type: paragraph
      text:
        ru: 'Однажды этого монаха спросили:'
        cn: 有一次，有人问这位修士：
    - type: paragraph
      text:
        ru: – Как, старче, мне не гордиться, когда я вижу, что мне приходят в голову мудрые мысли и что мною восхищаются мои соученики?
        cn: – Старца，当那些智慧的思想浮现在我脑海中，以及我的同学们钦佩我时，我怎能不骄傲呢？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Те мысли, которые приходят нам в голову свыше, брат, являются Божиими, а те, которые выходят из нашей головы через нос – нашими[70].
        cn: – 弟兄啊，那些临到我们头脑的思念是属神的，而那些通过我们的鼻子从我们头脑中冒出的思念则是属我们自己的[70]。
    - type: paragraph
      text:
        ru: 'Другой брат спросил его:'
        cn: 另一位弟兄问他：
    - type: paragraph
      text:
        ru: – Почему, когда я молюсь, чтобы избавиться какой-либо страсти, или за какого-нибудь своего знакомого, Бог иногда слышит меня, а иногда нет, хотя при этом я и тружусь в молитве больше?
        cn: – 为什么，当我祈祷求摆脱某种激情（*或：情欲*，*或：癖好*）或为我的某个熟人代祷时，上帝有时垂听我，有时却不，尽管在祷告中我付出的劳苦更多？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Бог больше смотрит на то, сколько у нас смирения, а не на то, сколько труда мы прикладываем. Если у нас есть гордость, которая приводит к падениям, и мы просим Бога, чтобы Он избавил нас от этих падений, то какая нам будет польза оттого, что Бог услышит нас и исцелит? Поэтому Благий Бог не слушает нас, ожидая, не станет ли для нас полезным множество падений и не приведет ли оно нас к смирению. Поэтому, если Он не исцеляет нас от страсти, нужно сделать вывод, что у нас есть гордость и нам нужно просить Бога, чтобы Он исцелил нас сначала от гордости, а все остальные страсти уйдут сами.
        cn: – 相比于我们所付出的劳作，上帝更看重我们拥有多少谦卑。如果我们有骄傲，这导致了跌倒，而我们祈求上帝，求祂使我们脱离这些跌倒，那么上帝垂听我们并治愈我们，对我们又有什么益处呢？因此，至善的上帝不垂听我们，而是等待，看这些众多的跌倒是否会对我们有益，是否会引导我们走向谦卑。所以，如果祂不治愈我们脱脱离某种情yù（情yù）[a]，我们必须得出结论，就是我们有骄傲，我们需要祈求上帝，首先治愈我们的骄傲，而所有其他的情yù（情yù）将自行消退。
    - type: paragraph
      text:
        ru: 'Однажды его спросил один монах:'
        cn: 有一次，一个修士问他：
    - type: paragraph
      text:
        ru: – Когда я, старче, жил еще в миру, был лучше. Почему же сейчас, когда я пришел в монастырь, я стал хуже?
        cn: ——长者，当我还活在尘世时，我更好一些。为何现在，我来到修道院后，反而变坏了呢？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Это правда, брат, потому что в миру ты сравнивал себя с мирскими людьми, а в монастыре – со святыми.
        cn: – 这是真的，弟兄，因为你在世俗中是拿自己与世俗的人比较，而在修道院里则是与圣徒比较。
    - type: paragraph
      text:
        ru: 'В другой раз его спросили:'
        cn: 另一次，他们问他：
    - type: paragraph
      text:
        ru: – Что мне делать, старче? Я завидую и часто радуюсь, когда преуспевшие братия совершают проступки.
        cn: – 你该做什么呢，长老？我心怀嫉妒，并且当那些成功的弟兄们犯错时，我常常感到高兴。
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: '– Говори: «Боже мой, прошу Тебя помочь моим братиям, чтобы каждый из них достиг меры того святого, имя которого носит, а я – меры своих братий». Поступай так и скоро увидишь благодать Божию.'
        cn: – 说：「我的上帝，我恳求祢帮助我的弟兄们，愿他们每一位都能达到他所领受名字的那位圣者的程度，而我，则达到我的弟兄们的程度。」就这样去做，你很快就会看到上帝的恩典。
    - type: paragraph
      text:
        ru: 'Один брат спросил его однажды:'
        cn: 一个弟兄曾问他一次：
    - type: paragraph
      text:
        ru: – Я хочу уйти из обители, потому что в ней не нахожу себе покоя. Правильно ли я поступлю, если уйду?
        cn: —— 我想离开修道院，因为我在那里找不到安宁。我离开的话，这样做对吗？
    - type: paragraph
      text:
        ru: 'Старец ответил:'
        cn: 长老回答说：
    - type: paragraph
      text:
        ru: – Ты монах?
        cn: – 你是修士吗？
    - type: paragraph
      text:
        ru: – Нет, старче, послушник.
        cn: – 不，长老，是初学修士。
    - type: paragraph
      text:
        ru: – Конечно, ты можешь и уйти. Скажи мне, брат, а сколько лет ты послушник?
        cn: – 当然，你也可以离开。告诉我，弟兄，你作初学修士多少年了？
    - type: paragraph
      text:
        ru: – Около трех лет.
        cn: – 大约三年。
    - type: paragraph
      text:
        ru: – Если ты помышляешь об удалении в пустыню, то, думаю, тебе еще слишком рано. Если же об удалении в мир, то, думаю, уже слишком поздно, потому что те, которые видели тебя на протяжении трех лет в рясе[71], считают тебя монахом и будут после этого думать, что ты пал, и многие души из-за тебя соблазнятся.
        cn: —— 如果你正在考虑隐居到旷野，我想对你来说还为时过早。但如果考虑隐居到世间，我想已经太迟了，因为那些三年来看到你身穿修士服[71]的人，都认为你是修士，此后会认为你已堕落，许多灵魂会因你而跌倒。
    - type: paragraph
      text:
        ru: – Почему же ко мне приходят эти помыслы о мире?
        cn: – 为什么这些关于世界的思虑（помыслы）会临到我呢？
    - type: paragraph
      text:
        ru: – Потому что ты очень скоро забыл, что претерпел, чтобы освободиться от мира. Если же будешь помнить об этом, то перестанешь вспоминать мир, и твой ум вскарабкается на небеса.
        cn: – 因为你很快就忘记了你为了从世界中解放出来所受的苦难。如果你记着这些，你就会停止回忆世界，你的心智（ум）就会攀登至天堂。
    - type: paragraph
      text:
        ru: 'Один сильно преуспевший молодой монах спросил его:'
        cn: 一位颇有成就的年轻修士问他：
    - type: paragraph
      text:
        ru: '– Мой ум, старче, сам движется в молитве не только днем, но даже когда я сплю: часто я просыпаюсь и, действительно, не прерываясь, продолжаю читать оставшуюся часть молитвы. Может, это прелесть?'
        cn: – 我的心神，长老，它自己在祈祷中活动，不仅白天如此，甚至当我睡觉时也是如此：我经常醒来，确实是不间断地继续诵读祈祷的剩余部分。这会不会是prelest（妄想）？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: '– Это не прелесть, брат, но и не то, что принадлежит тебе. Это дар Божий, и потому нужно благодарить за него Бога и просить Его, чтобы Он дал этот дар и другим, которые лучше тебя. Говори Богу: «Боже мой, если Ты не возгнушался мною и дал мне сей божественный дар, то дай его также всем остальным Своим созданиям, которые намного лучше меня».'
        cn: – 弟兄，这不是虚妄之爱，但也不属于你。这是上帝的恩赐，因此，需要为此感谢上帝，并求祂把这恩赐也赐予其他比你更好的人。对上帝说：「我的上帝，如果祢不憎嫌我而赐予我这神圣的恩赐，那么也请祢将它赐予所有其余远比我好的受造物。」
    - type: paragraph
      text:
        ru: 'В другое время еще один спросил его:'
        cn: 另有一次，另一个人问他：
    - type: paragraph
      text:
        ru: – Когда я совершаю длительное бдение, ко мне приходит множество худых помыслов и мучает меня, так что часто я даже не могу их отогнать. Что мне делать?
        cn: – 当我进行长时间的守夜（бдение）时，许多邪恶的意念（помыслы）涌向我并折磨我，以至于我常常无法将其驱逐。我该怎么办？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Либо твое бдение, брат, соединено с гордостью, либо ты подвизаешься выше сил, что тоже нечисто. Постарайся, чтобы твое подвижничество не было сухим и не производило обманного впечатления на тебя и на тех, которые тебя видят, и не ввело тебя в прелесть.
        cn: —— 弟兄，你的彻夜不眠（бдение）要么是与骄傲结合在一起的，要么是你所作的努力超出了你的能力，而这同样是不洁净的。务要尽力使你的苦修（подвижничество）不至枯燥，不至在你和你身边的人眼中造成虚假的印象，也不致引你进入神妄（прелесть）。
    - type: paragraph
      text:
        ru: – Сколько часов нужно спать? Арсений Великий говорит, что один час.
        cn: —— 你们需要睡多少小时？大阿塞尼乌斯说一个小时。
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: '– Арсений Великий говорит спать один час, если ты подвижник. А я тебе говорю: если ты Арсений Великий. По моему мнению, новоначальный, если не имеет брани, должен спать с рассуждением, точно так же, как и есть с рассуждением, чтобы не быть, как одуревшая курица, которая попадает в когти ястреба. Потому что, когда он подвизается выше сил, выматывается и не понимает ни того, что читает, ни того, о чем просит в молитве. Как он может развиться и принести духовные плоды, если еще не имеет духовного запаса? Если же новоначальный имеет брань, то перед тем, как начать жестоко бить свою плоть, ему нужно хорошенько себя исследовать: может быть, виновата не плоть, а гордость, осуждение и т.д. Это можно увидеть, например, если мы примем на себя небольшой подвиг (удаление от людей и бдение), прося Бога, чтобы Он помог нам, а Он не будет помогать. Это и будет доказательством того, что «течет в другом месте».'
        cn: ——大阿森尼说，如果你是一个苦修者，就睡一个小时。而我告诉你：如果你是大阿森尼。依我之见，初学者，如果他没有属灵争战，就应该带着审慎（理智）去睡觉，就像带着审慎（理智）去吃饭一样，以免成为一只懵懂的母鸡，落入老鹰的利爪。因为，当他进行超越自身力量的苦修时，就会精疲力尽，不明白自己所读的，也不明白自己在祷告中所求的。如果他还没有属灵的储备，又如何能发展并结出属灵的果实呢？如果初学者有属灵争战，那么在他开始严酷地打击自己的肉体之前，他需要好好审视自己：也许有过错的不是肉体，而是骄傲、论断等等。我们可以通过如下方式看到这一点，例如，我们承担一个小小的苦修（远离人群和守夜），祈求上帝帮助我们，而祂却不帮助。这将是「在别处漏水」的证明。
    - type: paragraph
      text:
        ru: 'Его спросили:'
        cn: 他们问他：
    - type: paragraph
      text:
        ru: – Я недоумеваю, старче, почему святые отцы, хотя уже совлеклись ветхого человека, продолжали чрезмерно подвизаться?
        cn: – 我不解，长老，为什么圣教父们，即使已经脱去了旧人，仍继续过度地操练苦修？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Брат, ты спрашиваешь меня о земных ангелах, а не о людях. Когда кто-либо совлекается ветхого своего человека, то становится богоносцем. Может ли находящийся в таком состоянии желать вещественного? Иногда они ели что-то, а иногда забывали; то же самое со сном. Ясно ощущаемое присутствие Божие питало их райской сладостью. Поскольку они находились в таком невещественном состоянии, то не имели, в отличие от нас, большой нужды в еде и сне. У них были силы, потому что в них пребывал Христос.
        cn: – 弟兄，你问我的不是关于人，而是关于地上的天使。当任何人脱去他的旧人，他就成为了负神者（theophoros）。处于这种状态的人会渴望物质之物吗？有时他们吃了一些东西，有时他们忘记了；睡眠也是如此。清晰可感的上帝的临在（presence）以属天的甘甜（paradisiacal sweetness）滋养着他们。因为他们处于这种非物质（immaterial）的状态，所以不像我们一样，他们对食物和睡眠没有太大的需要。他们拥有力量，因为基督住在他们里面。
    - type: paragraph
      text:
        ru: 'Его спросили:'
        cn: 他们问他：
    - type: paragraph
      text:
        ru: – Сколько четок нужно читать?
        cn: – 应该诵念多少串念珠？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Один крестьянин с десяти стремм[72]поля собирает пять тысяч килограмм пшеницы, а другой с пятидесяти стремм не собирает и того, что засеял, и при этому него остается усталость в руках от плуга.
        cn: – 一个拥有十斯特伦姆[72]田地的农夫，能收获五千公斤小麦；而另一个拥有五十斯特伦姆田地的人，却连他播种的量都收不回来，而且他的手中还因扶犁而留下疲惫。
    - type: paragraph
      text:
        ru: 'Однажды его спросили:'
        cn: 有一次，有人问他：
    - type: paragraph
      text:
        ru: – Когда я, отче, учился в университете, то мог следить за своим продвижением в науке по оценкам. Здесь же, в духовной жизни, я не знаю, в каком состоянии нахожусь.
        cn: – 孩子，当我在大学学习时，可以通过分数来衡量我在学问上的进步。但在属灵生活方面，我却不知道自己处在什么状态。
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Здесь тоже можешь следить за ним по своим помыслам. Если к тебе постоянно приходят худые помыслы и ты их отгоняешь, а они опять приходят, и ты их опять отгоняешь, тогда знай, что ты перешел в область покаяния и подвизаешься. Если иногда приходят худые, и ты их отгоняешь, а иногда хорошие, то, если считать, что худые оцениваются нулем, а хорошие – десяткой[73], можешь вывести свой средний балл. Когда видишь, например, что худых помыслов стало меньше, а хороших – больше, то знай, что количество нулей уменьшилось, а количество десяток увеличилось, и твоя оценка повысилась. Когда худые помыслы перестанут приходить, но будут одни хорошие, тогда знай, что произошло очищение, твое сердце – «пещера» – очистилось и превратилось в Вифлеемскую пещеру[74].
        cn: – 你也可以在此处通过你的意念来追踪它（指邪恶的念头）。如果坏的意念持续不断地临到你，而你将它们驱逐，它们又再次临到，你又再次驱逐它们，那么要知道，你已进入悔改的领域并正在奋力争战。如果坏的意念时而临到，你将它们驱逐，好的意念时而临到，那么，如果将坏的意念评估为零分，而好的意念评估为十分[73]，你可以得出你的平均分。当你看到，例如，坏的意念变少了，而好的意念变多了，那么要知道，零分的数量减少了，而十分的数量增加了，你的分数提高了。当坏的意念停止临到，而只剩下好的意念时，那么要知道，洁净已经发生，你的心——这「洞穴」——已被洁净并转化成了伯利恒的洞穴[74]。
    - type: paragraph
      text:
        ru: 'Некогда один брат спросил его:'
        cn: 有一次，一位弟兄问他：
    - type: paragraph
      text:
        ru: – Плохо ли, старче, что я противлюсь с каким-то детским упрямством даже своему старцу?
        cn: – 长者，我这种带着孩子气固执的反抗，甚至反抗我的属灵导师，难道不好吗？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: '– Устав, как ты знаешь, иногда говорит нам: «Господи, помилуй» трижды, иногда – двенадцать раз, а иногда сорок. То есть страсти не перестают быть злом в любом возрасте, и, в соответствии с возрастом, у каждого свое количество «Господи, помилуй». Но я не могу понять, как ты, будучи взрослым, имеешь детское упрямство! Однако если ты настаиваешь, что оно детское, то терпи, когда тебя таскают за уши или дают тебе оплеуху.'
        cn: – 如你所知，规章（Устав）有时告诉我们说：「主啊，怜悯！」（Господи, помилуй）说三遍，有时是十二遍，有时是四十遍。这就是说，激情（страсти）在任何年龄都不会停止为恶，并且，根据年龄的不同，每个人都有自己数量的「主啊，怜悯！」。但我不能理解，你作为一个成年人，怎会有小孩子的固执！然而，如果你坚持说那是小孩子的固执，那么就忍受被揪耳朵或被掴耳光吧。
    - type: paragraph
      text:
        ru: 'Другой брат спросил его:'
        cn: 另一位弟兄问他：
    - type: paragraph
      text:
        ru: – У меня, старче, есть много дарований и талантов, и помысел мне говорит, что ко мне несправедливо относятся. Эти мысли замучили меня. Что мне делать?
        cn: ——耆老啊，我有许多恩赐和才能，而意念却告诉我，别人待我不公。这些思绪折磨着我。我该怎么办？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Когда я услышал вначале «У меня есть», то понял, что у тебя ничего нет, кроме твоего «я». Это твое «я» и замучило тебя, и продолжает мучить до сих пор. Только тогда, когда ты уничтожишь свое «я», сломается молоток врага, и он перестанет бить тебя по голове помыслами, превращая ее в талант[75], отчего твои таланты гремят.
        cn: ——当一开始我听到你说「我有」的时候，我就明白你所拥有的，除了你的「我」之外，一无所有。正是这个「我」折磨了你，并且至今仍在继续折磨着你。只有当你消灭了自己的「我」，仇敌的锤子才会折断，它才会停止用妄念击打你的头，把它变成一个「塔冷通」[75]，正因如此，你的塔冷通才会喧嚣作响。
    - type: paragraph
      text:
        ru: 'Некогда один брат спросил его:'
        cn: 曾有一位弟兄问他：
    - type: paragraph
      text:
        ru: – Что мне делать со своим резким характером, который ранит других?
        cn: – 我该如何对付自己那会伤害他人的暴躁性格？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: '– Свой резкий характер направь против своего ветхого человека, чтобы он (характер) получил себе должное применение. Надо знать, что в монашеской общине есть раненые души, которые имеют нужду если не в исцелении, то хотя бы в утешении, а не в еще большем уязвлении. Есть также ангельские души, с которыми мы должны вести себя благоговейно, потому что в глазах Божиих, как я думаю, ангелы во плоти имеют большую ценность, чем сами ангелы. Однако дьявол очень часто насмехается над нами следующим образом: он делает так, чтобы образ[76]ангела мы почитали с большим благоговением, а ангела во плоти – своего ближнего, который есть образ Божий, – уязвляли, оскорбляли и т.д.'
        cn: ——你的急躁性格，要导向对付你的旧人，好叫它（性格）得到应有的用途。须知，在修道团体中有受伤的灵魂，即使得不到医治，也至少需要安慰，而不是受到更大的伤害。此外，也有天使般的灵魂，我们应当怀着敬畏之心与他们相处，因为在我看来，在上帝眼中，肉身中的天使比天使本身更有价值。然而，魔鬼却常常以以下方式嘲弄我们：他使我们对天使的圣像[76]怀有更大的敬畏之心去敬拜，但却刺伤、侮辱肉身中的天使——即我们的近人，他是上帝的肖像，等等。
    - type: paragraph
      text:
        ru: 'Некогда его спросили:'
        cn: 曾有人问他：
    - type: paragraph
      text:
        ru: – Сколько часов в день нужно читать?
        cn: – 每天需要阅读多少小时？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Я не понимаю твоего вопроса, брат. Здоров не тот, кто много ест и глотает, не пережевывая, но тот, кто ест мало и хорошо пережевывает. Нужно даже постоянно жевать то, что читаешь, а также просить Бога, чтобы Он Своим божественным просвещением разрешил бесплодие твоего ума и тот начал бы рождать божественные помышления. Тогда твой ум примет огненный язык Пятидесятницы. Если же мы читаем, чтобы все заучить наизусть, приобрести знания и показывать себя умными – без применения прочитанного к себе, – то не только не приносим пользы другим, но наоборот, сеем неверие, так как люди видят, что то, что мы говорим, не имеет никакого отношения к нам самим.
        cn: — 我不明白你的问题，弟兄。身体健康的，并非那多吃、不咀嚼就吞咽的人，而是那吃得少、却仔细咀嚼的人。甚至，你需要持续地咀嚼你所阅读的内容，并祈求上帝，以祂神圣的启迪来解除你心智的贫瘠，使其开始孕育神圣的思虑。那时，你的心智将会领受五旬节的火舌。然而，如果我们阅读只是为了死记硬背、获取知识并显示自己聪明——却不将所读的付诸实践——那么我们不仅不能使他人得益，反而在播撒不信，因为人们看到我们所言之事与我们自身毫无关联。
    - type: paragraph
      text:
        ru: Поэтому целью чтения должно быть применение прочитанного к себе и не заучивание наизусть, но заучивание в душе, чтобы мы не упражняли язык, но смогли принять огненный язык и опытно пережить тайны Божии. Много учась, чтобы приобрести знания и стать учителем для других, но не применяя знания к себе, человек только впадает в гордость и, самое большое, – поднимается с помощью техники на Луну. А цель христианской жизни состоит в том, чтобы подняться к Богу – без помощи техники.
        cn: 因此，阅读的目的应当是把所读到的内容应用于自身，而不是死记硬背，而是在灵魂中记取，这样我们就不会仅仅操练舌头，而是能够领受那火焰的舌头，并亲身体验上帝的奥秘。一个人若大量学习，目的是获取知识并成为他人的教师，却不将知识应用于自身，他只会陷入骄傲，而最多也只能借助技术登上月球。然而，基督徒生命的目的在于——不借助任何技术——升达上帝面前。
    - type: paragraph
      text:
        ru: 'Некогда его спросили:'
        cn: 曾有人问他：
    - type: paragraph
      text:
        ru: – Что мне делать, старче, когда ко мне приходят худые помыслы? Я их, конечно, не принимаю, однако они меня беспокоят.
        cn: ——长老，当不洁的意念来临时，我该怎么办？我当然没有接纳它们，但它们却困扰着我。
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Брат, и у меня часто над крышей каливы пролетают самолеты и нарушают мое безмолвие. Плохо, когда человек выровняет часть своего сердца и начнет принимать на посадку «волколеты»[77](бесов). Если вдруг случится такое, то необходима немедленная исповедь, вспашка аэродрома и немедленная посадка плодоносных деревьев, чтобы опять вырос райский сад.
        cn: ——弟兄，我的茅棚上空也经常有飞机飞过，扰乱我的静默。糟糕的是，人若是将自己心房的一部分夷平，开始接受「狼机」[77]（魔鬼）降落。如果突然发生这种事情，就需要立即告解，翻耕机场，并立即种上结果实的树木，好让乐园（伊甸园）再次生长出来。
    - type: paragraph
      text:
        ru: 'Его спросили:'
        cn: 他被问及：
    - type: paragraph
      text:
        ru: – Если, старче, мне приходят помыслы такого рода, о которых не принято говорить, что мне делать?
        cn: 「导师啊，如果我涌现出那种不宜启齿的念头，该怎么办？」
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: '– Понимаю, какие помыслы ты имеешь в виду, – те, которые относятся к Богу, божественному и так далее, а часто и к духовному отцу. Все эти хульные помыслы – от диавола. И богохульства от диавола, и грехи эти принадлежат диаволу. Поэтому, брат, не нужно смущать себя грехами диавола. Если кто-то скажет духовнику: «Мне приходят хульные помыслы о Боге, Христе, Святом Духе, Божией Матери, святых или о тебе, моем духовнике», не нужно говорить ничего другого. Духовник не спросит о подробностях, и мы также не должны о них рассказывать. Достаточно сказать только, что «мне приходят хульные помыслы».'
        cn: ——我明白你指的那些意念（помыслы）——那些关乎上帝、神圣事物等等的意念，也常常是关乎属灵父亲的意念。所有这些亵渎的意念都来自魔鬼（диавол）。亵渎上帝之念来自魔鬼，这些罪也归属于魔鬼。因此，弟兄，你无需因魔鬼的罪而困扰自己。如果有人对他的神父说：「我心中出现亵渎上帝、基督、圣灵、上帝之母、圣人或我的神父你的意念」，除了这句话，不需要再说别的。神父不会询问细节，我们也不应该详细说明。只需说「我心中出现了亵渎的意念」就足够了。
    - type: paragraph
      text:
        ru: Злодей диавол, чтобы связать нас, приносит нам помыслы даже о Святом Духе, а затем сам же говорит нам, что этот грех не прощается и т.д. Зачем он говорит нам об этом? Нам это и так известно. Пусть услышит это он сам, хулящий Духа Святого, а не мы, Его почитающие. Из этих рассуждений можно понять, что хула – от диавола, потому что он обычно внушает такие помыслы людям очень благоговейным и чувствительным, надеясь чего-нибудь достичь. Если ему не удается довести человека до отчаяния и самоубийства, то он старается, по крайней мере, довести его до безумия. А если не сможет и этого, то бывает доволен тем, что, по крайней мере, ввел его в меланхолическое состояние. Диаволу достаточно сделать создание Божие ни на что не годным.
        cn: 恶者魔鬼，为了捆绑我们，甚至将关于圣灵的意念带给我们，然后他自己又告诉我们，说这罪是不得赦免的等等。他为什么要告诉我们这些？我们对此已经知晓。愿听到这话的，是他自己——那亵渎圣灵的，而不是我们这些敬拜圣灵的人。从这些推论中可以明白，亵渎是源于魔鬼的，因为他惯常将这类意念灌输给那些非常虔敬而敏感的人，指望能从中有所图谋。如果他不能使人陷入绝望并自杀，他至少会竭力使其达到疯狂的地步。而如果连这也无法做到，他也会满足于至少使人陷入忧郁状态。只要能让上帝的受造物变得一无是处，魔鬼就心满意足了。
    - type: paragraph
      text:
        ru: Я знаю, что вам хотелось бы узнать, что есть хула на Духа Святого и когда человек в ней повинен. Скажу лишь два слова. Как я думаю, богохульство есть пренебрежение к божественному вообще, конечно, если человек находится в здравом уме. Тогда он и виноват. Поэтому невозможно, чтобы благоговейный человек был богохульником. На первой ступени хулы против Духа Святого находятся бесстыжие люди, на второй – презирающие Бога и все божественное, а на третьей – диавол. Поэтому, насколько возможно, нужно беречься бесстыдства, пренебрежения не только к божественному, но и к своему ближнему, ибо он является образом Божиим, и не придавать значения хульным помыслам, которые диавол внушает нам помимо нашей воли.
        cn: '我知道你们想知道亵渎圣灵是什么，以及一个人何时会犯下这种罪。我只说两点。在我看来，亵渎神灵是对一切神圣之事的蔑视，当然，前提是此人神智健全。在这种情况下，他就是有罪的。因此，一个虔诚敬畏的人不可能成为亵渎者。


          在亵渎圣灵的第一阶段，是那些不知羞耻的人；第二阶段，是那些轻蔑上帝及一切神圣事物的人；而在第三阶段，则是魔鬼。


          因此，我们应当尽力防范不知羞耻的行为，不仅要防范蔑视神圣之事，也要防范蔑视我们的邻人，因为邻人是上帝的肖像；同时，我们也不要重视那些魔鬼在我们不情愿的情况下灌输给我们的亵渎意念。'
    - type: paragraph
      text:
        ru: 'Некогда его спросили:'
        cn: 曾有人问他：
    - type: paragraph
      text:
        ru: – Старче, нужно ли верить снам и толковать их?
        cn: – 斯塔列茨，我们有必要相信梦境并对其进行解读吗？
    - type: paragraph
      text:
        ru: 'Он ответил:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Брат, если ты достиг меры Иосифа[78], то тогда нужно. А если нет, то нет.
        cn: ——弟兄，如果你已达到了约瑟夫[78]的量度，那么那时才是必须的。而如果还没有，那就不是必须的。
    - type: paragraph
      text:
        ru: Думаю, что пока хватит этих лекарственных трав. Теперь мне нужно положить их в мешочек (конверт) и отослать. Этот мешочек тоже чужой, как и листы, в которые завернуты чужие травы. Я потратил только два часа, чтобы завернуть их, и за этот мой труд я прошу вас когда-нибудь заплатить мне молитвой. Я нуждаюсь во многих ваших молитвах, однако не хочу вас утомлять.
        cn: 我想，这些药草暂时够了。现在我需要把它们放进小袋（信封）里，然后寄走。这个小袋也是别人的，就像包裹着不属于我的药草的那些纸张一样。我只花了两个小时来包裹它们，而对于我的这项劳作，我请求您将来某日用一次祷告来报答我。我需要您许多的祷告，但我不愿使您感到疲倦。
    - type: paragraph
      text:
        ru: Насколько возможно, возделывайте духовное благородство и духовное мужество. Не допускайте, чтобы среди вас появилась зависть, потому что она испортит всю вашу доброту, как дохлая мышь – горшок с маслом. Доброта женщины велика от природы, однако горшок с добротой женщины, к сожалению, покрывают одним платком (я имею в виду, что большинство женщин так делает), и потому внутрь попадают мыши и ее портят. Поэтому необходима большая осторожность.
        cn: 尽可能地培养属灵的崇高与属灵的勇敢。不要容许嫉妒出现在你们中间，因为它会败坏你全部的良善，如同死老鼠败坏一罐油一样。女人天性中拥有巨大的良善，然而不幸的是，那一罐女人的良善，只用一块手帕盖着（我指的是大多数女人都这样做），因此老鼠会跑进去并将它败坏。所以，极大的谨慎是必需的。
    - type: paragraph
      text:
        ru: Христос и Божия Матерь да будут с вами.
        cn: 基督和上帝之母与你们同在。
    - type: paragraph
      text:
        ru: Ваш брат монах Паисий.
        cn: 您的兄弟，修士帕伊西。
- type: heading1
  text:
    ru: Письмо четвертоеГорсть опыта – семечки, поджаренные на огне искушений
    cn: '书信之四


      一撮经验——在试探之火上烤熟的瓜子（或：炒熟的种子）'
  children:
  - type: heading2
    text:
      ru: Часть 1
      cn: 第一部分
    children:
    - type: paragraph
      text:
        ru: Калива Честнаго Креста, апрель 1974 г. Неделя святых жен-мироносиц. Сестрам исихастирия евангелиста Иоанна Богослова (Суроти)
        cn: '圣十字卡利瓦，1974年4月。圣膏油女周。


          致传道者圣约翰神学家默观院（苏罗蒂）的修女们。'
    - type: paragraph
      text:
        ru: Сестры во Христе, Христос воскресе!
        cn: 在基督里的姊妹们，基督复活了！
    - type: paragraph
      text:
        ru: Сегодня, в неделю жен-мироносиц, когда я шел ночью на литургию в монастырь Ставроникита, я задумался о великой любви жен-мироносиц, превосшедшей даже мужество апостолов.
        cn: 今天，在傅香妇主日，当我在夜晚前往斯塔夫罗尼基塔修道院参加事奉圣礼时，我思考着傅香妇们那伟大的爱，这爱甚至超越了使徒们的勇气。
    - type: paragraph
      text:
        ru: Затем я вспомнил жен-мироносиц нашей эпохи и решил написать то, о чем думал в этот святой день – неделю мироносиц, – и послать своим сестрам. В том, что я пишу, нет ничего особенного, это всего лишь горсть опыта, – семечки, которые я поджарил на огне искушений. Но часто даже жареные семечки помогают притупить чувство голода, пока не наступит время богатого обеда.'
        cn: 随后，我忆起我们这个时代的「抹大拉的马利亚们」（注：指现代的「携香油的妇女们」），并决定将我在这个神圣的日子——携香油的妇女周——所思所想写下来，寄给我的姐妹们。我所写的没有什么特别之处，它不过是一捧经验，是在试炼之火上烤制而成的「瓜子」。然而，通常即便是炒熟的瓜子，也能帮助缓解饥饿感，直到丰盛的筵席到来。
    - type: paragraph
      text:
        ru: Здесь есть кое-что и для мирян, но к монашеству это тоже имеет отношение, и мы должны иметь это в виду, чтобы предохранить себя от различных мирских течений, которые пытаются охладить истинный монашеский дух и обмирщить его, хотя сами миряне должны находиться под влиянием монашества и жить, насколько возможно, духовно, потому что заповеди одни и те же и для мирян, и для монахов и рай тоже один.
        cn: 这里面有些内容是针对平信徒的，但这也与修道生活有关，我们必须将其铭记在心，以保护我们自己免受各种世俗潮流的影响，这些潮流试图使真正的修道精神冷却并使其世俗化。尽管如此，平信徒本身也应当处于修道精神的影响之下，并尽可能地活出属灵的生活，因为诫命对于平信徒和修道士而言都是相同的，天国（或译：乐园）也只有一个。
    - type: paragraph
      text:
        ru: Как я узнал, кроме величайшего мужества, которым располагает духовная любовь, она собирает вокруг себя также все остальные добродетели. Явно, что любовь является любящей матерью всех добродетелей.
        cn: 正如我所知，除了属灵的爱所拥有的至大勇气之外，它也将其余所有德行聚集在自己身边。显然，爱是所有德行所爱的母亲。
    - type: paragraph
      text:
        ru: Те, которые всю свою любовь отдают Богу, получают всю любовь Божию и, отдав себя Богу, отдают себя людям. Те же, которые любят людей больше, чем Бога, так как их любовь плотская, в хорошем ли смысле или плохом, – всегда остаются плотью, так же как те, которые земное любят больше, чем небесное, и сами остаются брением.
        cn: 那些将自己全部的爱献给上帝的人，获得上帝全部的爱，并且，在将自己献给上帝之后，也将自己献给了世人。而那些爱世人胜过爱上帝的人，因为他们的爱是属肉的（无论是在好的意义上，抑或是在坏的意义上），总是停留在属肉的状态；正如那些爱属地之事胜过爱属天之事的人一样，他们自身也仍然是尘土。
    - type: paragraph
      text:
        ru: Те, которые находят себе покой в материальном мире и не беспокоятся о спасении своих душ, подобны неразумным цыплятам, которые не стучат в яичную скорлупу, чтобы ее разбить, выйти наружу и радоваться солнцу – совершить небесный полет к райской жизни, – но остаются неподвижными и гибнут в яичной скорлупе.
        cn: 那些在物质世界中寻得安宁，却不担忧自己灵魂得救的人，如同不聪慧的雏鸡。它们不啄击蛋壳将之打破，走出来，欢喜于阳光——飞向天庭，奔赴乐园的生命——却依然静止不动，最终在蛋壳中消亡。
    - type: paragraph
      text:
        ru: Боящиеся смерти и любящие временную жизнь боятся даже микробов и потому бывают постоянно побеждаемы страхом, который всегда держит их в этой духовной омертвелости.
        cn: 惧怕死亡并爱慕这暂时生命的人，甚至惧怕微菌，因此他们不断地被恐惧所胜，这恐惧总是将他们 удержи在这种属灵的僵死状态中。
    - type: paragraph
      text:
        ru: Люди, имеющие дерзновение, никогда не боятся смерти. Поэтому они подвизаются с ревностью и самоотречением. Они всегда поставляют смерть перед собою и ежедневно думают о ней, а потому готовятся к ней духовно и подвизаются с еще большим дерзновением. Таким образом они побеждают суету и уже здесь живут в вечности и райской радости.
        cn: 拥有坦然无畏（或译「灵性勇气」）的人，永远不会惧怕死亡。因此，他们带着热忱与舍己而苦修。他们总是将死亡摆在自己面前，每日思想死亡，因此他们预备自己的属灵生命，并以更大的坦然无畏去苦修。通过这种方式，他们战胜了虚妄，并已然在此世生活在永恒与天堂的喜乐之中。
    - type: paragraph
      text:
        ru: Не будем надеяться, что легко искореним из себя суетный мир, если нам нравится находиться в нем.
        cn: 我们不应指望能轻易地从自身根除虚妄的尘世，如果我们乐于逗留于其中。
    - type: paragraph
      text:
        ru: Когда мы отчуждаемся от мира, тогда и ум наш легко отчуждается от мира и желает пребывать с Богом.
        cn: 当我们与世界疏离时，我们的心神也就能轻易地与世界疏离，并渴望与神同在。
    - type: paragraph
      text:
        ru: Когда ум человека начинает постоянно пребывать с Богом, тогда он часто забывает не только о своем жилище, но даже о жилище души – бренной плоти.
        cn: 当人的心智开始恒久地与神同在时，他便常常忘记，不仅是自己的住所，甚至也忘记了灵魂的居所——这朽坏的肉体。
    - type: paragraph
      text:
        ru: Тех людей, которые все свое отдают Богу и всецело предают Ему самих себя, покрывает великий купол Божий и охраняет Его божественный промысл. Тогда они становятся детьми Божиими и могут с помощью Божией больше помочь несчастному миру своими молитвами, а также – опять-таки с помощью просвещения Божия – указывать людям правильное направление, чтобы те приблизились к Богу, обрели спасение, счастье и мир для своей души через божественное утешение, потому что душа находит себе покой только рядом с Богом.
        cn: 那些将自己的一切奉献给上帝，并将自己全然交托给祂的人，覆有上帝宏大的穹顶，并受祂神圣的护理所守护。这时，他们便成为了上帝的儿女，能够籍着上帝的帮助，以他们的祷告更多地帮助这不幸的世界；也能够——同样是籍着上帝的启迪——为人们指明正确的方向，使他们亲近上帝，并通过神圣的慰藉，为自己的灵魂寻得救恩、幸福与平安。因为灵魂唯有在上帝身边，才能寻得安息。
    - type: paragraph
      text:
        ru: Люди, удаляющиеся от Бога, естественно, нигде не находят себе покоя. И поэтому, неспокойные, они кружатся даже вокруг Луны, потому что вся наша планета не может вместить их великого беспокойства. Они вращаются, как приводной ремень мотора вокруг сумасшедшего колеса, и много тратят (денег на ветер). А чтобы им хватало хлеба в этих их великих путешествиях, многие остаются без еды, и люди голодают в двадцатом веке.
        cn: 远离上帝的人，自然在任何地方都找不到安宁。因此，他们不安宁，甚至围绕着月亮打转，因为我们整个星球都容纳不下他们巨大的不安。他们旋转，如同马达的传动带围绕着一个疯狂的轮子转动，浪费了许多（把钱扔进风中）。而为了让他们在这些漫长的旅程中有足够的食物，许多人不得不忍受饥饿，在二十世纪，人们仍在挨饿。
    - type: paragraph
      text:
        ru: Все зло начинается с ума, когда он вращается только вокруг науки и совершенно удален от Бога. Поэтому эти люди и не находят внутреннего мира и равновесия. Тогда как если бы их ум вращался вокруг Бога, то и науку они использовали бы для своего внутреннего совершенствования и во благо миру, потому что ум их тогда был бы освященным.
        cn: 一切的恶都始于心思，当心思只围绕着科学转动，并且彻底远离了上帝时。因此，这些人也找不到内在的平安与平衡。然而，如果他们的心思是围绕着上帝转动的，那么他们也会利用科学来实现内在的完善，并造福世界，因为那时他们的心思就已被圣化了。
    - type: paragraph
      text:
        ru: К сожалению, внешнее (мирское) образование постоянно обезображивает как людей, так и прекрасный мир Божий. Оно делает жизнь людей неестественной из-за душевного беспокойства и направляет сотни людей (даже неспокойных младенцев) к психоанализу и психиатрам, а также постоянно строит психиатрические больницы и повышает квалификацию психиатров, тогда как большинство психиатров ни в Бога не верит, ни душу не признает. Как же могут эти люди помогать душам других, когда сами исполнены душевным беспокойством? Как может человек получить истинное утешение, если он не верит в Бога и истинную вечную жизнь после смерти? Но когда человек постигает глубочайший смысл истинной жизни, тогда душевное беспокойство исчезает, приходит божественное утешение и человек исцеляется.
        cn: 很遗憾，世俗（属世的）教育不断地损害着人，也损害着上帝美好的世界。它因着灵魂的忧虑而使得人的生活变得不自然，并驱使数百人（甚至包括那些不安宁的婴孩）去寻求精神分析和精神病学家，同时它不断地建造精神病院并提高精神病学家的资质，然而大多数精神病学家既不相信上帝，也不承认灵魂。当他们自己都充满了灵魂的忧虑时，这些人又怎能帮助他人的灵魂呢？一个人若不相信上帝，不相信死后那真实的永恒生命，他又怎能获得真正的慰藉呢？但是，当一个人领悟了真实生命中最深刻的意义时，灵魂的忧虑就消失了，神圣的慰藉就来临了，这个人也就得以痊愈了。
    - type: paragraph
      text:
        ru: Те, которые ставят на первое место свое внутреннее образование (душевное) и даже внешнее образование используют для внутреннего, быстро преображаются духовно, если при этом духовно подвизаются. Тогда они очень сильно помогают миру, ибо избавляют его от адского душевного беспокойства и ведут к райской радости. Эти люди Божии часто имеют меньше дипломов, однако помогают больше, потому что у них много благодати, а не бумаг (дипломов)[79].
        cn: 那些将自己的内在培育（属灵的）放在首位，甚至利用外在教育来服务于内在教育的人，如果同时进行属灵的争战，他们就会在灵性上迅速地被转化。那时，他们极大地帮助了世界，因为他们使世界摆脱了地狱般的心灵不安，并引向了天堂的喜乐。这些属上帝的人（人子）往往拥有较少的文凭，然而他们提供的帮助却更多，因为他们拥有的是丰沛的恩典，而非纸张（文凭）[79]。
    - type: paragraph
      text:
        ru: Один маленький цветок Божий красивее, чем целая куча фальшивых бумажных цветов, – подобно тому как невещественное лучше нейлона[80].
        cn: 一朵属神的小花，比一整堆虚假的纸花更加美丽，——如同非物质的胜过尼龙[80]。
    - type: paragraph
      text:
        ru: Внешние люди с мирским образованием полны эгоизма и гордыни и похожи на спутники, которые вращаются вокруг земли, создавая впечатление, что являются звездами, хотя если за ними хорошо понаблюдать, то станет видно, как криво они движутся. И тогда понимаешь, что это человеческая фальшь.
        cn: 那些拥有世俗教育的外在之人，充满了自我中心（эгоизма）与骄傲（гордыни），他们就像绕着地球旋转的人造卫星。他们给人留下自己是恒星的印象，但如果仔细观察，就会发现他们移动得多么歪斜。那时你就会明白，这不过是人类的虚假。
    - type: paragraph
      text:
        ru: Поскольку люди глубокой внутренней жизни имеют смирение, то они – истинные звезды, движущиеся с головокружительной скоростью, но бесшумно и смиренно, так что никто не замечает, как они движутся. И это несмотря на то, что они большие планеты. Они скрываются в глубинах неба и создают у других людей впечатление, что являются зажженными лампадками, сияющими тихим светом.
        cn: 既然拥有深刻内心生活的人具备谦卑，他们就是真正的星辰，以令人目眩的速度运行着，却寂静而谦卑，以至于无人察觉他们的运行方式。尽管他们是巨大的行星，情况亦是如此。他们隐藏在天穹深处，给旁人留下的印象是，他们只是被点燃的小油灯，散发着宁静的光芒。
    - type: paragraph
      text:
        ru: Смиренные люди также похожи на соловьев, которые скрываются в лощинах и своим сладким пением сеют в душах людей радость, день и ночь славословя Творца мира. Гордые же ведут себя, как некоторые шумливые куры, которые оглушают мир своим кудахтаньем, как будто их яйцо такое же большое, как наша планета.
        cn: 谦卑的人也像夜莺一样，它们躲藏在幽谷中，并用自己甜美的歌声在人们的灵魂中播撒喜乐，日日夜夜赞美世界的造物主。而骄傲的人，行为则像某些吵闹的母鸡，它们用咯咯的叫声使世界震耳欲聋，仿佛它们的蛋有我们的行星那么大。
    - type: paragraph
      text:
        ru: Большие птицы, которые перелетают в теплые страны, имеют большую любовь и (так как знают большой труд путешествия) на своих крыльях переносят маленьких птиц, встречающихся им во время перелета. Однако на них часто клевещут некоторые куры, у которых от мусора, в котором они копаются каждый день, болят глаза, так что они, несчастные, не могут хорошо видеть. Таким людям, если уж они не могут пришить себе на рот «молнию», лучше отрезать язык ножницами, чтобы не впасть в грех.
        cn: 飞往温暖国度的大鸟，怀有极大的爱，并且（因深知旅途的巨大艰辛）在迁徙途中，用自己的翅膀运载着途中遇到的那些小鸟。然而，它们却经常遭到一些母鸡的诽谤，那些母鸡，因着它们每日在其中刨掘的垃圾，眼睛疼痛，以至于它们，这些不幸的生灵，无法清楚视物。对于这样的人，如果他们实在无法在自己的嘴上缝一道「拉链」，不如用剪刀割断他们的舌头，以免陷入罪中。
    - type: paragraph
      text:
        ru: Не будем искать духовного взаимопонимания с людьми, которые не верят в Бога. Будем молиться, чтобы Бог простил и просветил их.
        cn: 我们不应当寻求与不信上帝之人达成属灵的互相理解。我们当祈祷，愿上帝赦免并光照他们。
    - type: paragraph
      text:
        ru: Также людей эгоистичных и злых (пусть они и говорят, что являются христианами) не пытайся заставить понять истину, потому что истина не вмещается в них.
        cn: 同样，对于那些自私且邪恶的人（尽管他们声称自己是基督徒），你不要试图强迫他们理解真理，因为真理无法容纳在他们之中。
    - type: paragraph
      text:
        ru: Когда такого рода христиане, которые только носят имя христиан, просят нас разрешить их спор (когда они грызутся друг с другом), будем браться за это дело только если они согласятся, чтобы все вопросы решались с помощью Евангелия, потому что все остальные решения будут непрекращающейся головной болью с аспирином[81].
        cn: 当那些徒具基督徒之名的人（这类基督徒）请求我们解决他们的争端（当他们彼此争咬时），我们只应在他们同意所有问题都借着《福音书》来解决的情况下，才着手处理此事；因为所有其他的决议，都将是服了阿司匹林也无法止息的头痛[81]。
    - type: paragraph
      text:
        ru: Все люди, которые ссорятся между собой, считают, что они правы, но только считают себя правыми в большей степени, чем имеют на это право, а потому никак не могут прийти к согласию.
        cn: 所有彼此争吵的人，都认为自己是对的，但他们认为自己对的程度，超出了他们实际应有的权利，因此他们绝不可能达成一致。
    - type: paragraph
      text:
        ru: Евангелие может лучше всего рассудить спорящих.
        cn: 福音最能裁决争辩者。
    - type: paragraph
      text:
        ru: Гордые из-за своего великого эгоизма не могут выйти за рамки своего «я». Лишенные божественного просвещения, они на всех людей смотрят, как на муравьев, а потому и не считаются с ними. Если им и нужны люди для исполнения задуманных ими планов, то на самом деле они нужны им как работники, а не как соработники. То есть они хотят использовать их способности для достижения своих целей. Жертвами их становятся добрые люди, которые тем не менее и выигрывают больше всего, так как хранят свою доброту в Божией сберкассе.
        cn: 骄傲的人，因其巨大的自我中心，无法走出其「自我」的范畴。他们缺乏神圣的启迪，将所有人都视为蝼蚁，因此也就不把他们放在心上。即使他们需要人来执行自己所筹划的计划，实际上他们需要的也只是「工人」，而非「同工」。也就是说，他们想要利用他人的能力来达成自身的目的。他们的牺牲品是那些善良的人，然而，这些人反而赢得最多，因为他们将自己的良善存入了「上帝的储蓄所」。
    - type: paragraph
      text:
        ru: Если между двумя людьми возникла ссора, то будем высказывать свое мнение в присутствии обоих, для того чтобы кто-нибудь из них не истолковал наши слова, как ему выгодно, не использовал их потом как тяжелую артиллерию (если наше слово имеет вес) и не начал безжалостно обстреливать своего противника, для того чтобы его снаряды «ни с того ни с сего» не задели бы и нас. Лучше, насколько возможно, избегать такого рода людей, чтобы иметь мир и возможность молиться о мире этих людей и вообще о мире всего мира. Если кто-то не может избежать встреч с такими людьми (скандалистами), пусть старается избегать, по крайней мере, многословия, чтобы у него было из-за них меньше скандалов. Неважно, что некоторые из этих людей не злые, а просто легкомысленные, потому что они своим легкомыслием тоже вызывают скандалы.
        cn: 如果两个人之间发生了争吵，我们就应当在双方都在场的情况下表达自己的观点，以免其中任何一方曲解我们的话语以对自己有利，随后将其用作重型火炮（如果我们的言论有分量），并开始无情地轰击他的对手，这样一来，他的「毫无缘由」的炮弹就不会连带击中我们。最好是，尽可能地躲避这类人，以便拥有平安，并有机会为这些人的平安，以及为整个世界的平安祈祷。如果有人无法避免与这类人（制造纷争者）见面，那么他至少要努力避免多言，这样他就能减少因他们而起的纷争。这些人中有些并非心存恶念，只是轻浮草率，这并不重要，因为他们的轻浮草率同样会引起纷争。
    - type: paragraph
      text:
        ru: 'Если мы хотим, чтобы все узнали о чем-нибудь, позовем легкомысленного человека, расскажем ему все как будто по секрету и сильно попросим, чтобы это осталось между нами. Этого достаточно, чтобы он передал наши слова всему миру, говоря при этом всем: «Пусть это останется между нами».'
        cn: 如果我们希望让所有人知道某件事，就该叫来一个轻浮的人，把所有事情都告诉他，假装这是秘密，并且恳切地请求他保守这个秘密。这就足够了，他会把我们的话传遍全世界，同时告诉所有人：「这事可要保密啊。」
    - type: paragraph
      text:
        ru: 'Когда мы будем оклеветаны или обижены легкомысленными или лукавыми, злыми и искажающими истину людьми, постараемся всеми силами не желать себе оправдания от людей, если обида относится только к нам самим. Также не будем говорить: «Пусть Бог им воздаст», потому что и это является проклятием. Лучше простить их от всего сердца и попросить Бога, чтобы Он укрепил нас и мы смогли бы поднять тяжесть клеветы, продолжая свою духовную жизнь (по возможности незаметно). И пусть люди, которые имеют обычай судить и осуждать, продолжают клеветать на нас, потому что тем самым они постоянно уготовляют нам золотые венцы для истинной жизни.'
        cn: 当我们被轻率、诡诈、邪恶和扭曲真理的人们诽谤或冒犯时，我们当竭尽全力不去渴望从人那里获得辩白，如果该冒犯仅是针对我们自己的话。我们也不要说：「愿上帝报应他们」，因为这同样是一种咒诅。更好的做法是全心全意地宽恕他们，并祈求上帝坚固我们，使我们能够承担起诽谤的重负，继续我们的属灵生活（尽可能不引人注目地）。而那些惯于论断和定罪的人，就让他们继续诽谤我们吧，因为他们这样做，就不断地为我们在真实的生命中预备着金色的冠冕。
    - type: paragraph
      text:
        ru: Блаженны и трижды блаженны те, которые из-за сплетен, распространяемых о них злыми людьми, кажутся людям бронзой, тогда как на самом деле являются чистым золотом в двадцать четыре карата[82].
        cn: 蒙福的，三倍蒙福的，是那些因着恶人散播的流言蜚语，在世人眼中如同青铜，而在实际上，他们却是二十四K纯金的人[82]。
    - type: paragraph
      text:
        ru: Горе и трижды горе бронзе, которую некоторые люди натирают и обманывают мир, выдавая ее за золото. (В таком положении нахожусь и я, окаянный Паисий. Помолитесь обо мне.)
        cn: 祸哉，三次祸哉，那些人磨亮青铜，欺骗世人，谎称它是黄金。（我这可怜的帕伊西奥斯，也正处在这样的境地。请为我祷告。）
    - type: paragraph
      text:
        ru: Когда сердце от любви Божией становится пылающим очагом, тогда оно может сжигать суету, которая приближается к нему, и когда человек пройдет испытание в очаге жизни, у него в душе воцаряется мир.
        cn: 当心因着上帝的爱而成为炽热的炉膛时，它就能焚烧靠近它的一切虚妄；并且，当人经过生命的炉膛中的试炼之后，平安便在他的灵魂中为王。
    - type: paragraph
      text:
        ru: Чистота имеет свойство прогонять мух и микробов, обеспечивая человеку здоровье. Подобно этому чистота души прогоняет демонов, когда мы не даем им прав над собой. Внешне мы, конечно, ничем не можем им помешать, и они внешними средствами не могут повредить нашей душе.
        cn: 洁净具有驱赶苍蝇和微生物的特性，从而确保人的健康。同样，灵魂的洁净驱赶着邪魔，只要我们不赋予它们辖制我们的权力。当然，在外部我们无法用任何方式阻碍它们，而它们也无法以外在的手段伤害我们的灵魂。
    - type: paragraph
      text:
        ru: Мухи обычно собираются вокруг множества вкусно приготовленных блюд, приправленных пряностями и соусами. Когда мы их избегаем, бесы тоже находятся далеко и бывают безоружны.
        cn: 苍蝇通常聚集在许多美味烹制的、加有香料和酱汁的菜肴周围。当我们避免它们时，邪魔也远离我们，并且手无寸铁。
    - type: paragraph
      text:
        ru: Для повара хорошо, когда у него в очаге немного углей. Тогда они не дают большого пламени и не дымят, и он на небольшом огне готовит прекрасную пищу, Точно так же, когда количество нашей пищи ограничено и мы не увеличиваем его постоянно, плотские похоти и даже помыслы не только не пылают и не помрачают ума дымом, но со временем совершенно угасают.
        cn: 对于厨师来说，炉膛里有少量炭火是很好的。这样它们就不会产生大火焰，也不会冒烟，他就能用小火烹制出美味的食物。同理，当我们的食物量受到限制，并且我们不持续增加它时，肉体的情欲乃至意念不仅不会炽燃，也不会用烟雾遮蔽心智，反而会随着时间完全熄灭。
    - type: paragraph
      text:
        ru: Когда наши желания ограничиваются скудной пищей (сухоядением) и небольшим отдыхом для тощей как скелет плоти, тогда душа радуется в своих мощах. Пусть не отчаиваются находящиеся в миру, если над ними господствует множество страстей, а их характер необузданный и стремительно катится вниз, но пусть возложат упование на всемогущество Божие и быстро повернут руль своей мощной машины на путь Божий, ведущий вверх. Очень скоро они обгонят другие машины, которые уже много лет ехали впереди них по пути Божию с низкой скоростью.
        cn: '当我们的欲望仅限于粗淡的食物（素食）和为这骨瘦如柴的肉体提供少许的休憩时，灵魂就会在自身的力量中喜悦。


          愿那些身在世俗中的人不要绝望，即便他们被诸多情欲所支配，且性情桀骜不驯、急速堕落，但他们要将希望寄托于上帝的全能之上，并迅速将他们那辆强劲的「车」的方向盘转向导向上帝的道路。他们很快就会超过那些已经以低速行驶在上帝的道路上许多年的其他「车」。'
    - type: paragraph
      text:
        ru: Обычно самые большие искушения – мгновенные. Если мы в момент их возникновения избегаем их, то фаланга демонов убегает и мы спасаемся из рук врагов.
        cn: 通常，最大的试探是瞬间发生的。如果我们能在它们发生的瞬间避开它们，那么魔鬼的方阵就会逃跑，我们就能从仇敌手中得救。
    - type: paragraph
      text:
        ru: С неосторожными детьми, которые глазеют по сторонам, переходя дорогу, обычно происходят несчастья, как бывает и с птенцами, которые по своей неосторожности смотрят в глаза змей, поддаются гипнозу, попадают им в пасть и погибают.
        cn: 那些粗心大意、过马路时东张西望的孩子们，通常会遭遇不幸。正如那些雏鸟，因着自己的不谨慎而注视毒蛇的眼睛，受到催眠，落入它们的口中，继而丧命一样。
    - type: paragraph
      text:
        ru: «Птенцов» охраняет любящая мать, имеющая крылья целомудрия и согревающая своих детей благоговением и страхом Божиим. Если же она будет «ощипанной», ее птенцы замерзнут.
        cn: 「雏鸟」受到慈母的保护，她拥有贞洁的翅膀，并以敬畏与敬畏上帝之心温暖着她的孩子们。如果她被「拔光了羽毛」，她的雏鸟就会冻死。
    - type: paragraph
      text:
        ru: Первую духовную простуду дети получают из-за открытых окон чувств своих родителей. Больше всего их простуживает мать, если она не одета в целомудрие или даже пытается «ощипать» своих детей.
        cn: 孩子们的第一次属灵感冒，是因为他们父母敞开的感官之窗。让他们最受寒的是母亲，如果她没有穿上贞洁的外衣，甚至试图「拔光」自己的孩子。
    - type: paragraph
      text:
        ru: Неискреннее поведение родителей, каким бы хорошим оно ни казалось, не вызывает в душе у детей доверия, и потому они не слушаются, даже если с ними обращаются строго. Дети делают вид, что сжимаются от страха, но поступают так потому, что пока не могут сделать ничего другого. Когда же немного подрастают и уже не имеют большой нужды в родителях, тогда начинают с наглостью брыкаться и изливают на родителей всю накопившуюся злобу.
        cn: 父母不真诚的行为，无论它看起来多好，都不会在孩子的灵魂中引起信任，因此他们就不听从，即便对他们要求严格。孩子们假装因恐惧而畏缩，但他们这样做是因为暂时还不能做其他事情。当他们稍微长大，不再需要太多父母的照料时，便开始蛮横地反抗，并向父母倾泻出所有积压的愤怒。
    - type: paragraph
      text:
        ru: Святая жизнь родителей вызывает доверие в душе у детей, и они охотно их слушаются и вырастают благоговейными и без психических травм (с двойным здоровьем). Тогда дети радуются о своих родителях и родители радуются о своих детях как в этой жизни, так и в вечной, где они будут снова радоваться вместе.
        cn: 父母的圣洁生活在孩子心中唤起信任，他们就乐意听从父母，长大后成为敬虔的人，没有心灵创伤（拥有双重健全）。这样，孩子为他们的父母欢喜，父母也为他们的孩子欢喜，无论是在今生还是在永恒的生命中，在那里他们将再次一同欢喜。
    - type: paragraph
      text:
        ru: Игумении, которые являются духовными матерями и исполняют великую миссию возрождения своих духовных чад, тоже не должны требовать к себе уважения от своих чад силой своего игуменского сана, но должны внушать к себе уважение посредством благодати благоговения, проистекающей из их святой жизни. Тем более не должны делать из себя великих стариц те, которые сами никогда не были послушницами.
        cn: 女院长们，作为属灵母亲，承担着使她们的属灵儿女重生的伟大使命，她们也不应该凭着她们女院长的职权去强行要求儿女们的尊重，而应该藉着从她们圣洁生活中流溢出的敬畏的恩典来感发他人对她们的尊重。那些自己从未做过初学女修女的人，就更不应该自诩为伟大的女长老了。
    - type: paragraph
      text:
        ru: Не будем искать себе послушников, если сами не можем поначалу хотя бы иногда вести себя как послушники, чтобы иметь возможность жить одной жизнью со своими послушниками.
        cn: 我们不当寻求收受门徒（послушников），如果我们自己一开始至少不能偶尔表现得像个门徒，以便能够与我们自己的门徒（послушниками）活在同一生命中。
  - type: heading2
    text:
      ru: Часть 2
      cn: 第二部分
    children:
    - type: paragraph
      text:
        ru: Послушник, особенно вначале, нуждается в большой любви, чтобы не стать неполноценным, ибо многие дети в миру имеют родителей, однако, к сожалению, для многих из этих детей все равно, имеют они родителей или нет, потому что они никогда не знали, что значит родительская любовь, но слышали только упреки.
        cn: 初学修士，尤其是在初始阶段，需要极大的爱，以免变得不健全。因为世上有许多孩子拥有父母，然而，令人遗憾的是，对于这些孩子中的许多人来说，他们是否有父母都无所谓，因为他们从未了解父母之爱意味着什么，而听到的只有指责。
    - type: paragraph
      text:
        ru: Поэтому нам нужно иметь любовь, нежность и большую рассудительность, чтобы наши духовные чада росли с двойным здоровьем и чтобы, пока они малы, ничто им не повредило, даже их безрассудная ребяческая ревность.
        cn: 因此，我们需要具备爱、温柔和极大的明辨力，使得我们的属灵儿女能够带着双倍的康健成长，并且使得他们在尚幼之时，没有任何事物能够伤害他们，甚至包括他们那轻率的、稚气的嫉妒心。
    - type: paragraph
      text:
        ru: Как богатые миряне делают своих детей богатыми земными благами, так как имеют богатство, так и богатые духовно делают своих детей богатыми. Однако, чтобы стяжать духовное богатство, нужно сначала стать нищими в отношении страстей (а также, конечно, и в отношении материальном). Когда у нас совсем не будет страстей, тогда мы будем иметь щедрую доброту и раздавать ее всем вообще детям, и они будут питаться ею даже телесно, потому что доброта вместе со своей горячей любовью дает детям больше калорий, чем всякая другая пища.
        cn: 就像富有的平信徒用属世的财物使他们的儿女变得富有一样，因为他们拥有财富；同样，在精神上富有的人也使他们的儿女变得富有。然而，要获取属灵的财富，首先必须在对治情欲（当然，也包括物质方面）上变得贫穷。当我们完全没有情欲时，我们就会拥有慷慨的良善，并将它分施给所有的孩子，甚至他们的身体都会因此得到滋养。因为良善连同其炙热的爱，能给孩子提供的热量比任何其他食物都要多。
    - type: paragraph
      text:
        ru: Если мы не приобретем духовного богатства, чтобы жить на духовные проценты, то, когда придет время даром трудиться на других, мы будем самыми несчастными и достойными сожаления людьми. Поэтому не будем считать пустой тратой времени работу над самими собой в течение короткого или долгого времени или в течение всей своей жизни, потому что тайная работа имеет свойство тайно проповедовать слово Божие в душах человеческих.
        cn: 如果我们不获得属灵的财富，以便靠属灵的利息生活，那么，当为他人白白劳作的时候到来时，我们将成为最不幸和最可怜的人。因此，我们不要认为花费或长或短的时间，或用尽我们的一生，在自己身上工作是浪费时间，因为这种隐秘的工作具有在人的灵魂中隐秘地宣扬上帝圣言的特质。
    - type: paragraph
      text:
        ru: Добродетель имеет обычай выдавать человека, где бы он ни скрывался. Даже если он ради Христа притворится безумным, она опять его выдаст, хотя и позже; но накопленное сокровище, которое обнаружится позже, опять поможет многим душам и тогда, возможно, в еще большей степени.
        cn: 美德有一种惯常的做法，即显明一个人，无论他隐藏于何处。即便他为了基督的缘故假装自己是愚拙的，美德仍会再次显明他，虽然会晚一些；但那积蓄的宝藏，虽会稍后才被发现，届时将再次帮助许多灵魂，并且那时，可能以一种更大的程度来助益。
    - type: paragraph
      text:
        ru: Доверие к Богу есть постоянная тайная молитва. Она бесшумно призывает силу Божию туда, где она нужна, и Бога постоянно с благодарностью славословят Его ревностные чада.
        cn: 对上帝的信赖是一种持续的、隐秘的祈祷。它悄然无声地呼召上帝的能力，使其降临到需要之处，而祂热忱的儿女们也持续地以感恩赞美称颂上帝。
    - type: paragraph
      text:
        ru: Нестяжательные монахи, вверяющие себя Богу, имеют в своих руках все хранилища Божии, и им достаточно только протянуть руки к небу, чтобы получить благословение.
        cn: 奉行无财产的修士，将自己交托于上帝，他们手中拥有上帝一切的宝库，他们只需向着天空伸出双手，便可获得祝福。
    - type: paragraph
      text:
        ru: Нестяжательным принадлежат и хранилища всех их знакомых, которые даже самих себя вверили в руки нестяжательных людей Божиих.
        cn: 不置产者拥有他们所有相识者的库藏，甚至这些相识者还将他们自身也托付给了这些实行不置产的属神之人手中。
    - type: paragraph
      text:
        ru: Нестяжательные приводят в умиление даже разбойников, которые часто оказывают нестяжательным помощь, подобно тому как сами разбойники получают от них пользу благодаря подаваемому ими примеру нестяжательности и особенно благодаря их молитвам о том, чтобы Бог просветил их и они покаялись и больше не крали. Если разбойники соблазняются и приходят, чтобы их обокрасть, но не находят ни одной пригодной вещи, которую можно было бы взять, то получают вразумление и от нестяжательности, и особенно от доброты нестяжательных, которые очень огорчаются оттого, что разбойники проделали столько труда и уходят с пустыми руками. Эта печаль очень сильно действует на разбойников и изменяет их.
        cn: 安贫者甚至引盗贼动心，这些盗贼常常向安贫者施以援手，正如盗贼自己也从他们那里受益，藉着他们所立下的不贪财物之榜样，尤其藉着他们所献上的祷告，祈求上帝光照他们，使他们得以悔改，不再偷窃。如果盗贼被诱惑而前来劫掠，却找不到任何可取走的适宜之物，他们就会从安贫者的不贪财物中，尤其从安贫者的仁慈中得到教诲。安贫者因盗贼徒劳奔波而空手离去感到极度忧伤。这种忧伤对盗贼作用甚大，并使他们得以改变。
    - type: paragraph
      text:
        ru: Мы же, не хранящие обета нестяжания и собирающие себе богатство, собираем также разбойников, которые приходят ночью, избивают нас и забирают у нас дорогие вещи, а нам оставляют убогие, монашеские. Таким образом, то, чего мы не исполняли по повелению Евангелия и по примеру святых отцов, начинаем исполнять, когда нас бьют разбойники.
        cn: 然而我们，这些不遵守不持产之誓、为自己积累财富的人，也在聚集强盗。他们夜里前来，殴打我们，抢走我们贵重之物，而给我们留下的，却是简朴、修士之物。如此一来，我们不遵照福音的诫命、不效法圣教父的榜样去履行的事，却在强盗殴打我们之时，开始去履行了。
    - type: paragraph
      text:
        ru: Не будем успокаивать себя, когда под ударами разбойников становимся нестяжательными, но, наоборот, нас должна укорять совесть, что мы не сохранили нестяжательности и не подумали вовремя по доброй воле раздать вещи, нужные мирянам, чтобы те не были вынуждены становиться ворами, подвергаться опасностям и терять свое доброе имя. Если они будут немного чувствительными, тогда их будет мучить совесть из-за того, что они побили монаха, хотя на самом деле они сделали для него добро, пусть и этим злым способом.
        cn: 我们不应在强盗的袭击下被迫变得无所贪求时，便自我安慰。恰恰相反，我们的良心应该谴责我们，因为我们没有持守住不贪求财物这一美德，没有及时主动地将俗世所需的物品分发给平信徒，以至于他们不得不沦为窃贼、面临危险、并失去他们的好名声。如果他们还有一点点良知，那么他们会因殴打了修道士而遭受良心煎熬，尽管事实上，他们以这种邪恶的方式，反而成就了修道士的益处。
    - type: paragraph
      text:
        ru: Итак, обнажим нашу келлию от богатств, а душу от страстей, чтобы наша жизнь и монашеская миссия приобрели смысл, потому что где материальное богатство, там духовное убожество.
        cn: 因此，让我们使我们的隐修室摆脱财富，使我们的灵魂摆脱情欲，好让我们的生命和修士使命获得意义，因为哪里有物质财富，哪里就有精神的贫乏。
    - type: paragraph
      text:
        ru: Богатство приносит душе полное разрушение, если мы не раздаем его бедным душам за свои души и за души наших усопших сродников.
        cn: 财富会给灵魂带来彻底的毁灭，如果我们不将它为了我们自己的灵魂以及我们已故亲属的灵魂，而分发给贫苦的灵魂。
    - type: paragraph
      text:
        ru: Богатство душит душу великим беспокойством из-за ненасытности. Когда мы видим человека в великом душевном беспокойстве, смущении и печали, хотя у него все есть (ему всего хватает), можно понять, что ему не хватает Бога.
        cn: 财富因着不知足而以极大的不安窒息着灵魂。当我们看到一个人处于极大的灵魂不安、困惑与忧伤之中，尽管他拥有一切（他什么都不缺），我们便能明白，他所缺乏的是上帝。
    - type: paragraph
      text:
        ru: Самые большие и самые лучшие богачи в мире те, у которых нет материальных богатств и которые совершенно обнищали, как обнищали от страстей. У них нет ненужных вещей ни в душе, ни вовне (материальных), но только один Бог. Они непрестанно радуются, живя райской жизнью уже здесь, потому что где Бог – там и рай.
        cn: 世上最大、最好的富翁，是那些没有物质财富、完全一贫如洗的人，他们因着脱离情欲而成为赤贫。他们在灵魂中和在物质（外在）上都没有不必要的东西，唯独拥有独一的上帝。他们不断地欢喜快乐，在此地就已经过着天堂般的生活，因为上帝所在之处，即是天堂。
    - type: paragraph
      text:
        ru: Там, где совершенно нет человеческого утешения, царствует Бог и радость переливается через край, потому что она так велика, что не вмещается в сердце.
        cn: 在完全没有人间慰藉之处，上帝便在那里掌权为王，而喜乐也满溢而出，因为这喜乐是如此浩大，以至于心容纳不下。
    - type: paragraph
      text:
        ru: Любви, которая взращивается в безутешной пустыне, не вмещает мир, поскольку в ней нет ничего мирского. Не может она вместиться и в умах многих людей (которые мыслят по-мирски), поэтому часто ее могут неправильно понимать.
        cn: 在那荒凉的旷野中所培养的爱，世界容纳不下它，因为爱中没有丝毫世俗之物。它也不能容于（那些以世俗方式思考的）许多人的心意，因此它常被误解。
    - type: paragraph
      text:
        ru: Когда духовная вспашка мирского сердца происходит вдали от мира, ради любви Божией, тогда человек может вместить в своем сердце всех людей, всех животных и даже всех змей, а вместе с ними весь прекрасный мир Божий. Все это он видит уже добрым и прекрасным, потому что тогда прекрасная душа человека постоянно источает доброту.
        cn: 当世俗之心的属灵耕耘在远离世界之处，为了上帝的爱而发生之时，那时，人就能在自己的心中容纳所有的人、所有的动物，甚至所有的蛇，以及与它们同在的整个上帝的美丽世界。所有这一切在他眼中都已是良善和美好的，因为那时，人美好的灵魂会不断地流溢出良善。
    - type: paragraph
      text:
        ru: Для того чтобы к нам пришла внутренняя доброта, очень полезно ставить себя на место другого, потому что тогда сами по себе приходят любовь, сострадание, смирение, благодарность Богу вместе с непрестанным славословием, а также сердечная молитва о нашем ближнем. Тогда наша молитва становится благоприятной Богу и помогает другому человеку.
        cn: 为了使内在的良善临到我们，设身处地为他人着想是非常有益的，因为那时，爱、怜悯、谦卑、对上帝的感恩，连同不间断的颂赞，以及为我们的近人献上的恳切心祷，就会自然而然地到来。那时，我们的祈祷就成为蒙上帝悦纳的，并能帮助到另一个人。
    - type: paragraph
      text:
        ru: Если бы мы поставили себя даже на место змеи, то, у без сомнения, в нас появилось бы большое сострадание к ней, и она бы это сразу почувствовала и приблизилась к нам, как друг. Тогда наша благодарность Богу за то, что Он почтил нас Своим образом, а не сделал нас змеями, была бы, конечно, намного больше. А ведь Он Господин и мог бы сделать нас змеями, чтобы мы ползали по земле, ели землю и большую часть времени проводили в холодной норе в спячке. Таким образом, любовь вместе с состраданием, ставя себя на место другого, даже змей заключает в сердце человека и делает их его друзьями. Тогда как зависть делает из человека змею, так что он кусает людей. Отравляет их своим ядом, а искушенные люди со злобой бьют его. Тогда возникает – Боже избави – картина ада вместе со всем его диавольским уставом.
        cn: '即使我们把自己放在蛇的位置上，无疑，我们也会对它产生极大的怜悯，而它会立刻感受到这一点，并像朋友一样靠近我们。那么，我们对上帝的感恩——感谢祂用祂的形象荣耀了我们，而不是把我们造成蛇——无疑会更加深切。毕竟，祂是主宰，祂本可以把我们造成蛇，让我们在地上爬行，以土为食，大部分时间都在寒冷的地洞里冬眠。


          因此，爱与怜悯一起，通过设身处地为他人着想（即便是蛇），将它们包容在人的心中，使它们成为人的朋友。


          而嫉妒却能使人变成蛇，使他去咬人。他用自己的毒液毒害人，而受试探的人则带着恶意攻击他。


          于是，便出现了——求主拯救——一幅地狱的景象，连同其全部的魔鬼章程。'
    - type: paragraph
      text:
        ru: Завистливые и злые люди, где бы они ни оказались, переносят вместе с собой свои зло, лукавство и адские мучения и стараются мучить других, как это делают и демоны.
        cn: 心怀嫉妒和恶毒之人，无论身在何处，都将自身的恶、诡诈以及地狱般的折磨随身携带着；他们力图折磨他人，正如同恶魔所行的一样。
    - type: paragraph
      text:
        ru: Люди, имеющие любовь и доброту, похожи на ангелов, которые приносят с собой радость и веселие, где бы они ни оказались.
        cn: 拥有爱与良善的人，如同天使一般，无论他们出现在何处，都会带来喜悦与欢愉。
    - type: paragraph
      text:
        ru: Женщин, поскольку они по своей природе имеют больше любви, диавол сильно борет (по зависти), пытаясь отравить их любовь ядовитой завистью. И если ему это удается в отношении какой-то женщины, то ее злоба может достигнуть подчас бесовской силы – упаси Бог!
        cn: 由于女性天性中拥有更多的爱，魔鬼（出于嫉妒）极力与她们争战，试图用带毒的嫉妒毒害她们的爱。如果他对某个女性得逞了，那么她的恶毒有时会达到鬼魔般的力量——愿上帝保守！
    - type: paragraph
      text:
        ru: Мужчины имеют по природе более сильный туман гордости, однако, если враг к меньшей гордости женщины добавит зависть, тогда ее туман становится более невыносимым, чем ядовитый туман мужчин (от влажности зависти).
        cn: 男人天生具有更强的骄傲之雾（ туман гордости）；然而，如果仇敌（враг）在女人较小的骄傲中再添上嫉妒（зависть），那么她的迷雾就会变得比男人的毒雾更加难以忍受（出于嫉妒的湿性）。
    - type: paragraph
      text:
        ru: Люди, которые наблюдают за нами со стороны, могут помочь нам, если мы, смирившись, позволим им сделать это, потому что если мы – Боже упаси! – живем в тумане, то можем подумать, что весь мир тоже живет в таком же тумане, совсем не будем беспокоиться о себе и навсегда останемся больными в тумане, пока и не умрем больными.
        cn: 旁观我们的人能够帮助我们，只要我们谦卑地允许他们这样做。因为如果我们——愿上帝不至于如此！——活在迷雾之中，那么我们可能会认为整个世界也活在同样的迷雾之中，完全不会为自己担忧，并永远在迷雾中保持病态，直到我们带着这病态死去。
    - type: paragraph
      text:
        ru: Если мы окажемся одни и у нас не будет человека, которого мы сможем попросить помочь нам и показать нам наши недостатки, то выйдем из своей келлии на возвышенное место и исследуем себя, как постороннее лицо. Тогда мы увидим, идем ли мы верным путем или заблуждаемся.
        cn: 如果我们发现自己独处，身边没有能够请求帮助并指出我们缺点的人，那么我们就应当走出自己的小室（келлии），前往一个高处，像旁观者一样审视自己。那时我们就能看出，我们是否走在正确的道路上，抑或已经迷失了方向。
    - type: paragraph
      text:
        ru: Наблюдение за собой является необходимым, так как и бакалейщики, если не следят внимательно за своими расходами и доходами, быстро становятся банкротами. Также необходимо внимание к помыслам, потому что из-за небольшой неосторожности многие сожгли свои дома и, несчастные, оказались на улице.
        cn: 对自身的观察是必需的，正如杂货商若不仔细留意其支出和收入，便会迅速破产。同样，对意念的留心也是必需的，因为许多人就是由于一丝不慎而烧毁了自己的家，不幸流落街头。
    - type: paragraph
      text:
        ru: Новоначальному для строительства его духовного дома нужны не только строительные материалы, но и хороший мастер, который, разрушив его старый дом, чтобы изгнать оттуда его злого обитателя – ветхого человека, начинает по порядку свою работу, вплоть до меблировки нового дома.
        cn: 初学功课者要建造他的精神之家，不仅需要建筑材料，还需要一位好的工匠。这位工匠会拆毁他旧有的家，以驱逐那住在那里的恶者——那旧人，并开始按部就班地工作，直到新家完成家俱的布置。
    - type: paragraph
      text:
        ru: Начиная строгать дерево, нужно посмотреть, как расположены его волокна, чтобы не строгать «против шерсти» и не оставлять шероховатостей. Если остаются шероховатости, нужно не высовывать сильно лезвие рубанка, чтобы оно не захватывало дерево глубоко. Также при этом нужно строгать иногда с одной стороны, а иногда с другой, потому что иначе поверхность будет неровной.
        cn: 在开始刨木头时，需要看清它的纹理是如何排列的，以免「逆着纹理」刨，并且不留下粗糙之处。如果留下了粗糙之处，就不应该让刨刀的刀刃伸出出太多，以免它深深地吃入木头。此外，在此时，还需要时而从这一侧刨，时而从那一侧刨，因为否则的话，表面将是不平整的。
    - type: paragraph
      text:
        ru: Некоторые доски снаружи кажутся хорошими, но, если с них снять верхний слой, внутри оказываются волокнистыми. Другие же, хотя снаружи и кажутся непригодными, внутри оказываются хорошими, смолистыми. Поэтому не будем делать выводы, судя по внешности, не проверив всего, тем более если нам не хватает божественного просвещения или опыта.
        cn: 有些木板，从外面看来似乎不错，但是如果剥去表层，内部却是纤维状的。而另一些木板，虽然外面看起来似乎不适用，但内部却是好的、富含树脂的。因此，在我们没有进行全面检验之前，尤其是在我们缺乏神圣的启迪或经验之时，切勿仅凭外表就下结论。
    - type: paragraph
      text:
        ru: Монахи должны стать всецело светом, поэтому им нужно уподобиться сосне, которая превращает свои волокна (щепки) в лучину. Сосна должна вырасти на скалистом и солнечном месте. Когда с нее сдерут кору и она начнет «плакать», ее слезы, то есть смола, будут под горячими лучами солнца постоянно пропитывать ствол и постепенно превращать всю сосну в хороший материал для лучины, которая дает свет и служит для растопки, чтобы люди могли разводить для себя огонь.
        cn: 修士必须全然成为光，因此他们需要效法松树，将自身的纤维（木片）转化为火把[或引火柴]。松树必须生长在多岩石且阳光充足的地方。当松树的树皮被剥下，它开始「哭泣」时，它的眼泪，即树脂，会在炙热的阳光下持续浸润树干，并逐渐将整棵松树转变成制作火把的优质材料。这种材料能发光，并可用作引火物，以便人们能够为自己生起火焰。
    - type: paragraph
      text:
        ru: Конечно, обтесывание нужно для того, чтобы счистить кору ветхого человека, а не чтобы безрассудно ранить людей и делать их ни на что не годными.
        cn: 当然，琢磨是必要的，为的是剥去「旧人」的树皮，而不是为了鲁莽地伤害人，使他们毫无用处。
    - type: paragraph
      text:
        ru: Никогда не будем никого по-военному заставлять слушаться нас, но по-ангельски, с благоговением. Посох игумении, когда она имеет благодать Божию, издалека собирает монахинь, как железо (божественное) к магниту (благоговения).
        cn: '我们永远不要以强迫性的、军事化的方式要求任何人顺服我们，而是要以天使般的态度，带着敬畏之心（对待他们）。


          女修道院院长的权杖，当她拥有上帝的恩典时，能从远处召集修女们，如同（神圣的）铁被（敬畏的）磁石所吸引一般。'
    - type: paragraph
      text:
        ru: Если вы оказались игумениями, со смирением служите в своем сане Христу и служите так, как Христос Своим ученикам.
        cn: 如果你被选立为女隐修院院长（伊古梅尼亚），要以谦卑的心在你的圣职中服侍基督，并且要像基督服侍祂的门徒那样去服侍。
    - type: paragraph
      text:
        ru: Помните всегда, как шел Моисей с двумя миллионами ропотливого народа и сколько он молился с любовью о своем народе, как сам много лет мучился в пустыне, пока не довел его до земли обетованной. Если вы будете помнить об этом, очень укрепитесь и никогда не будете роптать на свои незначительные по сравнению с Моисеевыми страдания.
        cn: 务要常常记念摩西如何带领着两百万常常发怨言的百姓，他如何带着爱为自己的百姓献上如此多的祷告，以及他自己如何在旷野中受苦多年，直到将他们带进应许之地。如果你们能记念此事，你们就会大得坚固，并且永不会抱怨自己的苦楚，因为比起摩西所受的苦难，你们的苦楚是微不足道的。
    - type: paragraph
      text:
        ru: Никогда не будем стремиться к игуменству или другим должностям, чтобы с их помощью прославиться, потому что это обнаруживает в нас прогрессирующую болезнь, а также то, что мы идем иным, нездоровым, путем, а не тем (путем смиренномудрия), которым шли святые отцы, достигшие рая.
        cn: 我们绝不要追求担任院牧（игуменство）或其他任何职务，并试图借此荣耀自己。因为这种行为显露出我们身上一种不断恶化的病症，也表明我们正在走一条不健康的他途，而非圣教父们（借着谦卑的道路）抵达天国所遵循的那条（谦卑之道）。
    - type: paragraph
      text:
        ru: 'Если мы не можем подражать святым отцам Египта с великой строгостью их монашеской жизни, тогда будем подражать, по крайней мере, верблюдам, которые, хотя и едят мало, поднимают большие тяжести. От многочисленных коленопреклонений у них образуются мозоли и, будучи тяжело нагруженными, они смиренно следуют за маленьким осликом. У них есть еще и такой обычай: они никогда не забывают своих благодетелей и испытывают к ним благодарность.'
        cn: 如果我们无法以埃及圣父们严格的修道生活来效法他们，那么，至少也要效法骆驼。骆驼虽然吃得不多，却能承受重负。它们因无数次跪拜而生出胼胝，且在重载之下，仍谦卑地跟随着一头小小的驴子。它们还有一个习性：它们从不忘记自己的恩人，并对他们心怀感恩。
    - type: paragraph
      text:
        ru: Познавшие великую ценность покаяния (ангельского образа)[83]не желают других званий, потому что все в этой жизни суетно. Когда мы начинаем это понимать, тогда смиренно подчиняемся и в покаянии с терпением живем в месте, где начали свое покаяние (в обители), радуясь всю свою жизнь.
        cn: 领悟到悔改（即天使的生活方式）[83]巨大价值的人，不渴求其他的名分，因为此生的一切都是虚妄的。当我们开始理解这一点时，便会谦卑地顺从，在开始悔改之地（修道院）带着忍耐，在悔改中生活，并一生喜乐。
    - type: paragraph
      text:
        ru: Принимающие ангельский образ в юном возрасте и подвизающиеся со смирением и ревностью очень умилостивляют Бога. И если их схима снаружи немного запылилась (от старости), думаю, она чище, чем у тех, которые намеренно принимают ее в старости, чтобы пожить в лености и похвалиться в час смерти совершенно новой схимой (прямо от портного). Они дают свои обеты на смертном одре полумертвым голосом, говоря, что будут хранить девство, нестяжание и послушание. Где? В могиле? Не будем успокаивать себя подобными иллюзиями.
        cn: 那些在年轻时领受天使形象（受戒）并怀着谦卑和热忱苦修的人，极大地取悦了上帝。如果他们的修道大衣（схима）外表因年代久远而有些尘土，我认为它比那些故意在年老时才受戒的人的要洁净。后者受戒是为了在懒惰中度日，并在临终时夸耀一件崭新的（刚从裁缝那里取来的）修道大衣。他们在弥留之际，用半死不活的声音许下他们的誓愿，说他们将守贞洁、不占有（不贪财）和服从。在哪里守？在坟墓里吗？我们不要用类似的幻想来安慰自己。
    - type: paragraph
      text:
        ru: Другое дело, когда какой-нибудь старичок сподобляется прийти в единонадесятый час, сразу же принимает ангельский образ и подвизается с большим самоукорением, поскольку не может совершать особых телесных подвигов.
        cn: 另一回事，当某位老人家蒙恩在第十一个时辰到来，随即接受天使的形像，并以极大的自我谴责进行修持，因为他无法从事特殊的身体苦修。
    - type: paragraph
      text:
        ru: Блаженны принявшие ангельский образ, подвизающиеся со смирением и ревностью, живущие на земле, как ангелы, просвещающие мир своим светлым примером и с помощью Милостивого Бога оказывающие миру (живым и умершим) милость своими молитвами. Их святая жизнь, думаю, является самой великой панихидой за все поколения их усопших сродников, душам которых приносит большое облегчение та радость, которую они испытывают за предмет похвалы своего рода – монахов. И, конечно, Бог упокоевает их души по молитвам этих подвижников, потому что их молитвы благоприятны Ему.
        cn: '那些领受了圣天使形像、以谦卑和热忱潜心修行、在地上如同天使般生活的人是有福的，他们以自己光明的榜样光照世人，并借着仁慈的上帝的帮助，以他们的祈祷向世人（活人与亡者）施予恩典。


          我想，他们圣洁的生活，是为他们已故亲属所有世代所献上的至大的追思礼拜，而这些已故亲属的灵魂，也因着（家族中）出了修道士——这一令他们家族引以为荣的荣耀——而感到极大的宽慰。当然，上帝借着这些潜修者的祈祷，使他们的灵魂得以安息，因为他们的祈祷蒙祂悦纳。'
    - type: paragraph
      text:
        ru: Печально, что люди, которые живут греховной жизнью, постоянно отягощают души своих усопших сродников, потому что те чувствуют себя виноватыми в том что стали причиной рождения этих людей, и того что они живут вдали от Бога и их ожидают вечные мучения после малых мучений в сей жизни, которую они проводят во грехе.
        cn: 令人悲伤的是，那些过着罪恶生活的人，不断地加重他们已故亲属的灵魂负担，因为这些亲属感到内疚，他们是这些人出生的起因，并内疚于这些人生活在远离上帝之处，内疚于这些人将在这短暂的、在罪中度过的人生的小小痛苦之后，还要面临永恒的折磨。
    - type: paragraph
      text:
        ru: Молитесь, чтобы Благий Бог просветил всех людей и дал нам доброе покаяние, в котором все мы нуждаемся (и я, может быть, – больше всех), чтобы смерть застала нас в добром духовном состоянии и мы достигли бы Небесного Царствия Божия. Аминь, аминь, аминь? Дай Бог!
        cn: 请您们祈祷，愿仁慈的上帝光照所有人，并赐予我们良好的悔改——这正是我们所有人所需要的（而我，也许是最需要的），好叫死亡临到我们时，我们处于良好的属灵状态，并能抵达天上的上帝之国。阿们，阿们，阿们。愿上帝成全！
    - type: paragraph
      text:
        ru: С любовью о Христе ваш брат монах Паисий.
        cn: 在基督里的爱中，您的兄弟，修士帕伊西。
- type: heading1
  text:
    ru: Письмо пятоеО девстве и любви
    cn: '书信五


      论守贞与爱'
  children:
  - type: heading2
    text:
      ru: Часть 1
      cn: 第一部分
    children:
    - type: paragraph
      text:
        ru: Калива Честного Креста, 26.11.1973 г.
        cn: 卡利瓦 尊贵十字架，1973 年 11 月 26 日
    - type: heading3
      text:
        ru: Сестра старица Филофея, благословите!
        cn: 姊妹，女长老菲洛塞娅，请祝福！
      children:
      - type: paragraph
        text:
          ru: Удивительное дело – что, как вы пишете, сестры ждут моего приезда. Ведь со времени моего последнего посещения не прошло еще и шести месяцев! Но чтобы не огорчать сестер, я сел и написал вам письмо – тридцать страниц обычного формата, на которых каждая из вас найдет потребное к успокоению своего помысла и от чтения которых почувствует примерно такую же радость, какую испытывала бы от моего присутствия в вашей обители.
          cn: 令人惊奇的是——正如您所写——姐妹们正在等待我的到来。毕竟，自我上次拜访至今还不到六个月！但是，为了不让姐妹们感到沮丧，我坐下来给您写了这封信——三十页通常大小的篇幅，其中你们每个人都能找到平息自己意念所需的一切，并且从阅读中感受到的喜悦，大约会等同于我在你们修道院时的临在所带来的喜悦。
      - type: paragraph
        text:
          ru: В этом письме я пишу о любви, о смирении, вообще обличаю человеческий разум и подчеркиваю значение благодати Божией. Коротко говоря, я обличаю прельщенный философский и западно-еретический дух, веяния которого распространены как в церковной, так и университетской среде.
          cn: 在这封信中，我写了关于爱、关于谦卑，总体上揭露了人类的理智，并强调了上帝恩典的意义。简而言之，我指出了受迷惑的哲学与西方异端思潮，它们的风气正弥漫于教会界和大学界。
      - type: paragraph
        text:
          ru: Я почувствовал необходимость написать вам об этом потому, что в вашей обители много сестер из интеллигенции. Не поняв, что такое благодать Божия, они, мучаясь всю свою жизнь, будут чувствовать себя неудачницами – да и в самом деле будут таковыми.
          cn: 我感到有必要给您写信谈及此事，因为您的修道院中有许多来自知识界的修女。她们若不明白何为上帝的恩典（благодать Божия），就会终生痛苦，觉得自己是失败者——事实上，她们也确实会是失败者。
      - type: paragraph
        text:
          ru: Если вы когда-нибудь будете переписывать это письмо, то пришлите одну копию и мне, чтобы я не написал вам того же самого и в других письмах.
          cn: 若您将来抄写此信，请也寄一份副本给我，以免我在其他信件中再给您写同样的内容。
      - type: paragraph
        text:
          ru: Это все, что я хотел вам сказать.
          cn: 这是我想要对您说的全部内容。
      - type: paragraph
        text:
          ru: Христос и Матерь Божия с вами.
          cn: 基督与上帝之母与您同在。
      - type: paragraph
        text:
          ru: Ваш брат монах Паисий. Калива Честного Креста, 25.11.1973 г.
          cn: '您的弟兄，修士帕伊西。

            圣十字架小室，1973年11月25日。'
    - type: heading3
      text:
        ru: Помощь наша – святая Екатерина![84]
        cn: 我们的帮助是圣叶卡捷琳娜！[84]
      children:
      - type: paragraph
        text:
          ru: Посвятившим себя Христу моим сестрам, монахиням исихастирия святого Иоанна Богослова, который отличался девством и любовью, посылаю издалека несколько страниц о девстве и любви, чтобы помочь вам во всем подражать ему. Свои убогие слова я сопровождаю молитвой, чтобы наш богатый Отец – Бог – благословил их.
          cn: 献身于基督的我的姐妹们，圣约安神学家的静修院的修女们，（圣约安）以童贞和爱著称，我从远方寄上几页关于童贞与爱的文字，以帮助你们在凡事上效法他。我的这些拙劣的言语，我伴随着祷告，愿我们富有的父——上帝——降福它们。
      - type: paragraph
        text:
          ru: Как я убедился, чтобы полюбить Бога, нужно верить в Него. Наша любовь соразмерна нашей вере. Если любовь теплохладна, то и вера тоже теплохладна. Горячая вера в Бога рождает горячую любовь к Богу и к образу Божию – нашему ближнему. От преизобилия любви, которая не вмещается в сердце и переливается через край, насыщаются даже бедные животные.
          cn: 正如我确信的，要爱上帝，就必须信靠祂。我们的爱与我们的信德是相称的。如果爱是温吞的，那么信德也必是温吞的。对上帝火热的信德会生出对上帝以及对上帝的肖像——我们的近人——火热的爱。因着爱满溢而心房容纳不下，甚至连贫穷的动物也会得着饱足。
      - type: paragraph
        text:
          ru: Горячая и изобильная любовь, являясь благородной, никогда не ищет своей выгоды, когда приносит жертву Богу или ближнему. Тот, кто творит добро, но ждет награды, является наемником. Наемником является также тот, кто избегает греха для того, чтобы не попасть в ад, потому что опять-таки беспокоится о себе. Но если человек делает добро из любви и сострадания, даже не думая о небесном воздаянии, и не грешит, чтобы не ранить благодетеля Христа, Который принял раны на кресте для того, чтобы искупить его Своей всесвятой кровью, и если не хочет идти в ад из усердия, чтобы не опечалить Христа, то он не только хороший работник, но и доброе чадо Божие.
          cn: 炽热而丰盛的爱，作为一种高贵的品质，在向或近人献祭时，永不寻求自己的利益。行善却期待赏赐的人，是雇工。那为了避免下地狱而躲避罪恶的人，也是雇工，因为他再次只顾虑自己。但如果一个人出于爱和怜悯行善，甚至不考虑天上的报偿；又不犯罪，以免伤害那位曾为救赎他而在十字架上以祂的至圣之血接受创伤的施恩者基督；并且他出于热忱而不愿下地狱，以免令基督忧伤，那么他不仅是一位好工人，而且是上帝的好儿女。
      - type: paragraph
        text:
          ru: 'Многие из нас говорят о любви (в том числе и я), но при этом не знают, сколько каратов в нашей любви. Если бы Христос захотел испытать нас, чтобы каждый из нас узнал цену своей любви, и сказал бы нам: «Дети Мои, рай уже наполнился, и Мне некуда вас поместить», – некоторые из нас с бесстыдством сказали бы Христу: «Так почему же Ты не сказал нам об этом раньше?» Другие же побежали бы, чтобы не терять времени зря и успеть хотя бы одну минуту повеселиться, и не захотели бы даже слышать о Христе. Но усердные чада Божии сказали бы Христу с благоговением: «Не беспокойся о нас. Достаточно того, что рай наполнился. Мы так этому рады, как если бы сами находились в раю!» Они бы с радостью продолжали, как и до этого, свои усердные духовные подвиги ради Того, Которого возлюбили драгоценной любовью.'
          cn: "我们很多人都在谈论爱（包括我自己在内），但却不知道我们的爱有多少克拉（纯度）。倘若基督想要考验我们，好让每个人都知晓自己爱德的价值，祂会对我们说：「我的孩子们，天堂已经满了，我没有地方容纳你们了。」——\n\n    我们中有些人会厚颜无耻地对基督说：「那你为什么不早点告诉我们呢？」另一些人则会跑开，以免浪费时间，趁机去享受哪怕一分钟的欢乐，并且连基督的消息都不愿再听。但是，那些热诚的上帝的儿女们会怀着敬畏之心对基督说：「请不要为我们担忧。天堂已经满了，这就足够了。我们为此感到由衷的喜悦，就像我们自己身在天堂一样！」他们会带着喜悦，一如既往地为那位被他们以珍贵的爱所爱着的主，继续他们热诚的灵修操练。"
      - type: paragraph
        text:
          ru: Дешевая любовь всегда заботится о своей выгоде, и поскольку эта любовь мала, то живущий ею христианин ограничивается тем, что наслаждается мирскими благами, пока это не является грехом. Например, он в заговенье на пост ест до полуночи (до без пяти двенадцать) и хочет наслаждаться всеми мирскими радостями, пока это не является грехом, а потом не понимает, почему не чувствует в себе любви Божией и так далее (при своей дешевой любви).
          cn: 廉价的爱总是关注于自身的利益，并且由于这种爱是微小的，以这种爱生活的基督徒就将自己限制于：只要不构成罪，就享受世间的福益。例如，在封斋期的准备期，他会一直吃到午夜（差五分钟十二点），并渴望享受所有的世间欢愉，只要不构成罪。然后，他就不明白，为什么自己感觉不到上帝的爱等等（在拥有他那廉价的爱的情况下）。
      - type: paragraph
        text:
          ru: Драгоценная (горячая) любовь, которая жертвует собой и не ест по-мирски, бывает внутренне снедаема любовью Божией, и тогда вся жизнь человека является постоянной четыредесятницей, и все дни его жизни – это постоянная пасхальная радость. Драгоценная любовь к Богу своей жертвенностью заставляет сердце сладостно кипеть, и божественная любовь, которую ничто не может удержать, поднимается вверх подобно пару и соединяется с Богом. Находясь в этом духовном исступлении, человек не только выходит за рамки самого себя, но даже его сердце выходит за рамки тела (из пределов плотских желаний) и, очистившись, всецело предает себя Богу.
          cn: 宝贵的（炽热的）爱，这爱舍弃自身、不以世俗方式享用（世物），会在内心被上帝的爱所吞噬，彼时，人的整个生命便成了持续的四旬期，他生命中的每一天都是持续的复活节喜乐。对上帝宝贵的爱，以其自身的牺牲，使心甜蜜地沸腾，那势不可挡的神圣之爱便如蒸汽般上升，与上帝结合。处于这种灵性狂喜之中的人，不仅超越了自身，甚至他的心也超越了身体（超越了肉体欲望的界限），并在得到洁净后，将自身完全奉献予上帝。
      - type: paragraph
        text:
          ru: Когда сердце всецело отдано Богу, тогда оно отдано и всему миру, и любовь тогда становится обоготворенной. Эта великая божественная любовь Христова не может быть заключена ни внутри сердца, ни в доме, ни в общественных зданиях, ни за колючей проволокой на границе, потому что Христа нельзя запереть. Если на границах православных христиан есть колючая проволока, это значит, что колючим стало наше духовное состояние. Это значит, что мы носим только имя Христа, по сути же не являемся христианами и заключаем в себе только имя Христа, а не Самого Христа, Который не может быть заключен.
          cn: '当心灵全然献给上帝时，它也就献给了整个世界，而爱也因此得以成神。


            这伟大的基督的属神之爱，无法被囚禁在心内、家中、公共建筑中，也无法被关在边界上的带刺铁丝网后面，因为基督是无法被锁住的。如果在正教基督徒的边界上存在着带刺铁丝网，那就意味着我们属灵的状态已经变得「带刺」了。这意味着我们只是徒具基督之名，但本质上并非基督徒，我们只是将基督之名，而非基督本身，关锁在我们里面了——祂是无法被囚禁的。'
      - type: paragraph
        text:
          ru: Мы забываем, что являемся детьми Адама по плоти и детьми Христа по духу. Если бы мы имели драгоценную любовь, то каждый из нас ощущал бы другого своим братом, и поскольку Любовь (Христос) является плодом Духа Святого, то христиане уже не придавали бы значения роду и племени (то есть не делали бы различия по плоти), потому что видели бы все непорочным и святым и были бы облечены в благодать Божию.
          cn: 我们忘记了，我们按肉体是亚当的儿女，按精神是基督的儿女。如果我们拥有宝贵的爱，我们每个人都会视他人为自己的兄弟；又因为爱（基督）是圣灵的果实，基督徒就不会再看重族裔和支派（即不会按肉体有所分别），因为他们会视一切为纯洁和神圣的，并被披戴上上帝的恩典。
      - type: paragraph
        text:
          ru: Пока Адам любил Бога и хранил Его заповедь – пребывал в раю Божием и Бог пребывал в райском сердце Адама. Обнаженный Адам был облечен в благодать Божию, и вокруг него было множество зверей, которых он ласкал с любовью, а те в ответ с благоговением лизали его, как своего господина. Когда Адам преступил заповедь Божию, то совлек с себя благодать Божию, облекся в кожаные ризы и был изгнан из рая. И одичал облагодатствованный Адам, как и многие звери одичали из-за Адама и, вместо того чтобы с благоговением приближаться к нему и лизать его с любовью, начали с яростью нападать на него, стремясь разорвать его на части или укусить.
          cn: 当亚当爱慕上帝并遵守祂的诫命时，他就居于上帝的乐园之中，上帝也居于亚当这颗乐园之心。赤身的亚当披戴着上帝的恩典，他周围有许多走兽，他以爱抚摸它们，而它们则以敬畏作为回应，舔舐着他，如同对待它们的主人一般。当亚当违背了上帝的诫命时，他就将上帝的恩典从自己身上脱去，穿上了皮衣，并被逐出了乐园。蒙受恩典的亚当因此变得野蛮，正如许多走兽因着亚当而变得野蛮一样；它们不再以敬畏的心接近他，不再以爱舔舐他，反而开始愤怒地攻击他，试图将他撕裂或咬伤。
      - type: paragraph
        text:
          ru: Сейчас соблюдение заповедей вновь приближает человека к Богу, снимает с него кожаные ризы – ветхого человека, – и человек тогда опять облекается Богом в Его благодать и возвращается в свое первое состояние, которое имел до падения. Тогда он живет невинно среди людей и бесстрашно среди зверей, которые издалека чувствуют невинность и любовь, вновь приближаются к человеку, лижут его с благоговением, признают его своим хозяином и перестают быть дикими, поскольку их хозяин стал укрощенным. О благословенная пустыня, так много способствующая примирению твари Божией с Творцом и затем превращающаяся в земной рай и вновь собирающая диких зверей вокруг человека, которого ты укротила! Итак, сколько можешь, полюби пустыню и невещественную жизнь и все свои материальные вещи, какие только можно, отнеси в дома нищих. Насколько можешь, упрости свою жизнь, чтобы освободиться от мирского душевного беспокойства и чтобы твоя жизнь приобрела смысл.
          cn: 现在，遵守诫命再次使人亲近上帝，脱去他皮制的长衣——即那老旧的人——这时人就再次被上帝以祂的恩典披戴，回到他堕落前的第一个状态。那时他无辜地生活在人群之中，无惧地生活在野兽之间，这些野兽从远处就感受到无辜和爱，再次亲近人，带着敬畏舔舐他，承认他是它们的主人，不再是野蛮的，因为它们的主人已经被驯服了。哦，蒙福的旷野啊，你如此大地促进了上帝的受造物与造物主的和解，然后变成了地上的乐园，再次将野兽聚集在你所驯服的人的周围！因此，尽你所能去爱旷野和非物质的生活，并将你所有能送出的物质财产送给穷人的家。尽你所能去简化你的生活，以便从世俗的内心焦虑中解脱出来，使你的生命获得意义。
      - type: paragraph
        text:
          ru: Тот, кто освобождается от материальных вещей, очень скоро освобождает свое сердце, чтобы отдать его Богу, а также легко отсекает страсти. Эта двойная свобода является двумя крыльями, которые возносят душу к Богу, к ее предназначению.
          cn: 那从物质事物中得自由的人，很快就会释放自己的心，将它献给上帝，同时也能轻易斩断诸情（ passions）。这双重自由是两只翅膀，将灵魂提升至上帝面前，带至其命定之处。
      - type: paragraph
        text:
          ru: Полюби благословенную пустыню и почти ее, если хочешь, чтобы и она помогла тебе своим святым уединением и сладкой тишиной для того, чтобы ты укротился, а твои страсти пришли в запустение и ты смог бы приблизиться к Богу.
          cn: 喜爱蒙福的旷野，并敬重它，倘若你渴望它也以其圣洁的隐居和甜美的宁静助益于你，好使你得以驯服，你的情欲得以荒废，而你得以亲近上帝。
      - type: paragraph
        text:
          ru: Берегись, чтобы не приспособить святую пустыню для своего страстного «я», потому что это великое нечестие (как если бы ты пошел поклониться святой Голгофе, слушая магнитофон с записью бузуки[85]).
          cn: 你要当心，不要使圣洁的旷野屈从于你那充满情欲的「小我」，因为这是极大的不敬（就如同你前往圣洁的髑髅地朝拜，却听着播放布祖基[85]录音的录音机）。
      - type: paragraph
        text:
          ru: Пустыня предназначена для высшей духовной ангельской жизни и для большего телесного подвига, а не для большего телесного отдыха, как на курорте.
          cn: 荒漠（隐修地）是为至高的属灵天使般的生活，以及为更大的身体苦修功业所预备的，而不是为更大的身体休憩，像在疗养胜地一样。
      - type: paragraph
        text:
          ru: Итак, полюби пустыню со всем ее суровым уединением, если хочешь, чтобы твоя бесплодная душа вскоре принесла плоды и сделалась невещественной.
          cn: 那么，你当喜爱旷野，连同其所有的严酷隐修（隐居），如果你渴望你那贫瘠的灵魂能很快结出果实，并变得非物质化。
      - type: paragraph
        text:
          ru: Когда человек удаляется в пустыню, далеко от мира и от вещественного, его сердце сразу же сосредоточивается на Боге и у его сердца уже ни к чему «не лежит сердце», кроме Бога. Так как человек хочет постоянно пребывать с Богом, то естественно, что он часто отрешается от всего земного. Когда он начнет отрешаться от земли, тогда ум не действует, но действует уже благодать Божия, которая заботится только о духовном. Действие божественной благодати не может быть сравнимо с действием ума, который есть плоть. Ум часто годами трудится до изнеможения, чтобы выучить один-два иностранных языка, и в наше время большинство людей знают иностранные языки, но, так как они не имеют никакого отношения к языкам Святой Пятидесятницы, мы переживаем столпотворение хуже вавилонского[86].
          cn: 当一个人隐遁到旷野，远离世界和物质之时，他的心会立刻集中于上帝，他的心除了上帝之外，对任何事物都「心无所系」了。由于人渴望持续地与上帝同在，他自然会经常舍弃一切属世的事物。当他开始舍弃大地之时，心思便不再起作用，而起作用的是上帝的恩典，恩典只关注属灵的事物。神圣恩典的运行，无法与心思（心思是属肉体的）的运行相提并论。心思常常会殚精竭虑地劳作多年，只为学会一两种外语，在我们这个时代，大多数人掌握外语，但因为这些语言与圣五旬节的众语言没有任何关系，我们正经历着比巴别塔（巴比伦）更甚的混乱[86]。
      - type: paragraph
        text:
          ru: Когда человек имеет Любовь (Христа), тогда, даже если он будет немым, сможет объясниться со всеми миллиардами народов, а также с людьми всех возрастов, каждый из которых имеет свой собственный язык. Любовь в соединении с состраданием к людям имеет силу Христову, изменяет души варваров и укрощает диких зверей, так что они приближаются к человеку, как овечки.
          cn: 当一个人拥有爱（基督）时，那么，即使他是哑巴，他也能与数十亿民族解释明白，也能与各个年龄段的人沟通，尽管他们每个人都有其自身的语言。爱与对人的怜悯结合在一起，拥有基督的力量，能改变野蛮人的灵魂，驯服野兽，使它们像小羊羔一样靠近人。
      - type: paragraph
        text:
          ru: Тому, кто любит всех людей и страдает от их несчастий, Бог никогда не попустит страдать от своих собственных несчастий.
          cn: 对于那爱所有的人、并为他们的不幸而受苦的人，上帝绝不会容许他受自己不幸之苦。
      - type: paragraph
        text:
          ru: С тем, кто безразличен к себе ради любви к другим, пребывает великая забота Божия, и все люди заботятся о нем.
          cn: 与那一位因着爱他人的缘故而对自己无所顾虑的人，有伟大的上帝的照看同在，并且所有的人也都在照看着他。
      - type: paragraph
        text:
          ru: Достигший того, чтобы постоянно иметь свой ум в Боге, всегда чувствует присутствие Божие рядом с собой, вместе со всей Его Отеческой божественной любовью.
          cn: 达成那常将自己的心思置于上帝之中境界的人，总能感受到上帝在自己身边，以及祂全部的父性神圣的爱，所带来的临在。
      - type: paragraph
        text:
          ru: Там, где любовь, живет Христос (Любовь), и где смирение, там автоматически продляется «аренда» благодати Божией, царствует Бог и земля превращается в рай. Где нет любви и смирения, там живет лукавый (враг) и люди вместе с ним уже здесь переживают адские муки и постоянно ухудшают свое будущее положение в иной жизни в вечном огне.
          cn: 有爱之处，基督（即爱）居于其中；有谦卑之处，上帝恩典的「租约」就自动得以延长，上帝掌权，大地变为天堂。没有爱与谦卑之处，恶者（仇敌）便居于其中，人们就与它一同，在今世即已遭受地狱的折磨，并持续地恶化他们在来世永火中的未来境况。
      - type: paragraph
        text:
          ru: Немилосердный и гордый евангельский богач после смерти не мог перепрыгнуть великую пропасть, которая отделяла его от рая, от лона Авраамова (См.Лк. 16, 19–31). Мы ныне, находясь в этой жизни, если захотим, можем с помощью благодати Божией перепрыгнуть ее и уже сейчас оказаться на лоне Божием, если преодолеем свои немилосердие и гордость.
          cn: 那不怜悯又骄傲的福音书中的财主，死后无法跨越那将他与乐园、与亚伯拉罕的怀抱（лона Авраамова）隔开的巨大鸿沟（参阅路加福音 16:19-31）。我们如今，活在今世，如果我们愿意，能够借助上帝的恩典跨越它，并且现在就置身于上帝的怀抱中，只要我们克服自己的不怜悯和骄傲。
      - type: paragraph
        text:
          ru: Как обремененный тяжелой ношей человек, если хочет прыгнуть, должен сначала снять с себя груз, так и мы должны сбросить тяжесть своих грехов с помощью исповеди. Как человек, который не ходит вовремя в туалет, отравляет весь свой организм, отчего возникает множество телесных и даже психических нарушений, так и тот, кто не исповедуется, постоянно отравляет свою душу и разрушает свое тело угрызениями совести, которые постоянно мучают его душу. Как хорошие родители одинаково любят всех своих детей, но особое внимание проявляют к немощным и увечным, так поступает и наш Благий Отец Бог по отношению к Своим немощным (телесно и духовно) детям – достаточно им иметь доброе расположение и предоставить Ему возможность для божественного вмешательства.
          cn: 就像一个背负着沉重负担的人，若想跳跃，必须先卸下身上的重物，照样，我们也必须通过告解（忏悔）卸下我们罪孽的重负。如同一个人若不及时如厕，便会毒害其全身，引发许多躯体乃至精神上的失调，照样，一个不告解的人，则会不断地毒害他的灵魂，并且藉着持续折磨其灵魂的良心谴责来摧毁他的身体。正如好的父母平等地爱着他们所有的孩子，但对那些体弱的和残疾的会予以特别的关照，我们至善的父上帝（Благий Отец Бог）对待他那些体弱（无论身体上还是精神上）的孩子也是如此——只要他们怀有良善的心志，并为祂神圣的介入提供可能性。
      - type: paragraph
        text:
          ru: Как более здоровые братья по любви к своим слабым или болезненным братьям сами всегда поднимают тяжелые вещи, а им оставляют легкие, так и в духовной жизни хорошие братья всегда переносят тяжелую несправедливость и оставляют немощным легкую справедливость.
          cn: 正如强健的弟兄们，出于对他们软弱或病弱的弟兄的爱，总是自己扛起重物，而把轻省的留给他们一样，在属灵生命中，好的弟兄们也总是忍受沉重的不公，而把轻省的公义留给软弱者。
      - type: paragraph
        text:
          ru: Те, которые, имея большую любовь и смирение, не оставляют несчастного грешника, когда все от него отвернулись, подают самую большую милостыню, потому что если для несчастных незаконнорожденных детей существуют детские дома и их окружают хоть какой-то заботой, то для этих несчастных, увы, нет прибежища – все их избегают, ибо они очень тяжелы и плохи. К сожалению, все ищут справедливости и говорят о себе, что они правы, но беда в том, что каждый считает себя правым в большей степени, чем имеет на это право, а потому люди и «едят» друг друга.
          cn: 那些拥有极大的爱与谦卑，在所有人都离弃不幸的罪人时，却不抛弃他们的人，所施予的正是最大的怜悯（施舍）。因为，倘若为不幸的私生子尚有育婴院，他们至少能得到一些关怀，那么对于这些不幸之人，唉，却没有避难所——所有人都躲避他们，因为他们极度沉重而败坏。令人痛心的是，所有人都寻求公义，并声称自己是对的，但麻烦在于，每个人都认为自己正确得超出了他们应有的程度，因此人们便彼此「吞噬」[吞吃]了。
      - type: paragraph
        text:
          ru: Здоровые люди, то есть такие, у которых есть любовь и смирение, часто спорят, движимые любовью, кто поднимет самое тяжелое, или возьмет худшее, или оставит себе испорченную пищу, а лучшую отдаст ближнему, который есть Христос. И когда такие люди едят испорченную пищу, то чувствуют большую сладость, чем их братья, которые едят хорошую пищу, потому что вкушают любовь и сами бывают снедаемы любовью. (Так «едят» друг друга духовные люди).
          cn: 灵里健康的人，也就是那些拥有爱与谦卑的人，他们常常被爱所推动而争论，看谁将拿起最沉重的东西，或拿走最差的，或给自己留下变质的食物，而将最好的食物给予邻人，那邻人就是基督。当这样的人食用变质的食物时，他们所感受到的甘甜要远超食用好食物的弟兄们，因为他们品尝到爱，并且他们自己也被爱所吞噬。（属灵的人就是这样「吃掉」彼此的）。
      - type: paragraph
        text:
          ru: Как для телесного здоровья очень полезно бывает выехать за город, где много кислорода, чистый воздух и тишина, так и для душевного здоровья очень полезен монастырь своей уединенностью, спокойствием и безмолвием вдали от мира.
          cn: 就像为了身体的健康，出城去到有充足氧气、清洁空气和宁静的地方是非常有益的，同样，为了灵魂的健康，修道院以其远离尘世的隐修、宁静和静默，也是非常有益的。
      - type: paragraph
        text:
          ru: Берегись, чтобы твое безмолвие не превратилось в беспокойство из-за беспокойных посетителей. Оказывай гостеприимство, только когда это необходимо, потому что иначе окажешься неразумным. А посетитель покажет великое бесстыдство, если будет настаивать, чтобы его приняли, несмотря на то, что для этого нет необходимости.
          cn: 谨防你的静默因着那些不安宁的访客而转变为烦扰。仅在有必要时才展现好客之情，否则你将显得不智。而如果访客坚持要求被接纳，尽管并无此等必要，那么他将显出极大的不知羞耻。
      - type: paragraph
        text:
          ru: Не ищи себе друзей среди людей с высоким положением, которые, имея мирской дух, будут посещать монастырь, как зоологический сад, а также среди людей, всецело занятых внешним миром, и людей с беспокойным духом, которые как суховей будут носиться в твоем духовном саду.
          cn: 不要在地位显赫的人中寻找朋友，他们拥有世俗的精神，会把修道院当作动物园来参观；也不要在完全忙于外部世界的人和精神焦躁不安的人中寻找朋友，他们会像干热风一样在你的灵性花园中呼啸而过。
      - type: paragraph
        text:
          ru: 'Берегись, чтобы не впутаться в дела людей, не имеющих отношения к монашеской жизни: не помогай им ничем даже издали (за исключением молитвы), потому что они постоянно будут нарушать твои безмолвие и мир, так что ты уже никогда не сможешь молиться ни о мире всего мира, ни о себе, ни о них.'
          cn: 务要当心，不要卷入与修士生活无关之人的事务：不要以任何方式帮助他们，即使是远距离的（祷告除外），因为他们会持续不断地搅扰你的静默与平安，以致你将再也无法祷告，既不能为全世界的平安祷告，也不能为你自己，也不能为他们祷告。
      - type: paragraph
        text:
          ru: Человеку, который намеренно впутывает тебя в свои дела, если он не больной, прости«до седмьдесят крат седмерицею»(Мф. 18, 22) и с любовью избегай его – ради его и своего спасения (только молись за него).
          cn: 对于一个故意将你卷入他事务中的人，如果他并非有病在身，请「饶恕他，直到七十个七次」（马太福音 18:22），并出于爱而躲避他——为了他自己的救恩和你的救恩（你只需为他祈祷）。
      - type: paragraph
        text:
          ru: Тот, кто избегает людей и при этом не предается безделью и не грешит, но затворяется в своей келлии и копается в себе, очень скоро найдет духовный клад и станет духовно богатым, так что сможет помогать и другим.
          cn: 避开人群，且不沉溺于懒散、不犯罪的人，而是将自己关在自己的小室（kellia）内，省察自身，将很快找到属灵的财宝，并变得属灵上富足，以至于能够帮助他人。
      - type: paragraph
        text:
          ru: Тот, кому надоело копаться в самом себе и кто хочет кружиться по свету, никогда не станет хозяином в духовном смысле, но всегда будет работником, возделывающим свои страсти под надзором лукавого. Поэтому для монаха предпочтительнее затвориться в своей келлии и применять к себе то немногое, что знает, чем постоянно кружиться, чтобы много узнать и внешне казаться умным, а внутри быть пустым и оставаться бездеятельным.
          cn: 那些厌倦于深入探究自身，而渴望在世上流连（或周游）的人，永远无法在属灵意义上成为主宰，却总是仆役，在那恶者的监管之下耕耘着自己的情欲。因此，对于修士来说，更可取的是闭锁在他的隐修小室（келлия）中，并将他所知的那一点点应用到自身，而不是持续周游，以求学到许多东西，并在外表上显得聪明，而内里却是空虚的，并且仍然保持无所作为。
      - type: paragraph
        text:
          ru: Познание самого себя дороже всех знаний мира. Потому что познание самого себя естественным образом приводит к смирению, делая его состоянием нашей души, отчего в нас постоянно пребывает благодать Божия, а большие знания могут раздуть человеку голову[87]и превратить ее в аэростат, который подвергается опасности либо лопнуть в воздухе (из-за шизофрении), либо упасть и разбиться на куски (из-за гордости). Поэтому знания должны следовать за страхом Божиим и соединяться с делами, чтобы было равновесие. Следовательно, для нас более необходимо применять свои знания в келлии, нежели постоянно учиться.
          cn: 认识自己比世上一切知识都更宝贵。因为认识自己自然会导向谦卑，使其成为我们灵魂的状态，由此神的恩典便常驻于我们之内。然而，大量的知识可能会使人头脑膨胀[87]，将其变成一个气球，面临着要么在空中爆裂（因精神分裂症），要么坠落并粉身碎骨（因骄傲）的危险。因此，知识必须伴随对神的敬畏，并与善功结合，以求平衡。由此可见，对于我们而言，比起持续学习，将所学知识应用在斗室（凯利亚）中更为必要。
      - type: paragraph
        text:
          ru: Не выходи часто за пределы своей теплой келлии, если на то нет серьезной причины, чтобы на тебя не обрушились порывы холодного мирского ветра, особенно если ты болезненный духовно.
          cn: 不要常走出你温暖的隐修室，除非有严肃的原因，以免冰冷的世俗之风的冲击临到你身上，尤其是如果你在灵性上是病弱的。
      - type: paragraph
        text:
          ru: Состояние души человека, который имеет обычай постоянно находиться за пределами своей келлии, похоже на состояние его брошенной келлии, которую по возвращении он находит полной мышиного помета, и двора возле нее, заросшего травой и полного змей.
          cn: 一个人灵魂的状态，如果他习惯于经常待在自己的小室之外，就如同他那被荒置的小室的状态。当他返回时，会发现小室里满是老鼠的粪便，而小室外的院子则杂草丛生，遍布毒蛇。
      - type: paragraph
        text:
          ru: Тот, кто пребывает в своей келлии, находится в укрытии, как солдат в землянке. Если солдат – новобранец, то тем более не должен выходить наружу.
          cn: 凡是安居在自己隐修室中的人，如同身处壕沟掩体中的士兵，处于庇护之下。若那士兵是一名新兵，则更不应当出门在外。
      - type: paragraph
        text:
          ru: Новоначальные по причине своей духовной близорукости должны чувствовать нужду в совете старших, которые, благодаря своей опытности, видят далеко.
          cn: 新手（новоначальные）因其属灵上的短视（духовной близорукости），应当感受到需要年长者（старших）的建议（совете），年长者则因其经验丰富（опытностью），能够看得更远。
      - type: paragraph
        text:
          ru: Новоначальные не должны отчаиваться в начале своей жизни в монастыре, чувствуя свою духовную черноту, потому что зелень в миру была травой, услаждавшей лишь взор, а не пшеницей, тогда как эта чернота является пашней для духовного семени. Позже на ней будет зеленеть пшеница и даст колос и зерно.
          cn: 初入修道院者在修道生活开始时，不应当因感到自己的心灵黑沉沉而绝望。因为世俗中的「绿色」只是取悦眼目的野草，而非小麦；然而，这种黑沉却是播撒灵性种子的田地。日后，小麦将在其上长出新绿，并结出穗子和谷粒。
      - type: paragraph
        text:
          ru: Не жалей также о килограммах плоти, которые потерял в монашестве, потому что об этом жалеют лишь черви, которые надеются попировать, когда ты умрешь. Ты же должен радоваться, что благодаря этому душа избавляется от «токсинов» и что эта подвижническая жертва, принесенная ради любви Божией, имеет большую ценность, чем жертвы, которые приносили люди в Ветхом Завете, закалая тучных животных, чтобы выразить свою благодарность Богу.
          cn: 也不要为你自己在修道生活中所减轻的肉体重量感到惋惜，因为对此感到惋惜的，只有那些指望在你离世时大快朵颐的蛆虫。你反而应当欢喜，因为藉着这个过程，灵魂得以摆脱「毒素」；并且，这种为着上帝之爱而献上的苦修牺牲，拥有比旧约时代的人们为表达对上帝的感恩而宰杀肥壮牲畜所献上的祭物，更大的价值。
  - type: heading2
    text:
      ru: Часть 2
      cn: 第二部分
    children:
    - type: paragraph
      text:
        ru: Монах-подвижник испытывает сочувствие к своей плоти, подобной скелету, и смотрит на нее как на своего друга, с благоговением.
        cn: 修道者感到对自己的肉体——这形似骨架的肢体——的同情，并怀着敬畏视其为自己的朋友。
    - type: paragraph
      text:
        ru: А плотолюбивый монах постоянно раздражается на свою откормленную свирепую плоть, смотрит на нее как на врага, и чувствует, что находится у нее в подчинении. Его плоть и душа начинают гореть в аду уже в этой жизни.
        cn: 至于那贪恋肉体的修士，他持续地对他的那被养肥、凶悍的肉体感到恼怒，视它如同仇敌，并察觉到自己正处于它的辖制之下。他的肉体和灵魂，就在今生已开始在地狱中燃烧。
    - type: paragraph
      text:
        ru: Плоть очень смиряется от поста, но еще больше – от бдения и молитвы, конечно, при условии, что в душе нашло себе приют смирение.
        cn: 肉体因禁食而大得降服，但更甚者，是因守夜与祷告；当然，这是以谦卑已在灵魂中找到了栖身之所为条件的。
    - type: paragraph
      text:
        ru: Когда в нашей душе есть гордость и в нас сидит бес, тогда плоть, даже если она подобна скелету, постоянно будет брыкаться, как тощие как скелет бесноватые ослы, хотя их и доводят чуть ли не до голодной смерти, чтобы они успокоились, постоянно брыкаются, потому что они бесноватые (в них сидит бес).
        cn: '当我们的灵魂中有骄傲，且我们的心中有魔鬼时，那时肉体，即使它形同骷髅，也会不断地挣扎踢蹬。


          它就像瘦骨嶙峋、形同骷髅的、被魔鬼附着的驴子一样，尽管将它们折磨得几乎快要饿死，以便让它们安静下来，它们仍会持续地踢蹬，因为它们是被魔鬼附着的（魔鬼在它们里面）。'
    - type: paragraph
      text:
        ru: Поэтому новоначальному необходимо сделать рентген у своего духовного врача, чтобы он увидел сначала, чем страдает, и чтобы затем сам врач назначил ему лекарство и диету.
        cn: 因此，初学之人有必要在自己的神医那里做一次透视（X光检查），以便神医首先看到他正遭受何种苦难，然后神医自己才能给他开出药物和食疗方案。
    - type: paragraph
      text:
        ru: Болезненный новоначальный, не желающий советоваться со своим духовным врачом, никогда не увидит себя здоровым (вдвойне здоровым).
        cn: 一个患病的初学之人，若不愿咨询他的属灵医师，将永远不会看见自己康健（双倍康健）。
    - type: paragraph
      text:
        ru: Здоровый новоначальный, который избегает советов и духовного наблюдения за собой, рано или поздно тяжело заболеет.
        cn: 一个健康的新入教者，如果避免接受建议和属灵的自我监督，迟早会身患重病。
    - type: paragraph
      text:
        ru: Гордость и своеволие являются двумя рогами беса, которыми он постоянно подталкивает новоначального к пропасти.
        cn: 骄傲和自专（或：自我的意志）是魔鬼的两支角，他不断地用它们推搡初入修行者走向深渊。
    - type: paragraph
      text:
        ru: Поскольку смирение заключает в себе жертву повиновения, оно угодно Богу больше, чем всякая другая жертва, и прогоняет диавола так далеко, как никакой ладан. Благодаря ему перестают действовать даже духовные законы.
        cn: 鉴于谦卑包含了顺服的祭献，它比任何其他祭献都更蒙上帝喜悦，并且能将魔鬼驱逐得远超任何乳香的作用。因为有了谦卑，就连属灵的法则也停止了运作。
    - type: paragraph
      text:
        ru: Человек, который портится, когда его хвалят, тем самым обнаруживает в себе духовную порчу (если только он не юн возрастом и не имеет простительной детскости и эгоизма, от которого ему не полезно с чьей-то помощью сразу избавиться).
        cn: 一个人若因受人称赞而败坏，这便显露了他内在的灵性败坏（除非他年岁尚轻，具有可被宽恕的稚气和自私，而他人立即帮助他摆脱这些对他并无益处）。
    - type: paragraph
      text:
        ru: У того, кто изображает из себя поврежденного умом (у Христа ради юродивого), больше ума, чем у всех философов мира, потому что философы обольщаются суетным миром и его славой, а Христа ради юродивый сумел посмеяться над всей мирской суетой и действительно живет, скрывшись в святом притворстве, то есть убежал от притворства мира и вошел в страну истины. Увидев, что искренность ему невыгодна, он преуспел в святом притворстве, чтобы сохранить свое духовное сокровище.
        cn: 那位佯装心智受损者（为基督的缘故的愚者），比世上所有的哲学家拥有更大的智慧，因为哲学家被虚妄的世界及其荣耀所迷惑，而为基督的缘故的愚者却能嘲笑一切世俗的虚华，他确实活在其中，隐藏于神圣的佯装之中，也就是说，他逃离了世界的虚假，进入了真理之境。他看到真诚（坦诚）于己不利，便在神圣的佯装中取得成功，以保全自己的属灵宝藏。
    - type: paragraph
      text:
        ru: Не страдай из-за того, что тебе не удалось прославиться или обогатиться суетными вещами и суетной славой, которые не нужны для истинной жизни и которые нельзя забрать с собой. Мы можем забрать с собой только наши дела, которые и приобретут нам соответствующий «заграничный паспорт» для нашего великого и вечного путешествия.
        cn: 不要因为你未能靠着虚妄的事物和虚浮的荣耀而获得声望或财富，这些对于真正的生命而言毫无必要，并且是你无法带走的，而感到痛苦。我们只能带走我们的所行，这些所行会为我们获取一张相应的「护照」，以供我们伟大而永恒的旅程使用。
    - type: paragraph
      text:
        ru: Радуйся всей душой, когда будешь жить в неизвестности и когда от твоих глаз скроются чувственные предметы, потому что тогда узришь лицо Божие и еще в этой жизни ощутишь рядом с собой Его присутствие, и перед тобой раскроются тайны Божии.
        cn: 当你在默默无闻中生活，并且当感官对象从你的眼前隐藏时，要全心欢喜，因为那时你将得以瞻仰上帝的圣颜，并在今生就能感受到祂就在你身旁，那时上帝的奥秘也将在你面前展开。
    - type: paragraph
      text:
        ru: Смиренный и незаметный герой Христов является самым умным человеком в мире, потому что хранит свое сокровище в Божией сокровищнице.
        cn: 谦卑而不为人知的基督英雄是世上最聪明的人，因为他将自己的财宝存放在上帝的宝库中。
    - type: paragraph
      text:
        ru: Гордый человек неразумен, потому что лукавый обольщает его одной карамелькой похвалы и съедает все его состояние.
        cn: 骄傲的人是不明智的，因为那恶者用一颗赞美的糖果诱惑他，并吞噬他所有的财产（或：家业）。
    - type: paragraph
      text:
        ru: Смиренный человек всегда имеет любовь, потому что эти две добродетели являются сестрами, и по этим признакам – любви и смирению – святые ангелы узнают детей Божиих, подхватывают их с любовью, без всякой задержки проносят через воздушные мытарства и возводят к любвеобильному Отцу.
        cn: 谦卑的人常怀爱心，因为这两种美德互为姊妹，圣天使就凭着这些标记——即爱与谦卑——认出上帝的儿女，满怀爱意地接纳他们，毫无耽搁地带着他们通过空中关卡，并将他们引向满有慈爱的父。
    - type: paragraph
      text:
        ru: Смиренный является также благоговейным и молчаливым, а потому сроден Благодатной Богородице Марии, Которая, хотя и имела в Себе воплощенное Слово Божие, молчала, пока Слово не родилось и Само не начало говорить в подобающее время.
        cn: 谦卑者亦是虔敬而缄默的，因此他与蒙恩的上帝之母马利亚是相近的。马利亚尽管身怀道成肉身的上帝圣言，却保持缄默，直至圣言降生，并在合宜之时亲自开口宣讲。
    - type: paragraph
      text:
        ru: Гордый бывает неспокоен внутренне и внешне шумен. Он постоянно старается делать свои слова пустыми, как пустые орехи[88], чтобы греметь ими. И если у него найдется хоть одно здравое слово, то и оно полно эгоизма (как прогорклый орех). Когда дотрагиваешься до его эгоизма, тогда все его страсти выходят наружу (как выползают муравьи, когда прикасаются к трухлявому стволу орехового дерева).
        cn: 骄傲的人内在不安宁，外在喧哗吵闹。他不断试图让自己的言语空洞，如同空心核桃[88]一样，好借此发出轰鸣。即便他偶然说出哪怕一句健全的话语，那话语也充满了自我主义（如同酸臭的核桃）。当你触碰到他的自我主义时，他所有的激情（情欲/习性）便会倾泻而出（如同蚂蚁从腐朽的核桃树干中爬出来一样）。
    - type: paragraph
      text:
        ru: Кто не хочет принять со смирением пощечину или замечание (даже если он совсем не виноват в данный момент, но был виноват раньше и должен искупить свою вину или вообще никогда не был виноват, и Бог попустил это, чтобы в небесном банке на его счет была положена драхма[89]), тот постоянно будет получать удары от своего эгоизма, от других людей и от лукавого, который будет бросать его из одного искушения в другое, чтобы он возроптал и потерял свою душу.
        cn: 凡不愿谦卑地接受掌掴或批评（即使他当下完全没有错，但他以前有错，必须赎罪；又或者他从未有错，但上帝容许此事发生，好使一枚德拉克马[89]被存入他在天上的银行账户中），那么他将持续不断地遭受来自他的私心、来自他人的以及来自那恶者的打击。那恶者会把他从一个试探投入另一个试探，好让他发怨言，并丧失他的灵魂。
    - type: paragraph
      text:
        ru: Кто глубоко копается в себе и доходит до смиренного фундамента своего духовного здания, тот одновременно обрезает корни своего эгоизма[90], и его здание стоит вечно без всяких повреждений.
        cn: 凡是深入省察自身，并达到了他属灵建筑的谦卑根基的人，他便同时斩断了他自我主义的根源[90]，而他的建筑将永远站立，毫发无损。
    - type: paragraph
      text:
        ru: Кто не вверяет себя Богу, но строит свой дом с самонадеянностью и мирской гордостью, тот строит на основании из мусора, и рано или поздно его дом обвалится, засыпав и его самого и тех, которые находились под его крышей.
        cn: 凡不将自己交托予神，却以自负和世俗的骄傲来建造自己房屋的人，乃是将房屋建于垃圾的基础之上。这房屋迟早会崩塌，将他自己和所有在他屋檐下的人一同掩埋。
    - type: paragraph
      text:
        ru: Тот, кто надеется на свой капитал и открывает большое предприятие, но не имеет головы на плечах[91], обанкротится. Точно так же и в духовной жизни недостаточно одних телесных сил и большого ума, если предпочтение не будет отдано благодати Божией, чтобы она всем управляла.
        cn: 一个将希望寄托于他的资本并开办大型企业，却没有头脑[91]的人，将会破产。同样地，在属灵生命中，仅有肉体的力量和巨大的智慧是不够的，除非将优先权赋予上帝的恩典，让恩典管理一切。
    - type: paragraph
      text:
        ru: Простая жизнь дает человеку много возможностей следить за собой, чтобы не обанкротиться духовно и иметь двойное здоровье. Но еще полезнее простой характер, благодаря которому человек просто и с благодарностью принимает замечания и таким образом делает всех людей своими врачами и медсестрами и бывает здоровее всех.
        cn: 朴素的生活，给予人许多机会察看自己，以免在灵性上破产，并拥有双倍的健康。然而，更有益的是朴实的性情，借此，人能朴实而感恩地接受指摘，并因此将所有人视为自己的医生和护士，且比所有人都更健康。
    - type: paragraph
      text:
        ru: Некоторые из-за своего эгоизма страдают, когда им делают замечания. Однако не все, которые страдают, когда им делают замечания, имеют эгоизм, ибо многие из-за своего великого усердия и большой чувствительности преувеличивают свой проступок и от чрезмерной тяжести вины, которую берут на себя (поскольку чувствительны), сгибаются. Поэтому нужно осторожно обращаться с чувствительными душами, которые имеют большую ревность, чтобы не обидеть их (посчитав, что у них большой эгоизм) и тем самым не покалечить и не сделать их ни на что не годными.
        cn: 有些人因为自己的自我中心（egoism）而遭受痛苦，当他们被指正时。然而，并非所有在被指正时遭受痛苦的人都具有自我中心，因为许多人由于自己极大的热忱和高度的敏感性，会夸大自己的过失，并因承担了过分的罪责重负（因为他们很敏感）而弯下腰来。因此，必须谨慎地对待那些具有高度热忱的敏感灵魂，以免冒犯到他们（错误地认为他们具有强烈的自我中心），从而使其残缺不全，并变得一无是处。
    - type: paragraph
      text:
        ru: Если ты задел самолюбие гордеца, не посещай его сразу, пока не затянутся его раны, потому что иначе разбередишь их даже лаской (добрыми словами). Лучше не приближаться к нему, пока они с течением времени не заживут и не забудутся.
        cn: 如果你触动了骄傲者的自尊心（самолюбие），不要立刻去拜访他，直到他的创伤（раны）愈合。否则，即使你用温和的言语（лаской/добрыми словами）对待他，也会重新撕裂它们。最好是不要靠近他，直到随着时间的推逝，这些创伤自行痊愈并被遗忘。
    - type: paragraph
      text:
        ru: У старого дерева, которое имеет много соков, не обрезай сразу всех веток, когда хочешь сделать к нему прививку, потому что иначе оно постоянно будет источать свои возмущенные соки и пускать побеги. То же в духовной жизни относится к человеку пожилому.
        cn: 对于一棵拥有丰沛汁液的老树，当你想要进行嫁接时，不要立刻剪去所有的枝条。否则，它会不断地涌出它那躁动的汁液，并萌发新芽。在属灵生活中，这同样适用于年长的人。
    - type: paragraph
      text:
        ru: Чтобы хорошо почистить старую картофелину, нужен нож (даже если она будет сварена и после этого остынет), и, когда хотят ее хорошо почистить, от нее часто ничего не остается. Тогда и самому человеку ничего не достается, и картофелина страдает и отчаивается из-за того, что от нее ничего не осталось. Поэтому лучше оставлять немного глазков и не обращать на них внимания, потому что глупо требовать от стариков того же, чего и от молодых, похожих на молодые картофелины, у которых кожура нежная и удаляется без ножа.
        cn: 要彻底削净一颗老土豆，就需要用到刀子（即便它已被煮熟并放凉），而当人们想要彻底削净它时，常常会削得什么都不剩。结果就是，削土豆的人一无所获，而土豆本身也因自己什么都不剩了而受苦和绝望。因此，最好留下一点芽眼，不要去理会它们。因为，要求老人做到与年轻人一样，是愚蠢的，那些年轻人就像新土豆，皮很嫩，不用刀子就能剥去。
    - type: paragraph
      text:
        ru: Так как Христос работнику одиннадцатого часа дает ту же плату, что и работнику первого часа, будем приспосабливать свою логику к логике Евангелия, которая кажется людям бессмысленной.
        cn: 既然基督给予第十一小时的工人与第一小时的工人同样的工钱，我们就要让自己的逻辑适应福音书的逻辑，这（福音书的逻辑）在世人看来似乎是毫无意义的。
    - type: paragraph
      text:
        ru: 'Для Бога все хорошо: и десять талантов с пяти, и четыре таланта с двух, и два таланта с одного (См.:Мф. 25, 14–30). Божественная справедливость имеет другие математические правила, и один плюс один иногда дает два, а иногда – два миллиона.'
        cn: 对于上帝而言，一切都是美好的：无论是五千金银的天赋获得的一万，还是两千金银获得四千，抑或是仅一千金银获得两千（参：马太福音 25:14-30）。神圣的公义遵循着不同的数学法则，一加一有时等于二，有时却等于两百万。
    - type: paragraph
      text:
        ru: Тот, кто хочет исследовать божественную логику своим умом, потеряет и тот небольшой ум, который имеет. А кто ограничивает божественную логику пределами своей головы, у того она лопнет, а сам он станет шизофреником.
        cn: 凡以己心探索神圣逻辑者，必失其仅有的微小理智。凡将神圣逻辑局限于自己头脑之界限者，神圣逻辑必在他那里崩裂，而他自己也将成为精神分裂者。
    - type: paragraph
      text:
        ru: Тот, кто постоянно оттачивает свой ум знаниями и живет в удалении от Бога, в конце концов превратит свой ум в обоюдоострый меч и одной его стороной будет постепенно закалывать себя, а другой – рубить людей своими непререкаемыми человеческими рассудочными решениями.
        cn: 一个不断以知识磨砺心智，却又生活在远离上帝之境的人，最终会将他的心智变成一把双刃剑：他会用其中一刃逐渐刺杀自己，而用另一刃，则以他那不容置疑的人类理智决定，来砍伐世人。
    - type: paragraph
      text:
        ru: Наоборот, вера в Бога привлекает божественную силу и переворачивает все человеческие выводы, совершает чудеса, воскрешает мертвых и заставляет науку стоять с раскрытым от удивления ртом.
        cn: 相反地，对上帝的信仰吸引了神圣的力量，颠覆了所有人类的结论，行出神迹，使死人复活，并且让科学惊愕得张口结舌。
    - type: paragraph
      text:
        ru: Чудо является тайной, и ум не может его объяснить, но только пережить. Чтобы пережить тайны Божии, нужно совлечься своего ветхого человека, вернуться неким образом в первоначальное состояние человека до грехопадения, иметь невинность и простоту, для того чтобы вера наша была неизменной, и твердо верить, что для Бога нет ничего невозможного. Когда человек вначале преуспеет благодаря вере, без сомнения, с ним постепенно начнут происходить маленькие и большие чудеса, и тогда уже он будет верить сильнее, непосредственно переживая божественные тайны. Тогда он будет богословом, потому что будет не постигать эти тайны умом, но реально переживать их.
        cn: 神迹是一个奥秘，心智无法解释它，而只能经历它。为了经历上帝的奥秘，人需要脱去自己的旧人，以某种方式回归到堕落前人类的原始状态，拥有纯真和简朴，为的是让我们的信仰坚定不移，并坚信在上帝那里没有不可能之事。当一个人最初凭借信心取得成功时，毫无疑问，大大小小的神迹会逐渐开始发生在他身上，届时，他将直接经历神圣的奥秘，信心会变得更加有力。那时他将成为一位神学家，因为他不是用心智去理解这些奥秘，而是真正地经历它们。
    - type: paragraph
      text:
        ru: Большим злом является сухое богословие, когда мы богословствуем умом и представляем свой ум Духом Святым. Это называется мозгословием, которое порождает вавилонское столпотворение, в то время как в богословии существует множество языков (множество дарований), но все языки согласны между собой, потому что у них один хозяин – Дух Святой, сошедший в день Пятидесятницы, и эти языки – огненные.
        cn: 巨大的恶是枯干的神学，即我们以头脑进行神学探讨，并将自己的心智当作圣灵。这被称为「脑语」，它催生出巴比伦的混乱。然而，在真正的神学中，存在着许多语言（许多恩赐），但所有的语言彼此之间都一致和谐，因为它们拥有同一个主宰——在五旬节降临的圣灵，而这些语言乃是火焰的语言。
    - type: paragraph
      text:
        ru: Тот, кто пренебрегает божественным просвещением и отдает предпочтение уму, составляя красивые проповеди с помощью красивых слов, сродни арианам, которые верили, что Христос является творением Божиим.
        cn: 凡是忽视神圣光照而偏好理智，借助于华丽的辞藻撰写优美讲道的人，就类同于亚流派，他们相信基督是上帝的受造物。
    - type: paragraph
      text:
        ru: Мы же, православные, веруем и исповедуем, что Слово Божие не создано, но рождено «от Отца прежде всех век», и воплотилось «от Духа Свята» и Девы Марии[92], и принесло спасение миру.
        cn: 我们正教徒，相信并宣认，上帝的圣言是非受造的，而是「在万世以先由父所生」，并「藉圣灵与童贞女马利亚」[92]成肉身，且为世界带来了救赎。
    - type: paragraph
      text:
        ru: Слово ума не изменяет души, потому что является плотью. Но Слово Божие, которое рождается от Святого Духа, имеет божественную благодать и изменяет души.
        cn: 人心之言（Слово ума）不能改变灵魂，因为它属于肉体。但由圣灵所生的上帝之道（Слово Божие），拥有神圣恩典，并能改变灵魂。
    - type: paragraph
      text:
        ru: Дух Святой не сходит с помощью техники, и потому богословие не имеет ничего общего с духом науки. Дух Святой нисходит Сам, когда видит в человеке для этого духовные предпосылки. Духовной предпосылкой является очищение человеком от ржавчины своих духовных проводов, для того чтобы стать хорошим электропроводником и принять духовный ток божественного просвещения. Так он становится духовным ученым, богословом.
        cn: '圣灵并非借助技术而降临，因此，神学与科学精神毫无关联。圣灵乃是祂自己降临，当祂在人身上看到为此所需的属灵前提时。


          属灵前提是人将自己属灵导线上的锈迹清除，以便成为良好的导电体，接受神圣光照的属灵电流。如此，他便成为了属灵的学者——神学家。'
    - type: paragraph
      text:
        ru: Благодать Божия притягивает людей, как магнит притягивает железо. Ум сам по себе является ненамагниченной железной палкой, которая стучит по железкам, чтобы они прилепились к ней, а они только деформируются и не пристают.
        cn: 神的恩典吸引着人们，就像磁铁吸引着铁一样。理智（Ум）本身就像一根未被磁化的铁棍，它敲打着那些小铁块，想让它们附着于它，但它们只会变形，无法依附。
    - type: paragraph
      text:
        ru: Берегись, чтобы никогда не просить созерцания нетварного света или Божиих дарований и так далее, но лишь покаяния, которое принесет смирение, и тогда Благий Бог даст тебе то, что тебе нужно.
        cn: 你要当心，切不可祈求对非受造之光或上帝的恩赐等的默观，而只当祈求能带来谦卑的悔改，那么良善的上帝就会将你所需的一切赐给你。
    - type: paragraph
      text:
        ru: Если хочешь выйти на связь с Богом, чтобы Он услышал тебя во время молитвы, переключись на смирение, потому что Бог всегда работает на этой частоте, и смиренно проси Его милости. Когда в тебе разгорится божественная любовь, ты схватишься за микрофон твоей «рации», как влюбленный, и не захочешь удаляться из своей келлии, если тебя не прервут или этого не потребуют какие-нибудь важные дела, которыми находящиеся в таком состоянии тоже часто пренебрегают.
        cn: 如果你想与上帝建立联系，以便祂在你的祷告中垂听你，就转向谦卑，因为上帝总是在这个频率上运作，并谦卑地祈求祂的怜悯。当神圣的爱在你心中燃烧起来时，你会像一个恋爱中的人一样，紧紧抓住你「无线电台」的麦克风，不愿离开你的隐修室，除非有人打断你，或者有什么重要的事务需要你去处理——处于这种状态下的人也常常会忽略这些事务。
    - type: paragraph
      text:
        ru: Кто не понимает смысла молитвы и не чувствует в ней великой потребности, тот относится к молитве как к трудовой повинности. Такой человек похож на неразумного ребенка, который отворачивается от материнской груди, а также от ее сладкой любви и безопасности в ее объятиях и, естественно, бывает болезненным и несчастным.
        cn: 凡不理解祷告的意义，且不感觉祷告中有莫大需求的人，就将祷告视为劳役。这样的人就像是不懂事的孩子，他转离了母亲的乳房，也转离了她甜蜜的爱以及她怀抱中的安全感，自然就会变得病弱和不幸。
    - type: paragraph
      text:
        ru: Берегись, чтобы не расточить свои многоценные силы на излишние и суетные попечения, не устать телесно, не довести напрасно свой ум до рассеяния, и затем во время молитвы не отдавать Богу свои усталость и зевоту, как Каин, который приносил в жертву худшее (Быт. 4). Естественно, что твое внутреннее состояние будет тогда состоянием Каина – с такой же тяжестью на душе и воздыханиями из-за лукавого, который будет рядом с тобой.
        cn: 请谨慎，不要将你宝贵的精力浪费在不必要的和徒然的操劳上，以免身体疲惫，徒然导致心思涣散。随后在祷告时，便把你的疲惫和呵欠献给上帝，如同该隐献上那更次的祭物一样（创世记 4）。那时，你的内心状态自然就会是该隐的状态——带着同样的沉重在心头，并因那在你身边的恶者而发出叹息。
    - type: paragraph
      text:
        ru: 'Кто без уважительной причины оставляет свои молитву и духовные обязанности и постоянно работает (строит пирамиды для фараона), тот удаляется от Бога, дичает и постоянно жестоко пинает своими бесчинствами своего ангела-хранителя, пока не изгонит его, и тогда управлять им начинает лукавый, который сразу же делает следующие изменения: во-первых, отменяет монашеские четки и заменяет их на четки мирские[93]; во-вторых, совершенно упраздняет духовное чтение и заменяет его мирскими журналами и газетами. Лукавый в конце концов овладевает им, и он внутренне страдает и ищет увеселений, как было с Саулом, когда тот удалился от Бога и в него вселился бес[94].'
        cn: 任何无正当理由放弃自己的祈祷和属灵义务，并持续工作（为法老建造金字塔）的人，他就远离上帝，变得野蛮，并不断用自己的不端行为残忍地踢打他的守护天使，直到将其驱逐。届时，邪恶者便开始掌控他，并立即做出如下改变：第一，废除修士念珠，代之以世俗念珠[93]；第二，彻底废止属灵阅读，代之以世俗杂志和报纸。邪恶者最终完全控制他，他内心遭受痛苦，并寻求娱乐，正如扫罗远离上帝并被邪灵附身时所发生的那样[94]。
    - type: paragraph
      text:
        ru: Духовное чтение очень согревает душу и рассеивает дневные заботы, и тогда душа освобождается и переносится в сродную ей духовную божественную атмосферу и ум сосредоточивается.
        cn: 灵修阅读极大地温暖灵魂，驱散白日的忧虑，此时灵魂得以释放，并被带入与她相亲的属灵的神圣氛围之中，心智也得以专注。
    - type: paragraph
      text:
        ru: Следи за тем, чтобы не попросить в своей молитве созерцания нетварного света, ангелов или иных видений. Смиренно подвизайся, немного потерпи и в иной жизни узришь все тайны Божии, а в этой будешь идти безопасной дорогой. Некоторые просили о том, чтобы увидеть нетварный свет и ангелов, и тогда появлялись бесы в ложной светлой одежде с ложным светом, забирали их, чтобы якобы вознести к Богу, и низвергали их в ад.
        cn: 务必小心，不要在你的祷告中祈求默观非受造之光、天使或其他异象。谦卑地操练（修行），稍加忍耐，在来世你将得见上帝（上帝）的一切奥秘；而在今生，你将行走在安全的道路上。有些人曾祈求得见非受造之光和天使，那时便有邪灵以虚假的明亮衣袍和虚假的光芒显现，引诱他们，声称要将他们带升至上帝（上帝）那里，却将他们一同投入了地狱。
    - type: paragraph
      text:
        ru: Если демоны не нападают на тебя, не думай, что ты уже достиг такой меры, что они тебя боятся, но знай, что Благий Бог защищает тебя (потому что ты духовно бессилен), как маленького цыпленка от ястребов.
        cn: 如果恶魔没有攻击你，不要以为你已经达到了某种程度，以致他们畏惧你，但要知道，是至善的上帝在保护你（因为你在灵性上是软弱无力的），如同保护一只小鸡免受鹰隼的侵扰。
    - type: paragraph
      text:
        ru: Если ты постоянно чувствуешь в душе великую радость, пусть помысел не говорит тебе, что ты уже достиг высокой меры, но знай, что все твои страсти живы в тебе и Благий Бог по великой Своей доброте посылает тебе божественное утешение, потому что ты страдаешь ради Его любви и лишен человеческого утешения в пустыне.
        cn: 如果你持续地在灵魂中感受到极大的喜乐，不要让思念对你说，你已经达到了很高的境界。而是要知道，你所有的情欲在你里面依然活跃，是良善的上帝凭着祂伟大的良善，赐予你神圣的慰藉，因为你为了爱祂而受苦，并且在旷野中失去了属人的慰藉。
    - type: paragraph
      text:
        ru: Опять же, если ты вначале испытываешь сильную брань, это не только не должно приводить тебя в отчаяние, но, наоборот, ты должен знать, что враг со своим тысячелетним опытом понял, что ты скоро преуспеешь, и потому приходит, чтобы вызвать у тебя панику с помощью угроз, мечтаний во время сна и в состоянии бодрствования, устрашить тебя и вынудить оставить твои подвиги. Если ты ответишь презрением на его угрозы и вверишь себя Богу, он отступит, однако вскоре после этого приблизится к тебе с правой стороны, уже как друг, и поможет подвизаться еще больше, а затем предложит пососать, как карамельки, гордые помыслы. И если ты не выплюнешь их, но начнешь сосать (думая, что ты почти святой, а затем – что ты святой), тогда он будет тут как тут со своим телевизором, явлениями в виде святого, ангела и так далее, пока не сведет тебя с ума или не сбросит в пропасть – упаси Бог!
        cn: '再次，如果你在起初就经历猛烈的争战，这不仅不应该使你陷入绝望，相反地，你应当知道，仇敌凭借其千年的经验，明白你即将获得精进（成就），因此前来，企图通过威胁、睡梦中和清醒时的幻想，让你产生恐慌，恐吓你，并迫使你放弃你的苦修。


          如果你以轻蔑回应对它的威胁，并将自己完全信赖于上帝，它就会退却。然而，在这之后不久，它又会从右侧靠近你，这时它已是朋友的姿态，会帮助你进行更多的苦修。然后，它会提议让你吸食骄傲的意念，就像吸食糖果一样。如果你不将它们吐出，而是开始吸食（心想你几乎已是圣徒，然后——你已是圣徒），那么它就会立即带着它的「电视机」，以圣徒、天使等形象显现，直到它使你发疯，或是将你投入深渊——求上帝保佑！'
    - type: paragraph
      text:
        ru: Следи также за тем, чтобы не попытаться самому оценить свое духовное состояние по количеству своих подвигов, четок, поклонов и т.д. Испрашивай со смирением милости Божией и спасения сначала для всех людей, а затем какой-нибудь уголок в раю для себя, грешного, и то лишь для того, чтобы Христос не огорчался тем, что ты попал в ад.
        cn: 也要留意，不要试图自己根据你的苦修功课、念珠、跪拜等等的数量，来评估你的属灵状态。带着谦卑，首先为所有的人恳求上帝的怜悯和救恩，然后为你这罪人自己，恳求在天堂里的一隅，这样做仅仅是为了让基督不至于因为你坠入地狱而感到忧伤。
    - type: paragraph
      text:
        ru: Если ты любишь себя больше, чем других людей, знай, что не живешь духом Христовым. Если видишь в себе больше способностей, чем у других, и хвалишься ими, то, даже если ты поистине их имеешь, знай, что ты поистине очень несправедлив (несправедливо относишься к Богу) и очень неблагодарен, потому что не воздал за них благодарности Богу.
        cn: 如果你爱自己胜过爱他人，须知你不是活在基督的圣灵里。如果你看到自己比别人拥有更多才能，并以此自夸，那么，即便你确确实实拥有它们，须知你确确实实非常不公义（对上帝非常不公义）且非常不知感恩，因为你没有为此向上帝献上感谢。
    - type: paragraph
      text:
        ru: Если ты чувствуешь успокоение в красивых местах, где много зелени и тому подобного, и не находишь себе покоя в своей келлии, знай, что в тебе еще живет мир со всеми мирскими страстями. Однако полезно выходить из келлии для духовных занятий и для труда, потому что труд приносит двойное здоровье, душевное и телесное, если совершается с рассуждением.
        cn: '若你在绿意盎然等优美之处感到安宁舒缓，却无法在自己的隐修小室（келлия）中寻得安息，你当知道，世界及其一切世俗的激情仍活在你内。


          然而，为了属灵的操练和劳作而走出小室，亦是有益的，因为劳作带来双重的健康，即灵魂的健康和身体的健康，前提是此劳作需以明辨而行。'
    - type: paragraph
      text:
        ru: Большое количество работы и множество попечений очень обмирщают монаха, так что он живет уже, как мирянин, с тяжестью и мирским беспокойством в душе. Говоря кратко, он еще в этой жизни испытывает отчасти адские мучения из-за постоянных беспокойств, несчастий и т.д.
        cn: 繁重的工作和众多的挂虑使修士极大地世俗化了，以至于他活得就像一个平信徒，心中带着沉重和世俗的忧虑不安。简而言之，由于持续不断的忧虑、不幸等等，他尚且在今生就体验着部分的炼狱折磨。
    - type: paragraph
      text:
        ru: Всегда имей терпение, потому что оно является наилучшим лекарством, которое исцеляет от многолетних искушений, ибо многие искушения прекращаются только при терпении (с течением времени), как и снег со льдом исчезают, только когда мы с терпением дожидаемся весны, которая растапливает их солнечными лучами. Льды и снега не тают при унынии, но только при терпении.
        cn: 要常常存有忍耐，因为它乃是至上的良药，能治愈多年之久的试探；因为许多试探只有借由忍耐（随着时间流逝）才会停止，正如冰雪唯有当我们带着忍耐等到春天降临，以阳光将其融化时才会消融。冰雪不会因灰心（沮丧）而融化，唯有借由忍耐。
    - type: paragraph
      text:
        ru: Надежда на Бога является наилучшей страховкой для человека. Самоуверенность является нашим наибольшим и наихудшим врагом, который безжалостно и неожиданно нас разоряет и оставляет в несчастном положении под открытым небом.
        cn: 对上帝的盼望是对人最好的保障。自恃是我们最大、最坏的敌人，它会无情而突如其来地使我们败落，把我们丢在露天之下，境况悲惨。
    - type: paragraph
      text:
        ru: Не подвизайся безрассудно, подобно бурному потоку, чтобы не утекли сразу все твои силы, но с ревностью и рассуждением (тем более если ты ревностный от природы), чтобы враг не вызвал у тебя в душе тяжести оттого, что ты безрассудно будешь понуждать себя к подвигам выше сил.
        cn: 不要像汹涌的洪流一般不加思索地苦修，免得你所有的力量立即流失殆尽。但要带着热忱与审慎（尤其如果你天性热忱），以免你因不加思索地勉强自己去从事超越自身力量的苦修，而使仇敌在你心底引起沉重感。
    - type: paragraph
      text:
        ru: Если у тебя несколько суровый характер, опять-таки не понуждай себя безрассудно, чтобы не начать брыкаться и чтобы враг не возобладал тобой через духовную дерзость по отношению к божественному и совершенное безразличие.
        cn: 如果你性情较为严厉（或刚烈），同样不要不加思索地强迫自己，以免开始抗拒，以至于仇敌通过你对神圣事物的属灵鲁莽和彻底的漠不关心来辖制你。
    - type: paragraph
      text:
        ru: Смягчи, насколько можешь, свое суровое сердце рядом с уязвленными душами, чтобы оно стало чувствительным и смиренным, и испрашивай со смирением милости Божией, и она скоро придет.
        cn: 尽你所能，软化你那刚硬的心，在那些受创的灵魂身旁，使其变得有感受力且谦卑，并以谦卑求取上帝的慈悲，慈悲很快就会到来。
    - type: paragraph
      text:
        ru: Тот, кто не верит в Бога и не просит у Него милости в своих испытаниях, всегда остается беспомощным, безутешным и мучится в этой жизни (потому что в таком случае его жизнь не имеет смысла), а также осуждает себя на вечные мучения. Однако тот, кто верит в Бога, никогда не почувствует горечи испытаний (достаточно ему этого захотеть), если горечь испытаний, которые приходят к нему, принесет к Сладчайшему Иисусу, Который превратит ее в сладкий сироп и ему поможет.
        cn: 那些不信靠上帝、在试炼中不求祂施予怜悯的人，在今生总是软弱无助、得不到安慰、饱受折磨（因为在这种情况下，他的生命毫无意义），并定自己受永恒的苦难。然而，信靠上帝的人，如果他将临到他的试炼的苦楚带到至甘甜的耶稣那里，他绝不会感受到这苦楚（只要他愿意如此）。至甘甜的耶稣会将这苦楚转变为甘甜的糖浆，并帮助他。
    - type: paragraph
      text:
        ru: Самым лучшим лекарством от самых больших наших несчастий является еще большее несчастье другого человека – достаточно лишь приблизить его к нашему собственному, чтобы увидеть существенную разницу между ними и великую любовь к нам, которую показал Бог, попустив для нас небольшое испытание. Тогда мы возблагодарим Бога и почувствуем сострадание к своему ближнему, который так много терпит, а также сотворим сердечную молитву, чтобы Бог помог ему. И Бог увенчает его, если он не будет роптать, но будет с радостью терпеть и просить еще больших испытаний, чтобы искупить свои грехи или таким образом стать причастником страданий своего Господа для выражения Ему своей благодарности.
        cn: 治愈我们最大不幸的最好良药，是另一个人的更大不幸——我们只需将其与我们自己的不幸靠近，就能看到两者之间本质性的差异，并看到神所展现的、祂对我们的大爱——祂只容许了我们经受一个小小的试炼。那么，我们就会感谢神，并对那忍受着如此多苦难的近人产生怜悯之心，也会发出衷心的祷告，祈求神帮助他。如果他不起怨言，而是会欢喜地忍受，并祈求更大的试炼，以此赎清自己的罪孽，或是以此方式成为分担自己主（基督）的苦难者，好向祂表达自己的感恩，那么神就将为他加冕。
    - type: paragraph
      text:
        ru: Блажен тот, кто может таким способом гнаться по пятам за страшным диаволом, который собирает тогда своих бесов и превращается вместе с ними в черный дым, потому что попали в его слабое место.
        cn: 那蒙福之人，乃能以这种方式紧追在可怕的魔鬼之后。魔鬼此刻召集它的众邪魔，并与它们一同化作黑烟，因为它的弱点被击中了。
    - type: paragraph
      text:
        ru: Благий Бог да просветит и да укрепит весь Свой мир, чтобы он бил по этому слабому месту беса и тот уже не приходил бы к нам из ада (и исполнял там свою епитимию и покаялся, если это возможно) и оставил создания Божии в покое, чтобы мы избавлялись от грехов, а не умножали их.
        cn: 良善的上帝愿光照并坚固祂整个世界，使世界能够击打那魔鬼的软弱之处，好叫它不再从地狱来到我们这里（并在那里执行它的苦修和忏悔，如果这是可能的话），并让上帝的受造物得享平静，使我们能够摆脱罪孽，而不是增添它们。
    - type: paragraph
      text:
        ru: Молитесь и обо мне, немощном создании Божием, ибо «от многих моих грехов немоществует тело, немоществует и душа моя…»[95]. Надеюсь на Бога, что вашими молитвами удостоюсь доброго покаяния.
        cn: 也请为我这个软弱的受造物祷告，因为「因我罪愆众多，我的身体软弱，我的灵魂也软弱……」[95]。我仰望上帝，希望借着你们的祷告，使我得以真诚的悔改。
    - type: paragraph
      text:
        ru: С любовью о Христе ваш брат монах Паисий.
        cn: 在基督里的爱中，您的兄弟，修士帕伊西。
- type: heading1
  text:
    ru: Письмо шестоеБлаженства
    cn: '信函六


      真福'
  children:
  - type: paragraph
    text:
      ru: Калива Честнаго Креста, 2.12.1972 г.
      cn: 卡利瓦（小隐修所）圣十字，1972年12月2日。
  - type: heading2
    text:
      ru: Сестра старица Филофея, благословите!
      cn: 姊妹，女长老菲洛塞娅，请祝福！
    children:
    - type: paragraph
      text:
        ru: 'Сегодня на меня нашло какое-то безумие: я взял карандаш, как делает безумный, который записывает свои бредовые мысли углем на стене, и сел, желая как безумный записать свои – на бумаге и, опять-таки как безумный, послать вам написанное. Второе безумие я совершаю по большой любви к моим сестрам, чтобы они получили пользу, пусть и небольшую.'
        cn: 今天我陷入了一种疯狂：我拿起铅笔，就像一个疯子用炭块在墙上记录他胡言乱语的想法一样，坐下来，渴望像疯子一样把我的想法——写在纸上，然后，再次像疯子一样，把写好的东西寄给你们。我犯下这第二种疯狂，是出于对我的姐妹们极大的爱，好让她们能得到益处，哪怕只是微小的益处。
    - type: paragraph
      text:
        ru: Причиной первого моего безумия стали пять писем, одно за другим, из различных частей Греции с различными вопросами. Хотя все события, которые произошли с людьми, написавшими мне эти письма, были великим благословением Божиим, они тем не менее впали в отчаяние, потому что отнеслись к ним по-мирски.
        cn: 我初次陷入的妄想，其缘由是五封信件，接踵而至，来自希腊各地，信中提出了各种不同的问题。尽管那些写信给我的人所经历的一切事件都是莫大的上帝鸿恩，然而他们却因以世俗的方式来对待这些事件，而陷入了绝望。
    - type: paragraph
      text:
        ru: После ответов на письма я как безумный, о чем уже говорил, взял карандаш и написал все это, потому что верю, что даже какие-нибудь пятьдесят драхм от вашего находящегося в отъезде брата позволят каждой сестре купить по кремню, чтобы зажечь в своей келлии свечку и принести славословие Благому Богу нашему.
        cn: 在回复完那些信件之后，我像个疯子一样——这我已经说过了——拿起铅笔写下了这一切，因为我相信，即便是您的那位远行在外的弟兄所寄来的区区五十德拉克马，也能让每一位修女买到一块燧石，以便在自己的小室里点燃蜡烛，将颂赞献给我们至善的上帝。
    - type: paragraph
      text:
        ru: Я чувствую великую радость, когда каждая сестра несет свой крест и с ревностью подвизается соответственно своим силам.
        cn: 当每一位修女（姊妹）背负自己的十字架，并按照自己的能力热切地奋力修行时，我深感喜悦。
    - type: paragraph
      text:
        ru: Даже сердца, равного по величине солнцу и светлого, как солнце, будет мало, чтобы отдать его Христу в благодарность за Его великие дары и особенно за ту великую честь, которой Он удостоил нас, монахов, призвав в личном порядке в Свой ангельский чин.
        cn: 即使是那大如太阳、明亮如太阳的心，也嫌不足，以献给基督，来感谢祂所赐的伟大恩典，特别是祂授予我们修士的这份莫大荣耀，即亲自将我们召入祂的天使品级之中。
    - type: paragraph
      text:
        ru: Также великой чести достойны родители, которые сподобились породниться с Богом через своих детей. К сожалению, многие родители не понимают этого и, вместо того чтобы благодарить Бога, наоборот, ропщут и так далее, потому что на все смотрят по-мирски, как и те люди, о которых я сказал выше и которые стали причиной того, что я взял в руки карандаш и написал все то, о чем говорю ниже.
        cn: 此外，那些有幸通过自己的孩子与上帝结为亲家的父母，也配得极大的尊荣。不幸的是，许多父母并不理解这一点，他们非但不感谢上帝，反而抱怨等等。这是因为他们凡事都以属世的眼光来看待，正如我上文所提到的那些人一样。这些人正是促使我拿起铅笔，写下我下面所要说的这一切的原因。
    - type: paragraph
      initial:
        ru: '1.'
        cn: '1.'
      text:
        ru: Блаженны возлюбившие Христа больше всего в мире и живущие вдали от мира и рядом с Богом в райской радости еще на земле.
        cn: 那些在世间爱基督胜过一切的人，以及那些远离世界、与上帝相近、甚至在地上就活在乐园喜乐中的人，是有福的。
    - type: paragraph
      initial:
        ru: '2.'
        cn: '2.'
      text:
        ru: Блаженны сподобившиеся жить незаметно, стяжавшие великие добродетели и не стяжавшие себе даже малого имени.
        cn: 凡得以隐秘度日、获得伟大德行却连微小名声也未曾为自己获取的人，是有福的。
    - type: paragraph
      initial:
        ru: '3.'
        cn: '3.'
      text:
        ru: Блаженны сподобившиеся юродствовать и таким образом сохранившие свое духовное богатство.
        cn: 蒙允得行佯狂，并以此方式保全了自身属灵财富的人，是有福的。
    - type: paragraph
      initial:
        ru: '4.'
        cn: '4.'
      text:
        ru: Блаженны те, которые не проповедуют Евангелие словами, но живут им и проповедуют его своим молчанием, с помощью благодати Божией, которая и выдает их.
        cn: 福哉，那些不用言语宣讲福音，却活出福音，并藉着上帝恩典的帮助，以他们的静默宣讲福音，而那恩典也显明了他们的人。
    - type: paragraph
      initial:
        ru: '5.'
        cn: '5.'
      text:
        ru: Блаженны радующиеся тогда, когда их несправедливо обвиняют, а не тогда, когда их справедливо хвалят за их добродетельную жизнь. Именно в этом заключается признак святости, а не в сухих телесных подвигах и не в великом множестве подвигов, которые, если не совершаются со смирением и с целью совлечения ветхого человека, производят лишь обманное впечатление на людей.
        cn: 有福了，那些在他们被不义地指控时而欢喜，而不是在他们因其德行生活被正当地赞扬时而欢喜的人。圣洁的记号，正是在于此，而不在于枯燥的肉体苦修，也不在于那极多的苦功——若这些苦功不是以谦卑的心和为了脱去旧人的目的而行，则只能徒然在人前制造出虚假的印象。
    - type: paragraph
      initial:
        ru: '6.'
        cn: '6.'
      text:
        ru: Блаженны предпочитающие, чтобы их обижали, нежели чтобы они сами обижали других, и спокойно и молчаливо принимающие обиды, потому что этим они на деле показывают, что веруют «во единого Бога Отца, Вседержителя»[96]и от Него ждут себе оправдания, а не от людей, чтобы те воздали им в этой жизни суетными благами.
        cn: 那些宁愿自己受委屈，也不愿委屈他人的人，是有福的；他们平静而默默地忍受委屈，因为他们以行动表明，他们确实相信「独一的父上帝，全能者」[96]，并从祂，而非从人那里，寻求自己的辩护，不期望人在这短暂的生命中以虚妄的福报偿还他们。
    - type: paragraph
      initial:
        ru: '7.'
        cn: '7.'
      text:
        ru: Блаженны родившиеся калеками или ставшие таковыми по неосторожности, если при этом они не ропщут и славословят Бога. У них будет самое лучшее место в раю вместе с исповедниками и мучениками, которые отдали ради любви Христовой свои руки и ноги и теперь в раю постоянно с благоговением лобызают руки и ноги Христовы.
        cn: 那些生来残疾或因疏忽致残的人是有福的，如果他们因此不发怨言，并颂赞上帝。他们将在乐园里拥有最好的位置，与认信者和殉道者一同，这些认信者和殉道者为了基督的爱献出了他们的双手和双脚，如今他们在乐园里，不断地带着敬畏亲吻基督的双手和双脚。
    - type: paragraph
      initial:
        ru: '8.'
        cn: '8.'
      text:
        ru: Блаженны родившиеся безобразными и испытывающие уничижение здесь, на земле, потому что они заслуживают самого красивого места в раю, если славословят Бога и не ропщут.
        cn: 蒙福的是那些生而形貌不扬、并在此世间经历卑微（或作「屈辱」）的人，因为如果他们颂赞神而不发怨言，他们就配得在天堂中最美好的居所。
    - type: paragraph
      initial:
        ru: '9.'
        cn: '9.'
      text:
        ru: Блаженнее вдовы, которые носят черную одежду в этой жизни, пусть даже невольно, и при этом живут белой духовной жизнью, славословят Бога и не ропщут, чем те несчастные женщины, которые носят пестрые одежды и ведут распутную жизнь[97].
        cn: 那些寡妇是更有福的，她们在今生身着黑衣，即便并非出于自愿，却过着洁白属灵的生活，颂赞上帝而不发怨言；她们比那些不幸的女人更有福，那些女人身着五彩斑斓的衣服，却过着放荡不羁的生活[97]。
    - type: paragraph
      initial:
        ru: '10.'
        cn: '10.'
      text:
        ru: Блаженны и трижды блаженны сироты, лишившиеся великой любви своих родителей, потому что они еще в этой жизни сподобились иметь Отцом Бога и при этом хранят родительскую любовь, которой лишились, в Божием банке, и она приносит проценты.
        cn: 蒙福啊，乃至三倍蒙福，那些失去父母至大慈爱的孤儿们，因为他们尚在今生就蒙受恩典，得以拥有上帝为父，并且将他们所失去的父母之爱，存放在上帝的银行中，使其生息。
    - type: paragraph
      initial:
        ru: '11.'
        cn: '11.'
      text:
        ru: Блаженны родители, которые не используют слова «не» в разговоре со своими детьми, но удерживают их от зла своей святой жизнью, которой дети подражают, следуя с духовным мужеством за Христом в радости.
        cn: 蒙福的父母，他们不与孩子在交谈中使用「不」这个词，而是凭借他们圣洁的生命拦阻孩子远离邪恶；孩子们效仿这样的生命，带着属灵的勇气，在喜乐中跟随基督。
    - type: paragraph
      initial:
        ru: '12.'
        cn: '12.'
      text:
        ru: Блаженны дети, которые «от чрева матери» родились святыми, однако более блаженны те, которые родились со всеми наследственными мирскими страстями, но подвизались до седьмого пота, искоренили их в себе и унаследовали Царство Божие«в поте лица»(Быт. 3:19).
        cn: 那些「从母腹中」就圣洁降生的孩子是有福的，然而更有福的是那些带着所有遗传的属世情欲而生，却奋力苦修至大汗淋漓，将它们在自身中根除，并「汗流满面」（创世记 3:19）地继承了上帝之国的人。
    - type: paragraph
      initial:
        ru: '13.'
        cn: '13.'
      text:
        ru: Блаженны дети, которые с младенчества жили в духовной обстановке и потому неустанно преуспевали в духовной жизни.
        cn: 有福了，那些从婴孩时期就生活在属灵环境中的孩子们，因此能在属灵的生命中不懈地长进。
    - type: paragraph
      text:
        ru: Но трижды блаженны те обделенные дети, которых не учили ничему полезному (но, напротив, постоянно подталкивали ко злу), но у которых, стоило им услышать о Христе, заблестели глаза и, повернувшись на сто восемьдесят градусов, они сразу очистили до блеска свою душу и вышли из пределов земного тяготения на духовную орбиту.
        cn: 然而，那些被亏欠的孩子，他们不曾被教导任何有益之事（反而不断被推向邪恶），却是三倍蒙福的。只因他们一听到关于基督的事，双眼便焕发出光芒，立即来了一个一百八十度的大转弯，将自己的灵魂擦拭得闪闪发光，脱离了地心引力的界限，进入了属灵的轨道。
    - type: paragraph
      initial:
        ru: '14.'
        cn: '14.'
      text:
        ru: Счастливы, как говорят в миру, космонавты, которые вращаются вокруг Луны.
        cn: 如世人所言，那些环绕月球运行的宇航员们是幸福的。
    - type: paragraph
      text:
        ru: Однако блаженны сделавшиеся невещественными Христовы «раенавты», которые взлетают к Богу и постоянно вращаются в раю – своем постоянном жилище – с помощью самого быстрого средства передвижения и не расходуя много горючего, но обходясь одним сухариком.
        cn: 然则，那些已变得非物质的、基督的「乐园飞航员」是有福的。他们飞升至上帝那里，并不断在乐园中——他们恒常的居所——遨游。他们借助最快的交通工具，不耗费很多燃料，但只需一块干粮即可。
    - type: paragraph
      initial:
        ru: '15.'
        cn: '15.'
      text:
        ru: Блаженны славословящие Бога за луну, которая им светит, когда они идут ночью. Однако блаженнее те, которые поняли, что и свет луны не является ее собственным, а также то, что их собственный духовный свет не их собственный, но Божий. Сияют ли они, как зеркало или как простое стекло, или как крышка от консервной банки, – если на них не упадут лучи солнца, они не могут засиять.
        cn: 那些为着月亮而颂赞上帝的人是有福的，月亮在他们夜行时照耀着他们。然而，更有福的是那些明白月亮的光并非其自身所有，也明白他们自身的属灵之光并非其自身所有，而是属于上帝的人。无论他们是像镜子般闪耀，像普通的玻璃般闪耀，抑或是像罐头盖般闪耀，——如果太阳的光线没有照射在他们身上，他们就无法发出光芒。
    - type: paragraph
      initial:
        ru: '16.'
        cn: '16.'
      text:
        ru: Счастливы, говорят в миру, живущие в хрустальных дворцах и имеющие все удобства. Однако блаженны сумевшие сделать свою жизнь простой, освободиться от петли этого мирского прогресса с множеством удобств (множеством неудобств) и избавиться от ужасного душевного беспокойства нашего времени.
        cn: 世人说，那些住在水晶宫殿里、拥有一切便利的人是幸福的。然而，蒙受祝福（блаженны）的是那些能够使自己的生活保持简朴，从世俗进步这带有多重便利（实则多重不便）的桎梏中挣脱出来，并摆脱我们时代可怕的灵魂烦扰的人。
    - type: paragraph
      initial:
        ru: '17.'
        cn: '17.'
      text:
        ru: 'Счастливы, говорят в миру, те, которые могут насладиться благами мира. Однако блаженны те, которые все это отдают Христу и лишают себя всякого человеческого утешения – опять-таки ради Христа. Таким образом они сподобляются день и ночь пребывать со Христом, получая Его божественное утешение, которое часто оказывается столь великим, что они обращаются к Богу с такими словами: «Боже мой, нельзя вынести Твоей любви, потому что она велика и не вмещается в мое маленькое сердце».'
        cn: '世人说，那些能享受世间福乐的人是快乐的。然而，蒙福的是那些将这一切都奉献给基督，并（再次）为了基督的缘故，舍弃自己一切属人安慰的人。


          如此一来，他们便得蒙恩准，昼夜与基督同在，领受祂神圣的安慰。这安慰往往是如此之大，以至于他们向上帝发出这样的言语：「我的上帝啊，您的爱令人难以承受，因为它如此浩大，竟无法容纳在我这微小的心中。」'
    - type: paragraph
      initial:
        ru: '18.'
        cn: '18.'
      text:
        ru: Счастливы те, у которых есть хороший заработок и большие дома, говорят мирские люди, потому что у них есть все возможности и они делают все, что хотят.
        cn: 世俗之人说，那些拥有好的收入和/或大房子的人是幸福的，因为他们拥有所有的机会，并且他们做他们想做的所有事情。
    - type: paragraph
      text:
        ru: Однако блаженны те, у которых есть только каморка, куда можно забиться, немного пищи и одежда, как говорит божественный Павел (1Тим. 6:8)), и которые смогли таким образом сделаться чужими для суетного мира, а землю используют как подставку для ног, как чада Божии, тогда как их ум постоянно пребывает возле их Благаго Отца – Бога.
        cn: 然而，那些有福的人，他们只有一间可以藏身的小屋、一点食物和衣裳，正如神圣的保罗所言（提摩太前书 6:8），并且他们能够以此方式，对这虚妄的世界而言成为陌客，如同上帝的儿女一般，将大地用作脚凳，而他们的心神则持续地驻留于他们良善的父——上帝身边。
    - type: paragraph
      initial:
        ru: '19.'
        cn: '19.'
      text:
        ru: Счастливы те, которые становятся (пусть даже на несколько часов с помощью алкоголя) генералами и министрами, чему радуются люди мирские.
        cn: 那些人是幸福的，他们得以成为（哪怕是借助酒精维持几个小时的）将军和部长，世俗之人对此感到欢欣。
    - type: paragraph
      text:
        ru: Однако блаженны те, которые совлеклись своего ветхого человека, стали невещественными, сподобились с помощью Духа Святого[98]стать земными ангелами, нашли райские божественные бочки и постоянно пьют райское вино и пьянеют от него.
        cn: 然而，那些脱去了他们的旧人、变得非物质，蒙圣灵的帮助[98]得配成为地上的天使，寻得了乐园神圣的木桶，且持续饮用乐园的美酒，并因此沉醉的人，是有福的。
    - type: paragraph
      initial:
        ru: '20.'
        cn: '20.'
      text:
        ru: Блаженны родившиеся безумными, потому что они будут судимы как безумные и войдут в рай без паспорта.
        cn: 生而愚昧的人是蒙福的，因为他们将以愚昧人的身份被审判，并能不凭护照就进入天堂。
    - type: paragraph
      text:
        ru: Однако блаженны и трижды блаженны те, которые, будучи мудрыми, изображают из себя безумцев ради любви Христовой и смеются над мирской суетой, потому что их безумие Христа ради стоит больше всех знаний и премудрости премудрых всего мира сего.
        cn: 然而，那些因着基督的爱，身为智者却甘愿装作愚拙、嘲笑世俗虚妄的人，是有福的，是三倍有福的。因为他们这为基督缘故的愚拙，比世上一切智者的所有知识和智慧更具价值。
    - type: paragraph
      text:
        ru: Прошу всех сестер молиться, чтобы Бог дал мне или, лучше, забрал у меня мой маленький ум, для того чтобы я хотя бы таким образом мог получить рай будучи судим как безумный. Или пусть Он сведет меня с ума Своей любовью, чтобы я вышел за рамки своего «я», за пределы земли и земного тяготения – иначе моя монашеская жизнь не будет иметь смысла. Внешне я как монах поседел. Внутренне же день ото дня чернею из-за нерадения, но оправдываю себя болезнями и тогда, когда случится заболеть, и тогда, когда у меня все в порядке и меня нужно бить палкой. Молитесь обо мне.
        cn: 我请求所有姊妹们祷告，愿上帝赐予我，或者更好是，收回我那微薄的心智，这样我至少能以被审判为愚妄人的方式获得天国。或者，愿祂以祂的爱使我疯狂，好让我能够走出我的「自我」，超越大地与地心引力的界限——否则我的修道生活将毫无意义。在外表上，我作为一个修士已经头发变白。而在内里，我却因不虔敬而日复一日地变黑，但我却为自己开脱说是因为疾病，无论是在真的生病时，还是在我一切安好、本应被杖击时。请为我祷告。
    - type: paragraph
      text:
        ru: Христос и Пресвятая Богородица с вами.
        cn: 基督和至圣的上帝之母与你同在。
    - type: paragraph
      text:
        ru: С любовью о Христе ваш брат монах Паисий.
        cn: 在基督里的爱中，您的兄弟，修士帕伊西。
footnotes:
  '[1]':
    ru: 'Эта книга издана на русском языке. См.: СтарецПаисий Святогорец. Преподобный Арсений Каппадокийский. Свято-Троицкая Сергиева Лавра, 1997. –Ред.'
    cn: 本书由俄文出版。参见：派西奥斯长老（圣山）。卡帕多奇亚的圣者阿森尼。圣三一谢尔盖拉夫拉，1997年。——编。
  '[2]':
    ru: Город на северо-востоке Греции. –Ред.
    cn: 希腊东北部的一座城市。–编者注。
  '[3]':
    ru: В келлии «Панагуда» старец Паисий провел последние годы своей жизни. Название келлии означает «Пресвятая». –Ред.
    cn: 在「帕纳古达」修行室里，长老帕伊西奥斯度过了他生命的最后几年。「帕纳古达」这一名字意为「至圣者」。——编者注
  '[4]':
    ru: Калива – жилище отшельника, маленький дом, иногда с храмом в данном случае – в честь Честного и Животворящего Креста Господня. –Прим. переводчика.
    cn: 卡利瓦 — 隐士的居所，一座小屋，有时附有圣殿，在此例中——为纪念尊荣和施生命力的主之十字架。 – 译者注。
  '[5]':
    ru: Старец написал письмо к новоначальным в тетради, сделанной им самим. –Греч. ред.
    cn: 长老给初入道者们写了一封信，信件在他自己制作的笔记本中。——希腊语编注。
  '[6]':
    ru: Капсала – местность на Святой Горе возле монастыря Ставроникита, где в келлии Честнаго Креста Господня в течение одиннадцати лет жил старец. –Прим. пер.
    cn: 卡普萨拉（Kapsala）是圣山上的一个地区，靠近斯塔夫罗尼基塔修道院，一位长老曾在那里尊贵主十字架的会室中居住了十一年。——译者注
  '[7]':
    ru: Часто употребляемое в Греции при встрече и прощании приветствие. –Ред.
    cn: 希腊在见面和告别时经常使用的问候语。—编注。
  '[8]':
    ru: 'Василиады – греческое название основанных святителем Василием Великим благотворительных учреждений: больницы, странноприимного дома и др. –Ред.'
    cn: 巴西利亚斯（Василиады）——这是圣主教瓦西里大帝所创建的慈善机构的希腊语名称，这些机构包括医院、客栈（款待陌生人的地方）等。——编者注
  '[9]':
    ru: Департамент социального обеспечения – отдел Министерства здравоохранения и социальной защиты населения Греции, занимающийся социальным обеспечением пенсионеров, инвалидов, нетрудоспособных и т.д. – Ред.
    cn: 社会保障部——希腊卫生和社会保障部下属部门，负责退休人员、残疾人、丧失劳动能力者等的社会保障。——编者注。
  '[10]':
    ru: Вероятно, старец имеет в виду засуху, которая была послана Богом как наказание нечестивому царству Израильскому по молитве святого пророка Илии и по его же молитве была прекращена (см.:3Цар. 17–18). –Ред.
    cn: 很可能这位长老指的是上帝因圣先知以利亚的祷告而降下，用以惩罚不敬虔的以色列王国，并同样因他的祷告而止息的旱灾（参：列王纪上 17–18）。——编者注
  '[11]':
    ru: «Эвергетино́с» – душеполезный сборник, составленный в XI веке монахом константинопольского Эвергетидского монастыря Павлом Эвергетиносом и получивший его имя. Переработан и дополнен в XVIII в. преподобнымНикодимом Святогорцем. –Ред.
    cn: 《爱弗盖蒂诺斯》（Evergetinos）是一部益灵文集，由君士坦丁堡爱弗盖蒂斯修道院的修士保罗·爱弗盖蒂诺斯（Павел Эвергетинос）于十一世纪编纂而成，并以他的名字命名。该书在十八世纪由圣山神圣尼科季姆（Никодим Святогорец）修订并增补。——编者注。
  '[12]':
    ru: Греческая поговорка, означающая «некуда деваться». –Ред.
    cn: 希腊谚语，意为「无处可去」。——编注。
  '[13]':
    ru: "В Греческой Церкви устроение монашеской жизни имеет несколько разновидностей. \nОбщежительные монастыри (греч.κοινόβιο) представляют собой монашеские общины, подчиняющиеся власти епархиального архиерея и владеющие каким-то участком земли. Братия общежительного монастыря по уставу не имеют права иметь частную собственность и обязаны во всем беспрекословно подчиняться игумену, которого сами избирают. \nИсихастирий (греч.ήσυχαστήριο, что буквально означает «место безмолвия») – обычно общежительный монастырь, построенный каким-либо частным владельцем на своей земле и в силу этого имеющий почти полную независимость от власти епархиального архиерея и большую свободу в своей внутренней жизни. На Святой Горе исихастириями называют маленькие каливы с храмом или без него. \nКеллиями (греч.κελί) на Святой Горе называются отдельные дома, обычно с храмом, расположенные на земле какого-то монастыря и являющиеся собственностью этого монастыря. Келлия передается в пожизненное пользование какому-то монаху. Этот монах подчиняется игумену монастыря, которому принадлежит келлия, и имеет право по его благословению собирать к себе братию, настоятелем и духовным наставником которой он пожизненно является. После своей смерти старец, которому передана келлия, может завещать ее одному из своих учеников, который занимает его место. Келлии могут быть большими, и численность братии в них может доходить до 20 человек.\n Каливы (греч.καλύβη) на Святой Горе – маленькие хижины, которые отличаются от келлий тем, что в них живут обычно один или два отшельника (иногда больше) в уединении. \nКеллии и каливы, находящиеся в одной местности, могут объединяться в особые монашеские общины – скиты (греч.σκήτη). Скиты имеют большой соборный храм, куда все братия скита собираются в субботние, воскресные и праздничные дни. Для решения общих вопросов, касающихся скитян, главным образом для приема паломниковиосуществления связисвнешним миром, братией избирается дикей (греч.δικατος) сроком на 1 год. –Ред."
    cn: '在希腊教会中，修道生活的安排有几种类型。


      共住制修道院（希腊语：κοινόβιο）是修道团体，它们隶属于教区主教的权柄，并拥有一片土地。共住制修道院的修士们按照规章不得拥有私产，必须在所有事情上毫无异议地服从由他们自己选举产生的院长（伊古门）。


      希沙斯提里翁（希腊语：ήσυχαστήριο，字面意思是「静默之地」）通常是共住制修道院，由某个私人所有者在其土地上建造，因此，它几乎完全独立于教区主教的权柄，并在其内部生活中有更大的自由。在圣山上，希沙斯提里翁指的是带有或不带有教堂的小型卡利维。


      圣山上的凯利亚（希腊语：κελί）指的是独立的房屋，通常带有教堂，坐落于某个修道院的土地上，并且是该修道院的财产。凯利亚被终身转交给某一位修士使用。这位修士服从凯利亚所属修道院的院长，并有权在他的祝福下聚集修士，他终身是这个团体的长老和属灵导师。这位获得凯利亚的司提（长老）去世后，他可以将其遗赠给一位门徒来继承他的位置。凯利亚可以很大，其中的修士人数可达20人。


      圣山上的卡利维（希腊语：καλύβη）是小型的茅屋，它们与凯利亚的区别在于，其中通常只有一两位隐士（有时更多）独自隐居。


      位于同一区域的凯利亚和卡利维可以结合成特殊的修道团体——斯基提（希腊语：σκήτη）。斯基提有一个大型的主座教堂，斯基提的所有修士会在周六、周日和节日聚集于此。为了解决与斯基提修士相关的共同问题，主要是接待朝圣者以及实现与外界的联系，修士们会选举一位迪凯奥斯（希腊语：δικατος），任期一年。——编者注'
  '[14]':
    ru: Небольшие деревья с кожистыми вечнозелеными листьями, белыми или розовыми цветами и сладкими красными плодами. Растут обычно во влажных местах. –Ред.
    cn: 带有革质常绿叶子、白色或粉色花朵和甜美红色果实的小树。通常生长在潮湿之地。–编者注。
  '[15]':
    ru: Диоклетиан (284–305) – языческий император, при котором были самые жестокие гонения на христиан, во время которых прославилось множество мучеников. –Прим. пер.
    cn: 戴克里先（284–305）——一位异教皇帝，在他治下发生了对基督徒最残酷的迫害，在此期间涌现了许多光荣的殉道者。——译者注
  '[16]':
    ru: Илий –ветхозаветный первосвященник, попускавший своим сыновьям творить беззакония и этим возбудивший гнев Божий против себя и всего израильского народа израильского (см.:1Цар. 2). –Ред.
    cn: 以利——旧约时代的大祭司，他纵容自己的儿子们行不法之事，因此激起了神对自身以及对整个以色列民族的愤怒（见：撒母耳记上 2）。——编者注
  '[17]':
    ru: Стасидия – высокое кресло с небольшим откидным сиденьем, в котором можно и сидеть и стоять. Стасидии устанавливаются в храмах вдоль стен. –Ред.
    cn: 唱诗台座椅（Стасидия）——这是一种高背靠椅，带有一个小的可折叠座板，可以坐下也可以站立。唱诗台座椅安装在圣堂内沿墙的位置。——编注
  '[18]':
    ru: Вероятно, старец подразумевает под этим все, чем человек привык пользоваться в миру, мирские удобства. –Ред.
    cn: 很可能，这位长老指的就是世人习惯使用的所有事物，即属世的便利。——编者
  '[19]':
    ru: То есть посетителей монастыря. –Ред.
    cn: 也就是说，指修道院的访客。——编者注。
  '[20]':
    ru: 'Ср.: Канон во святую неделю Пасхи, песнь 7-я.'
    cn: 参：圣逾越节周卡农，第七首颂歌。
  '[21]':
    ru: 'См.: Канон во святую неделю Пасхи, песнь 1-я.'
    cn: 见： 圣复活周颂歌，第一歌。
  '[22]':
    ru: См. там же.
    cn: 见同上。
  '[23]':
    ru: Духовные обязанности монаха – молитва, чтение Священного Писания. –Ред.
    cn: 修士的属灵责任——祷告，阅读圣经。（编者注）
  '[24]':
    ru: Книга преподобного Иоанна «Лествица» написана по-древнегречески. Старец Паисий предлагает греческому читателю пользоваться подлинным текстом этого творения, а не переводом его на новогреческий язык.–Ред.
    cn: 尊者约翰的著作《天国阶梯》是以古希腊语写成的。长老帕伊西奥斯建议希腊读者使用此著作的原本，而非其新希腊语译本。——编者注。
  '[25]':
    ru: Четвертому тому греческого «Добротолюбия» соответствует в русском переводе том пятый. –Ред.
    cn: 在希腊语《爱善集》中，第四卷对应于俄语译本的第五卷。–编注
  '[26]':
    ru: 'В Греции среднее образование имеет три ступени: начальная школа (народная), гимназия и лицей. В университет имеет право поступать только тот, кто закончил лицей. Старец Паисий проводит параллель между этими ступенями образования и совершенствованием в духовной жизни. –Прим. пер.'
    cn: 在希腊，中等教育分为三个阶段：初级学校（国民学校）、文理中学（高中低年级，gymnasia）和高级中学（高中高年级，lyceum）。只有完成高级中学学业的人才有资格进入大学。帕伊西奥斯长老将这几个教育阶段与属灵生命中的精进（或译：成圣）进行对比。——译者注
  '[27]':
    ru: Старец употребляет здесь идиоматическое выражение новогреческого языка «великая мысль о себе самом», имеющее значение «великое самомнение». –Ред.
    cn: 长者在此使用了一个现代希腊语的习语，「对自身持有的伟大思想」（«великая мысль о себе самом»），意为「巨大的自负」。——编者注。
  '[28]':
    ru: То есть причина в другом. –Ред.
    cn: 也就是说，原因在于其他方面。–编者注
  '[29]':
    ru: 'Здесь – игра слов: идиоматическое выражение новогреческого языка «поджаривать на сковороде» означает «мучить». –Ред.'
    cn: 此处有文字游戏：新希腊语中的习语「在平底锅上煎炸」意为「折磨」。—编者注。
  '[30]':
    ru: Здесь имеются в виду листья горчицы, имеющие острый пряный вкус и употребляемые в пищу обычно в виде салата. –Ред.
    cn: 此处指的是芥菜叶，其味道辛辣，通常以沙拉的形式被食用。–编者注。
  '[31]':
    ru: Отваренные листья одуванчика и мака употребляются в Греции в пищу – в салатах и др. –Ред.
    cn: 煮过的蒲公英和罂粟叶在希腊被用作食物——用于沙拉等菜肴中。——编者
  '[32]':
    ru: имеется в виду не византийское, а обычное мирское время –Ред.
    cn: 意指的并非拜占庭时间，而是普通的世俗时间。——编注
  '[33]':
    ru: Так называются в аскетической святоотеческой литературе подвижники-исихасты, главным занятием которых было умное делание, трезвение, внимание к помыслам. –Ред.
    cn: 在苦修的教父文献中，那些主要任务是实行心祷、警醒和关注意念的苦行者——默观者（ Hesychasts）——被如此称呼。——编者注
  '[34]':
    ru: 'Старец заканчивает письмо начальными словами тропаря Спасителю: «Единородный Сыне и Слове Божий, бессмертен сый и изволивый спасения нашего ради воплотитися от Святыя Богородицы и Приснодевы Марии, непреложно вочеловечивыйся, распныйся же, Христе Боже, смертию смерть поправый, един сый Святыя Троицы, спрославляемый Отцу и Святому Духу, спаси нас». –Ред.'
    cn: 这位长老以救主颂歌的起头几句话结束了他的信件：「你的独生圣子，圣言上帝，本是无死者，却为了我们的拯救，愿意从圣哉上帝之母、常贞女马利亚取肉身，不变地成为人，并被钉在十字架上，基督上帝啊，以死亡践踏了死亡，你是三位一体中的一位，与父和圣灵同受荣耀，求你拯救我们。」——编者按
  '[35]':
    ru: Обычная в Греции форма поздравления с праздником, здесь – с праздником Введения во храм Пресвятой Богородицы. –Ред.
    cn: 这是希腊常见的节日祝贺形式，在此处，是针对至圣上帝之母入圣殿日（即圣母献堂节）的祝贺。——编者注
  '[36]':
    ru: «Слава Тебе, Господи, Слава Тебе, Святый, слава Тебе, Царю, яко дал еси нам брашно и веселие. Исполни нас и Духа Святаго, да обрящемся перед Тобою благоугодни и непостыдни, егда воздаси комуждо по делом его». Это молитва в Греции читается после вечерней трапезы. Предпосылая ее письму, старец, как можно догадываться, благодарит Бога за дарованную ему духовную трапезу слова, которую он предлагагает читателям. –Ред.
    cn: 「荣耀归于您，主啊，荣耀归于您，圣者啊，荣耀归于您，君王啊，因您赐予我们食粮和欢愉。求您以圣灵充满我们，使我们在您面前蒙悦纳且不蒙羞，当您按各人的行为报应他们之时。」这个祷文在希腊于晚餐后诵读。可推断，长老在信函之首引用此祷文，是为了感谢上帝赐予他属灵的言语筵席，并将其献给读者们。（编者注）
  '[37]':
    ru: 'Старец имеет в виду: заботиться о спасении своей души. –Греч. ред.'
    cn: 长老指的是：要关心自己灵魂的得救。（希腊语版本）
  '[38]':
    ru: То есть через монашеский постриг. –Прим. пер.
    cn: 亦即通过修道祝发。——译者注
  '[39]':
    ru: То есть неискусными монахами. –Ред.
    cn: 亦即，缺乏经验的修士们。——编者注
  '[40]':
    ru: Карайоз – главный герой греческого народного театра теней, шут. –Прим. пер.
    cn: 卡拉吉奥兹——希腊民间皮影戏的主角，一个丑角。——译者注。
  '[41]':
    ru: Канонарх – управляющий пением хора. Здесь имеется в виду «князь мира сего». –Ред.
    cn: 诵读员（Канонарх）——诗班歌唱的指挥者。在此指的是「这世界的王」。——编者注。
  '[42]':
    ru: То есть с диаволом. –Прим. пер.
    cn: 即：与魔鬼同在。——译注。
  '[43]':
    ru: То есть старцу. –Ред.
    cn: 亦即指长老。——编注
  '[44]':
    ru: 'Здесь игра слов: «благоговение, стеснительность» (греч.συστολή) означает также «стеснение, сжатие». –Ред.'
    cn: 这里是一个双关语：「敬畏，羞怯」（希腊文 $\sigma\upsilon\sigma\tau o\lambda\eta$）同时也意味着「约束，收缩」。—编注
  '[45]':
    ru: То есть человеку, созданному по образу Божию. –Ред.
    cn: 也就是说，对于那按照上帝的形象所造的人。——编者注
  '[46]':
    ru: То есть множество грехов. –Ред.
    cn: 即是，诸般罪孽。——编注
  '[47]':
    ru: Игра слов. Старец употребил здесь идиоматическое выражение, означающее «устраивать головомойку». –Ред.
    cn: 语意双关。此处，这位长老使用了意指「进行严厉斥责」的习语。–编者注
  '[48]':
    ru: Слово «монах» происходит от греческого словаμόνος– «один», «одинокий». –Прим. пер.
    cn: 词语「修士」（монах）源自希腊词汇 μόνος，意为「一个」，「独一的」或「孤独的」。（译者注）
  '[49]':
    ru: 'В Греции принимающие милостыню обычно говорят: «Да получат прощение твои усопшие», молясь таким образом о почивших сродниках дающего. –Ред.'
    cn: 在希腊，领受施舍的人通常会说：「愿你已故的亲人获得赦免」，以此方式为施予者已安息的亲属祷告。——编注。
  '[50]':
    ru: Благословениями здесь называются различные вещи,продукты, одежда и т.д. –Ред.
    cn: 【编者注】这里的「祝福」（благословениями）指的是各种物品、产品、衣物等。
  '[51]':
    ru: Здесь идет речь об отшельниках, для которых главным источником пропитания служит выполняемое ими рукоделие. –Ред.
    cn: 这里提到的是隐修士，他们主要的生计来源是自己所做的手工。——编者注
  '[52]':
    ru: Славянское название поклонов, происходящее от греческогоμετάνοια, что означает «покаяние», а также «поклон». –Прим. пер.
    cn: 斯拉夫语中称呼「俯伏礼」或「大拜」（поклонов）的名称，源自希腊语 μετάνοια，意为「忏悔」，亦意为「俯伏」。–译者注。
  '[53]':
    ru: 'Здесь игра слов: в греческом тексте употреблено идиоматическое выражение «потерянная вещь», означающее «ничтожная, никчемная вещь». –Ред.'
    cn: 此处有双关语：在希腊语文本中，使用了习语表达「失去之物」（потерянная вещь），意指「微不足道、毫无价值之物」（ничтожная, никчемная вещь）。——编注
  '[54]':
    ru: То есть быстро преуспевать духовно. –Ред.
    cn: 亦即灵性上迅速精进。——编者注。
  '[55]':
    ru: Исихастами на Афоне сейчас называются монахи, живущие по определенному строгому уставу. Это, как правило, отшельники. –Прим. пер.
    cn: 现今在阿索斯山上，隐修士（hesychasts）一词专指那些遵循特定严格规章的修士。他们通常是苦修者（hermits）。——译者注
  '[56]':
    ru: Старец употребляет здесь словоέπωτας, которое обычно имеет значение сильного плотского влечения, любовной страсти. Однако многие святые отцы, например святителиИоанн Златоуст,Григорий Нисский,Григорий Палама, использовали это слово в значении самозабвенной, всепоглощающей любви человека к Богу.– Прим. пер.
    cn: 这位长老在此处使用了「eros」（ἔρως）一词，该词通常指强烈的肉体吸引力或爱恋的激情。然而，许多圣教父，例如圣师约翰·金口、尼萨的格里戈里、格里戈里·帕拉马斯，都使用此词来指代人对上帝那种忘我、全然投入的爱。（译者注）
  '[57]':
    ru: Игра слов. Употребленное здесь греческое словоάκροимеет значения «крайность» и «конец», «край». –Ред.
    cn: 双关。此处使用的希腊词 $\acute{\alpha}\kappa\rho\mathrm{o}$ 具有「极端」以及「终结」、「边缘」的含义。— 编者注。
  '[58]':
    ru: Игра слов. Здесь употреблено идиоматическое выражение, означающее буквально «не найдешь конца». –Ред.
    cn: 字面游戏。这里使用了一个习语，字面意思是「找不到尽头」。——编者注。
  '[59]':
    ru: То есть его скрытые греховные страсти проявляются внешне в его поведении. –Ред.
    cn: 也就是说，他隐藏的罪性情欲在他外在的行为中显露出来。——编者注
  '[60]':
    ru: 'Игра слов: употребленное здесь слово «чесотка» имеет в греческом языке также значение «гордец». То есть, по мысли старца, человек, не осознающий своей греховности, страдает от гордости и самомнения. –Прим. пер.'
    cn: 双关语：此处所用的词「чесотка」（意为疥疮）在希腊语中也有「骄傲者」的含义。也就是说，在这位长老看来，一个不察觉自身罪性的人，是在受苦于骄傲和自负。–译者注
  '[61]':
    ru: То есть оно очень велико, хотя мало заметно, ибо не имеет сильных внешних проявлений в греховных поступках, как незаметно для смотрящего на гору с передней стороны происходящее с задней ее стороны. –Ред.
    cn: 也就是说，它非常巨大，尽管不明显，因为它在罪恶的行为中没有强烈的外部表现，就像观察者从山的前方看不见后方发生的事情一样。–编者注
  '[62]':
    ru: Эти морские животные в Греции употребляются в пищу. Под чернилами имеется в виду темная краска, которую они вырабатывают с помощью особых желез и выпускают, когда им угрожает опасность. –Ред.
    cn: 这些海洋动物在希腊被用作食物。这里的「墨汁」指的是它们通过特殊腺体分泌并于遭遇危险时释放出的一种黑色染料。——编者
  '[63]':
    ru: 'Здесь игра слов: старец использует в этом месте греческое идиоматическое выражение «голова набирает воздух», которое имеет смысл «высоко думать о себе», «гордиться». –Ред.'
    cn: 此处运用了双关语：这位长老（старец）在这个地方使用了希腊语的习语「脑袋吸进了空气」（голова набирает воздух），其含义是「对自身评价过高」「骄傲自大」。——编者注
  '[64]':
    ru: Вероятно, старец имеет здесь в виду, что для избавления от беса человеку нужно совершенно изменить состояние своей души, и только тогда она из жилища нечистого духа превратится в жилище благодати Божией. –Ред.
    cn: 很可能这位长老在此处的意思是，人要摆脱那鬼魔，需要彻底改变自己灵魂的状态，只有这样，灵魂才会从不洁之灵的居所，转变为上帝恩典的居所。–编者注
  '[65]':
    ru: Игра слов. Старец употребляет здесь слово «продавать», которое в греческом языке имеет также значение «выдавать, открывать». –Ред.
    cn: 词语双关。这位长老在此处使用了「卖」（продавать）一词，该词在希腊语中亦有「交付、透露」（выдавать, открывать）之意。——编者注
  '[66]':
    ru: Святыми Страстями в Греции называют Великую пятницу. –Ред.
    cn: 在希腊，人们称「圣受难」为「大斋五日」。——编注
  '[67]':
    ru: 'В греческих монастырях после шестой песни канона на утрене, как правило, читается синаксарий (обычно – краткие жития святых, память которых празднуется в этот день) или, по крайней мере, особые стихи в честь каждого из празднуемых святых. Перед чтением каждого жития произносятся слова: «В тойже день память святаго…», в конце произносится: «Его же молитвами, Христе Боже, помилуй нас». –Прим. пер.'
    cn: 在希腊的修道院里，晨祷中第六首颂歌（Kanon）之后，通常会诵读《日课经》（Synaxarion，通常是庆祝当日圣徒的简短生平），或者至少会诵读为纪念每位所庆祝圣徒的特殊诗句。在诵读每篇圣徒生平前，都会说出这样的话：「就在同一天，纪念圣者……」（В тойже день память святаго…），在结尾则会说出：「借着祂的祷告，基督我们的上帝，怜悯我们。」（Его же молитвами, Христе Боже, помилуй нас。）——译者注
  '[68]':
    ru: 'Здесь игра слов: словоδιακρίνομαι– «выделяться, быть чем-то лучше других» в греческом языке однокоренное со словомδιάκριση) – «рассуждение». –Ред.'
    cn: 在这里有一个词语的妙用：希腊语中的词 διακρίνομαι（意为「突出、比他人更优秀」）与词 διάκριση（意为「明辨力」）是同源词。–编者注。
  '[69]':
    ru: Так часто называют в Греции Святую Гору Афон. –Прим. пер.
    cn: 在希腊，人们常常这样称呼阿索斯圣山。——译者注。
  '[70]':
    ru: 'Старец сравнивает человеческие мысли с соплями. То есть человеческий ум, лишенный божественного просвещения, порождает ничтожные мысли. Здесь также игра слов: идиоматическое выражение «из головы выходит» само по себе имеет в греческом языке значение «голова хорошо работает, голова рождает множество идей». – Ред.'
    cn: 长老将人的思想比作鼻涕。也就是说，缺乏神圣光照的人的心智，所产生的思想是毫无价值的。此处也有一处双关语：在希腊语中，惯用表达「从头脑中出来」（«из головы выходит»）本身具有「头脑运转良好，头脑产生大量想法」的含义。——编者注
  '[71]':
    ru: В греческих монастырях послушники носят рясу. –Ред.
    cn: 在希腊修道院中，见习修士（初学修士）穿着僧袍。——编注。
  '[72]':
    ru: 1 стремма равна 1000 кв.м. –Прим. пер.
    cn: 1 斯特雷马 等于 1000 平方米。 –译者注。
  '[73]':
    ru: В Греции десятибалльная система оценок. –Прим. пер.
    cn: 在希腊，实行的是十分制评分系统。——译者注
  '[74]':
    ru: То есть в него вселился Христос. –Ред.
    cn: 也就是说，基督已居于他内。——编注
  '[75]':
    ru: Здесь игра слов. В данном случае «талант» – это название специальной доски в монастырях, в которую стучат молоточком, созывая на богослужение. –Прим. пер.
    cn: 此处有一个双关语。在这种情况下，「塔兰特」（талант）是修道院中使用的一种特殊木板的名称，人们用小木槌敲击它，以召集大家参加神圣礼拜（ богослужение）。——译者注
  '[76]':
    ru: То есть икону. –Прим. пер.
    cn: 即是指圣像。——译者注
  '[77]':
    ru: Образованное старцем слово «волколет» (λυκόφτερο) в греческом языке созвучно со словом «вертолет» (έλικόπτερο). Изображение диавола в виде волка встречается в Священном Писании (см.:Ин. 10, 7–16) и святоотеческой письменности. –Ред.
    cn: 圣者创造的词语「狼飞者」（λυκόφτερο），在希腊语中与「直升机」（έλικόπτερο）一词发音相似。魔鬼以狼的形象出现，可见于圣经中（参见：约翰福音 10:7-16）以及教父著作中。–编者注。
  '[78]':
    ru: Имеется в виду святой праведный Иосиф, сын праотца Иакова, которому Бог открывал будущее через пророческие сны и который имел дар истолкования снов. См. книгу Бытия. –Ред.
    cn: 指的是圣义人约瑟夫，即列祖雅各布的儿子，上帝藉着预言性的梦向他启示未来，并拥有解梦的恩赐。参见《创世记》。——编者注。
  '[79]':
    ru: 'Здесь игра слов: слово «благодать» (χάρη) в греческом зыке созвучно слову «бумаги» (χαρτιὰ). –Ред.'
    cn: 这里有一个双关语（或：文字游戏）：希腊语中的「恩典」（благодать，χάρη）一词与「纸张」（бумаги，χαρτιὰ）一词发音相近（或：音似）。–编注
  '[80]':
    ru: 'Здесь игра слов: «невещественное» по-гречески звучит как «айлон», а «нейлон» – «найлон». –Прим. пер'
    cn: 这里有个双关：希腊语中，「非物质的」（「невещественное」）发音是「ай隆」（ailon），而「尼龙」（「нейлон」）的发音是「奈隆」（nailon）。——译者注
  '[81]':
    ru: Аспирин – малоэффективное средство от головной боли. –Ред.
    cn: 阿司匹林是治疗头痛效果不佳的药物。–编注
  '[82]':
    ru: Карат – мера содержания золота в сплавах, равная 1/24 массы сплава. Химически чистое золото соответствует 24 каратам. –Ред.
    cn: 克拉（Карат）是衡量合金中含金量的单位，等于合金质量的1/24。化学纯金相当于24克拉。——编注
  '[83]':
    ru: В Греции монашество часто называют покаянием. –Ред.
    cn: 在希腊，修道生活常被称为「悔改」。——编者注
  '[84]':
    ru: Письмо написано старцем на следующий день после празднования в честь святой великомученицы Екатерины. –Ред.
    cn: 此信是长老在纪念圣大殉道者叶卡捷琳娜的节庆的次日所写。——编者注
  '[85]':
    ru: Бузуки – греческий струнный музыкальный инструмент. –Ред.
    cn: 布祖基（Бузуки）是一种希腊的弦乐器。–编者注。
  '[86]':
    ru: Во время строительства Вавилонского столпа Бог смешал языки людей, так что они перестали понимать друг друга и рассеялись по всей земле. (См.Быт. 11). В день Святой Пятидесятницы Дух Святой сошел на апостолов, и они начали говорить на разных языках, чтобы научить все народы единой вере и собрать в единую Церковь. –Ред.
    cn: 在建造巴别塔的时候，上帝变乱了人们的语言，以致他们不再能彼此理解，并分散到世界各地。（参 创世记 11）。在圣五旬节那天，圣灵降临在使徒们身上，他们开始讲起各种语言，以便教导万民信奉独一的信仰，并聚集到独一的教会中。——编者
  '[87]':
    ru: 'Здесь игра слов: выражение «раздуть голову» имеет в греческом языке смысл «вскружить голову», «заставить гордиться». –Ред.'
    cn: 这里有个双关语：在希腊语中，「吹胀头颅」（раздуть голову）这个表达的意思是「冲昏头脑」或「使人骄傲」。——编注
  '[88]':
    ru: 'Здесь игра слов: греческое идиоматическое выражение «пустые орехи» имеет значение «пустая болтовня, вздор». –Ред.'
    cn: 此处有个双关语：希腊语的惯用表达「空核桃」（пустые орехи）意指「空洞的闲谈、废话」（пустая болтовня, вздор）。——编者注
  '[89]':
    ru: Драхма – денежная единица Греции. Здесь в переносном смысле в значении маленького доброго дела, за которое человек получит воздаяние на Страшном Суде. –Прим. пер.
    cn: 德拉克马是希腊的货币单位。在此，是引申义，指一件微小的善行，人将因此在末日审判中获得报偿。——译者注。
  '[90]':
    ru: Эгоизм сравнивается здесь с корнями растущих возле дома деревьев, разрушающими его основание. –Ред.
    cn: 「自我中心」在此被比作生长在房屋附近的树木的根，它们破坏着房屋的根基。——编者
  '[91]':
    ru: 'Здесь игра слов: слово «капитал» (κεφάλαια) в греческом языке однокоренное со словом «голова» (κεφάλι). –Прим. пер.'
    cn: 这里有一个双关语（或文字游戏）：希腊语中的「资本」一词（$\text{κεφάλαια}$）与「头」（$\text{κεφάλι}$）一词是同源的。——译者注
  '[92]':
    ru: См.Символ веры. –Ред.
    cn: 见《信经》。——编者注
  '[93]':
    ru: В Греции миряне иногда носят небольшие четки не для молитвы, а для развлечения или «успокоения нервов». Старец имеет здесь в виду, что враг заставляет человека оставить молитву по четкам. –Ред.
    cn: 在希腊，平信徒有时佩戴小型念珠（数珠），并非为了祈祷，而是为了消遣或「安抚神经」。在此，这位长老指的是，仇敌迫使人放弃使用念珠的祈祷。–编者。
  '[94]':
    ru: См. Первую книгу Царств.
    cn: 参看撒慕尔纪上。
  '[95]':
    ru: Канон молебный ко Пресвятой Богородице, богородичен по каноне. –Ред.
    cn: 恳求颂歌（卡农），致至圣神佑之母；颂歌后的神佑之母颂歌。–编注。
  '[96]':
    ru: См. Символ веры. –Ред.
    cn: 参见《信经》。——编注
  '[97]':
    ru: 'Игра слов: старец употребил здесь идиоматическое выражение «пестрая жизнь», которое в новогреческом языке означает «распушенная, распутная жизнь». –Ред.'
    cn: 语带双关：这位长老在此使用了一个习语表达「斑斓的生活」（пестрая жизнь），而在现代希腊语中，该表达意为「放纵的、淫荡的生活」。——编注
  '[98]':
    ru: 'Здесь игра слов: слово «алкоголь» (οίνόπνευμα) в греческом языке созвучно слову «дух» (πνεύμα). –Прим. пер.'
    cn: 此处存在词语双关：希腊语中，「酒精」（οἰνόπνευμα）一词与「灵」（πνεύμα）一词发音相近。——译者注
