  '144': . Η Αγία Ισιδώρα έζησε στο Μοναστήρι των Ταβεννησιωτών, το οποίο είχε ιδρύσει ο Όσιος Παχώμιος στις αρχές του 4ου αιώνος. Υποκρινόταν την «διά Χριστόν»σαλή, ταπείνωνε και εξευτέλιζε τον εαυτό της. Φορούσε ένα κουρέλι στο κεφάλι της, ενώ οι άλλες μοναχές φορούσαν κουκούλι. Ποτέ δεν φόρεσε παπούτσια. Αν και πολλές φορές δέχθηκε ύβρεις και χτυπήματα, ποτέ δεν γόγγυσε ούτε ύβρισε κανέναν. Η αγιότητα του βίου της αποκαλύφθηκε με όραμα στον μεγάλο ασκητή Πιτηρούν, ο οποίος επισκέφθηκε το Μοναστήρι και φανέρωσε ενώπιον όλης της Αδελφότητος ότι η Ισιδώρα, την οποία θεωρούσαν σαλή, ήταν Αμμάς, δηλαδή πνευματική μητέρα.
  '145': . Ασκητής των σπηλαίων στην περιοχή της Αγίας Άννης του Αγίου Όρους.
  '146': '. Δευτ. 22, 5: «Ουκ έσται σκεύη ανδρός επί γυναικί, ουδέ μη ενδύσηται ανήρ στολήν γυναικείαν, ότι βδέλυγμα Κυρίω τω Θεώ σου εστι πας ποιών αυτά». Δηλαδή: «Η γυναίκα δεν πρέπει να φοράη ανδρικά ενδύματα ούτε ο άνδρας γυναικεία, γιατί τότε θα είναι πολύ μισητός στον Κύριο».'
