  '76': . Τον Ιούνιο του 1990 είχε πολλές κάμπιες.
  '77': . Στο κεφάλαιο αυτό φαίνεται το αγωνιστικό πνεύμα που είχε ο Γέροντας ως ασκητής και η αγωνία του μήπως αλλοιωθή το ασκητικό πνεύμα του Μοναχισμού. Ο Γέρνοντας δεν είναι ενάντιος του πολιτισμού. Θέλει να τονίση ότι δεν πρέπει να μας κυβερνάη ο πολιτισμός, αλλά να τον κυβερνούμε. Ειδικά ο μοναχός, έλεγε, θα πρέπη να κυριαρχή στα σύγχρονα μέσα και να τα χρησιμοποιή με διάκριση, για να μπορή να διοχετεύη τις δυνάμεις του στον πνευματικό αγώνα.
  '78': . 1962–1964
  '79': . Το Σινά, που τώρα ανήκει στην Αίγυπτο, τότε άνηκε στο Ισραήλ.
  '80': . Ο Άγιος Αρσένιος ο Μέγας (354) καταγόταν από την Ρώμη. Ήταν μέγας κατά την σοφία και την αρετή. Ονομαζόταν «πατήρ Βασιλέων», γιατί ο αυτοκράτορας Θεοδόσιος του ανέθεσε την μόρφωση των δύο παιδιών του. Το 394 μετά από θεία πληροφορία αναχωρεί για την έρημό της Αιγύπτου. Αν και είχε ζήσει στα ανάκτορα, διακρίθηκε ως μοναχός για την μεγάλη αυστηρότητα και την σκληραγωγία του.
  '81': . Ο Γέροντας, όταν αναφέρεται στους Ευρωπαίους και στην Δύση, δεν υποτιμά τους λαούς αυτούς, αλλά θέλει να χτυπήση το ορθολογιστικό και αθεϊστικό πνεύμα.
  '82': . Τον Νοέμβριο του 1990
  '83': . Εννοεί το απορρυπαντικό «ΚΛΙΝ».
  '84': . Στα παλιά μηχανοστάσια «τρελλή ρόδα» ονόμαζαν την ρόδα που δεν παρήγε έργο, αλλά την χρησιμοποιούσαν απλώς για να περνούν το λουρί του τροχού, όταν ήθελαν να τον απενεργοποιήσουν.
  '85': .Ψαλμ.89, 10
  '86': . Ο Γέροντας μοίραζε τα πράγματα που του πήγαιναν σε άλλους μοναχούς που είχαν ανάγκη.
  '87': . Η βασίλισσα Μάρω (1418–1487) ήταν κόρη του ηγεμόνα της Σερβίας Γεωργίου Μπράνκοβιτς (1375–1456), ο οποίος είναι ο δεύτερος κτίτορας της Ιεράς Μονής του Αγίου Παύλου Αγίου Όρους. Η Μάρω παντρεύθηκε τον Σουλτάνο Μουράτ, πατέρα του Μωάμεθ του Πορθητού, και χάρισε στην Μονή του Αγίου Παύλου τα Τίμια Δώρα, πολλά άγια Λείψανα και ιερά κειμήλια. Στην Ιερά Μονή Αγίου Παύλου σώζεται το πρωτότυπό της διαθήκης της, με την οποία αφήνει σ́ αυτήν την Μονή όλα τα κινητά πολύτιμα αντικείμενα που είχε.
  '88': . Ένα από τα είκοσι Μοναστήρια του Αγίου Όρους.
  '89': . Ο Όσιος Παχώμιος γεννήθηκε στην Άνω Θηβαΐδα της Αιγύπτου γύρω στο 280. Μετά την απόλυσή του από τον στρατό ασκήτεψε σε έναν εγκαταλελειμμένο ειδωλολατρικό ναό. Το 320 περίπου, μετά από θεϊκή οπτασία, ίδρυσε το πρώτο Μοναστήρι των Ταβεννησιωτών στην Άνω Θηβαΐδα. Ίδρυσε συνολικά εννέα ανδρικά Μοναστήρια και δύο γυναικεία. Κοιμήθηκε το 346. Είναι ο θεμελιωτής της κοινοβιακής ζωής στην Αίγυπτο.
  '90': . Ειπώθηκε το 1986.
