  '7': . Η προσωνυμία «Μακκαβαίος» δόθηκε στον Ιούδα, ηγέτη της Ιουδαϊκής επαναστάσεως (166 π.Χ.), η οποία έγινε κατά του Αντιόχου Δ' του Επιφανούς, ηγεμόνος του βασιλείου των Σελευκιδών. Σημαίνει – κατά την πιθανώτερη άποψη – αυτόν που σφυροκόπησε τους εχθρούς. Το ίδιο επίθετο δόθηκε στην συνέχεια και στους διαδόχους του Ιούδα. Οι Μακκαβαίοι διακρίθηκαν για τός αγώνες υπέρ της πατρώας πίστεως και της πολιτικής ελευθερίας. (Βλ. Στα βιβλία της Παλαιάς Διαθήκης Α', Β' και Γ' Μακκαβαίων).
