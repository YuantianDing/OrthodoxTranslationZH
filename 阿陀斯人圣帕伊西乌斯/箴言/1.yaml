- type: h1
  initial:
    ru: ''
  text:
    ru: Слова. Том 1. С болью и любовьюΛόγοι Α' – Με πόνο και αγάπη
- type: h2
  initial:
    ru: ''
  text:
    ru: Βιογραφικό Σημείωμα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο μακαριστός Γέροντας Παΐσιος, κατά κόσμον Αρσένιος Εζνεπίδης, γεννήθηκε στα Φάρασα της Καππαδοκίας στις 25–7-1924. Ήρθε στην Ελλάδα με την Ανταλλαγή και μεγάλωσε στην Κόνιτσα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Από την παιδική του ηλικία ζούσε ασκητικά, εντρύφημα είχε τους βίους των Αγίων, τα παλαίσματα των οποίων αγωνιζόταν να μιμήται με ζήλο υπέρμετρο και ακρίβεια θαυμαστή. Επιδιδόταν στην αδιάλειπτη προσευχή, καλλιεργώντας παράλληλα την ταπείνωση και την αγάπη. Έμαθε την τέχνη του μαραγκού, για να μιμηθή και σ́ αυτό τον Χριστό. Στον στρατό υπηρέτησε κατά τον ανταρτοπόλεμο τριάμισι χρόνια ως ασυρματιστής, ζώντας και εκεί ασκητικά. στις επιχειρήσεις διακρίθηκε για την παλληκαριά, την αυτοθυσία, το ήθος και τα χαρίσματά του. αφού εκπλήρωσε το χρέος του προς την Πατρίδα, ακολούθησε την μοναχική ζωή, την οποία από μικρός επιθυμούσε. Από λαϊκός είχε θείες εμπειρίες, αλλά στην μοναχική του ζωή η εύνοια του Κυρίου, της Θεοτόκου και των Αγίων κορυφώθηκε. Ασκήτεψε στο Άγιον Όρος, στην Ι. Μονή Στομίου Κονίτσης και στο Σινά. Έζησε στην αφάνεια, δόθηκε ολόκληρος στον Θεό και ο Θεός τον φανέρωσε και τον έδωσε σε όλον τον κόσμο. Καθοδήγησε, παρηγόρησε, θεράπευσε, ανέπαυσε τα πλήθη των ανθρώπων που έτρεχαν κοντά του. Η αγιασμένη του ψυχή ξεχείλιζε από θεϊκή αγάπη και η οσιακή του μορφή ακτινοβολούσε την θεία Χάρη. Όλη την ημέρα ακούραστος μάζευε τον ανθρώπινο πόνο και σκορπούσε θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ύστερα από μαρτυρικούς πόνους οι οποίοι, όπως έλεγε, τον ωφέλησαν όσο δεν τον ωφέλησαν οι ασκητικοί αγώνες όλης της ζωής του, αναπαύθηκε εν Κυρίω στις 12–7-1994 στο Ιερό Ησυχαστήριο του Αγίου Ιωάννου του Θεολόγου στην Σουρωτή Θεσσαλονίκης. Ενταφιάσθηκε εκεί δίπλα στον Ναό του Αγίου Αρσενίου του Καππαδόκου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Την ευχή του να έχουμε. Αμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρόλογος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο μακαριστός Γέροντας Παΐσιος, τον Ιούλιο του 1994, άφηνε στον κόσμο με την κοίμησή του μία πνευματική κληρονομιά, την διδασκαλία του. Απλός μοναχός, με τα λίγα γράμματα του Δημοτικού Σχολείου, αλλά με πλούσια την κατά Θεόν σοφία, είχε κενώσει τον εαυτό του για τον πλησίον. Η διδασκαλία του δεν ήταν διδαχή ή κατήχηση. Το Ευαγγέλιο το είχε κάνει βίωμά του και η διδασκαλία του πήγαζε από την ζωή του, που χαρακτηριστικό γνώρισμά της είχε την αγάπη. Είχε μορφώσει «εαυτόν» κατά το Ευαγγέλιο, γι' αυτό πρώτα δίδασκε η μορφή του και ύστερα η ευαγγελική αγάπη και ο φωτισμένος λόγος του. Όταν δεχόταν τους ανθρώπους, με όλες τις ιδιαιτερότητές τους, δεν άκουγε απλώς υπομονετικά τα προβλήματα που του εμπιστεύονταν, αλλά με την αγία του απλότητα και διάκριση έμπαινε βαθιά στην καρδιά τους και έκανε δικό του τον πόνο, την ανησυχία, το πρόβλημά τους. Και τότε σιγά-σιγά  γινόταν το θαύμα, η αλλαγή του ανθρώπου. «Ο Θεός, έλεγε, κάνει το θαύμα, όταν συμμετέχει κανείς με την καρδιά του στον πόνο του άλλου».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με χαρά είδαμε τα πρώτα βιβλία που κυκλοφόρησαν για την ζωή και την διδασκαλία του Γέροντα να διαβάζωνται με ενδιαφέρον. Πολλοί μιλούσαν με θαυμασμό για τις απαντήσεις που εύρισκαν στα ερωτήματά τους, την παρηγοριά στις θλίψεις τους. Ιδιαίτερα χαιρόμασταν, όταν άνθρωποι απομακρυσμένοι από την Εκκλησία αποκτούσαν την καλή ανησυχία και άλλαζαν ζωή. Πολλές φορές ήρθαν στα χείλη μας οι στίχοι του υμνογράφου, που αναφέρονται στον Μ. Βασίλειο: «Ζή και θανών εν Κυρίω, ζη και παρ'' ημίν, ως λαλών εκ των βίβλων». Συγχρόνως νιώσαμε μία ανάγκη: Τα λόγια του Γέροντα, που με ευλάβεια καταγράφαμε από τα πρώτα βήματα της Αδελφότητος, γιατί μας ήταν πολύ ωφέλιμα, να τα προσφέρουμε στους εν Χριστώ αδελφούς, που μας ζητούσαν επίμονα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός οικονόμησε ώστε το Ησυχαστήριό μας να οφείλη την ύπαρξή του στον Γέροντα Παΐσιο. Εκείνος έλαβε από τον Σεβασμιώτατο Μητροπολίτη Κασσανδρείας κ.κ. Συνέσιο την επισκοπική έγκριση για την ίδρυσή του και φρόντισε για την εύρεση του τόπου. Και το έκανε αυτό, γιατί η αρχοντική και ευαίσθητη καρδιά του ενίωθε μεγάλη ευγνωμοσύνη για την συμπαράστασή μας, όταν τον πρωτογνωρίσαμε το 1966 στο νοσοκομείο, όπου είχε εισαχθή, για να υποστή εγχείρηση στους πνεύμονες. Από τότε αισθάνθηκε ότι ήταν μεγάλος αδελφός μας και είχε την υποχρέωση «νά αποκαταστήση τις αδελφές τού», όπως έλεγε, εννοώντας να ιδρύση το Ησυχαστήριο. Τον Οκτώβριο του 1967 εγκαταστάθηκαν οι πρώτες αδελφές. Τότε ο Γέροντας Παΐσιος έμεινε δύο μήνες στο Ησυχαστήριο, για να βοηθήση στην οργάνωση του Κοινοβίου. Στην συνέχεια έβγαινε από το Άγιον Όρος συνήθως δυο φορές τον χρόνο και βοηθούσε στην λειτουργία του Κοινοβίου, καθώς και την κάθε αδελφή στον πνευματικό της αγώνα με τις θεοφώτιστες συμβουλές και την προσωπική του πείρα. Από το Όρος πάλι, «τήν πνευματική Αμερική», όπως το ονόμαζε, βοηθούσε με την προσευχή και τις επιστολές που έστελνε είτε προσωπικά στην κάθε αδελφή είτε σε όλο το Κοινόβιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν το 1967 ο Γέροντας Παΐσιος άρχισε να θέτη στο Ησυχαστήριο τα θεμέλια της κοινοβιακής ζωής, από τα πιο απλά πρακτικά θέματα ως τα πιο σοβαρά πνευματικά, ήταν 43 ετών. Ήταν όμως ήδη άνδρας τέλειος«εις μέτρον ηλικίας του πληρώματος του Χριστού»(Εφ.4:13) και είχε την γεροντική σοφία. Από τις πρώτες μέρες της ζωής του Κοινοβίου ενίωθες ότι τα λόγια του ήταν «ρήματα ζωής αιωνίου» (Ιω. 6:68) και ότι πολλά από αυτά  ήταν αξιώματα για την καθημερινή ζωή. Γί/ αυτό έσπευδες να τα καταγράψης, για να μη λησμονηθούν και να χρησιμοποιούνται ως ασφαλής κανόνας στην μοναχική πολιτεία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και όταν οι σημειώσεις μας συμπλήρωσαν τα πρώτα τετράδια, τις θέσαμε δειλά-δειλά υπό την κρίση του. Δειλά, γιατί ο Γέροντας τόνιζε πάντοτε την εφαρμογή, δεν ήθελε να μαζεύουμε υλικό, «πυρομαχικά», χωρίς να κάνουμε πράξη τα λόγια του στην ζωή μας. Ζητούσε αυτό που ακούγαμε ή διαβάζαμε να το δουλεύουμε πνευματικά. Διαφορετικά, καθώς έλεγε, σε τίποτε δεν θα μας ωφελούσαν τα πολλά γραπτά και οι πολλές σημειώσεις, όπως σε τίποτε δεν ωφελεί ένα κράτος, αν έχη πολλά πυρομαχικά και δεν έχη στρατό εκπαιδευμένο, για να τα χρησιμοποιήση. Συγκαταβαίνοντας στις επίμονες παρακλήσεις μας, δέχθηκε να τα δη και να τα συμπληρώση ή να διορθώση σημεία που τυχόν δεν είχαν κατανοηθή πλήρως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η καταγραφή αυτή συνεχίσθηκε σε όλη την διάρκεια των είκοσι οκτώ ετών που ο Γέροντας παρακολουθούσε και καθοδηγούσε το Ησυχαστήριο. Καταγράφονταν οι Συνάξεις της Αδελφότητος και της Γεροντίας που γίνονταν με τον Γέροντα – αρχικά με σημειώσεις που κρατούσαν οι αδελφές στην διάρκεια των Συνάξεων και τα τελευταία χρόνια με μαγνητοφώνηση – αλλά και οι κατ'' ιδίαν συζητήσεις των αδελφών με τον Γέροντα, τις οποίες κατέγραφε κάθε αδελφή αμέσως μετά την συνομιλία μαζί του. Όταν κάποτε αυτό έπεσε στην αντίληψη του Γέροντα, είπε κάπως θυμωμένος: «Τί τα γράφετε όλα αυτά; Για ώρα ανάγκης τα κρατάτε; Σκοπός είναι να τα δουλεύετε, να τα εφαρμόζετε. Και ποιός ξέρει τί γράφετε! Για φέρτε μου να δώ!». Όταν του δόθηκαν ενδεικτικά οι σημειώσεις μίας αδελφής, η έκφρασή του άλλαξε, αναπαύθηκε και με ικανοποίηση είπε: «Πώ, πώ, βρέ παιδί μου, αυτή μαγνητόφωνο είναι! Τα έγραψε ακριβώς όπως τα είπα!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η επικοινωνία μας με τον Γέροντα είχε συνήθως την μορφή απαντήσεων σε ερωτήματά μας. στις κατ'' ιδίαν συζητήσεις των αδελφών μαζί του πάντα υπήρχαν ερωτήσεις κυρίως για τον προσωπικό αγώνα. στις Συνάξεις της Γεροντίας, οι οποίες ήταν προγραμματισμένες, συζητιούνταν θέματα που μας απασχολούσαν κατά την απουσία του. Αυτά  συγκεντρώνονταν υπό μορφή ερωτήσεων, για να συζητηθούν, όταν θα ερχόταν. Ήταν θέματα πάσης φύσεως: διοικητικά, πρακτικά, πνευματικά, κοινωνικά, εκκλησιαστικά, εθνικά κ.α. στις Συνάξεις τέλος της Αδελφότητος, εκτός από τις ερωτήσεις που έκαναν αδελφές, αφορμή για τα διάφορα θέματα στα οποία αναφερόταν, μπορεί να ήταν και απλά ερεθίσματα. Ο Γέροντας αξιοποιούσε τα πάντα για την πνευματική ωφέλεια της ψυχής. Ο ήχος ενός αεροπλάνου, ο θόρυβος ενός μηχανήματος, το κελαήδισμα ενός πουλιού, το άνοιγμα μίας πόρτας ή μία απλή φράση μπορούσε να αποτελέση αφορμή να μιλάη πολλή ώρα για ένα σοβαρό θέμα. «Όλα τα χρησιμοποιώ, έλεγε, για συγκοινωνία για πάνω, για τον Ουρανό. Όλα αν τα δουλέψη κανείς πνευματικά, ξέρετε τί πνευματικό κέρδος βγάζει και τί πνευματική πείρα αποκτάει;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και όπως «ο Καλός Θεός, καθώς έλεγε χαρακτηριστικά, μας φροντίζει πρώτα για την άλλη ζωή και ύστερα γι' αυτήν», έτσι και εκείνος στόχο του στην επικοινωνία με τον άνθρωπο είχε να τον ετοιμάση για την Βασιλεία των Ουρανών, βοηθώντας τον να γνωρίση το θέλημα του Θεού και να συνδεθή με τον Θεό. Όταν ανέφερε κάτι από την φύση, από την επιστήμη, από την τέχνη ή από την καθημερινή ζωή, δεν τον ενδιέφεραν αυτά  καθ́ αυτά  τα θέματα, αλλά τα χρησιμοποιούσε, για να αφυπνίση τις ψυχές και να τις βοηθήση με παραβολικό τρόπο να συλλάβουν το βαθύτερο νόημα της ζωής και να «γαντζωθούν» από τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Επειδή τον λόγο του τον διέκρινε η λιτότητα, η ετοιμότητα, το πηγαίο χιούμορ, μπορούσε να λέη μεγάλες αλήθειες με απλό και εύθυμο τρόπο. «Εγώ κάνω λιακάδα», έλεγε, και εννοούσε ότι όπως ο ήλιος είναι απαραίτητος, για να ανοίξουν τα λουλούδια, έτσι και η απαλή ποιμαντική προσέγγιση διευκολύνει στο άνοιγμα και την θεραπεία της ψυχής. Φωτισμένη ποιμαντική, που συχνά προετοίμαζε το έδαφος της ψυχής να δεχθή την αυστηρότητα των λόγων του για το απαρέγκλιτό της Ευαγγελικής αλήθειας. Με αυτόν τον τρόπο, ακόμη και ο αυστηρότερος λόγος του έπεφτε σαν ευεργετική δροσιά στην καρδιά του άλλου και την γεωργούσε, για να καρποφορήση πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το υλικό που συγκεντρώθηκε μέσα σ́ αυτά  τα είκοσι οκτώ χρόνια, μαζί με τις επιστολές που έστελνε στο Ησυχαστήριο από το Άγιον Όρος, ταξινομήθηκε μετά την κοίμηση του Γέροντα κατά θέματα, για να είναι εύχρηστο στην καθημερινή ζωή του Κοινοβίου. Παράλληλα ταξινομήθηκαν όλα τα σχετικά με την ζωή του περιστατικά, ακόμη και θεία γεγονότα που είχε ζήσει, στα οποία αναφερόταν όχι περιαυτολογώντας αλλά προσφέροντας τα ως πνευματική ελεημοσύνη. «Δεν σάς τα λέω αυτά, έλεγε, για να μου κολλήσετε παράσημα, για να μου πήτε »μπράβο«. Όταν λέω κάτι ή από τον πόλεμο ή από τον στρατό, αλλά και οτιδήποτε να πώ, ακόμη και ένα αστείο παράδειγμα, δεν τα λέω έτσι, κάτι θέλω να τονίσω, να πιάνετε το βαθύτερο νόημα. Ποτέ δεν λέω άχρηστα πράγματα». Με αυτόν τον τρόπο γινόταν «πνευματικός αιμοδότης», για να ενισχύση την αναιμική πίστη, να κεντρίση το φιλότιμο και να καλλιεργήση, ως πραγματικό αρχοντόπουλο του Θεού εκείνος, την πνευματική αρχοντιά, ώστε να συγγενέψουμε με τον Θεό. «Αδειάζω, αδειάζω, έλεγε, και τί γίνεται; Δηλαδή, για να σάς βοηθήσω, αναγκάζομαι να σάς πω και πράγματα από τον εαυτό μου. Κάνω την μεγαλύτερη σπατάλη, πνευματική σπατάλη! Τουλάχιστον πιάνει τόπο; Κάθε γεγονός, θέλω να πώ, που αναγκάζομαι να αναφέρω, για να σάς βοηθήσω, πώς λ.χ. με βοήθησε η Πρόνοια του Θεού σε κάποια περίσταση, το χάνω. Τουλάχιστον πιάνει τόπο;».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Λαμβάνοντας υπ' όψιν τα δύσκολα χρόνια που περνούμε, αποφασίσαμε να δώσουμε στην δημοσιότητα όλο αυτό το υλικό σε σειρά τόμων αρχίζοντας από θέματα ευρύτερου ενδιαφέροντος. Πολλά είναι θέματα καθημερινά, τα οποία όμως, αν δεν αντιμετωπισθούν σύμφωνα με το Ευαγγέλιο, θα έχουν λυπηρές, αν όχι ολέθριες, συνέπειες και για την παρούσα ζωή αλλά και για την μέλλουσα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτήν την επιλογή ενθάρρυνε και μία σκέψη την οποία είχε από χρόνια ο Γέροντας. Σκεφτόταν να γράψη «ένα βιβλίο που να τους πιάνη όλους, λαϊκούς, μοναχούς και ιερωμένους». Την σκέψη αυτή δεν πρόλαβε να την πραγματοποιήση, αφού όλο του τον χρόνο τον διέθετε στις πονεμένες ψυχές που έφθαναν κάθε μέρα στο Καλύβι του και στις οποίες δινόταν ολόκληρος, παρά τις λιγοστές σωματικές του δυνάμεις. «Τα δικά μου νέα, έγραφε σε κάποιο γράμμα του, είναι, κόσμος πολύς, κουρασμένος, βασανισμένος. Ο μεν κόσμος όλο και αυξάνει με τα προβλήματά του, οι δε δικές μου δυνάμεις οι σωματικές εύχεσθε να μην ελαττώνωνται. Οικονομάω και λίγο τον εαυτό μου, γιατί πρέπει να μπορώ πάντα. Μπορώ δεν μπορώ, πρέπει να μπορώ».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Γέροντας όπως αναφέρθηκε, απαντούσε συνήθως σε ερωτήματα. Γι' αυτό στην σύνθεση των θεμάτων που έγινε από λόγους του σε διάφορες περιστάσεις, κρατήθηκε η διαλογική μορφή. Μέσα στους διαλόγους εντάχθηκαν και αποσπάσματα από τις επιστολές που έστελνε στο Ησυχαστήριο ή παραθέματα από βιβλία που έγραψε ο ίδιος, καθώς και ό,τι συμφωνούσε θεματικά από τις επιστολές, που μας εμπιστεύθηκαν εν Χριστώ αδελφοί, ή τις σημειώσεις, τις οποίες είχαν κρατήσει κατά τις συζητήσεις τους με τον Γέροντα, ώστε να δοθή το κάθε θέμα με την περισσότερη δυνατή πληρότητα. Καταβλήθηκε προσπάθεια να διατηρηθή, κατά το δυνατόν, η αμεσότητα και η χάρη του προφορικού λόγου του Γέροντα. Παρέμειναν επίσης και κάποιες επαναλήψεις, που τόνιζαν τα νοήματα και κέντριζαν τις καρδιές, και μερικά από τα συχνά επιφωνήματα κατά την ροή των αφηγήσεων της παλλόμενης καρδιάς του από την μεγάλη αγάπη προς τον Θεό και τον άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι αναφορές στην μοναχική ζωή είναι συχνές. Αυτό συμβαίνει όχι μόνο γιατί ο Γέροντας απευθύνεται σε μοναχές, αλλά γιατί την «χαρά της καλογερικής», που πηγάζει από την ολοκληρωτική ανάθεση της ζωής του μοναχού στον Θεό, ήθελε να την αναζητήση και ο κάθε λαϊκός, για να λυτρωθή από την ανασφάλεια που φέρνει η πίστη στο εγώ και να χαρή τον Παράδεισο από αυτήν την ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το βιβλίο «Με πόνο και αγάπη για τον σύγχρονο ανθρωπο» αποτελεί τον πρώτο τόμο της σειράς «Γέροντος Παϊσίου Αγιορείτου Λόγοι». Για να είναι πιο εύχρηστο το περιεχόμενό του, χωρίσθηκε σε τέσσερις θεματικές ενότητες. Κάθε ενότητα διαιρείται σε κεφάλαια και κάθε κεφάλαιο σε μικρότερα μέρη με τους ανάλογους υποτίτλους. Οι υποσημειώσεις που ερμηνεύουν όρους από την πνευματική και μοναχική ζωή, γνωστούς στους εν Χριστώ αδελφούς που έχουν μία ιδιαίτερη επαφή με πατερικά κείμενα, έγιναν κυρίως για να διευκολύνουν αναγνώστες που δεν είναι εξοικειωμένοι με τέτοια ορολογία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Επειδή ο Γέροντας, όπως αναφέραμε, χρησιμοποιούσε συχνά παραδείγματα από την επιστήμη, την τέχνη κ.λ.π., υπήρχε φόβος να αποδώσουμε κατά την καταγραφή του προφορικού λόγου του λανθασμένα κάποια έκφραση ή κάποιον όρο. Γι' αυτό δώσαμε τα σχετικά κεφάλαια, πριν δημοσιευθούν, να διαβασθούν από εν Χριστώ αδελφούς διαφόρων ειδικοτήτων. Τους ευχαριστούμε, γιατί με ιδιαίτερη ευλάβεια προς τον Γέροντα είδαν αυτά  τα κείμενα και έκαναν διάφορες παρεμβάσεις. Θα είμαστε ευγνώμονες και για οποιαδήποτε άλλη υπόδειξη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ας ευχηθούμε η «πνευματική σπατάλη» που έκανε ο Γέροντας από την πολλή του αγάπη «νά πιάση τόπο» στις απλές και καλοπροαίρετες ψυχές των αναγνωστών και να πλουτισθούν με την σοφία οτυ Θεού «τήν κεκρυμμένην από σοφών και συνετών και αποκεκαλυμμένην νηπίοις» (Βλ.Λουκ.10:21). Αμήν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κυριακή των Αγίων Πάντων 14 Ιουνίου 1998
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Καθηγουμένη του Ιερού Ησυχαστηρίου Φιλοθέη Μοναχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί αι σύν εμοί εν Χριστώ αδελφαί
- type: h2
  initial:
    ru: ''
  text:
    ru: Εισαγωγικά από λόγους του Γέροντα
- type: h2
  initial:
    ru: ''
  text:
    ru: «Τα χρόνια που περνούμε είναι πολύ δύσκολα και πολύ επικίνδυνα, αλλά τελικά θα νικήση ο Χριστός».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο περισσότερος κόσμος της εποχής μας είναι μορφωμένος κοσμικά και τρέχει με την κοσμική μεγάλη ταχύτητα. Επειδή όμως του λείπει ο φόβος του Θεού –«αρχή σοφίας φόβος Κυρίου»[1]–, λείπει το φρένο, και με ταχύτητα, χωρίς φρένο, καταλήγει σε γκρεμό. Οι άνθρωποι είναι πολύ προβληματισμένοι και οι περισσότεροι πολύ ζαλισμένοι. Έχουν χάσει τον προσανατολισμό τους. Σιγά-σιγά  κατευθύνονται προς το να μην μπορούν να ελέγχουν τον εαυτό τους. Αν αυτοί που έρχονται στο Άγιον Όρος είναι τόσο πολύ συγχυσμένοι, τόσο μπερδεμένοι, με τόσο άγχος, σκεφθήτε οι άλλοι που είναι μακριά από τον Θεό, από την Εκκλησία, πώς θα είναι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και βλέπεις σε όλα τα κράτη φουρτούνα, ζάλη μεγάλη! Ο καημένος ο κόσμος –ο Θεός να βάλει το χέρι Του! – βράζει σαν την χύτρα ταχύτητος. Και οι μεγάλοι πώς τα φέρνουν! Μαγειρεύουν-μαγειρεύουν, τα ρίχνουν όλα στην χύτρα ταχύτητος και σφυρίζει τώρα η χύτρα! Θα πεταχθή σε λίγο η βαλβίδα! Είπα σε κάποιον που είχε μία μεγάλη θέση: «Γιατί μερικά πράγματα δεν τα προσέχετε; Τί θα γίνει;». «Πάτερ μου, μου λέει, λίγο χιόνι ήταν πρώτα το κακό, τώρα έχει γίνει ολόκληρη χιονοστιβάδα. Μόνο ένα θαύμα μπορεί να βοηθήση». Αλλά και με τον τρόπο που πηγαίνουν μερικοί να βοηθήσουν την κατάσταση, κάνουν μεγαλύτερη την χιονοστιβάδα του κακού. Αντί να λάβουν ορισμένα μέτρα για την παιδεία κ.λπ., κάνουν χειρότερα. Δεν κοιτάζουν πώς να διαλύσουν αυτήν την χιονοστιβάδα, αλλά την κάνουν μεγαλύτερη. Βλέπεις, το χιονάκι είναι λίγο στην αρχή. Αν κυλήση στον κατήφορο, γίνεται ένας σβώλος. Ο σβώλος, καθώς μαζεύει και άλλο χιόνι, ξύλα, πέτρες κ.λπ., γίνεται σιγά-σιγά  μεγαλύτερος-μεγαλύτερος, και τελικά γίνεται ολόκληρη χιονοστιβάδα. Έτσι και το κακό λίγο-λίγο έχει γίνει πια χιονοστιβάδα και κυλάει, τώρα θέλει βόμβα για να σπάση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αγωνιάτε, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άχ, τί άσπρισαν τα γένια μου πρόωρα; Εγώ πονάω δυο φορές, μία, όταν προβλέπω μία κατάσταση και φωνάζω, για να προλάβουμε ένα κακό που πρόκειται να γίνη, και μία, όταν δεν δίνουν σημασία – ίσως όχι από περιφρόνηση –, και συμβαίνη μετά το κακό και μου ζητούν τότε την συμπαράστασή μου. Τώρα καταλαβαίνω τί τραβούσαν οι Προφήτες. Μεγαλύτεροι Μάρτυρες ήταν οι Προφήτες! Πιό μεγάλοι Μάρτυρες από όλους τους Μάρτυρες, παρ' όλου που δεν πέθαναν όλοι με μαρτυρικό θάνατο. Γιατί οι Μάρτυρες για λίγο υπέφεραν, ενώ οι Προφήτες έβλεπαν μία κατάσταση και υπέφεραν συνέχεια. Φώναζαν-φώναζαν, και οι άλλοι τον χαβά τους. Και όταν έφθανε η ώρα και ερχόταν η οργή του Θεού εξ αιτίας τους, βασανίζονταν και εκείνοι μαζί τους. Τουλάχιστον όμως τότε τόσο έφθανε το μυαλό των ανθρώπων. Άφηναν τον Θεό και προσκυνούσαν τα είδωλα. Σήμερα που καταλαβαίνουν, είναι η μεγαλύτερη ειδωλολατρία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δεν έχουμε συνειδητοποιήσει ότι ο διάβολος βάλθηκε να καταστρέψη τα πλάσματα του Θεού. Έχει κάνει παγοινιά[2], να καταστρέψη τον κόσμο. Λύσσαξε, γιατί άρχισε να μπαίνη στον κόσμο η καλή ανησυχία. Είναι πολύ αγριεμένος, γιατί γνωρίζει ότι είναι λίγη η δράση του[3]. Τώρα κάνει όπως ένας εγκληματίας πού, όταν τον κυκλώνουν, λέει: «Δεν έχω σωτηρία! Θα με πιάσουν!». και τα κάνει όλα γυαλιά-καρφιά. Ή όπως οι στρατιώτες, που εν καιρώ πολέμου, όταν τελειώσουν τα πυρομαχικά, βγάζουν την λόγχη ή το σπαθί και ρίχνονται και ό,τι γίνει. Σού λέει: «Έτσι κι αλλιώς χαμένοι είμαστε, ας σκοτώσουμε όσο πιο πολλούς μπορούμε». Ο κόσμος καίγεται! Το καταλαβαίνετε; Έπεσε πολύς πειρασμός. Τέτοια πυρκαγιά έχει βάλει ο διάβολος, που ούτε όλοι οι πυροσβέστες αν μαζευθούν, δεν μπορούν να κάνουν τίποτε, αναγκάζονται οι άνθρωποι να στραφούν στον Θεό και να Τον παρακαλέσουν να ρίξη μία βροχή γερή, για να σβήση. Έτσι και για την πνευματική πυρκαγιά που άναψε ο διάβολος, μόνον προσευχή χρειάζεται, για να βοηθήση ο Θεός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλος ο κόσμος πάει να γίνη μία περίπτωση. Γενικό ξεχαρβάλωμα! Δεν είναι να πής: «Σ́ ένα σπίτι χάλασε λίγο το παράθυρο ή κάτι άλλο, ας το διορθώσω». Όλο το σπίτι είναι ξεχαρβαλωμένο. Έχει γίνει χαλασμένο χωριό. Δεν ελέγχεται πια η κατάσταση. Μόνον από πάνω, ό,τι κάνει ο Θεός. Τώρα είναι να δουλεύη ο Θεός με το κατσαβίδι, με χάδια, με σκαμπίλια, να το διορθώση. Μία πληγή έχει ο κόσμος που κιτρίνισε και θέλει σπάσιμο, αλλά ακόμη δεν ωρίμασε καλά. Πάει να ωριμάση το κακό, όπως τότε στην Ιεριχώ[4]που ήταν για απολύμανση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί βάσανα έχει ο κόσμος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ατέλειωτα είναι τα βάσανα του κόσμου. Μία γενική αποσύνθεση, οικογένειες, μικροί-μεγάλοι. Κάθε μέρα η καρδιά μου γίνεται κιμάς. Τα περισσότερα σπίτια είναι γεμάτα από στενοχώριες, από αγωνία, από άγχος. Μόνο στα σπίτια που ζουν κατά Θεόν είναι καλά οι άνθρωποι. Στα άλλα, διαζύγια, άλλοι χρεωκοπημένοι, άλλοι άρρωστοι, άλλοι τρακαρισμένοι, άλλοι με ψυχοφάρμακα, με ναρκωτικά!... Λίγο-πολύ όλοι, οι καημένοι, έχουν έναν πόνο. Ιδίως τώρα, δουλειές δεν έχουν, χρέη από 'δω, βάσανα από 'κει, τους τραβούν οι Τράπεζες, τους βγάζουν από τα σπίτια, ένα σωρό! Και δεν είναι μία και δύο μέρες! Και αν ένα-δύο παιδιά σε μία τέτοια οικογένεια είναι γερά, αρρωσταίνουν από αυτήν την κατάσταση. Πολλές οικογένειες από αυτές μία μέρα να είχαν το αμέριμνο, την ξενοιασιά των μοναχών, θα είχαν το καλύτερο Πάσχα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τί δυστυχία υπάρχει στον κόσμο! Όταν κανείς πονάη και ενδιαφέρεται για τους άλλους και όχι για τον εαυτό του, τότε όλο τον κόσμο τον βλέπει σαν σε ακτινογραφία με τις ακτίνες τις πνευματικές... Πολλές φορές, εκεί που λέω την ευχή, βλέπω μικρούτσικα παιδάκια, τα καημένα, να περνούν μπροστά μου θλιμμένα και να παρακαλούν τον Θεό. Τα βάζουν οι μανάδες τους να κάνουν προσευχή, γιατί έχουν προβλήματα, δυσκολίες στην οικογένεια και ζητούν βοήθεια από τον Θεό. Γυρίζουν το κουμπί στην ίδια συχνότητα, και έτσι επικοινωνούμε!
- type: h2
  initial:
    ru: ''
  text:
    ru: Ασφάλειες καί... ανασφάλεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα ο κόσμος γέμισε ασφάλειες-ανασφάλειες, αλλά, για να είναι απομακρυσμένος από τον Χριστό, νιώθει την μεγαλύτερη ανασφάλεια. Σε καμμιά εποχή δεν υπήρχε η ανασφάλεια που έχουν οι σημερινοί άνθρωποι. Και επειδή δεν τους βοηθούν οι ανθρώπινες ασφάλειες, τρέχουν τώρα να μπούν στο καράβι της Εκκλησίας, για να νιώσουν πνευματική ασφάλεια, γιατί βλέπουν ότι το κοσμικό καράβι βούλιαξε. Αν όμως δούν ότι και στο καράβι της Εκκλησίας μπαίνει λίγο νερό, ότι και εκεί έχουν πιασθή από το κοσμικό πνεύμα και δεν υπάρχει το Άγιο Πνεύμα, τότε θα απογοητευθούν οι άνθρωποι, γιατί δεν θα έχουν μετά από που να πιασθούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο κόσμος υποφέρει, χάνεται και δυστυχώς είναι αναγκασμένοι όλοι οι άνθρωποι να ζουν μέσα σ́ αυτήν την κόλαση του κόσμου. Νιώθουν οι περισσότεροι μία μεγάλη εγκατάλειψη, μία αδιαφορία – ιδίως τώρα – από παντού. Δεν έχουν από που να κρατηθούν. Είναι αυτό που λένε: «Ο πνιγμένος απ'' τα μαλλιά του πιάνεται». Αυτό δείχνει ότι ο πνιγμένος ζητάει από κάπου να πιασθή, να σωθή. Βλέπεις, το καράβι βουλιάζει και ο άλλος πάει να πιασθή από το κατάρτι. Μά, αφού το καράβι κινδυνεύει να βουλιάξη, δεν σκέφτεται ότι και το κατάρτι θα βουλιάξη. Πιάνεται από το κατάρτι και βουλιάζει πιο γρήγορα! Θέλω να πω ότι οι άνθρωποι ζητούν κάπου να ακουμπήσουν, από κάπου να πιασθούν. Και αν δεν έχουν πίστη να ακουμπήσουν σ́ αυτήν, αν δεν εμπιστευθούν στον Θεό, ώστε να εγκαταλείψουν τελείως τον εαυτό τους σ́ Αυτόν, θα βασανίζωνται. Μεγάλη υπόθεση η εμπιστοσύνη στον Θεό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τα χρόνια που περνούμε είναι πολύ δύσκολα και πολύ επικίνδυνα, αλλά τελικά θα νικήσει ο Χριστός. Θα δήτε πώς θα εκτιμήσουν την Εκκλησία. Αρκεί εμείς να είμαστε σωστοί. Θα καταλάβουν ότι αλλιώς δεν γίνεται χωριό. Και οι πολιτικοί έχουν πλέον καταλάβει ότι, αν κάποιοι μπορούν να βοηθήσουν τώρα σ́ αυτό το τρελλοκομείο που έχει γίνει ο κόσμος, αυτοί είναι οι άνθρωποι της Εκκλησίας. Μη σάς φαίνεται παράξενο! Οι πολιτικοί μας σήκωσαν τα χέρια. Ήρθαν στο Καλύβι μερικοί και μου είπαν: «Οι καλόγεροι πρέπει να κάνουν ιεραποστολή, αλλιώς δεν γίνεται». Δύσκολα χρόνια! Αν γνωρίζατε σε τί κατάσταση βρισκόμαστε και τί μας περιμένει!...'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί αναζήτηση υπάρχει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χειμώνα καιρό ήρθαν μία μέρα στο Καλύβι ογδόντα άτομα, από φοιτητές μέχρι σκηνοθέτες. Έκλαιγαν και ρωτούσαν αν μπορούν να σπουδάσουν Θεολογία! Είναι εξωφρενική η κατάσταση στον κόσμο! Όλοι ζητούν κάτι, χωρίς να ξέρουν οι περισσότεροι τί ζητούν. Άλλοι με μπουζούκια ψάχνουν την αλήθεια! Άλλοι με εξωφρενική μουσική ζητούν τον Χριστό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, αλήθεια, τί αναζήτηση έχει ο κόσμος! Τόσοι άνθρωποι να έρχωνται και να στέκωνται όρθιοι και να περιμένουν ώρες! Μέσα στα σημεία των καιρών είναι και αυτό, να ζητάει ο κόσμος βοήθεια από εμένα τον ταλαίπωρο. Δεν βλέπω κάτι το καλό στον εαυτό μου και απορώ τί βρίσκουν οι άνθρωποι και τρέχουν σ́ εμένα. Κολοκύθι με φλούδα καρπουζιού είμαι. στις μέρες μας το κολοκύθι το τρώνε για καρπούζι, γιατί έχει φλούδα καρπουζιού. Ξεκινούν από την άκρη του κόσμου και δεν είναι σίγουροι, θα με βρούν, δεν θα με βρούν. Και τον εαυτό μου τον σιχαίνομαι και τον κόσμο τον πονάω. Που έχουμε φθάσει! Που κατήντησε ο κόσμος! Ο Προφήτης Ηλίας[5]αναφέρει ότι θά'' ρθεί καιρός που οι άνθρωποι θα βρουν έναν που θα έχη ιμάτιο και θα του πούν: «Έλα να σε κάνουμε βασιλιά!». Ο Θεός να μας λυπηθή!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν διαβάζω τον 28ο Ψαλμό που είναι «Γι'' αυτούς που κινδυνεύουν στην θάλασσα»[6], λέω: «Θεέ μου, και η στεριά, ο κόσμος όλος, έγινε χειρότερη θάλασσα, γιατί πνίγει τον κόσμο πνευματικά». Και όταν έρχεται κόσμος απογοητευμένος, τους διαβάζω τον 93ο και τον 36ο Ψαλμό. «Θεός εκδικήσεων Κύριος, Θεός εκδικήσεων επαρρησιάσατο. Υψώθητι ο κρίνων την γήν, απόδος ανταπόδοσιν τοις υπερηφάνοις... Τον λαόν σου, Κύριε, εταπείνωσαν και την κληρονομίαν σου εκάκωσαν... Και εγένετο μοί Κύριος εις καταφυγήν και ο Θεός μου εις βοηθόν ελπίδος μου...». Δίνουν μεγάλη παρηγοριά! Με μία ματιά στον Ουρανό θα άλλαζαν τα πράγματα. Αλλά βλέπεις, δεν σκέφτονται τον Θεό σήμερα οι άνθρωποι. Γι'' αυτό δεν βρίσκεις ανταπόκριση, δεν μπορείς να συνεννοηθής.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Συνέχεια παρακαλώ τον Θεό να παρουσιάση σωστούς ανθρώπους, Χριστιανούς, για να βοηθούν τον κόσμο, και τους σωστούς να τους κρατήση χρόνια. Να κάνουμε προσευχή να φωτίση ο Θεός να βγουν άλλοι, νέοι άνθρωποι, αγνοί, να βγουν Μακκαβαίοι[7], γιατί οι τωρινοί καταστρέφουν τον κόσμο. Οι νεώτεροι μπορεί να έχουν απειρία, αλλά δεν έχουν ψευτιά, πονηριά. Να παρακαλούμε να φωτίζη ο Θεός ανθρώπους όχι μόνο στην Εκκλησία, αλλά και αυτούς που κυβερνούν, να έχουν φόβο Θεού, για να μπορέσουν κάτι να πούν. Λίγο, μία φωτισμένη κουβέντα αν πούν, τάκ, αλλάζουν μία κατάσταση. Αν πούν μία ανοησία, μπορεί ολόκληρο κράτος να το τσαλακώσουν. Μία άσχημη απόφαση είναι καταστροφή. Δεν είναι μόνον η υλική δυστυχία, που πεινούν, που δυστυχούν οι άνθρωποι, η πνευματική δυστυχία είναι πιο μεγάλη. Η προσευχή πολύ θα βοηθήση να τους φωτίση λιγάκι ο Χριστός. Παίρνει το κατσαβιδάκι ο Χριστός, λίγο ένα στρίψιμο, μία βόλτα πίσω... εντάξει, όλα τακτοποιούνται. Σιγά-σιγά, όταν ο Θεός φωτίζη μερικούς ανθρώπους, τότε το κακό εξευτελίζεται μόνο του. Γιατί το κακό μόνο του καταστρέφεται, δεν το καταστρέφει ο Θεός. Τελικά τα πράγματα θα έρθουν στην θέση τους. Βλέπω ότι πολλοί που έχουν μία θέση καταλαβαίνουν, πονούν και αγωνίζονται, και ιδιαίτερα το χαίρομαι!
- type: h2
  initial:
    ru: ''
  text:
    ru: Στην εποχή μας λείπουν τα παραδείγματα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ο Άγιος Κύριλλος Ιεροσολύμων λέει ότι οι Μάρτυρες των εσχάτων χρόνων θα είναι«υπέρ πάντας Μάρτυρας»[8];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί παλιά είχαμε μεγάλα αναστήματα. Στην εποχή μας λείπουν τα παραδείγματα – μιλώ γενικά για την Εκκλησία και τον Μοναχισμό. Τώρα πλήθυναν τα λόγια και τα βιβλία και λιγόστεψαν τα βιώματα. Θαυμάζουμε μόνον τους Αγίους Αθλητές της Εκκλησίας μας, χωρίς να καταλαβαίνουμε το πόσο κοπίασαν, γιατί δεν κοπιάσαμε, για να μπορέσουμε να καταλάβουμε τον κόπο τους, για να τους αγαπήσουμε και να αγωνισθούμε από φιλότιμο να τους μιμηθούμε. Ο Καλός Θεός βέβαια θα λάβη υπ' όψιν Του την εποχή και τις συνθήκες στις οποίες ζούμε και ανάλογα θα ζητήση. Αν λίγο αγωνισθούμε, θα στεφανωθούμε περισσότερα από τους παλαιούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά που υπήρχε το αγωνιστικό πνεύμα και ο καθένας προσπαθούσε να μιμηθή τον άλλο, δεν μπορούσε να σταθή ούτε το κακό ούτε η αμέλεια. Ήταν και το καλό πολύ και αγωνιστικό πνεύμα υπήρχε, γι' αυτό ένας αμελής δεν μπορούσε να σταθή. Τον έπαιρναν σβάρνα οι άλλοι. Θυμάμαι, μία φορά στην Θεσσαλονίκη περιμέναμε τα φανάρια, για να περάσουμε από το ένα πεζοδρόμιο στο άλλο. Σε μία στιγμή αισθάνθηκα ένα κύμα να με σπρώχνη προς τα εμπρός, γιατί όλοι πήγαιναν προς τα εκεί. Μόλις που σήκωνα το πόδι και προχωρούσα. Θέλω να πω δηλαδή ότι, όταν όλοι πάνε προς ένα μέρος, ένας, και να μη θέλη να πάη, δυσκολεύεται να μην πάη, γιατί τον πάνε οι άλλοι. Σήμερα, αν κάποιος θέλη να ζήση τίμια και πνευματικά, δεν χωράει στον κόσμο, δυσκολεύεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και αν δεν προσέξη, θα τον πάρη ο κατήφορος, το κοσμικό κανάλι. Παλιότερα, ήταν πολύ το καλό, πολλή η αρετή, πολύ το καλό παράδειγμα, και το κακό πνιγόταν στο πολύ καλό και η λίγη αταξία που υπήρχε στον κόσμο ή στα Μοναστήρια δεν φαινόταν και ούτε έβλαπτε. Τώρα τί γίνεται; Το κακό παράδειγμα είναι πολύ, και το λίγο καλό που υπάρχει, περιφρονείται. Γίνεται δηλαδή το αντίθετο, πνίγεται το λίγο καλό στο πολύ κακό, και έτσι κυβερνάει το κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ένας άνθρωπος ή ένα σύνολο ανθρώπων έχη αγωνιστικό πνεύμα, αυτό πολύ βοηθάει. Γιατί, όταν ένας προχωράη πνευματικά, δεν ωφελεί μόνον τον εαυτό του, αλλά βοηθάει και τον άλλον που τον βλέπει. Και ένας που είναι χαλαρός, πάλι το ίδιο, επιδρά και στους άλλους. Όταν ο ένας χαλαρώνη, ο άλλος χαλαρώνη, τελικά, χωρίς να το καταλαβαίνουν, δεν μένει τίποτε. Γι' αυτό το αγωνιστικό πνεύμα πολύ θα βοηθήση μέσα σ́ αυτήν την χαλάρωση που υπάρχει. Αυτό θα πρέπη να το προσέξουμε πολύ, γιατί έφθασαν δυστυχώς σε τέτοιο σημείο οι σημερινοί άνθρωποι, που κάνουν και νόμους ακόμη χαλαρούς και τους επιβάλλουν και στους αγωνιζομένους να τους εφαρμόσουν. Γι' αυτό οι αγωνιζόμενοι όχι μόνο δεν πρέπει να επηρεάζωνται από το κοσμικό πνεύμα, αλλά και να μη συγκρίνουν τον εαυτό τους με τους κοσμικούς και νομίζουν ότι είναι άγιοι και μετά χαλαρώνουν και γίνονται χειρότεροι και από τους πιο κοσμικούς. Στην πνευματική ζωή δεν θα βάλη κανείς για πρότυπό τους κοσμικούς αλλά τους Αγίους. Καλά είναι να παίρνη κάθε αρετή και να βρίσκη τον Άγιο που την είχε, να μελετά τον βίο του, και τότε θα βλέπη ότι δεν έχει κάνει τίποτε και να προχωρή με ταπείνωση. Στο στάδιο αυτοί που τρέχουν, δεν κοιτάζουν πίσω να δούν που βρίσκονται οι τελευταίοι, γιατί, αν το κάνουν, θα μείνουν αυτοί τελευταίοι. Όταν προσπαθώ να μιμηθώ τους προχωρημένους, η συνείδηση λεπτύνεται. Όταν όμως βλέπω τους πίσω, δικαιολογώ τον εαυτό μου και λέω ότι δεν είναι σπουδαία τα σφάλματά μου εν συγκρίσει με τα δικά τους. Επαναπαύομαι στον λογισμό μου ότι υπάρχει και ο κατώτερός μου. Έτσι πνίγω την συνείδησή μου ή καλύτερα, καταλήγω να έχω μία καρδιά σοβαντισμένη, αναίσθητη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο γλυκός κατήφορος είναι εύκολος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, ενώ κάνουμε τόσο δύσκολα το καλό, πέφτουμε τόσο εύκολα στο κακό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί για το καλό πρέπει πρώτα ο ίδιος ο άνθρωπος να βοηθήση, να αγωνισθή, ενώ στο κακό βοηθάει ο διάβολος. Ύστερα, οι άνθρωποι δεν μιμούνται το καλό ούτε έχουν καλούς λογισμούς. Πολλές φορές φέρνω το εξής παράδειγμα στους λαϊκούς: «Ας πούμε ότι έχω ένα αυτοκίνητο και λέω με τον λογισμό μου: Τί να το κάνω; Εγώ μπορώ να εξυπηρετηθώ και με κάποιον γνωστό μου και με κανένα ταξί στην ανάγκη. Ας το δώσω σ́ εκείνον τον οικογενειάρχη που έχει πολλά παιδιά, να τα βγάζη λίγο έξω, να τα πάη σε κανένα Μοναστήρι, να ξεσκάνε και να βοηθιούνται τα καημένα; Αν το δώσω, κανένας δεν θα με μιμηθή σ́ αυτό. Αν όμως έχω ένα αυτοκίνητο ίδια μάρκα με το δικό σας και ύστερα αλλάξω και πάρω άλλη καλύτερη μάρκα, να δήτε, δεν θα κοιμηθήτε όλη νύχτα, για να βρήτε έναν τρόπο να αλλάξετε αυτοκίνητο και να πάρετε καλύτερο, ίδιο με το δικό μου, και ας είναι καλά και τα δικά σας αυτοκίνητα. Σ́ αυτή την περίπτωση θα πήτε: «Θα πουλήσω, θα δανεισθώ, για να το αλλάξω». Ενώ στην προηγούμενη περίπτωση κανένας δεν θα με μιμηθή, να πεί: «Τί να το κάνω και εγώ το αυτοκίνητο; ας το δώσω», αλλά μπορεί να πούν ότι είμαι και χαμένος».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι άνθρωποι εύκολα επηρεάζονται στο κακό. Ενώ στο βάθος αναγνωρίζουν και παραδέχονται το καλό, όμως πιο εύκολα επηρεάζονται και παρασύρονται από το κακό, γιατί εκεί κανοναρχεί[9]το ταγκαλάκι[10]. Τον γλυκό κατήφορο εύκολα τον βρίσκει κανείς, γιατί ο πειρασμός δεν έχει άλλο τυπικό, παρά να σπρώχνη στον γλυκό κατήφορο τα πλάσματα του Θεού. Ο Χριστός έχει αρχοντιά. Σού λέει: «Αυτό είναι το καλό», «ει τις θέλει οπίσω μου ελθείν...»[11]. Δεν λέει: «Με το ζόρι έλα κοντά μου!». Ο διάβολος έχει γυφτιά. Από ''δω-από ''κει τον τυλίγει τον άνθρωπο, για να τον πάη εκεί που θέλει. Ο Θεός σέβεται την ελευθερία του ανθρώπου, γιατί δεν έκανε δούλους αλλά υιούς. Και παρ'' όλο που ήξερε ότι θα επακολουθήση η πτώση, δεν τους έκανε δούλους. Προτίμησε να έρθη, να σαρκωθή, να σταυρωθή και να κερδίση έτσι τον άνθρωπο. Με την ελευθερία όμως αυτή που έδωσε ο Θεός –παρ'' όλο που ο διάβολος μπορεί να κάνη πολύ κακό – δίνεται μία ευκαιρία για κοσκίνισμα. Φαίνεται τί κάνει κανείς με την καρδιά του, φαίνεται καθαρά το πολύ φιλότιμο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός δεν μας εγκαταλείπει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην κατάσταση που είναι σήμερα οι άνθρωποι, ό,τι τους λέει ο λογισμός κάνουν. Άλλοι είναι με χάπια, άλλοι παίρνουν ναρκωτικά... Κάθε τόσο τρείς-τέσσερις ξεκινούν να κάνουν μία καινούργια θρησκεία. Ανάλογα, λίγα γίνονται, εγκλήματα, δυστυχήματα κ.λπ. Βοηθάει ο Θεός. Ήρθε ένας στο Καλύβι και μου λέει: «Έχεις καμμιά κιθάρα;». Πίνει χασίς, έχει όρεξη να μιλάη – δεν σε ρωτάει αν έχης εσύ όρεξη – θέλει και μία κιθάρα!! Άλλοι βαρέθηκαν την ζωή τους και θέλουν να αυτοκτονήσουν ή να κάνουν κανένα κακό, για να γίνη σαματάς. Δεν είναι ότι τους περνάει αυτό σαν βλάσφημος λογισμός και τον διώχνουν. Βαρέθηκαν την ζωή τους και δεν ξέρουν τί να κάνουν. Μου είπε ένας: «Θέλω να με γράψουν οι εφημερίδες ότι είμαι ήρωας». Οι άλλοι χρησιμοποιούν μερικούς τέτοιους και κάνουν την δουλειά τους. Πάλι καλά, ανάλογα, λίγα γίνονται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το καλό είναι που δεν μας εγκαταλείπει ο Θεός. Ο Καλός Θεός τον σημερινό κόσμο τον φυλάει με τα δύο Του χέρια, παλιότερα μόνο με το ένα. Σήμερα, μέσα στους τόσους κινδύνους που ζη ο άνθρωπος, ο Θεός τον φυλάει όπως η μάνα το μικρό το παιδί, όταν αρχίζη να περπατάη. Τώρα μας βοηθούν πιο πολύ ο Χριστός, η Παναγία, οι Άγιοι, αλλά δεν το καταλαβαίνουμε. Που θα ήταν ο κόσμος, αν δεν βοηθούσαν!... Το μεγαλύτερο ποσοστό των ανθρώπων παίρνει χάπια και είναι σε μία κατάσταση... Άλλος μεθυσμένος, άλλος απογοητευμένος, άλλος ζαλισμένος. Άλλος από τους πόνους ξενυχτισμένος. Όλοι αυτοί βλέπεις να δοηγούν αυτοκίνητα, μοτοσυκλέτες, να κάνουν επικίνδυνες δουλειές, να χειρίζωνται επικίνδυνα μηχανήματα. Είναι όλοι αυτοί σε κατάσταση να οδηγούν; Μπορούσε να είχε σακατευθή ο κόσμος. Πώς μας φυλάει ο Θεός και δεν το καταλαβαίνουμε!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά, θυμάμαι, πήγαιναν οι γονείς μας στα χωράφια και πολλές φορές μας άφηναν στην γειτόνισσα να μας προσέχη μαζί με τα παιδιά τα δικά της. Αλλά τότε ήταν ισορροπημένα τα παιδιά. Μία ματιά έρειχνε η γειτόνισσα και έκανε τις δουλειές της και εμείς παίζαμε ήσυχα. Έτσι και ο Χριστός, η Παναγία, οι Άγιοι παλιά με μία ματιά παρακολουθούσαν τον κόσμο. Σήμερα και ο Χριστός και η Παναγία και οι Άγιοι τον έναν πιάνουν από 'δω, τον άλλον από 'κει, γιατί οι άνθρωποι δεν είναι ισορροπημένοι. Τώρα είναι μία κατάσταση... Θεός φυλάξοι! Σαν μία μητέρα να έχη δύο-τρία προβληματικά παιδιά, το ένα λίγο χαζούλικο, το άλλο λίγο αλλοίθωρο, το άλλο λίγο ανάποδο, να έχη και κανά-δύο της γειτόνισσας να τα προσέχη, και το ένα να ανεβαίνη ψηλά και να κινδυνεύη να πέση κάτω, το άλλο να παίρνη το μαχαίρι να κόψη τον λαιμό του, το άλλο να πάη να κάνη κακό στο άλλο, και αυτή συνέχεια να βρίσκεται σε εγρήγορση, να τα παρακολουθή, και εκείνα να μην καταλαβαίνουν την αγωνία της. Έτσι και ο κόσμος δεν καταλαβαίνει την βοήθεια του Θεού. Με τόσα επικίνδυνα μέσα που υπάρχουν σήμερα θα είχε σακατευθή, αν δεν βοηθούσε ο Θεός. Αλλά έχουμε και Πατέρα τον Θεό και Μάνα την Παναγία και αδέλφια τους Αγίους και τους Αγγέλους, που μας προστατεύουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσο μισεί ο διάβολος το ανθρώπινο γένος και θέλει να το εξαφανίση! Και εμείς ξεχνούμε με ποιόν παλεύουμε. Να ξέρατε πόσες φορές ο διάβολος τύλιξε την γη με την ουρά του, για να την καταστρέψη! Δεν τον αφήνει όμως ο Θεός, του χαλάει τα σχέδια. Και το κακό που πάει να κάνη το ταγκαλάκι, ο Θεός το αξιοποιεί και βγάζει μεγάλο καλό. Ο διάβολος τώρα οργώνει, ο Χριστός όμως θα σπείρη τελικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και πάντα βλέπουμε ότι ο Καλός Θεός στις μεγάλες δοκιμασίες δεν αφήνει να περάσουν περισσότερες από τρεις γενιές, για να υπάρχη προζύμι. Πριν την Βαβυλώνια αιχμαλωσία[12]οι Ισραηλίτες έρριξαν σε ένα ξεροπήγαδο την φωτιά από την τελευταία θυσία που έκαναν, ώστε να βρουν μετά από την ίδια φωτιά και να αρχίσουν πάλι τις θυσίες. Και πράγματι, μετά από εβδομήντα χρόνια, όταν επέστρεψαν, βρήκαν από εκείνη την φωτιά και άρχισαν τις θυσίες. Σε κάθε δύσκολη περίοδο δεν παρασύρονται όλοι. Ο Θεός διατηρεί μία ζύμη για τις επόμενες γενιές. Οι Κομμουνιστές δούλεψαν εβδομήντα πέντε χρόνια και κράτησαν εβδομήντα πέντε χρόνια, πάλι τρεις γενιές. Οι Σιωνιστές πόσα χρόνια έχουν που δουλεύουν, αλλά ούτε επτά χρόνια δεν θα κρατήσουν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Έρχονται δύσκολα χρόνια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Θεός επιτρέπει να γίνη τώρα ένα τράνταγμα γερό. Έρχονται δύσκολα χρόνια. Θα έχουμε δοκιμασίες μεγάλες... Να το πάρουμε στα σοβαρά, να ζήσουμε πνευματικά. Οι περιστάσεις μας αναγκάζουν και θα μας αναγκάσουν να δουλέψουμε πνευματικά. Καλό όμως είναι να το κάνουμε χαρούμενα και προαιρετικά και όχι από θλίψεις, αναγκαστικά. Πολλοί Άγιοι θα παρακαλούσαν να ζούσαν στην εποχή μας, για να αγωνισθούν. Εγώ χαίρομαι που απειλούν μερικοί να με ξεκάνουν, επειδή μιλώ και τους χαλώ τα σχέδια. Όταν αργά το βράδυ ακούω στο Καλύβι να πηδούν μέσα από τον φράχτη, χτυπάει γλυκά η καρδιά μου. Αλλά όταν φωνάζουν: «Ήρθε τηλεγράφημα, να κάνης προσευχή για τον τάδε άρρωστο», λέω: «Αυτό ήταν; Πάει και αυτή η ευκαιρία!...» Όχι ότι βαρέθηκα την ζωή μου, αλλά το χαίρομαι. Να χαιρώμαστε που μας δίνεται αυτή η ευκαιρία σήμερα. Είναι πολύ μεγάλος μισθός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά, όταν γινόταν ένας πόλεμος, ήταν εν αμύνη κανείς και πήγαινε να αγωνισθή, να πολεμήση, για να υπερασπιστή την Πατρίδα του, το έθνος του. Τώρα δεν πάμε να υπερασπίσουμε την Πατρίδα μας ή να αγωνισθούμε, για να μη μας κάψουν οι βάρβαροι τα σπίτια μας ή να μη μας πάρουν την αδελφή μας και μας ατιμάσουν, ούτε πάμε για ένα έθνος ή για μία ιδεολογία. Τώρα πάμε ή για τον Χριστό ή για τον διάβολο. Είναι καθαρό μέτωπο. Στην Κατοχή γινόσουν ήρωας, γιατί δεν χαιρετούσες έναν Γερμανό. Τώρα γίνεσαι ήρωας, γιατί δεν χαιρετάς τον διάβολο. Πάντως θα δούμε φοβερά γεγονότα. Θα δοθούν πνευματικές μάχες. Οι Άγιοι θα αγιασθούν περισσότερο και οι ρυπαροί θα γίνουν ρυπαρώτεροι[13]. Νιώθω μέσα μου μία παρηγοριά. Μία μπόρα είναι και ο αγώνας έχει αξία, γιατί τώρα δεν έχουμε εχθρό τον Αλή Πασά ή τον Χίτλερ ή τον Μουσουλίνι, αλλά τον διάβολο. Γι' αυτό θα έχουμε και ουράνιο μισθό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός ας αξιοποιήση το κακό σε καλό σαν Καλός Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρωτο Μεροσ – Η Αμαρτια Και ο Διαβολοσ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Φαρμάκι γευόμαστε, όταν ζούμε μακριά από τον γλυκύ Ιησού».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1– Η αμαρτία έγινε μόδα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είπατε σε κανέναν ότι θα γίνη πόλεμος; Έτσι ακούσαμε. Είναι αλήθεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ δεν λέω τίποτε και ο κόσμος λέει ό,τι θέλει. Και να ξέρω κάτι, που να το πώ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί βάρβαρο πράγμα, Γέροντα, ο πόλεμος!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν οι άνθρωποι δεν είχαν αυτήν την ... «ευγένεια» της αμαρτίας, δεν θα έφθαναν σ́ αυτό το βάρβαρο. Πιό βάρβαρο ακόμη είναι η ηθική καταστροφή. Διαλύονται ψυχικά και σωματικά οι άνθρωποι. Μου έλεγε κάποιος: «Λένε για την Αθήνα, «ζούγκλα-ζούγκλα» και κανείς δεν φεύγει από ''κει! Όλοι «ζούγκλα» την λένε και όλοι στην ζούγκλα μαζεύονται». Πώς έχουν γίνει οι άνθρωποι! Σαν τα ζώα! Τα ζώα ξέρετε τί κάνουν; Στην αρχή μπαίνουν στον σταύλο, κοπρίζουν, ουρούν... Μετά αρχίζει να χωνεύη η κοπριά. Μόλις αρχίζη να χωνεύη, αισθάνονται μία ζεστασιά. Δεν τα κάνει καρδιά να φύγουν από τον σταύλο, αναπαύονται. Έτσι και οι άνθρωποι, θέλω να πώ, νιώθουν την ζεστασιά της αμαρτίας, και δεν τους κάνει καρδιά να φύγουν. Καταλαβαίνουν ότι βρωμάει, αλλά από την ζεστασιά εκείνη δεν τους κάνει καρδιά να φύγουν. Νά, αν μπή τώρα ένας μέσα στον σταύλο, δεν μπορεί να αντέξη από την μυρωδιά. Ο άλλος που είναι συνέχεια στον σταύλο δεν ενοχλείται, έχει συνηθίσει πλέον.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μερικοί λένε: «Μήπως μόνο σήμερα αμαρτάνει ο κόσμος; Και στην Ρώμη παλιά τί γινόταν!...»'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά στην Ρώμη ήταν ειδωλολάτρες στο κάτω-κάτω. Και αυτά  που λέει ο Απόστολος Παύλος[14]ήταν για τους ειδωλολάτρες που είχαν βαπτισθή, αλλά είχαν κακές συνήθειες. Να μην παίρνουμε για παράδειγμα τον ξεπεσμό από κάθε εποχή. Σήμερα την αμαρτία την έκαναν μόδα. Βλέπεις, ορθόδοξο έθνος εμείς και πώς είμαστε! Πόσο μάλλον οι άλλοι! Και το κακό είναι που οι σημερινοί άνθρωποι, επειδή η αμαρτία έχει γίνει μόδα, αν δούν έναν να μην ακολουθή το ρεύμα της εποχής, να μην αμαρτάνη, να είναι λίγο ευλαβείς, τον λένε καθυστερημένο, οπισθοδρομικό. Αυτοί οι άνθρωποι το να μην αμαρτάνουν το θεωρούν προσβολή και την αμαρτία την θεωρούν πρόοδο. Αυτό είναι το χειρότερο από όλα. Αν οι σημερινοί άνθρωποι που ζουν στην αμαρτία τουλάχιστον το αναγνώριζαν, θα τους ελεούσε ο Θεός, Αλλά δικαιολογούν τα αδικαιολόγητα και εγκωμιάζουν την αμαρτία. Αυτό είναι και η μεγαλύτερη βλασφημία κατά του Αγίου Πνεύματος, την αμαρτία να την θεωρούν πρόοδο και το ηθικό να το λένε κατεστημένο. Γι' αυτό έχουν μεγάλο μισθό, μεγάλη αξία, αυτοί που αγωνίζονται στον κόσμο και διατηρούν καθαρή ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιά, αν ένας ήταν διεστραμμένος ή μέθυσος, ντρεπόταν να βγή στην αγορά, γιατί θα τον περιφρονούσαν. Η μία, αν ήταν λιγάκι παραστρατημένη, δεν τολμούσε να βγή έξω. Και ήταν κατά κάποιο τρόπο αυτό ένα φρένο. Σήμερα, αν είναι ένας σωστός, μία κοπέλα λ.χ. αν ζη με ευλάβεια, λένε: «Βρέ, που ζη αυτή!». Αλλά και γενικά, αν οι κοσμικοί έκαναν μία αμαρτία, οι καημένοι, αισθάνονταν την αμαρτωλότητά τους, έσκυβαν και λίγο το κεφαλάκι τους και δεν ειρωνεύονταν έναν που ζούσε πνευματικά, αντίθετα τον καμάρωναν. Τώρα ούτε ενοχή αισθάνονται ούτε σεβασμός υπάρχει. Τα ισοπέδωσαν όλα. Αν ένας δεν ζη κοσμικά, τον κοροϊδεύουν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η συνείδηση ελέγχει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην Γαλλία, παρ' όλο που είναι κράτος προοδευμένο – δεν είναι υπανάπτυκτο –, τελευταία[15]ογδόντα χιλιάδες έγιναν Μουσουλμάνοι. Γιατί; Γιατί έχουν κάνει την αμαρτία μόδα. Βλέπεις όμως, ελέγχονται και θέλησαν να αναπαύσουν την συνείδησή τους. Και όπως οι Αρχαίοι Έλληνες, για να δικαιολογούν τα πάθη τους, είχαν βρει τους δώδεκα θεούς, έτσι και αυτοί έψαξαν να βρουν μία θρησκεία που να δικαιολογεί τα πάθη τους, για να τους αναπαύση σ́ αυτό το θέμα. Ο Μουσουλμανισμός κατά κάποιο τρόπο τους εξυπηρετεί. Επιτρέπει να πάρουν όσες γυναίκες θέλουν, υπόσχεται στην άλλη ζωή ένα βουνό πιλάφι, μία λίμνη γιαούρτι, ένα ποτάμι μέλι! Και όσες αμαρτίες και να έχουν, άμα τους λούσουν με ζεστό νερό, όταν πεθάνουν, καθαρίζονται! Πάνε στον Αλλάχ καθαροί! Τί άλλο θέλουν; Όλα βολικά! Αλλά οι Γάλλοι δεν θα βρουν ανάπαυση. Πάνε να αναπαυθούν, αλλά δεν θα αναπαυθούν, γιατί τα πάθη δεν δικαιολογούνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οτιδήποτε και αν κάνουν οι άνθρωποι, και αναίσθητοι να είναι, πάλι ανάπαυση δεν βρίσκουν, πάνε να δικαιολογήσουν τα αδικαιολόγητα, αλλά εσωτερικά βασανίζονται, είναι αγριεμένοι. Γι'' αυτό ζητούν ψυχαγωγίες, τρέχουν στα νταούλια, μεθούν, βλέπουν τηλεόραση. Χαζεύουν δηλαδή, για να ξεχνιούνται, γιατί ελέγχονται. Και όταν κοιμούνται, λές ότι ησυχάζουν; Υπάρχει συνείδηση, βλέπεις. Η πρώτη Αγία Γραφή που έδωσε ο Θεός στους Πρωτοπλάστους είναι η συνείδηση, και εμείς την ξεσηκώνουμε φωτοτυπία τώρα από τους γονείς μας. Όσο και αν την καταπατήση κανείς την συνείδησή του, πάλι μέσα του ελέγχεται. Γι'' αυτό λένε: «Τον τρώει το σαράκι». Ναί, δεν υπάρχει γλυκύτερο πράγμα από το να έχη κανείς αναπαυμένη την συνείδησή του. Φτερά νιώθει μέσα του, πετάει.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η απομάκρυνση από τον Θεό είναι κόλαση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν θυμάμαι μέρα να μην έχη παρηγοριά θεϊκή. Διακοπές γίνονται μερικές φορές και τότε νιώθω άσχημα, και έτσι μπορώ να καταλάβω πόσο άσχημα ζουν οι περισσότεροι άνθρωποι που είναι απαρηγόρητοι, γιατί είναι απομακρυσμένοι από τον Θεό. Όσο απομακρύνεται κανείς από τον Θεό, τόσο πιο δύσκολα γίνονται τα πράγματα. Μπορεί να μην έχη κανείς τίποτα, άμα έχη τον Θεό, δεν θέλει τίποτε! Αυτό είναι! Ενώ, αν τα έχη όλα, άμα δεν έχη τον Θεό, είναι μέσα του βασανισμένος. Γι' αυτό, όσο μπορεί κανείς, να πλησιάση τον Θεό, Μόνον κοντά στον Θεό βρίσκει κανείς την πραγματική και αιώνια χαρά. Φαρμάκι γευόμαστε, όταν ζούμε μακριά από τον γλυκύ Ιησού. Όταν ο άνθρωπος από παλιάνθρωπος γίνη άνθρωπος, βασιλόπουλο, τρέφεται με την θεία ηδονή, με την ουράνια γλυκύτητα, και νιώθει την παραδεισένια αγαλίαση, αισθάνεται από 'δω ένα μέρος της χαράς του Παραδείσου. Από την μικρή παραδεισένια χαρά καθημερινά προχωράει στην μεγαλύτερη και αναρωτιέται αν υπάρχη κάτι ανώτερο στον Παράδεισο από αυτό που ζη εδώ. Είναι τέτοια η κατάσταση που ζή, που δεν μπορεί να κάνη καμμιά εργασία. Τα γόνατά του λυγίζουν σαν λαμπάδες από την θεία εκείνη θερμότητα και γλυκύτητα, η καρδιά του σκιρτάει και πάει να σπάσει τους τσατμάδες[16], για να φύγη, γιατί η γη και τα γήινά της φαίνονται χαμένα πράγματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος πρώτα είχε επικοινωνία με τον Θεό. Μετά όμως, όταν απομακρύνθηκε από την Χάρη του Θεού, ήταν σαν έναν που ζούσε μέσα σε παλάτι και ύστερα βρέθηκε για πάντα έξω από το παλάτι και το έβλεπε από μακριά και έκλαιγε. Όπως το παιδάκι, όταν απομακρυνθή από την μάνα του, υποφέρει, έτσι και ο άνθρωπος, όταν απομακρυνθή από τον Θεό, υποφέρει, βασανίζεται. Η απομάκρυνση του ανθρώπου από τον Θεό είναι κόλαση. Ο διάβολος κατόρθωσε να απομακρύνη τους ανθρώπους τόσο πολύ από τον Θεό, ώστε να φθάσουν στο σημείο να λατρεύουν τα αγάλματα και να θυσιάζουν τα παιδιά τους στα αγάλματα. Φοβερό! Και που τους βρίσκουν τόσους θεούς οι δαίμονες! Θεός Χαμώς[17]!... Μόνον το όνομά του να ακούσης, φθάνει! Ο πιο βασανισμένος όμως είναι ο διάβολος, γιατί είναι ο πιο απομακρυσμένος από τον Θεό, από την αγάπη. Αλλά, αν φύγη η αγάπη, μετά είναι κόλαση. Αντίθετό της αγάπης τί είναι; Η κακία, κακία ίσον βάσανο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ένας που είναι απομακρυσμένος από τον Θεό, δέχεται την δαιμονική επίδραση. Ενώ αυτός που είναι κοντά στον Θεό, δέχεται την θεία Χάρη. Όποιος έχει Χάρη Θεού, θα του δοθή και άλλη. και όποιος έχει λίγη και την περιφρονεί, θα του αφαιρεθή και αυτή[18]. η Χάρις του Θεού λείπει από τους σημερινούς ανθρώπους, γιατί με την αμαρτία πετάνε και την λίγη που έχουν. Και όταν φύγη η θεία Χάρις, ορμούν όλοι οι δαίμονες μέσα στον άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ανάλογα με την απομάκρυνσή τους από τον Θεό οι άνθρωποι αισθάνονται σ́ αυτήν την ζωή στενοχώρια και στην άλλη ζωή θα ζουν την αιώνια στενοχώρια. Γιατί από αυτήν την ζωή γεύεται κανείς, σε κάποιο βαθμό, ανάλογα με το πόσο ζη σύμφωνα με το θέλημα του Θεού, ένα μέρος της χαράς του Παραδείσου. Ή θα ζήσουμε ένα μέρος της χαράς του Παραδείσου από εδώ, και θα πάμε και στον Παράδεισο,, ή θα ζήσουμε ένα μέρος της κολάσεως και – Θεός φυλάξοι! – θα πάμε στην κόλαση. Παράδεισος ίσον καλωσύνη.. Κόλαση ίσον κακωσύνη. Κάνει κανείς μία καλωσύνη, αισθάνεται χαρά. Κάνει μία στραβοξυλιά, υποφέρει. Όσο περισσότερο καλό κάνει, τόσο περισσότερο αγάλλεται. Όσο περισσότερο κακό κάνει, τόσο περισσότερο υποφέρει η ψυχή του. ο κλέφτης νιώθει χαρά; δεν νιώθει χαρά. Ενώ αυτός που κάνει καλωσύνες νιώθει χαρά. Και να βρη κανείς κάτι στον δρόμο, αν το κρατήση και πη ότι είναι δικό του, ανάπαυση δεν θα έχη! Ούτε ξέρει σε ποιόν ανήκει ούτε αδίκησε κάποιον ούτε το κλέβει, και όμως δεν αναπαύεται. Πόσο μάλλον να το κλέψη! Ακόμη και όταν κανείς λαμβάνη, πάλι δεν νιώθει την χαρά που νιώθει όταν δίνη. Πόσο μάλλον όταν κλέβη ή όταν αδική, να νιώθη χαρά! Γι' αυτό, βλέπεις, οι άνθρωποι με την αδικία τί πρόσωπα έχουν, τί γκριμάτσες κάνουν!
- type: h2
  initial:
    ru: ''
  text:
    ru: Σε όποιο αφεντικό δουλεύεις από αυτό θα πληρωθής
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι απομακρυσμένοι άνθρωποι από τον Θεό πάντα απαρηγόρητοι βρίσκονται και διπλά βασανίζονται. Όποιος δεν πιστεύει στον Θεό και στην μέλλουσα ζωή, εκτός που μένει απαρηγόρητος, καταδικάζει και την ψυχή του αιώνια. Σε όποιο αφεντικό δουλεύεις, από ατό θα πληρωθής. Αν δουλεύης στο μαύρο αφεντικό, σού κάνει την ζωή μαύρη από εδώ. Αν δουλεύης στην αμαρτία, θα πληρωθής από τον διάβολο. Αν εργάζεσαι την αρετή, θα πληρωθείς από τον Χριστό. Και όσο εργάζεσαι στον Χριστό, τόσο θα λαμπικάρεσαι, θα αγάλλεσαι. Αλλά εμείς λέμε: «Χαμένο τό'' χούμε να εργασθούμε στον Χριστό;». Μά είναι φοβερό! Να μην αναγνωρίζουμε την θυσία του Χριστού για τον άνθρωπο! Σταυρώθηκε ο Χριστός, για να μας λυτρώση από την αμαρτία, για να εξαγνισθή όλο το ανθρώπινο γένος. Τί έκανε ο Χριστός για μας; τί κάνουμε εμείς για τον Χριστό;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο κόσμος θέλει να αμαρτάνη και θέλει τον Θεό καλό. Αυτός να μας συγχωράη και εμείς να αμαρτάνουμε. Εμείς δηλαδή να κάνουμε ό,τι θέλουμε και Εκείνος να μας συγχωράη. Να μας συγχωράη συνέχεια και εμείς το βιολί μας. Οι άνθρωποι δεν πιστεύουν, γι'' αυτό ορμούν στην αμαρτία. Όλο το κακό από ''κει ξεκινάει, από την απιστία. Δεν πιστεύουν στην άλλη ζωή, όποτε δεν υπολογίζουν τίποτε. Αδικούν, εγκαταλείπουν τα παιδιά τους... Γίνονται πράγματα..., σοβαρές αμαρτίες. Ούτε οι Άγιοι Πατέρες έχουν προβλέψει τέτοιες αμαρτίες στους Ιερούς Κανόνες – όπως για τα Σόδομα και Γόμορρα είχε πει ο Θεός: «Δεν πιτεύω να γίνωνται τέτοιες αμαρτίες, να πάω να δώ!»[19].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν δεν μετανοήσουν οι άνθρωποι, αν δεν επιστρέψουν στον Θεό, χάνουν την αιώνια ζωή. Πρέπει να βοηθηθή ο άνθρωπος να νιώση το βαθύτερο νόημα της ζωής, να συνέλθη, για να νιώση την θεία παρηγοριά. Σκοπός είναι να ανεβή πνευματικά ο άνθρωπος, όχι απλώς να μην αμαρτάνη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Στις μέρες μας ο διάβολος αλωνίζει
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την αμαρτία δίνουμε δικαιώματα στον πειρασμό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολύς δαιμονισμός υπάρχει σήμερα στον κόσμο. Ο διάβολος αλωνίζει, γιατί οι σημερινοί άνθρωποι του έχουν δώσει πολλά δικαιώματα και δέχονται δαιμονικές επιδράσεις φοβερές. Έλεγε ένας πολύ σωστά: «Ο διάβολος παλιά ασχολείτο με τους ανθρώπους, τώρα δεν ασχολείται! Τους έβαλε στον δρόμο και τους λέει: «Ώρα καλή!». και τραβάνε οι άνθρωποι!». Είναι φοβερό! Βλέπετε, τα δαιμόνια στην χώρα των Γαδαρηνών[20], για να πάνε στα γουρούνια, ζήτησαν άδεια από τον Χριστό, γιατί τα γουρούνια δεν είχαν δώσει δικαίωμα στον διάβολο και αυτός δεν είχε δικαίωμα να μπή σ́ αυτά. Ο Χριστός επέτρεψε να μπή, για να τιμωρηθούν οι Ισραηλίτες, επειδή απαγορευόταν να τρώνε χοιρινό κρέας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι μερικοί που λένε ότι δεν υπάρχει διάβολος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, κι εμένα μου είπε κάποιος: «Να βγάλης από την γαλλική μετάφραση του βιβλίου «Ο Άγιος Αρσένιος ο Καππαδόκης» αυτά  που αναφέρονται στους δαιμονισμένους, γιατί οι Ευρωπαίοι δεν θα τα καταλάβουν. Δεν πιστεύουν ότι υπάρχει διαβολος»! Τα εξηγούν, βλέπεις, όλα με την ψυχολογία. Αν πήγαιναν εκείνους τους δαιμονισμένους του Ευαγγελίου στους ψυχιάτρους, θα τους τάραζαν στα ηλεκτροσόκ! Ο Χριστός έχει αφαιρέσει από τον διάβολο το δικαίωμα να κάνη κακό. Μόνον αν του δώση ο άνθρωπος δικαιώματα, μπορεί να κάνη κακό. Όταν δεν συμμετέχη κανείς στα Μυστήρια της Εκκλησίας, δίνει δικαιώματα στον πειρασμό και δέχεται μία επίδραση δαιμονική.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς αλλιώς δίνει κανείς δικαιώματα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η λογική[21], η αντιλογία, το πείσμα, το θέλημα, η ανυπακοή, η αναίδεια είναι ιδιότητες του διαβόλου. Ανάλογα με τον βαθμό που τα έχει ο άνθρωπος, δέχεται μία εξοτερική επίδραση. Όταν όμως η ψυχή εξαγνισθή, κατοικεί στον άνθρωπο το Άγιο Πνεύμα και χαριτώνεται ο άνθρωπος. Ενώ, όταν μολυνθή με θανάσιμα αμαρτήματα, κατοικεί το ακάθαρτο πνεύμα. Όταν πάλι δεν είναι θανάσιμα μολυσμένη, τότε βρίσκεται υπό την επίδραση του πονηρού πνεύματος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην εποχή μας, δυστυχώς, δεν θέλουν οι άνθρωποι να κόψουν τα πάθη τους, το θέλημά τους, δεν δέχονται συμβουλές. Από εκεί και πέρα, μιλούν με αναίδεια και διώχνουν την Χάρη του Θεού. Όπου να σταθή μετά ο άνθρωπος, δεν μπορεί να κάνη προκοπή, γιατί δέχεται επιδράσεις δαιμονικές. Είναι εκτός εαυτού πιά, γιατί τον κάνει κουμάντο απ' έξω ο διάβολος. Δεν είναι μέσα –Θεός φυλάξοι! – αλλά και απ' έξω ακόμη μπορεί και τον κάνει κουμάντο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος, όταν εγκαταλείπεται από την Χάρη, γίνεται χειρότερος από τον διάβολο. Γιατί μερικά πράγματα ο διάβολος δεν τα κάνει, αλλά βάζει ανθρώπους να τα κάνουν. Δεν κάνει λ.χ. Εγκλήματα, αλλά βάζει τον άνθρωπο να κάνη εγκλήματα. Έτσι δαιμονίζονται μετά οι άνθρωποι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η εξομολόγηση κόβει τα δικαιώματα του διαβόλου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να πάνε τουλάχιστον οι άνθρωποι σε έναν Πνευματικό να εξομολογηθούν, να φύγη η δαιμονική επίδραση, για να μπορούν να σκέφτωνται λιγάκι. Τώρα δεν μπορούν ούτε να σκεφθούν από την δαιμονική επίδραση. Η μετάνοια, η εξομολόγηση κόβει το δικαίωμα του διαβόλου. Πριν λίγο καιρό[22], ήρθε στο Άγιον Όρος ένας μάγος και έφραξε με πασσαλάκια και δίχτυα όλο τον δρόμο, εκεί σε μία περιοχή κοντά στο Καλύβι. Αν περνούσε από 'κει μέσα ένας ανεξομολόγητος, θα πάθαινε κακό. Δεν θα ήξερε από που του ήρθε. Μόλις τα είδα, κάνω τον σταυρό μου και περνώ από μέσα, το διέλυσα. Μετά ο μάγος ήρθε στο Καλύβι, μου είπε όλα τα σχέδιά του και έκαψε τα βιβλία του. σε έναν που είναι πιστός, εκκλησιάζεται, εξομολογείται, κοινωνάει, ο διάβολος δεν έχει καμμιά δύναμη, καμμιά εξουσία. Κάνει μόνο λίγο «κάφ-καφ» σαν ένα σκυλί που δεν έχει δόντια. Σε έναν όμως που δεν είναι πιστός και του δίνει δικαιώματα, έχει μεγάλη εξουσία. Μπορεί να τον λιντσάρη, έχει δόντια και τον ξεσκίζει. Ανάλογα με τα δικαιώματα που δίνει μία ψυχή, είναι και η εξουσία του επάνω της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ακόμη και όταν πεθάνη κανείς και είναι τακτοποιημένος, την ώρα που η ψυχή του ανεβαίνει στον Ουρανό, είναι σαν να τρέχη ένα τραίνο και άλλα σκυλιά τρέχουν από πίσω γαυγίζοντας «κάφ-κάφ...», κόβει και κανένα σκυλί το τραίνο. Αλλά, αν δεν είναι τακτοποιημένος, είναι σαν να βρίσκεται σε τραίνο που δεν μπορεί να τρέξη με ταχύτητα, γιατί είναι χαλασμένες οι ρόδες,κ οι πόρτες ανοικτές και μπαίνουν τα σκυλιά μέσα και δαγκάνουν και κανέναν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο διάβολος έχη αποκτήσει μεγάλα δικαιώματα στον άνθρωπο και τον έχη κυριεύσει, τότε πρέπει να βρεθή η αιτία, για να κοπούν τα δικαιώματα. Αλλιώς, όση προσευχή και να κάνουν οι άλλοι, αυτός δεν φεύγει. Σακατεύει τον άνθρωπο. Οι ιερείς δωσ́ τού-δωσ́ του εξορκισμούς, και τελικά τα πληρώνει ο άνθρωπος, γιατί βασανίζεται ακόμη περισσότερο από τον διάβολο. Πρέπει να μετανοήση ο άνθρωπος, να εξομολογηθή, να κοπούν τα διακαιώματα που έχει δώσει, και μετά θα φύγη ο διάβολος, αλλιώς θα ταλαιπωρήται. Μία μέρα, δύο μέρες, εβδομάδες, μήνες, χρόνια, διάβασε-διάβασε εξορκισμούς, αφού ο διάβολος έχει δικαιώματα, δεν φεύγει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος δεν πλησιάζει στο καθαρό πλάσμα του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς γίνεται και κυριεύομαι από τα πάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο άνθρωπος, αν δώση δικαιώματα στον πειρασμό, κυριεύεται από τα πάθη. Αυτό που θέλει ο Θεός, που είναι και συμφέρον σου, είναι να πετάξης στα μούτρα του διαβόλου όλα τα πάθη. Δηλαδή να στρέψης εναντίον του τον θυμό, το πείσμα κ.λπ. Η καλύτερα, πούλησε τα πάθη στο ταγκαλάκι καί, με όσα χρήματα πάρης, αγόρασε πέτρες, να έχης και να το πετροβολάς, για να μη σε πλησιάζη! Συνήθως εμείς οι άνθρωποι με τις αφορμές που δίνουμε, είτε με απροσεξίες είτε με υπερήφανους λογισμούς, επιτρέπουμε στον εχθρό να μας κάνη κακό. Ακόμη και έναν λογισμό ή έναν λόγο μπορεί να τα εκμεταλλευθή το ταγκαλάκι. Θυμάμαι, ήταν μία οικογένεια πολύ αγαπημένη. Κάποτε άρχισε ο άνδρας και έλεγε στην γυναίκα: «Θα σε χωρίσω». Και η γυναίκα έλεγε στον άνδρα: «Θα σε χωρίσω». Έτσι το έλεγαν, στ'' αστεία. Αλλά το εκμεταλλεύθηκε ο πειρασμός και δημιούργησε μία μικρή δυσκολία και ήταν έτοιμοι να χωρίσουν, ούτε τα παιδιά τους σκέφτονταν ούτε τίποτε. Ευτυχώς βρέθηκε ένας Πνευματικός και τους μίλησε: «Γι'' αυτήν την χαζομάρα θα χωρίσετε;», τους είπε. Και έτσι συνήλθαν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν ένας άνθρωπος λοξοδρομήση από τις εντολές του Θεού, τον πολεμούν μετά τα πάθη. Και αν αφήση κανείς τα πάθη να τον πολεμούν, δεν χρειάζεται διάβολος να τον πολεμήση. Και τα δαιμόνια έχουν «ειδικότητα». Χτυπούν τον άνθρωπο τάκ-τάκ, να του βρουν την πάθηση, την αδυναμία, για να τον πολεμήσουν. Θέλει προσοχή, να κλείνουμε τις πόρτες και τα παράθυρα – τις αισθήσεις –, να μην ανοίγουμε χαραμάδες στον πειρασμό και μπαίνη από εκεί ο εχθρός. Εκεί είναι τα αδύνατα σημεία. Εάν αφήσης έστω και μία σχισμή ανοιχτή, μπορεί να μπή και να σού κάνη ζημιά. Ο διάβολος μπαίνει στον άνθρωπο, όταν υπάρχη λάσπη στην καρδιά του ανθρώπου, δεν πλησιάζει στο καθαρό πλάσμα του Θεού. Άμα ξελασπωθή η καρδιά, φεύγει ο εχθρός και έρχεται πάλι ο Χριστός. Όπως το γουρούνι, όταν δεν βρη λάσπη, γουγουλίζει και φεύγει, έτσι και ο διάβολος δεν πλησιάζει στην καρδιά που δεν έχει βούρκο. Τί δουλειά έχει σε καρδιά καθαρή και ταπεινή; εάν λοιπόν δούμε ότι το σπίτι μας –η καρδιά μας – είναι παλιόσπιτο και κατοικεί ο εχθρός, πρέπει αμέσως να το γκρεμίσουμε, για να φύγη και ο κακός ενοικιαστής μας, δηλαδή το ταγκαλάκι. Γιατί, όταν η αμαρτία χρονίση στον άνθρωπο, ο διάβολος, φυσικά, αποκτάει περισσότερα δικαιώματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ένας άνθρωπος έχη δώσει δικαιώματα στον πειρασμό, επειδή έζησε με αμέλεια, και θέλη να βάλη μία σειρά, να αρχίσει να ζη προσεκτικά, τον πολεμάει το ταγκαλάκι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν παίρνη την στροφή, παίρνη μία δύναμη από τον Θεό, έναν φωτισμό και θεία παρηγοριά, για να αρχίση. Αλλά, μόλις αρχίση τον αγώνα, ο εχθρός του κάνει σφοδρό πόλεμο. Τότε χρειάζεται λίγη καρτερία. Αλλιώς, πώς θα ξερριζωθούν τα πάθη; Πώς θα γίνη η απέκδυση του παλαιού ανθρώπου; Πώς θα φύγη η υπερηφάνεια; Έτσι καταλαβαίνει ότι μόνος του δεν μπορεί να κάνη τίποτε και ζητάει ταπεινά το έλεος του Θεού και έρχεται η ταπείνωση. Το ίδιο συμβαίνει και όταν κάποιος πάη να κόψη μία κακή συνήθεια, π.χ. τσιγάρα, ναρκωτικά. Στην αρχή νιώθει μία χαρά και τα πετάει. Μετά βλέπει τους άλλους να καπνίζουν κ.λπ. και έχει πόλεμο σφοδρό. Αν το ξεπεράση, γυρίζει τις πλάτες χωρίς να δυσκολεύεται. Πρέπει να αγωνισθούμε λίγο. Το ταγκαλάκι κάνει την δουλειά του. Εμείς να μην κάνουμε την δουλειά μας;
- type: h2
  initial:
    ru: ''
  text:
    ru: Να μην ανοίγουμε συζήτηση με το ταγκαλάκι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλοι έχουμε πάθη κληρονομικά, αλλά αυτά  δεν μας βλάπτουν. Είναι όπως ένας γεννιέται λ.χ. Με μία ελιά στο πρόσωπο. Αυτή και ομορφιά του δίνει, αν όμως την ξεσκαλίση, μπορεί να δημιουργηθή καρκίνος. Να μην αφήνουμε τον διάβολο να ξεσκαλίζη τα πάθη. Αν τον αφήσουμε να ξεσκαλίζη την αδυναμία μας, δημιουργείται «καρκίνος».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να έχουμε την πνευματική λεβεντιά, να περιφρονούμε τον διάβολο και όλα τα πονηρά του τηλεγραφήματα –τούς λογισμούς – και να μην ανοίγουμε συζήτηση μαζί του. Όλοι οι δικηγόροι να μαζευτούν, δεν μπορούν να τα βγάλουν πέρα με ένα μικρό διαβολάκι. Για να κόψουμε τις σχέσεις με τον πειρασμό και να αποφύγουμε τους πειρασμούς, πολύ βοηθάει το να κόψουμε τις συζητήσεις μαζί του. μας συνέβη κάτι;Μας αδίκησαν;Μας έβρισαν; Να εξετάσουμε αν σφάλαμε. Αν δεν σφάλαμε, έχουμε μισθό. Δεν χρειάζεται συνέχεια. Όποιος συνεχίζει να συζητάη με το ταγκαλάκι, του πλέκει μετά δαντέλλα[23]και τον αναστατώνει. Τον κάνει να τα εξετάζη με την ταγκαλίστικη νομική και τον αγριεύει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θυμάμαι, όταν είχαν φύγει οι Ιταλοί, είχαν αφήσει μέσα σε σκηνές λοφίσκους από χειροβομβίδες, τα δε μπαρούτια ήταν ολόκληροι λόφοι. Πήγαιναν οι άνθρωποι και έπαιρναν τις σκηνές. Τα παιδιά έπαιζαν με τις χειροβομβίδες και πόσα, τα καημένα, σκοτώθηκαν! Με τις χειροβομβίδες να παίξουν! Έτσι και με τον διάβολο παιχνίδια θα κάνουμε;
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος είναι αδύναμος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου λέει ο λογισμός ότι ο διάβολος, ιδίως στις μέρες μας, έχει πολλή δύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο διάβολος έχει κακία και μίσος, όχι δύναμη. Η αγάπη του Θεού είναι παντοδύναμη. Ο σατανάς προσπαθεί να φανή παντοδύναμος, αλλά δεν τα καταφέρνει. Φαίνεται δυνατός, αλλά είναι τελείως αδύναμος. Πολλά καταστρεπτικά σχέδιά του χαλούν, πριν καν αρχίσουν να πραγματοποιούνται. Θα άφηνε ποτέ ένας πολύ καλός πατέρας μερικά αλητάκια να χτυπούν τα παιδιά του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, φοβάμαι τα ταγκαλάκια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να φοβηθής; Τα ταγκαλάκια δεν έχουν καμμιά δύναμη. Ο χριστός είναι παντοδύναμος. Ο πειρασμός είναι σάπιος. Σταυρό δεν φοράς; Τα όπλα του διαβόλου είναι αδύναμα. Ο Χριστός μας μας έχει οπλίσει με τον Σταυρό Του. Μόνον όταν αφήνουμε τα όπλα τα πνευματικά, τότε ο εχθρός έχει δύναμη. Ένα μικρό σταυρουδάκι έδειξε ένας ορθόδοξος ιερέας σε έναν μάγο και έκανε να τρέμη ο δαίμονας που είχε επικαλεσθή με τις μαγείες του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί φοβάται τόσο πολύ τον Σταυρό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, όταν ο Χριστός δέχθηκε τους εμπτυσμούς, τα ραπίσματα και τα χτυπήματα, τότε συντρίφθηκε το βασίλειο και η εξουσία του διαβόλου. Με τί τρόπο νίκησε ο Χριστός! «Με το καλάμι συντρίφθηκε το κράτος του διαβόλου», λέει κάποιος Άγιος. Όταν δηλαδή Του έδωσαν το τελευταίο χτύπημα με το καλάμι στο κεφάλι, τότε συντρίφθηκε η εξουσία του διαβόλου. Δηλαδή η υπομονή είναι η πνευματική άμυνα και η ταπείνωση το μεγαλύτερο όπλο κατά του διαβόλου. Το μεγαλύτερο βάλσαμο της σταυρικής θυσίας του Χριστού είναι που συντρίφθηκε ο διάβολος. Μετά την Σταύρωση του Χριστού, είναι πια όπως το φίδι που του έχει αφαιρεθή το δηλητήριο ή όπως το σκυλί που του έχουν αφαιρεθή τα δόντια. Αφαιρέθηκε το φαρμάκι από τον διάβολο, αφαιρέθηκαν τα δόντια από τα σκυλιά, τους δαίμονες, και είναι τώρα αφοπλισμένοι και εμείς με τον Σταυρό οπλισμένοι. Τίποτε, τίποτε δεν μπορούν να κάνουν οι δαίμονες στο πλάσμα του Θεού, όταν δεν τους δώσουμε εμείς δικαιώματα. Μόνο φασαρία κάνουν, δεν έχουν εξουσία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μία φορά, όταν ήμουν στο Κελλί του Τιμίου Σταυρού, πέρασα μία πολύ όμορφη αγρυπνία! Είχαν μαζευθή την νύχτα πολλοί δαίμονες επάνω στο ταβάνι. Στην αρχή χτυπούσαν με βαριές δυνατά και μετά θορυβούσαν, σαν να κυλούσαν κούτσουρα μεγάλα, κορμούς Δένδρων. Σταύρωνα το ταβάνι και έψαλλα «Τον Σταυρόν σου προσκυνούμεν, Δέσποτα...»[24]. Τελείωνα, άρχιζαν τα κούτσουρα πάλι. «Τώρα, είπα, θα κάνουμε δύο χωρούς! Έναν εσείς με τα κούτσουρα από πάνω και έναν εγώ από κάτω!». Άρχιζα εγώ, σταματούσαν αυτοί. Μία φορά έψαλλα «Τον Σταυρόν σου προσκυνούμεν...», την άλλη «Κύριε, όπλον κατά του διαβόλου τον Σταυρόν σου ημίν δέδωκας...»[25]. Πέρασα την πιο ευχάριστη νύχτα με ψαλμωδία καί, όταν λίγο σταματούσα, συνέχιζαν αυτοί με την ψυχαγωγία! Την κάθε φορά όλο και διαφορετικό έργο θα παρουσιάσουν!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ψάλλατε την πρώτη φορά, δεν έφυγαν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι. Μόλις τελείωνα εγώ, άρχιζαν εκείνοι. Ναί, έπρεπε να βγάλουμε αγρυπνία και οι δύο χοροί! Ήταν μία όμορφη αγρυπνία! Έψελνα με καημό! Πέρασα καλές μέρες!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς είναι ο διάβολος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρεις τί «όμορφος» είναι; Άλλο πράγμα! Μόνο να τον δής!! Και πώς η αγάπη του Θεού δεν επιτρέπει να βλέπει ο άνθρωπος τον διάβολο! Ώ, θα πέθαιναν οι περισσότεροι από τον φόβο τους! Σκέψου αν τον έβλεπαν πώς ενεργεί, αν έβλεπαν τήν... «γλυκειά» του μορφή! Μερικοί πάλι θα είχαν την καλύτερη ψυχαγωγία! Ξέρεις τί ψυχαγωγία; Πώς το λένε; Σινεμά;... Για να δη κανείς όμως ένα τέτοιο έργο, πρέπει να πληρώση πολλά..., και πάλι αν θα μπορέση να το δή!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχει κέρατα, ουρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, όλα τα εξαρτήματα!!!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι δαίμονες έγιναν τόσο άσχημοι, όταν έπεσαν και έγιναν από Άγγελοι δαίμονες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έμ, βέβαια! Και είναι τώρα σαν να τους χτύπησε κεραυνός. Αν πέση κεραυνός και χτυπήση ένα Δένδρο, δεν θα γίνη αμέσως το Δένδρο ένα μαύρο κούτσουρο; Έτσι και αυτοί είναι σαν να τους χτύπησε κεραυνός. Ένα διάστημα έλεγα στο ταγκαλάκι: «Να έρχεσαι να σε βλέπω, για να μην πέσω στα χέρια σου. Τώρα και μόνον που σε βλέπω, φαίνεσαι πόσο κακός είσαι. Αν πέσω στα χέρια σου, τί κακό έχω να πάθω!».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος είναι κουτός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γνωρίζει, Γέροντα, το ταγκαλάκι τί έχουμε στην καρδιά μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ακόμη αυτό έλειψε, να γνωρίζη και καρδιές! Μόνον ο Θεός είναι καρδιογνώστης και μόνο σε ανθρώπους του Θεού αποκαλύπτει ορισμένες φορές πάλι ο Θεός –γιά το καλό μας – τί έχουμε στις καρδιές μας. Το ταγκαλάκι γνωρίζει τις πονηριές και τις κακίες που φυτεύει στα δικά του όργανα, δεν ξέρει τους καλούς λογισμούς μας. Μόνον εκ πείρας αντιλαμβάνεται μερικά, αλλά και σ́ αυτά, πέφτει έξω τις περισσότερες φορές. Και εάν δεν επιτρέψη ο Θεός να τα καταλάβη και αυτά, πέφτει συνέχεια έξω σε όλα, γιατί είναι σκοτεινός ο διάβολος, ορατότης μηΔέν!!! Δεν ξέρει, ας υποθέσουμε, έναν καλό λογισμό δικό μου. Αν έχω κανέναν κακό λογισμό, εκείνον τον ξέρει, γιατί ο ίδιος τον φυτεύει. Αν εγώ τώρα θέλω να πάω να κάνω κάπου μία καλωσύνη, να σώσω λ.χ. έναν άνθρωπο, ο διάβολος αυτό δεν το ξέρει. Όταν όμως εκείνος βάλη σε κάποιον έναν λογισμό και του πή: «Πήγαινε να σώσης τον τάδε ανθρωπο», θα τον κεντήση συγχρόνως και στην υπερηφάνεια και γι'' αυτό τον ξέρει αυτόν τον λογισμό. Αλλά και με το ότι δέχεται ο άνθρωπος την υπερηφάνεια, δίνει δικαίωμα στον πειρασμό. Είναι πολύ λεπτά τα πράγματα! Θυμάστε το περιστατικό με τον Αββά Μακάριο[26]; Είχε συναντήσει μία φορά τον διάβολο που επέστρεφε από την πιο κοντινή Έρημο, όπου είχε πάει, για να πειράξη τους αδελφούς, ο οποίος του είπε: «Όλοι οι αδελφοί είναι πολύ αγριεμένοι μαζί μούμ εκτός από έναν που είναι φίλος μου και μου κάνει υπακοή καί, όταν με βλέπη, στρέφεται σαν ανέμη». «Ποιος αδελφός είναι αυτός;», τον ρώτησε ο Αββάς Μακάριος. «Θεόπεμπτος είναι το όνομα τού», του απάντησε εκείνος. Πηγαίνει ο Όσιος και βρίσκει τον αδελφό. Με τρόπο τον κατάφερε να του αποκαλύψη τους λογισμούς του και τον βοήθησε. Όταν ξανασυνάντησε τον διάβολο, τον ρώτησε για τους αδελφούς και εκείνος του είπε: «Όλοι είναι πολύ αγριεμένοι μαζί μου. Και το χειρότερο, και αυτός που ήταν φίλος μου, δεν ξέρω πώς έγινε και άλλαξε και τώρα είναι ο πιο αγριεμένος από όλους». Δεν ήξερε ότι πήγε ο Αββάς Μακάριος και τον έφερε τον αδελφό σε λογαριασμό, γιατί ο Αββάς Μακάριος είχε κινηθή ταπεινά, από αγάπη, και δεν είχε δικαίωμα ο διάβολος στον λογισμό εκείνον. Αν υπερηφανευόταν ο Αββάς Μακάριος, θα εδίωχνε την Χάρη του Θεού, όποτε θα είχε δικαίωμα ο διάβολος. Τότε θα το ήξερε, γιατί αυτός θα του είχε κεντήσει την υπερηφάνεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν πη έναν καλό λογισμό του ο άνθρωπος κάπου, μπορεί ο διάβολος να τον ακούση και να τον πειράξη μετά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πώς να τον ακούση, αφού δεν έχει «διαβολο»; Άμα όμως τον πή, για να υπερηφανευθή, θα μπή στην μέση ο πειρασμός. Αν δηλαδή υπάρχη μία προδιάθεση υπερηφανείας και λέη υπερήφανα κανείς: «Θα πάω να τον σώσω αυτόν», μπαίνει ο διάβολος ενδιάμεσος και τότε αυτό το ξέρει. Ενώ, αν κινήται ταπεινά, από αγάπη, δεν το ξέρει. Χρειάζεται προσοχή. Είναι πολύ λεπτά τα πράματα. Γι'' αυτό λένε οι Πατέρες ότι η πνευματική ζωή είναι «επιστήμη επιστημών».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς συμβαίνει όμως, Γέροντα, ένας μάγος να πη για τρεις κοπέλες ότι η μία θα αποκατασταθή, η άλλη θα ατυχήση και η άλλη θα μείνη ανύπανδρη, και να γίνη έτσι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο διάβολος έχει πείρα. Όπως π.χ. Ένας μηχανικός, όταν δη ένα σπίτι που κινδυνεύει να πέση, είναι σε θέση να πη πόσο θα κρατήση κ.λπ., έτσι και αυτός βλέπει κάποιον πώς βαδίζει και με την πείρα που έχει, λέει πώς θα καταλήξη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο διάβολος δεν έχει εξυπνάδα, είναι πολύ κουτός. Είναι όλος ένα μπέρδεμα, άκρη δεν του βρίσκεις. Κάνει και εξυπνάδες και χαζομάρες. Τα τερτίπια του είναι χοντρά. Ο Θεός οικονόμησε έτσι, για να τον καταλαβαίνουμε. Πρέπει να είναι κανείς πολύ σκοτισμένος από υπερηφάνεια, για να μην τον καταλαβαίνη. Όταν έχουμε ταπείνωση, φωτίζεται ο άνθρωπος και συγγενεύει με τον Θεό. Η ταπείνωση είναι που σακατεύει τον διάβολο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Γιατί ο Θεός επιτρέπει στον διάβολο να μας πειράζη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ο Θεός επιτρέπει στον διάβολο να μας πειράζη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να διαλέξει τα παιδιά Του. «Κάνε, διάβολε, ό,τι θέλεις», λέει ο Θεός, γιατί, ό,τι και αν κάνη, τελικά θα σπάση τα μούτρα του στον ακρογωνιαίο λίθο που είναι ο Χριστός. Εάν πιστεύουμε ότι ο Χριστός είναι ο ακρογωνιαίος λίθος, τότε τίποτε δεν μας φοβίζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός δεν επιτρέπει μία δοκιμασία, αν δεν βγή κάτι καλό. Όταν ο Θεός βλέπη ότι θα γίνη ένα μεγαλύτερο καλό, αφήνει τον διάβολο να κάνη την δουλειά του. είδατε τί έκανε ο Ηρώδης; Σκότωσε δεκατέσσερις χιλιάδες νήπια, αλλά έκανε δεκατέσσερις χιλιάδες Μάρτυρες Αγγέλους. Που είδες εσύ Μάρτυρες Αγγέλους; Έσπασε τα μούτρα του ο διάβολος! Ο Διοκλητιανός έγινε συνεργάτης του διαβόλου βασανίζοντας τους Χριστιανούς σκληρά. Αλλά, χωρίς να το θέλη, έκανε καλό στην Εκκλησία του Χριστού, γιατί την πλούτισε με Αγίους. Νόμιζε ότι θα εξαφάνιζε όλους τους Χριστιανούς, αλλά δεν έκανε τίποτε. Άφησε πλήθος άγια Λείψανα να τα προσκυνούμε και πλούτισε την Εκκλησία του Χριστού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μπορούσε να τον είχε ξεκάνει τον διάβολο ο Θεός, Θεός είναι! Εάν θέλη, και τώρα τον μαζεύει κουβάρι στην κόλαση, αλλά τον αφήνει πάλι για το καλό μας. Θα τον άφηνε να ταλαιπωρή και να βασανίζη το πλάσμα Του; τον άφησε όμως μέχρις ενός σημείου και έως καιρού, για να μας βοηθάη με την κακία του, να μας πειράζη, για να τρέχουμε σ́ Αυτόν. Μόνον αν πρόκειται να βγή καλό, επιτρέπει στο ταγκαλάκι να μας πειράξη. Αν δεν βγή καλό, δεν επιτρέπει. Όλα τα επιτρέπει ο Θεός για το καλό μας. Να το πιστέψουμε αυτό. Αφήνει τον διάβολο ο Θεός, για να παλαίψη ο άνθρωπος. Χωρίς πάλη δεν γίνεται χωριό. Αν δεν μας πείραζε ο διάβολος, μπορεί να νομίζαμε ότι είμαστε και άγιοι. Επιτρέπει λοιπόν ο Θεός στον διάβολο να μας χτυπάη με κακία, γιατί με το χτύπημα που μας κάνει, διώχνει όλες τις σκόνες μας και ξεσκονίζεται η σκονισμένη ψυχή μας. Ή τον αφήνη να ορμάη να μας δαγκώση, για να καταφεύγουμε σ́ Αυτόν. Ο Θεός μας καλεί συνέχεια, αλλά εμείς συνήθως απομακρυνόμαστε από τον Θεό καί, μόνον αν παρουσιασθή κανένας κίνδυνος, τρέχουμε κοντά Του. Όταν ο άνθρωπος ενωθή με τον Θεό, δεν υπάρχει περιθώριο να εισχωρήση ο πονηρός, αλλά ούτε υπάρχει και λόγος να επιτρέψη ο Θεός στον πονηρό να τον πειράξη, για να αναγκασθή ο άνθρωπος να καταφύγη στον Θεό. Πάντως, όπως και αν είναι, ο πονηρός μας κάνει καλό, μας βοηθάει να αγιάσουμε. Γι' αυτό και ο Θεός τον ανέχεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Θεός έχει αφήσει ελεύθερους, εκτός από τους ανθρώπους, και τους δαίμονες, μία που την ψυχή του ανθρώπου δεν την βλάπτουν, γιατί δεν μπορούν. Εκτός εάν θέλη ο ίδιος ο άνθρωπος να βλάψη την ψυχή του. αντίθετα, μισθό προξενούν στις ψυχές μας είτε κακοί άνθρωποι είτε απρ/οσεκτοι που άθελά τους κάνουν κακό στην ζωή μας. Γιατί, νομίζετε, λέει εκείνος ο Αββάς: «Επαρον τους πειρασμούς και ουδείς ο σωζόμενος»[27]; Γιατί οι πειρασμοί ωφελούν πολύ. Όχι ότι ο διάβολος μπορεί να κάνη ποτέ καλό – γιατί είναι κακός – αλλά ο Καλός Θεός εμποδίζει την πέτρα που μας πετάει, για να σπάση το κεφάλι μας, και μας την δίνει στο ένα χέρι, και στο άλλο χέρι μας δίνει αμύγδαλα, για να σπάζουμε και να τρώμε! Επιτρέπει δηλαδή ο Θεός τους πειρασμούς, όχι για να μας τυραννά ο διάβολος, αλλά για να δίνουμε με αυτόν τον τρόπο «εξετάσεις» για την άλλη ζωή και να μην έχουμε παράλογες απαιτήσεις στην Δευτέρα Παρουσία. Πρέπει να το καταλάβουμε καλά ότι πολεμούμε – και έχουμε να πολεμήσουμε, έως ότου βρισκόμαστε σ́ ετούτη την ζωή – με τον ίδιο τον διάβολο. Όσο ζη ο άνθρωπος, έχει πολλή δουλειά να κάνη για την καλυτέρευση της ψυχής του και έχει δικαίωμα να δίνη εξετάσεις πνευματικές. Εάν πεθάνη και δεν περάση, κόβεται πιά. Μετεξεταστέος δεν υπάρχει.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος δεν θέλει να μετανοήση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Καλός Θεός έκανε Αγγέλους. Μερικοί όμως Άγγελοι από την υπερηφάνειά τους ξέπεσαν και έγιναν δαίμονες. Έπλασε τον άνθρωπο ο Θεός, το τέλειο δημιούργημα, για να αντικαταστήση και το ξεπεσμένο τάγμα των Αγγέλων. Γι'' αυτό ο διάβολος πολύ ζηλεύει το πλάσμα του Θεού, τον άνθρωπο. Φωνάζουν οι δαίμονες: «Εμείς μία φορά σφάλαμε και μας τυραννάς, και αυτούς που πολλές φορές σφάλλουν, τους συγχωράς». Ναί, αλλά οι άνθρωποι μετανοούν. Αυτοί, ενώ ήταν Άγγελοι, κατήντησαν δαίμονες, και αντί να μετανοήσουν, γίνονται πιο πονηροί και κακοί και βάλθηκαν με μανία να καταστρέψουν τα πλάσματα του Θεού. Ήταν το πιο φωτεινό τάγμα ο Εωσφόρος! Και τελικά... Από την υπερηφάνεια οι δαίμονες απομακρύνθηκαν από τον Θεό πριν από χιλιάδες χρόνια και συνεχίζουν να απομακρύνωνται με την υπερηφάνεια και να μένουν αμετανόητοι. Ένα «Κύριε ελέησον» να πούν, ο Θεός κάτι θα κάνη και γι'' αυτούς. Να πούν ένα «ήμαρτον», δεν λένε «ήμαρτον». Αν ο διάβολος έλεγε «ήμαρτον», θα γινόταν Άγγελος πάλι. Η αγάπη του Θεού δεν έχει όρια. Αλλά ο διάβολος έχει θέλημα γερό, πείσμα, εγωισμό, δεν θέλει να καμφθή, δεν θέλει να σωθή. Φοβερό πράγμα! Και ενώ ήταν Άγγελος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο διάβολος θυμάται την προηγούμενη κατάστασή του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν θυμάται λέει; Αυτός είναι πυρ και μανία, γιατί δεν θέλει να γίνουν άλλοι Άγγελοι, που θα τον αντικαταστήσουν. Και όσο πάει χειρότερος γίνεται. Εξελίσσεται στην κακία και στον φθόνο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ώ, αν νιώση κανείς το κατάντημα του διαβόλου, θα κλαίη μέρα-νύχτα! Εδώ έναν καλό άνθρωπο βλέπει κανείς που αλλάζει, γίνεται εγκληματίας, και πόσο στενοχωριέται! Πόσο μάλλον να δη έτσι όχι έναν άνθρωπο αλλά έναν Άγγελο! Κάποτε, ένας μοναχός[28]είχε πονέσει πολύ τους δαίμονες καί, ενώ προσευχόταν γονατιστός, πεσμένος κάτω, έλεγε τα εξής: «Εσύ Θεός είσαι καί, άμα θέλης, μπορείς να βρής έναν τρόπο για να σωθούν και αυτοί οι δυστυχισμένοι δαίμονες, οι οποίοι, ενώ είχαν τέτοια μεγάλη δόξα πρώτα, τώρα έχουν όλη την κακία και την διαβολιά του κόσμου καί, εάν δεν μας προστάτευες, θα μας είχαν ρημάξει όλους τους ανθρώπους». Ενώ λοιπόν έλεγε αυτά  τα λόγια προσευχόμενος με πόνο, βλέπει ένα κεφάλι σκυλήσιο δίπλα του να του βγάζη την γλώσσα του και να τον κοροϊδεύη. Το επέτρεψε φαίνεται ο Θεός αυτό, για να πληροφορήση τον μοναχό ότι Εκείνος έτοιμος είναι να τους δεχθή, αρκεί να μετανοήσουν, αλλά αυτοί δεν θέλουν την σωτηρία τους. Βλέπετε, η πτώση του Αδάμ αντιμετωπίσθηκε με τον ερχομό του Θεού στην γή, με την Ενανθρώπηση. Ενώ του διαβόλου η πτώση δεν υπάρχει περίπτωση να αντιμετωπισθή, εκτός αν ταπεινωθή. Ο διάβολος δεν διορθώνεται, γιατί δεν θέλει. Ξέρετε πόσο θα χαιρόταν ο Χριστός! Και ο άνθρωπος, μόνον όταν δεν θέλη, δεν διορθώνεται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο διάβολος γνωρίζει ότι ο Θεός είναι αγάπη και τον αγαπάει και παρ' όλα αυτά  συνεχίζει το τυπικό του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έμ, πώς δεν το γνωρίζει! Αλλά η υπερηφάνεια τον αφήνει; είναι όμως και πονηρός. Προσπαθεί τώρα να κερδίση όλον τον κόσμο. Σού λέει: «Αν έχω περισσότερους οπαδούς, θα αναγκασθή ο Θεός στο τέλος να λυπηθή όλα τα πλάσματά Του και θα με πάρη κι εμένα το σχέδιο!». Έτσι νομίζει. Γι'' αυτό θέλει, όσο μπορεί, να αποκτήση πιο πολλούς οπαδούς. Βλέπετε που το πάει; Σού λέει: «Έχω τόσους με το μέρος μου! Θα αναγκασθή ο Θεός να χαρισθή και σ́ εμένα!». Χωρίς να μετανοιώση! Και ο Ιούδας το ίδιο δεν έκανε; Ήξερε ότι ο Χριστός θα ελευθέρωνε τους νεκρούς από τον Άδη. Σού λέει: «Θα πάω κι εγώ πριν από τον Χριστό, για να με ελευθερώση κι εμένα». Βλέπεις πονηριά; Αντί να ζητήση συγχώρηση από τον Χριστό, πήγε να κρεμασθή. Και να δήτε, η ευσπλαχνία του Θού λύγισε την συκιά, και αυτός μάζεψε τα πόδια του, για να μην ακουμπήσουν κάτω. Και όλα αυτά, για να μην πάη να πη ένα «ευλόγησον». Φοβερό! Έτσι λοιπόν και ο διάβολος, ο αρχηγός του εγωισμού, δεν λέει «ήμαρτον», αλλά συνέχεια ζορίζεται να αποκτήση περισσότερους οπαδούς.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ταπείνωση διαλύει τον διάβολο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η ταπείνωση έχει μεγάλη δύναμη και διαλύει τον διάβολο. Όπου υπάρχει ταπείνωση, δεν έχει θέση ο διάβολος. Και όπου δεν υπάρχει διάβολος, επόμενο είναι να μην υπάρχουν πειρασμοί. Μία φορά ένας ασκητής ζόρισε ένα ταγκαλάκι να πη το «Άγιος ο Θεός...» Είπε το ταγκαλάκι «Άγιος ο Θεός, άγιος ισχυρός, άγιος αθάνατος», «ελέησον ημάς» δεν έλεγε. Πές: «ελέησον ημάς»! Τίποτε! Αν το έλεγε, θα γινόταν Άγγελος. Όλα τα λέει το ταγκαλάκι, το «ελέησον μέ» δεν το λέει, γιατί χρειάζεται ταπείνωση. Το «ελέησον μέ» έχει ταπείνωση, και δέχεται η ψυχή το μεγάλο έλεος του Θεού που ζητάει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ό,τι και να κάνουμε, ταπείνωση-αγάπη-αρχοντιά χρειάζεται. Τα πράγματα είναι απλά. Εμείς τα κάνουμε δύσκολα. Όσο μπορούμε, να κάνουμε ό,τι είναι δύσκολο στον διάβολο και εύκολο στον άνθρωπο. Η αγάπη και η ταπείνωση είναι δύσκολες στον διάβολο και εύκολες στον άνθρωπο. Και ένας φιλάσθενος που δεν μπορεί να κάνη άσκηση, μπορεί να νικήση τον διάβολο με την ταπείνωση. Σε ένα λεπτό μέσα μπορεί ο άνθρωπος να γίνη Άγγελος ή ταγκαλάκι. Πώς; Με την ταπείνωση ή την υπερηφάνεια. Τί, μήπως χρειάσθηκαν ώρες για να γίνη ο Εωσφόρος από Άγγελος διάβολος; Μέσα σε δευτερόλεπτα έγινε. Ο ευκολώτερος τρόπος για να σωθούμε, είναι η αγάπη και η ταπείνωση. Γι' αυτό από την αγάπη και την ταπείνωση να αρχίσουμε και μετά να προχωρήσουμε στα άλλα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να εύχεσθε να δίνουμε συνέχεια χαρά στον Χριστό και στενοχώρια στο ταγκαλάκι, μία που του αρέσει η κόλαση και δεν θέλει να μετανοήση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Το κοσμικό πνεύμα
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος κυβερνάει την ματαιότητα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί τον διάβολο τον λένε «κοσμοκράτορα»; Είναι πράγματι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ακόμη αυτό έλειπε, να κυβερνά ο διάβολος τον κόσμο! Όταν είπε ο Χριστός για τον διάβολο«ο άρχων του κόσμου τούτου»[29], δεν εννοούσε ότι είναι κοσμοκράτορας, αλλά ότι κυριαρχεί στην ματαιότητα, στην ψευτιά. Αλλοίμονο, θα άφηνε ο Θεός τον διάβολο κοσμοκράτορα! Όσοι όμως έχουν δοσμένη την καρδιά τους στα μάταια, στα κοσμικά, αυτοί ζουν υπό την εξουσία «τού κοσμοκράτορος του αιώνος τούτου»[30]. Ο διάβολος δηλαδή κυβερνάει την ματαιότητα και τους ανθρώπους που είναι κυριευμένοι από την ματαιότητα, από τον «κόσμο». «Κόσμος» τί θα πή; Δεν θα πη κόσμημα, μάταιο στολίδι; Όποιος λοιπόν είναι κυριευμένος από την ματαιότητα είναι υπό την κατοχή του διαβόλου. Η αιχμαλωτισμένη καρδιά από τον μάταιο κόσμο διατηρεί και την ψυχή ατροφική και τον νού σκοτισμένο. Τότε, ενώ φαίνεται κανείς ότι είναι άνθρωπος, στην ουσία είναι πνευματικό έκτρωμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μου λέει ο λογισμός ότι ο μεγαλύτερος εχθρός της ψυχής μας ακόμη και από τον διάβολο είναι το κοσμικό πνεύμα, γιατί μας παρασύρει γλυκά και μας πικραίνει τελικά αιώνια. Ενώ, αν βλέπαμε τον ίδιο τον διάβολο, θα μας επίανε τρόμος, θα αναγκαζόμασταν να καταφύγουμε στον Θεό και θα εξασφαλίζαμε τότε τον Παράδεισο. Στην εποχή μας, πολύς «κόσμος» –κοσμικό πνεύμα – μπήκε στον κόσμο και αυτός ο «κόσμος» θα τον καταστρέψη. Έβαλαν οι άνθρωποι μέσα τους τον «κόσμο» και διώξανε από μέσα τους τον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί δεν καταλαβαίνουμε πόσο κακό κάνει το κοσμικό πνεύμα και παρασυρόμαστε από αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί το κοσμικό πνεύμα μπαίνει σιγά-σιγά, όπως ο σκαντζόχοιρος μπήκε στην φωλιά του λαγού. Στην αρχή ο σκαντζόχοιρος παρακάλεσε τον λαγό να βάλη λίγο το κεφάλι του μέσα στην φωλιά του, για να μη βρέχεται. Μετά έβαλε το ένα πόδι, μετά το άλλο, και τελικά μπήκε ολόκληρος, και με τα αγκάθια του έβγαλε τελείως έξω τον λαγό. Έτσι και το κοσμικό φρόνημα μας ξεγελάει με μικρές παραχωρήσεις και σιγά-σιγά  μας κυριεύει. Το κακό λίγο-λίγο προχωράει. Αν ερχόταν απότομα, δεν θα ξεγελιόμασταν. Βλέπεις. Αν θέλης να ζεματίσης έναν βάτραχο, πρέπει να του ρίξης λίγο-λίγο το ζεματιστό νερό. Αν το ρίξης απότομα όλο μαζί, πετιέται και φεύγει, γλυτώνει. Ενώ, αν του ρίξης λίγο καυτό νερό, στην αρχή θα το τινάξη λίγο από την πλάτη του και μετά θα το δεχθή. Αν του ρίξης ακόμη λίγο, πάλι θα το τινάξη λίγο, και σιγά-σιγά  θα ζεματιστή, χωρίς να το καταλάβη. «Βρε, βάτραχε, αφού σου έρριξε λίγο καυτό νερό, σήκω και φύγε!». Δεν φεύγει. Φουσκώνει-φουσκώνει και μετά ζεματιέται. Έτσι κάνει και ο διάβολος, μας ζεματίζει λίγο-λίγο, και τελικά, χωρίς να το καταλάβουμε, βρισκόμαστε ζεματισμένοι!
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα πρωτεία να δοθούν στην ομορφιά της ψυχής
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ψυχή που συγκινείται από τις ομορφιές του υλικού κόσμου φανερώνει ότι ζη μέσα της ο μάταιος κόσμος, γι' αυτό έλκεται από την πλάση και όχι από τον Πλάστη, από τον πηλό και όχι από τον Θεό. Δεν έχει σημασία αν ο πηλός αυτός είναι καθαρός και δεν έχη λάσπη αμαρτίας. Η καρδιά, όταν έλκεται από κοσμικές ομορφιές, οι οποίες δεν είναι αμαρτωλές, αλλά δεν παύουν να είναι μάταιες, νιώθει κοσμική χαρά της ώρας, η οποία δεν έχει θεϊκή παρηγοριά, φτερούγισμα εσωτερικό με αγαλλίαση πνευματική. Όταν όμως ο άνθρωπος αγαπάη την πνευματική ωραιότητα, τότε γεμίζει και ομορφαίνει η ψυχή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν γνώριζε ο άνθρωπος, και ιδίως ο μοναχός, την εσωτερική ασχήμια του, δεν θα επεδίωκε εξωτερικές ομορφιές. Μέσα η ψυχή έχει τόσους λεκέδες, τόσες μουντζούρες, και θα κοιτάξουμε λ.χ. τα ρούχα μας; Πλένουμε τα ρούχα μας, τα σιδερώνουμε κιόλας και είμαστε καθαροί, και μέσα είμαστε... μην τα ρωτάς! Γι'' αυτό, αν λάβη υπ'' όψιν του κανείς τί πνευματική ακαθαρσία έχει μέσα του, δεν θα καθήση τόσο σχολαστικά να βγάλη και τον παραμικρό λεκέ από τα ρούχα του, γιατί αυτά  είναι χίλιες φορές καθαρώτερα από την ψυχή του. Αλλά, αν δεν έχη υπ'' όψιν του ο άνθρωπος την πνευματική σαβούρα που έχει μέσα του, ε, τότε κοιτάζει να βγάλη σχολαστικά και τον παραμικρό λεκέ. Αυτό που χρειάζεται, είναι να στρέψη όλη την φροντίδα του στην πνευματική καθαρότητα, στην εσωτερική ομορφιά και όχι στην εξωτερική. Τα πρωτεία να δοθούν στην ομορφιά της ψυχής, στην πνευματική ομορφιά και όχι στις μάταιες ομορφιές, γιατί και ο Κύριός μας είπε: «Όσο αξίζει μία ψυχή, δεν αξίζει ο κόσμος όλος»[31].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κοσμικές επιθυμίες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι δεν φρενάρουν την καρδιά τους από τις υλικές επιθυμίες, τις μη απαραίτητες, – ούτε καν λόγος γίνεται για σαρκικές επιθυμίες – και δεν συμμαζέψουν τον νού τους μέσα στην καρδιά, για να τα δώσουν όλα μαζί με την ψυχή στον Θεό, διπλή δυστυχία τους περιμένει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι πάντα κακό το να επιθυμής κάτι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, η επιθυμία της καρδιάς δεν είναι καθ́ εαυτή κακή. Αλλά, όταν μου παίρνουν ένα κομμάτι της καρδιάς μου πράγματα, έστω και μη αμαρτωλά, μου ελαττώνουν την αγάπη μου προς τον Χριστό. Αυτή η επιθυμία πάλι είναι κακή, γιατί ο εχθρός μου κόβει την αγάπη μου από τον Χριστό. Όταν επιθυμώ ένα πράγμα χρήσιμο, ένα βιβλίο λ.χ., και μου παίρνη ένα κομμάτι της καρδιάς, τότε αυτό είναι κακό. Γιατί να μου πάρη ένα κομμάτι της καρδιάς ένα βιβλίο; Το βιβλίο θα επιθυμώ ή τον Χριστό θα λαχταρώ; Κάθε επιθυμία, όσο καλή και να φαίνεται, δεν είναι καλύτερη από το να επιθυμή κανείς τον Χριστό ή την Παναγία. Όταν δώσω την καρδιά μου στον Θεό, είναι δυνατόν ο Θεός να μη μου δώση όλο τον Εαυτό Του; Ο Θεός ζητάει την καρδιά του ανθρώπου. «Δος μοί, υιέ, σήν καρδίαν»[32]. Άμα Του δώση ο άνθρωπος την καρδιά του, μετά ο Θεός του δίνει και ό,τι αγαπά η καρδιά του, αρκεί να μην τον βλάψη. Μόνο στον Χριστό όταν δίνεται η καρδιά δεν χαραμίζεται, και μόνο στον Χριστό βρίσκεις πλούσια ανταπόκριση θεϊκής αγάπης σ́ αυτήν την ζωή, και στην άλλη, την αιώνια, την θεία αγαλλίαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πρέπει να αποφεύγουμε τα κοσμικά πράγματα, για να μη μας παίρνουν την καρδιά, και να χρησιμοποιούμε τα απλά, μόνο για να εξυπηρετούμαστε. Να φροντίζουμε όμως να είναι στέρεα. Αν θέλω να χρησιμοποιώ ένα όμορφο πράγμα, δίνω όλη την καρδιά μου στην ομορφιά και για τον Θεό δεν μένει ούτε ένα κομματάκι. Περνάς από κάπου και βλέπεις ένα σπίτι με ωραία μάρμαρα, σχέδια, σκαλίσματα... Θαυμάζεις τις πέτρες, τα τούβλα και αφήνεις την καρδιά σου εκεί. Ή βλέπεις σε ένα κατάστημα έναν ωραίο σκελετό για τα γυαλιά σου και τον επιθυμείς. Αν δεν τον αγοράσεις, αφήνεις την καρδιά σου στο κατάστημα. Αν τον αγοράσεις, κρεμάς την καρδιά σου από τον σκελετό που φοράς! Ιδίως οι γυναίκες εύκολα κλέβονται. Λίγες είναι εκείνες που δεν χαραμίζουν στα μάταια την καρδιά τους. Θέλω να πώ, κλέβει ο διάβολος την πλούσια καρδιά που έχουν με όλα τα κοσμικά, τα χρωματιστά, τα γυαλιστερά. Χρειάζεται μία ένα πιάτο; Θα ψάξη να βρη πιάτο με λουλούδια. Λές και θα ξινίση το φαγητό, αν δεν έχη λουλούδια το πιάτο! Μερικές πνευματικές γυναίκες θα συγκινηθούν με σοβαρά σχέδια, με δικέφαλο αετό κ.λπ. Μετά ρωτάνε: «Γιατί δεν συγκινούμαι από τα πνευματικά;». Πώς να συγκινηθής, αφού η καρδιά σου είναι σκορπισμένη στα ντουλάπια, στα πιάτα; Δεν έχεις καρδιά, έχεις μόνον κρέας, που μέσα κάτι χτυπάει τίκ-τάκ, μηχανικά, σαν το ρολόι, ίσα για να περπατάς! Γιατί πάει λίγη καρδιά στο ένα, λίγη καρδιά στο άλλο και για τον Χριστό δεν μένει τίποτε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, και αυτές οι απλές επιθυμίες είναι αμαρτωλές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι επιθυμίες αυτές, όσο και αμαρτωλές να μην είναι, είναι χειρότερες από τις αμαρτωλές. Γιατί μία αμαρτωλή επιθυμία θα τον συγκλονίση τον άνθρωπο κάποια φορά και θα τον πειράξη η συνείδηση, όποτε θα κάνη μία προσπάθεια, θα μετανοήση, θα πη «ήμαρτον, Θεέ μού». Ενώ αυτές οι επιθυμίες, οι «καλές», δεν τον ανησυχούν. Νομίζει ότι πάει καλά. «Αγαπώ το καλό, αγαπώ το όμορφο, λέει. Άλλωστε και ο Θεός τα έκανε όλα όμορφα». Ναί, αλλά δεν πάει να στον Κτίστη η αγάπη του, πάει στο κτίσμα. Γι' αυτό καλά είναι να κόβουμε κάθε επιθυμία. Όταν κανείς κάνη μία προσπάθεια για τον Χριστό και θυσιάζη αυτό που αγαπάει και κάνη κάτι που δεν το αγαπάει – όσο καλό και να είναι αυτό που αγαπάει –, τότε ο Θεός του δίνει μεγαλύτερη ανάπαυση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η καρδιά, πριν καθαρισθή, έχει τις κοσμικές επιθυμίες και χαίρεται μ' αυτές. Όταν όμως εξαγνισθή, μετά στενοχωριέται με τις κοσμικές επιθυμίες, σιχαίνεται τις κοσμικές επιθυμίες και τότε οι χαρές είναι πνευματικές. Έτσι εξαγνίζεται η καρδιά, όταν σιχαθή τις κοσμικές επιθυμίες. Πριν τις σιχαθή, έλκεται από αυτές. Αλλά, βλέπεις, εμείς δεν θέλουμε να στενοχωρήσουμε λίγο τον παλαιό άνθρωπο, θέλουμε να κάνουμε τα χατήρια του παλαιού ανθρώπου. Πώς θα γίνουμε μετά μιμητές Χριστού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, δυσκολεύωμαι να κόψω μία επιθυμία μου, πρέπει να επιμείνω στον αγώνα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ακόμη και αν στενοχωρήται η καρδιά σου, επειδή δεν κάνεις αυτά  που την αναπαύουν, δεν πρέπει να υπακούσης στην καρδιά. Γιατί, αν υπακούσης, θα νιώθης μία χαρά κοσμική και μετά ένα άγχος, πάλι κοσμικό. Ενώ, αν δεν υπακούσης και στενοχωρηθή η καρδιά, επειδή δεν έκανες αυτά  που την αναπαύουν, και το χαίρεσαι αυτό, τότε έρχεται η θεία Χάρις. Και αυτός είναι ο σκοπός, να αποκτήσουμε την θεία Χάρη. Για να αποκτήσης δηλαδή την θεία Χάρη, πρέπει να κοπούν οι επιθυμίες, και καλές να είναι, να κοπή το θέλημα. Τότε ταπεινώνεται ο άνθρωπος καί, όταν ταπεινωθή, έρχεται μετά η θεία Χάρις. Όταν δυσαρεστηθή κοσμικά η καρδιά, τότε θα χαρή πνευματικά. Όσο μπορεί κανείς, να μάθη να αποφεύγη την κοσμική παρηγοριά, να κάνη εσωτερική εργασία πνευματική, για να αποκτήση την θεϊκή παρηγοριά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι κοσμικές χαρές είναι υλικές χαρές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνά κοσμικοί άνθρωποι λένε ότι αισθάνονται ένα κενό, ενώ έχουν όλα τα καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η πραγματική, η γνήσια χαρά βρίσκεται κοντά στον Χριστό. Αν συνδεθής μαζί Του με την προσευχή, θα δής πληρωμένη την ψυχή σου. Οι κοσμικοί την χαρά την ζητούν στις απολαύσεις. Μερικοί πάλι πνευματικοί άνθρωποι την ζητούν σε θεολογικές συζητήσεις, ομιλίες κ.λπ. Και όταν τελειώσουν αυτά, μένουν με ένα κενό και αναρωτιούνται τί θα κάνουν στην συνέχεια. Είτε αμαρτωλά είτε αδιάφορα είναι αυτά  με τα οποία ασχολούνται, το ίδιο είναι. Δεν πηγαίνουν τουλάχιστον να κοιμηθούν, να είναι ξεζαλισμένοι το πρωί στην δουλειά τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εκπληρώνοντας τις κοσμικές επιθυμίες της καρδιάς, δεν έρχεται η πνευματική χαρά, άγχος έρχεται. Η κοσμική χαρά φέρνει και το άγχος στους πνευματικούς ανθρώπους. Η κοσμική χαρά δεν είναι μόνιμη, αληθινή χαρά, είναι μία χαρά πρόσκαιρη, εκείνης της στιγμής. Αυτή είναι υλική χαρά, δεν είναι πνευματική, από υλικές χαρές όμως δεν «γεμίζει» η ψυχή του ανθρώπου. Ίσα-ίσα γεμίζει σαβούρα μέσα. Όταν νιώσουμε την πνευματική χαρά, δεν θα θέλουμε την υλική χαρά. «Χορτασθήσομαι εν τω οφθήναι μοί την δόξαν σου!»[33]. Η κοσμική χαρά δεν ξεκουράζει τον πνευματικό άνθρωπο, τον κουράζει. Βάλε έναν πνευματικό άνθρωπο σ́ ένα κοσμικό σπίτι. Δεν ξεκουράζεται. Και ο κοσμικός άνθρωπος νομίζει ότι ξεκουράζεται, αλλά βασανίζεται. Το αίρεται εξωτερικά, αλλά μέσα του δεν ευχαριστιέται, βασανισμένος είναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την κοσμική τάξη, Γέροντα, σε πιάνει ασφυξία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και ασφυξία τους πιάνει και τα θέλουν κιόλας, όπως ο βάτραχος τρέχει στο στόμα του φιδιού. Το φίδι κάθεται απέναντι από την στέρνα και κοιτάζει συνέχεια τον βάτραχο. Αν ξεγελασθή ο βάτραχος και κοιτάξη το φίδι, ηλεκτρίζεται, ζαλίζεται και τρέχει φωνάζοντας στο στόμα του φιδιού. Μετά το φίδι τον δαγκάνει και τον δηλητηριάζει, για να μη χτυπιέται. Τότε φωνάζει ο βάτραχος, αλλά, και να τον γλυτώσης, έχει δηλητηριασθή και θα ψοφήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί οι άνθρωποι χαίρονται με τα κοσμικά πράγματα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν σκέφτονται την αιωνιότητα οι σημερινοί άνθρωποι. Η φιλαυτία τους κάνει να ξεχνούν ότι θα χαθούν τα πάντα. Δεν έχουν συλλάβει το βαθύτερο νόημα της ζωής. Δεν νιώσανε άλλες, ουράνιες χαρές. Δεν σκιρτά η καρδιά τους για κάτι ανώτερο. Δίνεις λ.χ. σε κάποιον ένα κολοκύθι. «Τι ωραίο κολοκύθι!». λέει. Του δίνεις ανανά, «Ο ανανάς έχει λέπια», σού λέει και τον πετάει, γιατί δεν έφαγε ποτέ. Ή πές σε έναν τυφλοπόντικα: «Τί ωραίος είναι ο ήλιος!», αυτός πάλι θα χωθή μέσα στο χώμα. Όσοι αναπαύονται μέσα στον υλικό κόσμο, μοιάζουν με τα ανόητα πουλάκια που δεν θορυβούν μέσα στο αυγό, για να σπάσουν το τσόφλι και να βγουν έξω, να χαρούν τον ήλιο – το ουράνιο πέταγμα στην παραδεισένια ζωή –, αλλά παραμένουν ακίνητα και πεθαίνουν μέσα στο τσόφλι του αυγού.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το κοσμικό πνεύμα στην πνευματική ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές λέτε ότι ο τάδε άνθρωπος βλέπει με ευρωπαϊκό φακό και όχι με ανατολίτικο πνεύμα. Τί εννοείτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εννοώ ότι βλέπει με ευρωπαϊκό μάτι, με ευρωπαϊκή λογική, χωρίς πίστη, ανθρώπινα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και ποιό είναι το ανατολίτικο πνεύμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –«Ανατολή ανατολών και οι εν σκότει και σκιά...»[34]!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν λέω ότι ένας επίασε το ανατολίτικο πνεύμα και άφησε το ευρωπαϊκό πνεύμα, θέλω να πω ότι άφησε την λογική, τον ορθολογισμό, και επίασε την απλότητα και την ευλάβεια, γιατί αυτό είναι το ορθόδοξο πνεύμα στο οποίο αναπαύεται ο Χριστός, απλότης και ευλάβεια. Σήμερα, συχνά λείπει η απλότητα από τους πνευματικούς ανθρώπους, η αγία απλότητα που ξεκουράζει την ψυχή. Αν δεν αρνηθή κανείς το κοσμικό πνεύμα και δεν κινηθή απλά, να μη σκέφτεται δηλαδή πώς θα τον δούν ή τί θα πούν γι' αυτόν, τότε δεν συγγενεύει με τον Θεό, με τους Αγίους. Για να συγγενέψη, πρέπει να κινηθή στον πνευματικό χώρο. Όσο κανείς κινείται με απλότητα, ιδίως μέσα σε ένα Κοινόβιο, τόσο στρογγυλεύει, γιατί φεύγουν τα εξογκώματα των παθών. Αλλιώς κοιτάζει να φτιάξη έναν ψεύτικο άνθρωπο. Γι' αυτό να προσπαθήσουμε να πετάξουμε τον κοσμικό καρνάβαλο, για να αγγελοποιηθούμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ξέρετε τί κάνουν οι κοσμικοί και τί κάνουν οι πνευματικοί άνθρωποι; Οι κοσμικοί κοιτάζουν η αυλή τους να είναι καθαρή. Το σπίτι μέσα δεν τους ενδιαφέρει αν έχη σκουπίδια. Σκουπίζουν την αυλή και πετούν τα σκουπίδια μέσα στο σπίτι! Σού λέει: «Οι άλλοι την αυλή βλέπουν, δεν βλέπουν μέσα το σπίτι». Μέσα μου δηλαδή ας έχω σκουπίδια, όχι όμως έξω! Τους ενδιαφέρει να τους καμαρώνουν οι άλλοι. Ενώ οι πνευματικοί άνθρωποι κοιτάζουν το σπίτι μέσα να είναι καθαρό. Δεν τους ενδιαφέρει τί θα πη ο κόσμος, γιατί ο Χριστός κατοικεί στο σπίτι, στην καρδιά, δεν κατοικεί στην αυλή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικές φορές όμως και πνευματικοί άνθρωποι κινούνται επιφανειακά, κοσμικά, και για να είμαστε πιο συγκεκριμένοι, φαρισαϊκά. Αυτοί οι άνθρωποι δεν σκέφτονται πώς θα πάνε στον Παράδεισο, κοντά στον Θεό, αλλά πώς θα φανούν εδώ καλοί. Στερούνται όλες τις πνευματικές χαρές, ενώ μπορούσαν να ζήσουν από 'δω τον Παράδεισο. Έτσι μένουν γήινοι άνθρωποι. Προσπαθούν να ζήσουν μία πνευματική ζωή με κοσμικό τρόπο. Μέσα τους όμως είναι άδειοι, δεν υπάρχει Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δυστυχώς, το κοσμικό πνεύμα έχει επιδράσει πολύ και στους πνευματικούς ανθρώπους. Αν πνευματικοί άνθρωποι ενεργούν και σκέφτωνται κοσμικά, τί να κάνουν οι κοσμικοί; Είπα σε μερικούς να βοηθήσουν ναρκομανή παιδιά και μου είπαν: «Αν κάνουμε ένα ίδρυμα για ναρκομανείς, δεν θα μας δίνουν καμμιά περιουσία. Γι'' αυτό θα κάνουμε Γηροκομείο». Δεν λέω ότι το Γηροκομείο δεν χρειάζεται. Αλλοίμονο! Αλλά, αν ξεκινούμε έτσι, αυτά  δεν θα είναι ευαγή αλλά... «ναυαγή» ιδρύματα! Δεν καταλαβαίνουν ότι η κοσμική επιτυχία είναι αποτυχία πνευματική.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το κοσμικό πνεύμα στον Μοναχισμό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, πολλοί μας λένε: «Ζήτε στον Παραδεισο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να κάνετε ευχή να μην χάσετε τον άλλο Παράδεισο. Εγώ θα αναπαυόμουν να εντυπωσιάζονταν οι κοσμικοί από την πνευματική σας εξέλιξη, χωρίς να το καταλαβαίνατε εσείς – εξ αιτίας της πνευματικής σας εξελίξεως – και χωρίς να το επιδιώκατε εσείς, αλλά να γινότανε μόνο του αυτό, εσωτερικά και φυσιολογικά. Προσπαθήστε να μη χάνεσθε με χαμένα πράγματα, για να μη χάσετε τον Χριστό. Όσο μπορείτε, προσπαθήστε να αποκτάτε συνείδηση μοναχική. Ζήστε πνευματικά σαν μοναχές, μην ξεχνάτε τον Χριστό, για να σάς θυμάται και Εκείνος. Σκοπό δεν έχω να σάς στενοχωρώ, αλλά να σάς βοηθώ, να σάς στηρίζω. Προσπαθήστε να διακρίνετε το κοσμικό πνεύμα πού, όταν μπαίνη στο Μοναχισμό, στενοχωρεί τον ίδιο τον Χριστό, και να το αποβάλλετε σαν ξένο πνεύμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δυστυχώς το κοσμικό πνεύμα από τον κόσμο έχει μπή και σε πολλά Μοναστήρια, γιατί μερικοί Πατέρες της εποχής μας διοχετεύουν τον Μοναχισμό από το κοσμικό κανάλι και δεν οδηγούνται οι ψυχές στο πατερικό πνεύμα της Χάριτος. Βλέπω ένα πνεύμα που επικρατεί σήμερα στα Μοναστήρια αντί-πατερικό, να μη δέχωνται το καλό, το πατερικό, να μη ζουν δηλαδή πατερικά και να ισοπεδώνουν τα πνευματικά υψώματα εν ονόματι της υπακοής, της κοπής του θελήματος, και να κάνουν τα κοσμικά τους ανάλογα θελήματα. Έτσι δεν κάνουν προκοπή, γιατί έχουν κοινοβιασμένο και τον πειρασμό, το κοσμικό πνεύμα. Τις εντολές του Θεού δεν έχουμε δικαίωμα να τις ερμηνεύουμε όπως μας συμφέφει, ούτε και τον Μοναχισμό έχουμε δικαίωμα να τον παρουσιάζουμε όπως θέλουμε. Άλλο είναι το να αναγωνρίζουμε τις αδυναμίες μας και να ζητούμε ταπεινά το έλεος του Θεού. Το μεγαλύτερο κακό για μένα είναι το ότι μερικοί θεωρούν πρόοδο το κοσμικό αυτό πνεύμα. Ενώ θα έπρεπε να το αισθανθούν ως πτώση και να το εμέσουν, για να καθαρισθούν πνευματικά και να έρθη αμέσως το Άγιο Πνεύμα. Το Άγιο Πνεύμα είναι που αγιάζει, πληροφορεί και στηρίζει τις ψυχές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι και μερικοί που λένε: «Πρέπει να παρουσιάσουμε τον πολιτισμό μας». Ποιόν πολιτισμό να παρουσιάσουμε; Τον κοσμικό πολιτισμό; Εμείς κανονικά, σαν μοναχοί, πρέπει να παρουσιάσουμε τον πνευματικό πολιτισμό μας, την πνευματική εξέλιξη. Που είναι η πνευματική εξέλιξη; Να μην πάμε να ξεπεράσουμε τους κοσμικούς στην κοσμική εξέλιξη. Τους κοσμικούς τους βασανίζει αυτή η εξέλιξη η κοσμική, πόσο μάλλον τον μοναχό! Εμείς έπρεπε να τρέχουμε τόσο πολύ πνευματικά, για να κάνουν κάτι και οι κοσμικοί. Αν κάνουμε εμείς ό,τι κάνει ένας πολύ πνευματικός λαϊκός, και αυτό πάλι δεν τους βοηθάει, γιατί αυτοί έχουν παράδειγμα έναν λαϊκό πολύ πνευματικό. Πρέπει να τους ξεπεράσουμε εμείς. Ο μοναχός δεν πρέπει να έχη σαν σκοπό να παρουσιάση μία εξέλιξη κοσμική. Αυτό είναι βρισιά για τον Μοναχισμό. Ο μοναχός που σκέφτεται κοσμικά, φαίνεται ότι λάθεψε τον δρόμο του, ενώ ξεκίνησε για τον Χριστό, η ψυχή του πάει στον κόσμο. Με την κοσμική εξέλιξη, η οποία θεωρείται πρόοδος, οδηγείται σε αποσύνθεση πνευματική ο Μοναχισμός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσα πράγματα χάνονται-χάνονται και στον Μοναχισμό, όπως στον κόσμο χάνονται η τιμή, ο σεβασμός, και τα λένε κατεστημένα! Γι' αυτό πονάω και πάω να σκάσω. Μου έρχεται να πάρω τα βουνά. Ένας που δεν έχει ζήσει κάτι το ανώτερο, δεν στενοχωριέται και τόσο πολύ για την πνευματική ζωή που ζη με τον δικό του τρόπο. Για τον άλλον όμως που αναγκάζεται να ζη με αυτόν τον τρόπο, ξέρετε τί βάσανο είναι; Αν με αξίωνε ο Χριστός να ζούσα όπως ήθελα μοναχικά και να πέθαινα παλληκαρίσια, θα το θεωρούσα σαν να πέθαινα στην πρώτη γραμμή. Αξίζει τώρα να πεθάνη κανείς, να δώση μία ομολογία, να κάνη μία θυσία, μόνο για να μη βρίζωνται οι Άγιοι Πατέρες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δεν σκεφτόμαστε λίγο τους Οσίους Πατέρες, τους οποίους διαβάζουμε συνέχεια, που ζούσαν και πώς ζούσαν; Ο Κύριος είπε: «Αι αλώπεκες φωλεούς έχουσιν, ο δε Υιός του ανθρώπου ουκ έχει που την κεφαλήν κλίνη»[35]. Φοβερό! Και βλέπεις πώς προσπαθούσαν να μιμηθούν τον Χριστό μέσα στις σπηλιές! Ενίωθαν την χαρά του Χριστού, γιατί μιμούνταν τον Χριστό σε όλα. Όλο το ενδιαφέρον τους ήταν εκεί. Οι Άγιοι Πατέρες έκαναν την έρημο πνευματική πολιτεία και σήμερα την κάνουμε κοσμική πολιτεία. Η εκκλησία του Χριστού φεύγει στην έρημο να σωθή, και εμείς την έρημο την κάνουμε κοσμική πολιτεία, για να σκανδαλισθούν οι άνθρωποι και να μη βοηθηθούν, και μετά να μην έχουν από που να πιασθούν. Αυτόν τον μεγάλο κίνδυνο βλέπω αυτά  τα δύσκολα χρόνια που περνούμε. Ενώ πρέπει για έναν λόγο παραπάνω σήμερα να ζούμε πιο μοναχικά, για να έχουμε θεϊκές δυνάμεις, δυστυχώς αλλοιωνόμαστε από το κοσμικό πνεύμα και αποδυναμωνόμαστε. Δηλαδή διώχνουμε το πνεύμα μας, και μένει το πτώμα μας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα υπάρχουν μοναχοί που ζουν εξωτερικά τον Μοναχισμό. Δεν καπνίζουν, ζουν αγνά, διαβάζουν Φιλοκαλία, μιλούν όλο από τους Πατέρες. Όπως δηλαδή στον κόσμο, όσοι δεν έλεγαν ψέματα, έκαναν τον σταυρό τους, πήγαιναν στην Εκκλησία καί, όταν μεγάλωσαν, προσεχαν λίγο το θέμα της ηθικής, νόμιζαν ότι αυτό ήταν όλο, έτσι γίνεται και σε μερικά Μοναστήρια και οι λαϊκοί έλκονται. Αλλά, όταν τους γνωρίσουν, βλέπουν ότι δεν διαφέρουν από τους κοσμικούς, γιατί διατηρούν όλο το κοσμικό πνεύμα. Αν κάπνιζαν, διάβαζαν εφημερίδες, μιλούσαν για πολιτικά, θα τους απέφευγαν σαν κοσμικούς και δεν θα βλαπτόταν ο Μοναχισμός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο μοναχός αποδυναμώνεται πνευματικά, με τί θα συγκινήση τον κοσμικό; Το οινόπνευμα, αν το αφήσουμε ανοιχτό το μπουκάλι, χάνει όλη την σπιρτάδα. Ούτε τα μικρόβια σκοτώνει ούτε φλόγα μπορεί να βγάλη, αν το ανάψης. Και αν το βάλης στο καμινέτο, θα χαλάση και το φιτίλι. Έτσι και ο μοναχός, αν δεν προσέξη, διώχνει την θεία Χάρη και μετά έχει μόνο το σχήμα. Είναι σαν το οινόπνευμα που έχασε την σπιρτάδα του. δεν μπορεί να καυτηριάση τον διάβολο. «Φως μοναχοίς Άγγελοι, φως κοσμικοίς μοναχοί»[36]! Ούτε φως είναι μετά. Το κοσμικό φρόνημα ξέρετε πόσο καταστρέφει; Αν φύγη αυτό το πνευματικό από τον Μοναχισμό, δεν μένει τίποτε. Γιατί «άν το άλας μωρανθή»[37], δεν κάνει ούτε για κοπριά. Ενώ τα σκουπίδια γίνονται κοπριά, το αλάτι δεν γίνεται κοπριά. Αν το βάλης στο φυτό, θα το κάψη. Σήμερα είναι μία εποχή που πρέπει να λάμπη ο Μοναχισμός. Σ́ αυτήν την σαπίλα είναι που χρειάζεται το «αλάτι». Αν τα Μοναστήρια δεν έχουν κοσμικό φρόνημα και έχουν πνευματική κατάσταση, αυτό θα είναι η μεγαλύτερη προσφορά τους στην κοινωνία. Δεν θα χρειάζεται ούτε να μιλούν ούτε να κάνουν τίποτε άλλο, γιατί θα μιλούν με την ζωή τους. Από αυτό έχει ανάγκη σήμερα ο κόσμος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είδατε και οι Καθολικοί που έφθασαν; Θυμάμαι πριν από χρόνια, όταν ήμουν στην Μονή Στομίου, στην Κόνιτσα, μου έφερε κάποιος ένα απόκομμα από μία εφημερίδα που έγραφε: «Τριακόσιες καλογριές διαμαρτυρήθηκαν, γιατί να μην παρακολουθήσουν ένα κινηματογραφικό έργο, γιατί τα φορέματά τους να είναι μέχρι κάτω και όχι μέχρι το γόνατο». Τόσο αγανάκτησα, όταν το διάβασα, που είπα: «Μά, γιατί να γίνετε καλόγριες τέλος πάντων;». Και τελικά έγραφε ότι τα πέταξαν τα ράσα. Αν και έτσι που σκέφτονταν, πεταμένα τα είχαν και από πρίν. Μία φορά πάλι είδα μία καθολική καλόγρια που δεν διέφερε καθόλου από μία κοσμικιά. Έκανε δήθεν έργο ιεραποστολικό και ήταν τελείως..., όπως μερικές πολύ κοσμικές κοπέλες. Να μην επιτρέψουμε να μπή και σ́ εμάς αυτό το πνεύμα το ευρωπαϊκό, να μη φθάσουμε και εμείς εκεί.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου φαίνεται δύσκολο να πετάξω το κοσμικό φρόνημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν είναι δύσκολο, εγρήγορση χρειάζεται. Να σκέφτεσαι συνέχεια αυτό που έλεγε ο Μέγας Αρσένιος:«Δι’ ό εξήλθες;...»[38]Εμείς ξεχνούμε γιατί ήρθαμε στο Μοναστήρι. Λίγο-πολύ όλοι καλά ξεκινάνε, αλλά καλά δεν καταλήγουν, επειδή ξεχνούν γιατί πήγαν στο Μοναστήρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είπατε, Γέροντα, ότι το κοσμικό πνεύμα μπαίνει στον Μοναχισμό και χάνεται η πνευματική αντιμετώπιση. Θα διασωθή το σωστό πνεύμα του Μοναχισμού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μία μπόρα είναι, δεν θα αφήση ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μου πέρασε ο λογισμός: «Υπάρχουν ακόμη συνοδίες που πορεύοναι πνευματικά;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό έλειπε ακόμα, να μην υπάρχουν. Τότε θα μας πήγαινε η Παναγία συνδεία στην φυλακή... Υπάρχουν μοναχοί που ζουν πολύ πνευματικά, αθόρυβα. Υπάρχουν ψυχές σε κάθε Μοναστήρι, σε κάθε Μητρόπολη κ.λπ. Οι μεμονωμένες ψυχές, αυτές είναι που συγκινούν τον Θεό και μας ανέχεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το κοσμικό πνεύμα είναι αρρώστια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το σπουδαιότερο σήμερα είναι να μην προσαρμοσθή κανείς με αυτό το κοσμικό πνεύμα. Είναι μία μαρτυρία. Όσο μπορούμε, να μην παρασυρθούμε από αυτό το ρεύμα και μας πάρη σβάρνα αυτό το κανάλι. Τα έξυπνα ψάρια δεν πιάνονται στο αγκίστρι. Βλέπουν το δόλωμα, καταλαβαίνουν ότι είναι δόλωμα και φεύγουν από 'κει και γλυτώνουν. Ενώ τα άλλα βλέπουν το δόλωμα, τρέχουν εκεί να φάνε καί, τάκ, πιάνονται! Έτσι δηλαδή και ο κόσμος έχει το δόλωμα και πιάνει τους ανθρώπους. Έλκονται οι άνθρωποι από το κοσμικό πνεύμα και πιάνονται μετά από αυτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το κοσμικό φρόνημα είναι αρρώστια. Όπως μία αρρώστια την αποφεύγει κανείς, έτσι και το κοσμικό φρόνημα πρέπει να το αποφεύγη, όπου και αν είναι. Να αποξενωθή από το πνεύμα της κοσμικής εξελίξεως, για να εξελίσσεται πνευματικά, να υγιαίνη πνευματικά και να χαίρεται αγγελικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Η αδικία είναι μεγάλη αμαρτία
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αδικία μαζεύει οργή Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μεγάλη υπόθεση να έχη ο άνθρωπος την ευλογία του Θεού! Πλούτος είναι! Ό,τι έχει ευλογία, στέκει, δεν γκρεμίζεται. Ό,τι δεν έχει ευλογία, δεν στέκει. Η αδικία είναι μεγάλη αμαρτία. Όλες οι αμαρτίες έχουν ελαφρυντικά, η αδικία δεν έχει, μαζεύει οργή Θεού. Φοβερό! Αυτοί που αδικούν, βάζουν φωτιά στο κεφάλι τους. Από την μία μεριά βλέπεις να κάνουν μία αδικία και από την άλλη να πεθαίνουν δικοί τους άνθρωποι και να μη δίνουν σημασία. Πώς να κάνουν προκοπή οι άνθρωποι με τόσες αδικίες; Κάνουν αυτά  που κάνουν, δίνουν δικαιώματα και στον διάβολο, γι'' αυτό μετά περνούν δοκιμασίες, τους βρίσκουν αρρώστιες κ.λπ. και σού λένε: «Κάνε προσευχή να γίνω καλά».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα περισσότερα κακά που συμβαίνουν είναι από αδικίες. Όταν λ.χ. μαζεύεται με αδικία η περιουσία, ζουν οι άνθρωποι λίγα χρόνια σαν αρχοντόπουλα και μετά τα δίνουν, όσα μάζεψαν, στους γιατρούς. Τί λέει ο Ψαλμός;«Κρείσσον ολίγον τω δικαίω υπέρ πλούτον αμαρτωλών πολύν»[39]. «Ανεμομαζώματα, ανεμοσκορπίσματα». Όσα μαζεύουν, φεύγουν, όλα εξανεμίζονται. Σπάνια, σε πολύ λίγους συμβαίνει να είναι οι αρρώστιες, οι χρεωκοπίες κ.λπ. μία δοκιμασία του Θεού. Αυτοί θα έχουν καθαρό μισθό. Σ́ αυτήν την περίπτωση συνήθως γίνονται ύστερα πιο πλούσιοι, σαν τον Ιωβ. Αλλά, και πολλοί άνθρωποι που βγαίνουν άλειωτοι, είναι και από αυτό, κάποια αδικία έχουν κάνει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο άδικος βασανίζεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άδικος, και γενικά κάθε ένοχος, όταν δεν ζητήση συγχώρηση, ταλαιπωρείται από την συνείδησή του και επιπλέον από την αγανάκτηση του αδικημένου. Γιατί, όταν ο αδικημένος δεν τον συγχωρήση και γογγύζη, τότε ο άδικος ταλαιπωρείται πολύ, βασανίζεται. Δεν μπορεί να κοιμηθή. Σαν να τον χτυπούν κύματα και τον φέρνουν σβούρα. Είναι μυστήριο πράγμα το πώς το πληροφορείται! Όπως, όταν ένας αγαπά κάποιον και τον σκέφτεται με την καλή έννοια, εκείνος το πληροφορείται, έτσι και σ́ αυτήν την περίπτωση. Ώ, ο γογγυσμός του άλλου τον κάνει άνω-κάτω! Και μακριά να είναι, τί στην Αυστραλία, τί στο Γιοχάννεμπουργκ, δεν μπορεί να ησυχάση, όταν είναι αγανακτισμένος ο άλλος εξ αιτίας του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είναι αναίσθητος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι αναίσθητοι λές ότι δεν υποφέρουν; Το πολύ-πολύ να καταφύγουν σε καμμιά ψυχαγωγία, για να ξεχασθούν. Μπορεί πάλι ο αδικημένος να τον συγχώρησε τον ένοχο, αλλά να έχη μείνει λίγη αγανάκτηση μέσα του. τότε και ο ίδιος ταλαιπωρείται σε έναν βαθμό, αλλά ο ένοχος ταλαιπωρείται πολύ από την αγανάκτηση του άλλου. Αν όμως ο ένοχος ζητήση συγνώμη και δεν του την δώση ο αδικημένος, τότε ταλαιπωρείται εκείνος. Δεν υπάρχει μεγαλύτερη φωτιά από το εσωτερικό κάψιμο της ψυχής από την συνείδηση. Την βασανίζει και την τρώει συνέχεια με το σαράκι σ́ ετούτη την ζωή και πιο πολύ φυσικά θα την τρώη στην άλλη ζωή, την αιώνια, «ο ακοίμητος σκώληξ», αν δεν μετανοήση ο άνθρωπος σ́ αυτήν την ζωή και δεν επιστρέψη τις αδικίες του στους συνανθρώπους του, έστω και με την αγαθή του προαίρεση, σε περίπτωση που δεν μπορεί με άλλον τρόπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι ένας δικηγόρος, που έκανε πολλές αδικίες, πόσο βασανίσθηκε στο τέλος της ζωής του. εξασκούσε το επάγγελμά του σε μία επαρχία που είχε πολλούς κτηνοτρόφους. Εκεί, φυσικά, γίνονταν και αγροζημίες και πολλοί βοσκοί έτρεχαν σ́ αυτόν τον δικηγόρο, γιατί με πονηρά επιχειρήματα έπειθε και τον αγρονόμο και τον ειρηνοδίκη. Έτσι οι καημένοι γεωργοί πολλές φορές όχι μόνο δεν έβρισκαν το δίκαιο για τα σπαρτά που τους κατέστρεφαν τα κοπάδια, αλλά έβρισκαν και τον μελά τους. Όλοι τον ήξεραν τον δικηγόρο αυτόν και κανείς τίμιος άνθρωπος δεν τον πλησίαζε. Ακόμη και ο Πνευματικός να δήτε τί συμβούλεψε έναν ευαίσθητο βοσκό. Ο βοσκός αυτός είχε ένα μικρό κοπάδι και μία σκύλα. Μία φορά που η σκύλα είχε γεννήσει, έδωσε τα κουταβάκια σε άλλους και κράτησε μόνον την μάνα. Εκείνο το διάστημα είχε χαθή μία προβατίνα και είχε αφήσει το αρνάκι της που θήλαζε. Αυτό, επειδή δεν είχε μάνα, έτρεχε πίσω από την σκύλα και θήλαζε από αυτήν, η οποία ενίωθε και η ίδια ανακούφιση. Έτσι τα δύο ζώα είχαν συνηθίσει και το ένα έβρισκε το άλλο. Ο καημένος ο βοσκός, όσο και να προσπαθούσε να τα ξεχωρίση, εκείνα έσμιγαν. Επειδή ήταν ευαίσθητος ο βοσκός, σκέφθηκε να ρωτήση τον Πνευματικό εάν τελικά τρώγεται το κρέας του αρνιού ή όχι. Ο Πνευματικός, έχοντας υπ'' όψιν του και την φτώχεια του βοσκού, σκέφτηκε λίγο και του είπε: «Το αρνί αυτό, παιδί μου, δεν τρώγεται, γιατί θήλασε από την σκύλα, αλλά ξέρεις τί να κάνεις; Επειδή όλοι οι άλλοι βοσκοί πηγαίνουν δώρα στον δικηγόρο τον δείνα αρνιά και τυριά, να του πάς και συ αυτό το αρνί να το φάη. Μόνον αυτός έχει ευλογία να το φάη, γιατί όλος ο κόσμος ξέρει που είναι άδικος». Όταν είχε γεράσει πια ο άδικος αυτός δικηγόρος και έπεσε στο κρεββάτι, υπέφερε χρόνια από εφιάλτες και δεν μπορούσε να κοιμηθή. Τον χτύπησε και ημιπληγία και δεν μπορούσε ούτε να μιλήση. Προσπάθησε ο Πνευματικός να τον κάνη τουλάχιστον να γράψη τις αμαρτίες του, αλλά είχε χάσει και τον έλεγχο, και αναγκαζόταν να του διαβάζη την ευχή των Επτά Παίδων, για να κλείση λίγο τα μάτια του να κοιμηθή. Του διάβαζε και εξορκισμούς, για να γαληνέψη λίγο, μέχρι που αναπαύθηκε, και ας ευχηθούμε ο Θεός να τον αναπαύση πραγματικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλοί πιστεύουν ότι τους έχουν κάνει μάγια. Πιάνουν τα μάγια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εάν ο άνθρωπος έχη μετάνοια και εξομολογήται, δεν πιάνουν. Για να πιάσουν τα μάγια, θα έχη δώσει κάποιο δικαίωμα ο άνθρωπος. Θα αδίκησε κάποιον, θα κοροϊδεύη καμμιά κοπέλα κ.λπ. Τότε θα πρέπη να μετανοήση, να ζητήση συγχώρηση, να εξομολογηθή, να τακτοποιηθή και να επανορθώση αυτό που έκανε. Γιατί αλλιώς, και όλοι οι παπάδες να του διαβάσουν εξορκισμούς, δεν λύνονται τα μάγια. Αλλά και μάγια να μην του έκαναν, και μόνον το άχτι της αδικημένης ψυχής αρκεί για να τον βασανίζη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Υπάρχουν δύο μορφές αδικίας, η υλική και η ηθική. Υλική αδικία είναι, όταν αδική κανείς τον άλλον σε υλικά πράγματα. Ηθική είναι, όταν λ.χ. κάποιος γελάση μία κοπέλα, και αν μάλιστα είναι ορφανή, με πενταπλάσιο βάρος βαραίνει την ψυχή του. στον πόλεμο η σφαίρα ξέρεις πώς κυνηγάει τους ανήθικους; εκεί βλέπεις έντονα την θεία δικαιοσύνη, την προστασία του Θεού. Ατιμία στον πόλεμο δεν σηκώνει. Ανήθικο άνθρωπο θα τον βρη σφαίρα. Μία φορά πηγαίναμε με την διλοχία μας να αντικαταστησουμε ένα τάγμα. Εν τω μεταξύ όμως μας χτύπησαν και ριχτήκαμε στην μάχη. Ένας, θυμάμαι, από εκείνο το τάγμα είχε κάνει την προηγούμενη μέρα μία ατιμία, είχε βιάσει μία έγκυο, την καημένη. Έ, σ́ εκείνη την επιχείρηση μόνον αυτός σκοτώθηκε!! Φοβερό! Όλοι έλεγαν μετά: «Το κτήνος, καλά έπαθε και σκοτώθηκε!». Ιδίως αυτοί που κάνουν πονηριές, που κοιτάζουν να ξεφύγουν από ''δω, να ξεφύγουν από ''κει, τελικά δεν γλυτώνουν. Είναι παρατηρημένο ότι όσοι πιστεύουν πολύ, φυσικά ζούνε και τίμια, χριστιανικά, και το σώμα τους το τίμιο προστατεύεται από τα πυρά περισσότερο απ'' ό,τι αν φορούσαν Τιμιόξυλο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αδικία ταλαιπωρεί και τους απογόνους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν έφυγα για μοναχή, οι δικοί μου φέρθηκαν άδικα. Μπορώ να ζητήσω αυτό που μου δίνεται από τον νόμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν ταιριάζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φοβάμαι μήπως τους βρη κανένα κακό από την αδικία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νά, αυτό είναι το καθαρό φιλότιμο! Αν ήμουν εγώ στην θέση σου, θα τους έλεγα: «Εγώ για τον εαυτό μου δεν θέλω τίποτε. Το μερίδιο όμως που μου ανήκει, θα ήθελα να το μοιράσετε με τα χέρια σας στους φτωχούς. Δώστε πρώτα στους φτωχούς συγγενείς. Σάς το λέω αυτό, για να μη φθάση στα παιδιά σας η οργή του Θεού». Γιατί μπορεί καμμιά φορά ο πατέρας να δώση κάτι για την ψυχή του, για να γίνη λ.χ. ένα Ίδρυμα, και να μην αφήση κάτι στο παιδί του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μπορεί σε μία οικογένεια ο παππούς ή η γιαγιά να έκαναν αδικίες και αυτοί να είναι καλά. Όμως τα παιδιά ή τα εγγόνια τους παιδεύονται. Αρρωσταίνουν και αναγκάζονται να δίνουν στους γιατρούς όσα μαζεύτηκαν με αδικίες, για να εξοφλήσουν οι παππούδες τους. Κάποτε σε μία γνωστή μου οικογένεια συνέβαιναν πολλές δοκιμασίες. Είχε αρχίσει από τον αρχηγό της οικογενείας αρρώστια βαρειά, ταλαιπωρία, έμεινε κατάκοιτος λίγα χρόνια και μετά πέθανε. Στην συνέχεια πέθανε η γυναίκα του και ύστερα τα παιδιά του, το ένα κοντά στο άλλο. Πρόσφατα πέθανε και το τελευταίο, το πέμπτο παιδί. Από πολύ πλούσια οικογένεια που ήταν, κατήντησε η πιο φτωχή, γιατί πουλούσαν τα κτήματα όσο-όσο, για να πληρώνουν γιατρούς και έξοδα διάφορα. Απορούσα γι'' αυτήν την οικογένεια: «Πώς συμβαίνουν τόσες αρρώστιες και ατυχήματα σ́ αυτούς!». Στα άτομα της οικογένειας που γνώρισα, δεν φαινόταν η καλή περίπτωση, δηλαδή να τους δοκιμάζη ο Θεός σαν εκλεκτούς, αλλά μάλλον να λειτουργούν οι πνευματικοί νόμοι του Θεού. Για να είμαι πιο σίγουρος, προσπάθησα να μάθω από αξιόλογα γεροντάκια, συμπατριώτες τους, και έμαθα τα εξής: Ο άνθρωπος αυτός είχε βρει μία σχετική περιουσία από τον πατέρα του, αλλά στην συνέχεια την αύξησε με αδικίες. Δηλαδή, εάν του ζητούσε μία χήρα δανεικά, για να παντρέψη την κόρη της, και θα του τα έδινε όταν θα αλώνιζε, αυτός της ζητούσε ένα οικόπεδο που είχε. Και εκείνη επάνω στην ανάγκη το έδινε όσο-όσο. Άλλος του ζητούσε δάνειο να πληρώση την Τράπεζα και θα του το επέστρεφε μόλις μάζευε τα βαμβάκια. Εκείνος του ζητούσε ένα χωράφι που είχε, και στην ανάγκη ο άλλος το έδινε όσο-όσο, για να μην τον κυνηγήση η Τράπεζα. Άλλος του ζητούσε λίγα δανεικά, για να πληρώση τους γιατρούς, και αυτός του ζητούσε την αγελάδα που είχε. Εκείνος ο καημένος την έδινε όσο-όσο. Με αυτόν τον τρόπο μάζεψε μία μεγάλη περιουσία. Όλος όμως ο γογγυσμός των πονεμένων ανθρώπων χτύπησε όχι μόνο σ́ αυτόν και στην γυναίκα του, αλλά και στα παιδιά του ακόμη. Έτσι λειτούργησαν οι πνευματικοί νόμοι και έκαναν και εκείνοι το ίδιο, για να πληρώσουν δηλαδή τους γιατρούς και τα έξοδα από τις αρρώστιες, τα ατυχήματα κ.λπ., πουλούσαν όσο-όσο τα κτήματα, και από πολύ πλούσιοι έγιναν φτωχοί, και ένας-ένας έφυγαν όλοι. Ο Θεός φυσικά θα τους κρίνη με την πολλή Του αγάπη και δικαιοσύνη ανάλογα. Οι άλλοι πάλι που αναγκάσθηκαν, επάνω στην ανάγκη που βρίσκονταν, να πουλήσουν ό,τι είχαν, για να ξεχρεώσουν χρέη σε γιατρούς κ.λπ. και φτώχεψαν, θα ανταμειφθούν για την αδικία που δοκίμασαν ανάλογα. Βέβαια και οι άδικοι εξοφλούν και αυτοί ανάλογα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αυτός που μας αδικεί, μας ευεργετεί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς να βλέπουμε αυτόν που μας αδικεί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να τον βλέπουμε; Σαν έναν μεγάλο ευεργέτη μας, που μας κάνει καταθέσεις στο Ταμιευτήριο του Θεού.Μας κάνει πλούσιους αιώνια. Μικρό πράγμα είναι αυτό; Τον ευεργέτη μας δεν τον αγαπούμε; Δεν του εκφράζουμε την ευγνωμοσύνη μας; Έτσι και αυτόν που μας αδικεί να τον αγαπούμε και να τον ευγνωμονούμε, γιατί μας ευεργετεί αιώνια. Οι άδικοι αδικούνται αιώνια, ενώ όσοι δέχονται με χαρά την αδικία δικαιώνονται αιώνια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας ευλαβής οικογενειάρχης δοκίμασε πολλές αδικίες στην δουλειά του. είχε όμως πολλή καλωσύνη και όλα τα υπέμεινε χωρίς να γογγύση. Ήρθε κάποτε στο Καλύβι και μου τα είπε. Μετά με ρωτάει: «Τί με συμβουλεύεις να κάνω;». «Έτσι να κάνεις, του λέω, να αποβλέπης στην θεία δικαιοσύνη και στην θεία ανταπόδοση και να υπομένης. Τίποτε δεν πάει χαμένο. Με αυτόν τον τρόπο αποταμιεύεις στο Ταμιευτήριο του Θεού. Στην άλλη ζωή σίγουρα θα έχης να λάβης γι'' αυτήν την δοκιμασία που περνάς. Αλλά να ξέρης, ο Καλός Θεός και σ́ αυτήν την ζωή αμείβει τον αδικημένο. Αν όχι πάντοτε τον ίδιο, οπωσδήποτε τα παιδιά του. Ξέρει ο Θεός. Έχει πρόνοια για το πλάσμα Του». Άμα κάνη κανείς υπομονή, έρχονται τα πράγματα στην θέση τους. Τα οικονομάει ο Θεός. Χρειάζεται όμως υπομονή χωρίς λογική. Αφού ο Θεός βλέπει, παρακολουθεί, να παραδίνεται εν λευκώ στον Θεό. Βλέπεις, ο Ιωσήφ[40]δεν μίλησε, όταν τον πούλησαν οι αδελφοί του για δούλο. Μπορούσε να πή: «Είμαι αδελφός τους». Δεν μίλησε όμως, και μετά μίλησε ο Θεός και τον έκανε βασιλιά. Άμα όμως κανείς δεν κάνη υπομονή, είναι βάσανο. Από ''κει και πέρα θέλει να του έρχωνται τα πράγματα όπως του ταιριάζει, όπως αναπαύεται. Και ανάπαυση φυσικά δεν βρίσκει και ούτε του έρχονται όλα έτσι όπως τα θέλει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εάν κανείς αδικηθή σ́ αυτήν την ζωή από ανθρώπους ή από δαίμονες, δεν ανησυχεί ο Θεός, γιατί κέρδος προξενείται στην ψυχή. Πολλές φορές όμως λέμε ότι μας αδικούν, ενώ στην ουσία αδικούμε εμείς. Εδώ θέλει προσοχή να πιάνουμε τον εαυτό μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Τω τον φόρον τον φόρον...»[41]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν αγοράζουμε κάτι για το Μοναστήρι, μερικοί δεν δέχονται να μας κόψουν τιμολόγιο. Τί να κάνουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τιμολόγια να σάς κόβουν πάντοτε και εσείς να κόψετε τις απαιτήσεις σας. Να περιορίσετε τις ανάγκες σας και να φτιάχνετε μόνον ό,τι είναι απαραίτητο. Εγώ έτσι θα έκανα. Θα τα στείλη ο Θεός. Αν εμείς οι μοναχοί ζητάμε να μη μας κόβουν τιμολόγια, κάνουμε και τους άλλους να αμαρτάνουν. Λένε: «Αφού έτσι κάνουν τα Μοναστήρια...» Αν εμείς που θέλουμε να τηρήσουμε τις εντολές, κινούμαστε έτσι, ξέρετε πόσο σκανδαλίζουμε;«Τω τον φόρον τον φόρον», λέει η Γραφή. Εγώ, όταν στέλνω γράμμα όχι με το ταχυδρομείο αλλά με άνθρωπο, πάλι βάζω τα γραμματόσημα. Οι κοσμικοί δικαιολογούν τον εαυτό τους, αλλά και τα Μοναστήρια, αν κινούνται έτσι, δεν έχουν ειλικρίνεια και πάει το Ευαγγέλιο στην άκρη... Όταν δεν δίνουμε τα υλικά πράγματα –, αν σού αφαιρέση ένας τον χιτώνα, άφησε και το ιμάτιο»[42]–, κάνουμε αρνητικό κήρυγμα και οι κοσμικοί μετά δικαιολογούν τις πτώσεις τους. Κοιτάζουν να βρουν κάτι, για να αναπαύσουν λίγο την συνείδησή τους. Να προσέχουμε, γιατί θα είμαστε αναπολόγητοι την ημέρα της Κρίσεως. Σκοπός είναι εμείς να αμυνθούμε κυρίως στα πνευματικά και όχι μόνο στα υλικά. Όταν για κάποιο λόγο δεν σάς κόβουν τιμολόγια, να το θεωρήτε ζημιά πνευματική.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συμβαίνει καμμιά φορά, Γέροντα, να δώση κάποιος ένα μικρό ποσό ως δωρεά και να ζητήση απόδειξη για μεγαλύτερο. Τί να κάνουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να πήτε: «Δεν κόβουμε αποδείξεις για μεγαλύτερο ποσό. Αν δεν θέλετε έτσι, να σάς επιστρέψουμε τα χρήματα, μήπως κάπου αλλού μπορούν να σάς εξυπηρετήσουν». Μη σάς κολλήση καμμιά τέτοια αρρώστια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάποιος μάστορας, Γέροντα, ζήτησε να τον απολύσουμε από την δουλειά, να μπή στο Ταμείο Ανεργίας και να συνεχίση να δουλεύη σ́ εμάς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, βρέ παιδί, δεν είναι σωστό! Λίγη συνείδηση να έχη κανείς, δεν το κάνει αυτό! Δεν ταιριάζει σε Μοναστήρι να κάνη τέτοιο πράγμα! Προτιμότερο είναι, και ανάγκη να έχη το Μοναστήρι, να τον πληρώση διπλό μισθό, για να μην το κάνη. Τόσο βαρύ είναι! Η ευλογία φέρνει ευλογία και η αδικία φέρνει την καταστροφή. Αυτό πολύ να το προσέξετε. Ούτε να κάνετε παζάρια με τους μάστορες. Γι' αυτό μετά γίνονται πυρκαγιές και καταστροφές στα Μοναστήρια. Ένας υπάλληλος ορκίζεται να κάνη τίμια την δουλειά του. εμείς σαν μοναχοί δεν δίνουμε έναν τέτοιο όρκο αλλά διπλό, είναι πνευματική η υπόσχεση που δίνουμε καί, αν την παραβούμε, είναι διπλή η αμαρτία για μας. Προσέξτε να κρατήσετε μία ισοροπία, να υπάρχη κάτι διαφορετικό. Βλέπω μία πληγή να ωριμάζη. Θα σπάση, θα καθαρίση. Δεν δίνει την Χάρη Του ο Θεός σε λανθασμένη κατάσταση. Έτσι θα ήταν σαν να βοηθούσε τον διάβολο. Κοιτάξτε να υπάρχη ειλικρίνεια, τιμιότης. Αυτή η κατάσταση πάει σαν τον μεθυσμένο που τρικλίζει. Μπορεί να σταθή; Θα 'ρθει η οργή του Θεού. Θα δώσουμε εξετάσεις. Πρώτη φάση, θα χωρίση το μπακίρι από το χρυσάφι. Δεύτερη φάση, θα φανή πόσων καρατιών χρυσάφι είναι ο καθένας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο κόσμος κινείται στην ψευτιά. Οι άνθρωποι γίνονται ψεύτες. Έχουν φτιάξει άλλη συνείδηση. Δεν μπορώ να γίνω ψεύτης, να αλλάξω εαυτό, επειδή το απαιτεί η κοινωνία. Καλύτερα να ταλαιπωρηθώ. Θέλει προσοχή να μην μπή κανείς σ́ αυτήν την κοσμική τροχιά. Αλλά και όλο το οικονομικό σύστημα που υπάρχει σήμερα, δεν βοηθάει καθόλου. Οι άνθρωποι αναγκάζονται να δηλώνουν λιγότερα κ.λπ. Μάλλωσα κάτι εφοριακούς που ήταν πιστοί άνθρωποι. «Τι κάνετε; τους είπα. Κοιτάξτε να κρατηθή λίγο προζύμι. Έχω υπ'' όψιν μου γεγονότα πολλά! Ένας πάει στην Εφορία και λέει: «Έχω εισοδήματα ένα εκατομμύριο». Του βάζει ο εφοριακός ότι έχει τρία εκατομμύρια, γιατί υπάρχουν ορισμένοι που παρουσιάζουν το ένα τρίτο από τα εισοδήματά τους, όποτε με αυτό τους πιάνει όλους. Έτσι όμως, αν υπάρχη ένας ευσυνείδητος και εσείς τον κοπανάτε τριπλασιάζοντας τα έσοδά του, τον αναγκάζετε να γίνη κλέφτης. Δηλαδή, αντί να βοηθήσετε να αλλάξη λίγο η κατάσταση, κάνετε το αντιθετο». «Δεν καταλαβαίνουμε πότε μας λένε την αλήθεια», μου απαντούν. «Θα το καταλαβαίνετε, τους λέω, αν ζήτε πνευματικά. Τότε θα μπορήτε να κάνετε αυτήν την διάκριση. Θα σάς πληροφορή ο Θεός, για να καταλαβαίνετε».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Πώς ψεύτισε ο κόσμος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η κακία των ανθρώπων έχει ξεπεράσει τα όρια. Κοιτάζουν πώς να ξεγελάση ο ένας τον άλλον. Και το θεωρούν κατόρθωμα που τον ξεγελούν. Αλήθεια, πώς ψεύτισε ο κόσμος! Όλα ψεύτικα τα φτιάχνουν. Χρήματα εν τω μεταξύ παίρνουν περισσότερα απ' όσα έπαιρναν οι παλιοί, οι καημένοι. Γενικά όλα τα ψεύτισαν. Μία μέρα μου έφερε κάποιος ντοματιές. Κάθε φυτό ήταν σε ένα σακκουλάκι μικρούτσικο με χώμα χοντρό, μέλαγγα, αμμούδα χοντρή, για να κρατάη την υγρασία. Βαριούνται να ρίξουν λίγο νερό! Ούτε καν να βάλουν κοπριά, μόνον επάνω-επάνω είχε λίγη σαν το μαυροπίπερο! Όποτε, όταν τις έβγαλα από το σακκουλάκι, όλη η ρίζα ήταν σάπια. Έρριξα ένα στρώμα χώμα από πάνω, για να βγάλουν νέες ρίζες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και πώς ξεγελούν τον κόσμο! Να δήτε, μου είχαν φέρει ένα κουτί μεγάλο με γλυκά. «Θα το ανοίξω, είπα, όταν θα 'ρθή καμμιά παρέα μεγάλη. Ας μην το ανοίξω τώρα και πάνε μυρμήγκια». Μία μέρα μαζεύτηκαν κάμποσοι, υπολόγισα ότι θα φθάσουν και θα περισσέψουν κιόλας. Μόλις το ανοίγω, βλέπω μέσα φελιζόλ από 'δω, φελιζόλ από 'κει... Και ήταν τόοοσο μικρό αυτό που είχε τα γλυκά. Όλο το άλλο ήταν άδειο! Μία άλλη φορά μου έφεραν ένα επίσημο κουτί γλυκά δεμένο με κορδέλλες. «Θα το φυλάξω, είπα, για τα παιδιά της Αθωνιάδος». Και τελικά ήταν κάτι λουκούμια σκληρά, παλιά λουκούμια! Εγώ τέτοια λουκούμια δεν τα δίνω. Δίνω στον κόσμο κανένα μαλακό λουκούμι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν καταλαβαίνουν ότι αυτό είναι αδικία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το θεωρούν κατόρθωμα. Γιατί η αμαρτία έχει γίνει μόδα τώρα και η αδικία θεωρείται εξυπνάδα. Το κοσμικό πνεύμα δυστυχώς τροχάει το μυαλό στην πονηριά, και το θεωρεί κατόρθωμα εκείνος που αδικεί τον συνάνθρωπό του. Παίρνει μάλιστα και τον τίτλο: «Αυτός είναι διάβολος, τα καταφέρνει», ενώ εσωτερικά υποφέρει από τον έλεγχο της συνειδήσεως, την μικρή κόλαση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο δίκαιος έχει τον Θεό με το μέρος του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλοι οι άνθρωποι δεν χωράνε σ́ αυτόν τον κόσμο σήμερα. Αν κάποιος θέλη να ζήση τίμια και πνευματικά, δεν χωράει μέσα στον κόσμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί δεν χωράει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν είναι κανείς ευαίσθητος και βρεθή σε ένα σκληρό περιβάλλον και του κάνουν την ζωή μαύρη, πώς να αντέξη; ή πρέπει να βρίζη κ.λπ. ή να φύγη. Αλλά και να φύγη δεν μπορεί, γιατί χρειάζεται να ζήση. Του λέει το αφεντικό: «Σού έχω εμπιστοσύνη, γιατί δεν κλέβεις, πρέπει όμως να βάζης και σάπια ανάμεσα στα καλά. Μέσα στις καλές μπάλες τριφύλλι πρέπει να βάλης και λίγες χωνεμένες»! Τον βάζει και διευθυντή, για να τον κρατήση, πρέπει όμως να κάνη και έτσι, γιατί αλλιώς θα τον πετάξη από την δουλειά. Μετά ο καημένος δεν κοιμάται, αρχίζει τα χάπια. Ξέρετε τί τραβάνε οι καημένοι οι άνθρωποι; Τί δυσκολίες, τί εκβιασμούς συναντούν πολλοί στις δουλειές του από τους προϊσταμένους; Τους κάνουν την ζωή μαύρη. Να παρατήσουν την δουλειά; Έχουν οικογένεια. Να καθήσουν; Βάσανα. Μπρός βαθύ και πίσω ρέμα, και τα δυο στενά. Πάει να σκάση κανείς. Κάνει υπομονή, παλεύει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σε άλλον του αφήνουν όλη την δουλειά και πάει ο συνάδελφος μόνο για να πληρωθή. Γνωρίζω έναν που ήταν κάπου διευθυντής. Όταν άλλαξαν τα πράγματα, τον έβγαλαν από διευθυντή και έβαλαν άλλον του κόμματος, που ούτε το Λύκειο δεν είχε τελειώσει. Τον έκαναν διευθυντή, αλλά δεν ήξερε την δουλειά, και έτσι δεν μπορούσαν να πάνε σε άλλη θέση τον προηγούμενο. Λοιπόν, τί κάνουν; Βάζουν στον ίδιο χώρο και δεύτερο γραφείο! Την δουλειά την έκανε ο παλιός διευθυντής και ο νέος καθόταν, τσιγάρο, καφέ, κουβέντα... Τελείως αναιδής! Δεν του έκοβε κιόλας, έλεγε ό,τι του ερχόταν, και έπεφτε η ευθύνη μετά στον παλιό. Μέχρι που αναγκάσθηκε να φύγη ο καημένος. «Μήπως πρέπει να πάω κάπου αλλού; Ο χώρος είναι μικρός, δεν χωράνε δυο γραφεία. Καλύτερα, κάθησε εσύ εδώ», του είπε και σηκώθηκε και έφυγε, γιατί του έκανε και την ζωή μαύρη. Και δεν είναι μία μέρα, δυό. Κάθε μέρα να έχης έναν τέτοιον στο κεφάλι σου, είναι βάσανο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τον δίκαιο άνθρωπο συνήθως οι άλλοι τον σπρώχνουν στην τελευταία θέση ή ακόμη του παίρνουν και την θέση. Τον αδικούν, τον πατούν –»πατούν επί πτωμάτων», έτσι δεν λέγεται; Αλλά, όσο οι άνθρωποι τον σπρώχνουν προς τα κάτω, τόσο ο Θεός τον ανεβάζει προς τα άνω σαν τον φελλό. Θέλει όμως πάρα πολλή υπομονή. Η υπομονή ξεκαθαρίζει πολλά πράγματα. Αυτός που θέλει να ζήση με αρετή και να είναι τίμιος στην δουλειά του, είτε εργάτης είναι είτε έμπορος είτε οτιδήποτε είναι, πρέπει να το πάρη απόφαση ότι, όταν αρχίση την δουλειά του, θα φθάση σε σημείο να μην έχη να πληρώση λ.χ. ούτε τα ενοίκια, αν έχη μαγαζί, για να του έρθη η ευλογία του Θεού. Όχι όμως να πηγαίνη με τον σκοπό: «Αν φθάσω μέχρις εκεί, μετά θα έχω πελατεία»! Να μην πάη με τέτοιο σκοπό, γιατί τότε ο Θεός δεν θα του δώση. Αλλά όταν πή: «Θα ζήσω κατά Θεόν, δεν θα κάνω αδικίες, θα πω ότι αυτό αξίζει πενήντα δραχμές και εκείνο διακόσιες δραχμές», ο Θεός δεν θα τον αφήση. Κάποιος άλλος εν τω μεταξύ εκείνο που θα το δίνη αυτός πενήντα δραχμές, θα το δίνη πεντακόσιες δραχμές και θα πλουτίση. Τελικά όμως ο απατεώνας αυτός θα φθάση σε σημείο να μην έχη να πληρώση ούτε τα ενοίκια και θα το κλείση το μαγαζί του, γιατί ο κόσμος πληροφορείται, ενώ σιγά-σιγά  ο τίμιος δεν θα μπορή να τα βγάλη πέρα από την πελατεία που θα έχη, θα παίρνη συνέχεια υπαλλήλους! Αλλά στην αρχή θα δοκιμασθή. Ο καλός δοκιμάζεται στα χέρια των κακών, περνάει από τα λανάρια[43].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν πάη κανείς με τον διάβολο, με πονηριές, δεν ευλογεί ο Θεός τα έργα του. ό,τι κάνουν οι άνθρωποι με πονηριά, δεν ευδοκιμεί. Μπορεί να φαίνεται ότι προχωράει, αλλά τελικά θα σωριάση. Το κυριώτερο είναι να ξεκινά κανείς από την ευλογία του Θεού για ό,τι κάνει! Ο άνθρωπος, όταν είναι δίκαιος, έχει τον Θεό με το μέρος του. και όταν έχη και λίγη παρρησία στον Θεό, τότε θαύματα γίνονται. Όταν κανείς βαδίζη με το Ευαγγέλιο, δικαιούται την θεία βοήθεια. Βαδίζει με τον Χριστό. Πώς να το κάνουμε; την δικαιούται. Όλη η βάση εκεί είναι. Από 'κει και πέρα να μη φοβάται τίποτε. Αυτό που έχει σημασία είναι να αναπαύεται ο Χριστός, η Παναγία και οι Άγιοι στην κάθε ενέργειά μας, και τότε θα έχουμε την ευλογία του Χριστού, της Παναγίας και των Αγίων μας, και το Άγιο Πνεύμα θα επαναπαύεται σ́ εμάς. Η τιμιότης του ανθρώπου είναι το ανώτερο Τιμιόξυλο. Αν ένας δεν είναι τίμιος και έχη Τιμιόξυλο, είναι σαν να μην έχη τίποτε. Ένας και Τιμιόξυλο να μην έχη, αν είναι τίμιος, δέχεται την θεία βοήθεια. Και αν έχη και Τιμιόξυλο, τότε!...
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο δίκαιος ανταμείβεται και σ́ ετούτη την ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχω δει ψυχές που αδικήθηκαν, αλλά υπέμειναν την αδικία με καλούς λογισμούς και τους έλουσε η Χάρις σ́ αυτήν την ζωή. Πριν από πολλά χρόνια με είχε επισκεφθή ένας ευλαβής Χριστιανός, απλός και καλοκάγαθος, και με παρακάλεσε να ευχηθώ να φωτίση ο Χριστός τα παιδιά του, όταν ενηλικιωθούν, να μην γογγύσουν κατά των συγγενών για την μεγάλη αδικία που τους είχαν κάνει, και μου διηγήθηκε την υπόθεση. Όπως είδα, ο άνθρωπος αυτός ήταν πραγματικά άνθρωπος του Θεού. Ήταν ο μεγαλύτερος αδερφός από πέντε παιδιά της οικογενείας του και μετά τον αιφνίδιο θάνατο του πατέρα τους συμπαραστάθηκε σαν καλός πατέρας στα αδέρφια. Εργάσθηκε σκληρά, απέκτησε και άλλη περιουσία, κτήματα κ.λπ. και αποκατέστησε τις δυο αδερφές τους. Παντρεύτηκαν και τα μικρότερα αδέρφια του, πήραν όλα τα καλά κτήματα, ελαιώνες κ.λπ. Και σ́ αυτόν άφησαν τα άχρηστα, τα άγονα, κάτι αμμουδιές. Στο τέλος παντρεύτηκε και αυτός και απέκτησε τρία παιδάκια. Ήταν ηλικιωμένος φυσικά και σκεφτόταν τα παιδιά του, όταν μεγαλώσουν, μήπως καταλάβουν την αδικία και γογγύσουν. Μου έλεγε: «Εγώ δεν στενοχωριέμαι για την αδικία, γιατί διαβάζω το Ψαλτήρι. Ένα Κάθισμα το απόγευμα και δυο Καθίσματα πριν ξημερώση. Σχεδόν το έμαθα απ'' έξω το Ψαλτήρι. Κανένας Ψαλμός δεν λέει ότι οι άδικοι έκαναν προκοπή. Ενώ τους δικαίους τους σκέφτεται ο Θεός. Εγώ, Πάτερ μου, δεν λυπάμαι τα κτήματα που έχασα, αλλά λυπάμαι τα αδέρφια μου που χάνουν την ψυχή τους.» Έφυγε μετά ο ευλογημένος αυτός άνθρωπος και με ξαναεπισκέφθηκε μετά από δέκα χρόνια περίπου, πολύ χαρούμενος, και με ρωτάει: «Με θυμάσαι, Πάτερ, με θυμάσαι;». «Ναί», του είπα και τον ρώτησα πώς περνάει. «Έγινα πλούσιος τώρα», μου απάντησε. «Και πώς έγινες πλούσιος αδερφέ;». «Νά, εκείνα τα άχρηστα χωράφια, οι αμμουδιές, πήραν μεγάλη αξία, γιατί ήταν παραθαλάσσια. Αυτήν την φορά ήρθα να μου πής τί να τα κάνω τα πολλά χρήματα που έχω». «Να εξασφαλίσης τα παιδιά σου με ένα σπιτάκι και να κρατήσης μερικά χρήματα και για τις σπουδές τους, μέχρι να τακτοποιηθούν». «Έχω και για τα παιδιά μου, μου λέει, αλλά πάλι είναι πολλά». «Δώσε στους φτωχούς συγγενείς σου πρώτα και μετά σε άλλους φτωχούς». «Έδωσα, Πάτερ, αλλά πάλι είναι πολλά». «Δώσε, για να φτιάξουν τον Ναό του χωριού σου και τα εξωκκλήσια». «Έδωσα, αλλά πάλι είναι πολλά». Τότε του λέω: «Θα εύχωμαι να σε φωτίζη ο Χριστός, για να κάνης καλωσύνες εκεί που υπάρχει μεγαλύτερη αναγκη». Μετά τον ρώτησα: «Τί κάνουν τα αδέρφια σου; που βρίσκονται;». Ξέσπασε σε κλάμα και με λυγμούς μου απάντησε: «Δεν ξέρω, Πάτερ μου, χάθηκαν και τα ίχνη τους. Είχαν πουλήσει τα κτήματα από το χωριό, ελαιώνες και χωράφια, και τώρα δεν ξέρω που βρίσκονται. Είχαν πάει πρώτα στην Γερμανία, μετά στην Αυστραλία και τώρα δεν ακούγονται». Μετανόησα που τον ρώτησα για τα αδέρφια του, γιατί δεν ήξερα πώς θα λυπηθή τόσο πολύ. Τον παρηγόρησα μετά και έφυγε ειρηνικός. Του είπα να ευχηθούμε και οι δυο να μάθουμε και γι'' αυτούς χαρούμενες ειδήσεις. Θυμήθηκα μετά τον Ψαλμό που λέει: «Είδον τον ασεβή υπερυψούμενον και επαιρόμενον ως τας κέδρους του Λιβάνου. Και παρήλθον και ιδού ουκ ήν και εζήτησα αυτόν και ούχ ευρέθη ο τόπος αυτού»[44]. Αυτό ακριβώς συνέβη με τα ταλαίπωρα αδέρφια του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χειρότερο πράγμα από την αδικία δεν υπάρχει. Οτιδήποτε κάνετε, κοιτάξτε νάχετε την ευλογία του Θεού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 5 –  «Ευλογείτε και μη καταράσθε»[45]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με ρώτησε κάποιος: «Αυτό που ψάλουμε την Μεγάλη Σαρακοστή, το«Πρόσθες αυτοίς κακά, Κύριε, τους ενδοξοις της γής»[46], γιατί το λέμε, αφού είναι κατάρα;». «Όταν κάνουν επιδρομή οι βάρβαροι, του είπα, και πάνε να καταστρέψουν στα καλά καθούμενα έναν λαό και ο λαός προσεύχεται να τους βρουν κακά, δηλαδή να σπάσουν τα αμάξια τους, και τα άλογά τους να πάθουν κάτι, για να εμποδισθούν, καλό είναι ή κακό; Αυτό εννοεί, να τους έρθουν εμπόδια. Δεν είναι ότι καταριούνται».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε πιάνει η κατάρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η κατάρα πιάνει, όταν υπάρχη στην μέση αδικία. Αν λ.χ. κάποια κοροϊδέψη μία πονεμένη ή της κάνη ένα κακό και η πονεμένη την καταρασθή, πάει, χάνεται το σόι της. Όταν δηλαδή κάνω κακό σε κάποιον και εκείνος με καταριέται, πιάνουν οι κατάρες του. Επιτρέπει ο Θεός και πιάνουν, όπως επιτρέπει λ.χ. να σκοτώση ένας κάποιον άλλον. Όταν όμως δεν υπάρχη αδικία, τότε η κατάρα γυρνά πίσω σ́ αυτόν που την έδωσε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς απαλλάσσεται κανείς από την κατάρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Με την μετάνοια και την εξομολόγηση. Έχω υπ'' όψιν μου πολλές περιπτώσεις, άνθρωποι που ταλαιπωρήθηκαν από κατάρα, όταν το κατάλαβαν ότι τους καταράσθηκαν, γιατί είχαν φταίξει, μετανοιωσαν, εξομολογήθηκαν και τακτοποιήθηκαν. Αν αυτός που έφταιξε πή: «Θεέ μου, έκανα αυτό και αυτό, συγχώρεσε μέ...» και εξομολογηθή με πόνο και ειλικρίνεια, τότε ο Θεός θα τον συγχωρήση, Θεός είναι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τιμωρείται μόνον αυτός που δέχεται την κατάρα ή και αυτός που την δίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτός που δέχεται την κατάρα, βασανίζεται σ́ αυτήν την ζωή. Αυτός όμως που καταράσθηκε, βασανίζεται και σ́ αυτήν την ζωή, και στην άλλη, γιατί ως εγκληματίας θα τιμωρηθή εκεί από τον Θεό, αν δεν μετανοήση και εξομολογηθή. Γιατί, εντάξει, μπορεί κάποιος να σε πείραξε, εσύ όμως με την κατάρα που δίνεις, είναι σαν να παίρνης το πιστόλι και να τον σκοτώνης. Με ποιό δικαίωμα το κάνεις αυτό; Ό,τι και αν σου έκανε ο άλλος, δεν έχεις δικαίωμα να τον σκοτώσης. Για να καταρασθή κανείς, σημαίνει ότι έχει κακία. Κατάρα δίνει κανείς, όταν το λέη με πάθος, με αγανάκτηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η κατάρα, όταν προέρχεται από άνθρωπο που έχει δίκαιο, έχει μεγάλη ισχύ, ιδίως η κατάρα της χήρας. Θυμάμαι, μία γριά είχε ένα αλογάκι και το έβαζε στην άκρη του δάσους να βοσκήση. Επειδή ήταν λίγο ζόρικο, είχε βρει ένα γερό σχοινί και το έδενε. Μία φορά πήγαν στο δάσος τρεις γυναίκες να κόψουν ξύλα. Η μία ήταν πλούσια, η άλλη χήρα και η άλλη ήταν ορφανή και πολύ φτωχιά. Είδαν το άλογο που ήταν δεμένο με το σχοινί και βοσκούσε και είπαν: «Δεν παίρνουμε το σχοινί να δέσουμε τα ξύλα;». Το έκοψαν στα τρία και πήρε η καθεμιά από ένα κομμάτι να δέσουν τα δεμάτια τους. Επόμενο ήταν να φύγη το άλογο. Όταν ήρθε η γριά και δεν βρήκε το ζώο, αγανάκτησε. Άρχισε να το ψάχνη παντού, παιδεύτηκε πολύ να το βρή. Τελικά, όταν το βρήκε, είπε αγανακτισμένη: «Με το ίδιο το σχοινί να την κουβαλήσουν αυτήν που το πήρε». Μία μέρα, ο αδελφός της πλούσιας έκανε αστεία με ένα όπλο νομίζοντας πώς είναι άδειο –ήταν από αυτά  που είχαν αφήσει οι Ιταλοί – και χτύπησε την αδελφή του στον λαιμό. Έπρεπε να την μεταφέρουν στο νοσοκομείο και χρειάσθηκε σχοινί, για να την δέσουν επάνω σε μία ξύλινη σκάλα. Εκείνη την ώρα βρέθηκε το ένα κομμάτι σχοινί, το κλεμμένο, αλλά δεν έφθανε. Έφεραν και οι δύο άλλες γειτόνισσες τα δικά τους κλεμμένα κομμάτια και την έδεσαν στην σκάλα και την μετέφεραν στο νοσοκομείο. Έτσι πραγματοποιήθηκε η κατάρα της γριάς, «Με το ίδιο σχοινί να την κουβαλήσουν». Και τελικά πέθανε η καημένη, ο Θεός να την αναπαύση. Βλέπετε, επίασε η κατάρα στην πλούσια, που δεν είχε οικονομική ανάγκη. Οι άλλες είχαν την φτώχειά τους, είχαν κάποια ελαφρυντικά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αρρώστιες και ατυχήματα από κατάρα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλές αρρώστιες που δεν βρίσκουν οι γιατροί από τί είναι, μπορεί να είναι από κατάρα. Τί να βρουν οι γιατροί, την κατάρα; Μία φορά μου έφεραν στο Καλύβι έναν παράλυτο. Ολόκληρος άνδρας δεν μπορούσε να καθήση. Το κορμί του ήταν τεντωμένο σαν ξύλο. Τον κουβαλούσε ένας στην πλάτη και ένας άλλος τον κρατούσε από πίσω. Του έβαλα δυο κούτσουρα και ακουμπούσε λίγο ο καημένος. Μου λένε αυτοί που τον συνόδευαν: «Από δεκαπέντε χρονών παιδί είναι σ́ αυτήν την κατάσταση και έχουν περάσει δεκαοκτώ χρόνια από τότε». «Μα πώς στα καλά καθούμενα να το πάθη αυτό; είπα. Δεν μπορεί, κάτι συμβαίνει». Έψαξα από δώ-από ''κει και βρήκα ότι κάποιος τον είχε καταρασθή. Τί είχε συμβή; Κάποτε πήγαινε με το αστικό στην σχολή του και καθόταν σε μία θέση τεντωμένος. Σε κάποια στάση μπήκε ένας ηλικιωμένος παπάς και ένα γεροντάκι και στάθηκαν όρθιοι δίπλα του. Τότε του είπε ένας: «Σήκω, να καθήσουν οι μεγάλοι». Αυτός τεντώθηκε ακόμη περισσότερο στο κάθισμα, χωρίς να δώση σημασία. Όποτε το γεροντάκι που στεκόταν όρθιό του λέει: «Τεντωμένος να μείνης και ποτέ να μην μπορής να καθήσης». Και η κατάρα επίασε. Βλέπεις, είχε αναίδεια ο νέος. Σού λέει: «Γιατί να σηκωθώ, αφού την πλήρωσα την θέση;». Ναί, αλλά και ο άλλος πλήρωσε και είναι ηλικιωμένος, σεβάσμιος, και στέκεται όρθιος και εσύ είσαι μικρό παιδί, δεκαπέντε χρονών, και κάθεσαι. «Από αυτό είναι, του λέω. Κοίταξε να μετανοήσης, για να γίνης καλά, χρειάζεται μετανοια». Ο καημένος, μόλις το κατάλαβε λίγο και το αναγνώρισε, αμέσως τακτοποιήθηκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσα από αυτά  που συμβαίνουν σήμερα είναι από κατάρα, από αγανάκτηση. Και όταν εξοντώνωνται ολόκληρες οικογένειες ή πεθαίνουν πολλά άτομα από μία οικογένεια, να ξέρετε, είναι ή από αδικία ή από μάγια ή από κατάρα. Ένας πατέρας είχε ένα παιδί που όλο γύριζε. Μία φορά του λέει αγανακτισμένος: «Να έλθης μία και καλή». Το παιδί εκείνο το βράδυ, καθώς ερχόταν στο σπίτι, ακριβώς έξω από την πόρτα, το χτύπησε ένα αυτοκίνητο και έμεινε στον τόπο. Τον πήραν οι φίλοι του σκοτωμένο και τον πήγαν μέσα στο σπίτι του. Ήρθε μετά ο πατέρας στο Καλύβι και έκλαιγε. «Το παιδί μου σκοτώθηκε έξω από την πόρτα του σπιτιού μού», έλεγε. Από ''δω-από ''κει, μετά μου λέει: «Του είχα πει μία κουβέντα». «Τι του είπες;», του λέω. «Αγανάκτησα που ξενυχτούσε και του είπα: «Να έρθης μία και καλή!». Μήπως ήταν απ'' αυτό»; «Εμ, από τί ήταν; του λέω. Κοίταξε να μετανοήσης, να εξομολογηθής». «Αυτήν την φορά να έρθης μία και καλή», του είπε, και το παιδί το έφεραν νεκρό. Άντε μετά να χτυπιέται ο πατέρας, να κλαίη...'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η κατάρα των γονέων πιάνει πολύ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να ξέρετε, η κατάρα των γονέων πιάνει πολύ, ακόμη και η αγανάκτησή τους. Και να μην το καταρασθή ο γονιός το παιδί, αλλά μόνο να αγανακτήση μαζί του, το παιδί δεν βλέπει άσπρη μέρα, η ζωή του είναι όλο βάσανα. Ταλαιπωρείται πολύ σ́ αυτήν την ζωή. Φυσικά, στην άλλη ζωή ξελαφρώνει, γιατί ξοφλάει εδώ μερικά. Γίνεται αυτό που λέει ο Αββάς Ισαάκ: «Τρώει την κόλαση»[47], λιγοστεύει δηλαδή την κόλαση με τις ταλαιπωρίες εδώ, σ́ αυτήν την ζωή. Γιατί ταλαιπωρία σ́ αυτήν την ζωή τρώει την κόλαση. Δηλαδή, όταν λειτουργούν οι πνευματικοί νόμοι, αφαιρείται λίγο από την κόλαση, από τα βάσανα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αλλά και οι γονείς που στέλνουν τα παιδιά τους στον «έξω απ'' εδώ», τα τάζουν στον διάβολο και έχει δικαιώματα μετά ο διάβολος. «Μου τόταξες», σού λέει. Ήταν ένα ανδρόγυνο στα Φάρασα[48]. Αυτοί είχαν ένα παιδάκι που έκλαιγε, και ο πατέρας συνέχεια το έστελνε στον «έξω απ'' εδώ». Και Νά, τί έγινε. Επέτρεψε ο Θεός καί, όταν το έστελνε στον «έξω απ'' εδώ», εξαφανιζόταν το παιδί από την κούνια. Η φουκαριάρα η μάνα πήγαινε μετά στον Χατζεφεντή[49]. «Χατζεφεντή, νάχω την ευχή σου, το παιδί το πήραν οι δαίμονες». Πήγαινε ο Χατζεφεντής, διάβαζε ευχές στην κούνια, επέστρεφε το παιδί. Αυτή η δουλειά γινόταν συνέχεια. Η καημένη έλεγε: «Χατζεφεντή, νάχω την ευχή σου, που θα πάη αυτό;». «Εγώ δεν κουράζομαι να έρχωμαι, της έλεγε, εσύ κουράζεσαι να έρχεσαι να με φωνάζης; Θα κουρασθή ο διάβολος και θα σού αφήση». Από τότε δεν εξαφανιζόταν το παιδί. Όταν μεγάλωσε μετά, το έλεγαν «υπόδειγμα του διαβόλου». Ανακάτευε όλο το χωριό, άνω-κάτω τους έκανε. Τί τραβούσε ο πατέρας μου[50]! Πήγαινε στον έναν και έλεγε: «Ο τάδε είπε αυτό για σένα». Πήγαινε στον άλλο, έλεγε τα ίδια. Μετά πιάνονταν ο ένας με τον άλλον, χτυπιόνταν. Όταν το καταλάβαιναν, πήγαιναν σ́ αυτόν να τον πιάσουν, να τον λιντσάρουν. Αυτός τους κατάφερνε όμως να του ζητάνε και συγγνώμη! Τόσο διαβολεμένος ήταν! Υπόδειγμα του διαβόλου! Οικονόμησε ο Θεός να δούν και στην συνέχεια οι άλλοι το αποτέλεσμα, για να βάλουν μυαλό, να φρενάρουν τον εαυτό τους και να είναι πολύ προσεκτικοί, τώρα αυτόν πώς θα τον κρίνη ο Θεός, είναι άλλο θέμα. Φυσικά, έχει πολλά ελαφρυντικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η μεγαλύτερη περιουσία για τον κόσμο είναι η ευχή των γονέων. Όπως και στην μοναχική ζωή η μεγαλύτερη ευλογία είναι να πάρης την ευχή του Γέροντά σου. Γι'' αυτό λένε: «Να πάρης την ευχή των γονέων». Μία μάνα, θυμάμαι, είχε τέσσερα παιδιά και έκλαιγε η καημένη: «Θα πεθάνω με τον καημό, μου έλεγε, δεν παντρεύτηκε κανένα παιδί. Κάνε προσευχή». Χήρα γυναίκα εκείνη, ορφανά αυτά, τους πόνεσα. Κάνω προσευχή, κάνω προσευχή, τίποτε. Λέω, «κάτι συμβαίνει εδώ». «Μας έχουν κάνει μάγια», έλεγαν τα παιδιά. «Δεν είναι μάγια, φαίνεται αυτό, όταν είναι από μάγια. Μήπως σάς καταριόταν η μάνα σας;», τα ρωτάω. «Ναί, Πάτερ, μου λένε, η μητέρα μας, όταν ήμασταν μικρά, επειδή ήμασταν πολύ ζωηρά, μας έλεγε συνέχεια από το πρωί μέχρι το βράδυ: «Κούτσουρα να μείνετε, κούτσουρα να μείνετε». «Πάτε να τραντάξετε την μάνα σας, τα λέω, και να της πήτε να μετανοήση, να εξομολογηθή και από ''δω και πέρα να σάς δίνει ευχές συνέχεια». Μέσα σε ενάμισι χονο παντρεύτηκαν και τα τέσσερα. Εκείνη η καημένη ήταν χήρα γυναίκα, ήταν, φαίνεται, και στενόκαρδη, και εκείνα ζωηρά, την έσκαγαν, και έτσι τα καταριόταν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν οι γονείς καταρασθούν τα παιδιά και μετά πεθάνουν, πώς θα απαλλαγούν τα παιδιά από την κατάρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν ψάξουν τα παιδιά στον εαυτό τους, θα βρουν ότι, για να τα καταρασθούν οι γονείς τους, φαίνεται θα ήταν παλαβά και θα τους βασάνιζαν. Όποτε, αν συναισθανθούν το σφάλμα τους και μετανοήσουν ειλικρινά και εξομολογηθούν, τακτοποιούνται. Και αν τα παιδιά κάνουν πνευματική προκοπή, θα βοηθηθούν και οι γονείς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, και εμένα, όταν έφευγα για το Μοναστήρι, οι γονείς μου με καταριόνταν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτές είναι οι μόνες κατάρες που γίνονται ευχή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ... «ευγενική» κατάρα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, είναι σωστό να λέη κανείς γι'' αυτόν που τον αδικεί: «Ας το βρη από τον Θεό»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όποιος το λέει αυτό κοροϊδεύεται από τον πονηρό και δεν καταλαβαίνει ότι με αυτόν τον τρόπο καταριέται με ευγένεια. Είναι μερικοί που λένε ότι είναι ευαίσθητοι και έχουν αγάπη και λεπτότητα και ανέχονται μεν τις αδικίες που τους κάνουν οι άνθρωποι, αλλά λένε: «Ας το βρουν από τον Θεό». Σ́ αυτήν την ζωή όλοι οι άνθρωποι δίνουμε εξετάσεις, για να περάσουμε στην άλλη την αιώνια, στον Παράδεισο. Μου λέει ο λογισμός ότι αυτή η ευγενική κατάρα είναι κάτω από την πνευματική βάση και δεν επιτρέπεται σε Χριστιανό, γιατί ο Χριστός δεν μας δίδαξε τέτοιου είδους αγάπη, αλλά το«Πάτερ, άφες αυτοίς, ου γαρ οίδασι τί ποιούσι»[51]. Όπως επίσης καλύτερη ευχή από όλες είναι, όταν μας καταριούνται άδικα και το δεχώμαστε σιωπηλά με καλωσύνη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν συκοφαντηθούμε ή αδικηθούμε είτε από επιπόλαιους είτε από πονηρούς ανθρώπους, που έχουν κακότητα και διαστρέφουν και την αλήθεια, εάν μπορούμε, καλά είναι να μη θέλουμε να δικαιωθούμε, όταν η αδικία αφορά μόνον το άτομό μας. Ούτε και να πούμε: «Να το βρουν από τον Θεό», γιατί και αυτό είναι κατάρα. Καλά είναι να τους συγχωρέσουμε με όλη την καρδιά μας και να παρακαλέσουμε τον Θεό να μας δυναμώση, να μπορέσουμε να σηκώσουμε το βάρος της συκοφαντίας και να συνεχίσουμε την πνευματική ζωή (στήν αφάνεια, όσο μπορούμε). Ας συνεχίζουν οι άνθρωποι που έχουν ως τυπικό να κρίνουν και να κατακρίνουν, να μας αδικούν, γιατί συνέχεια με τον τρόπο τους αυτόν μας ετοιμάζουν χρυσά στεφάνια για την αληθινή ζωή. Φυσικά, όσοι είναι κοντά στον Θεό ποτέ δεν καταριούνται, γιατί δεν έχουν κακότητα αλλά όλο καλωσύνη και ό,τι κακό κι αν πετάξη κανείς σ́ αυτούς τους αγιασμένους ανθρώπους αγιάζεται, και αισθάνονται μεγάλη, κρυφή χαρά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η βασκανία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ζήλεια, όταν έχη κακότητα, μπορεί να κάνη ζημιά. Αυτή είναι η βασκανία, είναι μία δαιμονική ενέργεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, την βασκανία την παραδέχεται η Εκκλησία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, υπάρχει και ειδική ευχή[52]. Όταν κανείς λέη κάτι με φθόνο, τότε πιάνει το «μάτι».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλοί, Γέροντα, ζητούν «ματάκια» για τα μωρά, για να μην τα ματιάζουν. Κάνει να φορούν τέτοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν κάνει. Να λέτε στις μητέρες σταυρό να τα φορούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κανείς επαινέση ένα ωραίο έργο, και αυτοί που το έφτιαξαν δεχθούν τον έπαινο με υπερήφανο λογισμό και γίνη ζημιά, αυτό είναι βασκανία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό δεν είναι βασκανία. Σ́ αυτήν την περίπτωση λειτουργούν οι πνευματικοί νόμοι. Παίρνει την Χάρη Του ο Θεός από τον άνθρωπο, και τότε γίνεται ζημιά. Βασκανία υπάρχει σε σπάνιες περιπτώσεις. Ιδίως οι άνθρωποι που έχουν ζήλεια και κακότητα –λίγοι είναι τέτοιοι – αυτοί είναι που ματιάζουν. Μία γυναίκα λ.χ. βλέπει ένα παιδάκι χαριτωμένο με την μάνα του και λέει με κακότητα: «Γιατί να μην το είχα εγώ αυτό το παιδί; Γιατί να το δώση ο Θεός σ́ αυτή;». Τότε το παιδάκι εκείνο μπορεί να πάθη ζημιά, να μην κοιμάται, να κλαίη, να ταλαιπωρήται, γιατί εκείνη το είπε με μία κακότητα. Και αν αρρώσταινε και πέθαινε το παιδί, θα έννιωθε χαρά μέσα της. Άλλος βλέπει ένα μοσχαράκι, το λαχταρά, και αμέσως εκείνο ψοφάει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλές φορές όμως μπορεί να ταλαιπωρήται το παιδί και να φταίη η ίδια η μάνα. Μπορεί δηλαδή η μάνα να είδε καμμιά φορά κανένα αδύνατο παιδάκι και να είπε: «Τί είναι αυτό; Τί σκελετωμένο παιδί!». Να καμάρωνε το δικό της και να κατηγόρησε το ξένο. Και αυτό που είπε με κακία για το ξένο παιδί, πιάνει στο παιδί της. Μετά το παιδί ταλαιπωρείται εξ αιτίας της μάνας, χωρίς να φταίη. Λειώνει-λειώνει το καημένο, για να τιμωρηθή η μάνα και να καταλάβη το σφάλμα της. Τότε φυσικά το παιδί θα πάη μάρτυρας! Τα κρίματα του Θεού είναι άβυσσος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ευχή που βγαίνει από την καρδιά, είναι θεϊκή ευχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τώρα να σάς δώσω και εγώ μία... «κατάρα»! Ο Θεός να πλημμυρίση την καρδιά σας με την καλωσύνη Του και την πολλή Του αγάπη, μέχρι που να παλαβώσετε, για να φύγη ο νούς σάς πια από την γη και να βρίσκεται από τώρα κοντά Του στον Ουρανό. Να τρελλαθήτε από την θεία τρέλλα της αγάπης του Θεού! Να σάς κάψη ο Θεός με την αγάπη Του τις καρδιές σας! Άλλη φορά μη με αναγκάσετε για δεύτερη, γιατί πιάνει η... «κατάρα» μου (η καλή), επειδή βγαίνει από την καρδιά μου. Και τότε που ήμουν στο Σανατόριο[53]σάς είχα λυπηθή. Οκτώ χρόνια μερικές περίμεναν: «Θα κάνουμε Μοναστήρι», έλεγαν, αλλά το Μοναστήρι δεν γινόταν. Είχαν μαραζώσει. Τότε είπα: «Μόλις βγώ από το νοσοκομείο, θα φυτρώση το Μοναστήρι σαν μανιτάρι. Σε έναν χρόνο θα είστε στο Μοναστήρι!». Και πράγματι σε έναν χρόνο μέσα έγινε το Μοναστήρι! Το είπα, εκεί πέρα, με την καρδιά μου. Είχατε καλή διάθεση, γι'' αυτό δεν σάς άφησε ο Θεός, αλλιώς δεν εξηγείται!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν πονέσης έναν άνθρωπο που έχει ταπείνωση και με την καρδιά του σου ζητά να ευχηθής λ.χ. για ένα πάθος που τον ταλαιπωρεί και του πής, «μή φοβάσαι, θα γίνης καλύτερος», του δίνεις τέτοια ευχή, που είναι θεϊκή ευχή. Έχει πολλή αγάπη, πόνο, και γι' αυτό πιάνει. Είναι αρεστό στον Θεό, και εκπληρώνει ο Θεός την ευχή. Δηλαδή και μόνον ο πόνος που νιώθει κανείς για κάποιον είναι σαν ευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μία φορά, όταν ήμουν στρατιώτης, με έστειλε ο Διοικητής να εκπληρώσω ένα τάμα σε ένα εξωκκλήσι του Αγίου Ιωάννου του Προδρόμου, γιατί τότε με τον πόλεμο μας είχε βοηθήσει ο Άγιος. Θα πήγαινα να πάρω δύο μανουάλια για το εκκλησάκι και παράλληλα θα συνόδευα και κάποιον που ήταν να περάση από Στρατοδικείο στην Ναύπακτο. Οι άλλοι είπαν στον Διοικητή: «Βρήκες άνθρωπο να τον παραδώση!». Ήταν από την Ήπειρο ο καημένος, οργανοπαίκτης, φτωχός, παντρεμένος, με παιδιά, και είχε κατηγορηθή ότι αυτοτραυματίσθηκε, για να γλυτώση τον πόλεμο. Σού λέει: «Καλύτερα να είμαι με ένα πόδι παρά να σκοτωθώ». Κατεβήκαμε στο Αγρίνιο, είχε κάποιους γνωστούς εκεί. «Να πάμε να τους δώ», μου λέει. «Να πάμε», του λέω. «Να πάμε εδώ, να πάμε εκεί», τί να κάνω, πήγαινα και εγώ μαζί του. Μεγάλη ταλαιπωρία! Και δεν ήθελε να πάω να τον παραδώσω. Τον λυπόμουν και εγώ, τον καημένο. Τον πόνεσα πάρα πολύ και του λέω: «Θα δής, εσύ θα περάσης καλύτερα από όλους! Και ο Διοικητής θα στείλη καμμιά επιστολή και θα σε βάλουν σε καμμιά υπηρεσία, θα οικονομήσης και τα παιδιά σου και θάχης εξασφαλισμένη και την ζωή σού». Τελικά, όταν φθάσαμε στην Ναύπακτο, μαθαίνουμε ότι είχε στείλει ο Διοικητής επιστολή και απαλλάχθηκε, αλλιώς είχε ντουφέκισμα. Εν καιρώ πολέμου είναι αυστηρά τα πράγματα. Τον λυπήθηκε ο Διοικητής, επειδή ήταν οικογενειάρχης, και τον έβαλαν μάγειρα στο Κέντρο Διερχομένων. Έφερε και την οικογένειά του κοντά και πέρασε την καλύτερη ζωή από όλους. Και επειδή οι στρατιώτες δεν πήγαιναν πάντοτε εκεί να φάνε, περίσσευε φαγητό, και τάιζε και τα παιδιά του. Όλοι μετά του έλεγαν: «Εσύ πέρασες καλύτερα από όλους μας». Γιατί εμείς οι άλλοι ήμασταν πάνω στα βουνά, στα χιόνια. Ήταν ευάρεστο στον Θεό αυτό που του είχα ευχηθή, γιατί το είπα με πόνο, μέσα από την καρδιά μου, και γι'' αυτό το έκανε ο Θεός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι μία άλλη περίπτωση πάλι, στην Κόνιτσα, όταν ήμουν στην Ιερά Μονή Στομίου. Μετά την Πανήγυρη της Παναγίας στις 8 Σεπτεμβρίου, οι προσκυνητές τα είχαν αφήσει όλα άνω-κάτω. Εκεί που τακτοποιούσα κάτι, βλέπω, κάθησε η αδελφή μου και μία άλλη κοπέλα να συμμαζέψουν. Αυτή η καημένη είχε ακόμη δύο αδελφές –η μία μικρότερη – οι οποίες είχαν παντρευτή, και αυτή είχε μείνει ακόμα ανύπανδρη. Τί φιλότιμο είχε! Κάθησε και τα τακτοποίησαν όλα και στο τέλος μου λέει: «Αν χρειάζεται, Πάτερ, να καθήσουμε να κάνουμε και τίποτε άλλες δουλειές». «Τόσο πολύ φιλότιμο!». λέω μέσα μου. Πάω στο Εκκλησάκι και λέω με όλη την καρδιά μου: «Παναγία μου, οικονόμησε την εσύ. Εγώ δεν έχω τί να της δώσω» –καί να είχα, δεν θα το δεχόταν κιόλας. Έ, μόλις πήγε στο σπίτι της, την περίμενε ένας που ήμασταν μαζί στρατιώτες, ένα πολύ καλό παιδί, κομμάτι μάλαμα και από καλή οικογένεια. Παντρεύτηκαν, μία χαρά! Πώς την πλήρωσε η Παναγία!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 6 – Η αμαρτία φέρνει τις συμφορές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έρριξες φάρμακο για τις κάμπιες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έρριξα, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τόσες καλόγριες ούτε μία κάμπια δεν μπορείτε να σκοτώσετε! Στην Κατοχή, όταν είχε πέσει ακρίδα, είχαν βγάλει εδώ στην Χαλκιδική την Αγία Ζώνη από την Μονή Βατοπεδίου και η ακρίδα έπεφτε σύννεφα-σύννεφα στην θάλασσα. Στην Ήπειρο, θυμάμαι, ήταν σαν το χιόνι. Κάναμε όλοι προσωπική εργασία, με τα σεντόνια την μαζεύαμε και μετά την πετούσαμε. Ήταν και η πείνα..., μην τα ρωτάς! Τί σιτάρια είχαν ξαναδώσει, αλλά είχαν σακατευθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι ακρίδες, οι πόλεμοι, η ανομβρία, οι αρρώστιες είναι μάστιγα. Όχι ότι ο Θεός θέλει να παιδαγωγήση έτσι τον άνθρωπο, αλλά είναι συνέπεια της απομακρύνσεως του ανθρώπου από τον Θεό. Όλα αυτά  συμβαίνουν, γιατί ξεφεύγει ο άνθρωπος από τον Θεό. Έρχεται η οργή του Θεού, για να θυμηθή ο άνθρωπος τον Θεό και να ζητήση βοήθεια.. δεν είναι ότι ο Θεός τα κανονίζει έτσι και βγάζει μία διαταγή να έρθη κάποια συμφορά στον άνθρωπο, αλλά ο Θεός βλέπει μέχρι που θα φθάση η κακία των ανθρώπων και ότι δεν θα αλλάξουν, και γι' αυτό επιτρέπει να συμβή μία συμφορά, για να συνετισθούν. Όχι ότι τα κανόνισε έτσι ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στον Ιησού του Ναυή[54]είχε πει ο Θεός να μην εξαφανίσουν μία φυλή, τους Φιλισταίους, γιατί αυτή θα ήταν μάστιγα για τους Εβραίους, όταν θα ξεχνούσαν τον Θεό. Όταν λοιπόν οι Εβραίοι απομακρύνονταν από τον Θεό, είχε δικαιώματα ο διάβολος και έβαζε τα «ξαδέρφιά» του, τους Φιλισταίους, και ορμούσαν στους Εβραίους. Έπαιρναν τα παιδιά των Εβραίων και τα χτυπούσαν πάνω στην πέτρα, για να τα σκοτώσουν. Κάποτε όμως που οι εχθροί ήρθαν, χωρίς να φταίνε οι Ισραηλίτες, πολέμησε γι' αυτούς ο Θεός. Έρριξε χαλάζι σαν πέτρες[55]και τους εξόντωσε, γιατί τότε οι Ισραηλίτες δικαιούνταν την θεία επέμβαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσες υποσχέσεις είχε δώσει ο Θεός για τον Ναό του Σολομώντος, και όμως πόσες φορές κάηκε, ρήμαξε. Όταν ξέφευγε ο λαός του Ισραήλ, οι Προφήτες φώναζαν-φώναζαν, οι Ισραηλίτες τίποτε! Ανέπαυαν τον λογισμό τους: «Αφού, όταν έκτισε ο Σολομών τον Ναό, έδωσε τόσες ευλογίες ο Θεός και είπε ότι από εδώ θα ευλογούνται και θα αγιάζωνται όλοι οι άνθρωποι[56], άρα θα μείνουν όλα αυτά, και τα τείχη μας και ο Ναός μας. Τέτοια υπόσχεση έδωσε ο Θεός»! Ο Θεός έδωσε τέτοια υπόσχεση, αλλά εφόσον και οι Ισραηλίτες θα ζούσαν σωστά. Είχε δώσει Χάρη στον Ναό του Σολομώντος, αλλά, όταν οι Ισραηλίτες δεν τηρούσαν τις εντολές, επέτρεπε και καιγόταν ή καταστρεφόταν ο Ναός καί, όταν μετανοούσαν, πάλι τον έχτιζαν. Όταν λ.χ. ξέφυγαν επί βασιλέως Σεδεκίου, έρχεται ο Ναβουχοδονόσορ, βάζει φωτιά στον Ναό του Σολομώντος, γκρεμίζει και τα τείχη, τους Δένει και τους πηγαίνει στην Βαβυλώνα αιχμάλωτους[57]. Φυσικά, πήγαν και αυτοί που δεν έφταιγαν, αλλά αυτοί είχαν καθαρό μισθό. Οι άλλοι που έφταιγαν πολύ, ξόφλησαν. Όσοι έφταιγαν λίγο και ταλαιπωρήθηκαν, είχαν και λιγάκι μισθό. Όταν ένας γίνεται αιτία να έρθη η οργή του Θεού και να ταλαιπωρηθούν και άλλοι που δεν έφταιγαν, ακόμη και μισθό να έχουν, αυτό είναι εγκληματικό, γιατί οι άλλοι θα κληρονομούσαν την Ουράνια Βασιλεία χωρίς να βασανισθούν, ενώ τώρα βασανίζονται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να ξέρουμε ότι οι πιστοί που τηρούν τις εντολές του Θεού δέχονται την Χάρη του Θεού, και ο Θεός – πώς να πη κανείς; – είναι υποχρεωμένος να τους βοηθάη μέσα σ́ αυτά  τα δύσκολα χρόνια. Στην Αμερική είχα ακούσει πώς παρουσιάσθηκε μία νέα αρρώστια[58]. Πολλοί που ζουν μία αφύσικη, αμαρτωλή ζωή, μολύνονται από αυτήν και πεθαίνουν. Τώρα έμαθα ότι παρουσιάσθηκε και εδώ αυτή η αρρώστια. Βλέπετε, δεν καταστρέφει ο Θεός τους ανθρώπους, μόνοι τους εξαφανίζουν το σόι τους και καταστρέφονται. Δεν είναι δηλαδή ότι τους τιμωρεί ο Θεός, αλλά την τιμωρία την δημιουργούν μόνοι τους με την αμαρτωλή ζωή τους. Και βλέπει κανείς να εξαφανίζωνται εκείνοι οι άνθρωποι που δεν έχει νόημα η ζωή τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί δεν βρίσκεται το φάρμακο του καρκίνου; Δεν επιτρέπει ο Θεός ή οι άνθρωποι δεν επικαλούνται την θεία βοήθεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το κακό είναι ότι και να βρεθή το φάρμακο για τον καρκίνο, θα βγή άλλη αρρώστια. Ήταν η φυματίωση, βρήκαν το φάρμακο για την φυματίωση, παρουσιάσθηκε τώρα αυτή. Και αν βοηθήση σ́ αυτή, θα βγή άλλη αρρώστια. Οι ίδιοι οι άνθρωποι θα γίνουν αιτία να παρουσιασθή κάποια άλλη μετά, και δεν έχει τελειωμό!
- type: h2
  initial:
    ru: ''
  text:
    ru: Ό,τι επιτρέπει ο Θεός είναι φιλάνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί επιτρέπει ο Θεός να συμβή μία συμφορά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Υπάρχουν πολλές περιπτώσεις. Άλλοτε επιτρέπει ο Θεός κάτι, για να βγή κάτι το καλύτερο, και άλλοτε επιτρέπει κάτι για παιδαγωγία. Άλλοι ανταμείβονται και άλλοι εξοφλούν, δεν πάει τίποτε χαμένο. Να ξέρετε πώς ό,τι επιτρέπει ο Θεός, ακόμη και να εξοντωθούν π.χ. άνθρωποι, είναι φιλάνθρωπο, γιατί ο Θεός έχει «σπλάγχνα». Ο Προφήτης Ηλίας[59]πόσους έσφαξε; Τριακόσιους ιερείς του Βάαλ. Όταν τους είπε: «Κάντε προσευχή, θα κάνω και εγώ, και όποιου η φωτιά θα ανάψη από μόνη της, αυτού ο Θεός θα είναι αληθινός», άρχισαν οι ειρείς του Βάαλ να φωνάζουν: «Επάκουσον, ο Θεός ημών, Βάαλ, επάκουσον!». Αλλά ούτε φωνή ούτε ακρόαση. Ο Προφήτης Ηλίας τους λέει: «Είναι απασχολημένος ο Θεός σας και δεν σάς ακούει! Φωνάξτε πιο δυνατά!». Εκείνοι συνέχισαν να φωνάζουν και να ξεσχίζουν, όπως συνήθιζαν, τις σάρκες τους με μαχαίρια, για να πονάνε, και να φωνάζουν πιο δυνατά, για να τους ακούση ο Βάαλ. Αφού τελικά δεν κατόρθωσαν τίποτε, είπε ο Προφήτης Ηλίας: «Βρέξτε τα δικά μου ξύλα». «Τρισσεύσατε», τους είπε. Έρριξαν νερό μία, δυό, τρεις φορές! Αφού από το πολύ νερό είχαν γίνει μούσκεμα τα ξύλα και έτρεχαν από γύρω τα νερά. Μόλις προσευχήθηκε ο Προφήτης Ηλίας, έπεσε φωτιά από τον ουρανό και κάηκε ό,τι είχαν στο θυσιαστήριο για να θυσιάσουν, και το ίδιο το θυσιαστήριο μαζί! Τότε είπε: «Πιάστε τους ιερείς, γιατί παρασύρουν τον λαό στην ειδωλολατρία» και τους έσφαξε όλους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλοί λένε: «Καλά, πώς έσφαξε ο Προφήτης Ηλίας τόσους;». Ο Θεός δεν είναι βάρβαρος ούτε ο Προφήτης ήταν βάρβαρος. Οι ιερείς όμως των ειδώλων είχαν πλανήσει όλον τον κόσμο, αφού έφθασε ο Προφήτης Ηλίας να πή: «Έμεινα μόνος μου!». Τόσο πολύ! Αλλά και οι ιερείς των ειδώλων περισσότερο υπέφεραν από τα δικά τους σφαξίματα παρά από το μαχαίρι του Προφήτη Ηλία που έδωσε τέλος στο μαρτύριό τους. Ο πόνος από τα δικά τους ξεσχίσματα ήταν μεγαλύτερος. Γιατί, βλέπεις, ό,τι επιτρέπει ο Θεός είναι φιλάνθρωπο, ενώ τα σφαξίματα τα δικά τους ήταν οδυνηρά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, στην Παλαιά Διαθήκη η τιμωρία του Θεού ήταν τόσο άμεση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην Παλαιά Διαθήκη εκείνη την γλώσσα, εκείνον τον νόμο καταλάβαιναν. Ο ίδιος ο Θεός ήταν και τότε, αλλά εκείνος ο νόμος ήταν για εκείνους τους ανθρώπους που δεν καταλάβαιναν αλλιώς. Μη σάς φαίνεται εκείνος ο νόμος σκληρός και το Ευαγγέλιο διαφορετικό. Ήταν ο νόμος που θα ωφελούσε εκείνη την εποχή. Δεν ήταν ο νόμος εκείνος βάρβαρος, αλλά η γενιά εκείνη ήταν βάρβαρη. Οι σημερινοί άνθρωποι μπορεί να κάνουν μεγαλύτερες βαρβαρότητες, αλλά τουλάχιστον μπορούν να καταλάβουν. Τώρα ένα κανδήλι κουνιέται και πόσο οι άνθρωποι συγκλονίζονται! Ενώ, βλέπεις, τότε πόσα έκανε ο Θεός! Έδωσε δέκα μάστιγες στον ΦαραΏ, για να βγάλη τους Ισραηλίτες από την Αίγυπτο. Κάνει ξηρά την Ερυθρά θάλασσα, για να περάσουν. Τους δίνει νεφέλη την ημέρα, για να μην τους καίη ο ήλιος, στήλη φωτεινή την νύχτα, για να τους οδηγή. Και μετά από τόσα γεγονότα έφθασαν στο σημείο να ζητήσουν για Θεό ένα χρυσό μοσχάρι[60]! Σήμερα οι άνθρωποι δεν θα έλεγαν ποτέ ότι ένα μοσχάρι θα τους οδηγήση στην Γη της Επαγγελίας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τον Θεό τον βάζουν σήμερα στην άκρη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός μας δίνει πλούσιες τις ευλογίες Του. Να μη δείχνουμε αχαριστία και Τον παροργίζουμε, γιατί έρχεται«η οργή του Θεού επί τους υιούς της απειθείας»[61]–μή γένοιτο. Στην εποχή μας δεν πέρασαν οι άνθρωποι ούτε πολέμους ούτε πείνα και λένε ότι δεν έχουν ανάγκη και από τον Θεό. Τα έχουν όλα και γι' αυτό δεν εκτιμούν τίποτε. Αν όμως έρθη δύσκολος καιρός, πείνα κ.λπ., και δεν έχουν τί να φάνε, τότε θα εκτιμήσουν και το ψωμί και την μαρμελάδα και όσα θα στερηθούν. Άμα δεν δοξάζουμε τον Θεό, επιτρέπει ο Θεός να έρθη μία δοκιμασία, για να εκτιμήσουμε τα πράγματα. Ενώ, όταν τα εκτιμούμε, δεν επιτρέπει ο Θεός να συμβή τίποτε το κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιότερα που δεν υπήρχαν αυτές οι μεγάλες ευκολίες, και η επιστήμη δεν είχε προχωρήσει τόσο, αναγκάζονταν οι άνθρωποι σε όλες τις δυσκολίες να καταφεύγουν στον Θεό, και ο Θεός βοηθούσε. Τώρα, επειδή η επιστήμη προχώρησε, τον Θεό Τον βάζουν στην άκρη. Πάνε χωρίς Θεό σήμερα. Υπολογίζουν: «Θα κάνουμε τούτο, θα κάνουμε εκείνο». Σκέφτονται την πυροσβεστική, σκέφτονται τις γεωτρήσεις, το ένα, το άλλο... Αλλά χωρίς Θεό τί θα κάνουν οι άνθρωποι; Οργή Θεού θα φέρουν. Βλέπεις, όταν δεν βρέχη, δεν λένε: «Θα κάνουμε προσευχή», αλλά «θά κάνουμε γεωτρηση». Και το κακό είναι ότι με αυτά  τα μέσα που υπάρχουν, σιγά-σιγά  όχι μόνον οι άπιστοι σκέφτονται έτσι, αλλά ακόμη και οι πιστοί αρχίζουν να ξεχνούν την δύναμη του Θεού. Το καλό είναι που μας ανέχεται ο Θεός. Αλλά την Πρόνοια του θεού ούτε καν την καταλαβαίνουν οι άνθρωποι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μία παρέα έλεγε: «Δεν έχουμε ανάγκη από τον Θεό, έχουμε γεωτρήσεις». Ενώ τώρα πρέπει να παρακαλέσουμε πιο πολύ τον Θεό να κάνη διπλό θαύμα, γιατί έχουν αλλοιώσει την φύση οι άνθρωποι με αυτά  που κάνουν. Παρατηρούσα τα σύννεφα, πήγαιναν αλέ-ρετούρ. Μαζεύονταν από εδώ, πήγαιναν εκεί, μία πάνω-μία κάτω. Φυσάει και τα παίρνει ο αέρας τα σύννεφα και αντί οι άνθρωποι να πούν, «τώρα πρέπει να κάνη διπλό θαύμα ο Θεός, για να κρατήση τα συννεφα», λένε, «δέν έχουμε ανάγκη από τον Θεό». Ευτυχώς που ο Θεός δεν παίρνει τοις μετρητοίς ό,τι λέμε, αλλιώς θα μας έκανε...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χτυπούν σε βάθος εκατό-εκατόν πενήντα μέτρα κάτω για νερό και δεν βρίσκουν νερό. Στο Ναύπλιο χτύπησαν μέχρι εκατόν ογδόντα μέτρα κάτω και έβγαλαν θαλασσινό νερό. Άλλοι πάλι είπαν τον Έλενο ποταμό να τον πάνε στην Αθήνα. Δέκα χρόνια θέλουν να τον πάνε στην Αθήνα και τί έξοδα! Και πάλι θα τελειώση το νερό. Δεν λένε ένα «ήμαρτον» οι άνθρωποι. Σε ένα κουσοχώρι, τώρα[62]με την ανομβρία, πήγε ένας πολιτικός και τους είπε ότι με ένα σύστημα θα καθαρίσουν τα νερά από τους βόθρους, για να έχουν νερό να πίνουν. Και το θεώρησαν σπουδαία ιδέα! Αυτό και μόνο σαν λογισμός δεν στέκει. Δήτε που φθάνουν, να πίνουν – με συγχωρήτε – τα ούρα τους οι άνθρωποι! Να το κάνουν αυτό σε μία πόλη που έχουν ξεφύγει οι άνθρωποι, δικαιολογείται κάπως, γιατί έχουν παρασυρθή από το κοσμικό πνεύμα. Αλλά σε ένα κουτσοχώρι το να τους βρη ένας σαν λύση να καθαρίζουν τα ούρα τους και να τα πίνουν, να το θεωρούν σπουδαίο και να μη στρέφουν λίγο το βλέμμα τους στον Θεό, να πούν ένα «ήμαρτον», για να ρίξη ο Θεός νερό, είναι φοβερό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και στο Άγιον Όρος πήγαν από ένα Μοναστήρι να φυτέψουν πεύκα, για να τα εκμεταλλευθούν μετά και να κάνουν χαρτί! Ξεράθηκαν όλα, ήρθε η τιμωρία από τον Θεό. Καλά, βρέ παιδί, χαρτοπετσέτες και χαρτί υγείας θα βγάζει το Άγιον Όρος; Καταλάβατε; Έκαναν τον κόπο τα φύτεψαν και όσα φύτεψαν –οργή Θεού! – ξεράθηκαν όλα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κατάλαβαν ότι δεν ήταν σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άχ, που να καταλάβουν! Μετά έφεραν μηχανήματα από την Γερμανία, να κάνουν γεώτρηση, να βγάλουν νερό! Χάθηκε και το νερό που υπήρχε. Βλέπεις, άμα φύγη η ευαισθησία η πνευματική, που οδηγεί η εμπορική αντιμετώπιση; Γι' αυτό σιγά-σιγά  χάνεται από τον Μοναχισμό αυτή η ευλάβεια. Δεν καταλαβαίνουν ότι, αν δεν βρέξη, θα χαθούν και τα νερά που υπάρχουν. Χρησιμοποιούν μόνον την λογική, και τον Θεό Τον βάζουν στην άκρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αναφέρεται στην Παλαιά Διαθήκη[63]ότι σε μία πολιορκία της Σαμαρείας από τους Σύριους είχε τελειώσει και το νερό. Έπεσε δυστυχία, ψοφούσαν τα ζώα και έφθασαν οι μητέρες να τρώνε τα παιδιά τους. Πάει ο Προφήτης Ελλισαιέ στον οικονόμο του βασιλιά Ιωράμ και του λέει: «Τα ζώα ψόφησαν, οι άνθρωποι πεθαίνουν από την πείνα, αλλά ο Θεός θα βοηθήση». Ο οικονόμος, που τα τακτοποιούσε όλα με την λογική, του λέει: «Πώς θα βοηθήση; Από τον ουρανό θα στείλη ο Θεός;». Τότε ο Προφήτης του είπε: «Αύριο ο Θεός θα στείλη βοήθεια, αλλά εσύ δεν θα την χαρής». Και πράγματι την επόμενη μέρα έφερε ο Θεός τέτοιο πανικό στο εχθρικό στρατόπεδο –άκουγαν οι εχθροί ποδοβολητό αλόγων, θόρυβο αρμάτων, βούιζαν τα αυτιά τους και νόμιζαν ότι ήραν Αιγύπτιοι για ενίσχυση – που το έβαλαν στα πόδια και άφησαν σκηνές, τρόφιμα, όπλα, ό,τι είχαν. Και καθώς επέστρεφαν έντρομοι στην πατρίδα τους, άφηναν στους δρόμους τα ιμάτια και τα πολεμοφόδιά τους. Εν τω μεταξύ τέσσερις λεπροί Ισραηλίτες που ήταν έξω από την πόλη, είπαν: «Δεν πάμε στο εχθρικό στρατόπεδο μήπως βρούμε τίποτε να φάμε; Έτσι και αλλιώς θα πεθάνουμε». Πλησιάζουν μία σκηνή, άδεια. Πλησιάζουν άλλη, άδεια. Πουθενά εχθροί! Παίρνουν τρόφιμα, πράγματα, ολόκληρα τσουβάλια. Ειδοποίησαν ότι οπισθοχώρησαν οι εχθροί, αλλά οι Ισραηλίτες νόμισαν ότι είναι σχέδιο. «Θα κρύφτηκαν οι εχθροί, είπαν, για να ανοίξουμε τις πύλες και να μπούν μέσα». Τότε ένας αξιωματικός είπε: «Πέντε ζώα μας έμειναν. Δεν στέλνουμε στρατιώτες να δούν τί συμβαίνει;». Πήγε κάθε στρατιώτης προς μία κατεύθυνση καί, όταν επέστρεψαν, είπαν: «Οι εχθροί έφυγαν πανικόβλητοι και άφησαν ό,τι είχαν». Τότε έτρεξαν όλοι οι Ισραηλίτες να βγουν από το κάστρο, για να πάρουν τρόφιμα κ.λπ. Και καθώς έβγαιναν, τσαλαπάτησαν τον οικονόμο στην είσοδο του κάστρου, που προσπαθούσε να επιβάλη την τάξη. Έτσι, όπως είχε πει ο Προφήτης Ελισαιέ, ο οικονόμος είδε την βοήθεια του Θεού, αλλά δεν την χάρηκε. Βλέπετε πώς ο Θεός τα τακτοποίησε όλα;'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός να λυπηθή τον κόσμο, να ρίχνη καμμιά βροχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πώς τα έχει οικονομήσει ο Θεός! Λειώνουν τα χιόνια, γεμίζουν οι πηγές. Τώρα[64]ούτε χιόνια ούτε βροχές. Τί θα γίνη; Τί θα πιή ο κόσμος; Ο Θεός να λυπηθή τον κόσμο, να μας ευχπλαχνισθή, να ρίχνη καμμιά βροχή, γιατί, αν συνεχίσουν οι ανομβρίες, σιγά-σιγά  θα ξεραθούν και τα φύλλα των Δένδρων και δεν θα βλέπουμε όχι μόνον πράσινη ελιά αλλά ούτε φύλλο πράσινο. Ό,τι κι αν σπείρη ο άνθρωπος, αν ο Θεός δεν ρίξη από πάνω τον αγιασμό, την βροχή, τίποτε δεν γίνεται. Η βροχή είναι αγιασμός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο καημένος ο κόσμος, έτσι όπως έμαθε με πολλά νερά, τί θα κάνη με την έλλειψη του νερού; Εκτός που από την αμαρτία δεν ρίχνει νερό ο Θεός, αλλά και τόσο νερό που ξοδεύουν οι άνθρωποι, πώς να φθάση; Σκέφτομαι στις πόλεις τί θα γίνει! Μόνο για το καζανάκι θέλουν έναν τενεκέ νερό. Θα γεμίσουν μικρόβια, μετά χολέρα. Θα πεθαίνουν και θα τους αφήνουν άταφούς τους νεκρούς και θα ρίχνουν σκόνη για απολύμανση. Ευτυχώς ο Καλός Θεός ακόμη οικονομάει λίγο τον κόσμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ζούμε σε χρόνια Αποκαλύψεως. Η ξηρασία που περνούμε τόσα χρόνια, η ανομβρία, τί είναι; είχε παρουσιασθή ποτέ τέτοια ανομβρία; Νά, και εδώ στην Χαλκιδική ξεράθηκε ένα ποτάμι, ψόφησαν τα ψάρια, βρωμούσε ο τόπος. Στην Θεσσαλονίκη έχουν πρόβλημα. Το νερό της λίμνης του Μαραθώνα έχει κατεβή πολύ και φαίνονται νησάκια-νησάκια. Η στάθμη του Πηνειού κατέβηκε. Ο Έβρος είχε λίγο νερό και οι Βούλγαροι το έφραξαν και έχει στερέψει. Αν γίνει κάτι, τα τάνκς περνούν. Και στην Κύπρο, αν δεν βρέξη φέτος, θα έχουν μεγάλο πρόβλημα νερού. Μόνον αυτά; Τόσα άλλα!... Τα Δένδρα, άλλα καίγονται, άλλα χαλάνε. Οι άνθρωποι αρρωσταίνουν και πεθαίνουν. Όταν ο κόσμος δεν μετανοή, τί βροχή να ρίξη ο Θεός; Αν έχη κανείς εμπιστοσύνη στον Θεό, ξέρετε τί γίνεται; Μικρό πράγμα είναι να έχη κανείς σύμμαχο τον Θεό; Για τον Θεό δεν υπάρχει ούτε δύσκολο θέμα ούτε δύσκολη λύση. Όλα είναι απλά για τον Θεό. Δεν χρησιμοποιεί μεγαλύτερη δύναμη για τα υπερφυσικά και μικρότερη για τα φυσικά αλλά την ίδια δύναμη για όλα. Το κυριώτερο είναι ο άνθρωπος να γαντζωθή στον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εσείς κάνετε προσευχή για να βρέξη ή δεν σάς απασχολεί το θέμα; Τώρα είναι εποχή να οργώση ο κόσμος, για να σπείρη. Έπρεπε ήδη να είναι σπαρμένα τα χωράφια, και ακόμη δεν μπορούν να τα οργώσουν. Είναι μία δοκιμασία από τον Θεό αυτή η ανομβρία. Το έργο του μοναχού αυτό είναι, να κάνη προσευχή σε τέτοιες περιπτώσεις. Πάντως από σάς έχω ένα παράπονο. Την άλλη φορά, άνω ο κόσμος θέριζε τα σιτάρια για σανό, επειδή δεν έβρεξε, εσείς ούτε καν το κάνατε θέμα προσευχής. Γιατί; Επειδή εσείς ποτίζατε με το λάστιχο; Λοιπόν, αυτή θα είναι τελευταία φορά, άλλη φορά θα πρέπη να πονάτε για τον κόσμο. Θα μαθαίνετε και θα κάνετε προσευχή. Να γράφετε και σ́ εμένα. Θα δώσετε εξετάσεις. Αν περάσετε, δηλαδή αν βρέξη, θα σάς κάνω συνέταιρους στην προσευχή και ό,τι θα παίρνουμε από την θεία Πρόνοια θα το μοιράζουμε...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν κάνω προσευχή για βροχή και βλέπω έστω και ένα σύννεφο στον ουρανό (ακόμη και να μη ρίξη βροχή), δοξάζω τον Θεό που παρουσίασε έστω και ένα σύννεφο, και με πειράζει η συνείδηση που υπάρχουν μέσα μου πολλά πνευματικά σύννεφα, τα οποία διώχνουν τα σύννεφα του Θεού. Αν ταπεινά ζητούμε το έλεος του Θεού, ο Θεός θα βηθήση. Η προσευχή του ταπεινού μαζεύει σύννεφα, όταν είναι ανομβρία. Και πάντα να ευχώμαστε η βροχή που θα ρίξη ο Θεός να έχη και πνευματική ενέργεια, να σβήνη την πνευματική πυρκαγιά που έβαλε ο κακός διάβολος στον κόσμο και καίει ψυχές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Χάρηκα μερικούς που άκουσα να λένε: «Δεν είμαστε άξιοι, αλλά ο Θεός πάλι μας λυπήθηκε, έρριξε και λίγη βροχή και λίγα χιόνια». Αν έχουμε τέτοιους ταπεινούς λογισμούς, ο Θεός θα στείλη περισσότερα. Τουλάχιστον η αναγνώριση είναι μετάνοια. Ευτυχώς που υπάρχει λίγο προζύμι. Να παρακαλάτε να στρίψη λίγο με το κατσαβιδάκι ο Θεός το μυαλό των ανθρώπων. Βλέπω μία καλή διάθεση σε μερικούς μεγάλους. Καταλαβαίνουν που πάμε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός να δίνη μετάνοια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ώ, αν καταλαβαίναμε την μακροθυμία του Θεού! Εκατό χρόνια χρειάσθηκαν για να γίνη η Κιβωτός του Νώε[65]. Μήπως ο Θεός δεν μπορούσε να κάνη γρήγορα μία Κιβωτό; Αλλά άφησε τον Νώε να παιδεύεται εκατό χρόνια, για να καταλάβουν και οι άλλοι και να μετανοήσουν. Εκείνος έλεγε: «Δέστε, θα γίνη κατακλυσμός! Μετανοήστε!». Εκείνοι τον κορόιδευαν. «Κλουβιά, έλεγαν, φτιάχνει» και είχαν τον χαβά τους. Και τώρα, σε δύο λεπτά μπορεί ο Θεός όλον τον κόσμο να τον συγκλονίση και να τον κάνη να αλλάξη, να γίνουν όλοι πιστοί, σούπερ πιστοί! Πώς; Αν γυρίση το κουμπί στον σεισμό σιγά-σιγά  από τα 5 στα 6 ρίχτερ... στα 7... Στα 8, οι πολυκατοικίες θα πάνε σαν τους μεθυσμένους, θα αρχίση η μία να χτυπά την άλλη. Στα 10 όλοι θα πούν: «Ήμαρτον! Σε παρακαλούμε, σώσε μας». Μπορεί και όλοι να πούν: «Καλόγεροι θα γίνουμε!». Μόλις όμως τελειώση ο σεισμός, ενώ ακόμη θα κουνιούνται λίγο, λαλά δεν θα πέφτουν, πάλι στα μπουζούκια θα τρέξουν. Γιατί η επιστροφή τους αυτή δεν θα έχη πραγματική μετάνοια, αλλά απλώς θα πούν έτσι, για να γλυτώσουν το κακό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν συμβαίνη λ.χ. μία θεομηνία και είναι οργή Θεού, αν προσευχηθούν οι δίκαιοι, δεν εισακούονται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ξέρεις τί γίνεται; Δεν είναι ότι έχει μετάνοια ο κόσμος, όποτε εισακούονται από τον Θεό οι δίκαιοι. Άλλο είναι όταν παροργίζουμε τον Θεό και το αναγνωρίζουμε, τότε λυπάται ο Θεός και μας βοηθάει. Αλλά, όταν δεν αναγνωρίζη κανείς ότι παροργίζει τον Θεό και συνεχίζη το τυπικό του, τότε πώς να ακούση ο Θεός τις προσευχές των δικαίων; Σφάλλει ο άνθρωπος; Πρέπει να καταλάβη ότι σφάλλει, για να τον συγχωρήση ο Θεός. Μετά, βλέπετε, οι πνευματικοί άνθρωποι, αν κάνουν κάποιο σφάλμα, δεν έχουν ελαφρυντικά. «Υπέρ των ημετέρων αμαρτημάτων και των του λαού αγνοημάτων», λέει μία ευχή[66]. Για τον καημένο τον κόσμο τα σφάλματα είναι «αγνοήματα», ενώ για τους πνευματικούς ανθρώπους είναι «αμαρτήματα». Γι'' αυτό, αν γίνη κάποιο σφάλμα από πνευματικούς ανθρώπους, είναι βαρύ. Οι κοσμικοί έχουν ελαφρυντικά. Φέτος[67]τον Δεκαπενταύγουστο που επίασε φωτιά στο Άγιον Όρος, ήταν κάτι φοβερό! Έφθασαν όλοι οι ειδικοί, αλλά κανείς δεν μπορούσε να κάνη τίποτε. Όλοι παρακολουθούσαν την φωτιά. Και μερικοί έλεγαν: «Γιατί η Παναγία δεν την σβήνει;». Φθάνουμε σε σημείο να βλασφημούμε το όνομα του Θεού. Μετά από έξι ημέρες επίασε πάλι φωτιά σε άλλο σημείο, αλλά επίασε βροχή και την έσβησε αμέσως. Δεν καταλαβαίνουν, πώς αυτή η φωτιά έσβησε και η άλλη δεν έσβηνε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ορισμένοι, χωρίς να γνωρίζουν τους πνευματικούς νόμους που λειτουργούν, προσεύχονται με πόνο, αλλά δεν εισακούονται, γιατί είναι πια οργή Θεού. Ορισμένοι πάλι δεν προσεύχονται, δεν κάνουν ούτε ένα κομποσχοίνι, γιατί συμφωνούν με την δικαία οργή του Θεού, που σκοπό έχει να συνετίση τους ανθρώπους. Ο Θεός να φωτίση περισσότερο εμάς τους μοναχούς, γιατί οι περισσότεροι είμαστε μωρές παρθένες και τα λυχνάρια μας έχουν νερό με λίγο λάδι στο φιτίλι. Οι κοσμικοί περιμένουν από εμάς να τους φωτίσουμε τον δρόμο, για να μη σκοντάφτουν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να παρακαλούμε να δίνη ο Θεός μετάνοια στον κόσμο, για να αποφύγουμε την δικαία οργή του Θεού. Η μέλλουσα οργή του Θεού δεν μπορεί ν' αντιμετωπισθή διαφορετικά παρά μόνο με μετάνοια και τήρηση των εντολών Του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Δευτερο Μεροσ – Ο σημερινός πολιτισμός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ο πολιτισμός καλός είναι, αλλά,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιά να ωφελήση, πρέπει να «πολιτισθή» και η ψυχή».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η σοφία του Θεού και το περιβάλλον
- type: h2
  initial:
    ru: ''
  text:
    ru: «Πάντα εν σοφία εποίησας...»[68]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, να χαλάσουμε τις χελιδονοφωλιές; Τα χελιδόνια λερώνουν και μαζεύονται κοριοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορείς εσύ να κάνης μία χελιδονοφωλιά; Τί έχει κάνει ο Θεός με έναν Του λόγο! Τί αρμονία, τί ποικιλία! Όπου και να στραφή κανείς βλέπει την σοφία και το μεγαλείο του Θεού. Δές τα ουράνια φώτα, τα αστέρια, με πόση απλότητα τα σκόρπισε το θεϊκό Του χέρι, χωρίς να χρησιμοποιήση μαστορικό ράμμα και αλφάδι. Πόσο ξεκουράζουν τους ανθρώπους! Ενώ τα κοσμικά φώτα, βαλμένα με τάξη στην σειρά, είναι πολύ κουραστικά. Με πόση αρμονία τα έχει κάνει όλα ο Θεός! Βλέπεις, και τα Δένδρα σε ένα δάσος που τα φύτεψαν άνθρωποι είναι σαν στρατός, σαν λόχος. Ενώ τα φυσικά δάση πόσο ξεκουράζουν! Αλλά Δένδρα μικρά, άλλα μεγάλα, με άλλο χρώμα το καθένα! Ένα μικρό λουλούδι του Θεού έχει μεγαλύτερη χάρη παρά ένας σωρός χάρτινα ψεύτικα λουλούδια, διαφέρουν όσο διαφέρει και το άυλον από το νάυλον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλα αυτά  που έχει κάνει ο Θεός είναι θαυμάσια. Ο οργανισμός του ανθρώπου είναι ολόκληρο εργοστάσιο. Την καρδιά, το συκώτι, τα πνευμόνια, όλα τα έχει με σοφία κανονισμένα ο Θεός. Αλλά και τα φυτά, πώς τα έχει κάνει! Τότε με την κατοχή βάζαμε πέντε στρέμματα πεπόνια ποτιστικά. Μία φορά έκοψα από τις πεπονιές τα μεγάλα φύλλα που είναι κοντά στις ρίζες. Για καλό το έκανα, για να τις καθαρίσω. Εκείνα όμως τα μεγάλα φύλλα, τα κάτω, είναι σαν φίλτρο –είναι τά... «νεφρά» τους! – και παίρνουν όλη την πικρίλα. Και έγιναν τα πεπόνια!... Έτρωγες το πεπόνι και έτσουζε η γλώσσα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εσείς όλα τα παρακολουθείτε!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, από όλα βρίσκω τον Θεό! Και από τα φυτά και από τα ζώα, από όλα! Πώς να μη θαυμάσης! Βλέπεις ένα τόσο δά πουλάκι να ταξιδεύη, να πηγαίνη στην Αφρική και να γυρίζη χωρίς πυξίδα και να ξαναβρίσκη την φωλιά του! Και οι άνθρωποι με χάρτες, με πινακίδες να χάνωνται! Και δεν είναι ότι τα πουλιά βαδίζουν στην στεριά και βάζουν σημάδια! Πετούν στον ουρανό, πάνω από την θάλασσα! Που ν αβάλουν σημάδια; Μερικά μικρά πουλάκια ανεβαίνουν στους πελαργούς, στά... «αεροπλάνα»! Εκείνα πάνε... αεροπορικώς! Τα πουλιά, όταν πετούν στην θάλασσα, κάθονται σε κανένα νησί να ξεκουρασθούν. Μία φορά, όταν ήμουν στο Καλύβι του Τιμίου Σταυρού, είδα να έρχωνται από τα ανατολικά μέρη κάτι πουλιά σαν τα σπουργίτια. Ήταν ολόκληρο κοπάδι. Τέσσερα-πέντε όμως, φαίνεται, κουράσθηκαν και δεν μπορούσαν άλλο. Τότε ξεκόπηκαν ακόμη καμμιά δεκαπενταριά από το κοπάδι – τα άλλα προχώρησαν – και κάθησαν λίγο σε ένα Δένδρο, ξεκουράσθηκαν και μετά σηκώθηκαν να φύγουν όλα μαζί. Ανέβηκαν πολύ ψηλά, για να προσανατολισθούν και να βρουν πάλι την συντροφιά τους. Μου έκανε εντύπωση που δεν τα άφησαν μόνα τους τα τέσσερα-πέντε που κουράσθηκαν, αλλά ξεκόπηκαν και άλλα δεκαπέντε από το ίδιο κοπάδι, για να κάνουν συντροφιά!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσο όμορφα τα έχει κάνει όλα ο Θεός! Βλέπεις κάτι παρδαλά γατάκια! Τί όμορφα επανωφοράκια έχουν! Να ζηλεύουμε εμείς οι άνθρωποι τα επανωφόρια από τα ζώα! Ούτε βασίλισσα δεν φόρεσε τέτοιο επανωφόρι!... Όπου και να γυρίσης, θα δής την σοφία του Θεού. Παλιά που ήταν όλα φυσικά, πόσο όμορφα ήταν! Νά, ο πετεινός, όταν φωνάζη, δεν είναι ότι φωνάζει για τον καιρό. Στέκεται στο ένα πόδι καί, μόλις μουδιάζη, φωνάζει: «Κικιρίκου!». Σού λέει, τόσες ώρες πέρασαν. Αλλάζει πόδι, μουδιάζει και αυτό, πάλι: «Κικιρίκου!». Και βλέπεις, φωνάζει στις 12, στις 3, στις 6 η ώρα. Είναι σταθερό, κάθε τρεις ώρες! Και δεν έχει ρολόι ούτε μπαταρία, ούτε κούρδισμα χρειάζεται!...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ό,τι βλέπετε, ό,τι ακούτε, όλα να τα χρησιμοποιήτε για συγκοινωνία για επάνω. Όλα να σάς ανεβάζουν προς τα επάνω. Έτσι κανείς ανεβαίνει-ανεβαίνει από τα δημιουργήματα στον Δημιουργό! Οι Αμερικανοί πήγαν στο φεγγάρι, έβαλαν τουλάχιστον και μία πινακίδα που έγραφε: «Οι ουρανοί διιηγούνται δόξαν Θεού»[69]. Πήγαν και οι Ρώσοι στο διάστημα, αλλά ο Γκαγκάριν είπε πώς δεν βρήκε τον Θεό. Έμ, πώς να Τον βρή, αφού πήγε με τα πόδια προς τα πάνω και όχι με τα χέρια; Έτσι φθάνουν μετά να λένε: «Η φύση έκανε το σύμπαν»! Ολόκληρο σύμπαν τώρα!... Εδώ μία παλιά μηχανή χαλάει και μαζεύονται ένα σωρό μάστορες, τεχνίτες κ.λπ., για να την διορθώσουν. Σκέφτονται, προσπαθούν... Και είναι μία παλιά μηχανή! Ενώ ολόκληρη υδρόγειο σφαίρα ο Θεός την γυρίζει χωρίς ρεύμα και ούτε η μπαταρία τελειώνει ούτε το μηχανάκι σταματάει! Με τί ταχύτητα γυρίζει, και ο άνθρωπος να μην το καταλαβαίνη! Φοβερό! Αν η γη στρεφόταν με λιγώτερη ταχύτητα, θα έκανε τούμπες ο άνθρωπος! Η θάλασσα να έχη τόσο νερό και να κινήται με τέτοια ταχύτητ, και το νερό να μη χύνεται! Και τα αστέρια, που είναι ολόκληροι όγκοι, να γυρίζουν ιλιγγιωδώς και να μην εγγίζη το ένα το άλλο, αλλά να συγκρατή το ένα το άλλο από μακριά! Και ο άνθρωπος φτιάχνει ένα αεροπλάνο και θαυμάζει και υπερηφανεύεται! Και αν του στρίψη λίγο το μυαλό, μετά λέει ανοησίες, δεν καταλαβαίνει.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί κατόρθωσαν σήμερα οι άνθρωποι...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο πολιτισμός καλός είναι, αλλά, για να ωφελήση, πρέπει να «πολιτισθή» και η ψυχή. Αλλιώς είναι καταστροφή. Ο Άγιος Κοσμάς είπε: «Από τους γραμματισμένους θα έρθη το κακό»[70]. Παρόλο που η επιστήμη έχει προχωρήσει τόσο πολύ και έκανε πρόοδο μεγάλη, εν τούτοις με ό,τι κάνουν γί ανά βοηθήσουν τον κόσμο, χωρίς να το καταλαβαίνουν, καταστρέφουν τον κόσμο. Ο Θεός άφησε τον άνθρωπο να κάνη του κεφαλιού του, αφού δεν Τον ακούει, και έτσι τρώει το κεφάλι του. Καταστρέφεται μόνος του ο άνθρωπος με αυτά  που φτιάχνει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τί κατόρθωσαν οι άνθρωποι του 20ου αιώνος με τον πολιτισμό! Παλάβωσαν τον κόσμο, μόλυναν την ατμόσφαιρα, τα πάντα. Η ρόδα, αν ξεφύγη από τον άξονα, γυρίζει συνέχεια χωρίς σκοπό. Έτσι και οι άνθρωποι, άμα ξεφύγουν από την αρμονία του Θεού, βασανίζονται! Παλιά υπέφεραν οι άνθρωποι από τον πόλεμο, σήμερα υποφέρουν από τον πολιτισμό. Τότε έφευγαν από τις πόλεις στα χωριά εξ αιτίας του πολέμου και με ένα χωραφάκι περνούσαν. Τώρα θα φύγουν από τις πόλεις εξ αιτίας του πολιτισμού, γιατί δεν θα μπορούν να ζήσουν μέσα σ́ αυτές. Τότε ο πόλεμος έφερνε θάνατο. Τώρα ο πολιτισμός φέρνει αρρώστια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πλήθυνε τόσο πολύ ο καρκίνος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το Τσερνομπίλ κ.λπ. τί έκαναν; Από εκεί είναι. Αυτά  κάνουν οι άνθρωποι... Τί σακατεμένος κόσμος υπάρχει! Σε ποιά εποχή ήταν τόσοι άρρωστοι; Παλιά οι άνθρωποι δεν ήταν έτσι. Τώρα, όποιο γράμμα ανοίξω, καρκίνο ή ψυχοπάθεια ή εγκεφαλικό ή διαλυμένες οικογένειες, αυτά  θα συναντήσω. Άλλοτε σπάνια υπήρχε καρκίνος. Βλέπεις, ήταν φυσική η ζωή. Άλλο θέμα τί επέτρεπε ο Θεός. Έτρωγε κανείς φυσικές τροφές και ήταν υγιέστατος. Φρούτα, κρεμμύδια, ντομάτες, ήταν όλα καθαρά. Τώρα και αυτές οι φυσικές τροφές σακατεύουν τον άνθρωπο. Αυτοί που τρώνε όλο τέτοιες τροφές παθαίνουν μεγαλύτερη ζημιά, γιατί όλα έχουν μολυνθή. Αν ήταν παλιά έτσι, εγώ θα πέθαινα από νέος, γιατί σαν καλόγερος έτρωγα ό,τι είχε ο κήπος, πράσα, μαρούλια, κρεμμύδια, λάχανα, όλο τέτοια, και ήμουν μία χαρά. Τώρα έχουν λιπάσματα, ραντίσματα. Τί τρώνε σήμερα οι άνθρωποι! Το άγχος, οι νοθευμένες τροφές αρρώστια φέρνουν. Αχρηστεύεται ο κόσμος, όταν χρησιμοποιή αδιάκριτα την επιστήμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παλιά πώς άντεχαν οι άνθρωποι περισσότερο στην άσκηση και ήταν πιο υγιείς; Βοηθούσαν και οι τροφές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατί ήταν οι τροφές καθαρές τότε. Αυτό χρειάζεται συζήτηση; Και όλα τα έτρωγαν ώριμα. Τώρα όλα τα κόβουν άγουρα, για να μη χαλάσουν, και τα αφήνουν στο ψυγείο. Τα μαζεύουν πράσινα-πράσινα και τα αφήνουν να ωριμάσουν. Ενώ πρώτα ωρίμαζε το φρούτο, έπεφτε κάτω από το Δένδρο ή, μόλις το επίανες, κοβόταν. Αλλά εκτός που έτρωγαν καλές, υγιεινές τροφές – ψωμί και βούτυρο ή γάλα ήταν για το παιδί γερή τροφή –, δούλευαν και το μυαλό τους οι άνθρωποι και καταλάβαιναν, όταν πάθαιναν κάτι, αν ήταν από τις τροφές. Τώρα και οι τροφές είναι νοθευμένες και το μυαλό δεν το δουλεύουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και πόσα από αυτά  που φτιάχνει τώρα ο άνθρωπος είναι άχρηστα. Το μαλλί σιγά-σιγά  το καταργούν. Δύσκολα να βρής μάλλινη φανέλλα να κρατά τον ιδρώτα. Φορώ μία φανέλλα μάλλινη και αμέσως καταλαβαίνω αν έχη συνθετικό, γιατί δεν μπορώ να πάρω αναπνοή, με πιάνει δυσφορία, πάω να σκάσω! Και το θεωρούν στέρεο, πιο καλό! Το θεωρούν πρόοδο! Είναι όμως υγιεινά αυτά; έτσι όπως τα κάνουν είναι ανθυγιεινά. Και γράφουν «αγνό παρθένο μαλλί»! Και θα βρουν και άλλες καθαρώτερες λέξεις, για να τα διαφημίζουν! Τα πρόβατα τώρα να τα έχουμε μόνο για το κρέας, αφού φτιάχνουμε μαλλί από πετρέλαιο. Και οι μεταξοσκώληκες λένε: «Αφού θέλετε καλύτερο μετάξι, φτιάξτε το εσείς»!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Χάθηκε η υπομονή από τους ανθρώπους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί σήμερα δεν έχουμε υπομονή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η σημερινή κατάσταση δεν βοηθάει τον κόσμο. Άλλοτε η ζωή ήταν ήρεμη και οι άνθρωποι ήταν ήρεμοι και η βιασύνη που μπήκε στον κόσμο έκανε τους ανθρώπους ανυπόμονους. Παλιά ήξερε κανείς ότι θα φάη ντομάτα τέλη Ιουνίου, δεν τον απασχολούσε. Περίμενε τον Αύγουστο να φάη καρπούζι. Ήξερε, τότε θα φάη σύκα, τότε θα φάη πεπόνι. Σήμερα τί γίνεται; θα πάη να φέρη ντομάτες από την Αίγυπτο νωρίτερα, δεν θέλει πορτοκάλλια που έχουν τις ίδιες βιταμίνες. «Βρε, παιδάκι μου, Κάνε υπομονή και φάε κάτι άλλο τώρα». Όχι, θα πάη καλά και σώνει να φέρη από την Αίγυπτο ντομάτες. Σαν είδαν έτσι, άρχισαν στην Κρήτη να βάζουν θερμοκήπια, για να βγάλουν νωρίτερα ντομάτες. Και τελικά εφτίαξαν παντού θερμοκήπια, για να τρώνε και τον χειμώνα ντομάτες. Σκοτώνονται να φτιάξουν θερμοκήπια με όλα τα είδη, για να έχουν από όλα όλες τις εποχές και να μην περιμένουν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εντάξει μέχρις εκεί! Αλλά προχωράνε και πιο πέρα. Αποβραδίς είναι πράσινες οι ντομάτες και το πρωί τις παρουσιάζουν κόκκινες, φουσκωμένες! Έβαλα τις φωνές σε έναν υπουργό: «Τέλος πάντων τα θερμοκήπια, του λέω. Αλλά να βάζουν ορμόνες, για να ωριμάζουν σε μία νύχτα τα φρούτα, οι ντομάτες κ.λπ., και όσοι έχουν μία ορμονική ευαισθησία, οι καημένοι, να παθαίνουν ζημιά;». Και τα ζώα τα έχουν καταστρέψει. Τί κοτόπουλα, τί μοσχάρια! Αυτά  που είναι σαράντα ημερών, τα κάνουν έξι μηνών με τις ορμόνες. Τα τρώει ο άνθρωπος και τί θα ωφεληθή από αυτά; Συνέχεια ορμόνες, για να βγάζουν περισσότερο γάλα οι αγελάδες και τελικά οι παραγωγοί δεν μπορούν να το διαθέσουν. Απεργίες μετά, χύνουν το γάλα στους δρόμους, γιατί πέφτει η τιμή, και ο κόσμος πίνει γάλα ορμονούχο. Ενώ, αν τα άφηναν όπως τα έκανε ο Θεός, όλα θα πήγαιναν ομαλά και θα έπιναν και αγνό γάλα. Και με τις ενέσεις όλα άνοστα γίνονται. Άνοστα πράγματα, άνοστοι άνθρωποι, όλα άνοστα! Δεν έχει νοστιμάδα και η ζωή τους τώρα. Ρωτάς νέα παιδιά: «Τί σε αναπαύει;». «Τίποτε», σού λένε. Κοτζάμ παλληκάρια! «Τί σε ευχαριστεί να κάνης;». «Τίποτε». Που φθάνει ο άνθρωπος! Νομίζει ότι θα διορθώση τον Θεό μ'' αυτά  που κάνει! Την νύχτα την κάνουν ημέρα, για να γεννούν οι κότες. Και είδες κάτι αυγά; Αν έκανε ο Θεός το φεγγάρι να φέγγη σαν τον ήλιο, θα παλάβωναν οι άνθρωποι. Ενώ ο Θεός έκανε την νύχτα, για να ξεκουράζωνται οι άνθρωποι, τώρα που έφθασαν!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χάθηκε η ηρεμία από τους ανθρώπους. Τα θερμοκήπια, οι ενέσεις στα κηπευτικά κ.λπ. οδήγησαν και αυτά  τον κόσμο στην ανυπομονησία. Παλιά ήξεραν ότι θα πάνε στο τάδε μέρος με τα πόδια σε τόσες ώρες. Ένας, αν είχε πιο γερά πόδια, θα πήγαινε λίγο νωρίτερα. Μετά βρήκαν τα κάρρα. Μετά τα αυτοκίνητα, τα αεροπλάνα κ.ο.κ. Συνέχεια προσπάθεια να βρουν άλλα μέσα πιο γρήγορα. Εφτίαξαν αεροπλάνα[71], που να μπορής να πάς από την Γαλλία στην Αμερική σε τρεις ώρες. Μά όταν πάη με τέτοια ταχύτητα κανείς από το ένα κλίμα στο άλλο, και μόνον η απότομη αλλαγή θα τον μπερδέψη. Βιασύνη, βιασύνη... Σιγά-σιγά  θα μπαίνη στο βλήμα ο άνθρωπος, θα πατάνε την σκανδάλη, θα εκτοξεύεται το βλήμα, θα σκάη και θα βγαίνη ένας παλαβός! Που θα πάη; Εκεί θα καταλήξουν. Τρελλοκομείο!
- type: h2
  initial:
    ru: ''
  text:
    ru: Μόλυναν την ατμόσφαιρα, τα οστά τους πείραξαν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σκέφτονται να αρχίσουν να καίνε τους νεκρούς για λόγους υγιεινής και για εξοικονόμηση χώρου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για λόγους υγιεινής; Ακούς κουβέντα! Δεν ντρέπονται που το λένε; Όλη την ατμόσφαιρα την έχουν μολύνει, τα οστά τους πείραξαν; Τα οστά στο κάτω-κάτω είναι και πλυμένα! Και για εξοικονόμηση χώρου; Ολόκληρη Ελλάδα με τόσα ρουμάνια και δεν βρίσκουν χώρο; Έβαλα τις φωνές σε έναν καθηγητή του Πανεπιστημίου γι' αυτό το θέμα. Πώς για τα σκουπίδια βρίσκουν τόσο τόπο και για τα οστά που είναι ιερά δεν βρίσκουν; Χάθηκε ο τόπος; Και πόσα οστά Αγίων μπορεί να είναι ανάμεσα σ́ αυτά! Το σκέφτονται αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην Ευρώπη καίνε τους νεκρούς, όχι γιατί δεν υπάρχει χώρος να τους θάψουν, αλλά γιατί το θεωρούν πρόοδο. Δεν ανοίγουν κανένα δάσος, για να κάνουν χώρο, αλλά καίνε τους νεκρούς, τους κάνουν σκόνη, για να ανοίξουν χώρο... Βάζουν την σκόνη σε ένα τόσο δά κουτάκι για περισσότερη ευκολία και αυτό το θεωρούν πρόοδο. Τους καίνε τους νεκρούς, γιατί θέλουν οι μηδενιστές να τα διαλύσουν όλα, ακόμα και τον άνθρωπο. Να μη μείνη τίποτε που να θυμίζη στους ανθρώπους τους γονείς, τους παππούδες, την ζωή των προγόνων τους. Να ξεκόψουν τους ανθρώπους από την παράδοσή τους. Να τους κάνουν να ξεχάσουν την άλλη ζωή και να τους δέσουν σ́ αυτή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Λένε όμως, Γέροντα, ότι έχει δημιουργηθή θέμα σε ορισμένους Δήμους της Αθήνας για το που θα θάβουν τους νεκρούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τόσος τόπος υπάρχει! Χάθηκε λίγο μέρος; Ένα σωρό εκτάσεις υπάρχουν έξω από την Αθήνα και είναι του Δημοσίου. Εγώ ξέρω μεγάλους που έχουν ένα σωρό εκτάσεις εκεί πέρα. Δεν μπορούν να κάνουν εκεί ένα νεκροταφείο; Και μετά οι περισσότεροι είναι από τις επαρχίες. Γιατί δεν τους πάνε στον τόπο τους; Να πάνε να τον θάψουν τον καθένα στον τόπο του. Εκεί δεν θα έχουν και έξοδα πολλά, μόνο για την μεταφορά. Να πούνε ότι όσοι είναι από τις επαρχίες και ήλθαν τώρα τελευταία στην Αθήνα, όταν πεθαίνουν, να θάβωνται στην επαρχία. Και είναι και καλύτερα. Γι' αυτούς που είναι τρεις γενεές στην Αθήνα, να βρουν μία λύση εκεί. Ύστερα, μετά την εκταφή να κάνουν λάκκους πιο βαθείς και εκεί να βάζουν τα οστά. Δύσκολο είναι; Εδώ κατεβαίνουν τόσο βαθιά μέσα στην γή, για να βγάλουν πετροκάρβουνα. Ας κάνουν για τα οστά μία μεγάλη δεξαμενή και να τα έχουν όλα μαζεμένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έλειψε τελείως ο σεβασμός. Και βλέπεις τώρα τί γίνεται! Πετάνε και τους γονείς στα γηροκομεία. Παλιά και τα βόδια ακόμη τα γηροκομούσαν, δεν τα έσφαζαν, γιατί έλεγαν: «Φάγαμε ψωμί από αυτά».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και τί σεβασμό είχαν στους νεκρούς! Θυμάμαι με τί κίνδυνο πηγαίναμε να τους θάψουμε στον πόλεμο! Καλά, ο παπάς ήταν υποχρεωμένος να πάη, αλλά και αυτοί που τους μετέφεραν μέσα στα χιόνια, μέσα στην παγωνιά, και από πάνω να πέφτουν ριπές συνέχεια! Το 1945, στον ανταρτοπόλεμο, πριν πάω στρατιώτης, με τον νεωκόρο κουβαλούσα τους νεκρούς. Μπροστά πήγαινε με το θυμιατό ο παπάς. Μόλις σφύριζε βλήμα, πέφταμε κάτω. Άντε μετά να σηκωθούμε. Μόλις ακούγαμε άλλο, πέφταμε πάλι κάτω. Αργότερα στον στρατό, στον πόλεμο, ξυπόλυτοι ήμασταν μέσα στα χιόνια και μας είπαν να πάμε να πάρουμε, αν θέλουμε, αρβύλες από τους νεκρούς. Κανένας δεν κουνήθηκε. Άχ, πάνε εκείνα τα καλά τα χρόνια!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το κακό είναι ότι δεν φωνάζουν μερικοί που έχουν κάποια θέση, αλλά συμφωνούν. Η Εκκλησία, από την στιγμή που παρουσιάστηκε αυτό το πρόβλημα, πρέπει να πάρη θέση, για να λυθή. Γιατί έτσι αφήνει στους κοσμικούς να χειρίζωνται πνευματικά θέματα και να λένε ό,τι θέλουν. Είναι ασέβεια αυτό. Πώς να έχη την ευλογία από τον Θεό ο κόσμος σήμερα; Ά, χαμένα πράγματα! Πάνε σιγά-σιγά  τον άνθρωπο να τον εξευτελίσουν. Άχ, γι' αυτό θα βρεθή πολύς τόπος τώρα!... Θα βρεθή πάρα πολύς τόπος...
- type: h2
  initial:
    ru: ''
  text:
    ru: Μόλυνση και καταστροφή του περιβάλλοντος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο ήλιος καρφώνει και τον χειμώνα ακόμη σαν να είσαι στο Σινά, γιατί άνοιξαν τρύπες στην ατμόσφαιρα. Αν δεν φυσάη λίγο βόρεια, δεν μπορείς να σταθής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θα γίνη με το όζον;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Λίγη υπομονή θα κάνουμε, μέχρι να πάνε οι επιστήμονες με πέντε κιλά στόκο να βουλώσουν την τρύπα!!!... Ναί, ας πάνε να βουλώσουν τις τρύπες επάνω... Θα δούν ότι όλα ο Θεός τα έκανε καλά, με τόση αρμονία, και θα πούν: «Ευλόγησον, εμείς δεν τα κάναμε καλά». Να κάνετε προσευχή να βουλώση η τρύπα που άνοιξε στην ατμόσφαιρα. Άνοιξε μία «φιάλη»[72]και εκεί, ξεραίνονται τα Δένδρα, τα φυτά. Ο Θεός όμως μπορεί να το βολέψη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και να δήτε η πονηριά μερικών, για να μαζέψουν τα χρήματα των βαθύπλουτων, που έφθασε! Λένε: «Άνοιξε τρύπα στην ατμόσφαιρα, ο κόσμος θα χαθή. Πώς θα σωθή ο κόσμος; Ασχολήθηκε η επιστήμη με σχέδιο να σκάψουν βαθιά, να κατεβούν στο βάθος της γής, για ν'' αποφύγουν τον ήλιο». Επειδή δεν γίνεται τελικά αυτό, τώρα λένε: «Στο φεγγάρι θα γίνουν εγκαταστάσεις, εστιατόρια, ξενοδοχεία, σπίτια και θα πάη ο κόσμος εκεί. Όποιος θέλει να εξασφαλισθή, πληρώνει για ''κει»! Όλο ψέματα εν τω μεταξύ! Γιατί εκεί τί εγκαταστάσεις να έχουν; Εκεί δεν μπορεί να κατοικήση άνθρωπος. Μέσα στα «κλουβιά» πήγαν ένας-δυό και γύρισαν. Και τα πιστεύουν μερικοί και πληρώνουν...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλοί ανησυχούν για τα καυσαέρια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γι' αυτό το θέμα πρέπει να σφίξουν μερικούς εργοστασιάρχες να βάλουν μηχανές που να πιάνουν τους καπνούς, για να γλυτώσουν λίγο οι άνθρωποι από τα καυσαέρια. Αντί να δώση κάθε εργοστασιάρχης ένα ποσό σ́ έναν βουλευτή, για να βολευτή, να βάλη κάτι παραπάνω και να πάρη μία μηχανή. Παλιά δεν υπήρχαν αυτά  τα μικρόβια, αυτό το νέφος. Τώρα όλα τα μόλυναν και αυτό το θεωρούν πρόοδο. Πρόοδο, και που πάνε! Καταστρέφουν τον άνθρωπο. Βγαίνεις έξω και ο αέρας μυρίζει καυσαέρια. Μόλις ανοίξης λίγο το παράθυρο, απ' έξω η καπνιά μπαίνει μέσα. Αυτή η κάπνα δεν βγαίνει, όταν πλένης τα χέρια σου, δεν είναι αθώα. Η άλλη από το τζάκι με έναν βήχα φεύγει από το πνευμόνι, γιατί δεν έχει λάδι, ενώ αυτή κολλάει στα πνευμόνια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στις πολυκατοικίες οι άνθρωποι είναι στριμωγμένοι ο ένας πάνω στον άλλο. Τινάζει ο ένας στο μπαλκόνι του άλλου. Ο πρώτος ο καημένος τί τραβάει! Πάνε σ́ αυτόν όλες οι σκόνες και τα σκουπίδια των άλλων. Έχει τα ρούχα κάτω απλωμένα ή έχει ανοικτό παράθυρο, ο άλλος τινάζει από πάνω! Δεν τον σκέφτεται. Τα παλιά χρόνια οι πολυκατοικίες αυτές θα ήταν φυλακές, το Γιεντί-Κουλέ[73]. Ναί, φοβερό! Τότε τα σπίτια είχαν την αυλή, τα ζώα, τον κήπο, τα δενδράκια και έναν σωρό πουλιά μαζεύονταν εκεί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τώρα, Γέροντα, δεν βλέπουν ούτε χελιδόνια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χαμένο το έχουν τα χελιδόνια να πάνε εκεί; Τρελλάθηκαν; Σιγά-σιγά  δεν θα ξέρουν οι άνθρωποι τί είναι χελιδόνι. Στην Αμερική, σε ένα Πανεπιστήμιο, στο τμήμα που ασχολούνται ιστορικά με την Αγία Γραφή, την Καινή και την Παλαιά Διαθήκη, για να καταλάβουν τί θα πη «σιτάρι», έχουν σπαρμένο ένα χωράφι με σιτάρι. Για να καταλάβουν τί θα πη «βοσκός» και τί θα πη «προβατίνα», έχουν ένα κοπάδι με λίγα πρόβατα και έναν βοσκό με μία γκλίτσα! Και είναι Πανεπιστήμιο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχουν μολύνει όλη την ατμόσφαιρα. Βλέπεις, χειμώνας καιρός και πώς μυρίζουν τα σκουπίδια! Σκέψου το καλοκαίρι τί γίνεται! Και δεν πάει και το αεροπλάνο να ρίξη λίγο φάρμακο! Ευτυχώς που ο Θεός έχει κάνει τα λουλούδια που ευωδιάζουν. Τόσα λουλούδια που υπάρχουν, τέτοια ποικιλία, μικρά-μεγάλα, εξουδετερώνουν την βρωμιά που υπάρχει. Αν δεν ευωδίαζε έτσι η ατμόσφαιρα, τί θα γινόταν; βλέπεις, ένα ψοφίμι υπάρχει κάπου και βρωμάει ο τόπος! Πώς μας οικονομάει ο Θεός! Αν δεν μας οικονομούσε, τί χάλια θα είχαμε! Σκέψου να μην υπήρχαν λουλούδια, βότανα... Έτσι σκεπάζεται η δυσοσμία η δική μας. Διασκεδάζεται με τα αρώματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με ρώτησε ένας λαϊκός στο Καλύβι: «Καλά, τί κάνεις εσύ εδώ; Μέρα-νύχτα τί κάνεις;». Ήταν γύρω ανθισμένες οι σουσούρες, όλη η πλαγιά γεμάτη λουλούδια. Μοσχοβολούσε ο τόπος! «Τί τραβάω, του λέω, όλη την ημέρα να ποτίσω και να περιποιηθώ όλα αυτά  που βλέπεις! Και στον ουρανό βλέπεις την νύχτα πόσα κανδήλια ανάβω! Δεν προλαβαίνω να τα ανάψω όλα!». Με κοίταζε! «Την νύχτα, λέω, δεν βλέπεις κανδήλια επάνω; Εγώ τ'' ανάβω!!! Προλαβαίνω; Δεν είναι απλό σε τόσα κανδήλια να βάζης κανδηλήθρες, λάδι!!». Τάχασε ο καημένος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και τα ραντίσματα είναι φαρμάκι. Με αυτά  τα ραντίσματα και τα πουλιά τα καημένα ψοφάνε. Στα Δένδρα ρίχνουν φάρμακα, για να μπορέσουν να αντιμετωπίσουν τις αρρώστιες, και μετά αρρωσταίνουν οι άνθρωποι. Δηλητηριάζουν τα πάντα. Δεν είναι καλύτερα να ρίχνουν λιγότερο φάρμακο και να παραχώνουν τα σάπια στις χωματερές αντί για τα γερά; Ολόκληρο σύννεφο με το ράντισμα και δεν θα πειράξη τον άνθρωπο; Ιδίως για τα μικρά παιδιά, αυτά  είναι θάνατος. Γι'' αυτό γεννιούνται άρρωστα. Είπα σε κάποιον: «Τί γίνεται; Σκοτώσατε τα έντομα και τώρα σκοτώνονται οι ανθρωποι». Ραντίζουν τα λουλούδια, για να σκοτώσουν τα έντομα και αρρωσταίνουν οι άνθρωποι. Μετά θα βρουν πιο δυνατά φάρμακα, και τελικά τί βγάζουμε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχει αποδειχθή ότι κάποια έντομα που τα σκότωσαν με τα ραντίσματα, σκότωναν άλλα. Τώρα θα αναπτύξουμε αυτά, για να σκοτώνουν τα άλλα. Πώς ο Θεός τα έχει κανονίσει! Όπου έχει τριζόνια, δεν υπάρχουν κουνούπια. Ήρθε στο Καλύβι ένας που είχε ένα μικρό μηχανάκι που έκανε έναν θόρυβο σαν τριζόνι, αλλά πιο άγριο, για να διώχνη τα κουνούπια. Σκοτώνουν τα τριζόνια, που έβγαζαν και έναν γλυκό ήχο, και πάνε αυτό που έκανε ο Θεός να το κάνουν με μπαταρία! Τα σκότωσαν όλα, τρυγόνια, τριζόνια... Σπάνια να δής και κόρακα ακόμη. Σε λίγο θα βάζουμε τον κόρακα στο κλουβί!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εσείς, όταν ραντίζετε τα Δένδρα, αφήστε και λίγο τον Θεό να βοηθήση. Αν δεν πέση και παντού το φάρμακο, δεν πειράζει. Όλα τα μέσα τα σημερινά δεν τον βοηθούν τον άνθρωπο στην πίστη. Βλέπω, και αλλού ρωτούν: «Βγήκε φάρμακο γι'' αυτό; Που είναι; Στο εξωτερικό;». Τηλέφωνο αμέσως, να το πάρουν. Σιγά-σιγά  τον Θεό Τον βγάζουν στην άκρη και οι κοσμικοί και οι καλόγεροι. Δεν έχουν βάλει πρώτα την πνευματική εξέλιξη οι άνθρωποι, για να αγιάζωνται όλα. Το κακό είναι ότι και εμείς οι καλόγεροι δεν προχωρούμε πιο μπροστά από τους κοσμικούς στην πνευματική εξέλιξη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όμως τις ελιές τις πειράζει ο δάκος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να κάνετε κομποσχοίνι να φύγη ο δάκος, όχι μόνο με ραντίσματα. Να βάλετε και λίγο Χριστό. Μπαίνει και μία προσπάθεια να το κάνουμε καλό όπως στον κόσμο και δεν σκεφτόμαστε ότι εμείς οι μοναχοί πρέπει να έχουμε άλλον «κόσμο». Να μην πάμε να κάνουμε ό,τι κάνουν οι κοσμικοί ή και περισσότερο από αυτούς. Που είναι ο Χριστός; Δεν λέω να μη ραντίζετε καθόλου, αλλά και οι άλλοι κάνουν πειράματα. Και όταν είναι ανάγκη να ραντίσετε, να φοράτε μάσκες. Καλύτερα να έχετε λίγο δακωμένο καρπό παρά ραντισμένο. Να μην κάνετε πολλά ραντίσματα, να τα ελαττώσετε. Να κάνετε προσευχή με ευλάβεια, να διαβάζετε τον πρώτο Ψαλμό[74]και να ρίχνετε λίγο αγιασμό στα Δένδρα. Όταν ζήτε σωστά, και βροχή[75]θα έχετε και οι κάμπιες[76]θα σκοτώνονται. Θα σάς οικονομάη ο Θεός. Χρειάζεται ευλάβεια και εμπιστοσύνη στον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η εποχή των πολλών ευκολιών, ίσον των πολλών δυσκολιών[77]
- type: h2
  initial:
    ru: ''
  text:
    ru: Έγιναν και οι καρδιές σιδερένιες...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Επειδή οι ανθρώπινες ευκολίες ξεπέρασαν τα όρια, έγιναν δυσκολίες. Πλήθυναν οι μηχανές, πλήθυνε ο περισπασμός, έκαναν και τον άνθρωπο μηχανή, και τώρα οι μηχανές και τα σίδερα κάνουν κουμάντο και τον άνθρωπο. Γι'' αυτό έγιναν και οι καρδιές των ανθρώπων σιδερένιες. Με όλα αυτά  τα μέσα που υπάρχουν, δεν καλλιεργείται η συνείδηση των ανθρώπων. Παλιότερα οι άνθρωποι δούλευαν με τα ζώα και ήταν σπλαγχνικοί. Αν φόρτωνες το ζώο λίγο περισσότερο και το κακόμοιρο γονάτιζε, το λυπόσουν. Αν ήταν νηστικό και κοίταζε με παράπονο, σού ράγιζε την καρδιά. Θυμάμαι, όταν αρρώσταινε η αγελάδα μας, υποφέραμε και εμείς, γιατί την θεωρούσαμε μέλος της οικογενείας μας. Σήμερα οι άνθρωποι έχουν τα σίδερα και έχουν καρδιές σιδερένιες. Έσπασε ένα σίδερο; οξυγονοκόλληση. Χάλασε το αυτοκίνητο; το πάνε στο γκαράζ. Αν δεν γίνεται, το πετάνε, δεν το πονάνε. Σού λέει: «Σίδερο είναι!». Δεν δουλεύει καθόλου η καρδιά. Έτσι όμως καλλιεργείται η φιλαυτία, ο εγωισμός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δεν σκέφτεται τον άλλον σήμερα ο άνθρωπος. Παλιά, αν έμενε το φαγητό για την άλλη μέρα, θα χαλούσε, και σκέφτονταν οι άνθρωποι και κανέναν φτωχό. «Προκειμένου να χαλάση, έλεγαν, ας το δώσω στον φτωχό». Ένας που είχε πνευματική κατάσταση έλεγε: «Να φάη πρώτα ο φτωχός και ύστερα εγώ». Τώρα το βάζουν στο ψυγείο και δεν θυμούνται τον άλλον που έχει ανάγκη. Θυμάμαι, όταν είχαμε καλή σοδειά από λαχανικά κ.λπ., δίναμε και στους γείτονές μας, τα μοιράζαμε. Τί να τα κάναμε τόσα; Έπειτα θα χαλούσαν κιόλας. Τώρα έχουν τα ψυγεία. «Γιατί να δώσουμε στους άλλους; σού λέει. Τα βάζουμε στο ψυγείο και τάχουμε για μας». Άφησε που τόννους ολόκληρους πετούν ή θάβουν στην χωματερή και εκατομμύρια άνθρωποι αλλού πεινούν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Παλάβωσαν οι άνθρωποι με τις μηχανές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν έχουν τελειωμό τα σύγχρονα μέσα. Τρέχουν πιο πολύ από τον νού του ανθρώπου, γιατί βοηθάει και ο διάβολος. Παλιά οι άνθρωποι που δεν είχαν αυτά  τα μέσα, τηλέφωνα, φάξ, μηχανήματα ένα σωρό , είχαν την γαλήνη του, την απλότητά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χαίρονταν, Γέροντα, την ζωή τους!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, τώρα παλάβωσαν οι άνθρωποι με τις μηχανές! Βασανίζονται από τις πολλές ευκολίες, τους πνίγει το άγχος. Θυμάμαι, οι Βεδουΐνοι, τότε που ήμουν στο Σινά[78], πόσο χαρούμενοι ήταν. Είχαν μία σκηνή και ζούσαν απλά. Δεν μπορούσαν να ζήσουν στην Αλεξάνδρεια ή στο Κάιρο, αναπαύονταν στην ερημιά μέσα στις σκηνές. Λίγο τσάι αν είχαν, ήταν όλο χαρά και δοξολογούσαν τον Θεό. Αλλά τώρα με τον πολιτισμό άρχισαν και αυτοί να ξεχνούν τον Θεό. Μπήκαν και αυτοί στο ευρωπαϊκό πνεύμα! Τους εφτίαξαν οι Εβραίοι πρώτα καλύβια. Μετά τους πούλησαν όλα τα παλιά αυτοκίνητά του Ισραήλ[79]. Έ, τους Εβραίους! Κάθε Βεδουΐνος είναι τώρα με ένα καλύβι και ένα χαλασμένο αυτοκίνητο απ' έξω, και έχουν και άγχος. Χαλάει το αυτοκίνητο, να παιδεύωνται να το φτιάξουν... Και αν εξετάση κανείς, τί βγάζουν από όλα αυτά; Ίσα-ίσα έχουν πονοκέφαλο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά εφτίαχναν τουλάχιστον γερά πράγματα και κρατούσαν. Τώρα δίνεις του κόσμου τα χρήματα να πάρης κάτι και αμέσως χαλάει. Όποτε τα εργοστάσια δωσ́ του βγάζουν νέα πράγματα και μαζεύουν τα χρήματα του κόσμου. Σκοτώνονται στην δουλειά οι άλλοι, για να τα βγάλουν πέρα. Τα μηχανήματα είναι επιστήμη των Ευρωπαίων που ασχολούνται με τα κατσαβίδια. Πρώτα φτιάχνουν, ας υποθέσουμε, ένα καπάκι, μετά το κάνουν βιδωτό, μετά με κουμπί, πιο τέλειο, πιο τέλειο... Συνέχεια δηλαδή νέα μηχανήματα τελειότερα και ο καημένος ο κόσμος ζητάει να πάρη το τελειότερο. Δεν προλαβαίνουν να ξεχρεώσουν το πρώτο, παίρνουν δεύτερο και είναι χρεωμένοι και κουρασμένοι. Πάει και ο φτωχός να πάρη ένα αυτοκίνητο από τα πιο φθηνά. Πουλάει ό,τι έχει, τα βόδια, τα άλογα – σε λίγο, όπως πάνε, θα βάζουν τα γαϊδουράκια στην βιτρίνα και θα πληρώνουν, για να βλέπουν γαϊδουράκια! – και αγοράζει το αυτοκίνητο. Μετά του χαλάει. «Δεν υπάρχουν ανταλλακτικά», του λένε. Αναγκάζεται ο καημένος να πάρη άλλο. Να πάρη όμως τέλειο δεν μπορεί. Θα πάρη καλύτερο από το προηγούμενο και εκείνο θα πάη στην άκρη κ.ο.κ. Θέλει προσοχή! Να μην μπούμε και εμείς σ́ αυτό το κανάλι, άλλη μόδα πιο τελειοποιημένη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Έχει πάθει μεγάλη ζημιά ο κόσμος από την τηλεόραση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τώρα υπάρχει τέτοια τηλεοπτική επικοινωνία, ώστε το ίδιο λεπτό μπορεί να δη κανείς γεγονότα που συμβαίνουν στην άλλη άκρη της γής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μόνον τον εαυτό τους δεν βλέπουν οι άνθρωποι, όλο τον κόσμο τον βλέπουν. Τώρα καταστρέφεται ο κόσμος από το μυαλό του. Δεν είναι ότι τους καταστρέφει ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η τηλεόραση κάνει πολύ κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν κάνη, λέει! Ήρθε κάποιος και μου έλεγε: «Η τηλεόραση, Πάτερ, είναι καλή». «Καλά είναι τα αυγά, του λέω, άμα τα ανακατέψης όμως με κουτσουλιά, άχρηστα γίνονται». Έτσι γίνεται και με την τηλεόραση και το ραδιόφωνο. Σήμερα, αν ανοίξης το ραδιόφωνο, για να ακούσης μία είδηση, πρέπει να ανεχθής να ακούσης και ένα τραγούδι, γιατί, μόλις τελειώση ένα τραγούδι, θα πη μία είδηση. Παλιά δεν ήταν έτσι. Ήξερες τί ώρα θα έλεγε την είδηση στο ραδιόφωνο, τάκ, άνοιγες και άκουγες. Τώρα είσαι υποχρεωμένος να ακούσης και το τραγούδι, γιατί αν το κλείσης, θα χάσης την είδηση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχει πάθει μεγάλη ζημιά ο κόσμος από την τηλεόραση, ιδίως τα παιδάκια καταστρέφονται. Ήρθε ένα παιδάκι επτά χρονών με τον πατέρα του στο Καλύβι. Έβλεπα να μιλάη με το στόμα του το δαιμόνιό της τηλεοράσεως, όπως μιλάει το δαιμόνιο με το στόμα των δαιμονισμένων. Ήταν σαν ένα μωρό να γεννήθηκε με δόντια. Σήμερα συχνά δεν βλέπεις φυσιολογικά παιδιά, είναι τέρατα. Και βλέπεις, δεν παίρνουν μία στροφή παραπάνω, αλλά αυτό που έχουν ακούσει, αυτό που έχουν δεί, αυτό επαναλαμβάνουν. Έτσι θέλουν οι άλλοι να αποβλακώσουν τον κόσμο με την τηλεόραση. Δηλαδή, αυτά  που ακούν οι άνθρωποι, αυτά  να πιστεύουν, αυτά  να κάνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μας ρωτούν μητέρες πώς να κόψουν τα παιδιά τους από την τηλεόραση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να δώσουν στα παιδιά να καταλάβουν ότι με την τηλεόραση αποβλακώνονται, δεν μπορούν να σκέφτωνται. Ας αφήσουμε ότι χαλούν τα μάτια τους. Αυτή η τηλεόραση είναι έργο του ανθρώπου, αλλά υπάρχει και άλλη τηλεόραση, η πνευματική. Όταν δηλαδή με την απέκδυση του παλαιού ανθρώπου καθαρίζωνται και τα μάτια της ψυχής, τότε βλέπει ο άνθρωπος πιο μακριά χωρίς μηχανές. Είπανε στα παιδιά τους γι'' αυτή την τηλεόραση; Να καταλάβουν την πνευματική τηλεόραση, γιατί με αυτά  τα κουτιά θα χαζέψουν. Οι Πρωτόπλαστοι είχαν το διορατικό χάρισμα. Αυτό χάθηκε μετά την πτώση. Όταν διατηρήσουν τα παιδιά την Χάρη του Αγίου Βαπτίσματος, θα έχουν και διορατικό χάρισμα, πνευματική τηλεόραση. Θέλει προσοχή, δουλειά πνευματική. Οι μανάδες σήμερα χάνονται με χαμένα πράγματα και μετά: «Τί να κάνω, Πάτερ; Χάνω το παιδί μου!».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο μοναχός και τα σύγχρονα μέσα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς πρέπει να χρησιμοποιή ο μοναχός τα σύγχρονα μέσα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να κοιτάξη να έχη πάντα λίγο κατώτερο από αυτό που χρησιμοποιεί ο κόσμος. Εμένα με αναπαύει να χρησιμοποιώ τα ξύλα για ζέστη, για μαγείρευμα και για εργόχειρο. Όταν όμως έτσι που πάνε με το εμπόριο των δασών μας εξαφανίσουν τα ξύλα και θα είναι δυσεύρετα, τότε θα χρησιμοποιήσω το κατώτερο που θα χρησιμοποιή ο κόσμος, σόμπα πετρελαίου ή δεν ξέρω τί άλλο θα είναι φθηνό και ταπεινό για θέρμανση, γκαζιέρα για το εργόχειρο κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς μπορεί να διακρίνει κανείς μέχρι ποιό σημείο είναι κάτι απαραίτητο σ́ ένα Κοινόβιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν σκέφτεται κανείς μοναχικά, μπορεί να το βρή. Αν δεν σκέφτεται μοναχικά, όλα απαραίτητα είναι και μετά γίνεται κοσμικός και χειρότερος από κοσμικός. Σαν μοναχοί θα πρέπη να ζήσουμε τουλάχιστον λίγο κατώτερα απ'' ό,τι στον κόσμο ή τουλάχιστον όπως ζούσαμε στον κόσμο. Όχι να έχω καλύτερα πράγματα από αυτά  που είχα στο σπίτι μου. Το Μοναστήρι κανονικά πρέπει να είναι πιο φτωχό από το σπίτι μου. Αυτό βοηθάει εσωτερικά τον μοναχό και βοηθάει και τον κόσμο. Τα έχει κανονίσει έτσι ο Θεός, να μη βρίσκουν ανάπαυση σ́ αυτά  τα πράγματα οι άνθρωποι. Αν τους λαϊκούς τους βασανίζη αυτή η εξέλιξη η κοσμική, πόσο μάλλον τον μοναχό! Αν βρισκόμουν σ́ ένα πλούσιο σπίτι και μου έλεγε ο νοικοκύρης, «πού θέλεις να σε φιλοξενήσω, για να ευχαριστηθής, στο σαλόνι με τα επίσημα έπιπλα ή σ́ έναν σταύλο που έχω με κάνα-δυό κατσίκες;», ειλικρινά σάς λέω, εκεί στον σταύλο με τα κατσίκια θα ενίωθα μεγαλύτερη ανάπαυση. Γιατί, όταν ξεκίνησα για καλόγερος, δεν έφυγα από τον κόσμο, για να βρώ καλύτερο σπίτι, να βρώ παλάτι. Ξεκίνησα για κάτι χειρότερο από αυτό που είχα. Αλλιώς δεν κάνω τίποτε για τον Χριστό. Αλλά η σημερινή λογική είναι αυτή: «Καλά, θα μου πούν, αν μείνης σε ένα παλάτι, σε τί θα βλάψη την ψυχή σου; Εκεί στον στάυλο θα μυρίζη άσχημα, ενώ στο παλάτι θα έχη και μία ευωδία, θα μπορής να κάνης και καμμιά μετανοια». Πρέπει να υπάρχη αισθητήριο πνευματικό. Βλέπεις, στην πυξίδα έχει και το ένα βέλος μαγνήτη και το άλλο μαγνήτη και γυρίζει. Ο Χριστός έχει μαγνήτη, αλλά πρέπει κι εμείς να πάρουμε λίγο μαγνήτη, για να γυρίζουμε προς τον Χριστό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά τί δυσκολίες υπήρχαν στα Κοινόβια! Θυμάμαι, στην κουζίνα είχαν ένα καζάνι μεγάλο και είχαν την μανέλλα, για να το σηκώνουν. Με τα ξύλα αναβαν φωτιά, για να μαγειρέψουν. Πότε δυνατή φωτιά, πότε σιγανή, κολλούσαν τα φαγητά. Όταν κολλούσαν τα ψάρια, είχαν μία ατσαλόσκουπα, για να τα ξεκολλούν. Άντε να μαζεύουμε μετά την στάχτη από την φωτιά, να την βάζουμε σ́ ένα πιθάρι που είχε μία τρύπα από κάτω, να ρίχνουμε νερό να κατασταλάξη η αλισίβα, για να πλύνουμε τα πιάτα. Τα χέρια γίνονταν χάλια. Και το νερό το ανεβάζαμε με το μαγγάνι στο αρχονταρίκι. Μερικά πράγματα που γίνονται σήμερα στα Μοναστήρια, δεν δικαιολογούνται. Είδα σ́ ένα Μοναστήρι να κόβουν το ψωμί με μηχανή. Δεν ταιριάζει! Να είναι ένας άρρωστος ή φιλάσθενος, που δεν μπορεί να κόψη το ψωμί με το μαχαίρι, και είναι ανάγκη να το κόψη, γιατί δεν υπάρχει άλλος, τότε εκείνος, τέλος πάντων, δικαιολογείται. Αλλά να βλέπης τώρα έναν γεροδεμένο να κόβη το ψωμί με την ρόδα! Αυτός μπορεί να δουλέψη κομπρεσέρ και παίρνει την ρόδα, για να κόψη το ψωμί, και το θεωρεί κατόρθωμα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κοιτάξτε στα πνευματικά να προπορεύεσθε. Μη χαίρεσθε μ' αυτά  τα πράγματα, μηχανές, ευκολίες κ.λπ. Αν φύγη από τον Μοναχισμό το πνεύμα της ασκήσεως, δεν έχει νόημα μετά η μοναχική ζωή. Αν βάζουμε την ευκολία πάνω από την καλογερική, δεν θα κάνουμε προκοπή. Ο μοναχός αποφεύγει τις ευκολίες, γιατί δεν τον βοηθάνε πνευματικά. Στην κοσμική ζωή δυσκολεύονται οι άνθρωποι από τις ευκολίες τις πολλές. Στον μοναχό, ακόμη και αν έβρισκε σ́ αυτά  ανάπαυση, δεν ταιριάζει η ευκολία. Να μη ζητούμε ανέσεις. Την εποχή που έζησε ο Μέγας Αρσένιος δεν υπήρχαν ούτε λούξ ούτε τίποτε άλλο, υπήρχαν επίσημοι φανοί στα ανάκτορα με λάδι πολύ λεπτό. Δεν μπορούσε να φέρη έναν τέτοιο φανό στην έρημο; Αλλά δεν το έκανε. Είχε ένα φιτίλι ή βαμβάκι και λάδι απ' αυτά  τα σπορέλαια, ό,τι είχαν τότε, και αυτό χρησιμοποιούσε[80].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο διακόνημα πολλές φορές δικαιολογούμε τον εαυτό μας να έχουμε μηχανές ή διάφορες άλλες ευκολίες, για να γίνη γρήγορα η δουλειά και να αξιοποιηθή δήθεν ο χρόνος μας στα πνευματικά, και τελικά ζούμε πολυμέριμνη ζωή, με άγχος, σαν κοσμικοί και όχι σαν καλόγεροι. Όταν πήγαν σ́ ένα Μοναστήρι μερικοί νέοι μοναχοί, το πρώτο πράγμα που έκαναν, ήταν να πάρουν ταχυβραστήρες, για να έχουν χρόνο να κάνουν πνευματικά, και μετά κάθονταν με τις ώρες και κουβεντίαζαν. Δεν είναι δηλαδή ότι τις ευκολίες θα τις χρησιμοποιήσουν, για να κερδίσουν χρόνο και να τον αξιοποιήσουν στα πνευματικά. Σήμερα με τις ευκολίες κερδίζουν χρόνο, και χρόνο για προσευχή δεν έχουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, άκουσα να λένε ότι και ο Άγιος Αθανάσιος ο Αθωνίτης ήταν προοδευτικός!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ήταν προοδευτικός! Τέτοιου είδους προοδευτικότητα είχε σαν την σημερινή!... Ας διαβάσουν τον βίο του Αγίου Αθανασίου. Άχ, είχαν φθάσει τους οκτακόσιους, τους χίλιους οι μοναχοί, και πόσος κόσμος πήγαινε για βοήθεια! Πόσοι φτωχοί, νηστικοί πήγαιναν να φάνε ψωμί, να φιλοξενηθούν στην Λαύρα! Για να τα βγάλη πέρα ο Άγιος είχε πάρει δυο βόδια για τον μύλο ας πάρουν και αυτοί σήμερα βόδια! Αναγκάσθηκε να κάνη φούρνο, σύγχρονο για την εποχή του, για να δίνη ψωμί στους ανθρώπους. Οι βυζαντινοί αυτοκράτορες τα Μοναστήρια τα είχαν προικίσει με περιουσίες, γιατί ήταν σαν Φιλανθρωπικά Ιδρύματα. Τα Μοναστήρια τα εφτίαχναν, για να βοηθιέται πνευματικά και υλικά ο κόσμος. Γι' αυτό έδιναν δωρεές οι αυτοκράτορες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να καταλάβουμε ότι όλα θα χαθούν και θα παρουσιασθούμε μπροστά στον Θεό χρεωμένοι, εμείς κανονικά οι μοναχοί έπρεπε να έχουμε όχι αυτά  που πετάνε οι σημερινοί άνθρωποι, αλλά εκείνα τα άχρηστα που πετούσαν την παλιά εποχή οι πλούσιοι στους λάκκους. Δύο πράγματα να θυμάστε, πρώτα ότι θα πεθάνουμε, ύστερα ότι ίσως πεθάνουμε όχι με φυσιολογικό θάνατο, και πρέπει να είστε έτοιμες να πεθάνετε με αφύσικο θάνατο. Αν θυμάστε αυτά  τα δύο, όλα θα πάνε καλά και από πνευματική πλευρά και από κάθε άλλη πλευρά. Όλα μετά βρίσκουν τον δρόμο τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η στέρηση πολύ βοηθάει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί σήμερα ο κόσμος ταλαιπωρείται τόσο πολύ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί αποφεύγει τον κόπο. Αυτή η άνεση είναι που τον αρρωσταίνει και τον ταλαιπωρεί. Οι ευκολίες στην εποχή μας έχουν αποβλακώσει τον κόσμο. Αυτή η μαλθακότητα σήμερα έχει φέρει και τις πολλές αρρώστιες. Παλιά τί τραβούσαν για να αλωνίσουν! Τί κόπος, αλλά και τί γλυκό ήταν το ψωμί! Που να έβλεπες ψωμί πεταμένο! Αν εύρισκες κανένα κομματάκι, το μάζευες και το ασπαζόσουν. Όσοι πέρασαν Κατοχή βλέπουν ένα κομμάτι ψωμί και το βάζουν στην άκρη, ενώ οι άλλοι το πετούν, δεν καταλαβαίνουν την αξία του. Πετάνε κομμάτια ψωμί στα σκουπίδια, δεν το εκτιμούν. Ούτε ένα «δόξα σοί ο Θεός» δεν λένε οι περισσότεροι για τις ευλογίες που δίνει ο Θεός. Σήμερα όλα γίνονται με άνεση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η στέρηση πολύ βοηθάει. Όταν στερούνται κάτι οι άνθρωποι, τότε μπορούν να αναγνωρίσουν την αξία του. Όσοι στερούνται με επίγνωση, με διάκριση, με ταπείνωση, για την αγάπη του Χριστού, αισθάνονται την πνευματική χαρά. Αν π.χ. κάποιος πή, «δέν θα πιώ νερό σήμερα, γιατί ο τάδε είναι άρρωστος, Θεέ μου, δεν μπορώ να κάνω τίποτε περισσότερο» και το κάνη, ο Θεός θα τον ποτίση όχι με νερό αλλά με λεμονάδα πνευματική, με θεϊκή παρηγοριά. Οι ταλαιπωρημένοι, μία παραμικρή βοήθεια να τους προσφέρη κανείς, έχουν πολλή ευγνωμοσύνη. Ένα αρχοντόπουλο καλομαθημένο, όλα τα χατήρια να του κάνουν οι γονείς του, τίποτε δεν το ευχαριστεί. Μπορεί να τα έχη όλα και βασανισμένο να είναι. Τα κάνει όλα γυαλιά-καρφιά. Ενώ μερικά παιδάκια, τα καημένα, για την παραμικρή βοήθεια αισθάνονται μεγάλη ευγνωμοσύνη. Αν ένας φίλος βρεθή να τους βάλη τα ναύλα για το Άγιον Όρος, πόσο ευγνωμονούν και αυτόν και τον Χριστό! Ακούς πολλά πλουσιόπαιδα να λένε: «Τάχουμε όλα, γιατί να τάχουμε όλα;». Γκρινιάζουν, γιατί καλοπερνούν, αντί να ευγνωμονούν τον Θεό και να βοηθούν και κανέναν φτωχό! Αυτή είναι η μεγαλύτερη αχαριστία! Νιώθουν κενό, γιατί δεν τους λείπει τίποτε από τα υλικά. Τα βάζουν και με τους γονείς, γιατί τους τα έχουν όλα έτοιμα, και φεύγουν από το σπίτι και γυρίζουν με ένα γυλιό στην πλάτη. Και οι γονείς να τα δίνουν χρήματα, να τους πάρουν τηλέφωνο, για να μην ανησυχούν, και εκείνα να αδιαφορούν. Και τελικά καταλήγουν οι γονείς να τα ψάχνουν. Ένα παλληκάρι τα είχε όλα, αλλά δεν ήταν ευχαριστημένο με τίποτε. Έφυγε κρυφά από το σπίτι και κοιμόταν μέσα στα τραίνα, για να ταλαιπωρηθή. Και ήταν και από καλή οικογένεια! Ενώ, αν είχε μία δουλειά και ζούσε με τον ιδρώτα του, θα είχε νόημα ο κόπος του και θα ήταν αναπαυμένο και θα δοξολογούσε τον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα οι πιο πολλοί δεν στερούνται, γι' αυτό δεν έχουν φιλότιμο. Αν δεν κοπιάζη κανείς, δεν μπορεί να εκτιμήση και τον κόπο των άλλων. Τί νόημα έχει λ.χ. να ζητάς επάγγελμα άνετο, να βγάζης χρήματα και μετά να ζητάς ταλαιπωρία; Οι Σουηδοί, που παίρνουν για όλα επίδομα από το κράτος και δεν κοπιάζουν, γυρίζουν στους δρόμους. Κοπιάζουν για τον αέρα, νιώθουν άγχος, γιατί έχουν εκτροχιασθή πνευματικά, όπως οι ρόδες πού, όταν βγουν από τον άξονα, τρέχουν στον δρόμο χωρίς σκοπό και καταλήγουν στον γκρεμό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι πολλές ευκολίες αχρηστεύουν τον άνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο κόσμος κοιτάζει την ομορφιά σήμερα και έτσι ξεγελιέται, με την ομορφιά. Τους Ευρωπαίους[81]τους βοηθάει αυτό, συνέχεια με τα κατσαβίδια φτιάχνουν όμορφα, καινούργια πράγματα, δήθεν πιο πρακτικά, για να μην κουνούν τα χέρια τους οι άνθρωποι. Παλιά με τα μέσα που χρησιμοποιούσαν στην εργασία τους οι άνθρωποι, δυνάμωναν. Τώρα με τα μέσα που χρησιμοποιούν, χρειάζεται να κάνουν μετά φυσιοθεραπεία, μασάζ. Οι γιατροί εξασκούνται στο μασάζ τώρα! Βλέπεις σήμερα μαραγκούς με κάτι κοιλιές! Που να εύρισκες παλιά μαραγκό με κοιλιά! Γιατί με την πλάνη που πήγαινε πέρα-δώθε κοιλιές θα έμεναν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι πολλές ευκολίες, όταν ξεπερνούν τα όρια, τον αχρηστεύουν τον άνθρωπο και τεμπελιάζει. Ενώ μπορεί να γυρίση κάτι με το χέρι, σού λέει: «Όχι, καλύτερα να πατήσω ένα κουμπί και να γυρίση μόνο τού»! Όταν συνηθίζη κανείς με το εύκολο, θέλει όλο εύκολα μετά. Σήμερα οι άνθρωποι θέλουν να δουλεύουν λίγο και να πληρώνονται πολύ. Αν γίνεται να μη δουλεύουν και καθόλου, ακόμη καλύτερα! Αυτό το πνεύμα έχει προχωρήσει και στην πνευματική ζωή, θέλουμε να αγιάσουμε δίχως κόπο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και οι περισσότεροι που είναι ευαίσθητοι στην υγεία είναι από την καλοπέραση. Αν γίνη ένας πόλεμος, έτσι όπως είναι καλομαθημένοι οι άνθρωποι, πώς θα αντέξουν; παλιά τουλάχιστον ήταν και σκληραγωγημένος ο κόσμος, ακόμη και τα παιδιά, και άντεξαν. Τώρα θέλουν βιταμίνες B, C, D καί... μερσεντές, για να ζήσουν! Βλέπεις, και ένα ατροφικό παιδί, αν εργασθή, δυναμώνουν τα μπράτσα του. Πολλοί γονείς έρχονται και μου λένε: «Είναι παράλυτο το παιδί μού», ενώ στην πραγματικότητα έχει μία ευαισθησία στα πόδια. Εκείνοι το ταΐζουν, αυτό κάθεται, το ταΐζουν, κάθεται. Όσο κάθεται, τόσο τα πόδια γίνονται πιο ατροφικά και μετά καταλήγει στο καροτσάκι: «Κάνε προσευχή, μου λένε, το παιδί μου είναι παραλυτο». Τώρα ποιός είναι παράλυτος, το παιδί ή οι γονείς; Τους λέω να τα δίνουν τροφές που δεν παχαίνουν, να τα βάζουν να περπατούν λίγο. Μετά πέφτει το βάρος και κινούνται σιγά-σιγά  πιο φυσιολογικά, μέχρι που παίζουν και ποδόσφαιρο! Ο Θεός θα βοηθήση τα πραγματικά παράλυτα παιδιά, που δεν βοηθιούνται ανθρωπίνως. Ένα παιδάκι στην Κόνιτσα, πολύ ανάποδο, είχε καή από βόμβα. Το ποδαράκι του είχε μαζευτή και δεν μπορούσε να το τεντώση. Επειδή όμως δεν ησύχαζε και από την ζωηράδα του το κουνούσε συνέχεια, τέντωσαν τα νεύρα και έγινε καλά. Πήγε και αντάρτης στον Ζέρβα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και εγώ, όταν πιάστηκε το πόδι μου από ισχιαλγία, έκανα τα κομποσχοίνια περπατώντας και δυνάμωσε. Η κίνηση πολλές φορές βοηθάει. Αν αρρωστήσω δυό-τρείς μέρες και δεν μπορώ να κινηθώ, λέω: «Βοήθησε μέ, Θεέ μου, λίγο μόνο να σηκωθώ, να κινηθώ, και ύστερα θα τα βολέψω... Θα πάω να κόψω ξύλα». Γιατί, αν παραμείνω ξαπλωμένος, θα γίνω χειρότερα. Γι'' αυτό, μόλις βρώ λίγο κουράγιο, και να είναι ακόμη κρυωμένος, ζορίζομαι και σηκώνομαι να κόψω κανένα ξύλο. Ντύνομαι γερά, ιδρώνω, και φεύγει το κρύωμα. Ξέρω, φυσικά, ότι με την ξάπλα είναι πιο αναπαυτικά, αλλά ζορίζω τον εαυτό μου και σηκώνομαι, και φεύγουν όλα. Νά, βλέπω, όταν έχω κόσμο και κάθωμαι στο κούτσουρο, πιάνομαι. Μπορώ να πάρω ένα στρωσιδάκι και να βάλω – αλλά που να βρείς μετά για όλους. Γι'' αυτό ύστερ κάνω μία ώρα κομποσχοίνι την νύχτα περπατώντας. Και επειδή έχω πρόβλημα κάτω στα πόδια που κατεβαίνει το αίμα, μετά τεντώνω και λίγο τα πόδια μου. Αν αφήσω τον εαυτό μου έτσι, πρέπει να με υπηρετούν. Ενώ τώρα υπηρετώ τον κόσμο. Καταλάβατε; Γι'' αυτό ο άνθρωπος να μην χαίρεται το ξάπλωμα, γιατί δεν βοηθάει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η άνεση πάντοτε βλάπτει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, εκεί κοντά στο Καλύβι μου είναι ένας Κύπριος μοναχός, ο Γερό-Ιωσήφ από την Καρπασία. Είναι εκατόν έξι χρονών[82]και εξυπηρετείται ακόμη μόνος του. Που στον κόσμο σήμερα! Μερικοί συνταξιούχοι δεν μπορούν να περπατήσουν. Αδυνατίζουν τα πόδια τους, παχαίνουν κιόλας από το καθισιό και αχρηστεύονται. Ενώ, αν έκαναν κάτι, πολύ θα βοηθιόνταν. Τον Γερό-Ιωσήφ τον πήραν στην Μονή Βατοπεδίου. Τον έπλυναν, τον έλουσαν, τον περιποιήθηκαν, αλλά εκείνος τους είπε: «Μόλις ήρθα εδώ, αρρώστησα. Εσείς μ'' αρρωστήσατε. Να με πάτε στο Καλύβι μου να πεθάνω». Αναγκάσθηκαν και τον πήγαν πίσω. Πήγα μία μέρα να τον δώ. «Τι γίνεται; του λέω. Έμαθα πήγες στο Μοναστήρι». «Ναί, πήγα, μου λέει. Με πήραν με το αυτοκίνητο, με πήγαν κάτω, μ'' έλουσαν, με καθάρισαν, με περιποιήθηκαν, αλλά εγώ αρρώστησα. «Να με πάτε πίσω», τους είπα. Μόλις έφθασα εδώ, έγινα καλά!». Δεν βλέπει και πλέκει κομποσχοίνια. Μία φορά που του έστειλα λίγο φιδέ, είπε: «Τί, για χτικιάρικο με πέρασε ο Γερό-Παΐσιος και μου στέλνει φιδέ;». Τρώει φασόλια, ρεβίθια, κουκιά. Έχει τέτοια υγεία! Παλληκάρι είναι! Με δύο μπαστούνια περπατάει και πηγαίνει και μαζεύει χόρτα με δυο μπαστούνια. Σπέρνει κοκκάρι, κουβαλάει νερό να πλύνη τα ρούχα του, το κεφάλι του. Να διαβάση μετά την Ακολουθία του, τα Ψαλτήρια, να κάνη τον κανόνα του, την ευχή. Να δήτε, πήρε μάστορες να του φτιάξουν την σκεπή και πήγε με τα δυο μπαστούνια να ανεβή στην σκάλα να δη τί κάνουν. «Κατέβα κάτω!», του λένε. «Όχι, θ́ ανέβω, τους λέει, να δώ πώς τα φτιάχνετε»! Πολύ ταλαιπωρείται. Ξέρετε όμως τί χαρά νιώθει! Φτερουγίζει η καρδιά του! Τα ρούχα του οι Πατέρες τα παίρνουν κρυφά να τα πλύνουν. Τον ρώτησα μία φορά: «Έ, τί κάνεις με τα ρούχα;». «Μου τα παίρνουν, μου λέει, πολλές φορές, έτσι κρυφά μου τα παίρνουν. Τα πλένω και ''γω, βάζω εκεί αυτά  τα «κλίνια»[83], τα αφήνω λίγες μέρες στην σκάφη και καθαρίζουν»! Βλέπεις μία εμπιστοσύνη στον Θεό, και οι άλλοι να τα έχουν όλα και να έχουν και την φοβία κ.λπ. Με την περιποίηση αυτός αρρώστησε, με την εγκατάλειψη έγινε καλά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η καλοπέραση δεν βοηθάει. Η άνεση δεν είναι για τον μοναχό. Είναι ατιμία στην έρημο. Μπορεί να είσαι καλομαθημένος, όμως πρέπει να σκληραγωγηθής, αν είσαι υγιής, διαφορετικά δεν είσαι μοναχός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Απλοποιήστε την ζωή σας, για να φύγη το άγχος
- type: h2
  initial:
    ru: ''
  text:
    ru: Από την κοσμική ευτυχία βγαίνει το κοσμικό άγχος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο απομακρύνονται οι άνθρωποι από την φυσική ζωή, την απλή, και προχωρούν στην πολυτέλεια, τόσο αυξάνει και το ανθρώπινο άγχος. Και όσο απομακρύνονται από τον Θεό, επόμενο είναι να μη βρίσκουν πουθενά ανάπαυση. Γι' αυτό γυρίζουν ανήσυχοι ακόμη και γύρω από το φεγγάρι –σάν το λουρί της μηχανής γύρω από την τρελλή ρόδα[84]–, γιατί ολόκληρος ο πλανήτης μας δεν χωράει την πολλή τους ανησυχία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Από την κοσμική καλοπέραση, από την κοσμική ευτυχία, βγαίνει το κοσμικό άγχος. Η εξωτερική μόρφωση με το άγχος οδηγεί καθημερινώς εκατοντάδες ανθρώπων (ακόμη και μικρά παιδιά με άγχος) στις ψυχαναλύσεις και στους ψυχιάτρους και κτίζει συνεχώς Ψυχιατρεία και μετεκπαιδεύει ψυχιάτρους, ενώ πολλοί ψυχίατροι ούτε Θεό πιστεύουν ούτε ψυχή παραδέχονται. Επομένως, πώς είναι δυνατόν αυτοί οι άνθρωποι να βοηθήσουν ψυχές, αφού και οι ίδιοι είναι γεμάτοι από άγχος; Πώς είναι δυνατόν ο άνθρωπος να παρηγορηθή αληθινά, αν δεν πιστέψη στον Θεό και στην αληθινή ζωή, την μετά θάνατον, την αιώνια; Όταν συλλάβη ο άνθρωπος το βαθύτερο νόημα της ζωής της αληθινής, τότε φεύγει όλο το άγχος του και έρχεται η θεία παρηγοριά, και θεραπεύεται. Αν πήγαινε κανείς στο Ψυχιατρείο και διάβαζε στους ασθενείς τον Αββά Ισαάκ, θα γίνονταν καλά όσοι πιστεύουν στον Θεό, γιατί θα γνώριζαν το βαθύτερο νόημα της ζωής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάνε να ηρεμήσουν οι άνθρωποι είτε με ηρεμιστικά είτε με θεωρίες γιόγκα, και την πραγματική ηρεμία, που έρχεται, όταν ταπεινωθή ο άνθρωπος, δεν την επιδιώκουν, για να έρθη η θεία παρηγοριά μέσα τους. Και οι διάφοροι τουρίστες, που έρχονται από ξένες χώρες και περπατούν στους δρόμους, μέσα στον ήλιο, στην ζέστη, μέσα στην σκόνη, μέσα σε τόση φασαρία, σκέψου πόσο υποφέρουν! Τί ζόρισμα, τί σφίξιμο εσωτερικό έχουν, ώστε το σκάσιμο αυτό το εξωτερικό το θεωρούν ανάσα! Πόσο τους διώχνει ο εαυτός τους, που θεωρούν ανάπαυση όλη αυτήν την ταλαιπωρία!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν δούμε άνθρωπο με μεγάλο άγχος, στενοχώρια και λύπη, ενώ τα έχει όλα – τίποτε δεν του λείπει –, πρέπει να γνωρίζουμε ότι του λείπει ο Θεός. Τελικά, οι άνθρωποι βασανίζονται και από τον πλούτο, γιατί τα υλικά αγαθά δεν τους γεμίζουν, είναι διπλό βάσανο. Ξέρω ανθρώπους πλούσιους, που τα έχουν όλα, δεν έχουν και παιδιά και βασανίζονται. Βαριούνται που κοιμούνται, βαριούνται να περπατήσουν, βασανίζονται από όλα. «Εντάξει, αφού έχεις ελεύθερο χρόνο, λέω σε κάποιον, Κάνε πνευματικά. Διάβασε μία Ώρα, διάβασε λίγο από το Ευαγγέλιο». «Δεν μπορώ», λέει. «Κάνε ένα καλό, πήγαινε σε κανένα νοσοκομείο και δές κανέναν άρρωστο». «Που να πάω ως εκεί, σού λέει, και τί θα βγή;». «Πήγαινε να βοηθήσης κανέναν φτωχό στην γειτονιά σου». «Όχι, δεν μ' ευχαριστεί, λέει, ούτε αυτό». Να έχη ελεύθερο χρόνο, να έχη ένα σωρό σπίτια, να έχη όλα τα καλά, και να βασανίζεται! Ξέρετε πόσοι τέτοιοι άνθρωποι υπάρχουν; Και βασανίζονται, μέχρι να τους στρίψη το μυαλό. Φοβερό! Και αν τυχόν δεν δουλεύουν, αλλά μόνον από τις περιουσίες έχουν εισοδήματα, είναι οι πιο βασανισμένοι άνθρωποι. Ενώ, αν έχουν τουλάχιστον μία δουλειά, είναι καλύτερα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η σημερινή ζωή με το συνεχές κυνηγητό είναι κόλαση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι συνέχεια βιάζονται, τρέχουν. Αυτήν την ώρα πρέπει να βρίσκωνται εδώ, την άλλη εκεί, την άλλη πιο πέρα, αφού, για να μην ξεχνούν τί έχουν να κάνουν, χρειάζεται να τα γράφουν. Μέσα σε τόσο τρέξιμο πάλι καλά που θυμούνται τα ονόματά τους!... Ούτε τον εαυτό τους γνωρίζουν. Αλλά πώς να τον γνωρίσουν; Γίνεται να καθρεφτισθής σε θολά νερά; Ο Θεός να με συγχωρέση, αλλά ο κόσμος κατήντησε σωστό τρελλοκομείο. Δεν σκέφτονται οι άνθρωποι την άλλη ζωή, μόνο ζητάνε όλο και περισσότερα υλικά αγαθά. Γι' αυτό και δεν βρίσκουν ησυχία και τρέχουν συνέχεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ευτυχώς που υπάρχει η άλλη ζωή. Αν οι άνθρωποι ζούσαν αιώνια σ́ αυτήν την ζωή, μεγαλύτερη κόλαση δεν θα υπήρχε, έτσι όπως έχουν κάνει την ζωή τους. Με αυτό το άγχος, αν ζούσαν οκτακόσια, εννιακόσια χρόνια, όπως στην εποχή του Νώε, θα ζούσαν μία μεγάλη κόλαση. Τότε ζούσαν απλά και ζούσαν και πολλά χρόνια, για να διατηρήται η Παράδοση. Τώρα γίνεται αυτό που λέει ο Ψαλμός: «Αι ημέραι των ετών ημών εν αυτοίς εβδομήκοντα έτη, εάν δε εν δυναστείαις, ογδοήκοντα έτη, και το λείον αυτών κόπος και πόνος»[85]. Εβδομήντα χρόνια είναι ίσα-ίσα για να τακτοποιήσουν τα παιδιά τους οι άνθρωποι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μία μέρα πέρασε από το Καλύβι ένας γιατρός που ζη στην Αμερική και μου έλεγε για την ζωή εκεί πέρα. Οι άνθρωποι εκεί κατήντησαν μηχανές, όλη μέρα δουλεύουν. Κάθε μέλος της οικογενείας πρέπει να έχη δικό του αυτοκίνητο. Ύστερα στο σπίτι, για να κινήται ο καθένας άνετα, πρέπει να έχουν τέσσερις τηλεοράσεις. Και δώσ́ του και δουλεύουν και κουράζονται, για να βγάλουν πολλά χρήματα, για να πούν πώς είναι τακτοποιημένοι και ευτυχισμένοι. Αλλά τί σχέση έχουν όλα αυτά  με την ευτυχία; Τέτοια ζωή γεμάτη άγχος και με ένα συνεχές κυνηγητό δεν είναι ευτυχία, είναι κόλαση. Τί να την κάνης την ζωή με τέτοιο άγχος; Αν έπρεπε όλος ο κόσμος να ζη την ζωή αυτή, δεν θα την ήθελα. Αν ο Θεός έλεγε σ́ αυτούς τους ανθρώπους: «Δεν σάς τιμωρώ για την ζωή που ζήτε, αλλά θα σάς αφήσω αιώνια να ζήτε έτσι», αυτό για μένα θα ήταν μία μεγάλη κόλαση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γι'' αυτό και πολλοί άνθρωποι δεν αντέχουν να ζουν μέσα σε τέτοιες συνθήκες και βγαίνουν έξω στην ύπαιθρο χωρίς κατεύθυνση και σκοπό. Σχηματίζουν ομάδες, έξω στην φύση, άλλοι με πρόγραμμα την γυμναστική, άλλοι με κάτι άλλο. Μου είπαν για μερικούς που βγαίνουν στην ύπαιθρο και τρέχουν ή φεύγουν στα βουνά και ανεβαίνουν σε ύψος 6.000 μ. Κρατούν την αναπνοή τους και έπειτα την αφήνουν και πάλι εισπνέουν βαθιά... Χαμένα πράγματα. Αυτό δείχνει πώς η καρδιά τους είναι πλακωμένη από το άγχος και ζητάει διέξοδο. Σε έναν τέτοιον είπα: «Εσείς σκάβετε λάκκο, τον κάνετε μεγάλο, θαυμάζετε για τον λάκκο που ανοίξατε και για το βάθος του καί... πέφτετε μέσα και πάτε κάτω. Ενώ εμείς σκάβουμε λάκκο και βρίσκουμε μέταλλα. Έχει νόημα η άσκησή μας, γιατί γίνεται για κάτι ανώτερο».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το άγχος είναι του διαβόλου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, λαϊκοί που ζουν πνευματικά, όταν γυρίζουν το βράδυ από την δουλειά κουρασμένοι, δυσκολεύονται να κάνουν το Απόδειπνο και στενοχωρούνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν επιστρέφουν αργά το βράδυ από την δουλειά και είναι κουρασμένοι, ποτέ να μην στριμώχνουν με άγχος τον εαυτό τους, αλλά πάντα με φιλότιμο να λένε στον εαυτό τους: «Εάν δεν μπορής να διαβάσης ολόκληρο το Απόδειπνο, διάβασε το μισό ή το ένα τρίτο» και να προσπαθούν άλλη φορά να μην κουράζωνται πολύ την ημέρα. Να αγωνίζωνται, όσο μπορούν, με φιλότιμο και να τα εμπιστεύωνται όλα στον Θεό, και ο Θεός θα ενεργήση. Ο νούς πάντα να βρίσκεται κοντά στον Θεό. Αυτή είναι η καλύτερη μελέτη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μία υπέρμετρη άσκηση, Γέροντα, πώς είναι μπροστά στα μάτια του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν γίνεται από φιλότιμο, χαίρεται και ο άνθρωπος, χαίρεται και ο Θεός για το φιλότιμο παιδί Του. Αν σφίγγεται από αγάπη, στάζει μέλι στην καρδιά του. Ενώ, αν σφίγγεται από εγωισμό, βασανίζεται. Κάποιος που αγωνιζόταν εγωιστικά και σφιγγόταν με άγχος, είπε: «Ω Χριστέ μου, πολύ στενή την έκανες την πύλη! Δεν χωράω!». Ενώ, αν αγωνιζόταν ταπεινά, θα χωρούσε. Όσοι αγωνίζονται εγωιστικά με νηστείες, αγρυπνίες κ.λπ., ταλαιπωρούνται χωρίς πνευματική ωφέλεια, γιατί δέρουν αέρα και όχι δαίμονες. Αντί να διώξουν πειρασμούς, δέχονται περισσότερους, και επόμενο είναι να συναντούν πολλή δυσκολία στον αγώνα τους, να νιώθουν πνίξιμο από άγχος. Ενώ εκείνοι που αγωνίζονται πολύ με πολλή ταπείνωση και με πολλή ελπίδα στον Θεό, η καρδιά τους χαίρεται και η ψυχή τους φτερουγίζει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην πνευματική ζωή θέλει προσοχή. Όταν οι πνευματικοί άνθρωποι κινούνται από κενοδοξία, μένουν με ένα κενό στην ψυχή τους. Δεν υπάρχει το πλήρωμα, το φτερούγισμα της καρδιάς καί, όσο μεγαλώνουν την κενοδοξία τους, μεγαλώνει και το κενό μέσα τους και περισσότερο υποφέρουν. Όπου άγχος και απελπισία, εκεί ταγκαλίστικη πνευματική ζωή. Για τίποτε να μην έχετε άγχος. Το άγχος είναι του διαβόλου. Όταν βλέπετε άγχος, να ξέρετε ότι εκεί έχει βάλει την ουρά του το ταγκαλάκι. Ο διάβολος δεν πηγαίνει κόντρα. Αν υπάρχη μία τάση, σπρώχνει και αυτός, για να ταλαιπωρήση και να πλανήση τον άνθρωπο. Τον ευαίσθητο λ.χ. τον κάνει υπερευαίσθητο. Όταν έχης διάθεση να κάνης μετάνοιες, σπρώχνει και ο διάβολος να κάνης περισσότερες από την αντοχή σου καί, αν οι δυνάμεις σου είναι περιορισμένες, δημιουργείται μία νευρικότητα, γιατί δεν τα βγάζεις πέρα, και στην συνέχειά σου δημιουργεί άγχος με ελαφρά απελπισία κατ'' αρχάς και μετά συνεχίζει... Θυμάμαι, όταν ήμουν αρχάριος μοναχός, ένα διάστημα, μόλις έπεφτα να κοιμηθώ, μου έλεγε ο πειρασμός: «Κοιμάσαι; Σήκω! Τόσοι άνθρωποι υποφέρουν, τόσοι έχουν ανάγκη...». Σηκωνόμουν και έκανα μετάνοιες, ό,τι μπορούσα. Μόλις έπεφτα να κοιμηθώ, άρχιζε ξανά: «Οι άλλοι υποφέρουν κι εσύ κοιμάσαι; Σήκω!». Σηκωνόμουν πάλι. Μέχρι που έφθασα να πώ: «Άχ, να μου κόβονταν τα πόδια, τί καλά! Θα ήμουν τότε δικαιολογημένος, αφού δεν θα μπορούσα να κάνω μετανοιες». Μία Μεγάλη Σαρακοστή την έβγαλα με το ζόρι, γιατί πήγαινα να στριμώξω τον εαυτό μου περισσότερο από την αντοχή μου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν νιώθουμε στον αγώνα μας άγχος, να ξέρουμε ότι δεν κινούμαστε στον χώρο του Θεού. Ο Θεός δεν είναι τύραννος να μας πνίγη. Καθένας να αγωνίζεται με φιλότιμο, ανάλογα με τις δυνάμεις του, και να καλλιεργή το φιλότιμο, για να αναπτυχθή η αγάπη προς τον Θεό. Τότε θα πιέζεται από το φιλότιμο, και ο αγώνας του, δηλαδή οι πολλές μετάνοιες, οι πολλές νηστείες κ.λπ., δεν θα είναι τίποτε άλλο παρά τα ξεσπάσματα της αγάπης του, και θα προχωρή με πνευματική λεβεντιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν πρέπει, δηλαδή, να αγωνίζεται κανείς με αρρωστημένη σχολαστικότητα και να πνίγεται μετά από άγχος, παλεύοντας με τους λογισμούς, αλλά να απλοποιήση τον αγώνα του και να ελπίζη στον Χριστό και όχι στον εαυτό του. Ο Χριστός όλο αγάπη, καλωσύνη και παρηγοριά είναι και ποτέ δεν πνίγει, αλλά έχει άφθονο πνευματικό οξυγόνο, θεία παρηγοριά. Άλλο είναι εργασία πνευματική λεπτή, και άλλο είναι αρρωστημένη σχολαστικότητα, η οποία πνίγει με το εσωτερικό άγχος, από το εξωτερικό αδιάκριτο ζόρισμα, που σπάει και το κεφάλι με πονοκέφαλο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένας που από την φύση του σκέφτεται πολύ και ζορίζεται το κεφάλι του, πώς πρέπει να αντιμετωπίση τα πράγματα, για να μην κουράζεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν κινήται κανείς απλά, δεν κουράζεται. Όταν όμως μπή έστω και λίγο ο εγωισμός, σφίγγεται, για να μην κάνη κανένα λάθος, και κουράζεται. Δεν πειράζει, ας κάνη και κανένα λάθος και ας τον μαλώσουν και λίγο. Αυτό που λές, μπορεί να δικαιολογηθή λ.χ. σε έναν δικαστικό, που συνέχεια έχει να αντιμετωπίση δύσκολες υποθέσεις και φοβάται μήπως κρίνη άδικα και γίνη αυτός αιτία να τιμωρηθούν αθώες ψυχές. Πονοκέφαλος στην πνευματική ζωή παρουσιάζεται, όταν κανείς φέρνη ευθύνη και βρίσκεται σε αδιέξοδο, γιατί πρέπει να πάρη μία απόφαση, η οποία θα είναι εις βάρος κάποιων καί, αν δεν την πάρη, αδικούνται άλλοι. Όταν δηλαδή στριμώχνεται συνέχεια η συνείδηση. Εσύ, αδελφή, να προσέξης να μην κάνης πνευματική δουλειά με το μυαλό αλλά με την καρδιά. Και να μην κάνης και δουλειά, χωρίς να εμπιστεύεσαι στον θεό ταπεινά, γιατί αλλιώς θα αγωνιάς, θα κουράζης και το μυαλό και θα νιώθης άσχημα ψυχικά. Μέσα στην αγωνία συνήθως είναι κρυμμένη η απιστία. Αλλά και από υπερηφάνεια μπορεί να έχη κανείς αγωνία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η λιτότητα βοηθάει πολύ στην καλογερική
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είδες το σαλονάκι σάς πόσο ομόρφυνε με τις γκρί κουβέρτες; ήρθε λίγο σε λογαριασμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα καταλάβη ένας μοναχός αν κάτι ταιριάζη ή δεν ταιριάζη στο Μοναστήρι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να ξεκινάη από ''κει, να σκέφτεται: «Τί είμαι και τί υποχρεώσεις έχω στην ζωή που ζώ;». Τον στρατό τον τιμάει το χακί. Το Μοναστήρι το τιμάει το μαύρο. Αν βάλουν στον στρατό μαύρα και στο Μοναστήρι χακί, δεν ταιριάζει. Άντε τώρα εσείς να βάλετε άσπρο νοσοκομειακό σαν τις αδελφές νοσοκόμες – αδελφές δεν λέγεσθε και εσείς; – και εκείνες μαύρα, για να φέρουν σε απελπισία τους αρρώστους και να πούν οι άρρωστοι: «Θα πεθάνουμε, φαίνεται, και δεν μας το λένε καθαρά»!... Δεν ταιριάζει, πώς να το κάνουμε! Κάτι μπορεί να είναι όμορφο, αλλά στον Μοναχισμό δεν ταιριάζει. Και το βελούδο είναι όμορφο, αλλά, αν φορέσω ένα ράσο βελούδινο, αυτό δεν με τιμά, αλλά με βρίζει. Μη χρησιμοποιήτε κόκκινα, χρωματιστά! Δεν κάνει!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, να είναι άχρωμα, άγευστα...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε θα έρθη η γεύση. Πρέπει όμως να το καταλάβη κανείς αυτό. Αυτήν την χαρά της απλότητος οι άνθρωποι δεν την έχουν καταλάβει ακόμη. Νά, εγώ στο Καλύβι βρέχω την σκούπα και παίρνω τις αράχνες από τις κάπνες –καί αυτό μία φορά τον χρόνο το κάνω – και έτσι όπως είναι βρεγμένη η σκούπα, κάνει κάτι όμορφα σχέδια, νερά μαύρα-άσπρα πάνω στο ταβάνι! Αν τα δη κανείς, θα νομίζη ότι το έχω βάψει! Ξέρετε πόσο το χαίρομαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γνωρίζω μοναχούς που δεν χαρήκανε από το πνευματικό πνεύμα αλλά από το κοσμικό. Δεν νιώσανε αυτό το σκίρτημα, την χαρά της απλότητος. Στην πνευματική ζωή βοηθάει πάρα πολύ η λιτότητα. Ο μοναχός πρέπει να έχη αυτά  που του χρειάζονται και αυτά  που του ταιριάζουν. Ας περιορισθή μέχρι αυτό που τον διευκολύνει λίγο, να μην πάη στο κοσμικό. Μία στρατιωτική λ.χ. κουβέρτα εξυπηρετεί την ανάγκη, δεν χρειάζεται να είναι μία κουβέρτα δαντελωτή ή χρωματιστή. Έτσι έρχεται η απλότητα, η πνευματική λεβεντιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δώσε πράγματα στον μοναχό, τον κατέστρεψες. Ενώ, όταν αδειάζη από τα πράγματα κανείς, αυτό ξεκουράζει. Και αν ο μοναχός μαζεύη πράγματα, καταστρέφει μόνος του τον εαυτό του. Εγώ, όταν μου στέλνουν πράγματα, νιώθω βάρος και θέλω να ξελαφρώσω, Ή, όταν έχω κάτι περίσσιο στο Κελλί μου, αισθάνομαι σαν να φορώ μία σφιχτή φανέλλα. Αν δεν βρώ που να τα δώσω, καλύτερα να τα πετάξω. Ενώ, μόλις τα δώσω, νιώθω μία ανακούφιση, μία ελευθερία. Ήρθε μία φορά κάποιος γνωστός και μου λέει: «Γέροντα, ο τάδέ μου έδωσε αυτά  τα πράγματα να σάς τα φέρω και ζήτησε να ευχηθήτε να του φύγη το άγχος». «Να φύγη από εκείνον και να έρθη σ́ εμένα; Παρ'' τα και φύγε, του λέω. Εγώ τώρα γέρασα, δεν μπορώ να πηγαίνω να μοιράζω[86]πράγματα».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλες οι ευκολίες που έχουν οι άνθρωποι σκλαβώνουν τον μοναχό αντί να τον βοηθήσουν. Ο μοναχός πρέπει να προσπαθή να ελαττώνη τις ανάγκες του και να απλοποιή την ζωή του, αλλιώς δεν ελευθερώνεται. Άλλο καθαριότητα, άλλο λούσο. Πολύ βοηθάει, για να μπορέση να ελαττώση τις απαιτήσεις του, να κάνη πολλές δουλειές με ένα πράγμα. Στο Σινά είχα ένα κονσερβοκούτι και εκεί εφτίαχνα και το τσάι, εκεί και τον χυλό. Τί νομίζετε πώς χρειάζεται ο άνθρωπος για να ζήση; Παλιά στην έρημο έτρωγαν μόνο χουρμάδες. Ούτε φωτιά αναβαν ούτε ξύλα χρειάζονταν. Εγώ τώρα πήρα ένα κονσερβοκούτι από γάλα, το έκοψα λίγο και έκανα κάτι σαν χερούλι. Πιό εύκολο είναι να κάνης μ' αυτό καφέ ή τσάι. Ένα και ένα στο καμινέτο ζεσταίνεται! Που εκείνα τα μπρίκια! Θέλουν ένα σωρό οινόπνευμα, για να ζεσταθούν! Με αυτό, λίγο βαμβάκι με οινόπνευμα βάζεις, και τάκ, γίνεται ο καφές. Και για φως ούτε λάμπα έχω. Μόνο με το κερί περνώ το βράδυ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γενικά τα απλά πολύ βοηθούν. Να έχετε απλά και στέρεα πράγματα. Το ταπεινό και απλό και οι κοσμικοί το εκτιμούν και τους μοναχούς βοηθάει. Θυμάται κανείς την φτώχεια, τον πόνο, την καλογερική. Όταν είχε πάει στην Μεγίστη Λαύρα ο βασιλιάς Γεώργιος, οι Πατέρες βρήκαν έναν ασημένιο δίσκο και του πήγαν το κέρασμα. Μόλις τον είδε εκείνος, τους είπε: «Εγώ περίμενα κάτι άλλο από σας, περίμενα ξύλινο δίσκο. Τέτοιους δίσκους τους έχω βαρεθή».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτήν την γλύκα της απλότητος δεν την έχετε καταλάβει. Η απλότητα ξεκουράζει. Κοίταξε τί ωραίο κρεμαστάρι γίνετε με ένα καρούλι! Πολύ πρακτικό! Εσείς βασανίζεσθε! Έχετε εδώ ένα καρφάκι ψιλό, για να κρεμάση καείς το ράσο του. Αν βγή ο ασβέστης, θα πρέπη κάθε φορά που ξεκρεμάς το ράσο να το τρίβης, για να καθαρίση! Δεν βάζετε μερικά μεγάλα καρφιά στον τοίχο, για να εξυπηρετηθήτε. Τόσος τοίχος ούτε ένα καρφί! Ή βάζετε μία ξύλινη κρεμάστρα. Αυτή θέλει λούστρο, ξεσκόνισμα κ.λπ. Αντί να απλοποιήτε τα πράγματα, για να μη χάνετε χρόνο, μπαίνετε στό... «πολυχρόνιο». Θέλετε το τέλειο και ταλαιπωρείσθε. Το τέλειο στα πνευματικά να το θέλετε. Να μη δίνετε όλον τον δυναμισμό σας σε εξωτερικά καλλιτεχνικά, αλλά στην καλλιτεχνία της ψυχής. Μέρα-νύχτα να κοιτάζετε για την τελειοποίηση της ψυχής. Αν το καλλιτεχνικό το αξιοποιήσετε στην καλλιέργεια της ψυχής, θα χαίρεστε για το πνευματικό παλατάκι σας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, λένε μερικοί ότι τα Μοναστήρια είχαν τα πιο πολυτελή πράγματα και κράτησαν τον πολιτισμό στον κόσμο!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να εννοούν τα κειμήλια. Τα περισσότερα κειμήλια ξέρετε πότε μαζεύτηκαν; Μετά την Άλωση της Κωνσταντινουπόλεως μαζεύτηκαν. Όλα αυτά  ήταν πρώτα στα παλάτια. Αλλά μετά, για να τα φυλάξουν, τα πήγαιναν στα Μοναστήρια. Η βασίλισσα Μάρω[87]λ.χ. τα κουβαλούσε λίγα-λίγα από τον Σουλτάνο. Ή τα άφηνε κανείς στο Μοναστήρι, όταν πέθαινε, για να μη χαθούν. Όχι ότι τα Μοναστήρια επεδίωκαν να τα παίρνουν, αλλά εκείνοι που τα είχαν, ενίωθαν μία ασφάλεια και τα πήγαιναν εκεί. Στα Μοναστήρια πάλι του Αγίου Όρους άφηναν περιουσίες, για να τρώη ψωμί ο κόσμος, επειδή δεν υπήρχαν ούτε Γηροκομεία ούτε Ορφανοτροφεία ούτε Ψυχιατρεία ούτε Φιλανθρωπικά Ιδρύματα. Έδιναν και μεγάλες εκτάσεις, για να έχουν τα Μοναστήρια να δίνουν στους λαϊκούς που είχαν ανάγκη. Τότε δηλαδή έβλεπαν πιο πέρα, βοηθούσαν εκείνα τα δύσκολα χρόνια τον καημένο τον κόσμο υλικά, για να τον βοηθήσουν μετά και πνευματικά. Στα Μοναστήρια, όταν πήγαιναν οι φτωχοί, τους έδιναν καμμιά ευλογία, και έτσι πάντρευαν το παλληκάρι τους ή την κοπέλα τους. Δηλαδή σκοπός τους ήταν να βοηθήσουν τον καημένο τον κόσμο, γι' αυτό εφτίαχναν και μεγάλα κτίρια. Στην Κατοχή ξέρεις πόσο κόσμο βοήθησαν τα Μοναστήρια; πάρα πολύ! Πολλοί κοσμικοί τότε είχαν επίθετο «Καράκαλλος», γιατί, όταν ένα σπίτι ήταν φιλόξενο, έλεγαν ότι είναι σαν την Μονή Καρακάλλου[88]. Γι' αυτό γίνονταν και τα πανηγύρια στις Μονές, όταν γιόρταζε ο Άγιος, για να βρη λίγο ψάρι ο φτωχός κόσμος να φάη. Να χαρή λίγο και παράλληλα να βοηθηθή πνευματικά. Τώρα για ποιό λόγο να γίνωνται τα πανηγύρια; Ποιός ο σκοπός να φάη ο κόσμος ψάρι, αφού σήμερα δεν στερείται;
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πολυτέλεια κοσμικοποιεί τους μοναχούς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πόσο στόλισμα μπορεί να βάλη κανείς σε έναν Ναό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην εποχή μας, όσο πιο απλό είναι κάτι, ακόμη και σε έναν Ναό, τόσο πιο πολύ βοηθάει, γιατί δεν ζούμε τώρα στο Βυζάντιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στο τέμπλο λ.χ. τί σχέδιο είναι καλό να κάνουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σχέδιο... «καλογερικής»! Όσο μπορείτε, όλα να είναι σεμνά, απλά. Ο Όσιος Παχώμιος[89]στράβωσε την κολόνα, για να μη θαυμάζουν τα έργα του οι άνθρωποι. Θυμάστε το περιστατικό; Είχε φτιάξει Ναό στο Μοναστήρι με πολλή επιμέλεια και τις κολόνες τις είχε κάνει με πλίνθους. Τον έβλεπε πόσο ωραίος ήταν και χαιρόταν. Αλλά μετά σκέφθηκε ότι το να χαίρεται για το ωραίο έργο που εφτίαξε, δεν ήταν κατά Θεόν. Έδεσε λοιπόν τις κολόνες με σχοινιά καί, αφού προσευχήθηκε, είπε στους αδελφούς να τα τραβήξουν, ώσπου στράβωσαν οι κολόνες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εκεί στο Κελλί κόβω κάθε χρόνο λαμαρίνες και βάζω στην σκεπή, στα παράθυρα, γιατί είναι χαλασμένα και μπαίνει αέρας. Βάζω και σανίδια, νάυλον και τα κλείνω. Θα μου πής: «Γιατί δεν φτιάχνεις διπλά παράθυρα;». Και εγώ το ξέρω αυτό, μαραγκός είμαι. Αν ήθελα, μπορούσα να φτιάξω παράθυρα και με τρεις πατούρες, αλλά μετά φεύγει η καλογερική. Ο τοίχος είναι τελείως χάλια. Μπορούσα και από άλλους να ζητήσω να με βοηθήσουν και να βολέψω το Καλύβι, αλλά και έτσι βολεύομαι. Να κάνω αυτό το έξοδο για τον τοίχο, ενώ υπάρχει αλλού τόση ανάγκη; Δεν με βοηθάει αυτό. Αν έχω κανένα πεντακοσάρικο, προτιμώ να πάρω σταυρουδάκια, εικονάκια και να τα δώσω σε κανέναν πονεμένο, για να βοηθηθή. Εγώ χαίρομαι με το να δίνω. Και ανάγκη να το έχω, δεν το ξοδεύω για μένα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όπως όταν ξεκινά κανείς για πνευματικά, δεν χορταίνει ποτέ, έτσι και όταν ξεκινά για τα όμορφα, δεν χορταίνει ποτέ. Τώρα ξέρεις τί πρέπει να γίνεται; Να μη φροντίζης για τα καλοφτιαγμένα κτίρια, να φτιάχνης τα απαραίτητα και να στραφής στην δυστυχία του κόσμου με προσευχή, όταν δεν έχης να δώσης, και με ελεημοσύνη, όταν έχης. Να κάνετε προσευχή και τα πιο απαραίτητα από δουλειές. Όλα αυτά  που κάνουμε, δεν έχουν πολλή ζωή. Και αξίζει να δίνουμε την ζωή μας, και να δυσκολεύωνται ζωές και να πεθαίνουν από την πείνα άλλοι; Τα απλά κτίρια και τα ταπεινά αντικείμενα μεταφέρουν τους μοναχούς νοερά στις σπηλιές και στα απέριττα Ασκητήρια των Αγίων Πατέρων μας, και έτσι ωφελούνται πνευματικά. Ενώ τα κοσμικά θυμίζουν κόσμο και κάνουν τους μοναχούς κοσμικούς στην ψυχή. Πρόσφατα[90]έγιναν ανασκαφές και βρέθηκαν στην Νιτρία τα πρώτα «Κελλία» των μοναχών, τα ασκητικά. Στην συνέχεια βρέθηκαν τα λίγο μεταγενέστερα, που ήταν λίγο κοσμικά, και κατόπιν τα τελευταία που εμοίαζαν με τα σαλόνια των πλουσίων εκείνης της εποχής, με κάδρα και ζωγραφιές στους τοίχους κ.λπ., τα οποία έφεραν την οργή του Θεού, τα λήστεψαν και τα κατέστρεψαν οι κακοποιοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Χριστός γεννήθηκε στην Φάτνη. Αν αναπαυώμαστε στα κοσμικά, θα μας φτύση ο Χριστός, που δεν έφτυσε κανέναν: «Εγώ δεν είχα τίποτε, θα πή. Όλα αυτά  τα βρήκατε γραμμένα στο Ευαγγέλιο; Τα είδατε σ́ Εμένα; Κοσμικοί δεν είστε, καλόγεροι δεν είστε. Τί να σάς κάνω; Που να σάς βάλω;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα ωραία και τέλεια είναι κοσμικά και τους πνευματικούς ανθρώπους δεν τους αναπαύουν. Τα ντουβάρια θα γκρεμισθούν όλα. Η ψυχή... Μία ψυχή αξίζει περισσότερο από όλο τον κόσμο. Τί κάνουμε για την ψυχή; Να ανοίξουμε δουλειά πνευματική. Να μπή η καλή ανησυχία. Ο Χριστός θα ζητήση από μας σε τί βοηθήσαμε τον κόσμο πνευματικά και τί πνευματική δουλειά κάναμε, όχι τί ντουβάρια φτιάξαμε. Αυτά  ούτε θα τα αναφέρη. Για την πνευματική μας πρόοδο θα μας ζητηθή λόγος. Θέλω να καταλάβετε το πνεύμα μου, δεν λέω να μην γίνωνται και αυτά, χτισίματα κ.λπ., ή να μη γίνωνται καλά, αλλά πρώτα τα πνευματικά και ύστερα όλα τα άλλα με πνευματική διάκριση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Απλοποιήστε την ζωή σας!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι κοσμικοί λένε: «Καλότυχοι αυτοί που ζουν στα παλάτια και έχουν όλες τις ευκολίες». Αλλ'' όμως μακάριοι είναι αυτοί που κατόρθωσαν να απλοποιήσουν την ζωή τους και ελευθερώθηκαν από την θηλειά της κοσμικής αυτής εξελίξεως των πολλών ευκολιών, ίσον των πολλών δυσκολιών, και απαλλάχθηκαν από τον φοβερό άγχος της σημερινής εποχής μας. Αν δεν απλοποιήση την ζωή του ο άνθρωπος, βασανίζεται. Ενώ, αν την απλοποιήση, δεν θα έχη αυτό το άγχος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας Γερμανός μία φορά στο Σινά είπε σε ένα Βεδουϊνάκι που ήταν πανέξυπνο: «Εσύ είσαι έξυπνο, μπορείς να μάθης γράμματα». «Και μετά;», τον ρωτάει εκείνο. «Μετά θα γίνης μηχανικός». «Και μετά;». «Μετά θ́ ανοίξης ένα συνεργείο αυτοκινήτων». «Και μετά;». «Μετά θα το μεγαλώσης». «Και μετά;». «Μετά θα πάρης και άλλους να δουλεύουν και θα έχης πολύ προσωπικό». «Δηλαδή, του λέει, να έχω έναν πονοκέφαλο, να βάλω άλλον έναν πονοκέφαλο και μετά να βάλω και έναν άλλον; Δεν είναι καλύτερα τώρα που έχω ήσυχο το κεφάλι μου;». Ο περισσότερος πονοκέφαλος είναι από αυτές τις σκέψεις, να κάνουμε αυτό, να κάνουμε εκείνο. Αν ήταν πνευματικές οι σκέψεις, θα ενίωθε κανείς πνευματική παρηγοριά και δεν θα είχε πονοκέφαλο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τώρα και στους κοσμικούς τονίζω πολύ την απλότητα. Γιατί πολλά από αυτά  που κάνουν, δεν χρειάζονται και τους τρώει το άγχος. Τους μιλάω για την λιτότητα και την ασκητικότητα. Συνέχεια φωνάζω: «Απλοποιήστε την ζωή σας, για να φύγη το άγχος». Και τα περισσότερα διαζύγια από ''κει ξεκινούν. Πολλές δουλειές, πολλά πράγματα έχουν να κάνουν οι άνθρωποι και ζαλίζονται. Δουλεύουν και οι δύο, πατέρας και μάνα, αφήνουν και τα παιδιά εγκαταλελειμμένα. Κούραση, νεύρα – μικρό θέμα, μεγάλος καυγάς – αυτόματο διαζύγιο μετά, εκεί φθάνουν. Αν απλοποιούσαν όμως την ζωή τους, θα ήταν και ξεκούραστοι και χαρούμενοι. Αυτό το άγχος είναι καταστροφή!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μία φορά βρέθηκα σε ένα σπίτι που ήταν όλο πολυτέλεια καί, καθώς συζητούσαμε, μου είπαν: «Ζούμε στον Παράδεισο, ενώ άλλοι άνθρωποι στερούνται». «Ζήτε στην κόλαση, τους λέω.«Άφρον, ταύτη τη νυκτί»[91],είπε ο Θεός στον πλούσιο. Αν ο Χριστός με ρωτούσε: «Που θέλεις να σε βάλουμε, σε μία φυλακή ή σε ένα σπίτι σαν αυτό;», θα έλεγα: «Σε μία σκοτεινή φυλακή». Γιατί η φυλακή θα με βοηθούσε. Θα μου θύμιζε τον Χριστό, θα μου θύμιζε τους αγίους Μάρτυρες, θα μου θύμιζε τους ασκητές που ήταν στις οπές της γής, θα μου θύμιζε καλογερική. Η φυλακή θα εμοίαζε και λίγο με το κελλί μου και θα χαιρόμουν. Αυτό το δικό σας τί θα μου θύμιζε και σε τί θα με βοηθούσε; Γι'' αυτό οι φυλακές με αναπαύουν καλύτερα όχι μόνον από ένα σαλόνι κοσμικό αλλά και απ''ένα ωραίο κελλί μοναχού. Χίλιες φορές στην φυλακή παρά σε ένα τέτοιο σπίτι».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Κάποτε που είχα φιλοξενηθή στην Αθήνα σ́ έναν φίλο μου, με παρακάλεσε να δεχθώ έναν οικογενειάρχη πριν φωτίση, γιατί άλλη ώρα δεν ευκαιρούσε. Ήρθε λοιπόν χαρούμενος και συνέχεια δοξολογούσε τον Θεό. Είχε και πολλή ταπείνωση και απλότητα και με παρακαλούσε να εύχωμαι για την οικογένειά του. Ο αδελφός αυτός ήταν περίπου τριάντα οκτώ ετών και είχε επτά παιδιά. Δυο το ανδρόγυνο και άλλοι δυο οι γονείς του, εν όλω έντεκα ψυχές, και έμεναν όλοι σε ένα δωμάτιο. Μου έλεγε με την απλότητα που είχε: «Όρθιούς μας χωράει το δωμάτιο, αλλά, όταν ξαπλώνουμε, δεν μας παίρνει, είναι λίγο στενόχωρα. Δόξα τω Θεώ, τώρα κάναμε ένα υπόστεγο για κουζίνα και βολευτήκαμε. Εμείς έχουμε και στέγη. Πάτερ μου, ενώ είναι άλλοι που μένουν στην υπαιθρο». Η εργασία του ήταν σιδερωτής. Έμενε στην Αθήνα και έφευγε πριν φωτίση, για να βρεθή εγκαίρως στον Πειραιά όπου εργαζόταν. Από την ορθοστασία και τις πολλές υπερωρίες τα πόδια του είχαν κιρσούς και τον ενοχλούσαν, αλλά η πολλή αγάπη του προς την οικογένειά του τον έκανε να ξεχνάη τους πόνους και τις ενοχλήσεις. Ελεεινολογούσε μάλιστα τον εαυτό του συνέχεια και έλεγε ότι δεν έχει αγάπη, γιατί δεν κάνει καλωσύνες σαν Χριστιανός, και επαινούσε την γυναίκα του ότι εκείνη κάνει καλωσύνες, γιατί εκτός από τα παιδιά και τα πεθερικά της που φρόντιζε, πήγαινε και έπαιρνε τα ρούχα από τους γέρους της γειτονιάς, τα επλένε, τους συγύριζε και τα σπίτια, τους εφτίαχνε και καμμιά σούπα. Έβλεπε κανείς στο πρόσωπο του καλού αυτού οικογενειάρχη ζωγραφισμένη την θεία Χάρη. Είχε μέσα του τον Χριστό και ήταν γεμάτος χαρά και το δωμάτιό του γεμάτο από παραδεισένια χαρά. Ενώ αυτοί που δεν έχουν μέσα τους τον Χριστό, είναι γεμάτοι από άγχος, και δυο άνθρωποι να είναι, δεν χωράνε μέσα σε έντεκα δωμάτια. Ενώ οι έντεκα αυτοί άνθρωποι με τον Χριστό, χωρούσαν μέσα σ́ ένα δωμάτιο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ακόμη και πνευματικοί άνθρωποι, όσους χώρους και να έχουν, βλέπεις να μη χωρούν, γιατί μέσα τους δεν έχει χωρέσει ο Χριστός ολόκληρος. Αν οι γυναίκες που ζούσαν στα Φάρασα έβλεπαν την πολυτέλεια που υπάρχει σήμερα, ακόμη και σε πολλά Μοναστήρια, θα έλεγαν: «Θα ρίξη ο Θεός φωτιά να μας κάψη! Εγκατάλειψη Θεού!». Εκείνες μάζευαν τις δουλειές τάκα-τάκα. Πρωί-πρωί έπρεπε να βγάλουν τα γίδια, μετά να συμμάσουν το σπίτι. Ύστερα πήγαιναν στα εξωκκλήσια ή μαζεύονταν στις σπηλιές, και μία που ήξερε λίγα γράμματα διάβαζε το Συναξάρι του Αγίου της ημέρας. Μετά δωσ́ του μετάνοιες, έλεγαν και την ευχή. Και δούλευαν, κουράζονταν. Μία γυναίκα έπρεπε να ξέρη να ράβη όλα τα ρούχα του σπιτιού. Και τα έρραβαν με το χέρι. Μηχανές του χεριού λίγες είχαν σε καμμιά πόλη, στα χωριά δεν είχαν. Αν υπήρχε στα Φάρασα όλο και όλο μία μηχανή του χεριού. Έρραβαν ακόμη και του άνδρα τα ρούχα και ήταν πιο άνετα, και τις κάλτες τις έπλεκαν στο χέρι. Είχαν γούστο, μεράκι, αλλά τους περίσσευε και χρόνος, γιατί τα είχαν όλα απλά. Οι Φαρασιώτες δεν κοιτούσαν λεπτομέρειες. Ζούσαν την χαρά της καλογερικής. Και άν, για παράδειγμα, η κουβέρτα δεν ήταν καλά στρωμένη και κρεμόταν λίγο από την μία μεριά και έλεγες: «Σιάξε την κουβέρτα», θα σού έλεγαν: «Σε εμποδίζει στην προσευχή σου;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αυτήν την χαρά της καλογερικής οι άνθρωποι σήμερα δεν την γνωρίζουν. Νομίζουν ότι δεν πρέπει να στερηθούν, να ταλαιπωρηθούν. Αν σκέφτονταν οι άνθρωποι λίγο καλογερικά, αν ζούσαν πιο απλά, θα ήταν ήσυχοι. Τώρα βασανίζονται. Άγχος και απελπισία στην ψυχή. «Ο τάδε πέτυχε που εφτίαξε δύο πολυκατοικίες ή που έμαθε πέντε γλώσσες κ.λπ.! Εγώ δεν έχω ούτε ένα διαμέρισμα, δεν ξέρω ούτε μία ξένη γλώσσα. Ώχ, χάθηκα!». Έχει κάποιος ένα αυτοκίνητο και αρχίζει: «Ο άλλος έχει καλύτερο. Να πάρω και εγώ». Παίρνει το καλύτερο, ύστερα μαθαίνει ότι άλλοι έχουν αεροπλάνα ατομικά και πάλι βασανίζεται. Τελειωμό δεν έχουν. Ενώ άλλος που δεν έχει αυτοκίνητο, όταν δοξάζη τον Θεό, χαίρεται: «Δόξα τω Θεώ, λέει, ας μην έχω αυτοκίνητο, έχω γερά τα πόδια μου και μπορώ να περπατήσω. Πόσοι άνθρωποι είναι με κομμένα πόδια, δεν μπορούν να εξυπηρετηθούν, να βγουν έναν περίπατο, θέλουν έναν άνθρωπο να τους υπηρετή, ενώ εγώ έχω τα πόδια μου!». Κια ένας κουτσός που λέει: «Και άλλοι που δεν έχουν και τα δυο πόδια;», και αυτός χαίρεται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η αχαριστία και η απληστία είναι μεγάλο κακό. Ο κυριευμένος από υλικά πράγματα είναι κυριευμένος πάντα από στενοχώρια και άγχος, γιατί πότε τρέμει μην του τα πάρουν και πότε μην του πάρουν την ψυχή. Μία μέρα ήρθε ένας πλούσιος από την Αθήνα και μου λέει: «Πάτερ, έχασα την επαφή με τα παιδιά μου, έχασα τα παιδιά μού». «Πόσα παιδιά έχεις;», του λέω. «Δύο, μου λέει. Τα μεγάλωσα με το πουλιού το γάλα. Τί ήθελαν και δεν το είχαν! Ακόμη και αυτοκίνητο τα πήρα». Από την συζήτηση βγήκε ότι είχε και αυτός δικό του αυτοκίνητο και η γυναίκα του δικό της και τα παιδιά δικό τους. «Ευλογημένε, του λέω, εσύ, αντί να λύσης τα προβλήματά σου, τα μεγάλωσες. Τώρα θέλεις ένα μεγάλο γκαράζ για τα αυτοκίνητα, έναν μηχανικό να τον πληρώνης τετραπλάσια, για να τα διορθώνης, χώρια που κινδυνεύετε και οι τέσσερις κάθε στιγμή να σκοτωθήτε. Ενώ, αν είχες απλοποιήσει την ζωή σου, θα ήταν ενωμένη η οικογένειά σου, θα καταλάβαινε ο ένας τον άλλο και δεν θα είχες αυτά  τα προβλήματα. Δεν φταίνε τα παιδιά σου τώρα, εσύ φταίς που δεν φρόντισες να δώσης άλλη αγωγή στα παιδιά σού». Μία οικογένεια τέσσερα αυτοκίνητα, ένα γκαράζ, έναν μηχανικό κ.λπ.! Ας πάη ο άλλος λίγο αργότερα. Όλη αυτή η ευκολία γεννάει δυσκολίες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άλλη φορά ήρθε ένας άλλος οικογενειάρχης στο Καλύβι – ήταν πέντε άτομα η οικογένειά του – και μου λέει: «Πάτερ, έχουμε ένα αυτοκίνητο και σκέφτομαι να πάρουμε άλλα δύο. Θα μας διευκολύνη». «Και πόσο θα σάς δυσκολέψη το σκέφτηκες; του λέω. Το ένα το βάζεις εκεί σε μία τρύπα, τα τρία που θα τα βάλης; Θα θέλης ένα γκαράζ και μία αποθήκη για καύσιμα. Θα διατρέχετε τρεις κινδύνους. Καλύτερα να έχετε ένα και να περιορίσετε τις εξόδους σας. Θα έχετε χρόνο να δήτε τα παιδιά σας. Θα έχετε την ηρεμία σας. Η απλοποίηση είναι το παν». «Δεν το σκέφθηκα αυτό», μου λέει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μας είπε κάποιος ότι δυο φορές δεν μπορούσε να σταματήση τον συναγερμό του αυτοκινήτου. Την μία φορά, γιατί είχε μπή μία μύγα, και την άλλη, γιατί είχε μη ο ίδιος αντικανονικά στο αυτοκίνητο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μαρτυρική είναι η ζωή τους, γιατί δεν απλοποιούν τα πράγματα. Οι περισσότερες ευκολίες δυσκολίες προξενούν. Οι κοσμικοί πνίγονται από τα πολλά. Έχουν γεμίσει ευκολίες-ευκολίες και έκαναν την ζωή τους δύσκολη. Αν δεν απλοποιήση κανείς τα πράγματα, μία ευκολία γεννάει ένα σωρό δυσκολίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ήμασταν μικρά, κόβαμε το καρούλι στις άκρες, βάζαμε μία σφήνα μέσα και κάναμε ένα ωραίο παιχνίδι και χαιρόμασταν μ'' αυτό. Τα μικρά παιδιά χαίρονται με ένα αυτοκινητάκι πιο πολύ από ό,τι ο πατέρας τους, όταν αγοράζη μερσεντές. Αν ρωτήσης ένα κοριτσάκι: «Τί θέλεις, ένα κουκλάκι ή μία πολυκατοικία;», να δής, θα σού πή: «Ένα κουκλάκι». Και τελικά τα μικρά παιδιά γνωρίζουν την ματαιότητα του κόσμου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει περισσότερο, για να καταλάβη κανείς αυτήν την χαρά της λιτότητος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να συλλάβη κανείς το βαθύτερο νόημα της ζωής.«Ζητείτε πρώτον την Βασιλείαν του Θεού...»[92]. Από εκεί ξεκινά η απλότητα και κάθε σωστή αντιμετώπιση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Εξωτερικός θόρυβος και εσωτερική ησυχία
- type: h2
  initial:
    ru: ''
  text:
    ru: Αλλοίωσαν την ήρεμη φύση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα περισσότερα μέσα που χρησιμοποιούν σήμερα οι άνθρωποι για την εξυπηρέτησή τους κάνουν θόρυβο. Άχ, την έχουν παλαβώσει με τους θορύβους την ήρεμη φύση! Την έχουν αλλοιώσει και με όλα τα σύγχρονα μέσα την έχουν καταστρέψει. Παλιά τί γαλήνη υπήρχε! Πώς ο άνθρωπος αλλοιώνεται και αλλοιώνει, χωρίς να το καταλαβαίνη!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλοι τώρα έχουν μάθει να ζουν με τον θόρυβο. Βλέπεις, και πολλά από τα σημερινά παιδιά, για να διαβάσουν, θέλουν μουσική ρόκ! Δηλαδή περισσότερό τους αναπαύει να διαβάζουν με μουσική παρά με ησυχία. Αναπαύονται στην ανησυχία, γιατί υπάρχει ανησυχία μέσα τους. Παντού θόρυβος υπάρχει. Συνέχεια βού, βού... ακούς! Βού, βού..., για να κόψουν ξύλα, βού..., για να γυαλοχαρτίσουν, βού..., για να ραντίσουν με τον ψεκαστήρα. Μετά θα βρουν άλλους ψεκαστήρες σαν αεροπλάνα, που θα κάνουν πιο πολύ θόρυβο, και θα πούν: «Ά, αυτοί είναι πιο καλοί, γιατί ρίχνουν το φάρμακο από πάνω και δεν μένει ούτε μπουμπούκι άβρεχτο» και θα θέλουν να αγοράσουν από εκείνους και θα χαίρωνται μ'' εκείνους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μία τρύπα πάει να κάνη ο άλλος, για να βάλη ένα καρφί, και βάζει τό... «βου»! Τί να κάνη; Μία τρύπα στο νερό! Και χαίρεται. Το παράξενο είναι ότι καμαρώνει κιόλας! Για να πάρη λίγο αέρα, παίρνει μηχανή με μπαταρία, πάλι βού... Παλιά, όταν ζεσταινόταν κανείς, έκανε λίγο αέρα με το χέρι του, ενώ τώρα ξεκουφαίνεται, για να κάνη λίγο αέρα! Και στην θάλασσα τώρα όλα θόρυβο κάνουν. Έβλεπες άλλοτε τα καράβια με τα πανιά να πλέουν ήσυχα. Τώρα κι ένα μικρό μοτέρ κάνει ντούκου-ντούκου! Σε λίγο θα κυκλοφορούν οι περισσότεροι με αεροπλάνα. Και ξέρεις τί γίνεται; Η γη απορροφάει και λίγο τον θόρυβο. Στον αέρα θα είναι... ο Θεός να φυλάξη!
- type: h2
  initial:
    ru: ''
  text:
    ru: Κατέστρεψαν και τα άγια ερημικά μέρη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Το ανήσυχο κοσμικό πνεύμα της εποχής μας κατέστρεψε, δυστυχώς, με τον δήθεν πολιτισμό του ακόμη και τα άγια ερημικά μέρη, που γαληνεύουν και αγιάζουν τις ψυχές. Ο ανήσυχος άνθρωπος δεν ησυχάζει ποτέ. Δεν άφησαν πουθενά τόπο ήσυχο. Ακόμη και τους Αγίους Τόπους τους έχουν κάνει τώρα!... Όπως αναφέρεται και στον βίο της Ερημίτιδος Φωτεινής[93], στην έρημο, όπου είχε ασκητέψει, έκαναν μετά περίπτερα, καντίνες!... Μέσα στα ασκητήρια, όπου ασκήτεψαν τόσοι μοναχοί, τόσοι Άγιοι, πουλούσαν αναψυκτικά οι Άγγλοι! Πάει η έρημος! Σπίτια, ραδιόφωνα, μαγαζιά, ξενοδοχεία, αεροδρόμια! Έγινε αυτό που λέει ο Άγιος Κοσμάς: «Εκεί που κρεμούν τώρα τα παλληκάρια τα καριοφίλια, θα ''ρθή καιρός που θα κρεμούν οι γύφτοι τα όργανα!». Θέλω να πώ, έτσι καταντήσαμε και εμείς, εκεί που ασκήτευαν, που είχαν τα κομποσχοίνια οι μοναχοί, τώρα έχουν ραδιόφωνα, αναψυκτικά!... Έ, φαίνεται, μετά από λίγα χρόνια δεν θα χρειάζωνται αυτά. Όπως δείχνουν τα πράγματα, γενικά, φαίνεται η ζωή πλησιάζει στο τέλος. Τελειώνει η ζωή, τελειώνει και αυτός ο κόσμος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στο Άγιον Όρος υπάρχει τώρα τόπος ήσυχος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Που τόπος ήσυχος και εκεί τώρα; αφού ανοίγουν συνέχεια δασικούς δρόμους! Αυτοκίνητα από εδώ, αυτοκίνητα από εκεί! Ακόμη και στα πιο ερημικά και ησυχαστικά μέρη έχουν πάρει αυτοκίνητο. Απορώ τί ζητάνε αυτοί οι άνθρωποι στην έρημο! Ο Μέγας Αρσένιος[94]στην έρημο άκουγε τα καλάμια που σείονταν, όταν φυσούσε γλυκά, και έλεγε: «Τί θόρυβος είναι αυτός; Σεισμός γίνεται;». Που να έβλεπαν οι Άγιοι Πατέρες αυτά  που γίνονται σήμερα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά οι διακονητές[95]στα Κοινόβια, ιδίως ο τραπεζάρης και ο αρχοντάρης, πολύ κουράζονταν. Έπρεπε να πλύνουν τα πιάτα, να τρίψουν τα μπακιρένια σκεύη... Σήμερα έχουν ευκολίες, έχουν διάφορα σύγχρονα μέσα και τα περισσότερα κάνουν θόρυβο. Θυμάμαι, εμείς στο Κοινόβιο με τα δοχεία κουβαλούσαμε το νερό από μία πηγή και με το μαγγάνι το ανεβάζαμε σιγά-σιγά  στον τρίτο όροφο. Τώρα φέρνουν το νερό με την μηχανή και ακούς συνέχεια ντούκου-ντούκου. Τα ντουβάρια σείονται, τα τζάμια τρίζουν! Τουλάχιστον να βάλουν έναν σιγαστήρα. Στον στρατό, με τον ανταρτοπόλεμο, με έναν σιγαστήρα φόρτιζα την μπαταρία του ασύρματου, και απέναντι δεν με άκουγαν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ήρθαν μία μέρα στο Καλύβι μοναχοί από ένα Μοναστήρι και μιλούσαν δυνατά. «Πιο σιγά, λέω στον έναν, μας ακούνε πιο πέρα!». Τίποτε αυτός. «Πιο σιγά», του ξαναλέω. «Ευλόγησον, Γέροντα, μου λέει, συνηθίσαμε να φωνάζουμε στο Μοναστήρι, γιατί έχουμε την γεννήτρια και μιλάμε δυνατά, για να ακούμε». Ακούς εκεί; Αντί να λένε την ευχή και να μιλούν σιγά, φωνάζουν, γιατί έχουν την γεννήτρια! Και το κακό είναι ότι, όπως μερικά παιδιά αφήνουν την εξάτμιση, για να ακούνε ντούκου-ντούκου..., φθάνει αυτό το πνεύμα τώρα και στον Μοναχισμό. Εκεί πάμε τώρα, το χαίρονται δηλαδή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είδα μία αδελφή σήμερα το πρωί, ήταν σαν τους αστροναύτες! Κατέβαινε από πάνω τον κατήφορο με την ψάθα στο κεφάλι, την μάσκα στην μύτη, το χορτοκοπτικό στο χέρι, και καμάρωνε. Οι αστροναύτες δεν καμάρωναν τόσο, όταν κατέβαιναν από το φεγγάρι! Ακούω σε λίγο βού... β... β... Κοιτάζω, έκοβε χόρτα με το χορτοκοπτικό! Να μην μείνη ένας χώρος που να μην ακούγεται βού... Τελείωσε αυτή, έρχεται μετά και ο άλλος με το πιο «βού», να οργώση! Έτρεχε από 'δω, έτρεχε από 'κει. Μετά παίρνει άλλο μηχάνημα, να σιάξη το χώμα. Βρέ, τί πάθαμε!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Επειδή όμως, Γέροντα, υπάρχουν αυτά  τα μέσα που διευκολύνουν...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ώ, ξέρετε πόσα μέσα υπάρχουν! Όσο μπορείτε, τα βουητά, τους θορύβους να τα αποφεύγετε. Το βουητό μας βγάζει έξω από το Μοναστήρι. Τί την έχετε μετά κάτω στην πόρτα την ταμπέλα να γράφη «Ησυχαστήριο»; Γράψτε καλύτερα «Βουηστήριο» ή «Ανησυχαστήριο!». Τί να το κάνω το Μοναστήρι, αν δεν έχη ησυχία; Κοιτάξτε εκεί πέρα, όσο μπορείτε, να τα περιορίσετε αυτά. Ακόμη αυτήν την γλυκειά ησυχία δεν την καταλάβατε. Αν την καταλαβαίνατε, θα μπορούσατε να με καταλάβετε καλύτερα και να καταλάβετε μερικά πράγματα. Αν θα γευόσασταν από τους πνευματικούς καρπούς της ησυχίας, θα υπήρχε ασφαλώς και η καλή ανησυχία και θα επιδιώκατε περισσότερο την αγία ησυχία της πνευματικής ζωής.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ησυχία είναι μυστική προσευχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο μοναχός με όλα αυτά  τα θορυβώδη μέσα διώχνει τις προϋποθέσεις της προσευχής και της μοναχικής ζωής. Γι' αυτό, όσο γίνεται, να μη χρησιμοποιή θορυβώδη μέσα. Αυτά  που θεωρούν οι άνθρωποι σήμερα ευκολίες, στην ουσία δεν τον ωφελούν τον σκοπό του. Δεν μπορεί να βρη ο μοναχός μέσα σε μία τέτοια κατάσταση αυτό για το οποίο ξεκίνησε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ησυχία είναι μεγάλη υπόθεση. Ακόμη και να μην προσεύχεται κανείς, και μόνο με την ησυχία προσεύχεται. Είναι μυστική προσευχή και πολύ βοηθάει στην προσευχή σαν την άδηλη αναπνοή στον άνθρωπο. Αυτός που κάνει δουλειά πνευματική στην ησυχία βυθίζεται μετά στην ευχή. Ξέρεις τί θα πη βυθίζεται; το παιδάκι, όταν λουφάζη στην αγκαλιά της μάνας, δεν μιλάει. Είναι ένωση πλέον, επικοινωνία. Γι' αυτό πολύ βοηθάει το Μοναστήρι να είναι απομακρυσμένο από τον κόσμο και από αρχαιολογικούς χώρους και κοσμικούς θορύβους και από τους πολλούς ακόμη ανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η εξωτερική ησυχία, μακριά από τον κόσμο, με την διακριτική άσκηση και την αδιάλειπτη προσευχή, πολύ γρήγορα φέρνει και την εσωτερική ησυχία –τήν ειρήνη της ψυχής – η οποία είναι η απαραίτητη προϋπόθεση για την πνευματική λεπτή εργασία. Τότε πια ο άνθρωπος δεν ενοχλείται από την εξωτερική ανησυχία, γιατί στην ουσία μόνον το σώμα βρίσκεται στην γή, ενώ ο νούς βρίσκεται στον Ουρανό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τον θόρυβο άμα θέλη τον ακούει κανείς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν στο διακόνημα υπάρχη θόρυβος ή για το εργόχειρο χρειάζεται μία μηχανή που κάνει θόρυβο, τί να κάνη κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν καμμιά φορά το εργόχειρο είναι θορυβώδες, πολύ βοηθάει η σιγανή ψαλμωδία. Αν δεν μπορήτε να κάνετε ευχή, να ψάλλετε. Θέλει υπομονή. Όταν έρχωμαι με το καράβι, έχει πολύ θόρυβο. Κάθομαι σε μία γωνιά, κλείνω και τα μάτια σαν να κοιμάμαι, για να μη με ενοχλή ο κόσμος, και ψάλλω – και τί δεν ψάλλω! Πόσα «Άξιον έστιν», πόσα «Άγιος ο Θεός»! Κάνει και έναν κρότο το καράβι που ταιριάζει ακριβώς με την ψαλτική! Γίνεται ισοκράτημα στο «Άξιον έστιν» του Παπανικολάου, στο «Άγιος ο Θεός» του Νηλέως, σε όλα ταιριάζει αυτός ο κρότος! Ψάλλω με τον νού μου, συμμετέχει όμως και η καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως, νομίζω, δεν είναι τόσο ο εξωτερικός θόρυβος που ενοχλεί, όσο η μέριμνα. Την φασαρία, αν θέλη, την ακούει κανείς. Ενώ την μέριμνα δύσκολο να την αποφύγη. Ο νούς είναι η βάση. Τα μάτια μπορεί να κοιτάζουν κάτι και να μην το βλέπουν. Όταν προσεύχωμαι, μπορεί να κοιτάζω, αλλά δεν βλέπω. Περπατάω, και μπορεί να κοιτάζω ένα τοπίο κ.λπ., αλλά να μην το βλέπω. Όταν δυσκολεύεται κανείς να λέη την ευχή μέσα στον θόρυβο, είναι γιατί ο νούς δεν είναι δοσμένος στον Θεό. Πρέπει να φθάση ο άνθρωπος στην θεία αφηρημάδα, για να ζήση την εσωτερική ησυχία και να μην ενοχλήται από τον θόρυβο στην προσευχή. Φθάνει στο σημείο εκείνο της θείας αφηρημάδας που δεν ακούει πια τους θορύβους ή τους ακούει όταν θέλη ή, μάλλον, όταν κατεβαίνη ο νούς από τον Ουρανό. Και θα φθάση σ́ αυτό το σημείο, αν δουλέψη πνευματικά, αν αγωνισθή. Τότε θα ακούη όποτε αυτός θέλει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ήμουν στον στρατό, είπα μία φορά σε έναν ευλαβή συστρατιώτη μου: «Στο τάδε μέρος θα συναντηθούμε». «Μα εκεί υπάρχει μεγάφωνο», μου λέει. «Άμα θέλη, του λέω, ακούει κανείς, αν δεν θέλη, δεν ακούει». Όταν είναι ο νούς μας κάπου, ακούμε; Εκεί στο δάσος, απέναντι από το Καλύβι, γύμνωναν το βουνό με τα αλυσοπρίονα. Όταν διάβαζα ή προσευχόμουν και ήμουν προσηλωμένος, δεν άκουγα τίποτε. Όταν σταματούσα, όλα τα άκουγα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να σεβασθούμε την ησυχία των άλλων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν δεν είμαστε εμείς αιτία για τον θόρυβο που υπάρχει, δεν πειράζει, ο Θεός βλέπει. Αλλά, όταν εμείς είμαστε αιτία, τότε είναι κακό. Γι'' αυτό πάντα πρέπει να προσέχουμε, να μην ενοχλούμε τους άλλους. Αν ένας δεν θέλη να προσευχηθή, τουλάχιστον να μη βάζη παράσιτα και στους άλλους. Αν καταλαβαίνατε την μεγάλη ζημιά που κάνετε στον άλλον που προσεύχεται, θα προσέχατε πάρα πολύ. Γιατί, αν κανείς δεν το νιώση σαν μία ανάγκη προσωπική και σαν βοήθεια για το σύνολο, ώστε να το κάνη με την καρδιά του, από αγάπη και όχι αναγκαστικά, αλλά η σαν πειθαρχία, αυτό δεν θα έχη καλά αποτελέσματα. Όταν το κάνη με σφίξιμο, σαν μία πειθαρχία, και λέη, «τώρα πρέπει να περπατήσω έτσι, για να μην ενοχλήσω, τώρα πρέπει να μην περπατήσω ελεύθερα...», είναι βάσανο! Σκοπός είναι να το κάνη με την καρδιά του, με χαρά, επειδή ο άλλος προσεύχεται, επικοινωνεί με τον Θεό. Πόσο διαφέρει το ένα από το άλλο! Ό,τι κάνει κανείς με την καρδιά του, το χαίρεται και τον βοηθάει. Όταν το αισθανθή σαν ανάγκη να σεβασθή τον άλλον που προσεύχεται, αισθάνεται ένα δέος μετά. Και όταν κανείς σέβεται τον άλλον, τον ίδιο τον εαυτό του σέβεται και τότε τον εαυτό του δεν τον υπολογίζει, γιατί δεν έχει φιλαυτία αλλά φιλότιμο. Να μπαίνη ο ένας στην θέση του άλλου. Να σκέφτεται: «Αν ήμουν εγώ στην θέση εκείνου, πώς θα ήθελα να μου φερθούν; Αν ήμουν κουρασμένος, αν προσευχόμουν, θα ήθελα να χτυπούν έτσι τις πόρτες;». Όταν μπαίνης στην θέση του άλλου, τα πράγματα αλλάζουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στα Κοινόβια πρώτα τί όμορφα ήταν! Ησυχία! Είχαν και το ρολόι που χτυπούσε κάθε τέταρτο, για να θυμάται καθένας να λέη την ευχή. Και να ξεχνιόταν κανείς, άκουγε το ρολόι που χτυπούσε κάθε τέταρτο, και άρχιζε πάλι την ευχή. Πολύ βοηθούσε το ρολόι. Έλεγαν οι Πατέρες την ευχή και είχε ησυχία, γαλήνη μεγάλη μέσα στο Μοναστήρι. Στο Κοινόβιο που ήμουν στο Άγιον Όρος ήμασταν εξήντα Πατέρες και ήταν σαν να ήταν ένας ησυχαστής. Είχαν όλοι την ευχή. Στην Εκκλησία λίγοι έψαλλαν και οι περισσότεροι νοερά προσεύχονταν. Στα διακονήματα το ίδιο. Μία ησυχία παντού! Δεν μιλούσαν δυνατά ούτε φώναζαν. Ήσυχα έκαναν τα διακονήματά τους. Όλοι αθόρυβα κινούνταν σαν τα πρόβατα. Πάντα υπήρχε αθόρυβα μία κίνηση στο Μοναστήρι. Δεν ήταν όπως τώρα που έχουν στα Κοινόβια ώρα διακονίας, ώρα ησυχίας... σιωπητήριο! Καθένας κινιόταν ανάλογα με την διακονία του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να αγαπήσουμε την ευλογημένη έρημο και να την σεβασθούμε, εάν θέλουμε να μας βοηθήση και αυτή με την αγία της ερημία και την γλυκειά της ηρεμία, για να ημερέψουμε, να ερημωθούν τα πάθη μας και να πλησιάσουμε στον Θεό. Χρειάζεται προσοχή μην τυχόν και προσαρμόση κανείς την αγία έρημο με τον εμπαθή εαυτό του. Αυτό είναι μεγάλη ασέβεια (σάν να πηγαίνης προσκύνημα στον Άγιο Γολγοθά με μπουζούκια).
- type: h2
  initial:
    ru: ''
  text:
    ru: Καλοί λογισμοί, το αντίδοτο του θορύβου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Φυσικά, επειδή οι σημερινοί άνθρωποι χρησιμοποιούν, δυστυχώς, θορυβώδη μέσα ακόμη και για μικρές εξυπηρετήσεις, αν βρεθή κανείς για ένα διάστημα κάπου που έχει φασαρία, θα πρέπη να καλλιεργήση καλούς λογισμούς. Δεν μπορείς να πής, «μή χρησιμοποιής αυτό, μη χρησιμοποιής εκείνο, γιατί κάνει θόρυβο», αλλά να φέρνης αμέσως καλό λογισμό. Π.χ. ακούς ψεκαστήρα και νομίζεις περνά ελικόπτερο. Να σκεφθής: «Μπορεί να ήταν αυτήν την ώρα μία αδελφή άρρωστη βαριά και να ερχόταν ένα ελικόπτερο να την πάρη για το νοσοκομείο. Τί στενοχώρια θα είχα τότε; Δόξα τω Θεώ, είμαστε όλες καλά». Εδώ χρειάζεται το μυαλό και η εξυπνάδα, η τέχνη να φέρης καλό λογισμό. Ακούς π.χ. τον θόρυβο της μπετονιέρας, του αναβατόρ κ.λπ. Να πείς: «Δόξα σοί ο Θεός, δεν γίνεται βομβαρδισμός, δεν γκρεμίζονται σπίτια. Οι άνθρωποι έχουν ειρήνη και χτίζουν σπίτια».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, είναι χαλασμένα τα νεύρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Χαλασμένα τα νεύρα; Τί θα πη αυτό; Μήπως είναι χαλασμένος ο λογισμός; Το πιο καλό απ'' όλα είναι ο καλός λογισμός. Κάποιος κοσμικός είχε φτιάξει σπίτι σε ένα ήσυχο μέρος. Αργότερα από την μία μεριά έγινε γκαράζ, από την άλλη δρόμος και από την άλλη ένα κοσμικό κέντρο. Μέχρι τα μεσάνυχτα νταούλια. Δεν μπορούσε ο καημένος να κοιμηθή, έβαζε ωτασπίδες στ'' αυτιά, άρχισε να παίρνη και χάπια. Κόντευε να τρελλαθή. Ήρθε και με βρήκε. «Γέροντα, αυτό και αυτό, μου λέει, δεν μπορούμε να ησυχάσουμε. Τί να κάνω; Σκέφτομαι να φτιάξω άλλο σπίτι». «Να βάλης καλό λογισμό, του λέω. Να σκέφτεσαι, αν γινόταν πόλεμος και στο γκαράζ εφτίαχναν τα τάνκς, δίπλα ήταν νοσοκομείο και έφερναν τα ασθενοφόρα τους τραυματίες και εσένα σου έλεγαν: «Κάθησε εδώ. Σού εξασφαλίζουμε την ζωή, δεν θα σε πειράξουμε. Μπορείς να βγαίνης από το σπίτι σου ελεύθερα μόνο στην ακτίνα που είναι κτισμένα αυτά, γιατί εκεί δεν θα πέση σφαίρα» ή «Να μείνης στο σπίτι σου και δεν θα σε ενοχλήση κανείς», μικρό πράγμα θα ήταν αυτό; Δεν θα το θεωρούσες ευλογία; Γι'' αυτό τώρα να πής: «Δόξα σοί ο Θεός, δεν γίνεται πόλεμος, ο κόσμος είναι καλά και κάνει τις δουλειές του. Στο γκαράζ αντί τάνκς φτιάχνουν τα αυτοκίνητά τους οι άνθρωποι. Δόξα σοί ο Θεός, δεν υπάρχει νοσοκομείο, τραυματίες κ.λπ. Δεν περνούν τάνκς, αυτοκίνητα περνούν και οι άνθρωποι τρέχουν στις δουλειές τους». Αν φέρης έτσι καλό λογισμό, θα έρθη η δοξολογία μετά». Κατάλαβε ο καημένος ότι όλη η βάση είναι σωστή αντιμετώπιση και έφυγε αναπαυμένος. Τα αντιμετώπισε σιγά-σιγά  με καλούς λογισμούς, πέταξε και τα χάπια και κοιμόταν χωρίς δυσκολία. Βλέπεις με έναν καλό λογισμό πώς τακτοποιείται κανείς;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μία φορά ταξίδευα με το λεωφορείο και ο εισπράκτορας έβαλε το ράδιο δυνατά. Μερικοί νεαροί που θρήσκευαν, είπαν ότι είναι και ένας μοναχός και του έκαναν επανειλημμένως νόημα να το κλείση. Μία-δύο, τίποτε αυτός, το έβαλε πιο δυνατά. «Αφήστε τόν, τους είπα, δεν πειράζει, μου κάνει ισοκράτημα στην ψαλμωδία μού». Με τον λογισμό μου έλεγα: «Άν, Θεός φυλάξοι, γινόταν ένα ατύχημα λίγο πιο πέρα και αναγκάζονταν να βάλουν στο δικό μας αυτοκίνητο ανθρώπους σακατεμένους, άλλος να είναι με σπασμένο πόδι, άλλος με σπασμένο κεφάλι, πώς θα άντεχα αυτήν την σκηνή; Δόξα σοί ο Θεός, οι άνθρωποι είναι καλά και τραγουδούν κιόλας»! Έτσι ταξίδευα μία χαρά ψάλλοντας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να σάς πω και άλλο παράδειγμα, για να δήτε πώς τακτοποιείται κανείς σε όλες τις περιπτώσεις με έναν καλό λογισμό! Ήμουν στα Ιεροσόλυμα με κάποιον γνωστό,. Εκεί είχαν μία γιορτή. Γιόρταζαν και φώναζαν συνέχεια «ά λάλα...αχ» Χαλασμός γινόταν! «Εν αλαλαγμώ... και εν κυμβάλοις αλαλαγμού»! Δεν καταλάβαινες τί έλεγαν! Όλη νύχτα φώναζαν. Ο γνωστός μου νευρίασε, βγήκε στο παράθυρο, δεν έκλεισε μάτι. Εγώ με έναν καλό λογισμό που έβαλα, κοιμήθηκα σαν το πουλάκι. Θυμήθηκα την Έξοδο των Εβραίων από την Αίγυπτο και ενίωθα μία συγκίνηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έτσι και εσείς πάντα με καλούς λογισμούς όλα να τα αντιμετωπίζετε. Χτύπησε π.χ. μία πόρτα; Να πήτε: «Άν, Θεός φυλάξοι, πάθαινε κάτι μία αδελφή, χτυπούσε και έσπαζε το πόδι της, θα κοιμόμουν εγώ; Τώρα χτύπησε η πόρτα, θα είχε κάποια δουλειά η αδελφή». Αν όμως μία αρχίση να κατακρίνη και πή: «Χτύπησε την πόρτα, απρόσεκτη είναι! Τί κατάσταση είναι αυτή!»., που να ησυχάση μετά! Από την στιγμή που θα βάλη τέτοιους λογισμούς, μετά το ταγκαλάκι θα την αναστατώση. Ή μπορεί να ακούη μία αδελφή την νύχτα τα ξυπνητήρια που χτυπάνε. Χτύπησε λ.χ. το ένα μία φορά, μετά από λίγο ξαναχτυπάει το ίδιο. Αν σκεφθή: «Αυτή η ψυχή ήταν κατάκοπη, δεν μπόρεσε να σηκωθή. Καλύτερα να ξεκουραζόταν μισή ώρα παραπάνω και μετά να έκανε τα πνευματικά της», δεν θα ανησυχήση ούτε θα στενοχωρηθή που ξύπνησε. Αν όμως σκεφθή τον εαυτό της που ξύπνησε από τα ρολόγια, μπορεί να πή: «Τί γίνεται εδώ; Δεν μπορεί να ησυχάση κανείς λίγο!».. Γι'' αυτό, όσο βοηθάει ένας καλός λογισμός, δεν βοηθάει καμμιά άλλη άσκηση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αποκτήσουμε την εσωτερική ησυχία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σκοπός είναι ο άνθρωπος να τα αξιοποιήση όλα για αγώνα. Να προσπαθήση να αποκτήση την εσωτερική ησυχία. Να αξιοποιήση τον θόρυβο βάζοντας δεξιό λογισμό. Όλη η βάση είναι η καλή αντιμετώπιση. Όλα με καλούς λογισμούς να τα αντιμετωπίζη. Μέσα στον θόρυβο, αν πετύχη την εσωτερική ησυχία, έχει πολλή αξία. Αν δεν πετύχη την ησυχία μέσα στην ανησυχία, ούτε στην ησυχία θα ησυχάση. Όταν έρθη στον άνθρωπο η εσωτερική ησυχία, ησυχάζουν όλα μέσα του, και τίποτε δεν τον ενοχλεί. Αν θέλη την εξωτερική ησυχία, για να ησυχάση εσωτερικά, όταν βρεθή στην ησυχία, την ημέρα θα πάρη ένα καλάμι και θα διώχνη τα τζιτζίκια και το βράδυ θα διώχνη τα τσακάλια, για να μην τον ενοχλούν. Θα διώχνη δηλαδή αυτά  που θα μαζεύη ο διάβολος. Τί νομίζετε; Ποιά είναι η δουλειά του; Όλα μας τα φέρνει ανάποδα ο διάβολος, μέχρι που μας αναποδογυρίζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σε μία Σκήτη δύο γεροντάκια πήραν ένα γαϊδουράκι που είχε ένα κουδουνάκι. Ένας νέος με ησυχαστικές τάσεις παραπονιόταν για το κουδουνάκι που είχε το ζώο και πήρε όλους τους Κανόνες, για να αποδείξη ότι δεν επιτρέπεται να έχουν γαϊδουράκι στην Σκήτη! Οι άλλοι Πατέρες είπαν ότι δεν τους ενοχλεί. Του λέω: «Δεν φθάνει εκεί πέρα που δεν μας απασχολούν τα γεροντάκια, αλλά εξυπηρετούνται με το γαϊδουράκι; Αν δεν είχε κουδουνάκι και το έχαναν, θα έπρεπε να πάμε εμείς να το βρούμε. Παραπονιόμαστε κιόλας;». Αν δεν έχουμε έτσι καλούς λογισμούς και δεν αξιοποιήσουμε τα πάντα στα πνευματικά, τότε και σε Αγίους κοντά να πάμε, δεν θα κάνουμε προκοπή. Βρέθηκα λ.χ. σε στρατόπεδο; Να αξιοποιήσω την σάλπιγγα σαν καμπάνα και το όπλο να μου θυμίζη τα πνευματικά όπλα κατά του διαβόλου. Εάν δεν τα αξιοποιήσουμε όλα στα πνευματικά, θα μας ενοχλή ακόμη και η καμπάνα. Ή εμείς θα τα αξιοποιήσουμε ή ο διάβολος θα τα εκμεταλλευθή. Ο ανήσυχος και στην έρημο θα μεταφέρη τον ανήσυχο εαυτό του. Πρώτα απ'' όλα η ψυχή θα πρέπη να αποκτήση την εσωτερική ησυχία μέσα στην εξωτερική ανησυχία, για να μπορέση να ησυχάση έξω στην ησυχία.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 5 – Η πολλή μέριμνα απομακρύνει από τον Θεό
- type: h2
  initial:
    ru: ''
  text:
    ru: Να μην ανοίγουμε πολλά μέτωπα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι σήμερα, επειδή δεν ζουν απλά, έχουν πολύ περισπασμό. Ανοίγουν πολλά μέτωπα και χάνονται με την πολλή μέριμνα. Εγώ ένα-δύο πράγματα τα τακτοποιώ και μετά σκέφτομαι άλλα. Ποτέ δεν έχω να κάνω πολλά πράγματα μαζί. Τώρα σκέφτομαι να κάνω αυτό, το τελειώνω και μετά σκέφτομαι να κάνω κάτι άλλο. Γιατί, αν δεν τελειώσω το ένα και αρχίσω το άλλο, δεν έχω ανάπαυση. Όταν έχη κανείς πολλά μαζί να κάνη, παλαβώνει. Και μόνο να τα σκέφτεται, παθαίνει σχιζοφρένεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είχε έρθει στο Καλύβι ένας νέος που είχε ψυχολογικά προβλήματα. Μου έλεγε ότι ταλαιπωρείται, γιατί έχει μία κληρονομική ευαισθησία από τους γονείς κ.λπ. «Τι κληρονομικά μου λές; του είπα. Πρώτα, χρειάζεσαι ξεκούραση. Μετά να πάρης το πτυχίο σου, μετά να πάς στον στρατό, μετά να κοιτάξης για διορισμό». Με άκουσε ο καημένος και βρήκε τον δρόμο του. Έτσι βρίσκουν και τον εαυτό τους οι άνθρωποι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κι εγώ κουράζομαι εύκολα, όταν δουλεύω. Δεν καταλαβαίνω τί φταίει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό που σου λείπει εσένα είναι η υπομονή. Και αιτία που δεν μπορείς να κάνης υπομονή είναι που καταπιάνεσαι με πολλά. Σκορπάς σε πολλές μεριές και κουράζεσαι. Αυτό και νευρικότητά σου δημιουργεί, γιατί έχεις και φιλότιμο και αγωνιάς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ήμουν στο Κοινόβιο, είχα έναν διακονητή στο μαραγκούδικο, τον Γερό-Ισίδωρο. Ο καημένος δεν είχε καθόλου υπομονή. Άρχιζε ένα παράθυρο, στενοχωριόταν, επίανε να κάνη πόρτες, στενοχωριόταν και τα άφηνε, επίανε να κάνη μετά στέγες. Όλα στην μέση τα άφηνε, χωρίς να τελειώνη τίποτε. Άλλα ξύλα χάνονταν, άλλα κόβονταν λάθος. Έτσι σκοτώνεται κανείς, χωρίς να κάνη τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι μερικοί πού, ενώ έχουν περιορισμένες δυνάμεις και μπορούν να κάνουν μόνον ένα-δύο πράγματα, καταπιάνονται και μπερδεύονται με πολλά και μετά δεν κάνουν τίποτε σωστό και σέρνουν και τους άλλους. Όσο μπορεί κανείς, να κάνη ένα-δυό πράγματα μόνο, να τα τελειώνη σωστά και να έχη το μυαλό του καθαρό και ξεκούραστο και μετά να αρχίζη κάτι άλλο. Γιατί, άμα ο νούς του σκορπίση, τί πνευματικά θα κάνη μετά; Πώς να θυμηθή τον Χριστό;
- type: h2
  initial:
    ru: ''
  text:
    ru: Μη δίνετε καρδιά στα υλικά πράγματα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, τί εννοείτε, όταν λέτε: «Πόδια, χέρια στην δουλειά να δίνετε, καρδιά να μη δίνετε»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εννοώ να μη δίνετε καρδιά στα υλικά πράγματα. Είναι μερικοί που δίνονται ολόκληροι στα υλικά. Περνούν όλη την ημέρα με το να ασχολούνται πώς θα κάνουν καλά μία δουλειά και δεν σκέφτονται καθόλου τον Θεό. Να μη φθάνουμε εκεί. Να χρησιμοποιήτε τα χέρια και τα πόδια στην δουλειά, αλλά να μην αφήνετε τον νού σας να ξεφύγη από τον Θεό. Να μη δίνετε όλο το είναι σας, όλο το δυναμισμό μαζί με την καρδιά σας, στα υλικά. Έτσι γίνεται μετά κανείς ειδωλολάτρης. Όσο μπορείτε στις δουλειές καρδιά να μη δίνετε, χέρια, μυαλό να δίνετε. Καρδιά να μη δίνετε σε χαμένα, σε άχρηστα πράγματα. Γιατί μετά πώς θα σκιρτήση η καρδιά για τον Χριστό; Όταν η καρδιά είναι στον Χριστό, τότε αγιάζονται και οι δουλειές, υπάρχει και η εσωτερική ψυχική ξεκούραση συνέχεια, και νιώθει κανείς την πραγματική χαρά. Να αξιοποιήτε την καρδιά σας, να μην την σπαταλάτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν σπαταληθή η καρδιά σε πολλά ασήμαντα, δεν έχει αντοχή να πονέση για εκείνο που πρέπει να πονέση. Εγώ θα δώσω καρδιά σε έναν καρκινοπαθή, σε έναν πονεμένο. Η αγωνία μου είναι για τα παιδιά που κινδυνεύουν. Κάνω τον σταυρό μου να τα δίνη ο Θεός φώτιση. Όταν πάλι έχω κόσμο, πάει η προσοχή μου στον πόνο του άλλου, στην αγάπη για τον άλλον. Τον πόνο τον δικό μου δεν τον καταλαβαίνω. Έτσι ξεχνιούνται όλα, παίρνει άλλη στροφή ο άνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σε όλες τις δουλειές γίνεται να μη δίνη κανείς νού και καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν η δουλειά είναι απλή, βοηθάει να μην απορροφάται ο νούς. Όταν όμως η δουλειά είναι σύνθετη, τότε δικαιολογείται να απορροφά λίγο τον νού, όχι όμως να παίρνη την καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Την καρδιά με τί μορφή την παίρνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με τί μορφή; Ο πειρασμός μέ... «μορφίνες» την ναρκώνει!!! Την καρδιά την παίρνει με τον εγωισμό. Αλλά όταν η καρδιά δοθή στον Θεό, τότε ο νούς θα είναι στον Θεό και το μυαλό στην δουλειά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν λέμε «αμέριμνο», τί εννοούμε ακριβώς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν δουλεύης, να μην ξεχνάς τον Χριστό. Να κάνης την δουλειά με χαρά, αλλά ο νούς και η καρδιά να είναι στον Χριστό. Τότε και δεν θα κουράζεσαι, και πνευματικά θα μπορής να κάνης.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η εργασία που γίνεται με ηρεμία και προσευχή αγιάζεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν είναι καλύτερα, Γέροντα, μία δουλειά να γίνη πιο αργά, για να έχει κανής την ηρεμία του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατί, όταν εργάζεται κανείς με ηρεμία, διατηρεί την γαλήνη του και αγιάζει όλη την ημέρα του. Δυστυχώς, δεν έχουμε καταλάβει πώς, όταν κάνουμε γρήγορα μία δουλειά, αποκτούμε μία νευρικότητα. Και η εργασία που γίνεται με νευρικότητα δεν είναι αγιασμένη. Σκοπός μας δεν πρέπει να είναι να φτιάξουμε πολλά και να είμαστε όλα αγωνία. Αυτό είναι δαιμονική κατάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το εργόχειρο που γίνεται με ηρεμία και προσευχή αγιάζεται και αγιάζει και τους ανθρώπους που το χρησιμοποιούν και έτσι έχει νόημα, όταν η λαϊκοί ζητούν να πάρουν εργόχειρα από μοναχούς για ευλογία. Ενώ εκείνο που γίνεται με βιασύνη και νευρικότητα μεταδίδει αυτήν την δαιμονική κατάσταση και στους άλλους. Η βιαστική δουλειά με την αγωνία είναι στοιχείο πολύ κοσμικών ανθρώπων. Οι ταραγμένες ψυχές που εργάζονται, ταραχή μεταδίδουν και με τα εργόχειρά τους και όχι ευλογία. Πώς επιδρά η κατάσταση του ανθρώπου και στα εργόχειρα που φτιάχνει, και στα ξύλα ακόμη! Φοβερό! Ανάλογο με την κατάσταση στην οποία βρίσκεται ο άνθρωπος όταν φτιάχνη κάτι, είναι και το αποτέλεσμα αν είναι νευριασμένος και θυμώνει και βρίζη, δεν θα έχη ευλογία αυτό που κάνη. Ενώ, αν ψάλλη, λέη την ευχή, αγιάζεται το έργο του. Το ένα είναι δαιμονικό, το άλλο θεϊκό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν κινήστε με ευλάβεια και εργάζεσθε με την προσευχή αγιάζεστε πάντοτε και τα πάντα αγιάζονται. Όταν έχη κανείς τον νού του στον Θεό, αγιάζει την δουλειά, το εργόχειρό του. Φερ' ειπείν, φτιάχνω ένα κουτί και λέω την ευχή, προσεύχομαι και συγχρόνως εργάζομαι προς δόξαν Θεού. Σκοπός μου δεν είναι να φτιάξω κουτιά και να κάνω γρήγορα, για να φτιάξω πολλά και να είμαι όλο αγωνία. Αυτό είναι δαιμονική κατάσταση. Δεν ήρθαμε γι' αυτό στο Μοναστήρι, ήρθαμε για να αγιασθούμε και να αγιάσουμε και ό,τι κάνουμε. Αυτός είναι ο λόγος που μερικές φορές νιώθεις σαν μία καλή υπάλληλος στα καθήκοντα, γιατί, όταν τρέχης να τακτοποιήσης τις δουλειές, ξεχνάς να παίρνης και τον Χριστό μαζί σου. Ενώ, αν ξεκινάς με την ευχή, θα νιώθης σαν διακονήτρια του Χριστού. Γι' αυτό βάλε και την ευχή στην δουλειά, για να αγιασθής και εσύ και η δουλειά. Ο Θεός ξέρεις πώς ευλογεί και πόσα αγαθά και τί ευλογίες στέλνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν η δουλειά είναι διανοητική, π.χ. μία μεταφραστική εργασία, πώς είναι δυνατόν να λές την ευχή, ώστε να αγιάζεται η εργασία που κάνεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν η δουλειά είναι διανοητική, αν ο νούς σου είναι στον Θεό, τότε η δουλειά αγιάζεται, γιατί ζής μέσα στην ατμόσφαιρα του Θεού, και ας μην μπορής να λές την ευχή. Όταν κανείς έχη πνευματική κατάσταση, πολύ βοηθιέται. Δεν προσπαθεί να καταλάβη τα νοήματα με το μυαλό, αλλά φωτίζεται και τα βρίσκει με θείο φωτισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν δεν έχω αυτήν την πνευματική κατάσταση και πρέπη να κάνω μία τέτοια εργασία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε θα την κάνης, αλλά να προσεύχεσαι, να ζητάς από τον Θεό να σε φωτίζη. Να κοιτάξης να βοηθηθής, όσο μπορείς, από τα θεία νοήματα και να δουλεύης με ευλάβεια. Να κάνης κάθε μία ώρα, κάθε δυο ώρες, λίγα λεπτά διακοπή και να λές την ευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ειδικά, Γέροντα, στην μεταφραστική εργασία έχεις πολλή περισπάση. Πρέπει να ψάξης λεξικά, να διαβάσης σχόλια...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχω πει και άλλες φορές, αυτό που βοηθάει βασικά στις μεταφράσεις είναι το βίωμα με τους εξαγνισμένους λογισμούς, που κάνουν τον άνθρωπο δοχείο της Χάριτος. Τότε οι θείες ερμηνείες βγαίνουν από τον θείο φωτισμό και όχι από το μυαλό, από το λεξικό και από το μελανοδοχείο. Θέλω να πω ότι στο πρώτο πρέπει να στηριχθή κανείς, το θείο, και όχι στο δεύτερο, το ανθρώπινο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την πολλή μέριμνα ξεχνάει κανείς τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η μέριμνα απομακρύνει πάντοτε από τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε να σού πώ: Ένα παιδάκι, όταν παίζη και είναι αφοσιωμένο στα παιχνίδια του, ούτε καν καταλαβαίνει, όταν ο πατέρας του είναι δίπλα και το χαϊδεύη. Λίγο αν διακόψη τα παιχνίδια του, τότε θα το καταλάβη. Έτσι και όταν έχουμε μέριμνα, δεν μπορούμε να καταλάβουμε την αγάπη του Θεού. Ο Θεός δίνει και δεν το αισθανόμαστε. Πρόσεξε να μη σπαταλάς τις πολύτιμες δυνάμεις σου σε περιττές μέριμνες και μάταια πράγματα που θα γίνουν όλα σκόνη μία μέρα. Τότε και σωματικά κουράζεσαι και τον νού σου σκορπάς άσκοπα και μετά δίνεις την κούρασή σου με τα χασμουρητά στον Θεό την ώρα της προσευχής, σαν την θυσία που έκανε ο Κάιν. Επόμενο είναι τότε και η εσωτερική σου κατάσταση να είναι κατάσταση «Κάιν», με άγχος και αναστεναγμούς που θα τα προκαλή το ταγκαλάκι που θα είναι δίπλα σου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να μη σπαταλάμε άσκοπα τον καρπό, την ψίχα, των δυνάμεών μας μένουν τα τσόφλια για τον Θεό. Η μέριμνα τραβάει όλο το μεδούλι της καρδιάς και δεν αφήνει τίποτε για τον Χριστό. Αν δής ότι ο νούς σου συνέχεια φεύγει και πάει σε δουλειές κ.λπ.. πρέπει να καταλάβης ότι δεν πάς καλά και να ανησυχήσης, γιατί έχεις απομακρυνθή από τον Θεό. Να καταλάβης ότι είσαι πιο κοντά στα πράγματα παρά στον Θεό, στην κτίση και όχι στον Κτίστη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολλές φορές, δυστυχώς, μία κοσμική ευχαρίστηση ξεγελάει ακόμη και τον μοναχό, όταν κάνη μία εργασία. Ο άνθρωπος, φυσικά, είναι πλασμένος να κάνη το καλό, γιατί και ο Δημιουργός του είναι καλός. Αλλά ο μοναχός αγωνίζεται από άνθρωπος να γίνη Άγγελος. Γι' αυτό η εργασία του για τα υλικά θα πρέπη να είναι περιορισμένη μόνο στα πιο απαραίτητα, για να εργάζεται στα πνευματικά. Τότε και η χαρά του θα προέρχεται από τους πνευματικούς καρπούς που θα παράγη, θα είναι πνευματική, και θα τρέφεται, αλλά και θα τρέφη πλουσιοπάροχα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με την πολλή δουλειά και μέριμνα ξεχνάει κανείς τον Θεό. Έλεγε χαρακτηριστικά ο Πάπα-Τύχων[96]: «Ο Φαραώ έδινε πολλή δουλειά και πολύ φαγητό στους Ισραηλίτες, για να ξεχάσουν τον Θεό». Στην εποχή μας ο διάβολος απορρόφησε τους ανθρώπους στην ύλη, στον περισπασμό, δουλειά πολλή, φαΐ πολύ, για να ξεχνούν τον Θεό[97], και έτσι να μην μπορούν –ή μάλλον να μη θέλουν – να αξιοποιήσουν την ελευθερία που τους δίνεται για τον αγιασμό της ψυχής. Ευτυχώς όμως, χωρίς να το θέλη ο διάβολος, βγαίνει και κάτι καλό, δεν ευκαιρούν οι άνθρωποι να αμαρτήσουν όσο θέλουν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πολλή δουλειά και μέριμνα κοσμικοποιούν τον μοναχό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλά είναι όποιος θέλει να ζήση πνευματικά, και ιδίως ο μοναχός, να βρίσκεται απομακρυσμένος από ορισμένες ασχολίες, φτιαξίματα κ.λπ., που τον απομακρύνουν από τον πνευματικό στόχο. Να μην ξανοίγεται με πολλές ατέλειωτες δουλειές, γιατί οι δουλειές δεν τελειώνουν. Και αν δεν μάθη να κάνη δουλειές εσωτερικές στον εαυτό του, θα ξεφεύγη στις εξωτερικές συνέχεια. Οι άνθρωποι που προσπαθούν να τελειώσουν τις δουλειές τις ατέλειωτες, τελειώνουν αυτήν την ζωή με ατέλειες πνευματικές και μετανοούν στο τέλος της ζωής τους, αλλά αυτό δεν τους βοηθάει πια σε τίποτε, γιατί έχει βγή το διαβατήριο. Άλλωστε και μία ανάπαυλα από τις δουλειές είναι απαραίτητη για ένα μικρό έστω διάστημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν οι πολλές εργασίες ελαττωθούν, φυσιολογικά θα έρθη η σωματική ξεκούραση και η δίψα για εσωτερική εργασία, η οποία δεν κουράζει, αλλά ξεκουράζει. Τότε και η ψυχή θα αναπνέη άφθονο πνευματικό οξυγόνο. Η κούραση από πνευματική εργασία δεν κουράζει, αλλά ξεκουράζει, γιατί ανεβάζει τον άνθρωπο ψηλά και τον πλησιάζει στον φιλόστοργο Πατέρα, όποτε και η ψυχή του αγάλλεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η σωματική κούραση, όταν δεν έχη νόημα πνευματικό, ή μάλλον όταν δεν προέρχεται από πνευματική ανάγκη, για να δικαιολογήται, αγριεύει τον άνθρωπο. Και το πιο ήμερο αλογάκι, όταν το πολυκουράση κανείς, αρχίζει να κλωτσάη καί, παρ' όλο που δεν είχε κακό χούι, αποκτάει αργότερα – ενώ, όσο μεγαλώνει, θα έπρεπε να γίνεται πιο φρόνιμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικά πράγματα μπορεί να παραλείπωνται, για να προηγούνται τα πνευματικά. Η πολλή δουλειά και η πολλή μέριμνα κοσμικοποιούν τον μοναχό και το αισθητήριό του γίνεται κοσμικό. Ζή πια σαν κοσμικός με όλο το άγχος και την κοσμική αγωνία, με λίγα λόγια ένα μέρος της κολάσεως ζη από τούτη την ζωή, με τις συνεχείς μέριμνες, ανησυχίες και συμφορές. Όταν ο μοναχός δεν μεριμνά για τα υλικά αλλά για την σωτηρία του και την σωτηρία όλων των ανθρώπων, κάνει τον Θεό οικονόμο του και τους ανθρώπους διακονητές του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάστε το περιστατικό με τον Όσιο Γερόντιο (3) και τον υποτακτικό του; ο Όσιος Γερόντιος είχε παρακαλέσει την Παναγία να του δώση λίγο νερό να πίνη αυτός και ο υποτακτικός του, και η Παναγία σαν καλή Μάνα άνοιξε μία ρωγμή στον τοίχο του Ασκητηρίου του και έβγαλε νερό, Αγίασμα, για να πίνουν. Αργότερα ο υποτακτικός του άρχισε να κτίζη πεζούλια, κουβάλησε χώμα, έκανε κήπους, μπήκε σε πολλή μέριμνα και παραμελούσε τα πνευματικά του. Επειδή το νερό δεν του έφθανε, πήρε μία σμίλη να ανοίξη την ρωγμή να βγαίνη περισσότερο νερό. Η Παναγία τότε πήρε εκείνο το νερό πίσω και το έβγαλε πολύ χαμηλά από το Ασκητήριο και του είπε: «Εάν θέλης κήπους και περισπασμό, να κουβαλάς νερό από μακριά».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όπου πολύς περισπασμός, εκεί πολλά πνευματικά παράσιτα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν στενοχωριόσασταν, όταν ύστερα από τόσο κόπο που καταβάλατε, για να φτιάξετε ένα Κελλί, το αφήνατε και πηγαίνατε αλλού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να φύγω, κάποιος σοβαρός λόγος θα υπήρχε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και παντού κάνατε μόνον τα απαραίτητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, έκανα μόνον τα απαραίτητα για εδώ, για να μπορώ να κάνω τα απαραίτητα για πάνω, για τον Ουρανό. Αν χαθής με τα επίγεια, χάνεις τον δρόμο σου για τον Ουρανό. Κάνεις το ένα, μετά θέλεις και το άλλο. Και αν μπής σ́ αυτό το γρανάζι, χάθηκες! Αν χαθής με τα επίγεια, χάνεις τα ουράνια. Όπως τα ουράνια δεν έχουν τελειωμό, έτσι και τα επίγεια δεν έχουν τελειωμό. Ή θα χαθής εδώ ή θά... «χαθής» εκεί. Ξέρεις τί είναι να «χάνεσαι» εκεί πάνω! Ώ, έλεγα την ευχή και βυθιζόμουν! Βυθίσθηκες καμμιά φορά στην ευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η πολλή δουλειά με την κόπωσή της και τον περισπασμό, ιδίως όταν γίνεται με βιασύνη, δεν βοηθάει. Παραμερίζει την νήψη και αγριεύει την ψυχή. Δεν μπορεί όχι μόνο να προσευχηθή κανείς, αλλά ούτε να σκεφθή. Δεν μπορεί να ενεργήση με σύνεση, και έτσι οι ενέργειές του δεν είναι σωστές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι' αυτό προσέξτε, μη σπαταλάτε τον χρόνο σάς άσκοπα, χωρίς να τον αξιοποιήτε στα πνευματικά, γιατί θα φθάσετε σε σημείο να αγριέψετε πολύ και να μην μπορήτε πλέον να κάνετε πνευματικά. Θα θέλετε να ασχολήσθε με δουλειές ή να συζητάτε ή θα επιδιώκετε να υπάρχουν θέματα, για να βρίσκεσθε σε δουλειά. Με την παράλειψη της ευχής και των πνευματικών καθηκόντων ο εχθρός καταλαμβάνει τα πνευματικά μας υψώματα και μας πολεμάει και με την σάρκα και με λογισμούς.Μας αχρηστεύει όλες τις δυνάμεις, τις ψυχικές και σωματικές, και κόβει την επικοινωνία μας με τον Θεό, όποτε είναι επόμενο να αιχμαλωτισθή η ψυχή μας στα πάθη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Πάπα-Τύχων έλεγε στους μοναχούς ότι πρέπει να ζουν ασκητικά, για να ελευθερωθούν από τις μέριμνες, και όχι να δουλεύουν σαν εργάτες και να τρώνε σαν κοσμικοί. Γιατί το έργο του μοναχού είναι οι μετάνοιες, οι νηστείες, οι προσευχές όχι μόνο για τον εαυτό του αλλά και για όλον τον κόσμο, ζωντανούς και πεθαμένους, και λίγη δουλειά για τα απαραίτητα, για να μην επιβαρύνη τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο περισπασμός πάντοτε είναι εμπόδιο στην πνευματική ζωή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν ασχολήσαι με τα απαραίτητά της υπακοής[98], και περισπασμό να έχης, δεν θα πάθης ζημιά. Εάν το ενδιαφέρον σου για το διακόνημα που σου αναθέτουν ή για να βοηθήσης μία αδελφή δεν ξεπεράση τα όρια, η λαχτάρα θα είναι για την ευχή και η βοήθειά σου θα είναι θετική. Όταν όμως μόνος του κανείς ξεπερνάη τα όρια και προσθέτη περισπασμό και ασχολήται με χαμένα πράγματα, τότε σκορπάει ο νούς και φεύγει από τον Θεό. Και όταν ο νούς δεν είναι στον Θεό, πώς θα νιώση κανείς την χαρά του Θεού; Η καρδιά εύκολα παγώνει. Και εγώ, όταν όλη την ημέρα έχω κόσμο, αν και είναι πνευματικό το έργο, όταν το βράδυ πάω να προσευχηθώ, δεν είναι η καρδιά μου όπως όταν προσεύχωμαι όλη την ημέρα. Γεμίζει το μυαλό με ένα σωρό πράγματα και είναι δύσκολο να τα αποβάλη κανείς. Όσο μπορείς να λές την ευχή μέσα στην ημέρα και να σιγοψάλλης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ βοηθάει και η λίγη πνευματική μελέτη, ιδίως πριν από την προσευχή. Πολύ θερμαίνει την ψυχή και σκορπάει τις μέριμνες της ημέρας, και τότε, με ελευθερωμένη την ψυχή και μεταφερμένη στην πνευματική θεία ατμόσφαιρα, κινείται απερίσπαστα ο νούς. Με ένα κομματάκι από το Ευαγγέλιο ή από το Γεροντικό που έχει μικρά κομματάκια αλλά δυνατά, ο νούς μεταφέρεται σε πνευματικό χώρο και δεν φεύγει πιά. Γιατί ο νούς είναι σαν ένα ζωηρό παιδί που τρέχει πότε από 'δω, πότε από 'κει. Άμα όμως το γλυκάνης με καμμιά καραμέλλα, δεν φεύγει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Το απερίσπαστο και το αμέριμνο φέρνουν την εσωτερική ησυχία και την πνευματική επιτυχία. Οι μέριμνες απομακρύνουν από τον Θεό. Όταν υπάρχη πολύς περισπασμός, υπάρχουν πολλά πνευματικά παράσιτα και οι πνευματικοί ασύρματοι δεν εργάζονται με σήματα καλά. Ο μοναχός είναι αδικαιολόγητος να μην κάνη πνευματική ζωή. Οι καημένοι οι λαϊκοί έχουν ένα σωρό φροντίδες, και πάλι κάνουν προσπάθεια. Ο μοναχός δεν έχει τις φροντίδες που έχουν εκείνοι. Ούτε για ενοίκια σκέφτεται ούτε για χρέη ούτε αν έχη ή δεν έχη δουλειά. Και τον Πνευματικό του κοντά τον έχει και την Εκκλησία μέσα στο Μοναστήρι, προσευχές, Ευχέλαια, Παρακλήσεις, Λειτουργίες. Έχει το αμέριμνο και κοιτάει πώς να γίνει άγγελος, δεν έχει άλλο σκοπό. Ενώ ο λαϊκός έχει τόσες φροντίδες! Κοιτάει πώς να αναθρέψη τα παιδιά του κ.λπ. και αγωνίζεται παράλληλα και για την σωτηρία της ψυχής του. Έλεγε ο Γερό-Τρύφων[99]: «Ο μοναχός θέλει αγρυπνία; Μπορεί. Θέλει νηστεία; Μπορεί. Ούτε γυναίκα ούτε παιδιά έχει. Ο κοσμικός δεν μπορεί. Έχει παιδιά... Το ένα θέλει παπούτσια, το άλλο θέλει ρούχα, το άλλο θέλει...».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αποκτήσουμε την καλή μέριμνα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να ζητούμε πρώτα την Βασιλεία των Ουρανών και αυτή να είναι η μέριμνά μας, και όλα τα άλλα θα μας δοθούν[100]. Άμα ξεχνιέται ο άνθρωπος σ΄ αυτήν την ζωή, χάνει τον καιρό του και χαραμίζεται. Άμα δεν ξεχνιέται και ετοιμάζεται για την άλλη ζωή, τότε έχει νόημα αυτή η ζωή. Όταν ο άνθρωπος σκέφτεται πώς να βολευτή εδώ, βασανισμένος είναι, και κουράζεται και κολάζεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να μη σάς πιάνη αγωνία και μανία: «Τώρα πρέπει να κάνουμε αυτό, ύστερα εκείνο», γιατί θα σάς βρη σε τέτοια κατάσταση ο Αρμαγεδών[101]. Και μόνον η αγωνία στο φτιάξιμο είναι δαιμονικό. Γυρίστε το κουμπί στον Χριστό, γιατί διαφορετικά θα ζήτε δήθεν κοντά στον Χριστό, αλλά εσωτερικά θα υπάρχει όλο το κοσμικό φρόνημα, και φοβάμαι μην το πάθετε σαν τις μωρές παρθένες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι φρόνιμες παρθένες[102]δεν είχαν μόνον καλωσύνη, είχαν και την καλή μέριμνα, είχαν εγρήγορση, δεν είχαν αδιαφορία. Οι μωρές παρθένες είχαν αδιαφορία, δεν είχαν εγρήγορση. Γι’ αυτό ο Κύριος είπε:«Γρηγορείτε»[103]. Ήταν παρθένες αλλά μωρές. Και αν μία είναι εκ γενετής μωρή, είναι ευλογία από τον Θεό Γι’ αυτήν. Πάει δίχως εξετάσεις στην άλλη ζωή. Μία όμως που έχει μυαλό και ζη μωρά, αυτή θα είναι αναπολόγητη την ημέρα της Κρίσεως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπετε και στην περίπτωση της Μάρθας και της Μαρίας που αναφέρει το Ευαγγέλιο, πώς η μέριμνα έκανε την Μάρθα να φερθή κατά κάποιον τρόπο με αναίδεια; Φαίνεται ότι στην αρχή και η Μαρία την βοηθούσε, αλλά, όταν είδα να μην τελειώνη τις ετοιμασίες της, την άφησε και έφυγε. «Τί, θα χάσω εγώ τον Χριστό μου για τις σαλάτες και τα γλυκά;», σκέφθηκε. Λές και ο Χριστός είχε πάει να φάη τις σαλάτες και τα φαγητά της Μάρθας. Και τότε η Μάρθα πειράχθηκε και είπε:«Κύριε, ου μέλλει σοί ότι η αδελφή μου μόνην με κατέλιπε διακονείν;»[104].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ας προσέξουμε να μην πάθουμε και εμείς σαν την Μάρθα. Ας ευχηθούμε να γίνουμε καλές «Μαρίες».
- type: h2
  initial:
    ru: ''
  text:
    ru: Τριτο Μεροσ – Το πνεύμα του Θεού και το πνεύμα του κόσμου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Η εσωτερική καθαρότητα του αληθινού ανθρώπου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ομορφαίνει και το εξωτερικό του ανθρώπου».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η κοσμική μόρφωση και γνώση
- type: h2
  initial:
    ru: ''
  text:
    ru: Έξυπνος είναι ο εξαγνισμένος άνθρωπος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος δεν τροχίζη το μυαλό με το Θείο, αλλά το τροχίζη με την πονηριά, παραδίνει τον εαυτό του στον διάβολο. Καλύτερα να το είχε χάσει το μυαλό, για να έχη ελαφρυντικά την ημέρα της Κρίσεως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, διαφέρει η απλότητα από την πονηριά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, όσο η αλεπού από το τσακάλι. Το τσακάλι, αν δη κάτι και το θέλη, με λεβεντιά θα πάη να το πάρη. Ενώ η αλεπού θα κάνη πονηριές και μετά θα πάη να το πάρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να θεωρή κανείς την πονηριά για εξυπνάδα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, μπορεί, αλλά, αν εξετάζη τον εαυτό του, θα καταλάβη τί είναι πονηριά και τί εξυπνάδα. Έχει τον πίνακα αναγνωρίσεως. Ποιά είναι τα χαρίσματα του Αγίου Πνεύματος; αγάπη, χαρά, ειρήνη κ.λπ.[105]Έχει συγγένεια μ΄ αυτά; Αν δεν συγγενεύη μ΄ αυτά, θα έχη κάτι το σατανικό, θα έχη γνωρίσματα του ταγκαλακιού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έξυπνος είναι ο εξαγνισμένος άνθρωπος, ο καθαρισμένος από τα πάθη. Αυτός που έχει αγιάσει και το μυαλό του, αυτός είναι ο πραγματικά έξυπνος. Άμα δεν αγιασθή το μυαλό, η εξυπνάδα δεν ωφελεί σε τίποτε. Νά, οι δημοσιογράφοι, οι πολιτικοί, έξυπνοι είναι, αλλά πολλοί από αυτούς, επειδή δεν έχουν αγιασμένο το μυαλό τους, εκεί που λένε εξυπνάδες, λένε και ανοησίες. Από την πολλή εξυπνάδα λένε μεγάλες ανοησίες! Αν δεν αξιοποιήση ο άνθρωπος το μυαλό, το εκμεταλλεύεται ο διάβολος. Αν δεν αξιοποιήση την εξυπνάδα για το καλό, την χρησιμοποιεί ο διάβολος για το κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, επειδή δεν αξιοποίησε την εξυπνάδα, δίνει και δικαίωμα στον διάβολο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άμα δεν την αξιοποιή, ήδη τα δικαιώματα δίνονται μόνα τους. Όταν ο άνθρωπος δεν εργάζεται πνευματικά, αλλοιώνει το καλό και κάνει ο ίδιος το κακό, δεν είναι ότι ο διάβολος το κάνει. Ένας λ.χ. είναι έξυπνος, αλλά δεν το δουλεύει το μυαλό του και τεμπελιάζει. Όταν δεν χρησιμοποιή το μυαλό του, σε τί τον ωφελεί η εξυπνάδα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί ένας άνθρωπος που είναι έξυπνος, αλλά έχει πάθη, να έχη σωστή κρίση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάτ΄ αρχάς να προσέξη να μην πιστεύη στο μυαλό του, γιατί, αν είναι πνευματικός άνθρωπος, θα πλανηθή καί, αν είναι κοσμικός, θα τρελλαθή. Να μην πιστεύη στον λογισμό του. Να ρωτάη, να συμβουλεύεται, να αγιάση την εξυπνάδα του. Και γενικά όλα όσα έχει ο άνθρωπος, όλα να τα αγιάζη. Όταν η εξυπνάδα αγιασθή, βοηθάει να αποκτήση κανείς την διάκριση. Ένας έξυπνος, αν δεν αγιασθή, δεν έχει πνευματική διάκριση. Ένας πάλι από την φύση του απλός μπορεί έναν πλανεμένο να τον πάρη για άγιο και έναν θηλυπρεπή να τον πάρη για ευλαβή. Ενώ, όταν εξαγνισθή ο έξυπνος, γίνεται πολύ διακριτικός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς εξαγνίζεται η εξυπνάδα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να εξαγνισθή, δεν πρέπει ο άνθρωπος να δέχεται τα τηλεγραφήματα του πονηρού ούτε και να σκέφτεται πονηρά, αλλά να ενεργή όλο με καλωσύνη και απλότητα. Έτσι έρχεται η διαύγεια η πνευματική, ο θείος φωτισμός, και τότε ο άνθρωπος βλέπει καρδιές ανθρώπων και δεν βγάζει ανθρώπινα συμπεράσματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η διάκριση έχει σχέση με την γνώση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η διάκριση έρχεται από τον θείο φωτισμό. Ένας μπορεί να διαβάζη Πατέρες, να γνωρίζη σωστά ορισμένα πράγματα, να αγωνίζεται και να προσεύχεται. Η διάκριση όμως έρχεται με τον θείο φωτισμό, που είναι άλλο πράγμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Παλιά, Γέροντα, ήταν καλύτερος ο κόσμος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι πώς ήταν καλύτερος, μόνον που οι παλαιοί άνθρωποι είχαν την απλότητα και τον καλό λογισμό. Σήμερα οι άνθρωποι τα βλέπουν όλα με πονηριά, γιατί τα μετρούν όλα μόνο με το μυαλό. Το ευρωπαϊκό πνεύμα πολύ κακό έκανε. Αυτό είναι που σακάτεψε τους ανθρώπους. Οι άνθρωποι τώρα θα ήταν σε πολύ καλή πνευματική κατάσταση, γιατί οι πιο πολλοί λίγο-πολύ είναι μορφωμένοι, και θα μπορούσες να συνεννοηθής. Αλλά τους δίδαξαν την αθεΐα, όλα αυτά  τα σατανικά, όποτε τους αχρήστεψαν και δεν μπορείς να συνεννοηθής. Παλιά δεν μπορούσες να συνεννοηθής με κάποιον, αν δεν είχε ευλάβεια, δεν είχε και μόρφωση. Θυμάμαι, ένας καλόγερος μία φορά, όταν άκουσε στην Προηγιασμένη να μνημονεύουν «Γρηγορίου, Πάπα Ρώμης»[106], νόμιζε ότι μνημόνευαν τον Πάπα της Ρώμης και σκανδαλίσθηκε. «Δεν το περίμενα, είπε. Παπιστές γινήκατε!», και σηκώθηκε και έφυγε από την Εκκλησία! Νά, βλέπεις τί κάνει η άγνοια! Η άγνοια είναι φοβερό. Το μεγαλύτερο κακό κάνουν αυτοί που έχουν ευλάβεια και βλάβη μαζί. Χωρίς να εξετάζουν, δημιουργούν προβλήματα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η γνώση δίχως θείο φωτισμό είναι καταστροφή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εάν οι άνθρωποι την ταχύτητα του μυαλού τους την φρενάρανε λίγο, και το μυαλό τους θα ήταν ξεκούραστο, αλλά και η θεία Χάρις θα τους πλησίαζε εύκολα. Η γνώση δίχως φωτισμό είναι καταστροφή. Όταν κανείς κάνη πνευματική δουλειά στον εαυτό του, όταν αγωνίζεται, τότε φωτίζεται από τον Θεό. Έχει θείο φωτισμό, θείες εμπειρίες, και όχι δικές του σκέψεις, Γι’ αυτό και βλέπει μακριά. Ένας που έχει μυωπία, από κοντά βλέπει τα πράγματα καλά, αλλά μακριά δεν βλέπει. Και ένας που δεν έχει μυωπία, έ, το πολύ-πολύ θα δη λίγο μακρύτερα, αλλά και αυτό δεν λέει τίποτε. Τα σωματικά μάτια είναι δύο, τα πνευματικά είναι πολλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι απομακρύνονται από τον Χριστό, στερούνται τον θείο φωτισμό, γιατί αφήνουν το προσήλιο σαν τους ανόητους και πηγαίνουν στο ανήλιο. Έτσι είναι επόμενο να είναι κρυολογημένοι και αρρωστημένοι πνευματικά. Αν δεν εξαγνισθή ο άνθρωπος, αν δεν έρθη ο θείος φωτισμός, όσο σωστή και αν είναι η άλλη γνώση –αυτό βλέπω – είναι ένας ορθολογισμό και τίποτε παραπάνω. Και αν λείψη ο θείος φωτισμός, και αυτά  που θα πούν και θα γράψουν, δεν θα βοηθήσουν. Βλέπετε το Ψαλτήρι που είναι γραμμένο με θείο φωτισμό, τί βαθιά νοήματα έχει! Μάζεψε, αν θέλης, όλους τους θεολόγους, όλους τους φιλολόγους, και θα δής ότι έναν ψαλμό με τέτοιο βάθος δεν μπορούν να φτιάξουν! Ενώ ο Δαβίδ ήταν αγράμματος, αλλά βλέπεις καθαρά πώς τον οδηγούσε το πνεύμα του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και η Εκκλησία σήμερα ταλαιπωρείται, γιατί λείπει ο θείος φωτισμός και καθένας πιάνει τα πράγματα όπως θέλει. Μπαίνει και το ανθρώπινο στοιχείο και δημιουργούνται πάθη και αλωνίζει μετά ο διάβολος. Γι’ αυτό δεν θα πρέπη να ζητούν εξουσία οι άνθρωποι που εξουσιάζονται από τα πάθη τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, πρέπει να ζητούν επίμονα τον θείο φωτισμό οι άνθρωποι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατί αλλιώς οι λύσεις που δίνουν είναι ενέργεια του μυαλού. Δημιουργείται σύγχυση μετά. Συνέδρια, παρασυνέδρια… Και το κακό είναι ότι δεν έχουν γνωρίσει προηγουμένως τον εαυτό τους. Γιατί, όσο αξίζει η μία γνώση του εαυτού μας, δεν αξίζουν όλου του κόσμου οι γνώσεις. Όταν ο άνθρωπος αναγνωρίζη ταπεινά τον εαυτό του, αναγνωρίζεται από τους ανθρώπους. Αν μερικοί γνώριζαν τον εαυτό τους, θα έβλεπαν τα χάλια τους και δεν θα μιλούσαν καθόλου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μία φορά μου είπε κάποιος: «Δεν υπάρχει κανένας Ορθόδοξος να εκπροσωπήση στο εξωτερικό την Ορθοδοξία, στα συνέδρια κ.λπ.». Έλεγε, έλεγε, έλεγε, έφερε τον αποκλεισμό. «Ο Προφήτης Ηλίας[107], του λέω, όταν τον ρώτησε ο Θεός: «Τί ζητάς, Ηλία, στο Χωρήβ;».«Έμεινα μόνος», απάντησε. Τότε ο Θεός του είπε: «Επτά χιλιάδες λαός δεν έκλινε γόνυ στον Βάαλ». Επτά χιλιάδες άνθρωποι ήταν πιστοί, και ο Προφήτης Ηλίας έλεγε: «Έμεινα μόνος!», και εσύ φέρνεις τέτοιον αποκλεισμό, ενώ υπάρχουν τόσοι πιστοί!... Τί είναι ο δικός μας ο Παντοκράτορας; Είναι σαν τον Παντοκράτορα του τρούλλου που παρουσιάζει ρωγμές από τον σεισμό και σκεφτόμαστε τί να κάνουμε για να τον κρατήσουμε, για να μην πέση, και καλούμε την Αρχαιολογική Υπηρεσία, για να τον υποστυλώσουμε;». «Εκεί στην Αμερική, μου λέει, δεν υπάρχει κανένας». «Μά εγώ τόσους πιστούς γνώρισα άπ΄ την Αμερική», του λέω. «Ναί, αλλά οι Καθολικοί, μου λέει, εργάζονται πονηρά». «Μά οι Καθολικοί, του λέω, σιχάθηκαν τον Παπισμό και επιστρέφουν τώρα στην Ορθοδοξία. Καλά, όταν πήγε ο Πατριάρχης Δημήτριος στην Αμερική, οι ίδιοι οι Καθολικοί δεν φώναζαν: «Ο Πατριάρχης είναι αληθινός Χριστιανός και ο Πάπας είναι έμπορας»; Δεν το έλεγαν με αγανάκτηση αυτό οι Καθολικοί; Τί μου λές ότι πάνε με πονηριά οι Καθολικοί να εισχωρήσουν στην Ορθοδοξία, για να την αλλοιώσουν κ.λπ.; Ο Θεός που είναι; Ο διάβολος μπορεί να κάνη προκοπή;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δυστυχώς ο δυτικός ορθολογισμός έχει επιδράσει και σε ανατολικούς ορθόδοξους άρχοντες και έτσι βρίσκονται σωματικά μόνον στην Ανατολική Ορθόδοξη Εκκλησία του Χριστού, ενώ όλο το είναι τους βρίσκεται στην Δύση που την βλέπουν να βασιλεύη κοσμικά. Εάν έβλεπαν την Δύση πνευματικά, με το φως της Ανατολής, με το φως του Χριστού, τότε θα έβλεπαν το πνευματικό ηλιοβασίλεμα της Δύσης, που χάνει σιγά-σιγά το φως του νοητού Ηλίου, του Χριστού, και προχωρεί για το βαθύ σκοτάδι. Μαζεύονται και συνεδριάζουν[108]και κάνουν συζητήσεις ατέλειωτες για πράγματα που δεν χωράει συζήτηση, που ούτε οι Άγιοι Πατέρες συζήτησαν εδώ και τόσα χρόνια. Όλες αυτές οι ενέργειες είναι του πονηρού, για να ζαλίζουν και να σκανδαλίζουν τους πιστούς και να τους σπρώχνουν άλλους στην αίρεση και άλλους σε σχίσματα, και να κερδίζη έδαφος ο διάβολος. Πά, πά… βασανίζουν και μπερδεύουν τον κόσμο αυτοί οι άνθρωποι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και όλα αυτά  από που ξεκινούν; Δεν κάνει κανείς δουλειά πνευματική, έχει τον λογισμό ότι είναι πνευματικός άνθρωπος και λέει μετά ανοησίες. Ένα παιδί με την φυσική καθαρότητα του νού και με την λίγη γνώση που έχει, θα σού πη σωστά πράγματα. Αντίθετα ένας με μεγάλη μόρφωση, με το μυαλό του καπνισμένο από την δαιμονική επήρεια που έχει λάβει, σού λέει τα πιο βλάσφημα πράγματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος τροχάει συνέχεια με γνώσεις το μυαλό του και ζη απομακρυσμένος από τον Θεό, το κάνει τελικά δίκοπο, και με το ένα μέρος σφάζεται σιγά-σιγά  ο ίδιος και με το άλλο κόβει ανθρώπους με τις απόλυτες ανθρώπινες εγκεφαλικές λύσεις του. Η ανθρώπινη γνώση, όταν αγιασθή, γίνη θεία, τότε βοηθάει. Διαφορετικά είναι ανθρώπινη αντιμετώπιση, μυαλό, κοσμική λογική. Το σκέτο μυαλό είναι μπαστούνι σιδερένιο, δίχως μαγνήτη, που χτυπάει τα μέταλλα, για να κολλήσουν, και αυτά  τσαλακώνονται και δεν κολλούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτός είναι ο σημερινός κόσμος. Όλα τα πράγματα τα βλέπουν με την ξερή λογική. Αυτή η λογική είναι καταστροφή.«Η γνώσις φυσιοί»[109]δεν λέει; Άμα δεν έχη θείο φωτισμό κανείς, η γνώση είναι άχρηστη, φέρνει καταστροφή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αξιοποιηθή η επιστήμη στην πνευματική ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλο το κακό ξεκινάει από το μυαλό, όταν γυρίζη μόνο γύρω από την επιστήμη και είναι τελείως απομακρυσμένο από τον Θεό. Γι’ αυτό και δεν βρίσκουν αυτοί οι άνθρωποι την εσωτερική τους ειρήνη και την ισορροπία τους. Ενώ, όταν ο νούς γυρίζη γύρω από τον Θεό, χρησιμοποιούν οι άνθρωποι και την επιστήμη για την εσωτερική τους καλλιέργεια και για το καλό του κόσμου, γιατί τότε είναι αγιασμένο το μυαλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, η επιστήμη δεν βοηθάει τον άνθρωπο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η επιστήμη πολύ βοηθάει, αλλά και πολύ θολώνει. Γνώρισα ψυχές με μεγαλύτερη διαύγεια, ενώ έχουν μάθει λιγώτερα. Όσοι έχουν θολώσει το μυαλό τους από την επιστήμη, εάν με την Χάρη του Θεού ξεθολώσουν, τότε, φυσικά, θα έχουν περισσότερα εργαλεία για δουλειά. Ενώ, όταν δεν αγιασθούν τα εργαλεία – δεν αγιασθή η γνώση –, μπορούν να χρησιμοποιηθούν μόνο για κοσμική εργασία και όχι για πνευματική. Γρήγορα αγιάζονται, αν μπή η καλή ανησυχία. Όσοι δίνουν τα πρωτεία στην εσωτερική τους μόρφωση, την μόρφωση της ψυχής, και χρησιμοποιούν και την εξωτερική μόρφωση για την εσωτερική, αυτοί γρήγορα μεταμορφώνονται πνευματικά. Εάν ασκούνται και πνευματικά, τότε βοηθούν πολύ κόσμο θετικά, γιατί βγάζουν τον κόσμο από το άγχος της κολάσεως και τον οδηγούν στην παραδεισένια αγαλλίαση. Μπορεί αυτοί οι άνθρωποι του Θεού πολλές φορές να έχουν λιγώτερα πτυχία, αλλά βοηθούν περισσότερο, γιατί έχουν πολλή Χάρη και όχι πολλά χαρτιά (πτυχία). Ο κόσμος γέμισε από αμαρτία και χρειάζεται πολλή προσευχή και βίωμα. Τα πολλά γραφτά είναι χάρτινα νομίσματα και η αξία τους θα εξαρτηθή από το αντικρυσμα. Επομένως θέλει δουλειά στο «μεταλλείο»τής ψυχής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι, ήταν ένα γεροντάκι στην Μονή Εσφιγμένου τόσο απλό που και την Ανάληψη την νόμιζε για Αγία. Έκανε κομποσχοίνι και έλεγε: «Αγία του Θεού, πρέσβευε υπέρ ημών»! Κάποτε ένας αδελφός στο γηροκομείο ήταν άρρωστος, και δεν είχε τί να του δώση να φάη. Μία και δυο κατεβαίνει τις σκάλες, ανοίγει το παράθυρο που έβλεπε προς την θάλασσα, απλώνει τα χέρια στην θάλασσα και λέει: «Αγία μου Ανάληψη, δώσ΄ μου ένα ψαράκι για τον αδελφό». Και αμέσως – ω του θαύματος! – ένα τόσο μεγάλο ψάρι ξεπηδάει από την θάλασσα μέσα στα χέρια του. Οι άλλοι που τον είδαν, έμειναν έκπληκτοι. Εκείνος τους κοιτούσε και χαμογελούσε, σαν να τους έλεγε: «Τί παράξενο βλέπετε;». Εμείς έχουμε γνώσεις, ξέρουμε πότε γιορτάζει ο ένας ο Άγιος, πώς μαρτύρησε ο άλλος, πότε έγινε η Ανάληψη και που έγινε και πώς έγινε, και όμως ούτε ένα τόσο δά ψαράκι δεν μπορούμε να έχουμε! Αυτά  είναι τα παράξενά της πνευματικής ζωής, τα οποία η λογική όσων διανοουμένων έχουν μέσα τους τον εαυτό τους και όχι τον Θεό δεν τα συλλαμβάνει, γιατί έχουν την στείρα κοσμική γνώση με την κοσμική πνευματική αρρώστια και λείπει το Άγιο Πνεύμα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το Άγιο Πνεύμα δεν κατεβαίνει με μηχανές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο λόγος του μυαλού αλλοίωση δεν κάνει στις ψυχές, γιατί είναι σάρκα. Ο λόγος του Θεού που γεννιέται από το Άγιο Πνεύμα έχει την θεία ενέργεια και αλλοιώνει τις ψυχές. Το Άγιο Πνεύμα δεν κατεβαίνει με μηχανές, Γι’ αυτό η Θεολογία δεν έχει καμμιά δουλειά με το στείρο επιστημονικό πνεύμα. Το Άγιο Πνεύμα κατεβαίνει μόνο Του, όταν βρη τις πνευματικές προϋποθέσεις στον άνθρωπο. Πνευματική προϋπόθεση είναι να ξεσκουριάση ο άνθρωπος τα πνευματικά του καλώδια, να γίνη καλός αγωγός, για να δεχθή το πνευματικό ρεύμα του θείου φωτισμού, και έτσι γίνεται πνευματικός επιστήμων, θεολόγος. Όταν λέω «θεολόγος», εννοώ αυτούς τους θεολόγους που έχουν αντικρυσμα θεολογικό και το πτυχίο τους έχει αξία, και όχι αυτούς που έχουν μόνο χαρτί χωρίς αντικρυσμα και το πτυχίο τους είναι όμοιο με τα χρήματα της Κατοχής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το μυαλό κουράζεται πολλές φορές χρόνια ολόκληρα, για να μάθη μία-δυό ξένες γλώσσες, και στην εποχή μας ξέρουν σχεδόν οι περισσότεροι άνθρωποι ξένες γλώσσες, αλλά επειδή αυτές οι γλώσσες δεν έχουν καμμιά σχέση με τις γλώσσες της Αγίας Πεντηκοστής, ζούμε την μεγαλύτερη Βαβυλωνία. Μεγάλο κακό είναι όταν θεολογούμε ξερά με το μυαλό μας και το μυαλό μας το παρουσιάζουμε για Άγιο Πνεύμα. Αυτό λέγεται εγκεφαλολογία, η οποία γεννάει Βαβυλωνία, ενώ στην Θεολογία υπάρχουν μεν πολλές γλώσσες, πολλά χαρίσματα, αλλά όλες οι γλώσσες συμφωνούν, γιατί ένα είναι το Αφεντικό τους, το Άγιο Πνεύμα της Πεντηκοστής, και οι γλώσσες είναι πύρινες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, λέει το τροπάριο ότι το Άγιο Πνεύμα«πάντα χορηγεί…»[110].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, χορηγεί, αλλά εκεί που χωράει. Άμα δεν χωράη, πώς να χορηγήση; Μεγαλύτερη αξία έχει ένας λόγος ταπεινού ανθρώπου με βιώματα, που βγαίνει με πόνο από τα βάθη της καρδιάς του, παρά ένας σωρός φιλολογίες εξωτερικού ανθρώπου, που βγαίνουν με ταχύτητα από την εκπαιδευμένη του γλώσσα, η οποία δεν πληροφορεί τις ψυχές, γιατί είναι σάρκα και όχι πύρινη γλώσσα της Αγίας Πεντηκοστής.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αγιάσουμε την γνώση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Καλή είναι η γνώση, καλή είναι και η μόρφωση, αλλά, αν δεν αγιασθούν, είναι χαμένα πράγματα και οδηγούν στην καταστροφή. Ήρθαν μία φορά στο Καλύβι μερικοί φοιτητές φορτωμένοι με βιβλία και μου λένε: «Ήρθαμε, Γέροντα, να συζητήσουμε για την Παλαιά Διαθήκη. Ο Θεός δεν επιτρέπει την γνώση;». «Ποιά γνώση, τους λέω, αυτή που αποκτιέται με το μυαλό;». «Ναί», μου λένε. «Μά αυτή η γνώση, τους λέω, σε πάει μέχρι το φεγγάρι, δεν σε ανεβάζει στον Θεό». Καλές είναι οι εγκεφαλικές δυνάμεις που ανεβάζουν τον άνθρωπο στην σελήνη, με δισεκατομμύρια έξοδα καυσίμων κ.λπ., αλλά καλύτερες είναι οι πνευματικές δυνάμεις, που ανεβάζουν τον άνθρωπο στον Θεό, που είναι και ο προορισμός του, και με λίγα καύσιμα, με ένα παξιμάδι. Ρώτησα μία φορά έναν Αμερικάνο που ήρθε στο Καλύβι: «Τί κατόρθωμα κάνατε σαν έθνος μεγάλο που είστε;». «Πήγαμε στο φεγγάρι», μου απάντησε. «Πόσο μακριά είναι;», τον ρωτάω. «Ας πούμε, μισό εκατομμύριο χιλιόμετρα», μου λέει. «Πόσα εκατομμύρια ξοδέψατε, για να πάτε στο φεγγάρι;». «Από το 1950 μέχρι τώρα, μου λέει, έχουμε ξοδέψει ποταμούς δολλαρίων». «Στον Θεό πήγατε; τον ρωτάω. Πόσο μακριά είναι ο Θεός;». «Ο Θεός, μου λέει, είναι πολύ μακριά». «Εμείς όμως, του λέω, μ΄ ένα παξιμάδι πάμε στον Θεό!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η φυσική γνώση βοηθάει να αποκτήσουμε την πνευματική γνώση. Όταν όμως ο άνθρωπος παραμένη στην φυσική γνώση, παραμένει στην φύση και δεν ανεβαίνει στον Ουρανό. Δηλαδή παραμένει στον επίγειο παράδεισο που ποτιζόταν από τον Τίγρη και τον Ευφράτη και χαίρεται την όμορφη φύση με τα ζώα, αλλά δεν ανεβαίνει στον ουράνιο Παράδεισο, να χαρή με τους Αγγέλους και τους Αγίους. Για να ανεβούμε στον ουράνιο Παράδεισο, είναι απαραίτητη η πίστη στον Νοικοκύρη του Παραδείσου, για να Τον αγαπήσουμε, να αναγνωρίσουμε την αμαρτωλότητά μας, να ταπεινωθούμε, για να Τον γνωρίσουμε και να συνομιλούμε μαζί Του προσευχόμενοι και να Τον δοξάζουμε και όταν μας βοηθάη και όταν μας δοκιμάζη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένας που αναπαύεται στις μετάνοιες, στην νηστεία, στην άσκηση, χρειάζεται να μελετήση και δογματική, θεολογία κ.λπ.;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν κανείς έχη μία στοιχειώδη μόρφωση, αυτή είναι εργαλείο που βοηθάει. Δεν ζητάει όμως να αποκτήση γνώσεις, για να βοηθήση ή για να λέη εξυπνάδες, αλλά για να βοηθηθή. Αν προσπαθήση κανείς να αγιάση ό,τι του έδωσε ο Θεός, έρχεται η Χάρις και φωτίζει. Εκεί μέσα είναι και η δογματική και η θεολογία, γιατί ζη τα μυστήρια του Θεού. Άλλος μπορεί να είναι απλός και να μη θέη να μάθη περισσότερα, αλλά να αρκήται σε ό,τι του δώση ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν είμαστε μέσα στο Μοναστήρι και επιθυμούμε ακόμη την γνώση του κόσμου, τί σημαίνει αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σημαίνει ότι δεν έχουμε γνώση.«Γνώσεσθε την αλήθειαν και η αλήθεια ελευθερώσει υμάς»[111]. Όταν ο άνθρωπος ταπεινωθή και φωτισθή, τότε αγιάζεται και το μυαλό του και η δύναμη αυτή του λογικού, ενώ, πριν αγιασθή, είναι σαρκική η ενέργεια του μυαλού. Αν ένας πάη εγωιστικά, ενώ είναι αγράμματος, να ερμηνεύση τα δόγματα και διαβάζη την Αποκάλυψη, τα Πατερικά κ.λπ., σκοτίζεται, και τελικά φθάνει σε απιστία. Τον εγκαταλείπει η Χάρις του Θεού, γιατί με εγωισμό προχώρησε. Βλέπετε, η ταπείνωση βοηθάει σε όλα, αυτή δίνει την δύναμη. Το σοφώτερο πράγμα που θα σκεφτώ, η πιο σοφή λύση που θα βρώ, είναι η πιο μεγάλη ανοησία , όταν έχη τον εγωισμό μέσα της, ενώ η ταπείνωση είναι πραγματική σοφία. Γι’ αυτό ο αγώνας να γίνεται με φιλότιμο και με πολλή ταπείνωση. Διαφορετικά, αντί να ωφελήση, έχει το αντίθετο αποτέλεσμα. Σκοτίζεται ο νούς και μετά λέει κανείς βλάσφημα πράγματα, γιατί προχώρησε εγωιστικά. Είναι πάνω από τις δυνάμεις του. Εδώ ένας μορφωμένος, αν πάη να ερμηνεύση τα δόγματα, υπάρχει κίνδυνος να βλαφθή, πόσο μάλλον ένας αγράμματος, αν πάη να διεισδύση μέσα στο πνεύμα το πατερικό, χωρίς να έχη πνευματική κατάσταση! Γιατί, αν είχε λίγη πνευματική κατάσταση, δεν θα το έκανε αυτό. Θα έλεγε: «Αν μου χρειάζεται κάτι, ο Θεός θα φωτίση. Ας εφαρμόσω αυτά  που καταλαβαίνω. Είναι τόσα πολλά!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, όταν παρερμηνεύη κανείς το Ευαγγέλιο, είναι γιατί δεν έχει ταπείνωση και ευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατί, όταν λείπη η ταπείνωση, οι ερμηνείες που δίνει, είναι του μυαλού, της λογικής και στερούνται από θείο φωτισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν δεν καταλαβαίνη κάτι, είναι καλύτερα να το αφήση για αργότερα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, να πή: «Κάτι καλό λέει, αλλά εγώ δεν το καταλαβαίνω». Και εγώ έτσι έκανα. Όταν ήμουν μικρός και διάβαζα το Ευαγγέλιο, αν δεν καταλάβαινα κάτι, δεν προσπαθούσα να το ερμηνεύσω. Σκεφτόμουν: «Κάτι καλό λέει, αλλά εγώ δεν το καταλαβαίνω». Και μετά έβλεπα, όταν χρειαζόταν αυτό, τάκ, ερχόταν η ερμηνεία, αλλά και πάλι έλεγα: «Ας ρωτήσω και κάποιον άλλον πώς το ερμηνεύουν αυτό». Και ήταν ακριβώς έτσι όπως το είχα καταλάβει. Γιατί είναι αναίδεια να προσπαθή κανείς να ερμηνεύση το Ευαγγέλιο, και μάλιστα όταν δεν καταλαβαίνη. Γι’ αυτό, όταν μελετάτε, να μην τα ερμηνεύετε με το μυαλό, αλλά να φέρνετε καλούς λογισμούς, μέχρι να έρθη ο θείος φωτισμός της διακρίσεως, για να ερμηνεύωνται μόνα τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί ο άνθρωπος όταν αποκτήση καλύτερη κατάσταση, να καταλάβη κάτι βαθύτερα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι βαθύτερα. Ένα θείο νόημα έχει πολλά θεία νοήματα. Μερικά μπορεί να τα καταλάβη τώρα και μερικά αργότερα. Ένας μπορεί να διαβάζη-νά διαβάζη, να μαθαίνη πολλά, και να μην μπορή να μπή καθόλου μέσα στο νόημα του Ευαγγελίου. Άλλος μπορεί να μη διαβάζη πολύ, αλλά να έχη ταπείνωση, αγωνιστικό πνεύμα, και τον φωτίζει ο Θεός και μπαίνει στο νόημα. Αυτός που θέλει να διαβάση περισσότερο, μπορεί να το θέλη από κενοδοξία ή για ευχαρίστηση. Είναι σαν έναν που βλέπει μία πάλη και δεν κοιτάζει πώς πάλεψαν, για να βοηθηθή, να γίνη παλαιστής, αλλά κοιτάζει συνέχεια το ρολόι του, για να προλάβη να παρακολουθήση και άλλη πάλη και άλλη, και παλαιστής δεν γίνεται, αλλά μένει θεατής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Συχνά, Γέροντα, για έναν που είναι μορφωμένος λένε: «Αυτός είναι καλλιεργημένος άνθρωπος». Πάντοτε έτσι είναι;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν λέμε, «αυτός είναι καλλιεργημένος άνθρωπος», εννοούμε καλλιεργημένο πνευματικά, ώριμο πνευματικά. Έχω παρατηρήσει πώς υπάρχει και αγράμματος πολύ υπερήφανος και αγράμματος πολύ ταπεινός, και μορφωμένος πολύ υπερήφανος και μορφωμένος πολύ ταπεινός. Δηλαδή, η εσωτερική καλλιέργεια είναι όλη η βάση. Γι’ αυτό λέει και Μ. Βασίλειος: «Το σπουδαιότερο είναι να έχης υψηλή θέση και ταπεινό φρόνημα». Ένας που έχει μία θέση, και να έχη και λίγο υπερηφάνεια, δικαιολογείται κάπως. Αλλά ένας που δεν έχει θέση, αν έχη υπερηφάνεια, είναι τελείως αδικαιολόγητος. Όλη η βάση είναι η καλλιέργεια του εαυτού μας, η εσωτερική καλλιέργεια. Αν είναι καλλιεργημένος κανείς, είναι και μορφωμένος, έχει και ταπεινό φρόνημα, αυτό είναι το πιο καλό. Για έναν όμως που δεν έχει μεγάλη μόρφωση, όταν έχη πολύ μεγάλη ιδέα για τον εαυτό του, είναι πολύ βαρύ.'
- type: h2
  initial:
    ru: ''
  text:
    ru: «Η γνώσις φυσιοί»[112]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η εξωτερική μόρφωση τις περισσότερες φορές βλάπτει, γιατί αναπτύσσει στον άνθρωπο μεγάλη ιδέα για τον εαυτό του. Η ιδέα μετά αυτή γίνεται ο φράχτης που εμποδίζει την Χάρη του Θεού να τον πλησιάση. Ενώ, όταν ο άνθρωπος πετάξη την μία ιδέα που έχει για τον εαυτό του, την ψεύτικη, τότε ο Καλός και Πλούσιος Πατέρας μας τον πλουτίζει με τις θεϊκές Του φωτεινές ιδέες. Όταν όμως ο ταλαίπωρος άνθρωπος έχη μεγάλη ιδέα για τον εαυτό του και την κρατάη την ιδέα αυτή στον εγκέφαλό του, συνεχίζει να είναι εγκέφαλος, σάρκα, και αγνοεί την Χάρη του Θεού, το Άγιο Πνεύμα. Οι πολλές γνώσεις, δηλαδή, υπάρχει φόβος να φουσκώσουν το κεφάλι, να το κάνουν αερόστατο, και να διατρέχη τον κίνδυνο ή να σπάση στον αέρα (μέ σχιζοφρένεια) ή να γκρεμισθή (μέ υπερηφάνεια) και να γίνη κομμάτια. Γι’ αυτό η γνώση θα πρέπη να ακολουθή τον φόβο του Θεού και να συμβαδίζη με την πράξη, για να υπάρχη ισορροπία. Η σκέτη γνώση βλάπτει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν μπαίνη ο εγωισμός και μιλώ, για να με θαυμάσουν, γιατί εγώ σκέφθηκα καλύτερα, τότε λειτουργούν οι πνευματικοί νόμοι, για να συνέλθω. Όταν όμως αυτό γίνεται συνέχεια, πειράζει. Μία τριχούλα μπαίνει στο μάτι και το ερεθίζει λίγο. Αν μπαίνη συνέχεια, δημιουργεί μεγάλο ερεθισμό. Έτσι και εδώ δημιουργείται πνευματικός ερεθισμός. Όταν ένας άνθρωπος έχη εξυπνάδα και κάνη μία εργασία με ευκολία, πρέπει να διαλύεται μπροστά στον Θεό, να Τον ευχαριστή μέρα-νύχτα που του έδωσε εξυπνάδα, και την κάνει, χωρίς να κουράζεται. Αυτό έλειψε, να μην Τον ευχαριστή!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν όμως, Γέροντα, έχη την γνώμη ότι δεν καταφέρνει τίποτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τότε τον πειράζει το ταγκαλάκι από την αντίθετη πλευρά. Ρώτησαν την καμήλα: «Ο ανήφορος σ΄ αρέσει ή ο κατήφορος;». Κι εκείνη είπε: «Γιατί, το ίσωμα χάθηκε;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτοί που δεν έχουν μυαλό είναι καλύτερα. Σ΄ εμάς δόθηκε μυαλό, για να είμαστε καλύτερα, αλλά τί κάνουμε; Θα μας ζητηθή λόγος. Πώς τα οικονομάει ο Θεός! Αυτοί που δεν τους κόβει, είναι χαρούμενοι – και στην άλλη ζωή θα είναι καλύτερα, και αυτοί που έχουν το μυαλό το πολύ βασανίζονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην άλλη ζωή, Γέροντα, οι καθυστερημένοι διανοητικά θα είναι καλά, δεν θα είναι λειψοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τελικά, και το πολύ μυαλό θα γίνη πολτός και το λίγο μυαλό θα γίνη πολτός. Εκεί, στον Ουρανό δεν θα είναι μετά νούς. Οι θεολόγοι Άγιοι στον Ουρανό δεν θα είναι σε καλύτερη θέση ως προς την γνώση του Θεού από όσους ήταν διανοητικώς ανάπηροι στην ζωή αυτή. Ίσως στους δεύτερους να δώση ο Δίκαιος Θεός και κάτι παραπάνω, γιατί έζησαν εδώ στερημένοι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να δουλεύουμε σωστά το μυαλό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί όμως, Γέροντα, συχνά λέτε ότι η μόρφωση είναι καλή προϋπόθεση για τον Μοναχισμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίτα να σού πώ, ένας μορφωμένος μπορεί να πάρη να διαβάση ένα Πατερικό και με λίγη προσπάθεια, επειδή θα το καταλάβη, να προχωρήση γρήγορα. Ένας αγράμματος, αν δεν έχη ευλάβεια, δύσκολα θα προχωρήση. Ο αγράμματος πρέπει να φθάση να έχη βιώματα και θεία γεγονότα και μέσα από αυτά  να κατανοήση μετά τα όσα διαβάζει. Ενώ ο μορφωμένος, λίγη προσπάθεια αν κάνη, γρήγορα θα προχωρήση, φθάνει να δουλεύη το μυαλό του και να μην πιάνεται μόνον από την θεωρία και τον κλέβει η θεωρία. Δεν λέω να θέλη να γνωρίση τα μυστήρια του Θεού με το μυαλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, να χρησιμοποιή το μυαλό του κατά των παθών;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι μόνον αυτό, αλλά και γενικώτερα. Βλέπει τις ευεργεσίες του Θεού, το σύμπαν όλο και δοξολογεί, ευχαριστεί τον Θεό. Βλέπεις, πρώτα ο Αβραάμ αναζήτησε τον Θεό και ύστερα ο Θεός τον Αβραάμ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς δηλαδή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο πατέρας του Αβραάμ ήταν ειδωλολάτρης, λάτρευε τα είδωλα. Ο Αβραάμ είδε το σύμπαν, προβληματίσθηκε που λάτρευαν τα άψυχα είδωλα και δούλεψε το μυαλό του: «Δεν μπορεί, είπε, αυτά  τα είδωλα, αυτά  τα ξύλα, να είναι θεοί, να δημιούργησαν αυτόν τον κόσμο. Ποιός έκανε τον ουρανό, τά΄ αστέρια, τον ήλιο κ.λπ.; Πρέπει να βρώ τον αληθινό Θεό κι Αυτόν να πιστέψω και θα προσκυνήσω». Τότε λοιπόν ο Θεός του αποκαλύφθηκε και του είπε:«Έξελθε εκ της γης σου και εκ της συγγενείας σου»[113]και τον πήγε στην Χεβρώμ, και έγινε αγαπημένο παιδί του Θεού. Ο μορφωμένος, και ευλάβεια να μην έχη, επειδή μπορεί εύκολα να καταλάβη, με λίγη ταπείνωση και λίγο αγώνα θα προχωρήση. Νά, είναι όπως λ.χ. στις διαβιβάσεις που ήμουν. Όταν με έβαλαν εκεί, είχε μερικά σήματα αγγλικά. Όσοι ήταν μορφωμένοι και ήξεραν και αγγλικά, αμέσως τα επίαναν. Εμείς οι άλλοι δυσκολευόμασταν. Αλλά και στην θεωρία που κάναμε εύκολα οι άλλοι τα καταλάβαιναν, γιατί ήξεραν ορισμένα πράγματα, ενώ εμείς πάλι δυσκολευόμασταν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να γνωρίση κανείς τις ευεργεσίες του Θεού. Να καταλάβη τί του έχει δοθή. Το μυαλό γιατί μας το έδωσε ο Θεός; Για να εξετάζουμε, να μελετούμε, να παρακολουθούμε τον εαυτό μας κ.λπ. Το μυαλό ο Θεός δεν το έδωσε στους ανθρώπους, για να καταγίνωνται συνέχεια με το πώς να βρουν ταχύτερο μέσο να πηγαίνουν από την μία χώρα στην άλλη, αλλά για να καταγινώμαστε με το κυριώτερο, πώς να φθάσουμε στον προορισμό μας, κοντά στον Θεό, στην αληθινή χώρα, στον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τί ευεργεσίες έκανε ο Θεός στον Ισραηλιτικό λαό! Τί σημεία! Πόσα γεγονότα! Όταν όμως ο Μωυσής άργησε να κατεβή από το Σινά με τις πλάκες, τις δέκα εντολές του Θεού, ο λαός έδωσε τα χρυσαφικά του, για να κάνουν ένα χρυσό μοσχάρι και να το προσκυνούν[114]. Στην εποχή μας δεν υπάρχει κανένας άνθρωπος μέ… μοσχαρίσιο μυαλό. Γι’ αυτό για έναν μορφωμένο δεν δικαιολογείται να μην καταλαβαίνη ποιό είναι το σωστό. Το μυαλό το έδωσε ο Θεός, για να βρη ο άνθρωπος τον Δημιουργό του. Οι Ευρωπαίοι το ζάλισαν το μυαλό, έπαθαν σύγχυση και πάνε στον γκρεμό, γιατί έβγαλαν τον Θεό από την ζωή τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι και μερικοί πού, ενώ έχουν όλες τις προϋποθέσεις, μυαλό, εξυπνάδα κ.λπ., για να προχωρήσουν, δεν προσέχουν τί τους λές. Μόλις τους κάνης μία νύξη, «κατάλαβα»λένε και σπεύδουν να συμπληρώσουν. Έρχονται στο Όρος εξυπνότατα παιδιά. Δείχνουν ότι πιάνουν αμέσως ό,τι τους λές, αλλά πιάνουν αέρα, γιατί δεν προσέχουν. Ενώ άλλα με λιγώτερη εξυπνάδα, προσέχουν, περιμένουν με σύνεση να ακούσουν και τα παρακάτω, και τους μένουν αυτά  που ακούν. Άλλα καταλαβαίνουν πολλά, μαζεύουν από ΄δώ-από ΄κεί, γεμίζουν γνώσεις και δεν κάνουν τίποτε. Αχρηστεύουν το μυαλό που τους έδωσε ο Θεός, το κουρκουτιάζουν. Έχουν μία υπερηφάνεια και δεν αφήνουν την Χάρη του Θεού να τα επισκιάση. Ενώ άλλα που δεν έχουν πολύ μυαλό, πολύ ταπεινώνονται. Λένε: «Δεν μου κόβει» και ξαναρωτούν: «Πώς το είπες αυτό;», και προσπαθούν να το εφαρμόσουν. Έτσι χαριτώνονται και προχωρούν. Ο ταπεινός άνθρωπος συνήθως είναι πολυμαθής, ενώ ο εγωιστής, επειδή δεν ταπεινώνεται να ρωτήση, δεν έχει γνώσεις. Ο Μέγας Αρσένιος[115]ήταν ο πιο μορφωμένος σ΄ όλη την Βυζαντινή Αυτοκρατορία. Ο Μέγας Θεοδόσιος τον είχε δάσκαλο στα παιδιά του, τον Αρκάδιο και Ονώριο. Όταν όμως πήγε στην έρημο για μοναχός, κάθησε κοντά στον Αββά Μακάριο τον αγράμματο και έλεγε: «Ούτε το αλφάβητο αυτού δεν ξέρω»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα γίνη να μην εξετάζη τα πράγματα κανείς μόνο με το μυαλό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το μυαλό πρέπει να το δουλεύη σωστά. Να το δουλεύη στο μεγαλείο του Θεού, για να βρη τον Θεό, όχι να κάνη το μυαλό του Θεό. Όσοι έχουν μυαλό, πρέπει να είναι προχωρημένοι πνευματικά. Μία ματιά να ρίξουν, καταλαβαίνουν. Όταν δουλεύη κανείς το μυαλό, μπορεί να βοηθήση τον άλλον, διαφορετικά, μπορεί να τον βασανίση. Έχω ύπ΄ όψιν μου γεγονότα από λαϊκούς. Γνώρισα ένα παιδί που έμεινε ορφανό από πατέρα, μαζί με τα τρία αδελφάκια του, και η μάνα του ξαναπαντρεύτηκε. Τα ορφανά δεν είδαν αγάπη από την μάνα ούτε από τον πατρυιό τους. Το ταλαίπωρο, όταν μεγάλωσε, άνοιξε ένα εμπορικό και δούλευε. Μία φορά άκουσε ότι πέθανε κάποιος και άφησε τρία ορφανά. Πόνεσε τα ορφανά και είπε στην χήρα γυναίκα: «Θέλεις να παντρευθούμε και να ζήσουμε σαν αδέλφια, για να προστατεύσουμε αυτά  τα παιδιά;». Το δέχθηκε εκείνη. Τώρα ζουν πνευματικά, διαβάζουν Συναξάρια, Φιλοκαλία, πάνε σε Μοναστήρια, έχουν Πνευματικό. Σκέφθηκε σωστά και ενήργησε έτσι και δέχθηκε την θεία Χάρη. Αλλιώς θα του έλεγε το ταγκαλάκι: «Τώρα να τα βασανίσης αυτά  τα παιδιά, όπως βασανίστηκες και εσύ». Αυτός δεν πήγε να εκδικηθή με την κακότητα, αλλά εκδικήθηκε με την καλωσύνη. Άλλοι χρησιμοποιούν το μυαλό τους στο καλό και εφευρίσκουν καλά πράγματα και άλλοι για καταστροφή. Είναι και το ταγκαλάκι που τους βάζει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπουμε και στην περίπτωση του Άβελ και του Κάιν[116]. Μήπως ο Θεός αλλιώς έκανε τον Άβελ και αλλιώς τον Κάιν; Ο Άβελ όμως δούλεψε σωστά το μυαλό που του έδωσε ο Θεός. Σκέφθηκε: «Ο Θεός μου έδωσε ολόκληρο κοπάδι, ένα αρνάκι να μην Του δώσω;». Και πιάνει και σφάζει το καλύτερο αρνάκι. Ο Κάιν πήρε σιτάρι με σκύβαλα μαζί και το πρόσφερε θυσία στον Θεό. Ο ένας πρόσφερε το καλό αρνί, ο άλλος άχρηστα σκύβαλα. Εντάξει, δεν θέλεις να προσφέρης ένα αρνάκι, πάρε τουλάχιστον λίγο καθαρό σιτάρι. Δυστυχώς όμως παίρνει σιτάρι μαζί με σκύβαλα και το καπνίζει. Τί προσφερε ο ένας, τί ο άλλος! Ο Θεός ευαρεστήθηκε από την θυσία του Άβελ. Ζήλεψε μετά ο Κάιν και σκότωσε τον Άβελ. Έτσι ο Θεός πήρε στον Παράδεισο τον Άβελ και ο άλλος γύριζε σαν αγρίμι στα δάση. Φυσικά ο Θεός έδωσε ελευθερία, αλλά ο Άβελ την αξιοποίησε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Ο ορθολογισμός στην εποχή μας
- type: h2
  initial:
    ru: ''
  text:
    ru: Η λογική στην πνευματική ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θέση έχει η λογική στην πνευματική ζωή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιά λογική; Η κοσμική; Αυτή η λογική[117]δεν έχει καμμιά θέση στην πνευματική ζωή. Μπαίνουν Άγγελοι, Άγιοι από το παράθυρο, τους βλέπεις, μιλάς μαζί τους, φεύγουν… Αν πάς να τα εξετάσης αυτά  με την λογική, δεν γίνεται. Στην εποχή μας που έχουν αυξηθή οι γνώσεις, δυστυχώς η εμπιστοσύνη μόνο στην λογική κλόνισε την πίστη από τα θεμέλια και γέμισε τις ψυχές από ερωτηματικά και αμφιβολίες. Γι’ αυτό στερούμαστε τα θαύματα, γιατί το θαύμα ζήται και δεν εξηγείται με την λογική. Αντίθετα, η πίστη στον Θεό τραβάει την θεϊκή δύναμη κάτω και αναποδογυρίζει όλα τα ανθρώπινα συμπεράσματα. Κάνει θαύματα, ανασταίνει νεκρούς και αφήνει με στόμα ανοικτό την επιστήμη. Όλα τα πράγματα της πνευματικής ζωής εξωτερικά φαίνονται ανάποδα. Αν δεν αναποδογυρίση κανείς το κοσμικό του φρόνιμα, να γίνη πνευματικός άνθρωπος, αδύνατον είναι να γνωρίση τα μυστήρια του Θεού που μας φαίνονται παράξενα (ανάποδα). Όποιος νομίζει ότι μπορεί να γνωρίση τα μυστήρια του Θεού με την εξωτερική επιστημονική θεωρία, μοιάζει με ανόητο που θέλει να δη τον Παράδεισο με το τηλεσκόπιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η λογική κάνει πολύ κακό, όταν κανείς πάη να εξετάση με αυτήν τα θεία, τα μυστήρια, τα θαύματα. Οι Καθολικοί με την λογική τους έφθασαν να εξετάσουν την Θεία Κοινωνία στο Χημείο, για να δούν αν πράγματα είναι Σώμα και Αίμα Χριστού. Οι Άγιοι όμως με την πίστη που είχαν, συχνά έβλεπαν Σάρκα και Αίμα στην αγία Λαβίδα. Σε λίγο θα φθάσουν να περνούν και τους Αγίους από τις ακτίνες, για να διαπιστώσουν την αγιότητά τους! Πέταξαν το Άγιο Πνεύμα, έβαλαν την λογική τους και τώρα ασχολούνται με την λευκή μαγεία. Σε έναν Καθολικό που είχε καλή διάθεση –έκλεγε ο καημένος – είπα: «Μία από τις σπουδαιότερες διαφορές που έχουμε είναι και αυτή, εσείς βάζετε τον εγκέφαλο, εμείς την πίστη. Εσείς αναπτύξατε τον ορθολογισμό και γενικά τον ανθρώπινο παράγοντα. Με την λογική σας περιορίζετε την θεϊκή δύναμη, γιατί την θεία Χάρη την πετάτε στην άκρη. Εσείς στον αγιασμό ρίχνετε συντηρητικό, για να μη χαλάση. Εμείς στα χαλασμένα ρίχνουμε αγιασμό και γίνονται καλά. Πιστεύουμε στην Χάρη που αγιάζει και ο αγιασμός κρατάει και διακόσια και πεντακόσια χρόνια, δεν χαλάει ποτέ».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπαίνει δηλαδή, Γέροντα, η λογική, ο ορθός λόγος, πριν από τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως δεν μπαίνει η λογική αλλά η υπερηφάνεια; Στην ουσία αυτή η λογική είναι βλαμμένος λόγος όχι ορθός. Η υπερηφάνεια είναι λογική βλαμμένη. Λογική που έχει εγωισμό έχει και δαιμόνιο φωλιασμένο. Όταν μπαίνη αυτή η λογική στις ενέργειές μας, δίνουμε δικαίωμα στον διάβολο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, ένας πνευματικός άνθρωπος έχη να αντιμετωπίση έναν πειρασμό, και τότε δεν χωράει καθόλου η λογική;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τότε, ας κάνη ό,τι μπορεί ανθρωπίνως, και ό,τι δεν μπορεί, ας το αφήση στον Θεό. Είναι μερικοί που προσπαθούν να τα πιάνουν όλα μόνο με το μυαλό. Σαν αυτούς που θέλουν να κάνουν νοερά προσευχή με το μυαλό. Σφίγγουν το κεφάλι, για να συγκεντρωθούν, πονάει μετά το κεφάλι. Αν αντιμετώπιζα εγώ έτσι τα θέματα που έχω να αντιμετωπίσω κάθε μέρα, νομίζεις ότι θα μπορούσα να τα βγάλω πέρα; Αλλά κάνω ό,τι μπορώ ανθρωπίνως και μετά τα αφήνω στον Θεό. «Ο Θεός, λέω, θα δείξη, θα φωτίση τί πρέπει να γίνη». Πολλοί αρχίζουν: «Και πώς θα γίνει αυτή η δουλειά και τί θα γίνη μ΄ εκείνο ή με το άλλο», και με το παραμικρό τους πονάει το κεφάλι. Όταν κανείς προσπαθή να τακτοποιήση τα πράγματα μόνο με την λογική, ζαλίζεται. Πρέπει να βάλη τον Θεό μπροστά από κάθε ενέργειά του. Να μην κάνη δουλειά, χωρίς να εμπιστεύεται στον Θεό, γιατί μετά αγωνιά και κουράζει το μυαλό και νιώθει άσχημα ψυχικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχετε πει ότι δεν φθάνετε σε κατάσταση υπερέντασης. Πώς γίνεται αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, δεν φθάνω, γιατί δεν αντιμετωπίζω τα πράγματα με το μυαλό. Εμένα, αν πονέση το κεφάλι μου, θα πονέση ή από κρύωμα ή από υπόταση. Και έχω τόσα να αντιμετωπίσω! Κάθε μέρα έχω αυτούς που έρχονται με τα θέματά τους, με τον πόνο τους. Σκέφτομαι αυτούς που πέρασαν με τα διάφορα προβλήματά τους, τους αρρώστους κ.λπ. Και αν γίνη κανείς καλά, δεν λέει ότι έγινε καλά, να χαρώ και λίγο, αλλά συνεχίζω να έχω την έννοιά μου και γι’ αυτόν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς μπορεί, Γέροντα, ένας μοναχός να τακτοποιή σωστά τον λογισμό του, για να μην κουράζεται με την λογική;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να τον τακτοποιή με την πνευματική λογική όχι με την κοσμική λογική. Να γυρίση το κουμπί στην πνευματική συχνότητα. Να σκέφτεται πνευματικά και η τοποθέτησή του να είναι πνευματική. Ακόμη και σε έναν λαϊκό που είναι πνευματικός άνθρωπος δεν έχει καμμία θέση η κοσμική λογική. Η κοσμική λογική είναι για έναν καλό άνθρωπο που δεν πιστεύει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς εννοείτε την πνευματική τοποθέτηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πνευματική τοποθέτηση είναι να χαίρεσαι με τα αντίθετα από αυτά  με τα οποία χαίρονται οι κοσμικοί. Να χαίρεσαι, όταν λ.χ. δεν σού δίνουν σημασία. Μόνο με τα αντίθετα των κοσμικών επιδιώξεων θα κινηθούμε στον πνευματικό χώρο. Χρήματα θέλεις; Δώσε και το πορτοφόλι. Θρόνο θέλεις; Κάθισε τον εαυτό σου στο σκαμνί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εμείς, Γέροντα, τί ποσοστό λογικής έχουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσείς θέλετε ξεβίδωμα. Να ευχηθώ να σάς γίνη της αγάπης το ξεβίδωμα, που είναι θεία τρέλλα, γιατί αλλιώς καλύτερα είναι αυτοί που πάνε στο Λεμπέτι[118], παρά αυτοί οι Χριστιανοί που έχουν τον ορθολογισμό, δηλαδή την υπερήφανη λογική.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η κοσμική λογική βασανίζει τον άνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νιώθω την καρδιά μου σαν πέτρα. Τί θα γίνη με την σκληροκαρδία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ δεν έχεις σκληροκαρδία αλλά… μυαλοκαρδία! Όλη η καρδιά σου μαζεύτηκε στο μυαλό και δουλεύει τώρα μόνον το μυαλό. Αλλά υπάρχουν ακόμη περιθώρια, μπορεί να πάη η καρδιά στην θέση της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάθε μέρα να διαβάζης έναν κανόνα από το Θεοτοκάριο[119]. Αυτό είναι το καλύτερο φάρμακο, για να δουλέψη η καρδιά. Έχεις καρδιά, αλλά την σκεπάζει η λογική. Έχεις ξεσηκώσει το ευρωπαϊκό τυπικό, την ευρωπαϊκή νοοτροπία. Προσπαθείς τυπικά να είσαι σε όλα εντάξει. Αν ήσουν ευρωπαίος υπάλληλος, θα ήσουν τύπος και υπογραμμός. Στην ώρα σου εντάξει, στην δουλειά σου εντάξει. Θα σε είχαν όλοι για υπόδειγμα. Αν την συνέπειά σου την διαθέσης στα πνευματικά, θα κάνης άλματα πνευματικά, θα φθάσης στον Παράδεισο σύντομα. Αλλά, βλέπεις, το ευρωπαϊκό πνεύμα με την λογική τραβάει για το φεγγάρι και όχι για τον Θεό. Τώρα κινείσαι όπως στις υπηρεσίες. Στην πενυματική ζωή όμως τα πράγματα είναι διαφορετικά. Χρειάζεται απλότητα. Να κινήσαι απλά και να έχης εμπιστοσύνη στον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα αποκτήσω, Γέροντα, αυτήν την απλότητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να ανοίξω το κεφάλι και να βάλω μυαλό… παλιάς εποχής! Να μπής στην απλότητα του Γεροντικού, για να γνωρίσης την πνευματική επιστήμη, η οποία ανεβάζει και ξεκουράζει την ψυχή, και τότε το κεφάλι δεν πονάει. Η λογική βασανίζει τον άνθρωπο. Π.χ. λέω: «Αυτό πρέπει να γίνη έτσι»καί το κάνω, γιατί πρέπει να γίνη. Δεν το κάνω δηλαδή με την καρδιά, αλλά γιατί μου το υπαγορεύει η λογική. Η λογική λέει, αλλά και η ευγένεια λέει: «Πρέπει να παραχωρήσω την θέση μου». Δεν το λέει όμως η καρδιά. Άλλο είναι να σκιρτήση η καρδιά και να παραχωρήσω από αγάπη την θέση μου. Τότε θα νιώσω χαρά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να μην υπάρχει ο εαυτός μας στις ενέργειές μας. Να μη ζητούμε την δική μας ανάπαυση. Αυτό εμποδίζει να έρθη ο Χριστός. Να κοιτάζη κανείς τί αναπαύει τον άλλον. Η πραγματική ανάπαυση γεννιέται από την ανάπαυση του άλλου. Τότε αναπαύεται και ο Θεός στον άνθρωπο και ο άνθρωπος παύει να είναι άνθρωπος, θεώνεται. Αλλιώς δουλεύει μόνον το μυαλό, και τότε όλα είναι σαρκικά, ανθρώπινα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η κοσμική λογική κουράζει το μυαλό και αποδυναμώνει τις σωματικές δυνάμεις, περιορίζει την καρδιά, ενώ η πνευματική λογική της δίνει ευρύτητα. Το μυαλό, όταν χρησιμοποιήται σωστά, μπορεί να κεντήση την καρδιά και να την βοηθήση. Όταν ο νούς πάη στην καρδιά και συνεργασθή με την καρδιά, κάθε εργασία που κάνουμε παύει να είναι μία εργασία μόνο λογική. Η λογική είναι χάρισμα. Την λογική όμως αυτή πρέπει να την αγιάσουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ, Γέροντα, δεν έχω καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχεις καρδιά, αλλά, μόλις πάη να ενεργήση, την φιμώνει το μυαλό σου. Να πσοπαθήσης να αποκτήσης την λογική της καρδιάς, την πίστη, την αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα το πετύχω αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρώτο βήμα, θα κάνης πορεία διαμαρτυρίας στην Θεσσαλονίκη ξυπόλυτη, να πούν ότι τρελλάθηκες, για να φύγη το μυαλό!!! Εσύ, ευλογημένη, τα παίρνεις όλα με μαθηματική ακρίβεια. Αστρονόμος είσαι; Να σταματήσης να σκέφτεσαι ορθολογιστικά, για να μπορέσης να κάνης δουλειά στον εαυτό σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί μελέτη θα με βοηθήση, για να απαλλαγώ από την κοσμική λογική;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να διαβάσης πρώτα το Γεροντικό, Φιλόθεο Ιστορία, Ευεργετινό, δηλαδή όχι θεωρητικά βιβλία αλλά πράξη, για να φύγη η κοσμική λογική με το πατερικό απλό πνεύμα της αγιότητος. Μετά να αρχίσης τον Αββά Ισαάκ, για να μη δεχθής τον Αββά Ισαάκ ως φιλόσοφο αλλά ως θεοφώτιστο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η κοσμική λογική αλλοιώνει το πνευματικό αισθητήριο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι Άγιοι Πατέρες τα έβλεπαν όλα με το πνευματικό, με το θεϊκό μάτι. Τα Πατερικά είναι γραμμένα με το πνεύμα του Θεού, και με το πνεύμα του Θεού έκαναν τις ερμηνείες οι Άγιοι Πατέρες. Τώρα δεν υπάρχει συχνά αυτό το πνεύμα του Θεού, για να καταλαβαίνουν τα Πατερικά. Τα βλέπουν όλα με το κοσμικό μάτι, δεν βλέπουν πιο πέρα, δεν έχουν την ευρύτητα που δίνουν η πίστη και η αγάπη. Ο Μέγας Αρσένιος[120]άφηνε τα βάγια μέσα στο νερό, χωρίς να το αλλάζη, και το νερό μύριζε πολύ. Εμείς που να καταλάβουμε τί πήγαζε μέσα από εκείνο το βρώμικο νερό! «Μά δεν το καταλαβαίνω αυτό», σού λέει ο άλλος. Δεν στέκεται να δη μήπως υπάρχη και κάτι άλλο, αλλά το αρνείται, γιατί δεν το καταλαβαίνει!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν μπαίνη η λογική, δεν μπορεί να καταλάβη κανείς ούτε το Ευαγγέλιο ούτε τους Αγίους Πατέρες. Αλλοιώνεται το πνευματικό αισθητήριο, και ο άνθρωπος με την λογική του βγάζει άχρηστα και το Ευαγγέλιο και τα Πατερικά και φθάνει να λέη: «Τόσα χρόνια ταλαιπωρούνται οι άνθρωποι άδικα με την άσκηση, την νηστεία κ.λπ.!».Αυτό είναι βλασφημία. Ήρθε μία φορά ένας κελλιώτης μοναχός στο Καλύβι με αυτοκίνητο. «Παιδί μου, του λέω, τί το θέλεις εσύ το αυτοκίνητο; Δεν ταιριάζει!».«Γιατί, Γέροντα; μου λέει. Δεν γράφει στο Ευαγγέλιο «εκατονταπλασίονα λήψεται και ζωήν την αιώνιον;». «Το«εκατονταπλασίονα λήψεται»το λέει γι’ αυτά  που χρειάζεται να έχη κανείς. Αλλά πάλι για τον μοναχό ταιριάζει αυτό που λέει ο Απόστολος Παύλος:«Ως μηΔεν έχοντες και πάντα κατέχοντες»[121]. Δηλαδή, τίποτε δεν έχει ο μοναχός, αλλά μπορεί να κάνη κουμάντο στα ταμεία των άλλων, γιατί τον εμπιστεύονται για την αρετή του. Όχι να έχουμε εμείς οι μοναχοί!».Βλέπετε με την λογική τί ερμηνείες λανθασμένες μπορεί να δώση κανείς; Πάντα να ξέρετε, αν δεν εξαγνισθή ο άνθρωπος, αν δεν έρθη ο θείος φωτισμός, συνέχεια οι ερμηνείες που θα δίνη, θα είναι όλο θολούρα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με ρώτησαν μία φορά: «Γιατί η Παναγία δεν έκανε θαύμα στην Τήνο και οι Ιταλοί τίναξαν το καράβι «Έλλη» την ημέρα της μνήμης της;». Ενώ η Παναγία έτσι έκανε μεγαλύτερο θαύμα. Το τίναγμα της «Έλλης» προκάλεσε την αγανάκτηση των Ελλήνων. Κατάλαβαν οι Έλληνες ότι οι Ιταλοί δεν σέβονται τίποτε και αγανάκτησαν, όποτε μετά τους εδίωξαν φωνάζοντας «αέρα». Αλλιώς θα έλεγαν: «Και αυτοί θρησκεύουν, είναι φίλοι μας». Δεν θα καταλάβαιναν την ασέβεια των Ιταλών. Και έρχονται τώρα αυτοί με την λογική τους και λένε: «Γιατί να μην κάνη θαύμα η Παναγία;». Τί να πής;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άλλοι ρωτούν: «Καλά, την μέτρησαν την φωτιά στην Βαβυλώνα, όταν έβαλαν μέσα τους τρεις Παίδες και λένε ότι ήταν σαράντα εννιά πήχεις;». Μά αφού την πρώτη φορά ήταν επτά μέτρα ύψος η φλόγα και ύστερα έβαλαν καύσιμη ύλη, για να γίνη επταπλάσια. Επτά επί επτά δεν κάνει σαράντα εννιά; Βάζεις κάτι τέτοιους στην φωτιά; Βλέπεις έναν ορθολογισμό, μία λογική παράλογη, τελείως έξω από την πραγματικότητα. Μερικοί από τους σημερινούς θεολόγους με κάτι τέτοια ασχολούνται. Π.χ. ρωτούν: «Οι δαίμονες που έπεσαν στην θάλασσα ζουν ή πνίγηκαν[122];». Σημασία έχει το ότι έφυγαν από τον άνθρωπο. Τί σε νοιάζει εσένα τί έγιναν; Κοίταξε εσύ να μη δαιμονισθής και μην ασχολήσαι με το που βρίσκονται τώρα εκείνα τα δαιμόνια!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί προσπαθούν να συμβιβάσουν το Ευαγγέλιο με την ανθρώπινη λογική. Εξετάζουν το Ευαγγέλιο με αυτήν την κοσμική λογική και δεν βγάζουν άκρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το Ευαγγέλιο και η κοσμική λογική δεν συμβιβάζονται. Στο Ευαγγέλιο είναι η αγάπη. Στην λογική είναι το συμφέρον. Στο Ευαγγέλιο λέει: «Άνς ε αγγαρεύση κάποιος γί αένα μίλι, εσύ να πάς δύο μίλια»[123]. Που υπάρχει λογική εδώ πέρα; Εδώ είναι μάλλον τρέλλα! Γι’ αυτό όσοι πάνε να συμβιβάσουν το Ευαγγέλιο με την κοσμική λογική μπερδεύονται άσχημα. Υπάρχουν λ.χ. διάφορες ομάδες που οργανώνουν φιλανθρωπικά έργα. Μαθαίνουν φέρ΄ ειπείν ότι κάποιος έπαθε μεγάλη ζημιά, φτώζυνε και έχει ανάγκη από χρήματα. «Να τον βοηθήσουμε, λένε, αλλά προηγουμένως ας βεβαιωθούμε αν έχη πράγματι ανάγκη». Και πάνε δυό-τρείς να τον επισκεφθούν, για να δούν αν πράγματι έχη ανάγκη. Και βλέπουν, ας υποθέσουμε, να έχη πολυτελές σαλόνι και λένε: «Ά, έχει τέτοιες πολυθρόνες, τέτοιο σαλόνι! Αυτός, για να έχη τέτοια έπιπλα, δεν έχει ανάγκη». Και την βοήθεια δεν την δίνουν. Δεν καταλαβαίνουν όμως ότι ο άλλος πεινάει. Γιατί, όταν γίνεται κανείς φτωχός, αυτό δεν σημαίνει ότι από την μία ώρα στην άλλη αλλάζει ακόμη και τα ρούχα του. Και που ξέρεις αν αυτό το σαλόνι δεν το είχε από παλιά και ο καημένος δεν πρόλαβε να το πουλήση ακόμη; Ή μπορεί να του το χάρισε κάποιος που έμαθε την ανάγκη της οικογενείας του. Κρίνουν με την λογική και μπερδεύονται, και το Ευαγγέλιο μένει έξω από την ζωή τους. Οι άνθρωποι βλέπουν εξωτερικά, Γι’ αυτό και τα ερμηνεύουν όλα αλλιώς.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η «κάτ΄ όψιν» κρίση[124]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νιώθω σαν εμπόδια για την πνευματική πρόοδο την κρίση, τήνν λογική και την ανθρώπινη δικαιοσύνη που έχω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και βέβαια είναι εμπόδια για την πνευματική πρόοδο, γιατί φεύγει η Χάρις του Θεού. Μένει μετά ο άνθρωπος χωρίς την θεία βοήθεια και πέφτει και σπάζει τα μούτρα του. Η κρίση και η ανθρώπινη δικαιοσύνη είναι κατά κανόνα άδικες. Η δικαιοσύνη του Θεού είναι αγάπη, μακροθυμία, επιείκεια. Το μικρόβιο της πνευματικής σου αρρώστιας είναι ότι εξετάζεις τα πράγματα με την ανθρώπινη λογική. Το φάρμακο το δραστικό είναι οι καλοί λογισμοί. Όταν ο άνθρωπος σκέφτεται δεξιά, έχη δηλαδή καλούς λογισμούς, αυξάνει η χωρητικότητα της καρδιάς. Επειδή χρησιμοποιείς πολύ την λογική, χρειάζεται να προσέξης πολύ τους λογισμούς σου, γιατί και τα συμπεράσματα που βγάζεις με την λογική είναι ανθρώπινα και όχι πνευματικά και αγιασμένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πέφτω τόσο συχνά στην κατάκριση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σ΄ εσένα φταίνε τα Νομικά που σπούδασες, και κρίνεις έτσι. Πολλές φορές ορισμένες σπουδές ή ένα επάγγελμα καλλιεργούν, κατά κάποιο τρόπο, μία ξερή λογική. Η λογική είναι η αρρώστια των διανοουμένων. Είναι στο μεδούλι τους. Ενώ έχεις καρδιά, η λογική πάει πιο μπροστά από την καρδιά σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι μερικοί που έχουν πολλή λογική και κρίση με εγωισμό, δεν παραδέχονται κανέναν. Ζητούν το απόλυτο από τους άλλους και όχι από τον εαυτό τους, αναπαύονται στις αδυναμίες τους και κατηγορούν τους άλλους. Πράγματα πολύ παράξενα! Εξωτερικά είναι σχηματισμένοι, έχουν φτιάξει δηλαδή έναν εξωτερικό άνθρωπο γεμάτο υποκρισία και δεν έχουν ίχνος απλότητος. Αυτή είναι και η διαφορά Ευρωπαίων και Ελλήνων, και όταν λέω «Ελλήνων», εννοώ το ορθόδοξο πνεύμα. Τον Ευρωπαίο δεν μπορείς να καταλάβης πότε μπορείς να τον πλησιάσης και πότε όχι. Πάντα «καλώς ορίσατε» λέει με ένα ψεύτικο χαμόγελο. Ενώ τον Έλληνα τον καταλαβαίνεις. Έχει χαρά; Το δείχνει. Έχει μούτρα; Το δείχνει, μία κανονίζεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί φταίει, Γέροντα, όταν κανείς κρίνη ανθρώπους, πράγματα και καταστάσεις, και μάλιστα ταχύτατα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κινείται μόνο με την λογική, εργάζεται ο εγκέφαλος, και αυτό είναι το αποτέλεσμά του. Καλά είναι σ΄ αυτούς που έχουν κάμποσο μυαλό, να πάρη ο Θεός το κατσαβιδάκι και να το στρίψη λίγο. Όσο αδειάζει το μυαλό, τόσο Χάρη γεμίζει ο άνθρωπος. Όταν λέω μυαλό, εννοώ την κρίση την ανθρώπινη, τον εγωισμό, την αυτοπεποίθηση. Από την στιγμή όμως που θα καταλάβη κανείς ότι δεν έχει σωστή κρίση και πή, «έχω κρίση κοσμική, η κρίση μου δεν έχει θείο φωτισμό και θα κάνω λάθος, Γι’ αυτό δεν πρέπει να την χρησιμοποιώ», τότε ο Θεός θα τον φωτίση, θ αγίνη διακριτικός και θα διακρίνη ποιό είναι το σωστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο πειρασμός αχρηστέυη έξυπνους ανθρώπους με την «κάτ΄ όψιν»κρίση. Όταν ο άνθρωπος έχη το ανθρώπινο στοιχείο μέσα του, κρίνει ανθρώπινα και εγκληματεί. Πρέπει να φύγη το ανθρώπινο στοιχείο, για να γίνη η κρίση του θεϊκή. Η κοσμική κρίση είναι λανθασμένη κρίση. Πόσες αδικίες γίνονται! Πόσες φορές κολάζεται κανείς! Γι’ αυτό πάντα να φέρνετε καλό λογισμό, για να εξασφαλίζετε την ψυχή σας. Ο άνθρωπος είναι μυστήριο, δεν μπορείς να ξέρης τί κάνει! Μία φορά το Πάσχα, μετά την Θεία Λειτουργία της Αναστάσεως, καθήσαμε λίγο σε ένα Καλύβι να φάμε τυρί και αυγό. Δίπλα μου καθόταν ένας μοναχός που είναι αγωγιάτης, μεταφέρει ξύλα. Τον βλέπω, κάνει στην άκρη αυτό που του πρόσφεραν. «Φάε», του λέω. «Καλά, καλά, θα φάω», μου λέει. Τον βλέπω μετά, πάλι δεν έτρωγε. «Φάε, του ξαναλέω, σήμερα Πάσχα είναι». «Ευλόγησον, Γέροντα, μου λέει, εγώ, όταν κοινωνάω, δεν τρώω, στις 2 το απόγευμα θα φάω». Από την προηγούμενη ημέρα νηστικός και θα έτρωγε το απόγευμα! Βλέπεις από ευλάβεια τί έκανε; Και οι άλλοι μπορεί να τον θεωρούσαν έναν απλό αγωγιάτη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο άνθρωπος είναι μυστήριο! Και αν σε έβαλαν να κρίνης, να σκεφθής: «Είναι αυτή η κρίση θεϊκή ή είναι γεμάτη εμπάθεια;». Είναι δηλαδή ανιδιοτελής ή γεμάτη ιδιοτέλεια; Να μην έχετε εμπιστοσύνη στον εαυτό σας ούτε στην κρίση σας. Υπάρχει μέσα πολύς εγωισμός, όταν κανείς κρίνη. Εμένα με βάζουν να κρίνω ένα θέμα και ενώ δεν θέλω, αλλά αναγκάζομαι και το κάνω, και πάρ΄ όλο που κρίνω με ανιδιοτέλεια και αμερόληπτα, όταν πάω να κάνω προσευχή, δεν νιώθω, ας υποθέσουμε, εκείνη την γλυκύτητα που νιώθω άλλες φορές. Όχι ότι με πειράζει η συνείδησή μου για κάτι, αλλά γιατί έκρινα σαν άνθρωπος. Πόσο μάλλον όταν η κρίση είναι λανθασμένη ή έχη μέσα και την δικαιολογία ή ανθρώπινα κριτήρια! Είναι μεγάλη υπόθεση η κρίση. Η κρίση είναι του Θεού. Είναι φοβερό! Δεν έχει σημασία αν έχη καλή διάθεση αυτός που είναι στην θέση να κρίνη. Σημασία έχει τί βγάζει με την κρίση του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χρειάζεται πολλή διάκριση. Φυσικά, όλοι οι άνθρωποι έχουμε λίγη διάκριση, αλλά δυστυχώς οι περισσότεροι από εμάς δεν την χρησιμοποιούμε για τον εαυτό μας αλλά για τους συνανθρώπους μας (γιά να μή… διακριθούν, δηλαδή για να μην αναδειχθούν). Έτσι την μολύνουμε με την κρίση και κατάκριση και την απαίτηση να διορθωθούν οι άλλοι, ενώ θα έπρεπε να έχουμε απαίτηση μόνον από τον εαυτό μας, που δεν αποφασίζει να πάρη τον πνευματικό αγώνα στα ζεστά και να κόψη τα πάθη του, για να ελευθερωθή η ψυχή μας και να πετάξη στον Ουρανό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Η νέα γενιά
- type: h2
  initial:
    ru: ''
  text:
    ru: Έλειψε το πνεύμα της θυσίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι περισσότεροι άνθρωποι σήμερα δεν γεύτηκαν την χαρά της θυσίας και δεν αγαπούν τον κόπο. Μπήκε η τεμπελιά, το βόλεμα, η πολλή άνεση. Έλειψε το φιλότιμο, η θυσία. Θεωρούν κατόρθωμα, όταν καταφέρνουν χωρίς κόπο να πετύχουν κάτι, όταν βολεύωνται. Δεν χαίρονται, όταν δεν βολεύωνται. Ενώ, αν αντιμετώπιζαν τα πράγματα πνευματικά, θα έπρεπε τότε να χαίρωνται, γιατί τους δίνεται ευκαιρία για αγώνα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλοι τώρα, μικροί-μεγάλοι, κοιτάζουν την ευκολία. Οι πνευματικοί άνθρωποι κοιτάζουν πώς να αγιάσουν με λιγώτερο κόπο. Οι κοσμικοί πώς να βγάλουν περισσότερα χρήματα, χωρίς να δουλεύουν. Οι νέοι πώς να περνούν στις εξετάσεις, χωρίς να διαβάζουν, πώς να πάρουν πτυχίο, χωρίς να φεύγουν από την καφετέρια. Και αν είναι δυνατόν, να τηλεφωνούν από την καφετέρια, για να τους δώσουν τα αποτελέσματα! Ναί, εκεί φθάνουν! Έρχονται πολλά παιδιά στο Καλύβι και μου λένε: «Κάνε προσευχή να περάσω». Δεν διαβάζουν και λένε: «Ο Θεός μπορεί να με βοηθήση». «Διάβασε, του λέω, και Κάνε και προσευχή». «Γιατί, μου λέει, δεν μπορεί ο Θεός να με βοηθήση;». Δηλαδή την τεμπελιά του να ευλογήση ο Θεός; Δεν γίνεται αυτό. Αν το παιδί διαβάζη, αλλά δεν πιάνη, τότε θα το βοηθήση ο Θεός. Είναι μερικά παιδιά που δεν θυμούνται ή δεν καταλαβαίνουν, αλλά καταβάλλουν προσπάθεια. Αυτά  θα τα βοηθήση ο Θεός να γίνουν τετραπέρατα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ευτυχώς που υπάρχουν και οι εξαιρέσεις, ένα παλληκάρι από την Χαλκιδική έδωσε εξετάσεις σε τρεις σχολές και πέρασε σε όλες[125], σε άλλη πρώτος, σε άλλη δεύτερος, αλλά τον ανέπαυε πιο πολύ να βρη μία δουλειά, για να ξελαφρώση τον πατέρα του που δούλευε στα μεταλλεία. Έτσι δεν πήγε να σπουδάση και επίασε αμέσως κάπου δουλειά. Αυτή η ψυχή είναι φάρμακο για μένα. Για τέτοια παιδιά να πεθάνω, να γίνω φυτόχωμα. Οι περισσότεροι όμως νέοι έχουν επηρεασθή από το κοσμικό πνεύμα και έχουν πάθει ζημιά. Έμαθαν να τους ενδιαφέρη μόνον ο εαυτός τους, δεν σκέφτονται καθόλου τον πλησίον αλλά μόνον τον εαυτό τους. Και όσο τους βοηθάς, τόσο πιο πολύ χουζούρι κάνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω κάτι νερόβραστα παιδιά σήμερα. Να κρίνουν το ένα, να βαριούνται το άλλο, ενώ η καρδιά ούτε κουράζεται ούτε γερνάει ποτέ. Να γίνουν καλόγεροι, βαριούνται. Να παντρευτούν, φοβούνται. Κοτζάμ παλληκάρια έρχονται, ξαναέρχονται στο Άγιον Όρος… «Άχ, και καλόγερος δύσκολα είναι, λένε. Κάθε μέρα να πρέπη να σηκώνεσαι μεσάνυχτα! Δεν είναι μία και δυο μέρες!...». Γυρίζουν στον κόσμο. «Τί να κάνω σ΄ αυτήν την κοινωνία, με τί άνθρωπο θα μπλέξω, αν παντρευτώ; Φασαρία είναι», λένε, και έρχονται πάλι στο Όρος. Κάθονται λίγο, «δύσκολα…»σού λένε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι νέοι σήμερα μοιάζουν με καινούργιες μηχανές που τα λάδια τους ε΄ναί παγωμένα. Πρέπει να ζεσταθούν τα λάδια, για να πάρουν μπρός οι μηχανές, αλλιώς δεν γίνεται. Έρχονται στο Καλύβι ταλαίπωρα παιδιά –δέν είναι ένα και δυο – και με ρωτούν: «Τί να κάνω, Πάτερ; Πώς να περάσω την ώρα μου; Με πιάνει πλήξη». «Να βρής μία δουλειά, βρέ παιδί». «Έχω λεφτά, μου λέει. Τί να την κάνω την δουλειά;». «Μά ο Απόστολος Παύλος λέει:«εί τις ου θέλει εργάζεσθαι μηδέ εσθιέτω»[126]. Πρέπει να δουλέψης, για να φάς, και ας έχης χρήματα. Η δουλειά βοηθάει τον άνθρωπο να ξεπαγώσουν τα λάδια της μηχανής του. Είναι δημιουργία. Δίνει χαρά και παίρνει το άγχος, την πλήξη. Έτσι, βρέ παλληκάρι, να βρής μία δουλειά που να σού αρέση έστω και λίγο, και να ξεκινήσης. Για δοκίμασε, να δής!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και βλέπεις, μερικά παιδιά κουράζονται, και ξεκουράζονται με την κούραση. Έρχονται νέα παιδιά στο Καλύβι και κάθονται, και κουράζονται που κάθονται. Αλλά με πολύ φιλότιμο με ρωτούν συνέχεια: «Τί να σού κάνουμε; Τί να σού φέρουμε;». Δεν ζητώ ποτέ τίποτε. Το βράδυ με τον φακό κάνω τις δουλειές, να κουβαλήσω ξύλα, να ανάψω δυο σόμπες τον χειμώνα, να συμμαζέψω. Πολλοί από τους επισκέπτες τα αφήνουν όλα άνω-κάτω, λάσπες, κάλτσες βρεγμένες. Τους δίνω λεπτές κάλτσες που μου στέλνουν, πετούν τις άλλες. Τους δίνω χαρτοπετσέτες να τις τυλίξουν, δεν τις συμμαζεύουν. Τρείς φορές στην ζωή μου ζήτησα κάτι. Σε ένα παλληκάρι είπα μία φορά: «Θέλω δυο κουτιά σπίρτα από τις Καρυές» – αν και είχα τέσσερις αναπτήρες, αλλά το έκανα για να του δώσω χαρά. Έτρεξε χαρούμενος, λαχανίασε να τα φέρη, αλλά τον ξεκούρασε η κούραση, γιατί γεύτηκε την χαρά της θυσίας. Και άλλος καθόταν και κουράσθηκε που καθόταν. Ζητούν να νιώσουν την χαρά, αλλά πρέπει να θυσιασθή ο άνθρωπος, για να έρθη η χαρά. Η χαρά από την θυσία γεννιέται. Η πραγματική χαρά βγαίνει από το φιλότιμο. Έτσι και καλλιεργηθή το φιλότιμο, είναι πανηγύρι. Το βάσανο του ανθρώπου είναι ο εγωισμός, η φιλαυτία. Εκεί είναι που σκαλώνει κανείς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είχαν έρθει δύο νέοι αξιωματικοί στο Άγιον Όρος και μου είπαν: «Θέλουμε να γίνουμε μοναχοί». «Γιατί, λέω, θέλετε να γίνεται μοναχοί; Από πότε σάς απασχόλησε αυτό;». «Τώρα, μου λένε, κάναμε μία επίσκεψη στο Άγιον Όρος και σκεφτόμαστε να μείνουμε, μήπως γίνη και κανένας πόλεμος». «Βρέ, δεν ντρέπεστε, τους λέω. «Μήπως γίνη και κανένας πόλεμος»! Και πώς θα φύγετε από τον στρατό;». «Θα βρούμε μία αιτία», μου λένε. Τί θα βρούν; Ή θα κάνουν ότι είναι τρελλοί ή…, κάτι πάντως θα βρούν. «Αν ξεκινάτε να γίνετε μοναχοί με αυτό το σκεπτικό, είστε αποτυχημένοι εξ αρχής», τους λέω. Άλλοι πάλι, ενώ είναι έτοιμοι από καιρό να παντρευτούν, να δημιουργήσουν οικογένεια, έρχονται και μου λένε: «Τί να παντρευτώ; Είναι να κάνης οικογένεια και παιδιά σ΄ αυτούς τους δύσκολους καιρούς;». «Καλά, λέω, όταν γίνονταν διωγμοί, η ζωή είχε σταματήσει; Ούτε δούλευαν ούτε παντρεύονταν; Μήπως εσύ βαριέσαι;». «Θέλω να γίνω καλόγερος», λέει. «Εσύ βαριέσαι! Τί προκομμένος καλόγερος θα γίνης;». Καταλάβατε; Αν μία ξεκινάη να γίνη καλόγρια, επειδή σκέφτεται: «Τί να μείνω στον κόσμο, να κάνω οικογένεια, νάχω παιδιά, ζαλούρα, φασαρία; Θα πάω σε Μοναστήρι, θα κάνω εκεί μία υπακοή, ευθύνη δεν θάχω, και αν μου πούν καμμιά κουβέντα, θα σκύβω το κεφάλι. Που να φτιάξω σπίτι; Εκεί θα έχω κελλί δικό μου, φαγητό κ.λπ.», να το ξέρη, είναι εξ αρχής αποτυχημένη. Σάς φαίνεται παράξενο; Υπάρχουν και τέτοιοι άνθρωποι. Να ξέρετε, ένας προκομμένος οικογενειάρχης και στην καλογερική θα έκανε προκοπή, και ένας προκομμένος μοναχός, αν έκανε οικογένεια, θα έκανε προκοπή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κάποιος είχε καθήσει δόκιμος σ΄ ένα Μοναστήρι και δεν ήθελε να γίνη καλόγερος. «Γιατί, παιδί μου, μένεις έτσι;», τον ρωτάω. «Γιατί ο καλογερικός σκούφος μου θυμίζει το κράνος», μου λέει. Ακούς κουβέντα; Δεν ήθελε να γίνη καλόγερος, για να μη φορέση την καλογερική σκούφια. Του θύμιζε το κράνος! Και πότε φόρεσε το κράνος; Ζήτημα να το φόρεσε μερικές φορές μόνο σε καμμιά άσκηση. Που να πήγαινε και σε πόλεμο! Του θύμιζε το κράνος! Ακούς; Μά τί θέλει στην καλογερική αυτός; Όταν ξεκινάη κανείς έτσι, τί καλόγερος θα γίνη; Μπορείς να μου πής; Τελικά έγινε ο ταλαίπωρος κάπου μοναχός και δεν φορούσε χονδρή σκούφια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μία φορά ήρθαν δυο νεαροί στο Καλύβι με κάτι μαλλιά μέχρι κάτω. Πήγα να τους κουρέψω, αντέδρασαν, βιαζόμουν και εγώ, και μόνον τους κέρασα. Είχα και ένα γατί εκεί πέρα. «Να το πάρω;», λέει ο ένας. «Πάρ΄ το», του λέω. Πήγαν από εκεί στην Ιβήρων, μία ώρα δρόμο, με το γατί ο ένας στην αγκαλιά – και να βρέχη. Ζήτησε εκεί να μείνη στο Αρχονταρίκι με το γατί. «Δεν γίνεται», του είπαν και έμεινε έξω στην βροχή όλη νύχτα. Αν του έλεγες να φυλάξη μία ώρα σκοπιά, θα σού έλεγε: «Όχι, δεν μπορώ», αλλά να καθήση μία νύχτα έξω με το γατί, μπορεί.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας άλλος πήγε στρατιώτης και έφυγε. Ήρθε μετά στο Καλύβι και μου λέει: «Θέλω να γίνω μοναχός». «Να πάς να υπηρετήσης την θητεία σου!».τού λέω. «Στον στρατό δεν είναι όπως στο σπίτι μου», μου λέει. «Καλά που μου τόπες, παλληκάρι, δεν τόξερα, για να το λέω και στους άλλους!».Εν τω μεταξύ να τον ψάχνουν οι δικοί του. Μετά από λίγες μέρες ξαναπέρασε πρωί-πρωί. Ήταν Κυριακή του Θωμά. «Σε θέλω», μου λέει. «Τί θέλεις; του λέω. Που εκκλησιάστηκες;». «Πουθενά», μου λέει. «Σήμερα, Κυριακή του Θωμά, στα Μοναστήρια κάνουν Αγρυπνία και εσύ δεν πήγες; Και θέλεις να γίνης καλόγερος; Που ήσουν;». «Κάθησα στο ξενοδοχείο. Ήταν ήσυχα, στα Μοναστήρια έχει θόρυβο!». «Και τώρα τί θα κάνης;». «Σκέφτομαι να πάω στο Σινά, γιατί θέλω σκληρή ζωή». «Κάνε λίγη υπομονή», του λέω. Πάω μέσα, παίρνω ένα τσουρέκι που μου είχαν φέρει και του το δίνω. «Πάρε αυτό το μαλακό τσουρέκι, του λέω, για να κάνης σκληρή ζωή, και φύγε!». Αυτοί είναι οι νέοι σήμερα. Δεν ξέρουν τί ζητούν. Στρίμωγμα δεν σηκώνουν καθόλου. Που να θυσιασθούν μετά;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι στον στρατό πόσες φορές παρουσιαζόταν μία ανάγκη και άκουγες: «Κύριε Διοικητά, να πάω εγώ αντί γι’ αυτόν, αυτός είναι παντρεμένος, έχει παιδιά, να μη μείνουν τα παιδιά του στον δρόμο». Να παρακαλούν τον Διοικητή να πάνε αυτοί στην θέση του, στην πρώτη γραμμή! Χαίρονταν να σκοτωθούν αυτοί και να μη σκοτωθή ο άλλος και αφήση τα παιδιά του στον δρόμο! Που τώρα να κάνη κανείς τέτοια θυσία! Σπάνιο πράγμα! Μία φορά είχαμε μείνει από νερό σε μία τοποθεσία. Είδε ο Διοικητής στον χάρτη ότι στο τάδε σημείο υπήρχε νερό. Εκεί όμως ήταν οι αντάρτες.Μας λέει: «Εδώ κοντά έχει νερό, αλλά είναι πολύ επικίνδυνα. Ποιός θα πάη να γεμίση μερικά παγούρια; ούτε φως δεν θα ανάψη». Πετάγεται ο ένας: «Θα πάω εγώ, κύριε Διοικητά», ο άλλος «εγώ», ο άλλος «εγώ»! Όλοι δηλαδή ζητούσαν να πάνε! Και την νύχτα, χωρίς φώς, είναι ο τρόμος πολύς. «Δεν μπορείτε να πάτε και όλοι!».λέει ο Διοικητής. Θέλω να πώ, κανείς δεν σκέφθηκε τον εαυτό του. Δεν τραβιόταν ο ένας να πή: «Κύριε Διοικητά, μου πονάει το πόδι», ο άλλος «μού πονάει το κεφάλι»ή «είμαι κουρασμένος». Όλοι θέλαμε να πάμε, και ας κινδύνευε η ζωή μας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα υπάρχει ένα πνεύμα χλιαρό, καθόλου ανδρισμός, καθόλου θυσία. Όλα τα μετέτρεψαν με την σημερινή βλαμμένη λογική. Και βλέπεις, ενώ παλιά πήγαιναν εθελοντές στον στρατό, τώρα παίρνουν τρελλάδικο χαρτί, για να μην υπηρετήσουν. Κοιτάζουν τί να κάνουν, για να μην πάνε στρατιώτες. Που πρώτα; Είχαμε έναν λοχαγό, είκοσι τριών ετών ήταν, αλλά ήταν παλληκάρι! Μία φορά τον πήρε τηλέφωνο ο πατέρας του, που ήταν απόστρατος αξιωματικός, και του είπε ότι σκέφτεται να φροντίση να φύγη από την πρώτη γραμμή και να πάη στα μετόπισθεν. Έβαλε τις φωνές ο λοχαγός. «Ντροπή σου, πατέρα, να λές εσύ τέτοια πράγματα! Οι κηφήνες κάθονται». Είχε ειλικρίνεια, τιμιότητα, παλληκαριά πολλή, που ξεπερνούσε τα όρια, έτρεχε μπροστά. Η χλαίνη του ήταν κόσκινο από τις σφαίρες, και δεν είχε σκοτωθή. Όταν απολύθηκε, πήρε την χλαίνη μαζί του, να την έχη για ενθύμιο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αδιάκριτη αγάπη αχρηστεύει τα παιδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχω προσέξει ότι τα σημερινά παιδιά, ιδίως αυτά  που σπουδάζουν, παθαίνουν ζημιά από τα σπίτια τους. Ενώ είναι καλά παιδιά, αχρηστεύονται. Δεν σκέφτονται, έχουν μία αναισθησία. Τα χαραμίζουν, τα χαλούν οι γονείς. Επειδή οι γονείς πέρασαν δύσκολα χρόνια, θέλουν τα παιδιά τους να μη στερηθούν εκείνο, να μη στερηθούν το άλλο. Δεν καλλιεργούν το φιλότιμο στα παιδιά, ώστε να χαίρωνται όταν στερούνται. Φυσικά με καλό λογισμό το κάνουν. Το να τα στερήσουν από κάτι, χωρίς τα παιδιά να το καταλαβαίνουν, είναι βάρβαρο. Αλλά να τα βοηθήσουν να αποκτήσουν μοναχική συνείδηση και μόνα τους να χαίρωνται που στερούνται κάτι, αυτό είναι πολύ καλό. Τώρα με την καλωσύνη τους, με την αδιάκριτη καλωσύνη τους, τα αποβλακώνουν. Τα συνηθίζουν να τους τα πηγαίνουν όλα στο χέρι, ακόμη και το νερό, για να διαβάσουν και να μη χασομερήσουν, και τα αχρηστεύουν, και τα αγόρια και τα κορίτσια. Έπειτα τα παιδιά, και όταν δεν διαβάζουν, τα θέλουν όλα στο χέρι. Και το κακό αρχίζει από τις μανάδες. «Εσύ, παιδί μου, να διαβάσης. Εγώ θα σού φέρω και τις κάλτσες, θα σού πλύνω και τα πόδια. Πάρε το γλυκό, πάρε τον καφέ»! Και δεν καταλαβαίνουν τα παιδιά πόσο κουρασμένη είναι η μάνα που τα προσφέρει όλα αυτά, επειδή δεν κοπιάζουν. Μετά αρχίζουν, μίας χρήσεως πιάτα, μίας χρήσεως ρούχα, πίτσες να τρώνε –ούτε να τις τυλίγουν στο χαρτί δεν ξέρουν!... Έτσι γίνονται τελείως άχρηστοι άνθρωποι. Βαριούνται μετά που ζούν. Το κορδόνι τους να λυθή, «μάνα, να μου δέσης το κορδόνι», λένε! Το πατάνε εν τω μεταξύ! Τέτοια παιδιά τί προκοπή να κάνουν; Αυτά  ούτε για γάμο ούτε για καλογερική κάνουν. Γι’ αυτό λέω στις μητέρες: «Μήν αφήνετε τα παιδιά να διαβάζουν όλη μέρα. Διαβάζουν-διαβάζουν, ζαλίζονται. Να κάνουν ένα τέταρτο, μισή ώρα διακοπή, για να κάνουν και καμμιά δουλίτσα στο σπίτι, για να ξεζαλίζωνται και λίγο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτή η κακή συνήθεια των σημερινών νέων μεταφέρεται και στον Μοναχισμό. Και βλέπετε σε Μοναστήρι να είναι επτά γραμματείς – και όλοι μορφωμένοι οι νέοι – και ο παλιότερος μαζί. Παλιά ήταν ένας γραμματεύς, και αυτός δεν είχε πάει ούτε δυο τάξεις στο Γυμνάσιο και έβγαζε όλη την δουλειά. Και τώρα να είναι επτά και να είναι πνιγμένοι στην δουλειά, να μην μπορούν να κάνουν ούτε τα πνευματικά τους, να είναι και ο παλιός να τους βοηθάη!
- type: h2
  initial:
    ru: ''
  text:
    ru: Κανονάρχισμα από σκοτεινές δυνάμεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τα καημένα τα παιδιά τα καταστρέφουν σήμερα με θεωρίες διάφορες. Γι’ αυτό είναι αναστατωμένα, ζαλισμένα. Άλλο θέλει να κάνη το παιδί, άλλο κάνει. Αλλού θέλει να πάη, αλλού το πάει το ρεύμα της εποχής. Μεγάλη προπαγάνδα γίνεται από σκοτεινές δυνάμεις που κατευθύνουν όσα παιδιά δεν τους κόβει πολύ το μυαλό. Στα σχολεία μερικοί δάσκαλοι λένε: «Για να έχετε πρωτοβουλία, να μη σέβεστε, να μην υποτάσσεστε στους γονείς», και τα αχρηστεύουν. Μετά τα παιδιά δεν ακούνε ούτε γονείς ούτε δασκάλους. Και είναι δικαιολογημένα, γιατί νομίζουν πώς έτσι πρέπει να κάνουν. Τα υποστηρίζει και το κράτος, τα κανοναρχούν, τα εκμεταλλεύονται και οι άλλοι που δεν νοιάζονται ούτε για Πατρίδα ούτε για οικογένεια ούτε για τίποτε, για να πραγματοποιήσουν τα σχέδιά τους. Έ, αυτό λίγο-πολύ έχει κάνει πολύ κακό στην νεολαία σήμερα, πάρα πολύ κακό, μέχρι που καταλήγουν τα παιδιά να έχουν αρχηγό τον διάβολο με τα κέρατα! Η σατανολατρία έχει εξαπλωθή πολύ. Ακούς σε μερικά κέντρα όλη την νύχτα να τραγουδούν: «Σατανά, σε λατρεύουμε, δεν θέλουμε τον Χριστό. Εσύ μας τα δίνεις όλα». Φοβερό! Τί σάς δίνει και τί σάς παίρνει, κακόμοιρα παιδιά!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μικρά παιδιά αγριεμένα, με τους καφέδες, με τα τσιγάρα… Που να δής βλέμμα λαμπερό, Χάρη Θεού στο πρόσωπό τους! Είχε δίκαιο ένας αρχιτέκτων, όταν είπε σε μία ομάδα παιδιών που είχε φέρει στο Άγιον Όρος: «Τα μάτια μας είναι σαν τα μάτια του χαλασμένου ψαριού». Είχε έρθει στο Όρος με καμμιά δεκαριά παιδιά, από δεκαοκτώ μέχρι είκοσι πέντε χρονών περίπου. Επειδή αυτός είχε πάρει μία πνευματική στροφή, μετά λυπόταν τα παιδιά που ζούσαν άσωτη ζωή. Κατάφερε μερικά, τα έπεισε και τους έβγαλε τα εισιτήρια να έρθουν στο Άγιο Όρος. Έφευγα από το Καλύβι και με συνάντησαν στον δρόμο. Τους λέω: «Φεύγω τώρα, αλλά ας καθήσουμε λίγο εδώ», και καθήσαμε κάπου. Εκείνη την ώρα έρχονταν και μερικά παιδιά από την Αθωνιάδα. «Καθήστε και εσείς λίγο εδώ», λέω. Κάθησαν και αυτά  εκεί. Λέει ο αρχιτέκτων μετά στην παρέα του: «Παρατηρήσατε κάτι;». Εκείνα απόρησαν. «Για ρίξτε μία ματιά ο ένας στο πρόσωπο του άλλου, λέει, και μετά ρίξτε και μία ματιά στα άλλα παιδιά. Για δέστε τα μάτια τους πώς γυαλίζουν και δέστε τα μάτια τα δικά μας πώς είναι σαν τα μάτια του χαλασμένου ψαριού». Και πράγματι, όταν πρόσεξα και εγώ, έτσι ήταν, μάτια χαλασμένων ψαριών. Θολά, αλλοιωμένα… Ενώ τα μάτια των άλλων παιδιών έλαμπαν! Γιατί τα παιδιά της Σχολής κάνουν μετάνοιες, κάνουν Ακολουθίες. Ο άνθρωπος καθρεφτίζεται στα μάτια. Γι’ αυτό και ο Χριστός είπε: «Ο λύχνος του σώματος εστίν ο οφθαλμός»[127]. Πόσα μικρά παιδιά έρχονται στο Άγιον Όρος ή πηγαίνουν σε άλλα Μοναστήρια και γίνονται μοναχοί, και πάρ΄ όλο που – πώς να πη κανείς; – δεν έχουν καραμέλλες στα Μοναστήρια, έχουν όμως τέτοια χαρά που ακτινοβολεί το πρόσωπό τους. Ενώ στον κόσμο έχουν ό,τι θέλουν, αλλά κόλαση ζούν, είναι βασανισμένα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μάς έχουν έρθει διάφορα ρεύματα από παντού. Από τα ανατολικά μέρη ο Ινδουϊσμός και άλλες αποκρυφιστικές θρησκείες, από τον Βορρά ο Κομμουνισμός, από την Δύση ένα σωρό θεωρίες, από τον Νότο, από τους Αφρικανούς, μαγείες και τόσα άλλα καρκινώματα. Ένα παιδί χτυπημένο από τέτοια ρεύματα ήρθε μία μέρα στο Καλύβι. Κατάλαβα ότι οι προσευχές της μάνας του το έφεραν. Αφού μιλήσαμε αρκετά, του λέω: «Κοίταξε, παλληκάρι μου, ά βρής έναν Πνευματικό να εξομολογηθής και να χρισθής και να σε βοηθάη τώρα στις αρχές. Πρέπει να σε χρίσουν, γιατί αρνήθηκες τον Χριστό». Έκλαιγε το καημένο. «Κάνε προσευχή, Πάτερ, μου λέει, γιατί δεν μπορώ να τα αποβάλλω αυτά. Μου έχουν κάνει πλύση εγκεφάλου. Το καταλαβαίνω ότι οι προσευχές της μάνας μου με έφεραν εδώ». Πόσο βοηθάνε οι προσευχές της μάνας! Αχρηστεύονται τα καημένα, όταν τα τυλίξουν, και μετά τα πιάνει φόβος, άγχος και ξεσπάνε στα ναρκωτικά κ.λπ. Από τον έναν γκρεμό στον άλλον. Ο Θεός να βάλη το χέρι Του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συμφέρει να τους λέη κανείς ότι είναι σατανικά αυτά  τα πράγματα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς δεν συμφέρει; Αλλά θέλει με καλό τρόπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα μπορέσουν τέτοιοι νέοι να γνωρίσουν τον Χριστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πώς να γνωρίσουν τον Χριστό, αφού, πριν γνωρίσουν την Ορθοδοξία, πηγαίνουν στην Ινδία στους Γκουρούδες, κάθονται δυό-τρία χρόνια, ζαλίζονται με τις μαγείες, μαθαίνουν εκεί ότι υπάρχει μυστικισμός στην Ορθοδοξία και έρχονται μετά εδώ και ζητούν να δούν φώτα, να ζήσουν ανώτερες καταστάσεις κ.λπ.; Και άμα ρωτήσης: «πόσον καιρό έχεις να κοινωνήσης;», «δέν θυμάμαι, λέει, αν η μητέρα μου με είχε κοινωνήσει, όταν ήμουν μικρός». «Εξομολογήθηκες ποτέ;». «Δεν με απασχολεί αυτό το θέμα». Έμ, πώς θα γίνη χωριό έτσι; Τίποτε από την Ορθοδοξία δεν ξέρουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, και πώς θα βοηθηθούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από την στιγμή που λένε «κατεστημένο» την Εκκλησία, ως να βοηθηθούν; Καταλαβαίνεις πόσο μπορούμε έτσι να συνεννοηθούμε! Όσοι νέοι όμως έχουν καλή διάθεση βοηθιούνται και πλησιάζουν στην Εκκλησία.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Μήν τα εγγίζετε τα παιδιά!».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τα μικρά παιδιά που μεγαλώνουν τώρα χωρίς πειθαρχία, τί θα γίνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έχουν λίγα ελαφρυντικά. Οι γονείς που δεν καταλάβαιναν την πειθαρχία αφήνουν τώρα τα παιδιά τους με μία ελευθερία και τα κάνουν τελείως αλητάκια. Μία κουβέντα λές, πέντε σου λένε, και με μία αναίδεια! Αυτά  μπορεί να γίνουν εγκληματίες. Σήμερα τα ξεβιδώνουν τελείως τα παιδιά. Ελευθερία! «Μήν τα εγγίζετε τα παιδιά!».Και τα παιδιά λένε: «Που θα βρούμε αλλού τέτοιο καθεστώς;». Επιδιώκουν δηλαδή να τα κάνουν ανταρτάκια, να μη θέλουν τους γονείς, να μη θέλουν τους δασκάλους, να μη θέλουν τίποτε, να μην ακούν κανέναν. Αυτό τους διευκολύνει στον σκοπό τους. Αν δεν τα κάνουν ανταρτάκια, πώς μετά τα παιδιά θα τα κάνουν όλα κομμάτια; Και βλέπεις, τα καημένα είναι σχεδόν δαιμονισμένα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν στην πνευματική ζωή η ελευθερία δεν αξιοποιήθηκε, θα αξιοποιηθή στην κοσμική ζωή; Τί να την κάνης τέτοια ελευθερία; Είναι καταστροφή. Γι’ αυτό και το κράτος πάει όπως πάει. Μπορούν οι σημερινοί άνθρωποι να αξιοποιήσουν την ελευθερία που τους δίνεται; Η ελευθερία, όταν οι άνθρωποι δεν είναι σε θέση να την αξιοποιήσουν στην πρόοδο, είναι καταστροφή. Η κοσμική εξέλιξη με την αμαρτωλή αυτή ελευθερία έφερε την πνευματική σκλαβιά. Ελεθερία πνευματική είναι η πνευματική υποταγή στο θέλημα του Θεού. Και βλέπεις, ενώ η υπακοή είναι ελευθερία, ο πειρασμός όμως από κακία την παρουσιάζει σαν σκλαβιά και αντιδρούν τα παιδιά, ιδίως της εποχής μας, που έχουν δηλητηριασθή από το πνεύμα της ανταρσίας. ΕίΝαί, φυσικά, και κουρασμένα από τα διάφορα συστήματα του 20ου αιώνος, που δυστυχώς συνέχεια παραμορφώνουν την ωραία φύση του Θεού και τα πλάσματά Του και τα γεμίζουν από άγχος και τα απομακρύνουν από την χαρά, τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εμείς ξέρετε τί τραβήξαμε, όταν απολυθήκαμε από τον στρατό; Αν ήταν τότε τα σημερινά παιδιά, θα τα είχαν κάνει όλα γυαλιά-καρφιά. Ήταν το 1950 που τελείωσε ο ανταρτοπόλεμος. Απολυθήκαμε πολλές κλάσεις μαζί. Άλλος είχε τεσσεράμισι, άλλος τέσσερα, άλλος τριάμισι χρόνια μέσα στον πόλεμο. Και σκεφθήτε, μετά από τόση ταλαιπωρία, φθάνουμε στην Λάρισα, πάμε στα Κέντρα Διερχομένων και τα βρίσκουμε γεμάτα. Όποτε πάμε στα ξενοδοχεία. Αλλά και εκεί δεν μας δέχονταν. Σού λέει: «Στρατός! Που να μείνη! Θα λερωθούν οι κουβέρτες!».–ενώ θα πληρώναμε. Ήταν Μάρτιος μήνας και έκανε κρύο! Ευτυχώς ένας αξιωματικός μας έσωσε, ας είναι καλά! Πήγε, έμαθε πότε φεύγουν τα τραίνα, πότε κάνουν μανούβρες κ.λπ., συνεννοήθηκε και μας έβαλε μέσα στα τραίνα! «Την νύχτα, λέει, θα κάνουν μανούβρες, αλλά μη φοβηθήτε, την τάδε ώρα το πρωί θα ξεκινήσουν». Και όλη την νύχτα κουνιόνταν. Τελικά ερχόμαστε στην Θεσσαλονίκη. Μερικοί που ήταν από ΄δώ κοντά πήγαν στον τόπο τους. Οι άλλοι πήγαμε στα Κέντρα Διερχομένων, αλλά ήταν γεμάτα. Πάμε στα ξενοδοχεία, και εδώ τίποτε! Τους παρακαλάω στο ξενοδοχείο: «Να μου δώσετε μία καρέκλα να καθήσω μέσα και θα σάς πληρώσω διπλάσιο από ό,τι θα πλήρωνα για το κρεββάτι!». «Όχι, δεν γίνεται!», μου λένε. Φοβόνταν μήπως κανείς έβλεπε ότι κρατούσαν στην καρέκλα στρατιώτη και τους κατήγγελλε. Και να κάθεσαι έξω, να ακουμπάς όρθιος στον τοίχο, να βγάλης έτσι την νύχτα! Και έβλεπες στρατιώτες να είναι οι καημένοι στο πεζοδρόμιο, έξω από τα ξενοδοχεία, ακουμπισμένοι στους τοίχους! Σε όλα τα πεζοδρόμια υπήρχε στρατός, σαν να έκαναν παρέλαση! Κατάλαβες; Αν ήταν οι σημερινοί νέοι θα είχαν κάψει την Λάρισα, όλη την Θεσσαλία και την Μακεδονία! Εδώ, χωρίς να έχουν καμμιά δυσκολία σήμερα, και τί κάνουν! καταλήψεις, καταστροφές… Και εκείνα, τα καημένα τα παιδιά, ούτε καν είχαν λογισμό. Ενίωθαν βέβαια μία πικρία, αλλά χωρίς να έχουν λογισμό να κάνουν τίποτε το κακό. Και να έχουν περάσει ταλαιπωρία μεγάλη έξω στα χιόνια. Να είναι σακατεμένοι από τον πόλεμο – τί θυσία οι καημένοι! – και τελικά το τελευταίο «ευχαριστώ» ήταν να κοιμηθούνε έξω! Και κάνω μία σύγκριση, πώς ήταν οι νέοι τότε και που βρίσκονται σήμερα… Ούτε πενήντα χρόνια δεν πέρασαν και πώς άλλαξε ο κόσμος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η σημερινή νεολαία μοιάζει με το μοσχαράκι που είναι δεμένο στο λιβάδι και κλωτσάει, τραβάει συνέχεια το σχοινί, βγάζει τον πάσσαλο και αρχίζει να τρέχη, αλλά σκαλώνει κάπου και περδικλώνεται άσχημα και στο τέλος το κατασπαράζουν τα άγρια θηρία. Το φρένο βοηθάει, όταν είναι μικρό το παιδί. Το βλέπεις, ανεβαίνει πάνω στον τοίχο και υπάρχει φόβος να σκοτωθή. «Μή, μή», φωνάζεις, του δίνεις και κανένα σκαμπίλι. Μετά δεν σκέφτεται ότι θα σκοτωθή, σκέφτεται μη φάη το σκαμπίλι και προσέχει. Τώρα δεν υπάρχουν ούτε στα σχολεία τιμωρίες ούτε στον στρατό καψώνια. Γι’ αυτό οι νέοι παιδεύουν τους γονείς και το έθνος. Στον στρατό παλιά, όσο πιο σκληροί ήταν οι αρχηγοί στην Εκπαίδευση, τόσο πιο πολλή παλληκαριά έδειχναν οι στρατιώτες στην μάχη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο νέος έχει ανάγκη από έναν πνευματικό οδηγό, τον οποίο να συμβουλεύεται και να ακούη, για να πορεύεται με πνευματική ασφάλεια, χωρίς κινδύνους, φόβους και αδιέξοδα. Κάθε άνθρωπος, όσο μεγαλώνει, όσο περνάει η ηλικία του, αποκτά πείρα και από τον εαυτό του και από τους άλλους. Ένας νέος στερείται αυτήν την πείρα. Ένας μεγάλος την πείρα που απέκτησε από τον εαυτό του και από τους άλλους την χρησιμοποιεί, για να βοηθήση τον άπειρο νέο, για να μην κάνη γκάφες. Ο νέος, όταν δεν ακούη, κάνει πειράματα με τον εαυτό του. Ενώ, αν ακούση, κέρδος θα έχη. Είχαν έρθει στο Καλύβι μερικά παιδιά από μία χριστιανική Οργάνωση και φώναζαν με μία αυτοπεποίθηση: «Δεν έχουμε ανάγκη από κανέναν, θα βρούμε μόνοι μας τον δρόμο μας!». Ποιός ξέρει; Θα είχαν ζορισθή και είχαν κατά κάποιο τρόπο επαναστατήσει. Όταν ήταν να φύγουν, με ρώτησαν πώς να κατεβούν στον δημόσιο, για να πάρουν τον δρόμο για την Μονή Ιβήρων. «Από που θα πάμε;», λένε. «Καλά, βρέ παιδιά, τους λέω, εσείς είπατε ότι θα τον βρήτε μόνοι σας τον δρόμο, δεν έχετε ανάγκη από κανέναν. Έτσι δεν είπατε προηγουμένως; Τουλάχιστον αυτόν τον δρόμο και να τον χάσετε, λίγο θα ταλαιπωρηθήτε, κάποιον θα βρήτε παρακάτω και θα σάς πή: «Από εδώ πάει». Τον άλλον τον δρόμο για πάνω, για τον Ουρανό, πώς θα τον βρήτε μόνοι σας χωρίς οδηγό;». Ο ένας από αυτούς είπε: «Σαν νάχη δίκαιο ο Γέροντας».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να περάσουν οι νέοι στις εξετάσεις της αγνότητος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ήρθαν δυό-τρείς φοιτήτριες σήμερα και μου είπαν: «Γέροντα, κάντε προσευχή να περάσουμε στις εξετάσεις». Και εγώ τις είπα: «Θα ευχηθώ να περάσετε στις εξετάσεις της αγνότητος. Αυτό είναι το πιο βασικό. Όλα τα άλλα βολεύονται μετά». Καλά δεν τις είπα; Ναί, είναι μεγάλο πράγμα να βλέπης στα πρόσωπα των νέων σήμερα την σεμνότητα, την αγνότητα! Πολύ μεγάλο πράγμα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έρχονται μερικές κοπέλες οι καημένες τραυματισμένες. Ζούν άτακτα με νέους, δεν καταλαβαίνουν πώς ο σκοπός τους δεν είναι καθαρός και σακατεύονται. «Τί να κάνω, Πάτερ;», με ρωτούν. «Ο ταβερνιάρης, τις λέω, έχει φίλο τον μπεκρή, αλλά γαμπρό δεν τον κάνει στην κόρη του. Να σταματήσετε τις σχέσεις. Αν σάς αγαπούν πραγματικά, θα το εκτιμήσουν. Αν σάς αφήσουν, σημαίνει ότι δεν σάς αγαπούν και θα κερδίσετε χρόνο».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο πονηρός εκμεταλλεύεται την νεανική ηλικία, που έχει επί πλέον και την σαρκική επανάσταση, και προσπαθεί να καταστρέψη τα παιδιά στην δύσκολη αυτή περίοδο που περνούν. Το μυαλό είναι ανώριμο ακόμη, υπάρχει απειρία μεγάλη και απόθεμα πνευματικό καθόλου. Γι’ αυτό ο νέος πρέπει πάντα να αισθάνεται ως ανάγκη τις συμβουλές των μεγαλυτέρων σ΄ αυτήν την κρίσιμη ηλικία, για να μη γλιστρήση στον γλυκό κατήφορο της κοσμικής κατηφόρας, που στην συνέχεια γεμίζει την ψυχή από άγχος και την απομακρύνει αιώνια από τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καταλαβαίνω ότι ένα φυσιολογικό παιδί, στην νεανική ηλικία, δεν είναι εύκολο να βρίσκεται σε τέτοια πνευματική κατάσταση, ώστε να μην κάνη διάκριση, «ουκ ένι άρσεν και θήλυ»[128]. Γι’ αυτό και οι πνευματικοί Πατέρες συνιστούν να μην κάνουν συντροφιά τα αγόρια με τα κορίτσια, όσο και πνευματικά και εάν είναι, γιατί η ηλικία είναι τέτοια που δεν βοηθάει, και ο πειρασμός εκμεταλλεύεται την νεότητα. Γι’ αυτό συμφερώτερο είναι ο νέος να θεωρηθή ακόμη και κουτός από τα κορίτσια (ή η νέα από τα αγόρια) για την πνευματική του φρονιμάδα και αγνότητα και να σηκώνη και αυτόν τον βαρύ σταυρό. Γιατί αυτός ο βαρύς σταυρός κρύβει όλη την δύναμη και την σοφία του Θεού και τότε ο νέος θα είναι πιο δυνατός από τον Σαμψών[129]και πιο σοφός από τον σοφό Σολομώντα[130]. Καλύτερα είναι, όταν βαδίζη, να προσεύχεται και να μην κοιτά δεξιά και αριστερά, ακόμη και αν πρόκειται να παρεξηγηθή από συγγενικά πρόσωπα, γιατί δήθεν τους περιφρόνησε και δεν τους μίλησε, παρά να περιεργάζεται και να βλάπτεται και να παρεξηγηθή ακόμη και από τους κοσμικούς ανθρώπους που σκέφτονται όλο πονηρά. Χίλιες φορές καλύτερα να φεύγη σαν το αγρίμι από τους ανθρώπους μετά τον εκκλησιασμό, για να διατηρήση την πνευματική του φρονιμάδα και ό,τι απεκόμισε από τον εκκλησιασμό, παρά να κάθεται και να χαζεύη στις γούνες (ή στις γραβάτες η νέα) και να αγριέψη πνευματικά από το γρατσούνισμα που θα του κάνη ο εχθρός στην καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι αλήθεια ότι ο κόσμος δυστυχώς έχει σαπίσει καί, από όπου και αν περάση μία ψυχή που θέλει να διατηρηθή αγνή, θα λερωθή. Με την διαφορά όμως ότι ο Θεός δεν θα ζητήση τα ίδια με αυτά  που ζητούσε την παλιά εποχή από έναν Χριστιανό που ήθελε να διατηρηθή αγνός. Χρειάζεται ψυχραιμία, και ο νέος να κάνη ό,τι μπορεί, να αγωνισθή, για να αποφεύγη τα αίτια, και ο Χριστός μας θα βοηθήση από εκεί και πέρα. Ο θείος έρως, αν φουντώση στην ψυχή του, είναι τόσο πολύ θερμός που έχει την δύναμη να καίη κάθε άλλη επιθυμία και κάθε άσχημη εικόνα. Όταν ανάψη αυτή η φωτιά, τότε αισθάνεται και τις θείες εκείνες ηδονές, που δεν μπορεί κανείς να τις συγκρίνη με καμμιά άλλη ηδονή. Όταν γευθή το ουράνιο εκείνο μάννα, δεν θα του κάνουν καμμιά εντύπωση πλέον τα άγρια ξυλοκέρατα. Γι’ αυτό πρέπει να πιάση γερά το τιμόνι και να κάνη τον σταυρό του και να μη φοβάται. Μετά από τον μικρό του αγώνα θα λάβη και την ουράνια τρυφή. Την ώρα του πειρασμού θέλει παλληκαριά, και ο Θεός θαυματουργικά θα βοηθήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου είχε διηγηθή ο Γερό-Αυγουστίνος[131]: Είχε πάει σαν αρχάριος σε ένα Μοναστήρι στην Ρωσία, στην πατρίδα του. Εκεί ήταν όλοι σχεδόν γεροντάκια και έστειλαν αυτόν ως διακονητή, για να βοηθάη έναν υπάλληλο της Μονής στο ψάρεμα, γιατί η Μονή συντηρείτο από την αλιεία. Μία μέρα λοιπόν ήρθε η κόρη του υπαλλήλου και είπε στον πατέρα της να πάη γρήγορα στο σπίτι για μία επείγουσα δουλειά και κάθησε εκείνη να βοηθήση. Ο πειρασμός όμως την είχε κυριεύσει την ταλαίπωρη καί, χωρίς να σκεφθή, όρμισε επάνω στον δόκιμο με αμαρτωλές διαθέσεις. Εκείνη την στιγμή τα έχασε ο Αντώνιος –αυτό ήταν το κατά κόσμον όνομά του-, γιατί ήταν ξαφνικό. Έκανε τον σταυρό του και είπε: «Χριστέ μου, καλύτερα να πνιγώ παρά να αμαρτήσω»καί πετάχτηκε από την όχθη μέσα στο βαθύ ποτάμι! Αλλά ο Καλός Θεός βλέποντας τον μεγάλο ηρωισμό του αγνού νέου, που ενήργησε σαν νέος Άγιος Μαρτινιανός[132], για να διατηρηθή αγνός, τον κράτησε επάνω στο νερό, χωρίς καν να βραχή! «Ενώ πετάχθηκα, μου έλεγε, με το κεφάλι κάτω, δεν κατάλαβα πώς βρέθηκα όρθιος επάνω στο νερό, χωρίς να βραχούν ούτε τα ρούχα μου!».Εκείνη την στιγμή ενίωσε και μία εσωτερική γαλήνη με μία ανέκφραστη γλυκύτητα, που εξαφάνισε τελείως κάθε λογισμό αμαρτωλό και κάθε ερεθισμό σαρκικό, που του είχε δημιουργήσει προηγουμένως με τις άσεμνες χειρονομίες της η κοπέλα. Όταν είδε μετά η κοπέλα επάνω στο νερό όρθιο τον Αντώνιο, άρχισε να κλαίη μετανοιωμένη για το σφάλμα της και συγκινημένη για το μεγάλο αυτό θαύμα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Χριστός δεν ζητάει μεγάλα πράγματα, για να μας βοηθήση στον αγώνα μας. Τιποτένια πράγματα περιμένει από μας. Μου έλεγε ένας νέος ότι πήγε στην Πάτμο να προσκυνήση και ο πειρασμός του έστησε εκεί μία παγίδα. Καθώς προχωρούσε, μία τουρίστρια όρμησε και τον αγκαλίασε. Αυτός την έσπρωξε πέρα και είπε: «Χριστέ μου, εγώ ήρθα εδώ να προσκυνήσω, δεν ήρθα για έρωτα»καί έφυγε. Το βράδυ στο ξενοδοχείο, την ώρα που έκανε την προσευχή του, είδε τον Χριστό μέσα στο άκτιστο φώς. Είδατε με ένα σπρώξιμο τί αξιώθηκε; Άλλος χρόνια αγωνίζεται και κάνει άσκηση μεγάλη, και αν αξιωθή κάτι τέτοιο! Και αυτός είδε τον Χριστό, μόνο γιατί αντέδρασε στον πειρασμό. Φυσικά αυτό πολύ τον δυνάμωσε πνευματικά. Μετά είδε την Αγία Μαρκέλλα, τον Άγιο Ραφαήλ, τον Άγιο Γεώργιο δυό-τρείς φορές. Ήρθε μία μέρα και μου λέει: «Κάνε προσευχή, Πάτερ, να δώ πάλι τον Άγιο Γεώργιο. Θέλω λίγη παρηγοριά, δεν έχω παρηγοριά άπ΄ αυτόν τον κόσμο!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και βλέπεις άλλα παιδιά σε τί κατάσταση φθάνουν! Είχε έρθει μία φορά στο Καλύβι ένας νεαρός με τον θείο του που ήταν ηλικιωμένος και μου λέει: «Κάνε προσευχή για μία κοπέλα. Έσπασε την σπονδυλική της στήλη σε δυστύχημα. Οδηγούσε ο πατέρας της και τον πήρε ο ύπνος. Εκείνος σκοτώθηκε και η κοπέλα χτύπησε. Να σού δώσω και μία φωτογραφία της». «Δεν χρειάζεται», λέω. Αυτός εν τω μεταξύ επέμενε, όποτε παίρνω την φωτογραφία και τί να δώ! Η κοπέλα ήταν ξαπλωμένη κάτω και την κρατούσαν δύο. «Τί την έχει αυτός;», ρωτάω τον νεαρό. «Φίλη», μου λέει. «Αυτός τί είναι; Θα την πάρη;». «Όχι, λέει, είναι φίλοι». «Μήν τα παρεξηγής τα παιδιά, μου λέει ο θείος του, έτσι είναι σήμερα οι νέοι». «Θα κάνω προσευχή, είπα από μέσα μου, να διορθωθή όχι η σπονδυλική της στήλη αλλά το μυαλό της και το δικό σου το μυαλό, χαμένε άνθρωπε». Που είναι ο σεβασμός; Έπρεπε να τον βρίση ο θείος του. Πνευματικά παιδιά…, να έχει Πνευματικό και να φθάση σε τέτοια κατάσταση! Ακόμη και να την πάρη, δεν υπήρχε λόγος να είναι τεντωμένη έτσι και στους δύο και ο άλλος να μου δείχνη την φωτογραφία! Και δεν σκέφτεται ότι δεν είναι σωστό αυτό το πράγμα. Εμένα δεν με πειράζει, αλλά δεν είναι σωστό. Τί οικογένεια θα δημιουργήσουν αυτά  τα παιδιά; Ο Θεός να φωτίση την νεολαία να συνέλθη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιά με τί θυσίες κρατούσαν την αγνότητά τους οι κοπέλες! Θυμάμαι, στον πόλεμο είχαν αγγαρέψει μερικούς χωρικούς με τα ζώα τους και είχαν αποκλεισθή σε ένα ύψωμα από τα χιόνια. Οι κάτω από τα χιονισμένα έλατα έκαναν κάτι υπόστεγα με κλωνάρια από έλατα, για να προφυλαχθούν από το κρύο. Οι γυναίκες πάλι αναγκάσθηκαν να προστατευθούν από συγχωριανούς, γνωστούς ανθρώπους. Μία κοπέλα και μία γριά ήταν από κάποιο μακρινό χωριό και αναγκάσθηκαν και αυτές να μπούν σε ένα από αυτά  τα ελάτινα υπόστεγα. Αλλά δυστυχώς υπάρχουν μερικοί άπιστοι και δειλοί. Οι οποίοι δεν συγκλονίζονται ακόμη και εν καιρώ πολέμου. Δεν πονάνε για τους διπλανούς τους που τραυματίζονται ή σκοτώνονται, αλλά, εάν βρουν ευκαιρία, επιδιώκουν ακόμη και να αμαρτήσουν, γιατί φοβούνται μήπως σκοτωθούν και δεν προλάβουν να γλεντήσουν, ενώ έπρεπε, τουλάχιστον εν ώρα κινδύνου, να μετανοήσουν. Ένας σαν και αυτούς που εν καιρώ πολέμου, όπως ανέφερα, δεν σκέφτονται να μετανοήσουν, αλλά να αμαρτήσουν, ενοχλούσε την κοπέλα τόσο άσχημα που αναγκάσθηκε να φύγη. Προτίμησε να ξυλιάση, ακόμη και να πεθάνη έξω στα χιόνια, παρά να χάση την τιμή της. Βλέποντας η καημένη η γριά ότι έφυγε η κοπέλα, ακολούθησε και αυτή τα ίχνη της και την βρήκε τριάντα λεπτά μακριά, κάτω από ένα μικρό υπόστεγο ενός εξωκκλησιού του Τιμίου Προδρόμου. Ο Τίμιος Πρόδρομος ενδιαφέρθηκε για την τίμια κοπέλα και την οδήγησε στο εξωκκλησάκι του που η κοπέλα ούτε καν το ήξερε. Και στην συνέχεια τί έκανε ο Τίμιος Πρόδρομος! Παρουσιάσθηκε σ΄ έναν στρατιώτη[133], στον ύπνο του, και του είπε να πάη στο εξωκκλήσι του το συντομώτερο. Σηκώνεται λοιπόν ο στρατιώτης και ξεκινάει μέσα στην φωτισμένη νύχτα από τα χιόνια και πάει στο εξωκκλήσι, ήξερε περίπου που είναι. Τί να δη όμως! Μία γριά και μία κοπέλα καρφωμένες μέσα στο χιόνι μέχρι τα γόνατα, μελανιασμένες και ξυλιασμένες από το κρύο. Άνοιξε αμέσως το εκκλησάκι, μπήκαν μέσα και συνήλθαν κάπως. Δεν είχε τίποτε άλλο να τους προσφέρη ο στρατιώτης παρά το κασκόλ του στην γριά και από ένα γάντι στην καθεμία και τις είπε να το αλλάζουν τα χέρια. Του διηγήθηκαν μετά τον πειρασμό που συνάντησαν. «Καλά, λέει στην κοπέλα ο στρατιώτης, πώς αποφάσισες να φύγης νύχτα, μέσα στα χιόνια και σε άγνωστο μέρος;». Και εκείνη απάντησε: «Εγώ μόνον αυτό μπορούσα να κάνω και πίστευα ότι ο Χριστός θα με βοηθούσε από εκεί και πέρα». Τότε ο στρατιώτης τελείως αυθόρμητα, από πόνο και όχι απλώς για να τις παρηγορήση, λέει: «Τελείωσαν πια τα βάσανά σας. Αύριο θα είσθε στα σπίτια σας». Με τα λόγια αυτά  χάρηκαν πολύ και ζεστάθηκαν περισσότερο. Και πράγματι, ξεκίνησαν τα Λ.Ο.Μ.[134], άνοιξαν τον δρόμο και την άλλη μέρα το πρωί τα στρατιωτικά μεταγωγικά ήταν εκεί, και οι καημένες πήγαν στα σπίτια τους. Τέτοιες Ελληνοπούλες που είναι ντυμένες και με θεία Χάρη –καί όχι οι απογυμνωμένες και από θεία Χάρη – πρέπει να θαυμάζωνται και να επαινούνται. Μετά εκείνο το κτήνος –ο Θεός να με συγχωρήση – πήγε και ανέφερε στον Διοικητή ότι ο τάδε στρατιώτης έσπασε την πόρτα από το εξωκκλήσι και έβαλε μέσα τους μεταγωγικούς, δηλαδή τα μουλάρια! Του λέει ο Διοικητής: «Δεν πιστεύω αυτός να έκανε τέτοιο πράγμα!».Και τελικά κατέληξε στην φυλακή.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αληθινή αγάπη πληροφορεί τους νέους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πάντως αυτοί που ήθελαν να καταστρέψουν την κοινωνία, επίασαν τα θεμέλια, τις ρίζες, τα παιδιά· τα κατάστρεψαν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν θα σταθούν αυτά. Το κακό μόνο του καταστρέφεται. Στην Ρωσία είχαν καταστρέψει τα πάντα και όμως μετά από τρεις γενιές, βλέπεις τώρα τί γίνεται! Δεν αφήνει ο Θεός. Ούτε και τις αμαρτίες των παιδιών της σημερινής εποχής θα τις κρίνη το ίδιο με τις αμαρτίες των παιδιών της δικής μας εποχής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς συμβαίνει μερικά παιδιά που ζουν κοσμική ζωή, όταν τίθεται θέμα πίστεως, να δίνουν πολύ σωστές απαντήσεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά  τα παιδιά είχαν καλή διάθεση, αλλά δεν μπόρεσαν να φρενάρουν τον εαυτό τους και παρασύρθηκαν. Γι’ αυτό δίνουν την σωστή απάντηση. Θέλω να πώ, ένας λ.χ. θέλει να πάρη έναν δρόμο· τον θέλει, αλλά δεν μπορεί να τον τραβήξη. Και αυτόν που βλέπει να τον τραβάη, τον εκτιμάει. Αυτούς τους ανθρώπους δεν θα τους αφήση ο Θεός, γιατί δεν έχουν κακότητα. Θα έρθη η ώρα που θα έχουν την δύναμη να τραβήξουν μπροστά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς μπορεί, Γέροντα, να πλησιάση κανείς τους νέους που έχουν παραστρατήσει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την αγάπη. Αν υπάρχη αληθινή, αρχοντική αγάπη, αμέσως οι νέοι το πληροφορούνται και αφοπλίζονται. Έρχονται στο Καλύβι παιδιά, από χίλιες καρυδιές καρύδια, με διάφορα προβλήματα. Τους καλωσορίζω, τους κερνώ, τους μιλώ, και σε λίγο γινόμαστε φίλοι. Ανοίγουν την καρδιά τους και δέχονται και την δική μου αγάπη. Μερικά, τα κακόμοιρα, είναι τόσο στερημένα! Διψούν για αγάπη. Φαίνεται αμέσως που δεν ενίωσαν αγάπη ούτε από μάνα ούτε από πατέρα· δεν χορταίνουν. Έτσι άμα τα πονέσης, άμα τα αγαπήσης, ξεχνούν και τα προβλήματα, και τα ναρκωτικά ακόμη, φεύγουν και οι αρρώστιες, αφήνουν και τις αταξίες και έρχονται ευλαβικοί προσκυνητές μετά στο Άγιον Όρος. Γιατί πληροφορούνται κατά κάποιον τρόπο την αγάπη του Θεού. Και βλέπω έχουν μία αρχοντιά που σου ραγίζει την καρδιά. Να μη δέχωνται μία οικονομική βοήθεια, ενώ έχουν ανάγκη, αλλά να πιάνουν δουλειά, για να τα βγάλουν πέρα και να πάνε την νύχτα στο σχολείο. Αυτά  τα παιδιά αξίζει να τα βοηθήση κανείς. Στον Νέο Σιδηροδρομικό Σταθμό της Θεσσαλονίκης υπάρχουν σπίτια, όπου μένουν πολλά παιδιά μαζί, αγόρια και κορίτσια. Σε έναν χώρο για τρεις έμεναν δεκαπέντε. Είναι από διαλυμένες οικογένειες· άλλα κλέβουν, άλλα έχουν φιλότιμο και δεν μπορούν να κλέψουν. Από χρόνια έλεγα σε πολλούς να τα πλησιάσουν, να τα βοηθήσουν. Είχα πει να κάνουν κανέναν Ναό, να τα συμμαζεύουν. Τώρα έχουν κάνει ένα εκκλησάκι στον προστάτη των σιδηροδρομικών Απόστολο και Διάκονο Φίλιππο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως έχω καταλάβει πώς, όταν μικρός κανείς δεν αξιοποιήση τις ευκαιρίες που του δίνονται, πολλές φορές το εκμεταλλεύεται ο διάβολος. Γιατί λέει η παροιμία· «στήν βράση κολλάει το σίδερο»; Οι σιδηρουργοί, όταν ήθελαν να κολλήσουν δύο σίδερα –μή βλέπετε τώρα που έχουν οξυγόνα κ.λπ.-, έβαζαν το σίδερο στην φωτιά και έρριχναν ζεστό νερό και βόρακα καί, μόλις το έβγαζαν ζεστό και πετούσε ακόμη σπίθες, τάκα-τάκα κολλούσε. Γιατί, αν τυχόν κρύωνε, δεν κολλούσε. Το ίδιο θέλω να πω και ο νέος, όταν του δίνωνται ευκαιρίες, αν αδιαφορήση, μετά θα αρχίση να ασχολήται με τους άλλους, να κρίνη να κατακρίνη, όποτε απομακρύνεται η Χάρις του Θεού. Ενώ, όταν έχη την θεία ζέση, αν προσέξη, τότε κάνει προκοπή. Γι’ αυτό οι γονείς, όσο μπορούν, να βοηθούν τα παιδιά, όταν είναι μικρά. Τα παιδιά είναι άδειες κασσέττες. Αν γεμίσουν Χριστό, θα είναι κοντά Του πάντα. Αν όχι, είναι πιο εύκολο, όταν μεγαλώσουν, να παραστρατήσουν. Αν μικρά βοηθηθούν, και να ξεφύγουν αργότερα λίγο, πάλι θα συνέλθουν. Αν ποτισθή το ξύλο με λάδι, δεν σαπίζει. Λίγο αν ποτισθούν τα παιδιά με ευλάβεια, με φόβο Θεού, δεν έχουν ανάγκη μετά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Η αναίδεια και η έλλειψη σεβασμού
- type: h2
  initial:
    ru: ''
  text:
    ru: Η παρρησία διώχνει την ευλάβεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η παρρησία από που προέρχεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από το Παρίσι… Η παρρησία είναι αναίδεια και διώχνει μακριά τον φόβο του Θεού σαν τον καπνό που βάζουμε στις μέλισσες, για να απομακρυνθούν από την κυψέλη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα αποφύγω την παρρησία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να νιώθεις τον εαυτό σου κάτω από όλους. Χρειάζεται ταπείνωση πολλή. Σαν μικρότερη που είσαι, να έχης σε όλες τις αδελφές σεβασμό και ευλάβεια. Να λές τον λογισμό σου ταπεινά και όχι να δείχνης ότι τα ξέρεις όλα. Τότε θα σε χαριτώνη ο Θεός και θα κάνης προκοπή. Η παρρησία στον υποτακτικό είναι ο μεγαλύτερος εχθρός του, γιατί διώχνει την ευλάβεια. Συνήθως στην παρρησία επακολουθεί η ανταρσία και έπεται η αναισθησία και η αδιαφορία για τις μικρές αμαρτίες στην αρχή, τις οποίες σιγά-σιγά  συνηθίζει κανείς και τις βλέπει μετά φυσιολογικές· αλλά ανάπαυση στο βάθος της ψυχής δεν υπάρχει παρά μόνον άγχος. Ούτε και μπορεί να καταλάβη ο άνθρωπος τί έχει, γιατί η καρδιά εξωτερικά είναι γλιτσιασμένη και δεν αισθάνεται τις στραβοξυλιές που κάνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί σχέση έχει, Γέροντα, η απλότητα με την παρρησία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άλλο πράγμα είναι η απλότητα άλλο η παρρησία. Η απλότητα έχει και ευλάβεια μέσα της και κάτι το παιδικό. Η παρρησία έχει θράσος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και στην ευθύτητα πολλές φορές μπορεί να υπάρχη αναίδεια. Μέσα στην ευθύτητα και μέσα στην απλότητα πολλές φορές κρύβεται πολλή αναίδεια, όταν δεν προσέχη ο άνθρωπος. Λέει: «Εγώ είμαι ευθύς χαρακτήρας»ή «εγώ είμαι απλός»καί μιλάει με αναίδεια, χωρίς να το καταλαβαίνη. Άλλο όμως απλότητα άλλο αναίδεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί είναι, Γέροντα, η πνευματική συστολή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πνευματική συστολή είναι ο φόβος του Θεού, με την καλή έννοια. Ο φόβος αυτός, το σφίξιμο αυτό, φέρνει αγαλλίαση, στάζει μέλι στην καρδιά· πνευματικό μέλι! Βλέπεις, ένα μικρό παιδάκι που είναι συνεσταλμένο σέβεται τον πατέρα του, συμμαζεύεται, και από την πολλή συστολή δεν κοιτάζει τον πατέρα του. Πάει να ρωτήση κάτι, κοκκινίζει! Αυτό είναι για να το βάλης στο εικονοστάσι. Άλλο παιδί σκέφτεται: «Πατέρας μου είναι»καί τεντώνεται μπροστά του απρόσεκτα, με θράσος. Και όταν θέλη κάτι, ζητάει με απαίτηση να του το δώσουν, χτυπάει τα πόδια του κάτω, απειλεί.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σε μία οικογένεια καλή τα παιδιά κινούνται ελεύθερα. Υπάρχει ο σεβασμός, χωρίς τα παιδιά να είναι κουμπωμένα· δεν υπάρχει στρατιωτική πειθαρχία. Χαίρονται τον πατέρα τους, την μάνα τους, και εκείνοι τα χαίρονται. «Η αγάπη δεν γνωρίζει εντροπή», λέει ο Αββάς Ισαάκ[135]. Έχει θάρρος, με την καλή έννοια. Έχει ευλάβεια, σεβασμό μέσα της αυτή η αγάπη· νικάει δηλαδή τον φόβο. Ένας έχει συστολή, διστάζει, αλλά και φοβάται, γιατί δεν έχει την πραγματική συστολή. Άλλος έχει συστολή, αλλά δεν φοβάται, γιατί έχει την πραγματική, την πνευματική συστολή. Όταν είναι πνευματική η συστολή, αισθάνεται κανείς χαρά. Το παιδάκι λ.χ. αγαπάει τον πατέρα και την μάνα του με παρρησία, κατά κάποιον τρόπο· δεν φοβάται μην το χτυπήσουν. Παίρνει το καπέλλο του πατέρα του, και αξιωματικός να είναι, το πετάει και χαίρεται. Έχει την καλή απλότητα· δεν έχει την αναίδεια. Να ξεχωρίσουμε την απλότητα από την αναίδεια. Αν λείψη ο σεβασμός, η συστολή, φθάνουμε στην παρρησία, στην αναίδεια. Και ακούς μετά την κοπέλα να κάθεται ξαπλωμένη και να λέη: «Μάνα, φέρε μου ένα ποτήρι νερό! Κρύο να είναι!... Ά, δεν είναι κρύο. Κρύο σου είπα να μου φέρης». Έτσι ξεκινούν και φθάνουν ύστερα και λένε: «Και γιατί η γυναίκα να φοβάται τον άνδρα;»[136]. Μέσα στον φόβο όμως υπάρχει ο σεβασμός και μέσα στον σεβασμό υπάρχει η αγάπη. Κάτι που το σέβομαι, το αγαπώ κιόλας, και κάτι που το αγαπώ, το σέβομαι. Η γυναίκα να σέβεται τον άνδρα. Ο άνδρας να αγαπά την γυναίκα. Αλλά τώρα ισοπεδώνουν τα πάντα και διαλύονται μετά οι οικογένειες, γιατί πιάνουν το Ευαγγέλιο ανάποδα. «Πρέπει η γυναίκα να υπακούη», λέει ο άνδρας. Μά, αν δεν έχης αγάπη, δεν μπορείς ούτε ένα γατί να υποτάξης. Αν δεν έχης αγάπη, ο άλλος δεν πληροφορείται, και ούτε ένα ποτήρι νερό δεν μπορείς να του ζητήσης να σού φέρη. Όταν κανείς σέβεται τον άλλον, τον ίδιο τον εαυτό του σέβεται, αλλά τον εαυτό του δεν τον υπολογίζει. Ο σεβασμός προς τον άλλον έχει φιλότιμο. Ενώ, όταν προσέχη κανείς τον εαυτό του, αυτό δεν έχει φιλότιμο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Σεβασμός στους μεγαλυτέρους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές, Γέροντα, μιλώ άσχημα στους μεγαλυτέρους. Καταλαβαίνω ότι σφάλλω και το εξομολογούμαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αφού το καταλαβαίνεις και το εξομολογείσαι, σιγά-σιγά  θα σιχαθής τον εαυτό σου, με την καλή έννοια, θα ταπεινωθής, και τότε θα έρθη η Χάρις του Θεού και θα φύγη αυτή η κακή συνήθεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, καμμιά φορά λέω αστεία και πειράζω τις αδελφές από αγάπη, αλλά φοβάμαι την παρρησία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ είσαι μικρή· δεν κάνει! Συνήθως σε μία οικογένεια οι μεγάλοι πειράζουν και παίζουν τους μικρούς και όχι οι μικροί τους μεγάλους. Έτσι χαίρονται και οι μικροί, χαίρονται και οι μεγάλοι. Δεν ταιριάζει ένας μικρός να πειράζη τον παππού ή την γιαγιά. Φαντάζεσαι να πηγαίνη το παιδάκι στα καλά καθούμενα να γαργαλεύη τον πατέρα του στον λαιμό; Άλλο όταν ο μεγάλος τσυγκλάη τον μικρό, και ο μικρός χαίρεται και κινείται με μία καλή άνεση. Έτσι γίνεται ο μεγάλος μικρός και χαίρονται και οι δύο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν πω την γνώμη μου σε έναν μεγαλύτερο για κάτι που μου λέει ο λογισμός ότι δεν είναι σωστό και αντιδράση, πρέπει τότε να συμφωνήσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, να μη συμφωνής στο κακό. Να λές το σωστό αλλά με καλό τρόπο. «Μήπως να το κάνουμε έτσι; Σαν λογισμό σου το λέω». Ή να λές: «Έχω αυτόν τον λογισμό». Τότε γίνεσαι μαγνήτης και ελκύεις την Χάρη του Θεού. Είναι μερικοί που από συνήθεια και όχι από πρόθεση να πούν την γνώμη τους μιλούν με παρρησία. Πάντως, όπως και να είναι, χρειάζεται σεβασμός στον μεγαλύτερο. Αλλά και ο μεγάλος τον θέλει κατά κάποιον τρόπο τον σεβασμό. Και αν έχη και ελαττώματα, έχει όμως και τα καλά του· έχει μία πείρα κ.λπ. Εσύ, όταν σε ρωτούν, πές τον λογισμό σου ταπεινά και με σεβασμό, χωρίς να πιστεύης μέσα σου ότι είναι έτσι όπως το λές εσύ, γιατί ο άλλος μπορεί να ξέρη κάτι άλλο που εσύ δεν το ξέρεις ή δεν το σκέφθηκες. Όταν κανείς είναι μικρός, τότε, αν λ.χ. ακούση μία συζήτηση για ένα θέμα και σκεφθή κάτι που νομίζει ότι είναι πιο σωστό, αν πρόκειται για συνομήλικο, πρέπει να πή: «Μου πέρασε ο λογισμός». Αν πρόκειται για μεγαλύτερο στην ηλικία, πρέπει να πή: «Μου πέρασε ένας βλάσφημος λογισμός». Και το σωστό να πη κανείς, είναι αναίδεια, αν δεν έχη αρμοδιότητα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν λέτε μεγαλύτερο, εννοείτε στα χρόνια ή στην πνευματική ζωή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κυρίως στα χρόνια. Γιατί, βλέπεις, και ένας που είναι σε προχωρημένη πνευματική κατάσταση, σέβεται έναν μεγαλύτερό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι φυσιολογικό, Γέροντα, να σέβεται κανείς περισσότερο έναν μικρότερο και πιο προοδευμένο πνευματικά από έναν μεγαλύτερο και λιγώτερο προοδευμένο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, δεν είναι σωστή τοποθέτηση αυτή. Ό,τι και αν είναι ο μεγάλος, πρέπει να τον σεβασθής για την ηλικία. Τον μεγαλύτερο θα τον σεβασθής για την ηλικία και τον μικρότερο για την ευλάβεια. Όταν υπάρχη σεβασμός, ο μικρός σέβεται τον μεγάλο και ο μεγάλος τον μικρό. Μέσα στον σεβασμό είναι η αγάπη. Ο Απόστολος Παύλος λέει: «Τω τον φόρον τον φόρον, τω την τιμήν την τιμήν»[137].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν κάνουν παρατήρηση οι μικροί στους μεγάλους, είναι κακό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό είναι το τυπικό της νέας γενιάς. Αλλά η Γραφή λέει «έλεγξον τον αδελφόν σου»[138], δεν λέει «έλεγξον τον πατέρα σου». Οι σημερινοί νέοι έχουν λόγο, έχουν το αντάρτικο, δίχως να το καταλαβαίνουν. Την θεωρούν φυσιολογική αυτήν την συμπεριφορά. Μιλούν με αναίδεια και σού λένε: «Το είπα απλά». Έχουν επηρεασθή από αυτό το πνεύμα του κόσμου το αλήτικο, που δεν σέβεται τίποτε. Δεν υπάρχει σβεασμός στην συμπεριφορά του μικρού προς τον μεγάλο και δεν το καταλαβαίνουν πόσο κακό είναι αυτό. Όταν ο μικρός λέη κατεστημένο τον σεβασμό στον μεγάλο, για να έχη δήθεν προσωπικότητα, τί περιμένεις; Χρειάζεται πολλή προσοχή. Το κοσμικό πνεύμα, το σύγχρονο, λέει: «Μήν ακούτε τους γονείς, τους δασκάλους κ.λπ.». Γι’ αυτό τα μικρότερα παιδιά γίνονται χειρότερα τώρα. Μεγαλύτερη ζημιά παθαίνουν ιδίως εκείνα τα παιδιά που οι γονείς τους δεν καταλαβαίνουν τί κακό τα κάνουν με το να τα θαυμάζουν και να τα θεωρούν σπουδαία, όταν μιλούν με αναίδεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είχαν έρθει στο Καλύβι δυο ξαδελφάκια οκτώ-εννιά χρονών με τον πατέρα τους. Τα πήρα το ένα δεξιά, το άλλο αριστερά. Ήταν εκεί και ένας γνωστός μου ζωγράφος, πολύ καλό παιδί και καλλιτέχνης· σε ένα λεπτό, τάκ-τάκ, τον ζωγραφίζει τον άλλον. «Διονύση, του λέω, ζωγράφισε τα παιδιά έτσι όπως καθόμαστε μαζί». «Για να δούμε, λέει, αν τα καταφέρω, γιατί κουνιούνται». Έβγαλε μία κόλλα και άρχισε να ζωγραφίζη. Πετιέται το ένα και λέει: «Για να δούμε, βρέ βλάκα, τί θα φτιάξης!».καί να είναι κόσμος μπροστά! Ο νέος δεν ταράχτηκε καθόλου. «Αυτά  είναι τα σημερινά παιδιά, Πάτερ!»., μου λέει και συνέχισε να ζωγραφίζη. Εμένα μου ανέβηκε το αίμα στο κεφάλι. Και ο πατέρας του σαν να μη συνέβαινε τίποτε! Να λένε έτσι σε άνθρωπο τριάντα χρονών και ο άνθρωπος να κάθεται και να ζωγραφίζη! Αναίδεια, ασέβεια και πόσα άλλα!... Φοβερό! Άντε τώρα κάποιο από αυτά  τα παιδιά να θελήση να γίνη καλόγερος. Πόση δουλειά χρειάζεται, για να γίνη αυτό το παιδί σωστός μοναχός! Όταν οι μανάδες δεν τα προσέχουν, καταστρέφονται τα παιδιά. Όλη η βάση είναι οι μανάδες. Στην Ρωσία, αν άλλαξε κάτι, είναι γιατί οι μανάδες κρυφά κράτησαν την πίστη, την ευλάβεια και βοήθησαν τα παιδιά. Ευτυχώς που υπάρχει και λίγο προζύμι από χριστιανικές οικογένειες, αλλιώς θα ήμασταν χαμένοι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν αυτά  τα παιδάκια, Γέροντα, που μεγαλώνουν έτσι, θελήσουν αργότερα να αλλάξουν ή να γίνουν μοναχοί, μπορούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν πιστέψουν ότι δεν είναι καλό αυτό που έκαναν, θα τα βοηθήση ο Χριστός. Δηλαδή, αν μπή η καλή ανησυχία στον άνθρωπο, έληξε. Αλλά, όταν νομίζουν ότι έχουν δίκαιο και λένε για τον ηγούμενο ή την ηγουμένη: «Τί, δικτάτορα έχουμε εδώ; Που ακούσθηκε αυτό στην εποχή μας;», πώς να διορθωθούν; Φθάνουν μερικά καλογέρια σε σημείο να μου λένε τέτοιες χαζομάρες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σιγά-σιγά  χάνεται τελείως ο σεβασμός. Έρχονται στο Καλύβι νέα παιδιά και τα περισσότερα κάθονται με το ένα πόδι πάνω στο άλλο και οι γέροι δεν έχουν που να καθήσουν. Αλλά, ενώ βλέπουν ότι τα κούτσουρα είναι πιο πέρα, βαριούνται να πάνε δυο βήματα να τα μεταφέρουν, για να καθήσουν. Πρέπει εγώ να τα φέρω. Και ενώ με βλέπουν που τα κουβαλάω, δεν έρχονται να τα πάρουν. Νερό θέλουν να πιούν και δεν πηγαίνουν μόνα τους να πάρουν. Πρέπει εγώ να τους φέρω και δεύτερο κύπελλο. Όχι, αλήθεια, μου κάνει εντύπωση· κοτζάμ παλληκάρια· έρχονται παρέα τριάντα άτομα, με βλέπουν να φέρνω μία κάσα λουκούμια και ένα μπετόνι νερό, να κουβαλώ και τα κύπελλα, για να τους βολέψω, να κουτσαίνω, και να μην κουνιούνται, και να σηκώνεται να με βοηθήση ένας ταξίαρχος, που έχει μπαρουτοκαπνισθή. Νομίζουν ότι όπως πάνε σε ένα εστιατόριο ή σε ένα ξενοδοχείο και πάει το γκαρσόν, έτσι και στο Καλύβι θα έρθη το γκαρσόν. Πέντε-έξι φορές έχω κάνει το εξής: κάνω τον κόπο, φέρνω το νερό και το χύνω μπροστά τους. «Εγώ να σάς φέρω το νερό, παλληκάρια, τους λέω, αλλά δεν σάς βοηθάει αυτό!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στα αστικά αυτοκίνητα βλέπεις μικρά παιδιά να κάθωνται και οι γέροι να στέκωνται όρθιοι. Νέοι να κάθωνται με το ένα πόδι πάνω στο άλλο και μεγάλοι να σηκώνωνται, για να δώσουν την θέση τους σε έναν γέρο. Οι νέοι δεν την δίνουν. «Την πλήρωσα, λένε, την θέση»καί κάθονται χωρίς να υπολογίζουν κανέναν. Παλιότερα τί πνεύμα υπήρχε! Οι γυναίκες κάθονταν στα σοκάκια δεξιά και αριστερά καί, όταν περνούσε ο παπάς ή ένας ηλικιωμένος, σηκώνονταν και αυτό μάθαιναν και στα παιδιά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσες φορές αγανακτώ! Να είναι ηλικιωμένοι, σοβαροί άνθρωποι και με αξιώματα και να βλέπης κάτι παιδιά με μία αναίδιεα να διακόπτουν την συζήτηση, να λένε χαζομάρες και να το θεωρούν κατόρθωμα. Τα κάνω νόημα να σταματήσουν, τίποτε. Πρέπει να τα κάνης ρεζίλι, για να σταματήσουν· αλλιώς δεν γίνεται! Σε κανένα Πατερικό δεν γράφει να μιλούν έτσι οι νέοι. Το Γεροντικό λέει, «είπε Γέρων», δεν λέει «είπε νέος». Παλιά οι μικροί δεν μιλούσαν μπροστά στους μεγάλους και χαίρονταν που δεν μιλούσαν. Ούτε κάθονταν εκεί που κάθονταν οι μεγάλοι. Είχαν μία συστολή, μία ευλάβεια, κοκκίνιζαν, όταν μιλούσαν σε έναν μεγαλύτερο. Και αν μιλούσε κανένα παιδί άσχημα στους γονείς του, δεν θα έβγαινε στην αγορά από ντροπή. Και στο Άγιον Όρος, αν δεν είχε άσπρα γένια κανείς, δεν έμπαινε στον χορό να ψάλη. Τώρα βλέπεις και δόκιμοι μαζεύονται και προδόκιμοι!... Τέλος πάντων, αλλά τουλάχιστον να μάθουν να κινούνται με σεβασμό και ευλάβεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και βλέπεις μαθητή της Αθωνιάδος να λέη στον Σχολάρχη, που είναι και Δεσπότης: «Άγιε Σχολάρχα, θα μιλήσουμε ίσος προς ίσον». Εκεί φθάνουν! Και το κακό είναι που σου λέει: «Γιατί, τί είπα; Δεν το καταλαβαίνω». Δεν λέει: «Με συγχωρήτε, έχει ευλογία να πω έναν λογισμό; Μπορεί να είναι και ανοησία», αλλά ένα και ένα σαν να μη συμβαίνη τίποτε: «Η γνώμη σου και η γνώμη μου». Κατάλαβες; Αυτό το πνεύμα δυστυχώς μπήκε και στην πνευματική ζωή και στον Μοναχισμό. Ακούς δόκιμους μοναχούς να λένε: «Ενώ του το είπα του Γέροντα, δεν με καταλαβαίνει! Επανειλημμένως του το είπα». «Καλά, πώς το λές αυτό το «επανειλημμένως»; Έτσι είναι σαν να λές: «Δεν διορθώθηκε ο Γέροντας»». «Γιατί, λέει, δεν μπορώ να εκφέρω την γνώμη μου;». Είναι να τινάζεσαι στον αέρα με κάτι τέτοια. Και στο τέλος σου λέει: «Σενοχωρέθηκες; Με συγχωρής». Να τον συγχωρήσω όχι Γι’ αυτά  που είπε, αλλά γιατί ανέβηκε το αίμα στο κεφάλι μου!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Φθάνουν να κρίνουν και τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στην νέα γενιά υπάρχει αυτή η τάση να κρίνουν τους πάντες και τα πάντα ή έτσι ήταν πάντοτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, παλιά δεν ήταν έτσι· αυτό είναι το πνεύμα της εποχής. Τώρα δεν φθάνει που κρίνουν λαϊκούς, όλους τους πολιτικούς και τους εκκλησιαστικούς, αλλά κρίνουν και Αγίους και φθάνουν να κρίνουν και τον Θεό. «Ο Θεός, λένε, στο τάδε θέμα έτσι έπρεπε να ενεργήση· δεν ενήργησε σωστά. Αυτό ο Θεός δεν έπρεπε να το κάνη»! Ακούς κουβέντα; «Βρέ, παιδί μου, εσύ θα πής;». «Γιατί; Λέω την γνώμη μου», σού λέει και δεν καταλαβαίνει πόση αναίδεια έχει αυτό. Το κοσμικό πνεύμα έχει καταστρέψει πολλά καλά πράγματα. Προχωράει το κακό σε άσχημη κατάσταση, σε βλασφημία. Κρίνουν τον Θεό και ούτε τους πειράζει ο λογισμός ότι είναι βλασφημία. Είναι και μερικοί που έχουν μπόι καί, αν έχουν και λίγη λογική, αρχίζουν: «Αυτός είναι για μία χούφτα, εκείνος περπατάει στραβά, ο άλλος κάνει έτσι»καί δεν υπολογίζουν κανέναν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ήρθε μία φορά στο Καλύβι ένας και μου λέει: «Ο Θεός δεν έπρεπε αυτό να το κάνη έτσι». «Εσύ, του λέω, μπορείς να κρατήσης μία πετρούλα στον αέρα; Αυτά  τα αστέρια που βλέπεις, δεν είναι μπίλιες που γυαλίζουν. Είναι ολόκληροι όγκοι που κινούνται ιλιγγιωδώς και συγκρατούνται, χωρίς να εκτροχιάζωνται». «Αυτό, κατά την γνώμη μου, δεν έπρεπε να γίνη έτσι», ξαναλέει. Ακούς κουβέντα! Μά εμείς θα κρίνουμε τον Θεό; Μπήκε η λογική και έλειψε η εμπιστοσύνη στον Θεό. Και αν του πής τίποτε, σού λέει: «Με συγχωρής, την γνώμη μου είπα· δεν μπορώ να πω την γνώμη μου;». Τί ακούει ο Θεός από εμάς! Ευτυχώς που δεν μας παίρνει τοις μετρητοίς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην Παλαιά Διαθήκη αναφέρεται ότι είπε ο Θεός στους Ισραηλίτες[139]: «Διώξτε τους Χαναναίους από την χώρα τελείως». Για να το πη ο Θεός, κάτι ήξερε. Αλλά αυτοί είπαν: «Δεν είναι πολύ φιλάνθρωπο αυτό. Ας τους αφήσουμε· ας μην τους εξοντώσουμε». Μετά όμως παρασύρθηκαν στην ανηθικότητα, στην ειδωλολατρία, και θυσίαζαν τα παιδιά τους στα είδωλα, όπως λέει στον Ψαλμό[140]. Ο Θεός για ό,τι κάνει κάτι ξέρει. Και λένε μερικοί με αναίδεια: «Γιατί να κάνη την κόλαση ο Θεός;». Αρχίζει η κρίση και από ΄κεί και πέρα δεν έχει κανείς πνευματική κατάσταση, δεν έχει λίγη Χάρη Θεού, για να καταλάβη λίγο πιο βαθιά, να καταλάβη δηλαδή για ποιό λόγο ο Θεός έκανε κάτι. Το «γιατί;»είναι κρίση, υπερηφάνεια, εγωισμός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μερικά παιδιά, Γέροντα, ρωτούν: «Γιατί έπρεπε να σταυρωθή ο Χριστός; Δεν μπορούσε να σώση ο Θεός τον κόσμο με άλλον τρόπο;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εδώ τον έσωσε με τέτοιο τρόπο και δεν συγκινούνται οι άνθρωποι, που να τον έσωζε με άλλον τρόπο! Είναι και μερικοί που λένε: «Ο Θεός δεν έπαθε τίποτε. Ο Υιός θυσιάστηκε». Ένας πατέρας, για μένα, θα προτιμούσε να θυσιασθή ο ίδιος, παρά να θυσιασθή το παιδί του. Πιό οδυνηρό είναι για έναν πατέρα να θυσιασθή το παιδί του παρά ο ίδιος. Αφού δεν καταλαβαίνουν τί θα πη αγάπη, τί να πής;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άλλος μου είπε: «Ο Αδάμ είχε δύο παιδιά, τον Άβελ και τον Κάιν. Μετά που βρέθηκε η γυναίκα για τον Κάιν;». Αν διαβάση όμως κανείς στην Παλαιά Διαθήκη, θα δη ότι ο Αδάμ «εγέννησεν υιούς και θυγατέρας»[141]μετά τον Σήθ. Ο Κάιν[142]είχε φύγει στα βουνά μετά τον φόνο του αδελφού του και δεν ήξερε ότι η γυναίκα που πήρε ήταν αδελφή του. Τα οικονόμησε έτσι ο Θεός, να είναι οι άνθρωποι από μία φυλή, για να μην υπάρχη η κακία και το έγκλημα. Να λένε: «Από τους ίδιους γονείς είμαστε, τον Αδάμ και την Εύα», για να φρενάρεται η κακία η ανθρώπινη. Πάρ΄ όλα αυτά, βλέπεις τί κακία υπάρχει σήμερα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τί τραβάω με μερικούς τέτοιους που έρχονται στο Καλύβι! Τους λέω: «Με πονάει το κεφάλι και δεν έχω ασπιρίνη». Μετά φεύγουν και στενοχωρημένοι. Δεν καταλαβαίνουν γιατί τους λέω ότι με πονάει το κεφάλι μου και λένε: «Τόσο κόπο κάναμε και μας λέει ότι πονάει το κεφάλι του!».Άλλοι με ρωτούν: «Να σού φέρουμε μία ασπιρίνη;».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αναίδεια διώχνει την θεία Χάρη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Χρειάζεται πολλή προσοχή. Η άτακτη και απρόσεκτη συμπεριφορά είναι εμπόδιό της θείας Χάριτος. Η έλλειψη του σεβασμού είναι το μεγαλύτερο εμπόδιο για να πλησιάση η Χάρις του Θεού. Όσο ατίθασα είναι τα παιδιά, τόσο εγκαταλείπονται από την Χάρη του Θεού. Η κοσμική ελευθερία εδίωξε όχι μόνον την ευλάβεια αλλά και την κοσμική ευγένεια. Έρχονται εκεί στο Καλύβι μερικά παιδιά και φωνάζουν στον πατέρα τους: «Έ, πατέρα, έχεις τσιγάρα; τελείωσαν τα δικά μου». Που πρώτα; Και να κάπνιζε κανένα, θα κάπνιζε κρυφά. Τώρα σαν να μη συμβαίνη τίποτε! Πώς να μην απογυμνωθούν μετά τελείως από την θεία Χάρη; Σήμερα κοπέλες βρίζουν τα αδέλφια τους, επειδή θρησκεύουν, μπροστά στον πατέρα και την μητέρα με τόσο βρώμικες κουβέντες, και ο πατέρας δεν λέει τίποτε. Σηκώθηκαν τα μαλλιά μου, όταν το άκουσα. Παραμιλούσα, όταν έμεινα μόνος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Το κοσμικό περιβάλλον και οι κοσμικοί γονείς καταστρέφουν τα παιδιά. Το περιβάλλον επιδρά πολύ. Λίγα παιδιά είναι που έχουν συστολή και φιλότιμο. Τα περισσότερα παιδιά που είναι άγρια, είναι γιατί φέρονται με αναίδεια. Πολλοί γονείς μου φέρνουν τα παιδιά τους και μου λένε: «Πάτερ, το παιδί μου έχει δαιμόνιο». Και βλέπω ότι τα παιδιά δεν έχουν δαιμόνιο –Θεός φυλάξοι! Λίγα είναι τα παιδιά που έχουν δαιμόνιο. Όλα τα άλλα έχουν μία εξωτερική δαιμονική επήρεια. Δηλαδή το δαιμόνιο τα κάνει κουμάντο άπ΄ έξω· δεν είναι μέσα τους, αλλά την δουλειά του και άπ΄ έξω την κάνει. Και από που ξεκινάει; Από την αναίδεια. Όταν τα παιδιά μιλούν με αναίδεια στους μεγαλυτέρους, διώχνουν την Χάρη του Θεού. Και όταν φύγει η Χάρις του Θεού, έρχονται τα ταγκαλάκια και τα παιδιά αγριεύουν, κάνουν αταξίες. Ενώ τα παιδιά που έχουν ευλάβεια, σεβασμό, ακούν τους γονείς, τους δασκάλους, τους μεγαλυτέρους, δέχονται συνέχεια την Χάρη του Θεού και έχουν την ευλογία Του. Τα σκεπάζει η Χάρις του Θεού. Η πολλή ευλάβεια στον Θεό, με τον πολύ σεβασμό στους μεγαλυτέρους, φέρνει την πολλή θεία Χάρη στις ψυχές και τις χαριτώνει, μέχρι που προδίδονται από την θεία λάμψη της Χάριτος. Η Χάρις του Θεού δεν πηγαίνει στα ευλαβικά παιδιά. Και τα παιδιά που έχουν σεβασμό, ευλάβεια φαίνονται. Έχουν ένα βλέμμα που ακτινοβολεί! Και όσο πιο πολύ σεβασμό έχουν στους γονείς, στους μεγαλυτέρους γενικά, τόσο δέχονται την Χάρη του Θεού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όποιος όμως αρχίζει: «Όχι, θέλω εκείνο, θέλω το άλλο», με μία απαίτηση, αυτός θα γίνη αντάρτης, θα γίνη διάβολος. Γιατί και ο Εωσφόρος ήθελε να βάλη τον θρόνο του πάνω από τον θρόνο του Θεού. Να δήτε, όλα τα παιδιά που τους κάνουν τα θελήματα γίνονται ανταρτάκια. Εάν δεν ματανοήσουν τα παιδιά αυτά, για να απαλλαγούν από το κακό κύμα που τα χτυπάει, και συνεχίσουν να φέρωνται με αναίδεια, τότε – Θεός φυλάξοι! – γίνεται διπλή εγκατάλειψη και φθάνουν σε σημείο να μιλούν ακόμη και για τον Θεό άσχημα, και τότε πια κουμαντάρονται από τα κακά πνεύματα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: «Τίμα τον πατέρα σου και την μητέρα σου»[143]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Που έχουν φθάσει σήμερα τα παιδιά! Δεν σηκώνουν ούτε έναν λόγο. Που να σηκώσουν ξύλο! Δεν έχουν σεβασμό· έχουν πολύ εγωισμό και πολλά νεύρα. Κάνουν κατάχρηση της ελευθερίας. Το παιδί λέει στους γονείς του: «Θα σάς πάω στην Αστυνομία». Πρόσφατα, παιδί δεκαπέντε χρονών που έκανε μία πολύ μεγάλη αταξία και ο πατέρας του έδωσε ένα σκαμπίλι, πήγε και του έκανε μήνυση και δίκασαν τον πατέρα. Ο πατέρας την ώρα της δίκης είπε: «Με αδικείτε, γιατί, αν δεν έδινα τότε το σκαμπίλι, θα έκλειναν το παιδί μου στην φυλακή. Δεν θα πονούσατε εσείς, εγώ θα πονούσα». Πιάνει λοιπόν το παιδί, του δίνει δύο σκαμπίλια και λέει: «Γι’ αυτά  τα σκαμπίλια να με δικάσετε, όχι για κείνο. Τώρα βάλτε με στην φυλακή, γιατί στα καλά καθούμενα το χτύπησα».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θέλω να πώ. Εκεί έχουν φθάσει τα παιδιά. Αυτή η νοοτροπία υπάρχει σήμερα. Παλιά οι γονείς μας μάλωναν, έδιναν και κανένα σκαμπίλι, αλλά δεν μας περνούσε κακός λογισμός. Δεχόμασταν και το ξύλο σαν το χάδι, χωρίς να αντιδράσουμε, χωρίς να εξετάσουμε αν φταίγαμε πολύ ή λίγο. Πιστεύαμε ότι και το ξύλο για το καλό μας ήταν. Ξέραμε ότι οι γονείς μας αγαπούσαν και πότε μας χάιδευαν, πότε μας φιλούσαν, πότε μας έδιναν σκαμπίλι. Γιατί και το σκαμπίλι και το χάδι και το φίλημα των γονέων, όλα –πώς να το κάνεις; – είναι από αγάπη. Όταν οι γονείς δέρνουν τα παιδιά τους, υποφέρει η καρδιά τους. Όταν τα παιδιά τρώνε το σκαμπιλάκι, πονάει το μάγουλο. Επομένως μεγαλύτερος είναι ο πόνος της καρδιάς από τον πόνο στο μάγουλο. Η μητέρα, ό,τι και αν κάνη στα παιδιά της, είτε τα μαλώση είτε τα δείρη είτε τα χαϊδέψη, όλα από αγάπη τα κάνει και όλα από την ίδια μητρική καρδιά βγαίνουν. Όταν όμως τα παιδιά δεν το καταλαβαίνουν αυτό και μιλούν με αναίδεια, αντιδρούν και πεισμώνουν, τότε διώχνουν την θεία Χάρη από μέσα τους, και επόμενο είναι να δεχθούν μετά την ανάλογη δαιμονική επίδραση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν υπάρχουν και ανεπρόκοποι γονείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά εκείνα τα παιδιά που έχουν τέτοιους γονείς τα βοηθάει ο Θεός. Δεν είναι άδικος ο Θεός. Οι άγριες γκορτσιές είναι γεμάτες γκόρτσια. Εκεί στον δρόμο για το Καλύβι μου είναι μία άγρια κορομηλιά. Φύλλα δεν φαίνονται, γιατί είναι γεμάτη κορόμηλα. Σπάζουν τα κλωνάρια από τον καρπό. Οι ήμερες, πάρ΄ όλο που τις ραντίζουν, δεν δίνουν καθόλου καρπό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Χάσμα γενεών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο κόσμος έγινε τρελλοκομείο. Τα μικρά παιδιά κοιμούνται τα μεσάνυχτα, ενώ πρέπει να κοιμούνται με το ηλιοβασίλεμα. Είναι κλεισμένα στις πολυκατοικίες, στα μπετά και μπαίνουν στο πρόγραμμα των μεγάλων. Τί να κάνουν τα παιδιά, τί να κάνουν και οι γονείς; Έρχονται τα παιδιά και μου λένε: «Δεν μας καταλαβαίνουν οι γονείς». Έρχονται οι γονείς και μου λένε: «Δεν μας καταλαβαίνουν τα παιδιά μας». Έχει δημιουργηθή χάσμα ανάμεσα στους γονείς και τα παιδιά. Για να εξαλειφθή, πρέπει οι γονείς να έρθουν στην θέση των παιδιών και τα παιδιά στην θέση των γονέων. Και αν τώρα τα παιδιά δεν παιδεύουν τους γονείς, και τα παιδιά τους αργότερα δεν θα τους παιδεύουν. Ενώ αν τώρα δεν ακούν και παιδεύουν τους γονείς, και τα δικά τους παιδιά αργότερα θα τους βασανίζουν, γιατί θα λειτουργήσουν οι πνευματικοί νόμοι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικά παιδιά λένε ότι έχουν βλαφτή από την αγάπη των γονέων τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν έχουν δίκαιο. Όταν το παιδί έχη φιλότιμο, δεν βλάπτεται από την αγάπη των γονέων. Αν εκμεταλλεύτεται την αγάπη τους, θα καταστραφή. Αν το παιδί βλάπτεται από την αγάπη των γονέων, στην ουσία το παιδί είναι βλαμμένο. Ενώ θα έπρεπε να ευγνωμονή τον Θεό για τους γονείς, για την αγάπη τους, εκείνο στενοχωριέται, γιατί του δείχνουν καλωσύνη, ενώ άλλα παιδιά δεν έχουν γονείς! Τί να πής! Όταν ένα παιδί δεν αναγωνρίζη τους γονείς σαν ευεργέτες του και δεν τους αγαπάη –καί ένας λόγος παραπάνω όταν οι γονείς έχουν φόβο Θεού – πώς είναι δυνατόν να σέβεται και να αγαπάη τον Θεό, τον μεγάλο του ευεργέτη και Πατέρα όλων των ανθρώπων, που είναι πολύ δύσκολο να το καταλάβη στην παιδική ηλικία;
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 5 – Εσωτερική αταξία και εξωτερική εμφάνιση
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι καημένοι οι κοσμικοί ντύνονται όπως είναι μέσα τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δώστε μου, Γέροντα, μία ευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εύχομαι να γίνης πνευματικό καρναβάλι σαν την Αγία Ισιδώρα[144]την σαλή· να αποκτήσης την καλή υποκρισία. Βλέπεις, οι καημένοι οι κοσμικοί γιορτάζουν κάθε μέρα την κοσμική τους υποκρισία και ντύνονται όπως είναι μέσα τους. Παλιά, καρναβάλια γίνονταν οι άνθρωποι μία φορά τον χρόνο, μόνον τις Αποκριές. Τώρα οι περισσότεροι συνέχεια καρναβάλια είναι. Δηλαδή, παλιά έβλεπε κανείς καρναβάλια μία εβδομάδα, μόνον τις Αποκριές. Τώρα βλέπει κάθε μέρα… Καθένας ντύνεται όπως του λέει ο λογισμός! Έχουν γίνει τελείως παράξενοι. Παλάβωσαν! Λίγοι είναι οι συμμαζεμένοι άνθρωποι, οι σεμνοί, είτε άνδρες είτε γυναίκες είτε παιδιά. Ιδίως οι γυναίκες είναι τελείως χάλια. Σήμερα που κατέβαινα στην πόλη είδα κάποια με μία κορδέλα τόοοσο φαρδιά, σαν επίδεσμο, κάτι μπότες μέχρι επάνω και ένα κοντό φόρεμα. Μου είπαν: «Είναι της μόδας»! Άλλες περπατούν με κάτι τόοοσο λεπτά τακούνια! Λίγο να στραβοπατήσουν, στον ορθοπεδικό θα πάνε… Τα δε μαλλιά, μην τα ρωτάς! Μία άλλη –ο Θεός να με συγχωρέση – τί άνθρωπος ήταν; Ένα πρόσωπο άγριο, με το τσιγάρο στο στόμα, φού, φού, τα μάτια κόκκινα!... Τώρα λένε ότι έχουν σαν αρχή να μην καπνίζουν στο σπίτι, όταν έχουν μικρά παιδιά. Τα παιδιά εν τω μεταξύ, τα καημένα, έχουν γεννηθή… καπνιστές ρέγγες! Και από τους καφέδες οι άνθρωποι παθαίνουν· κάνουν κάτι γκριμάτσες… Έχει φύγει η Χάρις του Θεού. Τέλεια εγκατάλειψη!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι, όταν ήμουν στο Σινά, ήταν και εκεί… μην τα συζητάς! Πόσο πονούσα, όταν έβλεπα τις τουρίστριες που έρχονταν στο Μοναστήρι! Τί χάλια ήταν! Σαν να έβλεπα ωραίες εικόνες, βυζαντινές, πεταγμένες στα σκουπίδια, μόνον που αυτές είχαν πεταχθή μόνες τους. Μία φορά είδα μία που φορούσε κάτι σαν φαιλόνι και είπα: «Δόξα τω Θεώ, να και μία που φοράει κάτι συμμαζεμένο· τέλος πάντων φαιλόνι-ξεφαιλόνι, τουλάχιστον δεν είναι σαν τις άλλες». Ύστερα, όταν γύρισε μπροστά, τί να δώ; Ήταν όλα ανοικτά!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Που έφθασε ο κόσμος!... Μου έστειλαν μία φωτογραφία μίας νύφης, για να κάνω προσευχή να πάη καλά ο γάμος της. Φορούσε ένα νυφικό τελείως χάλια. Τέτοιο ντύσιμο είναι ασέβεια στο Μυστήριο, στον ιερό χώρο της Εκκλησίας. Πνευματικοί άνθρωποι και δεν σκέφτονται! Τί να κάνουν οι άλλοι; Γι’ αυτό λέω, αν και τα Μοναστήρια δεν κρατήσουν, δεν υπάρχει φρένο πουθενά· είναι ξέφρενοι οι άνθρωποι σήμερα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιά που υπήρχαν και οι δια Χριστόν σαλοί, υπήρχαν ελάχιστοι τρελλοί στον κόσμο. Μήπως θα πρέπει να παρακαλέσουμε τους δια Χριστόν σαλούς να κάνουν καλά τους φύσει σαλούς και να αναδειχθούν πάλι δια Χριστόν σαλοί; Πάντως τα πιο παράξενα πράγματα βλέπεις και ακούς σήμερα. Μου είπε ένας –έκανα τον σταυρό μου, όταν το άκουσα – ότι σήμερα είναι της μόδας οι τεμπέληδες να τρίβουν τα ρούχα τους εδώ κι εκεί και ύστερα να κόβουν και να ράβουν μπαλώματα με μία σακκορράφα. Καλά, ένας εργατικός είναι φυσιολογικό να είναι έτσι, αλλά ένας τεμπέλης!... Αφού μου είπε αυτό, συμπληρώνει: «Να σού πώ, Γέροντα, και κάτι ακόμη πιο παράξενο: η γυναίκα μου είδε μία φορά στην Ομόνοια το παιδί μίας φιλικής μας οικογένειας να έχη σχισμένο το παντελόνι του από πίσω. «Παιδάκι μου, του λέει, βάλε το χεράκι σου πίσω…». «Άσε μέ, λέει εκείνο, της μόδας είναι»»! Τα καημένα τα παιδιά!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι σωστό, Γέροντα, που βάζουν μερικοί στις μπλούζες στάμπα με Αγίους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είναι σε μπλούζες ή σε σακκάκια, καλά, δεν πειράζει. Εκεί που να βάζουν έναν διάβολο, καλύτερα αυτά. Αλλά, αν είναι σε παντελόνια, δεν ταιριάζει· είναι ανευλάβεια. Είναι μερικοί ευλαβείς που βάζουν διάφορα τέτοια. Νά, όταν είχε πάει ο Πατριάρχης Δημήτριος στην Αμερική, είχαν κάνει κάτι μπλούζες με στάμπα τον Πατριάρχη και την Άγια-Σοφιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από ευλάβεια το έκαναν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, δεν το έκαναν Εβραίοι, Χριστιανοί το έκαναν. Υπάρχουν και μερικοί που κάνουν καλά πράγματα, όπως υπάρχουν καλοί γιατροί, υπάρχουν και κομπογιαννίτες!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όλη αυτή η αταξία είναι και από την επίδραση των ξένων;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έμ, από που είναι; Γι’ αυτό λέγανε στα χρόνιά μου: «Οι άνθρωποι από την Σμύρνη είναι…»Ήταν παραθαλάσσιο μέρος και πήγαιναν πολλοί ξένοι. Ο Άγιος Αρσένιος ήταν πολύ αυστηρός σ΄ αυτά. Ήταν εκεί στα Φάρασα μία νεόνυμφη και φορούσε μία μανδήλα παρδαλή, σμυρνιώτικη. Ο Άγιος επανειλημμένως της έκανε παρατηρήσεις, για να την πετάξη και να ντύνεται σεμνά όπως όλες οι Φαρασιώτισσες. Εκείνη δεν άκουγε. Μία μέρα που την είδε ο Άγιος Αρσένιος να φοράη πάλι την παρδαλή μανδήλα, της είπε αυστηρά: «Φράγκικες αρρώστιες στα Φάρασα δεν θέλω. Αν δεν συμμορφωθής, να το ξέρης, τα παιδιά που θα γεννάς, αφού θα βαπτίζωνται, θα φεύγουν αγγελούδια και συ δεν θα χαρής κανένα». Και επειδή ούτε τότε συμμορφώθηκε, της πέθαναν δυο αγγελούδια. Τότε μόνο συνήλθε, πέταξε την παρδαλή μανδήλα και πήγε στον Άγιο Αρσένιο και ζήτησε συγχώρεση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τα σκούρα ρούχα βοηθούν στην πνευματική ζωή έναν που θέλει να γίνη μοναχός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, τα σκούρα ρούχα πολύ βοηθούν. Φεύγει έτσι κανείς από τον κόσμο, ενώ με τα χρωματιστά μένει γαντζωμένος στον κόσμο. Και αυτός που λέει: «Θα πάω στο Μοναστήρι και εκεί θα φορέσω μαύρα. Θα πάω στο Μοναστήρι και εκεί θα κάνω κανόνα», μαύρα πράγματα θα κάνη και εκεί, όταν πάη. Όταν είναι στον κ΄σομο και κάνη με χαρά αυτό που κάνουν οι μοναχοί και το λαχταρά, αυτός και στον κόσμο χραίρεται πνευματικά και στην καλογερική μετά θα ανεβαίνη δυό-δυό και τρία-τρία τα σκαλιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές, Γέροντα, παιδιά που θρησκεύουν και ντύνονται σεμνά έχουν πολύ πόλεμο από τους μεγάλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν το πιστεύουν και το κάνουν αυτό με την καρδιά τους, βάζουν και τους μεγάλους στην θέση τους. Είχα γνωρίσει μία κοπέλα που φορούσε μαύρα και μανίκια μέχρι κάτω. Είχε μία ευλάβεια! Της λέει μία φορά μία μοντέρνα γριά: «Δεν ντρέπεσαι, κοπέλα εσύ, να φοράς μαύρα και μανίκια μακριά;». «Αφού δεν βλέπουμε παραδείγματα από σας, της απάντησε εκείνη, τουλάχιστον να φορέσουμε εμείς μαύρα»καί την έβαλε στην θέση της.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπεις, η άλλη, μόλις χήρεψε, και φοράει παρδαλά. Αλλά τί να πής; Εμένα η αδελφή μου είκοσι τριών χρονών έμεινε χήρα καί, μέχρι που πέθανε, τα μαύρα δεν τα έβγαλε. Για μένα είναι μακάριες οι χήρες που φορέσανε τα μαύρα σ΄ αυτήν την ζωή, έστω και ακούσια, και ζουν άσπρη πνευματική ζωή και δοξολογούν τον Θεό, χωρίς να γογγύζουν, παρά οι δυστυχισμένες που φορούν παρδαλά και ζουν παρδαλή ζωή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Σήμερα δεν διακρίνεις αν είναι άνδρας ή γυναίκα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κάποτε, για να δοκιμάσουν τον σοφό Σολομώντα, του πήγαν μία ομάδα αγοριών και μία ομάδα κοριτσιών, όμοια ντυμένα κατά πάντα, για να τα ξεχωρίση. Εκείνος τα οδήγησε σε μία βρύση και τα έβαλε να πλυθούν. Από τον τρόπο που πλένονταν, τα ξεχώρισε· τα κορίτσια έρριχναν με προσοχή το νερό στα μάτια, συνεσταλμένα, ενώ τα αγόρια το πετούσαν στο πρόσωπό τους και έκαναν θόρυβο με τις παλάμες τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα οι άνδρες έχουν μιμηθή τόσο πολύ τις γυναίκες που πολλές φορές δεν διακρίνονται. Την παλιά εποχή στα πεντακόσια μέτρα μπορούσες να διακρίνης αν είναι άνδρας ή γυναίκα. Τώρα ούτε από κοντά δεν μπορείς μερικές φορές να ξεχωρίσης τί είναι· δεν καταλαβαίνεις· γυναίκα είναι; άνδρας είναι; Γι’ αυτό αναφέρει η προφητεία ότι θα έρθη εποχή που δεν θα διακρίνωνται οι άνθρωποι αν είναι άνδρας ή γυναίκα. Ο Γερό-Αρσένιος ο Σπηλαιώτης[145]είπε σε έναν νεαρό που είχε κάτι μαλλιά μέχρι κάτω: «Καλά, εσύ τί είσαι; Αγόρι είσαι ή κορίτσι;». Δεν διακρινόταν. Παλιά τους κούρευαν στο Άγιον Όρος. Τώρα έρχονται όπως νάναι… Εγώ τους κουρεύω με το ψαλίδι που κόβω το μαλλί, όταν πλέκω κομποσχοίνι. Πόσους έχω κουρέψει! Πίσω από το Ιερό τους κουρεύω. Όταν έρχωνται τέτοιοι, τους λέω: «Υποσχέθηκα σε κάποιους φαλακρούς να τους κολλήσω μαλλιά… Κάντε αγάπη να τα κόψουμε! Τί να κάνουμε τώρα; Τόχω υποσχεθή!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το δέχονται, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έχει σημασία πώς θα το πη κανείς. Δεν αρχίζω: «Τί χάλια είναι αυτά; Δεν ντρέπεσθε; Δεν σέβσθε τον ιερό χώρο!».Αλλά τους λέω: «Βρέ, παλληκάρια, εσείς μ΄ αυτά  τα μαλλιά βρίζετε τον ανδρισμό σας. Αν δήτε έναν τσολιά στην Ομόνοια να περπατά με μία γυναικεία τσάντα, πώς θα σάς φανή; Ταιριάζει μωρέ; Να τα κόψουμε τα μαλλιά!».Και τα κουρεύω. Ξέρετε τί μαλλιά μαζεύω; Καμμιά φορά, αν κανένας λίγο αντιδράση και αρχίση να ρωτάη «γιατί κ.λπ.», του λέω: «Τί «γιατί»; Καλόγερος δεν είμαι; Κουρές κάνω. Αυτή είναι η δουλειά μου»! Είναι ο τρόπος που θα το πής. Γελούν και αυτό είναι. μετά τα κουρεύω. Ονόματα δεν αλλάζω! Έναν μόνον τον έβγαλα Άξιον εστίν, γιατί εκείνη την ώρα περνούσε η Λιτανεία της εικόνος του «Άξιον εστίν»! Πώς χαίρονται οι γονείς που τα κουρεύω! Ξέρεις πόσες ευχές παίρνω από τους γονείς, από τις μανάδες; Ού, ού, ού!... Μόνον από αυτό θα με συγχωρέση ο Θεός!...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τώρα πάλι είναι μόδα να κόβουν τα μαλλιά και να αφήνουν πίσω κάτι μύτες. «Τί νόημα έχει, βρέ λεβέντες, αυτή η ουρά;», ρωτάω καμμιά φορά. «Την αφήνουμε, μου λένε, για να μας προσέξουν οι άλλοι». «Μωρέ, και να τους πληρώσετε τους άλλους, λέω, με τόσα προβλήματα που έχουν σήμερα, δεν πρόκειται να σάς προσέξουν». Βλέπεις άλλα, κοτζάμ παλληκάρια, να βάζουν σκουλαρίκια! Πόσα σκουλαρίκια έβγαλα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί φορούν μόνον ένα σκουλαρίκι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι αναρχικοί είναι που φορούν ένα σκουλαρίκι. Το ένα σκουλαρίκι στο αυτί είναι σύμβολο αναρχίας. Δεν το βάζουν έτσι από θηλυπρέπεια· τρυπούν το αυτί τους και το βάζουν σαν σήμα αντιδράσεως. Ήρθε ένα παλληκάρι με τον πατέρα του στο Καλύβι, είκοσι δύο χρονών, με μαλλιά, γένια και ένα σκουλαρίκι στο αυτί. «Δεν ταιριάζει, του λέω. Πολλοί σας παρεξηγούν· εγώ δεν σάς παρεξηγώ. Εκείνοι όμως δεν ξέρουν ότι είστε αναρχικοί και σάς παρεξηγούν». Το έβγαλε μετά και μου το έδωσε. Ήταν χρυσό. «Δόσ΄ το, του λέω, σε έναν χρυσοχόο να σού κάνη ένα σταυρουδάκι».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άλλοι, Γέροντα, βάζουν σκουλαρίκι και στην μύτη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό σημαίνει ότι ο διάβολος τους έβαλε τον χαλκά στην μύτη, μόνον που το καπίστρι δεν φαίνεται… Είναι και μερικοί που έχουν στον λαιμό πλατειές αλυσίδες χρυσές από ΄δώ, από ΄κεί! Έδωσα ένα ξεσκόνισμα σ΄ έναν· τις έβγαλα και μετά του είπα: «Να τις δώσης σ΄ ένα ορφανό ή να τις δώσης στην μάνα σου, για να τις δώση σε κανέναν φτωχό». Αφού τον φέρνω σ΄ έναν λογαριασμό, μου λέει: «Τί να κάνω;». «Από ΄κεί ν΄ αρχίσης, λέω· να φορέσης ένα σταυρουδάκι με μία αλυσίδα». Άνδρες τώρα, και να φορούν χρυσαφικά! Νάχη φαρδειές αλυσίδες, χρυσές, δυό-τρείς σειρές, που ούτε πριγκίπισσες δεν βάζουν, να φαίνωνται στον λαιμό, και να σού λέη το πρόβλημά του μετά. Το πρόβλημα είναι εκεί! Κανόνας! Σ΄ άλλους τα παίρνω, σ΄ άλλους λέω να τα δώσουν μόνοι τους. Έχουν χάσει το μέτρο. Ντίπ-ντίπ-ντίπ έχουν γίνει! Άλλοι βάζουν ζώδια στον λαιμό. Ρωτάω έναν: «Τί είναι αυτό; Πρώτη φορά το βλέπω». «Είναι το ζώδιό μου», λέει. Εγώ νόμιζα ότι είναι μία Παναγία. «Καλά, ζώα είστε, του λέω, και φοράτε ζώδια;». Λόξες! Η αταξία η εσωτερική ξεσπάει έξω. Να κάνουμε πολλή προσευχή ο Θεός να φωτίση την νεολαία, για να κρατηθή λίγο προζύμι.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι διψούν την απλότητα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Το καλό είναι ότι διψούν οι άνθρωποι την απλότητα και έφθασαν σε σημείο να κάνουν την απλότητα μόδα, και ας μη νιώθουν απλά. Έρχονται μερικοί στο Άγιον Όρος με κάτι ξεβαμμένα ρούχα. Λέω: «Αυτοί δεν δουλεύουν στα χωράφια, γιατί είναι έτσι;»Άλλος μιλάει χωριάτικα από φυσικού του και τον χαίρεσαι. Άλλος πάει να μιλήση χωριάτικα και σού έρχεται να κάνης εμετό. Είναι και μερικοί που έρχονται με τις γραβάτες τους… Από το ένα άκρο στο άλλο. Ένας είχε έξι-επτά γραβάτες μαζί του. Ένα πρωί που ετοιμαζόταν, φόρεσε την γραβάτα, το κουστούμι του κ.λπ. «Τί κάνεις εκεί;», του λέει κάποιος. «Θα πάω στον π. Παΐσιο», λέει. «Έ, και τί είναι αυτά  που φοράς;». «Τα φορώ, λέει, για να τον τιμήσω». Βρέ, τί πάθαμε!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Απλότητα δεν έχουν καθόλου· Γι’ αυτό υπάρχει αυτή η αλητεία. Όταν οι πνευματικοί άνθρωποι δεν ζουν απλά, αλλά είναι κουμπωμένοι, δεν βοηθούν την νεολαία. Έτσι τώρα οι νέοι, μη έχοντας κάποιο πρότυπο, ζουν αλήτικα. Γιατί, όταν βλέπουν κουμπωμένους Χριστιανούς, ανθρώπους σφιγμένους με γραβάτες, καλουπωμένους, δεν βρίσκουν σ΄ αυτούς καμμιά διαφορά από τους κοσμικούς και αντιδρούν. Αν έβλεπαν απλότητα στους πνευματικούς ανθρώπους, δεν θα έφθαναν σ΄ αυτήν την κατάσταση. Αλλά τώρα κοσμικό πνεύμα οι νέοι, κοσμική τάξη αυτοί. «Έτσι πρέπει να περπατάμε οι Χριστιανοί, έτσι πρέπει εκείνο, έτσι το άλλο…»Και δεν είναι ότι το κάνουν από μέσα τους, από ευλάβεια, αλλά γιατί «έτσι πρέπει». Όποτε και οι νέοι λένε: «Τί πράγματα είναι αυτά; Να πηγαίνουν στην Εκκλησία με σφιγμένο τον λαιμό! Άντε άπ΄ εκεί!».καί τα πετούν και γυρίζουν γυμνοί. Πιάνουν το άλλο άκρο. Κατάλαβες; Όλα αυτά  από αντίδραση τα κάνουν. Ενώ έχουν ιδανικά, δεν έχουν πρότυπα και είναι αξιολύπητοι. Γι’ αυτό χρειάζεται κανείς να τους κεντρίση το φιλότιμο και να τους συγκινήση με την απλή του ζωή. Αγανακτούν, όταν και αυτοί οι πνευματικοί άνθρωποι και οι ιερείς προσπαθούν με συστήματα κοσμικά να τους συγκρατήσουν. Όταν όμως βρουν την σεμνότητα, αλλά και την απλότητα και μία ειλικρίνεια, τότε προβληματίζονται. Γιατί, όταν κανείς έχη ειλικρίνεια και δεν υπολογίζη τον εαυτό του, είναι απλός, έχει ταπείνωση. Όλα αυτά  δίνουν ανάπαυση και στον ίδιο, αλλά είναι αισθητά και στον άλλον. Καταλαβαίνει ο άλλος αν τον πονάς ή υποκρίνεσαι. Ένας αλήτης είναι καλύτερος από έναν υποκριτή Χριστιανό. Γι’ αυτό όχι υποκριτικό γέλιο αγάπης αλλά φυσιολογική συμπεριφορά· ούτε κακία ούτε υποκρισία αλλά αγάπη και ειλικρίνεια. Περισσότερο με συγκινεί, όταν εσωτερικά είναι κανείς τοποθετημένος καλά. Να έχη δηλαδή σεβασμό και αγάπη πραγματική, να κινήται απλά, να μην κινήται με τύπους, γιατί τότε μένει κανείς μόνο στα εξωτερικά και γίνεται άνθρωπος εξωτερικός, δηλαδή αποκριάτικος καρνάβαλος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η εσωτερική καθαρότητα της όμορφης ψυχής του αληθινού ανθρώπου ομορφαίνει και το εξωτερικό του ανθρώπου και η θεία εκείνη γλυκύτητα της αγάπης του Θεού γλυκαίνει ακόμη και την όψη του. Η εσωτερική ομορφιά της ψυχής, εκτός που ομορφαίνει πνευματικά και αγιάζει τον άνθρωπο, ακόμη και εξωτερικά, και τον προδίδει με την θεία Χάρη, ομορφαίνει και αγιάζει και αυτά  τα άσχημα ρούχα που φοράει ο χαριτωμένος άνθρωπος του Θεού. Ο Πάπα-Τύχων έρραβε μόνος του σκουφιά με την σακκορράφα από κομμάτια ράσου, τα έκανε σαν σακκούλες, και τα φορούσε, αλλά σκορπούσαν πολλή χάρη. Ό,τι παλιό φορούσε ή ασουλούπωτο, δεν φαινόταν άσχημο, γιατί ομόρφαινε και αυτό από την εσωτερική ομορφιά της ψυχής του. Κάποτε τον φωτογράφισε ένας επισκέπτης όπως ήταν, με την σακκούλα για σκουφί και με μία πιτζάμα, που του είχε ρίξει στις πλάτες του, γιατί είδε τον Γέροντα να κρυώνει. Και τώρα όσοι βλέπουν στην φωτογραφεία τον Πάπα-Τύχωνα νομίζουν ότι φορούσε δεσποτικό μανδύα, ενώ ήταν μία παλιά παρδαλή πιτζάμα. Οι άνθρωποι και τα κουρέλια του τα έβλεπαν με ευλάβεια και τα έπαιρναν για ευλογία. Μεγαλύτερη αξία έχει ένας τέτοιος ευλογημένος άνθρωπος, που άλλαξε εσωτερικά και αγίασε και εξωτερικά, παρά όλοι οι άνθρωποι που αλλάζουν συνέχεια μόνον τα εξωτερικά (τά ρούχα τους) και διατηρούν εσωτερικά τον παλαιό τους άνθρωπο με αρχαιολογικές αμαρτίες.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Ουκ έσται σκεύη ανδρός επί γυναικί ουδέ μη ενδύσηται ανήρ στολήν γυναικείαν»[146]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς ν΄ αντιμετωπίσουμε τις γυναίκες που έρχονται στο Μοναστήρι με παντελόνι; Συχνά λένε ότι είναι πιο πρακτικό αλλά και πιο σεμνό από τα κοντά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σήμερα θα φορούν ή κοντά ή παντελόνια! Άντε τώρα! Αφού ξεκάθαρα το λέει η Παλαιά Διαθήκη, και βλέπεις και με τί λεπτομέρειες! «Δεν επιτρέπεται ο άνδρας να φοράη γυναικεία στολή και η γυναίκα ανδρική». Είναι νόμος και είναι και άπρεπο. Άνδρες που φορούν φουστάνια είναι ελάχιστοι, πολύ ελάχιστοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτές όμως που δουλεύουν στα χωράφια, λένε ότι δεν μπορούν να κινηθούν άνετα στην δουλειά, αν δεν φορούν παντελόνι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά  είναι δικαιολογίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, και για τα κοριτσάκια λένε οι μητέρες ότι τα φορούν παντελόνι, για να μην κρυώνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άλλη λύση δεν υπάρχει; Δεν υπάρχουν κάλτσες μέχρι πάνω; Έ, ας φορέσουν κάλτσες μέχρι πάνω, για να μην κρυώνουν. Άμα θέλει κανείς, για όλα βρίσκει λύσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, έρχωνται επίσημοι και έχουν μαζί τους και μία που φοράει παντελόνι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να τους κάνετε μία εξήγηση: «Θέλετε να κάνουμε μία οικονομία και να χαλάσουμε μία τάξη και να γίνη μία αταξία στο Μοναστήρι;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μία φορά, Γέροντα, ήρθαν τριάντα καθηγήτριες με παντελόνι και τις αφήσαμε να περάσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κακώς, δεν ταιριάζει! Να τις λέγατε: «Μάς συγχωρήτε, είναι αρχή του Μοναστηριού να μην επιτρέπουμε να μπαίνη γυναίκα που φοράει παντελόνι». Αυτές θα πάνε και σε άλλα Μοναστήρια και θα πούν: «Στο τάδε Μοναστήρι μας άφησαν να περάσουμε με παντελόνι». Τις οικονομήσατε εσείς, για να μην τις προσβάλετε, και εκείνες θα προσβάλουν μετά εσάς. Βάλτε στην πύλη πινακίδα με το σχετικό χωρίο από την Παλαιά Διαθήκη. Φτιάξτε και πενήντα φούστες και να τις δίνετε με καλό τρόπο σ΄ αυτές που έρχονται με παντελόνι πρώτη φορά και δεν ξέρουν ή σ΄ αυτές που φορούν κοντά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν έρθη ένα Λύκειο και όλα τα κορίτσια φορούν παντελόνια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να τους κεράσετε έξω από την πύλη. Αυτό τους προβληματίζει. Ή, αν ειδοποιήσουν ότι θα έρθουν για προσκύνημα, πέστε από το τηλέφωνο: «Σάς παρακαλούμε να μη φορούν οι καθηγήτριες και οι μαθήτριες παντελόνι». Έτσι θα καταλάβουν ότι χρειάζεται να σεβασθούν τον χώρο. Εδώ δεν είναι ενορία. Στην ενορία οφείλει ο ιερέας να διαφωτίση τις γυναίκες, για να καταλάβουν γιατί δεν πρέπει να φορούν παντελόνια, και να συμμορφωθούν. Αν καμμιά φορά πάνε στην Εκκλησία του γυναίκες από άλλη ενορία και φορούν παντελόνι, να φροντίση να βολέψη τα πράγματα. Η Εκκλησία είναι μητέρα· δεν είναι μητρυιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πολλοί όμως, Γέροντα, λένε: «Έτσι που κάνετε, διώχνετε τον κόσμο από την Εκκλησία».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μά αφού στην Παλαιά Διαθήκη υπάρχει εντολή από τον Θεό που απαγορεύει οι γυναίκες να φορούν ανδρικά ρούχα κ.λπ., τί άλλο θέλουν; Αλλά σου λένε: «Γιατί να μη φορούν και οι γυναίκες παντελόνια; Γιατί να μην μπούν στις Επιτροπές των Εκκλησιών και άθεοι, αφού Εκκλησία είναι ο λαός;». Έτσι η τύχη της Εκκλησίας θα εξαρτηθή από την απόφαση των αθέων. Θα κάνουν τις Εκκλησίες βιβλιοθήκες, αποθήκες κ.λπ., αφού όλα τα παίρνουν: «Γιατί εκείνο, γιατί το άλλο;». Τί να πής;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην Μονή δεν θα πρέπη να ανέχεται κανείς ούτε τους γυμνούς τουρίστες, για να μαζεύη χρήματα να ντύση φτωχούς ανθρώπους, γιατί αυτό είναι και τέχνασμα του πονηρού, για να αποξενώση τον μοναχό από τις ευλογίες του Θεού και να τον κοσμικοποιήση, ενώ η πραγματική ξενιτειά του μοναχού, για τον Χριστό, τον κάνει πλούσιο από αρετές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στο Στόμιο αναγκαζόσασταν να βάζετε πινακίδες για τους τουρίστες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, είχα πινακίδες. Στο Μοναστήρι είχα μία που έγραφε: «καλώς ορίσατε». Πιό κάτω, είκοσι λεπτά από το Μοναστήρι, είχα άλλη που έγραφε: «Οι ασέμνως ενδεδυμένοι προς Αώον»[147]και είχα ένα βέλος που έδειχνε το ποτάμι και μία άλλη που έγραφε: «Οι σεμνώς ενδεδυμένοι προς Ιεράν Μονήν»καί είχα ένα βέλος που έδειχνε το Μοναστήρι. Καλά δεν έγραφα;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εμείς, Γέροντα, τί να κάνουμε το καλοκαίρι που πολλές γυναίκες έρχονται με εξώπλατα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, κάντε κάτι να το ρίχνουν στην πλάτη. Έτσι θα καταλάβουν ότι χρειάζεται σεβασμός σ΄ αυτόν τον χώρο.
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Καλλωπισμός: Μουντζούρες στην εικόνα του Θεού'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τί χαμένος κόσμος υπάρχει σήμερα! Και οι γυναίκες τώρα βάζουν στα μαλλιά τους κάτι κόλλες και πώς μυρίζουν! Αλλεργία σε πιάνει. Όταν βλέπω κοσμικιά γυναίκα, με κοσμικές ομορφιές και αρώματα, αηδιάζω εσωτερικά. Μου είπαν: «Η τάδε πήγε στην Γερμανία να μάθη αισθητική». «Και τί είναι αισθητική;», ρώτησα. «Η αισθητικός, μου λένε, φτιάχνει τις γριές νέες». Τότε θυμήθηκα· είχα δει κάποτε μία ηλικιωμένη που είχε μία οριζόντια γραμμή στο μέτωπό της. Ρωτάω μετά έναν γνωστό της: «Τί έχει, η καημένη;». «Ά, τίποτε, μου λέει· έκανε εγχείρηση, για να τεντώση το δέρμα της, να φύγουν οι ρυτίδες». Κι εγώ νόμιζα ότι είχε χτυπήσει και είχε χειρουργηθή… Που φθάνει ο κόσμος σήμερα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σήμερα, Γέροντα, δεν θεωρούν αμαρτία τον καλωπισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αυτό κατάλαβα. Είδα μία ψυχή πού, ενώ πρώτα ήταν σαν Άγγελος, δεν την γνώρισα μετά έτσι όπως ήταν βαμμένη. «Ο Θεός όλα πολύ καλά τα έκανε, της είπα, αλλά έχει κάνει ένα μεγάλο λάθος σ΄ εσένα!».«Γιατί, Πάτερ;», μου λέει. «Νά, στα μάτια τα δικά σου, δεν έβαλε μελάνη από κάτω! Αυτό το λάθος έκανε! Ενώ τους άλλους ανθρώπους τους εφτίαξε καλούς, όμορφους, έκανε λάθος σ΄ εσένα! Βρέ, χαμένο, δεν το καταλαβαίνεις; Ασχημίζεις έτσι τον εαυτό σου! Σαν να έχης μία βυζαντινή εικόνα και τραβάς πινελιές από ΄δώ κι από ΄κεί και την μουντζουρώνεις, την χαλάς. Πάμε στην εικόνα του Θεού να βάλουμε μπογιές; Ή σαν ένας ζωγράφος νάχη φτιάξη μία καλή εικόνα, και πάει μετά ένας που δεν ξέρει ζωγραφική, παίρνει το πινέλο και κάνει κάτι μουντζούρες και ασχημίζει την εικόνα του ζωγράφου. Το ίδιο κάνεις κι εσύ. Έτσι είναι σαν να λές στον Θεό: «Δεν τάκανες καλά, Θεέ μου· εγώ θα τα διορθώσω»»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μία άλλη ήρθε μία μέρα με κάτι νύχια μέχρι εκεί, σαν το γεράκι, βαμμένα κόκκινα, και μου λέει: «Έχω το παιδί μου άρρωστα βαριά. Να κάνης προσευχή, Πάτερ! Κάνω και εγώ προσευχή, αλλά…»«Τί προσευχή κάνεις; της λέω. Εσύ γρατζουνάς τον Χριστό μ΄ αυτά  τα νύχια! Κόψε πρώτα τα νύχια, να γίνη καλά το παιδί. Για την υγεία του παιδιού σου, τουλάχιστον να κόψης τα νύχια και να πετάξης τις μπογιές». «Να τα βάψω άσπρα, Πάτερ;». «Εγώ σου λέω να ξεβάψης τα νύχια και να τα κόψης· να κάνης μία θυσία για την υγεία του παιδιού σου. Τί είναι αυτά; Αν ήταν, ο Θεός θα σε έκανε με νύχια κόκκινα». «Να τα βάψω άσπρα, Πάτερ;». Άντε τώρα!... «Καλά θα πάς και συ και το παιδί σου…»είπα από μέσα μου. Τα παιδιά περισσότερο τα κρυολογεί η μητέρα, όταν δεν είναι ντυμένη με την σεμνβότητα και προσπαθή ακόμη και να «μαδάη»τά παιδιά της.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μπορεί κάποιος να είναι λίγο άσχημος ή να έχη μία αναπηρία. Ξέρει ο Θεός ότι έτσι θα βοηθηθή πνευματικά, γιατί τον Θεό Τον ενδιαφέρει περισσότερο από το σώμα η ψυχή. Όλοι έχουμε τα καλά μας και λίγα κουσουράκια –σταυρουδάκια, όχι σταυρό – που μας βοηθούν για την σωτηρία της ψυχής μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τεταρτο Μεροσ – Η Εκκλησία στην εποχή μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Η Εκκλησία είναι Εκκλησία του Χριστού και Αυτός την κυβερνάει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν είναι Ναός που κτίζεται με πέτρες, άμμο και ασβέστη από ευσεβείς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί καταστρέφεται με φωτιά βαρβάρων, αλλά είναι ο ίδιος ο Χριστός».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η παιδεία
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ελληνική γλώσσα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί κατήργησαν τους τόνους από την γραμματική;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τώρα, όπως οι άνθρωποι δεν σηκώνουν τίποτε και τα πετούν όλα, έτσι και τα γράμματα δεν σηκώνουν τίποτε, ούτε οξείες ούτε περισπωμένες! Και όπως όλοι τρέχουν, δεν βάζουν ούτε τελεία!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπω μία γλώσσα που γράφουν μερικοί! Διάβαζα σε μία μετάφραση της Καινής Διαθήκης: «Από την Αίγυπτο κάλεσα τον γιό μου»[148]. Δεν ταιριάζει, βρέ παιδί! Δεν ξεχωρίζει το ιερό από το ανίερο! Γράφουν έτσι, δήθεν για να είναι όλα ίδια, να υπάρχη ομοιομορφία στην γλώσσα. Ποιός, ακόμη και από το πιο τελευταίο χωριό, δεν θα καταλάβαινε, αν έγραφε «τόν υιόν μου»; Άκουσα μία φορά στο Άγιον Όρος σε μία ανάγνωση: «Το ψωμί και το κρασί που κάνουν την Μεταλαβιά». Δεν ταιριάζει· πώς να το κάνουμε; Ποιός δεν ξέρει τί θα πη «άρτος»καί «οίνος»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Λένε, Γέροντα, ότι θα αντικαταστήσουν το ελληνικό αλφάβητο με το λατινικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άσ΄ τα, δεν θα σταθούν αυτά· δεν θα σταθούν. Ευτυχώς που ο Θεός και από το στραβό και από το κακό βγάζει καλό, αλλιώς θα ήμασταν χαμένοι. Δεν χάθηκε η Παράδοση, η γλώσσα τότε που τα είχαν όλα σε χειρόγραφα και δεν υπήρχαν ούτε τίποτε και θα χαθή τώρα που βγήκαν τόσα μέσα; Όχι, δεν πρόκειται να χαθή, ό,τι και να κάνουν οι άνθρωποι. Βλέπετε και οι Ρώσοι πρόσφυγες πώς κράτησαν τα έθιμά τους! Αυτό που τους βοήθησε ήταν που ήξεραν την ποντιακή γλώσσα. Κράτησαν έτσι την Παράδοση μέσα τους. Αλλά, πάρ΄ όλο που τους δόθηκε λίγη ελευθερία, έφυγαν από την Ρωσία, για να βρουν ελευθερία, γιατί και πάλι ήταν σαν ένα πουλάκι που το έβγαλαν από το κλουβί και το άφησαν μέσα στο δωμάτιο ελεύθερο. Δεν θα στενοχωριόταν και εκεί; Φαντασθήτε πώς ήταν πριν οι καημένοι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι και μερικοί που πάνε να κάνουν μία νέα γλώσσα. Η ελληνική όμως γλώσσα έχει «γλώσσα»από τις πύρινες Γλώσσες της Πεντηκοστής! Το δόγμα της πίστεώς μας καμμιά γλώσσα δεν μπορεί να το αποδώση. Γι’ αυτό οικονόμησε ο Θεός και η Παλαιά Διαθήκη μεταφράσθηκε από τους Εβδομήκοντα στην ελληνική γλώσσα και το Ευαγγέλιο γράφτηκε στην ελληνική γλώσσα. Αν δεν ξέρη Αρχαία Ελληνικά κανείς και ασχολήται με το δόγμα, μπορεί να πλανηθή. Και εμείς καταργήσαμε τα Αρχαία από τα σχολεία! Μετά από λίγο θα έρχωνται Γερμανοί να διδάσκουν Αρχαία στα δικά μας Πανεπιστήμια. Τότε θα καταλάβουν οι δικοί μας την αξία που έχουν τα Αρχαία Ελληνικά, αφού πρώτα γίνουν ρεζίλι, και θα πούν: «Για δές η Εκκλησία που κρατούσε τα Αρχαία»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάνε να εξαφανίσουν ένα ορθόδοξο έθνος. Ξέρετε τί σημαίνει αυτό; Ένα ορθόδοξο έθνος σήμερα είναι μεγάλη υπόθεση! Παλιά είχαμε την φιλοσοφία. Η Αγία Αικατερίνη με βάση την φιλοσοφία αποστόμωσε τους φιλοσόφους. Οι φιλόσοφοι ετοίμασαν τον δρόμο για τον Χριστιανισμό. Το Ευαγγέλιο γράφτηκε στα ελληνικά και διαδόθηκε στον κόσμο. Μετά οι Έλληνες προχώρησαν να φωτίσουν και τους Σλαύους. Σε μερικούς δεν συμφέρει να υπάρχη η Ελλάδα. «Μάς κάνει κακό, λένε. Πρέπει να την εξαφανίσουμε».
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα προβλήματα της παιδείας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνά λέτε ότι πάνε τα πάντα να διαλύσουν. Εννοείτε και την παιδεία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, δεν βλέπετε τί γίνεται; Σχολεία είναι αυτά; Γλώσσα είναι αυτή που διδάσκουν σήμερα στα παιδιά; Ποιά είναι η ιστορία μας; Αλλά και στην Θεολογία τί γίνεται; Έχει ένας άθεος πτυχίο της Θεολογίας και τον αφήνουν να διδάσκη θρησκευτικά. Δεν εξετάζουν όμως· θρησκευτικά διδάσκει ή αθεΐα; «Δεν μπορούμε, λένε, να τον βγάλουμε». Αν ένας φιλόλογος πάη να διδάξη μαθηματικά, θα τον αφήσουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άλλος είναι θεολόγος και δεν αφήνει τους ανθρώπους να κοινωνούν, για να μην κολλήσουν έιτζ! Είναι από αυτούς που τους έστειλε στην Θεολογική Σχολή το κομπιούτερ! Αυτή δεν είναι η γνώση του Θεού. Παλιά λέγανε: «Έμαθε τα ιερά γράμματα το παιδί», γιατί ήταν ιερά τα γράμματα. Βλέπεις καθηγητή Θεολογίας να μην πιστεύη, να βρίζη μπροστά στους φοιτητές τους Προφήτες και να μην τον βγάζουν. Μά τί θέλεις, καλέ μου άνθρωπε, στην Θεολογική Σχολή; Εσύ, τί θεολόγους θα βγάλης;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσο έχουν επιδράσει οι Προτεστάντες, οι Καθολικοί! Το άθεο πνεύμα πόσο μπήκε στον Καθολικισμό! Οι Καθολικοί πάνε σιγά-σιγά  να κουτσουρέψουν τους Αγίους. «Η Αγία Αικατερίνη, λένε, δεν ήταν μεγάλη Αγία· ένας μικρός βασιλίσκος ήταν ο πατέρας της. Ο Άγιος Νικόλαος ήταν μικρός Άγιος. Ο Άγιος Γεώργιος μύθος. Ο Αρχάγγελος Μιχαήλ δεν υπήρχε· ήταν μία παρουσία του Θεού. Το ίδιο και ο Αρχάγγελος Γαβριήλ». Μετά θα πούν: «Ο Χριστός δεν είναι Θεός· ήταν μόνον ένας δάσκαλος μεγάλος». Μετά θα προχωρήσουν και άλλο: «Ο Θεός είναι μία δύναμη». Και μετά θα πούν: «Ο Θεός είναι η φύση»! ενώ υπάρχουν γεγονότα χειροπιαστά, Προφήτες, προφητείες, τόσο ζωντανά θαύματα, φθάνουν και μερικοί δικοί μας στο σημείο να πιστεύουν τέτοιες χαζομάρες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ήρθε και σ΄ εμένα κάποιος να πάρη ευλογία, για να πάη στην Ιταλία να σπουδάση Λειτουργική και να κάνη διατριβή. «Είσαι στα καλά σου; του είπα. Θέλεις να πάς στους Ιησουΐτες να κάνης την διατριβή σου και ήρθες να σού δώσω και ευλογία; Αυτοί δεν ξέρουν τί τους γίνεται! Εκεί διδάσκουν Ουνίτες, Ιησουΐτες, δεν ξέρω τί!».Θέλει προσοχή από όλες τις απόψεις. Γιατί έτσι κάνουν· πάνε, σπουδάζουν στην Αγγλία, Γαλλία κ.λπ., πιάνουν τα ευρωπαϊκά μικρόβια και κάνουν μετά διατριβή. Μελετούν λ.χ. τους Έλληνες Πατέρες σε μετάφραση που έκαναν οι ξένοι στην γλώσσα τους. Εκείνοι, είτε επειδή από πονηριά, πρόσθεσαν και τα δικά τους τα λανθασμένα. Οι δικοί μας πάλι, οι Ορθόδοξοι, που μάθανε τις ξένες γλώσσες, παίρνουν από ΄κεί τα ξένα μικρόβια και τα μεταφέρουν εδώ και μετά τα διδάσκουν κιόλας. Φυσικά, όταν προσέξη κανείς, εύκολα ξεχωρίζει τον χρυσό από το κεχριμπάρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικά παιδιά που είναι κοντά στην Εκκλησία, όταν βγουν για σπουδές στο εξωτερικό, επειδή δεν περνάνε εδώ στο Πανεπιστήμιο, χάνουν την πίστη τους και παραστρατούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θα πω σε κανέναν από αυτούς που γνωρίζω, να κάνουν ακόμα κάνα-δυό Πανεπιστήμια εδώ στην Ελλάδα, για να μην βγαίνουν τα παιδιά έξω. Να σπουδάζουν εδώ, γιατί και τα παιδιά χάνονται και οι γονείς ξοδεύονται και τόσο συνάλλαγμα βγαίνει έξω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πάντα λέω στα παιδιά που πάνε έξω για σπουδές: «Να πάτε, αφού το θέλετε, αλλά να προσέξετε να μη χάσετε την πίστη σας· να πάρετε μόνον τις γνώσεις τους. Και προπαντός μην ξεχάσετε να γυρίσετε πίσω στην Πατρίδα. Η Ελλάδα σάς περιμένει. Έχετε χρέος να την βοηθήσετε. Να είστε κοντά στους Έλληνες, για να μην αναγκάζωνται οι καημένοι να τρέχουν στο εξωτερικό, για να βρουν έναν γιατρό ή έναν ειδικό για μία επιστήμη. Πολύ να προσέξετε να μην ψυχραθή η καρδιά σας. Οι Ευρωπαίοι είναι ψυχροί. Η Αμερική πάλι είναι μόνο για να πλουτίζη κανείς υλικά και να χρεωκοπή πνευματικά».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και οι απεργίες, Γέροντα, τί κακό κάνουν! Ολόκληρο μήνα χωρίς μάθημα τα παιδιά, να γυρίζουν στους δρόμους!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ λέω στους δασκάλους ποτέ να μην κάνουν απεργία, εκτός αν πάνε να καταργήσουν λ.χ. τα θρησκευτικά, την προσευχή ή να κατεβάσουν τον σταυρό από την σημαία κ.λπ. Τότε πρέπει να διαμαρτυρηθούν. Αλλιώς τί φταίνε τα παιδιά να χάνουν μαθήματα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, έτσι που έχει διαμορφωθή η παιδεία θα κάνη πολύ κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τώρα θα σακατευτούν πολλά παιδιά, αλλά και ο Καλός Θεός θα κρίνη ανάλογα. Θα εξετάση σε τί κατάσταση θα ήταν, αν δεν τα επηρέαζαν και δεν τους έκαναν κακό. Όμως και εμείς χρειάζεται να κάνουμε πολλή προσευχή για τα καημένα τα παιδιά, ώστε να επέμβη ο Θεός να τα βοηθήση και να μη σακατευτούν, αλλά να είναι υγιέστατα πνευματικά και να αποκτήσουν αρετές.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η θεωρία της εξελίξεως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τί ανοησίες λένε τώρα στα σχολεία με την θεωρία του Δαρβίνου κ.λπ.! Ενώ οι ίδιοι αυτές τις ανοησίες δεν τις πιστεύουν, τις λένε όμως, για να μολύνουν τα παιδιά, να τα απομακρύνουν από την Εκκλησία. Μου είπε κάποιος: «Αν πούμε ότι το χώμα είχε διάφορα συστατικά, διάφορους οργανισμούς, και ο Θεός πήρε από αυτά  και έκανε τον άνθρωπο…»«Δηλαδή, λέω, αν δεν υπήρχαν αυτά, δεν μπορούσε ο Θεός να κάνη τον άνθρωπο; Δύσκολο πράγμα!».«Αν πούμε, μου λέει, ότι πήρε πρώτα από τον πίθηκο και τον τελειοποίησε;». «Καλά, του λέω, δεν μπορούσε ο Θεός να κάνη το τέλειο δημιούργημα, τον άνθρωπο, που διέθεσε Γι’ αυτόν ολόκληρη ημέρα; Έπρεπε να βρη ανταλλακτικά; Διάβασε να δής τί λέει στην Προφητεία του Ιώβ[149], στο Ανάγνωσμα της Μεγάλης Πέμπτης. Τώρα αυτά  για τον πίθηκο ούτε η επιστήμη τα παραδέχεται. Πόσα χρόνια έχει που οι άνθρωποι ανέβηκαν στο φεγγάρι; Οι πίθηκοι τόσα χρόνια δεν εξελίχθηκαν να κάνουν αν όχι ένα ποδήλατο τουλάχιστον ένα πατίνι. Είδες κανέναν πίθηκο με πατίνι; Άλλο, αν πάρης έναν πίθηκο και του μάθης να κάνη πατίνι!...»«Αν πούμε, λέει, εκείνο, αν πούμε εκείνο…;». «Μη λές τίποτε, του λέω, για νάσαι πιο σίγουρος».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αυτήν την θεωρία δίδασκε και ένας καθηγητής του Πανεπιστημίου. Του είπα μία φορά: «Σιγά-σιγά, με την περιποίηση, η φασολιά θα γίνη καλύτερη φασολιά, η μελιτζανιά καλύτερη μελιτζανιά. Ο πίθηκος, άμα τον ταΐσης, άμα τον περιποιηθής, θα γίνη καλύτερος πίθηκος· δεν μπορεί να γίνη άνθρωπος. Αν ένας μαύρος είναι σε ψυχρό κλίμα και δεν βγαίνη στον ήλιο, λιγάκι θα διορθωθή το δέρμα του· δεν θα πάψη όμως να είναι μαύρος». Και ύστερα, αν σκεφθής ότι από άνθρωπο, την Παναγία μας, γεννήθηκε ο Χριστός! Δηλαδή πρόγονος του Χριστού ήταν ο πίθηκος; Τί βλασφημία! Και δεν το καταλαβαίνουν ότι βλασφημούν. Ρίχνουν μία πέτρα και δεν κοιτούν πόσα κεφάλια θα σπάση. Σού λέει: «Εγώ την έρριξα πιο μακριά από τον άλλον». Αυτό κάνουν σήμερα· θαυμάζουν ποιός θα πετάξη πιο μακριά την πέτρα. Πόσα κεφάλια θα σπάση από αυτούς που περνάνε εκεί κάτω, δεν το σκέφτονται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί νομίζουν ότι με αυτές τις θεωρίες θα κάνουν τους Μαρξιστές να πλησιάσουν στην Εκκλησία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Στην αρχή, μπορεί να πλησιάσουν οι Μαρξιστές, αλλά μετά θα έρθουν σαν κόμμα. Θα λένε: «Τώρα να εκκλησιάζεσθε, τώρα όχι. Τώρα να κάνετε αυτό, τώρα εκείνο». Θα κανοναρχούν δηλαδή· και στο τέλος θα πούν: «Ποιός σάς είπε ότι υπάρχει Θεός; Δεν υπάρχει Θεός. Σάς γελούν οι παπάδες». Και έτσι, χωρίς να το καταλαβαίνουν, τους χρησιμοποιούν οι Μαρξιστές, για να πετύχουν τον σκοπό τους. Όσοι Μαρξιστές έχουν καλή διάθεση, έρχονται, μετανοούν, εξομολογούνται. Όσοι δεν έχουν καλή διάθεση, δεν πρόκειται να αλλάξουν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Απομακρύνουν τα παιδιά από την Εκκλησία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μικρό παιδάκι, πόσο με βοηθούσε που πήγαινα στην Εκκλησία! Είχαμε καλό δάσκαλο στο Δημοτικό και μας βοηθούσε και αυτός.Μας μάθαινε εθνικά άσματα και εκκλησιαστικούς ύμνους. Στην Εκκλησία τις Κυριακές ψάλλαμε την Δοξολογία,«Ταις πρεσβείαις…»,«Άγιος ο Θεός», το Χερουβικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τα κοριτσάκια ψάλλανε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, όλα μαζί τα παιδιά. Παλιά, η Εκκλησία ήταν δίπλα στο σχολείο και παίζαμε γύρω από την Εκκλησία, στην αυλή της.Μας πήγαιναν στην Εκκλησία οι δάσκαλοι στις γιορτές, και ας χάναμε κανένα μάθημα. Προτιμούσε ο δάσκαλος να χάση μία ώρα, για να λειτουργηθούν τα παιδιά. Έτσι τα παιδιά διδάσκονταν, αγιάζονταν, γίνονταν αρνάκια. Είχαμε και έναν δάσκαλο Εβραίο, αλλά θρησκευτικά δεν μας δίδασκε· ερχόταν μία δασκάλα και μας έκανε θρησκευτικά. Πάρ΄ όλο όμως που ήταν Εβραίος, μας πήγαινε μέχρι την Εκκλησία. Και στην Εκκλησία όλα τα παιδιά στεκόμασταν όρθια, ήσυχα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπω σήμερα που απομακρύνουν τα παιδιά από την Εκκλησία, πώς έχουν αγριέψει! Ενώ στην Εκκλησία το παιδάκι θα ηρεμήση, θα γίνη καλό παιδί, γιατί δέχεται την ευλογία του Θεού, αγιάζεται. Δεν τα αφήνουν να πηγαίνουν στην Εκκλησία, για να μην επηρεασθούν από τα πνευματικά! Από τις άλλες ανοησίες όχι μόνον δεν τα απομακρύνουν, αλλά τους τις διδάσκουν κιόλας! Μά δεν καταλαβαίνουν ότι τα παιδάκια, αν επηρεασθούν, ας υποθέσουμε, από την Εκκλησία, από την θρησκεία, στο κάτω-κάτω δεν θα κάνουν αταξίες, θα είναι φρόνιμα, θα έχουν επιμέλεια στα μαθήματά τους, δεν θα είναι ζαλισμένα όπως τώρα. Μέχρι να μεγαλώσουν, και στα θέματα τα εθνικά θα είναι σωστά τοποθετημένα, δεν θα μπλέξουν με παρέες, με ναρκωτικά, να αχρηστευθούν. Όλα αυτά  δεν θα είναι μία προϋπόθεση να γίνουν καλοί άνθρωποι; Αυτό τουλάχιστον δεν το αναγνωρίζουν; Δεν το σέβονται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά σκοπός τους τώρα είναι να απομακρύνουν τα παιδιά από την Εκκλησία. Τα δηλητηριάζουν, τα μολύνουν με διάφορες θεωρίες, κλονίζουν την πίστη τους. Τα εμποδίζουν από το καλό, για να τα αχρηστέψουν. Τα καταστρέφουν από μικρά. Και τα παιδάκια, φυσικά, από αρνάκια γίνονται κατσικάκια. Αρχίζουν μετά να χτυπούν άσχημα και τους γονείς τους και τους δασκάλους και αυτούς που τα κυβερνούν. Τα κάνουν όλα άνω-κάτω· συλλαλητήρια, καταλήψεις, αποχή από τα μαθήματα. Και τελικά, όταν φθάσουν να ξεκοιλιάσουν αυτούς που τα κυβερνούν, τότε θα βάλουν και αυτοί μυαλό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Φορτώνουν τα παιδιά με πολλά…
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω παιδιά που έχουν τελειώσει όχι μόνο Λύκειο αλλά και Πανεπιστήμιο να γράφουν κάτι γράμματα, να κάνουν κάτι λάθη… Εμείς του Δημοτικού ήμασταν και τέτοια λάθη δεν κάναμε. Και αν είναι φοιτητές της Φιλολογίας ή της Νομικής, κάτι γίνεται. Αν είναι άλλης Σχολής, δεν ξέρουν να γράψουν. Ενώ το Σχολαρχείο παλιά ήταν…
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σαν Πανεπιστήμιο, Γέροντα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εδώ βλέπεις και στο Δημοτικό πόσα μάθαιναν τότε τα παιδιά, πόσο μάλλον στο Σχολαρχείο! Σήμερα τα φορτώνουν ένα σωρό και τα μπερδεύουν. Τα μπουχτίζουν στα γράμματα χωρίς πνευματικό αντιστάθμισμα. Στα σχολεία τα παιδιά πρέπει πρώτα να μαθαίνουν τον φόβο του Θεού. Μικρά παιδιά να πάνε να μάθουν αγγλικά, γαλλικά, γερμανικά –ενώ Αρχαία να μη μάθουν – μουσική, το ένα, το άλλο… Τί να πρωτομάθουν; Όλο γράμματα και αριθμούς και εκείνα που είναι να μάθουν, για την Πατρίδα τους κ.λπ., δεν τα μαθαίνουν. Ούτε πατριωτικά τραγούδια ούτε τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πιάσε ένα από τα σημερινά παιδιά τώρα και ρώτησε τό: «Σε ποιό νομό είναι το χωριό σου; Πόσο πληθυσμό έχει;». Δεν ξέρει να σού πή. Σού λέει: «Θα πάω στο Πρακτορείο, θα πάρω το λεωφορείο και θα με πάη στο χωριό. Αφού ξέρει ο εισπράκτορας, θα του πω ότι θέλω να πάω στο τάδε χωριό, θα πληρώσω και θα με πάη». Εμείς στο Δημοτικό ξέραμε όλον τον κόσμο άπ΄ έξω. Γιατί έπρεπε να ξέρης άπ΄ έξω τις πόλεις όλων των κρατών από πεντακόσιες χιλιάδες κατοίκους και άνω. Μετά έπρεπε να ξέρης τα μεγαλύτερα ποτάμια στο φάρδος και στο μάκρος και τα αμέσως μικρότερα, τα μεγαλύτερα βουνά κ.λπ. –πόσο μάλλον της Ελλάδος! Το έχω δει και σε μεγάλους όχι μόνο σε μικρά παιδιά· φοιτητής να μην ξέρη πόσους κατοίκους έχει η πόλη στην οποία σπουδάζει! Ρώτησα έναν ποιό είναι το μεγαλύτερο βουνό της Ελλάδος, και δεν ήξερε. Ποιό είναι το μεγαλύτερο ποτάμι, τίποτε. Το πιο μικρό, ούτε αυτό. Φοιτητής και να μην ξέρη τίποτε για την Πατρίδα του! Θά΄ ρθούν μετά οι … «φίλοι»μας, οι γείτονες, και θα του πούν: «Αυτή δεν είναι πατρίδα σου· είναι πατρίδα δική μας», και θα τους απαντήση: «Καλά λέτε, έτσι είναι»! Καταλάβατε; Εκεί πάμε! Αν ρωτήσης όμως τα σημερινά παιδιά για το ποδόσφαιρο ή για την τηλεόραση, τα ξέρουν όλα και όλους άπ΄ έξω.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπεις, ήρθαν παιδιά από την Αλβανία και ήξεραν γράμματα. «Που τα μάθατε τα γράμματα;», ρωτάς τους Βορειοηπειρώτες. «Στις φυλακές», σού λένε. Εκείνα τις φυλακές τις έκαναν σχολεία. Τα δικά μας τα παιδιά τα σχολεία τα έκαναν φυλακές· κλείστηκαν μόνα τους μέσα με τις καταλήψεις… Τα παιδιά σήμερα, ιδίως στην εφηβική ηλικία, είναι ζαλισμένα· πιο πολύ στο Γυμνάσιο και στο Λύκειο. Στο πανεπιστήμιο είναι πιο ώριμα. Εκεί άλλωστε, όποτε θέλουν πηγαίνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και αντί να λάβουν ορισμένα μέτρα για την παιδεία, κάνουν χειρότερα. Και όλα, βλέπω, τα πνευματικά πώς τα αλλοιώνουν. Άκου τώρα προσευχή[150]σε αναγωνστικό του Δημοτικού Σχολείου: «Παναγιά μου, το μωρό σου είναι το πιο όμορφό του κόσμου»! Βρέ, τί πάθαμε! Παλιά τί μάθαιναν τα παιδιά στο σχολείο και τώρα τί μαθαίνουν! «Γιδούλα τετραπέρατη, κατσικοστριφτοκέρατη, μάσε τα διαβολάκια σου… να κάνουν κατσικόγαλο, να φάνε τα εγγονάκια σου, τα τρελλοδιαβολάκια σου»[151]. Άντε τώρα να μαθαίνουν τέτοια πράγματα μικρά παιδιά! Αλλά το κάνουν για να προβάλουν τον διάβολο, όποτε από την άλλη οι Σατανιστές κάνουν την δουλειά τους. Ο Θεός να βάλη το χέρι Του, γιατί τώρα δεν βοηθιούνται να αλλοιώνωνται τα παιδιά, με την καλή έννοια, αλλά να δαιμονίζωνται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και με τις γνώσεις που παίρνουν, δεν μαθαίνουν να δουλεύουν καθόλου το μυαλό, Γι’ αυτό δεν παίρνει στροφές. Αλλά μυαλό που δεν παίρνει στροφές έχει αντάρα μέσα. Αυτοί που έκαναν εφευρέσεις, δούλευαν το μυαλό τους. Βρίσκονταν σε μία ανάγκη, σκέφτονταν πώς θα την ξεπεράσουν. Σήμερα οι περισσότεροι κοιτάζουν τί γράφουν τα βιβλία, τί γράφουν οι σημειώσεις. Σ΄ αυτά  παραμένουν· τίποτε παραπάνω και όλο νούμερα και αριθμούς έχουν· αυτή η βίδα στο νούμερο 1, η άλλη στο νούμερο 2, και αν τύχη να πάθη τίποτε καμμιά βίδα και δεν δουλεύη το μηχάνημα, αμέσως: «Να φωνάξουμε τον μηχανικό». Δεν τους κόβει να πάρουν μία λίμα, να ανοίξουν λίγο την τρύπα, για να χωρέση η βίδα, ή να πάρουν λίγο πλαστικό, να τυλίξουν την βίδα, για να σφίξη, αλλά αμέσως: «Να φωνάξουμε τον μηχανικό», λένε. Τί να πώ; Και οι τηλεοράσεις και τα άλλα μέσα έχουν αποβλακώσει σήμερα τον άνθρωπο. Και έξυπνοι άνθρωποι γίνονται τελικά κασσέττες. Θέλω να τονίσω δηλαδή πώς ο άνθρωπος πρέπει να δουλεύη το μυαλό. Όλη η βάση εκεί είναι. γιατί, αν δεν δουλεύη το μυαλό, μαθαίνει, ας υποθέσουμε, τώρα αυτό, θα μπερδευθή ύστερα στο άλλο. Γι’ αυτό σκοπός είναι να γεννάη το μυαλό του, να βρίσκη λύσεις. Αν δεν γεννάη, τότε είναι υπανάπτυκτο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το έργο του δασκάλου είναι ιερό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές οι δυσκολίες των εκπαιδευτικών στο σχολείο προέρχονται πιο πολύ από τους συναδέλφους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θέλει πολλή διάκριση και φωτισμό στην εποχή μας, για να κινηθή σωστά ο καθένας ανάμεσα στους συναδέλφους του. Για την κάθε περίπτωση χρειάζεται πολλή σύνεση και θείος φωτισμός. Ακόμη και να μη δείχνη μερικές φορές ότι πιστεύει. Να κινήται αθόρυβα και πιο πολύ να τους μιλάη με την σωστή ορθόδοξη ζωή του. Έτσι θα βοηθήση, χωρίς να ερεθίση. Ιδίως στην εκπαίδευση μερικά πράγματα είναι σαν ένας όγκος, που άλλοτε είναι καλοήθης και άλλοτε κακοήθης. Αν πάρουμε μία θέση με μία λογική, θα κάνουμε πολύ κακό αντί για καλό. Αν γίνη επέμβαση και ο όγκος είναι κακοήθης, θα κάνη μετάσταση. Θέλει λίγη καυτηρίαση προσεκτικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πάντως, Γέροντα, και οι εκπαιδευτικοί που θέλουν να κάνουν δουλειά δυσκολεύονται, γιατί είναι δεσμευμένοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Άμα θέλη κανείς, μπορεί να βρη τρόπο να κάνη δουλειά. Μπόρεσαν και βρήκαν τρόπο στα άθεα καθεστώτα και δεν μπορούν να βρουν εδώ; Στην Βουλγαρία πήγε κάποιος από ΄δώ και μοίρασε σταυρουδάκια στα παιδιά ενός σχολείου. Ένας όμως του κόμματος που στέκονταν εκεί κοντά τον είδε. Η δασκάλα, μόλις τον αντιλήφθηκε, πήγε και πήρε τα σταυρουδάκια από τα χέρια των παιδιών και τα μάλωσε που τα πήραν. Αλλά όταν έφυγε εκείνος ο άθεος, η δασκάλα τα μοίρασε μόνη της στα παιδάκια. Είδες πώς η δασκάλα ήταν εντάξει και με τον νόμο και με τον Θεό; Βλέπεις και οι δάσκαλοι στην Μικρά Ασία, μέσα σ΄ εκείνα τα δύσκολα χρόνια, πόσα πρόσφεραν! Γιατί δούλευαν με την καρδιά τους. Πονούσαν, είχαν ευλάβεια, θυσιάζονταν. Νά, και ο Άγιος Αρσένιος[152]ο Καππαδόκης πόσο σοφά φερόταν στα Φάρασα! Είχε ετοιμάσει αίθουσα για σχολείο και αντί για θρανία είχε βάλει δέρματα από κατσίκες ή από πρόβατα με το τρίχωμά τους. Πάνω σ΄ αυτά  γονατισμένα τα παιδιά παρακολουθούσαν τα μαθήματα. Με αυτόν τον σοφό τρόπο δεν ερέθιζε τους Τούρκους, ακόμη και όταν τύχαινε να τα δούν, γιατί νόμιζαν ότι προσεύχονταν. Όταν πάλι ο Άγιος Αρσένιος ήθελε να βγάλη εκδρομή τα παιδιά, τα πήγαινε σε ένα δικό του χωράφι που ήταν σαν κήπος, δήθεν για να κάνουν δουλειά, και τα έλεγε: «Αν τυχόν δήτε Τούρκο, να κάνετε κανένα κουτσοδούλι. Κόψτε κανένα κλαρί, για να νομίζη ότι καθαρίζετε τον κήπο». Και έτσι έκαναν τα καημένα. Γιατί, αν καταλάβαιναν οι Τούρκοι ότι τα πήγε εκδρομή, θα είχε ιστορίες. Κρυφό σχολειό βλέπεις! Όταν έφευγε ο Τούρκος, έπαιζαν πάλι τα παιδιά. Και το καλοκαίρι, στις διακοπές, τα συγκέντρωνε πάλι τα παιδιά με τον ίδιο τρόπο, για να βοηθάη, για να μην ξεκόβωνται και ξεχνούν όσα τους δίδασκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ο Άγιος Αρσένιος έγραφε τα μαθήματα στα τουρκικά με ελληνικά γράμματα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να ξέρουν και τουρκικά τα παιδιά, ώστε να μπορούν να τα βγάλουν πέρα. Και αν τυχόν τον επίαναν οι Τούρκοι που μάθαινε γράμματα στα παιδιά, και να έβλεπαν τα ελληνικά γράμματα, άκουγαν ότι τα διάβαζε τουρκικά και δεν εξαγριώνονταν. Όποτε τα παιδιά μάθαιναν και τα τουρκικά, αλλά και οι Τούρκοι δεν ερεθίζονταν. Όλα όσα ζούσε ο Άγιος[153], την ακρίβεια της Ορθοδοξίας, την ευλάβεια, τα μετέδιδε στους μαθητές του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αυτό λέω, άμα θέλη κανείς, μπορεί να κάνη δουλειά στα παιδιά, όπου και αν βρεθή. Έπεσε στα χέρια μου ένα ωραίο βιβλίο που έγραψε μία δασκάλα για την Βόρειο Ήπειρο. Αυτή για πεντακόσιους άνδρες κάνει. Πώς μιλούσε στους ξεναγούς! Σβούρα τους έφερνε. Μπράβο της!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι μεγάλη υπόθεση ο σωστός δάσκαλος, ιδίως στις μέρες μας! Τα παιδιά είναι άγραφες κασσέττες· ή θα γεμίσουν βρώμικα τραγούδια ή βυζαντινή μουσική. Το έργο του δασκάλου είναι ιερό. Έχει μεγάλη ευθύνη καί, αν προσέξη, μπορεί να πάρη μεγάλο μισθό από τον Θεό. Να φροντίζη να διδάσκη στα παιδιά τον φόβο του Θεού. Πρέπει να βρουν τρόπο οι εκπαιδευτικοί να περνάνε κάποια μηνύματα στα παιδιά για τον Θεό και για την Πατρίδα. Ας σπείρουν αυτοί τον σπόρο, και ας μην τον δούν να βλαστάνη. Τίποτε δεν πάει χαμένοκαποια στιγμή θα πιάση τόπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και πάντα με το καλό, με επιείκεια, με αγάπη να φέρωνται στα παιδιά. Να προσπαθούν να ξυπνάνε το φιλότιμό τους. Το παιδί θέλει αγάπη, ζεστασιά. Πολλά παιδιά την στερούνται τελείως στο σπίτι. Αν οι δάσκαλοι αγαπήσουν τα παιδιά, θα τους αγαπήσουν και εκείνα, και τότε θα κάνουν πιο εύκολα το έργο τους. Εμάς ο δάσκαλος με την βέργα μας χτυπούσε, όταν έβλεπε αταξία, αλλά αγαπούσε τα παιδιά και τα παιδιά τον αγαπούσαν. Δεν είχε δικά του παιδιά και τα αγαπούσε τα παιδιά πολύ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αυτό λέω ότι καλοί είναι οι γονείς που γεννούν πολλά παιδιά και γίνονται πολύτεκνοι, αλλά καλύτεροι είναι οι σωστοί εκπαιδευτικοί που αναγεννούν του κόσμου τα παιδιά και γίνονται υπέρ-υπέρ-πολύτεκνοι! Δίνουν αναγεννημένους ανθρώπους στην κοινωνία, και έτσι γίνεται καλύτερη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Κλήρος και Εκκλησία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί δεν γίνεσθε ιερεύς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκοπός είναι να σωθούμε. Η ιερωσύνη δεν είναι μέσο για να σωθή ο άνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν σάς πρότειναν ποτέ να γίνετε ιερεύς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πολλές φορές με πίεσαν. Όταν ήμουν στο Κοινόβιο, με ζόρισαν και για την ιερωσύνη και για το Μεγάλο Σχήμα. Ο σκοπός είναι να γίνη κανείς από μέσα του καλόγερος. Εμένα αυτό με ενδιέφερε· δεν με απασχολούσε τίποτε άλλο. Επειδή και από νέος, σαν λαϊκός, είχα ζήσει μερικά θεία γεγονότα, όταν πήγα στο Μοναστήρι, έλεγα: «Αρκεί να ζώ καλογερικά». Την βαρύτητα σ΄ αυτό την είχα ρίξει και δεν με απασχολούσε πότε θα γίνω μεγαλόσχημος ή αν θα γίνω ιερεύς. Τελευταία ήρθε κάποιος στο Κελλί της Παναγούδας και πάλι επέμενε πολύ να ιερωθώ. Πήγε στο Πατριαρχείο Γι’ αυτόν τον λόγο, μίλησε στην Εξαρχία, όταν ήρθε στο Άγιον Όρος… Του είπαν όμως: «Πές το και στον ίδιο, μην τυχόν εμείς το αποφασίσουμε και αυτός μας φύγη». Έτσι ήρθε και μου το είπε. Όταν το άκουσα, έβαλα τις φωνές, όποτέ μου λέει: «Τουλάχιστον γίνε ιερεύς, για να διαβάζης την συγχωρητική ευχή στους ανθρώπους, αφού σου λένε εκτός από τα προβλήματά τους και τις αμαρτίες τους. Εσύ δεν μου έλεγες πόσα μπερδέματα γίνονται, γιατί οι άνθρωποι άλλοτε τα λένε διαφορετικά και άλλοτε λένε τα μισά από όσα τους λές στους Πνευματικούς ή στους μητροπολίτες; Να ακούς τις αμαρτίες τους, να τους διαβάζης την συγχωρητική ευχή, να παίρνουν την άφεση και να τακτοποιούνται». Ο καημένος με καλό λογισμό το έλεγε, αλλά δεν ήταν αυτό για μένα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, αν ένας αισθάνεται αδύναμος για την ιερωσύνη, αλλά τον προωθούν άλλοι, τί πρέπει να κάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θα πη τον λογισμό του. Κανέναν δεν μπορούν να τον εξαναγκάσουν ούτε για την ιερωσύνη ούτε για το Μεγάλο Σχήμα. Αν όμως το δεχθή από υπακοή και με ταπείνωση και βάλη λίγο φιλότιμο και λίγη αγάπη, τότε όλα θα τα αναπληρώση ο Θεός. Εξάλλου ο κόσμος έχει αλάθητο κριτήριο και διακρίνει ποιοί έγιναν ιερείς από αγάπη προς τον Θεό, για να διακονήσουν την Εκκλησία Του. Είναι μερικοί που θέλουν να γίνουν ιερείς από επιθυμία να δοξασθούν. Αυτοί θα ταλαιπωρηθούν, όταν βρεθούν σε δυσκολία, γιατί ο Χριστός δεν θα τους βοηθήση, εκτός αν ταπεινωθούν και μετανοήσουν. Αν όμως κάποιος θέλη να ιερωθή, χωρίς να έχη επιδιώξεις κοσμικές, τότε, αν κινδυνεύση, ο Χριστός θα τον βοηθήση. Κανονικά πρέπει να σε πιέζουν, να θέλουν οι άλλοι, η Εκκλησία, για να γίνης ιερεύς, ώστε να σε σκεπάζη ο Χριστός καί, αν βρεθής σε δύσκολη στιγμή, να σε συμπαρασταθούν οι άλλοι και να βοηθήση και ο Χριστός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βέβαια στον κλήρο σπάνια και πολύ λίγοι είναι αυτοί που ξεκινούν με προγράμματα δικά τους. Αυτούς δεν τους βάζω στον λογαριασμό. Οι περισσότεροι ξεκινούν με καλή διάθεση, αλλά μετά αρχίζει ο διάβολος την δουλειά του, και βλέπεις να μπαίνη η δόξα, να μπαίνη η μανία για αξιώματα και να τα ξεχνούν όλα. Μέχρι που φθάνουν σε σημείο να βάζουν και ανθρώπους να μεσολαβήσουν για την εκλογή τους σε προϊστάμενο, σε μητροπολίτη κ.λπ. Ενώ ξεκίνησαν για τον Χριστό, καταλήγουν στον χρυσό… Να έχουν χρυσούς σταυρούς, χρυσές μίτρες, διαμάντια, ποικιλία και όχι τα απαραίτητα. Πώς μας ξεγελάει ο διάβολος, άμα δεν προσέξουμε!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θέλει ο Θεός και τί θέλουν οι άνθρωποι από τον ιερέα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το τί θέλει ο Θεός είναι πολύ μεγάλο· άφησε τό. Τώρα το τί θέλουν οι άνθρωποι. Παλιά οι ιερείς έκαναν άσκηση, είχαν αρετή, ήταν άγιοι, και οι άνθρωποι τους ευλαβούνταν. Σήμερα οι άνθρωποι θέλουν δύο πράγματα από τον ιερέα· να είναι αφιλοχρήματος και να έχη αγάπη. Όταν οι άνθρωποι βρουν αυτά  σε έναν ιερέα, τον θεωρούν άγιο και τρέχουν στην Εκκλησία· και αφού τρέχουν στην Εκκλησία, σώζονται. Μετά συγκαταβαίνει ο Θεός και σώζει και τον ιερέα. Ο ιερεύς πάντως πρέπει να έχη μεγάλη καθαρότητα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τον μοναχό ο διάβολος προσπαθεί να τον αποδυναμώση με τις κακομοιριές , ώστε να τον αχρηστέψη και να μην έχη καμμιά δύναμη πνευματική η προσευχή του. Ο μοναχός, για να έχη την Χάρη του Αγίου Πνεύματος, πρέπει να είναι σωστός μοναχός. Τότε μόνον έχει μία θεϊκή εξουσία και βοηθάει πολύ θετικά με την προσευχή του. Ενώ ένας ιερεύς, και να μην έχη πνευματική κατάσταση, πάλι βοηθάει με την εξουσία που του έχει δοθή με την ιερωσύνη, όταν τελή τα Μυστήρια, διαβάζη τους ανθρώπους κ.λπ. Ακόμη και να σκοτώση άνθρωπο, τα Μυστήρια που τελεί πάλι ενεργούν, μέχρι να καθαιρεθή. Αν όμως έχη και πνευματική κατάσταση, τότε είναι σωστός ιερεύς και βοηθάει περισσότερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν με ρωτούν ιερείς πώς θα βοηθήσουν τους ενορίτες, αλλά και σε όλους που έχουν μία ποιμαντική ευθύνη, ένα πράγμα τονίζω· να κοιτάξουν να κάνουν δουλειά στον εαυτό τους, να κάνουν τα απαραίτητα πνευματικά τους καθήκοντα και κάτι παραπάνω, για να έχουν πάντοτε απόθεμα πνευματικό. Η πνευματική εργασία στον εαυτό μας είναι αθόρυβη εργασία στον πλησίον, γιατί μιλάει το παράδειγμα, και τότε μιμούνται οι άνθρωποι το καλό που βλέπουν και διορθώνονται. Εάν δεν αποκτήσουμε εμείς πνευματικό πλούτο, για να μπορούμε να συντηρούμαστε από τους πνευματικούς τόκους, όταν θα εργαζώμαστε δωρεάν για τους άλλους, θα είμαστε οι πιο δυστυχισμένοι και αξιολύπητοι. Γι’ αυτό να μην το θεωρούμε σπατάλη χρόνου, όταν κάνουμε εργασία στον εαυτό μας, είτε για λίγο χρονικό διάστημα είτε για πολύ είτε για πάντα, σ΄ όλη την ζωή μας, γιατί η μυστική εργασία έχει την ιδιότητα να κηρύττη μυστικά τον λόγο του Θεού μέσα στις ψυχές των ανθρώπων. Ο χαριτωμένος άνθρωπος του Θεού μεταδίδει θεία Χάρη και αλλοιώνει τους σαρκικούς ανθρώπους. Τους ελευθερώνει από την σκλαβιά των παθών και τους πλησιάζει μ΄ αυτόν τον τρόπο στον Θεό και σώζονται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο ιερεύς έχει μεγάλη ευθύνη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο ιερεύς δεν μπορεί ποτέ να κλείση την πόρτα του· έχει μεγάλη ευθύνη. Ο ένας είναι απελπισμένος, ο άλλος άρρωστος και έχει ανάγκη, ο άλλος ψυχορραγεί· πρέπει άλλους να τους δεχθή, άλλους να τους επισκεφθή. Δεν μπορεί να αρνηθή ο ιερεύς. Κινδυνεύουν ψυχές· πρέπει να τις βοηθήση. Αν δεν τις βοηθήση και τις πάρη ο Θεός ατακτοποίητες, ποιός θα έχη την ευθύνη; Δεν θα την έχη ο ιερεύς; Εγώ σαν μοναχός μπορώ να κλείσω και την πόρτα μου, να φύγω και στην έρημο, να εξαφανισθώ, και να βοηθώ με την προσευχή αθόρυβα. Γιατί η δουλειά μου δεν είναι να λύνω τα προβλήματα του κόσμου, αλλά να λέω καμμιά ευχή για τον κόσμο. Γι’ αυτό δεν έγινα ούτε παπάς ούτε Πνευματικός, για να βοηθάω με άλλον τρόπο. Αν ήμουν στον κόσμο ιερεύς, δεν θα μπορούσα να κλείσω ποτέ την πόρτα μου. Θα έπρεπε να ανταποκρίνωμαι πάντοτε, χωρίς διακρίσεις, σε ό,τι μου ζητούσαν όλοι. Πρώτα θα φρόντιζα για όλους τους ανθρώπους της ενορίας μου και έπειτα, ό,τι περίσσευε, θα έδινα στους άλλους που θα μου ζητούσαν να τους βοηθήσω. Θα ενδιαφερόμουν όχι μόνο για τους πιστούς, αλλά και για τους απίστους και για τους αθέους και για τους εχθρούς της Εκκλησίας. Ή, αν ήμουν Πνευματικός και μου έλεγε ένας κάτι για έναν άλλον, θα φώναζα και εκείνον, για να βγάλω άκρη. Θα έπαιρνα τηλέφωνο, για να δώ τί κάνει ο άλλος που είχε έναν πειρασμό, που αντιμετώπιζε κάποιο πρόβλημα κ.λπ. Πώς θα μπορούσα να ησυχάσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο ιερεύς πρέπει να τραβάη μπροστά, για να ακολουθούν οι πιστοί. Βλέπεις, στο κοπάδι πάει μπροστά το γκισέμι[154]και τα άλλα πρόβατα ακολουθούν. Γυρίζει τα κέρατα προς τα δεξιά, γυρίζει και όλο το κοπάδι δεξιά. Όλα τα πρόβατα ακολουθούν το κριάρι, τον αρχηγό δηλαδή. Γι’ αυτό δεν απομονώνονται τα πρόβατα· πάνε το ένα πίσω από το άλλο. Έχει το κριάρι την κατεύθυνση προς τα που θα πάη και τα πρόβατα ακολουθούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δικαιολογείται ένας που έχει μία ποιμαντική ευθύνη να αγαπάη μία ψυχή καλή πιο πολύ από μία άλλη που έχει παράλογες απαιτήσεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είσαι λ.χ. βοσκός και έχεις στο κοπάδι σου πολλά αρνιά. Άλλα χαρούμενα βόσκουν και βαλάζουν και άλλα είναι καχεκτικά ή με καμμιά βδέλλα επάνω τους και απομακρύνονται στις άκρες. Ποιά θα φροντίσης περισσότερο; Δεν θα φροντίσης αυτά  που είναι καχεκτικά; Ή, αν χυμήξη σε μερικά ένα τσακάλι και βάλουν τις φωνές, που θα τρέξης; Σ΄ αυτά  που βελάζουν «μπέ-μπέ»καί βόσκουν ήσυχα ή σ΄ αυτά  που φωνάζουν σπαρακτικά από το τσακάλι; Ο τσομπάνος το αρρωστιάρικο ή πληγωμένο αρνί το πονάει περισσότερο και το περιποιείται ιδιαίτερα, μέχρι να πάρη επάνω του και αυτό. Και αυτούς που κάνουν θαύματα και αυτούς που έχουν τραυματισθή από τον εχθρό διάβολο να τους έχουμε τοποθετημένους στον ίδιο τόπο της καρδιάς μας· να μην περιφρονούμε εσωτερικά τους δεύτερους. Περισσότερο έχω αγαπήσει, έχω πονέσει και τους έχω στον νού μου συνέχεια αυτούς που είχαν άσχημη ζωή και αγωνίζονται να κόψουν τα πάθη τους, παρά αυτούς που δεν βασανίζονται από πάθη. Όταν υπάρχη εσωτερική αγάπη, τότε πληροφορείται και ο άλλος, γιατί αυτή η αγάπη γλυκαίνει και όλον τον εξωτερικό άνθρωπο και τον ομορφαίνει με την θεία Χάρη, η οποία δεν κρύβεται, γιατί ακτινοβολεί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι ποιμένες, είτε ιερείς είναι είτε αρχιερείς, καλά είναι να θυμούνται και τον Μωυσή, τί τράβηξε με τα δυο εκατομμύρια γκρινιάρικο λαό. Πόση προσευχή με αγάπη έκανε για τον λαό του και πόσο ταλαιπωρήθηκε χρόνια ολόκληρα στην έρημο και αυτός, μέχρι να τον οδηγήση στην Γη της Επαγγελίας. Εάν αυτά  θα φέρνουν στην μνήμη τους, θα παίρνουν άφθονο κουράγιο και δεν θα γογγύσουν ποτέ για τις ελάχιστες ταλαιπωρίες τους εν συγκρίσει με τις ταλαιπωρίες που πέρασε ο Μωυσής.
- type: h2
  initial:
    ru: ''
  text:
    ru: Εκκοσμίκευση του κλήρου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι απαραίτητο ο Εκκλησιαστικός[155]να διακονή με μανδύα και το καλοκαίρι με την ζέστη; Εγώ δυσκολεύομαι με την ζέστη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτή η καλογερική σήμερα…, τί να πώ! Ο Άγιος Αθανάσιος φορούσε ένα χονδρό ρούχο και έναν σταυρό πολύ βαρύ για άσκηση, και σήμερα που φθάσαμε! Εκεί στην Αυστραλία που είχα πάει, ήταν με σορτσάκι ένας νεωκόρος. «Για την θάλασσα, του λέω, για ΄κεί είναι αυτό». «Κινούμαι έτσι πιο άνετα», μου λέει. Έτσι ξεκινούν σιγά-σιγά  και μετά φθάνουν: «Να πετάξουμε τα ράσα, για να μη μας καίη ο ήλιος!».Εμποδίζει ο μανδύας; Πέταξε τόν. Το μανδήλι εμποδίζει, γιατί ιδρώνεις; Πέταξε τό. Εκεί πάμε. Να ρυθμίση καθένας τον εαυτό του, βρέ παιδάκι μου! Να βάλη λιγώτερα ρούχα από μέσα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί κανείς να βγάζη το ράσο και να φοράη μόνον τον μανδύα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και οι ιερείς να βγάλουν το αντερί και να είναι με το παντελόνι; Έμ, τί να πώ; Ο μανδύας είναι ένδυμα του μοναχού. Δίνεται στον σταυροφόρο και στον μεγαλόσχημο. Στην διάρκεια της κουράς τον φοράει ο ανάδοχος καί, όταν βάλη το ράσο στον νεοκούρο, τον βγάζει και του τον φοράει. Μου έκανε εντύπωση στην Αλεξάνδρεια που έχει και πολλή ζέστη πώς μερικές γυναίκες φορούσαν όλο μαύρα, επειδή το έχουν από την παράδοσή τους. Και εμείς δεν αντέχουμε το ράσο που το έχουμε από τους Πατέρες μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, λένε: «Μήπως το ράσο κάνει τον παπά;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πρόσεξε λ.χ. δυο ελιές που η μία έχει φύλλα και η άλλη δεν έχει. Ποιά από τις δυο σου αρέσει; Αυτή που έχει φύλλα ή αυτή που δεν έχει; Όταν ήμουν στο Καλύβι του Τιμίου Σταυρού, μία φορά ξεφλούδισα τον κορμό της ελιάς που ήταν στην αυλή και έγραψα: «Τα Δένδρα πέταξαν την στολή τους, θα δούμε την προκοπή τους!...»καί δίπλα: «Παπάς αράσοτος, άρα άσωτος». Εκείνον τον καιρό συζητούσαν πολύ το θέμα να μη φορούν ράσα οι ιερείς και έρχονταν μερικοί εκεί, για να πάρουν από μένα… ευλογία!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάποιος, Γέροντα, έφερε στο Μοναστήρι ορθόδοξο ιερέα με παντελόνι. Να παίρναμε την ευχή του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί ευχή να πάρης; Να λέγατε σ΄ αυτόν που τον έφερε, οποιοσδήποτε και να ήταν: «Συγχωρέστε μας, αλλά είναι αρχή του Μοναστηριού να δίνουμε ράσο. Ιερεύς να έρθη με παντελόνι σε ορθόδοξο γυναικείο Μοναστήρι; Δεν ταιριάζει». Όταν δεν ντρέπεται αυτός που τον έφερε ή ο ίδιος που ήρθε χωρίς ράσο, θα ντραπής εσύ να του δώσης ράσο; Κάποτε συνάντησα στο αεροδρόμιο έναν νέο αρχιμανδρίτη με λαϊκά. Πήγαινε στο εξωτερικό και μου συστήθηκε: «Είμαι ο πατήρ τάδε». «Που είναι τα ράσα σου;», του είπα και φυσικά δεν του έβαλα μετάνοια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί υποστηρίζουν ότι ο κλήρος, αν εκσυγχρονισθή, θα βοηθήση πιο πολύ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν είχε πάει ο Πατριάρχης Δημήτριος στην Αμερική στην Σχολή του Τιμίου Σταυρού, πήγαν μερικοί ευλαβείς φοιτητές Αμερικάνοι και του είπαν: «Παναγιώτατε, στην εποχή μας πρέπει ο κλήρος να εκσυγχρονισθή». Και ο Πατριάρχης απάντησε: «Ο Άγιος Κοσμάς λέει: «όταν οι κληρικοί γίνουν λαϊκοί, οι λαϊκοί θα γίνουν δαίμονες!».«Καλά δεν τους είπε; Του ετοίμασαν για να μείνη ένα πολυτελέστατο δωμάτιο με κρεββάτι επίσημο κ.λπ. Μόλις το είδε, είπε: «Που θα μείνω; Σ΄ αυτό το δωμάτιο; Φέρτε μου καλύτερα ένα ράνζο. Ο κληρικός, όταν κοσμικοποιηθή, γίνεται υποψήφιος διάβολος».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μήπως να κάνουμε πιο απλά άμφια; Μήπως βλάπτουμε τους ιερείς με τα πολύ κεντημένα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Θα σάς τιμά, αν πήτε: «Εμείς κάνουμε αυτά  τα απλά. Μπορούμε να κάνουμε και με πολύ κέντημα, αλλά το αποφεύγουμε, γιατί μας πειράζει ο λογισμός που σκανδαλίζεται ο κόσμος. Το εκμεταλλεύονται μετά και οι άλλοι που δεν πιστεύουν. Ακούμε να λένε: «Εμείς δεν έχουμε ψωμί να φάμε και οι παπάδες έχουν ένα σωρό στολές»». Αν κάνετε απλά κεντήματα, θα έρχωνται και σοβαροί ιερείς να τα πάρουν. Αν έρχωνται ιερείς με κοσμικό φρόνημα, και αυτοί θα γίνωνται ρεζίλι, και εσείς θα γίνεσθε ρεζίλι με τα πολύ στολισμένα. Στα καλύμματα Αγίας Τραπέζης και Τιμίων Δώρων μπορείτε να βάλετε περισσότερο κέντημα. Και να αποφεύγετε να βάζετε σταυρούς χαμηλά στα στιχάρια και στα φαιλόνια. Βάλτε κάτι άλλο συμβολικό. Κάθονται οι ιερείς επάνω στους Αγίους, στους σταυρούς… Αυτό είναι ανευλάβεια.'
- type: h2
  initial:
    ru: ''
  text:
    ru: «Τις ελέγχει με περί σκανδάλου;»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η θεία Χάρις χάνεται από έναν κληρικό, όταν πέση σε κάποιο θανάσιμο αμάρτημα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, πώς να χαθή; Η θεία Χάρις μπορεί να απομακρυνθή· όχι όμως να χαθή. Έναν ιερέα, άμα τον κάνουν αργό, έχει την ιερωσύνη, αλλά τα Μυστήρια δεν ενεργούν. Δεν έχει δύναμη πια ο ιερεύς. Το κυριώτερο είναι η Χάρις. Αν αποκατασταθή, τότε είναι τα Μυστήρια έγκυρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θέλει πολλή διάκριση στο θέμα των ιερέων που έχουν κωλύματα. Χρειάζεται πολλή προσοχή να μη δημιουργηθή με αδιάκριτες αυστηρότητες σκάνδαλο στον κόσμο και μπή σε λογισμούς και η οικογένεια του ιερέως. Να παύη τις Λειτουργίες με τρόπο, για να μη γίνεται κακό στους πιστούς αντί για καλό. Γιατί τα κωλύματα τα ξέρει ο Θεός και ο ιερεύς· εάν όμως παύση αμέσως, τότε και οι πιστοί και η οικογένειά του θα μπούν σε λογισμούς, και έτσι το κακό θα είναι μεγαλύτερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω πώς καμμιά φορά επιτρέπει ο Θεός και ευλαβείς κληρικοί να πάθουν κάτι σωματικό, π.χ. να τρέχη η μύτη τους αίμα ή να πονά το στομάχι τους κ.λπ., και να εμποδίζωνται από την Λειτουργία, και έτσι να αναπαύωνται οι ιερείς που έχουν κωλύματα και πρέπει να παύσουν να λειτουργούν. Έρχεται καμμιά φορά κανένας ιερεύς στο Καλύβι που έχει κάποιο κώλυμα, ο καημένος, και βλέπω ότι πρέπει να σταματήση να ιερουργή. Καμμιά φορά όμως συμβαίνει ο επίσκοπός του να έχη διαφορετική γνώμη. Μετά τί να πής; Μόνον προσευχή μπορείς να κάνης και επεμβαίνει ο Θεός. Συγκεκριμένα, είχα πει σε κάποιον και τον προετοίμασα να αφήση την ιερουργία. Όταν το είπε στον Πνευματικό του και στον επίσκοπό του, δεν συμφώνησαν. Έτσι συνέχισε να ιερουργή, ενώ είχε το κώλυμα. Μετά από λίγο διάστημα τον χτύπησε αυτοκίνητο και τον άφησε στον τόπο!«Φοβερόν το εμπεσείν εις χείρας Θεού ζώντος»[156]!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Ορθόδοξη Εκκλησία μας δεν έχει καμμία έλλειψη. Η μόνη έλλειψη που παρουσιάζεται, είναι από μας τους ίδιους, όταν δεν αντιπροσωπεύουμε σωστά την Εκκλησία, από τον πιο μεγάλο στην ιεραρχία μέχρι τον απλό πιστό. Μπορεί να είναι λίγοι οι εκλεκτοί, όμως αυτό δεν είναι ανησυχητικό. Η Εκκλησία είναι Εκκλησιά του Χριστού και Αυτός την κυβερνάει. Δεν είναι Ναός που κτίζεται με πέτρες, άμμο και ασβέστη από ευσεβείς και καταστρέφεται με φωτιά βαρβάρων, αλλά είναι ο ίδιος ο Χριστός· «καί ο πεσών επί τον λίθον τούτον συνθλασθήσεται· έφ΄ όν δ΄ αν πέση, λικμήσει αυτόν»[157].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Χριστός ανέχεται σήμερα μία κατάσταση. Ανέχεται και ενεργεί η θεία Χάρις για χάρη του λαού. Μία μπόρα είναι· θα ξεκαθαρίσουν τα πράγματα· δεν θα σταθούν. Είδες που αναφέρει στο Ευαγγέλιο: «Λυχνάρι μισοσβησμένο δεν θα το φυσήξω. Καλάμι ραγισμένο δεν θα το αγγίξω»[158]; Αυτό το είπε ο Χριστός, για να είμαστε αναπολόγητοι την ημέρα της Κρίσεως. Βλέπεις, όταν το λυχνάρι δεν έχη άλλο λάδι στην κούπα και μείνη μόνο λίγο λάδι στο φιτίλι, θα σβήση μετά από λίγο, έστω και αν το φιτίλι πάη μία επάνω μία κάτω. Είναι σαν τον ετοιμοθάνατο που έχει τις τελευταίες αναλαμπές. Ο Χριστός όμως δεν θέλει να το φυσήξη και να το σβήση, γιατί μετά θα πή: «Εγώ θα έκαιγα, αλλά με φύσηξες και έσβησα!».Τί σε φύσηξα; Η κούπα δεν είχε καθόλου λάδι! Ούτε το ραγισμένο καλάμι θέλει να το αγγίξη, γιατί μετά, αν σπάση, θα πή: «Με άγγιξες και έσπασα!».Μά αφού ήσουν ραγισμένο και θα έσπαζες, τί μου λές ότι σε άγγιξα και έσπασες;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εμείς οι μοναχοί, αλλά και οι κληρικοί, σκορπούμε αθεΐα, όταν δεν ζούμε σύμφωνα με το Ευαγγέλιο. Ο κόσμος έχει ανάγκη από τις αρετές μας όχι από τα χάλια μας. Ιδίως το παράδειγμα των μοναχών στους κοσμικούς είναι πολύ μεγάλο πράγμα! Οι κοσμικοί αφορμή ζητούν, για να δικαιολογήσουν τις αμαρτίες τους. Γι’ αυτό θέλει πολλή προσοχή. Βλέπεις, εμείς δεν μπορούμε να πούμε αυτό που λέει ο Χριστός, «τίς ελέγχει με περί αμαρτίας;»[159]αλλά «τίς ελέγχει με περί σκανδάλου», αυτό πρέπει να μπορούμε να το πούμε. Ο Χριστός το είπε εκείνο, γιατί ήταν τέλειος Θεός και τέλειος άνθρωπος. Εμείς είμαστε άνθρωποι. Έχουμε ατέλειες, έχουμε πτώσεις, τέλος πάντων, αλλά δεν κάνει να γινώμαστε αιτία να σκανδαλίζεται ο άλλος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου έλεγε ένας στρατηγός: «Αν δεν είχα την πίστη από την μάνα μου, θα την είχα χάσει, όταν πήγα στην Κύπρο τότε με τα γεγονότα. Άνθρωπος της Εκκλησίας να φωνάζη από το τηλέφωνο: «Σφάξτε τους Τούρκους», στα καλά καθούμενα, ενώ η διαταγή έλεγε: «Μήν τους πειράζετε»»! Και οι Φαρασιώτες, όταν ήρθαν στην Ελλάδα από την Μικρά Ασία, παρασύρθηκαν από αιρέσεις που είχαν παρουσιασθή εκείνα τα χρόνια εδώ, γιατί έβλεπαν δεσποτάδες, παπάδες χωρίς ευλάβεια. Έβλεπαν στην Εκκλησία άλλου είδους κόσμο, χωρίς πνευματική ζωή, όποτε σκανδαλίσθηκαν. Είχαν άλλη εικόνα από εκεί. Παρουσιάσθηκαν και οι Ευαγγελικοί, οι οποίοι έλεγαν, «εμείς εφαρμόζουμε το Ευαγγέλιο», και οι καημένοι παρασύρθηκαν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν όμως φταίη ένας δεσπότης, ένας παπάς, ένας καλόγερος, δεν φταίει ο Χριστός. Αλλά οι άνθρωποι δεν πάνε ως εκεί. «Αντιπρόσωπος του Χριστού δεν είναι;», λένε. Ναί, αλλά αναπαύεται ο Χριστός με αυτόν τον αντιπρόσωπο; Ή δεν σκέφτονται τί τον περιμένει αυτόν τον αντιπρόσωπο στην άλλη ζωή. Γι’ αυτό μερικοί που σκανδαλίζονται από μερικά γεγονότα καταλήγουν να μην πιστεύουν, γιατί δεν καταλαβαίνουν οι καημένοι ότι όπως, αν φταίη ένας χωροφύλακας, δεν φταίει το έθνος, έτσι κι αν φταίη ένας παπάς, δεν φταίει η Εκκλησία. Όσοι όμως σκανδαλίζονται, αλλά έχουν καλή διάθεση, καταλαβαίνουν, όταν τους εξηγήσης. Αυτοί έχουν και ελαφρυντικά, γιατί μπορεί να μην είχαν βοηθηθή και να έχουν άγνοια από μερικά πράγματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί κανένας δεν παίρνει μία θέση με τόσα σκάνδαλα που γίνονται στην Εκκλησία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στα εκκλησιαστικά θέματα όλες οι καταστάσεις δεν είναι να πάρης θέση. Μπορεί να ανέχεται κανείς μία κατάσταση κάνοντας υπομονή, έως ότου ο Θεός δείξη τί πρέπει να κάνη. Άλλο είναι να ανέχεται κανείς μία κατάσταση και άλλο να την αποδέχεται, ενώ δεν πρέπει. Ύστερα, σε τέτοιες περιπτώσεις, ό,τι έχει να πη κανείς να το πη με σεβασμό, ανδρίκια· όχι να βρίζη, να δημοσιεύη. Να το πη ιδιαιτέρως στο ίδιο το πρόσωπο στο οποίο αφορά το θέμα με πόνο, από αγάπη, για να προσέξη μερικά πράγματα. Δεν είναι ειλικρινής και ευθύς εκείνος που λέει κατά πρόσωπο την αλήθεια ούτε εκείνος που την δημοσιεύει, αλλά εκείνος που έχει αγάπη και αληθινή ζωή και μιλάει με διάκριση, όταν πρέπη, και λέει εκείνα που πρέπει στην πρέπουσα ώρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εκείνοι που ελέγχουν με αδιακρισία έχουν πνευματική σκότιση και κακία και βλέπουν τους ανθρώπους δυστυχώς σαν κούτσουρα. Και ενώ τους πελεκάνε αλύπητα και υποφέρουν οι άνθρωποι, αυτοί χαίρονται για το τετραγώνισμα που τους κάνουν, για «τόν κυβισμό»! Μόνο σε άνθρωπο που έχει δαιμόνιο αρχικό δικαιολογείται να θεατρίζη τους ανθρώπους μπροστά στο κόσμο, να τους λέη το παρελθόν τους (σέ όσους βέβαια έχει δικαιώματα το δαιμόνιο), για να κλονίζη αδύνατες ψυχές. Το ακάθαρτο πνεύμα, φυσικά, δεν βγάζει στην φόρα τις αρετές των ανθρώπων αλλά τις αδυναμίες τους, επειδή δεν έχουν κακία, το κακό το διορθώνουν με καλωσύνη. Αν δούν καμμιά φορά κάπου λίγη ακαθαρσία που δεν καθαρίζεται, την σκεπάζουν με καμμιά πλάκα, για να μην αηδιάση και ο άλλος που θα την δή. Ενώ εκείνοι που ξεσκαλίζουν σκουπίδια μοιάζουν με τις κότες…
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τώρα[160]ο διάβολος κάνει μουντζούρες πολλές και μπλέκει πολύ τα πράγματα, αλλά τελικά θα σπάση τα μούτρα του. Μετά από χρόνια θα λάμψουν οι δίκαιοι. Και λίγη αρετή να έχουν, εν τούτοις θα φαίνωνται, γιατί θα επικρατή πολύ σκοτάδι, και ο κόσμος θα στραφή προς αυτούς. Αυτοί που σήμερα κάνουν τα σκάνδαλα, αν ζουν τότε, θα ντρέπωνται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αντιμετώπιση εκκλησιαστικών θεμάτων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά είναι η σωστή αντιμετώπιση, όταν προκύπτουν δύσκολα εκκλησιαστικά θέματα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να αποφεύγωνται τα άκρα· με τα άκρα δεν λύνονται τα θέματα. Βλέπαμε παλιά, ο μπακάλης έβαζε λίγο-λίγο με την σέσουλα στην ζυγαριά, και έτσι έβρισκε την ακρίβεια και ισορροπούσε και η ζυγαριά. Δηλαδή δεν έβαζε απότομα πολύ ούτε αφαιρούσε απότομα πολύ. Τα δύο άκρα πάντα ταλαιπωρούν την Μητέρα Εκκλησία και οι ίδιοι που τα κρατούν ταλαιπωρούνται, γιατί τα δύο άκρα συνήθως καρφώνουν… Είναι σαν να κρατάη το ένα άκρο δαιμονισμένος, όταν έχη αναίδεια πνευματική (περιφρόνηση για όλα), και το άλλο άκρο σαν να το κρατάη τρελλός, όταν έχη μωρό ζήλο με στονοκεφαλιά. Ένας πνευματικά αναιδής δηλαδή με έναν ζηλωτή, που έχει μωρό ζήλο, ποτέ δεν συμφωνούν, αλλά τρώγονται και χτυπιούνται, γιατί και οι δύο στερούνται την θεία Χάρη. Τότε –Θεός φυλάξοι! – μπορεί να χτυπιούνται συνέχεια τα δύο άκρα και «άκρη να μην τους βρίσκη»κανείς. Εκείνοι που θα μπορέσουν να λυγίσουν τα δύο αυτά  άκρα, για να ενωθούν –νά ομονοήσουν-, θα στεφανωθούν από τον Χριστό με δύο αμάραντα στεφάνια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να προσέχουμε να μη δημιουργούμε θέματα στην Εκκλησία ούτε να μεγαλοποιούμε τις μικρές ανθρώπινες αταξίες που γίνονται, για να μη δημιουργούμε μεγαλύτερο κακό και χαίρεται ο πονηρός. Όποιος για μικρή αταξία ταράσσεται πολύ και ορμάει απότομα με οργή, δήθεν να την διορθώση, μοιάζει με ελαφρόμυαλο νεωκόρο που βλέπει να στάζη ένα κερί και ορμάει απότομα, με φόρα, για να το διορθώση δήθεν, αλλά παίρνει σβάρνα ανθρώπους και μανουάλια, και δημιουργεί μεγαλύτερη αταξία την ώρα της λατρείας. Δυστυχώς στην εποχή μας έχουμε πολλούς που ταράσσουν την Μητέρα Εκκλησία. Όσοι από αυτούς είναι μορφωμένοι επίασαν το δόγμα με το μυαλό και όχι με το πνεύμα των Αγίων Πατέρων. Όσοι πάλι είναι αγράμματοι επίασαν και αυτοί το δόγμα με τα δόντια, Γι’ αυτό και τρίζουν τα δόντια, όταν συζητούν εκκλησιαστικά θέματα, και έτσι δημιουργείται μεγαλύτερη ζημία στην Εκκλησία από αυτούς παρά από τους πολέμιους της Ορθοδοξίας μας. Καλά είναι το ποτάμι να μην είναι πολύ ορμητικό, γιατί παίρνει σβάρνα κούτσουρα, πέτρες, ανθρώπους, αλλά ούτε βέβαια και πολύ ρηχό, γιατί θα κάθωνται κουνούπια…
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι μερικοί πάλι που ασχολούνται με την κριτική ο ένας του άλλου και όχι με το γενικώτερο καλό. Παρακολουθεί ο ένας τον άλλο περισσότερο από τον εαυτό του. Κοιτάζει τί θα πη ή τί θα γράψη ο άλλος, για να τον χτυπήση κατόπιν αλύπητα, ενώ ο ίδιος, εάν έλεγε ή έγραφε το ίδιο πράγμα, θα το υποστήριζε και με πολλές μαρτυρίες από την Αγία Γραφή και τους Πατέρες. Το κακό που κάνει είναι μεγάλο, γιατί άφ΄ ενός μεν αδικεί τον πλησίον του, άφ΄ ετέρου δε τον γκρεμίζει μπροστά στα μάτια των πιστών. Πολλές φορές μάλιστα σπέρνει και την απιστία στις ψυχές των αδυνάτων, γιατί τους σκανδαλίζει. Όσοι δικαιολογούν την κακία τους με τον δήθεν έλεγχο των άλλων και όχι του εαυτού τους ή με το να δημοσιεύουν στον κόσμο εκκλησιαστικές καταστάσεις –ακόμη και πράγματα που δεν λέγονται – προφασιζόμενοι το «είπε τη Εκκλησία»[161], ας κάνουν πρώτα αρχή από την μικρή τους εκκλησία, την οικογένειά τους ή την Αδελφότητά τους καί, εάν τους φανή καλό, τότε ας ρεζιλέψουν και την Μητέρα Εκκλησία. Τα καλά παιδιά, νομίζω, ποτέ δεν κατηγορούν την μάνα τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλοι χρειάζονται στην Εκκλησία. Όλοι προσφέρουν τις υπηρεσίες τους σ΄ αυτήν· και οι ήπιοι χαρακτήρες και οι αυστηροί. Όπως στο σώμα του ανθρώπου είναι απαραίτητα και τα γλυκά και τα ξινά, ακόμη και τα πικρά ραδίκια, γιατί το καθένα έχει τις δικές του ουσίες και βιταμίνες, έτσι και στο Σώμα της Εκκλησίας όλοι είναι απαραίτητοι. Ο ένας συμπληρώνει τον χαρακτήρα του άλλου και όλοι είμαστε υποχρεωμένοι να ανεχώμαστε όχι μόνον τον πνευματικό χαρακτήρα του άλλου αλλά ακόμη και τις αδυναμίες που έχει σαν άνθρωπος. Δυστυχώς μερικοί έχουν παράλογες απαιτήσεις από τους άλλους. Θέλουν να έχουν όλοι ίδιο πνευματικό χαρακτήρα με τον δικό τους, και όταν κάποιος δεν συμφωνή με τον χαρακτήρα τους, δηλαδή ή είναι λίγο επιεικής ή λίγο οξύς, αμέσως βγάζουν το συμπέρασμα ότι δεν είναι πνευματικός άνθρωπος.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αξιώματα και ανθρώπινη δόξα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Απορώ, πώς μερικοί δίνουν τόση σημασία στην ανθρώπινη δόξα και όχι στην δόξα του Θεού που μας περιμένει, όταν «τών ανθρώπων την δόξαν φύγωμεν». Σε τί θα μας ωφελήση, αν αποκτήσουμε και το πιο μεγάλο αξίωμα που υπάρχει και μας εγκωμιάζη όλος ο κόσμος; Θα μας οδηγήσουν στον Παράδεισο τα εγκώμια του κόσμου ή θα μας ωθήσουν στην κόλαση; Τί είπε ο Χριστός; «Δόξαν παρά ανθρώπων ου λαμβάνω»[162]. Σε τί θα με ωφελούσε αν μπορούσα να γίνω από μοναχός ιερομόναχος, δεσπότης, πατριάρχης; Θα με βοηθούσαν τα αξιώματα να σωθώ ή θα ήταν μεγάλο βάρος σε έναν αδύνατο Παΐσιο και θα με γκρέμιζαν στην κόλαση; Εάν δεν υπήρχε άλλη ζωή, μπορούσε να δικαιολογηθή μία τέτοια ανοησία. Ένας όμως που επιδιώκει την σωτηριά της ψυχής του όλα τα βλέπει «σκύβαλα»[163]και δεν επιδιώκει αξιώματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Μωυσής, πάρ΄ όλο που ήταν απεσταλμένος από τον Θεό να ελευθερώση τον λαό του Ισραήλ, δεν αξιώθηκε να πάη στην Γη της Επαγγελίας, γιατί έφθασε σε σημείο να αγανακτήση κατά του Θεού εξ αιτίας του λαού. Ζούσε συνέχεια μέσα στην γκρίνια του λαού και μία φορά αγανάκτησε. «Μου ζητούν νερό, είπε. Που να τους βρώ νερό;»[164]. Μά πριν από λίγο χτύπησες την πέτρα και έβγαλες νερό και τους έδωσες! Δύσκολο ήταν; Αλλά είχε μπλέξει με τα θέματα, με τις υποθέσεις του λαού και ξέχασε πόσο νερό είχε βγάλει νωρίτερα, και από τις πολλές σκοτούρες που είχε, δεν το κατάλαβε, για να ζητήση συγχώρεση από τον Θεό. Αν ζητούσε συγχώρεση, θα τον συγχωρούσε ο Θεός. Το να μην πάη στην Γη της Επαγγελίας ήταν ένας μικρός κανόνας από τον Θεό, ένα επιτίμιο για την αγανάκτησή του. Φυσικά ο Θεός τον πήρε στον Παράδεισο και τον τίμησε με το να τον στείλη μαζί με τον Προφήτη Ηλία στο Όρος Θαβώρ, στην Μεταμόρφωση του Κυρίου. Όλα αυτά  βοηθούν να καταλάβουμε πόσο μεγάλο εμπόδιο γίνεται το αξίωμα με τις ευθύνες για την πορεία ενός Χριστιανού προς τον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικοί, ενώ εσωτερικά και εξωτερικά θα έπρεπε να είναι όλο χαρά, γιατί οικονόμησε ο Θεός να είναι απαλλαγμένοι από κάθε ευθύνη, αντιθέτως επιδιώκουν ευθύνες και αξιώματα, και όταν δεν τους δίνωνται, τσιγαρίζονται και φθείρουν και την ψυχή τους και το σώμα τους, τον ναό του Θεού[165]κατά τον Απόστολο Παύλο. Ενώ ο Χριστός τους ετοιμάζει την ουράνια δόξα, αυτοί θέλουν να περάσουν στον Παράδεισο δια μέσο της δόξης των ανθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ίσως όμως μου πούν μερικοί: «Γιατί άλλοι δοξάζονται και από ανθρώπους, δοξάζονται μετά και από τον Θεό;»Στην ουσία κανείς δεν θα δοξασθή από τον Θεό, όταν θέλη την ανθρώπινη δόξα. Να μην επιδιώκη ποτέ κανείς μόνος του ευθύνες. Όταν τον απαλλάσσουν από ευθύνες, θα πρέπη να χαίρεται, γιατί κανονικά θα έπρεπε να στενοχωριέται για τις ευθύνες που είχε. Αν δεν χαίρεται, σημαίνει ότι υπάρχει μέσα του ύπουλα η υπεηφάνεα. Να μην επιδιώκουμε ποτέ αξιώματα, για να δοξασθούμε από αυτά, γιατί αυτό φανερώνει αρρώστια προχωρημένη. Δείχνει ότι βαδίζουμε αρρωστημένα άλλο δρόμο από τον δρόμο της ταπεινοφροσύνης που βάδισαν οι Άγιοι Πατέρες και έφθασαν στον Παράδεισο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχουμε πλήθος Αγίων Πατέρων που απέφευγαν τις ευθύνες· ηγουμενίες, ιερωσύνη και αρχιερωσύνη. Άλλοι έκοβαν τα χέρια, άλλοι τις μύτες, άλλοι τα αυτιά και άλλοι τις γλώσσες, για να μην είναι αρτιμελείς και τους χειροτονήσουν. Άλλους τους ξεσκέπαζαν τις καλύβες και τους χειροτονούσαν από πάνω, άλλους τους χειροτονούσαν από μακριά, όπως τον Άγιο Αμφιλόχιο. Ενώ είχαν μόρφωση και αγιότητα, επειδή όμως είχαν νιώσει την μεγάλη αξία της ψυχής, καθώς και το μεγάλο βάρος των ευθυνών, που γίνεται μεγάλο εμπόδιο για να σωθή ο άνθρωπος, Γι’ αυτό τις απέφευγαν. Αυτοί βρήκαν τον κανονικό δρόμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και στο Άγιον Όρος μερικοί θεωρούν την ιερωσύνη εμπόδιο στην πνευματική ζωή, γιατί εκτός των άλλων υποχρεώσεων είναι υποχρεωμένοι να πάνε, όταν έρθη ένας δεσπότης, ή να πάνε στα πανηγύρια –πνευματικά βέβαια πανηγύρια, αλλά και αυτά  δεν αναπαύουν. Όταν ήμουν στο Κοινόβιο, γνώρισα έναν διάκο που γέρασε και πέθανε διάκος. Όταν ήταν ακόμη νέος μοναχός, το Μοναστήρι είχε ανάγκη από διάκο και τον χειροτόνησαν. Αργότερα ήρθαν νεώτεροι. Οι νεώτεροι έγιναν διάκοι και ιερείς, και εκείνος έδινε συνέχεια την σειρά του στους άλλους και παρέμενε διάκος. Όταν του έλεγαν να γίνη ιερεύς, έλεγε: «Τώρα δεν έχει ανάγκη το Μοναστήρι. Δόξα τω Θεώ, υπάρχουν οι νεώτεροι αδελφοί». Τον έβαλαν στο γραφείο. Όταν ήρθαν μορφωμένοι στο Μοναστήρι, παρακάλεσε και έγυγε και από το γραφείο. Όταν το Μοναστήρι περνούσε μία δυσκολία, παρακάλεσε αυτός το ευλαβής διάκος έναν ιερέα ενάρετο να αναλάβη την ηγουμενία. Εκείνος του είπε: «Πώς εσύ αποφεύγεις τις ευθύνες και τις φορτώνεις σ΄ εμένα; Γίνε εσύ προϊστάμενος, για να γίνω και εγώ ηγούμενος». Έτσι έγινε ο ένας ηγούμενος και ο άλλος προϊστάμενος. Όταν τακτοποιήθηκαν τα πράγματα και πήγαινε καλά το Μοναστήρι, παραιτήθηκε πάλι από προϊστάμενος. Πολύ με βοήθησε αυτός ο διάκος· είχε πολλή Χάρη Θεού. Αυτόν καλούσαν για τα δύσκολα θέματα στην Ιερά Κοινότητα να πη την φωτισμένη του γνώμη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί φταίει, Γέροντα, όταν πνευματικοί άνθρωποι, ενώ δεν αγαπούν τα χρήματα, επιδιώκουν όμως την δόξα; Ισχύει αυτό που έλεγαν οι Αρχαίοι Έλληνες: «Πολλοί εμίσησαν τον πλούτον, την δόξαν ουδείς»[166];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το κεφάλι το άδειο φταίει! Αυτή είναι κενή δόξα. Το «πολλοί εμίσησαν τον πλούτον…»είναι κοσμική νοοτροπία· δεν χωράει στην πνευματική ζωή. Αυτά  τα έλεγαν οι Αρχαίοι Έλληνες που δεν γνώριζαν τον αληθινό Θεό. Στην πνευματική ζωή η δόξα πρέπει να εξαφανισθή. Μεγαλύτερη ατιμία από αυτή που υπέφερε ο Χριστός υπέφερε κανείς; Οι Πατέρες την ατιμία ζητούσαν και τους τιμούσε ο Θεός. Αυτοί ακόμη στο κοσμικό στάδιο βρίσκονται. Ποδόσφαιρο παίζουν. ΠΑΟΚ-ΑΕΚ-ΔΟΞΑ! Η δόξα που αναφέρει στο Ευαγγέλιο έχει αγάπη και ταπείνωση. «Δόξασόν σου τον υιόν, λέει, ίνα και ο υιός σου δοξάση σέ… αυτή δε εστίν η αιώνιος ζωή, ίνα γινώσκωσι σε τον μόνον αληθινόν Θεόν»[167]. Ζητούσε δηλαδή ο Χριστός από τον Θεό να γνωρίσουν οι άνθρωποι τον Λυτρωτή τους, για να σωθούν. Σήμερα οι περισσότεροι ενδιαφέρονται πώς να αποκτήσουν από παντού δόξα. Δόξα από ΄δώ, δόξα από ΄κεί, και τελικά καταλήγουν σέ… λόξα από ΄δώ, λόξα από ΄κεί. Αυτό είναι που είπε ο Χριστός: «Δόξαν παρά αλλήλων λαμβάνοντες»[168], «πλανώντες και πλανώμενοι»[169]. Με κάτι τέτοια μου έρχεται να κάνω εμετό. Σε τέτοια ατμόσφαιρα δεν μπορώ να ζήσω ούτε είκοσι τέσσερις ώρες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι ευθύνες είναι μεγάλο εμπόδιο στην πνευματική ζωή. Όσοι θέλουν να κάνουν δουλειά πνευμαιτκή αποφεύγουν τις ευθύνες. Συνήθως δεν βλέπει κανείς καλό τέλος σ΄ αυτούς που επιδιώκουν αξιώματα και προϊσταμενίες. Μπαίνει το προσωπικό στοιχείο, ο εγωισμός, και μετά συγκρούονται και μαλώνουν μεταξύ τους οι προϊστάμενοι, επειδή υπάρχει και στον ένα και στον άλλο προϊστάμενο ο εγωισμός. Όσοι όμως αγωνίζονται φιλότιμα και δεν αναπαύουν τον εαυτό τους και βγάζουν τον εαυτό τους από την κάθε ενέργειά τους βοηθάνε πολύ θετικά, γιατί τότε μόνον αναπαύονται οι ψυχές που έχουν ανάγκη βοηθείας και τότε μόνο θα αναπαυθή εσωτερικά η ψυχή τους και σ΄ αυτήν την ζωή και στην αιώνια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι Άγιοι Πατέρες, παλιά, έφευγαν στην έρημο πρώτα και ερημώνονταν από τα πάθη τους με τον αγώνα τους. Χωρίς σχέδια και προγράμματα δικά τους αφήνονταν στα χέρια του Θεού και απέφευγαν τα αξιώματα και την εξουσία, ακόμη και όταν έφθαναν σε μέτρα αγιότητος –εκτός αν η Μητέρα Εκκλησία είχε ανάγκη, όποτε έκαναν υπακοή στο θέλημα του Θεού, και δοξαζόταν το Όνομα του Θεού με την αγία τους ζωή. Γίνονταν δηλαδή πνευματικοί αιμοδότες, αφού αποκτούσαν καλή κατάσταση πνευματικής υγείας στην έρημο, με την καλή πνευματική τροφή και την άγρυπνη πατερική παρακολούθηση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η διοίκηση στην Εκκλησία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Ορθόδοξη Εκκλησία πάντα λειτουργούσε με Συνόδους. Το ορθόδοξο πνεύμα είναι να λειτουργή η Σύνοδος στην Εκκλησία και η Γεροντική Σύναξη στα Μοναστήρια. Ο αρχιεπίσκοπος και η Σύνοδος να αποφασίζουν μαζί. Ο ηγούμενος ή η ηγουμένη και το ηγουμενοσυμβούλιο να αποφασίζουν μαζί. Ο αρχιεπίσκοπος είναι πρώτος μεταξύ ίσων. Και ο πατριάρχης δεν είναι πάπας· έχει τον ίδιο βαθμό με τους υπόλοιπους ιεράρχες. Ενώ ο πάπας έχει άλλο βαθμό –κάθεται ψηλά και του φιλούν το πόδι! – ο πατριάρχης κάθεται μαζί με τους άλλους ιεράρχες και συντονίζει. Και ένας ηγούμενος ή μία ηγουμένη σε σχέση με τους προϊσταμένους είναι πάλι πρώτοι μεταξύ ίσων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν μπορεί ο αρχιεπίσκοπος ή ένας ηγούμενος να κάνη ό,τι θέλει. Φωτίζει ο Θεός τον έναν ιεράρχη ή προϊστάμενο για το ένα θέμα, τον άλλον για το άλλο. Βλέπεις, και οι τέσσερις Ευαγγελιστές συμπληρώνουν ο ένας τον άλλον. Έτσι και εδώ λέει την γνώμη του ο καθένας, και όταν υπάρχη αντίθετη γνώμη, καταχωρίζεται στα πρακτικά. Γιατί, όταν πρόκειται για μία απόφαση αντίθετη με τις εντολές του Ευαγγελίου και ένας δεν συμφωνή, αν δεν ζητήση να καταχωριστή η γνώμη του, θα φαίνεται ότι συμφωνεί. Αν δεν συμφωνή και υπογράψη χωρίς να καταχωριστή η γνώμη του, κάνει κακό και φέρει ευθύνη· είναι ένοχος. Ενώ, αν πη την γνώμη του, και η πλειοψηφία να είναι αντίθετη, αυτός είναι εντάξει απέναντι στον Θεό. Αν στην Εκκλησία δεν λειτουργή σωστά η Σύνοδος ή στα Μοναστήρια η Σύναξη, τότε, ενώ μιλούμε για ορθόδοξο πνεύμα, έχουμε παπικό. Το ορθόδοξο πνεύμα είναι να λέη και να καταχωρίζη ο καθένας την γνώμη του, όχι να μη μιλάη, γιατί φοβάται, ή να κολακεύη, για να τα έχη καλά με τον αρχιεπίσκοπο ή με τον ηγούμενο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά και οι κληρικοί που μπαίνουν στην διοίκηση νέοι στην ηλικία, έστω και αν έχουν προσόντα, βλάπτονται, χαραμίζονται. Μπαίνουν στα γρανάζια, διοίκηση, γραμματεία κ.λπ. και δεν βοηθιούνται πνευματικά, ενώ έχουν προϋποθέσεις. Μερικοί, αν δεν χαραμίζονταν και έκαναν δουλειά στον εαυτό τους, θα ήταν αργότερα μεγάλα κεφάλαια για την Εκκλησία. Όταν ο άνθρωπος δεν ασχολήται με την καλή έννοια με τον εαυτό του, δεν κάνη δηλαδή δουλειά στον εαυτό του, είναι σαν έμπορας που αγοράζει και πουλάει και δεν ξέρει τί χρέη έχει, και τελικά τον κλείνουν στην φυλακή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ λυπάμαι όταν ακούω νέοι ιερείς να είναι στο γραφείο. Αν έμεναν έξω από την διοίκηση λίγο ακόμη, θα βοηθούσαν αργότερα πιο πολύ. Δυστυχώς όμως συχνά γίνονται προϊστάμενοι νέοι ιερείς και όχι έμπειροι, που θα μπορούσαν να κάνουν δουλειά πνευματική στο ποίμνιό τους, και έτσι γίνεται διπλό κακό. Δηλαδή οι νέοι αναλαμβάνουν ευθύνες, πριν κάνουν πνευματική δουλειά στον εαυτό τους, και βρίσκονται σε θέσεις που πρέπει να προσφέρουν, πριν αποκτήσουν πνευματικό πλούτο. Οι μεγαλύτεροι πάλι μη έχοντας υπεύθυνες θέσεις δεν έχουν την δυνατότητα να προσφέρουν την πολύτιμη πείρα τους και τον θείο φωτισμό τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η Θεία Λειτουργία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν τελήται Θεία Λειτουργία, πάντοτε πρέπει να υπάρχη κάποιος που θα κοινωνήση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατί ο κύριος σκοπός της Θείας Λειτουργίας είναι να κοινωνούν οι Χριστιανοί, έστω και λίγοι που είναι έτοιμοι. Όλες οι ευχές αναφέρονται στους πιστούς που θα κοινωνήσουν. Γι’ αυτό έστω και ένας πρέπει να κοινωνάη. Φυσικά, θα τύχη και καμμιά φορά να μην είναι ούτε ένας έτοιμος· άλλο αυτό. Καλά είναι όμως ακόμη και ένα μικρό παιδάκι, ένα μωρό, να κοινωνάη. Και όταν δεν βρίσκεται κανείς, τότε είναι μόνο για να κοινωνάη ο ιερεύς και να μνημονεύωνται ονόματα. Αλλά αυτό ας γίνεται ως εξαίρεση και όχι ως κανόνας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τα γεγονότα της Καινής Διαθήκης τα ζη κανείς σε κάθε Θεία Λειτουργία. Η Αγία Πρόθεση είναι η Βηθλεέμ, η Αγία Τράπεζα είναι ο Πανάγιος Τάφος, και ο Εσταυρωμένος ο Άγιος Γολγοθάς. Αγιάζεται όλη η κτίση από την Θεία Λειτουργία, από την παρουσία του Χριστού. Οι Θείες Λειτουργίες κρατούν τον κόσμο! Είναι φοβερό το τί μας έχει δώσει ο Θεός! Δεν είμαστε άξιοι Γι’ αυτό! Υπάρχουν ιερείς που ζουν σε κάθε Θεία Λειτουργία το φοβερό αυτό Μυστήριο. Μου είπε κάποιος κληρικός ότι ένας πολύ απλός και καλός ιερεύς του έλεγε: «Δυσκολεύομαι πολύ να κάνω κατάλυση. Πέφτουν τα βρωμοδάκρυά μου μέσ΄ στο άγιο Ποτήριο· δεν μπορώ να τα συγκρατήσω, και Γι’ αυτό στενοχωριέμαι πολύ». Και έκλαιγε! Του λέει και εκείνος: «Πές στον Χριστό να μου δώση και μένα λίγα «βρωμοδάκρυα»».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί, όταν ο ιερεύς παίρνη καιρό, κατεβαίνετε από το στασίδι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κατεβαίνω, γιατί εκείνη την ώρα που προσεύχεται ο ιερεύς στέλνει ο Θεός την θεία Χάρη στον ιερέα, για να τον απαλλάξη από τις αδυναμίες του, ώστε να μπορέση να τελέση την θεία Μυσταγωγία. Τότε και οι πιστοί πρέπει με ευλάβεια να προσεύχωνται για να πάρουν Χάρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η Θεία Λειτουργία αρχίζει από την Προσκομιδή. Πώς ο Θεός οικονομάει καμμιά φορά να καταλάβουμε και να ζήσουμε και εμείς τα άγια Μυστήρια! Όταν ήμουν Εκκλησιαστικός, μου συνέβη ένα γεγονός. Μία φορά, όταν ο ιερεύς έκανε την Προσκομιδή, την στιγμή που είπε: «Ως Πρόβατον επί σφαγήν ήχθη», ακούω σπαρτάρισμα αρνιού επάνω στο άγιο Δισκάριο. Όταν πάλι είπε: «Θύεται ο Αμνός και Υιός του Θεού», ακούω βέλασμα από την Αγία Πρόθεση. Φοβερό! Γι’ αυτό λέω στους ιερείς να μην προετοιμάζουν από νωρίτερα την Προσκομιδή και μετά κάνουν τα άλλα εικονικά. Δηλαδή δεν πρέπει να κόβουν το πρόσφορο από νωρίτερα και απλώς εκείνη την στιγμή να τοποθετούν τον Αμνό στο άγιο Δισκάριο και να λένε, «θύεται ο Αμνός του Θεού»καί «ως Πρόβατον επί σφαγήν ήχθη», ενώ έχουν ήδη βγάλει τον Αμνό. Όταν λένε αυτά  τα λόγια, τότε πρέπει να παίρνουν την αγία Λόγχη και να χαράζουν το πρόσφορο. Όταν δηλαδή λένε, «θύεται ο Αμνός του Θεού», τότε να Τον «θύουν».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ο ιερεύς χτυπάη το κουδουνάκι την ώρα που κάνει Προσκομιδή και μνημονεύετε και εσείς νοερώς ονόματα, να συμμετέχη η καρδιά σας στον πόνο της κάθε ψυχής που μνημονεύετε, είτε ζωντανή είναι είτε κεκοιμημένη. Να φέρνετε στον νού σάς γενικά όλες τις περιπτώσεις των ανθρώπων και όποιον συγκεκριμένα έχετε ύπ΄ όψιν σας και να λέτε: «Μαρίας, Νικολάου… ξέρεις Εσύ, Θεέ μου, τα προβλήματά τους· βοήθησέ τους». Ονόματα που σάς δίνουν για μνημόνευση, να τα μνημονεύετε σε μερικές Θείες Λειτουργίες, άλλα σε τρείς, άλλα σε πέντε, και μετά να μνημονεύωνται και άλλα. Γιατί να έχης άλλους να τους μνημονεύης συνέχεια και άλλους που έχουν ανάγκη να μην τους μνημονεύης καθόλου; Αυτό δεν το καταλαβαίνω. Ονόματα Καθολικών, Ιεχωβάδων κ.λπ. δεν κάνει να μνημονεύωνται στην Ιερά Πρόθεση. Δεν μπορεί να βγαίνη Γι’ αυτούς μερίδα ούτε γίνεται Γι’ αυτούς μνημόσυνο. Υπέρ υγείας και φωτισμού μπορούμε να ευχώμαστε και Γι’ αυτούς, ακόμη και Παράκληση να κάνουμε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί ιερείς λένε ότι δεν θέλουν να λειτουργούν συχνά, για να μη συνηθίσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν είναι σωστό αυτό να το λέη ιερεύς. Είναι δηλαδή σαν να λέη: «Δεν πάω τακτικά στους συγγενείς μου, ώστε να με καλοδέχωνται περισσότερο, όταν πηγαίνω». Χρειάζεται όμως προετοιμασία. Η Θεία Κοινωνία θεραπεύει, αγιάζει αυτόν που αγωνίζεται. Έναν που δεν αγωνίζεται, πώς να τον βοηθήση; Τί να αλλοιώση ο Χριστός, αφού δεν αλλοιώνεται ο ίδιος ο άνθρωπος; Κάποτε, στην Σπηλιά του Αγίου Αθανασίου ήταν ένας Γέροντας με δύο υποτακτικούς. Ο ένας ήταν ιερομόναχος και ο άλλος ιεροδιάκονος. Μία μέρα λοιπόν πήγαν οι υποτακτικοί του σε ένα εξωκκλήσι, για να λειτουργήσουν. Ο ιερεύς όμως φθονούσε πολύ τον διάκο, και τον ζήλευε, επειδή ο διάκος ήταν πιο έξυπνος και επιτήδειος σε όλα· αλλά και ο διάκος δεν βοηθούσε με τον εγωιστικό του τρόπο. Ο ιερεύς είχε προετοιμασθή εξωτερικά, διαβάζοντας την Θεία Μετάληψη και κάνοντας όλα τα σχετικά τυπικά. Δυστυχώς όμως δεν έκανε το κυριώτερο, την εσωτερική προετοιμασία· δηλαδή να εξομολογηθή ταπεινά, για να διώξη τον φθόνο και την ζήλεια από την καρδιά του, τα οποία δεν φεύγουν με το να αλλάξουμε τα ρούχα μας και να λούσουμε το κεφάλι. Έτσι λοιπόν με την εξωτερική αυτή προετοιμασία προχώρησε στο φοβερό Θυσιαστήριο, για να λειτουργήση. Μόλις όμως άρχισε να προσκομίζη, τί συνέβη; Ακούστηκε ξαφνικά ένας μεγάλος κρότος και είε να φεύγη το άγιο Δισκάριο από την Προσκομιδή και να εξαφανίζεται. Επόμενο ήταν να μην μπορέσουν πια να λειτουργήσουν. Εάν δεν τους εμπόδιζε ο Καλός Θεός με αυτόν τον τρόπο και λειτουργούσε ο ιερεύς με την ψυχική κατάσταση στην οποία βρισκόταν, μου λέει ο λογισμός ότι θα πάθαινε μεγάλο κακό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν συμβή κάτι την ώρα της Θείας Λειτουργίας, μπορεί η Θεία Λειτουργία να διακοπή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν γίνεται Θεία Λειτουργία, δεν μπορεί ο ιερεύς να την αφήση στην μέση, ο,τιδήποτε και να συμβή. ,καί πόλεμος να κηρυχθή, θα την τελειώση. Και οι εχθροί να έρχωνται έξω από την Εκκλησία, θα κοιτάξη το πολύ-πολύ να βιασθή λίγο, για να τελειώση. Θα βοηθήση ο Θεός να τελειώση. Αλλά πρέπει να έχη κανείς εμπιστοσύνη στον Θεό· να μη φοβάται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Λειτουργός του Υψίστου πρέπει να έχη πολλή προσοχή, καθαρότητα, ακρίβεια. Είναι ανώτεροι από τους Αγγέλους οι ιερείς. Οι άγιοι Άγγελοι καλύπτουν τα πρόσωπά τους την ώρα που τελείται το Μυστήριο της Θείας Ευχαριστίας, ενώ ο ιερεύς το τελεί.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Γιορτές και αργίες
- type: h2
  initial:
    ru: ''
  text:
    ru: «Εορτάσωμεν, πιστοί, εορτήν πνευματικήν…»[170]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Χριστός με την μεγάλη Του αγάπη και με την μεγάλη Του αγαλλίαση που σκορπάει στις ψυχές των πιστών με όλες τις άγιες γιορτές Του μας ανασταίνει αληθινά, αφού μας ανεβάζει ψηλά πνευματικά. Αρκεί να συμμετέχουμε και να έχουμε όρεξη πνευματική να τις πανηγυρίζουμε πνευματικά· τότε τις γλεντάμε πνευματικά και μεθάμε πνευματικά από το παραδεισένιο κρασί ου μας φέρνουν οι Άγιοι και μας κερνούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί να ζήση κανείς πνευματικά τις γιορτές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τις γιορτές για να τις ζήσουμε, πρέπει να έχουμε τον νού μας στις άγιες ημέρες και όχι στις δουλειές που έχουμε να κάνουμε για τις άγιες ημέρες. Να σκεφτώμαστε τα γεγονότα της κάθε άγιας ημέρας (Χριστούγεννα, Θεοφάνεια, Πάσχα κ.λπ.) και να λέμε την ευχή δοξολογώντας τον Θεό. Έτσι θα γιορτάζουμε με πολλή ευλάβεια κάθε γιορτή. Οι κοσμικοί ζητούν να καταλάβουν τα Χριστούγεννα με το χοιρινό, το Πάσχα με το αρνί, τις Αποκριές με το κομφετί. Οι αληθινοί μοναχοί όμως κάθε μέρα ζουν τα θεία γεγονότα και αγάλλονται συνέχεια. Κάθε εβδομάδα ζουν την Μεγάλη Εβδομάδα. Κάθε Τετάρτη, Πέμπτη, Παρασκευή ζουν την Μεγάλη Τετάρτη, την Μεγάλη Πέμπτη, την Μεγάλη Παρασκευή, δηλαδή τα Πάθη του Χριστού, και κάθε Κυριακή το Πάσχα, την Ανάσταση. Τί, θα πρέπη να έρθη η Μεγάλη Εβδομάδα, για να θυμηθή κανείς τα Πάθη του Χριστού; Πρέπει να έρθη το Πάσχα με το αρνί, για να καταλάβω το «Χριστός ανέστη»σάν τους κοσμικούς; Ο Χριστός τί είπε; «Έτοιμοι γίνεσθε»[171]είπε. Δεν είπε, «ετοιμασθήτε τώρα!».Από την στιγμή που λέει ο Χριστός, «έτοιμοι γίνεσθε», πρέπει ο άνθρωπος, και ιδίως ο μοναχός, να είναι έτοιμος συνέχεια. Να μελετάη και να ζη τα θεία γεγονότα συνέχεια. Όταν κανείς μελετάη τα γεγονότα της κάθε γιορτής, φυσιολογικά θα συγκινηθή και με ιδιαίτερη ευλάβεια θα προσευχηθή. Έπειτα στις Ακολουθίες ο νούς να είναι στα γεγονότα που γιορτάζουμε και με ευλάβεια να παρακολουθούμε τα τροπάρια που ψάλλονται. Όταν ο νούς είναι στα θεία νοήματα, ζη τα γεγονότα ο άνθρωπος, και έτσι αλλοιώνεται. Όταν σκεφτώμαστε λ.χ. έναν Άγιο που τον έχουμε σε ευλάβεια ή τον Άγιο που γιορτάζουμε, ο νούς θα πάη και λίγο παραπάνω· θα πάη στον Ουρανό. Και όταν σκεφτώμαστε τους Αγίους, μας σκέφτονται και οι Άγιοι και μας βοηθούν. Έτσι πιάνει κανείς φιλία με τους Αγίους, που είναι και η πιο σίγουρη φιλία. Τότε μπορεί να είναι μόνος και να ζη με όλους· και με Αγίους και με Αγγέλους και με όλον τον κόσμο. Να είναι μόνος και να νιώθη όλη αυτήν την συντροφιά! Είναι ζωντανή η παρουσία των Αγίων. Όλοι οι Άγιοι είναι παιδιά του Θεού και βοηθούν εμάς τα ταλαίπωρα παιδιά του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τους Αγίους μας, που έχυσαν είτε αίμα είτε ιδρώτες και δάκρυα για την αγάπη του Χριστού, πάντα πρέπει να τους γιορτάζουμε με ευλάβεια, για να βοηθιώμαστε. Και όταν ακούμε το Συναξάρι τους «Τη αυτή ημέρα μνήμη του Αγίου…», να στεκώμαστε εκείνη την στιγμή όρθιοι, όπως και οι στρατιώτες στέκονται προσοχή, όταν διαβάζωνται τα ονόματα των ηρωικώς πεσόντων συναδέλφων τους. «Την τάδε του μηνός… ο στρατιώτης δείνα έπεσε μαχόμενος ηρωικώς στο τάδε μέτωπο».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην γιορτή, για να νιώση κανείς το γεγονός, δεν πρέπει να δουλεύη. Την Μεγάλη Παρασκευή λ.χ., εάν θέλη να νιώση κάτι, δεν πρέπει να κάνη τίποτε άλλο εκτός από προσευχή. Στον κόσμο οι καημένοι οι κοσμικοί την Μεγάλη Εβδοβάδα έχουν δουλειές. Μεγάλη Παρασκευή να δίνουν ευχές. «Χρόνια πολλά! Να ζήσετε! Με μία νύφη!».… Δεν κάνει! Εγώ την Μεγάλη Παρασκευή κλείνομαι στο Καλύβι. Όπως και μετά το Αγγελικό Σχήμα η εβδομάδα της ησυχίας που ακολουθεί, βοηθάει, γιατί ποτίζει η θεία Χάρις την ψυχή και καταλαβαίνει ο μεγαλόσχημος τί έγινε, έτσι και στις γιορτές η ησυχία πολύ βοηθάει.Μας δίνεται περισσότερη ευκαιρία να ξεκουρασθούμε λίγο, να μελετήσουμε και να προσευχηθούμε. Θα έρθη ένας καλός λογισμός, θα εξετάσουμε τον εαυτό μας, θα πούμε λίγο την ευχή και θα νιώσουμε έτσι κάτι από το θείο γεγονός της ημέρας.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Κρείσσον ολίγον τω δικαίω…»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα δυστυχώς δεν χρησιμοποιούμε την ελευθερία για το καλό, για την αγιότητα, αλλά για την κοσμικότητα. Παλιότερα δούλευαν οι άνθρωποι όλη την εβδομάδα και είχαν την Κυριακή αργία. Τώρα έχουν και το Σάββατο αργία. Ζούν όμως τώρα περισσότερο πνευματικά ή αμαρτάνουν περισσότερο; Αν αξιοποιούσαν τον χρόνο τους στα πνευματικά, θα ήταν διαφορετικά· θα ήταν συμμαζεμένοι οι άνθρωποι. Πάμε να κλέψουμε από τα πνευματικά, από τον Χριστό, εμείς οι ταλαίπωροι άνθρωποι. Οι κοσμικοί, ό,τι αγγαρεία έχουν να κάνουν, την Κυριακή θα συμφωνήσουν να την κάνουν. Ψάχνουν καμμιά Κυριακή γι’ αυτό, καμμιά γιορτή για ’κείνο, και παίρνουν οργή Θεού. Τί βοήθεια θα έχουν μετά από τους Αγίους; Μέρα αγγαρείας είναι η Κυριακή; Και κάποια εξυπηρέτηση να θέλουν να μας προσφέρουν οι άλλοι, όχι Κυριακή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δεν αφήνουμε τον Θεό να μας κάνη κουμάντο. Και ό,τι δεν γίνεται με πίστη στον Θεό, δεν έχει σχέση με τον Θεό· είναι κάτι κοσμικό. Γι’ αυτό κι εκείνο που κάνουμε, δεν έχει ευλογία, και έτσι δεν έχει καλά αποτελέσματα. Μετά λέμε: «Φταίει ο διάβολος». Δεν φταίει ο διάβολος, αλλά εμείς δεν αφήνουμε τον Θεό να μας βοηθήση. Όταν δουλεύουμε τις αργίες, δίνουμε δικαιώματα και εξ αρχής μπαίνει ο διάβολος. «Κρείσσον ολίγον τω δικαίω υπέρ πλούτον αμαρτωλών πολύν»[172], λέει ο Ψαλμός. Αυτό έχει ευλογία· τα άλλα όλα είναι ροκανίδια. Πρέπει όμως να έχη κανείς πίστη, φιλότιμο και ευλάβεια και να τα αφήνη όλα με εμπιστοσύνη στον Θεό. Αλλιώς και τις γιορτές θα κουτσοδουλεύη και τις άλλες μέρες θα χαζεύη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και να δήτε ο Θεός ποτέ δεν αφήνει. Κυριακή και γιορτή ποτέ δεν δούλεψα, και ο Θεός ποτέ δεν μ’ άφησε και τις δουλειές τις ευλογούσε. Θυμάμαι, μία φορά ήρθαν αλωνιστικές μηχανές στο χωριό και ειδοποίησαν τον πατέρα ότι θα άρχιζαν πρώτα από τα δικά μας χωράφια, ημέρα Κυριακή, και μετά θα έφευγαν για κάτω. Μου λέει ο πατέρας: «Τί θα κάνουμε; Ήρθαν οι μηχανές». «Εγώ Κυριακή δεν δουλεύω, του λέω· την Δευτέρα». «Αν όμως χάσουμε αυτήν την ευκαιρία, μου λέει, θα παιδευτούμε πολύ με τα άλογα». «Δεν με πειράζει, του λέω. Ας αλωνίζω μέχρι τα Χριστούγεννα». Πήγα στην Εκκλησία χωρίς να δώσω σημασία. Μόλις ξεκίνησαν οι μηχανές για το αλώνι, έσπασαν στον δρόμο και ειδοποίησαν ξανά τον πατέρα: «Να μας συγχωρήτε, χάλασαν οι μηχανές. Θα πάμε στα Γιάννενα να τις φτιάξουμε και την Δευτέρα θα αρχίσουμε πρώτα από σας»! Έτσι δεν αλώνισαν την Κυριακή αλλά την Δευτέρα. Πολλά τέτοια είδαν τα μάτια μου.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αν εμείς οι μοναχοί δεν κρατάμε τις γιορτές, οι κοσμικοί τί να κάνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και στα Μοναστήρια παλιά τί πνεύμα υπήρχε! Θυμάμαι, γιόρταζαν οι κοσμικοί την ημέρα του Σταυρού με το νέο ημερολόγιο και μετά έφερναν τα σταφύλια στο Άγιον Όρος. Μπορεί όμως την ημέρα που θα έφθαναν στο Όρος να είχαμε εμείς του Σταυρού με το δικό μας ημερολόγιο. Αλλά οι Πατέρες ποτέ δεν πήγαιναν να ξεφορτώσουν. Τα γύριζαν πίσω ή άφηναν εκεί και το καΐκι και τα σταφύλια. Το ίδιο γινόταν και με το λάδι ή την ξυλεία, αν έρχονταν ημέρα γιορτής. Και ήταν φτωχά τα Μοναστήρια. Σκέφτονταν: «Ο άλλος που θα δη καλογήρους να δουλεύουν αυτήν την ημέρα τί θα πή;»Χίλιες φορές προτιμούσαν να τα πάρη η φουρτούνα, να χαθούν και τα σταφύλια και τα λάδια, παρά να τα ξεφορτώσουν και να χάσουν την γιορτή, να σκανδαλίσουν και ψυχές.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τώρα… Βρέθηκα σ’ ένα Μοναστήρι παραμονή γιορτής και ξεφόρτωναν σταφύλια. Παγκοινιά μετά, για να πατήσουν τα σταφύλια. Το βράδυ είχαν Αγρυπνία και την μετέθεσαν. Και ήταν μεγάλη γιορτή! «Εν ανάγκη και νόμου μετάθεσις γίνεται»… Αλλού Κυριακή να διορθώνουν το Μοναστήρι που κάηκε· πάλι θα καή! Βλέπουν και οι κοσμικοί και λένε μετά: «Δεν είναι τίποτε οι γιορτές».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θέλει πολλή προσοχή να μη δουλεύουμε, ιδίως εμείς οι μοναχοί, στις γιορτές, γιατί αμαρτάνουμε και εμείς, αλλά γινόμαστε και σκάνδαλο στους κοσμικούς, και διπλά αμαρτάνουμε. Οι κοσμικοί αφορμή ζητούν, ιγα να δικαιολογήσουν τις αμαρτίες τους. Αυτοί μπορεί να δουλεύουν μέρα-νύχτα, γιορτές να μην κρατούν, και αν δούν μία καλόγρια ή έναν καλόγερο να δουλεύη σε μία μεγάλη ανάγκη, τους λέει μετά το διάβολος: «Εδώ παπάδες δουλεύουν, εσύ γιατί να μη δουλέψης;»Μία κουβέρτα να τινάξη μία καλόγρια την Κυριακή, αν την δούν κοσμικοί, θα πούν: «Αφού οι καλόγριες δουλεύουν, εμείς γιατί να μην πάμε στην δουλειά;»Γι’ αυτό θέλει πολλή προσοχή να μη γινώμαστε σκάνδαλο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και άν, Γέροντα, έρθη ένας τεχνίτης να δουλέψη μέρα γιορτής, π.χ. στα Εισόδια της Παναγίας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εισόδια της Παναγίας και να δουλέψη μάστορας στο Μοναστήρι! Δεν ταιριάζει! Να μη δουλέψη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτό συνέβη, γιατί η αδελφή δεν σκέφθηκε να του πη να μην έρθη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε χρειάζεται κανόνας στην αδελφή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σε μία γιορτή, μετά από Αγρυπνία, αν νυστάξη κανείς, μπορεί να κάνη ένα εργόχειρο και να λέη την ευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μετάνοιες δεν μπορεί να κάνη; Ας κάνη μετάνοιες, για να ξενυστάξη· γιατί να κάνη εργόχειρο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ούτε την Κυριακή, όταν έχη κάνη τα πνευματικά του, μπορεί λ.χ. να πλέξη κομποσχοίνι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί να πλέξης κομποσχοίνι; Γιατί δεν χορταίνεις αυτήν την μέρα πνευματικά; Μπαίνει ένα κοσμικό πνεύμα και στα Μοναστήρια δυστυχώς. Σε μερικά μάλιστα Μοναστήρια, όπως μαθαίνω, τις Κυριακές ή τις μεγάλες γιορτές, μόλις έρθη το μεσημέρι, πηγαίνουν στα διακονήματα. Λές και τα παιδιά τους πεθαίνουν από την πείνα ή έχουν χρέη και θα βγάλουν το σπίτι σε πλειστηριασμό!... Τόση ανάγκη!... Άλλο ο αρχοντάρης, ο μάγειρας· στο αρχονταρίκι, στην κουζίνα είναι ανάγκη· δεν μπορεί να μην πάη κανείς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τυχαίνει καμμιά φορά να μου φέρη κάποιος ψάρι. Του λέω: «Παρ’ το και φύγε». Αν ο ένας φέρη ψάρια, ο άλλος ζωντανά, ο άλλος ψόφια, τί θα γίνη; Κι εδώ αν φέρουν τα ψάρια μέρα γιορτής και θέλετε να τα ετοιμάσετε, τότε τί θα χαρήτε από την γιορτή; Θυμάστε τον Πάπα-Μηνά στην Σκήτη της Αγίας Άννης; Ένας ψαράς του πήγε Κυριακή πρωί ψάρια για την πανήγυρη. «Γέροντα, είναι φρέσκα», του λέει. «Καλά, σήμερα είναι Κυριακή· πότε τάπιασες και είναι φρέσκα;»τόν ρωτάει παραξενεμένος ο Πάπα-Μηνάς. «Σήμερα το πρωί», του λέει ο ψαράς. «Πέταξε τά, παιδί μου· αυτά  είναι αφορισμένα! λέει ο Πάπα-Μηνάς. Και για να το διαπιστώσεις, δώσε ένα ψάρι στον γάτο και θα δής ότι δεν θα το φάη». Πράγματι ο ψαράς πέταξε ένα ψάρι στον γάτο και ο γάτος γύρισε πίσω το κεφάλι του· έδειξε αποστροφή. Τέτοια ευαισθησία είχαν!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα βλέπεις στα Μοναστήρια σε μεγάλες γιορτές εργάτες, μάστορες… Μία φορά, της Παναγίας, σ’ ένα Μοναστήρι είχαν εργάτες, ολόκληρο συνεργείο με αλυσοπρίονα και ξύλευαν το δάσος. Ενώ ήταν ξάστερος ο ουρανός, ήρθε ένα σύννεφο, έπεσαν κεραυνοί κοντά στους υλοτόμους και έφυγαν με τέτοιο τρόμο πού, ενώ πήρε το δάσος φωτιά, ούτε καν ειδοποίησαν. Τρόμαξαν να την σβήσουν αργότερα. Την άλλη Κυριακή πάλι μηχανές· δυο συνεργεία ξαναβγήκαν. Οργή Θεού είναι και οι πυρκαγιές, αφού ξυλεύουμε Κυριακές και γιορτές. Και το κακό είναι που δεν το καταλαβαίνουμε. Έχουμε ξεπεράσει το όριο της ανοχής του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν υπάρχη κάποια ανάγκη, κάνουν οι καλόγεροι ένα κομποσχοίνι, εκατό κόμπους, και φωτίζει ο Θεός κάποιον και στέλνει εκατό χιλιάδες. Το έργο του μοναχού είναι η προσευχή. Αν δεν έχουμε εμείς εμπιστοσύνη στον Θεό, ποιοί θα έχουν; Οι κοσμικοί; Υποχρεώνεται ο Θεός να τον ακούη τον μοναχό που του εμπιστεύεται την ζωή του. Στο Κοινόβιο που ήμουν, ήταν ένας παρηγουμενιάρης. Και σβέλτος δεν ήταν και πριν τελειώση η Θεία Λειτουργία δεν έφευγε, αλλά και τις δουλειές τις έκανε. Εγώ ήμουν πιο σβέλτος, έφευγα και πριν τελειώσει η Θεία Λειτουργία, να ετοιμάσω το Συνοδικό, και μου έρχονταν όλα ανάποδα. Πότε μου γύριζε το μπρίκι και μου χυνόταν ο καφές και πότε μου έπεφταν τα φλιτζάνια και τα ποτήρια, όλο αναποδιές! Εκείνος έφευγε στο τέλος της Θείας Λειτουργίας. Έκανε τον σταυρό του και πίστευε ότι ο Θεός θα τον βοηθήση. Και αν τον μάλωναν, θα το δεχόταν ταπεινά. Είχε ταπείνωση και διπλά ωφελείτο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως οι άνθρωποι, όταν δεν σκαλώνουν σε λεπτομέρειες, που δεν βλάπτουν αν παραλειφθούν, ωφελούνται διπλά και δοξολογούν διπλά τους εορταζομένους Αγίους. Όσο μπορούμε, να προσέχουμε να μην είναι εις βάρος των πνευματικών ό,τι κάνουμε, αλλά τα πνευματικά να προηγούνται, για να αγιάζωνται όλες οι εργασίες και να έχουμε και τις ευλογίες του Θεού. Να δίνουμε τα πρωτεία στην πνευματική ζωή και όχι στα υλικά. Αν κανείς έχη πρώτα τις δουλειές και ύστερα την προσευχή, δίνει μεγαλύτερη αξία στις δουλειές παρά στα πνευματικά. Αυτό έχει υπερηφάνεια και ανευλάβεια. Δεν αγιάζεται το έργο που γίνεται με χρεωκοπία πνευματική. Αν δίνουμε τα πρωτεία στα πνευματικά, ο Θεός όλα θα τα τακτοποιήση. Αν εμείς οι μοναχοί δεν κρατάμε τις γιορτές, οι κοσμικοί τί να κάνουν; Αν εμείς δεν κάνουμε πνευματικά και δεν παρακαλούμε τους Αγίους να βοηθούν, ποιός θα παρακαλέση; Έτσι λέμε ότι πιστεύουμε στον Θεό, αλλά δεν έχουμε εμπιστοσύνη στον Θεό. Αν εμείς οι καλόγεροι που φοράμε τα ράσα ούτε Κανόνες σεβώμαστε, ακαταπατούμε και ατιμάζουμε τα πάντα, τί νόημα έχει τότε η ζωή μας;
- type: h2
  initial:
    ru: ''
  text:
    ru: Δουλεύουν Κυριακές και γιορτές και τους βρίσκουν συμφορές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Κανονικά πριν από τον Εσπερινό της γιορτής ή της Κυριακής σταματάει κάθε εργασία. Καλύτερα είναι να δουλέψη κανείς περισσότερο την προπαραμονή, όταν αυτό μπορή να ρυθμισθή, και να μη δουλέψη μετά τον Εσπερινό της παραμονής. Άλλο είναι να κάνη κανείς σε μία γιορτή ή την Κυριακή ένα ελαφρό πράγμα το απόγευμα, όταν είναι μεγάλη ανάγκη, αλλά και αυτό πάλι με τρόπο. Παλιά και οι χωρικοί που ήταν έξω στα χωράφια, μόλις άκουγαν την καμπάνα του Εσπερινού, έκαναν τον σταυρό τους και σταματούσαν την δουλειά. Το ίδιο και οι γυναίκες που κάθονταν στην γειτονιά. Σηκώνονταν, έκαναν τον σταυρό τους και άφηναν το πλέξιμο ή ό,τι άλλο έκαναν. Και ο Θεός τους ευλογούσε. Είχαν την υγεία τους και χαίρονταν… Τώρα κατήργησαν τις γιορτές, απομακρύνθηκαν από τον Θεό και την Εκκλησία και τελικά όσα βγάζουν από την δουλειά τους τα δίνουν στους γιατρούς και στα νοσοκομεία… Μία φορά ήρθε ένας πατέρας στο Καλύβι και μου λέει: «Το παιδί μου αρρωσταίνει συχνά και οι γιατροί δεν μπορούν να βρουν τί έχει». «Να σταματήσης να δουλεύης Κυριακή και όλα θ’ αλλάξουν», του είπα. Πράγματι σταμάτησε, και το παιδάκι του έγινε καλά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντα λέω στους λαϊκούς να σταματήσουν να δουλεύουν Κυριακές και γιορτές, για να μην τους βρουν στην ζωή τους συμφορές. Όλοι μπορούν να ρυθμίσουν την δουλειά τους. Όλη η βάση είναι η πνευματική ευαισθησία. Αν υπάρχη ευαισθησία, βρίσκονται λύσεις για όλα. Και αν λίγο ζημιωθούν από μία λύση, θα πάρουν ευλογία διπλή. Πολλοί όμως δεν το καταλαβαίνουν. Ούτε στην Θεία Λειτουργία πηγαίνουν. Η Θεία Λειτουργία αγιάζει. Αν δεν πάη ο Χριστιανός την Κυριακή στην Εκκλησία, πώς θα αγιασθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δυστυχώς όμως πάνε σιγά-σιγά  οι άνθρωποι να μην αφήσουν ούτε γιορτές ούτε τίποτε. Βλέπεις, ακόμη και τα ονόματα τα αλλάζουν, για να μη θυμούνται τους Αγίους τους. Το Βασιλική το κάνουν Βίκυ· το Ζωή, Ζωζώ, και έτσι λέει δυο φορές… «ζώο»! Έβαλαν την γιορτή της Μάνας, του Μάη, του Απρίλη… Σε λίγο θα πούν: «Σήμερα είναι η γιορτή της αγκινάρας, την άλλη του κυπαρισσιού, την άλλη τα γενέθλια αυτού που βρήκε την ατομική βόμβα ή το ποδόσφαιρο». Δεν αφήνει όμως ο Θεός…'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Η ορθόδοξη παράδοση
- type: h2
  initial:
    ru: ''
  text:
    ru: «Ιησούς Χριστός χθές και σήμερον ο αυτός και εις τους αιώνας»[173]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνά μιλούν για «ανανέωση στην Εκκλησία»· λές και η Εκκλησία γηράσκει και χρειάζεται ανανέωση!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γέρασε!... Μά και αυτοί ακόμη που δεν έχουν ευλάβεια αλλά λίγο μυαλό δεν αναπαύονται σ’ αυτά  τα νέα που φτιάχνουν τώρα και ψάχνουν να βρουν εκείνα τα αρχαία. Δεν τους συγκινούν λ.χ. οι νέες εικόνες· καταλαβαίνουν την αξία της παλιάς εικόνας. Αυτοί που έχουν λίγο μυαλό δηλαδή· πόσο μάλλον αυτοί που έχουν ευλάβεια! Από εκεί να καταλάβης πόσο λάθος είναι αυτά  που λένε για «ανανέωση»κ.λπ.!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα, αν κανείς προσπαθή να κρατήση λίγο την παράδοση, να τηρή τις νηστείες, να μη δουλεύη τις γιορτές, να είναι ευλαβής, λένε μερικοί: «Που βρίσκεται αυτός; Πάνε αυτά  τα πράγματα! Αυτά  ήταν για τότε!».Και αν τους πής τίποτε, θα σού πούν: «Σε ποιά εποχή ζής; Αυτά  δεν γίνονται τώρα!».Σιγά-σιγά  τα παίρνουν για παραμύθια. Τί λέει όμως; «Ιησούς Χριστός χθές και σήμερον ο αυτός και εις τους αιώνας». Τουλάχιστον, αν δεν μπορή κανείς να τα τηρήση, ας πή: «Θεέ μου, ήμαρτον!».Τότε ο Θεός θα τον ελεήση. Αλλά τώρα, ενώ έχει την αδυναμία του, πάει να επιβληθή στον άλλον, γιατί ελέγχεται. Πάρε έναν δαιμονισμένο και βάλ’ τον σε μία πνευματική ατμόσφαιρα. Θα δής, θα γυρίζη από ’δω-από ’κει· δεν θα μπορή να σταθή, γιατί θα ζορίζεται. Το ίδιο και αυτοί· ελέγχονται, ζορίζονται και πάνε να καταπατήσουν την συνείδησή τους, γι’ αυτό τα λένε αυτά. Και τις αξίες τις λένε κατεστημένο τώρα και πάνε να αντικαταστήσουν τις αξίες με αταξίες. Μεγάλη διαστροφή υπάρχει στον κόσμο! Την ομορφιά την πνευματική την θεωρούν ασχήμια. Η πνευματική ομορφιά δηλαδή για τους κοσμικούς είναι κοσμική ασχήμια. Νά, αν πάρης έναν καλόγερο τώρα και του κόψης τα μαλλιά του, πόσο άσχημος γίνεται! Αυτήν όμως την ασχήμια οι κοσμικοί την θεωρούν ομορφιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και βλέπεις, τώρα μάχονται την Εκκλησία, αγωνίζονται για την καταστροφή της. Καλά, να πούμε, δεν πιστεύουν, διδάσκουν την αθεΐα. Αλλά να μην αναγνωρίζουν το καλό που προσφέρει η Εκκλησία και να τα βάζουν με την Εκκλησία; Αυτό έχει πολλή κακότητα. Να μην αναγνωρίζουν π.χ. ότι η Εκκλησία προστατεύει τα παιδιά, τα βοηθάει να μη γίνουν αλητάκια, να γίνουν καλοί άνθρωποι; Αυτοί προωθούν τα παιδιά στο κακό· επιτρέπουν την καταστροφή των παιδιών ελεύθερα. Ενώ η Εκκλησία τί διδάσκει; «Να είναι ο νέος φρόνιμος, να σέβεται τους άλλους, να διατηρηθή αγνός, για να παρουσιασθή στην κοινωνία σωστός άνθρωπος». Αλλά τα πράγματα θα έρθουν πάλι στην θέση τους. Στην Ρωσία μία γιαγιά προσευχόταν γονατιστή μέσα στην Εκκλησία δίπλα σε μία κολόνα. Πάει μία νεαρή γυναίκα, που ήταν μεγάλη επιστήμων, και της λέει: «Αυτά  είναι ξεπερασμένα πράγματα». Της απαντάει η γιαγιά: «Σ’ αυτήν την κολόνα που προσεύχομαι και κλαίω τώρα εγώ, θα ’ρθης μετά να κλαίς εσύ. Τα δικά σας θα έρχωνται και θα περνούν, θα έρχωνται και θα περνούν, ενώ ο Χριστιανισμός δεν ξεπερνιέται ποτέ».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Σεβασμός στην παράδοση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλοί άγιοι Μάρτυρες, όταν δεν ήξεραν το δόγμα, έλεγαν: «Πιστεύω ό,τι θέσπισαν οι Άγιοι Πατέρες». Αν κάποιος το έλεγε αυτό, μαρτυρούσε. Δεν ήξερε δηλαδή να φέρη αποδείξεις στους διώκτες για την πίστη του και να τους πείση, αλλά είχε εμπιστοσύνη στους Αγίους Πατέρες. Σκεφτόταν; «Πώς να μην έχω εμπιστοσύνη στους Αγίους Πατέρες; Αυτοί ήταν και πιο έμπειροι και ενάρετοι και άγιοι. Πώς εγώ να δεχθώ μία ανοησία; Πώς να ανεχθώ να βρίζη ένας τους Άγιους Πατέρες;»Να έχουμε εμπιστοσύνη στην παράδοση. Σήμερα, δυστυχώς, μπήκε η ευρωπαϊκή ευγένεια και πάνε να δείξουν τον καλό. Θέλουν να δείξουν ανωτερότητα και τελικά πάνε να προσκυνήσουν τον διάβολο με τα δύο κέρατα. «Μία θρησκεία, σού λένε, να υπάρχη»καί τα ισοπεδώνουν όλα. Ήρθαν και σ’ εμένα μερικοί και μου είπαν: «Όσοι πιστεύουμε στον Χριστό, να κάνουμε μία θρησκεία». «Τώρα είναι σαν να μου λέτε, τους είπα, χρυσό και μακίρι, χρυσό τόσα καράτια και τόσα που τα ξεχώρισαν, να τα μαζέψουμε πάλι και να τα κάνουμε ένα. Είναι σωστό να τα ανακατέψουμε πάλι; Ρωτήστε έναν χρυσοχόο: «Κάνει να ανακατέψουμε την σαβούρα με τον χρυσό;»Έγινε τόσος αγώνας, για να λαμπικάρη το δόγμα». Οι Άγιοι Πατέρες κάτι ήξεραν και απαγόρευσαν τις σχέσεις με αιρετικό. Σήμερα λένε: «Όχι μόνο με αιρετικό αλλά και με ΒΟυδδιστή και με πυρολάτρη και με δαιμονολάτρη να συμπροσευχηθούμε. Πρέπει να βρίσκωνται στις συμπροσευχές τους και στα συνέδρια και οι Ορθόδοξοι. Είναι μία παρουσία». Τί παρουσία; Τα λύνουν όλα με την λογική και δικαιολογούν τα αδικαιολόγητα. Το ευρωπαϊκό πνεύμα νομίζει ότι και τα πνευματικά θέματα μπορούν να μπούν στην Κοινή Αγορά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικοί από τους Ορθοδόξους που έχουν ελαφρότητα και θέλουν να κάνουν προβολή, «Ιεραποστολή», συγκαλούν συνέδρια με ετεροδόξους, για να γίνεται ντόρος και νομίζουν ότι θα προβάλουν έτσι την Ορθοδοξία, με το γίνουν δηλαδή ταραμοσαλάτα με τους κακοδόξους. Αρχίζουν μετά οι υπέρ-ζηλωτές και πιάνουν το άλλο άκρο· λένε και βλασφημίες για τα Μυστήρια των Νεοημερολογιτών κ.λπ. και κατασκανδαλίζουν ψυχές που έχουν ευλάβεια και ορθόδοξη ευαισθησία. Οι ετερόδοξοι από την άλλη έρχονται στα συνέδρια, κάνουν τον δάσκαλο, παίρνουν ό,τι καλό υλικό πνευματικό βρίσκουν στους Ορθοδόξους, το περνάνε από το δικό τους εργαστήρι, βάζουν δικό τους χρώμα και φίρμα και το παρουσιάζουν σαν πρωτότυπο. Και ο παράξενος σημερινός κόσμος από κάτι τέτοια παράξενα συγκινείται, και καταστρέφεται μετά πνευματικά. Ο Κύριος όμως, όταν θα πρέπη, θα παρουσιάση τους Μάρκους τους Ευγενικούς και τους Γρηγορίους Παλαμάδες, που θα συγκεντρώσουν όλα τα κατασκανδαλισμένα αδέλφια μας, για να ομολογήσουν την ορθόδοξη πίστη και να στερεώσουν την παράδοση και να δώσουν χαρά μεγάλη στην Μητέρα μας Εκκλησία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εάν ζούσαμε πατερικά, θα είχαμε όλοι πνευματική υγεία, την οποία θα ζήλευαν και όλοι οι ετερόδοξοι, και θα άφηναν τις αρρωστημένες τους πλάνες και θα σώζονταν δίχως κήρυγμα. Τώρα δεν συγκινούνται από την αγία μας πατερική παράδοση, γιατί θέλουν να δούν και την πατερική μας συνέχεια, την πραγματική μας συγγένεια με τους Αγίους μας. Αυτό που επιβάλλεται σε κάθε Ορθόδοξο είναι να βάζη την καλή ανησυχία και στους ετερόδοξους, να καταλάβουν δηλαδή ότι βρίσκονται σε πλάνη, για να μην αναπαύουν ψεύτικα τον λογισμό τους, και στερηθούν και σ’ αυτήν την ζωή τις πλούσιες ευλογίες της Ορθοδοξίας και στην άλλη ζωή τις περισσότερες και αιώνιες ευλογίες του Θεού. Έρχονται εκεί στο Καλύβι μερικά παιδιά Καθολικά με πολύ καλή διάθεση, έτοιμα να γνωρίσουν την Ορθοδοξία. «Θέλουμε κάτι να μας πής, για να βοηθηθούμε πνευματικά», μου λένε. «Κοιτάξτε, τους λέω· πάρτε την Εκκλησιαστική Ιστορία και θα δήτε ότι κάποτε ήμασταν μαζί και μετά που φθάσατε. Αυτό πολύ θα σάς βοηθήση. Κάντε αυτό, και άλλη φορά θα συζητήσουμε πολλά».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιότερα σεβόταν κανείς κάτι, γιατί ήταν του παππού του, και το φύλαγε σαν κειμήλιο. Είχα γνωρίσει έναν πολύ καλό δικηγόρο. Το σπίτι του ήταν απλό και ξεκούραζε όχι μόνον αυτόν αλλά και τους επισκέπτες. Μου έλεγε κάποτε: «Πριν από λίγα χρόνια, Πάτερ, με κορόιδευαν οι γνωστοί μου για τα παλιά έπιπλα που έχω. Τώρα έρχονται και τα θαυμάζουν για αντίκες. Ενώ εγώ τα χρησιμοποιώ και τα χαίρομαι, γιατί μου θυμίζουν τον πατέρα μου, την μάνα μου, τους παππούδες, και συγκινούμαι, εκείνοι μαζεύουν διάφορα παλιά, κάνουν σαλόνια σαν παλιατζίδικα, για να ξεχνιούνται με αυτά  και να ξεχνούν κάπως το κοσμικό τους άγχος». Παλιά ένα τόσο δά φλουράκι το κρατούσε κανείς σαν μεγάλη περιουσία από την μάνα του, από τον παππού του. Σήμερα, αν έχη κάποιος από τον παππού του μία λίρα Γεωργίου λ.χ., και έχη εκατό δραχμές διαφορά με την λίρα Βικτωρίας, θα την δώση να την αλλάξη. Δεν εκτιμά, δεν υπολογίζει ούτε μάνα ούτε πατέρα. Μπαίνει αυτό το ευρωπαϊκό πνεύμα και σιγά-σιγά  μας παίρνει όλους σβάρνα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι, όταν πρωτοπήγα στο Άγιον Όρος, σε μία συνοδία Γέροντας ήταν ένα γεροντάκι που είχε πολλή ευλάβεια. Κρατούσε «πάππον προς πάππον»από ευλάβεια όχι μόνον τα καλυμμαύχια από τους «παππούδες»του, τους προκατόχους του, αλλά και τα καλούπια με τα οποία φτιάχνουν τα καλυμμαύχια. Είχε και βιβλία παλιά και διάφορα χειρόγραφα και τα φύλαγε τυλιγμένα όμορφα στην βιβλιοθήκη, που την είχε κλεισμένη καλά, για να μη σκονίζωνται. Εκείνα τα βιβλία δεν τα χρησιμοποιούσε· τα κρατούσε κλεισμένα. «Εγώ δεν είμαι άξιος να διαβάσω τέτοια βιβλία, έλεγε. Θα διαβάσω αυτά  τα απλά, το Γεροντικό, την Κλίμακα». Ήρθε μετά ένας νέος μοναχός –τελικά δεν έμεινε στο Όρος – και του λέει: «Τί μαζεύεις εδώ σαβούρα;»Πήρε τα καλούπια να τα πετάξη, να τα κάψη. Έκλαιγε το καημένο το γεροντάκι: «Αυτό είναι από τον παππού μου, έλεγε τί σε πειράζει; Έχουμε τόσα δωμάτια· ασ’ τα σε μία ακρούλα». Από την ευλάβεια που είχε, κρατούσε όχι μόνον τα βιβλία, τα κειμήλια, τα καλυμμαύχια, αλλά ακόμη και εκείνα τα καλούπια! Όταν υπάρχη σεβασμός στα μικρά, υπάρχει πολύς σεβασμός και στα μεγάλα. Όταν δεν υπάρχη σεβασμός στα μικρά, ούτε και στα μεγάλα υπάρχη. Έτσι διατηρούσαν την παράδοση οι Πατέρες.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να κρατούμε στον Μοναχισμό τα δοκιμασμένα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μία αδελφή είναι καινούργια σε ένα διακόνημα και βρίσκη μία ορισμένη τάξη, είναι σωστό να κάνη αλλαγές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, να μην κάνη εξ αρχής αλλαγές, ακόμη και αν είναι μόνη της. Το έκαναν αυτό νέες Αδελφότητες που πήγαν σε παλιά Μοναστήρια· δεν σεβάσθηκαν την πείρα των παλιών. Όταν πάη κανείς έτσι και κάνη δικά του προγράμματα και καταργή τα παλιά Τυπικά, την τάξη δηλαδή που υπήρχε παλιά, εκείνα τα δοκιμασμένα που βοηθούσαν στην καλογερική, όχι μόνο δεν έχει παράδοση, αλλά δεν έχει και σεβασμό στην παράδοση. Αργότερα όμως θα καταλάβουν πόσο χρήσιμα ήταν όλα αυτά  που άλλαξαν. Αυτοί που τα είχαν βάλει αυτά, κάτι ήξεραν. Ό,τι υπάρχει από παλιά στον Μοναχισμό είναι ζυγισμένο· είναι από πείρα. Βλέπεις, και σε μία τέχνη πρέπει να σέβεται κανείς τους κανόνες της. Από μαραγκός που ήμουν, ξέρω ότι ένα τραπέζι κανονικό έχει ογδόντα πόντους ύψος, το σκαλοπάτι είκοσι επτά πόντους πλάτος. Είναι δοκιμασμένα, κανονισμένα όλα αυτά, και πρέπει να τα ασπασθή ο μαθητής· δεν του χρειάζεται εξήγηση. Έχουν βγή από την πείρα και χρειάζεται εμπιστοσύνη στον τεχνίτη και σεβασμός στην πείρα του. Όποιος δεν σέβεται τους κανόνες της τέχνης δεν θα κάνη σωστή δουλειά· ή θα κάνη το τραπέζι κοντό ή θα το κάνη ψηλό κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Άλλαξα πολλά Καλύβια· είμαι… καυσοκαλυβίτης! Όσες φορές έκανα αλλαγές στις πόρτες, στα καρφιά, στο τέλος κατέληξα ότι όλα είχαν μπή με σκέψη. Γι’ αυτό τώρα, στην αρχή, και να δυσκολεύωμαι, δεν κάνω καμμιά αλλαγή. Δεν βγάζω ούτε ένα καρφί από τους τοίχους. Αν εγώ ο άπειρος τα ξεκαρφώσω, θα τα ξανακαρφώσω στην θέση που τα βρήκα και θα χαλάσω τους σοβάδες, γιατί ύστερα από δοκιμή τα κάρφωσε ο άλλος Πατέρας. Για να έχη λ.χ. ένα καρφί εκεί στον τοίχο, χρειάζεται να κρεμάσης μία φανέλλα, ένα ράσο. Σε ένα Κελλί που είχα πάει[174], σε κάθε γωνία είχε και από ένα μπαστούνι χοντρό και γυριστό. Τα έπαιρνα και τα έδινα στον κόσμο. Μετά κατάλαβα ότι τα είχε ο προηγούμενος Πατέρας, γιατί υπήρχαν πολλά φίδια εκεί, για να μην τρέχη και ψάχνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το πιο σπουδαίο είναι να κρατάτε αυτά  που είναι δοκιμασμένα. Διαφορετικά, φεύγει η παράδοση και μένει η παράβαση. Τί θα πη παράδοση, τί θα πη παράβαση! Πόσο διαφέρει το ένα από το άλλο! Την παράβαση να την κάνουμε παράδοση; Σήμερα μερικά Μοναστήρια κάνουν ό,τι τους βολεύει και το θεωρούν ότι είναι παραδοσιακό, και αντί να είναι παραδοσιακά γίνονται… παραβασιακά. Πώς θα έρθη μετά η διάκριση η πνευματική, αν δεν υπάρχη η πνευματική ευαισθησία; Βλέπετε, στον Μοναχισμό χρειάζεται άλλη γραμμή· ούτε η στρατιωτική ούτε η «κινησιακή»ούτε η συνεταιριστική, αλλά η μοναχική, η δοκιμασμένη, η οποία έχει τον χαρακτήρα της πατερικής γραμμής. Μπορεί να λέγεται καμμιά φορά «πατερική γραμμή»καί η άλλη ψευτοθεωρητική μοναχική γραμμή, η οποία όμως δεν έχει καμμιά εσωτερική σχέση με τον Μοναχισμό και τους Πατέρες, αλλά την λένε έτσι, απλώς γιατί διάβασαν τους Πατέρες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικά νέα Μοναστήρια λειτουργούν σήμερα σαν Ιδρύματα. Είναι βέβαια κάπως δικαιολογημένα, γιατί δεν βρήκαν μαγιά. Μπορούσαν όμως να ρωτήσουν παλιά Μοναστήρια. Μετά την Τουρκοκρατία, όταν ξεκίνησαν ξανά τα πρώτα Μοναστήρια, δεν υπήρχε μαγιά πνευματική. Οι Βαυαροί πήγαιναν να διαλύσουν τα Μοναστήρια που υπήρχαν και να πάρουν τις περιουσίες. Μέχρι και διαταγή έβγαλαν ακόμη και να παντρεύωνται οι μοναχοί, για να τα διαλύσουν! Από την άλλη μεριά οι δικοί μας δεν πήγαν να ψάξουν, να δούν πώς ήταν ο Μοναχισμός παλιά και να γυρίσουν στην παράδοση. Έβλεπαν ότι τα Μοναστήρια είχαν αγελάδες, μοσχάρια, γουρούνια, γιατί, επί Τουρκοκρατίας, όσοι είχαν περιουσίες, ζώα κ.λπ., τα έδιναν, οι καημένοι, στα Μοναστήρια, για να μην τις πάρουν οι Τούρκοι. Στα Μοναστήρια πήγαινε κόσμος άρρωστος, σακατεμένος και έτρωγε ψωμί. Τάιζαν και αυτούς, τάιζαν και την φτώχεια. Όλοι οι πονεμένοι θα πήγαιναν στα Μοναστήρια. Τότε δεν υπήρχαν Ιδρύματα, όποτε οι μοναχοί αναγκάζονταν να ασχολούνται και με τα ζώα, για να βοηθούν τον κόσμο. Αργότερα, όταν πια δεν υπήρχε ο λόγος αυτός, συνέχισαν να έχουν μοσχάρια, αγελάδες, πρόβατα, κτηνοτροφία, όποτε πολλοί πνευματικοί άνθρωποι εκείνης της εποχής είπαν: «Νά, αυτός είναι ο δικός μας Μοναχισμός!».καί πήγαν να πάρουν από τους Δυτικούς τον δικό τους Μοναχισμό με τις Ιεραποστολές τους, να πάρουν όλα τα δυτικά. Δεν γύρισαν πίσω στην δική μας παράδοση να δούν τί συνέβη και να σκεφθούν: «Καλά, έμειναν αυτά  από την Τουρκοκρατία. Τότε δεν μπορούσαν να ζήσουν μοναχικά, όπως έπρεπε. Είναι μία αρρώστια από την παλιά κατάσταση. Τώρα πρέπει να γυρίσουμε πάλι στην παράδοση». Αλλά αυτοί δεν γύρισαν στην δική μας παράδοση· γύρισαν στην κατάσταση των Δυτικών! Πήραν τα πρότυπα από εκεί, για να τα εφαρμόσουν εδώ. Αυτό είναι το σφάλμα τους, που δεν γύρισαν στην παράδοση. Βλέπεις, οι Τούρκοι σέβονταν τα βακούφια, γιατί από τους Αγίους μας και οι ίδιοι πολλές φορές έβλεπαν θαύματα, και από τα Μοναστήρια ζητούσαν την θεία βοήθεια και όχι φιλοξενία.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Πάλι θα γυρίσουν στα παλιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αργότερα οι άνθρωποι θα εκτιμήσουν που κρατούν οι Χριστιανοί σήμερα την τιμή, την πίστη και όλο το μεγαλείο της Εκκλησίας. Και να δήτε, θα γυρίσουν πάλι στα παλιά. Όπως έγινε και με την αγιογραφία· μία εποχή δεν μπορούσαν να καταλάβουν την βυζαντινή τέχνη και χτυπούσαν τις τοιχογραφίες με το σκεπάρνι, για να ρίξουν τον παλιό σοβά και να τον ξαναφτιάξουν, για να αγιογραφήσουν άλλες εικόνες, της Αναγεννήσεως. Τώρα, μετά από τόσα χρόνια, αναγνώρισαν την αξία της βυζαντινής τέχνης. Μάλιστα πολλοί που δεν έχουν και ευλάβεια, ακόμη και άθεοι, πάνε σιγά-σιγά  και ξεσκεπάζουν τις παλιές τοιχογραφίες που έχουν σκεπαρνιές. Έτσι και όλα αυτά  που πετούν τώρα για άχρηστα σιγά-σιγά  θα τα αναζητήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπεις και με την βυζαντινή μουσική πώς τα πράγματα έρχονται στην θέση τους; Μικρά παιδιά έχουν μάθει βυζαντινή μουσική. Παλιότερα δύσκολα εύρισκες έναν που να ήξερε βυζαντινή μουσική. Τώρα μικρά παιδιά ξέρουν, και οι άλλοι προβληματίζονται μετά. Και τί γλυκά «γυρίσματα»[175]έχει η βυζαντινή μουσική! Ιδίως τα καθαρά βυζαντινά έχουν διάφορα όμορφα, γλυκά γυρίσματα. Άλλα λεπτά σαν το αηδόνι, άλλα σαν απαλό κυματάκι, άλλα δίνουν μία μεγαλοπρέπεια. Όλα αποδίδουν, τονίζουν τα θεία νοήματα. Όμως σπάνια να ακούσης αυτά  τα όμορφα γυρίσματα. Οι περισσότεροι που ψέλνουν τα λένε λειψά, κουτσουρεμένα, καλουπωμένα. Αφήνουν κενά, τρύπες! Και το κυριώτερο, τα λένε χωρίς τόνο. Απορώ· δεν έχουν οξείες αυτά  τα βιβλία τους; Σαν την σημερινή γραμματική είναι χωρίς τόνους, χωρίς οξείες; Τελείως ρηχά τα λένε. Όλα τα πάνε ίσια, λές και πέρασε οδοστρωτήρας και τα ισοπέδωσε όλα! «Πά-νή-ζώ, πά-νή-ζώ»[176], πανίζουν-πανίζουν τον φούρνο και ψωμί δεν βγάζουν! Άλλοι πάλι τονίζουν χωρίς καρδιά και τσιρίζουν. Άλλοι τα τονίζουν όλα δυνατά, τα λένε και όλα ίσια, όλα καρφωτά, και νομίζεις χτυπούν καρφιά με το σκεπάρνι. Ναί, αλήθεια, ή τελείως άτονα ή σκληρά! Δεν σε ξεσηκώνουν εσωτερικά· δεν σε αλλοιώνουν. Ενώ πόσο γλυκειά είναι η καθαρή βυζαντινή μουσική! Ειρηνεύει, μαλακώνει την ψυχή. Η σωστή ψαλμωδία είναι το ξεχείλισμα της εσωτερικής πνευματικής καταστάσεως. Είναι θεία ευφροσύνη! Δηλαδή ευφραίνεται η καρδιά από τον Χριστό και με καρδιά ευφροσύνη μιλάει ο άνθρωπος στον Θεό. Όταν συμμετέχη κανείς σ’ αυτό που ψάλλει, τότε αλλοιώνεται, με την καλή έννοια, και ο ίδιος και οι άλλοι που τον ακούνε. Πριν από χρόνια κάποιος παλιός ψάλτης πήγε στο Άγιον Όρος και έγινε ρεζίλι. Οι Πατέρες έψελναν παραδοσιακά. Τον πήραν και αυτόν μαζί τους να ψάλη, αλλά αυτός δεν έκανε τα «γυρίσματα», γιατί δεν τα ήξερε. Οι Αγιορείτες τα είχαν από παράδοση. Μετά προβληματίσθηκε και αυτός και μερικοί άλλοι. Μπήκε η καλή ανησυχία, έψαξαν, διάβασαν, άκουσαν παλιούς παραδοσιακούς ψάλτες και βρήκαν τα «γυρίσματα»πού είχαν οι παλιοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και οι Τούρκοι την μουσική την πήραν από το Βυζάντιο, όταν ήρθαν στην Μικρά Ασία. Γι’ αυτό οι τουρκικοί αμανέδες, κατά κάποιο τρόπο, συγκινούν, και λέει ο λαός: «Τουρκικά να τραγουδάς, γαλλικά να μιλάς και ελληνικά να γράφης». Όχι ότι όλοι οι Τούρκοι έχουν καλή φωνή, αλλά, ακόμη και όσοι δεν έχουν, τραγουδούν με καημό, με μεράκι. Μερικοί δικοί μας δεν ξέρουν ότι οι αμανέδες είναι βυζαντινοί και λένε πώς εμείς πήραμε την βυζαντινή μουσική από τους Τούρκους! Μά οι Τούρκοι, όταν ήρθαν από τα βάθη της Ασίας, δεν είχαν ούτε μουσική ούτε άλλο τίποτε και πήραν τον ήχο από την βυζαντινή μουσική.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι Καθολικοί πώς αναπαύονται στο αρμόνιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί; «Εκλαΐκευση», σού λένε! Εσύ θυμάσαι εκείνες τις καθολικές καλογριές στην Γαλλία, που έψαλλαν στην Ανάσταση το «Χριστός ανέστη»καί χόρευαν σύγχρονο χορό με μία εικόνα; Έκαναν… Πάσχα! Την εικόνα την κρατούσε η Γερόντισσά τους! Αλλοίωση, αλλοίωση, και δές που έφθασαν. Άκουσα μία φορά έναν νέο μοναχό που έψαλλε μία Δοξολογία λίγο παράξενη. «Καλά, είπα μέσα μου, τί είναι αυτό που λέει;»Τον ρωτάω μετά: «Τίνος είναι αυτή η Δοξολογία;»«Του Πέτρου Πελοποννησίου, μου λέει, αλλά την διόρθωσα». «Την διόρθωσες;»τού λέω. «Καλά, μου λέει, δεν έχω και εγώ το δικαίωμα να διορθώσω;»«Να φτιάξης μία δική σου Δοξολογία, άμα θέλης· όχι να χαλάσης την άλλη». Πήγε και έκανε αλλαγές και μετά θα έλεγε: «Αγιορείτικο είναι». χρειάζεται πολλή προσοχή. Να μην αλλοιώση κανείς αυτά  τα παλιά. Άμα θέλη, ας φτιάξη κάτι δικό του και ας βάλη και το όνομά του· έχει δικαίωμα. Αλλά να παίρνη και να αλλοιώνη τα παλιά, είναι ανευλάβεια. Σαν ένας που δεν ξέρει αγιογραφία να πάη να διορθώση μία παλιά εικόνα. Άμα θέλη, ας φτιάξη μία εικόνα δική του, όχι να καταστρέψη μία άλλη εικόνα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Χωρίς πίστη δεν μπορεί να σταθή ο κόσμος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πήγαιναν να καταργήσουν την θρησκεία, γιατί νόμιζαν ότι η θρησκεία δημιουργεί προβλήματα. Τώρα σιγά-σιγά  βλέπουν ότι ο άνθρωπος, όταν δεν πιστεύη, δεν έχει φρένο και γίνεται θηρίο· δεν μπορεί να σταθή χωρίς ιδανικά. Ένας δημοσιογράφος πήγε σε έναν παλιό πολιτικό, κομμουνιστή, και τον ρώτησε: «Τί πρέπει να προσέξουν οι σημερινοί πολιτικοί για να πετύχουν και τί για να μην αποτύχουν;»Και εκείνος του απάντησε: «Εμείς αποτύχαμε, γιατί τα βάλαμε με την Εκκλησία». Οι κομμουνιστές δηλαδή που δεν πιστεύουν, που δεν έχουν ούτε υλικό ενδιαφέρον ούτε πνευματικό ανέβασμα, κατάλαβαν ότι με τον Θεό δεν μπορούν να τα βάλουν. Τώρα[177]στην Σερβία άρχισαν να χτίζουν Ναούς σε μερικά μέρη. Είδαν μετά από στατιστική ότι όπου υπάρχει Εκκλησία υπάρχουν λιγώτεροι ψυχοπαθείς, γίνονται λιγώτερα εγκλήματα κ.λπ. Δεν πιστεύουν, αλλά, για να μη δίνουν ψυχοφάρμακα, κάνουν Ναούς. Αφού και ο Τσαουσέσκου, παρ’ όλο που ήταν «τσαούσης του αίσχους», παρ’ όλο που έλεγε ότι ο Χριστιανισμός είναι το όπιο του λαού κ.λπ., αλλά έλεγε κιόλας ότι οι Χριστιανοί είναι καλοί άνθρωποι. Γιατί, όσοι πίστευαν, είχαν φρένο· δεν έκαναν αταξίες. Ενώ οι άλλοι που δεν πίστευαν, τα έκαναν γυαλιά-καρφιά. Πόσους Αγίους θα έχουμε από την Ρωσία! Τώρα τα βάζουν με τον Κομμουνισμό. Και οι άλλοι πώς πάνε να τα δικαιολογήσουν όλα! «Ο Λένιν και ο Μάρξ, λένε, συμφωνούσαν με τον Χριστό, αλλά δεν είχαν καταλάβει το πνεύμα Του, γι’ αυτό έκαναν εγκλήματα κ.λπ.». Και αυτό, γιατί έχουν ξεσηκωθή οι Χριστιανοί: «Θέλουμε να επανέλθουμε στην παλιά μας παράδοση, στην θρησκεία μας». Και επειδή δεν μπορούν να συγκρατήσουν τώρα τον κόσμο, λένε και αυτοί: «Να επανέλθουμε στην παλιά μας παράδοση»! Γιατί όλα αυτά  που έκαναν στην Επανάσταση τα έκαναν, γιατί τάχα δεν είχαν καταλάβει το πνεύμα του Χριστού!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θα έρθη η ώρα που και οι άπιστοι άρχοντες, όχι μόνον οι πιστοί, θα καταλάβουν ότι, αν δεν υπάρχη πίστη, δεν μπορεί να σταθή ο κόσμος, και θα επιβάλουν κάπου να πιστεύουν, για να κρατούν τον κόσμο. Μετά από χρόνια, μία μέρα αν δεν κάνης προσευχή, θα σε κλείνουν φυλακή! Θα δίνης λογαριασμό στον άρχοντα αν προσευχήθηκες ή όχι!... Θα έρθουν έτσι τα πράγματα στην θέση τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αφήσουμε μία καλή παράδοση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς μερικά μέρη, Γέροντα, έχουν καλούς ανθρώπους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Υπάρχουν καλοί άνθρωποι, άφησαν μία καλή σειρά και τώρα συνεχίζεται μία καλή παράδοση. Δεν είναι ότι το χώμα βγάζει καλούς ανθρώπους! Όταν ένας τόπος έχη καλή παράδοση ή κακή παράδοση, αυτό συνεχίζεται. Εκεί στην Ήπειρο ήταν κάποιο χωριό, κοντά στα αλβανικά σύνορα, που οι κάτοικοί του πήγαιναν στον Εσπερινό, στην Θεία Λειτουργία, όποτε είχε, ακόμη και στο Απόδειπνο. Και –πώς να πη κανείς; – ζούσαν τον Παράδεισο και από αυτήν την ζωή, θα πάνε και στον Παράδεισο στην άλλη ζωή. Αυτοί βοήθησαν τον εαυτό τους, βοήθησαν και την άλλη γενιά, και δημιούργησαν μία καλή συνέχεια. Και όταν οι απόγονοι βρεθούν σε μία παράδοση καλή, συνεχίζεται μία παράδοση καλή. Στο διπλανό ακριβώς χωριό όλοι έκλεβαν. Έναν παπά έβγαλε το χωριό αυτό, και αυτός έκλεβε εικόνες από την Εκκλησία! Όχι ότι σ’ αυτό το χωριό ήταν το χώμα τέτοιο, αλλά οι άνθρωποι εκεί είχαν αυτήν την κακή συνήθεια. Άφησαν έτσι μία κακή σειρά, και αυτή η παράδοση η κακή συνεχίζεται. Θέλει πολλή δουλειά, για να έρθη εκεί μία καλή παράδοση. Και βλέπεις, όταν κάποιος είναι κακός, προσπαθούν να αποδείξουν όλοι πώς δεν είναι από τον τόπο τους· ψάχνουν για την καταγωγή του. Όταν είναι κάποιος άγιος, κοιτάνε ποιός θα προλάβη να τον κάνη δικό του! Σαν τον Άγιο Κοσμά τον Αιτωλό· ενώ είναι Στερεοελλαδίτης, τον έβαλαν στους Ηπειρώτες Αγίους, επειδή ο πατέρας του ήταν από τα Γραμμενοχώρια της Ηπείρου· ήθελε-δέν ήθελε ο Άγιος!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γνώρισα έναν οικογενειάρχη πού, όταν μιλούσε, κουνούσε το δάκτυλό του συνέχεια και νευρικά. Μετά και τα παιδιά του, όταν μιλούσαν, κουνούσαν και εκείνα το δάκτυλό τους! Γιατί τα παιδιά παίρνουν όλες τις συνήθειες του πατέρα. Τις αντιγράφουν ακριβώς. Ο σκοπός όμως είναι να παίρνη κανείς μόνον το καλό, γιατί διαφορετικά θα διαιωνίζεται το κακό. Θυμάμαι έναν που πήγε σε ένα ιδιόρρυθμο Μοναστήρι, αλλά δεν αναπαυόταν. Του λέει ο Γέροντάς του: «Κάθησε, τέκνον μου, θα αλλάξουν τα πράγματα». Και το «τέκνον»τού του λέει: «Γέροντα, πώς θ’ αλλάξουν τα πράγματα; Ο υποτακτικός του Γερό-τάδε είναι ακριβώς όπως ο Γερό-τάδε. Ο υποτακτικός του τάδε είναι ακριβώς όπως εκείνος. Όποτε πώς θ’ αλλάξουν τα πράγματα;»Όταν υπάρχη ένα παλιό κακό σε ένα Μοναστήρι ή σε μία συνοδία και οι υποτακτικοί δεν έχουν την καλή ανησυχία και αντιγράφουν ό,τι βρούν, τότε διαιωνίζεται μία κατάσταση κακή. Ενώ, όταν υπάρχη η καλή ανησυχία στους υποτακτικούς, τότε μπορεί να αλλάξη μία κακή κατάσταση και να γίνη καλή. Έτσι μπορεί να διαιωνισθή και το καλό και το κακό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτό που έχω καταλάβει, είναι ότι όλα αυτά  που έχουμε τώρα, είτε Πατερικά είτε Τυπικά, είναι κουκολόι· δηλαδή σαν μερικά απομεινάρια που μένουν μετά τον τρύγο. Γι’ αυτό πρέπει να προσέξουμε να κρατηθή λίγη μαγιά. Έχουμε χρέος σαν Χριστιανοί και δεν έχουμε δικαίωμα να αφήσουμε μία κακή παράδοση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πριν από λίγα χρόνια[178]μαζεύτηκαν στην Γενεύη θεολόγοι, καθηγητές Πανεπιστημίου κ.λπ. και έκαναν Προσύνοδο. Είπαν να καταργήσουν την νηστεία των Χριστουγέννων και των Αγίων Αποστόλων και από την νηστεία της Μεγάλης Σαρακοστής να κόψουν κάνα-δυό εβδομάδες, αφού ο κόσμος δεν τις κρατάει. Πήγαν και καθηγητές από ’δω. Τόσο πολύ αγανάκτησα, όταν ήρθαν και μου το είπαν, που έβαλα τις φωνές: «Δεν καταλαβαίνετε τί κάνετε; Αν ένας είναι άρρωστος, δικαιούται να φάη· δεν έχει κανόνα. Αν ένας δεν είναι άρρωστος, αλλά από αδυναμία έφαγε, να πή: «Θεέ μου, να με συγχωρέσης», να ταπεινωθή, να πη ένα «ήμαρτον». Δεν θα τον κρεμάση ο Χριστός. Αν όμως δεν είναι άρρωστος, τότε να κρατήση την νηστεία. Ο αδιάφορος πάλι τρώει και δεν τον νοιάζει. Όποτε το πράγμα πάει κανονικά. Αν οι περισσότεροι δεν κρατούν τις νηστείες, και μάλιστα χωρίς σοβαρό λόγο, και πάμε να αναπαύσουμε τους περισσότερους και να τις καταργήσουμε, που να ξέρουμε πώς θα είναι η άλλη γενιά; Μπορεί να είναι πιο καλή και να μπορή να κρατήση τέτοια ακρίβεια! Με ποιό δικαίωμα να τα καταργήσουμε όλα αυτά, αφού το πράγμα είναι απλό;»Οι Δυτικοί έχουν μία ώρα νηστεία πριν από την Θεία Κοινωνία. Θα πάμε κι εμείς με αυτό το πνεύμα; Να ευλογούμε τις αδυναμίες μας, τις πτώσεις μας; Δεν έχουμε δικαίωμα για τις αδυναμίες μας να κάνουμε έναν Χριστιανισμό στα μέτρα μας. Και λίγοι να είναι που μπορούν, πρέπει γι’ αυτούς να κρατηθή η τάξη. Ο άρρωστος, αν βρίσκεται σε ξένο περιβάλλον, να φάη χωρίς να τον δούν οι άλλοι, και σκανδαλισθούν. Ας πάρη λ.χ. το γιαούρτι να το φάη στο σπίτι του. Μου είπε ένας: «Αυτό είναι υποκρισία». «Γιατί δεν πάς, του λέω, να αμαρτήσης στην πλατεία, για να είσαι πιο ειλικρινής;»Πώς τους τα παρουσιάζει ο διάβολος! Κάνουμε μία Ορθοδοξία δική μας και ερμηνεύουμε έτσι και τα Πατερικά και το Ευαγγέλιο! Στην εποχή μας που υπάρχουν τόσοι μορφωμένοι έπρεπε να λάμπη η Ορθοδοξία. Εδώ ένας Άγιος Νικόδημος Αγιορείτης τί έκανε! πόσους λόγους έγραψε, πόσα βιβλία, όλα τα Συναξάρια· όλες τις βιβλιοθήκες απ’ έξω τις ήξερε! Ούτε φωτοτυπικό είχε ούτε κομπιούτερ!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όσο μπορεί κανείς να γίνη σωστός Χριστιανός. Τότε θα έχη πνευματικό αισθητήριο. Λίγο-πολύ θα πονάη και την Ορθοδοξία και την Πατρίδα του και θα αισθάνεται και την υποχρέωση που έχει ως Έλληνας. Όποτε από εκεί και πέρα, αν μάθη κάτι, ενδιαφέρεται, ανησυχεί, προσεύχεται. Αλλά αν πρέπη να του λένε: «Τώρα να ενδιαφερθής γι’ αυτό, ύστερα να ενδιαφερθής για εκείνο», θα είναι σαν μία τετράγωνη ρόδα που θέλει συνέχεια σπρώξιμο, για να προχωρήση. Σκοπός είναι να σπρώχνεται από μέσα ο άνθρωπος. Τότε θα κυλάη όμορφα σαν στρόγγυλη ρόδα. Και αν γίνη σωστός Χριστιανός κανείς, σπρώχνεται από μέσα και μετά τον πληροφορεί ο Θεός πιο πολύ και από αυτόν που διαβάζει, και για περισσότερα πράγματα. Γνωρίζει όχι μόνον αυτά  που γράφουν, αλλά και αυτά  που σκέφτονται να γράψουν. Καταλάβατε; Έρχεται ο θείος φωτισμός και όλες οι ενέργειές του είναι φωτισμένες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τέτοια κληρονομικά που μας έχει αφήσει ο Χριστός δεν έχουμε δικαίωμα να την εξαφανίσουμε στις μέρες μας. Θα δώσουμε λόγο στον Θεό. Εμείς, το μικρό αυτό έθνος, πιστέψαμε στον Μεσσία, μας δόθηκε η ευλογία να διαφωτίσουμε όλον τον κόσμο. Η Παλαιά Διαθήκη μεταφράσθηκε στην ελληνική γλώσσα εκατό χρόνια πριν από την έλευση του Χριστού. Οι πρώτοι Χριστιανοί τί τράβηξαν! κινδύνευε συνέχεια η ζωή τους. Τώρα τί αδιαφορία υπάρχει!... Ενώ ανώδυνα σήμερα, χωρίς να κινδυνεύη η ζωή μας, μπορούμε να διαφωτίσουμε τα έθνη, να γινώμαστε πιο αδιάφοροι; Αν σήμερα έχουμε λιγάκι ειρήνη, ξέρεις τί έχουν τραβήξει οι παλιοί; Ξέρεις πόσοι θυσιάσθηκαν; Τώρα τίποτε δεν θα είχαμε, αν δεν θυσιάζονταν εκείνοι. Και κάνω μία σύγκριση· πώς τότε, ενώ κινδύνευε η ζωή τους, κρατούσαν την πίστη τους, και πώς τώρα, χωρίς καμμιά πίεση, όλα τα ισοπεδώνουν! Όσοι δεν έχουν χάσει την εθνική τους ελευθερία, δεν καταλαβαίνουν. Τους λέω: «Ο Θεός να φυλάξη να μην έρθουν οι βάρβαροι και μας ατιμάσουν!».καί μου λένε: «Και τί θα πάθουμε;» Ακούς κουβέντα; Άντε να λείψετε, χαμένοι άνθρωποι! Τέτοιοι είναι οι άνθρωποι σήμερα. Δωσ’ τους χρήματα, αυτοκίνητα, και δεν νοιάζονται ούτε για την πίστη ούτε για την τιμή ούτε για την ελευθερία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Την Ορθοδοξία μας σαν Έλληνες την οφείλουμε στον Χριστό και τους αγίους Μάρτυρες και Πατέρες της Εκκλησίας μας· και την ελευθερία μας την οφείλουμε στους ήρωες της Πατρίδας μας, που έχυσαν το αίμα τους για μας. Αυτήν την αγία κληρονομιά οφείλουμε να την τιμήσουμε και να την διατηρήσουμε και όχι να την εξαφανίσουμε στις μέρες μας. Είναι κρίμα να χαθή ένα τέτοιο έθνος! Και βλέπουμε τώρα, όπως πριν αρχίση ένας πόλεμος στέλνουν ατομικές προσκλήσεις, έτσι και ο Θεός με ατομικές προσκλήσεις μαζεύει ανθρώπους, για να κρατηθή κάτι και να σωθή το πλάσμα Του. Δεν θα αφήση ο Θεός, αλλά πρέπει και εμείς να κάνουμε ό,τι μπορούμε ανθρωπίνως και για ό,τι δεν μπορούμε να κάνουμε ανθρωπίνως, να κάνουμε προσευχή να βοηθήση ο Θεός.
