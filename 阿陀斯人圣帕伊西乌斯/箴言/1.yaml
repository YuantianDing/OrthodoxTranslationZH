  '132': . Στον βίο του Όσιου Μαρτινιανού (η μνήμη του εορτάζεται στις 13 Φεβρουαρίου) αναφέρεται ότι, όταν ασκήτευε σε έναν βράχο μέσα στην θάλασσα, πλησίασε σ΄ αυτόν επάνω σε μία σχεδία μία κοπέλα, η οποία είχε ναυαγήσει και παρακαλούσε τον Άγιο να την σώση από την θάλασσα. Ο Όσιος αναγκάσθηκε να την τραβήξη έξω από το νερό καί, αφού προσευχήθηκε, πήδηξε στην θάλασσα. Αλλά από θεία Πρόνοια ήλθαν δελφίνια, τον πήραν επάνω τους και τον έβγαλαν στην στεριά.
  '133': . Ο στρατιώτης ήταν ο ίδιος ο Γέροντας. Το περιστατικό συνέβη, όταν υπηρετούσε την θητεία του, στον ανταρτοπόλεμο.
