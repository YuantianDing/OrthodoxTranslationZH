  '93': . Η Ερημίτις Φωτεινή γεννήθηκε στις 7 Ιανουαρίου 1860 στην Δαμασκό της Συρίας από Έλληνες γονείς. Το 1884 περίπου ανεχώρησε για την έρημο πέρα από τον Ιορδάνη ποταμό. Το 1915, εξ αιτίας του Ά' Παγκοσμίου Πολέμου, αναγκάσθηκε να πάη στα Ιεροσόλυμα, όπου έμεινε μέχρι το τέλος του πολέμου. Στην συνέχεια πήγε στην δυτική έρημό της Νεκράς Θάλασσας, όπου και ασκήτεψε μέχρι τον θάνατό της. (Βλ. Αρχιμ. Ιωακείμ Σπετσιέρη, Η Ερημίτις Φωτεινή, Ι. Καλύβη Άγ. Αναργύρων, Νέα Σκήτη, Άγ. Όρος 1994).
