  '117': . Όταν ο Γέροντας αναφέρεται στην λογική και την μέμφεται, δεν εννοεί το χάρισμα με το οποίο ο Θεός τίμησε τον άνθρωπο, αλλά τον ορθολογισμό ή, όπως λέει ο ίδιος, τον «βλαμμένο λόγο», τον απογυμνωμένο από την πίστη στον Θεό, ο οποίος αρνείται την θεία Πρόνοια και αποκλείει το θαύμα.
  '118': . Το ψυχιατρικό νοσοκομείο της Θεσσαλονίκης.
  '119': . Συλλογή εξήντα δύο υμνολογικών κανόνων προς την Υπεραγία Θεοτόκο, οι οποίοι μελουργήθηκαν από είκοσι δύο μελωδούς. Εκδόθηκε από τον Άγιο Νικόδημο τον Αγιορείτη (1796), ο οποίος με πολλή επιμέλεια συγκένρτρωσε τους κανόνες αυτούς από χειρόγραφά του Αγίου Όρους.
  '120': '. Είχαν ρωτήσει τον Αββά Αρσένιο μερικοί Γέροντες: «Γιατί δεν αλλάζεις το νερό, αφού μυρίζει;», και εκείνος απάντησε: «Αντί για τα αρώματα που απήλαυσα στον κόσμο, πρέπει να υποφέρω αυτήν την μυρωδιά». (Βλ.Το Γεροντικόν, Αββάς Αρσένιος ιη΄, σ. 6).'
