  '175': 'Γρεντές: Δοκάρι ξύλινο.'
  '176': 'Τσατμᾶς (λέξη τουρκική): Λεπτὸς τοῖχος κατασκευασμένος μὲ δοκούς, τῶν ὁποίων τὰ διάκενα συμπληρώνονται μὲ πλίνθους ἢ ξύλινους πήχεις καὶ ἐπικαλύπτονται μὲ ἀσβεστοκονίαμα. Ὁ Γέροντας μεταφορικὰ ὀνομάζει ἔτσι τὸν θώρακα μὲ τὰ πλευρά.'
