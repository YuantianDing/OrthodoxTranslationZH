  text:
    ru: Слова. Том 6. О молитве.Λόγοι ΣΤ' – Περὶ Προσευχῆς
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρόλογος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στοὺς πέντε προηγούμενους τόμους τῆς σειρᾶς «Λόγοι Γέροντος Παϊσίου» ὑπάρχουν ἀρκετὲς ἀναφορὲς στὴν προσευχή, ἀφοῦ ὁ Γέροντας, ὡς μοναχὸς«καθ᾽ ὅλην τὴν ἐντέλειαν», κύριο ἔργο του εἶχε τὴν προσευχή. Ἀλλὰ καὶ στὴν ἐπικοινωνία του μὲ τοὺς ἀνθρώπους, μοναχοὺς καὶ λαϊκούς, ἐπεδίωκε πάντοτε νὰ τοὺς βοηθήση νὰ ἐμπιστεύωνται τὴν ζωή τους στὸν Θεὸ μέσῳ τῆς προσευχῆς. Στὸν τόμο αὐτόν, ὁ ὁποῖος ἐκδίδεται μὲ τὴν εὐλογία τοῦ Ποιμενάρχου μας, Σεβασμιωτάτου Μητροπολίτου Κασσανδρείας κ. Νικοδήμου, περιλαμβάνονται λόγοι τοῦ Γέροντος Παϊσίου εἰδικὰ γιὰ τὴν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ τὸν Γέροντα Παΐσιο ἡ προσευχὴ εἶναι ἡ μεγάλη δυνατότητα ποὺ μᾶς ἔδωσε ὁ Θεὸς νὰ ἐπικοινωνοῦμε μαζί Του, γιὰ νὰ ζητοῦμε τὴν βοήθειά Του. Ὁ Γέροντας πονοῦσε, ὅταν ἔβλεπε τοὺς ἀνθρώπους νὰ ταλαιπωροῦνται ἀγωνιζόμενοι«μὲ τὶς λιγοστὲς ἀνθρώπινες δυνάμεις τους», ἐνῶ θὰ μποροῦσαν νὰ ζητήσουν τὴν βοήθεια τοῦ Θεοῦ, ὁ Ὁποῖος«μπορεῖ νὰ στείλη ὄχι ἁπλῶς δύναμη θεία, ἀλλὰ πολλὲς δυνάμεις θεῖες· καὶ τότε ἡ βοήθειά Του δὲν θὰ λέγεται θεία βοήθεια μόνον, ἀλλὰ[//10]θαῦμα Θεοῦ».Γι’ αὐτὸ ἐπέμενε ὅτι πρέπει νὰ νιώσουμε τὴν προσευχὴ ὡς ἀνάγκη καὶ προσπαθοῦσε νὰ βοηθήση ὅσους δὲν εἶχαν μάθει νὰ προσεύχωνται,«νὰ βάλουν ἀρχή, γιὰ νὰ πάρη μπρὸς ἡ καρδιά τους στὴν προσευχή». Ὅσους πάλι εἶχαν ἀποκτήσει τὴν καλὴ συνήθεια τῆς προσευχῆς, τοὺς ἐνίσχυε γιὰ νὰ προσεύχωνται μὲ περισσότερο φιλότιμο καὶ μεγαλύτερη θέρμη. Σὲ ὅλους ὅμως τόνιζε, ὡς κύρια προϋπόθεση γιὰ τὴν ἐπικοινωνία μὲ τὸν Θεό, τὴν μετάνοια καὶ τὴν ταπείνωση.«Ἀδελφέ μου,γράφει σὲ ἐπιστολή του,μὴ ζητᾶς τίποτε ἄλλο στὴν προσευχή σου ἀπὸ τὴν μετάνοια... Ἡ μετάνοια θὰ σοῦ φέρη τὴν ταπείνωση, ἡ ταπείνωση θὰ σοῦ φέρη τὴν Χάρη τοῦ Θεοῦ, καὶ ὁ Θεὸς θὰ σοῦ ἔχη μέσα στὴν Χάρη Του ὅ,τι χρειάζεται γιὰ τὴν δική σου σωτηρία καὶ ὅ,τι ἄλλο, σὲ περίπτωση ποὺ χρειασθῆ, γιὰ νὰ βοηθήσης μία ἄλλη ψυχή».Καὶ σὲ ἄλλη ἐπιστολή του γράφει:«Προσπαθῶ νὰ συντρίβωμαι μπροστὰ στὸν Θεὸ ἁπλώνοντας τὶς ἁμαρτίες μου καὶ τὶς ἀχαριστίες μου· νὰ ζητῶ ταπεινὰ τὸ ἔλεός Του καὶ νὰ Τὸν εὐγνωμονῶ δοξολογώντας».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Tὸ βιβλίο περιλαμβάνει ἑπτὰ μέρη. Tὸ πρῶτο μέρος ἀναφέρεται γενικὰ στὴν προσευχή, τὴν ὁποία ὁ Γέροντας ζοῦσε ὡς ἀνάγκη τῆς ψυχῆς γιὰ συνεχῆ καὶ ἀδιάλειπτη ἐπικοινωνία μὲ τὸν Θεό.«Πρέπει νὰ βρισκώμαστε,ἔλεγε,σὲ συνεχῆ ἐπαφὴ καὶ ″ἐν διαρκεῖ ἀκροάσει” μὲ τὸν Θεό, γιὰ νὰ νιώθουμε ἀσφάλεια· εἶναι ἀσφάλεια ἡ προσευχή». Ἂν τὸ συνειδητοποιήσουμε αὐτό, τότε θὰ αἰσθανώμαστε τὴν ἀνάγκη νὰ ἐπικοινωνοῦμε συνεχῶς μὲ τὸν Θεὸ καὶ θὰ φθάσουμε καὶ στὴν ἀδιάλειπτη προσευχή. Ὁ Γέροντας Παΐσιος μᾶς χειραγωγεῖ [//11] στὴν γνήσια καὶ καθαρὴ προσευχή, παρουσιάζoντας τὶς προϋποθέσεις ποὺ χρειάζονται γι’ αὐτὴν καὶ ἐπισημαίνοντας ὅτι παράλληλα μὲ τὴν προσευχὴ πρέπει νὰ γίνεται καὶ ὁ ἀνάλογος πνευματικὸς ἀγώνας. Γιὰ νὰ ἐπικοινωνοῦμε δηλαδὴ μὲ τὸν Θεό, χρειάζεται νὰ ἐργαζώμαστε«στὴν συχνότητα στὴν ὁποία ἐργάζεται ὁ Θεός», ποὺ εἶναι ἡ ταπείνωση καὶ ἡ ἀγάπη. Τὰ πάθη, καὶ κυρίως ἡ ὑπερηφάνεια καὶ ἡ ἔλλειψη πνευματικῆς ἀρχοντιᾶς, δηλαδὴ ἡ ἔλλειψη τῆς θυσίας, εἶναι παράσιτα ποὺ ἐμποδίζουν τὴν θεία ἐπικοινωνία. Γι’ αὐτό, πρὶν ἀρχίσουμε τὴν προσευχή, ποὺ εἶναι θεία ἐπικοινωνία, χρειάζεται προετοιμασία ἀνάλογη μὲ ἐκείνη ποὺ κάνουμε πρὶν ἀπὸ τὴν Θεία Κοινωνία. Μὲ τὴν μετάνοια καὶ τὴν ταπεινὴ ἐξομολόγηση στὸν Θεὸ«σπάζει ὁ φράχτης, ἢ μᾶλλον ἀνοίγει τὴν πόρτα ὁ Θεός», καὶ δεχόμαστε«τὴν Χάρη τῆς θείας ἐπικοινωνίας».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στὸ δεύτερο μέρος τοῦ βιβλίου γίνεται λόγος γιὰ τὰ ἐμπόδια ποὺ συναντοῦμε στὴν προσευχή: τὴν ἀμέλεια, τὴν ἀκηδία καὶ τὸν περισπασμό. Ἀλλὰ καὶ ὁ διάβολος προσπαθεῖ νὰ μᾶς ἀποσπάση ἀπὸ τὴν ἐπικοινωνία μὲ τὸν Θεὸ«πιάνοντας κουβεντούλα»μαζί μας. Ὁ Γέροντας δίνει πρακτικὲς συμβουλές,«γιὰ νὰ θερμανθῆ ἡ καρδιὰ καὶ νὰ πάρη μπρὸς στὴν προσευχή». Ἡ λίγη ἀλλὰ δυνατὴ μελέτη πρὶν ἀπὸ τὴν προσευχή, θερμαίνει τὴν καρδιά. Ἡ ψαλμωδία βοηθάει στὴν καταπολέμηση τῆς ἀκηδίας καὶ δημιουργεῖ τὶς καλύτερες προϋποθέσεις, γιὰ νὰ λέη κανεὶς μὲ ὄρεξη τὴν εὐχή. Τὸ κομποσχοίνι εἶναι ὅπλο κατὰ τοῦ διαβόλου. Οἱ μετάνοιες βοηθοῦν γιὰ τὸ ξεκίνημα τῆς πνευματικῆς μας μηχανῆς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τὸ τρίτο μέρος ἀναφέρεται στὴν«Φιλόστοργη Μητέρα μας», τὴν Παναγία, στὸν Φύλακα Ἄγγελο, καθὼς [//12] καὶ στοὺς Ἁγίους, οἱ ὁποῖοι εἶναι οἱ πρὸς Θεὸν Μεσίτες καὶ Προστάτες μας. Ἡ Παναγία μὲ τὴν τέλεια ὑπακοή Της στὸν Θεὸ καὶ μὲ τὴν ταπείνωσή Της, συνέβαλε στὴν πραγματοποίηση τῆς προαιώνιας βουλῆς τοῦ Θεοῦ γιὰ τὴν σωτηρία τοῦ ἀνθρώπου. Γι’ αὐτὸ καὶ ἀκούει τὴν προσευχή μας καὶ προσάγει τὰ αἰτήματά μας στὸν Υἱό Της καὶ Θεό. Παράλληλα, ὁ Φύλακας Ἄγγελός μας, ὅταν ζοῦμε κατὰ Θεόν, δὲν ἀπομακρύνεται ἀπὸ κοντά μας, μᾶς προστατεύει καὶ μᾶς γλυτώνει ἀπὸ κινδύνους. Ἀλλὰ καὶ ὅλοι οἱ Ἅγιοι, ὅταν τοὺς ἐπικαλούμαστε μὲ πίστη καὶ εὐλάβεια, σπεύδουν καὶ μᾶς βοηθοῦν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τὸ τέταρτο μέρος ἀναφέρεται στὰ αἰτήματα κατὰ τὴν προσευχή, τὴν ὁποία, ὅπως ἔλεγε ὁ Γέροντας, καλὸ εἶναι νὰ τὴν χωρίζουμε σὲ τρία μέρη: ἕνα γιὰ τὸν ἑαυτό μας, ἕνα γιὰ τὸν κόσμο καὶ ἕνα γιὰ τοὺς κεκοιμημένους. Στὸ τελευταῖο κεφάλαιο τοῦ τετάρτου μέρους γίνεται λόγος γιὰ τὴν προσευχὴ μὲ τὸ Ψαλτήρι, τὸ ὁποῖο ὁ Γέροντας χρησιμοποιοῦσε, γιὰ νὰ προσεύχεται σύμφωνα μὲ τὶς περιπτώσεις ποὺ εἶχε καθορίσει γιὰ κάθε Ψαλμὸ ὁ Ἅγιος Ἀρσένιος ὁ Καππαδόκης. Οἱ «περιπτώσεις» τοῦ Ἁγίου Ἀρσενίου, καθὼς καὶ ὁ τρόπος μὲ τὸν ὁποῖο ὁ Γέροντας προσευχόταν γιὰ κάποιο θέμα διαβάζοντας τὸν ἀντίστοιχο Ψαλμό, παρατίθενται σὲ Παράρτημα στὸ τέλος τοῦ βιβλίου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στὸ πέμπτο μέρος περιέχονται συμβουλὲς σχετικὰ μὲ τὴν εὐχὴ καὶ τὴν νήψη, τὴν πνευματικὴ δηλαδὴ ἐγρήγορση, ποὺ εἶναι ἀπαραίτητη γιὰ τὸ συμμάζεμα τοῦ νοῦ. Ὁ νοῦς μοιάζει«μὲ ἀναρχικὸ παιδί, ποὺ θέλει νὰ γυρίζη συνεχῶς ἐδῶ καὶ ἐκεῖ». Ὁ Γέροντας συμβουλεύει«νὰ τὸν ἐκπαιδεύσουμε πνευματικὰ καὶ νὰ τὸν μάθουμε νὰ συχνάζη στὸ σπίτι του, στὸν Παράδεισο, κοντὰ[//13]στὸν Πατέρα του, τὸν Θεό». Σχετικὰ μὲ τὴν συγκέντρωση τοῦ νοῦ στὴν εὐχή, ὁ Γέροντας, χωρὶς νὰ ἀπορρίπτη τὶς διάφορες πρακτικὲς μεθόδους, ἐπισημαίνει ὅτι αὐτὲς εἶναι ἁπλῶς βοηθητικὰ μέσα. Ὡς ἀπαραίτητες προϋποθέσεις θεωρεῖ τὴν μετάνοια καὶ τὸν καρδιακὸ πόνο, ὁ ὁποῖος ἔρχεται φυσιολογικά, ὅταν συναισθανθῆ ὁ ἄνθρωπος τὴν μεγάλη του ἁμαρτωλότητα καὶ τὴν ἀχαριστία ἀπέναντι στὶς πολλὲς εὐεργεσίες τοῦ Θεοῦ, ἀλλὰ καὶ ὅταν βγῆ ἀπὸ τὸν ἑαυτό του καὶ ἔρθη στὴν θέση τῶν πονεμένων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στὸ ἕκτο μέρος γίνεται ἀναφορὰ στὴν λατρευτικὴ ζωὴ τῆς Ἐκκλησίας. Ἐδῶ ἔχουν συμπεριληφθῆ συμβουλὲς σχετικὲς μὲ τὴν συμμετοχὴ στὶς ἐκκλησιαστικὲς Ἀκολουθίες καὶ τὴν σωστὴ προετοιμασία γιὰ τὴν μετοχὴ στὸ Μυστήριο τῆς Θείας Εὐχαριστίας. Τὸ τελευταῖο κεφάλαιο τοῦ μέρους αὐτοῦ ἀναφέρεται στὴν ψαλμωδία, ἡ ὁποία δὲν εἶναι μόνον προσευχή, ἀλλὰ καὶ«ἕνα ξέσπασμα τῆς καρδιᾶς, τὸ ξεχείλισμα τῆς ἐσωτερικῆς πνευματικῆς καταστάσεως».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τὸ ἕβδομο καὶ τελευταῖο μέρος τοῦ βιβλίου ἀναφέρεται στὴν δοξολογία τοῦ Θεοῦ. Ὁ Γέροντας συμβούλευε νὰ κάνουμε«καρδιακὴ δοξολογία μὲ χαρὰ καὶ εὐχαριστία»μετὰ τὴν ἐκπλήρωση κάθε αἰτήματός μας. Τόνιζε ἐπίσης ὅτι κάθε ἄνθρωπος, ἂν σκέφτεται τὸ πλῆθος τῶν θείων εὐεργεσιῶν, θὰ δοξάζη μέρα-νύχτα τὸν Θεό. Τὰ φιλότιμα μάλιστα παιδιὰ τοῦ Θεοῦ Τὸν δοξολογοῦν ἀκόμη καὶ στὶς θλίψεις καὶ στὶς δοκιμασίες. Μέσα στὴν συνεχῆ δοξολογία καὶ τὴν εὐχαριστία πρὸς τὸν Θεό, ὁ ἄνθρωπος νιώθει«ὅλον τὸν θεῖο πλοῦτο». Καὶ ὅσο δοξολογεῖ καὶ εὐγνωμονεῖ τὸν Θεό, τόσο ὁ Θεὸς τοῦ δίνει ὅλο καὶ περισσότερες εὐλογίες. Τὸ τελευταῖο κεφάλαιο [//14] ἀναφέρεται στὶς θεῖες δωρεές, οἱ ὁποῖες δίνονται στοὺς ταπεινοὺς καὶ φιλότιμους ἀνθρώπους, ποὺ ἐργάζονται τὴν μετάνοια καὶ θυσιάζουν τὰ πάντα ἀπὸ ἀγάπη στὸν Θεό. Ὁ Γέροντας, ἔχοντας γευθῆ τὴν μεγάλη γλυκύτητα καὶ ἀνέκφραστη ἀγαλλίαση, τὴν ὁποία ἡ θεία Χάρις χαρίζει στὴν ψυχή, ὅταν τὴν ἐπισκέπτεται, ἔλεγε ὅτι τότε«σταματάει ὁ νοῦς ἀπὸ τὴν παρουσία τοῦ Θεοῦ, παύει νὰ λειτουργῆ καὶ τὸ μυαλό, καὶ ἡ ψυχὴ αἰσθάνεται μόνον τὴν γλυκύτητα τῆς θείας ἀγάπης, τῆς θείας στοργῆς καὶ σιγουριᾶς». Τότε ἡ προσευχὴ πλέον σταματάει, γιατὶ ὁ νοῦς«ἔχει ἑνωθῆ μὲ τὸν Θεὸ καὶ δὲν θέλει μὲ κανέναν τρόπο νὰ φύγη ἀπὸ κοντά Του».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ ὅλα τὰ μέρη τοῦ βιβλίου ἐπανειλημμένως γίνεται λόγος γιὰ τὴν ταπείνωση καὶ τὴν συναίσθηση τῆς ἁμαρτωλότητός μας, καθὼς καὶ γιὰ τὴν ἀρχοντικὴ συμπεριφορὰ καὶ τὴν συμμετοχὴ στὸν πόνο τῶν ἄλλων. Αὐτὰ ἀποτελοῦσαν γιὰ τὸν Γέροντα βασικὲς ἀρχὲς τῆς πνευματικῆς ζωῆς καὶ ἀπαραίτητες προϋποθέσεις γιὰ τὴν καρδιακὴ προσευχή.«Καλλιεργῆστε τὴν καρδιακὴ προσευχή, ὅσο μπορεῖτε, μὲ ἀγάπη καὶ ταπείνωση», γράφει σὲ ἐπιστολή του. Πολλὲς φορὲς ἐπίσης ὁ Γέροντας ἀναφέρει παραδείγματα ἀπὸ τὸν προσωπικό του ἀγώνα ἢ ἀποκαλύπτει θεῖες καταστάσεις ποὺ ὁ ἴδιος εἶχε βιώσει. Ἦταν καὶ αὐτὸ μία«πνευματικὴ ἐλεημοσύνη»ποὺ ἔκανε ἀπὸ πολλὴ ἀγάπη, γιὰ νὰ μᾶς βοηθήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εὐχαριστοῦμε ἀπὸ καρδίας ὅσους διάβασαν τὰ κείμενα τοῦ τόμου αὐτοῦ πρὶν ἀπὸ τὴν ἔκδοσή του καὶ συνέβαλαν μὲ τὶς σκέψεις ποὺ διατύπωσαν στὴν ἀρτιώτερη μορφή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εἴθε, μὲ τὴν βοήθεια τοῦ Θεοῦ, νὰ ἀγαπήσουμε τὴν προσευχὴ καὶ νὰ ἐργασθοῦμε ταπεινὰ καὶ φιλότιμα, γιὰ νὰ τὴν καλλιεργήσουμε,«ἵνα βασιλείας Χριστοῦ κοινωνήσωμεν, ὑμνοῦντες Αὐτὸν ὡς Θεὸν εἰς τοὺς αἰῶνας». Ἀμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παρασκευὴ τῆς Διακαινησίμου 2012
- type: paragraph
  initial:
