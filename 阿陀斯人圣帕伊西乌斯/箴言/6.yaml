  '147': 'Τριήμερο: Τρεῖς ἡμέρες ἀποχὴ ἀπὸ τροφὴ καὶ νερό· συνήθως γίνεται τὶς τρεῖς πρῶτες ἡμέρες τῆς Μεγάλης Τεσσαρακοστῆς.'
  '148': 'Τριώδιο: Ἐκκλησιαστικὴ περίοδος ποὺ ξεκινάει τὴν Κυριακὴ Τελώνου καὶ Φαρισαίου καὶ τελειώνει τὸ Μέγα Σάββατο.'
  '149': 'Βλ. Γρηγορίου μοναχοῦ, μαθητῆ Ἁγ. Βασιλείου τοῦ Νέου,Ὁ τελωνισμὸς τῶν ψυχῶν κατὰ τὴν ὥρα τοῦ θανάτου: Τὰ εἴκοσι τρία βασικὰ τελώνια,Ἱ. Ἡσυχαστήριον Ἁγ. Ἀθανασίου τοῦ Μεγάλου καὶ Ἁγ. Νεομαρτύρων Ἀκυλίνης, Κυράννης καὶ Ἀργυρῆς, Γαλήνη Ὄσσης Λαγκαδᾶ.'
  '150': 'Κάνω ἐνάτη: Τρώω νηστήσιμη τροφὴ μετὰ τὴν ἐνάτη βυζαντινὴ ὥρα, δηλαδὴ μετὰ τὶς 3 μ.μ.'
  '151': Δοξαστικὸν Θ΄ Ὥρας Μεγάλης Παρασκευῆς.
  '152': Βλ.Ματθ.27, 34·Ἰω.19, 28–29.
  '153': Κατὰ τὴν ἀρχαία ἐκκλησιαστικὴ τάξη τὰ Ἐγκώμια ψάλλονται«μετὰ τοῦ Ἀμώμου», δηλαδὴ πρὶν ἀπὸ κάθε τροπάριο τῶν Ἐγκωμίων ψάλλεται καὶ ἕνας στίχος τοῦ Ἀμώμου (118ου Ψαλμοῦ).
  '154': Εἱρμὸς καὶ Καταβασία τῆς α΄ᾠδῆς τοῦ Ἀναστασίμου κανόνος, καθὼς καὶ Δοξαστικὸν τῶν Αἴνων τοῦ Πάσχα.
  '155': Ἐννοεῖ τὰ Βαρδούσια ὄρη, τὰ ὁποῖα βρίσκονται στὴν περιοχὴ τῆς ὀρεινῆς Ναυπακτίας.
  '156': Βλ.Ματθ. 18, 20.
  '157': Δηλαδὴ πρὸς τὸ τέλος τοῦ Ὄρθρου.
  '158': Ἐννοεῖ τὸν ἕναν ἀπὸ τοὺς δύο ληστὲς ποὺ εἶχαν συσταυρωθῆ μὲ τὸν Χριστό, ὁ ὁποῖος εἶπε στὸν ἄλλον ληστή:«Οὐ φοβῇ σὺ τὸν Θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ; Καὶ ἡμεῖς μὲν δικαίως·ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξε». (Βλ.Λουκ.23:40–41).
  '159': Αἰτήσεις ποὺ ἀρχίζουν μὲ τὸ«ἘνεἰρήνῃτοῦΚυρίουδεηθῶμεν».
  '160': Τὸ Ἀπολυτίκιον τῆς Πεντηκοστῆς.
  '161': Τὸ Κοντάκιον τῆς Πεντηκοστῆς.
  '162': Ἀκολουθία πρὸ τῆς Θείας Κοινωνίας. Συνήθως διαβάζεται στὸν ναὸ κατὰ τὸν Ὄρθρο.
  '163': Ὁ Μέγας Κανὼν εἶναι ποίημα τοῦ Ἁγίου Ἀνδρέου Κρήτης. Ψάλλεται τμηματικὰ τὶς τέσσερις πρῶτες ἡμέρες τῆς Α΄ Ἑβδομάδος τῆς Μεγάλης Τεσσαρακοστῆς στὸ Μέγα Ἀπόδειπνο καὶ ὁλόκληρος τὴν Ε΄ Ἑβδομάδα στὸ Μέγα Ἀπόδειπνο τῆς Τετάρτης ἢ στὸν Ὄρθρο τῆς Πέμπτης.
  '164': Εἰπώθηκε τὸν Ἰούνιο τοῦ 1994, ἕναν μήνα πρὶν ἀπὸ τὴν κοίμηση τοῦ Γέροντα.
  '165': Ἀκολουθία διάρκειας δέκα λεπτῶν, ποὺ περιλαμβάνει εὐχαριστήριες εὐχὲς μετὰ τὴν Θεία Μετάληψη.
