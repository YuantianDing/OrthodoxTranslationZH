  '172': Προφανῶς ὁ Γέροντας ἀναφέρεται στὰ εὐρωπαϊκὰ μουσικὰ ὄργανα, στὰ ὁποῖα ἀνήκει καὶ τὸ βιολί. Ὁ δεύτερος ἦχος εἶναι ἠχόχρωμα ἐντελῶς ξένο πρὸς τὴν εὐρωπαϊκὴ μουσικὴ καὶ ἀποδίδεται μόνον ἀπὸ τὸ βιολὶ καὶ τὰ ἀνατολίτικα μουσικὰ ὄργανα, ὅπως τὸ κανονάκι ἢ τὸ οὔτι.
