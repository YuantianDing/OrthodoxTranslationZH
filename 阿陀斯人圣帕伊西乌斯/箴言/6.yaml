  text:
    ru: – Στέλνω σῆμα, ζητῶ βοήθεια. Ζητῶ συνεχῶς βοήθεια ἀπὸ τὸν Χριστό, ἀπὸ τὴν Παναγία, ἀπὸ τοὺς Ἁγίους, γιὰ τὸν ἑαυτό μου καὶ γιὰ τοὺς ἄλλους. Ἂν δὲν ζητήσω, δὲν θὰ μοῦ δώσουν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρώτο Μέρος – Ἡ Ἐπικοινωνία Μὲ Τὸν Θεό
- type: paragraph
