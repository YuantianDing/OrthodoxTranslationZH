- type: h2
  initial:
    ru: ''
  text:
    ru: Μακάριοι ὅσοι ἔπιασαν ἐπαφὴ μὲ τὸν Οὐράνιο Σταθμὸ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, τί σημαίνει γιὰ σᾶς ἡ προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στέλνω σῆμα, ζητῶ βοήθεια. Ζητῶ συνεχῶς βοήθεια ἀπὸ τὸν Χριστό, ἀπὸ τὴν Παναγία, ἀπὸ τοὺς Ἁγίους, γιὰ τὸν ἑαυτό μου καὶ γιὰ τοὺς ἄλλους. Ἂν δὲν ζητήσω, δὲν θὰ μοῦ δώσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμᾶμαι στὸν ἀνταρτοπόλεμο μᾶς εἶχαν κυκλώσει σφιχτὰ χίλιοι ἑξακόσιοι ἀντάρτες. Ἐμεῖς ἤμασταν ὅλοι κι ὅλοι ἑκατὸν ὀγδόντα στρατιῶτες ὀχυρωμένοι πίσω ἀπὸ ἕναν βράχο. Ἂν μᾶς ἔπιαναν, θὰ μᾶς σκότωναν. Προσπάθησα νὰ στήσω κεραία, γιὰ νὰ πιάσω ἐπαφὴ μὲ τὸ Κέντρο. Δὲν μπόρεσα· κοβόταν ἡ κεραία ἀπὸ τὰ πυρά. Ὁ λοχαγὸς φώναζε: «Ἄφησέ τα αὐτά· ἔλα ἐδῶ, βοήθησε νὰ σβαρνίσουμε κανένα κιβώτιο χειροβομβίδες». Γυρνοῦσε ἐν τῷ μεταξὺ στὰ πολυβολεῖα καὶ ἔκανε ἐπιθεώρηση. Μόλις ἔφευγε, ἔτρεχα πάλι στὸν ἀσύρματο. Μέχρι νὰ δώση αὐτὸς ἐντολές, προσπαθοῦσα νὰ στήσω κεραία καὶ ξαναπήγαινα νὰ βοηθήσω, γιὰ νὰ μὴ φωνάζη. Τελικὰ μὲ ἕνα φτυάρι καὶ ἕνα ξύλο ἔστησα τὴν κεραία καὶ κατάφερα νὰ πιάσω ἐπαφή. Εἶπα δυὸ λέξεις. Ἐκεῖνο ἦταν! Τὸ πρωὶ ἦρθε ἡ ἀεροπορία καὶ μᾶς ἔσωσε. Μικρὸ πράγμα εἶναι ἑκατὸν ὀγδόντα ἄνδρες νὰ εἶναι περικυκλωμένοι ἀπὸ χίλιους ἑξακόσιους, καὶ τελικὰ νὰ σωθοῦν;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἀπὸ ἐκεῖ κατάλαβα τὴν μεγάλη ἀποστολὴ τοῦ μοναχοῦ, νὰ βοηθάη μὲ τὴν προσευχή. Λένε οἱ κοσμικοί: «Τί κάνουν οἱ καλόγεροι; Γιατί δὲν βγαίνουν στὸν κόσμο, νὰ βοηθήσουν τὴν κοινωνία;». Εἶναι σὰν νὰ λένε σὲ ἕναν ἀσυρματιστή: «Τί κάνεις ἐκεῖ μὲ τὸν ἀσύρματο; Ἄφησε τὸν ἀσύρματο, πάρε ἕνα τουφέκι καὶ ἔλα νὰ πολεμήσης».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ τίποτε δὲν μᾶς ὠφελεῖ ἡ ἐπικοινωνία μὲ ὅλους τοὺς σταθμοὺς ὅλου τοῦ κόσμου, ἐὰν δὲν ἔχουμε τὴν οὐράνια ἐπικοινωνία καὶ ἐπαφὴ μὲ τὸν Θεό, γιὰ νὰ ζητᾶμε καὶ νὰ παίρνουμε βοήθεια ἀπὸ Αὐτόν. Εἶναι μακάριοι ὅσοι ἔπιασαν ἐπαφὴ μὲ τὸν Οὐράνιο Σταθμὸ καὶ εἶναι δικτυωμένοι μὲ εὐλάβεια μὲ τὸν Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ Χριστὸς μᾶς δίνει τὴν δυνατότητα νὰ μιλᾶμε μαζί Του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ καημὸς καὶ ὁ πόνος μου εἶναι τὸ θέμα τῆς προσευχῆς. Βρίσκομαι πολὺ πίσω. Τί νὰ κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ μιλᾶς αὐθόρμητα στὸν Χριστό, στὴν Παναγία, στοὺς Ἀγγέλους, στοὺς Ἁγίους, ὅπου κι ἂν βρίσκεσαι, καὶ νὰ τοὺς λὲς ὅ,τι θέλεις. «Χριστέ μου, νὰ λές, Παναγία μου, τὴν διάθεσή μου τὴν ξέρεις. Βοήθησέ με!». Ἔτσι ἁπλὰ καὶ ταπεινὰ νὰ τοὺς μιλᾶς συνέχεια γιὰ ὅ,τι σὲ ἀπασχολεῖ καὶ ὕστερα νὰ λὲς τὴν εὐχή:«Κύριε Ἰησοῦ Χριστέ, ἐλέησόν με».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δὲν προσεύχομαι συγκεντρωμένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν προσεύχεσαι, νὰ σκέφτεσαι μὲ ποιόν μιλᾶς. Μιλᾶς μὲ τὸν Θεό! Μικρὸ πράγμα εἶναι αὐτό; Σὲ ἕνα ἐπίσημο πρόσωπο μὲ πόση προσοχὴ μιλάει κανείς! Προσέχει νὰ μὴν πῆ καμμιὰ ἀνοησία, πότε-πότε μπερδεύεται καὶ ἡ γλῶσσα του ἀπὸ συστολή. Ἔ, ἀπὸ τὴν στιγμὴ ποὺ προσέχει κανεὶς τόσο πολύ, ὅταν μιλάη μὲ ἕναν ἄνθρωπο, πόσο πιὸ προσεκτικὸς πρέπει νὰ εἶναι, ὅταν μιλάη μὲ τὸν Θεό; Βλέπεις, ἀκόμη καὶ ἕνα μικρὸ παιδί, ὅταν πηγαίνη νὰ μιλήση στὸν πατέρα του ἢ σὲ ἕναν ἡλικιωμένο, πηγαίνει μὲ συστολή. Ἂν πρόκειται νὰ μιλήση στὸν δάσκαλό του, ποὺ τὸν φοβᾶται καὶ λίγο, πλησιάζει μὲ πιὸ μεγάλη συστολή. Κι ἐμεῖς, τώρα, μιλᾶμε μὲ τὸν Ἴδιο τὸν Θεό, μὲ τὴν Παναγία, μὲ τοὺς Ἁγίους, καὶ νὰ μὴν τὸ καταλαβαίνουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρὶν ἔρθω, Γέροντα, στὸ μοναστήρι, τὸν Μοναχισμὸ τὸν εἶχα συνδέσει μὲ τὴν προσευχή. Τώρα ὅμως δυσκολεύομαι στὴν προσευχὴ καὶ τὴν θεωρῶ τὸ πιὸ δύσκολο καὶ κουραστικὸ ἔργο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἐσὺ φιλόλογος δὲν εἶσαι; Σοῦ ἀρέσει νὰ μιλᾶς, καὶ δὲν κουράζεσαι νὰ κουβεντιάζης μὲ τοὺς ἀνθρώπους. Μὲ τὸν Χριστὸ ὅμως, ποὺ καταδέχεται νὰ κουβεντιάση μαζί σου, κουράζεσαι νὰ μιλᾶς καὶ σοῦ φαίνεται δύσκολο. Δὲν εἶναι βαρὺ αὐτό; Σὰν νὰ λέη κάποιος: «Ὤχ, τώρα πρέπει νὰ πάω νὰ μιλήσω μὲ τὸν βασιλιά. Δὲν ἔχω ὄρεξη, ἀλλὰ τί νὰ κάνω; Θὰ πάω». Ὁ Χριστὸς μᾶς δίνει τὴν δυνατότητα νὰ μιλᾶμε συνέχεια διὰ τῆς προσευχῆς μαζί Του, κι ἐμεῖς νὰ μὴ θέλουμε; Εἶναι φοβερό! Καὶ τὸ παράξενο εἶναι ὅτι Ἐκεῖνος θέλει νὰ μιλᾶμε μαζί Του, γιὰ νὰ μᾶς βοηθάη, κι ἐμεῖς βαριόμαστε!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πέφτω συχνὰ στὴν φλυαρία καὶ μετὰ στενοχωριέμαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλύτερα δὲν εἶναι νὰ μιλᾶς μὲ τὸν Χριστό; Ὅποιος μιλάει μὲ τὸν Χριστό, ποτὲ δὲν μετανοιώνει. Ἡ φλυαρία εἶναι βέβαια πάθος, ἀλλά, ἂν τὴν ἀξιοποιήσης πνευματικά, μπορεῖ νὰ γίνη προϋπόθεση γιὰ τὴν προσευχή. Ἄλλοι βαριοῦνται καὶ νὰ μιλήσουν. Ἐσὺ ἔχεις μιὰ δύναμη μέσα σου καὶ μιὰ ὁρμὴ νὰ μιλᾶς. Ἂν τὸ ἀξιοποιήσης αὐτὸ πνευματικά, θὰ ἁγιασθῆ ἡ ψυχή σου. Προσπάθησε νὰ λὲς μόνον τὰ ἀπαραίτητα μὲ τοὺς ἀνθρώπους καὶ νὰ μιλᾶς συνέχεια μὲ τὸν Χριστό. Ὅταν θὰ ἀρχίζης μιὰ ταπεινὴ συζήτηση μαζί Του, δὲν θὰ παίρνης εἴδηση τί γίνεται γύρω σου· τόσο ἐνδιαφέρον καὶ τόση γλυκύτητα θὰ ἔχη. Ἐμένα ἀκόμη καὶ οἱ πνευματικὲς συζητήσεις μὲ κουράζουν, ἐνῶ στὴν προσευχὴ νιώθω μεγάλη ἀνάπαυση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἡ προσευχὴ εἶναι συνομιλία μὲ τὸν Θεό. Μακαρίζω καμμιὰ φορὰ ἐκείνους ποὺ ἔζησαν στὴν ἐποχὴ τοῦ Χριστοῦ, γιατὶ ἔβλεπαν καὶ ἄκουγαν τὸν Ἴδιο τὸν Χριστὸ καὶ μποροῦσαν νὰ Τοῦ μιλήσουν. Ἀλλὰ σκέφτομαι ὅτι ἐμεῖς εἴμαστε σὲ καλύτερη θέση, γιατὶ ἐκεῖνοι δὲν μποροῦσαν νὰ ἀπασχολήσουν πολὺ τὸν Χριστό, ἐνῶ ἐμεῖς μποροῦμε μὲ τὴν προσευχὴ νὰ μιλᾶμε συνέχεια μαζί Του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ λαχτάρα γιὰ τὴν προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς πρέπει νὰ προσεύχωμαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ αἰσθάνεσαι σὰν μικρὸ παιδί, καὶ τὸν Θεὸ νὰ Τὸν αἰσθάνεσαι Πατέρα σου καὶ νὰ Τὸν παρακαλᾶς γιὰ ὅ,τι ἔχεις ἀνάγκη. Μιλώντας ἔτσι μὲ τὸν Θεό, δὲν θὰ θέλης μετὰ νὰ ξεκολλήσης ἀπὸ κοντά Του, γιατὶ μόνο στὸν Θεὸ βρίσκει κανεὶς τὴν ἀσφάλεια, τὴν παρηγοριά, τὴν ἀνέκφραστη ἀγάπη μὲ τὴν θεία στοργή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Προσευχὴ εἶναι νὰ βάλουμε τὸν Χριστὸ μέσα στὴν καρδιά μας, νὰ Τὸν ἀγαπήσουμε μὲ ὅλο μας τὸ εἶναι.«Ἀγαπήσεις Κύριον τὸν Θεόν σου ἐξ ὅλης τῆς καρδίαςσου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς ἰσχύος σου καὶ ἐξ ὅλης τῆς διανοίας σου»[1], λέει ἡ Ἁγία Γραφή. Ὅταν ὁ ἄνθρωπος ἀγαπήση τὸν Θεὸ καὶ ἔχη ἐπικοινωνία μαζί Του, δὲν τὸν συγκινεῖ τίποτε τὸ γήινο. Γίνεται σὰν τρελλός. Βάλε σὲ ἕναν τρελλὸ τὴν καλύτερη μουσική· δὲν συγκινεῖται. Δεῖξε τοὺς καλύτερους ζωγραφικοὺς πίνακες· δὲν δίνει καμμιὰ σημασία. Δῶσε τὰ καλύτερα φαγητά, τὰ καλύτερα ροῦχα, τὰ καλύτερα ἀρώματα· δὲν τὰ προσέχει, εἶναι στὸν κόσμο του. Ἔτσι καὶ ὅποιος ἔχει ἐπικοινωνία μὲ τὸν οὐράνιο κόσμο, εἶναι κολλημένος ἐκεῖ καὶ δὲν ξεκολλάει μὲ τίποτε. Ὅπως δὲν μπορεῖς νὰ ξεκολλήσης τὸ παιδὶ ἀπὸ τὴν ἀγκαλιὰ τῆς μάνας, ἔτσι δὲν μπορεῖς νὰ ξεκολλήσης ἀπὸ τὴν προσευχὴ καὶ τὸν ἄνθρωπο ποὺ ἔχει καταλάβει τὸ νόημά της. Τί αἰσθάνεται τὸ παιδάκι στὴν ἀγκαλιὰ τῆς μητέρας του; Μόνον ὅποιος νιώθει τὴν παρουσία τοῦ Θεοῦ καὶ τὸν ἑαυτό του μικρὸ παιδί, μπορεῖ νὰ τὸ καταλάβη αὐτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἔχω γνωρίσει ἀνθρώπους πού, ὅταν προσεύχωνται, νιώθουν σὰν μικρὰ παιδιά. Καὶ ἂν τοὺς ἀκούση κανεὶς τὴν ὥρα ποὺ προσεύχονται, θὰ πῆ ὅτι εἶναι μικρὰ παιδιά. Ἐὰν δῆ καὶ τί κινήσεις κάνουν, θὰ πῆ ὅτι παλάβωσαν! Ὅπως τὸ παιδάκι τρέχει, πιάνει τὸν πατέρα του ἀπὸ τὸ μανίκι καὶ τοῦ λέει: «δὲν ξέρω τί θὰ κάνης, ἀλλὰ θὰ μοῦ τὸ κάνης αὐτὸ ποὺ σοῦ ζητῶ», μὲ τέτοια ἁπλότητα καὶ παρρησία παρακαλοῦν καὶ αὐτοὶ οἱ ἄνθρωποι τὸν Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἡ ἐπιθυμία γιὰ προσευχὴ εἶναι δυνατὸν νὰ δημιουργηθῆ ἀπὸ μιὰ συναισθηματικὴ ἀνάγκη γιὰ ἐπικοινωνία, γιὰ παρηγοριά; – Κι ἂν δημιουργηθῆ ἀπὸ μιὰ καλὴ συναισθηματικὴ ἀνάγκη γιὰ τὸν Θεό, καλὸ δὲν εἶναι; Φαίνεται ὅμως ὅτι ἐσὺ ξεχνιέσαι, καὶ μόνο στὴν ἀνάγκη τρέχεις στὴν προσευχή. Φυσικά, γι’ αὐτὸ ὁ Θεὸς ἐπιτρέπει τὶς διάφορες ἀνάγκες καὶ δυσκολίες, γιὰ νὰ καταφεύγουμε σ’ Αὐτόν, ἀλλὰ πιὸ καλὸ εἶναι ἀπὸ ἀγάπη νὰ τρέχη τὸ παιδὶ στὸν πατέρα ἢ στὴν μάνα. Φαντάζεσαι ἕνα παιδὶ ποὺ ξέρει πόσο τὸ ἀγαποῦν οἱ γονεῖς του, νὰ τὸ σπρώχνουν μὲ τὸ ζόρι νὰ πάη στὴν ἀγκαλιὰ τῆς μάνας ἢ τοῦ πατέρα του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὁ Θεὸς εἶναι στοργικὸς Πατέρας καὶ μᾶς ἀγαπάει. Γι’ αὐτὸ πρέπει νὰ λαχταρᾶμε πότε θὰ ἔρθη ἡ ὥρα τῆς προσευχῆς καὶ νὰ μὴ χορταίνουμε νὰ μιλᾶμε μαζί Του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Ἡ ἀνάγκη γιὰ προσευχὴ
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ νιώσουμε τὴν προσευχὴ ὡς ἀνάγκη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, δὲν ἔχω μεγάλη πίστη καὶ νιώθω ἀδύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρεις τί νὰ κάνης; Νὰ κρεμασθῆς ἀπὸ τὸν Θεό, ὅπως κρεμιέται τὸ παιδάκι ἀπὸ τὸν λαιμὸ τοῦ πατέρα του, καὶ νὰ Τὸν σφίξης ἔτσι ποὺ νὰ μὴν μπορῆ νὰ σὲ ἀπομακρύνη ἀπὸ κοντά Του. Τότε θὰ νιώσης σιγουριὰ καὶ δύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νιώθω, Γέροντα, τὴν ἀνάγκη νὰ ἀκουμπήσω στὸν Θεό, ἀλλὰ δυσκολεύομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ σηκώνης τὰ χέρια σου ψηλά· ἔτσι σιγὰ-σιγὰ θὰ μεγαλώσουν καὶ θὰ πιασθῆς ἀπὸ τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν δὲν ἔχω πολὺ χρόνο καὶ βιάζωμαι στὴν προσευχή, μήπως κλέβω τὸν χρόνο ποὺ πρέπει νὰ δώσω στὸν Χριστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ Χριστὸς ἔχει πολλά· ὅσα καὶ νὰ κλέψης, δὲν ἔχει ἀνάγκη· ἐσὺ ὅμως δὲν βοηθιέσαι. Δὲν ἔχει ἀνάγκη ὁ Χριστὸς ἀπὸ τὴν προσευχή μας, ἀλλὰ ἐμεῖς ἔχουμε ἀνάγκη ἀπὸ τὴν βοήθειά Του. Προσευχόμαστε, γιατὶ ἔτσι ἐπικοινωνοῦμε μὲ τὸν Θεὸ ποὺ μᾶς δημιούργησε. Ἂν δὲν τὸ κάνουμε, θὰ πέσουμε στὰ χέρια τοῦ διαβόλου, καὶ τότε ἀλλοίμονό μας! Εἶδες, τί λέει ὁ Ἀββᾶς Ἰσαάκ; «Δὲν θὰ μᾶς ζητήση λόγο ὁ Θεὸς γιατί δὲν κάναμε προσευχή, ἀλλὰ γιατί δὲν εἴχαμε ἐπικοινωνία μαζί Του, καὶ μὲ αὐτὸν τὸν τρόπο δώσαμε δικαιώματα στὸν διάβολο καὶ μᾶς ταλαιπώρησε»[2].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς θὰ ἀγαπήσω τὴν προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ νιώσης τὴν προσευχὴ ὡς ἀνάγκη. Ὅπως τὸ σῶμα, γιὰ νὰ ζήση, χρειάζεται τροφή, ἔτσι καὶ ἡ ψυχή, γιὰ νὰ ζήση, πρέπει νὰ τραφῆ. Ἂν δὲν τραφῆ, ἀποδυναμώνεται κι ἔρχεται ὁ πνευματικὸς θάνατος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί μᾶς δυσκολεύει στὴν προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δυσκολευόμαστε, μόνον ὅταν δὲν αἰσθανώμαστε τὴν προσευχὴ ὡς ἀνάγκη. Ὅποιος δὲν μπῆ στὸ νόημα τῆς προσευχῆς, γιὰ νὰ τὴν αἰσθανθῆ ὡς ἀνάγκη, τὴν θεωρεῖ ἀγγαρεία καὶ μοιάζει μὲ τὸ ἀνόητο παιδάκι ποὺ ἀποστρέφεται τὸν μαστὸ τῆς μητέρας του καὶ ὅλη τὴν γλυκειά της στοργή, καὶ ἔτσι εἶναι ἀρρωστιάρικο καὶ κακορρίζικο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Εἶναι ἀσφάλεια ἡ προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς θὰ νιώσουμε, Γέροντα, τὴν προσευχὴ ὡς ἀνάγκη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔπρεπε νὰ εἴχατε πάει στὸν πόλεμο, γιὰ νὰ μποροῦμε νὰ συνεννοηθοῦμε! Στὸν στρατό, ἐν καιρῷ πολέμου, ὅταν ἤμασταν σὲ συνεχῆ ἐπαφὴ καὶ «ἐν διαρκεῖ ἀκροάσει» μὲ τὸ Κέντρο, εἴχαμε περισσότερη σιγουριά. Ὅταν ἐπικοινωνούσαμε κάθε δύο ὧρες, νιώθαμε μία ἀνασφάλεια. Ὅταν ἐπικοινωνούσαμε μόνο δύο φορὲς τὴν ἡμέρα, πρωὶ καὶ βράδυ, τότε νιώθαμε ξεκρέμαστοι. Τὸ ἴδιο συμβαίνει καὶ μὲ τὴν προσευχή. Ὅσο περισσότερο προσεύχεται κανείς, τόσο περισσότερη πνευματικὴ σιγουριὰ νιώθει. Εἶναι ἀσφάλεια ἡ προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἂν βρισκώμαστε σὲ συνεχῆ ἐπαφὴ καὶ «ἐν διαρκεῖ ἀκροάσει» μὲ τὸν Θεό, θὰ προλαβαίνουμε κάθε κακό. Μιὰ φορὰ μέσα σὲ ἕνα λεωφορεῖο ἦταν ἕνας μοναχὸς[3]ποὺ προσευχόταν μὲ κλειστὰ μάτια καὶ οἱ ἄλλοι νόμιζαν ὅτι κοιμᾶται. Κάποια στιγμὴ ἕνα φορτηγὸ ποὺ ἐρχόταν ἀπὸ τὴν ἀντίθετη κατεύθυνση χτύπησε πάνω σὲ μιὰ κολόνα τῆς ΔΕΗ καὶ τὰ αὐτοκίνητα ποὺ ἔρχονταν ἀπὸ τὸ ἕνα καὶ ἀπὸ τὸ ἄλλο ρεῦμα συγκρούστηκαν μεταξύ τους καὶ ἔπαθαν μεγάλη ζημιά. Τὸ λεωφορεῖο ὅμως βρέθηκε λίγα μέτρα ἔξω ἀπὸ τὸν δρόμο, σὰν νὰ τὸ πῆρε ἕνα ἀόρατο χέρι, καὶ κανένας ἀπὸ τοὺς ἐπιβάτες δὲν ἔπαθε τίποτε. Ἡ προσευχὴ τοῦ μοναχοῦ τοὺς ἔσωσε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνὰ λαϊκοὶ ρωτοῦν πῶς θὰ συνηθίσουν νὰ προσεύχωνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε, παλιά, μερικοὶ ποὺ ξεκινοῦσαν γιὰ τὸν Μοναχισμὸ καὶ εἶχαν σκληρὸ χαρακτήρα, πήγαιναν καὶ ἀσκήτευαν σὲ ἀπόκρημνα βράχια, μέσα σὲ σπηλιές, σὲ τάφους εἰδωλολατρῶν ἢ σὲ κατοικητήρια δαιμόνων. Ἐκεῖ διέτρεχαν ἕνα σωρὸ κινδύνους – ἔτρεμαν μήπως ξεκοπῆ ὁ βράχος, μούγκριζαν οἱ δαίμονες κ.λπ. –, καὶ ὁ φόβος τοὺς ἀνάγκαζε νὰ φωνάζουν συνέχεια: «Χριστέ μου, Παναγία μου». Ἔτσι τοὺς ἔμενε ἡ καλὴ συνήθεια τῆς ἀδιάλειπτης προσευχῆς. Σήμερα, μὲ τὰ ξενύχτια, τὰ ναρκωτικὰ κ.λπ., πολλοὶ ἀπὸ αὐτοὺς ποὺ ὁδηγοῦν δὲν ἐλέγχουν τὸν ἑαυτό τους. Ὁπότε ξεκινάει κάποιος νὰ πάη στὴν δουλειά του καὶ δὲν ξέρει ἂν θὰ γυρίση ζωντανὸς στὸ σπίτι του ἢ θὰ βρεθῆ σακατεμένος σὲ κανένα νοσοκομεῖο. Αὐτὸ δὲν τὸν ἀναγκάζει νὰ λέη συνέχεια: «Χριστέ μου, Παναγία μου»; Ἂν οἱ λαϊκοὶ ἀξιοποιοῦσαν τοὺς κινδύνους ποὺ διατρέχουν, θὰ μᾶς εἶχαν ξεπεράσει ἐμᾶς τοὺς μοναχοὺς στὴν προσευχὴ καὶ θὰ ἀπέφευγαν καὶ τοὺς κινδύνους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἦρθε κάποιος στὸ Καλύβι πολὺ στενοχωρημένος, γιατὶ ἀπὸ ἀπροσεξία χτύπησε μὲ τὸ αὐτοκίνητό του ἕνα παιδάκι. «Εἶμαι ἔνοχος», ἔλεγε. «Προσευχόσουν ἐκείνη τὴν ὥρα;», τὸν ρώτησα. «Ὄχι», μοῦ εἶπε. «Δὲν εἶσαι τόσο ἔνοχος ποὺ χτύπησες τὸ παιδί, τοῦ εἶπα, ὅσο εἶσαι ἔνοχος, ἐπειδὴ δὲν προσευχόσουν». Καὶ τοῦ ἀνέφερα ἕνα ἄλλο περιστατικὸ ποὺ εἶχα ὑπ’ ὄψιν μου: Εἶχα γνωρίσει ἕναν ὑπάλληλο ποὺ εἶχε φθάσει σὲ μεγάλα μέτρα ἀρετῆς. Ἔλεγε τὴν εὐχὴ συνέχεια, καὶ στὴν δουλειά του καὶ στὸν δρόμο, καὶ παντοῦ. Ἡ προσευχή του εἶχε γίνει αὐτενέργητη[4]καὶ ἀπὸ τὰ μάτια του ἔτρεχαν δάκρυα δοξολογίας καὶ ἀγαλλιάσεως. Ἐκεῖ ποὺ ἐργαζόταν στὸ γραφεῖο του, ἔβρεχε τὰ χαρτιὰ μὲ δάκρυα. Γι’ αὐτὸ σκεφτόταν νὰ φύγη ἀπὸ τὴν δουλειά του μὲ μειωμένη σύνταξη, καὶ ἦρθε στὸ Καλύβι νὰ μὲ ρωτήση τί νὰ κάνη. «Μὴ φεύγης, τοῦ εἶπα, καί, ὅταν σὲ ρωτοῦν οἱ συνάδελφοί σου γιατί κλαῖς, νὰ λές: “Θυμήθηκα τὸν μακαρίτη τὸν πατέρα μου”». Μιὰ μέρα λοιπόν, ἐνῶ ὁδηγοῦσε, πετάχτηκε ξαφνικὰ μπροστά του ἕνα παιδάκι. Τὸ πέταξε πέρα σὰν σβούρα, ἀλλὰ τὸ παιδὶ δὲν ἔπαθε τίποτε. Φύλαξε ὁ Θεός, γιατὶ ἐκείνη τὴν ὥρα ὁ ἄνθρωπος αὐτὸς προσευχόταν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἐπιστράτευση προσευχῆς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θὰ γίνη πόλεμος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἐσεῖς κάνετε προσευχή; Ἐγὼ ἔχω ἀπὸ τὴν ἄνοιξη μέχρι τὸ φθινόπωρο ποὺ κάνω ἐπιστράτευση προσευχῆς – ἀθόρυβα –, γιὰ νὰ μᾶς λυπηθῆ ὁ Θεός, νὰ ἀποφύγουμε τὴν ἐπιστράτευση καὶ τὸν πόλεμο. Εἶχα πληροφορία[5]: «Κάνετε πολλὴ προσευχή, γιὰ νὰ ἐμποδιστοῦν οἱ Τοῦρκοι, διότι τὴν Κυριακὴ 16 Ὀκτωβρίου, ἔχουν σκοπὸ νὰ μᾶς χτυπήσουν». Δόξα τῷ Θεῷ, μέχρι στιγμῆς μᾶς φύλαξε ἡ Παναγία· ἂς εὐχηθοῦμε νὰ μᾶς προστατεύση καὶ στὴν συνέχεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τώρα ποὺ πέρασε ἀπὸ ἐδῶ ὁ κίνδυνος, θὰ συνεχίσουμε νὰ προσευχώμαστε γι' αὐτὸ τὸ θέμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως ὑπάρχει τόπος χωρὶς πόλεμο; Τί θὰ πῆ «ἐδῶ» καὶ «ἐκεῖ»; Καὶ ἐκεῖ ποὺ τώρα ἔχουν πόλεμο, ἀδελφοί μας εἶναι. Ἀπὸ τὸν Ἀδὰμ καὶ ἀπὸ τὴν Εὔα δὲν εἴμαστε ὅλοι οἱ ἄνθρωποι; Μοιράστηκε ὅμως ἡ οἰκογένειά μας· ἄλλοι εἶναι ἐδῶ, ἄλλοι ἐκεῖ. Μὲ τοὺς Ὀρθοδόξους εἴμαστε ἀδελφοὶ καὶ κατὰ σάρκα καὶ κατὰ πνεῦμα, ἐνῶ μὲ τοὺς ἄλλους εἴμαστε ἀδελφοὶ μόνον κατὰ σάρκα. Ἑπομένως, γιὰ ἕναν λόγο παραπάνω, πρέπει νὰ προσευχώμαστε μὲ περισσότερο πόνο γι’ αὐτούς, γιατὶ αὐτοὶ εἶναι πιὸ ταλαίπωροι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αὐτὸ τὸ διάστημα ποὺ τὰ πράγματα εἶναι δύσκολα γιὰ τὴν Ἑλλάδα, κάνω πολὺ κομποσχοίνι, ἀλλὰ σκέφτομαι καὶ ὅτι ἡ σωτηρία τῆς Ἑλλάδος δὲν κρέμεται ἀπὸ τὸ κομποσχοίνι μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν εἶναι ὅτι ἡ σωτηρία τῆς Ἑλλάδος κρεμάσθηκε ἀπὸ τὸ κομποσχοίνι σου, ἀλλὰ τὸ νὰ σκέφτεσαι συνέχεια τὴν δυσκολία ποὺ περνάει ἡ Ἑλλάδα σημαίνει ὅτι πονᾶς τὴν πατρίδα καὶ ζητᾶς τὴν ἐπέμβαση τοῦ Θεοῦ, ὁ Ὁποῖος εἶναι ὁ μόνος ποὺ μπορεῖ νὰ βοηθήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Νὰ προσεύχεσθε νὰ ἀναδείξη ὁ Θεὸς πνευματικοὺς ἀνθρώπους, Μακκαβαίους[6], γιατὶ ὑπάρχει μεγάλη ἀνάγκη. Ἦρθε ὁ καιρὸς νὰ πολεμήση τὸ καλὸ μὲ τὸ κακό, γιατὶ τὴν παρανομία τὴν ἔχουν κάνει νόμο καὶ τὴν ἁμαρτία μόδα. Ὅταν ὅμως δῆτε συμφορὲς στὴν Ἑλλάδα, τὸ κράτος νὰ βγάζη παλαβοὺς νόμους καὶ νὰ ὑπάρχη γενικὴ ἀστάθεια, μὴ φοβηθῆτε· θὰ βοηθήση ὁ Θεός[7].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔτσι ὅπως τὰ λέτε, Γέροντα, πρέπει νὰ τὰ ἀφήσουμε ὅλα καὶ νὰ δώσουμε τὶς δυνάμεις μας στὴν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά, χωράει συζήτηση γι' αὐτὸ τὸ πράγμα; Ὅλος ὁ κόσμος βράζει σὰν σὲ καζάνι. Ἡ Ἐκκλησία, ἡ πολιτεία, ὅλα τὰ ἔθνη εἶναι ἄνω-κάτω! Καὶ τί ἐξέλιξη θὰ ἔχουμε, κανεὶς δὲν τὸ ξέρει. Ὁ Θεὸς νὰ βάλη τὸ χέρι Του! Πρέπει οἱ καλόγεροι νὰ κάνουν πολλὴ προσευχή. Καὶ ἐπείγουσες δουλειὲς ἂν ἔχουν, νὰ τὶς σταματήσουν ὅλες καὶ νὰ στραφοῦν στὴν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅσο μπορεῖτε, νὰ εὔχεσθε ταπεινὰ γιὰ τὸν κόσμο ποὺ ἔδωσε πολλὰ δικαιώματα στὸν πονηρὸ καὶ ταλαιπωρεῖται. Νὰ μὴν ξεχνᾶτε ὅτι γίναμε μοναχοὶ γιὰ τὴν σωτηρία τῆς ψυχῆς μας καὶ γιὰ νὰ βοηθήσουμε τὸν κόσμο μὲ τὴν προσευχή. Νὰ προσπαθήσουμε νὰ γίνουμε καλοὶ μοναχοί, νὰ κάνουμε κομποσχοίνι καὶ μετάνοιες γιὰ τὸν ἑαυτό μας καὶ γιὰ τὸν κόσμο, γιατὶ ὁ μοναχὸς μὲ αὐτὰ βοηθάει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Γιὰ νὰ μᾶς ἀκούη ὁ Θεὸς
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὰ πάθη εἶναι παράσιτα στὴν θεία ἐπικοινωνία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ὅταν ἔχω ἐμπάθεια, μπορεῖ νὰ δουλέψη ἡ καρδιά μου στὴν προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς νὰ δουλέψη ἡ καρδιά σου στὴν προσευχή, ὅταν μέσα σου ἔχης πάθη; Νά, πάρε ἕνα σκουριασμένο καλώδιο καὶ σύνδεσέ το μὲ τὸ τηλέφωνο. Μπορεῖς νὰ συνεννοηθῆς; Βραχυκυκλώνεται, βουίζει. Καὶ ὁ ἄνθρωπος, ὅταν ἔχη μέσα του σκουριές, πάθη, ἔχει βραχυκυκλώματα στὴν πνευματικὴ ζωή· μόνος του βραχυκυκλώνεται. Χρειάζεται νὰ προσέξη τὴν ὑπερηφάνεια, τὸν ἐγωισμό, τὸ θέλημα, τὴν ἀναίδεια. Γιατί, ἂν εἶναι κυριευμένος ἀπὸ αὐτά, δὲν εἶναι δυνατὸν νὰ τὸν ἐπισκεφθῆ ἡ Χάρις τοῦ Θεοῦ, ὥστε νὰ μπορέση νὰ προσευχηθῆ. Πρέπει νὰ καθαρίση τὰ σκουριασμένα του «καλώδια», γιὰ νὰ γίνη καλὸς ἀγωγὸς καὶ νὰ μπορῆ νὰ ἐπικοινωνῆ μὲ τὸν Θεό. Καὶ ὅσο περισσότερο θὰ καθαρίζεται ἀπὸ τὰ πάθη, τόσο περισσότερο θὰ προχωράη στὴν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τὰ πάθη εἶναι παράσιτα ποὺ ἐμποδίζουν τὴν θεία ἐπικοινωνία. Ἂν δὲν φύγουν τὰ παράσιτα, πῶς θὰ μπορέση ὁ ἄνθρωπος νὰ ἐπικοινωνήση μὲ τὸν Θεό; Στὶς Διαβιβάσεις, ὅταν κάποιος εἶχε παράσιτα, τοῦ λέγαμε: «Σήματά σου ”μηδέν”, σήματά σου “ἕνα”[8]. Ἐλέγξατε καὶ ἐπαναλάβετε· ἀκατανόητον τὸ σῆμα σας». Ἀπὸ τὰ παράσιτα δὲν ἀκουγόταν ὁ ἄλλος. Ἔπρεπε τὰ σήματα νὰ εἶναι πάνω ἀπὸ «τρία». Τὰ σήματα «πέντε» ἀκούγονταν πολὺ καλά· ἡ ἐπικοινωνία πήγαινε ρολόι. Διαφορετικά, φώναζε-φώναζε, ἀλλὰ δὲν ἀκουγόταν, γιατὶ δὲν ἦταν καλὰ δικτυωμένος. Ἔπρεπε πρῶτα νὰ δικτυώση τὸν πομπὸ μὲ τὸν δέκτη τοῦ ἀσυρμάτου του καὶ μετὰ νὰ δικτυωθῆ στὴν ἴδια συχνότητα μὲ τὸ Κέντρο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἔτσι καὶ γιὰ νὰ δικτυωθοῦμε μὲ τὸν Θεό, πρέπει νὰ συντονίσουμε τὸν πομπό μας στὴν ἀγάπη καὶ τὸν δέκτη μας στὴν ταπείνωση, γιὰ νὰ μᾶς ἀκούη ὁ Θεὸς καὶ νὰ Τὸν ἀκοῦμε, γιατὶ σ’ αὐτὴν τὴν συχνότητα ἐργάζεται ὁ Θεός: Ἀγάπη-Ταπείνωση. Ὁ ἄνθρωπος πρέπει νὰ ἐργασθῆ, ὅσο μπορεῖ, ὥστε νὰ πιάση τὴν συχνότητα αὐτή. Τότε θὰ ἔχη ἐπαφὴ μὲ τὸν Θεὸ καὶ ὁ νοῦς του θὰ εἶναι συνέχεια στὸν Θεό. Εὔχομαι νὰ ἀποκτήσετε αὐτὴν τὴν θεία ἐπαφή. Ἀμήν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ ἰδιοτέλεια ἐμποδίζει τὴν ἐπικοινωνία μὲ τὸν Θεὸ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μοῦ εἴχατε πεῖ νὰ γεμίση ἡ μπαταρία μου μὲ πνευματικά. Πῶς θὰ γίνη αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ καλλιεργήσης τὴν πνευματικὴ ἀρχοντιά, τὸ φιλότιμο, γιὰ νὰ φύγη ἡ ἰδιοτέλεια. Ἡ ἰδιοτέλεια ἐμποδίζει τὴν προσευχή, γιατὶ χωρίζει τὸν ἄνθρωπο ἀπὸ τὸν Θεό· δημιουργεῖ μόνωση. Ξέρεις τί θὰ πῆ μόνωση; Εἶναι σὰν νὰ σοῦ λέη ὁ Θεός: «Δὲν σὲ καταλαβαίνω, παιδάκι μου!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ, Γέροντα, ἕνας μοναχὸς νὰ εἶναι συνεπὴς στὰ πνευματικά του καθήκοντα καὶ νὰ ὑστερῆ στὴν θυσία, στὴν ἀγάπη πρὸς τοὺς ἀδελφούς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ βέβαια μπορεῖ. Ἂν σκέφτεται μόνον τὸν ἑαυτό του, μπορεῖ νὰ κάνη προσευχές, μεγάλη ἄσκηση κ.λπ., ἀλλὰ νὰ ἔχη καὶ μεγάλη ἰδέα γιὰ τὸν ἑαυτό του καὶ νὰ ἀδιαφορῆ γιὰ τοὺς ἄλλους. Τότε ὅμως φτωχὸς πάντα θὰ μένη. Γιατί, ὅσο κανεὶς ἀσχολεῖται μὲ τὸν ἑαυτό του, ὄχι γιὰ νὰ ξερριζώση τὰ πάθη του, ἀλλὰ γιὰ νὰ κάνη ὅ,τι τὸν βολεύει, ὅ,τι τὸν εὐχαριστεῖ, δὲν μπορεῖ νὰ κάνη προκοπή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, καὶ στὸ διακόνημα καὶ σὲ ὅλη σου τὴν συμπεριφορὰ πρέπει νὰ εἶσαι ἐντάξει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σὲ ὅλα! Γιὰ νὰ ἔχης ἐπαφὴ μὲ τὸν Χριστό, πρέπει νὰ ἀναπαύεται ὁ Χριστὸς μὲ ὅλη τὴν ζωή σου. Καὶ ὁ Χριστὸς ἀναπαύεται, ὅταν ἀναπαύης τὸν πλησίον σου μὲ τὴν καλὴ ἔννοια. Γι’ αὐτὸ τονίζω τὴν πνευματικὴ ἀρχοντιά, τὴν θυσία. Γιατί, ἂν κάποιος κάνη πνευματικὰ καὶ δὲν προσέχη στὰ ἄλλα, στὴν θυσία κ.λπ., ἀχρηστεύονται καὶ τὰ πνευματικὰ ποὺ κάνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ὅταν εἶχα πάει στὸ Κοινόβιο[9], μὲ ἔβαλαν ὡς ἀρχάριο νὰ βοηθῶ τὸν τραπεζάρη. Τότε ἕνα γεροντάκι ὀγδόντα χρονῶν, τελείως ἐξαντλημένο, μοῦ ζήτησε νὰ τοῦ πηγαίνω στὸ κελλί του καμμιὰ σούπα. Τέλειωνα λοιπὸν τὴν διακονία μου καὶ τοῦ πήγαινα τὴν σούπα. Μιὰ μέρα μὲ εἶδε ἕνας ἀδελφὸς καὶ μοῦ εἶπε: «Μὴν τὸν καλομαθαίνης, γιατὶ μετὰ θὰ σοῦ ζητάη συνέχεια βοήθεια καὶ δὲν θὰ σὲ ἀφήνη νὰ ἡσυχάσης· οὔτε τὰ πνευματικά σου θὰ μπορῆς νὰ κάνης. Ἐγὼ ξέρεις τί ἔπαθα; Πῆγα μιὰ φορὰ λίγο νὰ τὸν βοηθήσω, γιατὶ ἦταν κρυωμένος, καὶ μετὰ δὲν μὲ ἄφηνε ἥσυχο· χτυποῦσε κάθε λίγο τὰκ-τὰκ τὸν τοῖχο. “Κάνε ἀγάπη, ἔλεγε, κάνε μου ἕνα τσάι”. “Κάνε ἀγάπη, ἔλα, γύρισέ με λίγο”. Ὕστερα ἀπὸ λίγο, τὰκ-τὰκ “κάνε ἀγάπη, βάλε μου ἕνα ζεστὸ τοῦβλο[10]”. Τοῦβλο-τσάι, τοῦβλο-τσάι, ποῦ νὰ προφθάσω μετὰ νὰ κάνω τὰ πνευματικά μου! Ἀγανάκτησα!». Ἀκοῦς ἐκεῖ πέρα; Εἶναι φοβερό! Τὸ γεροντάκι νὰ ὑποφέρη, νὰ βογγάη, νὰ τοῦ ζητάη κάτι γιὰ νὰ ἀνακουφισθῆ, καὶ ἐκεῖνος νὰ μὴ θέλη νὰ πάη, γιὰ νὰ μὴ διακόψη τὰ πνευματικά του! Αὐτὰ εἶναι τελείως ξερὰ πράγματα. Πιὸ πολὺ θὰ μετροῦσε γιὰ τὸν Θεὸ τὸ «τοῦβλο-τσάι» παρὰ οἱ μετάνοιες καὶ τὰ κομποσχοίνια ποὺ ἔκανε… καθ’ ὅλην τὴν ἐντέλειαν! Ἀπὸ τὴν μιὰ ἔλεγε:«Κύριε Ἰησοῦ Χριστέ, ἐλέησόν με», καὶ ἀπὸ τὴν ἄλλη: «Ἄσε με ἥσυχο»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς μπορεῖ νὰ ἔχη κανεὶς τὴν εὐλογία τοῦ Θεοῦ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὅταν ὁ ἄνθρωπος ἔχη συγγένεια μὲ τὸν Θεό, ὁ Θεὸς δίνει τὴν εὐλογία Του. Ἀλλιῶς τί νὰ δώση; Νὰ καταπατιέται ἡ εὐλογία Του; Τὸ ἔχω ζήσει αὐτό. Ὅταν εἶχα πάει στὸ Σινᾶ[11], ὑπῆρχε μεγάλη ἀνομβρία. Χρόνια εἶχε νὰ ρίξη μιὰ σταγόνα νερὸ καὶ αὐτὸ δυσκόλευε καὶ τὸ μοναστήρι καὶ τοὺς Βεδουίνους ποὺ ζοῦσαν κοντὰ σὲ αὐτό. Οἱ μοναχοὶ ἔκαναν προσευχὴ γιὰ τὴν ἀνομβρία, ἀλλὰ κανένα ἀποτέλεσμα. Τὴν ἐποχὴ τοῦ κλαδέματος τῶν ἐλιῶν[12]πῆγα νὰ βοηθήσω κι ἐγώ. Ἀφοῦ κλάδεψαν οἱ Βεδουίνοι τὰ δένδρα, οἱ μοναχοὶ κράτησαν τὰ χοντρὰ κλαδιὰ γιὰ τὸ μοναστήρι καὶ τὰ λεπτὰ τὰ ἄφησαν σὲ μία ἄκρη. Οἱ Βεδουίνοι τοὺς παρακαλοῦσαν νὰ τοὺς τὰ δώσουν, γιὰ νὰ τὰ χρησιμοποιήσουν στὴν φωτιά, ὅταν μαγειρεύουν, καὶ νὰ ζεσταίνωνται τὸ βράδυ ποὺ κάνει πολὺ κρύο· ἐκεῖνοι ὅμως ἀρνήθηκαν καὶ οἱ Βεδουίνοι ἔφυγαν λυπημένοι. Τὴν ἄλλη μέρα ποὺ ἦρθαν οἱ Βεδουίνοι καὶ τὰ ξαναζήτησαν, ἔκανα δεμάτια ὅλα τὰ λεπτὰ κλαδιὰ καὶ τοὺς τὰ ἔδωσα ὅλα. Τότε ἕνας ἡλικιωμένος Βεδουίνος μοῦ εἶπε: «Ἐσὺ εἶσαι καλὸς ἄνθρωπος· θὰ βρέξη». Πράγματι, μέχρι νὰ γυρίσω στὸ μοναστήρι, ἄρχισε νὰ βρέχη, καὶ ἔβρεξε πολύ. Ἡ εὐχὴ τοῦ Βεδουίνου ἄνοιξε τοὺς οὐρανούς. Τότε δὲν εἶπα σὲ κανέναν τὸ περιστατικὸ αὐτό.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ Θεὸς δὲν ἀκούει τὴν προσευχὴ τοῦ ὑπερήφανου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μετὰ ἀπὸ μιὰ ἄσχημη συμπεριφορά μου ἔχω τὸν λογισμὸ ὅτι ἡ προσευχή μου δὲν εἶναι εὐάρεστη στὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἂν ὁ λογισμὸς αὐτὸς προέρχεται ἀπὸ γνήσια ταπείνωση καὶ λές: «παροργίζω τὸν Θεὸ μὲ τὴν ἄσχημη συμπεριφορά μου», τότε νιώθεις θεία παρηγοριά. Ἂν ὅμως στενοχωριέσαι ἐγωιστικὰ καὶ λές: «πῶς ἔφθασα ἐγὼ σ’ αὐτὴν τὴν κατάσταση;», δὲν δέχεσαι παρηγοριά, γιατὶ«ὁ Θεὸς ὑπερηφάνοις ἀντιτάσσεται»[13]. Δὲν ἀκούει ὁ Θεὸς τὴν προσευχὴ τοῦ ὑπερήφανου, γιατὶ ἡ ὑπερηφάνεια εἶναι φράχτης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γιὰ νὰ εἰσακουσθῆ ἡ προσευχή μας, πρέπει νὰ βγαίνη ἀπὸ«καρδίαν συντετριμμένην καὶ τεταπεινωμένην»[14]. Ὅταν ποῦμε μὲ πολλὴ ταπείνωση: «τέτοιος ποὺ εἶμαι, Θεέ μου, πῶς νὰ μὲ ἀκούσης;», ἀμέσως μᾶς ἀκούει ὁ Καλὸς Θεός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, μερικὲς φορὲς ὅταν ἔχω ἕναν πειρασμό, δὲν μπορῶ νὰ προσευχηθῶ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν ἔχης ἕναν πειρασμὸ καὶ δὲν μπορῆς νὰ κάνης προσευχή, νὰ ξέρης ὅτι ὑπάρχει μέσα σου ἐγωισμὸς καὶ κενοδοξία. Ὁ πειρασμὸς παραμένει μέχρι νὰ σιχαθῆ ὁ ἄνθρωπος τὸν ἑαυτό του. Μόλις τὸν σιχαθῆ, βοηθάει ὁ Χριστὸς καὶ περνάει ὁ πειρασμός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παρακαλῶ τὸν Θεὸ νὰ μὲ βοηθήση νὰ ἀπαλλαγῶ ἀπὸ τὴν ἀναίδεια, ἀλλὰ δὲν βλέπω κανένα ἀποτέλεσμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν κάποιος ἀγωνίζεται καὶ προσεύχεται καὶ δὲν ὑπάρχη ἀποτέλεσμα, σημαίνει ὅτι ἢ ἐγωισμὸς καὶ ὑπερηφάνεια ὑπάρχει ἢ προδιάθεση ὑπερηφανείας, τὰ ὁποῖα ἐμποδίζουν τὴν Χάρη τοῦ Θεοῦ νὰ ἐνεργήση διὰ μέσου τῆς προσευχῆς. Ὅ,τι ζητᾶμε στὴν προσευχή, ὁ Καλὸς Θεὸς μᾶς τὸ δίνει, ἂν ἔχουμε ταπείνωση καὶ συναίσθηση τῆς ἁμαρτωλότητός μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, παρακαλῶ μὲ πόνο τὸν Θεὸ νὰ μὲ ἀπαλλάξη ἀπὸ μιὰ ἀδυναμία μου κάνοντας καὶ τὸν σχετικὸ ἀγώνα, ἀλλά, ἐπειδὴ ἔχω ὑπερηφάνεια, δὲν μὲ βοηθάη, τί νὰ κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ ζητήσης προκαταβολικῶς συγχώρηση ἀπὸ τὸν Θεό. Νὰ πῆς: «Θεέ μου, ἔχω ὑπερηφάνεια καὶ ἐμποδίζω τὴν βοήθειά Σου, ἀλλά, Σὲ παρακαλῶ, φώτισέ με νὰ καταλάβω τί πρέπει νὰ κάνω, γιὰ νὰ ξεπεράσω τὴν ἀδυναμία μου». Ἀπὸ τὴν στιγμὴ ποὺ θὰ παραδεχθῆς ὅτι ἔχεις ὑπερηφάνεια καὶ γι’ αὐτὸ δὲν ὑποχωρεῖ ἡ συγκεκριμένη ἀδυναμία, θὰ σὲ πληροφορήση ὁ Θεὸς καὶ ἀπὸ ποῦ ξεκινάει, γιὰ νὰ ἀγωνισθῆς νὰ κόψης τὰ αἴτια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς πρέπει νὰ νιώθω στὴν προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ νιώθης ταπεινά, γιὰ νὰ σὲ βοηθάη ὁ Θεός. Ὁ ταπεινὸς δὲν ἔχει δικό του θέλημα· κάνει ὑπακοὴ στὸ θέλημα τοῦ Θεοῦ καὶ τηρεῖ τὶς ἐντολές Του, ὁπότε καὶ ὁ Θεὸς ἀκούει τὴν προσευχή του καὶ τοῦ δίνει οὐράνιες εὐλογίες. Ὅσο ὁ ἄνθρωπος ἀκούει τὸν Θεό, τόσο τὸν ἀκούει ὁ Καλὸς Θεός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Στὴν προσευχὴ χρειάζεται ἐπιμονὴ καὶ ὑπομονὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μερικὲς φορές, ὅταν παρακαλῶ τὸν Θεὸ νὰ γίνη κάτι καὶ δὲν γίνεται, ἀναρωτιέμαι: «Ἄραγε ὁ Θεὸς ἀκούει τὴν προσευχή μου;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ «ἄραγε» σημαίνει ὅτι ἀμφιβάλλεις γιὰ τὴν ἀγάπη τοῦ Θεοῦ, κι ἔτσι ἀκυρώνεις τὴν αἴτησή σου τὴν ἴδια στιγμὴ ποὺ τὴν καταθέτεις, ὁπότε χάνεις καὶ τὴν σειρὰ προτεραιότητος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν ζητῶ, Γέροντα, κάτι ἀπὸ τὸν Θεὸ καὶ δὲν μοῦ τὸ δίνη ἀμέσως, νὰ ἐπιμένω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –Ναί, νὰ ἐπιμένης. Βλέπεις, καὶ ὅταν πᾶμε σὲ μιὰ ὑπηρεσία καὶ ἀπευθυνώμαστε σὲ κάποιο ἁρμόδιο πρόσωπο, γιὰ νὰ μᾶς βοηθήση σὲ μιὰ ὑπόθεση, μερικὲς φορὲς ἐπιμένουμε, γιὰ νὰ μᾶς ἐξυπηρετήση. «Σὲ παρακαλῶ, λέμε, κάνε μου αὐτὴν τὴν χάρη. Δὲν θὰ φύγω, ἂν δὲν μὲ ἐξυπηρετήσης». Ἔτσι καὶ στὴν προσευχὴ χρειάζεται νὰ ἐπιμένουμε, ὅπως ἐπέμενε ἡ Χαναναία στὸν Χριστὸ[15]καὶ ἡ χήρα στὸν ἄδικο κριτή[16].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὅταν ὅμως, Γέροντα, περνᾶ καιρὸς καὶ δὲν παίρνω ἀπάντηση, στενοχωριέμαι. – Ὅταν ζητᾶμε κάτι στὴν προσευχή μας, πρέπει νὰ περιμένουμε μὲ ὑπομονή. Μιὰ φορὰ εἶχε πρησθῆ τὸ μάτι μου καὶ πονοῦσε. Πῆγα τρεῖς φορὲς στὴν εἰκόνα τῆς Παναγίας καὶ Τὴν παρακάλεσα νὰ τὸ κάνη καλά, γιὰ νὰ μπορῶ τὶς νύχτες νὰ διαβάζω τὸ Ψαλτήρι. Πῆρα καὶ λίγο λαδάκι ἀπὸ τὸ καντήλι Της καὶ ἄλειψα τὸ μάτι, ὅμως δὲν θεραπεύτηκε. Σὲ λίγες μέρες ἄρχισε νὰ χειροτερεύη ἡ κατάσταση· τὸ μάτι πονοῦσε πολὺ καὶ πρηζόταν. Πέρασαν δεκαπέντε μέρες. Τότε πῆγα πάλι μὲ πολλὴ συστολὴ στὴν εἰκόνα τῆς Παναγίας καὶ εἶπα: «Παναγία μου, νὰ μὲ συγχωρῆς· πάλι θὰ Σὲ ἐνοχλήσω». Πῆρα ξανὰ λίγο λαδάκι ἀπὸ τὸ καντήλι καί, μόλις τὸ ἀκούμπησα στὸ μάτι, ἔγινε ἀμέσως καλά. Μήπως δὲν μποροῦσε ἡ Παναγία ἀπὸ τὴν πρώτη ἡμέρα νὰ μοῦ κάνη καλὰ τὸ μάτι; Κάτι ὅμως ἔβλεπε καὶ μὲ ἄφησε νὰ ταλαιπωροῦμαι. Κι ἐσὺ νὰ παρακαλᾶς ταπεινὰ καὶ νὰ περιμένης μὲ ὑπομονή. Ἡ προσευχὴ ποὺ γίνεται μὲ πίστη, πόνο, ἐπιμονὴ καὶ ὑπομονή, ἐφόσον αὐτὸ ποὺ ζητᾶμε εἶναι γιὰ τὸ καλό μας, εἰσακούεται.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Ἡ προετοιμασία γιὰ τὴν θεία ἐπικοινωνία
- type: h2
  initial:
    ru: ''
  text:
    ru: Ταπεινὴ ἐξομολόγηση στὸν Χριστὸ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ποιά προετοιμασία χρειάζεται νὰ κάνουμε γιὰ τὴν προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀνάλογη μὲ τὴν προετοιμασία ποὺ κάνουμε γιὰ τὴν Θεία Κοινωνία. Ἐκεῖ ἔχουμε Θεία Κοινωνία, ἐδῶ θεία ἐπικοινωνία. Ὅταν κοινωνοῦμε, παίρνουμε μέσα μας τὸν Χριστὸ καὶ ἔρχεται ἡ θεία Χάρις. Μὲ τὴν προσευχὴ ἔχουμε συνέχεια ἐπικοινωνία μὲ τὸν Χριστὸ καὶ δεχόμαστε μὲ ἄλλον τρόπο τὴν θεία Χάρη. Δὲν εἶναι μικρὸ πράγμα αὐτό! Τότε κοινωνοῦμε Σῶμα καὶ Αἷμα Χριστοῦ, τώρα ἐπικοινωνοῦμε μὲ τὸν Θεό. Ὅπως λοιπὸν γιὰ τὴν Θεία Κοινωνία ἐπιβάλλεται νὰ ἐξομολογηθῆ κανεὶς στὸν Πνευματικό, ἔτσι καὶ γιὰ τὴν προσευχή, ποὺ εἶναι θεία ἐπικοινωνία, πρέπει νὰ κάνη μιὰ ταπεινὴ ἐξομολόγηση στὸν Χριστό. «Χριστέ μου, νὰ πῆ, εἶμαι χάλια, εἶμαι τέτοιος, τέτοιος… Δὲν ἀξίζει νὰ ἀσχοληθῆς μὲ ἐμένα, ἀλλά, Σὲ παρακαλῶ, βοήθησέ με». Ἔτσι ἔρχεται ἡ θεία Χάρις καὶ μετὰ ἀρχίζει ἡ θεία ἐπικοινωνία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἂν δὲν μετανοήση ὁ ἄνθρωπος καὶ δὲν ἐξομολογηθῆ ταπεινὰ στὸν Θεό, μένει ἀτακτοποίητος. Αὐτὸ γίνεται φράχτης, ποὺ ἐμποδίζει τὴν ἐπικοινωνία του μὲ τὸν Θεό. Μένει ἡ πόρτα κλειστὴ καὶ ἡ ψυχὴ δὲν βρίσκει ἀνάπαυση. Ἐνῶ, ἂν πῆ «ἥμαρτον, Θεέ μου», σπάζει ὁ φράχτης ἢ μᾶλλον ἀνοίγει ὁ Θεὸς τὴν πόρτα, καὶ δέχεται ὁ ἄνθρωπος τὴν Χάρη τῆς θείας ἐπικοινωνίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, διάβασα στὴν Κλίμακα ὅτι γιὰ τὴν προσευχὴ πρέπει νὰ φορᾶμε τὴν στολὴ ποὺ ἁρμόζει νὰ φοράη κανείς, ὅταν πρόκειται νὰ παρουσιασθῆ σὲ βασιλιά[17]. Ποιά εἶναι ἡ στολὴ αὐτή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ ἐξευτελίζης τὸν ἑαυτό σου μπροστὰ στὸν Θεὸ καὶ νὰ ζητᾶς ταπεινὰ συγχώρηση γιὰ τὰ σφάλματά σου. «Ἔφταιξα, Θεέ μου, νὰ λές, εἶμαι ἀχάριστη. Σὲ λύπησα. Συγχώρεσέ με». Ἀλλὰ νὰ τὸ λὲς μὲ ἐσωτερικὴ συντριβή, ὄχι ἐξωτερικά. Αὐτὴ εἶναι ἡ στολὴ ποὺ ἁρμόζει νὰ φορᾶς, ὅταν συνομιλῆς μὲ τὸν Θεό. Ἂν δὲν προηγηθῆ αὐτό, εἶναι σὰν νὰ λὲς στὸν Θεό: «Τί κάνεις; τί χαμπάρια;». Ἂν πρέπει νὰ ζητᾶ κανεὶς συγχώρηση ἀπὸ τὸν ἄνθρωπο στὸν ὁποῖο σφάλλει, πόσο μᾶλλον πρέπει νὰ ζητᾶ συγχώρηση ἀπὸ τὸν Θεὸ γιὰ τὰ καθημερινὰ σφάλματά του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, νὰ σκέφτωμαι τὰ σφάλματα τῆς κάθε μέρας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ ζητᾶς συγχώρηση ἀπὸ τὸν Θεὸ γιὰ τὰ σφάλματα ποὺ ἔκανες μέσα στὴν ἡμέρα καὶ ὕστερα νὰ σκέφτεσαι τὴν ἁμαρτωλότητά σου γενικά. Ἔτσι ταπεινώνεσαι καὶ μετὰ ἀρχίζεις τὰ αἰτήματα ποὺ ἔχεις. Ἐγὼ ἀρχίζω τὴν προσευχὴ μὲ τὸ«ὁ Θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ»[18]. Τὸ λέω λίγες φορὲς ψιθυριστὰ καὶ μετὰ συνεχίζω μὲ τὴν εὐχή. Κάποτε εἶχα παρακαλέσει τὸν Θεὸ νὰ μὲ μάθη νὰ προσεύχωμαι. Καὶ τότε εἶδα σὲ ὅραμα ἕνα παιδὶ δεκαεπτὰ χρονῶν νὰ προσεύχεται. Ὤ, μὲ εἶχε διαλύσει! Ἔκλαιγε καὶ προσευχόταν μὲ τέτοιον τρόπο ποὺ μὲ συγκλόνισε. Ἄρχιζε μὲ ἐξομολόγηση: «Εἶμαι ἀχάριστος, ἀδιόρθωτος…». Ὕστερα ἔλεγε: «Τώρα, Θεέ μου, ποὺ εἶμαι σὲ τέτοια κατάσταση, πῶς θὰ μπορέσω νὰ διορθωθῶ, ἂν δὲν μὲ βοηθήσης Ἐσύ;» καὶ ἄρχιζε τὰ αἰτήματα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλὲς φορὲς στὴν διάρκεια τῆς προσευχῆς μὲ ἀπασχολοῦν τὰ σφάλματά μου καὶ δὲν μπορῶ νὰ συγκεντρωθῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἴπαμε νὰ ἐξετάζουμε τὸν ἑαυτό μας καὶ νὰ ἐξομολογούμαστε τὰ σφάλματά μας, πρὶν ἀρχίσουμε τὴν προσευχή, ὄχι τὴν ὥρα τῆς προσευχῆς. Αὐτὸ δὲν εἶναι αὐτοκριτική· εἶναι συζήτηση μὲ τὸ ταγκαλάκι. Πρὶν ἀπὸ τὴν προσευχὴ θὰ σκεφτοῦμε τί δὲν πάει καλὰ μὲ τὸν ἑαυτό μας, θὰ στρέψουμε τὸν νοῦ μας ἐκεῖ, θὰ ρυθμίσουμε τὸ κλισιοσκόπιο[19], καὶ μετά… πῦρ!
- type: h2
  initial:
    ru: ''
  text:
    ru: «Πρῶτον διαλλάγηθι»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἂν ἀπὸ ἀπροσεξία κάνω ἕνα σφάλμα καὶ δὲν τὸ καταλάβω, γιὰ νὰ ζητήσω συγχώρηση ἀπὸ τὴν ἀδελφὴ τὴν ὁποία λύπησα, μπορεῖ στὴν προσευχὴ νὰ ἔχω ἐπικοινωνία μὲ τὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιὰ νὰ ἐπικοινωνήσης μὲ τὸν Θεὸ καὶ νὰ βρῆς ἀνάπαυση, πρέπει νὰ παρακολουθῆς τὸν ἑαυτό σου καὶ νὰ ἔχης συνεχῆ ἐγρήγορση, γιὰ νὰ καταλαβαίνης τὰ σφάλματά σου, νὰ μετανοῆς καὶ νὰ ζητᾶς συγχώρηση. Διαφορετικά, ἀκόμη κι ἂν νιώθης κάποια χαρὰ στὴν προσευχή, αὐτὴ δὲν θὰ εἶναι χαρὰ πνευματική. Δὲν θὰ ἔχης μέσα σου τὸ πνευματικὸ φτερούγισμα ποὺ προέρχεται ἀπὸ τὴν ἐπικοινωνία μὲ τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καμμιὰ φορά, Γέροντα, ὅταν πάω νὰ προσευχηθῶ, ἔχω μέσα μου μιὰ ἀνησυχία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν ἔχης ἀνησυχία ἐσωτερικὴ ἢ νιώθης τὴν καρδιά σου σκληρή, νὰ ξέρης ὅτι κάποια ἀδελφὴ θὰ πλήγωσες καὶ γι’ αὐτὸ νιώθεις ἔνοχη. Ἂν τῆς ζητήσης συγχώρηση, θὰ φύγη ἡ ἀνησυχία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ προσευχή, Γέροντα, δὲν μπορεῖ νὰ διώξη αὐτὴν τὴν ἀνησυχία; Χρειάζεται ὁπωσδήποτε νὰ ζητήσω συγχώρηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, ἂν στενοχωρήσης μιὰ ἀδελφή, δὲν μπορεῖς νὰ τὸ τακτοποιήσης αὐτὸ μόνο μὲ τὴν προσευχή. Πρέπει νὰ πᾶς νὰ τῆς βάλης μετάνοια καὶ νὰ τῆς ζητήσης συγγνώμη. Ἂν δὲν βάλης μετάνοια στὴν ἀδελφή, καὶ τριακόσιες μετάνοιες νὰ κάνης στὸ κελλί σου, δὲν πιάνουν. Δὲν τακτοποιοῦνται ἔτσι αὐτὰ τὰ πράγματα.«Πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου»[20], λέει τὸ Εὐαγγέλιο, καὶ ὕστερα πρόσφερε τὸ δῶρο σου[21]. Ἐκτὸς ἐὰν δὲν μπορῆς νὰ τὴν βρῆς ἐκείνη τὴν ὥρα, ἀλλὰ ἔχης μετανοιώσει γιὰ τὸ σφάλμα σου καὶ εἶσαι ἀποφασισμένη, μόλις τὴν συναντήσης, νὰ τῆς ζητήσης συγγνώμη· τότε ἡ προσευχή σου γίνεται δεκτὴ ἀπὸ τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἂν γίνη μιὰ παρεξήγηση μὲ κάποια ἀδελφή, ὅταν πάω στὸ κελλί μου, εἰρηνεύω καὶ μπορῶ νὰ προσευχηθῶ. Μετά, ὅμως, ὅταν συναντήσω τὴν ἀδελφή, εἶμαι σκληρὴ ἀπέναντί της καὶ μπορεῖ νὰ τὴν ἀποφύγω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν τὸ καταλαβαίνω αὐτό. Ἂν παρεξηγηθῆς μὲ μιὰ ἀδελφή, πῶς πᾶς στὸ κελλί σου καὶ εἰρηνεύεις; Ἂν δὲν τῆς βάλης μετάνοια, πῶς μπορεῖς νὰ εἰρηνεύσης καὶ νὰ προσευχηθῆς; Ἂν εἶχες μέσα σου τὴν εἰρήνη τοῦ Θεοῦ, ἡ καρδιά σου θὰ εἶχε μαλακώσει μετὰ τὴν προσευχὴ ποὺ ἔκανες στὸ κελλὶ καί, μόλις θὰ συναντοῦσες τὴν ἀδελφή, θὰ τὸ θεωροῦσες εὐλογία ἀπὸ τὸν Θεὸ καὶ δὲν θὰ τὴν ἀπέφευγες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, δικαιολογῶ τὸ σφάλμα μου καὶ ἔτσι μπορῶ καὶ προσεύχομαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί προσευχὴ εἶναι αὐτή; Μόνον ἂν ὁ ἄνθρωπος πάρη τὸ σφάλμα ἐπάνω του καὶ πῆ «εὐλόγησον»[22], ἔρχεται ἡ Χάρις τοῦ Θεοῦ, καὶ μπορεῖ νὰ ἐπικοινωνήση μὲ τὸν Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ προσευχὴ εἶναι «κριτήριον πρὸ κριτηρίου»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Ἅγιος Ἰωάννης τῆς Κλίμακος λέει ὅτι ἡ προσευχὴ εἶναι«κριτήριον πρὸ κριτηρίου»[23].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔτσι εἶναι. Ὅταν ὁ ἄνθρωπος προσεύχεται σωστά, τότε ἡ προσευχὴ εἶναι«κριτήριον πρὸ κριτηρίου». Ὅποιος ἔχει ὑγεία πνευματική, ὅταν πάη νὰ προσευχηθῆ καὶ αἰσθανθῆ τὴν καρδιά του σκληρή, θὰ ἐξετάση ἀπὸ ποῦ προέρχεται αὐτό, γιὰ νὰ τὸ διορθώση. «Γιατί αἰσθάνομαι ἔτσι; θὰ πῆ. Μήπως πλήγωσα κάποιον μὲ τὴν συμπεριφορά μου; Μήπως κατέκρινα ἢ μοῦ πέρασε λογισμὸς κατακρίσεως καὶ δὲν τὸ κατάλαβα; Μήπως μοῦ πέρασε κανένας ὑπερήφανος λογισμὸς ἢ ὑπάρχει μέσα μου κάποιο θέλημα καὶ δὲν μὲ ἀφήνει νὰ ἐπικοινωνήσω μὲ τὸν Θεό;».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κι ἄν, Γέροντα, δὲν βρίσκη τίποτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν μπορεῖ· κάτι θὰ ἔχη συμβῆ. Ἂν ψάξη στὸ ἀρχεῖο – ἀνακρίνη δηλαδὴ τὸν ἑαυτό του –, θὰ βρῆ τὸν φάκελλο καὶ θὰ καταλάβη σὲ τί ἔφταιξε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ ἀνακρίνη, Γέροντα, τὸν ἑαυτό του ἢ νὰ ἐξομολογηθῆ στὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί νὰ ἐξομολογηθῆ, ἀφοῦ δὲν ξέρει τί ἔχει κάνει; Πρῶτα πρέπει νὰ ἀνακρίνη τὸν ἑαυτό του. Κι ἂν δὲν βρίσκη τίποτε, τότε νὰ κάνη δυὸ-τρεῖς μετάνοιες, νὰ πέση στὰ γόνατα καὶ νὰ πῆ: «Θεέ μου, πάντως σὲ κάτι ἔχω σφάλει. Φώτισέ με νὰ καταλάβω τί ἔκανα». Μόλις τὸ πῆ αὐτό, ἀμέσως μὲ τὴν ταπείνωση θὰ φύγη ἡ ὁμίχλη τοῦ πειρασμοῦ καὶ θὰ βρῆ τὴν αἰτία. Βλέποντας δηλαδὴ ὁ Θεὸς τὴν ταπείνωσή του, στέλνει τὴν Χάρη Του καὶ τὸν φωτίζει νὰ θυμηθῆ ἀκριβῶς σὲ τί ἔφταιξε, γιὰ νὰ τακτοποιηθῆ.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί βοηθάει, Γέροντα, γιὰ νὰ διατηρῆ κανεὶς σταθερὴ τὴν ἐπικοινωνία του μὲ τὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολὺ βοηθάει ἡ ἐσωτερικὴ εἰρήνη τῆς ψυχῆς. Ὅταν ἡ ψυχὴ εἶναι τακτοποιημένη, ἡ προσευχὴ προχωράει μόνη της. Γι’ αὐτὸ νὰ μὴν ἀφήνης μέσα σου κακία γιὰ κανέναν. Ἂν ἔβαλες ἀριστερὸ λογισμὸ γιὰ κάποιον, νὰ τὸν ἐξαγορευθῆς στὴν Γερόντισσα. Νὰ διώξης καὶ κάθε ἄλλον ἀριστερὸ λογισμὸ ποὺ ἔχεις, φέρνοντας καλοὺς λογισμούς. Μὲ τοὺς καλοὺς λογισμοὺς καθαρίζει ὁ δρόμος, καὶ ἡ προσευχὴ προχωράει ἄνετα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Δεύτερο Μέρος – Ὁ Ἀγώνας Γιὰ Τὴν Προσευχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ὅταν νιώση κανεὶς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τὶς μεγάλες εὐλογίες τοῦ Θεοῦ,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: δυναμώνει, θερμαίνεται ἡ καρδιά,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καὶ φθάνει καὶ στὴν ἀδιάλειπτη προσευχή».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Οἱ δυσκολίες στὴν προσευχὴ
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ ἀκηδία ἀχρηστεύει τὸν ἄνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, τί διαφορὰ ὑπάρχει ἀνάμεσα στὴν ἀκηδία καὶ τὴν ραθυμία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀκηδία εἶναι ἡ πνευματικὴ τεμπελιά, ἐνῶ ἡ ραθυμία ἀναφέρεται καὶ στὴν ψυχὴ καὶ στὸ σῶμα. Καλύτερα ὅμως νὰ λείψουν καὶ τὰ δύο. Ἡ ἀκηδία καὶ ἡ ραθυμία μερικὲς φορὲς κολλοῦν καὶ σὲ ψυχὲς ποὺ ἔχουν πολλὲς προϋποθέσεις γιὰ πνευματικὴ ζωή, ποὺ ἔχουν εὐαισθησία, φιλότιμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ ἕναν ἀδιάφορο ὁ πειρασμὸς δὲν κάνει τόσο κακό. Ἕνας εὐαίσθητος ὅμως ἄνθρωπος, ἂν στενοχωρηθῆ, νιώθει μετὰ ἀκηδία. Πρέπει νὰ βρῆ τί τὸν στενοχώρησε καὶ νὰ τὸ ἀντιμετωπίση πνευματικά, γιὰ νὰ ξαναβρῆ τὸ κουράγιο καὶ νὰ πάρη μπρὸς ἡ μηχανή του. Νὰ προσέχη νὰ μὴν ἀφήνη ἀθεράπευτες πληγές, γιατὶ μετὰ κάμπτεται ἀπὸ τὰ τραύματά του. Τὸ ψυχικὸ τσάκισμα, τὸ ὁποῖο στὴν συνέχεια φέρνει καὶ τὸ σωματικό, τὸν ἀχρηστεύει. Ὁ γιατρὸς δὲν βρίσκει τίποτε, γιατὶ τὴν βλάβη τὴν ἔχει προκαλέσει ὁ πειρασμός. Πόσες ψυχὲς ποὺ ἔχουν φιλότιμο, εὐαισθησία, τὶς βλέπω ἀχρηστευμένες!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αἰσθάνομαι ἐξάντληση καὶ δὲν μπορῶ νὰ κάνω καθόλου πνευματικά[24]. Αὐτὸ προέρχεται ἀπὸ κούραση ἢ μήπως εἶναι ἀπὸ ραθυμία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –«Ἀπὸ τῶν πολλῶν μου ἁμαρτιῶν ἀσθενεῖ τὸ σῶμα, ἀσθενεῖ μου καὶ ἡ ψυχή»[25], δὲν λέει; Δὲν εἶναι κούραση σωματική· ψυχικὸ τσάκισμα εἶναι. Αὐτὸ εἶναι χειρότερο ἀπὸ τὴν σωματικὴ κούραση. Μὲ τὸ ψυχικὸ τσάκισμα ξεβιδώνεται κανεὶς καὶ γίνεται σὰν ἕνα ὄχημα ποὺ ὅλα τὰ ἐξαρτήματά του εἶναι καλά, ἀλλὰ ἡ μηχανή του εἶναι διαλυμένη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βλέπω ὅτι, ἐνῶ πρῶτα ἀγαποῦσα τὰ πνευματικά, τώρα δὲν μπορῶ νὰ κάνω τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί δὲν μπορεῖς νὰ κάνης τίποτε; Δὲν ἔχεις δυνάμεις; Ἐγὼ βλέπω ὅτι ἔχεις. Δὲν θυμᾶσαι παλιά, ὅταν χτιζόταν τὸ μοναστήρι καὶ δούλευες ὅλη μέρα στὸ γιαπί, πόσα πνευματικὰ ἔκανες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, φταίει ποὺ ἔδωσα ὅλον τὸν ἑαυτό μου στὶς δουλειές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πιὸ πολὺ φταίει ποὺ ἄφησες τὸν ἑαυτό σου χαλαρό. Κοίταξε νὰ τὸν σκληραγωγήσης· νὰ ἀγαπήσης τὴν ἄσκηση. Ἐγώ, ποὺ ἔχω μισὸ πνεύμονα, ξέρεις πόσες μετάνοιες κάνω; Δὲν μπορῶ νὰ σοῦ πῶ. Μόνο γιὰ τὰ κομποσχοίνια, ποὺ κάνω μὲ μικρὲς μετάνοιες, σοῦ λέω ὅτι, ὅταν κουράζεται τὸ ἕνα χέρι, κάνω τὸν σταυρὸ μὲ τὸ ἄλλο. Αὐτὰ σοῦ τὰ λέω ἀπὸ ἀγάπη. Ἄλλοι δὲν ἔχουν τὶς προϋποθέσεις ποὺ ἔχεις ἐσύ, καὶ ξέρεις πῶς ἀγωνίζονται, πῶς παλεύουν; Ἐσὺ γιὰ λοκατζῆς κάνεις! Πῶς ἄφησες ἔτσι τὸν ἑαυτό σου; Ἐγὼ θὰ προσεύχωμαι γιὰ σένα, ἀλλά, γιὰ νὰ βοηθηθῆς, πρέπει κι ἐσὺ νὰ κάνης μιὰ προσπάθεια. Κατάλαβες; Στὰ πνευματικὰ πρέπει νὰ δώσης ὅλον τὸν ἑαυτό σου, καὶ τότε θὰ ἀποδώσης καὶ στὴν διακονία σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικὲς φορές, ὅταν εἶμαι στὸ κελλί, μὲ πιάνει ἀκηδία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στὸ κελλί σου δὲν προσεύχεσαι, δὲν μελετᾶς; Ὅσο μπορεῖς, νὰ μὴν ἀφήνης νὰ περνάη ὁ χρόνος χωρὶς νὰ κάνης τίποτε. Δὲν μπορεῖς νὰ προσευχηθῆς; Ἂς μελετήσης κάτι ποὺ σὲ βοηθάει ἐκείνη τὴν ὥρα. Διαφορετικὰ ὁ διάβολος μπορεῖ νὰ ἐκμεταλλευθῆ τὴν ἄσχημη κατάστασή σου καὶ νὰ σὲ ἐξουθενώση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ μὴν κόβουμε τὸ σχοινὶ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μετὰ τὴν ἐπικοινωνία σας μὲ τόσο κόσμο, ἐνῶ τὸ βράδυ φαίνεσθε πολὺ ταλαιπωρημένος, τὸ πρωὶ δὲν ὑπάρχει στὸ πρόσωπό σας ἴχνος ἀπὸ τὴν ταλαιπωρία αὐτήν, ἀλλὰ εἶστε φωτεινός. Πῶς γίνεται αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔμ, δὲν κόβω τὸ σχοινί[26]!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μερικὲς φορές, Γέροντα, ὅταν λόγῳ διακονίας δὲν πάω στὸ Ἀπόδειπνο καὶ εἶμαι πολὺ κουρασμένη, λέω: «θὰ ξαπλώσω καὶ θὰ λέω τὴν εὐχή», ἀλλὰ τελικὰ μὲ παίρνει ὁ ὕπνος καὶ δὲν κάνω τίποτε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, εὐλογημένη, ἀκόμη καὶ ὅταν εἶσαι πολὺ κουρασμένη, νὰ μὴν πέφτης στὸ κρεββάτι, χωρὶς νὰ κάνης καθόλου προσευχή. Νὰ λὲς ἕνα«Τρισάγιο» καὶ τὸν 50ο Ψαλμό, νὰ ἀσπάζεσαι τὴν εἰκόνα τοῦ Χριστοῦ καὶ τῆς Παναγίας, νὰ σταυρώνης τὸ μαξιλάρι σου καὶ μετὰ νὰ ξαπλώνης. Νὰ βάζης καὶ τὸ ρολόι μιὰ ὥρα πρὶν ἀπὸ τὴν Ἀκολουθία, γιὰ νὰ σηκωθῆς νὰ κάνης τὸν κανόνα σου. Χρειάζεται βία, ἀλλὰ νὰ νιώσης τὴν βία ὡς ἀνάγκη, νὰ τὸ κάνης μὲ τὴν καρδιά σου.«Ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ Θεός»[27].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ ὅταν, Γέροντα, δὲν ἔχω καθόλου κουράγιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ βιάσης τὸν ἑαυτό σου νὰ κάνη κάτι πνευματικό. Νὰ φροντίζης κάθε μέρα νὰ κάνης ἔστω καὶ λίγη μελέτη καὶ λίγη προσευχή. Ἡ μελέτη, ἡ προσευχή, ἡ ψαλμωδία εἶναι βιταμίνες ποὺ χρειάζεται κάθε μέρα ἡ ψυχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Νὰ μὴν ἀφήνουμε τὴν ἡμέρα νὰ περνάη χωρὶς καθόλου προσευχή. Θυμᾶμαι στὸν πόλεμο, ὅταν περνοῦσαν μέρες χωρὶς νὰ κάνουμε ἐπίθεση, ρίχναμε καὶ καμμιὰ τουφεκιά. Ἀλλιῶς θὰ ἔλεγαν οἱ ἐχθροί: «αὐτοὶ κοιμοῦνται» καὶ θὰ μᾶς ἔκαναν αἰφνιδιασμό. Τὸ ἴδιο νὰ κάνουμε καὶ στὸν πνευματικὸ ἀγώνα. Ὅταν καμμιὰ φορὰ νιώθουμε ἐξάντληση καὶ δὲν μποροῦμε νὰ κάνουμε ὅλα τὰ πνευματικά μας καθήκοντα, νὰ μὴν κόβουμε τὸ σχοινί, τὴν ἐπικοινωνία μὲ τὸν Θεό· νὰ κάνουμε λίγες μετάνοιες, κανένα κομποσχοίνι. Νὰ ρίχνουμε δηλαδὴ κανα-δυὸ ριπές, γιὰ νὰ μὴ μᾶς αἰχμαλωτίση τὸ ταγκαλάκι. Καί, μόλις συνέλθουμε, νὰ ἀρχίζουμε πάλι κανονικὰ τὸν ἀγώνα μας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν κανεὶς ἀφήνη τὰ πνευματικά, ἂν δὲν κάνη ἔστω καὶ λίγες μετάνοιες, κανένα κομποσχοίνι, μετὰ ἀγριεύει. Δουλειὲς μπορεῖ νὰ κάνη, προσευχὴ ὅμως ὄχι. Βλέπω μοναχοὺς ποὺ κάνουν συνέχεια δουλειὲς καὶ ἀφήνουν τὴν μελέτη καὶ τὴν προσευχή. «Ἂς κάνω κι αὐτό, λένε, ἂς κάνω καὶ τὸ ἄλλο», καὶ ἡ προσευχὴ μένει, καὶ τελικὰ ἀγριεύουν, γίνονται σὰν κοσμικοί. Ἔχω δεῖ ἐργάτες ποὺ μπορεῖ νὰ πελεκᾶνε πέτρες μέσα στὸν ἥλιο ἢ νὰ κόβουν ξύλα ὅλη μέρα, ἀλλὰ τριπλὸ μεροκάματο νὰ τοὺς δώσης, μισὴ ὥρα στὴν ἐκκλησία δὲν μποροῦν νὰ σταθοῦν· βγαίνουν ἔξω καὶ καπνίζουν. Τὸ ἔχω παρατηρήσει αὐτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν ὁ ἄνθρωπος δὲν προσεύχεται, ἀπομακρύνεται ἀπὸ τὸν Θεὸ καὶ γίνεται σὰν τὸ βόδι· δουλεύει, τρώει, κοιμᾶται. Καὶ ὅσο ἀπομακρύνεται ἀπὸ τὸν Θεό, τόσο πιὸ δύσκολα γίνονται τὰ πράγματα. Ψυχραίνεται ἡ καρδιά του, καὶ ὕστερα δὲν μπορεῖ καθόλου νὰ προσευχηθῆ. Γιὰ νὰ συνέλθη, πρέπει νὰ μαλακώση ἡ καρδιά του, νὰ πάρη στροφὴ μετανοίας, νὰ συγκλονισθῆ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ ἔχης τὴν διάθεση νὰ ἀρχίσης
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ἔχω ἀμέλεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀ-μέλεια; Γιατὶ σοῦ λείπει τὸ …μέλι! Δὲν ἔχεις, φαίνεται, γλυκαθῆ ἀπὸ τὰ πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μετὰ ἀπὸ μιὰ περίοδο ἀμελείας, βοηθάει νὰ ξεκινήσω σιγὰ-σιγά; Τὴν μιὰ μέρα νὰ κάνω ἕνα κομποσχοίνι, τὴν ἄλλη δύο κ.λπ.;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ ἔχης τὴν διάθεση νὰ ἀρχίσης καὶ νὰ βιάσης λίγο τὸν ἑαυτό σου, γιὰ νὰ βάλης μιὰ ἀρχή. Ἀκόμη καὶ κουρασμένος ἂν εἶναι κανείς, ἂν βιάση λίγο τὸν ἑαυτό του, περνάει ἡ κούραση καὶ νιώθει καλά. Αὐτὴ ἡ μικρὴ προσπάθεια ποὺ κάνει, ἔχει μεγάλη σημασία, γιατὶ ὁ Θεὸς τὴν διάθεση θέλει γιὰ νὰ ἐπέμβη· καὶ αὐτὸ εἶναι ποὺ θὰ μᾶς σώση, ἡ θεία ἐπέμβαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἀκόμη καὶ ὅταν ἔχω χρόνο, δὲν ἔχω διάθεση νὰ κάνω πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔ, συμβαίνει καμμιὰ φορὰ αὐτὴ ἡ ἀνορεξία, ἀλλὰ χρειάζεται λίγη βία. Ὅταν κανεὶς εἶναι ἀδιάθετος, συνήθως δὲν ἔχει ὄρεξη γιὰ φαγητό, ἀλλὰ βιάζει τὸν ἑαυτό του καὶ τρώει. Ἔχει-δὲν ἔχει ὄρεξη, τρώει κάτι ἐλαφρὺ στὴν ἀρχή, γιατὶ δὲν σηκώνει τὸ στομάχι του, καὶ ἔρχεται σιγὰ-σιγὰ ἡ ὄρεξη. Ἂν δὲν φάη, πῶς θὰ στυλωθῆ; Ἔτσι κι ἐσύ, δὲν πρέπει νὰ ἀφήσης τὸν ἑαυτό σου ρέμπελο, γιατὶ θὰ καταστραφῆ. Νὰ τοῦ δώσης ἐλαφριὰ πνευματικὴ τροφή, ὥστε σιγὰ-σιγὰ νὰ συνέλθη. Νὰ κάνης μιὰ προσπάθεια λίγο-λίγο, γιὰ νὰ ἀρχίσης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πράγματι, Γέροντα, ἡ δυσκολία μου εἶναι νὰ ἀρχίσω νὰ κάνω πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, γιατὶ τὰ λάδια σου εἶναι παγωμένα. Νὰ κάνης λίγες μετάνοιες, λίγη μελέτη, λίγο κομποσχοίνι, γιὰ νὰ ζεσταθῆ ἡ καρδιά. Νὰ λές: «Θὰ κάνω μόνον πέντε μετάνοιες». Ἂν πάρη μπρὸς ἡ μηχανή, μετὰ δὲν θὰ μπορῆς νὰ τὴν σταματήσης· φρενάρισμα θὰ θέλη.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ δίνουμε στὴν ψυχὴ τὴν τροφὴ ποὺ ἐπιθυμεῖ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν δὲν ἔχω ὄρεξη γιὰ πνευματικά, πῶς νὰ βάλω ἀρχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ κάνης κάτι πνευματικὸ ποὺ σὲ εὐχαριστεῖ, καὶ θὰ σοῦ ἔρθη ἡ ὄρεξη καὶ γιὰ τὰ ἄλλα. Νὰ ἁπλώσης μπροστά σου τὴν πνευματικὴ τράπεζα καὶ νὰ βρῆς τί τραβᾶ ἡ ὄρεξή σου. Θέλεις νὰ διαβάσης λίγο; Θέλεις νὰ κάνης ἕνα κομποσχοίνι; Θέλεις νὰ κάνης μιὰ Παράκληση; Θέλεις νὰ διαβάσης Ψαλτήρι ἢ νὰ κάνης λίγες μετάνοιες; Ἂν δὲν ἔχης ὄρεξη γιὰ τίποτε, ἔ, τότε θέλεις βρεγμένη σανίδα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀπὸ ἐργόχειρο, Γέροντα, μπορῶ νὰ ἀρχίσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖς, ἀλλὰ νὰ λὲς συγχρόνως καὶ τὴν εὐχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως ὅμως, Γέροντα, κάνοντας ὅ,τι μὲ εὐχαριστεῖ, κάνω τὸ θέλημά μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, στὰ πνευματικὰ πρέπει νὰ δίνουμε στὴν ψυχὴ τὴν τροφὴ ποὺ ἐπιθυμεῖ καὶ ζητάει μόνη της. Ἔτσι γλυκαίνεται, τρέφεται καὶ παρακινεῖται γιὰ περισσότερα πνευματικά. Βλέπεις, καὶ ὅταν ἀρρωσταίνουμε καὶ ζητᾶ κάτι ὁ ὀργανισμός μας, τοῦ τὸ δίνουμε, γιὰ νὰ γίνουμε καλά. Μικρός, εἶχα ἀρρωστήσει ἀπὸ ἀναιμία, καὶ ζητοῦσα νὰ φάω λεμόνι. Οἱ δικοί μου ὅμως, ἐπειδὴ δὲν ἤξεραν ἂν ἔπρεπε νὰ φάω λεμόνι, δὲν μοῦ ἔδιναν καὶ περίμεναν τὸν γιατρό. Καὶ τελικά, ὅταν ἦρθε ὁ γιατρός, συνέστησε νὰ τρώω λεμόνια, γιατὶ ὁ ὀργανισμός μου εἶχε ἀνάγκη ἀπὸ βιταμίνες ποὺ περιέχονται στὰ λεμόνια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιὰ νὰ ἀντιμετωπίσω αὐτὸν τὸν καιρὸ τὴν ἀμέλεια, ἔκανα μιὰ προσπάθεια νὰ ἐφαρμόσω ἕνα πρόγραμμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ πρόγραμμα καλὸ εἶναι, ἀλλὰ πρέπει πρῶτα νὰ μπῆ ἡ καρδιὰ καὶ μετὰ τὸ πρόγραμμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, νὰ μοῦ βάζατε ἐσεῖς ἕνα πρόγραμμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ πρόγραμμα ποὺ θὰ σοῦ βάλω, εἶναι νὰ κάνης ὅ,τι πνευματικὸ σὲ εὐχαριστεῖ. Νὰ μὴ στρυμώχνης μὲ ἄγχος τὸν ἑαυτό σου, ἀλλὰ νὰ ἐξετάζης ἀπὸ τί εἴδους πνευματικὴ τροφὴ ἔχει ἀνάγκη ἡ ψυχή σου καὶ νὰ τῆς τὸ δίνης. Ὅταν νιώθης τὴν ἀνάγκη νὰ ψάλης, νὰ ψάλλης· ὅταν σὲ τραβάη ἡ μελέτη, νὰ μελετᾶς· ὅταν σὲ τραβάη ἡ εὐχή, νὰ λὲς τὴν εὐχή. Νὰ κάνης καὶ ὅ,τι ἄλλο πνευματικὸ ἐπιθυμεῖς, ἀρκεῖ νὰ μὴν καταπιέζης τὸν ἑαυτό σου. Νομίζω ὅτι κατάλαβες. Αὐτὸ θὰ γίνη τώρα στὶς ἀρχές, μέχρι νὰ γλυκαθῆ ἡ ψυχή σου, καὶ μετὰ θὰ μπῆς σὲ μιὰ πνευματικὴ σειρὰ ποὺ θὰ σὲ τραβάη ἀπὸ μόνη της. Μὴν ἀνησυχῆς λοιπόν, μὲ τὴν Χάρη τοῦ Θεοῦ θὰ πάρη μπρὸς ἡ μηχανή σου καὶ θὰ τρέχης.
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ προσευχώμαστε ἀπὸ φιλότιμο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μὲ τόση κούραση ποὺ ἔχετε, πῶς μπορεῖτε καὶ προσεύχεσθε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐμένα ἡ προσευχὴ μὲ ξεκουράζει. Καὶ ἔχω δεῖ ὅτι μόνον ἡ προσευχὴ ξεκουράζει πραγματικὰ τὸν ἄνθρωπο. Ὅταν γίνεται μὲ τὴν καρδιά, διώχνει καὶ τὴν κούραση καὶ τὸν ὕπνο καὶ τὴν πεῖνα, γιατὶ θερμαίνεται ἡ ψυχή, καὶ ὕστερα δὲν θέλεις οὔτε νὰ κοιμηθῆς οὔτε νὰ φᾶς. Ζῆς σὲ μιὰ ὑπερφυσικὴ κατάσταση καὶ τρέφεσαι διαφορετικά· σὲ τρέφουν τὰ πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δὲν ἔχω ἀγάπη γιὰ τὴν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν ἔχει θερμανθῆ ἀκόμη ἡ καρδιά σου καὶ ἡ προσευχὴ δὲν γίνεται ἀπὸ μέσα· τὰ κάνεις ὅλα ἀπὸ μιὰ πειθαρχία, ξερά. Πῶς ξεκινᾶς τὴν προσευχή σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀρχίζω, Γέροντα, μὲ τὴν σκέψη ὅτι πρέπει νὰ προσεύχωμαι γιὰ μένα καὶ γιὰ ὅλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἄ, παράξενος ἄνθρωπος εἶσαι! Ἐσὺ πᾶς μὲ ἕνα «πρέπει»· «πρέπει νὰ προσεύχωμαι, πρέπει νὰ κάνω πνευματικά, πρέπει, πρέπει...», καὶ ζορίζεσαι. Καλὸ εἶναι ποὺ ὑπάρχει μέσα σου αὐτὴ ἡ δύναμη, ἀλλὰ νὰ ξεκινᾶς μὲ ἕναν ταπεινὸ λογισμό, μὲ ἕναν πόνο. Νὰ δουλέψη, νὰ πονέση ἡ καρδιά, καὶ τότε δὲν θὰ ζορίζεσαι· θὰ νιώθης χαρά, θὰ ὑπάρχη μέσα σου μιὰ ἐσωτερικὴ ἀγαλλίαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νιώθω ἕνα σφίξιμο· δὲν ὑπάρχει μέσα μου πνευματικὸ φτερούγισμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Χαίρεσαι, ὅταν προσεύχεσαι; Γιατὶ νομίζω ὅτι ζορίζεσαι λίγο. Πηγαίνεις μὲ φιλότιμο νὰ κάνης κάτι, ἀλλά, χωρὶς νὰ τὸ καταλαβαίνης, μπαίνει καὶ λίγος ἐγωισμός. «Νὰ κάνω τόσες μετάνοιες, λές, νὰ κάνω τόσα κομποσχοίνια, νὰ αὐξήσω τὶς μετάνοιες, νὰ αὐξήσω τὰ κομποσχοίνια». Καὶ αὐτὸ ὄχι γιὰ τὴν ἀγάπη τοῦ Χριστοῦ ἢ γιὰ κάποιον ποὺ ἔχει ἀνάγκη, ἀλλὰ γιὰ νὰ κάνης πολλά, νὰ ἁγιάσης. Δὲν λὲς δηλαδὴ ταπεινά: «ἀφοῦ ὁ Θεὸς εἶπε“ἅγιοι γίνεσθε”[28], θὰ κάνω κι ἐγὼ ὅ,τι μπορῶ», ἀλλὰ πᾶς μὲ μιὰ ξερὴ λογική: «πρέπει νὰ ἁγιάσω».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς νὰ σφίξω τὸν ἑαυτό μου στὴν προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί νὰ σφίξης τὸν ἑαυτό σου στὴν προσευχὴ καὶ νὰ μὴν προσεύχεσαι ἀπὸ φιλότιμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς θὰ γίνη αὐτό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν σκεφθῆς τὶς εὐεργεσίες τοῦ Θεοῦ, θὰ σκεφθῆς καὶ τὸν Θεό, τὸν Εὐεργέτη σου, καὶ θὰ συναισθανθῆς τὴν ἀχαριστία σου καὶ τὴν ἁμαρτωλότητά σου καὶ θὰ ζητήσης τὸ ἔλεός Του. Ὅταν νιώση κανεὶς τὶς μεγάλες εὐλογίες τοῦ Θεοῦ, δυναμώνει, θερμαίνεται ἡ καρδιά, καὶ φθάνει καὶ στὴν ἀδιάλειπτη προσευχή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ περισπασμὸς στὴν προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν προσεύχωμαι στὸ κελλί μου, ἔχω ἀνησυχία μήπως κάποια ἀδελφὴ ἀνοίξη τὴν πόρτα, καὶ αὐτὸ μοῦ φέρνει περίσπαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἐγώ, ἂν εἶμαι σὲ κατάσταση προσευχῆς καὶ ἀνοίξη κάποιος τὴν πόρτα, προτιμῶ νὰ μὲ χτυπήση μὲ τὸ τσεκούρι στὸ κεφάλι, παρὰ νὰ μὲ δῆ ἐκείνη τὴν ὥρα ποὺ προσεύχομαι. Εἶναι σὰν νὰ πετᾶς καὶ ἔρχεται ὁ ἄλλος καὶ σοῦ σπάζει τὰ φτερά. Ἐσεῖς δὲν ἔχετε ζήσει ἀκόμη πνευματικὲς καταστάσεις τὴν ὥρα τῆς προσευχῆς, γιὰ νὰ καταλάβετε πόσο στοιχίζει σὲ κάποιον νὰ τὸν ἐνοχλήσετε τὴν ὥρα ποὺ προσεύχεται. Δὲν ἔχετε νιώσει αὐτὴν τὴν ἐπικοινωνία μὲ τὸν Θεό, ποὺ ὁ ἄνθρωπος φεύγει κατὰ κάποιον τρόπο ἀπὸ τὴν γῆ. Ἂν εἴχατε τέτοιες ἐμπειρίες, θὰ σεβόσασταν τοὺς ἄλλους, ὅταν προσεύχωνται. Ἂν ὑπῆρχε αὐτὴ ἡ εὐαισθησία ἡ πνευματική, θὰ σκεφτόσασταν: «Πῶς νὰ διακόψω τὸν ἄλλον τὴν ὥρα ποὺ προσεύχεται;». Θὰ καταλαβαίνατε τί μεγάλη ζημία τοῦ κάνετε καὶ θὰ προσέχατε. Δὲν λέω νὰ προσέχετε μὲ ἄγχος καὶ μὲ σφίξιμο, ἀλλὰ μὲ σεβασμὸ πρὸς τὸν ἄλλον ποὺ ἐπικοινωνεῖ μὲ τὸν Θεό. Ἀλλά, ἂν δὲν ὑπάρχη αὐτὴ ἡ πνευματικὴ εὐαισθησία, νὰ ὑπάρχη τοὐλάχιστον ἡ κοσμικὴ εὐαισθησία, μὲ τὴν καλὴ ἔννοια. Νὰ συνηθίσετε νὰ χτυπᾶτε τὴν πόρτα καὶ νὰ λέτε δυνατά:«Δι’ εὐχῶν τῶν Ἁγίων Πατέρων», γιὰ νὰ εἶναι ἥσυχος ὁ ἄλλος καὶ νὰ μὴν εἶναι συνέχεια σὲ ἐπιφυλακή. Ἄλλο νὰ εἶμαι σὲ ἐγρήγορση πνευματικὴ καὶ ἄλλο νὰ εἶμαι συνέχεια σὲ ἐπιφυλακή, μήπως ἀνοίξουν τὴν πόρτα· αὐτὸ κουράζει, τσακίζει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ, Γέροντα, κάποια νὰ τὸ κάνη ἀπὸ ἁπλότητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν εἶναι ἁπλότητα νὰ χτυπάη μιὰ ἀδελφὴ τὴν πόρτα τῆς ἄλλης καί, χωρὶς νὰ ἀκούση τὸ«Ἀμήν», νὰ ἀνοίγη καὶ νὰ μπαίνη μέσα. Ἀπορῶ, πῶς τὸ κάνετε αὐτό! Μπορεῖ ἡ ἄλλη νὰ κλαίη στὴν προσευχὴ καὶ δὲν θέλει νὰ τὴν δοῦν. Ἐγώ, ὅταν πηγαίνω σὲ κάποιο γειτονικὸ Κελλὶ καὶ ἀκούω νὰ διαβάζουν τὴν Ἀκολουθία τοῦ Ἑσπερινοῦ, μπορεῖ νὰ κάνω καὶ μία ὥρα κομποσχοίνι ἔξω στὸ κρύο, γιὰ νὰ μὴν τοὺς διακόψω καὶ κουτσουρέψουν τὴν Ἀκολουθία. Ἀφοῦ τοὺς ἀκούω ὅτι ψάλλουν, πῶς νὰ ἀνοίξω τὴν πόρτα; Πῶς νὰ μπῶ; Ἂν μπῶ, εἶναι σὰν νὰ ἔχω δικαιώματα. Μπορεῖ ἐκεῖνοι νὰ μοῦ δίνουν δικαιώματα, ἀλλὰ ἐγὼ δὲν τὸ κάνω αὐτό· εἶναι ἐγωιστικό, σὰν νὰ εἶμαι κάτι καὶ δὲν ὑπολογίζω τὸν ἄλλον. Νὰ ὑπάρχη αὐτὴ ἡ ἐσωτερικὴ εὐαισθησία. Μιὰ φορά, ὅταν ἤμουν στὸ Σινᾶ, εἶδα δύο Βεδουινάκια, ἕνα ἀγοράκι κι ἕνα κοριτσάκι, νὰ προσεύχωνται στὸν δρόμο μὲ κομπολόγια καὶ γύρισα σιγὰ-σιγὰ πίσω, γιὰ νὰ τελειώσουν τὰ καημένα τὴν προσευχή τους καὶ νὰ συνεχίσω μετὰ τὸν δρόμο μου, γιατὶ δὲν ὑπῆρχε ἄλλο πέρασμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μόλις ἀρχίσω νὰ προσεύχωμαι, ἔρχονται στὸν νοῦ μου οἱ ἐκκρεμότητες ποὺ ἔχω στὸ διακόνημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κι ἐγώ, ἅμα ἔχω ἐκκρεμότητες, δὲν μπορῶ νὰ ἡσυχάσω. Γι’ αὐτό, ἂν θέλης νὰ μὴν ἔχης περισπασμὸ τὴν ὥρα τῆς προσευχῆς, νὰ τακτοποιῆς γρήγορα-γρήγορα τὶς ἐκκρεμότητες ποὺ ἔχεις καὶ ὕστερα νὰ ἀρχίζης τὴν προσευχή, λέγοντας στὸν λογισμό σου: «Ὅλα εἶναι τακτοποιημένα καλύτερα ἀπὸ τὴν ψυχή μου. Ἂς φροντίσω λοιπὸν νὰ τακτοποιήσω καὶ αὐτήν».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σκέφτομαι ὅτι, ἂν εἶχα κάποια δυσκολία στὴν ζωή μου, αὐτὸ θὰ μὲ βοηθοῦσε στὴν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί εἶναι αὐτὰ ποὺ λές; Πόλεμος πρέπει νὰ γίνη, γιὰ νὰ ζητήσης τὸν Χριστό; Μιὰ καλὴ ἐξωτερικὴ κατάσταση εἶναι ἡ καλύτερη προϋπόθεση γιὰ τὴν καλὴ ἐσωτερικὴ κατάσταση. Ἡ προσευχὴ θέλει νὰ εἶναι κανεὶς ἀπερίσπαστος ἐξωτερικὰ καὶ τακτοποιημένος ἐσωτερικά. Τὸ ἀπερίσπαστο πολὺ βοηθάει στὴν πνευματικὴ ζωή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Στεῖλτε τὸν ὕπνο σὲ ὅσους δὲν μποροῦν νὰ κοιμηθοῦν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί νυστάζω, ὅταν προσεύχωμαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δὲν ζῆς ἔντονα. Ἄφησες χαλαρὸ τὸν ἑαυτό σου καὶ τώρα πᾶς σπρώχνοντας. Ἂν ἔχης ἀγωνία γιὰ ἕνα θέμα ποὺ σὲ ἀπασχολεῖ, μπορεῖς νὰ κοιμηθῆς; Βλέπεις, κάποιος ἀπὸ εὐγνωμοσύνη γιὰ τὸν εὐεργέτη του μπορεῖ νὰ μὴν κοιμηθῆ μιὰ βραδιά, γιὰ νὰ κάνη προσευχὴ γι’ αὐτόν. Μετὰ ὅμως πρέπει νὰ σκεφθῆ: «Καλά, γιὰ τὸν ἄνθρωπο ποὺ μὲ εὐεργέτησε, ἀγρύπνησα· γιὰ τὸν Θεό, ποὺ σταυρώθηκε γιὰ μένα, νὰ μὴν ἀγρυπνήσω, γιὰ νὰ Τὸν εὐχαριστήσω;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεῖ ἡ ὑπνηλία νὰ προέρχεται ἀπὸ σωματικὴ ἀδυναμία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, καμμιὰ φορὰ ἡ ὑπνηλία προέρχεται καὶ ἀπὸ ἐξάντληση, ἀπὸ ὑπόταση ἢ ὑποθερμία κ.λπ. Νὰ βρίσκη κανεὶς τὴν αἰτία καὶ νὰ ἐνεργῆ ἀνάλογα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς συμβαίνει, ἐνῶ προσεύχεται κανεὶς μὲ πόνο γιὰ κάτι, νὰ τὸν παίρνη ὁ ὕπνος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν πραγματικὰ ὑπάρχη πόνος γιὰ ἕνα θέμα, τότε δὲν τὸν πιάνει ὑπνηλία τὸν ἄνθρωπο. Χρειάζεται ὅμως νὰ βιάση καὶ λίγο τὸν ἑαυτό του. Ἂν εἶναι στὸ κελλί, νὰ ρίξη λίγο νερὸ στὸ πρόσωπο, γιὰ νὰ φύγη ὁ ὕπνος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στὶς ἀγρυπνίες νυστάζω πολύ· τί νὰ κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ τὸν τσακίζης τὸν ὕπνο. Στὴν ἐκκλησία, ἐπειδὴ ὁ ἄνθρωπος ἠρεμεῖ ψυχικὰ καὶ κουράζεται σωματικά, νυστάζει. Ἀλλά, ὅταν ἐπιμείνης νὰ μὴ σὲ πάρη ὁ ὕπνος, τότε ὁ ὕπνος τσακίζεται καὶ φεύγει. Βέβαια ὕστερα ἀπὸ μιὰ-δυὸ ὧρες πάλι νυστάζεις, κι ἐκεῖνος ὁ ὕπνος εἶναι βαρὺς καὶ πιὸ δύσκολα τὸν διώχνεις· μὲ τὴν ἐπιμονὴ ὅμως τσακίζεται καὶ αὐτός. Ἂν φύγη ἡ πρώτη καὶ ἡ δεύτερη ἁμαξοστοιχία τοῦ ὕπνου, πάει μετὰ ὁ ὕπνος, ἔφυγε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεῖ σὲ μιὰ ἀγρυπνία καὶ δύο ὧρες νὰ προσπαθῶ νὰ διώξω τὸν ὕπνο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί δὲν τὸν στέλνεις στὰ νοσοκομεῖα, στὰ ψυχιατρεῖα; «Θεέ μου, νὰ λές, δῶσε τὸν ὕπνο σὲ ὅσους δὲν μποροῦν νὰ κοιμηθοῦν, εἴτε γιατὶ πονοῦν εἴτε γιατὶ εἶναι τεντωμένα τὰ νεῦρα τους». Νὰ κάνης τὸν ὕπνο χάπι καὶ νὰ τὸν στέλνης μὲ τὴν προσευχὴ σὲ ὅσους δὲν μποροῦν νὰ κοιμηθοῦν καὶ ταλαιπωροῦνται οἱ καημένοι, κι ἐσὺ μέρα-νύχτα νὰ δοξάζης τὸν Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Ὁ διάβολος πολεμᾶ τὸν προσευχόμενο
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ μὴν πιάνουμε κουβεντούλα μὲ τὸν διάβολο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ἐνῶ αἰσθάνομαι τὴν ἀνάγκη ἐπικοινωνίας μὲ τὸν Θεό, δὲν μπορῶ νὰ προσευχηθῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν νιώθης τὴν ἀνάγκη νὰ ἐπικοινωνήσης μὲ τὸν Θεό, δὲν καταλαβαίνω γιατί νὰ μὴν μπορῆς νὰ προσευχηθῆς. Ἴσως νὰ εἶναι καὶ τοῦ πειρασμοῦ. Ὁ πειρασμὸς πάντοτε βάζει τρικλοποδιές, γιὰ νὰ μὴν μπορέση νὰ προσευχηθῆ ὁ ἄνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὴν ὥρα τῆς προσευχῆς μὲ ἀπασχολοῦν διάφορες δουλειές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ λές: «Αὐτὸ θὰ τὸ σκεφτῶ ἀργότερα...» καὶ νὰ συνεχίζης νὰ προσεύχεσαι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πιὸ πολύ, Γέροντα, στενοχωριέμαι, ἐπειδὴ τὶς περισσότερες φορὲς εἶναι ἐπουσιώδη πράγματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γι’ αὐτὸ ἀκριβῶς νὰ τὰ ἀφήνης γιὰ ἀργότερα, γιατί, ἂν διακόπτης τὴν προσευχὴ καὶ ἀσχολῆσαι μὲ αὐτά, ὁ πειρασμὸς θὰ ἀφήση τὰ ἐπουσιώδη καὶ θὰ σοῦ φέρη οὐσιώδη, γιὰ νὰ σταματήσης τελείως τὴν προσευχή. Πρέπει νὰ βάζουμε τὸν ἑαυτό μας στὴν θέση του. Γιατὶ ξέρεις τί κάνει τὸ ταγκαλάκι; Στοὺς κοσμικοὺς φέρνει βρώμικες σκέψεις καὶ τὸ καταλαβαίνουν ἀμέσως. Στοὺς πνευματικοὺς ὅμως ἀνθρώπους φέρνει διάφορα μπανταλὰ[29]καὶ δὲν τὸ καταλαβαίνουν. Αὐτὸ εἶναι πιὸ ἐπικίνδυνο, γιατὶ νομίζουν ὅτι πᾶνε καλά, ἐπειδὴ δὲν ἔχουν βρώμικους λογισμούς, κι ἔτσι οὔτε ταπεινώνονται, ἀλλὰ καὶ ὁ νοῦς τους γυρνᾶ δεξιὰ καὶ ἀριστερὰ καὶ ἡ καρδιά τους μένει πέτρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικὲς φορές, Γέροντα, τὴν ὥρα τῆς προσευχῆς μοῦ ἔρχεται μιὰ ἰδέα· βρίσκω μιὰ λύση γιὰ ἕνα θέμα, ἡ ὁποία μετὰ ἀποδεικνύεται ἐσφαλμένη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὁ διάβολος εἶναι πονηρός. Ξέρει ὅτι, ἂν τὴν ὥρα τῆς προσευχῆς σοῦ φέρη βρώμικο λογισμό, θὰ τὸν τινάξης πέρα. Γι’ αὐτὸ σοῦ δίνει λύσεις σὲ κάποιο πρόβλημά σου, ὁπότε λές: «Ἀφοῦ τὴν ὥρα τῆς προσευχῆς τὸ σκέφθηκα, ἄρα εἶναι ἔμπνευση!». Ἂν ἤθελε ὁ διάβολος τὸ καλό σου, ἄλλες ὧρες θὰ σοῦ τὰ ἔφερνε αὐτὰ στὸν νοῦ, ὄχι τὴν ὥρα τῆς προσευχῆς. Μπαίνει ὅμως «ἐνδιάμεσος» καὶ πιάνει μαζί σου τὴν κουβεντούλα! Γι’ αὐτὸ νὰ μὴ δίνης καθόλου σημασία. «Σ’ εὐχαριστῶ γιὰ τὸ ἐνδιαφέρον σου, νὰ τοῦ λές, ἀλλὰ νὰ μοῦ λείπη!». Πάει, βλέπεις, μὲ πονηριὰ νὰ ξεγελάση τὸν πνευματικὸ ἄνθρωπο μὲ πνευματικὲς σκέψεις, ὁπότε«ἡ προσευχὴ αὐτοῦ, ὅπως λέει ὁ Δαβίδ,γενέσθω εἰς ἁμαρτίαν»[30].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὴν ὥρα τῆς προσευχῆς ἔρχονται στὸν νοῦ μου ἄσχημοι λογισμοὶ ἢ ἄσχημες εἰκόνες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὸ εἶναι ἔργο τοῦ διαβόλου, γιὰ νὰ σὲ συγχύζη. Ἰδίως ὅταν εἶσαι κουρασμένη σωματικά, καὶ περισσότερο ὅταν σοῦ λείπη ὕπνος, βρίσκει τὸ ταγκαλάκι κάποια στιγμὴ ποὺ εἶσαι μεταξὺ ὕπνου καὶ ἐγρηγόρσεως καὶ σοῦ παρουσιάζει ἄσχημες εἰκόνες, γιὰ νὰ σοῦ πῆ μετὰ ὅτι εἶναι δικές σου καὶ νὰ σὲ ρίξη σὲ ἀπελπισία. Μὴ δίνης σημασία. Νὰ λὲς τὸ«Κύριε ἐλέησον»καὶ νὰ σκέφτεσαι τὸν Χριστό, τὴν Παναγία, τοὺς Ἀγγέλους, γιὰ νὰ συγκεντρώνεσαι στὴν προσευχή. Ἔτσι θὰ κάνης ἀντιπερισπασμὸ στὸν διάβολο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ διάβολος ἐμποδίζει τὸν ἄνθρωπο ἀπὸ τὴν προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν προγραμματίζω νὰ ἀγρυπνήσω στὸ κελλὶ καὶ παρουσιάζεται κάποιο ἐμπόδιο, τί φταίει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιὰ νὰ ἐπιτρέψη ὁ Θεὸς ἐμπόδιο, κάτι καλύτερο θὰ βγῆ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ ὅταν, Γέροντα, αὐτὸ γίνεται συνέχεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε θὰ ὑπάρχη ὑπερηφάνεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν καταλαβαίνω, Γέροντα, νὰ ὑπάρχη ὑπερηφάνεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, ἐξαρτᾶται καὶ ἀπὸ τὸ πῶς τοποθετεῖς τὰ πράγματα. Ἂν βάζης πρῶτα τὶς δουλειὲς καὶ ὕστερα τὴν προσευχή, δίνεις δικαίωμα στὸν πειρασμὸ καὶ σοῦ φέρνει ἐμπόδια. Ἀλλά, ὅταν κάποιος δίνη μεγαλύτερη ἀξία στὶς δουλειὲς ἀπ’ ὅ,τι στὰ πνευματικά, αὐτὸ δὲν ἔχει μέσα ὑπερηφάνεια; Καὶ ὑπερηφάνεια ἔχει καὶ ἀνευλάβεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί κάνει ὁ πειρασμὸς γιὰ νὰ ἐμποδίση κάποιον νὰ προσευχηθῆ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί κάνει; Βρίσκει χίλιους δυὸ τρόπους. Μόλις ἀρχίση ὁ ἄνθρωπος τὴν προσευχή, μπορεῖ νὰ τοῦ φέρη μετεωρισμὸ ἢ προσπαθεῖ νὰ διασκορπίση τὸν νοῦ του μὲ φαντασίες, θορύβους κ.λπ. Νὰ δῆς τί γινόταν, ὅταν ἤμουν στὴν Μονὴ Στομίου[31]! Ἕνα βράδυ εἶχα πάει νὰ προσευχηθῶ μέσα στὸν ναό. Ἡ πύλη τοῦ μοναστηριοῦ ἦταν κλειστὴ καὶ στὴν πόρτα τοῦ ναοῦ εἶχα βάλει τὸ μάνταλο. Κατὰ τὰ μεσάνυχτα ἄρχισε τὸ ταγκαλάκι νὰ χτυπάη τὸ μάνταλο συνέχεια «κρίκι-κρίκι» καὶ δὲν σταματοῦσε, γιὰ νὰ μὲ κάνη νὰ πάω νὰ δῶ τί συμβαίνει. Μπῆκα στὸ Ἱερό, γιὰ νὰ μὴν ἀκούω, καὶ ἐκεῖ, πίσω ἀπὸ τὴν Ἁγία Τράπεζα, κοντὰ στὸν Ἐσταυρωμένο, ἔμεινα μέχρι τὸ πρωί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ὁ Σταυρὸς τοῦ Χριστοῦ ἔχει μεγάλη δύναμη. Ὅταν ἤμουν δόκιμος μοναχός, μὲ πολεμοῦσαν πολὺ τὰ ταγκαλάκια. Τὸ βράδυ, ποὺ ἤμουν στὸ κελλί, μοῦ χτυποῦσαν συνεχῶς τὴν πόρτα καὶ ἔλεγαν:«Δι’ εὐχῶν τῶν Ἁγίων Πατέρων». Ἄνοιγα τὴν πόρτα καί, παρόλο ποὺ δὲν ἔβλεπα κανέναν, μὲ ἔπιανε φόβος. Μετά, δὲν μὲ χωροῦσε ὁ τόπος· μοῦ ἦταν ἀδύνατον νὰ μείνω μέσα στὸ κελλί. Ὑπέφερα, ἔκλαιγα, ἔκανα προσευχή, τίποτε. Ἔβγαινα ἔξω. Ἕνα βράδυ, μετὰ τὸ Ἀπόδειπνο, μὲ βλέπει ἔξω ἕνας Προϊστάμενος τῆς Μονῆς. «Παιδί μου, μοῦ λέει, γιατί δὲν πᾶς στὸ κελλάκι σου; Βλέπεις κανέναν Πατέρα νὰ γυρνάη ἔξω; Οἱ Πατέρες κάνουν προσευχὴ στὰ κελλιά τους». Ἄρχισα νὰ κλαίω καὶ τοῦ εἶπα τί συμβαίνει. Μοῦ φέρνει τότε λίγο Τίμιο Ξύλο σὲ ἕνα κεράκι καὶ μοῦ λέει: «Πήγαινε, παιδί μου, ἥσυχος τώρα στὸ κελλί σου». Μόλις ἔκλεισα τὴν πόρτα, ἄκουσα ἀμέσως δυνατά:«Δι’ εὐχῶν τῶν Ἁγίων Πατέρων».«Ἀμήν», εἶπα. Ἀνοίγει ἡ πόρτα καὶ μπαίνει ἕνας ἀστυνομικὸς μὲ πλήρη στολή. Τὰ γαλόνια τὰ φοροῦσε λοξὰ στὸ μανίκι, ὅπως παλιὰ οἱ ἀστυνομικοί, καὶ ἄρχισε νὰ φωνάζη: «Ἔ, παλιοκαλόγερε, ἐσὺ ἀδιάβαστος[32], τί τὸ ἔχεις αὐτὸ τὸ ξύλο;». Καὶ ἄρχισε νὰ γελάη μὲ τό... «γλυκό» του γέλιο. Φώναζε, ἀλλὰ δὲν μποροῦσε νὰ πλησιάση, γιατὶ εἶχα τὸ Τίμιο Ξύλο.«Κύριε Ἰησοῦ Χριστέ»,φώναξα, καὶ ἔγινε καπνὸς ὁ «ἀστυνομικός»!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Γιὰ νὰ θερμανθῆ ἡ καρδιὰ στὴν προσευχὴ
- type: h2
  initial:
    ru: ''
  text:
    ru: Οἱ ἱερὲς εἰκόνες βοηθοῦν στὴν προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ὅταν εἶμαι στενοχωρημένη, πῶς θὰ βρῶ παρηγοριά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ καταφύγης στὴν προσευχή. Καὶ μόνον τὸ κεφάλι σου νὰ ἀκουμπήσης σὲ μία εἰκόνα, θὰ βρῆς παρηγοριά. Κάνε τὸ κελλί σου σὰν ἐκκλησάκι μὲ εἰκόνες ποὺ σὲ ἀναπαύουν, καὶ νὰ δῆς, θὰ βρίσκης μέσα σὲ αὐτὸ πολλὴ παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικὲς φορές, Γέροντα, κατὰ τὴν ὥρα τῆς προσευχῆς ἀσπάζομαι τὶς εἰκόνες. Εἶναι σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σωστὸ εἶναι. Κανονικὰ ἔτσι πρέπει νὰ ἀσπαζώμαστε τὶς εἰκόνες: Νὰ ξεχειλίζη ἡ καρδιά μας ἀπὸ ἀγάπη πρὸς τὸν Χριστό, τὴν Παναγία καὶ τοὺς Ἁγίους, καὶ νὰ πέφτουμε, νὰ προσκυνοῦμε τὶς ἅγιες εἰκόνες τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μιὰ χρονιά[33], στὶς 26 Μαρτίου, ποὺ γιορτάζουμε τὴν Σύναξη τοῦ Ἀρχαγγέλου Γαβριήλ, προσευχόμουν ὄρθιος μπροστὰ στὶς εἰκόνες τοῦ Χριστοῦ καὶ τῆς Παναγίας. Γιὰ μιὰ στιγμὴ βλέπω τὸν Χριστὸ καὶ τὴν Παναγία νὰ κινοῦνται σὰν ζωντανοί! «Χριστέ μου, εἶπα, εὐλόγησέ με. Παναγία μου, εὐλόγησέ με». Καί, καθὼς ἔπεφτα νὰ προσκυνήσω, μιὰ ἔντονη εὐωδία γέμισε τὸ κελλί. Μὲ ἔπιασε τρέλλα! Τὸ χαλάκι ποὺ εἶχα στρωμένο κάτω, ἂν καὶ ἦταν γεμάτο χῶμα, ἀκόμη καὶ αὐτὸ εὐωδίαζε. Ἔμεινα γονατιστὸς καὶ ἀσπαζόμουν αὐτὸ τὸ χαλάκι. Τέτοια εὐωδία!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν προσεύχωμαι, βοηθάει νὰ φέρω στὸν νοῦ μου τὴν εἰκόνα τοῦ Χριστοῦ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, ὅταν προσεύχεσαι μπροστὰ σὲ μιὰ εἰκόνα, ἡ εἰκόνα βοηθάει, γιατὶ ἀπὸ τὴν εἰκόνα περνᾶς στὸ εἰκονιζόμενο πρόσωπο[34]. Ὅταν ὅμως προσεύχεσαι νοερῶς καὶ εἶσαι σκυμμένη μὲ κλειστὰ τὰ μάτια, δὲν πρέπει νὰ φέρνης στὸν νοῦ σου μὲ τὴν φαντασία σου εἰκόνες, γιατὶ μπορεῖ νὰ τὸ ἐκμεταλλευθῆ τὸ ταγκαλάκι καὶ νὰ σοῦ τὰ παρουσιάση σὰν ὁράματα, γιὰ νὰ σὲ πλανήση καὶ νὰ σοῦ κάνη κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἰδίως ἡ εὐχὴ καλὰ εἶναι νὰ γίνεται μὲ καθαρὸ νοῦ, χωρὶς λογισμοὺς ἢ παραστάσεις, ἔστω κι ἂν αὐτὲς εἶναι εἰκόνες τοῦ Χριστοῦ ἢ παραστάσεις ἀπὸ τὴν Ἁγία Γραφή, γιατὶ αὐτὸ εἶναι ἐπικίνδυνο, ἰδιαίτερα γιὰ ὅσους ἔχουν πολλὴ φαντασία καὶ ὑπερηφάνεια. Μόνον ὅταν ἔρχωνται ρυπαροὶ ἢ βλάσφημοι λογισμοί, μποροῦμε νὰ χρησιμοποιήσουμε παραστάσεις ἀπὸ τὴν Ἁγία Γραφή. Ἡ καλύτερη ὅμως «παράσταση» εἶναι ἡ συναίσθηση τῆς ἁμαρτωλότητός μας καὶ τῆς ἀχαριστίας μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Τὸ κομποσχοίνι: τὸ αὐτόματο ὅπλο κατὰ τοῦ διαβόλου'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά σημασία ἔχει τὸ κομποσχοίνι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ κομποσχοίνι εἶναι μιὰ κληρονομιά, μιὰ εὐλογία, ποὺ μᾶς ἔχουν ἀφήσει οἱ Ἅγιοι Πατέρες μας. Καὶ μόνo γι’ αὐτὸ ἔχει μεγάλη ἀξία. Βλέπεις, σὲ κάποιον ἀφήνει ὁ παπποῦς του κληρονομιὰ ἕνα ἀσήμαντο πράγμα καὶ τὸ ἔχει μετὰ σὰν φυλαχτό, πόσο μᾶλλον τὸ κομποσχοίνι ποὺ μᾶς τὸ ἄφησαν κληρονομιὰ οἱ Ἅγιοι Πατέρες!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά, ποὺ δὲν ὑπῆρχαν ρολόγια, οἱ μοναχοὶ μετροῦσαν τὴν ὥρα τῆς προσευχῆς μὲ τὸ κομποσχοίνι, ἀλλὰ οἱ κόμποι τοῦ κομποσχοινιοῦ ἦταν ἁπλοί. Κάποτε ἕνας ἀσκητὴς ἔκανε πολὺ ἀγώνα, πολλὲς μετάνοιες κ.λπ., καὶ ὁ διάβολος πήγαινε καὶ ἔλυνε τοὺς κόμπους τοῦ κομποσχοινιοῦ του. Ἔκανε-ἔκανε μετάνοιες ὁ καημένος καὶ ἀπέκαμε, γιατὶ δὲν μποροῦσε νὰ τὶς μετρᾶ, ἀφοῦ ὁ διάβολος τοῦ ἔλυνε συνέχεια τοὺς κόμπους. Τότε παρουσιάσθηκε Ἄγγελος Κυρίου καὶ τοῦ δίδαξε πῶς νὰ πλέκη τοὺς κόμπους, ὥστε σὲ κάθε κόμπο νὰ σχηματίζωνται ἐννέα σταυροί. Ὁ διάβολος μετά, ὁ ὁποῖος τρέμει τὸν σταυρό, δὲν μποροῦσε νὰ τοὺς λύση. Ἔτσι κάθε κόμπος τοῦ κομποσχοινιοῦ ἔχει ἐννέα σταυρούς, ποὺ συμβολίζουν τὰ ἐννέα τάγματα τῶν Ἀγγέλων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί σημαίνουν οἱ τριάντα τρεῖς, οἱ πενῆντα, οἱ ἑκατὸ καὶ οἱ τριακόσιοι κόμποι ποὺ ἔχουν τὰ κομποσχοίνια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μόνον ὁ ἀριθμὸς τριάντα τρία εἶναι συμβολικός· συμβολίζει τὰ τριάντα τρία χρόνια ποὺ ἔζησε ὁ Χριστὸς ἐπάνω στὴν γῆ. Οἱ ἄλλοι ἀριθμοὶ ἁπλῶς μᾶς βοηθοῦν νὰ μετρᾶμε τὶς μετάνοιες ποὺ κάνουμε ἢ πόσες φορὲς θὰ ποῦμε τὴν εὐχή. Μερικὲς μηχανὲς ἔχουν ἕνα σχοινὶ μὲ μιὰ χειρολαβὴ στὴν ἄκρη καί, ὅταν θέλης νὰ τὶς βάλης μπρός, τραβᾶς μερικὲς φορὲς τὸ σχοινὶ μὲ δύναμη, μέχρι νὰ ξεπαγώσουν τὰ παγωμένα λάδια. Ἔτσι καὶ τὸ κομποσχοίνι εἶναι τὸ σχοινὶ τὸ ὁποῖο τραβᾶμε μία-δύο-πέντε-δέκα φορὲς καὶ ξεπαγώνουν τὰ πνευματικὰ λάδια καὶ παίρνει μπρὸς ἡ πνευματικὴ μηχανὴ τῆς ἀδιαλείπτου προσευχῆς, ὁπότε δουλεύει μετὰ μόνη της ἡ καρδιὰ στὴν εὐχή. Ἀλλά, καὶ ὅταν ἡ καρδιὰ πάρη μπρὸς στὴν εὐχή, καὶ πάλι δὲν πρέπει νὰ καταργήσουμε τὸ κομποσχοίνι, γιὰ νὰ μὴν παρακινηθοῦν καὶ ἄλλοι νὰ τὸ καταργήσουν, ἐνῶ δὲν πῆρε ἀκόμη μπρὸς ἡ καρδιά τους στὴν εὐχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, κρατῶ τὸ κομποσχοίνι μου καὶ λέω τὴν εὐχὴ μηχανικά, μήπως ὑπάρχει κίνδυνος ἀνθρωπαρέσκειας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν κάνης κομποσχοίνι ἐξωτερικὰ ἀπὸ ἀνθρωπαρέσκεια, ἀκόμη καὶ τὰ χέρια σου νὰ ξεφλουδίσης, σὲ τίποτε δὲν θὰ σὲ ὠφελήση. Μόνον κούραση θὰ σοῦ φέρη καὶ τὴν ψευδαίσθηση ὅτι δῆθεν ἀσχολεῖσαι μὲ τὴν νοερὰ προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἐγὼ δὲν ἔχω συνηθίσει νὰ κρατῶ κομποσχοίνι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ κομποσχοίνι νὰ τὸ κρατᾶς, γιὰ νὰ μὴν ξεχνᾶς τὴν εὐχή, τὴν ὁποία πρέπει νὰ ἐργάζεσαι ἐσωτερικά, στὴν καρδιά. Ὅταν μάλιστα βγαίνης ἀπὸ τὸ κελλί σου, νὰ θυμᾶσαι ὅτι ὁ ἐχθρὸς εἶναι ἕτοιμος γιὰ ἐπίθεση. Γι’ αὐτό, νὰ μιμῆσαι τὸν καλὸ στρατιώτη ποὺ βγαίνοντας ἀπὸ τὸ πολυβολεῖο ἔχει πάντοτε «ἀνὰ χεῖρας» τὸ αὐτόματο ὅπλο. Τὸ κομποσχοίνι ἔχει μεγάλη δύναμη· εἶναι τὸ ὅπλο τοῦ μοναχοῦ καὶ οἱ κόμποι εἶναι σφαῖρες, ποὺ «κρὰ-κρὰ» θερίζουν τὰ ταγκαλάκια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '[Φωτογραφία του αγίου Παϊσίου να πλέκει κομποσχοίνι]'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ πνευματικὴ μελέτη πρὸ τῆς προσευχῆς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δὲν σκιρτάει ἡ καρδιά μου γιὰ τὴν προσευχὴ καί, ὅταν βλέπω νὰ περνάη ἡ ὥρα χωρὶς νὰ κάνω τίποτε, μὲ πιάνει σφίξιμο καὶ στενοχώρια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μελετᾶς καθόλου προηγουμένως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συνήθως ὄχι, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί; Δὲν εἴπαμε νὰ μελετᾶς πρῶτα, γιὰ νὰ γλυκαθῆ ἡ καρδιά; Ἐσὺ δὲν τρῶς πνευματικά, γι’ αὐτὸ δὲν γλυκαίνεσαι. Λίγη μελέτη ἀπὸ τὴν Ἁγία Γραφὴ ἢ τὸνΕὐεργετινὸ[35]ἢ τὸ Γεροντικὸ πρὶν ἀπὸ τὴν προσευχή, ἔστω δυὸ-τρεῖς σειρές, θερμαίνει καὶ γλυκαίνει τὴν καρδιὰ καὶ ἔρχεται ἡ ὄρεξη γιὰ τὰ πνευματικά. Καπακώνονται οἱ μέριμνες, καὶ ὁ νοῦς μεταφέρεται σὲ θεῖο χῶρο. Τὸ Γεροντικὸ σὲ μεταφέρει στὴν Θηβαΐδα[36]καὶ στὴν Νιτρία[37]καὶ νιώθεις νὰ βρίσκεσαι κοντὰ στοὺς Ἁγίους Πατέρες. Ἐπίσης, τὸΛειμωνάριον, ἡΦιλόθεος Ἱστορία, τὸΛαυσαϊκόν,Ὁ Μοναχισμὸς τῆς Αἰγύπτου, διαβάζονται εὔκολα, ἀλλὰ εἶναι καὶ στερεὰ τροφή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δίνω περισσότερο χρόνο στὴν μελέτη πατερικῶν βιβλίων παρὰ στὴν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ κάνης λιγώτερη μελέτη, περισσότερη καθημερινὴ παρακολούθηση τοῦ ἑαυτοῦ σου καὶ εὐχή. Γιατὶ ἀλλιῶς, μόνο μὲ τὴν μελέτη, μένει ἄκαρπος κανείς, ἐὰν δὲν ἐργασθῆ καὶ δὲν ζητήση τὴν θεία ἐπέμβαση, τὴν Χάρη τοῦ Θεοῦ. Ἡ μελέτη πατερικῶν βιβλίων βοηθάει, ὅταν προηγῆται τῆς προσευχῆς. Γι’ αὐτὸ νὰ διαβάζης τόσο, ὅσο σοῦ χρειάζεται, γιὰ νὰ κατανυγῆς καὶ νὰ παρακινηθῆς στὴν προσευχή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὸ Θεοτοκάριο πολὺ βοηθάει στὴν προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς θὰ ἀγαπήσω τὴν Παναγία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ διαβάζης κάθε μέρα τὸ Θεοτοκάριο[38]. Αὐτὸ θὰ σὲ βοηθήση πολὺ νὰ ἀγαπήσης τὴν Παναγία. Καὶ νὰ δῆς ἡ Παναγία μετά!... Θὰ σοῦ δώση μεγάλη παρηγοριά!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἡ Γερόντισσα μοῦ εἶπε πὼς χρειάζομαι ἀφύπνιση. Τί εἶναι ἐκεῖνο ποὺ θὰ θερμάνη πάλι τὸν ζῆλο μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ διαβάζης κάθε μέρα ἕναν κανόνα ἀπὸ τὸ Θεοτοκάριο καὶ θὰ δῆς, θὰ ἀποκτήσης λεβεντιά. Αὐτὸ νὰ τὸ κάνης σὰν κανόνα. Ἂν δὲν μπορῆς νὰ διαβάσης ἕναν ὁλόκληρο κανόνα, νὰ διαβάζης τὸ πρῶτο τροπάριο ἀπὸ κάθε ὠδὴ καὶ τὰ προσόμοια ποὺ βρίσκονται στὸ τέλος τοῦ κανόνα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιὰ νὰ βοηθηθῶ στὴν προσευχή, μπορῶ νὰ ὁρίζω ἕνα χρονικὸ διάστημα γιὰ προσευχὴ καὶ νὰ μὴ σταματῶ νὰ προσεύχωμαι, μέχρι νὰ περάση ὁ χρόνος αὐτός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖς σ’ αὐτὸ τὸ διάστημα νὰ λὲς τὴν εὐχὴ καὶ νὰ κάνης ἐνδιάμεσα καὶ μιὰ Παράκληση ἢ νὰ διαβάζης τὸ Θεοτοκάριο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε νὰ διαβάζω τὸ Θεοτοκάριο, τὸ βράδυ ἢ τὸ πρωί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλύτερα τὶς πρωινὲς ὧρες, ὥστε αὐτὰ ποὺ διαβάζεις νὰ τὰ ἔχης στὸν νοῦ σου ὅλη τὴν ἡμέρα. Καὶ στὸ διακόνημα μπορεῖς νὰ διακόπτης λίγο τὴν ἐργασία σου καὶ νὰ διαβάζης ἕναν κανόνα ἀπὸ τὸ Θεοτοκάριο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τὸ Θεοτοκάριο πολὺ βοηθάει. Θερμαίνεται ἡ καρδιά, συγκινεῖται. Θυμᾶμαι, ὁ Παπα-Κύριλλος[39], ὁ Ἡγούμενος τῆς Μονῆς Κουτλουμουσίου, δὲν μποροῦσε νὰ συγκρατηθῆ ἀπὸ τοὺς λυγμοὺς καὶ τὰ δάκρυα, ὅταν διάβαζε τὸ Θεοτοκάριο. Καὶ μόνον ἕνα νόημα ἀπὸ τὸ Θεοτοκάριο μπορεῖ νὰ ἀλλοιώση τὴν ψυχή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ ψαλμωδία γλυκαίνει καὶ εἰρηνεύει τὴν ψυχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἐνῶ ἔχω καταλάβει πόσο βοηθάει ἡ εὐχή, δὲν μπορῶ νὰ τὴν λέω συνέχεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὅταν δυσκολεύεσαι νὰ πῆς τὴν εὐχή, νὰ σιγοψάλλης. Καὶ ἡ ψαλμωδία προσευχὴ εἶναι. Ἡ ψαλμωδία δίνει στὴν καρδιὰ μιὰ ἁπαλάδα, τὴν γλυκαίνει καὶ τὴν θερμαίνει μὲ τὶς πνευματικές της θερμίδες. Ἔτσι δημιουργεῖ τὶς καλύτερες προϋποθέσεις γιὰ νὰ λέη κανεὶς μὲ ὄρεξη τὴν εὐχή. Γιὰ μένα τὰ κουμπιὰ γιὰ τὴν πνευματικὴ ζωὴ εἶναι αὐτά: Λίγη μελέτη, ἀλλὰ δυνατή, εὐχή, μετάνοιες, ψαλτική.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν κάνω ἐργόχειρο, ἐνῶ ἔχω ἡσυχία, δὲν λέω τὴν εὐχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Προσπάθησε, ὅσο μπορεῖς, παράλληλα μὲ τὸ ἐργόχειρο ποὺ κάνεις, νὰ ἔχης ὡς ἐργόχειρο καὶ τὴν εὐχὴ καὶ τὴν σιγανὴ ψαλμωδία. Τώρα, γιὰ ἕνα διάστημα, στὸ ἕνα τρίτο τοῦ χρόνου ποὺ κάνεις ἐργόχειρο, νὰ λὲς τὴν εὐχὴ καὶ στὰ ὑπόλοιπα δύο τρίτα, ἐνῶ κάνεις ἐργόχειρο, νὰ ψάλλης διάφορα τροπάρια ποὺ σὲ συγκινοῦν. Μὲ τὴν εὐχὴ καὶ τὴν σιγανὴ ψαλμωδία θὰ διατηρῆς μέσα σου τὴν θεία Χάρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, εἶμαι στενοχωρημένη, φέρομαι ἀπότομα στὶς ἀδελφὲς καὶ ὕστερα πάλι στενοχωριέμαι γιὰ τὴν ἄσχημη συμπεριφορά μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ σιγανὴ ψαλμωδία θὰ σὲ βοηθήση πολύ. Νὰ ψάλλης συνέχεια σιγανὰ καὶ στὸ κελλί σου καὶ στὸ διακόνημα. Ἡ ψαλμωδία εἰρηνεύει τὴν ψυχή. Ἀκόμα καὶ τὰ ἄγρια θηρία τὰ ἡμερεύει, πόσο μᾶλλον τὸν ἄνθρωπο! Βλέπεις, τὸ λιοντάρι, ὁ λύκος, ὅταν ἀκούσουν ψαλμωδία, κάθονται ἥσυχα σὰν ἀρνάκια καὶ ἀκοῦνε ἤρεμα. Δὲν λέω ὅτι ἐσὺ εἶσαι ἄγρια, ἀλλὰ τὸ ταγκαλάκι ἐκμεταλλεύεται τὴν στενοχώρια σου καὶ σὲ σπρώχνει νὰ φερθῆς ἄσχημα. Γι’ αὐτό, ἂν ψέλνης σιγανά, θὰ αἰσθάνεσαι μιὰ γλυκύτητα στὴν καρδιὰ καὶ θὰ βλέπης τὶς ἀδελφὲς μὲ ἄλλο μάτι, μὲ ἀγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν μὲ πνίγουν οἱ λογισμοί, δὲν μπορῶ οὔτε νὰ μελετήσω οὔτε νὰ προσευχηθῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν μπορεῖς νὰ ψάλης λίγο σιγανά; Σὲ αὐτὲς τὶς περιπτώσεις, ὅταν ψάλλη κανείς, μοιάζει μὲ τὸν γεωργὸ ποὺ ἔχει νὰ θερίση μέσα στὴν ζέστη ἕνα χωράφι πνιγμένο στὰ ἀγκάθια, μὲ τὰ στάχυα πεσμένα κάτω, καὶ ἐκεῖνος ἀρχίζει νὰ θερίζη τραγουδώντας. Μὲ τὸ τραγούδι ξεχνιέται καὶ τελειώνει τὸν θέρο μὲ χαρά. Ὠφελεῖται καὶ ἀπὸ τὸν καρπὸ τῆς λίγης παραγωγῆς, καὶ νιώθει μετὰ ξεκούραση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καμμιὰ φορά, Γέροντα, νιώθω μέσα μου ἕνα βάρος. Εἶναι πειρασμικό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ξέρεις τί νὰ κάνης; Ὅταν νιώθης μέσα σου αὐτὸ τὸ βάρος, νὰ μὴ δίνης σημασία, ἀλλὰ νὰ λές: «Ἐπικράνθη ὁ ᾍδης, ἐπικράνθη!»[40]καὶ νὰ σιγοψάλλης. Ἔτσι ὁ πειρασμὸς θὰ φεύγη. Ὁ Ἅγιος Ἰωάννης τῆς Κλίμακος λέει ὅτι ἡ ψαλμωδία εἶναι τὸ ὅπλο τοῦ μοναχοῦ, τὸ ὁποῖο διώχνει τὴν λύπη[41]. Κι ἐγὼ σὲ ὅσους περνοῦν δοκιμασίες καὶ εἶναι θλιμμένοι λέω νὰ ψάλλουν διάφορα τροπάρια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικὲς φορὲς μοῦ ἔρχεται ἕνας ἐπίμονος ἄσχημος λογισμός. Πῶς νὰ τὸν διώχνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ ψάλλης ἕνα«Ἄξιόν ἐστιν»καὶ θὰ δῆς, τὸ ταγκαλάκι θὰ παίρνη τὰ ναῦλα του καὶ θὰ φεύγη. Ἡ ψαλμωδία εἶναι περιφρόνηση στὸν διάβολο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – «Δεῦτε προσκυνήσωμεν…»
- type: h2
  initial:
    ru: ''
  text:
    ru: Οἱ μετάνοιες βοηθοῦν περισσότερο ἀπὸ ὅλες τὶς πνευματικὲς ἀσκήσεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, πονάει τὸ σῶμα σας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, γιατὶ κάνω… πνευματικὴ γυμναστική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μετάνοιες, εὐλογημένη! Βλέπεις, οἱ κοσμικοὶ ἔχουν τὴν σουηδικὴ γυμναστικὴ καὶ οἱ μοναχοὶ τὶς μετάνοιες. Οἱ κοσμικοὶ μὲ τὴν γυμναστικὴ κάνουν σῶμα ὑγιεινὸ καὶ οἱ μοναχοὶ μὲ τὶς μετάνοιες κάνουν ψυχὴ καὶ σῶμα ὑγιέστατα. Οἱ καημένοι οἱ κοσμικοὶ δὲν ξέρουν πόσο βοηθοῦν οἱ μετάνοιες ὄχι μόνο στὴν ὑγεία τῆς ψυχῆς ἀλλὰ καὶ στὴν ὑγεία τοῦ σώματος. Κάνουν καλὸ στὰ ἀρθριτικά, διώχνουν τὴν μαλθακότητα, διώχνουν καὶ τὶς ἀφύσικες κοιλιές, σκορποῦν γαλήνη καὶ δίνουν μιὰ λεβεντιά. Παράλληλα ὅμως δίνουν στὸν ἄνθρωπο τὴν δυνατότητα νὰ ἀνέβη τὰ πνευματικὰ ὑψώματα τῶν ἀρετῶν, ὅπως θὰ ἀνεβαίνη καὶ τὰ ὑψώματα τῶν βουνῶν μὲ πολλὴ ἄνεση, χωρὶς νὰ λαχανιάζη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οἱ μετάνοιες εἶναι ἀπαραίτητες καὶ γιὰ τὸν νέο καὶ γιὰ τὸν ἡλικιωμένο· καὶ γι’ αὐτὸν ποὺ ἔχει σαρκικὸ πόλεμο καὶ γιὰ τὸν ἀπαλλαγμένο ἀπὸ τέτοιον πόλεμο. Ὅποιος ἔχει δυνατὴ κράση, πρέπει νὰ κάνη περισσότερες μετάνοιες ἀπὸ ἕναν φιλάσθενο, ὅπως καὶ μία δυνατὴ μηχανὴ δουλεύει περισσότερο. Ἰδιαίτερα τοὺς νέους, οἱ μετάνοιες τοὺς βοηθοῦν νὰ ὑποτάξουν τὴν σάρκα. Γι’ αὐτὸ πάντοτε στοὺς νέους λέω: «Νὰ κάνετε ὅσο περισσότερες μετάνοιες μπορεῖτε, καὶ γιὰ τὸν ἑαυτό σας καὶ γι’ αὐτοὺς ποὺ εἶναι ἄρρωστοι ἢ ἡλικιωμένοι καὶ δὲν μποροῦν νὰ κάνουν μετάνοιες».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οἱ μετάνοιες εἶναι προσευχή, ἀλλὰ συγχρόνως εἶναι καὶ ἄσκηση καὶ βοηθοῦν περισσότερο ἀπὸ ὅλες τὶς ἄλλες πνευματικὲς ἀσκήσεις. Ἐκτὸς ἀπὸ τὸ ξεκίνημα τῆς πνευματικῆς μας μηχανῆς γιὰ τὴν προσευχὴ φέρνουν καὶ πολλὰ ἄλλα καλά. Τὸ πρῶτο ἀπ’ ὅλα εἶναι ὅτι προσκυνοῦμε τὸν Θεὸ καὶ Τοῦ ζητοῦμε ταπεινὰ τὸ ἔλεός Του. Τὸ δεύτερο καλὸ εἶναι ὅτι μὲ τὶς μετάνοιες ταπεινώνεται ἡ ἄγρια σάρκα καὶ ἔρχεται ἡ ἠρεμία καὶ ἡ ἀπάθεια τῆς σαρκός. Καὶ τὸ τρίτο, μᾶς δίνουν καὶ τὴν ὑγεία τὴν σωματική, καὶ ἔρχεται ἡ διπλὴ ὑγεία στὸν ἄνθρωπο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Μὲ τὶς μετάνοιες ζητοῦμε ἀπὸ τὸν Θεὸ συγχώρηση καὶ ἐκδηλώνουμε τὴν εὐγνωμοσύνη μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἐπειδὴ δυσκολεύομαι νὰ κάνω μετάνοιες, δὲν μοῦ ἀρέσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν κάνης μετάνοιες, νὰ σκέφτεσαι ὅτι εἶσαι μπροστὰ στὸν Θεὸ καὶ Τὸν προσκυνᾶς, καὶ ἔτσι θὰ ἀγαπήσης τὶς μετάνοιες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οἱ μετάνοιες γιὰ τὸν ἑαυτό μας ἢ γιὰ τοὺς συνανθρώπους μας εἶναι τὸ κυριώτερο ἐργόχειρο ἀπὸ ὅλα τὰ ἐργόχειρα καὶ εἶναι ἕνα ἐργόχειρο μὲ ἀτέλειωτη δουλειά, ἀρκεῖ νὰ ἔχη κανεὶς φιλότιμο νὰ ἐργασθῆ στὴν μετάνοια. Οἱ μετάνοιες γι’ αὐτὸ λέγονται μετάνοιες· ταπεινωνόμαστε καὶ ζητᾶμε συγχώρηση ἀπὸ τὸν Θεό, ὅπως, ὅταν σφάλλουμε σὲ κάποιον, βάζουμε μετάνοια καὶ λέμε «εὐλόγησον». Βοηθάει μάλιστα, ὅταν ἀρχίζουμε νὰ κάνουμε τὶς μετάνοιες, νὰ λέμε ταπεινά: «Ἥμαρτον, Κύριε, συγχώρεσέ με».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἔχω βρεῖ θεραπεία σὲ σωματικὰ καὶ ψυχικὰ πάθη. Πῶς νὰ ἐκφράσω τὴν εὐγνωμοσύνη μου στὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὴν ἔχεις αὐτὴν τὴν εὐγνωμοσύνη; Ἅμα τὴν ἔχης πραγματικά, ἤδη ἐκφράσθηκε. Τὸ κυριώτερο εἶναι νὰ ἔχης μέσα σου εὐγνωμοσύνη. Ἀπὸ ἐκεῖ καὶ πέρα μπορεῖς νὰ τὴν ἐκδηλώνης μὲ ἄσκηση, μὲ μετάνοιες κ.λπ. Νά, ἐκεῖ στὸ Καλύβι μου μαζεύονται καμμιὰ φορὰ ξένα γατάκια καὶ τὰ ταΐζω. Καὶ ὅταν τὸ βράδυ βγαίνω ἔξω, γιὰ νὰ πάρω τὰ σημειώματα ἀπὸ τὸ κουτί, δὲν ξέρουν πῶς νὰ ἐκδηλώσουν τὴν εὐγνωμοσύνη τους· ἔρχονται καὶ χαϊδεύονται στὰ πόδια μου, τρέχουν μπροστὰ ἀπὸ μένα, σκαρφαλώνουν πάνω στὸ κυπαρίσσι, ξανακατεβαίνουν, κάνουν τοῦμπες, ξαναέρχονται στὰ πόδια μου. Τὸ ἕνα κάνει αὐτό, τὸ ἄλλο ἐκεῖνο. Μήπως ἔχω ἐγὼ ἀνάγκη ἀπὸ αὐτὲς τὶς ἐκδηλώσεις; Ὄχι, ἀλλὰ εἶναι κάτι ποὺ ξεπηδάει ἀπὸ μέσα τους, κι ἂς εἶναι ζῶα. Θέλω νὰ πῶ ὅτι τὸ κυριώτερο ἀπ’ ὅλα εἶναι νὰ ἔχη μέσα του εὐγνωμοσύνη ὁ ἄνθρωπος· μετὰ τὴν ἐκδηλώνει μὲ ὅποιον τρόπο αἰσθάνεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν κινηθῆ κανεὶς στὸν χῶρο τῆς εὐγνωμοσύνης, κάνει τὶς μετάνοιες ἀπὸ φιλότιμο, ἀπὸ φτερούγισμα, ἀπὸ ἀγάπη γιὰ τὸν Χριστό. Τότε δὲν αἰσθάνεται κόπο, ὅπως δὲν κουράζονται τὰ παιδάκια ἀπὸ τὰ τρελλὰ ξεσπάσματα τῆς καρδιᾶς τους, ὅταν χοροπηδοῦν, μόλις δοῦν τὸν πατέρα τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οἱ μικρὲς καὶ οἱ μεγάλες μετάνοιες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν κάνω κομποσχοίνι γιὰ κάποιον, πρέπει νὰ τὸ κάνω μὲ σταυρὸ καὶ μικρὴ μετάνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀνάλογα μὲ τὸ τί θέλεις νὰ προσφέρης. Ὅ,τι ἔχει περισσότερο κόπο, ἔχει μεγαλύτερη ἀξία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, κάνουμε κομποσχοίνι μὲ μικρὴ μετάνοια, πρέπει τὸ χέρι νὰ ἀκουμπάη στὸ ἔδαφος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, ὅταν κάνουμε κομποσχοίνι μὲ μικρὴ μετάνοια, τὸ χέρι φθάνει μέχρι τὸ γόνατο καὶ μετὰ σηκωνόμαστε ὄρθιοι. Ἄλλο εἶναι οἱ μικρὲς μετάνοιες ποὺ κάνουμε, ὅταν προσκυνοῦμε τὶς εἰκόνες ἢ στὴν«Τιμιωτέραν»κ.λπ. Τότε, ἂν μπορῆ κανείς, καλὸ εἶναι τὸ χέρι νὰ φθάνη στὸ ἔδαφος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν κάνω τὰ κομποσχοίνια μὲ σταυρὸ καὶ μικρὴ μετάνοια, δὲν μπορῶ νὰ συγκεντρωθῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐγὼ περισσότερο συγκεντρώνομαι, ὅταν κάνω τὰ κομποσχοίνια μὲ σταυρὸ καὶ μικρὴ μετάνοια. Ξεχνιέμαι τόσο, ποὺ ὕστερα, ὅταν τελειώσω τὰ κομποσχοίνια, μοῦ πονάει τὸ χέρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς πρέπει νὰ κάνω τὶς μεγάλες μετάνοιες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλὸ εἶναι τὶς μεγάλες μετάνοιες νὰ τὶς κάνης ὁλόκληρες· δηλαδή, ὕστερα ἀπὸ κάθε μετάνοια νὰ σηκώνεσαι ὄρθια. Ἔτσι, καὶ μεγαλύτερη ὑπόκλιση κάνεις στὸν Θεό, ἀλλὰ καὶ πιὸ ξεκούραστο εἶναι αὐτὸ γιὰ τὸ σῶμα. Ἐπίσης, νὰ μὴν ἀκουμπᾶς τὰ χέρια κάτω μὲ ἀνοιχτὴ τὴν παλάμη, γιατὶ μπορεῖ νὰ πάθουν ζημιὰ οἱ τένοντες, ἀλλὰ κλειστά, μὲ τὸ ἐξωτερικὸ μέρος. Καί, γιὰ νὰ μὴ γίνωνται ρόζοι στὰ χέρια, νὰ τὶς κάνης πάνω σὲ ἕνα μαλακὸ πατάκι.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Ὁ ἀγωνιστὴς τρόπους μηχανεύεται»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βλέπω ὅτι, καθὼς τὰ χρόνια περνοῦν, τὸ κουράγιο λιγοστεύει καὶ δὲν μπορῶ νὰ κάνω πολλὲς μετάνοιες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εἶναι φυσικό, ὅσο περνάει ἡ ἡλικία, οἱ σωματικὲς δυνάμεις νὰ ἐλαττώνωνται σιγὰ-σιγά. Συνέχισε φιλότιμα τὸν ἀγώνα σου καί, ὅταν δὲν μπορῆς νὰ κάνης πολλὲς μεγάλες μετάνοιες, νὰ τὶς ἀντικαταστήσης μὲ μικρὲς ἢ μὲ τὴν εὐχή. Μπορεῖς ὅμως καὶ τὶς μεγάλες μετάνοιες νὰ μὴν τὶς κάνης ὅλες μαζί. Κάνε στὴν ἀρχὴ ἕνα ἑκατοστάρι κομποσχοίνι καὶ ὕστερα κάνε πέντε μετάνοιες. Μετὰ ἀπὸ δέκα κομποσχοίνια θὰ ἔχης κάνει πενῆντα μετάνοιες. Ὁ τρόπος αὐτὸς μὲ τὶς ἐναλλαγὲς εἶναι ξεκούραστος ἀλλὰ καὶ ὠφέλιμος. Ἂν πῆς στὸν ἄλλον νὰ κάνη πενῆντα μετάνοιες, θὰ σοῦ πῆ: «Ἄ, πῶς θὰ κάνω τόσες πολλὲς μετάνοιες;». Λίγες-λίγες ὅμως γίνονται εὔκολα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αὐτὲς τὶς μέρες πονοῦν πολὺ τὰ πόδια καὶ ἡ μέση μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν κάνης λίγες μετάνοιες, θὰ σὲ βοηθήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ ὅταν πονάω, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μόνη σου θὰ βρῆς τί σὲ βοηθάει, δοκιμάζοντας λίγο-λίγο. Ἐγώ, ὅταν ἔχω δυσκολία μὲ τὴν μέση, δὲν ὁρίζω στὸν ἑαυτό μου πόσες μετάνοιες θὰ κάνω, ἀλλὰ κάνω, μέχρι νὰ ...ἀνάψη κόκκινο φῶς. Τότε σταματῶ καὶ σὲ λίγο πάλι συνεχίζω, μέχρι νὰ ξανανάψη κόκκινο φῶς. Θυμᾶμαι, ὁ Παπα-Τύχων[42], ὅταν εἶχε γεράσει καὶ δὲν μποροῦσε νὰ σηκωθῆ ὅταν ἔπεφτε καὶ ἔκανε μεγάλες μετάνοιες, ἔδεσε ἕνα χοντρὸ σχοινὶ ψηλὰ στὸ ταβάνι καὶ τραβιόταν ἀπὸ αὐτό, γιὰ νὰ σηκωθῆ. Μὲ αὐτὸν τὸν τρόπο συνέχισε νὰ κάνη μετάνοιες καὶ νὰ προσκυνάη τὸν Θεὸ μὲ εὐλάβεια μέχρι τὶς τελευταῖες σχεδὸν ἡμέρες τῆς ζωῆς του.«Ὁ ἀγωνιστής, λέει ὁ Ἀββᾶς Ἰσαάκ,τρόπους μηχανεύεται»[43].
- type: h2
  initial:
    ru: ''
  text:
    ru: Τρίτο Μέρος – Οἱ Πρὸς Θεὸν Μεσίτεσ Καὶ Προστάτες Μάς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Παναγια, Οι Αγγελοι Και Οι Αγιοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Προσπάθησε ὁ νοῦς σου νὰ βρίσκεται συνέχεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: στὸν Χριστό, στὴν Παναγία, στοὺς Ἀγγέλους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καὶ στοὺς Ἁγίους, στὸν Οὐρανό».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Παναγία, ἡ Φιλόστοργη Μητέρα μας
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ εὐλάβεια πρὸς τὴν Παναγία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πέστε μας, Γέροντα, κάτι γιὰ τὴν Παναγία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί νὰ σᾶς πῶ; Μὲ φέρνετε σὲ πολὺ δύσκολη θέση. Γιὰ νὰ μιλήση κανεὶς γιὰ τὴν Παναγία, πρέπει νὰ Τὴν ζήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, καὶ τὸ ὄνομα τῆς Παναγίας ἔχει δύναμη πνευματική, ὅπως τὸ ὄνομα τοῦ Χριστοῦ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί. Ὅποιος ἔχει πολλὴ εὐλάβεια στὴν Παναγία, ἀκούει τὸ ὄνομά Της καὶ ἀλλοιώνεται. Ἤ, ἂν τὸ βρῆ κάπου γραμμένο, τὸ ἀσπάζεται μὲ εὐλάβεια καὶ σκιρτάει ἡ καρδιά του. Μπορεῖ νὰ κάνη ὁλόκληρη Ἀκολουθία μὲ ἕναν συνεχῆ ἀσπασμὸ στὸ ὄνομα τῆς Παναγίας[44]. Καὶ ὅταν προσκυνᾶ τὴν εἰκόνα Της, δὲν ἔχει τὴν αἴσθηση ὅτι εἶναι εἰκόνα, ἀλλὰ ὅτι εἶναι ἡ ἴδια ἡ Παναγία, καὶ πέφτει κάτω λειωμένος, διαλυμένος ἀπὸ τὴν ἀγάπη Της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νὰ μᾶς λέγατε κάτι ἀπὸ τὸ προσκύνημά σας στὴν Παναγία τῆς Τήνου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί νὰ πῶ; Μιὰ τόσο μικρὴ εἰκόνα κι ἔχει τόση Χάρη! Δὲν μποροῦσα νὰ ξεκολλήσω ἀπὸ κοντά της. Παραμέρισα λίγο, γιὰ νὰ μὴν ἐμποδίζω τοὺς ἄλλους ποὺ ἤθελαν νὰ προσκυνήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικοί, Γέροντα, σκανδαλίζονται ἀπὸ τὰ πολλὰ ἀφιερώματα ποὺ ἔχουν οἱ θαυματουργὲς εἰκόνες τῆς Παναγίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ σᾶς πῶ τί ἔπαθε μιὰ φορὰ ἕνας πολὺ ἁπλὸς καὶ εὐλαβὴς προσκυνητής. Πῆγε στὴν Μονὴ Ἰβήρων καὶ προσκύνησε τὴν Παναγία τὴν Πορταΐτισσα. Ἐκεῖ ἡ εἰκόνα εἶναι γεμάτη φλουριά. Στὸν γυρισμό, πηγαίνοντας γιὰ τὴν Μονὴ Σταυρονικήτα, μπῆκε σὲ λογισμούς. «Παναγία μου, εἶπε, ἐγὼ ἤθελα νὰ Σὲ δῶ ἀλλιῶς· ἁπλή, ὄχι μὲ φλουριά». Τί παθαίνει ἐν τῷ μεταξύ; Τὸν ἔπιασε ἕνας πόνος δυνατός, ζαλίστηκε καὶ ἔμεινε ἐκεῖ, στὴν μέση τοῦ δρόμου. Ἄρχισε λοιπὸν νὰ ζητάη βοήθεια ἀπὸ τὴν Παναγία: «Παναγία μου, ἔλεγε, κάνε με καλὰ καὶ θὰ σοῦ φέρω δυὸ φλουριά!». Τότε τοῦ παρουσιάσθηκε ἡ Παναγία καὶ τοῦ εἶπε: «Ἔτσι μοῦ τὰ ἔφεραν τὰ φλουριά. Μήπως ἐγὼ τὰ ζήτησα; Μήπως τὰ ἤθελα ἐγώ;». Καὶ ἀμέσως ὁ πόνος σταμάτησε. Βλέπετε, ἐπειδὴ εἶχε καλὴ διάθεση, πολλὴ πίστη, τὸν βοήθησε ἡ Παναγία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἐγὼ μερικὲς φορὲς ἐκεῖ στὸ Καλύβι, ὅταν θέλω νὰ προσευχηθῶ στὴν Παναγία, σκέφτομαι: «Πῶς νὰ πάω μὲ ἄδεια χέρια νὰ Τὴν παρακαλέσω;». Κόβω λίγα ἀγριολούλουδα, τὰ πηγαίνω στὴν εἰκόνα Της καὶ λέω: «Παναγία μου, πάρε αὐτὰ τὰ λουλούδια ἀπὸ τὸ Περιβόλι Σου». Πρὶν πάω στὸ Ἅγιον Ὄρος, ἄκουγα νὰ λένε ὅτι εἶναι «τὸ Περιβόλι τῆς Παναγίας» καὶ περίμενα νὰ δῶ λουλούδια, δένδρα ὀπωροφόρα κ.λπ. Ὅταν πῆγα καὶ εἶδα ἄγριες καστανιές, κουμαριές, κατάλαβα ὅτι εἶναι πνευματικὸ τὸ Περιβόλι τῆς Παναγίας. Ἀργότερα ἔνιωσα μέσα σὲ αὐτὸ καὶ τὴν παρουσία Της.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς θὰ αἰσθανθῶ, Γέροντα, τὴν παρουσία τῆς Παναγίας, γιὰ νὰ μοῦ θερμάνη τὴν καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μιὰ ποὺ φέρεις τὸ ὄνομα τῆς Μεγάλης Μητέρας τοῦ Χριστοῦ καὶ κατὰ χάριν Μητέρας ὅλων τῶν ἀνθρώπων, νὰ Τὴν ἐπικαλῆσαι συνέχεια: «Παναγία μου, νὰ λές, Ἐσὺ ποὺ καταδέχτηκες νὰ ἔχω τὸ ὄνομά Σου, βοήθησέ με νὰ ζήσω ὅπως εἶναι εὐάρεστο σ’ Ἐσένα. Ἄλλοι μόνον τὸ ὄνομά Σου ἀκοῦνε καὶ συγκινοῦνται, κι ἐγὼ τί κάνω;». Εὔχομαι ἡ Παναγία νὰ μένη συνέχεια κοντά σου καὶ νὰ σὲ σκεπάζη σὰν τὸ κλωσσοπούλι κάτω ἀπὸ τὰ Ἀγγελικὰ φτερά Της.'
- type: h2
  initial:
    ru: ''
  text:
    ru: «Τὴν Μητέρα σου προσάγει σοι εἰς ἱκεσίαν ὁ λαός σου, Χριστὲ»[45]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά εἰκόνα τῆς Παναγίας Τὴν ἀποδίδει περισσότερο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ Παναγία ἡ Ἰεροσολυμίτισσα. Μιὰ φορὰ Τὴν εἶδα ἐκεῖ στὸ Καλύβι, στὴν Παναγούδα… Ἂν σοῦ τὸ πῶ, σὲ πόσους θὰ τὸ πῆς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σὲ κανέναν, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Λοιπόν, εἶδα σὲ ὅραμα ὅτι θὰ πήγαινα μακρινὸ ταξίδι καὶ ἔπρεπε νὰ ἑτοιμάσω τὰ χαρτιά μου, διαβατήριο, συνάλλαγμα κ.λπ., ἀλλὰ οἱ ὑπάλληλοι δὲν μοῦ ἔκαναν τὰ χαρτιά. Ἐκεῖ ἦταν πολλοὶ ἄνθρωποι, ὅμως δὲν ὑπῆρχε κανεὶς νὰ μὲ βοηθήση. «Ποιός θὰ μὲ βοηθήση; λέω. Μὰ δὲν βρίσκεται κανένας, γιὰ νὰ ἐνδιαφερθῆ;». Εἶχα μιὰ ἀγωνία!... Καὶ ξαφνικὰ παρουσιάζεται μιὰ Γυναίκα μὲ λαμπερὸ πρόσωπο, ντυμένη στὰ χρυσαφένια. Εἶχε μιὰ ὡραιότητα! Ἄστραφτε ὁλόκληρη! «Μὴν ἀνησυχῆς, ἐγὼ θὰ σὲ βοηθήσω· ὁ Γυιός μου εἶναι Βασιλιάς», μοῦ λέει καὶ μὲ χτύπησε ἁπαλὰ στὸν ὦμο. Παίρνει τὰ χαρτιὰ καὶ μὲ μιὰ κίνηση τὰ βάζει στὸν κόρφο Της. Ὤ, τί κίνηση ἦταν ἐκείνη! Ὕστερα μοῦ εἶπε: «Θὰ περάσετε δύσκολες ἡμέρες» καὶ μοῦ ἀνέφερε κάτι ποὺ ἔπρεπε νὰ κάνω κι ἐγώ[46]. Μετὰ ἀπὸ καιρὸ εἶδα τὴν Παναγία τὴν Ἰεροσολυμίτισσα σὲ ἕνα βιβλίο καὶ Τὴν ἀναγνώρισα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κάποιος, Γέροντα, μᾶς ρώτησε: «Ἀφοῦ ἡ σωτηρία μας εἶναι στὰ χέρια τοῦ Θεοῦ, γιατί, ὅταν ἐπικαλούμαστε τὴν Παναγία, λέμε:«Ὑπεραγία Θεοτόκε, σῶσον ἡμᾶς»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂς ποῦμε, μιὰ γυναίκα ἔχει γειτόνισσα τὴν μάνα ἑνὸς ὑπουργοῦ καὶ τὴν παρακαλεῖ νὰ φροντίση, ὥστε νὰ βρεθῆ μιὰ δουλειὰ γιὰ τὸ παιδί της. Ἡ γειτόνισσα προθυμοποιεῖται, ὅμως δὲν θὰ βρῆ ἡ ἴδια τὴν δουλειά, ἀλλὰ θὰ παρακαλέση τὸν γυιό της, ποὺ ὡς ὑπουργὸς ἔχει αὐτὴν τὴν δυνατότητα καὶ θὰ κάνη τὸ χατίρι τῆς μάνας του. Ἔτσι κι ἐμεῖς, παρακαλοῦμε τὴν Παναγία νὰ μᾶς σώση καὶ ἡ Παναγία παρακαλεῖ τὸν Υἱό Της ποὺ ἔχει αὐτὴν τὴν δύναμη. Καὶ Ἐκεῖνος Τῆς κάνει τὸ χατίρι, γιατὶ ἀγαπάει πολὺ τὴν Μητέρα Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὴν Παναγία προσεύχομαι μὲ περισσότερη ἄνεση ἀπὸ ὅ,τι στὸν Χριστό. Μήπως αὐτὸ εἶναι ἀνευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κι ἐγὼ ἔτσι νιώθω. Ἀπὸ πολὺ σεβασμὸ στὸν Χριστό, νιώθω περισσότερη ἄνεση στὴν Παναγία, ὅπως καὶ τὰ παιδιὰ – καὶ μεγάλα ἀγόρια νὰ εἶναι – πηγαίνουν στὴν μάνα μὲ περισσότερο θάρρος ἀπὸ ὅ,τι στὸν πατέρα, ἀπὸ σεβασμὸ πρὸς τὸν πατέρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οἱ ἄνθρωποι ποὺ ἔχουν πραγματικὴ εὐλάβεια καὶ σεβασμὸ στὸν Χριστό, συστέλλονται μπροστὰ στὸν Χριστό, ἐνῶ στὴν Παναγία ἔχουν περισσότερο θάρρος καὶ Tὴν πλησιάζουν ἄνετα, γιατὶ ἡ Παναγία ἀνήκει στὸ γένος τὸ ἀνθρώπινο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καμμιὰ φορά, Γέροντα, ὅταν κάνω μετάνοιες, ψάλλω τὴν Παράκληση τῆς Παναγίας ἢ λέω τοὺς Χαιρετισμούς. Μήπως, ὅταν κάνω μετάνοιες, πρέπει νὰ λέω μόνον τὴν εὐχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὄχι, κάνε ὅπως ἀναπαύεσαι, γιατὶ καὶ ἡ Παναγία στὸν Χριστὸ τὰ πηγαίνει ὅλα, ἀλλὰ καὶ μὲ τὴν στοργὴ καὶ τὴν τρυφερότητά Της γεμίζει τὴν ψυχή μας ἀπὸ ἀγάπη καὶ ἔρωτα πρὸς τὸν Χριστό. Ἐγὼ παρακαλῶ τὴν Παναγία νὰ μοῦ πάρη τὴν καρδιὰ καί, ἀφοῦ πρῶτα τὴν καθαρίση, νὰ τὴν κόψη στὰ τέσσερα: Τρία κομμάτια νὰ δώση στὴν Ἁγία Τριάδα καὶ ἕνα κομμάτι νὰ κρατήση Ἐκείνη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν λέω τὴν εὐχή, μπορεῖ νὰ περάση πολλὴ ὥρα καὶ νὰ μὴν κάνω κανένα κομποσχοίνι στὴν Παναγία, γιατὶ δὲν μπορῶ νὰ ἀφήσω τὸ ὄνομα τοῦ Χριστοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φοβᾶσαι μήπως παρεξηγηθῆ ἡ Παναγία; Εὐλογημένη, δὲν εἴπαμε ὅτι οἱ προσευχὲς πρὸς τὴν Παναγία καὶ πρὸς ὅλους τοὺς Ἁγίους ἀπευθύνονται στὸν Χριστό; Νὰ κάνης ὅπως νιώθεις. Δὲν παρεξηγεῖται ἡ Παναγία οὔτε οἱ Ἅγιοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σὲ μιὰ ἀτομικὴ ἀγρυπνία ποὺ τὴν ἀφιερώνω στὴν Παναγία τί νὰ κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ συλλογίζεσαι προηγουμένως τὴν Παναγία. Σ’ αὐτὸ μποροῦν νὰ σὲ βοηθήσουν καὶ μερικὰ τροπάρια ἀπὸ τὴν Παράκληση τῆς Παναγίας ἢ ἀπὸ τὸ Θεοτοκάριο ἢ ἀπὸ τὸν Ἀκάθιστο Ὕμνο. Μετὰ νὰ συνεχίσης μὲ εὐχὴ [Εικόνα της Θεοτόκου] καὶ ὅ,τι ἄλλο«δόξῃ τῷ Προεστῶτι»[47]τοῦ ἑαυτοῦ σου, ἤγουν«τῷ τυπικῷ τῆς καρδίας σου».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οἱ Χαιρετισμοὶ τῆς Παναγίας εἶναι δοξολογία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δοξολογία εἶναι. Μπορεῖς νὰ τοὺς λὲς σὰν εὐχαριστία στὴν Παναγία, ὅταν ἐκπληρώνη κάποιο αἴτημά σου. Ὄχι ὅλο νὰ ζητᾶμε ἀπὸ τὴν Παναγία, ἀλλὰ νὰ Τὴν εὐχαριστοῦμε κιόλας. Οἱ Χαιρετισμοὶ τῆς Παναγίας ἔχουν πολλὴ Χάρη. Ἀνώνυμος τοὺς ἔγραψε. Νὰ τοὺς μάθης ἀπ’ ἔξω καὶ νὰ τοὺς λὲς καὶ μέσα στὴν ἡμέρα.
- type: h2
  initial:
    ru: ''
  text:
    ru: « Πάντων προστατεύεις, ἀγαθὴ»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δὲν μοῦ στείλατε«γλυκὰ» γιὰ τὴν γιορτή μου καὶ οἱ ἀδελφὲς ζητοῦσαν«κεράσματα»[48].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔχεις δίκαιο· δὲν σοῦ ἔστειλα«γλυκά», καὶ φυσικὰ δὲν εἶχες νὰ δώσης στὶς ἀδελφές, ἀλλὰ τὶς εὐχὲς σοῦ τὶς ἔστειλα μὲ ἄλλον τρόπο. Τώρα ποὺ σὲ λίγες μέρες θὰ γιορτάσουμε καὶ ἐμεῖς[49]τὴν Μητέρα μας, θὰ Τὴν παρακαλέσω καὶ πάλι νὰ σὲ κεράση Ἐκείνη μὲ τὴν γλυκειά Της ἀγάπη καὶ στοργὴ καὶ νὰ σοῦ δώση πολλὰ θεῖα δῶρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ἔχω συνέχεια πτώσεις στὸν ἀγώνα μου, μὲ πιάνει λύπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ ψέλνης τὸ«Πάντων προστατεύεις, ἀγαθὴ»καὶ τὸ«Πάντων θλιβομένων ἡ χαρά»[50].Αὐτὸ νὰ τὸ κάνης σὰν κανόνα, καὶ ἡ Παναγία θὰ σὲ βοηθήση. Ἡ Παναγία δὲν μᾶς ἀφήνει· μᾶς κουβαλάει στὴν πλάτη Της, ἀρκεῖ κι ἐμεῖς νὰ τὸ θέλουμε καὶ νὰ μὴν κλωτσᾶμε, ὅπως κάνουν τὰ ἄτακτα παιδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θὰ ἤθελα ἡ Παναγία νὰ κρατήση κι ἐμένα στὴν ἀγκαλιά Της, ὅπως κρατάει τὸν Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δὲν σὲ κράτησε ποτὲ ἐσένα; Δὲν ἔνιωσες καμμιὰ φορὰ σὰν μωρὸ στὴν ἀγκαλιά Της; Ἐγὼ αἰσθάνομαι σὰν παιδάκι κοντά Της. Τὴν νιώθω Μάνα μου. Πολλὲς φορὲς πηγαίνω καὶ ἀκουμπῶ στὴν εἰκόνα Της καὶ λέω: «Τώρα, Παναγία μου, θὰ θηλάσω λίγο Χάρη». Νιώθω σὰν μωρὸ ποὺ θηλάζει στὴν ἀγκαλιὰ τῆς μάνας του ξέγνοιαστο, ἀμέριμνο, καὶ νιώθει τὴν μεγάλη της ἀγάπη καὶ τὴν ἀνέκφραστη στοργή της, καὶ τρέφομαι μὲ Χάρη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ἡ Παναγία ἄλλοτε μοῦ δίνει ἀμέσως αὐτὸ ποὺ Τῆς ζητῶ καὶ ἄλλοτε ὄχι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἡ Παναγία, ὅποτε ἔχουμε ἀνάγκη, ἀπαντᾶ ἀμέσως στὴν προσευχή μας· ὅποτε δὲν ἔχουμε, μᾶς ἀφήνει, γιὰ νὰ ἀποκτήσουμε λίγη παλληκαριά. Ὅταν ἤμουν στὴν Μονὴ Φιλοθέου[51], μιὰ φορά, ἀμέσως μετὰ τὴν ἀγρυπνία τῆς Παναγίας μὲ ἔστειλε ἕνας Προϊστάμενος νὰ πάω ἕνα γράμμα στὴν Μονὴ Ἰβήρων. Ὕστερα ἔπρεπε νὰ πάω κάτω στὸν ἀρσανᾶ τῆς μονῆς καὶ νὰ περιμένω ἕνα γεροντάκι ποὺ θὰ ἐρχόταν μὲ τὸ καραβάκι, γιὰ νὰ τὸ συνοδεύσω στὸ μοναστήρι μας – ἀπόσταση μιάμιση ὥρα μὲ τὰ πόδια. Ἤμουν ἀπὸ νηστεία καὶ ἀπὸ ἀγρυπνία. Τότε τὴν νηστεία τοῦ Δεκαπενταυγούστου τὴν χώριζα στὰ δύο· μέχρι τῆς Μεταμορφώσεως δὲν ἔτρωγα τίποτε, τὴν ἡμέρα τῆς Μεταμορφώσεως ἔτρωγα, καὶ μετὰ μέχρι τῆς Παναγίας πάλι δὲν ἔτρωγα τίποτε. Ἔφυγα λοιπὸν ἀμέσως μετὰ τὴν ἀγρυπνία καὶ οὔτε σκέφθηκα νὰ πάρω μαζί μου λίγο παξιμάδι. Ἔφθασα στὴν Μονὴ Ἰβήρων, ἔδωσα τὸ γράμμα καὶ κατέβηκα στὸν ἀρσανᾶ, γιὰ νὰ περιμένω τὸ καραβάκι. Θὰ ἐρχόταν κατὰ τὶς τέσσερις τὸ ἀπόγευμα, ἀλλὰ ἀργοῦσε νὰ ἔρθη. Ἄρχισα ἐν τῷ μεταξὺ νὰ ζαλίζωμαι. Πιὸ πέρα εἶχε μιὰ στοίβα ἀπὸ κορμοὺς δένδρων, σὰν τηλεγραφόξυλα, καὶ εἶπα μὲ τὸν λογισμό μου: «Ἂς πάω νὰ καθήσω ἐκεῖ ποὺ εἶναι λίγο ἀπόμερα, γιὰ νὰ μὴ μὲ δῆ κανεὶς καὶ ἀρχίση νὰ μὲ ρωτάη τί ἔπαθα». Ὅταν κάθησα, μοῦ πέρασε ὁ λογισμὸς νὰ κάνω κομποσχοίνι στὴν Παναγία νὰ μοῦ οἰκονομήση κάτι. Ἀλλὰ ἀμέσως ἀντέδρασα στὸν λογισμὸ καὶ εἶπα: «Ταλαίπωρε, γιὰ τέτοια τιποτένια πράγματα θὰ ἐνοχλῆς τὴν Παναγία;». Τότε βλέπω μπροστά μου ἕναν Μοναχό. Κρατοῦσε ἕνα στρογγυλὸ ψωμί, δύο σῦκα καὶ ἕνα μεγάλο τσαμπὶ σταφύλι. «Πάρε αὐτά, μοῦ εἶπε, εἰς δόξαν τῆς Κυρίας Θεοτόκου», καὶ χάθηκε. Ἔ, τότε διαλύθηκα· μὲ ἔπιασαν τὰ κλάματα, οὔτε ἤθελα νὰ φάω πιά… Πά, πά! Τί Μάνα εἶναι Αὐτή! Νὰ φροντίζη καὶ γιὰ τὶς μικρότερες λεπτομέρειες! Ξέρεις τί θὰ πῆ αὐτό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πέστε μας κάτι γιὰ τὴν προστασία τῆς Παναγίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ σᾶς πῶ κάτι ποὺ ἔγινε στὴν Ρωσία. Δύο γειτονικὰ μοναστήρια σὲ μιὰ περιοχὴ τῆς Ρωσίας τὰ χώριζε μιὰ γραμμὴ τραίνου. Σὲ ἕνα πανηγύρι κάποιοι μοναχοὶ ἀπὸ τὸ ἕνα μοναστήρι πῆγαν στὸ ἄλλο καὶ μέθυσαν. Καθὼς ἐπέστρεφαν στὸ μοναστήρι τους μεθυσμένοι, πῆγαν καὶ ξάπλωσαν ἐπάνω στὶς ράγες τῆς σιδηροδρομικῆς γραμμῆς καὶ τοὺς πῆρε ὁ ὕπνος. Παρουσιάζεται τότε ἡ Παναγία στὸν σταθμάρχη καὶ τοῦ λέει: «Τὰ γουρουνάκια μου θὰ τὰ κόψη τὸ τραῖνο». «Τί νἆναι αὐτό; λέει ἐκεῖνος, ποιά γουρουνάκια θὰ κόψη τὸ τραῖνο;». Γιὰ δεύτερη φορὰ παρουσιάζεται ἡ Παναγία καὶ ἐπαναλαμβάνει τὰ ἴδια: «Τὰ γουρουνάκια μου θὰ τὰ κόψη τὸ τραῖνο». «Βρέ, τί γουρουνάκια;», λέει ὁ σταθμάρχης. Νόμισε ὅτι εἶναι κανένα κοπάδι γουρουνάκια στὶς σιδηροδρομικὲς γραμμές. Πῆγε νὰ δῆ καὶ τοὺς βρῆκε νὰ κοιμοῦνται. Πρόλαβε καὶ τοὺς ξύπνησε. Θὰ περνοῦσε τὸ τραῖνο καὶ θὰ τοὺς σκότωνε. Βλέπετε, ἡ Παναγία σὰν καλὴ Μητέρα προστατεύει καὶ προνοεῖ ἀκόμα καὶ γιὰ τὰ ἄτακτα παιδιά Της.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅσο μπορεῖτε, νὰ κρατᾶτε σφιχτὰ ἀπὸ τὸ φόρεμα τὴν Μεγάλη μας Ἀρχόντισσα Παναγία, γιὰ νὰ σᾶς βοηθάη. Εὔχομαι ἡ Παναγία, ποὺ εἶναι ἡ Φιλόστοργος Μητέρα ὅλου τοῦ κόσμου, νὰ προστατεύη ὅλες σας καὶ ὅλον τὸν κόσμο. Ἀμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Ὁ Φύλακας Ἄγγελος
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ Φύλακας Ἄγγελος βρίσκεται δίπλα μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ὅλοι ἔχουμε Φύλακα Ἄγγελο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ὅταν βαπτίζεται ὁ ἄνθρωπος, ὁ Θεὸς τοῦ δίνει καὶ τὸν Φύλακα Ἄγγελό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅσοι δὲν εἶναι βαπτισμένοι, δὲν ἔχουν Φύλακα Ἄγγελο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οἱ ἀβάπτιστοι προστατεύονται ἀπὸ τὸν Θεό, ἀλλὰ Φύλακα Ἄγγελο δὲν ἔχουν· μόνον οἱ βαπτισμένοι ἔχουν. Τοὺς ἀναλαμβάνει στὸ Βάπτισμα καὶ τοὺς συνοδεύει σὲ ὅλη τους τὴν ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Φύλακας Ἄγγελός μας εἶναι συνέχεια κοντά μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοντά μας εἶναι· μᾶς παρακολουθεῖ σὲ κάθε βῆμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πόσο κοντά μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀνάλογα μὲ τὴν πνευματική μας κατάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, ἁμαρτάνουμε, φεύγει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε ἀπομακρύνεται, ἀλλὰ δὲν μᾶς ἐγκαταλείπει. Ὅταν δίνουμε δικαιώματα στὸν πειρασμὸ μὲ τὴν ἁμαρτωλὴ ζωή μας, ὁ Ἄγγελός μας δὲν ἀποθαρρύνεται, ὥστε νὰ μᾶς ἐγκαταλείψη, ἀλλὰ μᾶς παρακολουθεῖ θλιμμένος ἀπὸ μακριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, δὲν καταλαβαίνουμε τὴν παρουσία του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατὶ ἀκόμη δὲν καταλάβαμε οὔτε τὴν παρουσία τοῦ Θεοῦ. Τὰ μάτια μας εἶναι σκεπασμένα μὲ ἕνα θαμπὸ πέπλο. Γιὰ νὰ διαλυθῆ τὸ πέπλο αὐτό, χρειάζεται ἀγάπη καὶ ταπείνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν ὁ ἄνθρωπος νιώθη τὴν παρουσία τοῦ Θεοῦ, νιώθει καὶ τὸν Φύλακα Ἄγγελο δίπλα του, καὶ τότε οἱ κινήσεις του εἶναι λεπτές, προσεκτικές, ἀλλὰ καὶ ἄνετες. Ἡ προσοχὴ αὐτὴ δὲν τοῦ κάνει μαρτυρικὴ τὴν ζωή, ἀλλὰ τὸν εὐχαριστεῖ. Κινεῖται μὲ πνευματικὴ ἄνεση. Ἡ εὐλάβεια, ἡ προσοχὴ ποὺ ἔχει, τοῦ γλυκαίνουν τὴν καρδιὰ καὶ συνέχεια προσέχει, γιὰ νὰ μὴν τοῦ φύγη ἡ γλυκύτητα, τὴν ὁποία νιώθει. Ξαπλώνει συνεσταλμένα μὲ σταυρωμένα τὰ χέρια. Κοιμᾶται μὲ συστολή, μὲ εὐλάβεια· σηκώνεται ἥσυχα. Ὅταν τοῦ χτυποῦν τὴν πόρτα, δὲν κοιτάζει νὰ συμμαζευτῆ· εἶναι πάντα τακτοποιημένος. Συνέχεια φροντίζει νὰ μὴ λυπήση τὸν Φύλακα Ἄγγελό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μεγάλη κατανόηση βρίσκει ὁ οὐράνιος Φύλακας Ἄγγελος κοντὰ σὲ ἕναν ἐπίγειο ἀγγελοποιημένο ἄνθρωπο. Ὅταν ὁ ἄνθρωπος ζῆ πνευματικὴ ζωὴ καὶ κινῆται σὰν φρόνιμο παιδί, ὁ Ἄγγελός του δὲν ταλαιπωρεῖται, ἀλλὰ χαίρεται δίπλα του καὶ στὸ τέλος θὰ ἐπιστρέψη χαρούμενος στὸν Θεὸ μαζὶ μὲ τὴν ψυχή, διότι ἡ ψυχὴ ἔκανε ὅ,τι ἀναπαύει τὸν Ἄγγελο, ὅ,τι ἀναπαύει τὸν Θεό. Ξέρετε ὅμως τί εἶναι, ὁ Φύλακας Ἄγγελος νὰ ταλαιπωρῆται χρόνια μὲ μιὰ ψυχή, καὶ τελικὰ νὰ ἐπιστρέψη στὸν Θεὸ μὲ ἄδεια χέρια πληγωμένος; Καὶ μόνο γι’ αὐτὸν τὸν λόγο, ἀπὸ φιλότιμο γιὰ τὸν κόπο ποὺ κάνει ὁ Φύλακας Ἄγγελός μου, πρέπει νὰ ἀγωνισθῶ, γιὰ νὰ μὴν πάω στὴν κόλαση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ Φύλακας Ἄγγελος μᾶς προστατεύει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Φύλακας Ἄγγελος μᾶς βοηθάει πάντοτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀπὸ μᾶς ἐξαρτᾶται πόσο θὰ ἔχουμε τὴν βοήθειά του. Ἂν πατήσουμε λιγάκι σὲ στερεὸ ἔδαφος, μπορεῖ νὰ πατήση καὶ ὁ Ἄγγελος καὶ νὰ μᾶς γλυτώση ἀπὸ ἕναν κίνδυνο. Ἂν κάνουμε ἐμεῖς αὐτὸ ποὺ πρέπει νὰ κάνουμε, τότε καὶ ὁ Ἄγγελος θὰ κάνη αὐτὸ ποὺ πρέπει νὰ κάνη. Ἔχουν γίνει πολλὰ θαύματα μὲ τὴν βοήθεια τῶν Ἀγγέλων. Συνέβη νέοι νὰ γλυτώσουν ξαφνικὰ ἀπὸ ἁμαρτία κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόση δύναμη ἔχει ὁ Ἄγγελος! Βοηθάει ἀκόμη καὶ μὲ τὴν σιωπή του. Κάποτε βρισκόμουν σὲ ἀδιέξοδο. Ἀπὸ τὴν στενοχώρια αἰσθανόμουν νὰ μοῦ χτυποῦν τὸ κεφάλι μὲ σμίλη[52], γιὰ νὰ μοῦ σπάσουν τὸ κούτελο. Τὰ μάτια μου κόντευαν νὰ βγοῦν ἔξω, ἰδιαίτερα τὸ δεξί. Πόνος, πόνος ἀνυπόφορος! Ἔφερνα σβούρα, σπαρταροῦσα ἀπὸ τὸν πόνο. Δὲν ἤξερα τί νὰ κάνω. Ἔκανα προσευχὴ καὶ ζητοῦσα ἀπὸ τὸν Θεὸ νὰ βρεθῆ ἕνας τρόπος νὰ βγῶ ἀπὸ τὸ ἀδιέξοδο. Καὶ ξαφνικά, βλέπω στὸν δεξιὸ ὦμο τὸν Φύλακα Ἄγγελο. Ἦταν ἴσα μὲ δώδεκα χρονῶν παιδάκι. Εἶχε ἕνα ὄμορφο στρογγυλὸ προσωπάκι μὲ στρογγυλὰ ματάκια. Ἕνα προσωπάκι! Φεγγοβολοῦσε! Καὶ μόνο μὲ τὴν παρουσία του μοῦ ἔφυγε καὶ ὁ πόνος καὶ ὅλα· ὄχι ἀπὸ τὴν χαρά, ἀλλὰ ἀπὸ τὴν θεία Χάρη. Ἡ χαρὰ δὲν διώχνει τὸν πόνο, ἔχεις τὸν πόνο καὶ χαίρεσαι συγχρόνως, ἐνῶ ἡ θεία Χάρις!... Μεγάλη ὑπόθεση! Δὲν περιγράφεται! «Ἂν εἶναι ἔτσι, εἶπα, ὄχι μὲ σμίλη, ἀλλὰ μὲ βαριὰ[53]ἂς μὲ χτυποῦν στὸ κεφάλι!». Ἄξιζε νὰ μοῦ σπάσουν τὸ κεφάλι, καὶ μόνο γι’ αὐτό. Μετὰ βρέθηκε καὶ ἡ λύση, ποὺ ἀνθρωπίνως δὲν ὑπῆρχε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σᾶς μίλησε, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, μόνο μὲ κοιτοῦσε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν βλέπης τὸν Ἄγγελο, βλέπεις τὴν μορφή του· ἀλλὰ στὴν πραγματικότητα πῶς εἶναι; Τὸν βλέπεις σὰν νὰ ἔχη ὕλη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι κάτι πολὺ λεπτό…
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ποτὲ νὰ μὴν ξεχνοῦμε ὅτι ὁ Φύλακας Ἄγγελός μας ἀοράτως βρίσκεται πάντα κοντά μας, μᾶς φρουρεῖ καὶ μᾶς προσέχει. Χρειάζεται ὅμως κι ἐμεῖς νὰ προσέχουμε τὴν ζωή μας καὶ νὰ μὴν ἁμαρτάνουμε.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Οἱ Ἅγιοι, τὰ ἀγαπημένα παιδιὰ τοῦ Θεοῦ
- type: h2
  initial:
    ru: ''
  text:
    ru: «Τιμὴ Ἁγίου, μίμησις Ἁγίου»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, διάβασα κάπου ὅτι οἱ Ἅγιοι τὴν ἡμέρα τῆς μνήμης τους δίνουν δῶρα σὲ ὅσους τοὺς ἐπικαλοῦνται. Ἔτσι εἶναι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, κερνοῦν πνευματικὰ κανταΐφια! Ἅμα γλυκαίνουμε τοὺς Ἁγίους μὲ τὴν ζωή μας, μᾶς κερνοῦν γλυκὰ πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς θὰ ἀγαπήσω ἕναν Ἅγιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιόν Ἅγιο θέλεις νὰ ἀγαπήσης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τοὺς Ἁγίους Θεοπάτορες Ἰωακεὶμ καὶ Ἄννα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐσὺ νὰ κάνης εὐχὴ γιὰ μένα στοὺς Ἁγίους Θεοπάτορες νὰ μὲ βοηθοῦν, κι ἐγὼ θὰ εὔχωμαι νὰ τοὺς ἀγαπήσης. Ἐὰν μπορῆς, νὰ διαβάζης κάθε μέρα τὸ Συναξάρι τοῦ Ἁγίου ποὺ γιορτάζει, γιὰ νὰ συνδέεσαι μὲ ὅλους τοὺς Ἁγίους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἡ μελέτη τοῦ βίου τοῦ Ἁγίου τῆς ἡμέρας, καὶ γενικὰ τῶν Συναξαρίων, πολὺ βοηθάει, γιατὶ θερμαίνεται ἡ ψυχὴ καὶ παρακινεῖται νὰ μιμηθῆ τοὺς Ἁγίους. Ἀφήνει τότε ὁ ἄνθρωπος στὴν ἄκρη κάθε εἶδος κακομοιριᾶς καὶ προχωρεῖ μὲ λεβεντιά. Τὰ Συναξάρια βοηθοῦν στὴν ἀνδρεία τὴν ψυχική, ἀκόμη καὶ στὸ μαρτύριο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς συμβαίνει, Γέροντα, Ἅγιοι ποὺ ἔχουν τὸ ἴδιο ὄνομα νὰ ἔχουν καὶ τὸ ἴδιο μαρτύριο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐσένα πῶς σὲ λένε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μαρία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἁγία Μαρία ὑπάρχει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ Ἁγία Μαρία ἡ Αἰγυπτία, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ Ἁγία Μαρία μαρτύριο δὲν ἔχει· ὁπότε τὸ γλυτώνεις. Ἔχει ὅμως ἄσκηση· νὰ τὴν μιμηθῆς στὴν ἄσκηση, γιὰ νὰ ἔχετε… τὸ ἴδιο Συναξάρι! Εὐλογημένη, οἱ Ἅγιοι αὐτοὶ προσπάθησαν νὰ μιμηθοῦν τὸν Ἅγιό τους, ποὺ τὸν εἶχαν σὲ εὐλάβεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς ἀποκτάει κανεὶς φιλία μὲ ἕναν Ἅγιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει νὰ συγγενέψη μὲ τὸν Ἅγιο.«Τιμὴ Ἁγίου, μίμησις Ἁγίου»[54], λέει ὁ Μέγας Βασίλειος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μὲ πειράζει ἡ συνείδηση ποὺ ἔχω τὸ ὄνομα μεγάλης Ἁγίας καὶ μὲ τὴν ζωή μου δὲν ἀνταποκρίνομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ προσπαθήσης νὰ μιμηθῆς τὴν Ἁγία σου. Ἡ Ἁγία Συγκλητικὴ ἦταν τετραπέρατη καὶ τώρα κατήργησε τὶς ἀποστάσεις καὶ μπορεῖ νὰ κινῆται ἄνετα στὰ πέρατα τῆς γῆς. Ἐσὺ τί κάνεις; Ἔχεις φιλία μαζί της; Τὴν παρακαλᾶς νὰ σοῦ λαμπικάρη τὸν νοῦ, νὰ τὸν κάνη λεπτό, γιὰ νὰ μπορῆς νὰ μπαίνης βαθιὰ στὰ θεῖα νοήματα; Βλέπεις, ἀδελφή μου, μερικὰ ὀνόματα ἔχουν καὶ εὐθύνη. Σὲ ἀγαπάει πάντως ἡ Ἁγία σου. Νὰ τὴν παρακαλᾶς καὶ νὰ ἐπιμένης, γιὰ νὰ σὲ βοηθάη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἐγώ, τώρα ἐσχάτως, ἔχω τεμπελιάσει καὶ ζῶ μὲ ἐλεημοσύνες τῶν Ἁγίων, ποὺ τοὺς ζητῶ συνέχεια σὰν ζητιάνος, ὅπως καὶ ἀπὸ ὅλους ζητῶ νὰ προσεύχωνται γιὰ μένα. Οἱ Ἅγιοι μὲ τὴν πολλή τους ἀγάπη μοῦ προσφέρουν ἀπὸ τὸν οὐράνιο ἄρτο καὶ ἀπὸ τὸ παραδεισένιο μέλι[55].
- type: h2
  initial:
    ru: ''
  text:
    ru: Εὐωδία τῶν ἱερῶν Λειψάνων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἡ ἁγία κάρα τοῦ Ἁγίου Ἀρσενίου εὐωδίαζε ἰδιαίτερα στὴν μνήμη του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί νὰ μὴν εὐωδιάζη; Νὰ μὴν κεράση ὁ Ἅγιος τὸν κόσμο στὴν γιορτή του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, τὰ ἅγια Λείψανα δὲν εὐωδιάζουν πάντοτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι διάφορες περιπτώσεις. Ἄλλοτε μπορεῖ αὐτὸς ποὺ προσκυνάει νὰ εἶναι πολὺ ἁμαρτωλὸς καὶ νὰ εὐωδιάζουν τὰ ἅγια Λείψανα, γιὰ νὰ βοηθηθῆ ὁ ἄνθρωπος, νὰ πάρη τὴν καλὴ στροφή, νὰ μετανοήση. Ἄλλοτε μπορεῖ νὰ εἶναι ἐνάρετος καὶ νὰ μὴν εὐωδιάσουν, γιὰ νὰ μὴν πέση στὴν ὑπερηφάνεια. Ἄλλοτε σὲ ἕναν ἐνάρετο εὐωδιάζουν τὰ Λείψανα ἑνὸς Ἁγίου, σὰν νὰ τοῦ δίνη ὁ Ἅγιος ἕνα κέρασμα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοὶ ἀμφιβάλλουν γιὰ τὴν εὐωδία τῶν ἱερῶν Λειψάνων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ λογικὴ φταίει. Τὰ Λείψανα τῶν Ἁγίων ἔχουν Χάρη Θεοῦ. Χειμώνα καιρὸ ὁ τόπος κοντὰ στὴν «Παναγούδα» εὐωδιάζει. Καὶ στὰ Κατουνάκια ποὺ ἤμουν[56], κοντὰ στὸν «Ἅγιο Βασίλειο», εὐωδίαζε ὁ τόπος σὲ ἕνα σημεῖο. Δὲν ὑπάρχει πιὰ Κελλὶ ἐκεῖ· μόνον κάτι πέτρες. Πόσα ἅγια Λείψανα θὰ βρίσκωνται καὶ σ’ ἐκεῖνο τὸ μέρος! Καὶ ποιός ξέρει πότε ὁ Θεὸς θὰ τὰ παρουσιάση!
- type: h2
  initial:
    ru: ''
  text:
    ru: Εὐωδία τῶν ἱερῶν Λειψάνων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Νὰ ἐπικαλούμαστε μὲ εὐλάβεια τοὺς Ἁγίους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἂν εἶναι εὐλογημένο, θὰ ἤθελα νὰ μοῦ ἐξηγήσετε κάτι ἀπὸ τὸν Ἰσαάκ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἀπὸ ποιόν; Ἀπὸ τὸν παπα-Ἰσαάκ; «Ἀπὸ τὸν Ἀββᾶ Ἰσαὰκ» νὰ λές! Ὅταν μιλᾶμε γιὰ τὸν παπα-Ἰσαάκ, λέμε «ὁ πατὴρ Ἰσαάκ», καὶ τοὺς Ἁγίους νὰ τοὺς ἀποκαλοῦμε μόνο μὲ τὸ ὄνομά τους; Δὲν ταιριάζει. Δὲν μπορεῖς νὰ προσεύχεσαι λ.χ. στὸν Ἅγιο Γεώργιο καὶ νὰ λές: «Γιώργη μου, κάνε μου αὐτό». Αὐτὸ ἔχει ἀναίδεια. Εἶχα δώσει σὲ ἕναν κοσμικὸ ἕνα μικρὸ τεμάχιο ἀπὸ τὸ ἱερὸ Λείψανο τοῦ Ἁγίου Ἀρσενίου καὶ μετὰ αὐτὸς ἔλεγε: «Ἀρσένιε, Ἀρσένιε…». Ἀπὸ ποῦ κι ὣς ποῦ;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, τὸ ἔκανε ἀπὸ ἁπλότητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἁπλότητα εἶναι αὐτή; Οὔτε σὲ ἕναν ἄνθρωπο, ἂν ἦταν μεγαλύτερός του, δὲν θὰ ἔπρεπε νὰ μιλήση ἔτσι. Καὶ πατέρας του νὰ ἦταν, πάλι δὲν θὰ ἔπρεπε νὰ μιλήση ἔτσι. Καὶ δυὸ χρόνια νὰ ἦταν μεγαλύτερός του, πάλι δὲν θὰ ταίριαζε, ἀφοῦ ἦταν κληρικός. Πόσο μᾶλλον τώρα ποὺ εἶναι Ἅγιος! Καὶ τὸ ἔλεγε καὶ σὲ ἄλλους. Οὔτε στοιχειώδη σεβασμὸ δὲν εἶχε!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δὲν ὑπάρχει περίπτωση νὰ ἀπευθύνεται κανεὶς ἔτσι σὲ ἕναν Ἅγιο ἀπὸ πραγματικὴ ἁπλότητα, χωρὶς νὰ ἔχη ἀναίδεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πρέπει νὰ ἔχη φθάσει σὲ μεγάλη πνευματικὴ κατάσταση, γιὰ νὰ μπορῆ νὰ ἐπικοινωνήση ἔτσι μὲ τοὺς Ἁγίους· νὰ ἔχη φθάσει στὴν ἁγία παρρησία τῆς μεγάλης εὐλάβειας καὶ ἁπλότητος. Κάποιες ἁπλὲς ψυχές, ποὺ εἶναι σὰν μικρὰ παιδιά, μποροῦν νὰ ποῦν μὲ τὴν ἁπλότητα καὶ τὴν ἀθωότητα τοῦ παιδιοῦ στὸν Θεό: «Θεέ μου, πρέπει νὰ μοῦ τὸ δώσης αὐτό· γιατί δὲν μοῦ τὸ δίνεις;». Θυμᾶστε ποὺ ἀναφέρω στοὺς«ἉγιορεῖτεςΠατέρες»γιὰ ἕναν Πατέρα ποὺ εἶχε παιδικὴ ἁπλότητα; Ὅταν εἶχε στερέψει τὸ πηγάδι στὸ Κελλί τους, ἔδεσε τὴν εἰκόνα τοῦ Ἁγίου Νικολάου ἀπὸ τὸν χαλκᾶ μὲ ἕνα σχοινί, τὴν κατέβασε στὸ ξηροπήγαδο καὶ εἶπε στὸν Ἅγιο μὲ πολλὴ ἁπλότητα: «Ἅγιε Νικόλαε, νὰ ἀνεβῆς μαζὶ μὲ τὸ νερό, ἐὰν θέλης νὰ σοῦ ἀνάβω τὸ καντήλι. Ἔρχονται στὸ Κελλὶ τόσοι ἄνθρωποι, καὶ δὲν ἔχουμε λίγο κρύο νερὸ νὰ τοὺς δώσουμε». Ἀμέσως τὸ νερὸ ἄρχισε σιγὰ-σιγὰ νὰ ἀνεβαίνη, καὶ ἡ εἰκόνα τοῦ Ἁγίου Νικολάου ἔπλεε ἐπάνω στὸ νερό. Τὴν πῆρε, τὴν ἀσπάσθηκε μὲ εὐλάβεια καὶ τὴν πῆγε στὸν ναό[57]. Ὅποιος ὅμως ἀπευθύνεται μὲ παρρησία στὸν Θεὸ ἢ στοὺς Ἁγίους, ἐνῶ δὲν ἔχει φθάσει σὲ τέτοια πνευματικὴ κατάσταση, ἔχει ἀναίδεια καὶ παροργίζει τὸν Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ἀγρυπνῶ στὸ κελλί μου τὴν παραμονὴ τῆς μνήμης ἑνὸς Ἁγίου ποὺ εὐλαβοῦμαι, τί θὰ μὲ βοηθήση νὰ νιώσω περισσότερο τὸν Ἅγιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ διαβάσης πρῶτα τὸ Συναξάρι τοῦ Ἁγίου. Ὕστερα νὰ διαβάσης ἀπὸ τὸ Μηναῖο[58]ὅλα τὰ τροπάρια τοῦ Κανόνος τοῦ Ἁγίου, ποὺ καὶ αὐτὰ περιέχουν τὴν ζωή του. Βέβαια οἱ Κανόνες τοῦ Μηναίου εἶναι περισσότερο ἐγκώμια γιὰ τὸν Ἅγιο. Ἡ πραγματικὴ προσευχὴ εἶναι τὸ«Ἅγιε τοῦ Θεοῦ,πρέσβευε ὑπὲρ ἡμῶν» ποὺ λέμε πρὶν ἀπὸ κάθε τροπάριο. Στὴν συνέχεια νὰ ζητήσης τὴν βοήθεια τοῦ Ἁγίου γιὰ διάφορα θέματα καὶ νὰ κάνης ὅ,τι μπορεῖς, μετάνοιες, κομποσχοίνι κ.λπ., ἀρκεῖ νὰ προσεύχεσαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν ἡ ψυχὴ ζῆ τὸν Ἅγιο, ζητᾶ μὲ εὐλάβεια καὶ μὲ πίστη τὴν βοήθειά του. Ἡ προσευχὴ μὲ εὐλάβεια γίνεται φυσιολογικά, ὅταν στὸν ἄνθρωπο ὑπάρχη εὐλάβεια γιὰ τοὺς Ἁγίους στοὺς ὁποίους ἀπευθύνεται. Προηγεῖται ἡ γνωριμία, ὕστερα ἔρχεται ἡ φιλία καὶ μετὰ ἡ γλυκειὰ συνομιλία μὲ σεβασμὸ καὶ ἁπλότητα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ βοήθεια τῶν Ἁγίων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς αἰσθάνεται ὁ Ἅγιος Ἀρσένιος τώρα ποὺ ἀπέκτησε ναό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χαρὰ αἰσθάνεται, γιατὶ ἀπέκτησε μαντρὶ καὶ ἔβαλε μέσα τὰ πρόβατά του, γιὰ νὰ τὰ προστατεύη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ κόσμος, Γέροντα, ὕστερα ἀπὸ τὴν ἀναγνώριση ἑνὸς Ἁγίου βοηθιέται περισσότερο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φυσικὰ βοηθιέται. Οἱ Ἅγιοι, ὅταν ἀναγνωρίζωνται ἀπὸ τὴν Ἐκκλησία, αἰσθάνονται ὑποχρέωση νὰ μᾶς βοηθοῦν· ἀναγκάζονται κατὰ κάποιον τρόπο νὰ βοηθοῦν περισσότερο, ἀλλὰ καὶ ὁ Θεὸς τοὺς στέλνει νὰ βοηθοῦν τὸν κόσμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ, Γέροντα, ἕνας Ἅγιος νὰ ζητήση ἀπὸ τὸν Θεὸ νὰ τιμοῦν οἱ ἄνθρωποι τὴν μνήμη του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὄχι, οἱ Ἅγιοι δὲν ζητοῦν τέτοια πράγματα. Δὲν λένε στὸν Θεό: «Θεέ μου, νὰ τιμοῦν οἱ πιστοὶ τὴν μνήμη μου, γιὰ νὰ τοὺς βοηθᾶς» ἢ «ὅσους τιμοῦν τὴν μνήμη μου, αὐτοὺς μόνο νὰ βοηθᾶς», ἀλλὰ λένε: «Θεέ μου, ἐπειδὴ τιμοῦν τὴν μνήμη μου, ἀντάμειψέ τους».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὸν Εὐαγγελιστὴ Ἰωάννη νιώθω περισσότερη εὐλάβεια παρὰ στὴν Ἁγία μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ Ἁγία σου πάντως δὲν ζηλεύει, γιατὶ ἀγαπᾶς καὶ εὐλαβεῖσαι περισσότερο τὸν Ἅγιο Ἰωάννη τὸν Θεολόγο· ὄχι μόνον ἐπειδὴ πρέπει νὰ τὸν εὐλαβῆσαι ὡς Προστάτη τοῦ Ἡσυχαστηρίου, ἀλλὰ καὶ Προστάτης σας νὰ μὴν ἦταν, ἡ Ἁγία σου, ὅπως καὶ ὅλοι οἱ Ἅγιοι, χαίρονται, ὅταν εἴμαστε συνδεδεμένοι μὲ ὁποιονδήποτε Ἅγιο, γιὰ νὰ βοηθιώμαστε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οἱ Ἅγιοι εἶναι ἅγιοι καὶ δὲν ἔχουν ἀνθρώπινα πάθη, ἀνθρώπινες μικρότητες. Ὁ καθένας μας ὅπως νιώθει, ἔτσι καὶ βοηθιέται. Μπορεῖ κάποιος νὰ ζητάη κάτι ἀπὸ ἕναν μεγάλο Ἅγιο καὶ νὰ βοηθιέται, μπορεῖ κάποιος ἄλλος νὰ ζητάη κάτι ἀπὸ ἕναν μικρὸ Ἅγιο καὶ πάλι νὰ βοηθιέται, γιατὶ ἡ δύναμη τοῦ Θεοῦ εἶναι ποὺ ἐνεργεῖ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν κάποιος ἔχη ἰδιαίτερη εὐλάβεια σὲ ἕναν Ἅγιο, τί ἔχει συμβῆ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιὰ νὰ ἔχη ἰδιαίτερη εὐλάβεια σὲ κάποιον Ἅγιο, πρέπει ὁ Ἅγιος νὰ τοῦ ἔχη μιλήσει μέσα του μὲ τὸν ἕναν ἢ μὲ τὸν ἄλλον τρόπο. Καθένας ἀπὸ κάποιο γεγονὸς ποὺ τοῦ ἔχει συμβῆ μὲ τὴν βοήθεια ἑνὸς Ἁγίου, ἔχει καὶ μιὰ ἰδιαίτερη ἀγάπη στὸν Ἅγιο αὐτόν. Μπορεῖ νὰ εἶναι σοβαρὸ αὐτὸ τὸ γεγονός, μπορεῖ νὰ εἶναι καὶ ἁπλό. Νά, ἐγώ, ἐπειδὴ ἀπὸ μικρὸς πήγαινα στὸ Ἐκκλησάκι τῆς Ἁγίας Βαρβάρας, ἐκεῖ στὴν Κόνιτσα, ἔχω σὲ μεγάλη εὐλάβεια τὴν Ἁγία Βαρβάρα. Ἡ Ἁγία μὲ βοήθησε καὶ στὸν στρατό, ὅταν μὲ πῆραν στοὺς ἀσυρματιστές, ἐνῶ ἤμουν ἀγράμματος· μὲ βοήθησε ὕστερα καὶ στὸ Σανατόριο μετὰ τὴν ἐγχείρηση στοὺς πνεύμονες[59]. Τότε οἱ γιατροὶ μοῦ εἶχαν πεῖ ὅτι, μόλις θὰ καθάριζε ὁ πνεύμονας, θὰ ἀφαιροῦσαν τὰ λάστιχα καὶ τὸ μηχάνημα[60]. Καὶ ἐνῶ θὰ τὰ ἔβγαζαν σὲ πέντε μέρες, εἶχαν περάσει εἴκοσι πέντε μέρες καὶ δὲν τὰ εἶχαν ἀφαιρέσει, καὶ ὑπέφερα πολύ. Τὸ Σάββατο 3 Δεκεμβρίου περίμενα τοὺς γιατρούς, γιὰ νὰ μὲ ἐλευθερώσουν ἀπὸ τὸ μαρτύριο αὐτό, ἀλλὰ δυστυχῶς δὲν φάνηκαν. Τὴν Κυριακὴ τὸ πρωί, ποὺ ἦταν ἡ μνήμη τῆς Ἁγίας Βαρβάρας, λέω: «Ἂν ἦταν νὰ βοηθήση ἡ Ἁγία, ἔπρεπε νὰ εἶχε βοηθήσει. Οἱ γιατροὶ ἔφυγαν. Σήμερα, Κυριακή, ἀποκλείεται νὰ ἔρθουν. Τώρα ποιός θὰ μοῦ βγάλη τὰ λάστιχα;». Εἶπα καὶ κανα-δυὸ λόγια μὲ παράπονο: «Ἐγὼ ἄναβα τὰ καντήλια τόσες φορὲς στὸ Ἐκκλησάκι τῆς Ἁγίας, τί καντηλῆθρες, τί λάδια πήγαινα, τὸ καθάριζα, τὸ βόλευα. Δυὸ λάστιχα νὰ μὴ μοῦ βγάλουν;». Μετὰ ὅμως σκέφθηκα: «Φαίνεται, θὰ λύπησα τὴν Ἁγία Βαρβάρα, καὶ γι’ αὐτὸ δὲν φρόντισε νὰ μοῦ τὰ βγάλουν». Ξαφνικὰ ἀκούω θόρυβο. «Τί γίνεται; λέω, κάποιος ἔπαθε κάτι;». «Ἔρχονται οἱ γιατροί», μοῦ λένε. Δὲν ξέρω τί τὸν ἔπιασε τὸν διευθυντὴ καὶ εἶπε στοὺς γιατροὺς πρωὶ-πρωί: «Νὰ πᾶτε νὰ βγάλετε τὰ λάστιχα τοῦ καλόγερου!». Μπαίνουν στὸν θάλαμο καὶ μοῦ λένε: «Ἔχουμε ἐντολὴ νὰ βγάλουμε τὰ λάστιχα». Τῆς… κακοφάνηκε τῆς Ἁγίας Βαρβάρας, γιατὶ εἶπα κανα-δυὸ λόγια μὲ παράπονο! Πρέπει νὰ γκρινιάξης λίγο! Ἀλλὰ καλύτερα εἶναι νὰ μὴν γκρινιάζης· ἔχει ἀρχοντιά, ἅμα δὲν γκρινιάζης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπεις, ἕνας Ἅγιος ἄλλοτε δίνει ἀμέσως ὅ,τι τοῦ ζητᾶμε καὶ ἄλλοτε τὸ δίνει ἀργότερα. Ἄλλοτε ἀκούει τὸν προσευχόμενο, γιατὶ βρίσκεται σὲ καλὴ πνευματικὴ κατάσταση, καὶ ἄλλοτε, γιατὶ κλαίει καὶ γκρινιάζει σὰν μικρὸ παιδί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεῖ ἕνας Ἅγιος νὰ μὲ ἀποστραφῆ λόγῳ τῆς ἄσχημης πνευματικῆς μου καταστάσεως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, εὐτυχῶς οἱ Ἅγιοι δὲν τὸ κάνουν αὐτό. Ἀλλοίμονό μας, ἂν τὸ ἔκαναν. Ἂν δὲν μᾶς βοηθοῦσαν, θὰ ἤμασταν χαμένοι. Σκεφθῆτε· ἐκεῖνοι εἶναι ἐπάνω στὸν Οὐρανὸ καὶ ἀγάλλονται, κι ἐμεῖς εἴμαστε ἐδῶ κάτω καὶ ταλαιπωρούμαστε. Ἔτσι, ὅταν ζητᾶμε κάτι, εἶναι λίγο... ἄδικο νὰ μὴ μᾶς ἀκοῦν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἄν, Γέροντα, κάνουμε προσευχὴ καὶ ζητήσουμε τὴν βοήθεια τῶν Ἀγγέλων καὶ ὅλων τῶν Ἁγίων, ὅλοι μαζὶ πρεσβεύουν στὸν Θεὸ γιὰ μᾶς; Ἑνώνονται οἱ προσευχές τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καθένας βοηθάει, ἂν χρειάζεται νὰ βοηθήση, ἂν μᾶς ὠφελῆ δηλαδή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν βοηθιέμαι ἀπὸ ἕναν Ἅγιο, νὰ τὸ λέω στὶς ἀδελφές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, μόνο στὴν Γερόντισσα νὰ τὸ λὲς καὶ νὰ νιώθης πολλὴ εὐγνωμοσύνη. Δὲν ἔχει δικαίωμα ἕνας Ἅγιος νὰ σοῦ προσφέρη κάτι; Πῶς σᾶς οἰκονομοῦν οἱ Ἅγιοι! Ἀπὸ πόσα βραχυκυκλώματα σᾶς γλυτώνουν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί εἴδατε, Γέροντα, καὶ τὸ λέτε αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θὰ μποροῦσα νὰ σᾶς πῶ πολλά, ἀλλὰ εἶναι πολλά! Ἕνα μόνο σᾶς λέω, ὅτι οἱ Ἅγιοι ἔχουν βαλθῆ νὰ μᾶς παλαβώσουν!
- type: h2
  initial:
    ru: ''
  text:
    ru: Οἱ Ἅγιοι καταργοῦν τὶς ἀποστάσεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Ἅγιος Γεώργιος, ὁ ἡγούμενος τοῦ Σινᾶ, πῶς ἀπὸ τὸ Σινᾶ βρέθηκε στὰ Ἰεροσόλυμα καὶ κοινώνησε[61];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῆγε καὶ ἦρθε ἐν ριπῇ ὀφθαλμοῦ. Ἁρπαγὴ ἦταν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἐκείνη τὴν ὥρα ἦταν καὶ στὸ κελλί του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν ἦταν στὸ κελλί του· μέσα σὲ δευτερόλεπτα πῆγε στὰ Ἰεροσόλυμα, κοινώνησε καὶ μὲ ταχύτητα μεγάλη ξαναγύρισε στὸ Σινᾶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πετοῦσε, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σοῦπερ βενζίνη εἶχε! Ταξίδεψε μὲ πνευματικὸ εἰσιτήριο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς γίνεται, Γέροντα, τὴν ἴδια ὥρα ὁ ἴδιος Ἅγιος νὰ βρίσκεται σὲ δύο μέρη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μόνον ὁ Θεὸς εἶναι πανταχοῦ παρών· οἱ Ἅγιοι πηγαίνουν ἀπὸ τὸ ἕνα μέρος στὸ ἄλλο μὲ τέτοια ταχύτητα, ποὺ οἱ ἀποστάσεις καταργοῦνται· δὲν ὑπάρχουν γι’ αὐτοὺς κοντινὲς ἢ μακρινὲς ἀποστάσεις. Ὅταν ἤμουν στὸ Σανατόριο, ἦταν ἕνας, ὁ καημένος, χρόνια ἄρρωστος – Χαράλαμπο τὸν ἔλεγαν. Εἶχε ἀρραβωνιασθῆ καὶ μιὰ νοσοκόμα ἀπὸ τὸ Σανατόριο. Τότε οἱ γιατροὶ δὲν εἶχαν τὰ μέσα γιὰ τὴν θεραπεία τῆς φυματίωσης, καὶ κινδύνευε νὰ πεθάνη. Ἡ μάνα του, πάνω στὸν πόνο της, πῆγε σὲ ἕνα Μοναστήρι τῆς Ἁγίας Παρασκευῆς, γιὰ νὰ προσευχηθῆ. Ἐν τῷ μεταξὺ αὐτὸν τὸν εἶχαν στὴν ἐντατικὴ καὶ δὲν ἄφηναν οὔτε τὴν ἀρραβωνιαστικιά του νὰ μπῆ μέσα. Κάποια στιγμὴ τὴν παίρνει τηλέφωνο ἡ μάνα του καὶ τῆς λέει: «Μὴ στενοχωριέσαι. Ἡ Ἁγία Παρασκευὴ μοῦ εἶπε ὅτι ὁ Χαράλαμπος θὰ γίνη καλά. Μοῦ εἶπε ἀκόμη: “Τώρα πάω καὶ στὸ Σανατόριο τῆς Λαμίας· κινδυνεύει κι ἐκεῖ κάποιος”». Ἐκείνη τὴν ὥρα ὁ ἄρρωστος ἔγινε καλά. Τηλεφωνεῖ μετὰ ἡ νοσοκόμα στὸ Σανατόριο τῆς Λαμίας καὶ ἀκριβῶς ἐκείνη τὴν ὥρα κάποιος ποὺ κινδύνευε ἐκεῖ ἔγινε καλὰ ὡς ἐκ θαύματος. Μὲ τί ταχύτητα πῆγε ἡ Ἁγία! Ἂν ἔτρεχε ἕνα αὐτοκίνητο μὲ τέτοια ταχύτητα, θὰ εἶχε διαλυθῆ. Ἐκείνη οὔτε βενζίνη σοῦπερ ἔκαψε, οὔτε τὰ λάστιχα χάλασαν!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οἱ ἄγνωστοι Ἅγιοι βοηθοῦν «ἐν τῷ κρυπτῷ»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οἱ ἄγνωστοι Ἅγιοι βοηθοῦν, ἀφοῦ δὲν τοὺς ἐπικαλούμαστε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλοὶ ἄγνωστοι Ἅγιοι βοηθοῦν καὶ χωρὶς νὰ τοὺς γνωρίζουμε. Αὐτοὶ γιὰ μένα εἶναι μεγαλύτεροι Ἅγιοι. Δὲν ἔχουν καμμιὰ δόξα ἀπὸ τοὺς ἀνθρώπους, ἀλλὰ μόνον ἀπὸ τὸν Θεό. Ἀπὸ μεγάλη ταπεινοφροσύνη παρακάλεσαν τὸν Θεὸ ἐπίμονα – ἔτσι μοῦ λέει ὁ λογισμὸς – νὰ μείνουν ἄγνωστοι, γιὰ νὰ μὴν τιμηθοῦν ἀπὸ τοὺς ἀνθρώπους, ἀλλὰ νὰ συνεχίζουν νὰ τοὺς βοηθοῦν μὲ τὸν ἴδιο τρόπο,«ἐν τῷ κρυπτῷ»[62]. Αὐτοὺς τοὺς ἀγνώστους Ἁγίους, πρέπει νὰ τοὺς ἔχουμε σὲ μεγάλη εὐλάβεια καὶ νὰ τοὺς χρεωστοῦμε πολλὴ εὐγνωμοσύνη, γιατὶ μᾶς βοηθοῦν σιωπηλὰ μὲ τὶς πρεσβεῖες τους καὶ μὲ τὸ σιωπηλό τους παράδειγμα, τὴν ἀφάνειά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κάποτε ἤθελα νὰ γράψω γιὰ ἕναν Πατέρα στὸ Ἅγιον Ὄρος, ποὺ εἶχε κοιμηθῆ. Εἶχα φέρει στὸν νοῦ μου ὅλα τὰ περιστατικὰ τῆς ζωῆς του, ποὺ γνώριζα, κι ἕνα βράδυ κάθησα νὰ τὰ γράψω. Ἄναψα τὸ κερί, πῆρα τὸ μολύβι καὶ τὸ τετράδιο, ἀλλὰ δὲν θυμόμουν τίποτε· οὔτε καὶ τὸ ὄνομά του, ἐνῶ τὸν ζοῦσα πολὺ ἔντονα τὶς ἡμέρες ἐκεῖνες. Ἔφερα στὸν νοῦ μου ὅλο τὸ Ἅγιον Ὄρος μὲ τὴν σειρά· τὰ Μοναστήρια, τὶς Σκῆτες, τὰ Καλύβια, ἀπὸ ὅπου εἶχα περάσει. Τὸ πῆρα καὶ ἀπὸ τὴν ἀνατολικὴ πλευρά, μήπως θυμηθῶ κάτι· τίποτε. Τὸ πῆρα καὶ ἀπὸ τὴν δυτική· τίποτε. Πῆρα τὴν χρονολογία ἀπὸ τότε ποὺ πῆγα στὸ Ἅγιον Ὄρος καὶ σκέφθηκα μὲ ποιούς Πατέρες συναναστράφηκα· τελικά, τίποτε δὲν μπόρεσα νὰ θυμηθῶ. Φαίνεται, ὁ Πατέρας δὲν θέλησε νὰ φανερωθῆ καὶ ὁ Θεὸς ἔκανε τὸ θαῦμα του. Μέχρι στιγμῆς τὸ μόνον ποὺ θυμᾶμαι εἶναι ὅτι ὁ βίος του μὲ εἶχε ἐντυπωσιάσει πιὸ πολὺ ἀπὸ τὸν βίο ὅλων τῶν ἄλλων Ἁγιορειτῶν Πατέρων γιὰ τοὺς ὁποίους ἔγραψα[63]. Ἀπὸ αὐτὸ κατάλαβα καὶ ὅτι, ἂν ὁ Θεὸς δὲν θέλη, ὁ ἄνθρωπος δὲν μπορεῖ νὰ κάνη τίποτε. Καὶ λίγο πάλι ἂν φυσήξη ὁ Θεός, γίνεται ὁ ἄνθρωπος φιλόσοφος.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Διακονητὲς» καὶ «Προστάτες» Ἅγιοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πονάει τὸ δόντι μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν εἶναι καλὰ νὰ πονέσης λίγο, γιὰ νὰ ὠφεληθῆς καὶ λίγο; Κάνε ἕνα κομποσχοίνι στὸν Ἅγιο Ἀντίπα, ποὺ βοηθάει στὸν πονόδοντο, καὶ θὰ σοῦ περάση ὁ πόνος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔκανα, Γέροντα, καὶ δὲν πέρασε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Φαίνεται κάτι θὰ φταίη. Ἂν τοῦ πῆς: «ἀπὸ τώρα θὰ εἶμαι πιὸ προσεκτικὴ σὲ ὅλα», ἀμέσως ὁ Ἅγιος θὰ βοηθήση. Ὁ Ἅγιος Ἀντίπας εἶναι μεγάλος Ἅγιος! Πόσο εὐαρέστησε στὸν Θεό!«Ἀντίπας ὁ μάρτυς μου ὁ πιστός»[64], λέει στὴν Ἀποκάλυψη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὴν Ἀκολουθία καὶ στὴν Παράκληση τῆς Ἁγίας Βαρβάρας ἀναφέρεται ὅτι ἡ Ἁγία θεραπεύει τὶς λοιμώδεις ἀσθένειες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιές εἶναι οἱ λοιμώδεις ἀσθένειες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οἱ ἀσθένειες, Γέροντα, ποὺ μεταδίδονται μὲ τὰ μικρόβια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε νὰ παρακαλᾶτε τὴν Ἁγία Βαρβάρα νὰ σᾶς βοηθάη, γιὰ νὰ μὴ μεταδίδεται τὸ «μικρόβιο» τῆς ζήλειας μεταξύ σας. Νὰ φωτοτυπήσης τὴν Παράκληση τῆς Ἁγίας Βαρβάρας καὶ νὰ τὴν μοιράσης στὶς ἀδελφές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ Ἁγία Βαρβάρα, Γέροντα, εἶναι προστάτις καὶ τοῦ Πυροβολικοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔ, καλά, ἕνας Ἅγιος μπορεῖ νὰ κάνη ὅλα τὰ διακονήματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, καὶ ἡ Ἁγία Εἰρήνη εἶναι προστάτις τῆς Χωροφυλακῆς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γι’ αὐτό, ὅταν καμμιὰ φορὰ δὲν ἔχης εἰρήνη, νὰ παρακαλᾶς τὴν Ἁγία Εἰρήνη, ποὺ κυβερνάει καὶ ὁλόκληρο τὸ σῶμα τῆς Χωροφυλακῆς[65]καὶ φέρνει εἰρήνη, νὰ φέρνη τὴν εἰρήνη καὶ μέσα στὴν καρδιά σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολὺ συχνὰ χάνω πράγματα καὶ μετὰ χάνω χρόνο γιὰ νὰ τὰ βρῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί δὲν ἐπικαλεῖσαι τὸν Ἅγιο Μηνᾶ ποὺ ἔχει εἰδικότητα σ’ αὐτό; Ὁ Ἅγιος Μηνᾶς ἀμέσως φανερώνει ὅ,τι χάσουμε, χωρὶς νὰ ἔχη πολλὲς ἀπαιτήσεις! Ἐγὼ μιὰ φορά, ὅταν ἤμουν στὸ Κοινόβιο[66], εἶχα χάσει τὸ κλειδὶ ἀπὸ τὸ κελλί μου – τότε κλειδώναμε τὰ κελλιά, γιατὶ μέσα στὸ μοναστήρι κυκλοφοροῦσαν καὶ διάφοροι κοσμικοί. «Δὲν πειράζει, λέω, θὰ πάω στὸ μαραγκούδικο». Κοιτάζω, ἔλειπε τὸ κλειδὶ καὶ ἀπὸ τὸ μαραγκούδικο. Πάω στὸ βουρδουναριό[67], ὅπου ἔφτιαχνα τὰ σαμάρια γιὰ τὰ ζῶα, καὶ ἀπὸ ’κεῖ ἔλειπε τὸ κλειδί. «Ποῦ νὰ πάω τώρα;», λέω. Ἄναψα τότε ἕνα κερὶ στὸν Ἅγιο Μηνᾶ καὶ ἀμέσως τὰ βρῆκα ὅλα τὰ κλειδιὰ ἐκεῖ ποὺ δὲν περίμενα. Ἕνα κερὶ καὶ ἐντάξει! Ὑποχρεώνονται οἱ Ἅγιοι μὲ τὸ κερί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τὸν Ἅγιο Μηνᾶ ἐγὼ δὲν ἤξερα ὅτι τὸν εἰκονίζουν καὶ καβαλλάρη. Ἡ μητέρα μου, ποὺ τὸν εἶχε δεῖ μιὰ φορὰ καὶ τῆς ἔδωσε ἀπάντηση γιὰ ἕνα θέμα, μοῦ εἶπε ὅτι ὁ Ἅγιος Μηνᾶς εἶναι καβαλλάρης. Ἐγὼ ἐπέμενα καὶ τῆς ἔλεγα ὅτι μόνον ὁ Ἅγιος Δημήτριος καὶ ὁ Ἅγιος Γεώργιος εἶναι καβαλλάρηδες. «Ὄχι, μοῦ ἔλεγε ἡ μητέρα μου, αὐτὸς ποὺ εἶδα ἦταν μὲ καστανὸ ἄλογο καὶ μοῦ εἶπε ὅτι εἶναι ὁ Ἅγιος Μηνᾶς. ″Ποιός εἶσαι; τὸν ρώτησα. Ὁ Ἅγιος Γεώργιος ἔχει ἄσπρο ἄλογο, ὁ Ἅγιος Δημήτριος κόκκινο· ἐσὺ ποιός εἶσαι;”. “Ὁ Ἅγιος Μηνᾶς εἶμαι”, μοῦ εἶπε».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεῖ ὁ Ἅγιος Σπυρίδων νὰ ζήτησε ἀπὸ τὸν Θεὸ νὰ μείνη ἄφθαρτο τὸ Λείψανό του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, πῶς μπορεῖ νὰ γίνη αὐτό; Οἱ Ἅγιοι δὲν ζητοῦν τέτοια πράγματα. Ὁ Θεὸς οἰκονόμησε νὰ μείνη ἄφθαρτο τὸ Λείψανο, γιὰ νὰ βοηθιοῦνται οἱ ἄνθρωποι. Καὶ βλέπετε πῶς τὰ ἔχει οἰκονομήσει ὁ Θεός! Ἐπειδὴ ἡ Κέρκυρα, ἡ Κεφαλλονιὰ καὶ ἡ Ζάκυνθος εἶναι κοντὰ στὴν Ἰταλία καὶ εὔκολα οἱ ἄνθρωποι θὰ μποροῦσαν νὰ παρασυρθοῦν ἀπὸ τὸν Καθολικισμό, ἔβαλε φράγμα ἐκεῖ πέρα τὸν Ἅγιο Σπυρίδωνα, τὸν Ἅγιο Γεράσιμο καὶ τὸν Ἅγιο Διονύσιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν εἴσαστε στὸ μοναστήρι, αἰσθάνομαι μεγάλη ἀσφάλεια. Ὅταν λείπετε καὶ συμβῆ κάποιος πειρασμός, δειλιάζω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μὴ φοβᾶσαι, ἔχετε Προστάτες μεγάλους κοντά σας· νὰ μὴν τοὺς ἀφήνετε, νὰ τοὺς ἐνοχλῆτε συνέχεια. Ὅταν θὰ χρειάζεται καὶ ἡ δική μου σκιὰ γιὰ ἀνθρώπινη βοήθεια, εἴτε ἀπὸ τὸ Ἅγιον Ὄρος εἴτε ἀπὸ κοντά, θὰ ὑπάρχη. Ἐὰν στὴν κοσμικὴ ζωὴ τὰ καλὰ ἀδέλφια φροντίζουν τὶς ἀδελφές τους, πόσο μᾶλλον στὴν πνευματικὴ ζωή, ποὺ εἶναι ἀνώτερη. Γι’ αὐτὸ καὶ σᾶς ἔχω ἀφήσει τὸν θησαυρὸ ποὺ εἶχα, τὸν Ἅγιο Ἀρσένιο, καὶ ἑπόμενο εἶναι νὰ εἶναι ἐδῶ καὶ ἡ καρδιά μου, γιατὶ«ὅπου ὁ θησαυρός, ἐκεῖ καὶ ἡ καρδία»[68]. Ἄλλωστε σᾶς τὸ εἶχα πεῖ: «Ὅ,τι πολύτιμο κι ἂν ἔχω, θὰ τὸ ἀφήσω στὴν Μονή σας, ὅπου μένει καὶ ὁ Ἅγιός μου», ὁ ὁποῖος σὲ κάποιον[69]εἶπε: «Ἐγὼ μένω ἔξω ἀπὸ τὴν Θεσσαλονίκη». Γι’ αὐτό, ἀφοῦ καὶ ὁ ἴδιος εἶπε ὅτι μένει ἐδῶ, νὰ τὸν παρακαλᾶς ἐκ μέρους μου – ἐὰν διστάζης –, νὰ παίρνη τὴν πατερίτσα του καὶ νὰ βολεύη μὲ τὸν τρόπο του τὰ ταγκαλάκια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αὐτὴ εἶναι καὶ ἡ δουλειὰ ὅλων γενικὰ τῶν Ἁγίων· νὰ βοηθοῦν καὶ νὰ προστατεύουν ἐμᾶς τοὺς ταλαίπωρους ἀνθρώπους ἀπὸ τοὺς ὁρατοὺς καὶ ἀοράτους πειρασμούς. Δική μας δουλειὰ εἶναι, ὅσο μποροῦμε, νὰ ζοῦμε πνευματικά, νὰ μὴ στενοχωροῦμε τὸν Χριστό, νὰ ἀνάβουμε τὸ καντηλάκι στοὺς Ἁγίους καὶ νὰ τοὺς παρακαλοῦμε νὰ μᾶς βοηθοῦν. Σὲ αὐτὴν τὴν ζωὴ ἔχουμε ἀνάγκη βοηθείας, γιὰ νὰ μπορέσουμε νὰ πᾶμε κοντὰ στὸν Χριστό. Στὴν ἄλλη ζωή, ἐὰν ὁ Θεὸς μᾶς ἀξιώση καὶ πᾶμε κοντά Του, οὔτε καὶ τοὺς Ἁγίους θὰ «κουράζουμε», ἀλλὰ οὔτε καὶ θὰ ὑπάρχη λόγος νὰ τοὺς παρακαλοῦμε νὰ μᾶς βοηθήσουν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὰ θαύματα τῶν Ἁγίων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, φοβᾶμαι, ὅταν διακονῶ μόνη μου στὸν ξενώνα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ κάνης κομποσχοίνι στὸν Χατζεφεντῆ, γιὰ νὰ σοῦ πῆ μετὰ καὶ «εὐλόγησον» ὁ κλέφτης[70]!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐγώ, Γέροντα, φοβᾶμαι τὰ ταγκαλάκια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ παρακαλᾶς τὸν Χατζεφεντῆ νὰ τὰ κοκκαλώνη. Τί λές, δὲν μπορεῖ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς δὲν μπορεῖ, Γέροντα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ ξέρεις ὅτι κοκκάλωσε ἕνα αὐτοκίνητο; Εἶχε ξεχάσει ὁ ὁδηγὸς τὰ κλειδιὰ στὴν πόρτα τοῦ αὐτοκινήτου καὶ τὸ ἔκλεψαν. Μόλις ἐπικαλέσθηκε τὸν Ἅγιο, κοκκάλωσε τὸ αὐτοκίνητο στὴν μέση τοῦ δρόμου, κι ἔτσι ἀναγκάστηκαν οἱ κλέφτες νὰ τὸ παρατήσουν καὶ νὰ τὸ βάλουν στὰ πόδια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οἱ γιατροὶ εἶπαν ὅτι πρέπει νὰ κάνω ἐγχείρηση στὸ κεφάλι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πήγαινε νὰ χτυπήσης τὸ κεφάλι σου στὴν ἁγία κάρα τοῦ Ἁγίου Ἀρσενίου[71]. Δὲν εἶδες πῶς τὴν βόλεψε τὴν ἄλλη ἀδελφὴ ὁ Ἅγιος; Ἔκανε τὴν ἐπέμβαση χωρὶς νυστέρι καὶ χωρὶς νὰ τὸ καταλάβη οὔτε ἡ ἴδια. Δόξα τῷ Θεῷ! Μὴν ἀμφιβάλλης ὅτι θὰ βολέψη κι ἐσένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βοηθάει ὁ Ἅγιος Ἀρσένιος. Ἕνας γιατρὸς μὲ παρακάλεσε νὰ προσευχηθῶ γιὰ τὸ κοριτσάκι του ποὺ εἶναι ἄρρωστο. Παρακάλεσα τὸν Ἅγιο Ἀρσένιο καὶ τὸ βοήθησε λίγο. Νὰ κάνετε κι ἐσεῖς κομποσχοίνι, γιὰ νὰ ἀποτελειώση ὁ Ἅγιος τὸ θαῦμα του καὶ νὰ γνωρίσουν οἱ ἐπιστήμονες τὴν θεία ἐπιστήμη τοῦ Θεοῦ, γιὰ νὰ δοξασθῆ τὸ ὄνομά Του. Τὸ θαῦμα εἶναι μυστήριο· μόνο ζῆται καὶ δὲν ἐξηγεῖται· τὸ μυαλὸ δὲν μπορεῖ νὰ τὸ ἑρμηνεύση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οἱ ἄνθρωποι σήμερα δὲν εὐλαβοῦνται τοὺς Ἁγίους ὅπως παλιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Παλιὰ καὶ αὐτοὶ ποὺ ἔλεγαν ὅτι εἶναι ἄπιστοι εἶχαν μέσα τους Θεό. Θυμᾶμαι, τὴν ἐποχὴ ποὺ ἦταν οἱ Ἰταλοὶ στὴν Κόνιτσα, πῆρε φωτιὰ τὸ δάσος καὶ διαδόθηκε ὅτι τὴν εἶχαν βάλει οἱ Ἰταλοί, γιὰ νὰ πᾶνε οἱ Κονιτσιῶτες νὰ τὴν σβήσουν καὶ νὰ τοὺς συλλάβουν. Ὅταν τὸ ἄκουσαν αὐτὸ οἱ Κονιτσιῶτες, σκορπίστηκαν καὶ ἄφησαν τὸ δάσος νὰ καίγεται. Οἱ Ἰταλοὶ πῆγαν καὶ βρῆκαν τὸν πρόεδρο, ὁ ὁποῖος ἦταν ἄπιστος, καὶ τοῦ εἶπαν: «Ποῦ εἶναι οἱ ἄνθρωποι;». «Στὶς δουλειές τους», ἀπάντησε ἐκεῖνος. «Καὶ γιατί δὲν πῆγαν νὰ σβήσουν τὴν φωτιά;», τὸν ρώτησαν. «Ἄ, ἐμεῖς σ’ αὐτὲς τὶς περιπτώσεις, τοὺς λέει, ἔχουμε τὸν Ἅγιο Νικόλαο» – ἡ Μητρόπολη τῆς Κόνιτσας τιμᾶται στὴν μνήμη τοῦ Ἁγίου Νικολάου. Ἐκείνη τὴν στιγμή, ἐνῶ προηγουμένως δὲν ὑπῆρχε κανένα σύννεφο στὸν οὐρανό, μαζεύτηκαν σύννεφα καὶ ἄρχισε νὰ βρέχη καταρρακτωδῶς. Ὅταν εἶδαν τὸ θαῦμα αὐτὸ οἱ Ἰταλοί, φοβήθηκαν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὑπάρχει περίπτωση ἕνας Ἅγιος νὰ μὴν κάνη θαύματα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ ἂν θὰ κάνη ἕνας Ἅγιος θαύματα ἢ ὄχι, αὐτὸ εἶναι θέμα τοῦ Θεοῦ. Τὰ πολλὰ ὅμως θαύματα τῶν Ἁγίων μένουν ἄγνωστα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τίποτε δὲν εἶναι δύσκολο γιὰ τὸν Θεὸ καὶ γιὰ ἕναν Ἅγιο ποὺ ἔχει παρρησία στὸν Θεό. Ὁ Χριστὸς εἶπε: «Θὰ σᾶς δώσω δύναμη νὰ κάνετε θαύματα περισσότερα καὶ μεγαλύτερα ἀπὸ ὅσα ἔκανα ἐγώ»[72]. Αὐτὸς ὁ λόγος τοῦ Χριστοῦ δείχνει καὶ τὴν ταπείνωσή Του καὶ τὸν πλοῦτο τῆς Χάριτος ποὺ μᾶς δίνει. Εἶναι συγκινητικὴ ἡ ταπείνωση τοῦ Χριστοῦ· ἔδωσε στοὺς Ἁγίους τὴν Χάρη καὶ τὴν δύναμη νὰ ἀνασταίνουν ἀκόμη καὶ νεκρούς, ὅπως Ἐκεῖνος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Εἶναι ζωντανὴ ἡ παρουσία τῶν Ἁγίων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θὰ ἤθελα νὰ δῶ τὸν Ἅγιο Ἀρσένιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ ὅτι ἐπιδιώκεις νὰ δῆς τὸν Ἅγιο Ἀρσένιο εἶναι ἐπικίνδυνο, γιατὶ ὁ ἐχθρὸς μπορεῖ νὰ σοῦ παρουσιάση φαντασία καὶ ἔπειτα νὰ σοῦ πῆ ὁ λογισμὸς ὅτι κάτι εἶσαι, διότι δῆθεν ἀξιώθηκες νὰ δῆς τὸν Ἅγιο. Στὴν συνέχεια, ἀφοῦ σοῦ κολλήση τὸ «κάτι εἶσαι», θὰ σοῦ παίζη συνέχεια σινεμᾶ ὁ ἐχθρὸς μὲ τὴν φαντασία. Γι’ αὐτὸ νὰ ἔχης τὸν Ἅγιο Ἀρσένιο σὲ εὐλάβεια, ἀλλὰ νὰ μὴν ἐπιδιώκης νὰ τὸν δῆς. Τὸ ἂν σοῦ παρουσιασθῆ ἢ ὄχι, εἶναι δική του δουλειά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, ἐμφανίζεται ἕνας Ἅγιος σὲ κάποιον, ἕνας τρίτος τὸν βλέπει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν ὑπάρχει κανόνας σ’ αὐτό. Ἄλλοτε τὸν βλέπει, ἄλλοτε ἀκούει μόνον τὴν φωνή του, ἄλλοτε τίποτε. Αὐτὰ δὲν μπαίνουν σὲ καλούπια οὔτε ἐξηγοῦνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εἶναι ζωντανὴ ἡ παρουσία τῶν Ἁγίων! Καὶ ὅταν ἀκόμη ἐμεῖς δὲν τοὺς βρίσκουμε, ἐκεῖνοι μᾶς βρίσκουν! Ὅταν ἔφυγα ἀπὸ τὸν «Τίμιο Σταυρὸ» καὶ πῆγα στὴν «Παναγούδα», τὸ Καλύβι ἦταν ἐγκαταλελειμμένο. Ἴσα ποὺ βόλεψα κάπως ἕνα κελλί, γιὰ νὰ μείνω. Εἶχα πάρει μαζί μου ὅ,τι πράγματα εἶχα. Τὰ Μηναῖα τὰ εἶχα ἀκόμη στὰ κουτιά. Ἦρθε ἡ ὥρα νὰ κάνω Ἑσπερινό. Ἀλλὰ ποῦ νὰ βρῶ τὰ Μηναῖα!... Πῆρα τὸ ἡμερολόγιο νὰ δῶ ποιός Ἅγιος γιορτάζει. Εἶχα χάσει ὅμως καὶ τὰ γυαλιά, καὶ δὲν ἔβλεπα τὰ μικρὰ γράμματα ἀπὸ τὸ ἡμερολόγιο, γιὰ νὰ δῶ τὸν ἑορταζόμενο Ἅγιο, νὰ κάνω κομποσχοίνι γιὰ τὸν Ἑσπερινό. Τρία τέταρτα ἔψαχνα· τίποτε. «Θὰ περάση ἡ ὥρα ψάχνοντας, εἶπα. Ἂς πῶ:“Ἅγιοι τῆς ἡμέρας, πρεσβεύσατε ὑπὲρ ἡμῶν”». Ἀφοῦ ἔκανα κομποσχοίνι στὸν Χριστὸ καὶ στὴν Παναγία, ὕστερα ἄρχισα νὰ λέω:«Ἅγιοι τῆς ἡμέρας, πρεσβεύσατε ὑπὲρ ἡμῶν, Ἅγιοι τῆς ἡμέρας...». Τὴν νύχτα πάλι, γιὰ νὰ μὴ χασομερῶ μὲ τὸ ψάξιμο τῶν γυαλιῶν, ἔλεγα τὸ ἴδιο:«Ἅγιοι τῆς ἡμέρας, πρεσβεύσατε ὑπὲρ ἡμῶν».Τότε βλέπω μπροστά μου ἕναν Ἀξιωματικὸ Λαμπροφόρο, μὲ πολλὴ ἀγάπη καὶ πατρικὴ στοργή, νὰ μὲ πλησιάζη μὲ καλωσύνη καὶ νὰ μοῦ σκορπάη μιὰ ἀνέκφραστη ἀγαλλίαση. Ἐπειδὴ τὸν εἶδα τόσο πολὺ καλό, ἔλαβα τὸ θάρρος καὶ τὸν ρώτησα: «Ποῦ ὑπηρετούσατε καὶ πῶς λέγεσθε;». Ἐκεῖνος μοῦ εἶπε: «Εἶμαι ὁ Ἅγιος Λουκιλλιανός». Ἐγὼ ὅμως δὲν ἄκουσα καλὰ καὶ τὸν ρώτησα: «Ὁ Ἅγιος Λογγῖνος;». «Ὄχι, μοῦ ἀπήντησε, ὁ Ἅγιος Λουκιλλιανός». Ἐπειδὴ τὸ ὄνομά του μοῦ φάνηκε παράξενο, τὸν ξαναρωτάω: «Ὁ Ἅγιος Λουκιανός;». «Ὄχι, μοῦ ἀπάντησε πάλι ἐκεῖνος· ὁ Ἅγιος Λου-κιλ-λι-α-νός». Τότε τοῦ εἶπα: «Ἔχω καὶ ἐγὼ τραύματα ἀπὸ τὸν πόλεμο». Δίπλα στὸν Ἅγιο στεκόταν καὶ ἕνας νεαρὸς Γιατρός, μὲ ἄσπρη ποδιὰ – ἦταν ὁ Ἅγιος Παντελεήμων –, στὸν ὁποῖο εἶπε νὰ μὲ ἐξετάση. Ἀφοῦ μὲ ἐξέτασε, ἄκουσα ποὺ ἔλεγε τὴν διάγνωση στὸν Ἅγιο Λουκιλλιανό: «Τὰ τραύματά του ἔχουν θεραπευθῆ· μόνο γιὰ τὸ δίπλωμα θὰ τὰ λάβουμε ὑπ’ ὄψιν μας». Στὴν συνέχεια ἔνιωθα μεγάλη χαρὰ καὶ διπλὴ ξεκούραση. Ἔψαξα καλά, βρῆκα τὰ γυαλιὰ καὶ κοίταξα στὸ ἡμερολόγιο· ἦταν ἡ μνήμη τοῦ Ἁγίου Μάρτυρος Λουκιλλιανοῦ[73]. Τὸ ἀπόγευμα πῆγα σὲ κάποιους γνωστούς μου Πατέρες καὶ διάβασα καὶ τὸ Συναξάρι τοῦ Ἁγίου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἀκόμη ὁ Ἅγιος μὲ χορταίνει μὲ τὴν ἀγάπη του καὶ μὲ ξεκουράζει ψυχικὰ καὶ σωματικὰ μὲ τὴν παραδεισένια χαρὰ ποὺ μοῦ ἔδωσε.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τέταρτο Μέρος – «Αἰτεῖτε Καὶ Δοθήσετai Ὑμῖν»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ὅταν προσεύχεσαι γιὰ τὸν ἑαυτό σου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μὲ πολλὴ συναίσθηση τῆς ἁμαρτωλότητός σου,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τότε καὶ ἕνα «Κύριε ἐλέησον» νὰ πῆς γιὰ τοὺς ἄλλους,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: αὐτὸ τὸ «Κύριε ἐλέησον» ἔχει μεγάλη δύναμη».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Προσευχὴ γιὰ τὸν ἑαυτό μας
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ ζητοῦμε τὸ ἔλεος τοῦ Θεοῦ γιὰ τὸν ἑαυτό μας καὶ γιὰ τοὺς ἄλλους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν, Γέροντα, προσεύχωμαι γιὰ κάποιον καὶ νιώσω κατάνυξη, τότε σταματῶ νὰ εὔχωμαι γιὰ ἐκεῖνον καὶ κάνω εὐχὴ γιὰ τὸν ἑαυτό μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί; Δὲν ἔχει ἀνάγκη ἐκεῖνος ἀπὸ προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔχει, Γέροντα, ἀλλὰ σκέφτομαι νὰ κάνω ἐκείνη τὴν ὥρα εὐχὴ γιὰ μένα, γιατὶ δὲν ξέρω πότε θὰ νιώσω πάλι κατάνυξη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καλά, ἐσὺ νὰ καλοπερνᾶς καὶ γιὰ τὸν ἄλλον νὰ λές: «Δὲν βαριέσαι»; Τοὐλάχιστον νὰ λές:«Ἐλέησον ἡμᾶς».Μέσα στὸ«ἡμᾶς» περιλαμβάνεται καὶ ὁ ἑαυτός σου καὶ ὅλοι οἱ ἄλλοι. Ἐγὼ λέω: «Κύριε Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, ἐλέησον ἡμᾶς. Ἐλέησε ὅλους κι ἐμένα τὸ κτῆνος».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολὺ βοηθάει νὰ χωρίζουμε τὴν προσευχή μας σὲ τρία μέρη: ἕνα γιὰ τὸν ἑαυτό μας, ἕνα γιὰ τοὺς ζῶντες καὶ ἕνα γιὰ τοὺς κεκοιμημένους. Ἂν καὶ μὲ αὐτὸν τὸν τρόπο πάλι γιὰ τὸν ἑαυτό μας κάνουμε περισσότερη προσευχή, γιατὶ ὁ ἑαυτός μας εἶναι ἕνας, ἐνῶ οἱ ζῶντες καὶ οἱ κεκοιμημένοι εἶναι ἀμέτρητοι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νιώθω ὅτι δὲν θὰ μοῦ φθάση ὅλη μου ἡ ζωὴ γιὰ νὰ ζητῶ τὸ ἔλεος τοῦ Θεοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θὰ σὲ ἐλεήση ὁ Θεός. Μόνο νὰ προσεύχεσαι ἁπλὰ καὶ συνέχεια, ζητώντας ταπεινὰ τὸ ἔλεός Του γιὰ τὸν ἑαυτό σου καὶ γιὰ ὅλους τοὺς ἀνθρώπους. Ὅταν ζητᾶμε τὸ ἔλεος τοῦ Θεοῦ καὶ ἀγωνιζώμαστε χωρὶς ἄγχος, ταπεινά, μὲ φιλότιμο, ὁ Θεὸς θὰ δώση καὶ σ’ ἐμᾶς καὶ στοὺς ἄλλους ὅ,τι χρειάζεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, ἐκτὸς ἀπὸ τὸ ἔλεος τοῦ Θεοῦ χρειάζεται νὰ ζητῶ καὶ κάτι ἄλλο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μέσα στὸ ἔλεος τοῦ Θεοῦ ὑπάρχουν ὅλα. Ἀλλά, ἂν χρειάζεσαι καὶ κάτι συγκεκριμένο, μπορεῖς νὰ τὸ ζητήσης ἀπὸ τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ὁ Μέγας Βασίλειος λέει: «Στὴν προσευχή σου, μετὰ τὴν δοξολογία ποὺ θὰ κάνης, νὰ ζητᾶς μόνον τὴν Βασιλεία τῶν Οὐρανῶν»[74]. Τί ἐννοεῖ;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐννοεῖ νὰ ζητᾶμε πρῶτα τὴν Βασιλεία τῶν Οὐρανῶν καὶ ὕστερα ὅλα τὰ ἄλλα «προστεθήσεται ἡμῖν»[75], ὅπως εἶπε ὁ Χριστός· ὄχι νὰ ζητᾶμε καὶ αὐτὸ καὶ ἐκεῖνο καὶ τὸ ἄλλο, καὶ νὰ ξεχνᾶμε τὸν προορισμό μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ Ἁγία Γραφή, Γέροντα, λέει νὰ προσευχώμαστε γιὰ τὸ καθετί[76]. Οἱ Πατέρες ὅμως ἀπέφευγαν νὰ προσεύχωνται γιὰ προσωπικά τους θέματα. Ἐγὼ πῶς νὰ προσεύχωμαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ προσεύχεσαι γιὰ κάθε ἀνάγκη ποὺ ἔχει ἡ ψυχή σου καὶ νὰ δίνης λιγώτερη σημασία στὶς ἀνάγκες τοῦ σώματος. Καὶ στὸ«Πάτερ ἡμῶν», ὅταν λέμε:«τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον»[77], δὲν ζητᾶμε μόνον τὴν ὑλικὴ τροφή, ἀλλὰ καὶ ὅ,τι μᾶς χρειάζεται, γιὰ νὰ ζήσουμε πνευματικά, ὅπως θέλει ὁ Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μιὰ φορά, στὸ Καλύβι τοῦ Τιμίου Σταυροῦ, ἀντὶ γιὰ λίγο κρασὶ ποὺ περίμενα σὰν φάρμακο γιὰ τὸ πρόβλημα ποὺ εἶχα στὰ ἔντερα, μοῦ ἔφεραν ἀπὸ τὸ μοναστήρι κατὰ λάθος ἕνα μπουκάλι ξίδι. Δὲν εἶπα τίποτε, γιατὶ σκέφθηκα ὅτι ἔτσι ἤθελε ὁ Θεός. Πέρασαν περίπου σαράντα ἡμέρες, καὶ μὲ τὸ βρόχινο νερὸ ποὺ ἔπινα ἐπιδεινώθηκε ἡ κατάσταση. Μιὰ μέρα ὑπέφερα πολύ. Καιγόμουν γιὰ νερό, ἀλλὰ φοβόμουν νὰ πιῶ, ἐπειδὴ τὴν προηγούμενη μέρα ποὺ ξεθάρρεψα λίγο, εἶχα ὅλη τὴν νύχτα πρόβλημα. Κάποια στιγμὴ ποὺ μπῆκα στὸν ναό, γιὰ νὰ ἀνάψω τὰ καντήλια, εἶδα ἕνα μπουκάλι κρασὶ μπροστὰ στὸ τέμπλο, κάτω ἀπὸ τὴν εἰκόνα τῆς Παναγίας. Τὸ μὲν μπουκάλι ἦταν δικό μου, τὸ γνώρισα· ἀλλὰ ἀπὸ ποῦ γέμισε; Οὔτε εἶχε ἔρθει κανεὶς ἐκεῖνες τὶς ἡμέρες, καὶ ἐγὼ πολλὲς φορὲς εἶχα μπῆ στὸν ναὸ καὶ δὲν ὑπῆρχε τίποτε μπροστὰ στὸ τέμπλο. Ἦταν στυφὸ κρασί, φάρμακο, ὅπως μὲ ὠφελεῖ. Τὴν ἴδια ἡμέρα μοῦ ἔφεραν κι ἕνα μεγάλο μπουκάλι κρασὶ ἀπὸ τὸ μοναστήρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἂν ζητήσω κάτι ἀπὸ τὸν Θεὸ μὲ ὅλη μου τὴν καρδιά, θὰ μοῦ τὸ δώση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν σὲ συμφέρη, θὰ σοῦ τὸ δώση· ἂν δὲν σὲ συμφέρη, πῶς νὰ σοῦ τὸ δώση; Εἶδες τί ἔπαθαν οἱ Ἑβραῖοι ποὺ ἐπέμεναν νὰ τοὺς δώση ὁ Θεὸς βασιλιά, ἐνῶ τοὺς προειδοποίησε ὅτι δὲν ἦταν ἀκόμη ἕτοιμοι γι’ αὐτό[78]; Ἔγινε βασιλιὰς ὁ ὑπερήφανος Σαούλ, ποὺ τοὺς ἔβαζε βαρεῖς φόρους καὶ τοὺς βασάνιζε[79].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλὲς φορὲς νομίζουμε ὅτι αὐτὸ ποὺ ζητᾶμε ἀπὸ τὸν Θεὸ εἶναι καλό, ἐνῶ δὲν εἶναι. Ὁ Θεὸς ὅμως, ὁ Ὁποῖος εἶναι φύσει ἀγαθός, γνωρίζει τί χρειάζεται γιὰ τὸν καθέναν. Γι’ αὐτὸ νὰ λέμε: «Θεέ μου, ὁ λογισμὸς μοῦ λέει ὅτι αὐτὸ θὰ μὲ βοηθήση. Ἀλλὰ Ἐσὺ γνωρίζεις καλύτερα τί συμφέρει στὴν ψυχή μου.“Γενηθήτω τὸ θέλημά σου”[80]». Ὁπότε, ὅταν μὲ τὴν καρδιά μας ποῦμε: «γενηθήτω τὸ θέλημά σου», θὰ γίνη τὸ θέλημα τοῦ Θεοῦ, ποὺ τελικὰ θὰ εἶναι γιὰ τὸ συμφέρον τῆς ψυχῆς μας.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχὴ γιὰ τὸν πνευματικό μας ἀγώνα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Ἀββᾶς Ἰσαὰκ γράφει:«Πῶς ζητᾶς νὰ ἀγαπήσης τὸν Θεό, ἐνῶ δὲν ἔχεις καθαρισθῆ ἀπὸ τὰ πάθη;»[81]. Ἂν κάποιος δὲν ἔχη καθαρισθῆ ἀπὸ τὰ πάθη του καὶ ἔχη πόθο νὰ ἀγαπήση τὸν Θεό, μπορεῖ αὐτὸ νὰ ἔχη μέσα ἀναίδεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, γιατί νὰ ἔχη ἀναίδεια; Ἀγωνίζεται κανεὶς νὰ καθαρισθῆ ἀπὸ τὰ πάθη καὶ συγχρόνως θέλει νὰ ἀγαπήση τὸν Θεό. Παράλληλα γίνονται καὶ τὰ δύο. Ἂν ὅμως κάποιος ἀδιαφορῆ γιὰ τὰ πάθη του καὶ ζητᾶ στὴν προσευχή του νὰ ἀγαπήση τὸν Θεό, αὐτὸς ἔχει ἀναίδεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, διάβασα κάπου ὅτι τὸ δώρημα στὴν προσευχὴ εἶναι ἀνάλογο μὲ τὴν πίστη καὶ μὲ τὴν θερμότητα τῆς καρδιᾶς[82].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐσὺ τί ζητᾶς ἀπὸ τὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ μὲ ἀπαλλάξη, Γέροντα, ἀπὸ τὴν σκληρότητα καὶ νὰ μαλακώση τὴν καρδιά μου, ὅταν προσεύχωμαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –«Ζητεῖτε καὶ θὰ λάβετε»[83], εἶπε ὁ Χριστός. Ἂν αὐτὸ ποὺ ζητᾶς εἶναι καθαρὸ καὶ γιὰ τὸ συμφέρον σου, θὰ τὸ λάβης. Ἂν ζητᾶς ἀπὸ τὸν Θεὸ δύναμη, γιὰ νὰ προσεύχεσαι νὰ συγχωρήση τὶς ἁμαρτίες σου καὶ νὰ βοηθήση τοὺς ἄλλους, αὐτὸ εἶναι καλὸ καὶ θὰ σοῦ τὸ δώση. Ἂν ὅμως ζητᾶς νὰ σοῦ δοθῆ τὸ χάρισμα τῆς προσευχῆς, γιὰ νὰ νιώθης εὐχαρίστηση, χαρὰ στὴν προσευχή, πῶς νὰ σοῦ τὸ δώση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικὲς φορὲς εὔχομαι νὰ μοῦ δώση ὁ Θεὸς θεῖο φωτισμό· εἶναι σωστὸ τὸ αἴτημά μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ προσπαθήσης πρῶτα κι ἐσὺ καὶ μετὰ νὰ ζητᾶς καὶ ἀπὸ τὸν Θεὸ τὸν θεῖο φωτισμό, γιατὶ ὁ Θεὸς θέλει πρῶτα τὴν δική μας προσπάθεια καὶ ὕστερα δίνει ὅ,τι Τοῦ ζητᾶμε. Νὰ σκέφτεσαι, νὰ προσεύχεσαι, νὰ προσέχης καὶ νὰ ἐνεργῆς μὲ σύνεση, καὶ μετὰ θὰ ἔρθη ὁ θεῖος φωτισμός. Ὅταν, ἂς ὑποθέσουμε, σὲ ρωτοῦν γιὰ ἕνα θέμα, νὰ μὴ βιάζεσαι νὰ ἀπαντήσης, ἀλλὰ νὰ ζητᾶς ἀπὸ τὸν Θεὸ νὰ σὲ φωτίση. «Θεέ μου, νὰ λές, φώτισέ με νὰ πῶ αὐτὸ ποὺ πρέπει», καὶ ὁ Θεὸς θὰ σοῦ δίνη λόγο ἀνάλογα μὲ τὴν περίπτωση. Ἡ βιαστικὴ ἀπάντηση εἶναι τοῦ μυαλοῦ· ἐνῶ ἡ ἀπάντηση ποὺ περνᾶ μέσα ἀπὸ τὴν προσευχή, εἶναι τοῦ Θεοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἡ ἔλλειψη ἐγρηγόρσεως μὲ κάνει νὰ φοβᾶμαι νὰ ζητήσω ἀπὸ τὸν Θεὸ νὰ μὲ βοηθήση σὲ κάποια προσπάθειά μου, γιατὶ βλέπω ὅτι δὲν ἀξιοποιῶ τὶς εὐκαιρίες ποὺ μοῦ δίνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ ζητᾶς τὴν βοήθεια τοῦ Θεοῦ καὶ συγχρόνως νὰ Τὸν παρακαλᾶς νὰ σοῦ δίνη καὶ ἐγρήγορση, γιὰ νὰ μπορέσης νὰ ἀξιοποιήσης τὴν εὐκαιρία ποὺ θὰ σοῦ δώση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι σωστό, Γέροντα, νὰ παρακαλοῦμε τὸν Θεὸ νὰ πᾶμε στὸν Παράδεισο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐγὼ δὲν παρακαλῶ τὸν Θεὸ νὰ πάω στὸν Παράδεισο. Τὸν παρακαλῶ νὰ μὲ βοηθάη νὰ μὴν Τὸν στενοχωρῶ μὲ τὴν συμπεριφορά μου. Ὅμως, ἂν πάω στὴν κόλαση, δὲν θὰ λυπήσω τὸν Θεό; Ἑπομένως, οὔτε αὐτὸ θὰ γίνη, ἀφοῦ Τὸν παρακαλῶ νὰ μὲ βοηθήση νὰ μὴν Τὸν στενοχωρῶ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχὴ στὴν ἀρρώστια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὸν τελευταῖο καιρὸ ἔχω πρόβλημα μὲ τὴν καρδιὰ καὶ φοβᾶμαι μήπως πάθω κάτι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μὴ φοβᾶσαι. Ὅλοι κάτι πρέπει νὰ ἔχουμε, γιατί, ὅταν ἔχουμε κάτι, καθόμαστε στὰ πόδια τοῦ Χριστοῦ καὶ Τὸν παρακαλοῦμε νὰ μᾶς βοηθήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σᾶς παρακαλῶ, εὐχηθῆτε νὰ γίνω καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δὲν σὲ συμφέρει νὰ κάνω προσευχὴ γι’ αὐτὸ τὸ θέμα. Ἂν κάνης ὑπομονὴ μὲ πίστη στὸν Θεό, θὰ πάρης σύνταξη ἀπὸ τὸ Ὑγειονομικὸ τοῦ Θεοῦ, ἡ ὁποία εἶναι μεγαλύτερη ἀπὸ τὴν σύνταξη τοῦ ΟΓΑ[84]. Διάβασα κάπου ὅτι ἕνας ἄρρωστος παρακαλοῦσε τὸν Ἅγιο Παντελεήμονα νὰ τὸν κάνη καλά. Ὁ Ἅγιος ὅμως δὲν τὸν θεράπευε καὶ αὐτὸς συνέχιζε νὰ τὸν παρακαλῆ. Τελικὰ θεραπεύθηκε. Ὅταν πέθανε καὶ πῆγε στὴν ἄλλη ζωή, εἶδε ὅτι ἐξ αἰτίας τῆς θεραπείας του ἔχασε πολλὰ στεφάνια. Τότε εἶπε στὸν Ἅγιο Παντελεήμονα: «Γιατί μὲ θεράπευσες, ἀφοῦ γνώριζες ὅτι θὰ χάσω τὰ στεφάνια;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μέχρι ποιό σημεῖο πρέπει νὰ ἀφήσω τὸν ἑαυτό μου στὰ χέρια τοῦ Θεοῦ σὲ θέματα ὑγείας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρῶτα θὰ ἐμπιστευθῆς τὸν Θεό, καὶ μετὰ τὸν Θεὸ θὰ ἐμπιστευθῆς τὸν ἄνθρωπο, τὸν γιατρό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μιὰ δύσκολη ἀρρώστια, Γέροντα, πῶς πρέπει νὰ τὴν ἀντιμετωπίζουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρὶν καταφύγετε σὲ γιατρούς, νὰ προηγῆται προσευχή, ἀγρυπνία, γιὰ νὰ βοηθήση ὁ Θεὸς καὶ νὰ φωτίση τοὺς γιατρούς. Βάλτε καὶ λίγο λαδάκι ἀπὸ τὴν καντήλα τοῦ Ἁγίου Ἀρσενίου, πιῆτε καὶ λίγο Ἁγιασμό, διαβάστε καὶ κανέναν Ψαλμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἐξ αἰτίας τῆς ἀρρώστιας μου δὲν ἀνταποκρίνομαι στὰ πνευματικά μου καθήκοντα καὶ αὐτὸ μὲ στενοχωρεῖ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ τίποτε νὰ μὴν κάνης, τώρα ποὺ εἶσαι ἄρρωστη, οὔτε κομποσχοίνια, οὔτε μετάνοιες, μόνο «δόξα σοι ὁ Θεὸς» νὰ λές, αὐτὸ ἀρκεῖ[85].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, εἶμαι ἄρρωστη καὶ πονάω, δὲν μπορῶ νὰ συγκεντρωθῶ στὴν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ προσευχὴ σ’ αὐτὴν τὴν περίπτωση ἔχει καὶ κόπο καὶ πόνο· ἔχει καὶ ἄσκηση, γι’ αὐτὸ εἰσακούεται πιὸ πολὺ ἀπὸ τὴν προσευχὴ ποὺ κάνεις, ὅταν εἶσαι καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Νὰ ἀγαπᾶμε λίγο καὶ τὸν πόνο. Ἡ ἀρρώστια εἶναι μεγάλη εὐλογία γιὰ τὸν ἄνθρωπο. Ὅταν ὁ ἄνθρωπος τὸ καταλάβη αὐτό, τὴν δέχεται μὲ χαρὰ καὶ ψάλλει μὲ χαρά:«Εὐλογήσω τὸν Κύριον ἐν παντὶ καιρῷ»[86]. Θυμᾶμαι, ὁ καημένος Γερο-Γαβριὴλ στὰ Καρούλια, εἶχε πόνους, πόνους... Καὶ ὅταν πονοῦσε, ἔψελνε. Ἦταν τεντωμένος συνέχεια κάτω. Ἔλεγε: «Μοῦ λένε “σταυρός, σταυρός!”, ἀλλὰ καρφιὰ δὲν ἔχω! Χωρὶς καρφιά, τί σταυρὸς εἶναι;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πόσο καιρὸ κράτησε αὐτό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀρκετὸ διάστημα· κανα-δυὸ χρόνια. Ἦταν τελείως μόνος του. Καὶ νὰ δῆτε, τὸ κελλί του εἶχε ἀνοίξει ἀπὸ κάτω μιὰ ρωγμὴ καὶ χειμώνα καιρὸ ἔφερνε ἀπὸ τὴν θάλασσα ἕνα …ἀεράκι φρέσκο-φρέσκο! Ἀλλὰ ἐκεῖνος μέσα στοὺς πόνους καὶ στὸ κρύο ἔψελνε καὶ δοξολογοῦσε τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στὴν ἀρρώστια ἡ ψαλμωδία εἶναι φάρμακο. Καὶ βαριὰ ἄρρωστος νὰ εἶναι κανείς, καὶ νὰ πονάη πολύ, ἅμα ἀκούση ψαλμωδία, μαλακώνει ὁ πόνος του. Ἂν μπορῆ καὶ ὁ ἴδιος λίγο νὰ ψάλη, τότε τὸ γλεντάει. Νά, ἐγὼ ἀπόψε ποὺ πονοῦσα, ἔψελνα στὴν διαπασῶν. Ὅσο κουράγιο εἶχα, τὸ ἔδωσα ἐκεῖ. Ξέρεις πόση δύναμη μοῦ ἔδωσε αὐτὴ ἡ ψαλμωδία[87];
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Προσευχὴ γιὰ τοὺς ἄλλους
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχὴ γιὰ τὸν κόσμο μὲ συναίσθηση τῆς ἁμαρτωλότητός μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, μερικὲς φορές, ὅταν βλέπω πόσο ὑποφέρει ὁ κόσμος, δὲν μπορῶ νὰ κάνω προσευχὴ γιὰ τὸν ἑαυτό μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὴν προσευχὴ γιὰ τὸν ἑαυτό μας δὲν τὴν κάνουμε μόνο γιὰ τὸν ἑαυτό μας, ἀλλὰ εἶναι ἀπαραίτητη σὰν μιὰ προετοιμασία, γιὰ νὰ σταθοῦμε μπροστὰ στὸν Θεὸ μὲ εὐπρεπὲς ἔνδυμα. Γιὰ νὰ μπορῆς νὰ δῆς τὸν πόνο τῶν ἄλλων, χρειάζεται νὰ ἔχης κατὰ κάποιον τρόπο τακτοποιημένο τὸν ἑαυτό σου. Καὶ ὅταν προσεύχεσαι γιὰ τὸν ἑαυτό σου μὲ πολλὴ συναίσθηση τῆς ἁμαρτωλότητός σου, τότε καὶ ἕνα«Κύριε ἐλέησον»νὰ πῆς γιὰ τοὺς ἄλλους, αὐτὸ τὸ«Κύριε ἐλέησον»ἔχει μεγάλη δύναμη, γιατὶ ἔχει πολλὴ ταπείνωση, ἡ ὁποία ἑλκύει τὸ μεγάλο ἔλεος τοῦ Θεοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἐγὼ αἰσθάνομαι τὴν ἀνάγκη νὰ κάνω πολλὴ προσευχὴ γιὰ τὸν ἑαυτό μου, ἀλλὰ ξεχνῶ τοὺς ἄλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, γιὰ νὰ γίνη ἡ ἀπέκδυση τοῦ παλαιοῦ ἀνθρώπου, χρειάζεται νὰ κάνουμε προσευχὴ γιὰ τὸν ἑαυτό μας. Ὅταν ὅμως φουντώση ὁ θεῖος ἔρωτας, τότε ξεχνᾶ κανεὶς τὸν ἑαυτό του καὶ εὔχεται γιὰ τοὺς ἄλλους. Ἐσύ, ἀφοῦ πρῶτα κάνεις λίγη εὐχὴ γιὰ τὸν ἑαυτό σου, νὰ θυμᾶσαι μετὰ τὸν ταλαιπωρημένο κόσμο γενικὰ καὶ ἐκείνους ποὺ ἀπομακρύνθηκαν ἀπὸ τὸν Θεὸ καὶ τοὺς κεκοιμημένους ποὺ δὲν ἀξιοποίησαν τὰ χρόνια ποὺ τοὺς χάρισε ὁ Θεός, γιὰ νὰ Τὸν πλησιάσουν, καὶ μεταμελοῦνται τώρα – ἀνώφελα πιά –, καὶ νὰ λὲς τὴν εὐχή:«Κύριε Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, ἐλέησον ἡμᾶς». Ἔτσι συμπεριλαμβάνεις στὴν προσευχή σου καὶ τὸν ἑαυτό σου καὶ ὅσους σοῦ ζήτησαν νὰ εὐχηθῆς, ἀλλὰ καὶ ὅλον τὸν κόσμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μὲ ἀπασχολεῖ, Γέροντα, ὁ πόνος τῶν ἀνθρώπων, ἀλλὰ δὲν ἔχω παρρησία, γιὰ νὰ ζητήσω ἀπὸ τὸν Θεὸ νὰ βοηθήση. Μοῦ λέει ὁ λογισμός: «Μὲ τὴν κακομοιριὰ ποὺ ἔχεις, πῶς θὰ σὲ ἀκούση ὁ Θεός;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μὴν ἀκοῦς τὸ ταγκαλάκι ποὺ σὲ πιάνει ἀπὸ τὰ δεξιὰ καὶ σὲ ἀπελπίζει. Νὰ λές: «Θεέ μου, εἶμαι κακομοίρα, ἀλλὰ ἄκουσέ με, γιατὶ ἐξ αἰτίας μου ἀδικοῦνται οἱ ἄλλοι». Κάποτε, σὲ περίοδο μεγάλης ἀνομβρίας, ἕνας μοναχὸς[88]στὸ Ἅγιον Ὄρος προσευχήθηκε ὡς ἑξῆς: «Θεέ μου, εἶπε, Σὲ παρακαλῶ, ρίξε λίγη βροχή. Ὄχι γιὰ μᾶς· ἐμεῖς καλόγεροι εἴμαστε καὶ ὑποσχεθήκαμε νὰ κάνουμε ἄσκηση. Λυπήσου τὸν καημένο τὸν κόσμο ποὺ ὑποφέρει, ἀλλὰ καὶ πάλι ἀπὸ τὸ ὑστέρημά του θὰ δώση καὶ σ’ ἐμᾶς. Ἂν ἤμουν σὲ καλὴ πνευματικὴ κατάσταση, θὰ μὲ ἄκουγες καὶ δὲν θὰ ὑπέφερε ὁ κόσμος. Τὸ ξέρω, εἶμαι πολὺ ἁμαρτωλός· ὅμως δὲν εἶναι ἀδικία νὰ ὑποφέρη ὁ κόσμος ἐξ αἰτίας μου; Βοήθησέ τους. Ἐκεῖνοι δὲν ἔχουν χρόνο νὰ κάνουν προσευχή· κάνω ἐγὼ λίγη προσευχὴ γιὰ ἐκείνους». Σὲ μία-μιάμιση ὥρα ἔπιασε βροχὴ σὲ ὅλη τὴν Μακεδονία, στὴν Θεσσαλία καὶ στὸ Ἅγιον Ὄρος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν κάνω προσευχὴ γιὰ τὸν κόσμο, μοῦ λέει ὁ λογισμὸς πὼς μὲ σιχαίνεται ὁ Θεός, γιατὶ ἄφησα τὸν δικό μου νεκρὸ καὶ πάω νὰ θάψω τοὺς νεκροὺς τῶν ἄλλων[89].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τὸν δικό σου νεκρὸ δὲν τὸν ἔθαψες, ὅταν ἔγινες μοναχή; Νὰ λές: «Θεέ μου, πῶς νὰ ἀκούσης ἐμένα τὴν ἀνάξια δούλη Σου; Ἀλλὰ δὲν εἶναι κρίμα ποὺ ὁ κόσμος ἔχει τόσα προβλήματα καὶ βασανίζεται; Σὲ παρακαλῶ, βοήθησέ τον». Ὅταν ὁ ἄνθρωπος προσεύχεται γιὰ τὸν πλησίον του μὲ ἀγάπη καὶ ταπείνωση καὶ ἀγωνίζεται ἔχοντας συναίσθηση τῆς ἁμαρτωλότητός του, ὁ Θεὸς δὲν τὸν σιχαίνεται, ἀλλὰ βοηθάει καὶ τὸν ἴδιο, βοηθάει καὶ τοὺς ἄλλους. Ὁ Θεὸς σιχαίνεται ἐκεῖνον ποὺ θεωρεῖ τὸν ἑαυτό του ἅγιο καὶ προσεύχεται γιὰ τοὺς ἄλλους ποὺ τοὺς θεωρεῖ ἁμαρτωλούς.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ κάνης δικό σου τὸν πόνο τῶν ἄλλων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἴπατε, Γέροντα, ὅτι θὰ κάνουμε ἕνα συνεργεῖο προσευχῆς. Πότε θὰ γίνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀπὸ σᾶς ἐξαρτᾶται... Τὴν ἄλλη φορὰ θὰ δῶ σὲ τί κατάσταση εἶστε καὶ ἀνάλογα… Θὰ κάνουμε πνευματικὸ συνεργεῖο προσευχῆς. Ἂν θὰ γίνεται προσευχὴ μὲ πόνο, ξέρετε τί δύναμη θὰ ἔχη; Θὰ προσεύχεσθε γιὰ τὰ προβλήματα τοῦ κόσμου καὶ ὅσοι ἄνθρωποι ζητοῦν ἐκείνη τὴν ὥρα βοήθεια ἀπὸ τὸν Θεὸ καὶ βρίσκονται στὴν ἴδια συχνότητα, θὰ δέχωνται τὴν βοήθειά Του. Ἐγὼ αἰσθάνομαι τὶς ψυχὲς ποὺ προσεύχονται· σὰν κύματα-κύματα δυνάμεως νιώθω τὴν προσευχή τους. Πολλὲς φορὲς καταλαβαίνω καὶ ποιά ὥρα ἔκανε προσευχὴ ἕνας ἄρρωστος καὶ βοηθήθηκε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οἱ ψυχὲς γιὰ τὶς ὁποῖες προσεύχεσθε τὸ αἰσθάνονται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αἰσθάνονται ὅτι τὶς «κάνω σεισμό», συγκλονίζονται. Ὅταν γίνεται προσευχὴ μὲ πόνο, ἀκόμη καὶ ἄγνωστοι ἄνθρωποι τὸ πληροφοροῦνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε ἡ προσευχή μας γιὰ τοὺς ἄλλους εἶναι περισσότερο εὐπρόσδεκτη στὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν τὴν αἰσθανώμαστε. Καὶ τὴν αἰσθανόμαστε, ἂν βάζουμε τὸν ἑαυτό μας στὴν θέση τῶν ἄλλων. Ἂν μποῦμε δηλαδὴ στὴν θέση τῶν ἀρρώστων ἢ τῶν κεκοιμημένων, αὐτὸ θὰ μᾶς βοηθήση νὰ προσευχηθοῦμε μὲ πόνο· ὁ πόνος κατεβαίνει στὴν καρδιὰ καὶ ἡ προσευχή μας γίνεται καρδιακή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, εἶμαι πνιγμένη στοὺς λογισμούς, δὲν μπορῶ νὰ προσευχηθῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί, καλό μου παιδί, κόλλησες στὸν ἑαυτό σου καὶ δὲν σκέφτεσαι καὶ λίγο τὸν κόσμο ποὺ ὑποφέρει; Ξέρεις πόσες οἰκογένειες εἶναι διαλυμένες, πόσα κακόμοιρα παιδάκια εἶναι ἐγκαταλελειμμένα στοὺς δρόμους ἢ σὲ ἱδρύματα δίχως στοργή; Πόσοι αὐτὴν τὴν στιγμὴ φωνάζουν: «βοήθεια, βοήθεια!», καὶ δὲν ὑπάρχει κανεὶς κοντά τους νὰ τοὺς βοηθήση; Πόσοι βουλιάζουν στὸ πέλαγος, πόσοι αὐτοκτονοῦν, πόσοι ὑποφέρουν; Τόσοι ἄνθρωποι ἔχουν ἀνάγκη ἀπὸ τὶς προσευχὲς τῶν μοναχῶν, κι ἐμεῖς νὰ χάνουμε τὸν πολύτιμο χρόνο μας μὲ μπανταλοὺς λογισμοὺς ἢ παιδικὰ παράπονα καὶ νὰ μὴν κάνουμε οὔτε τὰ πνευματικά μας καθήκοντα ὅπως πρέπει; Κοίταξε νὰ βγῆς ἀπὸ τὸν ἑαυτό σου καὶ νὰ κάνης δικό σου τὸν πόνο τῶν ἄλλων. Ἔτσι καὶ εἰρήνη θὰ βρῆς, καὶ μισθὸ θὰ ἔχης ἀπὸ τὸν Θεό, καὶ βοήθεια θὰ προσφέρης στοὺς ἄλλους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν ἤμουν στὴν Μονὴ Φιλοθέου, ἡ ὁποία τότε ἦταν ἰδιόρρυθμη, μιὰ νύχτα, ἐνῶ ἀγρυπνοῦσα στὸ κελλί, ἀντιλήφθηκα πὼς κάποιος ἦρθε ἔξω ἀπὸ τὸ μοναστήρι καὶ εἶχε ἀνάγκη. Ἦταν ἕνας ταλαίπωρος ἄνθρωπος ποὺ εἶχε καὶ δαιμόνιο. Ἡ πόρτα τῆς μονῆς ἔκλεινε μὲ τὴν δύση τοῦ ἡλίου καὶ ἄνοιγε τὴν ἄλλη μέρα τὸ πρωί. «Τί νὰ κάνω τώρα; εἶπα. Νὰ μποροῦσα νὰ τοῦ δώσω κάτι νὰ φάη. Πῶς νὰ περιμένη νηστικὸς μέχρι τὸ πρωί;». Τότε μοῦ ἦρθε μιὰ σκέψη. Πῆγα, πῆρα μερικὰ τρόφιμα[90], τὰ ἔβαλα μέσα σὲ ἕνα καλαθάκι, τὸ ἔδεσα μὲ ἕνα σχοινὶ καὶ τὸ κατέβασα ἀπὸ τὸ παράθυρό μου ποὺ ἔβλεπε ἔξω ἀπὸ τὴν μονή. Ἦταν τέτοια ἡ κατάστασή του, ποὺ δὲν μποροῦσα μετὰ νὰ ἡσυχάσω. Ὅλη τὴν νύχτα προσευχόμουν μὲ πόνο. «Θεέ μου, ἔλεγα, ἐγὼ αὐτὸ μποροῦσα νὰ κάνω· δὲν εἶμαι ἄξιος νὰ Σὲ παρακαλέσω νὰ βοηθήσης τὸ πλάσμα Σου. Ἀλλὰ δὲν εἶναι κρίμα νὰ ταλαιπωρῆται ἐξ αἰτίας μου;». Τὸ πρωὶ ποὺ ἄνοιξε τὸ μοναστήρι καὶ μπῆκε ὁ ἄνθρωπος μέσα, εἶχε γίνει καλά. Προσκύνησε στὸν ναὸ καὶ δόξαζε τὸν Θεό. Ὁ Καλὸς Θεὸς τὸν λυπήθηκε καὶ τὸν ἀπάλλαξε ἀπὸ τὸ δαιμόνιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν προσεύχεται κάποιος γιὰ ἕναν πονεμένο ἄνθρωπο, ὁ νοῦς πάει στὸν Χριστὸ ἢ στὸν πόνο τοῦ ἀνθρώπου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀπὸ τὸν Χριστὸ δὲν ζητάει βοήθεια; Ξεκινάει ἀπὸ τὸν πόνο τοῦ ἀνθρώπου, ἀλλὰ γυρίζει στὸν Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, ἡ καρδιά μου εἶναι σκληρή, θυμᾶμαι τὶς διάφορες δυσκολίες ποὺ ἔχω περάσει καὶ ζητῶ ἀπὸ τὸν Θεὸ νὰ βοηθήση ὅσους περνοῦν παρόμοιες δυσκολίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλὸ εἶναι αὐτό. Νὰ τὸ κάνης, ἀφοῦ ἔτσι καταλαβαίνεις περισσότερο τὸν ἄλλον καὶ συμπάσχεις μαζί του. «Θεέ μου, νὰ λές, ὅπως εὐεργέτησες ἐμένα τόσο πολύ, βοήθησε καὶ τὸν ἀδελφό μου, ποὺ εἶναι καλύτερος ἀπὸ μένα».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, προσεύχωμαι γιὰ τὴν σωτηρία μιᾶς ψυχῆς καὶ παράλληλα παρακαλῶ τὸν Θεὸ νὰ μὴν ἐπιτρέψη νὰ κακοπαθήση, μήπως δὲν εἶναι σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, εὐλογημένη, καὶ αὐτὸ μέσα στὸν πόνο εἶναι. Ὁ Θεὸς συγκινεῖται, ὅταν αὐτὸς ποὺ προσεύχεται ἔχη μέσα του ἀγάπη γιὰ τὸν πλησίον, ἀλλὰ τελικὰ ὁ Θεὸς θὰ κάνη αὐτὸ ποὺ συμφέρει στὴν ψυχή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχὴ γιὰ συγκεκριμένες περιπτώσεις καὶ γιὰ ὅλον τὸν κόσμο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στενοχωριέμαι, ὅταν τελειώνη ἡ Ἀκολουθία καὶ ἐγὼ ἀπὸ τὴν νύστα δὲν μπόρεσα νὰ προσευχηθῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιὰ νὰ διώχνης τὴν νύστα, νὰ σκέφτεσαι κάτι ποὺ νὰ σοῦ κινῆ τὸ πνευματικὸ ἐνδιαφέρον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὑπάρχει, Γέροντα, μεγαλύτερο ἐνδιαφέρον ἀπὸ τὸν πόνο τοῦ κόσμου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, ἀλλὰ ἂν σκέφτεσαι τὸν πόνο τοῦ κόσμου γενικὰ καὶ ἀόριστα, αὐτὸ δὲν βοηθάει. Νὰ σκέφτεσαι συγκεκριμένες περιπτώσεις ἀνθρώπων οἱ ὁποῖοι ἔχουν μεγάλη ἀνάγκη, ὥστε νὰ πονᾶς, καὶ ἔτσι νὰ γίνεται καρδιακὴ ἡ προσευχή σου. Πιάσε μία περίπτωση γιὰ τὴν ὁποία πονᾶς περισσότερο καὶ ὕστερα πήγαινε καὶ σὲ ἄλλες περιπτώσεις. Ἂς ποῦμε, σὲ ἕναν πόλεμο τραυματίζονται πολλοί. Καλὰ εἶναι νὰ μπορῆς νὰ τοὺς νιώσης ὅλους, καὶ χωρὶς νὰ τοὺς βλέπης. Ἀλλά, ἂν δὲν μπορῆς νὰ τοὺς νιώσης χωρὶς νὰ τοὺς βλέπης, πιὸ πολὺ θὰ σὲ βοηθήση, ἂν δῆς ἕναν ποὺ ἔχει κόψει λίγο τὸ δάκτυλό του καὶ πῆς: «Σκέψου αὐτὸς ὁ καημένος νὰ εἶχε σακατευθῆ· νὰ εἶχαν κοπῆ τὰ χέρια του ἢ καὶ τὰ πόδια του! Καὶ πόσοι ταλαίπωροι ἄνθρωποι εἶναι μὲ κομμένα χέρια, μὲ κομμένα πόδια!». Γιατί, ἄλλο εἶναι νὰ μαθαίνη κανεὶς ὅτι ἔχει ἐκτροχιασθῆ μιὰ ἁμαξοστοιχία καὶ ἄλλο νὰ βλέπη μπροστά του ἐκτροχιασμένη μιὰ ὁλόκληρη ἁμαξοστοιχία, καὶ νὰ ἔχη κι ἕνα σωρὸ θύματα. Ὅταν προσεύχεσαι γιὰ ἕνα συγκεκριμένο θέμα τὸ ὁποῖο σὲ πονᾶ, βοηθιέσαι κι ἐσὺ ὁ ἴδιος, βοηθᾶς καὶ τὸν πλησίον σου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν χτυπᾶ τὸ καμπανάκι τὴν ὥρα τῆς Προσκομιδῆς[91], ἀναφέρω γενικὲς περιπτώσεις, λ.χ. χῆρες, ὀρφανά, ἐγκαταλελειμμένους, καὶ ὄχι ὀνόματα. Εἶναι σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κι ἐγὼ τὸ ἴδιο κάνω. Νὰ εὔχεσαι ὅμως μὲ πόνο. Καὶ ὁ ἱερέας δὲν ἀρκεῖ νὰ βγάζη στὴν Προσκομιδὴ μερίδες καὶ νὰ διαβάζη τὰ ὀνόματα τυπικά, ἀλλὰ πρέπει νὰ παρακαλῆ γιὰ τὸν καθέναν μὲ πόνο· τότε θὰ δῆ θαύματα. Μιὰ φορὰ πῆγαν σὲ ἕναν ἱερέα ἕναν δαιμονισμένο καὶ τὸν παρακάλεσαν νὰ κάνη Θεία Λειτουργία. Ἐκεῖνος, ὅταν ἦταν νὰ τὸν μνημονεύση στὴν Προσκομιδή, πρὶν βγάλη μερίδα γι’ αὐτόν, εἶπε μὲ πολὺ πόνο: «Κύριε, βλέπεις πόσο ὑποφέρει τὸ πλάσμα Σου. Ἀπάλλαξέ το ἀπὸ τὴν ἐπήρεια τοῦ δαίμονος.“Μνήσθητι Κύριε τοῦ δούλου σου…”». Τότε τὸ δαιμόνιο δὲν μπόρεσε νὰ ἀντέξη καὶ ἔφυγε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι προτιμότερο, Γέροντα, νὰ εὔχεται κανεὶς γιὰ τὸ ἴδιο θέμα πολλὴ ὥρα ἢ νὰ πηγαίνη ἀπὸ τὸ ἕνα θέμα στὸ ἄλλο, καὶ νὰ μπαίνη μὲ αὐτὸν τὸν τρόπο στὸν πόνο ὅλου τοῦ κόσμου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί νὰ πιάση μόνον ἕνα θέμα; Νὰ πιάνη πολλὰ θέματα· τὸ ἕνα, τὸ ἄλλο, τὸ ἄλλο, συνέχεια. Καὶ μετὰ νὰ σκέφτεται τὸν γενικὸ πόνο τοῦ κόσμου καὶ νὰ προσεύχεται. Αὐτὸ συγκινεῖ τὸν Θεό, γιατὶ ἔχει ἀρχοντιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί νὰ ζητᾶμε στὴν προσευχή μας γιὰ ὅλον τὸν κόσμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ εὐχώμαστε γιὰ ὅλους «καλὸν Παράδεισο». Ὁ Χριστὸς θυσιάστηκε, γιὰ νὰ σωθοῦν ὅλοι οἱ ἄνθρωποι, καὶ αὐτοὶ ποὺ εἶναι κοντά Του καὶ αὐτοὶ ποὺ εἶναι μακριά Του. Νὰ παρακαλοῦμε λοιπὸν νὰ γνωρίσουν ὅλοι τὸν Θεό, γιὰ νὰ Τὸν ἀγαπήσουν, νὰ Τὸν εὐαρεστήσουν καὶ νὰ σωθοῦν· νὰ πᾶνε στὸν Παράδεισο. Κάποιος[92]ἔλεγε: «Θεέ μου, ἐγὼ ἔζησα τὸν Παράδεισο ἀπὸ ''δῶ ἀπὸ τὴν γῆ. Πήγαινέ με ἐμένα στὴν κόλαση καὶ τὸν ἀδελφό μου βάλ’ τον στὸν Παράδεισο». Ἀλλὰ καὶ στὴν κόλαση ἂν πάη ἕνας τέτοιος ἄνθρωπος, ἀπὸ τὴν μεγάλη του ἀγάπη, ἡ ὁποία θὰ μεταφερθῆ καὶ στὴν κόλαση, νομίζω ὅτι ἐκεῖνο τὸ μικρὸ κομματάκι τῆς κολάσεως θὰ μεταβληθῆ σὲ Παράδεισο, διότι, ὅπου ὑπάρχει ἀγάπη, ἐκεῖ εἶναι ὁ Χριστός, καὶ ὅπου εἶναι ὁ Χριστός, ἐκεῖ Παράδεισος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχὴ γιὰ ὅσους μᾶς ζητοῦν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ὅταν μᾶς λένε: «Κάντε προσευχὴ γιὰ τὸ παιδί μου ποὺ δίνει ἐξετάσεις» ἢ «κάντε προσευχὴ γιὰ τὸν τάδε ποὺ θὰ κάνη ἐγχείρηση», χρειάζεται ὕστερα νὰ ρωτήσουμε ἂν πῆγε καλά;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί νὰ ρωτήσης ἂν πῆγε καλά; Γιὰ νὰ πῆς: «Δόξα σοι ὁ Θεός, ποὺ ἔπιασε ἡ προσευχή μου»; Ἔκανες τὸ καθῆκον σου; Προσευχήθηκες; Δὲν χρειάζεται νὰ κάνης τίποτε ἄλλο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς κάνετε προσευχὴ γιὰ τὰ ὀνόματα ποὺ σᾶς δίνουν νὰ προσευχηθῆτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρὶν ἀπὸ τὴν ἐγχείρηση[93]τὰ ὀνόματα ποὺ μοῦ ἔδιναν τὰ διάβαζα ὄρθιος, κάνοντας ἐνδιάμεσα μετάνοιες. Ὅταν γύρισα ἀπὸ τὸ νοσοκομεῖο, τὰ διάβαζα ξαπλωμένος, γυρτὸς στὸ πλάι. Μόλις συνῆλθα λίγο, ἄρχισα νὰ τὰ διαβάζω πάλι ὄρθιος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, μᾶς δίνουν κάποιοι προσκυνητὲς ὀνόματα γιὰ Παράκληση καὶ δὲν ξέρουμε τὰ προβλήματά τους, τί νὰ λέμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ λέτε:«Κύριε, ἐλέησον τοὺς δούλους σου, ὧν σὺ τὰ προβλήματα γινώσκεις».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ ὅταν, Γέροντα, εὐχώμαστε γιὰ πρόσωπα ποὺ δὲν ξέρουμε ἂν ζοῦν ἢ πέθαναν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ λέτε:«Κύριε Ἰησοῦ Χριστέ, ἐλέησον τοὺς δούλους σου».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καμμιὰ φορά, Γέροντα, ξεχνάω νὰ κάνω προσευχὴ γι’ αὐτοὺς ποὺ μοῦ λένε νὰ προσευχηθῶ γιὰ ἕνα συγκεκριμένο θέμα καὶ ὁρισμένη ἡμέρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ ξεκινᾶς τὴν προσευχή σου ἀπὸ αὐτοὺς καὶ νὰ λές: «Μνήσθητι, Κύριε, τῶν δούλων σου τῶν ἐντειλαμένων ἡμῖν τοῖς ἀναξίοις εὔχεσθαι ὑπὲρ αὐτῶν»[94]. Νὰ ἀναφέρης τὰ ὀνόματά τους μιὰ-δυὸ φορὲς καὶ ὕστερα νὰ προσεύχεσαι γιὰ ὅλον τὸν κόσμο λέγοντας:«Κύριε Ἰησοῦ Χριστέ, ἐλέησον τοὺς δούλους σου».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἄλλες φορές, Γέροντα, δὲν θυμᾶμαι τὰ ὀνόματα τῶν ἀνθρώπων ποὺ ζητοῦν προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὅταν δὲν θυμᾶσαι τὰ ὀνόματα ποὺ σοῦ δίνουν, νὰ πιάνης γενικὰ τὶς περιπτώσεις· τοὺς ἀρρώστους, τὰ παιδιὰ ποὺ ἔχουν παραστρατήσει κ.λπ. Νὰ λὲς στὴν ἀρχή: «Βοήθησε, Θεέ μου, πρῶτα αὐτοὺς ποὺ ἔχουν μεγαλύτερη ἀνάγκη» καὶ ὕστερα νὰ συνεχίζης μὲ τὸ«ἐλέησον τοὺς δούλους σου».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, γράφω τὰ ὀνόματα τῶν ἀνθρώπων ποὺ ζητοῦν προσευχὴ κατὰ περιπτώσεις: ὑπὲρ ὑγείας, ὑπὲρ φωτισμοῦ κ.λπ., ἀλλὰ τὰ ὀνόματα συνεχῶς αὐξάνονται. Πόσον καιρὸ πρέπει νὰ τὰ κρατῶ καὶ νὰ προσεύχωμαι γιὰ τοὺς ἀνθρώπους αὐτούς;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ κάνης πρῶτα προσευχὴ γιὰ τὰ νέα ὀνόματα καὶ μετὰ νὰ λές:«Κύριε Ἰησοῦ Χριστέ, ἐλέησον τοὺς δούλους σου καὶ τὸν κόσμον σου ἅπαντα», γιὰ νὰ μὴ φεύγη ἡ ἁμαξοστοιχία μὲ λίγους ἐπιβάτες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, μοῦ ζητήσουν νὰ κάνω προσευχὴ γιὰ ἕνα θέμα, πόσον καιρὸ πρέπει νὰ προσευχηθῶ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐξαρτᾶται ἀπὸ τὸ πρόβλημα ποὺ ἔχει ὁ ἄλλος, ἀλλὰ καὶ ἀπὸ τὸ πόσο τὸν ἔχεις πονέσει ἐσύ. Μπορεῖ νὰ μὴν ἔχη μεγάλο πρόβλημα, ἀλλά, ἐπειδὴ τὸν πόνεσες, νὰ εὔχεσαι γι’ αὐτὸν χρόνια. Μπορεῖ ὅμως νὰ κάνης καὶ μόνον ἕνα κομποσχοίνι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, ποιό θὰ εἶναι τὸ κριτήριο ὅτι προσευχήθηκα, ὅσο χρειαζόταν, γιὰ ἕνα θέμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ προσευχηθῆς μέχρις ἐκεῖ ποὺ δὲν σοῦ δημιουργεῖται ἄγχος. Καὶ ὅσον ἀφορᾶ τὴν ποσότητα, ἐξαρτᾶται ἀπὸ τὸν χρόνο ποὺ διαθέτεις. Νὰ ξέρης ὅμως ὅτι ἐκεῖνο ποὺ μετρᾶ δὲν εἶναι τὸ πόσο προσεύχεται κανείς, ἀλλὰ τὸ πῶς προσεύχεται. Μπορεῖ κάποιος νὰ διαθέτη πολὺ χρόνο στὴν προσευχὴ καὶ νὰ νομίζη πὼς προσεύχεται, ἀλλὰ στὴν πραγματικότητα νὰ μὴν προσεύχεται, ἐπειδὴ δὲν προσεύχεται μὲ πόνο. Καὶ ἄλλος μπορεῖ νὰ μὴν προσεύχεται πολύ, ἀλλὰ ἡ προσευχή του νὰ ἔχη ποιότητα, γιατὶ γίνεται μὲ συντριβὴ καὶ ταπείνωση. Ὅταν βέβαια ὑπάρχη καὶ ποσότητα καὶ ποιότητα, τότε ἡ φιλότιμη ψυχὴ λαμβάνει διπλὴ Χάρη καὶ εὐλογία ἀπὸ τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ἔρχωνται στὸ μοναστήρι ἄνθρωποι μὲ πολλὰ προβλήματα καὶ μοῦ δίνουν τὰ ὀνόματά τους, γιὰ νὰ κάνω προσευχή, τοὺς πονῶ, ἀλλὰ μερικὲς φορὲς δὲν διαθέτω χρόνο γιὰ προσευχὴ ἀνάλογο μὲ τὶς ἀνάγκες τους, καὶ μὲ πειράζει ὁ λογισμός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σοῦ λέει κάποιος τὸν πόνο του, κι ἐσὺ τὸν ἀκοῦς καὶ ἀναστενάζεις βαθιά. Τότε, καὶ νὰ μὴν προλάβης νὰ προσευχηθῆς γι’ αὐτόν, αὐτὸς ὁ ἀναστεναγμὸς ἀξίζει γιὰ ὧρες προσευχῆς· εἶναι μιὰ καρδιακὴ προσευχὴ καὶ φέρνει θετικὰ ἀποτελέσματα. Ἢ διαβάζεις ὀνόματα ποὺ σοῦ δίνουν καὶ στενοχωριέσαι ποὺ δὲν ἔχεις χρόνο νὰ κάνης κάτι περισσότερο. Ἕνας καρδιακὸς ἀναστεναγμὸς ποὺ συνοδεύει τὸ κάθε ὄνομα γράφεται ἐκεῖ ἐπάνω στὸν Οὐρανό· ἀνεβαίνει κατ’ εὐθεῖαν στὸν θρόνο τοῦ Θεοῦ!
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχὴ γιὰ τοὺς ἀρρώστους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τώρα ποὺ εἶμαι ἄρρωστη, τί νὰ κάνω ἀπὸ πνευματικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅσο μπορεῖς, νὰ ψάλλης σιγανὰ ἢ νὰ λὲς τὴν εὐχὴ καὶ νὰ ζητᾶς ἀπὸ τὸν Θεὸ τὴν ὑγεία τὴν δική σου καὶ τῶν ἄλλων ἀνθρώπων, τοὺς ὁποίους σὰν φιλάσθενη μπορεῖς νὰ τοὺς νιώθης πιὸ πολύ. Σ’ ἐσένα δίνονται τώρα ὅλες οἱ προϋποθέσεις γιὰ προσευχή, ἀκόμη καὶ ὁ πόνος, ποὺ εἶναι ἰδιαίτερη προϋπόθεση, γιὰ νὰ εὔχεσαι πονεμένα γιὰ τοὺς πονεμένους καὶ ἡ προσευχή σου νὰ εἶναι καρδιακή. Αὐτὸ εἶναι καὶ τὸ κύριο ἔργο τοῦ μοναχοῦ. Ἂν τὸ καταλάβης αὐτό, δὲν θὰ στενοχωριέσαι, ἀλλὰ θὰ προσεύχεσαι ἀδιάλειπτα, εὐχαριστώντας τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοὶ γράφουν ὀνόματα ἀρρώστων καὶ τὰ στέλνουν σὲ διάφορα μοναστήρια, γιὰ νὰ μνημονεύωνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλὸ εἶναι αὐτό· ὅμως δὲν φθάνει. Χρειάζεται νὰ προσεύχωνται καὶ οἱ ἴδιοι, ἀλλὰ νὰ λένε καὶ στοὺς ἀρρώστους νὰ κάνουν κι ἐκεῖνοι προσευχή. Δὲν πρέπει νὰ ἐπαναπαύωνται στὸ ὅτι ἔστειλαν τὰ ὀνόματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὸν τὸν καιρό, Γέροντα, ἤθελα νὰ παρακαλέσω τὸν Θεὸ νὰ πάρη τὸν ἀδελφό μου ποὺ ταλαιπωρεῖται ἀπὸ τὴν ἀναπηρία του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μὴν ὑποδεικνύης ἐσὺ λύση στὸν Θεό. Ἄφησε τὸ πρόβλημα μὲ ἐμπιστοσύνη σὲ Ἐκεῖνον. Ὁ Θεὸς ξέρει τὸ συμφέρον τοῦ παιδιοῦ Του καὶ σὰν στοργικὸς Πατέρας θὰ ἐνεργήση ἀνάλογα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς κάνετε προσευχὴ γιὰ ἕναν ἄρρωστο ποὺ κινδυνεύει ἡ ζωή του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Προσπαθῶ νὰ κάνω ὅ,τι μπορῶ ἀπὸ προσευχὴ καὶ ἄσκηση καὶ μετὰ ἀφήνω τὸ θέμα στὰ χέρια τοῦ Θεοῦ ποὺ εἶναι φύσει ἀγαθός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἀφοῦ ὁ Θεὸς γνωρίζει τὸ συμφέρον κάθε ἀρρώστου, γιατί χρειάζεται ἐμεῖς νὰ κάνουμε προσευχὴ γιὰ κάποιον ἄρρωστο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐμεῖς ὀφείλουμε νὰ παρακαλέσουμε τὸν Θεὸ καί, ἐὰν ἡ ὑγεία ἢ ἡ παράταση τῆς ζωῆς εἶναι γιὰ τὴν σωτηρία τῆς ψυχῆς του, ὁ Καλὸς Θεὸς ἀμέσως θὰ βοηθήση. Ἂν ὅμως δὲν Τὸν παρακαλέσουμε, θὰ ἐξελιχθῆ φυσιολογικὰ ἡ πορεία τῆς ἀρρώστιας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Στὴν προσευχὴ μὲ πόνο ἀκολουθεῖ θεία παρηγοριὰ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ἀκούω τὰ προβλήματα τοῦ κόσμου, αἰσθάνομαι νὰ λειώνω μέσα μου. Μήπως εἶναι ὀλιγοπιστία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε νὰ δῆς. Ἡ ἀγωνία γιὰ τὸν ἑαυτό μας εἶναι ὀλιγοπιστία· ἡ ἀγωνία γιὰ τὸν ἄλλον εἶναι πόνος. Τὸ σωστὸ λειώσιμο γιὰ τὸν πόνο τῶν ἄλλων συνοδεύεται μὲ προσευχὴ καὶ ἀκολουθεῖ μετὰ ἡ θεία παρηγοριά. Γι’ αὐτό, νὰ εὔχεσαι ὅσο μπορεῖς καὶ μετὰ νὰ τὰ ἀφήνης ὅλα στὰ χέρια τοῦ Θεοῦ καὶ νὰ εἰρηνεύης. Ὁ Θεὸς πονάει γιὰ τὰ πλάσματά Του λιγώτερο ἀπὸ σένα; Γιατί νὰ ἀνησυχῆς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ὁ Θεὸς σὲ ὅποιον πονάει πνευματικὰ καὶ ὑποφέρει γιὰ τοὺς ἄλλους δίνει πολλὴ παρηγοριά, γιατὶ ἀλλιῶς δὲν θὰ μποροῦσε νὰ ἀντέξη. Ξέρετε πῶς πικραίνομαι μὲ τόσα γράμματα ποὺ παίρνω ἀπὸ ἀνθρώπους μὲ ἕνα σωρὸ προβλήματα; Πίκρα, φαρμάκι εἶναι τὸ στόμα μου, καὶ μετὰ δὲν θέλω νὰ φάω τίποτε. Ἀπὸ αὐτὸν ὅμως τὸν πόνο βγαίνει ἡ πραγματικὴ χαρά. Ἀνταμείβει ὁ Θεὸς μὲ παρηγοριὰ ἀνάλογη μὲ τὸν πόνο· παρηγορεῖ μὲ τέτοια παρηγοριά, ποὺ δὲν μπορεῖς νὰ τὴν ἀντέξης. Καὶ ἐνῶ προηγουμένως πονοῦσες γιὰ τὸν ἄλλον καὶ ἔκλαιγες, μετὰ νιώθεις μιὰ ἀγαλλίαση. Σὰν νὰ σοῦ λέη ὁ Καλὸς Θεός: «Μὴ στενοχωριέσαι, παιδί μου, ἄκουσα τὸ αἴτημά σου».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Προσευχὴ γιὰ τοὺς κεκοιμημένους
- type: h2
  initial:
    ru: ''
  text:
    ru: «Μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωὴν»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, πονᾶτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐσὺ τί λές; Ἂν δὲν ξημερώσω ἀπόψε, τότε θὰ ἔχω μεγάλη ἡμέρα· δὲν θὰ βραδιάζη ποτὲ οὔτε θὰ ξημερώνη! Τὸν ἥλιο κρατῆστε τον ἐσεῖς[95]!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν πλησιάζη ὁ καιρὸς νὰ φύγη ἀπὸ αὐτὴν τὴν ζωὴ κάποιος ποὺ εἶναι τακτοποιημένος πνευματικά, ἄραγε πῶς νιώθει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποῦ νὰ ξέρω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δὲν σᾶς εἶπε κανένας καμμιὰ φορά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – «Μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν»[96], δὲν λέει; Ἄρα, αὐτὴ ἡ ζωὴ εἶναι θάνατος καὶ ὁ θάνατος εἶναι μετάβαση πρὸς τὴν ἀληθινὴ ζωή. Ἑπομένως, πηγαίνει χαρούμενος πρὸς τὴν ζωή!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλοὶ Ἅγιοι ἔχουν δεῖ ψυχές, ὅταν φεύγουν ἀπὸ τὸ σῶμα. Τί μορφὴ ἔχουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι σὰν παιδάκια. Στὴν ἄλλη ζωὴ ὅλοι θὰ εἶναι ὅπως οἱ Ἄγγελοι· δὲν θὰ ὑπάρχουν οὔτε ἄνδρες οὔτε γυναῖκες οὔτε γέροι οὔτε γριὲς οὔτε μωρά· ὅλοι θὰ εἶναι ἕνα φῦλο, θὰ ἔχουν μιὰ ἡλικία. Γι’ αὐτό, καὶ ὅταν δῆ κανεὶς ψυχὲς ποὺ φεύγουν ἀπὸ τὴν ζωή, τὶς βλέπει κατὰ κάποιον τρόπο σὰν μικρὰ παιδιά. Τὸ πρόσωπό τους ἔχει τὰ χαρακτηριστικά του, ἀλλὰ εἶναι σὰν μικροῦ παιδιοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν ἔμενα στὸ Κελλὶ τοῦ Τιμίου Σταυροῦ, ἐπισκεπτόμουν καμμιὰ φορὰ τὸν Γερο-Φιλάρετο[97]. Ἦταν ἕνα εὐλαβέστατο γεροντάκι ποὺ ἔμενε σὲ ἕνα κοντινὸ Κελλί. Ἐπὶ δεκαπέντε χρόνια, μέχρι ποὺ ἀρρώστησε καὶ ὁ ἴδιος, διακονοῦσε τὸν ὑποτακτικό του Πατέρα Βαρθολομαῖο, ποὺ ἔπασχε ἀπὸ πάρκινσον. Τὴν τελευταία φορὰ ποὺ πῆγα στὸ Κελλί του, τὸν βρῆκα πεσμένο κάτω. Εἶχε ἕναν μήνα ποὺ δὲν ἔτρωγε τίποτε· ἔπινε μόνο λίγο νερό. Οὔτε νὰ ξαπλώση μποροῦσε· κοιμόταν μὲ τὰ παπούτσια, καθιστὸς καὶ ἀκουμπισμένος στὸν τοῖχο. Τὰ ροῦχα του ἦταν κολλημένα στὸ σῶμα του καὶ τὰ παπούτσια του γεμάτα ὑγρά, γιατὶ εἶχαν ἀνοίξει τὰ πόδια του καὶ ἔβγαζαν αἷμα καὶ νερό. Ἀλλὰ αὐτὸς ἀντιμετώπιζε ὅλη αὐτὴν τὴν κατάσταση σὰν νὰ μὴ συνέβαινε τίποτε. «Καὶ αὐτά, ἔλεγε, εἶναι εὐλογία ἀπὸ τὸν Θεό». Τὸν σήκωσα λοιπὸν καὶ παρακάλεσα τὸν Πατέρα Βαρθολομαῖο νὰ μείνω τὸ βράδυ στὸ Καλύβι τους, γιὰ νὰ τοὺς συμπαρασταθῶ, ἀλλὰ ἐκεῖνος δὲν δέχθηκε. Μοῦ εἶπε νὰ πάω τὴν ἄλλη μέρα. Τὰ μεσάνυχτα ὅμως, τὴν ὥρα ποὺ ἔκανα κομποσχοίνι, τί νὰ δῶ! Βλέπω τὸν Γερο-Φιλάρετο μὲ ἕνα φωτεινὸ πρόσωπο, ἡλικίας περίπου δώδεκα χρόνων, νὰ φεύγη στὸν Οὐρανὸ μέσα σὲ οὐράνιο φῶς. Κατάλαβα ὅτι εἶχε ἀναπαυθῆ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὶς πρῶτες σαράντα μέρες χρειάζεται νὰ προσευχώμαστε περισσότερο γιὰ ἕναν κεκοιμημένο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατὶ ἡ ψυχὴ εἶναι ἀνήσυχη, ἐπειδὴ δὲν ξέρει πῶς θὰ κριθῆ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εἶχα συναντήσει ἐδῶ ἔξω ἀπὸ τὸν ξενώνα μία ἡλικιωμένη γυναίκα ποὺ ζήτησε νὰ πάρη τὴν εὐχή μου. Τῆς φίλησα κι ἐγὼ τὸ χέρι, γιατὶ εἶδα Χάρη Θεοῦ σ’ αὐτὴν τὴν ψυχή. Μετὰ ἀπὸ λίγο καιρὸ ἔγινε μοναχή. Ὅταν κοιμήθηκε, ἤμουν ἐδῶ καὶ τὴν ἀσπάσθηκα νεκρὴ μὲ εὐλάβεια. Στὴν συνέχεια μοῦ συνέβησαν δύο γεγονότα. Τὸ ἕνα ἐδῶ στὸ Ἡσυχαστήριο καὶ τὸ ἄλλο στὸ Καλύβι μου. Τὸ πρῶτο συνέβη ἑπτὰ ἡμέρες μετὰ τὴν κοίμησή της: Εἶδα τὴν ψυχή της σὰν ἀγγελούδι ποὺ ἔμοιαζε μὲ κοριτσάκι δώδεκα ἐτῶν· ἔλαμπε. Τὴν δεύτερη φορὰ παρουσιάσθηκε στὸν ὕπνο μου καὶ μοῦ ἔβαλε μετάνοια μὲ εὐγνωμοσύνη καὶ μὲ εὐχαρίστησε γιὰ τὴν προσευχὴ ποὺ ἔκανα γιὰ ἐκείνη. Ἦταν πολὺ συγκινητικὸ καὶ πολλὴ χαρὰ μοῦ ἔδωσε. Ὅταν πῆγα νὰ σημειώσω τὴν ἡμερομηνία, εἶδα ὅτι ἦταν σαράντα ἡμέρες μετὰ τὸν θάνατό της. Ἡ ψυχὴ αὐτὴ πολλὴ καλωσύνη εἶχε καὶ πολλὴ εὐγνωμοσύνη ἔχει.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ εὐχώμαστε πάντοτε γιὰ τοὺς κεκοιμημένους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στὸ ὀστεοφυλάκιο, Γέροντα, καῖνε καντήλι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, εἶναι μιὰ προσφορὰ γιὰ τοὺς νεκρούς. Καὶ μόνον ἕνα κερὶ νὰ ἀνάψουμε γιὰ τὴν ψυχὴ κάποιου κεκοιμημένου, βοηθιέται πολύ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τοὺς κεκοιμημένους νὰ τοὺς θυμώμαστε καὶ νὰ εὐχώμαστε πάντοτε γι’ αὐτούς. Νὰ μὴν παραλείπουμε νὰ προσευχώμαστε γιὰ τὶς ψυχές τους, γιὰ νὰ βροῦν ἀνάπαυση. Ἐγώ, κάθε φορὰ ποὺ ἔχω Θεία Λειτουργία στὸ Καλύβι, κάνω μνημόσυνο καὶ γιὰ ὅλους τοὺς κεκοιμημένους τῶν ὁποίων«τὰ ὀνόματα οὐκ ἐμνημονεύθησαν». Στὸ Ἅγιον Ὄρος, στὰ Μοναστήρια, τὸ ἀπόγευμα τῆς Παρασκευῆς κάνουν«Τρισάγιο» μὲ κόλλυβα γιὰ τοὺς κεκοιμημένους καὶ τὸ Σάββατο τὸ πρωὶ κάνουν τὸν Ὄρθρο στὸ Καθολικὸ[98]καὶ τὴν Θεία Λειτουργία στὸν ναὸ τοῦ Κοιμητηρίου. Ἐκεῖ στὸ Κοιμητήρι ἀποθέτουμε τὰ ὅπλα. Ἀπὸ ἐκεῖνο τὸ «σπίτι» θὰ πᾶμε στὸ ἄλλο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς νὰ προσεύχωμαι γιὰ τοὺς κεκοιμημένους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ λὲς γενικά:«Ὁ Θεός, ἀνάπαυσον τὰς ψυχὰς τῶν κεκοιμημένων δούλων σου»καί, ἐὰν ἔρθη στὸν νοῦ σου κανένα ὄνομα κεκοιμημένου ἢ τύχη νὰ πεθάνη κανένας γνωστὸς ἢ ἄγνωστος καὶ τὸ μάθης, μνημόνευσέ τον καὶ αὐτὸν μὲ τὴν ἴδια εὐχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλὰ εἶναι νὰ θυμώμαστε πρῶτα τοὺς κεκοιμημένους ποὺ ἔχουν μεγάλη ἀνάγκη, ὕστερα ὅσους ἔχουν λιγώτερη ἀνάγκη καὶ στὸ τέλος τοὺς γνωστούς. Ἐγώ, ἐνῶ ποτὲ δὲν σκέφτομαι τοὺς συγγενεῖς μου, ἂν τυχὸν εἶμαι κουρασμένος ἢ δὲν ἔχω χρόνο νὰ κάνω προσευχὴ γενικὰ γιὰ τοὺς κεκοιμημένους, βλέπω στὸν ὕπνο μου τοὺς γονεῖς μου. Καὶ αὐτό, γιατί, ὅταν προσεύχωμαι γιὰ τοὺς κεκοιμημένους γενικά, βοηθιοῦνται καὶ αὐτοὶ καὶ χαίρονται, ἐνῶ, ὅταν δὲν προσεύχωμαι, στεροῦνται αὐτὴν τὴν παρηγοριά. Ἐὰν μὲ τὶς τιποτένιες προσευχὲς ποὺ κάνουμε βοηθιοῦνται οἱ καημένοι οἱ κεκοιμημένοι, τότε ἐμᾶς τοὺς καλογήρους, ἂν δὲν προσευχώμαστε γι’ αὐτούς, πρέπει νὰ μᾶς γδάρουν καὶ νὰ μᾶς ἁλατίσουν ζωντανούς.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οἱ κεκοιμημένοι ἔχουν ἀνάγκη ἀπὸ προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὴν Ἀκολουθία προσεύχομαι περισσότερο γιὰ τὸν ἑαυτό μου. Ἀκόμη καὶ ὅταν διαβάζεται ὁ Ἄμωμος[99], ποὺ εἶναι γιὰ τοὺς κεκοιμημένους, πολλὲς φορὲς συνεχίζω τὴν εὐχὴ γιὰ τὸν ἑαυτό μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί, ὅλα γιὰ τὸν ἑαυτό σου τὰ θέλεις; Οἱ κεκοιμημένοι ἔχουν ἀνάγκη ἀπὸ τὴν προσευχή μας, διότι οἱ ἴδιοι δὲν μποροῦν νὰ κάνουν πιὰ τίποτε, ἐνῶ ἐμεῖς μποροῦμε νὰ κάνουμε κάτι γι’ αὐτούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἦταν στὸ Ἅγιον Ὄρος ἕνας μπαρμπα-Γιάννης ποὺ γύριζε παντοῦ καὶ ἔλεγε: «Ἔχεις καμμιὰ δουλειὰ νὰ σοῦ κάνω; Τί δουλειὰ θέλεις νὰ σοῦ κάνω;». Ἦταν τόσο καλός, ποὺ οἱ Πατέρες τοῦ ἔλεγαν νὰ γίνη μοναχός. Ἐκεῖνος ὅμως ἀπαντοῦσε: «Ὄχι, ὄχι, μόνο νὰ προσεύχεσθε γιὰ μένα, γιατὶ δὲν μπορεῖτε νὰ φαντασθῆτε τί κακὸς ἄνθρωπος ἤμουν, τί ἔκανα στὸν πόλεμο!». Μιὰ μέρα ποὺ μὲ βοήθησε νὰ κάνω ἕνα προσκυνητάρι, μοῦ εἶπε: «Νὰ προσεύχεσαι γιὰ μένα, γιατὶ εἶμαι πολὺ ἁμαρτωλός». Ἔκτοτε τὸν ἔχασα. Μετὰ ἀπὸ καιρό, ἦρθε ἕνας Πατέρας καὶ μοῦ εἶπε: «Ὁ μπαρμπα-Γιάννης κοιμήθηκε. Μοῦ παρουσιάσθηκε δυὸ φορὲς καὶ μὲ ἔστειλε νὰ σοῦ πῶ νὰ τὸν μνημονεύης στοὺς κεκοιμημένους». Τί εἶχε συμβῆ; Ὁ μπαρμπα-Γιάννης πῆγε σὲ ἕνα μοναστήρι καὶ τοὺς βοηθοῦσε. Ὅταν θὰ πέθαινε, εἶπε στὸν ἱερομόναχο ποὺ εἶχε τὴν φροντίδα τοῦ κοιμητηρίου: «Ἀδελφέ, εἶμαι πολὺ ἁμαρτωλός. Σὲ παρακαλῶ κάθε μέρα νὰ κάνης ἕνα“Τρισάγιο”στὸν τάφο μου». Πραγματικὰ κάθε ἀπόγευμα αὐτὸς πήγαινε στὸν τάφο τοῦ μπαρμπα-Γιάννη καὶ ἔκανε“Τρισάγιο”. Μετὰ ὅμως ἀπὸ λίγο καιρὸ τὸν ἔβαλαν στὸ ἀρχονταρίκι. Ἄλλοτε θυμόταν νὰ διαβάση τὸ “Τρισάγιο”, ἄλλοτε ὄχι. Ἕνα βράδυ παρουσιάσθηκε ὁ μπαρμπα-Γιάννης στὸν ὕπνο του καὶ τοῦ εἶπε: «Σὲ παρακαλῶ μὴ μὲ ξεχνᾶς. Καὶ ἂν δὲν μπορῆς νὰ μοῦ κάνης “Τρισάγιο”, πήγαινε στὸν πατέρα Παΐσιο καὶ πές του ὅτι πέθανα, γιατὶ μὲ θυμᾶται κάθε ἡμέρα, ἀλλὰ μὲ μνημονεύει σὰν ζωντανό, γιὰ νὰ μετανοήσω. Ἐγὼ ὅμως τώρα δὲν μπορῶ νὰ μετανοήσω».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οἱ κεκοιμημένοι ἔχουν πιὸ πολλὴ ἀνάγκη προσευχῆς ἀπὸ τοὺς ζῶντες, γιατὶ στοὺς ζῶντες ὑπάρχει καὶ ἐλπίδα μετανοίας. Καὶ θέλει ὁ Θεὸς νὰ ὑπάρχουν ἄνθρωποι νὰ Τὸν παρακαλοῦν νὰ βοηθήση τοὺς κεκοιμημένους, ἀφοῦ δὲν ἔγινε ἀκόμη ἡ τελικὴ Κρίση. Στὸν πόλεμο ἕνας βαριὰ τραυματισμένος ζήτησε ἀπὸ ἕναν ἱερέα νερὸ καὶ ἐκεῖνος δὲν τοῦ ἔδωσε. Ἀδιαφόρησε, ἐνῶ εἶχε στὸ παγούρι του λίγο νερό. Ὁ τραυματίας σὲ λίγο πέθανε καὶ ὁ ἱερέας, μόλις συνειδητοποίησε τὸ σφάλμα του, ἦταν ἀπαρηγόρητος. Τὸν μνημόνευε συνεχῶς. Ἦρθε στὸ Καλύβι καὶ μοῦ εἶπε τὸν πόνο του. Ὁ καημένος εἶχε πολλὴ θυσία, ἀλλὰ δὲν κατάλαβε πῶς τὸ ἔκανε αὐτό. Τὸ ἐπέτρεψε ὁ Θεός, πῆρε δηλαδὴ γιὰ λίγο τὴν Χάρη Του, ἐπειδὴ ὁ τραυματίας εἶχε πολλὴ ἀνάγκη ἀπὸ προσευχή. Ἂν ὁ ἱερέας τοῦ ἔδινε νερό, θὰ τὸν ξεχνοῦσε, ἐνῶ τώρα τὸν πείραζε ἡ συνείδηση καὶ προσευχόταν συνέχεια γι’ αὐτόν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ ἀνακούφιση τῶν κεκοιμημένων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά εἶναι ἡ βοήθεια ποὺ δέχονται οἱ κεκοιμημένοι μὲ τὴν προσευχή μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ σοῦ πῶ ἕνα παράδειγμα: Ἂν μιὰ μέρα μὲ ἔβρισκες στὸ ὑπόγειο καὶ ἔλεγες στὴν Γερόντισσα: «κρίμα εἶναι· δὲν τὸν βάζουμε στὸν ἐπάνω ὄροφο, ὥστε, ὅσο ζήση, νὰ βλέπη τὸν ἥλιο;», τί λές, δὲν θὰ τὸ ἔκανε ἡ Γερόντισσα;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σίγουρα θὰ τὸ ἔκανε, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔ, λοιπόν, ἂν θὰ τὸ ἔκανε αὐτὸ ἡ Γερόντισσα, ὁ Θεὸς δὲν θὰ χαρίση στοὺς κεκοιμημένους τὴν ἀνακούφιση ποὺ Τοῦ ζητᾶμε; Δὲν θὰ τοὺς μεταφέρη σὲ καλύτερη φυλακὴ ἢ ἀκόμη καὶ σὲ διαμέρισμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἀπὸ νέος γνώριζα μιὰ γριούλα ἡ ὁποία, ἀντίθετα μὲ τὴν κόρη της ποὺ ἦταν πολὺ ἐλεήμων, αὐτὴ ἦταν πολὺ τσιγγούνα. Μόνο σ’ ἐμένα δὲν τσιγγουνευόταν, γιατὶ μὲ ἀγαποῦσε πολύ. Τρία χρόνια μετὰ τὸν θάνατό της – δὲν εἶχε γίνει ἡ ἐκταφή της – καθὼς ἔλεγα τὴν εὐχή, μοῦ συνέβη κάτι παράξενο. Αὐτὸ ποὺ κατάλαβα ἦταν ὅτι ἕνας νέος μὲ φώναξε νὰ πᾶμε νὰ δοῦμε τὴν γριούλα, ἐπειδὴ μὲ ζητοῦσε. Μὲ πῆρε καὶ μὲ πῆγε στὸν τάφο της. Ἄνοιξε τὴν πλάκα καὶ εἶδα τὴν γριούλα νὰ φωνάζη: «Καλόγερε, σῶσε με! Καλόγερε, σῶσε με!». Ἦταν μισολειωμένη καὶ εἶχε μιὰ ἀφόρητη δυσωδία. Τὴν πόνεσα τόσο πολὺ ποὺ τὴν ἀγκάλιασα σφιχτὰ μὲ πόνο καὶ τὴν ἀσπάσθηκα. Παρόλο ποὺ μύριζε πολὺ ἄσχημα, δὲν ἤθελα νὰ τὴν ἀποχωρισθῶ, ἐὰν ἐκείνη δὲν μὲ ἀποχωριζόταν. Μεγάλη ἐντύπωση μοῦ ἔκανε τὸ γεγονὸς αὐτό. Ὅταν ὑπάρχη ἀγάπη ἀληθινὴ μὲ πόνο, οὔτε σάπιες σάρκες σιχαίνεσαι, οὔτε δυσωδία. Ἐνῶ, ὅταν βλέπω κοσμικὴ γυναίκα μὲ κοσμικὲς ὀμορφιὲς καὶ ἀρώματα, ἀηδιάζω ἐσωτερικά, αὐτὴν τὴν γριούλα, ἐπειδὴ τὴν πόνεσα, δὲν ἤθελα νὰ τὴν ἀποχωρισθῶ παρ’ ὅλη τὴν δυσωδία. Παράξενα πράγματα στὴν πνευματικὴ ζωή! Εἶχε ἀνάγκη ἀπὸ πολλὴ προσευχή, γι’ αὐτὸ οἰκονόμησε ὁ Θεὸς νὰ τὴν δῶ σ’ αὐτὴν τὴν κατάσταση. Μετὰ ἔκανα προσευχὴ γιὰ τὴν ψυχὴ αὐτή. Ὕστερα ἀπὸ δύο μῆνες εἶδα ὅτι βρέθηκα σὲ ἕνα χάσμα ποὺ ἦταν σὰν χωνί. Δυστυχῶς ἐκεῖ μέσα βρίσκονταν πολλοὶ ἄνθρωποι, μὲ ἄγρια μορφή, μαῦροι, ποὺ ταλαιπωροῦνταν φοβερά. Πιὸ πάνω, εἶδα τὴν γριούλα ἐπάνω σὲ ἕνα λευκὸ σύννεφο· φαινόταν μακριά, ἦταν ὅμως κοντά. Ἦταν σὰν μικρὸ παιδί, μὲ τὰ χαρακτηριστικὰ τοῦ δικοῦ της προσώπου, καὶ δίπλα της ἕνας Ἄγγελος – μᾶλλον ὁ Φύλακας Ἄγγελός της – τῆς ἔτριβε τὸ πρόσωπο καὶ τῆς τὸ καθάριζε. Εἶχε γλυκειὰ μορφή. Τὴν ἀγκάλιασα· ἔνιωσα μία ἀγαλλίαση, ἄλλο πράγμα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οἱ κεκοιμημένοι εἶναι ὑπόδικοι· εἶναι σκλαβωμένοι. Καμμιὰ φορά, ὅταν θυμᾶμαι ἕνα πατριωτικὸ τραγούδι, τὸ λέω ἀλληγορικὰ γιὰ τοὺς κεκοιμημένους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Λευτεριά, λευθέρωσέ μου, τὸ ἀδύνατο κορμί,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: λευτεριά, γιά χάρισέ μου μιὰ ἐναρμόνιο φωνή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δῶσε φλόγα στὴν καρδιά μου ποὺ τὴν μάραναν οἱ πόνοι,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: νὰ σοῦ ψάλω τὴν χαρά μου σὰν ἀνοίξεως ἀηδόνι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τὸ τραγούδι ν’ ἀντηχήση καὶ βαθιὰ στὴν σκλάβα γῆ,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: λίγο βάλσαμο νὰ χύση μέσ’ τοῦ δούλου τὴν ψυχή».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αὐτὸ τὸ λέω καὶ γιὰ μένα. Μήπως κι ἐμένα δὲν μὲ μάραναν οἱ πόνοι[100]; Σκλαβωμένος εἶμαι σ’ αὐτὴν τὴν ζωή. Ἀλλὰ τὸ«σκλάβα γῆ», ποὺ ἀναφέρεται στοὺς ραγιάδες, τὸ λέω γιὰ τοὺς κεκοιμημένους ποὺ εἶναι σκλαβωμένοι καὶ παρακαλῶ τὸν Πολυεύσπλαγχνο Θεὸ νὰ χύση«λίγο βάλσαμο»μέσα στὶς ψυχές τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Τὸ Ψαλτήρι εἶναι κεραυνὸς γιὰ τὸν διάβολο
- type: h2
  initial:
    ru: ''
  text:
    ru: Οἱ Ψαλμοὶ τοῦ Δαβὶδ εἶναι θεόπνευστοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, μοῦ κάνει ἐντύπωση πῶς τὰ παιδιὰ καταλαβαίνουν τὸ Ψαλτήρι καὶ θέλουν νὰ τὸ διαβάζουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ Ψαλτήρι ἀναπαύει ὅλες τὶς ἡλικίες. Τὰ παιδιὰ μάλιστα μπορεῖ νὰ τὰ ἀναπαύη περισσότερο ἀπὸ ὅ,τι ἀναπαύει ἐσένα κι ἐμένα. Τὸ Ψαλτήρι εἶναι θεόπνευστο, εἶναι γραμμένο μὲ θεῖο φωτισμό, γι’ αὐτὸ ἔχει τόσο δυνατά, τόσο βαθιὰ νοήματα. Ὅλους τοὺς θεολόγους καὶ τοὺς φιλολόγους νὰ μαζέψης, ἕναν Ψαλμὸ μὲ τέτοια νοήματα δὲν μποροῦν νὰ φτιάξουν. Κι ἂν φτιάξουν κάτι, θὰ εἶναι σὰν ἕνα χάρτινο λουλούδι. Ἀγράμματος ἦταν ὁ Δαβίδ, ἀλλὰ μὲ τί βάθος ἔγραφε! Φαίνεται καθαρὰ ὅτι τὸν ὁδηγοῦσε τὸ Πνεῦμα τοῦ Θεοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δὲν προλαβαίνω νὰ διαβάσω τὸ Ψαλτήρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλὰ εἶναι νὰ ἐξοικονομῆς λίγη ὥρα, γιὰ νὰ τὸ διαβάζης μέσα στὴν ἡμέρα. Κι ἂν δὲν ἔχης πολὺ χρόνο, καλύτερα εἶναι νὰ διαβάσης μισὸ Κάθισμα[101]καὶ νὰ προσέχης τὰ νοήματα, παρὰ ὁλόκληρο καὶ νὰ βιάζεσαι. Αὐτὰ τὰ νοήματα νὰ τὰ ἔχης μετὰ συνέχεια στὸν νοῦ σου. Τὸ Ψαλτήρι εἶναι προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοὶ παρεξηγοῦν τὸν Προφήτη Δαβὶδ καὶ λένε ὅτι σὲ κάποιους Ψαλμοὺς καταριέται. Ὅταν ὅμως ὁ Δαβὶδ λέη: «Ἐκλείποιεν ἁμαρτωλοὶ ἀπὸ τῆς γῆς καὶ ἄνομοι, ὥστε μὴ ὑπάρχειν αὐτούς»[102], δὲν ἐννοεῖ νὰ ἐξολοθρευθοῦν οἱ ἁμαρτωλοί, ἀλλὰ νὰ μετανοήσουν καὶ νὰ μὴν ὑπάρχουν ἁμαρτωλοὶ πάνω στὴν γῆ.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἐγώ, μὲ τὸ Ψαλτήρι νιώθω μιὰ ἀγαλλίαση· εἶναι ὅλο προφητεία, ὅλο παρηγοριά. Σὲ μιὰ δύσκολη κατάσταση, ἂν διαβάσης Ψαλτήρι, νιώθεις ἀνακούφιση, λύτρωση, σιγουριὰ ὅτι θὰ βοηθήση ὁ Θεός.«Σωτηρία, λέει,τῶν δικαίων παρὰ Κυρίου, καὶ ὑπερασπιστὴς αὐτῶν ἐστιν ἐν καιρῷ θλίψεως»[103].
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχὴ μὲ τὶς «περιπτώσεις» τοῦ Ἁγίου Ἀρσενίου[104]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς ξεκινήσατε νὰ προσεύχεσθε μὲ τὸ Ψαλτήρι χρησιμοποιώντας τὶς «περιπτώσεις» τοῦ Ἁγίου Ἀρσενίου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ Ἅγιος Ἀρσένιος, ἐπειδὴ δὲν εὕρισκε στὸ Εὐχολόγιο τὴν ἀνάλογη εὐχὴ γιὰ ὅλες τὶς περιπτώσεις ποὺ τοῦ ζητοῦσαν βοήθεια οἱ ἄνθρωποι, χρησιμοποιοῦσε καὶ Ψαλμούς. Σὲ ἕνα τετράδιο εἶχε γράψει γιὰ ποιά περίπτωση χρησιμοποιοῦσε τὸν κάθε Ψαλμό. Ὅταν λοιπὸν ἦρθε τὸ τετράδιο αὐτὸ στὰ χέρια μου, ἄρχισα νὰ διαβάζω τὸ Ψαλτήρι, κάνοντας προσευχὴ γιὰ τὴν περίπτωση κάθε Ψαλμοῦ. Μοῦ λέει ὁ λογισμὸς ὅτι στὴν προσευχὴ μὲ τὸ Ψαλτήρι πολὺ βοηθάει καὶ ὁ Ἅγιος Ἀρσένιος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Ἅγιος Ἀρσένιος πρεσβεύει περισσότερο στὸν Θεό, ἐπειδὴ βλέπει ὅτι προσευχόμαστε μὲ τὸν τρόπο ποὺ προσευχόταν ἐκεῖνος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, βέβαια.Ἔχω ὑπ’ ὄψιν μου περιστατικά!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς νὰ διαβάζω τοὺς Ψαλμοὺς καὶ νὰ προσεύχωμαι γιὰ κάποιο συγκεκριμένο θέμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐσὺ πῶς τοὺς διαβάζεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Διαβάζω πρῶτα τὴν περίπτωση καὶ μετὰ τὸν Ψαλμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, στὴν ἀρχὴ πρέπει νὰ κάνης μιὰ καλὴ εἰσήγηση. Ὁ Ἅγιος Ἀρσένιος ἦταν Ἅγιος καὶ ἔφθανε νὰ διαβάση μόνον τὸν Ψαλμό. Ἐμεῖς νὰ μὴν ποῦμε στὴν ἀρχὴ ἕνα «Ἐλέησόν με ὁ Θεός»[105]; Καί, ἀφοῦ διαβάσουμε τὸν Ψαλμό, νὰ μὴν ποῦμε τὴν Δοξολογία; Νὰ μὴν κάνουμε καὶ μερικὲς μετάνοιες; Πρῶτα λοιπὸν νὰ λὲς τὸν 50ο Ψαλμὸ καὶ νὰ ζητᾶς ταπεινὰ τὸ ἔλεος τοῦ Θεοῦ. Ἔπειτα νὰ λὲς τὸ τροπάριο:«Ὑπὸ τὴν σὴν εὐσπλαγχνίαν καταφεύγομεν, Θεοτόκε»καὶ τὸ Ἀπολυτίκιον τοῦ Ἁγίου Ἀρσενίου, γιὰ νὰ ἐπικαλεσθῆς τὴν βοήθεια τῆς Παναγίας καὶ τοῦ Ἁγίου. Μετὰ νὰ διαβάζης τὴν περίπτωση τοῦ Ψαλμοῦ καὶ στὴν συνέχεια τὸν Ψαλμό. Στὸ τέλος νὰ λές:«Δόξα Πατρί… καὶ νῦν…», τὸ«Ἀλληλούϊα, Ἀλληλούϊα, Ἀλληλούϊα, Δόξα σοι ὁ Θεὸς»τρεῖς φορές, καὶ στὸ τέλος τὴν Δοξολογία ὡς εὐχαριστία στὸν Χριστὸ καὶ τὸ«Ἄξιόν ἐστιν»ὡς εὐχαριστία στὴν Παναγία. Νὰ κάνης καὶ ὅσες μετάνοιες μπορεῖς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικὲς φορές, Γέροντα, προσπαθῶ νὰ βρῶ ἂν ὁ Ψαλμὸς ἔχη σχέση μὲ τὴν περίπτωση γιὰ τὴν ὁποία τὸν χρησιμοποιοῦσε ὁ Ἅγιος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οἱ περιπτώσεις λίγο-πολὺ ἔχουν σχέση μὲ τὸ νόημα τοῦ Ψαλμοῦ. Τὸν Ἅγιο Ἀρσένιο ὅμως τὸν ἐνδιέφερε κυρίως νὰ προσευχηθῆ καὶ ὄχι ἂν τὸ περιεχόμενο τοῦ Ψαλμοῦ ἦταν σχετικὸ μὲ τὴν περίπτωση γιὰ τὴν ὁποία προσευχόταν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορῶ, Γέροντα, νὰ διαβάζω πολλὲς περιπτώσεις αἰτημάτων καὶ μετὰ νὰ διαβάζω ὅλους μαζὶ τοὺς ἀντίστοιχους Ψαλμούς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν διαβάζης πολλὲς περιπτώσεις μαζί, θὰ τὶς ξεχνᾶς. Καλύτερα νὰ διαβάζης κάθε περίπτωση πρὶν ἀπὸ τὸν Ψαλμό, γιὰ νὰ κεντρίζεται ἡ καρδιά. Ὅταν προσεύχεται κανεὶς γιὰ ἕνα συγκεκριμένο θέμα, αὐτὸ βοηθάει πιὸ πολὺ στὴν καρδιακὴ προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὴν Ἀκολουθία δυσκολεύομαι νὰ παρακολουθήσω τὸ Ψαλτήρι[106].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μπορεῖς νὰ βλέπης στὸ κελλί σου τὶς περιπτώσεις τῶν Ψαλμῶν ποὺ θὰ διαβασθοῦν στὴν Ἀκολουθία καί, ὅταν ἀκοῦς τοὺς Ψαλμούς, νὰ εὔχεσαι γι’ αὐτές. Ἂν δὲν θυμᾶσαι τὶς περιπτώσεις, τότε νὰ λές: «Θεέ μου, βοήθησε τὴν περιπτώση στὴν ὁποία ἀναφέρεται ὁ Ψαλμὸς» καὶ νὰ κάνης εὐχή.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ πιάνουμε καὶ ἄλλες περιπτώσεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν μετὰ τὴν διακονία πηγαίνω στὸ κελλί μου, συνήθως κάνω εὐχὴ γιὰ διάφορες περιπτώσεις. Μήπως θὰ μὲ βοηθοῦσε νὰ διαβάζω καὶ κάποιους Ψαλμοὺς μὲ τὴν ἀντίστοιχη περίπτωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἂν θέλης, δοκίμασε· θὰ σὲ βοηθήση. Νὰ διαβάζης πρῶτα τὴν περίπτωση τοῦ Ψαλμοῦ, ὕστερα νὰ κάνης εὐχὴ γιὰ τὸ συγκεκριμένο θέμα καὶ μετὰ νὰ διαβάζης τὸν Ψαλμό. Τὸ Ψαλτήρι πολὺ βοηθάει γιὰ τὴν καρδιακὴ προσευχή· θὰ τὸ καταλάβης ἀργότερα καὶ μόνη σου. Ἐγώ, ἀφοῦ διαβάσω τὴν περίπτωση, κάνω καρδιακὴ προσευχὴ καὶ δὲν πιάνω μόνον ἕνα θέμα ἀλλὰ πολλά. Ξεκινώντας δηλαδὴ ἀπὸ τὶς «περιπτώσεις» τοῦ Ἁγίου Ἀρσενίου πηγαίνω καὶ σὲ ἄλλα θέματα. Ὅλες τὶς περιπτώσεις τὶς πιάνω καὶ πνευματικὰ καὶ ὑλικά. Γιὰ τὸν 1ο Ψαλμό, τὸν ὁποῖο διάβαζε ὁ Ἅγιος Ἀρσένιος, γιὰ νὰ καρποφορήσουν τὰ δένδρα ἢ τὰ ἀμπέλια ποὺ φύτευαν, πρῶτα λέω: «Ὅ,τι φυτεύεται, νὰ πιάση». Καὶ μετὰ εὔχομαι καὶ γιὰ κάθε ξεκίνημα, γιὰ κάθε ἀρχή. Λέω: «Τὰ παιδάκια ποὺ γεννιοῦνται, νὰ εἶναι ἁγιασμένα, νὰ κάνουν προκοπή. Κάθε λόγος πνευματικὸς ποὺ σπέρνεται καὶ ὅ,τι πνευματικὸ ἀρχίζει, νὰ καρποφορῆ». Στὸν 105ο Ψαλμὸ ποὺ εἶναι γιὰ τὸν θεῖο φωτισμό, εὔχομαι καὶ γιὰ τοὺς τυφλούς· στὸν 122ο Ψαλμὸ ποὺ εἶναι γιὰ τοὺς τυφλούς, εὔχομαι καὶ νὰ φωτίση ὁ Θεὸς ὅλον τὸν κόσμο. Ὁ καθένας ξεκινώντας ἀπὸ τὴν περίπτωση ποὺ ἀναφέρει ὁ Ἅγιος Ἀρσένιος μπορεῖ νὰ βρῆ καὶ ἄλλες περιπτώσεις καὶ νὰ προσευχηθῆ. Κι ἐσύ, ἐὰν θέλης νὰ ἀνοίξης δουλειὰ πνευματική, νὰ πάρης μὲ τὴν σειρὰ τὸ Ψαλτήρι καὶ ὅλες τὶς «περιπτώσεις» τοῦ Ἁγίου Ἀρσενίου νὰ τὶς ἑρμηνεύης καὶ πνευματικὰ καὶ νὰ κάνης καρδιακὴ προσευχή. Μπορεῖς, παίρνοντας μιὰ περίπτωση τοῦ Ἁγίου Ἀρσενίου, νὰ μοῦ πῆς καὶ γιὰ τί ἄλλο θὰ προσευχόσουν;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρὶν ἀπὸ λίγο καιρό, Γέροντα, εἶχα πρόβλημα μὲ τὰ αὐτιά μου καὶ διάβαζα τὸν 95ο Ψαλμὸ ποὺ διάβαζε ὁ Ἅγιος Ἀρσένιος γιὰ νὰ δώση ὁ Θεὸς τὴν ἀκοὴ στοὺς κωφούς. Προσευχόμουν ὅμως καὶ γιὰ ὅλους τοὺς κωφοὺς καὶ γιὰ τὰ παιδιὰ νὰ ἀκοῦν τοὺς γονεῖς τους, καὶ γιὰ τοὺς ὑποτακτικοὺς νὰ κάνουν ὑπακοή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βλέπεις, ἐπειδὴ αὐτὴν τὴν περίπτωση τὴν ἔζησες καὶ πόνεσες, εὔκολα μπόρεσες νὰ σκεφθῆς καὶ τοὺς ἄλλους πονεμένους. Νὰ προσπαθήσης νὰ πονᾶς ὅλον τὸν κόσμο καὶ χωρὶς νὰ ζῆς τὶς δύσκολες καταστάσεις ποὺ περνοῦν. Ἔτσι σιγὰ-σιγὰ θὰ πονᾶς ὅλους τοὺς ἀνθρώπους ἀπὸ μακριὰ καὶ θὰ κάνης γι’ αὐτοὺς καρδιακὴ προσευχή· θὰ πονάη ἡ καρδιὰ καὶ ἀπὸ τὸν πόνο θὰ βγαίνη ἡ προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν διαβάζω τὴν περίπτωση ἑνὸς Ψαλμοῦ καὶ προσπαθῶ νὰ σκεφθῶ καὶ ἄλλες σχετικὲς περιπτώσεις, καθυστερῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν χρειάζεται νὰ σκεφθῆς τί περίπτωση θὰ βρῆς. Αὐτὲς οἱ περιπτώσεις ξεπετάγονται μέσα ἀπὸ τὴν καρδιὰ σὲ κλάσματα δευτερολέπτου. Ἐγὼ βοηθιέμαι στὸ θέμα αὐτό, γιατὶ ἔχω ὑπ’ ὄψιν μου τὸν πόνο τοῦ κόσμου, τὴν κατάσταση στὴν ὁποία βρίσκεται, καὶ πονῶ. Κάθε φορὰ ἀνάλογα μὲ τὶς καταστάσεις βρίσκω καὶ ἄλλα καὶ ἄλλα. Ἀπὸ τὴν περίπτωση ἑνὸς Ψαλμοῦ πηγαίνω σὲ ἕνα γνωστὸ πρόσωπο καὶ μετὰ σὲ ὅλους τοὺς ἀγνώστους ποὺ ἔχουν τὸ ἴδιο πρόβλημα. Ἀλλὰ κι ἐσεῖς νὰ μὴ ζῆτε ἀδιάφορα, νὰ σκέφτεσθε πόσο ὑποφέρει ὁ κόσμος, γιὰ νὰ προσεύχεσθε καρδιακά. Τὸ θέμα εἶναι νὰ δουλέψη ἡ καρδιά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχὴ μὲ τὸ Ψαλτήρι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θέλει πολλὴ προσευχὴ σήμερα. Ἡ μόνη λύση ἡ προσευχὴ εἶναι· ἀλλιῶς δὲν γίνεται. Πάντως τὸ Ψαλτήρι πολὺ βοηθάει. Εἶναι κεραυνὸς γιὰ τὸν διάβολο. Πόση παρηγοριὰ βρίσκω μὲ τὸ Ψαλτήρι! Τὸ χώρισα σὲ τρία μέρη[107]. Κάθε μέρα διαβάζω καὶ ἕνα μέρος. Σὲ τρεῖς μέρες τὸ τελειώνω καὶ μετὰ τὸ ἀρχίζω πάλι ἀπὸ τὴν ἀρχή. Διαβάζω τὴν περίπτωση τοῦ Ψαλμοῦ καὶ κάνω καρδιακὴ προσευχὴ γιὰ τὴν περίπτωση αὐτὴν καὶ γιὰ ὅσους πάσχουν σωματικὰ καὶ ψυχικά. Μετὰ διαβάζω τὸν Ψαλμὸ καὶ στὸ τέλος κάθε Ψαλμοῦ λέω:«Ὁ Θεός, ἀνάπαυσον τοὺς κοιμηθέντας δούλους σου». Αὐτὴν τὴν μιάμιση ὥρα ποὺ διαβάζω τὸ Ψαλτήρι τὴν βλέπω σὰν τὴν πιὸ θετικὴ βοήθεια πρὸς τὸν κόσμο. Τὸν χειμώνα ποὺ ὑπέφερα πολὺ ἀπὸ τὴν κήλη, ὄρθιος τὸ διάβαζα. Ἀπὸ τὰ μάτια μου ἔτρεχαν δάκρυα ἀπὸ τοὺς ἀνυπόφορους πόνους. Μὲ τὸ ἕνα χέρι συμμάζευα τὴν κήλη καὶ μὲ τὸ ἄλλο κρατοῦσα τὸ Ψαλτήρι. Χτυποῦσα τὸν διάβολο μὲ τὸ πυροβόλο. Τὴν ἡμέρα τὸν χτυποῦσα μὲ τὸ Ψαλτήρι, τὸ βράδυ μὲ τὴν εὐχή. Λύσσαξε ὁ διάβολος. Αὐτὸ τὸ σακάτεμα μὲ τὴν κήλη ἦταν δαιμονικὸ χτύπημα. Ἀλλὰ καὶ ὁ Θεὸς τὸ παραχώρησε, γιὰ νὰ δῆ τί θὰ κάνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δυσκολεύομαι νὰ διαβάζω ὄρθια τὸ Ψαλτήρι, χωρὶς νὰ στηρίζωμαι κάπου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θὰ κάνω καὶ γιὰ σᾶς «ὑποστυλώματα» γιὰ τὸν«ναὸ τοῦ Ἁγίου Πνεύματος»[108]τῆς καθεμιᾶς· θὰ κάνω καὶ γιὰ σᾶς ἀκουμπιστήρια. Ἐπάνω σὲ ἕνα ξύλο καρφώνω ἕνα ὁριζόντιο σανίδι σὲ σχῆμα ταῦ. Σ’ αὐτὸ ἀκουμπῶ καὶ διαβάζω τὸ Ψαλτήρι. Ἔχω ἕνα ἀκουμπιστήρι μέσα στὸ κελλὶ καὶ ἕνα ἔξω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικὲς φορές, ὅταν εἶμαι κουρασμένη καὶ διαβάζω τὸ Ψαλτήρι, ἂν καὶ ἀπὸ τὴν κούραση δὲν καταλαβαίνω τίποτε, βιάζω τὸν ἑαυτό μου νὰ σταθῶ ὄρθια καὶ νιώθω ὅτι αὐτὸ μὲ βοηθάει. Μοῦ λέει ὅμως ὁ λογισμὸς ὅτι αὐτὴ ἡ προσευχὴ δὲν ἔχει ἀξία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ νὰ μὴν καταλαβαίνης τί διαβάζεις, ἀλλὰ ἔχει ἀξία, γιατί, παρόλο ποὺ εἶσαι κουρασμένη, βιάζεις ὅμως τὸν ἑαυτό σου καὶ στέκεσαι μπροστὰ στὸν Χριστό. Νὰ μὴν ξεχνᾶς ὅτι καὶ ὁ κόπος συμπεριλαμβάνεται στὴν προσευχή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πέμπτο Μέρος – Εὐχὴ Καὶ Νήψη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ἐπαναλαμβάνουμε πολλὲς φορὲς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τὸ γλυκύτατο ὄνομα τοῦ Χριστοῦ,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ὄχι γιατὶ ὁ Χριστὸς δὲν ἀκούει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μὲ μιὰ φορὰ ποὺ θὰ Τὸν ἐπικαλεσθοῦμε,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ἀλλὰ γιὰ νὰ ἑνωθῆ ὁ νοῦς μας μαζί Του».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Ἡ δύναμη τῆς εὐχῆς
- type: h2
  initial:
    ru: ''
  text:
    ru: «Κύριε Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, ἐλέησόν με»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, πῶς νὰ λέω τὴν εὐχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλύτερα νὰ τὴν λὲς ὁλόκληρη:«Κύριε Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, ἐλέησόν με», γιατὶ ἡ εὐχὴ περιέχει ὅλο τὸ δόγμα τῆς Πίστεως[109]. Ἂν δυσκολεύεσαι νὰ τὴν πῆς ὁλόκληρη, ἂς λές:«Κύριε Ἰησοῦ Χριστέ, ἐλέησόν με».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Διάβασα, Γέροντα, ὅτι ἡ προσευχὴ πρέπει νὰ ἀπευθύνεται καὶ στὰ τρία Πρόσωπα τῆς Ἁγίας Τριάδος[110]. Μὲ τὸ«Κύριε Ἰησοῦ Χριστὲ»ὅμως δὲν ἀπευθυνόμαστε μόνο στὸν Χριστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸν Χριστό, δηλαδὴ τὸν Υἱό, δὲν ἀπέστειλε ὁ Πατὴρ στὸν κόσμο, γιὰ νὰ σώση τὸν κόσμο; Ὁ Χριστὸς δὲν θυσιάστηκε καὶ σταυρώθηκε γιὰ μᾶς; Ὁ Χριστὸς δὲν θὰ κρίνη τὸν κόσμο; Στὸν Χριστὸ λοιπὸν θὰ ἀπευθυνθοῦμε, ἀφοῦ σ’ Αὐτὸν στήριξε ὁ Θεὸς τὴν σωτηρία τοῦ κόσμου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εἶναι σωστό, Γέροντα, ἀντὶ νὰ λέω:«Κύριε Ἰησοῦ Χριστέ, ἐλέησόν με»,νὰ λέω: «Κύριε Ἰησοῦ Χριστέ, φώτισέ με» ἢ «συγχώρεσέ με» ἢ «σκέπασέ με»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καλύτερα νὰ λὲς τὴν εὐχὴ ὅπως εἶναι. Τὸ«ἐλέησόν με»τὰ ἔχει ὅλα μέσα· σημαίνει καὶ «σῶσον» καὶ «φώτισον», ἀναφέρεται καὶ στὶς σωματικὲς ἀνάγκες καὶ στὴν ἀπαλλαγὴ ἀπὸ τὰ πάθη κ.λπ. Ἀλλά, ἂν κάποια στιγμὴ νιώσης τὴν ἀνάγκη νὰ πῆς: «Κύριε Ἰησοῦ Χριστέ, φώτισέ με» ἢ «συγχώρεσέ με», μπορεῖς νὰ τὸ κάνης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μετὰ τὸ«ἐλέησόν με»πρέπει νὰ λέω πάντοτε«τὴν ἁμαρτωλήν»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖς νὰ τὸ πῆς λίγες φορὲς στὴν ἀρχὴ καὶ μετὰ δὲν χρειάζεται νὰ τὸ λές· φθάνει νὰ ἔχης συναίσθηση τῆς ἁμαρτωλότητός σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μοῦ εἶναι πιὸ εὔκολο νὰ κάνω κομποσχοίνι στὴν Παναγία ἢ στοὺς Ἁγίους παρὰ νὰ λέω τὴν εὐχή. Εἶναι φυσικὸ νὰ συμβαίνη αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἄλλο τὸ ἕνα, ἄλλο τὸ ἄλλο. Ἡ εὐχὴ ἔχει ἄλλο νόημα· μὲ τὴν εὐχὴ συνδέεται κανεὶς μὲ τὸν Χριστό, ἑνώνεται ὁ νοῦς του μὲ τὸν Θεό. Ἀλλὰ πρέπει ὁ νοῦς νὰ εἶναι στὴν εὐχή· αὐτὸ εἶναι τὸ μυστικό. Ὅταν κάνουμε πολλὰ κομποσχοίνια στὸν ἕναν ἢ στὸν ἄλλον Ἅγιο, καλὸ εἶναι καὶ αὐτό, ἀλλὰ δὲν βοηθάει στὴν ἀδιάλειπτη προσευχή. Νὰ συνηθίζης νὰ λὲς περισσότερο τὴν εὐχή, γιὰ νὰ κινῆται ὁ νοῦς πολλὲς φορὲς στὸ«Κύριε Ἰησοῦ Χριστέ», καὶ ἔτσι θὰ βρίσκεσαι φυσιολογικὰ στὴν ἀδιάλειπτη προσευχή, ἡ ὁποία περιορίζεται συνήθως στὸ «ΚύριεἸησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, ἐλέησόν με», τὸ ὁποῖο πρέπει νὰ λέμε«ἐν ὅλῃ τῇ καρδίᾳ καὶ ἐν ὅλῃ τῇ ψυχῇ καὶ ἐν ὅλῃ τῇ διανοίᾳ»[111]. Ἄλλο εἶναι ὅταν θέλουμε νὰ παρακαλέσουμε ἕναν Ἅγιο γιὰ νὰ ἐπέμβη, νὰ βοηθήση σὲ κάποιο πρόβλημα. Αὐτὸ τὸ λέω ἀπὸ δική μου πεῖρα, πῶς βοηθιέμαι ἐγώ· δὲν ξέρω ἐὰν βοηθάη καὶ ἄλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τὸ πᾶν εἶναι νὰ στραφοῦμε στὴν εὐχή, γιὰ νὰ ἑνωθοῦμε μὲ τὸν Θεό. Μόνον αὐτὸ ἀξίζει, γιατὶ ὁ ἄνθρωπος μὲ τὸ Πνεῦμα τοῦ Θεοῦ συγγενεύει, καὶ μὲ τὸ πνεῦμα ἑνώνεται μὲ τὸν Θεὸ κατὰ ἕναν ἱερὸ τρόπο διὰ τῆς προσευχῆς. Ἐπαναλαμβάνουμε δηλαδὴ πολλὲς φορὲς τὸ γλυκύτατο ὄνομα τοῦ Χριστοῦ, ὄχι γιατὶ ὁ Χριστὸς δὲν ἀκούει μὲ μιὰ φορὰ ποὺ θὰ Τὸν ἐπικαλεσθοῦμε, ἀλλὰ γιὰ νὰ ἑνωθῆ ὁ νοῦς μας μαζί Του, ἀφοῦ ὁ Χριστὸς εἶναι γιὰ μᾶς τὸ πᾶν καὶ σ́ Αὐτὸν θὰ καταλήξουμε.
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Ἡ εὐχή: Τὸ φοβερὸ ὅπλο κατὰ τοῦ διαβόλου'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αἰσθάνομαι ἀδύναμη νὰ ἀντιμετωπίσω ὁποιονδήποτε πειρασμὸ καὶ δυσκολία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν λὲς τὴν εὐχή; Ὅπως τὰ καράβια ποὺ κινδυνεύουν ἐκπέμπουν S.Ο.S., ἔτσι κι ἐσὺ νὰ λὲς συνεχῶς:«Κύριε Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, ἐλέησόν με», καὶ θὰ λαμβάνης βοήθεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἐμένα, μιὰ φορά, ὁ πειρασμὸς θὰ μὲ ἔρριχνε στὸν γκρεμό, ἂν δὲν ἔλεγα τὴν εὐχή· ἡ εὐχὴ μὲ ἔσωσε. Ὅταν ἤμουν στὴν Ἱερὰ Μονὴ Στομίου, ἕνα βράδυ εἶχα πάει σὲ μιὰ σπηλιὰ ποὺ βρισκόταν σὲ ἕνα ἐπικίνδυνο καὶ ἀπότομο μέρος. Ἦταν πολὺ μικρή· μόλις ποὺ χωροῦσα καθιστός. Εἶχα βάλει μερικὲς πέτρες ἔξω ἀπὸ τὸ ἄνοιγμά της, γιατὶ κάτω ἦταν γκρεμός. Ὅλη τὴν νύχτα ἔλεγα τὴν εὐχή. Τὰ χαράματα, μέσα στὴν ἡσυχία, ἀκούστηκε ξαφνικὰ ἕνα τρομακτικὸ «κικιρίκου» καὶ ἕνα δυνατὸ χτύπημα φτερῶν ἀκριβῶς δίπλα μου. Ξαφνιάστηκα.«Κύριε Ἰησοῦ Χριστέ», φώναξα καὶ πετάχτηκα ἔξω. Λίγο ἔλειψε νὰ πέσω στὸν γκρεμό. Ἀμέσως ὅμως κατάλαβα ὅτι ἦταν ὁ πειρασμὸς καὶ συνέχισα τὴν εὐχή, ἐνῶ τὰ αὐτιά μου βούιζαν ἀπὸ τὸν θόρυβο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν κανεὶς λέη τὴν εὐχὴ μόνο μὲ τὸ στόμα, χωρὶς νὰ συμμετέχη ὁ νοῦς, αὐτὸ βοηθάει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βοηθάει καὶ αὐτό. Δὲν διώχνει βέβαια τὸν ἐχθρό, ἀλλά, μὲ τὶς ριπὲς ποὺ τοῦ ρίχνει, τὸν καθηλώνει ἐκεῖ ποὺ βρίσκεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἡ εὐχὴ ἔχει μεγάλη δύναμη· εἶναι φοβερὸ ὅπλο κατὰ τοῦ διαβόλου. Εἶναι σὰν νὰ πυροβολῆς τὸν διάβολο μὲ σφαῖρες πνευματικὲς καὶ δὲν μπορεῖ νὰ πλησιάση. Μιὰ φορὰ ἕνας δόκιμος μοναχός[112], ποὺ ἔμενε στὴν Σκήτη τῆς Ἁγίας Ἄννης, ἔλεγε τὴν εὐχή, καὶ ὁ διάβολος τὸν κορόιδευε καὶ τοῦ ἔκανε συνέχεια «μμμ...». Ὕστερα ἄκουσε τὸν διάβολο νὰ φωνάζη: «Στὴν Σκήτη τῆς Γριᾶς[113]δὲν μ’ ἀφήνουν οἱ καλόγεροι νὰ πλησιάσω».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ἔχω πονηροὺς ἢ βλάσφημους λογισμοὺς καὶ προσπαθῶ νὰ λέω τὴν εὐχή, μπορεῖ νὰ ἐπισύρω τὴν ὀργὴ τοῦ Θεοῦ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὄχι. Τὸ ταγκαλάκι ἀπὸ τὴν κακία του σπέρνει πονηροὺς λογισμούς, ἀλλὰ ἐσὺ νὰ τὸ ἀξιοποιῆς γιὰ ἐργάτη στὴν ἀδιάλειπτη προσευχή. Νὰ τοῦ λές: «καλὰ ποὺ μοῦ ἔφερες αὐτοὺς τοὺς λογισμούς, γιατὶ εἶχα ξεχάσει τὸν Θεό», καὶ νὰ λὲς τὴν εὐχή. Τὸ ταγκαλάκι, ὅταν δῆ ὅτι σοῦ κάνει καλό, θὰ ὑποχωρήση μόνο του, γιατὶ δὲν τὸ συμφέρει νὰ γίνεται αὐτὸ ἀφορμή, γιὰ νὰ προσεύχεσαι ἐσύ. Ὅταν ὑποχωρήση καὶ δὲν θὰ σὲ πειράζη πλέον, ἐσὺ θὰ ἔχης ἀποκτήσει τὴν ἀδιάλειπτη προσευχή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως ὁ διάβολος, χωρὶς νὰ τὸ θέλη, κάνει τελικὰ μεγάλο καλό· γι’ αὐτὸ καὶ ὁ Θεὸς τὸν ἀνέχεται. Ὅταν ἤμουν στὴν Σκήτη Ἰβήρων[114], μιὰ νύχτα τὰ ταγκαλάκια πῆγαν νὰ μὲ σκοτώσουν μὲ μιὰ πλάκα! Τὸ ἀπόγευμα εἶχε περάσει ἀπὸ τὸ Καλύβι ἕνας ταλαιπωρημένος ἄνθρωπος. Τοῦ ἔδωσα ὅ,τι χρήματα εἶχα καὶ ἔφυγε. Τὴν νύχτα ἀκούω νὰ χτυποῦν τὴν πόρτα. Σκέφθηκα ὅτι αὐτὸς θὰ νόμισε πὼς ἔχω καὶ ἄλλα χρήματα καὶ ξαναῆρθε. «Ποιός εἶναι;», φωνάζω. Τίποτε. Ἀκούω μετὰ χτυπήματα στὴν ἄλλη πόρτα. Ἀνάβω ἕνα κερί, γιὰ νὰ φέξη. «Ποιός εἶναι;», ξαναφωνάζω. Τίποτε. Σὲ λίγο ἀκούω χτυπήματα πάνω στὸ ταβάνι. «Ἔ, τώρα συνεννοηθήκαμε!», λέω. Καὶ ἀρχίζει ἕνας θόρυβος! Γονάτισα καὶ ἔλεγα συνέχεια τὴν εὐχή. Ξαφνικά, πετᾶνε μιὰ πλάκα ἀπὸ ἐπάνω «μπάμ!». Ἔσπασε τὸ σανίδι ἀπὸ τὸ ταβάνι καὶ βγῆκε ἡ μισὴ πλάκα ἀκριβῶς ἐπάνω ἀπὸ τὸ κεφάλι μου μὲ τὴν μύτη πρὸς τὰ κάτω. «Κατάλαβα, εἶπα, ἔτσι θὰ πᾶμε ὅλη τὴν νύχτα!». Κάναμε ἀγρυπνία μετά. Ἐγὼ μὲ τὴν εὐχὴ καὶ τὰ ταγκαλάκια μὲ τὰ χτυπήματα πάνω στὴν στέγη… Ὄμορφες ἀγρυπνίες ἦταν αὐτές!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εὐχὴ σημαίνει πόλεμος κατὰ τοῦ ταγκαλακιοῦ. Θὰ πολεμάη ἑπομένως καὶ τὸ ταγκαλάκι ἀμυνόμενο. Ἀφοπλισμένα εἶναι τὰ ταγκαλάκια, μόνον ὅταν τὰ πολεμάη κανεὶς μὲ λεβεντιὰ ποὺ ἔχει μέσα ταπεινοφροσύνη, καὶ ὄχι μὲ ἐγωιστικὴ παλληκαριά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Γιὰ τὴν κάθαρση τῆς καρδιᾶς χρειάζεται εὐχὴ καὶ ἀγώνας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς καθαρίζει ἡ καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μὲ τὴν ταπείνωση, τὴν ἀνεξικακία, τὴν θυσία, τὴν ἀνιδιοτέλεια, τὴν ἐξαγόρευση, τὴν ἄσκηση, τὴν προσευχή, καὶ προπαντὸς μὲ τὴν εὐχή, καθαρίζει ἡ καρδιά. Ἡ εὐχὴ πετάει ὅλη τὴν σαβούρα ποὺ ἔχει ἡ καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ, Γέροντα, μόνο μὲ τὴν εὐχὴ νὰ καθαρίση ἡ καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, δὲν γίνεται ἡ κάθαρση μόνο μὲ τὴν εὐχή, ἂν παράλληλα δὲν ὑπάρχη ταπείνωση καὶ δὲν γίνεται ὁ ἀνάλογος ἀγώνας. Ἂν προσεύχεσαι καὶ δὲν προσπαθῆς νὰ τηρήσης καὶ τὰ ἄλλα ποὺ εἶπα, τότε χαμένος κόπος. Ἤ, ἂν τηρῆς ἐκεῖνα καὶ παραμελῆς τὴν προσευχή, πάλι χαμένος κόπος. Ἀγωνίζεσαι καὶ συγχρόνως προσεύχεσαι, ζητᾶς τὴν βοήθεια τοῦ Θεοῦ μὲ τὴν προσευχή, καὶ ἔτσι σιγὰ-σιγὰ καθαρίζει ἡ καρδιά. Ἀγώνας καὶ προσευχὴ πᾶνε μαζί.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Ἡ ἐργασία τῆς εὐχῆς
- type: h2
  initial:
    ru: ''
  text:
    ru: Eὐχὴ ψιθυριστὰ ἢ μὲ τὸν νοῦ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, πῶς εἶναι καλύτερα νὰ λέω τὴν εὐχή; Φωναχτά, ψιθυριστὰ ἢ μὲ τὸν νοῦ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν τὴν λὲς φωναχτά, θὰ κουράζεσαι καὶ γρήγορα θὰ ἀποκάμης. Γι’ αὐτὸ νὰ τὴν λὲς πότε ψιθυριστὰ καὶ πότε μὲ τὸν νοῦ. Ἡ εὐχὴ μὲ τὸν νοῦ εἶναι τὸ καλύτερο· ἐπειδὴ ὅμως δὲν μποροῦν ὅλοι οἱ ἄνθρωποι νὰ τὴν λένε συνέχεια μὲ τὸν νοῦ, βοηθάει νὰ τὴν λέη κανεὶς καὶ ψιθυριστά, σὰν μιὰ προπαίδεια. Μπορεῖς νὰ ἀρχίζης νὰ τὴν λὲς ψιθυριστά, νὰ συνεχίζης μὲ τὸν νοῦ καὶ ὕστερα πάλι ψιθυριστὰ καὶ πάλι μὲ τὸν νοῦ. Νὰ κάνης αὐτὴν τὴν ἐναλλαγή, μέχρι νὰ καταλήξη ἡ εὐχὴ νὰ γίνεται μόνο μὲ τὸν νοῦ, νὰ γίνη δηλαδὴ νοερά, ὅπως καὶ λέγεται «νοερὰ προσευχή». Τότε προσεύχεται κανεὶς μὲ τὸν νοῦ του καὶ ἡ καρδιά του σκιρτᾶ, ἀγάλλεται· φθάνει στὸν θεῖο ἔρωτα, ζῆ οὐράνιες καταστάσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὸ τὸ διάστημα, Γέροντα, κάθε φορὰ ποὺ μπαίνω στὸ κελλί μου, ἔχω μετεωρισμὸ καὶ βλάσφημους λογισμούς. Γιατί μοῦ συμβαίνει αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέχασες, φαίνεται, τὴν εὐχή, καὶ γι’ αὐτὸ ὁ πειρασμὸς ἔστησε τὴν σκηνή του ἔξω ἀπὸ τὸ κελλί σου. Προσπάθησε στὶς κενὲς ὧρες ποὺ ἔχεις στὸ κελλί, νὰ λὲς τὴν εὐχὴ ψιθυριστά, γιὰ νὰ διώχνης τὸν μετεωρισμὸ καὶ τοὺς λογισμοὺς ποὺ ὑποβάλλει ὁ ἐχθρός. Ἡ ψιθυριστὴ εὐχὴ πολὺ βοηθάει στὶς ὧρες τῆς ἐπιθέσεως, γιατὶ ἐκείνη τὴν στιγμὴ χρειάζεται προσοχή, γιὰ νὰ γλυτώση κανεὶς ἀπὸ τὴν ἐχθρικὴ φάλαγγα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συμφέρει, ὅταν μοῦ ἔρχωνται κακοὶ ἢ βλάσφημοι λογισμοί, νὰ τοὺς πολεμῶ μὲ ἀντιρρητικὸ πόλεμο[115];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλύτερα νὰ τοὺς πολεμᾶς μὲ τὴν εὐχὴ παρὰ μὲ ἀντιρρητικὸ πόλεμο. Ὅσο μπορεῖς, νὰ μιλᾶς νοερῶς μὲ τὸν Χριστὸ διὰ τῆς νοερᾶς προσευχῆς, καὶ νὰ μὴ συζητᾶς μὲ τὸν νοῦ σου «τοῦτο» ἢ «ἐκεῖνο». Νὰ καλλιεργήσης τὴν εὐχή, ἡ ὁποία ἀρχικὰ θὰ σὲ ἀπαλλάξη ἀπὸ τοὺς κακοὺς λογισμοὺς καὶ στὸ τέλος θὰ γίνη ἕνα μὲ τὴν ἀναπνοή σου.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὅπου βρεθῆς νὰ λὲς τὴν εὐχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί νὰ προσέξω περισσότερο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ στρωθῆς, νὰ συμμαζευτῆς καί, ὅπου βρεθῆς, νὰ λὲς τὴν εὐχὴ μὲ τὸν νοῦ καὶ μὲ τὴν καρδιά σου, ζητώντας τὸ ἔλεος τοῦ Καλοῦ Θεοῦ γιὰ τὸν ἑαυτό σου, γιὰ ὅλους τοὺς ζῶντες καὶ γιὰ ὅλους τοὺς κεκοιμημένους. Κι ὅταν κουράζεσαι ἀπὸ τὴν εὐχή, νὰ ψάλλης δυνατὰ τὸ ἀργὸ«Κύριε ἐλέησον»ἢ ἕνα τροπάριο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συνήθως, Γέροντα, λέω τὴν εὐχὴ μόνο στὸν ναό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν ὁ μοναχὸς ἀρκῆται στὸ νὰ λέη τὴν εὐχὴ μόνο στὸν ναό, εἶναι σὰν τοὺς κοσμικοὺς ποὺ πηγαίνουν στὴν ἐκκλησία μόνον τὴν Κυριακή. Γι’ αὐτὸ νὰ μὴν περιορίζεσαι νὰ λὲς τὴν εὐχὴ μόνο στὸν ναό· νὰ τὴν λὲς καὶ στὸ διακόνημα καὶ στὸ κελλί, καὶ ὅταν ξαπλώνης γιὰ νὰ ξεκουραστῆς, πάλι νὰ λὲς τὴν εὐχή. Στὸ διακόνημα νὰ προσέχης, νὰ κινῆσαι ἤρεμα καὶ συνετά, γιὰ νὰ μὴ σοῦ κλέβη τὸ ταγκαλάκι τὸν νοῦ ἀπὸ τὴν εὐχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντα νὰ ἔχης στὸ στόμα σου τὸ γλυκύτατο ὄνομα τοῦ Ἰησοῦ, γιὰ νὰ γλυκαίνεται ἡ ψυχή σου. Μεγάλη ὑπόθεση νὰ περνᾶς ὁλόκληρη τὴν ἡμέρα μὲ τὴν εὐχή. Ἀρχίζεις τὴν ἡμέρα σου μὲ τὴν εὐχή, στὴν συνέχεια κάνεις τὴν ἐργασία σου λέγοντας τὴν εὐχή, καὶ ἔτσι ἁγιάζεται ὅ,τι κάνεις, ἁγιάζονται καὶ ὅσοι συμμετέχουν σὲ αὐτό. Ὅταν λ.χ. μαγειρεύης καὶ λὲς τὴν εὐχή, ἁγιάζεται τὸ φαγητὸ ποὺ κάνεις, ἁγιάζονται καὶ ὅσοι τὸ τρῶνε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αὐτὸν τὸν καιρὸ ἀντιμετωπίζω συνέχεια πειρασμούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ ἀξιοποιῆς τὸν κάθε πειρασμὸ μὲ τὸ νὰ καταφεύγης στὸν Χριστὸ ζητώντας τὴν βοήθειά Του, καὶ ἔτσι θὰ σοῦ μένη κέρδος ἡ ἀδιάλειπτη προσευχή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ αὐτενέργητη εὐχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νὰ μᾶς λέγατε κάτι γιὰ τὴν αὐτενέργητη εὐχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ ἄνθρωπος ποὺ ἔχει τὴν αὐτενέργητη εὐχή, δὲν προσπαθεῖ νὰ πῆ τὴν εὐχή, ἀλλά, χωρὶς νὰ καταβάλλη καμμιὰ προσπάθεια, ἡ εὐχὴ λέγεται μέσα του ἀπὸ μόνη της. Ἀκόμη καὶ στὸν ὕπνο λέει τὴν εὐχὴ καί, ὅταν ξυπνάη, συνεχίζει ἡ εὐχή. Γι’ αὐτὸ στὴν Ἁγία Γραφὴ στὸ Ἆσμα Ἀσμάτων λέει:«Ἐγὼ καθεύδω καὶ ἡ καρδία μου ἀγρυπνεῖ»[116].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στὸ Ἅγιον Ὄρος ἦταν ἕνας ἐργάτης ποὺ δούλευε πολύ· δούλευε γιὰ τρεῖς ἐργάτες, καὶ γι’ αὐτὸ οἱ Πατέρες τοῦ ἔδιναν διπλὸ μισθό. Ἐρχόταν καμμιὰ φορὰ καὶ ἐκεῖ στὸ Καλύβι, στὸν «Τίμιο Σταυρό». Μιὰ φορὰ ποὺ ἦρθε τοῦ εἶπα: «Ἐκεῖ ποὺ δουλεύεις, νὰ λὲς τὴν εὐχή, γιὰ νὰ ἁγιάζεται καὶ ἡ δουλειὰ ποὺ κάνεις». Μὲ ἄκουσε μὲ ἁπλότητα καὶ συνήθισε νὰ λέη τὴν εὐχή. Ἔρχεται μιὰ μέρα καὶ μοῦ λέει: «Κοιμᾶμαι, καὶ στὸν ὕπνο μου λέω τὴν εὐχή. Καὶ ὅταν ξυπνάω, συνεχίζει ἡ εὐχή. Νιώθω μέσα μου χαρά». «Ἄρχισε νὰ γλυκοχαράζη», τοῦ λέω. Κοσμικὸς ἄνθρωπος καὶ εἶχε φθάσει σὲ τέτοια κατάσταση!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ ἄνθρωπος ποὺ ἔχει τὴν αὐτενέργητη εὐχή, ἔχει καθαρισθῆ ἀπὸ τὰ πάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔμ, τότε ἔχει φθάσει σὲ καλὴ κατάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς φθάνει, Γέροντα, κανεὶς στὴν αὐτενέργητη εὐχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν ὁ ἄνθρωπος συναισθάνεται τὴν ἁμαρτωλότητά του καὶ ἔχη συνέχεια κατὰ νοῦ τὴν ἀχαριστία του, τότε πιέζεται ἡ ψυχὴ φιλότιμα καὶ ζητάει ταπεινὰ τὸ ἔλεος τοῦ Θεοῦ. Καὶ μετά, χωρὶς νὰ καταβάλλη προσπάθεια, ἀρχίζει ἡ εὐχὴ νὰ λέγεται μόνη της· δουλεύει μέσα του ἡ εὐχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ αἰσθάνεται ὡς ἀνάγκη, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι ὡς ἀνάγκη, ἀλλὰ τοῦ ἔχει γίνει συνήθεια πλέον. Τοῦ ἔχει μείνει ἡ καλὴ συνήθεια τῆς ἀδιαλείπτου προσευχῆς ἀπὸ τὴν ἐργασία ποὺ ἔκανε.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ ἐξωτερικὴ συνήθεια τῆς εὐχῆς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεῖ κάποιος νὰ λέη τὴν εὐχὴ συνέχεια ψιθυριστά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ νὰ τοῦ ἔχη γίνει ἐξωτερικὴ συνήθεια καὶ νὰ τὴν λέη ρυθμικά, ὅπως τὸ ρολόι κάνει τὶκ-τάκ, ἀλλὰ ὁ νοῦς του νὰ μὴν εἶναι στὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὠφελεῖ, Γέροντα, καθόλου αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν κανεὶς ἔχη λίγη ταπείνωση καὶ καταλαβαίνη ὅτι ὁ νοῦς του δὲν εἶναι στὸν Θεὸ καὶ ὅτι τὴν εὐχὴ τὴν λέει μηχανικά, τότε ὠφελεῖται λίγο. Ἂν ὅμως νομίζη ὅτι, ἐπειδὴ λέει τὴν εὐχή, εἶναι προχωρημένος πνευματικά, τότε βλάπτεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἂν κάποιος συνηθίση νὰ λέη συνέχεια τὴν εὐχή, αὐτὸ τὸν βοηθάει στὸν ἀγώνα του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ θέμα εἶναι γιὰ ποιόν λόγο λέει τὴν εὐχή. Ἂν ἔχη γνωρίσει τὸν ἑαυτό του καὶ αἰσθάνεται ὡς ἀνάγκη τὸ ἔλεος τοῦ Θεοῦ καὶ τὸ ζητάη συνέχεια λέγοντας τὴν εὐχή, βοηθιέται. Ἤ, ἂν δὲν ἔχη γνωρίσει τὸν ἑαυτό του, ἀλλὰ καταλαβαίνη ὅτι εἶναι μπλεγμένος στὰ γρανάζια τῶν παθῶν καὶ καταφεύγη στὸν Θεό, καὶ τότε ὁ Θεὸς θὰ τὸν βοηθήση στὸν ἀγώνα του καὶ θὰ τοῦ μείνη καὶ ἡ συνήθεια νὰ λέη τὴν εὐχή. Ἂν ὅμως λέη τὴν εὐχὴ μηχανικά, χωρὶς συναίσθηση τῶν ἁμαρτιῶν του, αὐτὸ δὲν μπορεῖ νὰ βοηθήση στὴν ἀπέκδυση τοῦ παλαιοῦ ἀνθρώπου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ, Γέροντα, νὰ εἶναι καὶ ἐπικίνδυνο νὰ ἐπιδιώκη κανεὶς νὰ συνηθίση νὰ λέη τὴν εὐχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐπικίνδυνο εἶναι, ὅταν κανεὶς ἐγκαταλείπη τὴν παρακολούθηση τοῦ ἑαυτοῦ του καὶ ἀσχολῆται μὲ τὴν εὐχὴ σὰν νὰ εἶναι κάτι τῆς μόδας. Αὐτὸς μπορεῖ νὰ ἀποκτήση τὴν συνήθεια τῆς εὐχῆς, ἀλλὰ μέσα του θὰ ζῆ ὁ παλαιὸς ἄνθρωπος, καὶ ὑπάρχει κίνδυνος νὰ ἐπακολουθήση πλάνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμᾶμαι, ὅταν ἤμουν στὸ Σανατόριο, νοσηλευόταν ἐκεῖ ἕνας μοναχὸς ποὺ εἶχε συνηθίσει νὰ λέη τὴν εὐχή. Ἔκλεινε τὰ μάτια του καὶ ἔλεγε συνέχεια:«Κύριε Ἰησοῦ Χριστέ...»,«Κύριε Ἰησοῦ Χριστέ…». Μία ἐπισκέπτρια ποὺ τὸν εἶδε, ἄρχισε νὰ σταυροκοπιέται. «Ὤ, εἶπε, κοντὰ σὲ ἅγιο βρισκόμαστε!». Μιὰ μέρα ὅμως αὐτὸς ὁ μοναχὸς μοῦ εἶπε: «Τὸν τάδε καὶ τὸν τάδε τοὺς ἤλεγξα. Ἔγραψα γράμμα καὶ στὸν τάδε Δεσπότη καὶ στὸν τάδε, νὰ ἀλλάξουν μυαλά, κι ἐγὼ θὰ εἶμαι στὸ πλευρό τους». «Γιά στάσου, βρὲ ἀδελφέ, τοῦ λέω. Ἀγράμματος εἶσαι, φυματίωση ἔχεις, ποῦ στηρίζεσαι καὶ μιλᾶς ἔτσι;». Καὶ τί μοῦ ἀπαντᾶ! «Ἕνας-δυὸ ἂν ὑπῆρχαν σὰν κι ἐμένα, θὰ εἶχε σωθῆ ὁ κόσμος!». Ἂν δὲν ἦταν καλὰ στὸ μυαλό, θὰ ἦταν δικαιολογημένος· ἀλλὰ τὸ μυαλό του ἦταν ἐντάξει. Ἐπειδὴ ζόριζε τὸν ἑαυτό του καὶ ἔλεγε συνέχεια τὴν εὐχή, τοῦ ἔμεινε ἡ συνήθεια καὶ μετὰ κάθε λογισμὸς ποὺ τοῦ ἐρχόταν νόμιζε ὅτι ἦταν ἀπὸ τὸν Θεό. Ἔτσι ἔφθασε στὸ σημεῖο νὰ πιστεύη ὅτι σὰν αὐτὸν δὲν ὑπῆρχε κανένας ἄλλος στὸν κόσμο!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὸ κράτημα τῆς ἀναπνοῆς γιὰ τὴν συγκέντρωση τοῦ νοῦ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς λέτε τὴν εὐχὴ μὲ τὴν εἰσπνοὴ καὶ τὴν ἐκπνοή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶχα συνηθίσει νὰ λέω τὴν εὐχὴ ὁλόκληρη· μὲ τὴν εἰσπνοὴ ἔλεγα«Κύριε, Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ»καὶ μὲ τὴν ἐκπνοὴ «ἐλέησόν με, τὸν ἁμαρτωλόν». Ὕστερα ὅμως ἀπὸ τὴν ἐγχείρηση στοὺς πνεύμονες, δὲν ἔφθανε ἡ ἀναπνοή μου νὰ τὴν λέω ὁλόκληρη, καὶ ἔλεγα μὲ τὴν εἰσπνοὴ«Κύριε, Ἰησοῦ Χριστὲ»καὶ μὲ τὴν ἐκπνοὴ «ἐλέησόν με».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σὲ τί βοηθάει τὸ κράτημα τῆς ἀναπνοῆς, ὅταν λέμε τὴν εὐχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ κράτημα τῆς ἀναπνοῆς βοηθάει νὰ συγκεντρωθῆ ὁ νοῦς στὴν εὐχή, ὅπως στὴν σκοποβολὴ κρατᾶς κάπως τὴν ἀναπνοή σου, γιὰ νὰ πετύχης τὸν στόχο σου. Αὐτὸ ὅμως πρέπει νὰ γίνεται γιὰ λίγο στὴν ἀρχή, καὶ μόνον ὅταν ὑπάρχη ἀνάγκη· ὅταν δηλαδὴ ὁ νοῦς εἶναι σκορπισμένος ἢ ἔχη πόλεμο λογισμῶν. Τότε ἔχει νόημα νὰ κρατάη κανεὶς λίγο τὴν ἀναπνοή του, ἀλλὰ καὶ πάλι ὄχι συνέχεια, γιατὶ πιέζεται ἡ καρδιὰ καὶ παθαίνει βλάβη. Μερικοὶ σκύβουν τὸ κεφάλι, κρατοῦν τὴν ἀναπνοὴ καὶ πονάει ἡ καρδιὰ ὡς ὄργανο, ὁπότε παθαίνουν ζημιὰ καὶ ἀναγκάζονται νὰ σταματήσουν τὴν εὐχή. Ὁ Θεὸς ἄλλον πόνο ζητάει· ὁ πραγματικὸς καρδιακὸς πόνος ἔρχεται μὲ τὴν ταπεινὴ συντριβὴ τῆς καρδιᾶς καὶ ὄχι μὲ τὸ σαρκικὸ σφίξιμο τῆς καρδιᾶς.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ εὐχὴ νὰ γίνεται μὲ κόπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, προτιμῶ νὰ κάθωμαι στὸ κελλὶ καὶ νὰ λέω τὴν εὐχὴ παρὰ νὰ πηγαίνω στὴν διακονία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βρέ, τί πάθαμε! Νιρβάνα[117]θὰ κάνης; Ὁ Ὀρθόδοξος Μοναχισμὸς δὲν εἶναι νιρβάνα. Κατάλαβες; Ὁ μοναχὸς δὲν εἶναι τεμπέλης, νὰ μὴ δουλεύη καὶ νὰ κάθεται νὰ λέη μόνον τὴν εὐχή. Ἂν θέλη νὰ κάθεται συνέχεια, θὰ εἶναι σὰν αὐτοὺς ποὺ κάνουν γιόγκα γιὰ αὐτοσυγκέντρωση. Ὁ μοναχός, καὶ μάλιστα ὁ νέος, πρέπει νὰ εἶναι σπίρτο, νὰ ἔχη λεβεντιά, νὰ τρέχη σὲ ὅ,τι τοῦ ζητάει ἡ ὑπακοή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ μετάνοιες, Γέροντα, δυσκολεύομαι νὰ κάνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐντάξει τότε· μετάνοιες νὰ μὴν κάνης, διακονία νὰ μὴν κάνης, νὰ κάθεσαι καὶ νὰ λὲς τὴν εὐχή! Τί προκοπὴ θὰ κάνης μετά; Ὁ Ἀββᾶς Ἰσαὰκ λέει ὅτι ἡ προσευχὴ ποὺ γίνεται χωρὶς σωματικὸ κόπο εἶναι ἔκτρωμα· δὲν εἶναι προσευχή[118].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δὲν μπορῶ νὰ σταθῶ πολλὴ ὥρα ὄρθια νὰ κάνω κομποσχοίνι· ὕστερα ἀπὸ λίγο γονατίζω καὶ λέω τὴν εὐχὴ γονατιστή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάνε πρῶτα τὸ δύσκολο καί, ὅταν κουρασθῆς, κάνε τὸ πιὸ εὔκολο. Ἂν δὲν μπορῆς νὰ σταθῆς ὄρθια, γονάτισε. Ἂν δὲν μπορῆς γονατιστή, κάθησε. Κι ἂν δὲν μπορῆς οὔτε καθιστή, ξάπλωσε καὶ λέγε τὴν εὐχή. Ἀρκεῖ ὁ νοῦς σου νὰ εἶναι στὸν Θεό. Αὐτὸ τὸ λέει καὶ ὁ Ἀββᾶς Ἰσαάκ[119].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί οἱ Πατέρες λένε νὰ κάθεσαι σὲ σκαμνί, ὅταν λὲς τὴν εὐχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατὶ ἐννοεῖται ὅτι ἔχεις κάνει τὸν κανόνα σου, τὶς μετάνοιές σου κ.λπ., καί, ἐπειδὴ κουράστηκες, κάθεσαι λίγο καὶ λὲς τὴν εὐχή, γιὰ νὰ μπορῆς νὰ προσευχηθῆς καὶ στὴν συνέχεια. Ὕστερα, στὶς Ἀκολουθίες καὶ στὸ διακόνημά σου θὰ εἶσαι γιὰ ἀρκετὸ διάστημα ὄρθια, πράγμα ποὺ κουράζει. Ἂν στέκεσαι πάλι ὄρθια στὸ κελλί, γιὰ νὰ προσευχηθῆς, θὰ ἀποκάμης. Γι’ αὐτὸ κάθεσαι λίγο καὶ λὲς τὴν εὐχή. Οἱ Πατέρες ὅμως δὲν ἐννοοῦν ὅτι, γιὰ νὰ ποῦμε τὴν εὐχή, πρέπει νὰ καθώμαστε. Τὸ νὰ καθήσης, γιὰ νὰ πῆς τὴν εὐχή, ἐνῶ μπορεῖς νὰ σταθῆς ὄρθιος, δὲν τὸ θεωρῶ σωστό· εἶναι τρα-λα-λά, ἄσχετα ἂν νομίζης ὅτι αἰσθάνεσαι κάποια γλυκύτητα. Ὁ Γερο-Ἀρσένιος ὁ Σπηλαιώτης[120]ἔλεγε: «Ὅταν λέω τὴν εὐχὴ ὄρθιος, πολλὴ εὐωδία αἰσθάνομαι. Ὅταν λέω τὴν εὐχὴ καθιστός, λίγη εὐωδία».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν κάνω μετάνοιες ἢ κάνω ὄρθια κομποσχοίνι, συγκεντρώνεται πιὸ εὔκολα ὁ νοῦς μου· δηλαδὴ ὁ κόπος μὲ συγκεντρώνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πηγαίνει ὁ νοῦς στὴν ἐργασία ποὺ κάνεις. Ὅπως, ὅταν πονᾶς, πάει ἐκεῖ ὁ νοῦς, γιατὶ ὁ πόνος τραβᾶ τὸν νοῦ, ἔτσι καὶ ὅταν κάνης μετάνοιες, πάει ὁ νοῦς ἐκεῖ. Ἀλλὰ καὶ πάλι, ἂν ὁ νοῦς σου ἦταν καθαρὰ στὸν Χριστό, δὲν θὰ θυμόσουν οὔτε πόσες μετάνοιες ἔκανες.
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Μετάνοια: ὁ πιὸ σίγουρος δρόμος γιὰ τὴν εὐχὴ'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Ἅγιος Ἰγνάτιος Μπριαντσιανίνωφ γράφει νὰ λέμε τὴν εὐχὴ ἀργὰ καὶ νὰ κάνουμε ἀργὰ τὶς μετάνοιες[121].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάθε Ἅγιος λέει γιὰ τὴν εὐχὴ τὸν τρόπο μὲ τὸν ὁποῖο βοηθήθηκε ὁ ἴδιος. Γι’ αὐτὸ πολλὲς φορὲς παρεξηγεῖται καὶ ἡ νοερὰ προσευχή. Οἱ Νηπτικοὶ Πατέρες[122], μὲ τὰ βιώματα ποὺ εἶχαν, βρίσκονταν σὲ συνεχῆ ἐπαφὴ μὲ τὸν Θεὸ καὶ μποροῦσαν, ἀκολουθώντας τὸν τρόπο ποὺ τοὺς βοηθοῦσε περισσότερο, νὰ προσεύχωνται σωστά. Ἂν ὅμως ἐγὼ προσπαθῶ νὰ ἐφαρμόσω αὐτὰ ποὺ γράφουν οἱ Πατέρες, π.χ. κλίση τῆς κεφαλῆς στὸ στῆθος, κράτημα τῆς ἀναπνοῆς κ.λπ., μόνον καὶ μόνο γιὰ νὰ νιώσω ἡδονή, ἀγαλλίαση, ἢ τὸ κάνω ἀπὸ ὑπερηφάνεια, γιὰ νὰ γίνω Νηπτικὸς Πατέρας, τότε δὲν μπορῶ νὰ κάνω προκοπή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βοηθοῦν τὰ διάφορα βιβλία ποὺ ἀναφέρονται στὴν νοερὰ προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Βοηθοῦν ὅσους ἔχουν ταπείνωση. Ὅσους ὅμως ἔχουν ὑπερηφάνεια καὶ βάζουν στόχο σὲ τόσο διάστημα νὰ φθάσουν σὲ μέτρα πνευματικά, νὰ γίνουν Νηπτικοὶ Πατέρες, δὲν τοὺς βοηθοῦν. Ἦρθαν μιὰ μέρα κάποιοι στὸ Καλύβι καὶ μοῦ λένε: «Ἤρθαμε νὰ μᾶς διδάξης τὴν εὐχή, γιατὶ εἶσαι ἀπὸ αὐτοὺς ποὺ ἔχουν τὴν νοερὰ προσευχή». «Νὰ μὲ σβήσετε ἐμένα ἀπὸ τὸν κατάλογό σας, τοὺς εἶπα. Ἐγὼ τίποτα ἄλλο δὲν κάνω, παρὰ μόνο ζητῶ τὸ ἔλεος τοῦ Θεοῦ».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικὰ πρακτικὰ μέσα ποὺ ἀναφέρουν οἱ Πατέρες γιὰ τὴν εὐχὴ δὲν βοηθοῦν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅλα αὐτὰ εἶναι βοηθητικὰ μέσα[123]γιὰ τὴν συγκέντρωση τοῦ νοῦ, καὶ βοηθοῦν, μόνον ὅταν ὁ ἄνθρωπος βάλη μπροστὰ τὴν ταπείνωση, τὴν μετάνοια, τὴν συντριβή. Ἂν ὅμως πάρω ἕνα σκαμνί, γείρω ἔτσι τὸ κεφάλι στὸ στῆθος καὶ πῶ ὅτι θὰ ἀρχίσω νὰ λέω τὴν εὐχὴ τόσες φορὲς ὅσες ἀναφέρειὁ Προσκυνητής[124], χωρὶς νὰ ἔχω ἐργασθῆ στὴν μετάνοια, τότε θὰ μείνω μόνο σ’ αὐτὰ τὰ ἐξωτερικὰ καὶ ἡ ἐργασία ποὺ θὰ κάνω θὰ εἶναι ἐξωτερική. Τὸ πολὺ-πολὺ νὰ ἀποκτήσω μιὰ ἐξωτερικὴ συνήθεια νὰ λέω τὴν εὐχή. Ἐνῶ, ἂν καλλιεργήσω πρῶτα τὴν ταπείνωση, τὴν μετάνοια, καὶ πάρω μετὰ μερικὰ ἀπὸ αὐτὰ ποὺ ἀναφέρουν οἱ Πατέρες, γιὰ νὰ τὰ χρησιμοποιήσω ὡς βοηθητικά, τότε θὰ βοηθηθῶ. Ὅποιος ξεκινάει ἔτσι γιὰ τὴν ἐργασία τῆς εὐχῆς, δὲν μπορεῖ νὰ πλανηθῆ, ἐνῶ ὁ ἄλλος τρόπος μπορεῖ νὰ ὁδηγήση καὶ σὲ πλάνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ, Γέροντα, νὰ ἀποκτήση κανεὶς τὴν εὐχή, χωρὶς νὰ διαβάση Νηπτικοὺς Πατέρες[125]καὶ χωρὶς νὰ ἀκολουθήση κάποιες μεθόδους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ βέβαια μπορεῖ, ἂν ἁπλὰ καὶ ταπεινὰ λέη τὴν εὐχή. Γιατὶ μερικοὶ σκαλώνουν στὶς μεθόδους καὶ μένουν ἐκεῖ· δὲν προχωροῦν παραπέρα. Κάνουν δηλαδὴ τὴν μέθοδο σκοπό, ἐνῶ ἡ μέθοδος εἶναι ἁπλῶς βοηθητικὸ μέσο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –Γέροντα, νὰ μᾶς λέγατε πῶς εἶναι τὸ βύθισμα στὴν εὐχή[126];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ γλυκὸ βύθισμα; Δὲν ξεκινάει κανεὶς γι’ αὐτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, Γέροντα, δὲν ξεκινάει γιὰ νὰ νιώση αὐτό, ἀλλὰ ποιός ἀγώνας πρέπει νὰ προηγηθῆ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βασικὰ νὰ μὴν ὑπάρχη ἰδιοτέλεια, νὰ ὑπάρχη ἀρχοντιά, θυσία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὁ πιὸ σίγουρος δρόμος εἶναι νὰ καλλιεργήση κανεὶς τὴν εὐχὴ μὲ τὸν ἀρχοντικὸ τρόπο. Νὰ σκέφτεται δηλαδὴ τὶς μεγάλες εὐεργεσίες τοῦ Θεοῦ καὶ τὴν δική του μεγάλη ἀχαριστία ἀπέναντι στὸν Θεό. Τότε πιέζεται μόνη της ἡ ψυχὴ ταπεινὰ ἀπὸ φιλότιμο καὶ ζητάει τὸ ἔλεος τοῦ Θεοῦ μὲ πόνο. Ἔτσι αὐξάνει συνεχῶς ἡ ἀνάγκη γιὰ τὸ ἔλεος τοῦ Θεοῦ, καὶ ἡ εὐχὴ γίνεται καρδιακὴ καὶ φέρνει σιγὰ-σιγὰ στὴν ψυχὴ τὴν γλυκύτητα τῆς θείας παρηγοριᾶς στὴν ἀρχή, καὶ ἀργότερα τὴν θεία ἀγαλλίαση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Ἡ ἐργασία τοῦ νοῦ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ὁ Ἅγιος Γρηγόριος ὁ Παλαμᾶς γράφει ὅτι οἱ ἀρετές, ἐπειδὴ συγγενεύουν μὲ τὶς ἀρετὲς τοῦ Θεοῦ, κάνουν τὸν ἄνθρωπο κατάλληλο νὰ ὑποδεχθῆ τὸν Θεό, ἀλλὰ δὲν τὸν ἑνώνουν μαζί Του. Ἡ προσευχὴ ὅμως πραγματοποιεῖ τὴν ἕνωση μὲ τὸν Θεό[127]. Τί ἐννοεῖ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐδῶ ὁ Ἅγιος ἐννοεῖ τὴν καθαρὰ προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί εἶναι καθαρὰ προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν ὑπάρχη πνευματικὴ ἀρχοντιά, θυσία, συγγενεύει ὁ ἄνθρωπος μὲ τὸν Θεό, ἔχει ἐπαφὴ μαζί Του καὶ ὁ νοῦς του εἶναι συνέχεια στὸν Θεό. Τότε, καὶ νὰ μὴν προσεύχεται, προσεύχεται. Ὅλη ἡ ζωή του εἶναι προσευχή. Δὲν σκέφτεται τίποτε ἄλλο· ὅ,τι καὶ νὰ κάνη, ὁ νοῦς του εἶναι συνέχεια ἐκεῖ, στὸν Θεό. Ὅπως ἕνα παιδάκι ὀρφανὸ ποὺ ἔχει μόνον τὴν μάνα του καὶ οἱ περιστάσεις τὸ ἔφεραν νὰ βρεθῆ γιὰ ἕνα διάστημα μακριά της, ὅ,τι κι ἂν κάνη, ὅπου κι ἂν βρεθῆ, ἔχει συνέχεια τὸν νοῦ του στὴν μάνα του, ἔτσι καὶ ὁ ἄνθρωπος ποὺ εἶναι ἐξόριστος ἐδῶ πάνω στὴν γῆ, μακριὰ ἀπὸ τὸν Θεὸ Πατέρα του, ὅταν φθάση σ́ αὐτὴν τὴν κατάσταση, ἔχει συνέχεια τὸν νοῦ του στὸν Θεό, στὸν Πατέρα του. Αὐτὸ εἶναι καθαρὰ προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς καθαρίζει ὁ νοῦς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ νοῦς, γιὰ νὰ καθαρίση, πρέπει νὰ εἶναι συνέχεια στὸν Θεό, νὰ ἑνωθῆ μὲ τὸν Θεό. Γιὰ νὰ ἑνωθῆ μὲ τὸν Θεό, χρειάζεται προσοχή, παρακολούθηση τοῦ ἑαυτοῦ μας, προσευχὴ ἀδιάλειπτη. Ὅταν ἑνωθῆ ὁ νοῦς μὲ τὸν Θεό, τότε ὁ ἄνθρωπος δὲν σκέφτεται τίποτε ἄλλο ἐκτὸς ἀπὸ τὸν Θεὸ καὶ εἶναι καθαρὸς ὁ νοῦς, γιατὶ δὲν μπαίνουν παράσιτα μέσα. Ἔτσι, ὁ ἄνθρωπος περνᾶ ἀπὸ τὸ«κατ’ εἰκόνα»καὶ γίνεται«καθ’ ὁμοίωσιν»[128]. Γιατὶ ἀλλιῶς εἶναι«κατ’ εἰκόνα»μόνον. Ὁ νοῦς καλὸς εἶναι, ἀλλά, ὅταν τὸν νοῦ τὸν ἔχουμε σὲ ἄλλη συχνότητα...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ἡ μεγάλη δύναμη τοῦ νοῦ, ὁ ὁποῖος τρέχει μὲ ταχύτητα μεγαλύτερη τοῦ φωτός, πρέπει νὰ ἀξιοποιηθῆ καὶ νὰ κατευθυνθῆ ὁλόκληρη πρὸς τὸν Θεό, τὸν Δημιουργὸ τοῦ φωτός. Ἐὰν αὐτὴ ἡ δύναμη εἶναι σκορπισμένη, πῶς εἶναι δυνατὸν νὰ ἔχη δύναμη ὁ νοῦς; Καί, ἐὰν δὲν ἔχη δύναμη ὁ νοῦς τοῦ ἀνθρώπου, τότε ὁ ἄνθρωπος μένει μόνο μὲ τὸ μυαλό· κάνει ἐργασία ἐγκεφαλικὴ καὶ ἀπὸ εἰκόνα Θεοῦ καταντάει ἐγκέφαλος, μηχανή. Σὲ μερικοὺς πάλι συμβαίνει τὸ ἑξῆς: Ἐπειδὴ δὲν ἀξιοποιοῦν τὴν δύναμη αὐτὴν τοῦ νοῦ εἰς τὰ ἄνω, τοὺς τὴν ἀξιοποιεῖ, ἢ μᾶλλον τὴν ἐκμεταλλεύεται, ὁ ἐχθρὸς πρὸς τὰ κάτω· στὴν ἀρχὴ στὰ γήινα καὶ μετὰ πιὸ κάτω, στὴν ἁμαρτία, γιὰ νὰ τοὺς ρίξη στὴν κόλαση. Ὅταν ὅμως κατορθώση ὁ νοῦς νὰ ἀνέβη ψηλά, τότε καὶ ὅλα τὰ πράγματα τὰ βλέπει ἀπὸ ψηλὰ μὲ τὰ μάτια τῆς ψυχῆς, μὲ τὸ θεϊκὸ μάτι, τὸν θεῖο φωτισμό. Ὅλα αὐτὰ δυστυχῶς μόνον θεωρητικὰ τὰ καταλαβαίνω, καὶ θὰ προσπαθήσω νὰ ἀγωνισθῶ πρὸς αὐτὴν τὴν κατεύθυνση, ἔστω καὶ ἐὰν μὲ βρῆ ὁ θάνατος ἐν ὁδοιπορίᾳ.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἐγρήγορση πνευματικὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί εἶναι ἡ νήψη[129];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νήψη εἶναι ἡ προσοχὴ στοὺς λογισμούς, στὶς πράξεις, στὶς κινήσεις. Ὅταν τὴν μία ἡμέρα προσέχης, παρακολουθῆς τὸν ἑαυτό σου καὶ ἐξετάζης τὴν συμπεριφορά σου, τὴν ἑπόμενη ἡμέρα θὰ εἶσαι προσεκτικώτερη κ.ο.κ. Ὅλη ἡ βάση εἶναι ἡ προσοχή. Γι’ αὐτό, βλέπεις, οἱ Ἅγιοι Πατέρες πόσο πρόσεχαν! Γιατί λέγονται Νηπτικοὶ Πατέρες; «Νηπτικοὶ Πατέρες» σημαίνει προσεκτικοὶ Πατέρες. Πρόσεχαν τὸν ἑαυτό τους καὶ ἔκαναν ἐσωτερικὴ ἐργασία. Παρακολουθοῦσαν τοὺς λογισμούς τους καὶ βρίσκονταν σὲ συνεχῆ ἐγρήγορση πνευματική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Ἀββᾶς Ἰσαὰκ λέει:«Ἡ ἐργασία τῆς ἡμέρας πρέπει νὰ εἶναι σύμφωνη μὲ τὴν ἐργασία τῆς νύχτας»[130]. Τί ἐννοεῖ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐννοεῖ ὅτι, ὅπως τὴν νύχτα προσεύχεται κανεὶς καὶ ὁ νοῦς του εἶναι στὸν Θεό, ἔτσι καὶ τὴν ἡμέρα νὰ προσπαθῆ νὰ μὴν ξεχνιέται καὶ φεύγη ὁ νοῦς του ἀπὸ τὸν Θεό. Ἂν δὲν προσέχης μέσα στὴν ἡμέρα, μαζεύεις σαβούρα, καὶ ἄντε μετὰ νὰ τὴν πετάξης! Εὔκολο εἶναι; Μία ἀπροσεξία νὰ κάνης, πόσο δυσκολεύεσαι τὴν ὥρα τῆς προσευχῆς, ὅταν πᾶς νὰ συγκεντρωθῆς!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἡ προσοχὴ καὶ ἡ παρακολούθηση ἔχουν μεγάλη σημασία. Μπορεῖ κανεὶς νὰ προσεύχεται ὧρες, ἀλλά, ἂν δὲν προσέχη καὶ δὲν παρακολουθῆ τὸν ἑαυτό του, δὲν κάνει τίποτε. Ὅταν ὅμως ἡ προσευχὴ συνοδεύεται μὲ τὴν παρακολούθηση, τότε χτυπᾶμε πρὸς ἐκείνη τὴν κατεύθυνση ποὺ μᾶς χτυπάει περισσότερο ὁ ἐχθρός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, ὁ νοῦς μου εἶναι μονίμως σκορπισμένος καὶ δὲν μπορῶ νὰ τὸν μαζέψω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸν ἔχεις ἀφήσει ἀχαλίνωτο ὅλα τὰ χρόνια καὶ τώρα δὲν μπορεῖς νὰ τὸν κυβερνήσης. Χρειάζεται προσοχή, διότι ὁ νοῦς τὴν μιὰ στιγμὴ μπορεῖ νὰ σὲ πάη στὸν Παράδεισο καὶ τὴν ἄλλη, ἐὰν δὲν προσέξης, νὰ σὲ πάη στὴν κόλαση. Ὅσο μπορεῖς, νὰ προσπαθῆς νὰ συγκεντρώνης τὸν νοῦ σου σὲ σκέψεις καλές, ἅγιες, ποὺ ἁγιάζουν τὸν ἄνθρωπο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὸ συμμάζεμα τοῦ νοῦ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ νοῦς μου, Γέροντα, τρέχει ἐδῶ καὶ ἐκεῖ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν ἤμουν μικρός, τὰ παιδιὰ ἔπιαναν σπουργίτια, τὰ ἔδεναν ἀπὸ τὸ πόδι μὲ μιὰ κλωστὴ καὶ αὐτὸ τὸ εἶχαν σὰν παιχνίδι. Τὰ ἄφηναν λίγο καὶ πετοῦσαν – τὰ καημένα νόμιζαν ὅτι ἦταν ἐλεύθερα – καὶ ὕστερα μάζευαν τὸ κουβάρι καὶ τὰ σπουργίτια ἔρχονταν πίσω. Καὶ ὁ δικός σου νοῦς μπορεῖ νὰ τρέχη, ἀλλά, ἂν τὸ κουβάρι τὸ κρατᾶ ὁ Χριστός, καὶ νὰ πετάξη λίγο, ποῦ θὰ πάη; θὰ μαζευτῆ πίσω στὸν Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μόλις συγκεντρωθῶ στὴν εὐχή, σὲ κλάσματα δευτερολέπτου, ὁ νοῦς μου μπορεῖ νὰ φθάση μέχρι τὴν Ἀμερική. Πῶς γίνεται αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πόσα χρήματα θέλεις γιὰ νὰ πᾶς ἀπὸ ἐδῶ στὴν Ἀμερικὴ καὶ νὰ γυρίσης; Ἔχεις νὰ πληρώσης τὰ ναῦλα; Καὶ βλέπεις, τώρα μὲ τὸν νοῦ φθάνεις ἀμέσως ἐκεῖ! Κοίταξε νὰ συμμαζέψης τὸν νοῦ σου, γιατὶ στὸ τέλος θὰ χρεωκοπήσης καὶ θὰ μοῦ «κλείσης» τὸν συνεταιρισμό[131], ἐπειδὴ δὲν θὰ ἔχω νὰ πληρώσω τὰ χρέη σου. Νὰ λὲς τὴν εὐχὴ μὲ τὴν καρδιά, ταπεινά, γιὰ νὰ μὴ σὲ κλέβη τὸ ταγκαλάκι μὲ τὴν συζήτηση τῶν λογισμῶν. Πολὺ θὰ σὲ βοηθήση σ́ αὐτὴν τὴν προσπάθεια νὰ σκέφτεσαι τὸν θάνατο. Ἂν σκεφτῆς: «Ὁ Θεὸς μοῦ ἔδωσε διορία αὐτὴν τὴν ὥρα, γιὰ νὰ προετοιμασθῶ καὶ νὰ μὲ πάρη», δὲν μπορεῖ νὰ σταθῆ κανένας λογισμός. Ὅταν μπαίνη ὁ θάνατος στὴν μέση, ὁ νοῦς κάθεται στὴν μέση καὶ δὲν φεύγει στὶς ἄκρες καὶ στὴν ἄκρη τοῦ κόσμου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στενοχωριέμαι ποὺ φεύγει ὁ νοῦς μου τὴν ὥρα τῆς προσευχῆς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἐγώ, ὅταν φεύγη ὁ νοῦς μου σὲ διάφορα θέματα – ἂν καὶ θέλω νὰ εἶναι πάντοτε κοντὰ στὸν Θεό –, λέω: «Θεέ μου, τέτοιος νοῦς τί δουλειὰ ἔχει κοντά Σου; Εἶναι ἀναίδεια νὰ θέλω νὰ βρίσκεται κοντά Σου!». Μὲ ἕναν ταπεινὸ λογισμὸ ἔρχεται ἡ Χάρις τοῦ Θεοῦ καὶ ἐπανέρχεται ὁ νοῦς στὸν Θεό. Κι ἐσὺ νὰ λές: «Καλὰ κάνεις, Θεέ μου, ποὺ δὲν μὲ βοηθᾶς νὰ συγκεντρωθῆ ὁ νοῦς μου κοντά Σου, γιατὶ εἶμαι ἐλεεινή». Ὅταν τὸ πιστέψης αὐτό, ὁ Θεὸς θὰ σὲ βοηθήση ἀμέσως νὰ συγκεντρωθῆς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλὲς φορές, Γέροντα, ὅταν κάνω κομποσχοίνι, ἐνῶ στὴν ἀρχὴ εἶμαι συγκεντρωμένη, ἔπειτα φεύγει ὁ νοῦς μου. Κάνω μιὰ προσπάθεια, συγκεντρώνομαι, ἀλλὰ πάλι φεύγει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκέψου, τί κρίμα εἶναι νὰ φθάνη στὸν θρόνο τοῦ Θεοῦ ἡ μισὴ προσευχὴ ἢ τὸ ἕνα τρίτο, καὶ ἡ ἄλλη νὰ χάνεται στὸν δρόμο! Ἐπιμονὴ καὶ ὑπομονὴ χρειάζεται. Ὅταν φεύγη ὁ νοῦς, νὰ τὸν ἐπαναφέρης. Πάλι ἔφυγε; Πάλι νὰ τὸν ἐπαναφέρης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί ὅμως, Γέροντα, δὲν μπορῶ εὔκολα νὰ συγκεντρωθῶ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατὶ εἶσαι ἀκόμη στὸ πρῶτο στάδιο τοῦ ἀγῶνος καί, ἂν γινόταν αὐτό, θὰ ἦταν ἀφύσικο· θὰ ἦταν σὰν νὰ εἶχε γεννηθῆ ἕνα παιδὶ μὲ δόντια. Ὁ νοῦς μοιάζει μὲ ἕνα μικρὸ πουλαράκι, τὸ ὁποῖο στὴν ἀρχὴ τρέχει γιὰ λίγο πίσω ἀπὸ τὴν μάνα του, ἀλλὰ ἀμέσως ξεχνιέται καὶ τρέχει μακριά· παίζει, τρώει χορταράκια, δοκιμάζει ὅ,τι βρῆ, ὥσπου σὲ μιὰ στιγμὴ συνέρχεται καὶ βλέπει ὅτι ἔχασε τὴν μάνα του. Τρέχει τότε νὰ τὴν βρῆ, ἀλλὰ σὲ λίγο καὶ πάλι ξεχνιέται. Ὅταν μεγαλώση λίγο, τὸ πιάνουν καὶ τὸ δένουν πίσω ἀπὸ τὴν μάνα του, καὶ ἔτσι παραμένει κοντά της. Θέλω νὰ πῶ ὅτι καὶ ὁ νοῦς στὶς ἀρχὲς εἶναι φυσιολογικὸ νὰ φεύγη τὴν ὥρα τῆς προσευχῆς. Μὲ τὴν ἐπιμονὴ ὅμως θὰ δεθῆ ἀπὸ τὸν Θεὸ καὶ δὲν θὰ Τὸν ἀποχωρίζεται· θὰ θέλη νὰ προσεύχεται συνεχῶς. Ὕστερα ἀπὸ αὐτό, ἔρχεται μία τελεία νέκρα· κανένας λογισμὸς δὲν πλησιάζει τὴν ὥρα τῆς προσευχῆς καὶ ὁ νοῦς μένει ἄδειος ἀπὸ λογισμούς[132]. Μετὰ καὶ ἀπὸ αὐτὸ τὸ στάδιο ἔρχεται ἡ θεωρία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Νὰ δώσουμε ἐργασία στὸν νοῦ μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἐπειδὴ ἀκόμη ζῶ στὸν κόσμο, ἂν εἶναι εὐλογημένο, νὰ μοῦ πῆτε πῶς θὰ προφυλαχθῶ ἀπὸ τὸν περισπασμὸ τοῦ κόσμου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σχετικὰ μὲ αὐτὸ τὸ θέμα θὰ βρῆς στὸν Ἀββᾶ Ἰσαάκ. Μελέτησε τὶς τέσσερις πρῶτες σειρὲς τοῦ Α´ Κεφαλαίου, μὲ τὶς ὁποῖες καὶ νὰ ἀσχοληθῆς. Λέει ὁ Ἅγιος:«Ὁ φόβος τοῦ Θεοῦ εἶναι ἀρχὴ τῆς ἀρετῆς, ὁ ὁποῖος φόβος, ὡς λέγουσι, γεννᾶται ἀπὸ τὴν πίστιν καὶ σπείρεται εἰς τὴν καρδίαν τοῦ ἀνθρώπου, ὅταν ὁ νοῦς αὐτοῦ, ἀφοῦ ἀποχωρισθῇ ἀπὸ τὸν περισπασμὸν τοῦ κόσμου καὶ συνάξῃ τοὺς συλλογισμοὺς αὐτοῦ τοὺς περιπλανωμένους τῇδε κἀκεῖσε, καταγίνηται εἰς τὴν μελέτην τῆς μελλούσης ἀποκαταστάσεως τῆς ψυχῆς»[133].Εἶναι ἀλήθεια ὅτι γιὰ τὴν πνευματικὴ αὐτὴν ἐργασία χρειάζονται καὶ οἱ κατάλληλες προϋποθέσεις, τὶς ὁποῖες δὲν ἔχεις πρὸς τὸ παρόν. Μία ἀνάλογη ὅμως πνευματικὴ ἐργασία, ποὺ μπορεῖς νὰ κάνης τώρα ποὺ βρίσκεσαι ἀκόμη στὸν κόσμο, εἶναι ἡ ἑξῆς: Ὅταν ὁ νοῦς σου εἶναι ἀργὸς καὶ δὲν λέη τὴν εὐχὴ ἢ ὅταν θέλης νὰ ξεκουρασθῆς λίγο ἀπὸ αὐτὴ – διότι ἡ εὐχὴ εἶναι λιγάκι κουραστικὴ στὴν ἀρχή, ἐπειδὴ ὑπάρχουν ἀκόμη πάθη μέσα μας –, νὰ προσπαθῆς νὰ δίνης ἐργασία στὸν νοῦ σου, γιὰ νὰ μὴ βρίσκη εὐκαιρία ὁ διάβολος νὰ σπέρνη τὰ δικά του. Μία ἐργασία ποὺ μπορεῖ νὰ δώση κανεὶς στὸν νοῦ του, γιὰ νὰ τὸν συμμαζέψη, εἶναι ἡ μνήμη τοῦ θανάτου. Ἀλλά, ἐπειδὴ ἐσεῖς οἱ γυναῖκες ἀφορμὴ θέλετε, γιὰ νὰ σᾶς πιάση ἡ ἀπελπισία, ἡ λεγόμενη κακομοιριά, γι’ αὐτὸ καλύτερα εἶναι νὰ ζῆς συνέχεια τὰ γεγονότα τῆς Καινῆς Διαθήκης. Νὰ ἀρχίζης ἀπὸ τὸν Εὐαγγελισμὸ καὶ νὰ τελειώνης στὴν Σταύρωση, καὶ ὁ νοῦς σου νὰ περιστρέφεται γύρω ἀπὸ αὐτά. Ὅταν κατορθώσης ὁ νοῦς σου νὰ περιστρέφεται μόνο γύρω ἀπὸ αὐτὰ τὰ θεῖα γεγονότα, τότε θὰ σοῦ γίνη ἡ ἐσωτερικὴ ἀλλοίωση καὶ αὐτὸ θὰ εἶναι ἡ ἀνάστασή σου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μὲ συγκινεῖ τὸ ἀπόστιχο:«Νυγείσης σου τῆς πλευρᾶς, Ζωοδότα, κρουνοὺς ἀφέσεως πᾶσιν ἐξέβλυσας ζωῆς καὶ σωτηρίας»[134].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι νὰ μὴ σὲ συγκινῆ; Ὅταν ὁ νοῦς εἶναι στὸν Σταυρό, στὴν«τετρωμένην πλευρὰν»[135]τοῦ Χριστοῦ, στὰ καρφιά, στὴν χολή, στὸ ὄξος, καὶ γενικὰ σὲ ὅσα ἔπαθε ὁ Χριστὸς γιὰ μᾶς, καρφώνεται ἐκεῖ καὶ δὲν γυρίζει. Τότε ἡ ψυχὴ προσεύχεται ἀπερίσπαστη στὸν Ἐσταυρωμένο Χριστὸ γιὰ τὸν ἑαυτό της καὶ γιὰ ὅλες τὶς ψυχὲς ζώντων καὶ κεκοιμημένων, γιὰ νὰ τὶς ἐλεήση ὁ Χριστός, ὁ Ὁποῖος πληγώθηκε γιὰ ὅλους μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὁ νοῦς εἶναι ἕνα ἀναρχικὸ παιδί, ἕνα ἄτακτο καὶ ἀδέσποτο παιδί, ποὺ θέλει νὰ γυρίζη συνεχῶς ἐδῶ καὶ ἐκεῖ καὶ νὰ ἀλητεύη. Ἀπὸ αὐτὸν ὅμως ἐξαρτᾶται ἡ ζωὴ καὶ ἡ σωτηρία μας. Ἂν τὸν συμμαζέψουμε καὶ τὸν παιδαγωγήσουμε, ἡσυχάζει, γίνεται καλὸ παιδὶ καὶ νοικοκυρεύεται. Γι’ αὐτό, ὅσο μπορεῖτε, νὰ μὴν ἀφήνετε τὸν νοῦ σας νὰ γυρίζη. Νὰ τὸν ἐκπαιδεύσετε πνευματικά, νὰ τὸν μάθετε νὰ συχνάζη στὸ σπίτι του, στὸν Παράδεισο, κοντὰ στὸν Πατέρα του, τὸν Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ αἴσθηση τῆς παρουσίας τοῦ Θεοῦ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν κάνω μιὰ διανοητικὴ ἐργασία, δὲν μπορῶ νὰ λέω τὴν εὐχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν τὴν ὥρα ποὺ ἐργάζεσαι ἔχης τὸν νοῦ σου στὸν Θεό, εἶναι σὰν νὰ λὲς τὴν εὐχή. Γιατί, καὶ ἂν λὲς τὴν εὐχὴ καὶ ὁ νοῦς σου δὲν εἶναι στὸν Θεό, τί ὠφελεῖ; Καὶ ὅταν κουράζεται κανεὶς στὴν εὐχή, ἂν φέρη στὸν νοῦ του τὸν Χριστὸ ἢ τὴν Παναγία, πάλι εὐχὴ εἶναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεῖ κανεὶς νὰ διατηρῆ μέσα του τὴν μνήμη τοῦ Θεοῦ, χωρὶς νὰ λέη τὴν εὐχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ἂν λέη μὲ τὸν λογισμό του: «Πόσο μακριὰ βρίσκομαι ἀπὸ τὸν Θεό! Τί πρέπει νὰ κάνω, γιὰ νὰ πάω πιὸ κοντά Του;», ἀπὸ αὐτὸ ἔρχεται καὶ ἡ μνήμη τοῦ Θεοῦ, ἔρχεται καὶ ἡ εὐχή. Νὰ προσπαθήσης νὰ αἰσθάνεσαι πάντοτε τὴν παρουσία τοῦ Χριστοῦ, τῆς Παναγίας, τῶν Ἁγίων, καὶ νὰ κινῆσαι σὰν νὰ εἶναι παρόντες. Γιατὶ πράγματι εἶναι παρόντες, ἄσχετα ἂν ἐμεῖς δὲν τοὺς βλέπουμε μὲ τὰ σωματικὰ μάτια. Νὰ τὰ ἀνάγης ὅλα στὸν Θεὸ καὶ νὰ λές: «Ὁ Θεὸς μὲ παρακολουθεῖ. Ἄραγε αὐτὸ ποὺ κάνω τώρα εἶναι ἀρεστὸ στὸν Θεό; Τί νὰ κάνω, γιὰ νὰ Τὸν εὐαρεστήσω; Τί πρέπει νὰ ἀποφύγω, γιὰ νὰ μὴν Τὸν στενοχωρήσω;». Σιγὰ-σιγὰ αὐτὸ θὰ γίνη κατάσταση μέσα σου. Θὰ σκέφτεσαι τὸν Θεὸ καὶ θὰ κάνης τὸ πᾶν, γιὰ νὰ Τὸν εὐχαριστήσης. Ἔτσι ἀναπτύσσεται καὶ αὐξάνει ἡ ἀγάπη πρὸς τὸν Θεό, γλυκαίνεται ὁ νοῦς καὶ ἡ καρδιά, καὶ μένουν συνεχῶς στὴν εὐχὴ χωρὶς κόπο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί σημαίνει:«Μνήμη Θεοῦ, ὅρασις Θεοῦ»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μνήμη Θεοῦ σημαίνει ὅτι ὁ νοῦς εἶναι στὸν Θεό, ζῆ ὁ ἄνθρωπος τὸν Θεό, ὁπότε βλέπει παντοῦ τὸν Θεό. Αὐτὸς ποὺ κατορθώνει νὰ ἔχη συνέχεια τὸν νοῦ του στὸν Θεό, αἰσθάνεται συνέχεια τὴν παρουσία τοῦ Θεοῦ καὶ συγκλονίζεται ἀπὸ εὐγνωμοσύνη, γιατὶ ὅλα τὰ βλέπει ὡς εὐλογία τοῦ Θεοῦ. Μιὰ ματιὰ νὰ ρίξη γύρω του, καταλαβαίνει ὅτι ὁ Θεὸς παρακολουθεῖ ὄχι μόνον τὸν ἄνθρωπο, ἀλλὰ καὶ ὅλο τὸ σύμπαν, καὶ στὶς πιὸ μικρὲς καὶ ἀσήμαντες λεπτομέρειες. Ὅπου νὰ κοιτάξη, βλέπει τὰ μεγαλεῖα τοῦ Θεοῦ. Ρίχνει μιὰ ματιὰ στὸν οὐρανὸ καὶ ἀλλοιώνεται ἀπὸ τὴν παρουσία τοῦ Θεοῦ. Ρίχνει μιὰ ματιὰ στὴν γῆ, βλέπει τὰ πουλιά, τὰ δένδρα, καὶ βλέπει τὸν Θεό, τὸν Δημιουργό τους. Αὐτὸ εἶναι καὶ προσευχή, εἶναι καὶ μνήμη τοῦ Θεοῦ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Ἡ συνεργασία νοῦ καὶ καρδιᾶς
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὅταν ὁ νοῦς πάη στὴν καρδιά, ἡ προσευχή μας γίνεται καρδιακὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πῶς κατεβαίνει, Γέροντα, ὁ νοῦς στὴν καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν πονάη ἡ καρδιά, κατεβαίνει ὁ νοῦς στὴν καρδιά. Πῶς πονάει ἡ καρδιά; Ὅταν σκέφτωμαι τὶς εὐεργεσίες τοῦ Θεοῦ καὶ τὴν δική μου ἀχαριστία, ἡ καρδιὰ κεντιέται, πονάει, καὶ ὁ νοῦς πηγαίνει ἐκεῖ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ἔχω πονοκέφαλο, δὲν μπορῶ νὰ προσευχηθῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν πονάη τὸ πόδι σου καὶ ἐκείνη τὴν στιγμὴ κόψης μὲ τὸ μαχαίρι τὸ χέρι σου, ξεχνᾶς τὸν πόνο τοῦ ποδιοῦ καὶ σκέφτεσαι τὸ χέρι. Ἔτσι καὶ ὅταν ἔχης πονοκέφαλο καὶ δὲν μπορῆς νὰ προσευχηθῆς, νὰ σκέφτεσαι πρῶτα τὶς ἁμαρτίες σου καὶ ὕστερα τὸν πόνο τοῦ κόσμου καὶ θὰ πονᾶ ἡ καρδιά σου. Ὁ πόνος τῆς καρδιᾶς θὰ ἐξουδετερώνη τὸν πονοκέφαλο καὶ θὰ προσεύχεσαι καρδιακὰ γιὰ τὸν ἑαυτό σου καὶ γιὰ ὅλον τὸν κόσμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει νὰ μὴ μετεωρίζεται ὁ νοῦς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι δύσκολο νὰ χαλιναγωγήση κανεὶς τὸν νοῦ, ὁ ὁποῖος τρέχει μὲ ταχύτητα μεγαλύτερη ἀπὸ τὴν ταχύτητα τοῦ φωτός. Πρέπει νὰ τὸν πιάση «ἀπὸ τὸ χεράκι» καὶ νὰ τὸν πάη κοντὰ στοὺς πονεμένους, στοὺς ἀρρώστους, στοὺς ἐγκαταλελειμμένους, στοὺς κεκοιμημένους. Τότε ὁ νοῦς, ποὺ τὰ βλέπει ὅλα αὐτά, «χτυπάει» τὴν καρδιά, ἡ ὁποία, ὅσο σκληρὴ κι ἂν εἶναι, σπάζει, καὶ ἡ προσευχὴ γίνεται καρδιακή. Μὲ δάκρυα παρακαλεῖ μετὰ ὁ ἄνθρωπος τὸν Θεὸ νὰ ἐπέμβη. Ἂν ὅμως κάποιος τὰ σκέφτεται ὅλα αὐτὰ καὶ δὲν συμπάσχη καὶ δὲν τὸν συγκλονίζη οὔτε ἡ δυστυχία τοῦ κόσμου οὔτε ἡ κόλαση τῶν κεκοιμημένων ποὺ εἶναι ὑπόδικοι οὔτε καὶ ἡ καταδίκη τῶν ψυχῶν τους, φαίνεται ὅτι τὰ ἔχει ὅλα ἄφθονα καὶ εἶναι χορτασμένος· ὑπερισχύει τὸ σαρκικὸ φρόνημα καὶ ὁ παλαιὸς ἄνθρωπος εἶναι πολὺ δυνατός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὴν Ἀκολουθία πολλὲς φορὲς ὁ νοῦς μου δὲν πηγαίνει στὰ οὐράνια, ἀλλὰ στὸν πόνο τῶν ἀνθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὰ ἑνωμένα εἶναι. Τὸ θέμα δὲν εἶναι νὰ λέη κανεὶς ἁπλῶς τὴν εὐχὴ οὔτε νὰ ἔχη μόνον καθαρὸ τὸν νοῦ του ἀπὸ λογισμούς, ἀλλὰ νὰ δουλεύη τὸ «μηχανάκι», νὰ πονάη ἡ καρδιὰ γιὰ τὸ θέμα ποὺ εὔχεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν, Γέροντα, μετὰ τὴν διακονία μπαίνω στὸ κελλί, προσπαθῶ νὰ συμμαζέψω τὸ μυαλό μου ἀπὸ τὶς διάφορες δουλειὲς καὶ τὶς παραστάσεις, ἀλλὰ αἰσθάνομαι ἕνα σφίξιμο στὸ κεφάλι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – «Νὰ συμμαζέψω τὸν νοῦ μου» νὰ λές. Ἀλλὰ καλὰ εἶπες «νὰ συμμαζέψω τὸ μυαλό», γιατὶ ἐσὺ κάνεις προσευχὴ μὲ τὸ μυαλό. Ἂν ἡ προσευχὴ γίνεται μὲ τὸ μυαλό, εἶναι φυσικὸ νὰ ζορίζεται τὸ μυαλὸ καὶ νὰ πονάη τὸ κεφάλι. Αὐτὸ τὸ βλέπω καὶ σὲ ἄλλους· πηγαίνουν νὰ κάνουν ἐργασία πνευματική, διαβάζουν λ.χ. κάτι πνευματικό, καὶ δὲν χρησιμοποιοῦν τὸν νοῦ ἀλλὰ τὸ μυαλὸ καὶ μετὰ πονάει τὸ κεφάλι. Ὅπως καὶ ἐκεῖνοι ποὺ πᾶνε νὰ χρησιμοποιήσουν τὴν καρδιὰ μὲ ἕναν μηχανικὸ τρόπο[136], γιὰ νὰ ποῦν τὴν εὐχή, καὶ πονάει μετὰ ἡ καρδιά. Ὅταν ὅμως θέλω νὰ προσευχηθῶ καὶ πάω νὰ συγκεντρωθῶ, πρέπει ὁ νοῦς νὰ πάη στὸν Χριστό. Τότε δὲν φεύγει· δίνει ἀμέσως τηλεγράφημα καὶ στὴν καρδιὰ καὶ ἑνώνεται ὁ νοῦς μὲ τὴν καρδιά. Τὸ ἄλλο εἶναι δουλειὰ μὲ τὴν λογική, γι’ αὐτὸ κουράζει. Γιατί λέω ὅτι πρέπει νὰ κάνουμε δικό μας τὸν πόνο τοῦ ἄλλου; Πρέπει ὁ νοῦς νὰ πάη στὸν πόνο τοῦ ἄλλου καὶ τότε νὰ προσευχηθῆς. Διαφορετικὰ εἶναι ἕνα ξερὸ πράγμα. Λὲς λ.χ. μὲ τὸ μυαλό σου ὅτι ὑπάρχουν ἄρρωστοι καὶ πρέπει νὰ προσευχηθῆς γι’ αὐτούς, ἀλλὰ δὲν συμμετέχει οὔτε ὁ νοῦς οὔτε ἡ καρδιά. Ἐνῶ, βλέπεις, ὅταν πονᾶς κάπου, ὁ νοῦς σου πάει συνέχεια ἐκεῖ. Ἔτσι καὶ σὲ αὐτὴν τὴν περίπτωση, ὅταν κάνης δικό σου τὸν πόνο τοῦ ἄλλου, ὁ νοῦς σου δὲν φεύγει ἀπὸ ἐκεῖ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν μπορεῖ ὅμως, Γέροντα, νὰ φύγη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, μπορεῖ νὰ φύγη. Αὐτὸ ἐξαρτᾶται ἀπὸ τὸν πόνο ποὺ ἔνιωσες. Ὅπως σὲ ἕνα σπίτι, ὅταν ἔχουν ἕναν ἄρρωστο ποὺ ἔκανε ἐγχείρηση ἀπὸ σκωληκοειδίτιδα, θὰ καθήσουν λίγο κοντά του, μπορεῖ καὶ νὰ τραγουδήσουν καὶ νὰ χορέψουν, καὶ ὕστερα θὰ πᾶνε στὶς δουλειές τους. Ἂν ὅμως ἔχουν ἕναν ἄρρωστο ἐγχειρισμένο ἀπὸ καρκίνο, ὁ πόνος εἶναι μεγάλος· δὲν μποροῦν νὰ ξεχασθοῦν. Μόνον κάποιος ποὺ δὲν καταλαβαίνει τὴν σοβαρότητα τῆς καταστάσεως, μπορεῖ καὶ νὰ ξεχασθῆ. Νά, ἐγώ, ὅταν ἤμουν μικρὸς καὶ εἶχαν φέρει στὸ σπίτι τὴν ἀδελφή μου ἄρρωστη βαριά, σχεδὸν ἑτοιμοθάνατη, εἶχα μιὰ φυσαρμόνικα καὶ πῆγα δίπλα καὶ ἔπαιζα· δὲν καταλάβαινα πόσο σοβαρὴ ἦταν ἡ κατάστασή της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὸ μυαλὸ εἶναι τὸ σάρκινο ὄργανο καὶ ὁ νοῦς τὸ πνευματικό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ὅπως στὸ οἰνόπνευμα, τὸ σπίρτο ποὺ ἔχει μέσα τὸ οἰνόπνευμα, εἶναι ποὺ κάνει δουλειά, ποὺ ἐνεργεῖ, καὶ ὄχι τὸ νερό, ἔτσι καὶ ὁ νοῦς εἶναι ἡ σπιρτάδα τοῦ μυαλοῦ, ὅ,τι καλύτερο ἔχει ὁ ἄνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, ὅταν δὲν δουλεύη ἡ καρδιά, εἶναι γιατὶ δὲν δουλεύει ὁ νοῦς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βέβαια, εὐλογημένη! Ἐκεῖ εἶναι ὅλη ἡ δύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ μυαλό, Γέροντα, δὲν βοηθάει καθόλου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βοηθάει μέχρις ἑνὸς σημείου· νὰ πῆς δηλαδὴ μὲ τὴν λογικὴ ὅτι πρέπει ὁ νοῦς σου νὰ πάη στὸν πόνο τοῦ ἄλλου. Μέχρις ἐκεῖ μόνον, καὶ νὰ ἀρχίση μετὰ νὰ δουλεύη ὁ νοῦς. Νὰ σκεφθῆς διάφορες περιπτώσεις πονεμένων, νὰ πονέσης γι’ αὐτοὺς καὶ νὰ ἀρχίσης νὰ προσεύχεσαι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ ἀγάπη τοῦ Θεοῦ συμμαζεύει τὸν νοῦ στὴν καρδιὰ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, καμμιὰ φορά, ὅταν λέω τὴν εὐχή, γιὰ νὰ μὴ φεύγη ὁ νοῦς μου, λέω:«Κύριε Ἰησοῦ Χριστέ, Υἱὲ τοῦ Θεοῦ, σὲ ἀγαπῶ».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς γίνεται νὰ ἀγαπᾶς τὸν Χριστὸ καὶ νὰ φεύγη ὁ νοῦς σου, ὅταν λὲς τὴν εὐχή; Ἂν τὸ πῆς καμμιὰ φορά, δὲν πειράζει. Ἀλλά, ἂν τὸ λὲς συνέχεια, αὐτὸ εἶναι ψέμα. Νὰ μὴν ἔχουμε ἄλλα στὴν καρδιά μας, ἄλλα στὸν νοῦ μας καὶ ἄλλα νὰ λένε τὰ χείλη μας. Τότε ἰσχύει τὸ«Ὁ λαὸς οὗτος τοῖς χείλεσί με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόῤῥω ἀπέχει ἀπ’ ἐμοῦ»[137].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί λέω τὴν εὐχὴ χωρὶς θέρμη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐπειδὴ σκορπίζεσαι στὰ ἔξω, ἡ καρδιά σου εἶναι ἀλλοῦ· λείπει τὸ σκίρτημα, ἡ ἀγάπη γιὰ τὸν Θεό, ὁπότε καὶ ἡ εὐχὴ βγαίνει ἀποδυναμωμένη. Ἡ ἀγάπη τοῦ Θεοῦ συμμαζεύει τὸν νοῦ στὴν καρδιὰ καὶ μετὰ παλαβώνει ὁ ἄνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς κατορθώνει κανεὶς νὰ ἔχη διαρκῆ πόθο πρὸς τὸν Θεὸ καὶ νὰ λέη τὴν εὐχὴ καρδιακά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν ἔχη συνεχῶς στὸν νοῦ του τὶς εὐεργεσίες τοῦ Θεοῦ καὶ τὴν δική του ἀχαριστία, κεντιέται καὶ παίρνει μπρὸς ἡ καρδιά. Πιέζεται ἀπὸ μόνη της φιλότιμα ἡ καρδιὰ καὶ τὸν κυνηγάει μετὰ ἡ εὐχή. Γι’ αὐτὸ νὰ ἔχης πάντοτε φιλότιμους καὶ ταπεινοὺς λογισμούς. Ἔτσι θὰ ἔρθη μέσα σου ἡ Χάρις τοῦ Θεοῦ, γιατὶ ὁ Κύριος στὴν καρδιὰ τῶν ταπεινῶν κατοικεῖ[138], καὶ τότε γλυκαίνεται ἡ καρδιά, καὶ ἡ εὐχὴ γίνεται καρδιακή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε, Γέροντα, μπορεῖ νὰ ἔρθη κακὸς λογισμός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, δὲν μπορεῖ. Γιὰ νὰ ἔρθη κακὸς λογισμός, πρέπει νὰ σταματήσης τὴν εὐχή. Ἀλλά, καὶ νὰ σταματήσης νὰ λὲς τὴν εὐχὴ μὲ τὸν νοῦ, ἂν τὴν λέη ἡ καρδιά, πάλι δὲν μπορεῖ νὰ ἔρθη, γιατὶ τὴν λέει ἡ καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δῶστε μου μιὰ εὐχή, γιὰ νὰ συμμαζέψω τὸν νοῦ μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εὔχομαι νὰ μαζευθῆ ὁ νοῦς σου στὴν καρδιά. Τί ἐννοοῦμε, ὅταν λέμε «καρδιά»; Ἡ καρδιὰ δὲν εἶναι στάμνα, ποὺ μέσα της θὰ βάλουμε τὸν νοῦ· ἡ καρδιὰ εἶναι αὐτὸ ποὺ νιώθουμε. Ἑπομένως, ὅταν λέμε «νὰ συμμαζευθῆ ὁ νοῦς μέσα στὴν καρδιά», ἐννοοῦμε νὰ συμμαζευθῆ στὴν ἀγάπη, στὴν καλωσύνη, στὴν λαχτάρα, σὲ αὐτὸ τὸ σκίρτημα, σὲ αὐτὸ τὸ γλυκὸ πράγμα... Ἀφοῦ ὁ Θεὸς εἶναι Ἀγάπη καὶ ἡ καρδιὰ ἔχει ἀγάπη, ἂν ἡ καρδιὰ εἶναι ἐξαγνισμένη, τότε ὁ ἄνθρωπος ἔχει μέσα του τὸν Θεό.«Ἀγαπήσεις Κύριον τὸν Θεόν σου ἐν ὅλῃ τῇ καρδίᾳ σου καὶ ἐν ὅλῃ τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου...»[139]. Νὰ Τὸν ἀγαπήσης μὲ ὅλο σου τὸ εἶναι. Ἂν ὁ νοῦς γλυκαθῆ ἀπὸ τὴν ἀγάπη καὶ τὴν καλωσύνη τῆς καρδιᾶς, ὅταν θὰ λέη τὸ«Κύριε Ἰησοῦ Χριστέ, ἐλέησόν με», θὰ συγκλονίζεται ὁλόκληρος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅλη ἡ βάση τῆς πνευματικῆς ζωῆς εἶναι νὰ καθαρίση ὁ ἄνθρωπος τὴν καρδιά, ὥστε νὰ δεχθῆ τὸν Χριστό, καὶ νὰ χαλιναγωγήση τὸν νοῦ, νὰ τὸν γλυκάνη μέσα στὴν καρδιά. Ἂν ὁ νοῦς γλυκαθῆ μέσα στὴν καρδιά, δὲν τοῦ κάνει καρδιὰ νὰ φύγη, ὅπως τὸ παιδάκι, ὅταν τὸ ἀφήσης ἐλεύθερο μέσα σ’ ἕνα ζαχαροπλαστεῖο, δὲν θέλει νὰ φύγη ἀπὸ ἐκεῖ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἕκτο Μέρος – Λατρευτικὴ Ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Καὶ μόνον ἂν σκεφθῆ κανεὶς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ὅτι μπαίνοντας στὸν ναὸ τοῦ Θεοῦ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μπαίνει στὸ σπίτι τοῦ Θεοῦ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: κι ἐκεῖ δέχεται τὴν θεία Χάρη καὶ ἁγιάζεται,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: εἶναι ἀρκετὸ γιὰ νὰ συγκλονισθῆ».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Ἐκκλησιαστικὲς περίοδοι
- type: h2
  initial:
    ru: ''
  text:
    ru: «Χριστὸς γεννᾶται»[140]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, μετὰ τὴν Ἀγρυπνία τῶν Χριστουγέννων δὲν κοιμόμαστε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Χριστούγεννα καὶ νὰ κοιμηθοῦμε! Ἡ μητέρα μου ἔλεγε: «Ἀπόψε μόνον οἱ Ἑβραῖοι κοιμοῦνται». Βλέπεις, τὴν νύχτα ποὺ γεννήθηκε ὁ Χριστὸς οἱ ἄρχοντες κοιμόνταν βαθιά, καὶ οἱ ποιμένες«ἀγραυλοῦσαν»[141]. Φύλαγαν τὰ πρόβατα τὴν νύχτα παίζοντας τὴν φλογέρα. Κατάλαβες; Οἱ ποιμένες ποὺ ἀγρυπνοῦσαν εἶδαν τὸν Χριστό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς ἦταν, Γέροντα, τὸ σπήλαιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἦταν μιὰ σπηλιὰ μέσα σὲ ἕναν βράχο καὶ εἶχε μιὰ φάτνη· τίποτε ἄλλο δὲν εἶχε. Ἐκεῖ πήγαινε κανένας φτωχὸς καὶ ἄφηνε τὰ ζῶα του. Ἡ Παναγία μὲ τὸν Ἰωσήφ, ἐπειδὴ ὅλα τὰ χάνια ἦταν γεμάτα καὶ δὲν εἶχαν ποῦ νὰ μείνουν[142], κατέληξαν σὲ αὐτὸ τὸ σπήλαιο. Ἐκεῖ ἦταν τὸ γαϊδουράκι καὶ τὸ βοϊδάκι, ποὺ μὲ τὰ χνῶτα τους ζέσταναν τὸν Χριστό!«Ἔγνω βοῦς τὸν κτησάμενον καὶ ὄνος τὴν φάτνην τοῦ κυρίου αὐτοῦ»[143], δὲν λέει ὁ Προφήτης Ἠσαΐας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σὲ ἕνα τροπάριο, Γέροντα, λέει ὅτι ἡ Ὑπεραγία Θεοτόκος βλέποντας τὸν νεογέννητο Χριστό,«χαίρουσα ὁμοῦ καὶ δακρύουσα»ἀναρωτιόταν:«Ἐπιδώσω σοι μαζόν, τῷ τὰ σύμπαντα τρέφοντι, ἢ ὑμνήσω σε, ὡς Υἱὸν καὶ Θεόν μου; ποίαν εὕρω ἐπὶ σοὶ προσηγορίαν;»[144].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὰ εἶναι τὰ μυστήρια τοῦ Θεοῦ, ἡ πολὺ μεγάλη συγκατάβαση τοῦ Θεοῦ, τὴν ὁποία δὲν μποροῦμε ἐμεῖς νὰ συλλάβουμε!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς θὰ μπορέσουμε νὰ ζήσουμε τὸ γεγονὸς τῆς Γεννήσεως, ὅτι δηλαδὴ ὁ Χριστὸς«Σήμερον γεννᾶται ἐκ Παρθένου»[145];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιὰ νὰ ζήσουμε αὐτὰ τὰ θεῖα γεγονότα, πρέπει ὁ νοῦς νὰ εἶναι στὰ θεῖα νοήματα. Τότε ἀλλοιώνεται ὁ ἄνθρωπος.«Μέγα καὶ παράδοξον θαῦμα τετέλεσται σήμερον»[146], ψάλλουμε. Ἅμα ὁ νοῦς μας εἶναι ἐκεῖ, στὸ«παράδοξον», τότε θὰ ζήσουμε καὶ τὸ μεγάλο μυστήριο τῆς Γεννήσεως τοῦ Χριστοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἐγὼ θὰ εὔχωμαι ἡ καρδιά σας νὰ γίνη Ἁγία Φάτνη καὶ τὸ Πανάγιο Βρέφος τῆς Βηθλεὲμ νὰ σᾶς δώση ὅλες τὶς εὐλογίες Του.
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Ἡ Ἁγία Τεσσαρακοστή: πορεία πρὸς τὸν Γολγοθᾶ'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλὴ Σαρακοστὴ καὶ καλὸ Τριήμερο[147]. Πιστεύω αὐτὴν τὴν Σαρακοστὴ νὰ μὴν ἔχετε πολλὲς δουλειὲς καὶ νὰ συμμετάσχετε ψυχικὰ στὸ Πάθος τοῦ Κυρίου, δουλεύοντας περισσότερο πνευματικά. Ἀπὸ τὴν στιγμὴ ποὺ ἀρχίζει τὸ Τριώδιο[148], πρέπει νὰ ἀρχίζη κανεὶς νὰ ὁδεύη πρὸς τὸν Γολγοθᾶ. Καί, ἂν ἀξιοποιήση πνευματικὰ αὐτὴν τὴν περίοδο, ὅταν πεθάνη, θὰ ὁδεύση ἡ ψυχή του πρὸς τὰ ἄνω, χωρὶς νὰ ἐμποδίζεται ἀπὸ «διόδια» καὶ τελώνια[149]. Κάθε χρόνο ἔρχονται αὐτὲς οἱ ἅγιες ἡμέρες, ἀλλὰ καὶ κάθε χρόνο μᾶς φεύγει καὶ ἕνας χρόνος· καὶ αὐτὸ εἶναι τὸ θέμα. Τὸν ἀξιοποιήσαμε πνευματικὰ ἢ τὸν σπαταλήσαμε στὰ ὑλικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μαζὶ μὲ ὅλες τὶς ἄλλες κοσμικὲς ἀλλοιώσεις τῆς ἐποχῆς μας, ἔχει χάσει τὴν ἔννοιά του καὶ τὸ Τριήμερο, γιατὶ οἱ κοσμικοὶ κάθε ἑβδομάδα ἔχουν τριήμερο – Παρασκευή, Σάββατο, Κυριακὴ – μὲ ζωὴ κοσμική. Εὐτυχῶς ποὺ διατηρεῖται καὶ ἡ πραγματικὴ πνευματικὴ ἔννοια τοῦ Τριημέρου στὰ μοναστήρια καὶ σὲ λίγες χριστιανικὲς οἰκογένειες στὸν κόσμο, καὶ ἔτσι κρατιέται ὁ κόσμος. Ἡ πολλὴ προσευχὴ καὶ ἡ νηστεία ποὺ γίνεται κάθε χρόνο σ’ αὐτὸ τὸ Τριήμερο, στὴν ἀρχὴ τῆς Μεγάλης Τεσσαρακοστῆς, φρενάρει τὸν κόσμο ἀπὸ πολλὰ πνευματικὰ ὀλισθήματα, ποὺ γίνονται συνήθως στὰ κοσμικὰ τριήμερα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιό εἶναι τὸ νόημα τοῦ Τριημέρου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ Τριήμερο τῆς Σαρακοστῆς ἔχει περισσότερο τὸ νόημα νὰ συνηθίση κανεὶς στὴν νηστεία, στὴν ἐγκράτεια. Ὕστερα, ὅταν θὰ κάνη κάθε μέρα ἐνάτη[150], θὰ τὸ θεωρῆ πανηγύρι. Στὸ Κοινόβιο μετὰ τὸ Τριήμερο τρώγαμε μιὰ σούπα νερόβραστη στὶς τέσσερις τὸ ἀπόγευμα καὶ τὸ θεωρούσαμε μεγάλη εὐλογία. Μετὰ τὸ Τριήμερο τί εὐλογία νὰ τρῶμε κάθε μέρα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βοηθάει τὸ Τριήμερο στὴν ἀρχή, γιὰ νὰ νηστέψη κανεὶς ὅλη τὴν Σαρακοστή. Ἂν ὅμως κάποιος δὲν μπορῆ νὰ κρατήση τὸ Τριήμερο, ἂς φάη λίγο παξιμάδι τὸ βράδυ ἢ ἂς κρατήση ἐνάτη. Εἶναι καλύτερα νὰ οἰκονομηθῆ, γιατί, ἂν ζαλίζεται καὶ δὲν μπορῆ νὰ κάνη τίποτε ἀπὸ πνευματικά, τί πνευματικὸ κέρδος βγάζει μετά; Μιὰ Καθαρὰ Τρίτη ὁ Γερο-Βαρλαάμ, ἀπὸ τὴν Καλύβη τῶν Ὁσίων Βαρλαὰμ καὶ Ἰωάσαφ, πῆγε σὲ ἕνα Κελλί, ὅπου μόλις εἶχαν ἐγκατασταθῆ δύο γνωστοί του νέοι μοναχοί. Χτυπάει τὴν πόρτα· τίποτε. Ἀνοίγει καὶ τοὺς βρίσκει καὶ τοὺς δύο ξαπλωμένους. «Τί γίνεται; λέει, ἄρρωστοι εἶστε;». «Κάνουμε Τριήμερο!», λένε. «Ἄντε σηκωθῆτε ἐπάνω, τοὺς λέει. Κάντε ἕνα τσάι, βάλτε δυὸ κουταλιὲς ζάχαρη, φᾶτε καὶ κανένα παξιμάδι, γιὰ νὰ πῆτε καμμιὰ εὐχή, νὰ κάνετε κανένα κομποσχοίνι. Τριήμερο εἶναι αὐτό; Τί βγάζετε ἀπὸ αὐτό;».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς θὰ μπορέσω τὴν Σαρακοστὴ νὰ ἀγωνισθῶ περισσότερο στὴν ἐγκράτεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Οἱ κοσμικοὶ τώρα τὴν Σαρακοστὴ προσέχουν κατὰ κάποιον τρόπο τὴν ἐγκράτεια, ἐνῶ ἐμεῖς οἱ μοναχοὶ πάντα πρέπει νὰ προσέχουμε. Τὸ κυριώτερο ὅμως ποὺ πρέπει νὰ προσέξη κανεὶς εἶναι τὰ ψυχικὰ πάθη καὶ μετὰ τὰ σωματικά. Γιατί, ἂν δώση προτεραιότητα στὴν σωματικὴ ἄσκηση καὶ δὲν κάνη ἀγώνα, γιὰ νὰ ξερριζωθοῦν τὰ ψυχικὰ πάθη, τίποτε δὲν κάνει. Πῆγε μιὰ φορὰ σὲ ἕνα μοναστήρι ἕνας λαϊκὸς στὴν ἀρχὴ τῆς Σαρακοστῆς καὶ κάποιος μοναχὸς τοῦ φέρθηκε ἀπότομα, σκληρά. Ἐκεῖνος ὅμως ὁ καημένος εἶχε καλὸ λογισμὸ καὶ τὸν δικαιολόγησε. Ἦρθε μετὰ καὶ μοῦ εἶπε: «Δὲν τὸν παρεξηγῶ, Πάτερ· ἦταν, βλέπεις, ἀπὸ τὸ τριημέρι!». Ἂν τὸ τριημέρι ποὺ ἔκανε ἦταν πνευματικό, θὰ εἶχε μιὰ γλυκύτητα πνευματικὴ καὶ θὰ μιλοῦσε στὸν ἄλλον μὲ λίγη καλωσύνη. Ἀλλὰ αὐτὸς ζόριζε ἐγωιστικὰ τὸν ἑαυτό του νὰ κάνη Τριήμερο, καὶ γι’ αὐτὸ ὅλα τοῦ ἔφταιγαν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί νὰ σκέφτωμαι τὴν Σαρακοστή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ Πάθος, τὴν θυσία τοῦ Χριστοῦ νὰ σκέφτεσαι. Ἂν καὶ ἐμεῖς οἱ μοναχοὶ πρέπει συνέχεια νὰ ζοῦμε τὸ Πάθος τοῦ Χριστοῦ, γιατὶ μᾶς βοηθοῦν σ’ αὐτὸ κάθε μέρα τὰ διάφορα τροπάρια, ὅλες οἱ Ἀκολουθίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τὴν Μεγάλη Τεσσαρακοστὴ μᾶς δίνεται ἡ μεγαλύτερη εὐκαιρία γιὰ νὰ ἀγωνισθοῦμε καὶ νὰ συμμετέχουμε ἐντονώτερα στὸ σωτήριο Πάθος τοῦ Κυρίου μας, μὲ μετάνοια καὶ μὲ μετάνοιες, μὲ ἐκκοπὴ τῶν παθῶν καὶ μὲ ἐλάττωση τῶν τροφῶν, ἀπὸ ἀγάπη πρὸς τὸν Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἂς ἀξιοποιήσουμε, ὅσο μποροῦμε, τὸ πνευματικὸ αὐτὸ στάδιο μὲ τὶς πολλὲς προϋποθέσεις καὶ δυνατότητες ποὺ μᾶς δίνονται, γιὰ νὰ πλησιάσουμε περισσότερο στὸν Ἐσταυρωμένο Χριστό, γιὰ νὰ βοηθηθοῦμε ἀπὸ Αὐτὸν καὶ νὰ χαροῦμε τὴν Ἁγία Ἀνάσταση ἀλλοιωμένοι πνευματικά, ἀφοῦ θὰ ἔχουμε ζήσει πνευματικώτερα τὴν Μεγάλη Σαρακοστή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εὔχομαι καλὴ δύναμη τὴν Μεγάλη Τεσσαρακοστή, γιὰ νὰ ἀνεβῆτε στὸν Γολγοθᾶ κοντὰ στὸν Χριστό, μαζὶ μὲ τὴν Παναγία καὶ τὸν Προστάτη σας Ἅγιο Ἰωάννη τὸν Θεολόγο, καὶ νὰ συμμετάσχετε στὸ φρικτὸ Πάθος τοῦ Κυρίου μας. Ἀμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Προσκυνοῦμέν Σου τὰ πάθη, Χριστὲ»[151]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς θὰ ἀποκτήσω εὐλάβεια στὰ Πάθη τοῦ Χριστοῦ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κατ’ ἀρχὰς νὰ σκέφτεσαι τὴν θυσία τοῦ Χριστοῦ καὶ τὴν δική σου ἀχαριστία καὶ ἁμαρτωλότητα. Ἕνα σχετικὸ πατερικὸ κείμενο θὰ σὲ βοηθήση λίγο καὶ αὐτό. Ἀλλὰ αὐτὸ ποὺ θὰ σὲ βοηθήση περισσότερο, εἶναι τὸ ἴδιο τὸ Πάθος, ἡ θυσία τοῦ Κυρίου. Ὁ Χριστὸς δὲν δίδαξε ἁπλῶς μερικὰ πράγματα, ἀλλὰ θυσιάσθηκε γιὰ τὸ ἀνθρώπινο γένος, βασανίστηκε, σταυρώθηκε, ὑπέμεινε τόσα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ σταυρικὸς θάνατος, Γέροντα, ἦταν ἀτιμωτικός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ὁ πιὸ ἀτιμωτικός. Εἶναι φοβερό! Ὅλοι οἱ Προφῆτες νὰ προφητεύουν γιὰ τὸν Χριστό, καὶ τελικὰ οἱ Ἑβραῖοι νὰ Τὸν δέρνουν, νὰ Τὸν φτύνουν, νὰ Τὸν ἐμπαίζουν, νὰ Τὸν σταυρώνουν! Ὅλα αὐτὰ συγκλονίζουν τὸν ἄνθρωπο, ἂν τὰ σκεφθῆ. Ἀκόμη καὶ στὸν πιὸ ἀδιάφορο, ἂν ἔχη λίγη καλὴ διάθεση καὶ τὰ σκεφθῆ, κινοῦν τὸ ἐνδιαφέρον τὸ πνευματικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὸ βράδυ τῆς Μεγάλης Πέμπτης, μετὰ τὴν Ἀκολουθία τῶν Παθῶν, δὲν μένω στὸν ναό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κρίμα, κι ἐγὼ νόμιζα ὅτι ἔχεις λίγη εὐλάβεια! Καλά, δὲν μένετε στὸν ναὸ τὸ βράδυ τῆς Μεγάλης Πέμπτης; Ἀφήνετε τὸν Ἐσταυρωμένο μόνον καὶ πηγαίνετε στὰ κελλιά σας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οἱ περισσότερες ἀδελφές, Γέροντα, μένουν στὸν ναό, ἀλλὰ ἐγώ, μὲ τὸν λογισμὸ ὅτι εἶμαι ἐξωστρεφὴς καὶ δὲν θὰ μπορέσω νὰ συγκεντρωθῶ, ἀγρυπνῶ στὸ κελλί μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν εἶναι ἔτσι, καλά. Νὰ ἔχης στὸ κελλί σου μία εἰκόνα τῆς Σταυρώσεως καὶ νὰ λές:«Δόξα τῇ ἁγίᾳ σταυρώσει σου, Κύριε»καὶ«Ὑπεραγία Θεοτόκε, προσκυνοῦμεν τὰ Πάθη τοῦ Υἱοῦ σου». Παράλληλα νὰ κάνης καὶ ὅσες μετάνοιες μπορεῖς. Αὐτὴν τὴν ἡμέρα πρέπει νὰ τὴν ζήση κανείς. Ἐγὼ τὴν Μεγάλη Παρασκευὴ κλειδώνομαι, γιὰ νὰ τὴν ζήσω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φέτος, Γέροντα, τὴν Μεγάλη Παρασκευὴ δὲν ἔφαγα τίποτε καὶ τὸ βράδυ στὴν Ἀκολουθία τοῦ Ἐπιταφίου δὲν μποροῦσα νὰ σταθῶ ὄρθια. Ἂν εἶχα τὴν ἀπαιτούμενη εὐλάβεια στὰ Πάθη τοῦ Κυρίου, θὰ ἔφθανα σὲ αὐτὸ τὸ σημεῖο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλὸς ἦταν καὶ αὐτὸς ὁ ἀγώνας. Τέτοια μέρα πῶς νὰ φάη κανείς; Ἂν κάποιος δὲν ἀντέχη, θὰ πάρη λίγο παξιμάδι. Παλιὰ στὰ μοναστήρια μόνον κανένας ἄρρωστος ἢ κανένα γεροντάκι θὰ ἔπαιρναν τὸ βράδυ ἕνα τσάι μὲ λίγο παξιμάδι. Μερικοὶ πίνουν ξίδι αὐτὴν τὴν ἡμέρα, γιατὶ χολὴ καὶ ξίδι ἔδωσαν οἱ Ἑβραῖοι στὸν Χριστὸ ἐπάνω στὸν Σταυρό[152]. Ὅταν πῆγα στὴν Μονὴ Φιλοθέου, τὴν πρώτη Μεγάλη Ἑβδομάδα δὲν ἔφαγα τίποτε. Τὴν Μεγάλη Παρασκευή, ἐπειδὴ εἶχα ἀκούσει ὅτι κάποιοι εἶχαν τὴν συνήθεια νὰ πίνουν ξίδι, ἤπια κι ἐγώ. Ἦταν ὅμως πολὺ δυνατό, κι ἔπεσα κάτω λιπόθυμος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί τὴν Μεγάλη Ἑβδομάδα μπορῶ νὰ κάνω τριήμερο, ἐνῶ καθημερινὰ δυσκολεύομαι νὰ ἐγκρατευθῶ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὴν Μεγάλη Ἑβδομάδα εἶναι ὁ πόνος γιὰ τὸ Πάθος τοῦ Χριστοῦ. Ἂν πεθάνη, ἂς ὑποθέσουμε, ἕνα ἀγαπητό σου πρόσωπο, μπορεῖς νὰ ἔχης τὸν νοῦ σου γιὰ φαγητό; Τότε ὄχι μόνο νὰ φᾶς δὲν μπορεῖς, ἀλλὰ οὔτε καὶ νερὸ νὰ πιῆς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φέτος, Γέροντα, ψάλαμε τὰ Ἐγκώμια στιχολογώντας τὸν Ἄμωμο[153].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τὰ ἄκουσα. Θέλω ὅμως νὰ μοῦ πῆτε τὴν ἀλήθεια: Ὅταν ψέλνατε, εἴχατε τὸν νοῦ σας στὸν Χριστό, στὸν Ἐπιτάφιο; Γιατὶ καὶ ἡ ἀδελφὴ ποὺ ἔλεγε τὸν στίχο τοῦ Ἀμώμου καὶ οἱ ἀδελφὲς ποὺ ἔψαλλαν, ἦταν σὰν συνεπαρμένες! Ἀπὸ τί ἤσασταν συνεπαρμένες; Ἐπειδὴ λέγατε κάτι καινούργιο; Αὐτὸ εἶναι τελείως κοσμικό. Τὸ καταλαβαίνετε; Ἐπιτάφιος θρῆνος λέγονται τὰ Ἐγκώμια! Θρῆνος εἶναι! Σὲ ἄλλα μπορεῖ νὰ φύγη καὶ λίγο ὁ νοῦς, ἀλλὰ ἐδῶ βασάνισαν τὸν Χριστό, Τὸν ἔδειραν, Τὸν ἔφτυσαν, Τὸν σταύρωσαν, καὶ τώρα γίνεται ἡ κηδεία. Ἂν οὔτε καὶ αὐτὴν τὴν ἡμέρα δὲν αἰσθάνεται μιὰ ψυχὴ αὐτὰ ποὺ ψάλλει, τότε τί νὰ πῶ;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὸ Ἅγιον Ὄρος τὴν Μεγάλη Παρασκευὴ χτυποῦν πένθιμα οἱ καμπάνες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χτυποῦν καμπάνες, ὅταν βγαίνη ὁ Ἐπιτάφιος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χτυποῦν, Γέροντα, καὶ ὅλη τὴν ἡμέρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρω κι ἐγὼ ἂν χτυποῦν; Ἐγὼ κοιτάζω νὰ χτυπήση ἡ καρδιά!
- type: h2
  initial:
    ru: ''
  text:
    ru: «Ἀναστάσεως ἡμέρα»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάποια παιδιὰ μὲ ρώτησαν γιατί βάφουμε κόκκινα αὐγά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὰ παιδιὰ νὰ μὴν τὰ ἀφήνετε νὰ σκαλώνουν σὲ κάτι τέτοια, γιατὶ τὰ ἐνδιαφέροντά τους θὰ στρέφωνται συνέχεια ἐκεῖ καὶ δὲν θὰ πηγαίνουν σὲ κάτι βαθύτερο. Πέστε τους μόνον ὅτι τὸ κόκκινο αὐγό, ὅπως εἶναι στρογγυλό, συμβολίζει τὴν γῆ ποὺ βάφτηκε μὲ τὸ Αἷμα τοῦ Χριστοῦ καὶ λυτρώθηκε ὅλος ὁ κόσμος ἀπὸ τὴν ἁμαρτία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μοῦ κάνει ἐντύπωση τὸ θάρρος τῶν Μυροφόρων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οἱ Μυροφόρες εἶχαν μεγάλη ἐμπιστοσύνη στὸν Χριστό, εἶχαν πνευματικὴ κατάσταση, καὶ γι’ αὐτὸ δὲν ὑπολόγισαν τίποτε. Ἂν δὲν εἶχαν πνευματικὴ κατάσταση, θὰ ἔκαναν αὐτὸ ποὺ ἔκαναν; Ξεκίνησαν χαράματα, ὥρα ποὺ ἀπαγορευόταν ἡ κυκλοφορία, μὲ ἀρώματα στὰ χέρια γιὰ τὸν Πανάγιο Τάφο τοῦ Χριστοῦ, ἀπὸ ἀγάπη πρὸς τὸν Χριστό. Γι’ αὐτὸ καὶ ἀξιώθηκαν νὰ ἀκούσουν ἀπὸ τὸν Ἄγγελο τὸ χαρμόσυνο μήνυμα τῆς Ἀναστάσεως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς θὰ μπορέσουμε νὰ ζήσουμε τὴν χαρὰ τῆς Ἀναστάσεως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ καλλιεργήσουμε τὸ χαροποιὸν πένθος, γιὰ νὰ ἔρθη ἡ πραγματικὴ χαρά. Ἂν ζήσουμε μὲ εὐλάβεια καὶ κατάνυξη τὴν Μεγάλη Ἑβδομάδα, θὰ ζήσουμε μὲ πνευματικὴ ἀγαλλίαση καὶ θεία εὐφροσύνη τὴν Ἁγία Ἀνάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι, Γέροντα, φυσικὸ νὰ μὴ νιώθω πολλὴ χαρὰ τὸ βράδυ τῆς Ἀναστάσεως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, εἶναι φυσικό, γιατὶ ὅλη τὴν Μεγάλη Ἑβδομάδα ζούσαμε τὰ λυπηρὰ γεγονότα τοῦ Πάθους καὶ ἰδιαίτερα τὴν προηγούμενη μέρα, ποὺ ἦταν ἡ Μεγάλη Παρασκευή. Ἐπειδὴ τὸ συναίσθημα τῆς λύπης εἶναι βαθύτερο ἀπὸ τὸ συναίσθημα τῆς χαρᾶς, δὲν μποροῦμε σὲ μιὰ μέρα νὰ ξεπεράσουμε αὐτὴν τὴν ψυχικὴ κατάσταση. Ὄχι ὅτι δὲν χαίρεται ἡ ψυχὴ τὴν Ἀνάσταση, ἀλλὰ δὲν χαίρεται τόσο, ὅσο τὸ ἀπαιτεῖ ἡ λαμπρὴ αὐτὴ ἡμέρα. Σιγὰ-σιγὰ ὅμως, κατὰ τὴν Διακαινήσιμο Ἑβδομάδα, ποὺ εἶναι σὰν μία ἡμέρα πασχαλινή, φεύγει ὁ πόνος τῆς Μεγάλης Ἑβδομάδος καὶ ἡ ψυχὴ γεμίζει ἀπὸ τὴν ἀναστάσιμη χαρά. Τὴν δεύτερη ἡμέρα τοῦ Πάσχα ἀρχίζει νὰ καταλαβαίνη κανεὶς τὴν Ἀνάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, σὲ μερικὰ μοναστήρια κάνουν λιτανεία τὴν δεύτερη ἢ τρίτη ἡμέρα τοῦ Πάσχα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιὰ νὰ σκορπίσουν τὴν πασχαλινὴ χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χτυποῦν, Γέροντα, καὶ τὶς καμπάνες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὴν Διακαινήσιμο Ἑβδομάδα χτυποῦν ὅλα μαζί· καμπάνες, σήμαντρα, χειροσήμαντρα, καὶ ἡ καρδιὰ χτυπάει δυνατὰ ζώντας τὸ«Ἀναστάσεως ἡμέρα»[154].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εὔχομαι νὰ χαίρεσθε πάντοτε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μὲ ἀγαλλίαση πνευματική,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μὲ συνεχῆ πασχαλινὴ χαρά,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μὲ ἐσωτερικὴ γλυκειὰ ἀναστάτωση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Ἡ κοινὴ προσευχὴ
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ ἱερὸς ναὸς εἶναι τὸ σπίτι τοῦ Θεοῦ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολλοὶ ἄνθρωποι, Γέροντα, δὲν θεωροῦν ἀπαραίτητο τὸν ἐκκλησιασμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν μπαίνουν στὸ βαθύτερο νόημα οἱ ἄνθρωποι· κόβουν τὸ καλώδιο, τὴν ἐπαφὴ μὲ τὸν Θεό, καὶ μετὰ δὲν μποροῦν νὰ βοηθηθοῦν. Δυστυχῶς οἱ περισσότεροι Χριστιανοὶ δὲν ζοῦν μυστηριακά, γι’ αὐτὸ ὑπάρχει μιὰ ἐπίδραση δαιμονική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἐγὼ πάντοτε λέω στοὺς λαϊκοὺς νὰ ἐκκλησιάζωνται, γιὰ νὰ ἁγιάζωνται. Καὶ μόνον ἂν σκεφθῆ κανεὶς ὅτι μπαίνοντας στὸν ναὸ τοῦ Θεοῦ μπαίνει στὸ σπίτι τοῦ Θεοῦ κι ἐκεῖ δέχεται τὴν θεία Χάρη καὶ ἁγιάζεται, εἶναι ἀρκετὸ γιὰ νὰ συγκλονισθῆ. Μέσα στὸν ναὸ μᾶς παρακολουθοῦν ὁ Χριστός, ἡ Παναγία, οἱ Ἅγιοι, ζητοῦμε τὴν βοήθειά τους, μποροῦμε ἁπλὰ νὰ συνομιλοῦμε μαζί τους. Ἐκεῖ μᾶς δίνεται ἡ δυνατότητα νὰ ζήσουμε τὰ Μυστήρια. Ἐκεῖ θυσιάζεται γιὰ μᾶς ὁ Χριστὸς καὶ μᾶς δίνει τὸ Σῶμα καὶ τὸ Αἷμα Του. Αὐτὸ δὲν πρέπει νὰ μᾶς συγκλονίζη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τώρα μὲ τὸ πρόβλημα τῆς ὑγείας μου δὲν πηγαίνω στὴν ἐκκλησία καὶ μοῦ λείπει ἡ Ἀκολουθία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τώρα χρειάζεται νὰ κάνης λίγη ὑπομονή. Ἐγώ, ὅταν ἤμουν στὸν στρατὸ καὶ ἤμασταν στὶς ἐπιχειρήσεις πάνω στὰ βουνά[155], ἑπτὰ μῆνες εἶχα νὰ δῶ ἐκκλησία. Μιὰ μέρα μὲ ἔστειλαν κάτω στὴν Ναύπακτο, γιὰ νὰ φτιάξω κάτι ἀσυρμάτους καὶ ἔπρεπε νὰ γυρίσω ἀμέσως πίσω. Τακτοποίησα τοὺς ἀσυρμάτους καί, καθὼς ἐπέστρεφα, πέρασα ἔξω ἀπὸ μία ἐκκλησία ποὺ ἦταν πάνω στὸν δρόμο. Ἦταν Μεγάλη Σαρακοστὴ καὶ ἔψαλλαν τοὺς Χαιρετισμούς. Πῶς νὰ μπῶ μέσα; Εἶχα τοὺς ἀσυρμάτους ποὺ δὲν μποροῦσα νὰ τοὺς ἀφήσω· δὲν εἶχα καὶ χρόνο. Κάθησα μόνον πέντε λεπτὰ ἔξω ἀπὸ τὴν ἐκκλησία. Μὲ ἔπιασε ἕνα παράπονο! Ἔκλαιγα σὰν μικρὸ παιδί. «Θεέ μου, ἔλεγα, πῶς κατήντησα! Ἀπὸ μικρὸς πήγαινα στὴν ἐκκλησία, πρὶν πάη ὁ νεωκόρος. Καὶ τώρα ἑπτὰ μῆνες ἔκανα νὰ δῶ ἐκκλησία!».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ἀπὸ τὴν διακονία μου στὸ ἀρχονταρίκι πηγαίνω κατ’ εὐθεῖαν στὴν ἐκκλησία, δὲν μπορῶ νὰ συγκεντρωθῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀπὸ τὸ ἀρχονταρίκι πηγαίνεις στὸν ναό. Ἀπὸ τὸν ναὸ νὰ πᾶς στὸν Οὐρανὸ καὶ μετὰ πιὸ ἐκεῖ, στὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς γίνεται αὐτό, Γέροντα; Σκέφτεται κανεὶς τὴν δόξα τοῦ Θεοῦ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ ναὸς εἶναι τὸ σπίτι τοῦ Θεοῦ ἐδῶ στὴν γῆ. Τὸ πραγματικὸ ὅμως σπίτι τοῦ Θεοῦ εἶναι στὸν Παράδεισο, ὅπως καὶ τὸ δικό μας πραγματικὸ σπίτι εἶναι στὸν Παράδεισο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ δύναμη τῆς κοινῆς προσευχῆς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικὲς φορὲς νιώθω τὴν ἀνάγκη νὰ μείνω στὸ κελλὶ καὶ νὰ κάνω πνευματικὰ παρὰ νὰ πάω στὴν Ἀκολουθία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὸ ποὺ θὰ γίνη στὴν Ἀκολουθία, μπορεῖ νὰ γίνη ἄλλη ὥρα; Δὲν μπορεῖ νὰ γίνη. Ἐνῶ αὐτὸ ποὺ θὰ κάνης στὸ κελλί, μπορεῖ νὰ γίνη καὶ ἄλλη ὥρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στὴν ἐκκλησία, Γέροντα, δὲν νιώθω πάντα τὴν ἀλλοίωση ποὺ νιώθω στὸ κελλί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε· ἡ κατ’ ἰδίαν προσευχὴ εἶναι προετοιμασία γιὰ τὴν κοινή. Ἡ κοινὴ προσευχὴ ἀπὸ ἄποψη ποιότητος μπορεῖ νὰ εἶναι κατώτερη ἀπὸ τὴν κατ’ ἰδίαν, γιατὶ στὸν ναὸ δὲν μπορεῖς νὰ κινηθῆς ἐλεύθερα, ὅπως ὅταν εἶσαι μόνος. Ἀπὸ ἄποψη ὅμως ἰσχύος εἶναι ἀνώτερη, γιατὶ προσεύχονται ὅλοι μαζί, καὶ ἄλλου ἡ προσευχὴ ἔχει πιὸ πολλὴ δύναμη, ἄλλου πιὸ πολλὴ θέρμη κ.λπ. Αὐτὲς λοιπὸν τὶς δύο-τρεῖς ὧρες ποὺ γίνεται ἡ Ἀκολουθία, πρέπει νὰ εἶσαι κι ἐσὺ ἐκεῖ στὴν ἐκκλησία, γιὰ νὰ προσευχηθῆς μαζὶ μὲ ὅλους. Τί εἶπε ὁ Χριστός;«Ὅπου εἶναι δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν»[156].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μὲ ἀναπαύει πιὸ πολὺ νὰ μένω στὸ κελλί, ἐπειδὴ στὴν Ἀκολουθία ἔχω περίσπαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ ἀνάπαυση ποὺ νιώθεις ἐκείνη τὴν ὥρα στὸ κελλί, δὲν εἶναι πραγματικὴ ἀνάπαυση. Ἂν κάνης τὸν ἀγώνα σου μέσα στὴν ἐκκλησία καὶ προσπαθήσης νὰ συγκεντρωθῆς καὶ νὰ λὲς τὴν εὐχή, τότε θὰ κάνης σωστὴ δουλειὰ καὶ θὰ βρῆς τὴν πραγματικὴ ἀνάπαυση. Νὰ κάνης μιὰ προσπάθεια νὰ ξεπεράσης τὶς δυσκολίες μέσα στὶς δυσκολίες· αὐτὸ πολὺ θὰ σὲ βοηθήση. Εἶναι σὰν νὰ ἐκπαιδεύεσαι στὸν στρατὸ μὲ πραγματικὲς σφαῖρες, πράγμα ποὺ σὲ κρατᾶ σὲ ἐγρήγορση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὴν Ἀκολουθία ζορίζομαι, γιατὶ δὲν μπορῶ νὰ λέω τὴν εὐχὴ καὶ νὰ παρακολουθῶ συγχρόνως τὶς ἀναγνώσεις καὶ τὰ ψαλτικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί ζορίζεσαι; Βλέπω ὅτι ἔχεις ἀγωνία. Λές: «Θέλω νὰ προχωρήσω στὴν νοερὰ προσευχή, θέλω νὰ πλουτίσω...». Αὐτὸ ἔχει μέσα κρυφὸ ἐγωισμό, ὑπερηφάνεια. Ὄχι ὅτι δὲν ἀγωνίζεσαι· ἐγὼ σοῦ τὰ λέω καὶ λίγο ὑπερβολικά. Ἔχεις καλὴ διάθεση καὶ ὁ Χριστὸς θὰ σὲ βοηθήση. Στάσου σὰν παιδάκι μπροστὰ στὸν Θεὸ καὶ μὴ σκέφτεσαι τίποτε. Κινήσου ἁπλά, καὶ θὰ δῆς πόση Χάρη θὰ σοῦ δώση ὁ Χριστὸς καὶ ἡ Παναγία. Μπαίνοντας στὴν ἐκκλησία νὰ σκέφτεσαι πὼς μπῆκες μέσα στὸ καράβι, καὶ ἄφησε τὸν ἑαυτό σου στὰ χέρια τοῦ Θεοῦ νὰ σὲ πάη ὅπου θέλει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὁ ὕπνος, Γέροντα, μὲ κλέβει στὶς Ἀκολουθίες καὶ μερικὲς φορὲς δὲν μπορῶ νὰ παρακολουθήσω καθόλου. Ὕστερα μοῦ λέει ὁ λογισμός: «Τί ἔγινε ποὺ πῆγες στὴν Ἀκολουθία, ἀφοῦ δὲν προσευχήθηκες;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ ὅταν νυστάζης, καὶ ὅταν σὲ κλέβη ὁ ὕπνος, τὸ καράβι ταξιδεύει. Μέσα στὸ καράβι, ἄλλος χαζεύει, ἄλλος νυστάζει, ἄλλος κοιμᾶται, ἀλλὰ τὸ καράβι προχωράει γιὰ τὸν προορισμό του. Ἐσὺ νὰ προσπαθῆς νὰ μὴν κοιμᾶσαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἂν ὁ νοῦς στὴν Ἀκολουθία δὲν ἀσχοληθῆ μὲ τὴν προσευχή, εἶναι κουραστικὴ ἡ Ἀκολουθία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, γιατὶ τότε δὲν τρέφεται ὁ ἄνθρωπος. Ὅταν ὁ νοῦς δὲν εἶναι στὰ θεῖα νοήματα, ἡ Ἀκολουθία εἶναι ἁπλῶς μία σωματικὴ ἄσκηση, ἕνας κόπος γιὰ τὴν ἀγάπη τοῦ Θεοῦ. Πάντως, καὶ αὐτὸς ποὺ νυστάζει στὴν ἐκκλησία καὶ ἀγωνίζεται νὰ μὴν τὸν πάρη ὁ ὕπνος, ἔχει μεγάλο μισθό. Μήπως δὲν εἶχε κρεββάτι στὸ κελλί του, νὰ πάη νὰ κοιμηθῆ; Δυὸ κοσμικοὶ πῆγαν στὸ Ἅγιον Ὄρος σὲ μιὰ ἀγρυπνία. Κοιμήθηκαν πρῶτα καὶ κατέβηκαν στὸν ναὸ στοὺς Αἴνους[157]. Ἕνας καλόγερος στὸ διπλανὸ στασίδι νύσταζε καὶ ἀγωνιζόταν νὰ μὴν κοιμηθῆ. Ὁ ἕνας ἀπὸ τοὺς δύο κοσμικούς, ὅταν τὸν εἶδε, λέει στὸν διπλανό του: «Κοίτα, οἱ καλόγεροι κοιμοῦνται». Τότε ὁ ἄλλος τοῦ ἀπάντησε σὰν τὸν καλὸ ληστή[158]: «Δὲν ντρέπεσαι; Ἐμεῖς κοιμηθήκαμε τόσες ὧρες καὶ τώρα ἤρθαμε. Δὲν θὰ μποροῦσε κι αὐτὸς νὰ πάη στὸ κελλί του νὰ κοιμηθῆ; Στρῶμα μπορεῖ νὰ μὴν ἔχη, ἀλλὰ ἕνα ξυλοκρέββατο θὰ ἔχη».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὴν Ἀκολουθία, Γέροντα, δὲν τὴν χαίρομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὅλο χαρὰ νὰ ζητᾶμε; Βρίσκεσαι στὸν ναὸ γιὰ τὸν Χριστό. Στέκεσαι στὸ στασίδι, ἀκουμπᾶς κιόλας τὰ χέρια καὶ ξεκουράζεσαι λίγο. Νὰ σκέφτεσαι: «Ὁ Χριστὸς ἔχει ἁπλωμένα τὰ χέρια στὸν Σταυρό, ἐνῶ ἐγὼ ξεκουράζομαι κιόλας». Ἔτσι θὰ νιώσης ἀνάπαυση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὴν Ἀκολουθία μποροῦμε νὰ καθώμαστε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὅποιος ἔχει κάποια δυσκολία, μπορεῖ νὰ καθήση λίγο. Ὅποιος ὅμως ἔχει κουράγιο, καλὸ εἶναι νὰ στέκεται ὄρθιος. Ἀλλὰ αὐτὸ νὰ τὸ αἰσθάνεσθε καὶ νὰ τὸ κάνετε ἀπὸ μέσα σας. Ὄχι νὰ λέτε: «Τώρα θὰ πᾶμε στὴν ἐκκλησία, θὰ σταθοῦμε ἔτσι, θὰ ἔχουμε σκυμμένο τὸ κεφάλι, δὲν θὰ κουνηθοῦμε». Αὐτὸ εἶναι ἕνα πράγμα τυπικό, ἐξωτερικό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλὲς φορές, Γέροντα, δὲν μπορῶ νὰ συγκεντρωθῶ μέσα στὴν ἐκκλησία, ἐπειδὴ πονοῦν τὰ πόδια μου ἀπὸ τὴν ὀρθοστασία. Τί νὰ κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ θυμᾶσαι τὸ τιμωρητικὸ ξύλο, στὸ ὁποῖο ἔβαλαν τὰ πόδια τοῦ Χριστοῦ καὶ νὰ λές: «Δόξα τῷ Θεῷ ποὺ πονάω». Τότε θὰ ξεχνᾶς τὸν δικό σου πόνο, ἡ καρδιά σου θὰ γλυκαίνεται καὶ θὰ λὲς καρδιακὰ τὴν εὐχή.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Ἡ μετοχὴ στὸ Μυστήριο τῆς Θείας Εὐχαριστίας
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὰ Μυστήρια βιοῦνται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στὴν Θεία Λειτουργία, Γέροντα, ἔνιωσα ὅτι ὁ Χριστὸς σταυρώθηκε γιὰ μένα καὶ ἀναρωτήθηκα: «Ἐγὼ τί ἔκανα γιὰ τὸν Χριστό;». Τί μπορῶ νὰ κάνω ἀπὸ εὐγνωμοσύνη γι’ αὐτό;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀρκεῖ νὰ τὸ νιώθης. Ὁ Χριστὸς σταυρώθηκε, θυσιάσθηκε γιὰ μᾶς καὶ τώρα μᾶς δίνει τὸ Σῶμα Του καὶ τὸ Αἷμα Του. Πρέπει νὰ φλέγεται κανείς, ὅταν τὰ σκέφτεται αὐτά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς θὰ νιώσω, Γέροντα, τὸ μεγάλο Μυστήριο τῆς Θείας Εὐχαριστίας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὰ Μυστήρια βιοῦνται. Γιὰ νὰ νιώσης τὸ Μυστήριο τῆς Θείας Εὐχαριστίας, πρέπει νὰ πιστέψης ὅτι ἐκείνη τὴν ὥρα εἶναι παρὼν ὁ Χριστός. Καὶ ὄχι ἁπλῶς νὰ τὸ πιστέψης, ἀλλὰ νὰ τὸ ζῆς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θὰ μὲ βοηθήση, γιὰ νὰ συγκεντρώνωμαι στὴν Θεία Λειτουργία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἄγγελοι συμμετέχουν στὴν Θεία Λειτουργία. «Ταῖς ἀγγελικαῖς ἀοράτως δορυφορούμενον...», ψάλλουμε. Νὰ σκέφτεσαι τί γίνεται ἐκείνη τὴν ὥρα, νὰ προσέχης στὶς αἰτήσεις ποὺ κάνει ὁ ἱερέας καὶ νὰ λὲς τὸ «Κύριεἐλέησον» μὲ τὴν καρδιά σου. Βλέπω τί σπατάλη γίνεται! Σὲ μιὰ Θεία Λειτουργία πόσες ἀδελφὲς λένε στὰΕἰρηνικὰ[159]τὸ«Κύριε ἐλέησον»; Τὸ λένε οἱ ψάλτριες ἀπὸ τὸ μουσικὸ βιβλίο καὶ οἱ περισσότερες εὐχαριστιέστε μὲ τὸ ὄμορφο«Κύριε ἐλέησον», χωρὶς νὰ συμμετέχη ἡ καρδιά. Τί ὠφελεῖ ὅμως αὐτό; Ἀκόμη κι ἂν λέτε τὴν εὐχή, ἂν δὲν τὴν λέτε μὲ πόνο, καὶ αὐτὸ δὲν ὠφελεῖ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὶς ἀγρυπνίες τὴν ὥρα τῆς Θείας Λειτουργίας συνήθως λιγοστεύει τὸ κουράγιο μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὸ εἶναι καὶ φυσικό, ἀλλὰ ἐδῶ χρειάζεται ἀγώνας. Ἂν κάνης λίγη ὑπομονὴ καὶ βιάσης λίγο τὸν ἑαυτό σου, ἔρχεται ἡ θεία βοήθεια καὶ νιώθεις θεϊκὴ δύναμη. Ἔτσι ξεπερνᾶς τὴν κούραση καὶ μετὰ δὲν θέλεις οὔτε νὰ κοιμηθῆς· ἔχεις τέτοια διάθεση γιὰ πνευματικὰ ποὺ κρατάει ὅλη τὴν ἡμέρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στὴν Θεία Λειτουργία, Γέροντα, ἐπιτρέπεται νὰ καθήση κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στὴν Θεία Λειτουργία κανονικὰ δὲν καθόμαστε. Ἂν δὲν ἔχη κουράγιο κανείς, μπορεῖ νὰ καθήση, ὅταν λέγεται ὁ Ἀπόστολος. Ἂν ὅμως ἔχη σοβαρὸ πρόβλημα ὑγείας καὶ δὲν μπορῆ νὰ σταθῆ, τότε θὰ καθήση. Ἐγὼ σὲ Θεία Λειτουργία ποτὲ δὲν ἔχω καθήσει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὴν ὥρα ποὺ ὁ ἱερέας λέει:«Τὰ σὰ ἐκ τῶν σῶν», πῶς προσεύχεσθε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἐπειδὴ ἐκείνη τὴν ὥρα κατεβαίνει τὸ Ἅγιο Πνεῦμα, λέω σύντομα, νοερά, τὸ«Βασιλεῦ Οὐράνιε», τὸ «Εὐλογητὸς εἶ Χριστέ…»[160]καὶ τὸ «Ὅτε καταβάς...»[161], καὶ προσεύχομαι γιὰ θεῖο φωτισμό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προετοιμασία γιὰ τὴν Θεία Κοινωνία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς νὰ προετοιμάζωμαι γιὰ τὴν Θεία Κοινωνία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πάντοτε πρέπει νὰ εἶναι ἕτοιμος κανείς, ἀλλά, ὅταν πρόκειται νὰ κοινωνήση, καλὰ εἶναι νὰ κάνη κάτι περισσότερο ἀπὸ τὰ πνευματικὰ ποὺ κάνει συνήθως, γιὰ νὰ ἑτοιμασθῆ καλύτερα. Πολὺ θὰ σὲ βοηθήση νὰ διαβάζης τὴν Ἀκολουθία τῆς Θείας Μεταλήψεως[162]καὶ στὸ κελλί σου. Ἔτσι θὰ τὴν καταλαβαίνης καλύτερα καὶ θὰ νιώθης περισσότερο τὴν ἁμαρτωλότητά σου. Ἀκόμη μπορεῖς νὰ ψέλνης τὴν πρώτη ὠδὴ τοῦ Μεγάλου Κανόνος[163], καὶ ἀπὸ τὸ Θεοτοκάριο τὴν πρώτη ὠδὴ τοῦ κανόνα τῆς Δευτέρας καὶ τῆς Τετάρτης τοῦ πλαγίου δευτέρου ἤχου, κάνοντας μετάνοιες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί νὰ κάνω, Γέροντα, τὴν ὥρα τῆς Θείας Λειτουργίας, ὅταν δὲν μπορῶ νὰ ἑτοιμασθῶ γιὰ νὰ κοινωνήσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά, ἐκείνη τὴν ὥρα θὰ ἑτοιμασθῆς; Ἀλλὰ καὶ πάλι ὁ Χριστὸς δὲν εἶναι ἄδικος· ἂν πράγματι κάτι σὲ ἐμπόδισε καὶ δὲν μπόρεσες νὰ ἑτοιμασθῆς, Ἐκεῖνος τὸ ξέρει. Δὲν λέω νὰ μὴν κάνης τίποτε, ἀλλὰ νὰ μὴν εἶναι ὁ ἑαυτός σου ἐμπόδιο, ὅταν δὲν κάνης. Καμμιὰ φορὰ οὔτε τὴν Θεία Μετάληψη δὲν προλαβαίνει νὰ διαβάση κανεὶς καὶ πάει νὰ κοινωνήση σὰν κοσμικός. Τότε νὰ ἔχη ταπεινοὺς λογισμούς. «Θεέ μου, νὰ πῆ, βρίσκομαι σὲ μιὰ κοσμικὴ κατάσταση· συγχώρεσέ με». Ὁ Θεὸς βλέπει τὴν καρδιά. Πολλὲς φορὲς νομίζει κανεὶς ὅτι εἶναι ἕτοιμος καὶ δὲν εἶναι, καὶ ἄλλοτε νομίζει ὅτι δὲν εἶναι ἕτοιμος καὶ τότε εἶναι. Ἡ καλύτερη ἑτοιμασία εἶναι ἡ ταπεινὴ ἀντιμετώπιση, ἡ συντριβή, τὸ φιλότιμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γιὰ τὴν Θεία Κοινωνία δὲν προετοιμάζεται κανεὶς ἀλλάζοντας τὰ ροῦχα καὶ πλένοντας τὰ δόντια. Τὸ κυριώτερο εἶναι νὰ ἐξετάση τὸν ἑαυτό του· νὰ δῆ: Αἰσθάνεται τὴν Θεία Κοινωνία ὡς ἀνάγκη; Εἶναι τακτοποιημένος; Μήπως ὑπάρχει κάτι ποὺ τὸν ἐμποδίζει ἀπὸ τὴν Θεία Κοινωνία καὶ δὲν τὸ ἔχει ἐξομολογηθῆ; Γιὰ νὰ νιώσουμε τὴν Θεία Κοινωνία, πρέπει νὰ ὑπάρχουν προϋποθέσεις. Ἡ καλύτερη προϋπόθεση εἶναι ἡ ταπεινὴ προσπάθεια νὰ κόψουμε τὰ πάθη μας, γιὰ νὰ μείνη στὴν καρδιά μας ὁ Χριστός. Ἀλλιῶς ὁ Χριστὸς ἔρχεται μὲ τὴν Θεία Κοινωνία μέσα μας, ἀλλὰ φεύγει ἀμέσως καὶ δὲν αἰσθανόμαστε τίποτε. Ὅταν παραμένη ὁ Χριστός, γίνεται μία ἀλλοίωση στὸν ἄνθρωπο. Ὑπάρχουν ἄνθρωποι ποὺ νιώθουν μέσα τους τὸν Χριστὸ ἀπὸ τὴν μία Θεία Κοινωνία μέχρι τὴν ἄλλη χωρὶς διακοπή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλὲς φορές, ὅταν ὁ ἱερέας λέη:«Μετὰ φόβου Θεοῦ, πίστεως καὶ ἀγάπης προσέλθετε», νιώθω ὅτι δὲν εἶμαι ἕτοιμη νὰ κοινωνήσω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Στὰ νοσοκομεῖα, μιὰ ὁρισμένη ὥρα, περνοῦν οἱ γιατροί, καὶ οἱ νοσοκόμοι φωνάζουν: «Νοσηλεία!». Τότε ὅλοι οἱ ἐπισκέπτες βγαίνουν ἀπὸ τοὺς θαλάμους καὶ οἱ ἄρρωστοι πηγαίνουν στὰ κρεββάτια τους καὶ περιμένουν τὸν γιατρό, γιὰ νὰ τὸν ἐνημερώσουν γιὰ τὴν κατάστασή τους καὶ νὰ τοὺς δώση τὴν ἀνάλογη θεραπεία. Ἔτσι κι ἐσύ, ὅταν ὁ ἱερέας λέη:«Μετὰ φόβου Θεοῦ», νὰ σκέφτεσαι ὅτι γίνεται νοσηλεία καὶ νὰ προσέρχεσαι στὴν Θεία Κοινωνία μὲ συναίσθηση τῆς ἁμαρτωλότητός σου, ζητώντας ταπεινὰ τὸ ἔλεος τοῦ Θεοῦ.'
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Ἡ Θεία Κοινωνία: Τὸ ἰσχυρότερο ἰαματικὸ φάρμακο'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κουραστήκατε πολὺ στὴν Θεία Λειτουργία[164]· δὲν ἔπρεπε νὰ μείνετε καὶ στὴν ἀνάγνωση τῆς «Εὐχαριστίας»[165].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί λές; Κοινώνησα καὶ νὰ μὴν πῶ ἕνα «εὐχαριστῶ» στὸν Θεό; Σὲ πολὺ μεγάλη ἀνάγκη μπορεῖ νὰ φύγη κανεὶς νωρίτερα. Κι ἐσὺ νὰ μὴ φεύγης ποτέ· νὰ ἀκοῦς τὴν «Εὐχαριστία» καὶ νὰ λὲς συνέχεια: «Σ’ εὐχαριστῶ, Θεέ μου· Σ’ εὐχαριστῶ. Δόξα σοι ὁ Θεός, δόξα σοι ὁ Θεός!» καὶ νὰ φτερουγίζη ἡ καρδιά σου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μιὰ φορὰ εἶχα πάει γιὰ Θεία Λειτουργία σὲ ἕνα Κελλί. Ἤμουν κουρασμένος καὶ ταλαιπωρημένος· ἤμουν καὶ νηστικός, ἐπειδὴ θὰ κοινωνοῦσα. Ἐκεῖ δὲν εἶχαν φωτιὰ καὶ σὲ ὅλη τὴν Ἀκολουθία ἔτρεμα ἀπὸ τὸ κρύο. Μόλις ὅμως κοινώνησα, ἔνιωσα νὰ διαπερνᾶ ὅλο μου τὸ σῶμα μιὰ θέρμη. Ὅπως ὅταν ἀνάβης κάτι ἠλεκτρικὲς σόμπες μὲ σπεῖρες, τὸ ρεῦμα ἀρχίζει νὰ περνάη σιγὰ-σιγὰ στὶς σπεῖρες, ἕνα τέτοιο πράγμα ἔνιωθα σὲ ὅλο μου τὸ σῶμα. Ἄρχισε σιγὰ-σιγὰ νὰ φλογίζεται. Μιὰ γλυκειὰ φλόγα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φλεγόμενος καὶ μὴ καιόμενος, Γέροντα…
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, φλεγόμενος… Γλυκειὰ φλόγα! Ὤ! πάει μετὰ καὶ ἡ πεῖνα, πάει καὶ ἡ κούραση, πάει καὶ τὸ κρύο...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πόσο κράτησε αὐτό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ ἔνιωσα στὸν ναό, μόλις κοινώνησα, καὶ μετὰ ποὺ ἔφυγα, ζεσταινόταν καὶ ὁ δρόμος!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς μερικοί, ἐνῶ εἶναι ἀσθενικοὶ στὸ σῶμα, ἔχουν ἀντοχὴ στὴν νηστεία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὸ μυστικὸ εἶναι ὁ ταπεινὸς καὶ φιλότιμος ἀγώνας, ποὺ συνοδεύεται μὲ προσευχὴ καὶ Μετάληψη τῶν ἀχράντων Μυστηρίων. Αὐτὰ τρέφουν τὴν ψυχή, τρέφουν καὶ τὸ σῶμα. Ὅταν κοινωνοῦμε, παίρνουμε τὸ ἰσχυρότερο ἰαματικὸ φάρμακο, τὸ Σῶμα καὶ τὸ Αἷμα τοῦ Χριστοῦ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – «Ψάλατε τῷ Θεῷ ἡμῶν, ψάλατε»[166]
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ ψαλμωδία εἶναι προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, πολλὲς φορὲς πηγαίνω στὸ ἀναλόγιο νὰ ψάλω, γιατὶ αἰσθάνομαι ὅτι αὐτὸ εἶναι καθῆκον μου. Εἶναι σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, καὶ ἡ ψαλτικὴ εἶναι μία διακονία. Γι’ αὐτὸ ὁ ἱερέας εὔχεται καὶ«ὑπὲρ τῶν ψαλλόντων»[167]. Ὁ ψάλτης ἀντιπροσωπεύει ὅλον τὸν λαὸ ποὺ ἐκκλησιάζεται. Αὐτὸ ὅμως δὲν σημαίνει ὅτι οἱ ἄλλοι δὲν χρειάζεται νὰ λένε τὸ«Κύριε ἐλέησον»μὲ τὸν νοῦ τους, ἀλλὰ νὰ περιμένουν προκοπὴ μόνον ἀπὸ τὸ ἕνα«Κύριε ἐλέησον»τοῦ ψάλτη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιὰ ἔψελναν ὅλοι οἱ πιστοὶ μαζί, καὶ κανονικὰ αὐτὸ εἶναι τὸ σωστό. Ἐπειδὴ ὅμως γινόταν χασμωδία καὶ σύγχυση, ἡ Ἐκκλησία, ποὺ εἶναι τὸ σύνολο τῶν πιστῶν, διαλέγει ὅσους γνωρίζουν νὰ ψάλλουν καὶ ἔχουν καλὴ φωνὴ καὶ λίγη εὐλάβεια, καὶ ὁρίζει νὰ ψάλλουν μόνον αὐτοί. Οἱ ὑπόλοιποι παρακολουθοῦν καὶ ψάλλουν νοερῶς καὶ χαίρονται, γιατὶ πρόσφεραν μερικοὺς ἀνθρώπους, γιὰ νὰ δοξολογήσουν τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτός, Γέροντα, ποὺ ἁπλῶς παρακολουθεῖ, τί προσφέρει στὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀφοῦ παρακολουθεῖ καὶ εὐχαριστιέται μὲ τὴν δοξολογία τοῦ Θεοῦ, δὲν εὐαρεστεῖται μὲ αὐτὸν ὁ Θεός; Εἶναι καὶ αὐτὸ μιὰ προσφορὰ στὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κατὰ τὴν διάρκεια μιᾶς ἀγρυπνίας ποὺ εἶναι ἀφιερωμένη σὲ ἕνα συγκεκριμένο θέμα πῶς μπορῶ νὰ προσευχηθῶ γιὰ τὸ θέμα αὐτὸ τὴν ὥρα ποὺ ψάλλω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρὶν ἀπὸ τὴν ἀγρυπνία μπορεῖς νὰ κάνης προσευχὴ γιὰ τὸ συγκεκριμένο θέμα καὶ μετά, ὅταν ψάλλης, νὰ λὲς στὰ ἐνδιάμεσα καμμιὰ εὐχή. Ἀλλὰ καὶ σὲ ὅλη τὴν ἀγρυπνία, ἂν ὁ νοῦς μαζὶ μὲ τὴν καρδιὰ εἶναι συνέχεια στὸ θέμα γιὰ τὸ ὁποῖο γίνεται προσευχή, τότε, εἴτε ψάλλεις εἴτε διαβάζεις Ψαλτήρι, κανόνες κ.λπ., αὐτὸ εἶναι προσευχὴ γιὰ τὸ συγκεκριμένο αἴτημα. Βλέπεις, ὅταν κάνουμε μιὰ ἀγρυπνία γιὰ ἕνα θέμα, μόνο δύο-τρεῖς αἰτήσεις ἀναφέρονται σὲ αὐτό. Ὅλα τὰ ἄλλα εἶναι ὅ,τι προβλέπει τὸ Τυπικό· ὅμως ἡ ἀγρυπνία εἶναι ἀφιερωμένη σὲ αὐτό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ καλὴ πνευματικὴ κατάσταση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ τρόπος ποὺ ψάλλω, Γέροντα, εἶναι βαρύς. Ἔχω τὸν λογισμὸ πὼς αὐτὸ ὀφείλεται στὸ ὅτι ἡ προφορά μου εἶναι βαρειά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σὲ ἔχω δεῖ καὶ …βαρειὰ καὶ …ἐλαφριά! Ὅταν εἶσαι βαρειά, τότε ψέλνεις καὶ βαριά. Ἀπὸ τὴν ἐσωτερική σου κατάσταση ξεκινάει αὐτό· αὐτὴν νὰ ἐλέγχης. Ἕνας ποὺ ἔχει λεπτὴ φωνή, ἂν εἶναι σὲ καλὴ πνευματικὴ κατάσταση, ἀκούγεται σὰν ἀηδονάκι· ἀλλιῶς, εἶναι σὰν νὰ τσιρίζη. Ἕνας ποὺ ἔχει χονδρὴ φωνή, ἂν δὲν εἶναι σὲ καλὴ κατάσταση, ἀκούγεται σὰν γέρος ποὺ μαλώνει. Ἂν ψάλετε μία-μία, θὰ καταλάβετε σὲ τί κατάσταση βρίσκεσθε ἐκείνη τὴν ὥρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ψάλλουμε στὸν ναό, προσέχουμε νὰ μὴ γίνωνται παραφωνίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φυσικά, χρειάζεται νὰ προσέχετε, γιατὶ ὅλα πρέπει νὰ γίνωνται«εὐσχημόνως καὶ κατὰ τάξιν»[168]. Πρῶτα ἀπὸ ὅλα ὅμως πρέπει νὰ φροντίζουμε νὰ ἐφαρμόσουμε τὸ«εὐσχημόνως»στὴν ψυχή μας, νὰ ὑπάρχη δηλαδὴ ἡ ψυχικὴ τάξη, νὰ εἴμαστε ἐντάξει μὲ τὸν Θεό. Ὅταν κανεὶς ψάλλη χωρὶς νὰ ἔχη καλὴ πνευματικὴ κατάσταση, αὐτὸ εἶναι χειρότερο ἀπὸ μιὰ μουσικὴ παραφωνία. Γιατί, ὅπως τὸ καλὸ φέρνει μιὰ καλὴ ἀλλοίωση, ἔτσι καὶ τὸ κακὸ φέρνει μιὰ κακὴ ἀλλοίωση, καὶ δὲν μποροῦν νὰ προσευχηθοῦν οἱ ἄνθρωποι. Ἂν δὲν εἶναι τακτοποιημένος ἐσωτερικὰ κανείς, ἂν ἔχη ἀριστεροὺς λογισμούς, μικροπρέπειες κ.λπ., τί ψαλτικὴ νὰ κάνη; Πῶς θὰ νιώση μέσα του τὴν παραδεισένια γλυκύτητα, γιὰ νὰ ψάλη μὲ τὴν καρδιά; Γι’ αὐτὸ λέει:«Εὐθυμεῖ τις; ψαλλέτω»[169]! Ὅσοι ψάλλουν, κανονικὰ πρέπει νὰ ἔχουν τὴν πιὸ τρυφερὴ καρδιὰ καὶ τὴν πιὸ γλυκειὰ καὶ χαρούμενη ἐσωτερικὴ κατάσταση. Πῶς νὰ ψάλης«Φῶς ἱλαρόν...», ἂν δὲν ἔχης ἱλαρότητα;
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὸ πᾶν εἶναι ἡ εὐλάβεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν μοῦ λένε ὅτι δὲν ψάλλω καλά, προσπαθῶ νὰ καταλάβω τί πρέπει νὰ κάνω τεχνικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αὐτὸ ποὺ πρέπει νὰ κάνης εἶναι νὰ προσπαθήσης νὰ ἀποκτήσης μοναχικὴ συνείδηση, εὐλάβεια, σύνεση, καὶ ὄχι νὰ ἔχης τὸν νοῦ σου στὴν τέχνη τὴν ἀνθρώπινη, τὴν ξερή. Ἡ τέχνη χωρὶς εὐλάβεια, εἶναι… μπογιές· εἶναι κάτι τὸ ἐξωτερικό, τὸ ψεύτικο, δὲν ἔχει φυσικότητα. Μερικοὶ ψάλτες στὸν κόσμο βάζουν «μπογιὲς» στὴν φωνή τους ἀπὸ ἀνάγκη, γιὰ νὰ πᾶνε σὲ μεγαλύτερο ναὸ καὶ νὰ αὐξηθῆ ὁ μισθός τους. Σοῦ λέει: «Ἂν μὲ βάλουν σὲ μικρότερη ἐνορία, πῶς θὰ τὰ βγάλω πέρα;». Ἐκεῖνοι τέλος πάντων δικαιολογοῦνται καὶ νὰ τεντωθοῦν καὶ νὰ φωνάξουν. Ὁ μοναχὸς ὅμως δὲν δικαιολογεῖται νὰ μὴν ψάλλη φυσικά. Νὰ προσέχετε, ἡ ψαλτική σας νὰ εἶναι φυσική, κατανυκτική, νὰ ψάλλετε γιὰ τὸν Θεὸ καὶ ὄχι γιὰ τὴν τέχνη τῆς ψαλτικῆς. Διακρίνεται στὴν ψαλτικὴ τὸ ἐσωτερικὸ καὶ καρδιακὸ ἀπὸ τὸ ἐξωτερικὸ καὶ τεχνητό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μήπως φταίει ἡ φωνή μου ποὺ ψάλλω κοσμικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν φταίει ἡ φωνή· φταίει ἡ τέχνη ἡ κοσμική. Ψάλλεις μὲ ἕναν στόμφο κοσμικό, ὅπως ἔψαλλαν μερικοὶ ψαλτάδες ποὺ ἄκουγες στὸν κόσμο. Εἶναι ψεύτικο τὸ ψάλσιμό σου. Νὰ μὴν καλουπώνης τὴν φωνή σου. Ξέρεις τί κουραστικὸ εἶναι; Νὰ ψάλλης μὲ ἐσωτερικότητα καὶ φυσικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, γιὰ ἕνα διάστημα νὰ μὴν ψάλλω καθόλου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὄχι, νὰ ψάλλης. Θὰ ἀκοῦς τὶς ἄλλες ἀδελφές, καὶ σιγὰ-σιγὰ θὰ φύγη αὐτὸ τὸ κοσμικό. Βλέπω καὶ στὸ Ἅγιον Ὄρος, τὰ νέα καλογέρια συνήθως ψάλλουν κοσμικά. Ἀφοῦ ἀκόμη δὲν ἔζησαν τὴν καλογερική, πῶς νὰ εἶναι καλογερικὸ τὸ ψάλσιμό τους; Ἀλλὰ καὶ οἱ Ἁγιορεῖτες ψάλτες, παλιὰ ποὺ δὲν εἶχαν ἐπικοινωνία μὲ ψάλτες κοσμικούς, εἶχαν πιὸ καλογερικὸ ὕφος. Τώρα ποὺ ἔρχονται σὲ ἐπικοινωνία, μπερδεύτηκαν λίγο, ὅπως τὰ πεπόνια χάνουν τὴν νοστιμιά τους, ὅταν ἡ πεπονιὰ βρεθῆ κοντὰ σὲ καμμιὰ κολοκυθιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τὸ πᾶν εἶναι ἡ εὐλάβεια. Χωρὶς εὐλάβεια ἡ ψαλτικὴ εἶναι ξεθυμασμένη· μοιάζει μὲ ὄργανο ξεκουρντισμένο, ποὺ κάνει γκλὶν-γκλίν. Οὔτε ἔχει σημασία ἂν ψάλλη κανεὶς δυνατὰ ἢ σιγανά· σημασία ἔχει νὰ ψάλλη μὲ εὐλάβεια. Τότε τὸ σιγανὸ ψάλσιμο εἶναι ταπεινό, γλυκό· δὲν εἶναι κοιμισμένο. Καὶ τὸ δυνατὸ εἶναι ἔντονο καὶ καρδιακό· δὲν εἶναι ἄγριο. Ὁ πατὴρ Μακάριος Μπουζίκας εἶχε βροντερὴ φωνή, ἀλλὰ ἔψελνε φυσικά, μὲ εὐλάβεια καὶ μὲ καημό· ἔνιωθες ὅτι ξεκοβόταν ἡ δική του καρδιά, καὶ ξεκολλοῦσε καὶ ἡ δική σου. «Σοῦ κάνει τὰ τζιέρια[170]ἄνω-κάτω», ἔλεγε ἕνα γεροντάκι. Ἔμενε μόνος του στὴν Καψάλα, σὲ ἕνα Σταυρονικητιανὸ Κελλί. Πιὸ κάτω ἔμενε ἕνας Ρουμάνος ποὺ δὲν ἦταν ψάλτης, ἀλλὰ εἶχε εὐλάβεια. Τὸ βράδυ ἔβγαινε ὁ πατὴρ Μακάριος στὴν ἁπλωταριὰ τοῦ Κελλιοῦ του καὶ ἄρχιζε τὸ«Ἀνοίξαντός σου τὴν χεῖρα»[171]καὶ συνέχιζε τὸν ἄλλο στίχο ὁ Ρουμάνος ἀπὸ κάτω! Ἦταν μεγαλεῖο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εἶναι μεγάλη ὑπόθεση ὁ ψάλτης νὰ ἔχη εὐλάβεια. Ξέρετε πόσο βοηθάει; Ἀλλοιώνεται ὁ ἴδιος ἐσωτερικά, καὶ ἐπειδὴ αὐτὴ ἡ ἐσωτερικὴ ἀλλοίωση ἐκδηλώνεται καὶ ἐξωτερικά, ἀλλοιώνεται καὶ ὁ ἄλλος ποὺ τὸν ἀκούει καὶ βοηθιέται θετικά. Ἔτσι ἡ προσευχὴ ὅλων εἶναι εὐπρόσδεκτη στὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '[Φωτογραφία του αγίου Παϊσίου να διαβάζει] [//223]'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὰ θεῖα νοήματα κεντοῦν τὴν καρδιὰ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μοῦ ἀρέσει ὁ δεύτερος ἦχος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ δεύτερος ἦχος εἶναι καθαρὰ ἀνατολίτικος, δηλαδὴ βυζαντινός. Δὲν τὸν πιάνει κανένα ὄργανο, μόνον τὸ βιολί[172]. Βλέπεις, οἱ Τοῦρκοι πῆραν τὴν μουσικὴ ἀπὸ τὸ Βυζάντιο καὶ μὲ τί καημὸ τραγουδοῦν! Καὶ τί λένε στὰ τραγούδια τους; «Νά 'χα πενῆντα δράμια κονιὰκ καὶ πενῆντα δράμια παστουρμᾶ, ὤ!...»[173]. Γιὰ πενῆντα δράμια κονιὰκ καὶ λίγο παστουρμᾶ συνεπαίρνονται! Κι ἐμεῖς ψάλλουμε γιὰ τὸν Χριστό, ποὺ σταυρώθηκε, ποὺ θυσιάσθηκε, καὶ νὰ μὴ συγκλονιζώμαστε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ὢ τρισμακάριστον ξύλον, ἐν ᾧ ἐτάθη Χριστός!»[174]. Ἂν σκεφθῆ κανεὶς τὸ Πάθος τοῦ Χριστοῦ, διαλύεται. Στὸ Κελλὶ τοῦ Τιμίου Σταυροῦ εἶχα βρεῖ ἕνα κομμάτι ξύλο γρεντὲ[175]μακρύ, ἕνα μέτρο περίπου, καὶ ἀμέσως θυμήθηκα τὸν Σταυρὸ τοῦ Χριστοῦ. Τὸ πῆρα μέσα στὸ κελλὶ καὶ τὸ ἀγκάλιαζα σὰν νὰ ἦταν ὁ Σταυρὸς τοῦ Χριστοῦ. Ὤ, πῶς χτυποῦσε ἡ καρδιά μου! Μὲ αὐτὸ κοιμόμουν!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκεφτόσασταν, Γέροντα, τὴν Σταύρωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μόνον τὴν Σταύρωση! Ἔνιωθα σὰν νὰ ἤμουν στὸν Γολγοθᾶ καὶ νὰ εἶχα ἀγκαλιασμένο τὸν Τίμιο Σταυρό. Ἂν ἦταν ὁ Τίμιος Σταυρός, δὲν ξέρω ἂν θὰ ἔνιωθα κάτι περισσότερο. Κόντευε νὰ σπάση ἡ καρδιά μου, καὶ δῶσ’ του δάκρυα, δῶσ’ του χτύπημα ἡ καρδιά! Οἱ τσατμάδες[176]– τὰ πλευρὰ – θὰ ἔσπαζαν. Ἔσφιγγα τὸ ξύλο, γιὰ νὰ μὴ σπάσουν τὰ πλευρά. Ἐσεῖς πιάνετε τὴν φυλλάδα μὲ τὴν Ἀκολουθία τοῦ Σταυροῦ, ψάλλετε«Σταυρὲ τοῦ Χριστοῦ, Χριστιανῶν ἡ ἐλπίς»[177], καὶ ὁ νοῦς σας δὲν εἶναι ἐκεῖ. Τότε πῶς θὰ ἀλλοιωθῆ ἡ ψυχή; Ἄχ, ἂν δουλέψη ἡ καρδιά, ἂν ἀλλοιωθῆ ἡ ψυχή, θὰ εἶναι πανηγύρι. Ξέρετε τί θὰ πῆ πανηγύρι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν κανεὶς παρακολουθῆ καὶ αἰσθάνεται αὐτὰ ποὺ ψάλλει, ἀπὸ ἐκεῖ ξεκινάει καὶ ἡ εὐλάβεια, ἀπὸ ἐκεῖ ἔρχεται καὶ ἡ κατάνυξη καὶ ὅλα. Γι’ αὐτὸ νὰ πιάνετε τὰκ-τὰκ τὰ θεῖα νοήματα, γιὰ νὰ κεντιέται ἡ καρδιά, νὰ τὰ νιώθη. Ἂν πάη τὸ τηλεγράφημα στὴν καρδιά, καὶ ἀπὸ μιὰ λέξη κεντιέται ὁ ἄνθρωπος, τινάζεται, ἀλλοιώνεται πνευματικά, καὶ τὰ ἄλλα ἁπλῶς τὰ παρακολουθεῖ καὶ εἶναι ἀλλοιωμένος μετὰ σὲ ὅλα. Ἐγώ, ὅταν ἀκούω τὸ«ἰλιγγιᾷ δὲ νοῦς, καὶ ὑπερκόσμιος, ὑμνεῖν σε, Θεοτόκε»[178], παθαίνω ἴλιγγο ἐκείνη τὴν στιγμή. Καὶ ὅταν ἀκούω τὸ«Εὐαγγελίζου, γῆ, χαρὰν μεγάλην»[179], ξέρετε πῶς γίνομαι; Σκιρτᾶ ἡ καρδιά μου, καὶ ὅλο τὸ σῶμα μου τρέμει ἀπὸ ἕνα γλυκὸ ρίγος. Ἀλλά, ἂν δὲν προσέχη κανεὶς στὰ νοήματα, δὲν ἀλλοιώνεται οὔτε ἡ καρδιὰ οὔτε τὸ σῶμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μὲ συγκινοῦν πολὺ τὰ πατριωτικὰ τραγούδια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τὸ πατριωτικὸ τραγούδι ξυπνάει τὴν ἀγάπη γιὰ τὴν πατρίδα, τονώνει τὸν ἡρωισμό, ἐμψυχώνει καὶ ἀναστατώνει. Στὴν Γερμανικὴ Κατοχὴ ἕνας τυφλὸς μὲ μιὰ φλογέρα ξέρετε πόσους ξεσήκωσε; Πόσο γλυκὰ καὶ μὲ τί καημὸ ἔπαιζε ὁ καημένος τὸ«Ἔχε γειά, καημένε κόσμε»! Πονοῦσε γιὰ τὸ ἔθνος καὶ ὁ πόνος του ἔβγαινε ἀπὸ τὴν φλογέρα! Ἅπλωνε τὸ καπέλο του καὶ ἔλεγε: «Ρίξτε στὸν τυφλό». Οἱ Γερμανοὶ ἔλεγαν «τυφλὸς εἶναι» καὶ τὸν ἄφηναν ἐλεύθερο· τοῦ ἔρριχναν καὶ χρήματα! Αὐτὸς ὅμως ἔκανε ...ἱεραποστολή! Ὅπως ἦταν ἀπογοητευμένος τότε ὁ κόσμος, τοὺς ἄναβε φλόγα μέσα τους καὶ πολλοὶ ἀναστατώνονταν καὶ ἀποφάσιζαν νὰ πᾶνε κατ’ εὐθεῖαν στὰ Τζουμέρκα στὸν Ζέρβα[180]. Σκεφθῆτε τώρα νὰ ξεσηκώνεσαι ἀπὸ τὴν ἀγάπη γιὰ τὸν Χριστό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἐγώ, ὅταν ἀκούω ἐμβατήρια, δὲν μπορῶ νὰ συγκρατηθῶ· μὲ πιάνουν τὰ κλάματα... Ὁ νοῦς μου πηγαίνει στὸν πόλεμο, στὸν ἀγώνα γιὰ τὴν ἀπελευθέρωση, στοὺς ἥρωες ποὺ σκοτώθηκαν, ποὺ ἔχυσαν τὸ αἷμα τους οἱ καημένοι. Ὅταν ἀκούω ἕνα τροπάριο κατανυκτικό, συγκλονίζομαι, ἡ καρδιά μου γίνεται σύντριμμα. Ἀκούω ἕνα δοξαστικὸ πασχαλινό, ἀγάλλομαι. Καὶ ὅταν ψέλνω, ὁ νοῦς μου εἶναι στὸν Θεὸ καὶ φτερουγίζει ἡ καρδιά μου. Ἂν ψάλλω κάτι πένθιμο, πονάω, ψάλλω μὲ καημό, πένθιμα. Ἂν ψάλλω κάτι χαρούμενο, χαίρομαι. Θέλω νὰ πῶ ὅτι ὁ νοῦς εἶναι ὅλη ἡ βάση. Εἶναι ὁ νοῦς στὰ θεῖα νοήματα; Τότε ἀλλοιώνεται ὁ ἄνθρωπος πνευματικά, ἡ καρδιά του φλογίζεται καὶ – πῶς νὰ πῆ κανεὶς – δέχεται αὐτὴν τὴν συγκίνηση τὴν πνευματικὴ μὲ τὴν ἀγαλλίαση τὴν πνευματική. Ἀλλά, ὅταν ὁ νοῦς του δὲν εἶναι ἐκεῖ ποὺ πρέπει, οὔτε συγκινεῖται οὔτε ἀγάλλεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ καρδιὰ εἶναι μουσικοσυνθέτης
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἡ ψαλμωδία δὲν εἶναι μόνον προσευχή, εἶναι καὶ μιὰ «παλαβωμάρα»· εἶναι – πῶς νὰ τὸ πῶ; – ἕνα ξέσπασμα τῆς καρδιᾶς, τὸ ξεχείλισμα τῆς πνευματικῆς καταστάσεως. Ὅταν κανεὶς θυμᾶται τὸν Χριστό, τὸν Παράδεισο, τότε ψάλλει μὲ τὴν καρδιά του. Καὶ ὅταν ἀρχίση νὰ γεύεται λιγάκι τὰ οὐράνια, σὲ κάθε τροπάριο σκιρτάει ἡ καρδιά του. Ἀκόμη καὶ νὰ μὴν εἶναι ὁ νοῦς του στὰ λόγια ἀλλὰ μόνο στὸν Παράδεισο, καὶ τότε σκιρτᾶ ἡ καρδιά. Ἡ καρδιὰ πάλλεται, ὅπως πάλλεται ἡ καρδιὰ τοῦ ἀηδονιοῦ. Τὸ ἀηδόνι, ὅταν κελαηδάη πάνω στὸ δένδρο, σείεται ὁλόκληρο καὶ αὐτὸ καὶ τὸ κλαδὶ ποὺ τὸ κρατάει. «Ἀφῆστε με, λέει, δὲν θέλω τίποτε· παλάβωσα!».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἔχω τὸν λογισμὸ ὅτι, ὅταν ψάλλω χωρὶς μουσικὸ βιβλίο, ψάλλω μὲ τὴν καρδιά μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στὸ μουσικὸ βιβλίο εἶναι κανεὶς περιορισμένος. Ἡ καρδιὰ ὅμως δὲν περιορίζεται. Ὅταν δουλεύη ἡ καρδιά, ξεφεύγει ἀπὸ τὸ περιορισμένο καὶ πάει στὸ ἀπεριόριστο, καὶ τότε γλυκαίνει ἡ ψαλμωδία! Τότε, ἀκόμη καὶ παραφωνία νὰ κάνης, καὶ αὐτὴ γλυκαίνει, γιατὶ τὴν γλυκαίνει ἡ καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στὴν περίπτωση ποὺ ὁ ψάλτης δὲν ψάλλει μόνος του, ἀλλὰ ψάλλει μὲ ὁλόκληρο χορό, πῶς μπορεῖ νὰ γίνη αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν ὁ πρωτοψάλτης ψάλλη μὲ τὴν καρδιά του, οἱ ἄλλοι ποὺ τὸν ἀκολουθοῦν, ἐπηρεάζονται, ἀναστατώνονται μὲ τὴν καλὴ ἔννοια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἄν, Γέροντα, ὁ πρῶτος δὲν ψάλλη μὲ τὴν καρδιά του, ὁ ἄλλος, ὅσο καρδιὰ καὶ νὰ ἔχη, δὲν μπορεῖ νὰ ψάλη μὲ τὴν καρδιά· θὰ πάρη τὸν χρόνο καὶ τὸν τόνο τοῦ πρώτου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδὴ τοῦ παίρνει καὶ τὴν καρδιὰ ὁ πρῶτος; Ἡ καρδιὰ δὲν ἐπηρεάζεται, βρὲ παιδί! Μπορεῖ νὰ εἶναι ὁ τελευταῖος καὶ νὰ ψάλλη σιγανώτερα, ἀλλά, ἂν βάζη καρδιά, θὰ τὸ πῆ μὲ τὴν καρδιά· δὲν μπορεῖ νὰ τὸ πῆ ἀλλιῶς. Τὸ λέει, καὶ μέσα του ἀναστατώνεται, φτερουγίζει ἡ καρδιά, βουρκώνουν καὶ τὰ μάτια του. Κατάλαβες; Δὲν τὸν ἐμποδίζει ὁ ἄλλος, ὅπως κι ἂν τὸ λέη. Μὴ δικαιολογούμαστε ἔτσι. Πάντως ἐγὼ δὲν δικαιολογῶ τὶς γυναῖκες νὰ μὴν ψάλλουν μὲ καρδιά, μὲ τόνο, μὲ καημό, γιατὶ εἶναι προικισμένες μὲ σπλάγχνα, μὲ αὐτὴν τὴν τρυφερὴ ἀγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἔχω τὸν λογισμὸ ὅτι τονίζουμε, ἀλλὰ ἐξωτερικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ τόνος στὴν ψαλτικὴ βγαίνει ἀπὸ μέσα, ἀπὸ τὴν καρδιά. Ὅταν ὁ νοῦς εἶναι στὰ θεῖα νοήματα, αὐτὸ εἶναι ποὺ θὰ δώση τὸν τόνο τὸν καρδιακό· ἡ καρδιὰ θὰ σπαράξη! Ἡ καρδιὰ εἶναι μουσικοσυνθέτης. Τὸ μεράκι, ὁ καημός, ὁ πόνος ποὺ ἔχει κανεὶς μέσα του, δίνει τὸν τόνο, τὴν ζωντάνια, τὸν παλμό, καὶ αὐτὸ γλυκαίνει τὴν ψαλμωδία. Κι ἐσεῖς, ἂν μπῆτε στὸ βαθύτερο νόημα, ξέρετε πόσο γλυκὰ θὰ τονίζετε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ μποῦμε στὸ πνεῦμα σας, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οἰνόπνευμα, οἰνόπνευμα! Βλέπεις, μερικοὶ ποὺ παίζουν ὄργανα, πίνουν καὶ λίγο, καὶ τραγουδοῦν μὲ μεράκι· ἔχουν δηλαδὴ κινητήριο δύναμη τὸ οἰνόπνευμα. Ἐσεῖς μὲ τὸ πνεῦμα νὰ κινῆσθε. Μὲ τὸ θεῖο Πῦρ καὶ τὸ Ἅγιο Πνεῦμα[181]!
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἕβδομο Μέρος – Κατάσταση Δοξολογίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Νὰ κινηθῆτε στὴν πνευματικὴ σφαῖρα,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: στὴν δοξολογία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: “Δόξα σοι ὁ Θεός, δόξα σοι ὁ Θεός”,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: νὰ λέτε συνέχεια».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Ἡ δοξολογία στὸν Θεὸ
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ δοξολογία ἔχει μέσα καὶ μετάνοια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, δὲν ἀγωνίζομαι ὅσο θὰ ἔπρεπε καὶ αὐτὸ μὲ στενοχωρεῖ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, νὰ δοξάζης τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πιὸ πολύ, Γέροντα, παρακαλῶ τὸν Θεὸ νὰ μὲ συγχωρήση, παρὰ Τὸν δοξολογῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ αὐτὸ καλὸ εἶναι, ἀλλὰ καλύτερα νὰ Τὸν δοξολογῆς. Μέσα στὴν δοξολογία ὑπάρχει καὶ μετάνοια, ἡ ὁποία, ἐπειδὴ ἔχει ταπείνωση, φέρνει τὴν θεία παρηγοριά. Τὸ«δόξα σοι ὁ Θεὸς»σημαίνει καὶ «συγχώρεσε, Θεέ μου, τὶς ἁμαρτίες μου, γιὰ νὰ Σὲ δοξολογῶ, ὅπως Σὲ δοξολογοῦν οἱ Ἄγγελοι».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικὲς φορές, Γέροντα, δὲν ἀρχίζω τὴν προσευχὴ ζητώντας τὸ ἔλεος τοῦ Θεοῦ γιὰ τὴν ἁμαρτωλότητά μου, ἀλλὰ ξεκινῶ μὲ δοξολογία. Μήπως αὐτὸ δὲν εἶναι σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔτσι νὰ κάνης. Δὲν εἴπαμε ὅτι ἡ δοξολογία ἔχει μέσα καὶ μετάνοια; Στὴν δοξολογία κλίνουν οἱ πρόσχαροι ἄνθρωποι. Βλέπεις, ἄλλη ψυχὴ λυπᾶται πολὺ ἀπὸ φιλότιμο γιὰ μιὰ πτώση της καὶ στὴν συνέχεια συγκινεῖ πολὺ τὸν Θεὸ μὲ τὴν μετάνοιά της. Ἄλλη, ἀφοῦ μετανοήση, εὐχαριστεῖ καὶ δοξολογεῖ μέρα-νύχτα τὸν Θεό, ποὺ τὴν λύτρωσε ἀπὸ τὴν προηγούμενη ἁμαρτωλὴ ζωή της, καὶ χαίρεται ὁ Θεὸς ἀπὸ τὸ φιλότιμο παιδί Του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ δοξολογία εἶναι ξέσπασμα τῆς εὐχαριστίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τόσο λίγο ποὺ ἔβρεξε, οὔτε τὰ φύλλα δὲν βράχηκαν[182]!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί νὰ σοῦ πῶ; Ἔστω καὶ αὐτὴ ἡ βροχὴ ποὺ δρόσισε μόνον τὰ φύλλα, λίγο εἶναι; Ἐγὼ καὶ μόνον ποὺ εἶδα σύννεφα στὸν οὐρανό, δὲν μπόρεσα νὰ κοιμηθῶ ἀπὸ τὴν εὐγνωμοσύνη πρὸς τὸν Θεὸ ποὺ ἔνιωθα μέσα μου. «Θεέ μου, ἔλεγα, δὲν ἀξίζουμε νὰ ρίξης βροχή». Πολὺ νὰ προσέχετε τὴν ἀχαριστία. Νὰ εὐχαριστῆτε τὸν Θεὸ γιὰ ὅλα ὅσα σᾶς δίνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν ὁ Θεὸς ἐκπληρώση κάποιο αἴτημά μας γιὰ μιὰ ὑπόθεση τοῦ Ἡσυχαστηρίου, πῶς θὰ ἐκφράσουμε τὴν εὐγνωμοσύνη μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νὰ κάνετε μιὰ ἀγρυπνία, γιὰ νὰ εὐχαριστήσετε τὸν Θεό, ποὺ βοήθησε μὲ τοὺς Ἁγίους Του. Καὶ νὰ κρατήσετε γιὰ πάντα αὐτὸ τὸ τυπικό: Μετὰ ἀπὸ κάθε αἴτημά σας ποὺ γίνεται μὲ καρδιακὴ προσευχὴ καὶ πόνο, μόλις ὁ Καλὸς Θεὸς τὸ ἐκπληρώση, νὰ κάνετε καρδιακὴ δοξολογία μὲ χαρὰ καὶ εὐχαριστία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς γίνεται ἡ δοξολογία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ δοξολογία γίνεται καὶ ἐκφώνως[183], γίνεται καὶ μόνο μὲ τὴν καρδιά, καὶ τότε ἡ εὐχαριστία εἶναι ἐσωτερική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πάντοτε, Γέροντα, στὴν δοξολογία ὑπάρχει καὶ εὐχαριστία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιά δοξολογία δὲν ἔχει εὐχαριστία; Καὶ οἱ Ἄγγελοι δὲν εὐχαριστοῦν τὸν Θεό, ὅταν Τὸν δοξολογοῦν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί διαφορὰ ἔχει, Γέροντα, ἡ δοξολογία ἀπὸ τὴν εὐχαριστία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἡ δοξολογία εἶναι χαρούμενη εὐχαριστία. Εἶναι ξέσπασμα τῆς εὐχαριστίας, σκίρτημα. Τὸ σκίρτημα αὐτὸ ἔρχεται ἀπὸ μέσα, ἀπὸ τὴν καρδιά. Μπορεῖ κάποιος νὰ μὴν ξέρη ἕνα τροπάριο ὁλόκληρο καὶ νὰ τὸ λέη μισὸ καὶ νὰ βάζη καὶ δικά του λόγια, καὶ ὅμως ἡ καρδιά του νὰ σκιρτᾶ. Ἂν εὐχαριστῆτε τὸν Θεὸ γιὰ τὶς πλούσιες εὐεργεσίες Του, ἐκεῖ μέσα στὴν εὐχαριστία καὶ στὴν δοξολογία θὰ νιώσετε ὅλον τὸν θεῖο Του πλοῦτο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἀπὸ τὴν εὐγνωμοσύνη πρὸς τὸν Θεὸ ξεκινάει ἡ δοξολογία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὸ αἴσθημα τῆς εὐγνωμοσύνης πρὸς τὸν Θεὸ εἶναι δοξολογία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἔμ, αὐτὸ εἶναι ὅλο. Ἀπὸ ἐκεῖ ξεκινάει ἡ δοξολογία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἡ εὐγνωμοσύνη πρὸς τὸν Θεὸ πῶς ἀποκτιέται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιὰ νὰ νιώσουμε μέσα μας εὐγνωμοσύνη πρὸς τὸν Θεό, πολὺ βοηθάει ἡ παρακολούθηση τοῦ ἑαυτοῦ μας καὶ ἡ σωστὴ συμπεριφορὰ καὶ εὐγνωμοσύνη πρὸς τὸν πλησίον. Ὅποιος αἰσθάνεται εὐγνωμοσύνη πρὸς τὸν πλησίον του γιὰ μιὰ μικρὴ εὐεργεσία ποὺ τοῦ κάνει, ἀναμφιβόλως ἡ εὐγνωμοσύνη του πρὸς τὸν Χριστό, ὁ Ὁποῖος τοῦ ἔδωσε καὶ τοῦ δίνει ἄφθονες εὐλογίες, θὰ εἶναι ἀπείρως μεγαλύτερη. Καὶ θὰ εἶναι συνέχεια γεμάτος εὐγνωμοσύνη, γιατί, ἐνῶ θὰ σκέφτεται πῶς νὰ ἐκδηλώση τὴν εὐγνωμοσύνη του στὸν Χριστό, ὁ Χριστὸς θὰ τοῦ δίνη καὶ ἄλλες περισσότερες καὶ μεγαλύτερες εὐλογίες, σὲ σημεῖο ποὺ νὰ λειώνη ἡ φιλότιμη ψυχὴ ἀπὸ τὴν ἀγάπη Του. Γιατί, ἂν ἡ ψυχὴ ἔχη τὴν πνευματικὴ λεπτότητα καὶ εὐχαριστῆ συνέχεια τὸν Θεὸ καὶ γιὰ τὶς πολὺ μικρὲς δωρεές Του, τότε καὶ Ἐκεῖνος ἀνταποκρίνεται πολλαπλάσια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὶς εὐεργεσίες τοῦ Θεοῦ νὰ τὶς σκέφτωμαι λεπτομερῶς ἢ γενικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν μπορῆς νὰ τὶς σκέφτεσαι μὲ λεπτομέρεια, αὐτὸ εἶναι τὸ καλύτερο. Ἂν παρακολουθῆς τὸ καθετὶ καὶ δὲν ξεχνιέσαι, θὰ αἰσθάνεσαι καὶ τὸ παραμικρὸ χάδι τοῦ Καλοῦ Θεοῦ καὶ θὰ ἔχης πολλὴ εὐγνωμοσύνη. Τὸ παιδάκι, ὅταν ἔχη τὸν νοῦ του στὴν μητέρα του, τότε νιώθει τὰ χάδια της. Ὅταν ὅμως εἶναι ξεχασμένο μὲ τὰ παιχνίδια του, ἐκείνη τὸ χαϊδεύει, τὸ φιλάει, ἀλλὰ αὐτὸ δὲν νιώθει τίποτε. Καὶ ὁ Θεὸς μᾶς χαϊδεύει συνέχεια. Ὁ ἄνθρωπος ποὺ σκέφτεται τὶς εὐεργεσίες τοῦ Θεοῦ, τινάζεται, συγκινεῖται, ραγίζει ἡ καρδιά του καὶ δοξάζει συνέχεια τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς νὰ σκιρτᾶ ἡ καρδιά μου ἀπὸ εὐγνωμοσύνη στὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μὲ τὴν ταπείνωση καὶ τὴν ἀγάπη συναισθάνεται ὁ ἄνθρωπος τὶς μεγάλες εὐεργεσίες τοῦ Θεοῦ καὶ γίνεται εὐγνώμων δοῦλος[184]. «Ἐμένα, Θεέ μου, λέει, δὲν πρέπει νὰ μὲ βοηθήσης ἄλλο· βοήθησε ἐκεῖνον ποὺ ἔχει περισσότερη ἀνάγκη, βοήθησε τὸν ἄλλον...». Καὶ ὅσο ὁ Θεὸς βλέπει τὴν ἀγάπη του καὶ τὴν ταπείνωσή του, τόσο τὸν λούζει μὲ τὴν Χάρη Του. Καὶ γίνεται αὐτὸ τὸ κυνηγητὸ συνέχεια: εὐγνωμοσύνη ὁ ἄνθρωπος, νέα δῶρα ὁ Θεός.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τὸ «δόξα σοι ὁ Θεὸς»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί σημαίνει τὸ«δόξα σοι ὁ Θεός»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '–«Δόξα σοι ὁ Θεὸς»θὰ πῆ «νὰ γίνη γνωστὸς ὁ Θεὸς στοὺς ἀνθρώπους». Βλέπεις καὶ ἐκεῖνο ποὺ εἶπε ὁ Χριστός:«Ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς... καὶ νῦν δόξασόν με σύ, Πάτερ»[185], μερικοὶ τὸ παρεξηγοῦν καὶ λένε: «Καὶ ὁ Χριστὸς ζητάει δόξα!». Ἐνῶ αὐτὸ σημαίνει: «Ἐγώ, Πατέρα, Σὲ ἔκανα γνωστὸ ἐπὶ τῆς γῆς, κάνε με γνωστὸ κι Ἐσύ, γιὰ νὰ πιστέψουν οἱ ἄνθρωποι».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αἰσθάνομαι τὴν ἀνάγκη νὰ λέω περισσότερο τὸ«δόξα σοι ὁ Θεὸς»παρὰ τὸ«Κύριε ἐλέησον». Μήπως δὲν εἶναι σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλὸ εἶναι αὐτό, εὐλογημένη. Ἐγὼ μπορεῖ νὰ περάσω ὁλόκληρη μέρα κάνοντας ἐργόχειρο καὶ λέγοντας «Δόξα σοι ὁ Θεός. Δόξα σοι ὁ Θεός, γιατὶ ζῶ. Δόξα σοι ὁ Θεός, γιατὶ θὰ πεθάνω καὶ θὰ πάω κοντὰ στὸν Θεό. Δόξα σοι ὁ Θεός, ἀκόμη καὶ ἐὰν μὲ βάλη στὴν κόλαση καὶ πάρη ἕναν κολασμένο στὸν Παράδεισο. Καὶ ἐὰν θέλη νὰ μὴ μὲ θυμᾶται στὴν κόλαση καὶ λυπᾶται, ἂς πάρη πολλοὺς κολασμένους στὸν Παράδεισο, ὥστε ἡ χαρά Του γι’ αὐτοὺς νὰ εἶναι περισσότερη καὶ νὰ λιγοστέψη ἡ στενοχώρια Του γιὰ μένα».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τὸ«δόξα σοι ὁ Θεὸς»νὰ μὴ λείπη ποτὲ ἀπὸ τὰ χείλη σας. Ἐγώ, ὅταν πονάω, τὸ«δόξα σοι ὁ Θεὸς»ἔχω γιὰ χάπι τοῦ πόνου· τίποτε ἄλλο δὲν μὲ πιάνει. Τὸ«δόξα σοι ὁ Θεὸς»εἶναι ἀνώτερο καὶ ἀπὸ τὸ «Κύριε Ἰησοῦ Χριστέ, ἐλέησόν με». Ἔλεγε ὁ Παπα-Τύχων: «Τὸ“Κύριε ἐλέησον”ἔχει ἑκατὸ δραχμές, τὸ “δόξα σοι ὁ Θεὸς”ἔχει χίλιες δραχμές· εἶναι δηλαδὴ πολὺ πιὸ ἀκριβό». Ἤθελε νὰ πῆ ὅτι ὁ ἄνθρωπος ζητάει τὸ ἔλεος τοῦ Θεοῦ ἀπὸ ἀνάγκη, ἐνῶ δοξολογεῖ τὸν Θεὸ ἀπὸ φιλότιμο, καὶ αὐτὸ ἔχει μεγαλύτερη ἀξία. Συνιστοῦσε μάλιστα νὰ λέμε τὸ«δόξα σοι ὁ Θεός», ὄχι μόνον ὅταν εἴμαστε καλά, ἀλλὰ καὶ ὅταν περνᾶμε δοκιμασίες, γιατὶ καὶ τὶς δοκιμασίες τὶς ἐπιτρέπει ὁ Θεὸς γιὰ φάρμακα τῆς ψυχῆς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικὲς φορές, ὅταν λέω «δόξα τῷ Θεῷ», νιώθω μέσα μου ἕνα φτερούγισμα. Τί εἶναι αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἀγαλλίαση πνευματικὴ εἶναι. Τώρα, ἐπειδὴ μοῦ ἔδωσες χαρὰ ποὺ λὲς«δόξα τῷ Θεῷ», ἀπὸ τὴν χαρά μου θὰ ἀρχίσω νὰ γράφω«δόξα τῷ Θεῷ,δόξα τῷ Θεῷ»,καὶ θὰ γεμίσω μία κόλλα χαρτὶ μὲ τὸ«δόξα τῷ Θεῷ»! Ὁ Θεὸς νὰ σὲ ἀξιώση στὴν ἄλλη ζωὴ νὰ εἶσαι μαζὶ μὲ τοὺς Ἀγγέλους ποὺ δοξολογοῦν συνέχεια τὸν Θεό. Ἀμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Ὁ χῶρος τῆς δοξολογίας
- type: h2
  initial:
    ru: ''
  text:
    ru: Οἱ δύο καταστάσεις τῆς δοξολογίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στὸν χῶρο τῆς δοξολογίας ὑπάρχουν δύο καταστάσεις. Ἂν ὁ ἄνθρωπος δὲν περάση ἀπὸ τὴν πρώτη, δὲν μπορεῖ νὰ φθάση στὴν δεύτερη. Στὴν πρώτη κατάσταση ἔχει κανεὶς πίκρες, ἀλλὰ ὅλα τὰ παίρνει δεξιά. Βάζει καλὸ λογισμό, ρίχνει τὸ βάρος στὸν ἑαυτό του, ταπεινώνεται, μετανοεῖ καὶ εὐχαριστεῖ γιὰ ὅλα τὸν Θεό: «Θεέ μου, λέει, Σὲ εὐχαριστῶ· ἐξ ἁμαρτιῶν μου τὰ περνῶ αὐτά. Μοῦ χρειάζονται καὶ περισσότερα, ἀλλὰ δὲν ἀντέχω. Σὲ παρακαλῶ, δῶσε μου ὑπομονὴ καὶ δύναμη, γιὰ νὰ ἀντέξω». Τότε βομβαρδίζεται ἀπὸ τὴν θεία παρηγοριὰ καὶ περνᾶ στὴν δεύτερη κατάσταση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στὴν δεύτερη κατάσταση βρίσκονται ὅσοι ἔχουν περάσει τὸ στάδιο τῆς μετανοίας καὶ ἔνιωσαν τὴν θεία παρηγοριὰ ποὺ φέρνει ἡ ἄφεση τῶν ἁμαρτιῶν· πέρασαν δηλαδὴ ἀπὸ τὸ χαροποιὸν πένθος καὶ ἔφθασαν στὴν δοξολογία. Τότε ὁ ἄνθρωπος δὲν ἔχει πίκρες, ἀλλὰ νιώθει μιὰ θεία ἀγαλλίαση, μιὰ εὐγνωμοσύνη πρὸς τὸν Θεό, ποὺ δὲν μπορεῖ νὰ τὴν ἀντέξη. Λέει συνέχεια τὸ«δόξα σοι ὁ Θεός», εὐχαριστεῖ τὸν Θεὸ γιὰ τὶς μεγάλες Του εὐεργεσίες, γιὰ τὴν μεγάλη Του ἀγάπη, καὶ μετὰ μόνη της ἡ ψυχὴ κινεῖται στὴν εὐχή, στὴν δοξολογία τοῦ Θεοῦ ἢ ζητᾶ συγχώρηση ἀπὸ τὸν Θεό, γιατὶ δὲν ἀνταποκρίθηκε στὶς εὐλογίες Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Παπα-Τύχων πῶς προσευχόταν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ Παπα-Τύχων εἶχε φθάσει στὸν χῶρο τῆς δοξολογίας καὶ ἀντὶ γιὰ τὴν εὐχὴ εἶχε τὴν δοξολογία. Συνέχεια ἄκουγε κανεὶς ἀπὸ τὸ στόμα του τὸ «δόξα σοι ὁ Θεός, δόξα σοι ὁ Θεός», καὶ ὅλες σχεδὸν οἱ ἡμέρες τοῦ χρόνου ἦταν γι’ αὐτὸν Διακαινήσιμες[186], ἀφοῦ ζοῦσε πάντα τὴν πασχαλινὴ χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅσοι βρίσκονται στὴν προχωρημένη αὐτὴ κατάσταση ἔχουν συνέχεια Πάσχα, Ἀνάσταση! Καμπάνες, σήμαντρα, τάλαντα, ὅλα μαζὶ χτυποῦν χαρμόσυνα[187].«Αἰνεῖτε Αὐτὸν ἐν κυμβάλοις εὐήχοις, αἰνεῖτε Αὐτὸν ἐν κυμβάλοις ἀλαλαγμοῦ»[188].Ὅλη τὴν ἡμέρα δοξολογοῦν τὸν Θεὸ καὶ χτυπᾶ σὰν καμπάνα ἡ καρδιά τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Δάκρυα μετανοίας καὶ δάκρυα δοξολογίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νὰ μᾶς ἐξηγήσετε αὐτὸ ποὺ γράφει ὁ Ἀββᾶς Ἰσαὰκ γιὰ τὰ δάκρυα:«Ἄλλα δάκρυα καίουσι καὶ ξηραίνουσι τὸ σῶμα καὶ ἄλλα δάκρυα εὐφραίνουσι καὶ τρέφουσιν αὐτό· καὶ ὅσα μὲν δάκρυα γεννῶνται ἐκ τῆς κατανύξεως τῆς ταπεινῆς καρδίας διὰ τὰς ἁμαρτίας, καίουσι καὶ ξηραίνουσι τὸ σῶμα(...)Τὰ τῆς δευτέρας[//239]τάξεως δάκρυα προέρχονται ἐκ τῆς γνώσεως καὶ συνέσεως, τὰ ὁποῖα καλλωπίζουσι τὸ πρόσωπον καὶ τρέφουσι τὸ σῶμα»[189].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τὰ πρῶτα δάκρυα εἶναι δάκρυα μετανοίας. Πονᾶς βαθιὰ καὶ εἰλικρινὰ γιὰ τὸ σφάλμα σου καὶ κλαῖς μὲ ταπείνωση. Τὰ δάκρυα αὐτὰ καταβάλλουν τὸν ἄνθρωπο, ἀλλὰ ἔχουν καὶ θεία παρηγοριά. Ὅταν ὅμως ἡ ψυχὴ συμφιλιωθῆ μὲ τὸν Θεό, ἔρχονται τὰ δάκρυα τῆς εὐγνωμοσύνης καὶ τῆς δοξολογίας, ποὺ εἶναι δάκρυα ἀγαλλιάσεως. Τότε ἡ ψυχὴ βρίσκεται σὲ ἄλλον χῶρο, φτερουγίζει στὴν ἁπαλὴ ἐκείνη γλυκύτητα, τὴν παραδεισένια. Στὴν δεύτερη αὐτὴν κατάσταση ὁ ἄνθρωπος καὶ μὲ λίγη τροφὴ περνάει. Εὐφραίνεται ἡ καρδιά, καὶ τὸ ἐλάχιστο ποὺ τρώει τὸν κρατάει, ἀλλὰ καὶ ἡ ἔλλειψη ὕπνου δὲν τὸν βλάπτει. Δὲν εἶναι ὅτι πιέζει τὸν ἑαυτό του, γιὰ νὰ μὴν κοιμηθῆ, ἀλλὰ ἀπὸ τὴν ὑπερβολικὴ ἀγαλλίαση δὲν μπορεῖ νὰ κοιμηθῆ. Φουντώνει ὁ θεῖος ἔρωτας στὴν καρδιὰ καὶ δὲν τοῦ κάνει καρδιὰ νὰ κοιμηθῆ. Ἐκείνη ἡ χαρὰ ἡ μεγάλη ἀναπληρώνει πολὺ ὕπνο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεῖ, Γέροντα, νὰ ψάλλη κανεὶς τὸ«Χριστὸς γεννᾶται, δοξάσατε»[190]μὲ δάκρυα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, μὲ πλημμύρα ἀπὸ δάκρυα, ἀπὸ εὐγνωμοσύνη!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, μπορεῖ νὰ κλαίη κανείς, ὅταν δοξολογῆ τὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αἰσθάνεται μία ἀνέκφραστη ἀγαλλίαση ἀπὸ εὐγνωμοσύνη, ποὺ δὲν κρατιέται ὁ ἄνθρωπος, τινάζεται. Αὐτὸ εἶναι τὸ πραγματικὸ ξέσπασμα δοξολογίας. Νὰ κινηθῆτε στὴν πνευματικὴ σφαῖρα, στὴν δοξολογία.«Δόξα σοι ὁ Θεός, δόξα σοι ὁ Θεὸς»νὰ λέτε συνέχεια. Μετὰ ὅλα θὰ σᾶς συγκινοῦν, γιὰ ὅλα θὰ νιώθετε μεγάλη εὐγνωμοσύνη πρὸς τὸν Θεό, καὶ ὁ Θεὸς θὰ σᾶς τρελλάνη μὲ τὶς πολλές Του εὐλογίες.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Οἱ δωρεὲς τοῦ Θεοῦ
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ Θεὸς δίνει σιγὰ-σιγὰ τὴν Χάρη Του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιατί, Γέροντα, ἄλλες φορὲς νιώθουμε ἔντονα τὴν θεία Χάρη στὴν προσευχὴ καὶ ἄλλες φορὲς δὲν αἰσθανόμαστε τίποτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὁ Καλὸς Θεός, γιὰ νὰ μᾶς βοηθήση νὰ ἀγωνιζώμαστε, μᾶς δίνει πότε-πότε τέτοιες εὐλογίες. Ὅπως δίνουμε σὲ ἕνα μικρὸ παιδὶ ἕνα σοκολατάκι καὶ τοῦ λέμε: «ἂν εἶσαι φρόνιμο, θὰ σοῦ δώσω καὶ ἄλλα», ἔτσι καὶ ὁ Θεὸς δίνει «σοκολάτες», γιὰ νὰ καταλάβουμε πόσο Γλυκὺς εἶναι καὶ νὰ ἀγωνισθοῦμε νὰ Τὸν εὐαρεστήσουμε, γιὰ νὰ πᾶμε κοντά Του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἡ γλυκύτητα ποὺ αἰσθάνεται στὴν προσευχὴ ὁ ἄνθρωπος ποὺ δὲν ἔχει καθαρισθῆ ἀκόμη ἀπὸ τὰ πάθη, μπορεῖ νὰ εἶναι μόνο συναίσθημα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στὴν ἀρχὴ μπορεῖ νὰ εἶναι καὶ λίγο συναίσθημα, ἀλλά, καθὼς ὡριμάζει κανεὶς πνευματικά, αὐτὸ λαμπικάρεται, ὅπως καὶ ἕνα φροῦτο, ὥσπου νὰ ὡριμάση, εἶναι λίγο ξινό, λίγο στυφό... Ὁ Θεὸς δίνει σιγὰ-σιγὰ τὴν Χάρη Του, γιὰ νὰ βοηθιέται ὁ ἄνθρωπος, γιατί, ἂν νιώση στὴν ἀρχὴ τὴν Χάρη τοῦ Θεοῦ, μπορεῖ νὰ τιναχθῆ στὸν ἀέρα. Ἂν ὅμως δὲν καταλάβη ὅτι καὶ αὐτὸ τὸ λίγο προέρχεται ἀπὸ τὸν Θεὸ καὶ τοῦ μπῆ ὁ λογισμὸς ὅτι κάτι εἶναι, τότε ὁ Θεὸς τοῦ τὸ ἀφαιρεῖ, ἕως ὅτου καταλάβη ὅτι δὲν ἦταν δικό του, ἀλλὰ τοῦ Θεοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικὲς φορές, Γέροντα, εἶμαι ὅλη τὴν ἡμέρα στὴν διακονία καὶ τὸ βράδυ, ὅταν πάω στὸ κελλί, δὲν μοῦ κάνει καρδιὰ νὰ ξεκουρασθῶ· ἔχω πολλὴ διάθεση γιὰ πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εἶναι εὐφορία πνευματική. Νὰ ἀξιοποιῆς αὐτὲς τὶς καταστάσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί νὰ λέω τότε στὸν Θεὸ γιὰ δοξολογία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νὰ λὲς στὸν Θεὸ ἁπλὰ ὅ,τι σὲ συγκινεῖ. Αὐτὴ ἡ κατάσταση εἶναι ἕνα χάδι τοῦ Θεοῦ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ θεία παρηγοριὰ στὴν προσευχὴ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε οἰκονομάει ὁ Θεὸς νὰ αἰσθανθῆ κάποιος θεία εὐωδία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁ Θεὸς δίνει εὐωδία ἄλλοτε τὴν ὥρα τῆς προσευχῆς καὶ ἄλλοτε σὲ ὥρα ποὺ δὲν προσεύχεσαι, γιὰ νὰ παρηγορήση, νὰ ἐνδυναμώση, νὰ πληροφορήση· πάντοτε γιὰ κάποιον σκοπό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὁρισμένες φορές, Γέροντα, ἐκεῖ ποὺ λέω τὴν εὐχὴ καὶ ζητῶ τὸ ἔλεος τοῦ Θεοῦ, αἰσθάνομαι κάποια ἀλλοίωση μέσα μου, μιὰ κατάνυξη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ὅταν ὁ ἄνθρωπος ζητᾶ ταπεινὰ τὸ ἔλεος τοῦ Θεοῦ καὶ ἀναγνωρίζη τὴν ἁμαρτωλότητά του, τότε ὁ Θεὸς τοῦ στέλνει τὴν Χάρη Του καὶ ἀλλοιώνεται πνευματικά. Πονάει ποὺ λύπησε τὸν Θεὸ μὲ τὶς ἁμαρτίες του, μετανοιώνει, νιώθει συντριβή, καὶ ὁ Θεὸς τὸν ἀνταμείβει μὲ αὐτὴν τὴν θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὅταν λέω τὴν εὐχή, νιώθω μιὰ παρηγοριά, μιὰ χαρά. Αὐτὸ εἶναι ἀπὸ τὸν Θεὸ ἢ εἶναι πλάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλὸ εἶναι αὐτό, ἀλλὰ καλύτερα νὰ μὴ δίνης σημασία. Ὅταν ὁ ἄνθρωπος δὲν δίνη σημασία σὲ αὐτά, ὁ Θεὸς συγκινεῖται περισσότερο καὶ τὸν βοηθάει μὲ ἄλλον τρόπο. Νὰ προσέξης νὰ μὴ ζητᾶς νὰ προσευχηθῆς, γιὰ νὰ νιώσης εὐχαρίστηση, χαρά. Τὸ παιδάκι τρέχει στὸν πατέρα του, ὄχι γιατὶ θὰ τοῦ δώση σοκολάτα, ἀλλὰ γιατὶ τὸν ἀγαπάει· ἄλλο ἂν ἐκεῖνος θελήση νὰ τοῦ δώση καὶ σοκολάτα. Ἡ προσευχὴ ποὺ κάνουμε, γιὰ νὰ νιώσουμε ἀγαλλίαση, καὶ ὄχι γιὰ νὰ ἑνωθοῦμε μὲ τὸν Θεό, δὲν εἶναι πραγματικὴ προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικὲς φορές, Γέροντα, ἐνῶ προσεύχομαι γιὰ κάποια δύσκολη κατάσταση, αἰσθάνομαι νὰ λέω μέσα μου δοξολογία. Εἶναι φυσιολογικὸ αὐτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μετὰ τὴν προσευχὴ νιώθεις θεία παρηγοριά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν ξέρω, Γέροντα, ἂν εἶναι θεία παρηγοριά, ἀλλὰ νιώθω μιὰ γαλήνη καὶ σιγουριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὸ ἔχει ἐλπίδα στὸν Θεὸ καὶ θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πῶς μπορεῖ, Γέροντα, νὰ καταλάβη κανεὶς ὅτι ἐπικοινωνεῖ σωστὰ μὲ τὸν Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν ἔχη μέσα του τὴν θεϊκὴ παρηγοριά. Αὐτὴ ἡ θεϊκὴ παρηγοριὰ δὲν συγκρίνεται μὲ τὴν ἀνθρώπινη, ὅπως ὁ Παράδεισος δὲν συγκρίνεται μὲ τὴν γῆ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κοπιάζω στὴν προσευχή, ἀλλὰ δὲν νιώθω παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αὐτὸ καλὸ εἶναι, γιατὶ δουλεύεις χωρὶς νὰ πληρώνεσαι. Ἂς δώσουμε ἐμεῖς τὴν καρδιά μας στὸν Θεὸ ζητώντας ταπεινὰ τὸ ἔλεός Του, καὶ Ἐκεῖνος ξέρει τί πρέπει νὰ μᾶς δώση. Ὁ πνευματικὸς ἄνθρωπος δὲν ἐπιδιώκει τίποτε ἄλλο ἐκτὸς ἀπὸ τὴν σωτηρία τῆς ψυχῆς του. Δὲν ἀγωνίζεται γιὰ τὶς θεῖες ἡδονές· ἀγωνίζεται μὲ φιλότιμο καὶ δέχεται ὅ,τι τοῦ δίνει ὁ Θεός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ἡ ἐπίσκεψη τῆς θείας Χάριτος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πῶς εἶναι τὸ ἄκτιστο φῶς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποῦ νὰ ξέρω; Ἐγὼ στὸ Καλύβι ἔχω μιὰ κτιστὴ σόμπα ποὺ τὴν ἀνάβω, γιὰ νὰ ζεσταθῶ. Ἂν θέλω φῶς, ἀνάβω ἕνα κερὶ καὶ βλέπω!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ποτὲ νὰ μὴ ζητάη κανεὶς φῶτα ἢ χαρίσματα τοῦ Θεοῦ, ἀλλὰ μόνο μετάνοια, ἡ ὁποία θὰ φέρη τὴν ταπείνωση, καὶ μετὰ ὁ Καλὸς Θεὸς θὰ τοῦ δώση ὅ,τι ἔχει ἀνάγκη. Πῆγα μιὰ φορὰ νὰ δῶ τὸν πατέρα Δαβὶδ τὸν Διονυσιάτη. Ἔμενε σὲ ἕνα κελλί, μέσα στὰ κουρέλια, μέσα στὸ σκοτάδι. Ἀλλὰ μέσα σ’ αὐτὸ τὸ σκοτεινὸ κελλί, ἐκεῖνος ζοῦσε μέσα στὸ φῶς. Ἦταν πολὺ προχωρημένος στὴν εὐχή, εἶχε φθάσει σὲ μεγάλη πνευματικὴ κατάσταση. Τρόμαξα νὰ τοῦ βγάλω κάτι! «Αὐτὰ δὲν λέγονται, δὲν λέγονται», ἔλεγε. Ξέρεις τί θὰ πῆ μέσα στὸ σκοτάδι νὰ βλέπης φῶς, χωρὶς νὰ ἔχης φῶς; Νὰ εἶσαι μέσα στὰ κουρέλια, καὶ νὰ βρίσκεσαι μέσα στὰ παλάτια τοῦ Θεοῦ!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '«Γιὰ νὰ λάβης πνεῦμα, πρέπει νὰ δώσης αἷμα»[191]. Ὅταν ἤμουν στὸ Κοινόβιο, μιὰ Μεγάλη Σαρακοστὴ προσπάθησα νὰ τὸ ἐφαρμόσω. Δὲν ὑπολόγισα καθόλου τὸν ἑαυτό μου, τράβηξα τὸ σχοινὶ μέχρι ποὺ τεντώθηκε τελείως. Ἔνιωθα τόση κούραση, ποὺ ἔπεφτα στὸν δρόμο καὶ παρακαλοῦσα τὸν Θεὸ νὰ μὲ βοηθήση νὰ σηκωθῶ λιγάκι, γιὰ νὰ μὴ μὲ δοῦν οἱ ἄνθρωποι καὶ ποῦν: «Νά, οἱ καλόγεροι πέφτουν ἀπὸ τὴν ἄσκηση». Τὸ ἔνιωθα κάθε μέρα σὰν μαρτύριο. Τὴν Πέμπτη πρὸ τοῦ Λαζάρου, τὸ βράδυ, ἐνῶ προσευχόμουν στὸ κελλί, ἔνιωσα μιὰ γλυκύτητα, μιὰ ἀγαλλίαση, κι ἕνα φῶς μὲ ἔλουσε· ἀπὸ τὰ μάτια μου ἔτρεχαν δάκρυα, ἕνα γλυκὸ κλάμα. Αὐτὸ κράτησε εἴκοσι μὲ τριάντα λεπτὰ καὶ μὲ τόνωσε πολύ, μὲ ἔτρεφε πνευματικὰ γιὰ δέκα χρόνια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ὅταν ρώτησα τὸν Γερο-Πέτρο[192]γι’ αὐτό, μοῦ εἶπε: «Ἐγὼ συνέχεια ζῶ τέτοιες θεῖες καταστάσεις. Ἐκείνη τὴν ὥρα ποὺ μὲ ἐπισκέπτεται ἡ θεία Χάρις, ἡ καρδιά μου θερμαίνεται γλυκὰ ἀπὸ τὴν ἀγάπη τοῦ Θεοῦ, καὶ ἕνα φῶς παράξενο μὲ φωτίζει ἐσωτερικὰ καὶ ἐξωτερικά· νιώθω τὸ πρόσωπό μου νὰ φωτίζη. Φωτίζεται ἀκόμη καὶ τὸ κελλί μου. Βγάζω τότε τὸ σκουφί μου, σκύβω ταπεινὰ τὸ κεφάλι μου καὶ λέω στὸν Χριστό: “Χριστέ μου, χτύπησέ με μὲ τὸ κοντάρι τῆς εὐσπλαγχνίας Σου στὴν καρδιά μου”. Ἀπὸ τὴν πολλὴ εὐγνωμοσύνη τὰ μάτια μου τρέχουν συνέχεια γλυκὰ δάκρυα καὶ δοξολογῶ τὸν Θεό. Τότε ὅλα σταματᾶνε, γιατὶ νιώθω πολὺ κοντά μου τὸν Χριστὸ καὶ δὲν μπορῶ πιὰ νὰ ζητήσω τίποτε· σταματάει καὶ ἡ προσευχή, τὸ κομποσχοίνι δὲν μπορεῖ νὰ γυρίση».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τὸ ἄκτιστο φῶς τὸ βλέπει κανεὶς μὲ τὰ αἰσθητὰ μάτια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ἂν ἀφήσετε τὶς μικρότητες, θὰ σᾶς πῶ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μέχρι νὰ ἀπαλλαγοῦμε ἀπὸ τὶς μικρότητες, ἐσεῖς θὰ φύγετε... Κάντε το σὰν πνευματικὴ ἐλεημοσύνη!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ὅταν ἤμουν στὰ Κατουνάκια, στὸ Κελλὶ τοῦ Ὑπατίου, ἕνα ἀπόγευμα, ἀφοῦ ἔκανα τὸν Ἑσπερινὸ μὲ κομποσχοίνι, ἤπια ἕνα τσάι καὶ συνέχισα.Ἔκανα τὸ Ἀπόδειπνο καὶ τοὺς Χαιρετισμοὺς μὲ κομποσχοίνι, καὶ ὕστερα ἔλεγα τὴν εὐχή. Ὅσο τὴν ἔλεγα, τόσο ἔφευγε ἡ κούραση καὶ αἰσθανόμουν ξεκούραστος. Ἔνιωθα μέσα μου μιὰ χαρά, ποὺ δὲν μοῦ ἔκανε καρδιὰ νὰ κοιμηθῶ· ἔλεγα συνέχεια τὴν εὐχή. Γύρω στὶς ἕντεκα τὴν νύχτα γέμισε ξαφνικὰ τὸ κελλὶ μὲ ἕνα φῶς γλυκό, οὐράνιο. Ἦταν πολὺ δυνατό, ἀλλὰ δὲν σὲ θάμπωνε. Κατάλαβα ὅμως ὅτι καὶ τὰ μάτια μου «δυνάμωσαν», γιὰ νὰ μπορῶ νὰ ἀντέξω αὐτὴν τὴν λάμψη. Ὅσο ἤμουν σὲ αὐτὴν τὴν κατάσταση, μέσα στὸ θεῖο ἐκεῖνο φῶς, ἤμουν σ’ ἕναν ἄλλον κόσμο, πνευματικό. Αἰσθανόμουν μιὰ ἀνέκφραστη ἀγαλλίαση, καὶ τὸ σῶμα μου ἀνάλαφρο· εἶχε χαθῆ τὸ βάρος τοῦ σώματος. Ἔνιωθα τὴν Χάρη τοῦ Θεοῦ, τὸν θεῖο φωτισμό. Θεῖα νοήματα περνοῦσαν γρήγορα ἀπὸ τὸν νοῦ μου σὰν ἐρωταποκρίσεις. Δὲν εἶχα προβλήματα, οὔτε θέματα νὰ ρωτήσω, ὅμως ρωτοῦσα καὶ εἶχα συγχρόνως καὶ τὴν ἀπάντηση. Ἦταν ἀνθρώπινα λόγια οἱ ἀπαντήσεις, εἶχαν ὅμως καὶ θεολογία, ἀφοῦ ἦταν θεῖες ἀπαντήσεις. Καὶ ἦταν τόσο πολλὰ ὅλα αὐτά, ὥστε, ἂν τὰ ἔγραφε κανείς, θὰ γραφόταν ἄλλος ἕναςΕὐεργετινός. Αὐτὸ κράτησε ὅλη τὴν νύχτα, μέχρι τὶς ἐννιὰ τὸ πρωί. Ὅταν πιὰ χάθηκε ἐκεῖνο τὸ φῶς, ὅλα μοῦ φαίνονταν σκοτεινά. Βγῆκα ἔξω καὶ ἦταν σὰν νύχτα. «Τί ὥρα εἶναι; Δὲν ἔφεξε ἀκόμη;», ρώτησα ἕναν μοναχὸ ποὺ περνοῦσε ἀπὸ ἐκεῖ. Ἐκεῖνος μὲ κοίταξε καὶ μοῦ ἀπάντησε μὲ ἀπορία: «Τί εἶπες, πάτερ Παΐσιε;». «Τί εἶπα;», ἀναρωτήθηκα καὶ μπῆκα μέσα. Κοιτάζω τὸ ρολόι καὶ τότε συνειδητοποίησα τί εἶχε συμβῆ. Ἡ ὥρα ἦταν ἐννιὰ τὸ πρωί, ὁ ἥλιος ἦταν ψηλά, κι ἐμένα ἡ ἡμέρα μοῦ φαινόταν σὰν νύχτα! Ὁ ἥλιος δηλαδὴ μοῦ φαινόταν ὅτι ἴσα-ἴσα φώτιζε· σὰν νὰ εἶχε γίνει ἔκλειψη ἡλίου. Ἤμουν σὰν ἕναν ποὺ πετιέται ἀπότομα ἀπὸ τὸ δυνατὸ φῶς στὸ σκοτάδι· τόσο μεγάλη ἦταν ἡ διαφορά! Μετὰ ἀπὸ ἐκείνη τὴν θεϊκὴ κατάσταση βρέθηκα στὴν ἄλλη, τὴν φυσική, τὴν ἀνθρώπινη, καὶ ξεκίνησα νὰ κάνω ὅπως κάθε μέρα τὸ πρόγραμμά μου. Ἔκανα λίγο ἐργόχειρο, ἔκανα τὴν Ἀκολουθία τῶν Ὡρῶν μὲ κομποσχοίνι, μετὰ τὴν Ἐνάτη Ὥρα ἔβρεξα λίγο παξιμάδι γιὰ νὰ φάω, ἀλλὰ ἔνιωθα σὰν ζῶο ποὺ πότε ξύνεται, πότε βόσκει, πότε χαζεύει, καὶ ἔλεγα μέσα μου: «Γιά δὲς μὲ τί ἀσχολοῦμαι! Τόσα χρόνια ἔτσι τὰ πέρασα;». Μέχρι τὸ ἀπόγευμα εἶχα τέτοια ἀγαλλίαση, ποὺ δὲν ἔνιωθα τὴν ἀνάγκη νὰ ξεκουραστῶ. Τόσο δυνατὴ ἦταν ἡ κατάσταση αὐτή. Ὅλη ἐκείνη τὴν ἡμέρα ἔβλεπα θαμπά· ἴσα-ἴσα ποὺ μποροῦσα νὰ κάνω τὴν δουλειά μου. Καὶ ἦταν καλοκαίρι· ὁ ἥλιος ἔλαμπε. Τὴν ἄλλη μέρα ἄρχισα νὰ βλέπω τὰ πράγματα φυσιολογικά. Ἔκανα τὸ ἴδιο τυπικό, ἀλλὰ δὲν ἔνιωθα πιὰ ἔτσι, σὰν ζῶο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μὲ τί χαζὰ πράγματα περνοῦμε τὸν καιρό μας καὶ τί χάνουμε! Γι’ αὐτό, ὅταν βλέπω μικρότητες, κακομοιριές, χαμένα πράγματα, πολὺ στενοχωριέμαι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ὁ νοῦς κοντὰ στὸν Χριστὸ σιωπώντας…
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ὁ Ἀββᾶς Ἰσαὰκ γράφει:«Ὁ ταπεινόφρων, ὅταν παρίσταται ἐνώπιον τοῦ Θεοῦ, δὲν θέλει τολμήσει νὰ προσευχηθῇ»[193]. Δηλαδὴ τί κάνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αἰσθάνεται τὸν ἑαυτό του ἀνάξιο νὰ προσευχηθῆ, νὰ συνομιλήση μὲ τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καὶ τί κάνει, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τοῦ ἀρκεῖ αὐτό· τὸ ὅτι παρίσταται ἐνώπιον τοῦ Θεοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ἐσεῖς μὲ τί τρόπους καλλιεργούσατε τὴν εὐχὴ στοὺς διαφόρους τόπους ποὺ μονάσατε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χανόμουν στὴν εὐχή! Ξέρεις τί θὰ πῆ χανόμουν; Βυθιζόμουν…, ἕνα γλυκὸ βύθισμα…
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θέλετε νὰ πῆτε, Γέροντα, ὅτι χάνατε τὴν αἴσθηση τοῦ τόπου καὶ τοῦ χρόνου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, χανόμουν τελείως… Γιὰ νὰ φέρω ἕναν λογισμό, ἔπρεπε νὰ σταματήσω τὴν εὐχή. Ξέρεις τί θὰ πῆ νὰ βυθίζεσαι-νὰ βυθίζεσαι... Μετὰ δὲν θέλεις τίποτε, δὲν ζητᾶς τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μετά, Γέροντα, λὲς μόνον τὸ«Κύριε Ἰησοῦ Χριστέ, ἐλέησόν με»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δὲν λὲς τίποτε· νιώθεις τὴν θεία θέρμη, τὴν θεία γλυκύτητα. Σταματάει πλέον καὶ ἡ εὐχή, ἐπειδὴ ὁ νοῦς ἔχει ἑνωθῆ μὲ τὸν Θεὸ καὶ δὲν θέλει μὲ κανέναν τρόπο νὰ φύγη ἀπὸ κοντά Του· τόσο εὐχάριστα νιώθει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν φθάση σ’ αὐτὴν τὴν κατάσταση ὁ ἄνθρωπος, ἡ εὐχὴ κόβεται μόνη της. Τότε σταματάει καὶ ὁ νοῦς ἀπὸ τὴν παρουσία τοῦ Θεοῦ, παύει νὰ λειτουργῆ καὶ τὸ μυαλό, καὶ ἡ ψυχὴ αἰσθάνεται μόνον τὴν γλυκύτητα τῆς θείας ἀγάπης, τῆς θείας στοργῆς καὶ σιγουριᾶς, σὰν τὸ μωρὸ ποὺ δὲν σκέφτεται τίποτε, ἀλλὰ μόνον ἀγάλλεται στὴν ἀγκαλιὰ τῆς μάνας του. Ὅταν τὸ παιδάκι λουφάζη στὴν ἀγκαλιὰ τῆς μάνας, μιλάει; Εἶναι ἕνωση πλέον, ἐπικοινωνία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλὴ εἶναι ἡ εὐχὴ μὲ τὴν σιωπή,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'ἀλλὰ καλύτερη εἶναι ἡ σιωπὴ μὲ τὴν σιωπή:'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ὁ νοῦς κοντὰ στὸν Χριστὸ σιωπώντας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Παράρτημα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '[Φωτογραφία από το ΨΑΛΤΗΡΙΟ (βιβλίο) του αγίου Παϊσίου]'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὁ Γέροντας Παΐσιος πρὸς τὸν Ἅγιο Ἀρσένιο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ὅσο καὶ νὰ κοπιάσω ἐγώ, ἐὰν δὲν κάμης τὸν ἐνδιάμεσο, σήματά μου –0- (πολλὰ παράσιτα). Δι’ αὐτό, κάμε ὅ,τι μοῦ ἔκαμες ἐκείνη τὴν φορά. Ἐὰν ἐξ αἰτίας τῶν ἁμαρτιῶν μου δὲν θὰ μὲ ἀκοῦς, δὲν εἶναι σωστὸ νὰ ταλαιπωρῆται ὁ κόσμος ἐξ αἰτίας μου, ἀλλ’ ἐμένα νὰ τιμωρήσης μὲ τὸν τρόπο σου σὰν Καλὸς Πατέρας. Πάτερ μου, Πάτερ μου, Πάτερ μου».(βλ. σ. 252)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '[Φωτογραφία του αγίου Παϊσίου]'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὁ Γέροντας μπροστὰ στὰ ἱερὰ Λείψανα τοῦ Ἁγίου Ἀρσενίου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τὸ κείμενο τῆς σελ. 250 τὸ εἶχε γράψει ὁ Γέροντας Παΐσιος στὴν ἀρχὴ τοῦ Ψαλτηρίου του. Μὲ τὴν φράση«κάνε ὅ,τι μοῦ ἔκανες ἐκείνη τὴν φορά», ἀναφέρεται στὸ ἑξῆς γεγονὸς ποὺ τοῦ συνέβη τὸ 1971: Εἶδε ὅτι βρέθηκε σὲ ἕνα μεγάλο χωράφι, ὅπου εἶχε νὰ θερίση«ἕνα μικρὸ κομμάτι», καὶ στὴν ἄλλη πλευρὰ ἦταν ἕνα κτίριο Διαβιβάσεων, στὸ ὁποῖο εἶχε«ἕνα μικρὸ γραφεῖο μὲ ὑπεύθυνη ἐργασία». Γι’ αὐτὸ πότε θέριζε καὶ πότε πήγαινε στὸ γραφεῖο, γιὰ νὰ διαβιβάση τὰ σήματα ποὺ συγκεντρώνονταν. Ἀλλά, κάθε φορὰ ποὺ ἐπέστρεφε στὸ γραφεῖο, εὕρισκε ἐκεῖ ἕναν Ἀξιωματικὸ νὰ διαβιβάζη ἐκεῖνος τὰ σήματα. Ὁ Ἀξιωματικὸς αὐτὸς τοῦ εἶπε ὅτι εἶναι ὁ Ἅγιος Ἀρσένιος. Ἐπίσης, μὲ τὴν προσφώνηση«Πάτερ μου, Πάτερ μου, Πάτερ μου!»ὁ Γέροντας ἀναφέρεται σὲ κάποια φορὰ (πάλι τὸ 1971) ποὺ τὸν ἐπισκέφθηκε ὁ Ἅγιος Ἀρσένιος καὶ τὸν γέμισε μὲ τόση«γλυκύτητα καὶ ἀγαλλίαση οὐράνια», ὥστε, ὅταν ὁ Ἅγιος ἔφυγε, ἐκεῖνος τὸν ἀναζητοῦσε φωνάζοντας:«Πάτερ μου, Πάτερ μου!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: (Βλ. Γέροντος Παϊσίου Ἁγιορείτου,Ὁ Ἅγιος Ἀρσένιος ὁ Καππαδόκης, σ. 32–35).
- type: h2
  initial:
    ru: ''
  text:
    ru: Περιπτώσεις Τῶν Ψαλμῶν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 1ος(Μακάριος ἀνήρ, ὃς οὐκ ἐπορεύθη)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν φυτεύουν δένδρα ἢ ἀμπέλι, γιὰ νὰ καρποφορήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 2ος(Ἵνα τί ἐφρύαξαν ἔθνη;)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση φώτιση ὁ Θεὸς σ’ αὐτοὺς ποὺ πηγαίνουν σὲ συνέδρια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 3ος(Κύριε, τί ἐπληθύνθησαν οἱ θλίβοντές με;)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φύγη ἡ κακία ἀπὸ τοὺς ἀνθρώπους, γιὰ νὰ μὴ βασανίζουν καὶ θλίβουν ἄδικα τοὺς συνανθρώπους τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 4ος(Ἐν τῷ ἐπικαλεῖσθαί με εἰσήκουσάς μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τοὺς εὐαίσθητους ἀνθρώπους, ποὺ ἀρρώστησαν ἀπὸ μελαγχολία ἀπὸ τὴν συμπεριφορὰ τῶν σκληρόκαρδων ἀνθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 5ος(Τὰ ῥήματά μου ἐνώτισαι, Κύριε)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τὰ πληγωμένα, χτυπημένα μάτια ἀπὸ κακὸν ἄνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 6ος(Κύριε, μὴ τῷ θυμῷ σου ἐλέγξῃς με)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐλευθερώση ὁ Θεὸς τὸν μαγευμένο ἄνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 7ος(Κύριε ὁ Θεός μου, ἐπὶ σοὶ ἤλπισα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αὐτοὺς ποὺ ἔπαθαν ἀπὸ φοβία ἀπὸ τὶς φοβέρες καὶ τὶς ἀπειλὲς τῶν κακῶν ἀνθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 8ος(Κύριε ὁ Κύριος ἡμῶν, ὡς θαυμαστὸν τὸ ὄνομά σου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αὐτοὺς ποὺ ἔπαθαν κακὸ ἀπὸ δαίμονες ἢ ἀπὸ πονηροὺς ἀνθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 9ος(Ἐξομολογήσομαί σοι, Κύριε... διηγήσομαι πάντα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ πάψουν νὰ σὲ φοβερίζουν οἱ δαίμονες στὸν ὕπνο ἢ μὲ φαντασίες τὴν ἡμέρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 10ος(Ἐπὶ τῷ Κυρίῳ πέποιθα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ σκληρόκαρδα ἀνδρόγυνα ποὺ μαλώνουν καὶ χωρίζουν. (Ὅταν βασανίζη ἄδικα ὁ σκληρὸς ἢ ἡ σκληρὴ τὸν εὐαίσθητο).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 11ος(Σῶσόν με, Κύριε, ὅτι ἐκλέλοιπεν ὅσιος)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ τρελλοὺς ποὺ ἔχουν καὶ κακότητα καὶ κάνουν κακὸ στοὺς ἀνθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 12ος(Ἕως πότε, Κύριε, ἐπιλήσῃ μου εἰς τέλος;)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αὐτοὺς ποὺ πάσχουν ἀπὸ τὸ συκώτι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 13ος(Εἶπεν ἄφρων ἐν καρδίᾳ αὐτοῦ· Οὐκ ἔστι Θεὸς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ φοβερὸ δαιμόνιο (3 φορὲς τὴν ἡμέρα ἐπὶ 3 ἡμέρες).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 14ος(Κύριε, τίς παροικήσει ἐν τῷ σκηνώματί σου;)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἀλλάξουν γνώμη οἱ ληστὲς καὶ νὰ ἐπιστρέψουν ἄπρακτοι καὶ μετανοημένοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 15ος(Φύλαξόν με, Κύριε, ὅτι ἐπὶ σοὶ ἤλπισα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ βρεθῆ τὸ κλειδί, ὅταν χαθῆ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 16ος(Εἰσάκουσον, Κύριε, τῆς δικαιοσύνης μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ μεγάλη συκοφαντία(3 φορὲς τὴν ἡμέρα ἐπὶ 3 ἡμέρες).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 17ος(Ἀγαπήσω σε, Κύριε, ἡ ἰσχύς μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν γίνεται σεισμὸς ἢ θεομηνία, κατακλυσμὸς καὶ κεραυνοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 18ος(Οἱ οὐρανοὶ διηγοῦνται δόξαν Θεοῦ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐλευθερωθοῦν οἱ μητέρες στὴν γέννα τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 19ος(Ἐπακούσαι σου Κύριος ἐν ἡμέρᾳ θλίψεως)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ ἀνδρόγυνα ποὺ δὲν γεννοῦν, λόγῳ ἀναπηρίας, γιὰ νὰ τοὺς θεραπεύση ὁ Θεός, γιὰ νὰ μὴ χωρίσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 20ος(Κύριε, ἐν τῇ δυνάμει σου εὐφρανθήσεται ὁ βασιλεὺς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μαλακώση ὁ Θεὸς τὶς καρδιὲς τῶν πλουσίων, νὰ κάνουν ἐλεημοσύνες στοὺς φτωχούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 21ος(Ὁ Θεὸς ὁ Θεός μου, πρόσχες μοι)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐμποδίση ὁ Θεὸς τὴν πυρκαγιά, γιὰ νὰ μὴ γίνη κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 22ος(Κύριος ποιμαίνει με, καὶ οὐδέν με ὑστερήσει)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἡμερέψη ὁ Θεὸς τὰ ἄτακτα καὶ ἀνυπάκουα παιδιά, ποὺ θλίβουν τοὺς γονεῖς τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 23ος(Τοῦ Κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἀνοίξη ἡ πόρτα, ὅταν χαθῆ τὸ κλειδί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 24ος(Πρὸς σέ, Κύριε, ἦρα τὴν ψυχήν μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ ἀνθρώπους ποὺ φθονεῖ πολὺ ὁ πειρασμὸς καὶ τοὺς φέρνει συνέχεια ἀναποδιὲς στὴν ζωή τους, γιὰ νὰ γογγύσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 25ος(Κρῖνόν με, Κύριε, ὅτι ἐγὼ ἐν ἀκακίᾳ μου ἐπορεύθην)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν ζητάη κανεὶς κάτι καλὸ ἀπὸ τὸν Θεό, γιὰ νὰ τοῦ τὸ δώση, χωρὶς νὰ τὸν βλάψη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 26ος(Κύριος φωτισμός μου καὶ σωτήρ μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προστατέψη ὁ Θεὸς τοὺς χωρικοὺς ἀπὸ τὰ ἐχθρικὰ στρατεύματα, νὰ μὴν κάνουν κακὸ στοὺς ἀνθρώπους καὶ λεηλασίες στὶς ἀγροικίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 27ος(Πρὸς σέ, Κύριε, κεκράξομαι)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τοὺς νευρασθενεῖς καὶ ὅσους πάσχουν ἀπὸ νευρόπονους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 28ος(Ἐνέγκατε τῷ Κυρίῳ, υἱοὶ Θεοῦ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αὐτοὺς ποὺ τοὺς πειράζει ἡ θάλασσα καὶ φοβοῦνται στὴν πολλὴ φουρτούνα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 29ος(Ὑψώσω σε, Κύριε, ὅτι ὑπέλαβές με)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αὐτοὺς ποὺ κινδυνεύουν μακριά, μέσα σὲ βάρβαρους καὶ ἄπιστους λαούς, γιὰ νὰ τοὺς φυλάξη ὁ Θεός, καὶ νὰ φωτίση κι ἐκείνους νὰ ἡμερέψουν καὶ νὰ γνωρίσουν τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 30ος(Ἐπὶ σοί, Κύριε, ἤλπισα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση ὁ Θεὸς ἀφθονία σπαρτῶν καὶ καρπῶν στὰ δένδρα, ὅταν ὁ καιρὸς δὲν εἶναι εὐνοϊκός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 31ος(Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ βροῦν οἱ ὁδοιπόροι τὸν δρόμο, ὅταν χαθοῦν καὶ ταλαιπωροῦνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 32ος(Ἀγαλλιᾶσθε, δίκαιοι, ἐν Κυρίῳ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φανερώση ὁ Θεὸς τὴν ἀλήθεια στοὺς ἀδικοφυλακισμένους, γιὰ νὰ ἐλευθερωθοῦν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 33ος(Εὐλογήσω τὸν Κύριον ἐν παντὶ καιρῷ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ ψυχορραγοῦντες, ὅταν βασανίζωνται ἀπὸ τοὺς δαίμονες τὴν ὥρα τοῦ θανάτου ἢ σὲ ἐχθρικὰ στρατεύματα, ὅταν ἀπειλοῦν καὶ παραβιάζουν τὰ σύνορα, γιὰ νὰ κάνουν κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 34ος(Δίκασον, Κύριε, τοὺς ἀδικοῦντάς με)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐλευθερώση ὁ Θεὸς τοὺς καλοκάγαθους ἀνθρώπους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ἀπὸ τὶς παγίδες τῶν πονηρῶν ἀνθρώπων, ποὺ ἐκμεταλλεύονται τοὺς ἀνθρώπους τοῦ Θεοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 35ος(Φησὶν ὁ παράνομος τοῦ ἁμαρτάνειν ἐν ἑαυτῷ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐξαλειφθῆ τελείως ἡ ἔχθρα μετὰ ἀπὸ τὰ μαλώματα ἢ τὶς παρεξηγήσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 36ος(Μὴ παραζήλου ἐν πονηρευομένοις)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ βαριὰ πληγωμένους ἀνθρώπους ἀπὸ κακοποιοὺς ἐγκληματίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 37ος(Κύριε, μὴ τῷ θυμῷ σου ἐλέγξῃς με)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν πονᾶνε οἱ σιαγόνες ἀπὸ σάπια δόντια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 38ος(Εἶπα· Φυλάξω τὰς ὁδούς μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ βροῦν ἐργασία οἱ ἐγκαταλελειμμένοι καὶ δυστυχισμένοι ἄνθρωποι, γιὰ νὰ μὴ θλίβωνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 39ος(Ὑπομένων ὑπέμεινα τὸν Κύριον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐπανέλθη ἀγάπη μεταξὺ ἀφεντικοῦ καὶ ὑπαλλήλων, ὅταν δημιουργοῦνται προστριβές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 40ος(Μακάριος ὁ συνιῶν ἐπὶ πτωχὸν καὶ πένητα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐλευθερωθοῦν οἱ μητέρες στὴν γέννα, ἀπὸ πρόωρο τοκετό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 41ος(Ὃν τρόπον ἐπιποθεῖ ἡ ἔλαφος)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ νὲους ποὺ ἀρρωσταίνουν ἀπὸ ἔρωτα, ὅταν τραυματίζεται τὸ ἕνα πρόσωπο καὶ θλίβεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 42ος(Κρῖνόν μοι, ὁ Θεός, καὶ δίκασον τὴν δίκην μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐλευθερωθοῦν οἱ αἰχμάλωτοι ἀπὸ τὶς φυλακὲς τοῦ ἐχθρικοῦ ἔθνους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 43ος(Ὁ Θεός, ἐν τοῖς ὠσὶν ἡμῶν ἠκούσαμεν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φανερώση ὁ Θεὸς τὴν ἀλήθεια στὰ παρεξηγημένα ἀνδρόγυνα, γιὰ νὰ συμφιλιωθοῦν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 44ος(Ἐξηρεύξατο ἡ καρδία μου λόγον ἀγαθὸν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ τοὺς ἀνθρώπους ποὺ πάσχουν ἀπὸ τὴν καρδιὰ ἢ ἀπὸ τὰ νεφρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 45ος(Ὁ Θεὸς ἡμῶν καταφυγὴ καὶ δύναμις)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ τοὺς νέους ποὺ ἐμποδίζει ὁ ἐχθρὸς ἀπὸ φθόνο νὰ δημιουργήσουν οἰκογένεια (νὰ παντρευτοῦν).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 46ος(Πάντα τὰ ἔθνη, κροτήσατε χεῖρας)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εἰρηνεύση ὁ ὑπηρέτης ἢ ὁ δοῦλος, ὅταν φύγη πληγωμένος ἀπὸ τὸ ἀφεντικό του, καὶ νὰ βρῆ δουλειά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 47ος(Μέγας Κύριος καὶ αἰνετὸς σφόδρα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν γίνωνται μεγάλες καταστροφὲς καὶ ληστεῖες ἀπὸ βαρβαρικὲς συμμορίες πειρατῶν.(Νὰ διαβάζεται συνέχεια ἐπὶ 40 ἡμέρες).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 48ος(Ἀκούσατε ταῦτα, πάντα τὰ ἔθνη)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αὐτοὺς ποὺ κάνουν ἐπικίνδυνη δουλειά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 49ος(Θεὸς θεῶν Κύριος ἐλάλησε)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μετανοήσουν καὶ νὰ ἐπιστρέψουν στὸν Θεὸ οἱ ἀπομακρυσμένοι ἄνθρωποι, γιὰ νὰ σωθοῦν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 50ος(Ἐλέησόν με, ὁ Θεός, κατὰ τὸ μέγα ἔλεός σου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν ἐξ ἁμαρτιῶν μας ἔρθη παιδαγωγικὴ ὀργὴ Θεοῦ (ἐπιδημία ἀρρώστιας καὶ θανατικὸ στοὺς ἀνθρώπους ἢ στὰ ζῶα).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 51ος(Τί ἐγκαυχᾷ ἐν κακίᾳ, ὁ δυνατός;)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μετανοήσουν οἱ σκληρόκαρδοι ἄρχοντες καὶ νὰ γίνουν εὐσπλαγχνικοί, γιὰ νὰ μὴ βασανίζουν τὸν λαό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 52ος(Εἶπεν ἄφρων ἐν καρδίᾳ αὐτοῦ· Οὐκ ἔστι Θεὸς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εὐλογήση ὁ Θεὸς τὰ δίχτυα, νὰ γεμίζουν ψάρια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 53ος(Ὁ Θεός, ἐν τῷ ὀνόματί σου σῶσόν με)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φωτίση ὁ Θεὸς τοὺς πλουσίους ποὺ ἔχουν ἀγορασμένους δούλους, νὰ τοὺς ἐλευθερώσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 54ος(Ἐνώτισαι, ὁ Θεός, τὴν προσευχήν μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἀποκατασταθῆ ἡ ὑπόληψη τῆς δυσφημισμένης οἰκογενείας ποὺ ἔχει συκοφαντηθῆ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 55ος(Ἐλέησόν με, ὁ Θεός, ὅτι κατεπάτησέ με ἄνθρωπος)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ εὐαίσθητους ποὺ ἔχουν πληγωθῆ ψυχικὰ ἀπὸ τοὺς συνανθρώπους τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 56ος(Ἐλέησόν με, ὁ Θεός, ἐλέησόν με)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ ἀνθρώπους ποὺ ὑποφέρουν ἀπὸ πονοκεφάλους ἀπὸ πολλὴ στενοχώρια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 57ος(Εἰ ἀληθῶς ἄρα δικαιοσύνην λαλεῖτε)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἔλθουν εὐνοϊκὰ τὰ πράγματα σ’ ἐκείνους ποὺ ἐνεργοῦν γιὰ τὸ καλό, νὰ ἐμποδίση ὁ Θεὸς κάθε πονηρὴ ἐνέργεια δαιμόνων ἢ φθονερῶν ἀνθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 58ος(Ἐξελοῦ με ἐκ τῶν ἐχθρῶν μου, ὁ Θεὸς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ τοὺς βουβούς, νὰ δώση ὁ Θεὸς λαλιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 59ος(Ὁ Θεός, ἀπώσω ἡμᾶς καὶ καθεῖλες ἡμᾶς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φανερώση ὁ Θεὸς τὴν ἀλήθεια, ὅταν συκοφαντῆται σύνολο ἀνθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 60ος(Εἰσάκουσον, ὁ Θεός, τῆς δεήσεώς μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι’ αὐτοὺς ποὺ δυσκολεύονται στὴν ἐργασία, εἴτε ἀπὸ τεμπελιὰ εἴτε ἀπὸ δειλία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 61ος(Οὐχὶ τῷ Θεῷ ὑποταγήσεται ἡ ψυχή μου;)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἀπαλλάξη ὁ Θεὸς ἀπὸ δοκιμασίες τὸν ὀλιγόψυχο ἄνθρωπο, ποὺ δὲν ἔχει ὑπομονὴ καὶ γογγύζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 62ος(Ὁ Θεός, ὁ Θεός μου, πρὸς σὲ ὀρθρίζω)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ καρπίσουν τὰ χωράφια καὶ τὰ δένδρα, ὅταν στεροῦνται ἀπὸ νερό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 63ος(Εἰσάκουσον, ὁ Θεός, τῆς φωνῆς μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν δαγκωθῆ ἄνθρωπος ἀπὸ λύκο ἢ σκύλο λυσσασμένο.(Ὁ Ἅγιος τοὺς ἔδινε νὰ πιοῦν καὶ ἀπὸ τὸ διαβασμένο νερό).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 64ος(Σοὶ πρέπει ὕμνος, ὁ Θεός, ἐν Σιὼν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἔχουν οἱ ἔμποροι εὐλογία, γιὰ νὰ μὴ φλυαροῦν καὶ ἀδικοῦν τοὺς ἁπλοὺς ἀνθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 65ος(Ἀλαλάξατε τῷ Κυρίῳ, πᾶσα ἡ γῆ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μὴ φέρνη ἀναποδιὲς ὁ πονηρὸς στὰ σπίτια καὶ θλίβη τὶς οἰκογένειες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 66ος(Ὁ Θεὸς οἰκτειρήσαι ἡμᾶς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εὐλογηθοῦν τὰ πουλερικὰ (ὀρνιθοτροφεῖα).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 67ος(Ἀναστήτω ὁ Θεός, καὶ διασκορπισθήτωσαν οἱ ἐχθροὶ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐλευθερωθοῦν οἱ μητέρες ποὺ δυσκολεύονται νὰ ἀποβάλουν, ὅταν παθαίνουν κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 68ος(Σῶσόν με, ὁ Θεός, ὅτι εἰσήλθοσαν ὕδατα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν γίνωνται θεομηνίες καὶ πλημμυρίζουν τὰ ποτάμια καὶ παρασύρουν σπίτια καὶ ἀνθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 69ος(Ὁ Θεός, εἰς τὴν βοήθειάν μου πρόσχες)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ εὐαίσθητους ἀνθρώπους ποὺ θλίβονται γιὰ τὸ παραμικρὸ καὶ ἔρχονται σὲ ἀπόγνωση, νὰ τοὺς ἐνισχύη ὁ Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 70ος(Ἐπὶ σοί, Κύριε, ἤλπισα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ ἐγκαταλελειμμένους ἀνθρώπους ποὺ γίνονται βαρετοὶ ἀπὸ φθόνο τοῦ διαβόλου καὶ ἔρχονται σὲ ἀπόγνωση, γιὰ νὰ βροῦν ἔλεος ἀπὸ τὸν Θεὸ καὶ περίθαλψη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 71ος(Ὁ Θεός, τὸ κρίμα σου τῷ βασιλεῖ δὸς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εὐλογήση ὁ Θεὸς τὰ ἀγαθὰ τῆς νέας σοδειᾶς, ποὺ μετέφεραν στὰ σπίτια τους οἱ γεωργοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 72ος(Ὡς ἀγαθὸς ὁ Θεὸς τῷ Ἰσραὴλ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μετανοήσουν οἱ κακοποιοὶ ἄνθρωποι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 73ος(Ἵνα τί, ὁ Θεός, ἀπώσω εἰς τέλος;)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προφυλάξη ὁ Θεὸς τοὺς χωρικοὺς ποὺ ἐργάζονται στὰ χωράφια τους, ὅταν οἱ ἐχθροὶ ἔχουν περικυκλωμένο τὸ χωριό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 74ος(Ἐξομολογηθησόμεθά σοι, ὁ Θεὸς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἡμερέψη τὸ βάρβαρο ἀφεντικό, νὰ μὴ βασανίζη τοὺς συνανθρώπους του, τοὺς ὑπαλλήλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 75ος(Γνωστὸς ἐν τῇ Ἰουδαίᾳ ὁ Θεὸς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σὲ μητέρα ποὺ φοβᾶται στὴν γέννα της, γιὰ νὰ τὴν ἐνθαρρύνη καὶ νὰ τὴν προστατέψη ὁ Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 76ος(Φωνῇ μου πρὸς Κύριον ἐκέκραξα, φωνῇ μου πρὸς τὸν Θεὸν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅταν δὲν ὑπάρχη κατανόηση μεταξὺ γονέων καὶ παιδιῶν, νὰ τοὺς φωτίση ὁ Θεός, γιὰ νὰ ἀκοῦνε τὰ παιδιὰ τοὺς γονεῖς καὶ οἱ γονεῖς νὰ δείχνουν ἀγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 77ος(Προσέχετε, λαός μου, τῷ νόμῳ μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φωτίση ὁ Θεὸς τοὺς δανειστές, νὰ μὴν πιέζουν τοὺς συνανθρώπους τους γιὰ τὸ χρέος τους καὶ νὰ εἶναι εὐσπλαγχνικοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 78ος(Ὁ Θεός, ἤλθοσαν ἔθνη εἰς τὴν κληρονομίαν σου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προφυλάξη ὁ Θεὸς τὰ χωριὰ ἀπὸ ληστεῖες καὶ καταστροφὲς τῶν ἐχθρικῶν στρατευμάτων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 79ος(Ὁ ποιμαίνων τὸν Ἰσραήλ, πρόσχες)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τὸν ἄνθρωπο, ὅταν πρήζεται τὸ πρόσωπό του καὶ πονάη ὅλο τὸ κεφάλι του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 80ος(Ἀγαλλιᾶσθε τῷ Θεῷ τῷ βοηθῷ ἡμῶν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ οἰκονομήση ὁ Θεὸς τοὺς φτωχούς, ποὺ στεροῦνται καὶ στενοχωροῦνται ἀπὸ τὴν ἀνέχεια καὶ θλίβονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 81ος(Ὁ Θεὸς ἔστη ἐν συναγωγῇ θεῶν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἀγοράσουν οἱ ἄνθρωποι τὰ προϊόντα τῶν γεωργῶν, γιὰ νὰ μὴ στενοχωροῦνται καὶ θλίβωνται οἱ χωρικοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 82ος(Ὁ Θεός, τίς ὁμοιωθήσεταί σοι;)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐμποδίση ὁ Θεὸς τοὺς κακοὺς ἀνθρώπους ποὺ θέλουν νὰ κάνουν δολοφονίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 83ος(Ὡς ἀγαπητὰ τὰ σκηνώματά σου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ διατηρηθοῦν ἀπὸ τὸν Θεὸ ὅλα τὰ ὑπάρχοντα τοῦ σπιτιοῦ καλά, τὰ ζῶα καὶ τὰ προϊόντα τῶν παραγωγῶν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 84ος(Εὐδόκησας, Κύριε, τὴν γῆν σου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τοὺς ἀνθρώπους ποὺ ἔχουν πληγωθῆ ἀπὸ τοὺς ληστὲς καὶ ἔπαθαν καὶ ἀπὸ φοβία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 85ος(Κλῖνον, Κύριε, τὸ οὖς σου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ σώση ὁ Θεὸς τὸν κόσμο, ὅταν πέφτη χολέρα στοὺς ἀνθρώπους καὶ πεθαίνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 86ος(Οἱ θεμέλιοι αὐτοῦ ἐν τοῖς ὄρεσι τοῖς ἁγίοις)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ παρατείνη ὁ Θεὸς τὴν ζωὴ στοὺς οἰκογενειάρχες, ποὺ ἔχουν ἀκόμη ὑποχρεώσεις οἰκογενειακές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 87ος(Κύριε ὁ Θεὸς τῆς σωτηρίας μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προστατεύση ὁ Θεὸς ὅλους τοὺς ἀπροστάτευτους ἀνθρώπους, ποὺ ταλαιπωροῦνται ἀπὸ σκληροὺς συνανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 88ος(Τὰ ἐλέη σου, Κύριε, εἰς τὸν αἰῶνα ᾄσομαι)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δυναμώση ὁ Θεὸς τοὺς φιλάσθενους καὶ ἀδύνατους ἀνθρώπους, γιὰ νὰ μποροῦν νὰ ἐργάζωνται, χωρὶς νὰ κουράζωνται καὶ νὰ θλίβωνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 89ος(Κύριε, καταφυγὴ ἐγενήθης ἡμῖν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ βρέξη ὁ Θεός, ὅταν ὑπάρχη ἀνομβρία ἢ ὅταν στερέψουν τὰ πηγάδια, γιὰ νὰ βγάλουν νερό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 90ος(Ὁ κατοικῶν ἐν βοηθείᾳ τοῦ Ὑψίστου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἐξαφανιστῆ ὁ διάβολος, ὅταν παρουσιάζεται σὲ ἄνθρωπο καὶ τὸν τρομάζη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 91ος(Ἀγαθὸν τὸ ἐξομολογεῖσθαι τῷ Κυρίῳ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση ὁ Θεὸς σύνεση στοὺς ἀνθρώπους, γιὰ νὰ προκόπτουν πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 92ος(Ὁ Κύριος ἐβασίλευσεν, εὐπρέπειαν ἐνεδύσατο)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προφυλάξη ὁ Θεὸς τὸ πλοῖο, ὅταν κινδυνεύη ἀπὸ μεγάλη φουρτούνα στὴν θάλασσα.(Ἔρριχνε καὶ ἁγιασμένο νερὸ στὰ τέσσερα σημεῖα τοῦ πλοίου).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 93ος(Θεὸς ἐκδικήσεων Κύριος)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φωτίση ὁ Θεὸς τοὺς ἄτακτους ἀνθρώπους, ποὺ δημιουργοῦν θέματα στὸ ἔθνος καὶ ἀναστατώνουν τὸν λαὸ καὶ τὸν ταλαιπωροῦν μὲ ἀκαταστασίες καὶ φαγωμάρες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 94ος(Δεῦτε ἀγαλλιασώμεθα τῷ Κυρίῳ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μὴν πλησιάσουν τὰ μάγια στὰ ἀνδρόγυνα, καὶ δημιουργοῦνται θέματα καὶ προστριβές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 95ος(ᾌσατε τῷ Κυρίῳ ᾆσμα καινόν, ᾄσατε τῷ Κυρίῳ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση ὁ Θεὸς τὴν ἀκοὴ στοὺς κωφούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 96ος(Ὁ Κύριος ἐβασίλευσεν, ἀγαλλιάσθω ἡ γῆ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φύγουν τὰ μάγια ἀπὸ τοὺς ἀνθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 97ος(ᾌσατε τῷ Κυρίῳ ᾆσμα καινόν, ὅτι θαυμαστὰ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση ὁ Θεὸς παρηγοριὰ στοὺς στενοχωρημένους ἀνθρώπους, γιὰ νὰ μὴ θλίβωνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 98ος(Ὁ Κύριος ἐβασίλευσεν, ὀργιζέσθωσαν λαοὶ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εὐλογήση καὶ νὰ χαριτώση ὁ Θεὸς τοὺς νέους ποὺ θέλουν νὰ ἀφιερωθοῦν στὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 99ος(Ἀλαλάξατε τῷ Θεῷ, πᾶσα ἡ γῆ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εὐλογήση καὶ νὰ ἐκπληρώση ὁ Θεὸς τοὺς θείους πόθους τῶν ἀνθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 100ος(Ἔλεος καὶ κρίσιν ᾄσομαί σοι, Κύριε)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δίνη ὁ Θεὸς χαρίσματα στοὺς καλοκάγαθους ἀνθρώπους, γιὰ νὰ βοηθοῦν τοὺς συνανθρώπους τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 101ος(Κύριε, εἰσάκουσον τῆς προσευχῆς μου, καὶ ἡ κραυγή μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εὐλογήση ὁ Θεὸς τοὺς ἀνθρώπους ποὺ φέρουν ἀξιώματα, γιὰ νὰ βοηθοῦν τὸν κόσμο μὲ καλωσύνη καὶ κατανόηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 102ος(Εὐλόγει, ἡ ψυχή μου, τὸν Κύριον, καὶ πάντα τὰ ἐντός μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἔλθουν τὰ ἔμμηνα, ὅταν καθυστεροῦν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 103ος(Εὐλόγει, ἡ ψυχή μου, τὸν Κύριον·Κύριε ὁ Θεός μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εὐλογήση ὁ Θεὸς τὰ ὑπάρχοντα τῶν ἀνθρώπων, γιὰ νὰ μὴ στεροῦνται καὶ θλίβωνται, ἀλλὰ νὰ δοξάζουν τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 104ος(Ἐξομολογεῖσθε τῷ Κυρίῳ καὶ ἐπικαλεῖσθε)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μετανοήσουν οἱ ἄνθρωποι καὶ νὰ ἐξομολογηθοῦν τὶς ἁμαρτίες τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 105ος(Ἐξομολογεῖσθε τῷ Κυρίῳ... Τίς λαλήσει)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση φώτιση ὁ Θεὸς στοὺς ἀνθρώπους, νὰ μὴν ξεκλίνουν ἀπὸ τὴν ὁδὸ τῆς σωτηρίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 106ος(Ἐξομολογεῖσθε τῷ Κυρίῳ... Εἰπάτωσαν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ λύση ὁ Θεὸς τὴν στείρωση τῶν γυναικῶν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 107ος(Ἑτοίμη ἡ καρδία μου, ὁ Θεὸς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ταπεινώση ὁ Θεὸς τοὺς ἐχθρούς, γιὰ νὰ ἀλλάξουν τὶς κακές τους διαθέσεις(7 φορὲς τὴν ἡμέρα ἐπὶ 7 ἡμέρες).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 108ος(Ὁ Θεός, τὴν αἴνεσίν μου μὴ παρασιωπήσῃς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τοὺς σεληνιασμένους ἢ γιὰ νὰ ἐλεήση τοὺς ψευδομάρτυρες νὰ μετανοήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 109ος(Εἶπεν ὁ Κύριος τῷ Κυρίῳ μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἔχουν σεβασμὸ οἱ νεώτεροι στοὺς μεγαλυτέρους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 110ος(Ἐξομολογήσομαί σοι, Κύριε... ἐν βουλῇ εὐθέων)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μετανοήσουν οἱ ἄδικοι κριτὲς καὶ νὰ κρίνουν δίκαια τὸν λαὸ τοῦ Θεοῦ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 111ος(Μακάριος ἀνὴρ ὁ φοβούμενος τὸν Κύριον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προφυλάξη ὁ Θεὸς τοὺς στρατιῶτες, ὅταν πηγαίνουν στὸν πόλεμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 112ος(Αἰνεῖτε, παῖδες, Κύριον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση εὐλογίες ὁ Θεὸς στὴν φτωχὴ χήρα, νὰ πληρώση τὰ χρέη της καὶ νὰ ἀπαλλαχτῆ ἀπὸ τὴν φυλακὴ(3 φορὲς τὴν ἡμέρα ἐπὶ 3 ἡμέρες).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 113ος(Ἐν ἐξόδῳ Ἰσραὴλ ἐξ Αἰγύπτου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τὰ καθυστερημένα διανοητικὰ καὶ μογγόλαλα παιδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 114ος(Ἠγάπησα, ὅτι εἰσακούσεται Κύριος)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δίνη ὁ Θεὸς εὐλογίες καὶ παρηγοριὰ στὰ δυστυχισμένα φτωχὰ παιδάκια, γιὰ νὰ μὴν περιφρονοῦνται ἀπὸ τὰ παιδιὰ τῶν πλουσίων καὶ θλίβωνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 115ος(Ἐπίστευσα, διὸ ἐλάλησα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τὸ φοβερὸ πάθος τοῦ ψεύδους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 116ος(Αἰνεῖτε τὸν Κύριον, πάντα τὰ ἔθνη)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ διατηροῦν ἀγάπη καὶ ὁμόνοια οἱ οἰκογένειες καὶ νὰ δοξολογοῦν τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 117ος(Ἐξομολογεῖσθε τῷ Κυρίῳ... Εἰπάτω δὴ οἶκος Ἰσραὴλ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ταπεινώση ὁ Θεὸς τοὺς βαρβάρους, ὅταν κυκλώνουν τὸ χωριὸ καὶ τὸ ἀπειλοῦν, καὶ νὰ ἀνατρέψη τὶς κακὲς διαθέσεις τους(3 φορὲς τὴν ἡμέρα ἐπὶ 7 ἡμέρες).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 118ος(Μακάριοι οἱ ἄμωμοι ἐν ὁδῷ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ πατάξη ὁ Θεὸς τοὺς βαρβάρους καὶ νὰ ταπεινώση τὴν θραύση τους, ὅταν σφάζουν τὰ ἀθῶα γυναικόπαιδα(3 φορὲς τὴν ἡμέρα ἐπὶ 7 ἡμέρες).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 119ος(Πρὸς Κύριον ἐν τῷ θλίβεσθαί με ἐκέκραξα)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δίνη ὑπομονὴ καὶ ἀνεκτικότητα ὁ Θεὸς στοὺς ἀνθρώπους ποὺ εἶναι ἀναγκασμένοι νὰ παρευρίσκωνται μὲ δόλιους καὶ ἄδικους ἀνθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 120ος(Ἦρα τοὺς ὀφθαλμούς μου εἰς τὰ ὄρη)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προστατεύση ὁ Θεὸς τοὺς σκλάβους ἀπὸ τὰ ἐχθρικὰ χέρια, νὰ μὴν τοὺς κακοποιήσουν, μέχρι νὰ ἐλευθερωθοῦν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 121ος(Εὐφράνθην ἐπὶ τοῖς εἰρηκόσι μοι)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τοὺς ἀνθρώπους ποὺ πάσχουν ἀπὸ βασκανία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 122ος(Πρὸς σὲ ἦρα τοὺς ὀφθαλμούς μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση ὁ Θεὸς τὸ φῶς στοὺς τυφλοὺς καὶ νὰ θεραπεύση τὰ πονεμένα μάτια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 123ος(Εἰ μὴ ὅτι Κύριος ἦν ἐν ἡμῖν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φυλάξη ὁ Θεὸς τοὺς ἀνθρώπους ἀπὸ τὰ φίδια, νὰ μὴν τοὺς δαγκώνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 124ος(Οἱ πεποιθότες ἐπὶ Κύριον ὡς ὄρος Σιὼν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προφυλάξη ὁ Θεὸς τὰ κτήματα τῶν δικαίων ἀνθρώπων ἀπὸ τοὺς κακοὺς ἀνθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 125ος(Ἐν τῷ ἐπιστρέψαι Κύριον τὴν αἰχμαλωσίαν Σιὼν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τοὺς ἀνθρώπους ποὺ πάσχουν ἀπὸ συνεχεῖς πονοκεφάλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 126ος(Ἐὰν μὴ Κύριος οἰκοδομήσῃ οἶκον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εἰρηνεύση ὁ Θεὸς τὴν οἰκογένεια, ὅταν μαλώνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 127ος(Μακάριοι πάντες οἱ φοβούμενοι τὸν Κύριον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ μὴν πλησιάση ἡ κακία τοῦ ἐχθροῦ ποτὲ στὰ σπίτια καὶ νὰ ἐπικρατήση ἡ εἰρήνη καὶ ἡ εὐλογία τοῦ Θεοῦ στὴν οἰκογένεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 128ος(Πλεονάκις ἐπολέμησάν με ἐκ νεότητός μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τοὺς ἀνθρώπους ποὺ πάσχουν ἀπὸ ἡμικρανία, πονοκεφάλους, καὶ νὰ ἐλεήση τοὺς σκληρόκαρδους καὶ ἀδιάκριτους ἀνθρώπους ποὺ στενοχωροῦν τοὺς εὐαίσθητους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 129ος(Ἐκ βαθέων ἐκέκραξά σοι, Κύριε)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση ὁ Θεὸς θάρρος καὶ ἐλπίδα στοὺς ἀρχαρίους, γιὰ νὰ μὴ δυσκολεύωνται στὴν δουλειά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 130ος(Κύριε, οὐχ ὑψώθη ἡ καρδία μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση ὁ Θεὸς μετάνοια καὶ παρηγοριὰ μὲ ἐλπίδα στοὺς ἀνθρώπους, γιὰ νὰ σωθοῦν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 131ος(Μνήσθητι, Κύριε, τοῦ Δαυῒδ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ λυπηθῆ ὁ Θεὸς τὸν κόσμο, ὅταν ἐξ ἁμαρτιῶν μας γίνωνται συνεχεῖς πόλεμοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 132ος(Ἰδοὺ δὴ τί καλὸν ἢ τί τερπνὸν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φωτίση ὁ Θεὸς τὰ ἔθνη νὰ συμφιλιωθοῦν, καὶ νὰ εἰρηνεύσουν οἱ ἄνθρωποι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 133ος(Ἰδοὺ δὴ εὐλογεῖτε τὸν Κύριον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φυλάξη ὁ Θεὸς τοὺς ἀνθρώπους ἀπὸ κάθε κίνδυνο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 134ος(Αἰνεῖτε τὸ ὄνομα Κυρίου, αἰνεῖτε, δοῦλοι, Κύριον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ συγκεντρώνωνται οἱ ἄνθρωποι τὴν ὥρα τῆς προσευχῆς καὶ νὰ ἑνώνεται ὁ νοῦς τους μὲ τὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 135ος(Ἐξομολογεῖσθε τῷ Κυρίῳ...Ἐξομολογεῖσθε τῷ Θεῷ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προστατεύση ὁ Θεὸς τοὺς πρόσφυγες, ὅταν ἐγκαταλείπουν τὰ σπίτια τους καὶ φεύγουν γιὰ νὰ σωθοῦν ἀπὸ τοὺς βαρβάρους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 136ος(Ἐπὶ τῶν ποταμῶν Βαβυλῶνος)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ σταθερoποιήση ὁ Θεὸς τὸν ἄνθρωπο ποὺ ἔχει ἄστατο χαρακτήρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 137ος(Ἐξομολογήσομαί σοι, Κύριε... καὶ ἐναντίον ἀγγέλων)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ φωτίση ὁ Θεὸς τοὺς ἄρχοντες τοῦ τόπου, γιὰ νὰ βρίσκουν κατανόηση οἱ ἄνθρωποι στὰ αἰτήματά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 138ος(Κύριε, ἐδοκίμασάς με, καὶ ἔγνως με)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ παύση ὁ διάβολος νὰ πειράζη τοὺς εὐαίσθητους ἀνθρώπους μὲ βλάσφημους λογισμούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 139ος(Ἐξελοῦ με, Κύριε, ἐξ ἀνθρώπου πονηροῦ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἡμερέψη ὁ Θεὸς τὸν δύστροπο οἰκογενειάρχη, ποὺ ταλαιπωρεῖ ὁλόκληρη τὴν οἰκογένεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 140ος(Κύριε, ἐκέκραξα πρὸς σέ, εἰσάκουσόν μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἡμερέψη ὁ Θεὸς τὸν βάρβαρο ἄρχοντα τοῦ τόπου, ποὺ βασανίζει τοὺς συνανθρώπους του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 141ος(Φωνῇ μου πρὸς Κύριον ἐκέκραξα, ...ἐδεήθην)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἡμερέψη ὁ Θεὸς τὸν ἐπαναστάτη ποὺ κάνει κακό. Καὶ Κούρδης ἐὰν εἶναι, γίνεται ἀρνί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 142ος(Κύριε, εἰσάκουσον τῆς προσευχῆς μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ προστατέψη ὁ Θεὸς τὴν μητέρα στὸν καιρὸ τῆς ἐγκυμοσύνης, νὰ μὴν ἀποβάλη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 143ος(Εὐλογητὸς Κύριος, ὁ Θεός μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ καταπραΰνη ὁ Θεὸς τὸν ἀναστατωμένο λαό, νὰ μὴ γίνη ἐμφύλιος πόλεμος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 144ος(Ὑψώσω σε, ὁ Θεός μου, ὁ βασιλεύς μου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ εὐλογήση ὁ Θεὸς τὶς ἐργασίες τῶν ἀνθρώπων, γιὰ νὰ εἶναι εὐάρεστες στὸν Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 145ος(Αἴνει, ἡ ψυχή μου, τὸν Κύριον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ σταματήση ὁ Θεὸς τὶς αἱμορραγίες τῶν ἀνθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 146ος(Αἰνεῖτε τὸν Κύριον, ὅτι ἀγαθὸν ψαλμὸς)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ θεραπεύση ὁ Θεὸς τοὺς ἀνθρώπους ποὺ ἔχουν χτυπηθῆ καὶ πληγωθῆ στὶς σιαγόνες ἀπὸ κακοὺς ἀνθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 147ος(Ἐπαίνει, Ἰερουσαλήμ, τὸν Κύριον)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ ἡμερέψη ὁ Θεὸς τὰ ἄγρια ζῶα τοῦ βουνοῦ, γιὰ νὰ μὴν κάνουν κακὸ στοὺς ἀνθρώπους καὶ ζημίες στὰ σπαρτά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 148ος(Αἰνεῖτε τὸν Κύριον ἐκ τῶν οὐρανῶν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ κάνη καιρὸ εὐνοϊκὸ ὁ Θεός, γιὰ νὰ ἔχουν ἀφθονία εἰσοδημάτων οἱ ἄνθρωποι καὶ νὰ δοξάζουν τὸν Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τελοσ Των Περιπτωσεων Του Αγιου Αρσενιου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 149ος(ᾌσατε τῷ Κυρίῳ ᾆσμα καινὸν)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἀπὸ εὐγνωμοσύνη καὶ εὐχαριστία στὸν Θεὸ γιὰ τὶς μεγάλες Του καλωσύνες καὶ γιὰ τὴν πολλή Του ἀγάπη, ποὺ δὲν ἔχει ὅρια καὶ μᾶς ἀνέχεται.(Γέροντος Παϊσίου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ΨΑΛΜΟΣ 150ος(Αἰνεῖτε τὸν Θεὸν ἐν τοῖς ἁγίοις αὐτοῦ)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιὰ νὰ δώση ὁ Θεὸς χαρὰ καὶ παρηγοριὰ στοὺς θλιμμένους ἀδελφούς μας, ποὺ βρίσκονται στὴν ξενιτειά, καὶ στοὺς κεκοιμημένους ἀδελφούς μας, ποὺ βρίσκονται στὴν πιὸ μακρινὴ ξενιτειά. Ἀμήν.(Γέροντος Παϊσίου)
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '[Φωτογραφία εικόνας του αγίου Αρσενίου]'
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: χρησιμοποιώντας περιπτώσεις τῶν Ψαλμῶν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τοῦ Ἁγίου Ἀρσενίου
- type: h2
  initial:
    ru: ''
  text:
    ru: Ψαλμὸς 50ος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ελέησόν με, ὁ Θεός, κατὰ τὸ μέγα ἔλεός σου καὶ κατὰ τὸ πλῆθος τῶν οἰκτιρμῶν σου ἐξάλειψον τὸ ἀνόμημά μου. Ἐπὶ πλεῖον πλῦνόν με ἀπὸ τῆς ἀνομίας μου καὶ ἀπὸ τῆς ἁμαρτίας μου καθάρισόν με. Ὅτι τὴν ἀνομίαν μου ἐγὼ γινώσκω, καὶ ἡ ἁμαρτία μου ἐνώπιόν μού ἐστι διαπαντός. Σοὶ μόνῳ ἥμαρτον, καὶ τὸ πονηρὸν ἐνώπιόν σου ἐποίησα, ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου, καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε. Ἰδοὺ γὰρ ἐν ἀνομίαις συνελήφθην, καὶ ἐν ἁμαρτίαις ἐκίσσησέ με ἡ μήτηρ μου. Ἰδοὺ γὰρ ἀλήθειαν ἠγάπησας, τὰ ἄδηλα καὶ τὰ κρύφια τῆς σοφίας σου ἐδήλωσάς μοι. Ῥαντιεῖς με ὑσσώπῳ, καὶ καθαρισθήσομαι, πλυνεῖς με, καὶ ὑπὲρ χιόνα λευκανθήσομαι. Ἀκουτιεῖς μοι ἀγαλλίασιν καὶ εὐφροσύνην, ἀγαλλιάσονται ὀστέα τεταπεινωμένα. Ἀπόστρεψον τὸ πρόσωπόν σου ἀπὸ τῶν ἁμαρτιῶν μου, καὶ πάσας τὰς ἀνομίας μου ἐξάλειψον. Καρδίαν καθαρὰν κτίσον ἐν ἐμοί, ὁ Θεός, καὶ πνεῦμα εὐθὲς ἐγκαίνισον ἐν τοῖς ἐγκάτοις μου. Μὴ ἀποῤῥίψῃς με ἀπὸ τοῦ προσώπου σου, καὶ τὸ Πνεῦμά σου τὸ ἅγιον μὴ ἀντανέλῃς ἀπ᾿ ἐμοῦ. Ἀπόδος μοι τὴν ἀγαλλίασιν τοῦ σωτηρίου σου, καὶ πνεύματι ἡγεμονικῷ στήριξόν με. Διδάξω ἀνόμους τὰς ὁδούς σου, καὶ ἀσεβεῖς ἐπὶ σὲ ἐπιστρέψουσι. Ῥῦσαί με ἐξ αἱμάτων, ὁ Θεός, ὁ Θεὸς τῆς σωτηρίας μου· ἀγαλλιάσεται ἡ γλῶσσά μου τὴν δικαιοσύνην σου. Κύριε, τὰ χείλη μου ἀνοίξεις, καὶ τὸ στόμα μου ἀναγγελεῖ τὴν αἴνεσίν σου. Ὅτι, εἰ ἠθέλησας θυσίαν, ἔδωκα ἄν· ὁλοκαυτώματα οὐκ εὐδοκήσεις. Θυσία τῷ Θεῷ πνεῦμα συντετριμμένον· καρδίαν συντετριμμένην καὶ τεταπεινωμένην ὁ Θεὸς οὐκ ἐξουδενώσει. Ἀγάθυνον, Κύριε, ἐν τῇ εὐδοκίᾳ σου τὴν Σιών, καὶ οἰκοδομηθήτω τὰ τείχη Ἰερουσαλήμ. Τότε εὐδοκήσεις θυσίαν δικαιοσύνης, ἀναφορὰν καὶ ὁλοκαυτώματα. Τότε ἀνοίσουσιν ἐπὶ τὸ θυσιαστήριόν σου μόσχους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Θεοτοκίον
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Υπὸ τὴν σὴν εὐσπλαγχνίαν καταφεύγομεν, Θεοτόκε, τὰς ἡμῶν ἱκεσίας, μὴ παρίδῃς ἐν περιστάσει, ἀλλ’ ἐκ κινδύνων λύτρωσαι ἡμᾶς, μόνη ἁγνή, μόνη εὐλογημένη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Απολυτίκιον
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἁγίου Ἀρσενίου τοῦ Καππαδόκου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βίον ἔνθεον καλῶς ἀνύσας, σκεῦος τίμιον τοῦ Παρακλήτου ἀνεδείχθης, Θεοφόρε Ἀρσένιε· καὶ τῶν θαυμάτων τὴν Χάριν δεξάμενος, πᾶσι παρέχεις ταχεῖαν βοήθειαν· Πάτερ Ὅσιε, Χριστὸν τὸν Θεὸν ἱκέτευε δωρήσασθαι ἡμῖν τὸ μέγα ἔλεος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Διαβάζουμε τὴν περίπτωση γιὰ τὴν ὁποία θέλουμε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: νὰ προσευχηθοῦμε καὶ στὴν συνέχεια τὸν ἀντίστοιχο Ψαλμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δόξα Πατρὶ καὶ Υἱῷ καὶ Ἁγίῳ Πνεύματι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καὶ νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ἀλληλούϊα, Ἀλληλούϊα, Ἀλληλούϊα, δόξα Σοι ὁ Θεός· (τρίς).
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κύριε ἐλέησον, Κύριε ἐλέησον, Κύριε ἐλέησον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δόξα Πατρὶ καὶ Υἱῷ καὶ Ἁγίῳ Πνεύματι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καὶ νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Δοξολογία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σοὶ δόξα πρέπει, Κύριε ὁ Θεὸς ἡμῶν, καὶ σοὶ τὴν δόξαν ἀναπέμπομεν, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δόξα ἐν ὑψίστοις Θεῷ, καὶ ἐπὶ γῆς εἰρήνη, ἐν ἀνθρώποις εὐδοκία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὑμνοῦμέν σε, εὐλογοῦμέν σε, προσκυνοῦμέν σε, δοξολογοῦμέν σε, εὐχαριστοῦμέν σοι διὰ τὴν μεγάλην σου δόξαν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κύριε Βασιλεῦ, ἐπουράνιε Θεέ, Πάτερ Παντοκράτορ· Κύριε Υἱὲ μονογενές, Ἰησοῦ Χριστέ, καὶ Ἅγιον Πνεῦμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κύριε ὁ Θεός, ὁ ἀμνός τοῦ Θεοῦ, ὁ Υἱὸς τοῦ Πατρός, ὁ αἴρων τὴν ἁμαρτίαν του κόσμου, ἐλέησον ἡμᾶς, ὁ αἴρων τὰς ἁμαρτίας τοῦ κόσμου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρόσδεξαι τὴν δέησιν ἡμῶν, ὁ καθήμενος ἐν δεξιᾷ τοῦ Πατρός, καὶ ἐλέησον ἡμᾶς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅτι σὺ εἶ μόνος Ἅγιος, σὺ εἶ μόνος Κύριος, Ἰησοῦς Χριστός, εἰς δόξαν Θεοῦ Πατρός. Ἀμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καθ’ ἑκάστην ἡμέραν εὐλογήσω σε, καὶ αἰνέσω τὸ ὄνομά σου εἰς τὸν αἰῶνα καὶ εἰς τὸν αἰῶνα τοῦ αἰῶνος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κύριε, καταφυγὴ ἐγενήθης ἡμῖν ἐν γενεᾷ και γενεᾷ. Ἐγὼ εἶπα· Κύριε, ἐλέησόν με· ἴασαι τὴν ψυχήν μου, ὅτι ἥμαρτόν σοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κύριε, πρὸς σὲ κατέφυγον δίδαξόν με τοῦ ποιεῖν τὸ θέλημά σου, ὅτι σὺ εἶ ὁ Θεός μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ὅτι παρὰ σοὶ πηγή ζωῆς· ἐν τῷ φωτί σου ὀψόμεθα φῶς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παράτεινον τὸ ἔλεός σου τοῖς γινώσκουσί σε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καταξίωσον, Κύριε, ἐν τῇ νυκτί/ἡμέρᾳ ταύτῃ ἀναμαρτήτους φυλαχθῆναι ἡμᾶς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εὐλογητός εἶ, Κύριε, ὁ Θεὸς τῶν πατέρων ἡμῶν, καὶ αἰνετὸν καὶ δεδοξασμένον τὸ ὄνομά σου εἰς τοὺς αἰῶνας. Ἀμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γένοιτο, Κύριε, τὸ ἔλεός σου ἐφ’ ἡμᾶς, καθάπερ ἠλπίσαμεν ἐπὶ σέ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εὐλογητός εἶ, Κύριε, δίδαξόν με τὰ δικαιώματά σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εὐλογητός εἶ, Δέσποτα, συνέτισόν με τὰ δικαιώματά σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εὐλογητός εἶ, Ἅγιε, φώτισόν με τοῖς δικαιώμασί σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κύριε, τὸ ἔλεός σου εἰς τὸν αἰῶνα, τὰ ἔργα τῶν χειρῶν σου μὴ παρίδῃς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σοὶ πρέπει αἶνος, σοὶ πρέπει ὕμνος, σοὶ δόξα πρέπει, τῷ Πατρὶ καὶ τῷ Υἱῷ καὶ τῷ Ἁγίῳ Πνεύματι, νῦν καὶ ἀεὶ καὶ εἰς τοὺς αἰῶνας τῶν αἰώνων. Ἀμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αξιόν ἐστιν ὡς ἀληθῶς μακαρίζειν σε τὴν Θεοτόκον, τὴν ἀειμακάριστον καὶ παναμώμητον καὶ μητέρα τοῦ Θεοῦ ἡμῶν. Τὴν τιμιωτέραν τῶν Χερουβεὶμ καὶ ἐνδοξοτέραν ἀσυγκρίτως τῶν Σεραφείμ, τὴν ἀδιαφθόρως Θεὸν Λόγον τεκοῦσαν, τὴν ὄντως Θεοτόκον σὲ μεγαλύνομεν.
footnotes:
  '1': Λουκ.10, 27. Βλ. καὶΜατθ.22, 37·Μάρκ.12, 30.
  '2': Βλ. Ἀββᾶ Ἰσαὰκ τοῦ Σύρου,Οἱ Ἀσκητικοὶ Λόγοι,Λόγος ΜΒ΄, ἐκδ. «Ἀστήρ», Ἀθῆναι 1961, σ. 153.
  '3': Ἀργότερα διαπιστώσαμε ὅτι ἦταν ὁ ἴδιος ὁ Γέροντας.
  '4': Γιὰ τὴν αὐτενέργητη εὐχὴ βλ. σ. 167–168.
  '5': Εἰπώθηκε τὸν Νοέμβριο τοῦ 1983. Ἡ πληροφορία δὲν ἦταν ἀνθρώπινη ἀλλὰ θεϊκή.
  '6': Ἡ προσωνυμία «Μακκαβαῖος» δόθηκε στὸν Ἰούδα, τὸν ἡγέτη τῆς Ἰουδαϊκῆς ἐπαναστάσεως – ἡ ὁποία ἔγινε τὸ 166 π.Χ. κατὰ τοῦ Ἀντιόχου Δ΄ τοῦ Ἐπιφανοῦς –, καὶ στοὺς διαδόχους του. Οἱ Μακκαβαῖοι διακρίθηκαν γιὰ τοὺς ἀγῶνες ὑπὲρ τῆς πατρώας πίστεως καὶ τῆς ἐλευθερίας. (Βλ.Α΄, Β΄, Γ΄ Μακκαβαίων).
  '7': Εἰπώθηκαν τὸ 1981.
  '8': Οἱ ἀριθμοὶ σημαίνουν τὸν βαθμὸ ἀκουστικότητος.
  '9': Στὴν Ἱερὰ Μονὴ Ἐσφιγμένου τὸ ἔτος 1953.
  '10': Παλαιότερα ζέσταιναν τούβλα και τα χρησιμοποιούσαν αντί για θερμοφόρες.
  '11': Τον Σεπτέμβριο του 1962.
  '12': Τον Φεβρουάριο του 1963.
  '13': Ιακ. 4,6· Α’ Πέτρ. 5,5. Βλ. και Παρ. 3,34.
  '14': Ψαλμ. 50,19.
  '15': Βλ.Ματθ.15, 21–28·Μάρκ.7, 25–30.
  '16': Βλ.Λουκ.18, 2–8.
  '17': Βλ. Ἁγίου Ἰωάννου τοῦ Σιναΐτου,Κλῖμαξ, Λόγος ΚΗ΄, παρ. γ΄, ἐκδ. «Ἀστήρ», Ἀθῆναι 1970, σ. 159.
  '18': Λουκ.18, 13.
  '19': 'Κλισιοσκόπιο: μικρὸ μεταλλικὸ ὄργανο προσαρμοσμένο στὴν κάννη τῶν πυροβόλων ὅπλων, ἀπὸ τὸ ὁποῖο στοχεύει ὁ σκοπευτὴς τὸ σημεῖο ὅπου θὰ κατευθύνη τὴν σφαῖρα.'
  '20': Ματθ.5, 24.
  '21': Ματθ.5, 24.
  '22': '«Εὐλόγησον»: Ἐδῶ σημαίνει «συγχώρεσέ με».'
  '23': '«Κριτήριον πρὸ κριτηρίου»σημαίνει: «Δικαστήριο πρὸ τῆς τελικῆς δίκης». Πρβλ. Ἁγίου Ἰωάννου τοῦ Σιναΐτου,Κλῖμαξ, Λόγος ΚΗ΄, παρ. α΄, σ. 159.«Προσευχή ἐστι, τῷ ὄντως εὐχομένῳ, δικαστήριον καὶ κριτήριον καὶ βῆμα Κυρίου πρὸ τοῦ μέλλοντος βήματος».'
  '24': '«Πνευματικό» είναι: ευχή με το κομποσχοίνι, μετάνοιες, πνευματική μελέτη κ.λπ. που κάνει ο μοναχός εκτός της διατεταγμένης Ακολουθίας και του μοναχικού κανόνος. Αυτά γίνονται και από λαϊκούς που αγωνίζονται στον κόσμο.'
  '25': Τρίτον Μεγαλυνάριον της Μικράς και της Μεγάλης Παρακλήσεως εις την Υπεραγίαν Θεοτόκον.
  '26': Ὁ Γέροντας ἐννοεῖ τὴν ἐπικοινωνία μὲ τὸν Θεό, τὴν προσευχή.
  '27': Β΄ Κορ.9, 7.
  '28': Α΄ Πέτρ.1, 16. Βλ. καὶΛευϊτ. 20, 7 καὶ 20, 26.
  '29': Ὁ Γέροντας χρησιμοποιοῦσε τὴν λέξη «μπανταλὸ» ἀντὶ τῆς λέξεως «ἀνόητο».
  '30': Ψαλμ.108, 7.
  '31': Κατὰ τὰ ἔτη 1958–1962.
  '32': Ἐννοεῖ δόκιμος μοναχός, χωρὶς ρασοευχή.
  '33': Τὸ 1984.
  '34': Βλ. Τοῦ ἐν Ἁγίοις Πατρὸς ἡμῶν Βασιλείου Ἀρχιεπισκόπου Καισαρείας Καππαδοκίας,Περὶ τοῦ Ἁγίου Πνεύματος, κεφ. ΙΗ΄,PG32, 149C.«Ἡ τῆς εἰκόνος τιμὴ ἐπὶ τὸ πρωτότυπον διαβαίνει».Ἡ ἀναφορὰ τῆς Ζ΄ Οἰκουμενικῆς Συνόδου στὸ χωρίο αὐτὸ τοῦ προσδίδει ἰδιαίτερη σημασία γιὰ τὴν σχέση τῆς εἰκόνος μὲ τὸ πρωτότυπο.
  '35': 'Εὐεργετινός: Συλλογὴ διδαχῶν καὶ διηγήσεων διαφόρων Ἁγίων Πατέρων, τὴν ὁποία συνέθεσε κατὰ τὸν 11ο αἰ. ὁ μοναχὸς Παῦλος, ἱδρυτής, κτίτορας καὶ ἡγούμενος τῆς Ἱερᾶς Μονῆς«Παναγίας τῆς Εὐεργέτιδος»στὴν Κωνσταντινούπολη, ἀπὸ τὴν ὁποία ἔλαβε ἡ συλλογὴ τὴν ἐπωνυμία«Εὐεργετινός».'
  '36': 'Θηβαΐδα: Ἡ ἀνωτέρα Αἴγυπτος ποὺ εἶχε πρωτεύουσα τὶς Θῆβες. Στὶς ἐρήμους τῆς περιοχῆς αὐτῆς ἀναπτύχθηκε ἀπὸ τοὺς πρώτους χριστιανικοὺς χρόνους ὁ ἀσκητισμός.'
  '37': 'Νιτρία: Κοιλάδα τῆς Αἰγύπτου πρὸς τὴν Λιβυκὴ ἔρημο, μὲ πολλὲς λίμνες ἅλατος καὶ νίτρου. Ὑπῆρξε ἕνα ἀπὸ τὰ μεγαλύτερα κέντρα τῶν πρώτων χρόνων τοῦ Μοναχισμοῦ.'
  '38': 'Θεοτοκάριον: Συλλογὴ ἑξῆντα δύο ὑμνολογικῶν κανόνων πρὸς τὴν Ὑπεραγία Θεοτόκο, τοὺς ὁποίους συγκέντρωσε ὁ Ἅγιος Νικόδημος ὁ Ἁγιορείτης ἀπὸ χειρόγραφα τοῦ Ἁγίου Ὄρους καὶ ἐξέδωσε τὸ 1796.'
  '39': Βλ. Γέροντος Παϊσίου Ἁγιορείτου,Ἁγιορεῖται Πατέρες καὶ Ἁγιορείτικα, ἔκδ. Ἱ. Ἡσυχαστηρίου «Εὐαγγελιστὴς Ἰωάννης ὁ Θεολόγος», Σουρωτὴ Θεσσαλονίκης, 132008, σ. 118–121.
  '40': Ἁγίου Ἰωάννου τοῦ Χρυσοστόμου,Λόγος Κατηχητικὸς εἰς τὸ Ἅγιον Πάσχα,PG59, 723.
  '41': Πρβλ. Ἁγίου Ἰωάννου τοῦ Σιναΐτου,Κλῖμαξ, Λόγος ΙΓ΄, παρ. η΄ καὶ ι΄, σελ. 81.
  '42': Βλ. Γέροντος Παϊσίου Ἁγιορείτου,Ἁγιορεῖται Πατέρες καὶ Ἁγιορείτικα, σ. 15–40.
  '43': Πρβλ. Ἀββᾶ Ἰσαὰκ τοῦ Σύρου,Οἱ Ἀσκητικοὶ Λόγοι,Λόγος ΚΘ΄, σ. 108.
  '44': Ὁ Γέροντας ἀπὸ πολλὴ εὐλάβεια στὴν Παναγία κάποιες φορὲς ἀσπαζόταν διαρκῶς τὸ ὄνομά Της.
  '45': Θεοτοκίον Μακαρισμῶν Α΄ ἤχου ἡμέρας Κυριακῆς.
  '46': Ὁ Γέροντας τὸ εἶπε τὸ 1984 καὶ δὲν ἔδωσε ἐξηγήσεις.
  '47': Ἔκφραση ἀπὸ τὰ μοναστηριακὰ Τυπικά, ἡ ὁποία σημαίνει ὅτι κάποια ἀλλαγὴ στὸ Τυπικὸ μπορεῖ νὰ ρυθμισθῆ κατὰ τὴν κρίση-διάκριση τοῦ Προεστῶτος. Ὁ Γέροντας ἐδῶ ἐννοεῖ «ὅ,τι σοῦ ὑποδείξη ἡ καρδιά σου».
  '48': Ἡ ἀδελφὴ ἐννοεῖ ἐπιστολὴ μὲ εὐχές, οἱ ὁποῖες συνήθως περιεῖχαν καὶ πνευματικὲς συμβουλές.
  '49': Ὁ Γέροντας ἐννοεῖ ὅτι δεκατρεῖς ἡμέρες ἀργότερα θὰ ἑορτάσουν στὸ Ἅγιον Ὄρος τὴν Κοίμηση τῆς Παναγίας μὲ τὸ παλαιὸ ἡμερολόγιο.
  '50': Τροπάρια τὰ ὁποῖα ψάλλονται στὸ τέλος τῆς Μικρᾶς Παρακλήσεως εἰς τὴν Ὑπεραγίαν Θεοτόκον.
  '51': Κατὰ τὰ ἔτη 1955–1958.
  '52': 'Σμίλη: Μεταλλικὸ αἰχμηρὸ ἐργαλεῖο ποὺ χρησιμοποιεῖται γιὰ τὴν λάξευση μαρμάρων ἢ λίθων.'
  '53': 'Βαριά: Μεγάλο καὶ βαρὺ σιδερένιο σφυρὶ γιὰ τὴν κατεργασία σιδήρου καὶ γιὰ σπάσιμο πέτρας, βράχων, μπετὸν κ.λπ.'
  '54': Πρβλ. Βασιλείου τοῦ Μεγάλου, Ὁμιλία ΙΘ ΄,Eἰς τοὺς ἁγίους Τεσσαράκοντα Μάρτυρας,PG31, 508C.
  '55': Ὁ Γέροντας ἐννοεῖ τὴν θεία Χάρη, ἡ ὁποία τρέφει καὶ γλυκαίνει τὸν ἄνθρωπο.
  '56': Κατὰ τὰ ἔτη 1967–1968.
  '57': Γέροντος Παϊσίου Ἁγιορείτου,Ἁγιορεῖται Πατέρες καὶ Ἁγιορείτικα, σ. 11.
  '58': Βιβλίο ποὺ περιέχει τὶς Ἀκολουθίες τῶν Ἁγίων ποὺ ἑορτάζουν κάθε ἡμέρα. Γιὰ κάθε μήνα ὑπάρχει ἰδιαίτερο Μηναῖο.
  '59': Τὸν Νοέμβριο τοῦ 1966 ὁ Γέροντας ὑποβλήθηκε σὲ ἐγχείρηση στοὺς πνεύμονες, ἐπειδὴ εἶχε βρογχεκτασίες.
  '60': Παροχέτευση ὑγρῶν μετὰ ἀπὸ χειρουργικὴ ἐπέμβαση.
  '61': Ὁ Ἅγιος Γεώργιος ὁ Σιναΐτης ἐπεθύμησε τὴν ἡμέρα τῆς Ἀναστάσεως νὰ κοινωνήση στὸν Ἱερὸ Ναὸ τῆς Ἀναστάσεως στὰ Ἰεροσόλυμα. Τὴν ὥρα τῆς Θείας Κοινωνίας, ἐνῶ βρισκόταν στὸ κελλί του, βρέθηκε στὸν Ναὸ τῆς Ἀναστάσεως καὶ κοινώνησε ἀπὸ τὰ χέρια τοῦ Πατριάρχου Ἰεροσολύμων. Ἡ μνήμη του ἑορτάζεται στὶς 11 Μαρτίου.
  '62': Ματθ.6, 4· 6, 6 καὶ 6, 18.
  '63': Βλ. Γέροντος Παϊσίου Ἁγιορείτου,Ἁγιορεῖται Πατέρες καὶ Ἁγιορείτικα.
  '64': Ἀποκ.2, 13. Ὁ Ἅγιος Ἀντίπας, ἐπίσκοπος Περγάμου, ἔζησε κατὰ τοὺς Ἀποστολικοὺς χρόνους καὶ μαρτύρησε στὴν Πέργαμο. Ἡ μνήμη του ἑορτάζεται στὶς 11 Ἀπριλίου.
  '65': Εἰπώθηκε τὸ 1986.
  '66': Στὴν Ἱερὰ Μονὴ Ἐσφιγμένου τὰ ἔτη 1953–1955.
  '67': 'Βουρδουναριό: Σταῦλος ὑποζυγίων καὶ οἱ σχετικοὶ βοηθητικοὶ χῶροι.'
  '68': Βλ.Ματθ.6, 21.
  '69': Πρόκειται γιὰ τὸν ἴδιο τὸν Γέροντα. (Βλ. Γέροντος Παϊσίου Ἁγιορείτου,Ὁ Ἅγιος Ἀρσένιος ὁ Καππαδόκης,ἔκδ. Ἱ. Ἡσυχαστηρίου «Εὐαγγελιστὴς Ἰωάννης ὁ Θεολόγος», Σουρωτὴ Θεσσαλονίκης 282010, σ. 33–35).
  '70': Ὁ Γέροντας ὑπαινίσσεται συγκεκριμένα θαύματα ποὺ εἶχε κάνει ὁ Ἅγιος Ἀρσένιος (Χατζεφεντῆς), ὅταν ζοῦσε, ἀναγκάζοντας κάποιους κλέφτες ὄχι μόνο νὰ φύγουν ἄπρακτοι, ἀλλὰ νὰ τοῦ ζητήσουν καὶ συγχώρηση. (Βλ. Γέροντος Παϊσίου Ἁγιορείτου,ὉἍγιοςἈρσένιοςὁΚαππαδόκης,σ. 96–97, 102–103 κ.ἄ.).
  '71': Μὲ τὴν συμβουλὴ αὐτὴν ὁ Γέροντας Παΐσιος δὲν ἀπορρίπτει τὴν ἰατρικὴ βοήθεια, ἀλλὰ θέλει νὰ μᾶς παρακινήση νὰ ζητοῦμε μὲ πίστη τὴν βοήθεια τῶν Ἁγίων.
  '72': Βλ.Ἰω.14, 12.
  '73': Ἡ μνήμη του ἑορτάζεται στὶς 3 Ἰουνίου.
  '74': Τὸ χωρίο δὲν ἐντοπίσθηκε.
  '75': Βλ.Ματθ.6, 33.
  '76': Πρβλ.Ματθ.21, 22.
  '77': Ματθ.6, 11.
  '78': Βλ.Α΄ Βασ.8, 4–22.
  '79': Βλ.Α΄ Βασ.14, 24–31 καὶ 22, 16–21.
  '80': Ματθ.6, 10.
  '81': Βλ. Ἀββᾶ Ἰσαὰκ τοῦ Σύρου,ΟἱἈσκητικοὶΛόγοι, Ἐπιστολὴ Δ ΄, σ. 331.
  '82': Τὸ χωρίο δὲν ἐντοπίσθηκε.
  '83': Βλ.Ματθ.7, 7·Λουκ.11, 9.
  '84': Ἀσφαλιστικὸ Ταμεῖο.
  '85': Ὁ Γέροντας ἀπευθύνεται σὲ βαριὰ ἄρρωστη καὶ πολὺ φιλότιμη ἀδελφή.
  '86': Ψαλμ.33, 2.
  '87': Εἰπώθηκε ἀπὸ τὸν Γέροντα στὶς 11 Ἰουνίου τοῦ 1994, ἕναν μήνα πρὶν ἀπὸ τὴν κοίμησή του.
  '88': Πρόκειται γιὰ τὸν ἴδιο τὸν Γέροντα Παΐσιο.
  '89': Πρβλ.Ματθ.8, 22· καὶΛουκ.9, 60. «Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς».
  '90': Ὁ Γέροντας στὴν Ἱερὰ Μονὴ Φιλοθέου γιὰ ἕνα διάστημα ἦταν δοχειάρης, δηλαδὴ ὑπεύθυνος γιὰ τὴν παραλαβή, ἀποθήκευση καὶ διανομὴ τῶν τροφίμων.
  '91': Κατὰ τὴν ἁγιορείτικη παράδοση ὁ ἱερεύς, πρὶν ὁλοκληρώση τὴν Προσκομιδή, χτυπάει καμπανάκι, καὶ οἱ πιστοὶ μνημονεύουν νοερῶς ὀνόματα Ὀρθοδόξων Χριστιανῶν ζώντων καὶ κεκοιμημένων, ἐνῶ ἐκεῖνος βγάζει γι’ αὐτοὺς μερίδες.
  '92': Πρόκειται γιὰ τὸν ἴδιο τὸν Γέροντα Παΐσιο.
  '93': Ἀφαίρεση κακοήθους ὄγκου ἀπὸ τὸ παχὺ ἔντερο τὸν Φεβρουάριο τοῦ 1994.
  '94': Βλ. Δέηση πρὸ τοῦ«Δι’ εὐχῶν»τῆς ἀπολύσεως τοῦ Μεσονυκτικοῦ καὶ τοῦ Ἀποδείπνου.
  '95': Εἰπώθηκε ἀπὸ τὸν Γέροντα στὶς 28 Ἰουνίου τοῦ 1994, δηλαδὴ δύο ἑβδομάδες πρὶν ἀπὸ τὴν κοίμησή του.
  '96': Ἰω.5, 24.
  '97': Βλ. Γέροντος Παϊσίου Ἁγιορείτου,Ἁγιορεῖται Πατέρες καὶ Ἁγιορείτικα, σ. 85–88.
  '98': 'Καθολικό: Ὁ κεντρικὸς Ναὸς τοῦ Μοναστηριοῦ.'
  '99': Ἔτσι ὀνομάζεται ὁ 118ος Ψαλμός, ὁ ὁποῖος ἀρχίζει μὲ τὴν φράση«Μακάριοι οἱ ἄμωμοι ἐν ὁδῷ».
  '100': Εἰπώθηκε τὸν Δεκέμβριο τοῦ 1993.
  '101': Τὸ Ψαλτήρι εἶναι χωρισμένο σὲ εἴκοσι ἑνότητες, οἱ ὁποῖες ὀνομάζονται Καθίσματα.
  '102': Ψαλμ.103, 35.
  '103': Ψαλμ.36, 39.
  '104': Βλ. Παράρτημα σ. 249.
  '105': Τὸν 50ο Ψαλμό.
  '106': Σύμφωνα μὲ τὸ Τυπικὸ τῆς Ἐκκλησίας ἀναγινώσκεται στὸν Ἑσπερινὸ ἕνα Κάθισμα τοῦ Ψαλτηρίου καὶ στὸν Ὄρθρο δύο Καθίσματα. Ἔτσι μέσα στὴν ἑβδομάδα ὁλοκληρώνεται ἡ ἀνάγνωση ὅλου τοῦ Ψαλτηρίου.
  '107': 'Πρῶτο μέρος: 1ος Ψαλμὸς ἕως τὸν 54ο. Δεύτερο μέρος: 55ος ἕως τὸν 100ο. Τρίτο μέρος: 101ος ἕως τὸν 150ο.'
  '108': Ὁ Γέροντας ἐννοεῖ τὸ σῶμα, τὸ ὁποῖο εἶναι«ναὸςτοῦἉγίουΠνεύματος»(Βλ.Α΄ Κορ.6:19).
  '109': Τὰ λόγια τῆς εὐχῆς φανερώνουν τὸ ὀρθὸ δόγμα τῆς πίστεώς μας. Τὸ«Κύριε»φανερώνει τὴν θεία φύση τοῦ Χριστοῦ. Τὸ«Ἰησοῦ»φανερώνει τὴν ἀνθρώπινη φύση Του. Τὸ«Χριστὲ»φανερώνει καὶ τὶς δύο φύσεις. Τὸ«Υἱὲ τοῦ Θεοῦ»φανερώνει ὅτι οἱ δύο φύσεις τοῦ Χριστοῦ εἶναι ἀσύγχυτες καὶ ὕστερα ἀπὸ τὴν ἕνωσή τους. (Βλ. Ἀνωνύμου τινὸς Ἁγίου,Λόγος θαυμάσιος περὶ τῶν λόγων τῆς θείας προσευχῆς,Φιλοκαλία τῶν Ἱερῶν Νηπτικῶν, ἐκδ. «Ἀστήρ», Ἀθῆναι 1976, τόμος Ε΄, σ. 65–66).
  '110': Βλ. Ἀνωνύμου Ἡσυχαστοῦ,Νηπτικὴ Θεωρία, ἐκ χειρογράφου τῆς Ἱερᾶς Μονῆς Ξενοφῶντος Ἁγίου Ὄρους, ἐκδ. «Ὀρθόδοξος Κυψέλη», Θεσσαλονίκη 1979, σ. 97–99.
  '111': Βλ.Ματθ.22, 37·Μάρκ.12, 30·Λουκ.10, 27.
  '112': Πρόκειται γιὰ τὸν ἴδιο τὸν Γέροντα Παΐσιο.
  '113': Ἐννοεῖ τὴν Σκήτη τῆς Ἁγίας Ἄννης.
  '114': Κατὰ τὰ ἔτη 1964–1967.
  '115': Ἀντιρρητικὸς πόλεμος σημαίνει νὰ ἀντικρούη κανεὶς τοὺς κακοὺς λογισμοὺς φέρνοντας ἀντίστοιχους καλούς.
  '116': ᾎσμα ᾈσμ.5, 2.
  '117': Ὁ Γέροντας ἐννοεῖ ὅτι ἡ ἐργασία τῆς εὐχῆς ἀπαιτεῖ καὶ σωματικὸ κόπο καὶ ἀγώνα κατὰ τῶν παθῶν. Δὲν ἔχει καμμία σχέση μὲ τὶς τεχνικὲς ποὺ χρησιμοποιοῦν οἱ ἀνατολικὲς θρησκεῖες, μὲ σκοπὸ τὴν κατ’ αὐτοὺς λύτρωση, τὴν ὁποία ὀνομάζουν «νιρβάνα».
  '118': Βλ. Ἀββᾶ Ἰσαὰκ τοῦ Σύρου,Οἱ Ἀσκητικοὶ Λόγοι, Λόγος ΟϚ΄, σ. 261.
  '119': Βλ. ὅ.π. Λόγος ΚΗ΄, σ. 104· Λόγος ΚΘ΄, σ. 108· Λόγος ΝΗ΄, σ. 212.
  '120': 'Γέροντας Ἀρσένιος ὁ Σπηλαιώτης (1886–1983): Ἀσκητὴς τῶν σπηλαίων τῆς Μικρᾶς Ἁγίας Ἄννης τοῦ Ἁγίου Ὄρους.'
  '121': Βλ. Ἰγνάτιος Μπριαντσιανίνωφ,Υἱέ μου, δός μοι σὴν καρδίαν…, ἐκδ. «Ὀρθόδοξος Κυψέλη», Θεσσαλονίκη 1978, σ. 178.
  '122': Νηπτικοὶ Πατέρες ὀνομάζονται οἱ Πατέρες τῆς Ἐκκλησίας ποὺ ἐργάσθηκαν καὶ ἐδίδαξαν εἰδικώτερα τὴν ἐργασία τῆς νήψεως.
  '123': Γιὰ τὴν ἐφαρμογὴ κάποιας πρακτικῆς μεθόδου γιὰ τὴν εὐχὴ εἶναι ἀπαραίτητη ἡ παρακολούθηση ἀπὸ ἔμπειρο Πνευματικό.
  '124': Ὁ Γέροντας ἀναφέρεται στὸ βιβλίο«Οἱ περιπέτειες ἑνὸς προσκυνητοῦ». Μετάφρασις ἀπὸ τὴν ρωσικὴ γλῶσσα †Παντελεήμονος Καρανικόλα, Μητροπολίτου Κορίνθου, ἐκδ. «Ἀστέρος», Ἀθήνα 2006.
  '125': Ἡ πιὸ γνωστὴ συλλογὴ νηπτικῶν πατερικῶν κειμένων εἶναι ἡ«Φιλοκαλία τῶν Ἱερῶν Νηπτικῶν», τὴν ὁποία συνέταξαν, ἐπιμελήθηκαν καὶ ἐξέδωσαν τὸ 1782 ὁ Ἅγιος Μακάριος Νοταρᾶς (†1805) καὶ ὁ Ἅγιος Νικόδημος ὁ Ἁγιορείτης (†1809).
  '126': Γιὰ «τὸ βύθισμα στὴν εὐχὴ» βλ. σ. 248.
  '127': Βλ. Αγ. Γρηγορίου του Παλαμά,Περί προσευχής και καθαρότητος καρδίας κεφάλαια τρία,Φιλοκαλία των Ιερών Νηπτικών, εκδ. «Αστήρ», Αθήναι 1976, τόμος Δ’, σ. 132.
  '128': Βλ.Γέν.1, 26.
  '129': Ἡ λέξη «νήψη» προέρχεται ἀπὸ τὸ ρῆμα «νήφω», τὸ ὁποῖο σημαίνει «ἀπέχω οἴνου, δὲν εἶμαι μεθυσμένος» καὶ μεταφορικὰ «ἔχω πνευματικὴ διαύγεια, σωφρονῶ, ὀρθοφρονῶ».
  '130': Βλ. Ἀββᾶ Ἰσαὰκ τοῦ Σύρου,Οἱ Ἀσκητικοὶ Λόγοι, Λόγος ΚΘ΄, σ. 107.
  '131': Ὁ Γέροντας συχνὰ μιλοῦσε γιὰ «συνεργεῖο προσευχῆς» καὶ «συνεταιρισμὸ» γιὰ θέματα προσευχῆς.
  '132': Κατάσταση πνευματικὴ κατὰ τὴν ὁποία ὁ ἄνθρωπος, ὅταν καθαρθῆ ἀπὸ τὰ πάθη, δὲν ἔχει πλέον λογισμούς. Ὅπως γράφει ὁ Ἀββᾶς Ἰσαάκ, ἡ ψυχὴ δέχεται τὴν εἰρήνη τῶν λογισμῶν καὶ ἀπὸ τὴν εἰρήνη τῶν λογισμῶν ἀνυψώνεται στὴν καθαρότητα τοῦ νοῦ. Ἀπὸ τὴν καθαρότητα δὲ τοῦ νοῦ ὁ ἄνθρωπος φθάνει νὰ βλέπη τὰ μυστήρια τοῦ Θεοῦ, φθάνει δηλαδὴ στὴν θεωρία. Ἔχει τὴν αἴσθηση τοῦ Θεοῦ, ἀπολαμβάνει τὸν Θεό. (Βλ. Ἀββᾶ Ἰσαὰκ τοῦ Σύρου,Οἱ Ἀσκητικοὶ Λόγοι, Λόγος Θ΄, σ. 38).
