  '180': 'Ναπολέων Ζέρβας (Ἄρτα 1891-Ἀθήνα 1957): Πολιτικὸς καὶ στρατιωτικός, ἕνας ἀπὸ τοὺς σπουδαιότερους ἀγωνιστὲς στὴν ἐθνικὴ ἀντίσταση ἐναντίον τῶν Γερμανῶν. Πρὸς τὰ τέλη τῆς Γερμανικῆς Κατοχῆς οἱ στρατιωτικὲς δυνάμεις τοῦ Ζέρβα ἤλεγχαν τὸ μεγαλύτερο μέρος τῆς Αἰτωλοακαρνανίας καὶ τῆς Ἠπείρου, ὅπου καὶ τὰ ὄρη Τζουμέρκα.'
  '181': Πρβλ. Πρῶτον τροπάριον τῆς ε΄ ᾠδῆς τοῦ προεορτίου κανόνος τῆς ἑορτῆς τῶν Θεοφανείων, ὁ ὁποῖος ψάλλεται στὸ Ἀπόδειπνο τῆς 5ης Ἰανουαρίου.
  '182': Εἰπώθηκε σὲ περίοδο μεγάλης ἀνομβρίας, ὅταν μία ἡμέρα ἔβρεξε ἐλάχιστα.
