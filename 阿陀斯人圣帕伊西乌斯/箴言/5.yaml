  '174': Ο βίος του Οσίου Γερασίμου του Ιορδανίτου είναι συνδεδεμένος με ένα λιοντάρι που παρουσιάσθηκε μπροστά του στην όχθη του Ιορδάνου και ωρυόταν από τον πόνο, γιατί είχε μπή στο πόδι του ένα μυτερό καλάμι. Ο Όσιος συμπόνεσε το ζώο και του έβγαλε το καλάμι. Από τότε το λιοντάρι ακολουθούσε τον Όσιο «ως γνήσιος μαθητής» του. (Βλ. Ιωάννου Μόσχου,Πνευματικός Λειμών, Φιλοκαλία των Νηπτικών και Ασκητικών, τόμος 2, εκδ. «Το Βυζάντιον», Θεσσαλονίκη 1987, σ. 204–207).
  '175': Το 1987.
  '176': Την περίοδο 1968–1979.
  '177': Στο Καλύβι «Παναγούδα».
  '178': Βλ.Έξ. 16, 13·Αριθμ. 11, 31–32.
  '179': Το μελίσσι είχε μπή από τις τρύπες του κλειστού παντζουριού και είχε φτιάξει την κυψέλη του ανάμεσα στο κλειστό παντζούρι και στο τζάμι. Ο Γέροντας είχε συνέχεια κλειστό αυτό το παράθυρο του κελλιού του και τραβηγμένη την κουρτίνα. (Συνέβη στο Ησυχαστήριο τον Ιούνιο του 1993).
  '180': Ψαλμ. 35, 7.
  '181': Το γράμμα το είχαν στείλει στον Γέροντα αδελφές του Ησυχαστηρίου την άνοιξη του 1975.
  '182': Το πουλί αυτό ήταν ένας κοκκινολαίμης.
  '183': 'Ραχώνι: Λόφος, βουναλάκι.'
  '184': Το Καλύβι του Τιμίου Σταυρού.
  '185': Η σχέση του Γέροντα με τα ζώα δεν ήταν μια εκδήλωση ζωοφιλίας αλλά έκφραση «ελεήμονος καρδίας», της οποίας η αγάπη ξεχυνόταν προς όλη την κτίση.
