  '241': Η αδελφή ζητά κάποιο «βότανο», δηλαδή λόγο πνευματικό, έχοντας υπ᾿ όψιν της την επιστολή «Πνευματικά βότανα», την οποία ο Γέροντας έστειλε στο Ησυχαστήριο στις 13–1-1971. (Βλ. Γέροντος Παϊσίου Αγιορείτου,Επιστολές,[9]2005, σ. 151–162).
  '242': Ο Γέροντας έγραψε το Μεγαλυνάριο αυτό και το έστειλε στην γιορτή αδελφής που έφερε όνομα της Παναγίας, για να το ψάλλη στο κελλί της.
  '243': Από το Θεοτοκίον της α´ ωδής του β´ κανόνος της Δευτέρας της Γ´ Εβδομάδος των Νηστειών.
