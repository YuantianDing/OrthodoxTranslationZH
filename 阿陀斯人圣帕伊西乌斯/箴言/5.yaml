  '103': Ιακ. 4, 6·Α´ Πέτρ. 5, 5. Βλ. καιΠαρ. 3, 34.
  '104': Η συζήτηση αυτή έγινε στο Ησυχαστήριο τον Φεβρουάριο του 1968 με τις πρώτες αδελφές. Ο Γέροντας την άλλη ημέρα θα έφευγε για το Άγιον Όρος, αφού είχε μείνει στο Ησυχαστήριο δύο μήνες, για να βάλη τα θεμέλια της πνευματικής και κοινοβιακής ζωής.
  '105': Βλ. Του Οσίου πατρός ημών Ισαάκ,Τα ευρεθέντα ασκητικά, Λόγος ΜΘ´, σ. 203.
  '106': Βλ. Αββά Ισαάκ του Σύρου,Οι Ασκητικοί Λόγοι, Λόγος Κ´, σ. 71.
  '107': Στο χωρίο στο οποίο αναφέρεται η αδελφή ο Αββάς Ισαάκ μιλάει για την ταπείνωση ως τελεία πλέον κατάσταση, ενώ ο Γέροντας αναφέρεται στην ταπεινοφροσύνη που απαιτείται στον αγώνα για την καλλιέργεια των αρετών. («Η ταπείνωσις είναι κρυπτή τις δύναμις, την οποίαν δέχονται οι τέλειοι άγιοι μετά το τέλος πάσης της εαυτών πολιτείας», Αββά Ισαάκ του Σύρου,Οι Ασκητικοί Λόγοι, Λόγος Κ´, σ. 69).
  '108': 'Βλ.Ματθ. 5, 3: «Μακάριοι οι πτωχοί τω πνεύματι».'
  '109': 'Ασπασμός: Χαιρετισμός.'
  '110': Λουκ. 1, 38.
