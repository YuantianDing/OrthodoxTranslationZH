  '27': Βλ.Ευχολόγιον το Μέγα, Ακολουθία του Μεγάλου και Αγγελικού Σχήματος, σ. 207.
  '28': Βλ.Έξ. 34, 28.
  '29': Α’ Κορ. 1, 31. Βλ. καιΡωμ. 5, 11·Φιλιπ. 3, 3.
  '30': Η λέξη «δικαίωμα» στην μοναχική ζωή δηλώνει την τάση του μοναχού να δικαιώνη τον εαυτό του και την απαίτηση να ικανοποιή οποιαδήποτε εγωκεντρική επιθυμία του.
  '31': Α’ Τιμ. 6, 12.
  '32': Βλ.Γαλ. 1, 10.
  '33': 'Ατιμία: Αδοξία, έλλειψη τιμής και δόξας.'
  '34': Ο Γέροντας συχνά αναφερόταν στους πνευματικούς νόμους, για τους οποίους έγραψε εκτενέστερα στο βιβλίο «Ο Γέρων Χατζη-Γεώργης ο Αθωνίτης», σ. 70 (Βλ. και Γέροντος Παϊσίου Αγιορείτου,Λόγοι, Τόμος Δ’, «Οικογενειακή ζωή», Ι. Ησυχ. Ευαγγ. Ιωάννης ο Θεολόγος, Σουρωτή Θεσσαλονίκης,[7]2006, σ. 243).
  '35': Λουκ. 14, 11.
  '36': Βλ. Ησυχίου Πρεσβυτέρου,Προς Θεόδουλον Λόγος ψυχωφελής και σωτήριος περί νήψεως και αρετής κεφαλαιώδης, ρκα’, Φιλοκαλία των Ιερών Νηπτικών, εκδ. «Αστήρ», Αθήναι 1974, τόμος Α’, σ. 159.
