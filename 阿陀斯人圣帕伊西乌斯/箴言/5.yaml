  '123': Βλ.Το Γεροντικόν, Αββάς Μωϋσής δ´, σ. 72.
  '124': Το περιστατικό αναζητήθηκε, αλλά δεν εντοπίσθηκε. Παρόμοια διήγηση υπάρχει στις διδαχές του Αββά Δωροθέου. (Βλ. Αββά Δωροθέου,Έργα Ασκητικά, Ζ´Διδασκαλία, παρ. 80, εκδ. «Ετοιμασία», Ιερά Μονή Τιμίου Προδρόμου, Καρέας[6]2000, σ. 204–207).
  '125': Του Οσίου πατρός ημών Ισαάκ,Τα ευρεθέντα ασκητικά, Λόγος Ε´, σ. 28.
  '126': Ό.π.
  '127': 'Τάλαντο: Ξύλινο χειροσήμαντρο, το οποίο χτυπάει ο εντεταλμένος μοναχός με ξύλινο σφυράκι, για να αναγγείλη την έναρξη μιας Ακολουθίας.'
  '128': Βλ.Ματθ. 25, 14–30.
  '129': Το Γεροντικόν, Αββάς Σισώης ιγ´, σ. 111.
  '130': Ό.π.
  '131': Ό.π.
  '132': 'Σκαθάρι (σκαραβαίος ο ιερός): Έντομο το οποίο, για να εκκολαφθούν τα αυγά του, τα τοποθετεί μέσα σε μπαλίτσες από κοπριά ζώων, τις οποίες κυλάει με τα πόδια του και τις βάζει σε μέρος ασφαλισμένο.'
  '133': Βλ.Α´ Κορ. 3, 16·Β´ Κορ. 6, 16.
  '134': Βλ. Γέροντος Παϊσίου Αγιορείτου,Αγιορείται Πατέρες και Αγιορείτικα, σ. 41–42.
  '135': Βλ.Το Γεροντικόν, Αββάς Αντώνιος ζ´, σ. 2.
  '136': 'Αμπρί: Καταφύγιο, χαράκωμα που προστατεύει τους στρατιώτες από τις εχθρικές βολές. (Έτσι χαρακτήριζε ο Γέροντας και το κελλί του μοναχού).'
  '137': Αναφέρεται στην απάντηση «ουκ εκπειράσεις Κύριον τον Θεόν σου» (Βλ.Ματθ. 4:6–7) που έδωσε ο Χριστός στον διάβολο, όταν Του είπε να πέση από την στέγη του ναού του Σολομώντος.
  '138': Βλ.Β’ Κορ. 11, 14.
  '139': Η Οσία Ισιδώρα έζησε στο Μοναστήρι των Ταβεννησιωτών, το οποίο είχε ιδρύσει ο Όσιος Παχώμιος στις αρχές του 4ου αιώνος. Ταπείνωνε και εξευτέλιζε τον εαυτό της και υποκρινόταν την σαλή «διά τον Χριστόν». Περιφερόταν πάντοτε ξυπόλυτη και φορούσε ένα κουρέλι στο κεφάλι της, ενώ οι άλλες μοναχές φορούσαν κουκούλι. Αν και πολλές φορές δέχθηκε ύβρεις και χτυπήματα, ποτέ δεν γόγγυσε. Η αγιότητα του βίου της αποκαλύφθηκε με όραμα στον μεγάλο ασκητή Πιτηρούν, ο οποίος  επισκέφθηκε το Μοναστήρι και φανέρωσε ενώπιον όλης της Αδελφότητος ότι η Ισιδώρα, την οποία θεωρούσαν σαλή, ήταν Αμμάς, δηλαδή πνευματική μητέρα.
  '140': Κάτοικοι των Φαράσων της Καππαδοκίας, πατρίδος του Αγίου Αρσενίου.
  '141': 'Καπί: Επανωφόρι χονδρό.'
  '142': Προκείμενον Εσπερινού Τρίτης. Βλ. καιΨαλμ. 22, 6.
  '143': Βλ.Λουκ. 15, 7.
  '144': Βλ.Ψαλμ. 77, 36.
  '145': Ο Γέροντας, ο οποίος ως γνωστόν ήταν κατά πάντα νομοταγής, χρησιμοποιεί αυτό το παράδειγμα του ανυπότακτου στρατιώτη, για να μας βοηθήση να καταλάβουμε ότι, αν φουντώση η φλόγα της αγάπης του Θεού στον άνθρωπο, τότε «καί τα μυαλά του ανθρώπου είναι παρμένα από την αγάπη του Θεού» και φθάνει να κάνη πράγματα που δύσκολα μπορεί κανείς να τα καταλάβη και να τα δικαιολογήση.
  '146': Από τον ειρμό της η´ωδής του κανόνος του Μεγάλου Σαββάτου.
  '147': Βλ.Φιλιπ. 3, 8.
  '148': 'Ενοικιοστάσιο: Νομική διάταξη σύμφωνα με την οποία οι ενοικιαστές στέγης δικαιούνται παράταση της μισθώσεως.'
  '149': 'Βλ. Γρηγορίου μοναχού, μαθητού Αγ. Βασιλείου του Νέου, «Ο τελωνισμός των ψυχών κατά την ώρα του θανάτου: Τα είκοσι τρία βασικά τελώνια», Ι. Ησυχ. Αγ. Αθανασίου και Αγ. Νεομαρτύρων Ακυλίνης, Κυράννης και Αργυρής, Γαλήνη Όσσης Λαγκαδά.'
  '150': 'Απλόχερο: Όσο χωράει μία χούφτα.'
  '151': Βλ.Ματθ. 25, 25.
  '152': Βλ.Ιω. 13, 34 και 15, 12.
  '153': Βλ.Α´ Κορ. 13, 3.
  '154': Βλ.Α´ Κορ. 13, 2.
  '155': 'Ο Γέροντας το 1981 είχε πεί: «Είναι δυνατό στον άνθρωπο να έχη μέσα του πάντα την φλόγα της θεϊκής αγάπης. Εγώ είχα συνέχεια αυτήν την ουράνια γλυκύτητα. Καιγόμουνα ολόκληρος και τα κόκκαλα γίνονταν σαν αναμμένες λαμπάδες. Όταν έπρεπε να κάνω κάτι ή να πάω κάπου, βίαζα τον εαυτό μου να βγώ απ᾿ αυτήν την κατάσταση. Πολλές φορές από την γλυκύτητα αυτή την ουράνια έπεφτα κάτω. Τώρα μετατράπηκε αυτό σε πόνο για τον κόσμο. Πονάω για τον κόσμο και μέρα με την μέρα μεγαλώνει αυτός ο πόνος. Λειώνω κυριολεκτικά».'
  '156': Το Γεροντικόν, Αββάς Παμβώ ι´, σ. 102.
  '157': Ο Γέροντας αναφέρεται στην δεκαετία του 1960.
  '158': Λουκ. 21, 4.
  '159': Β´ Κορ. 9, 7.
  '160': Ο Προφήτης Ηλίας εξαιτίας της ανομβρίας είχε καταφύγει στον χείμαρρο Χορράθ. Μόλις ξεράθηκε και αυτός ο χείμαρρος, ο Θεός τον έστειλε στα Σαρεπτά της Σιδωνίας, για να τον διατρέφη μία χήρα. (Βλ.Γ´ Βασ. 17:1–24).
  '161': Βλ. Γ´ Βασ. 17, 12–13.
