  text:
    ru: Λόγοι Α'•Λόγοι Β'•Λόγοι Γ'•Λόγοι Δ'•Λόγοι Έ•Λόγοι ΣΤ'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Περιεχόμενα
- type: h1
  initial:
    ru: ''
  text:
    ru: Слова. Том 5. Страсти и добродетели.Λόγοι Έ – Πάθη και αρετές
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρόλογος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο μακαριστός Γέροντας Παΐσιος στο ξεκίνημα της κοινοβιακής μας ζωής, το 1968, μας είχε πεί: «Μία είναι η αρετή, η ταπείνωση· επειδή όμως δεν το καταλαβαίνετε, άντε, να σάς πω και την αγάπη. Αλλά, όποιος έχει ταπείνωση, δεν έχει και αγάπη;». Αυτές οι δύο «αδελφωμένες αρετές», όπως χαρακτήριζε ο Γέροντας την ταπείνωση και την αγάπη, είναι το θεμέλιο της πνευματικής ζωής, αφού αυτές ελκύουν την Χάρη του Θεού και γεννούν και όλες τις άλλες αρετές. «Καλλιεργήστε απλά την ταπείνωση και την αγάπη, μας έλεγε, καί, μόλις αυξηθούν αυτές οι αρετές, η υπερηφάνεια και η κακία θα μείνουν ατροφικές και τα πάθη θα αρχίσουν να ψυχορραγούν».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στον παρόντα Ε´ τόμο – ο οποίος εκδίδεται με την ευλογία του Ποιμενάρχου μας Σεβασμιωτάτου Μητροπολίτου Κασσανδρείας κ. Νικοδήμου – συμπεριλαμβάνονται λόγοι του Γέροντα σχετικά με τα πάθη και τις αρετές. Οι λόγοι αυτοί δεν αποτελούν συστηματική διδασκαλία ούτε αναφέρονται εκτενώς σε όλα τα πάθη και τις αρετές. Έχουν συγκροτηθή από απαντήσεις του Γέροντα σε ερωτήσεις μας σχετικές με την διάγνωση και την θεραπεία των παθών, καθώς και με την εργασία της αρετής. Οι απαντήσεις αυτές δεν ενδιαφέρουν μόνον τους μοναχούς αλλά και κάθε άνθρωπο που έχει «τήν καλή ανησυχία» για την καλλιέργεια της αρετής. Ο Γέροντας με την γνωστή ποιμαντική του, τα εύστοχα παραδείγματα και το πηγαίο χιούμορ, κάνει πνευματική «λιακάδα», η οποία ευνοεί να ανοίξουν στην ψυχή μας τα άνθη της μετανοίας και να δώσουμε καρπό αρετής.Μας ενθαρρύνει να δούμε κατά πρόσωπο τον παλαιό μας άνθρωπο, ώστε να σιχαθούμε το «ειδεχθές προσωπείον» του και να το αποβάλουμε. Πιστεύουμε ότι ο απλός αλλά φωτισμένος λόγος του Γέροντα θα μας βοηθήση να αγωνισθούμε ακόμη περισσότερο, για να ελευθερωθούμε από την δουλεία των παθών και να ζήσουμε την εν Χριστώ ελευθερία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Γέροντας έλεγε: «Ο Θεός δεν δίνει στον άνθρωπο ελαττώματα αλλά δυνάμεις. Ανάλογα με το πώς θα χρησιμοποιήση ο άνθρωπος τις δυνάμεις αυτές, μπορεί να γίνη καλός ή κακός». Αν δηλαδή χρησιμοποιήσουμε τις δυνάμεις αυτές σύμφωνα με το θέλημα του Θεού, πλησιάζουμε στον Θεό και γινόμαστε κατά χάριν όμοιοι με Εκείνον. Αν τις χρησιμοποιήσουμε σύμφωνα με «τά θελήματα του παλαιού ανθρώπου», γινόμαστε δούλοι των παθών και απομακρυνόμαστε από τον Θεό. Για να γίνουμε «καινοί άνθρωποι» χρειάζεται να ταυτίσουμε το θέλημά μας με το θέλημα του Θεού, το οποίο εκφράζεται με τις άγιες εντολές Του. «Τηρώντας τις εντολές του Θεού, έλεγε ο Γέροντας,εργαζόμαστε την αρετή και αποκτούμε την υγεία της ψυχής».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Γέροντας τόνιζε ότι η θεία Χάρις παύει να ενεργή στον άνθρωπο που δουλεύει στα πάθη του. Γι᾿ αυτό, όταν κάποιος του έλεγε ότι πέφτει σε ένα πάθος, συνήθιζε να λέη: «Πρόσεξε, γιατί έτσι διώχνεις την Χάρη του Θεού». Και όταν τον ρωτούσαμε πώς θα αποκτήσουμε την Χάρη του Θεού ή πώς ο άνθρωπος συγγενεύει με τον Θεό, άλλοτε μας έλεγε με την ταπείνωση, άλλοτε με την αγάπη και την αρχοντιά, άλλοτε με την θυσία και το φιλότιμο, και άλλοτε τόνιζε το πέταμα του εαυτού μας. Γιατί όλα αυτά είναι τα χαρακτηριστικά του «καινού ανθρώπου», του ανθρώπου που έχει απαλλαγή από τα πάθη. «Όταν λέω να πετάξουμε τον εαυτό μας, έλεγε ο Γέροντας,εννοώ να πετάξουμε τα πάθη μας, να απεκδυθούμε τον παλαιό μας άνθρωπο... Αν πετάξουμε τον εαυτό μας και φύγη ο κακός ενοικιαστής, ο παλαιός άνθρωπος, θα κατοικήση στο κενό της καρδιάς ο καινός άνθρωπος της Καινής Διαθήκης».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο τόμος αυτός απαρτίζεται από δύο ενότητες και η καθεμιά χωρίζεται σε τέσσερα μέρη. Η πρώτη ενότητα αναφέρεται στα πάθη και η δεύτερη στις αρετές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το πρώτο μέρος της ενότητας των παθών αναφέρεται στην φιλαυτία, την «μητέρα των παθών», αφού όλα τα πάθη – τόσο τα σωματικά, όπως η γαστριμαργία, η φιληδονία κ.λπ., όσο και τα ψυχικά, όπως η υπερηφάνεια, η ζήλεια κ.λπ. –, «από εκεί ξεκινούν».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το δεύτερο μέρος κάνει λόγο για την υπερηφάνεια, το «Γενικό Επιτελείο των παθών», όπως την χαρακτήριζε ο Γέροντας. Θα μπορούσαμε να πούμε ότι, όπως «μία είναι η αρετή, η ταπείνωση», έτσι κι ένα είναι το πάθος, η υπερηφάνεια, αφού αυτή «μάς έφερε από τον Παράδεισο στην γή, κι αυτή από την γη προσπαθεί να μας στείλη στην κόλαση».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το τρίτο μέρος αναφέρεται στην κατάκριση, που γεννιέται από την υπερηφάνεια και είναι «γεμάτη από αδικία». Ο άνθρωπος το χάρισμα της κρίσεως που του έδωσε ο Θεός, για να διακρίνη το καλό από το κακό, το μεταστρέφει στο πάθος της κατακρίσεως, που κατ᾿ εξοχήν αποστρέφεται ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο τέταρτο μέρος γίνεται λόγος για τα πάθη της ζήλειας, του θυμού και της λύπης, που και αυτά αποτελούν διαστροφή δυνάμεων της ψυχής και κατάχρηση αντίστοιχων χαρισμάτων. Την δύναμη του επιθυμητικού, που μας δόθηκε από τον Θεό για να αναζητάμε το καλό, την μεταστρέφουμε σε ζήλεια και φθόνο, ενώ την έμφυτη δύναμη του θυμικού, που πρέπει να χρησιμοποιούμε για να αγωνιζώμαστε με ανδρεία και παλληκαριά κατά του κακού, την στρέφουμε εναντίον του πλησίον. Το πάθος τέλος της λύπης μας στερεί την δυνατότητα να χαιρώμαστε τις πλούσιες ευλογίες του Θεού και μας αποδυναμώνει πνευματικά. Ο Γέροντας αντιδιαστέλλει την λύπη αυτήν από την κατά Θεόν λύπη, η οποία πηγάζει από την μετάνοια και γεμίζει την ψυχή με γλυκειά παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η ενότητα των αρετών αρχίζει με την «υψοποιό» ταπείνωση. Χωρίς την ταπείνωση οι αρετές μας είναι «τοξινωμένες»: Η υπομονή μπορεί να έχη μέσα γογγυσμό ή υποκρισία, η απλότητα μπορεί να εκτραπή σε αναίδεια και πονηρία, η χαρά να μην είναι πνευματική αγαλλίαση αλλά κοσμική ικανοποίηση. «Όσοι βρήκαν τον δρόμο της ταπεινοφροσύνης, έλεγε ο Γέροντας,προχωρούν στην πνευματική ζωή σύντομα, σταθερά και χωρίς κόπο». Και σε επιστολή του έγραφε: «Ο πιο σύντομος, σίγουρος και εύκολος δρόμος προς την άνω Ιερουσαλήμ είναι η ταπείνωση».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το δεύτερο μέρος αναφέρεται στην αγάπη, η οποία πρέπει να «μοιράζεται» σωστά στον Θεό, στον πλησίον και σε όλη την κτίση. Η αγάπη προς τον Θεό είναι αδιάσπαστα δεμένη με την αγάπη προς τον πλησίον και οδηγεί την ψυχή σε θείο έρωτα, θεία τρέλλα, θεία μέθη. Η αληθινή αγάπη προς τον πλησίον είναι η «ακριβή πνευματική αγάπη» που έχει όποιος «βγάζει τον εαυτό του από την αγάπη του», όποιος δηλαδή δεν αποβλέπει σε δικό του συμφέρον. Και η αγάπη προς όλη την κτίση είναι το υπερχείλισμα της «γενικής» αγάπης που έχει ο πνευματικός άνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το τρίτο μέρος αναφέρεται στην αρχοντιά και στο φιλότιμο, που αποτελούν κύριους άξονες της διδασκαλίας του Γέροντα. «Η αρχοντιά, έλεγε ο Γέροντας,όλα τα έχει· έχει φιλότιμο, έχει ταπείνωση και απλότητα, έχει ανιδιοτέλεια, τιμιότητα..., έχει και την μεγαλύτερη χαρά και την πνευματική αγαλλίαση». Ο Γέροντας, χωρίς να μειώνη την αξία της ασκήσεως, βάζει την αρχοντιά και το φιλότιμο πάνω από κάθε ασκητικό αγώνα, αφού, αν δεν υπάρχη αρχοντιά, όλα τα πνευματικά – άσκηση, μετάνοιες κ.λπ. –, είναι, όπως έλεγε, «κουκουσκιάχτικα», δηλαδή «μόνον τις κουρούνες μπορούν να διώξουν και όχι τα ταγκαλάκια».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο τέταρτο μέρος γίνεται αναφορά στην απλότητα, που είναι «τό πρώτο παιδί της ταπεινώσεως», στην πίστη και στην ελπίδα στον Θεό, που «είναι η μεγαλύτερη ασφάλεια για τον άνθρωπο», στην υπομονή, που «ξεδιαλύνει πολλά και φέρνει θεϊκά αποτελέσματα», και στην πνευματική χαρά, που «έρχεται με την εσωτερική τακτοποίηση και δίνει φτερά στην ψυχή». Τέλος, ο Γέροντας μιλάει για την διάκριση, την «κορωνίδα των αρετών». Η διάκριση «δέν είναι απλώς μία αρετή», δεν είναι βήμα προς την πνευματική πρόοδο, αλλά το αποτέλεσμα και η ασφάλειά της· είναι «τό τιμόνι που οδηγεί με ασφάλεια την ψυχή, ώστε να μη σκοντάφτη ούτε δεξιά ούτε αριστερά», αλλά να βαδίζη με σταθερότητα την βασιλική οδό των αρετών αποφεύγοντας τα άκρα, που είναι των δαιμόνων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ως επίλογος του τόμου έχουν παρατεθή λόγοι του Γέροντα για την καλή ανησυχία, «τήν καλή αγωνία για τον  «καλόν αγώνα»», όπως την χαρακτήριζε. «Η καλή ανησυχία, έλεγε,είναι φτερούγισμα. Δίνει στην ψυχή λεβεντιά, ζωντάνια· δεν φέρνει άγχος και στενοχώρια, αλλά παρηγοριά· δεν είναι κόπος, δεν είναι αγωνία, αλλά ζήλος για αγώνα».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτός ο πνευματικός ζήλος ευχόμαστε να ανάψη σε όλους μας, ώστε να αγωνισθούμε να απεκδυθούμε τον παλαιό μας άνθρωπο και να ενδυθούμε την ταπείνωση, για να κατοικήση στην καρδιά μας η Αγάπη, ο Χριστός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 26 Σεπτεμβρίου 2006
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μετάστασις του Αγίου Αποστόλου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί Ευαγγελιστού Ιωάννου του Θεολόγου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Καθηγουμένη του Ιερού Ησυχαστηρίου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φιλοθέη Μοναχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί αι σύν εμοί εν Χριστώ Αδελφαί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –   Γέροντα, πέστε μας κάτι πριν φύγετε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –   Τί να σάς πώ; Τόσα σάς είπα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –   Πέστε μας κάτι, για να το δουλέψουμε,μέχρι να ξαναρθήτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –   Έ, αφού επιμένετε, να σάς πώ... Μία είναι η αρετή, η ταπείνωση· επειδή όμως δεν το καταλαβαίνετε, άντε, να σάς πω και την αγάπη. Αλλά, όποιος έχει ταπείνωση, δεν έχει και αγάπη;
- type: h2
  initial:
    ru: ''
  text:
    ru: Ενότητα Πρώτη – Τα Πάθη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ο αγώνας κατά των παθών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: είναι ένα διηνεκές γλυκό μαρτύριο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιά την τήρηση των εντολών,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιά την αγάπη του Χριστού».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Ο αγώνας κατά των παθών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '–     Γέροντα, όταν ο Προφήτης Δαβίδ έλεγε: «πνεύματι ηγεμονικώ στήριξόν με»[1], τί ζητούσε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Δαβίδ ζητούσε από τον Θεό να του δώση διοικητικό χάρισμα, επειδή είχε να κυβερνήση ανθρώπους. Αλλά και ο κάθε άνθρωπος χρειάζεται «πνεύμα ηγεμονικό», γιατί έχει να κυβερνήση τον εαυτό του, για να μην τον κάνουν κουμάντο τα πάθη του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι τα πάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ τα πάθη τα βλέπω σαν δυνάμεις της ψυχής. Ο Θεός δεν δίνει ελαττώματα αλλά δυνάμεις[2]. Όταν όμως δεν αξιοποιούμε αυτές τις δυνάμεις για το καλό, έρχεται το ταγκαλάκι, τις εκμεταλλεύεται και γίνονται πάθη, και ύστερα γκρινιάζουμε και τα βάζουμε με τον Θεό. Ενώ, αν τις αξιοποιήσουμε στρέφοντάς τες εναντίον του κακού, μας βοηθούν στον πνευματικό αγώνα. Ο θυμός λ.χ. δείχνει ότι η ψυχή έχει ανδρισμό, ο οποίος βοηθάει στην πνευματική ζωή. Κάποιος που δεν είναι θυμώδης και δεν έχει ανδρισμό δεν μπορεί να βάλη εύκολα τον εαυτό του στην θέση του. Ο θυμώδης άνθρωπος, αν αξιοποιήση στην πνευματική ζωή την δύναμη που έχει, είναι σαν ένα γερό αυτοκίνητο που πιάνει την ευθεία και κανείς δεν το φθάνει. Αν όμως δεν την αξιοποιήση και αφήνη ανεξέλεγκτο τον εαυτό του, μοιάζει με αυτοκίνητο που τρέχει με υπερβολική ταχύτητα σε ανώμαλο δρόμο και κάθε τόσο εκτροχιάζεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος πρέπει να γνωρίση τις δυνάμεις που έχει και να τις στρέψη στο καλό. Έτσι θα φθάση, με την βοήθεια του Θεού, σε καλή πνευματική κατάσταση. Τον εγωισμό λ.χ. να τον στρέψη εναντίον του διαβόλου και να μην το βάζη κάτω, όταν πάη και τον πειράζη. Την τάση για φλυαρία να την αγιάση καλλιεργώντας την ευχή. Δεν είναι καλύτερα να μιλάη με τον Χριστό και να αγιάζεται παρά να φλυαρή και να αμαρτάνη; Ανάλογα δηλαδή με το πώς θα χρησιμοποιήση ο άνθρωπος τις δυνάμεις της ψυχής, μπορεί να γίνη καλός ή κακός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να μη δικαιολογούμε τα πάθη μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μερικοί νομίζουν ότι δεν έχουν προϋποθέσεις για να κάνουν πνευματική ζωή και λένε: «Ουκ αν λάβης παρά του μη έχοντος»[3].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν λένε κιόλας ότι τους βαραίνουν πάθη κληρονομικά και δικαιολογούν τον εαυτό τους, αυτό είναι ακόμη χειρότερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, κάποιον όντως τον βαραίνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε να σού πώ: Ο κάθε άνθρωπος έχει κληρονομικές καταβολές καλές και κακές. Πρέπει να αγωνισθή να απαλλαγή από τα ελαττώματά του και να καλλιεργήση τα καλά που έχει, για να γίνη μια αληθινή, χαριτωμένη εικόνα του Θεού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι κακές κληρονομικές καταβολές δεν είναι εμπόδιο για την πνευματική πρόοδο. Γιατί, όταν αγωνίζεται κανείς, έστω και λίγο αλλά με πολύ φιλότιμο, τότε κινείται στον πνευματικό χώρο, στο θαύμα, και όλα τα άσχημα κληρονομικά τα διαλύει η Χάρις του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός πολύ συγκινείται και πολύ βοηθάει μία ψυχή που έχει κακές κληρονομικές καταβολές και αγωνίζεται φιλότιμα στο ουράνιο πέταγμα με την ατροφική της φτερούγα – την κακή κληρονομικότητα. Γνωρίζω πολλούς που με την μικρή προσπάθεια που κατέβαλαν και με την μεγάλη βοήθεια του Θεού ελευθερώθηκαν από αυτά. Αυτοί οι άνθρωποι είναι για τον Θεό μεγάλοι ήρωες. Γιατί αυτό που θα συγκινήση τον Θεό είναι η εργασία που θα κάνουμε στον παλαιό μας άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, το Βάπτισμα δεν εξαλείφει τις κακές  κληρονομικές καταβολές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το Βάπτισμα μας απαλλάσσει από την κατάρα του προπατορικού αμαρτήματος και από όλες τις αμαρτίες. Όταν βαπτίζεται ο άνθρωπος, ντύνεται τον Χριστό, απελευθερώνεται από το προπατορικό αμάρτημα και έρχεται η θεία Χάρις· οι κακές όμως κληρονομικές καταβολές μένουν. Μήπως ο Θεός δεν θα μπορούσε να τις εξαλείψη και αυτές με το Άγιο Βάπτισμα; Τις αφήνει όμως, για να αγωνισθούμε, να νικήσουμε και να στεφανωθούμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, εγώ, όταν πέφτω συνέχεια σε κάποιο πάθος, λέω: «Έτσι γεννήθηκα, τέτοια είμαι».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ακόμη αυτό έλειψε, να μας πής ότι οι γονείς σου σού έδωσαν όλα τα ελαττώματα που έχεις. Από πάππον προς πάππον όλα τα ελαττώματα σ᾿ εσένα δόθηκαν και όλα τα χαρίσματα στους άλλους;... Μήπως τα βάζεις και με τον Θεό; Όποιος λέει: «εγώ αυτόν τον χαρακτήρα έχω, έτσι γεννήθηκα, έχω άσχημες κληρονομικές καταβολές, μ᾿ αυτές τις συνθήκες μεγάλωσα, άρα δεν μπορώ να διορθωθώ...», είναι σαν να λέη: «Φταίει όχι μόνον ο πατέρας μου και η μάνα μου, αλλά και ο Θεός»! Όταν ακούω κάτι τέτοια, ξέρετε πώς στενοχωριέμαι; Έτσι βρίζει κανείς και τους γονείς του και τον Θεό. Από την στιγμή που σκέφτεται έτσι, παύει να ενεργή η Χάρις του Θεού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί λένε ότι, όταν ένα ελάττωμα είναι στην δομή του ανθρώπου, δεν διορθώνεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ξέρεις τί γίνεται; μερικούς τους συμφέρει να λένε ότι κάποιο ελάττωμα οφείλεται στην δομή τους, γιατί έτσι δικαιολογούν τον εαυτό τους και δεν κάνουν καμμιά προσπάθεια να απαλλαγούν από αυτό. «Εμένα, λένε, δεν μου έδωσε χαρίσματα ο Θεός! Τί φταίω εγώ; Γιατί μου ζητούν πράγματα πάνω από τις δυνάμεις μου;»! Οπότε αραλίκι μετά. Δικαιολογούν τον εαυτό τους, αναπαύουν τον λογισμό τους και βαδίζουν με τον χαβά τους. Αν πούμε: «αυτά είναι κληρονομικά, τα άλλα είναι του χαρακτήρα μου», πώς θα διορθωθούμε; Αυτή η αντιμετώπιση διώχνει την πνευματική λεβεντιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, Γέροντα, αλλά...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πάλι «αλλά»; Τί είσαι εσύ, βρέ παιδάκι μου; Σαν χέλι ξεγλιστράς. Συνέχεια δικαιολογείσαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εσκεμμένα το κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν λέω ότι το κάνεις εσκεμμένα, αλλά, ενώ ο Θεός σε προίκισε με τόσο μυαλό και είσαι σπίρτο, πανέξυπνη, δεν καταλαβαίνεις πόσο κακό είναι η δικαιολογία! Ένα τόσο δά κεφαλάκι να έχη τόσο μυαλό, και να μην το καταλαβαίνη!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παρατήρησα ότι μερικοί, ενώ είναι έξυπνοι και καταλαβαίνουν ποιό είναι το σωστό, υποστηρίζουν το λανθασμένο, επειδή αυτό τους βολεύει, και έτσι δικαιολογούν τα πάθη τους. Άλλοι πάλι δεν δικαιολογούν τον εαυτό τους, αλλά με τον λογισμό ότι υπάρχει κάτι αδιόρθωτο στον χαρακτήρα τους πέφτουν στην απελπισία. Ο διάβολος έτσι κάνει: τον έναν τον εμποδίζει από την πνευματική πρόοδο με την δικαιολογία του εαυτού του, τον άλλον τον πιάνει με την υπερευαισθησία και τον ρίχνει στην απόγνωση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Για να κοπή ένα πάθος, πρέπει να μη δικαιολογή ο άνθρωπος τον εαυτό του, αλλά να ταπεινώνεται. Αν λ.χ. λέη: «εγώ δεν έχω αγάπη στην φύση μου, ενώ ο άλλος έχει» και δεν αγωνίζεται να αποκτήση, πώς θα προκόψη; Χωρίς αγώνα δεν γίνεται προκοπή. Δεν έχετε διαβάσει στα Πατερικά βιβλία πόσα ελαττώματα είχαν μερικοί Πατέρες και σε τί πνευματικά μέτρα έφθασαν; Ξεπέρασαν άλλους που είχαν πολλές αρετές. Νά, ο Αββάς Μωυσής ο Αιθίοπας[4], ένας τόσο μεγάλος εγκληματίας, σε τί κατάσταση έφθασε! Τί κάνει η Χάρις του Θεού!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κατά τον λογισμό μου αυτός που έχει κακές κληρονομικές καταβολές και αγωνίζεται να αποκτήση αρετές, θα έχη πιο πολύ μισθό από εκείνον που κληρονόμησε από τους γονείς του αρετές και δεν χρειάζεται να αγωνισθή, για να τις αποκτήση. Γιατί ο ένας τα βρήκε όλα έτοιμα, ενώ ο άλλος αγωνίσθηκε σκληρά, για να τα αποκτήση. Βλέπεις, και οι άνθρωποι εκτιμούν περισσότερο εκείνα τα παιδιά που βρήκαν χρέη από τους γονείς τους και αγωνίσθηκαν σκληρά όχι μόνον να τα εξοφλήσουν, αλλά και να δημιουργήσουν περιουσία, παρά όσα βρήκαν περιουσία από τους γονείς τους και την διατήρησαν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αποκάλυψη των παθών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ταλαιπωρούμαι από τα πάθη μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καταλαβαίνεις ότι υπάρχουν μέσα σου πάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές το καταλαβαίνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό είναι καλό· όταν ο άνθρωπος αναγνωρίζη ότι έχει πάθη, ταπεινώνεται, οπότε έρχεται η Χάρις του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στενοχωριέμαι όμως που συνέχεια σφάλλω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να χαίρεσαι που συνέχεια σφάλλεις, γιατί έχεις υπερηφάνεια και έτσι ταπεινώνεσαι. «Θεέ μου, αυτή είμαι, να λές. Βοήθησέ με. Αν δεν με βοηθήσης Εσύ, τίποτε δεν μπορώ να κάνω». Μήν απελπίζεσαι. Όταν σφάλλουμε, ξεσκεπάζεται ο πραγματικός εαυτός μας, τον γνωρίζουμε και προσπαθούμε να διορθωθούμε. Με αυτόν τον τρόπο προχωρούμε θετικά και δεν ζούμε με ψευδαισθήσεις ότι πάμε καλά. Εγώ χαίρομαι, όταν εκδηλώνεται μια αδυναμία μου, όταν ξεφυτρώνουν τα πάθη μου. Εάν δεν ξεφύτρωναν, θα νόμιζα ότι αγίασα, ενώ οι σπόροι των παθών θα ήταν κρυμμένοι στην καρδιά μου. Έτσι κι εσύ, όταν θυμώσης ή πέσης στην κατάκριση, θα στενοχωρηθής φυσικά, γιατί έπεσες, αλλά πρέπει να χαρής κιόλας, γιατί εκδηλώθηκε η αδυναμία σου, οπότε θα αγωνισθής να απαλλαγής από αυτήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιο πάθος μου δεν εκδηλώνεται για ένα διάστημα, σημαίνει ότι δεν υπάρχει πια μέσα μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν υπάρχη μέσα σου ένα πάθος, κάποια στιγμή θα εκδηλωθή. Γι᾿ αυτό, όταν ξέρης ότι μέσα σου κρύβεται κάποιο πάθος, πρέπει να προσέχης. Αν ξέρης λ.χ. ότι κάπου έξω από το κελλί σου κρύβεται ένα φίδι, όταν βγαίνης έξω, θα ρίχνης καμμιά ματιά προς τα εκεί και θα προσέχης μήπως βγή και σε τσιμπήση. Επικίνδυνο δεν είναι, όταν ξέρης ότι βρίσκεται εκεί το φίδι και έχης τον νού σου πότε θα βγή, για να το σκοτώσης· επικίνδυνο είναι, όταν δεν ξέρης ότι είναι εκεί καί, ενώ περπατάς αμέριμνη, μπορεί να έρθη να σε τσιμπήση. Θέλω να πώ, επικίνδυνο είναι, όταν ο άνθρωπος δεν παρακολουθή τον εαυτό του και δεν γνωρίζη τα πάθη του. Όταν γνωρίζη τα πάθη του και κάνη τον σχετικό αγώνα, τότε και ο Χριστός τον βοηθάει για το ξερρίζωμά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μήπως πρέπει να αγωνίζωμαι χωρίς να ανησυχώ αν διορθώθηκα; Μήπως το να διορθωθώ ανήκει στον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, να αγωνίζεσαι και να τα αφήνης όλα στον Θεό, αλλά να εξετάζης και τον εαυτό σου, για να δής που βρίσκεσαι, τί κάνεις. Βλέπεις, ο γιατρός πρώτα ψάχνει να βρη την αιτία από την οποία προέρχεται ο πυρετός και μετά τί φάρμακο να δώση στον άρρωστο, για να ρίξη τον πυρετό. Από την στιγμή δηλαδή που ο άνθρωπος αρχίζει να βλέπη τα ελαττώματά του, πρέπει να μπή μέσα του η καλή ανησυχία, για να αγωνισθή να τα διορθώση. Εγώ εξετάζω τον εαυτό μου και βλέπω ότι έχω αυτά και αυτά τα ελαττώματα. Κάνω τον αγώνα μου, και εξετάζω πάλι τον εαυτό μου: «Μέχρι χθές είχα αυτά και αυτά τα ελαττώματα. Έκοψα κανένα; Σ᾿ εκείνο που βρίσκομαι;». Και μετά λέω στον Θεό: «Θεέ μου, κάνω ό,τι μπορώ, αλλά βοήθησέ με Εσύ να διορθωθώ, γιατί μόνος μου δεν μπορώ».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί ένας άνθρωπος να μην έχη την δύναμη να δη τα πάθη του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν ο άνθρωπος είναι ευαίσθητος, ο Θεός δεν επιτρέπει να γνωρίση απότομα τα πάθη του. Γιατί τον ευαίσθητο τον πειράζει και ο διάβολος και τον ρίχνει στην απελπισία: «Γιατί να έχης αυτό το πάθος; του λέει, και γιατί έκανες εκείνο; και πώς το άλλο; Άρα δεν θα σωθής». Κι έτσι μπορεί να καταλήξη στο ψυχιατρείο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Υποστηρικτής των παθών είναι η υπερηφάνεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μια ψυχή αγωνίζεται χρόνια και δεν βλέπη πρόοδο, τί συμβαίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν δεν βλέπουμε πρόοδο στον αγώνα μας, σημαίνει ή ότι δεν έχουμε εγρήγορση ή ότι ο Θεός δεν επιτρέπει να προχωρήσουμε περισσότερο, για να μην υπερηφανευθούμε και βλαφθούμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όπως βλέπω τον εαυτό μου, κάθε μέρα γίνομαι χειρότερη, τί θα γίνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, ευλογημένη, υπάρχουν τρία στάδια. Στο πρώτο στάδιο, ο Θεός δίνει καραμέλες και σοκολάτες, γιατί βλέπει την ανάγκη και την αδυναμία της ψυχής. Στο δεύτερο, παίρνει λίγο την Χάρη Του για παιδαγωγία, για να καταλάβη ο άνθρωπος ότι χωρίς την βοήθειά Του δεν μπορεί να κάνη το παραμικρό, ώστε να ταπεινωθή και να αισθανθή την ανάγκη να καταφύγη σ᾿ Αυτόν. Και το τρίτο στάδιο είναι μια μόνιμη και σταθερή καλή πνευματική κατάσταση. Εσύ βρίσκεσαι ανάμεσα στο δεύτερο και τρίτο στάδιο. Προχωράς λίγο, μετά ξεχνάς την αδυναμία σου, παίρνει ο Χριστός την Χάρη Του, απογυμνώνεσαι από την θεία Χάρη, βλέπεις ξανά την αδυναμία σου και συνέρχεσαι. Αν μου έλεγες ότι, όσο προχωράς, είσαι καλύτερα, θα φοβόμουν, γιατί θα έβλεπα ότι έχεις υπερηφάνεια. Τώρα όμως που λές ότι όλο και πιο χάλια βλέπεις τον εαυτό σου, εγώ χαίρομαι, γιατί βλέπω ότι είσαι καλά. Μη φοβάσαι. Όσο  προχωράει κανείς, τόσο περισσότερο βλέπει τις ελλείψεις του και τις ατέλειές του και αυτό είναι πρόοδος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχει, περίπτωση να μη με ακούη ο Θεός, όταν Του ζητάω να με βοηθήση να απαλλαγώ από ένα πάθος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί, Βάαλ[5]είναι ο δικός μας ο Θεός; Ο Θεός ακούει και μας βοηθάει. Ίσως να μη νιώθης την βοήθειά Του· αιτία όμως δεν είναι ο Θεός, αλλά εσύ η ίδια που διώχνεις την βοήθειά Του με την υπερηφάνεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν δεν υπάρχη κίνδυνος να το πάρουμε επάνω μας και να υπερηφανευθούμε, είναι αδύνατο να μη βοηθήση ο Θεός. Ο Καλός Θεός θέλει να απαλλαγούμε από τα πάθη μας, αλλά, αν έχουμε υπερηφάνεια ή προδιάθεση υπερηφανείας, δεν μας βοηθάει να απαλλαγούμε, γιατί θα νομίζουμε ότι το κατορθώσαμε χωρίς την δική Του βοήθεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό, όταν παρακαλούμε τον Θεό με όλη την καρδιά μας να μας βοηθήση να απαλλαγούμε από ένα πάθος και δεν μας βοηθάη, πρέπει αμέσως να καταλάβουμε ότι πίσω από αυτό το πάθος κρύβεται άλλο μεγαλύτερο, και αυτό είναι η υπερηφάνεια. Επειδή δηλαδή δεν βλέπουμε την υπερηφάνεια, αφήνει ο Θεός να παραμένη το πάθος που βλέπουμε, π.χ. η γαστριμαργία, η φλυαρία, ο θυμός κ.λπ., για να ταπεινωνώμαστε. Όταν σιχαθούμε πια τα πάθη μας από τις συνεχείς πτώσεις μας, γνωρίσουμε την αδυναμία μας και ταπεινωθούμε, τότε μας βοηθάει ο Θεός και ανεβαίνουμε δύο-δύο τα πνευματικά σκαλιά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα πάθη ξερριζώνονται εύκολα, όσο είναι «τρυφερά»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βλέπω ότι έχω πολλά πάθη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, έχεις πολλά πάθη, αλλά και νειάτα έχεις και παλληκαριά έχεις, για να δουλέψης και να βγάλης από το περιβόλι σου τα αγκάθια και να βάλης κρίνα, ζουμπούλια, τριαντάφυλλα και να αγάλλεσαι μετά μέσα στο περιβόλι σου. Τώρα που είσαι νέα, τα πάθη είναι «τρυφερά» και εύκολα ξερριζώνονται. Βλέπεις, και τα αγριόχορτα – και αγκάθια να είναι –, όταν είναι ακόμη τρυφερά, εύκολα ξερριζώνονται· ενώ, όταν μεγαλώσουν, σκληραίνουν και δύσκολα μπορείς να τα πιάσης, για να τα ξερριζώσης. Και η τσουκνίδα, όταν βγάζη τα πρώτα φύλλα, δεν διαφέρει στην απαλάδα από τον βασιλικό· μπορείς να την πιάσης και να την μυρίσης, γιατί είναι τρυφερή. Γι᾿ αυτό να προσπαθήσης να ξερριζώσης τα πάθη σου, όσο είσαι νέα, γιατί, αν τα αφήσης, θα αιχμαλωτισθή η ψυχή σου σε διάφορες επιθυμίες και θα είναι δύσκολο να ελευθερωθής από αυτές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι από νέοι δεν ξερριζώνουν τα πάθη τους, υποφέρουν πολύ στα γεράματα, διότι γερνάνε με τα πάθη, τα οποία γίνονται «παλιά κακά» δυσκολοθεράπευτα. Όσο μεγαλώνει ο άνθρωπος, αρχίζει να αγαπά τα πάθη του. Έρχεται η ηλικία της αγάπης, της στοργής και γίνεται πιο επιεικής στον εαυτό του. Εξασθενεί και η θέληση, και ο αγώνας κατά των παθών γίνεται πιο δύσκολος. Ο νέος έχει ζωντάνια· εάν αξιοποιήση αυτήν την ζωντάνια στο ξερρίζωμα των παθών, προκόβει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πώς θα απαλλαγούμε από τα πάθη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πέφτω συνέχεια στην γαστριμαργία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί εκεί έχεις αδυναμία. Ο διάβολος πολεμάει το φυλάκιο που είναι αδύνατο· τα άλλα που είναι οχυρωμένα καλά δεν τα χτυπάει. «Αν καταλάβω αυτό το φυλάκιο, λέει, εύκολα θα καταλάβω ένα-ένα και όλα τα άλλα φυλάκια». Γι᾿ αυτό, το αδύνατο φυλάκιο πρέπει να οχυρώσης καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πελαγώνω, όταν βλέπω τα πάθη μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να μην πελαγώνης ούτε να δειλιάζης. Με θάρρος να παίρνης ένα–ένα τα πάθη σου, αρχίζοντας τον αγώνα σου από το πιο μεγάλο. Στην αρχή βοηθάει να μην τα λεπτολογής, αλλά να χτυπάς και να ξερριζώνης τα πιο χοντρά που βλέπεις. Και καθώς θα αχρηστεύωνται οι ρίζες των μεγάλων παθών, θα ξεραίνωνται και οι λεπτές ρίζες από τα μικρότερα πάθη. Επομένως, όταν ξερριζώσης ένα μεγάλο πάθος, μαζί με αυτό θα ξερριζωθούν και άλλα μικρότερα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, ενώ παίρνω πολλές αποφάσεις να αγωνισθώ με ζήλο κατά των παθών μου, τελικά δεν τις πραγματοποιώ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί παίρνεις πολλές αποφάσεις μαζί. Τα πάθη, όπως και οι αρετές, αποτελούν μια αλυσίδα. Το ένα πάθος είναι συνδεδεμένο με το άλλο και η μία αρετή είναι συνδεδεμένη με την άλλη, όπως τα βαγόνια του τραίνου είναι ενωμένα το ένα με το άλλο και όλα ακολουθούν το πρώτο. Αν λοιπόν αποφασίσης να αγωνισθής για αρκετό διάστημα, για να κόψης ένα συγκεκριμένο πάθος και να καλλιεργήσης την αντίστοιχη αρετή, θα το πετύχης. Και μαζί μ᾿ αυτό το πάθος που θα κόψης, θα απαλλαγής και από άλλα πάθη και θα αναπτυχθούν οι αντίστοιχες αρετές. Ας πούμε ότι ζηλεύεις· αν αγωνισθής να μη ζηλεύης, θα καλλιεργήσης την αγάπη, την καλωσύνη, και συγχρόνως θα απαλλαγής από τον θυμό, από την κατάκριση, από την κακία, από την λύπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένα πάθος ή μία κακή συνήθεια είναι καλύτερα να τα κόψης μια και έξω ή σιγά-σιγά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν μπορής να τα κόψης μια και έξω, είναι καλύτερα, γιατί διαφορετικά αφήνουν... δέκατα. Δεν χρειάζεται καθυστέρηση. Όταν περνάη κανείς ένα ποτάμι, ιδίως χειμώνα καιρό, προσπαθεί να το περάση όσο πιο γρήγορα μπορεί, γιατί θα παγώση. Αν το περάση γρήγορα, μέχρι να κρυώση, θα ζεσταθή πάλι. Βλέπεις, και τα άλογα, όταν τα δένουν, αν θέλουν να ελευθερωθούν, κόβουν το σχοινί απότομα. Με τον πειρασμό θέλει απότομα κόψιμο το σχοινί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ισαάκ λέει: «Απάθεια είναι, όχι το να μην αισθάνεται κανείς τα πάθη, αλλά το να μη δέχεται αυτά»[6]. Μπορεί και ο απαθής να έχη προσβολή από πάθη;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί· αλλά, ό,τι και να του πετάξη ο διάβολος, καίγεται από την θεία φλόγα που έχει ανάψει μέσα του. Ο διάβολος δεν παύει να προσβάλλη τον άνθρωπο, αλλά, όταν ο άνθρωπος δεν δέχεται τις προσβολές του εχθρού, τότε καθαρίζει η καρδιά του και κατοικεί πια μέσα του ο Χριστός. Η καρδιά του μετατρέπεται σε καμίνι, σε «βάτο καιομένη»[7], καί, ό,τι και αν πέση μετά μέσα, καίγεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αξίζει να πεθάνουμε ηρωικά, παρά να νικηθούμε από τα πάθη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μόνον η ευγνωμοσύνη στον Θεό φθάνει για να μας παρακινήση στον αγώνα κατά των παθών;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μόνον η ευγνωμοσύνη στον Θεό δεν φθάνει· χρειάζεται και καλή διάθεση, αναγνώριση της αμαρτωλότητός μας και φιλότιμη άσκηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η μνήμη του θανάτου βοηθάει στην εσωτερική εργασία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, πολύ βοηθάει. Αν έχουμε μνήμη θανάτου με ελπίδα στον Θεό, θα γνωρίσουμε την ματαιότητα αυτού του κόσμου και θα βοηθηθούμε πνευματικά. Γι᾿ αυτό να φέρνουμε στον νού μας το κριτήριο του Θεού και να μην ξεχνούμε ότι θα κριθούμε για τις αμαρτίες που κάναμε και δεν μετανοήσαμε. «Τί κάνω; Πώς ζώ με τόση αμέλεια; να σκεφθώ. Αν πεθάνω αυτήν την στιγμή, που θα πάω; Μήπως έκανα κανένα συμβόλαιο με τον θάνατο; Πεθαίνουν και μικροί και μεγάλοι». Αν σκέφτωμαι ότι ο Θεός μπορεί σε λίγο να με πάρη, τότε δεν θα αμαρτάνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να πεθάνουν τα πάθη, πρέπει να σκεφτώμαστε τον θάνατο, την μέλλουσα Κρίση, και να πάθουμε κι εμείς από φιλότιμο για τον Χριστό που πολλά έπαθε, για να μας λυτρώση. Ο αγώνας κατά των παθών είναι ένα διηνεκές γλυκό μαρτύριο για την τήρηση των εντολών, για την αγάπη του Χριστού. Αξίζει να πεθάνουμε ηρωικά, παρά να νικηθούμε από τα πάθη και να πληγώσουμε τον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στρυμώχνομαι, Γέροντα, στον αγώνα μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ένα αγκαθάκι βγάζεις από το δάκτυλό σου και πονάς, πόσο μάλλον να ξερριζώσης από μέσα σου ένα πάθος! Ύστερα να ξέρης ότι, όταν ο άνθρωπος καταβάλλη προσπάθεια να κόψη ένα πάθος του, τότε ο πειρασμός βάζει εμπόδια και στρυμώχνεται ο άνθρωπος, όπως στρυμώχνεται και ο δαιμονισμένος, όταν του διαβάζουν εξορκισμούς, γιατί γίνεται αγώνας, παλεύει με τον διάβολο· έπειτα όμως ελευθερώνεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το καθάρισμα του εαυτού μας δεν γίνεται χωρίς κόπο, πατώντας κουμπιά. Δεν κόβονται αμέσως τα πάθη, όπως και ο κορμός του δένδρου δεν κόβεται αμέσως με μια πριονιά. Το πριόνι κόβει για πολλή ώρα, μέχρι να κοπή πέρα-πέρα ο κορμός. Και δεν τελειώνει εδώ η δουλειά. Για να γίνη ο κορμός έπιπλο, πόσος κόπος χρειάζεται! Πρέπει πρώτα να πελεκηθή, να γίνη σανίδες και μετά να τις πάρη ο επιπλοποιός, για να τις κάνη χρήσιμο έπιπλο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κι άν, Γέροντα, δεν καταλαβαίνω ότι αυτός ο κόπος είναι απαραίτητος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε θα μείνης κούτσουρο και θα σε ρίξουν στην φωτιά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρέπει να σπείρουμε, για να δώση ο Θεός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, κάθε μέρα λέω: «Από αύριο θα προσέχω, θα διορθωθώ», αλλά και πάλι πέφτω στα ίδια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να βάζης τον Θεό μπροστά· να λές: «μέ την δύναμη του Θεού, θα προσπαθήσω να διορθωθώ», ώστε να βοηθήση ο Θεός. Το ότι θέλεις να διορθωθής, αυτό σημαίνει ότι δέχεσαι βοήθεια. Ζητάς και από τον Θεό να σε βοηθήση και ρίχνει ο Θεός το βλέμμα Του επάνω σου. Κάνεις και την μικρή σου προσπάθεια και προχωρείς. Ποιός, όταν δη ένα μικρό παιδάκι να προσπαθή με τα χεράκια του να κυλήση μια κοτρώνα, δεν θα τρέξη να το βοηθήση, για να μην παιδεύεται; Έτσι και ο Θεός, όταν δη την μικρή σου προσπάθεια, θα σε βοηθήση να νικήσης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί, ενώ δεν καταβάλλουν καμμιά προσπάθεια να διορθωθούν, λένε: «Χριστέ μου, έχω αυτά τα πάθη. Εσύ, μπορείς να με απαλλάξης· απάλλαξέ με». Έ, πώς να βοηθήση τότε ο Θεός; Για να βοηθήση ο Θεός, πρέπει να καταβάλη ο άνθρωπος την προσπάθεια που μπορεί. Δηλαδή είναι μερικά πράγματα που πρέπει να κάνη ο ίδιος ο άνθρωπος, για να βοηθήση μετά ο Θεός. Σε καμμιά περίπτωση δεν βοηθιέται, αν δεν θέλη να βοηθήση ο ίδιος τον εαυτό του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εμείς μερικές φορές πάμε να αποκτήσουμε την Χάρη και τα χαρίσματα του Θεού με έναν μαγικό τρόπο. Νομίζουμε πώς χωρίς αγώνα θα αποκτήσουμε μια αρετή ή ακόμη και θα αγιάσουμε. Για να δώση όμως ο Θεός, πρέπει να σπείρουμε. Πώς θα δώση ο Θεός χωρίς να εργασθούμε; Τί λέει το τροπάριο; «Της ερήμου το άγονον εγεώργησας»[8]. Ο Θεός ρίχνει-ρίχνει βροχή, μαλακώνει το χώμα, αλλά και εμείς πρέπει να «γεωργήσουμε» το χωράφι μας. Το χώμα είναι έτοιμο, αλλά πρέπει να βάλουμε το υνί στο χωράφι και να το σπείρουμε· και ό,τι σπείρουμε, θα θερίσουμε. Αν όμως δεν οργώσουμε, πώς θα σπείρουμε; Κι αν δεν σπείρουμε, τί θα θερίσουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό να μη ρωτάτε μόνον τί μπορεί να κάνη ο Θεός, αλλά να ρωτάτε και τον εαυτό σας τί μπορείτε να κάνετε κι εσείς. Η τράπεζα του Χριστού δίνει πολύ μεγάλο τόκο. Αλλά, αν δεν κάναμε κατάθεση στην τράπεζα, πώς θα κάνουμε ανάληψη;
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρώτο Μέρος – Φιλαυτία Η Μητέρα Των Παθών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Όποιος έχει φιλαυτία,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: δέν μπορεί να έχη ανάπαυση, ειρήνη ψυχής,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιατί δεν είναι εσωτερικά ελεύθερος».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η φιλαυτία και οι συνέπειές της
- type: h2
  initial:
    ru: ''
  text:
    ru: Από την φιλαυτία γεννιούνται όλα τα πάθη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι φιλαυτία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το να κάνης τα χατίρια του παλαιού σου ανθρώπου, να αγαπάς δηλαδή τον παλαιό σου άνθρωπο. Και η γαστριμαργία και ο εγωισμός και το πείσμα και η ζήλεια πρακτορείο τους έχουν την φιλαυτία. Και βλέπεις, άλλος από φιλαυτία ζητάει το βόλεμά του, την ανάπαυσή του, και δεν λογαριάζει κανέναν. Άλλος φροντίζει σχολαστικά για το φαγητό του, για τον ύπνο του, μην τυχόν και πάθη τίποτε η υγεία του. Άλλος ζητά να τον υπολογίζουν, να τον εκτιμούν· λίγο να μην του δώσουν σημασία, να μην κάνουν το θέλημά του, αντιδράει. Σού λέει: «Γιατί δεν με υπολόγισαν; Θα τους δείξω εγώ». Πά-πά, φοβερό πράγμα η φιλαυτία!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, πώς μπορεί να λέη κανείς: «Ένεκά σου θανατούμεθα όλην την ημέραν»[9];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν θυσιάζη το θέλημά του για χάρη του άλλου. Το θέλημα έχει τον εαυτό μας μέσα, έχει φιλαυτία. Όποιος δεν εξετάζει αν αυτό που αναπαύει τον εαυτό του αναπαύη και τον άλλον και αρχίζει με μια απαίτηση: «θέλω εκείνο, θέλω το άλλο» ή «γιατί δεν μου το έκανες εκείνο, γιατί δεν μου έδωσες το άλλο;», αυτός τελικά θα κανοναρχήται από τον διάβολο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικοί, Γέροντα, όταν δεν γίνεται αυτό που θέλουν, δεν μπορούν να ησυχάσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να ησυχάσουν, αφού έχουν τον εαυτό τους μέσα σ᾿ αυτό που θέλουν; Αν κανείς έχη τον εαυτό του σε ό,τι θέλει, μπορεί να έχη και τον Χριστό; Όταν όμως δεν έχη τον εαυτό του και έχη το ένα, το κυριώτερο, δηλαδή τον Χριστό, τότε τα έχει όλα. Όταν δεν έχη τον Χριστό, τίποτε δεν έχει. Αν ο άνθρωπος πετάξη τον εαυτό του, ο Θεός του τα δίνει όλα κατά τρόπο θαυμαστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ, όταν μας μιλάτε για το πέταμα του εαυτού μας, αισθάνομαι έναν φόβο, μήπως δεν αντέξω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έ, τί πάθαμε! Είναι σαν να λές: «Αν πετάξω τα πάθη, τί θα έχω μετά;». Γιατί, όταν λέω να πετάξουμε τον εαυτό μας, εννοώ να πετάξουμε τα πάθη μας, να απεκδυθούμε τον παλαιό μας άνθρωπο. Για τον μεγάλο που έχει επίγνωση είναι λιγάκι βαρύ να πή: «Δεν μπορώ να πετάξω τον εαυτό μου». Αν σού πούν: «πάρε το βαριό και γκρέμισε αυτόν τον τοίχο» κι εσύ είσαι μαθημένη με την πέννα, δικαιολογείται να πής «δέν μπορώ». Αλλά για την απέκδυση του παλαιού ανθρώπου δεν χρειάζονται δυνάμεις σωματικές· ταπείνωση χρειάζεται.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Από το άνοστο να γεύεσθε Χριστό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φιλαυτία είναι και η επιθυμία να φάη ή να ξεκουρασθή κανείς παραπάνω από όσο του είναι απαραίτητο. Κανονικά πρέπει να δίνουμε στο σώμα μόνον αυτό που έχει ανάγκη. Άλλο επιθυμία και άλλο ανάγκη. Άλλο είναι να θέλω να ευχαριστήσω το σώμα και άλλο να δώσω στο σώμα αυτό που έχει ανάγκη. Ας υποθέσουμε ότι έχω μπροστά μου δύο φαγητά ίδια σε βιταμίνες, αλλά το ένα είναι πιο νόστιμο από το άλλο. Αν προτιμήσω το νοστιμότερο, αυτό έχει φιλαυτία. Αν όμως έχω ανορεξία, επειδή είμαι φιλάσθενος, και προτιμήσω το νοστιμότερο, για να μπορέσω να το φάω, αυτό έχει διάκριση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μπορεί το σώμα, ο «κακός τελώνης»[10], όπως το λέει ο Αββάς Μακάριος, να ζητάη παραπάνω, γιατί και ο οργανισμός είναι όπως τον συνηθίση κανείς. Όταν ο άνθρωπος έχη το στομάχι περιορισμένο, τότε εύκολα μπορεί να κάνη μια εγκράτεια· διαφορετικά γίνεται δούλος στο στομάχι του, γιατί και το στομάχι μετά έχει ανάγκη να γεμίζη. Νά, πάρε έναν που είναι πολύ χονδρός· αυτός, τόση αποθήκη που έχει κάνει, θέλει να βάλη τουλάχιστον μισό μοσχάρι μέσα, για να χορτάση, και να πιή μετά και δυο μπετόνια νερό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Παλιά, Γέροντα, οι άνθρωποι είχαν πιο δυνατό οργανισμό ή βίαζαν τον εαυτό τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Είχαν φυσικά και λίγο πιο δυνατό οργανισμό, αλλά βίαζαν και τον εαυτό τους. Ο Χατζη-Γεώργης στα καλογέρια του έδινε κάθε μέρα λίγο μέλι και καρύδια[11]. Και ήταν παιδιά δεκαπέντε χρονών, πάνω στην ανάπτυξη, αλλά είχαν την πνευματική ανάπτυξη! Σήμερα μπαίνει μια κοσμική λογική: «νά μη νηστέψουν τα παιδιά, για να μην αρρωστήσουν, να μη λείψη τίποτε από τα παιδιά, για να μη δυσκολευθούν», και τελικά ζουν κακομοιριασμένα και θέλουν μπριζόλες συνέχεια, αλλά και αυτό πάλι δεν τα βοηθάει σε τίποτε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν χαίρεται κανείς, όταν δεν τρώη για την αγάπη του Χριστού, τότε τρέφεται. Αν προτιμάη το άνοστο από το νόστιμο για την αγάπη του Χριστού, τότε από το άνοστο γεύεται Χριστό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγάπη του εαυτού μας νικά την αγάπη προς τον πλησίον μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σήμερα ένα γεροντάκι δυσκολευόταν να ανεβή τις σκάλες της εκκλησίας καί, ενώ περνούσαν πολλοί από ᾿κεί, κανένας δεν πήγαινε να το βοηθήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –«Και ιερεύς ιδών αυτόν αντιπαρήλθε... και λευΐτης ιδών αυτόν αντιπαρήλθεν»[12]. Έχουν δίκαιο... Δεν ξέρουν..., δεν άκουσαν ποτέ το Ευαγγέλιο του καλού Σαμαρείτη!... Τί να πώ; Αγαπάμε τον εαυτό μας, δεν αγαπάμε τους άλλους. Η αγάπη του εαυτού μας νικά την αγάπη προς τον πλησίον μας, γι᾿ αυτό κινούμαστε έτσι. Όποιος όμως αγαπά τον εαυτό του περισσότερο από τους άλλους, δεν ζη σύμφωνα με το πνεύμα του Ευαγγελίου. Και ο Χριστός, αν σκεφτόταν τον Εαυτό Του, θα καθόταν στον Ουρανό· δεν θα ερχόταν στην γη να ταλαιπωρηθή, να σταυρωθή, για να μας σώση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα, λίγο-πολύ, στους περισσότερους ανθρώπους υπάρχει φιλαυτία· δεν υπάρχει το πνεύμα της θυσίας. Έχει μπή το πνεύμα: «νά μην πάθω εγώ κακό». Ξέρετε πόσο πονάω, όταν βλέπω τί κόσμος υπάρχει!... Τώρα που ήμουν στο Νοσοκομείο[13], μια μέρα χρειάσθηκε να σηκώσουν έναν άρρωστο κατάκοιτο, για να τον μεταφέρουν σε άλλο θάλαμο. Ήταν ένας νοσοκόμος πού, ενώ αυτή ήταν η δουλειά του, δεν πήγε να βοηθήση καθόλου. «Δεν μπορώ, μου πονάει η μέση», είπε με μια αδιαφορία! Πά-πά, βλέπεις άνθρωπο απάνθρωπο! Και να δής, μια νοσοκόμα, που είχε δύο παιδάκια και περίμενε και τρίτο, ζορίστηκε η καημένη μαζί με μια άλλη και τον σήκωσαν. Τον εαυτό της δεν τον σκέφθηκε καθόλου. Ξέχασε ότι ήταν σε τέτοια κατάσταση κι έτρεξε να βοηθήση τον άρρωστο! Όταν βλέπω έναν άνθρωπο να δυσκολεύεται, να μην έχη κουράγιο και να γίνεται θυσία, για να εξυπηρετήση τους άλλους, ξέρετε τί χαρά μου δίνει; Ώ, μεγάλη χαρά! Η καρδιά μου σκιρτάει. Νιώθω να έχω συγγένεια μαζί του, γιατί και αυτός έχει συγγένεια με τον Θεό.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τσιμέντο να γίνουν οι άλλοι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σήμερα, ενώ πολύς κόσμος περίμενε να σάς δή, κάποιος νεαρός δεν περίμενε στην σειρά του· τους προσπέρασε όλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, ήρθε και μου είπε: «Είναι ανάγκη να σε δώ. Πήγα στο Άγιον Όρος και δεν σε βρήκα και ήρθα εδώ». «Καλά, του λέω, δεν βλέπεις τί κόσμος περιμένει; να σταματήσουν όλοι, για να ασχοληθώ τώρα μ᾿ εσένα;». «Ναί, Πάτερ», μου λέει. Ακούς κουβέντα; Και να είναι οι άλλοι στις σκάλες όρθιοι, στρυμωγμένοι, μεγάλοι, άρρωστοι, γυναίκες με μικρά παιδιά..., κι εκείνος να επιμένη. Και δεν ήταν ότι είχε κανένα σοβαρό θέμα· χαζομάρες ήταν αυτά που ήθελε να μου πή. Κατάλαβες; Τσιμέντο να γίνουν οι άλλοι!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να σκεφθήτε, έρχονται μερικοί και μου λένε: «Πάτερ, σήμερα να κάνης προσευχή μόνο για μένα, για κανέναν άλλον». Τέτοια απαίτηση! Είναι σαν να λένε: «Μ᾿ αυτήν την αμαξοστοιχία θα ταξιδέψω μόνον εγώ· να μην μπή μέσα κανένας άλλος». Αφού πάει και πάει το τραίνο, γιατί να μην μπούν και άλλοι μέσα;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ποιό νόημα έχει αυτό που είπε ο Χριστός: «Ός αν θέλη την ψυχήν αυτού σώσαι, απολέσει αυτήν»[14];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εννοεί να «απολέση» ο άνθρωπος την ζωή του, με την καλή έννοια. Να μην υπολογίζη την ζωή του, να θυσιάζη την ζωή του για τον άλλον. «Μηδείς το εαυτού ζητείτω αλλά το του ετέρου έκαστος»[15], λέει ο Απόστολος Παύλος. Όλη η βάση στην πνευματική ζωή εδώ είναι: να ξεχνάω τον εαυτό μου με την καλή έννοια και να σκέφτωμαι τον άλλον, να συμμετέχω στον πόνο, στην δυσκολία του άλλου. Να μην κοιτάζω πώς να ξεφύγω την δυσκολία, αλλά πώς να βοηθήσω τον άλλον, πώς να τον αναπαύσω.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα καταλαβαίνω, Γέροντα, τί αναπαύει τον άλλον, για να το κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν έρχεσαι στην θέση του άλλου, τότε θα καταλαβαίνης τί αναπαύει τον άλλον. Αν όμως μένης κλεισμένη στο καβούκι σου, πώς θα καταλάβης τί αναπαύει τον άλλον;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην εποχή μας οι πιο πολλοί κοιτάζουν πώς να πάρουν την θέση του άλλου και όχι πώς να έρθουν στην θέση του άλλου, για να τον καταλάβουν. Παρατηρώ καμμιά φορά πώς μερικοί, ακόμη και όταν πάνε να κοινωνήσουν, δεν περιμένουν στην σειρά τους. Καθένας λέει: «εγώ έχω δουλειά και βιάζομαι» και δεν σκέφτεται: «άραγε είμαι άξιος να κοινωνήσω;» ή «μήπως ο άλλος είναι πιο βιαστικός από μένα;». Τίποτε! κοινωνούν και φεύγουν. Εδώ, ακόμη και να στερηθής την Θεία Κοινωνία για χάρη του άλλου, πρέπει να χαίρεσαι. Κι αν ο ιερεύς έχη μία μόνο μερίδα, μόνον έναν μαργαρίτη, και βρεθή κάποιος άρρωστος που είναι ετοιμοθάνατος και χρειάζεται να κοινωνήση, τότε πρέπει να χαρής που δεν θα κοινωνήσης εσύ, για να κοινωνήση ο άρρωστος. Αυτό θέλει ο Χριστός. Έτσι έρχεται ο Χριστός μέσα στην καρδιά και πλημμυρίζει κανείς από χαρά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το βάσανο του βολέματος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, με δυσκολεύει μια αδελφή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρεις τί γίνεται; Πολλοί βλέπουν σε τί τους δυσκολεύουν οι άλλοι, και όχι σε τί δυσκολεύουν εκείνοι τους άλλους. Απαιτήσεις έχουν μόνον από τους άλλους, όχι από τον εαυτό τους. Η λογική όμως της πνευματικής ζωής είναι να εξετάζης σε τί δυσκολεύεις εσύ τους άλλους και όχι σε τί σε δυσκολεύουν οι άλλοι· να βλέπης τί αναπαύει τον άλλον και όχι τί αναπαύει εσένα. Για ανάπαυση ήρθαμε σε αυτήν την ζωή; για βόλεμα; Σ᾿ αυτόν τον κόσμο δεν ήρθαμε για να καλοπεράσουμε· ήρθαμε να ξεσκονισθούμε και να ετοιμασθούμε για την άλλη ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν σκεφτώμαστε μόνον τον εαυτό μας και κάνουμε μόνον αυτό που αναπαύει εμάς, θέλουμε μετά να μας σκέφτωνται οι άλλοι, θέλουμε όλοι να μας εξυπηρετούν, θέλουμε όλοι να μας βοηθούν..., συνέχεια δηλαδή θέλουμε, και καταλήγουμε στο βόλεμα του εαυτού μας. «Εμένα έτσι με βολεύει» ο ένας, «εμένα αλλιώς με βολεύει» ο άλλος, και τελικά ο καθένας αναπαύεται σ᾿ αυτό που τον βολεύει, αλλά ανάπαυση δεν βρίσκει, γιατί η πραγματική ανάπαυση έρχεται από την ανάπαυση του άλλου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην Κατοχή, το 1941, επειδή οι Γερμανοί έμπαιναν στα χωριά, έβαζαν φωτιές και σκότωναν, είχαμε φύγει από την Κόνιτσα και είχαμε ανεβή στο βουνό. Την ημέρα που οι Γερμανοί μπήκαν στην Κόνιτσα, τα δύο αδέλφια μου είχαν πάει νωρίς το πρωί κάτω στον κάμπο, στο χωράφι που είχαμε καλαμπόκια, να σκαλίσουν. Μόλις άκουσα ότι έφθασαν οι Γερμανοί, λέω στην μητέρα μου: «Θα πάω στο χωράφι να τους ειδοποιήσω». Εκείνη δεν μ᾿ άφηνε, γιατί όλοι της έλεγαν: «Οι άλλοι έτσι κι αλλιώς είναι χαμένοι. Μήν το αφήνης κι αυτό να πάη, γιατί θα χαθή κι αυτό». Που να ακούσω εγώ! Φοράω τα άρβυλα και τρέχω κάτω στον κάμπο. Από την βία μου όμως δεν τα έδεσα καλά καί, καθώς περνούσα μέσα από ένα ποτισμένο χωράφι, κόλλησαν τα άρβυλα στην λάσπη. Τα αφήνω και τρέχω ξυπόλυτος μέσα από την ποταμιά που ήταν γεμάτη τριβόλια[16]. Περίπου μία ώρα, καλοκαίρι μέσα στην ζέστη, έτρεχα ξυπόλυτος πάνω στα τριβόλια, αλλά ούτε καν καταλάβαινα πόνο. Φθάνω στο χωράφι μας, πάω κοντά στα αδέλφια μου εκεί που σκάλιζαν. «Ήρθαν οι Γερμανοί, τους λέω, πάμε να κρυφτούμε». Οπότε βλέπουμε τους Γερμανούς να έρχωνται με τα όπλα. «Συνεχίστε, τους λέω, να σκαλίζετε με τις τσάπες κι εγώ θα κάνω πώς αραιώνω τα καλαμπόκια και ξεβοτανίζω». Πέρασαν λοιπόν οι Γερμανοί και δεν μας πείραξαν· δεν μας είπαν τίποτε. Ύστερα είδα ότι τα πόδια μου από τα τριβόλια είχαν γίνει όλο πληγές· μέχρι τότε δεν είχα καταλάβει τίποτε. Εκείνο το τρέξιμο είχε χαρά! Είχε την χαρά της θυσίας. Να άφηνα τα αδέλφια μου; Αν δεν έτρεχα και πάθαιναν κάτι, μετά θα ήταν για μένα βάσανο. Και ασυνείδητος να ήμουν, θα είχα μετά το βάσανο του βολέματος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η φιλαυτία μας στερεί την ειρήνη και την χαρά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί φταίει, Γέροντα, και δεν είμαι πάντοτε ειρηνική;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ελευθερώθηκες από τον εαυτό σου, είσαι σκλάβα στον παλαιό σου άνθρωπο. Κοίταξε να πετάξης τον εαυτό σου, γιατί, αν δεν πετάξης τον εαυτό σου, θα σε πετάξη ο εαυτός σου. Όποιος έχει φιλαυτία, δεν μπορεί να έχη ανάπαυση, ειρήνη ψυχής, γιατί δεν είναι εσωτερικά ελεύθερος. Είναι σαν την χελώνα και το περπάτημά του είναι σαν της χελώνας. Βγάζει ελεύθερα το κεφάλι της η χελώνα; Τον περισσότερο καιρό μένει κλεισμένη στο καβούκι της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νομίζω, Γέροντα, ότι θεωρητικά πιάνω τον εαυτό μου, στην πράξη όμως...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η εφαρμογή είναι δύσκολη· εκεί ζορίζεται ο παλαιός άνθρωπος. Αν όμως δεν ζορίσουμε φιλότιμα τον παλαιό μας άνθρωπο, θα μας ανατινάξη την πνευματική μας οικοδομή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς είναι η κόλαση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Θα σού πω μια ιστορία που είχα ακούσει. Κάποτε ένας απλός άνθρωπος παρακαλούσε τον Θεό να του δείξη πώς είναι ο Παράδεισος και η κόλαση. Ένα βράδυ λοιπόν στον ύπνο του άκουσε μια φωνή να του λέη: «Έλα, να σού δείξω την κόλαση». Βρέθηκε τότε σε ένα δωμάτιο, όπου πολλοί άνθρωποι κάθονταν γύρω από ένα τραπέζι και στην μέση ήταν μια κατσαρόλα γεμάτη φαγητό. Όλοι όμως οι άνθρωποι ήταν πεινασμένοι, γιατί δεν μπορούσαν να φάνε. Στα χέρια τους κρατούσαν από μια πολύ μακριά κουτάλα· έπαιρναν από την κατσαρόλα το φαγητό, αλλά δεν μπορούσαν να φέρουν την κουτάλα στο στόμα τους. Γι᾿ αυτό άλλοι γκρίνιαζαν, άλλοι φώναζαν, άλλοι έκλαιγαν... Μετά άκουσε την ίδια φωνή να του λέη: «Έλα τώρα να σού δείξω και τον Παράδεισο». Βρέθηκε τότε σε ένα άλλο δωμάτιο όπου πολλοί άνθρωποι κάθονταν γύρω από ένα τραπέζι ίδιο με το προηγούμενο και στην μέση ήταν πάλι μια κατσαρόλα με φαγητό και είχαν τις ίδιες μακριές κουτάλες. Όλοι όμως ήταν χορτάτοι και χαρούμενοι, γιατί ο καθένας έπαιρνε με την κουτάλα του φαγητό από την κατσαρόλα και τάιζε τον άλλον. Κατάλαβες τώρα κι εσύ πώς μπορείς να ζής από αυτήν την ζωή τον Παράδεισο;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος κάνει το καλό, αγάλλεται, διότι αμείβεται με θεϊκή παρηγοριά. Όποιος κάνει το κακό, υποφέρει και κάνει τον επίγειο παράδεισο επίγεια κόλαση. Έχεις αγάπη, καλωσύνη; Είσαι άγγελος καί, όπου πάς ή σταθής, μεταφέρεις τον Παράδεισο. Έχεις πάθη, κακία; Έχεις μέσα σου τον διάβολο καί, όπου πάς ή σταθής, μεταφέρεις την κόλαση. Από εδώ αρχίζουμε να ζούμε τον Παράδεισο ή την κόλαση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η ελευθερία από την σκλαβιά της φιλαυτίας
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Σκοπός της ασκήσεως: η απέκδυση από τον παλαιό μας άνθρωπο'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς, Γέροντα, θα ξεπεράσω την φιλαυτία; Οι σωματικές μου δυνάμεις είναι λίγες και δυσκολεύομαι στην αυταπάρνηση και στην θυσία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –«Θυσία τω Θεώ πνεύμα συντετριμμένον· καρδίαν συντετριμμένην και τεταπεινωμένην ο Θεός ουκ εξουδενώσει»[17]. Δεν ξεπερνάς την φιλαυτία σου με το να σηκώνης τον βαρύ τουρβά του άλλου – αυτό δεν θα το ζητήση από σένα ο Θεός, αφού δεν έχεις σωματικές δυνάμεις –, αλλά αν ταπεινώνεσαι και σηκώνης μια κουβέντα, μια αδικία. Κι αν προστεθή και λίγος σωματικός κόπος από αγάπη και καλωσύνη, ξέρεις πώς βοηθάει μετά ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο σωματικός κόπος και η άσκηση τί σχέση έχουν με την εκκοπή των παθών;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο σωματικός κόπος υποτάσσει το σώμα στο πνεύμα. Και η νηστεία και η αγρυπνία και κάθε άσκηση, όταν γίνωνται για την αγάπη του Χριστού, παράλληλα με τον αγώνα για την εκκοπή των ψυχικών παθών, βοηθούν. Γιατί, αν δεν κάνη κανείς αγώνα για να ξερριζώση τα ψυχικά πάθη, την υπερηφάνεια, την ζήλεια, τον θυμό, και κάνη μόνο μια ξερή σωματική άσκηση, θα θρέψη τα πάθη του με την υπερηφάνεια. Τα ψυχικά πάθη μας κάνουν μεγαλύτερο κακό από ό,τι το πάχος του σώματος· αυτό είναι καλοήθης όγκος, ενώ τα ψυχικά πάθη είναι κακοήθης όγκος. Δεν λέω να μην κάνη κανείς άσκηση, αλλά να μπή στο νόημα της ασκήσεως που σκοπός της είναι η απέκδυση από τον παλαιό μας άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς πρέπει, Γέροντα, να αγωνίζεται κανείς στην εγκράτεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο αγώνας πρέπει να γίνεται ως εξής: Ό,τι έχει ανάγκη ο οργανισμός να του το δίνη κανείς· ύπνο, φαγητό κ.λπ. Μετά θα έχη στόχο να κόβη τα ψυχικά πάθη: τις επιθυμίες του, τον εγωισμό του, την ζήλεια του κ.λπ. Και μετά να κάνη εγκράτεια στο φαγητό, στον ύπνο. Τότε θα έχη νόημα η σωματική άσκηση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα διακρίνη κανείς μέχρι που φθάνουν τα όρια της αντοχής του και από που ξεκινάει η φιλαυτία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει να παρακολουθή τον εαυτό του και να δοκιμάζη. Δοκιμάζοντας θα βρη τα δικά του μέτρα. Και ο μπακάλης στην αρχή που είναι άπειρος, όταν ζυγίζη, άλλοτε βάζει λίγο και άλλοτε πολύ. Όταν μετά αποκτήση πείρα, βάζει όσο χρειάζεται. Πάντως, όταν είναι νέος κανείς, μπορεί να κάνη περισσότερη άσκηση. Όσο περνάει η ηλικία, οι δυνάμεις κάμπτονται και δεν μπορεί να ζορίση πολύ τον εαυτό του. Αν τον ζορίση παραπάνω, μπορεί να βλάψη και την υγεία του. Γι᾿ αυτό κατά καιρούς χρειάζεται να κάνη μια αναθεώρηση των δυνάμεών του και να προσαρμόζεται ανάλογα με την νέα κατάστασή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καμμιά φορά, Γέροντα, όταν αισθάνωμαι μία εξάντληση, με πιάνει μία δειλία και δεν μπορώ να κάνω τίποτε. Μήπως είναι φιλαυτία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν αισθάνεσαι εξάντληση, να εξετάζης εάν είναι από αρρώστια. Εάν δεν είναι από αρρώστια, δές μήπως σού λείπη ύπνος ή μήπως χρειαζόταν να φάς ή να ξεκουρασθής λίγο παραπάνω. Αν τίποτε από αυτά δεν συμβαίνη, τότε είναι του πειρασμού. Σήκω, άρχισε την δουλειά σου, και νικάς τον πειρασμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πόσο πρέπει να επιμείνω, Γέροντα, στον κόπο; Μήπως με το να οικονομάω τον εαυτό μου διώχνω την Χάρη του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, ευλογημένη! Θέλει να προσέχης και να σταματάς, πριν φθάσης να μην μπορής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όμως, Γέροντα, αισθάνομαι ότι ποτέ δεν εφάρμοσα αυτό που λένε οι Πατέρες: «Δώσε αίμα, για να λάβης πνεύμα»[18].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί αίμα να δώσης εσύ, αφού σού λείπει αίμα; Εσύ έχεις ανάγκη να σού δώσουν αίμα... Τα ψυχικά πάθη να προσέξης.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να μην προσκυνάμε την ανάπαυση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν, Γέροντα, λέω: «Τόσο μπορώ να δουλέψω, αυτή είναι η αντοχή μου», από φιλαυτία το λέω;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όσο κάθεται κανείς, τόσο χαλαρώνει· όσο δουλεύει, τόσο δυναμώνει. Εκτός που διώχνει την μούχλα με την δουλειά, βοηθιέται και πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο σκοπός είναι να φθάση να χαίρεται ο άνθρωπος περισσότερο από την κακοπάθεια παρά από την καλοπέραση. Αν ξέρατε πώς ζουν μερικά γεροντάκια εκεί στο Άγιον Όρος, αλλά και τί χαρά νιώθουν! Νά, ένα γεροντάκι, που έμενε μόνο του ένα χιλιόμετρο πιο πέρα από το Καλύβι μου, τί αυταπάρνηση είχε! Το Καλύβι του ήταν ψηλά, σε ένα πολύ απότομο μέρος, και το καημένο αρκουδώντας κατέβαινε από το μονοπάτι για να πάη σε ένα άλλο γεροντάκι πιο κάτω, όταν χρειαζόταν κάτι. Ήθελαν να το πάρουν να το γηροκομήσουν, αλλά δεν δεχόταν, και όλοι μετά έλεγαν: «αυτός είναι πλανεμένος», γιατί καθόταν μόνος του εκεί. Μια μέρα που ήρθε στο Καλύβι, μου είπε για ποιόν λόγο δεν ήθελε να φύγη: Όταν ζούσε ο Γέροντάς του, το Καλύβι τους δεν είχε ναό και εκείνος παρακαλούσε τον Γέροντά του να κάνουν ναό. «Ας κάνουμε ναό, του είπε τελικά ο Γέροντάς του, αλλά μετά δεν πρέπει ποτέ να φύγης από ᾿δώ, γιατί θα μένη στο Ιερό ο Φύλακας Άγγελος και δεν κάνει να τον αφήσης μόνον». Τότε αυτός του υποσχέθηκε ότι θα μείνη για πάντα στο Καλύβι, και έτσι έκαναν τον ναό. Τελευταία είχε γκρεμισθή και το Κελλί του και έμενε μέσα στην εκκλησία· κοιμόταν σε ένα στασίδι. Τέτοια αυταπάρνηση! Είχα φροντίσει να έχη μερικά ρούχα, για να αλλάζη τουλάχιστον, γιατί υπέφερε από τα έντερα και είχε κοψίματα. Μια μέρα έστειλα έναν γνωστό γιατρό να πάη να τον δή. Πήγε με έναν άλλον, χτυπούν, ξαναχτυπούν, τίποτε. Όταν άνοιξαν, τον βρήκαν πεθαμένο στο στασίδι που έμενε, σκεπασμένο με μια κουβέρτα. Εκεί ανεπαύθη εν Κυρίω!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η σκληρότητα στην ζωή μας για την αγάπη του Χριστού φέρνει στην καρδιά την τρυφεράδα του Χριστού. Οι θείες ηδονές γεννιούνται από τις σωματικές οδύνες. Οι Πατέρες έδωσαν αίμα και έλαβαν πνεύμα. Με ιδρώτα και κόπο πήραν την Χάρη. Πέταξαν τον εαυτό τους και τον βρήκαν στα χέρια του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ με συγκίνησε το συναξάρι των Αγίων Ασκητών του Σινά. Πέντε χιλιάδες ασκητές έζησαν στο Σινά και πόσοι άλλοι στο Άγιον Όρος! Χίλια χρόνια πόσοι Πατέρες αγίασαν! Αλλά και οι Ομολογητές και οι Μάρτυρες τί τράβηξαν! Και εμείς γκρινιάζουμε για την παραμικρή ταλαιπωρία. Ζητάμε να αποκτήσουμε χωρίς κόπο την αγιότητα. Σπανίζει η αυταπάρνηση. Ούτε εμείς οι μοναχοί δεν καταλάβαμε ότι «τά καλά κόποις κτώνται»[19]και έχουμε την επιείκεια στον εαυτό μας· δικαιολογούμε τον εαυτό μας και βρίσκουμε ελαφρυντικά για το καθετί. Από ᾿κεί ξεκινάει το κακό. Και ο διάβολος βρίσκει δικαιολογίες για τον κάθε άνθρωπο, αλλά τα χρόνια περνάνε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό να μην ξεχνιώμαστε· να θυμώμαστε και λίγο ότι υπάρχει και θάνατος. Μια που θα πεθάνουμε, να μην προσέχουμε και τόσο πολύ το σώμα· όχι να μην προσέχουμε και να παθαίνουμε ζημιές, αλλά να μην προσκυνούμε την ανάπαυση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί τον κρατάς τον εαυτό σου για τον εαυτό σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω τον λογισμό μήπως δεν φταίει η λίγη αντοχή μου που κουράζομαι εύκολα αλλά κάτι άλλο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αν υπήρχε η θεία φλόγα μέσα σου, τότε όλα θα ήταν διαφορετικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα αποκτήσω αυτήν την θεία φλόγα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν ξεχνάς τον εαυτό σου και σκέφτεσαι τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μου φαίνεται δύσκολο να το κάνω πάντοτε αυτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τουλάχιστον προσπάθησε να σκέφτεσαι και να φροντίζης τους άλλους όπως σκέφτεσαι και φροντίζεις τον εαυτό σου. Έτσι, σιγά-σιγά θα φθάσης να αδιαφορής για τον εαυτό σου, με την καλή έννοια, και να σκέφτεσαι πάντα τους άλλους. Και τότε βέβαια θα σε σκέφτεται και ο Θεός, θα σε σκέφτωνται και οι άλλοι· μόνο να μην το κάνης, για να σε σκέφτωνται οι άλλοι!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τελικά, Γέροντα, αυτό που με βασανίζει είναι ο εαυτός μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, βρέ παιδί, πέταξε τον εαυτό σου. Αν πετάξης τον εαυτό σου, μετά θα πετάς. Τί τον κρατάς τον εαυτό σου για τον εαυτό σου; Το κομμάτι της αγάπης που κρατάς για τον εαυτό σου, το αφαιρείς από την ολοκληρωτική αγάπη που πρέπει να έχης για τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα πετάξω τον εαυτό μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όσο μπορείς, να βγάζης τον εαυτό σου έξω από τις ενέργειές σου και να βάζης μέσα σου τους άλλους. Προσπάθησε αυτό που θέλεις για τον εαυτό σου να το δίνης στους άλλους. Να δίνης–νά δίνης, χωρίς να υπολογίζης τον εαυτό σου. Όσο θα δίνης, τόσο θα παίρνης, γιατί ο Θεός θα σού δίνη άφθονη την Χάρη Του και την αγάπη Του· θα σε αγαπάη πολύ, καθώς κι εσύ πολύ θα Τον αγαπάς, γιατί θα πάψης να αγαπάς τον εαυτό σου, ο οποίος σού ζητάει να τρέφεσαι από τον εγωισμό και την υπερηφάνεια, και όχι από την Χάρη του Θεού που δίνει όλες τις βιταμίνες στην ψυχή και την θεία αλλοίωση στην σάρκα, και κάνει τον άνθρωπο να ακτινοβολή. Θα εύχωμαι πολύ γρήγορα να τα νιώσης όλα αυτά, για να απαλλαγής από το βάσανο της φιλαυτίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να αγωνίζωμαι να απαλλαγώ από την φιλαυτία μου, και πάλι να έχω τον εαυτό μου σε ό,τι κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς αγωνίζεσαι; Τον πετάς τον εαυτό σου; Ό,τι είναι σιχαμερό το πετάει κανείς· πρέπει όμως να καταλάβη ότι είναι σιχαμερό. Άμα δεν το σιχαθή, δεν το πετάει. Θέλω να πώ, και τον παλαιό σου άνθρωπο, για να τον πετάξης, πρέπει να τον σιχαθής. Με μουδιασμένα πράγματα δεν γίνεται προκοπή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όταν υπάρχη αυταπάρνηση, δίνει ο Θεός την Χάρη Του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, με πειράζει η συνείδηση, όταν οικονομάω τον εαυτό μου. Σκέφτομαι: «Πώς οι Άγιοι βίαζαν τον εαυτό τους;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο άνθρωπος ξεπερνά τα όρια της αντοχής του, αγωνιζόμενος ταπεινά, με φιλότιμο, τότε έρχεται σ᾿ αυτόν θεία δύναμη, υπερφυσική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Βαρσανούφιος λέει: «Μη ζητήσης σωματικήν ανάπαυσιν, εάν μη δώη σοι αυτήν ο Κύριος»[20]. Τί εννοεί;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θέλει να πη να μην κοιτάζη κανείς το χουζούρι του, το βόλεμά του. Αυταπάρνηση χρειάζεται πρώτα και ύστερα έρχονται πολλές θείες δυνάμεις, γιατί, όταν υπάρχη αυταπάρνηση, τότε ο Θεός δίνει στον άνθρωπο την Χάρη Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν ο άνθρωπος έχη το πνεύμα της θυσίας, τότε δέχεται την θεία βοήθεια, τον οικονομάει ο Θεός. Ανάλογη με την θυσία και με την προσευχή που κάνει κανείς για τον συνάνθρωπό του, είναι και η βοήθεια που λαμβάνει από τον Θεό. Μια φορά που πήγαινα αργά το απόγευμα από την Μονή Σταυρονικήτα στο Καλύβι του Παπα–Τύχωνα – το ετοίμαζα τότε[21], για να μείνω εκεί – με σταμάτησε στον δρόμο κάποιος που είχε πολλά προβλήματα. Στάθηκα όρθιος, φορτωμένος με τον τουρβά γεμάτο πράγματα και τον άκουγα· ψιχάλιζε κιόλας. Νύχτωσε και εκείνος έλεγε-έλεγε συνέχεια. Ψιχάλα-ψιχάλα, είχαμε γίνει μούσκεμα. Κάποια στιγμή μου ήρθε ο λογισμός: «Πώς θα βρώ το Καλύβι; Νύχτα, λάσπη, το μονοπάτι δύσκολο, δεν έχω και φακό, αλλά πώς να τον διακόψω;». Τον ρώτησα που θα μείνη, μου είπε σε ένα κοντινό Κελλί. Σταθήκαμε λοιπόν εκεί μέχρι τα μεσάνυχτα. Μόλις χωρίσαμε και πήρα το μονοπάτι, γλίστρησα κι έπεσα μέσα στα βάτα. Τα παπούτσια έφυγαν κάτω, ο τουρβάς πιάστηκε στα κλαδιά, το ζωστικό μαζεύτηκε στον λαιμό. Δεν έβλεπα τίποτε. Οπότε είπα: «Καλύτερα ας μείνω εδώ και ας αρχίσω το Απόδειπνο. Θα κάνω και το Μεσονυκτικό και τον Όρθρο, θα φωτίση και θα βρώ το Κελλί μου. Άραγε αυτός ο καημένος θα βρη τον δρόμο του;». Μόλις έφθασα στο «Ελέησόν με ο Θεός κατά το μέγα έλεός σου», ξαφνικά, ένα φώς, σαν προβολέας, φώτισε όλον τον λάκκο της Καλιάγρας! Βρήκα τα παπούτσια και ξεκίνησα. Όλο το μονοπάτι ήταν μέσ᾿ στο φώς. Έφθασα στο Καλύβι, βρήκα και το κλειδί από το λουκέτο, που ήταν τόσο μικρό και το είχα βάλει σε τέτοιο μέρος πού, και μέρα να ήταν, δύσκολα θα το έβρισκα. Μπήκα μέσα, άναψα τα καντήλια στο εκκλησάκι, και τότε χάθηκε εκείνο το φώς. Δεν χρειαζόταν άλλο!...'
- type: h2
  initial:
    ru: ''
  text:
    ru: Δεύτερο Μέρος – Υπερηφάνεια Η Ρίζα Του Κακού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ο υπερήφανος είναι χωρισμένος από τον Θεό,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιατί η υπερηφάνεια είναι κακός αγωγός,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μονωτικό, που δεν αφήνει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν Χάρη του Θεού να περάση,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί μας απομονώνει από τον Θεό».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Υπερηφάνεια, το Γενικό Επιτελείο των παθών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –   Γέροντα, έχω ζήλεια, μνησικακία, κατακρίνω, θυμώνω...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η ζήλεια, η κατάκριση, ο θυμός, η μνησικακία κ.λπ., όλα από την υπερηφάνεια ξεκινούν. Η υπερηφάνεια είναι το Γενικό Επιτελείο όλων των παθών. Αν λοιπόν χτυπήσης την υπερηφάνεια, χτυπάς όλα τα πάθη και έρχεται μέσα σου η ταπείνωση και η αγάπη. Γι᾿ αυτό, νομίζω, αρκετό είναι να ασχοληθής ή μάλλον να ανοίξης μέτωπο μάχης με την υπερηφάνεια· να στρέψης όλα τα πυρά προς το κάστρο της υπερηφανείας, το οποίο μας χωρίζει από τον Θεό. Βλέπεις, όταν ο εχθρός πολεμάη ένα κράτος, τις περισσότερες δυνάμεις θα τις στείλη να χτυπήσουν την πρωτεύουσα. Μία βόμβα αν ρίξη στην πρωτεύουσα και την καταστρέψη, πάει μετά, κατέστρεψε όλο το κράτος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, με ποιόν συγγενεύει ο υπερήφανος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Με τον έξω από ᾿δώ, με τον διάβολο... Αν και ευκολώτερα κάμπτεται ο διάβολος παρά ο υπερήφανος. Γιατί τον δαίμονα τον κάμπτεις, αν ταπεινωθής, ενώ τον υπερήφανο, ακόμη και να ταπεινωθής και να του ζητήσης συγγνώμη, δεν τον κάμπτεις· θα σού πή: «υποκρίνεσαι!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος έχει περισσότερη ταπείνωση, έχει περισσότερο πνευματικό περιεχόμενο. Ο υπερήφανος δεν έχει εσωτερικό περιεχόμενο. Είναι σαν το αψώμωτο στάχυ που στέκεται όρθιο, ενώ το ψωμωμένο στάχυ γέρνει το κεφαλάκι του. Και εκτός που είναι σκοτισμένος, είναι και εσωτερικά ανήσυχος και εξωτερικά ταραγμένος και θορυβώδης. Γιατί, όταν υπάρχη υπερηφάνεια, ό,τι κάνει ο άνθρωπος, είναι μια φούσκα που την φουσκώνει ο διάβολος και μετά την τρυπάει με μια καρφίτσα, κάνει κρότο και σπάει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι άτιμη η υπερηφάνεια, είναι φοβερό πράγμα, αφού τους Αγγέλους τους έκανε δαίμονες! Αυτή μας έφερε από τον Παράδεισο στην γη και τώρα από την γη προσπαθεί να μας στείλη στην κόλαση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όταν δεν καταλαβαίνουμε την υπερηφάνεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ, Γέροντα, δεν καταλαβαίνω να υπερηφανεύωμαι για κάτι συγκεκριμένο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε θα υπάρχη μέσα σου μια γενική υπερηφάνεια. Πολλές φορές ο διάβολος τα παρουσιάζει όλα καμουφλαρισμένα και δεν παίρνει ο άνθρωπος είδηση, όταν ενεργή υπερήφανα. Αν όμως παρακολουθή και εξετάζη τον εαυτό του, βλέπει που ενήργησε με υπερηφάνεια. Μπορεί να μην καταλαβαίνη όλη την υπερηφάνεια που έχει, αλλά λίγο θα την καταλαβαίνη. Θα δη ότι νιώθει μέσα του μια εγωιστική ικανοποίηση, μια υπεροχή απέναντι στους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, κάποιος δεν μπορή να καταλάβη καθόλου ότι έχει υπερηφάνεια, τί γίνεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τότε λειτουργούν οι πνευματικοί νόμοι. Υπερηφανεύεται, πέφτει και ταπεινώνεται. Ξανά υπερηφανεύεται, πάλι πέφτει, πάλι ταπεινώνεται. Και συνεχίζεται η ίδια κατάσταση σε όλη του την ζωή, υπερηφάνεια-ταπείνωση, υπερηφάνεια-ταπείνωση. Αυτή η ταπείνωση δεν είναι αρετή· είναι το αποτέλεσμα των πνευματικών νόμων που λειτουργούν. Ταπεινώνεται δηλαδή ο άνθρωπος, χωρίς να το θέλη και χωρίς να βγαίνη τίποτε. Υπάρχει μια στασιμότητα· του δίνεται μόνον η ευκαιρία να καταλάβη ότι δεν πάει καλά. Λέω, ας πούμε, σε μια αδελφή: «Αυτήν την εικόνα την έκανες καλή». Αν υπερηφανευθή, όταν πρόκειται να κάνη άλλη εικόνα, θα πή: «Αυτήν την εικόνα θα την κάνω πιο καλή από την προηγούμενη, για να μου πη ο Γέροντας πάλι «μπράβο"». Και βλέπεις, μετά κάνει μια καρικατούρα. Την διορθώνω καί, επειδή πάλι λέει μέσα της: «τώρα θα την κάνω όπως ακριβώς μου είπε ο Γέροντας, για να μου πη «μπράβο"», κάνει πάλι καρικατούρα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί όμως, Γέροντα, η ίδια να την θεωρή καλή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πώς δεν μπορεί; Την καρικατούρα μπορεί να την θεωρήση αριστούργημα και να έρθη με χαρά να μου πή: «Πώς σάς φαίνεται, Γέροντα, τώρα; Είναι καλή;». Θα της αποδείξω ότι είναι καρικατούρα και τότε θα καταλάβη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κι αν δεν το καταλάβη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε η υπερηφάνειά της έχει πιάσει πουρί και θα συνεχίζη να κάνη τα ίδια λάθη. Ό,τι και να πής, δεν θα βγαίνη από το δικό της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εάν, Γέροντα, με τον νού μου πιάνω την υπερηφάνεια, αλλά η καρδιά μου μένει σκληρή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από ᾿κεί θα αρχίσης και σιγά-σιγά θα έρθη η θεραπεία. Ο γιατρός πρώτα κάνει την διάγνωση και ύστερα προχωρεί στην θεραπεία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η υπερηφάνεια εισχωρεί παντού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πιο πολύ με βοηθάει να έχω λίγη δυσκολία, όταν κάνω τα πνευματικά μου καθήκοντα. Μπορεί όμως να έχη και αυτό υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έ, αν δεν προσέξη κανείς, και ξαπλωμένος να είναι και να μην κάνη τίποτε, πάλι μπορεί να υπερηφανεύεται. Το τραίνο εκτροχιάζεται και από τα αριστερά και από τα δεξιά. Ο διάβολος και από ᾿δώ και από ᾿κεί μας πιάνει. Με ρωτούν μερικοί: «Τί να προσέξω, για να μην πέφτω στην υπερηφάνεια;». Είναι σαν να λένε: «Από που κινδυνεύω να πέσω; από ᾿δώ ή από ᾿κεί;». Και από ᾿δώ και από ᾿κεί μπορεί να πέσης, και από αριστερά και από δεξιά, και από την σκάλα και από την καρέκλα και από το σκαμνί. Κάθε στιγμή και σε κάθε περίπτωση χρειάζεται προσοχή, γιατί η υπερηφάνεια εισχωρεί παντού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κάποιος να μην έχη τίποτε και να υπερηφανεύεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καμμιά φορά αυτός μπορεί να έχη περισσότερη υπερηφάνεια. Όταν ήμουν στην Μονή Στομίου[22], στην Ήπειρο, είχα μάθει για έναν γέρο τσομπάνο ότι ήταν τελείως εγκαταλελειμμένος. Δεν είχε κάνει οικογένεια και γύριζε εδώ κι εκεί. Τελικά τον συμμάζεψε ένας άλλος τσομπάνος και τον έβαλε σε μια καλύβα, όπου είχε τα κλαδιά για τις κατσίκες. Δεν τον άφηνε να ανάβη ούτε φωτιά, για να ζεσταθή, γιατί φοβόταν μην πιάσουν φωτιά τα κλαδιά. Εκεί μέσα στο κρύο, σε μια γωνιά είχε δύο σανίδες για κρεββάτι κι ένα στρώμα. Όταν το έμαθα, πήγα να τον δώ. Ήταν χάλια. Είπα μετά σε μια φτωχή γυναίκα: «Πόσα θέλεις, για να τον πλένης λίγο;». «Τίποτε, μου λέει, μόνον το σαπούνι να μου δίνης». Μια μέρα που είχα πάει, ήταν μεσημέρι και έτρωγε. Μόλις τέλειωσε το φαγητό, με κοιτάζει, γυρίζει το πιάτο ανάποδα και λέει με μια ικανοποίηση: «Αυτό θα πη μελό[23], καλόγερε, αυτό θα πη μελό! Έχει σκυλιά, γατιά εδώ». Δηλαδή το ότι γύρισε ανάποδα το πιάτο, για να μην το γλείφουν τα γατιά και τα σκυλιά, το θεώρησε κατόρθωμα. Λές και ανέβηκε στο διάστημα. Νά, υπερηφάνεια! Τα χάλια του είχε, και όμως τί υπερηφάνεια είχε!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι υπερήφανοι λογισμοί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί πρέπει να κάνουμε, όταν μας έρχωνται λογισμοί υπερηφανείας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όπως οι άλλοι γελούν, όταν μας βλέπουν να υπερηφανευώμαστε, έτσι κι εμείς να γελούμε με τους λογισμούς υπερηφανείας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στον ταπεινό έρχονται υπερήφανοι λογισμοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έρχονται, αλλά γελάει, γιατί γνωρίζει τον εαυτό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάπου διάβασα ότι τον λογισμό της υπερηφανείας πρέπει να τον διώχνουμε αμέσως όπως τον αισχρό λογισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το θέμα είναι ότι τον αισχρό λογισμό τον καταλαβαίνεις εύκολα, ενώ τον λογισμό της υπερηφανείας, για να τον καταλάβης, χρειάζεται πολλή εγρήγορση. Αν λ.χ. την ώρα της προσευχής περάση ένας άσχημος λογισμός από τον νού σου, θα τον καταλάβης και θα τον διώξης αμέσως· «άντε φύγε από ᾿δώ», θα πής. Αλλά, αν στην εκκλησία σού περάση ο λογισμός ότι διάβασες ωραία το Ψαλτήρι και υπερηφανευθής, χρειάζεται εγρήγορση, για να τον καταλάβης και να τον πετάξης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τις περισσότερες φορές προλαβαίνει και έρχεται ο λογισμός της υπερηφανείας σε χρόνο μηδέν. Πώς θα προλαβαίνω να φέρνω ταπεινό λογισμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει να γίνη δουλειά από νωρίτερα – «ητοιμάσθην και ουκ εταράχθην»[24], λέει ο Δαβίδ –, γιατί οι λογισμοί της υπερηφανείας έρχονται αστραπιαία. Αυτό είναι παλιά μηχανή του διαβόλου. Τώρα να πάρης μια καινούργια μηχανή – να καλλιεργής συνέχεια ταπεινούς λογισμούς –, για να τρέχης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μόνον οι ταπεινοί λογισμοί φέρνουν ταπείνωση και μόνο με την ταπείνωση φεύγει η υπερηφάνεια. Μια φορά ένας ιεροκήρυκας μου είπε ότι ετοίμασε ένα ωραίο κήρυγμα. Ανέβηκε στον άμβωνα και μιλούσε πολύ ωραία. Κάποια στιγμή όμως του πέρασε ένας υπερήφανος λογισμός και μπερδεύτηκε. Ξέσπασε τότε σε ένα νευρικό κλάμα και κατέβηκε από τον άμβωνα ντροπιασμένος. Ύστερα, για πολύν καιρό δεν μπορούσε να κάνη κήρυγμα· είχε αχρηστευθή. «Κοίταξε, του λέω, εκείνο το έπαθες από υπερηφάνεια. Επειδή υπερηφανεύθηκες, απομακρύνθηκε η Χάρις του Θεού. Τώρα να ξεκινήσης ταπεινά. Όταν έρθη η ώρα να ανεβής στον άμβωνα, να πής: «Αν μπερδευτώ, σημαίνει ότι μου χρειάζεται ρεζιλίκι, γιατί αυτό θα με βοηθήση πνευματικά». Και αν τυχόν σε πιάση πάλι το κλάμα, οι άνθρωποι θα νομίζουν ότι συγκινήθηκες, οπότε θα βοηθηθούν και δεν θα σκανδαλισθούν. Μη φοβάσαι». Πράγματι, ξεκίνησε έτσι ταπεινά, περιμένοντας ρεζιλίκι, και άρχισε πάλι να κηρύττη.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η υπερηφάνεια είναι πολύμορφη
- type: h2
  initial:
    ru: ''
  text:
    ru: Η κρυφή υπερηφάνεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μου είπατε, Γέροντα, ότι έχω κρυφή υπερηφάνεια. Ποιά είναι η κρυφή υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι η εσωτερική υπερηφάνεια. Και η εσωτερική υπερηφάνεια είναι πολύ χειρότερη από την εξωτερική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί διαφορά έχει η εξωτερική από την εσωτερική υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η εξωτερική υπερηφάνεια φαίνεται και θεραπεύεται εύκολα. Ο άνθρωπος που έχει εξωτερική υπερηφάνεια φαίνεται και από τα ρούχα του και από το περπάτημά του και από την ομιλία του, και έτσι μπορεί κανείς να του πη καμμιά κουβέντα και να βοηθηθή. Ενώ η κρυφή υπερηφάνεια είναι πολύ ύπουλη και γι᾿ αυτό δύσκολα θεραπεύεται. Κρύβεται και δεν την βλέπουν οι άλλοι· μόνον ένας πεπειραμένος μπορεί να την καταλάβη. Η κρυφή υπερηφάνεια συνήθως υπάρχει στους πνευματικούς ανθρώπους. Και τότε, ενώ έχουν εξωτερικά σχήματα ταπεινά, σχήματα ευλαβείας, μέσα τους κρύβουν του κόσμου την υπερηφάνεια! Βλέπεις, ντύνεται στα κουρέλια το ταγκαλάκι...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο άνθρωπος που έχει κρυφή υπερηφάνεια την καταλαβαίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν παρακολουθή τον εαυτό του, την καταλαβαίνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω τον λογισμό ότι αυτός που έχει κρυφή υπερηφάνεια, δεν νιώθει μέσα του ανάπαυση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ανάπαυση θεϊκή δεν νιώθει, ούτε γνώρισε ποτέ την θεϊκή ανάπαυση, αλλά αναπαύει τον λογισμό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί θα με βοηθήση, Γέροντα, να καταλάβω αν έχω κρυφή υπερηφάνεια και να αγωνισθώ να την διώξω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν κάνης, ας υποθέσουμε, έναν πνευματικό αγώνα και σού λέη ο λογισμός ότι κάνεις κάτι σπουδαίο, είσαι ενάρετη κ.λπ., σίγουρα υπάρχει μέσα σου υπερηφάνεια, αλλά την κρύβεις. Αν λοιπόν προσέξης, θα δής ότι νιώθεις μια ικανοποίηση ψεύτικη. Για να φύγη η κρυφή υπερηφάνεια, πρέπει να σιχαθής αυτό το ψεύτικο και να το πετάξης. Αυτούς που έχουν εξωτερική υπερηφάνεια, τους σιχαίνονται οι άλλοι, και έτσι μπορούν να διορθωθούν· ενώ, όσοι έχουν εσωτερική, κρυφή, υπερηφάνεια, πρέπει οι ίδιοι να σιχαθούν τον εαυτό τους, για να απαλλαγούν από αυτήν. Αλλά, και όταν δίνης στους άλλους το δικαίωμα να σού κάνουν παρατηρήσεις, αυτό θα σε βοηθήση, γιατί θα βγή έξω η κρυφή υπερηφάνεια, θα φανερωθή και σιγά-σιγά θα φύγη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Εγωισμός, το αναρχικό παιδί της υπερηφανείας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, άλλο πάθος είναι η υπερηφάνεια και άλλο ο εγωισμός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η υπερηφάνεια, ο εγωισμός, η κενοδοξία κ.λπ., εκτός από την έπαρση που είναι εωσφορικός βαθμός, είναι το ίδιο πάθος με μικρές διαφορές και διαβαθμίσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο εγωισμός είναι το αναρχικό παιδί της υπερηφανείας· δεν το βάζει κάτω, επιμένει. Όπως όμως τα δένδρα που δεν λυγίζουν, σπάζουν τελικά από τον αέρα, έτσι και ο άνθρωπος που έχει εγωισμό, επειδή δεν κάμπτεται, σπάζει τελικά τα μούτρα του. Μεγάλο κακό ο εγωισμός! Ενώ και ανάπαυση δεν έχει ο εγωιστής, πάλι επιμένει! Δεν βλέπεις, ο Άρειος; Όταν η μητέρα του του είπε: «καλά, τόσοι λένε ότι σφάλλεις· δεν το καταλαβαίνεις;», «ναί, το ξέρω, της απάντησε, αλλά πώς να υποταχθώ σ᾿ αυτούς;». Ο εγωισμός του δεν τον άφηνε να παραδεχθή το λάθος του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και δεν τον απασχολούσε, Γέροντα, που είχε παρασύρει τόσον κόσμο στην αίρεση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν τον απασχολούσε. «Αν παραδεχθώ ότι σφάλλω, έλεγε, θα εξευτελισθώ και στους οπαδούς μου». Και όσο καταλάβαινε ότι κάνει λάθος, άλλο τόσο ζοριζόταν να τους πείση ότι είχε δίκαιο. Φοβερό πράγμα ο εγωισμός!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σε τί διαφέρει, Γέροντα, ο εγωιστής από τον υπερήφανο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο εγωιστής έχει θέλημα, πείσμα, ενώ ο υπερήφανος μπορεί να μην έχη ούτε θέλημα ούτε πείσμα. Ας πούμε ένα παράδειγμα: Στην εκκλησία προσκυνάτε τις εικόνες με μια σειρά· η καθεμιά ξέρει την σειρά της. Μια αδελφή, αν έχη εγωισμό και της πάρη κάποια άλλη την σειρά, θα κατεβάση τα μούτρα και μπορεί να μην πάη ούτε να προσκυνήση. «Αφού προσκύνησε εκείνη πριν από μένα, θα πή, δεν πάω να προσκυνήσω». Ενώ, αν έχη υπερηφάνεια, πάλι θα πειραχθή, αλλά δεν θα αντιδράση έτσι· μπορεί μάλιστα να πη και στις επόμενες, δήθεν με ευγένεια: «Περάστε! πέρνα κι εσύ, πέρνα κι εσύ!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να κάνω, Γέροντα, όταν πληγώνεται ο εγωισμός μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν πληγώνεται ο εγωισμός σου, μην τον περιθάλπης· άφησέ τον να πεθάνη. Αν πεθάνη ο εγωισμός σου, θα αναστηθή η ψυχή σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς πεθαίνει, Γέροντα, ο εγωισμός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει να θάψουμε το εγώ μας, να σαπίση και να γίνη κοπριά, για να αναπτυχθή η ταπείνωση και η αγάπη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η μεγάλη ιδέα για τον εαυτό μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί υπερηφανεύομαι εύκολα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να υπερηφανεύεσαι εύκολα, σημαίνει ότι έχεις μεγάλη ιδέα για τον εαυτό σου. Πιστεύεις ότι κάτι είσαι. Δεν μπορεί να υπερηφανευθή κανείς, αν δεν πιστεύη ότι κάτι είναι. Αφού λοιπόν πιστεύεις ότι είσαι σπουδαία, μετά με το παραμικρό υπερηφανεύεσαι, σαν τους υπερτασικούς πού, μόλις λίγο στενοχωρηθούν, αμέσως ανεβάζουν πίεση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχει παγώσει πάλι η καρδιά μου. Γιατί φθάνω σ᾿ αυτήν την κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί αφήνεις το κεφάλι σου ξεβίδωτο και παίρνει αέρα το μυαλό σου. Εγώ βάζω τάπα, την βιδώνω, αλλά εσύ την πετάς. Τώρα χρειάζεται να βάλουμε τάπα μεγάλη και να την βιδώσουμε γερά-γερά. Ξέρεις πόσα θα σού έδινε ο Χριστός, αν δεν είχες αυτό το ελάττωμα; Όταν δεν προσέχουμε, έρχεται ο διάβολος ύπουλα, μας τρυπάει το κεφάλι με το σουβλί του, την οίηση, μας το φουσκώνει σαν μπαλόνι και μας σηκώνει στον αέρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένας που έχει μεγάλη ιδέα για τον εαυτό του, δεν είναι εύκολο να δη το καλό που έχει ο άλλος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έτσι είναι. Αυτός που έχει μεγάλη ιδέα για τον εαυτό του, παραμένει μέσα στην αντάρα της υπερηφανείας και δεν έχει ούτε πνευματική υγεία ούτε ορατότητα, οπότε δεν μπορεί να δη τα χαρίσματα του άλλου. Αλλά γιατί να έχη κανείς μεγάλη ιδέα για τον εαυτό του; Πώς θα έρθουν οι θείες ιδέες, αν δεν πετάξη την δική του μεγάλη ιδέα; Αν πάρη το κατσαβίδι ο Χριστός, λίγο την βιδούλα να στρίψη, μπανταλομάρες[25]θα λέμε. Τί ιδέα να έχης λοιπόν για τον εαυτό σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτός που έχει μεγάλη ιδέα για τον εαυτό του, είναι εκτός του εαυτού του, παράφρων. Χρειάζεται να κατεβή-νά κατεβή, να προσγειωθή, για να βρη τον εαυτό του· αλλιώς θα γυρίζη στα σύννεφα και θα ξοδεύη την βενζίνη στον αέρα!
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αυτοπεποίθηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, τί σημαίνει: «Εάν μη Κύριος οικοδομήση οίκον, εις μάτην εκοπίασαν οι οικοδομούντες»[26];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό αναφέρεται στην αυτοπεποίθηση του ανθρώπου. Βλέπεις, και στην Ακολουθία του Μεγάλου Σχήματος, όταν ο υποψήφιος μοναχός ερωτάται: «Ταύτα πάντα υπομένεις;», απαντά: «Ναί, του Θεού συνεργούντος»[27]. Δεν λέει: «Ναί, εγώ μόνος μου θα υπομείνω». Όταν ο άνθρωπος δεν βάζη σε όλα μπροστά τον Θεό, αλλά λέη: «εγώ μόνος μου θα κάνω αυτό, εγώ με τις δικές μου δυνάμεις θα κάνω εκείνο», τότε και τα μούτρα του τρώει και τίποτε δεν κάνει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στενοχωρώ πολύ τις αδελφές· άλλα μου λένε να κάνω, άλλα κάνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από την αυτοπεποίθηση το παθαίνεις. Εσύ νομίζεις ότι πιάνεις πουλιά στον αέρα, ενώ πιάνεις αέρα! Σηκώνεις το χέρι σου και νομίζεις ότι έπιασες ένα πουλί. «Το έπιασα» λές, αλλά το χέρι σου είναι άδειο. Σηκώνεις και το άλλο σου χέρι, «τό έπιασα» λές, αλλά και πάλι το χέρι σου είναι άδειο. Να βλέπης πρώτα αν είναι γεμάτο το χέρι σου και ύστερα να λές «τό έπιασα».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι αδελφές μου λένε ότι δυσκολεύονται μαζί μου, επειδή επιμένω στην γνώμη μου· εγώ όμως δεν το καταλαβαίνω πάντοτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ξέρεις τί συμβαίνει μ᾿ εσένα; Όταν σχηματίζης μια γνώμη για κάτι, δεν λές: «μού πέρασε αυτός ο λογισμός, δεν ξέρω αν είναι σωστός», αλλά πιστεύεις ότι η γνώμη σου είναι πάντοτε σωστή και επιμένεις. Κάνεις σαν εκείνη την νοικοκυρά που της αγόρασε ο άνδρας της ένα χταπόδι να μαγειρέψη, αλλά του έλειπε το ένα πλοκάμι. «Το μαγείρεψες, της λέει, το χταπόδι; έβρασε;». «Ποιό χταπόδι; λέει εκείνη, το επταπόδι». Όχι το οχταπόδι-όχι το επταπόδι, νευρίασε στο τέλος ο άνδρας της από την επιμονή της και την πέταξε στο πηγάδι. Αλλά και από ᾿κεί έδειχνε με τα δάκτυλά της «επτά, επτά, επτά»! Κοίταξε, να λές τον λογισμό σου, αλλά να μην επιμένης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όμως, Γέροντα, πολλές φορές βλέπω ότι η δική μου γνώμη είναι καλύτερη από την γνώμη των αδελφών με τις οποίες συνεργάζομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από την αυτοπεποίθηση που έχεις βλέπεις έτσι τα πράγματα. Να προσέξης πολύ, γιατί όποιος έχει πολλή λογική και κρίση με εγωισμό και αυτοπεποίθηση, μπορεί να φθάση να μην παραδέχεται κανέναν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα απαλλαγώ από την αυτοπεποίθηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν γνωρίσης τον εαυτό σου, θα δής ότι δεν έχεις τίποτε δικό σου και τίποτε δεν μπορείς να κάνης χωρίς την βοήθεια του Θεού. Αν λοιπόν καταλάβης πώς ό,τι καλό κάνεις είναι από τον Θεό και όσες χαζομάρες κάνεις είναι δικές σου, τότε θα πάψης να έχης εμπιστοσύνη στον εαυτό σου και θα απαλλαγής από την αυτοπεποίθηση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καυχησιολογία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όποιος έχει υπερηφάνεια πάντοτε λέει το καλό που κάνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Και να το πη και να μην το πή, τόχει μέσα του κρυφό καμάρι! Νά, αυτές τις μέρες ήρθε κάποιος να με δή. Μου μιλούσε συνέχεια για τον εαυτό του και κάθε τόσο πρόσθετε: «Εις δόξαν Θεού τα λέω». Έλεγε-έλεγε... «Εις δόξαν Θεού τα λέω». Με τρόπο του είπα: «Μήπως μπαίνει λίγο και η δόξα η δική σου;». «Ά, όχι, μου λέει, όλα εις δόξαν Θεού...». Και τελικά δεν είχε έρθει να μου πη κάτι που τον απασχολούσε, αλλά να μου διηγηθή τα κατορθώματά του «εις δόξαν Θεού...», ενώ στην πραγματικότητα όλα τα έλεγε για την δόξα την δική του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πάντως, όταν ο άνθρωπος κάνη γνωστό το καλό που κάνει και υπερηφανεύεται, πάντοτε το χάνει. Τότε και κουράζεται άσκοπα και κολάζεται. Κάποιος που επρόκειτο να γίνη ιερέας πήγε σε ένα απομονωμένο μοναστήρι να καθήση σαράντα μέρες πριν από την χειροτονία του. Στις τριάντα οκτώ όμως μέρες παρουσιάσθηκε κάποια ανάγκη και χρειάσθηκε να κατεβή στον κόσμο. Μετά έκανε το πάν να επιστρέψη, για να μείνη ακόμη δυο μέρες, γιατί πώς θα έλεγε ότι κάθησε στην έρημο σαράντα μέρες πριν από την χειροτονία του; Βλέπεις, και ο Μωυσής σαράντα μέρες κάθησε στο Σινά, πριν πάρη τις δέκα εντολές[28]!... Έλεγε μετά παντού: «Εγώ πριν από την χειροτονία μου κάθησα στην ησυχία σαράντα μέρες». Έτσι έρχεται η Χάρις; Χίλιες φορές να καθόταν είκοσι μέρες ή δεκαπέντε ή να μην καθόταν ούτε μια μέρα, για να μη καυχιέται ότι κάθησε σαράντα μέρες. Τότε περισσότερη Χάρη θα είχε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Απόστολος Παύλος λέει: «Ο καυχώμενος εν Κυρίω καυχάσθω»[29]. Αυτή η καύχηση μπορεί να έχη υπερηφάνεια;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, πώς να έχη υπερηφάνεια; Αυτό έχει μια δοξολογία, μια ευχαριστία στον Θεό. Αν θεωρούμε μεγάλη τιμή και ευεργεσία που οικονόμησε ο Καλός Θεός να είμαστε Χριστιανοί, αυτή η καύχηση δεν έχει υπερηφάνεια. Όταν κάποιος, ας υποθέσουμε, θεωρή ευλογία και χαίρεται που ο Θεός οικονόμησε να έχη καλούς, ευλαβείς, γονείς, αυτό δεν σημαίνει ότι καμαρώνει κοσμικά, αλλά ότι έχει ευγνωμοσύνη προς τον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ανθρωπαρέσκεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλές φορές με πιάνει ένα παράπονο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί παράπονο έχεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νά, λέω: «Γιατί δεν αναγνώρισαν τον κόπο μου και μου συμπεριφέρθηκαν έτσι;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν κάποιος κάνη κάτι ταπεινά και με αγάπη, και δεν βρη αναγνώριση, μπορεί να του έρθη και ένα παράπονο. Αυτό είναι ανθρώπινο – όχι φυσικά ότι και αυτό είναι σωστό, αλλά τότε έχει κανείς κάποια ελαφρυντικά. Όταν όμως απαιτή την αναγνώριση, αυτό είναι βαρύ· έχει μέσα εγωισμό, δικαίωμα[30], ανθρωπαρέσκεια. Όσο μπορείς, να κινήσαι ταπεινά. Ό,τι κάνεις να το κάνης με φιλότιμο, για τον Χριστό, και όχι από ανθρωπαρέσκεια και κενοδοξία, για να ακούσης το «μπράβο» από τους ανθρώπους. Όταν ο άνθρωπος δεν δέχεται τα «μπράβο» από τους ανθρώπους και εργάζεται μόνον για τον Θεό, τότε ανταμείβεται από τον Θεό και σ᾿ αυτήν την ζωή με την άφθονη Χάρη Του, και στην άλλη με τα αγαθά του Παραδείσου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, μέσα στο φιλότιμο να υπάρχη ανθρωπαρέσκεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί ο διάβολος, που όλα θέλει να τα μολύνη, να κλέβη το λίγο φιλότιμο με την ανθρωπαρέσκεια. Έχει δηλαδή ο άνθρωπος λίγο φιλότιμο, αλλά, αν δεν προσέξη, μπαίνει μέσα η ανθρωπαρέσκεια και μετά, ό,τι κι αν κάνη, πάει χαμένο. Είναι σαν να βγάζη νερό με τρύπιο κουβά. Αν όμως καταλάβη πώς ό,τι κάνει από ανθρωπαρέσκεια μολύνεται, μετά δεν θα έχη όρεξη να κάνη κάτι για να επιδειχθή· δεν θα έχη μάτια να δη αν τον καμαρώνουν οι άλλοι ούτε αυτιά να ακούση τί λένε γι᾿ αυτόν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ δεν μπορώ να ξεχωρίσω αν κάτι το κάνω από καθαρό φιλότιμο ή από ανθρωπαρέσκεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το καθαρό φαίνεται. Όταν κινήται κανείς με καθαρό φιλότιμο, έχει πληροφορία εσωτερική, έχει δηλαδή μέσα του ανάπαυση, γαλήνη, ενώ η ανθρωπαρέσκεια φέρνει ανησυχία, ταραχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου λέει ο λογισμός πώς πέφτω σε πειρασμούς, επειδή η καρδιά μου δεν είναι ολοκληρωτικά δοσμένη στον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, κλέβεσαι από την ανθρωπαρέσκεια. Προσπάθησε στην κάθε φιλότιμη ενέργειά σου να μη σφηνώνεται η ανθρωπαρέσκεια, για να έχης και καθαρό μισθό, χωρίς κρατήσεις από το ταγκαλάκι, αλλά και περισσότερη εσωτερική ειρήνη. Να εξετάζης τα ελατήρια με τα οποία κινείσαι καί, μόλις αντιληφθής ότι κινείσαι από ανθρωπαρέσκεια, να την χτυπάς αμέσως. Αν κάνης αυτόν τον «καλόν αγώνα»[31], θα αποτοξινωθής από κάθε κοσμικό ελατήριο που έχει κέντρο το εγώ. Τότε θα γίνωνται όλα καλά και δεν θα έχης πειρασμούς ούτε εξωτερικούς ούτε δικούς σου εσωτερικούς, αλλά θα έχης εσωτερική ειρήνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στενοχωριέμαι για την στασιμότητα που έχω. Θα ήθελα κάθε μέρα να προοδεύω πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρεις τί συμβαίνει καμμιά φορά; Μπορεί να θέλουμε να απαλλαγούμε από τα πάθη μας και να γίνουμε καλύτεροι, όχι για να ευαρεστήσουμε τον Θεό, αλλά για να αρέσουμε στους άλλους. Κι εσύ, ας πούμε, θέλεις να γίνης καλύτερη, να προχωρήσης πνευματικά. Εξέτασες όμως γιατί το θέλεις; Το θέλεις, για να πλησιάσης περισσότερο στον Θεό ή για να φαίνεσαι καλύτερη από τις άλλες αδελφές; Βιάζεσαι λ.χ. να πάς στην εκκλησία. Γιατί το κάνεις; για να είσαι από την αρχή στην Ακολουθία, επειδή αυτό είναι το σωστό ή για να πάς πρώτη και να λένε οι αδελφές καλά λόγια για σένα; Ο πνευματικός άνθρωπος ενδιαφέρεται να αρέση στον Θεό, όχι στους ανθρώπους. «Αν ήθελα να αρέσω στους ανθρώπους, λέει ο Απόστολος Παύλος, δεν θα ήμουν δούλος του Χριστού»[32].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω πάντοτε έναν φόβο μην ξεπέσω στα μάτια των άλλων, ενώ δεν σκέφτομαι πώς με βλέπει ο Θεός. Πώς θα αυξηθή ο φόβος του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγρήγορση χρειάζεται. Σε κάθε σου ενέργεια, ακόμη και στην παραμικρή σου κίνηση, κέντρο να είναι ο Θεός. Στρέψε όλον τον εαυτό σου προς τον Θεό. Αν αγαπήσης τον Θεό, ο νούς σου θα είναι συνέχεια στο πώς να ευχαριστήσης τον Θεό, στο πώς να αρέσης στον Θεό, και όχι στο πώς να αρέσης στους ανθρώπους. Αυτό πολύ θα σε βοηθήση να ελευθερωθής από τις βαρειές αλυσίδες της ανθρωπαρέσκειας που σού είναι εμπόδιο για την ανώτερη ζωή. Και όταν θα χαίρεσαι, γιατί ξέπεσες στα μάτια των ανθρώπων, τότε θα γλυκαίνεσαι εσωτερικά από τον Γλυκύ Ιησού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καραμέλα του επαίνου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, άκουσα κάτι επαίνους καί...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, και τί έγινε; Τελείως κούφιο είσαι, βρέ παιδί; Εμάς τί πρέπει να μας ενδιαφέρη; Πώς μας βλέπουν οι άλλοι ή πώς μας βλέπει ο Χριστός; Οι άλλοι θα είναι για μας η κινητήρια δύναμη ή ο Χριστός; Εσύ έχεις σοβαρότητα· μη γίνεσαι ελαφρούτσικη. Εμένα πολλές φορές, ακόμη και σοβαροί άνθρωποι, μου λένε κάτι επαινετικό και μου έρχεται να κάνω εμετό. Γελώ από μέσα μου και το πετώ πέρα. Κι εσύ κάτι τέτοια να τα πετάς αμέσως. Είναι χαμένα πράγματα! Τί κερδίζουμε, αν μας καμαρώνουν οι άλλοι; Για να μας καμαρώνουν μεθαύριο τα ταγκαλάκια; Όποιος χαίρεται, όταν τον καμαρώνουν οι άνθρωποι, κοροϊδεύεται από τους δαίμονες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι έπαινοι, είτε κοσμικοί είναι είτε πνευματικοί, είτε στο σώμα αναφέρονται είτε στην ψυχή, βλάπτουν, όταν ο άνθρωπος είναι βλαμμένος, όταν δηλαδή έχη υπερηφάνεια ή προδιάθεση υπερηφανείας. Γι᾿ αυτό να προσέχουμε να μην επαινούμε εύκολα τον άλλον, γιατί, αν τυχόν είναι φιλάσθενος πνευματικά, παθαίνει ζημιά· μπορεί να καταστραφή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι έπαινοι είναι σαν τα ναρκωτικά. Κάποιος, ας υποθέσουμε, που ξεκινά να κάνη κηρύγματα, μπορεί την πρώτη φορά να ρωτήση αν το κήρυγμα ήταν καλό, αν πρέπη κάτι να προσέξη, για να μην κάνη κακό στον κόσμο. Οπότε και ο άλλος, για να τον ενθαρρύνη, του λέει: «Καλά τα είπες· μόνο σ᾿ εκείνο το σημείο ήθελε λίγο να προσέξης». Ύστερα όμως, αν έχη λίγη προδιάθεση υπερηφανείας, μπορεί να φθάση να ρωτάη αν ήταν καλό το κήρυγμα, μόνον και μόνο για να ακούση ότι ήταν καλό και να αισθανθή ικανοποίηση. Κι αν του πούν: «πολύ καλό ήταν», χαίρεται. «Ά, λένε καλά λόγια για μένα!», σκέφτεται και φουσκώνει. Αν όμως του πούν: «δέν ήταν καλό», στενοχωριέται. Βλέπετε πώς με μια καραμέλα επαίνου τον ξεγελάει το ταγκαλάκι; Στην αρχή ρωτάει με καλό λογισμό, για να διορθωθή, και μετά ρωτάει, για να ακούη επαίνους και να χαίρεται!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν χαίρεσθε και νιώθετε ικανοποίηση, όταν σάς επαινούν, και στενοχωριέσθε και κατεβάζετε τα μούτρα, όταν σάς κάνουν καμμιά παρατήρηση ή σάς πούν ότι μια δουλειά δεν την κάνατε καλά, να ξέρετε ότι αυτό είναι μια κοσμική κατάσταση. Και η στενοχώρια είναι κοσμική και η χαρά είναι κοσμική. Ένας που έχει πνευματική υγεία, και να του πής: «αυτό δεν το έκανες καλό», χαίρεται, γιατί τον βοήθησες να δη το λάθος του. Πιστεύει ότι δεν το έκανε καλό, γι᾿ αυτό τον φωτίζει ο Θεός και την επόμενη φορά το κάνει πολύ καλό. Αλλά και πάλι αυτό το αποδίδει στον Θεό. «Τί θα έκανα εγώ μόνος μου; λέει. Αν δεν με βοηθούσε ο Θεός, μπανταλομάρες θα έκανα». Όλα δηλαδή τα τοποθετεί σωστά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα μπορέσουμε, Γέροντα, να αισθανώμαστε το ίδιο, και όταν μας επαινούν και όταν μας προσβάλλουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν μισήσετε την κοσμική προβολή, τότε θα δέχεσθε με την ίδια διάθεση και τον έπαινο και την προσβολή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η κενοδοξία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, νιώθω μέσα μου ένα κενό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από την κενοδοξία είναι. Όταν επιδιώκουμε να ανεβαίνουμε στα μάτια των ανθρώπων, νιώθουμε μέσα μας κενό – τον καρπό της κενοδοξίας –, γιατί ο Χριστός δεν έρχεται στο κενό, αλλά στην καρδιά του καινού ανθρώπου. Δυστυχώς, πολλές φορές οι πνευματικοί άνθρωποι θέλουν την αρετή, αλλά θέλουν και κάτι που να τρέφη την υπερηφάνειά τους, δηλαδή αναγνώριση, πρωτεία κ.λπ., κι έτσι μένουν με ένα κενό στην ψυχή τους, το κενό της κενοδοξίας· δεν υπάρχει το πλήρωμα, το φτερούγισμα της καρδιάς. Και όσο μεγαλώνει η κενοδοξία τους, τόσο μεγαλώνει και το κενό μέσα τους και τόσο περισσότερο υποφέρουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, από που προέρχεται το ζόρισμα που νιώθω στον αγώνα μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν αγωνίζεσαι ταπεινά. Όποιος αγωνίζεται ταπεινά, δεν συναντά δυσκολία στον αγώνα του. Όταν όμως υπάρχουν πνευματικές επιδιώξεις ποτισμένες με κενοδοξία, τότε η ψυχή ζορίζεται. Τα άλλα πάθη δεν μας δυσκολεύουν τόσο πολύ στο πνευματικό ανέβασμα, όταν επικαλούμαστε ταπεινά το έλεος του Θεού. Όταν όμως μας κλέβη το ταγκαλάκι με την κενοδοξία, μας δένει τα μάτια και μας οδηγεί από το δικό του δύσβατο μονοπάτι και τότε ζοριζόμαστε, γιατί βρισκόμαστε σε ταγκαλίστικο χώρο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η πνευματική ζωή δεν είναι όπως η κοσμική ζωή. Εκεί, για να πάη, ας υποθέσουμε, καλά μια επιχείρηση, πρέπει να κάνη κανείς την τάδε διαφήμιση, να ρίξη αυτά τα φέιγ-βολάν, να κοιτάξη πώς να προβληθή. Στην πνευματική ζωή όμως, μόνον αν μισήση κανείς την κοσμική προβολή, πάει καλά η επιχείρηση η πνευματική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα διώξω τους λογισμούς κενοδοξίας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να χαίρεσαι με τα αντίθετα από αυτά που επιδιώκουν οι κοσμικοί. Μόνο με τα αντίθετα των κοσμικών επιδιώξεων θα μπορέσης να κινηθής στον πνευματικό χώρο. Στοργή θέλεις; Να χαίρεσαι, όταν δεν σού δίνουν σημασία. Ζητάς θρόνο; Κάθισε τον εαυτό σου στο σκαμνί. Ζητάς επαίνους; Αγάπησε την περιφρόνηση, για να νιώσης την αγάπη του Περιφρονημένου Ιησού. Ζητάς δόξα; Ζήτα ατιμία[33], για να νιώσης την δόξα του Θεού. Και όταν νιώσης την δόξα του Θεού, θα νιώθης τον εαυτό σου ευτυχισμένο και θα έχης μέσα σου την μεγαλύτερη χαρά από όλες τις χαρές όλου του κόσμου.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Οι συνέπειες της υπερηφανείας
- type: h2
  initial:
    ru: ''
  text:
    ru: Η υπερηφάνεια μας απομονώνει από τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βλέπω ότι δεν πάω καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βρήκες την αιτία; Την προηγούμενη φορά που είχα έρθει, είδα ότι, επειδή σκεφτόσουν σωστά και ενεργούσες με σύνεση, σε βοηθούσε και ο Χριστός. Μήπως τώρα υπερηφανεύθηκες γι᾿ αυτό, οπότε πήρε την Χάρη Του ο Χριστός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, Γέροντα, έτσι είναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν δεν καταλαβαίνουμε ότι προοδεύουμε με την βοήθεια του Θεού και νομίζουμε ότι τα καταφέρνουμε μόνοι μας και υπερηφανευώμαστε, παίρνει ο Θεός την Χάρη Του, για να καταλάβουμε ότι μόνον η θέληση και η προσπάθεια είναι δικά μας· η δύναμη και το αποτέλεσμα είναι του Θεού. Μόλις αναγνωρίσουμε ότι ο Θεός μας βοηθούσε και γι᾿ αυτό προοδεύαμε, ανοίγουν τα μάτια μας, ταπεινωνόμαστε, κλαίμε για την πτώση μας, μας λυπάται ο Θεός, μας ξαναδίνει την Χάρη Του και προχωρούμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ένας άνθρωπος υπερηφανευθή, η θεία Χάρις φεύγει αμέσως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φυσικά! Τί νομίζεις, χρειάσθηκαν ώρες για να γίνη ο Εωσφόρος από Άγγελος διάβολος; Μέσα σε δευτερόλεπτα έγινε. Λίγο ένας λογισμός αν περάση στον άνθρωπο ότι κάτι είναι, αμέσως φεύγει η Χάρις του Θεού. Γιατί τί δουλειά έχει η Χάρις του Θεού με την υπερηφάνεια; Ο Θεός είναι ταπείνωση. Και όταν φύγη η Χάρις του Θεού, έρχεται ο διάβολος και ζαλίζει τον άνθρωπο. Μπορεί μετά να δεχθή ο άνθρωπος μια επίδραση δαιμονική εξωτερική και να έχη μέσα του σκοτάδι πνευματικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο υπερήφανος δεν έχει Χάρη Θεού, γι᾿ αυτό υπάρχει κίνδυνος να πάρη – Θεός φυλάξοι! – τον μεγάλο κατήφορο. Είναι χωρισμένος από τον Θεό, γιατί η υπερηφάνεια είναι κακός αγωγός, μονωτικό, που δεν αφήνει την Χάρη του Θεού να περάση και μας απομονώνει από τον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όταν φέρνουμε υπερήφανο λογισμό, τα κάνουμε θάλασσα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είμαι πολύ απρόσεκτη· όλο ζημιές κάνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φαίνεται, θα υπάρχη μέσα σου κρυφή υπερηφάνεια. Επειδή ο Θεός σε αγαπάει, λειτουργούν οι πνευματικοί νόμοι[34]· κάνεις μια ζημιά και ταπεινώνεσαι. «Ο υψών εαυτόν ταπεινωθήσεται»[35].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, φοβάμαι να ξανασιδερώσω, γιατί έκαψα ένα ξένο ράσο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να κάνης τον σταυρό σου και να σιδερώνης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως ήταν του πειρασμού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σπάνια μια ζημιά είναι από φθόνο του διαβόλου· συνήθως είναι από υπερήφανο λογισμό. Όταν φέρνουμε υπερήφανο λογισμό, τα κάνουμε θάλασσα. Κι εσύ, φαίνεται, έφερες υπερήφανο λογισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί κάηκε το ράσο και δεν έπαθα εγώ ζημιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί το ράσο πήγε στον άλλον, έγινε γνωστή η ζημιά, οπότε έτσι ρεζιλεύτηκες και ταπεινώθηκες. Ενώ, αν πάθαινες εσύ κάτι, δεν θα ρεζιλευόσουν. Γιατί εξομολογείται κανείς; Για να θεατρινισθή η αμαρτία· έτσι σκάζει ο διάβολος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, πάη κάποιος να κάνη μια δουλειά και τελικά γίνεται ζημιά, τί συμβαίνει; Δεν δούλεψε σωστά; δεν είχε καθαρή διάθεση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι πολλές περιπτώσεις. Πρέπει να εξετάση από που ξεκίνησε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κάποιος να κάνη ζημιές από αφηρημάδα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί θα πη αφηρημάδα; Αν εξετάσης, θα δής ότι τις περισσότερες φορές οι ζημιές στην υπερηφάνεια οφείλονται. Αν σε μια νοικοκυρά περάση ο λογισμός ότι καμμιά άλλη δεν πλένει τα πιάτα τόσο καλά όσο αυτή, μπορεί να ρίξη όλο το ράφι με τα πιάτα και να σπάσουν όλα. Μια φορά κάποια που εργαζόταν σε ένα υαλοπωλείο σκέφθηκε: «Τί εύκολα κατεβάζω τα κουτιά με τα ποτήρια!». Μόλις έβαλε αυτόν τον λογισμό, της έφυγαν τα κουτιά από τα χέρια και έσπασαν όλα τα ποτήρια. Ή, ας πούμε, ένας οδηγός βλέπει ένα γεροντάκι ανήμπορο και το παίρνει να το πάη στον προορισμό του. Αν του περάση ο λογισμός: «γιά δές, άλλος θα το έκανε αυτό; τί καλά λόγια θα λέη τώρα το γεροντάκι για μένα!», θα τον εγκαταλείψη η Χάρις του Θεού και μπορεί να πέση πάνω σε καμμιά κολόνα ή να ανεβή πάνω στο πεζοδρόμιο, να χτυπήση και κανέναν!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο υπερήφανος δεν έχει πνευματικές πτήσεις αλλά πτώσεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υποχώρησαν τα δέκατα που είχα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χαίρομαι πολύ που υποχώρησαν – δόξα τω Θεώ –, γιατί πολύ σε ταλαιπωρούσαν. Πιστεύω ότι τώρα θα υποχωρήσουν και τα πνευματικά δέκατα, αν πιάσης την υπερηφάνεια από την οποία προέρχονται. Γιατί είναι αλήθεια ότι η υπερηφάνεια ανεβάζει όχι μόνο δέκατα πνευματικά αλλά και μεγάλο πυρετό πνευματικό. Ανάλογα με το ανέβασμα της υπερηφανείας είναι και το ανέβασμα του πνευματικού πυρετού, ο οποίος επιδρά και στο σώμα, και αρχίζει να ανεβαίνη και ο σωματικός πυρετός, επειδή η ψυχή και το σώμα συνεργάζονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η υπερηφάνεια είναι η μεγαλύτερη πνευματική αρρώστια. Σαν την βδέλλα πού, αν κολλήση επάνω σου, σού ρουφάει το αίμα, έτσι και η υπερηφάνεια ρουφάει όλο το εσωτερικό του ανθρώπου. Φέρνει και πνευματική ασφυξία, γιατί καταναλώνει όλο το πνευματικό οξυγόνο της ψυχής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω προσέξει πώς, μόλις βάλω μια σειρά στον αγώνα μου, γίνονται όλα...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φαίνεται, λές με τον λογισμό σου «καλά πάω», γι᾿ αυτό ύστερα έχεις πτώσεις. Ο υπερήφανος δεν έχει πνευματικές πτήσεις αλλά πτώσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ό,τι και να κάνω ή να πώ, βλέπω ότι με κεντά η υπερηφάνεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ό,τι κάνεις, να το κάνης με ταπεινό λογισμό, γιατί διαφορετικά βάζεις τον διάβολο ακόμη και στις καλές ενέργειές σου. Άν, ας υποθέσουμε, λέη κάποιος υπερήφανα: «θά πάω να κάνω μια καλωσύνη», βάζει και τον διάβολο μέσα και μπορεί να συναντήση ένα σωρό εμπόδια και τελικά να μην μπορέση να πάη. Ενώ, αν πάη αθόρυβα να κάνη μια καλωσύνη, τότε δεν μπαίνει ο διάβολος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς γίνεται, Γέροντα, η σωστή πνευματική εργασία στον εαυτό μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μυστικά και σιωπηλά. Η πνευματική εργασία είναι πολύ λεπτή και χρειάζεται πολλή προσοχή στην κάθε μας ενέργεια. Η πνευματική ζωή είναι «επιστήμη επιστημών»[36], λένε οι Άγιοι Πατέρες. Τί εγρήγορση χρειάζεται! Το ανέβασμα στην πνευματική ζωή είναι σαν το ανέβασμα σε μια κυκλική σκάλα που δεν έχει κάγκελα. Αν ανεβαίνη κανείς χωρίς να βλέπη που πατούν τα πόδια του και λέη: «ώ, πόσο ψηλά ανέβηκα! και που θα φθάσω ακόμη!», παραπατάει και πέφτει κάτω.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, δεν έχει κάγκελα η σκάλα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί είναι ελεύθερος ο άνθρωπος και πρέπει να χρησιμοποιή το μυαλό που του έδωσε ο Θεός. Αν δεν το χρησιμοποιή σωστά, τί να τον κάνη ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί μια κατάσταση πνευματικής ξηρασίας να έχη αιτία την υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αν υπάρχη υπερηφάνεια, ο Θεός επιτρέπει να μένη ο άνθρωπος σε μια κατάσταση οκνηρίας, ακηδίας και ψυχρότητος, γιατί, αν τον βοηθήση και γευθή κάτι ουράνιο, τότε ένα κι ένα θα το πάρη επάνω του, θα νομίζη ότι αυτό οφείλεται στον αγώνα που έκανε και θα υπερηφανεύεται: «Αγωνισθήτε! θα λέη μετά και στους άλλους. Εγώ αγωνίσθηκα και τί αξιώθηκα να ζήσω!», και έτσι θα πληγώνη ψυχές. Γι᾿ αυτό ο Θεός τον αφήνει να χτυπηθή, όσο χρειάζεται, για να πεθάνη η ιδέα που έχει για τον εαυτό του, να απελπισθή με την καλή έννοια από τον εαυτό του και να νιώση το «χωρίς εμού ου δύνασθε ποιείν ουδέν»[37].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η υπερηφάνεια γελοιοποιεί τον άνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι αυτό που μας κάνει να θέλουμε να γίνη γνωστό στους άλλους ό,τι καλό κάνουμε, ενώ έχει τόση γλυκύτητα, τόση απαλάδα, το να ζη και να εργάζεται κανείς στην αφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το πιο σπουδαίο είναι ότι, όταν ο άνθρωπος έχη εσωτερικότητα και προσπαθή να μη γίνεται γνωστό το καλό που κάνει, αυτό είναι αισθητό στους άλλους· όλοι τον ευλαβούνται και τον αγαπούν, χωρίς ο ίδιος να το καταλαβαίνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσο συμπαθής είναι ο ταπεινός άνθρωπος και πόσο αποκρουστικός ο υπερήφανος! Τον υπερήφανο κανείς δεν τον αγαπάει, ακόμη και ο Θεός τον αποστρέφεται. Βλέπεις, και τα μικρά παιδιά, αν δούν κανένα παιδί λίγο υπερήφανο, το κοροϊδεύουν, ενώ ένα παιδί σιωπηλό, συνετό, πόσο το εκτιμούν! Ή, αν δούν κανέναν να περπατάη καμαρωτός-καμαρωτός, τον παίρνουν μυρωδιά και τον κοροϊδεύουν. Θυμάμαι κάποιον στην Κόνιτσα πού, ενώ πέθαινε από την πείνα, φορούσε κάθε μέρα κοστούμι, γραβάτα και ρεπούμπλικο και έβγαινε στην πλατεία καμαρωτός. Τα παιδάκια, μόλις τον έβλεπαν, πήγαιναν από πίσω του και παρίσταναν πώς περπατούσε. Μικρούτσικα παιδάκια τώρα! Πόσο μάλλον οι μεγάλοι καταλαβαίνουν τον υπερήφανο άνθρωπο! Μη βλέπης που δεν μιλούν, για να μην τον εκθέσουν· από μέσα τους όμως αηδιάζουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος θέλει να προβάλλη τον εαυτό του, τελικά γελοιοποιείται. Θυμάμαι, όταν ήμουν στο Σινά[38], είχε έρθει ένας παπάς που τον έλεγαν Σάββα. Ήταν λίγο κενόδοξος, είχε και μεγάλη ιδέα για τον εαυτό του. Μια μέρα οι Βεδουΐνοι ανέβαζαν στο μοναστήρι ένα βαρύ πράγμα με το βίντσι καί, καθώς το σήκωναν, φώναζαν, για να συγχρονισθούν, «σάουα-σάουα», δηλαδή «όλοι μαζί». Τους άκουσε ο παπα–Σάββας κι έτρεξε αμέσως έξω. «Βρέ, ακόμη δεν ήρθα, λέει, και «Σάββα» φωνάζουν! Και εδώ όλοι με έμαθαν!». Νόμιζε ότι οι Βεδουΐνοι φώναζαν «Σάββα, Σάββα»! Μόλις το άκουσα, με έπιασαν τα γέλια! Είναι να μη γελάσης; Όπως δουλεύει το μυαλό του ανθρώπου, έτσι τα ερμηνεύει όλα... Άμα ο άνθρωπος είναι λίγο φαντασμένος, όλα φαντασμένα τα ερμηνεύει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, από υπερηφάνεια το κάνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Είναι αιχμάλωτος στην κενοδοξία, τον κλέβει και η φαντασία και φθάνει μετά... Μου έλεγε ένας μοναχός πώς, όταν ήταν λαϊκός, είχε δώσει σε κάποιον ένα επίσημο επανωφόρι. Μια μέρα που βρέθηκαν μαζί σε μια συντροφιά, εκείνος το φορούσε, οπότε κάποια στιγμή λέει: «Αυτό το παλτό ξέρετε από που το έχω; Από το Παρίσι! Αν ξέρατε και πόσο το αγόρασα!». Και να είναι εκεί μπροστά και ο άλλος που του έδωσε το επανωφόρι ευλογία!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά, Γέροντα, ανόητος ήταν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά πιο ανόητος από τον υπερήφανο υπάρχει; Τελικά η υπερηφάνεια γελοιοποιεί τον άνθρωπο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4– Να χτυπήσουμε την υπερηφάνεια
- type: h2
  initial:
    ru: ''
  text:
    ru: Να είσαι μέσα στην μάχη, και να πολεμάς σωστά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, μου λέει ο λογισμός ότι, αν αλλάξω διακόνημα και σταματήσω να ψάλλω και να αγιογραφώ, θα σταματήσω να υπερηφανεύωμαι και να πέφτω συνέχεια σε πειρασμούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και να φύγης από την ψαλτική ή την αγιογραφία, εάν δεν σιχαθής την κενοδοξία, θα κάνης περισσότερες γκάφες. Αλλά και η φυγή αυτή πάλι έχει μέσα υπερηφάνεια, και μάλιστα περισσότερη, γιατί στην πραγματικότητα θέλεις να φύγης από τα διακονήματα αυτά, για να μη θίγεται ο εγωισμός σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, κάνω μια δουλειά και δώ ότι υπερηφανεύομαι, μήπως είναι καλύτερα να μην την κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν σού πούν να πάς να κάνης μια δουλειά, να πάς, αλλά να προσέχης να μην πέσης· και αν γλιστρήσης και πέσης, να σηκωθής. Να καταλάβης ότι γλίστρησες, επειδή δεν πρόσεξες, και άλλη φορά, αν σού πούν να ξαναπάς, να προσέχης να μην ξαναγλιστρήσης. Όχι να μην ξαναπάς, επειδή την προηγούμενη φορά έπεσες! Άλλο αν σού πούν: «Μήν πηγαίνης, αφού την προηγούμενη φορά έπεσες». Τότε δεν θα ξαναπάς. Κατάλαβες; Άμα σού λένε να κάνης μια δουλειά, να την κάνης, αλλά να προσπαθής να την κάνης σωστά και ταπεινά. Το να μην κάνης τίποτε, για να μην υπερηφανευθής, αυτό είναι χειρότερο. Είναι σαν να μένης έξω από την μάχη, να μην πολεμάς, για να μην πληγωθής. Σκοπός είναι να είσαι μέσα στην μάχη, αλλά να προσέχης να πολεμάς σωστά· διαφορετικά θα είσαι ένα άχρηστο πράγμα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Την υπερηφάνεια την τσακίζεις με την βοήθεια του αδελφού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στενοχωριέμαι, όταν οι αδελφές μου κάνουν κάποια παρατήρηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχεις υπερηφάνεια, γι᾿ αυτό στενοχωριέσαι. Την υπερηφάνεια την τσακίζεις με την βοήθεια του αδελφού, όταν του δίνης το δικαίωμα να σού κάνη παρατηρήσεις και δέχεσαι μια κουβέντα που θα σού πή. Έτσι λαμπικάρεται η ψυχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Επειδή το υψηλό φρόνημα δύσκολα το αντιλαμβάνεται κανείς μόνος του, πρέπει να δέχεται τους άλλους σαν γιατρούς του και να παίρνη όλα τα φάρμακα που του δίνουν, για να απαλλαγή από αυτό. Και όλοι οι άνθρωποι έχουν στην τσέπη τους φάρμακα για τους άλλους: οι μεν καλοί συμβουλεύουν με πόνο και αγάπη τον άρρωστο, οι δε κακοί τον ελέγχουν με κακία και πάθος – αυτοί μάλιστα πολλές φορές γίνονται καλύτεροι χειρουργοί από τους πρώτους, γιατί προχωρούν το νυστέρι πιο βαθιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ, Γέροντα, είμαι κουτή και πολλές φορές δεν καταλαβαίνω γιατί μου κάνουν παρατήρηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καλύτερα πές: «Είμαι τετραπέρατη, αλλά δεν έχω ταπείνωση». Εσύ, ενώ σφάλλεις και σού κάνουν παρατήρηση, πάς να δικαιολογηθής. Πώς να φθάσης σε κατάσταση να παίρνης επάνω σου το σφάλμα, όταν δεν σφάλλης και σε κατηγορούν; Ο άνθρωπος που δικαιολογεί τον εαυτό του, όταν του κάνουν μια παρατήρηση, εξοντώνει συνέχεια την ταπείνωση. Ενώ ο άνθρωπος που ρίχνει όλο το βάρος επάνω του για κάποιο σφάλμα του, ταπεινώνεται και τον λούζει η Χάρις του Θεού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ νομίζω ότι δεν προσπαθώ να αποδείξω ότι έχω δίκαιο, αλλά να εξηγήσω ότι πρόκειται για παρεξήγηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχω δει ότι έχεις μια κρυφή υπερηφάνεια που εκδηλώνεται με την δικαιολογία. Να προσπαθήσης να μη δικαιολογήσαι, ό,τι κι αν σού πούν· να βάζης μια ειλικρινή μετάνοια· αυτό φθάνει. Με το «ευλόγησον»[39]της ειλικρινούς μετανοίας κόβεται η υπερηφάνεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, σήμερα ένα παιδάκι στο αρχονταρίκι έκανε μια αταξία. Του έλεγε η μητέρα του: «πές συγγνώμη», και αυτό απαντούσε: «τά κόκκαλά μου πονάνε», και «συγγνώμη» δεν έλεγε. Γιατί μερικοί άνθρωποι δυσκολεύονται τόσο πολύ να πούν «ευλόγησον»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η υπερηφάνεια δεν αφήνει τον άνθρωπο να πη «ευλόγησον».
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική ...διάσπαση του ατόμου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα φύγη η μεγάλη ιδέα που έχω για τον εαυτό μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν στραφής μέσα σου και γνωρίσης τον εαυτό σου, θα δής τόση ασχήμια, που θα σιχαθής τον εαυτό σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν ο άνθρωπος δεν γνωρίση τον εαυτό του για να ταπεινωθή φυσιολογικά, η ταπείνωση δεν μπορεί να του γίνη κατάσταση, για να παραμένη μέσα του η θεία Χάρις. Τότε είναι σε θέση ο διάβολος να του φάη όλα τα χρόνια της ζωής του – ακόμη και τα χρόνια του Μαθουσάλα να του δώση ο Θεός –, παίζοντας το παιχνίδι της κολοκυθιάς. Δηλαδή μια θα του φέρνη ο διάβολος τον λογισμό ότι κάτι είναι, μια θα φέρνη αυτός έναν ταπεινό λογισμό ότι δεν είναι τίποτε· μια ο διάβολος, μια ο άνθρωπος, μια θα κερδίζη ο ένας μια ο άλλος, και θα συνεχίζεται το ίδιο βιολί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βλέπω, Γέροντα, ότι όλες οι αδελφές με έχουν ξεπεράσει στην αρετή, ακόμη και οι νεώτερες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αφού δεν ταπεινώθηκες μόνη σου, ταπεινώθηκες από τους άλλους. Ξέρεις τί κάνουν, όταν θέλουν να στείλουν έναν πύραυλο στο διάστημα; Μετρούν κατεβαίνοντας από τους μεγάλους αριθμούς στους μικρούς: «δέκα, εννιά, οκτώ, επτά..., ένα, μηδέν!». Μόλις φθάσουν στο μηδέν, εκτοξεύεται. Έτσι κι εσύ, τώρα που έφθασες στο μηδέν, θα εκτοξευθής και θα πάς ψηλά. Εσύ φυσική δεν σπούδασες;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τώρα λοιπόν είναι καιρός να μάθης και την φυσική της μεταφυσικής, για να γνωρίσης πώς θα γίνη η πνευματική διάσπαση του ατόμου σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα γίνη, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ασχοληθής με το «άτομό σου» και γνωρίσης τον εαυτό σου, θα ταπεινωθής και τότε θα γίνη η πνευματική διάσπαση του ατόμου σου, θα βγή η πνευματική ενέργεια και θα πεταχτής στο ...διάστημα. Μόνον έτσι θα μπορέσης να μπής στην πνευματική τροχιά· διαφορετικά θα παραμένης στην κοσμική τροχιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σε τίποτε δεν ωφελεί να ερευνήση κανείς όλον τον κόσμο, αν δεν έχη ερευνήσει τον δικό του κόσμο. Αν γνωρίση πρώτα τον εσωτερικό του κόσμο, δηλαδή τον εαυτό του, το άτομό του, εύκολα μετά γνωρίζει όχι μόνον την γη αλλά και το διάστημα. Όταν ο άνθρωπος γνωρίση το άτομό του, τότε γίνεται αυτομάτως και η διάσπαση του ατόμου του και κινείται πλέον στην πνευματική τροχιά έξω από την έλξη της γής, έξω από την έλξη του κόσμου. Ενώ ζη στην γη ως άνθρωπος, ζη δίχως να τον έλκη η αμαρτία και γενικά οι επιθυμίες του κόσμου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, παραμένη η υπερηφάνεια, δεν έχει κάνει ο άνθρωπος σωστή αναγνώριση του εαυτού του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, δεν έγινε ακόμη η πνευματική διάσπαση του ατόμου του. Κατάλαβες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, πάλι στην ταπείνωση γυρίζουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά βέβαια! Ο άνθρωπος που έχει υπερηφάνεια δεν έχει γνωρίσει τον εαυτό του. Αν γνωρίση τον εαυτό του, θα φύγη η υπερηφάνεια. Η αναγνώριση είναι το πάν. Λείπει η αναγνώριση, γι᾿ αυτό λείπει η ταπείνωση. Και όταν ο άνθρωπος αναγνωρίζη ταπεινά τον εαυτό του, αναγνωρίζεται και από τους ανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κι άν, Γέροντα, υπάρχη αναγνώριση και δεν υπάρχη ταπείνωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε δεν θα υπάρχη καλή διάθεση, φιλότιμο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Υψηλή θέση και ταπεινό φρόνημα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σ᾿ εμένα, Γέροντα, υπάρχει υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, υπάρχει και λίγη υπερηφάνεια. Τουλάχιστον να έχουμε την κανονική υπερηφάνεια, όση προβλέπει ο νόμος...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Υπάρχει, Γέροντα, και «κανονική» υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε να σού πώ: Αν κάποιος έχη ικανότητες, γνώσεις κ.λπ., και να υπερηφανευθή λίγο, έχει ελαφρυντικά. Όχι βέβαια πώς είναι καλή και αυτή η υπερηφάνεια, αλλά δικαιολογείται κατά κάποιον τρόπο. Ένας όμως που δεν έχει ούτε ικανότητες ούτε γνώσεις, δεν δικαιολογείται να υπερηφανεύεται· επιβάλλεται να είναι ταπεινός. Αν υπερηφανεύεται, είναι τελείως χαμένος. Βλέπεις, μια νοσοκόμα που κάνει μια ένεση πενικιλίνης στον άρρωστο και του πέφτει ο πυρετός, μπορεί να έχη υπερήφανο λογισμό, ενώ ο Φλέμινγκ που ανακάλυψε την πενικιλίνη και βοήθησε τόσον κόσμο, πόση ταπείνωση είχε! Ο Φλέμινγκ μετά την ανακάλυψη της πενικιλίνης είχε πάει στην Αμερική. Εκεί τον χειροκροτούσαν οι άλλοι, χειροκροτούσε και αυτός. Κάποια στιγμή ρώτησε: «Τί συμβαίνει; για ποιόν χειροκροτούν;». «Για σένα χειροκροτούν», του είπαν. Τάχασε! Δεν είχε καταλάβει για ποιόν χειροκροτούσαν! Θέλω να πώ, εκείνος που βρήκε την πενικιλίνη δεν υπερηφανεύτηκε, και η νοσοκόμα που κάνει την ένεση και πέφτει ο πυρετός καμαρώνει. Γι᾿ αυτό ο Μέγας Βασίλειος λέει: «Το σπουδαιότερο είναι να έχη ο άνθρωπος υψηλή θέση και ταπεινό φρόνημα»[40]. Αυτό έχει μεγάλη αξία και ανταμείβεται από τον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπω την ταπείνωση που έχουν μεγάλοι αξιωματικοί και την υπερηφάνεια που έχουν απλοί χωροφύλακες. Είχε έρθει μια φορά στο Καλύβι ένας υπονωματάρχης με έναν αέρα και έλεγε-έλεγε... «Είμαι αστυφύλακας, είμαι εκείνο, είμαι το άλλο!». Διοικητής της Χωροφυλακής να ήταν, δεν θα μιλούσε έτσι. Φοβερό! Και άλλοι με πλούτη, με θέσεις, με ικανότητες, έχουν μια ταπείνωση, μια απλότητα! Νιώθουν σαν να μην έχουν τίποτε. Μεγάλοι αξιωματικοί δεν φοράνε την στολή τους, για να αποφύγουν τις τιμές. Θυμάμαι, ένας στρατηγός, που είχε πολλά παράσημα από τον πόλεμο, όταν ήταν να πάη για παρέλαση, έλεγε: «Θα φορτωθώ τώρα τα παράσημα...». Και ένας άλλος μόνον ένα γαλόνι είχε πάρει και φορούσε συνέχεια την στολή, για να το δείχνη. Είχε βάλει και πιο φαρδύ σειρίτι – μέχρις εκεί που να μην τον κλείσουν μέσα, γιατί υπάρχει κανονισμός πόσο φαρδύ να είναι το σειρίτι. Καημένοι άνθρωποι!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, όταν έχη κάποιος ταπεινή θέση και υπερηφανεύεται, τί δείχνει; ότι είναι ανόητος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μια φορά; Πολλές φορές!
- type: h2
  initial:
    ru: ''
  text:
    ru: Μήν κάνης δικό σου ό,τι σού έδωσε ο Θεός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπερηφανεύομαι για τις σωματικές ικανότητες και για τα πνευματικά χαρίσματα που νομίζω πώς έχω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί να υπερηφανεύεσαι; Εσύ «εποίησας τον ουρανόν και την γήν»[41]; Πρόσεξε, μην κάνης δικό σου ό,τι σού έδωσε ο Θεός καί, ό,τι σού λείπει, μην προσπαθής να δείχνης ότι το έχεις. Να λές στον εαυτό σου: «Ο Θεός, επειδή ήμουν αδύνατη, μου έδωσε μερικά χαρίσματα, γιατί αλλιώς θα στεναχωριόμουν και θα ήμουν κακορρίζικη. Εκείνο που πρέπει να κάνω τώρα είναι να τα αξιοποιήσω, για να πλουτήσω πνευματικά. Δόξα σοι, Θεέ μου! Σ᾿ ευχαριστώ, που με λυπήθηκες και με βοήθησες». Εσύ θεωρείς ότι είναι δικά σου όλα τα χαρίσματα που έχεις· είναι όμως δικά σου; «Τί έχεις ό ουκ έλαβες;»[42]. Εδώ χρειάζεται η εξυπνάδα, εδώ πρέπει να δουλέψης το μυαλό και να καταλάβης ότι όλα τα χαρίσματα είναι του Θεού. Λίγο αν μας εγκαταλείψη η Χάρις του Θεού, τίποτε δεν θα μπορούμε να κάνουμε. Είναι απλά τα πράγματα. Έχει, ας υποθέσουμε, κάποιος μερικές ικανότητες και υπερηφανεύεται γι᾿ αυτές. Πρέπει να σκεφθή: Που τις βρήκε; Του τις έδωσε ο Θεός. Αυτός τί έκανε; Τίποτε. Δίνει λ.χ. ο Θεός σε κάποιον λίγο παραπάνω μυαλό και μπορεί να έχη μια μεγάλη επιχείρηση και να ζη άνετα. Να υπερηφανευθή ότι τα καταφέρνει; Λίγο να τον εγκαταλείψη ο Θεός, μπορεί να χρεωκοπήση και να πάη φυλακή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πάντως, όποιος έχει χαρίσματα, αλλά δεν έχει ταπείνωση και πληγώνει με την προκλητική συμπεριφορά του τον πλησίον του, αναγκάζει τον Χριστό να πάρη το κατσαβιδάκι και να του λασκάρη λίγο την βίδα, για να ταπεινωθή ακουσίως. Ας υποθέσουμε, κάποιος θέλει να βγάλη έναν βράχο και παιδεύεται, γιατί δεν έχει πολύ μυαλό, ώστε να βρη έναν τρόπο να τον μετακινήση. Οπότε τον πλησιάζει ένας άλλος που είναι λίγο έξυπνος και του λέει: «Βρέ χαμένε, δεν σού κόβει;». Παίρνει αμέσως έναν λοστό, τον κάνει μοχλό και βγάζει εύκολα τον βράχο. Έ, αφού φέρεται έτσι, δεν είναι δίκαιο να πάρη το κατσαβίδι ο Θεός και να του λασκάρη λίγο το μυαλό; Μερικοί που είναι μεγάλοι ρήτορες παθαίνουν μεγάλες διαλείψεις και φθάνουν σε σημείο να μην μπορούν ούτε μια λέξη να πούν! Έτσι ταπεινώνονται. Αν άφηνε ο Θεός κάποιον συνέχεια ρήτορα–ρήτορα κι εκείνος υπερηφανευόταν, τί θα γινόταν; Τον καθέναν ο Θεός τον φρενάρει με κάποιον τρόπο, για να μην πάθη ζημιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πρέπει πολύ να προσέξουμε τα χαρίσματα που μας έδωσε ο Θεός να μην τα οικειοποιούμαστε, αλλά να ευχαριστούμε τον Θεό και να έχουμε την ανησυχία μην τυχόν δεν ανταποκρινόμαστε σ᾿ αυτά. Συγχρόνως να πονάμε για τους άλλους που δεν αξιώθηκαν να λάβουν τέτοια χαρίσματα από τον Θεό και να προσευχώμαστε γι᾿ αυτούς. Και όταν βλέπουμε έναν άνθρωπο να υστερή σε κάτι, να λέμε με τον λογισμό μας: «Εάν αυτός είχε τα χαρίσματα που έδωσε σ᾿ εμένα ο Θεός, θα ήταν τώρα άγιος, ενώ εγώ δεν τα αξιοποίησα, και επιπλέον αδικώ τον Θεό κάνοντας δικά μου τα χαρίσματα που μου έδωσε». Ο Θεός βέβαια δεν στενοχωριέται, όταν ο άνθρωπος οικειοποιήται τα χαρίσματα που του δίνει· δεν μπορεί όμως να του δώση άλλα, για να μην τον βλάψη. Ενώ, αν κάποιος κινήται απλά και ταπεινά, γιατί αναγνωρίζει ότι τα χαρίσματα που έχει είναι του Θεού, τότε ο Θεός θα του δώση και άλλα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με την υπερηφάνεια κάνουμε τον εαυτό μας δυστυχισμένο, επειδή τον απογυμνώνουμε από τα χαρίσματα που μας δίνει ο Θεός, αλλά στενοχωρούμε και τον Θεό, που πονάει, γιατί μας βλέπει δυστυχισμένους. Γιατί, ενώ έχει άφθονα πλούτη να μας δωρίση, δεν μας τα δίνει, για να μη μας βλάψη. Γιατί τί γίνεται; Αν μας δώση κάποιο χάρισμα, βλέπουμε τους άλλους σαν μυρμήγκια και τους πληγώνουμε με την υπερήφανη συμπεριφορά μας. Αν δεν μας δώση, απελπιζόμαστε. Οπότε και ο Θεός λέει: «Αν τους δώσω κάποιο χάρισμα, υπερηφανεύονται, βλάπτουν τον εαυτό τους και στους άλλους φέρονται με αναίδεια. Αν δεν τους δώσω, είναι ταλαίπωροι, βασανισμένοι. Κι εγώ δεν ξέρω τί να κάνω».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να ευχαριστούμε τον Θεό όχι μόνο για τα χαρίσματα που μας έχει δώσει, αλλά και για το ότι μας έχει κάνει ανθρώπους, ενώ Νοικοκύρης είναι και μπορούσε να μας κάνη και φίδια και σκορπιούς και χελώνες και μουλαράκια και γαϊδουράκια. «Ο Θεός, να λέμε, μπορούσε να με κάνη μουλάρι και να έπεφτα σε αδιάκριτα χέρια και να με φόρτωναν εκατόν πενήντα κιλά βάρος και να με χτυπούσαν, αλλά δεν με έκανε. Μπορούσε να με κάνη φίδι ή σκορπιό, αλλά δεν με έκανε. Μπορούσε να με κάνη χελώνα, γουρούνι, βάτραχο, κουνούπι, μύγα κ.λπ., αλλά δεν με έκανε. Τί με έκανε; Με έκανε άνθρωπο. Εγώ έχω ανταποκριθή σε όσα μου έδωσε; Όχι». Αν ο άνθρωπος δεν εξετάζη τα πράγματα με αυτόν τον τρόπο, ενώ φαίνεται στους ανθρώπους δίκαιος, είναι ο μεγαλύτερος άδικος του κόσμου, γιατί δεν αδικεί ανθρώπους, αλλά τον Θεό, που του έδωσε τόσα χαρίσματα. Όταν όμως τα εξετάζη με αυτόν τον τρόπο, ακόμη κι αν φθάση σε πνευματικά μέτρα και κάνη χιλιάδες θαύματα την ημέρα, πάλι δεν θα του πη ο λογισμός ότι κάτι κάνει, γιατί όλα τα αποδίδει στον Θεό και αυτός ελέγχεται συνέχεια μήπως δεν έχει ανταποκριθή σε όσα του έδωσε ο Θεός. Και τότε αρχίζει από αυτήν την ζωή η μία Χάρις να διαδέχεται την άλλη και η άλλη την άλλη, και έτσι γίνεται χαριτωμένος άνθρωπος, επειδή η ταπείνωση του έγινε πλέον κατάσταση. Και όταν τα αποδίδη όλα στον Θεό και γίνη ευγνώμων δούλος του Θεού, θα ακούση στην άλλη ζωή το «εύ, δούλε αγαθέ και πιστέ!επί ολίγα ής πιστός, επί πολλών σε καταστήσω»[43].
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Τρίτο Μέρος – Κατάκριση: Η Μεγάλη Αδικία'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Μόνον ο Θεός κρίνει δίκαια, γιατί μόνον
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτός γνωρίζει τις καρδιές των ανθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εμείς, επειδή δεν ξέρουμε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν δίκαιη κρίση του Θεού,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: κρίνουμε «κατ᾿ όψιν», εξωτερικά,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί γι᾿ αυτό πέφτουμε έξω και αδικούμε τον άλλον».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – «Μη κρίνετε, ίνα μη κριθήτε»[44]
- type: h2
  initial:
    ru: ''
  text:
    ru: Η κατάκριση είναι γεμάτη από αδικία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εύκολα κρίνω και κατακρίνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η κρίση που έχεις, είναι, φυσικά, χάρισμα που σού έδωσε ο Θεός, αλλά την εκμεταλλεύεται το ταγκαλάκι και σε κάνει να κατακρίνης και να αμαρτάνης. Γι᾿ αυτό, μέχρι να εξαγνισθή η κρίση σου και να έρθη ο θείος φωτισμός, να μην την εμπιστεύεσαι. Όταν κανείς ασχολήται με τους άλλους και τους κρίνη, ενώ ακόμη δεν έχει εξαγνισθή η κρίση του, πέφτει συνέχεια στην κατάκριση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς, Γέροντα, θα εξαγνισθή η κρίση μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει να την λαμπικάρης. Μπορεί να έχης καλή διάθεση και μια δύναμη μέσα σου, αλλά πιστεύεις ότι κρίνεις πάντοτε σωστά. Η κρίση σου όμως είναι ανθρώπινη, κοσμική. Προσπάθησε να απαλλαγής από το ανθρώπινο στοιχείο, να αποκτήσης ανιδιοτέλεια, για να έρθη ο θείος φωτισμός και να γίνη η κρίση σου πνευματική, θεϊκή. Τότε η κρίση σου θα είναι σύμφωνη με την δικαιοσύνη του Θεού και όχι με την ανθρώπινη δικαιοσύνη· με την αγάπη και την ευσπλαχνία του Θεού και όχι με την λογική την ανθρώπινη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μόνον ο Θεός κρίνει δίκαια, γιατί μόνον Αυτός γνωρίζει τις καρδιές των ανθρώπων. Εμείς, επειδή δεν ξέρουμε την δίκαιη κρίση του Θεού, κρίνουμε «κατ᾿ όψιν»[45], εξωτερικά, και γι᾿ αυτό πέφτουμε έξω και αδικούμε τον άλλον. Η ανθρώπινη κρίση μας δηλαδή είναι μια μεγάλη αδικία. Είδες τί είπε ο Χριστός: «Μη κρίνετε κατ᾿ όψιν, αλλά την δικαίαν κρίσιν κρίνατε»[46].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θέλει πολλή προσοχή· ποτέ δεν μπορούμε να γνωρίζουμε πώς ακριβώς έχουν τα πράγματα. Πριν από χρόνια σε ένα μοναστήρι στο Άγιον Όρος ήταν ένας πολύ ευλαβής διάκος. Κάποτε όμως φόρεσε ρούχα κοσμικά και γύρισε στην πατρίδα του. Τότε πολλοί Πατέρες είπαν διάφορα εναντίον του. Αλλά τί είχε γίνει; Κάποιος του είχε γράψει ότι οι αδελφές του ήταν ακόμη ατακτοποίητες καί, επειδή φοβήθηκε μήπως παραστρατήσουν, πήγε να τις βοηθήση. Έπιασε δουλειά σε ένα εργοστάσιο και ζούσε πιο καλογερικά από ό,τι προηγουμένως. Μόλις τακτοποίησε τις αδελφές του, άφησε την δουλειά του και πήγε πάλι σε μοναστήρι, για να μείνη. Ο ηγούμενος, όταν είδε ότι τα ήξερε όλα, τυπικό, διακονήματα κ.λπ., τον ρώτησε που τα έμαθε και εκείνος άνοιξε την καρδιά του και του τα είπε όλα. Τότε ο ηγούμενος ενημέρωσε τον επίσκοπο, και εκείνος τον χειροτόνησε αμέσως ιερέα. Μετά πήγε σε ένα απομακρυσμένο μοναστήρι και εκεί ζούσε πολύ πνευματική ζωή, με πολλή άσκηση. Έφθασε σε αγία κατάσταση και βοήθησε πνευματικά πολλούς ανθρώπους. Μερικοί που δεν ξέρουν τί απέγινε μπορεί ακόμη να τον κατακρίνουν[47].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσο πρέπει να προσέχουμε την κατάκριση! Πόσο αδικούμε τον πλησίον μας, όταν τον κατακρίνουμε! Αν και στην πραγματικότητα με την κατάκριση αδικούμε τον εαυτό μας και όχι τους άλλους, διότι μας αποστρέφεται ο Θεός. Τίποτε άλλο δεν αποστρέφεται τόσο πολύ ο Θεός όσο την κατάκριση, γιατί ο Θεός είναι δίκαιος και η κατάκριση είναι γεμάτη από αδικία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πώς φθάνουμε στην κατάκριση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πέφτω συχνά στην κατάκριση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Επειδή ασχολείσαι πολύ με τους άλλους. Περιεργάζεσαι τις αδελφές και θέλεις από περιέργεια να μαθαίνης τί κάνει η μιά, τί κάνει η άλλη· έτσι μαζεύεις υλικό, για να έχη το ταγκαλάκι να εργάζεται και να σε ρίχνη στην κατάκριση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, ενώ πρώτα δεν έβλεπα τα ελαττώματα των άλλων, τώρα τα βλέπω και κατακρίνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τώρα βλέπεις τα ελαττώματα των άλλων, γιατί δεν βλέπεις τα δικά σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από που προέρχονται, Γέροντα, οι λογισμοί κατακρίσεως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από την ιδέα που έχουμε για τον εαυτό μας – δηλαδή από την υπερηφάνεια – και από την τάση να δικαιολογούμε τον εαυτό μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η κατάκριση έχει έλλειψη αγάπης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, τί έχει; Και έλλειψη αγάπης έχει και αναίδεια έχει. Όταν δεν έχης αγάπη, δεν βλέπεις με επιείκεια τα λάθη των άλλων, οπότε τους ταπεινώνεις μέσα σου και τους κατακρίνεις. Πάει μετά το ταγκαλάκι και τους βάζει να κάνουν και άλλο σφάλμα· το βλέπεις εσύ, τους κατακρίνεις πάλι και ύστερα συμπεριφέρεσαι με αναίδεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές, Γέροντα, με στενοχωρεί η αδελφή με την οποία συνεργάζομαι και την κατακρίνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Που ξέρεις εσύ με πόσα ταγκαλάκια πολεμάει εκείνη την ώρα η αδελφή; Μπορεί να την πολεμούσαν πενήντα δαίμονες, για να την ρίξουν, ώστε να σε κάνουν να πής: «Ά, τέτοια είναι». Ύστερα, όταν δούν ότι την κατέκρινες, θα έρθουν πεντακόσιοι δαίμονες να την ρίξουν πάλι μπροστά σου, για να την κατακρίνης ακόμη περισσότερο. Μπορεί λ.χ. να της πής: «Αδελφή, μη βάζης αυτό το πράγμα εκεί· εδώ είναι η θέση του». Την άλλη μέρα θα την κάνη το ταγκαλάκι να ξεχάση τί της είπες και να το βάλη πάλι στην ίδια θέση. Θα κάνη και καμμιά άλλη αταξία και θα λές με τον λογισμό σου: «Μά χθές της είπα να προσέξη και σήμερα το έβαλε πάλι εκεί! Έκανε κι άλλη αταξία!». Οπότε την κατακρίνεις και δεν μπορείς να συγκρατηθής και να μη μιλήσης. «Αδελφή, της λές, δεν σού είπα να μη το βάζης εκεί; Αυτό είναι ακαταστασία. Με έχει σκανδαλίσει η συμπεριφορά σου!». Αυτό ήταν! Ο διάβολος έκανε την δουλειά του. Σε έβαλε να την κατακρίνης, αλλά και να ψυχρανθής μαζί της. Και εκείνη, επειδή δεν ξέρει ότι εσύ ήσουν αιτία για την απροσεξία της, θα νιώθη τύψεις που σε σκανδάλισε και θα πέση σε λύπη. Βλέπετε με τί πονηριά εργάζεται το ταγκαλάκι κι εμείς το ακούμε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό προσπαθήστε να μην κρίνετε κανέναν· να κρίνετε μόνον τα ταγκαλάκια πού, ενώ ήταν Άγγελοι, κατήντησαν δαίμονες καί, αντί να μετανοήσουν, γίνονται πιο πονηροί και κακοί και βάλθηκαν με μανία να καταστρέψουν τα πλάσματα του Θεού. Ο πονηρός δηλαδή παρακινεί τους ανθρώπους να κάνουν παραξενιές και αταξίες, και ο ίδιος πάλι βάζει λογισμούς σε άλλους ανθρώπους, για να κρίνουν και να κατακρίνουν, και έτσι νικάει και τους μεν και τους δέ. Και αυτοί μεν που νικούνται και κάνουν αταξίες, αισθάνονται μετά την ενοχή τους και μετανοούν, ενώ οι άλλοι που κατακρίνουν δικαιώνουν τον εαυτό τους, υπερηφανεύονται και καταλήγουν στην ίδια πτώση με τον πονηρό, την υπερηφάνεια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την κατάκριση φεύγει η Χάρις του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, μου περνάη ένας λογισμός εις βάρος του άλλου, είναι πάντοτε κατάκριση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν το καταλαβαίνεις εκείνη την ώρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές αργώ να το καταλάβω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε να καταλαβαίνης το συντομώτερο την πτώση σου και να ζητάς συγχώρηση και από την αδελφή την οποία κατέκρινες και από τον Θεό, γιατί αυτό γίνεται εμπόδιο στην προσευχή. Με την κατάκριση φεύγει αυτομάτως η Χάρις του Θεού και δημιουργείται αμέσως ψυχρότητα στην επικοινωνία σου με τον Θεό. Πώς να κάνης μετά προσευχή; Η καρδιά γίνεται πάγος, μάρμαρο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η κατάκριση και η καταλαλιά είναι οι μεγαλύτερες αμαρτίες και απομακρύνουν την Χάρη του Θεού περισσότερο από κάθε άλλο αμάρτημα. «Όπως το νερό σβήνει την φωτιά, λέει ο Άγιος Ιωάννης της Κλίμακος, έτσι και η κατάκριση σβήνει την Χάρη του Θεού»[48].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νυστάζω πολύ στην πρωινή Ακολουθία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως κατέκρινες καμμιά αδελφή; Εσύ βλέπεις εξωτερικά τα πράγματα και κατακρίνεις, γι᾿ αυτό νυστάζεις μετά στην Ακολουθία. Από την στιγμή δηλαδή που κατακρίνει κανείς και δεν αντιμετωπίζει τα πράγματα πνευματικά, μαζεύονται δέκατα πνευματικά και αποδυναμώνεται. Και όταν αποδυναμωθή, ή νυστάζει ή έχει αυπνία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνά πέφτω και στην γαστριμαργία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, εκείνο που τώρα πρέπει να προσέξης πολύ είναι η κατάκριση. Αν δεν κόψης την κατάκριση, ούτε από την γαστριμαργία θα μπορέσης να απαλλαγής. Ο άνθρωπος που κατακρίνει, επειδή διώχνει την Χάρη του Θεού, μένει αβοήθητος και δεν μπορεί να κόψη τα ελαττώματά του. Και αν δεν καταλάβη το σφάλμα του, για να ταπεινωθή, θα έχη συνέχεια πτώσεις. Αν όμως το καταλάβη και ζητήση την βοήθεια του Θεού, τότε ξαναέρχεται η Χάρις του Θεού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος κατακρίνει τους άλλους, πέφτει στα ίδια σφάλματα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς συμβαίνει, όταν κατακρίνω μια αδελφή για κάποιο σφάλμα της, σε λίγο να κάνω κι εγώ το ίδιο σφάλμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν κατακρίνη κανείς τον άλλον για ένα σφάλμα του και δεν καταλάβη την πτώση του, ώστε να μετανοήση, συνήθως πέφτει στο ίδιο σφάλμα, για να το καταλάβη. Ο Θεός δηλαδή από αγάπη επιτρέπει να αντιγράφη ο άνθρωπος την κατάσταση αυτού τον οποίο κατέκρινε. Αν πής λ.χ. ότι κάποιος είναι πλεονέκτης και δεν καταλάβης ότι κατέκρινες, ο Θεός παίρνει την Χάρη Του και επιτρέπει να πέσης κι εσύ στην πλεονεξία· αρχίζεις τότε να μαζεύης. Μέχρι να καταλάβης την πτώση σου και να ζητήσης συγχώρεση από τον Θεό, θα λειτουργούν οι πνευματικοί νόμοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Για να σε βοηθήσω, θα σού πω κάτι από τον εαυτό μου. Όταν ήμουν στην Ιερά Μονή Στομίου, έμαθα για μια συμμαθήτριά μου από το Δημοτικό ότι είχε παραστρατήσει και έκανε ζημιά κάτω στην Κόνιτσα. Προσευχόμουν λοιπόν να την φωτίση ο Θεός να ανεβή στο μοναστήρι, για να της μιλήσω. Είχα ξεχωρίσει και μερικά κομμάτια περί μετανοίας από την Αγία Γραφή και από Πατερικά. Μια μέρα λοιπόν ήρθε με δυο άλλες γυναίκες. Μιλήσαμε και έδειξε ότι κατάλαβε. Στην συνέχεια ερχόταν συχνά με το παιδί της και έφερνε κεριά, λάδι, λιβάνι για τον ναό. Μια φορά κάποιοι γνωστοί προσκυνητές από την Κόνιτσα μου λένε: «Πάτερ, αυτή η γυναίκα υποκρίνεται. Εδώ φέρνει κεριά και λιβάνι και κάτω συνεχίζει με τους αξιωματικούς». Όταν ξαναήρθε, την βρήκα στην εκκλησία να ασπάζεται τις εικόνες, και της έβαλα τις φωνές: «Φύγε από ᾿δώ, της είπα, έχεις βρωμίσει όλη την περιοχή!...». Η καημένη έφυγε κλαίγοντας. Δεν πέρασε πολλή ώρα και αισθάνθηκα μεγάλο σαρκικό πόλεμο. «Τί είναι αυτό; λέω. Ποτέ μου δεν είχα τέτοιον πειρασμό. Τί συμβαίνει;». Δεν μπορούσα να βρώ την αιτία. Κάνω προσευχή, τα ίδια· οπότε παίρνω τον ανήφορο για την Γκαμήλα[49]. «Καλύτερα να με φάνε οι αρκούδες», είπα. Προχώρησα αρκετά μέσα στο βουνό· ο πειρασμός δεν υποχωρούσε. Βγάζω τότε ένα τσεκουράκι που είχα κρεμασμένο στην μέση μου και δίνω τρεις τσεκουριές στο πόδι μου, μήπως και με τον πόνο φύγη ο πειρασμός. Το παπούτσι γέμισε αίμα, αλλά τίποτε. Σε μια στιγμή ήρθε στον νού μου εκείνη η γυναίκα και τα λόγια που της είχα πεί. «Θεέ μου, είπα τότε, εγώ για λίγο έζησα αυτήν την κόλαση και δεν μπορώ να την αντέξω, κι αυτή η ταλαίπωρη που ζη συνέχεια αυτήν την κόλαση!... Συγχώρεσέ με που την κατέκρινα». Αμέσως ένιωσα μια δροσιά θεϊκή και εξαφανίσθηκε ο πόλεμος. Βλέπεις τί κάνει η κατάκριση[50];'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αν παραβλέπουμε τα σφάλματα των άλλων, θα παραβλέψη και ο Θεός τα δικά μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σήμερα στην διαλογή των ελιών κατέκρινα μερικές αδελφές, γιατί έβλεπα ότι δεν έκαναν προσεκτικά την δουλειά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε να αφήσης τις κρίσεις και τις κατακρίσεις, γιατί μετά θα σε κρίνη κι εσένα ο Θεός. Εσύ δεν βάζεις καμμιά ελιά λίγο χαλασμένη με τις καλές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, Γέροντα, προσέχω να μη βάζω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν μας κάνη τέτοιο καλό διάλεγμα ο Χριστός στην Κρίση, χαθήκαμε! Ενώ, αν τώρα παραβλέπουμε τα σφάλματα των άλλων και δεν τους κατακρίνουμε, θα μπορούμε τότε να πούμε στον Χριστό: «Χριστέ μου, βάλε με κι εμένα σε καμμιά άκρη μέσα στον Παράδεισο!». Θυμάστε τί γράφει το Γεροντικό για έναν αμελή μοναχό που σώθηκε, επειδή δεν κατέκρινε; Όταν ήρθε η ώρα να πεθάνη, ήταν πολύ χαρούμενος και ειρηνικός. Τότε ο Γέροντάς του, για να ωφεληθούν οι Πατέρες που είχαν μαζευτή από τα γύρω Κελλιά, τον ρώτησε: «Αδελφέ, πώς δεν φοβάσαι τον θάνατο, αφού έζησες με αμέλεια;». Και ο αδελφός του απάντησε: «Είναι αλήθεια ότι έζησα με αμέλεια· από τότε όμως που έγινα μοναχός προσπάθησα να μην κατακρίνω κανέναν, οπότε τώρα θα πω στον Χριστό: Χριστέ μου, είμαι ένας ταλαίπωρος, αλλά τουλάχιστον την εντολή Σου «μή κρίνετε, ίνα μη κριθήτε"[51], την τήρησα». «Μακάριος είσαι, αδελφέ, του είπε τότε ο Γέροντας, γιατί σώθηκες χωρίς κόπο»[52].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μερικοί πνευματικοί άνθρωποι, όταν βλέπουν κάποιον να ζη αμαρτωλά, λένε: «Ά, αυτός, έτσι που πάει, είναι για την κόλαση!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άχ, αν οι κοσμικοί άνθρωποι θα πάνε στην κόλαση από τις καταχρήσεις, οι πνευματικοί άνθρωποι θα πάνε από τις κατακρίσεις... Για κανέναν δεν μπορούμε να πούμε ότι θα πάη στην κόλαση. Ο Θεός δεν ξέρουμε πώς εργάζεται. Τα κρίματα του Θεού είναι άβυσσος. Κανέναν να μην καταδικάζουμε, γιατί έτσι παίρνουμε την κρίση από τα χέρια του Θεού· πάμε να γίνουμε θεοί. Αν μας ρωτήση ο Χριστός την ημέρα της Κρίσεως, ας πούμε την γνώμη μας...
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Ο αγώνας κατά της κατακρίσεως
- type: h2
  initial:
    ru: ''
  text:
    ru: Αν στραφούμε στον εαυτό μας, δεν θα κατακρίνουμε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν βλέπω κάποια αταξία στο διακόνημα, κατακρίνω μέσα μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ, να κοιτάς την ευταξία την δική σου και όχι τις αταξίες των άλλων. Να είσαι αυστηρή με τον εαυτό σου και όχι με τους άλλους. Τί δουλειά έκανες σήμερα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξεσκόνιζα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξεσκόνιζες τους άλλους ή τον εαυτό σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δυστυχώς τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε, θα αρχίσης να κάνης δουλειά στον εαυτό σου, όταν πάψης να ασχολήσαι με το τί κάνουν οι άλλοι γύρω σου. Αν ασχολήσαι με τον εαυτό σου και πάψης να ασχολήσαι με τους άλλους, θα βλέπης μόνον τα δικά σου σφάλματα και στους άλλους δεν θα βρίσκης κανένα σφάλμα. Τότε θα απελπισθής με την καλή έννοια από τον εαυτό σου και θα κατακρίνης μόνον τον εαυτό σου. Θα αισθάνεσαι την αμαρτωλότητά σου και θα αγωνίζεσαι να απαλλαγής από τις αδυναμίες σου. Ύστερα, όταν θα βλέπης στους άλλους κάποια αδυναμία, θα λές: «Μήπως εγώ ξεπέρασα τις αδυναμίες μου; Πώς λοιπόν έχω τέτοια απαίτηση από τους άλλους;». Γι᾿ αυτό να μελετάς και να παρακολουθής συνέχεια τον εαυτό σου, για να αποφεύγης την κρυφή υπερηφάνεια, και να έχης αυτομεμψία με διάκριση, για να αποφεύγης την εσωτερική κατάκριση· έτσι θα διορθωθής.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ισαάκ γράφει: «Εάν αγαπάς την καθαρότητα, εισελθών έργασαι εν τη αμπέλω της καρδίας σου, εκρίζωσον εκ της ψυχής σου τα πάθη, έργασαι μη γνώναι κακίαν ανθρώπου»[53]. Τί εννοεί;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εννοεί να στραφής στον εαυτό σου και να κάνης δουλειά στον εαυτό σου. Οι Άγιοι πώς αγίασαν; Είχαν στραφή στον εαυτό τους και έβλεπαν μόνον τα δικά τους πάθη. Με την αυτοκριτική και την αυτομεμψία που είχαν, έπεσαν τα λέπια από τα μάτια της ψυχής τους και έφθασαν να βλέπουν καθαρά και βαθιά. Έβλεπαν τον εαυτό τους κάτω από όλους τους ανθρώπους και όλους τους θεωρούσαν καλύτερους από τον εαυτό τους. Τα δικά τους σφάλματα τα έβλεπαν μεγάλα και τα σφάλματα των άλλων πολύ μικρά, γιατί έβλεπαν με τα μάτια της ψυχής τους και όχι με τα γήινα μάτια. Έτσι εξηγείται όταν έλεγαν: «Εγώ είμαι χειρότερος από όλους τους ανθρώπους». Τα μάτια της ψυχής τους είχαν καθαρίσει και είχαν γίνει διόπτρες, γι᾿ αυτό και έβλεπαν τα μικρά τους σφάλματα – τα ξυλαράκια – σαν δοκάρια. Εμείς όμως, ενώ τα σφάλματά μας είναι δοκάρια, δεν τα βλέπουμε ή τα βλέπουμε σαν ξυλαράκια[54]. Κοιτάμε τους άλλους με το μικροσκόπιο και βλέπουμε τα δικά τους αμαρτήματα μεγάλα, ενώ τα δικά μας δεν τα βλέπουμε, γιατί δεν καθάρισαν τα μάτια της ψυχής μας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η βάση είναι να καθαρίσουν τα μάτια της ψυχής. Όταν ο Χριστός ρώτησε τον τυφλό: «πώς βλέπεις τώρα τους ανθρώπους;», εκείνος Του απάντησε: «σάν δένδρα»[55]γιατί δεν είχε αποκατασταθή όλο το φως του. Όταν αποκαταστάθηκε όλο το φως του, τότε έβλεπε καθαρά. Θέλω να πω ότι ο άνθρωπος, όταν φθάση σε καλή πνευματική κατάσταση, όλα τα βλέπει καθαρά, όλα τα σφάλματα των άλλων τα δικαιολογεί, με την καλή έννοια, γιατί τα βλέπει με το θεϊκό μάτι και όχι με το ανθρώπινο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αν δικαιολογούμε τους άλλους, δεν θα τους κατακρίνουμε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μου περνούν λογισμοί υπερηφανείας και κατακρίσεως, προσπαθώ να δικαιολογώ τους άλλους. Αυτό είναι πτώση ή αγώνας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αγώνας είναι. Όταν κάποιος χαζεύη με ανοιχτό το στόμα και μπή μια μύγα στο στόμα του, θα την φτύση. Αλλά καλύτερα είναι να προσέχη να μην μπή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συχνά όμως, Γέροντα, βλέποντας τί κάνουν οι άλλοι τους κατακρίνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εδώ που τα λέμε, δεν μπορείς να μη βλέπης τί γίνεται γύρω σου. Πρέπει όμως να αποκτήσης διάκριση, ώστε να δίνης στους άλλους ελαφρυντικά και να τους δικαιολογής. Τότε θα τους βλέπης σε καλή κατάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, την ώρα της Ακολουθίας έχω λογισμούς γιατί μια αδελφή δεν έρχεται στο αναλόγιο να ψάλη, γιατί μια άλλη ψάλλει σιγανά, και συνέχεια κατακρίνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, καλά, γιατί δεν σκέφτεσαι ότι η αδελφή ίσως είναι κουρασμένη ή είχε έναν πόνο και δεν μπόρεσε να κοιμηθή, και γι᾿ αυτό δεν ψάλλει; Ξέρω αδελφές πού, και άρρωστες να είναι και να μην μπορούν να σύρουν τα πόδια τους από τον πυρετό, θα αγωνισθούν να μη γίνη αυτό αντιληπτό, για να μην τις πούν να φύγουν από το διακόνημα και πάη άλλη αδελφή στην θέση τους και δυσκολευθή. Αυτό δεν σε συγκινεί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με συγκινεί, Γέροντα, αλλά δεν καταφέρνω πάντα να δικαιολογήσω μια αδελφή, όταν φέρεται άσχημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκέφθηκες ποτέ ότι η αδελφή μπορεί να φέρεται άσχημα, για να κρύψη την αρετή της; Εγώ γνωρίζω ανθρώπους που κάνουν επίτηδες αταξίες και τους κακολογούν όσοι δεν ασχολούνται με τον εαυτό τους. Ή μπορεί κάποια αδελφή να φερθή άσχημα, επειδή είναι κουρασμένη, αλλά αμέσως μετανοιώνει· εσύ την κατακρίνεις, ενώ εκείνη έχει ήδη μετανοιώσει για την άσχημη συμπεριφορά της. Στα μάτια των ανθρώπων είναι ταπεινωμένη, στα μάτια όμως του Θεού είναι ψηλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω μια στενότητα· δεν έρχομαι στην θέση του άλλου, για να τον δικαιολογήσω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να βλέπης με πόνο τον άλλον που σφάλλει και να δοξάζης τον Θεό για όσα σού έχει δώσει, γιατί μετά ο Θεός θα σού πή: «Εγώ, παιδί μου, τόσα σού έδωσα, κι εσύ γιατί μου φέρθηκες σκληρά;». Να βλέπης πλατιά τα πράγματα. Να σκέφτεσαι το παρελθόν του ανθρώπου, τις ευκαιρίες που του δόθηκαν να καλλιεργήση τον εαυτό του και τις ευκαιρίες που είχες εσύ και δεν τις αξιοποίησες. Έτσι θα συγκινηθής από τις δωρεές που σού χάρισε ο Θεός, θα Τον δοξολογήσης γι᾿ αυτές και θα ταπεινωθής, επειδή δεν ανταποκρίθηκες. Παράλληλα θα νιώσης αγάπη και πόνο για τον αδελφό που δεν είχε τις δικές σου ευκαιρίες και θα κάνης γι᾿ αυτόν καρδιακή προσευχή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Υπάρχουν άνθρωποι που κάνουν εγκλήματα μεγάλα, αλλά έχουν πολλά ελαφρυντικά. Ποιός ξέρει οι άνθρωποι αυτοί πώς είναι στα μάτια του Θεού; Εάν δεν μας βοηθούσε ο Θεός, μπορεί κι εμείς να ήμασταν αλήτες. Κάποιος εγκληματίας έκανε λ.χ. είκοσι εγκλήματα και τον κατακρίνω και δεν σκέφτομαι τί παρελθόν έχει. Ποιός ξέρει πόσα εγκλήματα μπορεί να έκανε ο πατέρας του!... Από μικρό παιδί τί κλοπές θα τον έβαζαν να κάνη! Ύστερα, όταν ήταν νέος, πόσα χρόνια θα έζησε μέσα στις φυλακές και θα καθοδηγήθηκε από άλλους έμπειρους φυλακισμένους. Αυτός θα μπορούσε να είχε κάνει όχι είκοσι αλλά σαράντα εγκλήματα και συγκρατήθηκε. Ενώ εγώ με την κληρονομικότητα και με την αγωγή που είχα, θα έπρεπε τώρα να έκανα θαύματα. Έκανα; Όχι. Άρα είμαι αναπολόγητος. Αλλά, ακόμη και είκοσι θαύματα αν έκανα, ενώ μπορούσα να κάνω σαράντα, πάλι θα ήμουν αναπολόγητος. Με αυτούς τους λογισμούς διώχνουμε την κατάκριση και ανοίγουμε μία ρωγμή στην σκληρή καρδιά μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να μη βγάζουμε εύκολα συμπεράσματα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θα με βοηθήση να μην κατακρίνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όλα είναι πάντοτε έτσι όπως τα σκέφτεσαι εσύ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έ, τότε να λές: «Δεν σκέφτομαι πάντοτε σωστά· πολλές φορές κάνω λάθος. Νά, στην τάδε περίπτωση σκέφθηκα έτσι και βγήκε ότι είχα άδικο. Στην τάδε περίπτωση έκρινα και έπεσα έξω, οπότε τον αδίκησα τον άλλον. Επομένως δεν πρέπει να ακούω τον λογισμό μου». Ο καθένας μας λίγο–πολύ έχει περιπτώσεις που έπεσε έξω στην κρίση του. Αν φέρη στον νού του τις περιπτώσεις που έκρινε και έπεσε έξω, τότε θα αποφεύγη την κατάκριση. Αλλά και μια φορά να μην έπεσε έξω και να είχε δίκαιο, που ξέρει τα ελατήρια του άλλου; Ξέρει πώς έγινε κάτι; Να μη βγάζουμε εύκολα συμπεράσματα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κι εγώ, όταν ήμουν νέος, είχα την κατάκριση ψωμοτύρι. Επειδή ζούσα λίγο προσεκτικά και είχα μια ψευτοευλάβεια, ό,τι μου φαινόταν στραβό, το έκρινα. Γιατί, όταν στον κόσμο ζη κανείς λίγο πνευματικά, μπορεί να βλέπη πολλά κουσούρια στους άλλους και να μη βλέπη αρετές. Εκείνους που καλλιεργούν την αρετή μπορεί να μη τους βλέπει, γιατί ζουν στην αφάνεια, αλλά να βλέπη τους άλλους που κάνουν αταξίες και να τους κατακρίνη. «Αυτός, λέει, κάνει έτσι, εκείνος περπατάει έτσι, ο άλλος κοιτάζει έτσι...».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ξέρετε τί είχα πάθει μια φορά; Είχαμε πάει με έναν γνωστό μου να λειτουργηθούμε σε ένα μοναστήρι στο Μονοδένδρι, εννιά ώρες περίπου μακριά από την Κόνιτσα. Όταν μπήκαμε στον ναό, ο γνωστός μου στάθηκε στο αναλόγιο, για να ψάλη, και εγώ πήγα στο στασίδι πίσω από τον ψάλτη· παρακολουθούσα κι έψελνα σιγανά. Κάποια στιγμή ήρθε μια γυναίκα με μαύρα, σχετικά νέα, στάθηκε δίπλα μου και συνέχεια με κοιτούσε. Με κοιτούσε, έκανε τον σταυρό της· με κοιτούσε, έκανε τον σταυρό της... Είχα αγανακτήσει. «Βρέ, παιδάκι μου, έλεγα μέσα μου, τί σόι άνθρωπος είναι αυτή; Μέσα στον κόσμο, μέσα στην εκκλησία, τί κοιτάζει έτσι;». Εγώ τις αδελφές μου, όταν περνούσαν στον δρόμο δίπλα μου, δεν τις έβλεπα. Πήγαιναν μετά στο σπίτι και έκαναν παράπονα στην μάνα μας: «Με είδε ο Αρσένιος[56], έλεγαν, και δεν μου μίλησε!». «Καλά, μου έλεγε μετά η μητέρα μου, βλέπεις τις αδελφές σου στον δρόμο και δεν τις μιλάς;». «Εγώ θα κοιτάζω αν αυτή που περνάει δίπλα μου είναι η αδελφή μου; της έλεγα. Ένα σωρό σόι έχουμε[57]. Αυτό θα κάνω;». Θέλω να πώ, είχα κάτι τέτοιες ακρότητες. Να περνά τώρα δίπλα σου η αδελφή σου και να μην της μιλάς! Τέλος πάντων... Μόλις λοιπόν τελείωσε η Θεία Λειτουργία, πήγε αυτή η μαυροφόρα και παρακάλεσε τον ιερέα να μου πη να πάω στο σπίτι της, γιατί έμοιαζα πολύ με το παιδί της που είχε σκοτωθή στον πόλεμο! Όταν πήγα στο σπίτι της, είδα την φωτογραφία του παιδιού της· πραγματικά, μοιάζαμε σαν αδέλφια! Αυτή η καημένη με κοιτούσε μέσα στην εκκλησία και έκανε τον σταυρό της σαν να έβλεπε το παιδί της. Κι εγώ έλεγα: «Την αθεόφοβη, μέσα στην εκκλησία πώς κοιτάζει!». Ώ, μετά ξέρετε πώς με είχε λειώσει αυτό το περιστατικό; «Για δές, είπα, εσύ να έχης τέτοιους λογισμούς, ότι ποιός ξέρει τί γυναίκα είναι και μέσ᾿ στην εκκλησία να μη ντρέπεται καθόλου..., και αυτή η φουκαριάρα να έχη χάσει το παιδί της και να έχη τον καημό της!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια άλλη φορά κατέκρινα τον αδελφό μου που ήταν φαντάρος. Μου έστειλε μήνυμα ο σιτιστής: «Έδωσα στον αδελφό σου δύο μπετόνια με λάδι· τί έγιναν τα μπετόνια;». «Μά, αυτός εκεί πέρα, είπα, έφερνε στο σπίτι τους στρατιώτες και τους φιλοξενούσαμε, τώρα πώς τόκανε αυτό, να πάρη λάδι από τον στρατό;». Οπότε πιάνω και γράφω στον αδελφό μου αγανακτισμένος ένα γράμμα... Κι εκείνος μου απαντάει: «Τα μπετόνια να τα ζητήσης από την νεωκόρο της κάτω εκκλησίας»! Αυτός το λάδι το είχε στείλει στην εκκλησία της κάτω Κόνιτσας, γιατί ήταν φτωχή. «Χρόνια πολλά, είπα τότε στον εαυτό μου. Την άλλη φορά κατέκρινες εκείνη την φουκαριάρα· τώρα τον αδελφό σου. Άλλη φορά τίποτε-τίποτε!». Θέλω να πώ, όταν είδα ότι έπεφτα έξω στις κρίσεις μου, εξέταζα τον εαυτό μου: «Στην τάδε περίπτωση είχα πει για τον άλλον ότι ενήργησε έτσι, αλλά τα πράγματα ήταν διαφορετικά. Άλλη φορά άλλο συμπέρασμα είχα βγάλει κι αλλιώς ήταν». Έτσι έβαλα τον εαυτό μου στην θέση του. «Άλλη φορά, είπα, δεν θα κρίνης καθόλου. Τελεία-παύλα! Είσαι στραβός και όλα στραβά και ανάποδα τα βλέπεις. Κοίταξε να γίνης σωστός άνθρωπος». Και μετά, όταν μου φαινόταν κάτι στραβό, έλεγα: «Κάτι καλό θα είναι, αλλά εγώ δεν το καταλαβαίνω· όσες φορές έβαλα αριστερό λογισμό, έπεσα έξω». Όταν πλέον σιχάθηκα τον εαυτό μου, με την καλή έννοια, όλους τους δικαιολογούσα· για τους άλλους έβρισκα πάντα ελαφρυντικά και μόνον τον εαυτό μου κατέκρινα. Αλλά, εάν ο άνθρωπος δεν παρακολουθή τον εαυτό του, όλα τα περνάει απαρατήρητα και μετά στην Κρίση θα είναι αναπολόγητος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θέλει παλληκαριά, για να κοπή η κατάκριση[58].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Λοιπόν:'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλή Αρχή. STOP.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: STOP των κριτικών λογισμών. Αμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλή εξάγνιση του νού και της καρδιάς. Αμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τέταρτο Μέρος – Παιδιά Της Φιλαυτίας Και Της Υπερηφανείας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ζήλεια-Θυμός-Λύπη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Όταν ο άνθρωπος φθάση να χαίρεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιά την πρόοδο των άλλων,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τότε ο Χριστός θα του δώση όλη την πρόοδο των άλλων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί θα χαίρεται όσο χαίρονται όλοι οι άλλοι,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί τότε φυσικά θα είναι πολλή και η πρόοδός του και η χαρά του».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Το δηλητήριο της ζήλειας
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ζήλεια είναι από τα μεγαλύτερα πάθη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ζηλεύω μια αδελφή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρω ποιά αδελφή ζηλεύεις... Έμαθα όμως ότι κι εκείνη ζηλεύει εσένα! Εγώ θα εύχωμαι και οι δυο σας να ζηλεύετε τον ζηλωτή Ηλία και εκείνος να σάς διώξη την ζήλεια και να σάς δώση από τον δικό του θείο ζήλο. Αμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, ζηλεύω, προσπαθώ να τοποθετηθώ λογικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν εξ αρχής προσπαθήσης να μη ζηλέψης, δεν είναι πιο καλά; Η ζήλεια είναι γελοίο πράγμα. Λίγη σκέψη χρειάζεται, για να ξεπεράση την ζήλεια κανείς· δεν χρειάζεται να κάνη μεγάλους αγώνες και πολλή άσκηση, γιατί είναι ψυχικό πάθος. Πρόσεξε, μην αφήσης ποτέ το πάθος της ζήλειας να σε κυριέψη, γιατί είναι ένα από τα μεγαλύτερα πάθη. Ξέρεις από την ζήλεια που μπορεί να φθάση ο άνθρωπος; Στον φθόνο και στην διαβολή. Και οι διαβολές κάνουν πολύ μεγαλύτερο κακό από τον φθόνο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί έχει μέσα η ζήλεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τί δεν έχει!... Υπερηφάνεια έχει, εγωισμό έχει, φιλαυτία έχει... Δεν έχει αγάπη ούτε φυσικά και ταπείνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, αν κανείς ζηλεύη, αποκλείεται να έχη αγάπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και βέβαια αποκλείεται! Δεν είναι δυνατόν ένας άνθρωπος να έχη συγχρόνως ζήλεια και αγάπη. Κι αν ακόμη έχη λίγη αγάπη, η αγάπη του δεν είναι καθαρή, γιατί μέσα στην αγάπη του είναι ο εαυτός του. Η ζήλεια μουρνταρεύει την αγάπη και την καλωσύνη, όπως το ψόφιο ποντίκι μουρνταρεύει όλο το λάδι, όταν πέση μέσα στο πιθάρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ νομίζω ότι ζηλεύω, επειδή μέσα μου δεν νιώθω γεμάτη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να νιώθης γεμάτη, όταν τα θέλης όλα δικά σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν όμως επιθυμώ κάτι που δίνεται σε μια άλλη αδελφή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αφού ο Θεός είπε: «ουκ επιθυμήσεις όσα τω πλησίον σού εστι»[59], πώς να επιθυμήσουμε κάτι που έχει ο άλλος; Ούτε τις βασικές εντολές να μην τηρήσουμε; Μετά η ζωή μας γίνεται κόλαση. «Έκαστος πειράζεται υπό της ιδίας επιθυμίας»[60], λέει ο Άγιος Ιάκωβος ο Αδελφόθεος. Αυτές οι επιθυμίες θα βασανίζουν τις ψυχές και στην κόλαση. Κι αν μας πάρη ο Θεός στον Παράδεισο, χωρίς να έχουμε απαλλαγή από την ζήλεια, και εκεί δεν θα βρούμε ανάπαυση, γιατί θα έχουμε τις ίδιες παράλογες επιθυμίες.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ζήλεια δηλητηριάζει την πολλή αγάπη της γυναίκας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί το πάθος της ζήλειας υπάρχει στις γυναίκες σε μεγαλύτερο βαθμό από ό,τι στους άνδρες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Επειδή η γυναίκα έχει από την φύση της πολλή καλωσύνη και αγάπη, ο διάβολος πολύ την πολεμάει· της πετάει την φαρμακερή ζήλεια και της δηλητηριάζει την αγάπη. Και όταν η αγάπη της δηλητηριασθή και γίνη κακότητα, τότε η γυναίκα από μέλισσα γίνεται σφήκα και ξεπερνά την σκληρότητα του άνδρα. Και βλέπεις, ενώ για τον άνδρα είναι αρκετό να φύγη ένα ανεπιθύμητο πρόσωπο από κοντά του, για να μην το βλέπουν τα μάτια του, η γυναίκα, που την έχει πλάσει ο Θεός με σπλάχνα, δεν αρκείται στο να εξαφανισθή το πρόσωπο που ζηλεύει και να μην το βλέπουν τα μάτια της, αλλά θα ήθελε να πεθάνη. Δηλαδή ...σίγουρες δουλειές!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εμένα φοβήθηκε το μάτι μου από την κακία, η οποία, όταν μπή μέσα της η ζήλεια και το πείσμα, μπορεί να φθάση σε δαιμονικό βαθμό. Ούτε τον Θεό υπολογίζουν μετά οι άνθρωποι· γίνονται ταγκαλάκια σωστά. Και τους άλλους βασανίζουν και οι ίδιοι βασανίζονται και αιώνια θα βασανίζωνται – Θεός φυλάξοι –, αν δεν διώξουν την ζήλεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η γυναίκα πρέπει να προσέχη πολύ την ζήλεια. Επιβάλλεται να βγάλη τον εαυτό της από την αγάπη της, για να μείνη καθαρή η πολλή αγάπη που έχει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα γίνη αυτό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν ξεπεράση τις μικρότητες και καλλιεργήση την πνευματική λεβεντιά και την πνευματική αρχοντιά, την θυσία. Η αρχοντιά είναι το αντίδοτο της ζήλειας. Αλλά δυστυχώς λίγοι έχουν αρχοντιά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ζήλεια μας αποδυναμώνει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν έχω καθόλου κουράγιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ζηλεύεις, γι᾿ αυτό δεν έχεις κουράγιο. Όταν ζηλεύη κανείς, στενοχωριέται, δεν μπορεί να φάη, οπότε αδυνατίζει και χάνει το κουράγιο του· και οι άλλοι μπορεί να νομίζουν πώς είναι μεγάλος ασκητής!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αισθάνομαι πολύ φτωχή πνευματικά και αδύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ έχεις πολλές δυνάμεις, αλλά τις χαραμίζεις με την χαζή ζήλεια καί, ενώ είσαι ένα αρχοντόπουλο, βασανίζεσαι σαν κακόμοιρο γυφτάκι. Θα είχες προχωρήσει πολύ στην πνευματική ζωή, αν δεν σκάλωνες στην ζήλεια. Πρόσεξε, γιατί η ζήλεια σού ρουφάει όλες τις ψυχικές και σωματικές σου δυνάμεις, που θα μπορούσες να τις προσφέρης θυσία στον Θεό. Εάν έδιωχνες την ζήλεια, και η προσευχή σου θα είχε δύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με την ζήλεια αποδυναμώνεται κανείς πνευματικά. Γιατί, νομίζετε, οι Απόστολοι δεν μπόρεσαν να βγάλουν το δαιμόνιο από το δαιμονισμένο παιδί[61], ενώ είχαν λάβει αυτήν την εξουσία από τον Χριστό και είχαν βγάλει άλλα δαιμόνια; Επειδή ζήλεψαν, που ο Χριστός πήρε στην Μεταμόρφωση μόνον τους τρεις Μαθητές, τον Πέτρο, τον Ιάκωβο και τον Ιωάννη[62]. Μπορούσε ο Χριστός να πάρη όλους τους Μαθητές, αλλά δεν ήταν όλοι σε κατάσταση να χωρέσουν αυτό το μυστήριο, γι᾿ αυτό πήρε αυτούς που μπορούσαν να το χωρέσουν. Λέτε να μην αγαπούσε τους άλλους Μαθητές; Ή μήπως αγαπούσε τον Ιωάννη περισσότερο από τους άλλους; Όχι, αλλά ο Ιωάννης αγαπούσε περισσότερο από τους άλλους Μαθητές τον Χριστό και γι᾿ αυτό καταλάβαινε την αγάπη του Χριστού καλύτερα. Είχε πολλή χωρητικότητα· η μπαταρία του ήταν μεγάλη. Βλέπετε πώς η ζήλεια απομάκρυνε την Χάρη του Θεού από τους άλλους Αποστόλους και δεν μπόρεσαν να γιατρέψουν το δαιμονισμένο παιδάκι; Γι᾿ αυτό ο Χριστός είπε: «Ω γενεά άπιστος και διεστραμμένη! έως πότε έσομαι μεθ᾿ υμών; έως πότε ανέξομαι υμών;»[63]!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος θάβει τα δικά του χαρίσματα, ζηλεύει τα χαρίσματα των άλλων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα βοηθηθή κάποιος που ζηλεύει να ξεπεράση την ζήλεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν γνωρίση τα χαρίσματα με τα οποία τον έχει προικίσει ο Θεός και τα αξιοποιήση, τότε δεν θα ζηλεύη και η ζωή του θα είναι Παράδεισος. Πολλοί δεν βλέπουν τα δικά τους χαρίσματα· βλέπουν μόνον τα χαρίσματα των άλλων και τους πιάνει η ζήλεια. Θεωρούν τον εαυτό τους αδικημένο, μειωμένο, κι έτσι βασανίζονται και κάνουν την ζωή τους μαύρη. «Γιατί αυτός να έχη αυτά τα χαρίσματα κι εγώ να μην τα έχω;», λένε. Μά εσύ έχεις άλλα χαρίσματα, εκείνος άλλα. Θυμάστε τον Κάιν και τον Άβελ; Δεν έψαξε ο Κάιν να βρη τα δικά του χαρίσματα, αλλά κοιτούσε τα χαρίσματα του Άβελ· οπότε καλλιέργησε τον φθόνο προς τον αδελφό του, μετά τα έβαλε και με τον Θεό και τελικά από τον φθόνο έφθασε στον φόνο[64]. Και μπορεί αυτός να είχε περισσότερα και μεγαλύτερα χαρίσματα από τον Άβελ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί κανείς, όταν βλέπη τα χαρίσματα των άλλων, να μη ζηλεύη, αλλά να χαίρεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν αξιοποιή τα δικά του χαρίσματα και δεν τα θάβη, τότε θα χαίρεται με τα χαρίσματα των άλλων. Χρόνια τώρα βλέπω εδώ μια αδελφή τί φωνή έχει, τί ευλάβεια, και όμως δεν πάει να ψάλη. Και επειδή το δικό της χάρισμα το θάβει και δεν ψάλλει, μαραζώνει, όταν ακούη την άλλη που δεν έχει και τόσο καλή φωνή να ψάλλη. Δεν σκέφτεται ότι σ᾿ αυτήν έδωσε ο Θεός καλύτερη φωνή, αλλά δεν την καλλιεργεί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό, λέω, ο καθένας να ψάξη να δη μήπως το χάρισμα που βλέπει στον άλλον και το ζηλεύει το έχει και αυτός, αλλά δεν το καλλιεργεί, ή μήπως ο Θεός του έδωσε άλλο χάρισμα. Γιατί ο Θεός δεν αδικεί κανέναν· στον καθέναν έχει δώσει ένα διαφορετικό χάρισμα που θα τον βοηθήση στην πνευματική του πρόοδο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όπως ο ένας άνθρωπος δεν μοιάζει με τον άλλο, έτσι και το χάρισμα του ενός δεν μοιάζει με του άλλου. Προσέξατε καμμιά φορά τα αγριομπίζελα που έχετε εκεί κάτω στον φράχτη; Όλα είναι από μία ρίζα, αλλά έχουν διαφορετικά χρώματα και το ένα είναι πιο όμορφο από το άλλο. Και όμως το ένα δεν ζηλεύει το άλλο... Το καθένα χαίρεται με το χρώμα που έχει. Βλέπετε και τα πουλιά; Το καθένα έχει την χάρη του, το δικό του κελάηδημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ας βρη λοιπόν ο καθένας τα χαρίσματα που του έδωσε ο Θεός, ας δοξάζη τον Καλό Θεό, όχι εγωιστικά, φαρισαϊκά, αλλά ταπεινά, αναγνωρίζοντας ότι δεν έχει ανταποκριθή στις δωρεές του Θεού, και ας τα αξιοποιήση στο εξής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ζηλεύω μερικές αδελφές, γιατί έχουν ορισμένα χαρίσματα που εγώ δεν τα έχω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σ᾿ εσένα ο Θεός έδωσε τόσα χαρίσματα κι εσύ ζηλεύεις τα χαρίσματα των άλλων; Μου θυμίζεις την κόρη ενός ζαχαροπλάστη που είχαμε στην Κόνιτσα. Ο πατέρας της της έδινε κάθε μέρα ένα μικρό κομμάτι ραβανί, για να μην την πειράξη το μεγάλο, και αυτή έβλεπε τα παιδιά στο σχολείο που έτρωγαν μεγάλο κομμάτι μπομπότα[65]και τα ζήλευε. «Τί μεγάλο κομμάτι τρώνε αυτά! έλεγε. Εμένα ο πατέρας μου μικρό μου δίνει». Ζήλευε την μπομπότα που έτρωγαν τα άλλα παιδιά, ενώ αυτή είχε ολόκληρο ζαχαροπλαστείο και έτρωγε ραβανί! Θέλω να πώ, κι εσύ δεν εκτιμάς τα μεγάλα χαρίσματα που σού έδωσε ο Θεός, αλλά βλέπεις τα χαρίσματα των άλλων και ζηλεύεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ας μην είμαστε αχάριστοι προς τον Καλό Πατέρα μας Θεό, ο Οποίος έχει προικίσει όλα τα πλάσματά Του με χαρίσματα διάφορα, γιατί Αυτός γνωρίζει τί χρειάζεται ο καθένας μας, ώστε να μη βλαφθούμε. Εμείς όμως πολλές φορές κάνουμε σαν τα μικρά παιδιά και παραπονιόμαστε, γιατί δεν έδωσε και σ᾿ εμάς ο Πατέρας ένα φράγκο[66]ή ένα δίφραγκο, όπως έδωσε στα αδέλφια μας, ενώ σ᾿ εμάς έχει δώσει ολόκληρο εκατοστάρικο[67]. Νομίζουμε ότι αυτό που έδωσε σ᾿ εμάς δεν είναι τίποτε, γιατί περνάμε το εκατοστάρικο για χαρτί, και μας συγκινεί το φράγκο ή το δίφραγκο που έδωσε στα αδέλφια μας και κλαίμε και αγανακτούμε με τον Καλό Πατέρα μας[68].
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καλή ζήλεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ζηλεύω μια αδελφή, γιατί βλέπω πώς έχει ταπείνωση, απλότητα, ευλάβεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ θα κάνω κομποσχοίνι να πεθάνη. Θέλεις να πεθάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, Γέροντα! Μπορεί να ζηλεύω το καλό του άλλου, αλλά ούτε κατά διάνοια δεν θέλω να πάθη κακό. Δεν θέλω να μην έχη ο άλλος αρετή· θα ήθελα όμως να έχω κι εγώ κάτι καλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, τότε να το μοιράσουμε, για να το έχετε από μισό! Μη στενοχωριέσαι. Καλή είναι η ζήλεια που έχεις· ζηλεύεις «τά κρείττονα»[69]...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, υπάρχει και καλή ζήλεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, όταν κάποιος ζηλεύη το καλό του άλλου και συγχρόνως χαίρεται για την πρόοδό του, αυτή η ζήλεια είναι καλή. Αν όμως νιώθη άσχημα και στενοχωριέται, όταν βλέπη τον άλλον να προοδεύη, ή χαίρεται ύπουλα με την δυσκολία του, αυτή η ζήλεια είναι κακή. Ας υποθέσουμε ότι ζηλεύεις μια αδελφή, επειδή έχει καλή φωνή και ψάλλει ωραία. Αν ακούσης ότι βράχνιασε και δεν μπορεί να ψάλη και χαρής, αυτό σημαίνει ότι η ζήλεια σου έχει κακία, έχει δηλητήριο. Αν στενοχωρηθής, αυτό δείχνει ότι η ζήλεια σου δεν έχει κακία· απλώς θα ήθελες να ψάλλης κι εσύ καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα αποκτήσω την καλή ζήλεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να σε πούμε Ωραιοζήλη!... Προσπάθησε να εξαγνίσης την ζήλεια που έχεις, για να γίνη καλή ζήλεια. Δηλαδή να χαίρεσαι την αδελφή που προοδεύει και να αγωνίζεσαι να την μιμηθής. Έτσι θα αλλοιωθής πνευματικά και θα παραμένη μέσα σου η Χάρις του Θεού, που χαρίζει την ουράνια αγαλλίαση από αυτήν την ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, από την καλή ζήλεια να φθάση κάποιος στην κακή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν κάνη δουλειά στον εαυτό του, και βέβαια μπορεί. Θέλει πολλή προσοχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ δεν μπορώ πάντοτε να καταλάβω αν αυτό που νιώθω για την πρόοδο μιας αδελφής είναι ζήλεια καλή ή κακή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ρώτησε τον εαυτό σου: «Εάν η αδελφή έκανε ένα θαύμα, τί θα ένιωθα;» ή «εάν έπεφτε σε πειρασμό και ξέπεφτε στα μάτια των ανθρώπων, θα χαιρόμουν ή θα στενοχωριόμουν;». Από την απάντηση που θα δώσης θα καταλάβης αν η ζήλεια που έχεις είναι καλή ή κακή. Αλλά για πές μου: Αν ακούσης ότι η αδελφή που ζηλεύεις το έρριξε στο ρεμπελιό και δεν κάνει καθόλου πνευματικά, αλλά βάζει το μαγνητόφωνο να λέη το «Κύριε Ιησού Χριστέ», θα στενοχωρηθής;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, θα στενοχωρηθώ, αλλά κι αν ακούσω ότι συνέχεια προοδεύει, νομίζω πώς δεν θα χαρώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε, αν εσύ με δυσκολία περπατάς, να χαίρεσαι αυτόν που τρέχει, όχι να στενοχωριέσαι. Αν θέλης να κάνης πνευματική προκοπή, να χαίρεσαι, όταν οι αδελφές προοδεύουν, και να παρακαλάς τον Θεό αυτές να προοδεύουν συνέχεια κι εσύ να φθάσης στην δική τους πρόοδο. Στο Κοινόβιο, όταν ήμουν δόκιμος[70], ήταν και ένας άλλος δόκιμος στην ίδια ηλικία περίπου μ᾿ εμένα, που είχε φθάσει σε πολύ μεγάλη πνευματική κατάσταση· έλαμπε το πρόσωπό του. Σε όλα ήταν πρότυπο, υπόδειγμα· πολύ αγωνιστής και βιαστής. Είχε και πολλή ευλάβεια· ακόμη και οι γεροντότεροι σηκώνονταν όρθιοι από σεβασμό, όταν περνούσε από μπροστά τους. Περισσότερο ωφελήθηκα από αυτόν τον δόκιμο παρά από τα βιβλία που είχα διαβάσει μέχρι τότε, γιατί ήταν ζωντανό παράδειγμα. Μια φορά πονούσε η καρδιά μου. Έτυχε τότε να περάση από το κελλί μου αυτός ο αδελφός και του είπα να κάνη ευχή. Δεν πρόλαβε να απομακρυνθή και μου πέρασε ο πόνος. Άλλη φορά είχε έρθει ένας δαιμονισμένος και ζητούσε να τον κάνουν οι Πατέρες καλά. Τότε ο Γέροντας είπε σ᾿ αυτόν τον δόκιμο: «Άντε, πήγαινε να κάνης καμμιά ευχή, να φύγη το δαιμόνιο από αυτόν τον ταλαίπωρο». «Με τις ευχές σας, είπε εκείνος, να διώξη ο Χριστός το δαιμόνιο». Μόλις απομακρύνθηκε, έφυγε το δαιμόνιο. Τέτοια παρρησία είχε στον Θεό! Σε τέτοια πνευματική κατάσταση είχε φθάσει! Παρακαλούσα λοιπόν τον Θεό αυτός ο αδελφός να φθάση στα μέτρα του Αγίου που είχε το όνομά του κι εγώ να φθάσω στα μέτρα τα δικά του. Έτσι να κάνης κι εσύ, και θα δής φανερά την ενέργεια του Θεού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος φθάση να χαίρεται για την πρόοδο των άλλων, τότε ο Χριστός θα του δώση όλη την πρόοδο των άλλων και θα χαίρεται όσο χαίρονται όλοι οι άλλοι, και τότε φυσικά θα είναι πολλή και η πρόοδός του και η χαρά του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Θυμός, ο εχθρός της ειρήνης του Θεού
- type: h2
  initial:
    ru: ''
  text:
    ru: Να στρέψουμε τον θυμό εναντίον των παθών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θέλω να απαλλαγώ από τον θυμό. Βλέπω πόσο ανάρμοστο είναι να θυμώνη ο μοναχός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο θυμός, ο καθαρός θυμός, είναι δύναμη της ψυχής. Εάν ο εκ φύσεως πράος βοηθιέται μια φορά από τον χαρακτήρα του για την πνευματική του πρόοδο, ο θυμώδης βοηθιέται δυο φορές από την δύναμη που έχει ο χαρακτήρας του, αρκεί την δύναμη αυτή του θυμού να την αξιοποιήση κατά των παθών του και του πονηρού. Αν δεν την αξιοποιήση, θα την εκμεταλλευθή ο διάβολος. Ο εκ φύσεως ήπιος, εάν δεν αγωνισθή να αποκτήση ανδρισμό, δεν μπορεί να κάνη άλματα. Ενώ ο θυμώδης, εάν πάρη μια γενναία απόφαση και στρέψη τον θυμό του εναντίον του κακού, πάει, πήδησε. Γι᾿ αυτό τα άλματα στην πνευματική ζωή τα κάνουν όσοι έχουν παλαβή φλέβα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καταλαβαίνω, Γέροντα, ότι θα έπρεπε να θυμώνω με τον διάβολο και όχι με τις αδελφές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, στην αρχή θυμώνει κανείς με τους άλλους· ύστερα, αν αγωνισθή, θα θυμώνη με το ταγκαλάκι και στο τέλος φθάνει να θυμώνη μόνο με τον παλαιό του άνθρωπο, με τα πάθη του. Προσπάθησε λοιπόν να θυμώνης μόνον με το ταγκαλάκι και εναντίον των παθών σου και όχι με τις αδελφές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο θυμός, το πείσμα, που έχω είναι παιδικά πάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, ευλογημένη! Ένα μικρό παιδί δικαιολογείται να θυμώση, να χτυπήση τα πόδια του κάτω, να φωνάξη: «δέν θέλω, δεν θέλω!». Όταν όμως μεγαλώση, πρέπει να τα αποβάλη αυτά και να κρατήση την παιδική απλότητα, την αθωότητα· όχι να κρατήση και τις παιδικές ανοησίες. Και βλέπεις μερικοί που φθάνουν μετά!... Όταν θυμώνουν, χτυπούν το κεφάλι τους στον τοίχο – ευτυχώς που ο Θεός οικονόμησε να είναι γερά τα κεφάλια και δεν παθαίνουν τίποτε!... Άλλοι σχίζουν τα ρούχα τους! Ήταν κάποιος που κάθε μέρα από τον θυμό του έσχιζε ένα πουκάμισο. Το έκανε κομμάτια. Ξεσπούσε σ᾿ εκείνο, για να μην ξεσπάση στους άλλους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, ο θυμός είναι ένα ξέσπασμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά δεν είναι καλύτερα να ξεσπάη κανείς στον παλαιό του άνθρωπο και όχι στους άλλους;
- type: h2
  initial:
    ru: ''
  text:
    ru: Γιατί θυμώνουμε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ νομίζω ότι δεν θυμώνω, αλλά απλώς νευριάζω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς γίνεται αυτό, βρέ παιδί; Αν νευριάζης, πρέπει να εξετάσης να δής μήπως έχεις το πάθος του θυμού. Άλλο αν κάποιος νευριάση και πη καμμιά κουβέντα, επειδή είναι κουρασμένος ή έχει κάποιο πρόβλημα, έναν πόνο κ.λπ. Τότε «καλημέρα» να του πη ο άλλος, «δέν με παρατάς κι εσύ!», μπορεί να του απαντήση. Μά καλά, «καλημέρα» του είπε· δεν του είπε κάτι κακό. Αυτός όμως είναι κουρασμένος, έχει τον πόνο του, γι᾿ αυτό αντιδρά έτσι. Βλέπεις, και το πιο υπομονετικό γαϊδουράκι, όταν το παραφορτώσης, θα κλωτσήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν δεν είμαι συμφιλιωμένη με τον εαυτό μου, μου φταίει το καθετί και αντιδρώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν είσαι συμφιλιωμένη με τον εαυτό σου, αυτό σημαίνει ότι έχεις μία πνευματική αδιαθεσία και είναι φυσικό μετά να αντιδράς. Όπως, όταν κάποιος είναι σωματικά άρρωστος, χάνει καμμιά φορά την υπομονή του και κουράζεται λ.χ. να ακούη τους άλλους να μιλάνε, έτσι και όταν δεν είναι σε καλή πνευματική κατάσταση, του λείπει η εγρήγορση, η υπομονή, η ανεκτικότητα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί φταίει, Γέροντα, που θυμώνω με το παραμικρό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φταίει που πιστεύεις ότι πάντοτε φταίνε οι άλλοι. Ο θυμός σ᾿ εσένα ξεκινάει από τους αριστερούς λογισμούς που βάζεις για τους άλλους. Εάν βάζης δεξιούς λογισμούς, δεν θα εξετάζης τί σού είπαν ή πώς σού το είπαν, θα παίρνης το βάρος επάνω σου και δεν θα θυμώνης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όμως, Γέροντα, δεν μπορώ να πιστέψω ότι πάντοτε φταίω εγώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φαίνεται, υπάρχει μέσα σου κρυφή υπερηφάνεια. Να προσέχης, γιατί ο θυμός έχει μέσα δικαιολογία, υπερηφάνεια, ανυπομονησία, αναίδεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί σήμερα οι άνθρωποι νευριάζουν τόσο εύκολα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τώρα και οι μύγες νευριάζουν! Έχουν πείσμα, θέλημα!... Παλιά, αν τις έδιωχνες, έφευγαν. Τώρα, επιμένουν... Είναι όμως αλήθεια ότι και μερικά επαγγέλματα σήμερα όχι μόνο δεν βοηθούν για την ψυχική ηρεμία, αλλά και τον εκ φύσεως ήρεμο άνθρωπο μπορεί να τον κάνουν νευρικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ, όταν ήμουν στον κόσμο, θύμωνα πολύ· τώρα στο μοναστήρι γιατί δεν θυμώνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλές φορές, από μερικές εξωτερικές αφορμές αγανακτεί ο άνθρωπος και ξεσπά, επειδή δεν αναπαύεται με αυτό που κάνει και θέλει κάτι άλλο. Αυτές όμως οι αντιδράσεις είναι εξωτερικές σκόνες που φεύγουν, όταν βρη ο άνθρωπος αυτό που τον αναπαύει.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Οργίζεσθε και μη αμαρτάνετε»[71]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η αγανάκτηση προέρχεται από εγωισμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι πάντοτε. Υπάρχει και δίκαιη, θεία, αγανάκτηση. Ο Προφήτης Μωυσής τις πλάκες με τις εντολές κρατούσε στα χέρια του καί, όταν είδε τους Ισραηλίτες να θυσιάζουν στο χρυσό μοσχάρι, τις πέταξε κάτω από θεία αγανάκτηση και τις έσπασε[72]. Πριν ανεβή στο όρος Χωρήβ[73], για να πάρη τις εντολές, τους είχε πει τί έπρεπε να κάνουν μέχρι να γυρίση. Ύστερα και οι ίδιοι έβλεπαν τα αστροπελέκια στο Χωρήβ, αλλά, επειδή άργησε να επιστρέψη, έψαχναν για θεό. Πήγαν στον Ααρών και του είπαν: «Ο Μωυσής δεν ξέρουμε τί έγινε. Ποιός θα μας οδηγήση τώρα; Σήκω και φτιάξε μας θεούς, για να μας οδηγήσουν». Ο Ααρών αντιστάθηκε στην αρχή, αλλά μετά υποχώρησε. Κοπίασαν λοιπόν, έφτιαξαν ένα καμίνι, έρριξαν μέσα όλα τα χρυσαφικά που τους είχαν δώσει οι Αιγύπτιοι, πριν φύγουν από την Αίγυπτο[74], και έκαναν ένα ολόκληρο χρυσό μοσχάρι. Το έστησαν επάνω σε έναν βράχο και άρχισαν να πίνουν και να γλεντούν. «Αυτό θα μας οδηγήση», έλεγαν. Τότε ο Θεός είπε στον Μωυσή: «Κατέβα γρήγορα, γιατί ο λαός αποστάτησε». Καθώς λοιπόν κατέβαινε ο Μωυσής από το Σινά, άκουσε φωνές. Του λέει ο Ιησούς του Ναυή που τον περίμενε λίγο πιο κάτω: «Τί γίνεται; ήρθαν οι αλλόφυλοι!». «Αυτές οι φωνές δεν είναι από πόλεμο· γλέντια είναι», του λέει ο Μωυσής. Πλησιάζουν και τί να δούν! Αυτοί είχαν χαρές, γιατί θα τους οδηγούσε το μοσχάρι στην Γη της Επαγγελίας! Βλέπεις, ήταν χρυσό!... Οπότε αγανάκτησε ο Μωυσής και έρριξε κάτω τις πλάκες με τις εντολές και τις έσπασε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ένας πνευματικός άνθρωπος μπορεί να νευριάση, να αγανακτήση και να φωνάξη, αλλά για θέματα σοβαρά, πνευματικά. Δεν έχει όμως κακία μέσα του ούτε κάνει κακό στον άλλον. «Οργίζεσθε και μη αμαρτάνετε»[75], δεν λέει ο Δαβίδ;
- type: h2
  initial:
    ru: ''
  text:
    ru: «Ητοιμάσθην και ουκ εταράχθην»[76]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα ξεπεράσω τον θυμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκοπός είναι να προλαβαίνης να μη φθάνης στον θυμό. Και το γάλα, αν δεν προλάβης να το κατεβάσης από την φωτιά, μόλις φουσκώση, χύνεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα προλαβαίνω να μη θυμώνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Χρειάζεται επαγρύπνηση. Να παρακολουθής τον εαυτό σου και να συγκρατής τον θυμό σου, για να μη ριζώση μέσα σου το πάθος, γιατί μετά, και να θελήσης να το κόψης με το τσεκούρι, θα πετάη συνέχεια «λαίμαργα»[77]. Να θυμάσαι αυτό που είπε ο Δαβίδ: «Ητοιμάσθην και ουκ εταράχθην»[78]. Είδες εκείνος ο μοναχός τί έκανε; Μόλις έβγαινε από το κελλί του, έκανε τον σταυρό του και έλεγε: «Θεέ μου, φύλαξέ με από τους πειρασμούς» και ήταν έτοιμος να αντιμετωπίση πειρασμό. Ήταν σαν να κρατούσε σκοπιά. Κοιτούσε από που θα του έρθη ο πειρασμός, για να αμυνθή. Αν λοιπόν κάποιος αδελφός του φερόταν άσχημα, αυτός ήταν έτοιμος και τον αντιμετώπιζε με πραότητα και ταπείνωση. Έτσι να κάνης κι εσύ.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μερικές φορές σε έναν πειρασμό λέω από μέσα μου: «δέν θα μιλήσω», αλλά στο τέλος ξεσπάω.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί θα πη ξεσπάς; Τα σπασμένα τί γίνονται μετά; Καίγονται; Δεν έχεις, φαίνεται, πολλή υπομονή, γι᾿ αυτό φθάνεις μέχρις ενός σημείου και ύστερα ξεσπάς. Χρειάζεσαι λίγη ακόμη... Πριν μιλήσης, να λές δυό-τρείς φορές την ευχή, για να πάρης λίγο φώς. Μια γυναίκα, όταν θύμωνε, έλεγε το «Πιστεύω» και ύστερα μιλούσε. Κοσμικοί άνθρωποι και βλέπεις τί αγώνα κάνουν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν αντιδρώ με την συμπεριφορά μιας αδελφής, τί να κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να βλέπης την αδελφή με καλωσύνη. Να προσπαθής να την δικαιολογής με αγάπη. Αυτό θα σε βοηθήση να αποκτήσης φυσιολογικά μια σταθερή, καλή πνευματική κατάσταση καί, όταν θα έρχεται το πάθος του θυμού, θα βρίσκη κατειλημμένη την θέση της καρδιάς σου από την αγάπη και δεν θα μπορή πλέον να σταθή· θα φεύγη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την ταπείνωση και την σιωπή δίνουμε τόπο στην οργή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς δίνει κανείς τόπο στην οργή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την ταπείνωση και την σιωπή δίνουμε τόπο στην οργή. Γιατί λέμε ότι το φίδι είναι φρόνιμο; Παρόλο που έχει όπλο δυνατό, το δηλητήριο, και μπορεί να μας κάνη κακό, λίγο θόρυβο αν ακούση, αμέσως φεύγει· δεν πάει κόντρα, δίνει τόπο στην οργή. Έτσι κι εσύ, αν κανείς σού πη κανέναν λόγο και σε πειράξη, μην απαντάς. Αν σιωπήσης, αφοπλίζεις τον άλλον. Μια φορά στο Καλύβι ο Ντίκας, ο μεγάλος γάτος, πήγε να χτυπήση ένα βατραχάκι. Εκείνο δεν κουνήθηκε καθόλου, οπότε ο Ντίκας το άφησε και έφυγε. Το βατραχάκι με την σιωπή του και με τήν... ταπείνωσή του τον νίκησε. Αν κουνιόταν λίγο, θα το τίναζε ο Ντίκας επάνω και θα το χτυπούσε σαν το ντέφι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν διαφωνούμε με κάποια αδελφή και επιμένη η καθεμιά στην γνώμη της, φθάνουμε σε αδιέξοδο και τελικά νευριάζω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε, πρέπει η μια από τις δυο σας να ταπεινωθή και να υποχωρήση· αλλιώς δεν γίνεται. Αν δύο άνθρωποι θέλουν να περάσουν ένα μακρύ ξύλο από μια μικρή πόρτα, πρέπει ο ένας να κάνη πίσω, για να μπή πρώτα ο άλλος· διαφορετικά δεν θα μπορέσουν να περάσουν. Όταν ο καθένας επιμένη στην γνώμη του, είναι σαν να χτυπάη ο πυριόβολος[79]στην στουρναρόπετρα και πετιούνται φωτιές!... Οι Φαρασιώτες[80], όταν κάποιος επέμενε στο δικό του, έλεγαν: «Ας είναι το δικό σου κατσίκι θηλυκό και το δικό μου αρσενικό»[81], κι έτσι απέφευγαν τον καβγά. Πάντως, όποιος υποχωρεί, κέρδος έχει, γιατί στερείται κάτι, κάνει μια θυσία, και αυτό του δίνει την χαρά και την ειρήνη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν κανείς εξωτερικά φέρεται σωστά και υποχωρή, αλλά μέσα του αντιδρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό σημαίνει ότι μέσα του ζη ακόμη ο παλαιός άνθρωπος και παλεύει με αυτόν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί όμως, Γέροντα, αν και φέρεται σωστά, δεν έχει ειρήνη μέσα του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να έχη ειρήνη! Για να έχη ο άνθρωπος ειρήνη, πρέπει και εσωτερικά να είναι τοποθετημένος σωστά. Τότε φεύγει ο θυμός, η ανησυχία και έρχεται στον άνθρωπο η ειρήνη του Θεού. Και όταν έρθη η ψυχική ηρεμία μέσα του, αφανίζει τον καπνό του θυμού, καθαρίζουν τα μάτια της ψυχής και βλέπει καθαρά. Γι᾿ αυτό ο Χριστός μόνον για τους «ειρηνοποιούς» λέει ότι «υιοί Θεού κληθήσονται»[82].
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Η ψυχοφθόρος λύπη
- type: h2
  initial:
    ru: ''
  text:
    ru: ΗχαράείναιτουΧριστού,ηλύπηείναιτουδιαβόλου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτόν τον καιρό, στενοχωριέμαι πολύ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί στενοχωριέσαι; Βούλιαξαν τα καράβια σου; Που τα έβγαλες και βούλιαξαν; στον Ατλαντικό; Καλά, βγάζουν τα καράβια με τέτοιον καιρό στον ωκεανό; Πόσα βούλιαξαν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όλα, Γέροντα, βούλιαξαν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, τότε είσαι ακτήμων και μπορείς να γίνης καλή μοναχή! Γιατί δεν δοξάζεις διαρκώς τον Θεό; Τί σού λείπει; Να έχη λύπη ένας άνθρωπος που βρίσκεται μακριά από τον Χριστό, το καταλαβαίνω· αλλά να έχη λύπη ένας που είναι κοντά στον Χριστό, δεν το καταλαβαίνω, γιατί, και πόνο να έχη, ο πόνος του μελώνεται από τον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όπως έχω καταλάβει, στον άνθρωπο δεν υπάρχει φαρμάκι, γιατί, αν το φαρμάκι το ακουμπήση στον Χριστό, γίνεται γλυκό σιρόπι. Όποιος έχει μέσα του φαρμάκι, σημαίνει ότι δεν ακουμπάει τα προβλήματά του στον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η χαρά είναι του Χριστού, η λύπη είναι του διαβόλου. Όταν βλέπω μοναχό να είναι σαν ζημιωμένος μπακάλης, ξέρετε πώς στενοχωριέμαι; Άλλο η κατά Θεόν λύπη, το χαροποιόν πένθος. Τότε ο άνθρωπος αγάλλεται. Η σιωπή, η συστολή που έχει, στάζουν μέλι στην καρδιά του. Όταν δώ έναν τέτοιον άνθρωπο, να του φιλήσω και τα πόδια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, από που θα καταλάβη κανείς αν η λύπη του είναι πράγματι κατά Θεόν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ας υποθέσουμε, κάνει μια αμαρτία ο άνθρωπος και λυπάται. Αν λυπάται από καθαρό φιλότιμο για την πτώση του, γιατί στενοχώρησε τον Χριστό, νιώθει μέσα του έναν γλυκό πόνο, γιατί ο Θεός σκορπά στην ψυχή του γλυκύτητα, την θεία παρηγοριά. Αυτή η λύπη είναι κατά Θεόν. Ενώ, όταν κανείς νιώθη συνεχή λύπη με άγχος και απελπισία, πρέπει να καταλάβη ότι αυτή η λύπη δεν είναι κατά Θεόν. Η κατά Θεόν λύπη είναι χαρά πνευματική και φέρνει στην ψυχή παρηγοριά, ενώ η λύπη που δεν είναι κατά Θεόν φέρνει άγχος και αδιέξοδο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, ένας πνευματικός άνθρωπος στενοχωριέται, επειδή κάποιος αιρετικός χρησιμοποιεί το όνομά του και κάνει κακό στους ανθρώπους[83];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτή η στενοχώρια είναι δικαιολογημένη και πρέπει να στενοχωρεθή ο άνθρωπος, γιατί βλάπτονται πολλοί. Και σ᾿ αυτήν όμως την περίπτωση η αντιμετώπιση πρέπει να είναι πνευματική. Αν τοποθετηθή ταπεινά και πή: «Θεέ μου, δεν θέλω να πάθουν κακό οι άνθρωποι· φώτισέ τους να καταλάβουν την αλήθεια», αναπαύεται. Ενώ, αν αρχίση να αγωνιά και να λέη: «τί να κάνω; χρησιμοποιούν το όνομά μου και καταστρέφονται ψυχές» κ.λπ., ανάπαυση δεν θα έχη. Πάντως, όταν κανείς δεν έφταιξε και έχη αναπαυμένη την συνείδησή του, τότε, ακόμη κι αν οι άλλοι τον πληγώνουν, εκείνος νιώθει μέσα του μεγάλη παρηγοριά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο εγωισμός πάντα φέρνει λύπη και άγχος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σκέφτομαι συνέχεια το σφάλμα μου που σάς στενοχώρησε και με πιάνει λύπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήν το σκέφτεσαι, μια που πέρασε, γιατί αυτό μόνο θα σε θλίβη και δεν θα σε βοηθήση σε τίποτε. Το να προσέχης όμως στο εξής, αυτό θα σε ωφελή. Συνέχισε με φιλότιμο τον αγώνα σου. Όλοι οι άνθρωποι κάνουμε απροσεξίες, αλλά ο Καλός Θεός σάν[84]Πατέρας μας προστατεύει. Γι᾿ αυτό έχει τους Αγίους Του, γι᾿ αυτό έχει βάλει και από έναν Άγγελο ξεχωριστά σε κάθε άνθρωπο, για να τον προστατεύη, γι᾿ αυτό οικονομάει να υπάρχουν και πνευματικοί άνθρωποι, για να βοηθάνε πάλι τους ανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάμπτομαι από την στενοχώρια για τις πτώσεις μου και κουράζομαι στον αγώνα μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από τον εγωισμό είναι. Επειδή δεν «κάμπτεις», γι᾿ αυτό αποκάμνεις μετά. Δεν υπάρχει ταπείνωση, μετάνοια, συντριβή· υπάρχει εγωισμός, και ο εγωισμός πάντα φέρνει λύπη και άγχος. Όταν ο άνθρωπος δεν έχη μετάνοια, αλλά στενοχωριέται από εγωισμό, από ανθρωπαρέσκεια, επειδή ξέπεσε στα μάτια των άλλων, τότε υπάρχει μέσα του αγωνία, φαρμάκι, πόνος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, όταν κανείς μετά από μια πτώση του στενοχωριέται πολύ, αυτό προέρχεται πάντα από εγωισμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι πάντα· μπορεί να προέρχεται και από φιλότιμο. Και όταν η στενοχώρια είναι πολλή και προέρχεται μόνον από καθαρό φιλότιμο, τότε και η θεία παρηγοριά είναι πολλή και δυνατή και τονώνει όχι μόνον την ψυχή αλλά και το σώμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς θα καταλάβω, Γέροντα, αν στενοχωριέμαι από φιλότιμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όποιος στενοχωριέται από φιλότιμο, ρίχνει το βάρος επάνω του· ενώ, όποιος στενοχωριέται από εγωισμό, ρίχνει το βάρος στους άλλους και λέει ότι τον αδικούν. Θίγεται ο εγωισμός του, κατεβάζει τα μούτρα, δεν μιλάει... Νά, σήμερα δυο αδελφές έκαναν μια ζημιά. Έκανα και στις δύο παρατήρηση. Και οι δύο λυπήθηκαν και έσκυψαν το κεφάλι. Η μία όμως λυπήθηκε από φιλότιμο, γιατί με στενοχώρησε με την ζημιά που έκανε, ενώ η άλλη λυπήθηκε από εγωισμό. Η πρώτη ντρεπόταν ακόμη και να με κοιτάξη. Η άλλη, για να μη χάση την υπόληψή της, πήγε αμέσως να δικαιολογηθή, χωρίς να εξετάση πόσο μεγάλη ήταν η ζημιά. Σκέφθηκε: «Ξέπεσα στα μάτια των άλλων· δεν θα μ᾿ έχουν πια εμπιστοσύνη. Πώς να δικαιολογήσω τώρα το σφάλμα μου, για να μη χάσω την υπόληψή μου;». Αν αναγνώριζε το σφάλμα της και έπαιρνε το βάρος επάνω της, θα είχε μέσα της παρηγοριά. Αυτή όμως προσπάθησε να δικαιολογηθή, γι᾿ αυτό ανάπαυση μέσα της δεν είχε. Γιατί, όταν δικαιολογούμαστε, δίνουμε χώρο στον διάβολο, οπότε έρχεται, μας κάνει λεπτή εργασία και μας στενοχωρεί· ενώ, όταν παίρνουμε όλο το βάρος επάνω μας, τότε και ο Θεός μας παίρνει όλο το βάρος. Ας κανονίσουμε λοιπόν ποιό από τα δυο θα διαλέξουμε: την ταπείνωση που δίνει ανάπαυση ή τον εγωισμό που φέρνει στενοχώρια, άγχος και ταραχή;'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο αχάριστος είναι πάντα λυπημένος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πολλοί άνθρωποι, ενώ τα έχουν όλα, νιώθουν άγχος και στενοχώρια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν βλέπετε έναν άνθρωπο να έχη μεγάλο άγχος, στενοχώρια και λύπη, ενώ τίποτε δεν του λείπει, να ξέρετε ότι του λείπει ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος τα έχει όλα, και υλικά αγαθά και υγεία, καί, αντί να ευγνωμονή τον Θεό, έχει παράλογες απαιτήσεις και γκρινιάζει, είναι για την κόλαση με τα παπούτσια. Ο άνθρωπος, όταν έχη ευγνωμοσύνη, με όλα είναι ευχαριστημένος. Σκέφτεται τί του δίνει ο Θεός κάθε μέρα και χαίρεται τα πάντα. Όταν όμως είναι αχάριστος, με τίποτε δεν είναι ευχαριστημένος· γκρινιάζει και βασανίζεται με όλα. Άν, ας πούμε, δεν εκτιμάη την λιακάδα και γκρινιάζη, έρχεται ο Βαρδάρης[85]και τον παγώνει... Δεν θέλει την λιακάδα· θέλει το τουρτούρισμα που προκαλεί ο Βαρδάρης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θέλετε να πήτε μ᾿ αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θέλω να πω ότι, αν δεν αναγνωρίζουμε τις ευλογίες που μας δίνει ο Θεός και γκρινιάζουμε, έρχονται οι δοκιμασίες και μαζευόμαστε κουβάρι. Όχι, αλήθεια σάς λέω, όποιος έχει αυτό το τυπικό, την συνήθεια της γκρίνιας, να ξέρη ότι θα του έρθη σκαμπιλάκι από τον Θεό, για να ξοφλήση τουλάχιστον λίγο σ᾿ αυτήν την ζωή. Και αν δεν του έρθη σκαμπιλάκι, αυτό θα είναι χειρότερο, γιατί τότε θα τα πληρώση όλα μια και καλή στην άλλη ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, η γκρίνια μπορεί να είναι συνήθεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γίνεται συνήθεια, γιατί η γκρίνια φέρνει γκρίνια και η κακομοιριά φέρνει κακομοιριά. Όποιος σπέρνει κακομοιριά, θερίζει κακομοιριά και αποθηκεύει άγχος. Ενώ, όποιος σπέρνει δοξολογία, δέχεται την θεϊκή χαρά και την αιώνια ευλογία. Ο γκρινιάρης, όσες ευλογίες κι αν του δώση ο Θεός, δεν τις αναγνωρίζει. Γι᾿ αυτό απομακρύνεται η Χάρις του Θεού και τον πλησιάζει ο πειρασμός· τον κυνηγάει συνέχεια ο πειρασμός και του φέρνει όλο αναποδιές, ενώ τον ευγνώμονα τον κυνηγάει ο Θεός με τις ευλογίες Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αχαριστία είναι μεγάλη αμαρτία, την οποία ήλεγξε ο Χριστός. «Ουχί οι δέκα εκαθαρίσθησαν; οι δε εννέα πού;»[86], είπε στον λεπρό που επέστρεψε να Τον ευχαριστήση. Ο Χριστός ζήτησε την ευγνωμοσύνη από τους δέκα λεπρούς όχι για τον εαυτό Του αλλά για τους ίδιους, γιατί η ευγνωμοσύνη εκείνους θα ωφελούσε.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το ταγκαλάκι θέλει να μας βλέπη λυπημένους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πέφτω απότομα από την χαρά στην λύπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το απότομο πέρασμα από την χαρά στην λύπη τις πιο πολλές φορές είναι του πειρασμού. Το ταγκαλάκι με την κακία του πολεμάει πολύ τον άνθρωπο, ιδίως τον ευαίσθητο και χαρούμενο στην φύση του, που θέλει να ζήση πνευματική ζωή. Αυτή είναι η δουλειά του: θέλει να μας βλέπη λυπημένους και να χαίρεται. Γιατί όμως να αφήνουμε το ταγκαλάκι να κάνη την δουλειά του; Η χαρά δεν είναι καλύτερη από την λύπη; Η αγάπη δεν είναι καλύτερη από την κακία;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ορισμένες φορές πέφτω σε λύπη, χωρίς να ξέρω την αιτία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το ταγκαλάκι δεν θέλει κανένας να χαίρεται. Και αυτούς που έχουν λόγο να στενοχωρηθούν και αυτούς που δεν έχουν, βρίσκει τρόπους να τους στενοχωρή. Εκείνο που βλέπω σ᾿ εσένα είναι ότι αφορμή ζητάει να σε απογοητεύη. Σε μπερδεύει όλο και περισσότερο με λεπτές κλωστές. Εάν σε μπέρδευε με σπάγκο, τέλος πάντων, θα έλεγα ότι έχεις λίγο δίκαιο, αλλά εσύ τις λεπτές κλωστές τις βλέπεις για χοντρά σχοινιά και στενοχωριέσαι. Μη βασανίζεσαι χωρίς να υπάρχη λόγος, γιατί δίνεις χαρά στο ταγκαλάκι και στενοχωρείς τον Χριστό. Θέλεις να στενοχωριέται ο Χριστός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, Γέροντα, αλλά...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τίποτε!«Ο Άδης επικράνθη!»[87]. Πές:«Επικράνθη!».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –«Επικράνθη!».
- type: h2
  initial:
    ru: ''
  text:
    ru: Η λύπη εξαντλεί τις ψυχικές και σωματικές μας δυνάμεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνά μου πονάει το στομάχι και δυσκολεύομαι να ανταποκριθώ στα πνευματικά μου καθήκοντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ κάθεσαι και συζητάς με τους λογισμούς σου, τα βλέπεις όλα μαύρα και βασανίζεσαι χωρίς λόγο· έτσι τσακίζεσαι ψυχικά και σωματικά. Έπειτα από ένα τέτοιο τσάκισμα πονάει και το στομάχι, και που να βρεθή μετά κουράγιο για πνευματικά; Μπορεί να πάρης κάτι και να σού περάση το στομάχι, αλλά, αν δεν λείψη η στενοχώρια, πάλι θα πονέση. Μη δέχεσαι τους λογισμούς που σε απογοητεύουν, για να μην αχρηστέψης τα δώρα που σού έχει δώσει ο Θεός. Όσο θα τοποθετήσαι σωστά, τόσο θα γαληνεύης και θα ηρεμής, και τόσο η υγεία σου θα καλυτερεύη και δεν θα έχης ανάγκη από φάρμακα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η στενοχώρια αφοπλίζει τον άνθρωπο. Του ρουφάει όλο το μεδούλι των ψυχικών και σωματικών του δυνάμεων και δεν τον αφήνει να κάνη τίποτε. Δηλητηριάζει την ψυχή και φέρνει ανωμαλίες και στο σώμα. Χτυπάει στα πιο ευαίσθητα μέρη του σώματος και εξασθενεί τον άνθρωπο με το άγχος που δημιουργεί. Το δηλητηρίασμα από την πίκρα μπορεί να καταβάλη τελείως όχι μόνον έναν ευαίσθητο οργανισμό αλλά και γερούς οργανισμούς. Μια αδελφή εδώ ξέρετε τί δυνατότητες έχει; Μπορεί να κάνη πολύ καλή πνευματική εργασία, και στις δουλειές είναι σπίρτο! Όλο το μοναστήρι μπορεί να το φέρη βόλτα, αλλά, επειδή την πιάνει αυτό το τσάκισμα από την στενοχώρια, δεν μπορεί να κάνη τίποτε· χαραμίζεται. Κι έτσι αχρηστεύεται μια γερή μηχανή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Διώξτε την κακομοιριά με την πνευματική λεβεντιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μου έρχωνται επανωτές δυσκολίες στον αγώνα μου, γογγύζω και με πιάνει λύπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, στην δύσκολη στιγμή φαίνεται η δύναμη του ανθρώπου. Μη φοβάσαι, μην πανικοβάλλεσαι, όταν συναντάς κάποια δυσκολία. Να ζητάς από τον Θεό να σού δίνη πνευματικό ανδρισμό, για να αντιμετωπίζης τις δυσκολίες στην πνευματική σου πορεία με θάρρος και να αγωνίζεσαι με λεβεντιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η λύπη που νιώθω αυτόν τον καιρό για την άσχημη πνευματική μου κατάσταση με παραλύει πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πάντως εκεί που ήσουν, δεν είσαι – δόξα τω Θεώ –, αλλά και εκεί που έπρεπε να βρίσκεσαι, δεν βρίσκεσαι. Πιστεύω όμως σύντομα να δείξης την παλληκαριά σου και να ξεγαντζωθής από τα υπόλοιπα σχοινιά της κακομοιριάς, τα οποία μπορείς να κόψης με την Χάρη του Θεού, όπως το λιοντάρι κόβει την κλωστή της αράχνης. Διώξε την κακομοιριά με την πνευματική λεβεντιά. Περιμένω, εύχομαι και ελπίζω να δώ την πρόοδό σου και να χαρώ πολύ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν παραλείπω τα πνευματικά μου καθήκοντα, με πιάνει λύπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η λύπη για ό,τι παραλείψαμε να κάνουμε ή η χαρά για ό,τι κάναμε, είναι κάτι φυσικό, αλλά μπορεί να μπαίνη μέσα και ο εγωισμός· γι᾿ αυτό να προσέχης. Να βάλης τώρα μια καλή αρχή και ένα πρόγραμμα στον αγώνα σου και σιγά-σιγά θα προχωράς. Έτσι θα σταθεροποιήσης κατάσταση και θα σταματήσουν τα ανεβοκατεβάσματα που σού προκαλεί ο καμουφλαρισμένος εχθρός. Εάν αξιοποιήσης τις δυνάμεις σου με πνευματική λεβεντιά στην καλογερική, θα κάνης πολλή προκοπή. Εάν όμως αφήσης τον εαυτό σου στην κακομοιριά, εσύ θα μοιρολογάς και το ταγκαλάκι θα χτυπάη παλαμάκια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η βία μου λείπει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Επίθεση χρειάζεται, βρέ παιδί!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η επίθεση πώς γίνεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με λεβεντιά! Εγώ δεν θέλω κακομοίρες αδελφές, αλλά Σουλιώτισσες πνευματικές, να πολεμούν το ταγκαλάκι με λεβεντιά πνευματική, δοξολογώντας τον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το αντίδοτο της λύπης είναι η δοξολογία στον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, βλέπω μέσα μου υπολείμματα από ένα πάθος, στενοχωριέμαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πές: «Δόξα σοι ο Θεός, που έφυγαν τα πολλά!». Αν ήμουν εγώ στην θέση σου, θα έβλεπα τις ολοφάνερες μεγάλες δωρεές του Θεού και «από φυλακής πρωΐας μέχρι νυκτός»[88]θα έλεγα το «δόξα σοι ο Θεός». Αν θέλης να ζής παραδεισένια από αυτήν την ζωή, δές κι εσύ τις ευεργεσίες και τις πλούσιες δωρεές που σού δίνει ο Θεός και άρχισε το «δόξα σοι ο Θεός». Να δοξάζετε τον Θεό, γιατί σάς βοήθησε και προοδεύσατε έστω και λίγο, είτε επειδή εσείς κοπιάσατε, είτε επειδή σάς βοήθησαν οι άλλοι. Όταν ο άνθρωπος λέη «δόξα σοι ο Θεός», βοηθάει ο Θεός, γιατί η ευγνωμοσύνη με το ταπεινό φρόνημα και με τον φιλότιμο αγώνα τραβάει συνέχεια ουράνιες δυνάμεις και ευλογίες θεϊκές.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, ξέρω ότι θα ξαναπέσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ξέρεις· από φοβία σκέφτεσαι έτσι. Μήν έχετε φοβία μήπως ξανακάνετε το ίδιο σφάλμα, γιατί έτσι κλονίζεται η πίστη σας στον Θεό. Μήν τα σκαλίζετε τόσο πολύ. Όταν σάς λέη ο λογισμός ότι δεν πρόκειται να διορθωθήτε και διαλύεσθε από την λύπη, χρειάζεται να δώσετε ένα ψεύτικο κουράγιο στον εαυτό σας. «Δόξα σοι ο Θεός, να πήτε, σήμερα είμαι καλύτερα από χθές. Δόξα σοι ο Θεός χίλιες φορές...». Αν και φαίνεται ψεύτικο αυτό το κουράγιο, μέσα του όμως κρύβει μια μεγάλη δύναμη, την ελπίδα στον Θεό. Η ελπίδα στον Θεό είναι ο μοχλός που αναποδογυρίζει την απελπισία, ελευθερώνει την ψυχή από την λύπη και το άγχος και τονώνει σιγά-σιγά τις πνευματικές δυνάμεις με την θεία ζωντάνια που δίνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στενοχωριέμαι γιατί έχω πολλά προβλήματα υγείας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όλα να τα δέχεσαι σαν μεγάλα δώρα του Θεού. Ο Θεός δεν είναι άδικος. Στον Ουρανό θα έχης πολλά να απολαύσης· θα έχης σύνταξη μεγάλη, εάν δεν την μειώσης μόνη σου με τον γογγυσμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς, Γέροντα, αφού τώρα δεν νιώθω μέσα μου τον Ουρανό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν νιώθεις τον Ουρανό, γιατί δεν δοξολογείς τον Θεό. Όταν ο άνθρωπος κινήται στον χώρο της δοξολογίας, χαίρεται με όλα. Υπάρχουν κοσμικοί άνθρωποι που θα μας κρίνουν εμάς τους μοναχούς. Να δήτε οι Βεδουΐνοι τί ταλαιπωρία περνούν, αλλά ευχαριστούν τον Θεό και είναι χαρούμενοι[89]. Το σιτάρι δεν το καθαρίζουν, για να βγάλουν την πέτρα, αλλά το αλέθουν όπως είναι, και το ψωμί τους είναι όλο πέτρα! Και οι τροφές τους, φαίνεται, δεν έχουν τα απαραίτητα συστατικά, ασβέστιο κ.λπ., οπότε τα δόντια τους καταστρέφονται τελείως. Και βλέπεις Βεδουΐνους να έχουν μόνον ένα δόντι και να χαίρωνται σαν να είναι το δόντι μαργαριταρένιο. Και άλλος του λείπει ένα δόντι και αισθάνεται μειονεκτικά. Με όλα αυτά που ακούτε, να κινήσθε συνέχεια στην δοξολογία· να δοξάζετε μέρα–νύχτα τον Θεό για τις ευεργεσίες Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου έλεγε κάποιος επίσκοπος ότι σε έναν ναό, την ώρα που ο διάκος διάβαζε το Ευαγγέλιο της θεραπείας των δαιμονισμένων των Γεργεσηνών[90], ένας άνθρωπος πολύ απλός στεκόταν πίσω από το δεσποτικό και έλεγε συνέχεια «δόξα σοι ο Θεός». Αρχίζει ο διάκος: «Τω καιρώ εκείνω ελθόντι τω Ιησού εις την χώραν των Γεργεσηνών», «δόξα σοι ο Θεός», λέει εκείνος, «υπήντησαν αυτώ δύο δαιμονιζόμενοι», «δόξα σοι ο Θεός»· «χαλεποί λίαν», «δόξα σοι ο Θεός»· «καί ιδού ώρμησε πάσα η αγέλη των χοίρων... εις την θάλασσαν», «δόξα σοι ο Θεός». «Κατάλαβα, μου είπε ύστερα ο επίσκοπος, ότι είχε δίκαιο αυτός ο απλός άνθρωπος που έλεγε «δόξα σοι ο Θεός», γιατί το «δόξα σοι ο Θεός» ρίχνει τους δαίμονες στην θάλασσα». Κι εσείς πάντα να λέτε «δόξα σοι ο Θεός, δόξα σοι ο Θεός», μέχρι να ορμήση η αγέλη στην θάλασσα...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η δοξολογία αγιάζει τα πάντα. Με την δοξολογία διαλύεται ο άνθρωπος από ευγνωμοσύνη, παλαβώνει με την καλή έννοια, πανηγυρίζει τα πάντα. Και όταν ο άνθρωπος ευχαριστή τον Θεό ακόμη και για τα λίγα, έρχεται μετά τόσο πλούσια η ευλογία του Θεού, που δεν μπορεί να την αντέξη· και τότε ο διάβολος δεν μπορεί πια να σταθή και φεύγει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ενότητα Δεύτερη – Οι Αρετές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Όποιος έχει την πνευματική ομορφιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: πού δίνει η αρετή, λάμπει από την θεία Χάρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γιατί, όσο αποκτάει ο άνθρωπος αρετές, θεώνεται,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί επόμενο είναι να ακτινοβολή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί να προδίδεται από την θεία Χάρη».
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καλλιέργεια των αρετών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πότε φθάνει, Γέροντα, ο άνθρωπος στην θέωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν έρθη μέσα του η θεία Χάρις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε έχει χαρά μέσα του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχει μέσα του όχι μόνο χαρά, αλλά και πολλή αγάπη, ταπείνωση, παρηγοριά, σιγουριά. Έχει τις ιδιότητες του Θεού και γι᾿ αυτό έρχεται μέσα του η Χάρις του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, τί θα πή: «Θεός θεών»[91];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –«Θεοί εστε και υιοί Υψίστου πάντες»[92], δεν λέει ο Δαβίδ; Ο άνθρωπος είναι πλασμένος «κατ᾿ εικόνα» Θεού, άρα ο Θεός είναι Θεός των θεών, δηλαδή των ανθρώπων. Ο άνθρωπος πρέπει να θεωθή. «Κατ᾿ εικόνα» Θεού είμαστε όλοι οι άνθρωποι, αλλά πόσοι βρισκόμαστε στον δρόμο προς το «καθ᾿ ομοίωσιν»; Όσο απομακρυνόμαστε από τον Θεό, τόσο δεν μοιάζουμε με τον Θεό, τόσο δηλαδή απομακρυνόμαστε από το «καθ᾿ ομοίωσιν».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να ομοιάση ο άνθρωπος με τον Θεό, πρέπει να ζη σύμφωνα με τις εντολές του Θεού κάνοντας δουλειά στον εαυτό του. Έτσι καθαρίζεται από τα πάθη και αποκτάει αρετές, και τότε δεν είναι μόνον «κατ᾿ εικόνα» Θεού, αλλά περνά στο «καθ᾿ ομοίωσιν», γιατί ενεργεί μέσα του η Χάρις του Θεού.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Η εργασία της αρετής είναι η τήρηση των εντολών του Θεού»[93]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θα ήθελα να δώ τον Άγιό μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ θα ήθελα να προσπαθήσης να πιάσης φιλία με τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα το κατορθώσω αυτό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – «Εν τίνι κατορθώσει νεώτερος την οδόν αυτού; Εν τω φυλάξασθαι τους λόγους σου»[94]. Αν ζής σύμφωνα με τις εντολές του Θεού, θα πιάσης φιλία με τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν είμαστε παιδιά του Θεού, πρέπει να τηρούμε και τις εντολές Του. Όταν οι Ιουδαίοι είπαν: «εμείς πατέρα έχουμε τον Αβραάμ», ο Χριστός τους είπε: «Δεν έχετε πατέρα τον Αβραάμ, αλλά τον σατανά, γιατί, αν ήσασταν παιδιά του Αβραάμ, θα κάνατε και τα έργα του Αβραάμ»[95].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί εννοεί ο Αββάς Ισαάκ, όταν λέη ότι ο Χριστός δεν ζητά την τήρηση των εντολών αλλά την διόρθωση της ψυχής[96];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για ποιόν λόγο έδωσε ο Θεός τις εντολές; Για την διόρθωσή μας δεν τις έδωσε; Τηρώντας τις εντολές του Θεού εργαζόμαστε την αρετή και αποκτούμε την υγεία της ψυχής. «Η εργασία της αρετής, λέει ο Αββάς Ισαάκ, είναι η τήρηση των εντολών του Θεού»[97].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ησαΐας λέει: «Χρείαν έχει ο άνθρωπος ανδρείας καρδίας και μεγάλης, μεριμνάν εις το φυλάξαι τας εντολάς του Κυρίου»[98].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έτσι είναι. Για να τηρούμε με ακρίβεια τις εντολές του Θεού, χρειάζεται ανδρεία, παλληκαριά και εγρήγορση. Γι᾿ αυτό να ψάχνης να βρής σε τί υστερείς και τί ζητά ο Θεός από σένα· να εξετάζης τί έκανες και τί έπρεπε να κάνης και δεν έκανες. Να λές στον εαυτό σου: «Καλά, αυτό που κάνω, εμένα με αναπαύει, τον Χριστό όμως Τον αναπαύει;» και να αγωνίζεσαι να κάνης το θέλημα του Θεού. «Δια τους λόγους των χειλέων σου εγώ εφύλαξα οδούς σκληράς»[99], λέει στην Αγία Γραφή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αξία έχει η αρετή που αποκτιέται με ελευθερία, χωρίς πίεση. Πρέπει ο άνθρωπος να αισθανθή ως ανάγκη την αρετή και στην συνέχεια να εργασθή, για να την αποκτήση. Δεν είναι ότι ο Θεός έχει ανάγκη να κάνουμε το θέλημά Του· εμείς έχουμε ανάγκη να κάνουμε το θέλημα του Θεού, για να ελευθερωθούμε από τον παλαιό μας άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλος ο αγώνας του πιστού πρέπει να έχη στόχο την ακριβή τήρηση των εντολών του Θεού. Όταν ο άνθρωπος κοιτάζη πώς να γίνη το θέλημα του Θεού, τότε πλησιάζει στον Θεό και τότε, χωρίς να ζητάη, λαμβάνει την θεία Χάρη· παίρνει δηλαδή νερό απ᾿ ευθείας από την πηγή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όλες οι αρετές καλλιεργούνται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί κανείς να είναι εκ φύσεως ενάρετος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί κάποιος από την φύση του να είναι, ας υποθέσουμε, απλός, φιλήσυχος, πράος. Αυτά όμως είναι φυσικά χαρίσματα που του έδωσε ο Θεός και πρέπει να τα καλλιεργήση, για να τα αυξήση. Με τον αγώνα που θα κάνη θα λάβη τα πνευματικά χαρίσματα, τα χαρίσματα του Αγίου Πνεύματος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η σύνεση είναι χάρισμα από τον Θεό ή είναι αρετή που αποκτιέται σιγά-σιγά με την πνευματική εργασία που κάνει κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε να σού πώ: Η σύνεση είναι χάρισμα, αλλά ας πούμε ότι εσύ δεν έχεις αυτό το χάρισμα· έχεις όμως κάποιο άλλο. Καλλιεργώντας το χάρισμα που έχεις, καλλιεργείς κοντά σ᾿ αυτό και την σύνεση και άλλες αρετές, κι έτσι αναπληρώνεις τις αρετές που σού λείπουν. Όταν κανείς αγωνίζεται λ.χ. στην εγκράτεια, συγχρόνως καλλιεργεί την σιωπή, την προσοχή, την προσευχή, την σύνεση κ.λπ.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλες οι αρετές και όλα τα πάθη καλλιεργούνται. Εξαρτάται από το τί εργασία θα κάνη ο άνθρωπος. Αν καλλιεργήση τις αρετές, αναπτύσσονται οι αρετές και πνίγουν τα πάθη. Αν καλλιεργήση τα πάθη, αναπτύσσονται τα πάθη και πνίγουν τις αρετές. Αν καλλιεργήση και τα δύο, αναπτύσσονται και τα δύο, και βγαίνει ένα μπερδεμένο πράγμα. Για να το καταλάβετε αυτό, σκεφθήτε έναν κήπο που έχει μέσα και λουλούδια και αγριόχορτα. Αν καλλιεργηθούν τα αγριόχορτα, θα αναπτυχθούν και θα πνίξουν τα λουλούδια. Αν καλλιεργηθούν τα λουλούδια, θα αναπτυχθούν και θα πνίξουν τα αγριόχορτα. Αν καλλιεργηθούν όλα μαζί, δεν θα ξεχωρίζης τα λουλούδια από τα αγριόχορτα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να προκόψη ο άνθρωπος, πρέπει να αναγνωρίση τα πάθη που έχει και να καταβάλη προσπάθεια για να τα κόψη. Επίσης, να γνωρίση τα χαρίσματα που του έδωσε ο Θεός και να τα καλλιεργήση. Αν τα καλλιεργήση ταπεινά, σύντομα θα πλουτήση πνευματικά. Αν δουλέψη κανείς πνευματικά, γίνεται καλός· αν αδιαφορήση, γίνεται κακός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχω δει ψυχές πού, ενώ το χωράφι τους ήταν γόνιμο, το άφησαν ακαλλιέργητο και γέμισε παλιούρια και πουρνάρια. Και άλλες ψυχές που το χωράφι τους ήταν γεμάτο παλιούρια και πουρνάρια, τα ξερρίζωσαν, το έσκαψαν και έγινε εύφορο. Τί μας ωφελεί, αν ο Θεός μας έδωσε καλό χωράφι κι εμείς το αφήσαμε κι έγινε ρουμάνι; Όταν στο χωράφι μας μπορεί να ευδοκιμήση το ζαχαροκάλαμο, αλλά εμείς είμαστε ευχαριστημένοι και με τα καλάμια και δεν φροντίζουμε να τα ξερριζώσουμε και να καλλιεργήσουμε τα ζαχαροκάλαμα, τί να μας κάνη ο Θεός; Τα καλάμια μόνον καλάθια γίνονται· ζάχαρη δεν βγάζουν...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός θα ζητήση λόγο από τον καθέναν μας, εάν διπλασίασε το χάρισμα που του έδωσε. Εάν σε κάποιον έδωσε πέντε χαρίσματα, πρέπει να τα κάνη δέκα· το εννιά δεν είναι γι᾿ αυτόν άριστα. Γι᾿ αυτό, όσο μπορεί κανείς, να αγωνίζεται ταπεινά και με διάκριση για το άριστα, γιατί ο Θεός θα ζητήση λόγο εάν το ένα τάλαντο το έκανε δύο, εάν τα δύο τα έκανε τέσσερα, εάν τα πέντε τα έκανε δέκα. Επομένως όλα, εάν διπλασιασθούν, είναι για τον Θεό το άριστα. Και εάν κάποιος, από φιλότιμο και όχι από εγωισμό, το ένα τάλαντο το κάνη δέκα, αυτό συγκινεί όχι μόνον τον Θεό αλλά ακόμη και ανθρώπους που έχουν γρανιτένια καρδιά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αρετή των άλλων αρωματίζει κι εμάς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί βοηθάει, Γέροντα, να αποκτήσης μια αρετή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να συναναστρέφεσαι κάποιον που έχει αυτήν την αρετή. Όπως, αν συναναστρέφεσαι κάποιον που έχει ευλάβεια, θα μπορέσης σιγά-σιγά να αποκτήσης κι εσύ ευλάβεια, το ίδιο συμβαίνει και με όλες τις αρετές, γιατί η αρετή των άλλων αρωματίζει κι εμάς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν καθρεφτίζουμε τον εαυτό μας στις αρετές των άλλων και προσπαθούμε να τις μιμηθούμε, οικοδομούμαστε. Αλλά και στα ελαττώματά τους όταν καθρεφτίζουμε τον εαυτό μας, πάλι βοηθιόμαστε, γιατί τα δικά τους ελαττώματα μας βοηθάνε να δούμε τα δικά μας. Και το μεν χάρισμα του άλλου με παρακινεί να αγωνισθώ, για να το μιμηθώ, ενώ το ελάττωμά του με κάνει να σκεφθώ μήπως το έχω κι εγώ και σε τί βαθμό το έχω, για να αγωνισθώ να το κόψω. Βλέπω λ.χ. κάποιον που έχει εργατικότητα. Το χαίρομαι και προσπαθώ να τον μιμηθώ. Βλέπω σε άλλον ότι έχει περιέργεια. Δεν κατακρίνω τον αδελφό, αλλά ψάχνω να δώ μήπως έχω κι εγώ περιέργεια. Κι αν δώ ότι έχω, προσπαθώ να την κόψω. Αν όμως βλέπω μόνον τις δικές μου αρετές και τα ελαττώματα των άλλων, ενώ τα δικά μου ελαττώματα τα παραβλέπω ή τα δικαιολογώ και λέω: «είμαι καλύτερος και από αυτόν και από εκείνον και από τον άλλον!», πάει, βούλιαξα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο καθρέφτης μας είναι οι άλλοι. Στους άλλους καθρεφτιζόμαστε και βλέπουμε τον εαυτό μας, και οι άλλοι βλέπουν τις μουντζούρες μας και πλενόμαστε με την υπόδειξή τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι συνταγές των Αγίων στην εργασία της αρετής
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά είναι τα γνωρίσματα των Αγίων;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η αγάπη με την ταπείνωση, η απλότητα και η διάκριση είναι τα γνωρίσματα των Αγίων. Αν ο άνθρωπος βιάση με διάκριση τον εαυτό του να μιμηθή την ζωή των Αγίων, αγιάζεται και αυτός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ θα βοηθηθούμε στην εργασία για την απόκτηση των αρετών, αν έχουμε πρότυπο τους Αγίους. Συγκρίνοντας τον εαυτό μας με τους Αγίους, βλέπουμε τα πάθη μας, ελεγχόμαστε, ταπεινωνόμαστε και αγωνιζόμαστε με φιλότιμο και με θείο ζήλο να τους μιμηθούμε. Δεν δικαιολογούμαστε να μην προχωρούμε, γιατί έχουμε τις συνταγές των Αγίων και την ζωή τους, το άγιο παράδειγμά τους. Όλοι οι Άγιοι είναι παιδιά του Θεού και βοηθάνε εμάς τα ταλαίπωρα παιδιά του Θεού δείχνοντάς μας την μέθοδο για να γλυτώνουμε από τις μεθοδίες του πονηρού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Με την μελέτη των βίων των Αγίων θερμαίνεται η ψυχή μας και παρακινείται να τους μιμηθή και να προχωρήση με λεβεντιά στον αγώνα για την απόκτηση των αρετών. Μέσα στους Αγίους βλέπει κανείς την ίδια πνευματική τρέλλα, μόνον που παρουσιάζεται στον καθέναν με άλλη μορφή. Βλέπει τον έρωτα που είχαν για τον Θεό και ανάβει μέσα του ο θείος ζήλος να τους μιμηθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, το Συναξάρι του Αγίου της ημέρας πόσα χρόνια πρέπει να το διαβάζη κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συνέχεια, σε όλη του την ζωή. Αν καί, όσα κι αν γράψουν τα Συναξάρια, είναι πολύ λίγα, γιατί από τους Αγίους δεν έχουμε την ζωή τους αλλά την υπερχείλιση της ζωής τους. Θα ήταν ανόητοι οι Άγιοι, αν φανέρωναν όσα έζησαν εν τω κρυπτώ. Φθάνουν όμως και τα λίγα που ξέρουμε από την ζωή τους, για να βοηθηθούμε, αρκεί να μας κεντούν την καρδιά, για να τα βάζουμε σε εφαρμογή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου φαίνεται δύσκολο να κάνω κάτι από αυτά που έκαναν οι Άγιοι. Ας πούμε, η Αγία Συγκλητική[100]τί άσκηση έκανε μέχρι το τέλος της ζωής της, αν και υπέφερε από επώδυνη αρρώστια! Ή ο Όσιος Βαρσανούφιος[101]πόσα χρόνια κράτησε τέλεια σιωπή!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εντάξει, αν θέλης να μιμηθής τον Όσιο Βαρσανούφιο, προσπάθησε τουλάχιστον να μη μιλήσης, όταν σού κάνουν μια παρατήρηση. Όσο για την άσκηση της Αγίας Συγκλητικής, κι εγώ βλέπω ότι δεν μπορείς να ασκηθής τόσο πολύ σωματικά, γιατί δεν αντέχεις, αλλά εσωτερικά, νομίζω, μπορείς να την μιμηθής, και εκεί έχεις πολλή δουλειά να κάνης. Εύχομαι να σού δώση η Αγία λίγα από τα πολλά που είχε η ίδια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να λαμπικάρουμε την αρετή μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές μιλάτε για «τοξινωμένη αρετή»· πότε μια αρετή είναι «τοξινωμένη»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – «Τοξινωμένη» αρετή είναι λ.χ. η καλωσύνη, όταν έχη ανθρωπαρέσκεια, ή η αγάπη, όταν έχη ιδιοτέλεια. Όταν δεν είναι αγνά τα κίνητρά μας και βάζουμε στην αρετή μας τον εαυτό μας, νοθεύουμε την αρετή μας. Τότε η αρετή μας είναι σαν ένα άγουρο φρούτο, που έχει βέβαια λίγες βιταμίνες, αλλά συγχρόνως έχει και την στυφάδα του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί να μην έχω αρετή και ο άλλος να με θεωρή ενάρετη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το κακό είναι να θεωρής εσύ τον εαυτό σου ενάρετο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να μην καταλαβαίνω την πραγματική πνευματική μου κατάσταση και να νομίζω ότι έχω αρετή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, αλλά, αν προσέξης, θα δής ότι δεν έχεις εσωτερική γλυκύτητα, οπότε θα καταλάβης που βρίσκεσαι πνευματικά. Καμμιά φορά μπορεί να νομίζη κανείς ότι έχει μια αρετή, επειδή έμαθε απλώς κάποια εξωτερικά γνωρίσματά της και συμμορφώνεται μ᾿ αυτά, για να φαίνεται ενάρετος. Αυτό όμως δεν είναι πραγματική αρετή και δεν μπορεί να μείνη έτσι· θα κοσκινισθή και κάποτε θα φανή η πραγματικότητα. Άλλο είναι, ας υποθέσουμε, να αγωνίζεται κανείς να μη μιλάη, για να μην πληγώνη τους άλλους, και σιγά-σιγά να αποκτήση την αρετή της σιωπής, και άλλο να μη μιλάη, για να φαίνεται ότι έχει την αρετή της σιωπής. Τότε μπορεί να σιωπά, ενώ με τους λογισμούς του συνέχεια να φλυαρή και να έχη μέσα του ένα σωρό πάθη. Η εξωτερική συμπεριφορά μπορεί να παρουσιάζη έναν τέλειο άγιο καί, όταν αποκαλυφθή ο εσωτερικός του άνθρωπος, να είναι...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, με απογοητεύει η πραγματικότητα του εαυτού μου. Και τα καλά που νόμιζα ότι είχα, αποδείχθηκαν σκάρτα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιά δηλαδή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νά, το φιλότιμο που νόμιζα ότι είχα αποδείχθηκε ότι είναι τελικά εγωισμός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν είναι έτσι, ευλογημένη! Ένα πέτρωμα έχει μέσα διάφορα μέταλλα. Μπορεί να έχη πολλή άμμο, αλλά έχει και χαλκό και σίδηρο και λίγο χρυσάφι... Αν μπή στο χωνευτήρι, θα ξεχωρίση ο χρυσός. «Ο χρυσός εν τω χωνευτηρίω»[102], δεν λέει;
- type: h2
  initial:
    ru: ''
  text:
    ru: Κλέφτης των αρετών είναι η υπερηφάνεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κλέβομαι από τα πάθη μου. Άλλοτε με κλέβει η φιλαυτία, άλλοτε η εξωστρέφεια...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν αφήνη κανείς τους κλέφτες να τον κλέβουν, μπορεί ποτέ να πλουτήση; Κι εσύ, αν αφήνης να σε κλέβουν τα πάθη, μπορείς να κάνης προκοπή; Πάντα φτωχή θα είσαι, γιατί, όσα μαζεύεις, θα τα χάνης. Απορώ πώς σε κλέβει το ταγκαλάκι, ενώ εσύ μπορείς να κλέψης τον Παράδεισο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, ενώ έχω διάθεση να δουλέψω για μια αρετή, μένω σε μια στάσιμη κατάσταση; τί φταίει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλές φορές δεν έχει έρθει και η ωριμότητα γι᾿ αυτήν την αρετή. Εσύ όμως βλέπω ότι άρχισες να ωριμάζης πνευματικά. Πρόσεξε λοιπόν, τώρα που έρχεται η εποχή του καλοκαιριού και η αγουρίδα γίνεται σιγά-σιγά μέλι, να φυλάς καλά τα σταφύλια από τις κουρούνες – τα ταγκαλάκια – ζώντας ταπεινά και αθόρυβα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ό,τι καλό κάνω, τελικά το χάνω, γιατί αμέσως υπερηφανεύομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρεις εσύ τί κάνεις; Φτιάχνεις μέλι και ύστερα αφήνεις το κακό ταγκαλάκι και σού το κλέβει, οπότε μένεις με τον κόπο. Όπως ο μελισσουργός ζαλίζει τις μέλισσες με καπνό και παίρνει το μέλι, έτσι κι εσένα σε ζαλίζει το ταγκαλάκι με τον καπνό της υπερηφανείας, σού κλέβει το πνευματικό μέλι που έφτιαξες και τρίβει τα χέρια του. Σού κλέβει δηλαδή τα πολύτιμα δώρα του Θεού και ύστερα χαίρεται. Εσύ είσαι έξυπνη, πώς δεν το πιάνεις αυτό; Γιατί δεν πιάνεις τον κλέφτη, τον πονηρό, που σε κλέβει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος νιώθη ότι ένα χάρισμα που έχει είναι του Θεού, πώς είναι δυνατόν να κλέβεται από τον πειρασμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κλέβεται, γιατί δεν προσέχει. Ο Θεός προικίζει τον κάθε άνθρωπο με πολλά χαρίσματα, αλλά ο άνθρωπος, ενώ θα έπρεπε να ευγνωμονή γι᾿ αυτά τον Θεό, πολλές φορές δεν προσέχει, οικειοποιείται τα χαρίσματα που του έδωσε ο Θεός και καυχάται εσωτερικά. Τότε ο πονηρός διάβολος, σαν κλέφτης που είναι, πηγαίνει, του κλέβει τα χαρίσματα, τα δηλητηριάζει με τα δηλητήριά του και έτσι τα αχρηστεύει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική ομορφιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα αποκτήσω την πνευματική ομορφιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν αγωνισθής με θείο ζήλο να αποκτήσης αρετές, θα αποκτήσης την πνευματική ομορφιά. Η Παναγία είχε και την εξωτερική και την εσωτερική ομορφιά· όποιος την έβλεπε αλλοιωνόταν. Εκείνη η πνευματική απαλάδα που σκορπούσε θεράπευε ψυχές. Με την εσωτερική της ομορφιά και την δύναμη της Χάριτος τί ιεραποστολή έκανε! Αλλά και κάθε άνθρωπος, αν εργασθή πνευματικά και σμιλέψη τον χαρακτήρα του, χαριτώνεται και ομορφαίνει η ψυχή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο άνθρωπος που έχει την θεία Χάρη, το καταλαβαίνει ο ίδιος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καταλαβαίνει μερικές ενέργειες της Χάριτος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο άλλος που τον βλέπει μπορεί να διακρίνη ότι έχει την θεία Χάρη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, το διακρίνει, γιατί τον προδίδει η θεία Χάρις. Βλέπεις, η αρετή δεν κρύβεται, όσο και να θέλη κανείς να την κρύψη, όπως ο ήλιος δεν κρύβεται με το κόσκινο, γιατί περνούν αρκετές ακτίνες από τις τρυπούλες του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος έχει την πνευματική ομορφιά που δίνει η αρετή, λάμπει από την θεία Χάρη. Γιατί, όσο αποκτάει ο άνθρωπος αρετές, θεώνεται, και επόμενο είναι να ακτινοβολή και να προδίδεται από την θεία Χάρη. Έτσι φανερώνεται στους ανθρώπους, χωρίς να το θέλη και χωρίς ο ίδιος να το καταλαβαίνη, και δοξάζεται ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αποτοξίνωση από τα πάθη και το λαμπικάρισμα της ψυχής διακρίνονται και στην σάρκα, η οποία λαμπικάρεται και αυτή, γιατί το λαμπικάρισμα ξεκινάει από την καρδιά. Η καρδιά μεταδίδει με την κυκλοφορία του αίματος την πνευματικότητά της και στην σάρκα, κι έτσι αγιάζεται όλος ο άνθρωπος.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρώτο Μέρος – Μία Είναι Η Αρετή, Η Ταπείνωση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Η ταπείνωση ανοίγει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τίς πόρτες του Ουρανού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί έρχεται στον άνθρωπο η Χάρις του Θεού».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – «Ο Θεός ταπεινοίς δίδωσι χάριν»[103]
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο ταπεινός έχει όλες τις αρετές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πέστε μας κάτι, πριν φύγετε[104].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να σάς πώ; Τόσα σάς είπα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πέστε μας κάτι, για να το δουλέψουμε, μέχρι να ξαναρθήτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, αφού επιμένετε, να σάς πώ... Μία είναι η αρετή, η ταπείνωση· επειδή όμως δεν το καταλαβαίνετε, άντε, να σάς πω και την αγάπη. Αλλά, όποιος έχει ταπείνωση, δεν έχει και αγάπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ισαάκ λέει: «Ό,τι είναι το αλάτι για το φαγητό, είναι και η ταπείνωση για την αρετή»[105].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή χωρίς την ταπείνωση δεν ...τρώγονται οι αρετές! Θέλει να πη ο Άγιος πόσο απαραίτητη είναι η ταπείνωση στην εργασία των αρετών.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αλλού ο Αββάς Ισαάκ λέει ότι η ταπείνωση έρχεται, όταν αποκτήση ο άνθρωπος αρετές[106].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως δεν το κατάλαβες καλά; Αν δεν έχη ο άνθρωπος ταπείνωση, καμμιά αρετή δεν μπορεί να τον πλησιάση[107].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, όποιος έχει ταπείνωση έχει όλες τις αρετές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έμ βέβαια. Ο ταπεινός έχει όλα τα πνευματικά αρώματα: απλότητα, πραότητα, αγάπη χωρίς όρια, καλωσύνη, ανεξικακία, θυσία, υπακοή κ.λπ. Επειδή έχει την πνευματική φτώχεια[108], έχει και όλον τον πνευματικό πλούτο. Είναι επίσης και ευλαβής και σιωπηλός, γι'' αυτό συγγενεύει και με την Κεχαριτωμένη Θεοτόκο Μαρία, η οποία είχε μεγάλη ταπείνωση. Ενώ είχε μέσα της ολόκληρο τον Θεό σαρκωμένο, δεν μίλησε καθόλου, μέχρι που μίλησε ο Χριστός στα τριάντα Του χρόνια. Στον ασπασμό[109]του Αγγέλου είπε: «Ιδού η δούλη Κυρίου· γένοιτό μοι κατά το ρήμά σου»[110]. Δεν είπε: «Εγώ θα γίνω μητέρα του Υιού του Θεού».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Παναγία, για την ταπείνωσή της, κατέχει τα δευτερεία της Αγίας Τριάδος. «Χαίροις μετά Θεόν η Θεός, τα δευτερεία της Τριάδος η έχουσα»[111], λέει ο Άγιος Ανδρέας Κρήτης. Να είναι δούλη, να είναι και Νύμφη του Θεού! Να είναι παρθένος, να είναι και μητέρα! Να είναι πλάσμα του Θεού, να είναι και Μητέρα του Πλάστου! Αυτά είναι τα μεγάλα μυστήρια, τα παράξενα, που δεν εξηγούνται, αλλά μόνο βιώνονται!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά εικόνα της Παναγίας σάς αρέσει περισσότερο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εμένα όλες οι εικόνες της Παναγίας μου αρέσουν. Και μόνον το όνομά Της να βρώ κάπου γραμμένο, το ασπάζομαι πολλές φορές με ευλάβεια και σκιρτάει η καρδιά μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι φοβερό, αν το σκεφθής! Μικρό κοριτσάκι ήταν και είπε το «Μεγαλύνει η ψυχή μου τον Κύριον, ότι επέβλεψεν επί την ταπείνωσιν της δούλης αυτού»[112]. Μέσα σε λίγες λέξεις τόσα νοήματα! Πολύ θα βοηθηθής, εάν εμβαθύνης στα λόγια αυτά. Είναι λίγα και δυνατά. Αν τα μελετάς, θα αγαπήσης την ταπείνωση· κι αν ταπεινωθής, θα δής τον Θεό να έρχεται μέσα σου και να κάνη την καρδιά σου Φάτνη της Βηθλεέμ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Στον ταπεινό αναπαύεται το πνεύμα του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιές αρετές πρέπει να έχη ο άνθρωπος, για να τον επισκιάση η Χάρις του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Και μόνον η ταπείνωση φθάνει. Συχνά με ρωτούν: «Πόσος καιρός χρειάζεται, για να αποκτήση κανείς την θεία Χάρη;». Μερικοί μπορεί σε όλη τους την ζωή να ζουν δήθεν πνευματικά, να κάνουν άσκηση κ.λπ., αλλά να νομίζουν ότι κάτι είναι, και γι᾿ αυτό να μη λαμβάνουν την Χάρη του Θεού. Και άλλοι σε λίγο χρόνο χαριτώνονται, επειδή ταπεινώνονται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν ο άνθρωπος ταπεινωθή, μπορεί μέσα σε ένα λεπτό να τον λούση η θεία Χάρις, να γίνη άγγελος και να βρεθή στον Παράδεισο. Ενώ, αν υπερηφανευθή, μπορεί μέσα σε ένα λεπτό να γίνη ταγκαλάκι και να βρεθή στην κόλαση. Αν θέλη δηλαδή ο άνθρωπος, γίνεται αρνί· αν θέλη, γίνεται κατσίκι. Τα καημένα τα κατσίκια, και να θέλουν να γίνουν αρνιά, δεν μπορούν· στον άνθρωπο όμως ο Θεός έδωσε την δυνατότητα να γίνη από κατσίκι αρνί, αρκεί να το θελήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Χάρις του Θεού πάει μόνο στον ταπεινό και πράο άνθρωπο. Εκεί αναπαύεται το πνεύμα του Θεού. Είδες τί λέει ο Προφήτης Ησαΐας; «Επί τίνα επιβλέψω, αλλ᾿ ή επί τον ταπεινόν και ησύχιον;»[113].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Θεός θέλει να έχουμε μόνο λίγη ταπείνωση, για να συγγενεύουμε μαζί Του, και μετά όλες οι δωρεές Του έρχονται άφθονες η μία μετά την άλλη. Γιατί ο Θεός χρωστά κατά κάποιον τρόπο στον ταπεινό άνθρωπο πολλή Χάρη και του την δίνει ως δώρο, χωρίς εκείνος να την ζητήση. Είναι πνευματικός νόμος αυτό. «Ο Θεός υπερηφάνοις αντιτάσσεται, ταπεινοίς δε δίδωσι χάριν»[114]δεν λέει το Ευαγγέλιο; Έτσι τα έχει κανονίσει ο Θεός. «Είμαι ταπεινός» θα πή: «Έχω θεία Χάρη»! Πολύ ταπεινός, πολλή Χάρη λαμβάνει από τον Θεό, γιατί ο ταπεινός σαν σφουγγάρι την ρουφάει την θεία Χάρη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος σκύβει ταπεινά και δέχεται τα χτυπήματα από τους άλλους, διώχνει τα δικά του εξογκώματα, ομορφαίνει πνευματικά σαν Άγγελος, και έτσι χωράει από την στενή πύλη του Παραδείσου. Στον Ουρανό δεν ανεβαίνει κανείς με το κοσμικό ανέβασμα αλλά με το πνευματικό κατέβασμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η ταπείνωση ανοίγει τις πόρτες του Ουρανού και έρχεται στον άνθρωπο η Χάρις του Θεού, ενώ η υπερηφάνεια τις κλείνει. Ο Παπα-Τύχων έλεγε: «Ένας ταπεινός άνθρωπος έχει περισσότερη Χάρη από πολλούς ανθρώπους μαζί. Κάθε πρωί ο Θεός ευλογεί τον κόσμο με το ένα χέρι, αλλά, όταν δη κανέναν ταπεινό άνθρωπο, τον ευλογεί με τα δυο Του χέρια. Εκείνος που έχει μεγαλύτερη ταπείνωση, είναι ο μεγαλύτερος από όλους!»[115].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλα από το ταπεινό φρόνημα εξαρτώνται. Όταν υπάρχη στον άνθρωπο ταπεινό φρόνημα, τότε φυσιολογικά ανταμώνει η γη με τον Ουρανό. Οι άνθρωποι με την ταπείνωση βρήκαν το κουμπί· το πατούν και ανεβαίνουν στον «Τρίτο Ουρανό»[116]με το πνευματικό ασανσέρ της αγάπης. Και ακούς μερικούς να λένε: «Και γιατί ο Θεός θέλει να ταπεινωθούμε;». Ακούς κουβέντα; Μά, αν δεν ταπεινωθή ο άνθρωπος, δεν χωράει στον Παράδεισο, αλλά και σ᾿ αυτήν την ζωή δεν έχει ανάπαυση. Τί είπε ο Χριστός; «Μάθετε απ᾿ εμού ότι πράός ειμι και ταπεινός τη καρδία και ευρήσετε ανάπαυσιν ταις ψυχαίς υμών»[117].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ένας ταπεινός λογισμός κάνει αμέσως την Χάρη του Θεού να ενεργή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου έκανε εντύπωση πώς ένας ταπεινός λογισμός κάνει αμέσως την Χάρη του Θεού να ενεργή. Είχε έρθει στο Καλύβι ένα ξένο γατάκι. Το καημένο, φαίνεται, κάτι είχε φάει που το πείραξε και ζητούσε βοήθεια. Χτυπιόταν από τον πόνο και πεταγόταν σαν το χταπόδι, όταν το χτυπούν... Το λυπόμουν που το έβλεπα σ᾿ αυτήν την κατάσταση, αλλά δεν μπορούσα να κάνω τίποτε. Το σταύρωνα, το ξανασταύρωνα, τίποτε! «Βρέ ταλαίπωρε, λέω τότε στον εαυτό μου, βλέπεις τα χάλια σου; Τόσα χρόνια καλόγερος, ούτε ένα γατί δεν μπορείς να βοηθήσης!». Μόλις ελεεινολόγησα τον εαυτό μου, εκεί που το γατάκι κόντευε να ψοφήση, αμέσως συνήλθε. Ήρθε κοντά μου, μου έγλειφε τα πόδια και έκανε χαρούμενο όμορφες τούμπες... Τί δύναμη έχει η ταπείνωση! Γι᾿ αυτό λέει: «Εν τη ταπεινώσει ημών εμνήσθη ημών ο Κύριος»[118].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχω προσέξει ότι ένας ταπεινός λογισμός κάνει τον άνθρωπο να λάμπη, να ακτινοβολή. Όταν ο άνθρωπος παίρνη όλο το σφάλμα επάνω του, τον λούζει η Χάρις του Θεού. Ήρθε προχθές ένας γιατρός που έχει πολλά παιδιά και μου είπε: «Πάτερ μου, έχω πολλή υπερηφάνεια και γίνεται αιτία η δική μου υπερηφάνεια να κάνουν αταξίες τα παιδιά». Και το έλεγε αυτό μπροστά στα παιδιά του και τα μάτια του ήταν βουρκωμένα, αλλά το πρόσωπό του έλαμπε! Το ίδιο πρόσεξα προ ημερών και εδώ. Ήρθαν μερικές αδελφές να συζητήσουμε. Είπαμε διάφορα· αναγκάστηκα να τις μαλώσω πολύ. Μία από αυτές δεν βοηθήθηκε καθόλου· κρύα ήρθε, κρύα έφυγε· μόνον εκεί πέρα έλεγε τα κουσούρια των άλλων χαρτί και καλαμάρι – βλέπεις, όποιος δεν κάνει δουλειά στον εαυτό του, έχει αυτό το ...χάρισμα! Μία άλλη στρυμώχθηκε, μέχρι που έκλαψε. Ταπεινώθηκε, αλλά μετά έλαμπε το πρόσωπό της. Βλέπετε τί κάνει ένας ταπεινός λογισμός με συντριβή! Αμέσως πάνε όλα τα κουσούρια στην άκρη, τακτοποιείται ο άνθρωπος και ακτινοβολεί το πρόσωπό του· ενώ με έναν λογισμό υπερήφανο ή βλάσφημο σκοτεινιάζει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο ανεβάζει πνευματικά την ψυχή ένας πολύ ταπεινός λογισμός που θα φέρη για μια στιγμή ο άνθρωπος, δεν την ανεβάζουν χρόνια ολόκληρα αγώνες υπερφυσικοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κάποιος είναι υπερήφανος και βάλη έναν ταπεινό λογισμό, θα τον βοηθήση ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, αν βάλη έναν ταπεινό λογισμό, τότε δεν θα είναι υπερήφανος· θα είναι ταπεινός και θα τον βοηθήση ο Θεός. Ο άνθρωπος είναι τρεπτός· πάει μια από ᾿δώ-μιά από ᾿κεί, ανάλογα με το τί λογισμό έχει. Ο υπερήφανος, αν βάλη έναν ταπεινό λογισμό, βοηθιέται. Και ο ταπεινός, αν φέρη έναν υπερήφανο λογισμό, παύει να είναι ταπεινός. Είναι κανείς σε καλή πνευματική κατάσταση; Αν υπερηφανευθή, τον εγκαταλείπει η Χάρις του Θεού και φθάνει σε άσχημη κατάσταση. Είναι σε άσχημη κατάσταση, γιατί έκανε λ.χ. κάποιο σφάλμα; Αν συναισθανθή το σφάλμα του και μετανοήση ειλικρινά, έρχεται η ταπείνωση και φθάνει σε καλή κατάσταση, γιατί η ταπείνωση φέρνει την Χάρη του Θεού. Αλλά, για να γίνη η ταπείνωση μόνιμη κατάσταση στον άνθρωπο, ώστε να παραμείνη μέσα του η Χάρις του Θεού, χρειάζεται δουλειά πνευματική.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η εργασία για την απόκτηση της ταπεινώσεως
- type: h2
  initial:
    ru: ''
  text:
    ru: Πώς καλλιεργείται η ταπείνωση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με ποιόν τρόπο, Γέροντα, καλλιεργείται η ταπείνωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η ταπείνωση καλλιεργείται με το φιλότιμο, καλλιεργείται και με την κοπριά των πτώσεων. Ανάλογα. Ένας φιλότιμος άνθρωπος ό,τι καλό έχει το αποδίδει στον Θεό. Βλέπει τις πολλές ευεργεσίες του Θεού, καταλαβαίνει ότι δεν έχει ανταποκριθή, ταπεινώνεται και δοξολογεί διαρκώς τον Θεό. Και όσο ταπεινώνεται και δοξολογεί τον Θεό, τόσο τον λούζει η θεία Χάρις. Αυτή είναι η εκούσια ταπείνωση. Ενώ η ταπείνωση που φέρνουν οι διαρκείς πτώσεις είναι η ακούσια ταπείνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φυσικά η εκούσια ταπείνωση έχει πολύ μεγαλύτερη αξία από την ακούσια. Μοιάζει με χωράφι που έχει καλό χώμα και καρπίζουν τα δένδρα, δίχως λίπασμα ή κοπριά, και οι καρποί τους είναι νόστιμοι. Η ακούσια ταπείνωση μοιάζει με χωράφι που έχει αδύνατο έδαφος καί, για να δώση καρπούς, πρέπει να ρίξης και λίπασμα και κοπριά, και πάλι οι καρποί του δεν θα είναι τόσο νόστιμοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου στοιχίζει, όταν εξαιτίας μιας άσχημης συμπεριφοράς μου πέφτω στα μάτια των άλλων και ταπεινώνωμαι ακούσια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την ακούσια ταπείνωση εξοφλάς και λίγο από το χρέος των αμαρτιών σου. Πρέπει όμως να αρχίσης να ταπεινώνεσαι εκούσια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω φθάσει σε πολύ δύσκολη κατάσταση. Έχω σαρκικούς λογισμούς και πέφτω στην λύπη. Φοβάμαι μήπως δεν βγώ ποτέ από αυτήν την κατάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έχε θάρρος, καλό μου παιδί, και ο Χριστός θα νικήση τελικά. Να ψάλλης: «Εκ νεότητός μου ο εχθρός με πειράζει, ταις ηδοναίς φλέγει με· εγώ δε πεποιθώς εν σοί, Κύριε, τροπούμαι τούτον»[119]. Στην ουσία δεν φταίει πολύ η καημένη η σάρκα, αλλά η υπερηφάνεια. Είναι αλήθεια ότι έχεις πολλές ικανότητες, τις οποίες φυσικά ο Θεός σού τις έδωσε, αλλά, επειδή αμελείς λιγάκι και δεν προσέχεις, ο εχθρός βρίσκει ευκαιρία, τις εκμεταλλεύεται και σε ρίχνει στην υπερηφάνεια. Κι ενώ θα έπρεπε να λούζης το πρόσωπό σου με δάκρυα αγαλλιάσεως και ευγνωμοσύνης προς τον Θεό, το λούζεις με πικρά δάκρυα πόνου και στενοχώριας. Έτσι βγαίνει το εξής συμπέρασμα: Εάν δεν ταπεινωθούμε εκουσίως, θα ταπεινωθούμε ακουσίως, διότι μας αγαπά ο Καλός Θεός. Θάρρος λοιπόν, παιδί μου, και θα νικήση ο Χριστός. «Εάν γαρ πάλιν ισχύσητε, και πάλιν ηττηθήσεσθε, ότι μεθ᾿ ημών ο Θεός»[120]. Μπόρα είναι και θα περάση και πολλά καλά θα φέρη. Θα γνωρίσης πιο καλά τον εαυτό σου, θα ταπεινωθής υποχρεωτικά, και κατά τους πνευματικούς νόμους υποχρεωτικά θα έρθη σ᾿ εσένα και η Χάρις του Θεού, που προηγουμένως εμποδιζόταν από την υπερηφάνεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν γνωρίσαμε τον εαυτό μας. Αν τον γνωρίσουμε, η ψυχή μας θα χαίρεται και θα ζητά ταπεινά το έλεος του Θεού. Η γνώση του εαυτού μας γεννά την ταπείνωση. Γιατί, όσο περισσότερο γνωρίζει ο άνθρωπος τον εαυτό του, τόσο περισσότερο ανοίγουν τα μάτια της ψυχής του και βλέπει καθαρώτερα την μεγάλη του αδυναμία. Γνωρίζει την αθλιότητά του και την αχαριστία του, καθώς και την μεγάλη αρχοντιά και την ευσπλαχνία του Θεού, οπότε συντρίβεται εσωτερικά, ταπεινώνεται πολύ και αγαπάει τον Θεό πολύ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το πάν είναι η καρδιακή ταπείνωση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί να ταπεινώνεται κανείς σκεπτόμενος λογικά, χωρίς να ταπεινώνεται καρδιακά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Παλιά τα μοναστήρια και πολλά σπίτια είχαν πολύ χαμηλές πόρτες και έπρεπε κανείς να σκύψη, για να περάση· αν δεν έσκυβε, χτυπούσε το κεφάλι του. Έτσι το μπόι του καμπτόταν λίγο και το κεφάλι του έβαζε μυαλό, ώστε να προσέχη άλλη φορά, για να μη σακατεύεται και ρεζιλεύεται. Μ᾿ αυτό το παράδειγμα θέλω να πω ότι, όταν ταπεινώνεται κανείς με την λογική, είναι ίσα-ίσα για να μη σπάζη το κεφάλι του και χάνη την υπόληψή του. Νά, προχθές ήρθε μια αδελφή και μου λέει: «Γέροντα, μου είπε η Γερόντισσα ότι, όταν ψάλλω, καμαρώνω την φωνή μου, και από τότε το έχω στον νού μου και προσπαθώ να ψάλλω πιο ταπεινά». «Κατάλαβες αυτό που σού είπε η Γερόντισσα; της λέω. Χρειάζεται να αισθανθής αυτήν την αδυναμία σου και να θελήσης να απαλλαγής από αυτήν. Γιατί, αν η προσπάθειά σου να μην καμαρώνης την φωνή σου είναι μόνον εξωτερική, απλώς για να μη σού ξανακάνη παρατήρηση η Γερόντισσα, τότε μπορεί να φθάσης να καμαρώνης όλον τον εαυτό σου».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ενώ φέρνω ταπεινούς λογισμούς, στο βάθος, μέσα μου, υπάρχει μια αυτοεκτίμηση. Πώς συμβιβάζονται αυτά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ απλώς φέρνεις στον νού σου ταπεινούς λογισμούς, αλλά αυτοί οι λογισμοί δεν αγγίζουν την καρδιά σου. Αν άγγιζαν την καρδιά σου, θα σε αλλοίωναν εσωτερικά, με την καλή έννοια, και θα ήσουν άγγελος. Το πάν είναι η καρδιακή ταπείνωση. Τί λέει ο Αββάς Ισαάκ; «Ο αληθινά ταπεινός δεν ψάχνει με τον νού του να βρη τρόπους να ταπεινωθή, αλλά είναι πραγματικά ταπεινός κατά την καρδίαν»[121].
- type: h2
  initial:
    ru: ''
  text:
    ru: Ταπείνωση στην πράξη, όχι μόνο στα λόγια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, αν κανείς ταπεινώνεται μόνος του κατηγορώντας τον εαυτό του: «είμαι λειψός, χαμένος, κ.λπ.», αυτό τον βοηθάει να αποκτήση ταπείνωση;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μόνος του εύκολα κατηγορεί κανείς τον εαυτό του, αλλά δύσκολα δέχεται την κατηγορία των άλλων. Μόνος του μπορεί να λέη: «είμαι ελεεινός, ο πιο αμαρτωλός, ο χειρότερος απ᾿ όλους», αλλά έναν λόγο του άλλου να μην τον σηκώνη. Βλέπεις, όταν κάποιος πέφτη μόνος του και χτυπάη, μπορεί να πονέση, αλλά δεν δίνει και πολλή σημασία. Ή, όταν τον χτυπήση ένας που τον αγαπάει, λέει: «Έ, δεν πειράζει». Αν όμως λίγο τον γρατζουνίση ή τον σπρώξη κάποιος που δεν τον συμπαθεί, ώ, τότε να δής! Θα βάλη τις φωνές, θα κάνη πώς πονάει, πώς δεν μπορεί να περπατήση!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ήμουν στο Σινά, ήταν εκεί κι ένας λαϊκός – Στρατή τον έλεγαν – πού, αν τον φώναζες: «κύριε Στρατή», σού έλεγε: «Αμαρτωλό Στρατή, να λές, αμαρτωλό Στρατή». Όλοι έλεγαν: «Τί ταπεινός που είναι!». Ένα πρωί τον πήρε ο ύπνος και δεν κατέβηκε στην εκκλησία. Πήγε λοιπόν κάποιος να τον ξυπνήση. «Στρατή, του λέει, ακόμη κοιμάσαι; τελείωσε και ο Εξάψαλμος· δεν θα ᾿ρθής στην εκκλησία;». Οπότε εκείνος βάζει κάτι φωνές... «Εγώ έχω περισσότερη ευλάβεια από σένα και ήρθες εσύ να μου πής να κατεβώ στην εκκλησία;». Έκανε σαν τρελλός... Μέχρι που πήρε το κλειδί από την πόρτα – ήταν από εκείνα τα κλειδιά τα μεγάλα –, για να τον χτυπήση, γιατί θίχτηκε. Τα έχασαν οι άλλοι που τον άκουσαν έτσι να φωνάζη, γιατί τον είχαν για υπόδειγμα, για πολύ ταπεινό. Έγινε ρεζίλι. Βλέπεις τί γίνεται; Μόνος του έλεγε ότι είναι αμαρτωλός, αλλά, μόλις θίχτηκε ο εγωισμός του, έγινε θηρίο!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας άλλος στην Ήπειρο είχε επιδιορθώσει μια εκκλησία. Μόνος του έλεγε ότι δεν έκανε τίποτε παρά μια ψευτιά. Όταν όμως του είπα: «όχι και ψευτιά, κάτι έκανες», ώ, πώς θύμωσε! «Εσύ θα την διόρθωνες καλύτερα την εκκλησία; μου είπε. Εγώ ξέρω από οικοδομές· δεν είμαι μαραγκός σαν κι εσένα. Ο πατέρας μου ήταν εργολάβος»! Θέλω να πώ, μόνος του εύκολα ταπεινώνεται κανείς, αλλά αυτό δεν σημαίνει ότι έχει πραγματική ταπείνωση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά είναι η γνήσια, η πραγματική ταπείνωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν σε ταπεινώνη ο άλλος και το δέχεσαι, τότε έχεις πραγματική ταπείνωση, γιατί πραγματική ταπείνωση είναι η ταπείνωση στην πράξη, όχι στα λόγια. Μια φορά ο Άγιος Κοσμάς ο Αιτωλός ρώτησε τους ανθρώπους που είχαν συγκεντρωθή γύρω του: «Ποιός από σάς δεν έχει υπερηφάνεια;». «Εγώ», είπε κάποιος. «Έλα εδώ εσύ που δεν έχεις υπερηφάνεια, του λέει. Κόψε το μισό μουστάκι και πήγαινε στην πλατεία». «Ά, αυτό δεν μπορώ να το κάνω», του απαντά. «Έ, τότε δεν έχεις ταπείνωση», του λέει[122]. Ήθελε να πη ο Άγιος ότι χρειάζεται έμπρακτη ταπείνωση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ, όταν με πειράζουν, αντιδρώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν έχεις ταπείνωση, γι᾿ αυτό αντιδράς. Είδες ο Αββάς Μωυσής τί ταπείνωση είχε; Όταν τον έκαναν ιερέα, θέλησε ο αρχιεπίσκοπος να τον δοκιμάση και είπε στους κληρικούς: «Όταν μπή στο Ιερό ο Αββάς Μωυσής, να τον διώξετε και μετά να πάτε από πίσω του να ακούσετε τί θα πή». Μόλις λοιπόν μπήκε ο Αββάς Μωυσής στο Ιερό, τον έδιωξαν. «Βρέ κατάμαυρε, του είπαν, τί ζητάς εδώ;». «Έχουν δίκαιο, είπε εκείνος· τί δουλειά έχω εδώ μέσα εγώ ο κατάμαυρος; Αυτοί είναι άγγελοι»[123]! Δεν πειράχθηκε, δεν θύμωσε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί κάποιος να είναι πράος και να μην αντιδρά, όταν τον βρίζουν, αλλά να μην έχη ταπείνωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο ταπεινός άνθρωπος είναι και πράος. Αυτό όμως δεν σημαίνει ότι όσοι είναι πράοι είναι και ταπεινοί. Στην πραότητα πρέπει να υπάρχη και η ταπείνωση, γιατί, αν δεν υπάρχη, μπορεί να φαίνεται κανείς εξωτερικά πράος, αλλά μέσα του να είναι γεμάτος από υπερηφάνεια και να λέη: «Αυτοί είναι βλαμμένοι, άσ᾿ τους να λένε!». Σαν εκείνον τον μοναχό που τον έβλεπαν οι Πατέρες να μην αντιδρά καθόλου, όταν του έκαναν παρατηρήσεις ή τον μάλωναν, αλλά η όλη ζωή του δεν τους πληροφορούσε. Γι᾿ αυτό μια φορά τον ρώτησαν: «Καλά, όταν σε μαλώνουμε, τί λογισμό έχεις και δεν μιλάς;». Και εκείνος τους απάντησε: «Λέω από μέσα μου: «Άσ᾿ τους, ξόανα είναι"»[124]! Τους περιφρονούσε δηλαδή.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όταν ζητάμε από τον Θεό ταπείνωση, να δεχώμαστε και τις ταπεινώσεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί θα με βοηθούσε, Γέροντα, πρακτικά να αποκτήσω ταπείνωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς αποκτά ταπείνωση κανείς; Όταν του λένε μια κουβέντα, να λέη δύο; Να μη σηκώνη μύγα στο σπαθί του; Ευλογημένη, όταν σού δίνεται ευκαιρία για ταπείνωση, να δέχεσαι την ταπείνωση. Έτσι αποκτιέται η ταπείνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το φάρμακο το δικό σου είναι να κινήσαι απλά, ταπεινά, να δέχεσαι όπως η γη και την βροχή και το χαλάζι και τα σκουπίδια και τα φτυσίματα, εάν θέλης να ελευθερωθής από τα πάθη σου. Οι εξωτερικές ταπεινώσεις βοηθούν τον άνθρωπο να ελευθερωθή πολύ γρήγορα από τον παλαιό εαυτό του, όταν τις δέχεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ, Γέροντα, έχω ανάγκη από πολλή ταπείνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να πάς να αγοράσης. Υπάρχουν πολλοί άνθρωποι που πουλούν την ταπείνωση, και μάλιστα δωρεάν, αρκεί να την θέλης...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιοί είναι αυτοί, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι οι άνθρωποι πού, όταν δεν έχουν καλή πνευματική κατάσταση, φέρονται αδιάκριτα και με την συμπεριφορά τους μας ταπεινώνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η ταπείνωση δεν αγοράζεται από τον μπακάλη όπως τα ψώνια. Όταν λέμε: «δώσ᾿ μου, Θεέ μου, ταπείνωση», ο Θεός δεν θα πάρη την σέσουλα και θ᾿ αρχίση: «πάρε ένα κιλό ταπείνωση εσύ», «μισό κιλό εσύ», αλλά θα επιτρέψη να έρθη λ.χ. κάποιος άνθρωπος αδιάκριτος να μας φερθή σκληρά ή θα πάρη από άλλον την Χάρη Του και θα έρθη να μας βρίση. Έτσι θα δοκιμασθούμε και θα εργασθούμε, εάν θέλουμε να αποκτήσουμε την ταπείνωση. Αλλά εμείς δεν σκεφτόμαστε ότι ο Θεός επιτρέπει να γίνη ο αδελφός μας κακός, για να βοηθηθούμε εμείς, και θυμώνουμε με τον αδελφό. Καί, ενώ ζητάμε από τον Θεό ταπείνωση, δεν δεχόμαστε τις ευκαιρίες που μας στέλνει, για να ταπεινωθούμε, αλλά δυσανασχετούμε. Κανονικά θα έπρεπε να χρωστάμε ευγνωμοσύνη σ᾿ αυτόν που μας ταπεινώνει, γιατί αυτός είναι ο μεγαλύτερος ευεργέτης μας. Όποιος ζητάει στην προσευχή του ταπείνωση από τον Θεό, αλλά δεν δέχεται τον άνθρωπο που του στέλνει ο Θεός, για να τον ταπεινώση, δεν ξέρει τί ζητάει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ήμουν στην Μονή Στομίου, ήταν κάτω στην Κόνιτσα ένας παπάς που με αγαπούσε πολύ από λαϊκό ακόμη. Μια Κυριακή είχα κατεβή να λειτουργηθώ στην Κόνιτσα. Η εκκλησία ήταν γεμάτη κόσμο. Την στιγμή που έμπαινα, όπως συνήθιζα, στο Ιερό, είπα μέσα μου: «Θεέ μου, βάλε όλους αυτούς τους πιστούς στον Παράδεισο κι εμένα, αν θέλης, βάλε με σε μια ακρούλα». Όταν πλησίασε η ώρα της Θείας Κοινωνίας, ενώ αυτός ο παπάς πάντα με κοινωνούσε μέσα στο Ιερό, γύρισε προς το μέρος μου και φώναξε δυνατά: «Βγές από το Ιερό και να κοινωνήσης απ᾿ έξω τελευταίος, γιατί είσαι ανάξιος». Βγήκα έξω, χωρίς να πω τίποτε. Πήγα στο αναλόγιο και άρχισα να διαβάζω την ακολουθία της Θείας Μεταλήψεως. Ύστερα, καθώς πήγαινα τελευταίος να κοινωνήσω, είπα μέσα μου: «Ο παπάς φωτίσθηκε από τον Θεό και μου αποκάλυψε ποιός είμαι. Κύριε Ιησού Χριστέ, ελέησέ με, το κτήνος». Μόλις κοινώνησα, αισθάνθηκα μέσα μου μεγάλη γλυκύτητα. Όταν τελείωσε η Θεία Λειτουργία, με πλησιάζει ο παπάς συντετριμμένος: «Συγχώρεσέ με! μου λέει. Πώς το έκανα αυτό! Εγώ μπροστά σου δεν έβαζα ούτε τα παιδιά μου ούτε την παπαδιά, ούτε τον εαυτό μου. Τί ήταν αυτό που έπαθα!» Έπεφτε κάτω, μου έβαζε μετάνοια, μου ζητούσε συγγνώμη, προσπαθούσε να μου φιλήση τα χέρια. «Παπά μου, του λέω, μη στενοχωριέσαι. Δεν φταίς εσύ· εγώ φταίω. Σε χρησιμοποίησε ο Θεός εκείνη την στιγμή, για να δοκιμάση εμένα». Ο παπάς δεν μπορούσε να καταλάβη τί του έλεγα και τελικά, νομίζω, δεν τον έπεισα. Όλα αυτά έγιναν εξαιτίας της προσευχής που είχα κάνει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κι εσείς, όταν βλέπετε μια αδελφή να παραφέρεται και να σάς μιλάη άσχημα, να ξέρετε ότι τις περισσότερες φορές αιτία είναι η προσευχή που κάνετε. Επειδή δηλαδή ζητάτε από τον Θεό να σάς δώση ταπείνωση, αγάπη κ.λπ., παίρνει ο Θεός για λίγο την Χάρη Του από την αδελφή και σάς ταπεινώνει και σάς στενοχωρεί. Έτσι σάς δίνεται ευκαιρία να δώσετε εξετάσεις στην ταπείνωση, στην αγάπη. Αν ταπεινωθήτε, θα ωφεληθήτε. Όσο για την αδελφή, θα λάβη διπλή την Χάρη του Θεού· και γιατί της πήρε ο Θεός την Χάρη, για να δοκιμάση εσάς, και γιατί ταπεινώθηκε με το σφάλμα της και ζήτησε συγχώρεση από τον Θεό. Οπότε και εσείς εργάζεσθε στην ταπείνωση και εκείνη γίνεται καλύτερη.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Σμίκρυνον σεαυτόν εν πάσι»[125]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, κάνω ένα σφάλμα και βλέπω ότι οι άλλοι θα μπορούσαν να με προλάβουν να μην το κάνω, τους ζητώ τον λόγο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ακόμη και στο να διορθωθούμε, μόνον από τον εαυτό μας πρέπει να έχουμε απαίτηση. Αλλά εσύ κάνεις σαν τα μικρά παιδιά που έχουν μόνον απαιτήσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όμως, Γέροντα, πότε θα μεγαλώσω; πότε θα καταλάβω ότι έχω και υποχρεώσεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ...μικρύνης! Όταν δηλαδή καλλιεργήσης την ταπείνωση και την αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ισαάκ γράφει: «Σμίκρυνον σεαυτόν εν πάσι προς πάντας ανθρώπους»[126]. Πώς γίνεται αυτό;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την ταπεινή συμπεριφορά. Σε μια οικογένεια, σε ένα μοναστήρι κ.λπ., όταν υπάρχη αγωνιστικό πνεύμα για την πνευματική καλλιέργεια και ταπεινώνεται ο ένας στον άλλον, αυτό βοηθάει όλους, όπως στην πρώτη Εκκλησία που γινόταν δημόσια εξομολόγηση και όλοι βοηθιούνταν. Όποιος ταπεινώνεται, χαριτώνεται από τον Θεό και μετά βοηθάει και τους άλλους. Η ταπεινή συμπεριφορά ποτέ δεν πληγώνει τον άλλον, γιατί ο ταπεινός πάντα έχει και αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θα με βοηθήση να νιώθω ότι είμαι κάτω από όλες τις αδελφές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να νιώθης κατώτερη από όλες τις αδελφές, να σκέφτεσαι τις πολλές δωρεές που σού έδωσε ο Θεός και δεν τις έχεις διπλασιάσει. Να λές στον εαυτό σου: «Το τάλαντο[127]έμαθα μόνον να χτυπώ· τα τάλαντά μου δεν μπόρεσα ακόμη να τα διπλασιάσω[128]».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος βλέπη τον εαυτό του κάτω από όλους, κάτω, κάτω..., από ᾿κεί βγαίνει επάνω στον Ουρανό. Αλλά εμείς τί κάνουμε; Συγκρίνουμε τον εαυτό μας με τους άλλους και βγάζουμε συμπεράσματα ότι είμαστε ανώτεροι από εκείνους. «Και από εκείνον είμαι καλύτερος, λέμε, και από τον άλλον... Δεν είμαι σαν κι αυτόν...». Από την στιγμή όμως που έχουμε τον λογισμό ότι ο άλλος είναι κατώτερος από εμάς, δεν μπορούμε να βοηθηθούμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν αναγνωρίζω την αρετή του άλλου, αυτό έχει ταπείνωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Φυσικά, όταν ευλαβήσαι και αγαπάς τον άλλον που έχει αρετή, αυτό δείχνει ότι έχεις ταπείνωση και αγαπάς πραγματικά την αρετή. Σημάδι πνευματικής προόδου είναι και αυτό: ένα καλό που έχεις δεν το θεωρείς σπουδαίο και το παραμικρό καλό του άλλου το βλέπεις πολύ ανώτερο από το δικό σου· πάντα δηλαδή εκτιμάς το καλό των άλλων. Τότε έρχεται άφθονη η θεία Χάρις. Γι᾿ αυτό, όποιος πιστεύει ότι οι άλλοι είναι ανώτεροί του, αυτός είναι ανώτερος, γιατί έχει την Χάρη του Θεού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλοι οι άνθρωποι έχουν και τις αδυναμίες τους, έχουν και τα καλά τους, τα οποία ή κληρονόμησαν από τους γονείς τους ή τα απέκτησαν με αγώνα· άλλος δέκα τοις εκατό, άλλος τριάντα τοις εκατό, άλλος εξήντα τοις εκατό, άλλος ενενήντα τοις εκατό. Επομένως, όλοι μπορούμε να πάρουμε κάτι καλό από τους άλλους, για να ωφεληθούμε και να ωφελήσουμε. Αυτό άλλωστε είναι το ορθόδοξο πνεύμα. Εγώ και από μικρά παιδιά βοηθιέμαι, άσχετα αν δεν το φανερώνω, για να μην υπερηφανευθούν και βλαφθούν.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Υποκάτω πάσης της κτίσεως»[129]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά είναι η ανώτερη πνευματική εργασία για έναν μοναχό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν θυμάσαι τί απάντησε ο Αββάς Σισώης σε εκείνον τον μοναχό που του είπε ότι ο νούς του βρίσκεται συνέχεια κοντά στον Θεό; «Αυτό δεν είναι σπουδαίο· σπουδαίο είναι να έχης τον εαυτό σου ''υποκάτω πάσης της κτίσεως"»[130].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς μπορεί, Γέροντα, να νιώθη κανείς τον εαυτό του «υποκάτω πάσης της κτίσεως»[131];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μια μέρα, εξετάζοντας τον εαυτό μου, προσπαθούσα να βρώ με ποιό ζώο θα μπορούσα να τον παρομοιάσω και έφθασα στο σκαθάρι. Όταν όμως πρόσεξα τί κάνει, είδα ότι είμαι χειρότερος από αυτό. Ξέρεις τί κάνει το σκαθάρι; Την κοπριά που βρίσκει στον δρόμο την κόβει κομματάκια, την κάνει μπαλάκια, την κυλάει προς τα έξω και καθαρίζει τον δρόμο[132]. Βλέποντας λοιπόν το έργο του, είπα στον εαυτό μου: «Είσαι χειρότερος ακόμη και από το σκαθάρι, γιατί αυτό, ένα τόσο μικρό ζωύφιο, καθαρίζει από τις κοπριές τον δρόμο, ενώ εσύ, που ο Θεός σε έκανε άνθρωπο, με τις αμαρτίες σου μαζεύεις κοπριά στον «Ναό του Θεού"[133]». Θέλω να πώ, όσο ο άνθρωπος σκέφτεται τις ευεργεσίες του Θεού και βλέπει ότι δεν ανταποκρίνεται, όλο και πιο ένοχο νιώθει τον εαυτό του και αισθάνεται χειρότερος από όλους τους ανθρώπους, χειρότερος από όλα τα ζώα, χειρότερος και από αυτόν τον διάβολο ακόμη. Λέει στον εαυτό του: «Ο διάβολος με τον λογισμό του αμάρτησε μια φορά, εγώ όμως αμαρτάνω κάθε μέρα και με τον λογισμό και με τις αισθήσεις. Άρα είμαι χειρότερος και από αυτόν».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν είναι επικίνδυνο να σκεφθή κάποιος ότι είναι χειρότερος από τον διάβολο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Επικίνδυνο είναι μόνο για έναν άνθρωπο που δεν έχει την πνευματική παλληκαριά και απογοητεύεται εύκολα. Αυτός πρέπει να λέη στον διάβολο: «Ό,τι κι αν είμαι, από σένα καλύτερος είμαι. Επομένως δεν θα με αφήση ο Χριστός· ελπίζω ότι θα με σώση». Ένας όμως που έχει παλληκαριά, μπορεί να πή: «Ο διάβολος κάνει καλά την δουλειά του, εγώ όμως τί κάνω;».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Ταπείνωση, η μεγάλη δύναμη της πνευματικής ζωής
- type: h2
  initial:
    ru: ''
  text:
    ru: Όπου υπάρχει ταπείνωση, δεν έχει θέση ο διάβολος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στο βιβλίο «Αγιορείτες Πατέρες» αναφέρετε ότι οι δαίμονες έδειραν τον Γερο-Ευλόγιο[134]. Πώς το επέτρεψε ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιός έφαγε το ξύλο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Γερο-Ευλόγιος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, οι δαίμονες έφαγαν το ξύλο! Και στην περίπτωση που επιτρέπει ο Θεός ένας άνθρωπος να δείρη κάποιον άλλον και αυτός το δέχεται ταπεινά, τελικά σακατεύεται εκείνος που δέρνει. Δεν μου λές, ο διάβολος τί φοβάται περισσότερο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Την ταπείνωση, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κι εγώ νόμιζα ότι φοβάται την υπερηφάνεια, γιατί νιώθει ...κόμπλεξ! «Περήφανος εγώ, λέει, περήφανος και αυτός, που θα πάη;»! Ναί, βρέ παιδί, έτσι είναι, την ταπείνωση φοβάται ο διάβολος· αυτή τον σακατεύει. Όπου υπάρχει ταπείνωση, δεν μπορεί να σταθή ο διάβολος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με την ταπείνωση φωτίζεται ο άνθρωπος και δεν σκοντάφτει ποτέ στην πνευματική του πορεία· ξεπερνάει όλα τα εμπόδια που του βάζει ο πειρασμός. Θυμάστε τον Μέγα Αντώνιο που είδε τις παγίδες του διαβόλου απλωμένες σε όλη την γή; «Ποιός μπορεί να γλυτώση απ᾿ αυτές;», φώναξε. Και αμέσως άκουσε μια φωνή να του λέη: «Η ταπεινοφροσύνη»[135].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στο Σινά, το ασκητήριο της Αγίας Επιστήμης, όπου έμενα, ήταν ένα αμπρί[136], που είχε ένα εκκλησάκι και ένα κελλάκι.Από την πάνω μεριά ήταν το βουνό· από την κάτω ήταν ένας τοίχος, που είχε ύψος τέσσερα με πέντε μέτρα. Εκεί σε μια άκρη είχα βάλει ένα ξύλο και εκεί πάνω πλάνιζα τα σανιδάκια για τα ξυλόγλυπτα εικονάκια που έκανα. Μια μέρα λοιπόν εκεί που πλάνιζα λέγοντας την ευχή, ακούω μια φωνή να μου λέη: «Μπορείς να πέσης κάτω από τον τοίχο και να μην πάθης τίποτε». Γυρνάω και βλέπω μια μαύρη σκιά με ένα μεγάλο κεφάλι. «Βρέ το ταγκαλάκι», λέω. Τέλος πάντων, δεν έδωσα σημασία. Αυτό όμως εκεί! δεν έφευγε. «Μπορείς να πέσης κάτω και να μην πάθης τίποτε», έλεγε. Εγώ έκανα πώς δεν άκουγα. Για κανένα τέταρτο επαναλάμβανε το ίδιο. Απόλαυση ήταν! Οπότε κάποια στιγμή του λέω: «Άντε, θα πετάξω κάτω μια πέτρα». «Αυτό, μου λέει, ούτε ο Χριστός δεν το σκέφθηκε[137]! Καλύτερα κι απ᾿ τον Χριστό απάντησες!». Έ, τότε αγανάκτησα. «Ο Χριστός ήταν Θεός, του λέω, δεν ήταν καραγκιόζης σαν κι εμένα που κάθομαι και χαζεύω εσένα. Άντε από ᾿δώ!». Αυτό ήταν. Αμέσως εξαφανίσθηκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν υπάρχη ταπείνωση, ο διάβολος δεν μπορεί να ρίξη την ψυχή. Ο ταπεινός δεν πέφτει, γιατί βαδίζει χαμηλά. Ο Γερο-Αββακούμ, όταν ασκήτευε στην έρημο της Βίγλας, τί είχε πάθει! Μια μέρα που έκανε προσευχή με το κομποσχοίνι επάνω σ᾿ έναν βράχο, του παρουσιάζεται ξαφνικά ο διάβολος ως «άγγελος φωτός»[138]. «Αββακούμ, του λέει, με έστειλε ο Θεός να σε πάρω στον Παράδεισο, γιατί έγινες πια άγγελος· έλα να πετάξουμε». «Μά εσύ έχεις φτερά, του λέει ο Γερο-Αββακούμ, εγώ πώς θα πετάξω;». Και ο δήθεν άγγελος του λέει: «Κι εσύ έχεις φτερά, αλλά δεν τα βλέπεις». Τότε ο Γερο-Αββακούμ έκανε τον σταυρό του και είπε: «Παναγία μου, τί είμαι εγώ, για να πετάξω;». Αμέσως ο δήθεν άγγελος έγινε ένα μαύρο παράξενο κατσίκι με φτερά σαν της νυχτερίδας και εξαφανίσθηκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπετε πώς με την ταπείνωση μπορούμε να καταλάβουμε τις παγίδες του διαβόλου;
- type: h2
  initial:
    ru: ''
  text:
    ru: Πνευματική πρόοδος υπάρχει όπου υπάρχει πολλή ταπείνωση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς ένας άνθρωπος αλλάζει σε έναν μήνα, και άλλος αγωνίζεται χρόνια και προκοπή δεν κάνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσείς τί λέτε; Πώς γίνεται αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου λέει ο λογισμός πώς, αν ο άνθρωπος ταπεινωθή και ζητήση το έλεος του Θεού, τον βοηθάει ο Θεός και προοδεύει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό είναι. Ταπείνωση χρειάζεται. Πνευματική πρόοδος υπάρχει όπου υπάρχει πολλή ταπείνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι βρήκαν τον δρόμο της ταπεινοφροσύνης,  προχωρούν στην πνευματική ζωή σύντομα, σταθερά και χωρίς κόπο. Ακόμη δεν έχουμε καταλάβει την ταπείνωση, αυτήν την μεγάλη δύναμη! Όλη η πρόοδος εκεί βρίσκεται. Όσο κανείς ταπεινώνεται, τόσο χαριτώνεται από τον Θεό και τόσο πιο πολύ προοδεύει. Πόση δύναμη έχει η ταπείνωση, και όμως δεν την αξιοποιούν οι άνθρωποι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια ταπεινή ψυχή έχει πιο εύκολο πνευματικό αγώνα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και βέβαια, γιατί ο ταπεινός με λίγο σπρώξιμο τρέχει πολύ. Πάρε μια μπίλια· κάν᾿ την έτσι, κυλάει· κάν᾿ την αλλιώς, πάλι κυλάει, γιατί δεν έχει εξογκώματα, για να σκαλώνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχει περίπτωση προσπαθώντας κανείς να καλλιεργήση την ταπείνωση να ταπεινώνη συνέχεια τον εαυτό του και τελικά να πέση στην απόγνωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, γιατί η πραγματική ταπείνωση φέρνει ελπίδα, όχι απελπισία. Απελπισία φέρνει ο εγωισμός, γιατί ο εγωιστής στηρίζεται στον εαυτό του, ενώ ο ταπεινός ελπίζει στο έλεος του Θεού. Μέσα από την συντριβή της ταπεινώσεως σιγά-σιγά αναπτύσσεται ο πνευματικός άνθρωπος. Όλη η ζωή του ανθρώπου μετά είναι ένας μεγάλος και φιλότιμος αγώνας, αλλά πάντα προχωρεί με μεγάλη ελπίδα στον Θεό, απογοητευμένος από τον εαυτό του με την καλή έννοια, απογοητευμένος δηλαδή από το εγώ του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, την ελπίδα στο έλεος του Θεού την νιώθει και ένας άνθρωπος που δεν έχει καλή πνευματική κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Και που ξέρει κανείς αν έχει καλή πνευματική κατάσταση; Ο άνθρωπος ένα μόνον μπορεί να ξέρη: ότι δεν έχει καλή πνευματική κατάσταση. Ακόμη και να έχη, δεν την βλέπει, επειδή και τότε μόνον την αμαρτωλότητά του βλέπει. Γιατί όποιος αγωνίζεται για την πρόοδο την πνευματική, ποτέ δεν βλέπει την πρόοδό του· μόνον τις πτώσεις του βλέπει.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι ταπεινοί διαφυλάσσουν τον πνευματικό τους πλούτο στο θησαυροφυλάκιο του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βλέπω ότι δεν αγαπώ την αφάνεια. Μήπως γι᾿ αυτό νιώθω μέσα μου άδεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ μόνο για σαλή δεν κάνεις!... Εκεί θέλει πολλή ταπείνωση. Κοίταξε, αν θέλης να αγαπήσης την αφάνεια, διάβασε τον βίο της Οσίας Ισιδώρας[139], για να γνωρίσης τα φλωριά της Αγίας, τις αρετές της, να πετάξης τα δικά σου τα κάλπικα, τα μπακιρένια, και στο εξής να μαζεύης χρυσαφένια και να τα κρύβης στην καρδιά σου και να τα κλειδώνης καλά, για να μην τα κλέψη το ταγκαλάκι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι δια Χριστόν Σαλοί δεν έχουν μέσα τους κενό, αλλά ξεχείλισμα από το πολύ γέμισμα της αγάπης του Θεού. Είναι μεγάλοι Άγιοι. Λένε μεν μπανταλομάρες, αλλά στην πραγματικότητα λένε σωστές συμβουλές με πολύ βάθος. Έχουν πολύ μεγάλη ταπείνωση· δεν λογαριάζουν καθόλου τον εαυτό τους. Γι᾿ αυτό και ο Θεός τους αξιώνει να γνωρίσουν τα θεία μυστήρια και να αποκτήσουν πολλά χαρίσματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μερικοί Φαρασιώτες[140], ενώ έβλεπαν τον Άγιο Αρσένιο να κάνη τόσα θαύματα, δεν τον καταλάβαιναν και τον παρεξηγούσαν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι Άγιοι περισσότερο αγώνα έκαναν, για να κρύψουν τον πνευματικό τους πλούτο, παρά για να τον αποκτήσουν. Και ο Άγιος Αρσένιος κάλυπτε τις αρετές του με διάφορα εξωτερικά καπιά[141], και ήταν επόμενο οι εξωτερικοί άνθρωποι να μην τον «βλέπουν» και να τον παρεξηγούν από τα εξωτερικά καπιά, δηλαδή τις προσποιητές ιδιοτροπίες που έβλεπαν. Προσπαθούσε δηλαδή πάντοτε ο Άγιος να παρουσιάζη στους ανθρώπους το αντίθετο της κάθε αρετής του, για να αποφύγη τον θαυμασμό τους. Όσοι φυσικά είχαν κρυμμένες αρετές, καταλάβαιναν πόσο θησαυρό έκρυβε ο Άγιος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι ταπεινοί και αφανείς ήρωες του Χριστού είναι οι εξυπνότεροι του κόσμου, διότι κατορθώνουν να φυλάσσουν τον πνευματικό τους θησαυρό στο θησαυροφυλάκιο του Θεού. Γι᾿ αυτό μεγάλη χαρά να νιώθουμε, όταν ζούμε στην αφάνεια, γιατί τότε θα δούμε πρόσωπο Θεού στην άλλη ζωή και θα νιώθουμε και απ' αυτήν την ζωή την παρουσία Του δίπλα μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Δεύτερο Μέρος – Αγάπη Πνευματική
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ο πνευματικός άνθρωπος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: δίνει την αγάπη του πρώτα στον Θεό,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: έπειτα στους ανθρώπους,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί την υπερχείλιση της αγάπης του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν δίνει στα ζώα και σε όλη την κτίση».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η ανεξάντλητη αγάπη του Θεού και η αγάπη μας προς τον Θεό
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός μας «βομβαρδίζει» με την αγάπη Του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές αισθάνομαι έντονα την αγάπη του Θεού και πονώ βλέποντας την δική μου αχαριστία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εύχομαι να ανταποκριθής στις πολλές ευεργεσίες του Θεού. «Το έλεός Σου, Κύριε, καταδιώξει με πάσας τας ημέρας της ζωής μου»[142], έλεγε ο Δαβίδ. Να το λές κι εσύ, γιατί είναι αλήθεια ότι αυτό συμβαίνει και σ᾿ εσένα· αλλά και πάλι είναι αλήθεια ότι το αναγνωρίζεις και ευχαριστείς και δοξολογείς τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος αναγνωρίζη την αγάπη του Θεού, τότε και ο Θεός τον ...«βομβαρδίζει» με την αγάπη Του. Ίσως παραξενευθήτε με την λέξη «βομβαρδίζει», αλλά, για να διαλυθή το πουρί ή ο γρανίτης που είναι γύρω από την καρδιά μας, χρειάζονται βόμβες θεϊκές που να έχουν ως ύλη εκρηκτική την αγάπη του Θεού. Όταν πια διαλυθή ο σκληρός αυτός φλοιός, τότε η καρδιά γίνεται ευαίσθητη και ο άνθρωπος συγκινείται ακόμη και από τις πιο μικρές ευεργεσίες του Θεού. Αισθάνεται καταχρεωμένος στον Θεό και είναι συνέχεια κατασυγκινημένος, διότι, ενώ σκέφτεται πώς να ξεχρεωθή, ο Θεός του δίνει όλο και περισσότερες ευλογίες, μέχρι που λειώνει η ψυχή η φιλότιμη από την αγάπη Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί μας αγαπάει τόσο πολύ ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί μας έχει παιδιά Του· περισσότερα δεν μπορώ να σάς πώ!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εάν κανείς, παρόλο που αγωνίζεται, έχη συνεχώς τις ίδιες πτώσεις, δεν δυσαρεστεί τον Θεό, δεν Τον απογοητεύει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως ο Θεός περιμένει προκοπή από μάς; Όχι. Είμαστε όμως παιδιά Του και μας αγαπάει όλους το ίδιο. Είδα μια φορά κάποιον πατέρα, που είχε κι ένα χαζούλικο παιδάκι που έτρεχαν οι μύξες του και τις σκούπιζε με τα μανίκια του, αλλά το έσφιγγε και αυτό στην αγκαλιά του και το φιλούσε και το χάιδευε όπως και τα άλλα. Έτσι και ο Θεός σαν Καλός Πατέρας δεν αγαπάει μόνον τα χαριτωμένα παιδιά Του, αλλά και τα πνευματικά αδύνατα, για τα οποία μάλιστα πονάει και ενδιαφέρεται περισσότερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κανείς δεν μπορεί να συλλάβη πόσο αγαπάει ο Θεός τον άνθρωπο! Η αγάπη Του δεν συγκρίνεται με τίποτε! Δεν έχει όρια! Είναι τόσο μεγάλη πού, κάτι ελάχιστο αν αισθανθή ο άνθρωπος από την αγάπη αυτήν, η πήλινη καρδιά του δεν μπορεί να την αντέξη· διαλύεται, γιατί είναι πηλός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Θεός πολλές φορές επιτρέπει να πέση άφθονη η αγάπη Του στα πλάσματά Του και τότε η ψυχή μας θερμαίνεται και βλέπουμε ότι είναι τόσο γλυκειά η θεία αγάπη, τόσο μεγάλη, που δεν την αντέχουμε και φθάνουμε στο σημείο να πούμε: «Θεέ μου, φθάνει! Ελάττωσε λίγο την αγάπη Σου, γιατί δεν την αντέχω». Με αυτόν τον τρόπο ο Θεός θέλει να μας δείξη ότι από μέρους Του υπάρχει όλη η διάθεση να μας δώση άφθονη την αγάπη Του, αλλά δεν το κάνει, γιατί η μπαταρία μας είναι μικρή. Χρειάζεται να την μεγαλώσουμε, ώστε να χωράη περισσότερη θεία αγάπη, γιατί το θείο ρεύμα της αγάπης του Θεού έρχεται σ᾿ εμάς ανάλογα με την χωρητικότητά μας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα αυξηθή αυτή η χωρητικότητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όσο θα καθαρίζεται η καρδιά μας, τόσο θα αυξάνεται η χωρητικότητά της και τόσο θα δεχώμαστε την θεϊκή αγάπη, η οποία είναι απεριόριστη και αχώρητη και ανεξάντλητη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ηκαλή μοιρασιά της αγάπης
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, η αγάπη μου προς έναν Άγιο να ελαττώση την αγάπη μου προς τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, γιατί, όταν κανείς έχη μεγάλη ευλάβεια για έναν Άγιο και τον αγαπά πολύ, εκεί κρύβεται η μεγάλη αγάπη και ευλάβεια προς τον Τριαδικό Θεό και προς την Παναγία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος τιμάει τους Αγίους, αναμφιβόλως τιμάει πολύ περισσότερο την Παναγία. Όπως, επίσης, αυτός που τιμάει πολύ την Παναγία, φυσικά, τιμάει περισσότερο την Παναγία Τριάδα. Και βλέπεις, όταν έχης επαφή με έναν Άγιο και νιώθης μεγάλη ευγνωμοσύνη προς αυτόν, θα μπορούσες ακόμη και να θυσιασθής γι᾿ αυτόν. Αλλά, αν θυσιαζόσουν για έναν Άγιο, πάλι για τον Θεό δεν θα θυσιαζόσουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αγάπη προς τον Χριστό, προς την Παναγία, προς τους Αγίους είναι μεγάλη υπόθεση. Είναι μια αγάπη που δεν συγκρίνεται με καμμιά άλλη αγάπη. Είναι σίγουρη· βρίσκεις ανταπόκριση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί κανείς να αγαπάη τον Θεό και να μην αγαπάη τους ανθρώπους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, γιατί, όταν αγαπάς τον Θεό, δεν είναι δυνατόν να μην αγαπάς την εικόνα του Θεού, τον άνθρωπο. Η αγάπη μας προς τον Θεό φέρνει την αγάπη προς τον πλησίον, διότι όποιος πλησιάζει στον Θεό είναι πλησίον όλων των ανθρώπων, όπως και οι Άγιοι. Αλλά και στην αγάπη μας προς τον πλησίον κρύβεται η μεγάλη αγάπη μας προς τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν δώση κανείς την καρδιά του στον Θεό, όλα τα αγαπάει· όχι μόνον όλους τους ανθρώπους, αλλά και τα πουλιά και τα δένδρα, ακόμη και τα φίδια. Τότε προσκυνάει με ευλάβεια όχι μόνον τον Θεό και τους Αγίους αλλά και τις εικόνες του Θεού, τους ανθρώπους. Κι όλα τα δημιουργήματα, μεγάλα ή μικρά, πολύτιμα ή ασήμαντα πετραδάκια και ξυλάκια, τα παίρνει με ευλάβεια και τα ασπάζεται, σαν ευλογία από τον Δημιουργό του, όπως ασπάζεται κανείς ένα μικρό ή μεγάλο αντικείμενο που παίρνει ευλογία από κάποιο σεβαστό του πρόσωπο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η άνοδος στους Ουρανούς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς φθάνει ο άνθρωπος στον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δύο περιπτώσεις υπάρχουν για να μπορέση να ανεβή κανείς εκεί ψηλά στον Θεό και να Τον «κάμψη» να κατεβή και να μένη μαζί του. Η πρώτη περίπτωση είναι η ειλικρινής μετάνοια και αφορά τους πολύ αμαρτωλούς. Όταν συναισθάνωνται τις μεγάλες τους πτώσεις και ταπεινώνωνται πολύ, ο Θεός για την μεγάλη τους αυτή ταπείνωση τους αγαπάει πολύ και τους υψώνει μέχρι τους Ουρανούς. «Μεγάλη χαρά γίνεται στους Ουρανούς για έναν άνθρωπο που μετανοεί»[143], λέει το Ευαγγέλιο. Τότε φυσικά και οι αμαρτωλοί αγαπούν τον Θεό πολύ, διότι πολύ χρέος τους χάρισε. Η δεύτερη περίπτωση είναι η εξής: Όταν ο άνθρωπος φυλαχθή καθαρός από θανάσιμες αμαρτίες, πρέπει να ευχαριστή τον Καλό Θεό που τον φύλαξε από μικρό παιδάκι και δεν λερώθηκε το ένδυμα της ψυχής του. Κι εσύ, αν δεν σε εφύλαγε από μικρή ο Χριστός σαν το κλωσσοπούλι κάτω από τα φτερά Του, ίσως να ήσουν σήμερα η πιο αμαρτωλή του κόσμου. Γι᾿ αυτό να δοξολογής μέρα-νύχτα τον Καλό Θεό για την μεγάλη Του αυτή δωρεά και να ξεσπάς σε δάκρυα χαράς και ευγνωμοσύνης προς Αυτόν. Αυτά τα δάκρυα έχουν την ίδια δύναμη – ή και μεγαλύτερη – με τα δάκρυα της μετανοίας και τότε υψώνεται ο άνθρωπος στους Ουρανούς, φθάνει στον Θεό και Τον δοξολογεί συνέχεια όπως οι Άγγελοι. Κι ενώ ζη στην γή, είναι σαν να ζη στον Ουρανό. Όλη η ζωή του τότε είναι μία δοξολογία και τον θάνατο τον περιμένει με δοξολογία, γιατί σκέφτεται ότι θα πάη πια κοντά στον Θεό μονίμως, που είναι ο προορισμός του. Τότε ξεσπάει στην πιο μεγάλη δοξολογία «Δόξα σοι τω δείξαντι το φώς...».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να δώσουμε την αγάπη μας στον Χριστό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς πρέπει να εργασθώ, για να αγαπήσω τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να αγαπήσης τον Θεό, πρέπει να ξεκινήσης από την θυσία. Όταν ο άνθρωπος δεν υπολογίζη τον εαυτό του και θυσιάζεται, τότε τα πράγματα πάνε κανονικά: αγαπάει τον πλησίον του, αγαπάει τον Θεό. Όσοι λένε ότι αγαπούν τον Θεό, αλλά δεν κάνουν μια θυσία για τον πλησίον τους, «ηγάπησαν τον Θεόν εν τω στόματι αυτών και τη γλώσση αυτών εψεύσαντο Αυτώ»[144].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς αυξάνεται η αγάπη προς τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να έχετε τον νού σας συνέχεια στον Θεό, να σκέφτεσθε τον Θεό. Να λέτε την ευχή, να μιλάτε με τον Θεό. Όταν ο άνθρωπος κάνη αυτήν την εργασία, κατ᾿ αρχάς νιώθει λίγο την αγάπη του Θεού και αργότερα, όσο προχωράει, την νιώθει όλο και πιο πολύ. Ο νούς του βρίσκεται μόνιμα πλέον στον Θεό, και δεν τον συγκινεί τίποτε το γήινο και μάταιο. Στην καρδιά του φουντώνει η αγάπη προς τον Θεό, γεμίζει και δεν θέλει πια να σκέφτεται τίποτε άλλο εκτός από τον Θεό. Αδιαφορεί για όλα τα του κόσμου και σκέφτεται συνέχεια τον Ουράνιο Πατέρα. Βλέπεις, όσοι ασχολούνται με εφευρέσεις, απορροφούνται από την επιστήμη. Που είναι όμως η δική μας απορρόφηση από τον Χριστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί μας λείπει, Γέροντα, και δεν αναζητούμε με τέτοιο ζήλο τον Χριστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τίποτε δεν μας λείπει. Μυαλό έχουμε, ηλικία έχουμε. Ο εαυτός μας είναι το εμπόδιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν δεν πετάξουμε τον εαυτό μας, πώς θα μπή μέσα μας ο Χριστός; Αν πετάξουμε τον εαυτό μας και φύγη ο κακός ενοικιαστής, ο παλαιός άνθρωπος, θα κατοικήση στο κενό της καρδιάς ο καινός άνθρωπος της Καινής Διαθήκης και θα γεμίση ο ναός μας, όλη η ύπαρξή μας, από αγάπη, γιατί θα φιλοξενήται μέσα μας η Αγάπη, ο Χριστός. Τότε πια η καρδιά γίνεται καμπάνα και χτυπάει συνέχεια χαρμόσυνα και τόσο δυνατά, που κοντεύουν να σπάσουν οι τσατμάδες – τα κόκκαλα των πλευρών –, οι οποίοι είναι σουβαντισμένοι με πηλό, που έγινε σάρκα με την διαταγή του Θεού. Κι αν βρεθής στην έρημο και δεν υπάρχη ναός, τότε ναός είναι το σώμα σου και καμπάνα η καρδιά σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος δώση την καρδιά του στον Θεό, τότε και τα μυαλά του ανθρώπου είναι παρμένα από την αγάπη του Θεού και η καρδιά του σκιρτάει συνέχεια· νιώθει το κεφάλι του ελαφρό και το σώμα του σαν πούπουλο. Και όταν η αγάπη του Θεού είναι περισσότερη από την χωρητικότητα της καρδιάς, το χτύπημα της καρδιάς ακούγεται και στους γύρω του, γιατί σ᾿ αυτήν την κατάσταση συμμετέχει και το σώμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια καρδιά τόσο μικρή και μπορεί να αγαπάη τόσο πολύ! Κι αν είναι τόση η αγάπη του ανθρώπου για τον Θεό, σκεφθήτε τί είναι η αγάπη του Θεού! Εννοώ σε ποσότητα, γιατί σε ποιότητα είναι ίδια η αγάπη του Θεού με την δική μας, όταν και η δική μας είναι πνευματική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τί μεγάλο κακό κάνουμε οι περισσότεροι άνθρωποι να μη θέλουμε να δώσουμε την αγάπη μας στον Χριστό, αλλά να την χαραμίζουμε σε γήινα, φθηνά και μάταια πράγματα! Μια ζωή ακόμη και χιλίων ετών, και χίλιες καρδιές να έχη κανείς, δεν φθάνουν για να τις δώση στον Χριστό για την μεγάλη αγάπη που μας έδειξε και που μας δείχνει και στην συνέχεια: μας συγχωρεί, μας ανέχεται και καθαρίζει τις βρώμικες ψυχές μας με το θεϊκό Του αίμα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η φλόγα της αγάπης του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί δεν αγαπώ τον Θεό όπως έναν άνθρωπο που αγαπώ πολύ και θέλω να είμαι κοντά του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό έρχεται σιγά-σιγά μετά από αγώνα· αλλιώς θα έπιαναν φωτιά οι άνθρωποι και θα καίγονταν από την αγάπη του Θεού. Ενώ θα είχε γύρω τους κρύο, θα νόμιζαν ότι φλογίζονται και πολλοί θα έπαιρναν τα βουνά. Ένας στρατιώτης, εν καιρώ πολέμου, άφησε την μονάδα του και έφυγε στο βουνό. Είχε ανάψει τέτοια φλόγα στην καρδιά του που δεν μπορούσε να συγκρατηθή· ήθελε να πάη να προσευχηθή. Δεν υπολόγισε τίποτε. Πήγε, βρήκε μια σπηλιά, μπήκε μέσα και προσευχόταν! Όταν οι άλλοι στρατιώτες βγήκαν στις επιχειρήσεις, τον βρήκαν και τον έπιασαν. «Ανυπότακτος», είπαν. Τον κάλεσε μετά ο διοικητής σε ανάκριση. «Τί είναι αυτό που έκανες;», του λέει. «Καίγομαν, κύριε διοικητά, καίγομαν για τον Χριστό. Ξέρεις τί θα πη καίγομαν;». «Καλά, εγώ δεν καίγομαι;», του λέει ο διοικητής. «Εγώ καίγομαι, κύριε διοικητά, καταλαβαίνετε;», επανέλαβε εκείνος, σαν να έλεγε: «Αν καίγεσαι, φύγε κι εσύ»! Τον βοήθησε όμως ο Θεός και γλύτωσε το στρατοδικείο. Εδώ, εν καιρώ ειρήνης αν φύγη ένας στρατιώτης από την θέση του, έχει στρατοδικείο, πόσο μάλλον εν καιρώ πολέμου[145]!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν βρίσκεται κανείς σ᾿ αυτήν την κατάσταση, υπάρχει θέρμη σε όλο το σώμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά περισσότερο στην περιοχή του στήθους. Όταν ανάψη η πνευματική αγάπη, φλογίζεται όλο το στήθος. Όλο το στήθος γίνεται μια φλόγα. Καίγεται ο άνθρωπος από την μεγάλη γλυκειά φλόγα της αγάπης του Θεού, πετάει, αγαπάει με αγάπη πραγματική, μητρική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτή η εσωτερική φλόγα, την οποία ανάβει ο Ίδιος ο Χριστός με την αγάπη Του, θερμαίνει το σώμα πολύ περισσότερο από την αισθητή φωτιά και έχει την δύναμη να καίη και κάθε σκουπίδι, κάθε κακό λογισμό που πετάει το ταγκαλάκι, καθώς και κάθε κακή επιθυμία και κάθε άσχημη εικόνα. Τότε η ψυχή αισθάνεται και τις θείες ηδονές που δεν συγκρίνονται με καμμιά άλλη ηδονή!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Άχ, αυτή η φλόγα δεν μπήκε ακόμη μέσα σας! Αν ανάψη και φουντώση στην καρδιά σας, δεν θα σάς συγκινούν καθόλου πια τα μάταια πράγματα. Εύχομαι να κάψη ο Θεός με την αγάπη Του τις καρδιές σας!
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο θείος έρως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο θείος έρως είναι η αγάπη για τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο θείος έρως είναι κάτι ανώτερο από την αγάπη για τον Θεό· είναι τρέλλα. Αγάπη-έρως-τρέλλα, όπως φθόνος-μίσος-φόνος. Η ακριβή αγάπη προς τον Θεό, με τις θυσίες της, γλυκοβράζει την καρδιά, και σαν τον ατμό πετιέται ο θείος έρως, ο οποίος δεν μπορεί να συγκρατηθή, και ενώνεται με τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο θείος έρως λυγίζει τα σκληρά κόκκαλα και γίνονται τόσο μαλακά, που ο άνθρωπος δεν μπορεί να σταθή όρθιος, πέφτει κάτω! Γίνεται σαν την λαμπάδα που βρίσκεται σε θερμό χώρο και δεν μπορεί να σταθή όρθια· πότε λυγίζει από εδώ, πότε λυγίζει από εκεί. Την σιάζεις, αλλά πάλι λυγίζει, πάλι πέφτει, γιατί είναι θερμός ο χώρος, πολύ θερμός... Όταν κανείς βρίσκεται σ᾿ αυτήν την κατάσταση και πρέπη να πάη κάπου ή να κάνη κάποια δουλειά, δεν μπορεί· παλεύει, προσπαθεί να βγή από αυτήν την κατάσταση...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν βρίσκεται κανείς στην κατάσταση του θείου έρωτος, αν πονάη, το αισθάνεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο πόνος, αν είναι πολύ δυνατός, μετριάζεται και γίνεται υποφερτός· αν είναι λίγος, χάνεται. Βλέπεις, όσοι είναι ερωτευμένοι, συνεπαίρνονται τελείως, ούτε ύπνος τους πιάνει. Μου έλεγε ένας μοναχός: «Γέροντα, ο αδελφός μου έχει ερωτευθή μια γύφτισσα, και ούτε να κοιμηθή μπορεί. Συνέχεια «Παρασκευούλα μου, Παρασκευούλα μου» λέει. Μάγια του έχουν κάνει; δεν ξέρω! Εγώ τόσα χρόνια καλόγερος, δεν αγαπώ την Παναγία ούτε όσο αγαπάει ο αδελφός μου αυτήν την γύφτισσα! Καθόλου να μη σκιρτάη η καρδιά μου!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δυστυχώς υπάρχουν πνευματικοί άνθρωποι που σκανδαλίζονται με την λέξη «θείος έρως». Δεν έχουν καταλάβει τί θα πη «θείος έρως» και θέλουν να βγάλουν την λέξη αυτή από τα Μηναία και από την Παρακλητική, γιατί λένε ότι σκανδαλίζει. Που φθάσαμε! Αντίθετα, οι κοσμικοί που έχουν ζήσει τον κοσμικό έρωτα, αν τους μιλήσης για θείο έρωτα, αμέσως λένε: «Κάτι ανώτερο θα είναι αυτό». Πόσα παιδιά που γνώρισαν τον κοσμικό έρωτα τα φέρνω αμέσως σε λογαριασμό, όταν τους μιλώ για τον θείο έρωτα! «Εσείς πέσατε κάτω καμμιά φορά από την αγάπη που νιώσατε; τα ρωτάω. Νιώσατε ποτέ εσείς έτσι που να μην μπορήτε να κουνηθήτε, να μην μπορήτε να κάνετε τίποτε;». Αμέσως καταλαβαίνουν ότι αυτό είναι κάτι ανώτερο και συνεννοούμαστε. «Αν εμείς, λένε, από αυτό το κοσμικό κάτι νιώθουμε, φαντάσου τί θα είναι εκείνο το ουράνιο!».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η θεία τρέλλα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς μπορείς να παλαβώσης, Γέροντα, από την αγάπη του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να συναναστρέφεσαι με ...παλαβούς, για να σού μεταδώσουν την τρέλλα τους την πνευματική! Θα εύχωμαι να σε δώ ...θεότρελλη! Αμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχω κι εγώ μια μικρή πείρα από την πνευματική τρέλλα, η οποία προέρχεται από τον θείο έρωτα. Φθάνει τότε ο άνθρωπος στην θεία αφηρημάδα και δεν θέλει να σκέφτεται τίποτε εκτός από τον Θεό, τα θεία, τα πνευματικά, τα ουράνια. Ερωτευμένος πια θεϊκά, καίγεται εσωτερικά, γλυκά, και ξεσπάει εξωτερικά, παλαβά, μέσα στον θείο χώρο της σεμνότητος, δοξολογώντας σαν Άγγελος μέρα-νύχτα τον Θεό και Πλάστη του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι έκστασις αυτό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, είναι εκτός εαυτού τότε ο άνθρωπος, με την καλή έννοια. Αυτό είναι... «έκστηθι φρίττων ουρανέ»[146]!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η θεία τρέλλα βγάζει τον άνθρωπο έξω από την έλξη της γής· τον ανεβάζει στον θρόνο του Θεού, και νιώθει πια ο άνθρωπος τον εαυτό του σαν το σκυλάκι στα πόδια του αφεντικού του και του γλείφει τα πόδια με χαρά και ευλάβεια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η θεία μέθη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, φοβάμαι μήπως δεν σωθώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μη φοβάσαι· μαζί θα πάμε επάνω. Μόνο να πής στην Γερόντισσα να μας δώση δύο μεγάλα μπουκάλια για τον δρόμο – πρόσεξε να είναι πλαστικά, όχι γυάλινα, για να μη σπάσουν στο ταξίδι!... Θα τα γεμίσουμε νερό καί, μέχρι να ανεβούμε στον Ουρανό, από την κούραση θα το πιούμε! Μόνον τρία δάκτυλα θα αφήσουμε και θα παρακαλέσουμε τον Χριστό να το ευλογήση, να το κάνη κρασί και μετά θα το πιούμε και θα μεθύσουμε πνευματικά κοντά στον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιό είναι αυτό το νερό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι η αγάπη προς τον Χριστό και τους αδελφούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και η μέθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι η μέθη από το Άγιο Πνεύμα. Αυτοί που μεθούν από το Άγιο Πνεύμα, αγάλλονται συνέχεια από την στοργή του Θεού, του Πατέρα τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν μεθύση ο άνθρωπος πνευματικά με το ουράνιο κρασί, η ζωή του εδώ στην γη γίνεται μαρτυρική, με την καλή όμως έννοια. Αχρηστεύεται για τον κόσμο, αδιαφορεί για καθετί γήινο και όλα τα «θεωρεί σκύβαλα»[147]. Βλέπεις, όσοι πίνουν πολύ και μεθούν, μετά δεν νοιάζονται για τίποτε. «Μπαρμπα-Θανάση, το καλύβι σου καίγεται», φώναζαν σε κάποιο γεροντάκι που το καλύβι του είχε πάρει φωτιά. «Άσ᾿ το να καή», έλεγε αυτός, γιατί είχε πιεί και ήταν μεθυσμένος!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η άλλη μέθη, η ουράνια, είναι καλή, αλλά πρέπει να είναι κανείς συνέχεια εκεί, στο ατέλειωτο βαρέλι, το ουράνιο. Εύχομαι να βρήτε την παραδεισένια θεία κάνουλα και να πίνετε και να μεθάτε συνέχεια από το παραδεισένιο κρασί. Αμήν!
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η αγάπη προς τον πλησίον
- type: h2
  initial:
    ru: ''
  text:
    ru: Αγάπη και ταπείνωση, οι δυο αδελφωμένες αρετές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα σωθώ με τόσα πάθη που έχω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την αγάπη και την ταπείνωση. Μόλις αυξηθούν αυτές οι δύο αρετές, η υπερηφάνεια και η κακία θα μείνουν ατροφικές και τα πάθη θα αρχίσουν να ψυχορραγούν. Έτσι όλα τα πάθη σιγά-σιγά θα αφανισθούν και όλες οι άλλες αρετές θα έρθουν μόνες τους. Γι᾿ αυτό στρέψε όλες τις δυνάμεις σου στην αγάπη και στην ταπείνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αληθινή αγάπη είναι αγκαλιασμένη με την ταπείνωση σαν δύο αδέλφια δίδυμα, πολύ αγαπημένα. Η αγάπη δεν χωρίζει από την ταπείνωση. Μέσα στην αγάπη βρίσκεις την ταπείνωση και μέσα στην ταπείνωση βρίσκεις την αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για μένα όλη η βάση στην πνευματική ζωή είναι η αγάπη και η ταπείνωση. Όπου υπάρχει αγάπη, κατοικεί ο Χριστός, η Αγάπη, καί, όπου υπάρχει ταπείνωση, την Χάρη του Θεού την πιάνει το ενοικιοστάσιο[148]. Τότε παντού βασιλεύει ο Θεός και η γη μεταβάλλεται σε Παράδεισο. Ενώ, όπου λείπει η αγάπη και η ταπείνωση, εκεί κατοικεί το ταγκαλάκι, ο εχθρός, και ζουν από εδώ οι άνθρωποι μαζί του την κόλαση και συνέχεια χειροτερεύουν την θέση τους στην άλλη ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο ευκολώτερος δρόμος για να σωθούμε είναι η αγάπη και η ταπείνωση· γι᾿ αυτά θα κριθούμε. Αυτές οι δύο αρετές συγκινούν και κάμπτουν τον Θεό και ανεβάζουν το πλάσμα Του στον Ουρανό. Από τα διακριτικά αυτά – την ταπείνωση και την αγάπη – ξεχωρίζουν οι άγιοι Άγγελοι τα παιδιά του Θεού, τα παίρνουν με αγάπη, τα περνούν άφοβα από τα εναέρια τελώνια[149]και τα ανεβάζουν στον φιλόστοργο Πατέρα Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ακριβή αληθινή αγάπη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Κατ᾿ εμέ η αγάπη είναι τριών ειδών: η σαρκική αγάπη, η οποία είναι γεμάτη πνευματικά μικρόβια, η κοσμική αγάπη, η οποία είναι φαινομενική, τυπική, υποκριτική, δίχως βάθος, και η πνευματική αγάπη, η οποία είναι η αληθινή, η αγνή, η ακριβή αγάπη. Αυτή η αγάπη είναι αθάνατη· μένει «εις αιώνας αιώνων».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα καταλάβω, Γέροντα, αν έχω αληθινή αγάπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να το καταλάβης, να εξετάσης αν αγαπάς όλους τους ανθρώπους εξίσου κι αν όλους τους ανθρώπους τους θεωρείς καλύτερους από σένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχει ψυχρανθή η αγάπη μου για τον Θεό και για τον πλησίον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σπείρε την λίγη αγάπη που σού έμεινε, για να φυτρώση αγάπη, να μεγαλώση, να καρπίση και να θερίσης αγάπη. Μετά θα σπείρης την περισσότερη αγάπη που θα θερίσης, και σιγά-σιγά θα γεμίση το αμπάρι σου και δεν θα έχης που να την βάλης, γιατί, όσο σπέρνεις αγάπη, τόσο πιο πολύ αυξάνει. Ας πούμε, ένας γεωργός έχει ένα σακκουλάκι σπόρο και τον σπέρνει. Μετά μαζεύει τον καρπό και γεμίζει μία μεγάλη σακκούλα. Αν σπείρη ύστερα τον καρπό που έχει στην σακκούλα, θα γεμίση ένα σακκί. Και όταν μαζέψη πολύ σπόρο και τον σπείρη, θα γεμίση ένα αμπάρι. Ενώ, αν κρατήση τον σπόρο στο σακκουλάκι και δεν τον σπείρη, ο σπόρος θα σκουληκιάση. Πρέπει να πετάξη τον σπόρο στην γή, για να φυτρώση, να μεγαλώση και να κάνη καρπό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έτσι, θέλω να πώ, γίνεται και με την αγάπη. Για να αυξηθή η αγάπη, πρέπει να την δώσης. Όποιος όμως δεν δίνει έστω και την λίγη αγάπη που έχει, είναι σαν να έχη ένα απλόχερο[150]σπόρο, αλλά τον κρατάει και δεν τον σπέρνει. Αυτός είναι ο πονηρός δούλος που έκρυψε το τάλαντο[151].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ανάλογα με την αγάπη που θα προσφέρης, θα έχης να λάβης. Αν δεν δώσης αγάπη, δεν θα λάβης αγάπη. Βλέπεις, η μάνα δίνει συνέχεια στα παιδιά της, αλλά και συνέχεια παίρνει από τα παιδιά της, και συνέχεια αυξάνει η αγάπη της. Όταν όμως ζητάμε την αγάπη των άλλων αποκλειστικά για τον εαυτό μας και θέλουμε όλοι να μας δίνουν καί, όταν κάνουμε κάποιο καλό, σκεφτώμαστε την ανταπόδοση, δεν έχουμε ακριβή αλλά φθηνή αγάπη. Τότε αποξενωνόμαστε από τον Θεό και δεν λαμβάνουμε αγάπη ούτε από τον Θεό ούτε από τους ανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι έχουν κοσμική αγάπη μαλώνουν ποιός να αρπάξη περισσότερη αγάπη για τον εαυτό του. Όσοι όμως έχουν την πνευματική, την ακριβή, αγάπη, μαλώνουν ποιός να δώση περισσότερη αγάπη στον άλλον. Αγαπούν, χωρίς να σκέφτωνται αν τους αγαπούν ή δεν τους αγαπούν οι άλλοι, ούτε ζητούν από τους άλλους να τους αγαπούν. Θέλουν όλο να δίνουν και να δίνωνται, χωρίς να θέλουν να τους δίνουν και να τους δίνωνται. Αυτοί οι άνθρωποι αγαπιούνται απ᾿ όλους, αλλά πιο πολύ από τον Θεό, με τον Οποίο και συγγενεύουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αγάπη χωρίς αντιπαροχή! Να μην κάνουμε καλωσύνες, για να πάρουμε ευλογίες. Να καλλιεργήσουμε την αρχοντική, την ακριβή αγάπη, την οποία έχει ο Θεός, και όχι την φθηνή κοσμική αγάπη, η οποία έχει κάθε ανθρώπινη αδυναμία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δυσκολεύομαι να δώσω την αγάπη μου εκεί που δεν θα την εκτιμήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν έχεις πραγματική αγάπη, γι᾿ αυτό δυσκολεύεσαι. Όποιος έχει πραγματική αγάπη, δεν τον απασχολεί αν εκτιμήσουν την αγάπη του ή όχι. Την θυσία που κάνει για τον πλησίον του, επειδή την κάνει από καθαρή αγάπη, ούτε καν την θυμάται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς μπορώ, Γέροντα, να ξεχνώ το καλό που κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ρίξ᾿ το στο γιαλό... Έτσι θα το ξεχνάς. Αλλά και το κακό που σού κάνουν, κι αυτό να το ξεχνάς. Με αυτόν τον τρόπο θα συγκεντρώσης έναν πλούτο πνευματικό, χωρίς καν να το αντιληφθής.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να βγάζουμε τον εαυτό μας από την αγάπη μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιό είναι το μέτρο της αγάπης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το «αγαπάτε αλλήλους, καθώς εγώ ηγάπησα υμάς»[152]. Με αυτό ο Χριστός εννοεί ότι πρέπει πάντοτε να θυσιαζώμαστε για τους άλλους, όπως Εκείνος θυσιάσθηκε για μάς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, μέσα στην θυσία να υπάρχη θέλημα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, μπορεί. Θυμάμαι – λαϊκός ήμουν ακόμη –, κάποιος Κονιτσιώτης αμέσως μετά την Ανάσταση έλεγε εις επήκοον πάντων: «Θα πάω πάνω στο μοναστήρι, στην Παναγία, να ανάψω τα καντήλια». Με τον τρόπο όμως που το έλεγε, έβλεπες ότι είχε υπερηφάνεια, θέλημα... Πήγαινε λοιπόν την νύχτα πάνω στο μοναστήρι, για να ανάψη τα καντήλια, δυο ώρες δρόμο να πάη και δυο να γυρίση. Και τί δρόμο; κακόδρομο! Και στο εκκλησάκι ήταν όλα εγκαταλελειμμένα, πεταμένα εδώ κι εκεί· που να βρη καντηλήθρα και φιτίλι! Και τελικά, έκανε όλον αυτόν τον κόπο και όλα πήγαιναν χαμένα. Αν του έλεγε κανείς: «τώρα που θα πάς στο σπίτι, άναψε το καντήλι», μπορεί και να μην το άναβε! Αν ήθελε πραγματικά να κάνη θυσία, έπρεπε να πάη απλά, αθόρυβα, στο μοναστήρι και να ανάψη τα καντήλια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, μπορεί κάποιος να κάνη μια θυσία από υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς δεν μπορεί; Μπορεί να θυσιάση, όπως λέει ο Απόστολος Παύλος, ακόμη και την ζωή του, και αγάπη να μην έχη[153].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχει αξία αυτή η θυσία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν θυμάσαι τί λέει πάλι ο Απόστολος Παύλος; «Αγάπην δε μη έχων, ουδέν ειμι»[154]. Η θυσία, για να είναι κατά Θεόν, πρέπει να μην έχη ανθρώπινα στοιχεία, ιδιοτέλεια, υπερηφάνεια κ.λπ. Όταν θυσιάζεται κανείς ταπεινά, τότε έχει αγάπη και τότε συγκινεί τον Θεό. Όταν μιλάω για αγάπη, μιλάω για την αληθινή, την γνήσια αγάπη που έχει αρχοντιά. Γιατί μπορεί κανείς να αναπαύεται με τον λογισμό του ότι έχει αγάπη, επειδή τα δίνει όλα, και όμως αγάπη να μην έχη, επειδή μέσα στην αγάπη του αυτή έχει τον εαυτό του, επειδή δηλαδή αποβλέπει σε ατομικό του συμφέρον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να είναι γνήσια η αγάπη μας, πρέπει να την εξαγνίσουμε, να βγάλουμε τον εαυτό μας από την αγάπη μας. Και όταν όλοι βγάζουν τον εαυτό τους από την αγάπη τους, τότε ο ένας είναι μέσα στον άλλον και όλοι είναι ένα και είναι πια ενωμένοι από την μία αγάπη του Χριστού. Και μέσα στον Χριστό είναι όλα τα προβλήματα λυμένα, διότι η αγάπη του Χριστού μας διαλύει όλα τα προβλήματα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αγάπη μητρική για όλους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί να βάλη κανείς όλον τον κόσμο μέσα στην καρδιά του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς μπορεί να αγκαλιάση όλον τον κόσμο, όταν τα χέρια του είναι μικρά;... Για να βάλη κανείς όλον τον κόσμο στην καρδιά του, πρέπει να πλατύνη την καρδιά του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα γίνη αυτό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την αγάπη. Αλλά κι αυτό δεν φθάνει. Χρειάζεται μητρική αγάπη. Η μάνα αγαπάει τα παιδιά της περισσότερο από τον εαυτό της. Αυτήν την αγάπη αν αποκτήση κανείς, αγαπάει όχι μόνον όσους τον αγαπούν αλλά και εκείνους που τον βλάπτουν, γιατί, όπως η μάνα όλα τα δικαιολογεί, έτσι και αυτός πάντα βρίσκει ελαφρυντικά για τους άλλους και ρίχνει το βάρος στον εαυτό του. Ακόμη και να τον κλέψουν, νιώθει τύψεις, αν πιάσουν τον κλέφτη και τον βάλουν στην φυλακή. «Εξαιτίας μου φυλακίσθηκε, θα λέη. Αν έβρισκα τρόπο να του δώσω τα χρήματα που του χρειάζονταν, δεν θα έκλεβε και δεν θα ήταν τώρα στην φυλακή».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η μητρική αγάπη όλα τα καλύπτει, όλα τα σβήνει. Αν ένα παιδί κάνη μια ζημιά ή φερθή άσχημα, η μάνα του αμέσως το συγχωρεί, γιατί είναι παιδί της. Έτσι, και όταν αγαπάς τον πλησίον σου με αγάπη μητρική, δικαιολογείς τις αδυναμίες του και δεν βλέπεις τα σφάλματά του· κι αν τα δής, τα συγχωρείς. Τότε η καρδιά σου πλημμυρίζει από αγάπη, γιατί γίνεσαι μιμητής του Χριστού που μας ανέχεται όλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όλα τα αντιμετωπίζω με μια στενότητα· μήπως δεν έχω καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ δεν έχεις καρδιά; Ξέρεις τί καρδιά έχεις; Αλλά αφήνεις να την πνίγη η στενοκεφαλιά σου και ύστερα βασανίζεσαι. Όποιος έχει πλατειά καρδιά, όλα τα σηκώνει· ενώ ο στενόκαρδος από μια παρατήρηση ή από ένα δυσάρεστο γεγονός λυπάται πολύ· δεν το σηκώνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί τόσο σηκώνει η μπαταρία του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να κάνω, Γέροντα, για να σηκώνη πιο πολύ η μπαταρία μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να δικαιολογής τις αταξίες και τις ελλείψεις των άλλων. Να τα αντιμετωπίζης όλα πνευματικά, με πίστη και εμπιστοσύνη στον Θεό. Να σκέφτεσαι ότι βρίσκεσαι στα χέρια του Θεού καί, αν δεν γίνεται κάτι όπως το θέλεις και το επιθυμείς, να το δέχεσαι με δοξολογία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα πλατύνη η καρδιά μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να πλατύνη η καρδιά σου, πρέπει να αφαιρέσης κάτι από μέσα της: να πετάξης την φιλαυτία σου. Αν ξεραθή ο κισσός της φιλαυτίας και της στενής λογικής που σε πνίγει, θα αναπτυχθή ελεύθερα πια το πνευματικό σου δένδρο. Θα εύχωμαι γρήγορα να ελευθερωθή τελείως η καρδιά σου, για να αναπτυχθή και να πλατυνθή. Αμήν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εγώ τώρα ξέρετε πώς νιώθω; Νιώθω τέτοια μητρική αγάπη, τέτοια στοργή και τρυφερότητα, που δεν είχα πρώτα[155]. Χωράει μέσα μου όλος ο κόσμος. Θέλω να αγκαλιάσω όλους τους ανθρώπους, για να τους βοηθήσω. Γιατί η αγάπη δεν μπορεί να μείνη κλεισμένη στην καρδιά. Όπως το γάλα μιας μητέρας που το παιδάκι της πέθανε, τρέχει και χύνεται, έτσι και η αγάπη θέλει να δοθή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καρδιά δεν γερνάει ποτέ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Παμβώ λέει: «Ει έχεις καρδίαν, δύνασαι σωθήναι»[156]. Τί εννοεί με το «ει έχεις καρδίαν»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλά μπορεί να εννοή. Πρώτον· αν έχης καρδιά, ίσον αν αγαπάς τον Θεό. Δεύτερον· αν έχης καρδιά, ίσον αν έχης ευαισθησία και δεν είσαι αναίσθητος. Τρίτον· αν έχης καρδιά, ίσον αν έχης καλωσύνη. Τέταρτον· αν έχης καρδιά, ίσον αν έχης ανεκτικότητα. Πέμπτον· αν έχης καρδιά, ίσον αν έχης παλληκαριά. Όταν λέμε «καρδιά», δεν εννοούμε ένα κομμάτι σάρκα, αλλά την διάθεση για θυσία, την αρχοντική αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μεγάλο πράγμα η δύναμη της καρδιάς! Η καρδιά είναι σαν μια μπαταρία που συνέχεια φορτίζεται. Ούτε κουράζεται ούτε γερνάει· η δύναμή της δεν εξαντλείται ποτέ. Αλλά πρέπει να δουλεύουμε την καρδιά. Γιατί κι εγώ έχω καρδιά κι εσύ έχεις καρδιά, αλλά τί το θέλεις, αν δεν την δουλεύουμε; Αν δεν δουλεύη κανείς την καρδιά, μπορεί να είναι γίγαντας και να μην έχη κουράγιο να κάνη τίποτε. Και άλλος μπορεί να είναι τόσος δά, αλλά, επειδή ό,τι κάνει το κάνει με την καρδιά του, δεν κουράζεται καθόλου. Νά, βλέπω κι εδώ μια αδελφή που δεν έχει αντοχή, αλλά, επειδή βάζει καρδιά σε ό,τι κάνει, δεν νιώθει κούραση. Δεν κοιτάζει να ξεφύγη την δουλειά· κοιτάζει πώς θα αναπαύση τον άλλον. Το καθετί το κάνει με αγάπη, γιατί το πονάει και όχι για να την δούν οι άλλοι και να της πούν «μπράβο». Δεν έχει φιλαυτία, ανθρωπαρέσκεια, κινείται στην αφάνεια, οπότε δέχεται την θεία Χάρη και βοηθιέται από τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ένας άνθρωπος είναι ασθενικός ή έχη γεράσει και το σώμα του δεν μπορή να κοπιάση, αν έχη μάθει να δουλεύη την καρδιά, η καρδιά ζορίζει το σώμα, για να δουλέψη. Είναι σαν ένα παλιό αυτοκίνητο με ρόδες ξεφουσκωμένες, με άξονες χαλασμένους, που η μηχανή του όμως είναι γερή και το σπρώχνει και τρέχει. Ενώ ένας άνθρωπος νέος και γερός, αν δεν δουλεύη την καρδιά, είναι σαν ένα καινούργιο αυτοκίνητο που δεν έχει γερή μηχανή και δεν μπορεί να προχωρήση. Του φαίνεται βουνό να κάνη και τον πιο μικρό κόπο. Καμμιά φορά στο Καλύβι τυχαίνει να ξεχάση κανένα γεροντάκι την ομπρέλα του ή μια τσάντα και λέω σε κανένα νέο παιδί: «Άντε παλληκάρι, τρέχα λιγάκι να προλάβης το γεροντάκι». Μόλις τ᾿ ακούη, αναστενάζει. «Δεν θα γυρίση πίσω, Πάτερ;», λέει. «Άντε, βρέ παλληκάρι, ξαναλέω, κάνε αγάπη». Πάλι αναστενάζει. Έ, αυτός μόνον που άκουσε: «τρέχα λιγάκι», κουράστηκε, πόσο μάλλον να πήγαινε!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν ο άνθρωπος δεν δουλεύη την καρδιά, δεν είναι ούτε σαν ζώο· άγαλμα γίνεται. Είναι άχρηστη η καρδιά του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η συνεργασία του νού και της καρδιάς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές με τον νού μου καταλαβαίνω ότι πρέπει να αγαπήσω τον άλλον, αλλά δεν νιώθω μέσα μου αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σιγά-σιγά από τον νού θα πάη και στην καρδιά και θα νιώσης την αγάπη. Για να αγαπήσης τον άλλον, χρειάζεται να δουλέψη και η καρδιά· δεν αρκεί ο νούς. Με τον νού φθάνεις στο σημείο να πής: «Τώρα πρέπει αυτόν να τον ανεχθώ» ή «πρέπει να προσέξω να μην του πω αυτό, να μην του κάνω εκείνο» κ.λπ. Αυτό σημαίνει ότι τον άλλον δεν τον αγαπάς. Τον βλέπεις σαν ξένο· δεν τον βλέπεις σαν αδελφό, για να τον πονέσης και να σκιρτήση η καρδιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, υπάρχη απόσταση μεταξύ νού και καρδιάς, μπορεί με μια λογική τοποθέτηση που θα κάνω να ακολουθήση η καρδιά τον νού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πόσο απέχει η καρδιά από τον νού; Γιατί να υπάρχη απόσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, ενώ με τον νού τοποθετούμαι σωστά, η καρδιά δεν μπορεί να ακολουθήση, επειδή είναι κυριευμένη από τα πάθη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλή είναι η διάγνωση που κάνεις, αλλά δεν φθάνει· χρειάζεται και προσπάθεια για θεραπεία. Όλη την πνευματική δουλειά την κάνει ο νούς με την καρδιά. Ο νούς είναι ο πομπός και η καρδιά ο δέκτης. Όπου γυρίση κανείς τον πομπό, σ᾿ αυτήν την συχνότητα δουλεύει και ο δέκτης. Αν ο νούς δουλεύη κοσμικά, στέλνει κοσμικά τηλεγραφήματα στην καρδιά· αν δουλεύη πνευματικά, συγκινείται και πονάει η καρδιά πνευματικά. Πώς να φάς λ.χ. πολύ, όταν σκεφθής ότι αλλού οι άνθρωποι πεθαίνουν από την πείνα ή ότι οι Βεδουΐνοι τρώνε την κοπριά από τις καμήλες[157];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρόσεξα, Γέροντα, ότι εγώ δεν αγαπώ με την καρδιά, αλλά με το μυαλό. Πώς θα δουλέψη η καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ξέρεις; Τώρα οι γιατροί, για να δουλέψη η καρδιά, τρυπούν το στήθος και βάζουν μέσα ...μπαταρία. Κι εμείς πρέπει να δουλεύουμε το μυαλό μας, για να τρυπήση την καρδιά, να πάρη μπρός και να αρχίση να δουλεύη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα γίνη αυτό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό κατ᾿ εμέ γίνεται με τρεις τρόπους: Ή νιώθει κανείς πολλή ευγνωμοσύνη για τις ευεργεσίες του Θεού, οπότε λειώνει και δοξολογεί τον Θεό, ή νιώθει το βάρος των αμαρτιών του και ζητά με πόνο από τον Θεό συγχώρηση, ή έρχεται στην θέση του άλλου που έχει κάποια δυσκολία και τον πονάει φυσιολογικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ φέρομαι αυθόρμητα, όπως νιώθω· αυτό είναι καλό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, όταν υπάρχη στην καρδιά η καθαρή, η ολοκληρωμένη αγάπη προς τον Θεό, τότε κάθε αυθόρμητη εκδήλωση της καρδιάς είναι καθαρή. Όταν όμως δεν υπάρχη στην καρδιά η καθαρή αγάπη, τότε χρειάζεται φρένο στον αυθορμητισμό, γιατί αυτή η αυθόρμητη εκδήλωση είναι γεμάτη από κοσμικές τοξίνες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί θα με βοηθήση, Γέροντα, να περιορίσω τον αυθορμητισμό μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ δεν οδηγούσες αυτοκίνητο; φρένο δεν είχε; Για πές μου λοιπόν τώρα που είσαι... έξω φρενών, τί πρέπει να κάνης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει να βάλω φρένο στην καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, πρέπει ο νούς να φρενάρη την καρδιά, γιατί, όταν προπορεύεται η καρδιά, χαραμίζεται. Σ᾿ εσένα ο Θεός έδωσε και πολύ μυαλό και πολλή καρδιά, αλλά δεν χρησιμοποιείς το μυαλό σου για φρένο στην καρδιά σου και την χαραμίζεις. Να σκέφτεσαι πριν από την κάθε σου ενέργεια, για να δουλεύης την καρδιά που σού έδωσε ο Θεός σωστά, απλά και φιλότιμα.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Εκ του υστερήματος...»[158]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Απόστολος Παύλος λέει: «Ιλαρόν δότην αγαπά ο Θεός»[159]. Εγώ πιέζω τον εαυτό μου, για να δώσω ή να κάνω κάποιο καλό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Είμαστε παιδιά του Θεού και είναι καθήκον μας να κάνουμε το καλό, γιατί ο Θεός είναι όλος αγάπη. Είδες η χήρα που φιλοξένησε τον Προφήτη Ηλία[160]; Ειδωλολάτρις ήταν, αλλά τί αγάπη είχε μέσα της! Όταν ο Προφήτης πήγε και της ζήτησε ψωμί, του είπε: «Έχουμε λίγο λάδι και αλεύρι· αυτά θα φάω με τα παιδιά μου και μετά θα πεθάνουμε». Δεν του είπε: «Δεν έχουμε να σού δώσουμε». Και όταν ο Προφήτης, για να δοκιμάση την προαίρεσή της, της είπε να φτιάξη ψωμί πρώτα για εκείνον και μετά για τα παιδιά της, η καημένη αμέσως του έφτιαξε[161]. Αν δεν είχε μέσα της αγάπη, θα έβαζε λογισμούς. «Δεν φθάνει που του λέω ότι έχουμε λίγο, θα έλεγε, ζητάει να φτιάξω πρώτα για εκείνον!». Φάνηκε η προαίρεσή της, για να έχουμε εμείς παραδείγματα. Αλλά εμείς διαβάζουμε Αγία Γραφή, διαβάζουμε τόσα και τόσα, και τί κάνουμε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θυμάμαι, και στο Σινά τα Βεδουϊνάκια[162]που δεν ήξεραν τίποτε από Ευαγγέλιο, αν τους έδινες κάτι, ακόμη και πολύ λίγο να ήταν, θα το μοιράζονταν μεταξύ τους και θα έπαιρναν όλα από λίγο. Και αν για το τελευταίο δεν έμενε τίποτε, θα του έδιναν τα άλλα από το δικό τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλα αυτά να τα παίρνετε σαν παράδειγμα και να εξετάζετε τον εαυτό σας, για να βλέπετε που βρίσκεσθε. Αν εργάζεται έτσι κανείς, ωφελείται όχι μόνον από τους Αγίους και από τους αγωνιστές, αλλά από όλους τους ανθρώπους. Σκέφτεται: «Αυτό το φιλότιμο το έχω εγώ; Πώς θα κριθώ;». Γιατί ο καθένας μας μόνος του θα κριθή από τον καλύτερό του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αξία έχει να δίνουμε από το υστέρημά μας, είτε πρόκειται για κάτι πνευματικό είτε για κάτι υλικό. Έχω, ας υποθέσουμε, τρία μαξιλάρια. Αν δώσω το ένα που μου περισσεύει, δεν έχει αξία. Ενώ, αν δώσω αυτό που χρησιμοποιώ για προσκέφαλο, αυτό έχει αξία, γιατί έχει θυσία. Γι᾿ αυτό και ο Χριστός είπε για την χήρα: «Η χήρα η πτωχή αύτη πλείον πάντων έβαλεν...»[163].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ρίξτε το παλιό κατάστιχο μέσα στην φωτιά της αγάπης
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν μπορώ να συγχωρήσω εύκολα τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ δεν θέλεις να σε συγχωρή ο Χριστός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς δεν θέλω, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τότε, γιατί κι εσύ δεν συγχωρείς τους άλλους; Αυτό πρόσεξέ το πολύ, γιατί στενοχωρεί τον Χριστό. Είναι σαν να σού χάρισε δέκα χιλιάδες τάλαντα κι εσύ να μη θέλης να χαρίσης στον άλλον εκατό δηνάρια[164]. Να λές με τον λογισμό σου: «Πώς ο Χριστός που είναι αναμάρτητος με ανέχεται συνέχεια, και ανέχεται και συγχωρεί δισεκατομμύρια ανθρώπους, κι εγώ δεν συγχωρώ μια αδελφή;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια μέρα ήρθε στο Καλύβι ένα παιδί που ήξερα ότι είχε παρεξηγηθή με κάποιον καί, ενώ εκείνος του ζητούσε να τον συγχωρέση, αυτό δεν τον συγχωρούσε. Κάποια στιγμή μου λέει: «Κάνε προσευχή, Γέροντα, να με συγχωρέση ο Θεός». «Θα κάνω προσευχή, του λέω, να μη σε συγχωρέση ο Θεός». Αλλά εκείνο πάλι μου είπε: «Θέλω, Γέροντα, να με συγχωρέση ο Θεός». «Αν δεν συγχωρέσης, ευλογημένε, εσύ τους άλλους, του είπα τότε, πώς θα σε συγχωρέση εσένα ο Θεός;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η δικαιοσύνη του Θεού είναι η αγάπη, η μακροθυμία· δεν έχει καμμιά σχέση με την ανθρώπινη δικαιοσύνη. Αυτήν την δικαιοσύνη του Θεού πρέπει να αποκτήσουμε. Μια νύχτα πήγε στο Κελλί του Παπα-Τύχωνα ένας κοσμικός να τον ληστέψη. Αφού βασάνισε αρκετά τον Γέροντα – του έσφιγγε τον λαιμό με ένα σχοινί –, είδε ότι δεν έχει χρήματα και ξεκίνησε να φύγη. Την ώρα που έφευγε, ο Παπα-Τύχων του είπε: «Θεός συγχωρέσοι, παιδί μου». Ο κακοποιός αυτός πήγε να ληστέψη και άλλον Γέροντα, αλλά εκεί τον έπιασε η αστυνομία και ομολόγησε μόνος του ότι είχε πάει και στον Παπα–Τύχωνα. Ο αστυνόμος έστειλε χωροφύλακα να πάρη τον Παπα–Τύχωνα για ανάκριση, αλλά ο Γέροντας δεν ήθελε να πάη. «Εγώ, παιδί μου, έλεγε, συγχώρεσα τον κλέφτη με όλη την καρδιά μου». Ο χωροφύλακας όμως δεν έδινε καθόλου σημασία στα λόγια του. «Άντε, γρήγορα, Γέροντα, του έλεγε! Εδώ δεν έχει «συγχώρησον» και «ευλόγησον"». Τελικά, επειδή ο Γέροντας έκλαιγε σαν μωρό παιδί, τον λυπήθηκε ο διοικητής και τον άφησε να γυρίση στο Κελλί του. Όταν μετά θυμόταν ο Γέροντας αυτό το περιστατικό, δεν μπορούσε να το χωρέση στο μυαλό του: «Πά-πά-πά, παιδί μου, έλεγε, αυτοί οι κοσμικοί άλλο τυπικό έχουν· δεν έχουν το «ευλόγησον» και το «Θεός συγχωρέσοι"»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι η μνησικακία; Να θυμάσαι το κακό που σού έκαναν ή να αισθάνεσαι κακία για εκείνον που σού το έκανε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν θυμάσαι το κακό και λυπάσαι, όταν αυτός που σού το έκανε πάη καλά, ή χαίρεσαι, όταν δεν πάη καλά, αυτό είναι μνησικακία. Αν όμως, παρά το κακό που σού έκανε ο άλλος, χαίρεσαι με την προκοπή του, αυτό δεν είναι μνησικακία. Αυτά είναι τα κριτήρια, για να ελέγξης τον εαυτό σου σ᾿ αυτό το θέμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εγώ πάντως, ό,τι κακό κι αν μου κάνη ο άλλος, το ξεχνώ· ρίχνω το παλιό κατάστιχο μέσα στην φωτιά της αγάπης και καίγεται. Τότε με τον ανταρτοπόλεμο, το 1944, μια μέρα είχαν έρθει στο χωριό μας αντάρτες. Έκανε πολύ κρύο. Είπα: «Τί θα έχουν να φάνε; Θάναι νηστικοί. Ας τους πάω λίγο ψωμί». Όταν τους το πήγα, με πέρασαν για ύποπτο. Ούτε καν σκέφθηκα ότι στα βουνά κυνηγούσαν τα αδέλφια μου. Τί είπε ο Χριστός; «Ν᾿ αγαπάτε τους εχθρούς σας και να κάνετε καλό σ᾿ αυτούς που σάς μισούν»[165].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αγάπη με πόνο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στο Καλύβι σας, Γέροντα, τί δυσκολίες έχετε! Έρχονται ψυχοπαθείς, ναρκομανείς...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εκεί όμως φαίνεται αν έχουμε πραγματική αγάπη. Στο πρόσωπο του αδελφού μας βλέπουμε τον Χριστό. Γιατί, ό,τι κάνουμε, για να αναπαύσουμε τον αδελφό μας, είναι σαν να το κάνουμε στον Ίδιο τον Χριστό. «Εφ᾿ όσον εποιήσατε ενί τούτων των αδελφών μου των ελαχίστων, είπε ο Χριστός,εμοί εποιήσατε»[166].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια μέρα ήρθε στο Καλύβι ένα δαιμονισμένο παιδί με τον πατέρα του. Εκείνη την ώρα ήρθε και κάποιος γνωστός μου κι εγώ πήρα τον πατέρα παράμερα, για να του πω μερικά πράγματα, επειδή αυτός ήταν αιτία που είχε δαιμονισθή το παιδί. Το καημένο ήταν χάλια! Κοτζάμ παλληκάρι, έτρεχαν οι μύξες του... Όταν το είδε ο γνωστός μου, το πλησίασε, έβγαλε το μαντήλι του, του σκούπισε την μύτη και το ξαναέβαλε στην τσέπη του. Έβγαλε ύστερα τον σταυρό του – χρυσό σταυρό – και τον έβαλε στον λαιμό του παιδιού. Αλλά δεν ήταν τόσο αυτό, όσο με τί αγάπη, με τί στοργή σκούπισε το παιδί – να βλέπατε σε τί χάλια ήταν! Μου έκανε εντύπωση! Τον πόνεσε σαν αδελφό του· αν δεν τον ένιωθε αδελφό, θα το έκανε αυτό; Αν αγαπήσης τον άλλον σαν αδελφό, με το μαντήλι το δικό σου σκουπίζεις και την μύτη του και το ξαναβάζεις στην τσέπη σου! Αλλά, αν δεν τον νιώθης αδελφό, είναι σαν ένα ξένο σώμα, γι᾿ αυτό λίγο να σε αγγίξη, αμέσως τινάζεσαι· λίγο σάλιο να πέση επάνω σου, θα πάς να πλυθής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αφού σ᾿ εμάς ο Καλός Θεός έδωσε άφθονες δωρεές και δεν επέτρεψε να ταλαιπωρηθούμε, πρέπει να πονέσουμε για τον πλησίον μας που ταλαιπωρείται. Βλέπουμε λ.χ. έναν ανάπηρο. Εάν σκεφθούμε: «άν εγώ  ήμουν ανάπηρος και δεν μπορούσα να περπατήσω, πώς θα ένιωθα;», θα τον πονέσουμε. Ή, αν ζητήση την βοήθειά μας κάποιος που έχει προβλήματα, αμέσως πρέπει να σκεφθούμε: «Αν είχα εγώ τα δικά του προβλήματα, δεν θα ήθελα να με βοηθήσουν;», κι έτσι θα τον πονέσουμε. Αλλά και δοκιμασίες να περνά κανείς, όταν έχη αγάπη αληθινή, με πόνο, τον δικό του πόνο τον ξεχνάει και πονάει για τον άλλον. Εγώ, όταν μου μιλάη ο άλλος για τον πόνο του, κι επάνω σε σπασμένα γυαλιά να κάθωμαι ή σε αγκάθια να πατάω, δεν καταλαβαίνω τίποτε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Άγιος Μάρκος ο Ασκητής γράφει: «Ένα μόνον πάθος εμποδίζει να κάμωμεν το κατά δύναμιν καλόν, η αμέλεια. Το πάθος τούτο θεραπεύεται δια προσευχής και ελεημοσύνης»[167]. Γιατί αναφέρει σ᾿ αυτήν την περίπτωση την ελεημοσύνη;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί η ελεημοσύνη, η καλωσύνη, μαλακώνει την καρδιά· ενεργεί όπως το λάδι στην σκουριασμένη κλειδαριά. Η σκληρή καρδιά μαλακώνει κοντά στις πληγωμένες ψυχές· γίνεται ευαίσθητη και ταπεινή. Ο Θεός δεν έκανε άνθρωπο σκληρό και άσπλαχνο, αλλά οι άνθρωποι δεν καλλιεργούν την ευσπλαχνία που τους έδωσε ο Θεός· δεν πονούν τον συνάνθρωπό τους και από την αμέλεια γίνονται σιγά-σιγά σκληροί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει να μαλακώση η καρδιά μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να μαλακώση η καρδιά μας, πρέπει να έρθουμε στην θέση όχι μόνον των άλλων ανθρώπων αλλά και των ζώων, ακόμη και του φιδιού. Να σκεφθούμε: «Θα μου άρεζε να ήμουν φίδι, να έβγαινα λίγο στην λιακάδα να ζεσταθώ και να ερχόταν ο άλλος να με χτυπήση, να μου σπάση το κεφάλι; Όχι». Τότε θα λυπηθούμε και θα αγαπήσουμε ακόμη και τα φίδια. Αν δεν έρχεται ο άνθρωπος στην θέση των άλλων, ακόμη και των ζώων και των εντόμων, δεν γίνεται «άνθρωπος».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μέσα στον πόνο κρύβεται η περισσότερη αγάπη από την κανονική. Γιατί, όταν πονάς τον άλλον, τον αγαπάς λίγο παραπάνω. Αγάπη με πόνο είναι να σφίξης στην αγκαλιά σου έναν αδελφό σου που έχει δαιμόνιο και το δαιμόνιο να φύγη. Γιατί η «σφιχτή» αγάπη, η πνευματική αγάπη με πόνο, δίνει παρηγοριά θεϊκή στα πλάσματα του Θεού, πνίγει δαίμονες, ελευθερώνει ψυχές και θεραπεύει τραύματα με το βάλσαμο της αγάπης του Χριστού που χύνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο πνευματικός άνθρωπος είναι όλος ένας πόνος. Λειώνει από τον πόνο για τους άλλους, εύχεται, παρηγορεί. Και ενώ παίρνει τον πόνο των άλλων, είναι πάντα χαρούμενος, γιατί ο Χριστός του παίρνει τον πόνο και τον παρηγορεί πνευματικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγάπη πληροφορεί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα δείξω αγάπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να δείξω αγάπη; Δεν το καταλαβαίνω. Αυτό είναι κάτι ψεύτικο, υποκριτικό. Να υπάρχη η αγάπη μέσα μας και να μας προδώση, ναί. Η αληθινή αγάπη πληροφορεί τον άλλον χωρίς εξωτερικές εκδηλώσεις. Αγάπη είναι να ακούσης με πόνο την στενοχώρια του άλλου. Αγάπη είναι κι ένα βλέμμα πονεμένο κι ένας λόγος που θα πής με πόνο στον άλλον, όταν αντιμετωπίζη κάποια δυσκολία. Αγάπη είναι να συμμερισθής την λύπη του, να τον αναπαύσης στην δυσκολία του. Αγάπη είναι να σηκώσης έναν βαρύ λόγο που θα σού πή. Όλα αυτά βοηθούν περισσότερο από τα πολλά λόγια και τις εξωτερικές εκδηλώσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν πονάς εσωτερικά για τον άλλον, ο Θεός τον πληροφορεί για την αγάπη σου και την καταλαβαίνει χωρίς εξωτερικές εκδηλώσεις. Όπως και όταν δεν εκδηλώνεται η κακία μας, αλλά είναι εσωτερική, πάλι ο άλλος την καταλαβαίνει. Βλέπεις, και ο διάβολος, όταν παρουσιάζεται ως «άγγελος φωτός»[168], φέρνει ταραχή, ενώ ο Άγγελος ο πραγματικός φέρνει μια απαλή ανέκφραστη αγαλλίαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί είναι αυτό, Γέροντα, που με εμποδίζει να πληροφορούμαι την αγάπη των άλλων;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως δεν έχεις καλλιεργήσει την αγάπη; Όποιος αγαπάει, πληροφορείται και την αγάπη του άλλου, αλλά και πληροφορεί τον άλλον για την αγάπη του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Καταλαβαίνει ο άλλος αν υποκρίνεσαι ή αν τον αγαπάς πραγματικά, γιατί πάει σαν τηλεγράφημα η αγάπη. Αν κάνουμε λ.χ. μια επίσκεψη σε ένα ορφανοτροφείο, τα παιδιά αμέσως θα καταλάβουν με τί διάθεση πήγαμε. Είχαν έρθει μια φορά στο Καλύβι να ζητήσουν την γνώμη μου κάποιοι που ήθελαν να κάνουν ένα ίδρυμα για εγκαταλελειμμένα παιδιά. «Το κυριώτερο από όλα, τους είπα, είναι να πονέσετε τα παιδιά αυτά σαν παιδιά σας και ακόμη περισσότερο. Αυτό είναι που θα πληροφορήση τα παιδιά για την αγάπη σας. Αν δεν τα πονάτε, μην ξεκινάτε να κάνετε τίποτε». Τότε ένας γιατρός, πολύ ευλαβής, είπε: «Έχεις δίκαιο, Πάτερ. Κάποτε μια συντροφιά είχαμε επισκεφθή για πρώτη φορά ένα ορφανοτροφείο και τα παιδιά κατάλαβαν την διάθεση του καθενός. «Ο κύριος τάδε, είπαν, είναι περαστικός· ο κύριος τάδε ήρθε να περάση την ώρα του μαζί μας· ο κύριος τάδε μας αγαπάει πραγματικά"». Βλέπετε πώς πληροφορεί η αγάπη;'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγάπη καταργεί τις αποστάσεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς επικοινωνούν πνευματικά από μακριά οι άνθρωποι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γράφουν κανένα γράμμα ή με ασύρματο ή με σήματα μόρς!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να υπάρξη πνευματική επικοινωνία μεταξύ των ανθρώπων, πρέπει να εργάζωνται στην ίδια συχνότητα. Αυτό δεν μπορούν να το πιάσουν οι επιστήμονες. Θυμάσαι εκείνο το περιστατικό που αναφέρω στους «Αγιορείτες Πατέρες»[169]; Μια μέρα ένας μοναχός θα πήγαινε να επισκεφθή έναν Πατέρα στην Καψάλα και σκεφτόταν: «Τί να του πάω για ευλογία;». Οικονόμησε λοιπόν δύο ψάρια και τα καθάριζε, για να του τα πάη. Εν τω μεταξύ, ο άλλος είχε λάβει πληροφορία από τον Θεό για την επίσκεψη του αδελφού και σκεφτόταν: «Τώρα που θα ᾿ρθή, τί να τον φιλέψω;». Την ώρα λοιπόν που ο αδελφός καθάριζε τα ψάρια, ένας κόρακας ήρθε ξαφνικά, του πήρε το ένα ψάρι και το πήγε στον άλλον στην Καψάλα – απόσταση πεντέμισι ώρες. Το καταλαβαίνετε; Ο ένας σκεφτόταν πώς να αναπαύση τον άλλον και ο κόρακας μετά έκανε τον ενδιάμεσο!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος έχη την Αγάπη, τον Χριστό, και βουβός να είναι, μπορεί να συνεννοηθή με όλα τα δισεκατομμύρια των λαών και με την κάθε ηλικία των ανθρώπων, που έχει και αυτή την δική της γλώσσα. Βάλε δύο ανθρώπους που δεν έχουν αγάπη μεταξύ τους να καθήσουν ο ένας δίπλα στον άλλον και να μη μιλούν. Βάλε και δύο άλλους που έχουν αγάπη μεταξύ τους να καθήσουν ο ένας δίπλα στον άλλον και να μη μιλούν και αυτοί. Πώς θα νιώθουν οι μεν και πώς θα νιώθουν οι δέ; Και οι πρώτοι δεν θα μιλούν και οι δεύτεροι δεν θα μιλούν. Όμως οι δεύτεροι και με την σιωπή θα «μιλούν», γιατί θα υπάρχη επικοινωνία μεταξύ τους. Αντίθετα οι πρώτοι δεν θα μπορούν να επικοινωνήσουν, γιατί ανάμεσά τους θα υπάρχη μόνωση. Όταν δεν υπάρχη αγάπη, μπορεί δύο άνθρωποι να βρίσκωνται κοντά, αλλά να είναι μακριά ο ένας από τον άλλον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στενοχωριέμαι που ήρθε η ημέρα να φύγετε πάλι από κοντά μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην πνευματική ζωή δεν υπάρχει «κοντά» και «μακριά». Την αγάπη του Χριστού δεν την χωρίζουν αποστάσεις, γιατί ο Χριστός με την αγάπη Του καταργεί τις αποστάσεις. Επομένως, είτε κοντά είτε μακριά βρίσκεται κανείς, νιώθει πάντα κοντά, όταν είναι κοντά στον Χριστό και συνδέεται με τον άλλον αδελφικά με αγάπη Χριστού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δοξολογώ τον Θεό που η αγάπη μου είναι τέτοιου είδους, πνευματική, αγγελική, οπότε οι αποστάσεις καταργούνται και η επαφή θα υπάρχη μαζί σας και σ᾿ αυτήν την ζωή από μακριά και στην άλλη που είναι ακόμη πιο μακριά, γιατί και εκείνη η απόσταση θα είναι πολύ κοντινή, αφού μας ενώνει η Αγάπη, ο Χριστός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Η αγάπη για όλη την κτίση
- type: h2
  initial:
    ru: ''
  text:
    ru: Η σχέση του ανθρώπου με τα ζώα πριν και μετά την πτώση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δώστε μου μια ευχή για τα Χριστούγεννα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εύχομαι ο Χριστός και η Παναγία να σε έχουν κοντά τους σαν το αρνάκι που είναι δίπλα στην φάτνη. Νομίζω, περνάει καλά, όπως και το βοϊδάκι και το γαϊδουράκι που ζεσταίνουν τον Χριστό στην φάτνη... «Έγνω βούς τον κτησάμενον και όνος την φάτνην του κυρίου αυτού»[170], λέει ο Προφήτης Ησαΐας. Γνώρισε δηλαδή το βοϊδάκι το αφεντικό του και το γαϊδουράκι την φάτνη του Κυρίου του. Γνώρισαν τί ήταν μέσα στην φάτνη και με τα χνώτα τους το ζέσταιναν! Κατάλαβαν τον Δημιουργό τους! Αλλά και το γαϊδουράκι, τί μεγάλη του τιμή να πάη τον Χριστό μετά στην Αίγυπτο! Οι άρχοντες είχαν άρματα χρυσοκέντητα, και ο Χριστός τί χρησιμοποίησε! Τί καλά να ήμουν αυτό το γαϊδουράκι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μέσα στον Παράδεισο τα ζώα αισθάνονταν την ευωδία της Χάριτος και αναγνώριζαν τον Αδάμ για αφέντη τους[171]. Μετά την παράβαση όμως βγήκαν και αυτά από τον Παράδεισο, χωρίς να φταίνε, και δεν αναγνώριζαν τον Αδάμ για αφεντικό τους, αλλά ορμούσαν να τον ξεσχίσουν. Ήταν σαν να του έλεγαν: «Είσαι κακός· δεν είσαι αφεντικό μας».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τώρα, όταν ο άνθρωπος με την τήρηση των εντολών του Θεού πλησιάζη ξανά στον Θεό, ντύνεται και πάλι την θεία Χάρη, οπότε επανέρχεται στην κατάσταση που είχε προ της πτώσεως και τα ζώα τον αναγνωρίζουν για αφεντικό τους. Τότε κινείται άφοβα ανάμεσα στα άγρια ζώα, τα οποία παύουν πια να είναι άγρια, αφού το αφεντικό τους έχει ημερέψει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα ζώα διαισθάνονται την αγάπη του ανθρώπου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ισαάκ λέει: «Καρδία ελεήμων είναι καύσις καρδίας υπέρ πάσης της κτίσεως...»[172].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, έτσι είναι· «καύσις καρδίας»[173]και υπέρ των ζώων, αλλά και υπέρ των δαιμόνων ακόμη. Ο πνευματικός άνθρωπος δίνει την αγάπη του πρώτα στον Θεό, έπειτα στους ανθρώπους, και την υπερχείλιση της αγάπης του την δίνει στα ζώα και σε όλη την κτίση. Αυτή η θεϊκή αγάπη πληροφορεί και τα ζώα, τα οποία καταλαβαίνουν τον άνθρωπο που τα αγαπάει και τα πονάει και τον πλησιάζουν, χωρίς να φοβούνται. Ακόμη και τα άγρια ζώα μπορούν να διακρίνουν έναν άνθρωπο που τα αγαπάει από έναν κυνηγό που θέλει να τα σκοτώση. Τον κυνηγό τον αποφεύγουν, τον άνθρωπο που τα αγαπάει τον πλησιάζουν. Νόμιζα ότι δεν συμβαίνει το ίδιο και με τα φίδια, γιατί το φίδι είναι το μόνο ζώο που δεν αγαπιέται από τους ανθρώπους. Διαπίστωσα όμως αργότερα ότι και τα φίδια διαισθάνονται την αγάπη του ανθρώπου και πιάνουν φιλία μαζί του. Αν ο άνθρωπος έρθη στην θέση του φιδιού και το πονέση, το φίδι αμέσως το καταλαβαίνει και τον πλησιάζει σαν φίλος. Είναι σαν να λέη: «Δόξα σοι ο Θεός, βρήκα κι εγώ επιτέλους έναν φίλο»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι, Γέροντα, το ένστικτο που έχουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Θεός, για να εξυπηρετούνται, έχει δώσει και σ᾿ αυτά ό,τι χρειάζονται· τους έδωσε την διαίσθηση. Μετά την πτώση ο άνθρωπος στερήθηκε το υπερφυσικό, αλλά του έμεινε ο νούς, η λογική. Π.χ. οι άνθρωποι βλέπουν κάπου πλατάνια και καταλαβαίνουν ότι εκεί υπάρχει και νερό· ψάχνουν και το βρίσκουν. Ενώ τα ζώα το πληροφορούνται σαν να έχουν ραντάρ. Η καμήλα, όταν είναι στην έρημο και διψάη, τρέχει μόνη της προς το μέρος που υπάρχει νερό και ο καμηλιέρης την ακολουθεί. Είναι σαν να παίρνη τηλεγράφημα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα ζώα ζητούν βοήθεια από τον άνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα καημένα τα ζώα θεό έχουν τον άνθρωπο. Όπως εμείς ζητούμε βοήθεια από τον Θεό, έτσι και αυτά ζητούν βοήθεια από τον άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στο Άγιον Όρος άκουγα για τον Γερο-Θεοφύλακτο από την Σκήτη του Αγίου Βασιλείου ότι είχε μεγάλη φιλία με τα άγρια ζώα. Αυτά διαισθάνονταν την αγάπη του και πήγαιναν στην Καλύβη του, όταν είχαν καμμιά ανάγκη. Κάποτε μάλιστα ένα ζαρκάδι που είχε σπάσει το πόδι του πήγε έξω από το Κελλί του και βέλαζε θλιμμένα. Βγήκε ο γέροντας και το είδε να τεντώνη το σπασμένο του ποδαράκι σαν να του το έδειχνε. Εκείνος του έφερε λίγο παξιμάδι να φάη και πήρε δύο ξυλάκια, με τα οποία έδεσε σταθερά το πόδι του. Μετά είπε στο ζαρκαδάκι: «Πήγαινε τώρα στο καλό και μετά από μια εβδομάδα να ξαναπεράσης να το δώ». Ο καλός Γέροντας συνεννοήθηκε με το ζώο σαν γιατρός με πονεμένο άνθρωπο, επειδή είχε γίνει άνθρωπος του Θεού!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου κάνει εντύπωση πώς ο Όσιος Γεράσιμος δεν φοβήθηκε καθόλου το λιοντάρι που τον πλησίασε, για να του βγάλη το αγκάθι[174].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έ, Άγιος ήταν, αλλά και τα ζώα ποτέ δεν κάνουν κακό στον άνθρωπο, όταν βρίσκωνται σε ανάγκη. Μια φορά, τότε που ήμουν με την κήλη[175], κάποιοι εργάτες κουβαλούσαν ξύλα με τα ζώα εκεί στην περιοχή του Καλυβιού. Βλέπω σε μια στιγμή ένα ζώο να πέφτη, το καημένο, κάτω και το σαμάρι με τα ξύλα να πέφτη από πάνω του. Διπλώθηκαν τα πόδια του και δεν μπορούσε να τα ισιώση. Εγώ ξέχασα ότι είχα κήλη, ξέχασα ότι δυσκολευόμουν ακόμη και να περπατήσω. Τρέχω, πετάω τα ξύλα. Πάω να σηκώσω το σαμάρι, δεν μπορούσα. Δίνω μιά, τραβάω τα σχοινιά και ελευθέρωσα το ζώο. Οπότε ένας Πατέρας που ήταν εκεί κοντά φώναξε: «Πρόσεχε, έχεις κήλη, θα πάθης καμμιά ζημιά». Τότε θυμήθηκα ότι είχα κήλη. «Καλά, του λέω, εγώ έχω κήλη· εσύ που δεν έχεις κήλη, γιατί δεν έτρεξες;». «Φοβήθηκα μήπως με κλωτσήση», μου λέει. «Ευλογημένε, του λέω, το ζώο, και λύκος να είναι, όταν το καημένο βρίσκεται σε ανάγκη, ζητάει βοήθεια και δεν κάνει κακό στον άνθρωπο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά κι αν πεινούν κι αν διψούν τα ζώα, στον άνθρωπο καταφεύγουν, γιατί ο άνθρωπος είναι το αφεντικό τους. Θυμάμαι, στο Καλύβι του Τιμίου Σταυρού[176], ένα καλοκαίρι, μια οχιά κατέβηκε από την λαμαρίνα της σκεπής και κουλουριάστηκε μπροστά μου. Σήκωνε το κεφάλι της ψηλά, έβγαζε την γλώσσα της και σφύριζε. Διψούσε πολύ – είχε καή από τον πολύ καύσωνα – και με απειλούσε. Ζητούσε νερό, αλλά με επιτακτικό τρόπο, λές και ήμουν υποχρεωμένος να πάω να της φέρω νερό. «Βρέ, της λέω, εσύ, έτσι που κάνεις, δεν συγκινείς τον άλλον!». Της έβαλα μετά νεράκι και ήπιε. Ενώ τα τσακάλια πολύ με συγκινούν, γιατί, όταν πεινούν, κλαίνε σαν μωρά παιδιά. Να δήτε τί έχω πάθει και με τα γατάκια τώρα στο Καλύβι[177]. Πρόσεξαν πώς, κάθε φορά που χτυπούσε το καμπανάκι, έβγαινα έξω, και πότε-πότε τους έρριχνα κάτι να φάνε. Όταν λοιπόν πεινούν, τραβούν το σχοινί και χτυπάει το καμπανάκι. Βγαίνω και βλέπω να χτυπούν αυτά το καμπανάκι και τα ταΐζω. Πώς τα έχει κάνει όλα ο Θεός!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έρχονται, Γέροντα, ζώα στο Καλύβι σας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς δεν έρχονται! Έρχονται τσακάλια, αγριόχοιροι... Έρχεται που και που και μια μικρή αλεπού. Όταν φεύγουν οι γάτες, έρχεται η αλεπουδίτσα. Οι αγριόχοιροι, το καλοκαίρι, δεν εμφανίζονται, επειδή φοβούνται τους κυνηγούς· τότε μόνο φίδια εμφανίζονται, γιατί τα φοβούνται οι άνθρωποι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έρχονται και πουλιά, κοπάδια, μικρά-μεγάλα. Τους βάζω βρεγμένο παξιμάδι και τρώνε. Το ινδοκάρυδο από τα λουκούμια το κρατώ ξεχωριστά για κάτι πουλιά που φέρνουν την άνοιξη. Τα καημένα κελαηδούν ανοιξιάτικα ακόμη από τον χειμώνα με τα χιόνια. Φέρνουν παρηγοριά δηλαδή. Αυτά πεθαίνουν για το ινδοκάρυδο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στο Σινά, εκεί που μένατε, είχε ζώα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στο Σινά, επειδή ήταν έρημος, πλησίαζαν πιο πολύ τα άγρια ζώα, καθώς και τα πουλιά. Είχε και πέρδικες, είχε και ορτύκια, σαν αυτά που έτρωγαν οι Εβραίοι στην έρημο[178]. Είχε και κάτι όμορφα ποντίκια, σαν χελωνάκια, χωρίς ουρά, που είχαν επάνω στην ράχη τους ένα τρίχωμα σαν βούρτσα! Τα τάιζα όλα, τις πέρδικες, τα ορτύκια, τα ποντίκια! Έβαζα ό,τι είχα ξεχωριστά πάνω στις πλάκες, γιατί μάλωναν! Πήγαινε το πουλάκι να φάη, πήγαινε και το ποντίκι, οπότε σηκωνόταν το πουλάκι να φύγη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα πουλιά, όπου πήγαινα, με ακολουθούσαν. Όταν ανέβαινα πάνω στα βράχια και άρχιζα να ψάλλω, μαζεύονταν εκεί και στο τέλος τους έρριχνα λίγο ρύζι. Άμα ήθελα ησυχία, δεν έπρεπε να ψάλω καθόλου, γιατί μαζεύονταν όλα γύρω μου! Θυμάμαι μια φορά που πιάστηκε η μέση μου και έμεινα μερικές μέρες ξαπλωμένος, ένα πουλάκι, το καημένο, μπήκε μέσα στο κελλί μου και ήρθε πάνω στο στήθος μου. Στάθηκε εκεί, με κοιτούσε στο πρόσωπο και κελαηδούσε, ώρες, πολύ γλυκά. Μου έκανε εντύπωση!
- type: h2
  initial:
    ru: ''
  text:
    ru: Να παραδειγματιζώμαστε από τα ζώα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι αυτό το βουητό που ακούγεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ένα μελίσσι εγκαταστάθηκε στο παράθυρό μου[179]και τώρα εργάζεται εντατικά. Τί τραβάω το βράδυ με τις φωνές τους! Ελάτε να σάς δείξω την κυψέλη μου. Να δήτε με τί αρχιτεκτονική εργάζονται οι μέλισσες, ενώ δεν έχουν ούτε αρχιτέκτονα ούτε εργολάβο! Εύχομαι να δουλέψετε και εσείς σωστά, πνευματικά, να φτιάξετε πνευματική κυψέλη, να βγάζη μέλι πνευματικό, να έρχωνται οι λαϊκοί να τρώνε και να γλυκαίνωνται πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί σημαίνει, Γέροντα, αυτό που λέει ο Ψαλμωδός: «Ανθρώπους και κτήνη σώσεις, Κύριε»[180];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εννοεί ότι ο Θεός βοηθάει και τα ζώα. Πόσοι Άγιοι είναι προστάτες των ζώων! Αλλά και τί τραβάνε τα καημένα! Εμείς ούτε μια εβδομάδα δεν θα μπορούσαμε να κάνουμε την υπακοή που κάνουν αυτά στον άνθρωπο. Αν τα ταΐσουν, τα τάισαν· διαφορετικά μένουν νηστικά. Αν δεν κάνουν αυτό που θέλει το αφεντικό τους, τα χτυπούν. Και τί κόπο κάνουν, χωρίς να περιμένουν κανέναν μισθό. Εμείς ένα «Κύριε ελέησον» να πούμε, Παράδεισο έχουμε να λάβουμε. Μικρό πράγμα είναι αυτό;Μας πέρασαν επομένως και στην ακτημοσύνη και στην υπομονή και στην υπακοή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλα να τα παρακολουθήτε, γιατί όλα βοηθούν. Παρατηρώ τα μυρμήγκια πόσο φιλότιμα εργάζονται, χωρίς να έχουν επιστάτη. Εγώ δεν βρήκα σε κανέναν άνθρωπο την λεπτότητα που είδα στα μυρμήγκια. Τα νέα μυρμηγκάκια πάνε και κουβαλούν στην φωλιά ξυλάκια και ένα σωρό άλλα άχρηστα πράγματα, επειδή ακόμη δεν ξέρουν τί πρέπει να φέρουν. Τα παλιά μυρμήγκια τα αφήνουν να τα κουβαλήσουν, χωρίς να τους κόβουν την προθυμία, και μετά τα βγάζουν έξω από την φωλιά. Ύστερα, σιγά-σιγά τα νέα βλέπουν τί κουβαλούν τα παλιά και μαθαίνουν τί πρέπει να φέρνουν. Αν ήμασταν εμείς, θα λέγαμε: «Έλα εδώ εσύ, τί είναι αυτά που κουβαλάς; Πέταξέ τα γρήγορα έξω!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα ζώα τα έκανε ο Θεός, για να εξυπηρετήται ο άνθρωπος, αλλά και για να παραδειγματίζεται. Ο άνθρωπος, αν είναι άνθρωπος, από όλα ωφελείται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Όλετ, το φιλότιμο πουλί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο τελευταίο σας γράμμα[181]μου είχατε στείλει μια εικόνα με τον Αδάμ και τα ζώα στον Παράδεισο. Σκέφθηκα λοιπόν να σάς στείλω κι εγώ με την σειρά μου ζωγραφισμένο ένα πουλί, τον πιο στενό μου φίλο, γιατί, αν σάς έστελνα ζωγραφισμένο ένα φίδι, νομίζω, θα σάς έπιανε φόβος. Τον έχω ονομάσει Όλετ, που σημαίνει στα αραβικά «παιδί»[182]. Μένει στο ραχώνι[183], πεντακόσια μέτρα μακριά από το Καλύβι μου[184]. Κάθε μεσημέρι του πηγαίνω καλούδια και φιλεύματα. Μόλις του δίνω κάτι να φάη, παίρνει λίγο και φεύγει. Εγώ το φωνάζω να έρθη, αλλά αυτό φεύγει και σε λίγο έρχεται κρυφά από πίσω και κρύβεται κάτω από την ζακέτα μου. Όταν πάω να φύγω, με ξεπροβοδίζει σε απόσταση εκατό μέτρων περίπου, κι εγώ, για να μη συνεχίση να έρχεται από πίσω μου και κουρασθή, του αφήνω κανένα ψίχουλο, για να απασχοληθή, και φεύγω γρήγορα, για να με χάση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τώρα τελευταία άφησε την άσκηση και ζητάει καλοπέραση!... Ούτε σπασμένο ρύζι τρώει ούτε βρεγμένο παξιμάδι, αλλά μόνο σκουληκάκια, που θέλει να τα βάζω στό... πιάτο – στην χούφτα μου – και να ανεβαίνη εκεί να τρώη. Πρόοδος!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι μέρες που πανηγυρίζω με τον Όλετ και την συντροφιά του. Μπορεί να πη κανείς: «Γιατί κάνεις εξαιρέσεις στον Όλετ; Γιατί δεν κάνεις το ίδιο και με τα άλλα πουλιά;». Απαντώ: «Όταν φωνάζω τον Όλετ να έρθη, φέρνει μαζί του και άλλα πουλιά, φίλους του, τα οποία τρέχουν αμέσως στο φαΐ, ενώ ο Όλετ έρχεται από υπακοή και από αγάπη. Ακόμη και όταν είναι νηστικός, κάθεται αρκετή ώρα μαζί μου και ξεχνάει το φαγητό· εγώ του το θυμίζω. Και τώρα που καλωσύνεψε ο καιρός και βρίσκει ζουζούνια να φάη, όταν το φωνάζω, πάλι έρχεται, για την υπακοή, ενώ είναι χορτάτο και δεν το αναγκάζει η πείνα. Έ, πώς να μην το χαίρεσαι περισσότερο από τα άλλα πουλιά αυτό το φιλότιμο πουλάκι;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολλές φορές μου έρχεται από την πολλή μου αγάπη να το σφίξω μέσα στην χούφτα μου, αλλά φοβάμαι μήπως κάνω σαν την μαϊμού που από αγάπη σφίγγει τα παιδιά της και τελικά τα πνίγει. Γι᾿ αυτό σφίγγω την καρδιά μου και το χαίρομαι από μακριά, για να μην το βλάψω[185].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια μέρα άργησα να πάω στο ραχώνι και ο Όλετ, επειδή φυσούσε πολύ, είχε λουφάξει από νωρίς. Άφησα το φαγητό του και έφυγα, χωρίς να τον δώ. Την άλλη μέρα ξεκίνησα να πάω πολύ νωρίς, γιατί ανησύχησα μήπως το έφαγε κανένα γεράκι. Αυτό, όταν είδε το πρωί το φαγητό που του είχα αφήσει αποβραδίς, «τό πείραξε ο λογισμός» και κατέβηκε στα μισά του δρόμου και με περίμενε. Όταν με είδε, έκανε σαν τρελλό από την χαρά του. Του έδινα να φάη, αλλά αυτό περισσότερο ήθελε συντροφιά παρά φαγητό. Το θαυμάζω για την άσκησή του και για την αγάπη που έχει, καθώς και για την ευγνωμοσύνη του. Εύχεσθε να μιμηθώ τις αρετές του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πιστεύω να μην έχετε παράπονο· σάς τα είπα όλα, χωρίς να πάρω την συγκατάθεση του Όλετ. Ελπίζω να μην τον στενοχωρήσω, μια που δεν θα γίνουν γνωστά έξω... Έχετε τους χαιρετισμούς τους δικούς του και τους δικούς μου τους πολλούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο Καλύβι μου όχι μόνον τα πετούμενα πουλάκια αλλά όλα τα ζώα που έρχονται εκεί – τσακάλια, λαγοί, νυφίτσες, χελώνες, σαύρες, φίδια – χορταίνουν από την υπερχείλιση της αγάπης μου και χορταίνω κι εγώ, όταν χορταίνουν αυτά, και όλοι μαζί, «τά θηρία και πάντα τα κτήνη, ερπετά και πετεινά πτερωτά»[186], «αινούμεν, ευλογούμεν και προσκυνούμεν τον Κύριον»[187].
- type: h2
  initial:
    ru: ''
  text:
    ru: Τρίτο Μέρος – Αρχοντιά Και Φιλότιμο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Όπου υπάρχει αρχοντιά,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: υπάρχει το αθόρυβο,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: υπάρχει η αφάνεια,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γι᾿ αυτό εκεί αναπαύεται ο Χριστός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί εκεί υπάρχει η ευλογία του Χριστού».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Αρχοντιά, το μεγαλείο του Θεού
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί είναι αρχοντιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί να προσέξουμε περισσότερο την Μεγάλη Σαρακοστή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Την αρχοντιά, την πνευματική αρχοντιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η Μεγάλη Σαρακοστή δεν είναι περισσότερο περίοδος μετανοίας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αρχοντιά-αρχοντιά, για να δικτυωθήτε με τον Χριστό, αλλιώς δεν γίνεται προκοπή. Αν ξέρατε τί δίνει η αρχοντιά, θα την κυνηγούσατε μέρα-νύχτα· ούτε θα κοιμόσασταν. Αν αναλύση κανείς την πνευματική αρχοντιά, θα δη εκεί μέσα κρυμμένο το μεγαλείο του Θεού!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι ακριβώς η αρχοντιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αρχοντιά πνευματική είναι η πνευματική ανωτερότητα, είναι η θυσία. Μια αρχοντική ψυχή έχει απαιτήσεις μόνον από τον εαυτό της και όχι από τους άλλους. Θυσιάζεται για τους άλλους, χωρίς να περιμένη ανταμοιβή. Ξεχνάει ό,τι δίνει και θυμάται ακόμη και το παραμικρό που της δίνεται. Έχει φιλότιμο, έχει ταπείνωση και απλότητα, έχει ανιδιοτέλεια, τιμιότητα..., όλα τα έχει. Έχει και την μεγαλύτερη χαρά και την πνευματική αγαλλίαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η πνευματική αρχοντιά έχει Χάρη Θεού, είναι – πώς να το πώ; – μια θεϊκή ιδιότητα. Όπου υπάρχει αρχοντιά, υπάρχει το αθόρυβο, υπάρχει η αφάνεια, γι᾿ αυτό εκεί αναπαύεται ο Χριστός και εκεί υπάρχει η ευλογία του Χριστού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική αρχοντιά είναι πνευματική δικαιοσύνη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η πνευματική αρχοντιά είναι ανώτερη από την πνευματική δικαιοσύνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η πνευματική αρχοντιά έχει πνευματική δικαιοσύνη και η πνευματική δικαιοσύνη έχει πνευματική αρχοντιά ή, καλύτερα, η αρχοντιά είναι πνευματική δικαιοσύνη. Γι᾿ αυτό, τον άνθρωπο που έχει πνευματική αρχοντιά, δεν τον πιάνει ο νόμος – «δικαίοις νόμος ου κείται»[188]. Ένας τέτοιος άνθρωπος προτιμάει να σκοτωθή παρά να σκοτώση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μου ζητούν να κάνω μια δουλειά, αμέσως σκέφτομαι ότι έχω και άλλες δουλειές να κάνω και αντιδρώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν αποκτήση κανείς αρχοντιά, όλα αυτά τα ξεπερνάει. Δεν βάζει την λογική, γιατί η αρχοντιά είναι έξω της λογικής. Εσείς πηγαίνετε να τακτοποιήσετε τα πράγματα με την ανθρώπινη λογική, με την κοσμική δικαιοσύνη. Που είναι η πνευματική δικαιοσύνη; Δεν έχω πει ότι, όσο πιο πνευματικός είναι ο άνθρωπος, τόσο λιγώτερα δικαιώματα έχει σ᾿ αυτήν την ζωή; ότι ο πνευματικός άνθρωπος μόνο δίνει και ποτέ δεν ζητάει να πάρη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί όμως, Γέροντα, στο Ευαγγέλιο λέει: «Ο αιτών λαμβάνει και ο ζητών ευρίσκει»[189];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Άλλο είναι εκείνο. Αλλά, και όταν ζητάη κανείς από τον Θεό κάτι για τον εαυτό του, το οποίο δεν έχει αγάπη για τους άλλους, πάλι για το βόλεμά του φροντίζει. Ενώ, όταν λ.χ. μια μάνα ζητάη από τον Θεό να γίνη καλά το παιδί της ή να έρθουν βολικά τα πράγματα στην οικογένειά της, αυτό δεν είναι για τον εαυτό της, αλλά για το καλό του σπιτιού. Νά, η Χαναναία που αναφέρει το Ευαγγέλιο[190]δεν ζητούσε τίποτε για τον εαυτό της. Έτρεχε πίσω από τον Χριστό και Τον παρακαλούσε να βοηθήση την κόρη της που είχε δαιμόνιο. Πλησίασαν τότε οι Απόστολοι τον Χριστό και Του είπαν: «Κάνε αυτό που σού ζητάει, για να μην τρέχη από πίσω μας και φωνάζει». Αλλά Εκείνος τους απάντησε: «Ουκ απεστάλην ει μη εις τα πρόβατα τα απολωλότα οίκου Ισραήλ»[191]. Η Χαναναία όμως συνέχισε να ζητάη βοήθεια, οπότε ο Χριστός γύρισε και της είπε: «Ουκ έστι καλόν λαβείν τον άρτον των τέκνων και βαλείν τοις κυναρίοις»[192]. Κι εκείνη Του απάντησε: «Ναί, Κύριε, αλλά και τα σκυλάκια τρώνε από τα ψίχουλα που πέφτουν από τα τραπέζια των κυρίων τους». Και τότε ο Χριστός της είπε: «Για τον λόγο σου αυτόν η κόρη σου έγινε καλά»[193]. Είδατε τί πίστη είχε, τί ταπείνωση, τί αρχοντιά, τί ανωτερότητα! Αν είχε εγωισμό, θα έλεγε στον Χριστό: «Δεν το περίμενα από σένα να με κάνης και σκυλί! Έχασα πάσαν ιδέαν!» και θα έφευγε με αντίδραση! Θα είχε και αναπαυμένο τον λογισμό της ότι φέρθηκε πολύ σωστά, πολύ δίκαια. Μπορεί και να έλεγε: «Απορώ πώς τόσος κόσμος κάθεται και τον ακούει!»...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η πίστη της την βοήθησε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η αρχοντιά της την βοήθησε και είχε τέτοια πίστη. Δεν είχε καθόλου ιδέα για τον εαυτό της ούτε είχε καμμιά απαίτηση. Είχε και καλό λογισμό: «Αφού έτσι είπε ο Θεός για τον λαό του Ισραήλ, κάτι ξέρει. Εμείς ανήκουμε σε άλλο έθνος».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Πώς αποκτιέται η αρχοντιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα αποκτήσω αρχοντιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να κινήσαι ταπεινά, με καθαρό φιλότιμο και πάντα να θυσιάζεσαι. Να καλλιεργήσης την πνευματική ευαισθησία. Να δέχεσαι ήρεμα την ενόχληση του άλλου και να χαίρεσαι που ενοχλείσαι και δεν ενοχλείς. Γιατί είναι μερικοί που δεν τους απασχολεί αν ενοχλούν· τους απασχολεί μόνο να μην τους ενοχλούν. Άλλοι δεν θέλουν ούτε αυτοί να ενοχλούν, αλλά ούτε και να τους ενοχλούν. Άλλοι πάλι λένε: «Είμαι ευαίσθητος, δεν μπορώ ούτε μια κουβέντα να σηκώσω», αυτοί όμως στους άλλους λένε κουβέντες. Τί ευαισθησία είναι αυτή; Η λαμπικαρισμένη ευαισθησία έχει αρχοντιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν κάποιος, Γέροντα, έχη ελαττώματα, αλλά αγωνίζεται να αποκτήση την αρχοντιά, θα βοηθηθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η αρχοντιά θα διώξη τα ελαττώματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η πνευματική ελευθερία είναι η απαλλαγή από τα πάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η πνευματική ελευθερία είναι η αρχοντιά που λέω ότι πρέπει να έχετε. Και για να έχη ο άνθρωπος αρχοντιά, πρέπει να μην υπάρχουν μέσα του κατώτερα πάθη, μικρότητες κ.λπ. Στις μικρότητες δεν βρίσκεται ο Θεός, γιατί ο Θεός είναι φύσει αγαθός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να αγαπήσω, Γέροντα, την κακοπάθεια, πάλι στην αρχοντιά πρέπει να δουλέψω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άχ, ακόμη δεν έχετε καταλάβει τί θα πη αρχοντιά! Η αρχοντιά έχει και λεβεντιά μέσα, γιατί τότε δουλεύει η καρδιά. Για να καταλάβετε την αρχοντιά, σκεφθήτε τον Χριστό· τί κράτησε ο Χριστός για τον Εαυτό Του; Τίποτε. Όλα τα έδωσε. Θυσιάστηκε και όλο θυσιάζεται για όλους μας.Μας δίνει την αγάπη Του, μας παίρνει τις αμαρτίες μας. Εμείς, αντίθετα, θέλουμε να μαζεύουμε αγάπη. Σκεφθήτε ακόμη τί κάνουν και οι καλοί γονείς· θυσιάζονται συνέχεια για τα παιδιά τους, παρόλο που μπορεί να φάνε και κλωτσιές από τα παιδιά τους. Και να ξέρουν τί τους περιμένει, πάλι θυσιάζονται. Το ίδιο κάνουν και τα ζώα και τα πουλιά. Το χελιδόνι φροντίζει τα μικρά του, αλλά και τα χελιδονάκια, όταν μεγαλώσουν, θα φροντίσουν τα μικρά τους· έτσι τα δημιούργησε η αρχοντική αγάπη του Θεού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την αρχοντιά ο άνθρωπος έχει επαφή με τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς συγγενεύει, Γέροντα, ο άνθρωπος με τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όλη η βάση είναι να αποκτήση ο άνθρωπος την πνευματική αρχοντιά. Τότε συγγενεύει με τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί μια αδελφή να κάνη στο κελλί της πνευματικά και ύστερα να μην έχη κουράγιο να βοηθήση σε μια κοινή εργασία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί πνευματικά[194]; εις βάρος των άλλων; Δηλαδή να κοπιάζη ο άλλος κι εγώ να κάνω πνευματικά; Μά αυτό δεν είναι πνευματικό, ιδίως για έναν νέο. Ο νέος πρέπει να κοιτάξη πώς να βοηθήση έναν ηλικιωμένο. Άντε τώρα, ο νέος να κάνη δήθεν πνευματικά και ένας γέρος να ζορίζεται να βγάλη πέρα την δουλειά! Έχει θυσία αυτό; Έχει αρχοντιά; Να μελετήσω, να κάνω πνευματικά και να αφήσω για τους άλλους τις δουλειές; Αυτά είναι κούφια πράγματα! Πολλές ψυχές δεν έχουν ακόμη συλλάβει το νόημα της πνευματικής ζωής. Την αλλοίωση την αρχοντική δεν την έχουν γευθή· σκέφτονται τον εαυτό τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην δυσκολία δίνει εξετάσεις ο άνθρωπος. Θυμάμαι, μια φορά στο Κοινόβιο[195]μου είχαν πει να μείνω στο κελλί και να είμαι σε τελεία ακινησία, γιατί έβγαζα συνέχεια αίμα. Κάποια στιγμή βλέπω από το παράθυρο ένα γεροντάκι, τον πορτάρη, να παιδεύεται να σχίση με το τσεκούρι ένα κούτσουρο, για να το βάλη στο τζάκι. Αυτό το γεροντάκι είχε πρόβλημα με τα έντερα και είχε, το καημένο, συνέχεια αιμορραγίες· είχε τελείως εξαντληθή. Να σκεφθήτε κοιμόταν με τα παπούτσια, γιατί δεν είχε κουράγιο να τα λύνη και να τα δένη. Πετάγομαι, πιάνω το τσεκούρι, χτυπώ μιά-δυό το κούτσουρο, το σχίζω, και νά, μετά βγήκε το αίμα από το στόμα μου. Κατάλαβες; Ούτε καν σκέφθηκα την κατάστασή μου· δεν υπολόγισα καθόλου τον εαυτό μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αρχοντιά πνευματική! Τίποτε άλλο δεν συγκινεί τον Θεό όσο η αρχοντιά! Είναι ο δέκτης της θείας Χάριτος. Πόσο απλά και εύκολα είναι τα πράγματα και πόσο δύσκολα τα κάνουμε! Σε όλα χρειάζεται αρχοντιά πνευματική. Άμα κανείς δεν το καταλάβη αυτό, μπορεί να κάνη τρεις αγρυπνίες την εβδομάδα, τρία τριήμερα τον μήνα, να προσεύχεται ώρες, να διατηρή και την σωματική του αγνότητα, αλλά όλα αυτά να είναι άχρηστα. Δεν λέω εγώ ότι δεν χρειάζεται να τα κάνη αυτά, αλλά να φροντίση να αποκτήση το κυριώτερο από όλα: την πνευματική αρχοντιά, που είναι η ψυχική αγνότητα. Να μην υπάρχη μέσα του ιδιοτέλεια, θέλημα, εγωισμός, ανθρωπαρέσκεια κ.λπ., για να αναπαύεται ο Θεός. Όταν δεν υπάρχουν αυτά, υπάρχει ψυχική αγνότητα και από εκεί και πέρα, και να μην προσεύχεται ο άνθρωπος, συγγενεύει με τον Θεό, είναι ενωμένος με τον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μόνο με την αρχοντιά έχει ο άνθρωπος το κουμπί γυρισμένο στην ίδια συχνότητα με τον Θεό και έχει επαφή με τον Θεό, εργάζεται στην συχνότητα του Θεού· διαφορετικά το κουμπί είναι γυρισμένο σε άλλον σταθμό. Γι᾿ αυτό κοιτάξτε να αλλάξετε κεραία... Υπάρχουν κεραίες κάθετες και οριζόντιες. Οι κάθετες ...«κάθονται» στον εαυτό τους και δεν έχουν καλή επαφή, εύκολα χάνουν την επικοινωνία! Ενώ οι οριζόντιες κεραίες τεντώνονται, γι᾿ αυτό έχουν μεγάλη εμβέλεια και πιάνουν και τα ασθενικά κύματα. Θέλω να πω ότι αυτός που «κάθεται» στον εαυτό του, δεν έχει ελευθερωθή από τον εαυτό του, δεν έχει αρχοντιά, γι᾿ αυτό δεν έχει ούτε Χάρη Θεού ούτε θείο φωτισμό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος ή θα γίνη αρχοντόπουλο ή θα μείνη κακορρίζικος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ζηλεύω, μαλώνω και φέρομαι αδιάκριτα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σού λείπει η πατερική, η πνευματική, αρχοντιά, και επόμενο είναι να μαλώνης. Κοίταξε να αποκτήσης πνευματική αρχοντιά, για να αποκτήσης και διάκριση. Αλλά, για πές μου τί λογισμοί ανέβηκαν και κατέβηκαν, όταν δεν έστειλα και σ᾿ εσένα μικρή εικονίτσα όπως στις άλλες αδελφές και τί σκέφτηκες, όταν έλαβες την άλλη φορά την μεγαλύτερη; Κάνε και έναν πνευματικό λογαριασμό, να ρίξω κι εγώ μια ματιά καί, αν είναι σωστός, θα σού φτιάξω ένα ξυλόγλυπτο Άγιον Όρος και θα σού το στείλω από το Άγιον Όρος. Είχα ξεκινήσει να φτιάχνω ένα με τα μοναστήρια, τις πέτρες, τα δρομάκια, τα καλντερίμια... Ήταν περίπου είκοσι εκατοστά, μισοέτοιμο, αλλά μου το πήραν κάποια παιδιά. Το ήθελαν για ευλογία και επέμεναν να τους το δώσω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θα ήταν πολύ καλά παιδιά...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Άμα ήταν πολύ καλά παιδιά, θα είχαν αρχοντιά και δεν θα το ζητούσαν με τέτοια απαίτηση! Τους είπα: «Να το τελειώσω· πώς να σάς το δώσω μισό;». Εκείνα επέμεναν: «Όχι, δώσ᾿ το μας έτσι! Τί να παιδευτής να το τελειώσης»! Κατάλαβες; Με διευκόλυναν! Τί κόσμος υπάρχει!... Να φαντασθήτε κάποιος μου ζήτησε το μάτι μου για ευλογία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σοβαρά, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, σοβαρά! Να του δώσω το μάτι μου για ευλογία! Ήταν καμμιά τριανταριά χρονών, είχε χάσει το φως του και θα έκανε μια εγχείρηση. Τον είχαν φέρει στο Καλύβι. Τον λυπήθηκα, τον πόνεσα τόσο, που του είπα: «Κοίταξε, μη στενοχωριέσαι, αν τυχόν δεν πετύχη η επέμβαση, θα σού δώσω το δικό μου μάτι. Εμένα μου φθάνει το ένα, για να εξυπηρετούμαι». Ήρθε μετά από λίγο καιρό, χαρούμενος, γιατί πέτυχε η εγχείρηση και έβλεπε καλά και με τα δυο του μάτια και μου λέει: «Ήρθα, να μου δώσης το μάτι»! «Καλά, του λέω, αφού βλέπεις τώρα!». «Όχι, το θέλω για ευλογία», μου λέει. Πάλι τον πόνεσα, αλλά αυτήν την φορά τον πόνεσα που δεν είχε ίχνος αρχοντιάς! Άλλος πόνος αυτός...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πρόσεξα ότι, όταν κάνω κάτι που θα το εκτιμήσουν, το κάνω με περισσότερη όρεξη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ξέρεις τί μου θύμισες τώρα; Ένα κακόμοιρο κοριτσάκι, την Σπυριδούλα. Ένας σιδεράς το είχε βάλει να φυσάη με το φυσερό το καμίνι και του έλεγε συνέχεια: «Φύσα-φύσα, Σπυριδούλα, και θα σού πάρω καινούργιο φουστάνι». Κι εκείνο το φουκαριάρικο, επειδή του έταξε καινούργιο φουστάνι, ζοριζόταν· σήκωνε τα χεράκια του και φυσούσε με το φυσερό τα κάρβουνα! Κατάλαβες; Αν δεν αποκτήσης αρχοντιά, σαν την Σπυριδούλα θα είσαι. Ο άνθρωπος ή θα γίνη αρχοντόπουλο ή θα μείνη κακορρίζικος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω τον λογισμό ότι δεν με βοηθάτε όσο τις άλλες αδελφές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν και σού έχω δώσει πολλά, και από μακριά και από κοντά, κάθε φορά που ερχόμουν από το Άγιον Όρος, φαίνεται δεν τα κράτησες· τα έχεις σπαταλήσει και τώρα είσαι σαν απογοητευμένη ζητιάνα που έχασε ό,τι μάζεψε. Τί να σε κάνω; Θα εύχωμαι σύντομα να γίνης πλούσια του Χριστού, για να φύγης από την καλύβα με τους τενεκέδες και να είσαι πλέον αρχοντοπούλα του Χριστού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ με συγκινούν οι άνθρωποι που έχουν αρχοντιά. Όποιος έχει αρχοντιά, χωρίς να με ρωτήση – ούτε κι εγώ τον ρωτάω –, μπαίνει μόνος του μέσα μου και κοινοβιάζει στην καρδιά μου και τον μεταφέρω μαζί μου και τον χαίρομαι από κοντά, όσο μακριά κι αν βρίσκεται σωματικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Φιλότιμο, η πολύ-πολύ ευγνώμων αγάπη
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι φιλότιμοι είναι αρχοντικές ψυχές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί είναι, Γέροντα, το φιλότιμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί λέει το λεξικό; Η λέξη «φιλότιμο» δεν υπάρχει σε καμμιά άλλη γλώσσα. Βλέπεις, οι Έλληνες μπορεί να έχουν μερικά κουσούρια, αλλά έχουν και δύο δώρα από τον Θεό: το φιλότιμο και την λεβεντιά· όλα τα πανηγυρίζουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να σάς πω λοιπόν τί λέει το δικό μου λεξικό: Φιλότιμο είναι το ευλαβικό απόσταγμα της καλωσύνης· η πολύ-πολύ ευγνώμων αγάπη που είναι όλο καλωσύνη και ταπείνωση. Είναι η λαμπικαρισμένη αγάπη του ταπεινού ανθρώπου που δεν βάζει καθόλου τον εαυτό του σε ό,τι κάνει και η καρδιά του είναι γεμάτη πνευματική λεπτότητα, ευαισθησία και ευγνωμοσύνη προς τον Θεό και προς τις εικόνες του Θεού, τους συνανθρώπους του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι φιλότιμοι λειώνουν εσωτερικά από ευγνωμοσύνη προς τον Θεό, την οποία εκδηλώνουν με κάθε πνευματικό τρόπο, σαν παιδιά του Θεού. Επειδή κινούνται στον ουράνιο χώρο της δοξολογίας, δέχονται με χαρά και τις δοκιμασίες. Δοξάζουν τον Θεό γι' αυτές, όπως και για τις ευλογίες, και δέχονται συνέχεια την ευλογία του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι φιλότιμοι είναι αρχοντικές ψυχές. Υποφέρουν και από την παραμικρή καλωσύνη που τους κάνουν οι άλλοι και προσπαθούν να την ανταποδώσουν, αλλά, ό,τι κι αν κάνουν, ποτέ δεν αισθάνονται ότι μπόρεσαν να την ανταποδώσουν και ποτέ δεν την ξεχνούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτός, Γέροντα, που αγαπάει πραγματικά τον ευεργέτη του φανερώνει ότι έχει φιλότιμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτός που αγαπάει μόνον τον ευεργέτη του δεν κάνει τίποτε. Αλλά δυστυχώς σήμερα ούτε αυτό το φιλότιμο υπάρχει· σπάνια βρίσκεις άνθρωπο να έχη ευγνωμοσύνη. Παλιά, τί φιλότιμο είχαν οι άνθρωποι! Μου έλεγαν οι γονείς μου ότι ένας Αυστριακός βιομήχανος, που ήταν στα Άδανα, γλύτωσε τον πατέρα μου από τους Τούρκους. Μετά χρεωκόπησε ο καημένος και το θεωρούσε προσβολή να καθήση στα Άδανα, αλλά ούτε ήθελε να γυρίση στην Αυστρία. Τότε ο πατέρας μου, που δεν είχε ξεχάσει ποτέ ότι του είχε σώσει την ζωή, τον πήρε στο σπίτι στα Φάρασα και τον γηροκόμησαν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το φιλότιμο, Γέροντα, έχει κάποιο όριο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν έχει όριο. Είναι μια συνεχής μεγάλη παλαβομάρα... Πνευματική παλαβομάρα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χρειάζεται, Γέροντα, διάκριση στο φιλότιμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το φιλότιμο έχει και διάκριση και ευαισθησία και αρχοντιά... Όλα τα έχει... Ο φιλότιμος, κουτός δεν είναι· αδικημένος μπορεί να είναι, αλλά έχει τον Χριστό μέσα του, γιατί ο πιο αδικημένος είναι ο Χριστός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τον φιλότιμο αγώνα μας χαίρεται ο Χριστός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πέστε μου κάτι, Γέροντα, για τον αγώνα μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Παλληκαριά, λεβεντιά, φιλότιμο! Με φιλότιμο να εργάζεσαι στον Χριστό. Και ο Χριστός στην ψυχή που έχει καλή διάθεση, αγωνιστικό πνεύμα και φιλότιμο εργάζεται αθόρυβα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί δεν γεμίζω από την προσευχή, ενώ φροντίζω να είμαι συνεπής στα πνευματικά μου καθήκοντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, πώς να γεμίσης; Έτσι θα γεμίσης; Θέλει γύρισμα το κουμπί αλλού. Εξέτασε να δής πόσο δουλεύεις στην πνευματική ζωή με την λογική και πόσο με την καρδιά· πόσο κινείσαι από την ευρωπαϊκή συνέπεια και πόσο από το ορθόδοξο φιλότιμο. Αυτό που λέμε «συνέπεια», μερικές φορές είναι εγωισμός και μας κλέβει. Να φανώ συνεπής, για να δείξω στους άλλους ότι είμαι σε όλα εντάξει. Τότε όμως η ζωή μου γίνεται μια μεγάλη αταξία πνευματική. Να κινήσαι παντού με φιλότιμο, γιατί σ᾿ αυτήν την συχνότητα κινούνται ο Χριστός, η Παναγία, οι Άγιοι... Χωρίς φιλότιμο δεν έρχεται η θεία Χάρις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η διαρκής εγρήγορση κουράζει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κουράζει, όταν μπαίνη ο εγωισμός, γιατί τότε ο άνθρωπος πιέζει τον εαυτό του. Όταν όμως μπαίνη το φιλότιμο, ο αγώνας γίνεται με την καρδιά, και τότε δεν κουράζει, γιατί τον γλυκαίνει το φιλότιμο. Εσύ, νομίζω, ζορίζεσαι λίγο στον αγώνα σου, γιατί λές: «πρέπει να κάνω εκείνο και εκείνο», έτσι με μια πειθαρχία· καί, χωρίς να το καταλαβαίνης, μπαίνει και ο εγωισμός: «Να το κάνω, για να αγιάσω». Να κάνης τον αγώνα σου, όχι για να αγιάσης, αλλά για να χαρή ο Χριστός. Αν δούλευες, για να χαρή ο Χριστός, θα ήταν απαλός ο αγώνας σου και θα είχες μέσα σου θεία παρηγοριά. Τώρα ο αγώνας σου είναι σκληρός και δεν έχει παρηγοριά. Ο Χριστός είναι στοργικός Πατέρας και όχι τύραννος. Τον φιλότιμο αγώνα μας χαίρεται ο Χριστός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ο άνθρωπος αγωνίζεται πνευματικά με φιλότιμο, νιώθει εσωτερική αγαλλίαση, γιατί ο Θεός του δίνει πνευματική ευχαρίστηση. Βέβαια ο φιλότιμος ποτέ δεν αγωνίζεται για την ανάπαυση και την ευχαρίστηση. Κι αν δεν του δώση ο Θεός και τον Παράδεισο, δεν θα τον πειράξη, γιατί δεν λέει: «νά αγωνισθώ, για να πάω στον Παράδεισο, για να περνάω καλά και να μην υποφέρω στην κόλαση», αλλά από φιλότιμο δεν αμαρτάνει, γιατί δεν θέλει να πάη στην κόλαση και να πληγώση τον Ευεργέτη του Χριστό. Κι αν ο Χριστός του πη ότι και στον Παράδεισο θα έχη μαρτύρια κ.λπ., πάλι θα θέλη να πάη εκεί για τον Χριστό.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο εχθρός του φιλότιμου είναι η φιλαυτία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο άνθρωπος, Γέροντα, που έχει φιλότιμο, έχει πάντα και αυταπάρνηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είναι καθαρό το φιλότιμο που έχει, έχει αυταπάρνηση. Όσο βγάζει ο άνθρωπος τον εαυτό του από την αγάπη του, τόσο περισσότερο φιλότιμο αποκτάει. Όπου υπάρχει φιλαυτία, δεν υπάρχει φιλότιμο, γιατί ο εχθρός του φιλότιμου είναι η φιλαυτία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παρόλο πού, αν χρειασθή, δουλεύω με φιλότιμο δώδεκα-δεκατρείς ώρες, αντιδρώ, αν μου ζητηθή να κάνω κάτι άλλο που δεν το έχω προγραμματισμένο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να μην το λές αυτό φιλότιμο. Όποιος έχει φιλότιμο δεν αντιδρά, όταν του ζητούν βοήθεια, ούτε λέει πόσο δουλεύει. Στο Κοινόβιο που ήμουν, όποιος έκανε την πιο πολλή δουλειά κρυβόταν. Μάζευε ένας αδελφός δυο τσουβάλια ελιές και έλεγε ότι μάζεψε ένα καλαθάκι και ότι ο άλλος μάζεψε πολλά τσουβάλια. Αυτό είναι αγάπη. Εδώ ρωτάς: «Ποιά αδελφή μάζεψε τις ελιές;». «Εγώ», σού λέει η άλλη. Έ, καλύτερα να μην τις μάζευε. Αν ξεκινήσατε για τον Μοναχισμό, για να πάρετε επαίνους, κρίμα στα ναύλα σας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν βλέπω να έχουμε πολλή δουλειά, εμένα με πιάνει πανικός και ζορίζομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εγώ, αν ήμουν στην θέση σου, θα ζόριζα τον εαυτό μου να βγάλω και την δουλειά της άλλης. Όταν μάθαινα μαραγκός, το αφεντικό είχε πάρει και ένα άλλο παιδί για βοηθό που ήταν μεγαλύτερο από μένα και πιο γεμάτο, αλλά ήταν τεμπέλικο.Μας έδινε δουλειά το αφεντικό και εκείνο καθόταν. «Τί; εγώ θα κάνω πλούσιο τον μάστορα;», έλεγε και δεν έκανε τίποτε! «Βρέ, κοίταξε, του έλεγα, αν θέλης να μάθης την τέχνη, δούλεψε!». Τίποτε εκείνο! Οπότε έβγαζα και την δική του την δουλειά. «Τουλάχιστον, του έλεγα, κάθησε επάνω στον πάγκο να πατάς τα σανίδια, κι εγώ να τα σχίζω, γιατί είναι χασομέρι να τα σφίγγω και να τα ξεσφίγγω με τον σφιγκτήρα». Μπορούσα να πώ: «Έβγαλα την δουλειά μου, είμαι εντάξει» και να ᾿ρθή το αφεντικό να του πή: «Τί έκανες εσύ; Πώς αυτός που είναι και πιο αδύνατος από σένα έβγαλε τόση δουλειά;». Αν τον μάλωνε, δεν θα στενοχωριόμουν; Να καμάρωνα που θα έπαιρνα εγώ έναν έπαινο και εκείνος ένα μάλωμα; αυτό εμένα θα με βοηθούσε; Και τελικά αδίκησε τον εαυτό του, γιατί δεν έμαθε την τέχνη και μετά δούλευε με τον κασμά. Ο φιλότιμος άνθρωπος, όπου κι αν βρεθή, θα κάνη προκοπή, γιατί θα εργασθή φιλότιμα. Ενώ ο άνθρωπος που δεν καλλιεργεί το φιλότιμο που του χάρισε ο Θεός, ό,τι κι αν κάνη, ανεπρόκοπος θα είναι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπαμε παλιά τα καημένα τα ζώα, και τα βόδια και τα άλογα, όταν στο ζευγάρι το ένα ήταν φιλότιμο και το άλλο δεν τραβούσε, ζοριζόταν το φιλότιμο και έσερνε και το άλλο. Και τελικά εκείνο που δεν είχε φιλότιμο κατέληγε στον χασάπη. Ένα βουβάλι ξέρετε πόσο το είχα πονέσει! Ζεύαμε τρία ζώα μαζί, κι εκείνο το καημένο, παρόλο που δεν ήταν και τόσο δυνατό, ζοριζόταν να προχωρήση και τραβούσε και τα άλλα δύο. Όσο ζοριζόταν, τόσο γινόταν μούσκεμα στον ιδρώτα. Αν μας παρουσιάση κανένα τέτοιο ζώο ο Χριστός μεθαύριο και μας πή: «δήτε αυτό, σβάρνιζε και τα άλλα δύο· εσείς τί κάνατε;», τί θα πούμε; Άχ μωρέ, πάρτε το στα ζεστά! Η πνευματική ζωή είναι λεβεντιά. Σάς δίνονται τόσες δυνατότητες!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι φιλότιμοι έχουν λεπτή συνείδηση και βοηθιούνται από τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όποιος έχει φιλότιμο το καταλαβαίνει ο ίδιος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εσύ έχεις; Αυτό φαίνεται, ευλογημένη! Λίγο-πολύ καταλαβαίνει κανείς τον εαυτό του, πληροφορείται, γιατί έχει εσωτερική ανάπαυση και ειρήνη. Αλλά και όποιος έχει φιλότιμο δεν καυχάται, δεν λέει «εγώ έχω φιλότιμο», γιατί πάντα σκέφτεται: «Πρέπει να κινούμαι με περισσότερο φιλότιμο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο φιλότιμος άνθρωπος έχει ειλικρίνεια, δεν υπολογίζει τον εαυτό του, είναι απλός, έχει ταπείνωση. Όλα αυτά δίνουν ανάπαυση και στον ίδιο, αλλά είναι αισθητά και στον άλλον· έχει και επικοινωνία εσωτερική με τον άλλον και τον καταλαβαίνει. Και να του λές, ενώ πονάς, «είμαι πολύ καλά», για να μη στενοχωρεθή, εκείνος καταλαβαίνει ότι πονάς και προσπαθεί να μη σε κουράση. Και άλλος, ενώ σε βλέπει να μην έχης κουράγιο, να ζαλίζεσαι, επειδή θέλει να σε απασχολήση, σού λέει: «Σε βλέπω, Γέροντα, πιο καλά από κάθε άλλη φορά, σε βλέπω υγιέστατο!». Και να είχε τουλάχιστον κανένα σοβαρό πρόβλημα, θα ήταν κάπως δικαιολογημένος. Αντιθέτως ο φιλότιμος, και να έχη ανάγκη, λέει: «Γέροντα, μόνον την ευχή σου να μου δώσης, να μη σε απασχολώ». Τον κρατώ και βουρκώνουν τα μάτια του. «Να φύγω, Γέροντα, λέει, να φύγω, κουρασμένο σε βλέπω». Έ, αυτός πώς να μη δεχθή θεία βοήθεια;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Υπάρχουν άνθρωποι που από το φιλότιμο που έχουν αμέσως καταλαβαίνουν τί βοηθάει και τί ευχαριστεί τον άλλον, με την καλή έννοια, γιατί σκέφτονται συνέχεια τον άλλον και όχι τον εαυτό τους. Μερικοί, ενώ δεν με γνωρίζουν, καταλαβαίνουν από τί έχω ανάγκη· μου στέλνουν κανένα δεματάκι και έχουν μέσα ακριβώς ό,τι μου χρειάζεται. Το δέμα τους σού δίνει να καταλάβης όλον τον εσωτερικό τους κόσμο. Βλέπεις την λεπτή τους συνείδηση να είναι απλωμένη στο κάθε πράγμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στο Καλύβι σας μερικές φορές καταφέρνουν και σάς βλέπουν αυτοί που είναι λίγο αναιδείς και επιμένουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αλλά ανταμείβονται οι φιλότιμοι που από λεπτότητα δεν θέλουν να με ανησυχήσουν. Την άλλη φορά ήρθε εδώ να με δη ένας οικογενειάρχης. Τον είδα και χωριστά, τον είδα και με την γυναίκα του και με τα παιδιά του. Μετά από δυό-τρείς μέρες ξαναήρθε. Εκείνη την ώρα έβλεπα κάποιον άλλον και έξω περίμενε μια κοπέλα που είχε έρθει αεροπορικώς από την Αθήνα, για να με ρωτήση για ένα θέμα που την απασχολούσε. «Μπορώ να απασχολήσω τον Γέροντα για πέντε λεπτά;», της είπε, κι εκείνη του έδωσε την σειρά της. Περίμενε μιάμιση ώρα, για να βγή ο κύριος που της ζήτησε να του δώση την σειρά της μόνο για ...πέντε λεπτά. Όταν βγήκε, είχε έρθει η ώρα να φύγη για το αεροδρόμιο, οπότε η καημένη μου είπε: «Δώσε μου την ευχή σου, Πάτερ, ήρθα από την Αθήνα, να σε συμβουλευθώ για ένα πρόβλημα που έχω, αλλά τώρα δεν προλαβαίνω· είχα πάρει άδεια από την δουλειά μου για λίγες ώρες και πρέπει να φύγω, για να μη χάσω το αεροπλάνο». Έ, πώς να την ξεχάσω αυτήν την ψυχή! Τελικά μόνον με τον αρχοντικό τρόπο βοηθιέται ο άνθρωπος από τον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ο φιλότιμος ζη με δύσκολους ανθρώπους, δεν ταλαιπωρείται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σκοπός είναι να δείξη το φιλότιμό του στους ανάποδους ανθρώπους. Το Ευαγγέλιο λέει: «Ει αγαπάτε τους αγαπώντας υμάς, ποία υμίν χάρις εστί;»[196].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι φιλότιμοι και ευαίσθητοι αδικούνται εκουσίως από τις παραχωρήσεις που κάνουν από αγάπη στους άλλους ή από την πονηρία των άλλων, αλλά ποτέ δεν περιμένουν ούτε επιδιώκουν να δικαιωθούν σ᾿ αυτήν την μάταιη ζωή. Σε τούτη την ζωή οι φιλότιμοι τα πληρώνουν όλα, αλλά λαμβάνουν και την βοήθεια του Θεού, και στην άλλη ζωή θα έχουν μεγάλο μισθό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τέταρτο Μέρος – Παιδιά Της Αγάπης Και Της Ταπεινώσεως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Απλότητα και Καθαρότητα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πίστη και Ελπίδα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Υπομονή – Χαρά – Διάκριση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Μόνον κοντά στον Χριστό βρίσκει κανείς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν πραγματική, την γνήσια χαρά,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιατί μόνον ο Χριστός δίνει χαρά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί παρηγοριά πραγματική».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η απλότητα και η καθαρότητα
- type: h2
  initial:
    ru: ''
  text:
    ru: Η απλότητα, το πρώτο παιδί της ταπεινώσεως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το πρώτο παιδί της ταπεινώσεως είναι η απλότητα. Και όταν υπάρχη στον άνθρωπο απλότητα, υπάρχει και αγάπη, θυσία, καλωσύνη, φιλότιμο, ευλάβεια. Ο απλός άνθρωπος έχει καθαρότητα ψυχής και μια απερίεργη εμπιστοσύνη στον Θεό. Η απλότητα ήταν η κατάσταση του Αδάμ προ της πτώσεως, που τα έβλεπε όλα αγνά και καθαρά, γιατί ήταν ντυμένος με την Χάρη του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, όταν λένε: «εν τη απλότητι η χάρις», εννοούν την θεία Χάρη;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φυσικά. Ο απλός και απονήρευτος άνθρωπος, επειδή έχει ταπείνωση, δέχεται την Χάρη από τον Θεό, ο Οποίος είναι απλός και φύσει αγαθός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί κανείς να κινήται απλά και να έχη υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό δεν γίνεται. Στον άνθρωπο που έχει πραγματική απλότητα δεν υπάρχει υπερηφάνεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κάποιος να μιμήται μερικές εκδηλώσεις του απλού ανθρώπου, χωρίς να έχη πραγματική απλότητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, και κάνοντας τον απλό, να πετυχαίνη αυτό που θέλει! Όποιος παριστάνει τον απλό, για να πετύχη κάτι, μέσα σ᾿ αυτήν την απλότητα υπάρχει η πιο χονδρή πονηριά. Είναι σαν να φοράη ένας γέρος καλτσάκια μικρού παιδιού, για να του κάνουν τα χατίρια που κάνουν σ᾿ ένα παιδί! Ενώ, όποιος έχει πραγματική απλότητα, έχει και ευθύτητα και διάκριση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Άλλο απλότητα και άλλο αναίδεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές νομίζω ότι κινούμαι με απλότητα, αλλά μου λένε ότι κινήθηκα με αναίδεια. Πώς θα ξεχωρίσω την απλότητα από την αναίδεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Άλλο απλότητα και άλλο αναίδεια. Η αναίδεια αναπαύει τον άνθρωπο κοσμικά. Φέρεται κανείς με αναίδεια και ικανοποιεί τον εγωισμό του. Σού λέει: «Τον έβαλα τον άλλον στην θέση του». Αυτό δίνει μια ικανοποίηση κοσμική, που δεν αναπαύει τον άνθρωπο πραγματικά. Ενώ η απλότητα αναπαύει πνευματικά· αφήνει στην καρδιά μια απαλάδα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου λένε ότι φέρομαι με επιπολαιότητα, εγώ όμως νομίζω ότι κινούμαι απλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε· όταν λέμε «απλότητα», δεν εννοούμε να φέρεται κανείς ανόητα. Εσύ τα μπερδεύεις. Μιλάς χωρίς να σκέφτεσαι και νομίζεις ότι κινείσαι απλά. Έχεις λίγη φυσική απλότητα, σού λείπει όμως η σύνεση καί, ενώ στα μυαλά δεν είσαι παιδί, φέρεσαι σαν παιδί. Ευτυχώς που οι αδελφές σε γνωρίζουν και δεν σε παρεξηγούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, ένας άνθρωπος να είναι πραγματικά απλός και όμως η συμπεριφορά του να πειράζη τους άλλους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν κάποιος λέη ή κάνη κάτι με πραγματική απλότητα, και παρεξηγήσιμο να είναι, δεν παρεξηγείται ο άλλος, γιατί ο απλός έχει Χάρη Θεού και δεν προκαλεί. Ενώ κάποιος που δεν έχει απλότητα και σού μιλάει με ευγένεια κοσμική, σού σπάζει τα κόκκαλα.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Γίνεσθε ως τα παιδία»[197]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά είναι η φυσική απλότητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η φυσική απλότητα είναι η απλότητα που έχει ένα μικρό παιδί. Το παιδί, όταν κάνη μια αταξία, το μαλώνεις και κλαίει. Αν μετά του δώσης ένα αυτοκινητάκι, πάει, τα ξεχνάει όλα. Δεν εξετάζει γιατί προηγουμένως το μάλωσες και ύστερα του έδωσες το αυτοκινητάκι, επειδή ο μικρός δουλεύει με την καρδιά, ενώ ο μεγάλος δουλεύει με την λογική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχουν και μεγάλοι που έχουν στην φύση τους μια απλότητα. Αυτό είναι αρετή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά η φυσική απλότητα – όπως και όλες οι φυσικές αρετές – χρειάζεται λαμπικάρισμα. Ο φύσει απλός άνθρωπος έχει ακακία, καλωσύνη κ.λπ., έχει όμως και τις παιδικές πονηρίες. Μπορεί λ.χ. να μη σκεφθή κακό για τον διπλανό του, αλλά, αν πρέπη να διαλέξη ανάμεσα σε δυο πράγματα, θα πάρη το καλύτερο για τον εαυτό του και θα αφήση το χειρότερο στον άλλον. Είναι σαν ένα κομμάτι χρυσός που έχει σε μικρό ποσοστό και άλλα μείγματα και χρειάζεται να περάση από το χωνευτήρι, για να μείνη χρυσός καθαρός. Πρέπει δηλαδή να καθαρισθή η καρδιά του από κάθε πονηρία, ιδιοτέλεια κ.λπ., και τότε θα φθάση στην κατάσταση της τελείας απλότητος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μέσα στην αληθινή αγάπη του Χριστού, στην κατάσταση εκείνη της απλότητος και καθαρότητος, αναπτύσσεται η καλή παιδικότητα, την οποία ζητά ο Χριστός να αποκτήσουμε – «γίνεσθε ως τα παιδία»[198], λέει. Στην εποχή μας όμως, όσο προχωράει η κοσμική ευγένεια, τόσο χάνεται η απλότητα, η αληθινή χαρά και το φυσικό χαμόγελο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι ένα γεροντάκι από την Σκήτη των Ιβήρων, τον Γερο-Παχώμιο. Όσο μεγάλη στενοχώρια κι αν είχες, μόνον να τον έβλεπες, έφευγε η στενοχώρια από μόνη της. Και αν πήγαινες με σκοπό να του πής πολλά, τα ξεχνούσες όλα, περνούσαν όλα. Είχε κάτι κόκκινα μάγουλα και γελούσε σαν παιδάκι! Ήταν γέρος με όψη μικρού παιδιού. Να χαλούσε ο κόσμος, γελούσε. Πανηγύρι! Ούτε γράμματα ήξερε, ούτε και από ψαλτικά ήξερε, εκτός από το «Χριστός Ανέστη», που έψαλλε το Πάσχα. Όταν ερχόταν στο Κυριακό[199]της Σκήτης, για να εκκλησιασθή στις γιορτές, ποτέ δεν καθόταν στο στασίδι, αλλά στεκόταν πάντα όρθιος, ακόμη και στις ολονυκτίες, και έλεγε την ευχή. Είχε αγωνιστικό πνεύμα και πολύ φιλότιμο. Αν τον ρωτούσες: «Γερο-Παχώμιε, που βρίσκεται η Ακολουθία», απαντούσε: «Ψαλτήρια-ψαλτήρια λένε οι Πατέρες». Όλα ψαλτήρια τα έλεγε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ήταν πολύ απλό το γεροντάκι αυτό και πολύ χαριτωμένο. Είχε απαλλαγή από τα πάθη, γι᾿ αυτό ήταν σαν άκακο παιδί. Ενώ, όταν ο άνθρωπος δεν αποβάλη από μικρός τον παιδικό εγωισμό, την παιδική υπερηφάνεια, το παιδικό πείσμα και παραμείνη σε μια νηπιώδη κατάσταση, φθάνει στα γεράματα να έχη απαιτήσεις μικρού παιδιού. Γι᾿ αυτό λέει ο Απόστολος Παύλος: «Μη παιδία γίνεσθε ταις φρεσίν, αλλά τη κακία νηπιάζετε»[200].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο απλός άνθρωπος έχει όλο καλούς λογισμούς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο απλός άνθρωπος είναι άκακος και απονήρευτος. Και το κακό και το άσχημο τα μετατρέπει σε καλό. Έχει πάντα καλούς λογισμούς για τους άλλους. Δεν είναι κουτός, αλλά νομίζει ότι, όπως σκέπτεται αυτός, έτσι σκέπτονται και οι άλλοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, να μας πήτε ένα παράδειγμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν σάς έχω πει για εκείνον τον Παπα-Χαράλαμπο που ήταν παλιά στην Μονή Κουτλουμουσίου[201]; Τον είχαν βιβλιοθηκάριο, αλλά τελικά τον έβγαλαν, γιατί ποτέ δεν έκλεινε την πόρτα της βιβλιοθήκης. «Τί τα θέλετε στις πόρτες τα κλειδιά; έλεγε. Αφήστε τους ανθρώπους να διαβάζουν τα βιβλία». Είχε τέτοια απλότητα και αγνότητα που δεν του περνούσε ο λογισμός ότι υπάρχουν και άνθρωποι που κλέβουν βιβλία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο απλός άνθρωπος, επειδή έχει όλο καλούς λογισμούς για τους άλλους, τους βλέπει όλους καλούς. Θυμάμαι κι ένα άλλο γεροντάκι, τον Γερο-Θεόκτιστο από την Μονή Διονυσίου, πόση απλότητα είχε! Ένα βράδυ είχε μείνει μαζί με έναν μοναχό στο κονάκι τους στις Καρυές. Αργά την νύχτα χτύπησε κάποιος την πόρτα και ο Γερο-Θεόκτιστος έτρεξε ν᾿ ανοίξη. «Άσ᾿ τον, του λέει ο μοναχός, μην ανοίγης τέτοια ώρα, για να μπορέσουμε να ησυχάσουμε». «Και που ξέρεις, πάτερ, του λέει, ποιός είναι; μπορεί να είναι και ο Χριστός! Να του ανοίξουμε». Και πήγε κι άνοιξε. Βλέπετε, ο απλός άνθρωπος μόνον καλό λογισμό βάζει και πάντα το καλό περιμένει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η απλότητα ξεκουράζει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νομίζω ότι απλότητα είναι να κινήται κανείς όπως νιώθει εσωτερικά. Έτσι είναι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ανάλογα με το που ζή. Για να κινηθή ο άνθρωπος απλά, πρέπει να βρη ανάλογη ατμόσφαιρα. Μέσα στον κόσμο, ιδίως τον σημερινό, πρέπει να προσέξη κανείς πώς θα κινηθή. Σε ένα μοναστήρι όμως ή σε μια οικογένεια δεν δικαιολογείται να μη ζη κανείς με απλότητα. Είναι πολύ κουραστικό, όταν δεν υπάρχη απλότητα και εμπιστοσύνη! Τότε, για να πής μια κουβέντα στον άλλον, χρειάζεται πρόλογος, επίλογος, εξηγήσεις... Έτσι η ζωή γίνεται τυραννία, μαρτύριο. Ενώ, όταν υπάρχη απλότητα, λές στον άλλον «τώρα κάθησε» και κάθεται, «τώρα δεν χρειάζεσαι, φύγε» και φεύγει, χωρίς να φοβάσαι μήπως παρεξηγηθή. Η απλότητα ξεκουράζει, ενώ η έλλειψη απλότητος κουράζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, τί σημαίνει: «Κτήσαι ελευθερίαν εν τη αναστροφή σου, ίνα της ζάλης ελευθερωθής»[202];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να αποκτήσης απλότητα στην συναναστροφή σου, για να μη ζαλίζεσαι από τους λογισμούς και μπερδεύεσαι. Όταν κανείς εκφράζη απλά αυτό που νιώθει, και ο ίδιος ελευθερώνεται και τους άλλους βοηθάει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια φορά κατέβαινα στην Αθήνα για κάποια υπόθεση με το αυτοκίνητο κάποιου γνωστού μου – μαζί μας ήταν και ένας άλλος κύριος. Επειδή το αυτοκίνητο με πειράζει, άνοιξε ο οδηγός το παράθυρο, αλλά έκανε ψύχρα. «Μήπως κρυώνετε;», τους ρώτησα. «Όχι, όχι», μου είπαν. Σε λίγο όμως είδα να μαζεύεται ο άλλος και να κουμπώνη το σακκάκι του. Οπότε τους είπα: «Αν θέλετε να μην αρρωστήση κανείς, να το λέτε απλά, όταν κρυώνετε, όπως κι εγώ θα σάς λέω, όταν αισθάνωμαι άσχημα». Έτσι κανένας δεν δυσκολεύτηκε. Αν όμως εγώ ένιωθα άσχημα και δεν μιλούσα, και ο άλλος κρύωνε και δεν μιλούσε, μπορεί κάποιος να έφθανε άρρωστος στην Αθήνα. Κι εσείς να συμπεριφέρεσθε με απλότητα μεταξύ σας. Αλλιώς θα έχετε συνέχεια την ανησυχία μήπως κάνετε κάτι και στενοχωρηθή ή πειραχθή ο άλλος. Έτσι και στενοχωριέται κανείς και ανάπαυση δεν βρίσκει, αλλά και η συμπεριφορά του γίνεται αφύσικη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπροστά σε άλλους δεν μπορώ να κάνω και το πιο απλό πράγμα. Αυτό είναι συστολή ή υπερηφάνεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Θεός δίνει μερικές φορές υπερβολική συστολή στον άνθρωπο σαν φρένο, για να μην πάθη κακό. Γιατί, ποιός ξέρει, αν δεν είχε αυτήν την συστολή, πόσο θα μπορούσε να ξεφύγη από τον σωστό δρόμο! Αυτό που πρέπει να κάνης τώρα εσύ, είναι να προσέχης λίγο και να αφήνης πολύ τον εαυτό σου στα χέρια του Θεού. Να μη σφίγγεσαι και βασανίζεσαι ανθρώπινα, γιατί μέσα σ᾿ αυτό το ανθρώπινο σφίξιμο κρύβεται και εγωισμός. Δεν με βλέπεις εμένα που συμπεριφέρομαι φυσιολογικά – χωρίς να καταβάλλω προσπάθεια – πότε σαν παππούς, πότε σαν πατέρας, πότε σαν μεγάλος αδελφός και πότε σαν παιδί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ σκέφτομαι πώς θα το πάρη ο άλλος αυτό που θα πω και φοβάμαι μην παρεξηγηθώ κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εσύ βραχυκυκλώνεσαι, επειδή δεν έχεις απλότητα. Κοίταξε, να αποκτήσης απλότητα καρδίας, για να αναπτυχθής πνευματικά. Να δέχεσαι απλά τις παρατηρήσεις που σού κάνουν και να προσπαθής να διορθώνεσαι, ζητώντας και την βοήθεια του Θεού. Μπορεί να σού πούν ότι σε εκείνη την περίπτωση φέρθηκες χωρίς σύνεση. Άλλη φορά, σε ανάλογη περίπτωση, πρέπει να σκεφθής: «Τότε μου είπαν ότι φέρθηκα χωρίς σύνεση· τώρα πρέπει να προσέξω να φερθώ συνετά». Με αυτόν τον τρόπο αποκτάς σιγά-σιγά πείρα, διορθώνεσαι, προοδεύεις και εξελίσσεσαι πνευματικά. Έτσι και ο άλλος πληροφορείται και ο Θεός πληροφορείται κι εσύ πληροφορείσαι και είσαι ειρηνική.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η απλότητα με τον φιλότιμο αγώνα και με την εμπιστοσύνη στον Θεό φέρνουν εσωτερική ειρήνη και χαρά και γεμίζει η ψυχή από ελπίδα και παρηγοριά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την αγία απλότητα γνωρίζει ο άνθρωπος τα μυστήρια του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η μελέτη των βιβλίων και η γνώση βοηθούν να γνωρίση κάποιος τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε να σού πώ· όταν εργασθή κανείς πνευματικά και φθάση σε μια καλή πνευματική κατάσταση, βλέπει μερικά πράγματα πολύ καθαρά, με τον θείο φωτισμό, χωρίς να τα έχη γνωρίσει από τα βιβλία. Και μάλιστα τα βλέπει καθαρώτερα από άλλους που έχουν διαβάσει του κόσμου τα βιβλία. Με την εσωτερική του καθαρότητα βλέπει καθαρά πολύ μακριά και πολύ βαθιά, γιατί έχει βγή από την κοσμική τροχιά και κινείται πλέον στην πνευματική τροχιά, στον μυστηριακό χώρο. Όσοι απέκτησαν την εσωτερική απλότητα και καθαρότητα βλέπουν και τα υπερφυσικά πράγματα πολύ απλά, σαν φυσικά, γιατί στον Θεό όλα απλά είναι – όπως και ο Ίδιος είναι πολύ απλός, και μας το φανέρωσε ο Υιός Του επί της γης με την αγία Του απλότητα – και δεν χρησιμοποιεί μεγαλύτερη δύναμη για τα υπερφυσικά και μικρότερη για τα φυσικά, αλλά την ίδια δύναμη για όλα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, μπορεί ένας άνθρωπος χωρίς πολλή μελέτη να γνωρίση τα μυστήρια του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αν έχη την αγία απλότητα, μπορεί όχι μόνο να γνωρίση, αλλά και να ζήση τα μυστήρια του Θεού. Θυμάστε εκείνον τον πολύ απλό μοναχό που αξιώθηκε να φάη μαζί με τον Χριστό; Πριν γίνη μοναχός, ήταν βοσκός, και το μόνο που τον ενδιέφερε ήταν πώς θα σωθή. Κάποτε πέρασε από τα μέρη του ένας ερημίτης και του είπε: «Αν θέλης να σωθής, να βαδίζης τον ίσιο δρόμο». Αυτός πήρε κατά γράμμα τον λόγο του. Παίρνει λοιπόν έναν δρόμο και τρεις μέρες βάδιζε συνέχεια όλο ίσια, ώσπου τελικά έφθασε σε ένα μοναστήρι. Εκεί ο ηγούμενος, όταν είδε τον πόθο που είχε για την σωτηρία του, τον έκανε αμέσως μοναχό και τον έβαλε να διακονή στην εκκλησία. Μια μέρα, την ώρα που καθάριζε τον ναό, πέρασε ο ηγούμενος και τον συμβούλεψε να κάνη καλά την δουλειά του. Εκείνος, αφού άκουσε τις συμβουλές, ρώτησε τον Γέροντα δείχνοντας τον Εσταυρωμένο: «Γέροντα, ποιός είναι αυτός που στέκεται εκεί επάνω; Έχω τόσες μέρες εδώ και δεν κατέβηκε ούτε να φάη ούτε να πιή». Θαύμασε ο ηγούμενος την απλότητά του και του λέει: «Εγώ τον τιμώρησα να στέκεται εκεί επάνω, γιατί δεν έκανε καλά την δουλειά του». Ο μοναχός τον άκουσε χωρίς να πη τίποτε. Το βράδυ πήρε το φαγητό του και κλείσθηκε μέσα στον ναό. Πήγε κάτω από τον Εσταυρωμένο και Του είπε με πόνο: «Κατέβα, αδελφέ, να φάμε μαζί». Τότε ο Χριστός κατέβηκε και έφαγε μαζί με τον απλό μοναχό και του υποσχέθηκε ότι θα τον πάρη στο σπίτι του Πατέρα Του, για να ευφραίνεται αιώνια. Πράγματι, μετά από λίγες μέρες ο απλός αυτός μοναχός κοιμήθηκε ειρηνικά. Βλέπετε, τέλεια άγνοια είχε, αλλά τί αξιώθηκε να ζήση, χάρη στην πολλή απλότητα και καθαρότητα που είχε!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να αναπαυθή η Χάρις του Θεού στον άνθρωπο, πρέπει να υπάρχη μέσα του αυτό το άδολο, το καθαρό. Ο Θεός χαρίζεται σε όσους έχουν εξαγνισμένη απλότητα. Όταν προηγηθή η απλότητα και η καθαρότητα, με την θερμή πίστη και την ευλάβεια, φθάνει μετά ο άνθρωπος να έχη θεία γεγονότα και να γνωρίζη τα μυστήρια του Θεού, χωρίς να έχη γνώσεις. Γιατί τότε φιλοξενείται μέσα του η Αγία Τριάδα και με τον θείο φωτισμό που έχει βρίσκει εύκολα τα κλειδιά των θείων νοημάτων και ερμηνεύει το πνεύμα του Θεού πολύ απλά και φυσικά, χωρίς διανοητικό πονοκέφαλο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν καθαρίσουμε την πονηρή μας καρδιά, «εκ της οποίας εξέρχονται όλα τα κακά»[203], θα γίνουμε καθαρά και ταπεινά δοχεία της θείας Χάριτος και θα αναπαύεται πλέον μέσα μας η Αγία Τριάδα. Θα εύχωμαι κι εγώ για σάς, καθώς κι εσείς να εύχεσθε για μένα, να βοηθήσουν ο Χριστός και η Παναγία να καθαρισθούν οι καρδιές μας, για να δούμε τον Θεό. «Μακάριοι οι καθαροί τη καρδία, ότι αυτοί τον Θεόν όψονται»[204]. Αμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η πίστη και η ελπίδα στον Θεό
- type: h2
  initial:
    ru: ''
  text:
    ru: Όλο το κακό σήμερα προέρχεται από την απιστία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βλέπω ότι μερικοί άνθρωποι που δεν πιστεύουν στον Θεό, έχουν έντονη την επιθυμία να γνωρίσουν τον κόσμο, να ταξιδέψουν, να διασκεδάσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο άνθρωπος δεν πιστεύη στην άλλη ζωή, ζητάει να γνωρίση τον κόσμο, να χαρή σ᾿ αυτήν την ζωή εκείνο, το άλλο..., και τελικά τί βγαίνει; Έχει συνέχεια μέσα του ένα κενό. Ενώ, άμα πιστέψη στον Θεό, γνωρίζει τον Θεό, τον γνωρίζει ο Θεός[205], και τότε νιώθει μέσα του γεμάτος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν οι άνθρωποι σκέφτονταν ότι αυτή η ζωή είναι πρόσκαιρη, δεν θα άλλαζαν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εξαρτάται. Αν πούμε τώρα: «τελειώνει ο κόσμος», ένας που δεν πιστεύει θα αποθρασυνθή περισσότερο και θα ορμήση στο κακό, στην αμαρτία. Ένας όμως που πιστεύει, θα φρενάρη τον εαυτό του. «Τί να ξανοιχτώ με χαμένα; θα πή. Να κοιτάξω την ψυχή μου, να ζήσω πνευματικά, να κάνω καμμιά ελεημοσύνη».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλο το κακό σήμερα προέρχεται από την απιστία. Παλιά ο κόσμος πίστευε· και ο πιο αδιάφορος είχε μέσα του πίστη. Μπορεί οι άνθρωποι να ήταν απλοί· μπορεί να μην καταλάβαιναν τίποτα από όσα άκουγαν στην εκκλησία. Μερικοί δεν ήξεραν ούτε ότι τα Ευαγγέλια είναι τέσσερα· νόμιζαν ότι είναι δώδεκα, αλλά τί πίστη είχαν, τί ευλάβεια! Και οι νοσοκόμες τί παλληκαριά είχαν! Πόσες στον πόλεμο πήγαιναν εθελόντριες! Είχαν και πίστη και θυσία και βοηθούσαν πάρα πολύ. Σήμερα μου είπε κάποιος ότι ένας άρρωστος έλεγε το «Πιστεύω» και η νοσοκόμα τον χτυπούσε, γιατί νόμιζε ότι της έκανε μάγια! Να μην ξέρη ούτε το Σύμβολο της Πίστεως! Που έχουμε φθάσει! Νέα παιδιά τα ρωτάς: «Τί πιστεύεις;». «Δεν ξέρω, σού λένε, ακόμη δεν κατέληξα». «Τί θρησκεία έχει η μάνα σου, ο πατέρας σου;». «Δεν ξέρω· δεν τους ρώτησα». Δεν ενδιαφέρθηκε να μάθη τί θρησκεία έχουν οι γονείς του! Όταν κανείς είναι τόσο αδιάφορος, πώς να βοηθηθή;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στα κράτη που είχαν ολοκληρωτικό καθεστώς είναι ακόμη δύσκολη η κατάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αλλά πόσοι μάρτυρες θα βγουν από αυτούς που κράτησαν την πίστη τους μέσα στα ολοκληρωτικά καθεστώτα! Μου έλεγε ένας Ρώσος που πήγε στην Ρωσία ύστερα από χρόνια: «Με πλησίασε μια γιαγιά που με γνώριζε από παλιά και μου είπε: «Μ᾿ αυτό το παλτό πηγαίνεις στο Άγιον Όρος;». «Ναί, μ᾿ αυτό», της είπα. Βούρκωσαν αμέσως τα μάτια της, πήρε το παλτό και το φιλούσε η καημένη, για να πάρη ευλογία». Βλέπεις, η πίστη, όσο καταπιέζεται, τόσο δυναμώνει. Είναι σαν ελατήριο πού, όσο περισσότερο το πιέση κανείς, με τόσο μεγαλύτερη δύναμη θα τιναχθή. Κάποτε κουράζεται εκείνος που το πιέζει, το αφήνει και τινάζεται.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όταν η πίστη κλονίζεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πολλοί άνθρωποι, ενώ πίστευαν, έχασαν την πίστη τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν προσέχη κανείς στα θέματα της πίστεως και της λατρείας, σιγά-σιγά ξεχνιέται και μπορεί να γίνη αναίσθητος, να φθάση σε σημείο να μην πιστεύη τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικοί, Γέροντα, λένε ότι η πίστη τους κλονίζεται, όταν βλέπουν να υποφέρουν καλοί άνθρωποι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ακόμη κι αν κάψη ο Θεός όλους τους καλούς, δεν πρέπει να βάλη κανείς αριστερό λογισμό, αλλά να σκεφθή πώς ο Θεός, ό,τι κάνει, από αγάπη το κάνει. Ξέρει ο Θεός πώς εργάζεται. Για να επιτρέψη να συμβή κάποιο κακό, κάτι καλύτερο θα βγή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σήμερα ακόμη και τα πιστά παιδιά αμφιταλαντεύονται, γιατί στα σχολεία υπάρχουν καθηγητές που διδάσκουν την αθεΐα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί να αμφιταλαντεύωνται; Η Αγία Αικατερίνη δεκαεννιά χρονών ήταν και διακόσιους φιλοσόφους τους αποστόμωσε με την κατά Θεόν γνώση και την σοφία της. Ακόμη και οι Προτεστάντες την έχουν προστάτιδα της επιστήμης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στα θέματα της πίστεως και στα θέματα της πατρίδος δεν χωράνε υποχωρήσεις· πρέπει να είναι κανείς αμετακίνητος, σταθερός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παλιά προσευχόμουν με πίστη στον Θεό και ό,τι ζητούσα μου το έκανε. Τώρα δεν έχω αυτήν την πίστη. Που οφείλεται αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην κοσμική λογική που έχεις. Η κοσμική λογική κλονίζει την πίστη. «Εάν έχητε πίστιν και μη διακριθήτε[206],πάντα όσα εάν αιτήσητε εν τη προσευχή πιστεύοντες, λήψεσθε[207]», είπε ο Κύριος. Όλη η βάση εκεί είναι. Στην πνευματική ζωή κινούμαστε στο θαύμα. Ένα σύν δύο δεν κάνει πάντα τρία· κάνει και πέντε χιλιάδες και ένα εκατομμύριο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χρειάζεται καλή διάθεση και φιλότιμο. Γιατί, αν ο άνθρωπος δεν έχη καλή διάθεση, τίποτε δεν καταλαβαίνει. Νά, και για την Σταύρωση του Χριστού, τόσες λεπτομέρειες είχαν πει οι Προφήτες – μέχρι και τί θα κάνουν τα ιμάτιά Του[208], τί θα κάνουν τα χρήματα της προδοσίας, ότι θα αγοράσουν μ᾿ αυτά τον αγρό του Κεραμέως, για να θάβουν τους ξένους[209]–, αλλά οι Εβραίοι πάλι δεν καταλάβαιναν. «Ο δε παράνομος Ιούδας ουκ ηβουλήθη συνιέναι»[210]...
- type: h2
  initial:
    ru: ''
  text:
    ru: Δυσπιστία και ολιγοπιστία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ο Μωυσής για ένα παραμικρό σφάλμα στερήθηκε την Γη της Επαγγελίας[211];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν ήταν παραμικρό σφάλμα· ήταν δυσπιστία. Ο Θεός είχε περάσει τους Ισραηλίτες από την Ερυθρά Θάλασσα[212], τους είχε βγάλει νερό στο Σινά[213], τους έτρεφε με το μάννα[214], τόσα θαυμαστά γεγονότα τους είχε δείξει και αυτοί, όταν τους έλειψε πάλι το νερό, γόγγυσαν. Και ο Μωυσής, όταν του είπε ο Θεός να χτυπήση τον βράχο, για να βγή νερό, δυσπίστησε. «Μήπως μπορεί να βγή απ᾿ αυτόν τον βράχο νερό;», είπε[215]. Γι᾿ αυτό μετά ο Θεός του έβαλε εκείνον τον κανόνα: «Για τιμωρία, του είπε, μόνον από μακριά θα δής την Γη της Επαγγελίας»[216]. Αν ο Θεός δεν τους είχε βγάλει κι άλλη φορά νερό με θαυμαστό τρόπο, θα είχε ο Μωυσής κάποια ελαφρυντικά· τώρα όμως ήταν αδικαιολόγητος για την δυσπιστία του, γι᾿ αυτό ο Θεός δεν επέτρεψε να μπή στην Γη της Επαγγελίας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νομίζω ότι μόνο με την δική μου προσπάθεια θα διορθωθώ και γι᾿ αυτό δεν προχωράω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί μπορείς να κάνης εσύ μόνη σου; Όσο είναι κανείς γαντζωμένος στον εαυτό του, εμποδίζει το έλεος του Θεού και μένει πίσω, δεν προχωράει. Εάν είχες λίγη πίστη, θα άλλαζαν σχεδόν όλα καί, εάν είχες και λίγη ταπείνωση, θα είχες Χάρη Θεού. Όλα οφείλονται στο ότι χωλαίνεις στην πίστη και στην ταπείνωση. Έτσι «δένεται» ο Θεός και δεν μπορεί να σε βοηθήση, γιατί σέβεται το αυτεξούσιο. Να ζητάς πίστη από τον Χριστό – «πρόσθες ημίν πίστιν»[217]– και να καλλιεργής την ταπείνωση. Γιατί, ακόμη και όταν πιστεύη κανείς, αν έχη υπερηφάνεια, πάλι δεν ενεργεί η πίστη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είδατε ο εκατόνταρχος, που αναφέρει το Ευαγγέλιο; Δεν είχε καθόλου υπερήφανο λογισμό, αλλά και τί πίστη είχε! «Δεν είμαι άξιος, είπε στον Χριστό, να μπής στο σπίτι μου· πές μόνον έναν λόγο και θα γίνη καλά ο δούλος μου», και δεν Τον άφησε να πλησιάση στο σπίτι του. Γι᾿ αυτό ο Χριστός είπε: «Ουδέ εν τω Ισραήλ τοσαύτην πίστιν εύρον»[218].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος πιστεύει στον Θεό, δεν φοβάται τίποτε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι παππούδες μας έλεγαν ότι θα έρθη καιρός που θα έχουμε απ᾿ όλα τα αγαθά, αλλά δεν θα μπορούμε να φάμε. Σήμερα οι άνθρωποι για τις περισσότερες τροφές έχουν ερωτηματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να κάνουμε; Μόλυναν όλο το περιβάλλον. Μη σάς πιάνη όμως φοβία. Να κάνετε τον σταυρό σας και να μη φοβάσθε. Έχω υπ᾿ όψιν μου ανθρώπους που κάνουν την ζωή τους μαρτύριο, γιατί φοβούνται τα πάντα· και είναι Χριστιανοί, βαπτισμένοι, μυρωμένοι, κοινωνούν, διαβάζουν το Ευαγγέλιο, τα έχουν μάθει απ᾿ έξω τα ρητά. Δεν βλέπουν τί δύναμη έχει η Χάρις του Θεού; «Οτιδήποτε θανάσιμο κι αν πιήτε, δεν θα σάς βλάψη»[219], είπε ο Χριστός, και «σάς δίνω εξουσία να πατάτε πάνω στα φίδια και στους σκορπιούς χωρίς να παθαίνετε κακό»[220].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν ο άνθρωπος έχη την Χάρη του Θεού, δεν φοβάται τίποτε. Γι᾿ αυτό πάντα να ζητάμε την Χάρη του Θεού κάνοντας τον σταυρό μας. Θυμάστε το περιστατικό που αναφέρει το Λαυσαϊκό; Πήγε ένας μοναχός να πάρη νερό από το πηγάδι καί, επειδή είδε μέσα μια ασπίδα[221], έφυγε κατατρομαγμένος, χωρίς να πάρη νερό. «Πάει, Αββά, χαθήκαμε, είπε στον Γέροντά του, μια ασπίδα είναι μέσα στο πηγάδι!». «Καλά, του λέει ο Γέροντας, αν πάνε σ᾿ όλα τα πηγάδια δηλητηριώδη φίδια, τί θα κάνης; θα πεθάνης απ᾿ την δίψα;». Πήγε ο Γέροντας, σταύρωσε το πηγάδι, πήρε νερό και ήπιε. «Όπου σταυρός επιφοιτά, του είπε, ουκ ισχύει κακία του σατανά»[222].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω μέσα μου μια φοβία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η φοβία που έχεις είναι ευλογία από τον Θεό· είναι οικονομία Θεού, για να καταφεύγης πάντα σ᾿ Εκείνον δια της προσευχής. Θα σε βοηθήση να πιασθής από τον Θεό. Βλέπεις, το μικρό παιδί, αν δεν το φοβερίσουν, δεν μπορούν να το συμμαζέψουν. Να αγωνίζεσαι φιλότιμα και με ελπίδα στον Θεό και τότε δεν θα φοβάσαι τίποτε. «Τον δε φόβον ημών ου μη φοβηθώμεν ουδ᾿ ου μη ταραχθώμεν, ότι μεθ᾿ ημών ο Θεός»[223], δεν ψάλλουμε στο Μεγάλο Απόδειπνο;
- type: h2
  initial:
    ru: ''
  text:
    ru: «Προωρώμην τον Κύριον ενώπιόν μου δια παντός»[224]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο φόβος που ένιωσε ο Προφήτης Δανιήλ, όταν είδε τον Άγγελο[225], τί φόβος ήταν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ήταν μια συστολή, ένα δέος, ένα ιερό πράγμα. Έπεσε ο Δανιήλ να προσκυνήση τον Άγγελο, αλλά εκείνος του είπε: «Σήκω, Δανιήλ, και μη φοβάσαι· ο Θεός άκουσε την προσευχή σου»[226].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο φόβος του Θεού είναι ο πολύς σεβασμός, η ευλάβεια, η πνευματική συστολή, που προέρχεται από την πολλή αγάπη προς τον Θεό. Όπως κανείς αισθάνεται μια συστολή μπροστά σε κάποιο σεβάσμιο πρόσωπο, έτσι αισθάνεται και ο άνθρωπος που έχει φόβο Θεού, όπου κι αν βρεθή, γιατί παντού αισθάνεται την παρουσία του Θεού. «Τα Χερουβείμ φόβω παριστάμενα»[227], δεν λέει; Αυτή η συστολή και ο φόβος έχουν μέσα ειρήνη και αγαλλίαση· δεν ταλαιπωρούν τον άνθρωπο. «Δουλεύσατε τω Κυρίω εν φόβω και αγαλλιάσθε αυτώ εν τρόμω»[228], λέει ο Ψαλμωδός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί σχέση έχει η ήσυχη συνείδηση με τον φόβο του Θεού ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά, αν ο άνθρωπος δεν έχη φόβο Θεού, τί συνείδηση θα έχη; Χωρίς τον φόβο του Θεού εύκολα μπορεί να καταπατήση την συνείδηση του, και τότε ο άνθρωπος παύει να είναι άνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν νιώθω ευγνωμοσύνη για έναν άνθρωπο, μπορώ να κάνω ό,τι μου ζητήση. Ανησυχώ όμως, επειδή δεν συμβαίνει το ίδιο και με τον Θεό. Μήπως δεν έχω την ανάλογη ευγνωμοσύνη για τις ευεργεσίες Του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Υπάρχει μέσα σου η ευγνωμοσύνη προς τον Θεό, αλλά δεν υπάρχει αυτό το φτερούγισμα. Προς τον άνθρωπο νιώθεις πιο πολύ την ευγνωμοσύνη, επειδή αισθάνεσαι την παρουσία του. Χρειάζεται να κάνης δουλειά πνευματική, για να νιώσης έντονα την παρουσία του Θεού. Αν νιώσης την παρουσία του Θεού, τότε θα νιώθης και ευγνωμοσύνη μεγάλη στον Θεό. Τώρα λές «Πάτερ ημών...» και δεν νιώθεις τίποτε. Αν όμως ένιωθες πράγματι ότι ο Θεός είναι Πατέρας σου, δεν θα μπορούσες να αντέξης αυτά τα λόγια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Συνέχεια ο άνθρωπος πρέπει να έχη την αίσθηση της παρουσίας του Θεού. Και όταν ο άνθρωπος αισθάνεται την παρουσία του Θεού, των Αγγέλων και των Αγίων, αυτό είναι μεγάλο φρένο, για να μην ξεφύγη. «Προωρώμην τον Κύριον ενώπιόν μου δια παντός, ίνα μη σαλευθώ»[229], λέει ο Δαβίδ. Αν ενεργούμε με την σκέψη ότι ο Θεός μας βλέπει, μας παρακολουθεί, ό,τι κάνουμε θα είναι σίγουρο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς η λογική αίσθηση του Θεού θα γίνη καρδιακή, ώστε να γνωρίσουμε τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει να καθαρίσουμε την καρδιά μας. Αν καθαρίση η καρδιά, έρχεται ο Θεός στην καρδιά μας και Τον γνωρίζουμε. Προηγείται δηλαδή ο φιλότιμος αγώνας, η φιλότιμη αντιμετώπιση και τοποθέτηση, και τότε η καρδιακή αίσθηση του Θεού έρχεται σαν αποτέλεσμα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ελπίδα και η εμπιστοσύνη στον Θεό είναι η μεγαλύτερη ασφάλεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ακόμη αντιμετωπίζω το καθετί ανθρώπινα και όχι πνευματικά, και έχω αγωνία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ βάζεις τα προγράμματά σου μπροστά από τα προγράμματα του Θεού, γι᾿ αυτό βασανίζεσαι. Με την εμπιστοσύνη στον Θεό και με την ταπείνωση όλα τα προβλήματα λύνονται. Να κάνης αυτό που μπορείς εσύ και μετά να αφήνεσαι στην θεία Πρόνοια, στο θείο θέλημα. Η ελπίδα στον Θεό είναι τονισμένη πίστη· είναι η μεγαλύτερη ασφάλεια για τον άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μικρό πράγμα είναι να έχη κανείς σύμμαχο τον Θεό; Θυμάμαι, πριν πάω στον στρατό, έκανα προσευχή στην Αγία Βαρβάρα να με βοηθήση – την είχα σε ευλάβεια, γιατί πήγαινα στο εξωκλήσι της από μικρός και προσευχόμουν. «Ας κινδυνεύσω στον πόλεμο, είπα, αλλά μόνον άνθρωπο να μη σκοτώσω». Και πώς τα οικονόμησε ο Καλός Θεός! Όταν βγήκαν τα αποτελέσματα, ενώ άλλους που ήταν μορφωμένοι τους έστειλαν στην πρώτη γραμμή σαν απλούς στρατιώτες, τουφεκιοφόρους, εμένα που ήμουν του δημοτικού με πήραν για ασυρματιστή! Μου έλεγαν οι άλλοι: «Έχεις μεγάλο μέσο». «Βρέ τί μέσο έχω; Δεν έχω κανέναν γνωστό». «Τί; μας κοροϊδεύεις; μου έλεγαν. Ποιόν έχεις στο Γενικό Επιτελείο;». Αφού επέμεναν, τους έλεγα κι εγώ: «Έχω στο Γενικό Επιτελείο τον Χριστό». Έτσι δεν χρησιμοποίησα ποτέ τουφέκι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς αυξάνει η ψυχική αντοχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την ελπίδα και την εμπιστοσύνη στον Θεό, οι οποίες δίνουν δυνάμεις πολλές. Πρέπει να αφήνουμε τον εαυτό μας στα χέρια του Θεού με απόλυτη εμπιστοσύνη και να βλέπουμε την κάθε δοκιμασία σαν δώρο σταλμένο από την αγάπη του Θεού. Ο άνθρωπος που έχει μεγάλη εμπιστοσύνη στον Θεό χαίρεται τα πάντα. Είτε είναι άρρωστος, είτε μένει νηστικός, είτε τον αδικούν, είτε..., είτε..., πιστεύει ότι ο Θεός τα έχει επιτρέψει, ελπίζει στον Θεό και είναι πάντα ασφαλισμένος στο λιμάνι της ελπίδος του Θεού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος έχει ορθή πίστη, έχει αληθινή αγάπη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μας έχετε πει ότι πρώτα είναι η πίστη και μετά έρχεται η αγάπη προς τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, για να αγαπήσης τον Θεό, πρέπει να Τον πιστέψης. Ανάλογη με την πίστη μας είναι και η αγάπη μας προς τον Θεό. Μου λέει όμως ο λογισμός ότι για έναν φιλότιμο άνθρωπο η αγάπη προς τον Θεό προηγείται της πίστεως. Είναι φθηνό να ζητά κανείς να του αποκαλυφθή πρώτα ο Θεός, για να Τον πιστέψη και μετά να Τον αγαπήση. Αγαπώ φιλότιμα τον Θεό και μετά ενεργεί ο Θεός. Και όσο βλέπω τις ευεργεσίες του Θεού, τόσο αυξάνει και η πίστη μου και η αγάπη μου προς τον Θεό και αγαπώ και όλους τους ανθρώπους, αφού είναι εικόνες του Θεού, και όλα τα ζώα και τα πουλιά και όλη την κτίση, γιατί είναι δημιουργήματα του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κάποιος να έχη αγάπη χωρίς να έχη ορθή πίστη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να νομίζη ότι έχει αγάπη και στην πραγματικότητα να μην έχη. Μέσα στο δόγμα το ορθό, το Ορθόδοξο, βρίσκει κανείς την αληθινή αγάπη. Ήρθαν μια φορά στο Καλύβι δύο Καθολικοί· ο ένας ήταν δημοσιογράφος και ο άλλος γραμματέας στο Βατικανό. «Πρώτα να πούμε το «Πάτερ ημών«», μου είπαν. «Για να πούμε το »Πάτερ ημών«, τους λέω, πρέπει να συμφωνούμε και στο δόγμα, αλλά μεταξύ ημών και υμών χάσμα μέγα εστί». «Καλά, μου λέει ο ένας, μόνον οι Ορθόδοξοι θα σωθούν; Ο Θεός είναι με όλον τον κόσμο». «Ναί, του λέω, αλλά εσύ μπορείς να μου πής πόσος κόσμος είναι με τον Θεό;». «Να δείξουμε αγάπη», μου λένε μετά. «Και η αμαρτία έγινε μόδα», τους λέω. «Και αυτό μέσα στην αγάπη είναι», μου λένε. «Όλοι μιλάνε για αγάπη, ειρήνη και ομόνοια, τους είπα στο τέλος, αλλά όλοι αυτοί είναι διχασμένοι και με τον εαυτό τους και με τους άλλους, γι᾿ αυτό ετοιμάζουν όλο και μεγαλύτερες βόμβες».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολλοί που μιλούν για αγάπη και ενότητα, οι ίδιοι δεν είναι ενωμένοι με τον Θεό, γιατί δεν Τον έχουν αγαπήσει ούτε έχουν αγάπη αληθινή. Αγάπη αληθινή έχει εκείνος που έχει ορθή πίστη, ζη κοντά στον Θεό, και τότε ο Θεός ζωγραφίζεται στο πρόσωπό του, και οι άλλοι βλέπουν στο πρόσωπό του τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εύχομαι ο Θεός να φωτίση όλους τους ανθρώπους, με τους οποίους είμαστε κατά σάρκα αδέλφια – από τον Αδάμ και την Εύα –, να έρθουν «εις επίγνωσιν αληθείας»[230], για να γίνουν και πνευματικά μας αδέλφια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Η σωτήριος υπομονή
- type: h2
  initial:
    ru: ''
  text:
    ru: «Μακάριος ανήρ, ός υπομένει πειρασμόν»[231]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν περνούμε κάποιον πειρασμό, μια μεγάλη δοκιμασία, τί να κάνουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να κάνετε; Υπομονή να κάνετε. Η υπομονή είναι το ισχυρότερο φάρμακο που θεραπεύει τις μεγάλες και μακροχρόνιες δοκιμασίες. Οι περισσότερες δοκιμασίες μόνο με την υπομονή περνούν. Η μεγάλη υπομονή ξεδιαλύνει πολλά και φέρνει θεϊκά αποτελέσματα· εκεί που δεν περιμένεις την λύση, δίνει ο Θεός την καλύτερη λύση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να ξέρετε ότι ο Θεός ευαρεστείται, όταν ο άνθρωπος περνά δοκιμασίες και υπομένη αγόγγυστα δοξάζοντας το άγιο όνομά Του. «Μακάριος ανήρ, ός υπομένει πειρασμόν»[232], λέει ο Άγιος Ιάκωβος. Γι᾿ αυτό να προσευχώμαστε να μας δίνη ο Καλός Θεός υπομονή, ώστε να τα υπομένουμε όλα αγόγγυστα και με δοξολογία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ζωή μας σ᾿ αυτόν τον κόσμο είναι μία συνεχής άσκηση και ο καθένας μας ασκείται με διαφορετικό τρόπο. Να σκέφτεσθε τί τράβηξε ο Χριστός σ᾿ εκείνα τα δύσκολα χρόνια! Πόσα προβλήματα του δημιουργούσαν οι Εβραίοι και δεν μιλούσε καθόλου! Αλλά και ο Απόστολος Παύλος τί υπομονή έκανε! Ενώ είχε πληροφορία από τον Θεό ότι θα πάη στην Ρώμη[233], έμεινε στην φυλακή δύο χρόνια, γιατί ο ηγεμόνας καθυστερούσε την δίκη[234]. Ο Άγιος Ιωάννης ο Θεολόγος πάλι τί υπέφερε! Για έναν μικρό γογγυσμό υπέστη ναυάγιο[235]... Βλέπετε, επιτρέπει ο Θεός να ταλαιπωρηθούν για μικρά πράγματα οι Άγιοι, για να έχουμε εμείς παραδείγματα, ώστε να αντιμετωπίζουμε τους πειρασμούς με υπομονή, με προσευχή, αλλά και με χαρά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Για να υπομείνης τον άλλον, πρέπει να τον αγαπήσης
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς αποκτιέται η υπομονή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η υπομονή έχει βάση την αγάπη. «Η αγάπη πάντα υπομένει»[236], λέει ο Απόστολος. Για να υπομείνης τον άλλον, πρέπει να τον αγαπήσης, να τον πονέσης. Αν δεν τον πονέσης, τον βαριέσαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, να μιλήσω για μια δυσκολία που αντιμετωπίζω ή να σιωπήσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν μιλήσης για την δυσκολία σου από αγάπη, για να μη δυσκολέψης τους άλλους, θα διατηρήσης την ειρήνη μέσα σου. Αυτή η δυσκολία θα φέρη την ευλογία του Θεού. Καλύτερα να δυσκολευθής εσύ, παρά να δυσκολευθή ο άλλος εξαιτίας σου. Μια φορά επέστρεψα αργά στο Κελλί από την Λιτανεία της Μονής Κουτλουμουσίου. Ήμουν κατακουρασμένος και πονούσα πολύ, γιατί τότε είχα πρόβλημα με την μέση μου. Βρήκα απ᾿ έξω να με περιμένη ένα γεροντάκι ογδόντα πέντε χρονών που ήθελε να μείνη το βράδυ στο Κελλί. Είχε αφήσει και την βαλίτσα του πιο κάτω, γιατί δεν μπορούσε να την σηκώση. Αφού του εξήγησα ότι δεν μπορούσε να διανυκτερεύση σ᾿ εμένα, φορτώθηκα στον ώμο την βαλίτσα του και τον πήγα στο ξενοδοχείο, μισή ώρα ανήφορο· του έδωσα και πεντακόσιες δραχμές για τα έξοδά του. Έκανα λίγη υπομονή και μετά ήμουν αναπαυμένος, γιατί αναπαύθηκε ο άλλος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν η αδελφή με την οποία συνεργάζομαι είναι ζορισμένη, την λυπάμαι και την κάνω υπομονή· αυτό έχει μέσα αγάπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και που ξέρεις αν δεν είσαι εσύ αιτία που είναι η άλλη ζορισμένη και σε κάνει εκείνη υπομονή; Αν νομίζης ότι εσύ είσαι σε καλύτερη πνευματική κατάσταση και την κάνης υπομονή, τότε πρέπει να λυπάσαι τον εαυτό σου. Όταν υπάρχη πραγματική αγάπη και υπομονή, δικαιολογεί κανείς τον άλλον, και μόνον τον εαυτό του κατηγορεί. «Θεέ μου, εγώ είμαι ένοχος, λέει, μη με υπολογίζης εμένα· πέταξέ με στην άκρη και βοήθησε τον άλλον». Αυτή είναι η σωστή τοποθέτηση, η οποία έχει και πολλή ταπείνωση, και τότε δέχεται ο άνθρωπος πλούσια την Χάρη του Θεού. Θα εύχωμαι να γίνης «σκύμνος»[237]πνευματικός, σαν τα μπρούντζινα λεονταράκια που με την πλάτη τους στηρίζουν τα μανουάλια της εκκλησίας και ούτε ταράσσονται ούτε ακούνε ούτε μιλάνε, αλλά σηκώνουν βάρος στην πλάτη τους. Αμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Χριστός την σωτηρία των ανθρώπων την κρέμασε στην υπομονή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Με λίγη υπομονή που θα κάνη ο άνθρωπος στις δύσκολες στιγμές μπορεί να αποκτήση την θεία Χάρη. Ο Χριστός δεν μας έδειξε άλλον τρόπο σωτηρίας, παρά την υπομονή. Την σωτηρία των ανθρώπων την κρέμασε στην υπομονή. Βλέπεις τί είπε; «Ο υπομείνας εις τέλος, ούτος σωθήσεται»[238]. Δεν είπε «ο υπομείνας εις ...θέρος!». Μέχρι το καλοκαίρι εύκολο είναι να υπομείνης, αλλά μέχρι τέλους;... Να προσέχουμε να μη χάνουμε την υπομονή μας, για να μη χάσουμε τελικά την ψυχή μας. «Εν τη υπομονή υμών κτήσασθε τας ψυχάς υμών»[239], λέει το Ευαγγέλιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είχα ακούσει για την υπομονή που έκανε μια γυναίκα, η οποία εκτός από τον ουράνιο μισθό που θα έχη, ανταμείφθηκε από τον Θεό και σ᾿ αυτήν την ζωή εκατονταπλάσια[240]. Είχε τρία παιδιά και ο άνδρας της ήταν γιατρός. Σαν γιατρός ήταν πολύ καλός, σαν άνθρωπος όμως όχι, γιατί ήταν δυστυχώς κυριευμένος από σαρκικά πάθη και δημιουργούσε προβλήματα και σε άλλες οικογένειες. Έπαιρνε και στο ιατρείο του κοπέλες δήθεν να τον βοηθάνε σαν νοσοκόμες. Μια από αυτές τις νοσοκόμες μπήκε σαν σφήνα ανάμεσα στο ανδρόγυνο και κατόρθωσε να διώξη την σύζυγο με τα τρία παιδάκια και να συζή μαζί του παράνομα στο σπίτι του. Η μάνα με τα παιδάκια αναγκάστηκε να πάη στο πατρικό της σπίτι και να εργάζεται, για να μπορέσουν να συντηρηθούν. Προσευχόταν βέβαια πολύ και έκανε πολλή υπομονή. Ο γιατρός με την παράνομη γυναίκα απέκτησε άλλα τρία παιδιά. Τί συνέβη όμως; Μόλις γεννήθηκε το τρίτο παιδί, ξεμυαλίσθηκε με μια άλλη κοπέλα δεκαέξι χρονών, την οποία πήρε στο ιατρείο του, για να τον βοηθάη, και έδιωξε την προηγούμενη παράνομη με τα τρία παιδιά. Βλέπετε, λειτούργησαν οι πνευματικοί νόμοι, ώστε να εξοφλήση το σφάλμα της, αλλά και να καταλάβη τον πόνο της πραγματικής συζύγου. Μετά από λίγο καιρό ο γιατρός αρρώστησε και έμεινε κατάκοιτος στο σπίτι του. Η τελευταία μικρή κοπέλα κάθησε μαζί του, όσο είχε χρήματα, αλλά έκανε άτακτη ζωή. Μάζευε φίλους στο σπίτι του, γιατί αυτή δεν μπορούσε να γυρίζη, επειδή δήθεν τον πρόσεχε. Η απρόσεκτη όμως ζωή της τον πλήγωνε συνέχεια, γιατί την ζήλευε. Τελικά, αφού του έφαγε όλα τα χρήματα που είχε στην άκρη, τον εγκατέλειψε. Η πραγματική σύζυγός του, όταν έμαθε ότι βρίσκεται σε κακά χάλια, πήγε και του συμπαραστάθηκε. Καθάρισε, συγύρισε το σπίτι του και τον συντηρούσε από τις οικονομίες που είχε από την εργασία της και από τα χρήματα των παιδιών της, που είχαν μεγαλώσει και εργάζονταν. Η προηγούμενη παράνομη που είχε διωχθή, όχι μόνο δεν τον πλησίασε να τον βοηθήση και να του συμπαρασταθή έστω και λίγο, αλλά ούτε ήθελε να ακούση γι᾿ αυτόν. Μόνον η στεφανωμένη γυναίκα του του συμπαραστάθηκε, τον περιποιήθηκε και τον βοήθησε πνευματικά. Τελικά ο γιατρός ζήτησε να εξομολογηθή και στην συνέχεια ζούσε εν μετανοία. Βλέποντας ο Καλός Θεός όλη αυτήν την καλή προσπάθεια της καλής συζύγου – χρόνια να κάνη υπομονή, να ζη τίμια και να εργάζεται σκληρά, για να συντηρή και τον άνδρα της, ενώ εκείνος της είχε φερθή τόσο σκληρά και βάρβαρα – την αντάμειψε. Τί συνέβη λοιπόν; Πέθανε στην Αμερική ένας πλούσιος συγγενής του άνδρα της και κληρονόμησαν μεγάλη περιουσία. Στο τέλος όλη η περιουσία έμεινε στην καλή σύζυγο και καλή μητέρα, η οποία βοήθησε και τα παιδιά της για την καλή τους αποκατάσταση, βοήθησε και άλλους φτωχούς, και αυτή έζησε τα υπόλοιπα χρόνια της χωρίς φτώχεια. Αν και όταν ζούσε φτωχικά, πάλι ήταν πλούσια, γιατί ήταν πλούσια σε αισθήματα – το κυριώτερο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τον χειμώνα κάνουμε υπομονή με την ελπίδα της ανοίξεως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βλέπω ότι δεν προχωράω πνευματικά και στενοχωριέμαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μια φορά κάποιος είχε φυτέψει ένα κλήμα καί, ενώ δεν είχε πιάσει ακόμη ρίζες, είχε την απαίτηση να βγάλη σταφύλια, να κάνη άφθονο κρασί, για να πίνη, να ευφραίνεται και να μεθάη. Έτσι κάνεις κι εσύ. Φύτεψες μια κληματσίδα και θέλεις αμέσως να πιής κρασί. Αυτό δεν γίνεται. Το κλήμα δεν το φυτεύεις σήμερα και αύριο πίνεις κρασί. Σε έναν χρόνο μπορεί να φάς μερικά τσαμπιά. Σε δυο χρόνια θα φάς ένα κοφίνι σταφύλια και σε πέντε χρόνια θα πιής και κρασί. Να αγωνίζεσαι λοιπόν και να κάνης υπομονή, αν θέλης να απολαύσης καρπούς πνευματικούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν έχω συνηθίσει να περιμένω και εύκολα χάνω την υπομονή μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χρειάζεσαι υπομονή και σύνεση. Βλέπεις, πολλές φορές, ενώ κάνει κανείς υπομονή μιά-δυό ώρες, για να ψηθή το φαγητό, δεν περιμένει δυο λεπτά να κρυώση, αλλά, χωρίς να σκεφθή, τρώει και καίγεται. Λοιπόν... Όταν επιστρέψω στο Άγιον Όρος, θα σού στείλω μία εικόνα της Αγίας Υπομονής. Μου έστειλαν τρεις εικόνες, δύο Οσίων και μία της Αγίας Υπομονής· των Οσίων τις έδωσα και τις δύο ευλογία, της Αγίας Υπομονής την κράτησα...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τώρα που ήρθατε δεν μου φέρατε κανένα «βότανο» από το Άγιον Όρος[241].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτήν την εποχή δεν υπάρχουν «βότανα» στο περιβόλι της Παναγίας... Πρέπει να έρθη η άνοιξη. Αλλά, για να έρθη η άνοιξη, χρειάζεται να κάνης λίγη υπομονή να περάση ο χειμώνας. Επομένως τώρα το καλύτερο και αποτελεσματικώτερο «βότανο» για σένα είναι η υπομονή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νιώθω να βρίσκωμαι στην καρδιά του πνευματικού χειμώνα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν θέλης να αλλάξη ο καιρός, να γίνη γλυκός, να ανθίσης και να καρπίσης, να παράγης καρπούς αρετής, πρέπει να χαίρεσαι και την παγωνιά και τις λιακάδες, γιατί όλα βοηθούν για το καλό. Τον πνευματικό χειμώνα τον περνάμε με υπομονή και την υπομονή την δίνει η ελπίδα της πνευματικής ανοίξεως. Ύστερα, το καλοκαίρι αναγνωρίζουμε το καλό του χειμώνα που γέμισε τις δεξαμενές με νερό και εξαφάνισε με τις παγωνιές όλα τα μικρόβια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός όλα τα οικονόμησε σοφά για την σωτηρία μας και μας βοηθάει σαν Καλός Πατέρας· από μας χρειάζεται μόνο λίγη υπομονή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Η πνευματική χαρά
- type: h2
  initial:
    ru: ''
  text:
    ru: Η Παναγία έφερε στον κόσμο την χαρά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορείτε να μας ψάλετε το Μεγαλυνάριο που είχατε γράψει για την Παναγία[242];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έλα να το ψάλουμε μαζί. «Εύρες πολλήν Χάριν παρά Θεού, Μήτερ του Δεσπότου, Μεγαλόχαρη, αληθώς, Κεχαριτωμένη, ως Γαβριήλ εβόα, Βασίλισσα Αγγέλων, φρούρει τους δούλους σου». Να σού πω τώρα και ένα δογματικό: Η Παναγία ήταν Κόρη και Μητέρα, Δούλη και Βασίλισσα, Βασίλισσα όλου του κόσμου. Χωράει στον νού του ανθρώπου αυτό; Και ο Ευαγγελισμός της Θεοτόκου είναι κάτι το υπερφυσικό, έξω της λογικής. Εύχομαι η Παναγία να σού δώση την χαρά του Ευαγγελισμού και ο Άγγελος να σε ευλογήση, για να έχης πνευματική πρόοδο. Αμήν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ένα τροπάριο λέει: «Χαίρε η της Εύας χαρά· η γαρ εκείνης λύπη δια του τόκου σου πέπαυται, Αγνή»[243].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ό,τι καλό κι αν βρη ο άνθρωπος να πη για την Παναγία, δεν θα μπορέση να εκφράση το μεγαλείο Της. Η Παναγία με την υπακοή Της άνοιξε πάλι για μας τον Παράδεισο, που τον είχε κλείσει η παρακοή της Εύας. Η Εύα έσπασε τον κρίκο που μας ένωνε με τον Θεό και έφερε στον κόσμο λύπη και πόνο[244]· η Παναγία ένωσε πάλι τον κρίκο και έφερε στον κόσμο την παραδεισένια χαρά.Μας συνέδεσε με τον Θεό, αφού ο Χριστός είναι Θεάνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Αρχάγγελος Γαβριήλ έφερε στον κόσμο την χαρμόσυνη αγγελία ότι οι άνθρωποι χάρη στην Παναγία βρήκαν «χάριν παρά Θεού». Χαίρεται η Παναγία, γιατί σαρκώθηκε ο Λόγος του Θεού και μας λύτρωσε από την αμαρτία. Χαιρόμαστε και εμείς, γιατί η Παναγία μας έβγαλε ασπροπρόσωπους. Γι᾿ αυτό ψάλλουμε τα Χριστούγεννα: «Η έρημος προσφέρει στον Χριστό την φάτνη και εμείς οι άνθρωποι προσφέρουμε την Μητέρα Του, την Παναγία»[245].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όπου Χριστός, εκεί χαρά αληθινή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές δεν μπορώ να χαρώ, και τότε σκέφτομαι μήπως η χαρά δεν είναι για μένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί λές; Δεν είναι η χαρά για σένα; Και για ποιόν είναι; για το ταγκαλάκι; Χαμένο τόχεις; Για τον άνθρωπο είναι η χαρά. Ο Θεός δεν έδωσε λύπη· έδωσε μόνο χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί όμως, Γέροντα, δεν έχω πάντοτε μέσα μου χαρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο νούς σου δεν είναι στον Θεό, πώς θα νιώσης την χαρά του Θεού; Εσύ ξεχνάς τον Χριστό και ο νούς σου γυρίζει συνέχεια στις δουλειές και στις μηχανές, και έτσι σταματάει η πνευματική σου μηχανή. Βάλε λοιπόν μπρός την ευχή και την σιγανή ψαλμωδία, και μετά θα τρέχης και θα γυρίζης σαν σβούρα γύρω από τον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μόνον κοντά στον Χριστό βρίσκει κανείς την πραγματική, την γνήσια χαρά, γιατί μόνον ο Χριστός δίνει χαρά και παρηγοριά πραγματική. Όπου Χριστός, εκεί χαρά αληθινή και αγαλλίαση παραδεισένια. Όσοι είναι μακριά από τον Χριστό, δεν έχουν πραγματική χαρά. Μπορεί να κάνουν όνειρα: «θά φτιάξω αυτό, θα φτιάξω το άλλο, θα πάω εδώ, θα πάω εκεί», μπορεί να απολαμβάνουν τιμές ή να τρέχουν στις διασκεδάσεις και να χαίρωνται, αλλά η χαρά που νιώθουν δεν είναι δυνατόν να γεμίση την ψυχή τους. Αυτή η χαρά είναι υλική, κοσμική χαρά, αλλά από υλικές χαρές δεν γεμίζει η ψυχή, και ο άνθρωπος μένει μ᾿ ένα κενό στην καρδιά του. Είδες τί λέει ο Σολομών; «Έχτισα σπίτια, φύτεψα αμπέλια, έκανα κήπους, μάζεψα χρυσάφι, απέκτησα ό,τι πόθησε η καρδιά μου, αλλά στο τέλος κατάλαβα ότι όλα αυτά είναι μάταια»[246].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η κοσμική χαρά δίνει κάτι το πρόσκαιρο, κάτι για εκείνη την στιγμή, δεν δίνει αυτό που δίνει η πνευματική χαρά. Η πνευματική χαρά είναι ζωή παραδεισένια. Όσοι πέρασαν πρώτα από την Σταύρωση και αναστήθηκαν πνευματικά, ζουν την πασχαλινή χαρά. «Πάσχα, Κυρίου Πάσχα»[247]! Και μετά έρχεται η Πεντηκοστή!... Και όταν φθάσουν πια στην Πεντηκοστή και δεχθούν την πύρινη γλώσσα, το Άγιο Πνεύμα, τότε όλα τελειώνουν[248]...
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική χαρά έρχεται με την πνευματική εργασία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πέστε μας κάτι για τις ουράνιες χαρές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και σ᾿ αυτήν την ζωή υπάρχουν ουράνιες χαρές και ηδονές και αναρωτιέται κανείς αν στην άλλη ζωή υπάρχει κάτι ανώτερο από αυτό που ζη εδώ. Αυτές οι χαρές δεν εκφράζονται, μόνο βιώνονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορείς να φθάσης σ᾿ αυτήν την κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να έρθης στην κατάσταση που να μην μπορής να χωρέσης την χαρά ούτε να την εκφράσης, χρειάζεται να προσέξης τρία πράγματα: Να κινήσαι απλά, να μην ασχολήσαι με τους άλλους, να λές την ευχή. Αν κάνης αυτά, θα έρθη ώρα που θα νιώθης τόση χαρά που θα μου λές: «Παππούλη μου, παλάβωσα! Μήπως δεν είμαι καλά; τί είναι αυτό που νιώθω;». Τέτοια παλαβή χαρά θα έχης!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, για να έχη κανείς πνευματική χαρά, πρέπει να είναι σε καλή κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ τί λές; Πότε θα έχη κανείς πνευματική χαρά; όταν είναι ακατάστατος; Η εσωτερική χαρά έρχεται με την εσωτερική τακτοποίηση και δίνει φτερά στην ψυχή. Όταν δεν ζεσταθή η ψυχή με την εσωτερική εργασία, μοιάζει με αυτοκίνητο που έχει παγωμένη την μηχανή και το σπρώχνουν, για να προχωρήση. Ενώ η εσωτερική εργασία – η εγρήγορση με την παρακολούθηση του εαυτού μας, η μελέτη και η ευχή – θερμαίνει την ψυχή και η μηχανή παίρνει μπρός και τρέχει. Τότε ο άνθρωπος παραβλέπει πλέον τα εξωτερικά και κάνει άλματα πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τότε, Γέροντα, δεν επηρεάζεται, αν βρεθή σε δύσκολο περιβάλλον;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν επηρεάζεται, γιατί κινείται σε άλλη ατμόσφαιρα· βρίσκεται έξω από αυτό το περιβάλλον. Και επειδή κινείται σε άλλη ατμόσφαιρα, αυτό το περιβάλλον δεν τον ενοχλεί. Είναι σαν να μιλάνε μια άλλη γλώσσα που αυτός δεν την γνωρίζει και γι᾿ αυτό δεν καταλαβαίνει τί λένε. Και καλύτερα που δεν καταλαβαίνει, γιατί, αν καταλάβαινε έστω και κάτι, θα πήγαινε η προσοχή του προς τα εκεί. Τώρα όμως είναι αφοσιωμένος στην γλώσσα που γνωρίζει. Έτσι αρχίζει το φτερούγισμα το εσωτερικό. Ξέρετε τί είναι φτερούγισμα εσωτερικό; Φτερά ποιό αγγελικό τάγμα έχει; Τα Χερουβίμ ή τα Σεραφίμ; «Έξ πτέρυγες»[249], που λέει ο Προφήτης Ησαΐας, ποιό τάγμα έχει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τα Σεραφίμ, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρετε πώς κάνουν τα Σεραφίμ; Χτυπούν τα φτερά τους με έναν ρυθμό... Έτσι χτυπάει και η καρδιά, με παλμό, όταν υπάρχη φτερούγισμα εσωτερικό. Είναι πανηγύρι τότε η ζωή. Εσείς όμως ακόμη είστε δεμένες με τον εαυτό σας· δεν λυθήκατε από τον εαυτό σας, κι έτσι η καρδιά δεν έχει ελευθερωθή, για να φθάση σ᾿ αυτήν την κατάσταση, να σκιρτά από χαρά. Για γευθήτε, βρέ παιδιά, πρώτα αυτήν την χαρά και μετά ελάτε να κουβεντιάσουμε!
- type: h2
  initial:
    ru: ''
  text:
    ru: Η θεϊκή χαρά έρχεται με το δόσιμο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάθε άνθρωπος που ζη κατά Θεόν έχει πνευματική χαρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φυσικά! Για να χαίρεται κανείς αληθινά, πνευματικά, πρέπει να αγαπάη καί, για να αγαπάη, πρέπει να πιστεύη. Δεν πιστεύουν οι άνθρωποι και γι᾿ αυτό δεν αγαπούν, δεν θυσιάζονται και δεν χαίρονται. Αν πίστευαν, θα αγαπούσαν, θα θυσιάζονταν και θα χαίρονταν. Από την θυσία βγαίνει η μεγαλύτερη χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, χαίρεσαι, όταν αγαπάς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, ανάποδα το είπες! Όταν αγαπάς, χαίρεσαι. Και όταν αυξηθή η αγάπη, τότε ο άνθρωπος δεν ζητάει την χαρά για τον εαυτό του, αλλά θέλει να χαίρωνται οι άλλοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, η χαρά απορρέει από κάπου, ενώ η αγάπη υπάρχει από μόνη της;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έτσι είναι· η αγάπη υπάρχει από μόνη της, ενώ η χαρά πηγάζει από την αγάπη. Όταν δίνης την αγάπη, τότε έρχεται η χαρά. Δίνει αγάπη ο άνθρωπος και δέχεται χαρά· ανταμείβεται δηλαδή με την χαρά που νιώθει. Βλέπεις, κάποιος παίρνει ένα πράγμα που του δίνουν και χαίρεται γι᾿ αυτό το ένα. Άλλος τα δίνει όλα και χαίρεται για όλα. Η χαρά που νιώθει ο άνθρωπος, όταν παίρνη, είναι χαρά ανθρώπινη. Ενώ η χαρά που νιώθει, όταν δίνη, είναι θεϊκή. Η θεϊκή χαρά έρχεται με το δόσιμο!
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι πνευματικές χαρές είναι δώρα του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς πληροφορείται κανείς ότι είναι συμφιλιωμένος με τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η εσωτερική χαρά, η θεία παρηγοριά, που νιώθει μέσα του είναι μια πληροφορία ότι είναι συμφιλιωμένος με τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να αισθάνεται κανείς συμφιλιωμένος με τον Θεό και να μη νιώθη χαρά, θεία παρηγοριά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν μπορεί, κάτι θα νιώθη. Μπορεί να ένιωσε μια φορά δυνατή παρηγοριά και μετά η παρηγοριά που νιώθει να είναι λιγώτερη και γι᾿ αυτό να νομίζη ότι δεν νιώθει θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς γίνεται, Γέροντα, μερικές φορές, ενώ βρίσκεσαι σε μια καλή πνευματική κατάσταση και χαίρεσαι, ξαφνικά να χάνης αυτήν την χαρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σού στέλνει ο Θεός πνευματικές χαρές και χαίρεσαι. Τις παίρνει, κι εσύ μετά τις αναζητάς και καταβάλλεις περισσότερο αγώνα και προχωράς πιο πολύ πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί χαρά είναι αυτή που νιώθω; Μήπως δεν έχω συναίσθηση της αμαρτωλότητός μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, παιδί μου! Σού δίνει ο Θεός καμμιά σοκολάτα, για να χαίρεσαι. Τώρα σοκολάτες, αργότερα κρασί, σαν κι αυτό που πίνουν στον Παράδεισο. Ξέρεις τί γλυκό κρασί πίνουν εκεί; Ού! Λίγο φιλότιμο να δη ο Θεός, λίγη καλή διάθεση, και δίνει πλούσια την Χάρη Του και σε μεθάει από αυτήν την ζωή. Την πνευματική αλλοίωση που δέχεται ο άνθρωπος και την αγαλλίαση που νιώθει στην καρδιά του, όταν τον επισκέπτεται η Χάρις του Θεού δεν μπορεί να την δώση ούτε ο ...μεγαλύτερος καρδιολόγος του κόσμου. Όταν νιώθης αυτήν την χαρά, προσπάθησε να την κρατήσης, όσο μπορείς περισσότερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει, Γέροντα, να ζητάμε από τον Θεό να μας δίνη πνευματικές χαρές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι φθηνό να ζητάμε πνευματικές χαρές· αυτές έρχονται μόνες τους, όταν υπάρχουν οι προϋποθέσεις. Αν θέλης να είσαι συνέχεια χαρούμενη, αυτό έχει φιλαυτία. Ο Χριστός ήρθε στον κόσμο, για να σταυρωθή από αγάπη· πρώτα σταυρώθηκε και μετά αναστήθηκε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα παιδιά του Θεού δεν εργάζονται ούτε για ουράνιο μισθό, αλλά ούτε και για πνευματικές χαρές σ᾿ αυτήν την ζωή. Γιατί τα παιδιά δεν πληρώνονται από τον Πατέρα, αφού όλη η περιουσία του Πατέρα τους είναι δική τους. Άλλο τα θεία δώρα που θα προσφέρη ο Θεός σαν Καλός Πατέρας και σ́ αυτήν την ζωή και στην αιώνια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο πνευματικός πόνος είναι χαρά πνευματική
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί να κρατήση κανείς μέσα του την χαρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν τα αντιμετωπίζη όλα πνευματικά. Τότε ακόμη και οι αρρώστιες και οι δοκιμασίες δεν του αφαιρούν την χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν πρέπει ο άνθρωπος να έχη απαλλαγή από τα πάθη του, για να αντιμετωπίζη τις δοκιμασίες πνευματικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν κανείς δεν έχη απαλλαγή από τα πάθη και περνάη δοκιμασίες, στενοχώριες, πάλι μπορεί να είναι χαρούμενος. Εάν σκεφθή ότι οι στενοχώριες αυτές είναι το φάρμακο για τα πάθη του, τότε τις δέχεται με χαρά, όπως ο άρρωστος δέχεται ευχάριστα το πικρό φάρμακο με την ελπίδα ότι θα γίνη καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς συνδυάζονται, Γέροντα, η χαρά και ο πόνος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Στην πνευματική ζωή συμβαίνει κάτι το παράδοξο: Όταν ο άνθρωπος υπομένη για την αγάπη του Χριστού, ακόμη και μαρτύριο, πλημμυρίζει η καρδιά του από θεία ηδονή. Το ίδιο, και όταν συμμετέχη στο Πάθος του Κυρίου. Όσο δηλαδή σκέφτεται ότι ο Χριστός σταυρώθηκε για τις αμαρτίες μας και πονάει, τόσο ανταμείβεται με θεία αγαλλίαση. Πονάει-αγάλλεται, πονάει-αγάλλεται. Και όσο περισσότερο πονάει, τόσο μεγαλύτερη χαρά έχει. Νιώθει σαν να τον χαϊδεύη ο Χριστός και να του λέη: «Μη στενοχωριέσαι, παιδάκι μου, για μένα».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια αδελφή έλεγε: «Δεν θέλω χαρά· θέλω να στενοχωριέμαι για τον Χριστό. Αφού ο Χριστός σταυρώθηκε για μένα, πώς εγώ να χαίρωμαι; Γιατί ο Χριστός μου δίνει χαρά;». Ζούσε καταστάσεις πνευματικές καί, όσο συμμετείχε στο Πάθος του Χριστού και στενοχωριόταν φιλότιμα, τόσο πιο πολλή χαρά της έδινε ο Χριστός. Την είχε παλαβώσει!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η σταύρωση προηγείται πάντοτε της αναστάσεως και φέρνει νίκη. Ο σταυρός φέρνει δόξα. Ο Χριστός, αφού ανέβηκε πρώτα στον Γολγοθά με τον Σταυρό και αφού σταυρώθηκε, μετά από τον Σταυρό ανέβηκε στον Πατέρα. Και τώρα ο Εσταυρωμένος Χριστός γλυκαίνει τις πίκρες των ανθρώπων και ο σταυρωμένος άνθρωπος μιμείται τον Θεάνθρωπο Ιησού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Καλός μας Ιησούς πήρε μαζί με όλη την αμαρτία του κόσμου και όλες τις πίκρες και μας άφησε την χαρά και την αγαλλίαση, την οποία αισθάνεται όποιος έχει απεκδυθή τον παλαιό του άνθρωπο και ζη πλέον μέσα του ο Χριστός. Τότε ζη μέρος της χαράς του Παραδείσου επί της γής, καθώς λέει το Ευαγγέλιο: «Η βασιλεία του Θεού εντός υμών εστιν»[250].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ευχαριστώ τον Θεό που με αξίωσε να γνωρίσω πολλούς τέτοιους ανθρώπους και Τον παρακαλώ να με βοηθήση να μην Τον λυπήσω, τουλάχιστον στο εξής, έστω κι αν δεν αξιωθώ τέτοιες καταστάσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εύχομαι να έχετε πάντοτε την πνευματική χαρά σ᾿ αυτήν την ζωή, και στην άλλη, την αιώνια, να χαίρεσθε μόνιμα πια κοντά στον Χριστό. Αμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 5 – Διάκριση, η κορωνίδα των αρετών
- type: h2
  initial:
    ru: ''
  text:
    ru: Ανάλογη με την πνευματική μας κατάσταση είναι και η διάκρισή μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί οι Πατέρες λένε ότι η αρετή της διακρίσεως είναι «μείζων πασών των αρετών»[251];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η διάκριση δεν είναι απλώς μια αρετή· είναι η κορώνα, το στεφάνι, των αρετών.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ανάλογη με την πνευματική μας κατάσταση, ανάλογη με την ποιότητα των αρετών μας, είναι και η διάκρισή μας. Αν οι αρετές μας είναι χάρτινες, χάρτινο θα είναι και το στεφάνι τους, η διάκριση δηλαδή που θα έχουμε. Αν οι αρετές μας είναι από μπρούντζο, μπρούντζινο θα είναι και το στεφάνι τους. Αν είναι από χρυσό, χρυσό θα είναι και το στεφάνι τους. Αν οι αρετές μας έχουν διαμαντόπετρες, διαμαντόπετρες θα έχη και το στεφάνι τους, η διάκριση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι διάκριση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Διάκριση είναι η πνευματική όραση. Και πνευματική όραση έχει εκείνος που έχει εξαγνισμένο νού· γι᾿ αυτό έχει και πνευματική διαύγεια και θείο φωτισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Άγιος Ιωάννης της Κλίμακος λέει: «Με τα δύο μάτια βλέπουμε σωματικά και με την διάκριση βλέπουμε πνευματικά»[252].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έτσι είναι. Βλέπεις, αν τα μάτια μας είναι γερά, βλέπουμε καλά, ενώ, αν έχουμε μια πάθηση στα μάτια, δεν βλέπουμε καλά. Το φως μας είναι ανάλογο με την υγεία των ματιών μας. Το ίδιο συμβαίνει και στην πνευματική ζωή. Ανάλογη με την πνευματική μας υγεία είναι και η πνευματική μας όραση, η διάκρισή μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς ανοίγουν τα μάτια της ψυχής;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με λάσπη δεν άνοιξε ο Χριστός τα μάτια του τυφλού[253]; Αλλά, για να ανοίξουν τα μάτια της ψυχής μας, πρέπει να πετάξουμε από πάνω μας την λάσπη της αμαρτίας. «Ιλύν γαρ εκτινάξας όμματος νόου»[254], δεν λέει; Αν δεν πετάξουμε τον εαυτό μας και δεν ελευθερωθούμε από τον παλαιό μας άνθρωπο, αλλά υπάρχη μέσα μας φιλαυτία, εγωισμός, ανθρωπαρέσκεια, δεν μπορούμε να έχουμε διαύγεια πνευματική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο προχωρεί ο άνθρωπος στην πνευματική ζωή, τόσο περισσότερο ανοίγουν τα μάτια της ψυχής του. Ο νούς του λαμπικάρεται, διακρίνει καλύτερα τα σφάλματά του και τις πολλές ευεργεσίες του Θεού, ταπεινώνεται, συντρίβεται εσωτερικά και έρχεται φυσιολογικά η Χάρις του Θεού, ο θείος φωτισμός, και αποκτά διάκριση. Τότε σε κάθε περίπτωση βλέπει καθαρά ποιό είναι το θέλημα του Θεού και δεν σκοντάφτει στην πνευματική του πορεία. Γιατί η διάκριση είναι το τιμόνι που οδηγεί τον άνθρωπο με ασφάλεια, ώστε να μην ξεφεύγη από τον ίσιο δρόμο και να μην πέφτη ούτε από δεξιά ούτε από αριστερά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, ξεκινάη κανείς από καλή διάθεση να κάνη κάτι καλό και τελικά φθάνη στα άκρα και γίνεται κακό, λείπει η διάκριση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να ξεκινάη καλά, αλλά, αν δεν προσέξη, μπαίνει ο εγωισμός μέσα και ξεφεύγει. Όταν μπαίνη ο εαυτός μας, το εγώ μας, στις ενέργειές μας, δημιουργούνται εμπάθειες και μετά αλωνίζει ο διάβολος. Γι᾿ αυτό να προσπαθήτε να ζήτε εσωτερικά, ταπεινά, να εργάζεσθε στην αφάνεια, για να έχετε τον θείο φωτισμό. Όποιος ζη εσωτερικά, ταπεινά, ξεπερνάει τις ανθρώπινες μικρότητες, τους φανατισμούς κ.λπ., και γίνεται ζηλωτής με την καλή έννοια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δυσκολεύομαι να διακρίνω ποιό είναι το σωστό σε κάθε περίπτωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχεις ανάγκη από εξαγνισμό, για να έλθη η διαύγεια η πνευματική. Να διαβάζης Λαυσαϊκό, Λειμωνάριο, Φιλόθεο Ιστορία και τον Αββά Βαρσανούφιο και να καθρεφτίζης σ᾿ αυτά τον εαυτό σου, για να αποκτήσης πνευματικό αισθητήριο. Τότε θα μπορής να ξεχωρίζης το χρυσό από το μπακίρι και θα γίνης χρυσοχόος πνευματικός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κάθε αρετή έχει ανάγκη από διάκριση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ισαάκ γράφει: «Ο Θεός ως προς την διάκρισιν λογίζεται την αρετήν»[255].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έτσι είναι. Κάθε πράξη μας, για να είναι ευάρεστη στον Θεό, και κάθε αρετή, για να είναι πράγματι αρετή, έχει ανάγκη από διάκριση. Η διάκριση είναι το άλας των αρετών. Γι'' αυτό και ο Χριστός μας λέει στο Ευαγγέλιο: «Πάσα θυσία αλί αλισθήσεται»[256]. Η άσκηση, ας υποθέσουμε, πόση διάκριση χρειάζεται! Πρέπει να λάβη υπ᾿ όψιν του ο άνθρωπος τις δυνάμεις που έχει, την πνευματική του κατάσταση κ.λπ. Αν ξεπεράση κανείς τα όρια, θα φθάση να μην μπορή να κάνη τίποτε και αυτό θα είναι εις βάρος όλης της πνευματικής του ζωής. Γι᾿ αυτό οι Πατέρες λένε ότι τα υπέρμετρα είναι του διαβόλου[257]. Για τον Μέγα Παΐσιο λ.χ. που μπορούσε να μείνη και είκοσι μέρες νηστικός, αν έκανε συνέχεια τριήμερα, αυτό δεν θα ήταν υπερβολή. Για έναν όμως που τρέμουν τα πόδια του και δεν μπορεί να κρατήση το τριήμερο[258]ούτε μια φορά τον χρόνο, αν θέλη να κάνη συνέχεια τριήμερα, αυτό είναι υπέρμετρο, ήγουν εκ του διαβόλου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στην άσκηση καταλαβαίνω ότι χρειάζεται διάκριση, αλλά για τις άλλες αρετές δυσκολεύομαι να το καταλάβω. Θα μπορούσατε να μας πήτε ένα παράδειγμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να πάρουμε εσένα για παράδειγμα· εσύ έχεις καρδιά μάνας καί..., να πω και το πιο κάτω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τρόπο ...κακιάς μητρυιάς. Έχεις τόση θυσία, τόση αυταπάρνηση, τόση καλωσύνη, και δεν έχεις διάκριση. Δεν προσέχεις να δής ποιός είναι αυτός που σού μιλάει και τί ακριβώς θέλει· δεν σκέφτεσαι πώς πρέπει να του φερθής, αλλά τον παίρνεις σβάρνα. Ο άλλος όμως που δεν βλέπει την καρδιά σου αλλά την συμπεριφορά σου, στενοχωριέται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, τί πρέπει να κάνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να παρακαλάς τον Θεό να σού δίνη φώτιση, για να τα αντιμετωπίζης όλα με διάκριση. Οπλίσου τώρα με την υπομονή και την προσευχή και σιγά-σιγά θα αποκτήσης και διάκριση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Και η αγάπη χρειάζεται διάκριση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ποιμήν λέει: «Μάθε τί θέλει ο αδελφός και ανάπαυσέ τον»[259]. Τί θέλει να πη ακριβώς;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εννοεί να μάθης τί ανάγκη έχει ο αδελφός σου, ο πλησίον σου, και ανάλογα να τον αναπαύσης, με την καλή έννοια. Γιατί και η αγάπη χρειάζεται διάκριση. Αν κάποιος λ.χ. είναι γαστρίμαργος, δεν πρέπει να του δίνης συνέχεια νόστιμα φαγητά, γιατί αυτό θα τον βλάψη. Θα κάνης νόστιμο φαγητό για έναν που έχει ανορεξία, για να μπορέση να το φάη. Ή, αν κάποιος έχη ζάχαρο και του δίνης γλυκά, αγάπη είναι αυτή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς γίνεται να αγαπάη κανείς το ίδιο όλους τους ανθρώπους και να τους αγαπάη με διάκριση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αγαπάει όλους το ίδιο, αλλά δεν εκδηλώνει την αγάπη του σε όλους το ίδιο. Άλλον τον αγαπάει από μακριά, γιατί χρειάζεται να τον κρατήση σε απόσταση, άλλον από κοντά, ανάλογα με το τί ωφελεί τον καθένα. Σε έναν δεν πρέπει καθόλου να μιλήση, σε άλλον πρέπει να πη δυο λόγια, σε άλλον λίγα παραπάνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, η εκδήλωση της αγάπης μου να βλάψη τον άλλον;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν ο άλλος έχη φιλότιμο και εσύ του δείξης πολλή αγάπη, τότε αλλοιώνεται με την καλή έννοια και προσπαθεί με κάθε τρόπο να σε ευχαριστήση, να μη σε λυπήση. Ο αναιδής όμως, αν του δείξης πολλή αγάπη, γίνεται ακόμη πιο αναιδής, γιατί η πολλή αγάπη τους μεν φιλότιμους τους κάνει πιο φιλότιμους, τους δε αναιδείς τους κάνει πιο αναιδείς. Οπότε, όταν δής πώς δεν βοηθάς με την αγάπη σου, την λιγοστεύεις με διάκριση· αλλά και αυτό από αγάπη το κάνεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχει περίπτωση να κάνω μία θυσία με καθαρά ελατήρια και να φθάσω στην αγανάκτηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, γι᾿ αυτό η θυσία πρέπει να γίνεται με διάκριση. Να προσέχης να μην ξεπερνάς την αντοχή σου, γιατί και οι σωματικές δυνάμεις έχουν όριο. Όταν ξεπεράσης την σωματική αντοχή σου, τότε, αν κάποιος σού πή: «τίποτε δεν έκανες απ᾿ το πρωί», μπορεί να πής μέσα σου: «Βρέ τον αχάριστο! Εγώ απ᾿ το πρωί σκοτώθηκα στην δουλειά, κι αυτός λέει ότι δεν έκανα τίποτε!». Έτσι πάνε όλα χαμένα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άν, Γέροντα, προς στιγμήν μέσα μου αγανακτήσω, αλλά αμέσως σκεφθώ ότι συνέβη αυτό, γιατί τα ελατήριά μου δεν ήταν καθαρά, τότε πάλι τα χάνω όλα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σ᾿ αυτήν την περίπτωση σού δίνει μια σπρωξιά το ταγκαλάκι κι εσύ του δίνεις μια σφαλιάρα. Οπότε τρώει το ταγκαλάκι την σφαλιάρα και φεύγει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η διάκριση δεν έχει όρια και κανόνες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η διάκριση έχει ένα ορισμένο μέτρο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, η διάκριση δεν έχει ορισμένο μέτρο· δεν έχει όρια και κανόνες. Έχει και το «όχι», έχει και το «ναί»· έχει και το λίγο, έχει και το πολύ. Σε μια αδελφή που έχει διάκριση δεν χρειάζεται να της πής τί να κάνη ή πώς να μιλήση. Κινείται πάντοτε σωστά, γιατί πάντοτε σκέφτεται πνευματικά. Έχει θείο φωτισμό και αισθητήριο πνευματικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάποια φορά μου είπατε ότι έχω στενοκεφαλιά. Τί ακριβώς εννοούσατε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Βλέπεις στενά τα πράγματα· κοιτάς μόνον τί πρέπει να γίνη και αδιαφορείς για τον άνθρωπο. Στην Ακολουθία λ.χ. λές: «Η τάδε αδελφή πρέπει να σταθή εκεί και να ψάλη αυτό». Δεν εξετάζεις αν έχη κουράγιο να σταθή κι αν μπορή να το ψάλη αυτό. Να βλέπης πρώτα πότε και πώς πρέπει να εφαρμοσθή το «πρέπει» και ύστερα να ζητάς την εφαρμογή. Δεν έχεις διάκριση, και γι᾿ αυτό τα αντιμετωπίζεις όλα ξερά, τυπικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Για να εφαρμόση κανείς σωστά τους κανόνες της Εκκλησίας και να ωφελήση τους ανθρώπους, πρέπει να έχη πνευματική κατάσταση, για να έχη και πνευματική διάκριση. Γιατί αλλιώς μένει στο γράμμα του νόμου· το γράμμα του νόμου όμως «αποκτείνει»[260]. Σού λέει ο άλλος: «Το Πηδάλιο[261]έτσι γράφει» καί, όπως τα βρίσκει γραμμένα, τα εφαρμόζει κατά γράμμα· ενώ θα έπρεπε να εξετάζη την κάθε περίπτωση ξεχωριστά. Όπως έχω δεί, σε μια περίπτωση μπορεί να κρύβωνται και άλλες χίλιες περιπτώσεις. Το επιτίμιο λ.χ. πρέπει να είναι ανάλογο με τον άνθρωπο, με την κατάσταση στην οποία βρίσκεται, με το σφάλμα που έκανε, με την μετάνοια που έδειξε και τόσα άλλα· δεν υπάρχει μία συνταγή, ένας κανόνας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η διάκριση, ο θείος φωτισμός, είναι το πάν σε όλες τις περιπτώσεις. Γι᾿ αυτό πάντα εύχομαι, φώτιση-φώτιση να δίνη ο Θεός στον κόσμο. «Χριστέ μου, λέω, έχουμε χάσει και το σπίτι μας και τον δρόμο που πάει σ᾿ αυτό. Φώτισέ μας να βρούμε το σπίτι μας, τον Πατέρα μας. Δώσε μας την θεία γνώση».
- type: h2
  initial:
    ru: ''
  text:
    ru: Επίλογος – Η Καλή Ανησυχία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Όταν δεν ξεχνούμε ότι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ο σκοπός μας εδώ στην γή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: είναι η απόκτηση της Βασιλείας του Θεού,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τότε μπαίνει μέσα μας η καλή ανησυχία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτή η ανησυχία αργά ή γρήγορα θα μεταφέρη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν ψυχή μας στον πνευματικό χώρο,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: όπου θα βρη άφθονο οξυγόνο,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: θά ζωντανέψη και θα πετάξη ψηλά».
- type: h2
  initial:
    ru: ''
  text:
    ru: Καλή ανησυχία, η καλή αγωνία για τον«καλόν αγώνα»[262]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι η καλή ανησυχία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η καλή ανησυχία είναι η καλή αγωνία για τον «καλόν αγώνα»[263]. Αγωνίζεται κανείς, παρακολουθεί τον εαυτό του, εντοπίζει τί εμποδίζει την πνευματική του πρόοδο, προβληματίζεται, ζητάει, αν χρειάζεται, βοήθεια, και κάνει εργασία πνευματική. Βλέπει λ.χ. ότι στην τάδε περίπτωση φέρθηκε υπερήφανα· αμέσως σκέφτεται: «Πώς χτυπιέται η υπερηφάνεια; Με την ταπείνωση. Ταπείνωση λοιπόν». Τάκ-τάκ, χτυπάει την υπερηφάνεια με το τσεκούρι. Με λίγα λόγια ζητάει την εξέλιξη την πνευματική και κάνει εργασία πνευματική. Βλέπεις, ο μαθητής τελειώνει την πρώτη δημοτικού, πηγαίνει στην δευτέρα, τελειώνει το δημοτικό, πηγαίνει στο γυμνάσιο, στο λύκειο κ.λπ. Αν δεν είναι καλός μαθητής, θα ζητήση βοήθεια. Ή, για να μπή στο Πανεπιστήμιο, κάνει φροντιστήριο. Μετά, για να πάρη το πτυχίο, διαβάζει εντατικά. Στην συνέχεια μπορεί να κάνη μεταπτυχιακό, ύστερα διδακτορικό· μπορεί να πάη και στο εξωτερικό για περισσότερες σπουδές. Και όλα αυτά τα κάνει, για να εξελιχθή σε μια επιστήμη. Πόσο μάλλον στην πνευματική ζωή, που είναι η πνευματική επιστήμη, πρέπει να έχη κανείς ανησυχία για την πνευματική του εξέλιξη!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η καλή ανησυχία είναι φτερούγισμα. Δίνει στην ψυχή λεβεντιά, ζωντάνια· δεν φέρνει άγχος και στενοχώρια, αλλά παρηγοριά· δεν είναι κόπος, δεν είναι αγωνία, αλλά ζήλος για αγώνα. Εσείς μερικές φορές παρουσιάζετε μια στασιμότητα. «Έτσι αγωνίζομαι, λέτε, σ᾿ αυτήν την κατάσταση βρίσκομαι», και μένετε εκεί. Εντάξει· βρίσκεσθε σ᾿ αυτήν την κατάσταση. Ένας Άγιος όμως τί θα έκανε σ᾿ αυτήν την περίπτωση; Δεν υπάρχει αυτό το τίναγμα από μέσα σας· αυτό το φτερούγισμα. Δεν έχετε αλλοιωθή εσωτερικά, γιατί δεν μπήκε μέσα σας ο μοχλός της καλής ανησυχίας, για να σάς τινάξη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να πάρουμε στα ζεστά την σωτηρία της ψυχής μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, γράφετε στον βίο του Γέροντα Χατζη-Γεώργη: «Το ενδιαφέρον της σωτηρίας της ψυχής ταπεινώνει το σώμα και νεκρώνει τα πάθη»[264]. Σ᾿ εμένα λείπει αυτό το ενδιάφερον;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βασικά ο νούς και η καρδιά σου δεν είναι εκεί. Ο νούς και η καρδιά πρέπει να είναι συνέχεια στο πώς θα φθάσουμε στον προορισμό μας, στην Βασιλεία των Ουρανών. Όταν πονάη η καρδιά για την σωτηρία της ψυχής, και ο νούς πηγαίνει εκεί που είναι ο πόνος της καρδιάς. Ο πόνος είναι όλη η υπόθεση. Και όταν πονάς, δεν θέλεις να φάς, δεν θέλεις να κοιμηθής. Όποιος έχει καλή ανησυχία, παίρνει τα πράγματα στα ζεστά. Φαίνεται όμως εσύ δεν έχεις βάλει ακόμη στόχο τον Ουρανό· έχεις στόχο την γή. Δεν πήρες ακόμη στα ζεστά την σωτηρία της ψυχής σου. Αλλά, αν δεν πάρουμε στα ζεστά την σωτηρία της ψυχής μας, τί θα πάρουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν μπορούμε να είμαστε αδιάφοροι για την σωτηρία της ψυχής μας. Πρέπει να μας απασχολή συνέχεια πώς θα σωθούμε. Αν δεν μας απασχολή αυτό, θα μένουμε δεμένοι με τα γήινα και θα είμαστε συνέχεια βραχυκυκλωμένοι. Όταν δεν ξεχνούμε ότι ο σκοπός μας εδώ στην γη είναι η απόκτηση της Βασιλείας του Θεού, τότε μπαίνει μέσα μας η καλή ανησυχία. Αυτή η ανησυχία αργά ή γρήγορα θα μεταφέρη την ψυχή μας στον πνευματικό χώρο, όπου θα βρη άφθονο οξυγόνο, θα ζωντανέψη και θα πετάξη ψηλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Θεός δεν έδωσε το μυαλό στον άνθρωπο, για να καταγίνεται συνέχεια με το πώς να βρη ταχύτερο μέσο να πηγαίνη από την μια χώρα στην άλλη, αλλά, για να καταγίνεται πρώτα με το κυριώτερο: πώς να φθάση στον προορισμό του, κοντά στον Θεό, στην αληθινή χώρα, στον Παράδεισο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: «Δίδου σοφώ αφορμήν, και σοφώτερος έσται»[265]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί μπορεί να κεντήση έναν άνθρωπο που είναι αδιάφορος, για να αρχίση να ζη πνευματικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλά μπορούν να τον κεντήσουν, όταν ο ίδιος θέλη να προχωρήση. Αλλά, αν ο ίδιος δεν θέλη να προχωρήση, απλώς θα γεμίση πληγές από το κέντημα, σαν μερικά βόδια που τα κεντάς με την βουκέντρα, για να πάνε πιο γρήγορα, αλλά δεν προχωρούν· μόνον πληγώνονται από την βουκέντρα και δουλειά πάλι δεν βγάζουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κάποιος έχη καλή διάθεση και τον κεντάς, δεν θα βοηθήση και ο Θεός, ώστε κάτι να κάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, θα βοηθήση και ο Θεός, αλλά με ένα κέντημα πρέπει να τρέξη. Αλλιώς κουράζεται κι εκείνος που τον κεντάει. Όταν σκαλώνη κανείς συνέχεια στα ίδια, γιατί δεν θέλει να διορθωθή, είναι πολύ κουραστικό για τον άλλον που προσπαθεί να τον βοηθήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν δεν μπή στον άνθρωπο η καλή ανησυχία, για να παίρνη στροφές και να δουλεύη πνευματικά, δεν μπορεί να κάνη προκοπή πνευματική· μένει τετράγωνη ρόδα και θέλει κάθε τόσο σπρώξιμο. Δίνεις μιά, «γκάπ», σταματάει· του ξαναδίνεις μιά, «γκάπ», πάλι σταματάει. Πώς να πάη έτσι μπροστά; Αν έχη να κάνη μια μακρινή πορεία, γίνεται με σπρώξιμο να την φέρη σε πέρας; Και η πνευματική πορεία είναι μακρινή· δεν είναι εκατό ή διακόσια μέτρα, για να τον σπρώξουν και να προχωρήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς προκαλείται η καλή ανησυχία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ας υποθέσουμε, διαβάζω ένα πνευματικό βιβλίο και μου κάνει εντύπωση κάποιο σημείο. Σταματάω εκεί – σαν να βρίσκω ένα πετράδι και θέλω να δώ τί είναι – και το μελετώ. Καθρεφτίζω σ᾿ αυτό τον εαυτό μου, ρωτάω μετά αν το κατάλαβα σωστά και προσπαθώ να το εφαρμόσω. Στην συνέχεια ρωτάω αν το εφάρμοσα σωστά. Έτσι σιγά-σιγά μαθαίνω να προχωράω σωστά στην πνευματική ζωή. Ποιός μου είχε μιλήσει εμένα για Αββά Ισαάκ; Ένας μπακάλης μου τύλιξε μια φορά μια ρέγκα σε ένα φύλλο από το περιοδικό «Αγιορειτική Βιβλιοθήκη». Όταν την ξετύλιγα, έπεσε το μάτι μου στο κείμενο που ήταν γραμμένο στο χαρτί. Ήταν από τον Αββά Ισαάκ. Το πήρα, το στέγνωσα στον ήλιο, το διάβασα και με διέλυσε. Με την ανάγνωση αυτήν πέρασα έναν χρόνο· το διάβαζα-τό ξαναδιάβαζα, κι έτσι αγάπησα τον Αββά Ισαάκ. Αναρωτήθηκα αν υπάρχει βιβλίο. Έψαξα και τρόμαξα να βρώ και να πάρω το βιβλίο στα χέρια μου. Κι εσείς τόσα και τόσα διαβάζετε· δεν σάς κάνει κάτι εντύπωση; Αυτό που σάς κάνει εντύπωση να το αντιγράφετε. Αν το αντιγράψετε και το φέρνετε συχνά στον νού σας, δεν θα το ξεχάσετε εύκολα και θα το εφαρμόσετε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σε μερικούς λέω ένα-δυό λόγια και αμέσως γυαλίζουν τα μάτια τους. Τα σημειώνουν σε ένα τόσο δά χαρτάκι, τα εφαρμόζουν και προχωρούν παραπέρα. «Δίδου σοφώ αφορμήν, και σοφώτερος έσται»[266], δεν λέει ο Σολομών; Και άλλοι, αν και έχουν ακούσει ένα σωρό και έχουν βοηθηθή πολύ, δεν κάνουν τίποτε, γιατί δεν μπήκε μέσα τους η καλή ανησυχία. Έρχονται και μου κάνουν απλώς μια έκθεση της καταστάσεώς τους, χωρίς να έχουν την καλή ανησυχία για να αγωνισθούν. Αυτό είναι μια ρηχή κατάσταση. Απορώ! Δεν προβληματίζονται στην πνευματική ζωή; Δεν έχουν ερωτηματικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Από την στιγμή που μπαίνει στον άνθρωπο η καλή ανησυχία, παρατηρεί τί του λείπει, ρωτάει πώς θα το αποκτήση και ωφελείται. Πώς θα μάθη κανείς, άμα δεν ρωτάη; Ταξίδευα μια φορά με ένα ανδρόγυνο που είχαν μαζί τους και το παιδάκι τους. Το παιδάκι σε όλη την διαδρομή δεν άφησε ήσυχο τον πατέρα του με τις ερωτήσεις του. «Μπαμπά, εκείνο τί είναι; μπαμπά, εκείνο γιατί;». «Πάψε, τον ζάλισες τον πατέρα σου», του λέει η μάνα. «Άσ᾿ το το παιδί, λέει εκείνος· αν δεν ρωτήση, πώς θα μάθη;». Έτσι και στα πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να καταλάβετε πιο καλά πώς εργάζεται πνευματικά αυτός που έχει καλή ανησυχία, θα έπρεπε να σάς πω τί θέματα απασχολούν εδώ μια αδελφή. Την βλέπω και την χαίρομαι. Σε κάθε ερώτηση που μου κάνει, από καλή ανησυχία και όχι για να βρισκώμαστε σε συζήτηση, χρειάζεται να γράψω ολόκληρο τετράδιο, για να της απαντήσω. Έχει μεγάλη καλή ανησυχία, πιάνει πολλά, αγωνίζεται πολύ, γι᾿ αυτό και χαριτώνεται πολύ. Όταν ο άνθρωπος ψάχνη να βρη που δεν πηγαίνει καλά και προσπαθή να διορθωθή, ταπεινώνεται, έρχεται η Χάρις του Θεού και από εκεί και πέρα προχωράει κανονικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καλή ανησυχία δεν σταματά ποτέ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ανησυχώ, μήπως δεν αγωνίζομαι σωστά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχεις άγχος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, αλλά γιατί έχω αυτήν την ανησυχία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ευλογημένη, υπάρχει η ήσυχη ανησυχία και η ανήσυχη ησυχία. Η καλή ανησυχία πρέπει πάντοτε να υπάρχη μέσα μας· άγχος να μην υπάρχη. Όταν κανείς αγωνίζεται σωστά, ποτέ δεν μένει ευχαριστημένος από τον εαυτό του· έχει συνέχεια μέσα του μια ανησυχία που προέρχεται από την φιλότιμη προσπάθεια που κάνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, φθάνει κάποτε ο άνθρωπος που αγωνίζεται σε σημείο που να μην του χρειάζεται πια η καλή ανησυχία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, γιατί η καλή ανησυχία δεν σταματά ποτέ σ᾿ αυτήν την ζωή. «Τρέχετε, ίνα καταλάβητε»[267], λέει ο Απόστολος Παύλος. Τρέχει ο άνθρωπος, όσο ζή, να βρη τον Χριστό, χωρίς να σταματά ποτέ. Τρέχει και δεν νιώθει κούραση, αλλά χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Για να καταλάβετε, θα σάς φέρω ένα παράδειγμα: ένα καλό λαγωνικό, μόλις μυρισθή τον λαγό, δεν κάθεται άλλο κοντά στον κυνηγό· αρχίζει να ψάχνη, για να βρη τον λαγό. Τρέχει, σταματά λίγο, μυρίζει αριστερά–δεξιά, αρχίζει ξανά να τρέχη· δεν μπορεί να σταθή. Ο νούς του είναι πώς να βρη τον λαγό· δεν χαζεύει. Μεγαλύτερη χαρά έχει, όταν τρέχη, παρά όταν κάθεται. Το τρέξιμο και το ψάξιμο του δίνει ζωή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έτσι κι εμείς αυτήν την εγρήγορση πρέπει να έχουμε. Ο νούς μας να είναι συνέχεια στον Χριστό, αφού αυτός είναι ο στόχος μας. Εμείς όμως, ενώ βρήκαμε τα αχνάρια, βρήκαμε τον δρόμο, ξέρουμε από που θα πάμε, για να συναντήσουμε τον Χριστό, πολλές φορές στεκόμαστε· δεν προχωρούμε. Αν δεν γνωρίζαμε τον δρόμο, δικαιολογημένα να σταματούσαμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι, ο πατέρας μου στην Κόνιτσα είχε δυο λαγωνικά καλά εκπαιδευμένα. Ο Γερο-Πρόδρομος ο Κορτσινόγλου, ο ψάλτης του Αγίου Αρσενίου, μια φορά του ζήτησε ένα κουταβάκι καλό από την ίδια ράτσα, για να φυλάη τα ζώα του, να γαυγίζη δηλαδή, όταν θα πλησίαζε λύκος. Ο πατέρας μου του έδωσε ένα. Μια μέρα, ένας γείτονας του Κορτσινόγλου που αγαπούσε πολύ το κυνήγι, ήταν πολύ στενοχωρημένος, γιατί αρρώστησε το σκυλί του και δεν μπορούσε να πάη να κυνηγήση. Όταν το άκουσε ο Γερο-Πρόδρομος, του λέει: «Μη στενοχωριέσαι· θα σού δώσω το δικό μου σκυλί, είναι ράτσα Εζνεπίδη[268]». Χαρούμενος ο γείτονας πήρε το σκυλί και ξεκίνησε για το κυνήγι. Όταν έφθασε στο δάσος, κούνησε το χέρι του, όπως συνηθίζουν να κάνουν οι κυνηγοί, για να τρέξη το λαγωνικό, αλλά εκείνο, αντί να τρέξη, γύριζε γύρω του, του έγλειφε τα πόδια και κοιτούσε τα χέρια του μήπως έχει ψωμί! Βλέπετε, ήταν καλό σκυλί, από ράτσα, αλλά δεν είχε εκπαιδευθή, για να μπορή να πιάνη τον λαγό, και γύριζε συνέχεια γύρω από τον κυνηγό. Πιστεύω όμως ότι εσείς, αφού βρήκατε τα αχνάρια του Χριστού, θα τρέχετε συνέχεια να βρήτε τον Χριστό, για να γεμίση η καρδιά σας τόσο πολύ από τον Χριστό, που να μην μπορήτε να Τον χωρέσετε και να λέτε: «Φθάνει, Θεέ μου, δεν αντέχω άλλο».'
footnotes:
  '1': Ψαλμ. 50, 14.
  '2': Ο Γέροντας με απλό τρόπο εκφράζει την αλήθεια της πίστεώς μας ότι ο Θεός «κακόν ούτε πεποίηκεν ούτε δεδημιούργηκεν» (Αγ. Ιωάννου Σιναΐτου,Κλίμαξ, Λόγος ΚϚ´, μέρος Β´, μα´). ῾Επομένως, όπως λέει ο Άγ. Νικόδημος ο Αγιορείτης, ούτε πάθη «έκτισεν εν τη ανθρωπίνη φύσει, αλλά εκ της αμελείας της εδικής μας παρά φύσιν εμβήκαν εις αυτήν». (Νέα Κλίμαξ, εκδ. Σωτ. Σχοινά, Βόλος 1956, σ. 152). Τα πάθη κατά τους Αγίους Πατέρες προέρχονται από την «παρά φύσιν» χρήση των λειτουργιών του σώματος ή των δυνάμεων της ψυχής. Όταν η «παρά φύσιν» αυτή χρήση χρονίση, γίνεται κακή έξη και χρειάζεται πολύς αγώνας για να ξερριζωθή.
  '3': Βλ. Λουκιανού,Νεκρικοί διάλογοι, Διάλογος Β´.
  '4': Βλ.Το Γεροντικόν, Αββάς Μακάριος ο Αιγύπτιος κβ´, εκδ. «Αστήρ», Αθήναι 1981, σ. 68.
  '5': Βλ.Γ´ Βασ. 18, 26.
  '6': Βλ. Αββά Ισαάκ του Σύρου,Οι Ασκητικοί Λόγοι, Λόγος ΠΑ´, εκδ. «Αστήρ», Αθήναι 1961, σ. 273.
  '7': Βλ.Έξ. 3, 2–3.
  '8': Από το Απολυτίκιο των Οσίων:«Ταις των δακρύων σου ροαίς».
  '9': Ψαλμ. 43, 23.
  '10': Βλ. Παλλαδίου, Επισκόπου Ελενοπόλεως,Λαυσαϊκή Ιστορία, Φιλοκαλία των Νηπτικών και Ασκητικών, τόμος 6, εκδ. «Το Βυζάντιον», Θεσσαλονίκη 1996, σ. 124.
  '11': Η συνοδία του Γέροντα Χατζη-Γεώργη είχε το τυπικό της συνεχούς νηστείας. (Βλ. Γέροντος Παϊσίου Αγιορείτου,Ο Γέρων Χατζη-Γεώργης, Ι. Ησυχ. Ευαγγ. Ιωάννης ο Θεολόγος, Σουρωτή Θεσσαλονίκης,[8]2005).
  '12': Λουκ. 10, 31–32.
  '13': Το 1987 ο Γέροντας υποβλήθηκε σε εγχείρηση κήλης.
  '14': Ματθ. 16, 25.
  '15': Α’ Κορ. 10, 24.
  '16': 'Τριβόλι: Αγριόχορτο με πολλά αγκάθια.'
  '17': Ψαλμ. 50, 19.
  '18': Βλ. Το Γεροντικόν, Αββάς Λογγίνος ε´, σ. 63.
  '19': Αρχαίο γνωμικό. Πρβλ. καιΕυχολόγιον το Μέγα, Ακολουθία του Μεγάλου και Αγγελικού Σχήματος, εκδ. «Αστήρ», Αθήναι 1992, σ. 207.
  '20': Βαρσανουφίου και Ιωάννου,Κείμενα διακριτικά και ησυχαστικά, ερώτ. ρθ´, εκδ. «Ετοιμασία», Ιερά Μονή Τιμίου Προδρόμου, Καρέας 1996, τόμος Α´, σ. 244.
  '21': Το 1968.
  '22': Ο Γέροντας μόνασε στην Ιερά Μονή Στομίου Κονίτσης από το 1958 μέχρι το 1962.
  '23': 'Μελό: Μυαλό.'
