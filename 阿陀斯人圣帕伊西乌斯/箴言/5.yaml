  '248': Οι λόγοι αυτοί του Γέροντα εκφράζουν τον τελικό σκοπό του πνευματικού αγώνος κάθε πιστού, που είναι η απόκτηση του Αγίου Πνεύματος. Όταν ο άνθρωπος γίνη κοινωνός της θεοποιού Χάριτος του Αγίου Πνεύματος, τότε φθάνει πλέον στην κατάσταση της θεώσεως, στην «ατέλεστον τελειότητα».
