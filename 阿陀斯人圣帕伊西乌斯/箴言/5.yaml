  '46': Ό.π.
  '47': Το παράδειγμα αυτό αναφέρεται σε μία ενέργεια, η οποία σύμφωνα με τους κανόνες της Εκκλησίας και την εκκλησιαστική τάξη δεν μπορεί να θεωρηθή σωστή. Ο Γέροντας το ανέφερε, για να τονίση ότι η «κατ᾿ όψιν» κρίση, όσο σωστή και αν φαίνεται, μπορεί να αδικήση τον άλλον.
  '48': Βλ. Ιωάννου του Σιναΐτου,Κλίμαξ,μεταγλωττισθείσα υπό Ιερεμίου Σιναΐτου, εκδοθείσα το πρώτον εν έτει 1774 εν Βενετία, Λόγος Ι´, η´, εκδ. «Αστήρ», Αθήναι 1969, σ. 145.
  '49': Γκαμήλα ονομάζεται η βουνοκορφή της Πίνδου Πάπιγγο-Τύμφη, επειδή το σχήμα της μοιάζει με καμήλα.
  '50': Ο Γέροντας αποκαλύπτοντας εξομολογητικά το γεγονός αυτό, αποκαλύπτει συγχρόνως το μαρτυρικό του φρόνημα, το οποίο πήγαζε από την αγάπη του για τον Χριστό. Η αγάπη αυτή κατέφλεγε την καρδιά του και τον παρακινούσε προς κάθε υπερβολή ασκήσεως και οδύνης. Το κίνητρο δηλαδή για την αντιμετώπιση αυτήν του πειρασμού δεν ήταν το μίσος προς το σώμα, αλλά η αγάπη του για τον Χριστό. (Παρόμοια παραδείγματα μαρτυρούνται και στους βίους των Αγίων. Βλ. Βίος Οσίου Μαρτινιανού, 13 Φεβρουαρίου).  Ο Γέροντας ανέφερε το γεγονός αυτό, για να τονίση ότι με την κατάκριση απομακρύνεται από τον άνθρωπο η Χάρις του Θεού· σε καμμιά περίπτωση δεν θα υπεδείκνυε παρόμοια αντιμετώπιση ενός σαρκικού πειρασμού.
  '51': Ματθ. 7, 1.
  '52': Βλ.Το Μέγα Γεροντικόν, τόμος Α´, κεφ. Γ´, παρ. 51, έκδ. Ι. Ησυχαστηρίου «Το Γενέσιον της Θεοτόκου», Πανόραμα Θεσσαλονίκης, 1994, σ. 344.
  '53': Βλ. Του Οσίου πατρός ημών Ισαάκ,Τα ευρεθέντα ασκητικά, Επιστολή Δ´, εκδ. Βασ. Ρηγοπούλου, Θεσσαλονίκη 1977, σ. 383.
  '54': Βλ.Ματθ. 7, 3.
  '55': Βλ.Μάρκ. 8, 24.
  '56': Το κατά κόσμον όνομα του Γέροντα.
  '57': Ο Γέροντας είχε επτά αδέλφια. Αυτήν την εποχή οι τρεις μεγαλύτερες αδελφές του είχαν ήδη δημιουργήσει οικογένεια.
  '58': Ο Γέροντας έγραψε τα ακόλουθα υπό τύπον τηλεγραφήματος προς δόκιμη αδελφή.
  '59': Βλ.Έξ. 20, 17·Δευτ. 5, 21.
  '60': Ιακ. 1, 14.
  '61': Βλ.Ματθ. 17, 16·Μάρκ. 9, 18·Λουκ. 9, 40.
  '62': Βλ.Ματθ. 17, 1·Μάρκ. 9, 2·Λουκ. 9, 28.
  '63': Ματθ. 17, 17. Βλ. καιΜάρκ. 9, 19·Λουκ. 9, 41.
  '64': Βλ.Γέν. 4, 3–8.
  '65': 'Μπομπότα: Ψωμί από καλαμποκήσιο αλεύρι.'
  '66': 'Φράγκο: Έτσι ονομαζόταν παλιότερα η δραχμή.'
  '67': 'Εκατοστάρικο: Χάρτινο νόμισμα ισοδύναμο με εκατό δραχμές.'
  '68': Από γράμμα του Γέροντα προς αδελφή το 1968.
  '69': Βλ.Α´ Κορ. 12, 31.
