  '234': Βλ.Πράξ. 24, 27. Ο Απόστολος Παύλος έμεινε δέσμιος στην Καισάρεια δύο χρόνια, επειδή ο Ρωμαίος ηγεμόνας Φήλιξ ανέβαλλε την δίκη του με την ελπίδα ότι θα δωροδοκηθή. Στην συνέχεια ο Φήστος, ο διάδοχος του Φήλικα, τον έστειλε να δικασθή στην Ρώμη, γιατί ο Απόστολος στηριζόμενος στην πληροφορία που είχε λάβει από τον Θεό επικαλέσθηκε το δικαίωμα του ρωμαίου πολίτη και ζήτησε να δικασθή στην Ρώμη.
  '235': Ο Άγιος Ιωάννης ο Θεολόγος, όταν επρόκειτο να πάη να κηρύξη το Ευαγγέλιο στην Μικρά Ασία, λιποψύχησε και γόγγυσε, επειδή η περιοχή ήταν βυθισμένη στην ειδωλολατρική πλάνη. Για τον γογγυσμό του αυτόν ο Θεός επέτρεψε να πέση σε πειρασμό. Ενώ λοιπόν έπλεε προς την Μικρά Ασία, έπεσε σε ναυάγιο και σώθηκε, αφού πάλεψε σαράντα ημέρες με τα κύματα.
  '236': Α´ Κορ. 13, 7.
  '237': 'Ο σκύμνος: Το λεονταράκι.'
