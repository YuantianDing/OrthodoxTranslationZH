  '72': Βλ.Έξ. 32, 1–24.
  '73': Ονομασία του όρους Σινά, η οποία συναντάται στην Παλαιά Διαθήκη.
  '74': Βλ.Έξ. 11, 1–3 και 12, 36–37. Οι Ισραηλίτες, λίγο πριν από την έξοδό τους από την Αίγυπτο, είχαν δανεισθή κατ᾿ εντολήν του Θεού από τους Αιγυπτίους σκεύη ασημένια και χρυσά και ιματισμό. Αυτά δεν τα επέστρεψαν, γιατί στην συνέχεια θανατώθηκαν τα πρωτότοκα των Αιγυπτίων και ο Φαραώ φοβήθηκε και τους έδιωξε αμέσως από την Αίγυπτο.
  '75': Ψαλμ. 4, 5.
  '76': Ψαλμ. 118, 60.
  '77': 'Λαίμαργα: Τα κλαδιά που απομυζώντας τον χυμό του δένδρου αναπτύσσονται υπερβολικά, αλλά δεν δίνουν καρπό.'
  '78': Ψαλμ. 118, 60.
  '79': 'Πυριόβολος: Τσακμακόπετρα.'
  '80': Κάτοικοι των Φαράσων της Καππαδοκίας, πατρίδος του Γέροντος Παϊσίου.
  '81': Το θηλυκό κατσίκι, επειδή είναι παραγωγικό, έχει μεγαλύτερη αξία από το αρσενικό.
  '82': Ματθ. 5, 9.
  '83': Η αδελφή που έκανε την ερώτηση είχε υπ᾿ όψιν της περιπτώσεις ανθρώπων που χρησιμοποιούσαν το όνομα του Γέροντα, για να εξυπηρετήσουν συμφέροντά τους ή για να πείσουν τον κόσμο να δεχθή πλανεμένες ιδέες τους.
  '84': Ο Γέροντας σ᾿ αυτές τις περιπτώσεις συνήθως χρησιμοποιεί το μόριο «σάν» αντί του «ως», που είναι το ορθό.
  '85': 'Βαρδάρης: Ο πολύ δυνατός και ψυχρός άνεμος, ο οποίος πνέει βορειοδυτικά της Θεσσαλονίκης κατά μήκος του ποταμού Αξιού.'
