  '261': Συλλογή Κανόνων της Ορθόδοξης Εκκλησίας, η οποία περιέχει τους Ιερούς Κανόνες των Οικουμενικών Συνόδων, τους Αποστολικούς Κανόνες, καθώς και τους Κανόνες των Αγίων Πατέρων της Εκκλησίας, με σύντομη ερμηνεία. Την συνέταξαν κατά το 1793 ο Άγιος Νικόδημος ο Αγιορείτης και ο μοναχός Αγάπιος.
