  '7': Ο Γέροντας μετά από μια έντονη πνευματική κατάσταση που έζησε – ένιωθε να λειώνη από την αγάπη προς τον Θεό και τον άνθρωπο σαν την λαμπάδα που βρίσκεται σε θερμό χώρο – έλαβε την πληροφορία ότι δεν πρέπει να αρνηθή την βοήθειά του προς τους ανθρώπους. Από τότε διέθετε την ημέρα στους ανθρώπους που τον επισκέπτονταν και την νύχτα προσευχόταν για τα ποικίλα προβλήματα του κόσμου. Όταν όμως το πλήθος των προσκυνητών αυξήθηκε κατά πολύ, είχε τον λογισμό να απομακρυνθή σε άγνωστο τόπο, για να διαθέτη όλον τον χρόνο του στην προσευχή. Τότε για δεύτερη φορά είχε πληροφορία να παραμείνη στο Κελλί του, στην «Παναγούδα», και να αναπαύη τον κόσμο.
  '8': Αποχή από φαγητό και νερό μέχρι την ενάτη ώρα βυζαντινή (3 μ.μ.) ή για τρεις ημέρες.
  '9': Ο Γέροντας ασκήτεψε στο Σινά, στο ασκητήριο της Αγίας Επιστήμης, τα χρόνια 1962–1964.
  '10': Ειπώθηκε το 1990.
  '11': Ειπώθηκαν το 1992.
  '12': Εικονομάχοι ονομάζονταν οι Χριστιανοί οι οποίοι αρνούνταν την απόδοση τιμής στις εικόνες. Η εικονομαχία συνετάραξε επί ένα αιώνα και πλέον την Βυζαντινή Αυτοκρατορία (726–843) και έληξε αρχικά με την Ζ´ Οικουμενική Σύνοδο το 787, η οποία την καταδίκασε ως αίρεση. Την αναζωπύρωση της εικονομαχίας από τον Λέοντα Ε´ τον Αρμένιο κατέπαυσε ο Πατριάρχης Μεθόδιος το 843.
  '13': Ο Γέροντας εννοεί την οικονομική χορηγία (ή τα μετοχιακά μισθώματα), δηλαδή ένα ποσό χρημάτων το οποίο το Ελληνικό κράτος ανέλαβε την υποχρέωση από το 1924 να δίνη κάθε χρόνο στις Ιερές Μονές του Αγίου Όρους, επειδή οι Μονές έδωσαν στους πρόσφυγες τα μετόχια τους, από τα οποία είχαν το λάδι, το σιτάρι, το κρασί κ.λπ. της χρονιάς.
  '14': Ειπώθηκε τον Μάιο του 1987.
  '15': Η βλάσφημη ταινία «Ο τελευταίος πειρασμός», η οποία σκηνοθετήθηκε από τον Μαρτίν Σκορτσέζε, παίχθηκε για λίγο σε κινηματογράφους των Αθηνών το 1988 και προκάλεσε θύελλα διαμαρτυριών από μέρους των πιστών και της Ελλαδικής Εκκλησίας, ώστε να σταματήση η προβολή της. Ο Γέροντας, παρ᾿ όλη την δυσκολία που είχε από τον πόνο λόγω της κήλης, βγήκε από το Άγιον Όρος με άλλους Αγιορείτες και παραβρέθηκε στο συλλαλητήριο που έγινε στην Θεσσαλονίκη, ενισχύοντας με την παρουσία του τον πιστό λαό.
