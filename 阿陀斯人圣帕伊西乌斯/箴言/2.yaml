  '66': Μεγάλο θυμιατό με το οποίο θυμιάζει ο εκκλησιαστικός – δηλαδή ο μοναχός που διακονεί στον Ναό – σε ορισμένα σημεία των Ακολουθιών έχοντας ριγμένο στον δεξιό του ώμο κεντημένο κάλυμμα. Πάνω από την χειρολαβή υπάρχει το κοίλωμα, όπου μπαίνει η καρβουνόσκονη και το θυμίαμα, και στο άκρο του θυμιατού κρέμονται οι κωδωνίσκοι που ηχούν ρυθμικά κατά την θυμίαση.
