  '137': Μητροπολίτης Καισαρείας, γεννήθηκε στα Φάρασα της Καππαδοκίας το 1777. Σπούδασε στην Ιερατική Σχολή των Φλαβιανών του Τιμίου Προφήτου Προδρόμου και αργότερα στην Κωνσταντινούπολη, όπου χειροτονήθηκε διάκονος και ιερέας. Το 1832 χειροτονήθηκε Μητροπολίτης Καισαρείας και αγωνίσθηκε θαρραλέα για την διάσωση του Ελληνισμού της επαρχίας του.
