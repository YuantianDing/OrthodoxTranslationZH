  '181': Στις 3–6-1979, επειδή ο Γέροντας δεν θυμόταν ποιός Άγιος γιόρταζε εκείνη την ημέρα και δεν έβρισκε τα γυαλιά του, για να δη στο ημερολόγιο – μόλις τότε είχε εγκατασταθή στο Καλύβι «Παναγούδα» και ακόμη δεν είχε τακτοποιηθή –, έκανε κομποσχοίνι λέγοντας «Άγιοι της ημέρας, πρεσβεύσατε υπέρ ημών». Τότε τον επισκέφθηκε ο Άγιος Λουκιλλιανός που γιορτάζει εκείνη την ημέρα και του επανέλαβε τρεις φορές το δύσκολο όνομά του.
  '182': Βλ.Γέν. 6, 13 κ.ε.
  '183': Αρμαθιά από ξερά σύκα περασμένα σε νήμα ή βούρλο.
