  text:
    ru: Введение
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Λόγοι Α'•Λόγοι Β'•Λόγοι Γ'•Λόγοι Δ'•Λόγοι Έ•Λόγοι ΣΤ'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Περιεχόμενα
- type: h1
  initial:
    ru: ''
  text:
    ru: Слова. Том 2. Духовное пробуждение.Λόγοι Β' – Πνευματική αφύπνιση
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρόλογος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο μακαριστός Γέροντας Παΐσιος άρχισε από το 1980 να μας μιλάη για τα δύσκολα χρόνια που θα έρθουν. Συχνά επαναλάμβανε ότι ίσως ζήσουμε και εμείς πολλά από αυτά που γράφει η Αποκάλυψη. Σκοπό είχε να βάλη μέσα μας την καλή ανησυχία, ώστε να εντείνουμε τον πνευματικό μας αγώνα, να αντισταθούμε στο πνεύμα της αδιαφορίας – που ύπουλα έβλεπε να μπαίνη και στους κόλπους του Μοναχισμού – να απαλλαγούμε από την φιλαυτία και να καταπολεμήσουμε τις αδυναμίες μας, για να έχη δύναμη η προσευχή μας. «Με τις αδυναμίες, έλεγε, αποδυναμώνεται η προσευχή, και μετά δεν μπορούμε να βοηθήσουμε ούτε τον εαυτό μας ούτε τον κόσμο. Αχρηστεύονται ασύρματοι. Και αν δεν δουλεύουν οι ασύρματοι, τον άλλον τον πιάνει ο εχθρός».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στον γενικώτερο πρόλογο του Α´ τόμου, με τίτλο «Με πόνο και αγάπη για τον σύγχρονο άνθρωπο», έγινε διεξοδικά λόγος για την προέλευση και τον τρόπο συλλογής και σύνθεσης του υλικού που έχει ήδη αρχίσει να συγκροτή την σειρά «Γέροντος Παϊσίου Αγιορείτου, Λόγοι». Στον ανά χείρας Β´ τόμο, με τίτλο «Πνευματική αφύπνιση», συμπεριλήφθηκαν θέματα τα οποία αφορούν στην σημερινή πραγματικότητα, μας καλούν σε συνεχή εγρήγορση και ετοιμότητα και μας προετοιμάζουν για δύσκολες καταστάσεις, που πιθανόν να αντιμετωπίσουμε, γιατί έχουμε κιόλας δει να πραγματοποιήται αυτό που συχνά έλεγε ο Γέροντας: «Μπόρες–μπόρες θα περνούμε· τώρα για μερικά χρόνια έτσι θα πάμε· παντού ένας γενικός αναβρασμός».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο δεύτερος αυτός τόμος απαρτίζεται από πέντε μέρη. Το πρώτο μέρος αναφέρεται στην γενική αδιαφορία και ανευθυνότητα που παρατηρούνται στην εποχή μας και στο χρέος του συνειδητού Χριστιανού να βοηθήση την κατάσταση με την διόρθωση του εαυτού του, την συνετή συμπεριφορά, την ομολογία πίστεως και την προσευχή. «Δεν λέω να πάρουμε πλακάτ, αναφέρει ο Γέροντας σε κάποιο σημείο, αλλά να υψώνουμε τα χέρια μας προς τον Θεό». Στο δεύτερο μέρος ο Γέροντας, χωρίς να σε περιορίζη σε συγκεκριμένο αγώνα, ανάβει τον ζήλο για πνευματική εργασία. Απομένει από ᾿κεί και πέρα ο καθένας να αγωνισθή ανάλογα με τις δυνάμεις του και το φιλότιμό του, για να ζήση την εν Χριστώ ζωή, που είναι Παράδεισος από την γή. Το τρίτο μέρος αναφέρεται στην μικρή κατοχή του Αντιχρίστου, που θα δώση την ευκαιρία να ομολογήσουν οι Χριστιανοί και πάλι Χριστό, όπως στο Άγιο Βάπτισμα – συνειδητά όμως αυτήν την φορά –, να αγωνισθούν και να χαρούν εκ προοιμίου την νίκη του Χριστού κατά του σατανά. Την ευκαιρία αυτή θα την ζήλευαν, όπως έλεγε ο Γέροντας, οι Άγιοι. «Πολλοί Άγιοι θα παρακαλούσαν να ζούσαν στην εποχή μας, για να αγωνισθούν. Βρεθήκαμε εμείς... Δεν ήμασταν άξιοι! Τουλάχιστον να το αναγνωρίζουμε». Για να αντιμετωπισθή σωστά η περίοδος αυτή, απαιτείται να καλλιεργηθή ιδιαίτερα η παλληκαριά και το πνεύμα της θυσίας. Στο τέταρτο μέρος, που αναφέρεται στην θεία πρόνοια, στην πίστη και εμπιστοσύνη στον Θεό, και στην θεία βοήθεια, οδηγείται κανείς στην πηγή, από την οποία αντλεί την δύναμη να αντιμετωπίση οποιαδήποτε δυσκολία. Τέλος, στο πέμπτο μέρος τονίζεται η αναγκαιότητα και η δύναμη της καρδιακής προσευχής, που είναι όπλο ισχυρό για την καταπολέμηση του κακού, το οποίο εξαπλώνεται όλο και περισσότερο. Οι μοναχοί καλούνται να βρίσκωνται σε «κατάσταση συναγερμού», όπως οι στρατιώτες εν καιρώ πολέμου, για να βοηθούν συνέχεια με την προσευχή τον κόσμο, και να προσέξουν να μην αλλοιωθή το γνήσιο πνεύμα του Μοναχισμού, για να μείνη μαγιά για τις επόμενες γενιές. Το τελευταίο αυτό μέρος κλείνει με το κεφάλαιο που ορίζει ποιό είναι το βαθύτερο νόημα της ζωής και επισημαίνει την ανάγκη της μετανοίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι λόγοι και οι ενέργειες του Γέροντα ζυγίζονται και εδώ, όπως πάντοτε, με το ζύγι της διακρίσεως. Σ́ αυτά τα κείμενα βλέπει κανείς τον Γέροντα άλλοτε να μη διακόπτη την προσευχή, όσο κι αν ανυπόμονοι προσκυνητές χτυπούν επίμονα το καμπανάκι στο Καλύβι του, φωνάζοντας «σταμάτα, Γέροντα, την προσευχή, ο Θεός δεν παρεξηγείται», και άλλοτε να αφήνη την έρημο και να βγαίνη στον κόσμο, γιατί η απουσία του από κάποια εκδήλωση μπορεί να παρεξηγηθή και να βλάψη την Εκκλησία. Άλλοτε να καταλαμβάνεται από θεία αγανάκτηση και να αντιδρά στις βλασφημίες κάποιου, και άλλοτε να σιωπά και μόνο να εύχεται για τον βλάσφημο. Γι' αυτό καλό είναι ο αναγνώστης να μη βιάζεται να βγάζη συμπεράσματα, πριν μελετήση όλα τα κεφάλαια. Προπαντός όμως να μη χρησιμοποιήση αποσπασματικά λόγους του Γέροντα, γιατί μπορεί να οδηγήση τους άλλους σε λανθασμένα συμπεράσματα. Να έχη υπ' όψιν του ότι ο Γέροντας μιλάει εξ αφορμής κάποιου συγκεκριμένου γεγονότος ή ερωτήματος και απευθύνεται σε συγκεκριμένο πρόσωπο, αποβλέποντας πάντοτε στην σωτηρία της ψυχής του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όσοι γνώρισαν τον Γέροντα θυμούνται την απαλάδα που έφερναν τα λόγια του στις καρδιές, όσο αυστηρά και αν ήταν κάποιες φορές. Και αυτό, γιατί ο Γέροντας πάντοτε είχε στόχο να θεραπεύση το κακό και όχι να το στηλιτεύση. Να λυτρώση την ψυχή του συνομιλητή του από κάποιο πάθος, και όχι να διαπομπεύση το πάθος. Τα ίδια λόγια, αν χρησιμοποιηθούν έξω από την συνάφεια αυτή του πόνου και της αγάπης, ίσως ηχήσουν διαφορετικά, και πιθανόν όχι θεραπευτικά. Μπορεί, αντί να φέρουν στις καρδιές την θεία παρηγοριά και την ασφάλεια, να εμβάλουν την αμφιβολία και τον φόβο ή να οδηγήσουν στα άκρα, ενώ ο Γέροντας δεν ήταν άνθρωπος των άκρων ούτε μονομερής· τον ενδιέφερε να γίνεται το καλό αλλά με καλό τρόπο, ώστε να ωφελή. Βέβαια, δεν δίσταζε ποτέ να πη την αλήθεια· την αλήθεια όμως την έλεγε με διάκριση. Καταλαμβανόταν από θεία αγανάκτηση μπροστά στην βεβήλωση κάθε ιερού, προανήγγελλε τα φοβερά γεγονότα που πρόκειται να συμβούν, αλλά η συμπεριφορά του δεν σού προκαλούσε φόβο και αγωνία. Αντίθετα, σού μετέδιδε την αναστάσιμη ελπίδα και χαρά, την χαρά όμως που βγαίνει από την θυσία, η οποία σε κάνει να συγγενεύης με τον Χριστό. Και εφόσον συγγενεύεις με τον Χριστό – μετέχεις στην μυστηριακή ζωή και τηρείς τις εντολές Του – δεν έχεις τίποτε να φοβηθής, «ούτε διαβόλους ούτε μαρτύρια». Λέει κάπου ο Γέροντας με τον δικό του χαριτωμένο τρόπο: «Όταν πετάς τον εαυτό σου, πετιέται μέσα σου ο Χριστός», που είναι το ζητούμενο σε όλη την πνευματική ζωή. Γι'' αυτό επισημαίνει έναν κίνδυνο που διατρέχει ο Χριστιανός: αν δεν καλλιεργήση το πνεύμα της θυσίας, δεν μπορεί να γίνη κοινωνός της ζωής του Χριστού, οπότε θα μείνη άνθρωπος του τύπου, χωρίς εσωτερική ζωή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι συχνές αναφορές στην προσωπική ζωή του Γέροντα ίσως προβληματίσουν μερικούς αναγνώστες, ιδίως γιατί ο Γέροντας φαίνεται να διηγήται εύκολα και αβίαστα μερικά από τα θεία γεγονότα που είχε ζήσει. Κατά την μεταφορά όμως του προφορικού λόγου σε γραπτό δεν ήταν δυνατόν να εκφρασθή η δυσκολία με την οποία μιλούσε ο Γέροντας για τον εαυτό του ούτε η «πίεση» που ασκήθηκε, ώστε να αναφέρη κάτι από τα βιώματά του. Μερικές φορές μάλιστα κάποιο γεγονός το έλεγε αποσπασματικά, σε διάφορες αδελφές και με άλλες λεπτομέρειες καί, όταν δινόταν ευκαιρία, προσπαθούσαμε με πολλή συστολή να αποσπάσουμε κάποια πληροφορία που θα συμπλήρωνε τα κενά μιας διηγήσεως. Έτσι ο Γέροντας, στην διάρκεια των είκοσι οκτώ χρόνων που παρακολουθούσε πνευματικά το Ησυχαστήριο, μας αποκάλυπτε, για να μας βοηθήση, λίγα από τα θεία γεγονότα της ζωής του, που ήταν για μας «πνευματική αιμοδοσία». Γι'' αυτό λυπόταν πολύ, όταν δεν υπήρχε η πνευματική πρόοδος που περίμενε, τόσο που μερικές φορές έλεγε με πόνο: «Πετάω λίπασμα σε αμμούδα».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ευχαριστούμε όσους διάβασαν τα κείμενα αυτά πριν από την έκδοσή τους και διετύπωσαν με σεβασμό στα λόγια του Γέροντα κάποιες σκέψεις σχετικά με αυτά, αλλά και μας ενεθάρρυναν να συνεχίσουμε αυτήν την προσπάθεια, γιατί ένιωσαν – όπως μας είπαν – ότι η διδασκαλία του απευθύνεται σε όλο το πλήρωμα της Εκκλησίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είθε οι λόγοι του τόμου «Πνευματική αφύπνιση», δι᾿ ευχών του μακαριστού Γέροντα Παϊσίου που – όπως διαπιστώνουν και ομολογούν πολλοί – μας παρακολουθεί μέρα-νύχτα και μας βοηθάει με θεϊκή αγάπη, να βάλουν μέσα μας την καλή ανησυχία, για να αγωνιζώμαστε φιλότιμα, ώστε να υποχωρή το κακό και να επικρατή η ειρήνη του Θεού επί της γής. Αμήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κοίμηση της Θεοτόκου 1999
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Καθηγουμένη του Ιερού Ησυχαστηρίου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φιλοθέη Μοναχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί αι σύν εμοί εν Χριστώ αδελφαί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί φεύγετε από το Καλύβι και πηγαίνετε στο δάσος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στο Καλύβι που να βρής ησυχία! Ο ένας χτυπάει από εδώ, ο άλλος από εκεί. Βρήκα έναν καλό τόπο σε μια μεριά. Αν είμαι καλά, θα «χτίσω» ένα πολυβολείο προσευχής, ένα ραντάρ. Είναι πολύ καλό μέρος. Για το καλοκαίρι είναι ό,τι πρέπει· έχει δένδρα... Θα μπορώ να στέκωμαι και όρθιος. Αν μπορώ να κάνω τα καθήκοντά μου, αυτή είναι η χαρά μου, η τροφή μου! Ελάτε καμμιά φορά!...
- type: h2
  initial:
    ru: ''
  text:
    ru: Εισαγωγή από λόγους του Γέροντα
- type: h2
  initial:
    ru: ''
  text:
    ru: «Για να περάσης στην βουλή του Θεού, πρέπει να γίνης «βουλευτής» του Θεού, όχι «βολευτής» του εαυτού σου».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, πώς τα βλέπετε τα πράγματα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσείς πώς τα βλέπετε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εμείς τί να πούμε, Γέροντα; Εσείς να μας λέγατε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η ησυχία που επικρατεί με ανησυχεί. Κάτι ετοιμάζεται. Δεν έχουμε καταλάβει καλά σε τί χρόνια ζούμε ούτε σκεφτόμαστε ότι θα πεθάνουμε. Δεν ξέρω τί θα γίνη· πολύ δύσκολη κατάσταση! Η τύχη του κόσμου κρέμεται από τα χέρια μερικών, αλλά ακόμη ο Θεός κρατά φρένο. Χρειάζεται να κάνουμε πολλή προσευχή με πόνο, για να βάλη ο Θεός το χέρι Του. Να το πάρουμε στα ζεστά και να ζήσουμε πνευματικά. Είναι πολύ δύσκολα τα χρόνια. Έχει πέσει πολλή στάχτη, σαβούρα, αδιαφορία. Θέλει πολύ φύσημα, για να φύγη. Οι παλιοί έλεγαν ότι θα έρθη ώρα που θα κλωτσήσουν οι άνθρωποι. Πετάνε τους φράκτες, δεν υπολογίζουν τίποτε. Είναι φοβερό! Έγινε μια βαβυλωνία. Να κάνουμε προσευχή να βγουν οι άνθρωποι από αυτήν την βαβυλωνία. Διαβάστε την προσευχή των Τριών Παίδων[1], να δήτε με πόση ταπείνωση προσεύχονταν· και τον 82ο Ψαλμό: «Ο Θεός, τις ομοιωθήσεταί σοι, μη σιγήσης...». Αυτό πρέπει να γίνη, αλλιώς δεν γίνεται χωριό. Θέλει θεϊκή επέμβαση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μπαίνουν μερικές αρρώστιες ευρωπαϊκές και προχωρούν όλο προς το χειρότερο. Μου είπε ένας Κύπριος οικογενειάρχης που μένει στην Αγγλία: «Κινδυνεύουμε πνευματικά. Πρέπει να φύγω από την Αγγλία οικογενειακώς». Βλέπεις εκεί ο πατέρας να παίρνη την κόρη, η μάνα τον γιό. Όλους τους στεφανώνουν, όλους τους ευλογούν. Κάτι πράγματα..., ντρέπομαι να τα πώ. Και εμείς κοιμόμαστε με τα τσαρούχια. Δεν λέω να πάρουμε πλακάτ, αλλά να στρέψουμε την προσοχή μας στον μεγάλο κίνδυνο που περιμένουμε και να υψώνουμε τα χέρια στον Θεό. Να κοιτάξουμε πώς να αμυνθούμε κατά του κακού. Χρειάζεται να κρατάμε λίγο φρένο, γιατί όλα πάνε να τα ισοπεδώσουν. Τώρα είναι να λέη κανείς το ψαλμικό: «Θού τους άρχοντας αυτών ως τον Ωρήβ και Ζήβ και Ζεβεέ και Σαλμανά..., οίτινες είπαν· κληρονομήσωμεν εαυτοίς το αγιαστήριον του Θεού»[2].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σύγχυση μεγάλη υπάρχει. Μύλος γίνεται· είναι ζαλισμένοι οι άνθρωποι. Ο κόσμος είναι όπως οι μέλισσες. Αν χτυπήσης την κυψέλη, οι μέλισσες βγαίνουν έξω και αρχίζουν «βούου...» και γυρίζουν γύρω από την κυψέλη αναστατωμένες. Ύστερα η κατεύθυνσή τους θα εξαρτηθή από τον άνεμο που θα φυσήξη. Αν φυσήξη βοριάς, θα πάνε μέσα. Αν φυσήξη νοτιάς, θα φύγουν. Έτσι και τον κόσμο τον φυσάει... «Εθνικός Βοριάς», «Εθνικός Νοτιάς», και είναι ο καημένος ζαλισμένος. Όμως, αν και γίνεται τέτοιο βράσιμο, νιώθω μέσα μου μια παρηγοριά, μια σιγουριά. Μπορεί να ξεράθηκε η ελιά, αλλά θα πετάξη νέα βλαστάρια. Υπάρχει μια μερίδα Χριστιανών, στους οποίους αναπαύεται ο Θεός. Υπάρχουν ακόμη οι άνθρωποι του Θεού, οι άνθρωποι της προσευχής, και ο Καλός Θεός μας ανέχεται, και πάλι θα οικονομήση τα πράγματα. Αυτοί οι άνθρωποι της προσευχής μας δίνουν ελπίδα. Μη φοβάσθε. Περάσαμε σαν έθνος τόσες μπόρες και δεν χαθήκαμε, και θα φοβηθούμε την θύελλα που πάει να ξεσπάση; Ούτε τώρα θα χαθούμε. Ο Θεός μας αγαπά. Ο άνθρωπος έχει μέσα του κρυμμένη δύναμη για ώρα ανάγκης. Θα είναι λίγα τα δύσκολα χρόνια. Μια μπόρα θα είναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δεν σάς τα λέω αυτά, για να φοβηθήτε, αλλά για να ξέρετε που βρισκόμαστε. Για μας είναι μια μεγάλη ευκαιρία, είναι πανηγύρι οι δυσκολίες, το μαρτύριο. Να είστε με τον Χριστό, να ζήτε σύμφωνα με τις εντολές Του και να προσεύχεσθε, για να έχετε θείες δυνάμεις και να μπορέσετε να αντιμετωπίσετε τις δυσκολίες. Να αφήσετε τα πάθη, για να έρθη η θεία Χάρις. Αυτό που θα βοηθήση πολύ είναι να μπή μέσα μας η καλή ανησυχία: που βρισκόμαστε, τί θα συναντήσουμε, για να λάβουμε τα μέτρα μας και να ετοιμασθούμε. Η ζωή μας να είναι πιο μετρημένη. Να ζούμε πιο πνευματικά. Να είμαστε πιο αγαπημένοι. Να βοηθούμε τους πονεμένους, τους φτωχούς με αγάπη, με πόνο, με καλωσύνη. Να προσευχώμαστε να βγουν καλοί άνθρωποι.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός θα δώση την λύση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Καλός Θεός όλα θα τα οικονομήση με τον καλύτερο τρόπο, αλλά χρειάζεται πολλή υπομονή και προσοχή, γιατί πολλές φορές, με το να βιάζωνται οι άνθρωποι να ξεμπλέξουν τα κουβάρια, τα μπλέκουν περισσότερο. Ο Θεός με υπομονή τα ξεμπλέκει. Δεν θα πάη πολύ αυτή η κατάσταση. Θα πάρη σκούπα ο Θεός! Κατά το 1860, επειδή υπήρχε στο Άγιον Όρος πολύς τουρκικός στρατός, για ένα διάστημα δεν είχε μείνει στην Μονή Ιβήρων κανένας μοναχός. Είχαν φύγει οι Πατέρες, άλλοι με τα άγια Λείψανα, άλλοι για να βοηθήσουν στην Επανάσταση. Ερχόταν στο μοναστήρι μόνον ένας μοναχός από μακριά που άναβε τα κανδήλια και σκούπιζε. Μέσα και έξω από το μοναστήρι ήταν τουρκικός στρατός, και αυτός ο καημένος σκούπιζε και έλεγε: «Παναγία μου, τί θα γίνη μ'' αυτήν την κατάσταση;». Μια φορά που προσευχόταν με πόνο στην Παναγία, βλέπει να τον πλησιάζη μια γυναίκα – ήταν η Παναγία –  που έλαμπε και το πρόσωπό της ακτινοβολούσε. Του παίρνει την σκούπα από το χέρι και του λέει: «Εσύ δεν ξέρεις να σκουπίζης καλά· εγώ θα σκουπίσω». Και άρχισε να σκουπίζη. Ύστερα εξαφανίσθηκε μέσα στο Ιερό. Σε τρεις μέρες έφυγαν όλοι οι Τούρκοι! Τους έδιωξε η Παναγία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός ό,τι δεν είναι σωστό θα το πετάξη πέρα, όπως το μάτι πετάει το σκουπιδάκι. Δουλεύει ο διάβολος, αλλά δουλεύει και ο Θεός και αξιοποιεί το κακό, ώστε να προκύψη από αυτό καλό. Σπάζουν λ.χ. τα πλακάκια και ο Θεός τα παίρνει και φτιάχνει ωραίο μωσαϊκό. Γι' αυτό μη στενοχωρήσθε καθόλου, διότι πάνω από όλα και από όλους είναι ο Θεός, που κυβερνά τα πάντα και θα καθίση τον καθέναν στο σκαμνί, για να απολογηθή για το τί έπραξε, οπότε και θα τον ανταμείψη ανάλογα. Θα αμειφθούν αυτοί που θα βοηθήσουν μια κατάσταση και θα τιμωρηθή αυτός που κάνει το κακό. Τελικά ο Θεός θα βάλη τα πράγματα στην θέση τους, αλλά ο καθένας μας θα δώση λόγο για το τί έκανε σ᾿ αυτά τα δύσκολα χρόνια με την προσευχή, με την καλωσύνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα προσπαθούν να γκρεμίσουν την πίστη, γι᾿ αυτό αφαιρούν σιγά-σιγά από καμμιά πέτρα, για να σωριασθή το οικοδόμημα της πίστεως. Όλοι όμως ευθυνόμαστε για το γκρέμισμα αυτό· όχι μόνον αυτοί που αφαιρούν τις πέτρες και το γκρεμίζουν, αλλά και όσοι βλέπουμε να γκρεμίζεται και δεν προσπαθούμε να το υποστυλώσουμε. Όποιος σπρώχνει στο κακό τον άλλον θα δώση λόγο στον Θεό γι' αυτό. Και ο διπλανός όμως θα δώση λόγο, γιατί έβλεπε εκείνον να κάνη κακό στον συνάνθρωπό του και δεν αντιδρούσε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο κόσμος εύκολα πιστεύει έναν άνθρωπο που έχει τον τρόπο να πείθη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο λαός, Γέροντα, είναι σαν θηρίο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ από τα θηρία δεν έχω παράπονο. Βλέπεις, τα ζώα δεν μπορούν να κάνουν μεγάλο κακό, γιατί δεν έχουν μυαλό, ενώ ο άνθρωπος που φεύγει μακριά από τον Θεό γίνεται χειρότερος από το μεγαλύτερο θηρίο! Κάνει μεγάλο κακό. Το δυνατό ξίδι γίνεται από το χαλασμένο κρασί. Τα άλλα τα τεχνητά ξίδια δεν είναι τόσο δυνατά... Πιό φοβερό είναι, όταν ο διάβολος συμμαχήση με έναν άνθρωπο διεστραμμένο· τότε κάνει διπλό κακό στους άλλους, όπως ο σαρκικός λογισμός, όταν συμμαχήση με την σάρκα, τότε κάνει μεγαλύτερο κακό στην σάρκα. Για να συνεργασθή ο διάβολος με έναν τέτοιο άνθρωπο, πρέπει αυτός να είναι υπολογίσιμος, να έχη κακή προαίρεση, κακία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην συνέχεια, Θεός φυλάξοι, αυτοί θα φέρουν δυσκολίες, θα στριμώξουν ανθρώπους, μοναστήρια. Η Εκκλησία, ο Μοναχισμός, θα τους κάνη κακό, γιατί θα τους εμποδίση στα σχέδιά τους. Μόνον πνευματικά μπορεί να αντιμετωπισθή η σημερινή κατάσταση, όχι κοσμικά. Θα σηκωθή ακόμη λίγη φουρτούνα, θα πετάξη έξω κονσερβοκούτια, σκουπίδια, όλα τα άχρηστα, και μετά θα ξεκαθαρίσουν τα πράγματα. Σ́ αυτήν την κατάσταση θα δήτε, άλλοι θα έχουν καθαρό μισθό και άλλοι θα ξοφλούν χρέη. Θα γίνουν έτσι τα πράγματα, που δεν θα στενοχωριέται κανείς για την ταλαιπωρία που θα περνάνε – δεν θα λέη φυσικά «δόξα σοι ο Θεός».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσο ο Θεός μας αγαπά! Αυτά που γίνονται σήμερα[3]και αυτά που σκέφτονται να κάνουν, αν γίνονταν πριν από είκοσι χρόνια που είχε περισσότερη πνευματική άγνοια ο κόσμος, θα ήταν πολύ δύσκολα. Τώρα ξέρει ο κόσμος· η Εκκλησία δυνάμωσε. Ο Θεός αγαπάει τον άνθρωπο, το πλάσμα Του, και θα φροντίση γι᾿ αυτά που του χρειάζονται, φθάνει ο άνθρωπος να πιστεύη και να τηρή τις εντολές Του.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Επικατάρατος ο ποιών τα έργα Κυρίου αμελώς»[4]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά, αν ένας ευλαβής ασχολείτο με την κατάσταση στον κόσμο, δεν πρέπει να ήταν καλά· ήταν για κλείσιμο στον Πύργο[5]. Σήμερα αντίθετα, αν ένας ευλαβής δεν ενδιαφέρεται και δεν πονάη για την κατάσταση που επικρατεί στον κόσμο, είναι για κλείσιμο στον Πύργο. Γιατί τότε αυτοί που κυβερνούσαν είχαν Θεό μέσα τους, ενώ σήμερα πολλοί από αυτούς που κυβερνούν δεν πιστεύουν. Είναι πολλοί τώρα εκείνοι που επιδιώκουν να τα διαλύσουν όλα, οικογένεια, νεολαία, Εκκλησία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το να ενδιαφέρεται κανείς τώρα και να ανησυχή για την κατάσταση στην οποία βρίσκεται το έθνος μας είναι ομολογία, γιατί η Πολιτεία τα βάζει με τον θείο νόμο. Ψηφίζει νόμους ενάντιους στον νόμο του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι και μερικοί αδιάφοροι που ούτε στον θεσμό της Εκκλησίας πιστεύουν ούτε Έθνος παραδέχονται καί, για να έχουν το χουζούρι τους, λένε «ο Απόστολος Παύλος λέει να μην ενδιαφέρεσαι για τα πράγματα του κόσμου», και έτσι αδιαφορούν! Αλλά ο Απόστολος Παύλος άλλο εννοούσε. Τότε τα ειδωλολατρικά έθνη είχαν εξουσία. Μερικοί ξέκοψαν από το κράτος και πίστεψαν στον Χριστό. Έλεγε λοιπόν ο Απόστολος Παύλος σ́ αυτούς «εσείς μην ασχολήσθε με τα πράγματα του κόσμου», για να ξεχωρίζουν από τον κόσμο, γιατί όλος ο κόσμος ήταν ειδωλολατρικός[6]. Από την στιγμή όμως που ανέλαβε την εξουσία ο Μέγας Κωνσταντίνος και επικράτησε ο Χριστιανισμός, δημιουργήθηκε σιγά-σιγά η μεγάλη χριστιανική παράδοση με τις Εκκλησίες, τα μοναστήρια, την τέχνη, το τυπικό της λατρείας κ.λπ. Έχουμε λοιπόν ευθύνη να τα διατηρήσουμε όλα αυτά και να μην αφήσουμε τους εχθρούς της Εκκλησίας να τα διαλύσουν. Έχω ακούσει και Πνευματικούς να λένε: «Εσείς μην ασχολήσθε μ'' αυτά»! Αν είχαν μεγάλη αγιότητα και έφθαναν με την προσευχή σε τέτοια κατάσταση, που να μην τους ενδιαφέρη τίποτε, να τους φιλούσα και τα πόδια. Αλλά τώρα αδιαφορούν, γιατί θέλουν να τα έχουν καλά με όλους και να καλοπερνούν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αδιαφορία δεν επιτρέπεται ούτε στους κοσμικούς, πόσο μάλλον στους πνευματικούς ανθρώπους. Ένας άνθρωπος τίμιος, πνευματικός, δεν πρέπει να κάνη τίποτε με αδιαφορία. «Επικατάρατος ο ποιών τα έργα Κυρίου αμελώς», λέει ο Προφήτης Ιερεμίας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αναπαύουμε τους ανθρώπους πνευματικά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά στους δέκα οι έξι ήταν θεοφοβούμενοι, οι δύο μέτριοι και οι δύο αδιάφοροι, αλλά και αυτοί είχαν μέσα τους πίστη. Σήμερα δεν είναι έτσι. Δεν ξέρω που θα πάη αυτή η κατάσταση. Να προσπαθήσουμε τώρα, όσο μπορούμε, να βοηθήσουμε πνευματικά τους ανθρώπους· όπως έγινε τότε με τον κατακλυσμό, με την κιβωτό του Νώε, έτσι και τώρα να γλυτώσουν μερικοί, να μη σακατευθούν πνευματικά. Θέλει πολλή προσοχή, πολλή διάκριση, να δη κανείς τα πράγματα από πολλές πλευρές και να αναπαύση τους ανθρώπους. Μήπως εμένα με αναπαύει να μαζεύωνται οι άνθρωποι ή ήθελα να βλέπω τόσο κόσμο; Όχι, αλλά σ᾿ αυτήν την κατάσταση που βρισκόμαστε, θέλουν λίγη βοήθεια οι καημένοι οι άνθρωποι. Εγώ δεν έγινα παπάς, για να μην έχω να κάνω με κόσμο, και τελικά περισσότερο ασχολούμαι με τον κόσμο. Αλλά ο Θεός ξέρει την διάθεσή μου και μου δίνει περισσότερα από όσα θα μου έδινε αν έκανα αυτό που με ανέπαυε. Πόσες φορές παρακαλώ την Παναγία να μου οικονομήση έναν τόπο μακρινό, ήσυχο, να μη βλέπω, να μην ακούω τίποτε, να κάνω προσευχή για όλον τον κόσμο, αλλά δεν μ᾿ ακούει· σε άλλα τιποτένια μ' ακούει. Βλέπω ότι τώρα ο Θεός, όταν πρόκειται να έχω κόσμο, με βιδώνει στο κρεββάτι με κάποια αρρώστια, για να ξεκουρασθώ. Δεν μου δίνει την γλυκύτητα που ένιωθα παλιότερα στην προσευχή, γιατί δεν θα μπορούσα να αποχωρισθώ από αυτήν. Τότε, όταν ερχόταν κανείς στο Καλύβι, ζοριζόμουν να βγώ από εκείνη την κατάσταση την πνευματική[7].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εκεί στο Καλύβι γίνομαι πρόγραμμα των ανθρώπων. Διαβάζω μέσα Ψαλτήρι, απ'' έξω χτυπούν. Τους λέω «περιμένετε ένα τέταρτο» και αυτοί φωνάζουν: «Έ, Πάτερ, σταμάτα την προσευχή· ο Θεός δεν παρεξηγείται». Κατάλαβες; Μέχρις εκεί φθάνουν! Δεν είναι μόνον που θα σταματήσω, αλλά αν βγώ, μετά πάει, τέλειωσε. Ό,τι κάνω μέχρι τότε. Το πρωί, στις εξήμισι–επτά η ώρα πρέπει να έχω τελειώσει και τον Εσπερινό, για να είμαι σίγουρος. «Φώς... πρωϊνόν αγίας δόξης»! Την ώρα που τελειώνετε εσείς τον Όρθρο, εγώ έχω τελειώσει και τα κομποσχοίνια του Εσπερινού. Αν προλάβω να πάρω αντίδωρο το πρωί, καλά· μετά ούτε τσάι· γίνομαι πτώμα, πέφτω κάτω. Ακόμη και το Πάσχα, την Διακαινήσιμο, είχα κάνει ενάτες, τριήμερα[8]. Μπορείς–δέν μπορείς, πρέπει να μπορής. Μια μέρα, δεν ξέρω τί εμπόδια είχε ο κόσμος – ίσως είχε φουρτούνα η θάλασσα και δεν είχε καράβι – και δεν ήρθε κανείς στο Καλύβι. Πά, πά, έζησα μια σιναΐτικη μέρα, όπως τότε στην σπηλιά της Αγίας Επιστήμης[9]! Όταν η θάλασσα έχη φουρτούνα, εγώ έχω μπουνάτσα· όταν έχη μπουνάτσα, τότε έχω φουρτούνα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχω βέβαια την δυνατότητα να πάω κάπου να ησυχάσω. Ξέρετε πόσοι μου έχουν πει να μου κάνουν τα έξοδα, για να πάω στην Καλιφόρνια, στον Καναδά; «Έχουμε Ησυχαστήριο, λένε, να ᾿ρθής». Αν βρεθώ σε άγνωστο τόπο, θα είναι σαν να βρίσκωμαι στον Παράδεισο. Δεν θα με ξέρη κανείς, θα έχω το πρόγραμμά μου, θα ζήσω καλογερικά, όπως θέλω. Βλέπεις όμως, όταν τελειώνη ο πόλεμος, τότε απολύεται κανείς. Τώρα έχουμε πόλεμο, πνευματικό πόλεμο. Πρέπει να είμαι στην πρώτη γραμμή. Τί μαρξιστές υπάρχουν, τί μασόνοι, τί σατανιστές και τόσοι άλλοι! Πόσοι δαιμονισμένοι, πόσοι αναρχικοί, πόσοι πλανεμένοι έρχονται, για να τους επισφραγίσω την πλάνη τους! Και πόσους μου τους στέλνουν, χωρίς να τους προβληματίσουν, άλλοι για να τους ξεφορτωθούν, άλλοι για να μη βγάλουν αυτοί το φίδι από την τρύπα... Να ξέρατε πόσο στριμώχνομαι και από πόσες μεριές! Πίκρα το στόμα μου από τον πόνο των ανθρώπων. Μέσα μου όμως νιώθω παρηγοριά. Αν φύγω, το θεωρώ σαν να φεύγω από την πρώτη γραμμή, σαν να οπισθοχωρώ. Το θεωρώ προδοσία. Έτσι το νιώθω. Μήπως ξεκίνησα για τέτοια πράγματα ή ξεκίνησα για να βοηθάω μοναστήρια; Για αλλού ξεκίνησα και αλλού βρέθηκα, και τώρα πώς παλεύω! Και βλέπεις, ο άλλος δεν μιλάει. Δεν πάει να διαλύσουν την Εκκλησία; «Δεν πειράζει!», λέει. Πηγαίνει και με τον έναν και με τον άλλον, αρκεί να βολευτή. Τί να βολευτή! Αυτόν τον βολεύει ο διάβολος τελικά. Αυτά είναι άτιμα πράγματα. Αν ήθελα εγώ να κάνω αυτό που με ευχαριστεί, ού, ξέρετε πόσο εύκολο ήταν; Σκοπός όμως είναι να κάνω όχι αυτό που βολεύει εμένα, αλλά αυτό που βολεύει τον άλλον. Αν σκεφτόμουν πώς να βολευτώ εγώ, έχω την δυνατότητα να βολευτώ σε πολλές μεριές. Για να περάσης όμως στην βουλή του Θεού, πρέπει να γίνης «βουλευτής» του Θεού, όχι «βολευτής» του εαυτού σου.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρώτο Μέρος – Η Ευθύνη Της Αγάπης
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Ο τρόπος της Εκκλησίας είναι η αγάπη·
- type: paragraph
  initial:
    ru: ''
  text:
    ru: διαφέρει από τον τρόπο των νομικών.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Εκκλησία βλέπει τα πάντα με μακροθυμία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί κοιτάζει να βοηθήση τον καθέναν,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ό,τι και αν έχη κάνει,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: όσο αμαρτωλός και αν είναι».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η γενιά της αδιαφορίας
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αδιαφορία για τον Θεό φέρνει την αδιαφορία και για όλα τα άλλα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί είναι αυτό που ακούγεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αεροπλάνο, Γέροντα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κλείσε το παράθυρο, μην μπή μέσα! Έτσι που παλάβωσε ο κόσμος, και αυτό σιγά-σιγά μπορεί να γίνη!... Έχουν διαλυθή όλα, οικογένεια, παιδεία, υπηρεσίες... Ά, δεν τους καίγεται καρφί! Τίποτε δεν έχουν μέσα τους...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιός φταίει που φθάσαμε σ᾿ αυτήν την κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μιλάω γενικά· θέλω να πώ, μέχρι που έχει φθάσει η αδιαφορία! Πήγαινε σε μια σχολή και θα δής· αν λ.χ. χτυπούν τα παράθυρα από τον αέρα, ζήτημα να βρεθή ένα παιδί να τα κλείση, για να μη σπάσουν. Άλλα θα χαζεύουν, άλλα θα κοιτάζουν πώς χτυπούν, άλλα θα περνούν από ᾿κεί σαν να μη συμβαίνη τίποτε. Αδιαφορία! Μου έλεγε ένας αξιωματικός που ήταν υπεύθυνος στις αποθήκες: «Τρομάζω να βρώ έναν στρατιώτη σωστό, να τον βάλω φρουρό στην αποθήκη πετρελαίων, για να μη βάλουν οι άλλοι καμμιά φωτιά ή ο ίδιος μην πετάξη κανένα τσιγάρο απρόσεκτα».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Υπάρχει ένα πνεύμα χλιαρό, καθόλου ανδρισμός. Χαλάσαμε τελείως! Πώς μας ανέχεται ο Θεός! Παλιά τί αξιοπρέπεια υπήρχε! Τί φιλότιμο! Στον πόλεμο του ᾿40, στα σύνορα, οι Ιταλοί είχαν πότε-πότε κάποια επικοινωνία με τους Έλληνες φρουρούς και έκαναν καμμιά επίσκεψη στο ελληνικό φυλάκιο. Και να δήτε τί φιλότιμο οι Έλληνες! Μια φορά που πήγαν οι Ιταλοί στο ελληνικό φυλάκιο, οι Έλληνες έβαλαν να τους φτιάξουν καφέ. Βγάζει τότε μπροστά τους ένας Έλληνας αξιωματικός ένα μάτσο χρήματα, πενηντάρικα, εκατοστάρικα – και είχαν αξία τότε αυτά τα χρήματα – και τα ρίχνει για προσάναμμα στην φωτιά, για να δείξη στους Ιταλούς ότι είναι πλούσιο το ελληνικό κράτος! Οι Ιταλοί τα έχασαν. Βλέπετε θυσία!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα μπήκε και σ́ εμάς το πνεύμα που συναντάει κανείς στα κομμουνιστικά κράτη. Στην Ρωσία, παρόλο που φέτος[10]είχαν σοδειά, ξέρετε τί πείνα θα έχουν; Δεν θέρισαν το σιτάρι στον καιρό του· πήγαν το φθινόπωρο να θερίσουν. Θερίζουν το φθινόπωρο; Αν δεν είναι δικό τους, πώς να το πονέσουν και να πάνε να το θερίσουν; Η ζωή τους είναι μια αγγαρεία. Δεν έχουν τον ζήλο να δημιουργήσουν κάτι, γιατί τόσα χρόνια δεν δημιουργούσαν. Με αυτό το ρέμπελο πνεύμα που μπήκε, με αυτήν την αδιαφορία, πάει, βούλιαξε όλο το κράτος. Βρέχει και είναι απλωμένο το σιτάρι; Δεν τους νοιάζει. Ήρθε η ώρα να φύγουν; Φεύγουν. Το  παίρνει το σιτάρι η βροχή. Την άλλη μέρα θα πάνε στην ώρα τους να μαζέψουν όσο έμεινε! Όταν όμως είναι δικό σου το σιτάρι και το έχης απλωμένο στο αλώνι, αν βρέξη, το αφήνεις να χαθή; Δεν θα κοιμηθής, για να το σώσης. Και νιώθεις χαρά, αγαλλίαση από την κούραση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η αδιαφορία για τον Θεό φέρνει την αδιαφορία και για όλα τα άλλα· φέρνει την αποσύνθεση. Η πίστη στον Θεό είναι μεγάλη υπόθεση. Λατρεύει ο άνθρωπος τον Θεό και ύστερα αγαπάει και τους γονείς του, το σπίτι του, τους συγγενείς του, την δουλειά του, το χωριό του, τον νομό του, το κράτος του, την πατρίδα του. Ένας που δεν αγαπάει τον Θεό, την οικογένειά του, δεν αγαπάει τίποτε· και φυσικά δεν αγαπάει ούτε την πατρίδα του, γιατί και η πατρίδα είναι μια μεγάλη οικογένεια. Θέλω να πώ, όλα από εκεί ξεκινάνε. Δεν πιστεύει ο άνθρωπος στον Θεό, και μετά ούτε γονείς ούτε οικογένεια ούτε χωριό ούτε πατρίδα υπολογίζει. Και αυτά είναι που πάνε τώρα να διαλύσουν, γι'' αυτό δημιουργούν μια κατάσταση ρεμπελιό. Μου έγραφε ένας αστυνομικός: «Δεν μπόρεσα να έρθω, γιατί μου έπεσε πολλή δουλειά. Μείναμε δύο στην περιοχή, ενώ έπρεπε να είμαστε οκτώ». Ακούς πράγματα; Αντί τώρα να προσθέσουν άλλους δύο, αφήνουν μόνο δύο!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ευτυχώς υπάρχουν και εξαιρέσεις. Ήρθε μια φορά ένας πατέρας και μου λέει: «Κάνε προσευχή για τον  Άγγελο, γιατί θα τον σκοτώσουν». Τον ήξερα τον γιό του από μικρό παιδί. Τότε υπηρετούσε την θητεία του. «Γιατί, του λέω, τί συμβαίνει;». «Πήγε μια φορά, μου λέει, και βρήκε τους άλλους να παίζουν χαρτιά, ενώ είχαν υπηρεσία. Τους έκανε παρατήρηση· δεν τον άκουσαν. Τους έκανε μετά αναφορά, και ένας από εκείνους τον απείλησε ότι θα τον σκοτώση». «Κοίταξε, του λέω, για να τον σκοτώσουν, δεν τον σκοτώνουν. Εγώ θα κάνω προσευχή, για να μην περάσουν τον Άγγελο στρατοδικείο, που δεν έπαιζε και αυτός χαρτιά...»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έμαθα και κάτι άλλο και είπα: «Δόξα τω Θεώ, υπάρχουν ακόμη Έλληνες που πονούν για την πατρίδα». Ένας αεροπόρος, επειδή είχαν παραβιάσει τα σύνορα τουρκικά αεροπλάνα, έκανε προσπάθεια να τα προσπεράση λίγο, για να βγάλη φωτογραφία και να αποδείξη ότι παραβίασαν τα σύνορα. «Παράτησέ το», του φώναζε ο άλλος από τον ασύρματο, αλλά εκείνος επέμενε, προσπαθούσε... Ο Τούρκος εν τω μεταξύ είχε μεγαλύτερο αεροπλάνο και έτρεχε πιο πολύ και το πήγαινε πιο χαμηλά, μέχρι που ο Έλληνας, ο καημένος, βούλιαξε στην θάλασσα! Και είναι άλλοι που μόνο βόλτες κάνουν με το αεροπλάνο! Πόσο διαφέρει δηλαδή!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χρειάζεται να μπή κανείς στο νόημα, να αισθανθή το καλό ως ανάγκη, αλλιώς είναι ένα ρέμπελο πράγμα. Άντε τώρα να βάλης κάποιον αγγαρεία να πάη να πολεμήση! Θα κοιτάη να φύγη από ᾿δώ, να γλυτώση από ᾿κεί. Όταν καταλάβη όμως τί κακό θα κάνη ο εχθρός, πάει εθελοντής μετά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Σήμερα οι άνθρωποι γυρίζουν γύρω από τον εαυτό τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιά στην πατρίδα μου, στα Φάρασα, έλεγαν: «Αν έχης καμμιά δουλειά, μην την αφήνης για αύριο. Αν έχης καλό φαγητό, άσ́ το για αύριο, μήπως έρθη κανένας μουσαφίρης». Τώρα σκέφτονται: «Να αφήσουμε την δουλειά, μήπως έρθη κανείς αύριο και μας βοηθήση. Το καλό φαγητό, ας το φάμε εμείς απόψε!». Οι περισσότεροι σήμερα γυρίζουν γύρω από τον εαυτό τους. Μόνον τον εαυτό τους σκέφτονται. Ας υποθέσουμε ότι βρέχει, γίνεται κατακλυσμός. Θα δήτε, οι περισσότερες από σάς θα σκεφθούν μήπως έχουν ρούχα απλωμένα, να πάνε να τα μαζέψουν. Κακό δεν είναι αυτό, αλλά δεν θα πάνε πιο πέρα. Τα ρούχα και να βραχούν, πάλι θα στεγνώσουν. Αυτοί όμως που αλωνίζουν τί θα γίνουν; Πονάτε γι'' αυτούς, για να κάνετε καμμιά ευχή; Ή πέφτουν κεραυνοί· ζήτημα πέντε-έξι ψυχές να θυμηθούν τους καημένους τους γεωργούς ή αυτούς που έχουν θερμοκήπια. Δεν σκέφτεται δηλαδή τον άλλον ο άνθρωπος, δεν βγαίνει από τον εαυτό του, αλλά γυρίζει συνέχεια γύρω από τον εαυτό του. Όταν όμως γυρίζη γύρω από τον εαυτό του, κέντρο έχει τον εαυτό του· δεν έχει τον Χριστό. Είναι έξω από τον άξονα που είναι ο Χριστός. Για να φθάση να σκέφτεται τον άλλον, πρέπει ο νούς του πρώτα να είναι στον Χριστό. Τότε σκέφτεται και τον πλησίον και μετά σκέφτεται και τα ζώα και όλη την φύση. Έχει τον σταθμό του ανοιχτό καί, μόλις πάρη το μήνυμα, τρέχει να βοηθήση. Αν ο νούς του δεν είναι στον Χριστό, δεν δουλεύει η καρδιά του, γι᾿ αυτό δεν αγαπάει ούτε τον Χριστό ούτε τον συνάνθρωπό του, πόσο μάλλον την φύση, τα ζώα, τα δένδρα, τα φυτά. Έτσι όπως κινείσθε, που να φθάσετε στο σημείο να έχετε επικοινωνία με τα ζώα, με τα πουλιά! Αν πέση κανένα πουλί από την σκεπή, θα το ταΐσετε. Αν δεν πέση από την σκεπή, δεν σκέφτεσθε να το ταΐσετε. Εγώ βλέπω τα πουλιά· λέω «θέλουν τάισμα, τα καημένα»· ρίχνω ψίχουλα κ.λπ., βάζω και νεράκι να πιούν. Βλέπω άρρωστα κλαδιά στα δένδρα· αμέσως σκέφτομαι να τα κόψω, για να μην κολλήσουν και τα άλλα. Ή χτυπάει μια πόρτα, ένα παράθυρο, πάει εκεί ο νούς μου. Θα ξεχάσω τον εαυτό μου, αν μου χρειάζεται κάτι, αλλά θα κοιτάξω την πόρτα, το παράθυρο, να μη σπάση, να μη γίνη καμμιά ζημιά. Παρεμπιπτόντως σκέφτομαι για μένα. Και αν κανείς σκέφτεται και πονάη για τα δημιουργήματα, πόσο μάλλον θα σκέφτεται τον Δημιουργό τους! Αν δεν κινήται έτσι ο άνθρωπος, πώς να συντονισθή με τον Θεό;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έπειτα, και όταν βγαίνετε έξω, ρίξτε καμμιά ματιά γύρω. Μπορεί κάποιος έστω και από απροσεξία ή από κακότητα – εύχομαι κανείς να μην κάνη κακό – κάτι να πετάξη και να βάλη φωτιά· γι' αυτό ρίξτε μια ματιά. Και αυτό στα πνευματικά ανήκει, γιατί και αυτό το βλέμμα έχει αγάπη. Εγώ βγαίνω έξω από το Καλύβι, ρίχνω μια ματιά προς τα κάτω, μια ματιά προς την σκεπή, να δώ μήπως μυρίζει καμένο. Άλλο αν έχης τέτοια πίστη πώς, αν πιάση φωτιά και κάνης προσευχή, θα σβήση η φωτιά. Διαφορετικά, πρέπει να ενεργήσης. Ή, όταν ακούω κρότο, προσέχω να δώ τί είναι· πυροβόλο; άσκηση κάνουν; φουρνέλλο; Ένα και ένα ο νούς μου πηγαίνει εκεί, για να κάνω κομποσχοίνι. Όποιος αδιαφορεί για τον εαυτό του, από αγάπη προς τους άλλους, το μεγάλο ενδιαφέρον του Θεού βρίσκεται μαζί του, και όλοι οι άνθρωποι ενδιαφέρονται γι' αυτόν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά η σημερινή γενιά είναι η γενιά της αδιαφορίας! Οι περισσότεροι μόνο για παρελάσεις είναι! Μήν τους πής, αν συμβή κάτι, να αμυνθούν! Τώρα όμως και παρελάσεις δεν θέλουν! Παλιότερα πήγαιναν στις παρελάσεις, άκουγαν και ένα εμβατήριο, κάτι μέσα τους σκιρτούσε! Σήμερα υπάρχει ένα ρεμπελιό σε μας τους Έλληνες. Βέβαια άλλοι λαοί είναι ακόμη χειρότερα, γιατί δεν έχουν ιδανικά. Βλέπεις, οι Έλληνες μπορεί να έχουν ένα σωρό κουσούρια, αλλά έχουν και ένα δώρο από τον Θεό, το φιλότιμο και την λεβεντιά· όλα τα πανηγυρίζουν. Οι άλλοι λαοί ούτε στα λεξικά τους δεν έχουν αυτές τις λέξεις.
- type: h2
  initial:
    ru: ''
  text:
    ru: Έχουμε ευθύνη[11]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είχε έρθει στο Καλύβι ένας άθεος μέχρι το κόκκαλο.   Αφού είπε διάφορα, μετά μου λέει: «Εγώ είμαι εικονομάχος». Από εκεί που δεν πίστευε τίποτε, ύστερα έλεγε ότι είναι εικονομάχος. «Βρέ αθεόφοβε, του λέω, εσύ αφού δεν πιστεύεις σε τίποτε, τί μου λές ότι είσαι εικονομάχος; Τότε, τον καιρό της Εικονομαχίας[12], μερικοί Χριστιανοί από υπερβολικό ζήλο έπεσαν σε πλάνη, έφθασαν στην άλλη άκρη, και μετά η Εκκλησία τοποθέτησε το θέμα· δεν είναι ότι δεν πίστευαν».Υποστήριζε εν τω μεταξύ όλη την σημερινή κατάσταση. Μαλώσαμε εκεί πέρα. «Καλά, του λέω, κατάσταση είναι αυτή; Δικαστικοί να φοβούνται να δικάσουν, να κάνουν μηνύσεις για εγκληματίες και να τους απειλούν ο ένας και ο άλλος και να αναγκάζωνται να τις αποσύρουν; Και τελικά ποιοί κυβερνούν; Σε αναπαύει αυτή η κατάσταση; Υποστηρίζεις αυτούς; Εσύ είσαι εγκληματίας. Γι᾿ αυτό ήρθες; Άντε, φύγε από εδώ!». Τον έδιωξα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν φοβάστε έτσι που μιλάτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να φοβηθώ; Τον τάφο μου τον έχω ανοίξει. Αν δεν τον είχα ανοίξει, θα με απασχολούσε που θα κουραζόταν ο άλλος να σκάψη. Τώρα θα χρειασθή να ρίξη μόνο λίγους τενεκέδες χώμα...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχω υπ᾿ όψιν μου έναν άλλον άθεο, έναν βλάσφημο, που τον αφήνουν στην τηλεόραση και μιλάει, ενώ έχει πει τα πιο βλάσφημα λόγια για τον Χριστό και την Παναγία. Δεν παίρνει και η Εκκλησία μια θέση να αφορίση μερικούς. Αυτούς έπρεπε να τους αφορίζη η Εκκλησία. Λυπούνται τον αφορισμό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θα καταλάβουν με τον αφορισμό, αφού τίποτε δεν παραδέχονται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τουλάχιστον να φανή ότι η Εκκλησία παίρνει μια θέση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η σιωπή της, Γέροντα, είναι σαν να τα αναγνωρίζη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί. Έγραψε ένας κάτι βλάσφημα για την Παναγία και κανείς δεν μίλησε. Λέω σε κάποιον: «Δεν είδες τί γράφει εκείνος;». «Έ, τί να τους κάνης, μου λέει. Θα λερωθής, αν ασχοληθής μαζί τους». Φοβούνται να μιλήσουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί είχε να φοβηθή, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να μη γράψουν τίποτε γι᾿ αυτόν και εκτεθή, και ανέχεται να βλασφημήται η Παναγία! Να μη θέλουμε να βγάλη ο άλλος το φίδι από την τρύπα, για να έχουμε εμείς την ησυχία μας. Αυτό είναι έλλειψη αγάπης. Ύστερα αρχίζει ο άνθρωπος να κινήται από συμφέρον. Γι'' αυτό βλέπεις ένα πνεύμα σήμερα: «Με τον τάδε να έχουμε σχέσεις, για να μας λέη καλά λόγια. Με τον άλλο να τα έχουμε καλά, για να μη μας διασύρη κ.λπ. Να μη μας πάρουν για κορόιδα, να μη γίνουμε θύματα». Άλλος αδιαφορεί και δεν μιλάει. «Να μη μιλήσω, λέει, για να μη με γράψουν οι εφημερίδες». Οι περισσότεροι δηλαδή είναι τελείως αδιάφοροι. Τώρα άρχισε λίγο κάτι να γίνεται. Τόσον καιρό δεν έγραφε κανένας τίποτα. Είχα βάλει τις φωνές πριν από χρόνια σε κάποιον στο Άγιον Όρος. «Πολύ πατριωτισμό έχεις», μου λέει. Πριν από λίγο καιρό ήρθε και με βρήκε: «Όλα τα διέλυσαν, μου λέει, οικογένεια, παιδεία...». Του λέω και εγώ με την σειρά μου: «Πολύ πατριωτισμό έχεις!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλη αυτή η κατάσταση έχει κάνει ένα κακό και ένα καλό. Το κακό είναι ότι και εκείνοι που είχαν κάτι μέσα τους, άρχισαν να αδιαφορούν, γιατί λένε: «Εγώ θα σιάξω την κατάσταση;». Το καλό είναι ότι πολλοί άρχισαν να προβληματίζωνται και να αλλάζουν. Μερικοί έρχονται και με βρίσκουν και προσπαθούν να δικαιολογήσουν ένα κακό που έκαναν προηγουμένως, γιατί έχουν προβληματισθή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, πρέπει πάντα να ομολογούμε το «πιστεύω» μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Χρειάζεται διάκριση. Είναι φορές που δεν πρέπει να μιλήσουμε και άλλες φορές που πρέπει να ομολογούμε με παρρησία το «πιστεύω» μας, γιατί φέρουμε ευθύνη, αν δεν μιλήσουμε. Σ́ αυτά τα δύσκολα χρόνια ο καθένας μας πρέπει να κάνη ό,τι γίνεται ανθρωπίνως και ό,τι δεν γίνεται ανθρωπίνως να το αφήνη στον Θεό. Έτσι θα έχουμε ήσυχη την συνείδησή μας ότι κάναμε εκείνο που μπορούσαμε. Αν δεν αντιδράσουμε, θα σηκωθούν οι πρόγονοί μας από τους τάφους. Εκείνοι υπέφεραν τόσα για την πατρίδα και εμείς τί κάνουμε γι᾿ αυτήν; Η Ελλάδα, η Ορθοδοξία, με την παράδοσή της, τους Αγίους και τους ήρωές της, να πολεμήται από τους ίδιους τους Έλληνες και εμείς να μη μιλάμε! Είναι φοβερό! Είπα σε κάποιον: «Γιατί δεν μιλάτε; Τί είναι αυτά που κάνει ο τάδε;». «Τί να πής, μου λέει, αυτός όλος βρωμάει». «Αν βρωμάη όλος, γιατί δεν μιλάτε; Χτυπήστε τον». Τίποτε, τον αφήνουν. Έναν πολιτικό τον έφτυσα. «Πές, του λέω, «δέν συμφωνώ μ᾿ αυτό». Τίμια πράγματα. Θέλεις να εξυπηρετηθής εσύ και να ρημάξουν όλα;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν οι Χριστιανοί δεν ομολογήσουν, δεν αντιδράσουν, αυτοί θα κάνουν χειρότερα. Ενώ, αν αντιδράσουν, θα το σκεφθούν. Αλλά και οι σημερινοί Χριστιανοί δεν είναι για μάχες. Οι πρώτοι Χριστιανοί ήταν γερά καρύδια· άλλαξαν όλο τον κόσμο. Και στην βυζαντινή εποχή μια εικόνα έβγαζαν από την Εκκλησία και αντιδρούσε ο κόσμος. Εδώ ο Χριστός σταυρώθηκε, για να αναστηθούμε εμείς, και εμείς να αδιαφορούμε! Αν η Εκκλησία δεν μιλάη, για να μην έρθη σε ρήξη με το κράτος, αν οι μητροπολίτες δεν μιλούν, για να τα έχουν καλά με όλους, γιατί τους βοηθάνε στα Ιδρύματα κ.λπ., οι Αγιορείτες πάλι αν δεν μιλούν, για να μην τους κόψουν τα επιδόματα[13], τότε ποιός θα μιλήση; Είπα σε κάποιον ηγούμενο: «Αν σάς πούν ότι θα σάς κόψουν τα επιδόματα, να πήτε: «Θα κόψουμε και εμείς την φιλοξενία», για να προβληματισθούν». Οι καθηγητές της Θεολογίας κ.λπ. δεν φωνάζουν, γιατί λένε: «Είμαστε υπάλληλοι· θα χάσουμε τον μισθό μας, και μετά πώς θα ζήσουμε;». Τα μοναστήρια εν τω μεταξύ τα έπιασαν με τις συντάξεις. Γιατί εγώ δεν θέλω να πάρω ούτε αυτήν την ταπεινή σύνταξη του Ο.Γ.Α.; Ακόμη και ασφαλισμένο σε μια ασφάλεια του Ο.Γ.Α. να τον έχουν τον μοναχό, και αυτό δεν είναι τίμιο. Να τον έχουν ασφαλισμένο ως άπορο, ναί· αυτό τον τιμά. Αλλά να τον έχουν ασφαλισμένο στον Ο.Γ.Α., γιατί; Ο μοναχός άφησε μεγάλες συντάξεις, έφυγε από τον κόσμο και ήρθε στο μοναστήρι, και να πάρη πάλι σύνταξη! Και να φθάνουμε για την σύνταξη να προδώσουμε τον Χριστό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν εννοείτε, Γέροντα, αν λ.χ. μια μοναχή δούλεψε ως δασκάλα μερικά χρόνια και δικαιούται κάποια σύνταξη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά, αυτή τέλος πάντων. Τώρα όμως να σού πώ, αν και αυτήν την σύνταξη την διαθέση κάπου, θα πάρη μια γερή σύνταξη από τον Χριστό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Βλέπω τί μας περιμένει, γι᾿ αυτό πονάω
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Περνούν τα χρόνια και τί δύσκολα χρόνια! Δεν τελείωσαν τα θέματα. Βράζει το καζάνι. Αν δεν είναι λίγο δυναμωμένος κανείς, πώς θα μπορέση να αντιμετωπίση μια δύσκολη κατάσταση; Ο Θεός δεν έκανε ανεπρόκοπους ανθρώπους. Πρέπει να καλλιεργήσουμε το φιλότιμο. Αλήθεια, Θεός φυλάξοι, αν γίνη ένα τράνταγμα, πόσοι θα σταθούν όρθιοι; Πριν από τον πόλεμο του ᾿40, στην Κόνιτσα, εκεί που είχα το μαραγκούδικο ήταν η αγορά και έφερναν οι χωρικοί καλαμπόκι, σιτάρι κ.λπ. Μερικοί πλούσιοι – τί πλούσιοι, αυτοί δηλαδή που έπαιρναν κάποιους τόκους από τις Τράπεζες –, όταν πήγαιναν οι καημένοι οι χωρικοί το καλαμπόκι στην αγορά, για να το πουλήσουν, αυτοί το κλωτσούσαν με το πόδι και ρωτούσαν πόσο έχει. Όταν ήρθε ο πόλεμος και αναγκάσθηκαν να τα πουλήσουν όλα, «καλημέρα» έλεγε ο ένας, «έχεις καλαμπόκι;» ρωτούσε ο άλλος. Γι' αυτό τώρα να ευχαριστήτε τον Θεό για όλα. Κοιτάξτε να ανδρωθήτε. Σφιχτήτε λιγάκι. Βλέπω τί μας περιμένει, γι᾿ αυτό πονάω. Μήν αφήνετε τον εαυτό σας χαλαρό. Ξέρετε τί τραβάνε αλλού οι Χριστιανοί[14]; Στην Ρωσία μέσα στα κάτεργα. Τί δυσκολίες! Που πνευματικά βιβλία! Αφήστε την Αλβανία. Δυστυχία! Δεν έχουν να φάνε. Ούτε Εκκλησίες άφησαν ούτε μοναστήρια. Τα ονόματά τους τα άλλαξαν και αυτά, γιατί δεν ήθελαν να ακούγωνται χριστιανικά ονόματα. Και στην Αμερική ακόμη, οι Ορθόδοξοι είναι λίγοι, σκορπισμένοι σε διάφορα μέρη, και ξέρετε τί τραβάνε; Να μην υπάρχη ορθόδοξη κοινότητα, να πηγαίνουν με το τραίνο ώρες μακριά, για να εκκλησιασθούν, να έρχωνται στο Άγιον Όρος να συμβουλευθούν για ένα θέμα! Είναι μεγάλη αχαριστία αυτό το χαλαρό πνεύμα που υπάρχει στην Ελλάδα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσους Αγίους θα παρουσιάση ο Θεός στα κράτη που υπήρχε κομμουνισμός! Μάρτυρες! Εκείνοι είχαν αποφασίσει τον θάνατο. Είχαν μεγάλες θέσεις και δεν συμφωνούσαν με τους νόμους, όταν ήταν αντίθετοι με τον νόμο του Θεού. «Δεν συμφωνώ· σκοτώστε με, κλείστε με φυλακή», έλεγαν, για να μην παρασυρθούν και οι άλλοι. Εδώ πολλοί, χωρίς να ζορίζωνται, δείχνουν τέτοια αδιαφορία! Λίγο αν περνούσαν μια δυσκολία, έναν πόλεμο ή δύσκολα χρόνια, θα ήταν διαφορετικά. Γιατί τώρα είναι σαν να μη συμβαίνη τίποτε. Είναι – πώς να το πη κανείς; – σαν ένας να έρχεται από την Αυστραλία με το αεροπλάνο την άνοιξη στην Ελλάδα και να φεύγη από ᾿δώ το φθινόπωρο για την Αυστραλία, οπότε φθάνει εκεί πάλι άνοιξη. Από άνοιξη σε άνοιξη, και χειμώνα δεν βλέπει· δεν ξέρει ούτε τί γίνεται τον χειμώνα ούτε από κακοκαιρίες ούτε τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορούμε να βοηθήσουμε έναν άνθρωπο αδιάφορο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να του βάλουμε την καλή ανησυχία, να τον προβληματίσουμε, για να θελήση ο ίδιος να βοηθηθή. Με το ζόρι δεν γίνεται. Πρέπει να διψάη ο άλλος, για να του δώσης να πιή νερό. Δώσε σε έναν που δεν έχει όρεξη, να φάη με το ζόρι· θα το κάνη εμετό. Όταν ο άλλος δεν θέλη, δεν μπορώ να του στερήσω την ελευθερία, το αυτεξούσιο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Άγνοια δεν δικαιολογείται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, μερικοί είναι αδιάφοροι, επειδή έχουν άγνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί άγνοια; Να σού πω μια άγνοια; Φιλόλογος από την Χαλκιδική δεν ήξερε τί είναι το Άγιον Όρος. Ένας Γερμανός δάσκαλος του μίλησε για το Άγιον Όρος και ήρθαν μαζί. Ο Γερμανός ήξερε ακόμη και πόσα μοναστήρια υπάρχουν στο Άγιον Όρος. Και παρόλο που ήταν Προτεστάντης, ήξερε και τί άγια Λείψανα υπάρχουν, που βρίσκονται κ.λπ. Αυτή η άγνοια δικαιολογείται; Άλλος από την Αμερική είπε σε κάποιον από την Χαλκιδική να ᾿ρθή για ένα πρόβλημά του να τον βοηθήσω. Από την Αμερική! Να σάς πω και κάτι ακόμη. Ήρθε ένας στο Καλύβι που ήταν από την Φλώρινα. «Μέσα από την Φλώρινα, του λέω, είσαι;». «Ναί, από μέσα», μου λέει. «Εσείς εκεί έχετε και καλό μητροπολίτη», του λέω. «Σε ποιά ομάδα παίζει;», μου λέει. Αυτός νόμιζε ότι ήταν ποδοσφαιριστής! Ήταν προσηλωμένος στο ποδόσφαιρο. Ούτε τον δεσπότη ήξερε – τουλάχιστον τον Καντιώτη τον ξέρουν. Αυτά δεν δικαιολογούνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όχι, άγνοια δεν δικαιολογείται σήμερα στον κόσμο. Λείπει η καλή διάθεση, το φιλότιμο. Εκείνος που έχει καλή διάθεση για να γνωρίση τον Χριστό, θα Τον γνωρίση. Θα πάρη στροφή. Και αν δεν βρεθή ούτε ένας θεολόγος ούτε ένας καλόγερος, και δεν ακούση τον λόγο του Θεού, άμα έχη καλή διάθεση, θα πάρη στροφή ή από ένα φίδι ή από ένα θηρίο ή από μια αστραπή, από έναν κατακλυσμό, ή από κάποιο άλλο γεγονός. Θα τον οικονομήση ο Θεός. Ένα παιδί αναρχικό είχε πάει στην Γερμανία. Εκεί το έκλεισαν σε αναμορφωτήριο, γιατί είχε μπλέξει με ναρκωτικά κ.λπ. Δεν είχε βοηθηθή από πουθενά. Στο αναμορφωτήριο του έδωσε κάποιος ένα Ευαγγέλιο. Το διάβασε και άλλαξε αμέσως. «Θα πάω στην Ελλάδα, είπε· εκεί είναι η Ορθοδοξία». Γύρισε στο χωριό του. Οι συγγενείς του βάλθηκαν να τον παντρέψουν. Τον πάντρεψαν· απέκτησε και ένα παιδάκι. Διάβαζε το Ευαγγέλιο, πήγαινε στην Εκκλησία, τηρούσε τις αργίες. Οι άλλοι που τον έβλεπαν να ζη έτσι έλεγαν: «Αυτός, για να διαβάζη Ευαγγέλιο, πάσχει, τρελλάθηκε»! Μετά από λίγο τον εγκατέλειψε και η γυναίκα του· πήρε μαζί της και το παιδάκι. Όταν έφυγε η γυναίκα του, εκείνος άφησε όλα όσα είχε στο χωριό, χωράφια, τρακτέρ κ.λπ. και πήγε στις σπηλιές και ασκήτευε. Ένας Πνευματικός όμως του είπε: «Πρέπει να βρής την γυναίκα σου, να συνεννοηθήτε, και ύστερα να αποφασίσης τί θα κάνης». Ξεκίνησε λοιπόν να πάη στην Θεσσαλονίκη, για να βρη την γυναίκα του. Πίστευε ότι, αφού έτσι του είπε ο Πνευματικός, θα του την παρουσιάση ο Χριστός. Στην Θεσσαλονίκη δεν την παρουσίασε την γυναίκα του ο Χριστός. Εν τω μεταξύ, βρήκε κάτι Γερμανούς, τους κατήχησε· ο ένας βαπτίσθηκε. Αυτοί του έβαλαν τα ναύλα και πήγε στην Αθήνα. Ούτε εκεί του την παρουσίασε. Του έβαλαν πάλι τα ναύλα και πήγε στην Κρήτη. Έπιασε εκεί μια δουλειά και πήγε σε έναν Πνευματικό. Εκείνος, όταν άκουσε το πρόβλημά του, του είπε: «Μήπως η γυναίκα σου και το παιδάκι είναι έτσι και έτσι; Εδώ κάπου δουλεύει μια γυναίκα. Δεν έχει πολύ καιρό που ήρθε». Και του περιέγραψε πώς ήταν αυτή η γυναίκα. «Αυτή πρέπει να είναι», λέει. Την ειδοποίησε ο Πνευματικός. Εκείνη, μόλις τον είδε, τα έχασε. «Με μάγια με βρήκες, του είπε. Μάγος είσαι». Και τον άφησε και έφυγε, πριν προλάβη να της μιλήση. Την έχασε πάλι. Έμαθε και για μένα και ήρθε στο Καλύβι. Χτύπησε μια φορά και περίμενε. Τραβήχθηκε στην άκρη καί, ώσπου να ανοίξω, έκανε μετάνοιες. Φορούσε κάτι παλιά ρούχα. Μου τα διηγήθηκε όλα. Είχα μερικά ξερά σύκα και του έδωσα. «Θέλεις σύκα;», του λέω. «Δεν έχω δόντια», μου λέει. «Και εγώ δεν έχω», του λέω. «Εσύ πονάς; με ρωτάει. Εγώ πονώ. Μέσα από τον πόνο βγαίνει η χαρά του Χριστού», μου λέει. «Θέλεις καμμιά φανέλλα;», τον ρωτάω. «Έχω δυό, μου λέει. Αν ζεστάνη ο καιρός, θα την δώσω την μία». «Κοίταξε, του λέω, μέχρι να ξεκαθαρίσης και να συνεννοηθής με την γυναίκα σου, να προσέξης την υγεία σου, γιατί έχεις ευθύνη και για το παιδάκι». Τέτοια αυταπάρνηση! Τέτοια πίστη! Δεν ήταν ούτε είκοσι επτά χρονών. Που να είχε γνωρίσει αυτός την μοναχική ζωή! Άγνοια τελεία είχε, αλλά είχε καλή διάθεση και ο Θεός τον βοήθησε και προχώρησε βαθιά ευαγγελικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι' αυτό λέω ότι άγνοια δεν δικαιολογείται με τίποτε σήμερα. Μόνον αν είναι κανείς λειψός ή μικρό παιδί, δικαιολογείται να έχη άγνοια. Αλλά και τα μικρά παιδιά σήμερα είναι σπίρτα! Άμα θέλη κανείς, υπάρχουν  πολλές δυνατότητες, για να γνωρίση την αλήθεια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η παρουσία του Χριστιανού είναι ομολογία πίστεως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τα διάφορα κινήματα, οι διαμαρτυρίες που γίνονται από τους Χριστιανούς έχουν κάποιο αποτέλεσμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η παρουσία των Χριστιανών είναι πλέον ομολογία πίστεως. Μπορεί κανείς με την προσευχή να βοηθήση περισσότερο, αλλά την σιωπή του θα την εκμεταλλευθούν οι άλλοι και θα πούν: «Ο τάδε και ο τάδε δεν διαμαρτυρήθηκαν, επομένως είναι με το μέρος μας· συμφωνούν μαζί μας». Αν δεν αρχίσουν μερικοί να χτυπούν το κακό, να ελέγχουν δηλαδή αυτούς που σκανδαλίζουν τους πιστούς, θα γίνη μεγαλύτερο κακό. Έτσι θα τονωθούν λίγο οι πιστοί, αλλά και θα εμποδισθούν λίγο όσοι πολεμούν την Εκκλησία. Η Εκκλησία δεν είναι δικό τους καΐκι, να κάνουν βόλτες· είναι το σκάφος του Χριστού. Αυτοί είναι κατακριτέοι. Το μόνο που τους ενδιαφέρει είναι να έχουν μεγάλο μισθό, πολυτελές αυτοκίνητο, να τρέχουν στις διασκεδάσεις... Και ύστερα κάνουν νόμο να παντρεύωνται με πολιτικό γάμο, νομιμοποιούν τις αμβλώσεις... Τί θα κάνη ο Θεός, άλλο θέμα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και με τις βλάσφημες ταινίες που παρουσιάζουν, θέλουν να γελοιοποιήσουν τον Χριστό. Το κάνουν, για να πούν «αυτός ήταν ο Χριστός, τώρα θα έρθη ο Μεσσίας», και να παρουσιάσουν μετά τον «Μεσσία» τους. Εκεί το πάνε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι άνθρωποι, Γέροντα, τα πιστεύουν και βλάπτονται!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο βλαμμένος βλάπτεται. Τα πιστεύει, γιατί θέλει να δικαιολογήση τα αδικαιολόγητα και να αναπαύση τον λογισμό του. Με όλα αυτά τα βλάσφημα πάνε να δικαιολογήσουν ηθικές αταξίες. Το έχουν παρακάνει. Είχαν κάνει μήνυση ότι η ταινία «Ο τελευταίος πειρασμός»[15]προσβάλλει την θρησκεία και οι εισαγγελείς είπαν: «Δεν είναι τίποτε». Τέτοιες βλασφημίες δεν ακούσθηκαν ποτέ! Για μας η διαμαρτυρία για την βλάσφημη εκείνη ταινία ήταν ομολογία πίστεως. Βέβαια με όλα αυτά τα βλάσφημα γίνεται και ένα καλό· χωρίζει η ήρα από το σιτάρι, κοσκινίζεται ο κόσμος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Υπάρχουν, Γέροντα, κάποια θέματα για τα οποία πρέπει να αμύνεται κανείς, είτε ως άτομο είτε ως ομάδα, και κάποια για τα οποία δεν πρέπει; Π.χ. εσείς, όταν σάς είπαν ότι είστε αιρετικός, απαντήσατε, ενώ σ᾿ άλλες κατηγορίες σιωπήσατε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό το λένε οι Άγιοι Πατέρες[16], δεν είναι ότι το λέω εγώ. Οποιαδήποτε άλλη κατηγορία με βοηθάει στην πνευματική ζωή, ενώ το «αιρετικός» με χωρίζει από τον Χριστό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κοιμίζουν τον κόσμο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα βοηθηθούν οι άνθρωποι με τόσα που γίνονται στον κόσμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εκείνος που θέλει να βοηθηθή, βοηθιέται με τιποτένια πράγματα. Π.χ. κουνιέται ένα κανδήλι ή κουνιέται ο ίδιος ολόκληρος με έναν σεισμό και συνέρχεται. Όσοι δεν πιστεύουν, γίνονται χειρότεροι, όταν ακούν ότι θα γίνη πόλεμος ή κάποια καταστροφή. «Δώσ᾿ του, σού λέει, να γλεντήσουμε, γιατί χάνουμε την ζωή», οπότε το ρίχνουν τελείως έξω. Άλλοτε ακόμη και οι αδιάφοροι, όταν άκουγαν λ.χ. ότι θα γίνη πόλεμος, συνέρχονταν και άλλαζαν ζωή. Τώρα είναι πολύ λίγοι αυτοί. Παλιά το έθνος μας ζούσε πνευματικά, γι᾿ αυτό και ο Θεός το ευλογούσε και οι Άγιοι μας βοηθούσαν με θαυμαστό τρόπο, και νικούσαμε τους εχθρούς μας, οι οποίοι πάντοτε ήταν περισσότεροι από εμάς. Σήμερα λέμε πώς είμαστε Ορθόδοξοι, αλλά δυστυχώς συχνά μόνον το όνομα «Ορθόδοξος» έχουμε και όχι ζωή ορθόδοξη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ρώτησα έναν Πνευματικό με κοινωνική δράση, με ένα σωρό πνευματικοπαίδια κ.λπ.: «Τί ξέρεις για μια βλάσφημη ταινία;». «Δεν ξέρω τίποτε», μου είπε. Δεν ήξερε τίποτε και είναι σε μεγάλη πόλη. Κοιμίζουν τον κόσμο. Τον αφήνουν έτσι, για να μη στενοχωριέται και να διασκεδάζη. Μήν τυχόν πής ότι θα γίνη πόλεμος ή ότι θα γίνη η Δευτέρα Παρουσία και γι'' αυτό πρέπει να ετοιμασθούμε, μην τυχόν στενοχωρηθούν οι άνθρωποι. Σαν μερικές γριές που λένε «μή μιλάς για θάνατο· μόνο για χαρές και για βαφτίσια να μιλάς», σαν να μην τις περιμένη θάνατος. Έτσι νιώθουν μια ψεύτικη χαρά. Ενώ, αν σκέφτονταν ότι το τάδε γεροντάκι που έμενε λίγο πιο κάτω πέθανε χθές, ο άλλος είναι στα τελευταία του και θα πεθάνη, μεθαύριο θα γίνη του τάδε το μνημόσυνο που ήταν και πολύ νεώτερος από αυτές, θα σκέφτονταν τον θάνατο και θα έλεγαν: «Πρέπει να εξομολογηθώ, να ετοιμασθώ πνευματικά, γιατί μπορεί κι εμένα σε λίγο να με καλέση ο Χριστός για την άλλη ζωή». Διαφορετικά, έρχεται ύστερα ο θάνατος και τις παίρνει ανέτοιμες. Άλλοι πάλι από... «καλωσύνη» λένε: «Στους αιρετικούς μη λέτε ότι είναι στην πλάνη, για να δείξουμε αγάπη». Και έτσι τα ισοπεδώνουν όλα. Αν ζούσαν αυτοί στα πρώτα χρόνια του Χριστιανισμού, δεν θα είχαμε ούτε έναν Άγιο. Έλεγαν τότε στους Χριστιανούς: «Ρίξε μόνο λιβάνι στην φωτιά και μην αρνήσαι τον Χριστό». Δεν το δέχονταν. «Κάνε μόνον πώς ρίχνεις». Δεν το δέχονταν. «Μη μιλάς για τον Χριστό και πήγαινε ελεύθερος σε άλλο μέρος», και δεν το δέχονταν. Σήμερα βλέπεις έναν νερόβραστο κόσμο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν λέη ο Απόστολος Παύλος «Ο καρπός του Πνεύματός εστιν αγάπη, χαρά»[17], εννοεί ότι η χαρά είναι τεκμήριο σωστής ζωής;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, γιατί υπάρχει κοσμική χαρά και θεϊκή χαρά. Όταν κάτι δεν είναι πνευματικό, καθαρό, δεν μπορεί να υπάρχη αληθινή χαρά και ειρήνη στην καρδιά. Η χαρά που αισθάνεται ένας πνευματικός άνθρωπος δεν είναι η κοσμική χαρά που επιζητούν πολλοί σήμερα. Να μην τα μπλέκουμε τα πράγματα. Οι Άγιοι είχαν τέτοιου είδους χαρά που ζητάμε εμείς; Η Παναγία είχε τέτοια χαρά; Ο Χριστός γελούσε; Ποιός Άγιος πέρασε από αυτήν την ζωή χωρίς πόνο; Ποιός Άγιος είχε τέτοια χαρά που επιδιώκουν πολλοί Χριστιανοί της εποχής μας, που δεν θέλουν να ακούσουν τίποτε δυσάρεστο, για να μη στενοχωρηθούν, να μη χάσουν την ηρεμία τους; Αν θέλω να μη στενοχωρηθώ, για να είμαι χαρούμενος, να μη χαλάσω την ησυχία μου, για να είμαι πράος, τότε είμαι αδιάφορος! Άλλο πραότητα πνευματική και άλλο πραότητα από αδιαφορία. Λένε μερικοί: «Πρέπει να είμαι χαρούμενος, γιατί είμαι Χριστιανός. Να είμαι ήρεμος, γιατί είμαι Χριστιανός». Αυτοί δεν είναι Χριστιανοί. Το καταλάβατε; Αυτό είναι αδιαφορία, είναι κοσμική χαρά. Όποιος έχει αυτά τα κοσμικά στοιχεία, δεν είναι πνευματικός άνθρωπος. Ο πνευματικός άνθρωπος είναι όλος ένας πόνος. Πονάει δηλαδή για καταστάσεις, για ανθρώπους, αλλά ανταμείβεται γι᾿ αυτόν τον πόνο με θεία παρηγοριά. Νιώθει πόνο, αλλά νιώθει μέσα του θεία παρηγοριά, γιατί κάνει ρίψεις με ευλογίες ο Θεός από τον Παράδεισο στην ψυχή και αγάλλεται ο άνθρωπος από την θεϊκή αγάπη. Αυτή είναι η χαρά, η πνευματική χαρά, που δεν εκφράζεται και πλημμυρίζει την καρδιά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το παράδειγμα μιλάει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι άνθρωποι που ζουν πνευματικά στον κόσμο πρέπει να δείχνουν στους κοσμικούς ότι νηστεύουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν πρόκειται για διατεταγμένες νηστείες της Εκκλησίας μας, Τετάρτη, Παρασκευή, Σαρακοστές κ.λπ., τότε πρέπει, γιατί αυτό είναι ομολογία πίστεως. Οι άλλες όμως νηστείες, δηλαδή αυτές που γίνονται από άσκηση, για την αγάπη του Χριστού ή για να εισακουσθή η προσευχή μας σε ένα αίτημά μας, πρέπει να γίνωνται κρυφά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σκοπός είναι να ζούμε ορθόδοξα, όχι απλώς να μιλούμε ή να γράφουμε ορθόδοξα. Γι᾿ αυτό, βλέπεις, ένα κήρυγμα δεν πληροφορεί, δεν αλλοιώνει τον άλλον, όσο καλό και αν είναι, αν ο ιεροκήρυκας δεν έχη βίωμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άν, Γέροντα, ο ακροατής ή ο αναγνώστης έχη καλή διάθεση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, τότε αυτός έχει ήδη την θεία Χάρη, γι᾿ αυτό και ωφελείται. Ένας όμως που δεν έχει καλή διάθεση θα πάρη και θα εξετάση αυτά που λέει ο ιεροκήρυκας και δεν θα έχη καμμιά ωφέλεια. Το να σκεφτώμαστε ορθόδοξα είναι εύκολο· το να ζούμε όμως ορθόδοξα θέλει κόπο. Μια φορά ένας θεολόγος είχε κάνει μια ομιλία και είχε πει να πάνε να δώσουν αίμα, γιατί υπήρχε ανάγκη. Και πράγματι πολλοί παρακινήθηκαν και έδωσαν πολύ αίμα. Εκείνος όμως δεν έδωσε ούτε μια σταγόνα, αν και είχε... μπόλικο. Οι άλλοι τότε σκανδαλίσθηκαν. «Εγώ, τους είπε εκείνος, με την ομιλία που έκανα και παρεκίνησα τον κόσμο να δώση αίμα, είναι σαν να έδωσα το περισσότερο αίμα»! Έτσι ανέπαυε τον λογισμό του. Καλύτερα ήταν να μην έκανε την ομιλία και αθόρυβα να πήγαινε να δώση λίγο αίμα. Η ζωή μετράει. «Εγώ είμαι δεξιός», μου είπε ένας που δεν είχε καμμιά σχέση με την Εκκλησία. «Άμα δεν κάνης σταυρό, τί ωφελεί; του είπα. Το χέρι που δεν κάνει σταυρό τί ωφελεί που είναι δεξί; Σε τί διαφέρει από το αριστερό που δεν κάνει σταυρό; Εκείνο έτσι και αλλιώς δεν κάνει σταυρό». Αν εσύ είσαι δεξιός και δεν κάνης σταυρό, σε τί διαφέρεις από τους αριστερούς; Ο σκοπός είναι να είσαι άνθρωπος πνευματικός, να ζής κοντά στον Χριστό, τότε βοηθάς και τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ο άνθρωπος έχη ζωή σωστή, το έργο του πληροφορεί. Σε μια πόλη ήταν ένας Προτεστάντης που όλους τους κατηγορούσε· τί κληρικούς, τί δεσποτάδες. Εκεί κοντά σε ένα μοναστήρι ασκήτευε και ένας μοναχός. Μια φορά ρώτησε τον Προτεστάντη ένας άθεος: «Καλά, όλους τους δεσποτάδες, τους παπάδες τους κατηγορείς. Γι᾿ αυτόν τον καλόγηρο τί έχεις να πής;». «Αυτόν τον παραδέχομαι, του λέει, γιατί διαφέρει από τους άλλους». Ένας πιστός, όπου και αν είναι, πόσο βοηθάει, όταν ζη σωστά! Θυμάμαι, ένας γνωστός μου αστυνομικός υπηρετούσε στα σύνορα. Εκεί ήταν και Σέρβοι κομμουνιστές, και μάλιστα από τους πιο άθεους, τους πιο έμπιστους του κόμματος. Όταν έρχονταν Σέρβοι παπάδες στα σύνορα Ελλάδος και Σερβίας, ο αστυνομικός τους φιλούσε το χέρι. Οι κομμουνιστές το πρόσεξαν. Έλληνας αστυνομικός να φιλάη το χέρι των Σέρβων παπάδων! Έκανε μεγάλη εντύπωση στους κομμουνιστές και προβληματίσθηκαν στο θέμα της πίστεως.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσο βοηθούν αυτοί που έχουν μια θέση, όταν κρατάνε λίγο! Γι᾿ αυτό και εγώ κοιτάω μερικούς μεγάλους να τους δώ, όταν έρχωνται, για να τους βοηθήσω, γιατί αυτοί μπορεί να βοηθήσουν πολύ θετικά με το παράδειγμα. Νά, ένας στρατάρχης που γνωρίζω, είναι παράδειγμα. Και ό,τι κάνει, το κάνει από μέσα του, με την καρδιά του· δεν το κάνει εξωτερικά. Οι άλλοι που τον βλέπουν προβληματίζονται και βοηθιούνται. Παλιά και οι άρχοντες του τόπου είχαν αρχές, πίστευαν. Ξέρετε τί είχε πει μια αρχόντισσα σε κάποιον βουλευτή σε μια πόλη; Είχε πάει με τον σύζυγό της την περίοδο της νηστείας του Δεκαπενταυγούστου σε ένα γεύμα και είχαν εκεί ψάρια, κρέατα... Αυτή δεν έτρωγε, γιατί νήστευε. Το πρόσεξε ο βουλευτής και της είπε: «Ασθενείς και οδοιπόροι νηστεία δεν κρατούν». «Ναί, οδοιπόροι με ρόδες!», του απάντησε εκείνη και δεν άγγιξε τίποτε από τα αρτύσιμα. Στο γεύμα εν τω μεταξύ ήταν και ένας κληρικός που τους προσφώνησε: «Μεγάλη μου τιμή που βρίσκομαι μαζί σας κ.λπ.», έλεγε–έλεγε ένα σωρό εγκώμια. Οπότε τον διέκοψε ο άνδρας της αρχόντισσας και του είπε: «Μη πεποίθατε επ᾿ άρχοντας, επί υιούς ανθρώπων, οίς ουκ έστι σωτηρία!»[18]. Γιατί εκείνος πήγε να τους κολακεύση. Άλλοτε πάλι είχε πει αυτή η αρχόντισσα σε έναν καθηγητή Πανεπιστημίου της Θεολογίας: «Μήν κοιτάτε λεπτομέρειες και κόβετε στις εξετάσεις τους παπάδες. Κοιτάξτε να τους περνάτε, γιατί οι επαρχίες δεν έχουν παπά!». Θέλω να πω ότι παλιά οι τοπικοί άρχοντες ενδιαφέρονταν για την Εκκλησία, ήταν παράδειγμα για τον λαό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αυτό που θα βοηθήση θετικά τους ανθρώπους σήμερα είναι το παράδειγμά μας το χριστιανικό και η ζωή μας η χριστιανική. Τους Χριστιανούς πρέπει να τους διακρίνη η πνευματική λεβεντιά και η αρχοντιά, η θυσία. Γι'' αυτό λέω στους λαϊκούς: «Να αγαπάτε τον Χριστό, να έχετε ταπείνωση, να κάνετε το καθήκον σας, και ο Χριστός θα προδώση την αρετή σας στα μάτια των ανθρώπων». Η αρετή έχει τυπικό να προδίδη τον άνθρωπο, όπου κι αν βρίσκεται αυτός. Ακόμη και να κρυφθή, και να υποκριθή με την δια Χριστόν σαλότητα, η αρετή θα τον προδώση, έστω και αργότερα, και ο αποθηκευμένος του θησαυρός, που θα ανακαλυφθή τότε μαζεμένος, θα βοηθήση πάλι πολλές ψυχές· ίσως τότε περισσότερο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός μας υπομένει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα ο Θεός ανέχεται την κατάσταση. Ανέχεται, ανέχεται, για να είναι αναπολόγητος ο κακός. Είναι περιπτώσεις που ο Θεός επεμβαίνει άμεσα και αμέσως, ενώ σε άλλες περιπτώσεις περιμένει· δεν δίνει αμέσως την λύση και περιμένει την υπομονή των ανθρώπων, την προσευχή, τον αγώνα. Τί αρχοντιά έχει ο Θεός! Ένας πόσους είχε σφάξει τότε με τον πόλεμο και ακόμη ζή. Θα του πη στην άλλη ζωή ο Θεός: «Σ́ άφησα να ζήσης περισσότερο και από τους καλούς». Δεν θα έχη ελαφρυντικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί τέτοιοι άνθρωποι, ενώ είναι βαριά άρρωστοι, πώς δεν πεθαίνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φαίνεται έχουν βαρειές αμαρτίες, γι᾿ αυτό δεν πεθαίνουν. Περιμένει ο Θεός μήπως μετανοήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τον κόσμο που παιδεύουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτοί που παιδεύονται και δεν φταίνε, αποταμιεύουν. Αυτοί που φταίνε, εξοφλούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θα πη «Πονηροί άνθρωποι και γόητες προκόψουσιν επί το χείρον, πλανώντες και πλανώμενοι»[19];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε· υπάρχουν άνθρωποι που έχουν κάποιον εγωισμό και ο Θεός τους δίνει ένα σκαμπίλι να πάνε παρακάτω. Άλλοι έχουν λίγο παραπάνω εγωισμό και ο Θεός τους δίνει ένα σκαμπίλι και πάνε ακόμη παρακάτω. Αυτούς όμως που έχουν εωσφορική υπερηφάνεια, ο Θεός τους αφήνει. Μπορεί να φαίνεται ότι κάνουν προκοπή, αλλά τί προκοπή είναι αυτή; Μαύρη προκοπή. Και μετά δεν πέφτουν απλώς κάτω, αλλά πέφτουν κατ' ευθείαν στο βάραθρο. Ο Θεός να φυλάη!
- type: h2
  initial:
    ru: ''
  text:
    ru: Η υπεράσπιση του δικαίου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, λέει σε ένα τροπάριο: «Θυμόν κινήσαντες τον δικαιότατον»[20]. Ποιός θυμός είναι δικαιότατος;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν αδικούνται άλλοι και φωνάζη κανείς και θυμώνη από πόνο πραγματικό, τότε είναι «δικαιότατος ο θυμός». Όταν αδικήται ο ίδιος και θυμώνη, τότε δεν είναι καθαρός ο θυμός. Όταν βλέπης έναν να υποφέρη για ιερά πράγματα, αυτός έχει θείο ζήλο. Από αυτό μπορείς να καταλάβης και τον δια Χριστόν σαλό. Αν πάρης λ.χ. μια εικόνα και την βάλης μπροστά του ανάποδα, θα τιναχθή επάνω ο δια Χριστόν σαλός· έτσι του κάνεις τέστ. Υπάρχει δηλαδή και δικαία, θεία αγανάκτηση, και μόνον αυτή η αγανάκτηση δικαιολογείται στον άνθρωπο. Ο Μωυσής, όταν είδε τον λαό να θυσιάζη στο χρυσό μοσχάρι, αγανάκτησε και πέταξε κάτω τις πλάκες με τις εντολές που του έδωσε ο Θεός, και έσπασαν[21]. Ο Φινεές, ο εγγονός του αρχιερέα Ααρών, δύο φόνους έκανε και ο Θεός έδωσε εντολή από την γενιά του να βγαίνουν οι ιερείς του Ισραήλ! Όταν είδε τον Ισραηλίτη Ζαμβρί να αμαρτάνη με την Μαδιανίτιδα Χασβί μπροστά στον Μωυσή και σε όλους τους Ισραηλίτες, δεν κρατήθηκε· σηκώθηκε από την συναγωγή και τους φόνευσε, και έτσι σταμάτησε η οργή του Θεού. Αν δεν τους σκότωνε και τους δύο, θα έπεφτε οργή Θεού σε όλον τον λαό του Ισραήλ[22]. Φοβερό! Εγώ, όταν διαβάζω στο Ψαλτήρι τον στίχο «Και έστη Φινεές και εξιλάσατο, και εκόπασεν η θραύσις»[23], ασπάζομαι πολλές φορές το όνομά του. Αλλά και ο Χριστός, όταν είδε να πουλούν μέσα στον περίβολο του Ναού βόδια, πρόβατα, περιστέρια, και τους κερματιστές να ανταλλάσσουν χρήματα, πήρε το φραγγέλιο και τους έδιωξε[24].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ένας πνευματικός άνθρωπος, όταν πάη με αγανάκτηση να υπερασπίση τον εαυτό του για ένα ατομικό του θέμα, αυτό είναι καθαρά εγωιστικό, είναι ενέργεια του πειρασμού. Δέχεται επιδράσεις δαιμονικές εξωτερικές. Αν κάποιον τον αδικούν ή τον κοροϊδεύουν, αυτόν πρέπει οι άλλοι να τον υπερασπίζωνται, για το δίκιο, όχι για προσωπικό τους συμφέρον. Δεν ταιριάζει να μαλώνης για τον εαυτό σου. Άλλο το να αντιδράσης, για να υπερασπισθής σοβαρά πνευματικά θέματα, θέματα που αφορούν την πίστη μας, την Ορθοδοξία. Αυτό είναι καθήκον σου. Όταν σκέφτεσαι τους άλλους και αντιδράς, για να τους βοηθήσης, τότε αυτό είναι καθαρό, γιατί γίνεται από αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν πήγα στο Σινά, κατέβαινα στο μοναστήρι κάθε εβδομάδα, κάθε δεκαπέντε μέρες, για να κοινωνήσω. Μια φορά μου λέει ένας πολύ απλός δικαίος[25]που ήταν εκεί: «Ά, όχι κάθε εβδομάδα· τέσσερις φορές τον χρόνο πρέπει να κοινωνούν οι καλόγεροι». Τότε είχαν τυπικό να μην κοινωνούν συχνά. Φορούσα και το επανωκαλύμμαυχο. «Ούτε επανωκαλύμμαυχο», λέει. Αυτοί το έβαζαν μόνο στις τελετές. «Νάναι ευλογημένο», λέω. Και το είχα και εγώ ριγμένο στον ώμο σαν κασκόλ και δεν με απασχόλησε ξανά. Τί; να μαλώσω; Ετοιμαζόμουν εν τω μεταξύ κάθε φορά για την Θεία Κοινωνία και πήγαινα στην Εκκλησία. Την ώρα που ο παπάς έλεγε «Μετά φόβου Θεού...», έσκυβα το κεφάλι και έλεγα «Εσύ γνωρίζεις, Χριστέ μου, πόση ανάγκη έχω», και ένιωθα τέτοια αλλοίωση, που δεν ξέρω αν θα την ένιωθα, αν κοινωνούσα. Αφού πέρασαν κάμποσοι μήνες, ήρθαν στο μοναστήρι τέσσερα–πέντε παιδιά, που από μένα παρακινήθηκαν να έρθουν στο Σινά. Είπαν λοιπόν και σ᾿ αυτά να μην κοινωνούν. Έ, τότε μίλησα και τακτοποιήθηκε το θέμα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αντιμετώπιση υβριστών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στην Αγία Γραφή λέει ότι η βλασφημία κατά του Αγίου Πνεύματος δεν συγχωρείται[26]. Ποιά είναι η βλασφημία αυτή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Βλασφημία κατά του Αγίου Πνεύματος γενικά είναι η περιφρόνηση στα θεία, όταν ο άνθρωπος έχη, εννοείται, τα λογικά του. Τότε είναι και ένοχος. Π.χ. έναν που μου είπε «άντε κι εσύ και οι θεοί σου...», του έδωσα μια σπρωξιά και τον τίναξα πέρα, γιατί αυτό ήταν βλασφημία. Ή περνάνε δύο έξω από μία Εκκλησία. Ο ένας κάνει τον σταυρό του και λέει και στον άλλο «κάνε, ευλογημένε, κι εσύ τον σταυρό σου...» και αυτός αντιδρά: «Άντε κι εσύ που θα κάνω τον σταυρό μου!». Αυτή η περιφρόνηση είναι βλασφημία. Αδύνατον επομένως σε έναν ευλαβή άνθρωπο να υπάρχη βλασφημία. Αλλά και η αναίδεια είναι βλασφημία κατά του Αγίου Πνεύματος. Ο αναιδής διαστρέφει ή καταπατάει λ.χ. μια ευαγγελική αλήθεια, για να δικαιολογήση την πτώση του. Δεν σέβεται την αλήθεια, την πραγματικότητα, αλλά την τσαλακώνει εν γνώσει του· τσαλαπατάει ένα ιερό πράγμα. Και αυτό σιγά-σιγά γίνεται πλέον κατάσταση. Στην συνέχεια απομακρύνεται η Χάρις του Θεού και ο άνθρωπος δέχεται επιδράσεις δαιμονικές. Και αν δεν μετανοήση, τί εξέλιξη θα έχη... Θεός φυλάξοι! Όταν όμως ένας θυμώση και βλασφημήση ακόμη και το Άγιο Πνεύμα, αυτή η βλασφημία δεν είναι ασυγχώρητη, γιατί ο άνθρωπος δεν πιστεύει την βρισιά που είπε, αλλά την είπε, επειδή εκείνη την στιγμή, πάνω στον θυμό του, έχασε τον έλεγχο του εαυτού του, και αμέσως μετανοιώνει. Ο αναιδής όμως δικαιολογεί το ψέμα, για να δικαιολογήση την πτώση του. Όποιος δικαιολογεί την πτώση του, δικαιολογεί τον διάβολο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς δικαιολογεί την πτώση του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να θυμηθή κάτι που λέχθηκε πριν από δέκα χρόνια για άλλη περίπτωση και να το παρουσιάση σαν παράδειγμα, για να δικαιολογήση τον εαυτό του. Ούτε ο διάβολος, ο μεγαλύτερος δικηγόρος, δεν θα μπορούσε να σκεφθή κάτι τέτοιο εκείνη την ώρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς νιώθει αυτός ο άνθρωπος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς νιώθει; Δεν έχει ανάπαυση ποτέ. Εδώ και δίκαιο να έχη κανείς, όταν πάη να δικαιώση τον εαυτό του, πάλι ανάπαυση δεν έχει, πόσο μάλλον να μην έχη δίκαιο και να δικαιολογή την πτώση του με αναιδέστατο τρόπο. Γι' αυτό, όσο μπορούμε, να προσέχουμε την αναίδεια και την περιφρόνηση όχι μόνον προς τα θεία αλλά και προς τον πλησίον μας, διότι είναι εικόνα Θεού. Οι αναιδείς άνθρωποι βρίσκονται στο πρώτο στάδιο της βλασφημίας κατά του Αγίου Πνεύματος. Εκείνοι που περιφρονούν τα θεία βρίσκονται στο δεύτερο, και στο τρίτο βρίσκεται ο διάβολος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μιλούν κατά της Εκκλησίας ή κατά του Μοναχισμού κ.λπ., τί πρέπει να κάνη κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κατ᾿ αρχάς, αν κάποιος μιλάη άσχημα λ.χ. για σένα ως άτομο, δεν πειράζει. Να σκεφθής: «Τον Χριστό, που ήταν Χριστός, Τον έβριζαν, και δεν μιλούσε· εμένα που είμαι αμαρτωλός τί μου αξίζει;». Αν έρχονταν να βρίσουν εμένα ως άτομο, δεν θα με πείραζε καθόλου. Αλλά, όταν με βρίζουν ως μοναχό, βρίζουν και όλο τον θεσμό του Μοναχισμού, γιατί ως μοναχός δεν είμαι ανεξάρτητος, και πρέπει να μιλήσω. Σε τέτοιες περιπτώσεις πρέπει κανείς να τους αφήση λίγο να ξεσπάσουν και ύστερα να τους πη δυο κουβέντες. Κάποτε στο λεωφορείο μια γυναίκα έβριζε τους παπάδες. Την άφησα να ξεσπάση καί, όταν σταμάτησε, της είπα: «Έχουμε απαιτήσεις από τους παπάδες, αλλά και αυτούς δεν τους έρριξε ο Θεός με τα αλεξίπτωτα. Είναι άνθρωποι και έχουν ανθρώπινες αδυναμίες. Μπορείς όμως να μου πής, μια μητέρα σαν εσένα βαμμένη, με κάτι νύχια σαν το γεράκι, τί παιδί θα γεννήση και πώς θα το αναθρέψη; Και παπάς και καλόγερος να γίνη, πώς θα είναι;». Θυμάμαι, μια άλλη φορά, όταν ταξίδευα με το λεωφορείο από την Αθήνα για τα Γιάννενα, ήταν ένας που δεν σταμάτησε σε όλο τον δρόμο να κατηγορή έναν μητροπολίτη που είχε δημιουργήσει τότε κάτι προβλήματα. Του είπα κανα–δυό κουβέντες και μετά έκανα ευχή. Εκείνος συνέχιζε. Όταν φθάσαμε στα Γιάννενα και κατεβήκαμε, τον πήρα λίγο παράμερα και του λέω: «Με γνωρίζεις ποιός είμαι;». «Όχι», μου λέει. «Πώς τότε κάθεσαι και λές τέτοια πράγματα; Εγώ μπορεί να είμαι πολύ χειρότερος από τον τάδε που βρίζεις, μπορεί όμως να είμαι και ένας άγιος. Πώς κάθεσαι εσύ και λές μπροστά μου πράγματα που δεν μπορώ να φαντασθώ ότι τα κάνουν ούτε και οι κοσμικοί άνθρωποι; Κοίταξε να διορθωθής, γιατί θα φάς σκαμπίλι δυνατό από τον Θεό – για το καλό σου φυσικά». Τον είδα μετά, άρχισε να τρέμη. Αλλά και οι άλλοι κατάλαβαν, όπως είδα από μια αναταραχή που δημιουργήθηκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπεις να βρίζουν τα άγια και ο άλλος δεν λέει τίποτε. Σ᾿ αυτήν την περίπτωση η πραότητα είναι δαιμονική. Μια φορά που έβγαινα από το Άγιον Όρος, συνάντησα στο καράβι και έναν που είχε φύγει ο καημένος  από το Ψυχιατρείο και είχε έρθει στο Όρος. Φώναζε και έβριζε συνέχεια όλους τους μεγάλους, τους κυβερνήτες, τους γιατρούς... «Τόσα χρόνια, έλεγε, με τάραξαν στα ηλεκτροσόκ και στα χάπια. Εσείς περνάτε καλά. Έχετε την καλοπέρασή σας, τα αυτοκίνητά σας. Εμένα από δώδεκα χρονών η μάνα μου μ' έστειλε σ́ ένα νησί. Είκοσι πέντε χρόνια γυρίζω από τρελλοκομείο σε τρελλοκομείο». Έβριζε όλα τα κόμματα και μετά άρχισε να βρίζη Χριστό και Παναγία. Σηκώνομαι επάνω, «πάψε, του λέω· δεν υπάρχει καμμιά αρχή εδώ μέσα;». Θίχθηκε, φαίνεται, ο συνοδός του – πρέπει να ήταν χωροφύλακας – και τον σύμμασε λίγο. Είχε πει όλο το πρόβλημά του φωνάζοντας και βρίζοντας. Τον πόνεσα. Μετά ήρθε, μου φίλησε το χέρι. Τον φίλησα. Είχε δίκαιο. Όλοι λίγο-πολύ έχουμε το μερίδιό μας. Ήμουν και εγώ αιτία που έβριζε ο καημένος. Αν είχα πνευματική κατάσταση, θα τον είχα κάνει καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσο είχαν απογοητευθή οι Φαρασιώτες, τότε με την Ανταλλαγή, όταν έρχονταν με το καράβι στην Ελλάδα! Δυο ναύτες μάλωναν και έβριζαν τον Χριστό και την Παναγία. Τους φάνηκε πολύ βαρύ! Σού λέει: «Έλληνες, Χριστιανοί, να βρίζουν τον Χριστό και την Παναγία!». Τους άρπαξαν και τους πέταξαν στην θάλασσα. Ευτυχώς ήξεραν κολύμπι και γλύτωσαν. Ακόμη και όταν βρίζουν κάποιον άνθρωπο, πρέπει να τον υπερασπίσουμε, πόσο μάλλον τον Χριστό! Ήρθε ένα παιδί στο Καλύβι που κούτσαινε, αλλά λαμποκοπούσε το προσωπάκι του. Λέω: «Κάτι γίνεται εδώ, για να λάμπη έτσι η θεία Χάρις!». Τον ρώτησα «τί κάνεις κ.λπ.» και μου είπε τί συνέβη. Κάποιος, ένα θηρίο μέχρι εκεί πάνω, έβριζε τον Χριστό και την Παναγία και το παιδί όρμησε επάνω του, για να σταματήση. Εκείνος το έβαλε κάτω, το τσαλαπάτησε, του σακάτεψε τα πόδια, και μετά το καημένο κούτσαινε. Ομολογητής! Τί τράβηξαν οι Ομολογητές, οι Μάρτυρες!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί ευλαβείς νέοι δυσκολεύονται στον στρατό με αυτούς που βρίζουν. Τί να κάνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Θέλει διάκριση και υπομονή. Ο Θεός θα βοηθήση. Ο ασυρματιστής που υπηρετούσαμε μαζί στον στρατό ήταν ένας γιατρός άπιστος, βλάσφημος. Κάθε μέρα ερχόταν   στην μονάδα Διοικήσεως, να μου κάνη πλύση εγκεφάλου! Μου έλεγε την θεωρία του Δαρβίνου κ.λπ., κάτι πράγματα χαμένα, βλάσφημα τελείως. Μετά όμως από κάποιο περιστατικό κατάλαβε μερικά πράγματα. Μια φορά ήμασταν σε μια επιχείρηση και είχαμε φορτωμένα σε ένα μεγάλο μουλάρι τον ασύρματο και το φορείο. Σε έναν κατήφορο, επειδή γλιστρούσε πολύ, εγώ έπιανα από την ουρά το ζώο και ο γιατρός τραβούσε το καπίστρι. Σε μια στιγμή, πώς άγγιξε το φορείο λίγο τα αυτιά του ζώου, και δίνει μια το ζώο και με χτυπάει δυνατά με τα πισινά του πόδια· με πέταξε πέρα. Σε λίγο συνήλθα και είδα ότι περπατούσα! Το μόνο που θυμόμουν ήταν ότι φώναξα «Παναγία μου!». Τίποτε άλλο. Τα σημάδια από τα πέταλα του ζώου ήταν πάνω μου. Εδώ το στήθος ήταν όλο μαύρο. Με τόση δύναμη με χτύπησε το ζώο! Τα έχασε ο γιατρός που με είδε να περπατώ! Συνεχίσαμε τον δρόμο μας. Λίγο πιο πέρα στραβοπάτησε ο γιατρός σε μια πέτρα, έπεσε κάτω και δεν μπορούσε να σηκωθή να περπατήση. Άρχισε να φωνάζη: «Παναγία μου, Χριστέ μου»! Σού λέει: «Τώρα όλοι θα με εγκαταλείψουν· πάει, τί θα γίνω; Ποιός θα με βοηθήση;». Φοβόταν μην τον πιάσουν. «Μη στενοχωριέσαι, του λέω, θα καθήσω μαζί σου. Αν πιάσουν εμένα, θα πιάσουν κι εσένα». Ο καημένος μετά σκέφθηκε: «Ο Αρσένιος[27], ενώ τον πέταξε πέρα το ζώο, δεν έπαθε τίποτε, και εγώ λίγο στραβοπάτησα και δεν μπορώ να περπατήσω!». Σε λίγο σηκώθηκε, αλλά κούτσαινε και τον κρατούσα, για να περπατήση. Οι άλλοι είχαν προχωρήσει. Πήρε ένα μάθημα και συνήλθε μετά. Κάθε μέρα έλεγε κάτι βλασφημίες, και τότε, πάνω στον κίνδυνο, φώναζε «Παναγία μου! Παναγία μου!». Τον βόλεψε η Παναγία! Ένας άλλος, μοτοσυκλετιστής ήταν στον στρατό, δύο φορές είχε σπάσει το πόδι του και πάλι συνέχιζε να βρίζη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν του λέγατε τίποτε, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να του πώ; Εδώ δεν του έλεγα τίποτε και εκείνος έβριζε συνεχώς τον Χριστό και την Παναγία επίτηδες, για να με στενοχωρή. Μετά το κατάλαβα και έκανα μόνον ευχή. Και να δήτε, ενώ πρώτα έβριζαν και αυτός και οι άλλοι στα καλά καθούμενα, ύστερα, όταν δυσκολεύονταν σε κάτι και πήγαιναν να βρίσουν, δάγκωναν την γλώσσα τους! Είναι καλύτερα, αν ένας βρίζη, βλασφημάη κ.λπ. και είναι αναιδής, να κάνης ότι είσαι απασχολημένος και δεν ακούς και να λές την ευχή. Γιατί αν καταλάβη ότι τον παρακολουθείς, μπορεί να βρίζη συνέχεια, και έτσι γίνεσαι αιτία να δαιμονισθή. Όταν όμως δεν είναι αναιδής αλλά ευσυνείδητος, και βρίζη από κακή συνήθεια, μπορείς κάτι να του πής. Αν πάλι είναι ευσυνείδητος, αλλά έχη πολύ εγωισμό, πρέπει να προσέξης να μην του μιλήσης αυστηρά αλλά ταπεινά, όσο μπορείς, και με πόνο. Τί λέει ο Αββάς Ισαάκ; «Έλεγξον δια της δυνάμεως των αρετών σου τους φιλονεικούντας μετά σού... και αποστόμωσον αυτούς δια της πραότητος και της γαλήνης των χειλέων σου. Έλεγξον τους μεν ακολάστους δια της εναρέτου συμπεριφοράς σου, τους δε αναισχύντους κατά τας αισθήσεις δια της συστολής των ομμάτων σου»[28].
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – «Πάντα καθαρά τοις καθαροίς»[29]
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο πνευματικός άνθρωπος είναι «πύρ καταναλίσκον»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί να ζήση σήμερα κανείς μέσα στην κοινωνία σωστά, χριστιανικά, χωρίς να σκανδαλίζεται από τους ανθρώπους που ζουν μακριά από τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί να σκανδαλίζεται από τους άλλους που δεν είναι κοντά στον Θεό; Εάν ήταν μέσα σε μια οικογένεια και είχε έξι-οκτώ αδέλφια και ένα-δύο από αυτά τα παρέσυρε ο σατανάς και ζούσαν αμαρτωλή ζωή, θα τον σκανδάλιζε η αμαρτωλή ζωή τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, θα πονούσε, γιατί θα ήταν αδέλφια του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, λοιπόν, το κακό βρίσκεται μέσα μας. Δεν έχουμε αγάπη, γι' αυτό δεν νιώθουμε όλους τους ανθρώπους αδελφούς μας και σκανδαλιζόμαστε από την ζωή τους. Όλοι είμαστε μια μεγάλη οικογένεια και είμαστε μεταξύ μας αδέλφια, γιατί όλοι οι άνθρωποι είναι παιδιά του Θεού. Εάν νιώσουμε πραγματικά ότι είμαστε αδέλφια με όλους τους ανθρώπους, θα πονούμε για όσους ζουν μέσα στην αμαρτία και δεν θα μας σκανδαλίζη η αμαρτωλή ζωή τους, αλλά θα προσευχώμαστε γι᾿ αυτούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άρα, αν σκανδαλιζώμαστε, το κακό βρίσκεται μέσα μας· δεν είναι έξω από μάς. Να λέμε στον εαυτό μας, όταν σκανδαλίζεται: «Εσύ πόσους σκανδαλίζεις; Για όνομα του Θεού, να μην ανέχεσαι τον αδελφό σου; Εσένα πώς σε ανέχεται ο Θεός με τόσα που κάνεις;». Σκεφθήτε τον Θεό, την Παναγία, τους Αγγέλους, που βλέπουν στην γη όλους τους ανθρώπους – σαν να βρίσκωνται σε ένα μπαλκόνι και βλέπουν στην πλατεία τους ανθρώπους που είναι συγκεντρωμένοι εκεί – άλλους να κλέβουν, άλλους να μαλώνουν, άλλους να αμαρτάνουν σαρκικά κ.λπ. Πώς τους ανέχονται! Πώς ανέχονται όλη την κακία και την αμαρτία που υπάρχει στον κόσμο και εμείς να μην ανεχώμαστε τον αδελφό μας! Είναι φοβερό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί σημαίνει αυτό που λέει ο Απόστολος Παύλος «Ο Θεός ημών πυρ καταναλίσκον»[30];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σε ένα καμίνι άμα πετάξης χαρτιά, σκουπίδια, τί θα γίνουν; Δεν θα καούν; Έτσι και στον πνευματικό άνθρωπο, ό,τι και αν του πετάξη ο πειρασμός, καίγεται. «Πύρ καταναλίσκον»! Όταν ανάψη στον άνθρωπο η θεία φλόγα, όλα καίγονται. Δεν κολλούν οι άσχημοι λογισμοί μετά. Δηλαδή δεν παύει ο διάβολος να του πετάη άσχημους λογισμούς, αλλά ο πνευματικός άνθρωπος είναι «πύρ» και τους καίει. Οπότε κουράζεται μετά ο διάβολος και σταματάει. Γι᾿ αυτό και ο Απόστολος Παύλος πάλι λέει: «Πάντα καθαρά τοις καθαροίς». Στους καθαρούς είναι όλα καθαρά· δεν υπάρχει τίποτε ακάθαρτο. Τους καθαρούς και μέσα στον βούρκο να τους ρίξης, θα παραμείνουν καθαροί σαν τις ακτίνες του ήλιου πού, όπου και αν πέσουν, παραμένουν φωτεινές και καθαρές.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο πνευματικός άνθρωπος από τον άγιο αλλοιώνεται με την καλή έννοια και από τον σαρκικό άνθρωπο δεν ερεθίζεται. Τον βλέπει, τον πονάει, αλλά δεν παθαίνει κακό. Ένας άνθρωπος σε μέση πνευματική κατάσταση από έναν πνευματικό άνθρωπο αλλοιώνεται προς το καλό· από έναν σαρκικό άνθρωπο αλλοιώνεται πάλι, αλλά προς το κακό. Ο σαρκικός άνθρωπος τον άγιο δεν τον καταλαβαίνει και από τον σαρκικό ερεθίζεται. Και ενώ ο δαιμονισμένος βλέπει τον άγιο και φεύγει, ο σαρκικός άνθρωπος πάει προς τον άγιο, για να τον πειράξη και να τον σκανδαλίση. Ένας που έχει φθάσει σε κατάσταση Σοδομιτών σκανδαλίζεται και από τους Αγγέλους ακόμη[31]. Ο ταπεινός άνθρωπος, ακόμη και άπειρος πνευματικά να είναι, διακρίνει τον Άγγελο του Θεού από τον δαίμονα, γιατί έχει πνευματική καθαρότητα και συγγενεύει με τον Άγγελο. Ενώ ο εγωιστής και σαρκικός, εκτός που πλανιέται εύκολα από τον πονηρό διάβολο, μεταδίδει και αυτός πονηριά και προκαλεί με την σαρκικότητά του και βλάπτει τις φιλάσθενες ψυχές με τα πνευματικά του μικρόβια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς φθάνει κανείς στην κατάσταση να τα βλέπη όλα καθαρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει να καθαρισθή η καρδιά, για να αναπαύεται μέσα του η Χάρις του Θεού. «Καρδίαν καθαράν κτίσον εν εμοί, ο Θεός»[32]δεν λέει ο Ψαλμός; Όταν καθαρισθή η καρδιά, η ανδρική ή η γυναικεία, κατοικεί μέσα της ο Χριστός και ούτε σκανδαλίζουν τότε οι άνθρωποι ούτε σκανδαλίζονται, αλλά μεταδίδουν Χάρη και ευλάβεια. Ο άνθρωπος που προσέχει και διατηρεί την πνευματική του καθαρότητα, διατηρεί και την θεία Χάρη. Έτσι βλέπει τα πάντα καθαρά, αλλά και τα ακάθαρτα τα αξιοποιεί. Τα κάνει και αυτά καλά στο πνευματικό του καλό εργοστάσιο. Τα άχρηστα χαρτιά τα κάνει καθαρές χαρτοπετσέτες, κόλλες, τετράδια κ.λπ., τα σπασμένα μπρούντζα τα κάνει κηροπήγια και μανουάλια κ.λπ. Αντίθετα, ο άνθρωπος που δέχεται την πονηριά και σκέφτεται πονηρά, και τα καλά τα μετατρέπει στο κακό, όπως το εργοστάσιο που κάνει πολεμικό υλικό, και το χρυσάφι το κάνει σφαίρες και κάλυκες κανονιού, γιατί έτσι είναι φτιαγμένες οι μηχανές του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν αρχίζη κανείς να κάνη υποχωρήσεις στην αμαρτία, εσωτερικά μαυρίζει, θολώνουν τα μάτια της ψυχής του και βλέπει θολά. Ύστερα, είναι μολυσμένος από την αμαρτία και η αμαρτία τον μπερδεύει. Ακόμη και τα καθαρά μπορεί να τα δη αμαρτωλά. Υπάρχουν άνθρωποι που δεν μπορούν να πιστέψουν λ.χ. ότι μερικοί νέοι ή νέες ζουν αγνή, καθαρή ζωή. «Αδύνατο, λένε, σήμερα να συμβαίνη αυτό». Οι καημένοι είναι τόσο βουτηγμένοι μέσα στην αμαρτία που όλα τα βλέπουν αμαρτωλά. Οι άνθρωποι που κοιμούνται με τα ταγκαλάκια[33], δεν μπορούν να σκεφθούν ότι υπάρχουν άλλοι που κοιμούνται με τα αγγελάκια. Να μη ζητάμε όμως από τους χοίρους να ευλαβούνται τα κρίνα. Βλέπεις,  και ο Χριστός είπε: «Μη βάλητε τους μαργαρίτας υμών έμπροσθεν των χοίρων, μήποτε καταπατήσωσιν αυτούς»[34]. Γι'' αυτό όποιος ζη πνευματικά, καθαρά, καλά είναι να προσέχη πολύ να μην ξεθαρρεύη ποτέ στους κοσμικούς ούτε και να τους δίνη πνευματικά δικαιώματα, για να μη βλαφθή και για να μην τους βλάψη, διότι οι κοσμικοί άνθρωποι άλλο τυπικό έχουν και άλλον κανονάρχη[35]και δεν μπορούν να διακρίνουν το άγιο Μύρο από την κολώνια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κάποιος που θέλει να ζήση κοντά στον Χριστό να εμποδισθή από εξωτερικούς πειρασμούς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι. Από τον Χριστό μπορεί να μας χωρίση μόνον η μη πνευματική ζωή μας. Το ταγκαλάκι αυτήν την δουλειά έχει: να δημιουργή σκάνδαλα και να σκορπάη κακότητα· να μάχεται τους ανθρώπους πότε σκληρά, πότε πονηρά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Χριστός μας αγαπάει και βρίσκεται κοντά μας, όταν ζούμε σύμφωνα με το θέλημά Του. Γι' αυτό, όταν βλέπετε να δημιουργούνται σκάνδαλα, μη φοβάσθε και μην πανικοβάλλεσθε. Εάν δεν αντιμετωπίζη κανείς τα πράγματα πνευματικά, δεν θα χαρή ούτε μία ημέρα, διότι θα του βρη ο διάβολος τον στόχο, δηλαδή το ευαίσθητο σημείο, και θα δημιουργή συνέχεια σκάνδαλα, για να τον στεναχωρή, σήμερα μ' αυτό, αύριο μ' εκείνο, μεθαύριο με το άλλο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να μη δημιουργούμε εμείς σκάνδαλα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο μπορούμε, να προσέχουμε να μη δίνουμε εμείς αφορμές και δημιουργούνται άσχημες καταστάσεις. Να μην ανοίγουμε χαραμάδες στον πονηρό, γιατί οι ψυχές που έχουν βλαμμένο λογισμό βλάπτονται και αφορμή ζητάνε να δικαιολογήσουν τον εαυτό τους. Έτσι από την μια χτίζουμε και από την άλλη γκρεμίζουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είχαν έρθει μια φορά στο Καλύβι μερικοί νέοι, μοντέρνα παιδιά, και συζητήσαμε. Εκείνη την ημέρα θα έβγαινα από το Άγιον Όρος. Όταν το έμαθαν, βγήκαν και εκείνα από το Όρος και στο καραβάκι ήρθαν και κάθησαν κοντά μου. Με πολύ ενδιαφέρον με ρωτούσαν για διάφορα πνευματικά θέματα. Μερικοί όμως το παρεξήγησαν και μας κοίταζαν πολύ ύποπτα. Εάν μπορούσα να προβλέψω ότι θα το παρεξηγούσαν αυτό οι άλλοι, θα φρόντιζα να λάβω τα μέτρα μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο κόσμος είναι πονηρός. Πρέπει να φροντίζουμε να μη δημιουργούμε σκάνδαλα. Δεν ευθυνόμαστε για όσα δεν μπορούμε να πάρουμε τα μέτρα μας ή για όσα δεν έχουμε πείρα. Να μην περιμένουμε μισθό από τον Θεό, όταν εμείς από απροσεξία δημιουργούμε προβλήματα. Μισθό έχουμε, όταν εμείς είμαστε προσεκτικοί, αλλά δημιουργή ο εχθρός προβλήματα. Μου λέει λ.χ. κάποιος ότι είμαι πλανεμένος. Πρώτα θα δώ αν είμαι πλανεμένος ή όχι. «Για να το πη αυτός, κάτι θα είδε. Δεν μπορεί να το είπε στα καλά καθούμενα· κάτι θα παρεξήγησε», σκέφτομαι και ψάχνω να βρώ που με παρεξηγεί, για να το διορθώσω. Αν λέη ότι είμαι πλανεμένος, είμαι μάγος, για μένα είναι κέρδος, γιατί δεν θα μαζεύεται κόσμος και θα ησυχάσω. Αλλά αυτός ο καημένος θα κολασθή, γιατί κάνει κακό στην Εκκλησία· κρίμα δεν είναι; Και φταίω εγώ, γιατί κάτι δεν πρόσεξα. Π.χ. έρχονται μερικοί να μου φιλήσουν το χέρι και τους χτυπάω ελαφρά στο κεφάλι. Ο άλλος το βλέπει και λέει: «Τους ευλογεί, ενώ είναι μοναχός! Τί είναι αυτός;». Δεν φταίνε αυτοί, πρέπει εγώ να μην το ξανακάνω.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, όταν κανείς από απροσεξία δημιουργή κάποιο σκάνδαλο, μερικοί λένε: «Άσ́ τον αυτόν, έχει το ακαταλόγιστο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το ακαταλόγιστο έχει ένας που δεν μπορεί να σκεφθή, όχι αυτός που δεν προσέχει. Ο απρόσεκτος ανάβει φωτιά και δεν σκέφτεται ότι θα πιάση πυρκαγιά εκεί που την άναψε. Όταν καμμιά φορά βάζη φωτιά ένας τέτοιος άνθρωπος και καψαλίζη και άλλες ψυχές, έχουμε καθήκον να ευχώμαστε και να ρίχνουμε και κανέναν κουβά νερό. Είναι και άλλοι που είναι ορμητικοί, έχουν και ευλάβεια μαζί με βλάβη καί, όταν ακούσουν κάτι με το οποίο δεν συμφωνούν, χωρίς να εξετάσουν αν είναι σωστό ή όχι, τα κάνουν όλα γυαλιά–καρφιά. Τότε πρέπει με τρόπο άλλοτε να πατάμε λίγο φρένο και άλλοτε, όταν σταματάνε, να βάζουμε πάλι με τρόπο καμμιά πέτρα στον τροχό τους, γιατί μπορεί να πάρουν και ανάποδα στροφές και να πάρουν και άλλους σβάρνα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί σκανδαλοποιοί είναι μερικοί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εύκολα μην πιστεύετε σε ό,τι ακούτε, γιατί είναι και μερικοί που τα λένε όπως εκείνοι τα καταλαβαίνουν. Πήγε μια φορά ένας στον Χατζεφεντή[36]και του λέει: «Νάχω την ευχή σου, Χατζεφεντή, εκατό φίδια μαζεύτηκαν εκεί επάνω». «Εκατό φίδια; Που βρέθηκαν;», απόρησε ο Άγιος Αρσένιος. «Έ, αν δεν ήταν εκατό, πενήντα θα ήταν σίγουρα». «Πενήντα φίδια!». «Είκοσι πέντε πάντως θα ήταν»! «Είκοσι πέντε φίδια άκουσες να μαζεύτηκαν ποτέ;», του λέει πάλι ο Άγιος. Μετά του λέει ότι ήταν δέκα οπωσδήποτε. «Καλά, του λέει ο Άγιος, συνέδριο είχαν και μαζεύτηκαν δέκα φίδια; Πάψε· δεν είναι δυνατόν!». «Πέντε θα ήταν», λέει τότε εκείνος. «Πέντε;». «Έ, δύο θα ήταν». Ύστερα τον ρωτάει ο Άγιος Αρσένιος: «Τα είδες;». «Όχι, λέει, τα άκουσα να κάνουν μέσα στα κλαδιά «σσσσ..."». Μπορεί δηλαδή να ήταν και καμμιά σαύρα!... Εγώ από όσα ακούω ποτέ δεν βγάζω συμπεράσματα, χωρίς να εξετάσω. Άλλος μπορεί να λέη κάτι, για να κατηγορήση, άλλος να το λέη απλά και άλλος σκόπιμα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τί σκανδαλοποιοί είναι μερικοί! Ήταν δυο φίλοι στην Κόνιτσα πολύ αγαπημένοι. Τις γιορτές και τις Κυριακές δεν γύριζαν μέσα στην πόλη· έρχονταν στο μοναστήρι, στο Στόμιο· έψελναν κιόλας. Ύστερα ανέβαιναν στο βουνό, στην Γκαμήλα[37]. Μια μέρα ένας διεστραμμένος τύπος τους έβαλε σκάνδαλα. Πάει στον έναν και του λέει: «Ξέρεις τί είπε για σένα αυτός; Αυτό και αυτό». Πάει μετά και στον άλλον και του λέει: «Ξέρεις τί είπε για σένα αυτός που τον έχεις φίλο; Αυτό και αυτό». Αμέσως έγιναν και οι δυο θηρία και πιάνουν έναν καυγά μέσα στο μοναστήρι! Εν τω μεταξύ εκείνος που έβαλε το φυτίλι έφυγε, και αυτοί δώσ᾿ του να μαλώνουν. Ο μικρότερος ήταν και λίγο νευρικός και έβριζε τον μεγαλύτερο. «Τώρα, λέω, τί να κάνω; Βρέ τον πειρασμό, τί κάνει!». Πάω και λέω στον μεγάλο: «Κοίταξε, μικρός είναι· αφού είναι και λίγο νευρικός, μην τον παρεξηγής· ζήτησέ του συγγνώμη». «Πάτερ, τί συγγνώμη να ζητήσω, μου λέει, δεν βλέπεις πώς με βρίζει; Εγώ ούτε καν έχω ιδέα από αυτά που λέει». Πάω και στον μικρό και του λέω: «Κοίταξε, μεγάλος είναι· δεν είναι έτσι που τα βλέπεις τα πράγματα· πήγαινε, ζήτησέ του συγγνώμη». Αρπάχθηκε εκείνος· έβαλε τις φωνές: «Θα μαλώσουμε και μαζί, Πάτερ!». «Έ, να μαλώσουμε, ρέ Παντελή! Άφησέ με όμως να ετοιμασθώ λίγο...», του είπα και έφυγα. Έξω από το μοναστήρι είχα κάτι ξύλα μακριά, για να φράξω τον κήπο. Πάω, παίρνω από τετρακόσια μέτρα μακριά ένα ξύλο κοντά πέντε μέτρα και το σβάρνιζα σιγά-σιγά, για να τον κάνω να γελάση. Εκείνος άκουγε που το σβάρνιζα, αλλά που να φαντασθή τί το ήθελα! Μπήκα μέσα στην αυλή σβαρνίζοντας το ξύλο, μέχρι που έφθασα κάτω από τον νάρθηκα. «Σταμάτα, ρέ Παντελή, να μαλώσουμε!», λέω. Έσκασαν στα γέλια και οι δυό, μόλις κατάλαβαν τί το ήθελα το ξύλο! Αυτό ήταν. Έσπασε ο πάγος. Έσκασε ο διάβολος. «Είστε στα καλά σας; τους λέω· τί είναι αυτά;». Και αγαπήθηκαν πάλι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η διαβολή την ίδια μέρα έγινε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, και βρίζονταν άσχημα! Βλέπεις ο διάβολος τί κάνει; Ο άλλος ίσως τους ζήλευε που ήταν τόσο αγαπημένοι σαν αδέλφια, διέβαλε τον έναν στον άλλον και έφυγε. Η διαβολή είναι πολύ κακό. Γι᾿ αυτό και ο πειρασμός λέγεται διάβολος. Διαβάλλει· άλλα λέει στον έναν, άλλα στον άλλον και δημιουργεί σκάνδαλα. Και είδες, τα πίστεψαν οι καημένοι και πιάστηκαν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Επίτηδες τα είπε εκείνος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, για να τους χωρίση από... αγάπη, ήγουν από φθόνο...
- type: h2
  initial:
    ru: ''
  text:
    ru: Δημοσιοποίηση αμαρτημάτων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν βλέπουμε κάτι άσχημο, να το σκεπάζουμε και όχι να το διαπομπεύουμε. Δεν είναι σωστό να γίνωνται γνωστά τα ηθικά παραπτώματα. Ας υποθέσουμε ότι στον δρόμο υπάρχει μια ακαθαρσία. Ένας συνετός άνθρωπος, αν περάση από εκεί, θα πάρη μια πλάκα και θα την σκεπάση, για να μην προξενή αηδία. Ένας ασύνετος όμως, αντί να την σκεπάση, μπορεί να αρχίση να την ανακατεύη και να σκορπίση περισσότερο την δυσωδία της. Έτσι, και όταν αδιάκριτα δημοσιοποιούμε τις αμαρτίες των άλλων, προξενούμε μεγαλύτερο κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το «ειπέ τη Εκκλησία»[38]δεν έχει την έννοια ότι πρέπει όλα να γίνωνται γνωστά, γιατί σήμερα δεν είναι όλοι Εκκλησία. Εκκλησία είναι οι πιστοί που ζουν όπως θέλει ο Χριστός και όχι οι άλλοι που πολεμούν την Εκκλησία. Στα πρώτα χρόνια του Χριστιανισμού που η εξομολόγηση γινόταν μπροστά σε όλα τα μέλη της Εκκλησίας, τότε είχε αυτό το νόημα το «ειπέ τη Εκκλησία». Ενώ στην εποχή μας που σπάνια βρίσκεται οικογένεια να έχη τον ίδιο Πνευματικό, ας μη μας ξεγελάη ο «έξω από εδώ» με το «ειπέ τη Εκκλησία», γιατί, όταν δημοσιοποιούμε ένα ηθικό λ.χ. παράπτωμα, το κοινοποιούμε στους πολεμίους της Εκκλησίας και τους δίνουμε αφορμή να αρχίσουν τον πόλεμο εναντίον της, οπότε κλονίζεται η πίστη των αδυνάτων ψυχών.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια μάνα, όταν έχη μια κόρη που είναι πόρνη, δεν την διασύρει και δεν την εξευτελίζει μπροστά στους άλλους, αλλά κάνει ό,τι μπορεί, για να αποκαταστήση το όνομά της. Θα πουλήση ό,τι έχει και δεν έχει, θα την πάρη να πάνε σε άλλη πόλη, θα κοιτάξη να την παντρέψη, για να διορθώση έτσι την παλιά της ζωή. Αυτός ακριβώς είναι και ο τρόπος της Εκκλησίας. Βλέπεις, ο Καλός Θεός μας ανέχεται με αγάπη και δεν θεατρίζει κανέναν, αν και γνωρίζη τα χάλια μας ως Καρδιογνώστης· και οι Άγιοι ποτέ δεν πρόσβαλαν αμαρτωλό άνθρωπο μπροστά στον κόσμο, αλλά με αγάπη, με λεπτότητα πνευματική και με τρόπο μυστικό βοηθούσαν για την διόρθωση του κακού. Εμείς όμως, αν και είμαστε αμαρτωλοί, κάνουμε το αντίθετο, σαν υποκριτές. Πρέπει να προσέχουμε να μην παρεξηγούμε εύκολα και νομίζουμε πώς ό,τι κάνουν οι άλλοι είναι κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αναφερθήκατε στην δημοσιοποίηση των ηθικών παραπτωμάτων. Άλλου είδους αμαρτίες ή αρρωστημένες καταστάσεις χρειάζεται σε μερικές περιπτώσεις να γνωστοποιούνται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε να σού πώ. Εγώ το κάνω αυτό σε μερικούς γνωστούς. Βλέπω π.χ. κάποιον να κάνη μια αταξία και να σκανδαλίζη και τους άλλους. Του λέω μιά, πέντε, δέκα, είκοσι, τριάντα φορές να διορθωθή, αλλά αυτός δεν διορθώνεται. Δεν έχει όμως δικαίωμα να συνεχίζη μια αταξία μετά από επανειλημμένες υποδείξεις, γιατί παρασύρονται και οι άλλοι και τον μιμούνται. Το κακό, βλέπεις, μπορούν εύκολα να το μιμηθούν οι άνθρωποι, όχι όμως και το καλό. Γι' αυτό αναγκάζομαι ύστερα να το πω και σε άλλους που βλέπουν την αταξία αυτή, για να τους προφυλάξω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν δηλαδή λέω «αυτό που κάνει ο τάδε δεν με αναπαύει», δεν το λέω για να κατακρίνω – αφού το έχω πει πεντακόσιες φορές στον ίδιο –, αλλά γιατί οι άλλοι που βλέπουν το κουσούρι του επηρεάζονται, το μιμούνται και μάλιστα λένε: «Αφού ο Γέροντας Παΐσιος δεν του λέει τίποτε, άρα είναι καλό». Αν δεν πω τον λογισμό μου, ότι δεν με αναπαύει αυτή η κατάσταση, δίνω την εντύπωση ότι το ευλογώ, ότι και εγώ αναπαύομαι σ᾿ αυτήν την κατάσταση. Έτσι καταστρέφεται το σύνολο, γιατί μπορεί να νομίσουν ότι είναι σωστή η τακτική του άλλου και να την εφαρμόσουν· και τί βγαίνει μετά; Νομίζουν εν τω μεταξύ ότι δεν το έχω πει στον ίδιο. Δεν ξέρουν ότι με έσκασε ο άλλος τόσον καιρό. Έχουμε και τον διάβολο που λέει: «Δεν πειράζει και να το κάνης. Βλέπεις, και ο άλλος το κάνει και ο Γέροντας Παΐσιος δεν του λέει τίποτε». Γι᾿ αυτό, όταν βλέπω ότι κάποιος συνεχίζει το τυπικό του κάνοντας μια αταξία, ενώ του έχω πει να την διορθώση, μετά λέω πάνω σε μια συζήτηση σ́ όποιον τον γνωρίζει «αυτό που κάνει ο τάδε δεν με αναπαύει», για να τον προφυλάξω και να μη βλαφθή. Αυτό δεν είναι κατάκριση. Να μην τα μπλέκουμε τα πράγματα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ύστερα μερικοί έρχονται και λένε: «Γιατί το είπες στον άλλο; Ήταν απόρρητο». «Τί απόρρητο; του λέω. Το είπα χίλιες φορές σ᾿ εσένα και δεν διορθώθηκες. Δεν έχεις δικαίωμα να βλάψης και τους άλλους που θα νομίζουν ότι εγώ συμφωνώ με αυτήν την κατάσταση». Ακόμα αυτό έλειψε να μην το πώ, αφού κάνει ζημιά στους άλλους! Ιδίως όταν έρχεται ένα παιδί από μια οικογένεια που την γνωρίζω και βλέπω ότι με την τακτική του καταστρέφει την οικογένεια, του λέω: «Κοίταξε, αν δεν διορθωθής, θα το πω στην μητέρα σου. Δεν έχεις δικαίωμα εσύ να έρχεσαι σ́ εμένα να μου το λές και πάλι να συνεχίζης το βιολί σου. Θα το πω στην μάνα σου, για να προφυλάξω την οικογένειά σας». Όταν έχη κανείς μετάνοια, καλά. Αλλά, όταν συνεχίζη την τακτική του, πρέπει να μιλήσω· έχω ευθύνη.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Ενέργειες με σύνεση και αγάπη
- type: h2
  initial:
    ru: ''
  text:
    ru: Εργασία στον εαυτό μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εάν θέλης να βοηθήσης την Εκκλησία, είναι καλύτερα να κοιτάξης να διορθώσης τον εαυτό σου, παρά να κοιτάς να διορθώσης τους άλλους. Αν διορθώσης τον εαυτό σου, αμέσως διορθώνεται ένα κομματάκι της Εκκλησίας. Εάν φυσικά αυτό το έκαναν όλοι, η Εκκλησία θα ήταν διορθωμένη. Αλλά σήμερα οι άνθρωποι ασχολούνται με όλα τα άλλα θέματα εκτός από τον εαυτό τους. Γιατί το να ασχολήσαι με τον εαυτό σου έχει κόπο, ενώ το να ασχολήσαι με τους άλλους είναι εύκολο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εάν ασχοληθούμε με την διόρθωση του εαυτού μας και στραφούμε πιο πολύ στην «εσωτερική» δράση παρά στην εξωτερική, δίνοντας τα πρωτεία στην θεία βοήθεια, θα βοηθήσουμε τους άλλους περισσότερο και θετικώτερα. Επιπλέον θα έχουμε και την εσωτερική μας γαλήνη, η οποία θα βοηθάη αθόρυβα τις ψυχές που θα συναντάμε, γιατί η εσωτερική πνευματική κατάσταση προδίδει την αρετή της ψυχής και αλλοιώνει ψυχές. Όταν επιδίδεται κανείς στην εξωτερική δράση, πριν φθάση στην λαμπικαρισμένη εσωτερική πνευματική κατάσταση, μπορεί να κάνη κάποιον πνευματικό αγώνα, αλλά έχει στενοχώρια, άγχος, έλλειψη εμπιστοσύνης στον Θεό, και συχνά χάνει την ηρεμία του. Εάν δεν κάνη καλό τον εαυτό του, δεν μπορεί να πη ότι το ενδιαφέρον του για το κοινό καλό είναι καθαρό. Όταν ελευθερωθή από τον παλαιό του άνθρωπο και από καθετί κοσμικό, έχει πλέον την θεία Χάρη, οπότε και ο ίδιος αναπαύεται, αλλά και κάθε είδους άνθρωπο αναπαύει. Αν όμως δεν έχη Χάρη Θεού, δεν μπορεί ούτε στον εαυτό του να επιβληθή ούτε τους άλλους να βοηθήση, για να φέρη θείο αποτέλεσμα. Πρέπει να βουτηχθή στην Χάρη και ύστερα να χρησιμοποιηθούν οι αγιασμένες πλέον δυνάμεις του για την σωτηρία των άλλων.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το καλό να γίνεται με καλό τρόπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς σκέφτεσθε, όταν έχετε να αντιμετωπίσετε ένα πρόβλημα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκέφτομαι τί γίνεται, τί δεν γίνεται ανθρωπίνως. Το εξετάζω από όλες τις πλευρές. «Θα κάνω αυτό· τί αντίκτυπο θα έχη εκεί, εκεί;... Τί κακό μπορεί να κάνη ή σε τί μπορεί να ωφελήση;». Εγώ πάντα ένα πρόβλημα προσπαθώ να το δώ από πολλές πλευρές, ώστε η λύση που θα δώσω να είναι, όσο γίνεται, πιο σωστή. Γιατί μπορεί να γίνουν πολλά λάθη, αν δεν προσέξη κανείς. Αν καταλάβη εκ των υστέρων τί έπρεπε να κάνη, δεν ωφελεί, γιατί πάει, πέταξε, όπως λένε, το πουλί! Ας πούμε, δεν πρόσεξε κάποιος και έκαψε ένα σπίτι. Καλά, εντάξει, δεν τον κρεμάει κανείς, αλλά το κακό έγινε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Κάπου είχαν ένα πρόβλημα. Ήρθε ο υπεύθυνος και μου λέει: «Έ, τώρα τακτοποιήθηκε το θέμα. Πήγα, βρήκα τον τάδε, τον τάδε, τους είπα αυτό και αυτό και τακτοποιήθηκε η υπόθεση!». «Τώρα άρχισε το πρόβλημα, του λέω. Εκείνο που υπήρχε, δεν ήταν πρόβλημα. Τώρα άναψε η φωτιά. Πρώτα δυο καρβουνάκια ήταν, και αυτά θα έσβηναν μόνα τους». Αυτός νόμιζε ότι με τις ενέργειές του είχε τακτοποιήσει την υπόθεση και ήθελε να τον επαινέσουμε κιόλας. Ενώ, με αυτό που έκανε, δημιούργησε μεγάλη φασαρία και μεγάλωσε το πρόβλημα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χρειάζεται πολλή προσοχή, σύνεση και διάκριση, για να γίνεται το καλό με καλό τρόπο και να ωφελή, γιατί αλλιώς, αντί να ωφελή, δαιμονίζει τον άλλον. Ύστερα, κάτι που σκέφτεται κανείς να κάνη, καλύτερα να το αφήνη να ωριμάση· γιατί, αν το αγουροκόψη, αποφασίση δηλαδή βεβιασμένα, ίσως να έχη προβλήματα αργότερα και να βασανίζεται. Τα σοβαρά πράγματα, όταν καθυστερούν λίγο, προχωρούν μετά γρήγορα και σωστά. Μπορεί κάποιος να έχη εξυπνάδα, αλλά να έχη και κενοδοξία και εγωισμό, και να προπορεύωνται αυτά στις ενέργειές του και να μην προσέχη. Ένα σκυλί π.χ. στο κυνήγι, όταν προχωράη προσεκτικά, και από ράτσα να μην είναι, βρίσκει τα ίχνη του λαγού. Ενώ άλλο που είναι από πολύ καλή ράτσα και έχει όλα τα προσόντα, όταν βιάζεται, τρέχει δεξιά και αριστερά χωρίς αποτέλεσμα. Ενέργεια πριν από σκέψη έχει υπερηφάνεια. Γι' αυτό να μη βιάζεται κανείς να ενεργήση, αλλά να σκέφτεται και να προσεύχεται προηγουμένως. Όταν προπορεύεται η προσευχή, δεν ενεργεί ο αφρός του μυαλού, η ελαφρότητα, αλλά το αγιασμένο μυαλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι πνευματικοί άνθρωποι μερικές φορές κάνουμε σαν να μην υπάρχη Θεός· δεν αφήνουμε τον Θεό να ενεργήση. Ο Θεός ξέρει πώς δουλεύει. Ενώ υπάρχουν δηλαδή πνευματικά μέσα, για να τακτοποιούνται οι δύσκολες καταστάσεις με πνευματικό τρόπο, εμείς πάμε να ενεργήσουμε κοσμικά. Όταν ήμουν στο Σινά, ένας Χότζας πήγαινε κάθε Παρασκευή μέσα στο μοναστήρι, ανέβαινε στον μιναρέ ενός τζαμιού που ήταν εκεί και φώναζε! Και είχε μια φωνή!... μέχρι επάνω στο ασκητήριο της Αγίας Επιστήμης ακουγόταν. Ύστερα το μοναστήρι βρήκε σαν λύση να κλείνουν την πόρτα την Παρασκευή που πήγαινε ο Χότζας, για να μην μπαίνη μέσα – εγώ δεν το ήξερα. Μια μέρα που κατέβηκα κάτω, βλέπω τον Χότζα οργισμένο. «Τώρα θα τους δείξω εγώ, μου λέει, που μου ᾿κλεισαν την πόρτα, για να μην μπαίνω μέσα...». «Την έκλεισαν, του λέω, για να μην μπούν οι γκαμήλες. Δεν πιστεύω ότι την έκλεισαν, για να μην μπής εσύ!». Μετά είπα κάτι γι'' αυτό στους Πατέρες. Λέει ένας γραμματεύς: «Θα του δείξω εγώ του Χότζα! Θα του βάλω μια φλούδα. Θα γράψω στην Κυβέρνηση ότι ο Χότζας μας πιέζει». «Κοίταξε, του λέω, η Ορθοδοξία δεν είναι φλούδα. Να κάνουμε μια αγρυπνία, να ψάλουμε την Ακολουθία των Σιναϊτών Πατέρων, της Αγίας Αικατερίνης, και να αφήσουμε να μιλήση ο Θεός. Θα πάω και εγώ επάνω να προσευχηθώ». Είπα και σε μερικούς Πατέρες να προσευχηθούν, και έτσι του ήρθε ένα σκαμπίλι του Χότζα· σηκώθηκε, έφυγε, εξαφανίσθηκε! Γιατί και την πόρτα να έκλειναν, μετά η Κυβέρνηση θα εξακρίβωνε ότι δεν είναι αλήθεια πώς τους πίεζε ο Χότζας και θα είχαν φασαρίες. Θα έλεγε ο Χότζας ότι έκλεισαν την πόρτα, επειδή πήγαινε κάθε Παρασκευή, και θα έκανε κακό στο μοναστήρι. Ένας άλλος παλιότερα είδε το βουνό και θέλησε να κάνη εξοχικό πάνω στην κορυφή της Αγίας Αικατερίνης!... Έπαθε μια αρρώστια, πάει, πέθανε. Ήρθε τελευταία και άλλος να φτιάξη κάτι εκεί, πάει, πέθανε και αυτός. Γι'' αυτό καλύτερα είναι να μη στηριζώμαστε μόνο στις δικές μας ανθρώπινες προσπάθειες, αλλά να προσευχώμαστε και να αφήνουμε τον Θεό να ενεργή.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Συμπεριφορά με διάκριση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν βλέπουμε κάποιον να συμπεριφέρεται άσχημα, πρέπει να του πούμε κάτι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ανάλογα με το τί άνθρωπος είναι. Χρειάζεται πολλή διάκριση και θείο φωτισμό στην εποχή μας. Δεν είναι εύκολο να σάς πώ. Σε μια περίπτωση, όπως έχω δεί, υπάρχουν πεντακόσιες υποπεριπτώσεις. Είναι μερικοί που μπορούν να διορθωθούν και άλλοι που δεν διορθώνονται, και με μια δική μας παρατήρηση μπορεί να αντιδράσουν. Ιδίως αν κάποιος έχη εγωισμό και τον θίξης, αντιδρά άσχημα. Ενώ καταλαβαίνει πολλές φορές ότι σφάλλει, από εγωισμό δεν υποχωρεί. Και όταν τα ελατήριά μας δεν είναι αγνά, δηλαδή μαζί με το ενδιαφέρον υπάρχη και υπερηφάνεια, και η αγάπη δεν είναι καθαρή, δημιουργείται στον άλλο μεγάλη αντίδραση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ελέγχουμε κάποιον από αγάπη, με πόνο, είτε την καταλαβαίνει ο άλλος την αγάπη μας είτε όχι, η αλλοίωση γίνεται στην καρδιά του, επειδή κινούμαστε από καθαρή αγάπη. Ενώ ο έλεγχος που γίνεται χωρίς αγάπη, με εμπάθεια, τον κάνει τον άλλο θηρίο, γιατί η κακία μας προσκρούει στον εγωισμό του, και τότε βγάζει σπίθες, και ανάβει η φωτιά, όπως όταν χτυπήση ο πυριόβολος – το ατσάλι – στην στουρναρόπετρα. Όταν ανεχώμαστε τον αδελφό μας από αγάπη, εκείνος το καταλαβαίνει. Και όταν δεν εκδηλώνεται η κακία μας, αλλά είναι εσωτερική, πάλι την καταλαβαίνει, γιατί του προκαλεί ταραχή· όπως ο διάβολος, ακόμη και όταν παρουσιάζεται σαν άγγελος φωτός, φέρνει ταραχή, ενώ ο πραγματικός Άγγελος φέρνει μια απαλή ανέκφραστη αγαλλίαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, όταν λέμε κάτι και δημιουργούνται αντιδράσεις, ξεκινάμε από εγωισμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γίνονται και πολλές παρεξηγήσεις· άλλα καταλαβαίνει ο ένας, άλλα ο άλλος. Να εξετάζη όμως κανείς πάντοτε τον εαυτό του: «Γιατί θέλω να το πω αυτό; Από που ξεκινώ; Πονάω γι᾿ αυτό ή θέλω να το πώ, για να φανώ καλός, να επιδειχθώ;». Αν κανείς εξαγνισθή, τότε, είτε θυμώση είτε φωνάξη είτε κάνη μια παρατήρηση, τα ελατήριά του θα είναι αγνά. Μετά πάνε όλα κανονικά, επειδή κινείται με διάκριση. Γιατί διάκριση είναι ο εξαγνισμός, ο θείος φωτισμός, η πνευματική διαύγεια. Επομένως πώς να υπάρχη εγωισμός εκεί μέσα; Και όταν τα ελατήρια είναι αγνά, ο άνθρωπος έχει ανάπαυση. Από αυτό θα διακρίνετε αν η κάθε ενέργειά σας είναι καλή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλές φορές δεν καταλαβαίνετε ότι ο τρόπος με τον οποίο λέτε κάτι στον άλλον έχει ύφος διευθυντού: «Έτσι και έτσι πρέπει να γίνη αυτό». Μπαίνει ο εγωισμός και τον τινάζετε τον άλλο στον αέρα. Αν υπάρχουν αγνά ελατήρια και ταπείνωση, η παρατήρηση βοηθάει τον άλλο· διαφορετικά, μπαίνει ο εγωισμός και φέρνει αντίθετο αποτέλεσμα. Να βγάλετε τον εαυτό σας, τον εγωισμό σας, από τις ενέργειές σας. Τότε θα κινήσθε όλο από αγνά ελατήρια. Η αδιάκριτη συμπεριφορά τις περισσότερες φορές κάνει μεγαλύτερο κακό από την συμπεριφορά των τρελλών που έχουν το ακαταλόγιστο και σπάζουν κεφάλια, διότι οι αδιάκριτοι με τα κοφτερά τους λόγια πληγώνουν ευαίσθητες ψυχές και πολλές φορές τις τραυματίζουν θανάσιμα, γιατί τις φέρνουν σε απόγνωση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι και μερικοί που συμπεριφέρονται με τον ίδιο τρόπο προς όλους. Δεν μπορούμε όμως σε μια δακτυλήθρα να βάλουμε όσο βάζουμε σε ένα βαρέλι· ή να φορτώσουμε ένα βόδι όσο ένα άλογο. Το βόδι είναι για να τραβάη το αλέτρι· δεν γίνεται να του βάλουμε σαμάρι και να το φορτώσουμε. Το άλογο πάλι κακώς το βάζουμε στο αλέτρι, γιατί είναι για να σηκώνη βάρος. Για άλλη δουλειά είναι το ένα, για άλλη το άλλο. Να μη θέλουμε να βάλουμε όλον τον κόσμο στο δικό μας καλούπι. Ο καθένας έχει το δικό του. Να παραβλέπουμε και μερικά, όταν δεν βλάπτουν. Εάν μπορούσαν να μπούν σε τάξη όλοι οι άνθρωποι σ᾿ αυτήν την ζωή, δεν θα γίνονταν αταξίες και θα ήταν και εδώ Παράδεισος. Να μην έχουμε λοιπόν απαιτήσεις παράλογες από τους άλλους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική ειλικρίνεια χαρακτηρίζεται από την αγάπη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο κόσμος πάει άσχημα σήμερα, γιατί όλοι λένε μεγάλες «αλήθειες», που δεν ανταποκρίνονται όμως στην πραγματικότητα. Τα γλυκά λόγια και οι μεγάλες αλήθειες έχουν αξία, όταν βγαίνουν από αληθινά στόματα, και πιάνουν τόπο μόνο στους καλοπροαίρετους ανθρώπους και σ́ εκείνους που έχουν καθαρό νού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχει ειλικρίνεια κοσμική και ειλικρίνεια πνευματική;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, βέβαια. Η κοσμική ειλικρίνεια έχει αδιακρισία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μιλάει δηλαδή κανείς ευκαίρως–ακαίρως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εκτός από αυτό· η αλήθεια είναι αλήθεια· αλλά, αν πής καμμιά φορά την αλήθεια χωρίς διάκριση, αυτό δεν είναι αλήθεια. Π.χ. είναι αλήθεια ότι ο τάδε είναι βλαμμένος. Αν πάς όμως να το πής αυτό, δεν ωφελείς. Ή άλλος λέει: «Για να είμαι ειλικρινής, θα πάω να αμαρτήσω στην πλατεία». Αυτό δεν είναι ειλικρίνεια. Όποιος έχει πολλή διάκριση, έχει αρχοντική αγάπη, θυσία και ταπείνωση, και την πικρή ακόμη αλήθεια την λέει με πολλή απλότητα και την γλυκαίνει με την καλωσύνη του, με αποτέλεσμα να ωφελή πιο θετικά από τα γλυκά λόγια, όπως τα πικρά φάρμακα ωφελούν περισσότερο από τα γλυκά σιρόπια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αλήθεια, όταν χρησιμοποιήται χωρίς διάκριση, μπορεί να κάνη έγκλημα. Μερικοί ενεργούν εν ονόματι της αληθείας και εγκληματούν. Όταν κανείς έχη ειλικρίνεια χωρίς διάκριση, μπορεί να κάνη διπλό κακό· πρώτα στον εαυτό του και ύστερα στους άλλους, γιατί αυτή η ειλικρίνεια δεν έχει σπλάχνα. Όποιος θέλει να είναι πράγματι ειλικρινής, ας ξεκινήση να είναι ειλικρινής πρώτα με τον εαυτό του, γιατί από ᾿κεί ξεκινάει η πνευματική ειλικρίνεια. Όταν κανείς δεν είναι ειλικρινής με τον εαυτό του, κοροϊδεύει και αδικεί τουλάχιστον μόνον τον εαυτό του. Όταν όμως συμπεριφέρεται χωρίς ειλικρίνεια προς τους άλλους, αμαρτάνει θανάσιμα, γιατί κοροϊδεύει τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να κινήται κανείς έτσι από απλότητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί απλότητα! Που την βρήκες σε έναν τέτοιο άνθρωπο την απλότητα! Αν είναι παιδάκι, θα έχη απλότητα. Αν είναι Άγιος, θα έχη απλότητα. Αν είναι μεγάλος και δεν είναι καθυστερημένος στο μυαλό και κινήται έτσι, θα είναι διάβολος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς αισθάνεται αυτός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κόλαση σωστή. Ο ένας πειρασμός διαδέχεται τον άλλο. Συνέχεια πειρασμοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν πρέπει όμως να φέρεται κανείς με ευθύτητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η ευθύτητα, έτσι όπως την χρησιμοποιούν πολλοί, έχει ένα νομικό πνεύμα. «Είμαι ευθύς, λένε, «κηρύττω επί των δωμάτων"[39]», και κάνουν τον άλλον ρεζίλι, αλλά τελικά γίνονται οι ίδιοι ρεζίλι.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Το γράμμα του νόμου αποκτείνει»[40]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είπα σε κάποιον μια φορά: «Τί είσαι εσύ; Μαχητής του Χριστού ή μαχητής του πειρασμού; Ξέρεις πώς υπάρχουν και μαχητές του πειρασμού;». Ο Χριστιανός δεν πρέπει να είναι φανατικός, αλλά να έχη αγάπη για όλους τους ανθρώπους. Όποιος πετάει λόγια αδιάκριτα, και σωστά να είναι, κάνει κακό. Γνώρισα έναν συγγραφέα που είχε ευλάβεια πολλή, αλλά μιλούσε στους κοσμικούς με μια γλώσσα ωμή, που προχωρούσε όμως σε βάθος, και τους τράνταζε. Μια φορά μου λέει: «Σε μια συγκέντρωση είπα αυτό και αυτό σε μια κυρία». Αλλά με τον τρόπο που της το είπε, την είχε σακατέψει. Την πρόσβαλε μπροστά σε όλους. «Κοίταξε, του λέω, εσύ πετάς στους άλλους χρυσά στεφάνια με διαμαντόπετρες, έτσι όμως που τα πετάς, σακατεύεις κεφάλια, όχι μόνον ευαίσθητα αλλά και γερά». Ας μην πετροβολάμε τους ανθρώπους... χριστιανικά. Όποιος ελέγχει μπροστά σε άλλους κάποιον που αμάρτησε ή μιλάει με εμπάθεια για κάποιο πρόσωπο, αυτός δεν κινείται από το Πνεύμα του Θεού· κινείται από άλλο πνεύμα. Ο τρόπος της Εκκλησίας είναι η αγάπη· διαφέρει από τον τρόπο των νομικών. Η Εκκλησία βλέπει τα πάντα με μακροθυμία και κοιτάζει να βοηθήση τον καθέναν, ό,τι και αν έχη κάνει, όσο αμαρτωλός και αν είναι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω σε μερικούς ευλαβείς ένα είδος παράξενης λογικής. Καλή είναι η ευλάβεια που έχουν, καλή και η διάθεση για το καλό, αλλά χρειάζεται και η πνευματική διάκριση και ευρύτητα, για να μη συνοδεύη την ευλάβεια η στενοκεφαλιά, η γεροκεφαλιά (τό γερό δηλαδή αρβανίτικο κεφάλι). Όλη η βάση είναι να έχη κανείς πνευματική κατάσταση, για να έχη την πνευματική διάκριση, γιατί αλλιώς μένει στο «γράμμα του νόμου», και το «γράμμα του νόμου αποκτείνει». Αυτός που έχει ταπείνωση, δεν κάνει ποτέ τον δάσκαλο· ακούει καί, όταν του ζητηθή η γνώμη του, μιλάει ταπεινά. Ποτέ δεν λέει «εγώ», αλλά «ο λογισμός μου λέει» ή «οι Πατέρες είπαν». Μιλάει δηλαδή σαν μαθητής. Όποιος νομίζει ότι είναι ικανός να διορθώνη τους άλλους έχει πολύ εγωισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, ξεκινάη κανείς από καλή διάθεση να κάνη κάτι και φθάνη στα άκρα, λείπει η διάκριση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι ο εγωισμός μέσα στην ενέργειά του αυτή και δεν το καταλαβαίνει, γιατί δεν γνωρίζει τον εαυτό του, γι' αυτό πιάνει τα άκρα. Πολλές φορές από ευλάβεια ξεκινούν μερικοί, αλλά που φθάνουν! Όπως οι εικονολάτρες και οι εικονομάχοι. Άκρη το ένα, άκρη το άλλο! Οι μεν έφθασαν στο σημείο να ξύνουν την εικόνα του Χριστού και να ρίχνουν την σκόνη μέσα στο Άγιο Ποτήριο, για να γίνη καλύτερη η Θεία Κοινωνία· οι άλλοι πάλι έκαιγαν τις εικόνες, τις πετούσαν... Γι᾿ αυτό η Εκκλησία αναγκάσθηκε να βάλη ψηλά τις εικόνες καί, όταν πέρασε η διαμάχη, τις κατέβασε χαμηλά, για να τις προσκυνούμε και να απονέμουμε τιμή στα εικονιζόμενα πρόσωπα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ό,τι κάνουμε να το κάνουμε για τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συνήθως κινούμαι από φόβο να μη στενοχωρήσω τους άλλους ή να μην ξεπέσω στα μάτια τους· δεν σκέφτομαι να μη στενοχωρήσω τον Θεό. Πώς θα αυξηθή ο φόβος του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εγρήγορση χρειάζεται. Ό,τι κάνει ο άνθρωπος, να το κάνη για τον Θεό. Ξεχνάμε τον Θεό και μπαίνει μετά ο λογισμός ότι κάνουμε κάτι σπουδαίο, μπαίνει και η ανθρωπαρέσκεια και κοιτάμε να μην ξεπέσουμε στα μάτια των ανθρώπων. Ενώ, αν ενεργή κανείς με την σκέψη ότι ο Θεός τον βλέπει, τον παρακολουθεί, τότε ό,τι κάνει είναι σίγουρο· αλλιώς, αν κάνη κάτι, για να φανή καλός στους ανθρώπους, όλα τα χάνει, όλα χαραμίζονται. Για κάθε ενέργειά του ο άνθρωπος πρέπει να ρωτάη τον εαυτό του: «Καλά, εμένα αυτό που κάνω με αναπαύει· τον Θεό Τον αναπαύει;» και να εξετάζη αν είναι ευάρεστο στον Θεό. Αν ξεχνάη να το κάνη αυτό, ξεχνάει και τον Θεό μετά. Γι'' αυτό παλιά έλεγαν «πρός Θεού» ή «τόν αθεόφοβο, δεν φοβάται τον Θεό;». Ή έλεγαν: «Αν θέλη ο Θεός, αν επιτρέψη ο Θεός». Ένιωθαν την παρουσία του Θεού παντού, είχαν συνέχεια μπροστά τους τον Θεό και πρόσεχαν. Ζούσαν αυτό που λέει ο Ψαλμός, «Προωρώμην τον Κύριον ενώπιόν μου διαπαντός, ίνα μη σαλευθώ»[41]και δεν σαλεύονταν. Τώρα, βλέπεις, μπαίνει σιγά-σιγά το ευρωπαϊκό τυπικό και πολλοί δεν κάνουν το στραβό από ευγένεια κοσμική. Ό,τι κάνει κανείς, να το κάνη καθαρό για τον Χριστό, να έχη τον νού του ότι ο Χριστός τον βλέπει, τον παρακολουθεί· σε κάθε του κίνηση κέντρο να είναι ο Χριστός. Να μην έχη το ανθρώπινο στοιχείο μέσα του. Αν κινούμαστε με σκοπό να αρέσουμε στους ανθρώπους, αυτό δεν μας ωφελεί σε τίποτε. Χρειάζεται πολλή προσοχή. Πάντοτε να εξετάζω τα ελατήρια από τα οποία κινούμαι καί, μόλις αντιληφθώ ότι κινούμαι από ανθρωπαρέσκεια, να την χτυπώ αμέσως. Γιατί, όταν πάω να κάνω ένα καλό και μπαίνη στην μέση η ανθρωπαρέσκεια, έ, τότε βγάζω νερό από το πηγάδι με τρύπιο κουβά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τους περισσότερους πειρασμούς συχνά τους δημιουργεί ο ίδιος ο εαυτός μας, όταν έχουμε τον εαυτό μας μέσα στην συνεργασία μας με τους άλλους. Όταν δηλαδή κινούμαστε από ιδιοτέλεια, θέλουμε να εξυψώνουμε τον εαυτό μας και επιδιώκουμε την προσωπική μας ικανοποίηση. Στον Ουρανό δεν ανεβαίνει κανείς με το κοσμικό ανέβασμα αλλά με το πνευματικό κατέβασμα. Όποιος βαδίζει χαμηλά, βαδίζει πάντα με σιγουριά και ποτέ δεν πέφτει. Γι᾿ αυτό, όσο μπορούμε, να ξερριζώνουμε την κοσμική προβολή και την κοσμική επιτυχία, η οποία είναι πνευματική αποτυχία. Να σιχαινώμαστε τον κρυφό και φανερό εγωισμό και την ανθρωπαρέσκεια, για να αγαπήσουμε ειλικρινά τον Χριστό. Την εποχή μας δεν την χαρακτηρίζει το αθόρυβο αλλά το εντυπωσιακό, το κούφιο. Η πνευματική ζωή όμως είναι αθόρυβη. Καλά είναι να κάνουμε αυτά που είναι για τα μέτρα μας σωστά, αθόρυβα, χωρίς επιδιώξεις πάνω από τις δυνάμεις μας, γιατί αλλιώς θα είναι εις βάρος της ψυχής μας και του σώματος, και συχνά εις βάρος και της Εκκλησίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μέσα στην γνήσια ευαρέστηση του πλησίον μας υπάρχει και η ευαρέστηση στον Χριστό. Εκεί χρειάζεται να προσέξη κανείς, πώς να εξαγνίση την ευαρέστηση προς τον πλησίον, να βγάλη δηλαδή την ανθρωπαρέσκεια, για να πάη και αυτή η ανθρώπινη προσφορά στον Χριστό. Όταν προσπαθή κάποιος να τοποθετήση τα εκκλησιαστικά θέματα δήθεν με ορθόδοξο τρόπο, και ο σκοπός του είναι να τοποθετήση καλύτερα τον εαυτό του, αποβλέπη δηλαδή στο συμφέρον του, πώς θα ευλογηθή από τον Θεό; Όσο μπορεί κανείς να κάνη την ζωή του τέτοια που να συγγενεύη με τον Θεό. Πάντα να ελέγχη τον εαυτό του και να κοιτάζη πώς να κάνη το θέλημα του Θεού. Όταν κάνη το θέλημα του Θεού, τότε συγγενεύει με τον Θεό, και τότε, χωρίς να ζητάη από τον Θεό, λαμβάνει· δέχεται συνέχεια νερό από την πηγή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αποκτήσουμε αισθητήριο πνευματικό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το Άγιο Πνεύμα είναι ένα και έχει πολλά χαρίσματα. Δεν είναι άλλο εδώ και άλλο εκεί. Δεν είναι πνεύμα συγχύσεως, αλλά αγάπης, ειρήνης... Όταν οι πνευματικοί άνθρωποι χτυπιούνται, αυτό σημαίνει ότι βρίσκονται υπό την επίδραση πολλών άλλων πνευμάτων, που δεν έχουν καμμιά σχέση με το ένα Άγιο Πνεύμα. Παλιά το Άγιο Πνεύμα φώτιζε, υπαγόρευε. Μεγάλη υπόθεση! Σήμερα δεν βρίσκει προϋποθέσεις, για να κατεβή. Η βαβυλωνία στην Παλαιά Διαθήκη ήταν αθώα. Ζητούσες λ.χ. λάσπη και σού έφερναν άχυρα. Τώρα έχουμε βαβυλωνία με πάθη. Ζητάς λάσπη και σού ρίχνουν τούβλο στο κεφάλι. Αν όμως ο άνθρωπος βγάζη τον εαυτό του από κάθε ενέργειά του και κόβη το θέλημά του, τότε δουλεύει σωστά, και τότε θα έχη οπωσδήποτε θείο φωτισμό και θα υπάρχη πνεύμα συνεννοήσεως. Γιατί, όταν βγάζη την δική του ιδέα, έρχονται θείες ιδέες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πρέπει να αποκτήση κανείς αισθητήριο πνευματικό, για να έχη και τον θείο φωτισμό. Είναι βασικό να γίνη αυτή η δουλειά, για να καταλάβουν οι άνθρωποι μερικά πράγματα. Ιδίως στην εποχή μας αυτό μας το επιβάλλουν οι περιστάσεις. Βλέπετε, και στην Μικρά Ασία, τότε σ́ εκείνα τα δύσκολα χρόνια, τους ανάγκαζε η κατάσταση και έπαιρνε στροφές το μυαλό τους. Μπορεί δύο Έλληνες να ήταν μπροστά σε Αρμενίους και Τούρκους και συνεννοούνταν, χωρίς να καταλάβουν τίποτε ούτε οι Αρμένιοι ούτε οι Τούρκοι. Για έναν λόγο παραπάνω σήμερα που βλέπεις σε τί κατάσταση ζούμε, είναι ανάγκη οι πνευματικοί άνθρωποι να συνεννοούνται. Θα έρθουν δύσκολα χρόνια. Πρέπει να παίρνη στροφές το μυαλό. Αν δεν παίρνη στροφές το μυαλό του ανθρώπου και δεν υπάρχη και θείος φωτισμός, τότε σε κάθε περίπτωση πρέπει να παίρνη εντολή πώς να κινηθή. Μήν περιμένετε να σάς τα πούν όλα. Μερικά πράγματα, χωρίς να σάς τα πούν, μόνες σας πρέπει να τα καταλαβαίνετε. Θυμάμαι, μια φορά στην Κόνιτσα, πριν πάω στρατιώτης, είχαμε μάθει ότι έρχονταν οι αντάρτες. Ήμασταν τέσσερις – οι τρεις ήταν Μουσουλμάνοι – και  κρυφτήκαμε σε ένα τούρκικο σπίτι που ήταν στην άκρη της πόλης. Ένα Τουρκάκι πέντε χρονών κατάλαβε και μας λέει: «Πάτε μαγειγειό, βγώ έτσω ᾿γώ». Μπήκαμε λοιπόν στο μαγειρειό, βγήκαμε πίσω από το σπίτι και έτσι προλάβαμε να κρυφτούμε σε κάτι αποθήκες πιο κάτω. Αυτό βγήκε έξω και είπε στους αντάρτες ότι δεν είναι κανείς μέσα και έφυγαν. Παιδάκι πέντε χρονών, τόσο δά, να μην ξέρη να μιλήση, και είδατε πόσο συνετά φέρθηκε! Πά, πά, σπίρτο ήταν! Βλέπεις, παρατηρούσε, αγαπούσε, ενώ ένας μεγάλος μπορεί από απερισκεψία να έκανε κακό. Εμείς βαπτισμένοι, μυρωμένοι, με κατηχήσεις, με μελέτες, να μη μένουμε σε υπανάπτυκτη, νηπιώδη κατάσταση. Να είστε ξεφτέρια. Ξέρετε ποιά είναι ξεφτέρια; Τα Εξαπτέρυγα. Έχουν έξι φτερά και τα χτυπούν ψάλλοντας το «Άγιος, Άγιος, Άγιος». Να πετάτε, να έχετε έξι φτερά!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο θείος φωτισμός είναι το πάν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλές φορές λέω σε μερικούς: «Κανόνισε όπως σε φωτίση ο Θεός». Όταν λέω «όπως σε φωτίση ο Θεός», εννοώ ο άνθρωπος να δη τα πράγματα με θείο φωτισμό και όχι με την ανθρώπινη λογική. Να μη νομίζη πώς ό,τι αναπαύει εκείνον είναι και η φώτιση του Θεού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς έρχεται ο θείος φωτισμός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν ξεσκουριάσουμε τα καλώδια, ο παλαιός άνθρωπος γίνεται καλός αγωγός και τότε περνάει η Χάρις του Θεού και δέχεται το θείο φως της Χάριτος. Αλλιώς γίνονται βραχυκυκλώματα και δεν ενεργεί η Χάρις. Όλη η βάση είναι να προσέξη ο άνθρωπος να μην τον εγκαταλείψη η Χάρις του Θεού, για να έχη τον θείο φωτισμό. Γιατί, αν δεν υπάρχη θείος φωτισμός, όλα χαμένα είναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τί τράβηξε ο Χριστός με τους Μαθητές, πριν τους επισκιάση η Χάρις, γιατί ήταν γήινοι! Πριν από την Πεντηκοστή είχε δοθή εξουσία από τον Θεό στους Μαθητές να βοηθούν τον κόσμο. Δεν είχαν όμως ακόμη τον θείο φωτισμό που πήραν την Πεντηκοστή. Ενώ τους έλεγε ο Χριστός ότι θα πάη στα Ιεροσόλυμα και θα σταυρωθή ο Υιός του ανθρώπου κ.λπ., εκείνοι νόμιζαν ότι, όταν πάη στα Ιεροσόλυμα, θα Τον κάνουν βασιλιά. Σκέφτονταν ανθρώπινα. Γι᾿ αυτό τους απασχολούσε ποιός θα καθήση δεξιά και ποιός αριστερά από τον Χριστό. Πήγε η μητέρα των υιών του Ζεβεδαίου και Τον παρακάλεσε να βάλη στην βασιλεία Του το ένα παιδί της από τα δεξιά Του και το άλλο από τα αριστερά Του[42]! Από την ημέρα όμως της Πεντηκοστής που ο Χριστός τους έστειλε τον Παράκλητο, το Άγιο Πνεύμα, είχαν πλέον οι Απόστολοι μόνιμα την θεία Χάρη. Προηγουμένως μόνο μερικές φορές είχαν θείο φωτισμό· ήταν σαν να γέμιζε η μπαταρία τους και πάλι εξηντλείτο. Πάλι έπρεπε να την βάλουν στην μπρίζα, να φορτισθή! Πάλι εξηντλείτο, πάλι στην μπρίζα! Όταν τους έστειλε τον Παράκλητο, δεν χρειαζόταν πια η... μπρίζα. Όχι ότι εμείς τώρα είμαστε καλύτεροι και εκείνοι ήταν χειρότεροι, αλλά εμείς ζούμε στον καιρό της Χάριτος, γι' αυτό δεν έχουμε ελαφρυντικά. Είμαστε βαπτισμένοι, έχουμε και τον Παράκλητο, τα έχουμε όλα. Τότε δεν είχε σταυρωθή ακόμη ο Χριστός, και είχε, κατά κάποιον τρόπο, εξουσία ο διάβολος και εύκολα παρέσυρε τους ανθρώπους. Μετά την Σταύρωση δόθηκε σ́ όλους η δυνατότητα από τον Χριστό να έχουν τον θείο φωτισμό. Θυσιάσθηκε ο Χριστός και μας ελευθέρωσε. Βαπτισθήκαμε στο όνομά Του. Την μπρίζα την έχει συνέχεια βαλμένη. Τώρα εμείς γινόμαστε αιτία να μην περνάη το ρεύμα της θείας Χάριτος, γιατί αφήνουμε τα καλώδιά μας σκουριασμένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί προϋποθέσεις χρειάζονται, για να κατοικήση στον άνθρωπο το Άγιο Πνεύμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αγωνιστικό πνεύμα, ταπείνωση, φιλότιμο, αρχοντιά, θυσία. Ο άνθρωπος είναι άχρηστος, άμα λείψη η Χάρις του Αγίου Πνεύματος. Το Άγιο Πνεύμα είναι το φώς, το θείο φώς. Όλη η βάση εκεί είναι. Αν κανείς δεν βλέπη, μπορεί να χτυπήση πάνω στο τζάμι, να πέση σε κανέναν γκρεμό ή σε λάκκο ή σε ακαθαρσίες, και σε βόθρο ακόμη. Δεν βλέπει που πάει, γιατί στερείται το φώς. Άμα όμως βλέπη λίγο, προφυλάγεται· άμα βλέπη πιο πολύ, αποφεύγει όλους αυτούς τους κινδύνους και βαδίζει με ασφάλεια στον δρόμο του. Και για να ᾿ρθή το Φώς, πρέπει να θέλης να βγής από το σκοτάδι. Και λίγο θαμπά αν βλέπουν οι άνθρωποι, δεν θα πέφτουν, και ο Θεός δεν θα στενοχωριέται. Αν ένας πατέρας στενοχωριέται, όταν τα παιδιά του πέφτουν στις λάσπες, στα αγκάθια, στον γκρεμό, πόσο μάλλον ο Θεός!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όλο το κακό που γίνεται στον κόσμο, είναι γιατί λείπει ο θείος φωτισμός. Και όταν λείπη ο θείος φωτισμός, βρίσκεται στο σκοτάδι ο άνθρωπος. Τότε ο ένας λέει «από ᾿δώ θα πάμε», ο άλλος λέει «όχι, εγώ ξέρω καλά· από ᾿δώ θα πάμε», ο άλλος «από ᾿δώ», ο άλλος «από ᾿κεί». Ο καθένας νομίζει ότι είναι καλό να πάνε από εκεί που λέει αυτός. Όλοι δηλαδή ενδιαφέρονται για το καλό, αλλά βρίσκονται σε μια θαμπομάρα και δεν μπορούν να συνεννοηθούν. Αν δεν υπήρχε θαμπομάρα, δεν θα μάλωναν· θα έβλεπαν τον καλύτερο δρόμο και θα τραβούσαν προς τα εκεί. Θέλω να πω ότι όλοι μπορεί να κινούνται με καλή διάθεση, αλλά, επειδή υπάρχει θαμπομάρα, δημιουργούνται πολλά και στην κοινωνία και στην Εκκλησία. Τουλάχιστον στην Εκκλησία οι περισσότεροι δεν έχουν κακή διάθεση, αλλά λείπει ο θείος φωτισμός. Για το καλό αγωνίζονται, αλλά τελικά που καταλήγουν; Γι'' αυτό να ζητάμε από τον Θεό να μας δίνη έστω και λίγο θείο φωτισμό, γιατί αλλιώς σαν τον τυφλό θα σκοντάφτουμε. Στην Θεία Λειτουργία, όταν λέη ο ιερέας «Τα σά εκ των σών...», προσεύχομαι στον Θεό να φωτίση τον κόσμο, για να βλέπη. Λίγο να φωτίση ο Θεός, να φύγη το σκοτάδι, για να μη σακατεύωνται πνευματικά οι άνθρωποι. Και στον δεύτερο Ψαλμό, που ο Άγιος Αρσένιος ο Καππαδόκης τον διάβαζε «γιά να φωτίση ο Θεός αυτούς που πηγαίνουν σε συνέδρια», λέω: «Να φωτίση ο Θεός όλους τους άρχοντες, μετά να φωτίση την Ιεραρχία και όλους τους Πατέρες της Εκκλησίας, να δέχωνται το Άγιο Πνεύμα, για να βοηθούν τον κόσμο». Και λίγο έναν να φωτίση και τους άλλους να τους κάνη δεκτικούς, ξέρετε τί καλό μπορεί να γίνη; Μια κουβέντα να πη ένας άρχοντας, όλα αλλάζουν. Έχουν ανάγκη από θείο φωτισμό οι άνθρωποι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Καλός Θεός δίνει τον θείο φωτισμό Του σ᾿ αυτούς που έχουν αγαθή προαίρεση. Ένας δικαστικός μου διηγήθηκε μια περίπτωση που αντιμετώπισε ο ίδιος. Έναν μοναχό τον έστειλε το μοναστήρι του με πεντακόσιες λίρες να αγοράση ένα κτήμα. Πήγε να ρωτήση κάποιον έμπορο και εκείνος του είπε: «Άσ́ τα σ́ εμένα, για να μην τα κουβαλάς». Του άφησε τα χρήματα. «Τί καλός άνθρωπος, είπε ο μοναχός με έναν καλό λογισμό, μου πήρε και το βάρος». Όταν επέστρεψε, δεν του έδινε τις πεντακόσιες λίρες και επιπλέον έλεγε ότι του έδωσε και οκτώ εκατομμύρια! Ο καημένος ο μοναχός σκεφτόταν πώς θα γυρίση στο μοναστήρι. Έδωσε τις πεντακόσιες λίρες και δεν πήρε τίποτε, και επιπλέον ο άλλος του ζητούσε και οκτώ εκατομμύρια. Το θέμα κατέληξε στο δικαστήριο. Στην δίκη, ο δικαστικός από μια έμπνευση που είχε, έκανε μια σειρά ερωτήσεων και αποδείχθηκε ότι ο έμπορος όχι μόνο δεν έδωσε τίποτε στον μοναχό, αλλά και ότι του πήρε και τις λίρες. Διέκρινα σ᾿ αυτόν τον δικαστικό μια κατάσταση σαν του Προφήτη Δανιήλ[43]! Επειδή είχε φόβο Θεού, ο Θεός τον φώτισε και ενήργησε σωστά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλη η βάση είναι ο θείος φωτισμός. Και αν έρθη ο θείος φωτισμός, τότε ο άνθρωπος αναπαύει και το περιβάλλον του και ο ίδιος εξελίσσεται πνευματικά. Γι' αυτό λέω ότι καλά είναι τα φώτα και τα πολύφωτα, οι εφευρέσεις του εγκεφάλου, αλλά ανώτερο είναι το θείο φως της Χάριτος του Θεού, το οποίο φωτίζει τον άνθρωπο. Ο άνθρωπος που έχει θείο φωτισμό βλέπει πολύ καθαρά τα πράγματα, πληροφορείται χωρίς αμφιβολία, και ούτε εκείνος κουράζεται, αλλά και τους άλλους βοηθάει πολύ θετικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Δεύτερο Μέρος – Αγωνιστικότητα και ευλάβεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Όποιος προσέχει και παίρνει στα ζεστά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τό θέμα της σωτηρίας της ψυχής του,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: αγωνίζεται, προκόβει, καρποφορεί,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τρέφεται πνευματικά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί χαίρεται αγγελικά».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Ο «καλός αγών»
- type: h2
  initial:
    ru: ''
  text:
    ru: Αγώνας για τον αγιασμό της ψυχής
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ χαίρομαι, όταν βλέπω ψυχές που προσέχουν και αγωνίζονται μέσα στον κόσμο που γέμισε από ταγκαλάκια. Ο Θεός, σαν καλός και δίκαιος που είναι, έδωσε σε όλους μας και ανάλογα χαρίσματα – π.χ. στους άνδρες τον ανδρισμό και στις γυναίκες την αγάπη –, για να αγωνιζώμαστε και να ανεβαίνουμε την πνευματική κλίμακα με την βοήθεια της θείας Χάριτος και να πλησιάζουμε όλο και περισσότερο σ́ Εκείνον που είναι ο Δημιουργός μας. Ποτέ δεν πρέπει να ξεχνούμε ότι έχουμε δίπλα μας, εκτός από ανθρώπους που μπορούν να μας βοηθήσουν πνευματικά, και τον ίδιο τον Χριστό που μας βοηθάει, την Παναγία, τα Χερουβείμ, τα Σεραφείμ και τους Αγίους Πάντες. Θάρρος λοιπόν! Ο Χριστός είναι πολύ δυνατός, είναι παντοδύναμος, και θα δώση την θεϊκή Του δύναμη, να συντρίψουμε τα κέρατα του πονηρού.Μας παρακολουθεί συνέχεια αοράτως και θα μας ενισχύη, όταν εμείς έχουμε την αγαθή προαίρεση και κάνουμε τον μικρό κατά δύναμιν αγώνα μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο μπορούμε, να αποφεύγουμε τις αφορμές της αμαρτίας. Να προσέχουμε τις αισθήσεις μας, γιατί όλα από εκεί ξεκινούν. Και όταν αυτό καμμιά φορά, ή και πολλές φορές, είναι δύσκολο, να αποφεύγουμε τουλάχιστον την περιέργεια, για να μην παίρνουν τα μάτια μας εικόνες αμαρτωλές, και μας παίζουν μετά οι δαίμονες σινεμάδες. Εάν πιάσουμε ένα καρβουνάκι αναμμένο και το κρατήσουμε στην χούφτα μας, επόμενο είναι να μας κάψη. Εάν όμως το κουνάμε στο χέρι – εννοείται για λίγη ώρα –, δεν θα μας κάψη. Έτσι και οι άσχημες εικόνες, όταν κινούνται σύντομα, τα μάτια δεν τις κρατούν, αλλά απλώς τις πιάνουν, και δεν καίνε την ψυχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι δεν πρόσεξαν και απέκτησαν κακές συνήθειες, όταν ζούσαν κοσμική ζωή, ας δέχωνται αγόγγυστα μετά την μεταστροφή τους τον πόλεμο του εχθρού, χωρίς όμως να καλλιεργούν επιθυμίες κακές. Αν αγωνισθούν έτσι, θα εξαγνισθούν και θα φθάσουν στην κατάσταση των αγνών ανθρώπων, οι οποίοι ούτε αμαρτίες μεγάλες γνώρισαν ούτε κακές συνήθειες απέκτησαν ούτε και μεγάλο πόλεμο δέχονται. Και αν αξιοποιήσουν ως πείρα τις προηγούμενες πτώσεις τους, θα προχωρήσουν πολύ. Αν κάποιος προχωράη μέσα σε ένα ναρκοπέδιο και δεν γνωρίζη την περιοχή, θα είναι αναγκασμένος να προχωράη πολύ αργά και προσεκτικά, αλλιώς θα τιναχθή στον αέρα. Ενώ, αν γνωρίζη λίγο–πολύ την περιοχή, μπορεί να έχη και τραύματα, αλλά, με την πείρα που έχει, προχωράει σταθερά και γρήγορα. Αν ασχοληθή κανείς με το ακαλλιέργητο χωράφι της ψυχής του, θα ξερριζώση όλα τα αγκάθια των παθών της και θα φυτέψη στην θέση τους  αρετές. Αυτή η εργασία όμως είναι επίπονη και χρειάζεται θέληση πολλή και υπομονή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, να μας λέγατε πρακτικά πώς γίνεται η εργασία αυτή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να προσπαθή κανείς κάθε μέρα να τοποθετή μέσα του κάτι το πνευματικό, το οποίο θα απωθή κάτι το κοσμικό και αμαρτωλό, και έτσι σιγά-σιγά θα απεκδυθή τον παλαιό άνθρωπο και στην συνέχεια θα κινήται ελεύθερα στον πνευματικό χώρο. Να τοποθετήση άγιες εικόνες στην μνήμη του αντί αμαρτωλές. Να αντικαταστήση τα τραγούδια με ψαλμωδίες, και τα κοσμικά περιοδικά με πνευματικά βιβλία. Αν ο άνθρωπος δεν ξεκόψη από οτιδήποτε κοσμικό και αμαρτωλό και δεν έχη επικοινωνία με τον Χριστό, με την Παναγία, με τους Αγίους, με την θριαμβεύουσα Εκκλησία, και δεν αφεθή τελείως στα χέρια του Θεού, δεν μπορεί να αποκτήση την πνευματική υγεία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά είναι η πνευματική υγεία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Υγεία πνευματική ίσον αγνοί λογισμοί, φωτισμένος νούς και εξαγνισμένη καρδιά που φιλοξενεί συνέχεια τον Χριστό και την Παναγία. Η πολλή προσοχή με την παρακολούθηση του εαυτού μας και την προσευχή βοηθούν πολύ θετικά να αποκτήσουμε την υγεία της ψυχής. Η προσευχή είναι απαραίτητη για τον εξαγνισμό της ψυχής και η σύνεση για την διατήρηση της καλής πνευματικής καταστάσεως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ζωή βέβαια δεν είναι κατασκήνωση· έχει χαρές, έχει όμως και λύπες. Πριν από την Ανάσταση προηγείται η Σταύρωση. Τα χτυπήματα των δοκιμασιών είναι απαραίτητα για την σωτηρία της ψυχής μας, γιατί αυτά λαμπικάρουν την ψυχή. Όπως συμβαίνει και με τα ρούχα· όσο τα τρίβουμε, όταν τα πλένουμε, τόσο καλύτερα καθαρίζουν. Το ίδιο και με το χταπόδι· όσο το χτυπάμε, τόσο περισσότερο καθαρίζει και μαλακώνει. Και το ψάρι φαίνεται ωραίο, όταν πλέη στην θάλασσα και είναι ζωντανό, ακόμη και όταν είναι στην αγορά με τα λέπια και τα εντόσθιά του, αλλά γίνεται χρήσιμο, μόνον όταν καθαρισθή – ασχημήνη εξωτερικά – και μετά ψηθή. Έτσι και ο άνθρωπος, όταν αποβάλη καθετί κοσμικό, ενώ εξωτερικά φαίνεται ότι χάνει την ζωή, την κοσμική ζωντάνια – τα λέπια –, αδειάζει ό,τι άχρηστο έχει μέσα του, «ψήνεται», και τότε γίνεται χρήσιμος.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί βοηθάει στην πνευματική πρόοδο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι που τους χτύπησαν μερικοί βαρδάρηδες – δοκιμασίες –, είτε γιατί το επέτρεψε ο Θεός, για να τους φρενάρη, είτε από φθόνο του πονηρού, χρειάζονται μετά πολλές λιακάδες και δροσιά πνευματική, για να ανθήσουν και να καρποφορήσουν. Όπως και τα δένδρα, όταν ξεθαρρεύουν από τις χειμωνιάτικες λιακάδες, αλλά τα φρενάρη ο βαρδάρης, χρειάζονται μετά συνέχεια λιακάδες ανοιξιάτικες και βροχούλα, για να κυκλοφορήσουν οι χυμοί και να βγάλουν άνθη και καρπούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, για να πάρη κανείς την πνευματική στροφή, τί χρειάζεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φιλότιμος αγώνας με ελπίδα και εμπιστοσύνη στον Θεό. Η εμπιστοσύνη στον Θεό και η απλότητα με τον φιλότιμο αγώνα φέρνουν την εσωτερική ειρήνη και σιγουριά, και τότε γεμίζει η ψυχή από ελπίδα και χαρά. Χρειάζεται υπομονή, φιλότιμο και πνευματική παλληκαριά, για να στεφανωθή ο αθλητής. Η παλληκαριά ξεπηδάει από την φιλότιμη καρδιά· και όταν κανείς κάνη κάτι με την καρδιά του για τον Χριστό, ούτε κουράζεται ούτε πονάει, γιατί ο πόνος για τον Χριστό είναι γλέντι πνευματικό. Η πνευματική ανάπτυξη μπορεί να γίνη πολύ σύντομα με λίγη φιλότιμη θέληση και παρακολούθηση του εαυτού μας. Στην συνέχεια θα βοηθιέται η ψυχή από τον Χριστό, την Παναγία, τους Αγγέλους και τους Αγίους. Πολύ βοηθάει επίσης η μελέτη, η προσευχή, η εσωστρέφεια, και να ησυχάζη κανείς λίγο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Χριστός μας δυναμώνει αυτούς που αγωνίζονται «τόν καλόν αγώνα»[44], τον οποίο έκαναν όλοι οι Άγιοι, για να υποτάξουν την σάρκα στο πνεύμα. Ακόμη και όταν τραυματισθούμε, δεν πρέπει να χάσουμε την ψυχραιμία μας, αλλά να ζητήσουμε την βοήθεια του Θεού και να συνεχίσουμε τον αγώνα με γενναιότητα. Θα ακούση ο Καλός Ποιμήν και θα σπεύση αμέσως, όπως ο βοσκός, μόλις ακούση ένα αρνάκι να βελάζη θλιβερά, όταν πληγώνεται, ή κάποιος λύκος ή σκύλος το δαγκώνη, τρέχει, για να το βοηθήση. Περισσότερο έχω αγαπήσει, έχω πονέσει και τους έχω στον νού μου συνέχεια αυτούς που είχαν ελεεινή ζωή και αγωνίζονται, παρά αυτούς που δεν βασανίζονται από πάθη. Και ο τσομπάνος το πληγωμένο ή αρρωστιάρικο αρνί πονάει περισσότερο και το περιποιείται ιδιαίτερα, μέχρι να πάρη επάνω του και αυτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εάν πάλι αγωνιζώμαστε σωστά, αλλά δεν βλέπουμε καμμιά πρόοδο, συμβαίνει μερικές φορές το εξής: Ο δαίμονας, επειδή του κηρύξαμε τον πόλεμο, ζήτησε ενίσχυση από τον σατανά[45]. Έτσι, εάν πέρυσι πολεμούσαμε με έναν δαίμονα, εφέτος πολεμάμε με πενήντα, του χρόνου θα πολεμάμε με περισσότερους κ.ο.κ. Αυτό δεν επιτρέπει ο Θεός να το δούμε, για να μην υπερηφανευθούμε. Χωρίς εμείς να το καταλαβαίνουμε, ο Θεός εργάζεται στην ψυχή μας, όταν βλέπη καλή διάθεση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κανείς αγωνίζεται και πράγματι δεν προοδεύη, τί φταίει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να αγωνίζεται υπερήφανα. Αλλά να σάς πω και τί παθαίνουν μερικοί και δεν προοδεύουν; Ενώ έχουν προϋποθέσεις, τις σπαταλούν σε μικροπράγματα και μετά δεν έχουν δυνάμεις, για να ανταποκριθούν στον πνευματικό αγώνα. Ας πούμε ότι ξεκινάμε να κάνουμε μια επίθεση στον εχθρό και ετοιμαζόμαστε με όλα τα απαραίτητα, για να τον αντιμετωπίσουμε. Εκείνος όμως, επειδή φοβάται ότι δεν θα τα βγάλη πέρα, προσπαθεί να μας διασπάση και να τραβήξη αλλού την προσοχή μας με σαμποτάζ και προσβολές σε άλλα σημεία. Εμείς τότε στρέφουμε την προσοχή μας εκεί. Στέλνουμε δυνάμεις δεξιά και αριστερά. Ο καιρός περνά· τα πολεμοφόδια και τα τρόφιμα λιγοστεύουν. Δίνουμε παλιό ρουχισμό στο στράτευμα. Οι στρατιώτες αρχίζουν να γογγύζουν. Και το αποτέλεσμα είναι να εξαντληθούν όλες οι δυνάμεις μας και να μην αντιμετωπίσουμε τον εχθρό. Έτσι κάνουν και μερικοί πάνω στον πνευματικό αγώνα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στην πνευματική πρόοδο δεν βοηθάει και το περιβάλλον;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, βοηθάει, αλλά μερικές φορές μπορεί ένας να ζη ανάμεσα σε Αγίους και να μην κάνη προκοπή. Υπήρχε μεγαλύτερη προϋπόθεση για τον Ιούδα, που ήταν συνέχεια μαζί με τον Χριστό; Ο Ιούδας δεν είχε ταπείνωση ούτε καλή διάθεση. Και μετά την προδοσία του πάλι δεν ταπεινώθηκε· βρόντησε τα αργύρια με θυμό και εγωισμό και πήγε με πονηριά στην αγχόνη. Και οι Φαρισαίοι κινήθηκαν σαν τον διάβολο. Αφού έγινε η δουλειά τους, είπαν στον Ιούδα: «Σύ όψει»[46]. Ο Θεός ενεργεί ανάλογα με την κατάσταση του ανθρώπου. Το Πνεύμα το Άγιο δεν εμποδίζεται από τίποτε. Αυτό που κατάλαβα είναι ότι, όπου και αν βρεθή κανείς, αν αγωνισθή φιλότιμα, μπορεί να πετύχη το ποθούμενο, την σωτηρία της ψυχής του. Εδώ ο Λώτ ζούσε μέσα στα Σόδομα και στα Γόμορρα και σε τί κατάσταση πνευματική ήταν[47]! Τώρα, είτε το θέλουμε είτε δεν το θέλουμε, πρέπει να αγωνισθούμε να γίνουμε καλύτεροι, ώστε να ενεργή η θεία Χάρις μέσα μας. Τα γεγονότα μας αναγκάζουν και θα μας αναγκάσουν να πλησιάσουμε περισσότερο στον Θεό, για να έχουμε θεϊκή δύναμη, ώστε να αντιμετωπίζουμε σωστά κάθε κατάσταση – και φυσικά ο Καλός Θεός δεν θα μας αφήση· θα μας προστατεύση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως να ξέρουμε, όταν καλυτερεύουμε την πνευματική μας κατάσταση, τότε και εμείς νιώθουμε καλύτερα, αλλά και τον Χριστό χαροποιούμε. Ποιός μπορεί να φαντασθή την μεγάλη χαρά που αισθάνεται ο Χριστός, όταν τα παιδιά Του προχωρούν; Εύχομαι να κάνουν όλοι οι άνθρωποι πνευματική προκοπή και να ενωθούν με τον Χριστό, που είναι το Α και το Ω. Όταν από το Α και το Ω εξαρτάται όλη η ζωή μας, τότε όλα είναι αγιασμένα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πνευματική μελέτη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, άνθρωποι που αρχίζουν να έχουν την καλή ανησυχία, τί βιβλία να διαβάσουν, για να βοηθηθούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να διαβάσουν πρώτα το Ευαγγέλιο, για να μάθουν τί θα πη Χριστός. Να συγκλονισθούν λίγο, και ύστερα να διαβάσουν την Παλαιά Διαθήκη. Ξέρεις τί κόπος είναι, όταν δεν έχουν διαβάσει τίποτε και σού ζητούν βοήθεια; Σαν να πηγαίνη ένα παιδί του Δημοτικού Σχολείου σε καθηγητή Πανεπιστημίου και να του λέη: «Βοήθησέ με». Τί να του πη ο καθηγητής; «Ένα και ένα ίσον δύο»; Άλλοι πάλι δεν έχουν την καλή ανησυχία· έρχονται και λένε: «Δεν έχω κανένα πρόβλημα, μια χαρά είμαι, Πάτερ, απλώς πέρασα να σε δώ». Ποτέ ο άνθρωπος δεν μπορεί να πη ότι δεν έχει τίποτε. Κάτι θα έχη. Ο αγώνας για πνευματική ζωή δεν τελειώνει ποτέ. Ή μερικοί μου λένε: «Να μας πής πνευματικά». Σαν να πάνε στον μπακάλη και του λένε: «Δώσ́ μας ψώνια». Τα χάνει και ο μπακάλης. Δεν έχουν κάτι το συγκεκριμένο να ζητήσουν και να πούν «μού χρειάζεται τόση ζάχαρη, τόσο ρύζι κ.λπ.», αλλά λένε «δώσ́ μας ψώνια». Ή σαν να πάνε στον φαρμακοποιό και του λένε «δώσ́ μας φάρμακα!», χωρίς να του πούνε προηγουμένως από τί πάσχουν ή αν πήγαν στον γιατρό και τί τους είπε ο γιατρός. Άντε τώρα να βρής άκρη! Βλέπεις, εκείνος που έχει πνευματική ανησυχία, βρίσκει τί του λείπει, το ζητάει και ωφελείται. Εγώ, ως αρχάριος, όταν διάβαζα κάτι, το αντέγραφα, για να μην το ξεχάσω, και προσπαθούσα να το εφαρμόσω. Δεν διάβαζα, για να περνάω ευχάριστα την ώρα μου. Υπήρχε μέσα μου η καλή ανησυχία καί, όταν δεν καταλάβαινα κάτι, ρωτούσα να μάθω πώς είναι. Λίγο διάβαζα, πολύ ήλεγχα τον εαυτό μου με αυτά που διάβαζα. «Που βρίσκομαι; Τί κάνω;». Κάθιζα τον εαυτό μου στο σκαμνί. Δεν τα περνούσα αυτά που διάβαζα έτσι αφορολόγητα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα οι άνθρωποι καταλήγουν από την πολλή μελέτη να είναι μαγνητόφωνα και να γεμίζουν τις κασσέττες τους με περιττά πράγματα. «Η άνευ πράξεως» όμως διδασκαλία είναι κατά τον Αββά Ισαάκ «παρακαταθήκη εντροπής»[48]. Βλέπεις, πολλοί που ενδιαφέρονται για τον αθλητισμό διαβάζουν αθλητικά περιοδικά ή εφημερίδες και κάθονται. Μπορεί να είναι σαν τα μοσχάρια, αλλά θαυμάζουν τους αθλητές: «Ά, καταπληκτικός αυτός, λένε, μπράβο! Ώ!...». Δεν χύνουν όμως λίγο ιδρώτα ούτε χάνουν κανένα κιλό βάρος. Διαβάζουν–διαβάζουν αθλητικά και ξαπλώνουν· έτσι δεν ωφελούνται. Μένουν με την ευχαρίστηση του διαβάσματος. Οι κοσμικοί, άλλοι διαβάζουν εφημερίδα, άλλοι διαβάζουν ένα ρομάντζο, μια περιπέτεια, άλλοι παρακολουθούν στο γήπεδο πώς παίζουν, και περνάνε την ώρα τους. Το ίδιο κάνουν και μερικοί που διαβάζουν πνευματικά. Μπορεί να ξενυχτούν και να διαβάζουν πνευματικά βιβλία με μανία και να ευχαριστιούνται. Παίρνουν ένα πνευματικό βιβλίο, κάθονται και λίγο αναπαυτικά και διαβάζουν. «Ωφελήθηκα», λέει ο άλλος. Καλύτερα πές ότι ευχαριστήθηκες, ότι πέρασες ευχάριστα την ώρα σου. Γιατί αυτό δεν είναι ωφέλεια. Ωφελείσαι, μόνον όταν δής τί λέει αυτό που διαβάζεις, ελέγχης τον εαυτό σου και προσπαθής να τον ζορίζης στην εφαρμογή: «Τί λέει αυτό που διάβασα; Εγώ που βρίσκομαι πνευματικά; Τί πρέπει να κάνω;». Ύστερα, όσο περισσότερα μαθαίνει κανείς, τόσο περισσότερη ευθύνη έχει. Δεν λέω να μη διαβάζη, για να μην ξέρη πολλά και να μην έχη ευθύνη, γιατί αυτό είναι πονηριά, αλλά να μη διαβάζη μόνο για να ευχαριστιέται. Το κακό είναι ότι, αν διαβάζη και έχη δυνατή μνήμη, θυμάται πολλά, μπορεί και να λέη και πολλά και να ξεγελάη τον εαυτό του, να νομίζη δηλαδή ότι τα εφαρμόζει κιόλας. Έτσι δημιουργεί ψευδαίσθηση και στον εαυτό του και στους άλλους. Γι᾿ αυτό μην αναπαύετε τον λογισμό σας στα πολλά διαβάσματα. Να στραφήτε στην εφαρμογή. Τα πολλά διαβάσματα μορφώνουν εγκυκλοπαιδικά. Έτσι δεν λέγεται;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκοπός όμως είναι πώς θα μορφωθώ θεοκεντρικά. Δεν πάω να γίνω καθηγητής Πανεπιστημίου, ώστε να είμαι υποχρεωμένος να ξέρω πολλά. Αλλά και αν μου χρειασθή κάτι από την άλλη γνώση, εύκολα θα το μάθω, όταν αποκτήσω την θεοκεντρική μόρφωση. Κατάλαβες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν έχη κανείς περισπασμό, συμφέρει να συγκεντρωθή με την μελέτη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, να διαβάση λίγο, κάτι πολύ δυνατό, για να θερμανθή η ψυχή. Έτσι καπακώνονται οι μέριμνες και ο νούς μεταφέρεται σε θείο χώρο. Αλλιώς πάει ο νούς σ᾿ αυτήν ή σ᾿ εκείνη την δουλειά, εκεί που σύχναζε τις περισσότερες ώρες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν είναι κανείς κουρασμένος ή στενοχωρημένος, θέλει να διαβάση κάτι εύκολο, κανένα διήγημα, κανένα μυθιστόρημα κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν υπάρχει κανένα πνευματικό βιβλίο που να είναι καλό για εκείνη την ώρα; Ο σκοπός δεν είναι να ξεχάση ο άνθρωπος την στενοχώρια του, αλλά να λυτρωθή. Το άλλο δεν λυτρώνει. Δεν βοηθούν στην πνευματική ζωή τα μυθιστορήματα ή η εφημερίδα και η τηλεόραση. Πολλές φορές ακόμη και μερικά θρησκευτικά περιοδικά κάνουν ζημιά στους Χριστιανούς, γιατί διεγείρουν τον μωρό ζήλο και προκαλούν σύγχυση. Προσέξτε· μη διαβάζετε περιττά πράγματα τις ελεύθερες ώρες σας. Μερικά αναγνώσματα είναι σαν να τρώς νεροκολοκύθες, σαν να ψάχνης στα άχυρα, να βρής ένα σπυρί σιτάρι. Λένε μερικοί: «Ναί, αλλά αυτά με ξεκουράζουν». Μά πώς σε ξεκουράζουν, ευλογημένε, αφού σε ζαλίζουν και πονούν τα μάτια σου; Καλύτερα να κοιμηθής, για να ξεκουρασθής. Από το τί διαβάζει κανείς, θα καταλάβης την πνευματική του κατάσταση. Αν είναι πολύ κοσμικός, θα διαβάζη περιοδικά αισχρά. Αν είναι λίγο κοσμικός, θα διαβάζη λιγώτερο βρώμικα ή εφημερίδες. Αν θρησκεύη, θα διαβάζη θρησκευτικά έντυπα ή σύγχρονα θρησκευτικά βιβλία ή πατερικά κ.ο.κ.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά πνευματικά βιβλία βοηθούν περισσότερο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολύ ωφελούν τα διάφορα πατερικά βιβλία, που στις μέρες μας, δόξα τω Θεώ, κυκλοφορούν κατά χιλιάδες. Σ᾿ αυτά βρίσκει κανείς ό,τι ποθεί, ό,τι του χρειάζεται. Είναι γνήσια πνευματική τροφή και οδηγούν με ασφάλεια στον πνευματικό δρόμο. Για να βοηθήσουν όμως, πρέπει να διαβάζωνται με ταπείνωση και προσευχή. Τα πατερικά κείμενα μοιάζουν με αξονικές τομογραφίες, γιατί όπως σ́ εκείνες φωτογραφίζεται η σωματική κατάσταση του ανθρώπου, έτσι και σ́ αυτά φωτογραφίζεται η πνευματική του κατάσταση. Κάθε πρόταση των πατερικών κειμένων δεν κρύβει ένα αλλά πολλά νοήματα, και καθένας τα καταλαβαίνει ανάλογα με την πνευματική του κατάσταση. Καλό είναι να διαβάζη κανείς κείμενο και όχι μετάφραση, επειδή ο μεταφραστής ερμηνεύει το πρωτότυπο ανάλογα με την δική του πνευματικότητα. Πάντως, για να κατανοήση κανείς τους Πατέρες, πρέπει να σφίξη τον εαυτό του, να συγκεντρώση τον νού του και να ζη πνευματικά, γιατί το πνεύμα των Πατέρων γίνεται αντιληπτό μόνο με το πνεύμα. Ειδικά οι Ασκητικοί Λόγοι του Αββά Ισαάκ του Σύρου πολύ βοηθούν, αλλά χρειάζεται να τους μελετάη λίγο–λίγο, για να αφομοιώνη την τροφή. Ο Ευεργετινός[49]είναι ευεργεσία μεγάλη, γιατί μπορούμε να γνωρίσουμε όλο το πνεύμα των Αγίων Πατέρων. Βοηθάει, γιατί περιγράφει τους αγώνες των Πατέρων για όλα τα πάθη με την σειρά, και η ψυχή γνωρίζει πώς εκείνοι δούλεψαν και βοηθιέται. Τα Συναξάρια πάλι είναι αγιασμένη ιστορία, γι' αυτό πολύ βοηθούν – ιδίως τα παιδιά – , αλλά να μην τα διαβάζουμε σαν ιστορίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν χρειάζεται να έχουμε γνώση πολλή, για να αποκτήσουμε ευλάβεια. Εάν τα λίγα που ξέρουμε τα συλλογιζώμαστε, θα κεντηθή η καρδιά. Ένας από ένα τροπάριο τινάζεται στον αέρα, και άλλος τα ξέρει όλα απ' έξω και δεν νιώθει τίποτε, γιατί κινείται έξω από την πνευματική πραγματικότητα. Διαβάζετε λοιπόν Πατέρες, έστω μια ή δυο γραμμές την ημέρα. Είναι βιταμίνες πολύ δυναμωτικές.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Οι αληθινοί προσκυνηταί...»[50]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί λένε: «Σ᾿ αυτόν τον Ναό τον μικρό, τον κατανυκτικό, ζώ την Θεία Λειτουργία· στον μεγάλο Ναό δεν την ζώ. Αν είναι κανένα εξωκλήσι σοβατισμένο άσπρο, δεν νιώθω τίποτε· αν όμως είναι αγιογραφημένο, έχη καλό τέμπλο κ.λπ., εκεί ζώ την Θεία Λειτουργία!». Αυτά είναι για έναν άνθρωπο που δεν έχει όρεξη να φάη και του βάζεις λίγο αλάτι, λίγο πιπέρι, για να του έρθη η όρεξη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, αυτά δεν παίζουν κάποιο ρόλο; Δεν βοηθούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, δεν λέω, βοηθούν και αυτά, αλλά να μη σκαλώνη κανείς σ́ αυτά. Διαφορετικά, με μαγικό τρόπο θα ζητά ο άνθρωπος να ζήση τον Χριστό. Θα ζητά κελλί σκοτεινό, κανδήλι με χαμηλό φώς, κατανυκτικό Ναό. Χωρίς αυτά δεν θα μπορή να προσευχηθή. Ή στο τραίνο βρίσκεται ή στην σπηλιά ή στον δρόμο, να είναι το ίδιο γι' αυτόν. Ο Θεός τον κάθε άνθρωπο τον έχει κάνει και ένα εκκλησάκι[51]και μπορεί να το φέρνη παντού μαζί του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλοι ψάχνουν την ανάπαυση, αλλά η ανάπαυση έρχεται από μέσα μας. Και αυτοί οι καημένοι που πάνε από προσκύνημα σε προσκύνημα ψάχνουν να βρουν τον Χριστό, ενώ ο Χριστός είναι κοντά τους. Και ενώ μπορούν να Τον βρουν χωρίς κόπο, κουράζονται και τελικά δεν Τον βρίσκουν. Ένας σωστός πνευματικός άνθρωπος δεν αναπαύεται να γυρίζη και να βλέπη διάφορα αξιοθέατα. Αυτό είναι για όσους υποφέρουν, για να ξεχνούν λίγο την στενοχώρια τους. Ένας πνευματικός άνθρωπος που έχει την θεία παρηγοριά δεν τα χρειάζεται αυτά. Και αν δεν έχη την θεία παρηγοριά μέσα του, τότε δεν διαφέρει από τον κοσμικό. Οι βλέψεις του και τα ενδιαφέροντά του θα είναι πάλι κοσμικά· δεν θα είναι πνευματικά. Πάλι θα κοιτάζη πώς να αναπαυθή με κάτι το κοσμικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλοί έρχονται στο Άγιον Όρος, επισκέπτονται διάφορους Πατέρες, ενθουσιάζονται με αυτά που ακούν από τον καθένα, τα ερμηνεύουν με τον δικό τους τρόπο, τα μπλέκουν και λένε κιόλας: «Πολύ καλά περάσαμε». Ενώ, αν επισκέπτονταν έναν Πατέρα, τον συμβουλεύονταν και προσπαθούσαν να εφαρμόσουν ό,τι τους είπε, θα είχαν θετική βοήθεια. Τώρα αυτό που κάνουν είναι ένας πνευματικός τουρισμός· χάνουν τις ώρες τους, ταλαιπωρούνται άσκοπα και δεν ωφελούνται. Πόσο ξεκούραστο θα ήταν, αν στέκονταν σε έναν Πατέρα και εφήρμοζαν ό,τι άκουσαν! Διότι τότε θα ένιωθαν την εσωτερική ξεκούραση, ενώ τώρα γυρίζουν από τόπο σε τόπο και ξεκουράζονται από τα πράσινα τοπία του Αγίου Όρους σαν κοσμικοί.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι και μερικοί που λένε: «Θα πάω στην μία Παναγία, θα πάω στην άλλη Παναγία!». Η Παναγία είναι μία. Δεν είναι ότι το κάνουν από ευλάβεια, αλλά γιατί θέλουν να βγουν έξω, να ξεσκάσουν. Από εκεί να καταλάβης ότι οι άνθρωποι δεν έχουν ηρεμία. Αν δεν έχη κανείς ευλάβεια, ταπείνωση, και μέσα στο Κουβούκλιο του Παναγίου Τάφου να τον βάλης, τίποτε δεν θα δή. Ενώ, αν έχη ευλάβεια, και στον Γολγοθά μπορεί να δη το Άγιο Φώς. Κάποτε ένας δόκιμος από την Ιερά Μονή του Αγίου Σάββα πήγε το Μέγα Σάββατο να πάρη Άγιο Φώς από τον Πανάγιο Τάφο για το μοναστήρι του – υπάρχει συνήθεια να στέλνουν τα γύρω μοναστήρια μοναχούς, για να πάρουν το Άγιο Φώς. Αυτός έκανε μια πονηριά· επειδή φορούσε ράσα, παραμέρισε τους κοσμικούς και μπήκε μπροστά. Ύστερα, όταν ήρθαν κάποιοι κληρικοί, τον παραμέρισαν αυτόν, επειδή ήταν κανονισμένο ποιός θα καθήση εδώ, ποιός εκεί. Τότε τα έβαλε με τον εαυτό του ο δόκιμος: «Βρέ ταλαίπωρε αμαρτωλέ, χαμένε άνθρωπε, με όλα τα χάλια σου προχώρησες και μπροστά; Να τσακιστής να φύγης από εδώ. Ούτε μέσα στον Ναό δεν είσαι άξιος να μείνης». Τα πίστευε αυτά που έλεγε. Βγήκε λοιπόν έξω από τον Ναό και παρακαλούσε τον Χριστό: «Χριστέ μου, Σε παρακαλώ, ας με ανεχθής να πάω σε κανένα άλλο προσκύνημα». Και πήγε μετά πιο πάνω στον Γολγοθά. Εκεί ελεεινολογούσε πάλι τον εαυτό του: «Ακούς, να κάνω τέτοια πονηριά! Επειδή φοράω ράσα, παραμέρισα εγώ ο ελεεινός τους άλλους που είναι καλύτεροι από μένα...». Και ενώ ελεεινολογούσε τον εαυτό του, βγήκε σε μια στιγμή από τον Άγιο Γολγοθά, σαν αστραπή, ένα δυνατό φως που τον διέλυσε. Τότε ο καημένος είπε: «Κατέβηκε το Άγιο Φώς». Πήγε, πήρε Άγιο Φώς με το φαναράκι του από ᾿κεί και έφυγε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δηλαδή δεν βοηθούν τα προσκυνήματα που γίνονται λ.χ. στους Αγίους Τόπους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε να σού πώ. Σήμερα, αν πάς, για να ωφεληθής λίγο, πρέπει να βλαφθής πολύ μέσα στα τραίνα, στα αεροπλάνα, στα ξενοδοχεία. Όλα έχουν κοσμικοποιηθή. Τί θα ωφεληθή κανείς, αν πάη σε έναν πνευματικό χώρο και δη και μια μεγάλη κοσμική αταξία; Πρέπει να είναι πολύ δυνατός, για να τα αξιοποιήση όλα προς το καλό. Και εκεί στα προσκυνήματα αυτός που μιλάει και εξηγεί, όταν πηγαίνουν με γκρούπ, είναι καλύτερα σε μερικές περιπτώσεις να μη μιλάη. Γιατί δεν λέει με ευλάβεια λ.χ. «αυτή είναι η Γεθσημανή, εδώ είναι ο Πανάγιος Τάφος κ.λπ.», αλλά αρχίζει βρρρρ: «Εδώ είναι αυτό, εκεί είναι το άλλο, τώρα θα πάμε στην Βηθλεέμ, όπου ήρθαν οι Μάγοι από την Περσία», και σιγά-σιγά πάει τους προσκυνητές στό... Κουβέιτ! Έτσι δεν αφήνει και έναν που διάβασε Αγία Γραφή και ξέρει ότι εδώ είναι ο Πανάγιος Τάφος, εκεί η Γεθσημανή κ.λπ. να συγκεντρωθή και να προσευχηθή. Αυτά χρειάζονται μόνο σε έναν που δεν διάβασε Αγία Γραφή, αλλά όσοι πάνε για προσκύνημα στους Αγίους Τόπους έχουν διαβάσει Αγία Γραφή. Αντί δηλαδή να βοηθηθούν οι άνθρωποι, ζαλίζονται. Εν τω μεταξύ φεύγουν αμέσως από το ένα προσκύνημα και πάνε στο άλλο, και ούτε καν ποτίζει μέσα τους αυτό που ακούν. Άλλο είναι, όταν κανείς πηγαίνη προσκύνημα με πνευματική συντροφιά και πνευματικό συνοδό και έχη κάνει προηγουμένως και μια ανάλογη προετοιμασία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έλεγε μια Φαρασιώτισσα που έμενε στα Γιαννιτσά: «Χατζήδες είναι αυτοί; Σε μισή ώρα πάνε στα Ιεροσόλυμα και σε μισή ώρα γυρνάνε! Χατζήδες είναι;». Παλιά οι καημένοι έμεναν στα προσκυνήματα και έκαναν αγρυπνίες, για να ωφελούνται πνευματικά, αλλά και για να μην κάνουν έξοδα μένοντας σε ξενοδοχεία, και τα χρήματα τα έδιναν ελεημοσύνη. Και αν κανείς δεν είχε καμμιά πνευματική αλλοίωση, όταν επέστρεφε, του έλεγαν: «Σκόρδο πήγες, κρεμμύδι γύρισες». Ο Άγιος Αρσένιος πήγαινε κάθε δέκα χρόνια στα Ιεροσόλυμα και βάδιζε πέντε μέρες με τα πόδια μέχρι την Μερσίνα, για να πάρη το καράβι. Σήμερα σπάνια να βρής τέτοιες περιπτώσεις. Θυμάμαι, είχε έρθει στο Καλύβι ένας Ρώσος από το Βλαδιβοστόκ, απέναντι από την Ιαπωνία. Είχε τάξει να πάη στους Αγίους Τόπους με τα πόδια. Όταν πήγε να πάρη ευλογία από τον Δεσπότη του, εκείνος του είπε: «Δεν είσαι καλά, που θα πάς με τα πόδια». Γι'' αυτό πήγε στο Μοναστήρι του Ζαγκόρσκ στην Μόσχα και πήρε ευλογία από έναν Στάρετς. Ξεκίνησε από εκεί το Πάσχα με τα πόδια και έφθασε στα Ιεροσόλυμα τον Οκτώβριο. Εβδομήντα χιλιόμετρα την ημέρα βάδιζε. Ήρθε μετά και στο Άγιον Όρος με τα πόδια και θα ξαναπήγαινε στα Ιεροσόλυμα. Είχε πραγματικό θείο έρωτα. Ζούσε σε άλλον κόσμο. Ήξερε λίγα ελληνικά και συνεννοούμασταν. «Νόμιζα, μου είπε, ότι θα είναι εκεί ο Αντίχριστος, για να μαρτυρήσω, να μου κόψη το κεφάλι, αλλά δεν ήταν! Τώρα που θα ξαναπάω στα Ιεροσόλυμα, θα βάλω μια μετάνοια στον Πανάγιο Τάφο και για σένα, και εσύ να μνημονεύης το όνομά μου». Σηκώθηκε επάνω και έκανε μια μετάνοια, για να μου δείξη πώς θα κάνη, και χτύπησε το κεφάλι του πάνω σε μια πέτρα. Έβλεπες μια φλόγα μέσα του. Ενώ άλλοι, έτσι όπως πάνε στους Αγίους Τόπους για τουρισμό και χωρίς ευλάβεια, είναι καλύτερα να μην πάνε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσο έντονη είναι η παρουσία του Χριστού στους Αγίους Τόπους! Στον δρόμο λ.χ. που πάει κανείς προς τον Γολγοθά αισθάνεται μια αλλοίωση. Και να μην ξέρη που πηγαίνει, αν περπατήση εκεί, συγκλονίζεται. Έχει και μια πινακίδα που γράφει στα Λατινικά «via Dolorosa»[52]. Και στον Πανάγιο Τάφο βλέπεις διάφορους ανθρώπους· μια ποικιλία. Άλλοι είναι κληρικοί, άλλοι κοσμικοί, άλλοι ντυμένοι σεμνά, άλλοι άσεμνα, άλλοι με μακριά ρούχα, άλλοι με κοντά, άλλοι σχεδόν χωρίς ρούχα, άλλοι κουρεμένοι, άλλοι με μαλλιά μακριά... Διάφορος κόσμος, διάφορες μόδες, διάφορες φυλές, από διάφορα δόγματα· άλλος Ρωμαιοκαθολικός, άλλος Αρμένιος, αλλά όλοι πηγαίνουν και προσκυνούν εκεί! Μου έκανε εντύπωση! Είναι συγκινητικό. Αλλά πρέπει να τα μελετά κανείς όλα αυτά με καλό λογισμό, για να συγκινήται και να τον ανεβάζουν πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κανείς δεν έχη επιθυμία να πάη, είναι έλλειψη ευλαβείας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι. Εγώ δεν έχω πάει ούτε σε όλα τα μοναστήρια του Αγίου Όρους ούτε σε πολλά προσκυνήματα. Δεν πήγα λ.χ. στον Άγιο Ιωάννη τον Ρώσο· αυτό όμως δεν σημαίνει ότι δεν ευλαβούμαι τον Άγιο. Καλά είναι να έχουμε την ευλάβεια για έναν Άγιο σε ένα προσκύνημα, αλλά να μην τρέχουμε, για να πάμε. Να πηγαίνουμε, όταν δοθή κάποια ευκαιρία ή όταν υπάρξη κάποιος λόγος. Σημασία έχει αυτό που είπε ο Χριστός στην Σαμαρείτιδα: «Οι αληθινοί προσκυνηταί προσκυνήσουσι τω Πατρί εν πνεύματι και αληθεία».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η σωτηρία της ψυχής μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, άλλοι νιώθουν σιγουριά ότι θα σωθούν και άλλοι αμφιβάλλουν. Ποιά είναι πιο σωστή τοποθέτηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο σκοπός είναι ο άνθρωπος να τηρή τις εντολές του Θεού. Ο πνευματικός άνθρωπος πρέπει να φθάση σε τέτοια κατάσταση, πού, και αν ο Θεός δεν του δώση τον Παράδεισο, να μην τον πειράξη. Πρέπει να καταλάβουμε καλά ότι σήμερα ζούμε, αύριο μπορεί να φύγουμε, και πρέπει να κοιτάξουμε πώς θα πάμε κοντά στον Χριστό. Όσοι κατόρθωσαν με την Χάρη του Θεού να γνωρίσουν την ματαιότητα αυτής της ζωής έλαβαν το μεγαλύτερο χάρισμα και δεν είναι ανάγκη να αποκτήσουν το διορατικό χάρισμα, για να προβλέπουν τα μέλλοντα, διότι αρκετό είναι κανείς να προβλέψη, να μεριμνήση για την σωτηρία της ψυχής του και να λάβη τα καλύτερα πνευματικά μέτρα, για να σωθή. Νά, βλέπεις, ο Χριστός είπε: «Όσο αξίζει μια ψυχή, δεν αξίζει ο κόσμος όλος»[53]. Πόση αξία δηλαδή έχει μια ψυχή! Γι᾿ αυτό η σωτηρία της ψυχής είναι μεγάλο πράγμα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, δεν πρέπει να έχη κανείς την ελπίδα της σωτηρίας και τον φόβο της κολάσεως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν έχη την ελπίδα της σωτηρίας, δεν θα έχη τον φόβο της κολάσεως. Και για να έχη ο άνθρωπος την ελπίδα της σωτηρίας, θα είναι κάπως τακτοποιημένος. Τον άνθρωπο που αγωνίζεται με φιλότιμο, όσο μπορεί, και δεν έχει διάθεση να κάνη αταξίες, αλλά πάνω στον αγώνα του νικιέται–νικάει, νικιέται–νικάει, ο Θεός δεν θα τον αφήση. Αν έχη λίγη διάθεση να μη λυπήση τον Θεό, θα πάη στον Παράδεισο «μέ τα παπούτσια». Ο φύσει Αγαθός Θεός θα τον σπρώξη στον Παράδεισο σκανδαλωδώς. Θα οικονομήση να τον πάρη την ώρα που βρίσκεται σε μετάνοια. Μπορεί σε όλη του την ζωή να παλεύη, αλλά ο Θεός δεν θα τον αφήση· θα τον πάρη στην καλύτερη ώρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός είναι καλός· θέλει όλοι να σωθούμε. Αν ήταν να σωθούν μόνο λίγοι, τότε γιατί σταυρώθηκε ο Χριστός; Δεν είναι στενή η πύλη του Παραδείσου. Χωράει όλους τους ανθρώπους που σκύβουν ταπεινά και δεν είναι φουσκωμένοι από υπερηφάνεια, αρκεί να μετανοήσουν, να δώσουν δηλαδή το φορτίο των αμαρτιών τους στον Χριστό, και τότε χωρούν να περάσουν εύκολα από την πύλη. Έπειτα, έχουμε και το δικαιολογητικό ότι είμαστε χωματένιοι· δεν είμαστε μόνον πνεύμα όπως οι Άγγελοι. Είμαστε όμως αδικαιολόγητοι, όταν δεν μετανοούμε και δεν πλησιάζουμε τον Σωτήρα μας ταπεινά. Ο ληστής στον σταυρό ένα «ευλόγησον» είπε και σώθηκε[54]. Η σωτηρία του ανθρώπου εξαρτάται από το δευτερόλεπτο, όχι από το λεπτό. Ο άνθρωπος με έναν ταπεινό λογισμό σώζεται, ενώ, αν φέρη έναν υπερήφανο λογισμό, τα χάνει όλα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Από φιλότιμο και μόνον πρέπει να σωθούμε. Δεν υπάρχει μεγαλύτερος πόνος για τον Θεό από το να δη τον άνθρωπο στην κόλαση. Νομίζω ότι και μόνον η ευγνωμοσύνη στον Θεό για τις πολλές Του ευλογίες και η ταπεινή συμπεριφορά με αγάπη προς τις εικόνες Του, τους συνανθρώπους μας, με λίγο φιλότιμο αγώνα, είναι αρκετά, για να έχουμε αναπαυμένη την ψυχή μας και σ᾿ αυτήν την ζωή και στην άλλη[55].
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Πώς εργάζεται ο διάβολος
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος προσπαθεί να αχρηστέψη τον αγωνιστή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, μερικές φορές οι πειρασμοί έρχονται ο ένας πάνω στον άλλον και δεν αντέχω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να σού πω μια λύση, για να τους αποφύγης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θα την δεχθής;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η μόνη λύση για να αποφύγης τους πειρασμούς είναι νά... συμμαχήσης με τον διάβολο!... Τί γελάς; Δεν σού αρέσει αυτή η λύση; Κοίταξε να σού πώ. Όσο κανείς αγωνίζεται, θα έχη πειρασμούς και δυσκολίες. Και όσο προσπαθεί να αποφύγη τον πειρασμό, τόσο κόντρα του πάει ο διάβολος. Αλλά με τους πειρασμούς – αν τους αξιοποιήσουμε σωστά –, δίνεται η ευκαιρία, επειδή μερικές φορές η ζωή μας είναι αντιευαγγελική, να γίνη «ευαγγελική».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σκαλώνω σε μερικά ασήμαντα πράγματα και δεν έχω μετά διάθεση να αγωνισθώ για κάτι ανώτερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτά είναι σαν τις νάρκες που βάζει ο εχθρός, για να αχρηστέψη τον στρατό. Το ταγκαλάκι, όταν δη ότι δεν μπορεί να κάνη άλλη ζημιά στον αγωνιστή, κοιτάει πώς να τον αχρηστέψη με ασήμαντα πράγματα. Ύστερα, να ξέρης ότι υπάρχουν και μικρά ταγκαλάκια, που κάνουν όμως μεγάλη ζημιά. Μια φορά ρώτησαν ένα μικρό ταγκαλάκι: «Τάχα τί μπορείς να κάνης εσύ;». «Εγώ τί μπορώ να κάνω; Πάω και μπερδεύω τις κλωστές στις μοδίστρες, στους τσαγκάρηδες, απάντησε, και τους κάνω να θυμώνουν». Τα μεγαλύτερα σκάνδαλα γίνονται από τιποτένια πράγματα, όχι μόνο σ́ εμάς, αλλά μερικές φορές και στα κράτη. Στους πνευματικούς ανθρώπους δεν υπάρχουν σοβαρές αφορμές για σκάνδαλα· από τα μικρά παίρνει ο διάβολος αφορμή. Τσακίζει τον άνθρωπο ψυχικά με κάτι χαζά, παιδικά πράγματα, οπότε κάνει την καρδιά του όπως εκείνος θέλει και μένει μετά κανείς ένα κούτσουρο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, ενώ βάζω ένα πρόγραμμα, μια σειρά στον αγώνα μου, και ξεκινώ με διάθεση να αγωνισθώ, σύντομα ξεχνιέμαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ξέρεις; Το ταγκαλάκι, όταν πάρη είδηση ότι κάνουμε δουλειά πνευματική, τότε γυρίζει το κουμπί αλλού. Ενώ βάζουμε ένα πρόγραμμα, μια άλφα σειρά, βρισκόμαστε σε άλλη καί, αν δεν προσέξουμε, το αντιλαμβανόμαστε μετά από μέρες. Γι' αυτό ο αγωνιστής πρέπει να πηγαίνη όλο κόντρα στον διάβολο – φυσικά με διάκριση – και να τον παρακολουθή κάποιος έμπειρος Πνευματικός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έναν άνθρωπο που δεν κάνει λεπτή εργασία στον εαυτό του, ο σατανάς τον πολεμάει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο σατανάς δεν πάει σε έναν άχρηστο άνθρωπο, αλλά πάει σε έναν αγωνιστή, για να τον πειράξη και να τον αχρηστέψη. Δεν χάνει τον καιρό του να κάνη λεπτή εργασία σε κάποιον που δεν κάνει λεπτή εργασία. Στέλνει σ᾿ αυτόν που ράβει με σακκορράφα, διάβολο με σακκορράφα. Σ᾿ αυτόν που κάνει λεπτό εργόχειρο, στέλνει διάβολο που κάνει λεπτό εργόχειρο. Σ᾿ αυτόν που κάνει πολύ ψιλό κέντημα, στέλνει διάβολο για πολύ ψιλή εργασία. Σ᾿ αυτούς που κάνουν χονδρή δουλειά στον εαυτό τους, στέλνει χονδρό διάβολο. Στους αρχαρίους στέλνει αρχάριο διάβολο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι άνθρωποι που έχουν λεπτή ψυχή, πολύ φιλότιμο και είναι ευαίσθητοι, χρειάζεται να προσέξουν, γιατί βάζει και ο διάβολος την ουρά του και τους κάνει πιο ευαίσθητους, και μπορεί να φθάσουν στην μελαγχολία ή ακόμη – Θεός φυλάξοι – και στην αυτοκτονία. Ο διάβολος, ενώ εμάς τους ανθρώπους μας βάζει να πηγαίνουμε κόντρα στον πλησίον μας και να μαλώνουμε, ο ίδιος ποτέ δεν πάει κόντρα. Τον αμελή τον κάνει πιο αμελή· τον αναπαύει με τον λογισμό: «Το κεφάλι σου πονάει, είσαι αδιάθετος· δεν πειράζει και αν δεν σηκωθής για προσευχή». Τον ευλαβή τον κάνει πιο ευλαβή, για να τον ρίξη στην υπερηφάνεια, ή τον σπρώχνει να αγωνισθή περισσότερο από τις δυνάμεις του, ώστε να αποκάμη και να αφήση μετά όλα τα πνευματικά του όπλα και να παραδοθή ο πρώην πολύ αγωνιστής. Τον σκληρόκαρδο τον κάνει πιο σκληρόκαρδο, τον ευαίσθητο υπερευαίσθητο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπεις πόσοι άνθρωποι, άλλοι γιατί έχουν κάποια ευαισθησία και άλλοι γιατί έχουν κλονισθή τα νεύρα τους, ταλαιπωρούνται με αυπνίες και παίρνουν χάπια ή βασανίζονται και χαραμίζονται στα νοσοκομεία. Σπάνια να δής σήμερα άνθρωπο ισορροπημένο. Έγιναν μπαταρίες οι άνθρωποι. Οι περισσότεροι είναι σαν να έχουν ηλεκτρισμό. Όσοι μάλιστα δεν εξομολογούνται, δέχονται επιδράσεις δαιμονικές· έχουν έναν δαιμονικό μαγνητισμό, γιατί ο διάβολος έχει εξουσία επάνω τους. Λίγοι άνθρωποι, είτε αγόρια είτε κοπέλες είτε ηλικιωμένοι είναι, έχουν ένα βλέμμα γαλήνιο. Δαιμονισμός! Ξέρεις τί θα πη δαιμονισμός; Να μην μπορής να συνεννοηθής με τον κόσμο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος μας βάζει ένεση αναισθησίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είπα σε κάποιους γιατρούς που συζητούσαν για την αναισθησία που κάνουν στις εγχειρήσεις: «Του πειρασμού η αναισθησία έχει άσχημες επιπτώσεις στον άνθρωπο, ενώ αυτή που κάνετε εσείς βοηθάει». Η αναισθησία του διαβόλου είναι σαν το δηλητήριο που ρίχνει το φίδι στα πουλιά ή στα λαγουδάκια, για να παραλύσουν και να τα καταπιή, χωρίς να αντιδράσουν. Ο διάβολος, όταν θέλη να πολεμήση έναν άνθρωπο, στέλνει πρώτα ένα διαβολάκι «αναισθησιολόγο», για να κάνη τον άνθρωπο πρώτα αναίσθητο, και μετά πηγαίνει ο ίδιος και τον πελεκάει, τον κάνει ό,τι θέλει... Αλλά προηγείται ο... «αναισθησιολόγος».Μας βάζει ένεση αναισθησίας και ξεχνούμε. Νά, βλέπεις, οι μοναχοί υποσχόμαστε «υβρισθήναι, χλευασθήναι»κ.λπ., και τελικά, ο πειρασμός μερικές φορές μας μπερδεύει και κάνουμε τα αντίθετα από αυτά που υποσχεθήκαμε. Αλλιώς ξεκινάμε και αλλιώς καταλήγουμε. Για αλλού ξεκινήσαμε να πάμε και αλλού πηγαίνουμε. Δεν προσέχουμε. Δεν σάς έχω πει παραδείγματα;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιότερα, στην Κόνιτσα δεν υπήρχε Τράπεζα. Αναγκάζονταν οι άνθρωποι να πάνε στα Γιάννενα, όταν ήθελαν να πάρουν κανένα δάνειο. Ξεκινούσαν λοιπόν μερικοί από τα γύρω χωριά και πήγαιναν εβδομήντα δύο χιλιόμετρα με τα πόδια, να πάρουν δάνειο, για να αγοράσουν λ.χ. ένα άλογο. Τότε, αν κανείς είχε ένα άλογο, μπορούσε να συντηρήση την οικογένειά του. Έκανε ζευγάρι με το άλογο κάποιου άλλου και όργωνε. Μια φορά ξεκίνησε ένας να πάη στα Γιάννενα, να πάρη δάνειο, για να αγοράση ένα άλογο, να οργώνη τα χωράφια του και να μην παιδεύεται να σκάβη με την τσάπα. Πήγε λοιπόν στην Τράπεζα, πήρε το δάνειο και μετά πέρασε και από τα εβραίικα μαγαζιά και χάζευε. Τον έβλεπε ο ένας Εβραίος, τον τραβούσε μέσα. «Πέρνα μέσα, μπάρμπα, έχω καλό πράγμα!». Έμπαινε εκείνος μέσα, άρχιζε ο Εβραίος να κατεβάζη τα τόπια από τα ράφια. Τα έπαιρνε, τα τίναζε. «Πάρ' το, του έλεγε, είναι καλό, και για τα παιδιά σου θα σού το δώσω πιο φθηνό». Έφευγε από τον έναν, προχωρούσε παραπέρα, χάζευε σε άλλον. «Έλα, μπάρμπα, μέσα, του έλεγε ο Εβραίος, θα σού το δώσω πιο φθηνό». Κατέβαζε τα τόπια, τα άνοιγε, τα άπλωνε. Ζαλίστηκε στο τέλος ο καημένος. Είχε και λίγο φιλότιμο, σού λέει «τώρα τα κατέβασε τα τόπια, τα άπλωσε...», και δήθεν «γιά τα παιδιά του πιο φθηνό», έδωσε τα χρήματα που είχε πάρει από την Τράπεζα και αγόρασε ένα τόπι πανί, αλλά και αυτό ήταν χωνεμένο! Μά και ένα τόπι πανί τί να το κάνη; Και ένας πλούσιος δεν έπαιρνε ένα τόπι πανί· έπαιρνε όσο του χρειαζόταν. Τελικά γύρισε στο σπίτι με ένα τόπι σάπιο ύφασμα! «Που είναι το άλογο;», τον ρωτάν. «Έφερα ύφασμα για τα παιδιά!», λέει. Αλλά τί να το κάνουν τόσο ύφασμα; Χρεώθηκε εν τω μεταξύ στην Τράπεζα, και άλογο δεν πήρε παρά ένα τόπι πανί χωνεμένο. Άντε πάλι να πηγαίνη να σκάβη με την τσάπα στα χωράφια, να δυσκολεύεται, για να ξεχρεώση το δάνειο! Αν αγόραζε άλογο, θα επέστρεφε και καβάλα, θα ψώνιζε και λίγα πράγματα για το σπίτι του και δεν θα σκοτωνόταν να σκάβη με την τσάπα! Αλλά για να χαζεύη στα μαγαζιά τα εβραίικα, είδατε τί έπαθε; Έτσι κάνει και ο διάβολος· σαν τον πονηρό έμπορο σε τραβάει από ᾿δώ, σε τραβάει από ᾿κεί, σού βάζει τρικλοποδιές, και τελικά σε καταφέρνει να πάς εκεί που θέλει εκείνος. Για αλλού ξεκινάς και αλλού καταλήγεις, αν δεν προσέξης. Σε ξεγελάει και χάνεις τα καλύτερα χρόνια σου.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος κάνει το πάν, για να μη βοηθηθή ο άνθρωπος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο διάβολος είναι τεχνίτης. Αν φέρη λ.χ. την ώρα της Θείας Λειτουργίας σε έναν πνευματικό άνθρωπο έναν ελεεινό λογισμό, εκείνος θα τον καταλάβη, θα τιναχθή και θα τον διώξη. Γι᾿ αυτό του φέρνει έναν πνευματικό λογισμό. «Το τάδε βιβλίο, του λέει, γράφει αυτό για την Θεία Λειτουργία». Μετά θα του τραβήξη την προσοχή λ.χ. στον πολυέλαιο. Θα αναρωτηθή ποιός άραγε να τον έφτιαξε. Ή θα του θυμίση έναν άρρωστο που πρέπει να πάη να τον δή. «Ά! έμπνευση, λέει, την ώρα της Θείας Λειτουργίας», ενώ είναι ο διάβολος που μπαίνει ενδιάμεσος και πιάνει ο άνθρωπος την συζήτηση με τον λογισμό του. Οπότε ακούει τον ιερέα να λέη «Μετά φόβου...» και τότε καταλαβαίνει ότι τέλειωσε η Θεία Λειτουργία και εκείνος δεν συμμετείχε καθόλου. Νά, και εδώ στον Ναό· πηγαίνει η εκκλησάρισσα να ανάψη τα κεριά στον πολυέλαιο και έχω παρατηρήσει ότι και μεγάλους ακόμη τους αποσπά ο πειρασμός εκεί πέρα και χαζεύουν την αδελφή πώς ανάβει τα κεριά. Αυτό είναι τελείως παιδικό. Μόνον τα μικρούτσικα παιδιά χαίρονται με κάτι τέτοια και λένε: «Τα άναψε!». Δηλαδή, αυτό για τα μικρά παιδιά είναι δικαιολογημένο, αλλά για τους μεγάλους; Ή, ενώ πρέπει να αποφεύγουμε τις κινήσεις την ώρα της Θείας Λειτουργίας, ο πειρασμός μπορεί να βάλη εκείνη την ιερή ώρα μια αδελφή να γυρίζη στο αναλόγιο τα φύλλα του βιβλίου, να κάνη θόρυβο και να αποσπά τους άλλους. Ακούνε «κρίτς–κρίτς», «τί γίνεται;» λένε, και φεύγει έτσι ο νούς από τον Θεό και χαίρεται το ταγκαλάκι. Γι'' αυτό να προσέχουμε να μη γινώμαστε εμείς αιτία να αποσπάται η προσοχή των άλλων την ώρα της θείας λατρείας. Κάνουμε ζημιά στον κόσμο και δεν το καταλαβαίνουμε. Ή παρατηρήστε σε καμμιά ανάγνωση. Όταν φθάνη ο αναγνώστης στο πιο ιερό σημείο, από το οποίο θα βοηθηθούν οι άνθρωποι, τότε ή θα χτυπήση δυνατά από τον αέρα η πόρτα ή θα βήξη κάποιος και θα αποσπασθή η προσοχή τους και δεν θα ωφεληθούν από αυτό το ιερό σημείο. Έτσι κάνει την δουλειά του το ταγκαλάκι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ώ, αν βλέπατε τον διάβολο πώς κινείται! Δεν τον έχετε δεί, γι'' αυτό δεν καταλαβαίνετε μερικά πράγματα! Κάνει το πάν, για να μη βοηθηθή ο άνθρωπος. Το έχω παρατηρήσει στο Καλύβι, όταν συζητώ. Μόλις φθάσω ακριβώς στο σημείο που θέλω, στο πιο ευαίσθητο, για να βοηθήσω αυτούς που με ακούν, τότε ή κάποιος θόρυβος γίνεται ή έρχονται άλλοι και διακόπτω. Τους βάζει προηγουμένως ο διάβολος να χαζεύουν απέναντι την Σκήτη ή να βλέπουν κάτι, και κανονίζει να έρθουν στο πιο λεπτό σημείο της συζητήσεως, για να αλλάξω θέμα και να μην ωφεληθούν. Γιατί, όταν αρχίση η συζήτηση, ξέρει ο διάβολος που θα καταλήξη καί, επειδή βλέπει ότι θα πάθη ζημιά, στέλνει κάποιον ακριβώς στο πιο ευαίσθητο σημείο, για να με διακόψη. «Έ, Πάτερ, από που να μπούμε;», φωνάζει. «Πάρτε λουκούμια και νερό και ελάτε από ᾿κεί», τους λέω. Άλλοι μπαίνουν εκείνη την στιγμή μέσα, οπότε με διακόπτουν, γιατί πρέπει να σηκωθώ να χαιρετήσω. Άλλοι έρχονται μετά από λίγο και πρέπει πάλι να σηκωθώ, αρχίζουν και την κουβέντα «από που είσαι κ.λπ.»... Οπότε είμαι αναγκασμένος να αρχίσω πάλι από την αρχή, να ξαναπώ φέρ᾿ ειπείν το παράδειγμα που έλεγα. Μόλις προχωρώ, φωνάζει από κάτω άλλος: «Έ, Πάτερ Παΐσιε, που μένεις; Από ᾿δώ είναι η πόρτα;». Άντε ξανά να σηκωθής... Βρέ τον πειρασμό! Έξι-επτά φορές μια μέρα μου έκανε το ίδιο, μέχρι που αναγκάσθηκα και έβαλα μερικούς... φρουρούς! «Εσύ κάθησε εκεί και κοίταζε να μην έρθη κανένας από ᾿κεί. Εσύ κάθησε εδώ, μέχρι να τελειώσω την δουλειά μου». Έξι-επτά φορές να αρχίζης ολόκληρη ιστορία, να τους φέρνης στο σημείο που θα βοηθηθούν, και τα ταγκαλάκια πάλι να δημιουργούν σκηνές!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βρέ τον πειρασμό τί κάνει! Γυρίζει το κουμπί συνέχεια σε άλλη συχνότητα. Μόλις ο αγωνιζόμενος πάη να συγκινηθή λίγο από κάτι, τάκ, του γυρίζει το κουμπί αλλού και ξεχνιέται με εκείνο. Θυμάται πάλι κάτι πνευματικό; Τάκ, του θυμίζει κάτι άλλο. Τον κάνει όλο τούμπες. Ο άνθρωπος, αν μάθη πώς εργάζεται ο διάβολος, θα απαλλαγή από πολλά πράγματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα μάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να παρακολουθή. Άμα παρακολουθή κανείς, μαθαίνει. Βλέπεις, οι τσομπαναραίοι είναι οι καλύτεροι μετεωρολόγοι, γιατί παρακολουθούν τα σύννεφα, τον αέρα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η φτερούγα της θελήσεως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο κόσμος εύκολα επηρεάζεται και προς το καλό και προς το κακό. Προς το κακό επηρεάζεται πιο εύκολα, γιατί εκεί κανοναρχεί και ο διάβολος. Πές σε έναν λ.χ. να κόψη το τσιγάρο, γιατί βλάπτει. Μόλις θα αποφασίση να το κόψη, θα πάη ο διάβολος και θα του πή: «Εκείνο το τσιγάρο έχει λιγώτερο φαρμάκι, το άλλο έχει φίλτρο και καθαρίζει... Κάπνισε από ᾿κείνα· δεν θα σε βλάψουν». Θα του βρη δηλαδή μια δικαιολογία, για να μην το κόψη· θα του βρή... μια λύση! Γιατί ο διάβολος μπορεί να μας βρη ένα σωρό δικαιολογίες. Και εκείνο το τσιγάρο που του προτείνει, μπορεί να τον βλάψη ακόμη περισσότερο. Γι'' αυτό χρειάζεται να έχουμε θέληση. Και αν κανείς δεν κόψη τα κουσούρια του, όταν είναι ακόμη νέος, μετά είναι δύσκολο να τα κόψη, γιατί, όσο περνάει η ηλικία, εξασθενεί η θέληση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν ο άνθρωπος δεν έχη θέληση, δεν μπορεί να κάνη τίποτε. Ο Ιερός Χρυσόστομος λέει: «Εν τω θέλειν και τω μη θέλειν κείται το πάν»[56]. Δηλαδή όλα εξαρτώνται από το αν θέλη ή αν δεν θέλη ο άνθρωπος. Μεγάλη υπόθεση! Ο Θεός είναι φύσει αγαθός και θέλει πάντοτε το καλό μας. Χρειάζεται όμως να θέλουμε και εμείς. Γιατί ο άνθρωπος πετά πνευματικά με δυο φτερούγες· με την θέληση του Θεού και με την θέληση την δική του. Ο Θεός την μια φτερούγα – την δική Του θέληση – μας την έχει κολλήσει μόνιμα στον έναν ώμο μας. Αλλά για να πετάξουμε πνευματικά, πρέπει και εμείς να κολλήσουμε στον άλλο ώμο την δική μας φτερούγα, την ανθρώπινη θέληση. Άμα ο άνθρωπος έχη δυνατή θέληση, έχει την φτερούγα την ανθρώπινη, που ισορροπεί με την θεϊκή φτερούγα, οπότε πετάει. Ενώ, αν η θέλησή του είναι ατροφική, πάει να πετάξη λίγο και τουμπάρει. Ξαναπροσπαθεί λίγο, πάλι τούμπα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, καλλιεργείται η θέληση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν έχουμε πει ότι όλα καλλιεργούνται; Θέληση υπάρχει σε όλους τους ανθρώπους, σε άλλους λίγη και σε άλλους περισσότερη. Όταν ο άνθρωπος έχη διάθεση να αγωνισθή, προσεύχεται και ζητά από τον Θεό να του αυξήση την θέληση, και ο Θεός τον βοηθάει. Όταν δεν κάνη προκοπή ο άνθρωπος, τότε να ξέρη ότι ή δεν βάζει καθόλου θέληση ή θα βάζη λίγη και αυτή θα είναι εξασθενημένη, οπότε και αυτό πάλι δεν βοηθάει. Ένα πουλί, ας υποθέσουμε, έχει την μία φτερούγα του γερή, αλλά παραμελεί την άλλη· της πέφτουν μερικά φτερά και μετά δεν μπορεί να πετάξη σωστά. Η μία φτερούγα δουλεύει καλά, η άλλη όμως είναι σαν την σπασμένη τσατσάρα. Την κουνάει το πουλί, αλλά μπαίνει αέρας ενδιάμεσα και δεν μπορεί να πετάξη καλά. Πετάει λίγο και μετά κάνει τούμπες. Πρέπει να έχη ακέραιη και αυτήν την φτερούγα, για να μπορή να πετάη. Έτσι και ο άνθρωπος, θέλω να πώ, πρέπει να προσέχη και να μην παραμελή την ανθρώπινη θέληση, αν θέλη να πετάη συνέχεια σωστά, πνευματικά. Γιατί το ταγκαλάκι τί κάνει; Πάει σιγά-σιγά και τραβάει από την ανθρώπινη φτερούγα πρώτα κανένα μικρούτσικο φτερό, ύστερα κανένα λίγο μεγαλύτερο, και αν δεν προσέξη ο άνθρωπος, του βγάζει και ένα μεγάλο, οπότε πάει να πετάξη και δεν μπορεί. Και αν τυχόν του τραβήξη μερικά φτερά, τότε, όταν πάη να πετάξη, μπαίνει αέρας στην φτερούγα που της λείπουν φτερά και κάνει τούμπες. Η θεϊκή φτερούγα είναι πάντα γεμάτη, συμπληρωμένη· δεν της λείπουν φτερά, γιατί ο διάβολος δεν μπορεί να τα τραβήξη και να τα βγάλη· είναι θεϊκή. Να προσέχη ο άνθρωπος να μην αμελήση και του βγάλη ο διάβολος κανένα φτερό από την δική του φτερούγα. Όταν αρχίζη σιγά-σιγά λίγο η τεμπελιά, λίγο η αδιαφορία, εξασθενεί η θέληση. Τί να κάνη ο Θεός, αν δεν θέλη ο άνθρωπος; Δεν θέλει να επέμβη, γιατί σέβεται την ελευθερία του ανθρώπου. Αχρηστεύει έτσι ο άνθρωπος και την φτερούγα του Θεού. Όταν όμως έχη θέληση, έχη δηλαδή και την δική του φτερούγα ακέραιη, τότε θέλει ο Θεός, θέλει και ο άνθρωπος, και πετάει ο άνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, τί είναι ακριβώς αυτό το πέταγμα; Εννοείτε να θέλω να προοδεύσω πνευματικά, να θέλω την σωτηρία μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, βρέ παιδί! Όταν λέω πέταγμα, εννοώ την άνοδο την πνευματική, δεν εννοώ να πετάξω να ανέβω σε κανένα κυπαρίσσι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είχατε πεί, Γέροντα, ότι μπορεί να οργώνη κανείς, να σπέρνη, να κάνη όλες τις σχετικές διαδικασίες, και να μη βγάζη ούτε τον σπόρο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, έτσι είναι. Άμα δεν προσέχη κανείς, του κλέβει τον κόπο του ο διάβολος· ενώ, αν προσέχη και παίρνη στα ζεστά το θέμα της σωτηρίας της ψυχής του, αγωνίζεται, προκόβει, καρποφορεί, τρέφεται πνευματικά και χαίρεται αγγελικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Η ωφέλεια από την καλή συναναστροφή
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αδελφοσύνη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ανησυχώ, όταν λέτε ότι θα περάσουμε δύσκολα χρόνια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να είστε αγαπημένες, μονοιασμένες, καταρτισμένες πνευματικά, να έχετε παλληκαριά, να είστε ένα σώμα, και μη φοβάσθε τίποτε. Βοηθάει μετά ο Θεός. Να καλλιεργήσετε την αγάπη την πνευματική. Να έχετε τέτοια αγάπη που έχει η μάνα για το παιδί. Να υπάρχη η αδελφοσύνη, η θυσία. Θα περάσουμε σιγά-σιγά δύσκολες μέρες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φυσικά εμείς οι μοναχοί φεύγουμε από τον κόσμο και αφήνουμε γνωστούς και συγγενείς, για να μπούμε στην μεγάλη οικογένεια του Αδάμ–τού Θεού. Οι λαϊκοί όμως επιβάλλεται να έχουν σχέσεις με γνωστούς και συγγενείς που ζουν πνευματικά, για να βοηθιούνται. Ο Χριστιανός που αγωνίζεται μέσα στον κόσμο βοηθιέται, όταν έχη σχέσεις με πνευματικούς ανθρώπους. Όσο πνευματικά και να ζη κανείς, έχει ανάγκη – ιδίως στην εποχή που ζούμε – από την καλή συντροφιά. Η επαφή με πνευματικούς ανθρώπους πολύ τον βοηθάει – περισσότερο και από την πνευματική μελέτη –, διότι αυτή η χαρά του πνευματικού συνδέσμου του δίνει όρεξη μεγάλη, για να αγωνίζεται πνευματικά. Ακόμη και στην εργασία, σε μια δημόσια υπηρεσία κ.λπ., καλά είναι να γνωρίζωνται μεταξύ τους οι πνευματικοί άνθρωποι, για να αλληλοβοηθιούνται. Μπορεί, ας υποθέσουμε, να παρουσιασθή ένα πρόβλημα μεταξύ συναδέλφων, να χρειάζωνται αλληλοσυμπαράσταση και να διστάζη ο ένας να μιλήση στον άλλον, αν δεν γνωρίζωνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, ένας αρνηθή να μας εξυπηρετήση σε κάποια ανάγκη μας, είναι σωστό να δυσκολευώμαστε να του ξαναζητήσουμε κάτι που θα χρειασθούμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν πρέπει. Ίσως τότε να μην είχε την δυνατότητα να εξυπηρετήση. Είναι σαν να μου ζητάς ένα σταυρουδάκι, και σού το δίνω. Άλλη φορά μου ζητάς, αλλά δεν έχω να σού δώσω, και δεν σού δίνω. Εγώ ύστερα αγοράζω σταυρουδάκια, για να έχω να δίνω, και έρχεσαι εσύ και δεν μου ζητάς, ενώ εγώ περιμένω μια ευκαιρία για να τα μοιράσω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα οι άνθρωποι ζουν στην ίδια πολυκατοικία και δεν γνωρίζονται μεταξύ τους. Παλιά υπήρχε η γειτονιά, που βοηθούσε τους ανθρώπους να γνωρισθούν, και σε μια ανάγκη στήριζε ο ένας τον άλλον. Πήγαινε, ας υποθέσουμε, ένας κάπου με το κάρο και συναντούσε στον δρόμο έναν γνωστό του. «Από που έρχεσαι; που πάς; τον ρωτούσε. Προς τα εκεί πάω και εγώ. Ανέβα πάνω να πάμε μαζί». Ή άλλος, αν είχε πρόγραμμα να πάη κάπου με το άλογο, το έλεγε και στον γείτονα και τον ρωτούσε: «Εσύ που θέλεις να πάς; Αν μπορής να περιμένης, σε τρεις ώρες φεύγω με το άλογο και μπορώ να σε πάρω μαζί μου» ή «αύριο θα φύγω για ᾿κεί· έλα από το σπίτι να κοιμηθής σ᾿ εμάς, για να φύγουμε συντροφιά νωρίς το πρωί». Σκέφτονταν οι άνθρωποι τον άλλον καί, όταν μπορούσαν να κάνουν μια εξυπηρέτηση, δεν την απέφευγαν. Είχαν την καλή περιέργεια και ρωτούσαν, για να εξυπηρετήσουν σε όλες τις περιπτώσεις. Ακόμη και από χωριό σε χωριό είχαν γνωστούς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει να δεθούν πνευματικά οι άνθρωποι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στις μέρες μας και να μη θέλουν να δεθούν οι πνευματικοί άνθρωποι, θα τους αναγκάση ο διάβολος να δεθούν. Ο διάβολος με την πολλή του κακία κάνει το μεγαλύτερο καλό σήμερα στον κόσμο. Γιατί, ας πούμε, ένας πατέρας που είναι πιστός και θέλει λ.χ. να κάνη φροντιστήριο στα παιδιά του, θα είναι αναγκασμένος να βρη έναν καλό και πιστό δάσκαλο, για να βάλη στο σπίτι του. Ένας δάσκαλος πάλι που είναι πιστός και θέλει να κάνη φροντιστήριο σε παιδιά, γιατί δεν διορίσθηκε ακόμη, θα ζητά να βρη μια οικογένεια καλή, για να νιώθη ασφάλεια. Ή ένας τεχνίτης που ζη πνευματικά, είτε ελαιοχρωματιστής είναι είτε ηλεκτρολόγος κ.λπ., θα ψάχνη να βρη να δουλέψη σε μια καλή οικογένεια, ώστε να νιώθη άνετα, γιατί σ᾿ ένα κοσμικό σπίτι θα βρίσκη τον μπελά του. Ένας χριστιανός νοικοκύρης πάλι θα ψάχνη να βάλη στο σπίτι του έναν καλό τεχνίτη, που να είναι και πιστός άνθρωπος. Έτσι θα ψάχνη και ο ένας και ο άλλος να βρη έναν πνευματικό άνθρωπο, για να μπορή να συνεργασθή. Σιγά-σιγά λοιπόν θα γνωρισθούν μεταξύ τους οι πνευματικοί άνθρωποι από όλα τα επαγγέλματα και από όλες τις επιστήμες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τελικά ο διάβολος με την κακία του, χωρίς να το θέλη, κάνει καλό: χωρίζει τα πρόβατα από τα γίδια. Θα χωρίσουν λοιπόν τα πρόβατα από τα γίδια και θα ζουν ως «μία ποίμνη, είς ποιμήν»[57]. Και βλέπεις, άλλοτε στα χωριά είχαν τσομπάνο και ο κάθε χωρικός έδινε τα πρόβατα ή τα γίδια που είχε, άλλος πέντε, άλλος δέκα, και βοσκούσαν πρόβατα και γίδια μαζί, γιατί τα γίδια τότε ήταν φρόνιμα και δεν χτυπούσαν με τα κέρατα τα πρόβατα. Τώρα τα γίδια αγρίεψαν και χτυπούν άσχημα τα πρόβατα του Χριστού. Τα πρόβατα πάλι ψάχνουν καλό βοσκό και κοπάδι μόνον από πρόβατα. Γιατί έτσι που έγινε ο κόσμος, είναι μόνο για όσους ζουν στην αμαρτία. Γι᾿ αυτό θα χωρίζωνται οι άνθρωποι και θα ξεχωρίσουν τα πρόβατα από τα ερίφια. Όσοι θα θέλουν να ζήσουν πνευματική ζωή, σιγά-σιγά δεν θα μπορούν να ζήσουν μέσα σ᾿ αυτόν τον κόσμο· θα ψάχνουν να βρουν τους ομοίους τους, ανθρώπους του Θεού, να βρουν Πνευματικό, και θα απομακρυνθούν ακόμη περισσότερο από την αμαρτία. Και αυτό το καλό το κάνει τώρα ο διάβολος με την κακία του, χωρίς να το θέλη. Έτσι βλέπουμε, όχι μόνο στις πόλεις αλλά και στα χωριά, άλλους να τρέχουν στα νταούλια, στα μπουζούκια κ.λπ., να ζουν αδιάφορα, και άλλους να τρέχουν στις αγρυπνίες, στις παρακλήσεις, στις πνευματικές συγκεντρώσεις, και οι άνθρωποι αυτοί να είναι δεμένοι μεταξύ τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στα δύσκολα χρόνια δημιουργείται μια αδελφοσύνη πολύ δυνατή. Στον πόλεμο δυο χρόνια ζήσαμε μαζί οι στρατιώτες στην διλοχία και ήμασταν περισσότερο δεμένοι και από αδέλφια, επειδή ζήσαμε όλοι μαζί τις δυσκολίες, τους κινδύνους. Ήμασταν τόσο συνδεδεμένοι, που έλεγε ο ένας τον άλλον «αδελφό».Ήταν κοσμικοί άνθρωποι, με κοσμικά φρονήματα, και όμως δεν ήθελε να χωρισθή ο ένας από τον άλλον. Ούτε Ευαγγέλιο είχαν διαβάσει ούτε πνευματικά βιβλία. Είχαν την απλή κοσμική μόρφωση, με την καλή έννοια, αλλά είχαν το μεγαλύτερο από όλα, την αγάπη, την αδελφοσύνη. Τώρα τελευταία πέθανε ένας συστρατιώτης μας και μαζεύτηκαν στην κηδεία του οι άλλοι από όλα τα μέρη. Ήρθε και εδώ προ ημερών ένας συστρατιώτης μου να με δή. Πώς με αγκάλιασε! Δεν μπορούσα να βγώ από τα χέρια του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τώρα πολεμάμε με τον διάβολο. Γι᾿ αυτό κοιτάξτε να αδελφωθήτε πιο πολύ. Έτσι θα συμβαδίσουμε όλοι μαζί στον δρόμο που χαράξαμε, στο απότομο μονοπάτι της ανηφόρας για τον γλυκύ Γολγοθά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική συγγένεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, χθές μας είπατε ότι όλους τους ανθρώπους που είδατε αυτές τις μέρες τους νιώσατε αδέλφια· πώς είναι η πνευματική συγγένεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με όλους τους ανθρώπους είμαστε κατά σάρκα αδέλφια. Όλοι είμαστε αδέλφια και όλοι δούλοι του Θεού και οι πιστοί είμαστε επιπλέον κατά Χάριν παιδιά του Θεού, εξαγορασμένοι με το θεϊκό Αίμα του Χριστού μας. Στην πνευματική ζωή κατά σάρκα συγγενεύουμε από τον Αδάμ και κατά πνεύμα από τον Χριστό. Όσοι ζουν πνευματικά νιώθουν μεταξύ τους αυτήν την πνευματική συγγένεια. Σκέφτονται το ίδιο, επιδιώκουν το ίδιο, έχουν τον ίδιο σκοπό. Αν είχες λ.χ. μια κατά σάρκα αδελφή που είχε το πρόγραμμά της, ζούσε κοσμικά κ.λπ., δεν θα ένιωθες καμμιά πνευματική συγγένεια με αυτήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Διαλύεται ποτέ η πνευματική συγγένεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν πάψη ο ένας να ζη πνευματικά, παύει να συγγενεύη με τον άλλον που ζη πνευματικά. Μόνος του αποχωρίζεται· δεν τον απομακρύνει ο άλλος. Όπως και όσο ζη κανείς κατά Θεόν, τόσο πλησιάζει στον Θεό· όσο απομακρύνεται από την κατά Θεόν ζωή, τόσο φεύγει μακριά Του. Δεν τον διώχνει ο Θεός· ο άνθρωπος φεύγει μόνος του μακριά από τον Θεό. Και όπως η θεία Χάρις είναι μία δύναμη που ενεργεί από μακριά και μεταδίδεται στους ανθρώπους, έτσι και η πονηρή ενέργεια του διαβόλου είναι και αυτή μία δύναμη που ενεργεί από μακριά και μεταδίδεται. Δύο ψυχές λ.χ. αν είναι σε πνευματική κατάσταση και σκέφτεται η μία την άλλη, υπάρχει μεταξύ τους μια επαφή πνευματική και μεταφέρει η μία στην άλλη μια δύναμη θεϊκή. Και δύο ψυχές, αν ζουν αμαρτωλά και έχουν κάποια επικοινωνία μεταξύ τους, δέχεται από μακριά η μία από την άλλη μια δαιμονική επίδραση· πάει τηλεγράφημα από την μία στην άλλη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν υπάρχη τέτοια δαιμονική επικοινωνία σε δύο ανθρώπους, αν αλλάξη ο ένας προς το καλό, βοηθιέται ο άλλος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, δεν βρίσκει ανταπόκριση, γιατί δεν σηκώνει ο άλλος τό... ακουστικό. Κόβεται η γραμμή και δεν έχει πια επικοινωνία. Έτσι ίσως προβληματισθή καί, αν θέλη, μπορεί να βοηθηθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν συναναστρεφώμαστε έναν άνθρωπο που έχει πάθη, και δεν επηρεαζώμαστε από τα πάθη του, εμείς επιδρούμε στον χαρακτήρα του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εάν έχουμε πνευματική κατάσταση, αγιότητα, πολύ επιδρούμε, γιατί επιδρά η Χάρις του Θεού και βοηθιέται ο συνάνθρωπός μας. Όταν ανεχώμαστε τον αδελφό μας από αγάπη, εκείνος το καταλαβαίνει. Όπως και όταν υπάρχη μέσα μας κακία, χωρίς να εκδηλώνεται, πάλι εκείνος την καταλαβαίνει. Ό,τι έχει μια ψυχή, αυτό και μεταδίδει. Το πάθος μεταδίδει πάθος, ο θυμός θυμό, η οργή οργή. Ενώ, όταν στην ψυχή υπάρχουν χαρίσματα, το χάρισμα θα μεταδώση χάρισμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν δηλαδή κανείς συναναστρέφεται με εναρέτους, βοηθιέται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και βέβαια βοηθιέται. Αν πάς σε ένα κελλί που το θυμιάζουν συνέχεια, όταν βγής, θα μυρίζης θυμίαμα. Αν πάς σε έναν στάβλο, θα πάρης την μυρωδιά του στάβλου. Αν πάς σε ένα κοσμικό σπίτι, θα μυρίζης κοσμικά αρώματα, όταν φύγης. Στην Κατοχή είχαμε πέντε στρέμματα πεπονιές, διάφορες ποικιλίες· τις αμερικάνικες της Γεωργικής Σχολής, που έκαναν άσπρα πεπόνια τόοοσο μεγάλα και πολύ γλυκά, τις αργίτικες, που ήταν οι εντόπιες κ.ά. Αν τυχόν οι κολοκυθιές ήταν κοντά σ᾿ αυτές τις καλές, τις αμερικάνικες πεπονιές, έφευγε η γλύκα από το πεπόνι και πήγαινε στο κολοκύθι. Το κολοκύθι γινόταν πιο γλυκό και το πεπόνι πιο άνοστο. Αυτό γίνεται με την επικονίαση που κάνουν οι μέλισσες πηγαίνοντας από το ένα άνθος στο άλλο. Αν δής πεπόνι με ομφαλό μεγάλο, να ξέρης ότι η πεπονιά θα ήταν κοντά σε κολοκυθιά. Αν τυχόν είναι η αργίτικη πεπονιά κοντά σε καλή πεπονιά, θα πάρη γλύκα από την καλή. Θα χάση γλύκα η καλή πεπονιά, αλλά τουλάχιστον θα πάη η γλύκα σε πεπονιά. Αν όμως η κολοκυθιά είναι κοντά σε καλή πεπονιά, το κολοκύθι θα γίνη πιο γλυκό καί, αν το κάνης φαγητό, θα χρειάζεται ύστερα ένα πλόχερο αλάτι. Χάνει το πεπόνι, αλλά δεν ωφελεί και το κολοκύθι. Ενώ, αν είναι πεπόνι, χάνει βέβαια το καλό πεπόνι, αλλά γίνεται το άλλο πιο γλυκό πεπόνι. Θέλω να πώ, αν ένας Χριστιανός που δεν είναι πολύ προοδευμένος πάη κοντά σε έναν πνευματικά προοδευμένο άνθρωπο, μπορεί να κουρασθή ο δεύτερος, να ζημιωθή λίγο, αλλά ωφελείται ο πρώτος. Αν όμως ένας κοσμικός άνθρωπος, που δεν πιστεύει, πάη κοντά σε έναν πνευματικό άνθρωπο, θα πάη χαμένος ο κόπος και ο χρόνος που θα διαθέση ο πνευματικός άνθρωπος. Το πολύ-πολύ ο κοσμικός να συγκινηθή από μερικά πνευματικά που θα του πη ο άλλος και να τα φιλοσοφήση κοσμικά· θα τα πάρη δηλαδή με το κοσμικό πνεύμα και δεν θα ωφεληθή. Δηλαδή θα γίνη γλυκύτερο... κολοκύθι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσοχή στην συναναστροφή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στον στρατό, στις Διαβιβάσεις, είχαμε πίνακα αναγνωρίσεως με μερικά συγκεκριμένα χαρακτηριστικά και καταλαβαίναμε ποιός σταθμός ήταν δικός μας, ποιός ήταν ξένος· ξέραμε τους δικούς μας σταθμούς. Για ένα διάστημα που παρακολουθούσαμε μαθήματα στις Διαβιβάσεις, κάναμε τον ενδιάμεσο και προσπαθούσαμε να κάνουμε αναγνώριση. Λέγαμε στον άλλον «τί είναι αυτό;» ή «ένα», για να δούμε τί θα πη εκείνος, και έτσι τον πιάναμε. Δηλαδή, όταν δεν καταλαβαίναμε σίγουρα ποιός σταθμός είναι, δεν είχαμε εμπιστοσύνη και τάκ–τάκ προσπαθούσαμε να κάνουμε αναγνώριση. Έτσι και στην πνευματική ζωή, όταν βλέπουμε πώς ένας «σταθμός» είναι ξένος, πρέπει να πούμε: «Έ, τώρα μ᾿ αυτόν θα συνεργασθώ;». Αν κανείς καταλαβαίνη ότι ένας «σταθμός» είναι ξένος και θέλη να συνεργασθή μ᾿ αυτόν, είναι βαρύ. Πόσο μάλλον όταν γνωρίζη ότι ο σταθμός είναι όχι μόνον ξένος αλλά και εχθρικός, και πάη να συνεργασθή με τον εχθρό! Θέλω να πώ, όσον αφορά στις σχέσεις με τους άλλους, χρειάζεται διάκριση και προσοχή. Το πιο σίγουρο είναι να συμβουλεύεται ο καθένας τον Πνευματικό του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ακόμη και στις συζητήσεις πρέπει κανείς να είναι προσεκτικός, γιατί μερικές φορές αρχίζει πνευματική συζήτηση και καταλήγει σε κουτσομπολιό. Και δεν φθάνει που χάνει την ώρα του, αλλά χάνει και την ψυχή του με την κατάκριση, γιατί δεν έχουμε δικαίωμα να κρίνουμε κανέναν, ούτε και καταστάσεις. Εάν μπορούμε, μετά από την συζήτηση που θα κάνουμε με πόνο, να κοιτάξουμε να βοηθήσουμε μια άσχημη κατάσταση. Ούτε και πεθαμένους πρέπει να καταδικάζουμε, γιατί οι ψυχές όλων των ανθρώπων ευτυχώς είναι στα χέρια του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω πόσες φορές χαλνάει ο λογισμός πολλών ανθρώπων από έναν απρόσεκτο λόγο. Αν ζητούσαν φόρο για τα λόγια που λέμε, ξέρετε πόσο θα προσέχαμε; Αν έλεγαν «θά πής τόσα λόγια, θα πληρώσης τόσο», θα μετρούσαμε τα λόγια μας! Και στο τηλέφωνο σκεφτόμαστε τί θα πούμε, πόσο θα μιλήσουμε, γιατί θα πληρώσουμε. Τώρα χάνεται πολύς χρόνος σε λόγια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στην Κλίμακα γράφει πώς η καταλαλιά είναι γέννημα του μίσους[58]. Το απλό κουτσομπολιό υπάρχει περίπτωση να έχη μέσα αγάπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αν κανείς αγαπάη πολύ μια ψυχή και βλέπη ότι άλλοι την ζηλεύουν, τότε μπορεί να πη και καμμιά κουβέντα εις βάρος της, για να μην την ζηλεύουν οι άλλοι. Πρέπει όλα να τα εξετάζουμε. Μια βλαμμένη όμως ή πειραγμένη ψυχή που νομίζει ότι αδικείται και γι᾿ αυτό είναι λίγο πικραμένη ή αγανακτισμένη και με μια αφορμή εκδηλώνει την αγανάκτησή της, μπορεί να κάνη τέτοια ζημιά στις άλλες ψυχές, που ούτε διάβολος δεν μπορεί να κάνη. Ο Ιούδας αγανάκτησε για την σπατάλη του μύρου που έχυσε η Μυροφόρος και είπε ότι το μύρο μπορούσε να πουληθή και τα χρήματα να δοθούν στους φτωχούς. Από τον Ιούδα επηρεάσθηκαν και οι άλλοι Απόστολοι που είχαν Χάρη[59]. Είδαν εξωτερικά σωστό αυτό που είπε εκείνος και επηρεάσθηκαν, γιατί δεν γνώριζαν την φιλάργυρη καρδιά του. Και βλέπεις, ο Χριστός είχε δώσει στον Ιούδα ακόμη και το ταμείο, για να χορτάση το πάθος του, και εκείνος «τά βαλλόμενα εβάσταζεν»[60].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θέση πρέπει να πάρη κανείς, όταν δυο άνθρωποι διαφωνούν και ζητούν την γνώμη του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν βρεθή κανείς με ανθρώπους που έχουν προσωπικά μεταξύ τους, είναι καλύτερα την γνώμη του να την πη παρουσία και των δύο, για να μην πάρη ο καθένας έναν λόγο του, όπως τον συμφέρει, και τον χρησιμοποιήση μετά ως βαρύ πυροβολικό – όταν ο λόγος του έχη βαρύτητα –, για να χτυπήση αλύπητα τον αντίπαλό του, και τον πάρουν και εκείνον τα βλήματα στα καλά καθούμενα. Όσο μπορεί, να αποφεύγη τέτοιου είδους ανθρώπους, για να έχη την ειρήνη του και να μπορή να εύχεται για την ειρήνη αυτών των ανθρώπων και γενικά για την ειρήνη του κόσμου. Όταν δεν μπορή να τους αποφύγη τελείως αυτούς τους σκανδαλοποιούς ανθρώπους, να προσπαθή τουλάχιστον να αποφεύγη τα πολλά λόγια, για να έχη λιγώτερα σκάνδαλα. Δεν έχει σημασία, εάν μερικοί άνθρωποι δεν έχουν κακότητα αλλά απλή επιπολαιότητα, διότι και αυτοί με την επιπολαιότητά τους πάλι δημιουργούν σκάνδαλα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Μητρική αγάπη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι άνθρωποι που έχουν αγάπη μαζί με μια διακριτικότητα έχουν ψυχική αγνότητα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι πολλές περιπτώσεις. Μπορεί πολλές φορές να είναι και μια ευγένεια κοσμική. Νά, μερικοί άνθρωποι έχουν μια καλωσύνη, έχουν και μια ευγένεια, αλλά αυτό δεν σημαίνει ότι έχουν και πνευματική αρχοντιά, θυσία. Το να υπάρχουν καλά στοιχεία είναι άλλο θέμα. Αυτός που έχει κοσμική ευγένεια και υποκρίνεται μπορεί να κάνη πολύ κακό, γιατί ξεγελιέται ο άλλος, ανοίγει την καρδιά του και χαραμίζει τελικά την ευλάβειά του στον κοσμικό άνθρωπο, που δεν ξέρει τί θα πη ευλάβεια. Είναι σαν να δίνη χρυσές λίρες σε ανθρώπους που ξέρουν μόνον τις μπρούντζινες δραχμές. Ακόμη πρέπει να μη χάνη κανείς την ώρα του άσκοπα νουθετώντας πνευματικά ανθρώπους, οι οποίοι αναπαύονται στις κοσμικές συζητήσεις και στο να εκφέρουν εγωιστικά γνώμες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος έχη ένα πρόβλημα και έρχεται και το λέη και το ξαναλέη, την στιγμή μάλιστα που το πρόβλημα έχει κάπως τακτοποιηθή, τί πρέπει να κάνης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Την πρώτη φορά δικαιολογείται να πή–νά πή, να καθήση ώρες. Τότε πρέπει να τον ακούσης. Αν δεν τον ακούσης, θα νομίζη ότι τον βαριέσαι ή ότι δεν τον καταλαβαίνεις. Μετά όμως, αν συνεχίζη να λέη τα ίδια και τα ίδια, θα του πής: «Όχι ότι δεν μπορώ να σε ακούσω, αλλά αυτό δεν σε βοηθάει εσένα. Εσύ και το καλοκαίρι το κάνεις χειμώνα. Τώρα είσαι καλύτερα· είναι άνοιξη. Σε λίγο θα είναι καλοκαίρι. Εσύ το καλοκαίρι σκέφτεσαι τα κρύα του χειμώνα και πουντιάζεις». Μερικές φορές όμως παρατηρείται το εξής, ακόμη και στις σχέσεις των πνευματικών ανθρώπων. Πάει να πη ένας τον πόνο του σε κάποιον, και αυτός δεν θέλει να τον ακούση, για να μη στερηθή την χαρά του. Μπορεί να προσποιηθή ότι είναι βιαστικός ή να αλλάξη κουβέντα, για να έχη την ησυχία του. Αυτό είναι τελείως σατανικό. Σαν να πεθαίνη ο άλλος δίπλα μου και εγώ να πηγαίνω πιο πέρα και να τραγουδώ. Που είναι το «κλαίειν μετά κλαιόντων»[61]; Και μάλιστα, όταν πρόκειται για θέματα σοβαρά εκκλησιαστικά και ως Χριστιανός δεν συμμερίζεται την ανησυχία του άλλου, τότε αυτός ο άνθρωπος δεν συμμετέχει στο σώμα της Εκκλησίας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν δεν δικαιολογώ τους άλλους για μια πράξη τους, αυτό σημαίνει ότι έχω σκληρή καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν δικαιολογείς τους άλλους και δικαιολογείς τον εαυτό σου; Τότε μεθαύριο κι εσένα ο Χριστός δεν θα σε δικαιολογήση. Μπορεί σε μια στιγμή η καρδιά του ανθρώπου να γίνη σκληρή σαν την πέτρα, αν δεν προσέξη, και σε μια στιγμή να γίνη τρυφερή. Να αποκτήσης μητρική καρδιά. Είδες, η μάνα όλα τα συγχωρεί και καμμιά φορά κάνει πώς δεν βλέπει μερικές αταξίες. Να κάνης υπομονή και να δικαιολογής, να ανέχεσαι τους άλλους, για να σε ανέχεται και σένα ο Χριστός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η καρδιά πώς πλαταίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν δικαιολογής πάντοτε τις αταξίες, τις ατέλειες, τις ελλείψεις των άλλων και σ᾿ αυτές καθρεφτίζης τον εαυτό σου. Βέβαια ο πονηρός μπορεί να φέρνη μερικές φορές λογισμούς για τους άλλους, και μάλιστα όταν υπάρχη και κάποια αιτία. Είναι όμως στο χέρι μας να τους δεχθούμε ή να τους διώξουμε. Όταν έρθουμε στην θέση του άλλου, θα τον δούμε με συμπάθεια και θα τον δικαιολογήσουμε. Έπειτα, όταν κάτι δεν γίνεται από κακότητα αλλά από επιπολαιότητα, πληροφορεί και δεν δημιουργεί αντίδραση. Το να υπάρχουν αδυναμίες ανθρώπινες, αυτό είναι φυσικό και γενικό σε όλους τους ανθρώπους. Όταν υπάρχη κακή διάθεση, αυτό είναι κακό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είναι άσχημα ο άλλος και εγώ είμαι καλά, μπορώ να επιδράσω στον άλλον;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Και αν σού το παρουσιάζη ο πειρασμός έτσι; Που ξέρεις εσύ ότι βρίσκεσαι σε καλύτερη κατάσταση; Από την στιγμή που πιστεύω ότι είμαι καλύτερος από τον άλλον και τον λυπάμαι, πρέπει να λυπάμαι τον εαυτό μου και όχι τον άλλον. Ακόμη και όταν κανείς βλέπη ότι πράγματι δεν είναι καλά ο άλλος, πάλι τον δικαιολογεί και του δίνει ελαφρυντικά. Μόνο στον εαυτό του δεν δίνει ελαφρυντικά και τον βρίσκει χειρότερο από τους άλλους και πονάει για τα χάλια του. Αναγνωρίζει ότι δεν έκανε τίποτε για όσα του έδωσε ο Θεός και λέει: «Μη με υπολογίζης εμένα, Θεέ μου· πέταξέ με στην άκρη. Δεν έκανα τίποτε, βοήθησε τον άλλον». Αυτοί που προοδεύουν πραγματικά, δεν αισθάνονται την μεγάλη τους πρόοδο, παρά μόνο μεγάλη συντριβή και ταπείνωση και την αγάπη του Θεού μαζί με μία ανέκφραστη αγαλλίαση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Η ευλάβεια συγκινεί τον Θεό
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί είναι ευλάβεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, τί είναι ευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ευλάβεια είναι ο φόβος του Θεού, η συστολή, η πνευματική ευαισθησία. Ο ευλαβής μπορεί να σφίγγεται, αλλά αυτό το σφίξιμο στάζει μέλι στην καρδιά του· δεν του κάνει μαρτυρική την ζωή, αλλά τον ευχαριστεί. Οι κινήσεις του είναι λεπτές, προσεγμένες. Αισθάνεται έντονα την παρουσία του Θεού, των Αγγέλων, των Αγίων. Νιώθει δίπλα του τον Φύλακα Άγγελο να τον παρακολουθή. Έχει συνέχεια στον νού του ότι το σώμα του είναι Ναός του Αγίου Πνεύματος[62]και ζη απλά, αγνά και αγιασμένα. Παντού συμπεριφέρεται με προσοχή και συστολή και νιώθει ζωντανά όλα τα ιερά. Προσέχει λ.χ. να μην είναι πίσω από την πλάτη του οι εικόνες. Δεν βάζει εκεί που κάθεται, στον καναπέ ή στην καρέκλα, το Ευαγγέλιο ή ένα πνευματικό βιβλίο κ.λπ. Αν δη μια εικόνα, σκιρτά η καρδιά του, βουρκώνουν τα μάτια του. Αλλά και μόνον το όνομα του Χριστού να δη κάπου γραμμένο, το ασπάζεται και αυτό με ευλάβεια και γλυκαίνεται εσωτερικά η ψυχή του. Ακόμη και ένα κομματάκι από εφημερίδα αν βρη κάτω πεταμένο που να γράφη λ.χ. το όνομα του Χριστού ή μόνον «Ιερός Ναός Αγίας Τριάδος», σκύβει, το μαζεύει, το ασπάζεται με ευλάβεια και στενοχωριέται που ήταν πεταμένο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, άλλο είναι η ευσέβεια και άλλο η ευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η ευσέβεια[63]είναι κολώνια, ενώ η ευλάβεια είναι θυμίαμα. Η ευλάβεια είναι η μεγαλύτερη αρετή για μένα, γιατί ο ευλαβής προσελκύει την Χάρη του Θεού, γίνεται δέκτης της Χάριτος, και φυσιολογικά παραμένει η Χάρις του Θεού μαζί του. Τον προδίδει μετά η θεία Χάρις, και όλοι τον ευλαβούνται, τον συμπαθούν, ενώ τον αναιδή τον απεχθάνονται μικροί–μεγάλοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εσείς οι γυναίκες πρέπει να έχετε περισσότερη ευλάβεια από τους άνδρες. Η γυναίκα από την φύση της επιβάλλεται να έχη ευλάβεια. Οι άνδρες, όταν δεν έχουν ευλάβεια, έχουν απλώς μια αδιαφορία. Οι γυναίκες όμως, άμα χάσουν την ευλάβεια, κάνουν χονδρά πράγματα. Μου έλεγε ένας: «Όταν πήγα προσκύνημα με την γυναίκα μου στους Αγίους Τόπους, πήγα και στον Ιορδάνη να βαπτισθώ, και αυτή καθόταν και έπλενε τα πόδια της! «Βρέ, τί κάνεις αυτού; της είπα, για να πλύνης τα πόδια σου ήρθες στον Ιορδάνη ποταμό;». Νευρίασα, την έβρισα!». Εκείνη φαίνεται ήταν τελείως αδιάφορη, δεν καταλάβαινε, ενώ αυτός ο καημένος είχε πολλή ευλάβεια.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ευλάβεια μεταδίδεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα αποκτήσω ευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Οι Πατέρες λένε ότι, για να αποκτήσης ευλάβεια, πρέπει να ζής ή να συναναστρέφεσαι με ανθρώπους που έχουν ευλάβεια και να παρατηρής πώς συμπεριφέρονται. Ο Μέγας Παΐσιος, όταν τον ρώτησε κάποιος «πώς μπορώ να αποκτήσω φόβο Θεού», του απάντησε: «Να συναναστρέφεσαι με ανθρώπους που αγαπούν τον Θεό και έχουν φόβο Θεού, για να αποκτήσης και εσύ θείο φόβο»[64]. Αυτό βέβαια δεν σημαίνει ότι θα κάνης εξωτερικά ό,τι βλέπεις να κάνουν εκείνοι, χωρίς να το νιώθης εσύ εσωτερικά, γιατί αυτό δεν είναι ευλάβεια αλλά ψευτοευλάβεια. Το ψεύτικο είναι αποκρουστικό. Η ευλάβεια είναι Χάρις από τον Θεό μέσα στον άνθρωπο. Ό,τι κάνει ο ευλαβής το κάνει, γιατί έτσι το νιώθει μέσα του. Βέβαια μέσα μας υπάρχει φυσική η ευλάβεια, αλλά, αν ο άνθρωπος δεν την καλλιεργήση, το ταγκαλάκι τον ρίχνει με την λήθη στην αναισθησία και στην ανευλάβεια. Με την συμπεριφορά όμως του ευλαβούς, ξυπνά πάλι μέσα του η ευλάβεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, οι Πατέρες μόνο για την ευλάβεια λένε πώς, αν θέλης να την αποκτήσης, να συναναστραφής με ευλαβή; Γιατί δεν λένε το ίδιο και για άλλη αρετή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί η ευλάβεια μεταδίδεται. Οι κινήσεις, η συμπεριφορά του ευλαβούς, μεταδίδονται σαν το άρωμα, όταν φυσικά υπάρχη στον άλλον καλή διάθεση και ταπείνωση. Και να σού πώ, αν κανείς δεν έχη ευλάβεια, δεν έχει τίποτε. Ο ευλαβής ό,τι είναι ιερό το βλέπει καθαρά, όπως είναι στην πραγματικότητα, έστω και αν δεν είναι μορφωμένος. Δεν θα κάνη λ.χ. λάθος για οτιδήποτε έχει σχέση με τα θεία νοήματα. Είναι όπως το παιδάκι που δεν βάζει κακό λογισμό για τον πατέρα του και την μητέρα του, γιατί τους αγαπάει και τους σέβεται, και βλέπει καλά και καθαρά όλα όσα κάνουν οι γονείς του. Πόσο μάλλον εδώ που πρόκειται για τον Θεό, ο Οποίος με τίποτε δεν συγκρίνεται και σε όλα είναι τέλειος! Όποιος δεν έχει ευλάβεια πέφτει σε λάθη, σε πλάνες ως προς το δόγμα. Βλέπω τί λάθη κάνουν όσοι δεν έχουν ευλάβεια και γράφουν ερμηνείες ή σχόλια σε ιερά κείμενα κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλα τα πνευματικά πράγματα χρειάζονται ευλάβεια και καρδιά. Όταν όλα ξεκινούν από ευλάβεια, όλα είναι αγιασμένα. Ειδικά, για να γράψη κανείς Ακολουθία σε Άγιο, πρέπει να αγαπάη τον Άγιο, να τον ευλαβήται, οπότε αυτό που θα γράψη, θα βγαίνη από την καρδιά του και θα αποπνέη ευλάβεια. Όταν κανείς φθάση σε κατάσταση θείου έρωτος, θείας τρέλλας, βγαίνουν μόνοι τους οι στίχοι από μέσα του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί άλλο, Γέροντα, βοηθάει τον άνθρωπο να αποκτήση ευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το να μελετάη με τον νού του καθετί ιερό και να εμβαθύνη σ᾿ αυτό, αλλά και το να αξιοποιή τις ευκαιρίες που του δίνονται· αυτά ξυπνούν σιγά-σιγά μέσα του την ευλάβεια. Όταν π.χ. μου δίνεται η ευκαιρία να περάσω από έναν Ναό και να μπώ λίγο μέσα να προσευχηθώ και δεν το κάνω, στερούμαι την Χάρη. Αν θέλω να περάσω, αλλά εμποδίζωμαι από κάτι και δεν περνώ, τότε δεν στερούμαι την Χάρη, διότι ο Θεός βλέπει την αγαθή μου πρόθεση. Επίσης πολύ βοηθάει να αποκτήσουμε ευλάβεια το να γνωρίσουμε τους Αγίους του τόπου μας, της πατρίδας μας, για να τους αγαπήσουμε και να συνδεθούμε μαζί τους. Ο Θεός χαίρεται, όταν ευλαβούμαστε και αγαπούμε τους Αγίους. Και όταν έχουμε ευλάβεια στους Αγίους, πόσο περισσότερη θα έχουμε στον Θεό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει να κινήται κανείς μέσα στον Ναό με ευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν ξεκινάς για τον Ναό, να λές με τον λογισμό σου: «Που πηγαίνω; Τώρα μπαίνω στον Οίκο του Θεού. Τί κάνω; Προσκυνώ τις εικόνες, τον Θεό». Από το κελλί σου ή από το διακόνημά σου πηγαίνεις στον Ναό. Από τον Ναό να πάς στον Ουρανό και πιο εκεί ακόμη, στον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς γίνεται αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Ναός είναι το «σπίτι» του Θεού. Και το δικό μας πραγματικό σπίτι είναι στον Παράδεισο. Εδώ ψάλλουν οι αδελφές. Εκεί οι Άγγελοι, οι Άγιοι... Άν, όταν πηγαίνουμε σε ένα κοσμικό σπίτι, χτυπάμε την πόρτα, σκουπίζουμε τα πόδια, καθώμαστε συνεσταλμένα, τότε μέσα στον Οίκο του Θεού, όπου θυσιάζεται ο Χριστός, τί πρέπει να κάνουμε; Με μία σταγόνα θεϊκού Αίματος μας εξαγόρασε από την αμαρτία και στην συνέχεια μας νοσηλεύει με κιλά Αίματος και μας τρέφει με το πανάγιο Σώμα Του. Όλα λοιπόν αυτά τα φρικτά και θεία γεγονότα, όταν τα φέρνουμε στην μνήμη μας, μας βοηθούν να κινούμαστε με ευλάβεια μέσα στον Ναό. Αλλά βλέπω στην Θεία Λειτουργία, ακόμη και όταν ο ιερέας λέη «Άνω σχώμεν τας καρδίας» και λέμε «Έχομεν προς τον Κύριον», λίγοι είναι αυτοί που έχουν τον νού τους προς τον Κύριο! Γι᾿ αυτό καλύτερα να λέμε νοερώς «νά έχουμε τις καρδιές μας προς τον Κύριον», γιατί ο νούς μας και η καρδιά μας είναι όλο προς τα κάτω. Λέμε και ψέματα, γιατί λέμε «έχομεν», αλλά δεν έχουμε εκεί τον νού μας. Βέβαια, εάν έχουμε την καρδιά μας προς τα «άνω», όλα θα πάνε προς τα «άνω».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει να ψάλλη κανείς κατανυκτικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να έχη τον νού του στα θεία νοήματα και να έχη ευλάβεια· να μην πιάνη τα θεία νοήματα λογοτεχνικά, αλλά με την καρδιά. Άλλο η ευλάβεια και άλλο η τέχνη, η επιστήμη της ψαλτικής. Η τέχνη χωρίς ευλάβεια είναι... μπογιές. Όταν ο ψάλτης ψάλλη με ευλάβεια, ξεχειλίζει από την καρδιά του η ψαλμωδία, και ψάλλει κατανυκτικά. Όταν εσωτερικά είναι σε καλή πνευματική κατάσταση ο άνθρωπος, όλα πάνε καλά. Γι᾿ αυτό πρέπει να είναι τακτοποιημένος κανείς εσωτερικά και να ψάλλη με την καρδιά του, με ευλάβεια, για να ψάλλη και κατανυκτικά. Αν έχη αριστερούς λογισμούς, τί ψαλτική θα κάνη; Δεν μπορεί να ψάλη με την καρδιά. Γιατί λέει η Γραφή «Ευθυμεί τις; ψαλλέτω»[65]; Ο Άγιος Ιωάννης ο Κουκουζέλης, όταν μια φορά έψαλλε, ενώ βοσκούσε τους τράγους, οι τράγοι σηκώθηκαν και στάθηκαν όρθιοι. Από αυτό κατάλαβαν ότι ήταν ο Κουκουζέλης, ο ψάλτης της αυτοκρατορικής αυλής. Ό,τι κάνετε, να το κάνετε με την καρδιά σας, για τον Χριστό. Και στα κεντήματα που κάνετε, να βάζετε ευλάβεια, γιατί μπαίνουν πάνω στα άγια, ακόμη και αυτά που κάνετε για το κατζίο[66]. Όταν ο άνθρωπος είναι ευλαβής, η ψυχική του ομορφιά φαίνεται σε ό,τι κάνει· και στο διάβασμα και στο ψάλσιμο, και στα λάθη ακόμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στα λάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, βλέπεις ότι και τα λάθη που κάνει έχουν μια ευλάβεια, μια συστολή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ευλάβεια εξωτερική
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εκείνος που έχει πολλή πίστη και αληθινή ευλάβεια τρέφεται από κάτι ανώτερο, πνευματικό, που δεν περιγράφεται. Υπάρχουν όμως μερικοί που έχουν μια ξερή εξωτερική ευλάβεια. Λένε ξερά: «Τώρα, αφού μπαίνω στην Εκκλησία, πρέπει να καθήσω προσεκτικά, δεν πρέπει να κουνηθώ, πρέπει να σκύψω το κεφάλι, έτσι πρέπει να κάνω τον σταυρό μου!». Άλλοι μπορεί να κλονίζωνται στο θέμα της πίστεως, και όμως σε ολόκληρη αγρυπνία να στέκωνται όρθιοι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχουν, Γέροντα, ανησυχία για κάτι, ψάχνουν κάτι, γι᾿ αυτό το κάνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάτι θα έχουν μέσα τους. Καλά είναι αυτά, αλλά να τα αισθάνεται κανείς και από μέσα του, να μη γίνωνται μόνον εξωτερικά. Άλλο είναι να βγάζης τον σκούφο σου, όταν μπαίνης στην Εκκλησία, από ευλάβεια, και άλλο να τον βγάζης, επειδή θέλεις να δροσισθή το κεφάλι σου. Η ευλάβεια φαίνεται από τον τρόπο που κοινωνάμε, από τον τρόπο που παίρνουμε αντίδωρο κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί κανείς να πειραχθή από την εκδήλωση της ευλαβείας του άλλου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να σού πώ, όταν κάνη κανείς μεγάλο σταυρό, αλλά τον κάνη απλά, ταπεινά, δεν πειράζει τον άλλον. Αλλά, όταν κοιτάη αν τον βλέπουν οι άλλοι και κάνη συνέχεια σταυρούς, τότε θα αρχίσουν να τον κοροϊδεύουν. Ή, όταν περνάη έξω από έναν Ναό και κοιτάη αν έχη κόσμο, ή κάνη καί... υπομονή να μαζευθή λίγος κόσμος, και τότε αρχίζη να κάνη σταυρούς και μετάνοιες, για να τον δούν, έχουν δίκιο να τον κοροϊδεύουν. Βλέπεις, το κοσμικό πνεύμα αποδοκιμάζεται. Η πραγματική ευλάβεια, όταν υπάρχη, φαίνεται. Το «ευσχημόνως»[67]γίνεται «ασχημόνως» χωρίς πραγματική ευλάβεια.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Μη δώτε το άγιον τοις κυσί»[68]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο κόσμος σάς δίνη ρούχα από αρρώστους να βάλετε πάνω στα άγια Λείψανα, για να αγιασθούν, να προσέχετε να είναι μόνο φανελίτσες, όχι άλλα εσώρουχα. Δεν κάνει· είναι ανευλάβεια. Ο ήλιος φυσικά δεν μολύνεται, ούτε ο Θεός μολύνεται· εμείς δαιμονιζόμαστε με την ανευλάβεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά οι άνθρωποι, όταν αρρώσταιναν, έπαιρναν λαδάκι από το κανδήλι τους, αλείφονταν και γίνονταν καλά. Τώρα το κανδήλι το έχουν τυπικά, μόνο για να φωτίζη, και το λάδι, όταν πλένουν το κανδήλι, το ρίχνουν στον νεροχύτη. Κάποτε πήγα σε ένα σπίτι και είδα την νοικοκυρά να πλένη το κανδήλι της στον νεροχύτη. «Που πάνε τα νερά;», την ρώτησα. «Στην αποχέτευση», μου λέει. «Μά καλά, της λέω, από το ένα μέρος παίρνεις λαδάκι από το κανδήλι και σταυρώνεις το παιδί σου, όταν είναι άρρωστο, και από το άλλο όλο το λάδι της κούπας πάει στην αποχέτευση; Πώς το δικαιολογείς αυτό; Πώς να έρθη η ευλογία του Θεού στο σπίτι σου;». Στα σημερινά σπίτια ένα ιερό πράγμα, π.χ. το χαρτάκι που τύλιξες το αντίδωρο, δεν έχεις που να το ρίξης. Θυμάμαι, στο σπίτι μας ακόμη και τα νερά που πλέναμε τα πιάτα δεν πήγαιναν στην αποχέτευση· πήγαιναν αλλού, γιατί και τα ψίχουλα είναι ιερά, αφού κάνουμε προσευχή πριν και μετά το φαγητό. Όλα αυτά έχουν λείψει σήμερα, γι᾿ αυτό έλειψε και η θεία Χάρις και δαιμονίζονται οι άνθρωποι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο μπορούμε, να προσέχουμε σε όλα. Μετά την Θεία Κοινωνία ή το αντίδωρο ή το Ευχέλαιο, καλό είναι να σκουπίζουμε τα χέρια μας με λίγο βαμβάκι βρεγμένο με οινόπνευμα και να καίμε το βαμβάκι. Όταν σκουπίζουμε το Ιερό, όσα μαζεύουμε να τα ρίχνουμε στην θάλασσα ή να τα καίμε σε έναν καθαρό τόπο, γιατί μπορεί να έπεσε αντίδωρο ή μαργαρίτης. Φυσικά, αν πέση κάτω ένας μαργαρίτης, ο Χριστός δεν θα καθήση να πατηθή, αλλά φεύγει η Χάρις από εμάς. Στο εξωτερικό, στους Ναούς δεν έχουν ούτε χωνευτήρια. Τα νερά της Προσκομιδής πάνε με τα όμβρια. «Μάς απαγορεύουν, λένε, να έχουμε χωνευτήρια, επειδή δημιουργούνται μικρόβια». Όλοι οι άνθρωποι έχουν γεμίσει σωματικά και πνευματικά μικρόβια καί, αν στάξη λίγο μύρο στο κεφάλι, σού λένε «θά δημιουργηθούν μικρόβια»! Πώς να έρθη η ευλογία του Θεού; Ο δαιμονισμός στον κόσμο από εδώ ξεκινάει. Ευτυχώς υπάρχουν μερικές ευλαβείς γυναίκες, νέες και ηλικιωμένες, και έτσι στηρίζεται ο κόσμος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια κυρία ζήτησε να της αγιογραφήσουμε μια εικόνα του Αγίου Αρσενίου, για να την βάλη στο σαλόνι της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εκεί θα έχη μόνον εικόνες; Δεν θα έχη και άλλα κάδρα, φωτογραφίες κ.λπ.; Ύστερα δεν θα καπνίζουν εκεί μέσα; Ας την έχη καλύτερα σε ένα άλλο δωμάτιο με τις άλλες εικόνες σε ένα εικονοστάσι και εκεί να προσεύχεται. Σε ένα σπίτι που πήγα μια φορά το εικονοστάσι το είχαν βάλει κάτω από την σκάλα, ενώ είχαν ένα σωρό χώρους. Σε ένα άλλο πάλι η νοικοκυρά είχε κάνει το εικονοστάσι της μπροστά από την σωλήνα της αποχετεύσεως. «Καλά, πώς σκέφθηκες και έβαλες το εικονοστάσι σου σ᾿ αυτήν την θέση;», την ρώτησα. «Εδώ με αναπαύει», μου λέει. Και δεν ήταν να πής ανατολικό το μέρος, αλλά βορεινό!  Πώς να έρθη η Χάρις μετά; «Όστις έχει, δοθήσεται αυτώ, λέει η Αγία Γραφή, καιπερισσευθήσεται· όστις δε ουκ έχει, και ό έχει αρθήσεται απ᾿ αυτού»[69]. Εμείς νομίζουμε ότι έχουμε, και μας αφαιρείται και αυτό που έχουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σιγά-σιγά χάνεται η ευλάβεια, γι᾿ αυτό και συμβαίνουν αυτά τα κακά που βλέπουμε. Μπορεί ακόμη και να δαιμονισθή κανείς, αν δεν προσέξη. Ήταν μια γυναίκα – ο Θεός να την συγχωρέση, πέθανε τώρα – που δαιμονίσθηκε, γιατί έχυσε τον αγιασμό στον νεροχύτη. Είχε λίγο αγιασμό σε ένα μπουκαλάκι. «Ά, λέει, μπαγιάτικος είναι ο αγιασμός, ας τον πετάξω, γιατί χρειάζομαι και το μπουκαλάκι». Έχυσε τον αγιασμό, ξέπλυνε κιόλας το μπουκαλάκι, επειδή είχε μείνει λίγος βασιλικός μέσα. Ύστερα δαιμονίσθηκε. Έφυγε η Χάρις, γιατί δεν μπορεί να παραμείνη η Χάρις σε ανευλαβή άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άν, Γέροντα, από λάθος χύση κάποιος τον αγιασμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είχε βάλει ο ίδιος το μπουκάλι με τον αγιασμό λ.χ. μέσα σε ένα ντουλάπι και μετά από καιρό δεν πρόσεξε ότι είναι αγιασμός και τον έχυσε, έχει μισή αμαρτία. Αν το έβαλε άλλος και αυτός δεν ήξερε ότι είναι αγιασμός, δεν φταίει αυτός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος δεν ευλαβήται τα Άγια, πώς να τον πλησιάση η θεία Χάρις; Η Χάρις θα πάη σ᾿ αυτούς που την τιμούν. «Μη δώτε το άγιον τοις κυσί», λέει η Γραφή. Αν δεν υπάρχη η πνευματική ευαισθησία, δεν γίνεται προκοπή. Ένας στο Άγιον Όρος έβγαλε τα στασίδια από έναν Ναό και τα πήρε στον δικό του. Άλλος έβγαλε τις πλάκες από την οροφή του Ιερού ενός άλλου Ναού και τις πήρε, για να στρώση την βεράντα του. Έβρεξε, μπήκαν νερά στο Ιερό και έτρεχαν πάνω στην Αγία Τράπεζα. Πήγα μια φορά μέσα, τί να δώ! Ήταν εγκαινιασμένος ο Ναός και στο κέντρο της Αγίας Τραπέζης υπήρχε άγιο Λείψανο, ένας σπόνδυλος. Τον πήρα, τον έπλυνα στο χωνευτήρι. «Τί κάνατε εκεί; τους είπα μετά. Ο Ναός είναι εγκαινιασμένος! Βγάλατε τις πλάκες από την σκεπή και όλα τα νερά τρέχουν πάνω στην Αγία Τράπεζα!». Πήγαν μετά με έναν μάστορα και τα σύμμασαν λίγο. Αλλού έβγαλαν τα σανίδια από το Ιερό, για να κάνουν μουράγιο. Σηκώθηκε φουρτούνα, πήρε και τα σανίδια και τα τσιμέντα. Και δεν καταλαβαίνουν πόση ανευλάβεια έχουν όλα αυτά! Θυμάμαι, εκεί στην Κόνιτσα ήταν ένας παππούς που κυνηγούσε τα παιδιά, γιατί έξυναν τον τοίχο της Εκκλησίας· το θεωρούσε ανευλάβεια. Και τώρα που φθάσαμε!
- type: h2
  initial:
    ru: ''
  text:
    ru: Ευλάβεια σε όλα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και εδώ να προσέχετε· στον καναπέ ήταν κάτι στρωμένο με σταυρούς· δεν κάνει να καθώμαστε ούτε να πατάμε πάνω στους σταυρούς. Οι Εβραίοι βάζουν κάτω από τα παπούτσια σταυρούς. Πολλές φορές όχι μόνον απ᾿ έξω αλλά και μέσα από τα τακούνια και τις σόλες. Να πληρώνης και να πατάς σταυρούς! Αυτοί από παλιά είχαν κάνει κουδουνίστρες που είχαν από την μια μεριά την Παναγία και τον Χριστό, και από την άλλη τον Καραγκιόζη. Σού λέει: «Τί Καραγκιόζης, τί Χριστός». Και ο άλλος, ο καημένος, έβλεπε τον Χριστό και την Παναγία και την αγόραζε για το παιδί του. Έρριχναν τα μωρά κάτω την κουδουνίστρα, την πατούσαν, την λέρωναν. Και τώρα, μου είπαν, εκεί κάπου κοντά στην Κίνα οι Ρωμαιοκαθολικοί Ιεραπόστολοι φορούσαν κάτι μενταγιόν που είχαν από μέσα τον Χριστό και απ᾿ έξω τον Βούδδα. Ή βάλτε από μέσα μόνον τον Χριστό ή ομολογήστε φανερά τον Χριστό, αλλιώς δεν έρχεται η Χάρις του Θεού. Εδώ πάλι στην Ελλάδα μερικοί, χωρίς να σκεφθούν, έβαλαν δυστυχώς την Παναγία σε γραμματόσημο, που πετιέται και πατιέται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, ένας άνθρωπος να έχη σε μερικά πράγματα ευλάβεια και σε άλλα να μην έχη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, αν έχη πραγματική ευλάβεια, θα έχη σε όλα ευλάβεια. Μια φορά φιλοξενείτο ένας παπάς στην Μονή Σταυρονικήτα και στον Εξάψαλμο[70]κατέβαζε το στασίδι και καθόταν! «Πάτερ, του λέω, Εξάψαλμο λένε». «Έτσι τον απολαμβάνω καλύτερα!», μου λέει. Σκέψου δηλαδή! Μετά από χρόνια ήρθε και με βρήκε. Πάνω στην συζήτηση μου είπε ότι έφτιαχνε χαρτοεικόνες και τις έδινε ευλογία. «Πώς κολλάς τις εικόνες;», τον ρωτάω. «Βάζω, μου λέει, κόλλα στο ξύλο, βάζω και την χαρτοεικόνα καί, όταν φτιάξω αρκετές, τις στοιβιάζω και κάθομαι επάνω, για να κολλήσουν καλά. Παίρνω και ένα βιβλίο και διαβάζω λίγη ώρα»! Όταν το άκουσα, σηκώθηκαν οι τρίχες της κεφαλής μου! «Τί κάνεις; του λέω. Κάθεσαι επάνω στις εικόνες, για να κολλήσουν;». «Γιατί; δεν κάνει;», μου λέει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπεις που φθάνουν σιγά-σιγά! Το κακό είναι που η ανευλάβεια προχωράει· δεν σταματάει. Ο άνθρωπος εξελίσσεται ή στο καλό ή στο κακό. Από που ξεκίνησε εκείνος και που έφθασε! «Έτσι απολαμβάνω καλύτερα τον Εξάψαλμο», είπε τότε και μετά έφθασε να πή: «Έτσι και οι εικόνες θα κολλήσουν και εγώ θα διαβάσω». Τότε του φάνηκε παράξενο αυτό που του είπα για τον Εξάψαλμο. Και ήταν άλλοι Πατέρες γέροι και στέκονταν όρθιοι. Ακουμπούσαν λίγο στο στασίδι και δεν κουνιόνταν καθόλου. Άλλο να είναι κουρασμένος κανείς, να είναι άρρωστος, να τρέμουν τα πόδια του και να κάθεται – δεν θα τον κρεμάση ο Χριστός – και άλλο να νομίζη ότι αυτό είναι το καλύτερο και να λέη: «Καθιστός απολαμβάνω καλύτερα». Αυτό πώς να το δικαιολογήσης; Η πνευματική ζωή δεν είναι απόλαυση. Αν πονάς, κάθησε· ο Χριστός δεν είναι τύραννος. Και ο Αββάς Ισαάκ λέει: «Αν δεν μπορής όρθιος, κάθησε»[71]. Δεν λέει: «Αν μπορής, κάθησε»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί δεν καθόμαστε στον Εξάψαλμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί συμβολίζει την Κρίση. Γι᾿ αυτό, όταν διαβάζεται ο Εξάψαλμος, καλά είναι ο νούς να πηγαίνη στην ώρα της Κρίσεως. Ο Εξάψαλμος έξι-επτά λεπτά κρατά. Στην πρώτη στάση ούτε σταυρό δεν κάνουμε, γιατί ο Χριστός τώρα δεν θα έρθη για να σταυρωθή, αλλά θα έρθη ως Κριτής.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί ευλάβεια είχαν παλιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, στην εποχή μας είναι τόσο δυσεύρετη η ευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί οι άνθρωποι έπαψαν να ζουν πνευματικά. Τα ερμηνεύουν όλα με την κοσμική λογική και διώχνουν την θεία Χάρη. Παλιά, τί ευλάβεια είχαν οι άνθρωποι! Εκεί στην Αιτωλοακαρνανία κάτι γιαγιές που είχαν πολλή απλότητα και ευλάβεια, έπεφταν και προσκυνούσαν τα μουλάρια της Ιεράς Μονής Προυσσού, όταν κατέβαιναν από τον Προυσσό για διακονία. «Αυτά είναι τα μουλαράκια της Παναγίας!», έλεγαν, και δώσ᾿ του μετάνοιες. Αν για τα μουλάρια του Μοναστηριού της Παναγίας έδειχναν τόση ευλάβεια, φαντάσου στην Παναγία πόση ευλάβεια είχαν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, την ευλάβεια που είχαν οι Φαρασιώτες τους την είχε καλλιεργήσει ο Άγιος Αρσένιος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Την είχαν την ευλάβεια, την καλλιέργησε και ο Άγιος. Είναι η παράδοση. Ο γερο-Πρόδρομος ο Κορτσινόγλου, ο ψάλτης του Αγίου Αρσενίου, είχε πολλή ευλάβεια. Έκανε και εκεί στην Κόνιτσα ψάλτης. Γέρος, ογδόντα χρονών και παραπάνω, κατέβαινε κάθε μέρα, πρωί-πρωί, στην κάτω Κόνιτσα, κοντά μισή ώρα με τα πόδια, για να πάη να ψάλη στην Εκκλησία. «Εγώ είμαι σκυλί του Χριστού», έλεγε. Και τον χειμώνα με το κρύο, με τις παγωνιές, οι δρόμοι ήταν πολύ επικίνδυνοι. Έτρεχαν τα νερά από τις βρύσες στον κατήφορο και πάγωναν και έπρεπε να βρής που να πατήσης, για να μη γλιστρήσης. Και εκείνος όλα τα αψηφούσε. Τέτοια ευλάβεια!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου έλεγαν οι γονείς μου ότι οι Φαρασιώτες στην πατρίδα είχαν μαζέψει χρήματα, για να φτιάξουν Ναό εκεί στα Φάρασα. Ύστερα όμως ο Άγιος Αρσένιος ήθελε να τα δώση στους φτωχούς, αφού είχαν Ναό. Πήγε ο ίδιος ο Άγιος να τα μοιράση στις φτωχές οικογένειες και οι καημένοι δεν τα έπαιρναν. Από την Εκκλησία να πάρουν χρήματα! Αφού δεν τα έπαιρναν, αναγκάσθηκε να τα στείλη με τον πρόεδρο[72]του χωριού στον δεσπότη, στην Καισάρεια. «Να πάρης συνοδό για τον δρόμο», του είπε ο Άγιος. «Η ευχή σου μου φθάνει», του είπε ο πρόεδρος και έφυγε μόνος του. Όταν τα πήγε στον δεσπότη, εκείνος τον ρώτησε: «Καλά, ο Χατζεφεντής τί σάς είπε να κάνετε τα χρήματα;». «Να τα δώσουμε στις φτωχές οικογένειες», του απάντησε ο πρόεδρος. «Και γιατί δεν τον ακούσατε;». «Δεν τα παίρνουν οι άνθρωποι, του είπε, γιατί είναι χρήματα της Εκκλησίας». Τελικά ο δεσπότης του τα έδωσε πίσω. Οι Φαρασιώτες, όταν θα έφευγαν από τα Φάρασα με την Ανταλλαγή, είπαν στον Άγιο Αρσένιο αυτά τα χρήματα να τα πάρουν μαζί τους, για να φτιάξουν Εκκλησία εδώ στην Ελλάδα. Τότε  ο Άγιος Αρσένιος τους είπε με κλάματα: «Στην Ελλάδα θα βρήτε πολλές Εκκλησίες, αλλά την πίστη που υπάρχει εδώ δεν θα την βρήτε».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ευλάβεια στις εικόνες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόση ευλάβεια πρέπει να έχουμε στις εικόνες! Ένας μοναχός ετοίμασε μια εικόνα του Αγίου Νικολάου, για να την δώση ευλογία σε κάποιον. Την τύλιξε με καλό χαρτί και την έβαλε σε ένα ντουλάπι, μέχρι να την δώση. Αλλά, χωρίς να το προσέξη, την έβαλε ανάποδα. Σε λίγο άρχισε να ακούγεται μέσα στο δωμάτιο ένας κρότος. Κοίταζε ο μοναχός από ᾿δώ-από ᾿κεί, για να δη από που ερχόταν αυτός ο κρότος. Που να πάη ο νούς του ότι ερχόταν από το ντουλάπι! Ο κρότος συνέχιζε για αρκετή ώρα, «τάκ-τάκ-τάκ»· δεν τον άφηνε να ησυχάση. Τελικά, όταν πήγε κοντά στο ντουλάπι, κατάλαβε ότι ο κρότος έβγαινε από εκεί. Το ανοίγει και βλέπει ότι ο κρότος έβγαινε από την εικόνα. «Τί να έχη η εικόνα; λέει· για να δώ». Μόλις την ξετύλιξε, είδε πώς ήταν ανάποδα. Την έστησε όρθια και αμέσως σταμάτησε ο κρότος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο ευλαβής ιδιαίτερα ευλαβείται τις εικόνες. Και όταν λέμε «ευλαβείται τις εικόνες», εννοούμε ότι ευλαβείται το εικονιζόμενο πρόσωπο. Όταν έχη κανείς μια φωτογραφία του πατέρα του, της μάνας του, του παππού του, της γιαγιάς του, του αδελφού του, δεν μπορεί να την σχίση ή να την πατήση, πόσο μάλλον μια εικόνα! Οι Ιεχωβάδες δεν έχουν εικόνες. Την τιμή που αποδίδουμε στις εικόνες την θεωρούν ειδωλολατρία. Είπα σε έναν Ιεχωβά μια φορά: «Εσείς δεν έχετε φωτογραφίες στα σπίτια σας;». «Έχουμε», μου λέει. «Έ, καλά, η μάνα, όταν το παιδί της λείπη μακριά, δεν φιλάει την φωτογραφία του παιδιού της;». «Την φιλάει», μου λέει. «Το χαρτί φιλάει ή το παιδί της;». «Το παιδί της», μου λέει. «Έ, όπως εκείνη, όταν φιλάη την φωτογραφία του παιδιού της, του λέω, φιλάει το παιδί της και όχι το χαρτί, έτσι και εμείς τον Χριστό φιλούμε· δεν φιλούμε το χαρτί ή το σανίδι».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, και αν ένα σανίδι κάποτε είχε επάνω την εικόνα του Χριστού, της Παναγίας ή κάποιου Αγίου και έσβησαν τα χρώματα από τον καιρό, και πάλι δεν πρέπει να το ασπαζώμαστε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, βέβαια! Όταν ασπάζεται ο άνθρωπος με ευλάβεια και θερμή αγάπη τις άγιες εικόνες, παίρνει τα χρώματα από αυτές και ζωγραφίζονται οι Άγιοι μέσα του. Οι Άγιοι χαίρονται, όταν ξεσηκώνωνται από τα χαρτιά ή από τα σανίδια και τυπώνωνται στις καρδιές των ανθρώπων. Όταν ασπάζεται ο Χριστιανός με ευλάβεια τις άγιες εικόνες και ζητάη βοήθεια από τον Χριστό, την Παναγία, τους Αγίους, με τον ασπασμό που κάνει με την καρδιά του, ρουφάει μέσα στην καρδιά του όχι μόνον την Χάρη του Χριστού, της Παναγίας ή των Αγίων, αλλά και τον Χριστό ολόκληρο ή την Παναγία ή τον Άγιο, και τοποθετούνται πια στο Τέμπλο του Ναού του. «Ναός του Αγίου Πνεύματος είναι ο άνθρωπος»[73]. Βλέπεις, και κάθε Ακολουθία με τον ασπασμό των εικόνων αρχίζει και με τον ασπασμό τελειώνει. Εάν το καταλάβαιναν αυτό οι άνθρωποι, πόση χαρά θα αισθάνονταν, πόση δύναμη θα έπαιρναν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στην Παράκληση της Παναγίας, σε κάποιο Μεγαλυνάριο γιατί λέει «Άλαλα τα χείλη των ασεβών, των μη προσκυνούντων την εικόνα σου την σεπτήν»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν κανείς δεν έχη ευλάβεια και ασπάζεται τις εικόνες, δεν είναι άλαλα τα χείλη του; Και ο ευλαβής, όταν ασπάζεται τις εικόνες, εύλαλα δεν είναι τα χείλη του; Είναι μερικοί πού, όταν προσκυνούν την εικόνα, ούτε καν ακουμπούν στην εικόνα. Άλλοι ακουμπούν μόνον τα χείλη τους στην εικόνα, όταν την ασπάζωνται. Νά, έτσι[74]. Ακούσατε τίποτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, τότε «άλαλα» είναι τα χείλη. Ενώ ο ευλαβής ασπάζεται την εικόνα και ο ασπασμός ακούγεται. Τότε τα χείλη είναι «εύλαλα». Δεν είναι ότι καταριούνται, όταν λένε «άλαλα»,  αλλά εκείνα τα χείλη είναι άλαλα και τα άλλα είναι εύλαλα. Όταν βλέπουμε τις άγιες εικόνες, πρέπει να ξεχειλίζη η καρδιά μας από αγάπη προς τον Θεό και τους Αγίους και να πέφτουμε να τις προσκυνούμε και να τις ασπαζώμαστε με πολλή ευλάβεια. Να βλέπατε ένα ευλαβικό γεροντάκι στην Μονή Φιλοθέου, ο γερο–Σάββας, με πόση ευλάβεια, με πόση καρδιά ασπαζόταν την εικόνα της Παναγίας της Γλυκοφιλούσης! Σ᾿ αυτήν την εικόνα της Παναγίας, επειδή οι Πατέρες την ασπάζονταν στο ίδιο σημείο, έχει σχηματισθή ένα γρομπαλάκι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η εικόνα που αγιογραφείται με ευλάβεια ρουφάει από τον ευλαβή αγιογράφο την Χάρη του Θεού και μεταδίδει στους ανθρώπους παρηγοριά αιώνια. Ο αγιογράφος ζωγραφίζεται, μεταφράζεται στην εικόνα που φτιάχνει· γι᾿ αυτό παίζει μεγάλο ρόλο η ψυχική του κατάσταση. Μου έλεγε ο Παπα-Τύχων[75]: «Εγώ, παιντί μου, όταν ζωγραφίζω επιτάφια, ψάλλω «Ο ευσχήμων Ιωσήφ, από του ξύλου καφελών..."». Έψαλλε και έκλαιγε συνέχεια και τα δάκρυά του έπεφταν πάνω στην εικόνα. Μια τέτοια εικόνα κάνει ένα αιώνιο κήρυγμα στον κόσμο. Οι εικόνες αιώνες κηρύττουν–κηρύττουν. Ρίχνει λ.χ. ένας πονεμένος ένα βλέμμα στην εικόνα του Χριστού ή της Παναγίας και παίρνει παρηγοριά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλη η βάση είναι η ευλάβεια. Βλέπεις, άλλος ακουμπά στον τοίχο που ακούμπησε η εικόνα και παίρνει Χάρη, και άλλος μπορεί να έχη την καλύτερη εικόνα, αλλά, επειδή δεν έχει ευλάβεια, δεν ωφελείται. Ή ένας μπορεί να βοηθηθή από έναν απλό σταυρό, και άλλος να μη βοηθηθή από τον Τίμιο Σταυρό, όταν δεν έχη ευλάβεια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσφέρουμε στον Θεό το πιο καθαρό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια φορά σκανδαλίσθηκα εδώ στον Ναό σας. Είδα να καίτε στην Αγία Τράπεζα μια τόσο κοντή λαμπάδα! Εγώ δεν αφήνω ούτε στο μανουάλι που έχω μπροστά στο τέμπλο τόσο μικρή λαμπάδα· το θεωρώ περιφρόνηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Λένε όμως, Γέροντα, ότι το κερί πρέπει να καίγεται μέχρι κάτω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, να καίγεται μέχρι κάτω, αλλά πού; Αυτό έχει σημασία. Άλλο είναι να καίγεται μέχρι κάτω στα μανουάλια όπου ανάβει κεριά ο κόσμος και άλλο στην Αγία Τράπεζα ή στην Αγία Πρόθεση. Δεν κάνει μέσα στο Ιερό να καίη μισή λαμπάδα· είναι περιφρόνηση. Ακόμη και στον πολυέλαιο, έστω και αν φθάνουν οι λαμπάδες για όλη την Ακολουθία, πάλι να τις αλλάζετε, όταν είναι πολύ μικρές. Και στην Θεία Λειτουργία, στην Μικρή και στην Μεγάλη Είσοδο, πάντα να χρησιμοποιήτε μεγάλη λαμπάδα, γιατί συμβολίζει τον Τίμιο Πρόδρομο. Αλλού σβήνουν τα κανδήλια, για να κάνουν οικονομία! Δεν καταλαβαίνουν ότι ο Θεός θα τους στείλη μεγάλες ευλογίες, όταν Τον ευλαβούνται. Και για τα μνημόσυνα είναι περιφρόνηση να χρησιμοποιούνται λεπτά κεριά σαν κεροστούπι. Είναι ντροπή να τα δώσης και στους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι αδελφές να καίνε στα κελλιά όσα κεριά θέλουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ας κάψουν, να καή και ο διάβολος. Εδώ καίγεται ο κόσμος όλος. Μόνο να έχη νόημα το κεράκι που θα ανάψουν· να συνοδεύεται με προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν αφεθή κανείς στον Θεό, είναι μεγάλο πράγμα. Εμείς τρώμε γλυκούς καρπούς και προσφέρουμε την ρητίνη των δένδρων στον Θεό με το θυμιατήρι. Τρώμε το μέλι και προσφέρουμε στον Θεό το κερί, και αυτό συχνά το ανακατεύουμε με παραφίνη. Ένα κερί προσφέρουμε στον Θεό από ευγνωμοσύνη για τις πλουσιοπάροχες ευλογίες Του, και αυτό να το μουρνταρεύουμε; Που να μας ζητούσε ο Θεός να Του προσφέρουμε το μέλι! Φαντάζομαι τότε τί θα κάναμε! Ή ζουμιά θα δίναμε ή λίγο ζαχαρόνερο. Ο Θεός να μη μας πάρη στα σοβαρά! Σε όλα μπορεί να κάνη κανείς οικονομία εκτός από την λατρεία στον Θεό. Στον Θεό θα προσφέρη το πιο καθαρό, το πιο καλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο κόσμος δεν καταλαβαίνει εύκολα ότι είναι ανευλάβεια να καίμε κεριά από παραφίνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να πήτε στον κόσμο: «Για την υγεία σας δεν κάνει να καίτε κεριά από παραφίνη στους Ναούς». Έτσι θα το σκεφθούν λιγάκι αυτό. Αν είναι και μικρός ο Ναός, τότε είναι που πάει να σκάση κανείς. Καλύτερα να ανάψουν ένα μικρό κεράκι και να είναι γνήσιο παρά ολόκληρη λαμπάδα με παραφίνη. Πολλοί στις Εκκλησίες γι᾿ αυτό ζαλίζονται και λιποθυμούν. Να είναι μικρός ο Ναός και να καίγεται όλη αυτή η παραφίνη!... Και να ήταν μόνον αυτό; Λάδια που δεν τρώγονται θέλουν να τα βάλουν στα κανδήλια! Που φθάνουν οι άνθρωποι! Στην Παλαιά Διαθήκη αναφέρεται ότι το λάδι που θα χρησιμοποιούσαν στον Ναό έπρεπε να το φτιάχνουν από ελιές που μάζευαν πάνω από τα δένδρα και όχι από αυτές που έπεφταν κάτω. Μήπως ο Θεός έχει ανάγκη από αυτό το λάδι ή από το θυμίαμα; Όχι, αλλά συγκινείται ο Θεός, γιατί είναι μια προσφορά, με την οποία εκφράζεται η ευγνωμοσύνη και η αγάπη του ανθρώπου προς Αυτόν. Στο Σινά μου είχε κάνει εντύπωση: Οι Βεδουΐνοι δεν έχουν, οι καημένοι, τίποτε να προσφέρουν. Και βλέπεις, μαζεύουν κανένα πετραδάκι που λίγο διαφέρει από τα άλλα, τόοσο μικρούτσικο, ή, αν βρουν σε καμμιά ρωγμή δυό–τρία φυλλαράκια, τα παίρνουν, ανεβαίνουν επάνω στην πέτρα που χτύπησε ο Μωυσής με το ραβδί του και βγήκε το νερό και τα αφήνουν εκεί. Ή οι μητέρες που θηλάζουν πάνε και στάζουν λίγο γάλα εκεί, με τον λογισμό: «Να μου δίνη γάλα ο Θεός, για να θηλάζω τα παιδιά μου»! Βλέπεις τί ευγνωμοσύνη έχουν! Δεν είναι μικρό πράγμα. Και εμείς τί κάνουμε! Θα μας κρίνουν αυτοί οι άνθρωποι. Αφήνουν εκεί πάνω ξυλαράκια, φυλλαράκια, πετραδάκια... Έχει ο Θεός ανάγκη από αυτά; Όχι, αλλά βοηθάει ο Θεός, γιατί βλέπει την αγαθή καρδιά, την αγαθή διάθεση. Έτσι εκφράζεται η αγαθή προαίρεση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ανάβουμε ένα κεράκι, λέμε ότι είναι γι᾿ αυτόν τον σκοπό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το ανάβεις· που το στέλνεις; Δεν το στέλνεις κάπου; Με το κεράκι ζητούμε κάτι από τον Θεό. Όταν το ανάβης και λές «γι᾿ αυτούς που πάσχουν σωματικά και ψυχικά και γι᾿ αυτούς που έχουν την πιο μεγάλη ανάγκη», μέσα σ᾿ αυτούς είναι και οι ζώντες και οι κεκοιμημένοι. Ξέρεις πόση ανάπαυση νιώθουν οι κεκοιμημένοι, όταν ανάβουμε ένα κεράκι γι᾿ αυτούς; Έτσι έχει κανείς πνευματική επικοινωνία και με τους ζώντας και με τους κεκοιμημένους. Το κεράκι με λίγα λόγια είναι μια κεραία που μας φέρνει σε επαφή με τον Θεό, με τους αρρώστους, με τους κεκοιμημένους κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το θυμίαμα, Γέροντα, γιατί το καίμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το ανάβουμε για δοξολογία στον Θεό. Τον δοξολογούμε και Τον ευγνωμονούμε για τις μεγάλες ευεργεσίες Του σε όλον τον κόσμο. Το θυμίαμα είναι και αυτό μια προσφορά. Και αφού το προσφέρουμε στον Θεό και στους Αγίους θυμιάζοντας τις εικόνες, θυμιάζουμε μετά και τις ζωντανές εικόνες του Θεού, τους ανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να βάζετε καρδιά είτε πρόκειται για αίτημα είτε για ευχαριστία. Με το κεράκι λέω: «Θεέ μου, Σού ζητάω με όλη μου την καρδιά να μου κάνης μια χάρη». Και με το θυμίαμα λέω: «Σε ευχαριστώ, Θεέ μου, με όλη μου την καρδιά για όλες τις δωρεές Σου. Σ᾿ ευχαριστώ που συγχωρείς τις δικές μου τις πολλές αμαρτίες και την αχαριστία όλου του κόσμου και την δική μου την αχαριστία την πολλή».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο μπορείτε, να καλλιεργήτε την ευλάβεια, την συστολή. Αυτό θα βοηθήση να δεχθήτε την Χάρη του Θεού. Γιατί, άμα έχη κανείς ευλάβεια και συστολή πνευματική, και είναι και ταπεινός, δέχεται την θεία Χάρη. Αν δεν έχη ευλάβεια και ταπείνωση, η Χάρις του Θεού δεν τον πλησιάζει. Τί λέει η Γραφή; «Επί τίνα επιβλέψω, αλλ᾿ ή επί τον ταπεινόν και ησύχιον και τρέμοντα τους λόγους μου;»[76].
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 5 – Το δόσιμο έχει θείο οξυγόνο
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι ξεχνούν αυτούς που υποφέρουν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, έχετε πει ότι όσο αποφεύγεις την ανθρώπινη παρηγοριά, τόσο λαμβάνεις την θεία. Γι᾿ αυτό καταλαβαίνεις περισσότερο την προσευχή, αν είσαι νηστικός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αλλά και ένας νηστικός καταλαβαίνει και τον νηστικό. Ένας χορτάτος δεν τον καταλαβαίνει. Άκουσα ότι κάπου πετούν τα φαγητά και λίγο πιο κάτω υπάρχουν Ρωσοπρόσφυγες που δεν έχουν να φάνε. Ζούν οι καημένοι μέσα στα θερμοκήπια, σε κάτι παράγκες από λαμαρίνες. Ας πούμε ότι δεν ξέρουν πώς εκεί κοντά υπάρχουν άνθρωποι που έχουν ανάγκη. Καλά, δεν ρωτούν να μάθουν; Να τα πετούν! Εμείς και αυτό το άχρηστο που έχουμε, δεν το δίνουμε. Είναι αμαρτία άλλος να δυσκολεύεται να αγοράση κάτι που του χρειάζεται και άλλος να έχη πράγματα που δεν τα χρησιμοποιεί και να μην τα δίνη σ᾿ αυτόν που τα έχει ανάγκη! Αυτό για μένα είναι η μεγαλύτερη κόλαση. Στην Κρίση θα μας πη ο Χριστός: «Επείνασα και ουκ εδώκατέ μοι φαγείν»[77].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί που τα έχουν όλα λένε: «Δεν υπάρχει φτώχεια σήμερα». Δεν σκέφτονται τον άλλο. Δεν μπαίνουν στην θέση του άλλου, για να μην ενοχληθούν και χάσουν την ησυχία τους. Έτσι όμως πώς να βρουν τον φτωχό; Αν σκέφτεται κανείς τον άλλο, βρίσκει τον φτωχό και βρίσκει και από τί έχει ανάγκη. Υπάρχουν τόσα ορφανά που δεν έχουν έναν άνθρωπο να χαϊδέψη λίγο το κεφαλάκι τους. Οι άνθρωποι ξεχνούν όσους υποφέρουν. Ο νούς τους είναι σε όσους καλοπερνούν και συγκρίνουν μ᾿ αυτούς τον εαυτό τους και όχι με εκείνους που υποφέρουν. Αν σκέφτονταν λιγάκι λ.χ. μερικούς Βορειοηπειρώτες, οι οποίοι, επειδή έκαναν τον σταυρό τους, είναι οι καημένοι είκοσι χρόνια στην φυλακή, σε έναν χώρο ένα επί ένα, θα έβλεπαν αλλιώς τα πράγματα.Φοβερό! Ούτε καν μπορούμε να το σκεφθούμε. Ξέρετε τί θα πη ένα επί ένα; Ούτε καθιστός ούτε ξαπλωτός ούτε όρθιος. Και παράθυρο;... αν έχη καμμιά τρύπα[78].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, σε τάφους!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στον τάφο τουλάχιστον είσαι τεντωμένος. Και τί μαρτύρια! Πολλή δυστυχία πάντως υπάρχει σήμερα, γιατί φτιάχνουν πυρομαχικά και εγκατέλειψαν τον κόσμο. Στην Αφρική είχα δει να τρώνε κοπριές από γκαμήλες. Οι άνθρωποι εκεί έχουν κάτι σώματα, που δεν μοιάζουν με σώματα. Σαν βατράχια είναι. Και ο θώρακας είναι σαν ένα καλαθάκι με βέργες. Γιατί πονάω; Εμείς τα έχουμε όλα, γι᾿ αυτό δεν πονούμε τους άλλους και θέλουμε να πάμε και στον Παράδεισο...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν είχα πάει στην Ιερά Μονή Στομίου το 1958, ήταν στην Κόνιτσα ένας Προτεστάντης που τον ενίσχυσαν οικονομικά από την Αμερική και είχε προσηλυτίσει ογδόντα οικογένειες. Είχε χτίσει μάλιστα και ένα οίκημα, για να συγκεντρώνωνται. Οι καημένοι οι άνθρωποι είχαν μεγάλη ανάγκη και από την μεγάλη φτώχεια αναγκάζονταν να γίνουν Προτεστάντες, γιατί εκείνοι τους βοηθούσαν οικονομικά. Μια μέρα μου είπε κάποιος: «Εγώ όχι μόνον Προτεστάντης αλλά και Εβραίος γίνομαι, γιατί έχω ανάγκη». Όταν το άκουσα αυτό, είπα «κάτι πρέπει να γίνη». Μάζεψα μερικούς που είχαν κάποια οικονομική άνεση και μπορούσαν να βοηθήσουν και τους μίλησα. Τότε οι καημένοι ήταν τελείως κοσμικοί, αλλά είχαν καλή διάθεση. Μια ψυχή συγκεκριμένα, παρόλο που και αυτή ήταν τότε τελείως κοσμική, είχε μεγάλη καρδιά. Όταν την είδα για πρώτη φορά, είπα: «Απ᾿ έξω φαίνεται σάπιο ξύλο, αλλά μέσα είναι δαδί». Αποφασίσαμε λοιπόν να συγκεντρώνουμε μερικά χρήματα και να τα δίνουμε σε φτωχές οικογένειες. Όσα συγκεντρώναμε, τους έλεγα να πηγαίνουν να τα δίνουν οι ίδιοι στους φτωχούς, για να συγκινηθούν και να βοηθηθούν πνευματικά. Έτσι και πέτρινη να είναι η καρδιά τους, μαλακώνει, γίνεται ανθρώπινη, και θα τους ανοιχθή και η πύλη του Παραδείσου. Σε λίγο όλοι αυτοί άλλαξαν, γιατί έβλεπαν την δυστυχία που υπήρχε και δεν τους έκανε καρδιά να πάνε στα κέντρα να διασκεδάσουν. «Μάς έχεις αφοπλίσει, μου έλεγαν. Πώς να πάμε τώρα να διασκεδάσουμε;». Ήρθαν και κοντά στην Εκκλησία. Ένας μάλιστα έμαθα αργότερα ότι είχε γίνει και ψάλτης. Αλλά και οι ογδόντα οικογένειες, με την Χάρη του Θεού, η μια μετά την άλλη επέστρεψαν στην Ορθοδοξία. Όταν αργότερα ήρθαν Αμερικανοί Προτεστάντες να δούν το έργο του Προτεστάντη που τις είχε προσηλυτίσει, τον πέρασαν από δίκη, γιατί δεν είχε πια οπαδούς!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, άλλοι ζητούν εύκολα βοήθεια, όταν έχουν ανάγκη, και άλλοι δεν λένε τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολλοί ντρέπονται και δεν θέλουν να εκτεθούν. Αυτοί έχουν περισσότερη ανάγκη. Εκεί πιάνεται πιο πολύ η βοήθεια. Ξέρω δύο γιατρούς που κάτι τους συνέβη και δεν είχαν χρήματα ούτε μια ασπιρίνη να πάρουν. Ο άνθρωπος που έχει αγάπη δεν αρκείται στο να δώση μόνο σε όποιον του ζητήση ελεημοσύνη, αλλά ψάχνει να βρη ανθρώπους που έχουν ανάγκη, για να τους συμπαρασταθή. Η μητέρα μου φρόντιζε πολύ να βρη τέτοιες περιπτώσεις.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κριτήριο αγάπης
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ένας έχη και δίνη ελεημοσύνη, δεν μπορείς να καταλάβης αν έχη αγάπη ή όχι, γιατί μπορεί να δίνη όχι από αγάπη, αλλά για να ξεφορτωθή κάποια πράγματα. Όταν στερήται και δίνη, τότε φαίνεται η αγάπη του. Πιστεύω, ας υποθέσουμε, ότι έχω αγάπη· ο Θεός, για να δοκιμάση την αγάπη μου, μου στέλνει έναν φτωχό. Αν έχω λ.χ. δυο ρολόγια, ένα καλό και ένα λίγο χαλασμένο, και δώσω το χαλασμένο στον φτωχό, σημαίνει ότι η αγάπη μου είναι δευτέρας ποιότητος. Αν έχω πραγματική αγάπη, θα δώσω το καλό στον φτωχό. Μπαίνει όμως η βλαμμένη λογική και λέμε: «Τί, το καλό θα δώσω; Γι᾿ αυτόν, αφού δεν έχει κανένα ρολόι, καλό είναι και το παλιό», και δίνω το παλιό. Αλλά, όταν δίνης το παλιό, ζη ο παλαιός άνθρωπος ακόμη μέσα σου· αν δίνης το καινούργιο, είσαι αναγεννημένος άνθρωπος. Κολάσιμη κατάσταση είναι, όταν κρατάς και τα δυο και δεν δίνης κανένα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς βγαίνει κανείς από αυτήν την κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να σκεφθή: «Αν ήταν ο ίδιος ο Χριστός, τί θα έδινα; Ασφαλώς το καλύτερο». Έτσι καταλαβαίνει ποιά είναι η πραγματική αγάπη. Θα πάρη λοιπόν μια γερή απόφαση και την άλλη φορά θα δώση το καλύτερο. Μπορεί λίγο να δυσκολευθή στις αρχές, αλλά, αν αγωνίζεται μ᾿ αυτόν τον τρόπο, θα φθάση σε κατάσταση να δίνη και το παλιό και το καινούργιο, για να διευκολύνη τους άλλους, και αυτός να μην έχη ρολόι, αλλά να έχη μέσα του Χριστό και να ακούη το γλυκό χτύπημα της καρδιάς του που θα σκιρτά από θεϊκή χαρά. Αν σού αφαιρέσουν το ιμάτιο και εσύ δώσης και τον χιτώνα που έχεις[79], θα σε ντύση μετά ο Χριστός. Αν πονάς έναν ταλαίπωρο και τον βοηθάς, σκέψου, αν ήταν ο ίδιος ο Χριστός, τί θυσία θα έκανες! Έτσι δίνει κανείς εξετάσεις. Στον πλησίον του ο πιστός άνθρωπος βλέπει το πρόσωπο του Χριστού. Και ο ίδιος ο Χριστός λέει «αυτό που κάνετε σε έναν ταλαίπωρο είναι σαν να το κάνετε σε μένα»[80]. Βέβαια την τιμή την απονέμει στον καθένα ανάλογα[81], αλλά η αγάπη είναι ίδια για όλους. Στην καρδιά του την ίδια θέση έχει ένας υπουργός και ένας φτωχός· ένας στρατηγός και ένας στρατιώτης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς συμβαίνει μερικές φορές, αυτός που βοηθιέται, να φέρεται άσχημα προς αυτόν που τον βοήθησε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο διάβολος πάει και κεντάει τον άλλον, ώστε να μας φερθή άσχημα και να αγανακτήσουμε, οπότε χάνουμε το καλό. Δεν φταίει ο άνθρωπος· ο διάβολος κεντάει τον άλλο, για να μας κάνη να τα χάσουμε όλα. Όταν κάνετε μια καλωσύνη, να αισθάνεσθε πάντα πώς ό,τι κάνετε έχετε υποχρέωση να το κάνετε και να είστε έτοιμες να αντιμετωπίσετε πειρασμό, για να μη χάσετε το καλό που κάνατε, αλλά να το κερδίσετε όλο. Κάνει λ.χ. ένας μια ελεημοσύνη, χωρίς να έχη σκοπό να την φανερώση. Μπαίνει ο πειρασμός στην μέση και βάζει άλλους να του πούν «εσύ ο φιλάργυρος, που δεν έκανες τίποτε κ.λπ., ο τάδε έκανε αυτό, ο τάδε εκείνο», για να τον αναγκάση να πη και αυτός... ταπεινά «έκανα και εγώ κάτι μικρό, ένα νοσοκομείο» ή να τον αναγκάση να αγανακτήση και να πη «ποιός, εγώ, που έκανα αυτό και αυτό;» και να τα χάση όλα. Ή θα βάλη αυτόν που ευεργέτησε να του πή: «Αχάριστε, εκμεταλλευτά κ.λπ.», μέχρι να του απαντήση: «Εγώ εκμεταλλευτής; Εγώ που σού έκανα εκείνη την καλωσύνη, εκείνη την ευεργεσία;». «Βρέ τον αχάριστο, θα πη μετά, δεν ήθελα να μου πη «ευχαριστώ», αλλά τουλάχιστον να το αναγνώριζε». Όταν όμως κανείς περιμένη αναγνώριση, πάει, τα χάνει όλα. Ενώ, αν βάλη έναν καλό λογισμό και πη «καλύτερα που ξέχασε την καλωσύνη που του έκανα» ή «μπορεί να ήταν στεναχωρημένος ή κουρασμένος, γι᾿ αυτό μίλησε έτσι», δικαιολογεί τον άλλον και δεν χάνει. Όταν δεν περιμένουμε ανταπόδοση, τότε έχουμε καθαρό μισθό. Ο Χριστός έκανε το πάν για μας και εμείς Τον σταυρώσαμε. Τί ψάλλουμε; «Αντί του μάννα χολήν»[82]. Πάντοτε να προσπαθούμε να κάνουμε το καλό, χωρίς να περιμένουμε ανταπόδοση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αυτός που δίνει δέχεται θεϊκή χαρά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δυο χαρές υπάρχουν στον άνθρωπο. Μία χαρά, όταν παίρνη, και μία χαρά, όταν δίνη. Δεν συγκρίνεται η χαρά που νιώθει κανείς, όταν δίνη, με την χαρά που νιώθει, όταν παίρνη. Ο άνθρωπος, για να καταλάβη αν προχωράη σωστά πνευματικά, πρέπει να εξετάση κατ᾿ αρχάς αν χαίρεται, όταν δίνη και όχι όταν παίρνη· αν νιώθη στενοχώρια, όταν του δίνουν, και χαρά, όταν δίνη. Ύστερα, αν εργάζεται σωστά πνευματικά, όταν κάνη κανένα καλό, δεν το θυμάται ποτέ, αλλά δεν ξεχνάει ποτέ και το παραμικρό καλό που του κάνουν. Δεν μπορεί να κλείση μάτι από την παραμικρή ευεργεσία των άλλων. Μπορεί αυτός να έχη δώσει ένα αμπέλι στον άλλον και να το έχη ξεχάσει. Αν όμως ο άλλος του δώση ένα τσαμπί σταφύλι από το αμπέλι που εκείνος του χάρισε, δεν μπορεί να το ξεχάση ποτέ. Ή μπορεί να έχη δώσει σε κάποιον πολλές ξυλόγλυπτες εικόνες και να μην το θυμάται. Αν εκείνος του δώση μια εικονίτσα πλαστικοποιημένη, αυτός συγκινείται από την εικονίτσα αυτή, παρόλο που είναι μικρής αξίας, και από ευγνωμοσύνη σκέφτεται πώς να το ανταποδώση. Ακόμη και ολόκληρη Εκκλησία μπορεί να δώση, και το οικόπεδο, και να το ξεχάση. Δηλαδή η σωστή πνευματική πορεία είναι να ξεχνάη κανείς τα καλά που κάνει και να θυμάται τα καλά που του κάνουν οι άλλοι. Όταν φθάση σ᾿ αυτήν την κατάσταση ο άνθρωπος, τότε είναι άνθρωπος· άνθρωπος του Θεού. Αν όμως συνέχεια ξεχνάη τις καλωσύνες που του έκαναν οι άλλοι και θυμάται τις καλωσύνες που έκανε αυτός, αυτή είναι αντίθετη εργασία από αυτήν που ζητάει ο Χριστός. Αλλά και όταν σκέφτεται «εσύ μου έδωσες τόσο και εγώ σού έδωσα τόσο», αυτό πάλι είναι μπακαλίστικο πράγμα. Εγώ κοιτάω να δώσω σ᾿ αυτόν που έχει μεγαλύτερη ανάγκη. Δεν υπολογίζω μπακαλίστικα: ο τάδε μου έδωσε αυτά τα βιβλία και εγώ τώρα σ᾿ αυτόν χρωστάω τόσα, οπότε πρέπει να του τα δώσω, για να εξοφλήσω. Ή, αν ο άλλος δεν μου έδωσε, δεν θα του δώσω και εγώ τίποτε. Και αυτό είναι μια ανθρώπινη δικαιοσύνη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτός που παίρνει κάτι, δέχεται ανθρώπινη χαρά. Αυτός που δίνει, δέχεται θεϊκή χαρά. Την θεϊκή χαρά με το δόσιμο την παίρνουμε. Μου δίνει λ.χ. κάποιος ένα βιβλίο. Αυτός τώρα χαίρεται πνευματικά, θεϊκά, και εγώ που πήρα το βιβλίο χαίρομαι ανθρώπινα. Όταν και εγώ δώσω το βιβλίο, θα χαρώ και εγώ θεϊκά, και ο άλλος που θα το πάρη θα χαρή ανθρώπινα. Όταν και εκείνος το δώση, θα χαρή και αυτός θεϊκά, και εκείνος που θα το πάρη θα χαρή ανθρώπινα. Αν όμως και αυτός το δώση, τότε θα χαρή και θεϊκά κ.ο.κ. Βλέπετε πώς με ένα πράγμα μπορούν πολλοί άνθρωποι να χαρούν και ανθρώπινα και θεϊκά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να μάθη κανείς να χαίρεται με το να δίνη. Όταν χαίρεται με το να δίνη, είναι τοποθετημένος σωστά, είναι δικτυωμένος με τον Χριστό· έχει την θεία Χάρη. Όταν δίνη ή προσφέρη κάτι, η χαρά που νιώθει έχει θείο οξυγόνο. Όταν χαίρεται με το να λαμβάνη ή να θυσιάζωνται οι άλλοι γι᾿ αυτόν, αυτή η χαρά έχει μπόχα, ασφυξία. Τέτοιοι άνθρωποι που δίνονται, χωρίς να υπολογίζουν τον εαυτό τους, θα μας κρίνουν μεθαύριο. Τί χαρά νιώθουν αυτοί οι άνθρωποι! Αυτούς τους προστατεύει ο Χριστός. Αλλά οι περισσότεροι άνθρωποι χαίρονται με το να παίρνουν και στερούνται την θεϊκή χαρά, γι᾿ αυτό είναι βασανισμένοι. Ο Χριστός συγκινείται, όταν αγαπάμε τον πλησίον μας πιο πολύ από τον εαυτό μας, και μας γεμίζει με θεία ευφροσύνη. Βλέπεις, Εκείνος δεν περιορίσθηκε στο «αγαπήσεις τον πλησίον σου ως σεαυτόν»[83], αλλά θυσιάσθηκε για τον άνθρωπο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο φιλάργυρος μαζεύει, για να τα βρουν οι άλλοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι δυο αδελφάκια· το μικρό δίνει, ενώ το μεγάλο δεν δίνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να μάθουν οι γονείς και στο μεγάλο να γλυκαίνεται από το να δίνη. Αν το μεγάλο δουλέψη πάνω σ᾿ αυτό, θα έχη μεγαλύτερο μισθό από το μικρό που από την φύση του δίνει, και θα γίνη καλύτερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα απαλλαγή κανείς από την στενότητα της καρδιάς, από την δυσκολία που έχει να δίνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί, είσαι τσιγγούνα; Θα σε πετάξω έξω! Και στην διακονία, λ.χ. όταν είσαι στο αρχονταρίκι, να πάρης μια γενική ευλογία, για να μπορής να δίνης. Βλέπεις και ο Θεός πόσο άφθονα δίνει σε όλους τις ευλογίες Του; Αν δεν συνηθίση να δίνη κανείς, μαθαίνει στην τσιγγουνιά και δυσκολεύεται μετά να δώση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο φιλάργυρος είναι «κουμπαράς»· μαζεύει αυτός, για να τα βρουν οι άλλοι. Χάνει έτσι την χαρά του δοσίματος και την θεία ανταπόδοση. Λέω σε έναν πλούσιο μια φορά: «Τί τα μαζεύεις; Υποχρεώσεις δεν έχεις. Τί θα τα κάνης;». «Εδώ θα μείνουν, μου λέει, όταν πεθάνω». «Εγώ σού δίνω ευλογία, του λέω, να τα πάρης επάνω όλα!». «Εδώ θα μείνουν, ξαναλέει. Άμα πεθάνω, ας τα πάρουν οι άλλοι». «Έμ, εδώ θα μείνουν, του λέω. Ο σκοπός είναι να τα δώσης με τα ίδια σου τα χέρια τώρα που ζής!». Δεν υπάρχει πιο ανόητος  άνθρωπος από τον πλεονέκτη, που μαζεύει συνέχεια και ζη συνέχεια με στέρηση και τελικά αγοράζει την κόλαση με τις συγκεντρωμένες του οικονομίες. Το έχει τελείως χαμένο, γιατί δεν δίνει και χάνεται με υλικά πράγματα, οπότε χάνει τον Χριστό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τον τσιγγούνη τον κοροϊδεύουν και οι άλλοι. Ήταν ένας πολύ πλούσιος κτηματίας· είχε χωράφια σε μια επαρχία, είχε και στην Αθήνα διαμερίσματα, αλλά ήταν πολύ τσιγγούνης. Μια φορά έφτιαξε μια χύτρα φασολάδα τελείως νερουλή, για να φάνε οι εργάτες που δούλευαν στα χωράφια του. Παλιά δούλευαν οι καημένοι από το πρωί, πριν βγή ο ήλιος, μέχρι να βασιλέψη. Το μεσημέρι που σταμάτησαν λίγο, για να ξεκουρασθούν, άδειασε το αφεντικό μέσα σε έναν ταβά την φασολάδα και φώναξε τους εργάτες να φάνε. Κάθησαν γύρω-γύρω οι καημένοι οι εργάτες και άρχισαν να τρώνε· πότε έπιαναν με το κουτάλι από κανένα φασόλι, πότε μόνον ζουμί! Ένας εργάτης ήταν πολύ πειραχτήρι. Αφήνει το κουτάλι του και πάει παραπέρα. Βγάζει τις αρβύλες του, τις κάλτσες του και προχωράει να μπή μέσα στον ταβά. «Τί κάνεις;», του λένε οι άλλοι. «Λέω να μπώ μέσα, μήπως πιάσω κανένα φασόλι!», τους λέει. Τόσο τσιγγούνης ήταν εκείνος ο ταλαίπωρος. Γι᾿ αυτό, χίλιες φορές να τον κυριέψη η σπατάλη τον άνθρωπο παρά η τσιγγουνιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η τσιγγουνιά είναι αρρώστια, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολύ μεγάλη αρρώστια! Άμα κυριέψη τον άνθρωπο η τσιγγουνιά, μεγαλύτερη αρρώστια δεν υπάρχει. Η οικονομία καλή είναι, αλλά να προσέξη κανείς να μην τον κυριέψη σιγά-σιγά ο πειρασμός με την τσιγγουνιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικοί, Γέροντα, από την τσιγγουνιά μένουν νηστικοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μόνον νηστικοί; Ήταν ένας έμπορος πλούσιος που είχε ένα μεγάλο εμπορικό και έκοβε με τον σουγιά στα τρία εκείνα τα σπίρτα τα πλακέ! Μια άλλη πολύ πλούσια είχε ένα θειαφοκέρι· κρατούσε κάρβουνα και έπαιρνε με το θειαφοκέρι από τα κάρβουνα να ανάψη την φωτιά, για να μην ξοδέψη κανένα σπίρτο. Και είχε σπίτια, κτήματα, μεγάλη περιουσία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δεν λέω να είναι κανείς σπάταλος, αλλά τουλάχιστον, όταν κάποιος είναι σπάταλος, αν του ζητήσης κάτι, εύκολα θα σού το δώση. Αν είναι τσιγγούνης, θα λυπάται να σού το δώση. Ήταν μια φορά δυο νοικοκυρές και συζητούσαν στην γειτονιά για σαλάτες, για ξίδια και πάνω στην συζήτηση είπε η μία: «Έχω πολύ καλό ξίδι». Μια φορά χρειάσθηκε η άλλη η φουκαριάρα λίγο ξίδι και πήγε να της ζητήση. «Άκου εδώ, της λέει εκείνη, εγώ, αν το έδινα, δεν θα είχα ξίδι επτά χρόνων!». Καλά είναι να κάνη οικονομία κανείς και να δίνη. Οικονόμος δεν θα πη τσιγγούνης. Ο πατέρας μου χρήματα δεν κρατούσε. Στα Φάρασα δεν είχαν ξενοδοχείο· το σπίτι μας ήταν σαν ξενοδοχείο. Όποιος ερχόταν στο χωριό, στον πρόεδρο θα πήγαινε να μείνη. Θα έτρωγε, θα του έπλεναν τα πόδια, θα του έδιναν και κάλτσες καθαρές.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τώρα, βλέπω ότι και σε μερικά προσκυνήματα έχουν αποθήκες ολόκληρες με κανδήλια και δεν λένε: «Έχουμε, μη μας δίνετε άλλα». Αυτά ούτε μπορούν να τα χρησιμοποιήσουν ούτε να τα πουλήσουν, αλλά ούτε και τα δίνουν. Όταν αρχίση να μαζεύη κανείς, δένεται και δεν μπορεί να δώση. Αν όμως αρχίση να μη μαζεύη πράγματα και τα δίνη, τότε θα μαζευτή η καρδιά στον Χριστό, χωρίς να το καταλάβη. Μια χήρα να μην έχη χρήματα να αγοράση έναν πήχυ ύφασμα να ντύση τα παιδιά της, και εγώ να μαζεύω! Πώς να το ανεχθώ αυτό; Στο Καλύβι δεν έχω ούτε πιάτα ούτε κατσαρόλια· τενεκεδάκια έχω. Προτιμώ ένα πεντακοσάρικο να το δώσω σε έναν φοιτητή, να πάη από το ένα μοναστήρι στο άλλο, παρά να πάρω κάτι για μένα. Αν δεν μαζεύης, έχεις ευλογία από τον Θεό. Όταν δίνης ευλογία, παίρνεις ευλογία. Η ευλογία γεννάει ευλογία.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καλή διάθεση είναι το πάν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μου ζητάη κάποιος βοήθεια, αλλά δεν έχω να του δώσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν θέλω να κάνω ελεημοσύνη και δεν έχω να δώσω, τότε κάνω ελεημοσύνη με αίμα. Ο άλλος που έχει και δίνει υλική βοήθεια, νιώθει και χαρά, ενώ αυτός που δεν έχει να δώση, συνέχεια υποφέρει και ταπεινωμένος λέει: «Δεν έκανα ελεημοσύνη». Η καλή διάθεση είναι το πάν. Ένας πλούσιος έχει να δώση, αλλά δεν δίνει. Ένας φτωχός θέλει να δώση, αλλά δεν δίνει, γιατί δεν έχει να δώση. Διαφέρει το ένα από το άλλο. Ο πλούσιος, αν δώση, νιώθει και μια ευχαρίστηση. Ο φτωχός πονάει, θέλει να κάνη μια καλωσύνη, αλλά δεν έχει να δώση, και υποφέρει ψυχικά· ενώ, άμα είχε, θα έδινε και δεν θα υπέφερε. Η καλή διάθεση φαίνεται από τα έργα. Αν κάποιος ζητήση από έναν φτωχό ελεημοσύνη και ο φτωχός, αν και στερήται, του δώση, άσχετα αν ο άλλος πάη να τα πιή ούζο, τότε ο φτωχός που έδωσε θα έχη πνευματική χαρά, και ο Θεός θα φωτίση κάποιον να στείλη και σ᾿ αυτόν υλική βοήθεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και ξέρετε μερικές φορές τί αδικία γίνεται; Ο ένας να δίνη ό,τι έχει, για να βοηθήση, και ο άλλος να τα ερμηνεύη με τον λογισμό του όπως θέλει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί εννοείτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ας υποθέσουμε, ένας, ο καημένος, έχει λ.χ. όλο κι όλο πέντε χιλιάδες δραχμές στην τσέπη του. Βρίσκει στον δρόμο του έναν ζητιάνο, τις βάζει στο χέρι του και φεύγει. Ο ζητιάνος μετά βλέπει ότι είναι πεντοχίλιαρο και χαίρεται. Περνάει εκείνη την ώρα και ένας πολύ πλούσιος και βλέποντας ότι ο άλλος έδωσε πεντοχίλιαρο λέει με τον λογισμό τον δικό του: «Για να δίνη αυτός πεντοχίλιαρο, ποιός ξέρει πόσα έχει! εκατομμυριούχος θα είναι!». Οπότε δίνει αυτός στον ζητιάνο πεντακόσιες δραχμές και αναπαύει τον λογισμό του ότι έκανε το καθήκον του. Ενώ εκείνος ο καημένος είχε μόνον αυτό το πεντοχίλιαρο καί, μόλις είδε τον ζητιάνο, σκίρτησε η καρδιά του και του το έδωσε. Αν και ο πλούσιος δούλευε λίγο πνευματικά, θα είχε και έναν καλό λογισμό και θα έλεγε: «Για δές, έδωσε αυτό που είχε». Ή θα έλεγε: «Θα είχε δέκα χιλιάδες και έδωσε τις πέντε χιλιάδες». Αλλά πώς να φέρη καλό λογισμό, αφού δεν δούλεψε πνευματικά; Σού λέει: «Για να πετάη έτσι τα λεφτά, με το φτυάρι τα μαζεύει».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί άνθρωποι πάλι, ενώ δίνουν πεντακόσιες ή χίλιες δραχμές σε έναν φτωχό, κάνουν εβραίικα παζάρια για πέντε ή δέκα δραχμές στον φτωχό εργάτη που τους δούλεψε. Δεν μπορώ να καταλάβω: Καλά, δίνεις πεντακοσάρικο και χιλιάρικο σ᾿ εκείνον που δεν ξέρεις και αυτόν που έχεις κοντά σου και σε βοηθάει τον αφήνεις να πεινά; Αυτόν πρώτα έχεις υποχρέωση να αγαπήσης και να βοηθήσης. Αλλά φαίνεται ότι η ελεημοσύνη αυτών των ανθρώπων γίνεται, για να τους επαινέσουν. Ή άλλον μπορεί να τον πάνε ακόμη και στο δικαστήριο για χίλιες δραχμές, γιατί ξεκινάνε από μια κοσμική λογική, δήθεν να μην τους θεωρήσουν κορόιδα. Μια θρησκευόμενη γυναίκα μου διηγήθηκε[84]ένα περιστατικό. Ήθελε να αγοράση ένα φορτιό ξύλα από μια γιαγιά, η οποία έκανε τρεις ώρες δρόμο, για να τα φέρη από το δάσος στο χωριό. Εκείνη την φορά μάλιστα είχε κάνει και μισή ώρα επιπλέον, δηλαδή τρεισήμισι ώρες, γιατί έκανε τον κύκλο της στρατώνας, μην την πιάση το Δασαρχείο. «Πόσο κάνουν;», την ρωτάει η κυρία. «Δεκαπέντε δραχμές», λέει η γιαγιά. «Όχι, είναι πολλά, της λέει, έντεκα δραχμές τα παίρνω». «Έτσι, για να μη μας παίρνουν για κουτούς, μου λέει, εμάς τους πνευματικούς ανθρώπους...». Της έκανα μετά ένα ξεσκόνισμα. Δύο ζώα είχε η γιαγιά και είχε χάσει δύο μέρες, για να κερδίση είκοσι δύο δραχμές. Αντί να της έδινε και ένα εικοσάρικο παραπάνω, της έκανε εβραίικα παζάρια.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ελεημοσύνη πολύ βοηθάει τους κεκοιμημένους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο πλούτος φέρνει την καταστροφή στον άνθρωπο, όταν δεν διανέμεται στους φτωχούς για την ψυχή μας και για τις ψυχές των πεθαμένων μας. Η ελεημοσύνη στους πονεμένους, χήρες, ορφανά κ.λπ. πάρα πολύ βοηθάει και για την ανάπαυση των κεκοιμημένων. Γιατί, όταν δίνη κανείς ελεημοσύνη για έναν κεκοιμημένο, οι άλλοι λένε: «Θεός σχωρέσ᾿ τον. Να αγιάσουν τα κόκκαλά του». Αν τύχη κάποιος να έχη αρρώστιες, να μην μπορή να δουλέψη, να έχη χρέη, και σε μια τέτοια δύσκολη περίσταση τον βοηθήσης και πής «πάρ᾿ τα για την ψυχή του τάδε», θα πη και αυτός: «Θεός σχωρέσ᾿ τον, να αγιάσουν τα κόκκαλά του!». Κάνουν δηλαδή καρδιακή προσευχή και αυτό είναι που βοηθάει πολύ τους κεκοιμημένους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν κάποιας ο άνδρας πεθάνη ακοινώνητος, ανεξομολόγητος ή σκοτωθή το παιδί της, τί άλλο μπορεί να κάνη, για να βοηθήση τις ψυχές τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όσο μπορεί, να γίνη η ίδια καλύτερη. Αυτό φυσικά θα βοηθήση και την ίδια, αλλά θα βοηθήση και τον άνδρα της, γιατί, αφού στεφανώθηκαν, έχει μερίδιο και εκείνος που πέθανε. Αυτό είναι το κυριώτερο από όλα· να γίνη καλύτερη. Αλλιώς, μπορεί να κάνη και μια καλωσύνη, αλλά να έχη και τον χαβά της. Σού λέει: «Έκανα τα καθήκοντά μου. Άλλο τί θέλεις να κάνω;» και μένει αδιόρθωτη ή και χειροτερεύει.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ελεημοσύνη «εν τω κρυπτώ»[85]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί θεωρούν φαρισαϊσμό το να πηγαίνη κανείς στην Εκκλησία και να υστερή στην αγάπη και την θυσία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, που το ξέρουν; Είναι σίγουροι γι᾿ αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έτσι κρίνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Χριστός τί είπε; «Να κρίνετε»[86]; Ο άλλος μπορεί να μη δίνη στον τσιγγάνο, γιατί έχει υπ᾿ όψιν του έναν άρρωστο που έχει μεγάλη ανάγκη και θα βοηθήση εκείνον. Τον τσιγγάνο κάποιος περαστικός θα βρεθή να του δώση κάτι, ενώ εκείνον δεν θα του δώση κανένας. Πώς βγάζουν συμπεράσματα, χωρίς να ξέρουν; Φαρισαϊσμός είναι, όταν κάποιος κάνη την καλωσύνη φανερά, για να τον επαινέσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θυμάμαι, όταν ήμουν το 1957 στο Ιδιόρρυθμο[87], έδιναν για κάθε διακόνημα, ανάλογα με το πόσο δύσκολο ήταν, μια ευλογία. Επειδή τότε υπήρχε στα μοναστήρια λειψανδρία, ήταν μερικοί Πατέρες που είχαν δυνάμεις και αναλάμβαναν πολλά διακονήματα και έπαιρναν περισσότερες ευλογίες, αλλά τις έδιναν. Ήταν ένας μοναχός που τον έλεγαν «σπάγκο», γιατί δεν έδινε. Όταν πέθανε αυτός ο μοναχός, μαζεύτηκαν στην κηδεία του ταλαίπωροι άνθρωποι από εδώ από την Χαλκιδική, από την Μεγάλη Παναγία, από το Παλαιοχώρι, το Νεοχώρι, και τον έκλαιγαν. Αυτοί είχαν βόδια και κουβαλούσαν την ξυλεία, τους γρεντέδες, γιατί τότε η μεταφορά γινόταν με τα βόδια – μη βλέπης τώρα που γίνεται με αυτοκίνητα, με τριαξονικά! Τί έκανε αυτός ο καημένος; Μάζευε–μάζευε τα χρήματα που του έδιναν για τα διακονήματα που έκανε καί, όταν έβλεπε έναν οικογενειάρχη που είχε μόνον ένα βόδι ή ψοφούσε το βόδι του, του αγόραζε ένα βόδι. Και τότε το να αγοράσης ένα βόδι ήταν μεγάλο πράγμα· στοίχιζε πέντε χιλιάδες δραχμές, αλλά τα χρήματα ήταν γερά. Οι άλλοι Πατέρες έδιναν πέντε δραχμές στον έναν φτωχό, δέκα στον άλλον, κανένα εικοσάρικο στον άλλον, έκαναν δηλαδή τέτοιες καλωσύνες και φαίνονταν. Εκείνος καθόλου δεν φαινόταν, γιατί δεν έδινε όπως έδιναν οι άλλοι, αλλά τα μάζευε και βοηθούσε με αυτόν τον τρόπο. Έτσι όλοι τον έλεγαν «σπάγκο, σπάγκο» και πήρε το όνομα «σπάγκος», σπαγκοραμμένος δηλαδή! Και τελικά, όταν πέθανε, μαζεύτηκαν οι καημένοι και έκλαιγαν. «Με έσωσε!», έλεγε ο ένας, «μέ έσωσε!», έλεγε ο άλλος. Γιατί τότε, άμα είχε ένα βόδι κανείς, μετέφερε την ξυλεία και έτρεφε την οικογένειά του. Τα έχασαν οι Πατέρες! Γι᾿ αυτό λέω, που ξέρεις τί κάνει ο άλλος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάνη ελεημοσύνη κανείς, αλλά νιώθη ένα κενό, τί φταίει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να προσέξη μήπως κινείται από ανθρωπαρέσκεια. Όταν έχη καθαρά κίνητρα, αισθάνεται χαρά. Σε μια πόλη ξέρετε τί έκαναν μια φορά; Μου το έλεγε ένας γνωστός μου ευλαβής δικηγόρος. Πλησίαζαν Χριστούγεννα και είπαν μερικοί Χριστιανοί να μαζέψουν διάφορα πράγματα, να τα κάνουν δέματα και να τα μοιράσουν στην πλατεία στους φτωχούς – ήταν τότε μετά την Κατοχή που οι άνθρωποι είχαν ανάγκη. Τους λέει ο δικηγόρος: «Αφού ξέρουμε ποιοί είναι οι φτωχοί, καλύτερα να τα δώσουμε αθόρυβα». «Όχι, του λένε, να τα μοιράσουμε στην πλατεία εις δόξαν Θεού, για να δούν ότι ενδιαφερόμαστε». «Μά δεν κάνει, τους ξαναλέει αυτός. Που το βρήκατε γραμμένο να γίνεται έτσι η ελεημοσύνη;». Το δικό τους εκείνοι· «εις δόξαν Θεού...». Με κανέναν τρόπο δεν μπορούσε να τους πείση. Αφού είδε και απόκαμε, τους άφησε. Συγκέντρωσαν λοιπόν τα δέματα στην μεγάλη πλατεία της πόλεως και ανακοίνωσαν κιόλας ότι εκεί θα μοιράσουν δέματα. Το έμαθαν όλοι και όρμησαν κάτι άνθρωποι μπαμπάτσικοι, σαν γορίλλες, και μάζευαν–μάζευαν, τα άρπαξαν όλα. Και έτσι πήραν τα δέματα όσοι ήταν βάρβαροι και δεν είχαν ούτε ανάγκη, και οι καημένοι οι φτωχοί έμειναν με άδεια χέρια. Μόλις πήγαν οι υπεύθυνοι να αντιδράσουν, τους έδωσαν και ένα ξύλο γερό «εις... δόξαν Θεού!». Βλέπετε πώς λειτουργούν οι πνευματικοί νόμοι! Σε έναν κοσμικό δικαιολογείται και να υπερηφανευθή και να κάνη διαφήμιση, αλλά στους πνευματικούς ανθρώπους πώς να δικαιολογηθή;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχουν άνθρωποι που δεν πιστεύουν, αλλά είναι πονόψυχοι και κάνουν καλωσύνες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν ένας κοσμικός δίνη από καθαρή διάθεση και όχι από ανθρωπαρέσκεια, τότε ο Θεός δεν θα τον αφήση, αλλά κάποτε θα μιλήση στην καρδιά του. Μου διηγήθηκε μια φορά ένας γνωστός μου που ζούσε στην Ελβετία το εξής περιστατικό: Μια πλούσια άθεη κυρία ήταν τόσο πονόψυχη, που είχε φθάσει σε σημείο να μοιράση όλη την περιουσία της σε φτωχούς και πονεμένους, και στο τέλος έμεινε πάμφτωχη. Τότε, όσοι είχαν βοηθηθή, φρόντισαν να μπή στο καλύτερο Γηροκομείο. Παρόλο όμως που έκανε τόσες καλωσύνες, παρέμενε άθεη. Πήγαιναν να της μιλήσουν για τον Χριστό και δεν δεχόταν συζήτηση.  Έλεγε πώς ο Χριστός δεν ήταν τίποτε άλλο παρά ένας καλός άνθρωπος, ένας κοινωνικός εργάτης, και άλλες τέτοιες θεωρίες. Ίσως και οι Χριστιανοί που είχε γνωρίσει να μην την είχαν βοηθήσει, για να συγκινηθή από την ζωή τους. «Κάνε προσευχή γι᾿ αυτήν την ψυχή», μου έλεγε ο φίλος μου. Πάντως έκανε πολλή προσευχή και εκείνος για την μεταστροφή της. Μετά από καιρό μου είπε ο φίλος μου: «Μια μέρα που πήγα να την επισκεφθώ στο Γηροκομείο, την βρήκα ολότελα αλλαγμένη. «Πιστεύω, πιστεύω», φώναζε». Της είχε συμβή ένα γεγονός που την αλλοίωσε· ζήτησε μετά να βαπτισθή.'
- type: h2
  initial:
    ru: ''
  text:
    ru: «Τούτο ποιών άνθρακας πυρός σωρεύσεις επί την κεφαλήν αυτού»[88]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ένας δεν έχη ανάγκη, αλλά προσποιήται ότι έχει, πρέπει να τον βοηθήσουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ο Χριστός είπε: «Να δίνουμε σ᾿ αυτόν που μας ζητάει, χωρίς να εξετάζουμε»[89]. Και αν δεν έχη ανάγκη αυτός που σού ζητάει, πάλι πρέπει να του δώσης. Να χαίρεσαι που θα του δώσης. Ο Θεός «βρέχει επί δικαίους και αδίκους»[90], εμείς γιατί να μη βοηθήσουμε τον πλησίον μας; Μήπως και εμείς είμαστε άξιοι για όλα τα δώρα που μας δίνει ο Θεός; Ο Θεός «ου κατά τας ανομίας ημών εποίησεν ημίν, ουδέ κατά τας αμαρτίας ημών ανταπέδωκεν ημίν»[91]. Σού ζητάει κάποιος φτωχός βοήθεια; Ακόμη και αν αμφιβάλλης για την κατάστασή του, πάλι να τον βοηθήσης με διάκριση, για να μη σε πειράξη ο λογισμός. Είδες τί λέει ο Αββάς Ισαάκ; «Και έφιππος να σού ζητήση, να του δώσης»[92]. Δεν ξέρεις σε τί κατάσταση είναι. Εσύ να πιστεύης αυτό που σού λέει ο άλλος και να δίνης ανάλογα με αυτό που σού ζητάει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εάν έχουμε λ.χ. μόνο χίλιες δραχμές και τις δώσουμε σε έναν φτωχό και ανησυχήσουμε που δεν έχουμε περισσότερα να δώσουμε, τότε εκτός από την ευλογία (τά χρήματα που του δίνουμε), του βάζουμε στην συνείδησή του τον Χριστό και την καλή ανησυχία. Αυτή η πράξη μας θα τον αναστατώση, γιατί ο νούς του συνέχεια θα γυρίζη στον ελεήμονα εκείνον που του έδωσε μαζί με το χιλιάρικο και την πονεμένη του καρδιά, και θα αναγκασθή να του στείλη ανώνυμα τα χρήματα που του στέρησε ή και ακόμη περισσότερα. Σ᾿ εμένα έχει συμβή ένα παρόμοιο γεγονός. Μια φορά που βρέθηκα στην Θεσσαλονίκη με σταμάτησε μια γυναίκα – φαινόταν σαν τσιγγάνα – και μου ζήτησε χρήματα για τα παιδιά της, γιατί είχε άρρωστο τον άνδρα της. Είχα μόνον ένα πεντακοσάρικο και της το έδωσα. «Με συγχωρής, της είπα, δεν έχω περισσότερα να σού δώσω. Αν θέλης, πάρε την διεύθυνσή μου και γράψε μου πώς πάει ο άνδρας σου και θα προσπαθήσω να σού στείλω από το Άγιον Όρος περισσότερα». Μετά από λίγο καιρό έλαβα ένα γράμμα με ένα πεντακοσάρικο που έγραφε: «Σ́ ευχαριστώ για την καλωσύνη σου· σού επιστρέφω τα χρήματα που μου έδωσες». Όταν κανείς δίνη ελεημοσύνη με πόνο, ο ζητιάνος καίγεται από την αγάπη, τον Χριστό, και θα αρχίση και αυτός να μοιράζη και να μη μαζεύη. Αλλά και να τύχη ακόμη να είναι πολύ σκληρόκαρδος ο ζητιάνος και να μαζεύη, ο ίδιος δεν θα χαρή όσα μάζεψε, αλλά θα οικονομήση ο Θεός να βρουν τα χρήματα τον τόπο τους, και σ᾿ αυτόν θα μείνη μόνον η κούραση και η ταλαιπωρία για τον έρανο (νά τον ονομάσουμε έτσι) που έκανε για τους άλλους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δηλαδή πόσο πρέπει να δίνη κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να δίνη τόσο, που να μην τον πειράζη η συνείδησή του. Χρειάζεται διάκριση. Να μη δίνη εκατό και μετά στενοχωριέται που δεν έδωσε πενήντα. Πολλή προσοχή χρειάζεται, όταν κανείς έχη αγάπη με πολύ ενθουσιασμό. Καλό είναι να φρενάρη τότε λίγο την αγάπη του και τον ενθουσιασμό του, για να μη μετανοή που έδωσε πολλά σε έναν δυστυχισμένο, ενώ έπρεπε λιγώτερα, και έμεινε με άδεια χέρια ο ίδιος. Σιγά-σιγά θα αποκτήση πείρα και θα δίνη ανάλογα με την αυταπάρνηση που έχει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ο άλλος ζητά πράγματα παράλογα, να του τα δίνουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εκεί χρειάζεται διάκριση και ξανά διάκριση. Όταν ένας σού ζητά πράγματα, για να τα καμαρώνη, δώσ᾿ τα. Βλέπεις, ο Χριστός δεν είπε στον Ιούδα «τί Απόστολος είσαι σύ; κόψε την φιλαργυρία σου», αλλά του έδωσε και το ταμείο[93]. Εάν όμως ένας σού ζητά π.χ. ένα κουτί μαρμελάδα που έχεις, και εσύ ξέρης ότι αυτός έχει ένα κιούπι γεμάτο, ενώ κάποιος άλλος δεν έχει καθόλου και έχει ανάγκη, τότε πές σ᾿ αυτόν που έχει και ζητάει και άλλο: «Αν θέλης, αδελφέ, δώσε και εσύ λίγο από αυτό που έχεις στον τάδε». Αν δεν υπάρχη κάποιος που να μην έχη, τότε δώσ᾿ το, χωρίς να του πής τίποτε, μια που σού το ζήτησε. Μπορεί από αυτό το δόσιμο, αν υπάρχη μια χορδή ευαισθησίας μέσα του, να συγκινηθή και να διορθωθή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σ́ αυτές τις περιπτώσεις δηλαδή συμβαίνει αυτό που αναφέρει ο Απόστολος Παύλος: «Όταν ο εχθρός σου σού κάνη κακό και εσύ του κάνης καλωσύνη, κάρβουνα αναμμένα συσσωρεύεις στο κεφάλι του». Αυτό δεν σημαίνει ότι τον καίς, αλλά, όταν του κάνης καλωσύνη, τότε αρχίζει να δουλεύη μέσα του η αγάπη που είναι ο Χριστός και ενεργεί η θεία Χάρις. Μετά αλλοιώνεται ο άνθρωπος, γιατί τον πειράζει η συνείδηση, καίγεται δηλαδή από την συνείδησή του. Δεν είναι όμως σωστό να κάνης το καλό, για να ελεγχθή ο άλλος και να συνετισθή, γιατί και αυτό αποδυναμώνει το καλό, αλλά να το κάνης με αγάπη. Όταν τον εκδικήσαι με το καλό, αλλοιώνεται με την καλή έννοια και διορθώνεται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ήταν ένας μέθυσος στην Κόνιτσα, που είχε και οικογένεια, και του έδινα κάτι. Είχαν μάθει μερικοί ότι τον βοηθούσα τον καημένο, γιατί και ο ίδιος το έλεγε, και μου είπαν: «Μήν του δίνης· αυτός πίνει». Εκείνος μου έλεγε «δώσ́ μου για τα παιδιά μου», και εγώ, όταν του έδινα, του έλεγα: «Πάρε αυτά για τα παιδιά σου». Ήξερα ότι πίνει, αλλά ήξερα ότι αυτός ο λόγος θα τον βοηθήση λίγο· θα πηγαίνη να πίνη, αλλά θα σκέφτεται και λίγο τα παιδιά του. Αν δεν του έδινα, θα βασάνιζε την γυναίκα του, γιατί θα της έπαιρνε από τα χρήματα που έβγαζε εκείνη – πήγαινε η καημένη και ξενοδούλευε – και θα έπινε, και τα παιδιά του θα δυστυχούσαν πιο πολύ. Όταν όμως του έλεγα «πάρε για τα παιδιά σου», θυμόταν και λίγο τα παιδιά του. Κατάλαβες; Τον πονούσα, και αυτό ήταν πολύ αισθητό· δούλευε μέσα του. Πολλοί έχουν βοηθηθή έτσι. Μερικοί, επειδή τους πείραζε ύστερα η συνείδηση, έστελναν τα χρήματα πίσω.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εμείς με την λογική μας δεν αφήνουμε τον Χριστό να δουλέψη. Μάθετε το σωστό Ευαγγέλιο τώρα, αν θέλετε να γίνετε άνθρωποι «Ευαγγελικοί», όχι Προτεστάντες!
- type: h2
  initial:
    ru: ''
  text:
    ru: Τρίτο Μέρος – Πνευματική Λεβεντιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Η ανώτερη χαρά βγαίνει από την θυσία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μόνον όταν θυσιάζεται κανείς,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: συγγενεύει με τον Χριστό,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιατί ο Χριστός είναι θυσία».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Τα σημεία των καιρών[94]
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Αντίχριστος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, πέστε μας κάτι για τον Αντίχριστο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ας πούμε μια φορά για τον Χριστό... Όσο μπορούμε να είμαστε κοντά στον Χριστό. Αν είμαστε με τον Χριστό, τον Αντίχριστο θα φοβηθούμε; Μήπως το αντίχριστο πνεύμα δεν υπάρχει τώρα; Το κακό ούτως ή άλλως το κάνει το αντίχριστο πνεύμα. Και αν γεννηθή και ένα αντίχριστο τέρας και κάνη μερικά μπανταλά, θα γελοιοποιηθή στο τέλος. Θα συμβούν όμως γεγονότα πολλά. Ίσως προλάβετε να ζήσετε και εσείς πολλά από τα σημεία που γράφει η Αποκάλυψη. Σιγά-σιγά αρκετά αρχίζουν να βγαίνουν. Φωνάζω ο ταλαίπωρος πριν από πόσα χρόνια! Είναι φοβερή, εξωφρενική η κατάσταση! Η παλαβομάρα έχει ξεπεράσει τα όρια. Ήρθε η αποστασία και μένει τώρα να έρθη «ο υιός της απωλείας»[95]. Θα γίνη τρελλοκομείο. Μέσα στην αναμπουμπούλα που θα επικρατή, θα ξεσηκωθή κάθε κράτος να κάνη ό,τι του λέει ο λογισμός. Ο Θεός να βάλη το χέρι Του, τα συμφέροντα των μεγάλων να είναι τέτοια, που να μας βοηθήσουν. Κάθε λίγο θα ακούμε κάτι καινούργιο. Θα βλέπουμε να γίνωνται τα πιο απίθανα, τα πιο παράλογα πράγματα. Μόνον που τα γεγονότα θα περνάνε τάκα-τάκα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οικουμενισμός, κοινή αγορά, ένα κράτος μεγάλο, μια θρησκεία στα μέτρα τους. Αυτά είναι σχέδια διαβόλων. Οι Σιωνιστές ετοιμάζουν κάποιον για Μεσσία. Γι'' αυτούς ο Μεσσίας είναι βασιλιάς, δηλαδή θα κυβερνήση εδώ στην γή. Οι Ιεχωβάδες και αυτοί αποβλέπουν σε έναν βασιλιά επίγειο. Θα παρουσιάσουν οι Σιωνιστές έναν, και οι Ιεχωβάδες θα τον δεχθούν. Θα πούν «αυτός είναι». Θα γίνη μεγάλη σύγχυση. Μέσα στην σύγχυση αυτή όλοι θα ζητούν έναν Μεσσία, για να τους σώση. Και τότε θα παρουσιάσουν κάποιον που θα πή: «Εγώ είμαι ο Ιμάμης, εγώ είμαι ο πέμπτος Βούδδας, εγώ είμαι ο Χριστός που περιμένουν οι Χριστιανοί, εγώ είμαι αυτός που περιμένουν οι Ιεχωβάδες, εγώ είμαι ο Μεσσίας των Εβραίων». Πέντε «εγώ» θα έχη!...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Ευαγγελιστής Ιωάννης, όταν λέη στην πρώτη επιστολή «Παιδία,...ότι ο αντίχριστος έρχεται, και νυν αντίχριστοι πολλοί γεγόνασιν...»[96], δεν εννοεί ότι και ο αναμενόμενος Αντίχριστος θα είναι σαν τους διώκτες Μαξιμιανούς και Διοκλητιανούς, αλλά ότι ο Αντίχριστος θα είναι ο αναμενόμενος κατά κάποιον τρόπο ενσαρκωμένος διάβολος, που θα παρουσιασθή στον ισραηλιτικό λαό ως Μεσσίας και θα πλανήση τον κόσμο. Έρχονται δύσκολα χρόνια· θα έχουμε δοκιμασίες μεγάλες. Θα έχουν μεγάλο διωγμό οι Χριστιανοί. Και βλέπεις, οι άνθρωποι ούτε καν καταλαβαίνουν ότι ζούμε στα σημεία των καιρών, ότι προχωρεί το σφράγισμα. Είναι σαν να μη συμβαίνη τίποτε. Γι᾿ αυτό λέει η Γραφή ότι θα πλανηθούν και οι εκλεκτοί[97]. Όσοι δεν θα έχουν καλή διάθεση, δεν θα φωτισθούν και θα πλανηθούν στα χρόνια της αποστασίας. Γιατί, όποιος δεν έχει την θεία Χάρη, δεν έχει πνευματική διαύγεια, όπως και ο διάβολος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πιστεύουν, Γέροντα, οι Σιωνιστές τα περί Αντιχρίστου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτοί θέλουν να κυβερνήσουν όλον τον κόσμο. Χρησιμοποιούν για να πετύχουν τον σκοπό τους την μαγεία και τον σατανισμό. Την σατανολατρία την βλέπουν σαν μια δύναμη, που θα τους βοηθήση στα σχέδιά τους. Πάνε δηλαδή να κυβερνήσουν τον κόσμο με σατανική δύναμη. Τον Θεό δεν Τον βάζουν στον λογαριασμό τους. Θα ευλογηθούν όμως έτσι από τον Θεό; Μέσα από αυτό ο Θεός θα βγάλη πολλά καλά. Οι άλλες σατανικές θεωρίες κράτησαν τουλάχιστον εβδομήντα χρόνια· αυτοί ούτε επτά χρόνια δεν θα κρατήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ακούω για τον Αντίχριστο, νιώθω έναν φόβο μέσα μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί φοβάσαι; Πιό φοβερός θα είναι από τον διάβολο; Αυτός είναι άνθρωπος. Εδώ η Αγία Μαρίνα έδερνε τον διάβολο και η Αγία Ιουστίνα τόσους δαίμονες διέλυσε. Στο κάτω-κάτω εμείς δεν ήρθαμε να βολευτούμε σ᾿ αυτόν τον κόσμο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο επίγειος βασιλιάς των Εβραίων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σημείο ότι πλησιάζει η εκπλήρωση των προφητειών θα είναι το γκρέμισμα του τεμένους του Ομάρ στα Ιεροσόλυμα. Θα το γκρεμίσουν, για να ανοικοδομήσουν τον Ναό του Σολομώντος πού, όπως λένε, ήταν χτισμένος σ́ αυτήν την θέση. Τελικά οι Σιωνιστές θα εγκαταστήσουν τον Αντίχριστο εκεί ως Μεσσία. Άκουσα ότι οι Εβραίοι ήδη ετοιμάζονται να χτίσουν τον Ναό του Σολομώντος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι Εβραίοι, ενώ διαβάζουν την Παλαιά Διαθήκη, πώς δεν πιστεύουν στον Χριστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν πάς να το πής αυτό στους Εβραίους; Οι Εβραίοι είχαν ανέκαθεν φανατισμό. Καταλαβαίνουν, αλλά είναι ο εγωισμός που τους τυφλώνει. Αν πρόσεχαν λίγο, δεν θα παρέμενε κανένας Εβραίος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά που διάβαζαν, πώς τα ερμήνευαν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς τα ερμήνευαν και πώς τα ερμηνεύουν! Τα πνευματικά νοήματα τα κάνουν υλικά. Αυτό λ.χ. που λέει ο Προφήτης Ησαΐας, «εξανθήσει τα έρημα του Ιορδάνου»[98], να δής πώς το ερμήνευσαν. Για να δείξουν ότι άνθησε η έρημος, γύρισαν κάποιον ποταμό, έκαναν πεζούλια, κήπους, φύτεψαν μπανανιές, λεμονιές, πορτοκαλλιές, έφτιαξαν όλο περιβόλια, οπότε λένε «άνθησε η έρημος»! Όλα έτσι τα ερμηνεύουν. Ενώ οι λόγοι αυτοί του Προφήτου αναφέρονται στην αναγέννηση του κόσμου με το Άγιο Βάπτισμα, με το λουτρό της παλιγγενεσίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τώρα περιμένουν τον επίγειο βασιλιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, τον Αντίχριστο. Οι Ραββίνοι ξέρουν ότι ήρθε ο Μεσσίας και ότι Τον σταύρωσαν. Αφού έχω μάθει από ένα πρόσωπο ότι, όταν ψυχορραγή ένας Εβραίος, πάει ο Ραββίνος και του λέει στο αυτί: «Ο Μεσσίας ήρθε». Βλέπεις, τους πειράζει η συνείδηση, γιατί αισθάνονται ενοχή, αλλά δεν ταπεινώνονται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τί κερδίζουν που το λένε εκείνη την ώρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τίποτε· απλώς το λένε, επειδή τους πειράζει η συνείδηση, και νομίζουν ότι, αφού το είπαν, είναι εντάξει!...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και οι άλλοι δεν ακούνε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, στο αυτί το λένε. Και τα Εβραιόπουλα έχουν επαναστατήσει εναντίον των Ραββίνων. «Ο Μεσσίας, λένε, ήρθε· ποιόν Μεσσία περιμένετε;». Στην Αμερική μια ομάδα νέων που ασχολούνται ιστορικά με την Αγία Γραφή εκδίδουν ένα περιοδικό, στο οποίο γράφουν: «Ο Μεσσίας ήρθε. Σε όποιον δεν πιστεύει ότι ήρθε ο Μεσσίας θα στέλνουμε δωρεάν το περιοδικό, ώσπου να πιστέψη. Όποιος πιστεύει να στέλνη συνδρομή, για να το στέλνουμε και σε άλλους, να πιστέψουν».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εβραίοι είναι αυτοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, Εβραίοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έγιναν Χριστιανοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ τώρα, το ότι πίστεψαν κάτι είναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να υπάρχουν Ραββίνοι Κρυπτοχριστιανοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ραββίνοι να είναι Κρυπτοχριστιανοί; Μένει Ραββίνος ο άλλος, άμα γίνη Χριστιανός; Δηλαδή να διδάσκη στους Εβραίους ότι δεν ήρθε ο Μεσσίας καί, όταν ψυχορραγούν, να τους λέη ότι ήρθε ο Μεσσίας;
- type: h2
  initial:
    ru: ''
  text:
    ru: Σφράγισμα ‒ 666
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σε πόσο καιρό θα συμβούν αυτά τα γεγονότα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εξ αιτίας σου και εξ αιτίας μου καθυστερούν, για να αποκτήσουμε καλή πνευματική κατάσταση.Μας κάνει υπομονή ο Θεός, γιατί, αν συμβούν τώρα, εγώ και εσύ θα πάμε χαμένοι. Δεν αναφέρεται πουθενά στην διδασκαλία του Χριστού συγκεκριμένος χρόνος[99]. Λέει όμως η Γραφή ότι τα σημεία των καιρών θα προειδοποιήσουν για την έλευσή τους[100]. Να είμαστε πάντα έτοιμοι και θα τα δούμε, όταν θα πλησιάση ο καιρός. Τότε θα είμαστε πιο σίγουροι. «Ο χρόνος αποκαλύψει και η πείρα τοις νήφουσι»[101], λέει ο Άγιος Ανδρέας Καισαρείας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έπεσε στα χέρια μου ένα βιβλίο που στο εξώφυλλο είχε τρία μεγάλα εξάρια! Έ, τους αφιλότιμους! Το κάνουν για να παρουσιάσουν όμορφα το έξι και να εξοικειωθή ο κόσμος με αυτό. Έτσι σιγά-σιγά θα έρθη και το σφράγισμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, και οι σούστες που ράβουν στα ρούχα πουλιούνται πάνω σε κάτι χαρτιά που έχουν τον αριθμό 666.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βρέ τον διάβολο! Στις πιστωτικές κάρτες το έχουν βάλει από καιρό. Τώρα και στις σούστες! Πολλοί το 666 το βάζουν σαν φίρμα, για να προτιμούν τα δικά τους προϊόντα. Ο ένας να υποστηρίζη τον άλλο. Δηλαδή το 666 να παίρνη το 666. Έχει γραφή ότι, όταν κυκλοφορήση η παράσταση με το φίδι να τρώη την ουρά του, θα σημαίνη ότι οι Εβραίοι θα έχουν καταλάβει όλον τον κόσμο. Τώρα το έχουν βάλει σε μερικά χαρτονομίσματα. Το 666, τί Κίνα, τί Ινδία έχει πιάσει!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς ξέρουν και βάζουν αυτόν τον αριθμό, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ήξερε ο Ευαγγελιστής Ιωάννης τί θα κάνη ο διάβολος, όπως και οι Προφήτες προφήτευσαν ότι θα πωλήσουν τον Χριστό για «τριάκοντα αργύρια»[102], ότι θα Τον ποτίσουν ξίδι[103], θα διαμερίσουν τα ιμάτιά Του[104]. Πριν από δύο χιλιάδες χρόνια έγραψε στην Αποκάλυψη ότι οι άνθρωποι θα σφραγίζωνται με τον αριθμό 666. «Ο έχων νουν ψηφισάτω τον αριθμόν του θηρίου· αριθμός γαρ ανθρώπου εστί· και ο αριθμός αυτού χξς´»[105]. Το 666 για τους Εβραίους είναι σύμβολο οικονομίας. Οι Εβραίοι, όπως αναφέρεται στην Παλαιά Διαθήκη, επέβαλαν μια συγκεκριμένη φορολογία στα έθνη που υποδούλωσαν με διάφορους πολέμους. Η ετήσια φορολογία ήταν 666 τάλαντα χρυσού[106]. Τώρα, για να υποτάξουν όλον τον κόσμο, βάζουν πάλι αυτόν τον παλιό φορολογικό αριθμό, που συνδέεται με το ένδοξο παρελθόν τους. Γι' αυτό δεν θέλουν να τον αντικαταστήσουν με άλλον αριθμό. Το 666 δηλαδή είναι το σύμβολο του μαμωνά. Το πήραν από τα σταθμά του χρυσού – δεν ήξεραν αυτό που αναφέρει ο Άγιος Ιωάννης στην Αποκάλυψη –, αλλά δεν παύει να είναι μαμωνάς. Το Ευαγγέλιο όμως λέει «ή Χριστό ή μαμωνά». «Ου δύνασθε Θεώ δουλεύειν και μαμωνά»[107].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα πράγματα προχωρούν κανονικά. Στην Αμερική τα σφραγισμένα σκυλιά εκπέμπουν με τον πομπό καί, τάκ, τα βρίσκουν. Έτσι ξέρουν το κάθε σκυλί που βρίσκεται. Όσα σκυλιά δεν έχουν την μάρκα τους και είναι αδέσποτα τα σκοτώνουν με ακτίνες λέιζερ. Μετά θα αρχίσουν να σκοτώνουν και τους ανθρώπους. Τόννους ψάρια έχουν σφραγίσει και τα παρακολουθούν από τον δορυφόρο σε ποιό πέλαγος είναι! Τώρα πάλι παρουσιάσθηκε μια αρρώστια, για την οποία βρήκαν ένα εμβόλιο που θα είναι υποχρεωτικό καί, για να το κάνη κανείς, θα τον σφραγίζουν. Πόσοι άνθρωποι εκεί είναι ήδη σφραγισμένοι με ακτίνες λέιζερ, άλλοι στο μέτωπο και άλλοι στο χέρι! Αργότερα, όποιος δεν θα είναι σφραγισμένος με τον αριθμό 666 δεν θα μπορή ούτε να πουλά ούτε να αγοράζη ή να παίρνη δάνειο, να διορίζεται κ.λπ. Μου λέει ο λογισμός ότι ο Αντίχριστος με αυτό το σύστημα θέλησε να πιάση όλον τον κόσμο καί, άμα δεν είναι κανείς στο σύστημα, δεν θα μπορή να δουλέψη κ.λπ., είτε κόκκινος είτε μαύρος είτε άσπρος, όλοι δηλαδή. Θα επιβληθή έτσι με ένα οικονομικό σύστημα που θα ελέγχη την παγκόσμια οικονομία, και μόνον όσοι θα έχουν δεχθή το σφράγισμα, το χάραγμα με τον αριθμό 666, θα μπορούν να έχουν εμπορικές συναλλαγές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τί θα πάθουν όμως οι άνθρωποι που θα σφραγίζωνται!... Μου έλεγε κάποιος ειδικός ότι με τις ακτίνες λέιζερ παθαίνει κανείς βλάβη. Οι άνθρωποι που θα σφραγισθούν θα τραβούν τις ακτίνες του ήλιου και θα πάθουν τέτοια ζημιά, που θα μασούν την γλώσσα τους από τον πόνο[108]. Όσοι δεν σφραγισθούν, θα περάσουν καλύτερα από τους άλλους, γιατί ο Χριστός όσους δεν σφραγισθούν θα τους βοηθήση. Δεν είναι μικρό πράγμα αυτό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε θα τους βοηθήση; Μετά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, τότε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αφού, Γέροντα, δεν θα μπορούν να πωλούν και να αγοράζουν, πώς θα περάσουν καλύτερα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να δής, ο Θεός ξέρει έναν τρόπο, τον ξέρω και εγώ αυτόν. Λοιπόν..., με απασχόλησε πολύ αυτό το θέμα και μου έστειλε μετά τό... τηλεγράφημα. Ο Θεός πώς μας οικονομάει, πώ! πώ!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί το σφράγισμα λέγεται και χάραγμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί δεν θα είναι επιφανειακό. «Χαράσσω» τί θα πή; Δεν θα πη τραβώ βαθιά ευθείες γραμμές, χαρακιές; Το σφράγισμα θα είναι χάραγμα, που θα το βάλουν πρώτα σε όλα τα προϊόντα και μετά θα επιβάλουν να γίνεται με ακτίνες λέιζερ στο χέρι ή στο μέτωπο των ανθρώπων. Σε έναν γιατρό από το Τορόντο είχα πει πριν από δύο χρόνια για το σφράγισμα, και τώρα, μου είπε εκείνος, διάβασε σε μια εφημερίδα ότι αντί για κάρτα ζητούν εντυπώματα[109]στο χέρι. Προχωρούν αλλά δεν μπορούμε να πούμε ότι θα γίνη εκείνο και εκείνο. Μερικές τηλεοράσεις πάλι που έχουν στείλει τελευταία στην Ελλάδα έχουν και συσκευή που παρακολουθεί αυτούς που βλέπουν τηλεόραση. Σε λίγο όσοι θα έχουν τηλεόραση θα βλέπουν στην τηλεόραση και θα τους βλέπουν! Δηλαδή θα παρακολουθούν και θα παρακολουθούνται. Θα ελέγχουν οι άλλοι με το κομπιούτερ όλη την ζωή τους, τί λένε, τί κάνουν, όλα. Βλέπεις τί δικτατορία σκέφθηκε ο διάβολος! Στις Βρυξέλλες έχουν ολόκληρο μέγαρο με το 666, όπου στεγάζουν το κομπιούτερ. Αυτό το κομπιούτερ μπορεί να ελέγξη δισεκατομμύρια ανθρώπους – έξι δισεκατομμύρια είναι σχεδόν όλος ο κόσμος. Εξομολόγηση όλοι με ένα κουμπί! Μερικοί Ευρωπαίοι αντέδρασαν, γιατί φοβούνται παγκόσμια δικτατορία. Εμείς οι Ορθόδοξοι αντιδρούμε, γιατί δεν θέλουμε τον Αντίχριστο, αλλά φυσικά ούτε την δικτατορία.Μας περιμένουν γεγονότα, αλλά δεν θα σταθούν αυτά πολύ. Όσο εξαλείφθηκε η Ορθοδοξία με τον κομμουνισμό, τόσο θα εξαλειφθή και τώρα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι νέες ταυτότητες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, είπε κάποιος: «Πώς το πεντοχίλιαρο έχει το 666 και το χρησιμοποιούμε; Το ίδιο θα είναι και η ταυτότητα».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το πεντοχίλιαρο είναι νόμισμα – και η λίρα της Αγγλίας έχει επάνω την Βικτώρια· αυτό δεν με πειράζει. «Τα Καίσαρος Καίσαρι»[110]. Εδώ όμως είναι η ταυτότητά μου, είναι κάτι προσωπικό· δεν είναι νόμισμα. Ταυτότητα σημαίνει ό,τι και η λέξη· ταυτίζεται δηλαδή κανείς μ᾿ αυτά που δηλώνει. Βάζουν τον διάβολο και υπογράφω ότι τον αποδέχομαι. Πώς να το κάνω αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί σχέση έχει αυτή η ταυτότητα με το σφράγισμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η ταυτότητα δεν είναι το σφράγισμα· είναι η εισαγωγή του σφραγίσματος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο κόσμος, Γέροντα, ρωτάει τί να κάνουν σχετικά με τις νέες ταυτότητες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εσείς καλύτερα, όταν σάς ρωτούν, να τους λέτε να συμβουλεύωνται τους Πνευματικούς τους και να κάνουν υπομονή να δούν πώς θα ενεργήση η Εκκλησία, γιατί πολλοί κάνουν ερωτήσεις, αλλά λίγοι καταλαβαίνουν τις απαντήσεις. Αφού ξεκάθαρα τα γράφω στο φυλλάδιο «Σημεία των καιρών», ας ενεργήση ο καθένας ανάλογα με την συνείδησή του. Βέβαια μερικοί είπαν: «Έ, αυτά είναι μια γνώμη ενός καλογήρου· δεν είναι η θέση της Εκκλησίας». Εγώ όμως δεν είπα δική μου γνώμη, αλλά διατύπωσα απλά τα λόγια του Χριστού, του Ευαγγελίου, γιατί την δική μας γνώμη πρέπει να την υποτάσσουμε στο θέλημα του Θεού, που εκφράζεται μέσα στο Ευαγγέλιο. Άλλοι, τα αντίθετα από όσα λέω, λένε ότι τα είπε ο πατήρ Παΐσιος. Μερικοί πάλι που τα ακούν, αφού είναι τόσο σοβαρά θέματα, δεν ρωτούν αν είναι έτσι, αν πράγματι τα είπα, αλλά τα πιστεύουν. Εγώ δεν φοβάμαι· τα λέω έξω από τα δόντια. Έρχονται στο Καλύβι, πετάν εξάρια στο κουτί. Καλά αυτά, τέλος πάντων! Μια μέρα πέταξαν μια πινακίδα έξω από την πόρτα... Νόμιζα ότι ήρθε κάποιος, δεν με βρήκε και έγραψε «απουσιάζει», για να το δη και κανείς άλλος. Κοιτάω μετά, τί να δώ! Είχε μια βρισιά! Τέτοια βρισιά δεν είχα ακούσει ούτε κοσμικός. Θα φάη ένα σκούπισμα όλη αυτή η κατάσταση, αλλά θα περάσουμε μια μπόρα. Ο κόσμος έχει ξεσηκωθή, και εμείς πρέπει να ξεσηκωθούμε με πολλή προσευχή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Άλλοι ενδιαφέρονται για το θέμα των ταυτοτήτων, άλλοι το εκμεταλλεύονται και δημιουργούν προβλήματα. Η Εκκλησία πρέπει να πάρη μια θέση σωστή. Να μιλήση, να εξηγήση στους πιστούς, για να καταλάβουν ότι, αν πάρουν την ταυτότητα, αυτό θα είναι πτώση. Συγχρόνως να ζητήση από το κράτος τουλάχιστον να μην είναι υποχρεωτική η νέα ταυτότητα. Αν η Εκκλησία λάβη μια θέση σοβαρή και σεβασθούν την ελευθερία των πιστών και όποιος θέλει θα βγάλη νέα ταυτότητα, όποιος θέλει θα έχη την παλιά, τότε θα την πληρώσουν μόνο μερικά γερά καρύδια, γιατί οι άλλοι θα τους πηγαίνουν κόντρα. Ο πολύς κόσμος θα κάνη την δουλειά του. Όσοι θα θέλουν να εξυπηρετηθούν θα έχουν την νέα και οι άλλοι οι καημένοι, οι ευλαβείς, θα έχουν την παλιά ταυτότητα και θα τους ταλαιπωρούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τώρα, αφού ο υπουργός υποσχέθηκε να μη βάλη το 666 στις ταυτότητες ούτε ορατώς ούτε αοράτως, και αυτό κάτι είναι. Θα κάνουμε υπομονή, θα δείξουν τα πράγματα. Και μόνον που λένε ότι δεν βάζουν το 666, είναι κάτι. Αρνούνται και οι ίδιοι. Ας δούμε τελικά τί θα βάλουν. Μέχρι που να κυκλοφορήσουν οι νέες ταυτότητες, μπορεί να ᾿ρθή και η οργή του Θεού. Ύστερα, δεν είναι ότι σε είκοσι τέσσερις ώρες θα πρέπη να βγάλουν όλοι ταυτότητες. Ας βγουν οι πρώτες· θα εξετασθούν καί, αν βγή ψεύτης ο υπουργός, θα είναι δίκαιος ο αγώνας. Αν τώρα συνεχίσουμε τις διαμαρτυρίες, εκείνοι θα πούν: «Νά, αυτοί δημιουργούν ταραχές. Ενώ δεν τίθεται θέμα, φωνάζουν και διαμαρτύρονται». Το σκυλί, αν είναι καλός φύλακας, γαυγίζει, όταν έρχεται ο κλέφτης. Όταν ο κλέφτης φύγη, σταματάει. Αν συνεχίση να γαυγίζη, τότε δεν είναι καλός φύλακας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είπαν ακόμη, επειδή έχουμε ανεξιθρησκία, να μην αναγράφεται το θρήσκευμα στις νέες ταυτότητες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αυτούς δεν τους ενδιαφέρει, εμένα όμως με ενδιαφέρει, γιατί είναι η ταυτότητά μου. Γράφει από που είμαι και τί είμαι. Αν δεν μπή το θρήσκευμα, θα δημιουργηθούν προβλήματα. Θα πάη λ.χ. ένας στο γραφείο γάμων. Αν λέη η ταυτότητα «Ορθόδοξος» – άσχετα πόσων καρατιών είναι –, εντάξει. Αν όμως δεν γράφη το θρήσκευμα, πώς θα του δώσουν άδεια γάμου; Για την Εκκλησία αυτό είναι μπέρδεμα. Αν πάλι μπή το θρήσκευμα προαιρετικά, θα είναι και σαν ομολογία. Η Ευρώπη είναι Ευρώπη. Εδώ είναι διαφορετικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ύπουλος τρόπος εισαγωγής του σφραγίσματος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σιγά-σιγά, μετά την κάρτα και την ταυτότητα, δηλαδή το «φακέλωμα», θα προχωρήσουν πονηρά στο σφράγισμα. Με διάφορα πονηρά μέσα θα κάνουν εκβιασμούς, για να δέχωνται οι άνθρωποι το σφράγισμα στο μέτωπο ή στο χέρι. Θα στριμώξουν τα πράγματα και θα πούν: «Μόνο με τις κάρτες θα κινήσθε· τα χρήματα θα καταργηθούν». Θα δίνη κανείς την κάρτα στο κατάστημα και θα ψωνίζη, και ο καταστηματάρχης θα παίρνη τα χρήματα από την Τράπεζα. Όποιος δεν θα έχη κάρτα, δεν θα μπορή ούτε να πουλάη ούτε να αγοράζη. Από το άλλο μέρος θα αρχίσουν να διαφημίζουν «τό τέλειο σύστημα», το σφράγισμα με ακτίνες λέιζερ με το 666 στο χέρι ή στο μέτωπο, που δεν θα διακρίνεται εξωτερικά. Συγχρόνως στην τηλεόραση θα δείχνουν ότι ο τάδε πήρε την κάρτα του τάδε και του πήρε τα χρήματα από την Τράπεζα και θα λένε συνέχεια: «Πιό σίγουρο είναι το σφράγισμα με ακτίνες λέιζερ στο χέρι ή στο μέτωπο, γιατί μόνον ο κάτοχος ξέρει το νούμερό του. Το σφράγισμα είναι το τελειότερο σύστημα. Ούτε το κεφάλι μπορεί να πάρη ο άλλος ούτε το χέρι ούτε το σφράγισμα το βλέπει». Γι᾿ αυτό αφήνουν τώρα τους ληστές, τους κακοποιούς, να οργώνουν. Δεκαπέντε Κελλιά λήστεψαν εκεί γύρω στις Καρυές. Έναν τον σκότωσαν, για να τον ληστέψουν. Έτσι θα βρη τότε ευκαιρία ο καθένας να καταπατήση και να πάρη ό,τι θέλει. Ας πούμε, αν θέλη να καταπατήση ένα χωράφι, θα πη ότι ήταν δήθεν του παππού του ή ότι το είχε νοικιάσει κάποτε για βοσκοτόπι, οπότε άντε να βρής άκρη. Θα πούν μετά οι αρμόδιοι: «Δυστυχώς δεν μπορούμε να τους ελέγξουμε· ο έλεγχος μόνο με το κομπιούτερ μπορεί να γίνη», και θα προχωρήσουν στο σφράγισμα. Θα χτυπάη μετά το κομπιούτερ, θα βλέπη αν είσαι σφραγισμένος, για να σε εξυπηρετήση ή όχι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τα τριάμισι χρόνια[111]θα είναι δύσκολα και θα την πληρώσουν μερικοί που δεν θα συμφωνήσουν με αυτό το σύστημα. Γι'' αυτούς όλο και κάποια αιτία θα βρίσκουν και θα τους κλείνουν στην φυλακή. Μετά έναν χρόνο θα τους πηγαίνουν σε άλλη πόλη για ανακρίσεις, για να περάσουν από άλλο δικαστήριο· από την μια πόλη στην άλλη. Ύστερα θα πούν: «Μάς συγχωρής, είσαι αθώος. Αν ήσουν σφραγισμένος, θα το ελέγχαμε σε ένα λεπτό. Τώρα δεν μπορούμε να κάνουμε τον έλεγχο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θα μπορούν να επιβάλουν με την βία το σφράγισμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μέχρι εκεί η... ευγένειά τους δεν θα φθάση! Θα είναι ευγενείς, γιατί θα είναι... Ευρωπαίοι. Θα δείξουν ανωτερότητα. Δεν θα βασανίζουν τους ανθρώπους, αλλά δεν θα μπορή να ζήση ο άνθρωπος, αν δεν έχη το σφράγισμα. Θα λένε: «Χωρίς το σφράγισμα ταλαιπωρείσθε! Αν το δεχόσασταν, δεν θα δυσκολευόσασταν». Ούτε χρυσά νομίσματα ούτε δολλάρια, αν έχη, θα μπορή να τα χρησιμοποιή. Γι'' αυτό, αν φροντίση κανείς να ζη από τώρα απλά, λιτά, θα μπορή να ζήση εκείνα τα χρόνια. Να έχη κανένα χωραφάκι, για να μπορή να καλλιεργήση λίγο σιτάρι, πατάτες. Να βάλη λίγα ελαιόδενδρα, και τότε με κανένα ζώο, καμμιά κατσίκα, λίγες κόττες θα μπορή να αντιμετωπίση τις ανάγκες της οικογενείας του. Γιατί και προμήθειες να κάνης, δεν ωφελεί πολύ, αφού και τα τρόφιμα δεν κρατούν· χαλούν γρήγορα. Φυσικά, το στρίμωγμα θα διαρκέση λίγο, τρία-τριάμισι χρόνια[112]. Θα συντομευθούν οι ημέρες για τους εκλεκτούς[113]. Δεν θα καταλάβουν πότε θα περάσουν. Ο Θεός δεν θα αφήση αβοήθητο τον άνθρωπο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σ́ αυτά τα δύσκολα χρόνια θα επέμβη ο Χριστός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί. Εδώ, βλέπεις, σε έναν αδικημένο που έχει καλή διάθεση, επειδή δικαιούται την θεία βοήθεια, παρουσιάζονται πολλές φορές οι Άγιοι, η Παναγία, ο Χριστός, για να τον σώσουν, πόσο μάλλον τώρα που θα βρίσκεται σε τόσο δύσκολη κατάσταση ο καημένος ο κόσμος. Τώρα μια μπόρα θα είναι, μια μικρή κατοχή του αντιχρίστου σατανά. Θα φάη μετά μια σφαλιάρα από τον Χριστό, θα συγκλονισθούν όλα τα έθνη και θα έρθη η γαλήνη στον κόσμο για πολλά χρόνια. Αυτήν την φορά θα δώση ο Χριστός μια ευκαιρία, για να σωθή το πλάσμα Του. Θα αφήση το πλάσμα Του ο Χριστός; Θα παρουσιασθή στο αδιέξοδο των ανθρώπων, για να τους σώση από τα χέρια του Αντιχρίστου. Θα επιστρέψουν στον Χριστό και θα έρθη μια πνευματική γαλήνη σε όλην την οικουμένη για πολλά χρόνια. Μερικοί συνδυάζουν με αυτήν την επέμβαση του Χριστού την Δευτέρα Παρουσία. Εγώ δεν μπορώ να το πώ. Ο λογισμός μου λέει ότι δεν θα είναι η Δευτέρα Παρουσία του Χριστού, όταν έρθη ως Κριτής, αλλά μια επέμβαση του Χριστού, γιατί είναι τόσα γεγονότα που δεν έχουν γίνει ακόμη. Θα επέμβη ο Χριστός, θα δώση μια σφαλιάρα σε όλο αυτό το σύστημα, θα πατάξη όλο το κακό και θα το βγάλη σε καλό τελικά. Θα γεμίσουν οι δρόμοι προσκυνητάρια. Έξω τα λεωφορεία θα έχουν εικόνες. Θα πιστέψουν όλοι οι άνθρωποι. Θα σε τραβάν, για να τους πής για τον Χριστό! Έτσι θα κηρυχθή το Ευαγγέλιο σε ολόκληρη την οικουμένη[114]και τότε ο Χριστός θα έρθη ως Κριτής να κρίνη τον κόσμο. Άλλο Κρίση, άλλο μία επέμβαση του Χριστού, για να βοηθήση το πλάσμα Του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Σφράγισμα ίσον άρνηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ενώ ξεκάθαρα ο Ευαγγελιστής Ιωάννης αναφέρει στην Αποκάλυψη για το χάραγμα[115], μερικοί δεν καταλαβαίνουν. Τί να τους πής; Ακούει δυστυχώς κανείς ένα σωρό ανοησίες του μυαλού από ορισμένους σημερινούς «Γνωστικούς». Ένας λέει: «Εγώ θα δεχθώ την ταυτότητα με το 666 και θα βάλω και έναν σταυρό». Άλλος: «Εγώ θα δεχθώ το σφράγισμα στο μέτωπο και θα κάνω και έναν σταυρό στο μέτωπο...» και ένα σωρό παρόμοιες ανοησίες. Νομίζουν ότι θα αγιασθούν με αυτόν τον τρόπο, ενώ αυτά είναι πλάνες. Ένας δεσπότης μου είπε: «Εγώ εκεί που θα υπογράψω θα βάλω δίπλα έναν σταυρό. Δεν Τον αρνούμαι τον Χριστό, απλώς εξυπηρετούμαι». «Εντάξει, του λέω, εσύ είσαι δεσπότης και βάζεις στο όνομά σου λόγω ιδιότητος έναν σταυρό· ο άλλος είναι αρχιμανδρίτης και βάζει και αυτός λόγω ιδιότητος έναν σταυρό. Ο κόσμος τί θα κάνη;». Το βρώμικο δεν αγιάζεται. Το καθαρό νερό δέχεται την Χάρη και γίνεται αγιασμός. Τα ούρα δεν γίνονται αγιασμός. Η πέτρα με θαύμα γίνεται ψωμί. Η ακαθαρσία δεν δέχεται αγιασμό. Επομένως, ο διάβολος, ο Αντίχριστος, όταν είναι στην ταυτότητά μας ή στο χέρι ή στο μέτωπό μας, με το σύμβολό του, δεν αγιάζεται, αν βάλουμε και έναν σταυρό. Έχουμε την δύναμη του Τιμίου Σταυρού, του Αγίου Συμβόλου, την θεία Χάρη του Χριστού, μόνον όταν διατηρούμε την Χάρη του Αγίου Βαπτίσματος, με το οποίο απαρνούμαστε τον σατανά, συντασσόμαστε με τον Χριστό και δεχόμαστε το άγιο Σφράγισμα· «Σφραγίς δωρεάς Πνεύματος Αγίου». Βλέπεις, προχωράνε με μια λογική... Θα βάλουν δίπλα έναν σταυρό, και εντάξει! Και ενώ βλέπουμε ότι ο Απόστολος Πέτρος εξωτερικά αρνήθηκε τον Χριστό, αλλά και αυτό ήταν άρνηση[116], αυτοί αρνούνται το άγιο Σφράγισμα του Χριστού που τους δόθηκε στο Άγιο Βάπτισμα, με το να δέχωνται την σφραγίδα του Αντιχρίστου, και λένε ότι έχουν μέσα τους τον Χριστό!!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κάποιος δεχθή το σφράγισμα από άγνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Από αδιαφορία θα είναι. Τί άγνοια, όταν είναι ξεκάθαρα τα πράγματα; Και να μην ξέρη κανείς, πρέπει να ενδιαφερθή, να μάθη. Αν πούμε ότι δεν ξέραμε, γι'' αυτό δεχθήκαμε το σφράγισμα, θα μας πη ο Χριστός: «Υποκριταί, το μεν πρόσωπον του ουρανού γινώσκετε διακρίνειν, τα δε σημεία των καιρών ου δύνασθε γνώναι;»[117]. Έστω και εν αγνοία του να σφραγισθή κάποιος, χάνει την θεία Χάρη και δέχεται την δαιμονική ενέργεια. Βλέπεις, το παιδάκι στο Άγιο Βάπτισμα, όταν ο ιερεύς το βουτάη στο νερό, λαμβάνει το Άγιο Πνεύμα, χωρίς εκείνο να το ξέρη και μετά κατοικεί μέσα του η θεία Χάρις.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ερμηνείες των προφητειών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μερικοί λένε: «Ό,τι είναι γραμμένο από τον Θεό, αυτό θα γίνη. Τί να μας απασχολή;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, το λένε, αλλά δεν είναι έτσι, βρέ παιδάκι μου! Και εγώ ακούω μερικούς να λένε: «Οι Εβραίοι δεν είναι τόσο κουτοί να προδοθούν με το 666, αφού το λέει ο Ευαγγελιστής Ιωάννης στην Αποκάλυψη. Αν ήταν, θα το έκαναν με πιο έξυπνο τρόπο, πιο κρυφά». Έ, καλά οι Γραμματείς και οι Φαρισαίοι δεν ήξεραν την Παλαιά Διαθήκη; Ο Άννας και ο Καϊάφας δεν ήξεραν καλύτερα από όλους ότι έγραφε πώς για «τριάκοντα αργύρια»[118]θα προδώσουν τον Χριστό; Γιατί δεν ζητούσαν τριάντα ένα ή είκοσι εννέα αργύρια και ζήτησαν «τριάκοντα»; Αλλά ήταν τυφλωμένοι. Ήξερε ο Θεός ότι έτσι θα γίνουν. Ο Θεός προγνωρίζει, δεν προορίζει – μόνον οι Τούρκοι πιστεύουν στο γραμμένο, στο κισμέτ. Ο Θεός γνωρίζει ότι αυτό θα γίνη έτσι, και ο άνθρωπος το κάνει από χαζομάρα. Δεν είναι ότι ο Θεός έβγαλε μια διαταγή, αλλά βλέπει την κακία των ανθρώπων που θα φθάση και ότι η γνώμη τους δεν θα αλλάξη. Όχι ότι τα κανόνισε έτσι ο Θεός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άλλοι ασχολούνται με προφητείες και κάνουν δικές τους ερμηνείες! Δεν λένε τουλάχιστον «έτσι μου λέει ο λογισμός», αλλά «έτσι είναι», και λένε ένα σωρό δικές τους θεωρίες. Μερικοί πάλι τα ερμηνεύουν όπως θέλουν, για να δικαιολογήσουν τα πάθη τους. Όπως αυτό που αναφέρει ο Άγιος Κύριλλος, «καλύτερα να μη συμβούν τα σημεία του Αντιχρίστου στην εποχή μας»[119], ο άλλος που θέλει να δικαιολογήση τον εαυτό του, την δειλία του, λέει: «Ά, βλέπεις; Ο Άγιος Κύριλλος φοβήθηκε μήπως αρνηθή· εγώ είμαι ανώτερος από τον Άγιο Κύριλλο; Επομένως, και αν αρνηθώ τον Χριστό, δεν είναι τίποτε...»! Ενώ ο Άγιος λέει να μη συμβούν, για να μη δούν τα μάτια του τον Αντίχριστο, όχι ότι φοβόταν. Βλέπεις ο διάβολος τί κάνει;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Δυστυχώς, και πάλι ορισμένοι «Γνωστικοί» φασκιώνουν τα πνευματικά τους τέκνα σαν τα μωρά, δήθεν για να μη στενοχωριούνται. «Δεν πειράζει αυτό· δεν είναι τίποτε. Αρκεί εσωτερικά να πιστεύετε»! Ή λένε: «Μη μιλάτε γι᾿ αυτό το θέμα – για τις ταυτότητες, το σφράγισμα –, για να μη στενοχωριούνται οι άνθρωποι». Ενώ, αν τους πούν «νά προσπαθήσουμε να ζούμε πιο πνευματικά, να είμαστε κοντά στον Χριστό, και μη φοβάστε τίποτε, στο κάτω-κάτω θα πάμε και μάρτυρες», θα τους προετοιμάσουν κάπως. Αν κανείς γνωρίση την αλήθεια, προβληματίζεται και ταρακουνιέται. Πονάει για την σημερινή κατάσταση, προσεύχεται και προσέχει να μην πέση σε παγίδα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τώρα όμως τί γίνεται; Εκτός που δίνουν μερικοί δικές τους ερμηνείες, φοβούνται και αυτοί σαν κοσμικοί, ενώ έπρεπε να ανησυχούν πνευματικά και να βοηθούν τους Χριστιανούς, βάζοντάς τους την καλή ανησυχία, και να τους τονώνουν στην πίστη, για να νιώθουν θεϊκή παρηγοριά. Απορώ, δεν τους προβληματίζουν όλα αυτά τα γεγονότα που συμβαίνουν; Γιατί δεν βάζουν έστω ένα ερωτηματικό για τις ερμηνείες του μυαλού τους; Και αν επιβοηθούν τον Αντίχριστο για το σφράγισμα, πώς παρασύρουν και άλλες ψυχές στην απώλεια; Η Γραφή, όταν λέη «...αποπλανάν, ει δυνατόν, και τους εκλεκτούς»[120], εννοεί ότι θα πλανηθούν αυτοί που τα ερμηνεύουν με το μυαλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πίσω λοιπόν από το τέλειο σύστημα «κάρτας εξυπηρετήσεως», ασφαλείας κομπιούτερ, κρύβεται η παγκόσμια δικτατορία, η σκλαβιά του Αντιχρίστου. «...Ίνα δώσωσιν αυτοίς χάραγμα επί της χειρός αυτών της δεξιάς ή επί των μετώπων αυτών, και ίνα μη τις δύνηται αγοράσαι ή πωλήσαι, ει μη ο έχων το χάραγμα, το όνομα του θηρίου ή τον αριθμόν του ονόματος αυτού. Ώδε η σοφία εστίν· ο έχων νουν ψηφισάτω τον αριθμόν του θηρίου· αριθμός γαρ ανθρώπου εστί· και ο αριθμός αυτού χξς´»[121].
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η θυσία φέρνει την χαρά
- type: h2
  initial:
    ru: ''
  text:
    ru: Στην εποχή μας σπανίζει η θυσία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: αλούρα είναι τα παιδιά», μου είπε μια γυναίκα που τα είχε όλα. Βαριέται να έχη παιδιά! Όταν μια μάνα σκέφτεται έτσι, είναι ένα άχρηστο πράγμα, γιατί οι μανάδες κανονικά έχουν αγάπη. Μπορεί μια κοπέλα, πριν κάνη οικογένεια, να την ξυπνά η μάνα της στις δέκα η ώρα το πρωί. Από την στιγμή όμως που θα γίνη μάνα και θα έχη να ταΐζη το παιδί της, να το πλένη, να το καθαρίζη, δεν κοιμάται ούτε την νύχτα, γιατί παίρνει μπρός η μηχανή. Όταν ο άνθρωπος έχη θυσία, δεν γκρινιάζει, δεν βαριέται· χαίρεται. Όλη η βάση εκεί είναι, να υπάρχη πνεύμα θυσίας. Αυτή η γυναίκα αν έλεγε «Θεέ μου, πώς να Σε ευχαριστήσω; Δεν μου έδωσες μόνον παιδιά αλλά και πολλά αγαθά... Πόσοι άνθρωποι δεν έχουν τίποτε και εγώ έχω τόσα σπίτια, έχω και από τον πατέρα μου περιουσία, ο άνδρας μου παίρνει μεγάλο μισθό, βγάζω και δυο μισθούς από τα ενοίκια, και δεν ταλαιπωρούμαι! Πώς να Σε ευχαριστήσω, Θεέ μου; Δεν τα άξιζα εγώ αυτά τα πράγματα», αν σκεφτόταν έτσι, θα έφευγε με την δοξολογία η κακομοιριά. Και μόνο δηλαδή αν ευχαριστούσε τον Θεό μέρα-νύχτα, θα ήταν αρκετό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η θυσία, Γέροντα, δίνει χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ώ, χαρά! Αυτήν την χαρά της θυσίας δεν την γεύονται σήμερα οι άνθρωποι, γι᾿ αυτό είναι βασανισμένοι. Δεν έχουν ιδανικά μέσα τους· βαριούνται που ζούν. Η λεβεντιά, η αυταπάρνηση, είναι η κινητήρια δύναμη στον άνθρωπο. Αν δεν υπάρχη αυτή η δύναμη, ο άνθρωπος είναι βασανισμένος. Παλιά, στα χωριά πήγαιναν την νύχτα να ανοίξουν αθόρυβα κανέναν δρόμο, χωρίς να τους δη κανείς, για να τους συγχωράνε, όταν πεθάνουν. Τώρα σπάνια συναντάς αυτό το πνεύμα της θυσίας. Έβλεπα και εκεί στο Όρος σε μια λιτανεία τους μοναχούς· περνούσαν κοντά από μια βάτο και σκάλωναν τα επανωκαλύμμαυχά τους σ́ ένα κλωνάρι. Κανείς δεν το έσπασε, για να διευκολύνη και τους άλλους· όλοι έσκυβαν, για να μη σκαλώσουν. Μετάνοια στην βάτο έβαζαν; Να ήταν τουλάχιστον η Αγία Βάτος, θα ταίριαζε! Αλλά καθένας λέει: «Ας το τακτοποιήση ο άλλος και εγώ ας κάνω την δουλειά μου». Μά γιατί να μην το κάνης εσύ, αφού το είδες πρώτος; Έτσι κάνουν οι κοσμικοί που δεν πιστεύουν στον Θεό. Τί να την κάνω τέτοια ζωή; Χίλιες φορές να πεθάνω. Σκοπός είναι ο καθένας να σκέφτεται τον άλλον, τον πόνο του άλλου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχει χάσει πια τον έλεγχο ο κόσμος. Έχει φύγει το φιλότιμο, η θυσία, από τους ανθρώπους. Σάς έχω πει μερικές φορές τότε με την κήλη σε τί κατάσταση ήμουν εκεί στο Καλύβι... Όταν χτυπούσε κάποιος το καμπανάκι στην πόρτα, έβγαινα να του ανοίξω, ακόμη και μέσα στα χιόνια. Αν ο άλλος είχε σοβαρά προβλήματα, ενώ προηγουμένως ήμουν πεσμένος στο κρεββάτι, τότε ούτε καν αισθανόμουν ότι πονούσα εγώ. Έπαιρνα και να τον κεράσω, και με το ένα χέρι κερνούσα και με το άλλο χέρι κρατούσα την κήλη. Όση ώρα συζητούσα, ούτε καν ακουμπούσα πουθενά, ενώ πονούσα πολύ, για να μην καταλάβη ο άλλος ότι πονάω. Όταν έφευγε εκείνος, σωριαζόμουν πάλι κάτω από τον πόνο. Δεν είναι ότι προηγουμένως είχε περάσει ο πόνος, ότι είχα γίνει καλά με θαύμα, αλλά καταλάβαινα τον άλλον που πονούσε και ξεχνούσα τον δικό μου πόνο. Το θαύμα γίνεται, όταν συμμετέχη κανείς στον πόνο του άλλου. Όλη η βάση είναι τον άλλον να τον νιώσης αδελφό και να τον πονέσης. Αυτός ο πόνος συγκινεί τον Θεό και κάνει το θαύμα. Γιατί δεν υπάρχει τίποτε άλλο που να συγκινή τον Θεό όσο η αρχοντιά, δηλαδή η θυσία. Αλλά στην εποχή μας σπανίζει η αρχοντιά, γιατί μπήκε η φιλαυτία, το συμφέρον. Σπάνια βρίσκεται κανένας άνθρωπος να πή: «Ας δώσω την σειρά μου στον άλλον και ας καθυστερήσω εγώ». Λίγες είναι αυτές οι ψυχές οι ευλογημένες που σκέφτονται τον άλλον. Ακόμη και στους πνευματικούς ανθρώπους υπάρχει ένα αντίθετο πνεύμα, το πνεύμα της αδιαφορίας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το καλό είναι καλό, μόνον όταν αυτός που το κάνει θυσιάζη κάτι από τον εαυτό του, ύπνο, ανάπαυση κ.λπ. Γι᾿ αυτό είπε ο Χριστός «εκ του υστερήματος...»[122]. Όταν είμαι ξεκούραστος και κάνω το καλό, αυτό δεν έχει αξία. Όταν όμως είμαι κουρασμένος και ζητά κάποιος π.χ. να του δείξω τον δρόμο, και το κάνω, τότε έχει αξία. Ή, όταν είμαι χορτάτος από ύπνο και πάω να ξενυχτήσω με κάποιον που χρειάζεται βοήθεια, αυτό δεν έχει μεγάλη αξία. Εάν μου αρέση μάλιστα και η κουβέντα, μπορεί να το κάνω, για να χαρώ την συντροφιά, να διασκεδάσω λίγο. Ενώ, όταν είμαι κουρασμένος και κάνω μια θυσία, για να βοηθήσω τον άλλον, αισθάνομαι παραδεισένια χαρά. Τότε η ευλογία του Θεού με βομβαρδίζει!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν κανείς βαριέται όχι μόνο να κάνη μια εξυπηρέτηση, αλλά ακόμη και να κάνη μια δουλειά για τον εαυτό του, αυτός κουράζεται και με την ξεκούραση. Ένας που βοηθάει, ξεκουράζεται με την κούραση. Αυτός που έχει πνεύμα θυσίας, αν δη λ.χ. κάποιον που δεν έχει σωματικές δυνάμεις να δουλεύη και να κουράζεται, θα του πη «κάτσε λίγο να ξεκουρασθής», και θα κάνη εκείνος την δουλειά. Ο αδύναμος θα ξεκουρασθή σωματικά, ο άλλος όμως θα νιώση πνευματική ξεκούραση. Ό,τι κάνει κανείς, να το κάνη με την καρδιά του, αλλιώς δεν αλλοιώνεται πνευματικά. Ό,τι γίνεται με την καρδιά, δεν κουράζει. Η καρδιά είναι σαν μια μηχανή που φορτίζεται· όσο δουλεύει, τόσο φορτίζεται. Βλέπεις, τα αλυσοπρίονα, όταν βρουν κούτσουρο μαλακό, κάνουν «βρού...» και σταματούν· όταν όμως βρουν κούτσουρο γερό, ζορίζονται εκεί πέρα, φορτίζονται και δουλεύουν. Και όχι μόνο στο να δίνουμε, αλλά και όταν πρόκειται να πάρουμε κάτι, να μη σκεφτώμαστε τον εαυτό μας, και να κοιτάμε πάντα τί αναπαύει και την άλλη ψυχή. Να μην υπάρχη μέσα μας απληστία, να μην έχουμε τον λογισμό ότι δικαιούμαστε να πάρουμε όσα θέλουμε, και ας μη μείνη τίποτε για τον άλλον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πάλι το  πνεύμα της θυσίας μπαίνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά στην πνευματική ζωή όλη η βάση εκεί είναι. Και ξέρεις τί χαρά νιώθει ο άνθρωπος, όταν θυσιάζεται; Δεν μπορεί να εκφράση την χαρά που νιώθει. Η ανώτερη χαρά βγαίνει από την θυσία. Μόνον όταν θυσιάζεται, συγγενεύει με τον Χριστό, γιατί ο Χριστός είναι θυσία. Ο άνθρωπος από ᾿δώ ζη τον Παράδεισο ή την κόλαση. Όποιος κάνει το καλό, αγάλλεται, διότι αμείβεται με θεϊκή παρηγοριά. Όποιος κάνει το κακό, υποφέρει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η δική μου ανάπαυση γεννιέται από την ανάπαυση του άλλου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άν, Γέροντα, κάποιος δεν έχη γευθή την χαρά της θυσίας, πώς μπορεί να φθάση στην θυσία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν έρθη στην θέση του άλλου. Όταν ήμουν στον στρατό, συχνά το πολυβολείο ήταν γεμάτο νερό· στον ασύρματο οι μπαταρίες ήθελαν αλλαγή – και ήταν πολύ δύσκολο, γιατί ήταν φορτωμένη η γραμμή. Βρεχόμουν μέχρι την μέση· η χλαίνη έσταζε. Προτιμούσα όμως να κάνω μόνος μου την δουλειά, για να μην ταλαιπωρηθούν οι άλλοι, και χαιρόμουν που το έκανα. Ο διοικητής μου έλεγε: «Είμαι αναπαυμένος και ήσυχος, όταν κάνης εσύ την δουλειά, αλλά σε λυπάμαι. Πές σε κάποιον άλλον να πάη». «Όχι, χαίρομαι, κύριε διοικητά», του έλεγα. Στην διλοχία ήταν ακόμη ένας ασυρματιστής, αλλά δεν τον άφηνα στις επιχειρήσεις να κουβαλήση ούτε την μπαταρία ούτε τον ασύρματο, αν και ήταν βαριά, για να μη βρεθή σε κίνδυνο. Με παρακαλούσε εκείνος: «Γιατί δεν μου τα δίνεις;». «Εσύ έχεις γυναίκα και παιδιά, του έλεγα. Αν σκοτώσουν εσένα, θα δώσω λόγο στον Θεό». Έτσι ο Θεός μας φύλαξε και τους δύο· δεν άφησε να σκοτωθή ούτε εκείνος ούτε εγώ.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Προτιμότερο είναι για έναν ευαίσθητο άνθρωπο να σκοτωθή ο ίδιος μια φορά από αγάπη, για να προστατέψη τον πλησίον του, παρά να αμελήση ή να δειλιάση, και ύστερα να σφάζεται συνέχεια από την συνείδησή του σ́ όλη του την ζωή. Μια φορά, στον ανταρτοπόλεμο, τότε με τις επιχειρήσεις, οι αντάρτες μας είχαν αποκλείσει έξω από ένα χωριό και οι στρατιώτες θα έρριχναν κλήρο, ποιός θα πάη στο χωριό για εφόδια. «Θα πάω εγώ», είπα. Αν πήγαινε κάποιος άπειρος ή απρόσεκτος, μπορεί και να σκοτωνόταν και θα με έτυπτε μετά η συνείδηση. «Καλύτερα, σκέφτηκα, να σκοτωθώ εγώ, παρά να σκοτωθή ο άλλος και να με σκοτώνη η συνείδησή μου σε όλη μου την ζωή. Πώς θ᾿ αντέξω μετά; Θα μου λέη η συνείδησή μου: «Μπορούσες να τον γλυτώσης· γιατί δεν τον γλύτωσες;"». Νήστευα κιόλας και ήμουν νηστικός..., τέλος πάντων. Οπότε μου λέει ο διοικητής: «Και εγώ προτιμώ να πάς εσύ που πιάνεις πουλιά στον αέρα, αλλά να τρώς, για να έχης αντοχή». Πήρα το όπλο και ξεκίνησα. Οι αντάρτες με πέρασαν για δικό τους και με άφησαν να περάσω. Πήγα στο χωριό, ανέβηκα σε ένα διώροφο σπίτι. Μια γριά που ήταν εκεί μου έδωσε εφόδια και γύρισα πίσω στην διλοχία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Την μεγαλύτερη χαρά την ένιωθα τον χειμώνα, εκεί μέσα στα χιόνια. Θυμάμαι, ξύπνησα ένα βράδυ· οι άλλοι κοιμόνταν. Το χιόνι είχε σκεπάσει τις σκηνές. Πάω, πιάνω τον ασύρματο και βγάζω το χιόνι από τις τρύπες του ασυρμάτου· βλέπω δούλευε. Τρέχω στον διοικητή και του το λέω. Εκείνο το βράδυ είκοσι έξι κρυοπαγημένους έβγαλα μέσα από το χιόνι με τον κασμά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εγώ δεν έκανα τίποτε για τον Χριστό. Αν το 10% από όσα έκανα στον στρατό το έκανα για τον Χριστό, τώρα θα έκανα θαύματα! Γι'' αυτό μετά στην καλογερική έλεγα: «Στον στρατό, για την πατρίδα ταλαιπωρήθηκα τόσο, για τον Χριστό τί κάνω;». Δηλαδή μπροστά στην ταλαιπωρία που πέρασα στον στρατό, στην καλογερική αισθανόμουν σαν να ήμουν βασιλόπουλο – άσχετα αν είχα ή δεν είχα παξιμάδι. Γιατί στις επιχειρήσεις ξέρεις τί νηστεία κάναμε; Τρώγαμε σπυρωτό χιόνι. Οι άλλοι έτρεχαν, έβρισκαν και κάτι να φάνε. Εγώ με τον ασύρματο δεν μπορούσα να μετακινηθώ. Μια φορά δεκατρείς μέρες ήμασταν νηστικοί. Μόνο μια κουραμάνα και μισή ρέγγα μας είχαν μοιράσει. Νερό έπινα από τις πατημασιές των ζώων. Και δεν ήταν και καθαρό βρόχινο αλλά λασπωμένο. Είχα πιεί μιά... πορτοκαλλάδα μια φορά! Είχα σκάσει για νερό. Είδα μια πατημασιά ζώου γεμάτη κίτρινο νερό, ήπια–ήπια... Οπότε μετά στην καλογερική, ακόμη και ζούδια να είχε το νερό, μου φαινόταν μεγάλη ευλογία. Έμοιαζε τουλάχιστον με νερό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια φορά, ένα απόγευμα, είχε κοπή η έρπουσα γραμμή. Ήταν Δεκέμβρης μήνας του 1948. Το χιόνι πολύ. Στις 4 η ώρα το απόγευμα έρχεται διαταγή να πάμε στο χωριό, δυο ώρες μακριά, να φτιάξουμε την γραμμή και να γυρίσουμε πίσω. Εν τω μεταξύ δεν είχε ακόμη ούτε δυο ώρες μέρα. Οι στρατιώτες ήταν σκοτωμένοι στην κούραση και δεν είχαν κουράγιο να ξεκινήσουν. Και που να βρής την γραμμή με τόσο χιόνι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ξέρατε, Γέροντα, τον δρόμο και που ήταν η γραμμή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έ, περίπου τον δρόμο τον ήξερα, αλλά θα μας έπιανε και η νύχτα. Τέλος πάντων, μου έδωσαν μια ομάδα και ξεκινήσαμε. Στην αρχή ανοίξαμε μέσα στο στρατόπεδο με το φτυάρι τον δρόμο από το χιόνι, και έτσι προχωρήσαμε λίγο, για να αναπαύσουμε τον διοικητή. Μετά λέω: «Προχωράμε, γιατί πρέπει και να γυρίσουμε». Πήγαινα μπροστά, γιατί οι άλλοι ήταν όλο αντίδραση. «Η Ελλάδα ποτέ δεν πεθαίνει, αλλά πεθαίνουμε εμείς», μου έλεγαν. Συνέχεια αυτό! Προχωρούσα, βούλιαζα μέσα στο χιόνι, με τραβούσαν επάνω· ξαναβούλιαζα, με ξανατραβούσαν. Είχα και ένα ξίφος και το κάρφωνα κάτω, για να κάνω γείωση. Συνέχεια έπρεπε να ελέγχω. Έμπαινα μπροστά. «Προχωρήστε, τους έλεγα· από ᾿δώ δεν περνούν ζώα, για να κόψουν την γραμμή. Μόνο σε κανένα λάκκο που η γραμμή είναι εναέριος, εκεί να ελέγξουμε». Τελικά φθάσαμε σε ένα χωριό που είχε πεζούλια καί, καθώς το χιόνι είχε στοιβαχθή από τον αέρα, δεν ξεχώριζες τίποτε. Όταν φθάσαμε στα πεζούλια, πέφτω μέσα στο χιόνι. Τρόμαξαν να με βγάλουν οι άλλοι. Ύστερα σιγά-σιγά από το ένα πεζούλι στο άλλο κατεβήκαμε όλοι – μην τα ρωτάς πώς! – αργά το βράδυ στο χωριό. Βρήκα σε κάτι λάκκους σε ένα-δυό μέρη την γραμμή κρεμασμένη, την συνδέσαμε και μπορέσαμε να επικοινωνήσουμε με τον διοικητή. «Να γυρίστε πίσω», μας λέει ο διοικητής. Αλλά πώς να γυρίσουμε; Εκτός που ήταν νύχτα, πώς να ανεβούμε τα πεζούλια; Κουτρουβάλα τα είχαμε κατεβή! Που να βρής δρόμο; «Μά έτσι στον ανήφορο, πώς να γυρίσουμε; του λέω. Στον κατήφορο τέλος πάντων, κατεβήκαμε! Να γυρίσουμε αύριο το πρωί από την άλλη μεριά του χωριού κάνοντας τον γύρο». «Τίποτε, λέει ο διοικητής, απόψε». Ευτυχώς άκουσε ένας υπασπιστής τον διοικητή και τον παρακάλεσε να μας αφήση να μείνουμε την νύχτα στο χωριό, και έτσι μείναμε. Σε ένα σπίτι μας έδωσαν δυό-τρείς τσέργες[123]καί, επειδή είχα πουντιάσει – όπως έμπαινα μπροστά και άνοιγα τα χιόνια, είχα γίνει τελείως μούσκεμα –, οι άλλοι με λυπήθηκαν, γιατί κατά κάποιο τρόπο την πλήρωσα εγώ που τραβούσα μπροστά, και με έβαλαν στην μέση, για να ζεσταθώ. Τότε είχαμε φάει μόνον ένα κομμάτι κουραμάνα. Μεγαλύτερη χαρά δεν θυμάμαι να έχω νιώσει στην ζωή μου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αναγκάσθηκα να σάς πω αυτά τα παραδείγματα, για να καταλάβετε τί θα πη θυσία. Δεν σάς τα είπα όλα αυτά, για να με χειροκροτήσετε, αλλά για να καταλάβετε από που βγαίνει η πραγματική χαρά. Έπειτα στο γραφείο Διαβιβάσεων ο ένας μου έλεγε ψέματα: «Έρχεται ο πατέρας μου και πρέπει να πάω να τον δώ. Σε παρακαλώ, κάθησε λίγο στην θέση μου». Ο άλλος: «Ήρθε η αδελφή μου» – και δεν ήταν ούτε καν αδελφή του. Κάποιος άλλος κάτι άλλο, και εγώ καθόμουν συνέχεια στην υπηρεσία για τον ένα και για τον άλλον και θυσιαζόμουν. Ύστερα σκούπιζα, καθάριζα, γιατί εκεί στην διμοιρία Διαβιβάσεων απαγορευόταν να μπαίνουν άλλοι. Ούτε αξιωματικός από άλλη υπηρεσία δεν μπορούσε να πάη μέσα, γιατί ήταν και καιρός πολέμου. Καθαρίστρια να πάρουμε, δεν μπορούσαμε. Έπαιρνα λοιπόν την σκούπα και καθάριζα όλους τους χώρους. Εκεί έμαθα να σκουπίζω. «Εδώ είναι μια υπηρεσία, έλεγα, είναι, κατά κάποιο τρόπο, ιερός χώρος· δεν κάνει να είναι ακατάστατα». Ούτε υποχρέωση είχα να σκουπίσω ούτε ήξερα από σκούπισμα. Μήπως είχα πιάσει ποτέ σκούπα στο σπίτι μου; Και να ήθελα να πιάσω σκούπα, θα με σκότωνε στο ξύλο με την σκούπα η αδελφή μου. «Καθαρίστρια» με έλεγαν οι άλλοι, «αιώνιο θύμα» με έλεγαν. Δεν τα λάμβανα υπ᾿ όψιν μου. Και ούτε για να ακούσω το «ευχαριστώ» το έκανα. Αλλά το έκανα από μέσα μου, γιατί το ένιωθα ως ανάγκη και το χαιρόμουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν σάς περνούσε, Γέροντα, καθόλου αριστερός λογισμός; Δεν λέγατε λ.χ.: «Ο άλλος γυρίζει· δεν πάει να δη την αδελφή του»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν μου περνούσε λογισμός. Από την στιγμή που μου έλεγε ο άλλος «σέ παρακαλώ, μπορείς να καθήσης λίγο», τελείωσε. Άλλος μου ζητούσε χρήματα και μου έλεγε δήθεν ότι τα ήθελε για τα παιδιά του, και αυτός όχι μόνο δεν έστελνε στα παιδιά του, αλλά ζητούσε και από την γυναίκα του χρήματα, να ξοδεύη για τον εαυτό του. Κατάλαβες; Ούτε το έκανα, για να μου πούν «μπράβο»· το αισθανόμουν ως ανάγκη. Επειδή δεν έβγαινα έξω, το είχαν εκμεταλλευτή οι άλλοι και μου άφηναν όλη την δουλειά. Έβγαζα όλη την δουλειά της διμοιρίας. Ένα σωρό σήματα διαβιβάσεων· να βροντάνε συνέχεια οι θυρίδες. Είχα γίνει ερείπιο. Ένα διάστημα είχα συνέχεια τριάντα εννιάμισι πυρετό και δεν έλεγα σε κανέναν τίποτε. Έπειτα έπεσα πτώμα από την υπερκόπωση. Λιποθύμησα και με πέταξαν σε ένα φορείο. «Άντε Βενέδικτε[124], άκουσα να λένε, θα σε πάμε με το φορείο για γενική επισκευή εκεί που φτιάχνουν τα χαλασμένα αυτοκίνητα!» και με πήγαν σε ένα νοσοκομείο. Και εκεί εγκαταλελειμμένος – ποιός να μου δώση σημασία; όλοι κοιτούσαν τους τραυματισμένους –, αλλά ένιωθα χαρά, την χαρά αυτή που βγαίνει από την θυσία. Γιατί από την ανάπαυση του άλλου γεννιέται η ανάπαυση η δική μου.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όσο ξεχνάμε τον εαυτό μας, τόσο μας θυμάται ο Θεός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος έχει θυσία και πίστη στον Θεό, δεν υπολογίζει τον εαυτό του. Ο άνθρωπος, όταν δεν καλλιεργήση το πνεύμα της θυσίας, σκέφτεται μόνον τον εαυτό του και θέλει όλοι να θυσιάζωνται γι᾿ αυτόν. Αλλά όποιος σκέφτεται μόνον τον εαυτό του, αυτός απομονώνεται και από τους ανθρώπους, απομονώνεται και από τον Θεό – διπλή απομόνωση –, οπότε δεν δέχεται θεία Χάρη. Αυτός είναι άχρηστος άνθρωπος. Και να δήτε, αυτόν που σκέφτεται συνέχεια τον εαυτό του, τις δυσκολίες του κ.λπ., και ανθρωπίνως κανείς δεν θα του συμπαρασταθή σε μια ανάγκη. Καλά, θεϊκή συμπαράσταση δεν θα έχη, αλλά δεν θα έχη και ανθρώπινη. Μετά θα προσπαθή από εδώ-από εκεί να βοηθηθή. Θα βασανίζεται δηλαδή, για να βοηθηθή από ανθρώπους, αλλά βοήθεια δεν θα βρίσκη. Αντίθετα, όποιος δεν σκέφτεται τον εαυτό του, αλλά σκέφτεται συνέχεια τους άλλους, με την καλή έννοια, αυτόν τον σκέφτεται συνέχεια ο Θεός, και μετά τον σκέφτονται και οι άλλοι. Όσο ξεχνάει τον εαυτό του, τόσο τον θυμάται ο Θεός. Νά, μια ψυχή φιλότιμη μέσα σε ένα Κοινόβιο θυσιάζεται, δίνεται κ.λπ. Αυτό, νομίζετε, δεν έχει πέσει στην αντίληψη των άλλων; Μπορεί να μην την σκεφθούν οι άλλοι αυτήν την ψυχή που δίνεται ολόκληρη και δεν σκέφτεται τον εαυτό της; Μπορεί να μην την σκεφθή ο Θεός; Μεγάλη υπόθεση! Εδώ βλέπει κανείς την ευλογία του Θεού, πώς εργάζεται ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στις δυσκολίες δίνει εξετάσεις ο άνθρωπος. Εκεί φαίνεται αν έχη πραγματική αγάπη, θυσία. Και όταν λέμε ότι ένας έχει θυσία, εννοούμε ότι την ώρα του κινδύνου δεν υπολογίζει τον εαυτό του και σκέφτεται τους άλλους. Βλέπεις, και η παροιμία λέει «ο καλός φίλος στην ανάγκη φαίνεται». Θεός φυλάξοι, αν λ.χ. τώρα έπεφταν βόμβες, θα φαινόταν ποιός σκέφτεται τον άλλον και ποιός σκέφτεται τον εαυτό του. Όποιος όμως έχει μάθει να σκέφτεται μόνον τον εαυτό του, σε μια δυσκολία πάλι τον εαυτό του θα σκέφτεται, και ο Θεός δεν θα τον σκέφτεται αυτόν τον άνθρωπο. Όταν από τώρα δεν σκέφτεται κανείς τον εαυτό του αλλά σκέφτεται τους άλλους, και στον κίνδυνο τους άλλους θα σκεφθή. Τότε ξεκαθαρίζουν ποιοί έχουν πραγματικά θυσία και ποιοί είναι φίλαυτοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν δεν αρχίση κανείς να κάνη από τώρα καμμιά θυσία, να θυσιάση μια επιθυμία, έναν εγωισμό, πώς θα φθάση να θυσιάση την ζωή του σε μια δύσκολη στιγμή; Αν τώρα σκέφτεται τον κόπο και κοιτάη να μην κοπιάση λίγο παραπάνω από έναν άλλο σε μια δουλειά, πώς θα φθάση στην κατάσταση να τρέχη να σκοτωθή αυτός, για να μη σκοτωθή ο άλλος; Αν τώρα για μικρά πράγματα σκέφτεται τον εαυτό του, τότε που θα κινδυνεύη η ζωή του, πώς θα σκεφθή τον άλλον; Τότε θα είναι πιο δύσκολα. Αν έρθουν δύσκολα χρόνια και έχη λ.χ. ο διπλανός του πυρετό και τον δη να πέση στον δρόμο, θα τον αφήση και θα φύγη. Θα πή: «Να πάω να ξαπλώσω, μην πέσω και εγώ».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στον πόλεμο παλεύει η ζωή η δική σου με την ζωή του άλλου. Λεβεντιά είναι να τρέχη ο ένας να γλυτώση τον άλλον. Όταν δεν υπάρχη θυσία, ο καθένας πάει να γλυτώση τον εαυτό του. Και είναι παρατηρημένο· όποιος πάει στον πόλεμο να ξεφύγη, τον βρίσκει εκεί η οβίδα. Πάει δήθεν να γλυτώση και σπάζει τα μούτρα του. Γι᾿ αυτό να μην κοιτάζη κανείς να ξεφύγη, και ιδίως όταν αυτό είναι εις βάρος των άλλων. Θυμάμαι ένα περιστατικό από τον Αλβανικό πόλεμο. Ένας στρατιώτης είχε μια πλάκα, για να προστατεύη το κεφάλι του. Εν τω μεταξύ χρειάσθηκε να πάη λίγο πιο πέρα και την ακούμπησε κάτω. Πάει αμέσως ο διπλανός του και την παίρνει. Σού λέει: «Ευκαιρία είναι, θα την πάρω εγώ τώρα». Την ίδια στιγμή, τάκ, πέφτει ο όλμος επάνω του, τον διέλυσε. Αυτός έβλεπε τα πυρά που έπεφταν και πήρε την πλάκα, για να γλυτώση· δεν υπολόγισε τον άλλον που θα γύριζε πάλι. Σκέφθηκε μόνον τον εαυτό του και δικαιολόγησε κάπως και την πράξη του: «Αφού πήγε λίγο πιο πέρα ο άλλος, μπορώ να την πάρω την πλάκα». Ναί, έφυγε, αλλά η πλάκα ήταν δική του. Ένας άλλος, όσο συνεχιζόταν ο πόλεμος, προσπαθούσε να γλυτώση. Κανέναν δεν υπολόγιζε. Οι άλλοι βοηθούσαν, αυτός καθόταν στο σπίτι του. Κοίταζε μέχρι την τελευταία ώρα που δυσκόλεψαν τα πράγματα να ξεφύγη. Αργότερα, όταν είχαν έρθει οι Άγγλοι, πήγε στο στρατόπεδο, παρουσιάσθηκε στον Ζέρβα καί, επειδή είχε και αμερικανική υπηκοότητα, βρήκε ευκαιρία και έφυγε για την Αμερική. Μόλις όμως έφθασε εκεί, πέθανε! Η γυναίκα του η καημένη έλεγε: «Πήγε να ξεφύγη από τον Θεό!». Αυτός πέθανε, ενώ άλλοι που πήγαν και στον πόλεμο έζησαν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όσοι πεθαίνουν παλληκαρίσια, δεν πεθαίνουν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θυμάμαι, στον στρατό το σύνολο είχε έναν κοινό σκοπό. Προσπαθούσα εγώ, αλλά η θυσία υπήρχε και στους άλλους, άσχετα αν πίστευαν ή όχι στην άλλη ζωή. «Γιατί να σκοτωθή ο άλλος; είναι οικογενειάρχης», έλεγαν, και πήγαιναν αυτοί σε μια επικίνδυνη επιχείρηση. Η θυσία που έκαναν αυτοί είχε μεγαλύτερη αξία από την θυσία που έκανε ένας πιστός. Ο πιστός πίστευε στην θεία δικαιοσύνη, στην θεία ανταπόδοση, ενώ αυτοί δεν γνώριζαν ότι δεν πάει χαμένη η θυσία που έκαναν και ότι θα έχουν να λάβουν γι' αυτήν στην άλλη ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην Κατοχή, τότε με τον Δαβάκη, οι Ιταλοί είχαν κάνει συλλήψεις νέων αξιωματικών, τους έβαλαν σε ένα καράβι και τους βούλιαξαν. Ύστερα, τους πρώτους που έπιασαν, τους βασάνισαν, για να μαρτυρήσουν ποιοί έχουν όπλα. Εκεί να δήτε κοσμικοί άνθρωποι τί θυσία έκαναν! Στην Κόνιτσα, κοντά στο σπίτι μας, εκεί που έχτισαν τώρα τον Ναό του Αγίου Κοσμά του Αιτωλού, πρώτα ήταν τζαμί. Τους έκλειναν μέσα στο τζαμί και τους έδερναν όλη την νύχτα με βούρδουλα που είχε επάνω κολτσίδες όλο αγκάθια ή με καλώδια γδαρμένα· έβγαιναν έξω τα σύρματα, έδεναν και στην άκρη μολύβια και μ'' αυτά τους χτυπούσαν· και αυτό το ατσαλένιο σύρμα πήγαινε και έγδερνε το δέρμα. Για να μην ακούγωνται οι φωνές, τραγουδούσαν ή έβαζαν μουσική. Από ᾿δώ βγήκε το «ξύλο μετά μουσικής». Τους κρεμούσαν και ανάποδα και έβγαζαν οι καημένοι αίμα από το στόμα, αλλά δεν μιλούσαν, γιατί σκέφτονταν: «Αν μαρτυρήσουμε εμείς – ήξεραν ποιοί είχαν ντουφέκια –, ύστερα θα χτυπούν τον καθέναν, για να μαρτυρήση». Γι'' αυτό οι πρώτοι είπαν: «Ας πεθάνουμε εμείς, για να τους αποδείξουμε ότι δεν έχουν οι άλλοι ντουφέκια». Και ήταν μερικοί που για μια οκά ή για πέντε οκάδες αλεύρι έλεγαν ότι ο τάδε π.χ. έχει δύο ντουφέκια. Πεινούσε ο κόσμος και πρόδιδαν τους άλλους. Οπότε και μερικοί Ιταλοί από ένα τάγμα που ήταν νόθα παιδιά και ήταν βάρβαροι με όλα τα κόμπλεξ που είχαν, έβγαζαν το άχτι τους. Έπαιρναν τα μικρά παιδιά, τα έβαζαν τα καημένα γυμνά πάνω στην μασίνα που έκαιγε και τα πατούσαν να καούν. Τα έκαιγαν, για να μαρτυρήσουν οι γονείς που έχουν το ντουφέκι. «Δεν έχω, δεν έχω», έλεγαν οι μεγάλοι και εκείνοι έκαιγαν τα παιδάκια. Θέλω να πώ, εκείνοι προτίμησαν να πεθάνουν, αν και ήταν κοσμικοί άνθρωποι, για να μη φάνε και οι άλλοι ξύλο ή για να μην τους σκοτώσουν. Με αυτόν τον τρόπο έσωσαν πολύ κόσμο. Έτσι από μερικά παλληκάρια κρατήθηκε το Έθνος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι πεθαίνουν παλληκαρίσια, δεν πεθαίνουν. Αν δεν υπάρχη ηρωισμός, δεν γίνεται τίποτε. Και να ξέρετε, ο πιστός είναι και γενναίος. Ο Μακρυγιάννης ο καημένος τί τράβηξε! Και σε τί χρόνια!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – «Κάπνισαν τα μάτια μου», λέει κάπου, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, κάπνισαν τα μάτια του. Από την ένταση και την αγωνία που είχε, ήταν σαν να έβγαζαν υδρατμούς τα μάτια του. Βρέθηκε σ᾿ εκείνη την κατάσταση και από πόνο και αγάπη θυσιαζόταν συνέχεια. Δεν σκέφθηκε, δεν υπολόγισε ποτέ τον εαυτό του. Δεν φοβήθηκε μην τον σκοτώσουν, όταν αγωνιζόταν για την πατρίδα. Ο Μακρυγιάννης ζούσε πνευματικές καταστάσεις. Αν γινόταν καλόγερος, πιστεύω ότι από τον Άγιο Αντώνιο δεν θα είχε μεγάλη διαφορά. Τρείς χιλιάδες μετάνοιες έκανε και είχε και τραύματα και πληγές. Άνοιγαν οι πληγές του, έβγαιναν τα έντερά του, όταν έκανε μετάνοιες, και τα έβαζε μέσα. Τρείς δικές μου μετάνοιες κάνουν μία δική του. Έβρεχε το πάτωμα με τα δάκρυά του. Εμείς, αν ήμασταν στην θέση του, θα πηγαίναμε στο νοσοκομείο να μας υπηρετούν. Θα μας κρίνουν οι κοσμικοί!
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος δεν υπολογίζει τον εαυτό τουδέχεται θεϊκή δύναμη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κινδυνεύσατε καμμιά φορά στον πόλεμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ώ, μια και δυό; Τα σκέφτομαι τώρα πώς βοηθούσε ο Θεός και συγκλονίζομαι. Τότε δεν τα σκεφτόμουν. Ειδικά τον θάνατο δεν τον σκεφτόμουν καθόλου. Όταν είσαι αποφασισμένος για τον θάνατο, δεν φοβάσαι τίποτε. Η απόφαση για τον θάνατο ισοδυναμεί με χίλιους φύλακες. Ο θάνατος είναι ασφάλεια. Στον πόλεμο οι ιεροί λόχοι έχουν την νεκροκεφαλή· είναι αποφασισμένοι να πεθάνουν. Όποιος δεν υπολογίζει τον εαυτό του για το καλό του άλλου ή για το κοινό καλό, δέχεται μέσα του θεϊκή δύναμη. Και να δήτε, αν κινηθή κανείς με θυσία, ο Θεός τον σκεπάζει. Θυμάμαι, μια φορά είχαμε οχυρωθή πίσω από έναν βράχο. Εγώ είχα σκάψει ένα λακκάκι και είχα κρυφτή λίγο. Έρχεται ο ένας και μου λέει «νά μπώ κι εγώ»· έρχεται ο άλλος, μου λέει «νά μπώ κι εγώ». Τους άφησα να μπούν, αφού μου το ζητούσαν και έμεινα εγώ έξω. Το βράδυ, όταν έπεφταν τα πολλά βλήματα, με παίρνει ένα βλήμα ξυστά στο κεφάλι. Φορούσα κουκούλα· δεν φορούσα κράνος. «Παιδιά, φωνάζω, με χτύπησε βλήμα!». Πιάνω με το χέρι μου το κεφάλι, δεν βλέπω αίματα· το ξαναπιάνω, τίποτε. Το βλήμα είχε περάσει ξυστά από το κεφάλι μου και είχε κουρέψει μόνον από μπρός προς τα πίσω τα μαλλιά μου και είχε σχηματισθή μια λωρίδα έξι πόντους φάρδος χωρίς μαλλιά!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εσείς δεν περάσατε δύσκολα χρόνια, κατοχές, δεν είδατε πόλεμο, εχθρούς κ.λπ. – εύχομαι να μη δήτε – και ούτε καταλαβαίνετε από αυτά. Τα χρόνια όμως αυτά είναι σαν μια χύτρα που βράζει και σφυρίζει. Θέλει μια σκληραγωγία, μια παλληκαριά και έναν ανδρισμό. Αν τυχόν γίνη κάτι, κοιτάξτε μη βρεθήτε τελείως απροετοίμαστες. Να ετοιμασθήτε από τώρα, για να μπορέσετε να αντιμετωπίσετε μια δυσκολία. Και ο Χριστός τί είπε; «Γίνεσθε έτοιμοι»[125]δεν είπε; Σήμερα που ζούμε σε τέτοια δύσκολα χρόνια, για έναν λόγο παραπάνω, τρεις φορές πρέπει να είμαστε έτοιμοι. Δεν είναι μόνον ο αιφνίδιος θάνατος που μπορεί να αντιμετωπίσουμε, είναι και άλλοι κίνδυνοι. Να φύγη λοιπόν το βόλεμα του εαυτού μας. Να δουλεύη το φιλότιμο. Να υπάρχη το πνεύμα της θυσίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τώρα βλέπω σαν να είναι κάτι που πάει να γίνη και συνέχεια αναβάλλεται. Όλο αναβολές μικρές. Ποιός τις κάνει; Ο Θεός σπρώχνει; Άντε ακόμη έναν μήνα, δύο μήνες!... Η υπόθεση έτσι πάει[126]. Αλλά, επειδή δεν ξέρουμε τί μας περιμένει, όσο μπορείτε, να καλλιεργήσετε την αγάπη. Αυτό είναι το κυριώτερο απ᾿ όλα: να έχετε μεταξύ σας αγάπη αληθινή, αδελφική, όχι ψεύτικη. Πάντα, όταν υπάρχη το καλό ενδιαφέρον, ο πόνος, η αγάπη, ενεργεί κανείς σωστά. Η καλωσύνη, η αγάπη, είναι δύναμη. Όσο μπορείτε να έχετε εχεμύθεια και να μην ξανοίγεσθε· ο ένας θα το πη στον άλλον, και ο άλλος στον άλλον, και τί βγήκε; Μπορεί ακόμη και από μια χαζομάρα να κάνετε κακό και να χτυπήσετε μετά το κεφάλι στον τοίχο. Να βλέπατε στον στρατό εχεμύθεια! Πρώτη δουλειά, αν κινδύνευες να σε πιάσουν, ήταν να καταστρέψης τα διακριτικά στοιχεία. Έκοβες τα στοιχεία κομματάκια, για να τα καταπιής. Μια φορά που βρέθηκα σε δυσκολία, τα κατάπια. Γιατί, αν τα έπαιρναν οι αντάρτες, μάθαιναν ότι στο τάδε μέρος υπάρχει στρατός, έχει ανάγκη από τροφές κ.λπ., έστελναν αυτοί σήμα στο κέντρο, οπότε ερχόταν η αεροπορία και έρριχνε σ᾿ αυτούς τρόφιμα και βομβάρδιζε τον στρατό. Κατάλαβες; Παρουσιάζονταν αυτοί για στρατός. Αν σε έπιαναν και ήσουν ασυρματιστής, σού έβγαζαν τα νύχια με την τανάλια, για να μαρτυρήσης τα διακριτικά. Και προτιμούσες να σού βγάλουν τα νύχια, παρά να προδώσης. Του άλλου του έκαψαν τις μασχάλες, για να παραδώση επιστολή, και δεν ομολόγησε· έμεινε παράλυτος. Δεν ομολόγησε, γι᾿ αυτό και έγινε ομολογητής. Γυναίκες μετέφεραν μέσα στα σαμάρια έγγραφα αποφασισμένες να πεθάνουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο θάνατος στον πόλεμο πολύ εξιλεώνει, γιατί θυσιάζεται κανείς, για να προστατεύση τους άλλους. Εκείνοι που θυσιάζουν την ζωή τους από καθαρή αγάπη, για να προστατεύσουν τους συνανθρώπους τους, μιμούνται τον Χριστό. Αυτοί είναι οι μεγαλύτεροι ήρωες, διότι τους τρέμει ακόμη και ο θάνατος, επειδή αψηφούν τον θάνατο από αγάπη, και έτσι κερδίζουν την αθανασία, παίρνοντας το κλειδί της αιωνιότητος κάτω από την πλάκα του τάφου, και προχωρούν ελαφρά στην αιώνια μακαριότητα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όλη η ζωή του μοναχού είναι μια θυσία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τον μοναχό τον βοηθάει φυσιολογικά όλη η ζωή του να έχη την αγάπη, την θυσία. Ξεκίνησε να πεθάνη για τον Χριστό. Ξεκίνησε δηλαδή για την θυσία. Δεν έχει και υποχρεώσεις, γι᾿ αυτό επιβάλλεται ο μοναχός να καλλιεργή το πνεύμα της θυσίας. Ο λαϊκός δεν ξεκίνησε να πεθάνη για τον Χριστό. Ύστερα έχει και υποχρεώσεις. Σκέφτεται την οικογένειά του, τα παιδιά του, γι᾿ αυτό έχει ελαφρυντικά και δικαιολογείται. Π.χ. σε έναν πόλεμο, ένας που έχει οικογένεια πάει να αποφύγη τον κίνδυνο, για να μη μείνουν τα παιδιά του στον δρόμο. Δεν υπολογίζει ότι, αν αποφύγη εκείνος, ίσως σκοτωθή κάποιος άλλος που έχει και εκείνος παιδιά. Τέλος πάντων, εκεί υπάρχει τουλάχιστον ένα ενδιαφέρον για την οικογένειά του. Σού λέει: «Τα παιδιά μου να μη μείνουν στον δρόμο». Μπορεί να μην πιστεύη κιόλας στην άλλη ζωή και πάει να γλυτώση αυτήν την ζωή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, ο μοναχός πρέπει να θυσιάζη συνέχεια τον εαυτό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε, δεν είπαμε ότι όλη η ζωή του μοναχού είναι μια θυσία; Έ, τί κάνουμε αλλιώς; Αν χωλαίνη σ᾿ αυτό το θέμα ο μοναχός, τότε δεν είναι μοναχός. Μετά τί πνευματικά να πής; Δεν χωράνε τα πνευματικά, όταν δεν υπάρχη θυσία. Όσα πνευματικά και αν κάνη από εκεί και πέρα ο μοναχός, τίποτε δεν είναι. Στο Άγιον Όρος αυτά τα πνευματικά τα λένε «κουκουσκιάχτικα». Δηλαδή δεν μπορεί να διώξη δαιμόνια ο καλόγερος που κάνει τέτοια πνευματικά· ίσα–ίσα τα κοράκια διώχνει. Όταν ο άνθρωπος παίρνη στα ζεστά τον αγώνα που έχει να κάνη σ́ αυτήν την ζωή, υπάρχει και η θεία φλόγα μέσα του. Άμα λείπη αυτή η θεία φλόγα, είναι άχρηστος. Αυτή είναι που του δίνει χαρά, του δίνει παλληκαριά, του δίνει φιλότιμο. Είναι αυτό που είπε ο Κύριος: «Πύρ ήλθον βαλείν»[127]. Όταν υπάρχη αυτό το θείο πύρ, τότε και η ψαλμωδία και η προσευχή του είτε για τον εαυτό του είτε για τους άλλους έχει αποτελέσματα. Ιδίως η γυναικεία καρδιά, όταν εξαγνισθή, έχει μεγάλη δύναμη. Και στην προσευχή πολύ προχωράει. Ραντάρ γίνεται. Όποιος δεν έχει φιλότιμο, θυσία, θα έχη ή κοσμική χαρά ή κοσμική στενοχώρια· αγαλλίαση πνευματική δεν μπορεί να νιώση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι' αυτό λέω να καλλιεργήσετε την θυσία, την αδελφοσύνη. Να αποκτήση καθεμία κατάσταση πνευματική, για να  μπορή να τα  βγάλη πέρα μόνη της σε μια δύσκολη περίσταση. Αν δεν έχη κανείς πνευματική κατάσταση, δειλιάζει, επειδή αγαπάει τον εαυτό του. Μπορεί και τον Χριστό να αρνηθή, να Τον προδώση. Πρέπει να είστε αποφασισμένες να πεθάνετε. Εδώ κοσμικοί άνθρωποι θυσιάζονται, που ούτε και στον Παράδεισο πιστεύουν. Εμείς πιστεύουμε ότι τίποτε δεν πάει χαμένο και η θυσία μας έχει νόημα. Οι κοσμικοί να έχουν άγνοια από όλα και να θυσιάζωνται, να κινδυνεύουν, για να προφυλάξουν τον άλλον, και οι μοναχοί να μη θυσιάζωνται; Εμείς ξεκινάμε για την αγάπη του Χριστού να πεθάνουμε, υποχρεώσεις δεν έχουμε, αν δεν έχουμε και θυσία, τότε τί κάνουμε; Θα μας γελάν και τα μυρμήγκια μετά! Είδες μυρμήγκια να κοροϊδεύουν τους ανθρώπους; Κοροϊδεύουν τους τεμπέληδες!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ενδέχεται να έχω προθυμία να εξυπηρετώ και να μην έχω αγνά ελατήρια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό φαίνεται. Όταν δεν είναι αγνά τα ελατήρια, η ψυχή δεν βρίσκει ανάπαυση. Οπότε το καταλαβαίνει και προσπαθεί να τα εξαγνίση. Μου έκανε εντύπωση μια ψυχή που ήρθε αυτές τις μέρες. Όταν μαθαίνη ότι κάποιος είναι άρρωστος και υποφέρει, δεν μπορεί να κοιμηθή, πονάει και κλαίει. Και ζη μέσα στον κόσμο. Το είπε σε κάποιον και της είπε: «Μπορεί να είναι του πειρασμού». Γίνεται να είναι αυτό του πειρασμού; Μόνον όταν το κάνη κανείς επιδεικτικά, μπορεί να τον ξεγελάη ο πειρασμός και να ζη μια λανθασμένη κατάσταση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να βγάζετε τον εαυτό σας από τις ενέργειές σας. Ο άνθρωπος, όταν βγαίνη από τον εαυτό του, βγαίνει από την γή. Κινείται σε άλλη ατμόσφαιρα. Όσο παραμένει στον εαυτό του, δεν μπορεί να γίνη ουράνιος άνθρωπος. Δεν γίνεται πνευματική ζωή χωρίς θυσία. Να θυμάστε και λίγο ότι υπάρχει θάνατος. Μια που θα πεθάνουμε, να μην προσέχουμε και τόσο πολύ τον εαυτό μας. Όχι να μην προσέχουμε και να παθαίνουμε ζημιές, αλλά όχι να  προσκυνούμε και την ανάπαυση! Ούτε λέω να ρίχνη κανείς τον εαυτό του στους κινδύνους, αλλά να έχη λίγο ηρωισμό, βρέ παιδάκι μου! Οι ήρωες με τί παλληκαριά αντιμετώπιζαν στον αγώνα τον θάνατο! Μου έλεγε ένας μοναχός που ήταν μαζί με τον Κονδύλη – ο Κονδύλης ήταν πατριώτης, ήρωας: Όταν οι Έλληνες με τον πόλεμο στην Μικρά Ασία είχαν κάνει αποβίβαση κοντά στην Πόλη, ο Κονδύλης μέσα στο καράβι, μόλις είδε από μακριά την Πόλη, έκανε σαν τρελλός. «Βρέ παιδιά, θα πεθάνουμε που θα πεθάνουμε, φώναζε. Τί σήμερα, τί αύριο! Να πεθάνουμε παλληκαρίσια, βρέ παιδιά! Ας πεθάνουμε ήρωες για την πατρίδα». Δεν είχε υπομονή ούτε να προσεγγίσουν στην ξηρά. Από την αγωνία, από την λαχτάρα που είχε, δεν είδε ότι το καράβι δεν είχε ακουμπήσει ακόμη στην ξηρά, πήδηξε και έπεσε μέσα στην θάλασσα! Τόσο πολύ! Δεν ήξερε και κολύμπι, έτρεξαν, τον έβγαλαν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μας είπατε να προσπαθήσουμε να μην είναι ο εαυτός μας σε κάθε μας ενέργεια. Πώς θα γίνη αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσείς όλα έτοιμα τα θέλετε. Τί θα πη βγάζω τον εαυτό μου; Πότε βγάζω τον εαυτό μου; Πώς θα βγάλουμε τον εαυτό μας από την αγάπη μας; Πώς θα λαμπικάρουμε την αγάπη μας; Όσο δεν υπολογίζω τον εαυτό μου, τόσο βγάζω τον εαυτό μου. Και όταν κόβουμε το θέλημα, την αδυναμία, την ανάπαυσή μας, και τότε βγάζουμε τον εαυτό μας. Και με την υπακοή και με την σιωπή πολλά εξαφανίζονται από τον εαυτό μας. Και όταν δεν έχη ιδιοτέλεια η αγάπη μας, πάλι βγάζουμε τον εαυτό μας, αλλά πρέπει να έχη και θυσία η αγάπη μας. Το καταλαβαίνετε αυτό; Μπορεί να θέλη π.χ. μια ψυχή να πάη στην Γερόντισσα και βλέπει μια άλλη αδελφή που θέλει και εκείνη να πάη. Αν αμέσως παραχωρήση την σειρά της, και ας ξέρη ότι η άλλη δεν έχει θέματα, τότε έχει την υπακοή, την θυσία κ.λπ. Και όταν με όλη την καρδιά της παραχωρήση την θέση της και δεν μιλήση με την Γερόντισσα, σ́ αυτήν θα μιλήση ο ίδιος ο Χριστός. Να το αισθανθή όμως ως ανάγκη, να το λέη η καρδιά της, όχι να το κάνη, επειδή απλώς το λένε οι Άγιοι Πατέρες. Έτσι λαμβάνει διπλή την Χάρη του Θεού. Τότε η μία βοηθιέται πνευματικά ανθρωπίνως, ενώ η άλλη βοηθιέται θεϊκά, απ' ευθείας από τον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παρατηρήστε και κοσμικούς που παρουσιάζουν τέτοια θυσία που δεν την έχουν ούτε μοναχοί. Στον κόσμο – μου κάνει εντύπωση –, παρόλο που οι άνθρωποι μπορεί να μην πιστεύουν, να έχουν τις αδυναμίες τους, τα πάθη τους, πώς τα οικονόμησε ο Θεός και έχουν μαλακή καρδιά. Βλέπουν κάποιον που έχει ανάγκη, και ας είναι άγνωστος, και πάνε να του προσφέρουν βοήθεια. Πολλοί που δεν πιστεύουν ούτε και στον Παράδεισο, αν δούν έναν κίνδυνο, τρέχουν να προλάβουν να μη γίνη κακό, να σκοτωθούν αυτοί, για να σωθούν άλλοι, να δώσουν περιουσίες κ.λπ. Πριν από χρόνια, σε μια βιοτεχνία κινδύνεψε να τυλιχθή ένας εργάτης σε ένα μηχάνημα, και ενώ ήταν τόσοι άνδρες, έτρεξε μια γυναίκα να τον γλυτώση. Οι άνδρες, που είχαν και παλληκαριά, κοιτούσαν... Τον γλύτωσε τελικά, αλλά τυλίχτηκε εκείνη με τα φορέματά της και σκοτώθηκε. Μάρτυρας! Μεγάλη υπόθεση!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τέτοιοι άνθρωποι δεν σκέφτονται τον εαυτό τους· τον πετάνε έξω. Και όταν τον πετάνε έξω, τότε πετιέται μέσα τους ο Χριστός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Η παλληκαριά γεννιέται από την εμπιστοσύνη στον Θεό
- type: h2
  initial:
    ru: ''
  text:
    ru: Η παλληκαριά δεν έχει βαρβαρότητα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα ανδραγαθήματα τα κάνουν αυτοί που έχουν παλληκαριά, μεγάλη καρδιά – όχι μεγάλο μπόι – και είναι αποφασισμένοι να θυσιασθούν. Και στον πόλεμο, όσοι έχουν παλληκαριά, επειδή έχουν καλωσύνη, δεν σκοτώνουν, γιατί η παλληκαριά δεν έχει βαρβαρότητα. Ρίχνουν γύρω-γύρω από τον εχθρό και τον αναγκάζουν να παραδοθή. Ο καλός προτιμάει να σκοτωθή εκείνος παρά να σκοτώση. Και όταν κανείς έχη τέτοια διάθεση, δέχεται θεϊκές δυνάμεις. Οι κακοί είναι φοβητσιάρηδες, άνανδροι, θρασύδειλοι· φοβούνται και τον εαυτό τους και τους άλλους, γι' αυτό ρίχνουν συνέχεια από φόβο. Τότε με τον ανταρτοπόλεμο, όταν υπηρετούσα στον στρατό, είχαμε πάει μια φορά σε ένα χωριό. «Δεν είναι εδώ κανείς από τους συμμορίτες, μας είπαν· έχουν φύγει όλοι. Μόνο μια τρελλή γυναίκα έμεινε». Ένας λοιπόν την είδε από μακριά και έρριξε μιά–δυό ριπές με το οπλοπολυβόλο! Η καημένη φώναξε «τί σάς έκανα;», και ύστερα έπεσε κάτω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από τον φόβο του το έκανε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, από τον φόβο του. Ένας τέτοιος άνθρωπος θέλει την εύκολη λύση για τον εαυτό του. Για να είναι σίγουρος, λέει: «Καλύτερα να τον ξεκάνω τον εχθρό». Ο λιγώτερο φοβητσιάρης είναι και λιγώτερο κακός. Θα κοιτάξη να τον αχρηστέψη τον εχθρό, να του σπάση λ.χ. το πόδι, το χέρι· δεν θα τον ξεκάνη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άλλο ανδρισμός, λεβεντιά, και άλλο κακότητα, εγκληματικότητα. Δεν είναι ανδρισμός να πιάνης τους εχθρούς, τους αιχμαλώτους, και να τους σφάζης. Ανδρισμός θα πη να πιάσω τον εχθρό, να του σπάσω το ντουφέκι και μετά να τον αφήσω ελεύθερο. Ο πατέρας μου έτσι έκανε. Όταν έπιανε τους Τσέτες[128]που έκαναν επιδρομές στα Φάρασα, έπαιρνε τα ντουφέκια τους, τα έσπαζε και τους έλεγε: «Είστε γυναίκες· δεν είστε άνδρες». Ύστερα τους άφηνε ελεύθερους. Μια φορά ντύθηκε χανούμισσα, πήγε στο λημέρι τους και ζήτησε τον καπετάνιο. Προηγουμένως είχε συνεννοηθή με τα παλληκάρια του, να επιτεθούν αμέσως μετά το σύνθημα που θα τους έδινε. Όταν οι Τσέτες τον πήγαν στον καπετάνιο, του είπε: «Διώξε τους άνδρες σου, για να μείνουμε μόνοι μας». Μόλις έμειναν οι δυο τους, του άρπαξε το ντουφέκι, το έσπασε και του είπε: «Τώρα εσύ είσαι γυναίκα· εγώ είμαι ο Εζνεπίδης[129]». Έδωσε τότε το σύνθημα, όρμησαν τα παλληκάρια του και έδιωξαν τους Τσέτες από το χωριό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να κάνη κανείς προκοπή, πρέπει να έχη παλαβή φλέβα, με την καλή έννοια. Ανάλογα πώς θα αξιοποιήση την παλαβή φλέβα, θα γίνη ή άγιος ή ήρωας. Αν όμως δεν βοηθηθή και παρασυρθή, μπορεί να γίνη εγκληματίας. Ένας που δεν έχει παλαβή φλέβα δεν μπορεί να γίνη ούτε άγιος ούτε ήρωας. Γι᾿ αυτό χρειάζεται να πάρη μπρός μέσα μας η μηχανή, να δουλέψη η καρδιά, η παλληκαριά. Η καρδιά πρέπει να παλαβώση. Γνωρίζω πολλούς στρατιωτικούς που αποστρατεύθηκαν και είναι όλο σκασίλα. Μερικοί θέλουν να γίνη πόλεμος, για να ασχοληθούν – τόσο πολύ! – ενώ άλλος, μόλις τον καλούν για επιστράτευση, τρέμει ή άλλος κάνει τον τρελλό, για να μην υπηρετήση. Πόσοι απόστρατοι μου λένε ότι θέλουν να πάνε επάνω στην Βοσνία να πολεμήσουν. Δεν έχουν αξιοποιήσει την παλληκαριά τους στην πνευματική ζωή, γι' αυτό, όταν ακούν για πόλεμο, χαίρονται να πάνε να πολεμήσουν. Αυτοί που έχουν τόση δύναμη, αν είχαν γνωρίσει την πνευματική ζωή, ξέρεις τί άσκηση, τί αγώνες θα έκαναν; Άγιοι θα ήταν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί παλληκαριά υπήρχε παλιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια φορά μας είχατε πει κάτι για την γιαγιά σας...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η γιαγιά μου είχε πολλή παλληκαριά. Είχε πάντοτε μαζί της για ασφάλεια ένα γιαταγάνι! Βλέπεις, χήρα γυναίκα ήταν, με δυο παιδιά, πώς να τα βγάλη πέρα με τους Τούρκους! Δύσκολα χρόνια!... Την φοβόνταν όλοι. Παλληκάρι! Μια φορά ένας κλέφτης είχε πάει να κλέψη σε ένα αμπέλι που ήταν κοντά στα μνήματα. Για να τον φοβηθούν, φόρεσε ένα πουκάμισο άσπρο μέχρι κάτω. Ύστερα μπήκε στα μνήματα, έτσι όπως ήταν με το άσπρο πουκάμισο, και γύριζε εκεί μέσα. Τότε έτυχε να περάση από τα μνήματα η γιαγιά μου. Ο κλέφτης, μόλις την είδε, ξάπλωσε κάτω και έκανε τον πεθαμένο, για να την φοβερίση, να νομίση ότι είναι βρυκόλακας. Εκείνη όμως τον πλησίασε και του είπε: «Εσένα, αν ήσουν καλός άνθρωπος, θα σε είχε λειώσει το χώμα»! Γυρίζει μετά το γιαταγάνι από την ανάποδη και αρχίζει να τον δέρνη. Τον είχε σακατέψει. Ούτε ήξερε ποιός ήταν. Ύστερα άκουσε στο χωριό ότι ο τάδε είναι σακατεμένος και έτσι έμαθε ποιός ήταν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην εποχή μας σπανίζουν τα παλληκάρια. Οι άνθρωποι είναι νερόβραστοι. Γι᾿ αυτό, Θεός φυλάξοι, αν γίνη ένας πόλεμος, άλλοι από φόβο θα πεθάνουν, άλλοι θα μείνουν στον δρόμο από μια μικρή ταλαιπωρία, γιατί συνήθισαν στην καλοπέραση. Παλιά, τί παλληκαριά είχαν! Στην Μονή Φλαβιανών, στην Μικρά Ασία, είχαν πιάσει οι Τούρκοι έναν άνδρα και τον έσφαξαν. Μετά είπαν στην γυναίκα του: «Ή θα αρνηθής τον Χριστό ή θα σφάξουμε και τα παιδιά σου». «Τον άνδρα μου, τους λέει εκείνη, τον πήρε ο Χριστός, τα παιδιά μου τα εμπιστεύομαι στον Χριστό και εγώ τον Χριστό δεν Τον αρνούμαι». Τί παλληκαριά! Όταν δεν υπάρχη στον άνθρωπο ο Χριστός, πώς να υπάρχη αυτή η παλληκαριά; Σήμερα οι άνθρωποι χωρίς Χριστό χτίζουν την ζωή τους στα μπάζα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εκείνα τα χρόνια ήταν και οι μητέρες παλληκάρια και τα παιδιά παλληκάρια. Στην Κόνιτσα, θυμάμαι, μια γειτόνισσα που ήταν σε ενδιαφέρουσα πήγε μόνη της μιάμιση ώρα μακριά από την πόλη στο χωράφι και τσάπιζε καλαμπόκια. Εκεί γέννησε το παιδάκι, το πήρε στην ποδιά της και γύρισε στο χωριό. «Έχω και μωράκι», μας είπε περνώντας από την πόρτα μας. Ήταν και Κατοχή, δύσκολα χρόνια. Τώρα υπάρχουν γυναίκες που από φόβο κάθονται έξι–επτά μήνες ξαπλωμένες, για να γεννήσουν ένα παιδί. Άλλο εκείνες που έχουν λόγους υγείας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο φυσικός φόβος είναι φρένο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, φοβάμαι πολύ και σκέφτομαι σε μια δύσκολη περίσταση τί θα κάνω. Που οφείλεται ο φόβος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί κανείς και από μικρός να έχη πάθει κάτι και γι' αυτό να φοβάται. Πολλές φορές μπορεί να είναι και φυσικός ο φόβος, αλλά μπορεί να είναι και από έλλειψη πίστεως, από έλλειψη εμπιστοσύνης στον Θεό. Ο φόβος  όμως είναι και φρένο, γιατί βοηθάει να καταφύγη ο άνθρωπος στον Θεό. Φοβάται ο άνθρωπος και ζητάει από κάπου να πιασθή και αναγκάζεται να πιασθή από τον Θεό. Βλέπεις, στα θερμά μέρη που είναι άγριοι άνθρωποι, εκεί υπάρχουν τα άγρια ζώα, τα μεγάλα θηρία, οι βόες κ.λπ., για να αναγκασθούν οι άνθρωποι να ζητήσουν βοήθεια από τον Θεό, να καταφύγουν στον Θεό, και να βρουν τον προσανατολισμό τους. Αλλιώς, τί μπορούσε να τους φρενάρη αυτούς τους ανθρώπους; Όλα όσα έχει κάνει ο Θεός έχουν κάποιο νόημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτοί που δεν γνωρίζουν τον αληθινό Θεό και από φόβο ζητούν βοήθεια, δέχονται βοήθεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, σηκώνουν το κεφάλι τους προς τα πάνω, και αυτό κάτι είναι. Και για τα μικρά παιδιά είναι φρένο ο φόβος. Μερικά παιδιά, αν δεν τα φοβερίσης και λίγο, δεν ακούν κανέναν, ούτε την μάνα ούτε τον πατέρα. Και εμένα, όταν ήμουν μικρός, μου έλεγαν «ο μπούμπουλος». Ο μικρός στην ηλικία είναι φυσικό να φοβάται. Αλλά όσο μεγαλώνει το παιδάκι, ωριμάζει το μυαλό και υποχωρεί ο φόβος. Ο φυσικός φόβος βοηθάει μόνο στην παιδική ηλικία. Όταν μεγαλώση ο άνθρωπος και φοβάται από το τίποτε, τότε είναι να τον λυπάσαι! Έρχονται πνευματικοί άνθρωποι στο Καλύβι και μου λένε «νά, πέθανε κάποιος δίπλα μας και από τότε φοβόμαστε συνέχεια», και με παρακαλούν να κάνω προσευχή να τους φύγη ο φόβος. «Εδώ άλλοι προσπαθούν να έχουν μνήμη θανάτου, τους λέω, και εσύ, πέθανε ο άλλος δίπλα σου, και θέλεις να διώξης τον φόβο!».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φυσικός φόβος υπάρχει λίγο παραπάνω και στις γυναίκες. Λίγες είναι οι γυναίκες που δεν φοβούνται. Αυτές όμως μπορεί να δημιουργήσουν και προβλήματα στην οικογένεια, γιατί δεν υποτάσσονται. Όπως και ένας που δεν είναι εκ φύσεως δειλός και έχει μια παλληκαριά μπορεί να γίνη αναιδής. Είναι και μερικές γυναίκες που φοβούνται πάρα πολύ. Όταν μία γυναίκα έχη φυσική φοβία και αγωνισθή και αποκτήση ανδρισμό, είναι μεγάλο πράγμα. Η γυναίκα, επειδή έχει θυσία στην φύση της, έχει και πολλή αυταπάρνηση, την οποία δεν έχει ο άνδρας, παρ' όλο τον ανδρισμό που έχει εκ φύσεως.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος δεν φοβάται τον θάνατο, τον φοβάται ο θάνατος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς φεύγει ο φόβος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την παλληκαριά. Όσο φοβάται κανείς, τόσο πιο πολύ έρχεται ο πειρασμός. Αυτός που έχει δειλία πρέπει να προσπαθήση να την διώξη. Εγώ, όταν ήμουν μικρός, φοβόμουν να περάσω στην Κόνιτσα έξω από το κοιμητήρι. Γι' αυτό κοιμήθηκα τρία βράδυα στο κοιμητήρι και έφυγε ο φόβος. Έκανα τον σταυρό μου και έμπαινα μέσα – ούτε φακό άναβα, μην πάθη κανείς καμμιά λαχτάρα. Αν δεν αγωνισθή κανείς να ανδρωθή και αν δεν αποκτήση την πραγματική αγάπη, σε μια δύσκολη περίσταση θα τον κλαίνε και οι κουκουβάγιες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί δηλαδή, Γέροντα, να ασκηθή κανείς, ώστε να μη φοβάται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να χαίρεται να πεθάνη αυτός, για να μην πεθάνουν άλλοι. Αν τοποθετηθή έτσι, τότε δεν θα φοβάται τίποτε. Από την πολλή καλωσύνη, την αγάπη, την αυτοθυσία, γεννιέται η παλληκαριά. Αλλά σήμερα οι άνθρωποι δεν θέλουν να ακούν για θάνατο. Έμαθα ότι αυτοί που ασχολούνται με τις κηδείες κ.λπ. δεν γράφουν τώρα «Γραφείο κηδειών» αλλά «Γραφείο τελετών», για να μη θυμούνται οι άνθρωποι τον θάνατο. Αν όμως δεν θυμούνται τον θάνατο, ζουν έξω από την πραγματικότητα. Αυτοί που φοβούνται τον θάνατο και αγαπούν την μάταιη ζωή, φοβούνται ακόμη και τα μικρόβια και βρίσκονται συνέχεια νικημένοι από την δειλία, που τους κρατάει πάντα στην πνευματική νέκρα. Οι τολμηροί άνθρωποι ποτέ δεν φοβούνται τον θάνατο, γι' αυτό και αγωνίζονται με φιλότιμο και αυταπάρνηση. Επειδή βάζουν μπροστά τους τον θάνατο και τον σκέφτονται καθημερινά, ετοιμάζονται πιο πνευματικά και αγωνίζονται τολμηρότερα. Έτσι νικούν την ματαιότητα και ζουν από εδώ στην αιωνιότητα με την παραδεισένια χαρά.  Και στον πόλεμο, όποιος αγωνίζεται για τα ιδανικά του, την πίστη και την πατρίδα, να κάνη τον σταυρό του και να μη φοβάται· βοηθάει ο Θεός. Αν κάνη τον σταυρό του και αφήση την ζωή του στα χέρια του Θεού, Εκείνος θα κρίνη μετά αν πρέπη να ζήση ή να πεθάνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να μη φοβάται κανείς από απερισκεψία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό είναι πολύ χειρότερο, γιατί σε κάποιον κίνδυνο θα πάθη ένα τράνταγμα και θα τα πληρώση όλα μια και καλή. Ενώ ένας που φοβάται και λίγο, προσέχει και δεν εκτίθεται απερίσκεπτα στους κινδύνους. Να είναι κανείς «βιαστής», αλλά να έχη εμπιστοσύνη στον Θεό, όχι στον εαυτό του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το θάρρος είναι μεγάλη υπόθεση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σε μια αναμπουμπούλα μεγαλύτερη ζημιά γίνεται από τον πανικό που δημιουργείται. Σε έναν κίνδυνο το κυριώτερο από όλα είναι να μην τα χάνη κανείς. Βλέπεις, η κλώσσα τα βάζει με τον αετό και ορμάει επάνω του! Και η γάτα πώς τα βάζει με τον σκύλο, για να σώση τα γατάκια! Σηκώνει την ουρά της ψηλά σαν κυπαρίσσι και αρχίζει να κάνη «κίχ!...». Τα παίζει όλα κορώνα–γράμματα, και ο άνθρωπος να δειλιάζη!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να μην πανικοβάλλεσθε. Ιδίως οι γυναίκες εύκολα πανικοβάλλονται. Στην Κατοχή, θυμάμαι, έπρεπε κάποτε να πάμε σε ένα μέρος δυο ώρες έξω από την Κόνιτσα. Τα παιδιά προχώρησαν μπροστά, βρήκαν κράνη και ρούχα στρατιωτικά από Έλληνες στρατιώτες, τα φόρεσαν και πήγαν σε ένα εξωκλήσι του Αγίου Κωνσταντίνου. Είχα πάει και εγώ εκεί να προσκυνήσω. Δεκαεπτά χρονών ήμουν. Μόλις τα είδαν οι μανάδες από μακριά, άρχισαν να φωνάζουν «ήρθαν οι Ιταλοί!» και γύρισαν να φύγουν. Δεν ρίχνουν μια ματιά να δούν τί είναι. Κράνη ελληνικά φορούσαν τα παιδιά, και αυτές τα νόμισαν για Ιταλούς και έφευγαν φοβισμένες οι μανάδες από τα παιδιά τους!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το θάρρος είναι μεγάλη υπόθεση. Αν πής σε έναν υγιή που είναι φοβητσιάρης «κίτρινος είσαι· τί έχεις;», θα πάη στον γιατρό, ενώ μπορεί να ήταν κίτρινος, γιατί είχε ξαγρυπνήσει ή του πονούσε το δόντι κ.λπ. Ο Έλληνας ή θα τραβήξη μπροστά ή θα πανικοβληθή! Οι δειλοί είναι άχρηστο πράγμα. Στον πόλεμο τους δειλούς δεν τους θέλουν καθόλου· δεν τους έχουν εμπιστοσύνη. Δεν τους παίρνουν σε επίθεση στην πρώτη γραμμή, για να μη δημιουργήσουν προβλήματα. Ένας δειλός στρατιώτης, αν δεν ξέρη το στρατηγικό σχέδιο, μπορεί να δημιουργήση τέτοιο πανικό, που να διαλύση ολόκληρη μεραρχία. Ο φόβος μεγαλώνει και την φαντασία του και μπορεί να αρχίση να φωνάζη «νά, έρχονται, έφθασαν, σφάζουν, φύγετε! ώ, που θα πάμε, τόσο στρατό έχουν οι εχθροί! θα μας φάνε!», οπότε θα κάνη πολλή ζημιά, γιατί εύκολα επηρεάζονται και οι άλλοι. Ένας όμως που έχει παλληκαριά, αν δη τους εχθρούς, θα πη «μυρμήγκια είναι αυτά· δεν είναι άνθρωποι!» και τρέχουν με θάρρος και οι άλλοι! Γι᾿ αυτό στον στρατό λένε καλύτερα πέντε γενναίοι να αντιμετωπίσουν μια κατάσταση με ψυχραιμία παρά είκοσι δειλοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σε ένα σύνολο σε μια δύσκολη κατάσταση δεν είναι τόσο οι εξωτερικοί κίνδυνοι, όσο οι εσωτερικοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, έτσι είναι. Και το Σούλι δεν θα μπορούσαν οι Τούρκοι να το πάρουν, αν δεν το πρόδιδε ο Πήλιος Γούσης, που ήταν μέσα από το Σούλι. Από ένα κρυφό μονοπάτι τους οδήγησε. Βλέπεις, πέντε χωριουδάκια ήταν μονοιασμένα, ενωμένα, και τα έβαζαν με ολόκληρο Αλή-Πασά, που είχε την δύναμη να τα βάζη με τον Σουλτάνο[130]. Το Σούλι ήταν δίπλα στον Αλή-Πασά και όμως τον έφερναν σβούρα. Και οι γυναίκες πόσο δεμένες ήταν μεταξύ τους και τί παλληκαριά είχαν! Έπαιρναν και αυτές την καραμπίνα!
- type: h2
  initial:
    ru: ''
  text:
    ru: Πειθαρχία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάπου υπάρχη συνήθως απειθαρχία, μπορεί να υπάρξη πειθαρχία σε μια δύσκολη κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν γίνεται λ.χ. πυρκαγιά, δεν κάνει καθένας ό,τι του κατεβαίνει. Περιμένουν όλοι να πάρουν διαταγή. Αυτός που έχει την ευθύνη παρακολουθεί και λέει τί πρέπει να γίνη. Αλλιώς μπορεί να δημιουργήσουν πανικό καί, αντί να σβήσουν την φωτιά, να την δυναμώσουν. Μια φορά επέστρεφα στο Άγιον Όρος. Όταν φθάσαμε μεταξύ της Μονής Βατοπαιδίου και Παντοκράτορος, άρχισε να φυσάη βορειοανατολικός άνεμος και σηκώθηκε φουρτούνα. Ο καραβοκύρης πήγαινε το μοτέρ κόντρα στο κύμα, γιατί διαφορετικά θα βουλιάζαμε. Ένας Ιερισσιώτης φοβητσιάρης, που δεν ήξερε ούτε από καράβι ούτε από θάλασσα – μουλάρια είχε –, έβαλε τις φωνές: «Τί κάνεις, θα μας πνίξης! Δεν βλέπετε; Στην Καβάλα θα μας πάη!». Τότε ξεσηκώθηκαν και άλλοι και έπεσαν επάνω στον καραβοκύρη. «Αφήστε με, έλεγε ο καημένος, ξέρω εγώ την δουλειά μου». Ευτυχώς ένας από τους επιβάτες ήταν ναυτικός και τους καθησύχασε: «Αφήστε τον, ξέρει αυτός. Κόβει το κύμα έτσι που πάει». Αν δεν ήταν εκείνος, θα βούλιαζε το μοτέρ, γιατί οι άλλοι δεν άφηναν τον καραβοκύρη να κάνη την δουλειά του. Βλέπεις, ένας ήταν φοβητσιάρης, δημιούργησε πανικό, ξεσηκώθηκαν όλοι μέσα στο πλοίο και θα το βούλιαζαν. Ύστερα, για τέτοιες περιπτώσεις υπάρχει πάντοτε και ο δεύτερος μηχανικός πού, αν ο πρώτος είναι ζαλισμένος, θα πιάση εκείνος το τιμόνι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι Έλληνες δεν πειθαρχούν εύκολα. Οι Ρωμαιοκαθολικοί πιστεύουν στο αλάθητο του πάπα. Εμείς πιστεύουμε στον λογισμό μας και έχουμε όλοι τό... αλάθητο! Γιατί λένε ότι οι Τούρκοι έχουν καλή πολιτική; Επειδή λίγοι Τούρκοι είναι μυαλωμένοι και οι περισσότεροι κοιμισμένοι· γίνονται λοιπόν αρχηγοί οι λίγοι που είναι μυαλωμένοι και οι άλλοι υπακούουν φυσιολογικά. Οι Έλληνες, επειδή σχεδόν όλοι έχουν πολύ μυαλό, θέλουν όλοι να κυβερνούν, να διατάζουν, και δύσκολα υποτάσσονται. Και οι Ιταλοί έλεγαν: «Στους δέκα Έλληνες οι πέντε θέλουν να κάνουν κουμάντο»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ας υποθέσουμε ότι θέλουμε να πάμε κάπου· μπορεί ένας να ξέρη ένα μονοπάτι που είναι λίγο συντομώτερο, ο άλλος να ξέρη ένα άλλο από την άλλη πλευρά, ο άλλος κάποιο άλλο, και να αρχίση ο ένας να επιμένη «όχι, να πάμε από εδώ, είναι καλύτερα», ο άλλος «όχι, να πάμε από εκεί», και τελικά, αν δεν διατάζη ένας, μπορεί να περάσουν ώρες, μέρες, χωρίς να ξεκινήσουν και να βρίσκωνται στον ίδιο τόπο. Αν όμως διατάζη κάποιος και πη «από ᾿κεί θα πάμε», επειδή ξέρει εκείνον τον δρόμο, έστω  και αν είναι μακρύτερος, θα φθάσουν κάποτε. Αν φυσικά αυτός που διατάζει ξέρη τον συντομώτερο δρόμο, αυτό είναι το καλύτερο. Αλλά, έστω και αν ξέρη τον μακρύτερο, πάλι θα φθάσουν με την διαταγή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός την διάθεση βλέπει και βοηθάει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν τα χρόνια μας ζητήσουν κάτι παραπάνω και δεν έχης πνευματική κατάσταση αλλά μόνο διάθεση, θα  μπορέσης να σταθής;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πώς δεν θα μπορέσης; Ο Θεός την διάθεση του ανθρώπου βλέπει και βοηθάει. Ύστερα, συχνά, σε δύσκολες στιγμές, και άνθρωποι που δεν φαίνονται για παλληκάρια, δείχνουν μεγάλη παλληκαριά. Νά, θυμάμαι, στον στρατό ήταν ένας υπολοχαγός που ποτέ δεν είχε δείξει ούτε θυσία ούτε παλληκαριά. Μια φορά που κινδυνεύαμε να μας πιάσουν οι αντάρτες, είχε σταθή σε ένα εξωκλήσι και με ένα αυτόματο τους καθήλωσε, μέχρι να οπισθοχωρήσουμε, και σωθήκαμε. Στάθηκε εκεί και έρριχνε με το πολυβόλο, πάνω–κάτω, αριστερά–δεξιά, και δεν τους άφηνε να περάσουν. Στο τέλος έφυγε, για να μην τον δούμε. Και ύστερα, ούτε καν είπε «εγώ τους καθυστέρησα και μπορέσατε να σωθήτε...», για να καμαρώση κ.λπ. Λέγαμε όλοι «ένα αυτόματο μας έσωσε», έλεγε και αυτός: «Ένα αυτόματο μας έσωσε». Αφού όλοι έλεγαν έτσι, έλεγε και αυτός τα ίδια. Και τελικά είδαμε ότι ο τάδε ήταν στην μονάδα, ο τάδε ήταν, εκείνος μόνον απουσίαζε και εξακριβώσαμε ότι αυτός ήταν. Αν τον έπιαναν οι αντάρτες, ξέρεις τί θα τραβούσε; Θα έβγαζαν όλο το άχτι τους επάνω του· δεν θα του το χάριζαν. Σού λέει: «Εσύ μας έκανες τόση ζημιά· έλα εδώ, να σού βγάλουμε τα νύχια με την πένσα». Κοσμικός άνθρωπος και να κάνη τέτοια θυσία! Θυσιάσθηκε, γιατί αυτός κινδύνευσε περισσότερο από όλους μας. Εσείς βάζετε τον εαυτό σας σε τέτοια θυσία; Εκείνος ούτε Πατερικά διάβαζε ούτε από πνευματικά ήξερε... Τον γνώριζα, είχε μια απλότητα, μια τιμιότητα. Και ήταν άλλοι που έβρισκαν κανέναν σκοτωμένο αντάρτη, του έκοβαν το κεφάλι και το γύριζαν στο χωριό και έκαναν τον παλληκαρά! Γι'' αυτό δεν φθάνει να έχη κανείς μόνον παλληκαριά, πρέπει να έχη και το πνεύμα της θυσίας, για να έχη αντίκρισμα η παλληκαριά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αντιμετωπίζουμε πνευματικά τους κινδύνους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στις κρίσιμες στιγμές χρειάζεται πάντα ετοιμότητα και παλληκαριά. Στην Κατοχή οι Ιταλοί έπαιρναν πέντε-έξι ζώα και έρχονταν στο χωράφι μας και τα φόρτωναν πεπόνια. Μια φορά τους λέω: «Αυτά τα πεπόνια τα έχουμε κρατήσει για σπόρο· εκείνα πάρτε τα». Σηκώνει τον βούρδουλα ο Ιταλός και μου λέει: «Το βλέπεις αυτό;». Έπιασα και εγώ τον βούρδουλα και τον κοίταζα... «Μπόνε!», του λέω. Δηλαδή «καλός!». Τάχα ότι μου το έδειξε να του πω αν είναι όμορφος! Έσπασε ο θυμός του· γέλασε και έφυγε! Θυμάμαι και ένα περιστατικό τότε με τον ανταρτοπόλεμο. Πήγαν μια φορά δύο στρατιώτες σε ένα μποστάνι να ζητήσουν από τον νοικοκύρη να φάνε κανένα πεπόνι, καμμιά ντομάτα. Άφησαν τα ντουφέκια τους στην άκρη και προχώρησαν. Ο νοικοκύρης, μόλις τους είδε από μακριά, πήρε το ντουφέκι να τους χτυπήση. Αρπάζει τότε ο ένας στρατιώτης μια ντομάτα κόκκινη και φωνάζει: «Άσ́ το το όπλο, γιατί θα σού την φυσήξω την χειροβομβίδα!». Αφήνει εκείνος το όπλο και σηκώνεται και φεύγει!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί ετοιμότητα και παλληκαριά!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ένας άλλος στρατιώτης είχε κρεμάσει την κάπα του κάπου μακριά σε μια γκορτσιά[131]. Σε λίγο κατέβηκε ένας αντάρτης από το βουνό και θα τον έπιανε. «Αρχηγέ, τί να τον κάνω αυτόν;», φώναξε εκείνος γυρίζοντας προς την κάπα. Και ύστερα, σαν να του έκανε νόημα ο αρχηγός, είπε στον αντάρτη: «Φέρε το ντουφέκι εδώ!». Του το άρπαξε και τον αφόπλισε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αρχηγός, Γέροντα, ήταν η κάπα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, η κάπα! Βλέπεις, ένας ήταν, μόνον την κάπα είχε, και τον άλλον τον αφόπλισε! Με αυτόν τον τρόπο είχε μαζέψει ένα σωρό ντουφέκια από τους αντάρτες. Θέλει παλληκαριά! Θυμάμαι και έναν Ρώσο μοναχό στο Άγιον Όρος· όταν πήγαν να τον ληστέψουν οι κλέφτες, την στιγμή που ανέβαιναν στον τοίχο, βγήκε από πάνω και φώναξε: «Τί θέλετε, με το εξάσφαιρο ή με το δωδεκάσφαιρο να σάς χτυπήσω;». Το έβαλαν εκείνοι στα πόδια. Ένας άλλος, όταν πήγαν κλέφτες στο Κελλί του, πήρε το τηγάνι και έκανε πώς τηλεφωνούσε: «Ναί, κλέφτες ήρθαν κ.λπ.!». Νόμιζαν ότι ειδοποιεί και έφυγαν. Κάποτε πάλι ένας πολύ εύσωμος, σαν γίγαντας, άρπαξε έναν τσομπάνο από τον λαιμό, για να τον πνίξη. Ο τσομπάνος, ο καημένος, τέντωσε τα μάτια του από τον φόβο, οπότε του λέει εκείνος: «Τί με κοιτάς άγρια;». «Σκέφτομαι σε ποιά κορυφή να σε πετάξω», του λέει ο τσομπάνος. Ο άλλος φοβήθηκε και τον άφησε!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό λέω να μην τα χάνη κανείς. Να κρατάη την ψυχραιμία του και να δουλεύη το μυαλό. Γιατί, αν δεν δουλεύη το μυαλό, και μόνον από χαζομάρα μπορεί ακόμη και να προδώση. Οτιδήποτε συμβαίνει, πρέπει να προσευχηθή, να σκεφθή και να ενεργήση. Το καλύτερο είναι να προσπαθή με πνευματικό τρόπο να αντιμετωπίζη μια δύσκολη κατάσταση. Σήμερα όμως λείπουν και οι δυο παλληκαριές· ούτε πνευματική παλληκαριά υπάρχει, η οποία γεννιέται από την αγιότητα και την παρρησία στον Θεό, για να αντιμετωπισθή μια δυσκολία με πνευματικό τρόπο, ούτε φυσική παλληκαριά υπάρχει, ώστε να μη δειλιάση κανείς σε έναν κίνδυνο. Πρέπει να έχη κανείς πολλή αγιότητα, για να φρενάρη ένα μεγάλο κακό, αλλιώς που να στηριχθή; Μια ψυχή σε ένα μοναστήρι αν έχη πνευματική παλληκαριά, να δής, τον άλλον που έρχεται με κακό σκοπό θα τον καθηλώνη με το ένα πόδι μέσα από την μάνδρα και με το άλλο απ᾿ έξω[132]! Θα τον χτυπάη στο κεφάλι με πνευματικό τρόπο, με το κομποσχοίνι, με την ευχή, και όχι με το πιστόλι. Λίγη προσευχή θα κάνη, και ο άλλος θα μένη εκεί έξω ακίνητος! Θα μένη γιά... σκοπός! Μια ψυχή, αν έχη πνευματική κατάσταση, και το κακό θα φρενάρη και τον κόσμο θα βοηθήση, και για το μοναστήρι θα είναι ασφάλεια. Οι Μυροφόρες δεν υπολόγισαν τίποτε, γιατί είχαν πνευματική κατάσταση και εμπιστεύθηκαν στον Χριστό. Αν δεν είχαν πνευματική κατάσταση, που θα εμπιστεύονταν, για να κάνουν αυτό που έκαναν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην πνευματική ζωή και ο πιο δειλός μπορεί να αποκτήση πολύ ανδρισμό, αν εμπιστευθή τον εαυτό του στον Χριστό, στην θεία βοήθεια. Μπορεί να πάη στην πρώτη γραμμή να πολεμήση και να νικήση. Ενώ οι καημένοι οι άνθρωποι που θέλουν να κάνουν το κακό, και παλληκαριά να έχουν, φοβούνται, διότι αισθάνονται την ενοχή τους και μόνο στην βαρβαρότητά τους στηρίζονται. Ο άνθρωπος του Θεού έχει θεϊκές δυνάμεις, έχει και το δίκαιο με το μέρος του. Βλέπεις, ένα κουταβάκι κάνει «γάβ-γάβ» και φεύγει ο λύκος, γιατί αισθάνεται ενοχή. Οικονόμησε ο Θεός και ο λύκος να φοβάται από ένα κουταβάκι, γιατί αυτό έχει δικαιώματα στο σπίτι του νοικοκύρη του, – πόσο μάλλον ο άνθρωπος που πάει να κάνη κακό μπροστά στον άνθρωπο που έχει Χριστό μέσα! Γι' αυτό μόνον τον Θεό να φοβώμαστε, όχι τους ανθρώπους, όσο κακοί και να είναι. Ο φόβος του Θεού και τον πιο δειλό τον κάνει παλληκάρι. Όσο ενώνεται κανείς με τον Θεό, τόσο δεν φοβάται τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός θα βοηθήση στις δυσκολίες. Αλλά για να δώση ο Θεός την θεϊκή δύναμη, πρέπει και ο άνθρωπος να δώση αυτό το λίγο που μπορεί.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Το μαρτύριο για τον πιστό είναι πανηγύρι
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρέπει να πέσουν μερικοί, για να σωθή η κατάσταση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δύσκολα χρόνια!... Θα περάσουμε τράνταγμα. Ξέρετε τί θα πη τράνταγμα; Αν δεν έχετε λίγη κατάσταση πνευματική, δεν θα αντέξετε. Θεός φυλάξοι, θα φθάσουμε να έχουμε ακόμη και άρνηση πίστεως. Κοιτάξτε να αδελφωθήτε, να ζήσετε πνευματικά, να γαντζωθήτε στον Χριστό. Αν γαντζωθήτε στον Χριστό, δεν θα φοβάστε ούτε διαβόλους ούτε μαρτύρια. Οι άνθρωποι στον κόσμο έχουν από πολλές πλευρές στριμώγματα, φόβους. Αλλά, όταν κανείς είναι κοντά στον Χριστό, τί να φοβηθή; Θυμάστε τον Άγιο Κήρυκο[133]; Τριών χρονών ήταν καί, όταν πήγε να τόν... κατηχήση ο τύραννος, του έδωσε μια κλωτσιά. Διαβάστε Συναξάρια. Τα Συναξάρια πολύ βοηθούν, γιατί συνδέεται κανείς με τους Αγίους και φουντώνει μέσα του η ευλάβεια και η διάθεση για θυσία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αυτή η ζωή δεν είναι για βόλεμα. Θα πεθάνουμε που θα πεθάνουμε, τουλάχιστον να πεθάνουμε σωστά! Μια που δεν κάνουμε τίποτε άλλο, αν μας αξιώση ο Θεός για ένα μαρτύριο, καλά δεν θα είναι; Μια μέρα ήρθε στο Καλύβι ένας βουρδουνάρης[134]με κλάματα και μου είπε: «Μη μείνης μόνος σου απόψε. Σκέφτονται να σε σκοτώσουν». «Ποιοί;», του λέω. «Είναι πέντε-έξι», μου λέει. Συνόδευε πέντε-έξι αθέους. Ποιός ξέρει τί προγράμματα είχαν για το Άγιον Όρος. Τον πέρασαν για χαζούλη και μιλούσαν μπροστά του. Μόλις τ᾿ άκουσε εκείνος, ήρθε και μου το είπε. Το βράδυ, όταν ξάπλωσα, άκουσα κουδουνάκι από σκυλί. Κοιτάω από το παράθυρο και βλέπω τρία παλληκάρια. «Άνοιξε, ρέ Παππού», φωνάζουν. «Έ, παλληκάρια, τί θέλετε τέτοια ώρα και γυρίζετε; Δεν έχετε μυαλό; Θα σάς πάρουν για ύποπτους, τους λέω. Τους άλλους τους έβαλαν φυλακή. Όρεξη για κουβέντες δεν έχω». «Να ᾿ρθούμε αύριο; τί ώρα;». «Εσείς ελάτε αύριο ό,τι ώρα θέλετε κι εγώ, αν μπορώ, θα σάς δώ». Τους έδιωξα. Βλέπω ότι το φως του φακού δεν συνέχισε. Είχαν σταματήσει πιο πάνω. Σηκώθηκα, ντύθηκα, έβαλα το σχήμα μου και τους περίμενα· είχα μια ειρήνη μέσα μου! Την άλλη μέρα ήρθαν τρεις τριάδες, αλλά δεν ήταν κανείς από εκείνους. Φυσικά σε μένα ξέρουν ότι χρήματα δεν θα βρουν να πάρουν, γιατί δεν έχω. Μόνο για πνευματικά θέματα τα βάζουν μαζί μου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια άλλη φορά ήρθε ένας στο Καλύβι που ήταν σωματώδης σαν γορίλλας και κάθησε σε μια άκρη. Εκείνη την ώρα έλεγα σε μια παρέα: «Βρέ, μόνο για παρελάσεις είστε, όχι για μάχες. Θυσιάσθηκε ο Χριστός. Έχουμε Ορθοδοξία. Μαρτύρησαν Άγιοι που μας βοηθούν ακόμη. Αν δεν είχαν πέσει αυτοί, ποιός ξέρει τί θα ήμασταν». Όλα αυτά τον είχαν εξοργίσει. Ερχόταν, έφευγε ο κόσμος, αυτός καθόταν εκεί· είχε τον σκοπό του. Ήταν ένα κρύο πράγμα. Τελικά έφυγαν και οι τελευταίοι. «Νύχτωσε, του λέω, άντε, που θα πάς;». «Δεν με απασχολεί το θέμα», μου λέει. «Με απασχολεί εμένα, του λέω, άντε να πάς». Ορμάει τότε επάνω μου και με αρπάζει από τον λαιμό. «Έ, βρέ σύ, με τους θεούς σου», μου λέει. Όταν άκουσα να μου λέη «τούς θεούς σου», ένιωσα σαν να έβρισε τον Θεό. Τί, ειδωλολάτρης είμαι εγώ; «Ποιούς θεούς, βρέ αθεόφοβε; του λέω. Εγώ έναν Τριαδικό Θεό λατρεύω. Άντε φύγε από ᾿δώ!» Του έδωσα μια σπρωξιά, σωριάστηκε κάτω και μαζεύτηκε κουβάρι. Πώς βγήκε έξω από την πόρτα και εγώ δεν κατάλαβα. «Αν με κρεμάσουν ανάποδα, σκέφθηκα, για να με βασανίσουν, θα πάη η κήλη[135]στην θέση της»! Αυτός είχε καθήσει στο τέλος, γιατί, φαίνεται, ήθελε να με ξεκάνη, αφού μ᾿ άρπαξε από τον λαιμό να με πνίξη.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος αποφασίση τον θάνατο δεν φοβάται τίποτε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα, για να μπορέση ο άνθρωπος να αντιμετωπίση τις δυσκολίες που συναντά, πρέπει να έχη μέσα του τον Χριστό, από τον οποίο θα παίρνη θεία παρηγοριά, για να έχη κάποια αυταπάρνηση. Αλλιώς σε μια δύσκολη στιγμή τί θα γίνη; Διάβασα κάπου ότι ο Αβδούλ-Πασάς[136]είχε πάρει πεντακόσιους νέους από το Άγιον Όρος. Άλλοι από αυτούς ήταν δόκιμοι και άλλοι είχαν πάει εκεί, για να κρυφτούν. Τότε φαίνεται με την Επανάσταση κατέφευγαν στο Άγιον Όρος, για να γλυτώσουν, επειδή οι Τούρκοι μάζευαν νέα παιδιά, να τα κάνουν Γενίτσαρους. Ο Αβδούλ-Πασάς τους νέους που έπαιρνε, αν δεν αρνιόνταν τον Χριστό, τους κρεμούσε στον Πύργο, στην Ουρανούπολη. Από τόσους που πήρε από το Άγιον Όρος μόνον πέντε μαρτύρησαν, ενώ οι άλλοι αρνήθηκαν τον Χριστό και έγιναν Γενίτσαροι. Χρειάζεται παλληκαριά· δεν είναι παίξε-γέλασε. Αν έχη κανείς κακομοιριά, φιλαυτία, δεν έχει θεϊκή δύναμη μέσα του, και τότε πώς να αντιμετωπίση μια τέτοια δυσκολία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου έκανε εντύπωση αυτό που μου είπε ένας επίσκοπος από το Πατριαρχείο. Του είχα πεί: «Μά τί κατάσταση είναι αυτή; Από την μια ο Οικουμενισμός, από την άλλη ο Σιωνισμός, ο σατανισμός!... Σε λίγο θα προσκυνούμε τον διάβολο με τα δυο κέρατα αντί για τον δικέφαλο αετό». «Σήμερα, μου λέει, δύσκολα βρίσκεις επισκόπους σαν τον επίσκοπο Καισαρείας Παΐσιο τον Β´[137]». Ο Παΐσιος ο Β´ τί έκανε; Πήγαινε στον Σουλτάνο για τα αιτήματά του με ένα σχοινί δεμένο στην μέση, αποφασισμένος δηλαδή να τον κρεμάσουν οι Τούρκοι. Σαν να έλεγε στον Σουλτάνο: «Μήν ψάχνης σχοινί και χασομεράς· άμα θέλης να με κρεμάσης, έτοιμο το έχω το σχοινί». Για τα δύσκολα θέματα αυτόν έστελναν στον Σουλτάνο. Πολλές φορές γλύτωσε το Πατριαρχείο σε δύσκολες περιστάσεις. Στα γεράματά του τον έβαζαν επάνω σε ένα άλογο, μέσα σε ένα κοφίνι, έβαζαν και ένα άλλο κοφίνι με βάρος από την άλλη μεριά και τον πήγαιναν στην Πόλη. Μια φορά οι Τούρκοι είχαν βγάλει ένα φιρμάνι να επιστρατεύωνται οι Έλληνες στον τουρκικό στρατό. Οι Χριστιανοί δυσκολεύονταν να υπηρετούν μαζί με τους Τούρκους, γιατί δεν μπορούσαν να εκτελούν τα θρησκευτικά τους καθήκοντα. Οι Ρώσοι εν τω μεταξύ είχαν πει τότε στους Τούρκους να μην εμποδίζουν τους Έλληνες να τηρούν τα χριστιανικά τους καθήκοντα. Κάλεσε ο Πατριάρχης τον Παΐσιο και τον έστειλε στον Σουλτάνο. Παρουσιάσθηκε τότε εκείνος στον Σουλτάνο πάλι με ένα σχοινί δεμένο στην μέση. Του λέει ο Σουλτάνος: «Οι Έλληνες πρέπει να επιστρατεύωνται, για να υπηρετούν την πατρίδα». Τότε ο Παΐσιος του λέει: «Ναί, κι εγώ συμφωνώ να επιστρατεύωνται οι Έλληνες, γιατί αυτά τα μέρη είναι από παλιά των γκιαούρηδων. Επειδή όμως έχουμε διαφορετική θρησκεία, πρέπει να έχουν ξεχωριστό στρατόπεδο, να είναι χωριστός στρατός και να έχουν δικούς τους αξιωματικούς κ.λπ., για να εκτελούν και τα θρησκευτικά τους καθήκοντα. Δεν μπορούν να κάνουν μαζί μ'' εσάς προσευχή· εσείς να έχετε ραμαζάνι[138]και ''μείς τα Φώτα»! Σκέφθηκε ο Σουλτάνος: «Να οπλισθούν οι Χριστιανοί; Είναι επικίνδυνο». «Όχι, όχι, καλύτερα να μην επιστρατεύωνται», του απαντάει. Μια άλλη φορά οι Αρμένιοι ζήτησαν από τον Σουλτάνο να τους δώση το Μπαλουκλή και κατάφεραν να πάρουν την έγκρισή του. Μετά πήγε ο Παΐσιος στον Σουλτάνο να συζητήση αυτό το θέμα. «Το Μπαλουκλή, του λέει ο Σουλτάνος, είναι περιουσία των παππούδων των Αρμενίων και πρέπει να το πάρουν οι Αρμένιοι». «Ναί, του λέει ο Παΐσιος, πρέπει να το πάρουν, γιατί, όταν γνωρίζουμε ότι ένας τόπος είναι περιουσία των παππούδων μας, πρέπει να τον παίρνουμε. Δώστε μου ένα έγγραφο να υπογράψω και εγώ για το Μπαλουκλή, γιατί ήρθα ως αντιπρόσωπος του Πατριαρχείου». Υπέγραψε και αυτός. Ύστερα βγάζει ένα φλουρί κωνσταντινάτο[139]και λέει: «Να πάρουν λοιπόν οι Αρμένιοι το Μπαλουκλή, αλλά και εμείς πρέπει να πάρουμε την Αγια-Σοφιά, γιατί είναι δική μας· είναι των παππούδων μας και πρέπει να μας την δώσετε», και δείχνει το κωνσταντινάτο φλουρί! Είχε πάρει μαζί του και έναν από τους αξιωματούχους Ρώσους που είχαν έρθει τότε στην Πόλη με ένα καράβι, για να έχη και μάρτυρα. Οπότε ο Σουλτάνος βρέθηκε σε δύσκολη θέση και ανακάλεσε την απόφαση για το Μπαλουκλή. «Όχι, όχι, είναι δικό σας το Μπαλουκλή», του είπε ο Σουλτάνος. Γιατί ή έπρεπε να ανακαλέση την απόφαση για το Μπαλουκλή ή να δώση στους Έλληνες την Αγια-Σοφιά. Βλέπετε πώς τους έφερνε σβούρα; Κι αυτό, γιατί είχε αποφασίσει τον θάνατο. Αν δεν αποφασίση κανείς τον θάνατο, τίποτε δεν γίνεται. Όλα από ᾿κεί ξεκινούν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η άρνηση πίστεως με μαρτύριο εξιλεωνόταν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα οι πιο πολλοί θέλουν να βγάζουν οι άλλοι το φίδι από την τρύπα. Εντάξει, δεν το βγάζουν αυτοί, αλλά τουλάχιστον ας πούν «προσέξτε· μήπως είναι κανένα φίδι εκεί πέρα;», ώστε να προβληματισθή ο άλλος. Όμως ούτε αυτό το κάνουν. Αν ήμασταν εμείς στα χρόνια των Μαρτύρων, με τον ορθολογισμό που έχουμε, θα λέγαμε: «Τον Θεό Τον αρνούμαι απ᾿ έξω – όχι από μέσα μου –, γιατί έτσι θα μου δώσουν την τάδε θέση και θα βοηθάω και κανέναν φτωχό». Τότε λιβάνι να έρριχναν στην φωτιά των ειδώλων, η Εκκλησία δεν τους κοινωνούσε· ήταν μετά «προσκλαίοντες»[140]. Αυτοί που αρνιόνταν τον Χριστό, έπρεπε με μαρτύριο να εξιλεωθούν. Ή, στην εποχή της Εικονομαχίας, τους έλεγαν να κάψουν ή να πετάξουν τις εικόνες, και αυτοί προτιμούσαν να μαρτυρήσουν παρά να τις πετάξουν. Εμείς, αν μας έλεγαν να πετάξουμε μια εικόνα, θα λέγαμε: «Ας την πετάξω αυτή· είναι της Αναγεννήσεως. Θα κάνω αργότερα μια βυζαντινή».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τους Κρυπτοχριστιανούς πώς τους δέχεται η Εκκλησία; Δεν αρνήθηκαν τον Χριστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όπου υπάρχουν πραγματικοί Κρυπτοχριστιανοί, αυτοί δεν εξωμότησαν. Από τα είκοσι επτά χωριά λ.χ. που ανήκαν στην επαρχία των Φαράσων της Καππαδοκίας, όταν τα έκαψαν οι Τούρκοι, μερικοί έφυγαν και πήγαν σε μακρινά μέρη. Εκεί δεν ήξεραν οι άλλοι ότι είναι Χριστιανοί· νόμιζαν ότι είναι Μουσουλμάνοι. Ούτε παρουσιάσθηκε καμμιά περίπτωση να ρωτήσουν κάποιον από αυτούς «είσαι Χριστιανός;», για να πη «ναί, είμαι Χριστιανός» ή «όχι, είμαι Μουσουλμάνος». Αυτοί είναι οι Κρυπτοχριστιανοί. Από την στιγμή όμως που θα πιάσουν έναν και του πούν «μάθαμε ότι είσαι Χριστιανός», αυτός θα πη «ναί, είμαι Χριστιανός», δεν θα πη ότι είναι Μουσουλμάνος. Και στους πρώτους χριστιανικούς χρόνους υπήρχαν Χριστιανοί που βαπτίζονταν κρυφά και οι άλλοι είχαν την εντύπωση ότι δεν ήταν Χριστιανοί. Όταν όμως χρειαζόταν, ομολογούσαν. Ο Άγιος Σεβαστιανός  λ.χ. ήταν στρατηγός, είχε βαπτισθή Χριστιανός και νόμιζαν ότι είναι ειδωλολάτρης, ενώ ήταν Χριστιανός. Κρυφά βοηθούσε πολύ θετικά τους Χριστιανούς. Όταν όμως κατάλαβαν ότι είναι Χριστιανός, ομολόγησε και μαρτύρησε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σε ένα τουρκικό χωριό ήταν πολλοί Κρυπτοχριστιανοί, και ο πρόεδρος ήταν παπάς. Παπα-Γιώργη τον έλεγαν, Χασάν τον φώναζαν. Κάποτε πήγαν και τον ειδοποίησαν ότι στο τάδε μέρος, σε μια κατακόμβη, είναι κρυμμένοι Χριστιανοί. «Θα πάω να δώ, τους είπε· μην ανησυχήτε». Παίρνει τους ανθρώπους του, πηγαίνει και βρίσκει εκεί τους Χριστιανούς όλους μαζεμένους. Προχωράει στην Ωραία Πύλη, ξεκρεμάει το πετραχήλι, το φοράει και τους έκανε και Εσπερινό! Τους είπε μετά «νά λάβετε μέτρα» και στους άλλους είπε: «Δεν ήταν τίποτε· διαδόσεις είναι». Αυτοί δεν είναι εξωμότες. Από την στιγμή όμως που υποψιασθούν κάποιον και του πούν «έ, εσένα σε είδαμε ότι έκανες σταυρό, είσαι Χριστιανός» και πη «όχι, είμαι Μουσουλμάνος», τότε αρνείται.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Μαρτύριο και ταπείνωση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτός που θα αξιωθή να μαρτυρήση, πρέπει να έχη πολλή ταπείνωση και να αγαπάη πολύ τον Χριστό. Αν προχωρήση εγωιστικά στο μαρτύριο, θα τον εγκαταλείψη η Χάρις. Θυμάσθε, ο Σαπρίκιος[141]που έφθασε μέχρι το μαρτύριο και όμως αρνήθηκε τον Χριστό; «Γιατί με φέρατε εδώ;», είπε στους δημίους. «Καλά, δεν είσαι Χριστιανός;», του λένε. «Όχι», απαντά. Και ήταν ιερέας! Μου λέει ο λογισμός ότι πήγαινε να μαρτυρήση εγωιστικά και όχι ταπεινά· δεν πήγαινε στο μαρτύριο για την πίστη του, για την αγάπη του Χριστού, γι' αυτό τον εγκατέλειψε η Χάρις. Γιατί, όταν κινήται κανείς εγωιστικά, δεν δέχεται την Χάρη του Θεού και επόμενο είναι σε μια δυσκολία να αρνηθή τον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλές φορές λέμε ότι σε δύσκολες ώρες ο Θεός θα δώση δύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Θεός θα δώση δύναμη σε έναν ταπεινό άνθρωπο που έχει καθαρή καρδιά, που έχει καλή διάθεση. Αν δη ο Θεός πραγματικά καλή διάθεση, ταπείνωση, θα δώση πολλή δύναμη. Δηλαδή θα εξαρτηθή από την διάθεση του ανθρώπου, για να του δώση δύναμη ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είπατε να έχη ταπείνωση και καλή διάθεση ο άνθρωπος. Μπορεί να έχη υπερηφάνεια και καλή διάθεση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν λέμε ταπείνωση, εννοούμε τουλάχιστον στο θέμα αυτό του μαρτυρίου να έχη ταπείνωση. Μπορεί να έχη υπερηφάνεια, αλλά τότε να ταπεινωθή και να πή: «Θεέ μου, είμαι υπερήφανος· τώρα όμως δώσ᾿ μου λίγη δύναμη να μαρτυρήσω για την αγάπη Σου και να εξοφλήσω τις αμαρτίες μου». Οπότε, αν έχη ταπεινή διάθεση και πηγαίνη στο μαρτύριο με μετάνοια, τότε δίνει πολλή Χάρη ο Θεός. Να μην πάη δηλαδή με υπερήφανη διάθεση, με τον λογισμό ότι θα γίνη μάρτυρας και θα του γράψουν μετά το συναξάρι και ακολουθία, θα του κάνουν εικόνα με φωτοστέφανο. Μου είπε κάποιος: «Κάνε προσευχή, Πάτερ, να φθάσω μέχρι πέμπτου ουρανού». «Καλά, του λέω, ο Απόστολος Παύλος έφθασε στον τρίτο ουρανό[142], εσύ ζητάς να φθάσης στον πέμπτο;». «Γιατί, μου λέει, δεν γράφει να ζητάμε τα «κρείττονα";»[143]. Ακούς εκεί κουβέντα! Πάντως, αν πάη κανείς στο μαρτύριο, για να έχη δόξα στον Παράδεισο, καλύτερα να μη σκεφθή να μαρτυρήση. Ένας γνήσιος, ένας σωστός Χριστιανός, αν ήξερε ότι και στον Παράδεισο που θα πάη θα έχη πάλι βάσανα, θα έχη μαρτύρια, πάλι θα λαχταρούσε να πάη εκεί. Δεν πρέπει να σκεφτώμαστε ότι, αν υποφέρουμε κάτι εδώ στην γή, θα είμαστε καλύτερα εκεί στον Ουρανό. Να μην πάμε έτσι μπακαλίστικα. Εμείς θέλουμε τον Χριστό. Ας υπάρχη μαρτύριο, ας μαρτυρούμε κάθε μέρα, ας μας δέρνουν κάθε μέρα, και δυο και τρεις φορές την ημέρα· δεν μας απασχολεί. Το μόνο που μας απασχολεί είναι να είμαστε με τον Χριστό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, ένας να ζη ράθυμα καί, όταν χρειασθή, να ομολογήση θαρρετά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να το κάνη κανείς αυτό, η καρδιά του πρέπει να έχη μέσα καλωσύνη, θυσία. Γι'' αυτό είπα να καλλιεργηθή η αρχοντιά, το πνεύμα της θυσίας. Ο ένας να θυσιάζεται για τον άλλο. Βλέπεις τον Άγιο Βονιφάτιο και την Αγία Αγλαΐδα[144]; Είχαν την ελεεινή εκείνη ζωή στην Ρώμη, αλλά μόλις κάθονταν να φάνε, ο νούς τους πήγαινε στους φτωχούς. Έτρεχαν να δώσουν πρώτα φαγητό στους φτωχούς και ύστερα έτρωγαν αυτοί. Παρόλο που ήταν κυριευμένοι από πάθη, είχαν καλωσύνη και πονούσαν τους φτωχούς. Είχαν θυσία, γι'' αυτό ο Θεός τους βοήθησε. Και η Αγλαΐδα, αν και ζούσε αμαρτωλή ζωή, αγαπούσε τους αγίους Μάρτυρες και ενδιαφερόταν για τα άγια Λείψανα. Είπε στον Βονιφάτιο να πάη με άλλους υπηρέτες της στην Μικρά Ασία, για να πληρώση και να μαζέψη τα άγια Λείψανα των Μαρτύρων και να τα μεταφέρη στην Ρώμη. Κι εκείνος της είπε χαμογελώντας: «Αν σού φέρουν και το δικό μου λείψανο, θα το δεχθής;». «Μήν αστειεύεσαι μ᾿ αυτά», του λέει εκείνη. Τελικά, όταν έφθασε στην Ταρσό και πήγε στο αμφιθέατρο, για να αγοράση τα άγια Λείψανα, παρακολούθησε τα μαρτύρια των Χριστιανών και αμέσως συγκλονίσθηκε από την καρτερία τους. Έτρεξε, ασπάσθηκε τα δεσμά και τις πληγές τους και τους ζήτησε να προσευχηθούν, για να τον ενισχύση ο Χριστός να ομολογήση δημόσια ότι είναι Χριστιανός. Μαρτύρησε λοιπόν και αυτός στο αμφιθέατρο και οι σύντροφοί του αγόρασαν το Λείψανό του και το μετέφεραν στην Ρώμη, όπου Άγγελος Κυρίου είχε πληροφορήσει την Αγλαΐδα για το γεγονός. Έτσι έγινε εκείνο που χαριτολογώντας είχε προφητεύσει ο Βονιφάτιος, πριν φύγη από την Ρώμη. Ύστερα εκείνη, αφού μοίρασε την περιουσία της, έζησε με άσκηση και πτωχεία ακόμη δεκαπέντε χρόνια και αγίασε[145]. Βλέπετε, δεν είχαν βοηθηθή, γι᾿ αυτό είχαν παρασυρθή στο κακό και είχαν παρεκτραπή. Είχαν όμως πνεύμα θυσίας και ο Θεός δεν τους άφησε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τί λεβεντιά είχαν οι Άγιοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σκέφτομαι ότι, αν έβλεπα τον τροχό της Αγίας Αικατερίνης, θα πέθαινα από τον φόβο μου!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άμα πέθαινες, πριν σε ανεβάσουν στον τροχό, καλά θα ήταν· θα ήταν ευλογία από τον Θεό. Αλλά αν τυχόν ανέβαινες εκεί και δυσκολευόσουν, εκείνο θα ήταν το βάσανο. Οι Μάρτυρες είχαν καλή διάθεση, βοηθούσε και ο Χριστός και άντεχαν στους πόνους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τί αγάπη είχαν οι άγιοι Μάρτυρες για τον Χριστό, τί λεβεντιά! Η Αγία Σολομονή με τα επτά παιδιά της[146], ένας-ένας, μαρτύρησαν όλοι. Ο Άγιος Λογγίνος[147]έκανε τραπέζι σ́ αυτούς που πήγαν να τον συλλάβουν και τους φιλοξένησε. Εκείνοι βιάζονταν να τους δείξη ποιός είναι ο Λογγίνος, για να τον αποκεφαλίσουν και εκείνος τους έλεγε: «Θα σάς τον δείξω!». Όταν τους είπε ότι είναι ο ίδιος, εκείνοι δίστασαν, αλλά ο Άγιος Λογγίνος τους παρακάλεσε να εκτελέσουν την εντολή που είχαν, και έτσι τον αποκεφάλισαν. Και ο Άγιος Γεδεών ο Καρακαλληνός[148]τί καρτερία είχε! «Πάρτε το χέρι, είπε στους δημίους, πάρτε και το πόδι, πάρτε και την μύτη. Για να μην τα πολυλογώ, πάρτε τα όλα!». Φοβερό! Αλλά, για να φθάση ο άνθρωπος σ́ αυτό το σημείο, πρέπει να μην αγαπάη τον εαυτό του και να αγαπάη τον Θεό. Η μητέρα μπαίνει μέσα στην φωτιά, για να σώση το παιδί της. Επειδή η αγάπη της είναι ισχυρότερη από το κάψιμο της φωτιάς, δεν καταλαβαίνει πόνο. Η αγάπη για το παιδί της σκεπάζει τον πόνο. Πόσο μάλλον η αγάπη για τον Χριστό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Για τον Άγιο που προχωρεί στο μαρτύριο, η αγάπη του για τον Χριστό είναι ανώτερη από τον πόνο, γι'' αυτό και τον εξουδετερώνει. Το μαχαίρι του δημίου το ένιωθαν οι Μάρτυρες γλυκύτερο και από το δοξάρι του βιολιού. Όταν φουντώση η αγάπη για τον Χριστό, τότε το μαρτύριο είναι πανηγύρι· η φωτιά ανακουφίζει καλύτερα από λουτρό, γιατί το κάψιμο χάνεται από το κάψιμο της θείας αγάπης. Το γδάρσιμο είναι χάιδεμα. Ο θείος έρωτας παίρνει την καρδιά, παίρνει και το μυαλό, και τρελλαίνεται ο άνθρωπος. Δεν καταλαβαίνει ούτε πόνο ούτε τίποτε, γιατί ο νούς του είναι στον Χριστό και πλημμυρίζει η καρδιά του από χαρά. Πόσοι Άγιοι πήγαιναν στο μαρτύριο και ένιωθαν τέτοια χαρά, λές και πήγαιναν σε πανηγύρι! Ο Άγιος Ιγνάτιος[149]έτρεχε στο μαρτύριο και φώναζε: «Αφήστε με να μαρτυρήσω, αφήστε με να με φάνε τα θηρία». Την χαρά που ένιωθε εκείνος δεν την αισθάνεται ούτε ένας νεαρός ερωτευμένος που λέει: «Θέλω αυτήν να παντρευτώ και δεν υπολογίζω κανέναν, ούτε μάνα ούτε πατέρα». Από την τρέλλα του ερωτευμένου μεγαλύτερη ήταν η «τρέλλα» του Αγίου Ιγνατίου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλοι οι Άγιοι αγωνίσθηκαν για την αγάπη του Χριστού. Οι άγιοι Μάρτυρες έχυσαν το αίμα τους, οι Όσιοι Πατέρες έχυσαν ιδρώτες και δάκρυα, έκαναν πνευματικά πειράματα στον εαυτό τους, σαν καλοί βοτανολόγοι, ταλαιπωρήθηκαν οι ίδιοι από αγάπη προς τον Θεό και προς την εικόνα του Θεού, τον άνθρωπο, για να μας αφήσουν τις πνευματικές τους συνταγές. Έτσι προλαβαίνουμε το κακό ή θεραπεύουμε μια πνευματική αρρώστια μας και αποκτάμε υγεία καί, εάν φιλοτιμηθούμε να τους μιμηθούμε στους αγώνες, μπορούμε ακόμη και να αγιάσουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν συγκρίνονται, φυσικά, όλοι οι αγώνες των Οσίων, οι νηστείες, οι αγρυπνίες κ.λπ., ούτε και τα βασανιστήρια όλων των αγίων Μαρτύρων με το Πάθος του Κυρίου μας, διότι όλους τους βοηθούσε ο Χριστός θεϊκά, και γλυκαίνονταν οι πόνοι τους από την μεγάλη Του αγάπη. Στον εαυτό Του όμως ο Χριστός δεν χρησιμοποίησε καθόλου την θεϊκή Του δύναμη και υπέφερε τον πολύ πόνο στο ευαίσθητο Σώμα Του από την πολλή αγάπη προς το πλάσμα Του. Αυτήν την αγάπη του Χριστού προς τον άνθρωπο εάν αισθανθή κανείς, τότε μόνο θα είναι και εσωτερικά πραγματικά άνθρωπος. Αλλιώς θα είναι πιο αναίσθητος και από τα δημιουργήματα του Θεού, αφού ο ήλιος αισθάνθηκε το Πάθος του Κυρίου και σκοτείνιασε, γιατί δεν άντεχε να το βλέπη. Η γή, και αυτή τρόμαξε, όταν το είδε. Οι πέτρες, και αυτές κομματιάσθηκαν. Οι τάφοι, και αυτοί σείσθηκαν τόσο δυνατά, που ξύπνησαν πολλούς κεκοιμημένους από χρόνια και τους έβγαλαν έξω να διαμαρτυρηθούν για την αχάριστη αυτή συμπεριφορά των ανθρώπων προς τον Ευεργέτη και Λυτρωτή τους Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Μοναχός και μαρτύριο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν δεν κάνη κανείς την πνευματική εργασία που πρέπει, θα έχη την πίστη, αν έρθη μια δύσκολη ώρα, ότι ο Θεός θα τον βοηθήση, για να Τον επικαλεσθή; Μήπως επαναπαυόμαστε στον λογισμό ότι τότε θα βοηθήση ο Θεός, για να αποφύγουμε τον κόπο της προετοιμασίας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να ετοιμασθούμε. Αν δεν σπείρη κανείς, πώς να δώση ο Θεός να γίνουν καλά τα σιτάρια του; Πρέπει να σπείρη ο άνθρωπος, και ανάλογα με το τί θα σπείρη, ο Θεός θα δώση. Και στον στρατό λένε «έσο έτοιμος».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα ετοιμασθούμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πότε είναι έτοιμος κανείς; Όταν είναι επιφυλακή ο στρατός, οι στρατιώτες είναι συνέχεια έτοιμοι, με τα άρβυλα, με τα όπλα τους, με τις σφαίρες, περιμένουν διαταγή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πόσο μπορεί να κρατήση αυτή η επιφυλακή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ανάλογα. Ο μοναχός πρέπει να είναι πάντοτε έτοιμος, και τότε δεν φοβάται τίποτε. Τί να φοβηθή; Τον θάνατο; Αυτός θα του ανοίξη την πόρτα του Παραδείσου, γιατί κάτω από την πλάκα του τάφου είναι κρυμμένο το κλειδί της αιωνιότητος. Άλλωστε ο μοναχός, όποτε και αν πεθάνη, εν μετανοία βρίσκεται. Η φυγή του από τον κόσμο και το σχήμα του αυτό δηλώνουν. Μετανοεί και προχωρεί να κάνη λεπτή πνευματική εργασία. Όσο αυξάνει η αγάπη για τον Θεό και τον πλησίον, τόσο ελαττώνεται η αγάπη για τον εαυτό του, και δεν τον υπολογίζει. Και τότε ισχύει εκείνο που γράφει ο Απόστολος Παύλος: «Τίποτε δεν μπορεί να με χωρίση από την αγάπη του Χριστού»[150].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τους κοσμικούς η σκέψη του μαρτυρίου τους αναγκάζει να καταφεύγουν στον Θεό και να λένε από φόβο «Χριστέ μου, Παναγία μου», ενώ ο μοναχός θέλει να είναι συνέχεια κοντά στον Θεό, γιατί Τον αγαπάει. Πολλοί από τους κοσμικούς κάνουν το καλό, γιατί φοβούνται να μην πάνε στην κόλαση. Ο μοναχός όμως κάνει το καλό από ευγνωμοσύνη, για να ευχαριστήση τον Ευεργέτη του Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα νιώσω το μαρτύριο και την άσκηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να νιώσης και εσύ λίγο τί θα πη μαρτύριο, να δέχεσαι έστω με χαρά την περιφρόνηση. Και αν θέλης να νιώσης και λίγο την άσκηση, μια που δεν μπορείς να νηστέψης σαράντα ημέρες, όπως ο Χριστός, νήστεψε και εσύ έστω μία Τετάρτη που Τον πρόδωσαν και μία Παρασκευή[151]που Τον σταύρωσαν. Εκείνοι που θέλουν να μαρτυρήσουν για την αγάπη του Χριστού, αλλά δεν υπάρχει μαρτύριο, μπορούν την αγάπη τους αυτή, από την οποία καίγονται, να την εκδηλώσουν με άσκηση σωματική για τις ψυχές των κεκοιμημένων που καίγονται, για να βρουν λίγη ανάπαυση. Όπως το μαρτύριο είναι πανηγύρι, έτσι και η άσκηση είναι πανηγύρι, γιατί αποφεύγει κανείς όλη την ανθρώπινη παρηγοριά και βρίσκει την θεία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι άγιοι Μάρτυρες ένιωθαν μεγάλη χαρά που τους δινόταν η ευκαιρία να μαρτυρήσουν. Από το μαρτύριο ξεκίνησε ο ασκητισμός στην πνευματική ζωή. Όταν ανέλαβε την εξουσία ο Μέγας Κωνσταντίνος, έβγαλε τους Χριστιανούς από τις φυλακές – γιατί τους είχαν εκεί, για να τους τελειώσουν – άλλους σακατεμένους κ.λπ., και σταμάτησαν τα μαρτύρια. Αλλά εκείνοι που περίμεναν στις φυλακές με χαρά την σειρά τους, για να μαρτυρήσουν, όταν ελευθερώθηκαν, πολύ στενοχωρήθηκαν που τους χάλασε ο Μέγας Κωνσταντίνος την δουλειά. Εκεί που περίμεναν το μαρτύριο με χαρά, βρέθηκαν ελεύθεροι. Οπότε, από την αγάπη τους προς τον Θεό και την φλόγα που είχαν να μαρτυρήσουν, πήραν τα βουνά. Γι᾿ αυτό τα μαρτύρια που θα τους έκανε ο Διοκλητιανός, ο Μαξιμιανός, τα έκαναν μόνοι τους στον εαυτό τους με την άσκηση. Άλλος πήγαινε και κρεμιόταν με σχοινιά από τα χέρια σε κανένα δένδρο· προσευχόταν με πόνο, αλλά αγαλλόταν θεϊκά. Άλλος δενόταν για την αγάπη του Χριστού. «Έτσι θα με έδενε, έλεγε, ο Διοκλητιανός»! Και ένιωθαν μεγάλη χαρά που βασάνιζαν τον εαυτό τους. Ξεκίνησαν οι πρώτοι με αυτήν την θεία τρέλλα, την θεία παλαβομάρα, και δόθηκαν στην άσκηση για την αγάπη του Χριστού και μετά τους μιμήθηκαν στην άσκηση και άλλοι. Έτσι μπήκε ο ασκητισμός στην θρησκεία μας. Άλλοι πάλι πιό... παλαβοί είπαν «είμαστε πρόβατα του Χριστού!» και έτρωγαν μόνο χορτάρι από την γή. Αυτοί ήταν οι λεγόμενοι «βοσκοί». Ζούσαν τόσο έντονα τις ευεργεσίες του Θεού και την δική τους μηδαμινότητα, που έλεγαν: «Είμαι ζώο αχάριστο, σε όλη μου την ζωή θα τρώω χόρτα», και έτσι έκαναν. Έτρωγαν χόρτα και χαίρονταν. Φτερούγιζε η καρδιά τους από αγάπη προς τον Χριστό. «Πρόβατο του Χριστού, έλεγαν, δεν είμαι; Θα τρώω χόρτα»[152]. Αργότερα όμως το απαγόρευσε η Εκκλησία, γιατί οι κυνηγοί πολλούς τους περνούσαν για άγρια ζώα και τους σκότωναν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα αυτά δεν μπορούν να τα καταλάβουν οι άνθρωποι· τα θεωρούν ανοησίες! «Γιατί να τρώω χόρτο σαν το ζώο;», λένε ή «γιά ποιό σκοπό να κρεμιέμαι έτσι και να ταλαιπωρώ το σώμα μου;». Είδες όμως τί λέει ο Αββάς Ισαάκ; «Μακάρι να μας αξιώση ο Θεός να κάνουμε τέτοιες αταξίες»[153], να φθάσουμε σ᾿ αυτήν την πνευματική αταξία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τέταρτο Μέρος – Εξάρτηση Απο Τον Ουρανό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Η βοήθεια του Θεού δεν εμποδίζεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ούτε από ανθρώπους ούτε από δαίμονες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν είναι τίποτε δύσκολο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιά τον Θεό ούτε για έναν Άγιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το εμπόδιο σ́ εμάς τους ανθρώπους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: είναι η ολιγοπιστία,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μέ την οποία εμποδίζουμε
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τίς μεγάλες θείες δυνάμεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: νά μας πλησιάσουν».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η πρόνοια του Θεού για τον άνθρωπο
- type: h2
  initial:
    ru: ''
  text:
    ru: «Ζητείτε πρώτον την Βασιλείαν του Θεού»[154]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ο Αββάς Μακάριος λέει ότι ο Θεός μας δίνει τα ουράνια αγαθά[155], και αυτό το πιστεύουμε. Πρέπει να πιστεύουμε ότι θα μας δώση και τα επίγεια, που δεν είναι τόσο σημαντικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιά επίγεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ό,τι μας χρειάζεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, καλά το είπες. Ο Θεός αγαπάει το πλάσμα Του, την εικόνα Του, και το φροντίζει γι᾿ αυτά που του χρειάζονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό πρέπει να το πιστεύη ο καθένας και να μην ανησυχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν το πιστεύη και παλεύη μόνος του να τα αποκτήση, θα ταλαιπωρήται. Μά και αν ο Θεός δεν δώση αυτά τα επίγεια, τα υλικά πράγματα, δεν θα στενοχωρηθή ο άνθρωπος που ζη πνευματικά. Αν ζητάμε πρώτα την Βασιλεία του Θεού και αυτή είναι η μόνη μέριμνά μας, όλα τα άλλα θα μας δοθούν. Θα αφήση ο Θεός το πλάσμα Του; Το μάννα που έρριχνε ο Θεός καθημερινά στους Ισραηλίτες στην έρημο, αν το κρατούσαν για την άλλη μέρα, σάπιζε[156]. Έτσι τα οικονόμησε ο Θεός, για να έχουν εμπιστοσύνη στην θεία πρόνοια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ακόμη το «ζητείτε πρώτον την Βασιλείαν του Θεού» δεν το έχουμε καταλάβει. Ή πιστεύουμε ή δεν πιστεύουμε. Όταν πήγα να μείνω στο Σινά, δεν είχα τίποτε. Δεν σκέφθηκα όμως καθόλου τί θα γίνω στην έρημο μέσα σε άγνωστους ανθρώπους, τί θα φάω, πώς θα ζήσω. Το ασκητήριο της Αγίας Επιστήμης, όπου θα έμενα, ήταν χρόνια εγκαταλελειμμένο, ακατοίκητο. Επειδή δεν ήθελα να επιβαρύνω το μοναστήρι, δεν ζήτησα τίποτε. Μου έφεραν λίγο ψωμί από το μοναστήρι και το γύρισα πίσω. Γιατί να ανησυχήσω, αφού ο Χριστός είπε: «Ζητείτε πρώτον την Βασιλείαν του Θεού»; Το νερό και αυτό ήταν ελάχιστο. Ούτε εργόχειρο ήξερα, για να πής πώς θα δούλευα και θα έβγαζα το ψωμί μου. Το μόνο εργαλείο που είχα ήταν ένα ψαλίδι. Το χώρισα στα δύο, το ακόνισα σε μια πέτρα, πήρα και ένα ξύλο και άρχισα να φτιάχνω ξυλόγλυπτα εικονάκια. Δούλευα και έλεγα και την ευχή. Γρήγορα εξασκήθηκα.Έφτιαχνα συνέχεια το ίδιο σχέδιο, και την δουλειά που θα έκανα σε πέντε μέρες, την έκανα σε έντεκα ώρες, και όχι μόνο δεν στερήθηκα, αλλά βοηθούσα και τα Βεδουϊνάκια. Για ένα διάστημα έκανα εργόχειρο αρκετές ώρες την ημέρα. Ύστερα είχα φθάσει σε μια κατάσταση που δεν ήθελα να κάνω εργόχειρο, αλλά έβλεπα και την ανάγκη που είχαν τα Βεδουϊνάκια. Ένα σκουφί και ένα ζευγάρι πέδιλα να τους έδινες, ήταν γι᾿ αυτά πολύ μεγάλη ευλογία... Μου πέρασε λοιπόν ο λογισμός: «Ήρθα εδώ, για να βοηθώ τους Βεδουΐνους ή για να κάνω προσευχή για όλον τον κόσμο;». Έτσι αποφάσισα να περιορίσω την δουλειά, για να είμαι πιο απερίσπαστος και να προσεύχωμαι περισσότερο. Και μήπως περίμενα από πουθενά βοήθεια; Οι Βεδουΐνοι δεν είχαν οι ίδιοι να φάνε. Το μοναστήρι ήταν μακριά. Από την άλλη μεριά έρημος. Την ίδια μέρα όμως που περιόρισα την δουλειά, για να διαθέσω περισσότερο χρόνο στην προσευχή, έρχεται κάποιος και με βρίσκει έξω από το ασκητήριο και μου λέει: «Νά, πάρε αυτές τις εκατό λίρες, για να βοηθάς τα Βεδουϊνάκια και να μη βγαίνης από το πρόγραμμά σου και να προσεύχεσαι»! Δεν άντεξα. Τον άφησα μόνον του για ένα τέταρτο και πήγα λίγο μέσα. Μου είχε δημιουργήσει τέτοια κατάσταση η πρόνοια και η αγάπη του Θεού, που δεν μπορούσα να συγκρατήσω τα δάκρυά μου. Βλέπεις πώς ο Θεός οικονομάει, όταν υπάρχη η καλή διάθεση; Γιατί εγώ πόσα θα τους έδινα; Έδινα σε ένα, ερχόταν το άλλο, «εμένα δεν μου έδωσες, Πάτερ!», έλεγε, ύστερα ερχόταν άλλο, «εμένα δεν μου έδωσες, Πάτερ!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, ενώ πολλές φορές έχουμε νιώσει την παντοδυναμία του Θεού, δεν βλέπουμε την πρόνοιά Του για μάς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι παγίδα του διαβόλου. Ο διάβολος ρίχνει στάχτη στα μάτια του ανθρώπου, για να μη δη την πρόνοια του Θεού. Γιατί, όταν δη ο άνθρωπος την πρόνοια του Θεού, θα μαλακώση η γρανιτένια καρδιά του, θα γίνη ευαίσθητη και θα ξεσπάση σε δοξολογία, και αυτό δεν συμφέρει στον διάβολο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος συχνά κανονίζει χωρίς τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κάποιος είχε κάνει μια μονάδα ιχθυοτροφείου και όλη μέρα έλεγε «δόξα σοι ο Θεός», γιατί έβλεπε συνέχεια την πρόνοια του Θεού. Μου έλεγε ότι το ψαράκι, από την στιγμή που θα γονιμοποιηθή και είναι μικρό σαν το κεφαλάκι της καρφίτσας, έχει και ένα σακκουλάκι με υγρό, για να τρέφεται, μέχρι να μεγαλώση και να μπορή να πιάνη κανέναν μικροοργανισμό από το νερό. Του έχει δηλαδή και την «κομπάνια»[157]του ο Θεός! Και αν γι' αυτά προνοή ο Θεός, πόσο μάλλον για τον άνθρωπο! Αλλά ο άνθρωπος συχνά κανονίζει και αποφασίζει για όλα χωρίς τον Θεό. «Θα κάνω, λέει, δύο παιδιά». Τον Θεό δεν Τον βάζει στον λογαριασμό. Γι᾿ αυτό και γίνονται τόσα ατυχήματα και σκοτώνονται τόσα παιδιά. Έχουν οι περισσότεροι δυο παιδιά, το ένα χτυπάει με το αυτοκίνητο, το άλλο αρρωσταίνει και πεθαίνει, και δεν έχουν μετά κανένα παιδί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν οι γονείς, οι συνδημιουργοί του Θεού, δυσκολεύωνται, μετά από τις προσπάθειες που κάνουν να οικονομήσουν τα παιδιά τους, πρέπει ταπεινά να ζητήσουν και την βοήθεια του Μεγάλου Δημιουργού απλώνοντας τα χέρια τους προς τα πάνω. Τότε χαίρεται και ο Θεός που βοηθάει, χαίρεται και ο άνθρωπος που βοηθιέται. Το διάστημα που ήμουν στην Μονή Στομίου, γνώρισα έναν πολύτεκνο οικογενειάρχη που ήταν αγροφύλακας σε ένα χωριό της Ηπείρου, απόσταση τεσσερισήμισι ώρες με τα πόδια από την Κόνιτσα, όπου έμενε η οικογένειά του. Είχε εννέα παιδιά. Επειδή ο δρόμος για το χωριό περνούσε έξω από το μοναστήρι, ο αγροφύλακας αυτός ερχόταν, και όταν πήγαινε στην υπηρεσία του, αλλά και όταν επέστρεφε. Όποτε επέστρεφε από το χωριό, για να πάη στο σπίτι του, με παρακαλούσε να ανάψη ο ίδιος τα κανδήλια. Αν και έχυνε κάτω λάδια, τον άφηνα να τα ανάβη· προτιμούσα να καθαρίσω μετά τις πλάκες του Ναού, παρά να τον λυπήσω. Όταν έφευγε από το μοναστήρι, τριακόσια μέτρα περίπου πιο έξω, έρριχνε πάντα μια ντουφεκιά! Αυτό δεν μπορούσα να το εξηγήσω, γι'' αυτό αποφάσισα να τον παρακολουθήσω από την στιγμή που θα έμπαινε μέσα στον Ναό μέχρι να πάρη τον δρόμο για την Κόνιτσα. Άναβε λοιπόν πρώτα τα κανδήλια μέσα στον Ναό και ύστερα έβγαινε στον νάρθηκα. Αφού άναβε και εκεί την κανδήλα που ήταν πάνω από την είσοδο, μπροστά στην εικόνα της Παναγίας, βουτούσε το δάκτυλό του στην κανδήλα, γονάτιζε, άπλωνε τα χέρια του προς την εικόνα και έλεγε: «Παναγία μου, εννιά παιδιά έχω· οικονόμησέ τα λίγο κρέας». Άλειφε στην συνέχεια το στόχαστρο στην κάννη του ντουφεκιού με το λαδάκι που είχε στο δάκτυλο, και έφευγε. Τριακόσια μέτρα έξω από την μονή, όπου υπήρχε μια μουριά, τον περίμενε ένα αγριοκάτσικο. Έρριχνε, όπως ανέφερα, μια ντουφεκιά, το σκότωνε, το κατέβαζε κάτω σε μια σπηλιά, το έγδερνε και το πήγαινε στα παιδιά του. Αυτό γινόταν κάθε φορά που θα επέστρεφε από την δουλειά του. Θαύμασα την πίστη του αγροφύλακα και την πρόνοια της Παναγίας. Μετά από είκοσι πέντε χρόνια ήρθε και με βρήκε στο Άγιον Όρος. Κάποια στιγμή τον ρώτησα αυθόρμητα: «Τί κάνουν τα παιδιά σου; Που βρίσκονται;». Και εκείνος άπλωσε πρώτα το χέρι του προς τον Βορρά και είπε «άλλα στην Γερμανία» και μετά άπλωσε το χέρι του προς τον Νότο και είπε «καί άλλα στην Αυστραλία· δόξα τω Θεώ έχουν την υγειά τους». Διατηρούσε αυτός ο άνθρωπος και την πίστη του, αλλά και τον εαυτό του αγνό από άθεες ιδεολογίες, γι᾿ αυτό και ο Θεός δεν τον άφησε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ευλογίες της θαυμαστής πρόνοιας του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές, Γέροντα, έχω μια επιθυμία, και ο Θεός μου την εκπληρώνει, χωρίς να Του το ζητήσω. Πώς γίνεται αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Οικονομάει ο Θεός. Βλέπει τις ανάγκες, τις επιθυμίες μας, καί, όταν κάτι είναι για το καλό μας, μας το δίνει. Όταν κανείς χρειάζεται σε κάτι βοήθεια, ο Χριστός και η Παναγία βοηθούν. Ρωτούσαν τον Γέροντα Φιλάρετο[158]: «Τί θέλεις, Γέροντα, να σε οικονομήσουμε;». «Ό,τι θέλω η Παναγία θα το στείλη», απαντούσε εκείνος. Και έτσι γινόταν. Όταν εμπιστευώμαστε τον εαυτό μας στον Θεό, ο Καλός Θεός μας παρακολουθεί και μας οικονομάει. Σαν καλός οικονόμος δίνει στον καθένα μας ό,τι του χρειάζεται και μας φροντίζει ακόμη και σε λεπτομέρειες για τις υλικές ανάγκες μας. Και για να καταλάβουμε την φροντίδα Του, την πρόνοιά Του, μας δίνει ακριβώς ό,τι μας χρειάζεται. Να μην περιμένης όμως πρώτα να σού δώση ο Θεός, αλλά εσύ να δώσης όλο τον εαυτό σου στον Θεό. Γιατί, εάν ζητάς συνέχεια από τον Θεό και δεν αφήνης τον εαυτό σου με εμπιστοσύνη στον Θεό, αυτό δείχνει ότι έχεις δικό σου σπίτι και αποξενώνεσαι από τις αιώνιες ουράνιες Μονές. Όσοι άνθρωποι τα δίνουν όλα στον Θεό και δίνονται ολόκληροι σ᾿ Αυτόν, στεγάζονται κάτω από τον μεγάλο τρούλλο του Θεού και προστατεύονται από την θεία Του πρόνοια. Η εμπιστοσύνη στον Θεό είναι μια συνεχής μυστική προσευχή, που φέρνει αθόρυβα τις δυνάμεις του Θεού εκεί που χρειάζονται και την ώρα που χρειάζονται, και τότε τα φιλότιμα παιδιά Του Τον δοξολογούν συνέχεια με πολλή ευγνωμοσύνη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Παπα-Τύχων, όταν είχε πάει στο Καλύβι του Τιμίου Σταυρού, δεν είχε Ναό, αν και του ήταν απαραίτητος. Ούτε χρήματα είχε για να φτιάξη, παρά μόνο μεγάλη πίστη στον Θεό. Μια μέρα προσευχήθηκε και ξεκίνησε για τις Καρυές, με την πίστη ότι ο Θεός θα του οικονομούσε τα χρήματα που χρειαζόταν, για να φτιάξη τον Ναό. Πριν φθάση ακόμη στις Καρυές, τον φώναξε από μακριά ο δικαίος[159]της Σκήτης του Προφήτη Ηλία. Όταν πλησίασε ο Παπα-Τύχων, ο δικαίος του είπε: «Κάποιος καλός Χριστιανός από την Αμερική μου έστειλε αυτά τα δολλάρια, για να τα δώσω σε κανέναν ασκητή που δεν έχει Ναό. Εσύ δεν έχεις Ναό· πάρ'' τα και φτιάξε». Δάκρυσε ο Παπα-Τύχων από συγκίνηση και ευγνωμοσύνη στον Καλό Θεό πού, σαν καρδιογνώστης που είναι, είχε φροντίσει για τον Ναό, πριν ακόμη εκείνος Τον παρακαλέση, ώστε να του έχη έτοιμα τα χρήματα, όταν θα του τα ζητούσε[160].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν κανείς αφήνεται στον Θεό, ο Θεός δεν τον αφήνει. Και πράγματι, αν χρειασθής αύριο στις δέκα η ώρα κάτι, όταν δεν είναι παράλογο και είναι ανάγκη πραγματική, εννιά και σαράντα πέντε λεπτά ή εννιά και μισή θα το έχη έτοιμο ο Θεός, για να σού το δώση. Π.χ. σού χρειάζεται ένα κύπελλο στις εννιά η ώρα. Στις εννιά παρά πέντε σού έρχεται το κύπελλο. Σού χρειάζονται πεντακόσιες δραχμές. Την ώρα που τις θέλεις έρχονται ακριβώς πεντακόσιες δραχμές· ούτε πεντακόσιες δέκα ούτε τετρακόσιες ενενήντα. Έχω παρατηρήσει ότι, αν μου χρειασθή λ.χ. κάτι αύριο, ο Θεός το έχει προνοήσει από σήμερα· πριν δηλαδή το σκεφθώ εγώ, το έχει σκεφθή ο Θεός πιο νωρίς και το παρουσιάζει την ώρα που το χρειάζομαι. Γιατί από εκεί που έρχεται, για να φθάση σ́ εμένα ακριβώς την ώρα που το χρειάζομαι, βλέπω πόσος χρόνος απαιτείται. Άρα ο Θεός το φρόντισε νωρίτερα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν από φιλότιμο κάνουμε τον Θεό να χαίρεται με την ζωή μας, τότε Εκείνος δίνει άφθονες τις ευλογίες Του στα φιλότιμα παιδιά Του, την ώρα που τις χρειάζονται. Όλη η ζωή μετά περνάει με ευλογίες της θείας πρόνοιας. Μπορώ ώρες να σάς λέω παραδείγματα από την θαυμαστή πρόνοια του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ήμουν στον πόλεμο, στις επιχειρήσεις, είχα ένα Ευαγγέλιο και το έδωσα σε κάποιον. Μετά έλεγα: «Άχ, να είχα ένα Ευαγγέλιο, πόσο θα με βοηθούσε!». Τα Χριστούγεννα μας είχαν στείλει πάνω στο βουνό διακόσια δέματα από το Μεσολόγγι. Από τα διακόσια δέματα, μόνο στο δικό μου δέμα υπήρχε ένα Ευαγγέλιο! Ήταν παλιό Ευαγγέλιο, είχε και χάρτη της Παλαιστίνης. Στο δέμα υπήρχε και ένα σημείωμα που έγραφε: «Αν χρειάζεσαι και άλλα βιβλία, γράψε μας να σού στείλουμε». Αργότερα, στην Μονή Στομίου, χρειάσθηκα μια φορά ένα κανδήλι για τον Ναό. Ένα πρωί, χαράματα, κατέβηκα στην Κόνιτσα. Την ώρα που περνούσα έξω από ένα σπίτι, ακούω μια κοπέλα να λέη στον πατέρα της: «Πατέρα, ο καλόγερος!». Τότε εκείνος ήρθε και μου είπε: «Πάτερ, έταξα ένα κανδήλι στην Παναγία· πάρε αυτά τα χρήματα να το αγοράσης», και μου δίνει πεντακόσιες δραχμές, ακριβώς όσο έκανε το 1958 ένα κανδήλι. Αλλά και τώρα, όταν κάτι χρειάζωμαι, τα οικονομάει αμέσως ο Θεός. Θέλω λ.χ. να κόψω ξύλα και δεν μπορώ. Τότε οικονομούνται τάκα–τάκα τα ξύλα. Πριν έρθω εδώ, έλαβα ένα δέμα που είχε μέσα πενήντα χιλιάδες δραχμές, ακριβώς όσα χρειαζόμουν. Έδωσα μία εικόνα του «Άξιόν εστιν» σε κάποιον ευλογία, την άλλη μέρα μου φέρνουν μία της «Πορταΐτισσας!». Φέτος[161]το καλοκαίρι, πριν βρέξη, δεν είχα καθόλου νερό. Τώρα που έβρεξε λίγο, μαζεύω ενάμισι κουτί την ημέρα. Η στέρνα έχει περσινό νερό, και αυτή είναι χάλια. Πώς τα οικονομάει όμως ο Θεός! Έχω ένα βαρέλι με νερό. Τόσοι άνθρωποι που έρχονται κάθε μέρα πίνουν, πλένονται, γιατί είναι και ιδρωμένοι, και η στάθμη κατεβαίνει μόνον τέσσερα-πέντε δάκτυλα! Εκατόν πενήντα-διακόσιοι άνθρωποι να βολεύωνται και να μην αδειάζη το βαρέλι! Άλλοι ανοίγουν πολύ την κάννουλα της βρύσης, άλλοι την ξεχνούν ανοιχτή και τρέχει, και όμως το νερό δεν τελειώνει!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αφεθούμε στην θεία πρόνοια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όποιος παρακολουθεί τις ευεργεσίες του Θεού, μαθαίνει να εξαρτά τον εαυτό του από την θεία πρόνοια. Νιώθει μετά σαν το μωρό στην κούνια πού, αν το αφήση για λίγο η μητέρα του, αρχίζει να κλαίη, μέχρι να τρέξη πάλι κοντά του. Αν αφεθή κανείς στον Θεό, είναι μεγάλη υπόθεση. Όταν πρωτοπήγα στην Ιερά Μονή Στομίου, δεν είχα που να μείνω. Όλο το μοναστήρι ήταν γεμάτο μπάζα. Βρήκα μια γωνιά κοντά στην μάνδρα, έβαλα κάτι από πάνω, για να την σκεπάσω λίγο, και εκεί περνούσα τα βράδυα καθιστός, γιατί δεν χωρούσα να ξαπλώσω. Μια μέρα ήρθε ένας γνωστός μου ιερομόναχος και μου λέει: «Καλά, πώς μένεις εδώ;». «Γιατί, του λέω, οι κοσμικοί είχαν περισσότερα από μάς; Όταν είπαν στον Κανάρη, τότε που ζήτησε δάνειο, «δέν έχεις Πατρίδα», εκείνος είπε: «Θα αποκτήσουμε Πατρίδα». Αν κοσμικός άνθρωπος είχε τέτοια πίστη, εμείς να μην έχουμε εμπιστοσύνη στον Θεό; Αφού η Παναγία οικονόμησε να βρεθώ εδώ, δεν θα φροντίση για το μοναστήρι της, όταν έρθη η ώρα;». Και πράγματι, πώς τα οικονόμησε σιγά-σιγά όλα η Παναγία! Θυμάμαι, όταν έρριχναν οι μάστορες το μπετόν, για να φτιάξουν την πλάκα στα κελλιά που είχαν καή, δεν έφθασαν τα τσιμέντα. Υπολειπόταν το ένα τρίτο, για να τελειώση η πλάκα. Έρχονται οι μάστορες και μου λένε: «Τα τσιμέντα τελειώνουν. Να αραιώσουμε το μπετόν, για να φθάση για όλη την πλάκα». «Όχι, τους λέω, συνεχίστε κανονικά». Να φέρουμε άλλα δεν γινόταν, γιατί τα ζώα ήταν στον κάμπο. Έπρεπε να πάνε οι μάστορες δυο ώρες ώς την Κόνιτσα και δυο ώρες ώς τον κάμπο, στα χωράφια, για να βρουν ζώα. Πότε να πάνε, πότε να γυρίσουν. Ύστερα, οι άνθρωποι είχαν τις δουλειές τους· δεν μπορούσαν να έρθουν άλλη μέρα. Βλέπω, είχαν ρίξει τα δύο τρίτα της πλάκας. Μπήκα στο εκκλησάκι και λέω: «Τί θα γίνη τώρα, Παναγία μου; Σε παρακαλώ, βοήθησέ μας». Μετά βγήκα έξω...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τί έγινε, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και η πλάκα τελείωσε και τα τσιμέντα περίσσεψαν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι μάστορες το κατάλαβαν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς δεν το κατάλαβαν. Είναι μερικές φορές πολύ μεγάλη η βοήθεια του Θεού και της Παναγίας!
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός αξιοποιεί τα πάντα για το καλό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές ξεκινάμε να κάνουμε μια δουλειά και παρουσιάζονται ένα σωρό εμπόδια. Πώς θα καταλάβουμε αν τα εμπόδια είναι από τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να εξετάσουμε αν φταίμε εμείς. Αν δεν φταίμε, το εμπόδιο θα είναι από τον Θεό για το καλό μας. Γι' αυτό δεν πρέπει κανείς να στενοχωριέται, αν δεν έγινε η δουλειά ή αν καθυστέρησε να τελειώση. Μια φορά κατέβαινα βιαστικός από την Ιερά Μονή Στομίου, να πάω στην Κόνιτσα για μια επείγουσα δουλειά. Σε ένα δύσκολο σημείο του δρόμου – Γολγοθά το έλεγα – συνάντησα έναν γνωστό του μοναστηριού, τον μπαρμπα-Αναστάση, με τρία ζώα φορτωμένα. Από την πολλή ανηφόρα είχαν αναποδογυρισθή τα σαμάρια τους και ένα ζώο ήταν κοντά στον γκρεμό και κόντευε να πέση κάτω. «Ο Θεός σ́ έστειλε, Πάτερ», μου είπε ο μπαρμπα-Αναστάσης. Τον βοήθησα να τα ξεφορτώσουμε και να τα ξαναφορτώσουμε, τα βάλαμε και στον δρόμο και τον άφησα. Όταν προχώρησα αρκετά, έφθασα σε ένα σημείο όπου μόλις πριν λίγο είχε γίνει κατολίσθηση σε μήκος τριακόσια μέτρα και είχε φαγωθή το μονοπάτι. Δένδρα και πέτρες είχαν κατεβή στο ποτάμι. Αν δεν καθυστερούσα, θα βρισκόμουν εκεί την ώρα ακριβώς που έγινε η κατολίσθηση. «Μπαρμπα-Αναστάση, είπα, μ᾿ έσωσες. Ο Θεός σ᾿ έστειλε».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Χριστός από ψηλά βλέπει τον καθένα μας πώς ενεργεί και ξέρει πώς και πότε θα ενεργήση για το καλό μας. Ξέρει πώς και που θα μας οδηγήση, αρκεί εμείς να ζητούμε βοήθεια, να του λέμε τις επιθυμίες μας και να αφήνουμε Εκείνον όλα να τα κανονίζη. Εγώ, όταν ήμουν στην Ιερά Μονή Φιλοθέου, ήθελα να πάω στην έρημο· σκεφτόμουν να φύγω σε ένα ερημονήσι. Είχα συμφωνήσει μάλιστα με έναν βαρκάρη να έρθη να με πάη, αλλά τελικά δεν ήρθε. Ήταν οικονομία Θεού, γιατί ήμουν ακόμη άπειρος και θα πάθαινα μεγάλη ζημιά στο ερημονήσι· θα με αφάνιζαν οι δαίμονες. Αφού δεν μπόρεσα να πάω εκεί, στράφηκα προς τα Κατουνάκια. Αγάπησα την έρημο των Κατουνακίων και προσευχόμουν και ετοιμαζόμουν να πάω εκεί. Ήθελα να ασκητέψω κοντά στον Γερο-Πέτρο[162], έναν πολύ πνευματικό Πατέρα. Μου συνέβη όμως ένα γεγονός που με ανάγκασε να πάω στην Κόνιτσα και όχι στα Κατουνάκια. Ένα βράδυ μετά το Απόδειπνο είχα αποσυρθή στο κελλί μου και προσευχόμουν ώς αργά. Κατά τις ένδεκα την νύχτα ξάπλωσα να ησυχάσω λίγο. Μιάμιση η ώρα ξύπνησα με το σήμαντρο της μονής που μας καλούσε στον Ναό. Έκανα να σηκωθώ, αλλά ήταν αδύνατο. Μια αόρατη δύναμη με κρατούσε ακίνητο. Κατάλαβα ότι κάτι συμβαίνει. Έμεινα καθηλωμένος στο κρεββάτι μέχρι τις δώδεκα το μεσημέρι. Μπορούσα να προσεύχωμαι, να σκέφτωμαι, αλλά δεν μπορούσα να κινηθώ καθόλου. Ενώ βρισκόμουν σ́ αυτήν την κατάσταση, είδα σαν σε τηλεόραση από την μια μεριά τα Κατουνάκια και από την άλλη την Μονή Στομίου στην Κόνιτσα. Εγώ με λαχτάρα γύρισα τα μάτια μου προς τα Κατουνάκια. Μια φωνή τότε – ήταν της Παναγίας – μου είπε καθαρά: «Δεν θα πάς στα Κατουνάκια· θα πάς στην Μονή Στομίου». «Παναγία μου, εγώ έρημο Σού ζητούσα και Εσύ με στέλνεις στον κόσμο;», είπα. Άκουσα ξανά την ίδια φωνή να μου λέη αυστηρά: «Θα πάς να συναντήσης το τάδε πρόσωπο, το οποίο θα σε βοηθήση πολύ». Αμέσως λύθηκα από εκείνο το αόρατο δέσιμο και πλημμύρισε η καρδιά μου από την θεία Χάρη. Μετά πήγα και το είπα στον Πνευματικό. «Αυτό είναι το θέλημα του Θεού, μου είπε ο Πνευματικός. Μήν κάνης όμως λόγο για το γεγονός. Πές πώς για λόγους υγείας – έβγαζα αίμα εκείνη την εποχή – θα χρειασθή να βγής από το Όρος και πήγαινε». Άλλο ήθελα εγώ, αλλά ο Θεός είχε το σχέδιό Του. Σκέφθηκα ότι ήταν θέλημα Θεού να ανακαινίσω αυτό το μοναστήρι, και έτσι θα εκπληρωνόταν και ένα τάμα που είχα κάνει στην Παναγία, όταν υπηρετούσα στον στρατό, τότε με τον πόλεμο. «Παναγία μου, είχα πει τότε, βοήθησέ με να γίνω καλόγερος και θα δουλέψω τρία χρόνια να Σού φτιάξω πάλι το καμένο Σου μοναστήρι». Όπως αποδείχθηκε όμως εκ των υστέρων, ο κύριος λόγος που η Παναγία με έστειλε εκεί ήταν, για να βοηθηθούν οι ογδόντα οικογένειες που είχαν γίνει προτεσταντικές να επιστρέψουν στην Ορθοδοξία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός συχνά επιτρέπει να γίνη αυτό που είναι για το συμφέρον των πολλών. Δεν κάνει ποτέ ένα καλό μόνο του, αλλά τρία-τέσσερα καλά μαζί. Ούτε ποτέ επιτρέπει να γίνη ένα κακό, εάν δεν βγουν από αυτό πολλά καλά. Όλα τα αξιοποιεί για όφελός μας, και τα στραβά και τα επικίνδυνα. Το καλό με το κακό είναι ανακατεμένα· καλά θα ήταν να είναι χωρισμένα, αλλά μπαίνουν τα προσωπικά συμφέροντα και ανακατεύονται. Ο Θεός όμως και αυτό το μπερδεμένο το αξιοποιεί. Γι' αυτό πρέπει να πιστεύουμε ότι ο Θεός επιτρέπει να γίνεται μόνον ό,τι μπορεί να βγή σε καλό, γιατί αγαπά το πλάσμα Του. Μπορεί λ.χ. να επιτρέψη έναν μικρό πειρασμό, για να μας προστατέψη από έναν μεγαλύτερο. Μια φορά στο Άγιον Όρος ένας λαϊκός πήγε σε κάποιο πανηγύρι σε ένα μοναστήρι. Ήπιε λίγο και μέθυσε. Όταν έφυγε από το μοναστήρι, έπεσε κάτω, και καθώς χιόνιζε, τον σκέπασε το χιόνι. Από την σπιρτάδα που είχε η αναπνοή του άνοιξε μια τρύπα στο χιόνι. Κάποια στιγμή περνούσε ένας από εκεί και είδε την τρύπα. «Τί είναι 'δώ, πηγή;», αναρωτήθηκε. Χτυπάει με το μπαστούνι, «ώχ!» φώναξε ο μεθυσμένος, και έτσι οικονόμησε ο Θεός να σωθή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι ευεργεσίες του Θεού ραγίζουν την καρδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θέλει από εμάς ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Θεός από εμάς θέλει την προαίρεσή μας, την αγαθή μας διάθεση, που θα την εκδηλώνουμε με τον έστω και λίγο φιλότιμο αγώνα μας, και την συναίσθηση της αμαρτωλότητός μας. Όλα τα άλλα τα δίνει Εκείνος. Δεν χρειάζονται μπράτσα στην πνευματική ζωή. Να αγωνιζώμαστε ταπεινά, να ζητούμε το έλεος του Θεού και να Τον ευγνωμονούμε για όλα. Αυτός που εγκαταλείπεται στα χέρια του Θεού, χωρίς κανένα δικό του σχέδιο, περνά στο σχέδιο του Θεού. Όσο ο άνθρωπος είναι γαντζωμένος στον εαυτό του, μένει πίσω· δεν προχωράει πνευματικά, γιατί εμποδίζει το έλεος του Θεού. Για να προκόψη, χρειάζεται πολλή εμπιστοσύνη στον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός κάθε στιγμή χαϊδεύει με την αγάπη Του τις καρδιές όλων των ανθρώπων, αλλά εμείς δεν το καταλαβαίνουμε, γιατί οι καρδιές μας έχουν πιάσει πουρί. Όταν καθαρίση την καρδιά του ο άνθρωπος, συγκινείται, διαλύεται, τρελλαίνεται, γιατί βλέπει τις ευεργεσίες, τις καλωσύνες του Θεού, που όλους τους αγαπά το ίδιο. Γι᾿ αυτούς που ταλαιπωρούνται, πονάει· γι᾿ αυτούς που ζουν πνευματική ζωή, χαίρεται. Είναι αρκετό και μόνον οι ευεργεσίες του Θεού, εάν τις σκεφθή μια φιλότιμη ψυχή, να την τινάξουν στον αέρα· πόσο μάλλον, εάν σκεφθή και τις πολλές της αμαρτίες και την πολλή ευσπλαγχνία του Θεού!  Όταν βλέπη ο άνθρωπος την φροντίδα του Θεού, αν έχουν καθαρίσει τα μάτια της ψυχής του, αισθάνεται και ζη όλη την θεία πρόνοια με την ξεφλουδισμένη ευαίσθητη καρδιά του και διαλύεται πια από ευγνωμοσύνη· παλαβώνει με την καλή έννοια. Γιατί οι δωρεές του Θεού, όταν ο άνθρωπος τις αισθάνεται, δημιουργούν ρωγμή στην καρδιά του, την ραγίζουν. Έπειτα, καθώς το χέρι του Θεού χαϊδεύει την φιλότιμη καρδιά του και εγγίζει την ρωγμή, τινάζεται εσωτερικά ο άνθρωπος και μεγαλώνει η ευγνωμοσύνη του προς τον Θεό. Όσοι αγωνίζονται και συναισθάνονται την αμαρτωλότητά τους και τις ευεργεσίες του Θεού και εμπιστεύονται τον εαυτό τους στην μεγάλη Του ευσπλαγχνία, ανεβάζουν την ψυχή τους στον Παράδεισο με πολλή σιγουριά και με λιγώτερο κόπο σωματικό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ευγνωμοσύνη προς τον Θεό και για το λίγο και για το πολύ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικοί λένε «πιστεύω ότι ο Θεός θα με βοηθήση», και από την άλλη προσπαθούν να μαζεύουν χρήματα, για να μη στερηθούν τίποτε. Αυτοί εμπαίζουν τον Θεό, γιατί δεν εμπιστεύονται τον εαυτό τους στον Θεό αλλά στα χρήματα. Αν δεν παύσουν να αγαπούν τα χρήματα και να στηρίζουν σ᾿ αυτά την ελπίδα τους, δεν θα μπορέσουν να στηρίξουν την ελπίδα τους στον Θεό. Δεν λέω να μην έχουν οι άνθρωποι μια οικονομία στην άκρη για ώρα ανάγκης, αλλά να μη στηρίζουν την ελπίδα τους στα χρήματα και δίνουν σ́ αυτά την καρδιά τους, γιατί έτσι ξεχνούν τον Θεό. Όποιος κάνει σχέδια δικά του, χωρίς να εμπιστεύεται στον Θεό, και λέει μετά ότι έτσι θέλει ο Θεός, αυτός ευλογεί το έργο του ταγκαλακίστικα και συνέχεια βασανίζεται. Δεν έχουμε καταλάβει την δύναμη και την καλωσύνη του Θεού. Δεν Τον αφήνουμε νοικοκύρη να μας κυβερνάη, γι' αυτό ταλαιπωρούμαστε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο Σινά, εκεί στο ασκητήριο της Αγίας Επιστήμης όπου έμενα, το νερό ήταν ελάχιστο. Μιά–μιά σταγόνα έτρεχε από έναν βράχο μέσα σε μια σπηλιά, καμμιά εικοσαριά μέτρα μακριά από το ασκητήριο. Είχα κάνει μια στερνίτσα και μάζευα τρία κιλά νερό το εικοσιτετράωρο. Όταν πήγαινα να πάρω νερό, έβαζα το τενεκάκι να γεμίση και έλεγα τους Χαιρετισμούς της Παναγίας. Έβρεχα με το χέρι μου λιγάκι μόνον το μέτωπο, γιατί αυτό με βοηθούσε – μου το είχε πει ένας γιατρός να το κάνω – έπαιρνα λίγο νερό, για να έχω να πιώ, μάζευα και λίγο σε ένα τενεκάκι για τα πουλάκια και τα ποντικάκια που είχε το ασκητήριο. Αυτό το νερό ήταν και για να πλύνω ένα ρούχο κ.λπ. Τί χαρά, τί ευγνωμοσύνη ένιωθα γι᾿ αυτό το λίγο νερό που είχα! Δοξολογία, γιατί είχα νερό! Όταν  ήρθα στο Άγιον Όρος και έμεινα για λίγο καιρό στην Σκήτη των Ιβήρων, επειδή εκεί είναι προσήλιο το μέρος, είχε πολύ νερό. Είχε μια στέρνα που ξεχείλιζε και το νερό έτρεχε απ' έξω. Ού, έπλενα και τα πόδια και το κεφάλι..., αλλά είχα ξεχασθή. Στο Σινά βούρκωναν τα μάτια μου από ευγνωμοσύνη για το λίγο νερό, ενώ στην Σκήτη ξεχάσθηκα από την αφθονία του νερού. Γι᾿ αυτό έπειτα πήγα και έμεινα καμμιά ογδονταριά μέτρα πιο μακριά και είχα μια στέρνα μικρή. Πώς χάνεται, πώς ξεχνιέται κανείς με την αφθονία!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πρέπει να αφήσουμε εν λευκώ τον εαυτό μας στην θεία πρόνοια, στο θείο θέλημα, και ο Θεός θα μας φροντίση. Ένας μοναχός πήγε ένα απόγευμα να διαβάση τον Εσπερινό σε μια κορυφή. Στον δρόμο βρήκε ένα άσπρο μανιτάρι και ευχαρίστησε τον Θεό για το σπάνιο εύρημά του. Στον γυρισμό θα το έκοβε και θα περνούσε με αυτό το βράδυ. «Εάν με ρωτήσουν οι κοσμικοί αν τρώω κρέας, είπε με τον λογισμό του, μπορώ να τους πω πώς τρώω κάθε φθινόπωρο»! Στην επιστροφή βρήκε μισό το μανιτάρι – κάποιο ζώο θα το είχε πατήσει – και είπε: «Φαίνεται, τόσο έπρεπε να φάω». Το πήρε και ευχαρίστησε τον Θεό για την πρόνοιά Του, για το μισό μανιτάρι. Πιό κάτω βρήκε ένα άλλο μισό μανιτάρι και έσκυψε να το πάρη, για να συμπληρώση το βραδινό του, αλλά, επειδή ήταν χαλασμένο – ίσως να ήταν δηλητηριώδες –, το άφησε και ευχαρίστησε πάλι τον Θεό που τον φύλαξε από δηλητηρίαση. Πήγε στην Καλύβη του και πέρασε το βράδυ με το μισό μανιτάρι. Την άλλη μέρα, όταν βγήκε από την Καλύβη του, αντίκρισε ένα θέαμα! Όλος ο τόπος ήταν γεμάτος από ωραία μανιτάρια, και ευχαρίστησε τον Θεό. Βλέπετε, ευχαρίστησε τον Θεό και για το ολόκληρο και για το μισό, και για το καλό και για το χαλασμένο, και για το ένα και για τα πολλά. Ευχαριστία για όλα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός μας δίνει άφθονες ευλογίες και ενεργεί πάντα για το καλό μας. Όλα τα αγαθά που έχουμε είναι δώρα του Θεού. Όλα τα έκανε, για να εξυπηρετούν το πλάσμα Του, τον άνθρωπο, και να θυσιάζωνται γι' αυτόν, από ζώα και πτηνά, μικρά και μεγάλα, μέχρι φυτά, – ακόμη και ο ίδιος ο Θεός θυσιάσθηκε, για να λυτρώση τον άνθρωπο. Ας μην αδιαφορούμε για όλα αυτά και Τον πληγώνουμε με την μεγάλη μας αχαριστία και αναισθησία, αλλά να Τον ευχαριστούμε και να Τον δοξολογούμε.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Η πίστη και η εμπιστοσύνη στον Θεό
- type: h2
  initial:
    ru: ''
  text:
    ru: Να πιστέψουμε φιλότιμα στον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, στενοχωριέμαι για τους λογισμούς απιστίας που έχω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το ότι στενοχωριέσαι και δεν τους δέχεσαι, σημαίνει ότι αυτοί οι λογισμοί είναι από τον πονηρό. Μερικές φορές ο Χριστός επιτρέπει να έχουμε λογισμούς αμφιβολίας ή απιστίας, για να δη την διάθεση και το φιλότιμό μας. Ο δικός μας όμως Θεός δεν είναι μύθος όπως ο Δίας, ο Απόλλων κ.λπ. Η θρησκεία μας είναι αληθινή, ζωντανή. Έχουμε νέφος Αγίων, όπως αναφέρει και ο Απόστολος Παύλος[163], οι οποίοι γνώρισαν τον Χριστό, Τον έζησαν από κοντά και θυσιάσθηκαν γι᾿ Αυτόν. Και στην εποχή μας υπάρχουν άνθρωποι αφιερωμένοι στον Θεό που ζουν ουράνιες καταστάσεις και έχουν επαφή με Αγγέλους, με Αγίους, ακόμη και με τον Χριστό και την Παναγία. Και θα σού πω κάτι από τον εαυτό μου, για να σε βοηθήσω. Βλέπεις, γίνομαι και εγώ... αιμοδότης· φανερώνω ορισμένα γεγονότα, για να βοηθήσω. Όπου βλέπω θησαυρισμένη γνώση και παραγκωνισμένη πίστη, την πίστη θέλω να ενισχύσω, γι᾿ αυτό και λέω μερικά γεγονότα πίστεως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ήμουν μικρός, στην Κόνιτσα, διάβαζα πολλούς βίους Αγίων και έδινα και στα άλλα παιδιά να διαβάσουν ή τα μάζευα και διαβάζαμε μαζί. Θαύμαζα την μεγάλη άσκηση και τις νηστείες που έκαναν οι Άγιοι και προσπαθούσα να κάνω και εγώ ό,τι έκαναν εκείνοι. Από την νηστεία ο λαιμός μου είχε γίνει σαν το κοτσάνι από το κεράσι. Τα παιδιά με πείραζαν. «Θα πέση το κεφάλι σου!», μου έλεγαν. Τί τραβούσα! Τέλος πάντων. Από την άλλη, ο μεγάλος μου αδελφός, επειδή αρρώσταινα από τις νηστείες και φοβόταν μήπως δεν τελειώσω το σχολείο, μου έπαιρνε τα Συναξαράκια των Αγίων που διάβαζα. Μετά τα έκρυβα στο δάσος, στο εξωκλήσι της Αγίας Βαρβάρας, και πήγαινα εκεί κρυφά και διάβαζα. Μια μέρα κάποιος γείτονας, ονόματι Κώστας, είπε στον αδελφό μου: «Θα τον κάνω εγώ να αλλάξη μυαλό, να πετάξη αυτά τα βιβλία που διαβάζει και να αφήση και τις νηστείες και τις προσευχές». Με βρήκε λοιπόν – ήμουν περίπου δεκαπέντε χρονών τότε – και άρχισε να μου λέη την θεωρία του Δαρβίνου. Έλεγε-έλεγε, ώσπου με ζάλισε. Έτσι όπως ήμουν ζαλισμένος, πήγα κατ᾿ ευθείαν στο δάσος, στο εξωκλήσι της Αγίας Βαρβάρας. Μπήκα μέσα και άρχισα να παρακαλώ τον Χριστό. «Χριστέ μου, αν υπάρχης, να μου παρουσιασθής», έλεγα και έκανα συνέχεια για πολλή ώρα μετάνοιες. Ήταν καλοκαίρι. Ο ιδρώτας έτρεχε, είχα γίνει μούσκεμα· είχα αποκάμει τελείως. Αλλά ούτε είδα ούτε άκουσα τίποτε. Ούτε ο Θεός να με οικονομήση λίγο, έστω με ένα μικρό σημείο, κάποιον κρότο, κάποια σκιά· παιδί ήμουν στο κάτω-κάτω. Και αν το έβλεπε κανείς ανθρωπίνως ή με την λογική, θα έλεγε: «Κρίμα, Θεέ μου, το ταλαίπωρο! Από έντεκα χρονών ανέβαινε στα βράχια, έκανε τέτοια άσκηση, και τώρα περνάει μια κρίση. Το ζάλισε ο άλλος με κάτι ανόητες θεωρίες. Μέσα στο σπίτι έχει δυσκολίες από τον αδελφό του. Έφυγε στο δάσος, για να Σού ζητήση βοήθεια...». Όμως τίποτε-τίποτε-τίποτε! Αποκαμωμένος από τις πολλές μετάνοιες κάθησα λίγο κάτω. Τότε σκέφθηκα: «Καλά, όταν ρώτησα τον Κώστα τί γνώμη έχει εκείνος για τον Χριστό, τί μου είπε; «Ήταν ο πιο καλός, ο πιο δίκαιος άνθρωπος, μου είχε πεί, καί, επειδή κήρυττε δικαιοσύνη, θίχτηκαν τα συμφέροντα των Φαρισαίων και Τον σταύρωσαν από φθόνο"». Τότε είπα: «Αφού ο Χριστός ήταν τόσο καλός άνθρωπος, τόσο δίκαιος, και δεν είχε παρουσιασθή ποτέ άλλος όμοιός Του, και οι άλλοι από φθόνο και κακία Τον θανάτωσαν, αξίζει γι᾿ Αυτόν τον άνθρωπο να κάνω περισσότερα από όσα έκανα, ακόμη και να πεθάνω». Μόλις το αντιμετώπισα έτσι, παρουσιάσθηκε ο Χριστός μέσα σε πολύ φως – έλαμψε το εκκλησάκι – και μου είπε: «Εγώ ειμι η Ανάστασις και η ζωή, ο πιστεύων εις εμέ, καν αποθάνη, ζήσεται»[164]. Τα λόγια αυτά διάβαζα και στο ανοιχτό Ευαγγέλιο, το οποίο κρατούσε στο ένα χέρι. Μου έκανε τέτοια αλλοίωση εσωτερική, που έλεγα συνέχεια: «Έλα τώρα εδώ, Κώστα, να τα πούμε, αν υπάρχη ή δεν υπάρχη Θεός». Βλέπεις, ο Χριστός, για να παρουσιασθή, περίμενε την δική μου φιλότιμη αντιμετώπιση. Και αν από ένα παιδί ζητά την φιλότιμη αντιμετώπιση, πόσο μάλλον από έναν μεγάλο;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικοί, Γέροντα, αμφισβητούν όλη την θεία Οικονομία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μά πώς μπορεί να θεωρηθή παραμύθι όλη αυτή η ιστορία με τον Χριστό; Τόσα που διαβάζουμε στους Προφήτες που έζησαν επτακόσια χρόνια προ Χριστού και μιλούν με τόσες λεπτομέρειες για τον Χριστό, αυτό δεν τους προβληματίζει; Η Παλαιά Διαθήκη αναφέρει ακριβώς ακόμη και για πόσα χρήματα θα προδώσουν τον Χριστό[165]. Ύστερα λέει ότι τα χρήματα αυτά δεν θα τα βάλουν οι Εβραίοι στο ταμείο του Ναού, γιατί θα είναι αντίτιμο αίματος, αλλά θα αγοράσουν ένα χωράφι, για να θάβουν τους ξένους[166]. Εκπληρώθηκε η προφητεία του Προφήτη Ζαχαρία κ.ά. Τόσο ξεκάθαρα πράγματα! Μέχρι τέτοιο σημείο λεπτομέρειες! Ακόμη και για τα ιμάτιά Του αναφέρει τί θα γίνουν[167]! Και όλα αυτά λέχθηκαν τόσα χρόνια πριν από την Γέννηση του Χριστού. Πώς λοιπόν εγώ να φέρω λογισμό απιστίας; Βλέπουμε ύστερα τον Απόστολο Παύλο! Διώκτης ήταν. Πήγαινε στην Δαμασκό για άλλον σκοπό. Του παρουσιάζεται ο Χριστός και του λέει: «Σαούλ, Σαούλ, τί με διώκεις;». «Ποιός είσαι, κύριε;», ρωτάει εκείνος. «Εγώ είμαι ο Χριστός,  που εσύ καταδιώκεις». Και μετά πληροφορεί τον Ανανία ο Χριστός και τον βαπτίζει[168]! Και στην συνέχεια πόσο ταλαιπωρήθηκε, πόσο αγωνίσθηκε ο Απόστολος Παύλος, για να κηρύξη σε όλα τα έθνη! Ύστερα πόσοι Μάρτυρες! Έντεκα εκατομμύρια Μάρτυρες! Αυτοί όλοι χαμένο το είχαν; Πώς να τα ξεχάση κανείς όλα αυτά; Αν διαβάση λίγο το Ευαγγέλιο, μπορεί να μην πιστέψη; Και αν υπήρχαν μερικές λεπτομέρειες ακόμη, αυτό πολύ θα βοηθούσε να πιστέψουν όλοι οι άνθρωποι. Αλλά ο Θεός σκόπιμα δεν το επέτρεψε, για να κοσκινισθούν οι άνθρωποι, για να δη πόσοι Τον αγαπούν, πόσοι θυσιάζονται γι᾿ Αυτόν, χωρίς να περιμένουν θαύματα κ.λπ. Έναν φιλότιμο άνθρωπο, νομίζω, δεν τον αγγίζουν, δεν τον επηρεάζουν όσα βλάσφημα και αν ακούση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να πιστέψη κανείς στον Θεό φιλότιμα, όχι να θέλη θαύμα, για να πιστέψη. Όταν βλέπω μεγάλους να μου ζητούν να δούν κανένα θαύμα, για να πιστέψουν, ξέρεις πώς γίνομαι; Να ήταν μικροί, θα είχαν κάποια δικαιολογία λόγω της ηλικίας· αλλά αυτοί να μην έχουν κάνει τίποτε για τον Χριστό και να λένε «νά δούμε κάτι, για να πιστέψουμε», αυτό είναι πολύ φθηνό πράγμα. Μήπως, και θαύμα να δούν, θα βοηθηθούν; Θα πούν ότι είναι μαγεία κ.λπ.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Πρόσθες ημίν πίστιν»[169]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί διέκρινε μερικούς Αγίους, παλαιούς και νέους, και ήξεραν πότε θα πεθάνουν, πότε θα γίνη το τάδε γεγονός κ.λπ.;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το πολύ φιλότιμο, η μεγάλη απλότητα, η ταπείνωση και η πίστη. Δεν έβαζαν στην ζωή τους την λογική που κλονίζει την πίστη. Μεγάλο πράγμα η πίστη! Βλέπετε, και ο Απόστολος Πέτρος με την πίστη βάδισε πάνω στα κύματα. Μόλις όμως μπήκε η λογική, άρχισε να βουλιάζη[170]. Σάς έχω πει για τον πατέρα Χαράλαμπο[171]που ζούσε πριν από λίγα χρόνια στην Μονή Κουτλουμουσίου; Ήταν πολύ απλός, εργατικός και πνευματικός μοναχός. Όταν γέρασε, μια βαρειά γρίππη τον έρριξε στο κρεββάτι και ο γιατρός είπε στους Πατέρες να μην απομακρυνθούν από κοντά του, γιατί σε λίγη ώρα θα τελειώση η ζωή του. Ο πατήρ Χαράλαμπος, όταν το άκουσε κάτω από τις κουβέρτες, απάντησε: «Τί λές; Εγώ δεν πεθαίνω, εάν δεν έρθη το Πάσχα να πω το «Χριστός Ανέστη«». Πράγματι, πέρασαν δύο μήνες σχεδόν, ήρθε το Πάσχα, είπε το «Χριστός Ανέστη», κοινώνησε και μετά αναπαύθηκε. Το φιλότιμο αυτό απλό γεροντάκι είχε γίνει πραγματικό παιδί του Θεού και μαζί με τον Θεό καθόρισε την ημέρα του θανάτου του!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η πίστη πώς δυναμώνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την προσευχή δυναμώνει η πίστη. Ένας άνθρωπος που δεν καλλιέργησε την πίστη του από μικρός, αλλά έχει διάθεση, μπορεί να την καλλιεργήση με την προσευχή, ζητώντας από τον Χριστό να του προσθέση πίστη. Να παρακαλούμε τον Χριστό να μας προσθέση πίστη και να μας την αυξήση. Στον Χριστό τί είπαν οι Απόστολοι; «Πρόσθες ημίν πίστιν» δεν είπαν; Όταν λές «πρόσθες», σημαίνει ότι εμπιστεύεσαι τον εαυτό σου στον Θεό. Γιατί, αν δεν εμπιστεύεται κανείς τον εαυτό του στον Θεό, τί να του προσθέση ο Θεός; Ζητάμε από τον Θεό να μας προσθέση πίστη, όχι για να κάνουμε θαύματα, αλλά για να Τον αγαπήσουμε περισσότερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να αυξηθή η πίστη στον Θεό, όλα βοηθούν· και τα λουλούδια και οι ακρίδες και τα αστέρια και οι κεραυνοί ακόμη. Όλοι τα βλέπουμε αυτά, αλλά όλοι δεν βοηθιόμαστε, γιατί δεχόμαστε τα «τηλεγραφήματα», τους λογισμούς που μας φέρνει ο εχθρός. Π.χ. αν δεν υπήρχε το αλάτι, θα βρωμούσε η θάλασσα. Όποιος όμως το εξετάζει στο εργαστήρι του, χωρίς πίστη, δεν βοηθιέται, γιατί δεν καθάρισε την καρδιά του από τα άλατα. Αν εργασθή κανείς με φιλότιμο, με καλό λογισμό, ακόμη και τα πιο ανάποδα τα βλέπει με άλλο μάτι, με θείο φωτισμό, και δοξάζει τον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όλα να μας ανεβάζουν στον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μας έχετε πει όλα να μας ανεβάζουν προς τα πάνω, προς τον Θεό. Πώς θα το πετύχουμε αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν τα αξιοποιήτε όλα προς το καλό. Όλα αν τα στρέψη στα πνευματικά κανείς, ξέρετε τί πνευματικό κέρδος βγάζει και τί πνευματική πείρα αποκτάει; Πιάνεις λ.χ. το τσιμέντο, μπορείς να βρής τον Θεό! Πιάνεις το τούβλο, μπορείς να πιάσης τον Θεό! Πιάνεις αυτό, να πιάσης τον Θεό! Πιάνεις εκείνο, να πιάσης τον Θεό! Πιάνεις το άλλο, να πιάσης τον Θεό! Ναί, με όλα να πιάνετε τον Θεό! Αν δεν δουλεύη κανείς έτσι, αν μέσα από όλα δεν βλέπη τον Θεό, βάλ᾿ τον μέσα στην Εκκλησία, θα είναι μακριά από τον Θεό. Δώσ᾿ του ψαλτικά να ψάλη, θα είναι μακριά από τον Θεό. Δώσ᾿ του βιβλίο πνευματικό να διαβάση, πάλι θα είναι μακριά από τον Θεό. Ό,τι πνευματικό κι αν του δώσης να κάνη, δεν τον πάει στον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Καθένας, οτιδήποτε βλέπει, οτιδήποτε φτιάχνει, είτε ράβει είτε κεντάει, όλα να τα αξιοποιή πνευματικά. Λουλούδια βλέπει; Είδε τον Θεό. Γουρούνια βλέπει; Ναί, βρέ παιδί, πάλι είδε τον Θεό! Θα πής: «Από το γουρούνι μπορώ να δώ τον Θεό;». Ναί, από το γουρούνι. Βλέπεις πώς το έχει κάνει ο Καλός Θεός! Του έχει δώσει ένα ρύγχος, να σκάβη στο χώμα και να βρίσκη τους βολβούς μέσα στην γή, χωρίς να βλέπη. Η μύτη του να είναι έτσι, που να μην κόβεται, όταν συναντάη ξυράφια, γυαλιά, αγκάθια κ.λπ.! Όχι μόνον όταν βλέπη κανείς ένα όμορφο και ευωδιαστό λουλούδι, να λέη «μέ τί σοφία το δημιούργησε ο Θεός!», αλλά και όταν βλέπη το γουρούνι, και εκεί να βλέπη τον Θεό! Και αν σκεφθώ ότι ο Θεός μπορούσε να με κάνη γουρούνι και με έκανε άνθρωπο! Σάς φαίνεται παράξενο; Δεν μπορούσε να μας είχε κάνει γουρούνια ο Θεός; Οι κυνηγοί τραυματίζουν το αγριογούρουνο και πολλές φορές δεν το βρίσκουν. Πάνε μετά τα αγρίμια και το τρώνε το καημένο ζωντανό! Ιατρική περίθαλψη δεν έχει και βασανίζεται, παρόλο που τον Δημιουργό του δεν Τον έχει πληγώσει. Ενώ ο άνθρωπος και τον Δημιουργό του Τον έχει πληγώσει και Τον πληγώνει συνέχεια και έχει και αχαριστία πολλές φορές. Γι'' αυτό λέω να δουλεύετε σωστά. Πόσο καλά τα έκανε όλα ο Θεός! Τί δύναμη δίνει ο Θεός και στα ζώα! Λέει ο γιατρός: «Για να έχης γερούς μύς, να τρώς κρέας». Και βλέπεις, οι ταύροι χόρτο τρώνε, οι καημένοι, και όμως έχουν κάτι... μπράτσα! Εκεί δεν βλέπεις τον Θεό; Μόνο με χόρτο δηλαδή που τρώνε τους δυναμώνει ο Θεός. Πόσο μάλλον τον άνθρωπο! Το καταλάβατε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν κανείς δουλεύη με αυτόν τον τρόπο, φθάνει σε μια κατάσταση να βοηθιέται όχι μόνον από τους Αγίους αλλά και από τους αμαρτωλούς. Ο Άγιος μας ενισχύει με το άγιο παράδειγμά του. Ο αμαρτωλός μας συγκρατεί με την πτώση του, μας βάζει χαλινό· μας φρενάρει, όχι για να μην ξεπέσουμε στα μάτια των άλλων, αλλά για να μη λυπήσουμε τον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η δύναμη της πίστεως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιό είναι το σφράγισμα του Αρνίου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το Αρνίο ποιό είναι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Χριστός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το σφράγισμά Του ποιό είναι; Όταν ο Χριστιανός βαπτίζεται, τον σφραγίζει ο ιερεύς σταυρωτά στο μέτωπο με το άγιο Μύρο λέγοντας: «Σφραγίς δωρεάς Πνεύματος Αγίου». Ύστερα, κάθε φορά που κάνει τον σταυρό του ο Χριστιανός, προσκυνάει το σωτήριο Πάθος του Κυρίου και επικαλείται την δύναμη του Σταυρού, που είναι η δύναμη του σταυρικού θανάτου του Χριστού μας. Όταν λέμε «Σταυρέ του Χριστού, σώσον ημάς τη δυνάμει σου», επικαλούμαστε την δύναμη της σταυρικής θυσίας του Κυρίου. Γι᾿ αυτό έχει μεγάλη δύναμη ο Σταυρός. Αν λ.χ. βρέχη και πέφτουν κεραυνοί, μπορεί έναν μεγάλο σιδερένιο σταυρό σε ένα καμπαναριό να τον χτυπήση ο κεραυνός. Αν όμως είναι εκεί κάτω ένας Χριστιανός που έχει ένα τόσο μικρό σταυρουδάκι και πη «Σταυρέ του Χριστού, σώσόν με τη δυνάμει σου», δεν τον χτυπάει ο κεραυνός. Εκεί λειτουργούν οι φυσικοί νόμοι και πέφτει ο κεραυνός πάνω στον σταυρό και τον ρίχνει κάτω. Εδώ φυλάει τον πιστό ένα τόσο δά σταυρουδάκι, γιατί επικαλέσθηκε την δύναμη του Σταυρού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί, ενώ ζητώ κάτι με πίστη, δεν το δίνει ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πιστεύεις, ζητάς, αλλά, αν δεν έχης ταπείνωση ή έχης προδιάθεση υπερηφανείας, δεν δίνει ο Θεός. Μπορεί να έχη κανείς πίστη όχι μόνο σαν έναν «κόκκον σινάπεως»[172]αλλά και σαν ένα κιλό σινάπι. Εάν όμως δεν έχη και ανάλογη ταπείνωση, δεν ενεργεί ο Θεός, γιατί δεν θα τον ωφελήση. Όταν υπάρχη υπερηφάνεια, δεν ενεργεί η πίστη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν κανείς πορεύεται στην ζωή του με πίστη, χωρίς αμφιβολία, και ζητάη την βοήθεια του Θεού, θα έχη σιγά-σιγά στην αρχή γεγονότα μικρά και ύστερα μεγαλύτερα, και θα γίνη πιο πιστός. Ζώντας τα θεία μυστήρια από κοντά, γίνεται θεολόγος, διότι δεν τα πιάνει με το μυαλό, αλλά τα ζη στην πραγματικότητα. Η πίστη του συνέχεια αυξάνει, γιατί κινείται σε άλλο χώρο, με θεία γεγονότα. Για να ζήση όμως κανείς τα μυστήρια του Θεού, πρέπει να απεκδυθή τον παλαιό του άνθρωπο, να επανέλθη κατά κάποιον τρόπο στην κατάσταση προ της πτώσεως. Να έχη αθωότητα και απλότητα, για να είναι η πίστη του ακλόνητη και να πιστεύη απόλυτα ότι δεν υπάρχει τίποτε που να μην μπορή να το κάνη ο Θεός. Τότε, όταν ακούη για έναν άνθρωπο που δεν πιστεύει ή αμφιβάλλει για μερικά πράγματα που έχουν σχέση με την βοήθεια του Θεού, ξέρετε πόσο υποφέρει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν πιστεύη κανείς, μπορεί με την προσευχή του να αλλάξη την πορεία μιας καταστάσεως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν έχη μεγάλη πίστη, πολλά πράγματα μπορεί να αλλάξη. Ακόμη και μέσα σε χείμαρρο αν έχη χτίσει το σπίτι του και ο χείμαρρος κατεβάση πολύ νερό, αν πιστεύη πολύ και παρακαλέση με θέρμη τον Θεό, ο χείμαρρος θα γυρίση ανάποδα. Πρέπει όμως να έχη τέτοια πίστη πού, αν ακούση, ας υποθέσουμε, ότι έγινε θαύμα, άδειασε η θάλασσα και την οργώνουν με τρακτέρ και κουβαλούν τα ψάρια με φορτηγά, να το πιστέψη. Ούτε καν θα πάη να δή. Ακόμη και σε εκατό μέτρα απόσταση να μένη από την θάλασσα και να μην την βλέπη από ᾿κεί που βρίσκεται, δεν πάει να διαπιστώση αν είναι αλήθεια, γιατί δεν αμφιβάλλει. Ξέρει ότι όλα είναι δυνατά για τον Θεό, ότι η θεία δύναμη δεν περιορίζεται, και γι᾿ αυτό δεν ενδιαφέρεται παραπάνω. Τόση πίστη έχει. Μόνον ο αληθινά πιστός ζη αληθινά και είναι πραγματικά άνθρωπος του Θεού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η εμπιστοσύνη στον Θεό έχει μητέρα την πίστη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νιώθω μια ανασφάλεια, έχω άγχος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ασφαλίσου, βρέ παιδάκι μου, στον Θεό. Μόνον την ασφάλεια του αυτοκινήτου ξέρεις; Την ασφάλεια του Θεού δεν την ξέρεις; Κάνε τον σταυρό σου καί, πριν κάνης οτιδήποτε, πές: «Χριστέ μου, Παναγία μου, βοήθησέ με». Υπάρχει μεγαλύτερη ασφάλεια από την εμπιστοσύνη στον Θεό; Όταν ο άνθρωπος εμπιστεύεται τον εαυτό του στον Θεό, δέχεται συνέχεια από τον Θεό βενζίνη «σούπερ» και το πνευματικό του όχημα δεν σταματάει ποτέ· τρέχει συνέχεια. Όσο μπορείς, να προσέχης, να προσεύχεσαι και να εμπιστεύεσαι στον Θεό, και Εκείνος θα σε βοηθήση σε κάθε σου δυσκολία. Απλοποίησε την ζωή σου με την απόλυτη εμπιστοσύνη στον Θεό, για να  ελευθερωθής από το άγχος και την αγωνία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μου λένε να κάνω κάτι, ξεκινώ πάντα με έναν φόβο και έναν δισταγμό, και τελικά μπορεί από τον φόβο μου να μην το κάνω όπως πρέπει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να κάνης τον σταυρό σου, καλό μου παιδί, και να το κάνης αυτό που σού λένε. Αν πής «Δι᾿ ευχών των Αγίων Πατέρων ημών», τόσοι Άγιοι είναι, ένας από αυτούς δεν θα σε βοηθήση; Να μη χάνης ποτέ την εμπιστοσύνη σου στον Θεό. Μη σφίγγεσαι με την στενή σου ανθρώπινη λογική και βασανίζεσαι και εμποδίζεις την θεία βοήθεια. Η εμπιστοσύνη του εαυτού σου και της εργασίας σου στον Θεό, μετά από την ανθρώπινη συνετή ενέργειά σου, πολύ θα σε βοηθήση, αλλά θα βοηθήση και τους άλλους. Είναι μεγάλο πράγμα η εμπιστοσύνη στον Θεό. Μια φορά ήταν να μου πάρουν αίμα. Ήταν τέσσερις γιατρέσσες. Έρχεται η πρώτη, με παίδεψε· δεν μπόρεσε να βρη φλέβα. Έρχεται η δεύτερη, τα ίδια. Έρχεται η τρίτη, που ήταν και ειδικευμένη σε αυτό, τίποτε. Εκείνη την ώρα περνούσε και η τέταρτη γιατρέσσα. Είδε που με παίδευαν και ήρθε να δοκιμάση και αυτή. Έκανε πρώτα τον σταυρό της και αμέσως βρήκε φλέβα, γιατί ζήτησε την βοήθεια του Θεού. Οι άλλες κατά κάποιον τρόπο είχαν εμπιστοσύνη μόνο στον εαυτό τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μεγάλη υπόθεση να αφήνεται κανείς στα χέρια του Θεού! Οι άνθρωποι βάζουν στόχους και προσπαθούν να τους επιτύχουν, χωρίς να αφουγκράζωνται ποιό είναι το θέλημα του Θεού και χωρίς να συμμορφώνωνται προς αυτό. Πρέπει να αφεθούμε με εμπιστοσύνη στον Θεό να κατευθύνη τα πράγματα και εμείς να κάνουμε το χρέος μας με φιλότιμο. Αν ο άνθρωπος δεν εμπιστευθή στον Θεό, ώστε να εγκαταλείψη τελείως τον εαυτό του στα χέρια Του, θα βασανίζεται. Οι άνθρωποι συνήθως καταφεύγουν πρώτα στην ανθρώπινη παρηγοριά καί, όταν απογοητευθούν από τους ανθρώπους, τότε καταφεύγουν στον Θεό. Αν όμως θέλουμε να μη βασανιζώμαστε, να ζητούμε την θεία παρηγοριά, γιατί αυτή είναι και η μόνη αληθινή παρηγοριά. Δεν φθάνει η πίστη[173]στον Θεό· χρειάζεται και η εμπιστοσύνη στον Θεό. Η εμπιστοσύνη στον Θεό ελκύει την βοήθειά Του. Ο Χριστιανός πιστεύει και εμπιστεύεται τον εαυτό του στον Θεό μέχρι θανάτου, και τότε βλέπει καθαρά το χέρι του Θεού που τον σώζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Απόστολος Παύλος λέει ότι πίστη είναι να πιστεύουμε στα μη βλεπόμενα, όχι απλώς στα βλεπόμενα[174]. Όταν αναθέτουμε το μέλλον μας στον Θεό, Τον υποχρεώνουμε να μας βοηθήση. Η απόλυτη εμπιστοσύνη στα χέρια του Θεού έχει μητέρα την πίστη, με την οποία προσεύχεται κανείς μυστικά και απολαμβάνει τους καρπούς της ελπίδος. Είναι μία συνεχής προσευχή και φέρνει θεία αποτελέσματα την ώρα που πρέπει. Τότε φυσικά ο άνθρωπος ζη αγγελική ζωή και ξεσπάει σε δοξολογία: «Άγιος, Άγιος, Άγιος Κύριος Σαβαώθ»[175]. Γιατί ο άνθρωπος μπορεί να κάνη την ζωή του παραδεισένια, εάν έχη εμπιστοσύνη στον Θεό, Τον δοξάζη για όλα και δέχεται να τον κυβερνάη σαν καλός Πατέρας. Διαφορετικά, κάνει την ζωή του κόλαση. Είναι μεγάλο πράγμα να νιώθη ο άνθρωπος από τούτη την ζωή ένα μέρος της χαράς του Παραδείσου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όσον αφορά στην σωματική ή την ψυχική υγεία, μέχρι ποιό σημείο πρέπει να αφήνη κανείς τον εαυτό του στα χέρια του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εμπιστεύεται κανείς πρώτα τον Θεό, και μετά από τον Θεό, θα εμπιστευθή και τον κατάλληλο άνθρωπο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πίστη και αγάπη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί σχέση υπάρχει ανάμεσα στην πίστη και την αγάπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρώτα είναι η πίστη και μετά έρχεται η αγάπη. Πρέπει να πιστεύη κανείς, για να αγαπάη. Δεν μπορεί να αγαπήση κάτι που δεν το πιστεύει. Γι' αυτό, για να αγαπήσουμε τον Θεό, πρέπει να πιστέψουμε στον Θεό. Ανάλογη με την πίστη που έχει κανείς είναι και η ελπίδα και η αγάπη και η θυσία για τον Θεό και τον πλησίον. Η θερμή πίστη στον Θεό γεννάει την θερμή αγάπη προς τον Θεό και προς την εικόνα του Θεού, τον συνάνθρωπό μας. Και από την υπερχείλιση της αγάπης μας – που δεν χωράει στην καρδιά και χύνεται έξω – ποτίζονται και τα καημένα τα ζώα. Πιστεύουμε πολύ, αγαπάμε πολύ. Αν η πίστη μας είναι χλιαρή, και η αγάπη μας θα είναι χλιαρή. Αν η πίστη μας είναι θερμή, και η αγάπη μας θα είναι θερμή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η πίστη μας πρέπει να έχη φιλότιμο και από ᾿κεί ξεκινάει ο φιλότιμος αγώνας. Και όσο αγωνίζεται κανείς φιλότιμα, τόσο αυξάνει και η πίστη, αυξάνει και η αγάπη. Πολύ βοηθάει στον φιλότιμο αυτόν αγώνα να σκέφτεται ο άνθρωπος τις ευεργεσίες του Θεού. Ένας που έχει φιλότιμο δεν σκέφτεται αν υπάρχη ή δεν υπάρχη Παράδεισος, αλλά αγωνίζεται, γιατί πιστεύει στον Θεό και Τον αγαπάει. Ενώ ένας που δεν έχει φιλότιμο, θα αρχίση να σκέφτεται: «Και γιατί να αγωνισθώ; Άραγε υπάρχει Παράδεισος; Υπάρχει Κρίση;». Και όταν κανείς είναι αχάριστος, ό,τι και να τον κάνης, αχάριστος θα είναι. Ο φιλότιμος και στους πειρασμούς δοξολογεί τον Θεό, και σιγά-σιγά φθάνει να ευγνωμονή συνέχεια τον Θεό, οπότε έρχεται η θεία αλλοίωση στην ψυχή του και χαίρεται συνέχεια και αγάλλεται. Άλλος και πειρασμούς μπορεί να μην έχη, αλλά μόνον ευλογίες, και ποτέ να μην είναι ευχαριστημένος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μετά την αγάπη προς τον Θεό έρχεται η θυσία. Και όταν υπάρχη θυσία χωρίς ιδιοτέλεια, τότε αρχίζει κανείς να έχη και θεία γεγονότα. Να κάνω μια θυσία όχι για τίποτε άλλο, αλλά για τον Θεό που έφτιαξε αυτό το σύμπαν και μας δίνει τόσες ευλογίες. Βλέπεις, οι ειδωλολάτρες που θεοποιούσαν την φύση, λάτρευαν τον ήλιο, τα ποτάμια και έφθαναν να θυσιασθούν γι᾿ αυτή τους την πίστη. Αν λοιπόν εκείνοι θυσιάζονταν για την δημιουργία, πόσο μάλλον εμείς πρέπει να θυσιασθούμε για τον Δημιουργό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι δεν πιστεύουν και γι᾿ αυτό δεν θυσιάζονται. Όλη η αδιαφορία από ᾿κεί ξεκινάει. Άλλος βρίζει τα θεία, άλλος μισοπιστεύει και ταλαιπωρείται. Για να χαίρεται πραγματικά κανείς, πνευματικά, πρέπει να πιστεύη και να αγαπάη.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Χωρίς εμού ου δύνασθε ποιείν ουδέν»[176]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος, αν θέλη να μη βασανίζεται, πρέπει να πιστέψη στο «χωρίς εμού ου δύνασθε ποιείν ουδέν», που είπε ο Χριστός. Να απελπισθή δηλαδή από τον εαυτό του με την καλή έννοια και να πιστέψη στην δύναμη του Θεού. Όταν κανείς απελπισθή με την καλή έννοια από τον εαυτό του, τότε βρίσκει τον Θεό. «Την πάσαν ελπίδα μου εις σε ανατίθημι»[177]. Ακόμη και οι πιο πνευματικοί άνθρωποι δεν έχουν εξασφαλίσει την ζωή τους, γι' αυτό και κρατούν συνέχεια τον εαυτό τους στην ασφάλεια του Θεού, ελπίζουν στον Θεό και απελπίζονται μόνον από το «εγώ» τους, διότι το «εγώ» φέρνει στον άνθρωπο όλη την πνευματική δυστυχία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αυτοπεποίθηση είναι ο μεγαλύτερος και χειρότερος εχθρός μας, γιατί μας τινάζει ξαφνικά αλύπητα στον αέρα και μας αφήνει δυστυχισμένους στους δρόμους. Όταν ο άνθρωπος έχη αυτοπεποίθηση, δένεται και δεν μπορεί να κάνη τίποτε ή παλεύει μόνος του. Τότε επόμενο είναι να νικηθή από τον εχθρό ή να αποτύχη και να συντριβή το «εγώ» του. Ο Καλός Θεός πολλές φορές οικονομάει πολύ σοφά να δούμε και την θεία Του επέμβαση και την αποτυχία που είχαμε με την αυτοπεποίθησή μας. Όταν κανείς παρακολουθή και εξετάζη κάθε γεγονός που συμβαίνει στην ζωή του, αποκτάει πείρα, προσέχει και έτσι προοδεύει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Χριστός ζητούσε πρώτα την πίστη στην δύναμη του Θεού και ύστερα έκανε το θαύμα. «Αν πιστεύης στην δύναμη του Θεού, θα γιατρευθής»[178], έλεγε. Όχι όπως λένε λανθασμένα μερικοί σήμερα: «Ο άνθρωπος έχει δυνάμεις, και αν πιστεύη στις δυνάμεις του, μπορεί να κάνη τα πάντα. «Να πιστεύης» δεν λέει και το Ευαγγέλιο; Συμφωνούμε επομένως». Ναί, ο Χριστός έλεγε «πιστεύεις;», αλλά εννοούσε: «Πιστεύεις στον Θεό; Πιστεύεις ότι μπορεί ο Θεός;». Ζητούσε την διαβεβαίωση του ανθρώπου ότι πιστεύει στον Θεό, και τότε βοηθούσε. Πουθενά το Ευαγγέλιο δεν λέει να πιστεύω στον εγωισμό μου, αλλά να πιστεύω στον Θεό, ότι μπορεί ο Θεός να με βοηθήση, να με θεραπεύση. Αυτοί όμως τα παίρνουν ανάποδα και λένε: «Ο άνθρωπος έχει δυνάμεις και πρέπει να πιστεύη στον εαυτό του». Το να πιστεύη κανείς στον εαυτό του έχει ή εγωισμό ή δαιμονισμό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτοί οι άνθρωποι, όταν γίνεται ένα θαύμα, λένε ότι αυτό συνέβη, επειδή πίστευε ο άνθρωπος ότι θα γίνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πίσω από αυτήν την εγωιστική τοποθέτηση κρύβεται η ενέργεια του διαβόλου. Μπλέκουν αυτό που είπε ο Χριστός «πιστεύεις;» με το δικό τους «πιστεύω». Από εκεί ξεκινάει και όλος αυτός ο δαιμονισμός που υπάρχει στον κόσμο. Σού λένε μετά «νά μη σέβεσαι ούτε μεγάλο ούτε μικρό, για να αποκτήσης προσωπικότητα». Γι᾿ αυτό ακούς κάτι συνθήματα: «Πάτησέ τους, σύντριψέ τους, για να πετύχης». Ο σεβασμός θεωρείται κατεστημένο και ο διάβολος θριαμβεύει. Εδώ ένα παιδί, λίγο αν μιλήση με αναίδεια στους γονείς ή στους μεγαλυτέρους, το εγκαταλείπει η Χάρις του Θεού και δέχεται επιδράσεις δαιμονικές, πόσο μάλλον να το κάνη «τυπικό» αυτό ο άνθρωπος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος λέη ότι πιστεύει στον Θεό, αλλά δεν πιστεύη ότι ο Θεός μας προστατεύει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε κάνει τον εαυτό του θεό. Πώς πιστεύει στον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάνει κάθε πρωί τον σταυρό του κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτός λέει: «Πιστεύω στον Θεό, αλλά ο Θεός μας έδωσε μυαλό, για να μπορούμε να κάνουμε ό,τι θέλουμε». Ή λέει: «Είμαι θεός. Η Γραφή δεν λέει«θεοί εστε και υιοί Υψίστου πάντες»[179];». Δεν σκέφτεται ότι για να είναι κανείς κατά χάριν θεός, πρέπει να έχη Χάρη Θεού· αλλά με το μυαλό του κάνει τον εαυτό του θεό. Άλλο να έχη Χάρη Θεού και να γίνη κατά χάριν θεός, και άλλο να κάνη τον εαυτό του θεό. Αυτό είναι το μπέρδεμα: Τον εαυτό του τον κάνει θεό και τελικά καταλήγει να είναι άθεος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Θα έρθη καιρός που όλοι θα πιστέψουν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς συμβαίνει άνθρωποι πιστοί να φθάνουν στην αθεΐα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στο θέμα αυτό μπορεί να υπάρχουν δύο περιπτώσεις. Στην μία περίπτωση μπορεί να ήταν κανείς πολύ πιστός, να ενήργησε η δύναμη του Θεού στην ζωή του με πολλά χειροπιαστά γεγονότα, και ύστερα να έφθασε σε μια θόλωση στο θέμα της πίστεως. Αυτό συμβαίνει, όταν λ.χ. κάνη κανείς άσκηση αδιάκριτη με εγωισμό, πιάνη δηλαδή ξερά την πνευματική ζωή. «Τί έκανε ο τάδε Άγιος; λέει, θα το κάνω και εγώ», και αρχίζει να κάνη μια αδιάκριτη άσκηση. Σιγά-σιγά όμως, χωρίς να το καταλάβη, δημιουργείται μέσα του μια ψευδαίσθηση ότι, αν δεν έφθασε στα μέτρα του τάδε Αγίου, κάπου εκεί κοντά πρέπει να είναι. Έτσι συνεχίζει την άσκηση. Αλλά, ενώ πριν από αυτόν τον λογισμό τον βοηθούσε η θεία Χάρις, τώρα αρχίζει να τον εγκαταλείπη. Γιατί, τί δουλειά έχει με την υπερηφάνεια η Χάρις του Θεού; Οπότε δεν μπορεί πια να κάνη την άσκηση που έκανε προηγουμένως και ζορίζει τον εαυτό του. Με το ζόρισμα όμως δημιουργείται άγχος.    Έρχεται και η υπερηφάνεια που είναι μια αντάρα και του δημιουργεί μια θόλωση. Και ενώ είχε κάνει τόσα και είχε ενεργήσει η θεία Χάρις και είχε γεγονότα, αρχίζει σιγά-σιγά να έχη λογισμούς απιστίας και να αμφιβάλλη για την ύπαρξη του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η δεύτερη περίπτωση είναι, όταν θελήση ένας αγράμματος να ασχοληθή με το δόγμα. Έ, αυτός δεν είναι καλά! Άλλο να ρίξη μια ματιά, για να γνωρίση το δόγμα. Αλλά και ένας μορφωμένος αν πάη υπερήφανα να ασχοληθή με το δόγμα, και αυτόν, επειδή έχει υπερηφάνεια, θα τον εγκαταλείψη η Χάρις του Θεού, και θα αρχίση να έχη αμφιβολίες. Δεν μιλάω φυσικά για έναν που έχει ευλάβεια. Αυτός και μορφωμένος να μην είναι, μπορεί να ρίξη μια ματιά με διάκριση, μέχρι εκεί που μπορεί να εξετάση, και να κατανοήση το δόγμα. Αλλά ένας που δεν έχει πνευματικότητα και πάει να ασχοληθή με τα δογματικά, αυτός, και αν πίστευε λίγο, μετά δεν θα πιστεύη καθόλου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η απιστία έχει εξαπλωθή πολύ στην εποχή μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αλλά συχνά βλέπει κανείς και σ᾿ αυτούς ακόμη που λένε ότι δεν πιστεύουν στον Θεό να υπάρχη μέσα τους κρυμμένη λίγη πίστη. Μια φορά μου είπε ένα παλληκάρι: «Δεν πιστεύω ότι υπάρχει Θεός». «Έλα πιο κοντά, του είπα. Ακούς το αηδόνι που κελαηδάει; Ποιός του έδωσε το χάρισμα αυτό;». Το καημένο ένα κι ένα συγκινήθηκε. Έφυγε εκείνη η σκληράδα της απιστίας και άλλαξε το προσωπάκι του. Άλλη φορά είχαν έρθει δύο επισκέπτες στο Καλύβι. Ήταν περίπου σαράντα πέντε χρονών και ζούσαν πολύ κοσμική ζωή. Όπως εμείς οι μοναχοί λέμε «αφού είναι μάταιη αυτή η ζωή, τα αρνούμαστε όλα», έτσι και εκείνοι, από την αντίθετη πλευρά, είπαν «δέν υπάρχει άλλη ζωή» καί, όταν ήταν νέοι, άφησαν τις σπουδές τους και ρίχτηκαν στην κοσμική ζωή. Έφθασαν σε σημείο να γίνουν ψυχικά και σωματικά ράκη. Ο πατέρας του ενός πέθανε από την στενοχώρια. Ο άλλος κατέστρεψε την περιουσία της μάνας του και την έκανε καρδιακιά. Μετά από την συζήτηση που κάναμε, είδαν τα πράγματα αλλιώς. «Εμείς αχρηστευθήκαμε», έλεγαν. Έδωσα στον έναν μια εικόνα για την μάνα του. Πήγα να δώσω και στον άλλο μία εικόνα, αλλά δεν την έπαιρνε. «Δώσε μου ένα σανιδάκι από αυτά που πριονίζεις, μου λέει. Δεν πιστεύω στον Θεό· στους Αγίους πιστεύω». Τότε του είπα: «Ή καθρέφτης είναι κανείς ή καπάκι από κονσερβοκούτι, αν δεν πέσουν οι ακτίνες του ήλιου επάνω του, δεν γυαλίζει. Οι Άγιοι έλαμψαν με τις ακτίνες της Χάριτος του Θεού, όπως τα αστέρια παίρνουν φως από τον ήλιο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τους καημένους τους νέους τους ζαλίζουν με διάφορες θεωρίες. Είχα προσέξει εκεί στο Καλύβι ότι συνήθως δύο μαρξιστές πενηντάρηδες έμπαιναν στα γκρούπ των νέων, για να τους ζαλίζουν. Οι μαρξιστές δεν πιστεύουν καί, όταν πάς να τους αποδείξης την ύπαρξη του Θεού, κρίνουν τον Θεό και είναι όλο ερωτήσεις· «γιατί αυτό, γιατί εκείνο κ.λπ.». Ο Προφήτης Ησαΐας λέει ότι αυτοί που δεν θέλουν να σωθούν, δεν καταλαβαίνουν[180]. Μια φορά τους είπα: «Βλέπετε τα αστέρια; Αυτά δεν είναι βιδωμένα· κάποιος τα κρατά στο στερέωμα. Για τον Χριστό, όσα είπαν οι Προφήτες εκπληρώθηκαν. Έχουμε τόσους Μάρτυρες, που ήταν πριν πολύ άπιστοι, δήμιοι, ειδωλολάτρες, και μετά πίστεψαν στον Χριστό και μαρτύρησαν. Μερικούς τους έκοβαν την γλώσσα, για να μη μιλάνε για τον Χριστό, και με κομμένη γλώσσα μιλούσαν καλύτερα! Κάθε μέρα έχουμε τόσους Αγίους που εορτάζουν! Είναι ζωντανή η παρουσία των Αγίων. Και όταν ακόμη εμείς δεν τους βρίσκουμε, εκείνοι μας βρίσκουν! Πολλοί ασκητές στην έρημο, που δεν έχουν ημερολόγιο και δεν ξέρουν ποιός Άγιος γιορτάζει, λένε «Άγιοι της ημέρας, πρεσβεύσατε υπέρ ημών» και παρουσιάζονται οι Άγιοι και τους φανερώνουν και το όνομά τους· και μάλιστα είναι Άγιοι με δύσκολα ονόματα. Κοιτάνε ύστερα οι ασκητές το ημερολόγιο και βλέπουν ότι γιορτάζουν εκείνη την ημέρα οι Άγιοι που τους παρουσιάσθηκαν[181]. Αυτό πώς το βλέπετε;». Μετά μου είπαν: «Γιατί πάνε οι Άγιοι στους καλογήρους και δεν πάνε να βοηθήσουν τον λαό που έχει ανάγκη;». «Με τί ήρθατε εδώ, παλληκάρια; τα ρώτησα· με το αεροπλάνο;». «Όχι, με το αυτοκίνητο», μου λένε. «Εντάξει· στον δρόμο που ερχόσασταν, πόσα προσκυνητάρια είδατε; Αυτά δεν φύτρωσαν με τα πρωτοβρόχια. Βοηθήθηκαν οι άνθρωποι από τους Αγίους και από ευλάβεια τα έφτιαξαν, και ανάβουν και τα κανδήλια. Οι πνευματικοί άνθρωποι, όσο πετούν τα υλικά, τόσο ανεβαίνουν. Οι υλιστές, και αυτοί κάτι απολαμβάνουν· φτιάχνουν π.χ. τόσα κύπελλα, παίρνουν τόσα χρήματα· άμα φτιάξουν περισσότερα, παίρνουν περισσότερα. Εσείς μόνον την προπαγάνδα κάνετε και σταματάτε εκεί· δεν έχετε τίποτε να απολαύσετε. Είστε οι πιο ταλαίπωροι, διότι, όταν πετύχετε αυτό που θέλετε, δεν θα έχετε κανένα άλλο ιδανικό, μόνον το βάσανο της μαρξιστικής σκλαβιάς». Στο τέλος μου είπαν: «Είσαι πολύ καλός άνθρωπος, δίκαιος, σοφός...».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως είτε το θέλουν οι άνθρωποι είτε δεν το θέλουν, θα έρθη καιρός που όλοι θα πιστέψουν, γιατί θα φθάσουν σε αδιέξοδο και θα επέμβη ο Χριστός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Όπου δεν φθάνει ο άνθρωπος, βοηθάει ο Θεός
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός βοηθάει σε ό,τι δεν γίνεται ανθρωπίνως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τί καπνός είναι εκεί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάτι καίμε, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βάλατε φωτιά με τέτοιον αέρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έβρεξε το πρωί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έστω και να έβρεξε και κατακλυσμό να έκανε, αν σηκωθή μετά ένας αέρας, γίνεται τέτοια ξηρασία, που όλα γίνονται σαν μπαρούτι! «Έβρεξε», σού λέει η άλλη! Παλιότερα είχε πιάσει φωτιά εκεί κάτω από χαζομάρα σας· το ξεχάσατε; Όταν κανείς ρεζιλευθή μια φορά, πρέπει στην συνέχεια να είναι πολύ προσεκτικός. Ο Θεός βοηθάει εκεί που πρέπει, εκεί που δεν μπορεί ο άνθρωπος να ενεργήση ανθρωπίνως· δεν θα βοηθήση την χαζομάρα μας. Ρεζιλεύουμε έτσι και τους Αγίους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, καταλαβαίνει κανείς πάντοτε μέχρι ποιό σημείο πρέπει να ενεργή ανθρωπίνως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κατ᾿ αρχάς αυτό φαίνεται.Αλλά και αν είχε διάθεση να κάνη αυτό που μπορούσε να κάνη και δεν το έκανε, γιατί κάτι τον εμπόδισε, ο Θεός θα τον βοηθήση σε μια δύσκολη στιγμή. Αν όμως δεν είχε διάθεση, ενώ είχε κουράγιο, ο Θεός δεν θα βοηθήση. Σού λένε λ.χ. να βάζης το βράδυ τον σύρτη στην πόρτα και εσύ δεν τον βάζεις, γιατί βαριέσαι, και λές ότι θα φυλάξη ο Θεός. Δεν είναι ότι έχεις εμπιστοσύνη στον Θεό και δεν βάζεις τον σύρτη, αλλά δεν τον βάζεις, γιατί βαριέσαι. Πώς να βοηθήση τότε ο Θεός; Να βοηθήση δηλαδή τον τεμπέλη; Όταν λέω σε έναν να βάλη τον σύρτη και δεν τον βάζη, και μόνο για την παρακοή του θέλει τιμωρία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ό,τι μπορεί να κάνη κανείς ανθρωπίνως, πρέπει να το κάνη και ό,τι δεν μπορεί, να το αφήνη στον Θεό. Και αν κάνη λίγο περισσότερο από ό,τι μπορεί, όχι όμως από εγωισμό αλλά από φιλότιμο, γιατί νομίζει ότι δεν εξήντλησε αυτό που μπορεί να κάνη ανθρωπίνως, πάλι το βλέπει ο Θεός και συγκινείται. Ο Θεός, για να βοηθήση, θέλει και την δική μας προσπάθεια. Βλέπεις, ο Νώε εκατό χρόνια παιδευόταν να φτιάξη την Κιβωτό. Πριόνιζαν τα ξύλα με ξύλινα πριόνια. Έβρισκαν άλλα ξύλα πιο σκληρά και τα έφτιαχναν πριόνια. Δεν μπορούσε τάχα να κάνη κάτι ο Θεός, ώστε να τελειώση γρήγορα η Κιβωτός; Τους είπε όμως πώς να την φτιάξουν και μετά τους έδινε δυνάμεις[182]. Γι' αυτό να κάνουμε ό,τι μπορούμε εμείς, για να κάνη και ο Θεός ό,τι εμείς δεν μπορούμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ήρθε κάποιος στο Καλύβι και μου είπε: «Γιατί οι καλόγεροι κάθονται εδώ και δεν πάνε στον κόσμο, να βοηθήσουν τον λαό;». «Αν πήγαιναν έξω στον κόσμο, να βοηθήσουν τον λαό, του είπα, θα έλεγες γιατί οι καλόγεροι γυρίζουν στον κόσμο. Τώρα που δεν πάνε, λές γιατί δεν πάνε». Ύστερα μου λέει: «Γιατί οι καλόγεροι πηγαίνουν στους γιατρούς και δεν τους βοηθάει ο Χριστός τους και η Παναγία τους να γίνουν καλά;». «Αυτήν την ερώτηση, του λέω, μου την έκανε και ένας Εβραίος γιατρός». «Αυτός δεν είναι Εβραίος», μου λέει ένας που ήταν μαζί του. «Δεν έχει σημασία που δεν είναι Εβραίος, του λέω. Αυτή η ερώτηση Εβραίου είναι. Και θα σάς πω την απάντηση που έδωσα στον Εβραίο, αφού είναι όμοια η περίπτωση. «Εσύ, σαν Εβραίος που είσαι, του είπα, έπρεπε να ξέρης απ'' έξω την Παλαιά Διαθήκη. Εκεί στον Προφήτη Ησαΐα αναφέρει ότι ο Θεός χάρισε στον βασιλιά Εζεκία, επειδή ήταν πολύ καλός, ακόμη δεκαπέντε χρόνια ζωής. Έστειλε τον Προφήτη Ησαΐα και είπε στον βασιλιά: Ο Θεός σού χαρίζει ακόμη δεκαπέντε χρόνια ζωής, γιατί διέλυσες τα άλση των ειδωλολατρών. Και για την πληγή σου – ο βασιλιάς είχε και μια πληγή – είπε ο Θεός να βάλης επάνω μια τσαπέλλα[183]σύκα, και θα γίνης καλά! Αφού ο Θεός του χάρισε δεκαπέντε χρόνια ζωής, δεν μπορούσε να θεραπεύση και εκείνη την πληγή; Εκείνη όμως γιατρευόταν με μια τσαπέλλα σύκα"»[184]. Πράγματα που γίνονται από τους ανθρώπους να μην τα ζητάμε από τον Θεό. Να ταπεινωνώμαστε στους ανθρώπους και να ζητάμε την βοήθειά τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μέχρις ενός σημείου θα ενεργήση ο άνθρωπος ανθρωπίνως και μετά θα αφεθή στον Θεό. Είναι εγωιστικό να προσπαθή να βοηθήση κανείς σε κάτι που δεν γίνεται ανθρωπίνως. Σε πολλές περιπτώσεις που επιμένει ο άνθρωπος να βοηθήση, βλέπω ότι είναι από ενέργεια του πειρασμού, για να τον αχρηστέψη. Εγώ, όταν βλέπω ότι δεν βοηθιέται μια κατάσταση ανθρωπίνως – λίγο–πολύ καταλαβαίνω μέχρι ποιό σημείο μπορεί να βοηθήση ο άνθρωπος και από ποιό σημείο και μετά πρέπει να τ᾿ αφήση στον Θεό –, τότε υψώνω τα χέρια στον Θεό, ανάβω και δυο λαμπάδες, αφήνω το πρόβλημα στον Θεό και αμέσως τακτοποιείται. Ο Θεός ξέρει ότι δεν το κάνω από τεμπελιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό, όταν μας ζητούν βοήθεια, πρέπει να διακρίνουμε και να βοηθούμε σε όσα μπορούμε. Σε όσα όμως δεν μπορούμε, να βοηθούμε έστω με μια ευχή ή με το να τα αναθέτουμε μόνο στον Θεό· και αυτό είναι μια μυστική προσευχή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός φροντίζει πάντα για το καλό μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός είναι φύσει αγαθός και για το καλό μας φροντίζει πάντα, και όταν του ζητήσουμε κάτι, θα μας το δώση, εάν είναι για το καλό μας. Ό,τι είναι απαραίτητο για την σωτηρία της ψυχής μας και για την σωματική μας συντήρηση, ο Θεός θα μας το δώση πλουσιοπάροχα και θα έχουμε την ευλογία Του. Ό,τι μας στερεί, είτε για να μας δοκιμάση είτε για να μας προφυλάξη, όλα να τα δεχώμαστε με χαρά, αλλά και να τα μελετούμε, για να ωφελούμαστε. Ξέρει πότε και πώς να οικονομάη το πλάσμα Του. Βοηθάει με τον τρόπο Του την ώρα που χρειάζεται. Πολλές φορές όμως το αδύνατο πλάσμα Του αδημονεί, γιατί το θέλει εκείνη την ώρα που το ζητάει, σαν το μικρό παιδί που ζητάει το κουλούρι από την μάνα του άψητο και δεν κάνει υπομονή να ψηθή. Εμείς θα ζητάμε, θα κάνουμε υπομονή και η Καλή μας Μητέρα η Παναγία, όταν είναι έτοιμο, θα μας το δώση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι Άγιοι πότε βοηθούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όποτε χρειάζεται να βοηθήσουν, όχι όποτε νομίζουμε εμείς ότι χρειάζεται να βοηθήσουν. Βοηθούν δηλαδή, όταν αυτό μας ωφελή. Κατάλαβες; Ένα παιδί π.χ. ζητάει από τον πατέρα του μοτοσακό, αλλά ο πατέρας του δεν του παίρνει. Το παιδί του λέει: «Το θέλω το μοτοσακό, γιατί κουράζομαι να πηγαίνω με τα πόδια, παιδεύομαι». Ο πατέρας του όμως δεν του παίρνει μοτοσακό, γιατί φοβάται μη σκοτωθή. «Θα σού πάρω αργότερα αυτοκίνητο», του λέει. Βάζει λοιπόν χρήματα στην Τράπεζα καί, όταν μαζευτούν, θα του πάρη αυτοκίνητο. Έτσι και οι Άγιοι ξέρουν πότε πρέπει να μας βοηθήσουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, το έλεος του Θεού πώς το νιώθουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το έλεος του Θεού είναι η θεία παρηγοριά που νιώθουμε μέσα μας. Τα φέρνει έτσι ο Θεός, ώστε να μην αναπαυώμαστε στην ανθρώπινη παρηγοριά και να καταφεύγουμε στην θεία. Βλέπεις, οι Έλληνες λ.χ. της Αυστραλίας, επειδή βρέθηκαν τελείως μόνοι τους, πλησίασαν τον Θεό περισσότερο από άλλους ξενιτεμένους, όπως της Γερμανίας, που ήταν πιο κοντά στην πατρίδα και βρήκαν εκεί και άλλους Έλληνες. Η δυσκολία πολύ τους βοήθησε να γαντζωθούν στον Θεό. Όλοι ξεκίνησαν με μια βαλίτσα, βρέθηκαν μακριά από την πατρίδα, μακριά από τους συγγενείς· έπρεπε να βρουν δουλειά, να βρουν δάσκαλο για τα παιδιά τους κ.λπ., χωρίς βοήθεια από πουθενά. Γι᾿ αυτό στράφηκαν στον Θεό και κράτησαν την πίστη τους. Ενώ στην Ευρώπη οι Έλληνες που δεν είχαν αυτές τις δυσκολίες, δεν έχουν αυτήν την σχέση με τον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Αιτείτε και δοθήσεται υμίν»[185]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πρέπει να ζητάμε από τον Θεό να μας βοηθάη, αφού ξέρει τις ανάγκες μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί υπάρχει ελευθερία. Και μάλιστα, όταν πονάμε για τον πλησίον μας και Τον παρακαλούμε να τον βοηθήση, πολύ συγκινείται ο Θεός, γιατί τότε επεμβαίνει, χωρίς να παραβιάζεται το αυτεξούσιο. Ο Θεός έχει όλη την καλή διάθεση να βοηθήση τους ανθρώπους που υποφέρουν. Για να τους βοηθήση όμως, πρέπει κάποιος να Τον παρακαλέση. Γιατί, αν βοηθήση κάποιον, χωρίς κανείς να Τον παρακαλέση, τότε ο διάβολος θα διαμαρτυρηθή και θα πή: «Γιατί τον βοηθάς και παραβιάζεις το αυτεξούσιο; Αφού είναι αμαρτωλός, ανήκει σ᾿ εμένα». Εδώ βλέπει κανείς και την μεγάλη πνευματική αρχοντιά του Θεού, που ούτε στον διάβολο δίνει το δικαίωμα να διαμαρτυρηθή. Γι'' αυτό θέλει να Τον παρακαλούμε, για να επεμβαίνη – και θέλει ο Θεός να επεμβαίνη αμέσως, αν είναι για το καλό μας –, και να βοηθάη τα πλάσματά Του ανάλογα με τις ανάγκες τους. Για τον κάθε άνθρωπο ενεργεί ξεχωριστά, όπως συμφέρει στον καθέναν καλύτερα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός λοιπόν αλλά και οι Άγιοι για να βοηθήσουν, πρέπει ο ίδιος ο άνθρωπος να το θέλη και να το ζητά, αλλιώς δεν επεμβαίνουν. Ο Χριστός ρώτησε τον παράλυτο:«Θέλεις υγιής γενέσθαι;»[186]. Αν δεν θέλη ο άνθρωπος, το σέβεται ο Θεός. Αν κάποιος δεν θέλη να πάη στον Παράδεισο, ο Θεός δεν τον παίρνει. Εκτός αν ήταν αδικημένος και είχε άγνοια, οπότε δικαιούται την θεία βοήθεια. Διαφορετικά, δεν θέλει να επέμβη ο Θεός. Ζητά κανείς βοήθεια, και ο Θεός και οι Άγιοι την δίνουν. Μέχρι να ανοιγοκλείσης τα μάτια σου, έχουν κιόλας βοηθήσει. Μερικές φορές δεν προλαβαίνεις ούτε να τα ανοιγοκλείσης· τόσο γρήγορα βρίσκεται ο Θεός δίπλα σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Αιτείτε και δοθήσεται», λέει η Γραφή. Αν δεν ζητάμε βοήθεια από τον Θεό, θα σπάζουμε τα μούτρα μας. Ενώ, όταν ζητάμε την θεία βοήθεια, ο Χριστός μας δένει με ένα σχοινάκι με την Χάρη Του και μας συγκρατεί. Φυσάει ο αέρας από εδώ-εκεί, αλλά, επειδή είμαστε δεμένοι, δεν κινδυνεύουμε. Όταν όμως ο άνθρωπος δεν καταλαβαίνη ότι ο Χριστός είναι που τον κρατάει, λύνεται πλέον από το σχοινάκι και τον χτυπούν οι άνεμοι από ᾿δώ και από ᾿κεί και ταλαιπωρείται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να ξέρετε, μόνον τα πάθη και οι αμαρτίες είναι δικές μας. Ό,τι καλό κάνουμε είναι από τον Θεό, ό,τι ανοησίες κάνουμε είναι δικές μας. Λίγο η Χάρις του Θεού να μας αφήση, τίποτε δεν μπορούμε να κάνουμε. Όπως στην φυσική ζωή, λίγο το οξυγόνο να μας πάρη ο Θεός, αμέσως θα πεθάνουμε, έτσι και στην πνευματική ζωή, λίγο αν μας αφαιρέση την θεία Χάρη, πάει, χαθήκαμε. Μια φορά ένιωθα στην προσευχή μια αγαλλίαση. Ώρες στεκόμουν όρθιος και δεν ένιωθα καθόλου κούραση. Όσο προσευχόμουν, ένιωθα μια γλυκειά ξεκούραση, κάτι που δεν μπορώ να το εκφράσω. Ύστερα μου πέρασε ένας λογισμός ανθρώπινος: επειδή μου λείπουν δυο πλευρά και εύκολα κρυώνω, σκέφθηκα, για να μη χάσω αυτήν την κατάσταση και να προχωρήσω όσο πάει, να πάρω ένα σάλι, να τυλιχθώ, μήπως αργότερα κρυώσω. Μόλις δέχθηκα αυτόν τον λογισμό, αμέσως σωριάσθηκα κάτω. Έμεινα πεσμένος κάτω μισή ώρα περίπου και μετά μπόρεσα να σηκωθώ να πάω στο κελλί να ξαπλώσω. Προηγουμένως, όσο προχωρούσα στην προσευχή, ένιωθα σαν ένα πούπουλο, ένα ελάφρωμα, μια αγαλλίαση, που δεν εκφράζεται. Μόλις όμως δέχθηκα αυτόν τον λογισμό, σωριάσθηκα κάτω. Αν έφερνα έναν υπερήφανο λογισμό και έλεγα λ.χ. «ζήτημα είναι, αν υπάρχουν δύο-τρείς σε τέτοια κατάσταση», τότε είναι που θα πάθαινα ζημιά. Σκέφθηκα ανθρώπινα, όπως σκέφτεται ο κουτσός να πάρη τα δεκανίκια του, όχι δαιμονικά. Ήταν ένας φυσικός λογισμός, αλλά και πάλι είδες τί έπαθα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το μόνο που έχει ο άνθρωπος είναι μια διάθεση και ανάλογα με αυτήν τον βοηθάει ο Θεός. Γι' αυτό λέω, όσα αγαθά έχουμε είναι δώρα του Θεού. Τα έργα μας είναι μηδέν και οι αρετές μας είναι μία συνέχεια από μηδενικά. Εμείς θα προσπαθούμε να προσθέτουμε συνέχεια μηδενικά και να παρακαλούμε τον Χριστό να βάλη την μονάδα στην αρχή, για να γίνουμε πλούσιοι. Εάν δεν βάλη την μονάδα ο Χριστός στην αρχή, χαμένος ο κόπος μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η Χάρις του Θεού προσελκύεται με την ταπείνωση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω δυσκολίες στον αγώνα μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ζητάς βοήθεια από τον Χριστό ή παλεύεις μόνη σου; Την αδυναμία σου την είπες στον Χριστό; Εσύ δεν ταπεινώνεσαι, δεν ζητάς βοήθεια από τον Χριστό και μετά λές: «Έχω δυσκολίες στον αγώνα μου». Αν ταπεινώνεται κανείς και ζητά λίγη βοήθεια από τον Χριστό, Εκείνος βοηθάει. Πολλές φορές ο άνθρωπος καταβάλλει μια εγωιστική προσπάθεια, γι᾿ αυτό δεν βοηθάει ο Χριστός. Πέταξε τον εαυτό σου, μην τον υπολογίζης, και η Χάρις του Θεού θα κατοικήση μέσα σου. Εμείς θέλουμε να αποκτήσουμε αγιότητα με μαγικό τρόπο. Σε λανθασμένη όμως κατάσταση δεν βοηθάει ο Θεός. Έστω και λίγο αν μπαίνη η ιδιοτέλεια, εμποδίζεται η θεία βοήθεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν έχω διάθεση να διορθωθώ, δεν θα με βοηθήση ο Θεός να καταλάβω μια αδυναμία μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να βοηθήση ο Θεός, πρέπει να υπάρχη διάθεση για αγώνα. Και όταν λέμε διάθεση για αγώνα, εννοούμε να καταβάλλη κανείς λίγη προσπάθεια να ξεπεράση την αδυναμία του. Λίγη καθαρή διάθεση αν δη ο Θεός, πλούσια βοηθάει τον άνθρωπο, πλούσια στέλνει την Χάρη Του. Μπαίνει ο άνθρωπος μέσα στο κανάλι του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μέχρι ποιό σημείο μας βοηθάει ο Θεός στον πνευματικό αγώνα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μέχρι εκεί που βοηθάμε εμείς τον Θεό να μας βοηθήση. Όταν ζητάτε κάτι από τον Θεό και για πολύ καιρό δεν δίνη βοήθεια, να ξέρετε ότι θα υπάρχη υπερηφάνεια. Αν έχουμε πάθη, π.χ. γαστριμαργία, φλυαρία, θυμό, φθόνο κ.λπ., και παράλληλα έχουμε και υπερηφάνεια, ο Θεός δεν βοηθάει, γιατί εμποδίζουμε την θεία Χάρη. Και μόνον προδιάθεση υπερηφανείας να έχουμε μέσα μας, εμποδίζουμε τον Θεό να μας βοηθήση, έστω κι αν αγωνιζώμαστε και προσευχώμαστε ίσως και περισσότερο απ᾿ ό,τι χρειάζεται. Αδύνατο είναι να μη βοηθήση ο Θεός, αν δεν υπάρχη φόβος να το πάρη επάνω του ο άνθρωπος. Μόλις φύγη η προδιάθεση υπερηφανείας και λάβη την ψυχική του υγεία ο άνθρωπος, τότε θα τον απαλλάξη αμέσως από το πάθος που τον βασανίζει, και θα τον ανταμείψη και για τον παραπανήσιο του αγώνα. Γι'' αυτό, για να βοηθηθούμε, πρέπει να βοηθήσουμε τον Θεό με το ταπεινό μας φρόνημα. Να πούμε: «Τέτοιος άχρηστος είμαι, Θεέ μου, Σε παρακαλώ, συγχώρεσέ με και βοήθησέ με». Τότε βοηθάει ο Θεός, γιατί δικαιούται την βοήθεια η ψυχή, επειδή αφέθηκε στα χέρια Του με καλή και ταπεινή διάθεση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να πιστεύουμε ότι ο Χριστός και η Παναγία μας προστατεύουν και μας βοηθούν πάντοτε, αρκεί να έχουμε ταπεινό φρόνημα. Ο Θεός μας δεν είναι κουφός, να μη μας ακούη, ούτε τυφλός, να μη μας βλέπη, όπως ο Βάαλ[187].
- type: h2
  initial:
    ru: ''
  text:
    ru: Βοήθεια στις αρχές του πνευματικού αγώνα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο Θεός βοηθάει τον άνθρωπο πιο πολύ στις αρχές του πνευματικού του αγώνα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, στα πρώτα βήματα της πνευματικής ζωής ο Θεός βοηθάει πολύ τον άνθρωπο, όπως οι γονείς προστατεύουν τα παιδιά πιο πολύ, όταν είναι μικρά. Όσο μεγαλώνουν, δεν τα προστατεύουν τόσο, γιατί τα παιδιά αρχίζουν να χρησιμοποιούν το μυαλό τους. Ο άνθρωπος στην αρχή του αγώνα του νιώθει έντονα την Χάρη του Θεού. Ύστερα ο Θεός τον αφήνει λίγο, για να αγωνισθή και να ανδρωθή. Εγώ φύτεψα λίγες ντοματιές. Στην αρχή τις πότιζα κάθε μέρα· μετά τις άφησα. Όταν έφθασαν να κιτρινίζουν τα φύλλα τους, τότε τις πότισα. Όσο έμεναν απότιστες, ζορίστηκαν και αναγκάσθηκαν να ρίξουν βαθιά τις ρίζες τους, για να βρουν υγρασία, και έδεσαν και καρπό. Αν τις πότιζα συνέχεια, μόνο θα ψήλωναν και οι ρίζες τους θα έμεναν στην επιφάνεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είπατε, Γέροντα, ότι ο άνθρωπος στην αρχή του αγώνα του αισθάνεται την Χάρη του Θεού και ύστερα τον εγκαταλείπει λίγο η θεία Χάρις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, παίρνει την Χάρη Του ο Θεός, για να ταπεινωθή ο άνθρωπος και για να καταλάβη την βοήθεια του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτή η αλλαγή δεν είναι λίγο οδυνηρή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, γιατί δεν τον εγκαταλείπει τελείως ο Θεός. Όταν αρχίζη ο άνθρωπος να δουλεύη πνευματικά, του δίνει ο Θεός π.χ. καμμιά... σοκολάτα. Αρχίζει έτσι σιγά-σιγά και μαθαίνει να δουλεύη τρώγοντας και καμμιά... σοκολάτα. Αλλά, όταν δεν του δίνη ο Θεός σοκολάτα και αυτός σταματάη να δουλεύη και λέη «πρώτα έτρωγα σοκολάτες, τώρα δεν τρώω καμμία, ώχ τί έπαθα!», δεν κάνει προκοπή. Πρέπει δηλαδή να το χαίρεται αυτό ο άνθρωπος. Να μη θέλουμε εύκολα να μας βοηθάη ο Χριστός· να μη ζητάμε οικονομίες, γιατί τότε θα είμαστε αδόκιμοι, ανεκπαίδευτοι. Και στον στρατό, όσοι εκπαιδεύονται καλά, αυτοί δεν σκοτώνονται. Όταν ο άνθρωπος βοηθιέται συνέχεια, τελικά δεν βοηθιέται. Εμένα με συγκινεί που δεν βοηθάει συνέχεια ο Χριστός. Νιώθω σαν να είμαι μαθητής και οι καθηγητές έχουν από τους μαθητές απαιτήσεις. Και για να περάση κανείς στις πνευματικές εξετάσεις, είναι δύσκολο· χρειάζεται συνεχή παρακολούθηση του εαυτού του και βία, αλλά έτσι προοδεύει πνευματικά. Μήπως είναι δύσκολο στον Θεό να βοηθάη συνέχεια τον κάθε άνθρωπο; Αλλά δεν βοηθιέται με αυτόν τον τρόπο ο άνθρωπος. Ένα παιδί κακομαθημένο, που του δίνουν οι γονείς του συνέχεια σοκολάτες και θέλει όλο να του δίνουν, θα γίνη τεμπέλικο, κακορρίζικο, κακομοίρικο. Το ίδιο και ο άνθρωπος, αν δέχεται συνέχεια την βοήθεια του Θεού, χωρίς να κοπιάζη ο ίδιος, δεν θα ωριμάση ποτέ πνευματικά. Γι᾿ αυτό, ενώ στην αρχή της πνευματικής ζωής ο Θεός βοηθάει τον άνθρωπο, μετά σιγά-σιγά τραβιέται, για να καταλάβη ο άνθρωπος ότι πρέπει και ο ίδιος να κάνη ό,τι μπορεί. Νά, το μικρό παιδάκι δεν το κρατούν συνέχεια οι γονείς από το χεράκι, για να περπατήση· το αφήνουν και λίγο να περπατήση μόνο του καί, μόλις πάη να πέση, τάκ, το πιάνουν. Μετά καταλαβαίνει το παιδί ότι οι δικές του δυνάμεις αρκούν μόνο για να περπατάη πιασμένο από την κουπαστή! Αν το παιδάκι περπατάη, μόνον όταν το κρατάνε από το χέρι, καί, όταν το αφήνουν, δεν πιάνεται από την κουπαστή, για να περπατήση και σιγά-σιγά να δυναμώση, αλλά κάθεται κάτω, τότε δεν θα μάθη ποτέ να περπατάη, γιατί δεν έκανε αυτό που μπορούσε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αισθάνεται ο άνθρωπος ότι πρώτα είχε την θεία βοήθεια και ύστερα δεν την έχει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν παρακολουθή ο άνθρωπος τον εαυτό του, τίποτε δεν αισθάνεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι θείες δυνάμεις είναι παντοδύναμες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλοί ανησυχούν· τί θα γίνη με το ένα θέμα, τί θα γίνη με το άλλο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε να δής· τώρα ο Θεός, και να ήθελε να μας αφήση, δεν μπορεί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί εννοείτε, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νά, οι γονείς όταν φέρνουν ένα παιδάκι στον κόσμο, όσο αγωνίζονται να το μεγαλώσουν, τόσο περισσότερο το αγαπούν και το πονούν. Έτσι και ο Θεός, μας έφερε στον κόσμο, αγωνίσθηκε κατά κάποιον τρόπο, μας μεγάλωσε, κουράσθηκε να μας κάνη ό,τι μας έκανε. Τώρα, και να θέλη να μας αφήση, δεν μπορεί, γιατί μας πονάει, αρκεί εμείς να έχουμε λίγο φιλότιμο. Αν έχουμε λίγο φιλότιμο, δεν θα χάσουμε τον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είπατε ότι ο Καλός Θεός δεν θα μας αφήση...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ο Θεός ποτέ δεν μας αφήνει· εμείς Τον αφήνουμε. Όταν ο άνθρωπος δεν ζη πνευματικά, δεν δικαιούται την θεία βοήθεια. Όταν όμως ζη πνευματικά και είναι κοντά στον Θεό, την δικαιούται. Τότε, αν συμβή κάτι και πεθάνη, είναι έτοιμος για την άλλη ζωή, οπότε είναι κερδισμένος και σ́ αυτήν την ζωή και στην άλλη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η βοήθεια του Θεού δεν εμποδίζεται ούτε από ανθρώπους ούτε από δαίμονες. Δεν είναι τίποτε δύσκολο για τον Θεό ούτε για έναν Άγιο. Το εμπόδιο σ᾿ εμάς τους ανθρώπους είναι η ολιγοπιστία, με την οποία εμποδίζουμε τις μεγάλες θείες δυνάμεις να μας πλησιάσουν. Και ενώ υπάρχει τόσο μεγάλη δύναμη δίπλα μας, εμείς, επειδή υπάρχει μέσα μας σε μεγάλο βαθμό το ανθρώπινο στοιχείο, δεν μπορούμε να καταλάβουμε το θείο, που ξεπερνάει όλου του κόσμου τις ανθρώπινες δυνάμεις, γιατί οι θείες δυνάμεις είναι παντοδύναμες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καθόμαστε πολλές φορές άδικα, ώρες ολόκληρες, για να βρούμε μόνοι μας λύση σε ένα θέμα, χρησιμοποιώντας όλη την απειρία μας. Το κεφάλι μας γίνεται κουδούνι, τα μάτια μας τσούζουν, ο ύπνος δεν μας πιάνει, γιατί μας έχει πιάσει το ταγκαλάκι με επίμονες σκέψεις. Τελικά βρίσκουμε μία λύση, αλλά μετά ο Θεός μας βρίσκει άλλη, καλύτερη λύση, που δεν την είχαμε σκεφθή εμείς, και μας μένουν ο πονοκέφαλος και τα ξενύχτια. Όσο και αν είναι σωστή η δική μας σκέψη, όταν δεν είναι ο Θεός μπροστά, το κεφάλι κουράζεται και έρχεται πονοκέφαλος, ενώ η προσευχή με την εμπιστοσύνη στον Θεό ξεκουράζει. Γι' αυτό ας αφήνουμε με εμπιστοσύνη στον Θεό τα δυσκολοκατόρθωτα ανθρωπίνως και να μη στηριζώμαστε στις δικές μας ανθρώπινες προσπάθειες, και Εκείνος θα κάνη ό,τι είναι καλύτερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και πάντα για καθετί που σκέφτεσθε να κάνετε, να λέτε «άν θέλη ο Θεός», μην πάθετε και εσείς ό,τι έπαθε κάποιος μια φορά. Είχε αποφασίσει να πάη στο αμπέλι του για δουλειά. «Αύριο πρωί-πρωί, λέει στην γυναίκα του, θα πάω στο αμπέλι». «Αν θέλη ο Θεός, θα πάς», του λέει εκείνη. «Θέλει-δέν θέλει ο Θεός, λέει εκείνος, εγώ θα πάω». Την άλλη μέρα ξεκίνησε νύχτα. Στον δρόμο εν τω μεταξύ πιάνει τέτοιος κατακλυσμός, που αναγκάσθηκε να γυρίση πίσω. Δεν είχε φέξει ακόμη. Χτυπάει την πόρτα. «Ποιός είναι;», ρωτάει η γυναίκα του. «Αν θέλη ο Θεός, λέει εκείνος, ο άνδρας σου είμαι»!...
- type: h2
  initial:
    ru: ''
  text:
    ru: Αγαθή διάθεση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θα γίνουν οι άνθρωποι που έχουν καλωσύνη, αλλά δεν πιστεύουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νομίζεις ότι δεν πιστεύουν; Αλλά ας πούμε ότι δεν πιστεύουν. Όταν ήταν μικροί, η μάνα τους δεν τους κοινωνούσε; Αλλά και να μην τους κοινωνούσε, δεν βαφτίσθηκαν, δεν μυρώθηκαν; Δεν είναι γεννημένοι από ορθόδοξες και βαφτισμένες μάνες; Έ, αυτούς τους ανθρώπους που έχουν καλωσύνη, θα δής, ο Καλός Θεός θα τους βολέψη με κάποιο τρόπο, είτε με δοκιμασίες είτε με μια αρρώστια είτε με ταλαιπωρίες είτε με έναν σεισμό είτε με έναν κεραυνό είτε με έναν κατακλυσμό είτε με έναν λόγο κ.λπ., και τελικά θα τους πάη στον Παράδεισο. Πολλές φορές ίσως παρουσιασθή και ένας Άγιος ή ένας Άγγελος σε έναν τέτοιο άνθρωπο, παρόλο που δεν δικαιούται αυτήν την μεγάλη ευλογία. Μπορεί όμως να το κάνη και αυτό ο Χριστός, αφού πρώτα χρησιμοποιήση όλα τα άλλα. Αλλά συχνά τί παθαίνουν οι άνθρωποι αυτοί; Πηγαίνει ο διάβολος και τους ξεγελάει και πολλοί, οι καημένοι, πλανιούνται, γιατί αρχίζει ο διάβολος να τους λέη: «Ά, εσένα ο Θεός σού έδειξε τέτοιο μεγάλο θαύμα, γιατί μπορείς να σώσης τον κόσμο». Και ο ταλαίπωρος δεν λέει: «Θεέ μου, πώς να Σε ευχαριστήσω; εγώ δεν ήμουν άξιος για τέτοια χάρη». Αντί δηλαδή να νιώση συντριβή, δέχεται τους λογισμούς που του φέρνει ο διάβολος και υπερηφανεύεται. Μετά ξαναπηγαίνει ο διάβολος και του στήνει «τηλεόραση», του δείχνει Αγγέλους, Αγίους, και του λέει: «Εσύ θα σώσης την οικουμένη». Αν αυτός ο άνθρωπος συνέλθη, πάλι ο Καλός ο Θεός θα τον βοηθήση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως να μην ξεχνάμε ότι όλοι έχουμε κληρονομιά από τον Θεό, γι᾿ αυτό σε όλους τους ανθρώπους στο βάθος υπάρχει καλωσύνη. Ο διάβολος όμως όλα τα μολύνει. Μερικοί τώρα έχουν διατηρήσει αυτήν την κληρονομιά, την καλωσύνη, έστω και αν δεν ζουν κοντά στην Εκκλησία. Έ, αυτούς θα τους βολέψη ο Θεός. Γι' αυτό, όταν βλέπετε έναν άνθρωπο να έχη παρασυρθή και να έχη αμαρτωλή ζωή, αλλά να είναι πονόψυχος – βλέπει λ.χ. έναν άρρωστο και ραγίζει η καρδιά του, έναν φτωχό και τον βοηθάει – από ᾿κεί να καταλάβετε ότι αυτόν δεν θα τον αφήση ο Θεός, θα τον βοηθήση. Και όταν βλέπετε έναν άνθρωπο απομακρυσμένο από τον Θεό να είναι σκληρός, άσπλαγχνος κ.λπ., τότε πρέπει να κάνετε μέρα-νύχτα προσευχή, να κάνη «αποβίβαση» ο Θεός στην καρδιά του, για να πάρη στροφή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τα κρίματα του Θεού είναι άβυσσος. Ένα πράγμα ξέρω: όσοι ζουν κοσμική ζωή, γιατί δεν βοηθήθηκαν, αλλά παρασύρθηκαν ή και σπρώχθηκαν στο κακό, ενώ είχαν καλή διάθεση, αυτοί συγκινούν τον Θεό και ο Θεός θα τους βοηθήση. Θα χρησιμοποιήση διάφορους τρόπους, να βρουν τον δρόμο τους· δεν θα τους αφήση. Ακόμη και την ώρα του θανάτου θα τους οικονομήση να βρίσκωνται σε καλή κατάσταση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Πέμπτο Μέρος – Πνευματικά Όπλα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Όταν πονάη κανείς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιά την σημερινή κατάσταση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: πού επικρατεί στον κόσμο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί προσεύχεται,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τότε βοηθιούνται οι άνθρωποι,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: χωρίς να παραβιάζεται το αυτεξούσιο».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η προσευχή, όπλο ισχυρό
- type: h2
  initial:
    ru: ''
  text:
    ru: Χρειάζεται πολλή προσευχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιά, για να κάνη κάτι κανείς, αν ήταν κοσμικός άνθρωπος, θα σκεφτόταν. Αν ήταν πνευματικός άνθρωπος, θα σκεφτόταν και θα προσευχόταν. Στην εποχή μας ακόμη και «πνευματικοί» άνθρωποι όχι μόνο δεν προσεύχονται, αλλά ούτε σκέφτονται. Και μάλιστα, συχνά πρόκειται για σοβαρά θέματα, και αυτοί κάνουν πρόβες με τον κόσμο. Σε όλες τις περιπτώσεις, πριν ενεργήσουμε, να λέμε: «Σκέφθηκα γι᾿ αυτό; Προσευχήθηκα γι᾿ αυτό;». Όταν κανείς ενεργή, χωρίς να σκεφθή και χωρίς να προσευχηθή, ενεργεί σατανικά. Και βλέπεις, συχνά πολλοί Χριστιανοί με τον τρόπο που ενεργούν, δεν αφήνουν τον Θεό να επέμβη. Νομίζουν ότι αυτοί θα τα καταφέρουν όλα μόνοι τους. Ενώ ακόμη και ο άπιστος λέει «έχει ο Θεός», αυτοί δεν το λένε. Τα βάζει λ.χ. κάποιος με τον καρνάβαλο, ενώ μπορεί να κάνη προσευχή και να ρίξη ο Θεός τέτοιο χαλάζι, που να σκορπίσουν όλοι και να ματαιωθή κάθε εκδήλωση. Ή, ας υποθέσουμε, μερικοί κατηγορούν έναν δεσπότη και οι άλλοι καταφεύγουν στο Συμβούλιο Επικρατείας. Αλλά ούτε εκεί σταματούν. Διαδηλώσεις, φασαρίες, άρθρα στις εφημερίδες... Συνέχεια ανθρώπινες προσπάθειες και δεν αφήνουν τον Θεό να ενεργήση. Δεν καταφεύγουν στην προσευχή, ώστε να απαντήση ο Θεός δια της προσευχής. Με την ταπείνωση και την προσευχή διορθώνονται όλα τα αδιόρθωτα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα ζούμε σε χρόνια Αποκαλύψεως. Δεν χρειάζεται να είναι κανείς Προφήτης για να το καταλάβη. Τα πράγματα προχωρούν τάκ–τάκ. Τί μας περιμένει δεν ξέρουμε. Όλη αυτή η κατάσταση που επικρατεί, το δείχνει. Γι'' αυτό, για έναν λόγο παραπάνω τώρα, πρέπει να στηριχθούμε πιο πολύ στην προσευχή και να πολεμήσουμε το κακό με την προσευχή. Η μόνη λύση αυτή είναι. Να παρακαλούμε τον Θεό να λυπηθή τα πλάσματά Του – αν και δεν είμαστε για να μας λυπηθή. Δεν θα βρεθή άκρη. Καθένας ό,τι του λέει ο λογισμός θα κάνη. Θα γίνη αυτό που λέει ο Άγιος Κοσμάς: «Θα περπατάς ώρα, για να βρής άνθρωπο· και όσοι ζήσουν, θα τρώνε με χρυσά κουτάλια». Μερικοί βέβαια έχουν τον λογισμό: «Αφού οι προφητείες θα εκπληρωθούν οπωσδήποτε, τί θα ωφελήση η προσευχή;». Ο Θεός βλέπει ότι έτσι θα εξελιχθούν τα πράγματα, αλλά εμείς κάνουμε προσευχή, για να είναι πιο ανώδυνο ένα κακό και να μην πάρη έκταση. Γι'' αυτό λέει και στο Ευαγγέλιο ότι για τους εκλεκτούς θα κολοβωθούν οι ημέρες[188]. Σε έναν πόλεμο λ.χ. με την δύναμη της προσευχής γίνεται ένα θαύμα, σώζονται περισσότεροι, υπάρχουν λιγώτερα θύματα, οπότε βοηθιούνται πνευματικά οι άνθρωποι, πιστεύουν και αλλοιώνονται με την καλή έννοια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τα πράγματα είναι σοβαρά. Και μέχρι τώρα που δεν τινάχθηκε ο κόσμος στον αέρα, θαύμα είναι. Ο Θεός να βάλη το χέρι Του, γιατί όλος ο κόσμος εξαρτάται από τρία-τέσσερα άτομα. Κρέμεται η τύχη του κόσμου στα χέρια μερικών παλαβών. Λέει μια παροιμία: «Τα άλογα κλωτσούν και τα κοτόπουλα ψοφούν». Έτσι είναι. Τα μεγάλα κράτη όταν πιάνωνται, τα μικρά τα καημένα αδικούνται. Κλωτσιούνται τα μεγάλα και καταστρέφονται τα μικρά. Χρειάζεται πολλή προσευχή, πολλή προσευχή, για να φωτίση ο Θεός τους μεγάλους, γιατί, αν θέλουν, μπορούν να καταστρέψουν τον κόσμο. Ξέρει ο Θεός πολύ εύκολα και σ́ αυτούς να δώση λίγη φώτιση. Αν ο Θεός φωτίση, βγάζει ένας μια διαταγή και αλλάζουν όλα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αιτήματα στην προσευχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν είναι ευλογημένο, να μας λέγατε μερικά θέματα, για τα οποία ιδιαίτερα πρέπει να προσευχώμαστε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να παρακαλούμε κατ' αρχάς η προσευχή μας να έχη ως αποτέλεσμα να έρθουν σε θεοσέβεια όσοι ζουν και όσοι θα ζήσουν. Εγώ στην προσευχή μου λέω «Παράτεινον το έλεός Σου τοις γινώσκουσί Σε» και προσθέτω  «καί τοις μη γινώσκουσί Σε». Ακόμη λέω «Κύριε, σώσον τους ασεβείς». (Βέβαια η Εκκλησία καλά κανόνισε να λέη «Κύριε, σώσον τους ευσεβείς...», γιατί μπορεί να βρίζουν οι ασεβείς, επειδή προσεύχονται γι᾿ αυτούς). Όταν πάλι ο ιερεύς λέη «Υπέρ των εντειλαμένων ημίν τοις αναξίοις εύχεσθαι υπέρ αυτών», προσθέτω και «υπέρ των μη εντειλαμένων». Γιατί πρέπει να προσευχώμαστε και γι᾿ αυτούς που μας ζήτησαν να προσευχηθούμε, αλλά και γι᾿ αυτούς που δεν μας ζήτησαν, και για τους γνωστούς και για τους αγνώστους. Τόσες χιλιάδες άνθρωποι υπάρχουν που έχουν μεγαλύτερη ανάγκη και σοβαρώτερα προβλήματα από αυτούς που μας ζήτησαν να προσευχηθούμε. Να κάνουμε προσευχή και για όσους έχουν αδικηθή, να φανή το δίκαιο· να δοθή χάρη στους φυλακισμένους, να πιάση τόπο η ταλαιπωρία που πέρασαν και να βοηθηθούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν βάζω ξύλα στην φωτιά, δοξολογώ τον Θεό και λέω: «Ζέστανε, Θεέ μου, όσους δεν έχουν ζεστασιά». Όταν πάλι καίω τα γράμματα που μου στέλνουν – τα διαβάζω και μετά τα καίω, γιατί έχουν και θέματα απόρρητα και εξομολογήσεις –, λέω: «Να τους κάψη ο Θεός όλα τα κουσούρια. Να τους βοηθάη να ζουν πνευματικά και να τους αγιάζη». Ακόμη συνηθίζω να ζητώ από τους Αγίους να προστατεύουν τους ανθρώπους που φέρουν το όνομά τους και από τους Αγίους Πάντες να προστατεύουν αυτούς που δεν έχουν προστάτη Άγιο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι καλύτερα, να ζητώ το έλεος του Θεού γενικά ή να αναφέρω και συγκεκριμένα αιτήματα σύμφωνα με το «Αιτείτε και δοθήσεται υμίν»[189];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να προσεύχεσαι γενικά και να λές «Κύριε Ιησού Χριστέ, ελέησον τους πάσχοντας σωματικά και ψυχικά». Σ᾿ αυτήν την ευχή περιλαμβάνονται και οι κεκοιμημένοι. Αν σού έρχεται στον νού ένα συγγενικό σου πρόσωπο, πές και μια ευχή γι᾿ αυτό, «... ελέησον τον δούλόν Σου τάδε», και πέρασε αμέσως στην γενική ευχή για όλον τον κόσμο, «... ελέησον τον κόσμον Σου άπαντα». Μπορείς να φέρνης στον νού σου έναν συγκεκριμένο άνθρωπο που έχει ανάγκη, να προσεύχεσαι λίγο γι' αυτόν και μετά να λές «Κύριε Ιησού Χριστέ, ελέησον ημάς» και να πονάς για όλους, για να μη φεύγη η... αμαξοστοιχία με έναν επιβάτη. Να μη σκαλώνουμε σε ένα πρόσωπο και μετά δεν μπορούμε να βοηθήσουμε με την προσευχή ούτε τον εαυτό μας ούτε τους άλλους. Όταν προσεύχεσαι λ.χ. για έναν καρκινοπαθή, να προσεύχεσαι για όλους τους καρκινοπαθείς και να λές και μια ευχή για τους κεκοιμημένους. Ή βλέπεις έναν δυστυχισμένο· να πηγαίνη αμέσως ο νούς σου σε όλους τους δυστυχισμένους και να προσεύχεσαι γι' αυτούς. Νά, θυμάμαι, μικρός είχα δει έναν ζητιάνο που πέθανε έξω από ένα τούρκικο σπίτι, δέκα μέτρα μακριά από το δικό μας. Πέτρο τον έλεγαν. Τον βρήκε το πρωί η Τουρκάλα πεσμένον έξω από το σπίτι της και τον σκουντούσε να σηκωθή· τότε κατάλαβε ότι είχε πεθάνει. Ακόμη τον μνημονεύω. Πόσοι τέτοιοι «Πέτροι» υπάρχουν στον κόσμο! Όταν πηγαίνη κανείς σε ειδικά θέματα και σκέφτεται ότι υποφέρουν οι συνάνθρωποί μας, βοηθιέται, γιατί κεντιέται η καρδιά. Έτσι, με πονεμένη καρδιά από τα ειδικά θέματα πηγαίνει και στα γενικά, και βοηθάει περισσότερο με την καρδιακή προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Καλά είναι ο μοναχός να μοιράζη την προσευχή του σε τρία μέρη: για τον εαυτό του, για όλο τον κόσμο και για τους κεκοιμημένους. Αν και με αυτόν τον τρόπο, παρόλο που φαίνεται δίκαιη η μοιρασιά, πάλι για τον εαυτό του φροντίζει περισσότερο, γιατί ο εαυτός του είναι ένας, ενώ οι ζώντες και οι κεκοιμημένοι είναι δισεκατομμύρια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στο διακόνημα εύχομαι συνήθως μόνο για τον εαυτό μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν είναι σωστό αυτό. Όταν στο κελλί εύχεσαι για τον εαυτό σου και έξω από το κελλί πάλι για τον εαυτό σου, τότε πώς θα κεντηθή η καρδιά; Όταν μπή η αγάπη, ο πόνος, η θυσία, μπαίνει ένα ανώτερο ενδιαφέρον και η καρδιά γλυκαίνεται. Έτσι δεν ξεχνάει κανείς την ευχή την ώρα της εργασίας. Βοηθιέται τότε και ο κόσμος θετικά, βοηθιέται και ο ίδιος που προσεύχεται και νιώθει πνευματική χαρά. Να κάνης το διακόνημά σου και να λές «Κύριε Ιησού Χριστέ, ελέησον ημάς», για να βοηθιούνται όλοι οι άνθρωποι. Στο «ελέησον ημάς» συμπεριλαμβάνονται όλοι. Ακόμη και οι πέντε-έξι μεγάλοι – πόσοι είναι αυτοί – από τους οποίους κρέμεται η τύχη όλου του κόσμου. Να δουλεύης και να εύχεσαι γι' αυτούς που δουλεύουν. Αυτή η ευχή πιάνει και αυτούς που εργάζονται σωματικά και αυτούς που εργάζονται πνευματικά. Γιατί είναι πολλοί αυτοί που δουλεύουν, και μάλιστα δουλεύουν πολύ. Άλλοι εργάζονται για το καλό της Εκκλησίας και της Πολιτείας. Άλλοι εργάζονται για το κακό· ξενυχτούν μελετώντας πώς να καταστρέψουν τον κόσμο. Άλλοι κάνουν συνέδρια και προσπαθούν να βρουν τρόπο να εμποδίσουν τους προηγούμενους να κάνουν κακό.  Άλλοι πάλι δουλεύουν μερόνυχτα, ξενυχτούν, για να βρουν λύσεις στα γενικά προβλήματα. Να εύχεσαι ο Θεός να φωτίση και τους κακούς να κάνουν λιγώτερο κακό ή να αποτρέψη τελείως το κακό. Να φωτίση και τους καλούς, για να βοηθούν τον κόσμο. Να εύχεσαι και για εκείνους που θέλουν να δουλέψουν και δεν μπορούν να δουλέψουν, γιατί είναι άρρωστοι. Και για τους υγιείς που δεν βρίσκουν δουλειά, ενώ έχουν ανάγκη. Να σκέφτεσαι διάφορες περιπτώσεις και να προσεύχεσαι γι' αυτές. Όταν ο νούς πάη σε όλους αυτούς, κεντιέται η καρδιά από τον πόνο και η ευχή γίνεται καρδιακή. Τόσοι άνθρωποι έχουν ανάγκη στην διάρκεια όλης της ημέρας! Να μη γίνεται σπατάλη στον χρόνο. Από εκείνον που δεν έχει μεγάλη ανάγκη για προσευχή – άσχετα αν αυτός νομίζη ότι έχει – προχωρεί κανείς και σκέφτεται όλους εκείνους που έχουν μεγαλύτερη ανάγκη. Τότε βοηθιέται και αυτός που νόμιζε ότι έχει ανάγκη, γιατί έγινε αφορμή να προσευχηθή ο άλλος για πολλούς.
- type: h2
  initial:
    ru: ''
  text:
    ru: Βοήθεια με την προσευχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Άγιος Ιάκωβος λέει: «Πολύ ισχύει δέησις δικαίου ενεργουμένη»[190]. Πώς εννοείται το «ενεργουμένη»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να θέλη και αυτός που ζητά την προσευχή να βοηθηθή, να σωθή, και να αγωνίζεται. Για να βοηθηθή δηλαδή κανείς από την προσευχή «δικαίου» ανθρώπου, χρειάζεται να έχη καλή διάθεση. Η ευχή που γίνεται με την καρδιά εισακούεται· πρέπει όμως και ο άλλος να είναι δεκτικός. Αλλιώς, εκείνος που προσεύχεται πρέπει να έχη την αγιότητα του Μεγάλου Παϊσίου, για να μπορέση να τον βγάλη από την κόλαση[191]. Γι' αυτό κάνετε προσευχή πρώτα γι' αυτούς που έχουν διάθεση να σωθούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εγώ, όταν παρακαλώ τον Θεό για διάφορες περιπτώσεις, λέω: «Θεέ μου, να είναι αισθητή η βοήθειά Σου, για να βοηθηθούν οι άνθρωποι και πνευματικά· αν δεν είναι αισθητή, μη μας βοηθάς». Πολλοί ούτε καν καταλαβαίνουν από τί μπόρες μας γλυτώνει ο Θεός και ούτε καν το σκέφτονται, για να δοξολογήσουν τον Θεό. Γι'' αυτό να ζητάμε να βοηθάνε ο Χριστός, η Παναγία, οι Άγιοι τον κόσμο, αλλά να είναι και αισθητή η βοήθειά Τους, για να ωφελούνται οι άνθρωποι. Ας υποθέσουμε ότι κινδυνεύει κάποιος να πέση από την σκαλωσιά και οικονομάει ο Θεός να σκαλώση κάπου, που δεν ήταν να σκαλώση, και γλυτώνει. Ή πέφτει κάπου και δεν σακατεύεται. Ή τρακάρει και γλυτώνει. Να ευχηθούμε να καταλάβη ότι ο Θεός τον βοήθησε και σώθηκε, για να βοηθηθή πνευματικά. Κάποιος έπεσε από ένα γεφύρι κάτω και σώθηκε. «Κατέβηκες να μετρήσης το βάθος;», του λέω. Στα χέρια μας κρατούν οι Άγιοι. Ένα παιδί που του είχα δώσει ένα σταυρουδάκι, καθώς έτρεχε με το μοτοσακό, πέρασε πάνω από ένα ταξί, έκανε μια τούμπα και συνέχισε να τρέχη στον δρόμο, χωρίς να πάθη τίποτε. Πολλοί γλυτώνουν, αλλά λίγοι καταλαβαίνουν και διορθώνονται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν κάνω προσευχή για κάποιον, αλλά εκείνος δεν ζητά βοήθεια, θα βοηθηθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θα εξαρτηθή από πολλά. Κατ᾿ αρχάς, αν εκείνος είχε καλή διάθεση, αλλά δεν βοηθήθηκε, δικαιούται την θεία βοήθεια. Και να μην προσευχηθούν οι άλλοι, θα οικονομήση ο Θεός αργότερα να βοηθηθή. Αλλά, αν ο ίδιος ζητήση εξ αρχής βοήθεια, θα επέμβη ο Θεός νωρίτερα και θα βοηθηθή νωρίτερα· αλλιώς θα βοηθηθή αργότερα. Με την προσευχή δίνουμε δικαίωμα στον Θεό να επέμβη. Κανονικά, ένας άνθρωπος, αν ζητάη βοήθεια με την καρδιά του και λέη ταπεινά «εύχου, Πάτερ, και για μένα», σού ραγίζει την καρδιά και δεν μπορείς να τον ξεχάσης. Ενώ, αν λέη τελείως επιπόλαια «εύχου, εύχου, τράβα κανέναν κόμπο», σαν να λέη «γειά χαρά!», πώς να τον θυμηθής;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν γίνεται προσευχή καρδιακή, με πόνο, για τα προβλήματα του κόσμου, όσοι άνθρωποι ζητούν εκείνη την ώρα βοήθεια από τον Θεό, λαμβάνουν αμέσως βοήθεια. Έχω πολλά χειροπιαστά παραδείγματα. Πριν από χρόνια, ένας άνθρωπος βαθιά απελπισμένος πέρασε μέσα στην σκοτοδίνη του τα σύνορα και βρέθηκε στο Παραπέτασμα. Εκεί τον πέρασαν για κατάσκοπο, τον συνέλαβαν, τον ταλαιπώρησαν και τον φυλάκισαν. Μέσα στην φυλακή προσευχόταν. Ένας γνωστός μου μοναχός έμαθε για το κατάντημά του και προσευχήθηκε. «Θεέ μου, είπε, Σε παρακαλώ, ελευθέρωσέ τον. Για Σένα είναι εύκολο αυτό να το κάνης». Μετά την φυλάκισή του τον κάλεσαν σε απολογία. Μετά την απολογία ο άνθρωπος αυτός βρέθηκε σε ελληνικό έδαφος. Όταν οι Έλληνες του έκαναν ανακρίσεις, είπε: «Με έδειραν, με φυλάκισαν, μου ζήτησαν απολογία. Από ᾿κεί και πέρα δεν θυμάμαι τίποτε. Δεν ξέρω, ούτε κατάλαβα πώς βρέθηκα στο ελληνικό φυλάκιο». Αυτή είναι η δύναμη της προσευχής. Η προσευχή κάμπτει τον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλά είναι ο... ασύρματός μας να δουλεύη συνέχεια, για να προλαβαίνη όλους τους ανθρώπους που ζητούν βοήθεια. Στον στρατό, στις Διαβιβάσεις, παρακολουθούσαμε τους ξένους σταθμούς, αλλά και βοηθούσαμε τους δικούς μας. Κάναμε τον ενδιάμεσο στους δικούς μας σταθμούς που ήταν μακριά από το κέντρο και δεν ακούγονταν· παίρναμε τα σήματά τους και τα διαβιβάζαμε. Ήμασταν πάντοτε δύο άτομα και κάναμε δύο βάρδιες. Γιατί, αν ήταν μόνον ένας, θα διέκοπτε και δεν θα μπορούσε να βοηθηθή ο άλλος που ζητούσε βοήθεια, και τα σήματά του δεν θα έφθαναν στον προορισμό τους. Ένας τέτοιος σταθμός, όταν δουλεύη συνέχεια, μπορεί να βοηθάη αυτούς που τα σήματά τους δεν φθάνουν στην μονάδα τους. Έτσι και αυτός που έχει παρρησία στον Θεό και προσεύχεται για τον άλλον κάνει τον ενδιάμεσο στον άνθρωπο που ζητά βοήθεια και στον Θεό. Αν ο ένας όμως ζητά βοήθεια, και ο άλλος έχη κλειστό τον σταθμό του, δεν προσεύχεται, τί γίνεται;
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ποιότητα της προσευχής μετράει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν έχουμε ένα αίτημα για κάποιο σοβαρό θέμα, μήπως πρέπει η προσευχή να συνοδεύεται με νηστεία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό δεν χρειάζεται συζήτηση· είναι κάτι το οποίο επιβάλλεται. Η νηστεία, η άσκηση, είναι προϋποθέσεις. Αλλά για να γίνη σωστή προσευχή, πρέπει να πονάη κανείς για τους άλλους. Γιατί είναι και τυπικό πολλών Χριστιανών της εποχής μας να μη θέλουν να στενοχωρηθούν. Και συνταξιούχοι ακόμη που όλη μέρα κάθονται, δεν πάνε να πλησιάσουν ένα παιδί εγκαταλελειμμένο, γιατί αυτό έχει φασαρία. Θα φάνε, θα πιούν τον καφέ τους και θα κάνουν έναν περίπατο, θα πάνε σε ένα νοσοκομείο που έχει νοσοκόμους, σε κάτι οργανωμένο, για να δούν έναν άρρωστο, γιατί αυτό είναι πιο εύκολο. Πάλι δηλαδή για να ευχαριστηθούν, οπότε αναπαύουν και τον λογισμό τους ότι έκαναν το καθήκον τους. Πόσους έχω στριμώξει να βοηθήσουν κάτι παιδάκια εγκαταλελειμμένα! Αυτοί τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο Άγιον Όρος έκαναν κάπου Λιτανεία για την ανομβρία καί, αντί να βρέξη, έπιασε πυρκαγιά! Δεν γίνεται η Λιτανεία σαν να κάνουμε περίπατο. Θέλει να πονέσουμε. Μπορεί να παραμείνη πειρασμός ή μια δύσκολη κατάσταση, αν κάνουν καρδιακή προσευχή οι καλόγεροι; Παρ᾿ όλα τα δύσκολα χρόνια βλέπω στα μοναστήρια να επικρατή ένα πνεύμα... Να είμαστε χαρούμενοι! Εδώ καίγεται ο κόσμος!Μας ζητούν να κάνουμε μια αγρυπνία, ας υποθέσουμε, για έναν άρρωστο, και ψάλλουμε «Ανοίξαντός Σου την χείρα» και χαιρόμαστε. Εμείς περνάμε ευχάριστα την ώρα μας και ο άλλος εν τω μεταξύ πεθαίνει. «Κάνουμε, λέει, αγρυπνία για τον άρρωστο». Τί αγρυπνία; Εσείς κάνετε διασκέδαση. Αυτό είναι πνευματική διασκέδαση. Μερικές φορές, ούτε όταν ο ιερέας λέη «Υπέρ των εν ασθενείαις κατακειμένων», προσευχόμαστε για τον άρρωστο. Θα βοηθούσαμε πιο θετικά, αν κάναμε και λίγη ευχή με κομποσχοίνι. Δεν λέω να καταργήσουμε τις πανηγυρικές αγρυπνίες που προβλέπει το τυπικό, αλλά σε τέτοιες περιπτώσεις να διαθέτουμε και λίγη ώρα, για να κάνουμε τουλάχιστον ένα-δύο κομποσχοίνια λέγοντας «Κύριε Ιησού Χριστέ, ελέησον τον δούλόν σου».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλη η βάση είναι η ποιότητα της προσευχής. Η προσευχή πρέπει να είναι καρδιακή, να γίνεται από πόνο. Για τον Θεό δεν μετράει τόσο η ποσότητα της προσευχής όσο η ποιότητα. Η προσευχή που γίνεται στα μοναστήρια έχει ποσότητα, αλλά δεν φθάνει αυτό· πρέπει να έχη και ποιότητα. Τόσες ώρες προσευχή που γίνεται από τόσα άτομα, αν ήταν καρδιακή, θα είχε αλλάξει ο κόσμος. Γι' αυτό σκοπός είναι οι Ακολουθίες να γίνωνται από την καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η καρδιακή προσευχή βοηθάει όχι μόνον τους άλλους αλλά και τον ίδιο τον εαυτό μας, γιατί βοηθάει να έρθη η εσωτερική καλωσύνη. Όταν ερχώμαστε στην θέση του άλλου, έρχεται φυσιολογικά η αγάπη, ο πόνος, η ταπείνωση, η ευγνωμοσύνη μας στον Θεό με την συνεχή δοξολογία, και τότε η προσευχή για τον συνάνθρωπό μας γίνεται ευπρόσδεκτη από τον Θεό και τον βοηθάει.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Και παρεβιάσαντο αυτόν»[192]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μένει ψυχρή η καρδιά μου στην προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι γιατί ο νούς δεν δίνει τηλεγράφημα στην καρδιά. Ύστερα στην προσευχή χρειάζεται να εργασθή κανείς· δεν μπορεί από την μια στιγμή στην άλλη να φθάση σε κατάσταση, ώστε να μη φεύγη καθόλου ο νούς του. Θέλει υπομονή. Βλέπεις, ο άλλος χτυπάει την πόρτα, ξαναχτυπάει, περιμένει, και μετά ανοίγει η πόρτα. Εσύ θές να χτυπήσης μια και να μπής μέσα. Δεν γίνεται έτσι. Όταν ξεκινάς να πής την ευχή, δεν έχεις επιθυμία γι᾿ αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αισθάνομαι την ανάγκη για βοήθεια, γιατί νιώθω αδύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, από ᾿κεί ξεκινάει κανείς. Στην προσευχή χρειάζεται επιμονή. «Και παρεβιάσαντο αυτόν», λέει το Ευαγγέλιο για τους δύο Μαθητές που συνάντησαν τον Χριστό στον δρόμο προς Εμμαούς. Έμεινε ο Χριστός μαζί τους, γιατί είχαν μια συγγένεια με τον Χριστό και το δικαιούνταν. Είχαν ταπείνωση, απλότητα, καλωσύνη, θάρρος με την καλή έννοια, όλες τις προϋποθέσεις, γι' αυτό και ο Χριστός έμεινε μαζί τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να προσευχώμαστε με πίστη για κάθε ζήτημα και να κάνουμε υπομονή, και ο Θεός θα μιλήση. Γιατί, όταν ο άνθρωπος προσεύχεται με πίστη, υποχρεώνει τον Θεό κατά κάποιον τρόπο για την πίστη του αυτή να του εκπληρώση το αίτημά του. Γι' αυτό, όταν ζητούμε κάτι από τον Θεό, να μη «διακρινώμεθα» και θα εισακουσθούμε. «Να έχετε πίστη χωρίς να διακριθήτε»[193], είπε ο Κύριος. Ο Θεός ξέρει πότε πρέπει να μας δώση αυτό που ζητούμε, ώστε να μη βλαφθούμε πνευματικά. Μερικές φορές ζητούμε κάτι από τον Θεό, αλλά δεν κάνουμε υπομονή και ανησυχούμε. Αν δεν είχαμε δυνατό Θεό, τότε να ανησυχούσαμε. Αλλά, αφού έχουμε Θεό Παντοδύναμο και έχει πάρα πολλή αγάπη, τόση που μας τρέφει και με το Αίμα Του, δεν δικαιολογούμαστε να ανησυχούμε. Μερικές φορές δεν αφήνουμε ένα δύσκολο θέμα μας στα χέρια του Θεού, αλλά ενεργούμε ανθρώπινα. Όταν ζητούμε κάτι από τον Θεό και κλονίζεται η πίστη μας και θέλουμε να ενεργήσουμε ανθρωπίνως στα δυσκολοκατόρθωτα, χωρίς να περιμένουμε την απάντηση στο αίτημά μας από τον Θεό, είναι σαν να κάνουμε αίτηση στον Βασιλέα Θεό και την παίρνουμε πίσω, την ώρα που Εκείνος απλώνει το χέρι Του, για να ενεργήση. Τον παρακαλούμε πάλι, αλλά και πάλι κλονίζεται η πίστη μας και ανησυχούμε και επαναλαμβάνουμε το ίδιο. Έτσι διαιωνίζεται η ταλαιπωρία μας. Κάνουμε δηλαδή σαν εκείνον που κάνει μία αίτηση στο Υπουργείο και ύστερα από λίγο μετανοιώνει και την αποσύρει. Ξαναμετανοιώνει, την υποβάλλει· μετά από λίγο πάλι την αποσύρει. Η αίτηση όμως πρέπει να μείνη, για να παίρνη την σειρά της.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχή με πόνο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς κάνετε ευχή για ένα θέμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όλη η βάση είναι να πονάη ο άνθρωπος. Αν δεν πονάη, μπορεί να κάθεται ώρες με το κομποσχοίνι και η προσευχή του να μην έχη κανένα αποτέλεσμα. Αν υπάρχη πόνος για το θέμα για το οποίο προσεύχεται, ακόμη και με έναν αναστεναγμό κάνει καρδιακή προσευχή. Πολλοί, όταν την στιγμή που τους ζητούν οι άλλοι να προσευχηθούν δεν έχουν χρόνο, προσεύχονται με έναν αναστεναγμό για το πρόβλημά τους. Δεν λέω να μην κάνη κανείς προσευχή, αλλά, αν τυχόν δεν υπάρχη χρόνος, ένας αναστεναγμός για τον πόνο του άλλου είναι μία καρδιακή προσευχή· ισοδυναμεί δηλαδή με ώρες προσευχής. Διαβάζεις λ.χ. ένα γράμμα, βλέπεις ένα πρόβλημα, αναστενάζεις και μετά προσεύχεσαι. Ού, αυτό είναι μεγάλο πράγμα! Πριν πιάσης το ακουστικό, πριν ακόμη καλέσης, σε ακούει ο Θεός! Και πώς το πληροφορείται ο άλλος! Να δήτε πώς οι δαιμονισμένοι καταλαβαίνουν πότε κάνω προσευχή γι᾿ αυτούς και φωνάζουν, όπου και αν βρίσκωνται!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η πραγματική προσευχή ξεκινάει από έναν πόνο· δεν είναι ευχαρίστηση, «νιρβάνα». Τί πόνος είναι; Βασανίζεται με την καλή έννοια ο άνθρωπος. Πονάει, βογγάει, υποφέρει, όταν κάνη προσευχή για οτιδήποτε. Ξέρετε τί θα πη υποφέρει; Ναί, υποφέρει, γιατί συμμετέχει στον γενικό πόνο του κόσμου ή στον πόνο ενός συγκεκριμένου προσώπου. Αυτήν την συμμετοχή, αυτόν τον πόνο, τον ανταμείβει ο Θεός με την θεία αγαλλίαση. Δεν ζητάει βέβαια ο άνθρωπος την θεία αγαλλίαση, αλλά η θεία αγαλλίαση έρχεται ως συνέπεια, επειδή συμμετέχει στον πόνο του άλλου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα ξεκινήση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μαθαίνει κάτι, λ.χ. ότι έγινε ένα δυστύχημα, «άχ!» αναστενάζει, και τάκ ο Θεός του δίνει παρηγοριά θεϊκή για τον λίγο αναστεναγμό. Βλέπει έναν να πονάη, και τάκ συμπάσχει μαζί του και παρηγορείται από τον Θεό με θεία παρηγοριά· δεν μένει με την πίκρα εκείνη. Βοηθιέται τότε ο άλλος με την προσευχή του. Ή σκέφτεται: «Ο Θεός μας έδωσε τόσα· εγώ τί έκανα για τον Θεό;». Μου έκανε εντύπωση αυτό που μου είπε μια ψυχή: «Οι Άγγελοι, λέει, καλύπτουν τα πρόσωπα, όταν τελήται το Μυστήριο της Θείας Ευχαριστίας, και εμείς κοινωνούμε το Σώμα του Χριστού. Εγώ τί έκανα για τον Χριστό;». Υποφέρει με την καλή έννοια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς καταλαβαίνει κανείς ότι βοηθήθηκε με την προσευχή του ο άλλος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το πληροφορείται από την θεία παρηγοριά που νιώθει μέσα του μετά από την πονεμένη του καρδιακή προσευχή που έκανε. Πρέπει όμως πρώτα τον πόνο του άλλου να τον κάνης δικό σου πόνο και ύστερα να κάνης και καρδιακή προσευχή. Η αγάπη είναι ιδιότητα θεϊκή και πληροφορεί τον άλλον. Και στα νοσοκομεία, όταν οι γιατροί και οι νοσοκόμες πονούν πραγματικά για τους αρρώστους, αυτό είναι το δραστικώτερο φάρμακο από όλα τα φάρμακα που τους δίνουν. Νιώθουν οι άρρωστοι ότι ενδιαφέρονται γι' αυτούς, και αισθάνονται σιγουριά, ασφάλεια, παρηγοριά. Ούτε πολλές κουβέντες χρειάζεται να πής στον άλλον που υποφέρει, ούτε να του κάνης διδασκαλία. Καταλαβαίνει ότι τον πονάς και έτσι βοηθιέται. Ο πόνος είναι το πάν. Αν πονέσουμε τους άλλους, ξεχνάμε τον εαυτό μας, τα προβλήματά μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η θεία παρηγοριά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν πονώ για τους άλλους, με πιάνει άγχος και δεν μπορώ να προσευχηθώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το ότι έχεις άγχος είναι δείγμα ότι υπάρχει ανθρώπινο στοιχείο μέσα σου. Εγώ, όσο πιο πολύ πονώ τον κόσμο, τόσο περισσότερο προσεύχομαι και χαίρομαι πνευματικά, γιατί τα λέω όλα στον Χριστό και Εκείνος τα τακτοποιεί. Και βλέπω ότι όσο περνάει ο καιρός, ενώ το σωματικό κουράγιο ελαττώνεται, το ψυχικό αυξάνει, γιατί η αγάπη, η θυσία, ο πόνος για τον άλλο δίνουν πολλή ψυχική δύναμη. Και να δής, απόψε που είχατε αγρυπνία είχα λιγοστό κουράγιο· όμως από τον πόνο των άλλων πήρα δύναμη. Και ήμουν όρθιος όλη την νύχτα μέχρι την Θεία Λειτουργία που έβλεπα τον κόσμο[194]. Μετά και μέσα στην Εκκλησία πάλι όρθιος, αλλά δεν ένιωθα κούραση, γιατί πονούσα τον κόσμο και αυτό με δυνάμωνε. Και εσύ να προσεύχεσαι και να χαίρεσαι, γιατί ο Χριστός θα τα οικονομήση όλα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην πνευματική αντιμετώπιση δεν υπάρχει θλίψη. Με τον κόσμο τώρα πόσο πόνο πέρασα! Δεν τα περνούσα έτσι τα θέματά τους. Πονούσα, αναστέναζα, αλλά σε κάθε αναστεναγμό, άφηνα το θέμα στον Θεό, και στον πόνο που ένιωθα για τον άλλον έδινε ο Θεός παρηγοριά. Δηλαδή με την πνευματική αντιμετώπιση ερχόταν θεία παρηγοριά, γιατί ο πόνος που έχει μέσα την ελπίδα στον Θεό έχει θεία παρηγοριά. Αλλιώς πώς να αντέξη κανείς! Πώς θα μπορούσα διαφορετικά να τα βγάλω πέρα με τόσα που ακούω; Πονάω, αλλά σκέφτομαι και την θεία ανταμοιβή στους πονεμένους. Είμαστε στα χέρια του Θεού. Αφού υπάρχει θεία δικαιοσύνη, θεία ανταπόδοση, τίποτε δεν πάει χαμένο. Όσο βασανίζεται κανείς, άλλο τόσο θα ανταμειφθή. Ο Θεός, ενώ βλέπει τόσον πόνο πάνω στην γή, ακόμη και πράγματα που εμείς δεν μπορούμε να τα συλλάβουμε, δεν τα χάνει. «Περισσότερο υποφέρεις; λέει, περισσότερο θα σε οικονομήσω στην άλλη ζωή», και γι᾿ αυτό χαίρεται. Διαφορετικά πώς θα μπορούσε, ας πούμε, να αντέξη τόση αδικία, τόση κακία που υπάρχει; Έχει όμως υπ' όψιν Του την ανταμοιβή αυτών που υποφέρουν και μπορεί, τρόπος του λέγειν, να αντέξη αυτόν τον μεγάλο πόνο. Εμείς δεν βλέπουμε τί δόξα θα λάβη ο άλλος και πονούμε, γι' αυτό ο Θεός μας ανταμείβει με θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτή η στενοχώρια δεν καταβάλλει τον άνθρωπο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι. Ο άνθρωπος, όταν αντιμετωπίζη το κάθε πρόβλημα πνευματικά, δεν καταβάλλεται. Στην αρχή πικραίνεται, όταν ακούη ότι κάποιος υποφέρει, αλλά μετά έρχεται ως ανταμοιβή η θεία παρηγοριά και δεν καταστρέφεται ο οργανισμός του. Ενώ η πίκρα από την κοσμική στενοχώρια φέρνει γαστρορραγία κ.λπ., αυτή δεν βλάπτει τον οργανισμό, γιατί έχει το θείο βάλσαμο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο κίνδυνος της αναισθησίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές μου ζητούν λαϊκοί να προσευχηθώ για ένα πρόβλημά τους. Το κάνω, χωρίς όμως να νιώσω πόνο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εδώ υπάρχουν δύο περιπτώσεις: η πρώτη είναι επικίνδυνη, η δεύτερη έχει πνευματική αντιμετώπιση. Όταν ο μοναχός ξεχνά τους δικούς του και δεν σκέφτεται και τους άλλους, δηλαδή δεν προσεύχεται για τον κόσμο, τότε αυτό είναι πολύ κακό. Ερχόμαστε δηλαδή στο μοναστήρι, εγκαταλείπουμε τους δικούς μας, και φθάνουμε να ξεχάσουμε τους δικούς μας, πόσο μάλλον τους άλλους. Αντιμετωπίζουμε τα πράγματα πνευματικά, αλλά δεν συμμετέχουμε στον πόνο των άλλων πνευματικά. Δεν προχωρούμε πνευματικά, για να μπορέσουμε να νιώσουμε τα προβλήματά τους, και υπάρχει κίνδυνος να φθάσουμε σε μια αναισθησία. Αρχίζει σιγά-σιγά μία αδιαφορία και γίνεται η καρδιά πέτρα. Στην δεύτερη περίπτωση πονά κανείς για όλο τον κόσμο, αλλά νιώθει και μια παρηγοριά, γιατί σκέφτεται ότι ο άλλος που υποφέρει θα έχη μισθό από τον Θεό, θα είναι μάρτυρας. Με αυτόν τον λογισμό νιώθει βαθειά σιγουριά και έχει μια εσωτερική χαρά. Σ᾿ αυτήν την περίπτωση η καρδιά δεν είναι πέτρινη αλλά θεϊκή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν δεν προσέξουν οι καλόγεροι, μπορεί να γίνη η καρδιά τους πολύ σκληρή. Οι κοσμικοί βλέπουν ατυχήματα, την δυστυχία των άλλων, και πονούν. Εμείς δεν την βλέπουμε και μπορεί να ζητάμε όλο για τον εαυτό μας. Αν δεν κάνουμε δηλαδή λεπτή εργασία, για να νιώσουμε την δυστυχία των άλλων και να κάνουμε γι' αυτούς καρδιακή προσευχή, θα γίνουμε σκληροκάρδιοι. Θα φθάσουμε σε σημείο να θέλουμε το βόλεμά μας και θα γίνη η καρδιά μας πέτρινη με την αδιαφορία, πράγμα που είναι αντιευαγγελικό. Ο μοναχός πρέπει να ενδιαφέρεται, να πονάη και να προσεύχεται γενικά για τον κόσμο. Αυτό δεν του φέρνει περισπασμό, αλλά αντιθέτως βοηθιέται και ο ίδιος με την προσευχή, βοηθάει και τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ενώ βλέπω τα χάλια μου, κάνω πιο πολλή προσευχή για τους άλλους. Μήπως είναι καλύτερα να μην προσεύχωμαι για τους άλλους και να προσεύχωμαι μόνο για τον εαυτό μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Από ταπείνωση; Αν είναι από ταπείνωση, να λές στον Θεό με πολλή ταπείνωση: «Θεέ μου, τέτοια που είμαι, δεν πρέπει να με ακούσης. Αλλά δεν είναι αδικία να υποφέρουν οι άλλοι εξ αιτίας μου; Γιατί, εάν είχα πνευματική κατάσταση, παρρησία, θα με άκουγες και θα τους βοηθούσες. Φταίω και εγώ, που ο άλλος υποφέρει. Τώρα όμως τί φταίει να υποφέρη εξ αιτίας μου; Σε παρακαλώ, βοήθησέ τον». Εξαρτάται δηλαδή πώς τοποθετείσαι για τους άλλους. Νιώθεις ότι δεν είσαι άξια, αλλά τυχαίνει, βλέπεις έναν πονεμένο, στενοχωριέσαι, πονάς, προσεύχεσαι. Όταν λ.χ. βλέπω έναν τυφλό, αισθάνομαι τον εαυτό μου ένοχο, γιατί, αν είχα πνευματική κατάσταση, θα μπορούσα να τον θεραπεύσω. Ο Θεός μας έδωσε την δυνατότητα να γίνουμε άγιοι, να κάνουμε θαύματα, όπως έκανε και Εκείνος. Αναγνωρίζουμε την μεγάλη ή μικρή μας πνευματική αρρώστια και ταπεινά ζητούμε την σωματική υγεία για τον συνάνθρωπό μας, ως ένοχοι για την αρρώστια του. Γιατί, εάν είχαμε πνευματική υγεία, θα είχε θεραπευθή προ καιρού και δεν θα παιδευόταν. Όταν τοποθετούμαστε σωστά, ότι είμαστε ένοχοι για όλη την κατάσταση του κόσμου, και λέμε «Κύριε, Ιησού Χριστέ, ελέησον ημάς», βοηθιέται και ο κόσμος όλος. Και για τα χάλια του πρέπει να πονέση κανείς και να ζητήση το έλεος του Θεού. Φυσικά, αν φθάση σε μια πνευματική κατάσταση, τότε για τον εαυτό του δεν ζητάει τίποτε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω ότι πολλές φορές πιάνουμε στραβά το «Κύριε, Ιησού Χριστέ, ελέησόν με» και δήθεν από ταπείνωση δεν λέμε «ελέησον ημάς», δεν προσευχόμαστε για τους άλλους παρά μόνο για τον εαυτό μας. Γι᾿ αυτό και μερικές φορές μας παρεξηγούν εμάς τους μοναχούς οι κοσμικοί και λένε ότι είμαστε εγωιστές και ότι φροντίζουμε να σώσουμε μόνον τον εαυτό μας. Το «ελέησόν με» είναι για να μην πέσουμε σε υπερηφάνεια. Η ευχή ενός ταπεινού ανθρώπου, που πιστεύει ότι είναι χειρότερος από όλους, έχει περισσότερη αξία από την αγρυπνία που κάνει ένας άλλος με υπερήφανο λογισμό. Όταν προσευχώμαστε με υπερηφάνεια, κοροϊδεύουμε τον εαυτό μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κατάσταση συναγερμού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μήν ξεχνάτε ότι περνούμε δύσκολους καιρούς και χρειάζεται πολλή προσευχή. Να θυμάστε την μεγάλη ανάγκη που έχει ο κόσμος σήμερα και την μεγάλη απαίτηση που έχει ο Θεός από μας για προσευχή. Να εύχεσθε για την γενική εξωφρενική κατάσταση όλου του κόσμου, να λυπηθή ο Χριστός τα πλάσματά Του, γιατί βαδίζουν στην καταστροφή. Να επέμβη θεϊκά στην εξωφρενική εποχή που ζούμε, γιατί ο κόσμος οδηγείται στην σύγχυση, στην τρέλλα και στο αδιέξοδο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μάς κάλεσε ο Θεός να κάνουμε προσευχή για τον κόσμο, που έχει τόσα προβλήματα! Οι καημένοι δεν προλαβαίνουν έναν σταυρό να κάνουν. Εάν εμείς οι μοναχοί δεν κάνουμε προσευχή, ποιοί θα κάνουν; Ο στρατιώτης σε καιρό πολέμου είναι σε κατάσταση συναγερμού, έτοιμος με τα παπούτσια. Στην ίδια κατάσταση πρέπει να είναι και ο μοναχός. Άχ, Μακκαβαίος[195]θα έβγαινα! Στα βουνά θα έφευγα, για να προσεύχωμαι συνέχεια για τον κόσμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να βοηθήσουμε με την προσευχή τον κόσμο όλο, να μην κάνη ο διάβολος ό,τι θέλει. Έχει αποκτήσει δικαιώματα ο διάβολος. Όχι ότι τον αφήνει ο Θεός, αλλά δεν θέλει να παραβιάση το αυτεξούσιο. Γι᾿ αυτό εμείς να βοηθήσουμε με την προσευχή. Όταν πονάη κανείς για την σημερινή κατάσταση που επικρατεί στον κόσμο και προσεύχεται, τότε βοηθιούνται οι άνθρωποι, χωρίς να παραβιάζεται το αυτεξούσιο. Αν προχωρήσετε με την Χάρη του Θεού ακόμη λίγο, θα αρχίσουμε να κάνουμε μια προσπάθεια στο θέμα της προσευχής, να μπή μια σειρά, να γίνετε ραντάρ, γιατί και τα πράγματα ζορίζουν. Θα διοργανώσουμε ένα συνεργείο προσευχής. Να κάνετε πόλεμο με το κομποσχοίνι. Με πόνο να γίνεται η προσευχή. Ξέρετε τί δύναμη έχει τότε η προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ πληγώνομαι, όταν βλέπω μοναχούς να ενεργούν ανθρωπίνως και όχι με την προσευχή δια μέσου του Θεού στα δυσκολοκατόρθωτα ανθρωπίνως. Ο Θεός μπορεί όλα να τα τακτοποιήση. Όταν κανείς κάνη σωστή πνευματική εργασία, τότε μπορεί μόνο με την προσευχή να χτίση μοναστήρια και να τα εφοδιάση με όλα τα απαραίτητα και να βοηθήση το σύμπαν. Δεν χρειάζεται ούτε να δουλεύη· αρκεί μόνο να προσεύχεται. Ο μοναχός πρέπει να προσπαθήση να μην πονοκεφαλάη για την άλφα ή βήτα δυσκολία, είτε είναι ατομική είτε ενός συνανθρώπου του είτε αφορά στην γενική κατάσταση, αλλά να καταφεύγη στην προσευχή και να στέλνη δια του Θεού πολλές θείες δυνάμεις. Άλλωστε και το έργο του μοναχού αυτό είναι, και εάν αυτό δεν το έχη καταλάβει ο μοναχός, η ζωή του δεν έχει κανένα νόημα. Γι᾿ αυτό, να ξέρη ότι η κάθε αγωνία του που τον ωθεί να αναζητά ανθρώπινες λύσεις στα διάφορα προβλήματα, με ένα βασάνισμα και πονοκέφαλο, είναι του πειρασμού. Όταν βλέπετε ότι σάς απασχολούν πράγματα για τα οποία ανθρωπίνως δεν υπάρχει λύση και δεν τα εμπιστεύεστε στον Θεό, να ξέρετε ότι αυτό είναι τέχνασμα του πειρασμού, για να αφήσετε την προσευχή, με την οποία μπορεί ο Θεός να στείλη όχι απλώς θεία δύναμη αλλά θείες δυνάμεις, και η βοήθεια τότε δεν θα είναι απλώς θεία βοήθεια αλλά θαύμα Θεού. Από την στιγμή που αρχίζουμε να αγωνιούμε, εμποδίζουμε τον Θεό να επέμβη. Βάζουμε την λογική μπροστά και όχι τον Θεό, το θείο θέλημα, ώστε να δικαιούμαστε την θεία βοήθεια. Ο διάβολος προσπαθεί, κλέβοντας με τέχνη την αγάπη του μοναχού, να τον κρατάη σε μια κοσμική αγάπη, σε μια κοσμική αντιμετώπιση και κοσμική προσφορά στον συνάνθρωπό του, ενώ ως μοναχός έχει την δυνατότητα να κινήται στον δικό του χώρο, στην δική του ειδικότητα, του Ασυρματιστού, γιατί αυτό είναι και το διακόνημα που του έδωσε ο Θεός. Όλα τα άλλα, όσα κάνουμε με τις ανθρώπινες προσπάθειες, είναι σε κατώτερη μοίρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Επίσης καλύτερα είναι ο μοναχός να βοηθάη τους άλλους με την προσευχή του παρά με τα λόγια του. Αν δεν έχη την δύναμη να συγκρατήση κάποιον που κάνει κακό, ας τον βοηθήση από μακριά με την προσευχή, γιατί διαφορετικά μπορεί και να βλαφθή. Μια ευχή καλή, καρδιακή, έχει περισσότερη δύναμη από χιλιάδες λόγια, όταν οι άλλοι δεν παίρνουν από λόγια. Παρόλο που λένε ότι βοηθώ τον κόσμο που έρχεται και με βρίσκει, ως θετική προσφορά μου στον κόσμο βλέπω την μιάμιση ώρα που διαβάζω το Ψαλτήρι. Το άλλο το θεωρώ ψυχαγωγία· να πούν οι καημένοι τον πόνο τους, να τους δώσω καμμιά συμβουλή. Γι᾿ αυτό την βοήθεια δεν την θεωρώ προσφορά δική μου· η προσευχή είναι που βοηθάει. Αν είχα όλο τον χρόνο μου για προσευχή, περισσότερο θα βοηθούσα τον κόσμο. Ας πούμε ότι θα δώ την ημέρα διακόσιους πονεμένους· μόνο διακόσιοι πονεμένοι υπάρχουν στον κόσμο; Αν δεν δώ κανέναν και προσευχηθώ για όλον τον κόσμο, τότε βλέπω όλον τον κόσμο. Γι'' αυτό λέω στον κόσμο: «Εγώ θέλω να μιλώ για σάς στον Θεό, και όχι σ́ εσάς για τον Θεό. Αυτό είναι καλύτερο για σάς, αλλά δεν με καταλαβαίνετε».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να μην παραμελούμε το θέμα της προσευχής σ́ αυτά τα δύσκολα χρόνια. Είναι ασφάλεια η προσευχή, είναι επικοινωνία με τον Θεό. Είδατε τί λέει ο Αββάς Ισαάκ; «Δεν θα μας ζητήση λόγο ο Θεός, γιατί δεν κάναμε προσευχή, αλλά γιατί δεν είχαμε επαφή με τον Χριστό και μας ταλαιπώρησε ο διάβολος»[196].
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Τα μοναστήρια είναι τα οχυρά της Εκκλησίας[197]
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο μοναχός είναι φάρος πάνω στα βράχια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ποιό είναι το έργο του μοναχού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έργο του μοναχού είναι να γίνη δοχείο του Αγίου Πνεύματος. Να κάνη την καρδιά του ευαίσθητη σαν το φύλλο του χρυσού των αγιογράφων. Όλο το έργο του μοναχού είναι αγάπη, όπως και το ξεκίνημά του γίνεται από αγάπη προς τον Θεό, η οποία έχει και την αγάπη προς τον πλησίον. Ο μοναχός  μελετάει την δυστυχία της κοινωνίας, πονάει η καρδιά του και προσεύχεται συνεχώς καρδιακά για τον κόσμο. Έτσι ελεεί τον κόσμο με την προσευχή. Υπάρχουν μοναχοί που βοηθούν τους ανθρώπους περισσότερο από όσο θα τους βοηθούσε όλος ο κόσμος μαζί. Ένας κοσμικός λ.χ. προσφέρει δύο πορτοκάλλια ή ένα κιλό ρύζι σε κάποιον φτωχό, πολλές φορές μόνο για να τον δούν οι άλλοι, και κατακρίνει μάλιστα, γιατί οι άλλοι δεν έδωσαν. Ο μοναχός όμως βοηθάει με τόννους σιωπηλά με την προσευχή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο μοναχός δεν βάζει δικά του σχέδια και προγράμματα κοσμικά για ιεραποστολές, αλλά προχωρεί χωρίς κανένα δικό του σχέδιο και ο Καλός Θεός τον περνάει στο σχέδιο το δικό Του, το θεϊκό, καί, αν χρειασθή για ιεραποστολή, τον στέλνει ο Θεός με θείο τρόπο. Δεν ζητάει ο Θεός από τους μοναχούς να βγουν στον κόσμο, για να κρατούν τους ανθρώπους να περπατούν, αλλά ζητάει να τους δώσουν το φως με το βίωμά τους, για να οδηγηθούν στην αιώνια ζωή. Ο μοναχός δηλαδή δεν έχει ως αποστολή να βοηθήση τον κόσμο με το να βρίσκεται μέσα στον κόσμο. Φεύγει μακριά από τον κόσμο, όχι γιατί μισεί τον κόσμο, αλλά γιατί αγαπάει τον κόσμο, και ζώντας μακριά από τον κόσμο, θα τον βοηθήση με την προσευχή του σε ό,τι δεν γίνεται ανθρωπίνως παρά μόνο με θεϊκή επέμβαση. Γι' αυτό ο μοναχός πρέπει να βρίσκεται σε διαρκή επικοινωνία με τον Θεό, να παίρνη σήματα και να δείχνη στους ανθρώπους τον δρόμο προς τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν μπορούσα να καταλάβω πώς δικαιολογούν μερικά πράγματα οι Ρωμαιοκαθολικοί. Μου λύθηκε η απορία πριν από λίγο καιρό, όταν πέρασαν από το Καλύβι δύο Ρωμαιοκαθολικοί αρχιτέκτονες από την Ρώμη. Είχαν άγνοια αλλά καλή διάθεση. «Τί κάνουν οι μοναχοί, μου λένε, και κάθονται εδώ; Γιατί δεν πηγαίνουν στον κόσμο να κάνουν κοινωνικό έργο;». «Οι φάροι, τους λέω, δεν πρέπει να είναι πάντοτε πάνω στα βράχια; Τί, πρέπει να πάνε στις πόλεις να προστεθούν στα φανάρια; Άλλη αποστολή έχουν οι φάροι, άλλη τα φανάρια». Ο μοναχός δεν είναι φαναράκι, για να τοποθετηθή στην πόλη σε μια άκρη του δρόμου και να φωτίζη τους διαβάτες, να μη σκοντάφτουν. Είναι φάρος απομακρυσμένος, στημένος ψηλά στα βράχια, που με τις αναλαμπές του φωτίζει τα πελάγη και τους ωκεανούς, για να κατευθύνωνται τα καράβια και να φθάνουν στον προορισμό τους, στον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το αθόρυβο κήρυγμα του μοναχού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θα κάνω προσευχή εσείς οι τρεις δόκιμες να μη μεγαλώσετε, να μείνετε έτσι, με αυτά τα μπλέ μαντήλια, σ᾿ αυτό το ύψος, σ᾿ αυτήν την ηλικία! Ξέρετε πώς βοηθιούνται αθόρυβα οι άνθρωποι, όταν σάς βλέπουν; Γιατί σήμερα στον κόσμο δεν βρίσκουν εύκολα μια σωστή κοπέλα. Οι περισσότερες είναι αγριεμένες, με τα τσιγάρα στο χέρι, κάνουν κάτι μορφασμούς... Και βλέπουν εδώ νέες αφιερωμένες, να ψέλνουν, να χαίρωνται... Σού λέει: «Τί γίνεται εδώ; κάτι συμβαίνει. Να πούμε ότι είναι χαζές; δεν είναι. Να πούμε ότι τους λείπει κάτι; δεν τους λείπει. Φαίνεται, κάτι ανώτερο υπάρχει». Πράγματι, ξέρετε πόσο βοηθάει αυτό;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν πηγαίνουν κοσμικοί σε ένα μοναστήρι και βλέπουν σωστούς μοναχούς, τότε και άπιστοι να είναι, αν έχουν καλή διάθεση, γίνονται πιστοί. Πολλοί άθεοι επιστήμονες που ήρθαν μόνο για μια επίσκεψη στο Άγιον Όρος, άλλαξαν ζωή. Προβληματίζονται με την καλή έννοια και βοηθιούνται. Βλέπουν νέους ανθρώπους, χαρούμενους, που είχαν όλες τις προϋποθέσεις να αναδειχθούν στον κόσμο, να αφήνουν πλούτη, θέσεις κ.λπ., και να ζουν ασκητικά, με προσευχή και αγρυπνία, και λένε: «Τί γίνεται; αν όντως υπάρχη Θεός, αν υπάρχη άλλη ζωή, αν υπάρχη κόλαση, εγώ τί κάνω;». Έτσι φρενάρουν την αμαρτωλή ζωή τους ή και την διορθώνουν. Ξέρω μια περίπτωση· μια κοπέλα είκοσι χρονών έκανε απόπειρα αυτοκτονίας, έκοψε τις φλέβες της, αλλά την πρόλαβαν. Βρέθηκε μετά ένας μοναχός, την πήρε και την πήγε σε ένα γυναικείο μοναστήρι. Ήταν η καημένη αγριεμένη. Όταν όμως είδε εκεί τις μοναχές, συνήλθε. «Βλέπω άλλον κόσμο εδώ, είπε. Μπορώ να μείνω;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτό είναι το αθόρυβο κήρυγμα του μοναχού. Πολλοί κηρύττουν, λίγοι εμπνέουν εμπιστοσύνη, γιατί η ζωή τους δεν ανταποκρίνεται στα λόγια τους. Ο μοναχός δεν κάνει κηρύγματα δυνατά να τον ακούσουν οι άλλοι, αλλά κηρύττει σιωπηλά με την ζωή του τον Χριστό και βοηθάει με την προσευχή του. Ζή το Ευαγγέλιο και η Χάρις του Θεού τον προδίδει. Έτσι κηρύττεται το Ευαγγέλιο κατά τον θετικώτερο τρόπο, πράγμα που διψάει ο κόσμος, ιδίως ο σημερινός. Και όταν μιλάη ο μοναχός, δεν λέει απλώς μια σκέψη· λέει μια εμπειρία. Αλλά και μια σκέψη να πή, και αυτή είναι φωτισμένη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί λένε ότι οι νέοι ή οι νέες πηγαίνουν στο μοναστήρι άλλοτε από απογοήτευση και άλλοτε επειδή έχουν κάποια αναπηρία ή επειδή είναι ελαφροί στο μυαλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι άνθρωποι αυτοί είχαν φαίνεται ένα ή δύο τέτοια περιστατικά κατά νού και αδικούν στην συνέχεια ή από κακότητα ή από ζήλεια το 90% των μοναχών. Εάν όμως εξετάσουν τα πράγματα και δούν ότι δεν είναι έτσι, τότε λένε ότι εδώ υπάρχει κάτι ανώτερο, υπάρχει Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό ο μοναχός πρέπει να είναι πάντοτε το καλό παράδειγμα για τον κόσμο – «ούτω λαμψάτω το φως υμών έμπροσθεν των ανθρώπων»[198]. Ο σωστός μοναχός είναι το φως του κόσμου. Τί λέει ο Άγιος Ιωάννης της Κλίμακος; «Οι Άγγελοι είναι φως για τους μοναχούς και οι μοναχοί είναι φως για τους κοσμικούς»[199]. Ο μοναχός, όταν διαφέρη από τους κοσμικούς, τότε βοηθάει θετικά. Γιατί αυτό που βοηθάει τους κοσμικούς που ταλαιπωρούνται για μάταια πράγματα είναι η αγιότητα, η οποία με την απλότητά της τους διδάσκει να συλλάβουν το βαθύτερο νόημα της ζωής, για να τους φύγη το πλάκωμα από την καρδιά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο μοναχός και η αναγέννηση του κόσμου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι μοναχοί είναι ο τακτικός στρατός του Χριστού, γι᾿ αυτό δεν πληρώνονται. Νά, βλέπεις πώς πολλοί δεν μπορούν να ξεχάσουν το Άγιον Όρος! Όπου αλλού να πάνε, θα τους ζητήσουν χρήματα κ.λπ., ενώ στο Άγιον Όρος θα βγάλουν μόνον το διαμονητήριο και από εκεί και πέρα μπορούν να πάνε όπου θέλουν, χωρίς να πληρώσουν. Θα φάνε δωρεάν, θα κοιμηθούν δωρεάν. Βρίσκουν κάτι άλλο, και γι᾿ αυτό βοηθιούνται. Όταν ήμουν στο Καλύβι του Τιμίου Σταυρού[200], ήρθε κάποιος που είχε προβλήματα. Συζητήσαμε μιάμιση ώρα. Μετά έβγαλε να μου δώση ένα πεντακοσάρικο. «Τί είναι αυτό;», του λέω. «Για μια απλή επίσκεψη στον γιατρό πληρώνουμε τόσο, μου λέει. Με συγχωρής, μήπως είναι λίγα;».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί μεγάλοι της Ε.Ο.Κ., όταν ήρθαν στο Άγιον Όρος ύστερα από την τελευταία πυρκαγιά, για να δούν τί χρειάζεται και να βοηθήσουν, πέρασαν και από το Καλύβι. Πάνω στην συζήτηση τους είπα: «Εμείς ήρθαμε εδώ, για να δώσουμε· δεν ήρθαμε, για να πάρουμε». «Πρώτη φορά το ακούσαμε αυτό», μου είπαν και το σημείωσαν αμέσως[201]. Εμείς γίναμε μοναχοί, για να πάρουμε υλικά; Γίναμε μοναχοί, για να δίνουμε πνευματικά, χωρίς να παίρνουμε υλικά. Να είμαστε απαλλαγμένοι από τα βιοτικά, για να μεριμνούμε για τα πνευματικά. Βγήκαμε στο κλαρί για την αγάπη του Χριστού, για να ελευθερωθούμε εμείς από τα πάθη και να ελευθερώσουμε και άλλους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο σκοπός μας είναι με την προσευχή και το παράδειγμά μας να βοηθηθούν οι άνθρωποι, για να αναγεννηθούν πνευματικά. Όταν φεύγη από τον κόσμο κανείς και μπαίνη στο μοναστήρι, γίνεται Πατήρ ή Μήτηρ, δηλαδή πνευματικός Πατέρας ή πνευματική Μητέρα. Μια κοπέλα, όταν γίνεται μοναχή, «νυμφεύεται»· γίνεται νύμφη Χριστού, μητέρα πνευματική, και βοηθάει για την πνευματική αναγέννηση των ανθρώπων. Με την προσευχή βοηθάει να γίνουν λ.χ. σωστές οικογένειες. Αλλά εκτός από την προσευχή, υπάρχουν και περιπτώσεις που πρέπει να προσφέρη στον άνθρωπο και ανθρώπινη βοήθεια. Κάθε σωστή μοναχή, εκτός από την προσευχή που κάνει για τον κόσμο, πολύ βοηθάει με τον τρόπο της, με μια σωστή αντιμετώπιση, με δυο λόγια πνευματικά που θα πη εκεί στο αρχονταρίκι σε έναν προσκυνητή, για να συλλάβη το βαθύτερο νόημα της ζωής, σε μια μητέρα, για να την στηρίξη. Το να ζητάη όμως η μοναχή επικοινωνίες κ.λπ., είναι χαμένα πράγματα, γιατί οι προβολές οι κοσμικές έρχονται σε σύγκρουση με τους πνευματικούς νόμους και ταλαιπωρούμαστε. Όσο μπορείτε, να κινήσθε στην αφάνεια. Κάνω μια σύγκριση και πονώ: Μερικοί μοναχοί επιδιώκουν πανηγύρια, επισκέψεις, φιλίες πνευματικές. Εγώ αναγκάζομαι να πάω κάπου για πνευματική εργασία και το νιώθω σαν μαρτύριο, το βλέπω σπατάλη χρόνου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μια μοναχή μεγάλη στην ηλικία είναι ανώριμη πνευματικά, τί φταίει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν παρακολουθεί τον εαυτό της και δεν κάνει την πνευματική εργασία που πρέπει. Το κακό από εκεί ξεκινάει. Ας πούμε ότι μια δεν την καλούσε για μοναχή ο Χριστός και έμενε στον κόσμο και γινόταν μητέρα. Τότε δεν θα είχε απαιτήσεις αυτή από τους άλλους, αλλά οι άλλοι θα είχαν απαιτήσεις από αυτή. Θα έδινε πολλά και θα έπαιρνε πολλά με την θυσία που θα έκανε. Στο μοναστήρι πρέπει να γίνη πνευματική μητέρα· η αποστολή της είναι ανώτερη και από της μητέρας. Αλλά τώρα τί γίνεται; Έρχεται στο μοναστήρι μικρή καί, αν δεν κάνη την πνευματική εργασία που πρέπει, έχει τον λογισμό ότι είναι συνέχεια παιδί. Πρέπει όμως να καταλάβη ότι δεν είναι παιδί, για να έχη τον λογισμό: «Έχουμε την μάνα μας, έχουμε το σπίτι μας, έχουμε το αμέριμνο, και δεν με νοιάζει». Πρέπει να δίνη, να βοηθάη για την αναγέννηση την πνευματική τις μικρότερες αδελφές με την συμπεριφορά της, ή τους λαϊκούς που έρχονται στο μοναστήρι εκεί που διακονεί στο αρχονταρίκι, στην Εκκλησία κ.λπ., να θυσιάζεται σε όλα, και έτσι, χωρίς να ζητάη, θα παίρνη. Αν η μοναχή δεν τοποθετηθή έτσι, πάνε όλα χαμένα. Μένει σε μια υπανάπτυκτη κατάσταση και θέλει συνέχεια να παίρνη και από μικρές και από μεγάλες, χωρίς εκείνη να δίνη. Καλλιεργεί ένα βλαμμένο πνεύμα και δεν ωριμάζει, γιατί δεν προσφέρει τον εαυτό της στους άλλους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπω σε μερικούς μοναχούς ακριβώς την κατάσταση ενός Βεδουΐνου που είχα γνωρίσει στο Σινά. Ήταν εξήντα πέντε χρονών και έλεγε: «Και εγώ δεν έχω πατέρα· είμαι ορφανός»! Εξήντα πέντε χρονών έχουν εγγονάκια. Δυο γενιές και τρεις πέρασαν και να λέη «καί εγώ δεν έχω πατέρα», να αναζητά δηλαδή την αγάπη του πατέρα! Και εμείς οι καλόγεροι, αν δεν προσέξουμε, παραμένουμε παιδιά· αυτό είναι το κακό. Αν όμως σκεφθή η μοναχή ή ο μοναχός τί θα έκανε στον κόσμο σ́ αυτήν την ηλικία, θα πή: «Τώρα δεν πρέπει να ζητώ ανθρώπινη παρηγοριά· εγώ πρέπει να θυσιασθώ, και όχι να έχω απαιτήσεις». Έρχονται στο μοναστήρι οι περισσότεροι μικροί, βρίσκουν πνευματικούς γονείς και μπορεί να μείνουν σε μια παιδική κατάσταση, με παιδικές απαιτήσεις, ενώ, αν ήταν στον κόσμο, θα γίνονταν γονείς. Παραμένουν δηλαδή συνέχεια παιδιά όχι με την καλή έννοια αλλά με την μωρουδίστικη. Και βλέπεις, μπορεί να γεράσουν αλλά, αν δεν δουλέψουν το μυαλό, μπορεί να χαρούν με μια καραμέλλα ή με μια φανέλλα. «Μου πήρε μαλλίνα ο Γέροντας», έλεγε ένα γεροντάκι εκεί στο Άγιον Όρος και έδειχνε την φανέλλα που του έδωσε ο Γέροντάς του. Χαιρόταν σαν το παιδάκι που του πήρε η μάνα του σακκάκι με σειρήτια!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να γίνουμε παιδιά στην ακακία, όχι στο μυαλό[202]. Γιατί αλλιώς, πώς θα μπή στην ζωή μας η παλληκαριά; Πώς θα μπή ο ανδρισμός; Ένας μοναχός, για να κάνη προκοπή, πρέπει να μαλακώση αυτό το σκληρό που έχει, να κάνη δηλαδή λίγο μητρική την καρδιά του. Και μια μοναχή, για να κάνη προκοπή, πρέπει να αποκτήση λίγο ανδρισμό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική συστολή αλλοιώνει τους άλλους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια ψυχή, όταν έρχεται στο μοναστήρι και έχη ακόμη το κοσμικό φρόνημα, έναν κοσμικό αέρα, πώς θα το αποβάλη αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν μπαίνη στο μοναστήρι, πρέπει να ξεχάση τον κόσμο και μετά να μην ξεχνάη ότι βρίσκεται σε μοναστήρι. Καλά, στο σπίτι της μπορεί να μη βοηθήθηκε, να μην πήρε σωστή αγωγή· τώρα θέλει προσοχή τί αγωγή θα πάρη εδώ. Μοναχική αγωγή. Το μοναστήρι είναι ένας ιερός χώρος. Ο κόσμος είναι άλλο. Όταν σκέφτεται κανείς ότι κινείται μέσα σε έναν ιερό χώρο, έρχεται μόνη της η συστολή. Αλλά, όταν ξεχνιέται και νομίζη ότι είναι στον κόσμο, πώς θα έρθη η συστολή; Να κινήται φυσιολογικά η μοναχή, με απλότητα, με ταπείνωση, όχι να πάη να κάνη την κακομοίρα. Αυτό είναι αηδιαστικό, αποκρουστικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω σε μερικές δόκιμες αδελφές που περπατούν καμαρωτές–καμαρωτές ένα κοσμικό πράγμα. Σαν νύμφες κοσμικές περπατούν, όχι σαν νύμφες Χριστού. Ενώ σε άλλες που περπατούν με μια συστολή, βλέπω κάτι το ιερό. Πόσο διαφέρει το ένα από το άλλο! Αμέσως καταλαβαίνει κανείς τί είναι ο Μοναχισμός. Εάν παρατηρήσετε τα στάχυα, θα δήτε ότι όποιο στέκεται ψηλά, όρθιο, δεν έχει τίποτε μέσα. Ενώ το ψωμωμένο στάχυ γέρνει προς τα κάτω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας μοναχός με ευλάβεια αλλοιώνει τους άλλους που τον βλέπουν. Νά, σήμερα ήρθε ένας ιερομόναχος που τον γνωρίζω από παλιά. Παρόλο που είναι άσχημος, δηλαδή δεν έχει ομορφιά εξωτερική, πάντα όταν κοινωνούσε, τον έβλεπα να λάμπη. Αλλά και όταν δεν κοινωνούσε, έβλεπα μια λάμψη, μια πνευματική λάμψη στο πρόσωπό του. Όπως η άσφαλτος, ενώ είναι πίσσα, όταν την βλέπη κανείς από μακριά το καλοκαίρι, έχει πολλές φορές μια γυαλάδα, έτσι και εδώ βλέπεις μια λάμψη σε έναν που είναι άσχημος. (Δεν είναι φυσικά τόσο κατάλληλο το παράδειγμα, αλλά τί να φέρη κανείς σαν παράδειγμα;). Δηλαδή εκείνη η πνευματική κατάσταση που έχει, του δίνει και εξωτερικά μια λάμψη. Αυτή είναι η ομορφιά η πνευματική, η χάρις, η θεία Χάρις. Και άλλοι ιερωμένοι που έχουν ομορφιά εξωτερική, αλλά έχουν κοσμικό πνεύμα και κινούνται με έναν κοσμικό αέρα, πόσο αποκρουστικό είναι! Βλέπεις έναν άνθρωπο τελείως κοσμικό. Δηλαδή εκτός από την ιερωσύνη, να μη βλέπης τίποτε άλλο πνευματικό. Ο άνθρωπος καθρεφτίζεται στο πρόσωπο. Είναι αυτό που είπε ο Χριστός: «Ο λύχνος του σώματός εστιν ο οφθαλμός. Εάν ο οφθαλμός σου απλούς ή, όλον το σώμά σου φωτεινόν έσται»[203]. Αν έχη κανείς απλότητα, έχη ταπείνωση, υπάρχει θείος φωτισμός, λαμποκοπάει. Νά, αυτό πρέπει να επιτύχη ο μοναχός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο Άγιος Νείλος ο Καλαβρός λέει ότι από την στιγμή που κάποιος γίνεται μοναχός, θα γίνη ή Άγγελος ή διάβολος[204]. Δηλαδή δεν υπάρχει κάτι ενδιάμεσο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Θέλει να πη πώς ο μοναχός πρέπει να κάνη σωστή δουλειά. Γι᾿ αυτό και όταν ένας μεγαλόσχημος μοναχός πέση σε θανάσιμη αμαρτία, επιτρέπει ο Θεός να πέση ράβδος, για να εξιλεωθή. Μερικές φορές νομίζουμε ότι θα πάρουμε την Χάρη με εξωτερικά πράγματα, με τεχνητό, με μαγικό τρόπο. Αλλά έτσι ούτε ο Θεός αναπαύεται ούτε ο ίδιος ο άνθρωπος αναπαύεται εσωτερικά ούτε και τους άλλους αναπαύει. Φτιάχνουν λ.χ. μερικοί μοναχοί σχήματα φαρδιά και μακριά μέχρι κάτω, με σταυρούς κόκκινους, με τριαντάφυλλα, με κόκκινα κλαδιά, με ένα σωρό γράμματα... Ανοίγουν εν τω μεταξύ και το ράσο, για να φαίνωνται, σαν τους Φαρισαίους που φάρδαιναν τα κράσπεδα[205], για να δείξουν ότι προσεύχονται πολύ! Και έβλεπες παλιά, μόνον όταν περπατούσε ο μοναχός φαινόταν λίγο το σχήμα κάτω από το ράσο. Πολλοί μάλιστα έβαζαν ένα μικρό σχήμα από μέσα, για να μη φαίνεται καθόλου. Τώρα κούφια πράγματα. Έτσι θα πάρουν Χάρη από το σχήμα; Τους σιχαίνεται το σχήμα και φεύγει η Χάρις. Σκοπός είναι να γίνη από μέσα ο μοναχός μεγαλόσχημος. Και όποιος γίνεται από μέσα μεγαλόσχημος, το σχήμα το κρύβει. Ένα εξωτερικό πράγμα δεν κάνει την αλλοίωση την εσωτερική. Έτσι μετά μένει κανείς εξωτερικός άνθρωπος, και τελικά θα μας πη ο Χριστός: «Ουκ οίδα υμάς»[206].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο σκοπός των μονών είναι πνευματικός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο μοναχός ενδιαφέρεται για την σωτηρία την δική του και για την σωτηρία όλων των ζώντων και όλων των κεκοιμημένων. Για τον μοναχό η πραγματική, η θεϊκή αγάπη βρίσκεται μέσα στον πόνο για την σωτηρία της ψυχής του και στον πόνο για την σωτηρία όλου του κόσμου. Η αφιερωμένη ψυχή του μοναχού συντελεί να σωθούν όχι μόνον οι οικείοι του, αλλά ακόμη και οι συγχωριανοί του. Γι᾿ αυτό υπήρχε μία καλή παράδοση στην Μικρά Ασία, να υπάρχη έστω και ένας μοναχός από κάθε συγγένεια, για να πρεσβεύη για όλους. Στα Φάρασα, όταν γινόταν κανείς μοναχός, πανηγύριζε όλο το χωριό. «Θα βοηθήση, έλεγαν, και το χωριό ακόμη».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο μοναχός βέβαια δεν λέει ποτέ «νά σώσω τον κόσμο», αλλά προσεύχεται για την σωτηρία όλου του κόσμου, παράλληλα με την δική του. Και όταν ο Καλός Θεός ακούση την προσευχή του και βοηθήση τον κόσμο, πάλι ο μοναχός δεν λέει «εγώ έσωσα τον κόσμο», αλλά «ο Θεός έσωσε τον κόσμο». Ο μοναχός πρέπει να φθάση σε τέτοια κατάσταση που να πή: «Θεέ μου, μη με κοιτάς, μη με ελεής εμένα, αλλά τον κόσμο». Όχι γιατί δεν έχει ανάγκη ο ίδιος του ελέους του Θεού, αλλά γιατί έχει πολλή αγάπη για τον κόσμο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μέχρι ποιό σημείο πρέπει ένας μοναχός να αφήνη τον εαυτό του, για να βοηθήση τον κόσμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μέχρι εκεί που βλέπει ότι βοηθιούνται οι άνθρωποι. Αν αφήσω τον εαυτό μου τελείως στα χέρια των κοσμικών, θα γίνω και εγώ κοσμικός. Όταν ένας μοναχός, δήθεν για να βοηθήση τους κοσμικούς, κάνη πράγματα που δεν ταιριάζουν στον Μοναχισμό, τότε δεν βοηθιούνται οι κοσμικοί. Ένας καλόγερος μπορεί π.χ. να κάνη άριστα τον ταξιτζή. Δεν θα παίρνη χρήματα, θα λέη και πνευματικά στον κόσμο, αλλά αυτό δεν είναι μοναχικό. Βρίσκεις μερικές φορές μοναχούς να έχουν κοσμικό πνεύμα και κοσμικούς να έχουν μοναχικό πνεύμα. Γι᾿ αυτό ο Χριστός στην άλλη ζωή θα πή: «Βγάλε το σχήμα εσύ και πάρ᾿ το εσύ...». Ο κοσμικός, όταν επιθυμήση την ζωή του μοναχού, αγιάζεται· ενώ ο μοναχός, όταν επιθυμήση την κοσμική ζωή, κολάζεται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καταλαβαίνει κανείς αν δεν έχη σωστή τοποθέτηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και να μην καταλαβαίνη, αν είναι κάτι λανθασμένο, δεν θα έχη την πλήρη ειρήνη, την ανάπαυση μέσα του. Σε ό,τι δεν ταιριάζει στον Μοναχισμό, δεν θα βρη ανάπαυση και η ψυχή του. Και από την στιγμή που δεν νιώθει ανάπαυση η ψυχή του, πρέπει να ψάξη να βρη τί φταίει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πήγε ένας γνωστός μου σε ένα μοναστήρι και μετά  μου είπε: «Εκεί βιοτεχνία είναι· η δε ηγουμένη καλή είναι, για να πάη στο Μοναστηράκι[207], στην Αθήνα, και να πουλάη κουμπιά· γι᾿ αυτήν την δουλειά είναι ό,τι πρέπει!». Δηλαδή το μοναστήρι είναι βιοτεχνία· μετά γίνεται μονάδα, μετά σούπερ-μάρκετ και μετά Μάκρο! Οι καημένοι οι κοσμικοί θέλουν από εμάς τους μοναχούς κάτι το ανώτερο καί, για να πετύχουμε το ανώτερο, πρέπει να αποφύγουμε κάθε ανθρώπινη παρηγοριά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο σκοπός των μονών είναι πνευματικός και δεν πρέπει να υπάρχη το κοσμικό στοιχείο αλλά το ουράνιο, για να πλημμυρίζουν οι ψυχές από παραδεισένιες γλυκύτητες. Στα κοσμικά δεν μπορούμε να συναγωνισθούμε τους κοσμικούς, διότι, όσο νάναι, οι κοσμικοί έχουν περισσότερα μέσα. Ένα μοναστήρι, όταν ζη πνευματικά, ξέρετε πώς προβληματίζει τον κόσμο; Όταν υπάρχη ευλάβεια, φόβος Θεού, και δεν υπάρχη ούτε κοσμική λογική ούτε εμπορικό πνεύμα, αυτό είναι που συγκινεί τους λαϊκούς. Αλλά δυστυχώς το εμπορικό πνεύμα μπαίνει σιγά-σιγά στο μεδούλι του Μοναχισμού. Είχε έρθει ένας καλόγερος στο Καλύβι και έπλεκα κομποσχοίνι. «Εσύ, μου λέει, τα κομποσχοίνια τα δίνεις ευλογία. Εγώ αυτό το τριαντατριάρι κομποσχοίνι μπορώ να το πουλήσω και πεντακόσιες δραχμές. Και δεν το φτιάχνω όπως εσύ. Εγώ μόλις τελειώσω τους κόμπους, το κόβω και το ράβω λίγο, για να μη χάσω το νήμα. Χρησιμοποιώ και την κλωστή που κόβω από τον σταυρό, την ενώνω, δεν βάζω και χάνδρες και κερδίζω πιο πολλά». «Βρέ, δεν ντρέπεσαι, του λέω. Δεν καταλαβαίνεις ότι έχεις εμπορικό πνεύμα; Από το 1950 είμαι καλόγερος και πρώτη φορά είδα τέτοια αντιμετώπιση!».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, λίγοι άνθρωποι υπάρχουν που είναι ώριμοι πνευματικά, για να μπορούν να βοηθήσουν τον κόσμο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: –  Ναί, δυστυχώς λίγοι υπάρχουν! Τί να κάνη και ο κόσμος μετά; Ξέρεις πόσο παρακαλώ να παρουσιάση ο Θεός ανθρώπους σωστούς, που να μπορούν να βοηθούν τον κόσμο; Οι καημένοι οι άνθρωποι αρκεί λίγο να τους πονάς και να μην τους εκμεταλλεύεσαι· τίποτε άλλο δεν θέλουν. Στον κόσμο βρίσκονται σε συνεχή πόλεμο και νιώθουν ανασφάλεια. Όταν πηγαίνουν σε ένα μοναστήρι που ζη σωστά, βοηθιούνται, γιατί νιώθουν ασφάλεια και αυτό τους δίνει κουράγιο, για να συνεχίσουν τον αγώνα τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτά τα δύσκολα χρόνια οι άνθρωποι δεν έχουν τόσο ανάγκη από υλική τροφή, όσο από πνευματική.  Δεν έχει ανάγκη δηλαδή ο κόσμος από ψωμί – αν και αυτό δυστυχώς σε λίγο δεν θα υπάρχη δυνατότητα να το προσφέρουν – αλλά από πνευματική βοήθεια. Να κοιτάξουμε να βοηθήσουμε με την προσευχή  όλο τον κόσμο. Να βοηθήσουμε μια οικογένεια λ.χ. να μη διαλυθή, μια μάνα να μεγαλώση σωστά τα καημένα τα παιδιά της. Να συγκρατήσουμε λίγο αυτούς που έχουν ευλάβεια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κατάσταση πνευματική, οχυρό πνευματικό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα είναι καιρός να ετοιμασθούν οι ψυχές, γιατί, αν συμβή κάτι, δεν ξέρω τί θα γίνη. Είθε να μην επιτρέψη ο Θεός να έρθουν δύσκολες μέρες, αλλά αν έρθουν, με έναν μικρό σεισμό, με ένα τράνταγμα, θα σωριάσουν ολόκληρες αδελφότητες, ολόκληρα μοναστήρια, γιατί ο καθένας θα πάη να σώση τον εαυτό του και θα τραβήξη την πορεία του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χρειάζεται πολλή προσοχή, για να μη μας εγκαταλείψη ο Θεός. Οι ψυχές να έχουν κάτι πνευματικό. Αυτό σάς τιμάει. Θα γίνη μεγάλο τράνταγμα. Τόσα σάς λέω, τόσο σκληρά έχω μιλήσει! Εμένα κάτι να μου έλεγαν, θα προβληματιζόμουν, θα σκεφτόμουν γιατί μου το είπαν, τί ήθελαν. Για να μην πω βράδυα, ένα βράδυ δεν θα κοιμόμουν. Αν δεν έβλεπα τα δύσκολα χρόνια που έρχονται, δεν θα ανησυχούσα τόσο. Αλλά αυτό που βλέπω είναι ότι αργότερα θα δυσκολευθήτε πολύ. Δεν με καταλαβαίνετε. Τότε θα με καταλάβετε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν βρεθή, Γέροντα, μόνος του κανείς σε δύσκολα χρόνια, τί θα κάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άρχισε τώρα να κάνης πρώτα υπακοή, να αποκτήσης διάκριση, και τότε θα δούμε. Γι᾿ αυτό είπαμε να κόψουμε τα κουσούρια πρώτα. Αν έχη κανείς κουσούρια, δεν θα τα βγάλη πέρα. Αν τώρα γκρινιάζη για όλα και νομίζη ότι αυτός είναι λεβεντόπαιδο και όλοι οι άλλοι είναι χάλια, τότε... Κοιτάξτε να διορθωθήτε, για να δικαιούσθε την θεία βοήθεια. Να στηριχθήτε ακόμη περισσότερο στον Θεό. Θα έχουμε πιο δύσκολα χρόνια. Ακόμη είναι άγουρα τά... φρούτα· δεν ωρίμασαν. Όταν εσείς θα είστε ώριμες πνευματικά, ξέρετε τί θα είστε; Οχυρό. Όχι μόνο για εδώ, αλλά θα μπορήτε να βοηθάτε και πιο πέρα. Γιατί, διαφορετικά, θα έχετε και εσείς ανάγκη από ανθρώπινη βοήθεια και προστασία. Και ξέρετε τί κακό είναι ένα μοναστήρι, με ένα σωρό αδελφές, να έχη ανάγκη από λαϊκούς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα ο μοναχός πρέπει να ζήση πνευματικά, για να είναι έτοιμος να ξεπεράση μια δυσκολία. Να ετοιμασθή, για να μην τον στενοχωρήση η στέρηση, γιατί μετά μπορεί να φθάση στην άρνηση. Θα έρθη εποχή που θα ξεραθούν τα ποτάμια, όλοι θα διψάσουν, όλοι θα υποφέρουν. Για μας τους μοναχούς δεν είναι τόσο φοβερό· εμείς και να διψάσουμε, πρέπει να διψάσουμε, γιατί εμείς ξεκινήσαμε για κακουχία. «Ό,τι δεν έκανα εκουσίως ως καλόγερος, θα πώ, το κάνω τώρα ακουσίως, για να καταλάβω τί θα πη καλόγερος. Σ᾿ ευχαριστώ, Θεέ μου». Αλλά ο καημένος ο κόσμος! Όταν φθάνουν οι άνθρωποι στο σημείο να εφευρίσκουν βόμβες που να σκοτώνωνται οι άνθρωποι και να μην καταστρέφωνται τα κτίρια, τί να πώ; Όταν είπε ο Χριστός «μιά ψυχή αξίζει όσο ο κόσμος όλος»[208], και αυτοί έχουν τα κτίρια πιο πολύ από όλο τον κόσμο, αυτό είναι φοβερό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, νιώθω αγωνία, φόβο, για ό,τι μας περιμένει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτός ο φόβος μας βοηθάει να γαντζωθούμε στον Χριστό. Όχι ότι πρέπει να χαίρεται κανείς γι᾿ αυτήν την κατάσταση που περιμένουμε, αλλά να χαίρεται, γιατί θα αγωνισθή για τον Χριστό. Δηλαδή δεν θα περάσουμε μια κατοχή ενός Χίτλερ ή ενός Μουσολίνι, αλλά θα δώσουμε εξετάσεις για τον Χριστό. Δεν είναι ότι θα έχουμε εμείς πολυβόλα, ατομικές βόμβες ανώτερες, και θα νικήσουμε. Τώρα ο αγώνας θα είναι πνευματικός. Θα παλέψουμε με τον ίδιο τον διάβολο. Ο διάβολος όμως δεν έχει καμμιά εξουσία, αν δεν του δώσουμε εμείς εξουσία. Τί να φοβηθούμε; Αν ήταν Χίτλερ ή Μουσολίνι, ήταν άλλο. Να μην υπάρχη φόβος. Να χαιρώμαστε που η μάχη είναι πνευματική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εάν ζήτε μοναχικά, πατερικά, και προσέχετε, θα δικαιούσθε την θεία επέμβαση σε κάθε επίθεση του εχθρού. Αν υπάρχουν άνθρωποι προσευχής, ταπεινοί, που έχουν πόνο και αγάπη, είναι κεφάλαια πνευματικά, είναι «βάσεις» πνευματικές. Δυό-τρείς ψυχές να υπάρχουν σε ένα μοναστήρι που να σκέφτωνται τον πόνο των άλλων και να προσεύχωνται, είναι πνευματικό οχυρό. Καθηλώνουν τα πάντα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσευχή, ορθή ζωή, παράδειγμα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά είναι η σωστή θέση που πρέπει να πάρη ο μοναχός στην σημερινή δύσκολη κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κατ᾿ αρχάς, προσευχή, ορθή ζωή, παράδειγμα, και όταν χρειασθή και όπου χρειασθή, να μιλήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, πρέπει ο μοναχός να μιλήση, όταν δοθή αφορμή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά, φυσικά! Αν δεν μιλήση ο μοναχός, ποιός θα μιλήση; Ο μοναχός δεν έχει τί να φοβηθή. Οι άλλοι φοβούνται, μήπως τους πετάξουν από τις θέσεις τους. Εμείς οι αφιερωμένοι στον Θεό, αν δεν τραβήξουμε μπροστά, ποιός θα τραβήξη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο λογισμός μου λέει πώς δεν θα αφήση ο Θεός· δεν θα αφήση! Θα ξεκαθαρίση αυτή η κατάσταση. Τώρα είναι σαν να υπάρχη ένα μεγάλο δίχτυ που έχει κλείσει μέσα τα ψάρια και είναι σάπιο. Πάει μια από εδώ-μιά από εκεί και θα σπάση στο τέλος. Και δεν θα σπάση, γιατί τα ψάρια είναι μεγάλα, αλλά γιατί έχει σαπίσει το δίχτυ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τα ψάρια είναι οι Χριστιανοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, οι Χριστιανοί, και οι άλλοι είναι τα χέλια, τα φίδια. Αλλά και εμείς θα δώσουμε λόγο στον Θεό γι' αυτήν την κατάσταση. Εγώ τώρα τα λέω έξω από τα δόντια· δεν κρατιέμαι άλλο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, τί πρέπει να κάνουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρώτα να κάνουμε δουλειά στον εαυτό μας. Γιατί ως μοναχός σκοπό έχω να διαλύσω το ανθρώπινο δικό μου πνεύμα, να φτιάξω πρώτα τον εαυτό μου, για να γίνω άνθρωπος πνευματικός, γιατί αλλιώς δεν έχει νόημα η ζωή μου ως μοναχού. Ύστερα να μιλήσουμε με τρόπο, όταν χρειάζεται, και ο Θεός θα βοηθήση να φέρουμε θετικά αποτελέσματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί όμως λένε καλύτερα σιωπή και προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν μπορείς να αδιαφορήσης, όταν όλα καίγωνται γύρω σου. Πρέπει να σβήσης την φωτιά. Ο πόνος δεν σ᾿ αφήνει να σιωπήσης. Βέβαια, το κυριώτερο είναι να προσπαθή κανείς να ζη πνευματικά, όσο μπορεί. Και αν χρειασθή να πάρη σε ένα σοβαρό ζήτημα κάποια θέση, θα πάρη την θέση που θα επιτρέψη ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να ζήτε ταπεινά, απλά, πνευματικά, ώστε σε μια δύσκολη στιγμή να μην αναγκασθήτε να κάνετε συμβιβασμούς. Ύστερα να κοιτάξετε να έρχωνται για μοναχές νέες που να έχουν προϋποθέσεις για τον Μοναχισμό, για να μπορούν να γίνουν σωστές μοναχές. Όταν γίνη κανείς καλός μοναχός, ξέρει μετά μέχρι που χρειάζεται να ασχοληθή με ένα θέμα· τί πρέπει να κάνη και τί δεν πρέπει, πώς να ενεργήση. Αν δεν γίνη σωστός μοναχός, όλα στραβά πάνε. Το καταλάβατε; Αν γίνετε σωστές μοναχές, θα ενεργήτε με σύνεση. Αν δεν γίνετε σωστές μοναχές, αν μια την στείλης κάπου, θα πρέπη να της πής «νά πής αυτό μέχρι εκεί, εκείνο μέχρι εκεί», γιατί αλλιώς μπορεί να πη ανοησίες. Αλλά αυτό είναι κατάσταση υπανάπτυκτη. Που να τα βγάλης πέρα μετά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό όσες έχουν προϋποθέσεις για τον Μοναχισμό, να δουλευτούν, για να γίνουν σωστές μοναχές και να ξέρουν μέχρι που πρέπει να πούν, τί πρέπει να πούν· να ξέρουν τί πρέπει να κάνουν σε μια δύσκολη στιγμή. Και θα κινούνται μέσα στην υπακοή, γιατί θα συμφωνή το δικό τους πνεύμα με το πνεύμα της Γερόντισσας. Σε μια ανάγκη, ένα νεύμα να τις κάνη η Γερόντισσα, θα καταλαβαίνουν, γιατί θα εργάζωνται στην ίδια συχνότητα. Αλλιώς δεν γίνεται χωριό. Αν δεν μάθετε να κινήσθε έτσι, μπορεί να μπή και κάποιος άλλος στην ίδια συχνότητα, να λέη άλλα πράγματα, να μην το καταλάβετε και να κάνη μεγάλο κακό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κινδυνεύει ο Μοναχισμός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο κόσμος σήμερα καίγεται και ο Μοναχισμός αποδυναμώνεται, ξεφτάει, χάνει την αξία του. Αν φύγη το πνευματικό από τον Μοναχισμό, δεν μένει τίποτε μετά. Στο Άγιον Όρος κάποιος προσκυνητής είπε σε έναν καλόγερο: «Καλά, εδώ δεν υπάρχει ασκητικό πνεύμα;». «Τώρα, του είπε εκείνος, είναι νέα εποχή· πάνε αυτά τα πράγματα»! Θα πη κανείς ότι βρέθηκε ένας παλαβός. Μπορεί να υπάρχουν ακόμη πέντε-δέκα παλαβοί· αλλά, αν λένε τέτοιες ανοησίες, να τους κλείσουν στον Πύργο! Δεν έχουν το δικαίωμα να λένε τέτοιες κουβέντες, που βρίζουν τον Μοναχισμό στην εποχή μας και να σκανδαλίζουν τον κόσμο. Αφορμή ζητάει ο άλλος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θα δήτε, σιγά-σιγά σε μερικά μοναστήρια θα καταργήσουν τις πατερικές αναγνώσεις, για να μην ελέγχωνται. Θα διαβάζουν βιβλία κοινωνικά, γιατί δήθεν αυτά στην εποχή μας βοηθούν. Εκεί πάμε! Και έρχονται οι καημένοι οι λαϊκοί στα μοναστήρια, για να βοηθηθούν... Όπως ο ευλαβής στον κόσμο περιφρονείται, έτσι και ο καλός μοναχός σε λίγο θα περιφρονήται. Γιατί, αλλοίμονο, αν δεν προσέξουμε το κοσμικό πνεύμα, σε λίγο καιρό, αν κάποιος νέος πηγαίνη στο μοναστήρι και θέλη να ζήση σωστά μοναχικά, θα του λένε οι άλλοι: «Τί δουλειά έχεις εσύ εδώ;». Οι άνθρωποι, όταν βλέπουν μοναχούς να μη διαφέρουν από τους κοσμικούς, απογοητεύονται από τον Μοναχισμό. Πολλοί έρχονται και μου λένε πόσο σκανδαλίζονται από μερικά μοναστήρια, και πώς να διορθώνω λογισμούς τώρα;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μπήκε στον Μοναχισμό πολύ το κοσμικό πνεύμα και δεν σταματάει το κακό. Οι μοναχοί πρέπει να σταθούν ως μοναχοί, όχι ως κοσμικοί. Έχουμε χάσει την απλότητα που είχαν οι παλιές γενιές. Τώρα οι νέοι μοναχοί κινούνται με μια λογική ανθρώπινη και με μια κοσμική ευγένεια· κοιτούν πώς να μη χάσουν την υπόληψή τους κ.λπ. Πριν από λίγα χρόνια έβλεπες στα Κοινόβια μια κατάσταση Λαυσαϊκού[209]. Άλλοι πήγαιναν στα μοναστήρια από θείο ζήλο, άλλοι από μετάνοια. Και ήταν διάφορες περιπτώσεις. Άλλου πέθαινε η γυναίκα και εκείνος πήγαινε στο μοναστήρι. Άλλος χρόνια ζούσε μια κοσμική ζωή και ύστερα μετανοούσε και πήγαινε στο μοναστήρι. Έβρισκες και δαιμονισμένους στα μοναστήρια, που κατέφευγαν εκεί και θεραπεύονταν με τις προσευχές των Πατέρων και έμεναν ύστερα και γίνονταν μοναχοί. Αν έπειτα έκαναν καμμιά αταξία, δαιμονίζονταν πάλι, και έτσι υπήρχαν και δαιμονισμένοι στα μοναστήρια. Έβρισκες και πλανεμένους και δια Χριστόν σαλούς και μοναχούς με διορατικό χάρισμα και με ιαματικά χαρίσματα. Μεγάλη ποικιλία! Σήμερα ούτε με διορατικό χάρισμα βρίσκεις ούτε με ιαματικά χαρίσματα ούτε δαιμονισμένους ούτε δια Χριστόν σαλούς. Εμείς έχουμε την άλλη σαλάδα, την σαλάδα του κόσμου. Γίναμε εγκέφαλοι, γι᾿ αυτό και παλαβώσαμε. Μπήκε πολλή κοσμική λογική και αυτή η πολλή λογική κατέστρεψε τα πάντα. Και το κακό είναι που δεν το καταλαβαίνουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σε μερικά μοναστήρια σήμερα έχουν γεμίσει ευκολίες-ευκολίες και κάνουν την ζωή τους δύσκολη. Πράγματα που δεν χρειάζεται να ψειρίσουν, τα ψειρίζουν. Εκείνο που είναι πνευματικό και με το οποίο πρέπει να ασχοληθούν, το αφήνουν. Αν οι νέοι που έρχονται στα μοναστήρια μπαίνουν από το κοσμικό άγχος σε ένα υπηρεσιακό πνεύμα, δεν θα αναπαυθούν. Μετά θα θέλουν να κάνουν τουρισμό πνευματικό, εκδρομές, για να ξεσκάσουν. «Θέλω την άδειά μου», θα σού λέη ο άλλος – ενώ ο μοναχός πρέπει να ξεκολλάη με πόνο από το κελλί του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είμαι αγανακτισμένος από πολλές μεριές, γι᾿ αυτό ξεσπάω. Πονάω, γιατί παλιά οι μοναχοί ούτε πνευματικά βιβλία είχαν και οι καημένοι είχαν άγνοια από Μοναχισμό, και όμως έκαναν προκοπή. Το 30% ήταν γεννημένοι για μοναχοί· οι άλλοι που πήγαιναν στα μοναστήρια δεν ήταν καλλιεργημένοι· ήταν από πεντακόσιες καρυδιές καρύδια, και όμως έκαναν προκοπή. Πήγαινε στο μοναστήρι ο άλλος και δεν ήξερε τίποτε από πνευματικά. Μπορεί να καθόταν έναν-δυό μήνες, και ούτε ο ηγούμενος ήξερε ποιός είναι. Μετά, όταν έλεγε ότι θέλει να γίνη μοναχός, πήγαινε στον Πνευματικό, εξομολογείτο, και έμενε στο μοναστήρι. Και δεν ήξερε κανείς τί άνθρωπος ήταν, ποιά πατρίδα είχε κ.λπ. Και αυτός, παρ᾿ όλα τα προβλήματα που είχε, προχωρούσε και προόδευε. Και μερικοί ούτε γράμματα ήξεραν. Άκουγαν την ανάγνωση στην Τράπεζα, το Συναξάρι στην Εκκλησία και τίποτε άλλο. Και στην Τράπεζα καμμιά φορά δεν καταλάβαιναν ούτε την ανάγνωση. Ούτε και από τα ψαλτικά καταλάβαιναν· έλεγαν καμμιά ευχή στην Ακολουθία, αλλά είχαν καλούς λογισμούς. Και όμως εκείνοι έφθαναν σε μέτρα, σε πνευματική κατάσταση, ενώ τώρα με Κατηχητικά, με πνευματικά βιβλία, με τόσες προϋποθέσεις να χαραμίζεται τέτοιο υλικό!... Δηλαδή οι ακαλλιέργητοι να έχουν τέτοια πνευματική καλλιέργεια και οι καλλιεργημένοι να μην έχουν τίποτε! Να είναι ένα καλλιεργημένο χωράφι, κατά κάποιον τρόπο, και να μη βγάζη ούτε τον σπόρο που του σπέρνουν! Δεν είναι βαρύ αυτό; Πώς το βλέπετε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως, αν δεν προσέξουμε, δεν θα σταθή ο Μοναχισμός· θα τιναχθή στον αέρα. Βέβαια το μέλλον ανήκει στον Χριστό και στα χέρια της Καλής Νοικοκυράς, της Παναγίας, η οποία θα πάρη την σκούπα και θα σαρώση και θα νοικοκυρέψη πάλι τα μοναστήρια της. Πρέπει να καταλάβουμε ότι όλα θα χαθούν και θα παρουσιασθούμε μπροστά στον Θεό χρεωμένοι, αν δεν ζήσουμε σωστά μοναχικά. Ξεκινήσαμε να γίνουμε καλόγεροι, για την σωτηρία της ψυχής μας και για να βοηθήσουμε την κοινωνία με την προσευχή. Γι' αυτό μην ξεχνάτε τί υποσχεθήκατε στον Χριστό, όπως μην ξεχνάτε και τί τραβούν οι άνθρωποι στον κόσμο, οι οποίοι δεν είχαν αυτήν την εύνοια να κληθούν στο Αγγελικό Τάγμα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αφήσουμε κληρονομιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλοί στηρίζουν τις ελπίδες τους στα μοναστήρια. Νιώθω βαρειά αυτήν την ευθύνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, το μόνο που μένει τώρα – όπως λένε πολλοί –  είναι να βγουν μερικοί Άγιοι σαν τον Άγιο Κοσμά τον Αιτωλό, να σκορπίσουν σε διάφορα μέρη και να κηρύξουν, να διαφωτίσουν τον κόσμο. Τα μοναστήρια είναι τα πνευματικά κέντρα. Αν δεν ήταν τα μοναστήρια να βοηθήσουν τότε με την Επανάσταση του ᾿21, πώς μπορούσε να γίνη η Επανάσταση; Και στην Κατοχή πάλι τα μοναστήρια κράτησαν. Γι᾿ αυτό και οι συμμορίτες τα κατέστρεψαν. Τα περισσότερα μοναστήρια δεν τα έκαψαν οι Γερμανοί· οι συμμορίτες τα κατέστρεψαν. Έλεγαν οι Γερμανοί: «Αν βρούμε πυρομαχικά σε μοναστήρι, θα το κάψουμε». Οι συμμορίτες, για να φανούν αυτοί καλοί και να δώσουν την εντύπωση ότι οι Γερμανοί τα έκαψαν, πήγαιναν και άφηναν στα μοναστήρια μερικές παλιές δεσμίδες, κανένα σπασμένο ντουφέκι. Ειδοποιούσαν εν τω μεταξύ κάτω οι ίδιοι ότι επάνω στο μοναστήρι μένουν συμμορίτες, και πήγαιναν οι Γερμανοί στο μοναστήρι. Έβρισκαν πράγματι πολεμοφόδια και έβαζαν φωτιά στο μοναστήρι. Και τελικά οι συμμορίτες πολλά μοναστήρια έτσι τα έκαψαν, γιατί φοβούνταν τα μοναστήρια. «Και άθεο να είναι το καθεστώς, έλεγαν, αν υπάρχουν τα μοναστήρια, πάλι δεν θα κάνουμε τίποτε, οπότε ας τα κάψουμε». Και τα έκαιγαν με αυτόν τον τρόπο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα μαγιά από τα μοναστήρια θα πάνε να πάρουν. Αλλά, αν και τα μοναστήρια είναι τραλαλά, τί θα πάρουν; Δεν θα βρουν προζύμι. Να κοιτάξουμε να κρατηθή λίγη μαγιά για τα δύσκολα χρόνια. Τώρα έρχονται στα μοναστήρια για βοήθεια αυτοί που πάνε στους μάγους κ.λπ. Αργότερα θα έχουμε ανθρώπους κουρασμένους από την αμαρτία. Και να τους στέλνης να πιούν ή να αμαρτήσουν, δεν θα πηγαίνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός σ᾿ αυτά τα δύσκολα χρόνια καλεί στον Μοναχισμό ανθρώπους με ατομικές προσκλήσεις. Αυτή η γενιά ξεκινάει για τον Μοναχισμό με τις καλύτερες προϋποθέσεις, ξεκινάει με ιδανικά, και ο διάβολος όλο αυτό το υλικό το αχρηστεύει. Η άλλη γενιά δεν θα είναι έτσι. Θα έρχωνται στα μοναστήρια και πολλοί που δεν θα είναι κατάλληλοι για τον Μοναχισμό. Θα είναι σε τέτοια κατάσταση, που θα αναγκάζωνται να γίνουν μοναχοί. Θα είναι κουρασμένοι και πληγωμένοι από τον κόσμο. Ανδρόγυνα θα χωρίζουν, είτε με την ευλογία είτε χωρίς την ευλογία της Εκκλησίας, και θα πηγαίνουν στα μοναστήρια. Νέοι που βαρέθηκαν την κοσμική ζωή θα πηγαίνουν στα μοναστήρια, άλλοι για να σώσουν την ψυχή τους και άλλοι για να βρουν λίγη ηρεμία. Άλλοι που θέλουν να παντρευτούν, αλλά θα φοβούνται με τί άνθρωπο θα μπλέξουν, θα γίνωνται μοναχοί. Δηλαδή στα επόμενα χρόνια μπορεί να έρχωνται και ψυχοπαθείς ή άλλοι που θα διστάζουν να δημιουργήσουν οικογένεια. «Τί θα βρώ; τί θα κάνω; θα σκέφτωνται. Καλύτερα να πάω να γίνω μοναχός». Θα τον παίρνουν δηλαδή μερικοί σαν χουζούρι τον Μοναχισμό – τί προκοπή θα κάνουν, άλλο θέμα. Δεν θα έρχωνται μετανοιωμένοι άνθρωποι. Θα είναι οι άνθρωποι σε τέτοια κατάσταση, που θα αναγκάζωνται να γίνουν μοναχοί. Δεν θα είναι αγνά τα ελατήριά τους. Αυτός είναι ο κίνδυνος. Όταν ένας ξεκινάη για τον Μοναχισμό, είναι διαφορετικά. Αυτοί θα έχουν ανάγκη από πολλή βοήθεια, γιατί ο διάβολος, επειδή θα έχουν γευθή τις χαρές του κόσμου, θα τους πολεμήση σκληρά· ενώ εμάς δεν μας πολεμάει τόσο. Εμάς κοιτάζει να μας εμποδίση από την πνευματική εργασία και να μας ρίξη στην ακηδία, ώστε να μη βρουν πνευματική ζύμη οι επόμενοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θέλω να πω με όλα αυτά ότι εμείς πρέπει να κάνουμε τώρα προκοπή, για να μπορέσουμε να βοηθήσουμε αυτούς τους ανθρώπους. Να τους αφήσουμε κληρονομιά πατερική. Πνευματικές χαρές έχουμε· ουράνιες δεν έχουμε. Κάνουμε μια χειροθεσία, μια αγρυπνία, ψάλλουμε και το «Δούλοι Κύριον...», κουνάμε και τον πολυέλαιο και χαιρόμαστε. Αλλά αυτές δεν είναι ουράνιες χαρές· είναι χαρές σαρκικές της καρδιάς, με την καλή έννοια. Η ουράνια χαρά είναι κάτι το ανώτερο, που δεν εκφράζεται. Όταν αρχίση κανείς να γεύεται λιγάκι τα ουράνια, σκιρτάει η καρδιά, παλαβώνει. Πρέπει να ζήσουμε ουράνιες χαρές, για να τις μεταδώσουμε στις επόμενες γενιές.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Το βαθύτερο νόημα της ζωής
- type: h2
  initial:
    ru: ''
  text:
    ru: Να ετοιμασθούμε για την άλλη ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ένας νέος εξαφανίσθηκε, αφού άφησε σημείωμα στους γονείς του ότι θα αυτοκτονήση, γιατί δεν είναι όμορφος και ότι γι᾿ αυτό φταίνε εκείνοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν έχουν συλλάβει το βαθύτερο νόημα της ζωής οι άνθρωποι. Δεν πιστεύουν στην άλλη ζωή. Όλο το βάσανο από εκεί ξεκινάει. «Είμαι αδικημένος, σού λέει· οι άλλοι χαίρονται, εγώ δεν χαίρομαι». Δεν είναι ευχαριστημένοι με ό,τι έχουν, μπαίνει και ο εγωισμός, και βασανίζονται. Ο Θεός όλο τον κόσμο τον αγαπάει. Στον κάθε άνθρωπο έδωσε αυτά που τον ωφελούν, είτε το μπόι είτε την λεβεντιά είτε την ομορφιά κ.λπ., ό,τι θα τον βοηθήση, αν το αξιοποιήση, να σωθή. Αλλά ο κόσμος βασανίζεται. «Γιατί εγώ να είμαι έτσι, ενώ εκείνος έτσι;». Μά εσύ έχεις αυτά, εκείνος έχει άλλα. Ένας δια Χριστόν σαλός Ρουμάνος που ασκητεύει στο Άγιον Όρος είπε σε κάποιον που είχε τέτοιους λογισμούς: «Ένας βάτραχος είδε το βουβάλι και είπε: «Θέλω να γίνω και εγώ βουβάλι». Φούσκωσε, φούσκωσε ο βάτραχος, και τελικά έσκασε. Ο Θεός αυτόν τον έκανε βάτραχο, εκείνο βουβάλι. Πήγε ο βάτραχος να γίνη βουβάλι και έσκασε!». Ο καθένας να χαίρεται, όπως ο Δημιουργός τον έφτιαξε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος βοηθηθή να πιστέψη στον Θεό και στην μέλλουσα ζωή, την αιώνια, – συλλάβη δηλαδή το βαθύτερο νόημα της ζωής – και μετανοήση, αλλάξη ζωή, έρχεται αμέσως η θεία παρηγοριά με την Χάρη του Θεού, η οποία τον αλλοιώνει, διώχνοντας και όλα τα κληρονομικά του ελαττώματα. Πολλοί άνθρωποι που μετανόησαν, αγωνίσθηκαν με φιλότιμο ταπεινά, χαριτώθηκαν, έγιναν και Άγιοι, και τους προσκυνάμε τώρα με ευλάβεια και ζητάμε και τις πρεσβείες τους, ενώ προηγουμένως είχαν πολλά πάθη και κληρονομικά. Ο Όσιος Μωυσής ο Αιθίοψ λ.χ., ενώ ήταν ο πιο αιμοβόρος ληστής, με κληρονομική κακία, μόλις πίστεψε στον Θεό, μετανόησε, ασκήθηκε, έφυγαν όλα τα πάθη, τον επισκέφθηκε η Χάρις του Θεού, και αξιώθηκε να λάβη και το προφητικό χάρισμα. Πέρασε στην ευαισθησία ακόμη και τον Μέγα Αρσένιο[210], ο οποίος ήταν από την μεγαλύτερη αρχοντική οικογένεια της Ρώμης, με κληρονομικές αρετές και με μεγάλη επιστημονική μόρφωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δηλαδή ποιό είναι ακριβώς το νόημα αυτής της ζωής;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ποιό είναι; Να ετοιμασθούμε για την Πατρίδα μας, τον Ουρανό, τον Παράδεισο. Το πάν είναι να συλλάβη ο άνθρωπος αυτό το βαθύτερο νόημα της ζωής, που είναι η σωτηρία της ψυχής. Όταν ο άνθρωπος πιστεύη στον Θεό και στην μέλλουσα ζωή, τότε καταλαβαίνει ότι αυτή η ζωή είναι μάταιη και ετοιμάζει το διαβατήριό του για την άλλη ζωή. Ξεχνούμε ότι όλοι θα φύγουμε. Δεν θα βγάλουμε ρίζες εδώ. Αυτή η ζωή δεν είναι για να καλοπεράσουμε. Είναι να δίνουμε εξετάσεις, για να περάσουμε στην άλλη ζωή. Γι'' αυτό ο σκοπός μας πρέπει να είναι να ετοιμασθούμε, ώστε να φύγουμε με αναπαυμένη συνείδηση, όταν μας καλέση ο Θεός, και να πετάξουμε κοντά Του. Όταν ο Χριστός ευλόγησε τους πέντε άρτους και χόρτασε τόσες χιλιάδες ανθρώπους, ο κόσμος ένα κι ένα είπε: «Είναι ό,τι πρέπει για βασιλιάς!». Έφαγαν τους πέντε άρτους και τα δυο ψάρια και ενθουσιάσθηκαν. Ο Χριστός όμως τους είπε να μην ενδιαφέρωνται γι᾿ αυτήν την τροφή, γιατί δεν θα μείνουμε εδώ[211]. Σ᾿ αυτήν την ζωή δοκιμάζεται ο καθένας, αν ανταποκρίνεται σε όσα ζητάει ο Θεός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί πρέπει να έχη κανείς πάντα στον νού του, για να κάνη το θέλημα του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να έχη τον νού του στον Θεό. Να σκέφτεται γιατί ήρθαμε σ᾿ αυτήν την ζωή. Εδώ δεν ήρθαμε για να κάνουμε τα πάντα και να βολευτούμε. Ήρθαμε για να ετοιμασθούμε για την άλλη ζωή. Ο νούς μας λοιπόν πρέπει να είναι διαρκώς εκεί και σε ό,τι θα μας βοηθήση να πάμε εκεί. Με την φιλότιμη αντιμετώπιση, με τον ταπεινό και φιλότιμο αγώνα καταλαβαίνει κανείς το νόημα της πνευματικής ζωής. Η πνευματική ζωή είναι λεβεντιά, γλέντι πνευματικό. Ξέρετε τί θα πη γλέντι! Να πιάσετε το βαθύτερο νόημα του Μοναχισμού, την πνευματική αρχοντιά, την ευαισθησία την πατερική. Το βαθύτερο νόημα της ζωής – όχι του Μοναχισμού αλλά της ζωής – έχουν υποχρέωση όλοι οι άνθρωποι να το συλλάβουν. Αν το έκαναν αυτό, δεν θα είχαν καθόλου μικροπρέπειες, γκρίνιες κ.λπ. Αφού υπάρχει θεία ανταπόδοση, να κοιτάξουμε πώς θα βγάλουμε κανένα φράγκο για ᾿κεί, και όχι πώς θα έχουμε εδώ την αξιοπρέπειά μας και πώς θα απολαμβάνουμε ανθρώπινες τιμές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος τοποθετή τον εαυτό του στην πραγματική ζωή, όλα τα χαίρεται. Χαίρεται που ζή, χαίρεται που θα πεθάνη. Όχι γιατί βαρέθηκε την ζωή του, αλλά χαίρεται που θα πεθάνη και θα πάη κοντά στον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χαίρεται, Γέροντα, γιατί δεν αντιδρά σ᾿ αυτό που ο Θεός επιτρέπει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χαίρεται, γιατί βλέπει ότι αυτή η ζωή είναι πρόσκαιρη, ενώ η άλλη αιώνια. Δεν βαρέθηκε την ζωή, αλλά σκέφτεται «τί θα κάνουμε, δεν θα φύγουμε;» και ετοιμάζεται για ᾿κεί, γιατί καταλαβαίνει ότι αυτός είναι ο προορισμός του, το νόημα της ζωής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Νά, οι κοινωνικοί λειτουργοί έχουν καλωσύνη, οι καημένες, τρέχουν, σκοτώνονται για τους άλλους. Σπουδάζουν ψυχολογία, αλλά με τον τρόπο που πηγαίνουν να βοηθήσουν, σε κάποιες περιπτώσεις σταματούν. Πάει λ.χ. μία να παρηγορήση έναν που έχει ένα πόδι και αυτός της λέει: «Εσύ μου λές «καλημέρα» με δυο πόδια, αλλά εγώ με ένα». Τί να του απαντήση; Πώς να τον βοηθήση με την ψυχολογία; Αν δεν βοηθηθή αυτός ο άνθρωπος να συλλάβη το βαθύτερο νόημα της ζωής, δεν μπορεί να βοηθηθή με τίποτε. Να καταλάβη ότι γι'' αυτήν την αναπηρία που επέτρεψε ο Θεός, αν δεν γογγύζη, θα έχη να λάβη στην άλλη ζωή αποταμιευμένο ουράνιο μισθό και να χαίρεται. Και αν ακόμη οι άλλοι περπατούσαν με τέσσερα πόδια, να έλεγε: «Σε ευχαριστώ, Θεέ μου, που περπατώ με ένα πόδι». Αλλά όσες δεν έχουν την πνευματική αντιμετώπιση, πάνε να παρηγορήσουν τους αρρώστους και δεν ξέρουν τί να τους πούν. Πάει η κοινωνική λειτουργός να παρηγορήση λ.χ. μια γυναίκα τριάντα πέντε χρονών με καρκίνο, που έχει και τρία παιδάκια. Τί να της πή; Αν δεν βοηθηθή αυτή η μητέρα να συλλάβη το βαθύτερο νόημα της ζωής, απελπίζεται, γιατί σκέφτεται τί θα γίνουν τα παιδιά. Την ίδια απελπισία που έχει η μητέρα έχει και η κοινωνική λειτουργός, αν δεν έχη καταλάβει κάτι το ανώτερο, το βαθύτερα πνευματικό. Αν δεν υπάρχη κατ'' αρχάς βαθύτερη τοποθέτηση στον ίδιο τον εαυτό της, δεν μπορεί να βοηθήση σωστά, για να έρθη η θεία παρηγοριά στον άλλον. Έτσι οι καημένες κουράζονται και σωματικά, αλλά και στενοχωρούνται, γιατί δεν μπορούν να βοηθήσουν θετικά. Κουράζονται δηλαδή διπλά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να αισθανθούμε το καλό ως ανάγκη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει ο άνθρωπος να αισθανθή το καλό ως ανάγκη, γιατί διαφορετικά θα είναι βασανισμένος. Και δεν είναι να πη κανείς ότι μερικοί δεν μπορούν να καταλάβουν το καλό ως ανάγκη. Εγώ δεν μπορώ να το δικαιολογήσω αυτό. Ακόμη και ένα μικρό παιδάκι πέντε χρονών μπορεί να αισθανθή το καλό ως ανάγκη. Ας πούμε ότι ένα παιδάκι έχει πυρετό. Φέρνουν οι γονείς τον γιατρό και εκείνος τους λέει «κρατήστε το παιδί γερά» και τάκ–τάκ του κάνει την ένεση. Μετά το παιδί, μόλις ξαναδή τον γιατρό, βάζει τα κλάματα και φεύγει. Αν όμως εξ αρχής του πούν «κοίταξε, είσαι άρρωστο, έχεις πυρετό και δεν θα μπορής ούτε στο σχολείο να πάς ούτε να παίξης, ενώ τα άλλα παιδιά παίζουν, αν όμως αφήσης τον γιατρό λίγο να σε τσιμπήση, θα πέση ο πυρετός και μετά θα μπορής κι εσύ να πάς να παίξης», το παιδάκι αμέσως θα κλείση τα ματάκια του και θα τεντώση μόνο του το χεράκι. Θέλω να πω ότι, αν το παιδάκι μπορή να αισθανθή το καλό ως ανάγκη, πόσο μάλλον ο μεγάλος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Από την στιγμή που ο άνθρωπος καταλάβη το σωστό, τελείωσε. Να πούμε ότι σάς λέω: «Θα σάς πετάξω κάτω από το παράθυρο». Καταλαβαίνετε τί θα πη αυτό. Και ένας λειψός στο μυαλό καταλαβαίνει ότι, αν πέση ψηλά από το παράθυρο, θα σπάση τα πόδια του. Καταλαβαίνει ποιός είναι ο γκρεμός και ποιό το ίσωμα· ποιό είναι το καλό και ποιό το άσχημο. Ένας μεγάλος που έχει διαβάσει Πατερικά, Ευαγγέλιο, ξέρει ποιό είναι το σωστό. Από ᾿κεί και πέρα θέλει το κουμπί γύρισμα. Αλλά πολλές φορές λές σε μερικές ψυχές «γιατί το κάνεις αυτό; δεν καταλαβαίνεις ότι δεν είναι σωστό;», και αρχίζουν: «Νά, δυστυχώς εγώ έτσι είμαι, γιατί να είμαι έτσι, έτσι ήμουν και πρώτα». «Άσε τί ήσουν πρώτα. Τώρα που σού το λέω, τί κάνεις, για να διορθωθής;». Άλλο αν δεν τις κόβη. Αλλά μόνον το μωρό παιδάκι θα πιάση το κάρβουνο αντί για καραμέλλα, γιατί δεν του κόβει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς η μητέρα σας που ήταν τόσο ευαίσθητη και σάς αγαπούσε, σάς έδωσε από τα πρώτα παιδικά χρόνια αυστηρή αγωγή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Από μικρός μπορεί ο άνθρωπος να βοηθηθή, για να συλλάβη το βαθύτερο νόημα της ζωής και να χαίρεται σωστά. Όταν ήμουν μικρός, τα περνούσα τα παιδιά στο τρέξιμο. Εκείνα δεν με άφηναν να τρέξω, με έδιωχναν. «Προσφυγόπουλο» με έλεγαν. Πήγαινα μετά στην μάνα μου με κλάματα. «Τί έχεις και κλαίς;», μου έλεγε εκείνη. «Δεν μ'' αφήνουν τα παιδιά να τρέξω», της έλεγα. «Θέλεις να τρέξης; Να αυλή, τρέξε. Γιατί θέλεις να τρέχης εκεί, για να σε βλέπουν οι άλλοι και να σού λένε μπράβο; Αυτό έχει υπερηφάνεια». Άλλη φορά ήθελα να παίξω με το τόπι και δεν με άφηναν τα παιδιά. Πήγαινα πάλι στην μάνα μου κλαίγοντας. «Τί έγινε, γιατί κλαίς πάλι;», με ρωτούσε. «Δεν μ'' αφήνουν τα παιδιά να παίξω με το τόπι!», της έλεγα. «Αυλή μεγάλη έχουμε, τόπι έχεις, παίξε εδώ. Τί θέλεις να σε βλέπουν οι άλλοι, για να σε καμαρώνουν; Αυτό έχει υπερηφάνεια». Τότε σκέφθηκα: «Δίκαιο έχει η μητέρα». Έτσι σιγά-σιγά δεν ήθελα ούτε να τρέχω ούτε να παίζω το τόπι μπροστά στον κόσμο, γιατί κατάλαβα ότι αυτό είχε μέσα υπερηφάνεια και έλεγα: «Πράγματι, τί χαμένα πράγματα! Δίκαιο έχει». Ύστερα τόσο πολύ δεν με πείραζε, πού, όταν έβλεπα τα άλλα παιδιά να τρέχουν, να χτυπούν το τόπι και να καμαρώνουν, γελούσα και έλεγα «τί κάνουν;», και ήμουν μικρό παιδί· τρίτη Δημοτικού πήγαινα. Μετά ζούσα μια φυσιολογική ζωή. Έτσι τώρα, αν μου πούν «τί προτιμάς, να ανεβής Αύγουστο μήνα ξυπόλυτος στον Άθωνα μέσα στα πουρναρόφυλλα ή να πάς σε μια τελετή που θα σού φορέσουν μανδύα κ.λπ.;», θα πω ότι προτιμώ να πάω ξυπόλυτος στον Άθωνα. Όχι από ταπείνωση, αλλά γιατί αυτό με αναπαύει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι άνθρωποι που έχουν υπερηφάνεια δεν βοηθήθηκαν μικροί από το σπίτι. Το κοσμικό φρόνημα  βασανίζει τον άνθρωπο. Και αν δεν προσεχθή αυτό και οι γονείς δεν βοηθήσουν τα παιδιά, όταν είναι μικρά, γίνεται μετά κατάσταση αυτό. Άλλο είναι ένα παιδί να το επαινέσης λίγο, για να μην απογοητευθή, και άλλο να του φουσκώνης τον εγωισμό. Π.χ. είπε ένα ποίημα και δεν το είπε καλά και απογοητεύεται. Τότε θα του πη η μάνα: «Έ, καλά το είπες». Αν το πη όμως καλά το ποίημα και αρχίση η μάνα μπροστά στους άλλους «μπράβο, εσύ το είπες από όλα τα παιδιά καλύτερα! το δικό μου παιδί είναι το καλύτερο!», εκείνο είναι κακό. Και έτσι οι γονείς καλλιεργούν πολλές φορές στα παιδιά την υπερηφάνεια. Ή κάνει λ.χ. το παιδί μια αταξία στο σχολείο και ο δάσκαλος το μαλώνει. Πάει μετά το παιδί στο σπίτι και λέει στους γονείς του: «Ο δάσκαλος με μάλωσε άδικα». Όταν ο πατέρας ή η μάνα υποστηρίζη το παιδί και λέη μάλιστα μπροστά του «θά του δείξω εγώ, το παιδί το δικό μου είναι...», μετά εκείνο θεωρεί καλό αυτό που έκανε, και τελικά βασανίζεται από χαμένα πράγματα. Όλη η βάση είναι να καταλάβη το παιδί μερικά πράγματα από το σπίτι του. Αν ο άνθρωπος από μικρός συλλάβη το βαθύτερο νόημα της ζωής, ύστερα πάνε όλα κανονικά. Αλλιώς ευχαριστιέται με τα γήινα, με τους επαίνους των ανθρώπων – που στην πραγματικότητα δεν αναπαύουν – και παραμένει γήινος άνθρωπος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να βοηθούμε τον κόσμο στην μετάνοια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί μπορεί να βοηθήση σήμερα περισσότερο τον κόσμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σήμερα, αν διδασκόταν η μετάνοια στον κόσμο, μόνον αυτή θα μπορούσε να βοηθήση. Να διαβάζουμε, όσο μπορούμε, βίους Αγίων που τονίζουν την μετάνοια, για να βοηθηθούμε. Το να ζητούμε μετάνοια από τον Θεό σημαίνει ότι ζητούμε φωτισμό. Όταν ζητούμε μετάνοια και μετανοήσουμε περισσότερο, φυσικά θα ταπεινωθούμε περισσότερο και υποχρεωτικά τότε θα έρθη περισσότερο η θεία Χάρις, ο θείος φωτισμός. Όταν βρίσκεται ο άνθρωπος εν μετανοία, διατηρεί την Χάρη του Θεού. Πάντως ο κόσμος είναι καλός. Βλέπεις, οι περισσότεροι ούτε εξομολογούνται ούτε εκκλησιάζονται, έχουν άγνοια μεγάλη, και από το άλλο μέρος έρχονται και μου ζητούν βοήθεια. Αυτό κάτι έχει μέσα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως οι δοκιμασίες, Γέροντα, γίνονται αφορμή να πλησιάσουν οι άνθρωποι στον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όσοι έχουν καλή διάθεση βοηθιούνται από τις δοκιμασίες· όσοι δεν έχουν, τα βάζουν με τον Θεό, βρίζουν κ.λπ. Το κακό είναι ότι δεν λένε «ήμαρτον», αλλά βασανίζονται. Μεγάλη εξουσία έχει ο διάβολος στον κόσμο. Του δώσαμε πολλά δικαιώματα. Πώς έγινε ο σημερινός άνθρωπος! Το κακό είναι ότι εμποδίζει την θεία επέμβαση, γιατί δεν έχει μετάνοια. Αν υπήρχε μετάνοια, τα πράγματα θα είχαν τακτοποιηθή. Μπόρες, μπόρες θα περνούμε! Ο Θεός να βάλη το χέρι Του! Να ζητούμε μετάνοια για όλον τον κόσμο και για όσους εν ψυχρώ κάνουν κακό στην Εκκλησία και δεν έχουν σκοπό να διορθωθούν, να τους δίνη ο Θεός μετάνοια και έπειτα να τους παίρνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να βοηθούμε, όσο μπορούμε, τον κόσμο στην μετάνοια, για να δεχθούμε τις ευλογίες του Θεού. Μετάνοια και εξομολόγηση, αυτό χρειάζεται σήμερα. Εγώ συνέχεια συνιστώ μετάνοια και εξομολόγηση, για να χάση τα δικαιώματα ο διάβολος, να κοπούν οι εξωτερικές δαιμονικές επιδράσεις. Θέλουν τράνταγμα οι άνθρωποι, να καταλάβουν, να μετανοήσουν. Π.χ. κάποιος εξομολογείται ότι έκανε μοιχεία. Του δίνει ο Πνευματικός άφεση, του δίνει και έναν κανόνα και δεν προχωράει περισσότερο. Πρέπει ο Πνευματικός να τον βοηθήση να καταλάβη ότι το κακό δεν ήταν μόνον η μοιχεία· ότι με αυτό που έκανε, έκανε εγκλήματα, διέλυσε δύο οικογένειες. Αλλά μερικοί Πνευματικοί ούτε καν ερευνούν παραπέρα ούτε προβληματίζουν τους ανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχουν άνθρωποι που είναι καλοί, όμως δεν εκκλησιάζονται συχνά, δεν έχουν τακτική μυστηριακή ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί καμμιά φορά κάποιος να μην εκκλησιάζεται συχνά, αλλά να υπάρχη μέσα του ευλάβεια, καλωσύνη, και έτσι βρίσκει τόπο και κατοικεί ο Θεός. Αυτοί οι άνθρωποι, αν είχαν και μυστηριακή ζωή, θα προχωρούσαν πολύ στην πνευματική ζωή. Και βλέπεις, υπάρχουν άλλοι που εκκλησιάζονται, εξομολογούνται, κοινωνούν, τα κάνουν όλα, και όμως ο Θεός δεν βρίσκει τόπο να κατοικήση μέσα τους, γιατί δεν υπάρχει ταπείνωση, καλωσύνη, μετάνοια πραγματική. Δεν αρκεί μόνον η εξομολόγηση στον Πνευματικό, για να τακτοποιηθή κανείς· χρειάζεται και μετάνοια. Και κάθε προσευχή που κάνει κανείς πρέπει να αρχίζη με εξομολόγηση στον Θεό. Όχι όμως να κλαίη και να λέη «είμαι τέτοιος, τέτοιος, τέτοιος», και μετά να κάνη πάλι τα ίδια. Αυτό δεν είναι συναίσθηση. Όταν υπάρχη συναίσθηση, υπάρχει και λίγη βελτίωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είδατε οι Ισραηλίτες με τί απλότητα προσευχήθηκαν; «Εξεγέρθητι, ινατί υπνοίς, Κύριε;»[212], είπαν. Δηλαδή, «ξύπνα, Κύριε, γιατί κοιμάσαι;». Και ύστερα ο Κύριος «εξηγέρθη ως δυνατός, κεκραιπαληκώς εξ οίνου και επάταξε...»[213]. Με τί απλότητα και τί ταπείνωση, αλλά και με τί παρρησία είπαν: «Τί θα πούμε τώρα, Κύριε, στα έθνη;Μας έσωσες από την Ερυθρά Θάλασσα και τώρα να πεθάνουμε στην έρημο ή να μας σφάξουν οι αλλόφυλοι; Να μη γίνουμε ρεζίλι»[214]. Μήν πούμε και εμείς καμμιά κουβέντα, «γιατί κοιμάσαι, Θεέ, και δεν βλέπεις;», γιατί θα μας δώση σκαμπίλι εμάς. Είναι αναίδεια. Εκείνοι με ταπείνωση και απλότητα το είπαν. Δεν έδιναν ευθύνες στον Θεό, να πούν «γιατί τα έκανες έτσι;», αλλά έλεγαν «εμάς μας χρειάζονταν πολύ μεγαλύτερα κακά, αλλά τώρα τί θα πούμε στα έθνη;». Και είδατε; Ένα και ένα έκαμψαν τον Θεό. Καταλάβατε; Υπήρχε αναγνώριση του σφάλματος, μετάνοια, και επενέβη ο Θεός και «επάταξε...». Αν βρεθούμε και εμείς σε δυσκολία και δεν την αντιμετωπίσουμε πνευματικά, τότε θα πούν οι κοσμικοί  για μάς: «Που είναι η προσευχή σας; Λέτε ότι προσεύχεσθε, αλλά τί κάνετε;». Γινόμαστε ρεζίλι.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η μετάνοια βοηθάει να εξαφανισθή το κακό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν ζητούμε μετάνοια από τον Θεό για τον κόσμο, να βάζουμε και τον εαυτό μας μέσα σ́ αυτούς που έχουν φταίξει και να μη λέμε: «Βοήθησε τον κόσμο που είναι αμαρτωλός». Οι Τρείς Παίδες γεννήθηκαν στην αιχμαλωσία, και όμως δεν είπαν «τί φταίμε εμείς;», αλλά είπαν: «Δικαίως πάθαμε, έπρεπε και περισσότερα να πάθουμε». Μιλούσαν σαν να ήταν από αυτούς που παρέβησαν τις εντολές του Θεού πριν από την Βαβυλώνια αιχμαλωσία, σαν να ήταν και αυτοί συμμέτοχοι στην αμαρτία, ενώ ήταν αμέτοχοι, αφού δεν είχαν ακόμη γεννηθή. Πόσο με συγκινεί η προσευχή που έκαναν, όταν βρίσκονταν μέσα στο καμίνι! «Δίκαιος εί, Κύριε, επί πάσιν οίς εποίησας ημίν... Ότι ημάρτομεν και ηνομήσαμεν... Και νυν ουκ έστιν ημίν ανοίξαι το στόμα ημών. Μη δη παραδώης ημάς εις τέλος... και μη αποστήσης το έλεός σου αφ᾿ ημών δια Αβραάμ τον ηγαπημένον υπό σού». Δηλαδή, «δίκαια μας τιμωρείς, Κύριε, γιατί αμαρτήσαμε, αλλά μόνο για χατίρι του Αβραάμ που τον αγαπάς, γιατί δεν αμάρτησε, μη μας εγκαταλείπης». Έβαζαν και τον εαυτό τους μέσα στους αμαρτωλούς, και το πίστευαν, γι'' αυτό έγινε το καμίνι δροσιά. Ενώ τον ειδωλολάτρη που πήγε να δη το καμίνι, τον πήραν οι φλόγες[215].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο άνθρωπος, αν δεν δουλεύη έτσι, αρχίζει συνέχεια να δικαιολογήται. «Ο διάβολος με έβαλε και αμάρτησα» ή «ο Αδάμ φταίει, η Εύα φταίει· δεν φταίω εγώ». Ένας θεολόγος μου είπε μια φορά: «Και τί χρωστάμε εμείς τώρα να ταλαιπωρούμαστε εξ αιτίας της Εύας;». «Ευλογημένε άνθρωπε, του λέω, σε πειράζει αυτό για να σωθής;». Τί φταίει ο Αδάμ ο καημένος ή η Εύα η φουκαριάρα; Ένα σφάλμα έκαναν και πόσους αιώνες ήταν στον Άδη, ενώ εμάς ήρθε ο Χριστός και μας λύτρωσε. «Εβδομηκοντάκις επτά φορές αν αμαρτήσετε και μετανοήσετε, είπε, σάς συγχωράω!»[216]. Χιλιάδες φορές αμαρτάνουμε και ο Χριστός μας συγχωράει – αρκεί να μετανοούμε ειλικρινά –, και να λέμε ότι φταίει ο Αδάμ και η Εύα; Και να δήτε δεν βάζουν το όνομα Εύα – να δώσουμε το όνομα Εύα σε μια αδελφή, ή τουλάχιστον Ζωή, αν είναι δύσκολο Εύα! Μά είναι πολύ αδικημένη! Αυτή είναι η μάνα μας, η μητέρα όλου του κόσμου, και ούτε καν το όνομά της δεν θέλουμε να ακούσουμε. Και την κατάρα, στην ουσία, στον διάβολο την έδωσε ο Θεός. «Και ο όφις ήταν φρόνιμος»[217]. Μπήκε ο διάβολος στο φίδι, για να ξεγελάση τον άνθρωπο. Και βλέπεις, όλοι τα βάζουν με την Εύα, ότι αυτή μας χαντάκωσε, ενώ θα ήμασταν μια χαρά στον Παράδεισο, αν δεν γινόταν η παράβαση! Αν και εμάς μας έλεγε ο Χριστός, «αφού σφάλατε μία φορά, θα πάτε τόσους αιώνες στον Άδη», έ, τότε να έλεγε κανείς κάτι!... Τί αχάριστος κόσμος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως η μετάνοια είναι μεγάλη υπόθεση. Δεν έχουμε καταλάβει ότι ο άνθρωπος με την μετάνοια μπορεί να αλλάξη την απόφαση του Θεού. Δεν είναι μικρό πράγμα αυτό, να έχη τέτοια δύναμη ο άνθρωπος. Κάνεις κακό; Ο Θεός σού δίνει σκαμπιλάκι. Λές «ήμαρτον»; Σταματά και σού δίνει ευλογίες. Όταν δηλαδή συνέρχεται το άτακτο παιδί, μετανοή και δέρεται από την συνείδησή του, τότε ο Πατέρας του το χαϊδεύει με αγάπη και το παρηγορεί. Οι Ισραηλίτες, επειδή είχαν ξεφύγει από τις εντολές του Θεού, έζησαν στην αιχμαλωσία εβδομήντα πέντε χρόνια. Και τελικά, όταν μετανόησαν, παρουσιάζεται ο βασιλιάς Κύρος, που τολμά να πη κανείς ότι φάνηκε καλύτερος από τους υιούς του Ισραήλ, οι οποίοι είχαν μολύνει τα ιερά που είχαν για τις θυσίες. Του άλλαξε το μυαλό ο Θεός και τον έκανε να πιστεύη στον Θεό του Ουρανού. Έτσι άφησε τους Ισραηλίτες ελεύθερους, τους έδωσε χρήματα, ξυλεία για τον Ναό, τους έφτιαξε το τείχος της Ιερουσαλήμ και έδειξε τέτοια καλωσύνη και τέτοια ευλάβεια, που δεν έδειξαν κατά κάποιον τρόπο ούτε οι Ισραηλίτες[218]. Και όλα αυτά, γιατί μετανόησε και άλλαξε ο λαός[219]. Πόσο βοηθάει η μετάνοια, για να εξαφανισθή το κακό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τα βιβλία των Μακκαβαίων να τα διαβάσετε όλα. Είναι πολύ δυνατά. Τί διαταγή είχε δώσει ο βασιλιάς! Να καταπατήσουν οι ελέφαντες τους Ισραηλίτες! Πήγαν οι άλλοι, ετοίμασαν την τελετή, πότισαν πεντακόσιους ελέφαντες με δυνατό κρασί και λιβανωτό, για να τους εξαγριώσουν, και περίμεναν τον βασιλιά να παρουσιασθή, για να αρχίσουν την τελετή. Αλλά ο βασιλιάς είχε ξεχάσει την διαταγή που έδωσε. Πηγαίνει ο ελεφαντάρχης να ειδοποιήση τον βασιλιά, γιατί δεν είχε παρουσιασθή ακόμη. «Βασιλιά, του λέει, σε περιμένουμε. Όλα τα έχουμε έτοιμα· τους ελέφαντες, τους Ιουδαίους, οι προσκαλεσμένοι περιμένουν». «Ποιός σάς είπε να κάνετε τέτοιο πράγμα;», του λέει! Φωνές, απειλές... Και αυτό δεν έγινε μια φορά αλλά τρείς[220]. Μικρό πράγμα ήταν να ξεχάση ο βασιλιάς την εντολή που είχε δώσει ο ίδιος; Και όχι μόνον αυτό, αλλά τελικά άλλαξε όλη την στάση του προς τους Ιουδαίους. Όλη η βάση εκεί είναι: Να μετανοήση ο κόσμος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι σύλλογοι ειρήνης που ιδρύονται από διάφορα κράτη βοηθούν για την ειρήνη στον κόσμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εξαρτάται. Είναι και μερικοί που ξεκινούν με καλή διάθεση. Αλλά, όταν μαζεύωνται τί μάγοι, τί πυρολάτρες, τί Προτεστάντες, ένα σωρό – άκρη δεν βρίσκεις –, για να φέρουν την ειρήνη στον κόσμο, πώς να βοηθήσουν; Ο Θεός να με συγχωρέση, αυτά είναι κουρελούδες του διαβόλου. Γίνεται ειρήνη με αμαρτωλό συνεταιρισμό; Πώς μπορεί να έρθη η ειρήνη, όταν οι άνθρωποι δεν συμφιλιωθούν με τον Θεό; Μόνον όταν συμφιλιωθή ο άνθρωπος με τον Θεό, έρχεται και η εσωτερική ειρήνη και η εξωτερική. Για να συμφιλιωθή όμως ο άνθρωπος με τον Θεό, πρέπει να έρθη σε συναίσθηση, να μετανοήση, να ζη σύμφωνα με τις εντολές του Θεού, και τότε έρχεται η Χάρις και η ειρήνη του Θεού μέσα του, οπότε μπορεί να βοηθήση και για την ειρήνη γύρω του.
