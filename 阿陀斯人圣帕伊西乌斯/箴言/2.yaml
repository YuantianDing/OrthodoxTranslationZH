  '208': Βλ.Ματθ. 16, 26.
  '209': 'Λαυσαϊκό ή Λαυσαϊκή ιστορία: Βιογραφίες Αγίων ασκητών της Αιγύπτου και της Παλαιστίνης. Το έργο συντάχθηκε πιθανόν κατά τα μέσα του 5ου αιώνα από τον επίσκοπο Ελενοπόλεως της Βιθυνίας Παλλάδιο και αφιερώθηκε από αυτόν στον Βυζαντινό Πατρίκιο Λαύσο, από τον οποίο πήρε και το όνομα.'
  '210': Ο Αββάς Αρσένιος ο Μέγας (354–447) καταγόταν από την Ρώμη. Ήταν μέγας κατά την σοφία και την αρετή. Ονομαζόταν «πατήρ Βασιλέων», γιατί ο αυτοκράτορας Θεοδόσιος του ανέθεσε την μόρφωση των δύο παιδιών του. Το 394 μετά από θεία πληροφορία αναχωρεί για την έρημο της Αιγύπτου. Αν και είχε ζήσει στα ανάκτορα, διακρίθηκε ως μοναχός για την μεγάλη αυστηρότητα και την σκληραγωγία του.
  '211': Βλ.Ιω. 6, 5 κ.ε.
