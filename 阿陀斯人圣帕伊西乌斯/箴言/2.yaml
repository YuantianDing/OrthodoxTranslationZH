  '190': Ιακ. 5, 16.
  '191': 'Στον βίο του Οσίου Παϊσίου του Μεγάλου αναφέρεται το εξής γεγονός: Ένας αμελής υποτακτικός έπεσε από παρακοή σε κάποια αμαρτία και πέθανε, χωρίς να μετανοήση. Ο Θεός αποκάλυψε στον Γέροντά του μετά από τις επίμονες δεήσεις του ότι η ψυχή του υποτακτικού του θα βασανίζεται στον Άδη μέχρι την ημέρα της Κρίσεως, οπότε θα λάβη την πρέπουσα ανταπόδοση. Ο Γέροντας τότε κατέφυγε στον Όσιο Παΐσιο και τον παρακάλεσε να δεηθή και εκείνος στον Θεό για την σωτηρία του υποτακτικού του. Μετά από την θερμή προσευχή του Οσίου, ο Χριστός ελευθέρωσε την ψυχή του αμετανόητου υποτακτικού από τον Άδη.'
  '192': Λουκ. 24, 29.
  '193': Βλ.Ματθ. 21, 21.
  '194': Ο Γέροντας εννοεί την αγρυπνία της 9ης προς 10η Νοεμβρίου του 1993. Παρόλο που ήταν πολύ ταλαιπωρημένος από τον καρκίνο, όρθιος, στηριγμένος σε μια καρέκλα, έδωσε την ευχή του σε τριάντα χιλιάδες περίπου ανθρώπους που πέρασαν εκείνη την ημέρα.
  '195': Η προσωνυμία «Μακκαβαίος» δόθηκε στον Ιούδα, ηγέτη της Ιουδαϊκής επαναστάσεως, η οποία έγινε το 166 π.Χ. κατά του Αντιόχου Δ´ του Επιφανούς, ηγεμόνος του βασιλείου των Σελευκιδών. Σημαίνει – κατά την πιθανώτερη άποψη – αυτόν που σφυροκόπησε τους εχθρούς. Το ίδιο επίθετο δόθηκε στην συνέχεια και στους διαδόχους του Ιούδα. Οι Μακκαβαίοι διακρίθηκαν για τους αγώνες υπέρ της πατρώας πίστεως και της πολιτικής ελευθερίας. (Βλ.Α´, Β´, Γ´ Μακ.).
  '196': Βλ. Αββά Ισαάκ του Σύρου,Οι Ασκητικοί Λόγοι, Λόγος ΜΒ´, σ. 153.
  '197': Για την Προσευχή και τον Μοναχισμό θα κυκλοφορήσουν ιδιαίτεροι τόμοι. Στον τόμο αυτόν έχει περιληφθή από αυτά τα θέματα μόνον ό,τι έχει σχέση με την πνευματική αφύπνιση.
  '198': Ματθ. 5, 16.
  '199': Βλ. Ιωάννου του Σιναΐτου,Κλίμαξ, Λόγος ΚΣΤ´, παρ. κγ´, σ. 128.
  '200': Ο Γέροντας έμεινε στο Καλύβι του Τιμίου Σταυρού τα χρόνια 1969–1978.
  '201': Ειπώθηκαν τον Μάιο του 1991.
