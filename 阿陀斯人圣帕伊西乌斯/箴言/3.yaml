footnotes:
  '1': Η λέξη «λογισμός» στην ασκητική γλώσσα δηλώνει είτε μία απλή σκέψη που περνάει από τον νού, είτε μία κίνηση της ψυχής προς το καλό ή προς το κακό, είτε μία τάση καλή ή κακή, η οποία έχει αποκτηθή με την συνεργασία του νού, της συνειδήσεως, του συναισθήματος και της βουλήσεως. Επειδή οι λογισμοί προηγούνται κάθε πράξεως, γι᾿ αυτό ο αγώνας κάθε πιστού, αλλά κυρίως του μοναχού, για να είναι σωστός, πρέπει να στρέφεται πρωταρχικά στην εξέταση των λογισμών, ώστε να καλλιεργούνται οι καλοί και να αποβάλλωνται οι κακοί.
  '2': Βλ.Δ´ Μακ. 3, 5.
  '3': Βλ.Δ´ Μακ. 5, 1 κ.ε.
  '4': Ιω. 7, 24.
  '5': Βλ.Α´ Κορ. 6, 19 και 3, 16.
  '6': 'Ανάμεσα στις διηγήσεις για τους μοναχούς των πρώτων χρόνων αναφέρεται και το εξής περιστατικό: Ένας αρχιληστής, για να μπορέση να ληστέψη ένα καλά οχυρωμένο γυναικείο μοναστήρι, μεταμφιέσθηκε σε μοναχό και ζήτησε κατάλυμα για την νύχτα. Η ηγουμένη και όλες οι αδελφές τον δέχτηκαν σαν μεγάλο αββά με πολύ σεβασμό. Συγκεντρώθηκαν όλες οι μοναχές, για να πάρουν την ευχή του, του έπλυναν τα πόδια και πήραν ευλογία το απόπλυμα. Μια παράλυτη αδελφή, που νίφτηκε με αυτό με πίστη, θεραπεύτηκε και πήγε προς έκπληξη όλων να πάρη κι εκείνη την ευχή του. Ο αρχιληστής βλέποντας το θαύμα αλλοιώθηκε εσωτερικά, μετάνοιωσε, πέταξε το σπαθί που είχε κρυμμένο κάτω από το ράσο του και μετά από λίγο καιρό και αυτός και οι σύντροφοί του έγιναν μοναχοί και έζησαν με ακρίβεια την μοναχική ζωή. (Βλ. Δ. Τσάμη,Μητερικόν, τόμος Γ´, Θεσσαλονίκη 1992, σ. 18–24).'
  '7': Καλαμποκήσιο ψωμί.
  '8': Λουκ. 23, 39.
  '9': Βλ.Λουκ.  23, 41.
  '10': 'Νηλεύς Καμαράδος: Έζησε στην Κωνσταντινούπολη περί το 1880. Φιλοπονώτατος μουσικός που ασχολήθηκε με την θεωρία της βυζαντινής μουσικής και διακρίθηκε μεταξύ των ιεροψαλτών.'
  '11': Ο εσωνάρθηκας των μοναστηριακού τύπου ναών, δηλαδή ο μεταξύ του κυρίως ναού και του νάρθηκος χώρος. Έλαβε την ονομασία του από την σύντομη ακολουθία της Λιτής, η οποία στα Μοναστήρια ψάλλεται συνήθως σ᾿ αυτόν τον χώρο στις μεγάλες εορτές, κατά τις ολονύκτιες αγρυπνίες, και περιλαμβάνει ιδιόμελα τροπάρια και μεγάλη δέηση και ικεσία (λιτή).
  '12': Βλ. Αγίου Γρηγορίου του Διαλόγου,Ευεργετινός, τόμος Α´, Υπόθεσις ΛΕ´, έκδ. Ματθ. Λαγγή, Αθήναι 1980, σ. 510.
  '13': Έτσι αποκαλούσε ο Γέροντας τον διάβολο.
  '14': Αββά Ισαάκ του Σύρου,Οι Ασκητικοί Λόγοι, Επιστολή Δ´, έκδ. «Αστήρ», Αθήναι 1961, σ. 329.
  '15': Η αρχή του ειρμού της α’ ωδής του κανόνος του Ακαθίστου Ύμνου.
  '16': Ο Γέροντας χρησιμοποιούσε αυτήν την λέξη με την σημασία του «χαζούλικος».
  '17': Η μνήμη του εορτάζεται στις 2 Οκτωβρίου.
  '18': Η μνήμη του εορτάζεται στις 28 Αυγούστου.
  '19': Η ενδοτέρα έρημος στο βορειοδυτικό τμήμα της Αραβίας.
  '20': Βλ.Το Γεροντικόν, Αββάς Μακάριος ο Αιγύπτιος κβ´, έκδ. «Αστήρ», Αθήναι 1981, σ. 68.
  '21': Ψαλμ. 149, 6.
  '22': Βλ.Ματθ. 14, 28–31.
  '23': Μετά την θεία Κοινωνία των πιστών και την διανομή του αντιδώρου, ο ιερεύς καταλύει ό,τι απέμεινε στο Άγιο Ποτήριο.
  '24': Πρόχειρο υπόγειο χαράκωμα που προστατεύει κατά τον πόλεμο τους στρατιώτες από τις βολές του πυροβολικού και της αεροπορίας.
  '25': Το βαρύ και μεγάλο σιδερένιο σφυρί.
  '26': Ψαλμ. 50, 12.
  '27': Ματθ. 15, 19.
  '28': Λουκ. 6, 45.
  '29': Λουκ. 4, 8.
  '30': 'Ενοικιοστάσιο: Νομική διάταξη σύμφωνα με την οποία οι ενοικιαστές στέγης για κατοικία ή για επαγγελματική δραστηριότητα έχουν το δικαίωμα να παρατείνουν την διαμονή τους και μετά την λήξη της μισθώσεως.'
  '31': Συλλογή διδαχών και διηγήσεων διαφόρων Αγίων Πατέρων, την οποία συνέθεσε κατά τον 11ο αι. ο μοναχός Παύλος, ιδρυτής, κτήτορας και ηγούμενος της Ιεράς Μονής «Παναγίας της Ευεργέτιδος» στην Κωνσταντινούπολη, από την οποία έλαβαν και ο ίδιος και η συλλογή του την επωνυμία «Ευεργετινός».
  '32': Λουκ. 16, 25.
  '33': Ο Γέροντας, όταν αναφέρεται στους Ευρωπαίους, δεν τους υποτιμά, αλλά θέλει να μας αποτρέψη από το ορθολογιστικό πνεύμα των Δυτικών.
  '34': Ο ανθρωπισμός, που έχει ως κέντρο τον αυτονομημένο – ξεκομμένο – από τον Θεό και την Εκκλησία άνθρωπο, αναπτύχθηκε στην Δύση μετά τον Μεσαίωνα.
  '35': 'Το 1950, όταν ο Γέροντας Παΐσιος είχε πάει στο Άγιον Όρος για πρώτη φορά, καθώς έψαχνε για το μονοπάτι που έβγαζε από τα Καυσοκαλύβια στην Σκήτη της Αγίας Άννης, είχε συναντήσει έναν αναχωρητή «...μέ φωτεινό πρόσωπο – θα ήταν γύρω στα εβδομήντα χρόνια – που έδειχνε από την ενδυμασία του να μην είχε επαφή με ανθρώπους. Απ᾿ όλο το παρουσιαστικό του φαινόταν Άγιος!» (Γέροντος Παϊσίου Αγιορείτου,Αγιορείται Πατέρες και Αγιορείτικα, έκδ. Ι. Ησυχ. «Ευαγγ. Ιω. ο Θεολόγος», Σουρωτή Θεσσαλονίκης 1993, σ. 46 κ.ε.). Όταν ρώτησε τον ερημίτη που μένει, εκείνος του απήντησε: «Κάπου εδώ», και του έδειξε την κορυφή του Άθωνα. Αργότερα, έμπειροι Γεροντάδες του το επιβεβαίωσαν ότι στην κορυφή του Άθωνα ζούσαν στην αφάνεια δώδεκα αναχωρητές.'
  '36': Ειπώθηκε τον Νοέμβριο του 1988.
  '37': Ιδιόρρυθμο ονομάζεται το μοναστήρι στο οποίο ο κάθε μοναχός έχει δικό του πρόγραμμα και πληρώνεται για το διακόνημα που κάνει από τους επιτρόπους, οι οποίοι διοικούν το μοναστήρι.
  '38': 1956–1958.
  '39': Η έρημος της Βίγλας βρίσκεται στο νοτιοανατολικό τμήμα της χερσονήσου του Άθωνα.
  '40': Οι μοναχοί μιας Καλύβης, οι οποίοι έχουν λάβει την μοναχική κουρά από τον ίδιο Γέροντα.
  '41': Ψαλμ. 24, 7.
  '42': Βλ.Γέν. 3, 11–13.
  '43': Βλ.Γέν. 37, 20 κ.ε.
  '44': Βλ.Γέν. 41, 41.
  '45': Βλ.Ιω. 14, 12.
  '46': Ο υπεύθυνος μοναχός για την τήρηση των διατάξεων που αφορούν στις Ιερές Ακολουθίες του ημερονυκτίου και γενικά για την εκκλησιαστική ευταξία.
  '47': 1. Βλ.Γέν. 13, 1–13.
  '48': Η λέξη «δικαίωμα» στην μοναχική γλώσσα δηλώνει την τάση του μοναχού να δικαιώνη τον εαυτό του και την απαίτηση να ικανοποιή οποιαδήποτε εγωκεντρική επιθυμία του.
  '49': Ο Γέροντας στον στρατό υπηρέτησε ως ασυρματιστής.
  '50': Μοναχός του τάγματος των Ιησουϊτών του Ρωμαιοκαθολικισμού, που ιδρύθηκε από τον Ιγνάτιο Λοϊόλα και είναι γνωστό για την αυστηρή πειθαρχία και για τις ακρότητες στις οποίες έφθασε. Μεταφορικά η λέξη χρησιμοποιείται, για να χαρακτηρίση τον άνθρωπο που τηρεί με αυστηρότητα εξωτερικούς τύπους ευσεβείας, χωρίς να έχη αντίκρισμα εσωτερικό.
  '51': Βλ.Ματθ. 5, 41.
  '52': Βλ.Ματθ. 5, 40.
  '53': Ψαλμ. 50, 12.
  '54': Βλ.Ευεργετινός, τόμος Α´, Υπόθεσις Α´, σ. 54 κ.ε.
  '55': Βλ.Ευεργετινός, τόμος Α´, Υπόθεσις Α´, σ. 34 κ.ε.
  '56': Στην ασκητική γλώσσα η λέξη «προσπάθεια» σημαίνει εμπαθή προσκόλληση σε κάτι ή επιδίωξη για την ικανοποίηση μιας φίλαυτης επιθυμίας.
  '57': Βλ. Γέροντος Παϊσίου Αγιορείτου,Αγιορείται Πατέρες και Αγιορείτικα, σ. 63.
  '58': Ματθ. 6, 13.
  '59': Βλ.Λουκ. 18, 9–14.
  '60': Ο Γέροντας εννοεί τις τεχνικές της γιόγκα και του διαλογισμού που χρησιμοποιούν οι οπαδοί των ανατολικών θρησκειών, προκειμένου να φθάσουν στην κατ᾿ αυτούς λύτρωση, που την ονομάζουν «νιρβάνα».
  '61': Βλ.Β´ Βασ. 12, 13.
  '62': Παλαιότερα αρχηγός ομάδος με πολιτικοστρατιωτική εξουσία.
  '63': Οπισθογεμές τουφέκι παλαιού τύπου.
  '64': Ο Γέροντας στο Καλύβι της Παναγούδας δεχόταν τους επισκέπτες, εκτός από τους χειμερινούς μήνες, στην αυλή, όπου χρησιμοποιούσε για καθίσματα κούτσουρα, τα οποία μετακινούσε ανάλογα με τις περιστάσεις.
  '65': Βλ.Αββά Ισαάκ του Σύρου,Οι Ασκητικοί Λόγοι, Λόγος ΙΘ´, σ. 58 κ.ε.
  '66': Ως όρος της αγιοπατερικής γλώσσας δηλώνει την μακαρία εκείνη κατάσταση κατά την οποία, μετά από μακροχρόνια άσκηση, παύουν να ενεργούν τα πάθη και ο άνθρωπος φθάνει με την Χάρη του Θεού «εις μέτρον ηλικίας του πληρώματος του Χριστού».
  '67': Βλ. Αγίου Γρηγορίου Νύσσης,Εις την προσευχήν, Λόγος Β´,PG44, 1141Α.
  '68': Το 1994, στο Θεαγένειο νοσοκομείο.
  '69': Ιω. 15, 5.
  '70': Βλ. Οσίου Μάρκου του Ασκητού,Περί των οιομένων εξ έργων δικαιούσθαι, κεφ. σιε´, Φιλοκαλία των ιερών Νηπτικών, τόμος Α´, έκδ. «Αστήρ», Αθήναι 1984, σ. 124.
  '71': Λουκ. 15, 17.
  '72': Λουκ. 15, 7.
  '73': Το Γεροντικόν, Αββάς Αλώνιος γ´, σ. 20.
  '74': Από το τρίτο τροπάριο της ζ´ ωδής του Μεγάλου Παρακλητικού Κανόνος στην Παναγία.
  '75': Ματθ. 26, 75 καιΛουκ. 22, 62.
  '76': Ιω. 3, 5.
  '77': Ιω. 3, 5.
  '78': 'Έρχεται η Χάρις: Ο Γέροντας χρησιμοποιεί αυτήν την έκφραση με την σημασία του «ενεργοποιείται, φανερώνεται ενεργώς».'
  '79': Βλ.Ματθ. 27, 3–5.
  '80': Υπακοή του Α´ ήχου.
  '81': Ψαλμ. 50, 5.
  '82': Ψαλμ. 37, 19.
  '83': Ψαλμ. 50, 5.
  '84': Αββά Ισαάκ του Σύρου,Οι Ασκητικοί Λόγοι, Λόγος Λ´, σ. 111.
  '85': 'Αρχικός: ανώτερος, ηγεμονικός. Ένας από τους αρχηγούς των δαιμόνων. Οι δαίμονες, κατά τους Πατέρες, συγκροτούν στρατιές.'
  '86': Ματθ. 12, 45.
  '87': Ψαλμ. 50, 19.
  '88': Ο 61ος κανόνας της Στ´ Οικουμενικής Συνόδου ορίζει να αφορίζωνται οι «φυλακτήριοι», δηλαδή οι μάγοι που κατασκευάζουν «φυλακτήρια» (=φυλακτά), στα οποία βάζουν δαιμονικά σύμβολα ή διάφορα μακάβρια αντικείμενα (τρίχες, νύχια, κοκκαλάκι φιδιού ή νυχτερίδας κ.λπ.). Σ᾿ αυτά έχουν μεταδώσει προηγουμένως με μαγικές πράξεις, που γίνονται με επικλήσεις δαιμόνων, δαιμονική επήρεια.
  '89': Είδος μαγείας που ασκείται κατά την παραδοσιακή θρησκευτική λατρεία της Αιτής και της νότιας Αμερικής. Ο όρος προέρχεται από την λέξη «βόντουν», που σημαίνει θεός ή πνεύμα.
  '90': Ο Άγιος Αρσένιος ο Καππαδόκης.
  '91': Βλ.Λουκ.  8, 26 κ.ε.
  '92': Λουκ.  8, 30.
  '93': Ρωμαϊκή στρατιωτική μονάδα που την απήρτιζαν τρεις έως έξι χιλιάδες στρατιώτες.
  '94': Ο Γέροντας έλεγε ότι ο ψυχοπαθής χρειάζεται την ιατρική βοήθεια καλού και πιστού ψυχιάτρου και την πνευματική βοήθεια του πνευματικού, ενώ ο δαιμονισμένος, εφόσον έχει τα λογικά του, χρειάζεται να βρη σε τί έφταιξε και δαιμονίσθηκε, να μετανοήση και να εξομολογηθή, για να απαλλαγή από το δαιμόνιο.
  '95': Εννοούσε τον διάβολο.
  '96': Ο Γέροντας εννοεί τους δίσκους που έχουν κρυμμένα μηνύματα σε «ανάστροφη κάλυψη».
  '97': Η μνήμη του εορτάζεται στις 7 Φεβρουαρίου.
  '98': Βλ. Γέροντος Παϊσίου Αγιορείτου,Αγιορείται Πατέρες και Αγιορείτικα, σ. 96–97.
  '99': Ο Γέροντας χαρακτηρίζει ως ξερή την άσκηση που γίνεται αυτοσκοπός και δεν χρησιμοποιείται ως μέσο για την κάθαρση της καρδιάς και την εν Χριστώ τελείωση.
  '100': Μικρά επιμήκη σανίδια που τοποθετούνται σε εγκοπή, η οποία γίνεται στο πίσω μέρος ενός μεγάλου σανιδιού, για να μην κυρτώση το σανίδι.
  '101': Βλ.Γέν. 37, 5–11.
  '102': Βλ.Δαν. 2, 25–46.
  '103': Βλ.Δαν. 6, 16 κ.ε.
  '104': Βλ.Δαν., Βήλ και Δράκων, 34–38.
  '105': Ψαλμ. 89, 4.
  '106': Στο μοναστήρι στο οποίο εκάρη μοναχός.
  '107': Οίκημα το οποίο περιλαμβάνει δύο-τρία κελλιά και μικρό ναό και ανήκει σε μία από τις είκοσι Μονές του Αγίου Όρους.
  '108': Το κτίριο στις Καρυές, την πρωτεύουσα του Άθω, όπου εδρεύει η «Ιερά Κοινότητα», το διοικητικό όργανο του Αγίου Όρους, την οποία συγκροτούν είκοσι μέλη, αντιπρόσωποι των είκοσι Μονών, εκλεγόμενα κάθε χρόνο.
  '109': Β´ Τιμ. 3, 13.
  '110': Μετεμψύχωση (ή αλλιώς μετενσάρκωση) είναι η πλανεμένη θεωρία σύμφωνα με την οποία η ψυχή μετά τον σωματικό θάνατο εισέρχεται σε άλλο σώμα ανθρώπου ή ζώου και διανύει έναν ατέλειωτο κύκλο γεννήσεων και θανάτων.
  '111': Όσα αναφέρονται εδώ από τον Γέροντα ισχύουν γενικώτερα για τις οργανώσεις της Νέας Εποχής, οι οποίες χρησιμοποιούν τις τεχνικές της γιόγκα και του διαλογισμού.
  '112': Ιω. 20, 29.
  '113': Μάρκ. 13, 22.
  '114': Βλ. Γέροντος Παϊσίου Αγιορείτου, Λόγοι, τόμος Β´, «Πνευματική αφύπνιση», έκδ. Ι. Ησυχ. «Ευαγγ. Ιω. ο Θεολόγος», Σουρωτή Θεσσαλονίκης 1999, σ. 275–276.
  '115': Είναι γνωστό ότι ο Θεός μπορεί να αποκαλύψη το θέλημά Του στον καλοπροαίρετο άνθρωπο με ποικίλους τρόπους. Παράδειγμα η όνος του Βαλαάμ που μίλησε, για να τον αποτρέψη από την αντίθετη προς το θείο θέλημα ενέργειά του. (Βλ.Αριθμ. 22:18–35).
  '116': Λίβελλος (από την λατινική λέξη libellus=βιβλιαράκι, φυλλάδιο) σήμαινε γραπτή ομολογία πίστεως, την οποία υπέβαλλαν στην Σύνοδο ή στον Επίσκοπο ή στον Βασιλέα.
  '117': Βλ.Ευχολόγιον το Μέγα, έκδ. «Αστήρ», Αθήναι 1986, σ. 591.
  '118': Το 1966 ο Γέροντας έκανε στο Σανατόριο εγχείρηση στους πνεύμονες, επειδή έπασχε από βρογχεκτασία.
  '119': Στην Ι. Μονή Εσφιγμένου, 1953–1956.
  '120': Α´ Τιμ. 6, 12.
  '121': Βλ. Οσίου Μάρκου του Ασκητού,Περί των οιομένων εξ έργων δικαιούσθαι, κεφ. ρνε´, Φιλοκαλία των ιερών Νηπτικών, τόμος Α´, σ. 120.
  '122': Βλ.Ψαλμ. 106, 1.
  '123': Βλ. Γέροντος Παϊσίου Αγιορείτου,Αγιορείται Πατέρες και Αγιορείτικα, σ. 15–40.
  '124': Βλ.Γέν. 9, 20–27.
  '125': Ψαλμ. 50, 5.
  '126': Αντιπρόσωποι του Πατριαρχείου.
  '127': Α´ Κορ. 11, 29.
  '128': 'Βλ. Αγίου Βασιλείου του Μεγάλου, Επιστολή 217, παρ. 84,PG32, 808Β: «Ου γαρ πάντως τω χρόνω κρίνομεν τα τοιαύτα, αλλά τω τρόπω της μετανοίας προσέχομεν».'
  '129': Συλλογή Κανόνων της Ορθόδοξης Εκκλησίας, η οποία περιέχει τους Ιερούς Κανόνες των Οικουμενικών Συνόδων, τους Αποστολικούς Κανόνες, καθώς και τους Κανόνες των Αγίων Πατέρων της Εκκλησίας, με σύντομη ερμηνεία. Την συνέταξαν κατά το 1793 ο Άγιος Νικόδημος ο Αγιορείτης και ο μοναχός Αγάπιος.
  '130': 'Δαδένιος: γερός, ανθεκτικός.'
