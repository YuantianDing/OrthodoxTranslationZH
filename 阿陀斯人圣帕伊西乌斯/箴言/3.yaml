author:
- ru: Преподобный Паисий Святогорец
  cn: 阿陀斯人圣帕伊西乌斯
document:
- type: h4
  initial:
    ru: ''
  text:
    ru: Введение
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Λόγοι Α'•Λόγοι Β'•Λόγοι Γ'•Λόγοι Δ'•Λόγοι Έ•Λόγοι ΣΤ'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Περιεχόμενα
- type: h1
  initial:
    ru: ''
  text:
    ru: Слова. Том 3. Духовная борьба.Λόγοι Γ' – Πνευματικός αγώνας
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρόλογος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο μακαριστός Γέροντας Παΐσιος, βλέποντας ότι στις μέρες μας «η αμαρτία έγινε μόδα», τόνιζε ιδιαίτερα την ανάγκη της μετανοίας και της εξομολογήσεως, όπως φαίνεται και στο τελευταίο κεφάλαιο του Β´ τόμου. «Μετάνοια και εξομολόγηση, μας έλεγε, χρειάζεται πάνω από όλα σήμερα, για να κοπούν τα δικαιώματα, που έδωσαν οι άνθρωποι στον διάβολο, με αποτέλεσμα να αλωνίζη τον κόσμο».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολλοί οδηγήθηκαν με την βοήθειά του για πρώτη φορά στο Μυστήριο της εξομολογήσεως, άλλαξαν ζωή, αγωνίζονται ως φιλότιμα παιδιά του Θεού και ζουν από τώρα τον Παράδεισο. «Πάντως οι άνθρωποι, μας έλεγε με χαρά ο Γέροντας, είναι πολύ καλοί. Ποτέ δεν μου συνέβη να πω σε κάποιον να πάη να εξομολογηθή, και να μην το κάνη». Βέβαια σε αυτό συντελούσε και η μεγάλη του αγάπη, που αλλοίωνε την ψυχή του ανθρώπου με τον οποίο επικοινωνούσε και την μετέτρεπε από άγονη γη σε καλλιεργήσιμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στον παρόντα Γ´ τόμο, ο οποίος εκδίδεται με την ευχή και την ευλογία του νέου Ποιμενάρχου μας, Σεβασμιωτάτου Μητροπολίτου Κασσανδρείας κ.κ. Νικοδήμου, συμπεριλαμβάνονται θέματα που μπορούν να βοηθήσουν τον ταλαιπωρούμενο από την αμαρτία άνθρωπο να αποκτήση την καλή ανησυχία και να αγωνισθή πνευματικά, ώστε να ελευθερωθή από τα δεσμά της. Ζώντας την μετάνοια θα μπορέση να απεκδυθή τον παλαιό του άνθρωπο, ο οποίος, όπως λέει κάπου ο Γέροντας, είναι «ένας κακός ενοικιαστής μέσα μας καί, για να φύγη, πρέπει να γκρεμίσουμε το σπίτι και να αρχίσουμε να χτίζουμε την νέα οικοδομή, τον καινό άνθρωπο».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αρχή της αμαρτίας κατά τους Πατέρες είναι ο κακός λογισμός. Γι᾿ αυτό στο πρώτο μέρος αυτού του τόμου συμπεριλήφθηκαν κατ᾿ επιλογή μερικά από όσα μας είπε ο Γέροντας σχετικά με τους λογισμούς. «Οι λογισμοί, έλεγε, δείχνουν την πνευματική μας κατάσταση».Ο καλός λογισμός έχει μεγάλη δύναμη· αλλοιώνει πνευματικά τον άνθρωπο. Αντίθετα ο κακός λογισμός τον βασανίζει. Όταν ο άνθρωπος διώχνη τους κακούς λογισμούς και καλλιεργή τους καλούς, εξαγνίζονται ο νούς και η καρδιά του και η Χάρις του Θεού κατοικεί μέσα του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το δεύτερο μέρος αναφέρεται στην μεγάλη ευλογία που δέχεται ο άνθρωπος από τον Θεό, όταν αδικήται και αντιμετωπίζη την αδικία πνευματικά. Την αλήθεια αυτήν την αγνοούν ακόμη και πνευματικοί άνθρωποι· δικαιώνουν τον εαυτό τους και φθάνουν «νά κάνουν δικό τους ευαγγέλιο». Έτσι απομονώνονται από τον Θεό, γιατί η ανθρώπινη δικαιοσύνη δεν έχει καμμία σχέση με την πνευματική ζωή. Αν θέλουμε να συγγενέψουμε με τον Χριστό, πρέπει να αποκτήσουμε την θεία δικαιοσύνη, που «έχει μέσα της φιλότιμο, αρχοντιά, θυσία».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το τρίτο μέρος αναφέρεται στην αμαρτία, η οποία κάνει κόλαση την επίγεια ζωή, που με τον πνευματικό αγώνα μπορεί να γίνη παράδεισος. Αν θέλη ο άνθρωπος «νά βγή από το σκοτάδι της αμαρτίας», πρέπει να μελετά την συνείδησή του, «τόν πρώτο θείο νόμο» που του έδωσε ο Θεός, και ταπεινά να αναγνωρίζη τα σφάλματά του. Έτσι θα οδηγηθή στην μετάνοια, η οποία είναι «ένα εργόχειρο που δεν τελειώνει ποτέ» και φέρνει στην ψυχή την θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο τέταρτο μέρος επισημαίνεται πώς οι δυνάμεις του σκότους, οι οποίες ενεργούν με τα όργανά τους, τους μάγους, τους πλανεμένους κ.λπ., ενώ αυτές καθαυτές είναι ανίσχυρες, γίνονται ισχυρές, όταν ο άνθρωπος τους δώση δικαιώματα με κάποια σοβαρή αμαρτία, οπότε και δέχεται δαιμονική επήρεια. Για να απαλλαγή από αυτήν, πρέπει να βρη σε τί έσφαλε, να μετανοήση, να εξομολογηθή και να γίνη συνειδητό μέλος της Εκκλησίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τέλος, στο πέμπτο μέρος τονίζεται ότι το Μυστήριο της εξομολογήσεως είναι απαραίτητο για την άφεση των αμαρτιών και ότι ο Χριστιανός, για να πορεύεται με ασφάλεια στην πνευματική ζωή, χρειάζεται να έχη πνευματικό οδηγό. Γίνεται σαφής διάκριση μεταξύ του έργου του ψυχιάτρου και του έργου του πνευματικού – τα οποία μερικές φορές στις μέρες μας συγχέονται – και αναφέρονται εμπειρίες του Γέροντα από την πνευματική εργασία που ο ίδιος έκανε στις ψυχές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Γέροντας, όπως πάντοτε, απαντάει σύντομα στα συγκεκριμένα ερωτήματα που του υποβάλλονται, χωρίς να κάνη συστηματική ανάλυση των θεμάτων και χωρίς να εξαντλή το θέμα στο οποίο αναφέρεται. Στόχο έχει να βοηθήση την ψυχή να σωθή· «γιά μένα, έλεγε, παρηγοριά και χαρά είναι η σωτηρία της ψυχής». Μιλάει ανάλογα με αυτό που διακρίνει ότι μπορεί να βοηθήση την συγκεκριμένη κάθε φορά ψυχή στον αγώνα της, δίνοντάς της την «πνευματική βιταμίνη» που της χρειάζεται και αναφέροντας συχνά κάποιο κατάλληλο παράδειγμα. Ο Γέροντας πίστευε ότι τα παραδείγματα βοηθούν πολύ. «Θέλω, έλεγε, να γράψω – αλλά δεν έχω χρόνο –, για μερικούς ανθρώπους που έζησαν τίμια, για μερικές κοπέλες και αγόρια, καθώς και για μερικούς οικογενειάρχες που είχαν μία αγία ζωή. Με τέτοια καλά παραδείγματα ελέγχονται όσοι έχουν κάνει μόδα την αμαρτία. Με το να ελέγχης το κακό, συχνά δεν βγαίνει τίποτε. Με το να παρουσιάζης όμως το καλό, ελέγχεται από μόνο του το κακό».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν και τα ερωτήματα, όπως είναι γνωστό, προέρχονται από μοναχές και ο Γέροντας απευθύνεται σε μοναχές, οι απαντήσεις αφορούν και σε κάθε άνθρωπο που αγωνίζεται ή θέλει να αγωνισθή τον «καλόν αγώνα». Γράφει χαρακτηριστικά σε κάποια επιστολή του αυτό που και οι Πατέρες της Εκκλησίας επισημαίνουν: «Οι εντολές είναι ίδιες και για τους λαϊκούς και για τους μοναχούς, και ο Παράδεισος ένας είναι». Άλλωστε συχνά διαπίστωνε ότι υπάρχουν λαϊκοί που ζουν πολύ πνευματικά και κάνουν λεπτή εργασία στον εαυτό τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ευχαριστούμε όσους δέχθηκαν με προθυμία να διαβάσουν τα χειρόγραφα του τόμου αυτού και να μας πούν τις σκέψεις τους, που βοήθησαν στην αρτιώτερη παρουσίασή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ας ευχηθούμε να εκπληρωθή η ευχή του Γέροντα: «Ο Καλός Θεός να μας φωτίζη και να μας δίνη καλή μετάνοια, για να αξιωθούμε όλοι τον Καλό Παράδεισο, που μας ετοίμασε ως Φιλόστοργος Πατέρας». Αμήν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 11 Φεβρουαρίου 2001
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κυριακή του Ασώτου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Καθηγουμένη του Ιερού Ησυχαστηρίου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φιλοθέη Μοναχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί αι σύν εμοί εν Χριστώ Αδελφαί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τα ζώα πώς καταλαβαίνουν την καλωσύνη ενός ανθρώπου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχουν διαίσθηση και καταλαβαίνουν, αν τα αγαπάς, αν τα πονάς. Τα ζώα στον Παράδεισο αισθάνονταν την ευωδία της Χάριτος και υπηρετούσαν τον Αδάμ. Μετά την παράβαση η φύση συστενάζει με τον άνθρωπο. Νά, ο καημένος ο λαγός λ.χ. συνέχεια κοιτάζει φοβισμένος. Η καρδιά του χτυπάει τάκ-τάκ-τάκ. Δεν κοιμάται καθόλου ο φουκαράς.  Πόσο υποφέρει αυτό το αθώο πλασματάκι εξ αιτίας μας! Όταν όμως ένας άνθρωπος επανέρχεται στην κατάσταση προ της πτώσεως, τα ζώα τον πλησιάζουν ξανά χωρίς φόβο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρώτο Μέρος – Ο Πόλεμοσ Των Λογισμών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος, όταν τα βλέπη όλα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μέ καλούς λογισμούς, εξαγνίζεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί χαριτώνεται από τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Με τους αριστερούς λογισμούς κατακρίνει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί αδικεί τους άλλους,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: εμποδίζει την θεία Χάρη να έρθη,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί έρχεται ο διάβολος και τον αλωνίζει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – Οι καλοί και οι κακοί λογισμοί[1]
- type: h2
  initial:
    ru: ''
  text:
    ru: Η δύναμη του καλού λογισμού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γέροντα, στην Παλαιά Διαθήκη, στο Δ´ βιβλίο των Μακκαβαίων, αναφέρεται: «Ο ευσεβής λογισμός δεν είναι εκριζωτής των παθών, αλλά ανταγωνιστής»[2]. Τί σημαίνει;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε να δής: Τα πάθη είναι βαθιά ριζωμένα μέσα μας, αλλά ο ευσεβής, ο καλός, λογισμός μας βοηθάει να μην υποδουλωνώμαστε σ᾿ αυτά. Όταν ο άνθρωπος φέρνη όλο καλούς λογισμούς και σταθεροποιήση μια καλή κατάσταση, τα πάθη παύουν να ενεργούν, οπότε είναι σαν να μην υπάρχουν. Δηλαδή ο ευσεβής λογισμός δεν ξερριζώνει τα πάθη, αλλά τα πολεμάει και μπορεί να τα καταβάλη. Νομίζω, ο συγγραφεύς περιγράφει τί μπόρεσαν να υποφέρουν οι Άγιοι Επτά Παίδες, η μητέρα τους Αγία Σολομονή και ο διδάσκαλός τους Άγιος Ελεάζαρος, έχοντας ευσεβείς λογισμούς[3], για να δείξη ακριβώς την δύναμη του καλού λογισμού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ένας καλός λογισμός ισοδυναμεί με μια πολύωρη αγρυπνία! Έχει μεγάλη δύναμη. Όπως τώρα κάποια νέα όπλα σταματούν με ακτίνες λέιζερ τον πύραυλο στην βάση του και τον εμποδίζουν να εκτοξευθή, έτσι και οι καλοί λογισμοί προλαβαίνουν και καθηλώνουν τους κακούς λογισμούς στα «αεροδρόμια» του διαβόλου, από τα οποία ξεκινούν. Γι᾿ αυτό προσπαθήστε, όσο μπορείτε, πριν προλάβη ο πειρασμός να σάς φυτέψη κακούς λογισμούς, να φυτεύετε εσείς καλούς λογισμούς, για να γίνη η καρδιά σας ανθόκηπος και να συνοδεύεται η προσευχή σας από την θεία ευωδία της καρδιάς σας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν κανείς κρατά έστω και λίγο αριστερό, δηλαδή κακό, λογισμό για κάποιον, οποιαδήποτε άσκηση και αν κάνη, νηστεία, αγρυπνία κ.λπ., πάει χαμένη. Σε τί θα τον βοηθήση η άσκηση, αν δεν αγωνίζεται παράλληλα να μη δέχεται τους κακούς λογισμούς; Γιατί να μην αδειάση από το πιθάρι πρώτα όλο το κατακάθι του λαδιού, που είναι μόνο για σαπούνι, και ύστερα να βάλη το καλό λάδι, αλλά βάζει το καλό με το άχρηστο και το μουρνταρεύει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ένας αγνός, καλός, λογισμός έχει μεγαλύτερη δύναμη από κάθε άσκηση. Κάποιος νέος λ.χ. πολεμείται από τον διάβολο και έχει ακάθαρτους λογισμούς και κάνει αγρυπνίες, νηστείες, τριήμερα, για να απαλλαγή από αυτούς. Ένας αγνός λογισμός όμως που θα φέρη έχει μεγαλύτερη δύναμη και από τις αγρυπνίες και από τις νηστείες που κάνει και τον βοηθάει πιο θετικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν λέτε «αγνός λογισμός», αναφέρεσθε μόνο σε ειδικά θέματα ή και σε γενικώτερα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και σε γενικώτερα. Γιατί ο άνθρωπος, όταν τα βλέπη όλα με καλούς λογισμούς, εξαγνίζεται και χαριτώνεται από τον Θεό. Με τους αριστερούς λογισμούς κατακρίνει και αδικεί τους άλλους, εμποδίζει την θεία Χάρη να έρθη, και έρχεται έπειτα ο διάβολος και τον αλωνίζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, επειδή κατακρίνει, δίνει δικαίωμα στον διάβολο να τον αλωνίση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί. Όλη η βάση είναι ο καλός λογισμός. Αυτό είναι που ανεβάζει τον άνθρωπο, τον αλλοιώνει προς το καλό. Πρέπει να φθάση κανείς στο σημείο να τα βλέπη όλα καθαρά. Είναι αυτό που είπε ο Χριστός: «Μη κρίνετε κατ᾿ όψιν, αλλά την δικαίαν κρίσιν κρίνατε»[4]. Μετά φθάνει ο άνθρωπος σε μία κατάσταση που βλέπει τα πάντα με τα πνευματικά μάτια· όχι με τα ανθρώπινα. Όλα τα δικαιολογεί, με την καλή έννοια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να προσέχουμε να μη δεχώμαστε τα πονηρά τηλεγραφήματα του διαβόλου, για να μη μολύνουμε «τόν Ναόν του Αγίου Πνεύματος»[5]και απομακρυνθή η Χάρις του Θεού, με αποτέλεσμα να σκοτισθούμε. Το Άγιο Πνεύμα, όταν δη την καρδιά μας αγνή, έρχεται και κατοικεί μέσα μας, γιατί αγαπάει την αγνότητα – γι᾿ αυτό και παρουσιάσθηκε σαν περιστέρι.
- type: h2
  initial:
    ru: ''
  text:
    ru: 'Η μεγαλύτερη αρρώστια: οι αριστεροί λογισμοί'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αγωνιώ, όταν έχω να τακτοποιήσω ένα πρόβλημα, και δεν μπορώ να κοιμηθώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σ᾿ εσένα το βασικό πρόβλημα είναι οι πολλοί λογισμοί. Αν δεν είχες αυτούς τους πολλούς λογισμούς, θα μπορούσες να αποδώσης πολύ περισσότερα και στην διακονία σου και στα πνευματικά σου. Άκου έναν τρόπο, για να αποφεύγης τους πολλούς λογισμούς: Όταν σού έρχεται στον νού κάτι που πρόκειται π.χ. να κάνης αύριο, να λές στον λογισμό σου: «Αυτή η δουλειά δεν είναι για σήμερα· θα την σκεφθώ αύριο». Επίσης, όταν είναι να αποφασίσης για κάτι, μην ταλαιπωρήσαι με την σκέψη να βρής το καλύτερο και αναβάλλεις συνέχεια. Διάλεξε κάτι και προχώρα. Άφησε έπειτα τον Θεό να φροντίση για τα παραπέρα. Προσπάθησε να αποφεύγης την σχολαστικότητα, για να μη ζαλίζης το μυαλό σου. Να κάνης ό,τι μπορείς με φιλότιμο και να κινήσαι απλά και με μεγάλη εμπιστοσύνη στον Θεό. Τον υποχρεώνουμε, κατά κάποιον τρόπο, τον Θεό να βοηθήση, όταν αναθέτουμε το μέλλον και τις ελπίδες μας σ᾿ Αυτόν. Με τους πολλούς λογισμούς κι ένας υγιής άνθρωπος αχρηστεύεται. Ένας που πάσχει και υποφέρει, είναι δικαιολογημένος, αν στενοχωριέται. Ένας όμως που έχει την υγεία του και ζαλίζεται και υποφέρει από αριστερούς λογισμούς, αυτός είναι για δέσιμο! Να είναι μια χαρά και να βασανίζεται με τους λογισμούς του!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην εποχή μας η μεγαλύτερη αρρώστια είναι οι μάταιοι λογισμοί των κοσμικών ανθρώπων. Οι άνθρωποι όλα μπορεί να τα έχουν εκτός από καλούς λογισμούς. Ταλαιπωρούνται, γιατί δεν αντιμετωπίζουν τα πράγματα πνευματικά. Π.χ. ξεκινάει κανείς να πάη κάπου, παθαίνει μια μικρή βλάβη η μηχανή του αυτοκινήτου του, και καθυστερεί λίγο να φθάση στον προορισμό του. Αν έχη καλό λογισμό, θα πή: «Φαίνεται, ο Καλός Θεός έφερε αυτό το εμπόδιο, γιατί ίσως θα πάθαινα κάποιο ατύχημα, αν δεν είχα αυτήν την καθυστέρηση. Πώς να Σε ευχαριστήσω, Θεέ μου, γι᾿ αυτό;», και δοξάζει τον Θεό. Ενώ, αν δεν έχη καλό λογισμό, δεν θα αντιμετωπίση πνευματικά την κατάσταση, θα τα βάλη με τον Θεό και θα βρίζη: «Νά, θα πήγαινα νωρίτερα, άργησα, τί αναποδιά! Και Αυτός ο Θεός...».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο άνθρωπος, όταν δέχεται ό,τι του συμβαίνει με δεξιό λογισμό, βοηθιέται. Ενώ, όταν δουλεύη αριστερά, βασανίζεται, λειώνει, παλαβώνει. Μια φορά, πριν από χρόνια, μπήκαμε σε ένα φορτηγό που είχε για καθίσματα κάτι σανίδες, για να έρθουμε από την Ουρανούπολη στην Θεσσαλονίκη. Μέσα ήταν άνω-κάτω· βαλίτσες, πορτοκάλια, ψάρια, βρώμικα καφάσια από ψάρια που τα επέστρεφαν, παιδιά από την Αθωνιάδα, άλλα καθιστά, άλλα όρθια, καλόγεροι, λαϊκοί... Ένας λαϊκός ήρθε και κάθησε δίπλα μου. Ήταν και χονδρός καί, επειδή κάπως στρυμώχθηκε, έβαλε τις φωνές: «Τί κατάσταση είναι αυτή!...». Πιό εκεί ήταν ένας μοναχός πού, ο φουκαράς, ήταν κουκουλωμένος μέχρι επάνω από τα καφάσια και μόνον το κεφάλι του είχε έξω. Εν τω μεταξύ, όπως κουνιόταν το φορτηγό – ο δρόμος ήταν ένας καρρόδρομος χαλασμένος –, έπεφταν τα στοιβαγμένα καφάσια και ο καημένος προσπαθούσε να τα πετάη αριστερά-δεξιά με τα χέρια του, για να μην τον χτυπήσουν στο κεφάλι. Και ο άλλος φώναζε, επειδή καθόταν λίγο στρυμωχτά. «Δεν βλέπεις, του λέω, εκείνος πώς είναι, κι εσύ φωνάζεις;». Ρωτάω και τον μοναχό: «Πώς τα περνάς, πάτερ;». Κι εκείνος χαμογελώντας μου λέει: «Από την κόλαση, Γέροντα, καλύτερα είναι εδώ»! Ο ένας βασανιζόταν, αν και καθόταν, και ο άλλος χαιρόταν, παρόλο που τα καφάσια κόντευαν να τον κουκουλώσουν. Και είχαμε δυο ώρες δρόμο· δεν ήταν και κοντά. Ο νούς του λαϊκού γύριζε στην άνεση που θα είχε, αν ταξίδευε με λεωφορείο, και πήγαινε να σκάση, ενώ ο μοναχός σκεφτόταν την στενοχώρια που θα είχε, αν βρισκόταν στην κόλαση, και ένιωθε χαρά. Σκέφθηκε: «Σε δυο ώρες θα φθάσουμε και θα κατεβούμε, ενώ οι καημένοι στην κόλαση ταλαιπωρούνται αιώνια. Ύστερα εκεί δεν έχει καφάσια, κόσμο κ.λπ., αλλά είναι κόλαση. Δόξα Σοι ο Θεός, εδώ είμαι καλύτερα».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Που οφείλεται, Γέροντα, η διαφορά εμπιστοσύνης λ.χ. δύο υποτακτικών προς τον Γέροντά τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στον λογισμό. Μπορεί κανείς να έχη χαλασμένο λογισμό για οτιδήποτε και για οποιονδήποτε. Αν ο άνθρωπος δεν έχη καλό λογισμό και δεν βγάζη τον εαυτό του από τις ενέργειές του – αν ενεργή δηλαδή με ιδιοτέλεια –, δεν βοηθιέται ούτε και από έναν Άγιο. Όχι άγιο Γέροντα ή αγία Γερόντισσα να έχη, όχι τον Άγιο Αντώνιο να είχε Γέροντα, αλλά και όλους τους Αγίους, δεν μπορεί να βοηθηθή. Ούτε ο ίδιος ο Θεός δεν μπορεί να βοηθήση έναν τέτοιον άνθρωπο, αν και το θέλη πολύ. Όταν κανείς αγαπάη τον εαυτό του, έχη δηλαδή φιλαυτία, όλα τα ερμηνεύει όπως τα αγαπάει ο εαυτός του. Και βλέπεις, άλλοι τα ερμηνεύουν αμαρτωλά, άλλοι όπως τους αναπαύει, και σιγά-σιγά γίνονται φυσιολογικές αυτές οι παράλογες ερμηνείες τους. Όπως και αν φερθής, σκανδαλίζονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι μερικοί πού, αν τους προσέξης λίγο, αν τους πής έναν καλό λόγο, πετούν. Αν δεν τους προσέξης, λυπούνται πολύ, πιάνουν τα άκρα, που είναι του πειρασμού. Βλέπουν λ.χ. μία κίνηση και λένε: «ά! έτσι θα έγινε», και ύστερα καταλήγουν να είναι σίγουροι ότι έτσι έγινε. Ή βλέπουν τον άλλον σοβαρό και νομίζουν ότι κάτι έχει μαζί τους, ενώ ο άλλος μπορεί να είναι σοβαρός, γιατί τον απασχολεί κάτι. Πρό ημερών ήρθε και σ᾿ εμένα κάποιος και μου είπε: «Γιατί παλιά μου μιλούσε ο τάδε και τώρα δεν μου μιλάει; Του είχα κάνει μια παρατήρηση, μήπως γι᾿ αυτό;». «Κοίταξε, του λέω, μπορεί να σε είδε και να μη σε πρόσεξε ή είχε κανέναν άρρωστο και είχε στον νού του να ψάξη για γιατρό ή να βρη συνάλλαγμα, για να πάη στο εξωτερικό κ.λπ.». Και πράγματι ο άλλος είχε άρρωστο άνθρωπο, είχε ένα σωρό φροντίδες, και αυτός είχε την απαίτηση να σταθή να του μιλήση και έβαζε ένα σωρό λογισμούς.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι καλοί λογισμοί φέρνουν την πνευματική υγεία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά είναι τα χαρακτηριστικά του αδύνατου λογισμού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί εννοείς; Πρώτη φορά το ακούω αυτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είχατε πεί, το να βάλη κανείς αριστερό λογισμό, να παρεξηγήση μια συμπεριφορά...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και το είπα αδύνατο λογισμό αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Θυμήθηκα εκείνον που ήθελε να μείνη κοντά σας ως υποτακτικός και του είπατε: «Δεν σε κρατώ, γιατί έχεις αδύνατο λογισμό».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν το είπα έτσι. «Δεν σε παίρνω, του είπα, για υποτακτικό, γιατί δεν έχεις υγεία πνευματική». «Τί θα πη υγεία πνευματική;», με ρωτάει. «Δεν έχεις καλούς λογισμούς, του λέω. Σαν άνθρωπος θα έχω τα κουσούρια μου, και σαν καλόγερος τόσα χρόνια θα έχω και μερικές αρετές. Αν δεν έχης καλό λογισμό, θα βλάπτεσαι και από τα κουσούρια μου και από τις αρετές μου». Για ένα μικρό παιδί μπορεί να πη κανείς ότι έχει αδύνατο λογισμό, γιατί είναι ακόμη ανώριμο, όχι όμως για έναν μεγάλο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όλοι οι μεγάλοι, Γέροντα, είναι ώριμοι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικοί από το κεφάλι τους δεν ωριμάζουν. Άλλο, αν δεν τους κόβη. Όταν κάποιος δεν κινήται απλά, ο λογισμός του πηγαίνει στο κακό και όλα τα παίρνει στραβά. Αυτός δεν έχει υγεία πνευματική και δεν βοηθιέται ούτε από το καλό· βασανίζεται και με το καλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δούμε, Γέροντα, μια αταξία, συμφέρει να ψάξουμε να βρούμε ποιός την έκανε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ψάξε πρώτα να δής μήπως την έκανες εσύ. Αυτό είναι πιο καλό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν όμως, Γέροντα, μου δίνουν αφορμές οι άλλοι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ πόσες αφορμές έδωσες; Αν το σκεφθής αυτό, θα καταλάβης ότι κάνεις λάθος αντιμετωπίζοντας έτσι τα πράγματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Και όταν λέμε: «αυτό μάλλον θα το έκανε η τάδε αδελφή», είναι και αυτό αριστερός λογισμός;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είσαι σίγουρη πώς το έκανε αυτή η αδελφή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, αλλά επειδή και άλλη φορά έκανε κάτι ανάλογο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πάλι αριστερός λογισμός είναι, αφού δεν είσαι σίγουρη.Ύστερα, ακόμη και αν το έκανε αυτή η αδελφή, ποιός ξέρει πώς και γιατί το έκανε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν όμως, Γέροντα, βλέπω λ.χ. ότι μια αδελφή έχει κάποιο πάθος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γερόντισσα είσαι; Η Γερόντισσα φέρει ευθύνη, γι᾿ αυτό πρέπει να εξετάζη τα πάθη σας. Εσείς όμως γιατί να εξετάζετε τα πάθη της άλλης; Ακόμη δεν έχετε μάθει να κάνετε δουλειά στον εαυτό σας. Αν θέλετε να κάνετε δουλειά στον εαυτό σας, να μην εξετάζετε τί κάνουν οι άλλοι γύρω σας, αλλά να φέρνετε καλούς λογισμούς και για τα καλά και για τα άσχημα που βλέπετε στους άλλους. Άσχετα με τί σκοπό κάνει κάτι ο άλλος, εσείς βάλτε έναν καλό λογισμό. Ο καλός λογισμός έχει μέσα αγάπη, αφοπλίζει τον άλλον και τον κάνει να σού φερθή καλά. Θυμάστε εκείνες τις καλόγριες που πέρασαν τον ληστή για αββά; Όταν αποκαλύφθηκε, νόμιζαν ότι κάνει τον δια Χριστόν σαλό και παριστάνει τον ληστή και άλλο τόσο τον είχαν σε ευλάβεια. Τελικά έσωσαν και αυτόν και τους συντρόφους του[6].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, μια αδελφή μου λέη κάποιο ψέμα...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Και αν αναγκάσθηκε εξ αιτίας σου να πη ένα ψέμα ή αν ξέχασε, και αυτό που σού είπε δεν είναι ψέμα; Ζητάει λ.χ. η αρχοντάρισσα από την μαγείρισσα σαλάτα και εκείνη της λέει «δέν έχω», ενώ η αρχοντάρισσα ξέρει ότι έχει. Αν η αρχοντάρισσα δεν έχη καλούς λογισμούς, θα πή: «ψέματα μου λέει». Αν όμως έχη καλούς λογισμούς, θα πή: «η καημένη, ξέχασε ότι είχε σαλάτα, γιατί είχε πολλή δουλειά», ή «τήν κράτησε για κάποια άλλη περίπτωση». Δεν έχεις πνευματική υγεία, γι᾿ αυτό σκέφτεσαι έτσι. Αν είχες πνευματική υγεία, θα έβλεπες και τα ακάθαρτα καθαρά. Όπως θα έβλεπες τα φρούτα, έτσι θα έβλεπες και την κοπριά, γιατί η κοπριά βοήθησε να γίνουν τα φρούτα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όποιος έχει καλούς λογισμούς, έχει πνευματική υγεία και το κακό το μετατρέπει σε καλό. Θυμάμαι στην Κατοχή, όσα παιδιά είχαν γερό οργανισμό, έτρωγαν με όρεξη ένα κομμάτι μπομπότα[7]και ήταν όλο υγεία. Ενώ κάτι πλουσιόπαιδα, παρόλο που έτρωγαν ψωμί με βούτυρο, επειδή δεν είχαν γερό οργανισμό, ήταν φιλάσθενα. Έτσι και στην πνευματική ζωή. Ένας, αν έχη καλούς λογισμούς, και να τον χτυπήσης άδικα, θα πή: «Το επέτρεψε ο Θεός, για να εξοφλήσω παλιά μου σφάλματα, δόξα τω Θεώ!». Ενώ ένας άλλος που δεν έχει καλούς λογισμούς, και να πάς να τον χαϊδέψης, θα νομίζη πώς πάς να τον χτυπήσης. Πάρτε παράδειγμα από έναν μεθυσμένο. Αν είναι κακός, τα σπάζει όλα επάνω στο μεθύσι. Αν είναι καλός, ή θα κλαίη ή θα συγχωράη. Ένας μεθυσμένος έλεγε: «Χαρίζω από έναν κουβά λίρες σε όποιον με φθονεί»!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος έχει καλούς λογισμούς, όλα καλά τα βλέπει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου είπαν μερικοί ότι σκανδαλίζονται, γιατί βλέπουν πολλά στραβά στην Εκκλησία, και εγώ τους είπα: Αν ρωτήσης μια μύγα: «έχει λουλούδια εδώ στην περιοχή;», θα πή: «δέν ξέρω· εκεί κάτω στον λάκκο έχει κονσερβοκούτια, κοπριές, ακαθαρσίες», και θα σού αραδιάση όλες τις βρωμιές στις οποίες πήγε. Αν όμως ρωτήσης μια μέλισσα: «είδες καμμιά ακαθαρσία εδώ στην περιοχή;», θα σού πή: «ακαθαρσία; όχι, δεν είδα πουθενά· εδώ ο τόπος είναι γεμάτος από ευωδιαστά λουλούδια» και θα σού αναφέρη ένα σωρό λουλούδια του κήπου, του αγρού κ.λπ. Βλέπεις, η μύγα ξέρει μόνον που υπάρχουν σκουπίδια, ενώ η μέλισσα ξέρει πώς εκεί πέρα είναι ένας κρίνος, πιο εκεί ένα ζουμπούλι...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όπως έχω καταλάβει, άλλοι άνθρωποι μοιάζουν με την μέλισσα και άλλοι με την μύγα. Αυτοί που μοιάζουν με την μύγα ψάχνουν σε κάθε περίπτωση να βρουν τί κακό υπάρχει και ασχολούνται μ᾿ αυτό· δεν βλέπουν πουθενά κανένα καλό. Αυτοί που μοιάζουν με την μέλισσα βρίσκουν παντού ό,τι καλό υπάρχει. Ο βλαμμένος άνθρωπος βλαμμένα σκέφτεται, όλα τα παίρνει αριστερά, όλα τα βλέπει ανάποδα. Ενώ, όποιος έχει καλούς λογισμούς, ό,τι και να δή, ό,τι και να του πής, θα βάλη καλό λογισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια φορά ένα παιδί δευτέρας γυμνασίου ήρθε στο Καλύβι και χτύπησε το σιδεράκι στην πόρτα. Είχα ένα τσουβάλι γράμματα να διαβάσω, αλλά είπα, ας βγώ να δώ τί θέλει. «Τί είναι, παλληκάρι;», του λέω. «Αυτό είναι το Καλύβι του πατρός Παϊσίου; με ρωτάει. Θέλω τον πατέρα Παΐσιο». «Αυτό είναι, αλλά αυτός δεν είναι εδώ· πήγε να αγοράση τσιγάρα», του λέω. «Φαίνεται κάποιον πήγε να εξυπηρετήση», μου λέει με καλό λογισμό. «Για τον εαυτό του πήγε να τα αγοράση, του λέω. Του είχαν τελειώσει και έκανε σαν τρελλός για τα τσιγάρα. Εμένα με άφησε εδώ μόνον μου και ούτε ξέρω πότε θα γυρίση. Αν δώ ότι αργεί, θα σηκωθώ να φύγω». Βούρκωσαν τα μάτια του και με καλό πάλι λογισμό είπε: «Τον κουράζουμε τον Γέροντα». «Τί τον θέλεις;», τον ρωτάω. «Την ευχή του θέλω να πάρω», μου λέει. «Τί ευχή να πάρης, μωρέ! Αυτός είναι πλανεμένος· δεν έχει χαΐρι· εγώ τον ξέρω καλά. Μήν περιμένης άδικα, γιατί, κι όταν γυρίση, θα είναι νευριασμένος, ίσως είναι και μεθυσμένος, επειδή πίνει κιόλας». Αλλά εκείνο έβαζε συνέχεια καλό λογισμό. «Τέλος πάντων, του λέω, εγώ θα περιμένω λίγο ακόμη, τί θέλεις να του πώ;». «Έχω ένα γράμμα να του δώσω, μου λέει, αλλά θα περιμένω να πάρω και την ευχή του». Είδατε; Ό,τι του έλεγα, το έπαιρνε με καλό λογισμό. Του είπα: «σάν τρελλός έκανε για τα τσιγάρα» και το καημένο αναστέναξε, βούρκωσαν τα μάτια του. «Ποιός ξέρει, είπε, κάποιον θα ήθελε να εξυπηρετήση». Άλλοι τόσα διαβάζουν, κι εκείνο, παιδάκι δευτέρας γυμνασίου, και να έχη τόσο καλούς λογισμούς! Να του χαλάς τον λογισμό και αυτό να φτιάχνη καλύτερο λογισμό και να βγάζη πιο καλό συμπέρασμα. Το θαύμασα! Πρώτη φορά είδα τέτοιο πράγμα!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Λογισμοί του αγιασμένου ανθρώπουκαί λογισμοί του πονηρού ανθρώπου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτός που έχει αγιότητα καταλαβαίνει ποιός είναι πονηρός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, τον πονηρό τον καταλαβαίνει, όπως καταλαβαίνει και την αγιότητα ενός Αγίου. Βλέπει το κακό, αλλά συγχρόνως βλέπει και τον εσωτερικό άνθρωπο και διακρίνει ότι το κακό είναι του πειρασμού και έρχεται απ᾿ έξω. Με τα μάτια της ψυχής του βλέπει τα δικά του σφάλματα μεγάλα, ενώ των άλλων μικρά. Τα βλέπει στ᾿ αλήθεια μικρά, όχι ψεύτικα. Μπορεί να βλέπη ότι είναι εγκλήματα, αλλά δικαιολογεί με την καλή έννοια τις πονηριές του κακού ανθρώπου· δεν τον περιφρονεί, δεν τον θεωρεί κατώτερό του. Μπορεί μάλιστα να τον θεωρή και καλύτερο από τον εαυτό του και να τον ανέχεται εν γνώσει του για πολλούς λόγους. Βλέπει λ.χ. την κακότητα ενός εγκληματία, αλλά σκέφτεται ότι εκείνος έφθασε στο σημείο να κάνη εγκλήματα, γιατί δεν βοηθήθηκε, και ότι θα μπορούσε και ο ίδιος να ήταν στην θέση του, αν δεν τον βοηθούσε ο Θεός. Έτσι δέχεται πολλή Χάρη. Αντίθετα, ο πονηρός άνθρωπος, ενώ βλέπει την αγιότητα του άλλου, δεν γνωρίζει τους καλούς λογισμούς που έχει, όπως ούτε ο διάβολος τους γνωρίζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος κάνει λεπτή εργασία, δικαιολογεί τον άλλον και όχι τον εαυτό του. Και όσο προχωρεί πνευματικά, τόσο ελευθερώνεται και τόσο αγαπά τον Θεό και τους ανθρώπους. Τότε δεν μπορεί να καταλάβη τί θα πη κακία, γιατί όλο καλούς λογισμούς έχει για τους άλλους και όλο αγνά σκέφτεται και τα βλέπει όλα πνευματικά, άγια. Ωφελείται ακόμη και από τις πτώσεις των συνανθρώπων του, τις οποίες χρησιμοποιεί για γερό φρένο στον εαυτό του, για να προσέχη να μην εκτροχιασθή. Αντίθετα, ένας που δεν έχει εξαγνισθή, σκέφτεται πονηρά και βλέπει όλα τα πράγματα πονηρά. Ακόμη και τα καλά τα μολύνει με την πονηρία του. Δεν ωφελείται ούτε και από τις αρετές των άλλων, γιατί είναι σκοτισμένος από την μαυρίλα του ανθρωποκτόνου, οπότε και αυτές τις ερμηνεύει με το πονηρό του λεξικό. Πάντα είναι στενοχωρημένος και πάντα στενοχωρεί τους συνανθρώπους του με την πνευματική του αυτή μαυρίλα. Αν θέλη να ελευθερωθή, πρέπει να καταλάβη ότι έχει ανάγκη από εξαγνισμό, για να έρθη και η διαύγεια η πνευματική, η κάθαρση του νού και της καρδιάς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, ο ίδιος άνθρωπος γίνεται πότε πονηρός και πότε καλός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε δέχεται ανάλογες επιδράσεις και αλλοιώσεις. Ο άνθρωπος είναι τρεπτός. Οι πονηροί λογισμοί άλλοτε είναι του πειρασμού και άλλοτε ο ίδιος ο άνθρωπος σκέφτεται πονηρά. Πολλές φορές δηλαδή ο πειρασμός δημιουργεί καταστάσεις, για να φέρνουν οι άνθρωποι κακούς λογισμούς. Έναν αρχιμανδρίτη, όταν ήρθε για πρώτη φορά στο Καλύβι, δεν πρόλαβα να τον δώ. Την δεύτερη φορά που ήρθε, δεν μπορούσα να τον δώ, επειδή ήμουν βαριά άρρωστος, και του είπα να έρθη μια άλλη φορά, για να συζητήσουμε. Τότε εκείνος μπήκε σε λογισμούς ότι δεν τον θέλω, ότι έχω κάτι μαζί του, και πήγε κάτω στο μοναστήρι και έκανε παράπονα. Αυτό όλο ήταν του πειρασμού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι λογισμοί του ανθρώπου δείχνουν την πνευματική του κατάσταση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς γίνεται το ίδιο πράγμα να το βλέπουν διαφορετικά δύο άνθρωποι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όλα τα μάτια βλέπουν το ίδιο καθαρά; Για να δη κανείς καθαρά, πρέπει να έχη τα μάτια της ψυχής του υγιέστατα, γιατί τότε έχει την εσωτερική καθαρότητα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, μερικές φορές, το ίδιο περιστατικό ένας το θεωρεί ευλογία και άλλος δυστυχία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καθένας το ερμηνεύει ανάλογα με τον λογισμό του. Το κάθε πράγμα μπορείς να το δής από την καλή του πλευρά ή από την κακή του πλευρά. Είχα ακούσει το εξής περιστατικό: Σε ένα μοναστήρι που βρισκόταν σε κατοικημένη περιοχή είχαν τυπικό να κάνουν εσπερινό και όρθρο τα μεσάνυχτα και πήγαιναν και κοσμικοί, γιατί το μοναστήρι ήταν περιτριγυρισμένο από σπίτια που σιγά-σιγά είχαν χτισθή εκεί κοντά. Μια φορά ένας αρχάριος νέος μοναχός ξέχασε το κελλί του ανοιχτό και μπήκε μέσα μια γυναίκα. Όταν το έμαθε, στενοχώρια, κακό! Ώ, μολύνθηκε το κελλί! Τρομερό, χάθηκε ο κόσμος! Παίρνει οινόπνευμα, ρίχνει στο πάτωμα και βάζει φωτιά, για να το απολυμάνη! Παραλίγο να κάψη το μοναστήρι. Το πάτωμα του κελλιού του το έκαψε, τον λογισμό του όμως δεν τον έκαψε. Εκείνον έπρεπε να κάψη, γιατί το κακό στον λογισμό του βρισκόταν. Αν έφερνε καλό λογισμό και έλεγε ότι η γυναίκα μπήκε στο κελλί από ευλάβεια, για να ωφεληθή, για να πάρη χάρη και να αγωνισθή και αυτή στο σπίτι της, θα αλλοιωνόταν πνευματικά και θα δόξαζε τον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Από την ποιότητα των λογισμών ενός ανθρώπου φαίνεται η πνευματική του κατάσταση. Οι άνθρωποι κρίνουν τα πράγματα ανάλογα με το περιεχόμενο που έχουν μέσα τους. Αν δεν έχουν πνευματικό περιεχόμενο, βγάζουν λάθος συμπεράσματα και αδικούν τον άλλον. Αν λ.χ. δη κάποιον αργά το βράδυ έξω ένας που κάνει ελεημοσύνες την νύχτα, για να μην τον βλέπουν, ποτέ δεν θα βάλη κακό λογισμό. Αν τον δη όμως κάποιος που ξενυχτάει στην αμαρτία, θα πή: «τό τέρας, ποιός ξέρει που ξενυχτούσε», γιατί τέτοιες εμπειρίες έχει. Ή, αν ακούγωνται την νύχτα από τον επάνω όροφο ντούκ-ντούκ, ένας που έχει καλούς λογισμούς θα πή: «μετάνοιες κάνει», ενώ ένας που δεν έχει καλούς λογισμούς θα πή: «όλη την νύχτα χορεύει». Αν ακούγεται μελωδία, ο ένας θα πή: «τί ωραίες ψαλμωδίες», ενώ ο άλλος θα πή: «τί τραγούδια είναι αυτά;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάστε πώς αντιμετώπισαν τον Χριστό οι δύο ληστές που είχαν σταυρωθή μαζί Του; Και οι δύο έβλεπαν τον Χριστό επάνω στον Σταυρό, την γη να σείεται κ.λπ. Τί λογισμό όμως έβαλε ο ένας και τί ο άλλος! Ο ένας, ο εξ ευωνύμων, βλασφημούσε και έλεγε: «Ει συ εί ο Χριστός, σώσον σεαυτόν και ημάς»[8]. Ο άλλος, ο εκ δεξιών, έλεγε: «Ημείς μεν άξια ών επράξαμεν απολαμβάνομεν· ούτος δε ουδέν άτοπον έπραξε»[9]. Ο ένας σώθηκε, ο άλλος κολάσθηκε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Οι βλάσφημοι λογισμοί
- type: h2
  initial:
    ru: ''
  text:
    ru: Ποιοί λογισμοί είναι βλάσφημοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, δεν έχω καταλάβει πότε ένας λογισμός είναι βλάσφημος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν μας έρχωνται στον νού άσχημες εικόνες για τον Χριστό, για την Παναγία, για τους Αγίους ή για κάτι θείο και ιερό, ή ακόμη για τον πνευματικό μας Πατέρα κ.λπ., αυτά είναι βλάσφημοι λογισμοί. Αυτούς τους λογισμούς δεν πρέπει να τους λέη κιόλας κανείς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ούτε στον πνευματικό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Στον πνευματικό αν πούμε: «μού περνούν βλάσφημοι λογισμοί για τον Χριστό ή για το Άγιο Πνεύμα ή για την Παναγία ή για τους Αγίους ή για σένα τον πνευματικό μου», αυτό αρκεί. Αυτές οι βλασφημίες και οι αμαρτίες είναι όλες του διαβόλου· δεν είναι δικές μας. Γι᾿ αυτό δεν χρειάζεται να στενοχωριώμαστε και για τις αμαρτίες του διαβόλου. Όταν ήμουν αρχάριος μοναχός, ένα διάστημα μου έφερνε ο διάβολος, ακόμη και μέσα στην εκκλησία, βλάσφημους λογισμούς και στενοχωριόμουν πολύ. Ό,τι άκουγα να λένε οι άλλοι, όταν ήμουν στρατιώτης, βρισιές κ.λπ., τα έφερνε ο διάβολος στον νού μου για τους Αγίους. Μου έλεγε ο πνευματικός: «Αυτοί οι λογισμοί είναι του διαβόλου. Από την στιγμή που στενοχωριέται ο άνθρωπος για τους άσχημους λογισμούς που περνάνε από το μυαλό του για τα ιερά πράγματα, αυτό είναι απόδειξη ότι δεν είναι δικοί του, αλλά έρχονται απ᾿ έξω». Εγώ πάλι στενοχωριόμουν. Έφευγα, πήγαινα στο παρεκκλήσι του Τιμίου Προδρόμου να προσευχηθώ, και ευωδίαζε η εικόνα του, όταν προσκυνούσα. Όταν μου έρχονταν πάλι τέτοιοι λογισμοί, ξαναπήγαινα στο παρεκκλήσι, πάλι ερχόταν μία ευωδία από την εικόνα! Μια μέρα την ώρα της Θείας Λειτουργίας, στο Τρισάγιο, έψελνα κι εγώ σιγανά το «Άγιος ο Θεός» του Νηλέως[10]. Τότε βλέπω να μπαίνη από την πόρτα της Λιτής[11]ένα θηρίο μεγάλο, φοβερό, με σκυλήσιο κεφάλι. Πετούσε φλόγες από το στόμα και από τα μάτια του! Γυρίζει και μου δίνει δυο μούτζες, γιατί έψαλλα το «Άγιος ο Θεός»! Κοιτάζω δίπλα μου, μήπως το είδε και κάποιος άλλος, κανείς δεν το είχε δεί. Μετά είπα στον πνευματικό: «αυτό και αυτό συνέβη». «Νά, τον είδες; μου είπε ο πνευματικός, αυτός είναι. Τώρα ησύχασες;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο άνθρωπος, Γέροντα, καταλαβαίνει πάντοτε αν ένας λογισμός είναι βλάσφημος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν το μυαλό που του έδωσε ο Θεός το δουλεύη, τότε καταλαβαίνει. Π.χ. μου λένε μερικοί: «Γέροντα, πώς είναι δυνατόν να υπάρχη κόλαση; Εμείς στενοχωριόμαστε να υπάρχη άνθρωπος στην φυλακή, πόσο μάλλον στην κόλαση». Αυτό όμως είναι βλασφημία, γιατί έτσι παρουσιάζονται ότι είναι πιο δίκαιοι από τον Θεό. Ο Θεός ξέρει τί κάνει. Θυμάστε ένα περιστατικό που αναφέρει ο Άγιος Γρηγόριος ο Διάλογος; Κάποτε ο επίσκοπος Φουρτουνάτος έδιωξε ένα δαιμόνιο από μια δαιμονισμένη. Το δαιμόνιο μετά γύριζε μέσα στην πόλη σαν ένας φτωχός άνθρωπος και κατηγορούσε τον επίσκοπο. «Ο άσπλαχνος με έδιωξε», φώναζε. «Βρέ, να πάρη η ευχή, του λέει κάποιος, γιατί σε έδιωξε; Πώς το έκανε αυτό; Πέρνα μέσα στο δικό μου σπίτι». Πέρασε μέσα ο διάβολος. Σε λίγο του λέει: «Κρυώνω· ρίξε ξύλα στο τζάκι». Ρίχνει εκείνος ξύλα στο τζάκι, βάζει κούτσουρα, δώσ᾿ του φωτιά. Και τελικά, αφού έγινε καλό καμίνι, μπαίνει ο διάβολος στο παιδί του και το καημένο δαιμονίσθηκε και πήδηξε στην φωτιά και κάηκε. Τότε κατάλαβε εκείνος τί έδιωξε ο επίσκοπος και τί δέχτηκε αυτός. Για να τον διώξη ο επίσκοπος Φουρτουνάτος, κάτι ήξερε[12].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Από που προέρχονται οι βλάσφημοι λογισμοί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, να μας λέγατε κάτι για την καλή αδιαφορία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η καλή αδιαφορία χρειάζεται σε έναν υπερευαίσθητο που τον ταλαιπωρεί το ταγκαλάκι[13]με διάφορους λογισμούς. Τότε καλό είναι να γίνη λίγο αναίσθητος, με την καλή έννοια, και να μη λεπτολογή μερικά πράγματα. Ή, ακόμη, χρειάζεται για κάποιον που μπορεί σε πολλά να είναι αδιάφορος, αλλά σε κάτι να του έχη δημιουργήσει ο πειρασμός μια υπερευαισθησία, για να τον αχρηστέψη. Τότε για ένα διάστημα θα τον βοηθήση η καλή αδιαφορία. Θέλει όμως παρακολούθηση. Πρέπει να λέη τον λογισμό του και να παρακολουθήται από τον πνευματικό, αλλιώς μπορεί σιγά-σιγά να τα πάρη όλα σβάρνα και να φθάση στην άλλη άκρη, να γίνη τελείως αδιάφορος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί, όταν πέφτω στην λύπη, έχω βλάσφημους λογισμούς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε να δής τί γίνεται. Όταν το ταγκαλάκι σε βλέπη λυπημένη, το εκμεταλλεύεται και σού δίνει μια κοσμική καραμέλα, έναν αμαρτωλό λογισμό. Αφού πέσης την πρώτη φορά, μετά σε οδηγεί σε μεγαλύτερη στενοχώρια και δεν έχεις την δύναμη να αντιδράσης. Γι᾿ αυτό δεν πρέπει να μένης ποτέ σε κατάσταση λύπης, αλλά να κάνης κάτι πνευματικό που θα σε βοηθήση να βγής από αυτήν την κατάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολύ παιδεύομαι με κάτι λογισμούς...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι του πειρασμού. Ειρήνευε και μην τους ακούς. Εσύ είσαι ευαίσθητη. Ο διάβολος εκμεταλλεύεται την ευαισθησία σου, σε κάνει να λεπτολογής μερικά πράγματα, κολλάει το μυαλό σου εκεί και βασανίζεσαι άδικα. Μπορεί να σού φέρη άσχημους λογισμούς λ.χ. για την Γερόντισσα ή και για μένα τον ίδιο. Μήν τους δίνης σημασία. Ένας βλάσφημος λογισμός, αν του δώσης λίγη σημασία, μπορεί να σε ταλαιπωρήση, να σε τσακίση. Σού χρειάζεται λίγη καλή αδιαφορία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Με βλάσφημους λογισμούς βασανίζει ο διάβολος συνήθως τους πολύ ευλαβείς και πολύ ευαίσθητους. Μεγαλοποιεί την πτώση τους, για να τους θλίβη, και εάν δεν κατορθώση να τους φέρη σε απόγνωση, ώστε να αυτοκτονήσουν, προσπαθεί τουλάχιστον να τους τρελλάνη και να τους αχρηστέψη. Και εάν δεν μπορέση να κάνη ούτε και αυτό, τον ευχαριστεί να τους φέρη έστω μία μελαγχολία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είχα συναντήσει κάποιον που συνέχεια έφτυνε. Μου λένε: «Δαιμόνιο έχει». «Δεν κάνουν έτσι, τους λέω, όταν έχουν δαιμόνιο». Όπως διαπίστωσα μετά, αυτός ο καημένος δεν είχε φταίξει σε τίποτε, ώστε να δαιμονισθή.  Είχε μεγαλώσει ορφανός και είχε μια ευαισθησία· είχε και αριστερό λογισμό και λίγη φαντασία, που τα καλλιέργησε ο διάβολος και του έφερνε βλάσφημους λογισμούς. Όταν λοιπόν του έφερνε ο διάβολος τέτοιους λογισμούς, αυτός αντιδρούσε, τιναζόταν, έφτυνε τους βλάσφημους λογισμούς. Ο άλλος που έβλεπε αυτήν την σκηνή νόμιζε ότι είχε δαιμόνιο. Να έχη ο καημένος μια ευαισθησία, να φτύνη τους βλάσφημους λογισμούς και να του λένε: «Έχεις δαιμόνιο»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι βλάσφημοι λογισμοί έρχονται πολλές φορές και από φθόνο του διαβόλου. Καμμιά φορά μάλιστα μετά από αγρυπνία, όταν κανείς είναι πτώμα από την κούραση και δεν μπορή να αντιδράση, του φέρνει ο κακούργος διάβολος βλάσφημους λογισμούς και έπειτα, για να τον μπλέξη ή για να τον ρίξη στην απόγνωση, αρχίζει να του λέη: «Τέτοιους λογισμούς ούτε ο διάβολος δεν φέρνει! Τώρα δεν θα σωθής...». Ακόμη και για το Πανάγιο Πνεύμα μπορεί να του φέρη βλάσφημους λογισμούς και μετά να του πη ότι αυτή η αμαρτία δεν συγχωρείται κ.λπ.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί να έρθη εξ αιτίας μας ένας βλάσφημος λογισμός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, μπορεί και ο ίδιος ο άνθρωπος να δώση αφορμή. Όταν δεν υπάρχη ευαισθησία, οι βλάσφημοι λογισμοί είναι από υπερηφάνεια, από κατάκριση κ.λπ. Γι᾿ υτό, όταν κάνετε άσκηση και έχετε λογισμούς απιστίας, βλάσφημους, να ξέρετε ότι η άσκηση γίνεται με υπερηφάνεια. Σκοτίζεται ο νούς από την υπερηφάνεια, αρχίζει η απιστία, και απογυμνώνεται ο άνθρωπος από την Χάρη του Θεού. Ή όταν κανείς ασχολήται με δογματικά θέματα, χωρίς να έχη τέτοιες προϋποθέσεις, μετά έχει βλάσφημους λογισμούς.
- type: h2
  initial:
    ru: ''
  text:
    ru: Περιφρόνηση στους βλάσφημους λογισμούς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο Αββάς Ισαάκ λέει ότι νικάμε τα πάθη «διά της ταπεινώσεως, και όχι δια της περιφρονήσεως»[14]. Η περιφρόνηση ενός πάθους και η περιφρόνηση των βλάσφημων λογισμών είναι το ίδιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, η περιφρόνηση ενός πάθους έχει υπερηφάνεια, αυτοπεποίθηση καί, το χειρότερο, δικαιολογία. Δικαιολογείς δηλαδή τον εαυτό σου και δεν δέχεσαι το πάθος σου. Είναι σαν να λές: «δέν είναι δικό μου αυτό το πάθος, δεν έχει σχέση μ᾿ εμένα», και δεν αγωνίζεσαι να απαλλαγής από αυτό. Τους βλάσφημους λογισμούς όμως πρέπει να τους περιφρονούμε, γιατί, όπως είπα, δεν είναι δικοί μας, αλλά του διαβόλου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν υποκρίνεται κανείς μπροστά στους άλλους ότι έχει ένα πάθος, π.χ. όταν κάνη τον γαστρίμαργο, εμπαίζει τον διάβολο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε υποκρίνεται με την καλή υποκρισία· δεν είναι ότι εμπαίζει τον διάβολο. Εμπαίζεις τον διάβολο, όταν σού φέρνη βλάσφημους λογισμούς κι εσύ ψάλλεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς να διώξω έναν βλάσφημο λογισμό την ώρα της ακολουθίας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την ψαλτική. «Ανοίξω το στόμα μου...»[15]. Δεν ξέρεις μουσικά; Να μην τον ξεσκαλίζης. Περιφρόνησέ τον. Όταν συζητάη κανείς τέτοιους λογισμούς την ώρα της προσευχής, είναι σαν να ξεσκαλίζη ο στρατιώτης μια χειροβομβίδα την ώρα που δίνει αναφορά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και αν επιμένη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν επιμένη, να ξέρης ότι κάπου μέσα σου έχει ένα στέκι. Τέλεια λύση: η περιφρόνηση στον διάβολο, διότι αυτός κάνει το φροντιστήριο της πονηριάς. Καλύτερα εκείνη την ώρα να μη λέμε ούτε την ευχή, γιατί δείχνουμε ότι μας απασχολεί το θέμα, και ο διάβολος στοχεύει στο αδύνατο σημείο και μας βομβαρδίζει συνέχεια με βλάσφημους λογισμούς. Καλύτερα να ψέλνουμε. Βλέπεις, και τα μικρά παιδιά, όταν θέλουν να περιφρονήσουν κάποιο παιδί που τα μιλάει, λένε «τραλαλά», τραγουδάνε. Το ίδιο να κάνουμε και εμείς στον διάβολο. Θα ψέλνουμε όμως, δεν θα τραγουδάμε. Η ψαλμωδία είναι προσευχή στον Θεό, αλλά και περιφρόνηση στον διάβολο. Οπότε, την τρώει και από ᾿δώ ο πονηρός, την τρώει και από ᾿κεί, και θα σκάση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν είμαι έτσι, Γέροντα, δεν μπορώ να ψάλλω, δυσκολεύομαι ακόμη και να πάω να κοινωνήσω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό είναι πολύ επικίνδυνο! Σού κάνει αποκλεισμό το ταγκαλάκι! Να πηγαίνης να ψάλλης, να κοινωνάς, γιατί δεν είναι δικοί σου αυτοί οι λογισμοί. Μόνο σ᾿ αυτό να μου κάνης υπακοή· να ψάλλης ένα «Άξιόν εστιν», για να πάρη τα ναύλα του το ταγκαλάκι και να φύγη. Δεν σού είχα πει για ένα καλογέρι; Είχε έρθει δώδεκα χρόνων στο Άγιον Όρος. Ήταν ορφανό, είχε χάσει την στοργή από την σαρκική του μάνα και είχε δώσει όλη του την αγάπη στην Παναγία. Την αισθανόταν σαν μάνα του. Να έβλεπες με τί ευλάβεια προσκυνούσε τις εικόνες! Ύστερα ο πειρασμός εκμεταλλεύτηκε αυτήν την αγάπη και του έφερε βλάσφημους λογισμούς. Το καημένο δεν πήγαινε ούτε να προσκυνήση τις εικόνες. Το έμαθε ο Γέροντάς του, το πήρε από το χέρι και το έβαλε να ασπασθή την εικόνα της Παναγίας και του Χριστού στο πρόσωπο, στα χέρια, και αμέσως ο διάβολος έφυγε. Είναι κατά κάποιον τρόπο αναίδεια να ασπασθής στο πρόσωπο την Παναγία και τον Χριστό, αλλά αυτό το έκανε ο Γέροντας, για να διώξη τους λογισμούς που είχε το καλογέρι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πότε φταίμε για τους βλάσφημους λογισμούς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν έχω προσβολή βλάσφημου λογισμού χωρίς συγκατάθεση δική μου, φταίω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν στενοχωρεθής και δεν τον δεχθής, δεν είναι τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε φταίει κανείς για έναν βλάσφημο λογισμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν στενοχωριέται που έχει τέτοιον λογισμό και κάθεται και τον συζητάη, τότε φταίει. Και όσο θα δέχεται τους βλάσφημους λογισμούς, τόσο θα δέχεται την ταραχή του διαβόλου. Γιατί, όταν του περνά ένας βλάσφημος λογισμός και τον εξετάζη και τον συζητάη με το μυαλό του, δέχεται έναν μικρό δαιμονισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς θα φύγουν, Γέροντα, τέτοιοι λογισμοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν στενοχωριέται κάποιος, όταν του έρχωνται τέτοιοι λογισμοί και δεν τους συζητάη, θα κόβωνται μόνοι τους, γιατί δεν θα τροφοδοτούνται. Δένδρο που δεν ποτίζεται, θα ξεραθή. Από την στιγμή όμως που κάποιος ευχαριστηθή μ᾿ αυτούς, έστω και λίγο, τους τρέφει, ποτίζεται ο παλαιός άνθρωπος και δύσκολα θα ξεραθούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές δέχομαι τους βλάσφημους λογισμούς, συγκατατίθεμαι, και μετά το καταλαβαίνω, αλλά δεν μπορώ να τους διώξω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσύ ξέρεις τί παθαίνεις; Κάποια στιγμή έχεις αλλού τον νού σου, είσαι αφηρημένη και χαζεύεις με ανοιχτό το στόμα. Έρχεται τότε το ταγκαλάκι, σού ρίχνει μέσα μια καραμέλα κι εσύ αρχίζεις να την πιπιλίζης. Νιώθεις την γεύση της και μετά δυσκολεύεσαι να την πετάξης. Πρέπει, μόλις σε γλυκάνη λίγο, αμέσως να την πετάξης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, περνάη ένας βλάσφημος λογισμός, τον δέχωμαι λίγο και μετά τον διώχνω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε είναι σαν να σού έδωσε ο διάβολος μια καραμέλα, την πιπίλισες λίγο και μετά την έφτυσες. Πρέπει να την φτύσης αμέσως. Διαφορετικά, στην αρχή θα σε ξεγελάη με μια καραμέλα και ύστερα θα σε ποτίζη φαρμάκι και θα σε κοροϊδεύη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 3 – Η εμπιστοσύνη στον λογισμό
- type: h2
  initial:
    ru: ''
  text:
    ru: Η εμπιστοσύνη στον λογισμόείναι αρχή πλάνης
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, όταν θυμώνω, γίνομαι σαν χείμαρρος· δεν μπορώ να συγκρατηθώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί να μην μπορής να συγκρατηθής;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί πιστεύω στον λογισμό μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, τότε έχεις δικό σου πιστεύω, δικό σου σύμβολο πίστεως!... Ο εγωισμός φταίει. Να μη δικαιολογής τον λογισμό σου. Έναν μπανταλό[16]λογισμό, μόνη σου να τον πετάς, να μην τον δέχεσαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς θα καταλάβω ότι ένας λογισμός είναι μπανταλός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, αν δεν καταλαβαίνης, να τον λές στην Γερόντισσα καί, τάκ, να τον πετάς, κάνοντας υπακοή σε ό,τι σού πή. Το να εμπιστεύεται ένας πνευματικός άνθρωπος στον λογισμό του είναι αρχή πλάνης. Σκοτίζεται το μυαλό του από την υπερηφάνεια και μπορεί να πλανηθή. Καλύτερα να τρελλαθή, γιατί τότε θα έχη ελαφρυντικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν χωράει βοήθεια, Γέροντα, από τους άλλους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να βοηθηθή, στην κατάσταση που βρίσκεται, πρέπει και ο ίδιος να βοηθήση. Να καταλάβη ότι το να πιστεύη στον λογισμό που του λέει λ.χ. πώς είναι ο καλύτερος από όλους, ότι είναι άγιος κ.λπ., αυτό είναι πλάνη. Ούτε με το πυροβόλο δεν φεύγει αυτός ο λογισμός, αν ο ίδιος τον κρατάη. Πρέπει να ταπεινωθή, για να φύγη. Μερικές φορές μου ζητούν να προσευχηθώ για τέτοιες περιπτώσεις. Τί προσευχή να κάνω; Αφού εκείνος έχει μέσα του το φιτίλι του διαβόλου, πάλι θα τιναχθή. Σαν να κρατάη κάποιος στα χέρια του φιτίλια από φουρνέλα και ζητάη να τον βοηθήσης, για να μην ανατιναχθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχω γίνει στρυφνή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιός το λέει; Ο λογισμός σου; Εγώ σε παρακολουθώ από το Άγιον Όρος. Έχω τον νού μου. Δεν έγινες στρυφνή. Αν όμως πιστέψης στον λογισμό σου, τότε θα σού στρίψη. Μήν πιστεύης στον λογισμό σου, ούτε αν σού λέη ότι είσαι χάλια ούτε αν σού λέη ότι είσαι αγία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η εμπιστοσύνη στον λογισμό δημιουργεί ψυχολογικά προβλήματα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος έχη τον λογισμό ότι όλοι ασχολούνται μ᾿ αυτόν κ.λπ., πώς θα τον διώξη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό είναι του πειρασμού που πάει να τον αρρωστήση. Να αδιαφορήση, να μην πιστεύη καθόλου σ᾿ αυτόν τον λογισμό. Ένας λ.χ. που έχει καχυποψία, αν δη έναν γνωστό του να μιλάη σιγά σε έναν άλλον, σκέφτεται: «γιά μένα λέει· δεν το περίμενα απ᾿ αυτόν!», ενώ εκείνοι για άλλο θέμα συζητούν. Και αν δεν προσέξη, εξελίσσεται σιγά-σιγά και που φθάνει! Νομίζει ότι τον παρακολουθούν, ότι τον καταδιώκουν. Ακόμη και αν έχη συγκεκριμένα στοιχεία ότι οι άλλοι ασχολούνται μ᾿ αυτόν, να ξέρη ότι και αυτά ο ίδιος ο εχθρός τα έχει ταιριάξει έτσι, για να τον πείση. Και πώς τα συνδυάζει ο διάβολος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γνωρίζω έναν νέο πού, ενώ είναι εξυπνότατος, πιστεύει στον λογισμό του που του λέει ότι δεν είναι ισορροπημένος. Με το να δέχεται τους λογισμούς που του φέρνει το ταγκαλάκι, του έχουν δημιουργηθή ένα σωρό κόμπλεξ. Έκανε απόπειρα αυτοκτονίας, έχει λειώσει τους γονείς του. Ο Θεός του έδωσε δυνάμεις και χαρίσματα, αλλά όλα του τα αχρηστεύει ο εχθρός, και έτσι βασανίζεται και αυτός και οι άλλοι. Δεν μπορώ να καταλάβω γιατί τους δέχονται αυτούς τους ταγκαλακίστικους λογισμούς και κάνουν την ζωή τους βασανισμένη, τα βάζουν και με τον Θεό, που τόσο πολύ μας ευεργετεί και μας αγαπάει. Όσα και εάν πής σε έναν τέτοιον άνθρωπο, δεν ωφελεί. Εάν δεν πάψη να πιστεύη τους λογισμούς που του φέρνει ο εχθρός, μόνον που θα κουράζεσαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο ευαίσθητος είναι ψυχικά αδύνατος, είναι άρρωστος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, το φιλότιμο και η ευαισθησία είναι φυσικά χαρίσματα, αλλά κατορθώνει δυστυχώς ο διάβολος να τα εκμεταλλεύεται. Έναν ευαίσθητο άνθρωπο τον κάνει συχνά να μεγαλοποιή τα πράγματα, για να μην μπορή να σηκώση κάποια δυσκολία ή να την σηκώνη για λίγο και μετά να κάμπτεται, να απογοητεύεται, να ταλαιπωρήται, και τελικά να σακατεύεται. Αν αξιοποιήση την κληρονομική ευαισθησία, θα γίνη ουράνια. Αν αφήση να την εκμεταλλευθή ο διάβολος, θα πάη χαμένη. Γιατί, αν δεν αξιοποιή ο άνθρωπος τα χαρίσματά του, τα εκμεταλλεύεται ο διάβολος. Έτσι πετάει τα δώρα του Θεού. Αντί να ευγνωμονή τον Θεό, τα παίρνει όλα ανάποδα. Ο ευαίσθητος, όταν πιστεύη στον λογισμό του, μπορεί να καταλήξη ακόμη και στο ψυχιατρείο, ενώ ο αδιάφορος με το «δέν βαριέσαι» δεν πάει βέβαια καλά, αλλά τουλάχιστον δεν καταλήγει και στο ψυχιατρείο. Γι᾿ αυτό το ταγκαλάκι κυνηγάει τους ευαίσθητους ανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άλλοι πάλι βάζουν έναν λογισμό, ή μάλλον το ταγκαλάκι τους φέρνει έναν λογισμό, ότι έχουν κληρονομική επιβάρυνση, και προσπαθεί να τους πείση να πιστέψουν ότι κάτι έχουν. Τους φοβίζει, για να τους ζαλίση και να τους αχρηστέψη στα καλά καθούμενα. Αλλά και κάτι κληρονομικό αν υπάρχη, μπροστά στην Χάρη του Θεού τίποτε δεν μπορεί να σταθή. Θυμάστε  τον Άγιο Κυπριανό[17]που από μάγος έγινε Ιεράρχης της Εκκλησίας και Μάρτυς Χριστού; Ο Μωυσής πάλι ο Αιθίοπας[18]από ληστής έγινε πιο ευαίσθητος από πολλούς μεγάλους Πατέρες. Σε τί κατάσταση έφθασε! Όταν πήγε να τον δη ο Άγιος Μακάριος, τον ρώτησε: «Τί να κάνω; με ενοχλεί ο κόσμος και δεν μπορώ να βρώ ησυχία». Και εκείνος του είπε: «Μωυσή, Μωυσή, είσαι πολύ ευαίσθητος. Να πάς στην Πετραία Αραβία[19], γιατί δεν μπορείς εσύ να διώξης τον κόσμο!»[20]. Πέρασε στην ευαισθησία και τον Μέγα Αρσένιο που ήταν από αρχοντική οικογένεια, μορφωμένος, καλλιεργημένος άνθρωπος, ενώ εκείνος ήταν ένας ληστής. Νά, βλέπεις η Χάρις του Θεού τί κάνει! Αλλά είχε πολλή ταπείνωση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι ιδιοτροπίες ξεκινούν από τον λογισμό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτός που σιχαίνεται, γιατί το παθαίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πές μου, εσύ τί σιχαίνεσαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όλα τα σιχαίνομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε όλα σ᾿ εσένα θα έρχωνται! Και τα σκουλήκια στα φρούτα ή στα όσπρια και καμμιά τρίχα στο ψωμί κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έτσι γίνεται, Γέροντα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δόξα Σοι ο Θεός! Βλέπεις πόσο σε βοηθάει ο Θεός για να το ξεπεράσης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από τον λογισμό δεν ξεκινάει, Γέροντα, αυτό; Ας πούμε ότι βρήκε η αδελφή μια τρίχα. Ας την βγάλη στην άκρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό είναι ευλογία! Δώσ᾿ την σ᾿ εμένα, να την πάρω εγώ ευλογία!... Άχ! Θυμάμαι, μια φορά στο Σινά πηγαίναμε κάπου με έναν μοναχό και του έδωσα δυο ροδάκινα. Τον βλέπω, δεν τα τρώει. Ήθελε να πάη να τα πλύνη, για να τα φάη, και τα κρατούσε στα χέρια, μην τα βάλη στην τσέπη και κολλήσουν μικρόβια και από την τσέπη! Ο αδελφός του που είχε οκτώ παιδιά μου έλεγε: «Περισσότερο σαπούνι ξοδεύει αυτός, για να πλύνη τα χέρια του, παρά η γυναίκα μου με τα οκτώ παιδιά που πλένει!». Και να δήτε τί έπαθε! Εκεί στο Σινά έδιναν σε κάθε καλόγερο και έναν Βεδουΐνο, για να τον εξυπηρετή, να του πηγαίνη το φαγητό κ.λπ. Ο Βεδουΐνος που έδωσαν σ᾿ αυτόν ήταν ο πιο βρώμικος απ᾿ όλους. Κατάμαυρος! Μύριζαν τα ρούχα του, μύριζε ολόκληρος. Μια εβδομάδα έπρεπε να τον βάλης στο μουσκιό, για να καθαρίση! Τα χέρια του ήταν..., μην τα ρωτάς! Έπρεπε να τα ξύσης με την σπάτουλα! Εν τω μεταξύ, όταν έπιανε το τσανάκι, για να του πάη το φαγητό, έβαζε τα δυο του δάχτυλα μέσα. «Φύγε, φύγε...», του φώναζε εκείνος, μόλις τον έβλεπε. Τελικά αυτός ο μοναχός ούτε δυο εβδομάδες δεν κάθησε στο Σινά· έφυγε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάμαι, και στο Κοινόβιο είχαμε έναν μοναχό που ως λαϊκός ήταν νωματάρχης. Τον είχαν βάλει διαβαστή, γιατί ήταν μορφωμένος. Τόσα χρόνια ήταν στο μοναστήρι και σιχαινόταν. Που να αγγίξη πόμολο! Με το πόδι άνοιγε την πόρτα ή σκουντούσε το μάνταλο με τον αγκώνα και μετά καθάριζε με οινόπνευμα το μανίκι που το ακούμπησε! Ακόμη και την πόρτα της εκκλησίας με το πόδι την άνοιγε. Και επέτρεψε ο Θεός, όταν γέρασε, να σκουληκιάσουν τα πόδια του, ιδίως το ένα με το οποίο άνοιγε τις πόρτες. Ήμουν παρανοσοκόμος, όταν ήρθε για πρώτη φορά στο νοσοκομείο της Μονής με δεμένο το πόδι. Μου είπε ο νοσοκόμος να το λύσω και εκείνος πήγε να φέρη κάτι γάζες. Όταν το άνοιξα, τί να δώ! Πώ, πώ, ήταν γεμάτο σκουλήκια! «Πήγαινε στην θάλασσα, του λέω, πλύν᾿ το, να φύγουν τα σκουλήκια, και έλα να κάνουμε αλλαγή». Που είχε φθάσει! Τί τιμωρία! Εγώ τα έχασα. Μου λέει ο νοσοκόμος: «Κατάλαβες από τί είναι αυτό;». «Κατάλαβα, του λέω, επειδή ανοίγει την πόρτα με το πόδι!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και σ᾿ αυτήν την κατάσταση, Γέροντα, συνέχιζε να ανοίγη την πόρτα με το πόδι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, με το πόδι! Και είχε γεράσει καλόγερος!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν το κατάλαβε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ξέρω. Μετά πήγα στην Μονή Στομίου στην Κόνιτσα. Τί θάνατο είχε ποιός ξέρει! Και έβλεπες, εκεί στο Κοινόβιο μερικοί νέοι μοναχοί πήγαιναν και έτρωγαν από το περίσσευμα που άφηναν στα πιάτα τους τα γεροντάκια, για να πάρουν ευλογία! Μάζευαν τα περισσεύματα των κλασμάτων. Ή άλλοι ασπάζονταν το πόμολο, γιατί το ακούμπησαν οι Πατέρες, και αυτός, όταν προσκυνούσε τις εικόνες, μόλις που ακουμπούσε το μουστάκι του στην εικόνα. Και το μουστάκι τί θα τραβούσε μετά με το οινόπνευμα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, κάτι τέτοιο γίνεται σε ιερά πράγματα, δεν είναι ανευλάβεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά από ᾿κεί ξεκινάει κανείς και φθάνει πιο πέρα. Έφθασε στο σημείο να μην προσκυνάη, γιατί φοβόταν μήπως εκείνος που προσκύνησε πριν από αυτόν την εικόνα είχε καμμιά αρρώστια!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, για να μη σιχαίνεται κανείς, δεν πρέπει να δίνη σημασία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τις σαβούρες που τρώνε οι άνθρωποι δεν τις βλέπουν! Άμα κάνη κανείς τον σταυρό του, είτε φοβία έχει είτε νοσοφοβία, βοηθάει μετά ο Χριστός. Εκεί στο Καλύβι πόσοι περνάνε που έχουν διάφορες αρρώστιες! Και μερικοί απλοί κάνουν τον σταυρό τους, οι καημένοι, παίρνουν το κύπελλο που έχω εκεί και πίνουν νερό. Οι άλλοι που φοβούνται δεν το αγγίζουν. Ήρθε πριν από λίγες μέρες κάποιος που είχε πολύ μεγάλη θέση σε κάποια υπηρεσία. Τόσο φοβάται ο καημένος τα μικρόβια, που έχει ασπρίσει τα χέρια του, για να τα καθαρίζη με το οινόπνευμα. Ακόμη και το αυτοκίνητό του το τρίβει με οινόπνευμα! Τον λυπήθηκα! Ξέρεις τί είναι να έχη τέτοια θέση και να κινήται έτσι; Του έδωσα λουκούμι, και δεν το πήρε, επειδή το έπιασα. Αλλά και στο κουτί να ήταν, πάλι δεν θα το έπαιρνε, γιατί θα σκεφτόταν ότι και στο κουτί θα το έβαλε κάποιος άλλος με τα χέρια του. Παίρνω το λουκούμι, το τρίβω στα παπούτσια του και το τρώω. Του έκανα κάμποσα τέτοια και τρόμαξα να τον κάνω να ελευθερωθή λίγο από αυτό. Νά, και σήμερα ήρθε εδώ μια κοπέλα που είχε νοσοφοβία. Και όταν μπήκε μέσα δεν πήρε ευχή, γιατί φοβόταν μην κολλήση μικρόβια, και όταν έφυγε, έπειτα από τόσα που της είπα, για να την βοηθήσω, πάλι δεν πήρε ευχή. «Δεν σού φιλώ το χέρι, μου λέει, γιατί φοβάμαι μην κολλήσω μικρόβια»! Τί να πής; Κάνουν έτσι μαύρη την ζωή τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι κατά φαντασίαν ασθενείς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μεγαλύτερη αρρώστια είναι το να πιστέψη ο άνθρωπος στον λογισμό του ότι έχει κάποια αρρώστια. Ο λογισμός αυτός του δημιουργεί άγχος, τον κάνει να στενοχωριέται, να μην έχη όρεξη για φαγητό, να μην μπορή να κοιμηθή, να παίρνη φάρμακα, και τελικά αρρωσταίνει, ενώ ήταν καλά. Να είναι άρρωστος κανείς και να κάνη θεραπεία, αυτό το καταλαβαίνω· αλλά να είναι υγιής και να νομίζη ότι είναι άρρωστος και να αρρωσταίνη στα καλά καθούμενα, αυτό είναι... Ένας λ.χ., ενώ έχει και σωματική και πνευματική δύναμη, δεν μπορεί να κάνη τίποτε, γιατί έχει πιστέψει στον λογισμό που του λέει ότι δεν είναι καλά, με αποτέλεσμα να σβήνη σωματικά και πνευματικά. Δεν είναι ότι λέει ψέματα. Αν ο άνθρωπος πιστέψη ότι κάτι έχει, πανικοβάλλεται, τσακίζεται, και δεν έχει μετά κουράγιο να κάνη τίποτε. Έτσι αχρηστεύεται χωρίς λόγο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έρχονται μερικοί στο Καλύβι που είναι τελείως τσακισμένοι. «Μου λέει ο λογισμός ότι έχω έιτζ», λένε και το πιστεύουν. Τους ρωτάω: «Μήπως συνέβη εκείνο, εκείνο;». «Όχι», μου λένε. «Τότε άδικα στενοχωριέσαι. Πήγαινε να κάνης μια εξέταση, για να σού φύγη ο λογισμός». «Και αν γίνη η εξέταση και βρουν ότι έχω;», λένε μερικοί και δεν μ᾿ ακούν και βασανίζονται. Ενώ αυτοί που ακούν, κάνουν εξέταση, βλέπουν ότι δεν έχουν τίποτε καί, να δήτε, το πρόσωπό τους αλλάζει, το κουράγιο επανέρχεται. Οι άλλοι από την στενοχώρια ξαπλώνουν στο κρεββάτι και ούτε να φάνε δεν θέλουν. Εντάξει, έχεις έιτζ. Για τον Θεό δεν υπάρχει δύσκολο πρόβλημα. Αν ζήσης πιο πνευματικά, εξομολογήσαι, κοινωνάς κ.λπ., θα βοηθηθής.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς ξεκινάει, Γέροντα, και νομίζει κάποιος ότι είναι άρρωστος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σιγά-σιγά καλλιεργεί αυτόν τον λογισμό. Πολλές φορές μπορεί να υπάρχη κάποια αιτία, αλλά να μην είναι κάτι σοβαρό. Βγάζει μετά και ο λογισμός κάτι ακόμη και το μεγαλοποιεί. Όταν ήμουν στην Μονή Στομίου, ήταν ένας οικογενειάρχης στην Κόνιτσα που νόμιζε ότι είχε φυματίωση. Δεν άφηνε ούτε την γυναίκα του να πάη κοντά του. «Μήν πλησιάζης, της έλεγε, θα κολλήσης». Σε ένα ξύλο κρεμούσε η καημένη το καλάθι με το φαγητό και του το έδινε από μακριά. Η φουκαριάρα είχε λειώσει. Τα παιδιά του τα κακόμοιρα από μακριά τον έβλεπαν. Αυτός εν τω μεταξύ δεν είχε τίποτε, αλλά, επειδή ο ήλιος δεν τον έβλεπε – ήταν κλεισμένος μέσα και τυλιγμένος συνέχεια με τις κουβέρτες –, ήταν κίτρινος και πίστευε ότι έχει χτικιό. Σηκώνομαι και πάω στο σπίτι του. Μόλις με είδε, μου λέει: «Μη με πλησιάζης, καλόγερε, μην κολλήσης κι εσύ, και έρχεται κόσμος εκεί στο μοναστήρι. Έχω χτικιό». «Ποιός σού είπε, μωρέ, ότι έχεις χτικιό;», του λέω. Η γυναίκα του έφερε να με κεράση γλυκό καρύδι. «Άνοιξε το στόμα σου, του λέω. Θα κάνης υπακοή τώρα». Το άνοιξε· δεν ήξερε τί θα κάνω. Βάζω το καρύδι μέσα στο στόμα του και το γυρνάω δυό-τρείς φορές και ύστερα το παίρνω και το τρώω. «Μή, μή, θα κολλήσης!», φώναζε. «Τί θα κολλήσω! Τίποτε δεν έχεις, του λέω. Αν είχες χτικιό, χαμένο το είχα να το κάνω αυτό; Σήκω να βγούμε έξω». Λέω στην γυναίκα του: «Πέταξέ τα όλα, φάρμακα, κουβέρτες ...». Τον σηκώνω και βγαίνουμε έξω. Έπειτα από τρία χρόνια που ήταν κλεισμένος μέσα κοιτούσε τον κόσμο παράξενα. Ύστερα, σιγά-σιγά, πήγε και στην δουλειά του. Τί είναι ο λογισμός, όταν τον καλλιεργής!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την υπακοή όλα ξεπερνιούνται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί να βοηθηθή κανείς, όταν νομίζη ότι πάσχει από κάτι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να βοηθηθή, πρέπει να έχη πνευματικό, να του έχη εμπιστοσύνη και να του κάνη υπακοή. Θα πη τον λογισμό του και εκείνος θα του πή: «Σ᾿ αυτό μη δίνης σημασία, εκείνο πρόσεξέ το» κ.λπ. Αν δεν έχη εμπιστοσύνη και δεν υπακούη, δεν μπορεί να του φύγη ο λογισμός. Ξέρεις τί είναι να σού ζητούν βοήθεια και να μην κάνουν τίποτε οι ίδιοι; Ένας νέος που ζη ακατάστατα, έχει ψυχολογικά προβλήματα και ταλαιπωρείται, έρχεται με κάτι μάτια κατακόκκινα από το τσιγάρο και ζητάει να τον βοηθήσω. Έχει και μια ψευτοευλάβεια, ζητάει να του δώσω την εικόνα από το τέμπλο, για ευλογία, και μπαίνει μέσα στο Κελλί με το τσιγάρο! «Βρέ, του λέω, τα μάτια σου από το τσιγάρο έγιναν κατακόκκινα σαν του λυσσασμένου σκυλιού. Ούτε γέροι δεν καπνίζουν εδώ μέσα. Εγώ λιβανίζω εδώ πέρα». Το δικό του αυτός. Έρχεται, ζητάει βοήθεια και δεν βγαίνει από τον λογισμό του. «Γιατί δεν με κάνεις καλά;»,  μου λέει. Θέλει να γίνη καλά με μαγικό τρόπο, χωρίς ο ίδιος να κάνη καμμιά προσπάθεια. «Εσύ δεν είσαι για θαύμα, του λέω. Δεν έχεις τίποτε. Πιστεύεις στον λογισμό σου». Αν έκανε υπακοή, θα βοηθιόταν. Έχω προσέξει ότι όποιος ακούει, τάκ-τάκ προχωράει και πάει καλά. Και αυτός και οι δικοί του μετά είναι ήσυχοι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια φορά πήγε ένας ιερεύς σε ένα μοναστήρι και του είπαν να ψάλη, αλλά εκείνος αρνήθηκε. «Γιατί, του λένε, δεν ψάλλεις;». «Γιατί ο ψαλμός λέει: «Αι υψώσεις του Θεού εν τω λάρυγγι αυτών, και ρομφαίαι δίστομοι εν ταις χερσίν αυτών"[21]». Φοβόταν την ρομφαία, αν ύψωνε την φωνή του, και επέμενε ότι ήταν κακό να ψάλη. «Βρέ καλέ μου, βρέ χρυσέ μου, δεν είναι έτσι», του έλεγαν οι άλλοι, τίποτε αυτός, το δικό του. Έ, πώς να συνεννοηθής με έναν τέτοιον άνθρωπο; Τί να τον κάνης; Ακόμη και αν αυτό που έλεγε αυτός ήταν σωστό και ο άλλος του έλεγε: «όχι, δεν είναι έτσι, έτσι είναι», και έκανε υπακοή στο λάθος του άλλου, πάλι θα έπαιρνε Χάρη, και μάλιστα μεγάλη Χάρη, γιατί ταπεινώθηκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσοι βασανίζονται έτσι χρόνια, επειδή πιστεύουν στον λογισμό τους και δεν ακούνε! Όσα και να τους πής, όσα και να τους κάνης, όλα τα παίρνουν ανάποδα. Και δεν είναι ότι πίστεψε κανείς μια φορά στον λογισμό του και το κακό σταμάτησε εκεί, αλλά το κακό αυξάνει. Καλλιεργείται-καλλιεργείται και μπορεί να φθάση στην τρέλλα. Φτιάχνει π.χ. κάποιος ένα σπίτι και του λένε: «Πώς το φτιάχνεις έτσι; Θα πέση και θα σε πλακώση». Επειδή είναι στην αρχή, αν ακούση, εύκολα μπορεί να το χαλάση και να το διορθώση. Αν όμως το τελειώση, πώς να το γκρεμίση μετά; Του λένε: «θά σε πλακώση», το βλέπει και αυτός ότι θα πέση, καταλαβαίνει τον κίνδυνο, αλλά σκέφτεται ότι ξοδεύτηκε, έκανε τόσο κόπο για να το φτιάξη, και δεν το χαλνάει, και τελικά πλακώνεται μέσα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτός μπορεί να βοηθηθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν θέλη, μπορεί να βοηθηθή. Όταν όμως του λές ότι αυτό δεν είναι σωστό και εκείνος δικαιολογή τον εαυτό του, πώς να βοηθηθή; Ας υποθέσουμε, ένας νέος έχει ζάχαρο καί, επειδή δεν ξέρει πόσο κακό μπορεί να του κάνη, νομίζει ότι δεν είναι κάτι σοβαρό. Του λέει ο γιατρός: «Το ζάχαρο βλάπτει και πρέπει να κάνης δίαιτα». Αν τον ακούση, δεν θα έχη προβλήματα. Αν όμως λέη: «άς έχω ζάχαρο· θα τρώω γλυκά, γιατί, όταν τρώω γλυκά, ζεσταίνομαι, μπορώ να κοιμάμαι χωρίς κουβέρτα, να μπώ και μέσ᾿ στο χιόνι», πώς να συνεννοηθής μαζί του, αφού επιμένει στο δικό του;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι φυσιολογικό ένας νέος να πιστεύη στον λογισμό του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ένας νέος, αν πιστεύη στον λογισμό του, έχει πολύ εγωισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα το καταλάβη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν λ.χ. θυμηθή μερικά περιστατικά από την παιδική του ηλικία που δείχνουν τί δόση εγωισμού είχε από μικρός, θα το καταλάβη. Παρατηρούσα δύο παιδάκια. Το ένα πήρε ένα μαξιλάρι από αφρολέξ και το σήκωσε φυσιολογικά. Πήγε και το άλλο να το σηκώση και έκανε σαν να σήκωνε ένα σακκί τσιμέντο. Αυτό έχει εγωισμό. Όταν όμως λίγο μεγαλώση και καταλάβη ότι εκείνη η ενέργειά του ξεκινούσε από τον εγωισμό και το πη στην εξομολόγηση, έρχεται η Χάρις του Θεού, λυτρώνεται και βοηθιέται. Αλλοίμονο, ο Θεός δεν είναι άδικος!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, από κάποια πείρα που έχω, βλέπω περίπου τί εξέλιξη θα έχη μία κατάσταση του εαυτού μου, σ᾿ αυτό υπάρχει αυτοπεποίθηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να μη βγάζης συμπεράσματα μόνη σου. Ο Απόστολος Πέτρος, όταν τον κάλεσε ο Χριστός, περπάτησε επάνω στο νερό. Μόλις όμως του είπε ο λογισμός του ότι θα βουλιάξη, βούλιαξε[22]. Και ο Χριστός τον άφησε. «Αφού λές ότι θα βουλιάξης, βούλιαξε».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και βλέπεις, ο ταπεινός, και θαύματα να κάνη, πάλι δεν πιστεύει στον λογισμό του. Ήταν στην Ιορδανία ένας πολύ απλός παπάς που έκανε θαύματα. Διάβαζε ανθρώπους και ζώα που είχαν κάποια αρρώστια και γίνονταν καλά. Πήγαιναν και Μουσουλμάνοι σ᾿ αυτόν, όταν έπασχαν από κάτι, και τους θεράπευε. Αυτός, πριν λειτουργήση, έπαιρνε ένα ρόφημα με λίγο παξιμάδι και μετά όλη την ημέρα δεν έτρωγε τίποτε. Κάποτε έμαθε ο Πατριάρχης ότι τρώει πριν από την Θεία Λειτουργία και τον κάλεσε στο Πατριαρχείο. Πήγε εκείνος, χωρίς να ξέρη γιατί τον ζητάνε. Ώσπου να τον φωνάξη ο Πατριάρχης, περίμενε μαζί με άλλους σε μια αίθουσα. Έξω έκανε πολλή ζέστη· είχαν κλειστά τα παντζούρια και από μια τρυπούλα περνούσε μια ακτίνα. Αυτός νόμισε ότι είναι σχοινί. Επειδή είχε ιδρώσει, βγάζει το ράσο του και το κρεμάει πάνω στην ακτίνα. Όταν το είδαν οι άλλοι που κάθονταν εκεί στην αίθουσα, τα έχασαν. Πάνε και λένε στον Πατριάρχη: «Ο παπάς που κολατσίζει πριν από την Θεία Λειτουργία κρέμασε το ράσο του πάνω σε μια ακτίνα!». Τον κάλεσε μέσα ο Πατριάρχης και άρχισε να τον ρωτάη: «Τί κάνεις; Πώς πάς; Κάθε πότε λειτουργείς; Πώς ετοιμάζεσαι για την Θεία Λειτουργία;». «Νά, λέει, διαβάζω την ακολουθία του όρθρου, κάνω και μερικές μετάνοιες και ύστερα φτιάχνω ένα ρόφημα, κολατσίζω λίγο, και έπειτα λειτουργώ». «Γιατί το κάνεις αυτό;», τον ρωτάει ο Πατριάρχης. «Άμα φάω λιγάκι πριν από την Θεία Λειτουργία, λέει εκείνος, όταν κάνω κατάλυση[23], πάει ο Χριστός επάνω. Ενώ, αν φάω μετά την Θεία Λειτουργία, πάει ο Χριστός από κάτω»! Με καλό λογισμό το έκανε! Του λέει τότε ο Πατριάρχης: «Όχι, δεν είναι σωστό αυτό. Πρώτα να κάνης κατάλυση, και έπειτα να τρώς λίγο». Έβαλε μετάνοια και το δέχθηκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θέλω να πώ, παρόλο που είχε φθάσει σε τέτοια κατάσταση, να κάνη θαύματα, το δέχθηκε απλά· δεν είχε δικό του θέλημα. Ενώ, αν πίστευε στον λογισμό του, μπορούσε να πή: «Εγώ διαβάζω ανθρώπους και ζώα άρρωστα και γίνονται καλά, κάνω θαύματα· τί μου λέει αυτός; Έτσι που το σκέφτομαι, είναι πιο καλά, γιατί αλλιώς πάει το φαγητό πάνω από τον Χριστό».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχω καταλάβει ότι η υπακοή πολύ βοηθάει. Και λίγο μυαλό να έχη κανείς, αν κάνη υπακοή, γίνεται φιλόσοφος. Είτε έξυπνος είτε κουτός είτε υγιής είτε άρρωστος  πνευματικά ή σωματικά είναι κανείς και βασανίζεται από λογισμούς, αν κάνη υπακοή, ελευθερώνεται. Λύτρωση είναι η υπακοή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο μεγαλύτερος εγωιστής είναι αυτός που ακολουθεί τους λογισμούς του και δεν ρωτάει κανέναν· αυτοκαταστρέφεται. Μπορεί κάποιος να είναι έξυπνος, τετραπέρατος, αλλά, αν έχη θέλημα, αυτοπεποίθηση και φιλαυτία, βασανίζεται συνέχεια. Μπερδεύεται άσχημα και του δημιουργούνται προβλήματα. Για να βρη τον δρόμο του, πρέπει να ανοίξη την καρδιά του σε κάποιον πνευματικό και να ζητήση ταπεινά την βοήθειά του. Μερικοί όμως αντί να πάνε στον πνευματικό, πάνε στον ψυχίατρο. Αν ο ψυχίατρος είναι πιστός, θα τους συνδέση με κάποιον πνευματικό. Αν όχι, θα τους δώση μόνο χάπια. Μόνον όμως τα χάπια δεν λύνουν το πρόβλημα. Χρειάζονται και πνευματική βοήθεια, για να μπορέσουν να το αντιμετωπίσουν σωστά και να καλυτερέψη η κατάστασή τους, και να μην ταλαιπωρούνται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 4 – Ο αγώνας κατά των λογισμών
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική ζωή στον λογισμό βασίζεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Διάβασα, Γέροντα, ότι οι Έλληνες στον Ιταλικό πόλεμο πρώτα προσπαθούσαν να χαλάσουν τα οχυρά του εχθρού και ύστερα έκαναν επίθεση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και ο διάβολος το ίδιο κάνει. Όπως δηλαδή ο εχθρός, πριν κάνη επίθεση με το πυροβολικό, βομβαρδίζει με την αεροπορία τα οχυρά, για να τα σπάση, έτσι και ο διάβολος πρώτα βομβαρδίζει με λογισμούς τον άνθρωπο και ύστερα του επιτίθεται. Αν δεν χαλάση τον λογισμό του ανθρώπου, δεν επιτίθεται, γιατί ο άνθρωπος αμύνεται με τον καλό λογισμό· είναι στο αμπρί[24]του!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο αριστερός λογισμός είναι ξένο σώμα και πρέπει ο άνθρωπος να προσπαθήση να το αποβάλη. Αυτόν τον αγώνα όλοι έχουμε την δύναμη να τον κάνουμε. Κανένας δεν δικαιολογείται να πη ότι είναι αδύνατος και δεν μπορεί να τον κάνη. Δεν είναι κασμάς ούτε βαριά[25], για να μην μπορή να τα σηκώση, επειδή τρέμουν τα χέρια του. Δεν το βλέπω δύσκολο, το να τα παίρνουμε όλα δεξιά. Γιατί να εξετάσω λ.χ. την ιδιοτροπία του άλλου; Μπορεί στην πραγματικότητα αυτό που κάνει να μην είναι ιδιοτροπία, αλλά να το κάνη επίτηδες, για να ταπεινωθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ανησυχώ, γιατί όλο αριστερά δουλεύω. Αγωνίζομαι, αλλά δεν μπορώ να γυρίσω δεξιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το να αναγνωρίζης ποιοί λογισμοί δεν είναι καθαροί, να ανησυχής και να αγωνίζεσαι να τους απομακρύνης, και αυτό είναι πρόοδος. Αν θέλης να προκόψης, όταν ο πονηρός σού επιτίθεται με αριστερούς λογισμούς και σε τραβάη προς το μέρος του, στρίψε με δύναμη αντίθετα το τιμόνι και αγνόησέ τον. Να προσπαθήσης να φέρνης καλούς λογισμούς και για τις μικρότερες αλλά και για τις μεγαλύτερες αδελφές, οι οποίες κάνουν εσωτερική εργασία αθόρυβα, γιατί το ταγκαλάκι σού χαλάει τον λογισμό, για να καθυστερήση την πνευματική σου πρόοδο. Εάν δεν σκάλωνες στους λογισμούς σου, θα είχες κάνει άλματα πνευματικά. Όλη η πνευματική ζωή στον λογισμό βασίζεται. Η πρόοδος στην πνευματική ζωή από τον λογισμό εξαρτάται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα βοηθηθώ στον αγώνα κατά των αριστερών λογισμών;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την εγρήγορση και την αδιάλειπτη προσευχή. Αν βρίσκεσαι σε εγρήγορση, προσέχεις και φέρνεις καλούς λογισμούς. Π.χ. βλέπεις ένα ποτήρι και σκέφτεσαι το Άγιο Ποτήριο, τον Μυστικό Δείπνο, τον Χριστό κ.λπ. Ενώ, αν δεν βρίσκεσαι σε εγρήγορση, μπορεί ο νούς σου να πάη σε διάφορα μη πνευματικά πράγματα ή ακόμη και σε ελεεινά. Γι᾿ αυτό προσπάθησε να μη μαζεύης σαβούρα λογισμών και ύστερα παλεύης να τους διώξης. Να λές την ευχή και να συγκεντρώνεσαι. Και αν φεύγη ο νούς σου, πάλι να τον επαναφέρης και συνέχεια να κάνης το ίδιο. Μήν αφήνης τον νού σου να γυρίζη. Γιατί, ακόμη κι αν ο νούς δεν βρίσκεται πάντοτε σε άσχημα πράγματα αλλά σε ουδέτερα, ωστόσο και αυτά τον εξουδετερώνουν με τον περισπασμό, και γίνεται σπατάλη. Οι λογισμοί μάλιστα που δημιουργεί ο περισπασμός είναι πιο ύπουλοι από τους κακούς, επειδή δεν τους καταλαβαίνουμε, για να τους πετάξουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο λογισμός μου λέει: «Δεν έκανες καμμιά προκοπή τόσα χρόνια που είσαι στο μοναστήρι».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να ακούσω, τί άλλο σού λέει ο λογισμός; Όπως έχω καταλάβει, ακούτε πολύ το ταγκαλάκι. Τί ξεγέλασμα σάς κάνει! Γιατί πιστεύετε στο ταγκαλάκι; Γιατί ζαλίζεσθε; Ειρήνευε. Στενοχωριέσαι άδικα και ταλαιπωρείσαι χωρίς λόγο. Σού παρουσιάζει το ταγκαλάκι τα πράγματα μπερδεμένα, σαν τον φακίρη. Σε ζαλίζει με λογισμούς απαισιοδοξίας, για να σού τρώη την ώρα και να σε περισπά από την προσευχή και την προσοχή στο διακόνημα. Έστω και λίγο αν σε ζαλίση και σε κάνη να μην έχης διάθεση να το πολεμήσης, και μόνον αυτό είναι αρκετό, για να λάβη την προαγωγή του. Προσπάθησε, όταν εργάζεσαι μόνη σου, να έχης το εξής τυπικό: Ψαλτική, δοξολογία, ευχή νοερά ή δυνατά, ώστε να αποφεύγης την μουρμούρα των λογισμών, δηλαδή να αλλάζης θέμα. Αφού ο διάβολος αλλάζει θέμα, γιατί να μην αλλάξουμε κι εμείς; Σάς έχω πει και άλλη φορά ότι επάνω σε κάποια συζήτηση, την στιγμή που είναι να πω στον άλλον αυτό που θα τον βοηθήση, έρχεται κάποιος και διακόπτει ή γίνεται κάποιος θόρυβος κ.λπ., για να αναγκασθώ να σταματήσω. Αφού ο πειρασμός κάνει τέτοια σχέδια, γιατί να μην κάνουμε κι εμείς σχέδια στον πειρασμό; Να είστε έξυπνες, να κοροϊδεύετε το ταγκαλάκι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, με ταλαιπωρεί η λύπη, η ακηδία... Περνώ μαρτύριο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μαρτύριο πριν από το μαρτύριο!... Εσύ έχεις αυτοπεποίθηση. Σού έχουν γίνει κατάσταση οι αριστεροί λογισμοί, γι᾿ αυτό παιδεύεσαι. Έχεις ανάγκη από δεξιούς λογισμούς. Πρέπει να μετατρέψης τις πονηρές μηχανές τού... εργοστασίου σου σε καλές μηχανές. Η καλύτερη επιχείρηση είναι να φτιάξη ο άνθρωπος ένα εργοστάσιο καλών λογισμών. Τότε, ακόμη και τα άσχημα θα τα φτιάχνη ο νούς του καλά. Π.χ. έναν άνθρωπο, αν τον δής σαν ψυχή, σαν άγγελο, ανεβαίνεις αγγελικά στον Ουρανό και η ζωή σου είναι πανηγύρι. Αν τον δής σαρκικά, κατεβαίνεις στην κόλαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές, Γέροντα, όταν βάζω έναν καλό λογισμό, σε λίγο μου έρχεται ένας αριστερός λογισμός και μου τα χαλάει όλα. Μήπως δεν το κάνω από την καρδιά μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Σκοπός είναι να το κάνης από την καρδιά σου καί, αν σού έρθη αριστερός λογισμός, να πής: «Αυτός είναι αλλότριος. Πρέπει να τον διώξω. Τώρα υπέγραψα· πάει, τέλειωσε».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, με αγώνα έχω διώξει έναν αριστερό λογισμό, πώς γίνεται και επανέρχεται, αφού τελείωσε το θέμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, το θέμα τελείωσε, αλλά το ταγκαλάκι δεν τελείωσε. Δεν πεθαίνει ο διάβολος ποτέ. Έλεγε ένα γεροντάκι: «Ο σκύλος, μιά-δυό κλωτσιές αν του δώσης, φεύγει. Ο διάβολος δεν φεύγει· επιμένει. Εκεί-εκεί! Ανάβω ένα κερί στους Αγίους του Κελλιού, για να φύγη, και μου λένε οι δαίμονες: «Για μας το άναψες το κερί;». «Βρέ, σαβούρα, που για σάς; Για τους Αγίους το άναψα». «Ναί, όμως εμείς σε αναγκάσαμε», μου λένε».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, όταν συμβαίνη κάτι δυσάρεστο σε κάποιον και αρχίζη να λέη: «γιατί, Θεέ μου, να μου συμβή και αυτό;», αυτός ο άνθρωπος βοηθιέται;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να βοηθηθή! Η βάση είναι να τα ερμηνεύη ο άνθρωπος όλα με καλό λογισμό· μόνον τότε ωφελείται. Είναι μερικοί που έχουν καλή μηχανή, πολλές προϋποθέσεις για πνευματική ζωή, αλλά το τιμόνι τους έχει λάθος κατεύθυνση. Αν γυρίσουν το τιμόνι στην κατεύθυνση των καλών λογισμών, προχωρούν μετά στην σωστή κατεύθυνση σταθερά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καλλιέργεια των καλών λογισμών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι καλοί λογισμοί έρχονται μόνοι τους ή πρέπει να τους καλλιεργώ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει να τους καλλιεργής. Να παρακολουθής τον εαυτό σου, να τον ελέγχης και να προσπαθής, όταν ο εχθρός σού φέρνη κακούς λογισμούς, να τους διώχνης και να τους αντικαθιστάς με καλούς λογισμούς. Όταν αγωνίζεσαι έτσι, θα καλλιεργηθή η διάθεσή σου και θα γίνη καλή. Τότε ο Θεός, βλέποντας την καλή σου διάθεση, θα συγκαταβή και θα σε βοηθήση, οπότε οι κακοί λογισμοί δεν θα βρίσκουν μέσα σου τόπο. Θα φεύγουν και θα έχης πλέον φυσιολογικά καλούς λογισμούς. Θα αποκτήσης μια συνήθεια προς το καλό, θα έρθη η καλωσύνη στην καρδιά σου, και τότε θα φιλοξενής μέσα σου τον Χριστό. Αυτό όμως δεν γίνεται από την μια μέρα στην άλλη· χρειάζεται χρόνος και συνεχής αγώνας, για να λάβη η ψυχή τον στέφανο της νίκης. Τότε πια ο πόλεμος εξαλείφεται για πάντα, διότι οι πόλεμοι είναι ξεσπάσματα εσωτερικής ακαταστασίας, που την εκμεταλλεύονται οι προπαγάνδες των εχθρών.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, όσοι έχουν καλούς λογισμούς, το πέτυχαν με αγώνα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ανάλογα. Άλλοι άνθρωποι έχουν από την αρχή της πνευματικής τους ζωής καλούς λογισμούς και έτσι προχωρούν. Άλλοι, ενώ στην αρχή έχουν καλούς λογισμούς, ύστερα δεν προσέχουν και αρχίζουν να έχουν αριστερούς. Άλλοι έχουν στην αρχή αριστερούς λογισμούς, αλλά, παρακολουθώντας τον εαυτό τους και βλέποντας πόσες φορές την παθαίνουν, χάνουν την εμπιστοσύνη στον εαυτό τους και μετά έχουν καλούς λογισμούς. Άλλοι μπορεί να έχουν μισούς καλούς και μισούς κακούς. Άλλοι περισσότερους καλούς, άλλοι περισσότερους κακούς. Κάποιος λ.χ. που πάει να γίνη καλόγερος, ανάλογα με το περιβάλλον, με τις συνθήκες στις οποίες έζησε, έχει λογισμούς καλούς και κακούς. Μπορεί να έχη δέκα μέχρι είκοσι τοις εκατό, ακόμη και ογδόντα τοις εκατό, κακούς λογισμούς. Όταν αρχίση να κάνη εσωτερική εργασία, παρακολουθεί τον εαυτό του, προσπαθεί να διώχνη τους κακούς λογισμούς και να καλλιεργή τους καλούς. Συνεχίζοντας αυτήν την προσπάθεια, φθάνει μετά από ένα χρονικό διάστημα να έχη μόνον καλούς λογισμούς. Από το διάστημα που είχε τους κακούς λογισμούς στον κόσμο, θα εξαρτηθή και το διάστημα που θα χρειασθή για να φύγουν. Στην συνέχεια, σιγά-σιγά σταματούν και οι καλοί λογισμοί και φθάνει σε ένα άδειασμα. Τότε περνά μία περίοδο που δεν έχει ούτε καλούς ούτε κακούς λογισμούς. Αυτή η φάση φέρνει και κάποια ανησυχία στην ψυχή και ο άνθρωπος αρχίζει να αναρωτιέται: «Τί συμβαίνει; Τί γίνεται τώρα; Είχα κακούς λογισμούς, έφυγαν· ήρθαν καλοί. Τώρα δεν έχω ούτε κακούς ούτε καλούς». Μετά από αυτό το άδειασμα γεμίζει ο νούς με την θεία Χάρη και έρχεται ο θείος φωτισμός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό το γέμισμα, Γέροντα, πώς είναι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σε έναν που δεν έχει δει τα άστρα δεν μπορείς να του περιγράψης πώς είναι ο ήλιος. Αν έχη δει τουλάχιστον τα άστρα, μπορείς να του δώσης να καταλάβη περίπου πώς είναι ο ήλιος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει να φθάση κανείς σ᾿ αυτό το άδειασμα που αναφέρατε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η πνευματική μελέτη, η αδιάλειπτη προσευχή,  η σιωπή και η φιλότιμη άσκηση. Μια ψυχή που θα πάρη στα ζεστά τον αγώνα κατά των κακών λογισμών μπορεί να φθάση σε καλύτερη κατάσταση από μια άλλη που δεν έχει σχεδόν καθόλου κακούς λογισμούς. Μπορεί δηλαδή στην αρχή της πνευματικής ζωής να είχε ενενήντα κακούς λογισμούς και δέκα καλούς και να φθάση σε καλύτερη κατάσταση από αυτήν που είχε ενενήντα καλούς και δέκα κακούς.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η κάθαρση του νού και της καρδιάς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς έρχεται η κάθαρση του νού και της καρδιάς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σάς έχω πει ότι, για να εξαγνισθούν ο νούς και η καρδιά, δεν πρέπει ο άνθρωπος να δέχεται τους πονηρούς λογισμούς που του φέρνει το ταγκαλάκι, ούτε ο ίδιος να σκέφτεται πονηρά. Να προσπαθή να βάζη πάντα καλό λογισμό, να μη σκανδαλίζεται εύκολα και να βλέπη με επιείκεια και αγάπη τα σφάλματα των άλλων. Όταν πληθαίνουν οι καλοί λογισμοί, ο άνθρωπος εξαγνίζεται ψυχικά, κινείται με ευλάβεια, ειρηνεύει, και η ζωή του είναι Παράδεισος. Διαφορετικά, τα βλέπει όλα με καχυποψία και γίνεται η ζωή του κόλαση. Μόνος του κάνει την ζωή του κόλαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χρειάζεται να εργασθούμε για την κάθαρση. Μπορεί να αναγνωρίζουμε τα χάλια μας, αλλά αυτό δεν αρκεί. Αν δεν δεχώμαστε πονηρούς λογισμούς και οι ίδιοι δεν σκεφτώμαστε πονηρά, αλλά για ό,τι μας λένε, για ό,τι βλέπουμε, βάζουμε καλό λογισμό, θα καθαρίσουν ο νούς και η καρδιά.Ο πειρασμός βέβαια δεν θα σταματήση να μας στέλνη από κανένα πονηρό τηλεγράφημα. Και να απαλλαγούμε από τους δικούς μας λογισμούς, του διαβόλου τα πειράγματα θα υπάρχουν, αλλά δεν θα κολλούν, αν είναι καθαρή η καρδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η προσευχή δεν βοηθάει στην κάθαρση του νού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν φθάνει μόνον η προσευχή. Το να καίη κανείς κιλά λιβάνι, όταν προσεύχεται, αν ο νούς του είναι γεμάτος από κακούς λογισμούς για τους άλλους, δεν ωφελεί. Από τον νού κατεβαίνει το τηλεγράφημα στην καρδιά και κάνει τον άνθρωπο θηρίο. Ο Θεός θέλει να έχουμε «καρδίαν καθαράν»[26], και η καρδιά μας είναι καθαρή, όταν δεν επιτρέπουμε να περνάη από τον νού μας κακός λογισμός για τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πρώτα φέρνει ο άνθρωπος καλό λογισμό και ύστερα βοηθάει ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, μόνον όταν ο άνθρωπος βάζη καλό λογισμό, δικαιούται την θεία βοήθεια. Με τον καλό λογισμό καθαρίζει την πονηρή του καρδιά, διότι «εκ της καρδίας εξέρχονται»[27]όλα τα κακά, και πάλι «εκ του περισσεύματος της καρδίας λαλεί το στόμα»[28]. Τον ανταμείβει μάλιστα ο Θεός για τον καλό λογισμό που βάζει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να βάζουμε ερωτηματικά στους λογισμούς υπονοίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει να διώχνω τους λογισμούς υπονοίας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όλα είναι πάντα έτσι, όπως τα βλέπεις; Να βάζης πάντα ένα ερωτηματικό σε κάθε λογισμό σου, μια που όλα τα βλέπεις συνήθως αριστερά, καθώς επίσης και από κανέναν καλό λογισμό για τους άλλους, για να μην αμαρτάνης με τις κρίσεις σου. Αν βάζης δύο ερωτηματικά, είναι πιο καλά. Αν βάζης τρία, είναι ακόμη καλύτερα. Έτσι κι εσύ ειρηνεύεις και ωφελείσαι, αλλά και τον άλλον ωφελείς. Αλλιώς, με τον αριστερό λογισμό νευριάζεις, ταράζεσαι και στενοχωριέσαι, οπότε βλάπτεσαι πνευματικά. Όταν αντιμετωπίζης ό,τι βλέπεις με καλούς λογισμούς, μετά από λίγο καιρό θα δής ότι όλα ήταν πράγματι έτσι, όπως τα είδες με καλούς λογισμούς. Θα σού πω ένα περιστατικό, για να δής τί κάνει ο αριστερός λογισμός. Μια μέρα ήρθε στο Καλύβι ένας μοναχός και μου λέει: «Ο Γερο-Χαράλαμπος είναι μάγος· έκανε μαγικά». «Τί λές, μωρέ χαμένε; Δεν ντρέπεσαι;», του λέω. «Ναί, μου λέει, τον είδα μια νύχτα με φεγγάρι που έκανε «μ, μ, μμμ...» και έχυνε με μια νταμιτζάνα κάτι μέσα στα κλαδιά». Πάω μια μέρα και βρίσκω τον Γερο-Χαράλαμπο. «Τί γίνεται, Γερο-Χαράλαμπε; του λέω. Πώς τα περνάς; Τί κάνεις; Κάποιος σε είδε που έρριχνες εκεί μέσα στα βάτα κάτι με μια νταμιτζάνα και έκανες «μ, μ, μμμ..."». «Ήταν κάτι κρίνα μέσα στα ρουμάνια, μου λέει, και πήγα να τα ποτίσω. Έλεγα «Χαίρε, Νύμφη ανύμφευτε!» και έρριχνα λίγο νερό στο ένα κρίνο· «Χαίρε, Νύμφη ανύμφευτε!» και έρριχνα λίγο νερό στο άλλο... Γέμιζα πάλι την νταμιτζάνα, ξαναέρριχνα». Βλέπεις; Και ο άλλος τον πέρασε για μάγο!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπω, μερικοί κοσμικοί τί καλούς λογισμούς που έχουν! Ενώ άλλοι, οι καημένοι, πόσο βασανίζονται με πράγματα που ούτε καν υπάρχουν, αλλά ούτε και ο πειρασμός θα μπορούσε να τα σκεφθή! Μια φορά, όταν έβρεξε μετά από μεγάλη ανομβρία, ένιωσα τέτοια ευγνωμοσύνη στον Θεό, που καθόμουν μέσα στο Καλύβι και έλεγα συνέχεια: «Σ᾿ ευχαριστώ εκατομμύρια-δισεκατομμύρια φορές, Θεέ μου». Έξω, χωρίς να το ξέρω, ήταν ένας κοσμικός και με άκουσε. Όταν με είδε μετά, μου είπε: «Πάτερ, σκανδαλίσθηκα. Άκουσα να λές «εκατομμύρια-δισεκατομμύρια» και είπα «τί είναι αυτά που λέει ο πατήρ Παΐσιος;"». Τί να του έλεγα; Εγώ εννοούσα ευχαριστίες στον Θεό για την βροχή, και αυτός νόμιζε ότι μετρούσα χρήματα. Και αν ήταν κανένας άλλος, θα μπορούσε να έρθη να με ληστέψη το βράδυ, να μου δώση και ένα γερό ξύλο, και τελικά δεν θα έβρισκε τίποτε. Μια άλλη φορά είχε έρθει κάποιος που είχε άρρωστο παιδί. Τον πήρα να τον δώ μέσα στο εκκλησάκι. Όταν άκουσα το πρόβλημά του, του είπα, για να τον βοηθήσω: «Κάτι πρέπει να κάνης κι εσύ, για να βοηθηθή το παιδί σου. Μετάνοιες δεν κάνεις, νηστεία δεν κάνεις, χρήματα δεν έχεις, για να κάνης ελεημοσύνες, πές στον Θεό: «Θεέ μου, δεν έχω κανένα καλό να θυσιάσω για την υγεία του παιδιού μου, θα προσπαθήσω τουλάχιστον να κόψω το τσιγάρο"». Ο καημένος συγκινήθηκε και μου υποσχέθηκε πώς θα το κάνη. Πήγα να του ανοίξω την πόρτα, για να φύγη, και εκείνος άφησε το τσακμάκι και τα τσιγάρα μέσα στο εκκλησάκι, κάτω από την εικόνα του Χριστού. Εγώ δεν το πρόσεξα. Μετά από αυτόν μπήκε ένας νεαρός στο εκκλησάκι, κάτι ήθελε να μου πή, και ύστερα βγήκε έξω και κάπνιζε. Του λέω: «Παλληκάρι, δεν κάνει να καπνίζης εδώ. Πήγαινε λίγο πιο πέρα». «Μέσα στην εκκλησία επιτρέπεται να καπνίζης;», μου λέει. Αυτός είχε δει το πακέτο με το τσακμάκι που είχε αφήσει ο πατέρας του άρρωστου παιδιού και έβαλε λογισμό ότι καπνίζω. Τον άφησα να φύγη με τον λογισμό του. Καλά, και αν κάπνιζα, και μέσα στην εκκλησία θα κάπνιζα; Βλέπετε τί είναι ο λογισμός;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η υπόνοια, η καχυποψία, πόση ζημιά μπορεί να κάνη στην ψυχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ανάλογα με την υπόνοια είναι και η ζημιά. Η καχυποψία φέρνει καχεξία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θεραπεύεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με καλούς λογισμούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν δη ο άνθρωπος ότι πέφτει έξω μια φορά, αυτό δεν τον βοηθάει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν πέση μια φορά έξω, τέλος πάντων· αν πέση όμως δυο φορές, θα σακατευθή. Θέλει προσοχή, γιατί και ένα τοις χιλίοις να μην είναι τα πράγματα έτσι όπως τα σκεφθήκαμε, κολαζόμαστε. Όταν ήμουν στο Κοινόβιο, μια φορά την Μεγάλη Σαρακοστή ένα γεροντάκι, ο Γερο-Δωρόθεος, τηγάνιζε κολοκυθάκια. Τον είδε ένας αδελφός την ώρα που τα έβαζε στο τηγάνι και έρχεται και μου λέει: «Να δής, ο Γερο–Δωρόθεος τηγανίζει κάτι μπαρμπούνια τόσο μεγάλα!». «Μά, του λέω, ο Γερο–Δωρόθεος, Μεγάλη Σαρακοστή, δεν είναι δυνατόν να τηγανίζη μπαρμπούνια». «Ναί, μου λέει, τα είδα με τα μάτια μου, κάτι μπαρμπούνια τόσα!». Ο Γερο-Δωρόθεος είχε έρθει δεκαπέντε χρόνων στο Άγιον Όρος και ήταν σαν μάνα. Αν έβλεπε κανένα καλογέρι λίγο φιλάσθενο, «έλα εδώ, του έλεγε, έχω ένα μυστικό να σού πώ», και του έδινε λίγο ταχίνι με κοπανισμένα καρύδια ή κάτι άλλο. Και τα γεροντάκια τα οικονομούσε ανάλογα. Πάω μετά στον Γερο-Δωρόθεο και τί να δώ; Κολοκυθάκια τηγάνιζε για το νοσοκομείο!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και άν, Γέροντα, ένας λογισμός υπονοίας για κάποιον βγή αληθινός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και αν μια φορά βγή αληθινός ένας τέτοιος λογισμός, σημαίνει ότι κάθε φορά θα είναι αληθινοί τέτοιοι λογισμοί; Ύστερα που ξέρεις αν ο Θεός επέτρεψε να βγή αληθινός εκείνος ο λογισμός, για να δώση πνευματικές εξετάσεις ο άλλος στην ταπείνωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βέβαια χρειάζεται να προσέχη κανείς να μη δίνη και ο ίδιος αφορμές, ώστε ο άλλος να βγάζη λανθασμένα συμπεράσματα. Για να βάλη λ.χ. κάποιος έναν αριστερό λογισμό για σένα, μπορεί ο ίδιος να έχη εμπάθεια, αλλά κι εσύ μπορεί να έδωσες αφορμή. Άν, παρόλο που εσύ πρόσεξες, ο άλλος σκεφθή κάτι εις βάρος σου, τότε να δοξάσης τον Θεό και να ευχηθής για εκείνον.
- type: h2
  initial:
    ru: ''
  text:
    ru: Συζήτηση με τους λογισμούς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν έρχεται ένας λογισμός υπερήφανος, υποφέρω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τον κρατάς μέσα σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί τον κρατάς; Να του κλείνης την πόρτα. Άμα τον κρατάς μέσα σου, ζημία έχεις. Έρχεται ο λογισμός σαν τον κλέφτη, του ανοίγεις την πόρτα, τον βάζεις μέσα, πιάνεις κουβέντα μαζί του, και μετά εκείνος σε κλέβει. Με τον κλέφτη πιάνει κανείς κουβέντα; Όχι μόνον κουβέντα δεν πιάνει, αλλά κλειδώνει την πόρτα, για να μην μπή μέσα. Μπορεί ακόμη και να μη συζητήσης μαζί του, αλλά γιατί να τον αφήσης να περάση; Ας πούμε ένα παράδειγμα· δεν λέω ότι έχεις τέτοιους λογισμούς, αλλά ας υποθέσουμε ότι σού έρχεται ένας λογισμός ότι μπορούσες να είσαι εσύ Γερόντισσα. Εντάξει, ήρθε ο λογισμός. Μόλις έρθη, πές στον εαυτό σου: «πολύ καλά· θέλεις να είσαι Γερόντισσα; γίνε πρώτα στον εαυτό σου Γερόντισσα», οπότε αμέσως κόβεις την συζήτηση. Τί, με τον διάβολο θα συζητάμε; Βλέπεις, όταν ο διάβολος πήγε να πειράξη τον Χριστό, Εκείνος του είπε: «Ύπαγε οπίσω μου, σατανά»[29]. Αφού ο Χριστός είπε στον διάβολο: «άντε πήγαινε...», εμείς τί να συζητάμε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι κακό να συζητάω έναν αριστερό λογισμό, για να δώ από που προέρχεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το κακό είναι ότι δεν συζητάς με τον λογισμό, όπως νομίζεις, αλλά με το ταγκαλάκι. Περνάς ευχάριστα εκείνη την ώρα, μετά όμως παιδεύεσαι. Να μη συζητάς καθόλου τέτοιους λογισμούς. Να πιάνης την χειροβομβίδα και να την πετάς στον εχθρό, για να τον σκοτώσης. Η χειροβομβίδα έχει την ιδιότητα να μη σκάη αμέσως, αλλά μετά δύο-τρία λεπτά. Έτσι και ο αριστερός λογισμός, αν τον διώξης αμέσως, δεν μπορεί να σε βλάψη. Αλλά εσύ μερικές φορές δεν έχεις εγρήγορση, δεν λές την ευχή, και δεν μπορείς να αμυνθής. Έρχεται το τηλεγράφημα του διαβόλου απ᾿ έξω, το παίρνεις, το διαβάζεις, το ξαναδιαβάζεις, το πιστεύεις και το περνάς στο αρχείο. Αυτούς τους φακέλους θα τους παρουσιάση το ταγκαλάκι την ημέρα της Κρίσεως, για να σε κατηγορήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε η προσβολή ενός αριστερού λογισμού είναι πτώση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έρχεται ο λογισμός και τον διώχνεις αμέσως. Αυτό δεν είναι πτώση. Έρχεται και τον συζητάς. Αυτό είναι πτώση. Έρχεται, τον δέχεσαι λίγο και μετά τον διώχνεις. Αυτό είναι μισή πτώση, γιατί και τότε έχεις πάθει ζημιά, επειδή μόλυνε ο διάβολος τον νού σου. Δηλαδή  είναι σαν να ήρθε ο διάβολος και του είπες: «Καλημέρα, τί γίνεται; Καλά; Κάθησε να σε κεράσω. Ά, ο διάβολος είσαι; Φύγε τώρα». Αφού είδες ότι είναι ο διάβολος, γιατί τον έβαλες μέσα; Τον κέρασες και θα ξανάρθη.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Συγκατάθεση στον λογισμό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα, μου περνούν στο μοναστήρι διάφοροι κακοί λογισμοί, ενώ στον κόσμο δεν γινόταν αυτό; Εγώ τους επιτρέπω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, ευλογημένη! Άσ᾿ τους να έρχωνται και να φεύγουν. Μήπως τα αεροπλάνα που περνούν πάνω  από το μοναστήρι και σού χαλούν την ησυχία σε ρωτούν; Έτσι και αυτοί οι λογισμοί. Μήν απελπίζεσαι. Αυτοί οι λογισμοί είναι κανοναρχίσματα του διαβόλου. Είναι σαν τα διαβατάρικα πουλιά πού, όταν πετούν στον ουρανό, είναι πολύ όμορφα να τα χαζεύης.  Αν όμως κατεβούν και κάνουν φωλιά στο σπίτι σου, μετά κάνουν πουλάκια, και τα πουλάκια λερώνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί όμως, Γέροντα, να μου έρχωνται τέτοιοι λογισμοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτήν την δουλειά την κάνει ο πειρασμός. Αλλά υπάρχει μέσα σου και κατακάθι· δεν έγινε ακόμη η κάθαρση. Εφόσον όμως εσύ δεν τους δέχεσαι, δεν έχεις ευθύνη. Άφησε τα σκυλιά να γαυγίζουν. Μήν τους ρίχνης πολλές πέτρες. Γιατί, όσο τους ρίχνεις πέτρες, συνεχίζουν να γαυγίζουν και από τις πολλές πέτρες θα χτίσουν μοναστήρι ή σπίτι, ανάλογα..., και ύστερα δύσκολα να το γκρεμίσης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, πότε γίνεται συγκατάθεση στους λογισμούς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν τους πιπιλίζης σαν καραμέλα. Να προσπαθήσης να μην πιπιλίζης τους λογισμούς αυτούς που είναι απ᾿ έξω ζαχαρωμένοι και μέσα φαρμάκι, και ύστερα απελπίζεσαι. Το να περνούν λογισμοί κακοί από τον άνθρωπο δεν είναι ανησυχητικό, γιατί μόνο στους Αγγέλους και στους τελείους δεν περνούν λογισμοί κακοί. Ανησυχητικό είναι, όταν ο άνθρωπος ισοπεδώση ένα κομμάτι της καρδιάς του και δέχεται τα λυκόφτερα – τα ταγκαλάκια. Εάν καμμιά φορά συμβή και αυτό, αμέσως εξομολόγηση, καλλιέργεια του αεροδρομίου και φύτεμα καρποφόρων δένδρων, για να γίνη η καρδιά πάλι Παράδεισος.
- type: h2
  initial:
    ru: ''
  text:
    ru: Δεύτερο Μέρος – Δικαιοσύνη Και Αδικία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μακάρι να με αδικούσαν όλοι οι άνθρωποι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ειλικρινά σάς λέω, την γλυκύτερη πνευματική χαρά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν ένιωσα μέσα στην αδικία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – Αποδοχή της αδικίας
- type: h2
  initial:
    ru: ''
  text:
    ru: Σωστή τοποθέτηση απέναντι στην αδικία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, όταν με αδικούν, η καρδιά μου σκληραίνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να μη σκληραίνη, ποτέ να μη σκέφτεσαι ότι φταίει ή πόσο φταίει ο άλλος που σε αδικεί, αλλά πόσο φταίς εσύ. Βλέπεις, όταν οι άνθρωποι μαλώνουν μεταξύ τους, όλοι τους λένε ότι έχουν δίκαιο, μόνον που παίρνουν περισσότερο δίκαιο απ᾿ όσο δικαιούνται, γι᾿ αυτό και διαφωνούν συνέχεια. Πηγαίνουν στην αστυνομία π.χ., και ο καθένας λέει: «μέ έδειρε ο τάδε» – δεν λέει πόσο τον έδειρε αυτός! – και του κάνει μήνυση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν σκεφτόμασταν ότι ο πιο αδικημένος είναι ο Χριστός, θα δεχόμασταν με χαρά την αδικία. Ενώ ήταν Θεός, κατέβηκε στην γη από πολλή αγάπη και κλείσθηκε εννιά μήνες στην κοιλιά της Παναγίας. Ύστερα, τριάντα χρόνια έζησε αθόρυβα. Από δεκαπέντε μέχρι τριάντα χρόνων δούλευε μαραγκός στους Εβραίους. Και τί εργαλεία είχαν τότε; Ξύλινα πριόνια χρησιμοποιούσαν, με κάτι καβίλιες ξύλινες. Του έδιναν και κάτι σανίδια... και Του έλεγαν: «Φτιάξε αυτό, φτιάξε εκείνο...». Και πώς να τα πλανίση; Πλανίζονταν μ᾿ εκείνα τα γύφτικα σίδερα, που χρησιμοποιούσαν τότε για πλάνες; Ξέρεις τί ζόρικα είναι; Άντε ύστερα, τρία χρόνια ταλαιπωρία! Ξυπόλυτος να πηγαίνη από εδώ–από εκεί, για να κηρύττη! Θεράπευε αρρώστους, με λάσπη άνοιγε τα μάτια των τυφλών, και αυτοί ζητούσαν πάλι σημεία. Έβγαζε τα δαιμόνια από τους δαιμονισμένους, αλλά δυστυχώς οι αχάριστοι άνθρωποι Του έλεγαν πώς είχε δαιμόνιο! Και ενώ τόσοι είχαν μιλήσει και προφητεύσει γι᾿ Αυτόν, τόσα θαύματα έκανε, και τελικά ονειδισμούς, σταύρωμα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό οι αδικημένοι είναι τα πιο αγαπημένα παιδιά του Θεού. Γιατί ως αδικημένοι έχουν στην καρδιά τους τον αδικημένο Χριστό και αγάλλονται στην εξορία και στην φυλακή σαν να βρίσκωνται στον Παράδεισο, διότι, όπου Χριστός εκεί Παράδεισος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να βρεθή κανείς με φορτίο μεγαλύτερο από αυτό που μπορεί να σηκώση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Θεός δεν επιτρέπει φορτίο πάνω από τις δυνάμεις μας. Οι αδιάκριτοι άνθρωποι φορτώνουν βαρύ φορτίο στους άλλους. Πολλές φορές ο Καλός Θεός αφήνει τους καλούς ανθρώπους στα χέρια των κακών, για να μαζέψουν μισθό ουράνιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το παράπονο, Γέροντα, έχει σχέση με την αχαριστία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί. Μπορεί μάλιστα κάποιος, ενώ τον φροντίζουν για το καλό του, να μην το καταλαβαίνη, να νιώθη αδικημένος και να παραπονήται. Αν δεν παρακολουθή τον εαυτό του, μπορεί, όταν κάνη ένα σφάλμα και του λένε να προσέχη, να νομίζη ότι τον αδικούν και να φθάνη στην αναίδεια. Μια αδελφή λ.χ. βάζει περισσότερο φάρμακο και καίει με το ράντισμα τα φύλλα από τις ελιές. Της κάνουν παρατήρηση καί, αντί να συναισθανθή το λάθος της και να πη «ευλόγησον», νιώθει αδικημένη και κλαίει. «Με αδικούν, λέει. Αν έπεφτε ακρίδα και χαλούσε τα δένδρα, δεν θα μιλούσαν, ενώ τώρα που τα χάλασα εγώ, φωνάζουν. Χριστέ μου, μόνον Εσύ με καταλαβαίνεις», και δώσ᾿ του δάκρυα! Μπορεί να νιώθη και χαρά, γιατί σκέφτεται ότι θα έχη μισθό από την αδικία που δέχτηκε και να ευγνωμονή τον Χριστό! Αυτό είναι μια λανθασμένη κατάσταση, είναι μεγάλη πλάνη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η χαρά από την αποδοχή της αδικίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν δέχωμαι ευχάριστα την επίπληξη για μια ζημιά που κάνω, αυτό που νιώθω είναι καθαρό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε, αν κάνης ζημιές και σε μαλώνουν και δεν γκρινιάζης, αλλά χαίρεσαι και λές: «δόξα Σοι ο Θεός, αυτό μου χρειαζόταν», θα έχης μισή χαρά. Αν όμως δεν κάνης ζημιές και σε μαλώνουν άδικα κι εσύ το δέχεσαι με καλό λογισμό, τότε θα έχης ολόκληρη την χαρά. Δεν λέω να επιδιώκης εσύ την αδικία, γιατί τότε το ταγκαλάκι θα σε ρίξη στην υπερηφάνεια, αλλά να δέχεσαι την αδικία, όταν έρχεται φυσιολογικά, και να χαίρεσαι που αδικείσαι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τέσσερα στάδια υπάρχουν στην αντιμετώπιση της αδικίας. Σε χτυπάει λ.χ. κάποιος άδικα. Αν βρίσκεσαι στο πρώτο στάδιο, το ανταποδίδεις. Αν βρίσκεσαι στο δεύτερο στάδιο, νιώθεις μέσα σου πολύ μεγάλη ταραχή, αλλά συγκρατιέσαι και δεν μιλάς. Στο τρίτο στάδιο δεν ταράζεσαι. Και στο τέταρτο νιώθεις πολλή χαρά, μεγάλη ψυχική αγαλλίαση. Όταν αδικήται κάποιος και αποδεικνύη ότι δεν φταίει, δικαιώνεται και ικανοποιείται. Τότε νιώθει μια κοσμική χαρά. Αν όμως αντιμετωπίζη την αδικία πνευματικά, με καλό λογισμό, και δεν φροντίζη να αποδείξη την αθωότητά του, αισθάνεται πνευματική χαρά. Δηλαδή τότε έχει μέσα του την θεϊκή παρηγοριά και κινείται στον χώρο της δοξολογίας. Ξέρετε τί χαρά έχει μια ψυχή, αν αδικηθή και δεν δικαιολογηθή, για να της πούν «μπράβο» ή «συγγνώμην»; Και χαίρεται περισσότερο τώρα που αδικείται, παρά αν δικαιωνόταν. Όσοι φθάνουν σε τέτοια κατάσταση, θέλουν να ευχαριστήσουν αυτόν που τους αδίκησε για την χαρά που τους έδωσε σ᾿ αυτήν την ζωή, αλλά και για την αιώνια που τους εξασφάλισε. Πόσο διαφέρει το πνευματικό από το κοσμικό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην πνευματική ζωή είναι ανάποδα τα πράγματα. Άμα κρατάς εσύ το άσχημο, τότε νιώθεις όμορφα. Άμα το δίνης στον άλλον, τότε νιώθεις άσχημα. Όταν δέχεσαι την αδικία και δικαιολογής τον πλησίον σου, δέχεσαι τον πολυαδικημένο Χριστό στην καρδιά σου. Τότε ο Χριστός μένει με το ενοικιοστάσιο[30]μέσα σου και σε γεμίζει με ειρήνη και αγαλλίαση. Για δοκιμάστε, βρέ παιδιά, να ζήσετε αυτήν την χαρά! Να μάθετε να χαίρεσθε με αυτήν την πνευματική χαρά, όχι με την κοσμική. Πάσχα θα έχετε τότε κάθε μέρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν υπάρχει μεγαλύτερη χαρά από την χαρά που νιώθεις, όταν δέχεσαι την αδικία. Μακάρι να με αδικούσαν όλοι οι άνθρωποι! Ειλικρινά σάς λέω, την γλυκύτερη πνευματική χαρά την ένιωσα μέσα στην αδικία. Ξέρετε πόσο χαίρομαι, όταν κάποιος με πη πλανεμένο; «Δόξα Σοι ο Θεός, λέω, από αυτό έχω μισθό, ενώ, αν με πούν άγιο, χρωστάω». Γλυκύτερο πράγμα από την αδικία δεν υπάρχει!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένα πρωί στο Καλύβι χτύπησε κάποιος το σιδεράκι στην πόρτα. Κοίταξα από το παράθυρο να δώ ποιός είναι, γιατί δεν ήταν ακόμη η ώρα να ανοίξω. Είδα έναν νέο με φωτεινό πρόσωπο και κατάλαβα ότι είχε βιώματα πνευματικά, αφού τον πρόδιδε η Χάρις του Θεού. Γι᾿ αυτό, αν και ήμουν απασχολημένος, διέκοψα αυτό που έκανα, άνοιξα την πόρτα, τον πήρα μέσα, του πρόσφερα ένα νερό και με τρόπο άρχισα να τον ρωτάω για την ζωή του, γιατί έβλεπα ότι είχε πνευματικό περιεχόμενο. «Τί δουλειά κάνεις, παλληκάρι;», τον ρώτησα. «Τί δουλειά, πάτερ; μου λέει. Εγώ στην φυλακή μεγάλωσα. Τα περισσότερα χρόνια της ζωής μου εκεί τα πέρασα. Τώρα είμαι είκοσι έξι χρόνων». «Καλά, βρέ παλληκάρι, τί έκανες, και σε έκλειναν φυλακή;», τον ρώτησα. Κι εκείνος μου άνοιξε την καρδιά του: «Από μικρός, μου είπε, πονούσα πολύ, όταν έβλεπα δυστυχισμένους ανθρώπους. Ήξερα όλους τους πονεμένους, όχι μόνον από την ενορία μου, αλλά και από άλλες ενορίες. Επειδή ο παπάς της ενορίας μας με τους επιτρόπους μάζευαν συνέχεια χρήματα και έφτιαχναν κτίρια, αίθουσες κ.λπ. ή έκαναν διάφορους εξωραϊσμούς, είχαν παραμεληθή τελείως οι φτωχές οικογένειες. Εγώ δεν κρίνω εάν ήταν απαραίτητα αυτά που έφτιαχναν, αλλά έβλεπα να υπάρχουν πολλοί δυστυχισμένοι άνθρωποι. Πήγαινα λοιπόν κρυφά και έκλεβα από τα χρήματα που μάζευαν από τους εράνους. Έπαιρνα αρκετά· δεν τα έπαιρνα όλα. Ύστερα αγόραζα τρόφιμα, διάφορα πράγματα, τα άφηνα κρυφά έξω από τα σπίτια των φτωχών και αμέσως, για να μην πιάσουν άλλον άδικα, πήγαινα στην αστυνομία και έλεγα: «εγώ έκλεψα τα χρήματα από την εκκλησία και τα ξόδεψα», χωρίς να πω τίποτε άλλο. Με άρχιζαν στο ξύλο και στο βρισίδι, «αλήτη, κλέφτη»· εγώ σιωπούσα. Με έκλειναν μετά στην φυλακή. Αυτή η δουλειά γινόταν για χρόνια. Όλη η πόλη όπου έμενα – τριάντα χιλιάδες κάτοικοι – και άλλες πόλεις με είχαν μάθει, και «αλήτη» με ανέβαζαν, «κλέφτη» με κατέβαζαν. Εγώ σιωπούσα και ένιωθα χαρά. Κάποτε μάλιστα με είχαν κλείσει στην φυλακή τρία ολόκληρα χρόνια. Μερικές φορές με έκλειναν άδικα στην φυλακή καί, όταν έπιαναν τον ένοχο, με άφηναν. Αν δεν τον έπιαναν, καθόμουν μέσα, όσο έπρεπε να καθήση εκείνος. Γι᾿ αυτό σού είπα, πάτερ μου, ότι τα περισσότερα χρόνια της ζωής μου τα πέρασα στις φυλακές». Αφού τον άκουσα με προσοχή, του είπα: «Βρέ παλληκάρι, όσο καλό και αν φαίνεται αυτό, δεν είναι καλό και να μην το ξανακάνης. Άκου τί θα σού πώ. Θα με ακούσης;». «Θα σε ακούσω, πάτερ», μου λέει. «Να απομακρυνθής από αυτήν την πόλη, του λέω, να πάς σε άγνωστο περιβάλλον, στην τάδε πόλη, και εγώ θα φροντίσω να συνδεθής με καλούς ανθρώπους. Να εργάζεσαι και να βοηθάς, όσο μπορείς, τους πονεμένους από το υστέρημά σου, επειδή αυτό έχει μεγαλύτερη αξία. Αλλά, και όταν κανείς δεν έχη τίποτε να δώση σε έναν φτωχό και πονάη η καρδιά του, τότε κάνει ανώτερη ελεημοσύνη, διότι κάνει ελεημοσύνη με το αίμα της καρδιάς του. Γιατί, εάν είχε κάτι και το έδινε, θα αισθανόταν και χαρά, ενώ, όταν δεν έχη να δώση, αισθάνεται πόνο στην καρδιά». Μου υποσχέθηκε ότι θα ακούση την συμβουλή μου και έφυγε χαρούμενος. Έπειτα από επτά μήνες παίρνω ένα γράμμα του από τις φυλακές του Κορυδαλλού, στο οποίο έγραφε τα εξής: «Ασφαλώς, πάτερ μου, θα απορήσης, που σού γράφω πάλι από την φυλακή μετά από τόσες συμβουλές που μου έδωσες και μετά τις υποσχέσεις που σού έδωσα. Μάθε ότι αυτήν την φορά υπηρετώ μια φυλάκιση την οποία είχα υπηρετήσει· κάποιο λάθος έγινε. Ευτυχώς που δεν υπάρχει ανθρώπινη δικαιοσύνη, γιατί θα αδικούνταν οι πνευματικοί άνθρωποι, επειδή θα έχαναν τον ουράνιο μισθό». Όταν διάβασα αυτά τα τελευταία λόγια, θαύμασα αυτόν τον νέο, που είχε πάρει τόσο ζεστά την πνευματική ζωή και είχε συλλάβει τόσο βαθιά το βαθύτερο νόημα της ζωής! Δια Χριστόν κλέφτης! Μέσα του είχε Χριστό. Δεν μπορούσε να φρενάρη τον εαυτό του από την χαρά που ένιωθε. Θεία παλαβομάρα, πανηγύρι είχε!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, από το ρεζίλι ερχόταν η χαρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από την αδικία ερχόταν η χαρά. Κοσμικός άνθρωπος ήταν, ούτε Συναξάρια ούτε Πατερικά είχε διαβάσει καί, ενώ έτρωγε άδικα ξύλο, τον έκλειναν στην φυλακή, τον είχαν μέσα στην πόλη για αλήτη, για παλιόπαιδο, για κλέφτη, γινόταν ρεζίλι, αυτός δεν μιλούσε και τα αντιμετώπιζε όλα τόσο πνευματικά! Νέος άνθρωπος, και δεν φρόντιζε να αποκατασταθή, αλλά πώς να βοηθήση τους άλλους! Τους μεγάλους κλέφτες πολλές φορές δεν τους κλείνουν ούτε μια φορά στην φυλακή, ενώ αυτόν τον δόλιο τον φυλάκισαν για την ίδια κλοπή δυο φορές και για άλλες κλοπές τον φυλάκισαν άδικα, μέχρι να βρουν τον πραγματικό κλέφτη! Την χαρά όμως που είχε αυτός δεν την είχαν όλοι οι κάτοικοι της πόλης. Τριάντα χιλιάδες χαρές δεν συμπλήρωναν την δική του χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό λέω ότι ένας πνευματικός άνθρωπος δεν έχει θλίψεις. Όταν η αγάπη αυξηθή και καή η καρδιά από τον θείο έρωτα, δεν μπορεί να σταθή πλέον θλίψη. Η μεγάλη αγάπη προς τον Χριστό υπερνικά τους πόνους και τις ταλαιπωρίες που του προξενούν οι άνθρωποι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το κέρδος από την αδικία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ενοχοποιούμαι από κάτι που θα πη για μένα μία αδελφή, ενώ δεν φταίω, δεν το σηκώνω και ψυχραίνομαι μαζί της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για στάσου λίγο! Τί λέει το Τυπικό της Εκκλησίας γι᾿ αυτό; Σε ποιά περίπτωση υπάγεται; Εσύ πώς βοηθιέσαι περισσότερο; Πές ότι συμβαίνει έτσι όπως το λές, ότι δεν φταίς. Έ, αν σε αδίκησαν, κέρδος έχεις. Και η άλλη, αν είπε κάτι εις βάρος σου, για να δικαιολογηθή, μετά την πειράζει, την ελέγχει η συνείδηση, μετανοεί και σε βλέπει με περισσότερη αγάπη. Δυό-τρία καλά μαζί. Έτσι σού δίνεται η ευκαιρία να πλουτίσης και να γίνης αρχοντοπούλα, να μην είσαι τσιγγανάκι. Αφού ο Θεός σού δίνει την δυνατότητα να γίνης αρχοντοπούλα και να μπορής να δίνης και σε κανέναν άλλο, γιατί θέλεις να μένης τσιγγανάκι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Επιμένει ο λογισμός να ρωτήσω την αδελφή πώς κατάλαβε την συμπεριφορά μου και με ενοχοποίησε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βέβαια, αντέχει το ταγκαλάκι να δη να έχης κάτι στην άκρη; Σε πιέζει να ζητήσης να βρής το δίκιο σου, για να διώξης από μέσα σου τον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θα ήθελα κάποτε-κάποτε να μου χαρίζωνται οι άλλοι, όταν κάνω ένα σφάλμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί, θέλεις να σε δικαιολογούν; Ας πούμε ότι σε δικαιολογούν. Εσύ κερδίζεις πνευματικά ή ζημιώνεσαι με αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ζημιώνομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είχες ένα μαγαζί, θα ήθελες να κερδίζης ή να ζημιώνεσαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να κερδίζω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν λοιπόν στα υλικά, στα μάταια, πράγματα δεν θέλουμε να ζημιωθούμε, πόσο μάλλον στα πνευματικά πρέπει να κοιτάμε πώς να μη ζημιωθούμε! Οι κοσμικοί άνθρωποι κοιτούν το υλικό κέρδος και δεν το αφήνουν να πάη χαμένο· οι πνευματικοί άνθρωποι είναι σωστό να πετάνε το πνευματικό κέρδος; Αλλά, και αν οι κοσμικοί ξοδεύουν τα χρήματα που έχουν, σπαταλούν τουλάχιστον υλικά πράγματα, ενώ εμείς, όταν δεν δεχώμαστε την αδικία, σπαταλούμε πνευματικά πράγματα, ουράνια. Τα τρώμε όλα εδώ. Γιατί να ανταλλάσσουμε τα ουράνια με τα επίγεια; Ύστερα οι καημένοι οι κοσμικοί έχουν και άγνοια πνευματική, ενώ εμείς γνωρίζουμε· γίναμε μοναχοί, για να κερδίσουμε τα ουράνια, και τελικά για αλλού ξεκινήσαμε και αλλού πάμε. Για έναν κοσμικό το να εκτελεσθή ή να δαρθή ή απλώς να διωχθή άδικα, είναι πολύ οδυνηρό. Εμείς όμως πρέπει να τα ζητάμε αυτά και να τα υπομένουμε για την αγάπη του Χριστού. Να επιδιώκουμε την ατιμία, την περιφρόνηση, την ύβρη, γιατί φέρνουν κέρδη στην ψυχή μας. Ένας οικογενειάρχης λ.χ. έχει ανάγκες και ζητά να δικαιωθή, γιατί σκέφτεται πώς θα ζήσουν και αυτός και τα καημένα τα παιδιά του, αν χάση την υπόληψή του ή αν χρεωκοπήση. Γι᾿ αυτό οι κοσμικοί έχουν ελαφρυντικά, ενώ εμείς δεν έχουμε ελαφρυντικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν μας αδικούν κι εμείς δεχώμαστε την αδικία, τότε στην ουσία ευεργετούμαστε. Με συκοφαντούν λ.χ. ότι έκανα κάποιο έγκλημα και με κλείνουν στην φυλακή άδικα; Εντάξει. Έχω αναπαυμένη την συνείδησή μου, αφού δεν έκανα το έγκλημα, έχω και ουράνιο μισθό. Υπάρχει μεγαλύτερη ευεργεσία; Δεν γογγύζω, αλλά δοξολογώ τον Θεό: «Πώς να Σε ευχαριστήσω, Θεέ μου, που δεν έκανα το έγκλημα; Αν το είχα κάνει, δεν θα άντεχα τις τύψεις της συνειδήσεως». Τότε γίνεται Παράδεισος η φυλακή. Με χτύπησε κάποιος άδικα; «Δόξα Σοι, Κύριε! Ίσως ξοφλήσω κάποια αμαρτία· κάποτε και εγώ είχα χτυπήσει κάποιον». Με έβρισαν άδικα; «Δόξα Σοι, Κύριε! Το δέχομαι για την αγάπη Σου, που ραπίσθηκες και υβρίσθηκες για χάρη μου».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αποταμίευση στον Ουρανό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στενοχωριέμαι, όταν οι άλλοι δεν έχουν καλή γνώμη για μένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά που μου το είπες! Από σήμερα θα κάνω ευχή οι άλλοι να μην έχουν ποτέ καλή γνώμη για σένα, γιατί αυτό σε συμφέρει, καλό μου παιδί. Οικονομάει ο Θεός να μας αδικήσουν οι άνθρωποι ή να μας πούν καμμιά κουβέντα, για να εξοφλήσουμε μερικές αμαρτίες μας ή για να αποταμιεύσουμε κάτι στην άλλη ζωή. Δεν μπορώ να καταλάβω, πώς την θέλετε εσείς την πνευματική ζωή; Δεν έχετε καταλάβει ακόμη το πνευματικό σας συμφέρον και θέλετε εξόφληση εδώ· για τον Ουρανό δεν αφήνετε τίποτε. Πώς τα παίρνεις έτσι τα πράγματα; Τί διαβάζεις; Ευεργετινό[31]διαβάζεις; Εκεί δεν σού λέει τί πρέπει να κάνης; Ευαγγέλιο διαβάζεις; Να διαβάζης κάθε μέρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάνω ένα καλό, λυπάμαι, αν δεν το αναγνωρίσουν οι άλλοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καλά, εσύ τί θέλεις, αναγνώριση από τον Χριστό ή από τους ανθρώπους; Πιό πολύ όφελος δεν έχεις από την αναγνώριση του Χριστού; Σε τί σε βοηθάει να σε προσέχουν οι άνθρωποι; Αν τώρα σού αναγνωρίζουν το καλό που κάνεις, στην άλλη ζωή θα ακούσης: «Απέλαβες συ τα αγαθά σου»[32]. Πρέπει να χαιρώμαστε, όταν δεν αναγνωρίζουν οι άλλοι τους κόπους μας και δεν μας ανταμείβουν, γιατί αυτούς τους κόπους τους λαμβάνει υπ᾿ όψιν ο Θεός και θα μας ανταμείψη με πληρωμή αιώνια. Αφού υπάρχει θεία ανταπόδοση, να κοιτάξουμε να βάλουμε καμμιά δραχμή στο Ταμιευτήριο του Θεού. Πρέπει να δεχώμαστε την αδικία σαν μεγάλη ευλογία, γιατί αποταμιεύουμε από αυτήν ουράνια ευλογία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, δέχεται κανείς την αδικία, όχι γιατί σκέφτεται την μέλλουσα Κρίση, αλλά γιατί αυτό το θεωρεί καλό, είναι σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, και αυτό εκεί δεν καταλήγει; Μόνο να προσέξη να μην το κάνη, για να γίνη απλώς καλός άνθρωπος, γιατί έτσι κάνουν οι Ευρωπαίοι[33]. Να σκέφτεται πώς είναι εικόνα Θεού και πρέπει να μοιάση στον Πλάστη του. Αν υπάρχη αυτό το κίνητρο, βαδίζει σωστά. Διαφορετικά κινδυνεύει να πέση στον ανθρωπισμό[34]των Ευρωπαίων.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγία υποκρισία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πόσοι είναι οι αναχωρητές[35]στο Άγιον Όρος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν ξέρω· λένε ότι είναι επτά[36]. Εδώ και μερικά χρόνια είναι πολύ δύσκολο να βρη κανείς τόπο ήσυχο, για να ασκητέψη. Γι᾿ αυτό μερικοί Πατέρες, όταν υπήρχαν ακόμη ιδιόρρυθμα[37]μοναστήρια στο Άγιον Όρος, έβρισκαν άλλον τρόπο να ζήσουν την άσκηση. Π.χ. έλεγαν: «δέν με αναπαύει εδώ, θα πάω σε κανένα ιδιόρρυθμο να δουλέψω, για να μαζέψω χρήματα», και οι άλλοι το πίστευαν. Πήγαιναν σε ιδιόρρυθμο, δούλευαν εκεί τρείς-τέσσερις μήνες και ύστερα ζητούσαν μεγάλη αύξηση. Επειδή δεν τους την έδιναν, έλεγαν: «Δεν με συμφέρει· θα φύγω». Έπαιρναν λίγο παξιμάδι και πήγαιναν, κρύβονταν σε καμμιά σπηλιά και ασκήτευαν. Οι άλλοι είχαν την εντύπωση ότι πήγαν και δουλεύουν αλλού. Και αν ρωτούσαν στο μοναστήρι: «τί γίνεται, πέρασε εκείνος ο Πατέρας;», έλεγαν: «Ναί, πέρασε, αλλά τί ιδιότροπος που ήταν! Ήθελε να μαζέψη από ᾿δώ χρήματα. Ζητούσε αύξηση. Καλόγερος, και να ζητάη αύξηση! Τί καλόγερος είναι αυτός;». Οπότε, ωφελείτο ο αναχωρητής και από την άσκηση που έκανε και από τις κατηγορίες των άλλων, ωφελείτο και από τους κλέφτες. Γιατί μάθαιναν οι κλέφτες ότι ο τάδε έχει χρήματα και πήγαιναν στην σπηλιά, τον ταλαιπωρούσαν, αλλά τελικά δεν έβρισκαν τίποτε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορώ να μιμηθώ την αρετή μιας αδελφής, όταν κρύβεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χαμένο τόχει να μην κρυφθή; Οι Άγιοι έκαναν μεγαλύτερο αγώνα, για να κρύψουν την αρετή τους, παρά για να την αποκτήσουν. Ξέρετε τί έκαναν οι δια Χριστόν σαλοί; Ξέφευγαν πρώτα από την υποκρισία του κόσμου και έμπαιναν στον χώρο της ευαγγελικής αλήθειας. Αλλά και αυτό δεν τους έφθανε, γι᾿ αυτό προχωρούσαν στην αγία υποκρισία για την αγάπη του Χριστού. Ύστερα δεν τους απασχολούσε ό,τι κι αν τους έκαναν, ό,τι κι αν τους έλεγαν οι άλλοι. Χρειάζεται όμως πολύ μεγάλη ταπείνωση, για να το κάνης αυτό. Ενώ ένας κοσμικός άνθρωπος, αν του πη καμμιά κουβέντα ο άλλος, θίγεται ή, αν δεν τον επαινέση για κάτι που κάνει, στενοχωριέται, αυτοί χαίρονταν, όταν οι άνθρωποι είχαν χαλασμένο λογισμό γι᾿ αυτούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιά υπήρχαν Πατέρες που έκαναν ακόμη και τον δαιμονισμένο, για να κρύψουν την αρετή τους και να χαλάσουν οι άλλοι τον καλό λογισμό που είχαν γι᾿ αυτούς. Όταν ήμουν στην Μονή Φιλοθέου[38], που ήταν τότε ιδιόρρυθμο, ήταν ένας Πατέρας που ασκήτευε προηγουμένως στην Βίγλα[39]. Αυτός, μόλις κατάλαβε ότι οι Πατέρες εκεί είχαν πάρει μυρωδιά την άσκησή του και την πνευματική του προκοπή, έφυγε με την ευλογία του πνευματικού του. «Άντε, τους είπε, βαρέθηκα να τρώω εδώ μουχλιασμένο παξιμάδι. Θα πάω σε κανένα ιδιόρρυθμο, να τρώω και κρέας, να ζήσω σαν άνθρωπος! Χαμένο τόχω να μείνω εδώ;». Και ήρθε στην Μονή Φιλοθέου και έκανε τον δαιμονισμένο. Άκουσαν οι παραδελφοί[40]του ότι δαιμονίσθηκε και έλεγε ο ένας στον άλλον: «Κρίμα, ο καημένος δαιμονίσθηκε. Έμ, επόμενο ήταν να δαιμονισθή. Έφυγε από ᾿δώ, γιατί βαρέθηκε το μουχλιασμένο παξιμάδι, και πήγε σε ιδιόρρυθμο, για να τρώη κρέας». Αυτός τί έκανε; Παραπάνω από είκοσι πέντε χρόνια ούτε μαγείρευε ούτε κοιμόταν. Όλη την νύχτα γύριζε στους διαδρόμους με ένα φανάρι, για να μην κοιμάται. Όταν κουραζόταν, ακουμπούσε λίγο στον τοίχο καί, μόλις τον έπαιρνε ο ύπνος, πετιόταν, έλεγε για λίγο ψιθυριστά την ευχή «Κύριε Ιησού Χριστέ...» και μετά την συνέχιζε νοερά. Καμμιά φορά του ξέφευγε και ακουγόταν η ευχή. Όταν συναντούσε κανέναν αδελφό, του έλεγε: «Εύχου, εύχου να φύγη το δαιμόνιο». Έτσι όλοι τον είχαν για δαιμονισμένο. Ένα μικρό καλογέρι, δεκαπέντε χρόνων, μου είπε μια μέρα: «Άντε τον δαιμονισμένο!». «Μήν το λές αυτό, του είπα· αυτός έχει πολλή αρετή, αλλά κάνει τον δαιμονισμένο». Μετά τον είχε σε ευλάβεια. Όταν πέθανε, τον βρήκαν οι Πατέρες να κρατάη στα χέρια του ένα χαρτί στο οποίο είχε γράψει το όνομα κάθε αδελφού και δίπλα ένα παρατσούκλι, για να διώξη, και πεθαμένος ακόμη, και τον παραμικρό καλό λογισμό που μπορεί να είχε κάποιος γι᾿ αυτόν. Τελικά ευωδίασε. Βλέπεις, αυτός πήγε να κρυφθή, αλλά η Χάρις του Θεού τον πρόδωσε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό δεν πρέπει να βγάζη κανείς συμπεράσματα για έναν άνθρωπο από αυτό που φαίνεται, εάν δεν μπορή να διακρίνη αυτό που κρύβεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Η δικαιολογία διώχνει την Χάρη του Θεού
- type: h2
  initial:
    ru: ''
  text:
    ru: Η δικαιολογία εμποδίζει την πνευματική πρόοδο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, όταν λένε ότι η δικαιολογία δεν υπάρχει στην Αγία Γραφή, τί εννοούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ότι δεν δικαιολογείται κατά κάποιον τρόπο η δικαιολογία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, δικαιολογούμαι, εκ των υστέρων σκέφτομαι ότι η δικαιολογία δεν είναι ίδιον του μοναχού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι απλώς δεν είναι ίδιον του μοναχού η δικαιολογία, αλλά δεν έχει καμμιά σχέση με την πνευματική ζωή. Πρέπει να καταλάβω ότι, όταν δικαιολογούμαι, βρίσκομαι σε λανθασμένη κατάσταση. Κόβω την επικοινωνία με τον Θεό και στερούμαι την θεία Χάρη, γιατί η θεία Χάρις δεν έρχεται σε λανθασμένη κατάσταση. Από την στιγμή που ο άνθρωπος δικαιολογεί τα αδικαιολόγητα, απομονώνεται από τον Θεό. Μπαίνει μόνωση, ...καουτσούκ, ανάμεσα στον άνθρωπο και στον Θεό. Μπορεί να περάση το ρεύμα μέσα από το καουτσούκ; Όχι. Απομονώνεται. Ισχυρότερο μονωτικό από την δικαιολογία δεν υπάρχει για την θεία Χάρη! Είναι σαν να χτίζης έναν τοίχο και να χωρίζης τον εαυτό σου από τον Θεό, οπότε κόβεις κάθε σχέση μαζί Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, συχνά λέτε: «Να προσπαθήσουμε να πιάσουμε τουλάχιστον την πνευματική βάση». Ποιά είναι η πνευματική βάση;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η ταπεινή αναγνώριση του σφάλματος και να μη δικαιολογήται εν γνώσει του τουλάχιστον ο άνθρωπος, όταν φταίη και του κάνουν παρατήρηση. Το να μη δικαιολογήται, όταν δεν φταίη και τον κατηγορούν, αυτό είναι το άριστα. Όποιος δικαιολογεί τον εαυτό του, και προκοπή δεν κάνει, αλλά και εσωτερικά δεν αναπαύεται. Δεν θα μας κρεμάση ο Θεός για ένα σφάλμα που κάναμε, αλλά να μη δικαιολογούμε τον εαυτό μας για το σφάλμα και το θεωρούμε φυσικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν μου πούν ότι έσφαλα σε κάτι, αλλά δεν μπορώ να καταλάβω πόσο έσφαλα, να ρωτήσω, ώστε άλλη φορά να προσέξω, ή να σιωπήσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν πιάσης ότι έσφαλες είκοσι πέντε τοις εκατό, ενώ έσφαλες πέντε, δεν έχεις κέρδος; Βάλε περισσότερο, για να είσαι μέσα. Αυτή είναι η πνευματική εργασία που πρέπει να κάνης: Να βρίσκης το σφάλμα σου, να πιάνης τον εαυτό σου. Αλλιώς πιάνεσαι από τον εαυτό σου, δικαιώνεις τον εαυτό σου, αλλά ανάπαυση δεν έχεις.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, κάποιος έχη την συνήθεια να δικαιολογήται, αλλά μετά αναγνωρίζη το λάθος του και ελεεινολογή τον εαυτό του, αυτό τον ωφελεί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τουλάχιστον του μένει η πείρα καί, αν την αξιοποιήση, θα ωφεληθή. Και αν πη ο Θεός: «αφού το κατάλαβε και μετάνοιωσε, ας του δώσω κάτι», τότε θα πάρη και κάτι από άλλο ταμείο, από το ταμείο της μετανοίας.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η δικαιολογία οφείλεται στον εγωισμό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν δεν δικαιολογώ τους άλλους για μια πράξη τους, αυτό σημαίνει ότι έχω σκληρή καρδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν δικαιολογείς τους άλλους και δικαιολογείς τον εαυτό σου; Μεθαύριο και ο Χριστός δεν θα σε δικαιολογήση. Μπορεί σε μια στιγμή η καρδιά του ανθρώπου να γίνη σκληρή σαν πέτρα, αν φερθή με κακία, και σε μια στιγμή να γίνη πολύ τρυφερή, αν φερθή με αγάπη. Να αποκτήσης μητρική καρδιά. Βλέπεις, η μάνα όλα τα συγχωρεί και καμμιά φορά κάνει πώς δεν βλέπει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όποιος κάνει σωστή πνευματική εργασία, για όλους βρίσκει ελαφρυντικά, όλους τους δικαιολογεί, ενώ τον εαυτό του ποτέ δεν τον δικαιολογεί, ακόμη και όταν έχη δίκαιο. Πάντοτε λέει ότι φταίει, γιατί σκέφτεται ότι δεν αξιοποιεί τις ευκαιρίες που του δίνονται. Βλέπει λ.χ. έναν να κλέβη και σκέφτεται ότι και ο ίδιος, αν δεν είχε βοηθηθή, θα έκλεβε περισσότερο από αυτόν και λέει: «Ο Θεός εμένα με βοήθησε, αλλά εγώ οικειοποιήθηκα τα δώρα του Θεού. Αυτό είναι μεγαλύτερη κλεψιά. Η διαφορά είναι ότι του άλλου η κλεψιά φαίνεται, ενώ η δική μου δεν φαίνεται». Έτσι καταδικάζει τον εαυτό του και κρίνει με επιείκεια τον συνάνθρωπό του. Ή, αν δη στον άλλον ένα ελάττωμα, είτε μικρό είτε μεγάλο, τον δικαιολογεί, βάζοντας καλούς λογισμούς. Σκέφτεται ότι και αυτός έχει πολλά ελαττώματα, τα οποία βλέπουν οι άλλοι. Γιατί, αν ψάξη κανείς, βρίσκει πολλά στραβά στον εαυτό του, ώστε μπορεί εύκολα να δικαιολογή τον άλλον. Πόσα και πόσα δεν έχουμε κάνει! «Αμαρτίας νεότητός μου και αγνοίας μου μη μνησθής, Κύριε»[41].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, μου ζητήσουν μια εξυπηρέτηση και την κάνω πρόθυμα, αλλά πάνω στην βιασύνη κάνω μια μικρή ζημιά και μου κάνουν παρατήρηση, δικαιολογώ τον εαυτό μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πήγες να κάνης ένα καλό, έκανες και μια μικρή ζημιά. Δέξου την παρατήρηση για την μικρή ζημιά, για να λάβης ολόκληρη την αμοιβή. Ο διάβολος είναι πολύ πονηρός. Την τέχνη του την ξέρει άριστα. Την πείρα τόσων χρόνων να μην την αξιοποιήση! Σε βάζει να δικαιολογηθής, για να χάσης την ωφέλεια από το καλό που έκανες. Όταν δής έναν άνθρωπο καταϊδρωμένο να σηκώνη στον ώμο του ένα φορτίο κι εσύ πάς να του το πάρης, για να τον ελαφρώσης, έ, αυτό είναι κάπως φυσικό. Είδες το βάρος που κουβαλούσε, κινήθηκες από φιλότιμο και έτρεξες να τον βοηθήσης. Το να σηκώσης όμως μια κουβέντα που θα σού πη ο άλλος άδικα, αυτό έχει ψωμί. Άν, όταν μας κάνουν μια παρατήρηση, αμέσως δικαιολογούμαστε, αυτό φανερώνει ότι έχουμε ακόμη μέσα μας ολοζώντανο το κοσμικό φρόνημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, που οφείλεται η δικαιολογία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Στον εγωισμό. Η δικαιολογία είναι πτώση και διώχνει την Χάρη του Θεού. Πρέπει όχι μόνο να μη δικαιολογήται κανείς, αλλά και να αγαπήση την αδικία που γίνεται εις βάρος του. Αυτή η δικαιολογία μας έβγαλε από τον Παράδεισο. Έτσι δεν το έπαθε ο Αδάμ; Όταν τον ρώτησε ο Θεός: «μήπως έφαγες από το δένδρο που σού είπα να μη φάς;», εκείνος δεν είπε: «ήμαρτον, Θεέ μου, ναί, έσφαλα», αλλά δικαιολογήθηκε. «Η γυναίκα που μου έδωσες, είπε, αυτή μου έδωσε και έφαγα». Σαν να έλεγε: «Εσύ φταίς που έπλασες την Εύα»! Μήπως ήταν υποχρεωμένος ο Αδάμ σ᾿ αυτό το θέμα να ακούση την Εύα; Ρωτάει ο Θεός και την Εύα κι εκείνη απαντάει: «Το φίδι με απάτησε»[42]. Αν έλεγε ο Αδάμ: «ήμαρτον, Θεέ μου, έσφαλα» και αν έλεγε και η Εύα: «εγώ έσφαλα», όλα θα τακτοποιούνταν. Αλλά αμέσως δικαιολογία-δικαιολογία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί φταίει, όταν κάποιος δεν καταλαβαίνη πόσο κακό είναι η δικαιολογία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί φταίει; Ότι φταίει! Όταν κανείς δικαιολογή συνεχώς τον εαυτό του και νομίζη ότι οι άλλοι δεν τον καταλαβαίνουν, ότι όλοι είναι άδικοι και αυτός είναι που πάσχει, είναι το θύμα, από ᾿κεί και πέρα είναι ανεξέλεγκτος. Και το παράξενο μερικές φορές ποιό είναι; Ενώ ο ίδιος έχει αδικήσει και φταίει, λέει: «Εγώ θα την δεχόμουν την αδικία, αλλά δεν θέλω να κολασθή ο άλλος». Πάει δηλαδή να δικαιολογηθή, δήθεν από... αγάπη, για να έρθη σε συναίσθηση ο άλλος, από τον οποίο νομίζει ότι αδικήθηκε, και να μην κολασθή! Ή αρχίζει να δίνη ένα σωρό εξηγήσεις, μην τυχόν καταλάβη ο άλλος κάτι λάθος καί... κολασθή!  Βλέπετε ο διάβολος τί λεπτή εργασία κάνει;'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος δικαιολογείται δεν μπορεί να βοηθηθή πνευματικά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχω παρατηρήσει ότι σήμερα μικροί-μεγάλοι όλα τα δικαιολογούν με έναν λογισμό σατανικό. Όλα ο διάβολος τους τα ερμηνεύει με τον δικό του τρόπο, και έτσι βρίσκονται έξω από την πραγματικότητα. Η δικαιολογία είναι σατανική ερμηνεία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς γίνεται, Γέροντα, μερικοί σε κάθε λόγο να βρίσκουν αντίλογο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ώ, είναι φοβερό να συζητάς με έναν άνθρωπο που συνήθισε να δικαιολογήται! Είναι σαν να μιλάς με έναν δαιμονισμένο! Όσοι δικαιολογούνται – ο Θεός να με συγχωρέση – έχουν γέροντα τον διάβολο. Είναι βασανισμένοι άνθρωποι. Δεν έχουν μέσα τους ειρήνη. Το έχουν κάνει επιστήμη αυτό. Δηλαδή, όπως ένας κλέφτης δεν κοιμάται όλη νύχτα και σκέφτεται πώς θα τα καταφέρη για να κλέψη, έτσι και αυτοί συνέχεια σκέφτονται πώς να δικαιολογήσουν το ένα ή το άλλο σφάλμα τους. Ή, όπως κάποιος σκέφτεται πώς να βρη ευκαιρία να κάνη ένα καλό ή πώς να ταπεινωθή, αυτοί αντίθετα σκέφτονται πώς να δικαιολογήσουν τα αδικαιολόγητα. Δικηγόροι γίνονται! Δεν μπορείς να τα βγάλης πέρα μαζί τους. Είναι σαν να μιλάς με τον ίδιο τον διάβολο. Τί έχω πάθει με κάποιον! Ενώ του λέω: «εκείνο που κάνεις είναι στραβό, το άλλο πρέπει να το προσέξης, δεν πάς καλά, πρέπει να κάνης αυτό κι αυτό...», κι εκείνος για το καθετί βρίσκει δικαιολογίες, στο τέλος μου λέει: «Δεν μου είπες τί να κάνω»! «Βρέ χρυσέ μου άνθρωπε, τόσες ώρες τί λέμε; Λέμε τα σφάλματά σου, ότι δεν πάς καλά, κι εσύ συνέχεια δικαιολογείσαι. Τρείς ώρες τώρα με έσκασες, με έλειωσες! Πώς δεν σού είπα;». Να του λές παραδείγματα, για να του δώσης να καταλάβη ότι είναι σατανικός εγωισμός έτσι όπως αντιμετωπίζει τα πράγματα, ότι δέχεται δαιμονικές επιδράσεις καί, αν δεν αλλάξη, χάθηκε, και τελικά να λέη: «Δεν μου είπες τί να κάνω»! Αλήθεια, είναι να μη σκάσης; Αν είναι αδιάφορος κανείς, τα προσπερνάει όλα με το «δέν βαριέσαι». Αλλά, αν δεν είναι αδιάφορος, σκάζει. Εγώ τους μακαρίζω τους αδιάφορους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν θα θέλατε όμως, Γέροντα, σε καμμιά περίπτωση να είστε αδιάφορος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Βρέ παιδί, τουλάχιστον ο αδιάφορος δεν σκάει έτσι άσκοπα. Να υποφέρης για έναν πονεμένο, εκείνο έχει νόημα. Αλλά να λειώνης με αυτόν, να του λές τόσα και τόσα, και τελικά να σού λέη: «δέν μου είπες τί να κάνω» και να δικαιολογή τα αδικαιολόγητα! Έτσι από άνθρωπος καταλήγει δαίμονας! Φοβερό! Αν σκεφτόταν μόνον τον κόπο που κάνεις – άσε τον πόνο –, για να τον βοηθήσης, λίγο θα άλλαζε. Αφού σε βλέπει ότι υποφέρεις, κοπιάζεις, ταλαιπωρείσαι, δεν το λαμβάνει υπ᾿ όψιν!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, όταν δικαιολογήται κάποιος για μια αταξία που έκανε και του λές: «αυτό είναι δικαιολογία», και συνεχίζη να δικαιολογήται, για να αποδείξη ότι αυτό δεν είναι δικαιολογία, είναι δυνατόν να διορθωθή;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να διορθωθή; Καταλαβαίνει ότι είναι λάθος, γιατί βασανίζεται, αλλά από εγωισμό δεν θέλει να το παραδεχθή. Είναι πολύ φοβερό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αλλά λέει: «Δεν με βοηθάς· θέλω να με βοηθήσης· δεν με φωνάζεις να συζητήσουμε, με περιφρονείς».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έ, πάλι από τον εγωισμό ξεκινάει αυτό. Είναι δηλαδή σαν να λέη: «Εγώ δεν φταίω, εσύ φταίς που δεν πηγαίνω καλά»! Εκεί καταλήγει. Άφησέ τον· δεν χρειάζεται να ασχοληθή κανείς μ᾿ αυτόν, γιατί δεν βοηθιέται. Ούτε φέρει ευθύνη ο Πνευματικός ή ο Γέροντας ή η Γερόντισσα για μια τέτοια ψυχή. Είναι σατανικός εγωισμός αυτός· δεν είναι ανθρώπινος. Ανθρώπινο εγωισμό έχει εκείνος που δεν θα ταπεινωθή να πη «ευλόγησον», αλλά τουλάχιστον δεν θα μιλήση, για να δικαιολογηθή. Όποιος δικαιολογεί τον εαυτό του, όταν σφάλλη, μεταβάλλει την καρδιά του σε δαιμονικό καταφύγιο. Αν δεν συντρίψη το εγώ του, θα συνεχίζη να σφάλλη περισσότερο και θα συντρίβεται ανώφελα από τον εγωισμό του. Και όταν δεν ξέρη κανείς πόσο κακό είναι η δικαιολογία, έχει ελαφρυντικά. Αλλά, όταν ξέρη ή του το λένε οι άλλοι, τότε δεν έχει ελαφρυντικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θέλει πολλή προσοχή, όταν πάς να βοηθήσης κάποιον που έχει μάθει να δικαιολογήται, γιατί μερικές φορές γίνεται το εξής: Αφού δικαιολογείται, σημαίνει ότι έχει πολύ εγωισμό, οπότε, όταν του πής ότι αυτό που έκανε δεν είναι σωστό, θα πη και άλλα ψέματα και άλλες δικαιολογίες, ώσπου να σού αποδείξη κι εκείνο και το άλλο, για να μη θιχτή. Έτσι όμως γίνεσαι αιτία εσύ, που πήγες να του αποδείξης ότι σφάλλει, να γίνη πιο εγωιστής, πιο ψεύτης. Από την στιγμή που θα δής ότι συνεχίζει τις δικαιολογίες, δεν χρειάζεται να του αποδείξης τίποτε. Κάνε προσευχή να τον φωτίση ο Θεός.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αν δεν εξηγής, θα σε δικαιώση ο Θεός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, πολλές φορές, όταν μου κάνουν μια παρατήρηση, νομίζω πώς πρέπει να δώσω εξηγήσεις, και λέω: «Ναί, έτσι είναι, αλλά...».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί το θέλεις αυτό το «αλλά»; Το «αλλά» δεν έχει... αλάτι και όλα τα αλλοιώνει με την κακή έννοια. Να λές: «Ευλόγησον, με την ευχή σου άλλη φορά θα προσέχω».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος βγάλη ένα λανθασμένο συμπέρασμα για μια ενέργειά μου, χρειάζεται να εξηγήσω πώς κινήθηκα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν έχης πνευματική δύναμη, δηλαδή ταπείνωση, να δεχτής ότι έφταιξες και να μη μιλήσης. Άφησε να σε δικαιώση ο Θεός. Αν δεν μιλήσης εσύ, θα μιλήση μετά ο Θεός. Βλέπεις, ο Ιωσήφ[43], όταν τα αδέλφια του τον πούλησαν, δεν είπε: «Είμαι αδελφός τους· δεν είμαι δούλος· ο πατέρας μου μ᾿ αγαπούσε πιο πολύ από όλα τα παιδιά του». Δεν μίλησε, και μετά μίλησε ο Θεός και τον έκανε βασιλιά[44]. Τί νομίζεις, δεν πληροφορεί ο Θεός; Και αν ο Θεός για το συμφέρον σου δείξη την αλήθεια, καλά. Αν όμως δεν την δείξη, πάλι για το συμφέρον σου θα είναι.Όταν σε αδική κάποιος, να σκέφτεσαι ότι δεν σε αδικεί από κακία, αλλά επειδή έτσι είδε τα πράγματα. Ύστερα, αν δεν έχη κακία, ο Θεός θα τον πληροφορήση, θα καταλάβη ότι αδίκησε και θα μετανοήση. Μόνον όταν υπάρχη κακία, δεν πληροφορεί ο Θεός, γιατί η συχνότητα στην οποία εργάζεται ο Θεός είναι ταπείνωση-αγάπη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάνει, Γέροντα, να ζητάω εξηγήσεις μετά από μια παρεξήγηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χάλασε ο λογισμός σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν χάλασε ο λογισμός σου, δεν χρειάζεται να σού εξηγήση ο άλλος. Αν χάλασε ο λογισμός σου, καλό είναι να σού δοθή μια εξήγηση, για να μη χαλάση περισσότερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν δεν εξηγής, για να δικαιολογήσης τον εαυτό σου, αλλά λές πώς αντιμετώπισες ένα περιστατικό, πώς κινήθηκες κ.λπ.;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν χρειάζεται. Καλύτερα να λές «ευλόγησον», και να μην εξηγής. Εκτός αν σού ζητήσουν να δώσης εξηγήσεις, τότε ταπεινά να πής πώς έγινε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, πότε πρέπει να εξηγή κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν πρόκειται για παρεξήγηση που αφορά άλλους, τότε επιβάλλεται να εξηγήση κανείς, για να βοηθήση μια κατάσταση. Ή όταν είναι κανείς ευαίσθητος, έχη και λίγο εγωισμό και μπορή να καμφθή, αν δεν μιλήση, τότε καλύτερα είναι να εξηγήση πώς κινήθηκε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές, Γέροντα, δεν μπορούμε να ξεχωρίσουμε την δικαιολογία από την εξήγηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η δικαιολογία δεν φέρνει ανάπαυση στην ψυχή, ενώ η εξήγηση φέρνει ανάπαυση και ειρήνη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος μελετά σωστά τον εαυτό του δεν τον δικαιολογεί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς γίνεται, ενώ νιώθω την αδυναμία μου, να δικαιολογούμαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ένιωσες την αδυναμία σου, γι᾿ αυτό δικαιολογείσαι. Αν την είχες νιώσει, δεν θα δικαιολογούσες τον εαυτό σου. Αγαπούμε τον εαυτό μας· δεν θέλουμε να δυσκολευτούμε· δεν αγαπούμε τον κόπο. Θέλουμε πολλές φορές χωρίς κόπο να αποκτήσουμε περιουσία. Τουλάχιστον να αναγνωρίσουμε ότι, έτσι όπως αντιμετωπίζουμε τα πράγματα, δεν πάμε καλά πνευματικά και να ταπεινωθούμε. Αλλά ούτε κόπος ούτε αναγνώριση υπάρχει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί κάποιος να μελετά, να εξετάζη τον εαυτό του και να τον δικαιολογή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όποιος μελετά σωστά τον εαυτό του δεν τον δικαιολογεί. Και βλέπεις, είναι μερικοί έξυπνοι, τετραπέρατοι, που κάνουν τελικά τις μεγαλύτερες ανοησίες. Γιατί είναι και το βόλεμα. «Πώς με βολεύει, πώς με εξυπηρετεί εμένα».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτός που δικαιολογείται δεν βλέπει τις πτώσεις του στον αγώνα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ό,τι και αν κάνη, τον ξεγελά ο διάβολος και τα δικαιολογεί όλα, το θέλημα, το πείσμα, τον εγωισμό, το ψέμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν θα τον βοηθούσε να καθρεφτίζη τον εαυτό του στα Πατερικά βιβλία, και κυρίως στην Αγία Γραφή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για έναν που σκέφτεται σωστά, πνευματικά, λύνονται όλα τα προβλήματα μέσα από την Αγία Γραφή και τα Πατερικά βιβλία. Τα βλέπει μέσα εκεί ξεκάθαρα. Έναν όμως που δεν κάνει εργασία πνευματική και η ψυχή του δεν είναι εξαγνισμένη, δεν τον βοηθάει ούτε η Αγία Γραφή, γιατί όλα τα ερμηνεύει ανάποδα. Καλύτερα είναι να λέη τον λογισμό του στον πνευματικό του και να μην ερμηνεύη μόνος του αυτά που διαβάζει. Αν διαβάση λ.χ. Παλαιά Διαθήκη, μπορεί να ερμηνεύση πονηρά αυτά που θα διαβάση και να μολυνθή. Έχω προσέξει, μερικοί παίρνουν κάτι από τα πνευματικά που διαβάζουν και το ερμηνεύουν όπως τους βολεύει. Δεν είναι ότι δεν τους κόβει ή δεν καταλαβαίνουν αυτά που διαβάζουν, τα ερμηνεύουν όμως έτσι, για να δικαιολογήσουν τον εαυτό τους. Φοβερό πράγμα! Αλλά και τα πνευματικά που ακούν, έχω καταλάβει, σπάνια τα πιάνουν σωστά. Λέω, ας υποθέσουμε, ένα περιστατικό, για να τονίσω κάτι. Ενώ εγώ άλλο θέλω να τονίσω, μερικοί ψάχνουν να βρουν κάτι από όλο το περιστατικό, για να πιαστούν και να δικαιολογήσουν ένα κουσούρι, ένα σφάλμα τους, για να αναπαύσουν δηλαδή τα πάθη τους. Δεν σκέφτονται ότι αυτός, για τον οποίο κάτι ανέφερα, δεν πρόσεξε και κατέληξε εκεί που κατέληξε, αλλά λένε: «αφού υπάρχουν άνθρωποι σε τόσο άσχημη κατάσταση, τότε εμείς είμαστε πολύ καλά», και έτσι δικαιολογούν τον εαυτό τους. Από δικαιολογίες ο διάβολος βρίσκει ένα σωρό.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η δικαιολογία δεν φέρνει ανάπαυση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος δικαιολογεί τον εαυτό του, ανάπαυση δεν βρίσκει. Δεν έχει παρηγοριά. Αυτόν που δικαιώνει τον εαυτό του, ο εαυτός του τον δικαιώνει; Ο εαυτός του, η συνείδησή του, δεν τον δικαιώνουν, και δεν έχει ανάπαυση. Αυτό δείχνει ότι φταίει. Πώς τα έχει κανονίσει ο Θεός! Έδωσε στον άνθρωπο την συνείδηση, φοβερό! Μπορεί να επιτύχη κάποιος αυτό που θέλει είτε με βάρβαρο τρόπο είτε με πονηριά είτε με κολακεία, αλλά ανάπαυση δεν θα βρή. Από αυτό μπορεί μόνος του να διαπιστώση ότι δεν βαδίζει καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν κάποιος δέχεται την αδικία, είναι σαν να παίρνη μια πνευματική περιουσία και χαίρεται. Ενώ, όταν δικαιώνη τον εαυτό του, είναι σαν να ξοδεύη κάτι από την περιουσία του και δεν νιώθει χαρά. Θέλω να πώ, δεν έχει την πνευματική ανάπαυση που θα είχε, αν δεν δικαίωνε τον εαυτό του. Πόσο μάλλον όταν δεν έχη δίκαιο και δικαιώνη τον εαυτό του! Οργή Θεού μαζεύει, γιατί τότε είναι ένα άρπαγμα· σπαταλάει μια περιουσία που του δίνεται. Βρίσκει ανάπαυση αυτός που σπαταλάει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Με την δικαιολογία κανείς τυφλώνεται. Ακόμη και άνθρωπο να σκοτώση, τον δικαιολογεί ο διάβολος. «Πώς τον υπέμεινες τόσον καιρό; του λέει. Έπρεπε να τον είχες σκοτώσει νωρίτερα». Και μπορεί να θέλη να πάρη και μισθό από τον Χριστό για τα λίγα χρόνια που υπέμεινε! Κατάλαβες; Εκεί φθάνει!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αφού, Γέροντα, αυτός που δικαιολογείται ταλαιπωρείται, γιατί δέχεται αυτό το βάσανο της συνειδήσεως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Είναι η συνήθεια. Για να την κόψη, χρειάζεται θέληση. Και πρέπει να μάθη όχι μόνο να μη δικαιολογήται, αλλά και να τοποθετήται σωστά. Αν δεν δικαιολογηθή, αλλά μέσα του πιστεύη ότι τον αδίκησαν, τότε είναι χειρότερα. Γιατί, αν δικαιολογηθή, θα του πη και ο άλλος κάτι και θα μπορέση έτσι να γνωρίση τον εαυτό του και να βγή από την πλάνη. Αλλιώς, μπορεί να μη μιλάη, αλλά μέσα του να λέη: «έχω δίκιο, όμως δεν μιλάω, γιατί έχω ανωτερότητα», και να παραμένη στην πλάνη.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να παίρνουμε το βάρος επάνω μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, χθές είπατε ότι άλλο είναι η υπομονή και άλλο η ανοχή. Τί εννοούσατε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Υπομονή δεν είναι το να ανέχωμαι τον άλλον. Όταν λέω ότι ανέχομαι τον άλλον, είναι σαν να λέω: «Ο άλλος είναι χάλια, εγώ είμαι καλά, και τον ανέχομαι». Η πραγματική υπομονή είναι να αισθάνωμαι ενοχή για την κατάστασή του και να τον πονάω. Αυτό έχει πολλή ταπείνωση και αγάπη, και τότε δέχομαι την Χάρη του Θεού και βοηθιέται και ο άλλος. Αν δώ, ας υποθέσουμε, κάποιον κουτσό ή κουφό ή ναρκομανή, πρέπει να σκεφθώ: «άν ήμουν εγώ σε καλή πνευματική κατάσταση, θα παρακαλούσα τον Θεό και θα τον έκανε καλά», γιατί ο Χριστός είπε: «θά σάς δώσω δύναμη να κάνετε μεγαλύτερα θαύματα από μένα»[45], οπότε έρχεται ο πόνος, η αγάπη για τον άλλον. Ενώ, αν πώ: «έ, τί να τον κάνω, ανάπηρος είναι, ας καθήσω λίγο κοντά του· θα έχω άλλωστε και τον μισθό μου», τότε ανέχομαι τον άλλον και δικαιολογώ τον εαυτό μου ότι έκανα το καθήκον μου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πάντα βοηθάει να παίρνης όλο το σφάλμα επάνω σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αν το σηκώνης, πολύ βοηθάει. Να μέμφεσαι για όλα τον εαυτό σου. Να παίρνης το σφάλμα από τον άλλον, να το ρίχνης στον εαυτό σου και να παρακαλάς τον Χριστό να σού δίνη δύναμη να το σηκώνης. Και όταν θα παίρνης επάνω σου περισσότερο βάρος απ᾿ ό,τι έσφαλες ή, κι αν ακόμη δεν έσφαλες, πιστεύης κατά κάποιον τρόπο ότι έσφαλες, τότε δεν θα το παίρνης ποτέ επάνω σου, δεν θα υπερηφανεύεσαι, και θα έχης πλούσια την Χάρη του Θεού. Πρέπει όμως να προσέξης, να δής αν μπορής να σηκώσης περισσότερο βάρος. Γιατί, αν δεν μπορής, θα πάθης κήλη, δισκοπάθεια...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιά είναι η κήλη και η δισκοπάθεια σ᾿ αυτήν την περίπτωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν πάρης επάνω σου λ.χ. ένα σφάλμα που δεν μπορείς να το σηκώσης και δεν δώσης καμμιά εξήγηση, μετά θα γογγύσης, θα αγανακτήσης, θα κατακρίνης...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όμως, αν εξηγήσω, αυτό δεν θα είναι δικαιολογία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, να κοιτάξης να δικαιολογήσης αυτό που δεν μπορείς να σηκώσης και το άλλο να το αφήσης. Αν είναι λ.χ. ευαίσθητος κανείς, να κοιτάξη να σηκώση όσο μπορεί· να μην κάνη τον δυνατό. Να εξετάζη τον εαυτό του και να τον αδική με διάκριση, ανάλογα με το βάρος που μπορεί να σηκώση, για να μην τον κάμψη ο εχθρός με την υπερευαισθησία, τον ρίξη σε απόγνωση και τον αχρηστέψη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές όχι μόνο δυσκολεύομαι να δεχθώ την αδικία, αλλά μετατοπίζω την ευθύνη μιας πτώσεώς μου σε άλλον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εσείς, όχι μόνο δεν σηκώνετε από αγάπη τον τουρβά του άλλου, αλλά θέλετε να δώσετε και τον δικό σας βαρύ τουρβά όχι μόνο στον υγιή αλλά και στον φιλάσθενο! Χρειάζεται να αποκτήσης πνευματική παλληκαριά, για να παίρνης επάνω σου όλη την ευθύνη της αμαρτίας σου. Όσο περισσότερο βάρος προσθέτουμε στον εαυτό μας, παίρνοντας επάνω μας τα σφάλματα των άλλων, τόσο περισσότερο ο Καλός Θεός μας ελαφρώνει το φορτίο και νιώθουμε θεία αγαλλίαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το να σηκώση από αγάπη κάποιος που έχει σωματικές δυνάμεις δυο σακκιά τσιμέντο στην πλάτη, για να απαλλάξη έναν αδύνατο που δεν μπορεί να σηκώση βάρος, δεν έχει τόση αξία, όση το να σηκώση το βάρος του σφάλματος του άλλου, να το κάνη δικό του, και ας φανή στους άλλους ότι έσφαλε αυτός. Αυτό είναι μεγάλη αρετή, μεγάλη ταπείνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σε ένα Κοινόβιο στο Άγιον Όρος κάποιος δόκιμος μίλησε μια φορά άσχημα στον τυπικάρη[46], που ήταν και ιερομόναχος, γιατί την ώρα που διάβαζε στην ακολουθία του έδειξε ποιό κοντάκιο να πη πρώτα. Ενώ πήγε να τον βοηθήση, εκείνος έγινε έξω φρενών. Μετά την ακολουθία ο δόκιμος κλείστηκε θυμωμένος στο κελλί του. Ο τυπικάρης γύρισε στον εαυτό του, πήρε το βάρος επάνω του και στενοχωρέθηκε, γιατί σκέφθηκε ότι αυτός έγινε αιτία να αντιδράση έτσι ο αδελφός. Τον πείραζε αληθινά η συνείδηση. Και ενώ ως τυπικάρης είχε ευθύνη για την ακολουθία, δεν έλαβε υπ᾿ όψιν του την ευθύνη, αλλά είπε: «Εγώ φταίω που νευρίασε ο αδελφός». Πήγε λοιπόν στο κελλί του δοκίμου να του βάλη μετάνοια. Εκείνος όμως είχε κλειδώσει και δεν άνοιγε. Τότε κάθησε έξω από την πόρτα του και περίμενε από το πρωί ώς τις τρεις το απόγευμα που σήμανε για τον εσπερινό, οπότε ο δόκιμος αναγκάστηκε να βγή. Πέφτει κάτω ο τυπικάρης, του βάζει μετάνοια και του λέει: «Να με συγχωρήσης, αδελφέ, έφταιξα»! Έτσι έρχεται η Χάρις του Θεού.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 3 – Η θεία και η ανθρώπινη δικαιοσύνη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, τί είναι θεία δικαιοσύνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Θεία δικαιοσύνη είναι να κάνης αυτό που αναπαύει τον άλλον. Αν έχης λ.χ. να μοιρασθής κάτι με κάποιον άλλον, να του δώσης όχι το μισό από αυτό που έχεις, αλλά όσο θέλει εκείνος. Να του πής: «Πόσα θέλεις; δυόμισι; τρία; πάρ᾿ τα». Να δίνης τα καλά και να κρατάς τα σάπια. Να δίνης τα περισσότερα και να κρατάς τα λιγώτερα. Νά, πές πώς μας φέρνει τώρα μια αδελφή δέκα δαμάσκηνα. Αν εγώ από λαιμαργία φάω τα οκτώ και σού αφήσω τα δύο, θα σε αδικήσω. Αν πώ: «αφού είμαστε δύο, θα φάω τα πέντε και θα σού αφήσω τα άλλα πέντε», τότε έχω την ανθρώπινη δικαιοσύνη. Αν όμως δώ ότι σού αρέσουν τα δαμάσκηνα και φάω μόνον ένα και σού πώ: «κάνε αγάπη να φάς εσύ τα υπόλοιπα, γιατί εμένα δεν μου πολυαρέσουν, αλλά με πειράζουν και στα έντερα», τότε έχω την θεία δικαιοσύνη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή ανθρώπινη δικαιοσύνη ποιά είναι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ανθρώπινη δικαιοσύνη είναι, αν πρέπη λ.χ. να μοιρασθής κάτι με κάποιον άλλον, να δίνης το μισό και να κρατάς το άλλο μισό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί θέση έχει η ανθρώπινη δικαιοσύνη στην πνευματική ζωή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η ανθρώπινη δικαιοσύνη δεν είναι για τους πνευματικούς ανθρώπους· είναι φρένο για τους κοσμικούς ανθρώπους. Ο πνευματικός άνθρωπος είναι ανόητος, αν αποβλέπη σ᾿ αυτήν, γιατί μπροστά στην θεία δικαιοσύνη η ανθρώπινη είναι μηδέν. Αλλά και ο κοσμικός άνθρωπος, αν πετύχη κάτι σ᾿ αυτήν την ζωή εφαρμόζοντας την ανθρώπινη δικαιοσύνη, δεν θα έχη την πραγματική χαρά και ανάπαυση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ας υποθέσουμε ότι δύο αδέλφια έχουν ένα κτήμα δέκα στρέμματα. Ανθρώπινη δικαιοσύνη είναι να πάρη ο καθένας από πέντε στρέμματα. Θεία δικαιοσύνη είναι να πάρη ο καθένας αυτό που έχει ανάγκη. Αν δηλαδή ο ένας αδελφός έχη επτά παιδιά και ο άλλος δύο ή η δουλειά του ενός είναι κατώτερη από την δουλειά του άλλου, πρέπει να πάρη περισσότερο εκείνος που έχει μεγαλύτερη ανάγκη. Σ᾿ αυτήν την περίπτωση είναι αδικία να πάρη ο δεύτερος όσα και ο πρώτος. Ο κοσμικός άνθρωπος όμως δεν λαμβάνει υπ᾿ όψιν του ότι ο αδελφός του δυσκολεύεται να τα βγάλη πέρα. Δεν καταλαβαίνει ότι η μοιρασιά που πάει να κάνη είναι άδικη, γιατί δεν σκέφτεται πνευματικά. Του λές: «πρέπει να βοηθήσης την οικογένειά σου να δεχθή να δώσης περισσότερα στον αδελφό σου που έχει ανάγκη» και σού λέει: «Γιατί; δεν τον αδικώ»! Εάν ήταν πνευματικός άνθρωπος, ακόμα και αν η γυναίκα του και τα παιδιά του αντιδρούσαν, έπρεπε να τους πείση να δεχθούν ό,τι του δώση ο αδελφός του. Αν ο αδελφός του έλεγε: «εσύ θα πάρης ένα στρέμμα», να έπαιρνε το ένα, χωρίς να πη τίποτε, για να νιώθη άνετα ο αδελφός του που πήρε τα υπόλοιπα. Πάντως το Ευαγγέλιο κάνει την καλύτερη μοιρασιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου κάνει εντύπωση η αρχοντιά του Αβραάμ. Όταν μάλωναν οι τσομπάνηδες του Λώτ και του Αβραάμ για τα βοσκοτόπια, πήγε ο Αβραάμ στον Λώτ και του είπε: «Δεν κάνει να μαλώνουμε· είμαστε συγγενείς. Που σε αναπαύει εσένα να πάς; Θέλεις να πάς από ᾿δώ ή θέλεις να πάς από ᾿κεί;». Ο Λώτ κινήθηκε και λίγο ανθρώπινα και διάλεξε τα Σόδομα και τα Γόμορρα, γιατί είχαν πρασινάδα και βοσκοτόπια[47], και τί έπαθε μετά! Ο Αβραάμ κινήθηκε με την θεία δικαιοσύνη, θέλησε να αναπαύση τον Λώτ, και χάρηκε κιόλας που ο Λώτ πήγε στον καλύτερο τόπο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η δικαιοκρισία του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι η δικαιοκρισία του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η δικαιοκρισία του Θεού είναι η μακροθυμία, η οποία έχει μέσα και την ταπείνωση και την αγάπη. Ο Θεός είναι πολύ δίκαιος, αλλά και πολυεύσπλαχνος, και η ευσπλαχνία Του νικάει την δικαιοσύνη Του. Θα σού πω ένα παράδειγμα, για να καταλάβης. Αν κάποιος άνθρωπος δεν είχε την ευκαιρία να ακούση ποτέ για τον Θεό, αυτός δεν θα κριθή σύμφωνα με την κατάσταση στην οποία βρίσκεται, αλλά σύμφωνα με την κατάσταση στην οποία θα βρισκόταν, αν είχε γνωρίσει τον Θεό. Γιατί αλλιώς δεν θα ήταν δίκαιος ο Θεός. Η θεία δικαιοσύνη έχει δικούς της μαθηματικούς όρους· το ένα κι ένα άλλοτε κάνουν δύο και άλλοτε δύο εκατομμύρια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς εφαρμόζεται η θεία δικαιοσύνη σε κάποιον που σφάλλει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η ανθρώπινη δικαιοσύνη λέει: Έσφαλες; Πρέπει να τιμωρηθής. Η θεία δικαιοσύνη λέει: Αναγνωρίζεις το λάθος σου και μετανοείς; Συγχωρείσαι. Βλέπεις, ακόμη και από τον ανθρώπινο νόμο δικάζεται με επιείκεια κάποιος που κάνει ένα έγκλημα, όταν μετανοή ειλικρινά και πάη μόνος του και το ομολογή, ενώ δεν υπάρχει καμμία υποψία για το πρόσωπό του. Και αν από τους ανθρώπους δικάζεται με επιείκεια, πόσο μάλλον από τον δικαιοκρίτη και πολυεύσπλαχνο Θεό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είμαστε στα χέρια του Θεού. Ο Θεός μας παρακολουθεί με ακρίβεια και γνωρίζει την καρδιά του καθενός. Δεν θα μας αδικήση. Αφού υπάρχει θεία δικαιοσύνη και θεία ανταπόδοση, και ο Θεός μας αγαπάει – το κυριώτερο απ᾿ όλα –, ό,τι καλό κάνει κανείς δεν χάνεται. Γι᾿ αυτό είναι χαμένος, τελείως λειψός, όποιος ζητάει να δικαιωθή από τους ανθρώπους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχω παρατηρήσει ότι, όταν ο άνθρωπος αδικηθή και εφαρμόση την θεία δικαιοσύνη, ο Θεός τον δικαιώνει ακόμη και σ᾿ αυτήν την ζωή. Θυμάμαι, στον στρατό, μετά τον πόλεμο, είχε έρθει ο στρατηγός να δώση παράσημα. Εγώ εκείνη την ημέρα έλειπα. Όταν φώναξε το όνομά μου, βγήκε ένας που ήταν από την Θεσσαλία και πήρε εκείνος το παράσημο. Οι άλλοι στρατιώτες δεν μίλησαν, γιατί τότε είχε φυλάκιση, αν έλεγες ψέματα. Όταν έφυγε ο στρατηγός, εκείνος κρύφτηκε, γιατί οι άλλοι θα τον σκότωναν στο ξύλο. Όταν επέστρεψα, φοβόταν και από μένα. Ήρθε από εδώ–από εκεί, οπότε μου είπε: «Να με συγχωρέσης, έκανα αυτό κι αυτό». «Καλά έκανες και το πήρες, του είπα· τί να το έκανα εγώ;». Το φορούσε ύστερα στις παρελάσεις. Μετά από σαράντα χρόνια έρχεται εδώ στο Μοναστήρι ο στρατάρχης της Πρώτης Στρατιάς από την Θεσσαλία και μου φέρνει ένα παράσημο του Μεγάλου Αλεξάνδρου. Όταν το είδα, μου ήρθε να γελάσω. Μετά από σαράντα χρόνια! Μου έκανε εντύπωση: από την Θεσσαλία ήταν εκείνος ο στρατιώτης, από την Θεσσαλία ήρθε και ο στρατάρχης! Βλέπετε πώς γίνεται! Ενώ, όταν ζητάμε να δικαιωθούμε, χάνουμε τελικά και αυτά εδώ, αλλά και εκείνα που μας ετοιμάζει ο Χριστός για την άλλη ζωή, αν αδικηθούμε. Για χαμένα πράγματα δηλαδή χάνουμε τα σπουδαιότερα, τα αιώνια. Γιατί αυτά εδώ έτσι κι αλλιώς χαμένα είναι, τί να τα κάνουμε;'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα δικαιώματα[48]του μοναχού τα κρατάει ο Χριστός για την άλλη ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι το δικαίωμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το δικαίωμα είναι κοσμική λογική. Ο άνθρωπος, όσο πιο κοσμικός είναι, τόσο περισσότερο δικαίωμα έχει· όσο πιο πνευματικός είναι, τόσο λιγώτερο δικαίωμα έχει. Ειδικά ο μοναχός έχει μόνον υποχρεώσεις· δεν έχει δικαίωμα για τίποτε. Θέλω να πω ότι δεν πρέπει να έχη απαίτηση από κανέναν και για τίποτε. Το να ζητά ο μοναχός δικαιώματα σ᾿ αυτήν την ζωή, ενώ απαρνήθηκε τα πάντα για την αγάπη του Χριστού, είναι τελείως λάθος. Βρίζει τον Χριστό, τον Μοναχισμό. Οι κοσμικοί έχουν δικαιώματα πολλά· κοσμικοί είναι. Τα δικαιώματα του μοναχού, αλλά και του πνευματικού ανθρώπου, τα κρατάει ο Χριστός για την άλλη ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το δικαίωμα σήμερα παρουσιάζεται σχεδόν σε όλους τους νέους, αλλά και σε νέους μοναχούς. Μερικοί νέοι μοναχοί δεν ξέρουν γιατί έγιναν μοναχοί και τί θα πη Μοναχισμός, γι᾿ αυτό έχουν ένα δικαίωμα, ένα κοσμικό πνεύμα, μια παράξενη λογική, μια ανθρώπινη δικαιοσύνη, από όλες τις πλευρές. Αυτή η ανθρώπινη δικαιοσύνη ξεκίνησε από το ευρωπαϊκό πνεύμα και μπήκε και στον Μοναχισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην καλογερική, την σημερινή εποχή, συναντάει κανείς πολλές φορές αυτό το πνεύμα: «Δεν τον βλάπτω τον άλλον, δεν θέλω να με βλάψη· δεν τον αδικώ· είμαι εντάξει». «Έκανα, λένε μερικοί, την δουλειά μου, βοήθησα εκεί, τελείωσα. Είμαι εντάξει. Η άλλη δουλειά δεν είναι δική μου, φεύγω· πάω στο κελλί για πνευματικά». Δεν εξετάζουν αν ο άλλος είναι φιλάσθενος ή έχη πονοκέφαλο και δεν μπορή να δουλέψη, ή δουλεύη λιγώτερο, γιατί είναι από αγρυπνία και είναι περισσότερο κουρασμένος. Ή λένε: «αυτή η μερίδα είναι δική μου· την δικαιούμαι», και δεν εξετάζουν αν ο άλλος είναι πιο αδύνατος ή ο οργανισμός του καταναλίσκη περισσότερο, και έχει ανάγκη από περισσότερη τροφή. Οπότε καταλήγουν να βρίσκωνται σε πνευματικό χώρο, αλλά να έχουν μια νοοτροπία κοσμική, και έτσι γίνονται συνεπείς κοσμικοί. Ξέρετε τί είναι να βλέπης ανθρώπους πνευματικούς να αντιμετωπίζουν κοσμικά τα πράγματα; Λίγο–πολύ δηλαδή παρατήρησα σε αρκετούς μοναχούς το εξής: Την νηστεία, την προσευχή, την ακολουθία, το διακόνημα, τα κάνουν. Φορούν ένδυμα μοναχικό, έχουν καλογερικό πρόγραμμα, αλλά η αντιμετώπιση, αντί να είναι πνευματική, είναι κοσμική, γιατί κοιτούν πώς να μην τους πούν καμμιά κουβέντα, να μην αδικηθούν. Δηλαδή βρίσκονται στην κοσμική δικαιοσύνη και πολλές φορές ούτε και εκεί φθάνουν. Άντε τώρα να συνεννοηθής πνευματικά μ᾿ αυτούς. Αυτοί τα κανονίζουν έτσι, ώστε να μη δυσκολευθή μεθαύριο ο Χριστός μαζί τους να κάνη... λογαριασμούς! Μά, ενώ ο Χριστός παρακολουθεί τον καθέναν πόσο αδικείται, πόσο θυσιάζεται, και θα τον ανταμείψη ανάλογα, αυτοί θέλουν να τακτοποιήσουν μόνοι τους τον λογαριασμό τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είμαι αγανακτισμένος γενικά με την σημερινή νοοτροπία που βλέπω σε μερικούς νέους μοναχούς. Μια ανθρώπινη δικαιοσύνη! Πώς να χωρέση η ανθρώπινη δικαιοσύνη στην πνευματική ζωή; Και στην κοσμική ζωή δεν βγαίνεις πέρα με την ανθρώπινη δικαιοσύνη, πόσο μάλλον στην πνευματική. Όταν ήμουν στο Κοινόβιο, όλοι κοίταζαν πώς να κάνουν κάποια θυσία. Στην δουλειά, στο φαγητό, σε όλα υπήρχε αυτό το πνεύμα: Σκέφτονταν πρώτα τον άλλον, και γι᾿ αυτό ζούσαν τον Παράδεισο. Ήταν κάποιος λ.χ. στην τράπεζα; Κοιτούσε να φάη αυτός λιγώτερο, για να μείνη το περισσότερο για τον άλλον. Και αδύνατος να ήταν ο ίδιος, δεν το λάμβανε υπ᾿ όψιν. Ούτε εξέταζε τί ήταν ο άλλος. Έκανε θυσία. Ούτε έβαζε την κρίση του να πή: «Θα του κάνη κακό, αν φάη περισσότερο». Από την στιγμή που ο μοναχός κοιτάζει να μην τον αδικήσουν, να μην κουρασθή πολύ, να μην πάη χαμένος ο κόπος του, είναι σαν να μην πιστεύη ότι υπάρχει Θεός, ότι υπάρχει άλλη ζωή, μέλλουσα Κρίση και θεία ανταπόδοση. Και αν δουλέψη λίγο παραπάνω, ούτε αυτό θα πάη χαμένο. Μόνον ο κόπος των ζώων πάει χαμένος. Και αυτά τα καημένα, παρόλο που εξ αιτίας μας ταλαιπωρούνται – μετά την παράβαση των Πρωτοπλάστων η φύση συστενάζει με τον άνθρωπο –, θυσιάζονται για μάς! Είναι φοβερό! Βλέπετε, τα άγρια ζώα, όταν τραυματίζωνται από τους κυνηγούς, τί τραβάνε! Σακατεμένα, με σπασμένα πόδια, να μην μπορούν να τρέξουν, να τα ξεκοιλιάζουν τα μεγάλα ζώα, να τα τρώνε, και να μην έχουν καμμιά ανταμοιβή! Ο άνθρωπος, αν δεν τα καταλαβαίνη αυτά, δεν είναι άνθρωπος. Γι᾿ αυτό του έδωσε ο Θεός το μυαλό, για να το δουλεύη σωστά και να βρη τον δρόμο του. Εγώ δεν λέω τώρα να σκοτώνεστε στην κούραση, αλλά να υπάρχη φιλότιμο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, εσείς, Γέροντα, θέλετε να σκιρτάη η καρδιά μας, να λαχταράη να αναπαύσουμε τον άλλον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατί, όταν κοιτάζης πώς να αναπαύσης τον άλλον και αφήνης τον εαυτό σου εν λευκώ στα χέρια του Θεού, δεν κουράζεσαι. Και αν κουρασθής και πής ότι κουράστηκες, πάει, το έχασες. Τί, θα σε πληρώση ο Χριστός για την κακομοιριά; Μπάτσο θα σού δώση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο μπορείτε, αυτό να κοιτάξετε. Αυτή είναι η πνευματική εργασία που πρέπει να κάνετε. Και άσκηση αν κάνετε, δεν ωφελεί, γιατί, αν κανείς δεν κάνη αυτήν την εργασία, δουλεύει σε άλλη συχνότητα από την συχνότητα του Θεού. Πάνε όλα μετά χαμένα, και οι μετάνοιες και οι νηστείες... Δεν λέω αυτά να μη γίνωνται, αλλά να μη νομίζη κανείς ότι, επειδή κάνει εκείνο, εκείνο..., είναι εντάξει!
- type: h2
  initial:
    ru: ''
  text:
    ru: Έχουν κάνει άλλο ευαγγέλιο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε ένας άνθρωπος μπορεί να λέγεται δίκαιος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δίκαιος κατά κόσμον είναι εκείνος που κρίνει με βάση το ανθρώπινο δίκαιο. Το τέλειο όμως είναι ο άνθρωπος να είναι δίκαιος όχι σύμφωνα με την ανθρώπινη δικαιοσύνη, αλλά με την θεία δικαιοσύνη, και τότε τον ευλογεί ο Θεός. Όταν στις ενέργειές μου δεν βάζω ποτέ το εγώ και το συμφέρον μου, εκβιάζω, μπορώ να πώ, τον Θεό να μου στείλη την θεία Χάρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οποιαδήποτε ανθρώπινη δικαιοσύνη, ακόμη και η πιο τέλεια, έχει πάντα ανθρώπινα στοιχεία. Και όσο υπάρχει η ανθρώπινη δικαιοσύνη στον πνευματικό άνθρωπο, το Πνεύμα προσπαθεί να την αποβάλη ως ξένο σώμα, και ο άνθρωπος παλεύει με ανεβοκατεβάσματα και κουράζεται ψυχικά. Όταν αποκτήση την θεϊκή δικαιοσύνη, έρχεται το λαμπικάρισμα και ο θείος φωτισμός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν πώ, Γέροντα, σε κάποιον που λέει ότι αδικήθηκε: «υπάρχει θεία δικαιοσύνη», θα τον βοηθήσω;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, καλύτερα πές του: «εξέτασε τα πράγματα πνευματικά, σύμφωνα με το Ευαγγέλιο». Γιατί, αν του πής: «υπάρχει θεία δικαιοσύνη», θα πιστέψη ότι αδικήθηκε, ενώ μπορεί να έχη αδικήσει κιόλας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλήθεια, πονάει η ψυχή σου... Γνώρισα κάποιον που εκκλησιαζόταν τακτικά, νήστευε κ.λπ. και είχε την εντύπωση ότι ζούσε πνευματικά. Εν τω μεταξύ, ενώ είχε πέντε διαμερίσματα, δύο μισθούς, παιδιά δεν είχε, δεν έδινε δραχμή σε έναν φτωχό. «Καλά, του είπα, έχεις τόσους φτωχούς συγγενείς, γιατί δεν τους δίνεις κάτι; Τί θα τα κάνης; Δώσε σε χήρες, σε ορφανά». Και ξέρετε τί μου είπε; «Καλά, να μην παίρνω ενοίκιο από την χήρα αδελφή μου;». Ανέβηκε το αίμα στο κεφάλι μου, όταν το άκουσα. Νά, αυτή είναι η κοσμική δικαιοσύνη! «Αφού δεν είναι δικά μου τα παιδιά που θα πεινάσουν, σού λέει ο άλλος, δεν έχω ευθύνη. Δεν τον αδικώ. Αλλοίμονο, εγώ να αδικήσω!», και αναπαύουν τον λογισμό τους με τον δικό τους τρόπο, αλλά ανάπαυση πραγματική δεν έχουν. Με μια ανθρώπινη λογική, με μια δικαιοσύνη κοσμική, αδιαφορούν μπροστά σε σοβαρές καταστάσεις. Πώς να νιώσουν ύστερα κάτι το πνευματικό; Υπάρχουν άνθρωποι που μπορεί να δώσουν ένα σπίτι ευλογία και από την άλλη μεριά, αν τους χρωστάη κάποιος ένα νοίκι, να του κάνουν μήνυση. Πώς το εξηγείτε αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι δικαιοσύνη ανθρώπινη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ούτε δικαιοσύνη ανθρώπινη είναι. Μια μικρή δόση έχει. Από την μια δίνουν σε κάποιον εκατό χιλιάδες και από την άλλη κάνουν παζάρια στον ταξιτζή και τον πάνε στην αστυνομία τουρισμού για χίλιες δραχμές. Πώς το εξηγείτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως δεν είναι καλά στο μυαλό τους, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, καλά είναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, δίνουν με υπερηφάνεια, για να ικανοποιηθούν οι ίδιοι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό είναι. Δίνουν τα πολλά με υπερηφάνεια· το κάνουν για να δοξασθούν οι ίδιοι, όχι εις δόξαν Θεού. Μπορεί ακόμη και όλα να τα δώσουν, αγάπη όμως δεν έχουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα υπάρχει ένα λανθασμένο πνεύμα. Ακόμη και πνευματικοί άνθρωποι ζητούν μια νομική δικαιοσύνη και λένε ότι πιστεύουν και στον Θεό! «Το δίκιο σου, το δίκιο μου». Αυτό το ευαγγέλιο της λογικής, της παράξενης λογικής, να μην υπήρχε! «Να μη με περνούν κορόιδο», λένε. Δεν βλέπετε που φθάνουν οι Χριστιανοί στα δικαστήρια; Και να έχουν δίκαιο, δεν πρέπει να πάνε στα δικαστήρια, πόσο μάλλον όταν δεν έχουν. Γι᾿ αυτό και μερικοί γίνονται εξ αιτίας τους άπιστοι. Βλέπουν ότι ένας, που ούτε στην εκκλησία πάει ούτε αγρυπνίες κάνει, μπορεί να μην κάνη κάτι τέτοιο, ενώ άλλος, που πάει στην εκκλησία, κάνει αγρυπνίες κ.λπ., πηγαίνει στο δικαστήριο έναν φτωχό για λίγα χρήματα που του χρωστάει, μόνον και μόνο για να βρη το δίκιο του. Είπα σε έναν που ήθελε να πάη στο δικαστήριο κάποιον που του χρωστούσε χρήματα: «Έχεις ανάγκη; Έχεις περισσότερα παιδιά; Μήπως σε βάζει η γυναίκα σου και βρίσκεσαι σε δύσκολη θέση;». «Όχι, λέει, το κάνω, για να βρώ το δίκιο μου».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τί να πη κανείς; Είναι και μια αγωγή που είχε δοθή παλιότερα από μερικούς πνευματικούς κύκλους. Χρόνια τώρα θυμάμαι ένα περιστατικό και δεν μπορώ να το ξεχάσω. Σε ένα βρεφοκομείο υπηρετούσαν αφιερωμένες νοσοκόμες. Σε κάποιο άρρωστο παιδάκι έπρεπε να κάνη ο γιατρός μια εξέταση με ραδιενέργεια και ζήτησε να πάη μια νοσοκόμα να τον βοηθήση, αλλά δεν πήγε καμμιά από αυτές, γιατί φοβόνταν μήπως πάθουν τίποτε από την ραδιενέργεια. Κατ᾿ αρχάς, αφού ήταν αφιερωμένες, δεν υπήρχε θέμα. Αν σκέφτονταν να παντρευτούν, τότε θα πείραζε. Αλλά και να σκέφτονταν να δημιουργήσουν οικογένεια, πάλι έπρεπε να κάνουν μια θυσία σαν πνευματικοί άνθρωποι που ήταν. Κανονικά, έπρεπε να μαλώνουν ποιά να πάη. Και τελικά, έτρεξε να βοηθήση τον γιατρό μια άλλη, που ούτε πνευματικά ζούσε, αλλά και σκεφτόταν να παντρευτή, γιατί λυπήθηκε το παιδάκι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και το χειρότερο από όλα είναι που τέτοιους ανθρώπους δεν τους πειράζει γι᾿ αυτό η συνείδηση, γιατί λένε: «Αυτά δεν είναι για μάς. Εμείς είμαστε για τα πνευματικά». Μπορεί μάλιστα να έχουν τον λογισμό: «εκείνον τον αναπαύει να θυσιάζεται κι εμένα με αναπαύει να έχω την ησυχία μου...», και καμμιά φορά να τον κατακρίνουν κιόλας και να λένε ότι δεν έχει πνευματική κατάσταση. Αλλά ο Χριστός αναπαύεται εκεί που υπάρχει η αρχοντιά, το πνεύμα της θυσίας, το αθόρυβο, η αφάνεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, βλέπης τον άλλον να δυσκολεύεται, δεν πρέπει να βοηθήσης, όπως και να είσαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μά βέβαια! Αλλά έχω παρατηρήσει ότι έχει καλλιεργηθή ένα κοσμικό φρόνημα σε πολλούς πνευματικούς ανθρώπους. Έχουν κάνει ένα δικό τους κοσμικό ευαγγέλιο, ένα ευαγγέλιο στα μέτρα τους, και σού λένε: «Ο Χριστιανός πρέπει να έχη την αξιοπρέπειά του· δεν πρέπει να φανή, κατά κάποιον τρόπο, κορόιδο». Τα αντιμετωπίζουν δηλαδή όλα με μια κοσμική λογική και δικαιοσύνη. «Αυτό το δικαιούμαι, σού λέει, δεν τον αδικώ· δεν θέλω να με αδική!». Να έχη εν τω μεταξύ και αναπαυμένο τον λογισμό του ότι έχει δίκαιο. Και βλέπεις σε έναν τέτοιον άνθρωπο όλα τα δικαιώματα τα κοσμικά. Φιλότιμο δεν έχει, θυσία δεν έχει, τίποτε δεν έχει, δικό του ευαγγέλιο έφτιαξε και δεν έχει καμμιά συγγένεια με τον Θεό. Έμ, πώς θα τον επισκιάση μετά η θεία Χάρις; Όταν υπηρετούσα την θητεία μου, ήταν ένας ασυρματιστής στην αεροπορία που ερχόταν στην μονάδα μας και έπαιρνε τα σήματα[49]. Είχαμε σχέσεις, θεολόγος ήταν, έκανε και κηρύγματα. Όλοι όμως Ιησουΐτη[50]τον έλεγαν, γιατί, όχι μόνο μια θυσία δεν έκανε, αλλά ούτε μια μικρή εξυπηρέτηση. Καμμιά φορά του έλεγα: «Αφού πάς που πάς στο αεροδρόμιο, σε παρακαλώ, δώσε και αυτά τα σήματα του τάδε». «Όχι, έλεγε, εγώ έφερα τα δικά μου, και αυτός να πάη τα δικά του», και έτσι ανέπαυε τον λογισμό του ότι δεν αδίκησε τον άλλον. Μά, αφού ο Χριστός δεν λέει απλώς: «άν σε παρακαλέση κάποιος να πάς ένα μίλι, πήγαινε δύο», αλλά λέει: «άν σε αγγαρέψη ένα μίλι, πήγαινε δύο»[51]. Ή δεν λέει: «άν σού ζητήση τον χιτώνα, δώσε και το ιμάτιο», αλλά «άν σού αφαιρέση τον χιτώνα, δώσε και το ιμάτιο»[52]. Να το λέη ο Χριστός αυτό και ο άλλος, ενώ θεωρεί τον εαυτό του πνευματικό άνθρωπο, να λέη: «Εγώ έφερα τα δικά μου, και αυτός να πάη τα δικά του»; Είναι σαν να λέη δηλαδή: «κορόιδο είμαι να μου ζητήση ένα μίλι και να πάω δύο;». Έμ, πώς θα πλησιάση η Χάρις του Θεού σε έναν τέτοιον άνθρωπο; Ενώ, όταν κανείς εφαρμόζη το γραφικό χωρίο καί, άμα τον αγγαρεύουν ένα μίλι, πηγαίνη πιο πέρα, μετά εργάζεται ο Χριστός και αλλοιώνεται πνευματικά ο άλλος που τον αγγάρεψε και προβληματίζεται: «Βρέ, κοίταξε, λέει, εγώ τον αγγάρεψα ένα μίλι και αυτός πήγε πιο πέρα! Τόση καλωσύνη!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εάν είχε και ο Χριστός αυτήν την κοσμική λογική που έχουν σήμερα πολλοί πνευματικοί άνθρωποι, δεν θα άφηνε τον ουράνιο Θρόνο Του, για να κατεβή στην γή, να ταλαιπωρηθή και να σταυρωθή από μας τους ελεεινούς ανθρώπους. Μέσα όμως στην κατ᾿ άνθρωπο αυτήν αποτυχία Του ήταν κρυμμένη η σωτηρία όλων των ανθρώπων. Αλλά τί τράβηξε, για να μας σώση! Μέχρι να Του δίνουν σφαλιάρες και να Του λένε: «Προφήτευσε ποιός σε χτύπησε!». Έπαιζαν δηλαδή οι Εβραίοι με τον Χριστό. Εγώ ξέρεις πόσο λυπόμουνα, όταν  ήμουν μικρός και έβλεπα τα παιδιά να παίζουν το μπίζ; Άντε τώρα να παίζουν αυτό το παιχνίδι με τον Χριστό!... «Προφήτευσε ποιός σε χτύπησε!... Πάμ!». Ώ, φοβερό! Και εμείς ζητάμε έναν Χριστιανισμό χωρίς σταύρωση, αλλά απευθείας ανάσταση. Κάνουμε έναν Χριστιανισμό, έναν Μοναχισμό, όπως τον θέλουμε. Δεν θέλουμε να στερηθούμε τίποτε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να ζήσουμε όμως τα υπερφυσικά, πρέπει να ζήσουμε υπερφυσικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τρίτο Μέρος – Αμαρτία Και Μετάνοια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μετάνοια πραγματική είναι πρώτα να συναισθανθή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ο άνθρωπος το σφάλμα του, να πονέση,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: νά ζητήση συγχώρεση από τον Θεό, και μετά νά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: εξομολογηθή. Έτσι θα έρθη η θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό πάντα συνιστώ μετάνοια και εξομολόγηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μόνον εξομολόγηση ποτέ δεν συνιστώ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – Η αμαρτία βασανίζει τον άνθρωπο
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο εξαγνισμός της καρδιάς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ο Χριστός χωράει σε όλες τις καρδιές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Χριστός χωράει, οι άνθρωποι δεν Τον χωράνε, γιατί δεν προσπαθούν να διορθωθούν. Για να χωρέση ο Χριστός μέσα μας, πρέπει να καθαρίση η καρδιά. «Καρδίαν καθαράν κτίσον εν εμοί, ο Θεός...»[53].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί τα άγρια ζώα δεν πειράζουν τους Αγίους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αφού ημερεύουν οι άνθρωποι, ημερεύουν και τα άγρια ζώα και αναγνωρίζουν ότι ο άνθρωπος είναι αφεντικό τους. Στον Παράδεισο, πριν από την πτώση, τα άγρια θηρία έγλειφαν τους Πρωτοπλάστους με ευλάβεια, αλλά μετά την πτώση πήγαιναν να τους ξεσκίσουν. Όταν ένας άνθρωπος επανέρχεται στην προπτωτική κατάσταση, τα ζώα τον αναγνωρίζουν πάλι για αφεντικό. Σήμερα όμως βλέπεις ανθρώπους που είναι χειρότεροι από τα άγρια θηρία, χειρότεροι από τα φίδια. Εκμεταλλεύονται απροστάτευτα παιδιά, τους παίρνουν τα χρήματα καί, όταν έρχωνται σε δύσκολη θέση, τα ενοχοποιούν, καλούν την αστυνομία, τα πηγαίνουν και στο ψυχιατρείο. Γι᾿ αυτό τον 147ο Ψαλμό, που διάβαζε ο Άγιος Αρσένιος ο Καππαδόκης, για να ημερέψουν τα άγρια ζώα και να μην κάνουν κακό στους ανθρώπους, τον διαβάζω, για να ημερέψουν οι άνθρωποι και να μην κάνουν κακό στους συνανθρώπους τους και στα ζώα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς επανέρχεται, Γέροντα, ο άνθρωπος στην προπτωτική κατάσταση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πρέπει να εξαγνισθή η καρδιά. Να αποκτήση την ψυχική  αγνότητα, δηλαδή ειλικρίνεια, τιμιότητα, ανιδιοτέλεια, ταπείνωση, καλωσύνη, ανεξικακία, θυσία. Έτσι συγγενεύει ο άνθρωπος με τον Θεό και αναπαύεται μέσα του η θεία Χάρις. Όταν κάποιος έχη την σωματική αγνότητα, αλλά δεν έχη την ψυχική αγνότητα, δεν αναπαύεται ο Θεός σ᾿ αυτόν, γιατί υπάρχει μέσα του πονηρία, υπερηφάνεια, κακία κ.λπ. Τότε η ζωή του είναι μια κοροϊδία. Από ᾿δώ να ξεκινήσετε τον αγώνα σας: Να προσπαθήσετε να αποκτήσετε την ψυχική αγνότητα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια κακή συνήθεια μπορεί να κοπή αμέσως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κατ᾿ αρχάς πρέπει να καταλάβη ο άνθρωπος ότι αυτή η συνήθεια τον βλάπτει και να θελήση να αγωνισθή, για να την κόψη. Χρειάζεται να έχη κανείς πολλή θέληση, για να μπορέση να την κόψη αμέσως. Όπως λ.χ. το σχοινί κάνει σιγά-σιγά μια μικρή αυλακιά στο χείλος του πηγαδιού και δεν γλιστρά πιά, έτσι και κάθε συνήθεια λίγο-λίγο χαράζει μια αυλακιά στην καρδιά και δύσκολα βγαίνει από αυτήν. Γι᾿ αυτό πρέπει πολύ να προσέξη κανείς, να μην αποκτήση κακές συνήθειες, γιατί μετά χρειάζεται πολλή ταπείνωση και πολλή θέληση, για να μπορέση να τις αποβάλη. Έλεγε ο Παπα-Τύχων: «Καλή συνήθεια, παιδί μου, αρετή· κακή συνήθεια, πάθη».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως διαπίστωσα ότι, όταν ο άνθρωπος, ενώ αγωνίζεται, συνεχίζη να σφάλλη και δεν αλλάζη, αιτία είναι ο εγωισμός, η φιλαυτία και η ιδιοτέλεια. Λείπει η ταπείνωση και η αγάπη, και έτσι εμποδίζεται η θεία επέμβαση. Δεν βοηθάει ο ίδιος ο άνθρωπος τον Θεό, για να τον βοηθήση. Αν π.χ. τον βοηθήση ο Θεός να ξεπεράση ένα πάθος του,  θα το πάρη επάνω του, θα υπερηφανευθή, γιατί θα νομίζη ότι μόνος του το ξεπέρασε, χωρίς την βοήθεια του Θεού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Απαλλαγή από το σκοτάδι της αμαρτίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι πολύ βαρύ, Γέροντα, να μολύνη κανείς το Άγιο Βάπτισμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ανάλογα πόσο το μολύνει. Άλλος το μολύνει πολύ, άλλος λίγο, άλλος κάνει έναν λεκέ, άλλος δύο...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και είναι τα μεγάλα αμαρτήματα που μολύνουν το Βάπτισμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, φυσικά, τα θανάσιμα αμαρτήματα το μολύνουν και τότε η θεία Χάρις απομακρύνεται από τον άνθρωπο. Βέβαια δεν τον εγκαταλείπει, όπως ούτε ο Φύλακας Άγγελος δεν τον εγκαταλείπει. Θυμάστε τί είχε πει ο διάβολος στον ιερέα των ειδώλων για τον μοναχό που ήθελε να παντρευτή την κόρη του; «Μη βιάζεσαι· αυτός εγκατέλειψε τον Θεό, αλλά ο Θεός δεν τον εγκατέλειψε ακόμη»[54].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί κανείς να ζη στο σκοτάδι της αμαρτίας και να μην το αισθάνεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, την αίσθηση όλοι την έχουν, αλλά υπάρχει αδιαφορία. Για να έρθη κανείς στο φως του Χριστού, πρέπει να θέλη να βγή από το σκοτάδι της αμαρτίας. Ας πάρουμε για παράδειγμα κάποιον που κλείσθηκε κατά λάθος σε ένα σκοτεινό υπόγειο. Μόλις δη μια ακτίνα να περνάη από μια ρωγμή, κοιτάζει πώς να βγή στο φώς. Θα ανοίξη σιγά-σιγά την ρωγμή, για να βρη την πόρτα και να βγή έξω. Έτσι και από την στιγμή που ο άνθρωπος θα αισθανθή το καλό ως ανάγκη και μπή μέσα του η καλή ανησυχία, θα καταβάλη προσπάθεια να βγή από το σκοτάδι της αμαρτίας. Αν πή: «αυτό που κάνω είναι λανθασμένο, δεν πηγαίνω καλά», ταπεινώνεται, έρχεται η Χάρις του Θεού, και από εκεί και πέρα προχωράει κανονικά. Αλλά, αν δεν μπή μέσα του η καλή ανησυχία, είναι δύσκολο να βοηθηθή. Κάποιος λ.χ. βρίσκεται σε κλειστό χώρο και αισθάνεται άσχημα. Του λές: «σήκω, άνοιξε την πόρτα και βγές έξω να πάρης λίγο οξυγόνο, για να συνέλθης», και εκείνος αρχίζει: «Δεν μπορώ να βγώ έξω. Και γιατί να είμαι κλεισμένος μέσα και να μην μπορώ να πάρω αναπνοή; Και γιατί να μην έχω οξυγόνο; Και γιατί ο Θεός να με έχη εδώ και τους άλλους έξω;». Έ, μπορεί αυτός να βοηθηθή; Ξέρετε πόσοι βασανίζονται, επειδή δεν ακούν κάποιον που μπορεί να τους βοηθήση πνευματικά;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος με την αμαρτία κάνει τον επίγειο παράδεισο επίγεια κόλαση. Αν η ψυχή του μολυνθή με θανάσιμες αμαρτίες, ζη μια δαιμονική κατάσταση· αντιδρά, βασανίζεται, δεν έχει ειρήνη. Αντίθετα, όποιος είναι κοντά στον Θεό, έχει τον νού του στα θεία νοήματα και έχει πάντοτε καλούς λογισμούς, είναι ειρηνικός και ζη τον Παράδεισο στην γή. Αυτός ο άνθρωπος έχει κάτι ξεχωριστό από εκείνον που είναι μακριά από τον Θεό, και αυτό είναι αισθητό και στους άλλους. Νά, αυτό είναι η θεία Χάρις, η οποία προδίδει τον άνθρωπο, ακόμη κι αν κρύβεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα εκ προθέσεως σφάλματα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να προσέξουμε πολύ τα εκ προθέσεως σφάλματα, γιατί αυτό που θα εξετάση ο Θεός είναι η πρόθεσή μας. Τα σφάλματα που κάνουμε από απροσεξία είναι ελαφρότερα. Μερικές αμαρτίες είναι αμαρτίες, αλλά έχουν και ελαφρυντικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ύστερα, όταν σφάλουμε χωρίς να το θέλουμε, ο Θεός οικονομάει έτσι τα πράγματα, ώστε να χρησιμοποιηθή το σφάλμα μας για καλό. Δηλαδή, όχι ότι έπρεπε να σφάλουμε, για να γίνη αυτό το καλό, αλλά αφού σφάλαμε χωρίς να το θέλουμε, ο Θεός αξιοποιεί το σφάλμα μας και βγαίνει καλό. Όταν όμως κάνουμε ένα σφάλμα εν γνώσει μας και έπειτα μετανοιώσουμε, να ευχηθούμε να μη γίνη κακό από τις συνέπειες του σφάλματός μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εκείνος ο μοναχός που αναφέρει ο Ευεργετινός ότι δέκα χρόνια έπεφτε σε κάποια αμαρτία κάθε μέρα, αλλά και κάθε μέρα μετανοούσε[55], πώς σώθηκε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εκείνος ήταν κατά κάποιον τρόπο κυριευμένος, αιχμαλωτισμένος από την αμαρτία. Δεν είχε κακή διάθεση, αλλά δεν είχε βοηθηθή, σπρώχτηκε στο κακό, γι᾿ αυτό δικαιούτο την θεία βοήθεια. Πάλευε, πονούσε, είχε μετάνοια ειλικρινή, και ο Θεός τελικά τον έσωσε. Βλέπεις, ένας μπορεί να έχη καλή διάθεση· αν όμως δεν βοηθηθή από μικρός και παρασυρθή στο κακό, είναι δύσκολο μετά να σηκωθή. Κάνει μια προσπάθεια, πάλι πέφτει, πάλι σηκώνεται· παλεύει δηλαδή. Ο Θεός αυτόν τον άνθρωπο δεν θα τον αφήση, γιατί ο καημένος κάνει την μικρή του προσπάθεια, ζητάει και την θεία βοήθεια και δεν αμαρτάνει εν ψυχρώ. Κάποιος λ.χ. ξεκινάει να πάη κάπου, χωρίς να έχη σκοπό να αμαρτήση, αλλά πηγαίνοντας του συμβαίνει ένας πειρασμός και πέφτει σε κάποια αμαρτία. Μετανοεί, κάνει μια προσπάθεια, του στήνουν πάλι μια παγίδα καί, ενώ δεν έχει διάθεση να κάνη κάτι κακό, ο καημένος ξαναπέφτει και πάλι μετανοεί. Αυτός έχει ελαφρυντικά, γιατί δεν θέλει να κάνη το κακό, αλλά παρασύρεται στο κακό και ύστερα μετανοεί. Όποιος όμως λέει: «γιά να πετύχω εκείνο, πρέπει να κάνω αυτήν την αδικία· για να πετύχω το άλλο, πρέπει να κάνω εκείνη την πονηριά» κ.λπ., αυτός αμαρτάνει εσκεμμένως και εν γνώσει του. Καταστρώνει δηλαδή το αμαρτωλό του σχέδιο και βάζει πρόγραμμα με τον διάβολο τί αμαρτία θα κάνη. Αυτό είναι πολύ κακό, επειδή είναι προμελετημένο. Δεν είναι ότι πέφτει σε πειρασμό, αλλά ξεκινάει να κάνη κάτι μαζί με τον πειρασμό. Ένας τέτοιος άνθρωπος δεν πρόκειται ποτέ να βοηθηθή, γιατί δεν δικαιούται την θεία βοήθεια, και τελικά πεθαίνει αμετανόητος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αλλά και όσοι λένε ότι θα μετανοιώσουν, όταν γεράσουν, πώς είναι σίγουροι ότι θα προλάβουν να μετανοιώσουν και δεν θα πάνε από αιφνίδιο θάνατο; Έλεγε κάποιος εργολάβος: «όταν γεράσω, θα πάω στα Ιεροσόλυμα, θα βαπτισθώ στον Ιορδάνη ποταμό, οπότε θα εξαλειφθούν όλες οι αμαρτίες μου», και συνέχιζε να ζη αμαρτωλά. Τελικά, όταν πλέον δεν είχε άλλο κουράγιο, ίσα-ίσα που μόλις περπατούσε, αποφάσισε να πάη. Λέει σε έναν μάστορά του: «Μάστορα, αποφάσισα να πάω στα Ιεροσόλυμα, για να βαπτισθώ στον Ιορδάνη ποταμό». «Ά, αφεντικό, του λέει εκείνος, αν είσαι καθαρός, θα πάς· αν δεν είσαι καθαρός, στον δρόμο θα μείνης!». Λές και προφήτευσε! Μόλις πήγε στην Αθήνα να βγάλη τα χαρτιά του, πέθανε! Του πήραν όλα τα χρήματα οι άλλοι, τον πήγαν σε ένα γραφείο κηδειών και από εκεί τον έστειλαν με το φέρετρο πίσω στον τόπο του.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Να κάνουμε το καλό από αγάπη για τον Χριστό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, φοβάμαι, όταν σκέφτωμαι τα δύσκολα χρόνια που περιμένουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί φοβάσαι, μήπως πάς στην κόλαση και βασανίζεσαι μαζί με τα ταγκαλάκια; Το να λές: «βοήθησέ με, Χριστέ μου, να πάω στον Παράδεισο, για να μη Σε στενοχωρήσω, γιατί είναι βαρύ μετά από όσα έκανες για μένα να με νιώθης στην κόλαση», αυτό το καταλαβαίνω. Αλλά να θέλης να πάς στον Παράδεισο, για να βολευτής, αυτό δεν έχει φιλότιμο. Δεν το λέω αυτό, για να αφήσουμε ρέμπελη την ζωή μας, να κάνουμε αταξίες και να πάμε στην κόλαση, αλλά πολλές φορές μπαίνει μια προσπάθεια[56]: να κάνω το καλό, για να μη χάσω τον Παράδεισο. Αν έχουμε φιλότιμο, θα σκεφθούμε: «Τόσοι άνθρωποι θα πάνε στην κόλαση, οι καημένοι, που και σ᾿ αυτήν την ζωή δεν ένιωσαν λίγη αληθινή χαρά, κι εγώ θα σκεφθώ τον εαυτό μου;». Ειλικρινά σάς λέω, δεν με απασχολεί που θα πάω. Τον εαυτό μου τον έχω πετάξει. Όχι ότι θέλω να είμαι μακριά από τον Χριστό και γι᾿ αυτό δεν με απασχολεί αν πάω στον Παράδεισο, αλλά δεν είναι σκοπός μου να κάνω το καλό, για να πάω στον Παράδεισο. «Και να με πετάξης, λέω, Χριστέ μου, ευχαριστημένος θα είμαι· δεν αξίζω για τον Παράδεισο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα η ζωή μας έγινε άχαρη και δύσκολη, γιατί λιγόστεψε ο ηρωισμός, το φιλότιμο. Ακόμη και πνευματικοί άνθρωποι σκέφτονται μπακαλίστικα. Φθάνουν να ζουν μία ζωή δήθεν πνευματική. Κοιτάνε να απολαύσουν ό,τι θέλουν, μέχρι εκεί που δεν κολάζονται. Λογαριάζουν: «Αυτό κολάζει; δεν κολάζει. Άρα μπορώ να το απολαύσω». Στο θέμα της νηστείας π.χ. λένε: «Αύριο είναι Παρασκευή. Έ, απόψε μπορώ να φάω κρέας μέχρι δώδεκα παρά πέντε την νύχτα· φέρε λοιπόν να φάμε. Μετά τις δώδεκα όμως δεν κάνει· αλλάζει η μέρα· είναι αμαρτία». Δηλαδή, θέλουν και τον Παράδεισο να μη χάσουν, αλλά και αυτήν την ζωή να την απολαύσουν. Έτσι αντιμετωπίζουν και την αμαρτία και την κόλαση με τρόπο μπακαλίστικο. Αν όμως σκέφτονταν φιλότιμα, θα έλεγαν: «Ο Χριστός σταυρώθηκε και υπέφερε τόσα για μένα κι εγώ πώς να Τον πληγώσω με μια αμαρτωλή πράξη μου; Δεν θέλω να πάω στην κόλαση, όχι για τίποτε άλλο, αλλά γιατί δεν θα αντέξω να στενοχωριέται ο Χριστός, που θα είμαι στην κόλαση».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να μην κάνουμε το καλό με υπολογισμό, για να πάρουμε μισθό, αλλά να αγωνιζώμαστε από αγάπη για τον Χριστό. Ό,τι κάνουμε, να το κάνουμε καθαρό, για τον Χριστό· να προσέχουμε να μην έχη μέσα το ανθρώπινο στοιχείο, φιλαυτία, ιδιοτέλεια κ.λπ. Να έχουμε στον νού μας ότι ο Χριστός μας βλέπει, μας παρακολουθεί, και να προσπαθούμε να μην Τον στενοχωρούμε. Διαφορετικά ξεφτύζει και η πίστη μας και η αγάπη μας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και αν εξετάσουμε αυτά που κάνουμε στην πνευματική ζωή, άσκηση, νηστεία, αγρυπνία κ.λπ., θα δούμε ότι όλα βοηθούν να έχουμε και καλή σωματική υγεία. Κοιμάται κανείς σε σκληρό κρεββάτι; Και οι γιατροί συνιστούν: «Να κοιμάσαι σε σκληρό στρώμα, γιατί δεν ωφελεί να κοιμάσαι στα μαλακά». Ή κάνει μετάνοιες; Οι άλλοι κάνουν γυμναστική, για να δυναμώσουν οι μύες. Κοιμάται λίγο; Ο πολύς ύπνος αποχαυνώνει τον άνθρωπο. «Αυτός είναι κοιμισμένος, ο άλλος είναι ξύπνιος», δεν λένε; Δηλαδή τα πνευματικά που κάνει τον βοηθούν και στην σωματική του υγεία. Ύστερα η εγκράτεια βοηθάει πολύ τον άνθρωπο. Βλέπεις, και όσοι ασχολούνται με έρευνες κ.λπ. κοιτάζουν να ζουν αγνή ζωή, να μην είναι ζαλισμένοι, για να έχουν διαύγεια. Εμείς βέβαια δεν εγκρατευόμαστε γι᾿ αυτόν τον λόγο, αλλά μέσα από αυτά τα πνευματικά που κάνουμε βγαίνει και αυτό το οποίο επιδιώκουν οι κοσμικοί. Κάνουμε το πνευματικό και μέσα από το πνευματικό βγαίνει και η υγεία του σώματος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι πειρασμοί στην ζωή μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Θεός επιτρέπει τους πειρασμούς ανάλογα με την πνευματική μας κατάσταση. Άλλοτε επιτρέπει να κάνουμε ένα σφάλμα, λ.χ. μια μικρή απροσεξία, για να είμαστε άλλη φορά προσεκτικοί και να αποφύγουμε ή μάλλον να προλάβουμε ένα μεγαλύτερο κακό που θα μας έκανε το ταγκαλάκι. Άλλοτε αφήνει τον διάβολο να μας πειράζη, για να μας δοκιμάση. Δίνουμε δηλαδή εξετάσεις και αντί κακό ο διάβολος μας κάνει καλό. Θυμηθήτε τον Γερο-Φιλάρετο που έλεγε: «Τέκνον, εγκατάλειψις Θεού, ουδένα πειρασμόν σήμερα»[57]. Ήθελε να παλεύη κάθε μέρα με τους πειρασμούς, για να στεφανώνεται από τον Χριστό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας δυνατός, όπως ο Γερο-Φιλάρετος, δεν αποφεύγει τους πειρασμούς, αλλά λέει στον Χριστό: «Στείλε μου, Χριστέ μου, πειρασμούς και δώσε μου κουράγιο να παλέψω». Ένας αδύνατος όμως θα πή: «Μήν επιτρέπης, Χριστέ μου, να πειρασθώ». «Μη εισενέγκης ημάς εις πειρασμόν...»[58]. Εμείς όμως πολλές φορές, όταν έχουμε έναν πειρασμό, λέμε: «έ, μα είμαι άνθρωπος κι εγώ· δεν αντέχω άλλο!», ενώ θα έπρεπε να πούμε: «Δεν είμαι άνθρωπος· είμαι παλιάνθρωπος. Θεέ μου, βοήθησέ με να γίνω άνθρωπος». Δεν λέω να επιδιώκουμε εμείς τους πειρασμούς, αλλά, όταν έρχωνται, να τους αντιμετωπίζουμε με καρτερία και προσευχή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σε κάθε πνευματική χειμωνιά να περιμένουμε με υπομονή και ελπίδα την πνευματική άνοιξη. Οι μεγαλύτεροι πειρασμοί είναι συνήθως στιγμιαίοι καί, εάν εκείνη την στιγμή τους ξεφύγουμε, περνάει και φεύγει η φάλαγγα των δαιμόνων και γλυτώνουμε. Όταν ενωθή ο άνθρωπος με τον Θεό, δεν έχει πια πειρασμούς. Μπορεί ο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: διάβολος να κάνη κακό στον Άγγελο; Όχι, καίγεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η πνευματική ζωή είναι πολύ απλή και εύκολη· εμείς την κάνουμε δύσκολη, γιατί δεν αγωνιζόμαστε σωστά. Με λίγη προσπάθεια και πολλή ταπείνωση και εμπιστοσύνη στον Θεό, μπορεί κανείς να προχωρήση πολύ. Γιατί, όπου υπάρχει ταπείνωση, δεν έχει θέση ο διάβολος· καί, όπου δεν υπάρχει διάβολος, επόμενο είναι να μην υπάρχουν και πειρασμοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η πτώση σε μια αμαρτία μπορεί να γίνη κατά παραχώρηση του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, είναι βαρύ να πούμε ότι παραχωρεί ο Θεός να αμαρτήσουμε. Ο Θεός ποτέ δεν παραχωρεί να αμαρτήσουμε. Εμείς κάνουμε παραχωρήσεις και έρχεται ο διάβολος και μας πειράζει. Όταν λ.χ. υπερηφανεύωμαι, διώχνω την θεία Χάρη, φεύγει ο Φύλακας Άγγελός μου, έρχεται ο άλλος ...άγγελος, ο διάβολος, και σπάζω τα μούτρα μου. Αυτή είναι δική μου παραχώρηση, και όχι του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Είναι σωστό, Γέροντα, όταν έχουμε μια πτώση να λέμε: «Ο πειρασμός με έρριξε»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πολλές φορές ακούω κι εγώ μερικούς ανθρώπους να λένε ότι φταίει ο πειρασμός, όταν ταλαιπωρούνται, ενώ φταίνε οι ίδιοι που δεν αντιμετωπίζουν σωστά τα πράγματα. Έπειτα ο πειρασμός, πειρασμός είναι. Μπορεί να μας εμποδίση από το κακό; Την δουλειά του κάνει. Να μην τα φορτώνουμε και όλα στον πειρασμό. Ένας υποτακτικός, που ζούσε σε μια Καλύβη με τον Γέροντά του, μια φορά που έμεινε για λίγο μόνος του, πήρε ένα αυγό, το έβαλε πάνω σε ένα κλειδί – ήταν από εκείνα τα μεγάλα, τα παλιά κλειδιά – και άναψε από κάτω ένα κερί, για να το ψήση! Μπαίνει ξαφνικά ο Γέροντας και τον βλέπει. «Τί κάνεις εκεί;», του λέει. «Νά, Γέροντα, ο πειρασμός με έβαλε να ψήσω εδώ ένα αυγό», του λέει ο υποτακτικός του. Και τότε ακούσθηκε μια άγρια φωνή: «Αυτήν την τέχνη εγώ δεν την ήξερα· από αυτόν την έμαθα»! Ο διάβολος μερικές φορές κοιμάται, και εμείς τον προκαλούμε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι αμαρτωλοί έχουν πολύ υλικό για ταπείνωση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όσοι έζησαν αμαρτωλή ζωή και ύστερα μετανόησαν και άρχισαν να ζουν πνευματικά, πρέπει να δέχωνται στην συνέχεια με χαρά τις ταπεινώσεις και τις θλίψεις που τους συμβαίνουν, γιατί έτσι εξοφλούν. Βλέπουμε την Οσία Μαρία την Αιγυπτία, που έζησε αμαρτωλή ζωή, όταν μετάνοιωσε και άλλαξε ζωή, οι κοσμικές επιθυμίες την βασάνιζαν. Έκανε όμως μεγάλη πάλη, για να τις διώχνη. Της έλεγε ο διάβολος: «Τί θα χάσης, αν δής λιγάκι την Αλεξάνδρεια; Δεν σού λέω να διασκεδάσης, μόνο να την δής λίγο από μακριά», και εκείνη ούτε γύριζε να κοιτάξη. Τί μετάνοια είχε! Άλλες Όσιες, που δεν είχαν ζήσει κοσμική ζωή, δεν είχαν πόλεμο. Η Οσία Μαρία, που είχε ζήσει κοσμική ζωή, είχε και πόλεμο. Η ταλαιπωρία αυτή είναι η καυτηρίαση των πληγών της αμαρτίας. Και έτσι φθάνουν στο τέλος και οι μεν και οι δε στην ίδια κατάσταση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σ᾿ αυτές τις περιπτώσεις, Γέροντα, δεν υπάρχει καθόλου θεία παρηγοριά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς! πολλή, πολλή! Η Οσία Μαρία είχε φθάσει σε τέτοια μέτρα πνευματικά, που βρισκόταν έναν πήχυ πάνω από την γή, όταν προσευχόταν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι πολύ αμαρτωλοί, αν γνωρίσουν τον εαυτό τους, έχουν φυσιολογικά και πολύ υλικό για ταπείνωση. Η κάθε πτώση είναι φυσικά πτώση, αλλά είναι και υλικό για ταπείνωση και προσευχή. Οι αμαρτίες, αν αξιοποιηθούν για ταπείνωση, είναι σαν την κοπριά που ρίχνουμε στα φυτά. Γιατί να μη χρησιμοποιήση λοιπόν κανείς αυτό το υλικό, για να λιπάνη το χωράφι της ψυχής του, για να γίνη γόνιμο και να καρποφορήση; Ένας δηλαδή που έχει κάνει μεγάλες αμαρτίες, αν αισθανθή πόσο έφταιξε και πή: «δέν πρέπει να σηκώνω κεφάλι, να βλέπω άνθρωπο», επειδή ταπεινώνεται πολύ, δέχεται πολλή Χάρη, προχωρεί σταθερά και μπορεί να φθάση σε μεγάλα μέτρα. Ενώ ένας που δεν έχει κάνει μεγάλες αμαρτίες, αν δεν τοποθετηθή σωστά, ώστε να πή: «μέ φύλαξε ο Θεός από τόσες κακοτοπιές· είμαι πολύ αχάριστος, είμαι πιο αμαρτωλός από τον πιο αμαρτωλό», υστερεί πνευματικά από τον άλλον.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμηθήτε π.χ. τον Φαρισαίο και τον Τελώνη[59]. Ο Φαρισαίος είχε έργα, αλλά είχε και υπερηφάνεια. Ο Τελώνης είχε αμαρτίες, αλλά είχε αναγνώριση, συντριβή, ταπείνωση – το κυριώτερο που ζητάει από τον άνθρωπο ο Χριστός –, γι᾿ αυτό με εύκολο τρόπο σώθηκε. Είδατε πώς τον έχουν τον Φαρισαίο σε μια εικόνα! Δείχνει με το δάχτυλό του τον Τελώνη: «Δεν είμαι σαν κι αυτόν!»... Ο καημένος ο Τελώνης κρυβόταν πίσω από την κολόνα· δεν είχε μούτρα να δη γύρω του. Και ο Φαρισαίος έδειξε στον Χριστό που βρισκόταν ο Τελώνης! Το προσέξατε; Λές και ο Χριστός δεν ήξερε που ήταν ο Τελώνης! Ο Φαρισαίος, ενώ έκανε όλα τα τυπικά, όλα πήγαν χαμένα. Τί κάνει η υπερηφάνεια! Όταν ένας άνθρωπος έχη αμαρτίες και δεν έχη ταπείνωση, τότε έχει τις αμαρτίες του Τελώνη και την υπερηφάνεια του Φαρισαίου. Διπλά... χαρίσματα! «Έμ ψωριάρης, έμ κασσιδιάρης», όπως λένε στην Ήπειρο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο μπορείτε, προσπαθήστε να αποβάλετε τις πνευματικές τοξίνες, τα πάθη, για να αποκτήσετε την πνευματική σας υγεία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Η επιμέλεια της συνειδήσεως
- type: h2
  initial:
    ru: ''
  text:
    ru: Να μελετούμε την συνείδησή μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός έδωσε στους Πρωτοπλάστους την συνείδηση, τον πρώτο θείο νόμο. Την χάραξε βαθιά στις καρδιές τους και από τότε ο κάθε άνθρωπος την παίρνει κληρονομιά από τους γονείς του καί, όταν δεν ενεργή σωστά, αυτή δουλεύει μέσα του, τον ελέγχει και τον οδηγεί στην μετάνοια. Πρέπει όμως ο άνθρωπος να κάνη σωστή πνευματική εργασία και να μελετάη την συνείδησή του, για να μπορή να ακούη πάντοτε την φωνή της. Εάν δεν την μελετάη, δεν θα ωφεληθή ούτε από πνευματικές μελέτες ούτε από συμβουλές αγίων Γερόντων, αλλά ούτε και τις εντολές του Θεού δεν θα μπορέση να τηρήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, ο άνθρωπος να μην πιάνη καθόλου τον εαυτό του και να μη βλέπη ότι βαδίζει λανθασμένα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο άνθρωπος δεν παρακολουθή τον εαυτό του και δεν ξεσκονίζη την συνείδησή του, η συνείδησή του πιάνει σιγά-σιγά πουρί και γίνεται αναίσθητος. Αμαρτάνει και είναι σαν να μη συμβαίνη τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, να μας λέγατε κάτι για την επιμέλεια της συνειδήσεως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο άνθρωπος, για να είναι σίγουρος ότι αυτό που κάνει είναι αυτό που του λέει η συνείδησή του, πρέπει να παρακολουθή τον εαυτό του και να τον εκθέτη στον πνευματικό του. Γιατί μπορεί να έχη καταπατήσει την συνείδησή του και να νομίζη ότι πάει καλά. Ή να έχη φτιάξει λανθασμένη συνείδηση καί, ενώ έχει κάνει έγκλημα, να νομίζη ότι έκανε ευεργεσία. Ή, ακόμη, να έχη κάνει την συνείδησή του υπερευαίσθητη και να πάθη ζημιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κατακρίνω εσωτερικά, χωρίς να υπάρχη ο ανάλογος έλεγχος. Μήπως έχω αναισθητοποιηθή και γι᾿ αυτό δεν ελέγχομαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Θέλει πολλή προσοχή. Βλέπεις, όταν κάνη κανείς μια αμαρτία για πρώτη φορά, νιώθει κάποιον έλεγχο, στενοχωριέται. Αν την επαναλάβη για δεύτερη φορά, νιώθει λιγώτερο έλεγχο καί, αν δεν προσέξη και συνεχίση να αμαρτάνη, πωρώνεται η συνείδησή του. Μερικοί, όταν λ.χ. τους κάνης παρατήρηση για κάποιο σφάλμα τους, αλλάζουν θέμα, για να μην τους πειράζη η συνείδηση και στενοχωριούνται, σαν τους Ινδούς που κάνουν νιρβάνα[60]. Ένας νεαρός, εκεί στα Ιμαλάια, σκότωσε πέντε Ιταλούς ορειβάτες καί, αφού τους έθαψε, άρχισε να κάνη αυτοσυγκέντρωση. Κάθησε κάτω και έλεγε δύο ώρες «ξύλο-ξύλο...», για να βγή στο κενό, να ξεχάση και να μην τον πειράζη ο λογισμός. Ας πούμε ότι μαλώνω τώρα μια αδελφή, γιατί έκανε μια αταξία. Αν αυτή η αδελφή δεν κάνη σωστή πνευματική εργασία και δεν κοιτάη πώς να διορθωθή, μπορεί εκείνη την ώρα να μου πή: «σήμερα θα σημάνουμε για εσπερινό νωρίτερα...», για να αλλάξη θέμα. Μετά ο διάβολος θα την μπερδέψη και θα της πή: «Μήν ανησυχής· αυτό το έκανες, για να μη στενοχωριέται ο Γέροντας». Της το δικαιολογεί και ο διάβολος! Δεν λέει: «τό έκανα, για να καταπατήσω την συνείδησή μου», αλλά λέει: «τό έκανα, για να μη στενοχωρηθή ο Γέροντας»! Είδατε τί κάνει το ταγκαλάκι; Λεπτή εργασία! Γυρίζει το κουμπί σε άλλη συχνότητα, για να μη δούμε το σφάλμα μας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κανείς να πιάνη λεπτομέρειες και τα χονδρά σφάλματα να μην τα πιάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πώς δεν μπορεί! Μια φορά ένας γνωστός μου πνευματικός μου διηγήθηκε το εξής περιστατικό: Μια γυναίκα, όταν πήγε να εξομολογηθή, έκλαιγε συνέχεια και έλεγε: «Δεν ήθελα να την σκοτώσω». «Κοίταξε, της είπε ο πνευματικός, αν υπάρχη μετάνοια, ο Θεός συγχωρεί· συγχώρεσε τον Δαβίδ[61]». «Ναί, αλλά δεν το ήθελα», έλεγε εκείνη. «Καλά, πώς έγινε και την σκότωσες;», την ρώτησε ο πνευματικός. «Νά, καθώς ξεσκόνιζα, την χτύπησα με την πετσέτα και την σκότωσα την μύγα. Δεν το ήθελα»! Εν τω μεταξύ αυτή κορόιδευε τον άνδρα της, είχε εγκαταλείψει τα παιδιά της, είχε διαλύσει το σπίτι της και γύριζε στους δρόμους, και αυτά τα ανέφερε σαν να μη συνέβαινε τίποτε. «Γι᾿ αυτά χρειάζεται κανόνας», της λέει ο πνευματικός. «Και γιατί χρειάζεται γι᾿ αυτά κανόνας;», λέει στον πνευματικό. Έμ, πώς να βοηθηθή αυτή;'
- type: h2
  initial:
    ru: ''
  text:
    ru: Καπακωμένη συνείδηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, όταν μου λένε: «αυτή η επιθυμία είναι στο υποσυνείδητο, αλλά δεν το καταλαβαίνεις», πώς θα το καταλάβω;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν προσέξης, θα δής πώς, ενώ λές ότι δεν έχεις τίποτε, δεν νιώθεις και καλά. Γι᾿ αυτό χρειάζονται εξετάσεις. Όταν ένας δεν νιώθη καλά, έχη μια σωματική κατάπτωση κ.λπ., του κάνουν εξετάσεις μικροβιολογικές, αξονική τομογραφία, για να βρουν από που προέρχεται αυτό που αισθάνεται. Αν βλέπης ότι δεν έχεις γαλήνη αλλά στενοχώρια, να ξέρης ότι υπάρχει μέσα σου κάτι ατακτοποίητο και πρέπει να το βρής, για να το διορθώσης. Κάνεις, ας υποθέσουμε, ένα σφάλμα· στενοχωριέσαι, αλλά δεν το εξομολογείσαι. Σού συμβαίνει μετά ένα ευχάριστο γεγονός και νιώθεις χαρά. Αυτή η χαρά σκεπάζει την στενοχώρια για το σφάλμα σου και σιγά-σιγά το ξεχνάς· δεν το βλέπεις, επειδή καπακώθηκε από την χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι χαρές σκεπάζουν το σφάλμα, το πάνε πιο κάτω, πιο βαθιά, αλλά εκείνο εσωτερικά δουλεύει. Έτσι ο άνθρωπος αρχίζει να σκληραίνη, γιατί καταπατά την συνείδησή του και η καρδιά του πιάνει σιγά-σιγά γλίτσα. Ύστερα το ταγκαλάκι όλα του τα δικαιολογεί: «αυτό δεν είναι τίποτε, εκείνο είναι φυσιολογικό», ανάπαυση όμως δεν έχει, γιατί η στενοχώρια δουλεύει από κάτω. Νιώθει μια ανησυχία, δεν έχει εσωτερική γαλήνη. Ζή με ένα συνεχές άγχος. Είναι βασανισμένος. Δεν βρίσκει τί φταίει, γιατί τα σφάλματά του είναι καπακωμένα. Δεν καταλαβαίνει ότι υποφέρει, επειδή αμάρτησε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί να βοηθηθή ένας τέτοιος άνθρωπος, αν του πής ποιά είναι η αιτία της ταλαιπωρίας του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, θέλει προσοχή, γιατί, όταν του βάλης τα πράγματα στην θέση τους, ξυπνάει η συνείδηση και αρχίζει ο έλεγχος. Και αν δεν ταπεινωθή, μπορεί να φθάση στην απελπισία, επειδή δεν αντέχει την αλήθεια. Αν όμως ταπεινωθή, θα βοηθηθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχουν άνθρωποι που γεννιούνται με πωρωμένη συνείδηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν υπάρχουν άνθρωποι που γεννήθηκαν με πωρωμένη συνείδηση. Δεν έκανε ο Θεός τέτοια συνείδηση. Όταν όμως καπακώνη κανείς τα σφάλματά του, η συνείδησή του σιγά-σιγά πιάνει πουρί και δεν τον ελέγχει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γίνεται, Γέροντα, αυτόνομος, κάνει δικούς του νόμους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, είναι φοβερό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι πλάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, πλάνη είναι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η λανθασμένη συνείδηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνά λέτε ότι ο άνθρωπος πρέπει να προσέξη να μη φτιάξη λανθασμένη συνείδηση. Πώς δημιουργείται η λανθασμένη συνείδηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν ο άνθρωπος αναπαύη τον λογισμό του, καταπατά την συνείδησή του. Και όταν αναπαύη τον λογισμό του για πολύ καιρό, κάνει μια άλλη, δική του, συνείδηση, μια συνείδηση στα μέτρα του, δηλαδή μια λανθασμένη συνείδηση. Τότε όμως δεν έχει ανάπαυση μέσα του, γιατί ανάπαυση εσωτερική δεν μπορεί να φέρη η λανθασμένη συνείδηση. Βλέπεις, ακόμη και όταν κάποιος κάνη ένα σφάλμα και ο άλλος του λέη: «δέν έφταιγες, τί στενοχωριέσαι;» ή κάνη ότι δεν κατάλαβε το σφάλμα του, πάλι ανάπαυση δεν βρίσκει. Είναι μερικοί που πάνε με τους γκουρούδες κ.λπ. καί, όταν καταλάβουν ότι δεν πάνε καλά, έρχονται να με ρωτήσουν. Και ενώ τους λέω κάτι, για να τους βοηθήσω, πάλι επιμένουν: «Όχι, αυτό που πιστεύουμε είναι σωστό». «Καλά, αφού είναι σωστό και είσαι αναπαυμένος από αυτό το σωστό, γιατί έρχεσαι να με ρωτήσης;». Ενώ δεν αναπαύονται στο στραβό, επιμένουν, προσπαθούν από εδώ–από εκεί να ψευτοαναπαυθούν, ανάπαυση όμως αληθινή δεν βρίσκουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κανείς να ζήση με λανθασμένη συνείδηση σε όλη του την ζωή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άμα πιστεύη στον λογισμό του, μπορεί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα την διορθώση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν σκέφτεται ταπεινά, αν δεν έχη εμπιστοσύνη στον λογισμό του και τον συζητάη με τον πνευματικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, ο άνθρωπος, όταν έχη μια ευαισθησία, να δημιουργήση λανθασμένη συνείδηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να δημιουργήση λανθασμένη συνείδηση, δεν θα είναι καλή η ευαισθησία του. Το ένα λανθασμένο θα δημιουργήση και άλλο λανθασμένο. Μερικοί, ενώ λένε: «εγώ είμαι ευαίσθητος», στους άλλους φέρονται βάρβαρα και τους κατσαδιάζουν χωρίς λόγο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η συνείδηση αυτών που δικαιολογούνται έχει πιάσει πουρί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτός που δικαιολογείται έχει και λίγο έλεγχο μέσα του· δεν είναι αναίσθητος. Και όταν κανείς δεν είναι αναίσθητος, πονάει για το σφάλμα του και μετά έρχεται η θεία παρηγοριά. Αλλά, όποιος φτιάξη λανθασμένη συνείδηση, φθάνει σε αναισθησία· αυτός καυχιέται για το έγκλημα. Έχω δει ανθρώπους πού, ενώ έχουν κάνει εγκλήματα, τα λένε με τέτοιον τρόπο, που σού τα παρουσιάζουν σαν κατορθώματα. Γιατί, αν αναπτύξη κανείς λανθασμένη συνείδηση, αυτό δεν είναι απλώς πώρωση, αλλά κάτι παραπάνω από πώρωση. Όταν ήμουν στην Μονή Στομίου, στην Κόνιτσα, ήρθε ένας και μου λέει: «Θέλω να εξομολογηθώ». «Δεν είμαι ιερεύς», του λέω. «Όχι, θέλω να τα πω σ᾿ εσένα», μου λέει. Ήταν εκεί και μερικές γυναίκες που είχαν ανεβή να προσκυνήσουν. «Καλύτερα να φύγετε τώρα», τις λέω. «Όχι, τις λέει αυτός, δεν πειράζει, καθήστε». Και άρχισε να διηγήται τί έκανε στα νιάτα του: «Όταν ήμουν νέος, είχα πάει να μάθω τσαγκάρης, αλλά όλο νύσταζα, γιατί την νύχτα πήγαινα με μια σπείρα και έκλεβα. Στην περιοχή μας ήταν ένας τσαούσης[62]και μας έλεγε: «Πάτε να κλέψετε. Εγώ θέλω δύο κριάρια. Από εκεί και πέρα εσείς κλέψτε ό,τι θέλετε». Πηγαίναμε λοιπόν στα σπίτια των Χριστιανών, άφηνα την κάπα κάτω, έδινα μια στα σκυλιά, στην μασέλα, με μια βέργα από κρανιά που είχα μαζί μου, και μπαίναμε μέσα. Κλέβαμε δυο κριάρια και όσα αρνιά μπορούσαμε. Δίναμε τα κριάρια στον τσαούση και κρύβαμε τα αρνιά στον στάβλο μας. Ο τσαούσης μας έκλεινε αμέσως στην φυλακή. Τα αφεντικά που μας είχαν δει να κλέβουμε, πήγαιναν το πρωί στην αστυνομία και έλεγαν: «Ο τάδε και ο τάδε μας έκλεψαν». «Ο τάδε και ο τάδε; Μά αυτοί είναι στην φυλακή. Γιατί τους συκοφαντήσατε;». Δώσ᾿ του ξύλο... Μια φορά πήγαμε σε ένα κοπάδι που το φύλαγε ένα βλαχάκι ψηλό μέχρι εκεί επάνω με τον πατέρα του. «Τώρα πώς θα μπούμε στο κοπάδι; Θα μας πετάξουν σαν τα σπιρτόξυλα», μου λένε οι άλλοι. Παίρνω τότε τον γκρά[63], σημαδεύω το βλαχάκι, και μπάμ, σωριάζεται κάτω. Δένω και τον πατέρα του σε μια γκορτσιά... Πήραμε, πήραμε...». Και τα έλεγε όλα αυτά σαν κατορθώματα, και γελούσε! Που οδηγεί η λανθασμένη συνείδηση!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και γνώρισα έναν αστυνομικό που υπηρετούσε στο τμήμα μεταγωγών και έκλαιγε συνέχεια ο καημένος, γιατί είχε συνοδεύσει μια φορά από την μια φυλακή στην άλλη κάποιον που τον πέρασαν μετά στρατοδικείο και τον σκότωσαν, επειδή είχε κάνει εγκλήματα πολλά. Έψαξε, βρήκε τους συγγενείς του και τους ζήτησε συγγνώμη, αλλά ένας αδελφός του, που ήταν στην Αμερική, του απάντησε: «Έπρεπε να τον είχαν σκοτώσει πιο νωρίς, γιατί θα γλύτωναν κάμποσοι άνθρωποι». Βλέπετε τί διαφορά έχει η μια κατάσταση από την άλλη! Αυτός θεωρούσε ένοχο τον εαυτό του, γιατί απλώς συνόδευσε κατόπιν εντολής της υπηρεσίας του έναν εγκληματία, ενώ ο άλλος διηγείτο τα εγκλήματα που έκανε σαν κατορθώματα και καυχιόταν γι᾿ αυτά!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το ψεύτικο δεν αναπαύει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κάποιος έχη κάνει έναν δικό του κόσμο, γιατί πιστεύει στον λογισμό του, μπορεί να βοηθηθή από την προσευχή των άλλων;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Τί ανάγκη έχει να βοηθηθή, αφού έκανε έναν δικό του κόσμο;... Μικρό πράγμα είναι να κάνη κανείς έναν ολόκληρο κόσμο δικό του;... Κοίταξε, αν κάποιος με τον λογισμό του κάνη έναν δικό του κόσμο, νομίζεις ότι έχει ανάπαυση, ότι αισθάνεται δηλαδή χαρά; Ψέμα είναι. Το ψέμα δεν πληροφορεί τον άνθρωπο. Ας πούμε, αναγκάζεται ένας να πη ένα ψέμα, για να γλυτώση κάποιον. Μπορεί να τον γλύτωσε ακόμη και από θάνατο, αλλά το ψέμα που είπε δεν παύει να είναι μισή αμαρτία. Ή λέει κανείς καμμιά φορά, με καλό λογισμό, ένα ψέμα, για να βοηθήση μια περίπτωση, να μη δημιουργηθή σκάνδαλο. Π.χ. έρχεται στο Μοναστήρι ένας γνωστός κρυφά να πη κάποιο πρόβλημα της οικογενείας του, για να ξεσκάση. Έρχεται μετά, ας υποθέσουμε, ο αδελφός του και σε ρωτάει: «Πέρασε από εδώ ο τάδε;». Αν του πής «πέρασε», θα δημιουργηθή ολόκληρο θέμα, γιατί ο άλλος εκτίθεται. Οπότε λές «δέν ξέρω». Γιατί, αν πής «ήρθε», μπορεί να πάη ακόμη και να τον δείρη! Αυτό είναι άλλο. Αλλά πρέπει να προσέξη κανείς, γιατί, αν συμβούν τρία–τέσσερα τέτοια περιστατικά, σιγά-σιγά μπορεί να προχωρήση και πιο πέρα. Να συνηθίση να χρησιμοποιή το ψέμα στα καλά καθούμενα και να αποκτήση λανθασμένη συνείδηση. Να φθάση να λέη ολόκληρα παραμύθια, χωρίς να τον πειράζη καθόλου η συνείδηση. Αυτό γίνεται ύστερα επιστήμη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έ, πώς τα ταιριάζουν μερικοί τα ψέματα, αν εξασκηθούν! Ώ! Ολόκληρο παραμύθι μπορεί να πλάθουν και να σε πείθουν! Είχε έρθει στο Καλύβι μια φορά κάποιος γνωστός μου· ήταν εκεί και μια συντροφιά, πατριώτες ενός παιδιού που το είχα βοηθήσει. Αυτό το καημένο, ενώ ήταν έξυπνο, καλό παιδί, ήταν τεμπέλικο· δεν ήθελε να δουλεύη. Είχε μάθει να γυρίζη. Τέσσερα χρόνια προσπαθούσα να το φέρω σε λογαριασμό. Είπα λοιπόν εκείνη την φορά στους πατριώτες του: «Φροντίστε αυτό το παιδί για καμμιά δουλειά. Έχω προσπαθήσει και άλλες φορές να το βοηθήσω. Το είχα στείλει και στην Καστοριά, σε κάτι γνωστούς, να μάθη γουναράς, αλλά έφυγε. Νέος είναι, κρίμα να χαραμιστή. Μια μάνα έχει· πέθανε ο πατέρας του». Αρχίζει τότε εκείνος ο γνωστός μου να λέη στους άλλους: «Ναί, είχαμε φροντίσει με τον πατέρα Παΐσιο να πάη το παιδί να μάθη εκεί πέρα γουναράς. Και έπειτα, όταν έφυγε από εκεί, πόσα χρήματα έδωσα στα τηλεγραφήματα που έστελνα στα αφεντικά του, για να μην ανησυχούν! Αλλά δεν πειράζει· αυτά δεν συζητιούνται. Είχα πει τότε στον πάτερ ότι δεν στρώνει»! «Τί λέει;», σκέφτηκα. Δεν ήθελα να πω και τίποτε, για να μην τον προσβάλω. Ενώ πρώτη φορά άκουγε το θέμα, έπλασε ολόκληρο παραμύθι, ότι είχαμε φροντίσει μαζί για εκείνο το παιδί, ότι βρήκαμε λύση να πάη να μάθη γουναράς κ.λπ.! Όπως τα έλεγε, κι εμένα με προβλημάτισε!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπροστά σας τα έλεγε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπροστά μου τα έλεγε. Ήταν και οι άλλοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί καταλάβαινε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί καταλάβαινε! Εκείνη την στιγμή αισθανόταν μια ικανοποίηση εγωιστική, αλλά μετά βασανιζόταν. Είχε μήπως ειρήνη μέσα του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ένας άνθρωπος λέη κάποιο γεγονός λίγο μεγαλοποιημένο...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, με λίγη σάλτσα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από κενοδοξία το κάνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, από τί το κάνει; Από κενοδοξία, από εγωισμό τα λέει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί θα βοηθήση έναν τέτοιον άνθρωπο να το διορθώση αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να πάψη να λέη ψέματα. Πρέπει να ξέρη ότι το ψέμα, ακόμη και όταν έχη ελαφρυντικά, δεν παύει να είναι μισή αμαρτία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να μας δώσουν κάτι, για να μας οικονομήσουν, και εμείς να νομίζουμε ότι μας το έδωσαν, γιατί το αξίζουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε, αν σού πώ: «εσύ, αδελφή, μπορείς να φθάσης στα μέτρα της Αγίας σου!», μπορεί να χαζογελάσης λίγο, αλλά μέσα σου ανάπαυση δεν θα έχης. Το ψεύτικο δεν αναπαύει, γιατί δεν έχει Χάρη Θεού. Και ο άδικος που αδικεί και λέει: «αυτό είναι δικό μου», δεν αναπαύεται. Νά, οι Τούρκοι στην Κωνσταντινούπολη, αν και πέρασαν τόσα χρόνια από την Άλωση, όταν βλέπουν τους Έλληνες που πηγαίνουν εκεί, νιώθουν ότι έχουν ένα αρπαγμένο πράγμα και κοιτάνε σαν να ήρθε ο ιδιοκτήτης! Και είναι Τούρκοι και πέρασαν τόσα χρόνια!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η σωστή συνείδηση πληροφορεί τον άνθρωπο σωστά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν υπάρχει μεγαλύτερο πράγμα στον άνθρωπο από την αναπαυμένη συνείδηση. Είναι μεγάλο πράγμα να μη σε πειράζη η συνείδησή σου, ότι μπορούσες να κάνης και κάτι άλλο και δεν το έκανες. Τότε ο άνθρωπος έχει μια συνεχή εσωτερική χαρά και όλη η ζωή του είναι πανηγύρι. Αυτή η εσωτερική χαρά δίνει την πνευματική δύναμη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα καταλάβη κανείς ότι είναι ευάρεστο στον Θεό αυτό που κάνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχει ο άνθρωπος εσωτερική πληροφορία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φθάνει η δική του πληροφορία ή χρειάζεται και η μαρτυρία των άλλων;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μιλάω για έναν που έχει σωστή συνείδηση· δεν μιλάω για έναν που έχει λανθασμένη συνείδηση. Η σωστή συνείδηση πληροφορεί τον άνθρωπο σωστά. Τότε ο άνθρωπος νιώθει σιγουριά, ελπίδα και λέει με ταπείνωση: «Δεν είμαι για τον Παράδεισο· είμαι για την κόλαση, αλλά πιστεύω ότι η αγάπη και το έλεος του Θεού δεν θα μ᾿ αφήσουν». Το νιώθει αυτό, γιατί αγωνίζεται· δεν κάθεται, χωρίς να κάνη τίποτε, και αναπαύει τον λογισμό του λέγοντας: «Ο Θεός θα με σώση».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η συνείδηση..., φοβερό! Δεν υπάρχει μεγαλύτερη φωτιά, μεγαλύτερη κόλαση από το κάψιμο της συνειδήσεως. Δεν υπάρχει φοβερώτερο και βασανιστικώτερο σαράκι από το σαράκι της συνειδήσεως. Οι κολασμένοι θα υποφέρουν αιωνίως, γιατί θα τους βασανίζη η σκέψη πώς έχασαν τα αγαθά του Παραδείσου για λίγα χρόνια επιγείου ζωής, αν και αυτά ήταν γεμάτα τύψεις και άγχος. Τα πάθη τότε δεν θα ικανοποιούνται και αυτό θα είναι άλλο βάσανο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί ο μοναχός να ζη πρακτικά το μαρτύριο της συνειδήσεως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το μαρτύριο της συνειδήσεως είναι για όλους τους ανθρώπους· δεν είναι μόνο για τον μοναχό. Οι μοναχοί έχουν επιπλέον και το γλυκό μαρτύριο της ασκήσεως. Στην ουσία όμως δεν υπάρχει μαρτύριο της συνειδήσεως για έναν που αγωνίζεται σωστά. Γιατί, όσο πονάει κανείς πνευματικά, όσο πονάει δηλαδή είτε για τα χάλια του, είτε γιατί συμμετέχει στο Πάθος του Κυρίου, τόσο ανταμείβεται με θεία παρηγοριά. Ακόμη κι αν έχη θλίψεις, στενοχώριες κ.λπ., όταν έχη αναπαυμένη την συνείδησή του, αισθάνεται μέσα του θεία παρηγοριά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 3 – Η παρακολούθηση και η γνώση του εαυτού μας
- type: h2
  initial:
    ru: ''
  text:
    ru: Η μελέτη του εαυτού μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στον στρατό, στις Διαβιβάσεις, είχαμε δίκτυο παρακολουθήσεως και πίνακα αναγνωρίσεως. Παρακολουθούσαμε και καταλαβαίναμε ποιός σταθμός ήταν ξένος και ποιός δικός μας, γιατί μερικές φορές έμπαιναν ενδιάμεσα και ξένοι σταθμοί. Έτσι και ο άνθρωπος πρέπει να παρακολουθή τους λογισμούς του και τις ενέργειές του, για να βλέπη αν συμφωνούν με τις εντολές του Ευαγγελίου, να πιάνη τα σφάλματά του και να αγωνίζεται να τα διορθώνη. Γιατί, αν αφήνη ένα σφάλμα του να περνά απαρατήρητο ή, όταν του λέη ο άλλος κάποιο ελάττωμά του, δεν κάθεται να το σκεφθή, δεν μπορεί να προκόψη πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η μελέτη του εαυτού μας είναι η πιο ωφέλιμη από όλες τις μελέτες. Μπορεί κανείς να μελετάη πολλά βιβλία, αλλά, αν δεν παρακολουθή τον εαυτό του, όλα όσα διαβάζει πάνε χαμένα. Ενώ, αν παρακολουθή τον εαυτό του, και λίγο να μελετάη, πολύ ωφελείται. Τότε η συμπεριφορά του γίνεται λεπτή σε όλες τις εκδηλώσεις, αλλιώς κάνει χονδρά σφάλματα και δεν το καταλαβαίνει. Παρατηρώ εκεί στο Καλύβι: Με βλέπουν να κουβαλώ τα κούτσουρα[64]πέρα από την άλλη άκρη, για να καθήσουν, καί, όταν σηκώνωνται να φύγουν, δεν σκέφτονται ποιός θα τα πάη στην θέση τους. Ή βλέπουν ότι φέρνω ένα κούτσουρο και δεν έχει άλλα, για να καθήσουν, και περιμένουν να τους τα κουβαλήσω εγώ. Αν σκέφτονταν λίγο, θα έλεγαν: «καλά, είμαστε πέντε-έξι άνθρωποι· θα κουβαλήση μόνος του τόσα κούτσουρα από την άλλη μεριά;», και τάκ-τάκ θα πήγαιναν να τα φέρουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, με ρώτησε μια μικρή αδελφή: «Ο Γέροντας, όταν ήταν αρχάριος μοναχός, δεν είχε πτώσεις στον αγώνα του; Δεν του περνούσε κανένας αριστερός λογισμός; Δεν έπεφτε στην κατάκριση;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ, όταν συνέβαινε κάτι στον αγώνα μου ή μου έλεγαν μια κουβέντα, δεν τα περνούσα «αφορολόγητα».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί σημαίνει, Γέροντα, «αφορολόγητα»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το να περνάη κανείς τα σφάλματά του με αδιαφορία. Να μην τον αγγίζουν· να περνάνε απ᾿ έξω. Όπως η γή, όταν σκληρυνθή, όση βροχή και να πέση, δεν ρουφάει νερό μέσα της, ένα τέτοιο πράγμα συμβαίνει και σ᾿ αυτήν την περίπτωση· σκληρύνεται το χωράφι της καρδιάς από την αδιαφορία καί, ό,τι κι αν του πούν, ό,τι κι αν συμβή, δεν τον αγγίζει, για να αισθανθή την ενοχή του και να μετανοήση. Εγώ, αν έλεγε λ.χ. κάποιος ότι είμαι υποκριτής, δεν έλεγα: «κακό χρόνο νάχη αυτός που το είπε», αλλά έψαχνα να βρώ τί ήταν αυτό που τον ανάγκασε να πη αυτήν την κουβέντα. «Κάτι συμβαίνει, έλεγα. Δεν φταίει ο άλλος. Κάτι δεν πρόσεξα, κάποια αφορμή έδωσα και παρεξήγησε την συμπεριφορά μου. Δεν μπορεί στα καλά καθούμενα να το είπε αυτό. Αν πρόσεχα και είχα κινηθή με σύνεση, δεν θα με παρεξηγούσε. Τον έβλαψα τον άλλον και θα δώσω λόγο στον Θεό», και προσπαθούσα αμέσως να βρώ το σφάλμα μου και να το διορθώσω. Δεν εξέταζα δηλαδή πώς το είπε ο άλλος· αν το είπε από ζήλεια, από φθόνο ή αν το άκουσε από άλλον και το κατάλαβε αλλιώς. Δεν με απασχολούσε αυτό. Και τώρα, σε όλες τις περιπτώσεις, έτσι κάνω. Αν μου πη λ.χ. κάποιος μια κουβέντα, ούτε κοιμάμαι. Και αν είναι έτσι όπως τα λέει εκείνος, θα στενοχωρηθώ και θα κοιτάξω να διορθωθώ. Και αν δεν είναι έτσι, πάλι θα στενοχωρηθώ, γιατί σκέφτομαι ότι εγώ έφταιξα σε κάτι· κάπου δεν πρόσεξα και τον σκανδάλισα. Δεν ρίχνω το βάρος στον άλλον· εξετάζω πώς θα κρίνη ο Θεός αυτό που έκανα, όχι πώς θα με δούν οι άνθρωποι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν δεν εξετάζη ο άνθρωπος έτσι τα πράγματα, δεν ωφελείται από τίποτε. Γι᾿ αυτό πολλές φορές λέμε για κάποιον: «Αυτός έχει χάσει τον έλεγχο». Ξέρετε πότε χάνεται ο έλεγχος; Όταν δεν παρακολουθή ο άνθρωπος τον εαυτό του. Και όταν κάποιος πάσχη στο μυαλό και δεν ελέγχη τον εαυτό του, έχει ελαφρυντικά. Αλλά ένας που έχει μυαλό και δεν ελέγχει τις πράξεις του, επειδή δεν παρακολουθεί τον εαυτό του, αυτός δεν έχει ελαφρυντικά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πείρα από τις πτώσεις μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν εξετάζετε τον εαυτό σας, πολύ βοηθάει να παίρνετε μερικές φορές την ζωή σας με την σειρά, από την παιδική ηλικία, για να βλέπετε που βρισκόσασταν, που βρίσκεστε και που έπρεπε να βρίσκεστε. Αν δεν συγκρίνετε το παρελθόν με το παρόν, δεν καταλαβαίνετε ότι μπορεί μεν να είστε κάπως σε καλή κατάσταση, αλλά δεν βρίσκεστε εκεί που έπρεπε να βρίσκεστε και στενοχωρείτε τον Θεό. Όταν είναι κανείς νέος και βρίσκεται σε μια κατάσταση όχι πολύ καλή, δικαιολογείται· αλλά, όταν μεγαλώση, αν παραμένη στην ίδια κατάσταση ή έχη διορθωθή λίγο, δεν δικαιολογείται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο περνούν τα χρόνια, τόσο ωριμάζει ο άνθρωπος πνευματικά καί, αν αξιοποιήση την πείρα από το παρελθόν, προχωρεί πιο σταθερά και πιο ταπεινά. Πολλές φορές και τα ανεβοκατεβάσματα στον αγώνα βοηθούν για μια θετική και σταθερή πνευματική πορεία προς τα άνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το μικρό παιδί, όταν αρχίση να περπατάη, επόμενο είναι να πάρη και καμμιά κουτρουβάλα από την σκάλα, να χτυπήση και το κεφάλι στην κουπαστή, να ανεβή και στην καρέκλα και να πέση. Δεν καταλαβαίνει ότι, αν ανεβή στην καρέκλα και πατήση στην άκρη, θα τουμπάρη. Όσο όμως μεγαλώνει, αποκτάει πείρα, ωριμάζει και αρχίζει να προσέχη. «Την άλλη φορά, σκέφτεται, ανέβηκα εκεί πέρα και τουμπάρισα. Δεν θα ανεβώ τώρα». Έτσι και στον αγώνα μας, όταν όλα τα παρακολουθούμε και τα αξιοποιούμε για το καλό, αποκτούμε πείρα, καί, αν την χρησιμοποιούμε, πολύ μας βοηθάει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θυμάμαι, στο σπίτι, στην Κόνιτσα, είχαμε έξι άλογα, μεγάλα και μικρά. Μια μέρα που τα περνούσα από ένα γεφυράκι φτιαγμένο με κορμούς δένδρων και σανίδια, ένας σαπισμένος κορμός υποχώρησε και το πόδι του πιο μικρού αλόγου, που ήταν τεσσάρων χρόνων, πιάσθηκε ανάμεσα στα ξύλα. Από τότε, αν και έφτιαξα μεγαλύτερο το γεφυράκι και έβαλα γερά ξύλα, εν τούτοις, όταν φθάναμε εκεί, το αλογάκι  αντιστεκόταν, κουνούσε το κεφάλι πέρα–δώθε και ή έσπαζε το καπίστρι και έφευγε ή έδινε μια και πηδούσε απέναντι. Αν το άλογο των τεσσάρων χρόνων, που είναι άλογο, χρησιμοποίησε την πείρα και δεν ξαναπάτησε το πόδι του στο γεφύρι, πόσο μάλλον ο άνθρωπος πρέπει να χρησιμοποιή την πείρα από τις πτώσεις του!
- type: h2
  initial:
    ru: ''
  text:
    ru: Να εντοπίζουμε και να χτυπάμε τον εχθρό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν έχω αγαπήσει την ταπείνωση, την θυσία, το να δέχωμαι την αδικία...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν είναι ακριβώς έτσι όπως τα λές. Εγώ δεν ανησυχώ, γιατί βλέπω ότι έχει μπή μέσα σου η καλή ανησυχία. Γρήγορα θα απαλλαγής από τα πάθη, γιατί έχεις αρχίσει να πιάνης τον εαυτό σου. Αυτό βοηθάει περισσότερο από κάθε άλλον αγώνα. Όποιος πιάνει τον εαυτό του, αφήνει τον παλαιό εαυτό του και μπαίνει σε σωστό πνευματικό δρόμο. Ο παλαιός εαυτός μας κλέβει ό,τι κάνει ο καινούργιος. Όταν μάθουμε να τον πιάνουμε, πιάνουμε όλους τους κλέφτες που μας κλέβουν ό,τι καλό μας δίνει ο Θεός, και μας μένει ο πνευματικός πλούτος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν λυπηθώ πολύ για ένα σφάλμα μου, λ.χ. γιατί μίλησα άσχημα σε μια αδελφή, αυτό με βοηθάει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Βοηθάει, αλλά να προσέξης να μην ξεπεράσης και τα όρια. Να λυπηθής, αλλά να χαρής κιόλας, γιατί σού δόθηκε η ευκαιρία να εκδηλωθή η αρρώστια σου και να την θεραπεύσης. Να σκεφθής: «Για να μιλήσω άσχημα και να φερθώ έτσι, κάποιο πάθος υπήρχε μέσα μου και δόθηκε αυτή η ευκαιρία να βγή, για να το δώ και να το διορθώσω». Θα ζητήσης φυσικά και συγχώρεση από την αδελφή. Οι πτώσεις σε βοηθούν να γνωρίσης τον εαυτό σου. Βγαίνουν όλα στην επιφάνεια και σιγά-σιγά γίνεται η καλή εργασία. Βλέπεις, και οι γιατροί μερικές φορές δίνουν στους αρρώστους διάφορες ουσίες, για να εκδηλωθούν τα συμπτώματα της αρρώστιας και να κάνουν καλή διάγνωση. Δίνουν π.χ. ζάχαρη και κάνουν μετά εξέταση αίματος, για να δούν αν ανεβή το ζάχαρο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στον πνευματικό αγώνα χρειάζεται να επισημαίνουμε τα αδύνατα σημεία του χαρακτήρα μας, τα ελαττώματά μας, και ύστερα να προσπαθούμε να χτυπάμε εκεί. Και στον πόλεμο, όταν κάνουμε αναγνώριση μιας περιοχής, επισημαίνουμε τα σημεία, όπου είναι ο εχθρός ή απ᾿ όπου μπορεί να χτυπήση, και έχουμε τον νού μας εκεί. Γιατί, όταν ξέρης σε ποιά συγκεκριμένα σημεία βρίσκεται ο εχθρός, κινείσαι με σιγουριά. Βάζεις τον χάρτη κάτω και λές: «Ο εχθρός είναι εδώ κι εδώ· εμείς πρέπει να προλάβουμε να πιάσουμε εκείνα κι εκείνα τα σημεία. Από εκεί θα ζητήσουμε ενίσχυση, εδώ χρειάζονται αυτά τα όπλα» κ.λπ. Μπορείς δηλαδή να καταστρώσης ένα σχέδιο. Αλλά, για να μάθης που βρίσκεται ο εχθρός, πρέπει να ανησυχής και να ερευνάς· δεν μπορείς να κοιμάσαι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι καλύτερα να βρίσκη κανείς μόνος του τα ελαττώματά του ή να του τα λένε οι άλλοι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλό είναι να ψάχνη να τα βρίσκη μόνος του, αλλά καί, όταν του τα λένε, να μην αντιδρά· να το δέχεται με χαρά. Γιατί μπορεί να νομίζη ότι βλέπει τον εαυτό του, αλλά να τον βλέπη όπως θα ήθελε να είναι και όχι όπως είναι στην πραγματικότητα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι άλλοι τον βλέπουν καλύτερα τον εαυτό μου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μόνος του κανείς μπορεί, αν θέλη, να δη καλύτερα τον εαυτό του. Δηλαδή, μπορεί να εντοπίση καλύτερα μια αντίδρασή του, ένα σφάλμα του κ.λπ. και να βρη από ποιά αιτία προήλθε, ενώ ο άλλος βγάζει συμπεράσματα από υποθέσεις που κάνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να προσπαθή κανείς να δη τον εαυτό του όπως είναι και να μην τον βλέπη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αν μέσα στην προσπάθειά του αυτή υπάρχη υπερηφάνεια, δεν μπορεί να δη τον πραγματικό του εαυτό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να καθρεφτίζουμε τον εαυτό μας στους άλλους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο άνθρωπος βλέπει καλύτερα τον εαυτό του, όταν τον καθρεφτίζη στους άλλους. Ο Θεός στον κάθε άνθρωπο δίνει το χάρισμα που του χρειάζεται, για να βοηθηθή, άσχετα αν το αξιοποιήση ή όχι. Αν το αξιοποιήση, θα φθάση στην τελειότητα. Τα ελαττώματα πάλι είναι δικά μας· είτε τα αποκτήσαμε από δική μας απροσεξία είτε τα κληρονομήσαμε από τους γονείς μας, ο καθένας μας πρέπει να κάνη τον ανάλογο αγώνα, για να απαλλαγή από αυτά. Μέχρι να απαλλαγούμε, πρέπει να καθρεφτίζουμε τον εαυτό μας στα κουσούρια του άλλου και να εξετάζουμε που βρισκόμαστε εμείς. Αν δούμε λ.χ. στον άλλον ένα ελάττωμα, αμέσως να πούμε: «γιά να δώ, μήπως το έχω κι εγώ;» καί, αν το έχουμε, να αγωνισθούμε να το κόψουμε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και άν, Γέροντα, μου λέη ο λογισμός ότι δεν έχω αυτό το ελάττωμα, τί να λέω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να λές: «Εγώ έχω άλλα μεγαλύτερα· αυτό είναι πολύ μικρό σε σχέση με τα δικά μου». Γιατί μπορεί καμμιά φορά να είναι μικρότερα τα δικά σου ελαττώματα, αλλά να έχης λιγώτερα ελαφρυντικά. Αν εξετάζη κανείς έτσι τον εαυτό του, βλέπει ότι αυτός έχει μεγαλύτερα κουσούρια από τον άλλον. Ύστερα βλέπει και τις αρετές του άλλου. «Για να δώ, λέει, υπάρχει σ᾿ εμένα αυτή η αρετή; Όχι. Πω πώ! πόσο μακριά είμαι από εκεί που έπρεπε να βρίσκωμαι!». Όποιος εργάζεται έτσι, από όλα βοηθιέται, αλλοιώνεται με την καλή έννοια και τελειοποιείται. Ωφελείται από τους Αγίους, ωφελείται από τους αγωνιστές, ωφελείται ακόμη και από τους κοσμικούς. Γιατί, αν δη έναν κοσμικό λ.χ. να μην υπολογίζη τον εαυτό του, να θυσιάζεται, λέει: «αυτό το φιλότιμο το έχω εγώ; δεν το έχω, και είμαι και πνευματικός άνθρωπος!», οπότε προσπαθεί να τον μιμηθή. Όλοι οι άνθρωποι έχουμε να κάνουμε πολλή δουλειά.Ο Καλός Θεός όλα τα οικονομάει για το καλό μας με σοφό τρόπο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Όποιος γνωρίζει σωστά τον εαυτό του, έχει ταπείνωση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, την υπερηφάνεια συνήθως την καταλαβαίνω εκ των υστέρων, όταν πέσω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκοπός είναι να την καταλάβης, πριν πέσης. Όταν σού λέη κάποιος ότι έκανες κάτι καλό, να μην αισθάνεσαι ικανοποίηση. Να μην πιάνη, να μην κολλάη επάνω σου ο έπαινος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί θα με βοηθούσε σ᾿ αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το να γνωρίσης τον εαυτό σου. Αν ο άνθρωπος γνωρίση τον εαυτό του, τελείωσε. Οι έπαινοι είναι μετά ξένα σώματα· δεν κολλάνε επάνω του. Όταν λ.χ. ένας ξέρη ότι είναι γύφτος, δεν μπορεί να του κολλήση ο λογισμός ότι είναι βασιλιάς. Κι εσύ, αν νομίζης ότι είσαι πριγκίπισσα, θα είσαι λειψή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είμαι έτοιμη εκ των προτέρων να μη δέχωμαι τον έπαινο, αυτό δεν θα με βοηθούσε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό φυσικά πρέπει να γίνεται, αλλά άλλοτε θα είσαι έτοιμη και άλλοτε όχι. Σκοπός είναι να γνωρίσης τον εαυτό σου. Αν δεν γνωρίση κανείς τον παλαιό του άνθρωπο, δεν ταπεινώνεται και δεν μπορεί να γίνη η πνευματική διάσπαση του ατόμου του, για να μπή στην πνευματική τροχιά, και παραμένει στην κοσμική τροχιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να γνωρίζω τον εαυτό μου λανθασμένα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μά δεν μιλάμε για λανθασμένη κατάσταση. Αυτός που γνωρίζει σωστά τον εαυτό του έχει ταπείνωση. Και όταν ο άνθρωπος ταπεινωθή, θα έρθη οπωσδήποτε η Χάρις του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτός που κάνει την εργασία που χρειάζεται, για να γνωρίση τον εαυτό του, μοιάζει με αυτόν που σκάβει βαθιά και βρίσκει μέταλλα στο βάθος της γής. Όσο βαθύτερα προχωράει στην γνώση του εαυτού του, τόσο χαμηλότερα βλέπει τον εαυτό του και ταπεινώνεται, αλλά το χέρι του Θεού τον ανεβάζει συνέχεια. Και όταν πια γνωρίση τον εαυτό του, η ταπείνωση του γίνεται κατάσταση και την Χάρη του Θεού την πιάνει το «ενοικιοστάσιο», οπότε δεν κινδυνεύει από την υπερηφάνεια. Ενώ αυτός που δεν κάνει αυτήν την εργασία, καλύπτει συνέχεια τα σκουπίδια του, μεγαλώνει την κορυφή του, κάθεται για λίγο ψηλά με την υπερηφάνεια του και τελικά σωριάζεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να γνωρίσουμε την αρρώστια μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνά βλέπω τα ελαττώματα των άλλων και τους κρίνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Την αρρώστια την δική σου την ξέρεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γι᾿ αυτό ξέρεις την αρρώστια των άλλων. Αν ήξερες την δική σου αρρώστια, δεν θα ήξερες την αρρώστια των άλλων. Δεν λέω να μη συμμετέχης στον πόνο τους, αλλά να μην ασχολήσαι με τα σφάλματά τους. Αν ο άνθρωπος δεν ασχολήται με τον εαυτό του, ο πειρασμός θα του ανοίξη δουλειά να ασχολήται με τους άλλους. Αν όμως κάνη δουλειά στον εαυτό του, τότε γνωρίζει τον εαυτό του, γνωρίζει και τον άλλον. Διαφορετικά, με τα λανθασμένα συμπεράσματα που βγάζει από τον εαυτό του κρίνει λανθασμένα και τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει περισσότερο να διορθωθή κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κατ᾿ αρχάς η θέληση. Η θέληση είναι κατά κάποιον τρόπο το καλό ξεκίνημα. Ύστερα, πρέπει να καταλάβη κανείς ότι είναι άρρωστος και να αρχίση η ανάλογη αντιβίωση. Γιατί, αν είναι άρρωστος και κρύβη την αρρώστια του, κάποτε θα σωριασθή κάτω απότομα, χωρίς να το καταλάβη, και δεν θα μπορή να βοηθηθή ιατρικά. Π.χ. κάποιος ξέρει ότι είναι προφυματικός, γι᾿ αυτό έχει ανορεξία. Του λένε: «γιατί δεν τρώς;». «Έ, λέει, δεν μ᾿ αρέσει αυτό το φαγητό»! Μετά έχει κομμάρες και δεν μπορεί να περπατήση καλά. «Γιατί περπατάς έτσι;», τον ρωτάνε. «Ά, μ᾿ αρέσει, λέει, να πηγαίνω σιγά-σιγά· τί; να τρέχω σαν παλαβός;». Δεν λέει ότι έχει κομμάρες και δεν μπορεί να περπατήση. Μετά έχει βήχα. «Γιατί βήχεις;», του λένε. «Έ, από αλλεργία», λέει! Δεν λέει ότι οι πνεύμονες μέσα είναι χάλια. Εν τω μεταξύ, βγάζει και κανένα πτύελο αιματηρό. «Τί είναι αυτό;», τον ρωτάνε. «Έ, λέει, ερεθίστηκε ο λάρυγγας»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όλα αυτά, Γέροντα, επειδή δεν θέλει να φανερώση την φυματίωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, επειδή την καλύπτει. Την καλύπτει-τήν καλύπτει και μετά παθαίνει καλπάζουσα φυματίωση. Σπάζει ο πνεύμονας, γεμίζουν οι λεκάνες αίμα, πέφτει κάτω, και τελικά αποκαλύπτεται η αρρώστια του, αλλά και δύσκολα βοηθιέται. Ενώ, αν παραδεχθή ότι τα δέκατα που παρουσιάζει είναι από την φυματίωση και δεχθή την ανάλογη θεραπεία, γίνεται πιο υγιής από τον υγιή. Θέλω να πώ, και στην πνευματική ζωή, όποιος δικαιολογεί τα πάθη του, δέχεται τελικά δαιμονική επίδραση και δεν μπορεί να κρυφτή. Ξέρεις τί είναι να δεχθή ο άνθρωπος δαιμονική επίδραση; Αγριεύει, γίνεται θηρίο, αντιδρά, μιλά άσχημα, με αναίδεια και δεν δέχεται από κανέναν βοήθεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό όλη η βάση είναι να γνωρίση πρώτα κανείς την πάθηση που έχει και να χαίρεται που την γνώρισε. Από ᾿κεί και πέρα πρέπει να δεχθή την θεραπεία, τα ανάλογα φάρμακα, και να αισθάνεται και ευγνωμοσύνη προς τον γιατρό – τον Πνευματικό ή τον Γέροντά του –, όχι να αντιδράη. Νά, ο άλλος κρεμά το χέρι του, για να του κάνουν μετάγγιση· τον τρυπούν, πονάει, αλλά το δέχεται, γιατί αυτό θα τον βοηθήση. Ή μια εγχείρηση πόση ταλαιπωρία έχει! Αλλά δέχεται ο άνθρωπος να την κάνη, για να γίνη καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, ξέρω λ.χ. ότι μια αυστηρή παρατήρηση θα με βοηθήση, γιατί δεν την δέχομαι ευχάριστα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, μπορεί να μην την δέχεσαι ευχάριστα, αλλά τουλάχιστον καταλαβαίνεις ότι αυτό δεν είναι σωστό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, το καταλαβαίνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, αν το καταλαβαίνης, κάτι είναι κι αυτό. Βλέπεις, ο άρρωστος παίρνει ένα χάπι που είναι φαρμάκι πικρό, αλλά το δέχεται καλύτερα από την καραμέλα, γιατί καταλαβαίνει ότι θα τον ωφελήση. Αν δεν δέχεται το πικρό φάρμακο, δεν θεραπεύεται. Πρέπει να γνωρίση κανείς την αδυναμία του, να δεχθή τα φάρμακα, για να τον δυναμώση μετά ο Χριστός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 4 – Η συναίσθηση της αμαρτωλότητος συγκινεί τον Θεό
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αναγνώριση του σφάλματός μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, ο Αββάς Ισαάκ λέει ότι πρέπει να αισθάνεσαι στην προσευχή σαν παιδί[65].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά να νιώθης ότι είσαι ένα άτακτο παιδί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να αναγνωρίζης ότι στενοχώρησες τον Πατέρα σου και να κλαίς γι᾿ αυτό. Τότε θα νιώθης τα χάδια τα θεϊκά. Όχι να λές: «Επειδή είμαι παιδί, ο Θεός πρέπει να μ᾿ αγαπάη και να με συγχωρή, ας κάνω αταξίες».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ανησύχησα, όταν διάβασα στον Άγιο Γρηγόριο Νύσσης ότι, για να επικαλεσθούμε «Πατέρα» τον Θεό, πρέπει να έχουμε φθάσει στην απάθεια[66], αλλιώς είναι «ύβρις και λοιδορία»[67].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ευλογημένη, μη στενοχωριέσαι. Αυτό το έγραψε ο Άγιος για όσους ζουν ρέμπελα και αμαρτωλά. Όταν όμως αμαρτάνη κανείς, αλλά συναισθάνεται βαθιά την ενοχή του, τότε μπορεί να ονομάζη «Πατέρα» τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αισθάνομαι ότι δεν είμαι εντάξει απέναντι στον Θεό, και αυτό με πονάει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από την στιγμή που αισθάνεσαι ότι δεν είσαι εντάξει και λές ταπεινά «ήμαρτον, Θεέ μου», ο Θεός συγχωρεί, βοηθάει και χαριτώνει, και αν σε βρη στην κατάσταση αυτήν ο θάνατος, θα σωθής. Γιατί δεν λές απλώς πώς δεν είσαι εντάξει και μένεις σε έναν στραβό δρόμο, αλλά αγωνίζεσαι. Δεν είσαι, Θεός φυλάξοι, σε δαιμονική κατάσταση. Λίγο-πολύ, εδώ στο μοναστήρι, όλες οι αδελφές, με την βοήθεια του Θεού, είστε εν μετανοία. Ύστερα, να ξέρης, ο πνευματικός άνθρωπος, όταν αισθάνεται ότι είναι χάλια, δέχεται την θεία Χάρη, γιατί είναι ένα ξέπλυμα αυτή η συναίσθηση που έχει για την αμαρτωλότητά του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εγώ, όταν κάποιος με πόνο μου λέει: «είμαι τέτοιος, τέτοιος», τον χαίρομαι, γιατί, αφού αναγνωρίζει τα σφάλματά του, θα ελευθερωθή από αυτά. Βρήκα κάποτε έναν άνθρωπο που έμενε σε ένα καλύβι με τα γατιά, με τα σκυλιά. Ούτε φωτιά άναβε, γιατί φοβόταν μην κάψη το καλύβι. Ήταν τελείως εγκαταλελειμμένος! Τον πόνεσα, τον λυπήθηκα, αλλά εκείνος μου είπε: «Μη με λυπάσαι, μωρέ καλόγερε· εγώ πρέπει να βασανισθώ. Αν ήξερες τί έχω κάνει, δεν θα με λυπόσουν. Για μένα, κι εδώ που είμαι, πολύ είναι». Έ, αυτόν, ό,τι κι αν έχη κάνει, δεν θα τον οικονομήση ο Θεός; Και τώρα[68]που ήμουν στο νοσοκομείο, ήρθε μια γυναίκα, που τα χέρια της ήταν τρυπημένα από τις μεταγγίσεις! Ήταν τελείως χάλια! Δεν είχε  η φουκαριάρα φλέβα για φλέβα! «Δεν έχω κανένα καλό, μου λέει. Μήπως με λυπηθή από αυτά ο Θεός και με πάρη στον Παράδεισο! Έχω εκείνο, εκείνο το ελάττωμα...». Και έλεγε-έλεγε ένα σωρό κουσούρια. Τί λεπτή εργασία έκανε στον εαυτό της! Εγώ σε τέτοια κατάσταση άλλον άνθρωπο δεν είδα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, άκουσα κάποιον να λέη: «Έχω τον λογισμό ότι ο Χριστός θα φερθή με επιείκεια». Είναι σωστός αυτός ο λογισμός;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο άνθρωπος έχη μεγάλη ταπείνωση, αναγνωρίζη το σφάλμα του, αισθάνεται την ενοχή του σε μεγάλο βαθμό και υποφέρη, τότε ο Χριστός θα φερθή με επιείκεια και θα τον συγχωρήση. «Παιδί μου, θα του πή, μην το σκέφτεσαι πιά· πάει, έληξε». Αν όμως δεν συναισθάνεται την ενοχή του και αναπαύη τον λογισμό του ότι ο Χριστός θα φερθή με επιείκεια και ευσπλαχνία, αυτό είναι πολύ επικίνδυνο. Δηλαδή ο Χριστός θα βραβεύση τους αμαρτωλούς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η καλή αναγνώριση του εαυτού μας συγκινεί τον Θεό και μας δίνει βοήθεια θεϊκή και χαρά παραδεισένια. Αν μας βοηθούσε και η μη αναγνώριση, ο Θεός ούτε και αυτήν θα μας την ζητούσε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είπατε «η καλή αναγνώριση» του εαυτού μας· υπάρχει και κακή αναγνώριση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, μπορεί να έχη κανείς λανθασμένη γνώση  του εαυτού του, να τον δικαιολογή και να αναπαύη τον λογισμό του. Γι᾿ αυτό, όταν λέω ότι υπάρχει αναγνώριση του σφάλματος, εννοώ ότι υπάρχει έστω και μια μικρή προσπάθεια για διόρθωση. Σού χρωστάω π.χ. πεντακόσιες χιλιάδες δραχμές καί, όταν σε βλέπω, λέω: «σού χρωστάω και πεντακόσιες χιλιάδες», αλλά δεν με απασχολεί να επιστρέψω το χρέος· απλώς αναγνωρίζω ότι έχω ένα χρέος. Μετά από λίγο πάλι το σκέφτομαι και σού λέω: «ναί, ναί, έχω και ένα χρέος». Αυτό δεν θα πη αναγνώριση. Όταν αναγνωρίζη κανείς πραγματικά ότι έχει ένα χρέος, δεν κοιμάται· ψάχνει να βρη πώς να το εξοφλήση. Και τότε, όταν λέη «έχω ένα χρέος», πληροφορείται και ο άλλος, από τον τρόπο που το λέει, ότι πράγματι τον απασχολεί το θέμα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Συναίσθηση της αμαρτωλότητος και πρόοδος στον αγώνα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, όταν κανείς δεν πηγαίνη καλά στον αγώνα του, είναι σωστό να λέη: «Τέτοιος είσαι και θα είσαι. Τίποτε καλύτερο δεν περιμένω από σένα»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν αντιμετωπίζη έτσι την κατάστασή του, μπορεί να πλανηθή· να φθάση να πή: «Όσοι είναι να πάνε στον Παράδεισο, θα πάνε. Επομένως, γιατί να αγωνισθώ;». Δηλαδή οι Άγιοι αγίασαν χωρίς αγώνα; Αυτός, ενώ δεν αγωνίζεται, περιμένει να διορθωθή, να ελευθερωθή από τα πάθη του. Κάνει σαν εκείνον τον γέρο που ήθελε να φάη μούρα και καθόταν κάτω από την μουριά με ανοιχτό το στόμα και περίμενε να πέση κανένα μούρο στο στόμα του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα καταλάβω αν έχω πνευματική πρόοδο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν έχης συναίσθηση της αμαρτωλότητός σου, θα έχης και πνευματική πρόοδο. Όσο μεγαλύτερες βλέπεις τις αμαρτίες σου, τόσο μεγαλύτερη συναίσθηση θα αποκτάς και τόσο θα προοδεύης.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κάποιος να αναγνωρίζη το σφάλμα του και να μην προοδεύη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο άνθρωπος αναγνωρίζη το σφάλμα του και πέφτη ξανά, χωρίς να θέλη, σημαίνει ότι υπάρχει υπερηφάνεια ή προδιάθεση για υπερηφάνεια, και γι᾿ αυτό δεν τον βοηθάει ο Θεός να προκόψη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το να συναισθανθή κανείς την αμαρτωλότητά του, είναι μεγάλη δύναμη, μεγάλη υπόθεση. Μετά σιχαίνεται τον εαυτό του, ταπεινώνεται, αποδίδει όλα τα καλά στην φιλανθρωπία και στην αγαθότητα του Θεού και αισθάνεται μεγάλη ευγνωμοσύνη. Γι᾿ αυτό ο Θεός αγαπάει περισσότερο τους αμαρτωλούς που αναγνωρίζουν την αμαρτωλότητά τους, μετανοούν και ζουν με ταπείνωση, παρά εκείνους που αγωνίζονται πολύ, αλλά δεν αναγνωρίζουν την αμαρτωλότητά τους και δεν έχουν μετάνοια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να ζητάμε ταπεινά το έλεος του Θεού για την διόρθωσή μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν οι Πατέρες λένε ότι μετάνοια είναι να αποφασίση κανείς να μην ξανακάνη τα προηγούμενα αμαρτήματα και να λυπάται γι᾿ αυτά, σημαίνει ότι διαρκώς πρέπει να τα θυμάται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν θυμάται κάθε αμαρτία χωριστά, αλλά έχει συνέχεια την συναίσθηση της αμαρτωλότητός του. Μέχρις ενός σημείου πρέπει να σκέφτεται κανείς ένα σφάλμα του και ύστερα να ζητά ταπεινά το έλεος του Θεού καί, αν δεν υπάρχη υπερηφάνεια, ο Θεός θα βοηθήση. Ιδίως όταν κάποιος είναι ευαίσθητος, καλύτερα είναι να ξεχνά παλιές αμαρτίες του, αφού έχουν τακτοποιηθή με την μετάνοια και την εξομολόγηση. Μπορεί το ταγκαλάκι να του θυμίζη παλιές του αμαρτίες και να τον ζαλίζη με λογισμούς, για να του τρώη την ώρα και να τον περισπά από την προσευχή. Ένας όμως που δεν είναι ευαίσθητος και βλέπει να γεννιέται μέσα του υπερηφάνεια, τότε καλά είναι να φέρνη στον νού του τις αμαρτίες του, για να ταπεινώνεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί κάποιος να έχη συναίσθηση της αμαρτωλότητός του και να μην έχη μετάνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αν δεν έχη ταπείνωση. Όταν στην μετάνοια ανακατεύεται ο εγωισμός, συνέχεια ο άνθρωπος σκέφτεται: «πώς το έκανα αυτό, πώς το είδαν οι άλλοι, τί ιδέα θα σχηματίσουν;», και βασανίζεται. Το «πώς το έκανα πάλι» και το «πώς κατήντησα» έχει εγωισμό· δεν έχει μετάνοια. Πρέπει να καταλάβη ότι έσφαλε και να ζητήση ταπεινά το έλεος του Θεού. «Θεέ μου, να πή, έσφαλα, συγχώρεσέ με. Τέτοιος παλιάνθρωπος είμαι. Λυπήσου με. Αν δεν με βοηθήσης, χειρότερος μπορώ να γίνω, καλύτερος δεν μπορώ να γίνω. Μόνος μου δεν πρόκειται να διορθωθώ», και να προσπαθήση να μην το ξανακάνη. Πολλοί άνθρωποι που έσφαλαν και πόνεσαν, γιατί πλήγωσαν τον Θεό και όχι γιατί ξέπεσαν στα μάτια των ανθρώπων, αγίασαν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν κάποιος ζη κοσμικά και κόβη μετά τις σχέσεις του με το κοσμικό πνεύμα, έλκεται πολλές φορές από αυτό, χωρίς να το θέλη. Δεν πρέπει όμως να απογοητεύεται. Νομίζω, σ᾿ αυτήν την περίπτωση, πρόοδος είναι και το ότι αρχίζει η καλή ανησυχία, που ελέγχει την ψυχή για τα σφάλματα που έκανε και για ό,τι έπρεπε να κάνη, αλλά δεν έκανε. Σιγά-σιγά γίνεται μια πάλη, ταπεινώνεται ακουσίως ο άνθρωπος και απελπίζεται με την καλή απελπισία, δηλαδή απελπίζεται από το εγώ του. Τότε όλα τα αποδίδει στην Χάρη του Θεού και πιστεύει αληθινά εκείνο που είπε ο Κύριος: «Χωρίς εμού ου δύνασθε ποιείν ουδέν»[69]. Αν στην συνέχεια αγωνισθή φιλότιμα, με πολλή ταπείνωση, ελπίζοντας στην παντοδυναμία του Θεού, ο Καλός Θεός θα τον ελεήση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η λύπη για τα σφάλματά μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα βοηθηθή κανείς να μην ξανακάνη το ίδιο σφάλμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– ῍ Αν πονέση πραγματικά για το σφάλμα του, δεν θα το ξανακάνη. Πρέπει να υπάρχη εσωτερική συντριβή με ειλικρινή μετάνοια, για να διορθωθή. Γι᾿ αυτό λέει ο Αββάς Μάρκος ο Ασκητής: «Αν ο άνθρωπος δεν στενοχωρηθή κατ᾿ αναλογίαν του σφάλματός του, εύκολα περιπίπτει εις το αυτό σφάλμα»[70]. Δηλαδή, αν είναι μικρό το σφάλμα, χρειάζεται μικρότερη μετάνοια, αν είναι μεγαλύτερο, μεγαλύτερη μετάνοια. Όταν κανείς δεν πιάνη το μέγεθος της πτώσεώς του και δεν λυπάται «κατ᾿ αναλογίαν του σφάλματος», τότε εύκολα πέφτει στο ίδιο ή και σε μεγαλύτερο σφάλμα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα καταλάβουμε ότι δεν λυπηθήκαμε «κατ᾿ αναλογίαν του σφάλματος»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Απόδειξη αν πέφτετε πάλι στο ίδιο σφάλμα. Ύστερα, όταν παρακολουθήτε τον εαυτό σας, να μην κάνετε μόνο διάγνωση. Εσείς συνέχεια κάνετε μικροβιολογικές εξετάσεις, βρίσκετε το μικρόβιο, το κοιτάτε και λέτε: «πρέπει να το σκοτώσω», αλλά δεν αρχίζετε θεραπεία. Εντάξει, διαπιστώσατε ότι έχετε μια πάθηση. Τάκ, να κοιτάξετε πώς θα την θεραπεύσετε. Τί ωφελεί να κάνετε συνέχεια αναλύσεις–αναλύσεις, χωρίς να προσπαθήτε να διορθωθήτε; Λέτε: «έχω εκείνο το πάθος, έχω το άλλο», αλλά δεν τα κόβετε και παραμένετε στα ίδια μοιρολογώντας. Έτσι σπαταλάτε τις δυνάμεις σας και χαραμίζεστε. Χαραμίζετε το μυαλό σας, την καρδιά σας. Αρρωσταίνετε από την στενοχώρια και ύστερα δεν κάνετε τίποτε. Έπειτα, όταν γίνετε καλά, αρχίζετε: «Και γιατί τότε αρρώστησα και πώς αρρώστησα;». Δεν λέω, θα παρακολουθήτε τον εαυτό σας, δεν θα αφήνετε τα σφάλματά σας να περνάνε απαρατήρητα, αλλά μέχρις ενός σημείου, βρέ παιδάκι μου, και η στενοχώρια! Όχι αδιαφορία, αλλά όχι και κακομοιριά! Έκανες κάτι που δεν ήταν σωστό; Το σκέφτηκες; Το είδες; Το αναγνώρισες; Το εξομολογήθηκες; Προχώρα· μη σκαλώνης. Κράτησέ το μόνο στον νού σου, για να προσέξης άλλη φορά, αν σού δοθή παρόμοια αφορμή. Η στενοχώρια για τα σφάλματά μας είναι άσκοπη, όταν δεν προσπαθούμε να τα διορθώσουμε. Είναι σαν να κλαίμε έναν άρρωστο συνέχεια, χωρίς να του προσφέρουμε βοήθεια για να αναρρώση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, δίκαια ταλαιπωρήσαι για ένα σφάλμα σου, και τότε δεν πρέπει να λυπάσαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, πρέπει να λυπάσαι, αλλά η λύπη να είναι ανάλογη, σύμμετρη με το σφάλμα σου. Αν δεν πονέσης, θα είσαι «τραλαλά» και θα ξαναπέσης στο ίδιο λάθος· δεν θα διορθωθής. Όταν όμως από την λύπη της μετανοίας περνάς στην απόγνωση, τότε σημαίνει ότι έχεις λυπηθή περισσότερο από όσο έπρεπε. Σ᾿ αυτές τις περιπτώσεις χρειάζεται να δώσης στον εαυτό σου λίγο κουράγιο και να αντιμετωπίσης το σφάλμα με λίγη καλή αδιαφορία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αυτομεμψία όχι απελπισία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι εύκολο εξαρχής να συναισθανθούμε σε βάθος την αμαρτωλότητά μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Θεός από αγάπη δεν επιτρέπει στην αρχή της πνευματικής μας ζωής να συναισθανθούμε την αμαρτωλότητά μας, για να μην καμφθούμε. Υπάρχουν φιλότιμες και ευαίσθητες ψυχές που δεν θα το άντεχαν και θα πάθαιναν ζημιά. Θαμπώνει τα μάτια μας και δεν βλέπουμε όλα μαζί τα σφάλματά μας. Μπορεί π.χ. να έχουμε κουτσουλιές στο μανίκι μας, και εμείς να νομίζουμε ότι είναι λουλούδια. Προχωρώντας στον αγώνα μας, λίγο-λίγο, επιτρέπει ο Θεός να αρχίσουμε να βλέπουμε τα σφάλματά μας και μας δίνει και δύναμη να αγωνισθούμε, για να τα διορθώσουμε. Η λεπτή εργασία βλάπτει, όταν δεν υπάρχη πείρα. Το ίδιο συμβαίνει και με την συναίσθηση των ευεργεσιών του Θεού. Αν έβλεπε ο άνθρωπος τις ευεργεσίες του Θεού στην αρχή της πνευματικής του ζωής, θα πάθαινε πνευματική αιμορραγία. Γιατί, όταν κανείς βλέπη τις ευεργεσίες του Θεού και συναισθάνεται την αχαριστία του, μετά λειώνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν βλέπω τα σφάλματά μου και η καρδιά μου είναι πέτρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μερικές φορές επιτρέπει ο Θεός να μη βλέπουμε τα σφάλματά μας και να είναι η καρδιά μας πέτρα, γιατί μπορεί ο διάβολος να μας ρίξη στην απελπισία. Ο άνθρωπος πρέπει να σκέφτεται την αμαρτωλότητά του με διάκριση. Η μετάνοια που έχει μέσα της άγχος και απελπισία δεν είναι από τον Θεό· έχει βάλει και το ταγκαλάκι την ουρίτσα του. Πρέπει να προσέξη κανείς, γιατί μπορεί ο διάβολος να τον πιάση από τα δεξιά, από την μετάνοια, και να τον πετάξη στα αριστερά, στην θλίψη και στην απογοήτευση, ώστε να τον τσακίση ψυχικά και σωματικά και να τον αχρηστέψη. Φέρνει δηλαδή την άλλη συντριβή, που έχει άγχος, για να τον κάνη συντρίμμια. Μπορεί λ.χ. να του πή: «Είσαι πολύ αμαρτωλός, δεν θα σωθής». Δήθεν ενδιαφέρεται για την ψυχή του, και του δημιουργεί άγχος και απελπισία! Μά δεν θα αφήσω τον διάβολο να κάνη ό,τι θέλει. Όταν ο διάβολος σού λέη: «είσαι αμαρτωλή», να του λές: «Τί σε ενδιαφέρει εσένα; Όταν θέλω εγώ, θα πω ότι είμαι αμαρτωλή, όχι όταν θέλης εσύ».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, που οφείλεται η μελαγχολία που έρχεται πολλές φορές στην ψυχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η μελαγχολία και το πλάκωμα της ψυχής οφείλονται συνήθως σε τύψεις από ευαισθησία, και τότε ο άνθρωπος χρειάζεται να εξομολογηθή, για να μπορέση να βοηθηθή από τον πνευματικό. Γιατί, αν είναι ευαίσθητος, μπορεί το σφάλμα που έκανε να είναι πολύ μικρό, αλλά ο εχθρός διάβολος να το μεγαλοποιή· να του το δείχνη με μικροσκόπιο, για να τον ρίξη στην απελπισία και να τον αχρηστέψη. Μπορεί να του πη λ.χ. ότι τάχα στενοχώρησε πολύ τους άλλους, ότι τους δυσκόλεψε κ.λπ., και να τον κάνη να στενοχωριέται πιο πολύ από όσο αντέχει. Αφού ενδιαφέρεται ο διάβολος, γιατί δεν πηγαίνει να πειράξη την συνείδηση ενός αναίσθητου ανθρώπου; Αλλά τον αναίσθητο τον κάνει να θεωρή μηδαμινό ένα μεγάλο σφάλμα του, για να μην έρθη σε συναίσθηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει ο άνθρωπος να γνωρίση τον εαυτό του όπως είναι, και όχι όπως τον παρουσιάζει ο εχθρός διάβολος, διότι αυτός ενδιαφέρεται για το κακό μας. Ποτέ να μην απελπίζεται, αρκεί να μετανοή, γιατί και οι αμαρτίες του είναι λιγώτερες από του διαβόλου και ελαφρυντικά έχει, επειδή πλάσθηκε από χώμα και από απροσεξία γλίστρησε και λασπώθηκε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Για να γίνη σωστός αγώνας, πρέπει να γυρίζουμε την ρόδα αντίθετα από εκεί που την γυρίζει ο διάβολος. Αν μας λέη ότι είμαστε κάτι, να καλλιεργούμε την αυτομεμψία. Αν μας λέη ότι δεν είμαστε τίποτε, να λέμε: «Ο Θεός θα με ελεήση». Έτσι απλά αν κινήται ο άνθρωπος, με εμπιστοσύνη και ελπίδα στον Θεό, μπαίνει στην ζωή του η μετάνοια, η ταπείνωση, και ανεβαίνει σε πνευματικά ύψη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, η αυτομεμψία δεν βοηθάει στον πνευματικό αγώνα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Βοηθάει, αλλά θέλει διάκριση. Μπορεί π.χ. να λέη κανείς στον εαυτό του: «Είσαι ανόητος...». Να το λέη όμως με ταπείνωση, για να κοροϊδέψη τον διάβολο, αλλά και με λεβεντιά, όχι με κακομοιριά. Αυτομεμψία, όχι απελπισία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σημείο πνευματικής ωριμότητος είναι να πιστέψω ότι δεν κάνω τίποτε, να απογοητευθώ με την καλή έννοια από τον εαυτό μου, από το εγώ μου· να νιώθω πώς με ό,τι κάνω προσθέτω συνέχεια μηδενικά και να συνεχίζω τον αγώνα μου ελπίζοντας στον Θεό. Τότε ο Καλός Θεός, όταν δη τα μηδενικά της αγαθής μου προαιρέσεως, θα με λυπηθή, θα προσθέση στην αρχή την μονάδα και θα πάρουν αξία τα μηδενικά μου και θα πλουτίσω πνευματικά. Μέσα στην ταπεινή κατάσταση της απογοητεύσεως από τον εαυτό μου κρύβεται η καλή πνευματική κατάσταση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πνευματική εργασία με φακό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί κανείς να βλέπη τον εαυτό του πάντοτε αμαρτωλό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν τον εξετάζη προσεκτικά. Όσο πιο προσεκτικά τον εξετάζη, τόσο πιο αμαρτωλό τον βλέπει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάποιος που έχει πολλές φροντίδες, πώς θα βοηθηθή να κάνη αυτήν την εργασία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά είναι μέσα στην ημέρα να λέη λίγο την ευχή και να έχη και κάποια ώρα περισυλλογής. Βλέπετε, ο μπακάλης κάθε βράδυ μετράει τα χρήματά του. Αν δεν παρακολουθούσε τί κερδίζει και τί χρωστάει, θα χρεωκοπούσε και θα έμπαινε στην φυλακή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί άνθρωποι δεν ξέρουν τί να πούν στην εξομολόγηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό δείχνει ότι δεν κάνουν λεπτή εργασία στον εαυτό τους. Αν δεν κάνουμε λεπτή εργασία στον εαυτό μας, τότε και τα χοντρά μας ξεφεύγουν. Πρέπει να καθαρίσουμε τα μάτια της ψυχής μας. Ένας τυφλός δεν βλέπει τίποτε. Ένας που έχει ένα μάτι, έ, αυτός βλέπει· αλλά πιο καλά βλέπει αυτός που έχει και τα δυο μάτια γερά. Και αν έχη και τηλεσκόπιο και μικροσκόπιο, θα βλέπη και τα μακρινά και τα κοντινά πολύ καθαρά. Ένα ξυλόγλυπτο εικονάκι λ.χ. μπορώ να το τελειώσω σε τρεις ώρες. Αν όμως το αφήσω λίγες μέρες και το ξαναδώ, βρίσκω αρκετές ελλείψεις. Το ίδιο μπορεί να το δουλέψω και μια εβδομάδα και έναν μήνα και δύο χρόνια. Το ίδιο μπορώ να το δουλεύω και πέντε χρόνια, αν θέλω. Αλλά μετά πρέπει να δουλεύω με φακό. Θέλω να πω ότι και η πνευματική εργασία δεν έχει τελειωμό. Όσο προχωράει κανείς πνευματικά, καθαρίζουν τα μάτια της ψυχής του πιο πολύ–πιό πολύ, και βλέπει τα σφάλματά του όλο και μεγαλύτερα, και έτσι ταπεινώνεται και έρχεται η Χάρις του Θεού. Οι Άγιοι που έλεγαν: «είμαι αμαρτωλός, ελεεινός», το πίστευαν, γιατί τα μάτια της ψυχής τους είχαν γίνει μικροσκόπια. Όσο προχωρούσαν, αποκτούσαν ισχυρότερο μικροσκόπιο και έβλεπαν ότι είναι πιο αμαρτωλοί. Νά, τώρα βλέπω με γυμνό μάτι το χέρι μου και μου φαίνεται όμορφο. Αν όμως το δώ με φακό, θα δώ αυτές τις τρίχες, που καλά–καλά τώρα δεν τις βλέπω, σαν κυπαρισσάκια! «Βρέ παιδάκι μου, τί είμαι; αγριάνθρωπος;», θα πώ. Αν δουλεύετε έτσι πνευματικά, θα σιχαθήτε τον παλαιό εαυτό σας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο παλαιός μας άνθρωπος είναι ένας κακός ενοικιαστής μέσα μας καί, για να φύγη, πρέπει να γκρεμίσουμε το σπίτι και να αρχίσουμε να χτίζουμε την νέα οικοδομή, τον καινό άνθρωπο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 5 – Η μετάνοια έχει μεγάλη δύναμη
- type: h2
  initial:
    ru: ''
  text:
    ru: «Εις εαυτόν ελθών...»[71]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός είναι πολύ κοντά μας, αλλά και πολύ ψηλά. Για να «κάμψη» κανείς τον Θεό, ώστε να κατεβή να μείνη μαζί του, πρέπει να ταπεινωθή και να μετανοήση. Τότε ο πολυεύσπλαχνος Θεός, βλέποντας την ταπείνωσή του, τον υψώνει ώς τους Ουρανούς και τον αγαπάει πολύ. «Χαρά έσται εν τω ουρανώ επί ενί αμαρτωλώ μετανοούντι»[72], λέει το Ευαγγέλιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός έδωσε στον άνθρωπο τον νού, για να αναλογίζεται το σφάλμα του, να μετανοή και να ζητάη συγχώρηση. Ο αμετανόητος άνθρωπος είναι σκληρό πράγμα. Είναι πολύ ανόητος, επειδή δεν θέλει να μετανοήση, για να απαλλαγή από την μικρή κόλαση που ζή, η οποία τον οδηγεί στην χειρότερη, την αιώνια. Έτσι στερείται και τις επίγειες παραδεισένιες χαρές, οι οποίες συνεχίζουν στον Παράδεισο, κοντά στον Θεό, με τις πολύ μεγαλύτερες χαρές, τις αιώνιες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όσο ο άνθρωπος βρίσκεται μακριά από τον Θεό, είναι εκτός εαυτού. Βλέπεις, στο Ευαγγέλιο γράφει ότι ο άσωτος υιός «εις εαυτόν ελθών είπε· πορεύσομαι προς τον πατέρα μου». Δηλαδή, όταν συνήλθε, όταν μετάνοιωσε, τότε είπε: «Θα επιστρέψω στον πατέρα μου». Όσο ζούσε στην αμαρτία, ήταν εκτός εαυτού, δεν ήταν στα λογικά του, γιατί η αμαρτία είναι έξω από την λογική.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Αλώνιος λέει: «Εάν θέλη ο άνθρωπος, από πρωΐ έως εσπέρας γίνεται εις μέτρον θείον»[73]. Τί εννοεί;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η πνευματική ζωή δεν θέλει χρόνια. Σε ένα δευτερόλεπτο μπορεί να βρεθή κανείς από την κόλαση στον Παράδεισο, αν μετανοήση. Ο άνθρωπος είναι τρεπτός. Μπορεί να γίνη άγγελος, μπορεί να γίνη διάβολος. Πά πά πά, τί δύναμη έχει η μετάνοια! Απορροφά την θεία Χάρη.Έναν λογισμό ταπεινό να φέρη στον νού του ο άνθρωπος, σώθηκε. Έναν λογισμό υπερήφανο να φέρη, αν δεν μετανοήση και τον βρη ο θάνατος, πάει, χάθηκε. Βέβαια, ο ταπεινός λογισμός πρέπει να συνοδεύεται και από τον εσωτερικό αναστεναγμό, την εσωτερική συντριβή. Γιατί ο λογισμός είναι λογισμός, αλλά υπάρχει και η καρδιά. «Όλη ψυχή και διανοία και καρδία»[74], λέει ο υμνωδός. Νομίζω όμως ότι ο Αββάς εδώ εννοεί μια πιο μόνιμη κατάσταση. Χρειάζεται ένα διάστημα, για να φθάση κανείς σε καλή κατάσταση. Σφάλλω, μετανοώ, συγχωρούμαι αυτήν την στιγμή. Αν έχω αγωνιστικό πνεύμα, μπορώ σιγά-σιγά να σταθεροποιήσω μια κατάσταση, αλλά μέχρι τότε ταλαντεύομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένας άνθρωπος ηλικιωμένος μπορεί να βοηθήση πνευματικά τον εαυτό του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ίσα-ίσα, όταν κανείς γεράση, του δίνεται η δυνατότητα να μετανοήση, γιατί φεύγουν οι ψευδαισθήσεις. Πρώτα, επειδή είχε σωματικές δυνάμεις και δεν δυσκολευόταν, δεν καταλάβαινε τις αδυναμίες του και νόμιζε ότι βρισκόταν σε καλή κατάσταση. Τώρα που έχει δυσκολίες και γκρινιάζει, βοηθιέται να καταλάβη ότι δεν είναι εντάξει, ότι χωλαίνει, και να μετανοήση. Αν αξιοποιήση πνευματικά τα λιγώτερα χρόνια της ζωής του που του έμειναν και χρησιμοποιήση και την πείρα που του άφησαν τα περισσότερα χρόνια της ζωής του που πέρασαν, δεν θα τον αφήση ο Χριστός, θα τον ελεήση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα δάκρυα της μετανοίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η μετάνοια είναι το βάπτισμα των δακρύων. Με την μετάνοια ο άνθρωπος ξαναβαπτίζεται, αναγεννιέται. Ο Απόστολος Πέτρος με την άρνησή του πρόδωσε κατά κάποιον τρόπο τον Χριστό, αλλά, επειδή «έκλαυσε πικρώς»[75], έλαβε την άφεση για την πτώση του. Δηλαδή η ειλικρινής μετάνοια που είχε, τον ξέπλυνε, τον καθάρισε πάλι. Βλέπεις, ο Θεός πρώτα έκανε την γή, την θάλασσα, όλη την δημιουργία, και ύστερα πήρε χώμα και έπλασε τον άνθρωπο. Ο άνθρωπος πρώτα γεννιέται σαρκικά και μετά, στο Βάπτισμα, αναγεννιέται πνευματικά από το δημιούργημα του Θεού, το νερό, και από το Άγιο Πνεύμα, την θεία Χάρη, – «εξ ύδατος και Πνεύματος»[76]– και γίνεται νέος άνθρωπος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, ο Θεός, όπως τότε πήρε το χώμα και έπλασε τον άνθρωπο, έτσι τώρα στο Βάπτισμα χρησιμοποιεί το νερό, για να τον αναπλάση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, το νερό έχει το νόημα του καθαρίσματος, γι᾿ αυτό ο ιερεύς κατά το Βάπτισμα βουτάει τον άνθρωπο στο νερό. Ξεπλένεται ο άνθρωπος από το προπατορικό αμάρτημα, καθαρίζεται από τις αμαρτίες, τον επισκιάζει η Χάρις του Θεού, ενδύεται τον Χριστό, και γίνεται νέος, αναγεννημένος, άνθρωπος. Αυτό είναι το έργο του Βαπτίσματος. Το είπε ξεκάθαρα ο Χριστός στον Νικόδημο, όταν τον ρώτησε πώς μπορεί ο άνθρωπος να ξαναγεννηθή: «Αμήν αμήν λέγω σοι, εάν μη τις γεννηθή εξ ύδατος και Πνεύματος, ου δύναται εισελθείν εις την βασιλείαν του Θεού»[77]. Με το Βάπτισμα γίνεται το νέο τέλειο δημιούργημα του Θεού μετά την πτώση. Γι᾿ αυτό ο άνθρωπος, όταν δεν μολύνη το Άγιο Βάπτισμα, έχει πολλή θεία Χάρη. Αλλά, και όταν το μολύνη, υπάρχει το βάπτισμα της μετανοίας. Αν συναισθανθή το σφάλμα του και πονέση γι᾿ αυτό, ξεπλένεται κατά κάποιον τρόπο με τα δάκρυα της μετανοίας, και έρχεται[78]πάλι η Χάρις του Θεού.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εγώ χρόνια τώρα έχω να κλάψω για ένα σφάλμα μου· δεν έχω ούτε ένα δάκρυ. Αυτό σημαίνει ότι δεν έχω πραγματική μετάνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν πονάς για ένα σφάλμα που κάνεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πονάω, αλλά ίσως είναι ρηχός ο πόνος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Από τα δάκρυα μη βγάζης συμπέρασμα. Είναι βέβαια τα δάκρυα ένα χαρακτηριστικό της μετανοίας, αλλά δεν είναι το μόνο χαρακτηριστικό. Μερικοί εκεί που κλαίνε, εκεί γελάνε. Ο καρδιακός πόνος και ο εσωτερικός αναστεναγμός είναι τα εσωτερικά δάκρυα, που είναι ανώτερα από τα εξωτερικά. Ένας, ο καημένος, έλεγε: «Τί σκληρός που είμαι, πάτερ! Ούτε ένα δάκρυ! Η καρδιά μου είναι σαν πέτρα. Τί σκληροκαρδία! Άχ!». Ενώ ήταν πολύ ευαίσθητος, αισθανόταν ότι ήταν πολύ σκληρός, γιατί δεν έκλαιγε. Αναστέναζε όμως βαθιά, βογγούσε ο καημένος, και έβλεπες έναν αναστεναγμό να βγαίνη από τα βάθη της καρδιάς του! Ενώ άλλος κλαίει-γελάει και είναι σαν τον ανοιξιάτικο καιρό. Βλέπει λ.χ. κάποιον δυστυχισμένο, συγκινείται, κλαίει λίγο, κι ένα κι ένα λέει: «ά, εγώ πώς συμμετέχω στον πόνο του άλλου!». Ή, αν προσευχηθή και χύση λίγα δάκρυα, λέει: «ά, η προσευχή μου εισακούεται, γιατί γίνεται μετά δακρύων!» και αναπαύει τον λογισμό του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Υπάρχουν και τα απαρηγόρητα δάκρυα. Αυτά είναι ταγκαλίστικα. Δεν έχουν μετάνοια, αλλά θιγμένο εγωισμό. Τότε ο άνθρωπος κλαίει εγωιστικά για την πτώση του. Πληγώνεται, γιατί με τις απροσεξίες του ξέπεσε στα μάτια των άλλων, και όχι γιατί λύπησε τον Θεό, και υποφέρει διπλά. Στον ανταρτοπόλεμο ένας καπετάνιος από τους αντάρτες – ο Θεός να του χαρίζη μετάνοια – είχε πιάσει έναν φτωχό οικογενειάρχη που είχε εννιά παιδιά, τον έβαλε κάτω και τον χτυπούσε αλύπητα, επειδή δεν συμφωνούσε με την ιδεολογία του. Αυτός ο άνθρωπος μάλιστα ήταν κάποτε στην υπηρεσία του. Φώναζε ο καημένος: «Καλά, δεν με λυπάσαι, εννιά παιδιά έχω· δεν θυμάσαι που σε κουβαλούσα και στην πλάτη μου; Τί σού έκανα;». Κάποιος από τους συντρόφους του καπετάνιου, όταν τον είδε να τσαλαπατά τόσο σκληρά αυτόν τον άνθρωπο, του φώναξε: «Έ, τί σού έκανε; Δεν τον λυπάσαι; Οικογενειάρχης άνθρωπος είναι». Αμέσως εκείνος βάζει κάτι κλάματα, επειδή θίχτηκε ο εγωισμός του από την παρατήρηση του συντρόφου του!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αυτά τα κλάματα είναι εγωιστικά· είναι σαν την μεταμέλεια του Ιούδα. Παρέδωσε τον Χριστό και μετά πήγε στους Φαρισαίους να πη «ήμαρτον», αλλά εκείνοι του είπαν: «Τί μας το λές ότι αμάρτησες;». Οπότε προσεβλήθη, πείσμωσε, τους πέταξε τα αργύρια και πήγε και κρεμάσθηκε από εγωισμό[79]. Ενώ, αν μετανοούσε και πήγαινε και έλεγε στον Χριστό «ευλόγησον», θα σωζόταν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Το εργόχειρο που δεν τελειώνει ποτέ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι το χαροποιό πένθος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι η χαρά που προέρχεται από την λύπη για ένα σφάλμα μας. Στο χαροποιό πένθος υπάρχει και πόνος και χαρά, γι᾿ αυτό λέγεται και χαρμολύπη. Λυπάται ο άνθρωπος από φιλότιμο που λύπησε τον Χριστό, χαίρεται όμως, γιατί νιώθει θεία παρηγοριά. Ο αμαρτωλός, όταν μετανοήση ειλικρινά, συγχωρείται από τον Θεό, αισθάνεται μέσα του θεία παρηγοριά και μπορεί να φθάση σε πνευματική αγαλλίαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο άνθρωπος που αγωνίζεται μπορεί σε όλη του την ζωή να ζη την μετάνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αν αγωνίζεται σωστά, δεν βλέπει την πρόοδό του, αλλά μόνον τις πτώσεις του και ζη σε συνεχή μετάνοια. Δεν ξέρει ότι στην αρχή πάλευε με ένα δαιμόνιο και ύστερα μπορεί να παλεύη με ένα τάγμα. Γιατί, όσο περισσότερη δύναμη καταβάλλει κανείς, για να ξερριζώση ένα πάθος και να αποκτήση μια αρετή, τόσο περισσότεροι εχθροί μαζεύονται και τραβάνε και αυτοί από κάτω τις ρίζες. Τότε, ενώ δεν βλέπει πρόοδο, ωστόσο προοδεύει θετικά. Και μπορεί, μέχρι να πεθάνη, να ζη σ᾿ αυτήν την κατάσταση, να μη βλέπη πρόοδο, να νομίζη ότι δεν προχωρεί, επειδή έχει πτώσεις, αλλά στην πραγματικότητα υπάρχει πρόοδος, γιατί συνεχώς αυξάνει τον αγώνα του και παλεύει όλο και με περισσότερα ταγκαλάκια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η μετάνοια για τον αγωνιζόμενο είναι ένα εργόχειρο που δεν τελειώνει ποτέ. Τους πεθαμένους τους κλαίνε, τους θάβουν, τους ξεχνούν... Τις αμαρτίες μας θα τις κλαίμε συνέχεια, μέχρι να πεθάνουμε, αλλά με διάκριση και με ελπίδα στον Χριστό που σταυρώθηκε, για να μας αναστήση πνευματικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αλλαγή ζωής
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να σταματήση ο άνθρωπος να κάνη μια αμαρτία, πρέπει να προσπαθήση να αποφύγη κάθε ερέθισμα που προκαλεί αυτήν την αμαρτία. Ο μέθυσος λ.χ., αν θέλη να βοηθηθή και να μην ξαναπιή, δεν πρέπει ούτε έξω από ταβέρνα να περάση. Μικρή προσπάθεια χρειάζεται και καλή διάθεση, και ο Καλός Θεός θα μας βοηθήση να ξεπεράσουμε τις δυσκολίες. Έχει, ας πούμε, κάποιος ένα πάθος. Το αναγνωρίζει, αγωνίζεται να το κόψη, μετανοεί, ταπεινώνεται. Η διάθεση που έχει να κόψη το πάθος του πληροφορεί τον Θεό και τον βοηθάει. Αλλά, αν δεν καταβάλλη προσπάθεια, για να αλλάξη, και συνεχίζη να αμαρτάνη, πώς ο Θεός να δώση την Χάρη Του; Η Χάρις του Θεού δεν έρχεται σε λανθασμένη κατάσταση, γιατί αυτό δεν βοηθάει τον άνθρωπο. Αν ήταν έτσι, θα έστελνε ο Θεός την Χάρη Του και στον διάβολο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος που δεν παραμένει στην πτώση του, στις αμαρτωλές σκέψεις του, αλλά μετανοεί για τα σφάλματά του και αγωνίζεται να μην αμαρτάνη, δέχεται την Χάρη του Θεού και βοηθιέται. Όταν όμως δεν υπάρχη μετάνοια και η αμαρτία θεωρήται μόδα, αυτό είναι δαιμονική κατάσταση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο ένας από τους δύο ληστές που είχαν σταυρωθή με τον Χριστό πώς σώθηκε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εκείνος ανέβηκε από τον τοίχο και μπήκε στον Παράδεισο! «Η του ληστού μετάνοια τον Παράδεισον εσύλησεν»[80]. Έκλεψε δηλαδή με την μεγάλη του μετάνοια και τον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κάποιος έχη αλλάξει ζωή και δεν παραμένη στις παλιές του αμαρτωλές συνήθειες, αλλά μερικές φορές πέφτη σε κάποιο από τα παλιά του αμαρτήματα, σημαίνει ότι δεν έχει μετάνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, αν κάνη την προσπάθεια που χρειάζεται και πέφτη, έχει κάποια ελαφρυντικά. Στην αρχή δεν είναι εύκολο. Αλλά, όταν κανείς καταλάβη πραγματικά πόσο βαρύ ήταν αυτό που έκανε, δεν ξαναπέφτει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά υπήρχε μετάνοια ειλικρινής. Όταν κάποιος μετανοούσε, δεν γύριζε πίσω. Θυμάμαι μια γυναίκα, πόσο με είχε βοηθήσει με την αληθινή της μετάνοια. Είχε πολλή συστολή, ούτε μιλούσε. Είχε βάλει τα μαύρα – σαν καλόγρια ήταν – και φρόντιζε ένα εκκλησάκι, άναβε τα κανδήλια... Και μόνον που την έβλεπες, βοηθιόσουν πολύ. Τώρα βλέπω, μερικοί, μόλις αλλάζουν ζωή, αρχίζουν να κάνουν τον δάσκαλο στους άλλους, ενώ μέσα τους υπάρχει ακόμη ο παλαιός εαυτός τους. Να μετανοήση βέβαια κανείς, να σταματήση την άσωτη ζωή που ζούσε και να αρχίση να ζη πνευματικά, αυτό είναι θετική βοήθεια και για τους άλλους. Αλλά από εκείνη την κατάσταση στην οποία βρισκόταν, να παρουσιάζεται αμέσως ως πνευματικός άνθρωπος και να κηρύττη, έ, αυτό είναι πλάνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, το κάνουν με την σκέψη να βοηθήσουν τους άλλους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, για να βοηθήσουν. Πίσω όμως από αυτήν την ενέργειά τους, ιδίως αν ήταν λίγο γνωστοί στον κόσμο, κρύβεται ο υπερήφανος λογισμός: «Τώρα οι άνθρωποι θα πάψουν να μιλούν για Καραϊσκάκη και Κολοκοτρώνη και θα συζητούν για μένα»! Από ᾿κεί να καταλάβης πόσο λανθασμένα βαδίζουν. Αν νιώθουν πραγματικά το σφάλμα τους, για ένα διάστημα δεν πρέπει να το ξεχάσουν και να ξεθαρρέψουν, αλλά να προσέχουν πολύ. Και όταν περνάνε διάφορες ιδέες ή λογισμοί από την παλιά ζωή τους, να τα διώχνουν σαν βλάσφημους λογισμούς. Αυτό είναι απόδειξη ότι δεν τα αποδέχονται πλέον, ότι ο οργανισμός αντιδράει. Πρέπει δηλαδή να έχη κανείς πολλή ταπείνωση και να έχη σιχαθή όλα τα παλιά, για να αλλάξη πραγματικά. Αν κρατήση από την παλιά του ζωή μερικά, τα οποία εκείνος θεωρεί καλά, μετά μουρνταρεύονται και τα άλλα. Από την στιγμή που έχει έστω και μια μικρή ιδέα για τον παλαιό του εαυτό, δεν βοηθάει ο Θεός καί, ό,τι κι αν κάνη, δεν θα είναι καθαρό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν αλλάξη κανείς ζωή, πρέπει να ενδιαφερθή να διορθώση τον λογισμό που είχαν προηγουμένως οι άλλοι γι᾿ αυτόν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν θα κοιτάξη εγωιστικά να διορθώση τον λογισμό των άλλων· θα κοιτάξη πώς να διορθωθή ο ίδιος, και τότε θα αναιρεθή από μόνος του ο λογισμός τους. Αν το στίγμα από την αμαρτωλή ζωή του έχει μείνει στην κοινωνία ή στο στενό του περιβάλλον, αυτό θα σβήση με την καλή του διαγωγή. Δεν χρειάζεται να μιλάη καθόλου. Θα μιλήση ο Θεός με την μετάνοιά του.
- type: h2
  initial:
    ru: ''
  text:
    ru: «Η αμαρτία μου ενώπιόν μου εστι διαπαντός»[81]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βοηθάει να σημειώνη κανείς τα σφάλματά του, για να μην τα ξεχάση, μέχρι να τα εξομολογηθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν έχω πονέσει πραγματικά για ένα σφάλμα που έκανα, δεν μπορώ να το ξεχάσω. Με ελέγχει η συνείδησή μου, πονάει η ψυχή μου και το θυμάμαι συνέχεια. Όσο διάστημα μεσολαβεί μέχρι να το εξομολογηθώ, τόσο το σφάλμα δουλεύει μέσα μου, κεντάει την καρδιά μου, και ελέγχομαι. Υποφέρω δηλαδή, αλλά και ανταμείβομαι από τον Θεό ανάλογα. Όταν όμως κάνω ένα σφάλμα και δεν το ξανασκέφτωμαι, τότε το σφάλμα δεν με κεντάει καθόλου· το ξεχνάω και μένω αδιόρθωτος. Γι᾿ αυτό μερικοί, ενώ τους κάνεις παρατήρηση για ένα σφάλμα που έκαναν, γελάνε, σαν να μη συμβαίνη τίποτε. Αυτό έχει αναίδεια, αδιαφορία· είναι κάτι τελείως σατανικό. Είδες τί λέει ο Δαβίδ; «Την ανομίαν μου εγώ αναγγελώ και μεριμνήσω υπέρ της αμαρτίας μου»[82]και «η αμαρτία μου ενώπιόν μου εστι διαπαντός»[83]. Παρόλο που ο Θεός τον είχε συγχωρήσει, εκείνος από φιλότιμο πάλι μέσα του πονούσε, γι᾿ αυτό δεχόταν συνέχεια θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Άλλοι πάλι χάνονται με συνεχείς διαγνώσεις του εαυτού τους. Σημειώνουν-σημειώνουν σχολαστικά τα σφάλματά τους, δήθεν για να κάνουν πιο λεπτή εργασία, τα περνάνε από διυλιστήριο, ζαλίζονται, αλλά δεν διορθώνονται. Ενώ, αν πιάσουν ένα-ένα τα μεγάλα ελαττώματα και αγωνισθούν να διορθωθούν σ᾿ αυτά, θα εξαφανισθούν και τα μικρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κάποιος δεν ζη εν μετανοία και δοξολογή τον Θεό, την δέχεται αυτήν την δοξολογία ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, πώς να δεχθή αυτήν την δοξολογία ο Θεός; Πρώτα του χρειάζεται μετάνοια. Γιατί, όταν παραμένη στην αμαρτία, σε τί τον ωφελεί να πή: «Δόξα Σοι, τω δείξαντι το φώς...»; Αυτό έχει αναίδεια. Το μόνο που ταιριάζει να πή, είναι: «Σ᾿ ευχαριστώ, Θεέ μου, που δεν ρίχνεις έναν κεραυνό να με κάψης», γιατί αυτού του είδους η δοξολογία έχει μετάνοια.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Μετάνοια αναγκαστική
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Αββάς Ισαάκ γράφει: «Πάσα μετάνοια γινομένη άνευ της προαιρέσεως ούτε χαράν περιέχει, ούτε λογίζεται αξία ανταμοιβής»[84]. Πώς μπορεί να μετανοή κανείς χωρίς την προαίρεσή του;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αναγκάζεται να μετανοήση, μια που ξέπεσε στα μάτια των άλλων, αλλά δεν έχει ταπείνωση. Έτσι το καταλαβαίνω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή υπάρχει μετάνοια χωρίς την προαίρεσή μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, είναι η αναγκαστική μετάνοια. Σού ζητάω δηλαδή να με συγχωρέσης για ένα κακό που σού έκανα, για να γλυτώσω από τις συνέπειες, αλλά εσωτερικά δεν αλλάζω. Ο διαβολεμένος άνθρωπος κάνει δήθεν ότι μετάνοιωσε και πηγαίνει με πονηριά, βάζει μετάνοιες με προσποιητή καλωσύνη, για να πλανέση τους άλλους. Αλλά και το να πάη κανείς να πη τις αμαρτίες του στον πνευματικό, γιατί φοβάται μήπως πάη στην κόλαση, και αυτό δεν είναι μετάνοια. Γιατί δεν είναι ότι μετανοεί για τις αμαρτίες του, αλλά το θέμα είναι να μην πάη στην κόλαση! Μετάνοια πραγματική είναι πρώτα να συναισθανθή ο άνθρωπος το σφάλμα του, να πονέση, να ζητήση συγχώρεση από τον Θεό και μετά να εξομολογηθή. Έτσι θα έρθη η θεία παρηγοριά. Γι᾿ αυτό πάντα συνιστώ μετάνοια και εξομολόγηση. Μόνον εξομολόγηση ποτέ δεν συνιστώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Νά, και όταν γίνεται ένας σεισμός, βλέπει κανείς ότι όσοι έχουν καλή προαίρεση συγκλονίζονται, μετανοούν και αλλάζουν ζωή. Οι άλλοι, οι περισσότεροι, έρχονται προς στιγμήν σε συναίσθηση, μόλις όμως περάση ο κίνδυνος, πάλι γυρίζουν στην παλιά τους ζωή. Γι᾿ αυτό, όταν μου είπε κάποιος ότι στην πόλη που μένει έγινε δυνατός σεισμός, του είπα: «Σάς κούνησε δηλαδή γερά· σάς ξύπνησε όμως;». «Μάς ξύπνησε, μας ξύπνησε», μου λέει. «Πάλι όμως θα κοιμηθήτε», του είπα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η μετάνοια φέρνει την θεία παρηγοριά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι η θεία παρηγοριά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η θεία παρηγοριά τί είναι; Θα σάς πω ένα παράδειγμα, για να καταλάβετε καλύτερα. Ένα παιδάκι κάνει μια μικρή ζημιά, σπάζει λ.χ. ένα εργαλείο του πατέρα του, και ύστερα στενοχωριέται και κλαίει, γιατί την θεωρεί πολύ μεγάλη. Όσο περισσότερο κλαίει και αναγνωρίζει την ζημιά που έκανε και υποφέρει, τόσο περισσότερο ο πατέρας του το χαϊδεύει και το παρηγορεί: «Καλά, παιδάκι μου, μη στενοχωριέσαι, δεν πειράζει, θα αγοράσουμε άλλο». Εκείνο όμως, βλέποντας την στοργή του πατέρα του, κλαίει από φιλότιμο περισσότερο. «Δεν μπορώ, λέει, να μη στενοχωριέμαι. Νά, τώρα χρειάζεται το εργαλείο και εγώ το έσπασα». «Παιδάκι μου, δεν είναι τίποτε, παλιό ήταν», του λέει. Αλλά εκείνο πάλι στενοχωριέται. Και όσο αυτό στενοχωριέται, άλλο τόσο ο πατέρας του το σφίγγει στην αγκαλιά του, το φιλάει και το χαϊδεύει. Έτσι, και όσο περισσότερο υποφέρει ο άνθρωπος και λυπάται για την αμαρτωλότητά του ή για την αχαριστία του προς τον Θεό και κλαίει φιλότιμα που λύπησε με τις αμαρτίες του τον Θεό Πατέρα του, τόσο περισσότερο και ο Θεός τον ανταμείβει με θεία αγαλλίαση και τον γλυκαίνει εσωτερικά. Αυτή η λύπη έχει μεν πόνο, αλλά έχει και ελπίδα και παρηγοριά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όποιος όμως θέλει την θεία παρηγοριά, δεν πρέπει να ζητάη παρηγοριά. Πρέπει να νιώση το σφάλμα του, να μετανοιώση, και τότε θα έρθη από μόνη της η θεία παρηγοριά. Κάποτε είχε δημιουργηθή στο Άγιον Όρος ένα θέμα και είχαν εκτεθή μερικοί. Τυχαία με συνάντησε ένας από αυτούς που είχαν εκτεθή και μου είπε: «Άχ, και σε ήθελα, για να με παρηγορήσης». Και αυτό, γιατί τον είχε ξεσκονίσει κάποιος. Και είχε δίκιο ο άλλος που τον ξεσκόνισε. Όταν το άκουσα, απόρησα! Να ζητάη παρηγοριά, ενώ είχε σφάλει! Αν δεν ζητούσε παρηγοριά, αλλά ταπεινωνόταν και έλεγε: «έσφαλα, Θεέ μου», θα ερχόταν η θεϊκή παρηγοριά μέσα του. Τώρα αυτός, ενώ είχε σφάλει, ήθελε να του πώ: «Δεν πειράζει, μη στενοχωριέσαι, δεν ήταν και τόσο μεγάλο το φταίξιμό σου, δεν φταίς μόνον εσύ, φταίει και ο άλλος». Έ, τί παρηγοριά είναι αυτή; Αυτό είναι κοροϊδία. Η θεία παρηγοριά έρχεται από την μετάνοια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, μετά από μια πτώση ακολουθή μια κατάσταση μετανοίας, αλλά αισθάνεσαι ένα ψυχικό και σωματικό τσάκισμα, σημαίνει ότι η μετάνοια δεν είναι σωστή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Την πρώτη μέρα δικαιολογείται ένα ψυχικό και σωματικό τσάκισμα. Έπειτα όμως, όταν υπάρχη πραγματική μετάνοια, αν και λυπάται και πονάη εσωτερικά ο άνθρωπος, νιώθει την θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά δεν ξεχνάει και το σφάλμα του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, δεν το ξεχνάει. Θλίβεται-παρηγοριέται, θλίβεται-παρηγοριέται. Ένα σκαμπίλι δίνει στον εαυτό του για το σφάλμα που έκανε, ένα χάδι δέχεται από τον Θεό, ένα σκαμπίλι-ένα χάδι... Αυτή είναι η μετάνοια που φέρνει την θεία παρηγοριά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τέταρτο Μέρος – Οι Μαύρεσ Δυνάμεις Του Σκότους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι μαύρες δυνάμεις του σκότους είναι αδύνατες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι τις κάνουν δυνατές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μέ την απομάκρυνσή τους από τον Θεό,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιατί έτσι δίνουν δικαιώματα στον διάβολο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – Τα μάγια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Επειδή πολλές φορές σάς μίλησα για τον Παράδεισο, για τους Αγγέλους και για τους Αγίους, για να βοηθηθήτε, τώρα θα σάς πω και λίγα για την κόλαση και για τους δαίμονες, ώστε να γνωρίσετε με ποιούς παλεύουμε, πάλι για να βοηθηθήτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ήρθε στο Καλύβι ένας νεαρός μάγος από το Θιβέτ και μου διηγήθηκε πολλά από την ζωή του. Αυτό το παιδί, μόλις απογαλακτίστηκε, το αφιέρωσε ο πατέρας του, σε ηλικία τριών χρόνων, σε μια ομάδα τριάντα μάγων ανωτέρου βαθμού στο Θιβέτ, για να το μυήσουν στην τέχνη τους. Έφθασε στον ενδέκατο βαθμό μαγείας· ο δωδέκατος είναι ο ανώτερος. Δεκαέξι χρόνων έφυγε από το Θιβέτ και πήγε στην Σουηδία, για να δη τον πατέρα του. Εκεί συνάντησε τυχαίως έναν ορθόδοξο ιερέα, πολύ πιστό, και του ζήτησε να συζητήσουν. Ο νεαρός μάγος δεν ήξερε καθόλου τί θα πη ιερεύς ορθόδοξος. Στην αίθουσα λοιπόν που κάθησαν να συζητήσουν, άρχισε να του κάνη μερικές από τις μαγείες του, για να δείξη την δύναμή του. Κάλεσε ένα αρχικό[85]δαιμόνιο, τον Μήνα, και του είπε: «Θέλω νερό». Σηκώνεται ένα ποτήρι από την κουζίνα, πηγαίνει μόνο του στην βρύση, ανοίγει η βρύση, γεμίζει, περνάει από την κλειστή τζαμαρία και έρχεται στην αίθουσα. Το πήρε εκείνος και ήπιε. Μετά παρουσίασε στον ιερέα, μέσα στην αίθουσα, όλο το σύμπαν, τον ουρανό, τα αστέρια. Χρησιμοποίησε μαγείες τετάρτου βαθμού και θα προχωρούσε μέχρι τον ενδέκατο βαθμό. Ρώτησε τότε τον ιερέα πώς τα έβλεπε όλα αυτά. «Ήμουν έτοιμος, μου είπε, να τον σκοτώσω, αν μου έβριζε τον σατανά». Ο ιερεύς όμως δεν του είπε τίποτε. Τότε του λέει ο νεαρός: «Γιατί δεν μου κάνεις κι εσύ σημεία;». «Ο δικός μου Θεός είναι ταπεινός», απάντησε ο ιερεύς και έβγαλε έναν σταυρό και του τον έδωσε να τον κρατήση. «Κάνε πάλι σημεία», του λέει. Ο νεαρός κάλεσε τον Μήνα, το αρχικό δαιμόνιο, αλλά ο Μήνας έτρεμε, δεν τολμούσε να πλησιάση. Καλεί τον Σατάν και εκείνος το ίδιο· έβλεπε τον σταυρό και δεν πλησίαζε. Του είπε μόνο να σηκωθή να φύγη για το Θιβέτ. Ο νεαρός τότε έβρισε τον Σατάν: «Τώρα κατάλαβα, του είπε, ότι η μεγάλη σου δύναμη είναι μια μεγάλη αδυναμία». Στην συνέχεια κατηχήθηκε κάπως από τον καλό ιερέα, ο οποίος του μίλησε και για τους Αγίους Τόπους, για το Άγιον Όρος κ.λπ. Έφυγε λοιπόν από την Σουηδία και πήγε στα Ιεροσόλυμα, όπου είδε το  Άγιο Φώς. Από εκεί πήγε στην Αμερική, για να βρίση τους σατανιστές που γνώριζε, για να αλλάξουν μυαλό – ο Θεός τον έκανε τον καλύτερο ιεροκήρυκα –, και από ᾿κεί ήρθε στο Άγιον Όρος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός σκανδαλωδώς τον βοήθησε, επειδή από μικρός είχε αδικηθή. Κάνετε όμως προσευχή, γιατί τον πολεμούν οι μάγοι με όλους τους δαίμονες. Αφού εμένα πολεμούν, όταν έρχεται να τον βοηθήσω, πόσο μάλλον εκείνον. Του διαβάζουν οι ιερείς εξορκισμούς και ανοίγουν τα χέρια του και τρέχουν αίμα. Το καημένο το παιδί πολύ το ταλαιπωρούν οι δαίμονες, ενώ πρώτα, που είχε φιλία μαζί τους, δεν το πείραζαν, αλλά το βοηθούσαν και το εξυπηρετούσαν. Εύχεσθε. Πρέπει όμως και το ίδιο πολύ να προσέξη, γιατί λέει το Ευαγγέλιο ότι το ακάθαρτο πνεύμα, όταν βγή από τον άνθρωπο, «πορεύεται και παραλαμβάνει μεθ᾿ εαυτού επτά έτερα πνεύματα πονηρότερα εαυτού, και εισελθόντα κατοικεί εκεί, και γίνεται τα έσχατα του ανθρώπου εκείνου χείρονα των πρώτων»[86].
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι μάγοι χρησιμοποιούν και διάφορα «αγιωτικά»
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι οι γητευτές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μάγοι είναι. Χρησιμοποιούν τους Ψαλμούς του Δαβίδ, ονόματα Αγίων κ.λπ. και ανακατεύουν και επικλήσεις δαιμόνων. Ενώ δηλαδή εμείς διαβάζοντας το Ψαλτήρι επικαλούμαστε την βοήθεια του Θεού και δεχόμαστε την θεία Χάρη, εκείνοι, με τον τρόπο που το χρησιμοποιούν, βρίζουν τον Θεό, αρνούνται την θεία Χάρη, και έτσι τους κάνουν μετά τα δαιμόνια το χατίρι. Μου έλεγαν για ένα παιδί ότι είχε πάει σε έναν μάγο, για να πετύχη κάτι. Εκείνος του διάβασε κάτι από το Ψαλτήρι και το παιδί πέτυχε αυτό που ήθελε. Έπειτα όμως από λίγο καιρό άρχισε να σβήνη, να λειώνη το φουκαριάρικο. Τί είχε κάνει ο μάγος; Είχε πάρει κάτι ξηρούς καρπούς στα χέρια του και άρχισε να του διαβάζη τον 50ο Ψαλμό. Όταν έφθασε στον στίχο «θυσία τω Θεώ»[87], πετούσε τους ξηρούς καρπούς, κάνοντας θυσία στους δαίμονες, για να του κάνουν το χατίρι. Έτσι έβριζε τον Θεό με το Ψαλτήρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί που ασχολούνται με μαγικά χρησιμοποιούν τον σταυρό, εικόνες...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, το ξέρω, από ᾿δώ να καταλάβης τί απάτη κρύβεται πίσω από όσα κάνουν! Έτσι ξεγελιούνται οι καημένοι οι άνθρωποι. Βλέπουν ότι χρησιμοποιούν κεριά, εικόνες κ.λπ. και τους εμπιστεύονται. Νά, μου είπε κάποιος ότι, στην πόλη που μένει, μια Τουρκάλα έχει βάλει μια εικόνα της Παναγίας πάνω σε μια πέτρα και λέει: «Η πέτρα που βοηθάει τον κόσμο»! Δεν λέει «η Παναγία», αλλά «η πέτρα». Οι Χριστιανοί μπερδεύονται, γιατί βλέπουν την εικόνα της Παναγίας, και μερικοί που έχουν κάποιο πρόβλημα υγείας τρέχουν εκεί, με τον λογισμό ότι θα βοηθηθούν, και μετά ο διάβολος τους αλωνίζει. Γιατί, όταν η Τουρκάλα λέη ότι η πέτρα βοηθάει τον κόσμο και όχι η Παναγία, από ᾿κεί και πέρα μπαίνει στην μέση ο διάβολος, επειδή αυτό είναι περιφρόνηση στην Παναγία. Απομακρύνεται η Χάρις του Θεού και αρχίζει ο δαιμονισμός. Και τρέχουν οι Χριστιανοί να τους κάνη καλά η πέτρα – η πέτρα και το ταγκαλάκι! –, και τελικά σακατεύονται, γιατί από τον διάβολο τί βοήθεια να έχης; Αν είχαν λίγο μυαλό, θα σκέφτονταν· «Τουρκάλα, Μουσουλμάνα, τί δουλειά έχει με την εικόνα της Παναγίας;». Ακόμη και να έλεγε ότι η Παναγία βοηθάει, αφού είναι Μουσουλμάνα, τί σχέση έχει με την Παναγία; Πόσο μάλλον τώρα που λέει ότι η πέτρα τους βοηθάει! Είπα σε κάποιον να ενημερώσουν την Μητρόπολη και να λάβουν μέτρα, για να φυλαχθή ο κόσμος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο κόσμος μας ζητάει φυλαχτά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καλύτερα να δίνετε σταυρουδάκια, όταν σάς ζητούν φυλαχτό. Μήν κάνετε φυλαχτά, γιατί και οι μάγοι τώρα κάνουν φυλαχτά. Βάζουν απ᾿ έξω καμμιά εικονίτσα ή σταυρό, αλλά μέσα έχουν διάφορα μαγικά. Βλέπουν οι άνθρωποι την εικόνα ή τον σταυρό και μπερδεύονται. Νά, πριν από μέρες μου έφεραν ένα φυλαχτό από έναν Τούρκο Ιμπραήμ, που είχε και σταυρό κεντημένο επάνω. Έχω μάθει και για έναν αθεόφοβο ότι τυλίγει διάφορες εικονίτσες και μέσα βάζει τρίχες, ξυλάκια, καρφίτσες, χάνδρες[88]κ.λπ. Όταν η Εκκλησία τον ήλεγξε, είπε: «είμαι μέντιουμ», γιατί είναι ελεύθερα τα μέντιουμ, και έτσι κάνει ό,τι θέλει. Είπα σε κάποιον που είχε πάθει ζημιά από αυτόν: «Να πάς να εξομολογηθής, γιατί δέχεσαι επιδράσεις δαιμονικές». Πήγε, εξομολογήθηκε. Έρχεται μετά και μου λέει: «Δεν ένιωσα καμμιά διαφορά». «Βρέ, μήπως έχεις τίποτε επάνω σου απ᾿ αυτόν τον πλανεμένο;», τον ρωτάω. «Ναί, λέει, έχω ένα μικρό κουτάκι σαν μικρό Ευαγγέλιο». Το παίρνω, το ανοίγω και βρίσκω μέσα διάφορες εικονίτσες τυλιγμένες. Ξετυλίγω-ξετυλίγω και πιο μέσα είχε κάτι χάντρες, κάτι τρίχες, κάτι σαν ξύλα! Το πήρα και ελευθερώθηκε ο άνθρωπος. Βλέπεις τί τεχνίτης είναι ο διάβολος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φορούν οι καημένοι άνθρωποι κάτι τέτοια φυλαχτά, δήθεν για να βοηθηθούν, και ταλαιπωρούνται. Αυτά πρέπει να τα κάψουν και να παραχώσουν την στάχτη ή να τα πετάξουν στην θάλασσα και να πάνε να εξομολογηθούν. Έτσι μόνον ελευθερώνονται. Είχε έρθει στο Καλύβι ένας νεαρός που είχε πολλά προβλήματα και βασανιζόταν σωματικά και ψυχικά πάνω από τέσσερα χρόνια. Ζούσε αμαρτωλή ζωή και τον τελευταίο καιρό είχε κλεισθή στο σπίτι του· δεν ήθελε να βλέπη άνθρωπο. Δυο φίλοι του, που έρχονταν τακτικά στο Άγιον Όρος, τον έπεισαν μετά από πολλές δυσκολίες να τον πάρουν μαζί τους στο Όρος, με σκοπό να τον φέρουν στο Καλύβι. Στην διαδρομή από την Ουρανούπολη μέχρι την Δάφνη, κάθε φορά που το καράβι έπιανε σε σκάλα μοναστηριού, ο νεαρός σωριαζόταν κάτω. Οι φίλοι του με τους πατέρες που ήταν στο καράβι προσπαθούσαν να τον συνεφέρουν λέγοντας την ευχή. Με πολλή δυσκολία έφθασαν στο Καλύβι. Ο καημένος μου άνοιξε την καρδιά του, μου μίλησε για την ζωή του. Είδα ότι βασανιζόταν από κάποια δαιμονική επήρεια. Του είπα να πάη να εξομολογηθή εκεί σε έναν πνευματικό, να κάνη ό,τι του πή, και θα γίνη καλά. Πράγματι πήγε και εξομολογήθηκε. Όταν μπήκαν στο καράβι, για να επιστρέψουν, είπε στους φίλους του ότι ο πνευματικός του είπε να πετάξη στην θάλασσα το φυλαχτό που του είχε δώσει κάποιος γνωστός του και το φορούσε επάνω του, αλλά του ήταν αδύνατο να το κάνη. Όσο κι αν οι φίλοι του τον παρακαλούσαν να σηκωθή να το πετάξη, εκείνος έμενε σαν άγαλμα. Δεν μπορούσε να σηκωθή από το κάθισμα. Τότε τον έπιασαν και με πολύ κόπο τον έβγαλαν έξω στο κατάστρωμα. Με την βοήθειά τους ο νεαρός κατάφερε να βγάλη το φυλαχτό και να το αφήση να πέση στην θάλασσα, γιατί δεν είχε την δύναμη να το πετάξη. Αμέσως αισθάνθηκε να ελευθερώνωνται τα χέρια του και το ταλαιπωρημένο σώμα του απέκτησε δύναμη. Άρχισε από την χαρά του να χοροπηδά στον διάδρομο γεμάτος ζωντάνια και να δοκιμάζη την δύναμη των χεριών του στα σίδερα και στα τοιχώματα του πλοίου.
- type: h2
  initial:
    ru: ''
  text:
    ru: Όσοι ασχολούνται με μάγια λένε και πολλά ψέματα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι μάγοι έχουν κάποια πληροφορία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έχουν πληροφορία από τον διάβολο, αλλά λένε και πολλά ψέματα. Κι εσείς να προσέχετε εκεί στο αρχονταρίκι. Πρέπει να ελέγχετε την κατάσταση. Να βλέπετε τί άνθρωποι είναι αυτοί που έρχονται, γιατί μπορεί να έρθη και κανένας που ασχολείται με μαγικά. Σάς φαίνεται παράξενο; Σε μια αγρυπνία εδώ ήρθαν δυο άτομα που ασχολούνταν με μαγικά. Πλησίαζαν τους ανθρώπους και τους έλεγαν διάφορα. Έλεγαν και ψέματα ότι έχουν σχέση και με τον Καντιώτη. Σε μια γυναίκα είπαν: «Σού έχουν κάνει μάγια. Θα ᾿ρθούμε στο σπίτι σου, να τα λύσουμε με έναν σταυρό που έχουμε».Έρχονται στην αγρυπνία, μιλούν και λίγο πνευματικά, οπότε σού λένε οι άλλοι: «αφού έρχονται στην αγρυπνία, είναι πιστοί άνθρωποι», και ανοίγουν την καρδιά τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πώς μπερδεύουν τον κόσμο με τα ψέματα που λένε! Για να ξεγελάση κάποιος μια κοπέλα, της είπε: «Ο πατήρ Παΐσιος είδε όραμα ότι θα σε παντρευτώ· πάρε να φορέσης αυτό, χωρίς να εξετάσης τί είναι», και της έδωσε κάτι που ήταν μαγικό. Αλλά εκείνη ευτυχώς δεν το φόρεσε. «Καλά, ο πατήρ Παΐσιος με τέτοια ασχολείται!», είπε και πιάνει και μου γράφει ένα γράμμα, τέσσερις σελίδες με πυκνά γράμματα, γεμάτο βρισιές. Τέτοιο βρισίδι! «Δεν πειράζει, λέω, βρίσε με. Χαλάλι να γίνη το βρισίδι, αφού δεν ξεγελάστηκες να φορέσης αυτό το σατανικό!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σάς ήξερε, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν με ήξερε. Κι εγώ δεν τους ήξερα, ούτε αυτήν ούτε εκείνον.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι δαιμονικές, μαγικές ενέργειες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είπατε στους μαθητές που ήρθαν σήμερα και σάς είπαν ότι κάλεσαν το πνεύμα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί να τους πώ; Τους έδωσα πρώτα ένα καλό ξεσκόνισμα! Είναι άρνηση πίστεως αυτό που έκαναν. Από την στιγμή που καλούν τον διάβολο και τον δέχονται, αρνούνται τον Θεό. Γι᾿ αυτό τους είπα κατ᾿ αρχάς να μετανοήσουν, να εξομολογηθούν ειλικρινά, και στο εξής να προσέχουν· να εκκλησιάζωνται, να κοινωνούν με ευλογία του πνευματικού τους, για να εξαγνισθούν. Έχουν ελαφρυντικά, επειδή είναι παιδιά και το έκαναν σαν παιχνίδι. Αν ήταν μεγάλοι, θα πάθαιναν μεγάλο κακό· ο διάβολος θα αποκτούσε μεγάλη εξουσία επάνω τους· αλλά και αυτά τώρα τα τραντάζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, τί έκαναν ακριβώς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό που κάνουν πολλοί... Βάζουν σε ένα τραπέζι ένα ποτήρι με νερό και γύρω-γύρω τοποθετούν τα γράμματα του αλφαβήτου Α, Β, Γ, κ.λπ. Βάζουν μετά το δάχτυλό τους μέσα στο νερό και καλούν το πνεύμα, δηλαδή τον διάβολο. Το ποτήρι γυρίζει, σταματά μπροστά σε γράμματα και σχηματίζει λέξεις. Αυτά κάλεσαν το πνεύμα καί, όταν ήρθε, το ρώτησαν: «Υπάρχει Θεός;». «Δεν υπάρχει!», τους λέει. «Ποιός είσαι εσύ;», το ρωτούν. «Ο σατανάς!», τους λέει. «Υπάρχει σατανάς;». «Υπάρχει!». Δηλαδή βλακείες χονδρές! Δεν υπάρχει Θεός και υπάρχει σατανάς! Όταν το ξαναρώτησαν, αν υπάρχη Θεός, τους είπε: «Ναί, υπάρχει». Μια «ναί», μια «όχι», οπότε προβληματίσθηκαν τα παιδιά. Έτσι οικονόμησε ο Θεός, για να βοηθηθούν. Μια κοπέλα από την συντροφιά τους την χτύπησε το ποτήρι. Επέτρεψε ο Θεός να την χτυπήση, για να συνέλθουν και τα άλλα παιδιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα πολλοί, όταν θέλουν να κάνουν κακό σε κάποιο πρόσωπο, καταφεύγουν σε μάγους που χρησιμοποιούν την κέρινη κούκλα του βουντού[89]. Οι μάγοι το έχουν κάνει αυτό παιχνίδι, χόμπι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί κάνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φτιάχνουν μια κούκλα από κερί καί, όταν κάποιος τους ζητάη να βλαφθή ο εχθρός του π.χ. στα μάτια, καρφώνουν μία βελόνα στα μάτια της κούκλας και αναφέρουν το όνομα αυτού που θέλουν να βλάψουν, κάνοντας διάφορα μαγικά. Και πράγματι το άτομο εκείνο, αν ζη αμαρτωλή ζωή και δεν εξομολογήται, προσβάλλεται από δαιμονική ενέργεια στα μάτια. Πάνε να βγουν τα μάτια του από τον πόνο! Κάνει εξετάσεις, αλλά οι γιατροί δεν βρίσκουν τίποτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Νά, και τα μέντιουμ τί κακό κάνουν! Δεν φθάνει που παίρνουν τα χρήματα από τους ανθρώπους, αλλά διαλύουν και οικογένειες. Πάει λ.χ. κάποιος στο μέντιουμ και λέει κάποιο πρόβλημα που έχει. «Κοίταξε, του λέει εκείνο, μια συγγενής σου που είναι λίγο μελαχρινή, λίγο ψηλή κ.λπ. σού έχει κάνει μάγια». Ψάχνει αυτός να βρη ποιά από το σόι του έχει αυτά τα χαρακτηριστικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Κάποια θα βρη που να μοιάζη έστω και λίγο. «Ά, αυτή είναι, λέει, που μου έκανε μάγια» και τον πιάνει ένα μίσος εναντίον της. Κι εκείνη η φουκαριάρα να μην ξέρη τίποτε – μπορεί να τον έχη ευεργετήσει κιόλας –, και αυτός να έχη μια αγανάκτηση εναντίον της, να μη θέλη ούτε να την δή! Ξαναπάει στο μέντιουμ κι εκείνο του λέει: «Τώρα πρέπει να λύσουμε τα μάγια. Και για να τα λύσουμε, δώσε μερικά χρήματα». «Έ, αφού τα βρήκε, λέει αυτός, πρέπει να τον ανταμείψω»! Δώσ᾿ του χρήματα...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπεις ο διάβολος τί κάνει; Βάζει σκάνδαλα. Ενώ ένας καλός άνθρωπος, ακόμη κι αν ξέρη κάτι συγκεκριμένο για κάποιον, ποτέ δεν θα πή: «ο τάδε σε έχει βλάψει», αλλά θα προσπαθήση να τον βοηθήση. «Κοίταξε, θα του πή, μη βάζης λογισμούς. Να εξομολογηθής και μη φοβάσαι». Και έτσι βοηθάει και τον έναν και τον άλλον. Γιατί και αυτός που έβλαψε τον άλλον, όταν τον βλέπη να του φέρεται με καλωσύνη, προβληματίζεται με την καλή έννοια, και μετανοεί.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος ποτέ δεν μπορεί να κάνη καλό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί ένας μάγος να θεραπεύση κάποιον άρρωστο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μάγος και να θεραπεύση άρρωστο άνθρωπο! Έναν που τραντάζεται από το δαιμόνιο, αυτόν μπορεί να τον κάνη καλά στέλνοντας το δαιμόνιο σε άλλον. Γιατί ο μάγος με τον διάβολο είναι συνέταιροι, οπότε λέει στον διάβολο: «Βγές από αυτόν και πήγαινε στον τάδε». Βγάζει λοιπόν το δαιμόνιο από εκείνον και συνήθως το στέλνει σε κάποιον συγγενή του ή γνωστό του που έχει δώσει δικαιώματα στον διάβολο. Λέει μετά αυτός που είχε το δαιμόνιο: «εγώ υπέφερα, αλλά ο τάδε μ᾿ έκανε καλά», και έτσι γίνεται διαφήμιση. Και γυρίζει τελικά το δαιμόνιο σε συγγενείς ή σε γνωστούς. Αν κάποιος, ας υποθέσουμε, είναι καμπουριασμένος από δαιμονική επήρεια, μπορεί ο μάγος να διώξη το δαιμόνιο από εκείνον, να το στείλη αλλού και να σηκωθή όρθιος ο καμπούρης. Αν όμως έχη καμπούρα από αναπηρία, δεν μπορεί ο μάγος να τον κάνη καλά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μου είπαν για μια γυναίκα ότι θεραπεύει αρρώστους, χρησιμοποιώντας διάφορα αγιωτικά. Όταν άκουσα τί κάνει, έμεινα κατάπληκτος από την τέχνη του διαβόλου. Κρατάει έναν σταυρό και ψάλλει διάφορα τροπάρια. Ψάλλει π.χ. το «Θεοτόκε Παρθένε» καί, μόλις φθάση στο «ευλογημένος ο καρπός της κοιλίας σου», φτύνει κοντά στον σταυρό, βλασφημάει δηλαδή τον Χριστό, γι᾿ αυτό την βοηθάει μετά το ταγκαλάκι. Έτσι, μερικούς που είναι άρρωστοι, έχουν μελαγχολία κ.λπ. από δαιμονική επήρεια και οι γιατροί δεν μπορούν να τους κάνουν καλά, αυτή τους θεραπεύει, γιατί διώχνει το δαιμόνιο που προκαλεί το βάρος, το στέλνει σε άλλον, και απαλλάσσονται εκείνοι από την θλίψη. Και πολλοί την έχουν για αγία! Την συμβουλεύονται, και λίγο–λίγο βλάπτει την ψυχή τους, τους καταστρέφει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χρειάζεται πολλή προσοχή. Να φεύγη κανείς μακριά από τους μάγους και τα μάγια, όπως φεύγει μακριά από την φωτιά και τα φίδια. Να μην τα μπλέκουμε τα πράγματα. Ο διάβολος δεν μπορεί ποτέ να κάνη καλό. Μόνον τις αρρώστιες που προκαλεί ο ίδιος μπορεί να θεραπεύση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είχα ακούσει το εξής περιστατικό: Ένας νεαρός είχε μπλέξει με κάποιον μάγο και ασχολήθηκε με μαγικά. Έπαθε μετά ζημιά, αρρώστησε και κατέληξε στο νοσοκομείο. Μήνες ξοδεύτηκε ο πατέρας του, γιατί δεν είχαν τότε ασφάλεια, για να βρουν τί έχει. Οι γιατροί δεν του έβρισκαν τίποτε. Είχε γίνει χάλια. Τί κάνει τότε ο διάβολος! Του εμφανίζεται σαν τον Τίμιο Πρόδρομο, που τον είχαν πολιούχο στον τόπο του, και του λέει: «Θα σε κάνω καλά, αν ο πατέρας σου χτίση μία εκκλησία». Το είπε το παιδί στον πατέρα του κι εκείνος ο καημένος είπε: «παιδί μου είναι, όσα έχω να τα δώσω, αρκεί να γίνη καλά», και έταξε στον Τίμιο Πρόδρομο να του χτίση εκκλησία. Ο διάβολος έφυγε και το παιδί έγινε καλά. Έκανε τό... θαύμα! Οπότε λέει ο πατέρας: «Εγώ έταξα να χτίσω εκκλησία. Πρέπει να εκπληρώσω το τάμα μου». Δεν είχαν και οικονομική άνεση καί, για να χτίση τον ναό, πούλησε όσα χωράφια είχαν. Έδωσε όλη την περιουσία του. Τα παιδιά του έμειναν στον δρόμο. Αγανάκτησαν, «νά λείψη η Ορθοδοξία» είπαν, και έγιναν Ιεχωβάδες. Βλέπεις τον διάβολο τί κάνει; Φαίνεται, εκεί δεν υπήρχαν Ιεχωβάδες και βρήκε αυτός τρόπο να γίνουν κι εκεί Ιεχωβάδες!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Πότε πιάνουν τα μάγια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πάντοτε πιάνουν τα μάγια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να πιάσουν τα μάγια, πρέπει να δώση κανείς δικαιώματα στον διάβολο. Να δώση δηλαδή σοβαρή αφορμή και να μην έχη τακτοποιηθή με την μετάνοια και την εξομολόγηση. Σε έναν που εξομολογείται, και με το φτυάρι να του ρίχνουν τα μάγια, δεν πιάνουν. Γιατί, όταν εξομολογήται και έχη καθαρή καρδιά, δεν μπορούν οι μάγοι να συνεργασθούν με τον διάβολο, για να τον βλάψουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια φορά ήρθε ένας μεσήλικας στο Καλύβι με έναν αέρα... Από μακριά, μόλις τον είδα, κατάλαβα ότι έχει δαιμονική επήρεια. «Ήρθα να με βοηθήσης, μου είπε. Προσευχήσου για μένα, γιατί έναν χρόνο τώρα έχω φοβερούς πονοκεφάλους και οι γιατροί δεν βρίσκουν τίποτε». «Έχεις δαιμόνιο, του λέω, γιατί έδωσες δικαιώματα στον διάβολο». «Δεν έκανα τίποτε», μου λέει. «Δεν έκανες τίποτε; του λέω. Δεν απάτησες μία κοπέλα; Έ, αυτή πήγε και σού έκανε μάγια. Πήγαινε να ζητήσης συγγνώμη από την κοπέλα, μετά να εξομολογηθής, να σού διαβάσουν και εξορκισμούς, για να βρής την υγεία σου. Αν εσύ δεν καταλάβης το σφάλμα σου και δεν μετανοήσης, όλοι οι πνευματικοί του κόσμου να μαζευτούν και να ευχηθούν, το δαιμόνιο δεν θα φύγη».Όταν έρχωνται τέτοιοι άνθρωποι, με τέτοιον αέρα, τους μιλάω ανοιχτά. Θέλουν τράνταγμα, για να συνέλθουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ένας άλλος μου είπε ότι η γυναίκα του έχει δαιμόνιο. Κάνει συνέχεια φασαρίες στο σπίτι. Σηκώνεται το βράδυ, τους ξυπνάει, τα κάνει όλα άνω-κάτω. «Εσύ εξομολογείσαι;», του λέω. «Όχι», μου λέει. «Πρέπει να έχετε δώσει δικαιώματα στον διάβολο, του λέω. Δεν έγινε αυτό στα καλά καθούμενα». Τελικά βρήκαμε ότι είχε πάει σ᾿ έναν Χότζα και του έδωσε κάτι να ραντίση στο σπίτι για γούρι, για να πάη καλά η δουλειά του, και ούτε καν έδινε σ᾿ αυτό σημασία. Αλώνιζε μετά ο διάβολος στο σπίτι του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πώς λύνονται τα μάγια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν πιάσουν, Γέροντα, τα μάγια, πώς λύνονται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Με την μετάνοια και την εξομολόγηση. Γι᾿ αυτό πρέπει πρώτα να βρεθή η αιτία, για την οποία έπιασαν τα μάγια, να καταλάβη ο άνθρωπος το σφάλμα του, να μετανοήση και να εξομολογηθή. Πόσοι έρχονται εκεί στο Καλύβι που ταλαιπωρούνται, επειδή τους έχουν κάνει μάγια, και μου λένε: «Κάνε προσευχή, για να απαλλαγώ από αυτό το βάσανο»! Μου ζητούν βοήθεια, χωρίς να ψάξουν να βρουν από που ξεκίνησε το κακό, για να το διορθώσουν. Να βρουν δηλαδή σε τί έφταιξαν και έπιασαν τα μάγια, να μετανοήσουν, να εξομολογηθούν, για να σταματήση η ταλαιπωρία τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ο άνθρωπος που του έχουν κάνει μάγια φθάση σε τέτοια κατάσταση που δεν μπορεί να βοηθήση ο ίδιος τον εαυτό του, να εξομολογηθή κ.λπ., μπορούν οι άλλοι να τον βοηθήσουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορούν να καλέσουν τον ιερέα στο σπίτι να κάνη ένα ευχέλαιο ή έναν αγιασμό. Να του δώσουν να πιή αγιασμό, για να υποχωρήση λίγο το κακό και να μπή λίγο Χριστός μέσα του. Έτσι έκανε μια μητέρα για το παιδί της και βοηθήθηκε. Μου είχε πει ότι ο γιός της υπέφερε πολύ, γιατί του είχαν κάνει μάγια. «Να πάη να εξομολογηθή», της είπα. «Πώς να πάη, πάτερ, να εξομολογηθή, στην κατάσταση που είναι;», μου είπε. «Τότε πές στον πνευματικό σου, της λέω, να έρθη στο σπίτι, να κάνη αγιασμό και να δώσης στον γιό σου να πιή από τον αγιασμό. Θα τον πιή όμως;». «Θα τον πιή», μου λέει. «Έ, ξεκίνησε με τον αγιασμό, της λέω, και μετά προσπάθησε να μιλήση το παιδί σου με τον παπά. Αν εξομολογηθή, θα τον πετάξη τον διάβολο πέρα». Και πράγματι, με άκουσε και βοηθήθηκε το παιδί. Μετά από λίγο μπόρεσε να εξομολογηθή και έγινε καλά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια άλλη γυναίκα, η φουκαριάρα, τί έκανε; Ο άνδρας της είχε μπλέξει με μάγους και δεν ήθελε ούτε σταυρό να φορέση. Για να τον βοηθήση λίγο, έρραψε στον γιακά από το σακκάκι του ένα σταυρουδάκι. Μια φορά που χρειάσθηκε να περάση από ένα γεφύρι στην άλλη όχθη ενός ποταμού, μόλις πάτησε στο γεφύρι, άκουσε μια φωνή να του λέη: «Τάσο, Τάσο, βγάλε το σακκάκι, να περάσουμε μαζί το γεφύρι». Ευτυχώς έκανε κρύο και είπε: «Πώς να το βγάλω; Κρυώνω!». «Βγάλ᾿ το, βγάλ᾿ το, να περάσουμε», άκουσε την ίδια φωνή να του λέη. Βρέ τον διάβολο! Ήθελε να τον ρίξη κάτω στο ποτάμι, αλλά δεν μπορούσε, γιατί είχε επάνω του το σταυρουδάκι. Τελικά τον έρριξε εκεί σε μια άκρη. Εν τω μεταξύ, τον έψαχναν οι δικοί του όλη την νύχτα και τον βρήκαν τον καημένο πεσμένο επάνω στο γεφύρι. Αν δεν έκανε κρύο, θα έβγαζε το σακκάκι και θα τον πετούσε ο διάβολος μέσα στο ποτάμι. Τον φύλαξε ο σταυρός που είχε στο πέτο του. Πίστευε η φουκαριάρα η γυναίκα του. Αν δεν είχε πίστη, θα το έκανε αυτό;'
- type: h2
  initial:
    ru: ''
  text:
    ru: Συνεργασία μάγων και δαιμόνων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένας άνθρωπος που έχει αγιότητα δεν μπορεί να ξεσκεπάση ή να φρενάρη έναν μάγο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να τον φρενάρη; Εδώ λές σε κάποιον που έχει λίγο φόβο Θεού να προσέξη, γιατί έτσι όπως ζη δεν πάει καλά, και πάλι δεν βγαίνει από το δικό του, πόσο μάλλον ο μάγος που συνεργάζεται με τον διάβολο. Αυτόν τί να τον κάνης; Θα του πής ορισμένα πράγματα, αλλά αυτός πάλι με τον διάβολο θα είναι. Δεν γίνεται τίποτε. Μόνον όταν είναι μπροστά σου ο μάγος και λές την ευχή, εκείνη την στιγμή μπορεί να μπερδευτή το δαιμόνιο και να μην μπορή ο μάγος να κάνη την δουλειά του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κάποιος είχε ένα πρόβλημα, και ένας μάγος, που ήταν μεγάλος απατεώνας, πήγε στο σπίτι του να τον βοηθήση. Εκείνος έλεγε την ευχή. Ο καημένος ήταν απλός· δεν ήξερε ότι ο άλλος ήταν μάγος, γι᾿ αυτό επενέβη ο Θεός. Και να δήτε τί επέτρεψε ο Θεός, για να καταλάβη! Άρχισε να δέρνεται ο μάγος από τους δαίμονες και ζητούσε βοήθεια από τον άνθρωπο του οποίου θα έλυνε το πρόβλημα!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, εκείνος έβλεπε τους δαίμονες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εκείνος δεν έβλεπε τους δαίμονες· έβλεπε μια σκηνή. Ο μάγος φώναζε «βοήθεια», έκανε τούμπες, έπεφτε κάτω, έβαζε το χέρι του, για να προφυλάξη το κεφάλι του. Γιατί μη νομίζετε ότι οι μάγοι καλοπερνούν, ότι οι δαίμονες τους κάνουν όλες τις φορές το χατίρι. Το ότι αρνήθηκαν μια φορά τον Χριστό, αυτό τους είναι αρκετό. Στην αρχή οι μάγοι κάνουν συμβόλαιο με τους δαίμονες, για να τους βοηθούν, και οι δαίμονες υποτάσσονται για μερικά χρόνια στις διαταγές τους. Έπειτα όμως από λίγο καιρό τους λένε: «Μ᾿ εσάς θα ασχολούμαστε τώρα;». Ειδικά, όταν οι μάγοι δεν καταφέρνουν να κάνουν αυτό που θέλουν οι δαίμονες, ξέρετε τί τραβούν μετά;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θυμάμαι, μια φορά που συζητούσα έξω από το Καλύβι με εκείνον τον νεαρό μάγο από το Θιβέτ, ξαφνικά σηκώθηκε, μου έπιασε τα χέρια και μου τα γύρισε προς τα πίσω. «Ας έρθη να σ᾿ ελευθερώση τώρα ο Χατζεφεντής[90]», μου είπε. «Άντε, βρέ διάβολε, φύγε από ᾿δώ», του είπα και τον έρριξα κάτω. Ακούς εκεί να βλασφημήση τον Άγιο! Πήγε μετά να με χτυπήση με το πόδι του, αλλά δεν τα κατάφερε· το πόδι του σταμάτησε κοντά στο στόμα μου. Με φύλαξε ο Θεός. Τον άφησα και μπήκα στο κελλί. Ύστερα από λίγη ώρα τον είδα να έρχεται από πέρα, γεμάτος αγκάθια. «Ο Σατάν με τιμώρησε, μου είπε, γιατί δεν σε νίκησα. Με έσυρε μέσα στα ρουμάνια».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι μαύρες δυνάμεις του σκότους είναι αδύνατες. Οι άνθρωποι τις κάνουν δυνατές με την απομάκρυνσή τους από τον Θεό, γιατί έτσι δίνουν δικαιώματα στον διάβολο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Για τους δαιμονισμένους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, στον δαιμονισμένο των Γαδαρηνών[91]πόσοι δαίμονες κατοικούσαν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – «Δαιμόνια πολλά»[92], γράφει το Ευαγγέλιο. Γι᾿ αυτό είπε ο δαιμονισμένος ότι το όνομά του ήταν «λεγεών»[93]. Και βλέπετε, όπως σε έναν δαιμονισμένο μπορεί να κατοικούν ένα σωρό δαίμονες, έτσι και στην καρδιά του πιστού μπορεί να χωρέσουν όλοι οι Άγιοι. Αφού ο Χριστός χωράει, πόσο μάλλον οι Άγιοι! Μεγάλα μυστήρια! Μια φορά, όταν ήμουν στο Καλύβι του Τιμίου Σταυρού, χτύπησε κάποιος το καμπανάκι. Κοίταξα από το παράθυρο, και τί να δώ! Έναν άνδρα που τον ακολουθούσε μια ολόκληρη φάλαγγα δαιμόνων, ένα μαύρο σμήνος! Πρώτη φορά είδα να εξουσιάζουν έναν άνθρωπο τόσοι δαίμονες. Αυτός ήταν μέντιουμ· είχε ανακατέψει ευχές της Εκκλησίας με επικλήσεις δαιμόνων, χριστιανικά βιβλία με μαγικά, και μετά τον εξουσίαζαν οι δαίμονες. Φοβερό! Πολύ στενοχωρέθηκα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικοί ψυχίατροι και τους δαιμονισμένους τους θεωρούν ψυχοπαθείς. Μερικοί ιερείς πάλι κάποιους ψυχοπαθείς τους βγάζουν δαιμονισμένους. Ενώ, ένας ψυχοπαθής, για να βοηθηθή, πρέπει να πάη αλλού, ένας δαιμονισμένος αλλού. Ο ψυχίατρος πώς μπορεί να βοηθήση τον δαιμονισμένο[94];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένας δαιμονισμένος είναι σε θέση να καταλάβη σε τί έφταιξε και δαιμονίσθηκε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, μπορεί να το καταλάβη, εκτός αν έχη πάθει και το μυαλό του, οπότε είναι πολύ δύσκολο να βοηθηθή. Αν είναι μόνο δαιμονισμένος, μπορείς πιο εύκολα να συνεννοηθής μαζί του και να τον βοηθήσης, αλλά πρέπει να κάνη υπακοή. Αλλιώς πώς να βοηθηθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια φορά ήρθε στο Καλύβι ένας από την νότια Ελλάδα, που είχε πάει στους Ινδούς, και είχε δαιμονισθή. Έλεγε κάτι βρισιές και έβγαζε από το στόμα του αφρούς. Τα μάτια του ήταν ορθάνοιχτα, άγρια. Του έλεγα: «μή λές αυτές τις βλασφημίες, γιατί έτσι καλείς τα δαιμόνια», δεν άκουγε. Και από την άλλη ζητούσε να τον βοηθήσω. «Βοήθησέ με, έλεγε, μόνον εσύ μπορείς να με βοηθήσης». «Έμ, πώς να σε βοηθήσω; του λέω. Θέλεις να προσευχηθώ, για να λυτρωθής με την Χάρη του Χριστού, κι εσύ καλείς τα δαιμόνια. Πήγαινε να εξομολογηθής, να σού διαβάσουν εξορκισμούς και έλα μετά να συζητήσουμε». «Δεν πηγαίνω», μου λέει. «Έλα μέσα να σού βάλω λαδάκι από το κανδήλι», του λέω. «Δεν θέλω. Θέλω να με βοηθήσης». Πήγε μετά πιο πέρα και κουβέντιαζε με κάποιον. Κάποια στιγμή που έλεγα σε μια συντροφιά ότι ο Θεός επιτρέπει τις δοκιμασίες για την σωτηρία μας, φώναξε από πέρα: «Ρέ σύ, γιατί λές πώς εργάζεται ο Θεός, για να σωθούν οι άνθρωποι; Έχουμε  έναν πατέρα στον ουρανό και έναν στην γη και πιο πάνω είναι ένας άρχοντας[95]». «Πάψε τις δαιμονολογίες», του λέω, και έλεγα την ευχή. «Τώρα με μπέρδεψες», μου λέει. «Φύγε», του είπα και τον τίναξα πέρα. Έγινε κουβάρι. «Εσύ με ποιόν είσαι;», με ρωτάει. «Με τον Χριστό», του λέω. «Ψέματα λές, μου λέει, δεν είσαι με τον Χριστό, αφού εγώ είμαι ο Χριστός κι εσύ με χτυπάς». Του τα παρουσιάζει ανάποδα ο διάβολος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά τα λέει ο διάβολος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ο διάβολος, αλλά, βλέπεις, ο Θεός του έδωσε το κουράγιο να έρθη μέχρι το Άγιον Όρος. Για να ξεκινήση από την άλλη άκρη της Ελλάδος να έρθη στο Όρος σε τέτοια κατάσταση, είναι μεγάλο πράγμα! Αλλά δεν ακούει και γίνεται χειρότερα. Αν έκανε υπακοή, θα βοηθιόταν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την εωσφορική υπερηφάνεια μπορεί να δαιμονισθή ο άνθρωπος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος έχει πολλή υπερηφάνεια είναι σκοτισμένος. Το μυαλό του είναι ανταριασμένο, είναι σαν να έχη καυσαέρια. Κάνει χοντρά σφάλματα και δεν το καταλαβαίνει. «Εγώ, μου είπε κάποιος, όλους τους αγαπώ· και τον διάβολο τον αγαπώ· δεν είναι κακός...». «Τί λές, βρέ; του λέω. Αν ο Θεός άφηνε τελείως ελεύθερο τον διάβολο, θα μας είχε ξεκάνει όλους. Ποιός είδε χαΐρι από τον διάβολο, για να δής κι εσύ;». Έχει φθάσει όμως σε τέτοια σκότιση, πού, ό,τι κι αν του πής για να τον βοηθήσης, δεν καταλαβαίνει. Λέει ότι τον καταπιέζεις! Καταπίεση είναι αυτή; Άντε τώρα να του βγάλης αυτόν τον λογισμό... Δεν είναι τρελλός, αφού το μυαλό του δουλεύει. Πρέπει να καταλάβη ότι είναι άρνηση, είναι βλασφημία αυτό που λέει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έτσι φθάνουν σιγά-σιγά στην σατανολατρία. Αν δής σατανολάτρες, φαίνονται ότι είναι κυριευμένοι από τον διάβολο. Βλέπεις έναν δαιμονισμό επάνω τους. Και τα καημένα τα παιδιά τα κατευθύνουν εκεί που θέλουν αυτοί με σατανικές μουσικές. Φθάνουν να επικαλούνται τον σατανά. Έχω ακούσει ότι μερικούς δίσκους «ρόκ», αν τους γυρίσης ανάποδα[96], θα ακούσης τραγούδια με τα οποία επικαλούνται τον σατανά. Έχουν μέχρι και δοξολογία στον σατανά: «Σ᾿ εσένα αφιερώνομαι, σατανά». Φοβερό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, μπορεί η υπερηφάνεια να οδηγήση στον δαιμονισμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί. Ας υποθέσουμε ότι κάποιος κάνει ένα σφάλμα και δικαιολογεί τον εαυτό του. Αν του πούν οι άλλοι μια κουβέντα, για να τον βοηθήσουν, λέει ότι τον αδικούν, πιστεύει ότι είναι καλύτερος από εκείνους και τους κατακρίνει. Ύστερα αρχίζει σιγά-σιγά να κρίνη τους Αγίους. Πρώτα τους νεώτερους, μετά τους παλαιότερους: «Εκείνος δεν έκανε θαύματα, ο άλλος έκανε εκείνο...». Έπειτα από λίγο προχωρεί και αρχίζει να κρίνη τις Συνόδους: «καί οι Σύνοδοι με τον τρόπο που αποφάσιζαν...», επομένως και οι Σύνοδοι κατά την γνώμη του δεν έχουν ακρίβεια. Και τελικά φθάνει να λέη: «Και ο Θεός γιατί να το κάνη εκείνο έτσι;». Έ, όταν ο άνθρωπος φθάνη σε τέτοιο σημείο, δεν τρελλαίνεται· δαιμονίζεται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είχε έρθει στο Καλύβι με τον πατέρα του ένας δαιμονισμένος που έλεγε ότι είναι θεός. Είχε πάει σε έναν πνευματικό έξω στον κόσμο, κι εκείνος, επειδή φοβήθηκε μήπως ο διάβολος του ορμήση, του είπε: «Ευλόγησέ με»! Τί να πής; Τέλος πάντων! Έλεγε μετά στον πατέρα του: «Να δής, και ο πατήρ Παΐσιος θα παραδεχθή ότι είμαι θεός». Βάζει στοίχημα με τον πατέρα του σε όσα χρήματα είχαν μαζί τους ότι θα τον παραδεχθώ για θεό. Μόλις άρχισα να κάνω κομποσχοίνι, τινάχθηκε όρθιος. «Τί κάνεις εσύ μ᾿ αυτό; φώναξε. Εγώ έχω κάνει όλες τις αμαρτίες. Έχω κάνει κι εκείνη κι εκείνη την αμαρτία... Έχω τον διάβολο μέσα μου και έχω θεοποιηθή. Πρέπει να παραδεχθής ότι είμαι θεός. Εσύ, βρέ, τίποτε δεν έκανες, μου λέει. Κάνεις συνέχεια βούρ-βούρ μ᾿ αυτό!». Έλεγε κάτι βαρειές κουβέντες! Είχα αγανακτήσει. «Άντε, φύγε από ᾿δώ, χαμένε», του λέω. Του έδωσα ένα ξεσκόνισμα γερό. Αγρίεψε, έγινε θηρίο. Βγάζει τα χρήματα από την τσέπη του, τα πετάει στον πατέρα του: «Πάρ᾿ τα, λέει, έχασα το στοίχημα».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι δαιμονισμένοι αντιδρούν σε οτιδήποτε ιερό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί κανείς να καταλάβη αν κάποιος είναι δαιμονισμένος και όχι ψυχοπαθής;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό και ένας απλός γιατρός, ευλαβής, μπορεί να το καταλάβη. Όσοι πάσχουν από δαιμόνιο, όταν πλησιάσουν σε κάτι ιερό, τινάζονται. Έτσι φαίνεται ξεκάθαρα ότι έχουν δαιμόνιο. Λίγο αγιασμό αν τους δώσης ή με άγιο Λείψανο αν τους σταυρώσης, αντιδρούν, επειδή στρυμώχνονται μέσα τους τα δαιμόνια, ενώ, αν έχουν ψυχοπάθεια, δεν αντιδρούν καθόλου. Ακόμη και επάνω σου αν έχης έναν σταυρό και τους πλησιάσης, ανησυχούν, ταράζονται. Κάποτε σε μια αγρυπνία στο Άγιον Όρος μου είπαν οι πατέρες ότι έχουν τον λογισμό πώς κάποιος λαϊκός που ήταν εκεί είχε δαιμόνιο. Κάθησα στο διπλανό στασίδι και ακούμπησα επάνω του τον σταυρό μου που έχει Τίμιο Ξύλο. Τινάχθηκε επάνω· σηκώθηκε και πήγε στην άλλη μεριά. Όταν έφυγε λίγο ο κόσμος, πήγα με τρόπο δίπλα του. Πάλι τα ίδια. Κατάλαβα ότι πράγματι είχε δαιμόνιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν μου φέρνουν στο Καλύβι παιδάκια και μου λένε ότι έχουν δαιμόνιο, για να διαπιστώσω αν είναι δαιμονισμένα, μερικές φορές παίρνω ένα τεμάχιο αγίου Λειψάνου του Αγίου Αρσενίου και το κρύβω στην χούφτα μου. Και να δήτε, ενώ έχω κλειστά και τα δυο χέρια μου, το παιδάκι, αν έχη δαιμόνιο, κοιτάζει φοβισμένο το χέρι με το οποίο κρατώ το άγιο Λείψανο. Αν όμως δεν έχη δαιμόνιο, αλλά λ.χ. κάποια αρρώστια εγκεφαλική, δεν αντιδρά καθόλου. Άλλοτε πάλι τους δίνω νερό στο οποίο προηγουμένως έχω βουτήξει τεμάχιο αγίου Λειψάνου, αλλά, αν έχουν δαιμόνιο, δεν το πίνουν· απομακρύνονται. Σε ένα δαιμονισμένο παιδάκι έδωσα μια φορά να φάη πρώτα γλυκά, για να διψάση πολύ, και μετά του έφερα από αυτό το νερό. «Στον Γιαννάκη, είπα, θα δώσω πιο καλό νερό». Μόλις ήπιε λίγο, άρχισε να φωνάζη: «Αυτό το νερό με καίει. Τί έχει μέσα;». «Τίποτε», του λέω. «Τί με κάνεις; με καίει», φώναζε. «Δεν καίει εσένα· κάποιον άλλον καίει», του λέω. Το σταύρωνα στο κεφάλι, και τινάζονταν τα χέρια, τα πόδια του... Έπαθε δαιμονική κρίση. Το δαιμόνιο το έκανε ένα κουβάρι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θυμάστε κι εκείνον τον φοιτητή που είχε έρθει εδώ παλιά; «Έχω μέσα μου δαιμόνιο, μου έλεγε, και με τυραννάει πολύ. Περνάω μαρτύριο από τον δαίμονα, γιατί με αναγκάζει να λέω και αισχρά. Έχω φθάσει σε απελπισία. Αισθάνομαι να με πιέζη μέσα μου, να με σφίγγη πότε εδώ, πότε εκεί», και ο καημένος έδειχνε την κοιλιά του, το στήθος, τα πλευρά, τα χέρια. Επειδή ήταν πολύ ευαίσθητος, για να μην τον πληγώσω και για να τον παρηγορήσω, του είπα: «Κοίταξε, δεν έχεις μέσα σου δαιμόνιο· μια εξωτερική δαιμονική επίδραση είναι επάνω σου». Όταν πήγαμε στην εκκλησία, είπα στις αδελφές που ήταν εκεί να κάνουν ευχή για το δυστυχισμένο πλάσμα του Θεού, κι εγώ πήρα από το Ιερό ένα τεμάχιο αγίου Λειψάνου του Αγίου Αρσενίου, τον πλησίασα και τον ξαναρώτησα: «Σε ποιό σημείο σε πιέζει και σε βασανίζει ο δαίμονας; Που νομίζεις ότι βρίσκεται;». Μου έδειξε τότε τα πλευρά του. «Πού, εδώ;», τον ρώτησα και ακούμπησα επάνω την χούφτα μου με το άγιο Λείψανο. Βγάζει αμέσως ένα ουρλιαχτό! «Μ᾿ έκαψες, μ᾿ έκαψες! Δεν φεύγω...ω...ω! Δεν φεύγω!». Φώναζε, έβριζε, έλεγε αισχρά. Τότε άρχισα μέσα μου να λέω: «Κύριε Ιησού Χριστέ, Κύριε Ιησού Χριστέ, διώξε το ακάθαρτο πνεύμα από το πλάσμα Σου» και να τον σταυρώνω με το ιερό Λείψανο. Αυτό γινόταν επί είκοσι λεπτά. Ύστερα ο δαίμονας τον σπάραξε, τον έρριξε κάτω. Έκανε τούμπες. Το κουστούμι του έγινε μέσ᾿ στις σκόνες. Τον σηκώσαμε όρθιο. Έτρεμε ολόκληρος και έκανε έντονες σπασμωδικές κινήσεις. Πιάσθηκε από το τέμπλο, για να στηριχθή. Από τα χέρια του έτρεχε κρύος ιδρώτας, όπως είναι η δροσιά στα χορτάρια. Σε λίγο έφυγε ο δαίμονας και ηρέμησε. Έγινε καλά και τώρα είναι μια χαρά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Μη δίνετε σημασία στα λόγια του δαιμονισμένου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί πρέπει να προσέχη κανείς, όταν συζητά με έναν δαιμονισμένο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να λέη την ευχή και να του φέρεται με καλωσύνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θυμούνται οι δαιμονισμένοι τί λένε πάνω στην κρίση τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άλλα τα θυμούνται και άλλα δεν τα θυμούνται. Δεν ξέρουμε πώς εργάζεται ο Θεός. Μερικές φορές επιτρέπει να τα θυμούνται, για να ταπεινωθούν και να μετανοήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και όταν ζητάη κάτι ο δαιμονισμένος, δεν είναι εύκολο να καταλάβη κανείς πότε αυτό είναι από τον διάβολο και πότε το έχει ανάγκη ο ίδιος. Είχα συναντήσει κάπου μια δαιμονισμένη κοπέλα. Αυτή είχε διαβάσει Καζαντζάκη και πίστευε κάτι βλάσφημα πράγματα με αποτέλεσμα να δαιμονισθή. Ξαφνικά την έπιασε το δαιμόνιο και έβαλε κάτι φωνές! «Καίγομαι, καίγομαι!». Οι δικοί της την κρατούσαν, για να την σταυρώσω. Μετά φώναζε: «Νερό, νερό!». Λέω: «Φέρτε της νερό». «Όχι, όχι, μου λένε, γιατί μας είπε κάποιος να μην κάνουμε υπακοή στον διάβολο». «Τώρα, λέω, η καημένη διψάει. Φέρτε νερό». Καταλάβαινα πότε ήταν το κάψιμο από τον διάβολο και πότε ήταν από δίψα. Ήπιε η καημένη κανα–δυό ποτήρια νερό. «Κάρβουνα, έλεγε, έχω μέσα μου, τόσο κάψιμο νιώθω. Και έναν κουβά νερό να έπινα, δεν θα έσβηνε μέσα μου η φωτιά». Τέτοιο κάψιμο ένιωθε!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, φωνάζη ένας δαιμονισμένος, πώς καταλαβαίνουμε πότε μιλάει ο διάβολος μέσω του ανθρώπου και πότε ο άνθρωπος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν μιλάη ο διάβολος, τα χείλη δεν κινούνται κανονικά· κινούνται σαν μηχανή. Ενώ, όταν μιλάη ο άνθρωπος, κινούνται φυσιολογικά. Όταν φωνάζη ένας δαιμονισμένος, την ώρα που του διαβάζουν εξορκισμούς ή οι άλλοι εύχονται γι᾿ αυτόν, άλλοτε η ίδια η ψυχή βασανίζεται και λέει λ.χ. στον διάβολο: «φύγε, τί κάθεσαι;» και άλλοτε ο διάβολος βρίζει τον άνθρωπο ή τον ιερέα ή βλασφημάει τον Χριστό, την Παναγία, τους Αγίους. Άλλοτε λέει ψέματα ή άλλοτε πιέζεται από την δύναμη του ονόματος του Χριστού να πη την αλήθεια. Μερικές φορές πάλι ο δαιμονισμένος λέει δικά του από τα πνευματικά που έχει διαβάσει κ.λπ. Τί να πώ; Μπερδεμένα πράγματα. Γι᾿ αυτό, όταν συζητάτε μαζί του, να προσέχετε πολύ. Μη δίνετε σημασία στα λόγια του. Μπορεί να λέη λ.χ. «μέ καίς». Αν πράγματι τον καίς και πής «τόν καίω», κάηκες. Αν δεν τον καίς και πιστέψης ότι τον καίς, κάηκες δυο φορές. Ή μπορεί να φωνάζη «βρωμιάρες» και σε μια να πή: «Εσύ είσαι καθαρή». Αν εκείνη το πιστέψη, πάει, χάθηκε. Γι᾿ αυτό μην κάνετε πειράματα με τον διάβολο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σε ένα μοναστήρι πήγαν έναν δαιμονισμένο και ο ηγούμενος είπε στους πατέρες να πάνε στην εκκλησία να κάνουν κομποσχοίνι. Είχαν εκεί και την κάρα του Αγίου Παρθενίου[97], επισκόπου Λαμψάκου, και το δαιμόνιο στρυμώχθηκε πολύ. Συγχρόνως, ο ηγούμενος ανέθεσε και σε έναν ιερομόναχο να διαβάση στον δαιμονισμένο εξορκισμούς. Ο ιερομόναχος αυτός ήταν ευλαβής μεν εξωτερικά, αλλά εσωτερικά είχε κρυφή υπερηφάνεια. Ήταν αγωνιστής και τυπικός σε όλα. Νουθετούσε πνευματικά τους άλλους, γιατί ήταν και λόγιος. Ο ίδιος όμως δεν βοηθιόταν από κανέναν, γιατί οι άλλοι, από σεβασμό, όταν τον έβλεπαν να κάνη κάτι στραβό, δίσταζαν να του το πούν. Είχε δημιουργήσει ψευδαισθήσεις στον εαυτό του ότι είναι ο πιο ενάρετος της μονής κ.λπ. Ο πονηρός βρήκε ευκαιρία εκείνη την ημέρα να του κάνη κακό. Έβαλε την πονηριά του, για να του δώση την εντύπωση ότι αυτός διώχνει το δαιμόνιο από τον δαιμονισμένο. Μόλις λοιπόν άρχισε να διαβάζη τους εξορκισμούς, άρχισε το δαιμόνιο να φωνάζη: «καίγομαι! που με διώχνεις, άσπλαχνε;», οπότε νόμισε ότι καίγεται από τον δικό του εξορκισμό – ενώ ο δαίμονας ζοριζόταν, γιατί προσεύχονταν και οι άλλοι πατέρες –, και απάντησε στον δαίμονα: «Να έρθης σ᾿ εμένα». Το είχε πει αυτό ο Άγιος Παρθένιος σε ένα δαιμόνιο, αλλά εκείνος ήταν άγιος. Μια φορά δηλαδή που ένα δαιμόνιο φώναζε: «καίγομαι, καίγομαι, που να πάω;», ο Άγιος του είπε: «Έλα σ᾿ εμένα». Τότε το δαιμόνιο είπε στον Άγιο: «καί μόνον το όνομά σου με καίει, Παρθένιε!», και έφυγε από τον δαιμονισμένο που ταλαιπωρούσε. Πήγε και αυτός να κάνη τον Άγιο Παρθένιο και δαιμονίσθηκε. Από εκείνη την στιγμή τον εξουσίαζε πια ο δαίμονας. Χρόνια ολόκληρα βασανιζόταν και δεν μπορούσε να αναπαυθή πουθενά. Συνέχεια γύριζε, πότε έξω στον κόσμο και πότε μέσα στο Άγιον Όρος. Τί τράβηξε ο καημένος! Του είχε δημιουργήσει αυτή η κατάσταση ψυχική κούραση και σωματική κόπωση με τρεμούλα. Και να δήτε, ενώ ήταν καλός παπάς, δεν μπορούσε μετά να λειτουργήση[98]. Βλέπετε τί κάνει ο διάβολος;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχει κάποια σχέση ο καφές με τις αντιδράσεις ενός δαιμονισμένου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν το νευρικό σύστημα είναι ταραγμένο και πιή κανείς πολλούς καφέδες, κλονίζονται τα νεύρα και το ταγκαλάκι εκμεταλλεύεται αυτήν την κατάσταση. Δεν είναι ότι ο καφές είναι κάτι δαιμονικό. Χρησιμοποιεί το ταγκαλάκι την επίδρασή του στα νεύρα, και ο δαιμονισμένος αντιδράει χειρότερα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Βοήθεια στους δαιμονισμένους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάπου γράφει ότι ο διάβολος εμφωλεύει στην καρδιά του δαιμονισμένου, αλλά δεν θέλει να το ξέρη αυτό ο άνθρωπος, για να μην τον πολεμήση με την ευχή. Έτσι είναι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, γιατί το δαιμόνιο έχει δικαίωμα να καθήση μέσα στον δαιμονισμένο ένα διάστημα και μπορεί να λουφάζη, ενώ με την ευχή ζορίζεται, επαναστατεί και μπορεί να φύγη. Η ευχή είναι βαρύ πυροβολικό για τον διάβολο. Μου είχαν φέρει στο Καλύβι ένα παλληκάρι δαιμονισμένο που έλεγε συνέχεια την ευχή. Ο πατέρας του ήταν μοναχός, αλλά πέταξε τα ράσα και παντρεύτηκε, και το καημένο γεννήθηκε με δαιμόνιο. Έτσι τα οικονόμησε ο Θεός, για να πάρη μισθό το παιδί, να σωθή και ο πατέρας, να έχουμε κι εμείς οι μοναχοί ως φρένο παραδείγματα από μοναχούς που πέταξαν τα ράσα και τώρα ταλαιπωρούνται. Κάποια στιγμή που το έπιασε το δαιμόνιο, φώναζε σαν την κότα πολύ δυνατά: «Κά, κά, κά...». «Τί έπαθες;», του λέω, ενώ με τον νού μου έλεγα: «Εν τω ονόματι του Ιησού Χριστού έξελθε, ακάθαρτον πνεύμα, από το πλάσμα του Θεού». «Κι εγώ θέλω να φύγω, φώναζε το δαιμόνιο, επειδή πολύ με βασανίζει αυτός ο άνθρωπος, γιατί συνέχεια λέει την ευχή. Θέλω να πάω στο Πακιστάν, να βρώ λίγη ανάπαυση!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί δεν έφευγε το δαιμόνιο, αφού το παιδί έλεγε την ευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φαίνεται ότι και το παιδί είχε δώσει κάποια δικαιώματα, αλλά και το δαιμόνιο είχε το αφεντικό του και έπαιρνε από αυτό εντολές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν προσεύχεται κανείς για έναν δαιμονισμένο, τί πρέπει να λέη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κατ᾿ αρχήν να δοξολογήση τον Θεό: «Σε ευχαριστώ, Θεέ μου, να πή, που με βοήθησες και βρίσκομαι σ᾿ αυτήν την κατάσταση, ενώ κι εγώ μπορούσα να ήμουν στην θέση του και να είχα όχι πέντε-έξι δαιμόνια αλλά χιλιάδες. Σε παρακαλώ, βοήθησε τον δούλο Σου που ταλαιπωρείται τόσο πολύ». Να κάνη δηλαδή πρώτα καρδιακή προσευχή και ύστερα να συνεχίση με την ευχή: «Κύριε Ιησού Χριστέ, ελέησον τον δούλόν Σου».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικές φορές εμείς που προσευχόμαστε, γινόμαστε αιτία να μη φεύγη το δαιμόνιο από τον δαιμονισμένο, γιατί προσευχόμαστε με υπερηφάνεια. Έναν λογισμό υπερήφανο αν φέρουμε, λ.χ. «νά, εγώ με την προσευχή μου θα βοηθήσω να φύγη το δαιμόνιο», αμέσως εμποδίζεται η θεία βοήθεια και βοηθάμε τον διάβολο να παραμένη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Να ευχώμαστε για τους δαιμονισμένους πάντα με ταπείνωση, με πόνο και αγάπη. Μια δαιμονισμένη πολύ την πόνεσε η ψυχή μου. Έκανε μια συγκατάβαση η καημένη, είπε ένα «ναί» στον διάβολο, και την ταλαιπωρεί φοβερά το δαιμόνιο χρόνια ολόκληρα. Καίει τις σάρκες της. Γυρίζουν με τον άνδρα της στα μοναστήρια και κουβαλούν μαζί τους και το δεκαεξάχρονο κορίτσι τους. Κάθονται όλη νύχτα στην εκκλησία και κάνουν αγρυπνία. Αν ήταν άνδρας, θα τον έσφιγγα στην αγκαλιά μου. Το δαιμόνιο πολύ υποφέρει, όταν σφίξης τον δαιμονισμένο με θεϊκή αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν δεν ερεθίζης τον δαιμονισμένο και δεν του πάς κόντρα, αλλά τον πονάς, φεύγει το δαιμόνιο για λίγο ή για πολύ. Η ταπείνωση είναι το ισχυρότερο «σόκ» για τον διάβολο. Σε ένα μοναστήρι, την ώρα που οι προσκυνητές προσκυνούσαν τα άγια Λείψανα, πετάχθηκε ξαφνικά ένας που είχε δαιμόνιο και είπε στον ηγούμενο άγρια: «Με το ζόρι πρέπει να πάμε;». Ο ηγούμενος ταπεινά και με καλωσύνη του είπε: «Όχι με το ζόρι, με την θέλησή σας». Τότε εκείνος φώναξε: «εγώ με το ζόρι θα πάω» και όρμησε στα άγια Λείψανα και προσκύνησε. Είδατε, πιέστηκε ο δαίμονας από την ταπείνωση και την καλωσύνη του ηγουμένου. Αυτό φοβούνται οι δαίμονες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βοηθιούνται οι δαιμονισμένοι από την χάρη των Αγίων, όταν πηγαίνουν προσκύνημα την ημέρα της μνήμης τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλύτερα δαιμονισμένοι να μην πηγαίνουν στα πανηγύρια, γιατί αποσπούν τον κόσμο από την προσευχή. Γίνεται αταξία. Ας πάνε άλλη μέρα να προσκυνήσουν. Και αν ακόμη ξέρουν οι δικοί του ότι υπάρχει εκεί κάποιος άνθρωπος που μπορεί να τον βοηθήση, ας μην τον πάνε εκείνη την ημέρα μέσα στον κόσμο. Διαφημίσεις θα κάνουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ούτε είναι σωστό, όταν φωνάζη ένας δαιμονισμένος, να μαζεύεται κόσμος. Ένα παιδάκι δαιμονισμένο, το καημένο, μου είπε προχθές: «Έχω γίνει ρεζίλι». Είχαν μαζευτή όλοι γύρω του σαν τους γλάρους. «Φύγετε, τους λέω. Τσίρκο έχουμε;». Τίποτε αυτοί. Δεν καταλαβαίνουν ότι, όταν κάποιος έχη ένα κουσούρι και εκδηλώνεται μπροστά στον κόσμο, ρεζιλεύεται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η θεία Κοινωνία βοηθάει τους δαιμονισμένους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για όσους γεννήθηκαν δαιμονισμένοι, επειδή δεν έφταιξαν οι ίδιοι, η συχνή θεία Κοινωνία είναι το δραστικώτερο φάρμακο. Αυτοί έχουν πολύ μεγάλο μισθό, όταν δεν γογγύζουν, μέχρι να ελευθερωθούν με την Χάρη του Θεού. Είναι μάρτυρες, αν υπομένουν, γι᾿ αυτό και επιβάλλεται να κοινωνούν συχνά. Ένας όμως που δαιμονίσθηκε από δική του απροσεξία, πρέπει να μετανοήση, να εξομολογηθή, και να αγωνίζεται, για να θεραπευθή, και θα κοινωνήση, με την άδεια του πνευματικού, όταν πρέπη. Αν κοινωνήση, χωρίς να μετανοήση και χωρίς να εξομολογηθή, θα δαιμονισθή χειρότερα. Ένας δαιμονισμένος, όταν τον πήγαν να κοινωνήση, έφτυνε την θεία Κοινωνία. Ο Χριστός θυσιάσθηκε, καταδέχθηκε να του δώση το Σώμα και το Αίμα Του, και αυτός να το φτύνη! Φοβερό! Βλέπετε, ο διάβολος δεν δέχεται βοήθεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορούμε να δίνουμε τα ονόματά τους να διαβάζωνται στην Προσκομιδή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, βέβαια. Οι δαιμονισμένοι πολύ βοηθιούνται, όταν οι ιερείς διαβάζουν με πόνο τα ονόματά τους στην Προσκομιδή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος που είχε δαιμονισθή έχη μετανοήσει, εξομολογήται, κοινωνάη, και η δαιμονική επήρεια δεν φεύγη, τί συμβαίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν φεύγει, γιατί ακόμη δεν έχει σταθεροποιήσει πνευματική κατάσταση. Αν τον βοηθήση αμέσως ο Θεός να απαλλαγή από αυτήν την δαιμονική επήρεια, αμέσως πάλι θα ξεφύγη. Γι᾿ αυτό ο Θεός από πολλή αγάπη επιτρέπει να υποχωρή το κακό σιγά-σιγά. Έτσι ο άνθρωπος και εξοφλάει και σταθεροποιεί πνευματική κατάσταση. Όσο εκείνος σταθεροποιεί κατάσταση πνευματική, τόσο υποχωρεί και το κακό. Από τον ίδιο θα εξαρτηθή πόσο γρήγορα θα απαλλαγή από την δαιμονική επήρεια. Μια φορά με ρώτησε ένας πατέρας που το παιδί του είχε δαιμόνιο: «Πότε θα γίνη καλά το παιδί μου;». «Όταν εσύ σταθεροποιήσης πνευματική κατάσταση, του λέω, θα βοηθηθή και αυτό». Το ταλαίπωρο, ενώ ζούσε πνευματικά, ο πατέρας του αντιδρούσε και του έλεγε ότι θα τρελλαθή, αν δεν αλλάξη ζωή. Άρχισε να το πηγαίνη ο ίδιος σε οίκο ανοχής, οπότε το παιδί παρασύρθηκε και δαιμονίσθηκε. Όταν το κυρίευε το δαιμόνιο, ορμούσε πάνω στην μάνα του με άσχημες διαθέσεις. Η καημένη η μάνα του αναγκάσθηκε να φύγη σ᾿ ένα νησί, για να γλυτώση. Ο πατέρας είχε μετανοιώσει και προσπαθούσε να ζη πνευματικά, αλλά το παιδί δεν γινόταν καλά. Όταν γύρισε με το παιδί του όλα τα προσκυνήματα, έμαθε όλα τα Συναξάρια των Αγίων και σταθεροποίησε κατάσταση, τότε έγινε καλά το παιδί.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Για τους εξορκισμούς
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σήμερα έφεραν μία δαιμονισμένη και παρακάλεσαν να πούμε στον ιερέα να της διαβάση εξορκισμούς. Τί να κάναμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σ᾿ αυτήν την περίπτωση καλύτερα να λέγατε να το κανονίση ο πνευματικός της. Για να είναι ο διαβολος μέσα της, θα πη ότι ή αυτή έκανε κάποια σοβαρή αμαρτία ή οι γονείς της, και έδωσαν δικαιώματα, γιατί η αμαρτία φέρνει τον διάβολο. Αν δεν μετανοήσουν και δεν εξομολογηθούν, δεν φεύγει η αμαρτία, επομένως δεν φεύγει και ο διάβολος. Ή μπορεί και για κάποιον άλλον λόγο να επέτρεψε ο Θεός να δαιμονισθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βοηθιούνται, Γέροντα, οι δαιμονισμένοι με τους εξορκισμούς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ανάλογα. Οι εξορκισμοί βοηθούν, όταν διαβάζωνται σε ένα παιδάκι δαιμονισμένο που δεν έδωσε δικαιώματα και δεν ξέρει από εξομολόγηση ή σε έναν μεγάλο που έχασε τα λογικά του και δεν μπορεί να εξομολογηθή. Όταν έχη τα λογικά του ο δαιμονισμένος, πρέπει πρώτα να βοηθηθή να βρη σε τί έφταιξε και δαιμονίσθηκε, να μετανοήση, να εξομολογηθή και μετά, αν χρειασθή, να του διαβάσουν εξορκισμούς. Γιατί και μόνο με την συγχωρητική ευχή, μπορεί να φύγη το δαιμόνιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικοί ιερείς μαζεύουν και αυτούς που έχουν δαιμόνιο και άλλους που έχουν κάποια αρρώστια και τους διαβάζουν όλους μαζί εξορκισμούς. Ένας είχε πάρκινσον και του διάβαζαν εξορκισμούς. Νά, και σήμερα, έφεραν έναν ηλικιωμένο που έλεγαν ότι είναι δαιμονισμένος. Το αριστερό του χέρι πάει πέρα-δώθε. Τον πιάνουν και κρίσεις. «Από πότε, τον ρωτάω, είσαι έτσι;». «Από μικρός», μου λέει. Απόρησα. Πρόσεξα μετά ότι το κεφάλι του, στο αριστερό μέρος, ήταν λίγο ζουληγμένο. Στην γέννα, φαίνεται, κάτι είχε πάθει και ύστερα είχε πρόβλημα. Να έχη ο άλλος τον πόνο του και να του λένε πώς έχει δαιμόνιο, να του διαβάζουν εξορκισμούς, «έξελθε, ακάθαρτον πνεύμα...», και να γίνεται ρεζίλι και στον κόσμο! Δεν κάνει! Πόσα παιδιά που τα θεωρούν δαιμονισμένα, δεν έχουν δαιμόνιο! Μου έφεραν ένα παιδί είκοσι πέντε χρόνων που έλεγαν ότι είναι δαιμονισμένο. Του έδωσα να πιή αγιασμό και το καημένο δεν αντέδρασε καθόλου. «Τί κάνει το παιδί; ρωτάω τον πατέρα του. Από πότε το έπαθε;». «Από έξι χρόνων, μου λέει. Τότε είχαν φέρει σκοτωμένο τον παππού του στο μαγαζί και το παιδί, μόλις τον είδε, έπαθε». Είχε πάθει το καημένο έναν νευρικό κλονισμό. Εδώ, και σε μεγάλον αν συμβή αυτό, μπορεί να πάθη, πόσο μάλλον ένα παιδάκι! Άντε, τώρα, να το έχουν για δαιμονισμένο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι εξορκισμοί διαβάζονται και νοερώς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Νοερώς είναι καλύτερα. Βασικά οι εξορκισμοί πρέπει να διαβάζωνται με πόνο, με ταπείνωση, όχι με υπερηφάνεια. Όταν οι ιερείς λένε δυνατά και υπερήφανα το «έξελθε, πνεύμα ακάθαρτον», αγριεύει ο διάβολος, θυμώνει, εκμεταλλεύεται τον εγωισμό του δαιμονισμένου και μπορεί να του πή: «γιά δές, σε κάνει ρεζίλι στον κόσμο· κοπάνα τον αυτόν τον παπά», οπότε ο δαιμονισμένος αρχίζει να χτυπάη τον παπά. Έτσι δεν φεύγει το δαιμόνιο, αλλά φεύγει ο παπάς με το ευχολόγιό του... Μια φορά ένας ιερέας είπε σε έναν δαιμονισμένο: «Σε διατάζω, ακάθαρτο πνεύμα, να φύγης από αυτόν τον άνθρωπο!». «Έ, γι᾿ αυτό κι εγώ δεν φεύγω...», του λέει ο διάβολος με το στόμα του δαιμονισμένου. Γι᾿ αυτό λέω στους ιερείς, όταν διαβάζουν εξορκισμούς, ποτέ να μη φωνάζουν: «έξελθε, ακάθαρτον πνεύμα...», λές και τα δαιμόνια δεν ακούν!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά και οι συγγενείς του δαιμονισμένου δεν χρειάζεται να πούν σε άλλους ότι θα καλέσουν τον παπά να διαβάση εξορκισμούς. Καλύτερα να πούν ότι θα διαβάση μια παράκληση, και ας διαβάση τους εξορκισμούς με χαμηλή φωνή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Μαρτύριο περνούν οι δαιμονισμένοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως πολύ ταλαιπωρούνται όσοι έχουν δαιμόνιο, γιατί και ταπεινώνονται, αλλά και βασανίζονται από τον διάβολο! Μια φορά είχα συναντήσει στην Μονή Σταυρονικήτα ένα παλληκάρι είκοσι τριών ετών που είχε δαιμόνιο. Ήταν πετσί και κόκκαλο. Έξω έκανε παγωνιά, στον ναό έκαιγε σόμπα, και αυτός φορούσε ένα λεπτό κοντομάνικο πουκάμισο και καθόταν πίσω στην λιτή. Δεν άντεξα, πάω, του δίνω ένα μάλλινο ρούχο. «Φόρεσέ το αυτό, του λέω. Δεν κρυώνεις;». «Τί να κρυώσω, πάτερ, μου λέει, εγώ καίγομαι». Έ νά, αυτό είναι κόλαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σε μερικούς μάλιστα δαιμονισμένους, που από την φύση τους είναι ευαίσθητοι, το ταγκαλάκι τους λέει ότι δεν θα σωθούν και τους βάζει να αυτοκτονήσουν. Φοβερό! Δεν είναι μικρό πράγμα! Ήξερα κάποιον δαιμονισμένο που και οι παπάδες τον είχαν βαρεθή τον καημένο. Πήγαινε να του διαβάσουν εξορκισμούς και τον έδιωχναν. Ύστερα ο διάβολος του έλεγε και για μένα: «μήν πάς και σ᾿ αυτόν· ούτε αυτός θα σε δεχθή», και τον είχε ρίξει στην απελπισία. Έναν άλλον, που είχε γίνει καλά με την χάρη του Αγίου Αρσενίου, τί τον έκανε ο διάβολος! Είχε έρθει εδώ, για να προσκυνήση τα Λείψανα του Αγίου Αρσενίου, αλλά ήταν κλειστό το Μοναστήρι. Του παρουσιάζεται λοιπόν ο διάβολος με την μορφή του Αγίου Αρσενίου κάτω στην πόρτα και του λέει: «Να μην ξαναπατήσης εδώ ούτε εγώ σε θέλω ούτε ο Παΐσιος». Τον έδιωξε. Κατάλαβες; Άρχισε μετά και έβριζε τον Άγιο, έβριζε κι εμένα. Καλά, εγώ είμαι για βρίσιμο, αλλά ο Άγιος!... Οπότε ο ταλαίπωρος δαιμονίσθηκε πάλι. Εδώ, μόνο με αναίδεια αν φερθή κανείς, απομακρύνεται η Χάρις του Θεού, πόσο μάλλον να βρίζη τους Αγίους. Ήρθε και στο Καλύβι και φώναζε: «Τί σού έκανα και δεν με θέλεις; Γιατί κι εσύ δεν με βοηθάς; Θέλεις να βασανίζωμαι;». Και να του λέω: «ευλογημένε, ο διάβολος ήταν αυτός που σ᾿ έδιωξε· δεν ήταν ο Άγιος· ο Άγιος δεν διώχνει», και να μην ακούη. Πίστευε στον λογισμό του. Ξέρετε τί ταλαιπωρία, τί μαρτύριο περνούν κάθε μέρα οι καημένοι;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά και πολλοί δαιμονισμένοι ταλαιπωρούνται, για να βάλουν μερικοί άλλοι μυαλό. Γιατί, όταν τους βλέπουν πόσο βασανίζονται, προβληματίζονται, έρχονται σε συναίσθηση και μετανοούν. Μη νομίζετε δηλαδή ότι όσοι δαιμονίζονται έχουν περισσότερες αμαρτίες. Επιτρέπει όμως ο Θεός να δαιμονίζωνται, οπότε εξευτελίζονται, ταπεινώνονται, ξοφλάνε αμαρτίες, παίρνουν αυτοί μισθό, αλλά βοηθιούνται και όσοι τους βλέπουν να ταλαιπωρούνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βέβαια θα πη κανείς ότι υπάρχουν άνθρωποι που κάνουν ένα σωρό αμαρτίες και δεν δαιμονίζονται· πώς γίνεται αυτό; Όταν ο άνθρωπος έχη φθάσει σε τελεία πώρωση, τότε δεν προσβάλλεται από τον δαίμονα, γιατί βλέπει ο Θεός ότι δεν θα βοηθηθή. Πρέπει να ξέρουμε ότι και η προσβολή από δαιμονική ενέργεια είναι, κατά κάποιον τρόπο, δώρο του Θεού προς τον αμαρτωλό άνθρωπο, για να ταπεινωθή, να μετανοήση και να σωθή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 3 – Η φοβερή πλάνη
- type: h2
  initial:
    ru: ''
  text:
    ru: Άσκηση και πλάνη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, φοβάμαι την πλάνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά κάνεις. Όποιος φοβάται την πλάνη, δεν πλανιέται, γιατί προσέχει και λέει όλους τους λογισμούς του· δεν κρύβει τίποτε, κι έτσι βοηθιέται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί είναι η προδιάθεση πλάνης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Προδιάθεση πλάνης είναι να έχης την ιδέα ότι κάτι είσαι και να δείχνης στους άλλους ότι κάτι κάνεις. Να νομίζης ότι εσύ έφθασες σε πνευματικά μέτρα, επειδή κάνεις λ.χ. κάποια άσκηση, ενώ οι άλλοι δεν έχουν ακόμη συλλάβει το νόημα της πνευματικής ζωής, και να φέρεσαι υπερήφανα. Το να ζορίζη κανείς τον εαυτό του εγωιστικά στην άσκηση, για να φθάση στα μέτρα ενός Αγίου και να τον θαυμάζουν οι άλλοι, αυτό είναι αρχή πλάνης. Άλλο βία και άλλο ζόρισμα. Είχα πει σε κάποιον: «Πρόσεξε μην πλανηθής με την τακτική που ακολουθείς· δεν πάς καλά». «Εγώ να πλανηθώ; μου λέει. Εγώ ούτε κρέας τρώω». Ούτε για εξομολόγηση πάει. Στην εικόνα λέει τις αμαρτίες του. «Ορθόδοξος είσαι εσύ ή Προτεστάντης; του λέω. Που το βρήκες αυτό γραμμένο;». «Γιατί, μου λέει, ο Χριστός δεν με ακούει;». Άκου εκεί κουβέντα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, βοηθάει η σωματική άσκηση στον αγώνα κατά των παθών;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν χρησιμοποιήται γι᾿ αυτόν τον σκοπό, βοηθάει. Ταπεινώνεται το σώμα και υποτάσσεται η σάρκα στο πνεύμα. Η ξερή όμως άσκηση[99]δημιουργεί ψευδαισθήσεις, γιατί καλλιεργεί τα ψυχικά πάθη, φουσκώνει την υπερηφάνεια, αυξάνει την αυτοπεποίθηση και οδηγεί στην πλάνη. Βγάζει τότε κανείς συμπεράσματα για την πνευματική του πρόοδο από την ξερή άσκηση που κάνει. «Εγώ κάνω εκείνο κι εκείνο, ενώ ο τάδε χωλαίνει· έφθασα εκείνον τον Άγιο, πέρασα τον άλλον» και δώσ᾿ του νηστείες και αγρυπνίες. Πάνε όμως όλα χαμένα, γιατί δεν τα κάνει με σκοπό την εκκοπή των παθών, αλλά για να ικανοποιηθή εγωιστικά. Είχα γνωρίσει έναν μοναχό που έκανε άσκηση από υπερηφάνεια και του έλεγε ο λογισμός ότι είναι μεγάλος ασκητής. Είχε γίνει χάλια· δεν έτρωγε, δεν πλενόταν κιόλας και ήταν μέσ᾿ στην βρωμιά... Τα ρούχα του από την λέρα είχαν λειώσει. Τα πήρα να τα πλύνω, αλλά τί να πλύνης! Είχαν σαπίσει. Μια φορά μου λέει: «Τον Όσιο Ιωάννη τον Καλυβίτη τον ξεπέρασα». «Βρέ, του λέω, από την λέρα αγίασε ο Όσιος Ιωάννης ο Καλυβίτης;». Μετά από λίγες μέρες που ξαναήρθε, μου λέει: «Τον Όσιο Μάξιμο τον Καυσοκαλυβίτη τον ξεπέρασα». «Δηλαδή, πώς τον ξεπέρασες;», τον ρωτάω. «Νά, όλο το Άγιον Όρος, μου λέει, το γύρισα σβούρα». «Βρέ, ο Όσιος Μάξιμος, του λέω, είχε εξαϋλωθή και πετούσε, δεν γυρνούσε σαν κι εσένα». Άρχισε μετά να κάνη και μνήμη θανάτου και έλεγε με τον λογισμό του: «Τώρα είμαι στην κόλαση». Έπειτα από λίγο, τάχα για να ταπεινωθή, άρχισε να λέη: «τώρα είμαι διάβολος, σατανάς, και θα πάω να μαζέψω οπαδούς», οπότε έφθασε στην πλάνη.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσοχή στην φαντασία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έχετε πει ότι πρέπει να αποφεύγουμε κατά την ώρα της προσευχής να φέρνουμε στον νού μας διάφορες εικόνες από την ζωή του Χριστού κ.λπ. Γιατί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Για να μη μας πλανέση ο διάβολος με φαντασίες. Η φαντασία είναι καλή, είναι μεγάλη δύναμη, αν αξιοποιηθή. Μερικοί άνθρωποι μπορεί λ.χ. να δούν τώρα ένα τοπίο και μετά από έναν χρόνο να το θυμούνται ακριβώς όπως είναι και να το ζωγραφίσουν. Αυτό είναι μια ικανότητα που την δίνει ο Θεός στον άνθρωπο, αλλά ο διάβολος την εκμεταλλεύεται. Εκείνοι που πλανιούνται, ό,τι βλέπουν ή διαβάζουν, το φαντάζονται όπως θέλουν και ύστερα αυτήν την φανταστική εικόνα την πιστεύουν για πραγματικότητα. Για να βοηθηθούν, χρειάζονται πολλή παρακολούθηση οι καημένοι, γιατί συνέχεια τους ξεγελάει ο διάβολος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό, όποιος έχει εκ φύσεως φαντασία, πρέπει να προβληματίζεται, όταν του λένε ότι δεν σκέφτεται σωστά, και να βάζη ερωτηματικά στον λογισμό του. Είχα γνωρίσει μία απλή γυναίκα, που προσευχόταν συνέχεια και παρακαλούσε τον Χριστό να Τον δη εδώ σ᾿ αυτήν την ζωή, μια που δεν θα Τον έβλεπε, καθώς έλεγε, στην άλλη ζωή. Ο Χριστός πράγματι της παρουσιάσθηκε την ώρα της Θείας Κοινωνίας μέσα στο Άγιο Ποτήριο ως βρέφος, με ματωμένα μαλλάκια, και ύστερα χάθηκε, και έτσι μπόρεσε να κοινωνήση. Μετά από αυτό το γεγονός άρχισε να την δουλεύη ο εχθρός με τον λογισμό ότι κάτι είναι. Από ᾿κεί και πέρα την δούλευε με την φαντασία και της παρουσίαζε συνέχεια κινηματογραφικές ταινίες. Όταν βγήκα μια φορά στον κόσμο, την είχα βρει σε ένα σπίτι και άκουσα τις φαντασίες που έλεγε σε άνδρες και γυναίκες που είχαν συγκεντρωθή εκεί. Τρόμαξα να την φέρω σε λογαριασμό. Η μόνη λύση ήταν να της δώσω ένα γερό ξεσκόνισμα μπροστά σε όλους, για να γίνουν γνωστές οι πλάνες της και να ταπεινωθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φαντασία της ήταν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φαντασία και πλάνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν τα έλεγε αυτά στον πνευματικό της;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρεις τί γίνεται; Ο σατανάς τους ξεγελάει με αυτά που βλέπουν, δεν προβληματίζονται και δεν σκέφτονται ότι πρέπει να τα πούν στον πνευματικό. Τί τεχνίτης είναι ο διάβολος! Φοβερό!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν δεν προσέξη κανείς την φαντασία του, ο πειρασμός μπορεί να εκμεταλλευτή ακόμη και ένα απλό, φυσικό, γεγονός και να τον πλανέση. Στην Μονή Στομίου, όταν διάβαζα τον εσπερινό τον χειμώνα, άναβα την σόμπα. Οι γυναίκες που ανέβαιναν καμμιά φορά στο μοναστήρι είχαν παρατηρήσει ότι η εικόνα της Παναγίας στο τέμπλο, την ώρα του εσπερινού, έκανε κράκ-κράκ – εγώ δεν το είχα προσέξει – και έλεγαν η μία στην άλλη: «Την ώρα που διαβάζει ο καλόγερος τον εσπερινό, η εικόνα της Παναγίας κάνει κράκ-κράκ». Όταν το άκουσα, είπα: «Για να δώ την εικόνα που κάνει κράκ-κράκ». Όχι ότι δεν πιστεύω σε θεία γεγονότα· πιστεύω ότι η Παναγία και παρουσιάζεται και μιλάει και την βλέπουν όσοι έχουν πνευματική κατάσταση, αλλά χρειάζεται προσοχή. Ανεβαίνω λοιπόν σε μια καρέκλα και κοιτάζω. Τί συνέβαινε; Η εικόνα ήταν παλιά και είχε τρέσα[100]χωνευτά. Όταν άναβε η σόμπα, ζεσταινόταν το τρέσο και με την διαστολή έκανε κράκ-κράκ. Έβαλα ένα καρφάκι και σταμάτησε ο θόρυβος. Ύστερα ρώτησα τις γυναίκες: «Ακούτε τώρα τίποτε;». «Όχι», μου είπαν. «Έ, μη δίνετε σημασία», τις είπα. Θέλει προσοχή, γιατί, αν καλλιεργηθή σιγά-σιγά η φαντασία, όλη η ζωή του ανθρώπου πάει χαμένη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς καταλαβαίνει κανείς αν ένα γεγονός είναι πράγματι από τον Θεό ή αν είναι από τον διάβολο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Φαίνεται αυτό. Αν δεν είναι από τον Θεό, του φέρνει ο διάβολος λογισμούς υπερήφανους. Ύστερα, όσα κάνει ο διάβολος είναι χοντρά· φθάνει σε βλάσφημα πράγματα. Είχε έρθει μια φορά στο Καλύβι ένας πλανεμένος και δαιμονισμένος. Του είπα μερικά πράγματα και τον βοήθησα. Ξέρετε τί μου είπε; «Πρώτη φορά τα ακούω αυτά! Ούτε στο Ευαγγέλιο δεν τα έχω διαβάσει!». Δηλαδή σαν να μου έλεγε: «Τα είπες καλύτερα από τον Χριστό». Κατάλαβες τί κάνει ο διάβολος, για να σού φέρη υπερήφανο λογισμό; Πάντως, αν δεν καταλάβη ο άνθρωπος ότι τίποτε δεν μπορεί να κάνη με την δική του δύναμη, αλλά, ό,τι κάνει, το κάνει με την δύναμη του Χριστού, και χίλια δαιμόνια να βγάλη από δαιμονισμένους, πάλι τίποτε δεν κάνει.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο διάβολος παρουσιάζεται ως άγγελος φωτός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος δεν έχει νιώσει την ανώτερη χαρά, την παραδεισένια, δεν έχει δηλαδή πνευματικές εμπειρίες, εύκολα μπορεί να πλανηθή, αν δεν προσέξη. Ο διάβολος είναι πονηρός. Ερεθίζει λίγο την καρδιά του ανθρώπου και τον κάνει να αισθάνεται μια ευχαρίστηση, οπότε τον πλανάει, δίνοντάς του την εντύπωση ότι η ευχαρίστηση αυτή είναι πνευματική, θεία. Κλέβει την καρδιά και νομίζει ο άνθρωπος πώς πάει καλά. «Δεν ένιωσα, ταραχή», λέει. Ναί, αλλά αυτό που ένιωσες δεν είναι η πραγματική, η πνευματική χαρά. Η πνευματική χαρά είναι κάτι το ουράνιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο διάβολος μπορεί να παρουσιασθή και σαν άγγελος ή σαν άγιος. Ο καμουφλαρισμένος δαίμονας σε άγγελο ή σε άγιο σκορπάει ταραχή – αυτό που έχει –, ενώ ο πραγματικός Άγγελος ή Άγιος σκορπάει πάντα χαρά παραδεισένια και αγαλλίαση ουράνια. Ο ταπεινός και καθαρός άνθρωπος, ακόμη και άπειρος να είναι, διακρίνει τον Άγγελο του Θεού από τον δαίμονα που παρουσιάζεται σαν άγγελος φωτός, γιατί έχει πνευματική καθαρότητα και συγγενεύει με τον Άγγελο. Ενώ ο εγωιστής και σαρκικός πλανιέται εύκολα από τον πονηρό διάβολο. Όταν ο διάβολος παρουσιάζεται σαν άγγελος φωτός, αν ο άνθρωπος βάλη έναν ταπεινό λογισμό, εξαφανίζεται. Ένα βράδυ, στην Μονή Στομίου, μετά το Απόδειπνο, έλεγα την ευχή στο κελλί καθισμένος σε ένα σκαμνί. Για μια στιγμή ακούω όργανα και κλαρίνα σε ένα οίκημα που ήταν λίγο πιο πέρα για τους ξένους. Παραξενεύτηκα! «Τί όργανα είναι αυτά που ακούγονται τόσο κοντά!», είπα. Το πανηγύρι είχε περάσει. Σηκώνομαι από το σκαμνί και πηγαίνω στο παράθυρο να δώ τί συμβαίνει έξω. Βλέπω ησυχία παντού. Τότε κατάλαβα ότι ήταν από τον πειρασμό, για να διακόψω την προσευχή. Γύρισα και συνέχισα την ευχή. Ξαφνικά ένα δυνατό φως γέμισε το κελλί. Η οροφή εξαφανίστηκε, άνοιξε η σκεπή και φάνηκε μια στήλη φωτός που έφθανε μέχρι τον ουρανό. Στην κορυφή αυτής της φωτεινής στήλης φαινόταν το πρόσωπο ενός ξανθού νέου, με μακριά μαλλιά και γένια, που έμοιαζε με τον Χριστό. Επειδή έβλεπα το μισό πρόσωπό του, σηκώθηκα από το σκαμνί, για να το δώ ολόκληρο. Τότε άκουσα μέσα μου μια φωνή: «Αξιώθηκες να δής τον Χριστό». «Και ποιός είμαι εγώ ο ανάξιος, που αξιώθηκα να δώ τον Χριστό;», είπα και έκανα τον σταυρό μου. Αμέσως το φως και ο δήθεν Χριστός χάθηκαν και είδα ότι η οροφή βρισκόταν στην θέση της.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν ο άνθρωπος δεν έχη το κεφάλι του πολύ καλά κλειδωμένο, μπορεί ο πονηρός να του βάλη λογισμό υπερηφανείας και να τον πλανέση με φαντασίες και ψεύτικα φώτα, τα οποία δεν ανεβάζουν στον Παράδεισο, αλλά γκρεμίζουν στο χάος. Γι᾿ αυτό πρέπει να μη ζητάη ποτέ φώτα ή θεία χαρίσματα κ.λπ., αλλά μετάνοια. Η μετάνοια θα φέρη την ταπείνωση και μετά ο Καλός Θεός θα δώση ό,τι του είναι απαραίτητο. Όταν ήμουν στο Σινά, στο ασκητήριο της Αγίας Επιστήμης, μια φορά το ταγκαλάκι πήγε να μέ... εξυπηρετήση! Το ασκητήριο είχε τρία-τέσσερα σκαλάκια. Την νύχτα, όταν είχε αστροφεγγιά, πήγαινα στις σπηλιές καί, για να κατεβώ τα σκαλάκια, άναβα το τσακμάκι. Μια φορά πάω να ανάψω το τσακμάκι, δεν άναβε. Σε μια στιγμή βλέπω ένα φως σε έναν βράχο σαν από δυνατό προβολέα, φάπ! Ώ, φώτισε τα πάντα γύρω! «Να μου λείψουν τέτοια φώτα», είπα, και γύρισα πίσω. Αμέσως χάθηκε το φώς. Βρέ τον διάβολο, δεν ήθελε να φέξω με το τσακμάκι, για να κατεβώ! «Κρίμα δεν είναι, σού λέει, να παιδεύεται; Ας του δώσω εγώ φώτα»! Καλωσύνη του!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς καταλάβατε, Γέροντα, ότι δεν ήταν από τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, καταλαβαίνεται. Φοβερό!
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα όνειρα είναι απατηλά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, με ταλαιπωρούν κάτι άσχημα όνειρα...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν βλέπης άσχημο όνειρο, ποτέ να μην εξετάζης τί είδες, πώς το είδες, αν είσαι ένοχη, πόσο φταίς. Ο πονηρός, επειδή δεν μπόρεσε να σε πειράξη την ημέρα, έρχεται την νύχτα. Επιτρέπει καμμιά φορά και ο Θεός να μας πειράξη στον ύπνο, για να δούμε ότι δεν πέθανε ακόμη ο παλαιός άνθρωπος. Άλλες φορές πάλι ο εχθρός πλησιάζει τον άνθρωπο στον ύπνο του και του παρουσιάζει διάφορα όνειρα, για να στενοχωρεθή, όταν ξυπνήση. Γι᾿ αυτό να μη δίνης καθόλου σημασία· να κάνης τον σταυρό σου, να σταυρώνης το μαξιλάρι, να βάζης και τον σταυρό και κανα–δυό εικόνες επάνω στο μαξιλάρι και να λές την ευχή μέχρι να σε πάρη ο ύπνος. Όσο δίνεις σημασία, άλλο τόσο θα έρχεται ο εχθρός να σε πειράζη. Αυτό δεν είναι κάτι που συμβαίνει μόνο στους μεγάλους, αλλά και στους μικρούς. Και στα μικρά παιδιά ακόμη, παρόλο που είναι αγγελούδια, ο εχθρός πηγαίνει και τα φοβερίζει, όταν κοιμούνται και τινάζονται με αγωνία, τρέχουν φοβισμένα και με κλάματα στην αγκαλιά της μητέρας. Άλλοτε πάλι τα πλησιάζουν οι Άγγελοι και γελούν μέσα στον ύπνο τους από χαρά ή ξυπνάνε από την μεγάλη τους χαρά. Επομένως τα όνειρα που φέρνει ο πειρασμός είναι μια εξωτερική επίδραση του εχθρού στον άνθρωπο την ώρα που κοιμάται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, νιώθης ένα πλάκωμα την ώρα που κοιμάσαι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές αυτό οφείλεται σε μια αγωνιώδη κατάσταση που ζη κανείς μέσα στην ημέρα ή σε διάφορους φόβους, σε διάφορες υποψίες κ.λπ. Φυσικά όλα αυτά μπορεί να τα χρησιμοποιήση το ταγκαλάκι, να κάνη κάποιον συνδυασμό, για να ζαλίση τον άνθρωπο. Πολλές φορές είναι τόσο ελαφρός ο ύπνος, που νομίζει κανείς ότι είναι ξυπνητός και ότι προσεύχεται, για να φύγη αυτό το πλάκωμα, από το οποίο του κρατιέται ακόμη και η αναπνοή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Καμμιά φορά μάλιστα ο διάβολος μπορεί να πάρη την μορφή ενός ανθρώπου ή ενός Αγίου και να παρουσιασθή στον ύπνο κάποιου. Κάποτε παρουσιάσθηκε σε έναν άρρωστο στον ύπνο του με την μορφή του Αγίου Αρσενίου και του είπε: «Είμαι ο Άγιος Αρσένιος. Ήρθα να σού πω ότι θα πεθάνης. Τ᾿ ακούς; Θα πεθάνης». Τρόμαξε ο άνθρωπος. Ποτέ ένας Άγιος δεν μιλάει έτσι σε έναν άρρωστο. Και αν τυχόν είναι να πεθάνη ο άρρωστος και παρουσιασθή ένας Άγιος να τον πληροφορήση για τον θάνατό του, θα του το πη με καλόν τρόπο: «Επειδή είδε ο Θεός που ταλαιπωρείσαι, γι᾿ αυτό θα σε πάρη από αυτόν τον κόσμο. Κοίταξε να ετοιμασθής». Δεν θα του πή: «Τ᾿ ακούς; Θα πεθάνης»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, φωνάζη κανείς στον ύπνο του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καλύτερα, ξυπνάει... Πολλά όνειρα είναι της αγωνίας. Όταν ο άνθρωπος έχη αγωνία ή είναι κουρασμένος, παλεύουν αυτά μέσα του και τα βλέπει σε όνειρο. Εγώ πολλές φορές, όταν την ημέρα αντιμετωπίζω διάφορα προβλήματα των ανθρώπων, αδικίες που συμβαίνουν κ.λπ., ύστερα στον ύπνο μου μαλώνω με τον άλλον: «βρέ αθεόφοβε, φωνάζω, αναίσθητος είσαι!» και με τις φωνές που βάζω ξυπνάω.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, από τα όνειρα μπορεί κανείς να προβλέψη κάτι που θα του συμβή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, μη δίνετε σημασία στα όνειρα. Είτε ευχάριστα είναι τα όνειρα είτε δυσάρεστα, δεν πρέπει να τα πιστεύη κανείς, γιατί υπάρχει κίνδυνος πλάνης. Τα ενενήντα πέντε τοις εκατό από τα όνειρα είναι απατηλά. Γι᾿ αυτό οι Άγιοι Πατέρες λένε να μην τα δίνουμε σημασία. Πολύ λίγα όνειρα είναι από τον Θεό, αλλά και αυτά, για να τα ερμηνεύση κανείς, πρέπει να έχη καθαρότητα και άλλες προϋποθέσεις, όπως ο Ιωσήφ[101]και ο Δανιήλ, που είχαν χάρισμα από τον Θεό. «Θα σού πώ, είπε ο Δανιήλ στον Ναβουχοδονόσορα, και τί όνειρο είδες και τί σημαίνει»[102]. Αλλά σε τί κατάσταση είχε φθάσει! Ήταν μέσα στα λιοντάρια και τα λιοντάρια, παρόλο που ήταν νηστικά, δεν τον πείραζαν[103]. Του πήγε ο Αββακούμ φαγητό, κι εκείνος είπε: «Με θυμήθηκε ο Θεός;»[104]. Αν δεν θυμόταν ο Θεός τον Προφήτη Δανιήλ, ποιόν θα θυμόταν;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί άνθρωποι δεν βλέπουν όνειρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καλύτερα που δεν βλέπουν! Δεν ξοδεύουν ούτε εισιτήρια, ούτε βενζίνη! Στα όνειρα σε ένα λεπτό βλέπεις κάτι που στην πραγματικότητα θα διαρκούσε ώρες, μέρες, γιατί καταργείται ο χρόνος. Νά, από αυτό μπορεί να καταλάβη κανείς το ψαλμικό: «Χίλια έτη εν οφθαλμοίς σου, Κύριε, ως η ημέρα η εχθές, ήτις διήλθε»[105].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσοχή στα οράματα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν οι άνθρωποι μας διηγούνται οράματα ή λένε ότι είδαν έναν Άγιο κ.λπ., τί να λέμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλύτερα να τους λέτε να είναι επιφυλακτικοί. Αυτό είναι πιο σίγουρο, γιατί δεν μπορούν όλοι να διακρίνουν αν ένα όραμα είναι από τον Θεό ή από τον διάβολο. Αλλά και από τον Θεό να είναι ένα όραμα, πρέπει να μην το δέχεται εξαρχής ο άνθρωπος. Ο Θεός ίσα–ίσα συγκινείται, κατά κάποιον τρόπο, όταν βλέπη το πλάσμα Του να μην το δέχεται, γιατί αυτό δείχνει ότι έχει ταπείνωση. Αν πράγματι ήταν Άγιος αυτός που παρουσιάσθηκε, ο Θεός ξέρει μετά με άλλον τρόπο να πληροφορήση την ψυχή και να την οδηγήση σ᾿ αυτό που θέλει. Χρειάζεται προσοχή, γιατί μπορεί να έρθη το ταγκαλάκι, να πατήση το κουμπί και να αρχίση η τηλεόραση...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ήταν μια ψυχή που δεν είχε βοηθηθή από ανθρώπους, και γι᾿ αυτό δικαιούτο την θεία βοήθεια. Ο Θεός της παρουσίασε κάτι, για να βοηθηθή. Ύστερα όμως ο διάβολος της έβαλε λογισμούς: «Φαίνεται, για να σε αξιώση ο Θεός να δής αυτό το όραμα – ποιός ξέρει; – σε προορίζει για κάτι ανώτερο». Από την στιγμή που πίστεψε κάτι τέτοιο, ο διάβολος άρχισε να κάνη την δουλειά του και την έκανε κουμάντο! Αλλά τελικά ο Θεός πάλι την λυπήθηκε. Είδε ένα όραμα και άκουσε μια φωνή να της λέη: «Να γράψης όλα τα οράματα που είδες στον πατέρα Παΐσιο». Έτσι μου έγραψε ένα γράμμα με όλα τα οράματα που είδε. Ο πειρασμός την είχε αλωνίσει. Πραγματικά οράματα, αλλά όλα ήταν του πειρασμού. Από όλα τα οράματα που μου ανέφερε, μόνον το πρώτο και το τελευταίο ήταν από τον Θεό. Το τελευταίο το επέτρεψε ο Θεός, για να την φέρη σε λογαριασμό, να την βοηθήση να απαλλαγή από την πλάνη. Τελικά η καημένη άκουσε τί της είπα και ξέμπλεξε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Χαρακτηριστικά του πλανεμένου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορείς να καταλάβης ότι κάποιος είναι πλανεμένος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ακόμη και από την όψη του μπορείς να το καταλάβης. Ο πλανεμένος παρουσιάζει μία εξωτερική ψεύτικη απάθεια. Φαίνεται ταπεινός και πράος, αλλά μέσα του κρύβει την μεγάλη ιδέα που έχει για τον εαυτό του. Αν κοιτάξετε τα μάτια του, θα δήτε ότι βλέπει τους άλλους ταλαίπωρους, σαν μυρμήγκια. Μπορείς όμως να τον καταλάβης και από αυτά που λέει. Ήταν ένας πλανεμένος, που πολύς κόσμος τον είχε για άγιο. Έλεγε ότι του είχε παρουσιασθή ο Χριστός καβάλα σε ένα άλογο, κρατώντας ένα φλασκί με κρασί, τον κέρασε από αυτό και από τότε απέκτησε το διορατικό χάρισμα! Μια φορά που μιλούσε στον κόσμο, κάποιος τον ρώτησε: «Γιατί δεν μπορώ να κάνω κι εγώ θαύματα;». «Γιατί εσύ έκανες εκείνη κι εκείνη την αμαρτία...», του απάντησε. Πανικοβλήθηκε ο καημένος και ήρθε να μου το πή. «Καλά, του λέω, οι Άγιοι θεατρίζουν ποτέ τους ανθρώπους; Μόνον ο διάβολος θεατρίζει. Δεν καταλαβαίνεις ότι ο διάβολος μιλάει; Και αν είναι αληθινά αυτά που λέει ο πλανεμένος, πάλι ο διάβολος τα λέει». Μια γυναίκα μου είπε ότι είχαν πάει μια δαιμονισμένη σε κάποιον, για τον οποίο είχαν ακούσει ότι έβγαζε δαιμόνια κ.λπ. Αυτός τους πήρε και τους πήγε σε ένα χαλασμένο εξωκκλήσι. Μόλις μπήκαν στο εκκλησάκι, πήρε ένα επιτραχήλι και το φόρεσε. Παραξενεύτηκε η γυναίκα! Λαϊκός και να φορέση επιτραχήλι! «Είσαι παπάς;», του λέει. «Τί θα πη παπάδες!», λέει αυτός και άρχισε να κατηγορή τους ιερείς. Έτσι κατάλαβαν οι καημένοι την πλάνη του και σηκώθηκαν και έφυγαν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Πλάνη και τρέλλα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο πλανεμένος είναι και τρελλός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι πάντα. Άλλο πλάνη, άλλο τρέλλα. Μερικοί μόνον πλανώνται, και άλλοι πλανώνται, αλλά παθαίνει και το μυαλό τους. Είχα γνωρίσει έναν μοναχό στο Άγιον Όρος που δεν άκουγε κανέναν. Είχε φύγει από το μοναστήρι του και γύριζε μέσα στο Όρος. Τέσσερις-πέντε φορές είχε πάει δήθεν να ασκητέψη και τον συμβούλεψα να γυρίση στην μετάνοιά[106]του. Τελικά αγόρασε ένα Καλύβι[107]και έμενε μόνος του. Μετά από επτά μήνες ήρθε και με βρήκε. «Να γυρίσης, του λέω, στο μοναστήρι σου». «Τώρα, μου λέει, πήρα απολυτήριο από το μοναστήρι· δεν με δέχονται εκεί». «Πρόσεξε, πρόσεξε πολύ, του λέω. Τουλάχιστον κοίτα να συνδεθής με κανέναν Γέροντα, για να κάνης υπακοή και να μη ζής στο θέλημά σου». «Υπακοή στο θέλημα του Θεού θα κάνω», μου λέει. «Σήκω, του λέω, να πάς σε μοναστήρι». «Εγώ, ερημίτης τώρα, να γυρίσω πίσω; Να πάς εσύ», μου λέει. «Εγώ να πάω μόνος μου; Αν θέλης να πάω μαζί σου, να το κάνω με όλη μου την καρδιά», του λέω. «Άκου εδώ, μου λέει, αν βαρέθηκες εσύ την ησυχία και θές να πάς σε μοναστήρι, να πάς». Όταν είδα να φέρεται έτσι, με αναίδεια, τον άφησα κι εγώ. Μετά από λίγο καιρό έμαθα ότι δαιμονίσθηκε, αλλά και τρελλάθηκε. Του είχε παρουσιασθή ο διάβολος σαν την Παναγία και του είπε: «Τέκνον μου, άμα πέσης να με προσκυνήσης, θα σού δώσω τα επτά χαρίσματα του Αγίου Πνεύματος...». Οπότε σκέφθηκε: «θά πάρω τώρα τα επτά χαρίσματα και θα τους βάλω όλους κάτω» και πέφτει, τον προσκυνάει. Μόλις προσκύνησε, τον τράνταξε ο διάβολος και δαιμονίσθηκε. Με το τράνταγμα όμως που του έκανε, σάλεψαν και τα λογικά του. Πήγε μετά στην Ιερά Κοινότητα[108], να γίνη Πρωτεπιστάτης! Κλείδωσε μέσα τους πατέρες που ήταν εκεί, πήρε την ράβδο του Πρωτεπιστάτη και κατέβαινε καμαρωτός τα σκαλιά. Βλέπουν οι άλλοι απ᾿ έξω άλλον Πρωτεπιστάτη να κατεβαίνη!... Με τρόπο τον ακολούθησαν με ένα τζίπ και πιο κάτω τον πήραν μαζί τους και τον κατέβασαν στο ψυχιατρείο. Τώρα έχει υποχωρήσει το δαιμόνιο, αλλά η τρέλλα μένει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και ο πλανεμένος, Γέροντα, δεν είναι κατά κάποιον τρόπο δαιμονισμένος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, τί είναι; Μπορεί μάλιστα ο πλανεμένος να έχη και περισσότερα δαιμόνια από έναν δαιμονισμένο. Άλλο  όμως πλανεμένος, άλλο δαιμονισμένος.
- type: h2
  initial:
    ru: ''
  text:
    ru: Προσοχή στους πλανεμένους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι δυό-τρείς πνευματικοί που έχουν λίγη ευλάβεια και λίγη βλάβη μαζί και μπερδεύουν τον κόσμο. Και όλους τους βγάζουν δαιμονισμένους. Δεν ακούνε κανέναν. «Είμαι παπάς, λένε, έχω εξουσία»! Αν σάς λένε για τέτοιες περιπτώσεις, να προβληματίζετε τους ανθρώπους, γιατί κάνουν κακό στην Εκκλησία. Να τους λέτε: «Να βρήτε έναν σωστό πνευματικό να πάτε, για να βοηθηθήτε». Φθάνουν στο σημείο να χρησιμοποιούν το όνομά μου, ακόμη και φωτογραφία μου, για να δίνουν την εντύπωση στον κόσμο ότι έχουν επικοινωνία μαζί μου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτοί βέβαια έχουν ελαφρυντικά, γιατί είναι ελαφρούτσικοι. Υπάρχουν όμως κάποια κακοήθη στοιχεία που παρουσιάζουν το ξίδι για κρασί. Ένας έκανε τον λογιστή πρώτα, κάπου δούλευε, αλλά τώρα γυρίζει όλη την βόρεια Ελλάδα και παρουσιάζεται ότι είναι υποτακτικός μου. Λέει ότι του έδωσα το διορατικό και άλλα τέσσερα-πέντε χαρίσματα, και έτσι πλανά τον κόσμο και μαζεύει χρήματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κληρικός είναι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, λαϊκός. Με είδε μια φορά στην Δάφνη και κρύφθηκε, για να μην τον δώ, επειδή είναι... γνήσιο τέκνο μου! Ευτυχώς πίνει, μυρίζει ούζο, τον βλέπουν μερικοί ζαλισμένο, και λίγο προβληματίζονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσοι τέτοιοι απατεώνες υπάρχουν που εκμεταλλεύονται τον πόνο του κόσμου και κάνουν εμπόριο! Είπε κάποιος σε μια χήρα γυναίκα: «Το ένα χέρι του ανδρός σου δεν έχει λειώσει, γιατί η ψυχή του έχει ανάγκη από προσευχή». «Τί να κάνω τώρα; λέει η φουκαριάρα. Ας του δώσω χρήματα, για να προσευχηθή για την ψυχή του ανδρός μου». Αφού της πήρε αρκετά χρήματα, μετά από λίγο της λέει: «Άντε, αποφύγαμε τον πρώτο κίνδυνο, τώρα είναι λίγο καλύτερα...». Δώσ᾿ του-δώσ᾿ του χρήματα, της πήρε την μισή περιουσία, για να βρη ανάπαυση ο άνδρας της!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι και μερικοί πλανεμένοι που σταυρώνουν αρρώστους, μουρμουρίζοντας κάτι, και δήθεν τους κάνουν καλά. Ξεγελιούνται οι άνθρωποι και δεν πάνε να εξομολογηθούν, να πάρουν τον παπά να κάνουν ένα ευχέλαιο ή να τους διαβάση μια ευχή, αλλά πάνε σ᾿ αυτούς. Δίνουν εν τω μεταξύ και ένα σωρό χρήματα. Μου είπαν ότι σε ένα χωριό ήταν δυο πλανεμένοι που είχαν καλή συνεργασία!... Έφερνε ο διάβολος σε κάποιον συγχωριανό τους λ.χ. έναν δυνατό πονοκέφαλο ή προκαλούσε ένα πιάσιμο στην μέση και μετά πήγαινε στον έναν πλανεμένο και του έλεγε: «Ο τάδε έχει δυνατό πονοκέφαλο για τον τάδε λόγο». Σε κάποια ευκαιρία έλεγε στον συγχωριανό του ο πλανεμένος: «εγώ ξέρω γιατί σού πονάει το κεφάλι» και του φανέρωνε αμέσως την αιτία. «Αλήθεια, τί αποκάλυψη! έλεγε εκείνος. Και τώρα, τί πρέπει να κάνω, για να μου περάση;». «Να πάς στον τάδε», του έλεγε και τον έστελνε στον άλλον πλανεμένο. Είδατε τί σοφίσθηκε ο διάβολος, για να κρατάη τους ανθρώπους στην πλάνη; Έβαλε δυο πλανεμένους να συνεργασθούν, ο ένας να κάνη την διάγνωση και ο άλλος δήθεν να θεραπεύη, για να κρατάη τον κόσμο μακριά από την Εκκλησία.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα φθηνά χαρίσματα των πλανεμένων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί οι άνθρωποι καταφεύγουν για κάποιο πρόβλημά τους συχνά σε πλανεμένους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί ο διάβολος έχει φθηνά τα χαρίσματα και τα παίρνουν εύκολα. Αυτά που τους λένε να κάνουν, δεν είναι δύσκολα και τους αναπαύουν στα πάθη τους. Αντί να μετανοήσουν για τις αμαρτίες που κάνουν ως άνθρωποι και να πάνε σε έναν πνευματικό να εξομολογηθούν, βρίσκουν κάτι πλανεμένους, δηλαδή τον διάβολο, και ζητούν από εκείνον να τους λύση το πρόβλημά τους. Ύστερα βασανίζονται και δεν καταλαβαίνουν ότι τους έχει δέσει ο διάβολος και τους κάνει κουμάντο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς τους πιστεύουν, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Είναι ζαλισμένοι οι άνθρωποι. Πόσοι λένε ότι οδηγούν τους ανθρώπους στον σωστό δρόμο, ενώ κουβαλούν στον ώμο τους ένα τσουβάλι και έχουν κρυμμένο μέσα τον διάβολο! Ο Καλός Θεός όμως δεν τον αφήνει να κρυφθή τελείως. Καμμιά φορά βγάζει ο διάβολος κάποιο κέρατο ή την ουρά του, τα βλέπουν οι άνθρωποι και φωνάζουν τρομαγμένοι: «Τί είναι αυτό; Κέρατο; Ουρά;». «Όχι, τί λέτε; Μελιτζάνα είναι!», τους λένε εκείνοι, για να τους εξαπατήσουν και να παρουσιάσουν διαβολικά πράγματα για καλά και ωφέλιμα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Κι εδώ μια μέρα ήρθε κάποιος με μια συντροφιά που ήταν πλανεμένος. Είχε μαζί του καμμιά δεκαριά άτομα και έκανε τον Γέροντα. Τους ρωτάω: «Ανήκετε σε καμμιά οργάνωση;». Δεν απαντούσαν. «Σε κανέναν σύλλογο;». Δεν απαντούσαν. «Έχετε κανέναν πνευματικό;». Τίποτε. Άρχισαν, έβαζαν μετάνοιες. Τους έφερε εδώ, για να τους πλανάη. Να λέη μετά: «πήγαμε και στον πατέρα Παΐσιο και συμφωνεί μαζί μας»! Κατάλαβες; Δεν έπρεπε να τον δώ, γιατί το εκμεταλλεύεται μετά. Φαινόταν ύποπτος εκείνος. Οι οπαδοί του φαίνονταν παρασυρμένοι. Οι καημένοι έπεσαν κάτω, γονατιστοί.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τους είπατε τίποτε, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τους είπα, αλλά ο πονηρός, όταν φεύγουν από ᾿δώ, τους λέει άλλα· από ᾿δώ-από ᾿κεί τους πάει, και τους φέρνει πάλι στον δρόμο του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς θα προφυλαχθή, Γέροντα, κανείς από τους πλανεμένους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μένοντας μέσα στην μάνδρα της Εκκλησίας μας. Βέβαια, αν κάποιος ακολουθήση από άγνοια έναν πλανεμένο, δεν θα τον αφήση ο Θεός. Θα τον βοηθήση να καταλάβη το λάθος του και να επιστρέψη στην αλήθεια.
- type: h2
  initial:
    ru: ''
  text:
    ru: Διόρθωση πλανεμένου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί βοηθάει να συνέλθη ένας που έχει πλανεμένες ιδέες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να συναισθανθή τα χάλια του, να μην πιστεύη καθόλου στον λογισμό του, να εξομολογήται στον πνευματικό όλους τους λογισμούς του και να κάνη υπακοή σε ό,τι του λέει ο πνευματικός. Να ζητά συνέχεια το έλεος του Θεού, για να έρθη πάλι η θεία Χάρις. Δηλαδή χρειάζεται να ταπεινωθή, για να συνέλθη και να σωθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπεις, τα κρίματα, οι βουλές, του Θεού είναι άβυσσος. Πά πά πά..., η αγάπη Του δεν έχει όρια! Κάποιος ερχόταν συχνά εκεί στο Καλύβι και είχε όλο πλανεμένες ιδέες. Τόσα του έλεγα, τίποτε δεν άκουγε. Όλα τα έπαιρνε ανάποδα. Όταν έβγαινε από το Άγιον Όρος, έκανε κηρύγματα και έκανε πολύ κακό. Έλεγε ότι έπαιρνε εντολές από μένα και μπέρδευε τους ανθρώπους. Ακόμη και κάτι βιβλία που του είχα δώσει κάποτε ευλογία, τα παρουσίαζε και αυτά, για να πιστεύουν οι άνθρωποι ότι με συμβουλευόταν. Μια φορά, ενώ έλεγε διάφορα, για μια στιγμή τον εγκατέλειψε τελείως η θεία Χάρις και άρχισε να βρίζη πολύ άσχημα τον Χριστό και την Παναγία, οπότε ο κόσμος προβληματίσθηκε και σκόρπισε. Ύστερα τον πήραν με την κλούβα και τον έκλεισαν στο ψυχιατρείο. Βλέπετε μέχρι που φθάνει η αγάπη του Θεού! Να αφήνη να βλασφημήται το όνομά Του, αρκεί να βοηθηθούν, να γλυτώσουν τα πλάσματά Του!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν ένας πλανεμένος καταλάβη την πλάνη του και μετανοιώση, θα μετανοιώσουν και οι οπαδοί του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν έχη πραγματική μετάνοια, πρέπει να ταπεινωθή και να τους πη ότι έσφαλε και να προσπαθήση να τους επαναφέρη στον σωστό δρόμο. Αν όμως αποκαλυφθούν οι πλάνες κάποιου πλανεμένου και ο ίδιος παραμένη στην πλάνη, τότε χρειάζεται να διαφωτισθούν με τρόπο οι οπαδοί του. Επειδή μερικοί πλανεμένοι φθάνουν να δρούν μέσα στην Εκκλησία, υπάρχει φόβος, αν οι οπαδοί τους μάθουν ξαφνικά ότι όσα τους έλεγαν ήταν πλάνες, να σκανδαλισθούν και να ξερριζωθούν και από την Εκκλησία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 4 – «Πλανώντες και πλανώμενοι»[109]
- type: h2
  initial:
    ru: ''
  text:
    ru: Για την πλάνη των Πεντηκοστιανών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: έροντα, αυτά που λένε όσοι προσχωρούν στους   Πεντηκοστιανούς, ότι δηλαδή βλέπουν οράματα, μιλούν γλώσσες κ.λπ., είναι από φαντασία ή από δαιμονική ενέργεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Από δαιμονική ενέργεια είναι. Γιατί, όταν πηγαίνουν στους Πεντηκοστιανούς και ξαναβαπτίζωνται, περιφρονούν, αρνούνται το Άγιο Βάπτισμα – «ομολογώ έν Βάπτισμα εις άφεσιν αμαρτιών», λέει το Σύμβολο της Πίστεως –, οπότε ξεβαπτίζονται, δέχονται δαιμονικές επιδράσεις και μιλούν βρρρ..., δήθεν γλώσσες. «Μιλάει, λένε, το Άγιο Πνεύμα της Πεντηκοστής». Δεν είναι το Άγιο Πνεύμα· είναι ένα σωρό ακάθαρτα πνεύματα. Τί γλωσσολαλιές; Ασυναρτησίες είναι αυτά που λένε· ούτε οι ίδιοι τα καταλαβαίνουν. Τα μαγνητοφωνούν κιόλας και ύστερα κάνουν στατιστικές και βγάζουν συμπεράσματα: «Έχει τόσα «αλληλούια» στην τάδε γλώσσα, τόσα στην τάδε...». Μά μέσα στα τόσα «βρρρ...» κάτι θα βρής που να μοιάζη και με «αλληλούια» σε κάποια από τις γλώσσες του κόσμου! Και βλέπεις, ενώ είναι κάτι δαιμονικό, αυτόν τον δαιμονισμό τον θεωρούν ενέργεια του Αγίου Πνεύματος και λένε πώς ζουν ό,τι έζησαν και οι Απόστολοι την ημέρα της Πεντηκοστής. Είναι βλασφημίες αυτά που πιστεύουν, γι᾿ αυτό δαιμονίζονται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ξαναβαπτίζονται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί λένε: «Όταν βαπτίσθηκα, ήμουν μικρός και δεν ήξερα· τώρα βαπτίζομαι εν γνώσει μου». Ξαναβαπτίζονται και δικαιολογούν τις αμαρτίες τους. Αν η Εκκλησία δεν είχε τον νηπιοβαπτισμό, όσοι θα πέθαιναν, πριν βαπτισθούν, τί θα γίνονταν; Γι᾿ αυτό γίνεται ο νουνός εγγυητής, λέει το Σύμβολο της Πίστεως και έχει ευθύνη για το παιδάκι, ώσπου να μεγαλώση. Μήπως αδικείται που βαπτίζεται μικρό; Όχι, ίσα-ίσα βοηθιέται, γιατί κοινωνάει. Και όταν μεγαλώση, αν μολύνη το Άγιο Βάπτισμα με κάποια αμαρτία, υπάρχει η μετάνοια και η εξομολόγηση που θα ξεπλύνουν αυτήν την αμαρτία, όχι να πάη να βαπτισθή ξανά!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Για τα αναστενάρια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, λένε ότι οι αναστενάρηδες, στην γιορτή του Αγίου Κωνσταντίνου, πατούν σε αναμμένα κάρβουνα και δεν καίγονται. Τί είναι αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και δαιμονικό είναι και απατεωνία. Το ότι χορεύουν κρατώντας κάποια εικόνα ή τον σταυρό είναι αναίδεια, είναι άρνηση πίστεως. Απομακρύνεται η Χάρις του Θεού, γι᾿ αυτό τους βοηθάει ο διάβολος. Είναι δυνατόν να μην τους βοηθήση ο διάβολος μετά; Δικαιούνται την βοήθειά του!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά είναι και η δική τους πονηριά που βοηθάει. Αυτοί πηγαίνουν προηγουμένως και ετοιμάζουν τον τόπο. Καίνε δηλαδή ξύλα από πλατάνια που αφήνουν πολλή στάχτη και ξέρουν που πατούν, όταν χορεύουν. Γιατί δεν καίνε πουρνάρια ή κουμαριές που κρατάνε κάρβουνο; Ας τους ετοιμάση άλλος την φωτιά και ας πάνε μετά εκεί να χορέψουν!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου είπε κάποιος: «Θαύμα! Οι αναστενάρηδες πατούν στην φωτιά και δεν καίγονται». «Αυτό θαυμάζεις; του είπα. Οι δαίμονες είναι μέσα στην φωτιά της κολάσεως και δεν καίγονται χρόνια, αιώνες τώρα. Αυτό να θαυμάζης, και όχι αυτούς που πατούν λίγο πάνω στα κάρβουνα και στην στάχτη, χωρίς να καίγωνται».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η μετεμψύχωση[110]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μερικοί άνθρωποι, ακόμη και μορφωμένοι, πιστεύουν στην μετεμψύχωση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η μετεμψύχωση βολεύει τους ανθρώπους, και ειδικά τους αθέους, τους απίστους. Είναι η μεγαλύτερη πονηριά του διαβόλου. Τους κρατά ο διάβολος στην ζωή της αμαρτίας, με τον λογισμό ότι η ψυχή έρχεται και ξανάρχεται σε αυτόν τον κόσμο. «Έ, και αυτήν την φορά αν δεν πετύχης, τους λέει ο διάβολος, θα ξαναρθής στην ζωή και θα πετύχης την επόμενη φορά· και αν πάλι δεν πετύχης, θα ᾿ρθής, θα ξαναρθής, θα εξελιχθής...»! Οπότε και αυτοί λένε: «δέν πειράζει κι αν κάνω και αυτήν την αμαρτία» και το ρίχνουν έξω· ζουν απρόσεκτα, δεν μετανοούν. Βλέπεις πώς τους τυφλώνει ο διάβολος και τους γαντζώνει στην κόλαση! Δεν έχω δει μεγαλύτερη πονηριά και τέχνη του διαβόλου, για να μαζεύη τους ανθρώπους στην κόλαση! Κι αν σε γαντζώση μια φορά ο διάβολος, θα σ᾿ αφήση να γυρίσης πίσω; Αυτή είναι η χειρότερη θεωρία από όλες τις ινδουϊστικές θεωρίες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κάποτε, αργά το απόγευμα, πέρασε από το Καλύβι ένας νεαρός. «Τέτοια ώρα, παλληκάρι, θέλω να διαβάσω και εσπερινό», του λέω. «Μ᾿ αυτά ασχολείσαι ακόμη;» μου είπε και έφυγε. Την άλλη μέρα ξαναήρθε και μου έλεγε για κάτι οράματα. «Είχες πάρει προηγουμένως καθόλου χασίς;», τον ρωτάω. «Παλιά, ναί. Τότε όμως που είδα τα οράματα, δεν είχα πάρει», μου λέει. «Μήπως διάβασες για μετεμψύχωση;». «Ναί», μου λέει. Εκεί την έπαθε. Διάβασε για μετεμψύχωση, μπήκε ο εγωισμός μέσα και έπλασε όνειρα ότι πριν από χιλιάδες χρόνια ήταν μεγάλος άνθρωπος, πλούσιος! Είδε μετά σε όραμα ότι πήγε επάνω στον ουρανό, αλλά δεν τον είχαν γραμμένο εκεί και του είπαν να κατεβή. Ο διάβολος του δημιούργησε αυτήν την κατάσταση. «Όλα αυτά, του λέω, είναι παραμύθια κι εσύ τα πιστεύεις;».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και δυστυχώς υπάρχουν και μορφωμένοι άνθρωποι που πιστεύουν σε τέτοιες χαζομάρες. Εκεί κοντά στο Καλύβι έναν γάιδαρο τον είχα ονομάσει Νασέρ, επειδή ήταν ζωηρός. Μια μέρα ήρθε ένας Έλληνας που ζούσε στην Ελβετία και άκουσε που τον φώναζα Νασέρ. Όταν μετά από ένα διάστημα ξαναήρθε, έφερε ένα κουτί με απλά γλυκά και ένα με επίσημα. «Αυτά είναι για σένα», μου είπε και μου έδωσε τα απλά γλυκά. «Αυτά τα καλά γλυκά, μου λέει, είναι για τον Νασέρ. Εγώ κατάλαβα, λέει, από την προηγούμενη φορά ότι ήταν ο Νασέρ. Όταν τον συνάντησα, με κοίταξε με ένα θλιμμένο βλέμμα που μου ράγισε την καρδιά»! Νόμιζε ότι ο Νασέρ μετεμψυχώθηκε και έγινε γάιδαρος! Και το πίστευε! «Βρέ, είσαι στα καλά σου; του λέω. Εγώ τον είπα Νασέρ, γιατί ήταν ζωηρός γάιδαρος». Με κανέναν τρόπο δεν καταλάβαινε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και αυτό δεν είναι τίποτε! Να σάς πω ένα άλλο: Πριν από χρόνια είχαν πάει Γερμανοί στην Κρήτη, για να κάνουν ένα μνημόσυνο για τους Γερμανούς που είχαν σκοτωθή εκεί στην Κατοχή. Την ώρα που έκαναν το μνημόσυνο περνούσε ένας Κρητικός με τον γάιδαρό του φορτωμένο με τις πραμάτειες του. Ο γάιδαρος, όταν είδε τους ανθρώπους εκεί μαζεμένους, άρχισε να γκαρίζη. Ένας από τους Γερμανούς νόμιζε ότι ο γάιδαρος ήταν ο αδελφός του που είχε σκοτωθή στον πόλεμο και μετεμψυχώθηκε! Τον γνώρισε και τον χαιρέτισε με το γκάρισμα! Και ο Γερμανός στάθηκε προσοχή, και τάκ, τον χαιρέτισε στρατιωτικά... Κλάματα!... Πάει αμέσως στον Κρητικό και του λέει: «Πόσα θέλεις, για να τον αγοράσω;». «Βρέ, φύγε από ᾿δώ», του λέει ο Κρητικός. Ο Γερμανός του μετρούσε τα μάρκα: «τόσα, τόσα». «Φύγε, άσε με», έλεγε εκείνος. Τελικά του λέει κάποιος: «Βρέ χαμένε, τον πληρώνει τον γάιδαρο για μερσεντές, δώσ᾿ τον». Ξεφόρτωσε τα πράγματά του ο Κρητικός, τον ξεσαμάρωσε, τον ελευθέρωσε, και τον πήρε ο Γερμανός με βουρκωμένα μάτια και τον πήγε στην Γερμανία!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σοβαρά, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γεγονός! Αν δεν το είχα ακούσει από σοβαρό άνθρωπο, δεν θα το πίστευα κι εγώ.
- type: h2
  initial:
    ru: ''
  text:
    ru: Για την άσκηση των Ινδουϊστών[111]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι Ινδουϊστές φθάνουν σε κάποια αυτοκυριαρχία, γιατί τους βοηθάει η μεγάλη άσκηση που κάνουν με την γιόγκα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάνουν και κάνουν και τί πετυχαίνουν με όλα αυτά; Η ορθόδοξη εγκράτεια, και γενικά η πνευματική άσκηση, αποβλέπει πάντα σε ανώτερο πνευματικό σκοπό, στον αγιασμό της ψυχής. Η δική τους σατανική κοσμική άσκηση γίνεται, για να κάνουν ευλύγιστο κορμί, να γυρίζουν χέρια και πόδια σαν τον χάρτινο Καραγκιόζη, να τους καμαρώνουν μερικοί ανόητοι άνθρωποι και να τους κοροϊδεύουν οι γελοίοι δαίμονες. Από μικρά παιδάκια στραβώνουν τα πόδια, βάζουν το ένα πόδι πάνω στον έναν ώμο και το άλλο στον άλλον, και έτσι προσεύχονται. Ασκούνται χτυπώντας πολλή ώρα το χέρι τους πάνω σε ένα τσουβάλι με χαλίκι, μέχρι να κάνη κάλο, και μετά μπορούν να σπάσουν πέτρες, ξύλα κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αλλά, και όσα λένε ότι αισθάνονται, έχουν κάποια εξήγηση. Τραβούν λ.χ. την γλώσσα μέχρι την μύτη ή την ρουφούν μέχρι τον λάρυγγα, παθαίνουν έναν ερεθισμό, νιώθουν κάποια γλυκύτητα, έναν γαργαλισμό, και λένε: «Αυτό είναι το νέκταρ». Ύστερα πατούν κοντά στα αυτιά κάτι νεύρα και ακούνε «βούου...» μουσική. Ή πατούν τα μάτια τους και αρχίζουν να βλέπουν αστράκια! Κάθονται με ανοιχτά τα μάτια στον ήλιο καί, όταν τα κλείνουν, βλέπουν φώς! «Νά, το πετύχαμε! λένε. Είδαμε το άκτιστο φώς!». Οπότε ο διάβολος λέει: «Ά, φώτα θέλετε; Θα σάς δώσω εγώ φώτα». Τους καλλιεργεί την φαντασία, και ύστερα, χωρίς να πατούν τα μάτια ή χωρίς να τα κρατούν ανοιχτά στον ήλιο, βλέπουν φώτα.  Εμάς ο διάβολος, χωρίς να τον προκαλέσουμε, προσπαθεί πολλές φορές να μας πλανήση, μας παρουσιάζει φώτα κ.λπ., αλλά του γυρίζουμε την πλάτη, πόσο μάλλον να τον προκαλέσης! Αφορμή θέλει!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, τους παρουσιάζει ο διάβολος διάφορες παραστάσεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, τους καλλιεργεί την φαντασία σε μεγάλο βαθμό και μετά τους πλανάει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πηγαίνουν και μερικοί δικοί μας στους Ινδούς, τους μαθαίνουν οι Ινδοί να λένε κάτι βρισιές στην γλώσσα τους για τον Χριστό, για την Παναγία, για τους Αγίους – άλλοι ξέρουν ότι αυτά είναι βλασφημίες, άλλοι δεν ξέρουν – και δαιμονίζονται. Μετά αρχίζουν να λένε άρρητα ρήματα. Φθάνουν σε μια έξαλλη κατάσταση και οι άλλοι που τους βλέπουν νομίζουν ότι βρίσκονται σε πνευματική κατάσταση! Είναι δαιμονική κατάσταση αυτή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Έχει κάνει μεγάλη ζημιά ο Ινδουϊσμός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι Ινδοί, ενώ είναι έξυπνος λαός, ενώ έχουν μεταφυσικές ανησυχίες και πολλή καρδιά, ασχολούνται με την δήθεν φιλοσοφία, με πλάνες και με μαγείες. Τους Ευρωπαίους τους αλωνίζουν με τις θεωρίες τους. Και βλέπεις, οι αρχηγοί τους είναι σαν ταύροι και οι άλλοι εκεί στις Ινδίες πεθαίνουν από την πείνα! Έρχονται κι εδώ στην Ελλάδα και ξεγελούν τον κόσμο με την νιρβάνα, την τεμπελιά, τις μετεμψυχώσεις... Χρησιμοποιούν εν τω μεταξύ στα βιβλία τους και κομμάτια από την Αγία Γραφή, από την Φιλοκαλία, από τους Πατέρες, και έτσι προσελκύουν τον κόσμο. Παλιά, που να πιστέψουν οι Ορθόδοξοι τις ινδουϊστικές θεωρίες! Τώρα, πώς να το πη κανείς, και μερικοί σωστοί άνθρωποι υποστηρίζουν τέτοιες ανοησίες και δίνουν του κόσμου τα χρήματα. Έχει κάνει μεγάλη ζημιά ο Ινδουϊσμός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Υπάρχουν, Γέροντα, Ινδοί που είναι Ορθόδοξοι Χριστιανοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πολύ λίγοι. Είχαν μείνει μερικοί από την Εκκλησία που είχε ιδρύσει εκεί ο Απόστολος Θωμάς, αλλά εγκαταλείφθηκαν. Άλλοι έγιναν Καθολικοί, άλλοι Προτεστάντες. Σήμερα εκεί οι Ορθόδοξοι είναι μετρημένοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αυτά που παρουσιάζουν ως θαύματα οι άλλες θρησκείες ή οι παραθρησκείες δεν έχουν καμμιά σχέση με τα θαύματα της δικής μας θρησκείας. Ο Χριστός ζητάει από μας το φιλότιμο. Δεν θέλει να Τον αγαπάμε, επειδή είναι παντοδύναμος. Αν ήθελε, μπορούσε να κάνη κάποιο θαύμα και να πιστέψη αμέσως όλος ο κόσμος. Με αυτόν όμως τον τρόπο θα δέσμευε την ελευθερία του ανθρώπου. Γι᾿ αυτό λέει: «Μακάριοι οι μη ιδόντες και πιστεύσαντες»[112].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Ορθοδοξία έχει το θαύμα και την θεία Χάρη. Ο Ινδουϊσμός έχει την μαγεία και την φιλοσοφία. Αντικαθιστά το θαύμα με την μαγεία και την θεία Χάρη με την φιλοσοφία. Ο διάβολος δίνει στους γκουρού, στους μάγους κ.λπ. δυνάμεις, επειδή του δίνουν δικαιώματα. Έτσι μπορούν να κάνουν κάτι δήθεν θαύματα, και ο άλλος που τους βλέπει τους θαυμάζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Από την στιγμή που βλέπει κάποιος ότι αυτός που κάνει αυτά τα ψευτοθαύματα δεν συγγενεύει καθόλου με τον Χριστό, πρέπει να καταλάβη ότι όσα κάνει είναι απάτη του διαβόλου, που δεν ξέρει να λέη ποτέ αλήθεια αλλά όλο ψέματα και να ξεγελάη τα πλάσματα του Θεού. Όσοι έχουν καλή διάθεση, όταν προηγουμένως έχουν γνωρίσει λίγο την Ορθοδοξία, προβληματίζονται, γιατί βλέπουν ότι η ζωή των μάγων δεν είναι καθαρή, είναι μπερδεμένη, ενώ στην Ορθοδοξία βρίσκουν ζωή καθαρή και ανωτερότητα. Βρίσκουν ανθρώπους που έχουν αγιότητα και κάνουν αληθινά θαύματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην Ορθοδοξία η καλωσύνη είναι το ξεχείλισμα της αγάπης του ανθρώπου προς τον Θεό και προς τον πλησίον. Όλες οι άλλες καλωσύνες που γίνονται από αλλοδόξους, πλανεμένους κ.λπ. δεν έχουν τα πνευματικά εν Χριστώ στοιχεία, αλλά μπορεί να έχουν κάποια καλά ανθρώπινα στοιχεία. Όποιος ζη σωστά την ορθόδοξη ζωή έχει ταπείνωση, αγάπη και δίνεται ολόκληρος για τον πλησίον, θυσιάζεται. Και την άσκηση, την νηστεία, την αγρυπνία που κάνει, πάλι τα κάνει από αγάπη προς τον Θεό, όχι για να νιώση κάποια ευχαρίστηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Χριστός ήρθε στον κόσμο, για να σταυρωθή από αγάπη για το πλάσμα Του. Πρώτα σταυρώθηκε και μετά αναστήθηκε. Είναι φθηνό να ζητάη κανείς πνευματικές χαρές – άλλο αν ο Χριστός του δώση να γευθή την ουράνια γλυκύτητα. Ενώ αυτοί που ασχολούνται λ.χ. με τις ινδουϊστικές φιλοσοφίες, με την γιόγκα κ.λπ., με όσα κάνουν, αποβλέπουν στο να φθάσουν σε μια δήθεν πνευματική κατάσταση, σε έκσταση, να νιώσουν μια ηδονή ή να γίνουν ανώτεροι από τους άλλους, χωρίς να ενδιαφέρωνται για τους άλλους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ας υποθέσουμε ότι ένας ινδουϊστής βρίσκεται σε μια ακροθαλασσιά και κάνει αυτοσυγκέντρωση. Αν εκείνη την ώρα κινδυνεύη κάποιος στην θάλασσα και ζητάη βοήθεια, αυτός θα μείνη τελείως αδιάφορος, δεν θα κουνηθή από την θέση του, για να μη στερηθή την ηδονή που νιώθει. Ενώ, αν βρισκόταν εκεί ένας ορθόδοξος μοναχός και έλεγε την ευχή, θα άφηνε το κομποσχοίνι και θα έπεφτε στην θάλασσα, για να τον σώση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η παραπλάνηση των ανθρώπων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν έρθουν ο Προφήτης Ηλίας και ο Ενώχ, για να κηρύξουν μετάνοια, ο κόσμος θα καταλάβη, για να συνέλθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτοί που θα έχουν καλή διάθεση, θα καταλάβουν. Αυτοί που δεν θα έχουν καλή διάθεση, δεν θα καταλάβουν και θα πλανηθούν. Ο Χριστός μας προειδοποίησε ότι πρέπει να προσέχουμε πολύ, γιατί «εγερθήσονται ψευδόχριστοι και ψευδοπροφήται και δώσουσι σημεία και τέρατα προς το αποπλανάν, ει δυνατόν, και τους εκλεκτούς»[113].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι μερικοί που κάτι πλανεμένους τους περνούν για προφήτες. Πριν από μερικά χρόνια ένας Προτεστάντης γύριζε συνέχεια με μια βαλίτσα πέτσινη που είχε μια επιγραφή γραμμένη στα αγγλικά: «Είμαι ο Προφήτης Ηλίας!». Φορούσε ένα πουκάμισο με κοντά μανίκια, είχε και μια Αγία Γραφή στα αγγλικά και έλεγε ότι κατέβηκε από τον ουρανό! Όταν τον ρώτησαν τί πιστεύει και σε ποιά θρησκεία ανήκει, είπε: «Έ, τώρα αυτά είναι χαμένα. Δεν υπήρχαν τότε θρησκείες!». Κατάλαβες; Αφού όλοι, Καθολικοί, Προτεστάντες, Πεντηκοστιανοί, όλες οι αιρέσεις και όλες οι παραφυάδες των αιρέσεων είναι γι᾿ αυτόν το ίδιο. Από εκεί δεν καταλαβαίνει κανείς τί γίνεται; Πόσα γράμματα μου έχει στείλει! Έγραφε διάφορα χωρία από την Αγία Γραφή και είχε όλο προτεσταντικές θέσεις. Έστελνε και σε διαφόρους πότε από την Αγγλία πότε από αλλού ένα σωρό γράμματα. Κάποιοι πίστεψαν αυτά που έγραφε και ήθελαν να δημοσιεύσουν σε ένα περιοδικό ότι ήρθε ο Προφήτης Ηλίας. «Μά, είστε καλά; τί πάτε να κάνετε;», τους είπα. Ο κόσμος ο καημένος είναι ζαλισμένος!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αμαρτάνει κανείς, και μόνον όταν ακούη όσα λένε οι πλανεμένοι. Είναι μερικοί που λένε: «Άμα πιστέψης ότι θα γίνη έτσι, θα γίνη». Αυτό είναι πίστη στον εαυτό τους, αλλά πίσω από τον εαυτό τους είναι το ταγκαλάκι. Κάνουν θεό τον εαυτό τους[114]και απογυμνώνονται από την θεία Χάρη. Με κάτι τέτοιες θεωρίες κοιτάζουν να ξεγελάσουν τον κόσμο.Ένας σαρανταπεντάρης παρουσιαζόταν ως απόφοιτος της Σχολής της Χάλκης και έλεγε διάφορες ινδουϊστικές φιλοσοφίες. «Εσύ, του λέω, κάνεις κακό και στον εαυτό σου και στον κόσμο, όταν λές τις εξευγενισμένες βλακείες των Ινδών και συγχρόνως παρουσιάζεσαι ότι τελείωσες την Σχολή της Χάλκης. Πρόσεξε, θα δαιμονισθής».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί οι διάφορες παραθρησκείες στην Ελλάδα επιδιώκουν να παρουσιάζωνται ως σωματεία κ.λπ. και δεν λένε ότι είναι θρησκείες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το κάνουν παραπλανητικά. Και βλέπεις, ενώ ο Άγιος Κωνσταντίνος κατήργησε την ειδωλολατρία και καθιέρωσε ως επίσημη θρησκεία όλης της αυτοκρατορίας τον Χριστιανισμό, σήμερα πάνε να φέρουν πάλι την ειδωλολατρία. Επιτρέπουν να φτιάχνουν τζαμιά, να έχουν οι γκουρούδες τα δικά τους μοναστήρια, να κάνουν ελεύθερα διαλέξεις, να γίνωνται διάφορα κέντρα προσηλυτισμού, οι μασόνοι να δρούν ελεύθερα, οι ιεχωβάδες το ίδιο... Βάλλεται η Ορθοδοξία με ένα σωρό θεωρίες. Αλλά δεν θα σταθούν αυτά· θα σωριασθούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι ταλαίπωροι άνθρωποι παρασύρονται, γιατί έχουν απομακρυνθή από τον Θεό και έχουν φθάσει σε σκότιση! Μου είπαν δυο νέοι ότι πήγαν στην Χεβρών για προσκύνημα και τους έβαλαν το σκουφάκι το εβραϊκό, για να προσκυνήσουν τους τάφους του Αβραάμ. Τί να το κάνης το προσκύνημα, αφού έβαλες αυτό που χρησιμοποιούν οι Εβραίοι στην λατρεία τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τί να πής; Μεγάλη σύγχυση! Στο Παρίσι έξω από μια Ρωμαιοκαθολική Εκκλησία έγραφε: «Διδάσκεται η εξάσκηση της ευχής με την μέθοδο της γιόγκα». Που έφθασαν! Αρχίζουν ύστερα τα ψυχολογικά προβλήματα και παλαβώνουν. Δεν ξέρουν τί ζητούν μετά. Μερικοί Ρωμαιοκαθολικοί, Προτεστάντες κ.λπ. μαθαίνουν ότι, άμα βαπτισθή κανείς στην Ορθόδοξη Εκκλησία, αλλάζει, αναγεννιέται, και νομίζουν πώς, αν βαπτισθούν, θα τους φύγουν τα ψυχολογικά τους προβλήματα. Είπα για κάποιον Προτεστάντη που ήθελε να γίνη Ορθόδοξος: «Κοιτάξτε, μην τον βαπτίζετε αυτόν. Αυτός δεν είναι για βάπτισμα». «Όχι, μου λένε, άμα βαπτισθή, θα βοηθηθή». «Μά δεν είναι για βάπτισμα. Δεν καταλαβαίνετε;». Δεν άκουσαν, τον πήραν, τον πήγαν στην θάλασσα, τον βάπτισαν! Έρχεται μετά από δύο-τρείς μέρες και μου λέει: «Εγώ βαπτίσθηκα, αλλά το Βάπτισμα δεν μου έλυσε τα ψυχολογικά προβλήματα». «Καλά, για να σού φύγουν τα ψυχολογικά προβλήματα βαπτίσθηκες; του λέω. Κοίταξε· αν αισθανόσουν την ανάγκη του Βαπτίσματος, αν καταλάβαινες την αξία του και πήγαινες γι᾿ αυτό το μεγαλείο, τότε θα σού έφευγαν και εκείνα. Αλλά όταν πήγες να βαπτισθής, για να σού φύγουν τα ψυχολογικά προβλήματα, πώς να σού φύγουν; Θα φύγουν με μαγικό τρόπο;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μπερδεύουν την μαγεία με το θαύμα. Δεν μπορούν να ξεχωρίσουν τον χρυσό από τον μπρούντζο. Και βλέπεις, ένας Προτεστάντης λ.χ. μπορεί να βαπτισθή Ορθόδοξος, ύστερα να γίνη Ρωμαιοκαθολικός, μετά να πη «δέν αναπαύτηκα» και να γυρίση πάλι στους Προτεστάντες ή πάλι στους Ορθοδόξους. Κάποιος Καθολικός βαπτίσθηκε Ορθόδοξος, έγινε μοναχός και έζησε εννιά χρόνια σ᾿ ένα μοναστήρι. Έρχεται λοιπόν μια μέρα στο Καλύβι και μου λέει: «Εγώ δεν έζησα την κοσμική ζωή σαν Ορθόδοξος και θέλω να πάω στον κόσμο να παντρευτώ»! Ακούς κουβέντα; Να του λές εν τω μεταξύ πόσο βαρύ είναι αυτό που σκέφτεται και να λέη: «Γιατί είναι βαρύ; Δεν μπορώ να το καταλάβω».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Επιστροφή στην Ορθοδοξία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο σημερινός παράξενος κόσμος στα παράξενα αναπαύεται, όχι στα σωστά. Την Ινδία, που είναι στην άλλη άκρη της γής, την ξέρουν από την μαγεία της και πηγαίνουν. Το Άγιον Όρος, που είναι στην πατρίδα τους, πολύ κοντά τους, με την αληθινή μυστική εν Χριστώ ζωή, το αγνοούν! Ένας φοιτητής μου είπε ότι πήγε στην Ινδία και έμεινε εκεί τριάμισι χρόνια. Έψαχνε να βρη την αλήθεια σχετικά με τις θρησκείες. Τελικά του είπε κάποιος Ινδός: «Τί ήρθες εδώ; Αυτό που ζητάς υπάρχει στην Ορθοδοξία. Εκεί είναι το φώς. Να πάς στο Άγιον Όρος και θα βρής αυτό που ζητάς»[115]. Έτσι επέστρεψε στην Ελλάδα και ήρθε στο Άγιον Όρος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ένας Ορθόδοξος πάη με τους Ινδουϊστές κ.λπ., αν μετανοιώση μετά, γίνεται πάλι δεκτός στην Ορθόδοξη Εκκλησία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτός χρειάζεται μετάνοια μεγάλη και μύρωμα. Αν θελήση να επιστρέψη στην Ορθοδοξία και να γίνη πάλι μέλος της Εκκλησίας, κανονικά πρέπει πρώτα να βεβαιώση με λίβελλο[116]ότι αποκηρύττει τις κακοδοξίες τους και ομολογεί την ορθόδοξη πίστη και ύστερα να του διαβάση ο ιερεύς τις ευχές για τον επιστρέφοντα στην αληθινή πίστη[117]και να τον χρίση με το Άγιο Μύρο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω μερικά νέα παιδιά, Ελληνόπουλα, χωρίς να έχουν διαβάσει ούτε μια γραμμή από το Ευαγγέλιο, πάνε και διαβάζουν Βραχμανισμό, Βουδδισμό, το Κοράνι κ.λπ., πάνε και στους Ινδούς. Ύστερα δεν αναπαύονται και επιστρέφουν στην Ορθοδοξία, αλλά έχουν μαζέψει ένα σωρό μικρόβια. Παθαίνουν ζημιά και είναι δύσκολο να βρουν μετά την αλήθεια. Πρέπει πρώτα κανείς να γνωρίση την Ορθοδοξία, και ύστερα, άμα δεν του αρέση, φεύγει. Ας την γνωρίση σωστά, και μετά ας κάνη σύγκριση με τις διάφορες θεωρίες που ακούει. Γιατί, αν γνωρίση την Ορθοδοξία, μπορεί να ξεχωρίση το μπακίρι από τον χρυσό ή να καταλάβη τον χρυσό πόσων καρατιών είναι. Δεν ξεγελιέται εύκολα, για να περάση όσα γυαλίζουν για χρυσάφι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως έχω προσέξει ότι μόνον εγωιστής άνθρωπος φεύγει από την Ορθοδοξία, όταν την γνωρίση· ένας ταπεινός ποτέ δεν φεύγει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πέμπτο Μέρος – Η Δύναμη Τησ Εξομολογήσεως
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να νιώση κανείς ανάπαυση, πρέπει να πετάξη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τά μπάζα από μέσα του. Αυτό θα γίνη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: μέ την εξομολόγηση. Ανοίγοντας ο άνθρωπος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν καρδιά του στον πνευματικό και λέγοντας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τά σφάλματά του, ταπεινώνεται, και έτσι ανοίγει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν πύλη του Ουρανού, έρχεται πλούσια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: η Χάρις του Θεού και ελευθερώνεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η ανάγκη πνευματικού οδηγού
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την εξομολόγηση ο άνθρωπος λυτρώνεται
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, στα πρώτα χρόνια του Χριστιανισμού οι   Χριστιανοί έκαναν δημόσια εξομολόγηση. Βοηθάει αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άλλα τα πρώτα χρόνια του Χριστιανισμού και άλλα τώρα. Σήμερα αυτό δεν βοηθάει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί, Γέροντα; Τότε είχαν πιο πολύ ζήλο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πιο πολύ ζήλο είχαν και δεν είχαν αυτά που έχουν σήμερα οι άνθρωποι. Τώρα, βλέπεις, τα ανδρόγυνα χωρίζουν στα καλά καθούμενα, δεν είναι όπως παλιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχουν απομακρυνθή οι άνθρωποι από το μυστήριο της εξομολογήσεως, γι᾿ αυτό και πνίγονται από τους λογισμούς και τα πάθη. Πόσοι έρχονται και ζητούν να τους βοηθήσω σε κάποιο πρόβλημά τους, και ούτε εξομολογούνται ούτε εκκλησιάζονται! «Εκκλησιάζεσαι καθόλου;», τους ρωτάω. «Όχι», μου λένε. «Εξομολογήθηκες καμμιά φορά;». «Όχι. Ήρθα να με κάνης καλά». «Μά πώς; Πρέπει να μετανοήσης για τα σφάλματά σου, να εξομολογήσαι, να εκκλησιάζεσαι, να κοινωνάς, όταν έχης ευλογία από τον πνευματικό σου, και εγώ θα κάνω προσευχή να γίνης καλά. Ξεχνάς ότι υπάρχει και άλλη ζωή και πρέπει να ετοιμασθούμε για ᾿κεί;». «Κοίταξε, πάτερ, αυτά που λές, εκκλησίες, άλλη ζωή κ.λπ., εμένα δεν με απασχολούν. Αυτά είναι παραμύθια. Έχω πάει σε μάγους, σε μέντιουμ και δεν μπόρεσαν να με κάνουν καλά. Έμαθα ότι εσύ μπορείς να με κάνης καλά». Άντε τώρα! Τους μιλάς για εξομολόγηση, για την μέλλουσα ζωή, και σού λένε «αυτά είναι παραμύθια», και από την άλλη μεριά: «Βοήθησέ με, παίρνω χάπια». Έμ πώς, με μαγικό τρόπο θα γίνουν καλά;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπεις, πολλοί, ενώ έχουν προβλήματα που τα προκάλεσαν οι αμαρτίες τους, δεν πηγαίνουν στον πνευματικό που μπορεί να τους βοηθήση θετικά, αλλά καταλήγουν να εξομολογούνται στους ψυχολόγους. Λένε το ιστορικό τους, τους συμβουλεύονται για τα προβλήματά τους καί, αν έχουν να περάσουν ένα ποτάμι, τους ρίχνουν μέσα και ή πνίγονται ή βγαίνουν, αλλά που βγαίνουν... Ενώ, αν πάνε να εξομολογηθούν στον πνευματικό, θα περάσουν στην άλλη όχθη από την γέφυρα άνετα, γιατί με το μυστήριο της εξομολογήσεως ενεργεί η Χάρις του Θεού και λυτρώνονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μερικοί λένε: «Δεν βρίσκουμε καλούς πνευματικούς, γι᾿ αυτό δεν πάμε να εξομολογηθούμε».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά είναι δικαιολογίες. Κάθε πνευματικός έχει θεία εξουσία, εφόσον φοράει πετραχήλι. Τελεί το μυστήριο, έχει την θεία Χάρη καί, όταν διαβάση την συγχωρητική ευχή, ο Θεός σβήνει όλες τις αμαρτίες τις οποίες εξομολογηθήκαμε με ειλικρινή μετάνοια. Από μας εξαρτάται πόσο θα βοηθηθούμε από το μυστήριο της εξομολογήσεως. Ήρθε εκεί στο Καλύβι μια φορά κάποιος που είχε ψυχολογικά προβλήματα, με τον λογισμό ότι έχω διορατικό χάρισμα και θα μπορούσα να τον βοηθήσω. «Τί προβλέπεις, μου λέει, για μένα;». «Να βρής, του λέω, έναν πνευματικό να εξομολογήσαι, για να κοιμάσαι σαν το πουλάκι και να μην παίρνης χάπια». «Δεν υπάρχουν, μου λέει, σήμερα καλοί πνευματικοί. Παλιά υπήρχαν». Έρχονται με καλό λογισμό, ότι θα βοηθηθούν, αλλά δεν δέχονται αυτό που τους λές, και κρίμα στα ναύλα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπω όμως και μια καινούργια τέχνη του διαβόλου. Βάζει στους ανθρώπους τον λογισμό ότι, αν κάνουν κάποιο τάμα και το εκπληρώσουν, αν πάνε και κανένα προσκύνημα, είναι εντάξει πνευματικά. Και βλέπεις πολλούς να πηγαίνουν με λαμπάδες και με τάματα στα μοναστήρια, στα προσκυνήματα, να τα κρεμάνε εκεί, να κάνουν και μεγάλους σταυρούς, να κλαίνε και λιγάκι, και να αρκούνται σ᾿ αυτά. Δεν μετανοούν, δεν εξομολογούνται, δεν διορθώνονται, και χαίρεται το ταγκαλάκι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένας άνθρωπος που δεν εξομολογείται μπορεί να είναι εσωτερικά αναπαυμένος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να είναι αναπαυμένος; Για να νιώση κανείς ανάπαυση, πρέπει να πετάξη τα μπάζα από μέσα του. Αυτό θα γίνη με την εξομολόγηση. Ανοίγοντας ο άνθρωπος την καρδιά του στον πνευματικό και λέγοντας τα σφάλματά του, ταπεινώνεται, και έτσι ανοίγει την πύλη του Ουρανού, έρχεται πλούσια η Χάρις του Θεού και ελευθερώνεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πριν από την εξομολόγηση στην κορυφή του υπάρχει ομίχλη, βλέπει θαμπά και δικαιολογεί τα σφάλματά του. Γιατί, όταν ο νούς του είναι σκοτισμένος από τις αμαρτίες, δεν βλέπει καθαρά. Με την εξομολόγηση κάνει μια «φούουου», φεύγει η ομίχλη και καθαρίζει ο ορίζοντας. Γι᾿ αυτό, όσους έρχονται να συζητήσουμε ένα θέμα ή να μου ζητήσουν μια συμβουλή κ.λπ., αν δεν έχουν εξομολογηθή ποτέ, τους στέλνω πρώτα να εξομολογηθούν και μετά να έρθουν να μιλήσουμε. Μερικοί μου λένε: «Γέροντα, αφού εσύ μπορείς να καταλάβης τί πρέπει να κάνω γι᾿ αυτό το θέμα, πές μου». «Και να καταλάβω εγώ τί πρέπει να κάνης, τους λέω, δεν θα καταλάβης εσύ τί θα σού πώ. Γι᾿ αυτό πήγαινε πρώτα να εξομολογηθής και ύστερα έλα να συζητήσουμε». Γιατί, πώς να επικοινωνήσης και να συνεννοηθής με έναν άνθρωπο, όταν βρίσκεται σε άλλη συχνότητα;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με την εξομολόγηση πετάει ο άνθρωπος από μέσα του ό,τι άχρηστο έχει και καρποφορεί πνευματικά. Μια μέρα έσκαβα τον κήπο μου, για να φυτέψω λίγες ντοματιές. Εκείνη την ώρα ήρθε κάποιος και μου λέει: «Τί κάνεις, Γέροντα;». «Τί να κάνω; του λέω, εξομολογώ τον κήπο μου». «Καλά, Γέροντα, μου λέει, χρειάζεται και ο κήπος εξομολόγηση;». «Ασφαλώς χρειάζεται. Έχω διαπιστώσει πώς, όταν τον εξομολογώ, βγάζω δηλαδή έξω πέτρες, αγριάδες, αγκάθια κ.λπ., τότε βγάζει επίσημα κηπευτικά, αλλιώς οι ντομάτες γίνονται κιτρινιάρικες, καχεκτικές!»...'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Θεός θέλει ο άνθρωπος να διορθώνεται δια του ανθρώπου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν αντιμετωπίζω ένα θέμα και προσεύχωμαι γι᾿ αυτό, πώς θα καταλάβω ποιό είναι το θέλημα του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το θέλημα του Θεού δεν βρίσκεται έτσι. Καλύτερα να ρωτάς για ένα πρόβλημά σου. Να μη ζητάς πληροφορία από τον Θεό, εφόσον μπορείς να συμβουλευθής κάποιον άνθρωπο, γιατί μπορεί να πλανηθής. Κάποιος πήγαινε σε μια εκκλησία, στεκόταν μπροστά στο εικονοστάσι και έλεγε: «Παναγία μου, να πάρω τα χρήματα από το κουτί;». Του έλεγε ο λογισμός: «Πάρ᾿ τα». «Ναί, θα τα πάρω», έλεγε και έπαιρνε τα χρήματα. Μιά-δυό-τρείς φορές, ένας επίτροπος προβληματίσθηκε. «Τί γίνεται; λέει. Κάποιος πρέπει να παίρνη τα χρήματα» και πήγε να παρακολουθήση. Τί να δή; Σε λίγο ήρθε αυτός και επανέλαβε τα ίδια: «Παναγία μου, να πάρω τα χρήματα από το κουτί;... Ναί, θα τα πάρω», είπε, οπότε τον έπιασε ο επίτροπος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντοτε, όταν υπάρχη άνθρωπος πνευματικός, τον οποίο μπορείς να ρωτήσης, πρέπει να ρωτήσης. Όταν δεν υπάρχη άνθρωπος να ρωτήσης – λ.χ. βρίσκεσαι στην έρημο –, αλλά υπάρχη μέσα σου η δίψα της υπακοής, τότε ο Καλός Θεός γίνεται ο Ίδιος Γέροντας και σε φωτίζει και σε πληροφορεί. Δεν μπορείς, ας υποθέσουμε, να βρής κάποιον, για να σού εξηγήση ένα χωρίο από την Αγία Γραφή; Τότε σε φωτίζει ο Θεός και το καταλαβαίνεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα καταλάβη κανείς, αν κάτι που συμβαίνει στον αγώνα του είναι από τον πειρασμό ή από δική του απροσεξία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Θα πάη να ρωτήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή μόνος του δεν μπορεί να το καταλάβη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και να καταλαβαίνη κάτι, δεν μπορεί να είναι σίγουρος. Εδώ και ένας που έχει εμπειρία, πάει και ρωτάει κάποιον άλλον. Εγώ για ένα ατομικό μου θέμα πάντοτε θα ρωτήσω. Την δική μου λύση, και σοφώτερη να είναι, την θεωρώ την μεγαλύτερη βλακεία, όταν πρόκειται για προσωπικό μου θέμα. Ούτε πάω σε κάποιον που ξέρει τί με αναπαύει, αλλά σε κάποιον που δεν ξέρει. Βλέπεις, και ένας γιατρός, για να είναι σίγουρος ότι έκανε καλή διάγνωση σε μια δύσκολη περίπτωση, συμβουλεύεται και άλλον γιατρό, πόσο μάλλον ένας φοιτητής! Όσο πνευματικός άνθρωπος κι αν είναι κανείς, και όσο καλή τακτοποίηση κι αν κάνη μόνος του στα θέματά του, δεν μπορεί να αναπαυθή, γιατί ο Θεός θέλει ο άνθρωπος να βοηθιέται από τον άνθρωπο και να διορθώνεται δια του ανθρώπου. Τα οικονομάει έτσι ο Καλός Θεός, για να ταπεινώνεται ο άνθρωπος. Πρέπει να εκθέτη κανείς τους λογισμούς του και τις καταστάσεις που περνάει στον πνευματικό του, να τον συμβουλεύεται και να μην αποφασίζη μόνος του για τα δύσκολα θέματα ούτε να αντιμετωπίζη μόνος του τις δυσκολίες που συναντάει στον αγώνα του, κάνοντας πρόβες στον εαυτό του, γιατί ο πειρασμός θα τον μπερδέψη και θα του δημιουργήση προβλήματα. Μερικοί φθάνουν στο σημείο να βάζουν μόνοι τους κανόνα στον εαυτό τους. Είναι πολύ επικίνδυνα αυτά τα πράγματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος δεν έχει πνευματικό, για να τον συμβουλεύεται στην πνευματική του πορεία, μπερδεύεται, κουράζεται, καθυστερεί και δύσκολα θα φθάση στον προορισμό του. Αν δίνη μόνος του λύση στα προβλήματά του, όσο σοφός και αν είναι, επειδή κινείται με αυτοπεποίθηση και υπερηφάνεια, μένει σκοτισμένος. Ενώ, όποιος ταπεινώνεται και πηγαίνει με εμπιστοσύνη και αυταπάρνηση στον πνευματικό και ζητά την γνώμη του, βοηθιέται. Γιατί τότε ο Θεός οπωσδήποτε φωτίζει τον πνευματικό και του δίνει την σωστή απάντηση. Νά, όταν έρχεται κάποιος με ευλάβεια, με τον λογισμό πώς είμαι άγιος, ενώ εγώ είμαι τενεκές, έχω προσέξει ότι νιώθω μέσα μου μια αλλοίωση και αυτά που του λέω δεν είναι δικά μου. Από αυτό καταλαβαίνω ξεκάθαρα ότι ο άνθρωπος αυτός έχει έρθει με ευλάβεια, και ο Θεός, για να μην τον αδικήση, δίνει σ᾿ εμένα αυτήν την καλή κατάσταση. Σε τέτοιες περιπτώσεις, αν πρόκειται για ένα σοβαρό θέμα, ο Θεός σε πληροφορεί και μπορείς να του πής τί θα συμβή, πότε θα συμβή και πώς να το αντιμετωπίση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Χρειάζεται πνευματικός οδηγός στην πνευματική ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα το πιο απαραίτητο είναι να βρουν οι άνθρωποι έναν πνευματικό, να εξομολογούνται, να του έχουν εμπιστοσύνη και να τον συμβουλεύωνται. Αν έχουν πνευματικό και βάλουν ένα πρόγραμμα με προσευχή και λίγη μελέτη, εκκλησιάζωνται, κοινωνούν, τότε δεν έχουν τίποτε να φοβηθούν σ᾿ αυτήν την ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η ψυχή πρέπει να παρακολουθήται από τον πνευματικό, για να μη λαθέψη τον δρόμο της. Μπορεί να βοηθάη στον αγώνα λ.χ. και η πνευματική μελέτη, αλλά, αν κανείς δεν έχη πνευματικό οδηγό, μπορεί να δίνη δικές του ερμηνείες σ᾿ αυτά που διαβάζει, και να πλανηθή. Βλέπεις, και όταν κάποιος πάη κάπου με το αυτοκίνητό του και δεν γνωρίζη καλά τον δρόμο, μπορεί να συμβουλεύεται τον χάρτη, αλλά σταματάει κιόλας και ρωτάει, για να μην πάρη λάθος δρόμο. Ξεκινάει, ας υποθέσουμε, από την Αθήνα να πάη στην Φλώρινα. Έχει χάρτη και τον παρακολουθεί, αλλά ρωτάει και σε κανένα περίπτερο αν πηγαίνη καλά, αν ο δρόμος είναι καλός, γιατί σε καμμιά διασταύρωση υπάρχει κίνδυνος να πάρη άλλο δρόμο και να βρεθή στην Καβάλα ή σε κάποιον γκρεμό να κινδυνέψη να σκοτωθή. Φυσικά, μπορεί κάποιος να ρωτήση, αλλά να μην πάρη τον δρόμο που θα του πούν, και να βρεθή τελικά αλλού, ή να μην προσέξη τα επικίνδυνα σημεία, και να πάθη κακό. Όποιος όμως του δείξη τον δρόμο και συγχρόνως του πή: «πρόσεξε, στο τάδε σημείο έχει μια στροφή επικίνδυνη, εκεί έχει έναν γκρεμό...», εκείνος θα έχη τον μισθό του. Το ίδιο, θέλω να πώ, πρέπει να γίνεται και στην πνευματική ζωή. Είναι απαραίτητο ο πιστός να έχη πνευματικό που θα τον καθοδηγή με τις συμβουλές του και θα τον βοηθάη δια του μυστηρίου της εξομολογήσεως. Έτσι μόνον μπορεί να ζήση ορθόδοξη πνευματική ζωή και να είναι σίγουρος ότι βρίσκεται στον σωστό δρόμο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τον πνευματικό οδηγό φυσικά κανείς θα τον διαλέξη. Δεν θα εμπιστευθή στον οποιονδήποτε την ψυχή του. Όπως για την υγεία του σώματος ψάχνει να βρη καλό γιατρό, έτσι και για την υγεία της ψυχής του θα ψάξη να βρη κάποιον καλό πνευματικό και θα πηγαίνη σ᾿ αυτόν, τον γιατρό της ψυχής, τακτικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Στείλτε τους ανθρώπους στον πνευματικό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλές φορές οι άνθρωποι βλέποντας ράσο μας λένε τον πόνο τους, το πρόβλημά τους, ακόμη και εξομολόγηση. Ποιά πρέπει να είναι η στάση μας απέναντί τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εξ αρχής, όταν απευθύνωνται σ᾿ εσάς για κάποιο πρόβλημά τους, να τους ρωτήσετε: «Έχετε πνευματικό;». Κι εγώ στους ανθρώπους που έρχονται εκεί στο Καλύβι να με ρωτήσουν για κάποιο θέμα λέω: «Εγώ δεν είμαι πνευματικός· να πάτε στον πνευματικό σας και να κάνετε ό,τι σάς πη εκείνος ». Πρέπει να μετανοήσουν οι άνθρωποι και να έχουν έναν πνευματικό να εξομολογούνται, για να κοπούν τα δικαιώματα του διαβόλου. Να ακούση η μοναχή μια φορά κάποια πονεμένη γυναίκα που έχει ένα πρόβλημα και μετά να την στείλη στον πνευματικό, αυτό το καταλαβαίνω. Όχι όμως να συνεχίζη να συζητάη μαζί της. Ή, αν μία γυναίκα δεν αναπαύεται στον πνευματικό της ή δεν έχη πάει ποτέ για εξομολόγηση ή βρίσκεται σε κατάσταση απελπισίας, ας την ακούση μια φορά και πάλι να την στείλη στον πνευματικό και να της πη ότι εκείνη θα εύχεται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εκτός που δεν έχει υποχρέωση η μοναχή να τους βοηθήση κατ᾿ αυτόν τον τρόπο, ακούγοντας δηλαδή συνεχώς τα προβλήματά τους, δεν βοηθιούνται κιόλας έτσι οι άνθρωποι. Γιατί ο άνθρωπος παθαίνει τριών ειδών αλλοιώσεις: από τον εαυτό του, από τους άλλους και από τον διάβολο. Έρχονται εδώ, βρίσκουν μια παρηγοριά ανθρώπινη, αλλά, μόλις φύγουν από το Μοναστήρι και πάνε σπίτι, γυρίζουν πάλι στο δικό τους και αρχίζουν τα ίδια. Και οι γυναίκες και οι άνδρες να πάνε στον πνευματικό τους. Δεν είναι σωστό να λένε τα θέματά τους στην καλόγρια. Γιατί μετά λένε: «τά είπα· είμαι εντάξει», αναπαύουν ψεύτικα τον λογισμό τους και δεν πάνε στον πνευματικό. Αυτό είναι τέχνασμα του διαβόλου, για να μην εξομολογούνται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πρέπει να καταλάβετε ποιά είναι η αποστολή σας ως μοναχές και να μην πάτε να κάνετε δήθεν ιεραποστολή, επειδή δεν έχετε καταλάβει την καλογερική αποστολή. Ως μοναχοί έχουμε υποχρέωση να κάνουμε προσευχή για τα προβλήματα των άλλων· δεν είμαστε όμως υποχρεωμένοι να ασχοληθούμε με τα προβλήματά τους. Ο πνευματικός έχει υποχρέωση να το κάνη αυτό, έχει και ευθύνη. Αν συζητούν μ᾿ εσάς, φορτώνουν σ᾿ εσάς την ευθύνη. Εκείνος μπορεί να τους παρακολουθή από κοντά και να δίνη λύση στα προβλήματά τους. Χρειάζεται δηλαδή δουλειά. Αυτή η δουλειά δεν είναι των μοναχών. Από μας μόνον προσευχή να ζητάνε. Ας στέλνουν κανένα γράμμα με ονόματα, να κάνουμε κανένα κομποσχοίνι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πνευματικός από κοντά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όπως κανείς φροντίζει ο οικογενειακός γιατρός να βρίσκεται, όσο το δυνατόν, κοντά του, έτσι πρέπει να φροντίση και ο πνευματικός να βρίσκεται κοντά του. Ένας γιατρός, όταν είναι κοντά στον άρρωστο, μπορεί να τον βοηθήση καλύτερα από καθηγητές πανεπιστημίου – έστω και αν δεν έχη τόση πείρα –, γιατί μπορεί να τον παρακολουθή συστηματικά καί, αν χρειασθή, θα τον στείλη στον ειδικό γιατρό. Μου έκανε εντύπωση το εξής, όταν ήμουν στο Σανατόριο[118]: Πολλοί πλούσιοι που είχαν φυματίωση έμεναν στο σπίτι τους και πήγαιναν εκεί καθηγητές πανεπιστημίου, για να τους κάνουν θεραπεία. Αποδείχθηκε όμως ότι η θεραπεία δεν είχε κανένα αποτέλεσμα, γιατί δεν μπορούσαν να τους παρακολουθούν συστηματικά. Γι᾿ αυτό αναγκάσθηκαν να δημιουργήσουν στο Σανατόριο ξεχωριστά τμήματα, για να νοσηλεύωνται εκεί, ώστε να παρακολουθούνται συστηματικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θέλω να πω ότι, όπως ο γιατρός από κοντά παρακολουθεί τον άρρωστο, όταν του δίνη κάποια θεραπεία, βλέπει αν τα φάρμακα που του έδωσε τον βοηθούν ή έχουν παρενέργειες κ.λπ., και ανάλογα αυξάνει ή ελαττώνει την δόση καί, αν χρειασθή, μπορεί ακόμη και να αλλάξη την θεραπεία, έτσι και ο πνευματικός πρέπει από κοντά να παρακολουθή την ψυχή, γιατί κατά καιρούς παρουσιάζει διάφορες αλλαγές και αντιδράσεις, τις οποίες από μακριά δεν μπορεί να παρακολουθήση, για να την βοηθήση αποτελεσματικά. Μια φορά είχα πει σε μια ψυχή που είχε έναν πειρασμό: «Θα κάνης αυτό και θα δής ότι θα το ξεπεράσης». Πράγματι μ᾿ άκουσε και το ξεπέρασε. Μετά από λίγο καιρό είχε έναν τελείως αντίθετο πειρασμό, τον αντιμετώπισε με τον ίδιο τρόπο και ταλαιπωρήθηκε! Μπορούσε η ευλογημένη να στείλη έναν άνθρωπο ή να γράψη ένα γράμμα, για να με ρωτήση τί έπρεπε να κάνη, αφού αντιμετώπιζε άλλη δυσκολία. Θα της έδινα άλλο φάρμακο, δηλαδή άλλη συμβουλή. Δυσκολεύτηκε να με ρωτήση, επειδή ήμουν μακριά. Γι᾿ αυτό εγώ από μακριά δεν συνηθίζω να δίνω συμβουλές, αν δεν γνωρίζω καλά τον άνθρωπο και δεν έχω στενή επικοινωνία μαζί του.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο πνευματικός στην οικογένεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιά βιβλία μπορούν να βοηθήσουν τους συζύγους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εκείνο που βοηθάει το ανδρόγυνο είναι να μη δικαιολογή ο καθένας τον εαυτό του. Αν δικαιολογούν τον εαυτό τους, όσα πνευματικά βιβλία κι αν διαβάσουν, δεν  ωφελούνται. Αν έχουν καλή διάθεση, έχουν πνευματικό και του κάνουν υπακοή, δεν θα έχουν προβλήματα. Χωρίς πνευματικό διαιτητή δεν γίνεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το καλύτερο είναι να έχουν τα ανδρόγυνα τον ίδιο πνευματικό. Όχι άλλον πνευματικό ο άνδρας και άλλον η γυναίκα. Δύο ξύλα, αν τα πελεκήσουν δύο μαραγκοί, όπως νομίζει ο καθένας, δεν θα μπορέσουν ποτέ να εφαρμόσουν. Ενώ, όταν έχουν τον ίδιο πνευματικό, ο πνευματικός πελεκάει τα εξογκώματα – τα ελαττώματα – του ενός, πελεκάει και τα εξογκώματα του άλλου, και έτσι εξομαλύνονται οι δυσκολίες. Αλλά σήμερα, ακόμη και ανδρόγυνα που ζουν πνευματικά, έχουν διαφορετικό πνευματικό. Σπάνια έχουν και οι δυο τον ίδιο πνευματικό, γι᾿ αυτό και δεν βοηθιούνται. Έχω υπ᾿ όψιν μου ανδρόγυνα που ταίριαζαν, αλλά δεν είχαν τον ίδιο πνευματικό, για να τους βοηθήση, και χώρισαν. Και άλλα πού, ενώ δεν ταίριαζαν, επειδή είχαν τον ίδιο πνευματικό, έζησαν αρμονικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βέβαια, όταν έχη όλη η οικογένεια τον ίδιο πνευματικό, αυτό είναι ακόμη καλύτερο. Ο πνευματικός θα τους ακούση όλους και θα χειρισθή ανάλογα ένα θέμα. Άλλοτε θα ζορίση τον πατέρα ή την μητέρα, άλλοτε θα καλέση τα παιδιά, αν δεν μπορή να βγάλη συμπέρασμα από αυτά που του λένε οι γονείς. Ή, αν το ανδρόγυνο έχη προβλήματα και φταίη λ.χ. η γυναίκα, μπορεί να καλέση τον άνδρα, για να τον συμβουλέψη πώς πρέπει να φερθή, ή να ζητήση από κάποιον συγγενή τους ή γνωστό τους να βοηθήση διακριτικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αλλαγή πνευματικού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κανείς αναγκασθή για κάποιον λόγο να αλλάξη πνευματικό, χρειάζεται να εξομολογηθή πάλι αμαρτίες που έχει εξομολογηθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά είναι να ενημερώση τον καινούργιο πνευματικό, όπως ο ασθενής, όταν αλλάζη γιατρό, λέει πάλι το ιστορικό του, για να μπορέση ο γιατρός να τον βοηθήση καλύτερα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος θέλη να αλλάξη πνευματικό και μας ρωτάη αν είναι σωστό, τί πρέπει να πούμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να πάρη ευλογία από τον πνευματικό του. Δεν είναι καλό να αλλάζη κανείς εύκολα πνευματικό. Μια οικοδομή δεν θα γίνη ποτέ σωστή, αν αλλάζουν συνέχεια οι μηχανικοί και οι οικοδόμοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά πήγαιναν οι άνθρωποι σε Γέροντες, για να ζητήσουν συμβουλή για ένα θέμα που τους απασχολούσε και να βοηθηθούν. Σήμερα πολλοί δεν πάνε για συμβουλή, αλλά για να δικαιολογήσουν τον εαυτό τους ή για να πούν ότι συμβουλεύτηκαν και τον τάδε Γέροντα. «Πήγα στον τάδε και στον τάδε, ρώτησα και τον πατέρα Παΐσιο γι᾿ αυτό το θέμα», λέει ο άλλος, και εγώ μπορεί να τον μάλωσα ή να ήρθε μέχρι την πόρτα και να μη χτύπησε! Έτσι καταλήγουν να γυρίζουν από τον έναν πατέρα στον άλλον, χωρίς να έχουν κάποιον μόνιμο πνευματικό, με αποτέλεσμα να μπερδεύωνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Άλλοι πάλι κάνουν ένα σφάλμα και δεν πάνε να το πούν στον πνευματικό τους, αλλά πάνε και το λένε σε άλλον πνευματικό, για να μη χάσουν την αξιοπρέπειά τους. Μετά από λίγο καιρό κάνουν το ίδιο σφάλμα και το λένε σε άλλον, ύστερα σε άλλον, και τελικά παρουσιάζονται στον έναν πνευματικό ότι το έκαναν μια φορά, στον άλλον μια φορά, και έτσι συνεχίζουν να σφάλλουν και μένουν αδιόρθωτοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι και μερικοί, έχω παρατηρήσει, οι οποίοι αποφεύγουν να πούν κάτι στον πνευματικό τους, αν και ξέρουν ότι θα τους βοηθήση και δεν πρόκειται να το διαδώση, και το λένε σε κάποιον γνωστό τους, που δεν μπορεί να τους βοηθήση και που σίγουρα θα το πη και σε άλλους. Θυμάμαι, όταν ήμουν αρχάριος μοναχός στο Κοινόβιο[119], είχε έρθει κάποιος να κοινοβιάση. Κάθησε ένα διάστημα και μετά είχε λογισμούς να φύγη. Στον ηγούμενο δεν πήγε να πη τους λογισμούς του ούτε σε κανέναν άλλον πνευματικό πατέρα, αλλά τα είπε σε έναν εργάτη από την Ιερισσό, που εργαζόταν στο μοναστήρι. Ήμουν και εγώ εκεί κοντά, όταν του τα έλεγε· καθάριζα κρεμμύδια έξω από την κουζίνα. Άρχισε λοιπόν από δύο μέτρα πιο πέρα να του κάνη εξομολόγηση δυνατά. «Μετάνοιωσα που έγινα μοναχός». «Όταν ήρθες, δεν δοκίμασες;», τον ρωτάει ο εργάτης. «Δοκίμασα δύο χρόνια». «Καλά, γιατί δεν έφυγες νωρίτερα;». «Νά, δεν έφυγα». «Με το ζόρι σε έκαναν καλόγερο;». «Όχι, ήθελα και εγώ». «Καλά, του λέει, τα είπες αυτά στον ηγούμενο;». «Όχι», του απαντά. «Σ᾿ εμένα που τα λές, τί θα ωφεληθής;», του λέει. Του είχε πει ολόκληρο το ιστορικό του. Βλέπετε; Στον ηγούμενο που έπρεπε να τα πή, για να βοηθηθή, δεν τα είπε και πήγε να εξομολογηθή στον εργάτη. Και εκείνος θα τα έλεγε το Σαββατοκύριακο στο καφενείο στην Ιερισσό, για να γελάσουν, και θα γέμιζε το χωριό. Και να πής πώς ήταν λειψός; Ξέρετε πόσα λεξικά είχε; Τα αρχαία ελληνικά τα ήξερε απταίστως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί ένας λαϊκός να ρωτήση για ένα πρόβλημά του ή για έναν πειρασμό του κάποιον πνευματικό αδελφό του, αν ο πνευματικός του απουσιάζη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν μπορεί να τηλεφωνήση στον πνευματικό του; Ο αδελφός άλλοτε μπορεί να βοηθήση και άλλοτε δεν μπορεί να βοηθήση ή, παρά την καλή του διάθεση, μπορεί ακόμη και να τον βλάψη. Σε μια ανάγκη με ένα τηλεφώνημα στον πνευματικό βολεύονται τα πράγματα. Και αν δεν μπορή να επικοινωνήση με τον πνευματικό του και είναι κάτι σοβαρό και επείγον, ας ρωτήση έναν άλλον πνευματικό. Καλά είναι να τον έχη ρωτήσει εκ των προτέρων ποιόν πνευματικό μπορεί να συμβουλευθή σε τέτοια περίπτωση, ώστε να πάη σε κάποιον που έχει το ίδιο πνεύμα. Γιατί κάθε μηχανικός έχει δικό του σχέδιο. Μπορεί να είναι καλό και το ένα σχέδιο και το άλλο, αλλά είναι διαφορετικά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – Για μια σωστή εξομολόγηση
- type: h2
  initial:
    ru: ''
  text:
    ru: Να δένουμε το τραύμα μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, όταν στον αγώνα μου έχω πτώσεις, πανικοβάλλομαι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μη φοβάσαι. Αγώνας είναι και θα έχουμε και τραύματα. Με την εξομολόγηση αυτά θεραπεύονται. Βλέπεις, οι στρατιώτες στον πόλεμο, όταν τραυματίζωνται επάνω στην μάχη, τρέχουν αμέσως στον γιατρό, δένουν το τραύμα τους και συνεχίζουν να πολεμούν φιλότιμα. Εν τω μεταξύ αποκτούν και πείρα από τον τραυματισμό και προφυλάγονται καλύτερα, ώστε να μην ξανατραυματισθούν. Έτσι και εμείς, όταν τραυματιζώμαστε πάνω στον αγώνα μας, δεν πρέπει να δειλιάζουμε, αλλά να τρέχουμε στον γιατρό – στον πνευματικό –, να του δείχνουμε το τραύμα μας, να θεραπευώμαστε πνευματικά, και πάλι να συνεχίζουμε «τόν καλόν αγώνα»[120]. Κακό είναι, όταν δεν ψάχνουμε να βρούμε τους φοβερούς εχθρούς της ψυχής, τα πάθη, και δεν αγωνιζώμαστε, για να τους εξοντώσουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί από φιλότιμο δεν πάνε να εξομολογηθούν. «Αφού μπορεί να ξανακάνω το ίδιο σφάλμα, λένε, για ποιό λόγο να πάω να το εξομολογηθώ; για να κοροϊδεύω τον παπά;».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό δεν είναι σωστό! Είναι σαν να λέη ένας στρατιώτης, όταν τραυματίζεται: «Αφού ο πόλεμος δεν τέλειωσε και μπορεί πάλι να τραυματισθώ, γιατί να δέσω το τραύμα μου;». Αλλά, αν δεν το δέση, θα πάθη αιμορραγία και θα πεθάνη. Μπορεί από φιλότιμο να μην πηγαίνουν να εξομολογηθούν, τελικά όμως αχρηστεύονται. Ο διάβολος, βλέπεις, εκμεταλλεύεται και τα χαρίσματα. Αν δεν καθαρίζουμε με την εξομολόγηση την ψυχή μας, όταν πέφτουμε και λερωνώμαστε, με τον λογισμό ότι πάλι θα πέσουμε και θα λερωθούμε, προσθέτουμε λάσπες πάνω στις παλιές λάσπες και είναι δύσκολο μετά να καθαρίσουν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ανάγκη για εξομολόγηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Όσιος Μάρκος ο Ασκητής λέει: «Ο γνωστικός εξομολογείται στον Θεό όχι με την απαρίθμηση των παραπτωμάτων του, αλλά με την υπομονή των επερχομένων θλίψεων»[121]. Τί εννοεί;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Και το ένα πρέπει να γίνεται και το άλλο. Εξομολογείται ο πιστός στον πνευματικό, εξομολογείται και πριν από την προσευχή ταπεινά στον Θεό, απογυμνώνοντας τον εαυτό του: «Θεέ μου, έσφαλα, είμαι τέτοιος, τέτοιος». Συγχρόνως όμως δέχεται και τις θλίψεις που του συμβαίνουν σαν φάρμακο. Ο Άγιος δεν λέει να μην κάνης την πρώτη και την δεύτερη εξομολόγηση, αλλά μόνο να υπομένης τις θλίψεις. Τί θα πη «εξομολογούμαι;». Δεν θα πη «ομολογώ έξω αυτό που έχω μέσα μου»; Αν έχης μέσα σου καλά, «εξομολογείσαι τω Κυρίω»[122], δηλαδή δοξολογείς τον Θεό. Αν έχης κακά, εξομολογείσαι τις αμαρτίες σου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, την πρώτη φορά που θα πάη κανείς για εξομολόγηση, θα μιλήση στον πνευματικό για όλη την προηγούμενη ζωή του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Την πρώτη φορά θα κάνη μια γενική εξομολόγηση. Όπως ο ασθενής, όταν μπή στο νοσοκομείο, δίνει το ιστορικό του, π.χ. λέει: «είχα μια πάθηση στους πνεύμονες, αλλά τώρα έχει περάσει, έχω κάνει μια εγχείρηση με ολική ή τοπική νάρκωση κ.λπ.», έτσι και στην πρώτη εξομολόγηση, ας προσπαθήση κανείς να πη στον πνευματικό λεπτομέρειες από την ζωή του, και εκείνος θα βρη την πληγή, για να την θεραπεύση. Πολλές φορές ένα χτύπημα, που δεν του δίνεις σημασία, έχει ύστερα συνέπειες. Βέβαια, την πρώτη φορά που θα πάη στον πνευματικό, θα έχη να πή, ας υποθέσουμε, εκατό αμαρτίες. Την δεύτερη θα έχη να πη εκατόν δέκα, γιατί θα τον πολεμήση περισσότερο ο διάβολος, επειδή εξομολογήθηκε και του χάλασε την δουλειά. Την τρίτη φορά μπορεί να πη εκατόν πενήντα, αλλά ύστερα θα ελαττώνεται συνέχεια ο αριθμός, μέχρι που θα πηγαίνη για εξομολόγηση και θα έχη να πη ελάχιστες αμαρτίες.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η σωστή εξομολόγηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί μερικές φορές, ενώ η συνείδηση μας ελέγχει, δεν κάνουμε τον ανάλογο αγώνα, για να διορθωθούμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό μπορεί να συμβή και από ένα τσάκισμα ψυχικό. Όταν είναι κανείς πανικοβλημένος από κάποιον πειρασμό, θέλει να αγωνισθή, αλλά δεν έχει διάθεση, δεν έχει ψυχική δύναμη. Τότε πρέπει να τακτοποιηθή εσωτερικά με την εξομολόγηση. Με την εξομολόγηση παρηγοριέται, τονώνεται και ξαναβρίσκει με την Χάρη του Θεού το κουράγιο για αγώνα. Αν δεν τακτοποιηθή, μπορεί να του έρθη και άλλος πειρασμός, οπότε, θλιμμένος όπως είναι, τσακίζεται περισσότερο, τον πνίγουν οι λογισμοί, απελπίζεται και μετά δεν μπορεί να αγωνισθή καθόλου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και αν αυτό συμβαίνη συχνά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν συμβαίνη συχνά, πρέπει ο άνθρωπος να τακτοποιήται συχνά, να ανοίγη την καρδιά του στον πνευματικό, για να παίρνη κουράγιο. Και όταν τακτοποιηθή, πρέπει να βάλη την μηχανή να τρέξη, να αγωνισθή φιλότιμα και εντατικά, για να πάρη καταπόδι τον έξω από ᾿δώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν δεν αισθάνωμαι την ανάγκη για εξομολόγηση, τί φταίει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μήπως δεν παρακολουθείς τον εαυτό σου; Η εξομολόγηση είναι μυστήριο. Να πηγαίνης και απλά να λές τις αμαρτίες σου. Γιατί, τί νομίζεις; Πείσμα δεν έχεις; Εγωισμό δεν έχεις; Δεν πληγώνεις την αδελφή; Δεν κατακρίνεις; Μήπως εγώ τί πηγαίνω και λέω; «Θύμωσα, κατέκρινα...» και μου διαβάζει ο πνευματικός την συγχωρητική ευχή. Αλλά και οι μικρές αμαρτίες έχουν και αυτές βάρος. Όταν πήγαινα στον Παπα-Τύχωνα[123]να εξομολογηθώ, δεν είχα τίποτε σοβαρό να πω και μου έλεγε: «Αμμούδα, παιδάκι μου, αμμούδα»! Οι μικρές αμαρτίες μαζεύονται και κάνουν έναν σωρό αμμούδα, που είναι όμως βαρύτερη από μια μεγάλη πέτρα. Ο άλλος που έχει κάνει ένα αμάρτημα μεγάλο, το σκέφτεται συνέχεια, μετανοεί και ταπεινώνεται. Εσύ έχεις πολλά μικρά. Εάν όμως εξετάσης τις συνθήκες με τις οποίες εσύ μεγάλωσες και τις συνθήκες με τις οποίες μεγάλωσε ο άλλος, θα δής ότι είσαι χειρότερη από εκείνον. Να προσπαθής επίσης να είσαι συγκεκριμένη στην εξομολόγησή σου. Δεν φθάνει να πη κανείς λ.χ. «ζηλεύω, θυμώνω κ.λπ.», αλλά πρέπει να πη τις συγκεκριμένες πτώσεις του, για να βοηθηθή. Καί, όταν πρόκειται για κάτι βαρύ, όπως η πονηριά, πρέπει να πη και πώς σκέφθηκε και πώς ενήργησε· αλλιώς κοροϊδεύει τον Χριστό. Αν ο άνθρωπος δεν ομολογή την αλήθεια στον πνευματικό, δεν του αποκαλύπτη το σφάλμα του, για να μπορέση να τον βοηθήση, παθαίνει ζημιά, όπως και ο άρρωστος κάνει μεγάλο κακό στην υγεία του, όταν κρύβη την πάθησή του από τον γιατρό. Ενώ, όταν εκθέτη τον εαυτό του όπως ακριβώς είναι, τότε ο πνευματικός μπορεί να τον γνωρίση καλύτερα και να τον βοηθήση πιο θετικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ύστερα, όταν κανείς αδικήση ή πληγώση με την συμπεριφορά του έναν άνθρωπο, πρέπει πρώτα να πάη να του ζητήση ταπεινά συγχώρηση, να συμφιλιωθή μαζί του, και έπειτα να εξομολογηθή την πτώση του στον πνευματικό, για να λάβη την άφεση. Έτσι έρχεται η Χάρις του Θεού. Αν πη το σφάλμα του στον πνευματικό, χωρίς προηγουμένως να ζητήση συγχώρηση από τον άνθρωπο που πλήγωσε, δεν είναι δυνατόν να ειρηνεύση η ψυχή του, γιατί δεν ταπεινώνεται. Εκτός αν ο άνθρωπος που πλήγωσε έχη πεθάνει ή δεν μπορή να τον βρή, γιατί άλλαξε κατοικία και δεν έχει την διεύθυνσή του, για να του ζητήση, έστω και γραπτώς, συγγνώμην, αλλά έχη διάθεση να το κάνη, τότε ο Θεός τον συγχωρεί, γιατί βλέπει την διάθεσή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άν, Γέροντα, ζητήσουμε συγχώρεση και δεν μας συγχωρήση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε να κάνουμε προσευχή να μαλακώση ο Θεός την καρδιά του. Υπάρχει όμως περίπτωση να μη βοηθάη ο Θεός να μαλακώση η καρδιά του, γιατί, αν μας συγχωρήση, μπορεί να ξαναπέσουμε στο ίδιο σφάλμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κανείς κάνη ένα σοβαρό σφάλμα, υπάρχει περίπτωση να μην μπορή να το εξομολογηθή αμέσως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί να το αφήση; Για να ξινίση; Όσο κρατάς ένα χαλασμένο πράγμα, τόσο χαλάει. Γιατί να αφήση να περάσουν ένας-δύο μήνες, για να πάη στον πνευματικό να το εξομολογηθή; Να πάη το συντομώτερο. Αν έχη μια πληγή ανοιχτή, θα αφήση να περάση ένας μήνας, για να την θεραπεύση; Ούτε να περιμένη να πάη, όταν θα έχη πολύ χρόνο ο πνευματικός, για να έχη πιο πολλή άνεση. Αυτό το ένα σφάλμα, τάκ–τάκ να το λέη αμέσως και μετά, όταν ο πνευματικός θα έχη χρόνο, να πηγαίνη για πιο πολύ, για μια συζήτηση κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν χρειάζεται ώρα πολλή, για να δώσω εικόνα του εαυτού μου. Όταν η συνείδηση δουλεύη σωστά, δίνει ο άνθρωπος με δυο λόγια εικόνα της καταστάσεώς του. Όταν όμως υπάρχη μέσα του σύγχυση, μπορεί να λέη πολλά και να μη δίνη εικόνα. Νά, βλέπω, μερικοί μου γράφουν ολόκληρα τετράδια, είκοσι-τριάντα σελίδες αναφοράς με μικρά γράμματα, και μερικές σελίδες υστερόγραφο... Όλα αυτά που γράφουν, μπορούσαν να τα βάλουν σε μια σελίδα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα ελαφρυντικά στην εξομολόγησή μας γίνονται επιβαρυντικά για την συνείδηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, κατά την εξομολόγηση μιας αμαρτίας δεν νιώθη κανείς τον πόνο που ένιωσε, όταν έκανε την αμαρτία, σημαίνει ότι δεν υπάρχει πραγματική μετάνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν έχη περάσει καιρός από τότε που έκανε αυτήν την αμαρτία, επουλώνεται η πληγή, γι᾿ αυτό δεν νιώθει τον ίδιο πόνο. Αυτό που πρέπει να προσέξη, είναι να μη δικαιολογή τον εαυτό του κατά την εξομολόγηση. Εγώ, όταν πάω να εξομολογηθώ και πω λ.χ. «θύμωσα» – άσχετα αν χρειαζόταν να δώσω και σκαμπίλι –, δεν αναφέρω το θέμα, για να μη μου δώση ελαφρυντικά ο πνευματικός. Όποιος εξομολογείται και δικαιολογεί τον εαυτό του, δεν έχει ανάπαυση εσωτερική, όσο ασυνείδητος και αν είναι. Τα ελαφρυντικά που χρησιμοποιεί στην εξομολόγησή του γίνονται επιβαρυντικά για την συνείδησή του. Ενώ, όποιος υπερβάλλει τα σφάλματά του, γιατί έχει λεπτή συνείδηση, και δέχεται και μεγάλο κανόνα από τον πνευματικό, αυτός νιώθει ανέκφραστη αγαλλίαση. Υπάρχουν άνθρωποι πού, αν κλέψουν λ.χ. μια ρώγα, νιώθουν σαν να πήραν πολλά καλάθια σταφύλια και σκέφτονται συνέχεια το σφάλμα τους. Δεν κοιμούνται όλη την νύχτα, μέχρι να το εξομολογηθούν. Και άλλοι, ενώ έχουν κλέψει ολόκληρα καλάθια σταφύλια, δικαιολογούν τον εαυτό τους και λένε πώς πήραν ένα τσαμπί. Αυτοί όμως που όχι μόνο δεν δικαιολογούν τον εαυτό τους, αλλά μεγαλοποιούν το παραμικρό σφάλμα τους και στενοχωριούνται και υποφέρουν πολύ για μια μικρή τους αταξία, ξέρετε τί θεία παρηγοριά νιώθουν; Εδώ βλέπεις την θεία δικαιοσύνη, πώς ο Καλός Θεός ανταμείβει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχω παρατηρήσει ότι όσοι εκθέτουν τα σφάλματά τους ταπεινά στον πνευματικό και εξευτελίζονται, λάμπουν, γιατί δέχονται την Χάρη του Θεού. Ένας απόστρατος με πόση συντριβή μου διηγήθηκε ό,τι είχε κάνει από οκτώ χρόνων παιδάκι. Ένα τόπι είχε πάρει από ένα παιδάκι για μια μόνο νύχτα – την άλλη μέρα του το έδωσε – και έκλαιγε, γιατί το στενοχώρησε. Όταν αποστρατεύθηκε, έψαξε και βρήκε όσους είχε λυπήσει, όταν υπηρετούσε – άσχετα αν εκτελούσε καθήκον της υπηρεσίας του –, και τους ζήτησε συγγνώμη! Μου έκανε εντύπωση! Όλα τα έπαιρνε επάνω του. Μένει τώρα σε ένα χωριό και τα χρήματά του τα δίνει ελεημοσύνη. Υπηρετεί και την ηλικιωμένη μάνα του, ενενήντα πέντε χρόνων, κατάκοιτη με ημιπληγία καί, επειδή βλέπει το σώμα της, όταν την φροντίζη, τον πειράζει ο λογισμός. «Αν ο Χάμ που είδε την γύμνωση του πατέρα του τιμωρήθηκε[124], λέει, τότε εγώ...». Συνέχεια έκλαιγε. Το πρόσωπό του ήταν αλλοιωμένο. Πόσο διδάχθηκα από την συντριβή του!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να μεγαλοποιή κανείς τα σφάλματά του, για να δείξη ότι κάνει λεπτή εργασία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εκείνο είναι άλλο· τότε υπερηφανεύεται από την ταπείνωση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Μετά την εξομολόγηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μετά την εξομολόγηση δικαιολογείται να νιώθης βάρος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί να νιώθης βάρος; Με μια σωστή εξομολόγηση σβήνουν όλα τα παλιά. Ανοίγονται νέα δεφτέρια. Έρχεται η Χάρις του Θεού και αλλάζει τελείως ο άνθρωπος. Χάνονται η ταραχή, η αγριάδα, το άγχος και έρχονται η γαλήνη, η ηρεμία. Τόσο αισθητό είναι αυτό ακόμη και εξωτερικά, που λέω σε μερικούς να φωτογραφηθούν πριν από την εξομολόγηση και μετά την εξομολόγηση, για να διαπιστώσουν και οι ίδιοι την καλή αλλοίωση, γιατί στο πρόσωπο ζωγραφίζεται η εσωτερική πνευματική κατάσταση. Τα μυστήρια της Εκκλησίας κάνουν θαύματα. Όσο πλησιάζει κανείς στον Θεάνθρωπο Ιησού Χριστό, θεώνεται, και επόμενο είναι να ακτινοβολή και να προδίδεται από την θεία Χάρη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, μετά από μια ειλικρινή εξομολόγηση νιώθεις αμέσως χαρά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι πάντοτε. Μπορεί και να μη χαρής αμέσως, αλλά σιγά-σιγά γεννιέται μέσα σου η χαρά. Μετά την εξομολόγηση χρειάζεται η φιλότιμη αναγνώριση. Να νιώθης όπως αυτός που του χαρίζεται ένα χρέος που έχει, και από φιλότιμο αισθάνεται ευγνωμοσύνη και υποχρέωση προς τον ευεργέτη του. Να ευχαριστής τον Θεό, αλλά συγχρόνως να ζής και το ψαλμικό: «τήν ανομίαν μου εγώ γινώσκω και η αμαρτία μου ενώπιόν μου εστι διαπαντός»[125], για να μην ξεθαρρεύης και επαναλαμβάνης τα ίδια σφάλματα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, διάβασα κάπου ότι οι δαίμονες θα μας βασανίσουν στην άλλη ζωή ακόμη και για έναν κακό λογισμό που δεν εξομολογηθήκαμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, όταν ο άνθρωπος μετανοήση και πη στον πνευματικό ό,τι θυμόταν, χωρίς να έχη την πρόθεση να κρύψη κάτι, τελείωσε· τα ταγκαλάκια δεν έχουν καμμία εξουσία επάνω του. Όταν όμως δεν εξομολογηθή εν γνώσει του μερικές αμαρτίες του, θα βασανίζεται στην άλλη ζωή γι᾿ αυτές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος εξομολογήθηκε νεανικά του σφάλματα, αλλά πάλι τα σκέφτεται και ταλαιπωρήται, είναι σωστή αντιμετώπιση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν έχη πολλή συντριβή για τα νεανικά του σφάλματα και τα εξομολογήθηκε, δεν υπάρχει λόγος να ταλαιπωρήται, αφού ο Θεός του τα συγχώρησε από την στιγμή που τα εξομολογήθηκε. Στο εξής δεν πρέπει να σκαλίζη τα παλιά, ιδίως σαρκικά αμαρτήματα, γιατί μπορεί να πάθη ζημιά. Στον πόλεμο π.χ. πέφτει μια χειροβομβίδα δίπλα σε έναν στρατιώτη, αλλά τον φυλάει ο Θεός και δεν σκάζει. Όταν τελειώση ο πόλεμος, βρίσκει ο στρατιώτης την χειροβομβίδα που δεν έσκασε και αρχίζει να την περιεργάζεται, και τελικά ανατινάζεται στον αέρα σε καιρό ειρήνης.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η εμπιστοσύνη στον πνευματικό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν στενοχωρεθή κάποιος πολύ, γιατί τον μάλωσε για κάποιο σφάλμα του ο πνευματικός, και πέση σε λύπη, αυτό έχει μέσα εγωισμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ βέβαια, έχει μέσα και εγωισμό. Αν στενοχωρεθή κατά Θεόν, θα έχη παρηγοριά, θα έχη και πρόοδο, γιατί θα προσπαθήση να μην το ξανακάνη. Πρέπει να λέη τις δυσκολίες, τους λογισμούς του, τις πτώσεις του στον πνευματικό και να δέχεται με χαρά και την ήπια και την αυστηρή συμπεριφορά του, γιατί όλα από αγάπη και ενδιαφέρον γίνονται για την πρόοδο της ψυχής του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και άν, Γέροντα, δεν δέχωμαι το μάλωμα ή την παρατήρηση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν δέχεσαι, θα μείνης αδιόρθωτη. Όσοι δεν δέχονται παρατηρήσεις ούτε και από τους ανθρώπους που τους αγαπούν, τελικά παραμένουν στραβόξυλα και αχρηστεύονται μόνοι τους πνευματικά. Όπως οι σανίδες που δεν δέχονται το πλάνισμα του μαραγκού, για να γίνουν έπιπλα, καταλήγουν στα μπετά ή στις σκαλωσιές και πατιούνται και λασπώνονται, μέχρι που καταλήγουν στην φωτιά, έτσι και αυτοί στο τέλος καταστρέφονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος διαφωνή σε ένα θέμα με τον πνευματικό του, τί πρέπει να κάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να πη απλά και ταπεινά τον λογισμό του. Βέβαια χρειάζεται πολλή προσοχή στην εκλογή του πνευματικού, ώστε να μπορή κανείς να τον εμπιστεύεται και να αναπαύεται με την καθοδήγησή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συμφέρει, Γέροντα, όταν κανείς βλέπη κάτι διαφορετικά από τον πνευματικό, να επιμένη στην γνώμη του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, γιατί δεν ξέρει τί κρύβεται πίσω από αυτό που ο ίδιος δεν θεωρεί σωστό. Για να καταλάβη π.χ. κάποιος τί κρύβεται πίσω από μια ενέργεια του πνευματικού του, ίσως ο πνευματικός να πρέπη να του πη την εξομολόγηση ενός άλλου. Επιτρέπεται να πη την εξομολόγηση του άλλου; Ασφαλώς όχι. Ας πούμε ότι έχει συνεννοηθή με τον πνευματικό να τον δη την τάδε ώρα, αλλά την ώρα εκείνη πηγαίνει και κάποιος άλλος που είχε λογισμούς να αυτοκτονήση και ο πνευματικός παίρνει πρώτα εκείνον. Οπότε σκέφτεται: «Πήρε πρώτα αυτόν, εμένα με περιφρονεί». Πώς να του πη όμως ο πνευματικός ότι αυτός είχε φθάσει στο σημείο να κάνη απόπειρα αυτοκτονίας; Αν του εξηγήση, καταστρέφει, χαντακώνει τον άλλον. Ενώ, αν σκανδαλισθή αυτός ή αν κατεβάση τα μούτρα, δεν θα γίνη και μεγάλο κακό. Μια φορά έτσι σκανδαλίσθηκαν μερικοί που ήρθαν εκεί στο Καλύβι. Ήταν κάποιος που τον κατάφεραν με πολλή δυσκολία οι δικοί του να έρθη να συζητήσουμε και τον δέχθηκα με πολλή χαρά. Τον ασπάσθηκα, του έδωσα κομποσχοίνι, εικονάκια. Οι άλλοι παρεξηγήθηκαν. «Εμάς ο Γέροντας, είπαν, ούτε μας έδωσε σημασία». Αυτός ο καημένος ήταν άσωτος· εγώ ήξερα λεπτομέρειες για την ζωή του. Έφυγε μετά άλλος άνθρωπος. Χίλιες φορές να σκανδαλισθούν οι άλλοι. Δεν μπορείς, για να αναπαύσης τον έναν με μια εξήγηση, να καταστρέψης τον άλλον.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η σωστή επικοινωνία με τον πνευματικό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας πνευματικός άνθρωπος, όταν θέλη να βοηθήση κάποιον, προσπαθεί να τον συνδέση με τον Χριστό και όχι να τον δέση με τον εαυτό του. Στην συνέχεια χαίρεται, όταν καταφέρη να τον συνδέση με τον Χριστό, και ο άλλος αγωνίζεται προσβλέποντας στον Χριστό. Τότε και ο ένας και ο άλλος έχει τον μισθό του και τα πράγματα πάνε κανονικά. Όταν όμως ο άνθρωπος αγωνίζεται και κοιτάζη πώς να ευχαριστήση αυτόν που προσπαθεί να τον συνδέση με τον Χριστό, αν δηλαδή μια ενέργειά του θα στενοχωρήση ή θα χαροποιήση εκείνον, και δεν κοιτάζη πώς ο Χριστός βλέπει αυτήν την ενέργειά του, τότε ούτε τον άνθρωπο που τον βοηθάει ευχαριστεί, ούτε τον Χριστό, αλλά ούτε ο ίδιος ωφελείται, γιατί δεν δέχεται θεϊκή βοήθεια. Δηλαδή ούτε ο Χριστός ούτε ο πνευματικός χαίρεται γι᾿ αυτό το οποίο κάνει, αλλά ούτε ο ίδιος βοηθιέται, για να ξεπεράση μια δυσκολία. Ας υποθέσουμε ότι ψάλλει μια αδελφή και σκέφτεται: «Άραγε ψάλλω καλά; Θα χαρή η Γερόντισσα;». Έ, αυτή δεν βοηθιέται. Ενώ, αν ψάλλη για τον Χριστό, τα πράγματα πάνε κανονικά· και καλά θα ψάλη και την Γερόντισσα θα ευχαριστήση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κανείς δεν καταλάβη σωστά αυτό που του είπε ο πνευματικός, φταίει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κοίταξε, αν δεν κατάλαβε, επειδή είχε μια επιθυμία και ο νούς του ήταν εκεί, πάλι φταίει. Μερικοί το θέλημα το δικό τους το κάνουν θέλημα του Θεού. Ρωτάει λ.χ. κάποιος τον πνευματικό του για ένα πρόβλημά του και έχει στον λογισμό του την λύση που θέλει, που τον αναπαύει. Ο πνευματικός του λέει τί πρέπει να κάνη και αυτός καταλαβαίνει ότι του είπε να κάνη αυτό που ήθελε, και το κάνει με χαρά, νομίζοντας κιόλας ότι κάνει υπακοή. Και αν του πη μετά ο πνευματικός «γιατί ενήργησες έτσι;», του λέει: «Έτσι δεν μου είπες να κάνω;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αλλά και μερικές φορές, αυτό που λέει ο πνευματικός, δεν είναι να το πάρη κανείς κατά γράμμα. Μπορεί να είναι τρόπος του λέγειν. Θα σάς πω μια περίπτωση, για να καταλάβετε. Μια σαρανταπεντάρα καθηγήτρια, που είχε και παιδιά, είχε μπλέξει έναν δεκαεξάχρονο μαθητή της. Το παιδί έφυγε από το σπίτι και συζούσε με την καθηγήτρια. Όταν ο πατέρας του ήρθε στο Καλύβι και μου είπε τον πόνο του, του είπα να κάνη για το θέμα αυτό ό,τι του πη ο πνευματικός του. Πήγε λοιπόν ο καημένος στον πνευματικό και μετά ήρθε πάλι σ᾿ εμένα. Εγώ είχα εκείνη την ημέρα την Εξαρχία του Πατριαρχείου[126], δεν μπορούσα να συζητήσω μαζί του και του είπα: «Να κάνης ό,τι σού είπε ο πνευματικός σου». Αυτός δεν έφευγε – και ευτυχώς που δεν έφυγε και επέμενε. Κάποια στιγμή που ευκαίρησα, τον είδα λίγο και μου είπε: «Γέροντα, αποφάσισα να την σκοτώσω αυτήν την γυναίκα, γιατί έτσι μου είπε ο πνευματικός μου». «Για στάσου, καλέ μου άνθρωπε, του λέω, τί ακριβώς σού είπε ο πνευματικός;». «Μου είπε: «Αυτή η γυναίκα είναι για σκότωμα"». Καταλάβατε; Ο πνευματικός είπε, τρόπος του λέγειν, «αυτή η γυναίκα είναι για σκότωμα», όχι να την σκοτώση! Από τότε δεν λέω σε κανέναν: «νά κάνης ό,τι σού είπε ο πνευματικός», αλλά ρωτάω τί του είπε ο πνευματικός...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να ζητάη κάποιος βοήθεια από τον πνευματικό του και συγχρόνως να προτείνη και την λύση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έμ τότε, τί βοήθεια ζητάει; Άλλο είναι να πη ταπεινά σαν λογισμό στον πνευματικό του τί νομίζει ότι θα τον βοηθήση – αυτό επιβάλλεται – και άλλο είναι να επιμένη ότι ο λογισμός του αυτός είναι σωστός. Τότε είναι που δεν κάνει ο άνθρωπος προκοπή. Είναι σαν να πηγαίνη στον γιατρό και να του λέη: «Αυτό το φάρμακο να μου δώσης». Ο άρρωστος οφείλει να κάνη υπακοή στον γιατρό· δεν θα του υποδείξη τί είδους φάρμακα θα του δώση. Δεν είναι εδώ θέμα ορέξεως, όπως με τα φαγητά και τα γλυκά, για να πη κανείς: «Θέλω μπακλαβά ή θέλω κανταΐφι». Ανάλογα με την πάθηση ο γιατρός δίνει και το φάρμακο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Ο πνευματικός ιατρός της ψυχής
- type: h2
  initial:
    ru: ''
  text:
    ru: Ανάγκη καλών πνευματικών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι σήμερα είναι κουρασμένοι, ζαλισμένοι και σκοτισμένοι από την αμαρτία και τον εγωισμό. Γι᾿ αυτό υπάρχει ανάγκη, περισσότερο από κάθε άλλη εποχή, από καλούς και έμπειρους πνευματικούς, που θα πλησιάζουν τους ανθρώπους απλά και με πραγματική αγάπη και θα τους καθοδηγούν με διάκριση, για να ειρηνεύουν. Χωρίς καλούς πνευματικούς αδειάζουν οι εκκλησίες και γεμίζουν τα ψυχιατρεία, οι φυλακές και τα νοσοκομεία. Πρέπει να συναισθανθούν οι άνθρωποι ότι ταλαιπωρούνται, γιατί είναι μακριά από τον Θεό, να μετανοήσουν και να εξομολογηθούν ταπεινά τις αμαρτίες τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η εργασία του πνευματικού είναι εσωτερική θεραπεία. Δεν υπάρχει ανώτερος γιατρός από τον έμπειρο πνευματικό, που εμπνέει εμπιστοσύνη με την αγιότητά του, πετάει από τα ευαίσθητα πλάσματα του Θεού τους λογισμούς που φέρνει το ταγκαλάκι και θεραπεύει ψυχές και σώματα δίχως φάρμακα, με την Χάρη του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο πνευματικός, όταν έχη θείο φωτισμό, πνεύμα Θεού, καταλαβαίνει και διακρίνει καταστάσεις, και μπορεί να δίνη σωστές κατευθύνσεις στις ψυχές. Καλά είναι να μην έχη πολλές απασχολήσεις, για να μπορή να διαθέτη τον απαιτούμενο χρόνο για την κάθε ψυχή και να κάνη σωστά την δουλειά του. Διαφορετικά, παθαίνει ό,τι και ένας καλός χειρουργός πού, όταν κάθε μέρα έχη να κάνη πολλές εγχειρήσεις, κουράζεται και είναι φυσικό να μην αποδίδη όσο μπορεί. Γι᾿ αυτό δεν χρειάζεται να αναμειγνύεται σε όλα τα οικογενειακά θέματα, αλλά να περιορίζεται σε ό,τι σχετίζεται με την συγκεκριμένη κάθε φορά ψυχή, ώστε να έχη τον χρόνο να την βοηθήση αποτελεσματικά. Ούτε όμως ο εξομολογούμενος πρέπει να απασχολή τον πνευματικό με θέματα για τα οποία μπορεί να ρωτήση άλλους πιο αρμόδιους, να τον ρωτάη π.χ. ποιό σπίτι να νοικιάση ή σε ποιό φροντιστήριο να στείλη το παιδί του κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην εξομολόγηση κρίνεται και ο εξομολογούμενος και ο πνευματικός. Πολύ βοηθάει για την καθοδήγηση της ψυχής η ελευθερία η πνευματική. Να μην ακολουθή δηλαδή ο πνευματικός κάποια γραμμή που του βάζουν άλλοι, αλλά να βλέπη τί λένε οι Πατέρες και να ενεργή με διάκριση ανάλογα με τον άνθρωπο, με την πτώση, με την μετάνοια. Βλέπω όμως μερικές φορές ότι δεν υπάρχει ειλικρίνεια. Μερικοί που έχουν ευθύνη για τις ψυχές δεν κάθονται να πούν στον άλλον, που είναι λ.χ. μπλεγμένος με μάγους, με πλανεμένους κ.λπ., μια κουβέντα, να τον προβληματίσουν λίγο, να πάρουν μια θέση, για να μην έχουν φασαρίες μαζί τους. Δηλαδή, για να μην τα χαλάσουμε με τον έναν και με τον άλλον και για να λένε καλά λόγια για μάς, να αφήσουμε τον άνθρωπο να καταστραφή και να χαίρεται ο διάβολος;
- type: h2
  initial:
    ru: ''
  text:
    ru: Η διάκριση και η πείρα του πνευματικού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στην εποχή μας, με την τόση αμαρτία που υπάρχει στον κόσμο, δεν είναι δύσκολη μερικές φορές η θέση του πνευματικού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, είναι δύσκολη. Γι᾿ αυτό στην αρχή καλά είναι ο πνευματικός να προσπαθή να διορθώνη τα πολύ σοβαρά αμαρτήματα, μέχρι να φύγη η πολλή αμαρτία από τα πλάσματα του Θεού και να γίνουν πιο δεκτικά. Να φέρεται με επιείκεια, αλλά συγχρόνως με τρόπο να καθοδηγή τον άνθρωπο έτσι, ώστε να καταλάβη τα σφάλματά του και να ζητήση από τον Θεό συγχώρηση. Είναι απαραίτητο να τονίζη στον εξομολογούμενο ότι χρειάζεται μετάνοια, αλλαγή ζωής, για να λάβη το έλεος του Θεού. Επίσης πολύ βοηθάει να μιλάη στους ανθρώπους με αγάπη για την μεγάλη αγάπη του Θεού, ώστε μόνοι τους να φιλοτιμηθούν, να αισθανθούν τα λάθη τους και να αλλάξουν συνήθειες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας νέος πνευματικός, μέχρι να αποκτήση πείρα, είναι καλύτερα να βοηθάη σε εύκολες περιπτώσεις. Μπορεί λ.χ. μια δύσκολη ψυχή να καθυστερή την πνευματική του πρόοδο με τα σαμποτάζ που θα του κάνη και να του τρώη όλον τον χρόνο. Αν δεν προσέξη, με την καλή του διάθεση θα δίνη πάντοτε σημασία στις σκηνές που θα κάνη μια τέτοια ψυχή, θα ξοδεύη άσκοπα τις δυνάμεις του και θα ταλαιπωρήται. Όταν αποκτήση πείρα, θα ξέρη πότε πρέπει να δώση σημασία και πότε να αδιαφορήση. Νά, τώρα εγώ στα γράμματα που μου στέλνουν ρίχνω μια ματιά καί, αν είναι κάτι σοβαρό, σ᾿ εκείνο θα δώσω προσοχή. Είναι και του πειρασμού πολλές φορές. Άλλος σού λέει: «δυό λεπτά, κάτι θα σού πω εδώ στην πόρτα» και σε κρατάει μια ώρα. Να είσαι ιδρωμένος, να σε χτυπάη εν τω μεταξύ το ρεύμα, να τρέμης, και να σού λέη ιστορίες, σαν να μη συμβαίνη τίποτε. Έ, από τον Θεό είναι αυτό; Μετά αρρωσταίνεις, δεν μπορείς να κάνης προσευχή ούτε για τον κόσμο ούτε για τον εαυτό σου, και αχρηστεύεσαι για μέρες. Έρχεται ύστερα κάποιος που ο καημένος έχει πραγματική ανάγκη, και δεν μπορείς να τον βοηθήσης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αυτούς πάλι που έχουν κάποιο σοβαρό πρόβλημα, δεν φθάνει να τους ακούσης, να δής ότι έχουν έναν πόνο και να τους πής: «Πάρε μια ασπιρίνη». «Ένα λεπτό να σε απασχολήσω, λένε μερικοί, γιατί φεύγει το αυτοκίνητο», και σού λένε ένα σοβαρό θέμα. Σαν να έχη κάποιος καρκίνο και να λέη στον γιατρό: «Κάνε μια εγχείρηση, γιατί φεύγω σε λίγο με το αεροπλάνο!». Κάθε πάθηση θέλει τον ανάλογο χρόνο. Να δής από που ξεκινάει, τί συμπτώματα έχει κ.λπ. Σε ένα σοβαρό θέμα δεν μπορείς να δώσης πρόχειρες λύσεις. Ένας δόκιμος μοναχός με πλησίασε στην λιτανεία που κάνουν στο Άγιον Όρος την Διακαινήσιμο εβδομάδα, ακριβώς μόλις πήραμε μια ανηφόρα, και ήθελε να του πω περί νοεράς προσευχής. Τόσες φορές είχε έρθει στο Καλύβι και ποτέ δεν ρώτησε γι᾿ αυτό το θέμα, και εκεί, πάνω στην ανηφόρα, είχε την έμπνευση να ρωτήση για ένα τόσο λεπτό θέμα! Ένα λεπτό και σοβαρό θέμα δεν συζητιέται ούτε στο πόδι ούτε στον ανήφορο...'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο πνευματικός καθορίζει κάθε πότε θα κοινωνάη ο πιστός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, ο Απόστολος Παύλος γράφει: «Ο εσθίων και πίνων αναξίως κρίμα εαυτώ εσθίει και πίνει»[127]. Πότε κοινωνάει κανείς «αναξίως»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βασικά πρέπει να προσερχώμαστε στην θεία Κοινωνία έχοντας συναίσθηση της αναξιότητός μας. Ο Χριστός ζητά από μας την συντριβή και την ταπείνωση. Όταν υπάρχη κάτι που ενοχλεί την συνείδησή μας, πρέπει να το τακτοποιούμε. Αν π.χ. μαλώσαμε με κάποιον, πρέπει να συμφιλιωθούμε μαζί του και ύστερα να κοινωνήσουμε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί, ενώ έχουν ευλογία από τον πνευματικό να κοινωνήσουν, διστάζουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν θα ρυθμίση κανείς μόνος του, αν θα κοινωνήση ή όχι. Αν μόνος του αποφασίζη να κοινωνήση ή να μην κοινωνήση, θα το εκμεταλλευτή ο διάβολος και θα του ανοίξη δουλειά. Πολλές φορές νομίζουμε ότι είμαστε άξιοι, ενώ δεν είμαστε, ή άλλοτε σύμφωνα με τον νόμο πράγματι δεν είμαστε άξιοι, αλλά σύμφωνα με το πνεύμα των Αγίων Πατέρων χρειάζεται η θεία μετάγγιση για νοσηλεία και η θεία παρηγοριά, γιατί από την πολλή συντριβή της μετανοίας μπορεί να έρθη από τα δεξιά ο εχθρός και να μας ρίξη σε απόγνωση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, κάθε πότε πρέπει να κοινωνάη κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Το κάθε πότε πρέπει να κοινωνάη κανείς και το πόσο πρέπει να νηστεύη πριν από την θεία Κοινωνία δεν μπαίνουν σε καλούπι. Ο πνευματικός θα καθορίζη με διάκριση κάθε πότε θα κοινωνάη και πόσο θα νηστεύη, ανάλογα με την αντοχή που έχει. Παράλληλα θα τον οδηγή και στην πνευματική νηστεία, την αποχή από τα πάθη, ρυθμίζοντάς την και αυτήν ανάλογα με την πνευματική του ευαισθησία, ανάλογα δηλαδή με το πόσο συναισθάνεται το σφάλμα του, και έχοντας υπ᾿ όψιν του το κακό που μπορεί να κάνη ο εχθρός πολεμώντας μια ευαίσθητη ψυχή, για να την φέρη σε απόγνωση. Σε πτώσεις λ.χ. σαρκικές, για τις οποίες δίνεται κανόνας σαράντα ημερών αποχής από την θεία Κοινωνία, μπορεί ο διάβολος να ρίξη πάλι την ψυχή στις τριάντα πέντε ημέρες καί, αν δοθή νέος κανόνας σαράντα ημερών, ο διάβολος θα πάρη φαλάγγι την ψυχή, οπότε ζαλίζεται και απελπίζεται. Σ᾿ αυτές τις περιπτώσεις μπορεί ο πνευματικός, μετά τον πρώτο κανόνα, να πή: «κοίταξε, πρόσεξε μια εβδομάδα και να κοινωνήσης», και ύστερα να κοινωνάη συνέχεια σε κάθε θεία Λειτουργία, για να μπορέση να πάρη επάνω της η ψυχή και να πάη ο διάβολος πέρα. Ένας πάλι που ζη πνευματική και προσεκτική ζωή θα προσέρχεται στο μυστήριο, όποτε αισθάνεται την θεία Κοινωνία ως ανάγκη και όχι από συνήθεια, αλλά και αυτό θα γίνεται με την ευλογία του πνευματικού του.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η χρήση των επιτιμίων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η ακριβής τήρηση των εντολών βοηθάει να έχουμε την αίσθηση του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιών εντολών; του Μωσαϊκού Νόμου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, του Ευαγγελίου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η τήρηση των εντολών βοηθάει, αλλά η σωστή τήρηση, γιατί μπορεί κανείς να τηρή τις εντολές και λανθασμένα. Στην πνευματική ζωή χρειάζεται η θεία δικαιοσύνη και όχι η ξερή εφαρμογή του νόμου. Βλέπουμε και οι Άγιοι Πατέρες με πόση διάκριση έλεγαν να εφαρμόζωνται οι ιεροί κανόνες! Ο Μέγας Βασίλειος, ο πιο αυστηρός Πατέρας της Εκκλησίας, που έχει γράψει τους πιο αυστηρούς κανόνες, αναφέρει τον κανόνα που ισχύει για μια αμαρτία, αλλά μετά ο ίδιος προσθέτει: «Μήν εξετάζης χρόνο αλλά τρόπο μετανοίας»[128]. Δηλαδή, αν δύο άνθρωποι κάνουν την ίδια αμαρτία, ο πνευματικός, ανάλογα με την μετάνοια του καθενός, μπορεί στον έναν να βάλη κανόνα να μην κοινωνήση δύο χρόνια και στον άλλον δύο μήνες. Τόση διαφορά δηλαδή!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, το επιτίμιο βοηθάει να κοπή ένα πάθος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πρέπει να καταλάβη ότι το επιτίμιο θα τον βοηθήση. Αλλιώς, τί να πη κανείς; Αν προσπαθής να διορθώσης έναν άνθρωπο με το ξύλο, δεν κάνεις τίποτε. Την ημέρα της Κρίσεως ο Χριστός σ᾿ εσένα, που πήγες να τον διορθώσης δια της βίας, θα πή: «Διοκλητιανός ήσουν;» και σ᾿ εκείνον θα πή: «Ό,τι έκανες, το έκανες δια της βίας». Δεν θα τον πνίξουμε τον άλλο, για να τον στείλουμε στον Παράδεισο, αλλά θα τον βοηθήσουμε να ζητήση μόνος του να κάνη κάποια άσκηση. Να φθάση να χαίρεται γιατί ζή, να χαίρεται γιατί πεθαίνει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα επιτίμια είναι στην διάκριση του πνευματικού. Στους εν ψυχρώ αμαρτάνοντας ο πνευματικός πρέπει να είναι ανυποχώρητα αυστηρός. Αυτόν που νικιέται, αλλά μετανοεί, ταπεινώνεται, ζητάει με συστολή συγχώρεση, θα τον βοηθάη με διάκριση να πλησιάση πάλι στον Θεό. Έτσι έκαναν και τόσοι Άγιοι. Ο Άγιος Αρσένιος ο Καππαδόκης λ.χ. ως πνευματικός συνήθως δεν έβαζε κανόνα στους ανθρώπους. Προσπαθούσε να τους φέρη σε συναίσθηση, ώστε από φιλότιμο να ζητήσουν μόνοι τους να κάνουν άσκηση ή ελεημοσύνες ή άλλου είδους καλωσύνες. Όταν έβλεπε κανένα παιδάκι δαιμονισμένο ή παράλυτο και καταλάβαινε ότι οι γονείς ήταν αιτία που ταλαιπωρείται το καημένο, θεράπευε πρώτα το παιδί και έδινε κανόνα στους γονείς, για να προσέχουν στην συνέχεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί λένε: «Ά, ο τάδε πνευματικός είναι πολύ πατερικός. Πολύ αυστηρός! Είναι έξυπνος, έχει μνήμη, ξέρει το Πηδάλιο[129]απ᾿ έξω». Ένας πνευματικός όμως που εφαρμόζει κατά γράμμα τους κανόνες που αναφέρει το Πηδάλιο μπορεί να κάνη κακό στην Εκκλησία. Δεν βοηθάει να πάρη ο πνευματικός το Πηδάλιο και να αρχίση: «Τί αμαρτία έκανες εσύ; Αυτή. Τί γράφει εδώ γι᾿ αυτήν την περίπτωση; Τόσα χρόνια αποχή από την θεία Κοινωνία! Εσύ τί έκανες; Αυτό. Τί γράφει εδώ; Αυτόν τον κανόνα!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πρέπει, Γέροντα, κανείς να λαμβάνη υπ᾿ όψιν του δεκάδες πράγματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, ιδίως στην σημερινή εποχή δεν είναι να πάη κανείς να εφαρμόση όλον τον νόμο της Εκκλησίας με μια αδιάκριτη αυστηρότητα, αλλά πρέπει να καλλιεργήση το φιλότιμο στους ανθρώπους. Να κάνη πρώτα δουλειά στον εαυτό του, για να μπορή να βοηθάη τις ψυχές, αλλιώς θα σπάζη κεφάλια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το Πηδάλιο λέγεται πηδάλιο, γιατί οδηγεί προς την σωτηρία τον άνθρωπο πότε με τον έναν τρόπο και πότε με τον άλλον, όπως ο καραβοκύρης πάει το πηδάλιο πότε αριστερά και πότε δεξιά, για να βγάλη το καράβι στην ακτή. Αν το πάη ολόισια, χωρίς να στρίψη όπου χρειάζεται, θα ρίξη το καράβι πάνω στα βράχια, θα το βουλιάξη και θα πνιγούν οι άνθρωποι. Αν ο πνευματικός χρησιμοποιή τους κανόνες σάν... κανόνια, και όχι με διάκριση, ανάλογα με τον άνθρωπο, με την μετάνοια που έχει κ.λπ., αντί να θεραπεύη ψυχές, θα εγκληματή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η συγχωρητική ευχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί πνευματικοί έχουν ένα τυπικό: Όταν δεν επιτρέπεται ο εξομολογούμενος να κοινωνήση, δεν του διαβάζουν συγχωρητική ευχή. Υπάρχουν και άλλοι που λένε: «Είναι η γραμμή μας να μη διαβάζουμε πάντοτε συγχωρητική ευχή». Αυτό είναι κάτι σαν προτεσταντικό... Ήρθε ένα παιδί στο Καλύβι που είχε μερικές πτώσεις. Πήγε, εξομολογήθηκε, αλλά δεν του διάβασε συγχωρητική ευχή ο πνευματικός. Το καημένο, το έπιασε απελπισία. «Για να μη μου διαβάση ευχή ο πνευματικός, άρα δεν με συγχωράει και ο Θεός», σκέφθηκε και πήγαινε για αυτοκτονία. «Να πάς, του λέω, στον πνευματικό να σού διαβάση ευχή. Και αν δεν σού διαβάση αυτός, να πάς σε άλλον πνευματικό».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χωρίς συγχωρητική ευχή θα έχη συνέχεια πτώσεις ο άνθρωπος, γιατί δεν χάνει ο διάβολος τα δικαιώματα. Πώς να παλέψη ο άνθρωπος, αφού ο διάβολος έχει ακόμη δικαιώματα; Δεν είναι ελευθερωμένος· δέχεται δαιμονικές επιδράσεις. Ενώ με την συγχωρητική ευχή κόβονται οι επιδράσεις, γίνεται ανακατάληψη του εδάφους, οπότε ο καημένος βοηθιέται και μπορεί να παλέψη, να αγωνισθή, για να απαλλαγή από τα πάθη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 4 – Η εργασία του πνευματικού στις ψυχές
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο χειρισμός της ψυχής είναι λεπτός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γέροντα, μερικοί χαρακτήρες που είναι δύσκολοι, στριμμένοι, πώς θα βοηθηθούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ σαν μαραγκός δούλευα και στριμμένα ξύλα. Χρειαζόταν όμως υπομονή, γιατί τα στριφτά ξύλα τα πλανίζεις από ᾿δώ, σηκώνουν αντιξυλιά, τα πλανίζεις από ᾿κεί, σηκώνουν πάλι αντιξυλιά. Τα έτριβα λοιπόν με το διπλό λεπίδι λίγο από την μια μεριά κόντρα, λίγο από την άλλη, και έτσι τα έφερνα σε λογαριασμό. Γίνονταν μάλιστα πολύ όμορφα, επειδή και ωραία νερά έχουν και δεν σπάζουν εύκολα· έχουν πολλή αντοχή. Αν δεν το ήξερες αυτό, μπορεί να τα έβλεπες έτσι και να τα πετούσες. Θέλω να πώ, και οι άνθρωποι που έχουν δύσκολο χαρακτήρα, έχουν μέσα τους δυνάμεις καί, αν αφεθούν να τους δουλέψης, μπορούν να κάνουν άλματα στην πνευματική ζωή, αλλά χρειάζεται να διαθέσης αρκετό χρόνο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ύστερα, ποτέ δεν χρησιμοποιούσα μεγάλες πρόκες, για να σφίξω δυο στραβές σανίδες, αλλά πρώτα τις πλάνιζα, τις έφερνα σε λογαριασμό, και τις ένωνα με ένα καρφάκι. Δεν τις ζόριζα, για να σφίξουν, γιατί, όταν τις στραβές σανίδες προσπαθούμε να τις κάνουμε να εφαρμόσουν με μεγάλες πρόκες, θα σχισθούν και πάλι θα βγουν από την ζορισμένη εφαρμογή τους, οπότε τί καταλάβαμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Χρειάζεται διάκριση και ξανά διάκριση, όταν έχη κανείς να κάνη με ψυχές. Στην πνευματική ζωή δεν υπάρχει μία συνταγή, ένας κανόνας. Η κάθε ψυχή έχει την δική της ποιότητα και χωρητικότητα. Υπάρχουν δοχεία με μεγάλη χωρητικότητα και δοχεία με μικρή χωρητικότητα. Άλλα είναι πλαστικά και δεν αντέχουν πολύ και άλλα είναι μεταλλικά και αντέχουν. Όταν ο πνευματικός γνωρίση την ποιότητα και την χωρητικότητα της ψυχής, θα ενεργή ανάλογα με τις δυνατότητες και με την κληρονομικότητα που έχει, και με την πρόοδο που έχει κάνει. Η συμπεριφορά του θα είναι ανάλογη με την κατάσταση στην οποία βρίσκεται ο εξομολογούμενος, με την αμαρτία που έκανε, και με ένα σωρό άλλα. Στον αναιδή θα προσέξη να μη δίνη δικαίωμα για αναίδεια. Την ευαίσθητη ψυχή θα κοιτάξη πώς να την βοηθήση να αντιμετωπίση με ανδρισμό τα προβλήματά της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Επίσης θέλει προσοχή να μη βασίζεται κανείς σ᾿ αυτό που βλέπει εξωτερικά σ᾿ έναν άνθρωπο και να μην πιστεύη εύκολα αυτά που του λένε και βγάζει συμπεράσματα, ειδικά αν δεν έχη το χάρισμα να βλέπη βαθύτερα. Μερικές σανίδες, ενώ φαίνονται κατάγερες απ᾿ έξω, μέσα είναι όλο ίνες. Όταν πλανισθή το χνούδι που έχουν απ᾿ έξω, τότε δείχνουν τί είναι. Άλλες πάλι, ενώ απ᾿ έξω φαίνονται άχρηστες, μέσα είναι δαδένιες[130].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο χειρισμός της ψυχής είναι λεπτός. Δεν πρέπει να γίνωνται λάθη στις συνταγές. Ο κάθε οργανισμός, βλέπετε, έχει ανάγκη από την βιταμίνη που του λείπει και η κάθε πάθηση από τα ανάλογα φάρμακα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να μην αναπαύουμε τον άλλον στα πάθη του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, όταν κάποια γυναίκα μας πή: «δέν με κατάλαβε ο πνευματικός», τί πρέπει να της πούμε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πέστε της: «Μήπως εσύ δεν του έδωσες να καταλάβη; Μήπως το σφάλμα είναι δικό σου;». Σ᾿ αυτές τις περιπτώσεις να προβληματίζετε τον άλλον, να μην τον δικαιολογήτε εύκολα. Τα πράγματα είναι πολύ λεπτά. Εδώ, βλέπεις, και τους πνευματικούς ακόμη τους μπερδεύουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και αν μας πη ότι δεν αναπαύεται στον πνευματικό της;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να μην αναπαύεται, μήπως φταίει και αυτή, μήπως ζητά να την αναπαύη ο πνευματικός στο θέλημά της. Κάποιος, ας υποθέσουμε, αδιαφορεί για την οικογένειά του και έχουν συνέχεια φασαρίες με την γυναίκα του. Θέλει να την χωρίση και έρχεται και μου κάνει παράπονα, με την απαίτηση να πάρω το μέρος του, για να διαλύσω την οικογένειά του! Αν του πώ: «εσύ είσαι ένοχος για όλη την ιστορία», αν δεν συναισθανθή την ενοχή του, θα πη ότι δεν τον ανέπαυσα. Λένε δηλαδή μερικοί: «δέν με ανέπαυσε ο πνευματικός», γιατί δεν τους λέει να κάνουν αυτό που θέλουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν ο πνευματικός δικαιολογή τα πάθη του καθενός, μπορεί να τους αναπαύση όλους, αλλά δεν βοηθιούνται έτσι οι άνθρωποι. Αν είναι να αναπαύουμε τον καθέναν στα πάθη του, τότε ας αναπαύσουμε και τον διάβολο. Έρχεσαι λ.χ. εσύ και μου λές: «Η τάδε αδελφή μου μίλησε άσχημα». «Έ, σού λέω, μη δίνης σημασία σ᾿ αυτήν», και σε αναπαύω. Έρχεται μετά από λίγο αυτή η αδελφή και μου λέει για σένα: «Η τάδε αδελφή έτσι και έτσι έκανε». «Έ, τώρα, της λέω, καλά, δεν την ξέρεις αυτήν; Μήν την παίρνης και στα σοβαρά». Την ανέπαυσα και αυτήν. Έτσι όλους τους αναπαύω, αλλά και όλους τους πεδικλώνω! Ενώ πρέπει να σού πώ: «έλα εδώ· για να σού μιλήση έτσι η αδελφή, κάτι της έκανες», οπότε θα αισθανθής την ενοχή σου και θα διορθωθής. Γιατί, από την στιγμή που θα αισθανθής την ενοχή σου, όλα θα πάνε καλά. Η πραγματική ανάπαυση έρχεται, όταν τοποθετηθή ο άνθρωπος σωστά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σκοπός είναι πώς θα αναπαυθούμε στον Παράδεισο, όχι πώς θα αναπαυθούμε στην γή. Είναι μερικοί πνευματικοί που αναπαύουν τον λογισμό του άλλου, και μετά εκείνος λέει: «πολύ με ανέπαυσε ο πνευματικός», αλλά μένει αδιόρθωτος. Ενώ πρέπει να βοηθήσουν τον άνθρωπο να βρη τα κουσούρια του, να διορθωθή και στην συνέχεια να τον κατευθύνουν. Τότε μόνον έρχεται η πραγματική ανάπαυση. Το να αναπαύσης τον άλλον στα πάθη του, δεν είναι βοήθεια· αυτό για μένα είναι έγκλημα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να μπορέση να βοηθήση ο πνευματικός δύο ανθρώπους που έχουν σχέση, πρέπει να έχη επικοινωνία και με τους δύο. Όταν ακούη λ.χ. λογισμούς δύο ανθρώπων που έχουν διαφορές, πρέπει να γνωρίζη και τις δύο ψυχές, γιατί ο καθένας μπορεί να παρουσιάζη το θέμα, όπως το καταλαβαίνει. Και να δεχθή να λύση τις διαφορές τους, μόνον αν δεχθούν να τις λύση σύμφωνα με το Ευαγγέλιο, γιατί όλες οι άλλες λύσεις είναι ένας συνεχής πονοκέφαλος και χρειάζονται συνέχεια ασπιρίνες. Ύστερα να βάλη τον καθέναν στην θέση του· να μη δικαιώση κανέναν. Να πη στον καθέναν τα κουσούρια του, οπότε πελεκιέται το ένα στραβό, πελεκιέται και το άλλο, και έτσι συμφωνούν και συνεννοούνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Το μόνο καλό που έχω είναι αυτό: ποτέ δεν δικαιώνω κανέναν, έστω και αν δεν φταίη. Όταν λ.χ. έρχωνται οι γυναίκες και μου λένε ότι έχουν προβλήματα στην οικογένεια και φταίει ο άνδρας, κατσαδιάζω τις γυναίκες. Όταν έρχωνται οι άνδρες και κάνουν παράπονα για τις γυναίκες, κατσαδιάζω τους άνδρες. Δεν αναπαύω τον λογισμό τους, αλλά λέω τα στραβά του καθενός· λέω στον καθέναν αυτό που του χρειάζεται, για να βοηθηθή. Αλλιώς φεύγει αναπαυμένος ο ένας, φεύγει αναπαυμένος και ο άλλος, και στο σπίτι πιάνονται μεταξύ τους. «Είχε δίκιο που μου είπε για σένα έτσι!». «Και σ᾿ εμένα ξέρεις τί είπε για σένα;». Θέλω να πώ, κανέναν δεν αναπαύω στα πάθη του. Πολλούς μάλιστα τους μαλώνω πολύ – φυσικά για το καλό τους –, αλλά φεύγουν πραγματικά αναπαυμένοι. Μπορεί να φεύγουν πικραμένοι, αλλά μέσα τους καταλαβαίνουν ότι εγώ πικράθηκα πιο πολύ από αυτούς, και αυτό τους πληροφορεί.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικοί, Γέροντα, νιώθουν σιγουριά, όταν τους μαλώνετε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατί δεν τον μαλώνω τον άλλον ξερά. Θα του πω ότι έχει αυτά τα καλά, για να τα αξιοποιήση, και αυτά τα κουσούρια, για να τα διορθώση. Όταν δεν του πής την αλήθεια, τότε, σε μια στιγμή που δεν κολακεύεται, παλαβώνει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αντιμετώπιση περιπτώσεων απελπισίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ήρθε κάποιος νεαρός αναστατωμένος και μου είπε: «Γέροντα, δεν πρόκειται να διορθωθώ. Μου είπε ο πνευματικός μου: «αυτά είναι και κληρονομικά..."». Τον είχε πιάσει απελπισία. Εγώ, όταν μου πη κάποιος ότι έχει προβλήματα κ.λπ., θα του πώ: « Αυτό συμβαίνει γι᾿ αυτόν και γι᾿ αυτόν τον λόγο· για ν᾿ αλλάξης, πρέπει να κάνης εκείνο κι εκείνο». Έχει λ.χ. κάποιος έναν λογισμό που τον βασανίζει και δεν κοιμάται, παίρνει χάπια για το κεφάλι, για το στομάχι και με ρωτάει: «Να κόψω τα χάπια;». «Όχι, του λέω, να μην κόψης τα χάπια. Να πετάξης τον λογισμό που σε βασανίζει και ύστερα να τα κόψης. Αν δεν πετάξης τον λογισμό, έτσι θα πάς· θα ταλαιπωρήσαι». Γιατί, τί θα ωφελήση να κόψη τα χάπια, όταν κρατάη μέσα του τον λογισμό που τον βασανίζει;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλά είναι ο πνευματικός να μη φθάνη μέχρι του σημείου να ανάβη κόκκινο φώς· να ανέχεται λίγο μία κατάσταση, αλλά φυσικά πρέπει και ο άλλος να δουλεύη σωστά, για να βοηθηθή. Ένας νεαρός ζόρισε κάποια φορά την αρραβωνιαστικιά του – ποιός ξέρει τί της έλεγε; – και εκείνη από την αγανάκτησή της πήρε το αυτοκίνητο και έφυγε και στον δρόμο σκοτώθηκε. Μετά ο νεαρός ήθελε να αυτοκτονήση, γιατί ένιωθε ότι αυτός έγινε αιτία και σκοτώθηκε η κοπέλα. Όταν ήρθε και μου το είπε, αν και στην ουσία είχε κάνει έγκλημα, τον παρηγόρησα και τον έφερα σε λογαριασμό. Έπειτα όμως το έρριξε τελείως έξω, έγινε τελείως αδιάφορος, βρήκε εν τω μεταξύ και μια άλλη. Όταν ξαναήρθε μετά από δύο-τρία χρόνια, του έδωσα ένα τράνταγμα γερό, γιατί τότε δεν υπήρχε κίνδυνος να αυτοκτονήση. Χρειαζόταν το τράνταγμα, αφού δεν υπήρχε αναγνώριση. «Δεν καταλαβαίνεις, του είπα, ότι έκανες φόνο, ότι έγινες αιτία και σκοτώθηκε η κοπέλα;». Αν δούλευε σωστά, θα συνέχιζε να υποφέρη, αλλά θα ανταμειβόταν με θεϊκή παρηγοριά· δεν θα έφθανε σ᾿ αυτήν την κατάσταση την αλήτικη της αδιαφορίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θέλει δηλαδή πολλή προσοχή. Κάνει κάποιος ένα σφάλμα και πέφτει στην απελπισία. Εκείνη την στιγμή μπορεί να τον παρηγορήσης, αλλά, για να μη βλαφθή, χρειάζεται και το δικό του φιλότιμο. Μια φορά είχε έρθει στο Καλύβι ένα νέο παιδί απελπισμένο, γιατί έπεφτε σε σαρκική αμαρτία και δεν μπορούσε να απαλλαγή από αυτό το πάθος. Είχε πάει σε δυο πνευματικούς που προσπάθησαν με αυστηρό τρόπο να το βοηθήσουν να καταλάβη ότι είναι βαρύ αυτό που κάνει. Το παιδί απελπίσθηκε. «Αφού ξέρω ότι αυτό που κάνω είναι αμαρτία, είπε, και δεν μπορώ να σταματήσω να το κάνω και να διορθωθώ, θα κόψω κάθε σχέση μου με τον Θεό». Όταν άκουσα το πρόβλημά του, το πόνεσα το καημένο και του είπα: «Κοίταξε, ευλογημένο, ποτέ να μην ξεκινάς τον αγώνα σου από αυτά που δεν μπορείς να κάνης, αλλά από αυτά που μπορείς να κάνης. Για να δούμε τί μπορείς να κάνης, και να αρχίσης από αυτά. Μπορείς να  εκκλησιάζεσαι κάθε Κυριακή;». «Μπορώ», μου λέει. «Μπορείς να νηστεύης κάθε Τετάρτη και Παρασκευή;». «Μπορώ». «Μπορείς να δίνης ελεημοσύνη το ένα δέκατο από τον μισθό σου ή να επισκέπτεσαι αρρώστους και να τους βοηθάς;». «Μπορώ». «Μπορείς να προσεύχεσαι κάθε βράδυ, έστω κι αν αμάρτησες, και να λές «Θεέ μου, σώσε την ψυχή μου»;». «Θα το κάνω, Γέροντα», μου λέει. «Άρχισε λοιπόν, του λέω, από σήμερα να κάνης όλα αυτά που μπορείς, και ο παντοδύναμος Θεός θα κάνη το ένα που δεν μπορείς». Το καημένο ηρέμησε και συνέχεια έλεγε: «Σ᾿ ευχαριστώ, πάτερ». Είχε, βλέπεις, φιλότιμο και ο Καλός Θεός το βοήθησε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Αυστηρότητα στους αναιδείς, επιείκεια στους φιλότιμους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν ένας άνθρωπος έχη αγαθή προαίρεση, αλλά δεν βοηθήθηκε από μικρός, δεν είναι κολακεία να του πής τα καλά που βλέπεις σ᾿ αυτόν, γιατί κατ᾿ αυτόν τον τρόπο βοηθιέται και αλλοιώνεται, επειδή δικαιούται και την θεία βοήθεια. Είπα σε κάποιον: «Εσύ είσαι καλός. Δεν ταιριάζουν σ᾿ εσένα αυτά που κάνεις». Του το είπα αυτό, γιατί είδα το καλό του χωράφι και τον κακό σπόρο που είχε ρίξει. Είδα ότι εσωτερικά ήταν καλός καί, ό,τι κακό έκανε, ήταν εξωτερικό. Δεν του είπα: «είσαι καλός», για να τον κολακέψω, αλλά για να τον βοηθήσω, να του κινήσω το φιλότιμο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί έχουν το εξής τυπικό: Έχει, δεν έχει ο άλλος κάποιο χάρισμα, του λένε: «δέν έχεις χάρισμα», δήθεν για να μην υπερηφανευθή και βλαφθή. Ένα ισοπέδωμα δηλαδή. Όταν όμως απελπίζεται ο άλλος για το κακό που κάνει, απελπίζεται και για το καλό που έχει, τότε πώς θα ξεθαρρέψη, για να αγωνισθή με προθυμία; Ενώ, αν του πής τα καλά που έχει και του καλλιεργήσης το φιλότιμο και την αρχοντιά, βοηθιέται, αναπτύσσεται και προχωράει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εγώ έχω τυπικό, όταν βλέπω ότι κάποιος έχει ένα χάρισμα ή ότι πάει καλά στον αγώνα του, να του το λέω καί, όταν βλέπω κάτι στραβό, να παίρνω βρεγμένη σανίδα... Δεν σκέφτομαι μήπως βλαφτή η ψυχή με τον πρώτο ή τον δεύτερο τρόπο, επειδή και οι δύο τρόποι έχουν αγάπη. Αν βλαφθή από την συμπεριφορά μου, αυτό σημαίνει ότι θα έχη βλάβη. Αν π.χ. η εικόνα που έκανε μια αδελφή είναι καλή, θα της πω ότι είναι καλή. Αν δώ ότι υπερηφανεύθηκε και αρχίζει να αποκτάη αναίδεια, θα της δώσω μια και θα την κάνω πέρα. Φυσικά, αν υπερηφανευθή, θα κάνη μετά καρικατούρες, οπότε θα φάη άλλο μάλωμα. Αν ταπεινωθή ξανά, θα κάνη πάλι καλή δουλειά. Εμένα αρρωστημένα πράγματα δεν με αναπαύουν. Στραμπουλιγμένα πράγματα δεν τα μπορώ. Θα τα κάνω έτσι από ᾿δώ, έτσι από ᾿κεί, ώστε να βρουν την θέση τους. Τί; θα οικονομάω αρρωστημένες καταστάσεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ο αναιδής γίνεται πιο αναιδής από το ενδιαφέρον που του δείχνεις, πώς θα τον βοηθήσης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να σού πώ: όταν βλέπω ότι ο άλλος δεν βοηθιέται από το ενδιαφέρον μου, την καλωσύνη, την αγάπη, τότε λέω ότι δεν έχω συγγένεια μαζί του και αναγκάζομαι να μην του φέρωμαι με καλωσύνη. Κανονικά, όσο καλωσύνη σού δείχνουν, τόσο πρέπει να αλλοιώνεσαι, να διαλύεσαι, να λειώνης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιά τί είχε συμβή με κάποιον. Στην αρχή, για να τον βοηθήσω, αναγκάστηκα να του πω μερικά θεία γεγονότα που είχα ζήσει. Αντί όμως να πή: «Θεέ μου, πώς να Σε ευχαριστήσω γι᾿ αυτήν την παρηγοριά κ.λπ.» και να διαλυθή, πήρε θάρρος και φερόταν με αναίδεια. Τότε κράτησα μια αυστηρή στάση. «Θα τον βοηθώ, είπα, από μακριά με την προσευχή». Αυτό το έκανα, όχι γιατί δεν τον αγαπούσα, αλλά γιατί αυτός ο τρόπος θα τον βοηθούσε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και άν, Γέροντα, καταλάβη, το λάθος του και ζητήση συγγνώμη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν το καταλάβη, εντάξει, μπορούμε να συνεννοηθούμε. Διαφορετικά, αν δεν βοηθιέται από το φιλότιμό μου, δεν βρίσκω ανταπόκριση, και δεν έχω συγγένεια μαζί του. Όταν ο άλλος έχη ευλάβεια, ταπείνωση, δεν έχη αναίδεια, κι εσύ κινείσαι απλά. Εγώ εξ αρχής φέρομαι σε όλους με άνεση και απλότητα. Δεν φέρομαι περιορισμένα, δήθεν για να μη δώσω θάρρος στον άλλον και τον βλάψω. Δίνομαι ολόκληρος, για να βοηθηθή, να αναπτυχθή μέσα σ᾿ ένα κλίμα αγάπης, και σιγά-σιγά του λέω τα κουσούρια του. Τον θεωρώ αδελφό μου, πατέρα μου, παππού μου, ανάλογα με την ηλικία του. Κάνω λιακάδα, για να βγουν όλα τα φίδια, οι σκορπιοί, τα σκαθάρια  – τα πάθη –, και ύστερα τον βοηθάω να τα σκοτώση. Αν όμως δώ ότι δεν το εκτιμάει αυτό και δεν βοηθιέται από την συμπεριφορά μου, αλλά εκμεταλλεύεται την απλότητά μου και την αληθινή αγάπη μου και αρχίζει να φέρεται με αναίδεια, τραβιέμαι σιγά-σιγά, για να μη γίνη περισσότερο αναιδής. Αλλά στην αρχή δίνομαι ολόκληρος, γι᾿ αυτό μετά έχω αναπαυμένη την συνείδησή μου. Μια φορά στην Μονή Στομίου είχα πάρει ένα παιδί, για να το βοηθήσω, να του μάθω και την τέχνη του μαραγκού. Του φερόμουν με πολλή καλωσύνη, τον είχα σαν αδελφό. Έβλεπα όμως μερικά πράγματα που δεν με ανέπαυαν. Μια φορά τον ρωτάω: «Τί ώρα είναι;». «Με τα μυαλά τα δικά σου πάει το ρολόι!», μου λέει. Έ, τότε είπα: «Δεν συμφέρει να συνεχίσω έτσι. Θα συμμαζέψω σιγά-σιγά «τά μυαλά μου», γιατί δεν ωφελείται». Κανονικά αυτός, αν ήταν φιλότιμος, έτσι όπως του φερόμουν, έπρεπε να διαλυθή. Αλλά είδα ότι δεν με χωρούσε, δεν με καταλάβαινε. Ύστερα μόνος του έφυγε· δεν τον έδιωξα. Βλέπεις, η ανοχή, η αγάπη κάνουν τον αναιδή πιο αναιδή και τον φιλότιμο πιο φιλότιμο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η καλωσύνη βλάπτει τον αμετανόητο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, θυμάμαι, μια φορά με είχατε μαλώσει πολύ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν χρειασθή, πάλι θα σε μαλώσω, για να πάμε όλοι μαζί στον Παράδεισο. Τώρα θα λάβω δρακόντεια μέτρα!... Κοίταξε, έχω τυπικό πρώτα να δώσω στον άλλον να καταλάβη ότι χρειάζεται το μάλωμα και ύστερα να τον μαλώσω. Καλά δεν κάνω; Εγώ, επειδή μαλώνω τον άλλον, όταν βλέπω να κάνη κάτι βαρύ, γίνομαι κακός. Αλλά τί να κάνω; να αναπαύω καθέναν στο πάθος του, για να είμαι τάχα καλός μαζί του, και μετά να πάμε όλοι μαζί στην κόλαση; Ποτέ δεν με πειράζει η συνείδηση, όταν μαλώνω κάποιον ή του κάνω παρατήρηση κι εκείνος στενοχωριέται, γιατί από αγάπη το κάνω, για το καλό του. Βλέπω ότι δεν καταλαβαίνει πόσο πλήγωσε τον Χριστό με αυτό που έκανε, γι᾿ αυτό τον μαλώνω. Εγώ πονάω, λειώνω εκείνη την ώρα, αλλά δεν με πειράζει η συνείδηση, γιατί τον μάλωσα. Μπορώ να πάω να κοινωνήσω ήσυχος, χωρίς να εξομολογηθώ. Νιώθω μέσα μου μια παρηγοριά, μια χαρά. Γιατί για μένα παρηγοριά και χαρά είναι η σωτηρία της ψυχής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μου περνά ο λογισμός ότι μου μιλάτε παρηγορητικά, ή γιατί δεν σηκώνω την αυστηρότητα ή γιατί μου έχετε πει πολλές φορές να κάνω κάτι και δεν το  έκανα, οπότε με αφήνετε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ευλογημένη ψυχή, με την σωτηρία της ψυχής σου θα παίζω; Ο νέος κάνει πρόβες. Ο μεγάλος έχει κρίση και βαδίζει σταθερά. Να νιώθης σιγουριά. Αν δώ κάτι στραβό, είτε από μακριά είτε από κοντά, θα σού το πώ. Εσύ έχε εμπιστοσύνη και ειρήνευε. Ά, δεν μ᾿ έχετε καταλάβει εμένα! Έτσι εύκολα θα αναπαύω λογισμούς; Όταν βλέπω ότι η ψυχή είναι ευαίσθητη ή συγκλονίζεται ολόκληρη από την συναίσθηση του σφάλματός της, τί να πώ; Τότε την παρηγορώ, για να μην πέση στην απελπισία. Όταν όμως βλέπω πέτρα την καρδιά, τότε μιλώ αυστηρά, για να την ταρακουνήσω. Αν ένας προχωράη προς τον γκρεμό και του λέω: «προχώρα, πολύ καλά πάς», δεν εγκληματώ; Το κακό με μερικούς είναι που δεν πιστεύουν, όταν τους λές να μην ανησυχούν, και βασανίζονται. Αν δώ κάτι κακό, πώς δεν θα το πώ; Πώς να αφήσης τον άλλον να πάη στην κόλαση; Όταν έχης ευθύνη, θα βάλης και τις φωνές, όταν χρειάζεται. Για μένα πιο καλά είναι να μη μιλάω, αλλά δεν μπορώ, όταν έχω ευθύνη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ύστερα να προσέξη κανείς το εξής: Μου κάνεις λ.χ. ένα κακό· εγώ σε συγχωρώ. Μου ξανακάνεις κάποιο άλλο κακό· πάλι σε συγχωρώ. Εγώ είμαι εντάξει, αλλά, εάν εσύ δεν διορθώνεσαι, επειδή σε συγχωρώ, αυτό είναι πολύ βαρύ. Άλλο εάν δεν μπορής τελείως να διορθωθής. Να προσπαθήσης όμως να διορθωθής, όσο μπορείς. Όχι να αναπαύης τον λογισμό σου και να λές: «Αφού με συγχωρεί, εντάξει τακτοποιήθηκα και δεν βαριέσαι, δεν χρειάζεται στενοχώρια». Μπορεί κάποιος να σφάλλη, αλλά αν μετανοή, κλαίη, ζητάη με συστολή συγχώρηση, αγωνίζεται να διορθωθή, τότε υπάρχει η αναγνώριση και πρέπει και ο πνευματικός να συγχωράη. Αν όμως δεν μετανοή και συνεχίζη την τακτική του, δεν μπορεί αυτός που έχει την ευθύνη της ψυχής του να γελάη. Η καλωσύνη τον αμετανόητο τον βλάπτει.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο σεβασμός της ελευθερίας του άλλου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι δυνατόν κανείς συνειδητά να κρύβη μια πτώση του από τον πνευματικό του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά, και αν ξέρη ο πνευματικός την πτώση του ή κάτι καταλαβαίνη, δεν συμφέρει, ούτε θα τον ωφελήση, να του το πή. Πολλές φορές βλέπω στον αγώνα του άλλου κάτι, καταλαβαίνω ή ξέρω τί έχει κάνει, όμως από σεβασμό δεν του λέω τίποτε, αν δεν μου το πη ο ίδιος. Το θεωρώ εκβιασμό, ατιμία, να του το πώ, την στιγμή που εκείνος δεν θέλει μόνος του να το φανερώση. Είναι λεπτό το θέμα, γιατί θα τον ρεζιλέψης. Πώς να βιάσης τον άλλον; Υπάρχει ελευθερία. Εκτός αν δώ ότι κινδυνεύει και δεν πρόκειται να βοηθηθή από αλλού ή ότι έχει άγνοια και θα σπάση τα μούτρα του, θα καταστραφή, τότε θα κοιτάξω με τρόπο να του πω κάτι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είναι καλύτερα να δίνης στον άλλον να καταλαβαίνη που φταίει, εφόσον το ζητήση, και να χτυπά μόνος του τον παλαιό του άνθρωπο, γιατί έτσι πονά λιγώτερο. Βλέπεις, κι ένα παιδάκι, όταν πέση μόνο του και χτυπήση, κλαίει λιγώτερο απ᾿ ό,τι κλαίει, αν πέση, γιατί το έσπρωξε ένα άλλο παιδί. Για να πη κανείς στον άλλον να κάνη κάτι, πρέπει αυτός που θα το ακούση να είναι ταπεινός και αυτός που θα το πη να είναι δέκα φορές πιο ταπεινός και να προσπαθή να το εφαρμόζη αυτό που θα πή. Θα κάνω ενάμισι εγώ, για να πω στον άλλον να κάνη ένα, και πάλι θα σκεφθώ αν το πώ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βέβαια, ο έλεγχος γίνεται πάντοτε σε άνθρωπο που είναι δικός σου ή γνωστός. Ο πνευματικός θα δη τί δικαιώματα του έδωσε ο άλλος και τί ευθύνη έχει γι᾿ αυτόν και ανάλογα θα φερθή. Όταν έχη αναλάβει την ευθύνη της ψυχής, τότε επιβάλλεται ο έλεγχος, φυσικά με διάκριση. Δεν βοηθάει όμως να κάνης στον άλλον τον δάσκαλο και να τον ελέγχης για τις συνήθειές του, αν εκείνος δεν σού δώση το δικαίωμα. Είναι σαν να μπή κάποιος στο κελλί μου και να μου αλλάξη τα πράγματα, να μου βάλη το κανδήλι εδώ, το κρεββάτι εκεί, να κρεμάση το κομποσχοίνι αλλού, χωρίς να με ρωτήση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αγάπη πνευματικού προς τον εξομολογούμενο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο χαριτωμένος πνευματικός αγαπάει και πονάει την ψυχή, γιατί γνωρίζει την μεγάλη αξία της. Την βοηθάει στην μετάνοια, την ξαλαφρώνει με την εξομολόγηση, την ελευθερώνει από το άγχος και την οδηγεί στον Παράδεισο. Ο πνευματικός ονομάζεται «πατήρ», γι᾿ αυτό πρέπει να προσπαθήση να είναι αληθινός πατέρας· να νουθετή με θεϊκή αγάπη και στοργή. Να έρχεται στην θέση του κάθε εξομολογουμένου και να ζη τον πόνο του, ώστε ο εξομολογούμενος να βλέπη στο πρόσωπό του ζωγραφισμένο τον δικό του πόνο. Αυτό χρειάζεται ιδιαίτερα στην εποχή μας, που οι άνθρωποι έχουν ανάγκη από λίγο δροσερό νερό, και όχι από δυνατό ξίδι. Οι περισσότεροι, επειδή δέχονται επιδράσεις δαιμονικές, δύσκολα δέχονται μια πνευματική συμβουλή ή μια παρατήρηση. Γι᾿ αυτό και το μάλωμα πρέπει να γίνεται με αγάπη· η υπόδειξη του σφάλματος με λεπτό τρόπο, με γέλιο ή με ένα αστείο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αγάπη πληροφορεί, ενώ τα ψυχικά πάθη προδίδουν τον άνθρωπο. Όταν δεν υπάρχη αγάπη, η παρατήρηση μπορεί να γίνεται με όμορφο τρόπο, αλλά ο άλλος κλωτσάει, γιατί αισθάνεται το ανθρώπινο στοιχείο στην συμπεριφορά μας. Ενώ, όταν το μάλωμα γίνεται με πόνο και αγάπη, ο άλλος μπορεί να στενοχωριέται, αλλά στο βάθος δεν πληγώνεται, γιατί νιώθει την αγάπη. Γνωρίζω έναν πνευματικό που είναι αρκετά παχύς – φυσικά είναι και η κράση του, αλλά μπορεί και στο φαγητό λίγο να μην προσέχη –, ξέρετε όμως πόσο πονάει για τον άλλον, πόσο ενδιαφέρεται για τους πονεμένους; Αυτός έχει ταπείνωση, γιατί λέει ότι δεν κάνει άσκηση, αλλά παράλληλα έχει πολλή καλωσύνη, και έτσι πολλοί αναπαύονται περισσότερο σ᾿ αυτόν παρά σε έναν ασκητικό πνευματικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ένας πνευματικός, που δεν είναι αποφασισμένος να πάη ακόμη και στην κόλαση για την αγάπη των πνευματικών παιδιών του, δεν είναι πνευματικός.
