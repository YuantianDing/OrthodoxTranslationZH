  text:
    ru: Λόγοι Α'•Λόγοι Β'•Λόγοι Γ'•Λόγοι Δ'•Λόγοι Έ•Λόγοι ΣΤ'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Περιεχόμενα
- type: h1
  initial:
    ru: ''
  text:
    ru: Слова. Том 4. Семейная жизнь.Λόγοι Δ' – Οικογενειακή ζωή
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρόλογος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Με τον παρόντα τόμο συνεχίζουμε την δημοσίευση των λόγων του μακαριστού Γέροντος Παϊσίου με θέματα για την οικογένεια και για τις δοκιμασίες που υφίσταται ο άνθρωπος εξ αιτίας της κρίσεως του θεσμού της οικογένειας στην εποχή μας. Ο Γέροντας έλεγε ότι τα περισσότερα από τα γράμματα που λάμβανε προέρχονταν από ανθρώπους με οικογενειακά προβλήματα. Απέδιδε δε τα προβλήματα αυτά στην απομάκρυνση των ανθρώπων από τον Θεό και στην φιλαυτία τους. «Παλιά, έλεγε, η ζωή ήταν πιο ήρεμη και οι άνθρωποι έκαναν υπομονή. Σήμερα όλοι είναι τσακμάκια. Έναν λόγο δεν σηκώνουν. Και ύστερα αυτόματο διαζύγιο».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Γέροντας από πολύ νωρίς τοποθετήθηκε ενεργώς μέσα στην μεγάλη οικογένεια της Εκκλησίας και αισθανόταν ότι δεν ανήκε πλέον στην μικρή οικογένειά του. Απέκτησε θεϊκή αγάπη και έγινε παιδί του Θεού. Γι᾿ αυτό ένιωθε όλους τους ανθρώπους αδέλφια του και αγαπούσε τον καθέναν «εν σπλάγχνοις Ιησού Χριστού» (Φιλ. 1:8). «Όταν βλέπω κάποιον ηλικιωμένον, μας έλεγε, λέω ότι αυτός είναι πατέρας μου.Όταν βλέπω κάποια γιαγιά, λέω ότι αυτή είναι μητέρα μου. Όταν δώ μικρό παιδί, το βλέπω σαν ανηψάκι μου. Όλους τους αγαπώ. Άλλους τους χαίρομαι, άλλους τους πονώ. Ξέρεις τί είναι αυτό;». Αλλά και γινόταν για τον καθέναν, ανάλογα με την περίπτωση, παιδί, αδελφός, πατέρας, παππούς. Και η ειλικρινής αυτή αγάπη βοηθούσε όποιον τον πλησίαζε να υποστή την καλή αλλοίωση, να δεχθή τον λόγο του Θεού και να ζήση σύμφωνα με αυτόν. Ως μέλος του σώματος του Χριστού, όχι μόνον προσευχόταν με πόνο για όσους αντιμετώπιζαν προβλήματα μέσα στην οικογένεια, αλλά βοηθούσε και με τον λόγο του, όταν του το ζητούσαν, ακόμη και στα πιο ειδικά θέματα της οικογενειακής ζωής, αν και εκείνος ζούσε ως ασκητής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έχοντας δοκιμασθή ο ίδιος στα «πυρά των πειρασμών» και στο καμίνι της αρρώστιας, η οποία με διάφορες μορφές τον επισκέφθηκε από το 1947 ώς το 1994 που κοιμήθηκε, συνέπασχε με κάθε πονεμένο και προσευχόταν με πόνο για τους αρρώστους. Για την δική του υγεία φρόντιζε τόσο μόνον, όσο να μπορή να αυτοεξυπηρετήται και να εξυπηρετή αυτούς που τον επισκέπτονταν. Πίστευε πώς, όταν θα αδιαφορούσε για τον δικό του πόνο, αυτό θα συγκινούσε τον Θεό και θα άκουγε την προσευχή του για τους άλλους αρρώστους. Σ᾿ εκείνους όμως συνιστούσε να κάνουν ό,τι είναι ανθρωπίνως δυνατό, για να θεραπευθούν, και ό,τι είναι ανθρωπίνως αδύνατο να το αφήνουν στον Θεό. Συγχρόνως δυνάμωνε την πίστη τους, ώστε να αντιμετωπίζουν την αρρώστια τους με ελπίδα στον Θεό, αλλά και να μη λησμονούν ότι στην ζωή αυτήν όλοι είμαστε «πάροικοι και παρεπίδημοι» (Α´ Πέτρ. 2:11) και να ετοιμάζωνται για την αιώνια ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο τόμος αυτός – ο οποίος εκδίδεται με την ευλογία του Ποιμενάρχου μας, Σεβασμιωτάτου Μητροπολίτου Κασσανδρείας κ. Νικοδήμου – συγκροτείται από εισαγωγικό κεφάλαιο και από έξι μέρη. Πολλά από τα θέματά του προέκυψαν από συζητήσεις που έκαναν με τον Γέροντα η Γερόντισσα και ορισμένες Αδελφές. Αν και κατά την προτροπή και την αρχή του Γέροντα παραπέμπουμε όσους μας ζητούν πνευματική βοήθεια στον Πνευματικό, συχνά συνέβαινε – και συμβαίνει – οι άνθρωποι στην επικοινωνία τους με την Γερόντισσα ή με κάποια μεγάλη Αδελφή, κάτω από την πίεση κάποιου προβλήματος, να εκφράζουν τον πόνο τους και να ζητούν συμβουλές. Μερικές φορές, για να είμαστε βέβαιες ότι η απάντηση που δώσαμε σε κάποιο σοβαρό ή δύσκολο θέμα ήταν σωστή, απευθυνόμασταν στον Γέροντα, ο οποίος μας έλεγε ποιά ήταν σε κάθε περίπτωση η κατά Θεόν αντιμετώπιση. Αλλά και ο ίδιος στις Συνάξεις της Αδελφότητος και στις κατ᾿ ιδίαν συζητήσεις με τις αδελφές, παίρνοντας αφορμή από κάποιο περιστατικό της κοινοβιακής ζωής ή από κάποια ερώτησή μας, συνήθιζε να αναφέρη δυσκολίες που αντιμετώπιζαν λαϊκοί. Αυτό το έκανε, για να προσευχώμαστε με πόνο για τον κόσμο. Ανέφερε επίσης παραδείγματα από οικογενειάρχες ή από μητέρες πού, ενώ δεν είχαν τις πνευματικές ευκαιρίες των μοναχών, ζούσαν αγία ζωή. Έτσι μας παρακινούσε να αγωνιζώμαστε με περισσότερο φιλότιμο. Μερικά από τα θέματα αυτά συμπληρώθηκαν με αποσπάσματα από επιστολές του Γέροντα, που μας έδωσαν κληρικοί και ευλαβείς λαϊκοί. Σ᾿
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για να βοηθηθούν τα νέα παιδιά που προβληματίζονται για τον δρόμο που πρέπει να ακολουθήσουν στην ζωή τους, προτάχθηκε στον παρόντα Δ´ τόμο το εισαγωγικό κεφάλαιο «Οι νέοι μπροστά στους δύο δρόμους της ζωής». Σ᾿ αυτό τονίζεται πώς και οι δύο δρόμοι που χάραξε η Εκκλησία μας – η έγγαμη και η μοναχική ζωή – είναι ευλογημένοι. Οι νέοι, ανάλογα με την κλίση τους, με τις δυνάμεις και με το φιλότιμό τους, πρέπει ανεπηρέαστοι και με εμπιστοσύνη στον Θεό να διαλέξουν έναν από τους δύο δρόμους. Βασική προϋπόθεση για την προκοπή τους σε όποιο δρόμο ακολουθήσουν είναι να ζουν αγνά και πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο πρώτο από τα έξι μέρη του βιβλίου αυτού ορίζονται ως θεμέλια της οικογένειας η αρχοντική αγάπη και ο σεβασμός μεταξύ των συζύγων. Η  υπομονή στις δυσκολίες της οικογενειακής ζωής, όταν συνοδεύεται από προσευχή, σώζει την οικογένεια από την διάλυση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο δεύτερο μέρος, το οποίο αναφέρεται στις υποχρεώσεις και στην ευθύνη των γονέων για την σωστή ανατροφή των παιδιών, ιδιαίτερα τονίζεται η σπουδαιότητα που έχει το παράδειγμα, «η σιωπώσα παραίνεσις» των γονέων προς τα παιδιά, και ο ρόλος της μητέρας. Επίσης υπογραμμίζεται ότι η στοργή και η αγάπη προς τα παιδιά είναι βασικές προϋποθέσεις για την φυσιολογική ανάπτυξή τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το τρίτο μέρος αναφέρεται στα παιδιά, στις χαρές και στις δυσκολίες τους από την βρεφική ηλικία ώς την ενηλικίωσή τους, καθώς και στις υποχρεώσεις τους προς τους γονείς. Ο σεβασμός και η αγάπη προς τους γονείς, όχι μόνον κατά την παιδική αλλά και κατά την ώριμη ηλικία, τους εξασφαλίζουν την ευλογία του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο τέταρτο μέρος δίνονται απλές και πρακτικές συμβουλές για την πνευματική ζωή μέσα στην οικογένεια. Έτσι παιδιά και γονείς βοηθιούνται να βιώνουν καθημερινά το Ευαγγέλιο, είτε βρίσκονται στο σπίτι είτε στην εργασία, η οποία πρέπει, όσο γίνεται, να συντελή στην κατά Θεόν τελείωσή τους και όχι να τους πνίγη με το συνεχές άγχος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο πέμπτο μέρος, το οποίο αναφέρεται στις διάφορες δοκιμασίες που αντιμετωπίζουν οι άνθρωποι στην ζωή τους, τονίζεται πόση παρηγοριά και δύναμη δίνει ο Θεός σε όσους τις αντιμετωπίζουν όχι μόνο με υπομονή αλλά και με δοξολογία. Η  αρρώστια, η αναπηρία, οι συκοφαντίες είναι ευλογία για τον άνθρωπο που έχει συλλάβει το βαθύτερο νόημα της ζωής. Με τις ταλαιπωρίες που περνάει εξοφλεί αμαρτίες ή αποταμιεύει ουράνιο μισθό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τέλος, στο έκτο μέρος περιέχονται θέματα που αναφέρονται στην σωστή αντιμετώπιση του θανάτου και στην προετοιμασία γι᾿ αυτόν. Ο Γέροντας διευκρινίζει ποιά είναι η αληθινή παρηγοριά των πενθούντων για τον θάνατο προσφιλών προσώπων τους και υπογραμμίζει πόσο βοηθούν τα μνημόσυνα, οι προσευχές και οι ελεημοσύνες που γίνονται για τους κεκοιμημένους. Απλά δε και παραστατικά δίνει μια εικόνα της μελλούσης Κρίσεως και της αιωνίου ζωής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα θέματα του τόμου αυτού μπορούν αφ᾿ ενός μεν να βοηθήσουν όσους αγωνίζονται μέσα στον κόσμο να συνεχίσουν «τόν καλόν αγώνα» (Α´ Τιμ. 6:12) με περισσότερο ζήλο και αφ᾿ ετέρου να ξυπνήσουν συνειδήσεις ανθρώπων που ταλαιπωρούνται μακριά από τον Θεό, ώστε να θελήσουν να γίνουν συνειδητά μέλη της Εκκλησίας και να χαίρωνται μέσα στην μικρή κοινωνία της οικογένειάς τους την ειρήνη και την ανάπαυση που δίνει η πνευματική ζωή. Παράλληλα υπογραμμίζουν ότι μέσα στον γάμο είναι απαραίτητη η τήρηση όλων των εντολών του Θεού, οι οποίες «βαρείαι ουκ εισίν» (Α´ Ιω. 5:3). Αν λ.χ. καθένας από τους συζύγους θυσιάζη το δικό του θέλημα και κάνη υπακοή, δεν νιώθει καταπιεσμένος, γιατί το κάνει από αγάπη και αισθάνεται μέσα του μια γλυκειά παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ίσως ο σύγχρονος άνθρωπος, συνηθισμένος στους «χαλαρούς νόμους» της σημερινής κοινωνίας, να θεωρήση απόλυτες και ανεφάρμοστες μερικές θέσεις του Γέροντα· αλλά, αν τις κρίνη βάσει του Ευαγγελίου, θα διαπιστώση ότι είναι ακριβής έκφρασή του. Ο Γέροντας αποβλέπει πάντοτε στην κατά Χριστόν τελειότητα. Με την φωτισμένη όμως ποιμαντική του μακροθυμεί μπροστά στην ανθρώπινη αδυναμία και κάνει χρήση της «οικονομίας»*[*], χωρίς βέβαια να συγκατατίθεται στην αμαρτία. Προσπαθεί με παραδείγματα, με αναφορές στην ζωή των παλαιοτέρων χρόνων κ.λπ., να δώση και στον σύγχρονο άνθρωπο να καταλάβη ότι ο Θεός είναι ζών και «ενεργών τα πάντα εν πάσι» (Α´ Κορ. 12:6). Δεν απαντάει μόνο στην μέλλουσα ζωή ως μισθαποδότης, αλλά και στην παρούσα ως στοργικός Πατέρας. Πρέπει όμως ο άνθρωπος να δείξη την αγαθή του προαίρεση με τον μικρό του αγώνα. Λίγο θα κοπιάση, πολύ θα λάβη. Αλλά αυτόν τον λίγο κόπο πρέπει να τον κάνη, για να δώση το «δικαίωμα» στον Θεό να επεμβαίνη με πολλή βοήθεια στην ζωή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ευχαριστούμε όσους διάβασαν τα χειρόγραφα του τόμου αυτού και με πολύ σεβασμό διετύπωσαν ορισμένες σκέψεις που βοήθησαν στην αρτιώτερη μορφή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ευχόμαστε οι λόγοι του Γέροντα να βοηθήσουν την οικογένεια, η οποία ιδιαίτερα σήμερα ταλαιπωρείται εξ αιτίας της λήθης ή της περιφρονήσεως των εντολών του Θεού, να βρη μέσα στους κόλπους της Εκκλησίας τον πραγματικό προορισμό της, ώστε γονείς και παιδιά να ζουν από τούτη την ζωή τον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 16 Σεπτεμβρίου 2002
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μνήμη της Αγίας Μεγαλομάρτυρος Ευφημίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η  Καθηγουμένη του Ιερού Ησυχαστηρίου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φιλοθέη Μοναχή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί αι σύν εμοί εν Χριστώ Αδελφαί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι γονείς που γεννούν τα παιδιά και τους δίνουν το σώμα πρέπει να συντελέσουν, όσο μπορούν, και στην πνευματική τους αναγέννηση. Ύστερα, ό,τι δεν μπορούν να κάνουν οι ίδιοι για τα παιδιά τους, θα το αναθέσουν σε δασκάλους. Γι᾿ αυτό λέει και η Εκκλησία μας «τούς γονείς ημών και διδασκάλους». Υπάρχουν όμως και οι πνευματικοί Πατέρες, που εργάζονται για την πνευματική αναγέννηση των ανθρώπων και βοηθούν πιο θετικά στην αγωγή των παιδιών.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι νέοι μπροστά στους δύο δρόμους της ζωής
- type: h2
  initial:
    ru: ''
  text:
    ru: Και η έγγαμη και η άγαμη ζωή είναι ευλογημένες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί πρέπει να απαντήση κανείς σε νέα παιδιά που ρωτούν αν η μοναχική ζωή είναι ανώτερη από την έγγαμη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κατ᾿ αρχάς πρέπει να τους δώση να καταλάβουν ποιός είναι ο προορισμός του ανθρώπου και ποιό είναι το νόημα της ζωής. Ύστερα να τους εξηγήση  ότι και οι δύο δρόμοι που έχει χαράξει η Εκκλησία μας είναι ευλογημένοι, γιατί και οι δύο μπορούν να τους οδηγήσουν στον Παράδεισο, αν ζήσουν κατά Θεόν. Ας υποθέσουμε ότι δύο άνθρωποι ξεκινούν να πάνε σε ένα προσκύνημα. Ο ένας πηγαίνει με το λεωφορείο από τον δημόσιο δρόμο και ο άλλος πηγαίνει με τα πόδια από κάποιο μονοπάτι. Και οι δύο όμως έχουν τον ίδιο σκοπό. Ο Θεός και το ένα το χαίρεται και το άλλο το θαυμάζει. Κακό είναι όταν αυτός που πάει από το μονοπάτι κατακρίνη μέσα του τον άλλον που πάει από τον δημόσιο δρόμο ή και το αντίστροφο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλά είναι οι νέοι που σκέφτονται τον Μοναχισμό να γνωρίζουν ότι η αποστολή του μοναχού είναι πολύ μεγάλη· είναι να γίνη Άγγελος. Στην άλλη ζωή, στον Ουρανό, θα ζούμε σαν Άγγελοι, είπε ο Χριστός στους Σαδδουκαίους[1]. Γι᾿ αυτό μερικοί πολύ φιλότιμοι νέοι γίνονται μοναχοί και αρχίζουν την αγγελική ζωή από τούτη την ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ας μη νομίση όμως κανείς ότι όσοι πάνε στο μοναστήρι θα σωθούν, επειδή απλώς έγιναν μοναχοί. Ο κάθε άνθρωπος θα δώση λόγο στον Θεό αν την ζωή που διάλεξε την αγίασε. Παντού χρειάζεται φιλότιμο. Ο Θεός δεν κάνει προκομμένους και ανεπρόκοπους ανθρώπους, αλλά, όποιος δεν έχει φιλότιμο, όποια ζωή κι αν ακολουθήση, ανεπρόκοπος θα είναι. Ενώ ο φιλότιμος προκόβει, όπου κι αν βρεθή, επειδή η θεία Χάρις βρίσκεται μαζί του. Υπάρχουν έγγαμοι που ζουν πολύ ενάρετα και αγιάζονται. Ένας οικογενειάρχης, αν αγαπάη τον Θεό και έλκεται από τον θείο έρωτα, μπορεί να κάνη μεγάλη πνευματική προκοπή. Εν τω μεταξύ προικίζει τα παιδιά του με αρετές, δημιουργεί μια καλή οικογένεια, οπότε θα πάρη διπλό μισθό από τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γι᾿ αυτό ο κάθε νέος πρέπει να έχη στόχο να αγωνισθή με φιλότιμο και χωρίς άγχος, ώστε την ζωή που θα διαλέξη να την αγιάση. Θέλει τον γάμο; Να παντρευτή, αλλά να αγωνισθή να γίνη καλός οικογενειάρχης και να ζήση άγια. Θέλει τον Μοναχισμό; Να γίνη μοναχός, αλλά να αγωνισθή να γίνη καλός μοναχός. Ας μετρήση τις δυνάμεις του, ας δη τί μπορεί να κάνη, και ανάλογα να προχωρήση σε έναν από τους δύο δρόμους. Αν μια κοπέλα λ.χ. βλέπη ότι δεν έχει δυνάμεις να γίνη μοναχή, τότε να πη ταπεινά στον Θεό: «Θεέ μου, είμαι αδύναμη· δεν μπορώ να ζήσω ως μοναχή· στείλε μου έναν άνθρωπο που θα με βοηθάη, ώστε να κάνω μια καλή οικογένεια και να ζώ πνευματικά», και ο Θεός τότε δεν θα την αφήση. Αν παντρευτή και κάνη μια καλή οικογένεια, ζη σύμφωνα με το Ευαγγέλιο, δεν θα ζητήση ο Θεός περισσότερα από αυτήν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βέβαια υπάρχουν νέοι από τους οποίους ο Θεός ζητάει λίγα, αλλά εκείνοι από φιλότιμο αγωνίζονται πολύ και Του προσφέρουν περισσότερα διαλέγοντας την μοναχική ζωή. Αυτοί θα λάβουν διπλά στεφάνια. Εάν δηλαδή μια ψυχή έχη κλίση προς την έγγαμη ζωή και θελήση από πολύ φιλότιμο να θυσιάση τα πάντα και να ακολουθήση την μοναχική ζωή, αυτό πολύ συγκινεί τον Θεό. Μόνο να προσέξη τα ελατήριά της να είναι πολύ αγνά· να μην κινηθή από υπερηφάνεια. Από εκεί και πέρα ο Θεός θα σκορπίση όλες τις δυσκολίες.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ανησυχία των νέων για την αποκατάστασή τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η ανησυχία ενός νέου για την αποκατάστασή του οφείλεται σε απιστία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι πάντοτε. Συχνά, οι νέοι που ενδιαφέρονται πώς να τακτοποιηθούν καλύτερα, αλλά και να βρίσκωνται κοντά στον Θεό, ανησυχούν για την αποκατάστασή τους. Αυτό φανερώνει υγεία. Το να μη σκέφτεται ένας νέος και να μην ανησυχή για την αποκατάστασή του, φανερώνει αδιάφορο άνθρωπο, και επόμενο είναι ο αδιάφορος να είναι και ανεπρόκοπος. Μόνο χρειάζεται να προσέξουν αυτή η ανησυχία να μην ξεπερνάη τα όρια, γιατί ο διάβολος προσπαθεί να την διαστρέψη, να την κάνη αγωνία και να κρατά τον νού τους σε διαρκή σύγχυση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι νέοι πρέπει να εμπιστεύωνται τον εαυτό τους στον Θεό, για να ειρηνεύουν, γιατί ο Καλός Θεός σάν[2]στοργικός Πατέρας ενεργεί εκεί όπου εμείς ανθρωπίνως δεν μπορούμε να ενεργήσουμε. Δεν χρειάζεται να βιάζωνται και να παίρνουν ανώριμες αποφάσεις για την ζωή που θα ακολουθήσουν. Γνωρίζω παιδιά που αγωνιούν πολύ και προσπαθούν να λύσουν όλα τα προβλήματα συγχρόνως. Τελικά μπερδεύονται και αφήνουν τις σπουδές τους. Ενώ έχουν λ.χ. να τελειώσουν το πανεπιστήμιο, ανησυχούν υπερβολικά για την αποκατάστασή τους, οπότε καθυστερούν και στις σπουδές τους και ύστερα μπλέκονται χειρότερα. Δεν γίνονται όλα μαζί, ούτε λύνονται έτσι τα προβλήματα. Για να βοηθηθούν, πρέπει να κάνουν ένα καλό ξεκαθάρισμα μέσα τους και να βάλουν τα πράγματα σε μια σειρά. Να φροντίσουν πρώτα να πάρουν το πτυχίο τους, ύστερα για την δουλειά τους – τα αγόρια να τελειώσουν και το στρατιωτικό – και στην συνέχεια, ώριμα πλέον και με την βοήθεια του Θεού, ή να κάνουν μια καλή οικογένεια, αν έχουν αποφασίσει την έγγαμη ζωή, ή να πάνε στο μοναστήρι που θα διαλέξουν, αν έχουν αποφασίσει τον Μοναχισμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό λέω στους νέους που σπουδάζουν και έχουν τέτοιες ανησυχίες, εφόσον δεν έχει ωριμάσει μέσα τους τί θα κάνουν στην ζωή τους, να συνεχίσουν τις σπουδές τους, και εκείνο που θα ωριμάση μέσα τους αργότερα και θα τους αναπαύη, αυτό να κάνουν. Αν υπάρχη καλή διάθεση, βοηθάει ο Θεός και σιγά-σιγά θα ξεκαθαρίσουν ποιά ζωή είναι γι᾿ αυτούς, η έγγαμη ή η άγαμη σε μοναστήρι, και θα νιώσουν ανάπαυση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να βοηθούμε τους νέους να ακολουθήσουν την κλίση τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κάθε άνθρωπος έχει την κλίση του. Ο Καλός Θεός έπλασε τον άνθρωπο ελεύθερο. Έχει αρχοντιά· σέβεται την ελευθερία του ανθρώπου και αφήνει ελεύθερο τον καθέναν να ακολουθήση τον δρόμο που τον αναπαύει. Δεν τους βάζει όλους στην ίδια γραμμή με μια στρατιωτική πειθαρχία. Γι᾿ αυτό οι νέοι ας αφήσουν τον εαυτό τους ελεύθερο στον πνευματικό χώρο της ελευθερίας του Θεού. Δεν βοηθιούνται, αν εξετάζουν ποιά ζωή ακολούθησε ή θα ακολουθήση ο τάδε ή ο τάδε. Σ᾿ αυτό το θέμα δεν πρέπει να επηρεάζωνται από κανέναν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι γονείς πάλι, οι Πνευματικοί, οι εκπαιδευτικοί πρέπει να βοηθούν τους νέους να διαλέγουν όποια ζωή είναι στα μέτρα τους και να ακολουθούν την πραγματική τους κλίση, χωρίς να τους επηρεάζουν ή να στραγγαλίζουν την κλίση τους. Η απόφαση για την ζωή που θα ακολουθήσουν πρέπει να είναι δική τους. Όλοι οι άλλοι μόνον απλές γνώμες μπορούμε να εκφράσουμε και το μόνο δικαίωμα που έχουμε είναι να βοηθούμε τις ψυχές να βρουν τον δρόμο τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικές φορές, όταν συζητάω με νέους που προβληματίζονται πάνω σ᾿ αυτό το θέμα, ενώ βλέπω την ζυγαριά προς τα που γέρνει, δεν τους το λέω, για να μην τους επηρεάσω. Εκείνο μόνον που προσπαθώ να κάνω είναι να τους βοηθήσω, όπως μπορώ, να βρουν τον σωστό δρόμο και την εσωτερική ειρήνη· να αφαιρέσω από αυτό που τους αναπαύει ό,τι βλαβερό υπάρχει, για να αφήσω το καλό, το άγιο, ώστε να ζουν και σ᾿ αυτήν την ζωή χαρούμενα, κοντά στον Θεό, και στην άλλη ζωή πιο χαρούμενα. Ειλικρινά, όποια ζωή κι αν ακολουθήση ένας νέος που γνωρίζω, θα χαρώ και πάντα θα έχω το ίδιο ενδιαφέρον για την σωτηρία της ψυχής του, φθάνει να είναι κοντά στον Χριστό, μέσα στην Εκκλησία μας. Θα νιώθω αδελφός του, γιατί θα είναι παιδί της μητέρας μας Εκκλησίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φυσικά χαίρομαι ιδιαίτερα τους νέους που ακολουθούν την μοναχική ζωή, γιατί όντως είναι σοφός αυτός που ακολουθεί αυτήν την αγγελική ζωή, διότι ξεφεύγει το αγκίστρι του διαβόλου που έχει ως δόλωμα τον κόσμο. Δεν μπορείς όμως να βάλης όλους τους ανθρώπους στο ίδιο καλούπι. Βλέπεις, ο Χριστός δεν έδωσε σαν εντολή τον Μοναχισμό – παρόλο που είναι ο δρόμος της τελειότητος -, γιατί δεν ήθελε να επιβάλη σε όλους βαρύ φορτίο. Γι᾿ αυτό, όταν ο νεανίσκος Τον ρώτησε πώς θα σωθή[3], ο Χριστός του απάντησε:«Τήρησον τας εντολάς»[4]. Και όταν εκείνος είπε ότι τις τηρεί[5]και ρώτησε«τί έτι υστερώ;»[6], ο Χριστός του είπε:«Έν σοι υστερεί· ει θέλεις τέλειος είναι, ύπαγε, όσα έχεις πώλησον και δεύρο ακολούθει μοι»[7]. Δηλαδή, αν έβρισκε κανέναν φιλότιμο, τότε του μιλούσε για την τελειότητα· δεν έβαζε θηλειά στον κόσμο. Ούτε δίδασκε τον Μοναχισμό, γιατί θα έβαζε φωτιά και ίσως πολλοί θα έτρεχαν αδιάκριτα να γίνουν μοναχοί και θα γινόταν κακό. Έρριξε μόνον την σπίθα καί, όταν ήρθε η κατάλληλη στιγμή, πρόβαλε ο Μοναχισμός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έτσι και εμείς δεν έχουμε δικαίωμα να βιάζουμε τους άλλους – μόνοι τους, εάν θέλουν, ας βιάσουν τον εαυτό τους· μόνον τον εαυτό μας έχουμε δικαίωμα να βιάσουμε, και αυτόν πάλι με διάκριση. Εγώ μέχρι τώρα σε κανέναν νέο δεν είπα ούτε να παντρευτή ούτε να γίνη καλόγερος. Αν κάποιος με ρωτήση, του λέω: «Να κάνης αυτό που σε αναπαύει, φθάνει να είσαι κοντά στον Χριστό». Και αν μου πη ότι δεν αναπαύεται στον κόσμο, τότε του μιλάω για τον Μοναχισμό, για να τον βοηθήσω να βρη τον δρόμο του.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Απόφαση για την επιλογή τρόπου ζωής
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα χρόνια περνούν γρήγορα. Καλά είναι ο νέος να μη μένη για πολύ καιρό στο σταυροδρόμι αναποφάσιστος. Να διαλέξη έναν σταυρό – έναν από τους δύο δρόμους της Εκκλησίας μας – ανάλογα με την κλίση του και το φιλότιμό του και να προχωρήση σ᾿ αυτόν με εμπιστοσύνη στον Χριστό. Ας ακολουθήση τον Χριστό στην Σταύρωση, εάν θέλη να χαρή αναστάσιμα. Και στις δύο ζωές υπάρχουν φαρμάκια, αλλά, όταν βρίσκεται κανείς κοντά στον Θεό, τα γλυκαίνει ο γλυκύς Ιησούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν περάση κανείς τα τριάντα, αρχίζει να δυσκολεύεται να αποφασίση. Και όσο περνούν τα χρόνια, τόσο πιο πολύ δυσκολεύεται. Ο νέος προσαρμόζεται ευκολώτερα σε όποια ζωή κι αν ακολουθήση. Ο μεγάλος όλα τα εξετάζει με την λογική του. Έχει πια διαμορφωθή ο χαρακτήρας του και δύσκολα αλλάζει· είναι χυμένο μπετόν. Και βλέπεις, αυτοί που τακτοποιούνται σε μικρή ηλικία, είτε στην έγγαμη είτε στην μοναχική ζωή, μέχρι τα γεράματά τους διατηρούν μια παιδική απλότητα και συνδέονται εύκολα μεταξύ τους. Είδα ένα ανδρόγυνο που παντρεύτηκαν μικροί. Όπως μιλούσε ο άνδρας, έτσι μιλούσε και η γυναίκα· ό,τι έκανε ο άνδρας, έκανε και η γυναίκα. Επειδή παντρεύτηκαν μικροί, ο ένας πήρε όλες τις συνήθειες του άλλου, και στην ομιλία και στην συμπεριφορά, αλλά και συνδέθηκαν ευκολώτερα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η παροιμία λέει: «Ή μικρός παντρέψου ή μικρός καλογερέψου». Ειδικά η κοπέλα καλά είναι μέχρι τα είκοσι πέντε της χρόνια να αποφασίζη ποιά ζωή θα ακολουθήση. Μετά τα είκοσι πέντε αρχίζει να γίνεται λίγο δύσκολη η αποκατάστασή της, γιατί σκέφτεται πώς θα υποταχθή. Εν τω μεταξύ, όσο μεγαλώνει, αποκτάει και ιδιοτροπίες και ποιός θα την πάρη; Έπειτα ζητάει κυρίως προστασία στον γάμο και όχι να κάνη οικογένεια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι παρατηρημένο ότι όποιος αναβάλλει συνέχεια να παντρευτή, όταν περάσουν τα χρόνια, ψάχνει και δεν βρίσκει. Όταν ήταν νέος, διάλεγε αυτός· ύστερα τον διαλέγουν οι άλλοι! Γι᾿ αυτό λέω ότι σ᾿ αυτό το θέμα χρειάζεται καμμιά φορά και λίγη τρέλλα. Να παραβλέψη μερικά που δεν είναι ουσιώδη, γιατί δεν πρόκειται ποτέ να του έρθουν όλα όπως τα περιμένει. Μια φορά έβρεχε και ένας χείμαρρος άρχισε να κατεβάζη νερό. Ένας τρελλός και ένας γνωστικός ήθελαν να περάσουν στην άλλη μεριά. Ο γνωστικός είπε: «Θα σταματήση η βροχή, θα λιγοστέψη το νερό και ύστερα θα περάσω». Ο τρελλός δεν περίμενε· έδωσε μια και πέρασε απέναντι. Βράχηκαν λίγο τα ρούχα του, αλλά πήγε εκεί που ήθελε. Η βροχή, αντί να σταματήση, όλο και δυνάμωνε. Το νερό στον χείμαρρο αυξήθηκε και τελικά ο γνωστικός δεν μπόρεσε να περάση απέναντι, γιατί ύστερα ήταν και επικίνδυνο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σε μερικούς υπάρχει μεγάλη υπερηφάνεια, πολύς εγωισμός, γι᾿ αυτό και ο Θεός δεν τους βοηθάει. Χρόνια έρχονται μερικοί εκεί στο Καλύβι και με ρωτούν: «Τί θέλει από μένα ο Θεός, Πάτερ μου;». Λές και ο Θεός έχει ανάγκη από αυτούς. Ούτε μοναχοί έγιναν, ούτε παντρεύτηκαν. Σαν να είναι φτιαγμένοι από χρυσάφι και φοβούνται μην τους βάλουν για βέργα στο μπετόν! Άλλοι πάλι μου λένε: «Γέροντα, τί να κάνω; Να γίνω μοναχός ή να παντρευτώ; Πές μου, για που είμαι». «Εσύ τί θέλεις;», τους ρωτάω. «Και το ένα και το άλλο», μου λένε. Θέλουν και τα δύο. Αν τους πω τον λογισμό μου, λ.χ. ότι είναι για τον γάμο, και παντρευτούν, μπορεί να μην αναπαυθούν και θα έρχωνται ύστερα να λένε: «Εσύ μου είπες να ακολουθήσω αυτήν την ζωή, και τώρα ταλαιπωρούμαι».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί να γίνη αυτό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ένας νέος, ας υποθέσουμε, έχει κλίση για την έγγαμη ζωή, αλλά σκέφτεται και τον Μοναχισμό. Αν δεν προσέξη, ώστε να κάνη μια καλή οικογένεια, και δημιουργηθούν αργότερα προβλήματα και δεν τα αντιμετωπίση πνευματικά, τότε ο πονηρός θα τον πολεμήση με λογισμούς. Θα του λέη: «Εσύ ήσουν για τον Μοναχισμό, αλλά, αφού παντρεύτηκες, καλά να πάθης», και δεν θα τον αφήνη ήσυχο μέρα-νύχτα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί άνθρωποι δεν ξέρουν τί ζητούν. Νά, πριν από λίγα χρόνια είχε έρθει εδώ μια κοπέλα και μου είπε: «Γέροντα, δεν μπορώ να αποφασίσω ποιόν δρόμο να ακολουθήσω. Θέλω να παντρευτώ, αλλά σκέφτομαι και τον Μοναχισμό. Τί να κάνω;». «Δές τί σε αναπαύει περισσότερο, της λέω, και αυτό να κάνης». «Δεν ξέρω, μου λέει, αλλά μερικές φορές μου φαίνεται ότι κλίνω περισσότερο προς τον γάμο. Σε παρακαλώ, Γέροντα, πές μου εσύ τί να κάνω». «Έ, αφού βλέπεις ότι κλίνεις περισσότερο προς τον γάμο, της λέω, καλύτερα να παντρευτής και ο Θεός θα σε οικονομήση». «Με την ευχή σου, Γέροντα, έτσι θα κάνω», μου λέει. Έρχεται λοιπόν σήμερα και μου λέει: «Γέροντα, παντρεύτηκα. Πήρα έναν ναυτικό, καλός άνθρωπος, δόξα τω Θεώ, δεν μπορώ να πώ, αλλά πολύ ταλαιπωρούμαι. Υποφέρω, γιατί έξι μήνες ζούμε μαζί και έξι μήνες χωριστά· τον μισό χρόνο ταξιδεύει». «Ευλογημένη ψυχή, της λέω, εσύ δεν μου έλεγες ότι σού άρεζε και η έγγαμη και η μοναχική ζωή; Να τώρα που τα έχεις και τα δύο! Γιατί δεν δοξάζεις τον Θεό που σε οικονόμησε έτσι;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σήμερα όμως, Γέροντα, ζούμε σε δύσκολα χρόνια, γι᾿ αυτό μερικοί νέοι διστάζουν να κάνουν οικογένεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν είναι σωστή αυτή η αντιμετώπιση. Αν υπάρχη εμπιστοσύνη στον Χριστό, δεν έχουν τίποτε να φοβηθούν. Τα χρόνια των διωγμών δεν ήταν δύσκολα; Μήπως οι Χριστιανοί είχαν σταματήσει τότε να κάνουν οικογένεια; Πόσους Αγίους έχουμε που μαρτύρησαν μαζί με την γυναίκα τους και τα παιδιά τους!
- type: h2
  initial:
    ru: ''
  text:
    ru: Σπουδές και αποκατάσταση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλά παιδιά δυσκολεύονται να προχωρήσουν στις σπουδές τους, όταν δεν έχουν αποφασίσει ποιά ζωή θα ακολουθήσουν. Τους απασχολεί συνέχεια αυτό το θέμα και δεν μπορούν να συγκεντρωθούν στο διάβασμά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εγώ, όταν κάποιος νέος έχη τέτοια προβλήματα, του λέω: «Ξέρεις ότι σήμερα υπάρχουν κάτι μεγάλα ψυγεία; Να βάλης λοιπόν αυτό το θέμα σε ένα τέτοιο ψυγείο, μέχρι να τελειώσης τις σπουδές σου. Δεν σού λέω να πετάξης αυτά που σε απασχολούν, αλλά να τα φυλάξης εκεί, μέχρι να τελειώσης. Αν δεν προσέξης τώρα την μελέτη σου, τις σπουδές σου, οι φίλοι σου θα τακτοποιηθούν, θα ηρεμήσουν, και μετά θα κάνουν κομποσχοίνι για σένα, για να τακτοποιηθής». Χρειάζεται πολύ να προσέξουν, γιατί αυτό είναι τέχνασμα του εχθρού, για να τους δημιουργή περισπασμούς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, είπα σε κάποια κοπέλα: «Αν σκέφτεσαι να παντρευτής, να μη σπουδάσης».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καί, μέχρι να παντρευτή, τί θα κάνη; Θα πουλάη καραμέλες; Καλύτερα να τελειώση μια επιστήμη ή να μάθη μια τέχνη, γιατί κάτι μπορεί να παρουσιασθή στην ζωή της και να της χρειασθούν αυτά που θα μάθη. Μου είπε κάποτε μια κοπέλα: «Σκέφτομαι τον Μοναχισμό, αλλά συνέχεια αλλάζω γνώμη». «Τί τάξη πάς;», την ρωτάω. «Δευτέρα λυκείου, μου λέει, αλλά δεν θέλω να σπουδάσω». «Δεν θέλεις να σπουδάσης; της λέω. Τότε να πω στον πατέρα σου να σού αγοράση κατσίκια, να σού πάρη και ένα τσομπανόσκυλο να τα φυλάη, να σού δώση και μια φλογέρα να παίζης και να τα βόσκης. Σού αρέσει αυτό; Κοίταξε να σπουδάσης ή να μάθης μια τέχνη». «Τότε, Γέροντα, μου λέει, ώσπου να αποφασίσω αν γίνω μοναχή ή αν παντρευτώ, να μένω στο μοναστήρι ως προδόκιμη, ώστε να μάθω την τέχνη της ταπεινοφροσύνης». «Αυτήν την τέχνη, της λέω, μπορείς να την μάθης και στο σπίτι σου, αν δέχεσαι με χαρά ό,τι σού λένε οι δικοί σου. Θα τελειώσης πρώτα το σχολείο, θα δώσης εξετάσεις για το πανεπιστήμιο καί, όταν τελειώσης, θα δούμε τί θα κάνης». «Πέντε χρόνια όμως, Γέροντα, δεν είναι πολλά για να αποφασίσω;». «Πολλά είναι, αλλά τί να κάνουμε, αφού ακόμη δεν έχεις κατασταλάξει κάπου;». «Φταίω εγώ γι᾿ αυτό, επειδή είμαι ασταθής;», με ρωτάει. «Όχι, αλλά η ζυγαριά προς το παρόν δεν κλίνει ούτε προς το ένα μέρος ούτε προς το άλλο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σε τέτοιες περιπτώσεις να τονίζουμε στα παιδιά να προσέξουν να μη χάνουν άσκοπα τον χρόνο τους. Να ζήσουν όσο πιο πνευματικά γίνεται στην διάρκεια των σπουδών τους, να πάρουν σύντομα το πτυχίο τους, που είναι απαραίτητο, και ύστερα έχει ο Θεός. Στο διάστημα αυτό να βρουν έναν καλό Πνευματικό να τους βοηθάη, για να μην ενθουσιάζωνται εύκολα με την μια ζωή ή με την άλλη, αλλά και να μην απελπίζωνται. Να κάνουν υπομονή να τελειώσουν τις σπουδές τους και τότε θα μπορούν να αποφασίσουν, ώριμα πλέον και με τις περισσότερες προϋποθέσεις που θα έχουν, για την μια ή για την άλλη ζωή, και να κάνουν ό,τι νομίζουν καλύτερο εις δόξαν Θεού. Έτσι που είναι σήμερα ο κόσμος, όσο ωριμάζουν, τόσο καλύτερα είναι. Ξέρετε τί παρατράγουδα συμβαίνουν; Ιδίως όταν κάποιος έχη ενθουσιασμό, πρέπει πολύ να προσέχη να μην παίρνη ανώριμες αποφάσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχουν παιδιά που δεν έχουν όρεξη να διαβάσουν τα μαθήματά τους, γιατί προτιμούν την πνευματική μελέτη και την προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, να μην αφήνουν το διάβασμα. Ας διαβάζουν παράλληλα με τα μαθήματά τους κάτι δυνατό από κάποιο πατερικό βιβλίο, ας προσεύχωνται λίγο, ας κάνουν καμμιά μετάνοια, για να συντηρούνται λίγο πνευματικά. Όταν έχουν πολύ διάβασμα, μπορούν να κάνουν διαλείμματα και να λένε την ευχή ή να ψάλλουν. Γιατί, αν θέλουν να κάνουν κάτι άλλο που είναι για αργότερα, ούτε εκείνο θα μπορούν να το κάνουν σωστά, επειδή θα σκέφτωνται το διάβασμα, ούτε στις σπουδές τους θα προχωρούν, και τελικά δεν θα κάνουν τίποτε. Ενώ, αν διαβάζουν, θα πάρουν γρήγορα το πτυχίο τους και μετά θα κάνουν αυτό που θέλουν. Εγώ, όταν ήμουν στο Σανατόριο[8], για λίγες μέρες ούτε κομποσχοίνια ούτε μετάνοιες ούτε νηστείες έκανα· έτρωγα ό,τι μου έδιναν. «Να βοηθήσω τώρα λίγο τους γιατρούς, έλεγα, για να με βοηθήσουν κι εκείνοι να γίνω καλά, και ύστερα θα κάνω αυτό που θέλω».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έρχονται παιδιά και μου παραπονούνται ότι οι γονείς τους τα ζορίζουν πολύ, για να διαβάσουν. Αν τα ζορίσω και εγώ, δεν θα τα βοηθήσω. Για να καταλάβουν ότι πρέπει να μην αφήνουν το διάβασμά τους, τους λέω παραδείγματα από παιδιά που δεν διάβαζαν και ταλαιπωρήθηκαν, και από παιδιά που πρόκοψαν, επειδή διάβαζαν. Νά, θυμάμαι μια περίπτωση: Ήταν σε μια πόλη δύο γειτονόπουλα. Ο ένας ήταν πανέξυπνος. Με λίγο διάβασμα έπαιρνε συνέχεια άριστα, από το δημοτικό ώς το γυμνάσιο. Ο άλλος με λιγώτερο μυαλό και με πολλή επιμέλεια τον ακολουθούσε. Τελικά ο πρώτος, μόλις τελείωσε την πρώτη λυκείου, έμπλεξε με παρέες, άφησε το σχολείο, και τελικά αναγκάστηκε να εργαστή σε μια επιχείρηση ως καθαριστής. Παντρεύτηκε κιόλας, απέκτησε και δυο παιδιά, και δύσκολα τα έβγαζε πέρα. Ο άλλος τελείωσε την νομική, πήγε και στην Ευρώπη για ανώτατες σπουδές και πήρε πτυχίο για επιχειρήσεις. Μια μέρα στην επιχείρηση που εργαζόταν ο πρώτος περίμεναν νέο διευθυντή. Όλοι έλεγαν ότι έχει ανώτερη μόρφωση. Και τελικά ο νέος διευθυντής ήταν εκείνος ο συμμαθητής του! Μόλις τον είδε, τον γνώρισε. Τον έπιασε τέτοια απελπισία, που έκανε δύο-τρείς απόπειρες αυτοκτονίας. Κάποιος του είπε να έρθη στο Άγιον Όρος να με βρή. Αφού μου μίλησε για την ζωή του, μου λέει πάνω στην συζήτηση: «Ακούς εκεί, να έχω αυτόν διευθυντή!». Του δίνω τότε ένα ξεσκόνισμα γερό. «Βρέ, του λέω, εσύ θα γινόσουν ανώτερος από αυτόν. Θα περνούσες κι εσύ καλά και τα παιδιά σου καλά και θα έκανες και καλωσύνες! Δεν φθάνει που έγινες αιτία και ταλαιπωρείται η οικογένειά σου, τώρα θέλεις να αυτοκτονήσης, για να τους δώσης την χαριστική βολή και να μείνουν ορφανά τα παιδιά σου; Εσένα δεν σε λυπάμαι, γιατί από το κεφάλι σου έπαθες ό,τι έπαθες· τα παιδιά σου λυπάμαι. Το καταλαβαίνεις; Κοίταξε τώρα να κάνης υπομονή και πιστεύω ότι με την βοήθεια του Θεού και ο νέος διευθυντής θα σού φερθή καλά. Μπορεί να σε βάλη και σε καλύτερη θέση. Και αν τυχόν δεν αναπαυθής, να βρής μια άλλη δουλειά. Να μην αφήσης τα παιδιά σου στον δρόμο». Έτσι συμμαζεύτηκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό λέω, αν τα παιδιά που σπουδάζουν διαβάσουν και κουραστούν λίγο στην διάρκεια των σπουδών τους, δεν θα χρωστούν μαθήματα, θα τελειώσουν γρήγορα και δεν θα έχουν αργότερα στενοχώριες. Βλέπω πώς όσα παιδιά χρωστούν μαθήματα κατά την διάρκεια των σπουδών τους, όταν τελειώσουν και διορισθούν, πάλι χρωστούν στον έναν, στον άλλον, και έχουν όλο προβλήματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν ένας νέος έχη κάποια ενδιαφέρουσα γνωριμία κατά την διάρκεια των σπουδών του, συμφέρει να δημιουργήση οικογένεια, ενώ ακόμη σπουδάζει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νομίζω, όσο καλή και αν είναι η γνωριμία, θα είναι εις βάρος των σπουδών του. Ακόμη κι αν βρη την καλύτερη σύντροφο και παντρευτή, θα είναι μια ταλαιπωρία και για την γυναίκα του και για τα παιδιά του. Καλύτερα ας συγκεντρώση όλες τις ψυχικές και σωματικές του δυνάμεις στην επιστήμη του, για να τελειώση ξεκούραστα τις σπουδές του, και ύστερα τακτοποιεί αυτό το θέμα. Γιατί, αν έχη τις δυνάμεις του σκορπισμένες, θα είναι συνέχεια ψυχικά και σωματικά τσακισμένος.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική ζωή είναι βασική προϋπόθεση για την καλή ποκατάσταση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η τάδε που σάς είπε ότι σκέφτεται τον Μοναχισμό μου είπε ότι ένας συμφοιτητής της την ρώτησε γιατί δεν πάει στον κινηματογράφο και δεν βγαίνει έξω με τα αγόρια. Τί έπρεπε να του απαντήση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έπρεπε να του πή: «Τέτοια ερώτηση ούτε ο αδελφός μου μου έκανε ποτέ και μου την κάνεις εσύ;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μετά από λίγες μέρες την συνάντησε έξω από την Σχολή της – αυτή δεν τον είχε δει – και την έπιασε από τον ώμο. Εκείνη του είπε μόνον ένα «γειά σου» και μπήκε αμέσως μέσα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν έκανε καλά! Σ᾿ αυτήν την περίπτωση έπρεπε να αντιδράση, γιατί, έτσι όπως φέρθηκε, μπορεί να του έδωσε την εντύπωση ότι δέχθηκε αυτήν την εκδήλωσή του, οπότε εκείνος θα το ξανακάνη. Η ηλικία στην οποία βρίσκεται τώρα είναι λίγο δύσκολη και δεν την ωφελεί να κάνη συντροφιά με αγόρια. Ούτε χρειάζεται να μιλάη μαζί τους, τάχα για να τα βοηθήση. Και αν αποφασίση να δημιουργήση οικογένεια, όταν γνωρίση ένα καλό παιδί, πρέπει να το πη στους γονείς της. Αυτοί θα εξετάσουν αν έχη τις προϋποθέσεις να κάνουν μια καλή οικογένεια. Αλλά τώρα που δεν έχει ακόμη αποφασίσει ποιά ζωή θα ακολουθήση, δεν την βοηθάει να μιλάη με τα αγόρια, γιατί ζαλίζεται χωρίς λόγο και χάνει την γαλήνη της. Όσα παιδιά ασχολούνται με τέτοια είναι τα καημένα πολύ ζαλισμένα και συνέχεια ταραγμένα· δεν έχουν γαλήνη. Το πρόσωπό τους και τα μάτια τους είναι αγριεμένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η έλξη του γυναικείου φύλου από το ανδρικό, και το αντίθετο, υπάρχει στην φύση του ανθρώπου. Αλλά να της πής ότι τώρα δεν είναι καιρός γι᾿ αυτό. Να κοιτάξη τις σπουδές της. Τα παιδιά που καλλιεργούν αυτήν την έλξη από μικρά, γυρίζουν εκεί το κουμπί πριν έρθη η κατάλληλη ώρα, και ύστερα, όταν έρθη εκείνη η ώρα, το κουμπί είναι ήδη γυρισμένο και δεν μπορούν να χαρούν, γιατί έζησαν αυτήν την χαρά, τότε που δεν ήταν κατάλληλος καιρός. Ενώ, όσα παιδιά προσέχουν, χαίρονται περισσότερο, όταν έρθη ο κατάλληλος καιρός, και μέχρι τότε έχουν πολλή γαλήνη. Βλέπεις, μερικές μητέρες που έχουν ζήσει αγνά πόσο ειρηνικές είναι, παρόλο που έχουν ένα σωρό σκοτούρες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εγώ πάντοτε τονίζω, ο νέος πριν από τον γάμο να προσπαθή να ζή, όσο πιο πνευματικά μπορεί, και να διατηρή την αγνότητά του η οποία του εξασφαλίζει την διπλή υγεία. Η πνευματική ζωή είναι βασική προϋπόθεση για οποιαδήποτε ζωή ακολουθήση κανείς. Ο κόσμος έχει γίνει σαν ένα χωράφι με σιτάρι που αρχίζει να σταχυάζη και μπαίνουν μέσα γουρούνια και το τσαλαπατούν. Και τώρα φαίνονται ανακατεμένα χόρτα, λάσπες, στάχυα, και που και πού, σε καμμιά άκρη, υπάρχει και κανένα στάχυ όρθιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσο περισσότερη πνευματική εργασία κάνει κανείς στα νεανικά του χρόνια, τόσο πιο εύκολα θα είναι όλα αργότερα σε όποια ζωή κι αν διαλέξη. Όσο καλύτερα οπλισθή και προετοιμασθή πριν από την μάχη, τόσο πιο εύκολα θα είναι στον πόλεμο, όταν θα πέφτουν γύρω του οι σφαίρες ή θα βομβαρδίζουν. Έως ότου έρθη ο καιρός να αποφασίση λ.χ. μια κοπέλα αν θα γίνη μοναχή ή μια καλή μητέρα, απαραίτητη είναι η αγνή ζωή. Γι᾿ αυτό να προσπαθήση, όσο μπορεί, να προοδεύη στα μαθήματά της. Όταν προσέχη τα μάτια της και τα αυτιά της και διώχνη τους άσχημους λογισμούς, λιγώτερα θα έχη να πετάξη αργότερα. Ή ένας νέος, όταν συναντάη μια καλή κοπέλα, να προσπαθή να βάζη καλό λογισμό. Να την θεωρή σαν ζωντανή εικόνα μιας Αγίας. Ή, αν συναντήση μια παραστρατημένη κοπέλα, να την δη σαν αδελφή του και να λυπηθή γι᾿ αυτήν, όπως θα λυπόταν για το κατάντημα της αδελφής του, γιατί όλοι είμαστε παιδιά του Αδάμ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σήμερα όμως, Γέροντα, στα πανεπιστήμια κ.λπ. υπάρχουν πολλοί πειρασμοί για έναν νέο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να συνδεθή με πνευματικά παιδιά, για να βοηθιέται και να κινήται σε μια πνευματική ατμόσφαιρα. Ας μην κάνουμε τα πράγματα δυσκολώτερα από ό,τι είναι. Γνωρίζω πολλά παιδιά που πηγαίνουν στο πανεπιστήμιο και ζουν αγνά, με την μικρή δική τους προσπάθεια και με την μεγάλη βοήθεια του Θεού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πρώτο Μέρος – Για Να Σταθεί Η Οικογένεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Όσο μπορούν οι σύζυγοι να καλλιεργήσουν
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν αρετή της αγάπης,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιά να μένουν ενωμένοι πάντοτε οι δύο,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί να μένη μαζί τους και ο Τρίτος,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: ο Γλυκύτατος Χριστός μας».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – Για μια αρμονική οικογένεια
- type: h2
  initial:
    ru: ''
  text:
    ru: Η  καλή αρχή της οικογενειακής ζωής
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάποιος νέος που έχει αποφασίσει την έγγαμη ζωή με ρώτησε πώς θα ξεκινήση σωστά γι᾿ αυτήν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κατ᾿ αρχάς να κοιτάξη να βρη μια καλή κοπέλα που να τον αναπαύη, γιατί καθένας αναπαύεται διαφορετικά και με άλλον άνθρωπο. Να μην κοιτάξη να είναι πλούσια και όμορφη, αλλά προπάντων απλή και ταπεινή. Πρέπει να δώση δηλαδή περισσότερη προσοχή στην εσωτερική ομορφιά και όχι στην εξωτερική. Όταν η κοπέλα είναι θετικός άνθρωπος και προικισμένη με ανδρισμό, χωρίς να έχη περισσότερο από ό,τι χρειάζεται γυναικείο χαρακτήρα, αυτό πολύ βοηθάει στο να βρίσκη ο άνδρας αμέσως κατανόηση και να μην πονοκεφαλιάζη. Αν έχη και φόβο Θεού, έχη ταπείνωση, τότε μπορούν να πιασθούν χέρι-χέρι και να περάσουν το κακό ρεύμα του κόσμου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν ο νέος σκέφτεται κάποια κοπέλα σοβαρά για σύζυγο, νομίζω, καλύτερα είναι πρώτα να το κάνη γνωστό με κάποιο συγγενικό του πρόσωπο στους γονείς της και κατόπιν να το συζητήση και ο ίδιος μαζί τους και με την κοπέλα. Στην συνέχεια, αν δώσουν λόγο και κάνουν αρραβώνες – καλό είναι ο αρραβώνας να μη διαρκή πολύ -, να προσπαθήση, στο διάστημα που θα μεσολαβήση μέχρι τον γάμο, να βλέπη την κοπέλα σαν αδελφή του και να την σέβεται. Αν αγωνισθούν και οι δύο φιλότιμα να διατηρήσουν την παρθενία τους, τότε στο Μυστήριο του γάμου, όταν τους στεφανώση ο ιερέας, θα λάβουν πλούσια την Χάρη του Θεού. Γιατί, όπως λέει ο Άγιος Ιωάννης ο Χρυσόστομος, τα στέφανα είναι σύμβολα της νίκης κατά της ηδονής[9].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στην συνέχεια, όσο μπορούν να καλλιεργήσουν την αρετή της αγάπης, για να μένουν ενωμένοι πάντοτε οι δύο και να μένη μαζί τους και ο Τρίτος, ο Γλυκύτατος Χριστός μας. Φυσικά στην αρχή, ώσπου να τακτοποιηθούν και να γνωρισθούν καλά, μπορεί να έχουν κάποιες δυσκολίες. Έτσι συμβαίνει σε κάθε αρχή. Νά, προχθές είδα ένα πουλάκι. Μόλις είχε βγή να βρη την τροφή του και πετούσε ίσα με μια σπιθαμή πάνω από το έδαφος. Δεν ήξερε το καημένο να πιάνη εύκολα τα ζωύφια και έκανε μια ώρα για να πιάση κανένα έντομο να φάη. Καθώς το κοίταζα, συλλογιζόμουν πώς κάθε αρχή είναι δύσκολη. Ο φοιτητής, όταν πάρη το πτυχίο του και αρχίση να εργάζεται, στην αρχή δυσκολεύεται. Ο δόκιμος στο μοναστήρι στην αρχή έχει και αυτός δυσκολίες. Ο νέος, όταν παντρευτή, πάλι στην αρχή συναντά δυσκολίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πειράζει, Γέροντα, αν η κοπέλα είναι μεγαλύτερη από τον άνδρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν υπάρχει κανόνας της Εκκλησίας που να λέη πώς, αν μια κοπέλα είναι δύο-τρία ή και πέντε χρόνια μεγαλύτερη από τον νέο, δεν κάνει να παντρευτούν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Στην διαφορά των χαρακτήρων κρύβεται η αρμονία του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια μέρα ήρθε στο Καλύβι κάποιος και μου είπε ότι είναι πολύ στενοχωρημένος, γιατί δεν συμφωνεί με την γυναίκα του. Είδα όμως ότι δεν υπάρχει κάτι σοβαρό ανάμεσά τους. Έχει ένα εξόγκωμα αυτός, κάποιο άλλο η γυναίκα του, και δεν μπορούν να πλησιάσουν ο ένας τον άλλον. Χρειάζονται λίγο πλάνισμα. Πάρε δύο σανίδες απλάνιστες. Η μία έχει σ᾿ αυτό το σημείο έναν ρόζο, η άλλη σ᾿ εκείνο το σημείο καί, αν πάς να τις ενώσης, μένει ένα κενό ανάμεσά τους. Άμα όμως πλανίσης λίγο την μια από εδώ, λίγο την άλλη από εκεί, αλλά με την ίδια πλάνη, αμέσως εφάπτονται[10].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου λένε μερικοί άνδρες: «Δεν συμφωνώ με την γυναίκα μου· είμαστε αντίθετοι χαρακτήρες. Άλλος χαρακτήρας εκείνη, άλλος εγώ! Πώς κάνει τέτοια παράξενα πράγματα ο Θεός; Δεν θα μπορούσε να οικονομήση μερικές καταστάσεις έτσι, ώστε να ταιριάζουν τα ανδρόγυνα, για να μπορούν να ζουν πνευματικά;». «Δεν καταλαβαίνετε, τους λέω, ότι μέσα στην διαφορά των χαρακτήρων κρύβεται η αρμονία του Θεού; Οι διαφορετικοί χαρακτήρες δημιουργούν αρμονία. Αλλοίμονο, αν ήσασταν ίδιοι χαρακτήρες! Σκεφθήτε τί θα γινόταν, αν λ.χ. και οι δύο θυμώνατε εύκολα· θα γκρεμίζατε το σπίτι. Ή, αν και οι δύο ήσασταν ήπιοι χαρακτήρες, θα κοιμόσασταν όρθιοι! Αν ήσασταν τσιγγούνηδες, θα ταιριάζατε μέν, αλλά θα πηγαίνατε και οι δύο στην κόλαση. Αν πάλι ήσασταν απλοχέρηδες, θα μπορούσατε να κρατήσετε σπίτι; Θα το διαλύατε, και τα παιδιά σας θα γύριζαν στους δρόμους. Ένα στραβόξυλο, αν πάρη ένα στραβόξυλο, ταιριάζουν μεταξύ τους – έτσι δεν είναι; – θα σκοτωθούν όμως σε μια μέρα! Γι᾿ αυτό, τί γίνεται; Οικονομάει ο Θεός ένας καλός να πάρη ένα στραβόξυλο, για να βοηθηθή, γιατί μπορεί να είχε καλή διάθεση, αλλά να μην είχε βοηθηθή από μικρός».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι μικροδιαφορές των χαρακτήρων των συζύγων βοηθούν να δημιουργηθή μια αρμονική οικογένεια, γιατί ο ένας συμπληρώνει τον άλλον. Στο αυτοκίνητο είναι απαραίτητο και το γκάζι, για να προχωρήση, αλλά και το φρένο, για να σταματήση. Αν το αυτοκίνητο είχε μόνο φρένο, δεν θα κουνιόταν, και αν είχε μόνον ταχύτητες, δεν θα μπορούσε να σταματήση. Σε ένα ανδρόγυνο ξέρετε τί είπα; «Επειδή ταιριάζετε, γι᾿ αυτό δεν ταιριάζετε!». Είναι και οι δύο ευαίσθητοι. Αν συμβή κάτι στο σπίτι, και οι δύο τα χάνουν και αρχίζουν: «Ώχ, τί πάθαμε!» ο ένας, «ώχ, τί πάθαμε!» ο άλλος. Ο ένας δηλαδή βοηθάει τον άλλον να απελπισθή πιο πολύ. Δεν μπορεί να τον τονώση λίγο· «γιά στάσου, να του πή, δεν είναι και τόσο σοβαρό αυτό που μας συμβαίνει». Το έχω δει αυτό σε πολλά ανδρόγυνα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και στην αγωγή των παιδιών, όταν οι σύζυγοι είναι διαφορετικοί χαρακτήρες, μπορούν περισσότερο να βοηθήσουν. Ο ένας κρατάει λίγο φρένο, ο άλλος λέει: «Άφησε τα παιδιά λίγο ελεύθερα». Αν τα στρυμώξουν και οι δύο, θα χάσουν τα παιδιά τους. Και αν τα αφήσουν και οι δύο ελεύθερα, πάλι θα τα χάσουν. Ενώ έτσι βρίσκουν και τα παιδιά μία ισορροπία.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Θέλω να πω ότι όλα χρειάζονται. Φυσικά δεν πρέπει να ξεπερνούν τα όρια, αλλά ο καθένας να βοηθάη τον άλλον με τον τρόπο του. Αν φάς λ.χ. κάτι πολύ γλυκό, θέλεις να φάς και κάτι που είναι λίγο αλμυρό. Τρώς, ας υποθέσουμε, πολλά σταφύλια, θέλεις και λίγο τυρί, για να κόψη την γλύκα. Ή τα λάχανα, άμα είναι πολύ πικρά, δεν τρώγονται. Το λίγο πικρό όμως βοηθάει, όπως και το λίγο ξινό. Αλλά, αν όποιος είναι ξινός λέη: «νά γίνετε όλοι ξινοί σαν κι εμένα», όποιος είναι πικρός λέη: «νά γίνετε όλοι πικροί», και ο άλλος που είναι αλμυρός λέη: «όλοι να γίνετε αλμυροί», τότε δεν γίνεται χωριό.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο σεβασμός μεταξύ των συζύγων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός τα ρύθμισε όλα με σοφία. Με άλλα χαρίσματα προίκισε τον άνδρα, με άλλα την γυναίκα. Έδωσε στον άνδρα ανδρισμό, για να τα βγάζη πέρα στις δύσκολες υποθέσεις και για να υποτάσσεται σ᾿ αυτόν η γυναίκα. Γιατί, αν έδινε και στην γυναίκα τον ίδιο ανδρισμό, δεν θα μπορούσε να σταθή οικογένεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έλεγαν στην Ήπειρο για μία γυναίκα ότι ήταν φοβερή! Φορούσε ένα άσπρο πουκάμισο μέχρι κάτω και είχε πάντα μαζί της ένα γιαταγάνι! Οι ληστές την έπαιρναν στην συντροφιά τους! Σκεφθήτε να έχουν μια γυναίκα στην σπείρα τους! Μια φορά πήγε ώρες δρόμο με τα πόδια σε ένα μακρινό χωριό, για να πάρη ένα Βλαχάκι και να το κάνη γαμπρό στην κόρη της. Επειδή όμως εκείνο αντιδρούσε, το έκλεψε, το φορτώθηκε στην πλάτη της και το έφερε στο χωριό της! Αυτά όμως είναι εξαιρέσεις. Αν επιστρατεύσης γυναίκες και κάνης με αυτές έναν λόχο και βάλης καμμιά δεκαριά προσκοπάκια να έρχωνται από πέρα, ού, έφυγαν όλες! Θα νομίζουν ότι είναι ο εχθρός!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '«Ο ανήρ, λέει η Γραφή, εστι κεφαλή της γυναικός»[11]. Δηλαδή ο Θεός κανόνισε, ώστε ο άνδρας να αφεντεύη στην γυναίκα. Να αφεντεύη η γυναίκα στον άνδρα είναι ύβρις στον Θεό. Ο Θεός έπλασε πρώτα τον Αδάμ και ο Αδάμ είπε για την γυναίκα: «Τούτο νυν οστούν εκ των οστέων μου και σάρξ εκ της σαρκός μου»[12]. Η γυναίκα, λέει το Ευαγγέλιο, πρέπει να φοβάται τον άνδρα͵, δηλαδή να τον σέβεται, και ο άνδρας να αγαπάη την γυναίκα[13]. Μέσα στην αγάπη είναι ο σεβασμός. Μέσα στον σεβασμό είναι η αγάπη. Αυτό το οποίο αγαπώ, το σέβομαι κιόλας. Και αυτό το οποίο σέβομαι, το αγαπώ. Δηλαδή δεν είναι άλλο το ένα και άλλο το άλλο· ένα πράγμα είναι και τα δύο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι άνθρωποι όμως φεύγουν από αυτήν την αρμονία του Θεού και δεν καταλαβαίνουν αυτά που λέει το Ευαγγέλιο. Έτσι ο άνδρας παίρνει στραβά αυτό που γράφει το Ευαγγέλιο και λέει στην γυναίκα: «Πρέπει να με φοβάσαι». Μά, αν σε φοβόταν, δεν θα σε παντρευόταν! Είναι και μερικές γυναίκες που λένε: «Γιατί η γυναίκα να φοβάται τον άνδρα; Αυτό δεν το παραδέχομαι. Τί θρησκεία είναι αυτή; Δεν υπάρχει ισότητα». Αλλά βλέπεις τί λέει η Αγία Γραφή; «Αρχή σοφίας, φόβος Κυρίου»[14]. Φόβος Θεού είναι ο σεβασμός προς τον Θεό, η ευλάβεια, η πνευματική συστολή. Αυτός ο φόβος σε κάνει να αισθάνεσαι δέος. Είναι κάτι το ιερό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ισότητα που ζητούν οι γυναίκες με τους άνδρες μόνον ώς ένα σημείο μπορεί να ισχύση. Σήμερα στις γυναίκες, επειδή εργάζονται και ψηφίζουν, μπήκε ένα αρρωστημένο πνεύμα και νομίζουν ότι είναι ίσες με τους άνδρες. Φυσικά οι ψυχές ίδιες είναι. Αλλά, όταν ο άνδρας δεν αγαπά την γυναίκα και η γυναίκα δεν σέβεται τον άνδρα, δημιουργούνται σκηνές στην οικογένεια. Παλιά το να αντιμιλήση η γυναίκα στον άνδρα, το θεωρούσαν πολύ βαρύ. Τώρα μπήκε ένα αλήτικο πνεύμα. Τότε τί όμορφα ήταν! Είχα γνωρίσει ένα ανδρόγυνο που ο άνδρας ήταν πολύ κοντός και η γυναίκα μια ανδρογυναίκα, ψηλή μέχρι εκεί επάνω! Αφού εκατόν ογδόντα οκάδες σιτάρι το ξεφόρτωνε από το κάρρο μόνη της. Μια φορά ένας εργάτης – ψηλός κι εκείνος – πήγε να την πειράξη και εκείνη τον άρπαξε και τον πέταξε πέρα σαν σπιρτόξυλο! Αλλά να βλέπατε τί υπακοή έκανε στον άνδρα της, πώς τον σεβόταν! Έτσι κρατιέται η οικογένεια, αλλιώς δεν γίνεται.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγάπη μεταξύ των συζύγων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έγραψες, Γερόντισσα, ευχές στον Δημήτρη που παντρεύεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έγραψα, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Φέρε την κάρτα να συμπληρώσω κι εγώ: «Ο Χριστός και η Παναγία μαζί σας. Σού δίνω ευλογία, Δημήτρη, να μαλώνης με όλον τον κόσμο, εκτός από την Μαρία! Το ίδιο και στην Μαρία!». Για να δώ, θα καταλάβουν τί εννοώ; Με ρώτησε κάποιος: «Γέροντα, τί ενώνει περισσότερο τον άνδρα με την γυναίκα;». «Η ευγνωμοσύνη», του λέω. Ο ένας αγαπάει τον άλλον γι᾿ αυτό που του χαρίζει. Η γυναίκα δίνει στον άνδρα την εμπιστοσύνη, την αφοσίωση, την υπακοή. Ο άνδρας δίνει στην γυναίκα την σιγουριά ότι μπορεί να την προστατέψη. Η γυναίκα είναι η αρχόντισσα του σπιτιού, αλλά και η μεγάλη υπηρέτρια. Ο άνδρας είναι ο κυβερνήτης του σπιτιού, αλλά και ο χαμάλης.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μεταξύ τους τα ανδρόγυνα πρέπει να έχουν την εξαγνισμένη αγάπη, για να έχουν αλληλοπαρηγοριά και να μπορούν να κάνουν και τα πνευματικά τους καθήκοντα. Για να ζήσουν αρμονικά, χρειάζεται να βάλουν εξαρχής ως θεμέλιο της ζωής τους την αγάπη, την ακριβή αγάπη, που βρίσκεται μέσα στην πνευματική αρχοντιά, στην θυσία, και όχι την ψεύτικη, την κοσμική, την σαρκική. Αν υπάρχη αγάπη, θυσία, πάντα έρχεται ο ένας στην θέση του άλλου, τον καταλαβαίνει, τον πονάει. Και όταν παίρνη κανείς τον πλησίον του στην πονεμένη του καρδιά, παίρνει τότε μέσα του τον Χριστό, ο Οποίος τον γεμίζει και πάλι με την ανέκφραστη αγαλλίασή Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν υπάρχη αγάπη, και μακριά να βρεθή ο ένας από τον άλλον, αν οι περιστάσεις το απαιτήσουν, κοντά θα βρίσκεται, γιατί την αγάπη του Χριστού δεν την χωρίζουν αποστάσεις. Όταν όμως, Θεός φυλάξοι, τα ανδρόγυνα δεν έχουν αγάπη μεταξύ τους, μπορεί να βρίσκωνται κοντά, αλλά στην πραγματικότητα βρίσκονται μακριά. Γι᾿ αυτό πρέπει να προσπαθήσουν να διατηρήσουν σε όλη την ζωή τους την αγάπη, να θυσιάζεται ο ένας για τον άλλον.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η σαρκική αγάπη ενώνει εξωτερικά τους κοσμικούς ανθρώπους τόσο μόνον, όσο υπάρχουν κοσμικά προσόντα, και τους χωρίζει, όταν αυτά χαθούν, οπότε και αυτοί οδηγούνται στην απώλεια. Ενώ, όταν υπάρχη η πνευματική, η ακριβή αγάπη, αν τυχόν ο ένας από τους συζύγους χάση τα κοσμικά του προσόντα, αυτό όχι μόνο δεν τους χωρίζει, αλλά τους ενώνει περισσότερο. Όταν υπάρχη μόνον η σαρκική αγάπη, τότε, αν λ.χ. η γυναίκα μάθη ότι ο σύντροφός της κοίταξε κάποια άλλη, του πετάει βιτριόλι και τον τυφλώνει. Ενώ, όταν υπάρχη η αγνή αγάπη, τον πονάει πιο πολύ και κοιτάζει με τρόπο πώς να τον φέρη πάλι στον σωστό δρόμο. Έτσι έρχεται η Χάρις του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια φορά ήρθε στο Καλύβι κάποιος Ελληνοαμερικανός γιατρός. Είδα το πρόσωπό του που ήταν φωτεινό, γι᾿ αυτό με τρόπο τον ρώτησα για την ζωή του. «Πάτερ, μου είπε, είμαι Ορθόδοξος, αλλά μέχρι τελευταία ούτε νηστείες κρατούσα ούτε στην εκκλησία πήγαινα συχνά. Ένα βράδυ είχα γονατίσει στο δωμάτιό μου να παρακαλέσω τον Θεό για ένα θέμα που με απασχολούσε, οπότε γέμισε το δωμάτιο με ένα γλυκό φώς. Για αρκετή ώρα δεν έβλεπα τίποτε άλλο παρά μόνο φως και ένιωθα μια ανέκφραστη ειρήνη μέσα μου». Θαύμασα, γιατί κατάλαβα ότι ο άνθρωπος αυτός αξιώθηκε να δη το άκτιστο φώς, και του ζήτησα να μου πη τί είχε προηγηθή. «Πάτερ, μου είπε, είμαι παντρεμένος και έχω τρία παιδιά. Στην αρχή περνούσαμε καλά στην οικογένεια. Μετά όμως η γυναίκα μου δεν είχε την υπομονή να ασχολήται στο σπίτι με τα παιδιά και ζητούσε να βγαίνουμε έξω με τις φίλες της. Της έκανα το χατίρι. Έπειτα από ένα διάστημα μου είπε ότι ήθελε να βγαίνη μόνη της με τις φίλες της. Το δέχθηκα και αυτό και κοίταζα εγώ τα παιδιά. Ύστερα δεν ήθελε να κάνουμε μαζί διακοπές και μου ζητούσε χρήματα να πηγαίνη μόνη της. Στην συνέχεια μου ζήτησε ένα διαμέρισμα, για να ζη μόνη της. Το έκανα και αυτό, αλλά εκείνη μάζευε εκεί τους φίλους της. Όλο αυτό το διάστημα προσπαθούσα να την βοηθήσω με διάφορους τρόπους, με συμβουλές κ.λπ., ώστε να λυπηθή τα παιδιά μας, αλλά δεν δεχόταν κουβέντα. Τελικά μου πήρε ένα μεγάλο χρηματικό ποσό και εξαφανίσθηκε. Έψαχνα, ρωτούσα παντού, άδικα όμως. Είχα χάσει τελείως τα ίχνη της. Κάποια μέρα πληροφορήθηκα ότι είχε έρθει εδώ στην Ελλάδα και έμενε σε κάποιον κακόφημο οίκο. Η στενοχώρια μου για το κατάντημά της δεν περιγράφεται. Γονάτισα πάνω στην θλίψη μου να προσευχηθώ. «Θεέ μου, είπα, βοήθησέ με να την βρώ και να κάνω ό,τι μπορώ, για να μη χάση την ψυχή της. Αυτήν την κατάντια της δεν μπορώ να την αντέξω». Τότε με έλουσε εκείνο το φως και πλημμύρισε με ειρήνη η καρδιά μου». «Ο Θεός, αδελφέ, του είπα, είδε την υπομονή, την ανεξικακία, την αγάπη σου και σε παρηγόρησε με αυτόν τον τρόπο».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό λέω ότι θα μας κρίνουν οι λαϊκοί. Βλέπετε; Γιατρός στην Αμερική, με τέτοια σύζυγο, με τί συνθήκες και σε τί περιβάλλον ζούσε, και όμως τί αξιώθηκε!
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Με την υπομονή σώζεται η οικογένεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί κάνει η αδελφή σου; Πώς τα πάει με τον σύζυγό της;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μαθαίνω ότι έχει δυσκολίες, αλλά κάνει υπομονή καί, όταν χρειάζεται, τραβάει μπροστά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έτσι είναι. Όταν δύο βόδια είναι στον ζυγό και το ένα είναι λίγο αδύνατο ή τεμπέλικο, τότε το άλλο βάζει περισσότερη δύναμη και τραβάει, σβαρνίζει κατά κάποιον τρόπο και το άλλο. Είδες; Κοσμικοί άνθρωποι και κάνουν δουλειά στον εαυτό τους. Εσείς εδώ είστε αρχοντοπούλες. Σκέψου μια μητέρα να έχη τέσσερα παιδιά και το ένα να είναι καθυστερημένο, το άλλο να έχη ψυχοπάθεια, το άλλο μεσογειακή αναιμία, το άλλο να γυρνάη τα μεσάνυχτα. Και με τον σύζυγο, ανάλογα με το τί άνθρωπος είναι, να έχη η καημένη άλλα βάσανα. Και να υπομένη τόσα και τόσα και να μη μιλάη, να πάη να σκάση, να μην έχη που να πη τον πόνο της, γιατί και μερικά πράγματα από την οικογένεια δεν μπορεί να τα πη κανείς πιο πέρα. Μπορεί λ.χ. ο άνδρας να σηκώνεται να φεύγη και να μην της δίνη ούτε διατροφή. Να μην έχη χρήματα η καημένη ούτε το νοίκι να πληρώση, να θέλουν να την βγάλουν από το σπίτι. Να αναγκάζεται να εργάζεται οπουδήποτε, να συναντά κινδύνους, και να σού λέη: «Κάνε προσευχή να απαλλαγώ τουλάχιστον από αυτούς τους κινδύνους»! Ή να είναι μέθυσος ο άνδρας της και να μη δουλεύη, να αναγκάζεται να δουλεύη εκείνη, να καθαρίζη σκάλες στις πολυκατοικίες, κι εκείνος να πηγαίνη στην ταβέρνα. Να έρχεται τα μεσάνυχτα μεθυσμένος, να την δέρνη και να της ζητάη τα χρήματα που πήρε ή να πηγαίνη να τα παίρνη μόνος του από τα αφεντικά της. Άχ, μαρτύριο είναι!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και καλά, μερικές γυναίκες έχουν αμαρτίες και εξοφλούν έτσι, αλλά είναι και άλλες που δεν έχουν αμαρτίες. Αυτές έχουν καθαρό μισθό από την ταλαιπωρία που περνούν. Γνωρίζω μια μάνα που ήταν ένα αγγελούδι, πολύ καλή ψυχή, το πιο καλό, το πιο ήσυχο παιδί από την οικογένεια, και σε τί στραβόξυλο έπεσε! Πώς ξεγελάστηκαν οι δικοί της! Παντρεύτηκε έναν μέθυσο, που από μικρός ήταν αλητάκι. Ο πατέρας του μεθούσε και πήρε και αυτός την ίδια συνήθεια. Να ξενοδουλεύη η καημένη, να σκοτώνεται στην δουλειά, και εκείνος να την δέρνη και να την απειλή με το μαχαίρι. Πόσες φορές της λέει: «Θα σε σφάξω»! Και να φοβάται μην την σφάξη! Μαρτύριο περνάει! Έχει και τέσσερα παιδιά. Οι δικοί της έφθασαν σε σημείο να της λένε να τον χωρίση, αλλά εκείνη τους απαντάει: «Λέω να κάνω ακόμη υπομονή», και κάνει υπομονή. Το καταλαβαίνετε; Ούτε Γεροντικό διάβασε ούτε Συναξάρια, και όμως κάνει υπομονή. «Καλά, της είπα μια φορά, τα παιδιά δεν επεμβαίνουν;». «Ακόμη είναι δεκαπέντε-δεκαέξι χρονών, μου είπε. Ας πάνε στρατιώτες, και μετά θα τον περιλάβουν!». Δηλαδή, μέχρι να πάνε στρατιώτες τα παιδιά, να τρώη ξύλο!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η υπομονή χαριτώνει τον άνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορείς να αντιμετωπίσης τον άλλον, όταν είναι νευριασμένος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με την υπομονή!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και αν δεν έχης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να πάς να αγοράσης! Πουλάνε στα σούπερ-μάρκετ!... Κοίταξε, όταν ο άλλος είναι μπουρινιασμένος, ό,τι και να του πής, δεν γίνεται τίποτε. Καλύτερα εκείνη την στιγμή να σιωπήσης και να λές την ευχή. Με την ευχή θα καλμάρη ο άλλος, θα ηρεμήση και θα μπορέσης μετά να συνεννοηθής μαζί του. Βλέπεις, και οι ψαράδες δεν πάνε να ψαρέψουν, αν δεν έχη μπουνάτσα· κάνουν υπομονή, ώσπου να καλωσυνέψη ο καιρός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Που οφείλεται, Γέροντα, η ανυπομονησία των ανθρώπων;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην πολλή... εσωτερική τους ειρήνη! Ο Θεός την σωτηρία των ανθρώπων την κρέμασε στην υπομονή. «Ο υπομείνας εις τέλος, σωθήσεται»[15], λέει το Ευαγγέλιο. Γι᾿ αυτό δίνει δυσκολίες, διάφορες δοκιμασίες, για να ασκηθούν στην υπομονή οι άνθρωποι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η υπομονή ξεκινά από την αγάπη. Για να υπομείνης τον άλλον, πρέπει να τον πονέσης. Και βλέπω πώς με την υπομονή σώζεται η οικογένεια. Είδα θηρία να γίνωνται αρνιά. Με την εμπιστοσύνη στον Θεό τα πράγματα εξελίσσονται ομαλά και πνευματικά. Μια φορά, όταν ήμουν στην Μονή Στομίου, είχα δει στην Κόνιτσα μια γυναίκα που έλαμπε το πρόσωπό της. Ήταν μητέρα πέντε παιδιών. Μετά θυμήθηκα ποιά ήταν. Ο άνδρας της ήταν μαραγκός και έπαιρνε πολλές φορές δουλειές μαζί με τον μάστορά μου[16]. Μια κουβέντα να του έλεγαν οι νοικοκυραίοι, λ.χ. «μαστρο-Γιάννη, μήπως αυτό να το κάνουμε έτσι;», γινόταν θηρίο. «Εμένα θα μου κάνης τον δάσκαλο;», τους έλεγε. Έσπαζε τα εργαλεία του, τα πετούσε και έφευγε. Αφού παρατούσε την δουλειά του και τα έσπαζε όλα σε ξένα σπίτια, καταλαβαίνεις στο σπίτι του τί έκανε! Αυτή λοιπόν ήταν του μαστρο-Γιάννη η γυναίκα. Με αυτόν τον άνθρωπο δεν μπορούσες μία μέρα να καθήσης, και αυτή χρόνια ζούσε μαζί του. Κάθε μέρα περνούσε μαρτύριο, και όμως όλα τα αντιμετώπιζε με πολλή καλωσύνη και έκανε υπομονή. Επειδή ήξερα την κατάσταση στο σπίτι, όταν την συναντούσα, την ρωτούσα: «Τί κάνει ο κυρ-Γιάννης; Δουλεύει;». «Έ, πότε δουλεύει, πότε κάθεται λιγάκι!». «Πώς τα περνάτε;». «Πολύ καλά, Πάτερ!», μου έλεγε. Και το έλεγε με την καρδιά της. Δεν υπολόγιζε που έσπαζε τα εργαλεία του – και αξίας εργαλεία – ούτε που αναγκαζόταν η καημένη να ξενοδουλεύη, για να τα βγάλουν πέρα. Βλέπετε με πόση υπομονή, με πόση καλωσύνη και με πόση αρχοντιά τα αντιμετώπιζε όλα! Ούτε τον κατηγορούσε καθόλου! Γι᾿ αυτό ο Θεός την χαρίτωσε και έλαμπε το πρόσωπό της. Μεγάλωσε και τα πέντε παιδιά της και έγιναν πολύ καλά παιδιά. Μπόρεσε και κράτησε και τα παιδιά της.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορούσε να δικαιολογή τον άνδρα της;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Με έναν καλό λογισμό: «Άνδρας μου είναι, έλεγε, θα πη και καμμιά κουβέντα. Και εγώ, αν ήμουν στην θέση του, μπορεί να έκανα τα ίδια». Εφήρμοζε το Ευαγγέλιο, γι᾿ αυτό ο Θεός έστελνε την θεία Χάρη Του. Και αν κοσμικοί άνθρωποι κάνουν υπομονή και χαριτώνωνται, πόσο μάλλον πρέπει να κάνουμε υπομονή εμείς οι μοναχοί, που έχουμε όλες τις προϋποθέσεις, όλες τις δυνατότητες για πνευματική ζωή!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όπως έχω καταλάβει, τα μεγαλύτερα σκάνδαλα, όχι μόνο στις οικογένειες αλλά και στα κράτη, γίνονται από τιποτένια πράγματα. Στην οικογένεια πρέπει ο ένας να ταπεινώνεται στον άλλον, να μιμήται τις αρετές του, αλλά και να ανέχεται τις ιδιοτροπίες του. Για μια τέτοια αντιμετώπιση πολύ βοηθάει να σκέφτεται κανείς ότι ο Χριστός θυσιάσθηκε για τις αμαρτίες μας και μας ανέχεται όλους, δισεκατομμύρια ανθρώπους, αν και είναι αναμάρτητος – ενώ εμείς, όταν ταλαιπωρούμαστε από τις ιδιοτροπίες των άλλων, εξοφλούμε αμαρτίες. Τα οικονομάει έτσι ο Καλός Θεός, ώστε ο ένας, με το χάρισμα που έχει, να βοηθάη τον άλλον, καί, με το κουσούρι που έχει, να ταπεινώνεται στον άλλον. Γιατί ο κάθε άνθρωπος έχει τα χαρίσματά του, αλλά έχει και μερικά κουσούρια και πρέπει να αγωνίζεται να τα κόψη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έδωσα ένα ξεσκόνισμα σε κάποιον! Να δήτε υπακοή που του κάνει η γυναίκα του, αν και έχει πολλές ικανότητες! Μπροστά της εκείνος είναι ένα παιδί. Αυτή, με την υπακοή που κάνει, συνέχεια δέχεται, αποθηκεύει, θεία Χάρη, ενώ εκείνος με τον εγωισμό του συνέχεια διώχνει την θεία Χάρη και αδειάζει. Τελικά ποιός είναι κερδισμένος; Βλέπεις, το μυστικό είναι η ταπείνωση. Όλη η βάση εκεί είναι. Υπακοή, ταπείνωση. Αν εκείνος αναγνώριζε την αδυναμία του και ζητούσε βοήθεια από τον Θεό, θα ερχόταν και σ᾿ αυτόν η θεία Χάρις.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πιστή σύζυγος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια γυναίκα την εγκατέλειψε ο άνδρας της, πήρε και το παιδί, και έχει σχέσεις με δύο άλλες γυναίκες. Με ρώτησε τί να κάνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να της πής, όσο μπορεί, να κάνη υπομονή, προσευχή, και να φέρεται με καλωσύνη. Να περιμένη· να μη διαλύση τον γάμο η ίδια. Κάποιος περιφρονούσε την γυναίκα του, την κακομεταχειριζόταν, και αυτή τα αντιμετώπιζε όλα με υπομονή και καλωσύνη, μέχρι που πέθανε σχετικά νέα. Όταν έκαναν την εκταφή της, βγήκε από τον τάφο μία ευωδία. Απόρησαν όσοι βρίσκονταν εκεί. Βλέπετε, αυτή αντιμετώπιζε τα πάντα με υπομονή σ᾿ αυτήν την ζωή, γι᾿ αυτό δικαιώθηκε στην άλλη ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχω υπ᾿ όψιν μου και μια άλλη περίπτωση. Ένα κοσμικό παιδί είχε συμπαθήσει μια κοπέλα που ζούσε πνευματικά. Για να τον συμπαθήση και η κοπέλα, προσπαθούσε να ζη κι αυτός πνευματικά, εκκλησιαζόταν κ.λπ. Τελικά παντρεύτηκαν. Μετά όμως από χρόνια εκείνος άρχισε πάλι την κοσμική ζωή. Ενώ είχαν και μεγάλα παιδιά – ένα αγόρι στο πανεπιστήμιο και δύο κοπέλες, μία στο λύκειο και μία στο γυμνάσιο – αυτός συνέχιζε να ζη άσωτα. Είχε μια μεγάλη επιχείρηση και έβγαζε πολλά χρήματα, αλλά τα περισσότερα τα ξόδευε με την άσωτη ζωή του. Η καημένη η σύζυγός του κρατούσε το σπίτι με την οικονομία που έκανε και τα παιδιά της με τις συμβουλές της. Δεν κατηγορούσε τον πατέρα τους, για να μην τον σιχαθούν και τραυματισθούν, αλλά και για να μην παρασυρθούν. Τα βράδια που γύριζε αργά, εύκολα τον δικαιολογούσε, λέγοντας στα παιδιά ότι έχει δουλειές, αλλά το μεσημέρι που πήγαινε στο σπίτι με κάποια φιλενάδα του, τί να έλεγε; Γιατί, τί έκανε ο αθεόφοβος αυτός άνθρωπος; – αν και δεν αξίζει να τον λέη κανείς άνθρωπο, επειδή δεν είχε καθόλου ανθρωπιά. Τηλεφωνούσε στην γυναίκα του να του ετοιμάση τα φαγητά που επιθυμούσε και ερχόταν το μεσημέρι με κάποια από τις φιλενάδες του για φαγητό. Η καημένη η μάνα, για να μην μπούν σε άσχημους λογισμούς τα παιδιά της, τους καλοδεχόταν. Έδινε την εντύπωση ότι είναι δική της φίλη και πέρασε ο σύζυγός της από το σπίτι της και την έφερε στο σπίτι τους με το αυτοκίνητό του. Έστελνε με τρόπο τα παιδιά στα δωμάτιά τους, για να διαβάσουν, γιατί φοβόταν μήπως δούν καμμιά άσχημη σκηνή, επειδή δυστυχώς αυτός δεν πρόσεχε, αλλά ασχημονούσε και μέσα στο σπίτι. Αυτό γινόταν κάθε μεσημέρι και κάθε τόσο της κουβαλούσε και άλλο πρόσωπο. Αφού τα παιδιά έφθασαν να λένε στην μητέρα τους: «Πόσες φίλες έχεις, μαμά;». «Γνωριζόμασταν από παλιά», τους έλεγε εκείνη. Εν τω μεταξύ αυτός την είχε την καημένη χειρότερα και από υπηρέτρια, διότι της φερόταν με πολλή βαρβαρότητα. Σκεφθήτε τώρα, αυτή η μάνα κάθε μέρα να υπηρετή δύο κτήνη, που ατίμαζαν το σπίτι, και να βάζη συνέχεια καλούς λογισμούς στα παιδιά της. Και δεν είναι ότι ήξερε πώς το θέμα αυτό θα λήξη έπειτα από ένα διάστημα, ώστε να πή: «θά κάνω υπομονή» και να έχη και λίγη παρηγοριά. Αυτή η κατάσταση συνεχίστηκε αρκετά χρόνια. Επειδή όμως είχε δώσει ο ταλαίπωρος πολλά δικαιώματα στον διάβολο, επόμενο ήταν να δέχεται φοβερές δαιμονικές επιδράσεις. Ήταν σαν τρελλός, δεν ήλεγχε τον εαυτό του, όλα του έφταιγαν. Μια μέρα λοιπόν, όπως έτρεχε με το αυτοκίνητό του, καθώς ήταν μεθυσμένος από την σαρκική μέθη, ξέφυγε από τον δρόμο και έπεσε σε έναν γκρεμό. Το αυτοκίνητο διαλύθηκε και αυτός τραυματίστηκε σοβαρά. Τον μετέφεραν στο νοσοκομείο και ύστερα από μια σχετική νοσηλεία τον πήγαν στο σπίτι σακατεμένο. Καμμιά φιλενάδα του δεν τον πλησίασε, γιατί δεν είχε πια ούτε πολλά χρήματα, αλλά και το πρόσωπό του ήταν παραμορφωμένο. Η καλή σύζυγος όμως και καλή μάνα τον περιποιόταν με πολλή καλωσύνη, χωρίς να του θυμίζη τίποτε από την άσωτη ζωή του. Αυτό πολύ τον συγκλόνισε και τον αλλοίωσε πνευματικά. Μετανόησε ειλικρινά, ζήτησε και εξομολογήθηκε, έζησε λίγα χρόνια χριστιανικά, με εσωτερική ειρήνη, και αναπαύθηκε εν Κυρίω. Μετά τον θάνατό του το αγόρι ανέλαβε την δουλειά του και συντηρούσε την οικογένεια. Ζούσαν αγαπημένα τα παιδιά, γιατί είχαν πάρει καλές αρχές από την καλή μάνα. Αυτή η μάνα ήταν ηρωίδα. Ήπιε όλα τα φαρμάκια, για να μη διαλυθή η οικογένειά της και πικραθούν τα παιδιά της, κράτησε την οικογένεια σωστά, έσωσε και τον άνδρα της, αποταμίευσε και αυτή ουράνιο μισθό. Ο Θεός αυτήν την γυναίκα θα την βάλη στην καλύτερη θέση στον Παράδεισο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα παιδιά των διαλυμένων οικογενειών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, όταν ο άνδρας έχη κάποιο πάθος, αναγνωρίζη ότι φταίει, εξομολογήται κ.λπ., αλλά δέχεται ακόμη επιδράσεις και λέη στην γυναίκα του: «σάς παιδεύω, κι εσένα και τα παιδιά· καλύτερα να φύγω, να σάς στέλνω χρήματα από μακριά, για να μην ταλαιπωρήσθε», τί πρέπει να κάνη η γυναίκα;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν ο άνδρας νιώθη πράγματι έτσι όπως λέει, αυτό δείχνει ότι έχει πολύ φιλότιμο και η γυναίκα πρέπει να κάνη υπομονή. Όμως καλό είναι να μην πιστεύη εύκολα αυτά που ακούει· να βλέπη βαθύτερα. Γιατί καμμιά φορά μπορεί ο άνδρας να λέη δήθεν από αρχοντιά: «νά φύγω, να μη σάς παιδεύω», ενώ θέλει στα αλήθεια να φύγη, γιατί έχει μπλέξει με άλλη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα ο γάμος, όπως κατήντησε, έχει χάσει το νόημά του. Διαλύονται οικογένειες στα καλά καθούμενα. Ήρθε τις προάλλες στο Καλύβι κάποιος τελείως ζαλισμένος. Είχε δύο παιδιά από μία φιλενάδα. Παντρεύτηκε μία άλλη, έκανε ένα παιδί και την χώρισε. Μετά ξαναπαντρεύτηκε κάποια άλλη, η οποία ήταν χωρισμένη και είχε δύο παιδιά από τον πρώτο γάμο της και ένα παιδί από έναν φίλο. Έκανε και μ᾿ αυτήν άλλα δύο. «Για βάστα, του λέω, από πόσες μανάδες είναι αυτά τα παιδιά και από πόσους πατεράδες;».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έτσι καταστρέφονται τα ταλαίπωρα τα παιδιά. Όσα είναι ευαίσθητα και δεν μπορούν να ξεπεράσουν την στενοχώρια, απελπίζονται και μερικά αυτοκτονούν. Άλλα πίνουν, για να ξεχνούν, άλλα μπλέκονται με τα ναρκωτικά. Που τα βρίσκουν τα χρήματα; Η πιο μικρή δόση ηρωίνης στοιχίζει τέσσερις χιλιάδες δραχμές. Η μεγάλη έξι ή επτά χιλιάδες[17]. Και αυτά τα παιδιά είναι από τα ζωηρά της προηγούμενης γενιάς. Τα άλλα από το αυτόματο διαζύγιο, που είναι ακόμη μικρά, τί θα γίνουν; Φέτος το καλοκαίρι πόσα παιδιά πέρασαν από το Καλύβι που έπαιρναν ναρκωτικά! Τα περισσότερα, τα κακόμοιρα, ήταν από διαλυμένες οικογένειες. Να βρίσκωνται σε τέτοια κατάσταση στην ηλικία των είκοσι επτά ετών και να ζητούν βοήθεια! Και να δής, τα παιδιά από τις διαλυμένες οικογένειες φαίνονται από μακριά. Στο Καλύβι έχω τα λουκούμια έξω. Όταν έρχωνται, πριν προλάβουν να φάνε το λουκούμι, τρέχουν να με φιλήσουν. Με κάνουν με την ζάχαρη χάλια! Τους έχει λείψει η αγάπη, η στοργή. Αυτά τα παιδιά είτε έχουν τα καημένα γονείς, είτε δεν έχουν, το ίδιο τους είναι. Είτε έρχεται ο πατέρας στο σπίτι, είτε φεύγει, είτε είναι εκεί, είτε δεν είναι, το ίδιο τους κάνει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το «φταίξιμο» και το «δίκαιο» των συζύγων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχω παρατηρήσει ότι μερικοί Πνευματικοί λένε στους άνδρες που έχουν προβλήματα με τις γυναίκες τους: «Κάνε υπομονή, αυτός είναι ο σταυρός σου. Τί να κάνουμε; Θα έχης μισθό από τον Θεό». Πάνε μετά οι γυναίκες και λένε και σ᾿ αυτές: «Κάνε υπομονή, για να έχης μισθό από τον Θεό». Δηλαδή μπορεί να φταίνε και οι δύο και να λέη και στους δύο ο Πνευματικός: «Κάνε υπομονή». Ή μπορεί να φταίη ο ένας και να του λέη ο Πνευματικός: «Κάνε υπομονή». Οπότε αυτός που φταίει αναπαύει τον λογισμό του ότι ανέχεται τον άλλον, ενώ κάθε μέρα τον σκάζει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια φορά ήρθε στο Καλύβι κάποιος και μου είπε ότι είχε προβλήματα με την γυναίκα του. Πήγαιναν για χωρισμό. Δεν ήθελε να δη ο ένας τον άλλον. Ήταν και οι δύο δάσκαλοι, είχαν και δύο παιδάκια. Δεν έτρωγαν ποτέ στο σπίτι. Σε άλλο εστιατόριο έτρωγε ο ένας μετά το σχολείο, σε άλλο ο άλλος, και αγόραζαν και κάτι σάντουϊτς, για να φάνε τα παιδιά. Τα καημένα, όταν οι γονείς γύριζαν στο σπίτι, πήγαιναν και έψαχναν στις τσέπες και στις τσάντες τους, για να δούν τί τους έφεραν απ᾿ έξω να φάνε. Περνούσαν μεγάλο δράμα! Αυτός έκανε και τον ψάλτη. Σε άλλη εκκλησία πήγαινε η γυναίκα του, σε άλλη έψαλλε αυτός. Τόσο πολύ! «Τί να κάνω, Πάτερ, μου λέει, σηκώνω μεγάλο σταυρό, πολύ μεγάλο. Κάθε μέρα έχουμε φασαρίες στο σπίτι». «Πήγες στον Πνευματικό;», τον ρωτάω. «Ναί, πήγα, μου λέει, και μου είπε: «Υπομονή να κάνης· σηκώνεις μεγάλο σταυρό"». «Για να δώ, του λέω, ποιός σηκώνει μεγάλο σταυρό. Να πάρουμε τα πράγματα από την αρχή. Όταν παντρευτήκατε, μαλώνατε έτσι;». «Όχι, μου λέει. Οκτώ χρόνια ήμασταν πολύ αγαπημένοι. Λάτρευα την γυναίκα μου περισσότερο από τον Θεό! Μετά εκείνη άλλαξε. Έγινε γκρινιάρα, ιδιότροπη...». Ακούς; Την λάτρευε περισσότερο από τον Θεό! «Έλα εδώ, του λέω. Λάτρευες την γυναίκα σου περισσότερο από τον Θεό! Η γυναίκα σου φταίει τώρα ή εσύ, που φθάσατε σ᾿ αυτήν την κατάσταση; Εξ αιτίας σου πήρε την Χάρη Του ο Θεός από την γυναίκα σου. Και τί σκέφτεσαι να κάνης τώρα;», τον ρωτάω. «Μάλλον να χωρίσουμε», μου λέει. «Μήπως έμπλεξες και με καμμιά άλλη;». «Ναί, έχω υπ᾿ όψιν μου κάποια», μου λέει. «Βρέ, δεν καταλαβαίνεις ότι εσύ είσαι ο φταίχτης; Να ζητήσης πρώτα συγχώρεση από τον Θεό, γιατί λάτρευες την γυναίκα σου περισσότερο από Εκείνον. Μετά να πάς να ζητήσης συγχώρεση από την γυναίκα σου. «Να με συγχωρέσης, να της πής, εγώ έγινα αιτία να δημιουργηθή αυτή η κατάσταση στο σπίτι και να ταλαιπωρούνται και τα παιδιά». Έπειτα να πάς να εξομολογηθής και να λατρεύης τον Θεό σαν Θεό και να αγαπάς την γυναίκα σου σαν γυναίκα σου, και θα δής, τα πράγματα θα πάνε καλά». Τον τράνταξα. Άρχισε να κλαίη. Μου υποσχέθηκε πώς θα με ακούση. Ήρθε μετά από λίγο καιρό χαρούμενος. «Σ᾿ ευχαριστώ, Πάτερ, μας έσωσες, μου λέει. Είμαστε μια χαρά, κι εμείς και τα παιδιά μας». Βλέπεις; Να είναι αυτός ο φταίχτης και να νομίζη κιόλας ότι σηκώνει πολύ μεγάλο σταυρό!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Κι εσείς ποτέ να μη δικαιολογήτε τις γυναίκες που έρχονται και σάς κάνουν παράπονα για τους άνδρες. Εγώ ούτε τους άνδρες δικαιολογώ ούτε τις γυναίκες, αλλά τους προβληματίζω. Μου λέει, ας υποθέσουμε, η γυναίκα: «Ο άνδρας μου πίνει, γυρίζει στο σπίτι αργά το βράδυ, βρίζει...». «Κοίταξε, της λέω, όταν γυρίζη στο σπίτι την νύχτα μεθυσμένος, να του φέρεσαι με καλωσύνη. Αν αρχίζης εσύ και γκρινιάζης «γιατί άργησες; τί ώρα είναι αυτή που ήρθες; δεν θα αλλάξης επιτέλους; τί κατάσταση είναι αυτή; δεν είναι μια μέρα, δεν είναι δύο, πόσο θα κάνω υπομονή;» και κατεβάζης τα μούτρα, ο διάβολος θα του πή: «Βρέ, χαμένος είσαι που κάθεσαι μ᾿ αυτήν την χαζή! Δεν πάς να γλεντάς με καμμιά άλλη;». Μπορεί να έχης δίκαιο, αλλά ο διάβολος θα τον μπλέξη αλλού. Ενώ, όταν εσύ του φερθής με καλωσύνη και κάνης λίγη υπομονή και προσευχή, χωρίς να παραπονήσαι για το τί κάνει εκείνος, θα δη λίγο λιακάδα, θα προβληματισθή και θα διορθωθή». Έρχεται μετά ο άνδρας και μου λέει: «Η γυναίκα μου γκρινιάζει, φωνάζει». «Βρέ, σε περιμένουν τα παιδιά και η φουκαριάρα η γυναίκα σου με λαχτάρα μέχρι τα μεσάνυχτα, του λέω, κι εσύ γυρνάς στο σπίτι μεθυσμένος και αρχίζεις να βρίζης! Είναι ντροπή! Για να βασανίζης την οικογένεια παντρεύτηκες;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Υπάρχουν και περιπτώσεις που μπορεί να έχη και ο ένας και ο άλλος δίκαιο. Κάποτε έλεγα σε μια συντροφιά πόσο αγνός ήταν ο Μακρυγιάννης. Είχε και σωματική και ψυχική αγνότητα. Οπότε πετάγεται κάποιος και μου λέει: «Όχι, να θέλουν να παρουσιάσουν τον Μακρυγιάννη και για άγιο!». «Γιατί όχι;», τον ρωτάω. «Γιατί έδερνε την γυναίκα του», μου απαντάει. «Κοίταξε να σού πω τί συνέβαινε: Ο Μακρυγιάννης, όταν τύχαινε να έχη κανένα τάλληρο και ερχόταν καμμιά χήρα που είχε παιδιά, της το έδινε. Η γυναίκα του, η καημένη, γκρίνιαζε. «Μά κι εσύ παιδιά έχεις, του έλεγε, γιατί το έδωσες;». Κι εκείνος της έδινε κανένα μπάτσο και της έλεγε. «Εσύ έχεις τον άνδρα σου που θα σε οικονομήση. Αυτή η καημένη δεν έχει άνδρα, ποιός θα την οικονομήση;». Δηλαδή και οι δύο είχαν δίκαιο».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ύστερα, αν ο ένας από τους δύο συζύγους ζη πνευματικά, τότε και δίκαιο να έχη, δεν έχει κατά κάποιον τρόπο δίκαιο. Γιατί, σαν πνευματικός άνθρωπος που είναι, πρέπει να αντιμετωπίση μία αδικία πνευματικά. Να τα αντιμετωπίζη δηλαδή όλα με την θεία δικαιοσύνη, να βλέπη τί αναπαύει τον άλλον. Γιατί, αν μια ψυχή είναι αδύνατη και σφάλλη, έχει κατά κάποιον τρόπο ελαφρυντικά. Ο άλλος όμως, που είναι σε καλύτερη πνευματική κατάσταση και δεν δείχνει κατανόηση, σφάλλει πολύ περισσότερο. Όταν και οι πνευματικοί άνθρωποι αντιμετωπίζουν τα πράγματα κοσμικά, με την κοσμική, την ανθρώπινη, δικαιοσύνη, τί γίνεται μετά; Πρέπει να πηγαίνουν συνέχεια στα κοσμικά δικαστήρια. Γι᾿ αυτό και βασανίζονται οι άνθρωποι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Δεύτερο Μέρος – Οι Γονείς Και Οι Υποχρεώσεις Τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Οι γονείς που γεννούν τα παιδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί τους δίνουν το σώμα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: πρέπει να συντελέσουν, όσο μπορούν,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί στην πνευματική τους αναγέννηση».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – Η τεκνοποιία
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι Άγιοι Ιωακείμ και Άννα είναι το απαθέστερο ζευγάρι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πέστε μας για την Αγία Άννα και τον Άγιο Ιωακείμ, τους Θεοπάτορες. Κάποτε κάτι αρχίσατε να μας λέτε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από μικρός είχα σε μεγάλη ευλάβεια τους Αγίους Θεοπάτορες. Μάλιστα είχα πει σε κάποιον ότι,  όταν με κάνουν καλόγερο, θα ήθελα να μου δώσουν το όνομα Ιωακείμ. Πόσα οφείλουμε σ᾿ αυτούς! Οι Άγιοι Ιωακείμ και Άννα είναι το απαθέστερο ανδρόγυνο που υπήρξε ποτέ. Δεν είχαν καθόλου σαρκικό φρόνημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός έτσι έπλασε τον άνθρωπο και έτσι ήθελε να γεννιούνται οι άνθρωποι, απαθώς. Αλλά μετά την πτώση μπήκε το πάθος στην σχέση ανάμεσα στον άνδρα και στην γυναίκα. Μόλις βρέθηκε ένα απαθές ανδρόγυνο, όπως έπλασε ο Θεός τον άνθρωπο και όπως ήθελε να γεννιούνται οι άνθρωποι, γεννήθηκε η Παναγία, αυτό το αγνό πλάσμα, και στην συνέχεια σαρκώθηκε ο Χριστός. Μου λέει ο λογισμός ότι θα κατέβαινε και νωρίτερα ο Χριστός στην γή, αν υπήρχε ένα αγνό ζευγάρι, όπως ήταν οι Άγιοι Ιωακείμ και Άννα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι Ρωμαιοκαθολικοί φθάνουν στην πλάνη και πιστεύουν, δήθεν από ευλάβεια, ότι η Παναγία γεννήθηκε χωρίς να έχη το προπατορικό αμάρτημα. Ενώ η Παναγία δεν ήταν απαλλαγμένη από το προπατορικό αμάρτημα, αλλά γεννήθηκε όπως ήθελε ο Θεός να γεννιούνται οι άνθρωποι μετά την δημιουργία. Ήταν πάναγνη[18], γιατί η σύλληψή Της έγινε χωρίς ηδονή. Οι Άγιοι Θεοπάτορες μετά από θερμή προσευχή στον Θεό να τους χαρίση παιδί, συνήλθαν όχι από σαρκική επιθυμία, αλλά από υπακοή στον Θεό. Αυτό το γεγονός το είχα ζήσει στο Σινά[19].
- type: h2
  initial:
    ru: ''
  text:
    ru: Η εγκράτεια στην έγγαμη ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός «εποίησε τα πάντα, καλά λίαν»[20]. Ο άνδρας νιώθει μια φυσική έλξη προς την γυναίκα και η γυναίκα προς τον άνδρα. Αν δεν υπήρχε αυτή η έλξη, ποτέ δεν θα ξεκινούσε κανείς να κάνη οικογένεια. Θα συλλογιζόταν τις δυσκολίες που θα είχε αργότερα στην οικογένεια με την ανατροφή των παιδιών κ.λπ., και δεν θα αποφάσιζε να ξεκινήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μετά την πτώση των Πρωτοπλάστων το σαρκικό φρόνημα σε μερικούς ανθρώπους μπορεί να υπάρχη πέντε τοις εκατό, σε άλλους δέκα, τριάντα κ.λπ. Αλλά σήμερα που να βρεθούν άνθρωποι να έχουν πέντε τοις εκατό σαρκικό φρόνημα, να έχουν δηλαδή αγνό φρόνημα! Πάντως σε όλους τους ανθρώπους έχει δοθή από τον Θεό η δυνατότητα να φθάσουν στην απάθεια, αν αγωνισθούν με φιλότιμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν δικαιολογούνται οι έγγαμοι, επειδή ακολούθησαν τον έγγαμο βίο, να ξεχνούν ότι ο άνθρωπος δεν είναι μόνο σάρκα, αλλά είναι και πνεύμα, και να αφήνουν τον εαυτό τους αχαλίνωτο[21]. Πρέπει να αγωνίζωνται να υποτάξουν την σάρκα στο πνεύμα. Αν προσπαθούν να ζουν πνευματικά, με την καθοδήγηση του Πνευματικού τους, θα αρχίσουν να γεύωνται σιγά-σιγά και ανώτερες χαρές, πνευματικές, ουράνιες, και δεν θα αναζητούν τις σαρκικές. Έχουν υποχρέωση να αγωνίζωνται να εγκρατεύωνται, για να μη μεταδώσουν το σαρκικό πάθος και στα παιδιά τους. Ένα παιδάκι, που οι γονείς του έχουν πολύ σαρκικό φρόνημα, έχει από μικρό τέτοιες τάσεις, γιατί παίρνει το σαρκικό φρόνημα από αυτούς. Στην αρχή αυτό είναι απαλό, όπως όλα τα κληρονομικά πάθη – σαν την τσουκνίδα πού, μόλις φυτρώνη, είναι απαλή και μπορείς να την πιάσης, ενώ, όταν μεγαλώση, τσιμπάει – και μπορεί να θεραπευθή από έναν καλό Πνευματικό, που έχει διάκριση. Αν όμως δεν το κόψη στην μικρή ηλικία, θα χρειασθή πολύ να αγωνισθή, όταν μεγαλώση, για να το κόψη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ανθρώπινη λογική στο θέλημα του Θεού για την τεκνογονία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολλές φορές ανδρόγυνα μου εκφράζουν την ανησυχία τους για το θέμα της τεκνοποιίας και ζητούν την γνώμη μου. Άλλα σκέφτονται να κάνουν ένα-δυό παιδιά και άλλα θέλουν να αποκτήσουν πολλά παιδιά. Αυτό όμως που τους συμφέρει είναι να αφήνουν το θέμα της τεκνοποιίας στον Θεό. Να εμπιστεύωνται την ζωή τους στην θεία πρόνοια και να μη βάζουν δικά τους προγράμματα. Πρέπει να πιστεύουν ότι ο Θεός, που φροντίζει για τα πετεινά του ουρανού, πολύ περισσότερο θα φροντίση για τα δικά τους παιδιά. Ήταν ένας ναυτικός που παντρεύτηκε σε ηλικία δεκαοκτώ χρονών. Φτωχός αυτός, φτωχή και η κοπέλα που πήρε, νοίκιασαν ένα υπόγειο για να μείνουν. Βρήκε και η κοπέλα μια δουλίτσα και ζούσαν πολύ λιτά. Να φαντασθήτε, για τραπέζι είχαν ένα καφάσι από γιαρμάδες που αγόρασαν μια φορά. Μετά απέκτησαν και παιδάκια και έκαναν μεγάλες οικονομίες για να τα μεγαλώσουν. Και όμως σιγά-σιγά έγιναν νοικοκυραίοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί προσπαθούν πρώτα να τακτοποιήσουν όλα τα άλλα και ύστερα να σκεφθούν για παιδιά. Δεν λαμβάνουν υπ᾿ όψιν τους καθόλου τον Θεό. Άλλοι πάλι λένε: «σήμερα είναι δύσκολη η ζωή· ένα παιδί φθάνει, γιατί και αυτό με δυσκολία το μεγαλώνεις» και δεν κάνουν άλλα παιδιά. Δεν καταλαβαίνουν πόσο αμαρτάνουν μ᾿ αυτήν την τοποθέτηση, γιατί δεν αφήνονται με εμπιστοσύνη στον Θεό. Ο Θεός έχει σπλάχνα. Μόλις δη ότι δεν μπορούν να ανταποκριθούν, δεν Του είναι δύσκολο να μην τους δώση άλλα παιδιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ξεκινούν πολλοί να παντρευτούν, χωρίς να σκεφθούν ότι πρέπει να έχουν και ως σκοπό να κάνουν παιδιά και να τα αναθρέψουν χριστιανικά. Δεν θέλουν πολλά παιδιά, για να μην έχουν σκοτούρες, και έχουν στα διαμερίσματα σκυλιά, γατιά... Μου είπαν ότι τώρα[22]στην Αμερική έχουν στα σπίτια αντί για σκυλιά ένα είδος χοιρίδια, που είναι πανάκριβα και δεν μεγαλώνουν πολύ. Τα έχουν φτιάξει έτσι, για να μπορούν να τα έχουν μέσα στα διαμερίσματα. Παιδιά δεν θέλουν να έχουν, γιατί είναι φασαρία να τα πλένουν κ.λπ., και πλένουν τα γουρούνια! Το σκυλί τουλάχιστον είναι και φύλακας. Αλλά να έχης γουρούνια μέσα στο σπίτι! Φοβερό! Στην Αυστραλία͵ είδα[23]να έχουν γηροκομείο για σκύλους, για γάτες..., ακόμη και νεκροταφείο για τα ζώα! Οι άνθρωποι, έτσι όπως πάνε, θα μεγαλώνουν ποντίκια και θα τα κάνουν κονσέρβες, για να ταΐζουν τα γατιά· θα μεγαλώνουν λαγούς και κουνέλια και θα τα κάνουν κονσέρβες, για να ταΐζουν τα σκυλιά, και άλλοι άνθρωποι θα πεθαίνουν από την πείνα. Και βλέπεις, άμα σκοτώση κανείς ένα σκυλί, μπορεί να πληρώση περισσότερα απ᾿ όσα αν σκότωνε έναν άνθρωπο. Εξαρτάται φυσικά και από το τίνος θα είναι το σκυλί... Που φθάσαμε!... Ο άνθρωπος στην εποχή μας αξίζει λιγώτερο και από ένα σκυλί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και μερικοί Πνευματικοί απορώ πώς λένε μερικά πράγματα. Μια φορά με ρώτησαν κάποιοι προσκυνητές που ήρθαν εκεί στο Καλύβι: «Γέροντα, ο Ιερός Χρυσόστομος γράφει πουθενά να μην κάνουν οι σύζυγοι παιδιά;». «Τί είναι αυτά που λέτε; Που το ακούσατε αυτό;», τους λέω. «Νά, ο πατήρ τάδε μας το είπε», μου λένε. Πιάνω τον πατέρα τάδε και τον ρωτάω. «Είπες τέτοιο πράγμα;». «Ναί», μου λέει. «Που το βρήκες αυτό γραμμένο;», τον ρωτάω. «Ο Ιερός Χρυσόστομος το αναφέρει στον Περί παρθενίας λόγο του», μου λέει! «Κοίταξε, του λέω, εγώ δεν διάβασα Άγιο Χρυσόστομο, αλλά δεν μπορεί ο Άγιος να λέη κάτι τέτοιο· κάτι άλλο θα λέη. Φέρε να δώ τί γράφει». Μου φέρνει το βιβλίο και μου δείχνει το χωρίο. Το διαβάζω και βλέπω ότι ο Άγιος γράφει: «Τώρα έχουν αυξηθή οι άνθρωποι και σάς δίνεται η δυνατότητα να ζήσετε και εν παρθενία· δεν είναι όπως παλιά που έπρεπε να αφήσουν απογόνους»[24]͵· δεν λέει δηλαδή «μή γεννάτε παιδιά»· και αυτός να επιμένη. Να είναι κληρικός και θεολόγος, και να λέη τέτοια πράγματα! Να δείχνη ότι διαβάζει Χρυσόστομο, ότι κάνει και διατριβές, και να τον έχουν για καλό Πνευματικό! Ξέρετε τί βλάβη κάνουν κάτι τέτοιες λανθασμένες ερμηνείες σε ανθρώπους που θέλουν να αναπαύσουν τον λογισμό τους;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Για πολλούς που ζουν κοσμικά η οικογένεια σήμερα δεν έχει νόημα. Γι᾿ αυτό ή δεν παντρεύονται ή παντρεύονται και δεν κάνουν παιδιά ή σκοτώνουν τα παιδιά με τις εκτρώσεις, και έτσι μόνοι τους εξαφανίζουν το σόι τους. Δηλαδή μόνοι τους καταστρέφονται· δεν τους καταστρέφει ο Θεός. Ενώ οι πιστοί, που τηρούν τις εντολές του Θεού, δέχονται την θεία Χάρη, γιατί ο Θεός είναι υποχρεωμένος κατά κάποιον τρόπο να τους βοηθάη στα δύσκολα χρόνια που ζούμε. Και βλέπουμε χριστιανούς οικογενειάρχες, με όσα παιδάκια τους δίνει ο Θεός, να τα μεγαλώνουν με φόβο Θεού. Και όλα τα παιδιά να είναι ισορροπημένα, χαρούμενα, ευλογία Θεού, και να προκόβουν. Εκεί που λέμε: «τί θα γίνη ο κόσμος;», βλέπουμε τώρα να προχωράη, με την Χάρη του Θεού, μια γενιά καλή. Ο διάβολος καταστρέφει, αλλά και ο Καλός Θεός εργάζεται και δεν θα αφήση να εξαφανισθή το γένος μας.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Δυσκολίες στην τεκνοποιία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια γυναίκα που δεν είναι Ορθόδοξη, αν δεν μπορή να αποκτήση παιδάκι, επιτρέπεται, αν ζητήση, να φορέση την ζώνη͵ που έχουμε σταυρώσει στα ιερά Λείψανα του Αγίου Αρσενίου[25];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πιστεύει στην δύναμη του Αγίου ή με μαγικό τρόπο νομίζει ότι θα βοηθηθή; Αν πιστεύη στον Άγιο, επιτρέπεται να την φορέση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σε μερικές γυναίκες που δεν μπορούν να αποκτήσουν παιδιά λειτουργούν και οι πνευματικοί νόμοι[26], γιατί δεν κάνουν οικογένεια εγκαίρως. Αρχίζουν να διαλέγουν. «Όχι, αυτός είναι έτσι, εκείνος είναι αλλιώς», δίνουν μια υπόσχεση σε κάποιον, κοιτάζουν συγχρόνως και άλλον, λένε μετά «όχι» σ᾿ εκείνον που έδωσαν την υπόσχεση – και αυτός αντί να το θεωρήση ευλογία που τον αφήνει πριν παντρευτούν, πάει να αυτοκτονήση. Έ, τί οικογένεια θα κάνη μια τέτοια κοπέλα; Άλλες γυναίκες δεν μπορούν να κάνουν παιδιά, γιατί στα νεανικά τους χρόνια έζησαν άτακτη ζωή. Μερικές πάλι επηρεάζονται από την διατροφή. Πολλές τροφές περιέχουν πολλά φάρμακα και ορμόνες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Υπάρχουν και ανδρόγυνα πού, μόλις παντρευτούν, θέλουν αμέσως να αποκτήσουν παιδί καί, αν λίγο καθυστερήσουν, αρχίζουν να αγωνιούν. Αλλά πώς να κάνουν παιδί, ενώ είναι γεμάτοι αγωνία και άγχος; Αν διώξουν την αγωνία και το άγχος και βάλουν στην ζωή τους μια καλή πνευματική σειρά, τότε θα κάνουν παιδί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικές φορές ο Θεός σκόπιμα αργεί να δώση παιδί σε κάποιο ανδρόγυνο. Είδατε και στους Αγίους Ιωακείμ και Άννα, τους Θεοπάτορες, και στον Προφήτη Ζαχαρία και την Αγία Ελισάβετ, στα γεράματα έδωσε παιδί, για να εκπληρωθή και στις δύο περιπτώσεις το προαιώνιο σχέδιό Του για την σωτηρία των ανθρώπων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι σύζυγοι πρέπει να είναι πάντα έτοιμοι να δεχθούν το θέλημα του Θεού στην ζωή τους. Όποιος εμπιστεύεται τον εαυτό του στον Θεό, ο Θεός δεν τον αφήνει. Τίποτε δεν κάνουμε εμείς, και ο Θεός πόσα κάνει για μάς! Με πόση αγάπη και απλοχεριά μας τα δίνει όλα! Υπάρχει τίποτε στον Θεό που να μην μπορή να το κάνη; Ένα ανδρόγυνο είχε πέντε παιδιά, αλλά, όταν τα παιδιά τους μεγάλωσαν, αποκαταστάθηκαν και έφυγαν από κοντά τους, οπότε έμειναν μόνοι. Τότε αποφάσισαν να κάνουν ακόμη ένα παιδί, για να το έχουν στα γεράματά τους. Παρόλο που η γυναίκα ήταν σε ηλικία που δεν μπορούσε να τεκνοποιήση και ανθρωπίνως αυτό ήταν αδύνατο, είχαν όμως μεγάλη πίστη στον Θεό και απέκτησαν ένα αγόρι. Έτσι είχαν μαζί τους στα γεράματά τους τον μικρότερο γιό τους, που τον μεγάλωσαν και τον τακτοποίησαν και αυτόν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το θέμα της τεκνοποιίας δεν εξαρτάται μόνον από τον άνθρωπο, εξαρτάται και από τον Θεό. Όταν ο Θεός βλέπη ταπείνωση στο ανδρόγυνο που έχει δυσκολία να αποκτήση παιδιά, τότε όχι μόνον ένα παιδί τους δίνει, αλλά και πολύτεκνους μπορεί να τους κάνη. Όταν όμως βλέπη πείσμα και εγωισμό, αν τους εκπληρώση το αίτημά τους, θα τους αναπαύση στο πείσμα τους και στον εγωισμό τους. Πρέπει να αφεθούν εν λευκώ στον Θεό. «Θεέ μου, να πούν, Εσύ για το καλό μας φροντίζεις· «γενηθήτω το θέλημά Σου"[27]». Τότε θα γίνη αυτό που ζητούν. Γιατί, όταν λέμε «γενηθήτω το θέλημά Σου» και αφηνώμαστε με εμπιστοσύνη στον Θεό, τότε γίνεται το θέλημα του Θεού. Αλλά εμείς από το ένα μέρος λέμε «γενηθήτω το θέλημά Σου», και από το άλλο μέρος επιμένουμε στο θέλημα το δικό μας. Τότε τί να κάνη και ο Θεός;
- type: h2
  initial:
    ru: ''
  text:
    ru: Περιπτώσεις ατεκνίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μας ρώτησε κάποιο ανδρόγυνο, που έχουν και οι δύο στίγμα μεσογειακής αναιμίας, αν πρέπη να κάνουν παιδιά. Τους είπαμε να ρωτήσουν τον Πνευματικό τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι Πνευματικοί δεν μπορούν να πούν σ᾿ αυτά τα ανδρόγυνα να μην κάνουν παιδιά. Πρέπει να τους καλλιεργήσουν το φιλότιμο, ώστε να κάνουν έναν αγώνα να εγκρατεύωνται, και με διάκριση να τους οικονομούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι ανδρόγυνα πού, ενώ ζουν πολύ πνευματικά και θέλουν να αποκτήσουν παιδιά, δεν μπορούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Θεός σε πολλούς δεν δίνει παιδιά, για να αγαπήσουν τα παιδιά όλου του κόσμου σαν δικά τους και να βοηθήσουν για την πνευματική τους αναγέννηση. Κάποιος δεν είχε παιδιά, αλλά, όταν έβγαινε από το σπίτι του, όλα τα παιδιά της γειτονιάς έτρεχαν κοντά του και τον περιτριγύριζαν με πολλή αγάπη. Δεν τον άφηναν να πάη στην δουλειά του. Βλέπετε, ο Θεός δεν του έδωσε δικά του παιδιά, αλλά του χάρισε την ευλογία να τον αγαπούν σαν πατέρα όλα τα παιδιά της γειτονιάς του και με τον τρόπο του να τα βοηθάη πνευματικά. Τα κρίματα του Θεού είναι άβυσσος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Άλλοτε πάλι ο Θεός δεν δίνει παιδιά, για να βολεύεται και κανένα ορφανό. Είχα γνωρίσει κάποτε έναν καλό Χριστιανό, που εξασκούσε το επάγγελμα του δικηγόρου. Όταν πέρασα μια φορά από την πόλη που έμενε, τον επισκέφτηκα και η πολλή καλωσύνη του με έκαμψε να παραμείνω και να φιλοξενηθώ μια μέρα στο σπίτι του. Γνώρισα και την σύζυγό του που του έμοιαζε και αυτή στις αρετές. Και από μεν την σύζυγο έμαθα για την πνευματική ζωή του συζύγου, από δε τον σύζυγο για την πνευματική κατάσταση της συζύγου. Αργότερα έμαθα γι᾿ αυτούς και από πολλούς Χριστιανούς που τους γνώριζαν και τους είχαν ευεργετήσει. Ο άνθρωπος αυτός του Θεού εξασκούσε τίμια το επάγγελμα του δικηγόρου. Εάν έβλεπε ότι κάποιος ήταν απατεώνας, όχι μόνο δεν αναλάμβανε την υπόθεση, αλλά και τον ήλεγχε αυστηρά, για να συνέλθη. Εάν έβλεπε ένοχο, αλλά μετανοιωμένο, προσπαθούσε να συμβιβάση κάπως τα πράγματα ή να ελαττωθή η ποινή. Εάν έβλεπε φτωχό αδικημένο, δεν έπαιρνε καθόλου χρήματα και προσπαθούσε στην δίκη να δικαιωθή. Ζούσε πολύ απλά, και έτσι τα λίγα χρήματα που έβγαζε του έφθαναν, ακόμη και για να βοηθάη φτωχές οικογένειες. Το σπίτι του πιστού δικηγόρου ήταν μια πραγματική πνευματική όαση μέσα στην Σαχάρα της πόλεως. Εκεί μαζεύονταν άνθρωποι πονεμένοι, φτωχοί, άνεργοι, με οικογενειακά προβλήματα, στους οποίους συμπαραστεκόταν σαν καλός πατέρας. Είχε και γνωστούς σε διάφορες θέσεις καί, όποιον έπαιρνε τηλέφωνο, για να εξυπηρετήση κάποιον για καμμιά δουλειά, για αρρώστιες κ.λπ., κανείς δεν του έλεγε «όχι», γιατί όλοι τον αγαπούσαν και τον εκτιμούσαν. Με τον ίδιο τρόπο εργαζόταν και η γυναίκα του. Βοηθούσε φτωχά παιδιά ή νέους που είχαν δυσκολίες στις σπουδές τους. Σαν μάνα την είχαν. Κάποια στιγμή όμως μου εξέφρασε ένα παράπονο. «Όταν παντρεύτηκα, Πάτερ, μου είπε, αμέσως παραιτήθηκα από καθηγήτρια, γιατί είπα να γίνω μια καλή μητέρα. Ζητούσα από τον Χριστό να μου δώση ακόμη και είκοσι παιδιά, αλλά δυστυχώς ούτε ένα δεν μου έδωσε». Τότε της είπα: «Εσύ, αδελφή, έχεις περισσότερα από πεντακόσια παιδιά, και ακόμη παραπονιέσαι; Ο Χριστός είδε την αγαθή σου προαίρεση και θα σε ανταμείψη γι᾿ αυτήν. Τώρα που βοηθάς για την πνευματική αναγέννηση τόσων παιδιών, γίνεσαι καλύτερη μητέρα από πολλές μητέρες και ξεπερνάς και όλες τις πολύτεκνες μητέρες. Θα έχης και μεγαλύτερο μισθό, γιατί με την πνευματική αναγέννηση εξασφαλίζονται τα παιδιά πνευματικά στην αιώνια ζωή». Είχαν εν τω μεταξύ υιοθετήσει μια κοπέλα και της είχαν γράψει την περιουσία τους. Αυτή τους γηροκόμησε καί, όταν αναπαύτηκαν, πήγε σε μοναστήρι – αν και το σπίτι τους ήταν σαν μοναστήρι, γιατί διαβάζονταν όλες οι ακολουθίες. Στον εσπερινό και στο απόδειπνο είχαν και άλλους εν Χριστώ αδελφούς· μεσονυκτικό και όρθρο τα διάβαζαν οι τρείς. Οι ευλογημένες αυτές ψυχές πολλές ψυχές πονεμένων ανέπαυσαν. Ο Θεός να αναπαύση και αυτούς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό λέω ότι ο μεγαλύτερος και καλύτερος πολύτεκνος είναι ο άνθρωπος που αναγεννήθηκε πνευματικά και βοηθάει για την πνευματική αναγέννηση των παιδιών όλου του κόσμου, για να εξασφαλίσουν τις ψυχές τους στον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικοί, Γέροντα, που δεν μπορούν να κάνουν παιδιά, σκέφτονται να υιοθετήσουν κάποιο παιδάκι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, καλύτερα να υιοθετήσουν. Δεν πρέπει να επιμένουν. Αυτό που θέλει ο άνθρωπος δεν είναι πάντοτε και το θέλημα του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι θετοί γονείς πρέπει σε κάποια ηλικία να πούν στο παιδί ότι το έχουν υιοθετήσει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, το καλύτερο είναι να το πούν στο παιδί σε κάποια ηλικία. Αλλά αυτό που έχει σημασία είναι να αγαπούν πολύ και σωστά το παιδί. Υπάρχουν παιδιά που ζουν με τους πραγματικούς γονείς τους και αγαπούν άλλους ανθρώπους πιο πολύ, γιατί οι γονείς δεν έχουν αγάπη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι πολύτεκνες οικογένειες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός αγαπάει και φροντίζει ιδιαίτερα τους πολυτέκνους. Σε μια μεγάλη οικογένεια δίνονται πολλές ευκαιρίες στα παιδιά να αναπτυχθούν κανονικά, εφόσον οι γονείς τους δίνουν σωστή αγωγή. Το ένα παιδί βοηθάει το άλλο. Η μεγαλύτερη κόρη βοηθάει την μητέρα, το δεύτερο παιδί φροντίζει το μικρότερο κ.λπ. Υπάρχει αυτό το δόσιμο και ζουν μέσα σε μια ατμόσφαιρα θυσίας και αγάπης. Ο μικρός τον μεγάλο και τον αγαπά και τον σέβεται. Αυτό φυσιολογικά καλλιεργείται σε μια πολύτεκνη οικογένεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό, όταν στην οικογένεια είναι μόνον ένα ή δυο παιδιά, οι γονείς χρειάζεται πολύ να προσέξουν πώς θα τα μεγαλώσουν. Συνήθως κοιτάζουν να μην τους λείψη τίποτε, οπότε τα παιδιά τα έχουν όλα δικά τους και αχρηστεύονται τελείως. Πάρε μια κοπέλα μοναχοκόρη που τα έχει όλα. Έχει την υπηρέτρια που θα της φέρη το φαγητό στην ώρα του, που θα της νοικοκυρέψη το δωμάτιό της κ.λπ. Η υπηρέτρια πληρώνεται, αλλά καλλιεργείται κιόλας, γιατί δίνεται, προσφέρει, ενώ αυτή, αν δεν κάνη καμμιά θυσία, μένει κούτσουρο, ακαλλιέργητη. Εγώ συνιστώ στους νέους να πάρουν σύζυγο από πολύτεκνη οικογένεια, γιατί τα παιδιά που μεγαλώνουν με οικονομική δυσκολία συνηθίζουν στην θυσία, επειδή σκέφτονται πώς να βοηθήσουν τους γονείς. Αυτό σπάνια το συναντάς στα καλομαθημένα παιδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά και οι πολύτεκνοι γονείς έχουν πλούσια καρδιά. Θυμάμαι, στην Κατοχή, ήταν στην γειτονιά μας ένα παιδάκι ορφανό που είχε μείνει τελείως μόνο του. Ένας φτωχός οικογενειάρχης, με δέκα παιδιά, το λυπήθηκε, το πήρε στο σπίτι του και το μεγάλωσε και αυτό μαζί με τα δικά του παιδιά. Και ξέρετε έπειτα τί ευλογίες είχε από τον Θεό! Θα τον άφηνε ο Θεός αβοήθητο με τέτοιο φιλότιμο που είχε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας πολύτεκνος μπορεί στις αρχές να αντιμετωπίση δυσκολίες, αλλά ο Θεός δεν θα τον αφήση. Να σάς πω για μια περίπτωση: Ένας οικογενειάρχης, που είχε έξι παιδιά, μου είπε μια φορά να κάνω προσευχή να φωτίζη ο Θεός τους νοικοκυραίους να μην τον βγάζουν από το σπίτι. Δυστυχώς πολλοί ιδιοκτήτες, ενώ νοικιάζουν το σπίτι σε οικογένειες με δύο ανθρώπους και πέντε σκύλους ή γατιά που το μουρνταρεύουν, δεν θέλουν οικογένειες με πολλά παιδιά, για να μην τους χαλάσουν δήθεν το σπίτι τους. Αυτός λοιπόν ο οικογενειάρχης είχε κουραστή ο καημένος να τον διώχνη ο ένας ιδιοκτήτης, να μην του νοικιάζη το σπίτι του ο άλλος και να μεταφέρη τα παιδάκια του και τα πράγματά του από σπίτι σε σπίτι με πολλή αγωνία. Εργαζόταν σκληρά, οικονομούσε τα απαραίτητα για την οικογένειά του και δεν έκανε παζάρια για το ενοίκιο, αρκεί να τον άφηναν οι ιδιοκτήτες να μείνη λίγα χρόνια, για να μην ταλαιπωρούνται με τις μετακομίσεις. Όταν τα άκουσα αυτά, τον πόνεσα και του είπα: «Μη στενοχωριέσαι· ο Θεός έχει στον λογαριασμό Του και τα δικά σου παιδιά. Αυτός είναι ο Δημιουργός που δίνει στα παιδιά το κυριώτερο, την ψυχή, ενώ εσύ με την σύζυγο, σαν συνδημιουργοί, δίνετε το σώμα. Επομένως ο Θεός ενδιαφέρεται πιο πολύ από σάς για τα παιδιά σας». Δεν πέρασαν δυό-τρείς μήνες, έρχεται χαρούμενος και μου λέει: «Δόξα τω Θεώ, ο Θεός μου οικονόμησε και σπίτι, και μου περισσεύουν και αρκετά χρήματα». Τον ρώτησα τί συνέβη και μου διηγήθηκε το εξής περιστατικό: «Πηγαίνοντας για το χωριό μου, κάθησα λίγο στο πρακτορείο, μέχρι να έρθη η ώρα να φύγη το λεωφορείο. Με πλησιάζει λοιπόν ένας λαχειοπώλης και μου λέει να πάρω λαχεία. Εγώ, επειδή είχα την αρχή ως Χριστιανός να μην παίρνω λαχεία, του είπα ότι δεν ήθελα. Όταν όμως είδα τον λαχειοπώλη να φεύγη, σκέφτηκα μήπως είχε μεγάλη ανάγκη, γι᾿ αυτό τον φώναξα πάλι και έβγαλα χρήματα να του πληρώσω ένα λαχείο, χωρίς να το πάρω. Μά ο λαχειοπώλης ήταν φιλότιμος και δεν το δέχθηκε αυτό. Πάλι στενοχωρέθηκα καί, επειδή ήθελα να τον βοηθήσω, του είπα: «Δώσ᾿ μου ένα λαχείο· ίσως μου χρειασθή». Και αγόρασα ένα λαχείο με σκοπό να χαρή ο άλλος και εγώ να στενοχωρηθώ και λίγο, που παρέβηκα το τυπικό μου. Εκείνο λοιπόν το λαχείο κέρδισε ένα μεγάλο ποσό, αγόρασα και σπίτι, μου περίσσεψαν και χρήματα, για να μεγαλώσω τα παιδιά μου. Έμαθα και που έμενε ο λαχειοπώλης και πήγα αθόρυβα και του άφησα στην θυρίδα του έναν φάκελο με αρκετά χρήματα, επειδή ήξερα πώς δεν θα τα δεχόταν, εάν του τα έδινα στα χέρια». Είναι φοβερό πώς ενεργεί στους φιλότιμους η αγάπη του Θεού!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι εκτρώσεις είναι φοβερή αμαρτία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάποια κυρία σαράντα χρόνων, που έχει μεγάλα παιδιά, είναι έγκυος τριών μηνών. Ο άνδρας της την απειλεί πώς, αν δεν κάνη έκτρωση, θα την χωρίση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν κάνη έκτρωση, θα την πληρώσουν τα άλλα παιδιά τους με αρρώστιες και ατυχήματα. Σήμερα οι γονείς σκοτώνουν τα παιδιά με τις εκτρώσεις και δεν έχουν την ευλογία του Θεού. Παλιά, αν γεννιόταν ένα παιδάκι άρρωστο, το βάπτιζαν, πέθαινε αγγελούδι, και ήταν πιο ασφαλισμένο. Είχαν οι γονείς και άλλα γερά παιδιά, είχαν και την ευλογία του Θεού. Τώρα γερά παιδιά τα σκοτώνουν με τις εκτρώσεις και διατηρούν στην ζωή άλλα που είναι αρρωστημένα. Τρέχουν οι γονείς στην Αγγλία, στην Αμερική να τα θεραπεύσουν. Και συνεχίζεται μετά να γεννιούνται πιο άρρωστα, γιατί και αυτά, αν ζήσουν και κάνουν οικογένεια, μπορεί να γεννήσουν πάλι άρρωστα παιδιά, οπότε τί βγαίνει; Ενώ, αν γεννούσαν μερικά παιδιά, δεν θα έτρεχαν τόσο πολύ για το ένα, το άρρωστο. Θα πέθαινε και θα πήγαινε αγγελούδι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, διάβασα κάπου ότι κάθε χρόνο γίνονται σε όλο τον κόσμο πενήντα εκατομμύρια εκτρώσεις και διακόσιες χιλιάδες γυναίκες πεθαίνουν από τις αμβλώσεις που κάνουν[28].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σκοτώνουν τα παιδιά, γιατί λένε ότι, αν πληθύνη ο κόσμος, δεν θα έχουν να φάνε, να συντηρηθούν οι άνθρωποι. Τόσες ακαλλιέργητες εκτάσεις υπάρχουν, τόσα δάση, που σε λίγο χρόνο, με τα μέσα που υπάρχουν σήμερα, μπορούν να τα κάνουν λ.χ. ελαιώνες και να τα δώσουν στους ακτήμονες. Δεν είναι ότι θα κοπούν τα δένδρα και δεν θα υπάρχη οξυγόνο, γιατί πάλι δένδρα θα μπούν. Στην Αμερική καίνε το σιτάρι και εδώ στην Ελλάδα πετούν τα φρούτα κ.λπ. στην χωματερή, και εκεί στην Αφρική οι άνθρωποι πεθαίνουν από την πείνα. Όταν στην Αβησσυνία πέθαιναν οι άνθρωποι από πείνα, γιατί είχε πολλή ανομβρία, είχα πει σε κάποιον γνωστό μου εφοπλιστή, που βοηθάει σε τέτοιες περιπτώσεις, να πάη στην χωματερή και να παρακαλέση να φορτώση κανένα πλοίο να τα πάη εκεί δωρεάν. Με κανέναν τρόπο δεν του έδωσαν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσες χιλιάδες έμβρυα σκοτώνονται κάθε μέρα! Η έκτρωση είναι φοβερή αμαρτία. Είναι φόνος, και μάλιστα πολύ μεγάλος φόνος, γιατί σκοτώνονται αβάπτιστα παιδιά. Πρέπει να καταλάβουν οι γονείς ότι η ζωή αρχίζει από την στιγμή της συλλήψεως.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια νύχτα ο Θεός επέτρεψε να δώ ένα φοβερό όραμα που με πληροφόρησε γι᾿ αυτό το θέμα! Ήταν βράδυ, Τρίτη της Διακαινησίμου. Είχα ανάψει δυο κεράκια μέσα σε δυο τενεκεδάκια, όπως συνηθίζω να κάνω, ακόμη και όταν κοιμάμαι, για όλους όσους πάσχουν ψυχικά και σωματικά. Σ᾿ αυτούς συμπεριλαμβάνω ζώντες και κεκοιμημένους. Στις δώδεκα τα μεσάνυχτα, εκεί που έλεγα την ευχή, βλέπω ένα μεγάλο χωράφι περιφραγμένο με μια μάνδρα, σπαρμένο με σιτάρι που μόλις άρχιζε να ψηλώνη. Εγώ στεκόμουν έξω από το χωράφι, άναβα κεριά για τους κεκοιμημένους και τα στερέωνα πάνω στον τοίχο της μάνδρας. Αριστερά ήταν ένας ξερότοπος, γεμάτος βράχους και κρημνούς, που σειόταν συνέχεια από μία δυνατή βοή από χιλιάδες σπαραχτικές φωνές που σού σπάραζαν την καρδιά. Και ο πιο σκληρός άνθρωπος αν τις άκουγε, ήταν αδύνατο να μη συγκλονισθή. Ενώ υπέφερα από τις σπαραχτικές φωνές και αναρωτιόμουν από που προέρχονται και τί σημαίνουν όλα αυτά που έβλεπα, άκουσα μια φωνή να μου λέη: «Το χωράφι με το σπαρμένο σιτάρι, που δεν έχει ακόμη ξεσταχυάσει, είναι το Κοιμητήρι με τις ψυχές των νεκρών που θα αναστηθούν. Στον τόπο δε που σείεται από τις σπαραχτικές φωνές βρίσκονται οι ψυχές των παιδιών που έχουν σκοτωθή με τις εκτρώσεις». Έπειτα από αυτό το όραμα μου ήταν αδύνατο να συνέλθω από τον μεγάλο πόνο που δοκίμασα για τις ψυχές εκείνων των παιδιών. Ούτε να ξαπλώσω μπορούσα, για να ξεκουραστώ, παρόλο που ήμουν κατάκοπος εκείνη την ημέρα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί να γίνη κάτι, ώστε να αρθή ο νόμος για τις εκτρώσεις;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, αλλά χρειάζεται να κινηθή η πολιτεία, η Εκκλησία κ.λπ., ώστε να ενημερωθή ο κόσμος για τις συνέπειες που θα έχη η υπογεννητικότητα. Οι ιερείς να εξηγήσουν στον κόσμο ότι ο νόμος για τις εκτρώσεις είναι αντίθετος προς τις εντολές του Ευαγγελίου. Οι γιατροί πάλι από την δική τους πλευρά να μιλήσουν για τους κινδύνους που διατρέχει η γυναίκα που κάνει έκτρωση. Βλέπεις, οι Ευρωπαίοι είχαν την ευγένεια και την άφησαν κληρονομιά και στα παιδιά τους. Εμείς είχαμε τον φόβο του Θεού, αλλά τον χάσαμε και δεν τον αφήσαμε κληρονομιά στην επόμενη γενιά, γι᾿ αυτό τώρα νομιμοποιούμε τις εκτρώσεις, τον πολιτικό γάμο...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν παραβαίνη ένας άνθρωπος μια εντολή του Ευαγγελίου, ευθύνεται μόνον αυτός. Όταν όμως κάτι που αντίκειται στις εντολές του Ευαγγελίου γίνεται από το κράτος νόμος, τότε έρχεται η οργή του Θεού σε όλο το έθνος, για να παιδαγωγηθή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Ο ρόλος της μητέρας στην ανατροφή των παιδιών
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγάπη της μάνας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μια φορά, Γέροντα, μας είπατε ότι με την αγάπη ο άνθρωπος μεγαλώνει, ωριμάζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν φθάνει να αγαπάη κανείς τον άλλον· πρέπει να τον αγαπάη περισσότερο από τον εαυτό του. Η μάνα αγαπάει τα παιδιά της περισσότερο από τον εαυτό της. Μένει νηστικιά, για να ταΐση τα παιδιά της, αλλά νιώθει μεγαλύτερη ευχαρίστηση από εκείνα. Τα παιδάκια τρέφονται υλικά και η μητέρα πνευματικά. Εκείνα έχουν την υλική γεύση, ενώ αυτή έχει την πνευματική αγαλλίαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μια κοπέλα, πριν παντρευτή, μπορεί να κοιμάται μέχρι τις δέκα το πρωί και να θέλη και το γάλα της να το ετοιμάζη η μάνα της. Βαριέται να κάνη καμμιά δουλειά. Τα θέλει όλα έτοιμα· θέλει όλοι να την περιποιούνται. Απαιτήσεις από την μάνα, απαιτήσεις από τον πατέρα, και  εκείνη να έχη το χουζούρι της. Ενώ υπάρχει στην φύση της η αγάπη, δεν αναπτύσσεται, γιατί συνέχεια δέχεται βοήθεια και ευλογίες από την μάνα της, από τον πατέρα της, από τα αδέλφια της. Από την στιγμή όμως που γίνεται μάνα, μοιάζει με μηχανάκι πού, όσο ζορίζεται, τόσο φορτίζεται, γιατί δουλεύει συνέχεια η αγάπη. Πρώτα σιχαινόταν, όταν άγγιζε κάτι βρώμικο, και έπαιρνε μοσχοσάπουνα για να πλυθή. Ύστερα, όταν λερώνεται το παιδάκι και πρέπη να το καθαρίση, λές και πιάνει... μαρμελάδες! Δεν σιχαίνεται. Πρώτα, αν την ξυπνούσες, φώναζε, γιατί την ενόχλησες. Ύστερα, όταν κλαίη το παιδί, όλη νύχτα ξενυχτάει και δεν δυσκολεύεται. Το φροντίζει και χαίρεται. Γιατί; Γιατί παύει να είναι παιδί. Έγινε μάνα και ήρθε η θυσία, η αγάπη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η μητέρα μάλιστα φθάνει να έχη περισσότερη αγάπη και θυσία από τον πατέρα, γιατί στον πατέρα δεν δίνονται πολλές ευκαιρίες, για να θυσιάζεται. Βασανίζεται, κοπιάζει περισσότερο με τα παιδιά, αλλά παράλληλα φορτίζεται από τα παιδιά. Δίνει-δίνει, γι᾿ αυτό συνέχεια παίρνει. Ο πατέρας ούτε βασανίζεται τόσο πολύ με τα παιδιά, αλλά ούτε φορτίζεται, γι᾿ αυτό και η αγάπη του δεν είναι όση της μητέρας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσες μητέρες έρχονται με κλάματα και με παρακαλούν: «Κάνε προσευχή, Πάτερ, για το παιδί μου». Τί αγωνία έχουν! Λίγοι άνδρες μου λένε: «Κάνε προσευχή, παραστράτησε το παιδί μου». Νά, και σήμερα μια μητέρα με τί λαχτάρα η φουκαριάρα έσπρωχνε τα παιδιά της – οκτώ είχε – και τα έβαζε στην σειρά, για να πάρουν όλα ευλογία. Ένας πατέρας δύσκολα θα το έκανε αυτό. Και η Ρωσία από τις μητέρες κρατήθηκε. Η πατρική αγκαλιά, όταν δεν έχη Χάρη Θεού, είναι ξερή. Ενώ η μητρική αγκαλιά, ακόμη και όταν δεν έχη Θεό, έχει γάλα. Το παιδί αγαπά τον πατέρα του και τον σέβεται, αλλά με την στοργή και την τρυφερότητα της μητέρας αυξάνει πιο πολύ η αγάπη του και προς τον πατέρα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η  αξιοποίηση της ατεκνίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η γυναίκα, όταν δεν έχη παιδιά, αν δεν αξιοποιήση το θέμα αυτό πνευματικά, βασανίζεται. Τί είχα τραβήξει μια φορά με μια γυναίκα που δεν είχε παιδιά! Ο άνδρας της είχε μεγάλη θέση στην δουλειά του. Αυτή είχε σπίτια που τα νοίκιαζε, σπίτι μεγάλο στο οποίο έμεναν, προίκα μεγάλη, και βαριόταν να πάη στην αγορά να ψωνίση, βαριόταν να μαγειρέψη, αλλά ούτε και ήξερε να μαγειρεύη. Τηλεφωνούσε και της έφερναν έτοιμα φαγητά. Τίποτε δεν της έλειπε, και όμως ήταν βασανισμένη, γιατί τίποτε δεν την ευχαριστούσε. Όλη μέρα καθόταν στο σπίτι· της έφταιγε το ένα, της έφταιγε το άλλο, βαριόταν το ένα, βαριόταν το άλλο. Την έπνιγαν μετά οι λογισμοί και αναγκαζόταν να παίρνη χάπια. Ο άνδρας της έπαιρνε δουλειά από το γραφείο στο σπίτι, για να της κάνη παρέα, και εκείνη καθόταν πάνω από το κεφάλι του, για να περνάη την ώρα της. Ο άνθρωπος την βαριόταν, αλλά έπρεπε ο καημένος να κάνη και την δουλειά του. Όταν την συνάντησα, της είπα: «Μήν κάθεσαι όλη μέρα μέσα στο σπίτι και μουχλιάζεις. Πήγαινε σε κανένα νοσοκομείο, να κάνης καμμιά επίσκεψη σε αρρώστους». «Που να πάω, Πάτερ; μου λέει, δύσκολο μου φαίνεται». «Τότε θα κάνης το εξής: Θα διαβάζης την Πρώτη Ώρα στην ώρα της, την Τρίτη Ώρα στην ώρα της[29]κ.λπ. και θα κάνης και καμμιά μετάνοια». «Δεν μπορώ», μου λέει. «Έ, τότε να ασχοληθής με τα Συναξάρια». Της είπα να διαβάση τον βίο όλων των γυναικών που αγίασαν, με την σκέψη μήπως από ᾿κεί πάρη κάτι και βοηθηθή. Τρόμαξα να την βάλω σε μια σειρά, για να μην καταλήξη στο τρελλοκομείο. Είχε αχρηστευθή τελείως. Γερή μηχανή, αλλά με παγωμένα λάδια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με όλα αυτά θέλω να πω ότι η καρδιά της γυναίκας αχρηστεύεται, όταν η αγάπη που έχει στην φύση της δεν βρη διέξοδο. Και βλέπεις, άλλη με πέντε-έξι ή και οκτώ παιδιά, να είναι πάμφτωχη η καημένη και να χαίρεται. Έχει και λεβεντιά και παλληκαριά. Γιατί; Γιατί βρήκε τον στόχο της. Μου έκανε εντύπωση μια περίπτωση: Ένας γνωστός μου είχε δύο αδελφές. Η μία παντρεύτηκε πολύ μικρή και απέκτησε πολλά παιδιά. Θυσία γινόταν. Έρραβε κιόλας και έστελνε σε φτωχούς ελεημοσύνες. Ήρθε προ ημερών και μου είπε: «έχω και εγγονάκια τώρα!» και σκιρτούσε η καρδιά της. Η άλλη δεν παντρεύτηκε, δεν αξιοποίησε πνευματικά και το αμέριμνο που είχε και ήταν... μην τα ρωτάς! Ένα άχρηστο πράγμα! Βαριόταν που ζούσε. Περίμενε από την γριά μάνα της να την εξυπηρετή και είχε και παράπονα. Βλέπετε τί γίνεται; Δεν έγινε η αλλαγή μέσα της, γιατί δεν έγινε μητέρα και ούτε αξιοποίησε την αγάπη που υπάρχει στην γυναικεία φύση, βοηθώντας όσους έχουν ανάγκη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό λέω ότι η θυσία είναι απαραίτητη στην γυναίκα. Ο άνδρας, και αν ακόμη δεν καλλιεργήση την αγάπη, δεν παθαίνει και μεγάλη ζημιά. Η γυναίκα όμως, με την αγάπη που έχει, αν τυχόν δεν την διοχετεύη σωστά, είναι σαν μια μηχανή που δουλεύει, αλλά δεν έχει υλικό να δουλέψη και τραντάζεται και τραντάζει και τους άλλους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αντοχή της μητέρας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο Άγιος Νεκτάριος σε μια επιστολή του προς τις μοναχές γράφει να μην ξεχνούν πώς είναι γυναίκες και να προσπαθούν να μιμούνται τις Όσιες και όχι τους Οσίους[30]. Γιατί το λέει αυτό; Μήπως γιατί οι γυναίκες δεν έχουν αντοχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ποιές; οι γυναίκες δεν έχουν αντοχή; Εγώ τις έχω φοβηθή τις γυναίκες. Έχουν πολλή αντοχή. Η γυναίκα μπορεί στο σώμα να είναι αδύναμη, να έχη λιγώτερες σωματικές δυνάμεις από τον άνδρα, αλλά με την καρδιά που έχει, αν την δουλεύη, έχει τέτοια αντοχή, που ξεπερνάει την ανδρική δύναμη. Ο άνδρας, ναι μεν έχει σωματικές δυνάμεις, αλλά δεν έχει την καρδιά που έχει η γυναίκα. Νά, πρόσεξα μια γάτα που ήρθε στο Καλύβι με τα γατιά της. Ήταν αδύνατη, η κοιλιά της κολλημένη σαν πλάκα. Μια μέρα ήρθε ένα μεγάλο σκυλί που ήταν και κυνηγητικό. Ο Κούρδης, ο γάτος, το έβαλε στα πόδια. Εκείνη σηκώθηκε επάνω, καμπούριασε, αγρίεψε, ήταν έτοιμη να ορμήση επάνω στο σκυλί. Απόρησα, που βρήκε τέτοιο θάρρος! Βλέπεις, είχε τα γατάκια της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η μάνα πονάει, κουράζεται, αλλά δεν αισθάνεται ούτε τον πόνο ούτε την κούραση. Ζορίζει τον εαυτό της, αλλά, επειδή αγαπάει τα παιδιά της, αγαπάει το σπίτι της, όλα τα κάνει με χαρά. Πιό πολύ κουράζεται ένας που ξαπλώνει συνέχεια παρά αυτή. Θυμάμαι, η μάνα μου, όταν ήμασταν μικρά, έπρεπε να κουβαλάη το νερό από την βρύση που ήταν πολύ μακριά από το σπίτι μας· έπρεπε να μαγειρεύη, να ζυμώνη, να πλένη τα ρούχα, να πηγαίνη και στο χωράφι. Έκανε δηλαδή όλες τις δουλειές, είχε κι εμάς τα παιδιά να την ζαλίζουμε και να κάνη και το ...δικαστήριο, όταν μαλώναμε. Έλεγε όμως: «Αυτό είναι το καθήκον μου· είμαι υποχρεωμένη να τα κάνω όλα, χωρίς να γογγύζω». Το έλεγε με την καλή έννοια. Αγαπούσε το σπίτι, αγαπούσε τα παιδιά της, και δεν κουραζόταν με τις δουλειές· όλα τα έκανε με την καρδιά της, με χαρά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και όσο περνούν τα χρόνια, τόσο πιο πολύ η μητέρα αγαπά το σπίτι. Παρόλο που περνά η ηλικία, θυσιάζεται πιο πολύ, για να μεγαλώση και τα εγγονάκια της. Και ενώ οι δυνάμεις της λιγοστεύουν, επειδή όμως το κάνει με την καρδιά της, έχει περισσότερο κουράγιο και από τον άνδρα, αλλά και από το κουράγιο που είχε στα νιάτα της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και στην αρρώστια, Γέροντα, η γυναίκα έχει μεγαλύτερη ψυχραιμία από τον άνδρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ξέρεις τί γίνεται; Η μητέρα με τις αρρώστιες του παιδιού έχει αντιμετωπίσει πολλές φορές την αρρώστια και έχει πολλές εμπειρίες. Θυμάται πόσες φορές ανέβηκε ο πυρετός και ξανακατέβηκε. Είδε διάφορες σκηνές· το παιδί να πνίγεται ή να λιποθυμάη και με ένα-δυό χτυπήματα να συνέρχεται κ.λπ. Ο άνδρας δεν τα βλέπει αυτά και δεν έχει τέτοιες εμπειρίες. Γι᾿ αυτό, αν δη το παιδί καμμιά φορά με πυρετό ή λίγο χλωμό, πανικοβάλλεται και αρχίζει: «Το παιδί χάνεται! Τί θα κάνουμε τώρα; Τρέξτε, φωνάξτε τον γιατρό!».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Εγκυμοσύνη και θηλασμός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ανατροφή του παιδιού αρχίζει από την εγκυμοσύνη. Αν η μητέρα που κυοφορεί συγχύζεται και στενοχωριέται, το έμβρυο μέσα στην κοιλιά της ταράζεται. Ενώ, όταν η μάνα προσεύχεται και ζη πνευματικά, το παιδάκι στην κοιλιά της μάνας αγιάζεται. Γι᾿ αυτό η γυναίκα, όταν είναι έγκυος, πρέπει να λέη την ευχή, να μελετάη λίγο από το Ευαγγέλιο, να ψάλλη, να μην έχη άγχος, αλλά και οι άλλοι να προσέχουν να μην την στενοχωρούν. Τότε το παιδί που θα γεννηθή θα είναι αγιασμένο και οι γονείς δεν θα έχουν πρόβλημα μαζί του, ούτε όταν είναι μικρό, ούτε όταν μεγαλώση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ύστερα, όταν γεννηθή το παιδί, πρέπει να το θηλάση, όσο πιο πολύ μπορεί. Το μητρικό γάλα δίνει υγεία στα παιδιά. Με τον θηλασμό τα παιδιά δεν θηλάζουν μόνο γάλα· θηλάζουν και αγάπη, στοργή, παρηγοριά, ασφάλεια, και αποκτούν έτσι δυνατό χαρακτήρα. Αλλά και την ίδια την μητέρα την βοηθάει ο θηλασμός. Όταν οι μητέρες δεν θηλάζουν τα παιδιά, δημιουργούνται ανωμαλίες στον οργανισμό τους που μπορεί να οδηγήσουν σε μαστεκτομές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Παλιά μια μητέρα μπορεί να θήλαζε και το παιδί της γειτόνισσας, αν δεν είχε γάλα. Τώρα πολλές μητέρες βαριούνται να θηλάσουν ακόμη και τα δικά τους παιδιά. Η  μάνα που τεμπελιάζει και δεν θηλάζει το παιδί, μεταδίδει τεμπελιά και στο παιδί. Παλιά τα κουτιά με το συμπυκνωμένο γάλα είχαν απ᾿ έξω μια μάνα που κρατούσε στην αγκαλιά της ένα παιδάκι. Τώρα έχουν μια μάνα που κρατάει κάτι λουλούδια! Δεν θηλάζουν οι μάνες τα παιδιά, οπότε τα παιδιά μεγαλώνουν απαρηγόρητα. Ποιός θα τους δώση στοργή και αγάπη; Το κουτί με το γάλα της αγελάδας; Θηλάζουν από το «παγωμένο» μπουκάλι και παγώνει η καρδιά τους. Ύστερα, όταν μεγαλώσουν, ζητούν παρηγοριά στο μπουκάλι, στις ταβέρνες. Πίνουν, για να ξεχάσουν το άγχος, και γίνονται αλκοολικοί. Αν δεν πάρουν στοργή τα παιδιά, δεν θα έχουν να δώσουν στοργή, και πάει σχοινί-κορδόνι. Έρχονται μετά οι μανάδες: «Κάνε προσευχή, Πάτερ! Χάνω το παιδί μου».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η εργαζόμενη μητέρα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι σωστό να εργάζεται η γυναίκα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο άνδρας της τί λέει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ό,τι αναπαύει την γυναίκα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μια κοπέλα που σπούδασε και άρχισε να εργάζεται πριν από τον γάμο της, δύσκολα αφήνει την δουλειά της, όταν γίνη μάνα, για να αφοσιωθή στα παιδιά της. Ενώ μια άλλη που δεν σπούδασε και έχει μια απλή δουλειά, πιο εύκολα μπορεί να την αφήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν έχη παιδιά, Γέροντα, νομίζω ότι την βοηθάει η δουλειά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, αν δεν έχη παιδιά, πρέπει οπωσδήποτε να εργάζεται επαγγελματικά; Υπάρχουν τόσα άλλα πράγματα που μπορεί να κάνη. Φυσικά, αν έχη παιδιά, το καλύτερο είναι να μείνη στο σπίτι. Γιατί τα παιδιά πώς θα βοηθηθούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλές γυναίκες λένε ότι δεν τα βγάζουν πέρα, γι᾿ αυτό αναγκάζονται να δουλεύουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν τα βγάζουν πέρα, γιατί θέλουν να έχουν τηλεόραση, βίντεο, αυτοκίνητο προσωπικό κ.λπ., οπότε πρέπει να εργασθούν, με αποτέλεσμα να παραμελούν και να χάνουν τα παιδιά τους. Αν εργάζεται μόνον ο πατέρας και αρκούνται στα λίγα, τότε δεν θα υπάρχη πρόβλημα. Με το να εργάζωνται και οι δύο, δήθεν γιατί δεν τους φθάνουν τα χρήματα, η οικογένεια σκορπίζεται και χάνει το πραγματικό της νόημα. Τί να κάνουν και τα παιδιά; Αν ζούσαν πιο απλά, θα ήταν ξεκούραστες και αυτές, θα χαίρονταν και τα παιδιά. Κάποιος ήξερε επτά γλώσσες και η γυναίκα του ζοριζόταν να μάθη τέσσερις, παρέδιδε και μαθήματα και έπαιρνε φάρμακα, για να τα βγάλη πέρα. Τα παιδιά τους γεννήθηκαν καλά και μεγάλωσαν βλαμμένα. Έπειτα ψυχαναλύσεις... Γι᾿ αυτό λέω στις μητέρες να απλοποιήσουν την ζωή τους, για να μπορέσουν να ασχοληθούν περισσότερο με τα παιδιά τους που τις έχουν ανάγκη. Άλλο είναι να έχουν και κάποια άλλη απασχόληση στο σπίτι και να καταπιάνωνται με αυτήν, όταν κουράζωνται με τα παιδιά. Όταν η μητέρα είναι μέσα στο σπίτι, μπορεί και παρακολουθεί τα παιδιά, ρυθμίζει τα πράγματα και αποφεύγονται πολλές στενοχώριες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα τα παιδιά δεν χορταίνουν την μητρική αγάπη, αλλά ούτε την μητρική τους γλώσσα μαθαίνουν, γιατί η μάνα λείπει όλη την ημέρα στην δουλειά και αφήνει τα παιδιά με ξένες γυναίκες. Χίλιες φορές καλύτερα περνούν τα παιδιά του βρεφοκομείου, όπου βρίσκεται και κάποια αφιερωμένη νοσοκόμα που τους δείχνει λίγη στοργή, παρά τα παιδιά, που τα εγκαταλείπουν οι γονείς τους και πληρώνουν μια γυναίκα, για να τα φροντίζη. Και ύστερα τί γίνεται; Όποιος δεν έχει μια μάνα, έχει ένα σωρό παραμάνες!
- type: h2
  initial:
    ru: ''
  text:
    ru: Νοικοκυριό και πνευματική ζωή της μητέρας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορεί μια νοικοκυρά να ρυθμίση τις δουλειές της, ώστε να έχη χρόνο και για προσευχή; Τί αναλογία δηλαδή πρέπει να υπάρχη ανάμεσα στην εργασία και στην προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Οι γυναίκες συνήθως δεν έχουν μέτρο στις δουλειές τους. Θέλουν συνέχεια να ανοίγουν δουλειές. Ενώ έχουν πολλή καρδιά και θα μπορούσαν να κάνουν πολύ καλό νοικοκυριό στην ψυχή τους, ξοδεύουν την καρδιά τους σε ασήμαντα πράγματα. Ας υποθέσουμε ότι έχουμε ένα ποτήρι με ωραία σχέδια, με γραμμές κ.λπ. Και αν δεν είχε γραμμές, την δουλειά του πάλι θα την έκανε. Εκείνες όμως πάνε στο κατάστημα και αρχίζουν: «Όχι, τις θέλω μέχρι εκεί τις γραμμές, όχι έτσι, όχι αλλιώς». Και αν έχη και κανένα λουλούδι, έ, τότε είναι που σκιρτά η καρδιά! Έτσι η γυναίκα καταστρέφει όλη την δυναμικότητά της. Σπάνια θα βρής κανέναν άνδρα να δώση προσοχή σε κάτι τέτοια. Και αν ένα πορτατίφ λ.χ. είναι καφέ ή μαύρο, ούτε που το προσέχουν οι άνδρες. Αλλά η γυναίκα θέλει κάτι όμορφο, χαίρεται, δίνει ένα κομμάτι της καρδιάς της σε αυτό, άλλο κομμάτι σε κάτι άλλο, οπότε τί μένει για τον Χριστό; Τα χασμουρητά από την κούρασή της στην ώρα της προσευχής. Όσο απομακρύνεται η καρδιά της γυναίκας από τα όμορφα, τόσο πλησιάζει τον Χριστό. Και όταν η καρδιά δοθή στον Χριστό, τότε έχει μεγάλη δύναμη! Είδα μια ψυχή αυτές τις μέρες που έχει αφεθή τελείως στον Θεό. Βλέπεις να καίη μέσα της μια γλυκειά φλόγα! Τα παίρνει όλα στα ζεστά. Ήταν τελείως κοσμική, αλλά είχε καλή διάθεση και κάποια στιγμή τινάχθηκε η σπίθα μέσα της. Χρυσαφικά, λούσα, όλα τα πέταξε. Τώρα ζη με μια απλότητα! Αγωνίζεται, κάνει δουλειά πνευματική. Με τί θυσία κινείται! Ζήλεψε τους Αγίους με την καλή έννοια. Τί κομποσχοίνι, τί νηστείες κάνει, τί Ψαλτήρι διαβάζει!... Φοβερό! Αυτή τρέφεται από την άσκηση τώρα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μια μητέρα μου είπε: «Είμαι αδύναμη σωματικά και κουράζομαι πολύ· ούτε τις δουλειές προλαβαίνω να κάνω, ούτε χρόνος μου μένει για προσευχή».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να απλοποιήση την ζωή της, για να της μένη χρόνος και για προσευχή. Με την απλότητα μια μητέρα μπορεί να κάνη πολλή προκοπή. Αν μια μάνα έχη απλοποιήσει την ζωή της, αλλά κοπιάζει, γιατί έχει πολλά παιδιά, δικαιούται να πη «κουράζομαι». Αν όμως χάνη τον χρόνο της κοιτάζοντας πώς θα παρουσιάση τακτοποιημένο το σπίτι της στους ξένους, τότε τί να πη κανείς; Μερικές μητέρες, για να τα έχουν όλα τακτοποιημένα στο σπίτι, περιορίζουν ασφυκτικά τα παιδάκια και δεν τα αφήνουν να μετακινήσουν μια καρέκλα ή ένα μαξιλάρι. Τους επιβάλλουν στρατιωτική πειθαρχία, και έτσι τα παιδιά, ενώ γεννιούνται κανονικά, μεγαλώνουν δυστυχώς βλαμμένα. Ένας μυαλωμένος άνθρωπος, αν δη σε ένα σπίτι που έχει πολλά παιδιά όλα τα πράγματα στην θέση τους, θα βγάλη συμπέρασμα ότι ή τα παιδιά είναι βλαμμένα ή η μάνα είναι βάρβαρη και επιβάλλει στρατιωτική πειθαρχία. Υπάρχει φόβος στην ψυχή των παιδιών, γι᾿ αυτό πειθαρχούν. Μια φορά είχα πάει σε ένα σπίτι με πολλά παιδιά. Πόση χαρά μου έδωσαν τα παιδάκια με τις παιδικές αταξίες τους, που χαλούσαν την κοσμική τάξη – το κάθε πράγμα στην θέση του. Αυτό είναι η μεγαλύτερη αταξία, που κουράζει πολύ τον σημερινό άνθρωπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά δεν υπήρχαν πνευματικά βιβλία, για να βοηθηθούν οι μητέρες με την μελέτη. Τώρα υπάρχουν ένα σωρό Πατερικά, ένα σωρό μεταφράσεις, αλλά δυστυχώς οι περισσότερες μητέρες ή ασχολούνται με κάτι χαζά ή εργάζονται, για να τα βγάλουν πέρα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η  μάνα καλύτερα είναι να ασχολήται με την ανατροφή των παιδιών, παρά να καταπιάνεται σχολαστικά με το νοικοκυριό, με τα άψυχα πράγματα. Να τους μιλάη για τον Χριστό, να τους διαβάζη βίους Αγίων. Παράλληλα να ασχολήται και με το ξεσκόνισμα της ψυχής της, για να λαμποκοπάη πνευματικά. Η πνευματική ζωή της μητέρας θα βοηθήση αθόρυβα και τις ψυχές των παιδιών της. Έτσι και τα παιδιά της θα ζουν χαρούμενα, και εκείνη θα είναι ευτυχισμένη, γιατί μέσα της θα έχη τον Χριστό. Αν η μάνα δεν ευκαιρή ούτε ένα «Τρισάγιο» να πή, πώς θα αγιασθούν τα παιδιά της;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, μια μάνα έχη πολλά παιδιά και πολλές δουλειές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όταν κάνη τις δουλειές στο σπίτι, δεν μπορεί συγχρόνως να προσεύχεται; Εμένα η μητέρα μου μου έμαθε να λέω την ευχή. Όταν σαν παιδιά κάναμε καμμιά αταξία και πήγαινε να θυμώση, την άκουγα που έλεγε:«Κύριε Ιησού Χριστέ, ελέησόν με». Όταν έβαζε το ψωμί στον φούρνο, έλεγε: «Εις το όνομα του Χριστού και της Παναγίας». Και όταν ζύμωνε και όταν μαγείρευε, πάλι έλεγε συνέχεια την ευχή. Έτσι αγιαζόταν η ίδια, αγιαζόταν και το ψωμί και το φαγητό που έκανε, αγιάζονταν και αυτοί που το έτρωγαν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσες μητέρες που είχαν αγία ζωή είχαν και αγιασμένα παιδιά! Νά, η μητέρα του Γέροντα Χατζη-Γεώργη. Ακόμη και το γάλα αυτής της ευλογημένης μάνας, που θήλαζε ο Γαβριήλ – το κατά κόσμον όνομα του Γέροντα Χατζη-Γεώργη – ήταν ασκητικό! Είχε αποκτήσει δύο παιδιά και ύστερα ζούσαν με τον σύζυγό της εν παρθενία, αγαπημένοι σαν αδέλφια. Είχε ασκητικό πνεύμα από μικρή, γιατί είχε αδελφή μοναχή, ασκήτρια, την οποία επισκεπτόταν και αργότερα με τα παιδιά της. Ο πατέρας του Γαβριήλ ήταν και αυτός ευλαβής και ασχολούνταν με το εμπόριο, γι᾿ αυτό τον περισσότερο καιρό τον περνούσε στα ταξίδια. Αυτό έδινε την ευκαιρία στην μητέρα του να ζη απλά, να μη «μεριμνά και τυρβάζη περί πολλά»[31], να τον παίρνη μαζί της και να αγρυπνή με άλλες γυναίκες πότε στις σπηλιές και πότε στα εξωκκλήσια. Γι᾿ αυτό μετά έφθασε σε τέτοια μέτρα αγιότητος[32].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ευλάβεια της μητέρας έχει μεγάλη σημασία. Αν η μητέρα έχη ταπείνωση, φόβο Θεού, τα πράγματα μέσα στο σπίτι πάνε κανονικά. Γνωρίζω νέες μητέρες που λάμπει το πρόσωπό τους, αν και δεν έχουν από πουθενά βοήθεια. Από τα παιδιά καταλαβαίνω σε τί κατάσταση βρίσκονται οι μητέρες.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 3 – Η ευθύνη των γονέων για την ανατροφή των παιδιών
- type: h2
  initial:
    ru: ''
  text:
    ru: Να εμπιστευθούν οι γονείς τα παιδιά τους στον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός έδωσε στους Πρωτοπλάστους, στον Αδάμ και την Εύα, την μεγάλη ευλογία να γίνωνται συνδημιουργοί Του. Στην συνέχεια οι γονείς, οι παππούδες κ.λπ. είναι και αυτοί συνδημιουργοί με τον Θεό, γιατί δίνουν το σώμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός είναι κατά κάποιον τρόπο υποχρεωμένος να νοιαστή για τα παιδιά. Όταν βαπτισθή το παιδάκι, ο Θεός διαθέτει και έναν Άγγελο, για να το προστατεύη, οπότε το παιδί προστατεύεται από τον Θεό, από τον Φύλακα Άγγελο και από τους γονείς. Ο Φύλακας Άγγελος είναι συνέχεια κοντά του και το βοηθάει. Όσο μεγαλώνει το παιδί, τόσο οι γονείς απαλλάσσονται από τις ευθύνες. Αν οι γονείς πεθάνουν, ο Θεός, και από ψηλά και από κοντά, αλλά και ο Φύλακας Άγγελος από κοντά, συνεχίζουν για πάντα να προστατεύουν το παιδί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι γονείς πρέπει να βοηθούν πνευματικά τα παιδιά, όταν είναι μικρά, γιατί τότε και τα ελαττώματά τους είναι μικρά και εύκολα μπορούν να κοπούν. Είναι όπως η φρέσκια πατάτα· λίγο αν την ξύσης, ξεφλουδίζεται. Αν όμως παλιώση, πρέπει να πάρης μαχαίρι να την καθαρίσης καί, αν έχη και κανένα μαυράκι, πρέπει να προχωρήσης και πιο βαθιά. Αν τα παιδιά βοηθηθούν από μικρά και γεμίσουν Χριστό, θα είναι κοντά Του για πάντα. Και να ξεφύγουν λίγο, όταν μεγαλώσουν, λόγω της ηλικίας ή μιας κακής συναναστροφής, πάλι θα συνέλθουν. Γιατί ο φόβος του Θεού και η ευλάβεια, που πότισαν τις καρδιές τους στην μικρή ηλικία, δεν είναι δυνατόν ποτέ να εξαλειφθούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ύστερα, στην εφηβεία, που είναι η πιο δύσκολη ηλικία, η αγωνία των γονέων είναι μεγαλύτερη για τα παιδιά τους, μέχρι να τα μορφώσουν και να τα αποκαταστήσουν. Οι γονείς τότε ας κάνουν ό,τι μπορούν, για να τα βοηθήσουν, και ό,τι δεν μπορούν να κάνουν, γιατί ξεπερνάει τις δυνάμεις τους, ας το αναθέτουν στον Παντοδύναμο Θεό. Όταν εμπιστευθούν τα παιδιά τους στον Θεό, τότε ο Θεός είναι υποχρεωμένος να βοηθήση για πράγματα που δεν γίνονται ανθρωπίνως. Αν λ.χ. τα παιδιά δεν ακούν, να τα εμπιστευθούν στον Θεό, και όχι να βρίσκουν διάφορους τρόπους να τα ζορίζουν. Να πη η μητέρα στον Θεό: «Θεέ μου, δεν μ᾿ ακούν τα παιδιά μου. Εγώ δεν μπορώ να κάνω τίποτε. Φρόντισέ τα Εσύ».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μου έκανε εντύπωση προχθές στην αγρυπνία μια μητέρα που την γνώριζα από παλιά. Ήρθε να με χαιρετήση. Βλέπω, είχε μαζί της μόνον τα μεγαλύτερα παιδιά. «Που είναι τα μικρά;», την ρωτάω. «Στο σπίτι, Γέροντα, μου λέει. Τέτοια μέρα θέλαμε να ᾿ρθούμε στην αγρυπνία και είπαμε με τον σύζυγο: «Αφού σε αγρυπνία πάμε, δεν πάμε κάπου για διασκέδαση, ο Θεός θα διαθέση έναν Άγγελο να φυλάξη τα μικρά μας"». Σπάνια συναντάς σήμερα τέτοια εμπιστοσύνη, γιατί τώρα, όπως έλειψε η εμπιστοσύνη των παιδιών στους γονείς, έλειψε και η εμπιστοσύνη των γονέων στον Θεό. Και ακούς συχνά πολλούς γονείς να λένε: «Γιατί το δικό μας παιδί να πάρη κακό δρόμο; Εμείς εκκλησιαζόμαστε». Δεν δίνουν το κατσαβίδι στον Χριστό να σφίξη στα παιδιά λίγο καμμιά ...βίδα· θέλουν να τα κάνουν όλα μόνοι τους. Και ενώ υπάρχει ο Θεός, που προστατεύει τα παιδιά, και ο Φύλακας Άγγελος είναι συνέχεια κοντά τους και τα προστατεύει και αυτός, αυτοί αγωνιούν, μέχρι που αρρωσταίνουν. Και παρόλο που είναι πιστοί άνθρωποι, φέρονται σαν να μην υπάρχη Θεός, σαν να μην υπάρχη Φύλακας Άγγελος, οπότε εμποδίζουν την θεία επέμβαση. Ενώ πρέπει να ταπεινώνωνται και να ζητούν βοήθεια από τον Θεό και ο Καλός Θεός θα προστατέψη τα παιδιά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική αναγέννηση των παιδιών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, για την ανατροφή των παιδιών ευθύνονται μόνον οι γονείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κυρίως οι γονείς ευθύνονται, γιατί, ανάλογα με την ανατροφή που θα δώσουν στα παιδιά, θα γίνουν καλοί κληρικοί, καλοί εκπαιδευτικοί κ.λπ., και θα βοηθούν και αυτά με την σειρά τους τα παιδιά, και τα δικά τους και του κόσμου. Η μητέρα μάλιστα έχει περισσότερη ευθύνη από τον πατέρα για την ανατροφή των παιδιών.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν οι γονείς, κατά το διάστημα που το παιδάκι είναι ακόμη στην κοιλιά της μητέρας, προσεύχωνται, ζουν πνευματικά, το παιδάκι θα γεννηθή αγιασμένο. Και στην συνέχεια, αν το βοηθήσουν πνευματικά, θα γίνη αγιασμένος άνθρωπος και θα βοηθάη την κοινωνία, είτε στην Εκκλησία θα διακονή είτε στην εξουσία θα ανεβή κ.λπ. Πρέπει όλοι να βοηθούμε τα παιδιά, ώστε να γίνουν σωστοί άνθρωποι και να μείνη λίγο προζύμι για τις επόμενες γενιές. Γιατί τώρα, όπως πάνε τα πράγματα, πάει να χαθή και το προζύμι. Και αν χαθή το προζύμι, μετά τί θα γίνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι γονείς που γεννούν τα παιδιά και τους δίνουν το σώμα πρέπει να συντελέσουν, όσο μπορούν, και στην πνευματική αναγέννησή τους. Γιατί ο άνθρωπος, εάν δεν αναγεννηθή πνευματικά, είναι για την κόλαση. Ύστερα οι γονείς, ό,τι δεν μπορούν να κάνουν οι ίδιοι για τα παιδιά τους, θα το αναθέσουν σε δασκάλους. Γι᾿ αυτό λέει και η Εκκλησία μας «τούς γονείς ημών και διδασκάλους»[33]. Υπάρχουν όμως και οι πνευματικοί Πατέρες, που μπορεί να μην έχουν παιδιά, αλλά βοηθούν πιο θετικά στην αγωγή των παιδιών, γιατί εργάζονται για την πνευματική τους αναγέννηση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θέλω να πώ, όλοι πρέπει να βοηθούν, καθένας με τον τρόπο του, με το παράδειγμά του, για να αναγεννηθούν τα παιδιά, ώστε να ζήσουν ειρηνικά σ᾿ αυτήν την ζωή και να πάνε στον Παράδεισο. Όταν τα παιδιά γίνουν πνευματικοί άνθρωποι, ούτε νόμους χρειάζονται ούτε τίποτε.«Δικαίοις νόμος ου κείται»[34]. Ο νόμος είναι για τους παρανόμους. Η πνευματική εξουσία είναι ανώτερη από τις ανθρώπινες εξουσίες.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το παράδειγμα των γονέων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν το παιδί δεν υπακούη και αντιδρά, πώς πρέπει να φερθούν οι γονείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Για να μην υπακούη το παιδί και να φέρεται άσχημα, κάτι θα φταίη. Μπορεί να βλέπη άσχημες σκηνές ή να ακούη άσχημα λόγια μέσα στο σπίτι ή έξω από αυτό. Πάντως τα παιδιά στα πνευματικά θέματα τα βοηθούμε κυρίως με το παράδειγμά μας, όχι με το ζόρισμα. Περισσότερο μάλιστα τα βοηθάει η μητέρα με το παράδειγμά της, με την υπακοή της και τον σεβασμό της προς τον σύζυγο. Αν σε κάποιο θέμα έχη διαφορετική γνώμη από εκείνον, ποτέ να μην την εκφράζη μπροστά στα παιδιά, για να μην το εκμεταλλεύεται ο πονηρός. Ποτέ να μη χαλνάη τον λογισμό των παιδιών για τον πατέρα. Ακόμη και αν φταίη ο πατέρας, να τον δικαιολογή. Αν λ.χ. φερθή άσχημα, να πη στα παιδιά: « Ο μπαμπάς είναι κουρασμένος, γιατί ξενύχτησε, για να τελειώση μια επείγουσα δουλειά. Και αυτό για σάς το κάνει».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πολλοί γονείς μαλώνουν μπροστά στα παιδιά και τους δίνουν άσχημα μαθήματα. Τα καημένα τα παιδιά θλίβονται. Αρχίζουν μετά οι γονείς, για να τα παρηγορήσουν, να τους κάνουν όλα τα χατίρια. Πηγαίνει ο πατέρας και καλοπιάνει το παιδί: «Τί θέλεις, χρυσό μου, να σού πάρω;». Πηγαίνει και η μάνα, το καλοπιάνει κι εκείνη, και τελικά τα παιδιά μεγαλώνουν με νάζια και καμώματα και ύστερα, αν δεν μπορούν οι γονείς να τους δώσουν ό,τι τους ζητούν, τους απειλούν ότι θα αυτοκτονήσουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπω πόσο βοηθάει τα παιδιά το καλό παράδειγμα των γονέων. Ήρθαν σήμερα δυο κοριτσάκια – το ένα θα ήταν τριών χρονών και το άλλο τεσσάρων – με τους γονείς τους που ήταν πολύ ευλαβείς. Πόσο τα χάρηκα! Σαν αγγελούδια ήταν. Κάθονταν και σκέπαζαν με τα φορεματάκια τους τα γονατάκια τους. Είχαν μια συστολή, έναν σεβασμό! Και όλο αυτό προερχόταν από την συμπεριφορά των γονέων. Όταν τα παιδιά βλέπουν τους γονείς τους να έχουν αγάπη μεταξύ τους, να έχουν σεβασμό, να φέρωνται με σύνεση, να προσεύχωνται κ.λπ., τότε αυτά τα τυπώνουν στην ψυχή τους. Γι᾿ αυτό λέω ότι η καλύτερη κληρονομιά που μπορούν να αφήσουν οι γονείς στα παιδιά τους είναι να τους μεταδώσουν την δική τους ευλάβεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Να βλέπατε ένα κοριτσάκι στην Αυστραλία͵ τί αρχοντιά είχε! Ήμασταν στην Κανμπέρα. Είχα δει τους τελευταίους ανθρώπους που είχαν έρθει εκεί και σε λίγο θα φεύγαμε. Βλέπω, σταματάει ένα αυτοκίνητο και κατεβαίνει ένα ανδρόγυνο με το κοριτσάκι τους. «Γέροντα, σάς προλάβαμε», μου λένε. «Ναί, τους λέω, σε λίγο φεύγουμε». «Γέροντα, λέει ο άνδρας, εγώ ας μην έρθω· δεν πειράζει· μόνον η σύζυγος να σάς δη λίγο, για να αναπαυθή, γιατί είναι ευαίσθητη». Πήγαμε λίγο πιο πέρα με την μάνα, για να μου πη τί ήθελε. Το κοριτσάκι έτρεχε από πίσω της. «Κάθησε, του λέω, θα έρθη η μαμά». «Εσύ έχεις μαμά;», με ρωτάει. «Δεν έχω», του λέω. Βλέπω, τα ματάκια του βούρκωσαν. «Θέλεις να σού δώσω την δική μου μαμά;», μου λέει. Το ρωτάω τότε κι εγώ: «Εσύ έχεις παππού;». «Όχι», μου λέει. «Θέλεις παππού;». «Θέλουμε, μου λέει. Θέλεις να καθήσης στο σπίτι το δικό μας ή θέλεις να καθήσουμε εμείς στο δικό σου; Όπως θέλεις», μου λέει. Τέτοια αρχοντιά! Μικρό παιδί να θυσιάση την μάνα του! Και να δήτε, είχε αντιγράψει τους γονείς του. Ο πατέρας είχε πολλή αρχοντιά. Τον αγκάλιασα, τον φίλησα, τον συνεχάρηκα. Πόσες ευχές του έδωσα! Τέτοιοι άνθρωποι συγκινούν και τον πιο σκληρόκαρδο άνθρωπο, πόσο μάλλον τον Θεό!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα παιδιά πρέπει να χορτάσουν στο σπίτι στοργή και αγάπη
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το παιδί έχει ανάγκη από πολλή αγάπη και στοργή και από πολλή καθοδήγηση. Θέλει να καθήσης κοντά του, να σού πη τα προβλήματά του, να το χαϊδέψης, να το φιλήσης. Όταν το μικρό παιδί είναι καμμιά φορά ανήσυχο και κάνη σκανταλιές, αν το πάρη η μάνα στην αγκαλιά, το χαϊδέψη και το φιλήση, ηρεμεί, γαληνεύει. Αν χορτάση στοργή και αγάπη, όταν είναι μικρό, ύστερα έχει δύναμη να αντιμετωπίση τα προβλήματα της ζωής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα όμως τα περισσότερα παιδιά βλέπουν τους γονείς τους για λίγο το βράδυ και δεν χορταίνουν αγάπη. Πολλές φορές οι γονείς που είναι εκπαιδευτικοί ή γιατροί και ασχολούνται στην δουλειά τους με παιδιά δίνουν την στοργή τους στα ξένα παιδιά καί, όταν γυρίζουν στο σπίτι, δεν έχουν στοργή για τα δικά τους παιδιά. Είναι κουρασμένοι. Έχει τελειώσει πια η μπαταρία. Ο πατέρας από την μια μεριά ξαπλώνει στην πολυθρόνα, παίρνει και την εφημερίδα να διαβάση κανένα νέο και δεν ασχολείται καθόλου με τα παιδιά· πάει κοντά του το παιδάκι καί, αντί να του μιλήση, αντί να το χαϊδέψη λίγο, το διώχνει. Η μάνα από την άλλη πάει να ετοιμάση κάτι για φαγητό, οπότε ούτε αυτή δεν ευκαιρεί να ασχοληθή με τα παιδιά, κι έτσι τα καημένα μεγαλώνουν στερημένα από αγάπη. Ή μερικοί δικαστικοί, όταν το παιδί κάνη καμμιά ζημιά, κάνουν και στο σπίτι δικαστήριο. Δεν φέρονται στα παιδιά με στοργή και αγάπη, γι᾿ αυτό μετά και αυτά έχουν ψυχολογικά προβλήματα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ταλαιπωρία των παιδιών εξ αιτίας των γονέων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια μητέρα μας ρώτησε τί να κάνη που η κόρη της βρίζει την Παναγία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να εξετάση από που ξεκινάει το κακό. Μερικές φορές σε τέτοιες περιπτώσεις φταίνε οι γονείς. Όταν οι ίδιοι δεν συμπεριφέρωνται καλά, δεν βοηθούν τα παιδιά και εκείνα μιλούν με αναίδεια. Τότε δέχονται μια επήρεια δαιμονική και αντιδρούν άσχημα. Άλλοτε πάλι οι γονείς νομίζουν ότι με το ζόρι θα κάνουν καλά παιδιά. Μπαίνει και ο εγωισμός και τους μιλούν με αγανάκτηση, ενώ πρέπει να τους φέρωνται πάντα με το καλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα μια γυναίκα με έσκασε! Έχει ένα παιδάκι και το δέρνει αλύπητα. Από την φοβία το κακόμοιρο τρέμει· δεν μπορεί να μιλήση· έπαθαν τα νεύρα του. «Έχει δαιμόνιο», της λένε και αυτή το αφήνει νηστικό, για να φύγη δήθεν το δαιμόνιο. «Δεν του δίνω να φάη, μου είπε, για να φύγη το δαιμόνιο». «Βρέ, είσαι στα καλά σου; της λέω. Δώσε στο παιδί να φάη. Κοίταξε, τα δικά σου δαιμόνια να φύγουν. Εσύ έγινες αφορμή και σακατεύτηκε το παιδί. Το παιδί δεν έχει δαιμόνιο· τρέμει, γιατί φοβάται εσένα που το δέρνεις! Το κοινωνάς τακτικά;». «Όχι», μου λέει. Άντε να συνεννοηθής!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μήπως, επειδή μερικές φορές βρίζει, γι᾿ αυτό λένε ότι έχει δαιμόνιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βρίζει! Όταν με το ζόρισμα που του κάνει η μάνα πάη να το πνίξη, δεν ξέρει κι εκείνο τί κάνει μετά. Κρίμα το καημένο! Δαιμονισμένη είναι η μάνα του, δεν είναι το παιδί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πάντως θα δούμε παράξενα πράγματα την ημέρα της Κρίσεως! Στα χρόνια της ειδωλολατρίας οι μητέρες έκαιγαν τα παιδιά τους μπροστά στο άγαλμα του Μολόχ[35], για να συμμετάσχουν στην δοξολογία προς τον θεό[36]! Αν γνώριζαν τον πραγματικό Θεό, τί θυσίες θα έκαναν! Αυτές θα έχουν ελαφρυντικά την ημέρα της Κρίσεως, γιατί παρασύρθηκαν. Οι σημερινές όμως μητέρες με την αδιαφορία που έχουν για τα παιδιά τους τί ελαφρυντικά θα έχουν; Θα τις πη ο Θεός: «Εσείς γνωρίζατε τον αληθινό Θεό, βαπτιστήκατε, τόσα ακούσατε, τόσα μάθατε, ο Ίδιος ο Θεός σταυρώθηκε για να σάς σώση, και τί κάνατε; Βαριόσασταν να πάτε τα παιδιά σας να τα κοινωνήσετε στην εκκλησία! Εκείνες νόμιζαν ότι ο Μολόχ είναι ο αληθινός Θεός και πρόσφεραν θυσία ακόμη και τα παιδιά τους. Εσείς τί κάνατε;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Τα σφάλματα των γονέων τα πληρώνουν τα παιδιά! Μερικοί γονείς καταστρέφουν τα παιδιά τους, αλλά ο Θεός δεν είναι άδικος· έχει μεγάλη και ιδιαίτερη αγάπη για τα παιδιά που έχουν αδικηθή στον κόσμο αυτόν είτε από τους γονείς τους είτε από άλλους ανθρώπους. Όταν οι γονείς γίνωνται αιτία να πάρη το παιδί στραβό δρόμο, ο Θεός δεν θα το αφήση, γιατί δικαιούται την θεία βοήθεια. Θα οικονομήση έτσι τα πράγματα, ώστε να βοηθηθή. Νά, βλέπουμε μερικούς νέους, αλλά και ηλικιωμένους ακόμη, πώς κάποια στιγμή παίρνουν απότομα μια καλή στροφή. Θυμάμαι μια περίπτωση: Σε μια οικογένεια με δυο παιδιά, ο πατέρας, η μάνα και η κόρη ήταν άθεοι. Το αγόρι έμπλεξε πρώτα με τον μαρξισμό. Δεν αναπαύθηκε, πήγε στον Ινδουισμό. Δεν αναπαύθηκε κι εκεί, και ήρθε στο Άγιον Όρος. Ερχόταν συχνά στο Καλύβι, πήγαινε και σε άλλα Κελλιά. Οι γονείς του όλον αυτόν τον καιρό «Χριστέ μου, Παναγία μου, φύλαξε το παιδί μας», έλεγαν. Αφού κάθησε ένα διάστημα στο Όρος και κάπως συνήλθε και δυνάμωσε πνευματικά, γύρισε στο σπίτι του – γιατί δεν ήταν για τον Μοναχισμό -, και βοήθησε πνευματικά και τον πατέρα και την μάνα του. Τώρα, βλέπω, ο πατέρας του πρώτος-πρώτος στέκεται στην αγρυπνία. Λέει τον Προοιμιακό[37]στην εκκλησία, διαβάζει στο σπίτι τον εσπερινό, το απόδειπνο, την παράκληση. Πώς τα οικονόμησε ο Θεός! Πήγε ο διάβολος να κάνη κακό, αλλά ο Θεός τα ᾿φερε από ᾿δώ-από ᾿κεί και τους έφερε όλους σε λογαριασμό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και το κορίτσι, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κι αυτό σιγά-σιγά έρχεται σε λογαριασμό. Δίνει ευκαιρίες ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί γονείς που αρχίζουν να ζουν πνευματικά σε μεγάλη ηλικία στενοχωριούνται που δεν έδωσαν χριστιανική αγωγή στα παιδιά τους, όταν ήταν μικρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν έχουν ειλικρινή μετάνοια και παρακαλέσουν τον Θεό να βοηθήση τα παιδιά τους, ο Θεός κάτι θα κάνη γι᾿ αυτά· θα τους ρίξη κανένα σωσίβιο, για να σωθούν από την φουρτούνα στην οποία βρίσκονται. Ακόμη και αν δεν παρουσιασθούν άνθρωποι, για να τα βοηθήσουν, μπορεί και κάτι που θα δούν να συντελέση, ώστε να πάρουν μια καλή στροφή. Να ξέρετε, αυτοί οι γονείς είχαν καλή διάθεση, αλλά δεν βοηθήθηκαν μικροί από την οικογένειά τους και δικαιούνται την θεία βοήθεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καμμιά φορά, Γέροντα, τα παιδιά ζουν πνευματική ζωή, αλλά συναντούν πολλές δυσκολίες από τους γονείς τους που είναι αδιάφοροι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γι᾿ αυτά τα παιδιά ο Θεός φροντίζει περισσότερο από τα άλλα που έχουν γονείς που ζουν πνευματικά, όπως φροντίζει και για τα ορφανά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Επιδράσεις που δέχονται τα παιδιά από το περιβάλλον
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από ποιά ηλικία, Γέροντα, τα παιδιά επηρεάζονται από το περιβάλλον;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τα παιδιά από την κούνια ακόμη αντιγράφουν τους γονείς. Ξεσηκώνουν ό,τι βλέπουν να κάνουν οι μεγάλοι και τα γράφουν όλα στην άδεια κασέτα τους. Γι᾿ αυτό οι γονείς πρέπει να αγωνισθούν να κόψουν τα πάθη τους. Άσχετα αν μερικά τα κληρονόμησαν από τους δικούς τους γονείς, θα δώσουν λόγο στον Θεό, όχι μόνο γιατί δεν αγωνίσθηκαν να τα κόψουν, αλλά και γιατί έχουν ευθύνη που τα μεταδίδουν στα παιδιά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παιδάκια που έχουν την ίδια αγωγή από το σπίτι τους, πώς γίνεται μερικές φορές να μη μοιάζουν καθόλου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συχνά το παιδί δέχεται και πολλές επιδράσεις από το εξωτερικό περιβάλλον. Αλλά, όταν μεγαλώση, αν έχη καλή διάθεση, ο Θεός θα του δώση περισσότερη φώτιση, για να καταλάβη τις αρνητικές επιδράσεις που έχει δεχθή και να αγωνισθή να τις αποβάλη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα υπάρχει στον κόσμο μια κακότητα. Πάνε να καταστρέψουν τα παιδιά από μικρά. Αντί να τα φρενάρουν από το κακό, μέχρι να ενηλικιωθούν, τα εμποδίζουν και από το καλό. Και ύστερα, τα κακόμοιρα, όταν πέφτουν στην αμαρτία και ταλαιπωρούνται, θέλουν να σηκωθούν και δεν ξέρουν πώς να σηκωθούν. Γιατί, άμα πάρουν τον γλυκό κατήφορο, δύσκολα μπορούν να σταματήσουν. Έρχονται στο Καλύβι παιδιά είκοσι πέντε, είκοσι επτά χρονών, που παίρνουν ναρκωτικά κ.λπ., και τα καημένα ζητούν βοήθεια. Έτυχε μια φορά να βοηθήσω ένα-δυό παιδιά να πάρουν μια καλή στροφή, και τώρα φέρνουν τον φίλο τους, τον φίλο του φίλου τους, για να βοηθηθούν. Σού σπαράζουν την καρδιά. Ένα παιδί, το καημένο, έπαιρνε βαριά ναρκωτικά και ήταν τελείως για πεθαμό. Τα χέρια του, τα δόντια του ήταν χάλια. Ύστερα τα σταμάτησε και βοήθησε και άλλους νέους. Κάπου δεκαπέντε παιδιά ήταν στην συντροφιά του και όποιο ερχόταν μετά έλεγε: «Είμαι του τάδε». Τον είχαν για ...Γέροντα! Πολλά όμως έχουν φθάσει στον γκρεμό, κάνουν ενέσεις, πουλούν το αίμα τους... Καταστρέφουν και τον εαυτό τους, καταστρέφουν και τους γονείς τους. Και βλέπεις, ο πατέρας να πεθαίνη από εγκεφαλικό, η μητέρα από καρδιά, από συκώτι...'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγάπη μεταξύ των αδελφών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι γονείς πρέπει να καλλιεργούν την αγάπη μεταξύ των παιδιών καί, όταν θέλουν να ενισχύσουν το πιο αδύνατο, να προετοιμάζουν το έδαφος παίρνοντας την συγκατάθεση του δυνατώτερου αδελφού. Να τον βοηθήσουν δηλαδή να καταλάβη ότι πράγματι το άλλο παιδί έχει ανάγκη. Η δικαιοσύνη είναι του Θεού και πρέπει να απονέμεται και στον μεγάλο και στον μικρό εξίσου. Στον μεγάλο με σεβασμό, στον μικρό με αγάπη, χωρίς να βλαφθή. Αυτό το αναφέρει και το Δευτερονόμιο[38]. Αν λ.χ. φταίη ο μεγάλος, θα δικαιώσουμε τον μικρό, χωρίς να θίξουμε τον μεγάλο μπροστά στον μικρό, αλλά θα συζητήσουμε μαζί του ιδιαίτερα, ώστε να του δώσουμε να καταλάβη το σφάλμα του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η ζήλεια που παρουσιάζεται συνήθως στα μεγαλύτερα αδέλφια προς τα μικρότερα πώς αντιμετωπίζεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Η ζήλεια είναι πάθος. Όταν όμως ένα παιδάκι είναι τριών ετών και η μάνα του θηλάζη το νεογέννητο αδελφάκι του, είναι κάπως δικαιολογημένο να το ζηλεύη, γιατί πριν από λίγο καιρό θήλαζε και αυτό. Τώρα βλέπει το αδελφάκι του στην αγκαλιά της μάνας του, και λέει: «Μέχρι χθές η μαμά μου με είχε στην αγκαλιά της, τώρα με έβαλε στην άκρη!». Και αν έχη και γιαγιά, κάτι γίνεται. Όταν όμως γίνη τεσσάρων ετών, πρέπει να ζηλεύη λιγώτερο. Όταν γίνη έξι, πρέπει να του πη η μητέρα του: «Ολόκληρο παιδί είσαι τώρα. Ποιά μητέρα κρατάει στην αγκαλιά της ένα τόσο μεγάλο παιδί;». Αν το βοηθήση να το αντιμετωπίση έτσι, τότε θα θυμάται την μάνα του, μόνον όταν υπάρχη λόγος. Αν θέλη να κρατάη την μάνα του συνέχεια από το φουστάνι, αυτό είναι κάτι αρρωστημένο.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι παρέες πολύ επηρεάζουν τα παιδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς συμβαίνει ένας νέος, ενώ από παιδί ζούσε πνευματικά και είχε φιλότιμο, να φθάση σε σημείο να παραστρατήση τελείως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ας μην κρίνη κανείς. Είναι πολλοί παράγοντες που επιδρούν. Τα παιδιά που ζουν κοσμικά, απρόσεκτα, ελέγχονται, όταν βλέπουν τα άλλα που ζουν αγνά, πνευματικά, και θέλουν να τα παρασύρουν. Μια φορά προχωρούσαν στον δρόμο δυο παιδιά. Το ένα κάποια στιγμή σκόνταψε και έπεσε μέσα σε έναν λάκκο με λασπόνερα και έγιναν τα ρούχα του όλο λάσπες. Μόλις πήγαν παραπέρα, έσπρωξε τον φίλο του και τον έρριξε σε έναν λάκκο, για να λασπωθή, γιατί ένιωθε άσχημα να είναι αυτός λασπωμένος και εκείνος καθαρός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι παρέες πολύ επηρεάζουν τα παιδιά. Εγώ, όταν ήμουν μικρός, είχα μέσα στην φύση μου την αγάπη. Ξεκινούσα να πάω κάπου με τα ζώα και κοίταζα να βάλω και τον έναν επάνω στο ζώο, να βάλω και τον άλλον, να πάρω και τον μικρό αδελφό μου στον ώμο. Μια φορά ο ένας αδελφός μου σκότωσε ένα πουλάκι κι εγώ στενοχωρέθηκα πολύ και τον μάλωσα. Πήρα μετά το πουλάκι και το έθαψα με κλάματα. Εκείνο το διάστημα έκανα παρέα με παιδιά της ηλικίας μου. Πηγαίναμε στο δάσος, προσευχόμασταν, διαβάζαμε Συναξάρια, νηστεύαμε. Μετά οι μητέρες τους άρχισαν να μην τα αφήνουν να έρχωνται μαζί μου. «Μήν κάνετε παρέα μ᾿ αυτόν, τους έλεγαν, θα σάς χτικιάση». Οπότε με άφησαν και ένιωθα μόνος. Με κορόιδευαν κιόλας, «καλόγερο από εδώ, με έλεγαν, καλόγερο από εκεί», μου είχαν κάνει την ζωή μαρτύριο. Έφθασα κάποτε σε σημείο που δεν μπορούσα να αντέξω την κοροϊδία. Τότε είπα κι εγώ: «Θα πάω με τα μεγαλύτερα παιδιά και θα υποκρίνωμαι». Άρχισα λοιπόν να κάνω συντροφιά με μεγαλύτερα παιδιά. Πήρα λάστιχα και έκανα σφενδόνα. Πρώτα έβαζα δήθεν σημάδι μόνο με την σφενδόνα. Ύστερα πήρα σκάγια και είχα γίνει ο καλύτερος σκοπευτής. Μια φορά, μόλις σκότωσα ένα πουλάκι και το είδα σκοτωμένο, συνήλθα. Πέταξα και τα λάστιχα, και τα σκάγια. «Εσύ έκλαιγες, είπα, όταν ο αδελφός σου σκότωσε ένα πουλάκι, και τον μάλωσες, που το σκότωσε, και τώρα που έφθασες; Σκοτώνεις πουλιά και σιγά-σιγά θα φθάσης να σκοτώνης και ζώα». Πράγματι, αν συνέχιζα έτσι, θα προχωρούσα στο κυνήγι ζώων και μετά θα τα έγδερνα κιόλας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Από μία ευαισθησία σε τί κακότητα μπορεί να φθάση κανείς, αν δεν προσέξη και παρασυρθή από κακές παρέες! Ενώ, οι καλές συντροφιές πολύ βοηθούν. Ο Θεός γέμισε τους ανθρώπους με διάφορα χαρίσματα. Ο άνθρωπος, όπως βλέπει την διαστροφή των άλλων, έτσι μπορεί να δη και την αρετή τους και να την μιμηθή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Βοήθεια στα παραστρατημένα παιδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Στο σπίτι είναι απαραίτητο να υπάρχη ατμόσφαιρα αγάπης και ειρήνης. Το παιδί, αν πάρη λίγη αγάπη από το σπίτι, και να ξεφύγη κάποια στιγμή, θα δη ότι δεν βρίσκει αλλού αγάπη, αλλά μόνον υποκρισία, και θα γυρίση πίσω. Αν όμως θυμάται άσχημες σκηνές μέσα στο σπίτι, μαλώματα και αντιδικίες, πώς να του κάνη καρδιά να γυρίση πίσω;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν το παιδί φύγη από το σπίτι, τί πρέπει να κάνουν οι γονείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να προσπαθήσουν να διατηρήσουν μια επαφή μαζί του, ώστε, όταν συνέλθη, να μπορέση να επιστρέψη στο σπίτι. Να του μιλήσουν με το καλό, να το προβληματίσουν, για να το βοηθήσουν. Αν λ.χ. το παιδί ξενυχτάη, να του πη η μητέρα: «Έλα εδώ, παιδάκι μου. Αν ήσουν εσύ στην θέση μου και αργούσαν τα παιδιά σου να γυρίσουν το βράδυ στο σπίτι, θα μπορούσες να μην ανησυχής;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και η πιο σοβαρή πτώση των παιδιών δεν πρέπει να φέρνη σε απόγνωση τους γονείς, γιατί στην εποχή μας η αμαρτία έγινε μόδα. Να έχουν δε πάντοτε υπ᾿ όψιν τους και το εξής: Τα παιδιά της εποχής μας θα έχουν και ελαφρυντικά για τις αταξίες που κάνουν. Το επτά – βαθμός διαγωγής της σημερινής εποχής – έχει την αξία του δέκα, του άριστα, της δικής μας εποχής. Φυσικά οι γονείς θα προσπαθούν να βοηθούν τα παιδιά τους, αλλά να μην ανησυχούν υπερβολικά. Τα παιδιά θα βάλουν μυαλό αργότερα. Τώρα μπορεί να μην καταλαβαίνουν το καλό, γιατί το μυαλό τους δεν ωρίμασε. Είναι θολό και δεν έχουν την διαύγεια να διακρίνουν τον κίνδυνο που διατρέχουν και την ανεπανόρθωτη ζημιά που μπορούν να πάθουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καλό είναι οι γονείς να δείχνουν στο παιδί ότι στενοχωριούνται για τις αταξίες που κάνει, αλλά να μην το πιέζουν και να προσεύχωνται. Η προσευχή που γίνεται με πόνο φέρνει θετικά αποτελέσματα. Αν πάλι το παιδί κάνη κάποιο σφάλμα πολύ σοβαρό, τότε οι γονείς να επέμβουν με τρόπο. Αν δεν είναι σοβαρό, ας το παραβλέψουν λίγο, για να μην ερεθίσουν το παιδί και χειροτερέψουν την κατάστασή του, με αποτέλεσμα να απομακρυνθή από κοντά τους. Μόνο να προσεύχωνται στον Χριστό και στην Παναγία να το προστατεύη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η προσευχή των γονέων, ιδίως της μάνας, επειδή είναι καρδιακή και έχει πόνο, πολύ εισακούεται. Όταν ήμουν στην Σκήτη των Ιβήρων, ήρθε τυχαίως ένας νεαρός και με βρήκε. Γύριζε στην Χαλκιδική, βρήκε μια παρέα με προσκυνητές που έρχονταν στο Άγιον Όρος και ήρθε και αυτός μαζί τους στο Κελλί. Πά-πά, ήταν άθεος, βλάσφημος, αναιδέστατος! Είχε μια δαιμονική εξυπνάδα και δεν πίστευε τίποτε. Τους έβριζε όλους, μικρούς-μεγάλους. Από ᾿δώ-από ᾿κεί τον έφερα, ήρθε σε έναν λογαριασμό· τον κούρεψα κιόλας, γιατί είχε κάτι μακριά μαλλιά!... «Κοίταξε, του λέω, ας είναι καλά η μάνα σου. Οι προσευχές της σε κουβάλησαν εδώ». «Ναί, Πάτερ, μου λέει. Γύριζα στην Χαλκιδική και ούτε κι εγώ δεν κατάλαβα πώς ήρθα εδώ». «Αν το μάθη η μάνα σου που ήρθες στο Άγιον Όρος, του λέω, και σε δη έτσι κουρεμένο, τί χαρά θα κάνη!». «Που το κατάλαβες, Πάτερ; μου λέει. Πράγματι, χαρά που θα κάνη η μάνα μου να με δη έτσι αλλαγμένο!». Ο Θεός τον τύλιξε από ᾿δώ, τον τύλιξε από ᾿κεί και τον πήγε στον ...μάστορα! Πόση προσευχή θα έκανε η καημένη η μάνα του!
- type: h2
  initial:
    ru: ''
  text:
    ru: Το μάλωμα και ο έπαινος του παιδιού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι γονείς πρέπει να προσέχουν πολύ να μη μαλώνουν τα παιδιά τους το βράδυ, γιατί το βράδυ τα παιδιά δεν έχουν με τί να διασκεδάσουν την στενοχώρια τους και η μαυρίλα της νύχτας την μαυρίζει πιο πολύ. Αρχίζουν να σκέφτωνται πώς να αντιδράσουν, ψάχνουν διάφορες λύσεις, μπαίνει στην μέση και ο διάβολος, και μπορεί να φθάσουν στην απελπισία. Την ημέρα, και να πούν τα παιδιά: «θά κάνω αυτό ή εκείνο», θα βγουν έξω, θα ξεχαστούν, οπότε διασκεδάζεται η στενοχώρια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, το ξύλο βοηθάει τα παιδιά να διορθωθούν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όσο γίνεται, οι γονείς να το αποφεύγουν. Να προσπαθούν με το καλό και με υπομονή να δώσουν στο παιδί να καταλάβη ότι αυτό που κάνει δεν είναι σωστό. Μόνον όταν είναι μικρό το παιδί και δεν καταλαβαίνη ότι αυτό που πάει να κάνη είναι επικίνδυνο, βοηθιέται, αν φάη κανένα σκαμπίλι, για να προσέχη άλλη φορά. Ο φόβος, μήπως φάη πάλι σκαμπίλι, γίνεται φρένο και το προστατεύει. Εγώ, όταν ήμουν μικρός, περισσότερο βοηθιόμουν από την μητέρα μου παρά από τον πατέρα μου. Και οι δύο με αγαπούσαν και ήθελαν το καλό μου. Καθένας όμως με βοηθούσε με τον δικό του τρόπο. Ο πατέρας μου ήταν αυστηρός. Όταν κάναμε σαν παιδιά καμμιά αταξία, μας έδινε σκαμπίλια. Εγώ πονούσα λίγο από το ξύλο, μαζευόμουν, όταν όμως περνούσε ο πόνος, ξεχνούσα και τον πόνο και τις συμβουλές του. Όχι ότι δεν με αγαπούσε ο πατέρας μου· από αγάπη με έδερνε. Μια φορά, θυμάμαι – τριών χρονών ήμουν –, που μου έδωσε ο πατέρας μου  ένα σκαμπίλι, με τίναξε πέρα! Τί είχε γίνει; Δίπλα από το σπίτι μας ήταν ένα σπίτι εγκαταλελειμμένο. Οι ιδιοκτήτες είχαν φύγει στην Αμερική και είχε ρημάξει. Στην αυλή είχε μια συκιά που τα κλαδιά της έβγαιναν στον δρόμο. Ήταν καλοκαίρι και ήταν γεμάτη σύκα. Εκεί που έπαιζα με άλλα παιδιά, ήρθε ένας γείτονας και με σήκωσε, για να του κόψω μερικά σύκα, γιατί δεν έφθανε μόνος του να κόψη. Του έκοψα πέντε-έξι και μου έδωσε κι εμένα δύο. Όταν το έμαθε ο πατέρας μου, θύμωσε πάρα πολύ. Μου έδωσε ένα σκαμπίλι!... Εγώ έβαλα τα κλάματα. Η μάνα μου που ήταν μπροστά, γύρισε και του είπε: «Τί το χτυπάς το παιδί; Τί ήξερε αυτό; μικρό παιδί είναι. Πώς μπορείς να το ακούς να κλαίη;». «Άμα έκλαιγε τότε που το σήκωσε ο άλλος, για να κόψη τα σύκα, δεν θα έκλαιγε τώρα, είπε ο πατέρας μου. Αλλά, φαίνεται, ήθελε να φάη και αυτό σύκα. Ας κλαίη λοιπόν τώρα». Που να τολμήσω να το ξανακάνω! Και η μητέρα μου έβλεπε τις αταξίες μου και στενοχωριόταν, αλλά είχε μια αρχοντιά. Όταν έκανα καμμιά αταξία, γύριζε το κεφάλι της από την άλλη μεριά και έκανε πώς δεν με βλέπει, για να μη με στενοχωρήση. Εμένα όμως αυτή η συμπεριφορά της μου ράγιζε την καρδιά. «Κοίταξε, έλεγα μέσα μου, εγώ έκανα τέτοια αταξία και η μητέρα όχι μονάχα δεν με δέρνει, αλλά κάνει και πώς δεν με βλέπει! Άλλη φορά δεν θα το ξανακάνω! Πώς να την ξαναστενοχωρήσω;». Με αυτήν την συμπεριφορά της η μητέρα μου με βοηθούσε περισσότερο, παρά αν μου έδινε σκαμπίλι. Κι εγώ όμως δεν το εκμεταλλευόμουν, να πώ: «Έ, τώρα δεν με βλέπει, ας κάνω μεγαλύτερη αταξία». Ενώ ο πατέρας μου, μόλις έκανα κάτι, τάκ, σκαμπίλι. Βλέπεις, και οι δύο με αγαπούσαν, εκείνο όμως που με διόρθωνε περισσότερο ήταν η αρχοντική συμπεριφορά της μάνας μου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικά παιδιά όμως είναι πολύ άτακτα· φωνάζουν, τρέχουν, κάνουν ζημιές. Πώς να αποφύγουν οι γονείς το ξύλο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, δεν φταίνε τα παιδιά. Τα παιδιά, για να μεγαλώσουν φυσιολογικά, θέλουν αυλή, για να μπορούν να παίξουν. Τώρα τα κακόμοιρα είναι κλεισμένα μέσα στις πολυκατοικίες και ζορίζονται. Δεν μπορούν να τρέξουν ελεύθερα, να παίξουν, να χαρούν. Δεν πρέπει να στενοχωριούνται οι γονείς, όταν το παιδάκι είναι ζωηρό. Ένα ζωηρό παιδί έχει δυνάμεις μέσα του και μπορεί να προκόψη πολύ στην ζωή του, αν τις αξιοποιήση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το ζόρισμα δεν βοηθάει τα παιδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί γονείς κάνουν μεγάλο στρύμωγμα στα παιδιά τους, και μάλιστα μπροστά στους άλλους! Λές και έχουν ένα μουλάρι και το οδηγούν με την βέργα να πάη ίσα μπροστά· έχουν το καπίστρι στο χέρι και του λένε: «Να περπατάς ελεύθερα!». Ύστερα φθάνουν και αυτά στο σημείο να τους δέρνουν. Σήμερα ήρθε μια μάνα με το παιδί της – ένα παλληκάρι μέχρι εκεί επάνω –, που ήταν άρρωστο. «Τί να κάνω, Πάτερ; μου λέει, το παιδί μου δεν τρώει και δεν θέλει ούτε να μας δή». Της είπα τί να κάνη και με ξαναρωτάει: «Τώρα τί να κάνω;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως, Γέροντα, δεν κατάλαβε τί της είπατε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πώς δεν κατάλαβε! «Εγώ ούτε μια ώρα, της είπα, δεν μπορώ να καθήσω μαζί σου, πώς να μείνη το παιδί μαζί σου; το παλάβωσες!». «Όχι, μου λέει, το αγαπάω». «Τί το αγαπάς, αφού δεν αναπαύεται κοντά σου· θέλει να φύγη από το σπίτι, γιατί θέλει να βρίσκεται σε άλλο περιβάλλον. Όταν βρίσκεται μακριά σας, είναι μια χαρά. Για να μη σάς θέλη, φαίνεται φταίτε κι εσείς. Να μην το ερεθίζετε· το σακατεύεις το παιδί έτσι που φέρεσαι. Με το καλό να του φέρεσαι, με υπομονή». Αφού της είπα όλα αυτά, με ξαναρωτάει: «Τί να κάνω; Το παιδί δεν μας θέλει». Πώς να συνεννοηθής έτσι; Να είναι το παιδί μια χαρά και να το βγάζουν χαζό. Αυτό είναι βλάβη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με το ζόρισμα οι γονείς δεν βοηθούν τα παιδιά· τα πνίγουν. Συνέχεια «μή αυτό, μη εκείνο, αυτό κάν᾿ το έτσι...». Πρέπει να τραβούν τα γκέμια τόσο που να μη σπάζουν. Να ελέγχουν με τρόπο τα παιδιά, για να τα φέρνουν σε έναν λογαριασμό, αλλά να μη δημιουργούνται χάσματα μεταξύ τους. Να κάνουν ό,τι κάνει ο καλός κηπουρός, όταν φυτεύη ένα δενδράκι: Το δένει απαλά με ένα σχοινάκι σε έναν πάσσαλο, για να μη στραβώση και να μην τραυματίζεται, όταν το γέρνη ο αέρας λίγο δεξιά-λίγο αριστερά. Το φράζει κιόλας γύρω-γύρω και συγχρόνως το ποτίζει, το φροντίζει, μέχρι να μεγαλώσουν τα κλωνάρια του, για να μην το φάνε τα κατσίκια. Γιατί, αν το κουτσουρέψουν τα κατσίκια, πάει, καταστράφηκε. Ένα κουτσουρεμένο δένδρο ούτε να καρπίση μπορεί ούτε σκιά να κάνη. Όταν μεγαλώσουν τα κλωνάρια του, τότε ο κηπουρός βγάζει τον φράχτη, οπότε και καρπίζει το δένδρο και στην σκιά του μπορούν να φιλοξενούνται και κατσίκια και πρόβατα και άνθρωποι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι γονείς όμως πολλές φορές από υπερβολικό ενδιαφέρον θέλουν να δέσουν το παιδί με σύρμα, ενώ πρέπει να το δένουν απαλά, για να μην το πληγώνουν. Να προσπαθούν να βοηθούν τα παιδιά με τον αρχοντικό τρόπο, ο οποίος καλλιεργεί το φιλότιμο στις ψυχές τους, ώστε να καταλάβουν το καλό ως ανάγκη. Να τους εξηγούν το καλό, όσο μπορούν με καλό τρόπο, με αγάπη και με πόνο. Θυμάμαι μια μητέρα πού, όταν έβλεπε τα παιδάκια να κάνουν καμμιά αταξία, τα μάτια της βούρκωναν από πόνο και έλεγε: «μή, χρυσό μου παιδί». Και με το παράδειγμά της τους μάθαινε να αγωνίζωνται με χαρά, για να αποφεύγουν τους πειρασμούς της ζωής, να μην ταράζωνται εύκολα μπροστά σε μια δυσκολία, αλλά να την αντιμετωπίζουν με προσευχή και με εμπιστοσύνη στον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σήμερα μικροί-μεγάλοι στον κόσμο ζουν σαν σε τρελλοκομείο, γι᾿ αυτό χρειάζεται πολλή υπομονή και πολλή προσευχή. Ένα σωρό παιδιά παθαίνουν εγκεφαλικό. Είναι λίγο χαλασμένο το ρολόι, το κουρντίζουν και οι γονείς λίγο παραπάνω και σπάζει το ελατήριό του. Χρειάζεται διάκριση. Άλλο παιδί θέλει περισσότερο κούρντισμα και άλλο λιγώτερο. Τα καημένα τα παιδιά είναι εκτεθειμένα σε όλα τα ρεύματα. Όταν ακούν έξω στις διάφορες συντροφιές «μή σέβεστε γονείς, μη σέβεστε τίποτε», και οι μητέρες πάνε να τα σφίξουν, τότε αντιδρούν χειρότερα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γι᾿ αυτό λέω στις μητέρες να ζοριστούν στην προσευχή, και όχι να ζορίζουν τα παιδιά. Αν συνέχεια λένε «μή, μή» στο παιδί, ακόμη και για μικροπράγματα, ή καμμιά φορά και άδικα, τότε, όταν πρόκειται για κάτι σοβαρό, όταν πάη λ.χ. το παιδάκι να ρίξη βενζίνη στην φωτιά, δεν ακούει και το κάνει, οπότε μπορεί να πάθη μεγάλη ζημιά. Το παιδί δεν καταλαβαίνει ότι μέσα στο «μή» κρύβεται η αγάπη. Αλλά και όταν μεγαλώση λίγο, μπαίνει ο εγωισμός και αντιδράει, όταν του κάνουν καμμιά παρατήρηση, γιατί λέει: «μικρός είμαι και μου φέρονται έτσι;». Οι γονείς πρέπει να δώσουν στο παιδί να καταλάβη ότι, όπως, όταν ήταν μικρό, το πρόσεχαν να μην καή, έτσι και τώρα που μεγάλωσε, υπάρχει άλλη φωτιά. Γι᾿ αυτό πρέπει να προσέχη, να μη δίνη δικαιώματα στον πειρασμό, για να διατηρήση την Χάρη του Αγίου Βαπτίσματος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αδιάκριτη υπερβολική αγάπη των γονέων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορεί μια μάνα από αδιάκριτη αγάπη να βλάψη το παιδί της;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Και βέβαια μπορεί. Όταν λ.χ. κάποια μάνα βλέπη το παιδάκι να δυσκολεύεται να περπατήση και λέη: «κρίμα το καημένο, δεν μπορεί να περπατήση», και το παίρνη συνέχεια αγκαλιά, αντί να το κρατήση λίγο από το χεράκι, πώς θα μάθη το παιδί να περπατάη μόνο του; Βέβαια από αγάπη κινείται, αλλά του κάνει ζημιά με το πολύ ενδιαφέρον της. Γνώριζα έναν πατέρα που το παιδί του είχε τελειώσει το στρατιωτικό και το έπαιρνε από το χέρι και το πήγαινε στον κουρέα. «Έφερα τον γιό μου να τον κουρέψης. Πόσα θέλεις και πότε θα τελειώσης να έρθω να τον πάρω;». Το είχε σακατέψει το παιδί.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η αγάπη χρειάζεται φρένο με διάκριση. Η πραγματική αγάπη έχει ανιδιοτέλεια, δεν έχει μέσα τον εαυτό μας, και έχει σύνεση. Η σύνεση είναι απαραίτητη στην πολλή αγάπη της γυναίκας, για να μη χαραμίζεται η αγάπη της. Μια φορά ήρθε στο Καλύβι ένα παλληκάρι που ήταν αγανακτισμένο με τους γονείς του. Οι καημένοι είχαν καλή διάθεση, αλλά δεν ήξεραν τον τρόπο να το βοηθήσουν. Μου έλεγε λοιπόν ότι οι γονείς του το καταπιέζουν, ότι δεν το αγαπούν κ.λπ. «Κοίταξε, του λέω, όταν ήσουν μικρός και σού έβαζε η μάνα σου ένα σωρό ρούχα, γιατί το έκανε; Για να μην κρυώσης ή για να σε σκάση; Αυτό είχε πολλή αγάπη μέσα». Όταν τελικά κατάλαβε πόσο το αγαπούσαν οι γονείς του, έβαλε τα κλάματα. Είχε πολλή αγάπη η μάνα του, άσχετα αν δεν τον βοήθησε εκείνον, γιατί με τον τρόπο που του φερόταν του προκαλούσε αντιδράσεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η μάνα, όταν χρειάζεται, πρέπει να φερθή αυστηρά προς το παιδί. Δεν το βοηθάει, όταν εύκολα παίρνη το μέρος του, δήθεν για να μη στενοχωριέται. Στα Άδανα͵ μια χήρα γυναίκα είχε ένα μονάκριβο παιδί – Γιάννη το έλεγαν. Όταν μεγάλωσε λίγο, το πήγε σε έναν μάστορα να μάθη τσαγκάρης. Κάθησε μια εβδομάδα ο μικρός στην δουλειά και μετά είπε στην μητέρα του: «Μάνα, δεν χρειάζεται να πάω άλλο στην δουλειά· έμαθα την τέχνη». «Πότε την έμαθες κιόλας;», τον ρωτάει εκείνη. «Αν θέλης, να σού δείξω κι εσένα πώς φτιάχνουν παπούτσια, της λέει. Νά, έτσι κόβουν την σόλα, έτσι βάζουν το δέρμα, το τακούνι, έτσι τα καρφώνουν...». Το αφεντικό του ήταν πολύ καλό και ήθελε να μάθη στον Γιάννη την τέχνη, γιατί ήταν ορφανός. Όταν είδε πώς πέρασε μια εβδομάδα και ο Γιάννης δεν φάνηκε, ανησύχησε μήπως αρρώστησε βαριά και πήγε στην μάνα του να ρωτήση τί κάνει το παιδί. «Τί έπαθε ο Γιάννης και δεν ξαναήρθε στην δουλειά; άρρωστος είναι;», ρωτάει την μάνα του. «Όχι, του απαντά εκείνη, καλά είναι». «Τότε γιατί δεν ήρθε στην δουλειά;». «Έ, τί να κάνη να έρθη; του λέει εκείνη· ο Γιάννης έμαθε πια την τέχνη». «Μά πώς την έμαθε μέσα σε τόσο λίγες μέρες;», την ρωτάει το αφεντικό. «Νά, του λέει η μάνα, παίρνει το δέρμα, το βάζει σε ένα καλούπι, το καρφώνει, βάζει και το τακούνι και μετά το βγάζει, και αυτό είναι!». Γέλασε το αφεντικό, την χαιρέτησε και έφυγε. Όταν γύρισε στο μαγαζί, τον ρώτησαν τα άλλα μαστορόπουλα: «Μάστορα, τί κάνει ο Γιάννης;». «Μια χαρά είναι, τους είπε εκείνος. Δεν έμαθε μόνον ο Γιάννης τσαγκάρης, αλλά έμαθε και η μάνα του!»...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτήν την συμπεριφορά την βλέπω σε πολλούς γονείς. Νομίζουν ότι αγαπούν τα παιδιά τους, αλλά με τον τρόπο που φέρονται τα καταστρέφουν. Όταν μια μάνα, ας υποθέσουμε, από την υπερβολική αγάπη της, φιλάη το παιδί και λέη «δέν υπάρχει στον κόσμο τέτοιο παιδί σαν το δικό μου», τότε του καλλιεργεί την υπερηφάνεια και την αρρωστημένη αυτοπεποίθηση. Ύστερα το παιδί δεν υπακούει στους γονείς, επειδή πιστεύει ότι τα ξέρει όλα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Οι γονείς πρέπει να βοηθούν από την μικρή ηλικία τα παιδιά να μάθουν να αναλαμβάνουν την ευθύνη του εαυτού τους. Να κάνουν μέσα στην οικογένεια κάποια δουλειά που μπορούν· να μην τα θέλουν όλα έτοιμα. Διαφορετικά, θα δυσκολευτούν, όταν μεγαλώσουν. Ένας μάστορας δούλεψε σκληρά και μεγάλωσε τα παιδιά του. Εκείνα όλη την ημέρα γύριζαν στο μεσοχώρι. Παντρεύτηκαν και τα περίμεναν όλα από τον πατέρα τους. Όταν ο πατέρας τους είπε πώς είναι καιρός και αυτά να κοιτάξουν μόνα τους τα σπίτια τους, του είπαν: «Καλά, πατέρα, εσύ δεν μας άφησες, όταν ήμασταν μικρά, τώρα που μεγαλώσαμε και έχουμε υποχρεώσεις θα μας αφήσης;»!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η διανομή της περιουσίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι γονείς που έχουν την οικονομική δυνατότητα, έχουν ευθύνη να φροντίσουν για το μέλλον των παιδιών τους. Φυσικά, το κυριώτερο είναι να τους δώσουν καλή ανατροφή, μετά να τα μορφώσουν ή να τα στείλουν να μάθουν κάποια τέχνη, για να μπορούν να ζήσουν, και ύστερα να τους εξασφαλίσουν ένα σπιτάκι κ.λπ. Όταν το 1924 η οικογένειά μας ήρθε στην Ελλάδα από τα Φάρασα της Καππαδοκίας, τότε με την Ανταλλαγή, ο πατέρας μου, ως πρόεδρος του χωριού, φρόντισε να τακτοποιήση όλους τους συγχωριανούς μας. Την οικογένειά μας την άφησε τελευταία. Αργότερα τα μεγαλύτερα αδέλφια μου του παραπονέθηκαν. «Όλους τους φρόντισες, πατέρα, είπαν, εμάς δεν μας σκέφτηκες». Αν είναι κανείς μόνος του, μπορεί όλα να τα δώση και να αδιαφορήση για τον εαυτό του από αυταπάρνηση, από αρχοντιά, αλλά, αν έχη οικογένεια, πρέπει να σκεφθή και την οικογένειά του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βέβαια, οι γονείς δεν πρέπει να ξεθαρρεύουν και να δίνουν στα παιδιά όσα έχουν, όλα μαζί, γιατί τα παιδιά είναι άπειρα και μπορεί να ξανοιχτούν στην σύγχρονη ζωή που δεν έχει άκρη. Ύστερα θα πονούν, που δεν θα έχουν να τα βοηθήσουν. Να προσέξουν επίσης, ώστε το πιο αδύνατο παιδί να το ενισχύσουν περισσότερο υλικά, και ακόμη περισσότερο ηθικά, για να μην το πάρη σβάρνα ο πανικός της αποτυχίας, αλλά και με διάκριση και αγάπη να τακτοποιήσουν όλα τα παιδιά, για να μην ψυχρανθούν μεταξύ τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Σπάνια βρίσκεις οικογένειες αγαπημένες, που ζουν πνευματικά, και τα αδέλφια δεν μαλώνουν για οικόπεδα και περιουσίες και δεν τρέχουν στα δικαστήρια. Είχα γνωρίσει μια επταμελή οικογένεια. Οι γονείς  είχαν κάτι χρυσαφικά. Μετά τον θάνατό τους, τα παιδιά είπαν να τα πάρη ο ένας αδελφός που τους είχε γηροκομήσει. Εκείνος όμως σκέφθηκε ότι η αδελφή τους έχει μεγάλη οικογένεια και έχει πιο πολλή ανάγκη και τα έδωσε σ᾿ εκείνη. Αυτή τα έδωσε στον άλλον αδελφό, εκείνος στον άλλον, και τελικά γύρισαν στον πρώτο! Ό,τι ακριβώς έκαναν εκείνοι οι Πατέρες που διαβάζουμε στο Γεροντικό[39]. Στο τέλος, επειδή και εκείνος δεν ήθελε να τα κρατήση, τα έδωσαν σε μια εκκλησία.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τριτο Μέρος – Τα Παιδια Και Οι Υποχρεωσεισ Τουσ
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Η ευχή των γονέων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: είναι η μεγαλύτερη κληρονομιά για τα παιδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό να φροντίζουν να έχουν την ευχή τους».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – Τα παιδιά, οι χαρές και οι δυσκολίες τους
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα μικρά παιδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχω παρατηρήσει, Γέροντα, ότι τα μωρά μερικές φορές την ώρα της Θείας Λειτουργίας χαμογελούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό δεν το κάνουν μόνο στην Θεία Λειτουργία. Τα μωρά είναι σε συνεχή επαφή με τον Θεό, επειδή δεν έχουν μέριμνες. Τί είπε ο Χριστός για τα μικρά παιδιά; «Οι Άγγελοι αυτών εν ουρανοίς δια παντός βλέπουσι το πρόσωπον του Πατρός μου του εν ουρανοίς»[40]. Έχουν επικοινωνία και με τον Θεό και με τον Φύλακα Άγγελό τους, που είναι συνέχεια δίπλα τους. Στον ύπνο τους πότε γελούν, πότε κλαίνε, γιατί βλέπουν διάφορα. Άλλοτε βλέπουν τον Φύλακα Άγγελό τους και παίζουν μαζί του – τα χαϊδεύει, τα πειράζει, κουνάει τα χεράκια τους, και αυτά γελούν -, άλλοτε πάλι βλέπουν καμμιά σκηνή του πειρασμού και κλαίνε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο πειρασμός γιατί πηγαίνει στα νήπια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και αυτό τα βοηθάει, για να αισθάνωνται την ανάγκη να ζητούν την μάνα τους. Αν δεν υπήρχε αυτός ο φόβος, δεν θα αναγκάζονταν να αναζητήσουν την αγκαλιά της μάνας τους. Όλα τα επιτρέπει ο Θεός για το καλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά που βλέπουν, όταν είναι μικρά, τα θυμούνται, όταν μεγαλώσουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, τα ξεχνούν. Αν θυμόταν το παιδάκι πόσες φορές είδε τον Άγγελό του, θα έπεφτε στην υπερηφάνεια. Γι᾿ αυτό, όταν μεγαλώση, τα ξεχνάει. Ο Θεός με σοφία εργάζεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μετά το Βάπτισμα τα βλέπουν αυτά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φυσικά, μετά το Βάπτισμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένα αβάπτιστο παιδάκι κάνει να προσκυνήση άγια Λείψανα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί να μην κάνη; Μπορεί και να το σταυρώση κανείς με τα άγια Λείψανα. Είδα σήμερα ένα παιδάκι, σαν αγγελουδάκι ήταν. «Που είναι τα φτερά σου;», το ρώτησα. Δεν ήξερε να μου πή!... Στο Καλύβι, όταν έρχεται η άνοιξη και ανθίζουν τα δένδρα, βάζω καραμέλες πάνω στα πουρνάρια, που είναι κοντά στην πόρτα του φράχτη, και λέω στα μικρά παιδιά που έρχονται εκεί: «Πηγαίνετε, παιδιά, να κόψετε καραμέλες από τα πουρνάρια, γιατί, αν πιάση βροχή, θα λειώσουν και θα πάνε χαμένες!». Μερικά έξυπνα παιδάκια καταλαβαίνουν ότι τις έβαλα εγώ και γελούν, άλλα πιστεύουν ότι φύτρωσαν, άλλα προβληματίζονται. Τα μικρά θέλουν και λίγο λιακάδα...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βάζετε πολλές καραμέλες, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, πώς! Τί να κάνω; Εγώ καλά γλυκά δεν δίνω στους μεγάλους· λουκούμια τους δίνω. Όταν μου φέρνουν καλά γλυκά, τα κρατώ για τα παιδιά της Σχολής[41]. Νά, κι εδώ χθές βράδυ φύτεψα καραμέλες και σοκολατάκια και σήμερα... άνθισαν͵! Τα είδατε; Ο καιρός ήταν καλός, το χώμα ήταν αφράτο, γιατί το είχατε σκάψει καλά, και αμέσως άνθισαν[42]! Να δήτε τί ανθόκηπο θα σάς κάνω εγώ! Δεν θα χρειάζεται να αγοράζουμε καραμέλες και σοκολατάκια για τα παιδιά. Τί; να μην έχουμε δική μας παραγωγή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάποιοι προσκυνητές είδαν τα σοκολατάκια που φυτέψατε στον κήπο, επειδή το χαρτάκι τους έβγαινε πάνω από το χώμα. Παραξενεύτηκαν. «Κάποιο παιδάκι, είπαν, θα τα έβαλε».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν τους είπες ότι τα έβαλε ένα μεγάλο παιδί;
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο Φύλακας Άγγελος προστατεύει τα παιδάκια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ο Θεός δίνει στον κάθε άνθρωπο έναν Φύλακα Άγγελο, αφού μπορεί ο ίδιος να μας προστατεύση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό είναι ξεχωριστή φροντίδα του Θεού για το πλάσμα Του. Ο Φύλακας Άγγελος είναι οικονομία Θεού. Είμαστε χρεώστες γι᾿ αυτό. Οι Άγγελοι ιδιαίτερα προστατεύουν τα μικρά παιδιά. Πώς τα φυλάνε! Μια φορά δυο παιδιά έπαιζαν έξω στον δρόμο. Το ένα από τα δύο σημάδευε το άλλο στο κεφάλι, για να το χτυπήση με μια πέτρα. Εκείνο δεν το έβλεπε. Την τελευταία στιγμή, φαίνεται, ο Άγγελός του το έκανε να δη κάτι, τινάχτηκε πέρα και γλίτωσε. Μια μάνα πάλι είχε πάρει στο χωράφι και το μωρό της. Το θήλασε, το έβαλε στην κούνια και πήγε να δουλέψη. Μετά από λίγο, όταν πήγε κοντά του, τί να δή! Το παιδάκι κρατούσε ένα φίδι και το έβλεπε! Όπως το είχε θηλάσει, είχε μείνει γάλα γύρω από το στοματάκι του. Πήγε λοιπόν το φίδι και έγλειφε το γάλα με την γλώσσα του και το παιδάκι το έπιασε με το χέρι του. Βάζει τις φωνές η μάνα, τρόμαξε το παιδί, άνοιξε το χεράκι του και έφυγε το φίδι! Φυλάει ο Θεός τα παιδιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τότε πώς πολλά παιδάκια υποφέρουν από αρρώστιες κ.λπ.;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο Θεός ξέρει τί θα ωφελήση τον καθέναν και δίνει ανάλογα. Δεν δίνει στον άνθρωπο κάτι που δεν θα τον ωφελήση. Βλέπει λ.χ. ότι περισσότερο θα μας ωφελήση, αν μας δώση ένα κουσούρι, μια αναπηρία, παρά αν μας προστατεύση να μη χτυπήσουμε ή να μη μείνουμε ανάπηροι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το Βάπτισμα
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι Βορειοηπειρώτες, όταν πεθάνουν, τί θα γίνουν που δεν είναι βαπτισμένοι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, οι περισσότεροι έχουν από τους γονείς τους αεροβάπτισμα. Υπάρχουν και νοσοκόμες που αεροβαπτίζουν τα παιδάκια. Μια νοσοκόμα βάπτισε ένα παιδάκι μέσα σε μια λεκάνη με νερό. Σού λέει αυτό είναι πιο καλό από το αεροβάπτισμα· αλλά ο Θεός είδε την διάθεσή της... Πόση χάρη έχουν οι νεοφώτιστοι! Μια φορά είχα γνωρίσει ανάμεσα σε τριακόσια πενήντα άτομα μια γυναίκα που ήταν βαπτισμένη. Ρώτησα «ποιά είναι αυτή;», και μου είπαν ότι ήταν μια Τουρκάλα που είχε βαπτισθή. Έλαμπε το πρόσωπό της. Μπροστά της οι άλλοι φαίνονταν βάρβαροι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι σωστό στο Βάπτισμα να δίνωνται δύο ονόματα στα παιδιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είναι να μαλώνουν τα ανδρόγυνα και να χωρίζουν, ας δώσουν και τρία! Αν και τα σωστά ονόματα σήμερα τα έχουν κάνει!... Βίκυ, Πέπη, Μιμή...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια μητέρα έχασε το παιδάκι της στον πέμπτο μήνα της κυοφορίας και στενοχωριέται, γιατί γεννήθηκε νεκρό και ούτε αεροβάπτισμα δεν μπόρεσαν να κάνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αφού δεν έφταιγε η ίδια, ας έχη εμπιστοσύνη στο έλεος του Θεού. Έχει ο Θεός λογαριασμό για όλα αυτά τα παιδάκια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Η μητέρα μου, Γέροντα, μου είπε ότι το αδελφάκι μου πέθανε λίγες ώρες μετά την γέννησή του και δεν πρόλαβε να το βαπτίση. Της είπα να το πη στον Πνευματικό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αφού ήθελε να το βαπτίση, αλλά δεν πρόλαβε, έχει ελαφρυντικά. Εδώ άλλες κάνουν εκτρώσεις και σκοτώνουν τα παιδιά τους. Την κρίση του Θεού δεν την ξέρουμε. Βαρύ αμάρτημα θα ήταν, αν από αμέλεια δεν βάπτιζε το παιδί και πέθαινε αβάπτιστο. Εσύ αντιμετώπισες το θέμα με την λογική. Αυτή είναι η θεολογία του ορθολογισμού. Είπα κάποτε σε μια συντροφιά ότι ένα παιδάκι στην Βόρειο Ήπειρο το είχαν βαπτίσει τρεις φορές. Μία φορά η γιαγιά, μία ο παππούς και μία η μάνα, κρυφά ο ένας από τον άλλον, γιατί ο καθένας το θεωρούσε αβάπτιστο. Πετιέται τότε κάποιος και λέει: «Αυτό είναι αντικανονικό». «Βρέ, του λέω, δογματικά βάφτισαν το παιδί τρεις φορές; Τρείς φορές ευλογήθηκε αυτό το παιδί!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο Θεός οικονομάει να βλέπουν στον ύπνο τους οι άνθρωποι κεκοιμημένους συγγενείς τους και να συνομιλούν μαζί τους, για να βοηθηθούν στην πίστη, στην μετάνοια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, δεν σάς έχω πει κι εγώ κάποιο περιστατικό; Ένας μοναχός στο Άγιον Όρος ήταν από ένα χωριό που βρισκόταν στο βουλγαρικό έδαφος και υπήρχαν εκεί πολλοί αβάπτιστοι. Μου είπε λοιπόν ότι, όταν ήταν λαϊκός και ήταν ακόμη αβάπτιστος, είδε στον ύπνο του το ανηψάκι του, που είχε πεθάνει πριν από λίγο καιρό, να είναι έξω από ένα πολύ όμορφο περιβόλι και να κλαίη. Μέσα στο περιβόλι ήταν πολλά παιδάκια που έπαιζαν χαρούμενα. «Γιατί δεν πάς κι εσύ μέσα;», το ρώτησε. «Πώς να πάω μέσα; Εγώ είμαι αβάπτιστο», απάντησε εκείνο. Μετά από αυτό πήγε αμέσως και βαπτίσθηκε ο ίδιος και ύστερα διηγήθηκε στον παπά το όνειρο που είδε. Έτσι οικονόμησε ο Θεός, για να καταλάβουν και οι άλλοι τί αξία έχει το Βάπτισμα. Έπειτα άρχισαν να βαπτίζουν τα παιδιά τους σ᾿ εκείνο το χωριό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, υπάρχουν γονείς που έκαναν πολιτικό γάμο, αλλά θέλουν να βαπτίσουν τα παιδιά τους. Επιτρέπεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί να μην επιτρέπεται; Άλλωστε τί φταίνε τα καημένα τα παιδάκια; Το ότι θέλουν να βαπτίσουν τα παιδιά τους δείχνει πώς κάτι έχουν μέσα τους· δεν είναι τελείως αδιάφοροι. Φαίνεται, κάπου θα μπερδεύτηκαν. Αν θέλη κανείς να τους βοηθήση, πρώτα πρέπει να δη για ποιό λόγο δεν έκαναν θρησκευτικό γάμο και ύστερα για ποιό λόγο θέλουν να βαπτίσουν τα παιδιά τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια μοναχή που είχε βαπτίσει κάποιο παιδάκι, όταν ήταν στον κόσμο, εκτός από την προσευχή που θα κάνη γι᾿ αυτό, πρέπει να του στέλνη δώρα, όπως συνηθίζεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, τώρα η μοναχή είναι απαλλαγμένη απ᾿ αυτά. Οι γονείς της μοναχής, αν θέλουν, μπορούν κάτι να κάνουν. Ο μοναχός με την προσευχή θα βοηθήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, αν το σκεφθούν οι γονείς μόνοι τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, να μην τους υποχρεώση η μοναχή. Να κάνη προσευχή να τους φωτίση ο Θεός. Πάντως ο νουνός έχει μεγάλη ευθύνη. Οι γονείς μου είχαν υποσχεθή σε μια φιλική μας οικογένεια ότι ένα παιδάκι τους θα το βάφτιζε κάποιος από την οικογένειά μας. Όταν ήρθε εκείνη η ώρα, έλειπαν όλοι οι δικοί μου και μου είπαν να το βαπτίσω εγώ. Ήμουν τότε δεκαέξι χρονών και δεν ήθελα να το βαπτίσω, γιατί αισθανόμουν την ευθύνη που θα αναλάμβανα. Βρέθηκα σε δύσκολη θέση. Έκανα λοιπόν προσευχή. «Θεέ μου, είπα, αν είναι να γίνη καλός άνθρωπος, πάρε από εμένα όλα τα χρόνια και δώσ᾿ τα σ᾿ αυτό. Αν όμως είναι να γίνη κακός, πάρ᾿ το τώρα που είναι αγγελούδι». Το βάφτισα και το ονόμασα Παύλο. Σε μία εβδομάδα πέθανε. Στον Ουρανό τώρα είναι ασφαλισμένο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα ορφανά παιδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τα παιδάκια, αν πεθάνη ο πατέρας τους, πρέπει να τον δούν νεκρό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλύτερα να μην τον δούν. Εδώ σε έναν μεγάλο προσπαθείς με τρόπο να πής για τον θάνατο κάποιου δικού του, πόσο μάλλον σε παιδιά!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μέχρι ποιά ηλικία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ανάλογα και με το τί παιδί είναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στον τάφο του να τα πηγαίνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Στον τάφο, ναί, ας τα πηγαίνουν. Να τους πούν: «Ο πατέρας πήγε από ᾿δώ στον Ουρανό. Αν είσαστε φρόνιμα, θα έρχεται από τον Ουρανό να σάς βλέπη». Θυμάμαι, όταν πέθανε η γιαγιά μου, με είχαν πάει σε ένα φιλικό μας σπίτι, για να μη δώ την κηδεία και να μην ξέρω ότι πέθανε. Μου έκαναν εκεί παιχνίδια, με διασκέδαζαν. Εγώ γελούσα και εκείνοι έκλαιγαν. Όταν γύρισα, ρωτούσα: «Που είναι η γιαγιά;». «Θα έρθη», μου έλεγαν. Περίμενα την γιαγιά... Και μετά από καιρό έμαθα ότι πέθανε. Δεν βοηθάει τα παιδιά να δούν νεκρά τα αγαπημένα τους πρόσωπα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τα μικρά παιδιά, όταν πεθάνη η μητέρα τους, είναι πολύ πονεμένα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τα παιδιά ορφανεύουν πιο πολύ από μάνα, όχι από πατέρα, γι᾿ αυτό και πονάνε πιο πολύ – σπάνια συμβαίνει να χάσουν την μάνα τους και να είναι μετά ο πατέρας τους σαν μάνα. Στον Παράδεισο όμως θα παρηγορηθούν. Έχουν να λάβουν εκεί. Ένα ορφανό θα μπή με λιγώτερες μονάδες στον Παράδεισο, όπως οι Ομογενείς από το εξωτερικό μπαίνουν στο πανεπιστήμιο χωρίς εξετάσεις[43], γιατί τους πιάνει κάποιος νόμος. Τα ορφανά δηλαδή τα πιάνει ο νόμος του Θεού και με λιγώτερο κόπο θα μπούν στον Παράδεισο, ενώ οι άλλοι χρειάζεται να αγωνισθούν πολύ. Εγώ μακαρίζω τα παιδιά που στερήθηκαν την μεγάλη στοργή των γονέων τους, γιατί κατόρθωσαν να κάνουν Πατέρα τους τον Θεό από τούτη την ζωή και έχουν αποταμιεύσει παράλληλα στο Ταμιευτήριο του Θεού και την στοργή των γονέων τους που στερήθηκαν, η οποία τοκίζεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αλλά και σ᾿ αυτήν την ζωή ο Καλός Θεός θα τα βοηθήση, γιατί, από την στιγμή που παίρνει τους γονείς, είναι κατά κάποιον τρόπο υποχρεωμένος να τα προστατεύη. Τί λέει ο Δαβίδ; «Ορφανόν και χήραν αναλήψεται»[44]. Τα αγαπάει ο Θεός φυσιολογικά πιο πολύ και τα έχει μεγαλύτερη έγνοια. Σ᾿ αυτά τα παιδιά δίνει περισσότερα δικαιώματα σ᾿ αυτήν την ζωή από ό,τι στα άλλα παιδιά. Αν το ορφανό γυρίση το κουμπί στην καλωσύνη, προοδεύει πολύ. Ενώ, αν πή: «εγώ ταλαιπωρήθηκα, οπότε τώρα κι εγώ θα ταλαιπωρήσω άλλους», καταστρέφεται.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η ορφάνια έχει δυσάρεστες επιπτώσεις σε όλη την ζωή του ανθρώπου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί είναι αυτά που λές; Μπορεί τα ορφανά να είναι λίγο συνεσταλμένα, να έχουν ένα μάζεμα, μια δειλία – δεν έχουν εκείνη την χαρά, την ζωηράδα που έχουν όσα παιδιά είναι χορτάτα από στοργή –, αλλά αυτή η συστολή είναι ένα φρένο που τα βοηθάει σ᾿ αυτήν την ζωή και συγχρόνως αποταμιεύουν και στην άλλη. Γιατί αυτό το μάζεμα νομίζεις ότι δεν το βλέπει ο Θεός; Δεν θα τα βολέψη μετά; Γι᾿ αυτό, το ορφανό, ιδίως από μάνα, πρέπει να το αγκαλιάσουμε με πόνο και με θερμή αγάπη, για να ζεσταθή πρώτα, να ξεθαρρέψη, ώστε να ανοίξη την καρδιά του. Καί, όταν έχη φιλότιμο, πρέπει να βάλουμε φρένο γερό στον μεγάλο του ενθουσιασμό, για να μην πάθη υπερκόπωση, προσπαθώντας να εκδηλώση την μεγάλη του ευγνωμοσύνη. Ο Άγιος Αρσένιος ο Καππαδόκης μεγάλωσε ορφανός και από μάνα και από πατέρα. Αν δεν το αντιμετώπιζε πνευματικά, με λεβεντιά, θα έπρεπε να είναι βασανισμένος, να είχε ψυχολογικά προβλήματα. Βλέπεις όμως τί παλληκαριά είχε! Τί αγώνες έκανε! Και αυτό που μου κάνει εντύπωση είναι ότι και τα κόκκαλά του ήταν σαν βαμβάκι, σαν σφουγγάρι. Στην εκταφή, όταν έβγαλα τα λείψανά του, τα πλευρά του και οι σπόνδυλοι, μόλις τα χάραζα λίγο, έσπαζαν. Μόνο δύο σπόνδυλοι, η λεκάνη και η κνήμη, ήταν κάπως γερά. Τόσο ασθενικός που ήταν, πώς έκανε τόσες οδοιπορίες; Βάδιζε σαν να πετούσε! Εδώ βλέπει κανείς την υπερφυσική δύναμη που του έδινε ο Θεός. Στο μεγάλωμα των ορφανών θα σκαλώση ο Χριστός;
- type: h2
  initial:
    ru: ''
  text:
    ru: Αναγκαίος ο περιορισμός των παιδιών ώς την ενηλικίωσή τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Τα παιδιά πρέπει πάντα να αισθάνωνται ως ανάγκη μεγάλη τις συμβουλές, ειδικά στην κρίσιμη ηλικία της εφηβείας, για να μη γλιστρήσουν στον γλυκό κατήφορο της κοσμικής κατηφόρας, που γεμίζει την ψυχή από άγχος και την απομακρύνει αιώνια από τον Θεό. Πρέπει να μπούν στο νόημα της υπακοής. Να καταλάβουν ότι στην υπακοή προς τους γονείς κρύβεται το δικό τους συμφέρον, ώστε να υπακούουν με χαρά και να κινούνται ελεύθερα στον πνευματικό χώρο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπετε, πώς περιορίζουμε την ελευθερία του μικρού παιδιού; Το έμβρυο είναι περιορισμένο εννιά μήνες στην κοιλιά της μάνας του. Το νεογέννητο το βάζουν σε κούνια. Έπειτα από πέντε-έξι μήνες του βάζουν και κάγκελα. Αργότερα δεν το αφήνουν μόνο του έξω, για να μη χτυπήση, να μην γκρεμισθή από καμμιά σκάλα. Αν το αφήσουν ελεύθερο, θα πέση και θα σκοτωθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όλα αυτά είναι απαραίτητα, για να μεγαλώση το παιδί με ασφάλεια. Φαίνεται ότι του στερούν την ελευθερία, αλλά δίχως αυτά τα μέτρα θα κινδύνευε να σκοτωθή από την πρώτη στιγμή. Τα παιδιά όμως δεν καταλαβαίνουν, ούτε όταν είναι μικρά, ότι χρειάζονται περιορισμό, αλλά ούτε όταν μεγαλώσουν, ότι χρειάζονται άλλου είδους περιορισμό, γι᾿ αυτό ζητούν ελευθερία. Τί ελευθερία είναι αυτή; Ελευθερία, για να κουτσουρευτούν; Με την ελευθερία αυτή φθάνουν στην καταστροφή. Πρέπει να καταλάβουν ότι, μέχρι να τελειώσουν τις σπουδές τους, να πάρουν το πτυχίο τους, να ωριμάσουν, για να γίνουν σωστοί άνθρωποι, χρειάζεται κάποιος περιορισμός. Γιατί, άμα κουτσουρευτούν μια φορά, θα καταστραφούν. Πρέπει να αισθανθούν τον περιορισμό ως ανάγκη, ως ευλογία Θεού. Να ευγνωμονούν τους γονείς τους που τους περιορίζουν. Να ξέρουν πώς, ό,τι κάνουν οι γονείς, το κάνουν από αγάπη. Κανένας πατέρας, καμμιά μητέρα, δεν περιόρισαν το παιδί τους από κακότητα, έστω και αν του φέρθηκαν βάρβαρα. Και αν οι γονείς σφίξουν λίγο παραπάνω τα παιδιά, και σ᾿ αυτό μέσα κρύβεται η πολλή τους αγάπη. Από καλή διάθεση το κάνουν, για να είναι πιο συμμαζεμένα και να μην εκτίθενται σε κινδύνους. Μπορεί και ένας κηπουρός να σφίξη το δενδράκι που φυτεύει με σύρμα για περισσότερη σιγουριά και να το πληγώση λίγο, αλλά ο καλός Θεός, όταν πληγώνεται ο φλοιός του δένδρου, κλείνει σε λίγο την πληγή. Και αν την πληγή του δένδρου κλείνη ο Θεός, πόσο μάλλον θα φροντίση για το πλάσμα Του! Αν δηλαδή οι γονείς έσφιξαν το παιδί λιγάκι παραπάνω και λίγο πληγώθηκε, δεν θα το θεραπεύση ο Θεός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και τα παιδιά πρέπει να συζητούν με τους γονείς τους, να τους λένε τους λογισμούς τους. Όπως ο μοναχός στο μοναστήρι έχει τον Γέροντά του, στον οποίο λέει τους λογισμούς του και βοηθιέται, έτσι και το παιδί πρέπει να έχη μια αναφορά στους γονείς. Κανονικά το παιδί πρέπει να εξομολογήται πρώτα στην μητέρα και μετά στον Πνευματικό. Γιατί, όπως όταν χτυπήση το παιδί το πόδι του, οι γονείς πηγαίνουν μαζί του στον γιατρό και ρωτούν τί πρέπει να κάνουν, για να θεραπευθή το πόδι, έτσι πρέπει να ξέρουν και τί προβλήματα έχει το παιδί, για να το βοηθήσουν. Αν το παιδί λέη τα προβλήματά του μόνο στον Πνευματικό, πώς μπορούν οι γονείς να το βοηθήσουν, αφού δεν ξέρουν τί το απασχολεί;
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι δυσκολίες των παιδιών στις σπουδές τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παιδιά που έχουν κρίση και εξυπνάδα, έχουν μερικές φορές προβλήματα και βασανίζονται. Θέλουν να τα τακτοποιήσουν όλα με το μυαλό τους και ζητούν να κάνουν πράγματα πάνω από τις δυνάμεις τους. Έχουν δυνατό μυαλό, αλλά δεν ξέρουν να βάζουν φρένο. Κάνουν πειράματα με τον εαυτό τους, λές και θέλουν να δούν πόσο αντέχουν, και ταλαιπωρούνται. Αν ταπεινωθούν, η κρίση τους τα βοηθάει να προκόψουν. Παιδιά που δεν έχουν τέτοια κρίση και εξυπνάδα, δεν έχουν και προβλήματα, αλλά ούτε προβληματίζονται με την καλή έννοια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσοι φοιτητές, ενώ έχουν διαβάσει και ξέρουν τα μαθήματα, φοβούνται ότι δεν θα γράψουν καλά και δεν πάνε να δώσουν εξετάσεις! Ενώ τα καταφέρνουν, δημιουργούν μόνοι τους από δειλία μία κατάσταση πανικού. Αν όμως πούν ταπεινά: «ευχηθήτε να πάω καλά, γιατί μόνος μου δεν θα τα καταφέρω, αλλά με την ευχή σας θα προσπαθήσω», τότε με την ταπείνωση θα δεχθούν και την Χάρη του Θεού και τον θείο φωτισμό. Ύστερα, πριν αρχίσουν να γράφουν στις εξετάσεις, ας προσευχηθούν στον προστάτη τους Άγιο, και εκείνος θα τους βοηθήση ανάλογα με την πίστη και την ευλάβεια που έχουν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μου έγραψε μια κοπέλα που σπουδάζει στο εξωτερικό: «Έχω τον λογισμό πώς ποτέ δεν θα μπορέσω να προχωρήσω περισσότερο πνευματικά».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά, η ευλογημένη ψυχή από την Ευρώπη βγάζει αυτό το συμπέρασμα; Εκεί δεν πήγε για να προχωρήση πνευματικά ούτε για να κοινοβιάση, αλλά για να πάρη αυτά που της χρειάζονται για την επιστήμη της. Ας προσπαθή να διατηρή αυτήν την πνευματική κατάσταση που έχει και να μη ζητά εκεί πνευματική πρόοδο. Άλλωστε και οι Ευρωπαίοι στις επιστήμες είναι προοδευμένοι και όχι στα πνευματικά. Να μην πιέζη τον εαυτό της περισσότερο από όσο αντέχει και να μην τα παίρνη κατάκαρδα. Δεν αξίζει ο κόπος να δίνη κανείς την καρδιά του και να υποφέρη γι᾿ αυτά. Ας το θεωρήση σαν μια στρατιωτική θητεία. Στον στρατό υπομένει κανείς πολύ κόπο, κουράζεται, και του φέρονται μερικές φορές πολύ σκληρά, ενώ εκεί τουλάχιστον οι άνθρωποι φέρονται και με μια ευγένεια, έστω και εξωτερική, υποκριτική, με την νοοτροπία την ευρωπαϊκή. Επόμενο ήταν να συναντήση αυτές τις δυσκολίες, γιατί βλέπουμε και στην Ελλάδα παρόμοια. Μόνον που στην Ελλάδα, σαν Ορθόδοξο έθνος που είναι, υπάρχει και βοήθεια πνευματική για όσους έχουν ενδιαφέροντα πνευματικά. Με λίγη υπομονή και λίγη προσοχή θα περάσουν οι δυσκολίες. Μια που βρέθηκε εκεί, ας αξιοποιήση τις ελεύθερες ώρες της στην μελέτη και στην προσευχή, για να τρέφεται και πνευματικά. Η προσπάθεια την οποία θα καταβάλη για την πρόοδο στα μαθήματα θα την βοηθήση να απορροφηθή από αυτήν και να αποξενωθή από κάθε λογισμό κακό ή πειρασμό νεανικό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Ο σεβασμός και η αγάπη των παιδιών προς τους γονείς
- type: h2
  initial:
    ru: ''
  text:
    ru: Σεβασμός των παιδιών προς τους γονείς και τους μεγαλυτέρους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το παιδί, όταν είναι μικρό, δεν κάνει τίποτε, και οι γονείς του το φροντίζουν για το φαγητό του, για το ντύσιμό του κ.λπ. Το βοηθούν από αγάπη, χωρίς αυτό να κοπιάζη. Αυτό μόνον καμμιά δουλίτσα κάνει. Και μήπως έτσι ξεπληρώνει τον κόπο ή τα έξοδα που κάνουν οι γονείς γι᾿ αυτό; Αλλά, όταν το παιδί μεγαλώση και δεν καταλαβαίνη τί του πρόσφεραν οι γονείς του, αυτό είναι πολύ βαρύ!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Παλιά οι γονείς έδερναν το παιδί και εκείνο το δεχόταν χωρίς λογισμούς. Πολλές φορές ούτε καταλάβαινε γιατί το έδερναν. Σήμερα τα παιδιά είναι όλο «γιατί και γιατί;» και αντιλογία. Δεν έχουν απλότητα. Όλα τα περνάνε από το κόσκινο. Δεν έρχεται όμως έτσι η θεία Χάρις. Όταν το παιδί δεν νιώθη τον πατέρα του ως πατέρα και δεν δέχεται την παιδαγωγία του πατέρα, είναι νόθο παιδί. Μερικά παιδιά, αν τους κάνουν οι γονείς μια μικρή παρατήρηση, «θά κόψω τις φλέβες», λένε αμέσως. Τί να τα κάνουν τότε και οι γονείς; Υποχωρούν, και τελικά τα παιδιά καταστρέφονται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το παιδί πρέπει να καταλάβη ότι, εάν οι γονείς καμμιά φορά του δίνουν κανένα σκαμπίλι, δεν το κάνουν από κακότητα, αλλά από αγάπη, για να διορθωθή, να γίνη καλύτερο και να χαίρεται αργότερα. Εμείς, όταν ήμασταν μικρά, είτε μας χάιδευαν οι γονείς μας, είτε μας έδερναν, είτε μας φιλούσαν, όλα τα δεχόμασταν. Καταλαβαίναμε ότι όλα τα έκαναν για το καλό μας. Είχαμε μεγάλη εμπιστοσύνη. Μερικές φορές μάλιστα η μητέρα μου άλλο παιδί έφταιγε και άλλο μάλωνε, γιατί δεν προλάβαινε να κάνη ...δικαστήριο. Ο ένοχος όμως, όταν έβλεπε ότι μάλωσε τον άλλον που δεν έφταιγε, επειδή τον πείραζε η συνείδηση, έλεγε «εγώ έφταιγα», και ο άλλος δικαιωνόταν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στην οικογένεια οι μικροί πρέπει να έχουν σεβασμό και προς τους γονείς και προς τους μεγαλυτέρους. Να αισθάνωνται ως ανάγκη τον σεβασμό, την υποταγή και την ευγνωμοσύνη προς τον μεγάλο. Οι μεγαλύτεροι πάλι να έχουν αγάπη προς τους μικρούς, να τους βοηθούν και να τους προστατεύουν. Όταν ο μικρός σέβεται τον μεγάλο και ο μεγάλος αγαπάη τον μικρό, δημιουργείται μια όμορφη οικογενειακή ατμόσφαιρα. Ο πατέρας μου έλεγε: «Υπακοή στον μεγάλο αδελφό σας». Εμείς ξέραμε ότι ο πατέρας μας αγαπάει όλους και είχαμε πιο πολύ θάρρος στον πατέρα. Στον μεγάλο αδελφό, που δεν βρίσκαμε την αγάπη του πατέρα, κάναμε μεγαλύτερη υπακοή[45].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν οι σύζυγοι έχουν σεβασμό μεταξύ τους και τα παιδιά έχουν σεβασμό προς τους γονείς, η ζωή στην οικογένεια είναι ειρηνική, πάει ρολόι. Ποτέ σε μια τέτοια οικογένεια ο μεγάλος γιός δεν λέει στην μητέρα του «κοίταξε εδώ, μάνα, αυτό μην το ξανακάνης» ή «γιατί το έκανες αυτό έτσι και εκείνο αλλιώς;», αλλά ούτε ο πατέρας στην μάνα μιλάει με τέτοιον τρόπο. Ο μεγάλος μπορεί να αστειεύεται με τον μικρό, για να τον κάνη να χαρή, αλλά ο μικρός δεν πρέπει να αποκτήση παρρησία με την χαρά που νιώθει από τα πειράγματα του μεγάλου. Όταν ήμουν στην Μονή Στομίου και κατέβαινα καμμιά φορά να ψωνίσω διάφορα υλικά, ένα παιδάκι, που το σπίτι του ήταν πάνω στον δρόμο, μόλις με έβλεπε, ερχόταν κοντά μου και εγώ του φιλούσα το χέρι. Ύστερα συνήθισε και έτρεχε και μου έδινε μόνο του το χέρι του να το φιλήσω! Εγώ πάλι του το φιλούσα. Μετά μου είπαν οι γονείς του: «Μήν του φιλάς, Πάτερ, το χέρι, γιατί τρέχει στους παπάδες και δίνει το χεράκι του να το φιλήσουν καί, άμα δεν το φιλήσουν, βάζει τα κλάματα».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγάπη των παιδιών προς τους γονείς μετά τον γάμο τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός οικονόμησε, ώστε το ανδρόγυνο να συνδέεται με τέτοιου είδους αγάπη, που να εγκαταλείπουν ακόμη και τους γονείς τους και ο άνδρας και η γυναίκα. Αν δεν υπήρχε αυτή η αγάπη, δεν θα μπορούσαν να κάνουν δική τους οικογένεια. Ο σκοπός των γονέων λήγει μετά την αποκατάσταση των παιδιών. Στην συνέχεια τα παιδιά τους οφείλουν μόνον πολύ σεβασμό και τόση αγάπη, όση χρειάζεται προς τους γονείς. Δεν θέλω να πω με αυτό να μην αγαπούν τους γονείς τους, αλλά να έχουν πρώτα αγάπη μεγάλη μεταξύ τους και μετά να αγαπούν τους γονείς τους. Να είναι τόσο αγαπημένοι, ώστε από την άφθονη αγάπη που θα έχουν, να δίνουν και στους γονείς τους την υπερχείλιση της αγάπης τους και όλον τον σεβασμό τους και την ευγνωμοσύνη τους. Η αγάπη τους να είναι αρχοντική, για να φροντίζη ο ένας για τους γονείς του άλλου, όσο μπορεί περισσότερο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ βοηθάει στην ομόνοια της οικογενείας, ο άνδρας να αγαπάη την γυναίκα του περισσότερο από την μητέρα του και από κάθε αγαπητό και συγγενικό του πρόσωπο. Η αγάπη του προς τους γονείς του να διοχετεύεται δια μέσου της γυναίκας του. Το ίδιο φυσικά πρέπει να κάνη και η γυναίκα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γνωρίζω ανδρόγυνα που στις αρχές έχουν προβλήματα μεταξύ τους, επειδή η γυναίκα ή ο άνδρας αγαπάει την μάνα του με υπερβολική αγάπη. Αυτό ξεκινάει από το φιλότιμο που έχουν· νιώθουν μεγάλη ευγνωμοσύνη για την μάνα τους. Σιγά-σιγά όμως, όταν συνδεθούν μεταξύ τους, δεν θα υπάρχη πρόβλημα. Δεν θα ήταν φυσιολογικό, αν αγαπούσαν αμέσως ο ένας τον άλλον με τέτοια αγάπη που θα αναπλήρωνε την αγάπη της μάνας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο σύζυγος σέβεται τους γονείς του, αυτό είναι τιμή του, όπως και για την νύφη τιμή είναι να σέβεται και να αγαπά την πεθερά της, γιατί γέννησε τον άνδρα της, τον μεγάλωσε, και τώρα μεγάλον τον χαίρεται αυτή. Όλα αυτά μιλούν αθόρυβα στις ψυχές των παιδιών τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η μάνα, όταν παντρέψη τον γιό της, επειδή πρώτα έβρισκε μεγάλη ανακούφιση από την αγάπη που της έδειχνε – και οι γέροι γίνονται ξανά σαν μωρά –, νιώθει, όπως νιώθει το μεγαλύτερο παιδί, όταν δη στην αγκαλιά της μητέρας άλλο μωρό. Βλέπεις, αν δεν κόψη κανείς τα πάθη, όταν είναι νέος, όσο μεγαλώνει, εξασθενεί η θέληση και τα πάθη αυξάνουν περισσότερο. Η νύφη όμως δεν πρέπει να το παρεξηγήση αυτό. Αν μάλιστα φροντίζη την ηλικιωμένη πεθερά της, ας κάνη λίγη υπομονή, για να μη χάση τον μισθό που αποταμιεύει από την φροντίδα που της προσφέρει. Αν τώρα υπηρετή με υπομονή την πεθερά της, αργότερα, όταν περάση η ταλαιπωρία, θα χαίρεται για το καλό που της πρόσφερε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Φυσικά και η πεθερά πρέπει να αγαπάη τις νύφες της σαν κόρες της. Η γιαγιά μου – η μητέρα του πατέρα μου – αγαπούσε την μητέρα μου πιο πολύ από τον πατέρα μου. Όταν παντρεύτηκαν τα αδέλφια μου, έλεγαν οι γειτόνισσες: «Τώρα που θα έρθουν οι νυφάδες...». Και η μητέρα μου τις έλεγε: «Γιατί το λέτε αυτό; Εμένα η πεθερά μου με αγαπάει πιο πολύ και από την κόρη της. Γιατί κι εγώ να μην αγαπάω έτσι τις νύφες μου;». Και πράγματι τις αγαπούσε κι εκείνη σαν κόρες της.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα γεράματα ταπεινώνουν τον άνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσο ταπεινώνεται ο άνθρωπος στα γεράματα! Οι γέροι σιγά-σιγά χάνουν τις δυνάμεις τους και μοιάζουν σαν το γερασμένο γεράκι. Όταν γεράση το γεράκι, πέφτουν τα φτερά του και οι φτερούγες του μετά είναι σαν σπασμένες τσατσάρες. Θυμάμαι, στην Μονή Φιλοθέου[46]ήταν ένας Προϊστάμενος[47]που είχε πάει το 1914 εθελοντής από την Σμύρνη στην Αλβανία, για να εκδικηθή τους Τούρκους, που είχαν σφάξει τον πατέρα του. Μια φορά έπιασε έναν Τούρκο και πήγε να τον σφάξη. Εκείνος του είπε: «Η δική μας θρησκεία είναι άχαρη.Μας λέει και να σφάζουμε και να σκοτώνουμε. Η δική σας όμως δεν είναι τέτοια. Ο Χριστός σάς λέει να μη σκοτώνετε». Μόλις το άκουσε αυτό, τόσο συγκινήθηκε, που πέταξε το ντουφέκι και σηκώθηκε και πήγε στο Άγιον Όρος, για να γίνη καλόγερος. Έγινε καλόγερος, έγινε και Προϊστάμενος, αλλά το αντάρτικο δεν του έφυγε. Είχε όλα τα διακονήματα και όλα τα κλειδιά από τις αποθήκες τα είχε κρεμασμένα στην ζώνη του. Κανείς δεν τολμούσε να του μιλήση. Αν ξεχνούσε κανένας Πατέρας να τον φωνάξη με τον τίτλο του, «Γέροντα Σπυρίδων», γινόταν θηρίο. Μια Μεγάλη Σαρακοστή πήγαν στο μοναστήρι συμμορίτες και τους ζήτησαν τυριά. «Βρέ γουρούνια, τους λέει αυτός, την Σαρακοστή ζητάτε τυριά;». Τους πέταξε έξω. Μια άλλη φορά οι Πατέρες είχαν λύσει τους πολυελαίους, για να τους καθαρίσουν. Είδαν οι συμμορίτες τα διάφορα εξαρτήματα που γυάλιζαν και νόμιζαν ότι είναι χρυσά. Πήγαν, τα έβαλαν σε τσουβάλια και μάζεψαν τα ζώα της περιοχής, για να τα μεταφέρουν. Μόλις τους είδε αυτός, τους πιάνει και παίρνει και τα αδειάζει από τα τσουβάλια. «Βρέ σαβούρες, τους λέει, μπρούντζα είναι αυτά, μπρούντζα σαν εσάς!». Καθόλου δεν δείλιαζε. Στα γεράματά του όμως είχε αρρωστήσει και είχε ταπεινωθή. Με είχαν βάλει να τον βοηθώ λιγάκι. Μια φορά μου είπε: «Κάνε προσευχή, Αβέρκιε[48], δεν νιώθω καλά». Σηκώθηκα και άρχισα να κάνω κομποσχοίνι: «Κύριε Ιησού Χριστέ, ελέησον τον δούλον Σου, τον Γέροντα Σπυρίδωνα». «Μωρέ, «τόν Σπύρο», πές!», μου λέει. Πόσο τον είχαν ταπεινώσει η αρρώστια και τα γεράματα! Πρώτα που να τολμούσες να μην τον πής «Γέροντα Σπυρίδωνα»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Νά, και ο πατέρας μου στα γεράματά του από μια μύγα ταπεινώθηκε. Μια μέρα τον βρήκε η αδελφή μου να κλαίη. «Τί έπαθες, πατέρα; τον ρωτάει. Μήπως κανένα εγγονάκι σε πείραξε;». «Όχι, όχι, της λέει. Τί είναι ο άνθρωπος! Προσπαθούσα να σκοτώσω μια μύγα με την μυγοσκοτώστρα και δεν μπορούσα. Έκανα έτσι να την χτυπήσω, έφευγε από εδώ· έκανα έτσι, έφευγε από εκεί. Εγώ, όταν ήμουν νέος, είχα τέτοιο σημάδι που τους Τσέτες[49]δεν τους σκότωνα· τους σημάδευα γύρω-γύρω και τους ανάγκαζα να παραδοθούν. Δεκαέξι χρονών σημάδεψα ένα λιοντάρι, το πλήγωσα και πάλεψα με το λαβωμένο λιοντάρι, και τώρα μια μύγα να μην μπορώ να σκοτώσω! Ά, τίποτε δεν είναι ο άνθρωπος». Ένιωθε ο καημένος ένα τίποτε, σαν να μην είχε κάνει τίποτε στην ζωή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και στο Άγιον Όρος, στα γηροκομεία των Μονών, πόσο ταπεινώνονται τα γεροντάκια! Περνούν και δεύτερη... κουρά! Τους κόβουν τα μαλλιά, για να μην έχουν πολλά και δυσκολεύονται να τα λούζουν. Τους κόβουν και τα γένια, γιατί τρέχουν τα σάλια, τα φαγητά, και πώς να τα καθαρίσουν; Αυτή είναι η τελευταία κουρά. Η ταπεινή κουρά!
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο μισθός από την γηροκόμηση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πώς κατήντησε ο κόσμος! Και στα Φάρασα και στην Ήπειρο γηροκομούσαν ακόμη και τα ζώα. Καλά τα μουλάρια, αλλά και αυτά τα ζώα που το κρέας τους τρωγόταν δεν τα έσφαζαν. Τα γέρικα βόδια λ.χ. με τα οποία όργωναν, τα σέβονταν, τα περιποιούνταν, τα γηροκομούσαν, γιατί έλεγαν: «Φάγαμε ψωμί από αυτά». Δηλαδή τα ζώα που ήταν εργατικά και δούλευαν στο χωράφι είχαν και καλά γεράματα. Και τότε οι άνθρωποι δεν είχαν τα μέσα που έχουν σήμερα. Έπρεπε με τον χειρόμυλο να αλέθουν το ρόβι, να το κάνουν ψιλό, για να μπορή το καημένο το γέρικο βόδι να το φάη. Ο σημερινός όμως κόσμος ξέφυγε· ανθρώπους δεν γηροκομούν, που να γηροκομήσουν τα ζώα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εγώ ποτέ στην ζωή μου δεν αισθάνθηκα τόσο καλά, όσο εκείνες τις λίγες μέρες που μου είπαν να γηροκομήσω έναν Γέροντα. Η γηροκόμηση έχει μεγάλο μισθό. Θυμάμαι που έλεγαν και για έναν δόκιμο στο Άγιον Όρος που είχε φοβερό δαιμόνιο και τον έβαλαν να γηροκομήση έξι γεροντάκια στο γηροκομείο της Μονής. Τα χρόνια εκείνα ήταν δύσκολα· δεν είχαν ευκολίες. Φορτωνόταν ο καημένος τα ρούχα στην πλάτη του με ένα ξύλο και τα πήγαινε μακριά σε μια γούρνα, για να τα πλύνη, έβαζε αλισίβα... Έπειτα από λίγο καιρό απαλλάχτηκε από το δαιμόνιο και έγινε μοναχός. Γιατί, εκτός του ότι ο ίδιος γινόταν θυσία, αλλά και τα γεροντάκια του έδιναν ευχές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολλά ανδρόγυνα δυσανασχετούν για τις δυσκολίες που αντιμετωπίζουν στην οικογένειά τους από τις ιδιοτροπίες και την γκρίνια των παππούδων που γηροκομούν. Ξεχνούν τις αταξίες που έκαναν οι ίδιοι ή την γκρίνια και τις παραξενιές που είχαν, όταν ήταν παιδιά. Δεν θυμούνται που δεν άφηναν τους γονείς τους να ησυχάσουν με τα κλάματα και τα καμώματά τους. Γι᾿ αυτό ο Θεός επιτρέπει να συναντούν αυτές τις δυσκολίες, για να ξεπληρώσουν κάπως τις δικές τους αταξίες. Τώρα είναι η σειρά τους να συμπαρασταθούν και να φροντίσουν τους γέρους γονείς τους με ευγνωμοσύνη για τις θυσίες που έκαναν εκείνοι γι᾿ αυτούς, όταν ήταν παιδιά. Όσοι δεν νιώθουν αυτό το χρέος προς τους γονείς τους, θα κριθούν από τον Θεό ως άδικοι και αχάριστοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και βλέπω ότι τα βάσανα που έχουν πολλοί κοσμικοί μερικές φορές οφείλονται και στο ότι οι γονείς τους είναι πικραμένοι μαζί τους. Ταλαιπωρούνται οι οικογένειες, γιατί δεν φροντίζουν τους παππούδες. Όταν την φουκαριάρα την γριά ή τον καημένο τον γέρο τους πάνε και τους εγκαταλείπουν σε ένα γηροκομείο, τους παίρνουν και την περιουσία, και δεν χαίρονται τα εγγονάκια τους, αλλά πεθαίνουν με καημό, τί ευλογία θα έχουν μετά τα παιδιά; Μου έλεγε σήμερα μια ηλικιωμένη γυναίκα ότι έχει τέσσερα αγόρια παντρεμένα που μένουν στο ίδιο τετράγωνο και δεν μπορεί να τα δή, γιατί συμβούλεψε μια φορά τις νυφάδες: «Να έχετε αγάπη μεταξύ σας, να εκκλησιάζεσθε»! Ού, έγιναν θηρία! «Να μην ξαναπατήσης, της είπαν, στα σπίτια μας». Πέντε χρόνια είχε να δη τα παιδιά της και έκλαιγε η καημένη. «Κάνε προσευχή, Πάτερ μου, μου είπε, έχω και εγγονάκια· τουλάχιστον να τα δώ στον ύπνο μου». Έ, τί προκοπή θα έχουν μετά τα παιδιά της;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Κι ενώ η γιαγιά στην οικογένεια είναι μεγάλη ευλογία, αυτοί οι άνθρωποι δεν το καταλαβαίνουν αυτό. Συνήθως ο άνδρας πέφτει πιο γρήγορα και τον υπηρετεί η γυναίκα του. Όταν πεθάνη ο άνδρας, τότε, για να μην αισθάνεται άχρηστη η γυναίκα, αν την παίρνουν τα παιδιά στο σπίτι τους και φυλάη τα εγγόνια, αυτό είναι πολύ καλό. Έτσι και αυτή αναπαύεται και το ζευγάρι οικονομείται. Γιατί η μάνα δεν προφταίνει με τις δουλειές της να δώση στα παιδιά την απαραίτητη στοργή και αγάπη. Την δίνει λοιπόν η γιαγιά, γιατί η ηλικία αυτή είναι η ηλικία της αγάπης και της στοργής. Βλέπεις, όταν το παιδί κάνη αταξίες, η γιαγιά το χαϊδεύει, ενώ η μάνα το μαλώνει. Με την φροντίδα της γιαγιάς και η μάνα κάνει τις δουλειές της, και τα παιδιά έχουν τα χάδια και την αγάπη, αλλά και η γιαγιά αναπαύεται με την αγάπη των εγγονών.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχει μεγάλη ευλογία από τον Θεό όποιος κοιτάζει τους γονείς του. Μου είπε μια μέρα ένας νεαρός οικογενειάρχης: «Γέροντα, σκέφτομαι στο σπίτι που θα χτίσω, να κάνω στον κάτω όροφο δύο διαμερισματάκια για τους γονείς και τα πεθερικά μου». Πόσο με συγκίνησε! Πόσες ευχές του έδωσα! Απορώ, πώς δεν το καταλαβαίνουν αυτό τα ανδρόγυνα! Πριν από λίγες μέρες ήρθε μια γυναίκα και μου είπε: «Η μάνα μου, Πάτερ, έχει ημιπληγία. Βαρέθηκα οκτώ χρόνια να την γυρίζω από εδώ, από εκεί». Ακούς; Κόρη να μιλάη έτσι για την μάνα της! «Ά, της λέω, είναι πολύ απλό! Τώρα θα κάνω προσευχή να πέσης εσύ οκτώ χρόνια από ημιπληγία και να γίνη καλά η μάνα σου, για να σε περιποιήται». «Όχι, όχι, Πάτερ!», φώναζε. «Τέσσερα χρόνια τουλάχιστον, της λέω, τέσσερα χρόνια! Βρέ, δεν ντρέπεσαι; Ποιό είναι προτιμότερο; Να έχη κανείς την υγεία του, να μην πονάη και να υπηρετή έναν άρρωστο, να έχη και μισθό από τον Θεό, ή να υποφέρη, να μην μπορή να γυρίση το πόδι του, να ταπεινώνεται και να παρακαλάη: «φέρε την πάπια, γύρνα με από εδώ, γύρνα με από εκεί»;». Όταν τα άκουσε αυτά, συμμαζεύτηκε λίγο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν έρθουν τα παιδιά στην θέση των γονέων τους που γέρασαν ή αν έρθη η νύφη στην θέση της πεθεράς της και σκεφθή: «κι εγώ θα γεράσω και θα γίνω μια μέρα πεθερά· θα ήθελα να μη μου δίνη σημασία η νύφη μου;», τότε δεν θα υπάρχουν τέτοια προβλήματα.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ευχή των γονέων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ευχή των γονέων είναι η μεγαλύτερη κληρονομιά για τα παιδιά. Γι᾿ αυτό να φροντίζουν να έχουν την ευχή των γονέων. Δεν είδες ο Ιακώβ, μέχρι που έφθασε, για να πάρη την ευλογία του πατέρα του; Και προβιά φόρεσε[50]!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ειδικά η ευχή της μητέρας είναι μεγάλο πράγμα! Κάποιος έλεγε: «Κάθε λόγος της μητέρας μου είναι και μια λίρα χρυσή». Νά, και πριν από λίγο καιρό πόση εντύπωση μου έκανε κάποιος από το Γιοχάνεσμπουργκ! Ήρθε στο Καλύβι το φθινόπωρο. «Γέροντα, η μάνα μου αδιαθέτησε, μου λέει, και ήρθα να την δώ». Τρείς μήνες δεν πέρασαν, τα Χριστούγεννα ξαναήρθε. «Πώς πάλι εδώ;», τον ρωτάω. «Έμαθα, μου λέει, πώς πάλι αδιαθέτησε η μάνα μου και ήρθα να φιλήσω το χέρι της, γιατί είναι ηλικιωμένη και μπορεί να πεθάνη. Για μένα η μεγαλύτερη περιουσία είναι η ευχή της μάνας μου». Εξήντα χρονών άνθρωπος ξεκίνησε από το Γιοχάνεσμπουργκ και ήρθε στην Ελλάδα, για να φιλήση το χέρι της μάνας του! Και τώρα τέτοια ευλογία έχει, που σκέφτεται να κάνη ένα γηροκομείο μεγάλο για τους κληρικούς και να το χαρίση στην Εκκλησία. Δηλαδή τις ευλογίες δεν έχει που να τις βάλη κατά κάποιον τρόπο. Για μένα είναι φάρμακο μια τέτοια ψυχή. Είναι σαν να είμαι στην έρημο Σαχάρα και να βρίσκω ξαφνικά λίγο νερό. Αυτά χάνονται σιγά-σιγά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ένας άλλος ήρθε μια μέρα με κλάματα στο Καλύβι. «Πάτερ, με καταράστηκε η μάνα μου. Στο σπίτι έχουμε όλο αρρώστιες, στενοχώριες, η δουλειά μου δεν πάει καλά», μου είπε. «Κι εσύ δεν θα ήσουν εντάξει, του λέω. Δεν μπορεί η μάνα σου άδικα να σε καταράστηκε». «Ναί, μου λέει, ήμουν κι εγώ...». «Να πάς να ζητήσης συγχώρηση από την μάνα σου», του λέω. «Θα πάω, Πάτερ, μου λέει. Δώσε μου την ευχή σου». «Την ευχή μου την έχεις, του είπα, αλλά να πάρης και την ευχή της μάνας σου». «Δύσκολο να μου δώση την ευχή της», μου λέει. «Να πάς, κι αν δεν σού την δώση, να της πής: «μού είπε ένας Γέροντας πώς κι εσύ θα παραδώσης ψυχή"». Πήγε, και η μάνα του του ευχήθηκε: «Παιδί μου, να έχης την ευλογία του Αβραάμ!». Ήρθε μετά από λίγο καιρό στο Όρος με βυσσινάδες, με λουκούμια. Ήταν γεμάτος χαρά. Τα παιδιά του ήταν καλά, η δουλειά του πήγαινε καλά. Συνέχεια βούρκωνε και έλεγε «δόξα τω Θεώ». Άλλαξε όλη η ζωή του και μιλούσε όλο πνευματικά. Πόσο μάλλον όταν κανείς έχη εξ αρχής σεβασμό προς τους γονείς! Πώς να μην έχη την ευλογία του Θεού;'
- type: h2
  initial:
    ru: ''
  text:
    ru: Τέταρτο Μέρος – Πνευματική Ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Αν κανείς αγαπήση τον Θεό, αν αναγνωρίση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: τήν μεγάλη Του θυσία και τις ευεργεσίες Του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί στρυμώξη τον εαυτό του με διάκριση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: στήν μίμηση των Αγίων, γρήγορα αγιάζει·
- type: paragraph
  initial:
    ru: ''
  text:
    ru: φθάνει να ταπεινώνεται,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: νά συναισθάνεται την αθλιότητά του
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί την μεγάλη του αχαριστία προς τον Θεό».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – Η πνευματική ζωή στην οικογένεια
- type: h2
  initial:
    ru: ''
  text:
    ru: Όσο γκρινιάζει κανείς, τόσο ρημάζει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, που οφείλεται η γκρίνια και πώς μπορείς να την αποφύγης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην κακομοιριά οφείλεται και με την δοξολογία την κάνει κανείς πέρα. Η γκρίνια γεννά γκρίνια και η δοξολογία γεννά δοξολογία. Όταν δεν γκρινιάζη κανείς για μια δυσκολία που τον βρίσκει, αλλά δοξάζη τον Θεό, τότε σκάζει ο διάβολος και πάει σε άλλον που γκρινιάζει, για να του τα φέρη όλα πιο ανάποδα. Γιατί, όσο γκρινιάζει κανείς, τόσο ρημάζει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικές φορές μας κλέβει το ταγκαλάκι και μας κάνει να μη μας ευχαριστή τίποτε, ενώ μπορεί κανείς όλα να τα γλεντάη πνευματικά με δοξολογία και να έχη την ευλογία του Θεού. Νά, ξέρω κάποιον εκεί στο Όρος πού, αν βρέξη και του πής «πάλι βρέχει», αρχίζει: «Ναί, όλο βρέχει, θα σαπίσουμε από την πολλή υγρασία». Αν μετά από λίγο σταματήση η βροχή και του πής «έ, δεν έβρεξε και πολύ», λέει: «Ναί, βροχή ήταν αυτή; θα ξεραθή ο τόπος...». Και δεν μπορεί να πη κανείς ότι δεν είναι καλά στο μυαλό, αλλά συνήθισε να γκρινιάζη. Να είναι λογικός και να σκέφτεται παράλογα!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η γκρίνια έχει κατάρα. Είναι σαν να καταριέται ο ίδιος ο άνθρωπος τον εαυτό του, οπότε μετά έρχεται η οργή του Θεού. Στην Ήπειρο γνώριζα δύο γεωργούς. Ο ένας ήταν οικογενειάρχης και είχε ένα-δυό χωραφάκια και εμπιστευόταν τα πάντα στον Θεό. Εργαζόταν, όσο μπορούσε, χωρίς άγχος. «Θα κάνω ό,τι προλάβω», έλεγε. Μερικές φορές άλλα δεμάτια σάπιζαν από την βροχή, γιατί δεν προλάβαινε να τα μαζέψη, άλλα του τα σκόρπιζε ο αέρας, και όμως για όλα έλεγε «δόξα Σοι ο Θεός» και όλα του πήγαιναν καλά. Ο άλλος είχε πολλά κτήματα, αγελάδες κ.λπ., δεν είχε και παιδιά. Αν τον ρωτούσες «πώς τα πάς;», «άσ᾿ τα, μην τα ρωτάς», απαντούσε· ποτέ δεν έλεγε «δόξα Σοι ο Θεός», όλο γκρίνια ήταν. Και να δήτε, άλλοτε του ψοφούσε η αγελάδα, άλλοτε του συνέβαινε το ένα, άλλοτε το άλλο. Όλα τα είχε, αλλά προκοπή δεν έκανε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό λέω, η δοξολογία είναι μεγάλη υπόθεση. Από μας εξαρτάται, αν γευθούμε ή όχι τις ευλογίες που μας δίνει ο Θεός. Πώς όμως να τις γευθούμε, αφού ο Θεός μας δίνει λ.χ. μπανάνα και εμείς σκεφτόμαστε τί καλύτερο τρώει ο τάδε εφοπλιστής; Πόσοι άνθρωποι τρώνε μόνον ξερό παξιμάδι, αλλά μέρα-νύχτα δοξολογούν τον Θεό και τρέφονται με ουράνια γλυκύτητα! Αυτοί οι άνθρωποι αποκτούν μια πνευματική ευαισθησία και γνωρίζουν τα χάδια του Θεού. Εμείς δεν τα καταλαβαίνουμε, γιατί η καρδιά μας έχει πιάσει γλίτσα και δεν ικανοποιούμαστε με τίποτε. Δεν καταλαβαίνουμε ότι η ευτυχία είναι στην αιωνιότητα και όχι στην ματαιότητα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να βάλουμε στην ζωή μας κυβερνήτη τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί η Βασιλεία του Θεού στο Ευαγγέλιο παρομοιάζεται με κόκκο σινάπεως «ός όταν σπαρή επί της γής, μικρότερος πάντων των σπερμάτων εστί των επί της γής· και όταν σπαρή, αναβαίνει και γίνεται μείζων πάντων των λαχάνων»[51];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Το σινάπι σαν σπόρος είναι πολύ μικρός, αλλά, όταν σπαρή, γίνεται ολόκληρος θάμνος. Ακόμη και τα πουλάκια πηγαίνουν και κάθονται στα κλαδιά του. Ο λόγος του Θεού παρομοιάζεται με τον σπόρο του, γιατί από έναν μικρό ευαγγελικό λόγο ο άνθρωπος αναπτύσσεται και καταλαβαίνει την Βασιλεία του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, πώς νιώθει κανείς αυτό που λέει η Αγία Γραφή: «Η βασιλεία του Θεού εντός υμών εστιν»[52];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ευλογημένη, όταν μέσα μας είναι ένα μέρος της χαράς του Παραδείσου, τότε «η βασιλεία του Θεού εντός ημών εστι». Και το αντίθετο, όταν έχουμε άγχος, τύψεις συνειδήσεως, τότε μέσα μας υπάρχει ένα μέρος της κολάσεως. Είναι μεγάλο πράγμα ο άνθρωπος από τούτη την ζωή να νιώθη μέσα του ένα μέρος της χαράς του Παραδείσου. Δεν είναι δύσκολο να το πετύχουμε αυτό· δυστυχώς όμως ο εγωισμός μας εμποδίζει από το πνευματικό αυτό μεγαλείο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο άνθρωπος μόνος του μπορεί να κάνη την ζωή του παραδεισένια, εάν δέχεται να τον κυβερνάη ο Θεός σαν καλός Πατέρας. Πρέπει να έχη εμπιστοσύνη στον Θεό, να ελπίζη σ᾿ Αυτόν για ό,τι επιχειρεί να κάνη και να Τον δοξάζη για όλα. Να μην έχη άγχος. Το άγχος φέρνει ένα τσάκισμα στην ψυχή, την παραλύει. Όταν ζητάη την Βασιλεία των Ουρανών, όλα τα άλλα έρχονται. Λέει το Ευαγγέλιο: «ζητείτε πρώτον την βασιλείαν του Θεού»[53], αλλά και «τήν βασιλείαν του Θεού αρπάζουν οι βιασταί»[54].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι άνθρωποι σήμερα δυσκόλεψαν την ζωή τους, γιατί δεν αρκούνται στα λίγα, αλλά κυνηγούν συνέχεια τα υλικά αγαθά. Όσοι όμως θέλουν να ζήσουν γνήσια πνευματική ζωή, πρώτα-πρώτα πρέπει να αρκεσθούν στα λίγα. Όταν η ζωή τους είναι απλοποιημένη, χωρίς πολλές σκοτούρες, και ελευθερωμένοι θα είναι από το κοσμικό πνεύμα, και χρόνος θα τους περισσεύη και για πνευματικά. Αλλιώς θα κουράζωνται προσπαθώντας να ακολουθήσουν την μόδα, θα χάνουν την γαλήνη τους και θα κερδίζουν το μεγάλο άγχος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπω, πώς οι άνθρωποι μερικές φορές κάνουν μαρτυρική την ζωή τους! Σήμερα καθώς ερχόμουν με κάποιον από την Ουρανούπολη, με παρακάλεσε να περάσουμε λίγο από το σπίτι του. Επειδή επέμενε, δεν θέλησα να του χαλάσω το χατίρι. Μόλις φθάσαμε στην εξώπορτα, τον βλέπω, βγάζει τα παπούτσια του και μπαίνει μέσα πατώντας στις μύτες. «Τί έπαθες και περπατάς έτσι;», τον ρωτάω. «Τίποτε, Γέροντα, μου λέει, περπατάω προσεκτικά, για να μη χαλάσω το παρκέ». Τί να πής; Βασανίζονται χωρίς λόγο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο πόνος για τον πλησίον βοηθάει την οικογένεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όσο πιο πολλά αγαθά αποκτούν σήμερα οι άνθρωποι, τόσο πιο πολλά προβλήματα έχουν. Ούτε τον Θεό ευχαριστούν για τις ευεργεσίες Του, ούτε την δυστυχία των συνανθρώπων τους βλέπουν, για να κάνουν καμμιά ελεημοσύνη. Σπαταλούν και δεν σκέφτονται τον άλλον που δεν έχει να φάη. Πώς να έρθη μετά η Χάρις του Θεού; Εδώ και οικογενειάρχης να είναι κανείς, πρέπει από κάπου να κόβη και να οικονομάη κάτι, για να κάνη κάποια ελεημοσύνη. Να πη στην γυναίκα του και στα παιδιά του ότι στο τάδε μέρος υπάρχει κάποιος άρρωστος εγκαταλελειμμένος ή κάποια φτωχή οικογένεια που έχει μεγάλη ανάγκη. Εάν δεν έχουν χρήματα να δώσουν, ας τους πή: «Ας δώσουμε τουλάχιστον ένα χριστιανικό βιβλίο, αφού έχουμε πολλά». Δίνοντας σ᾿ αυτούς που έχουν ανάγκη, κάνει καλό και στον εαυτό του αλλά και στην οικογένειά του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εκεί στην Ρωσία οι καημένοι οι πιστοί πόσο στερούνται! Έδωσα μια φορά σε έναν Ρώσο παπά ένα κουτάκι λιβάνι και του είπα: «Ένα φτωχό δώρο». «Φτωχό είναι αυτό; μου λέει. Τα λιβάνια τα δικά μας είναι... βήχα-βήχα». Κι εδώ στην Ελλάδα πόσο ταλαιπωρούνται οι πρόσφυγες! Στην Χαλκιδική είδα κάποιον πρόσφυγα που έστρωνε σχιστόπλακες και έπαιρνε τριακόσιες δραχμές το τετραγωνικό μέτρο[55]και έλεγε: «Δόξα Σοι ο Θεός, που έχουμε ψωμί». Γι᾿ αυτό, όταν μου είπε ένας εργολάβος ότι μέσα στην δουλειά φορτώνεται αμαρτίες, του είπα: «Αν φορτωθής αυτούς τους πρόσφυγες και τους οικονομήσης, θα ξεφορτωθής από τις αμαρτίες σου. Δεν έχουν που να μείνουν. Εν συγκρίσει με αυτούς εσύ είσαι Ωνάσης».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός, για να ασκήσουμε τις αρετές, επέτρεψε να υπάρχουν οι άρρωστοι, οι φτωχοί κ.λπ. Μπορούσε και τους αρρώστους και τους φτωχούς, όλους να τους οικονομήση, αλλά τότε θα είχαμε την ψευδαίσθηση ότι είμαστε ενάρετοι. Θα λέγαμε λ.χ. ότι είμαστε ελεήμονες, χωρίς να είμαστε, ενώ τώρα τα έργα μας φανερώνουν τις αρετές μας. Δόξα τω Θεώ, υπάρχουν άνθρωποι που θυσιάζονται για τον συνάνθρωπό τους. Γνώρισα κάποιον πού, μόλις απολύθηκε από τον στρατό, δέχθηκε να καταδικασθή άδικα με μεγάλη ποινή, για να σώση μια οικογένεια. Δεν σκέφθηκε ούτε το ρεζίλι, ούτε την σταδιοδρομία του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πάντως, βλέπω πώς οικονομάει ο Θεός, ώστε τουλάχιστον ένας από κάθε οικογένεια να έχη πίστη, ευλάβεια, για να βοηθιούνται και οι υπόλοιποι! Γνώριζα στην Κόνιτσα μια οικογένεια που όλοι ήταν αδιάφοροι προς την Εκκλησία. Μόνο μια κόρη ξεχώριζε. Μόλις άκουγε την καμπάνα, πετούσε την ποδιά, άφηνε όλες τις δουλειές στην μέση και πήγαινε στην εκκλησία. Ακόμη και όταν ήρθαν οι Γερμανοί και χτυπούσε ο νεωκόρος την καμπάνα, για να φύγη ο κόσμος από τα σπίτια, αυτή πήγε στην εκκλησία για εσπερινό! Ήταν και πολύ πονόψυχη, ενώ οι γονείς της πολύ τσιγγούνηδες. Ο πατέρας της, αντί να φάη φαγητό, έπαιρνε και έτρωγε ένα ξεροκόμματο που το βουτούσε στο νερό. Η  δε μάνα της ήταν πολύ σφιχτή! Αν και τα παιδιά της είχαν μεγάλες θέσεις και περιουσία, εκείνη έψαχνε να βρη κανένα αναμμένο καρβουνάκι στο τζάκι και με το θειαφοκέρι έπαιρνε από αυτό φωτιά, για να μη χαλάση ένα σπίρτο! Για καφέμπρικο είχε ένα τενεκεδάκι από κονσέρβα! Όταν ήμουν στην Μονή Στομίου, επειδή η μάνα της με αγαπούσε, αν ήθελε η κόρη να πάρη κάτι από το σπίτι τους για κανέναν φτωχό και δυσκολευόταν να το βγάλη κρυφά, της έλεγε: «Μητέρα, ο καλόγερος το θέλει αυτό». «Δώσ᾿ το, δώσ᾿ το», της έλεγε εκείνη. Μόνο για τον καλόγερο η μάνα της δεν αντιδρούσε. Αλλά και τότε στην Κατοχή η κόρη αθόρυβα βοηθούσε τους φτωχούς. Έβγαζε με τρόπο σιτάρι από την αποθήκη τους, το φορτωνόταν, το πήγαινε στον μύλο, το άλεθε και μοίραζε το αλεύρι στις φτωχές οικογένειες. Την έπιασε μια φορά η μάνα της και τί είχε τραβήξει! Τότε έταξε: «Θεέ μου, βοήθησέ με να βρώ μια δουλειά και θα δίνω όλον τον μισθό μου ελεημοσύνη». Την άλλη μέρα την ζήτησαν σε κάποιο ίδρυμα. Ώ, χαρά που είχε! Και κράτησε το τάμα της· ούτε ένα ζευγάρι κάλτσες δεν αγόρασε από τον μισθό της για τον εαυτό της· όλα τα έδινε ελεημοσύνη. Πόσοι τώρα λένε: «Θεός σχωρέσοι· ν᾿ αγιάσουν τα κόκκαλα των γονέων σου!». Γι᾿ αυτό ο Θεός οικονόμησε μετά και την μάνα της.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η άσκηση της αρετής μέσα στην οικογένεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένας οικογενειάρχης πώς μπορεί να ασκήται στην αρετή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δίνει ο Θεός ευκαιρίες. Αλλά πολλοί, ενώ ζητούν από τον Θεό να τους δίνη ευκαιρίες, για να ασκούνται στην αρετή, γογγύζουν, όταν συναντούν κάποια δυσκολία. Μερικές φορές λ.χ. ο Καλός Θεός, από την άπειρη αγάπη Του, για να ασκηθή ο άνδρας στην ταπείνωση και στην υπομονή, αφαιρεί την Χάρη Του από την γυναίκα και αρχίζει να γίνεται ιδιότροπη και να του φέρεται σκληρά. Τότε ο άνδρας πρέπει να χαίρεται και να ευχαριστή τον Θεό για την ευκαιρία αυτή που του δίνει να αγωνισθή, και όχι να γογγύζη. Ή ζητάει η μητέρα από τον Θεό να της δίνη υπομονή. Πάει το παιδάκι καί, όπως έχει έτοιμο το τραπέζι για να φάνε, τραβάει το τραπεζομάνδηλο και τα ρίχνει όλα κάτω. Τότε είναι σαν να λέη στην μητέρα του: «Μαμά, κάνε υπομονή!»...'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και γενικά, οι δυσκολίες που υπάρχουν σήμερα στον κόσμο αναγκάζουν όσους θέλουν να ζήσουν λίγο πνευματικά να βρίσκωνται σε εγρήγορση. Όπως, Θεός φυλάξοι, όταν γίνεται πόλεμος, οι άνθρωποι βρίσκονται σε εγρήγορση, το ίδιο βλέπω να γίνεται και τώρα με όσους προσπαθούν να ζουν πνευματικά. Νά, τα καημένα τα παιδιά που είναι κοντά στην Εκκλησία πόσο δυσκολεύονται! Ο πόλεμος όμως που έχουν από το άσχημο περιβάλλον στο οποίο ζουν τα βοηθάει να είναι κατά κάποιον τρόπο ξύπνια. Και βλέπεις, σε καιρό ειρήνης που δεν υπάρχουν δυσκολίες, οι πιο πολλοί το ρίχνουν έξω. Ενώ πρέπει και τότε να αξιοποιούν την ειρήνη για την πνευματική πρόοδο· να προσπαθούν να κόβουν τα ελαττώματά τους και να καλλιεργούν τις αρετές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ βοηθάει στην πνευματική ζωή η ησυχία. Καλά είναι να έχη κανείς κάποια ώρα της ημέρας να ησυχάζη. Να εξετάζη τον εαυτό του, για να γνωρίση τα πάθη του και να αγωνισθή να τα κόψη, για να καθαρίση την καρδιά του. Αν μάλιστα υπάρχη στο σπίτι ένα δωμάτιο ήσυχο, που να θυμίζη ατμόσφαιρα κελλιού, αυτό είναι πολύ καλό. Εκεί, «εν τω κρυπτώ»[56], θα μπορή να κάνη τα πνευματικά του καθήκοντα, να μελετάη, να προσεύχεται. Η λίγη πνευματική μελέτη, όταν προηγήται από την προσευχή, πολύ βοηθάει, γιατί και η ψυχή θερμαίνεται και ο νούς μεταφέρεται σε πνευματικό χώρο. Γι᾿ αυτό, όταν κανείς έχη πολύ περισπασμό την ημέρα, να προτιμά, αν έχη δέκα λεπτά για προσευχή, δύο λεπτά να μελετά κάτι το δυνατό, για να διώχνη τον περισπασμό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μήπως είναι λίγο δύσκολο να τα κάνη κανείς αυτά μέσα στον κόσμο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, υπάρχουν λαϊκοί που ζουν πολύ πνευματικά, σαν ασκητές, με τις νηστείες τους, τις ακολουθίες τους, τα κομποσχοίνια τους, τις μετάνοιές τους, και ας έχουν παιδιά και εγγόνια. Την Κυριακή πηγαίνουν στην εκκλησία, κοινωνούν, και γυρίζουν πάλι στο «κελλί» τους, όπως οι ερημίτες που πηγαίνουν την Κυριακή στο Κυριακό[57]͵ και μετά ησυχάζουν στα κελλιά τους. Δόξα τω Θεώ, υπάρχουν πολλές τέτοιες ψυχές στον κόσμο. Συγκεκριμένα, γνωρίζω κάποιον οικογενειάρχη που λέει συνέχεια την ευχή, όπου κι αν βρίσκεται, και έχει διαρκώς δάκρυα στην προσευχή. Η προσευχή του έγινε αυτοενέργητη και τα δάκρυά του είναι γλυκά, είναι δάκρυα θείας αγαλλιάσεως. Θυμάμαι και κάποιον εργάτη – Γιάννη τον έλεγαν – εκεί στο Άγιον Όρος, που δούλευε πολύ σκληρά· έκανε δουλειά για δυο ανθρώπους. Του είχα πει να λέη την ευχή, όταν εργάζεται, και σιγά-σιγά την συνήθισε. Ήρθε μια φορά και μου είπε ότι νιώθει μεγάλη χαρά, όταν λέη την ευχή. «Άρχισε να γλυκοχαράζη», του είπα. Μετά από λίγο καιρό έμαθα ότι τον σκότωσαν δυο μεθυσμένοι. Πόσο είχα λυπηθή! Έπειτα από λίγες μέρες κάποιος μοναχός έψαχνε ένα εργαλείο, αλλά δεν το έβρισκε, γιατί το είχε τακτοποιήσει κάπου ο Γιάννης. Το βράδυ φανερώθηκε στον ύπνο του ο Γιάννης και του είπε που το είχε βάλει. Είχε φθάσει σε πνευματική κατάσταση και μπορούσε να βοηθάη από την άλλη ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσο απλή είναι η πνευματική ζωή! Αν κανείς αγαπήση τον Θεό, αν αναγνωρίση την μεγάλη Του θυσία και τις ευεργεσίες Του και στρυμώξη τον εαυτό του με διάκριση στην μίμηση των Αγίων, γρήγορα αγιάζει· φθάνει να ταπεινώνεται, να συναισθάνεται την αθλιότητά του και την μεγάλη του αχαριστία προς τον Θεό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η προσευχή στην οικογένεια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πρέπει να κάνη όλη η οικογένεια μαζί το απόδειπνο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Οι μεγάλοι να κινούνται με αρχοντιά. Εκείνοι να κάνουν το απόδειπνο και στα μικρά παιδιά να λένε: «Αν θέλετε, μείνετε λίγο». Όταν είναι κάπως μεγάλα τα παιδιά, μπορούν να έχουν ένα τυπικό· π.χ. δεκαπέντε λεπτά οι μεγάλοι, δύο ή πέντε λεπτά τα παιδιά, και από ᾿κεί και πέρα όσο θέλουν εκείνα. Αν οι γονείς τα κρατούν σε όλο το απόδειπνο, μετά αγανακτούν. Δεν πρέπει να τα πιέζουν, γιατί αυτά δεν έχουν καταλάβει ακόμη την δύναμη και την αξία της προσευχής. Οι γονείς, ας υποθέσουμε, μπορούν να φάνε και φασόλια και κρέας, οποιαδήποτε γερή τροφή. Όταν όμως το παιδάκι πίνη ακόμη μόνο γάλα, θα του πούν να φάη κρέας, επειδή είναι πιο δυναμωτικό; Μπορεί να είναι πιο δυναμωτικό, αλλά το καημένο δεν μπορεί να το χωνέψη. Γι᾿ αυτό στην αρχή του δίνουν λίγο κρεατάκι με ζουμάκι, για να θελήση να ξαναφάη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές φορές και οι μεγάλοι το βράδυ είναι τόσο κουρασμένοι, που δεν μπορούν ούτε το απόδειπνο να κάνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν είναι πολύ κουρασμένοι ή άρρωστοι, ας πούν το μισό απόδειπνο ή έστω ένα «Πάτερ ημών». Να μην παραλείψουν τελείως την προσευχή. Όπως στον πόλεμο, αν βρεθής βράδυ σε ένα ύψωμα μόνος και περικυκλωμένος από εχθρούς, ρίχνεις καμμιά τουφεκιά, για να φοβηθούν οι εχθροί και να μην κάνουν έφοδο, έτσι και αυτοί ας ρίχνουν καμμιά τουφεκιά, για να φοβάται το ταγκαλάκι και να φεύγη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η προσευχή έχει μεγάλη δύναμη μέσα στην οικογένεια. Γνωρίζω δύο αδέλφια που κατάφεραν με την προσευχή τους όχι μόνο να μη χωρίσουν οι γονείς τους, που είχαν πρόβλημα μεταξύ τους, αλλά να τους κάνουν και πιο αγαπημένους. Εμάς ο πατέρας μου μας έλεγε: «Δεν ξέρω τί θα κάνετε, δυο φορές την ημέρα θα πρέπη να δίνετε το παρόν στον Θεό, για να ξέρη που βρίσκεστε». Κάθε πρωί και κάθε βράδυ κάναμε προσευχή μπροστά στο εικονοστάσι όλοι μαζί, ο πατέρας, η μητέρα και τα παιδιά, και στο τέλος βάζαμε μετάνοια στην εικόνα του Χριστού. Όταν πάλι είχαμε κάποιο πρόβλημα στην οικογένεια, κάναμε προσευχή, για να τακτοποιηθή. Θυμάμαι, μια φορά που αρρώστησε ο μικρότερος αδελφός μας, είπε ο πατέρας μου: «Ελάτε να παρακαλέσουμε τον Θεό ή να τον κάνη καλά ή να τον πάρη, για να μην υποφέρη». Προσευχηθήκαμε όλοι και έγινε καλά. Αλλά και στο τραπέζι καθόμασταν όλοι μαζί. Κάναμε πρώτα προσευχή και ύστερα αρχίζαμε να τρώμε. Αν άρχιζε κανείς να τρώη, πριν ευλογηθή το τραπέζι, λέγαμε: «αυτός επόρνευσε». Την έλλειψη εγκρατείας την θεωρούσαμε πορνεία. Είναι διάλυση της οικογενείας να έρχεται ο καθένας στο σπίτι, όποια ώρα θέλει, και να τρώη μόνος του χωρίς να υπάρχη λόγος.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η πνευματική ζωή των συζύγων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ο άνδρας δεν ζη πνευματικά, η γυναίκα τί πρέπει να κάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να τον αναθέση στον Χριστό και να προσεύχεται να μαλακώση λίγο την καρδιά του. Σιγά-σιγά θα κάνη αποβίβαση ο Χριστός στην καρδιά του και θα αρχίση να προβληματίζεται. Μόλις μαλακώση λίγο η καρδιά του, τότε μπορεί να του πη να την πάη λ.χ. με το αυτοκίνητο στην εκκλησία. Δεν θα του πή: «έλα κι εσύ στην εκκλησία», αλλά θα του πή: «Μπορείς, σε παρακαλώ, να με πάς μέχρι την εκκλησία;». Αν την πάη μέχρις εκεί, μπορεί να πή: «Αφού ήρθα ώς εδώ, ας μπώ κι εγώ λίγο μέσα να ανάψω ένα κερί». Και έτσι σιγά-σιγά ίσως προχωρήση και παραπέρα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, ο Πνευματικός της γυναίκας να βοηθήση με κάποιον τρόπο και τον άνδρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές, για να βοηθηθή ο άνδρας, ο Πνευματικός πρέπει να κάνη πνευματική εργασία στην γυναίκα. Από την γυναίκα θα μεταδοθή το καλό στον άνδρα καί, αν έχη αγαθή καρδιά, ο Θεός θα τον βοηθήση να αλλάξη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η γυναίκα έχει στην φύση της την ευλάβεια. Αλλά, όταν ο άνδρας, ενώ είναι λίγο αδιάφορος προς την Εκκλησία, πάρη μια στροφή πνευματική, μετά προχωράει σταθερά πνευματικά και η γυναίκα δεν τον φθάνει. Μπορεί μάλιστα να αρχίση να τον ζηλεύη, επειδή δεν προχωράει αυτή. Γι᾿ αυτό, στις περιπτώσεις αυτές, λέω στους άνδρες να προσέχουν. Γιατί τί γίνεται; Όσο προχωράει ο άνδρας πνευματικά, η γυναίκα, αν δεν ζη κι εκείνη πνευματικά, τόσο του πάει κόντρα. Αν πη ο άνδρας: «πέρασε η ώρα, σήκω να πάμε στην εκκλησία», του λέει: «Άντε, τράβα μόνος σου! Δεν με καταλαβαίνεις, έχω ένα σωρό δουλειές...». Ή, αν της πη ο άνδρας: «καλά, σβηστό έχεις το καντήλι;» ή αν πάη να το ανάψη εκείνος, πληγώνει τον εγωισμό της και βάζει τις φωνές: «Τί, παπάς θα γίνης; καλόγερος είσαι;». Μπορεί ακόμη και να του πή: «Τί το καίμε το καντήλι; Καλύτερα να δώσουμε το λάδι σε κανέναν φτωχό». Μέχρις εκεί μπορεί να φθάση, σε προτεσταντικές θεωρίες. Φυσικά, ύστερα στενοχωριέται για τις δικαιολογίες που είπε, αλλά στενοχωριέται και για την πρόοδο που βλέπει στον άνδρα της. Χίλιες φορές σ᾿ αυτές τις περιπτώσεις να μείνη σβηστό το καντήλι, παρά να πάη ο άνδρας να το ανάψη. Για να γλιτώσω λοιπόν τις οικογένειες από την διάλυση, λέω στους άνδρες: «Να πής στην γυναίκα σου, όταν την βρής σε καλή ώρα: «Αν πηγαίνω στην εκκλησία και κάνω λίγη προσευχή και καμμιά μετάνοια ή διαβάζω κανένα βιβλίο πνευματικό, δεν τα κάνω αυτά από πολλή ευλάβεια, αλλά γιατί αυτά με φρενάρουν, με συγκρατούν, ώστε να μην παρασυρθώ από αυτήν την ελεεινή κοινωνία και πάω στα μπουζούκια με παρέες κ.λπ."». Όταν ο άνδρας χειρισθή έτσι το θέμα, τότε η γυναίκα χαίρεται και μπορεί να αλλάξη και να τον ξεπεράση στα πνευματικά. Αν δεν το χειρισθή όμως έτσι, της σπάζει τα κόκκαλα. Μπορεί να φθάσουν σε χωρισμό. Αν θέλη ο άνδρας να βοηθήση την γυναίκα πνευματικά, ας προσπαθήση να την συνδέση με κάποια οικογένεια που ζη πνευματικά και η μητέρα έχει ευλάβεια, ώστε να παρακινηθή να την μιμηθή.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Παιδιά και πνευματική ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια μητέρα δίνει αγιασμό στο παιδί της και το παιδί τον φτύνει. Τί να κάνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να κάνη προσευχή για το παιδί της. Ίσως και ο τρόπος που  δίνει στο παιδί τον αγιασμό να του προκαλή  αντίδραση. Για να είναι τα παιδιά στον δρόμο του Θεού, πρέπει και οι γονείς να ζουν σωστά πνευματικά. Μερικοί γονείς που θρησκεύουν προσπαθούν να βοηθήσουν τα παιδιά τους να γίνουν καλά παιδιά, όχι γιατί τους απασχολεί η σωτηρία της ψυχής τους, αλλά γιατί θέλουν να έχουν καλά παιδιά. Περισσότερο δηλαδή τους στενοχωρεί τί θα πη ο κόσμος για τα παιδιά τους, παρά μήπως πάνε στην κόλαση. Τότε πώς να βοηθήση ο Θεός; Σκοπός δεν είναι να πηγαίνουν τα παιδιά με το ζόρι στην εκκλησία, αλλά να αγαπήσουν την εκκλησία. Να μην κάνουν το καλό με το ζόρι, αλλά να το αισθανθούν ως ανάγκη. Η  αγία ζωή των γονέων πληροφορεί τις ψυχές των παιδιών και υποτάσσονται φυσιολογικά. Έτσι μεγαλώνουν με ευλάβεια και με διπλή υγεία, χωρίς ψυχικά τραύματα. Αν οι γονείς ζορίζουν το παιδί τους από φόβο Θεού, βοηθάει ο Θεός και βοηθιέται το παιδί. Αν όμως το κάνουν από εγωισμό, τότε δεν βοηθάει ο Θεός. Πολλές φορές ταλαιπωρούνται τα παιδιά από την υπερηφάνεια των γονέων.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικές μητέρες μας ρωτούν τί προσευχή να κάνουν παιδιά τριών-τεσσάρων ετών;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Να τις πήτε: «Εσύ, μάνα είσαι· κοίταξε πόσο αντέχει το παιδί σου». Να μη βάζουν τυπικό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εδώ, Γέροντα, τα παιδάκια που φέρνουν οι γονείς στις αγρυπνίες μήπως κουράζονται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στον όρθρο να τα αφήνουν λίγο να ξεκουραστούν και στην Θεία Λειτουργία να τα παίρνουν στον ναό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι μητέρες, χωρίς να ζορίζουν τα παιδιά, πρέπει να τα μαθαίνουν από μικρά να προσεύχωνται. Στα χωριά της Καππαδοκίας οι κάτοικοι ζούσαν έντονα την ασκητική παράδοση. Πήγαιναν με τα παιδιά τους στα ασκητήρια και εκεί έκαναν μετάνοιες και προσεύχονταν με δάκρυα, και έτσι μάθαιναν και τα παιδιά να προσεύχωνται. Οι Τσέτες, όταν πήγαιναν το βράδυ να τους ληστέψουν, περνούσαν έξω από τα εκκλησάκια, άκουγαν κλάματα και απορούσαν. «Καλά, τί γίνεται; έλεγαν. Αυτοί την ημέρα γελάνε και την νύχτα κλαίνε;». Δεν μπορούσαν να καταλάβουν τί συμβαίνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Με τις προσευχές των μικρών παιδιών μπορούν να γίνουν θαύματα. Ό,τι ζητούν από τον Θεό, τους το δίνει, γιατί έχουν αθωότητα και ο Θεός ακούει την καθαρή προσευχή τους. Θυμάμαι, μια φορά που οι γονείς μας είχαν πάει στο χωράφι, με είχαν αφήσει στο σπίτι με τα δυο μικρότερα αδέλφια μου. Ξαφνικά ο ουρανός μαύρισε και άρχισε καταρρακτώδης βροχή. «Τί θα κάνουν τώρα οι γονείς μας; είπαμε. Πώς θα έρθουν στο σπίτι;». Τα δυο μικρά άρχισαν να κλαίνε. «Ελάτε, τους είπα, θα παρακαλέσουμε τον Χριστό να σταματήση την βροχή». Γονατίσαμε και τα τρία μπροστά στο εικονοστάσι και προσευχηθήκαμε. Σε λίγα λεπτά η βροχή σταμάτησε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι γονείς πρέπει να βοηθούν με διάκριση τα παιδιά από μικρά να πλησιάσουν στον Χριστό και να ζήσουν από μικρά τις ανώτερες χαρές, τις πνευματικές. Όταν αρχίσουν να πηγαίνουν στο σχολείο, πρέπει σιγά-σιγά να τα μάθουν να μελετούν κάποιο πνευματικό βιβλίο και να τα βοηθούν να ζουν πνευματικά. Τότε θα είναι αγγελούδια και με την προσευχή τους θα έχουν μεγάλη παρρησία προς τον Θεό. Τέτοια παιδιά είναι κεφάλαια πνευματικά για τα σπίτια. Ειδικά τα Συναξάρια πολύ βοηθούν τα μικρά παιδιά στην πνευματική ζωή. Εγώ μικρός έπαιρνα κάτι Συναξαράκια που υπήρχαν εκείνα τα χρόνια και έφευγα στο δάσος· μελετούσα, προσευχόμουν. Πετούσα από την χαρά μου. Από δέκα μέχρι δεκαέξι ετών, που άρχισε ο ελληνοϊταλικός πόλεμος, έζησα αμέριμνος την πνευματική ζωή. Οι παιδικές χαρές είναι καθαρές· τυπώνονται στον άνθρωπο και πολύ τον συγκινούν, όταν μεγαλώση. Αν τα παιδιά ζουν πνευματικά, θα ζουν χαρούμενα σ᾿ αυτήν την ζωή και στην άλλη θα χαίρωνται αιώνια κοντά στον Χριστό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι σχέσεις με τους συγγενείς και τους φίλους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κάποια κυρία ρώτησε τί να κάνη με δυο ξαδέλφες της που ζουν για χρόνια παρασιτικά εις βάρος της.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί θέλει; να κάνουμε τώρα καινούργιο Ευαγγέλιο; Από αυτήν ζητάει ο Θεός να τις βοηθάη και Εκείνος θα κάνη ό,τι συμφέρει στην ψυχή τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν ανάμεσα σε συγγενείς δημιουργηθή μια παρεξήγηση, πρέπει να τους πη κανείς κάτι, για να τους βοηθήση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, πρέπει να πη κάτι με τρόπο, γιατί, αν σιωπήση, ίσως κάνη κακό. Αν τον παρεξηγήσουν, να πάη ξανά και να τους πή: «νά με συγχωρήσετε που σάς στενοχώρησα», και στο εξής να τους αφήση και να προσεύχεται γι᾿ αυτούς.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όποιος θέλει να ζήση ειρηνικά, πρέπει να προσέξη ιδιαίτερα τις σχέσεις του με συγγενείς και φίλους. Να μην ξεγελιέται από την ευγένεια που ίσως συναντά. Η κοσμική ευγένεια μπορεί να κάνη πολύ κακό, γιατί έχει υποκρισία. Η εξωτερική συμπεριφορά μπορεί να παρουσιάζη έναν τέλειο άγιο, αλλά, όταν αποκαλυφθή ο εσωτερικός του κόσμος, να είναι τελείως το αντίθετο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, νιώθη κανείς την καλωσύνη του άλλου, είναι σωστό να εκφράζεται γι᾿ αυτήν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είναι πολύ δικός του άνθρωπος, δεν χρειάζεται, γιατί και αυτός κάποτε θα τον είχε εξυπηρετήσει, αλλά και νιώθει την εσωτερική ευγνωμοσύνη που υπάρχει. Αν όμως δεν είναι δικός του άνθρωπος, τότε, με όποιον τρόπο μπορεί, ας εκφράση την ευγνωμοσύνη του. Στους ξένους λέμε «ευχαριστώ». Εάν θελήση λ.χ. ένα παιδί να εκφράση την ευγνωμοσύνη του στους γονείς του, δεν πρέπει να κάνη άλλη δουλειά από το να τους λέη συνέχεια, μέρα-νύχτα, «ευχαριστώ» για όσα κάνουν γι᾿ αυτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολύ βοηθάει το να είναι κανείς απλός στις σχέσεις του με τους άλλους, να έχη γι᾿ αυτούς πάντοτε καλό λογισμό και να μην παίρνη όλους τους ανθρώπους στα σοβαρά. Να αποφεύγη τις συζητήσεις που γίνονται δήθεν για πνευματική ωφέλεια και φέρνουν μάλλον πονοκέφαλο. Να μην περιμένη πνευματική κατανόηση από ανθρώπους που δεν πιστεύουν στον Θεό. Καλύτερα να εύχεται γι᾿ αυτούς να τους συγχωρήση ο Θεός και να τους φωτίση. Να μιλάη στον καθέναν με την δική του γλώσσα και να μη φανερώνη τις μεγάλες αλήθειες που πιστεύει και ζή, γιατί δεν θα τον καταλάβουν, επειδή μιλάει σε άλλη συχνότητα και σε διαφορετικό μήκος κύματος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί λένε: «θέλω να γνωρίσουν και οι άλλοι τον Χριστό, όπως Τον γνώρισα κι εγώ», και κάνουν τον δάσκαλο στους άλλους. Πρέπει όμως η ζωή τους να συμφωνή με αυτά που διδάσκουν. Όταν με την ζωή τους διδάσκουν άλλον Χριστό και δεν ανταποκρίνωνται σε αυτά που λένε, τότε δεν μπορούν να πούν ότι γνώρισαν τον Χριστό. Και αν κανείς δεν έχη βιώματα, θα είναι έξω από την πραγματικότητα καί, αργά ή γρήγορα, θα τον προδώση ο εαυτός του. Όταν με πόνο και αληθινή αγάπη πλησιάσουμε κάποιον, τότε η αληθινή αυτή αγάπη του Χριστού αλλοιώνει τον πλησίον μας. Ο άνθρωπος που έχει αγιότητα, όπου κι αν βρεθή, δημιουργεί κατά κάποιον τρόπο γύρω του ένα ηλεκτρομαγνητικό πνευματικό πεδίο και επηρεάζει όσους βρίσκονται μέσα σ᾿ αυτό. Βέβαια, πρέπει να προσέχουμε να μη σπαταλάμε την αγάπη μας και να μη δίνουμε την καρδιά μας εύκολα, γιατί πολλές φορές μερικοί εκμεταλλεύονται την δική μας καρδιά και μας την κάνουν κιμά ή άλλοτε δεν μπορούν να μας καταλάβουν και μας παρεξηγούν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι πειρασμοί στις γιορτές
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί στις γιορτές συνήθως συμβαίνει κάποιος πειρασμός;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ξέρεις; Στις γιορτές ο Χριστός, η Παναγία, οι Άγιοι έχουν χαρά και κερνούν, δίνουν ευλογίες, δώρα πνευματικά στους ανθρώπους. Εδώ οι γονείς κερνούν, όταν γιορτάζουν τα παιδιά, ή οι βασιλείς χαρίζουν ποινές, όταν γεννιέται κανένα βασιλόπουλο, οι Άγιοι γιατί να μην κεράσουν; Μάλιστα η χαρά που δίνουν κρατάει πολύ και βοηθιούνται πολύ οι ψυχές. Γι᾿ αυτό ο διάβολος, επειδή το ξέρει αυτό, δημιουργεί πειρασμούς, για να στερηθούν οι άνθρωποι τα θεία δώρα και να μη χαρούν ούτε να ωφεληθούν από την γιορτή. Και βλέπεις, μερικές φορές στην οικογένεια, όταν σε μια γιορτή ετοιμάζωνται όλοι να κοινωνήσουν, τους βάζει ο πειρασμός να μαλώσουν, και όχι μόνο δεν κοινωνούν, αλλά ούτε στην εκκλησία πηγαίνουν. Τα φέρνει έτσι τα πράγματα το ταγκαλάκι, ώστε να στερηθούν όλη την θεία βοήθεια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αυτό παρατηρείται και στην δική μας, την καλογερική, ζωή. Πολλές φορές το ταγκαλάκι, επειδή γνωρίζει εκ πείρας ότι θα βοηθηθούμε πνευματικά σε κάποια γιορτή, εκείνη την ημέρα, ή μάλλον από την παραμονή, δημιουργεί έναν πειρασμό – σαν πειρασμός που είναι – και μας χαλάει όλη την διάθεση. Μπορεί λ.χ. να μας βάλη να φιλονικήσουμε με έναν αδελφό, και ύστερα μας θλίβει, μας τσακίζει ψυχικά και σωματικά. Έτσι, δεν μας αφήνει να ωφεληθούμε από την γιορτή με τον χαρούμενο τρόπο της δοξολογίας. Ο Καλός Θεός  όμως, όταν δη ότι δεν δώσαμε εμείς αφορμή, αλλά αυτό έγινε μόνον από φθόνο του πονηρού, μας βοηθάει. Και ακόμη πιο θετικά μας ωφελεί, όταν εμείς παίρνουμε ταπεινά το σφάλμα επάνω μας και δεν κατηγορούμε όχι μόνον τον αδελφό μας αλλά ούτε και τον μισόκαλο διάβολο, διότι η δουλειά του αυτή είναι: να δημιουργή σκάνδαλα και να σκορπάη κακότητα, ενώ ο άνθρωπος ως εικόνα Θεού πρέπει να σκορπάη ειρήνη και καλωσύνη.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Εργασία και πνευματική ζωή
- type: h2
  initial:
    ru: ''
  text:
    ru: Η δουλειά είναι ευλογία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, παλιά έλεγαν: «Καλύτερα να λειώνης σόλες παρά κουβέρτες». Τί εννοούσαν;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ήθελαν να πούν: «Καλύτερα να λειώνης σόλες δουλεύοντας παρά να μένης στο κρεββάτι τεμπελιάζοντας». Η δουλειά είναι ευλογία, είναι δώρο Θεού. Δίνει ζωντάνια στο σώμα, φρεσκάδα στον νού. Εάν δεν έδινε ο Θεός την δουλειά, θα μούχλιαζε ο άνθρωπος. Όσοι είναι εργατικοί, ακόμη και στα γεράματά τους δεν σταματούν να δουλεύουν. Αν σταματήσουν την δουλειά, ενώ ακόμη έχουν δυνάμεις, μελαγχολία θα πάθουν. Αυτό είναι θάνατος γι᾿ αυτούς. Θυμάμαι, ένα γεροντάκι στην Κόνιτσα, κοντά ενενήντα χρονών, συνέχεια δούλευε. Τελικά πέθανε στο χωράφι, δυο ώρες μακριά από το σπίτι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εξάλλου και αυτή η σωματική ανάπαυση που επιζητούν μερικοί δεν είναι μια μόνιμη κατάσταση. Ίσα-ίσα που ξεχνούν το άγχος τους εκείνη την ώρα. Έχουν το φαγητό τους, το γλυκό τους, το μπάνιο τους, την ξεκούρασή τους. Μόλις όμως τελειώσουν αυτά, ζητούν άλλη ανάπαυση. Έτσι είναι συνέχεια στενοχωρημένοι, γιατί πάντα κάτι τους λείπει· νιώθουν ένα κενό και η ψυχή τους ζητά να το συμπληρώση. Ενώ αυτός που κουράζεται με την δουλειά έχει μια συνεχή χαρά, την πνευματική χαρά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν έχης πρόβλημα με την μέση, δεν μπορείς να κάνης οποιαδήποτε εργασία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Καλά, και η μέση δεν χρειάζεται άσκηση; Μια εργασία που είναι σαν άσκηση για την μέση δεν βοηθάει; Κοίταξε να σού πώ: Αν κανείς τρώη, πίνη, κοιμάται και δεν δουλεύη, παθαίνει ένα ξεβίδωμα και θέλει όλο να κοιμάται, γιατί το σώμα του, τα νεύρα του, χαλαρώνουν. Φθάνει σιγά-σιγά να μην μπορή να κάνη τίποτε. Μόλις περπατήση λίγο, κόβεται. Ενώ, αν δουλέψη λίγο και κινηθή, δυναμώνει και στα πόδια και στα χέρια. Βλέπεις, αυτοί που αγαπούν την δουλειά, δεν κοιμούνται πολύ ή, από κούραση, μπορεί και καθόλου να μην κοιμηθούν, αλλά έχουν δυνάμεις, γιατί με την δουλειά ψήνονται και δυναμώνουν σωματικά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Η δουλειά, ειδικά για τον νέο, είναι υγεία. Έχω παρατηρήσει ότι μερικά καλομαθημένα παιδιά, όταν πάνε στον στρατό, ψήνονται, σκληραγωγούνται. Ο στρατός τους κάνει πολύ καλό. Φυσικά αυτό περισσότερο γινόταν παλιά. Σήμερα φοβούνται να ζορίσουν τους στρατιώτες, γιατί με λίγο ζόρισμα κόβουν τις φλέβες, παθαίνουν νευρικό κλονισμό... Εγώ λέω στους γονείς να πληρώνουν κάποιον και να στέλνουν τα παιδιά τους σ᾿ αυτόν να δουλεύουν, για να έχουν την υγεία τους – φθάνει να κάνουν μια δουλειά που να την αγαπούν. Γιατί ένας νέος που έχει νεύρο, έχει και μυαλό, αν δεν δουλεύη, γίνεται νωθρός. Όταν μάλιστα βλέπη τους άλλους να προκόβουν, μπερδεύεται από τον εγωισμό του και δεν ευχαριστιέται με τίποτε. Συνέχεια έχει λογισμούς και το μυαλό του κουρκουτιάζει. Ύστερα πάει και ο διάβολος και του λέει: «Χαμένε, τί ανεπρόκοπος που είσαι! Ο τάδε έγινε καθηγητής, ο άλλος έχει δική του δουλειά και βγάζει χρήματα, εσύ που θα καταλήξης;», οπότε τον απελπίζει. Ενώ, αν δουλέψη, θα αποκτήση εμπιστοσύνη στον εαυτό του, με την καλή έννοια. Θα δη ότι και αυτός μπορεί να τα βγάλη πέρα, αλλά και το μυαλό του θα απασχολήται στην δουλειά και θα γλιτώνη από τους λογισμούς. Γίνονται έτσι δυο καλά.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Εκλογή επαγγέλματος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί γονείς κατευθύνουν τα παιδιά τους προς το δικό τους επάγγελμα, και μάλιστα πολλές φορές γίνονται πιεστικοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, δεν κάνουν καλά. Δεν πρέπει να πιέζουν τα παιδιά τους να κάνουν αυτό που αναπαύει τους ίδιους, αν αυτό δεν αναπαύη και εκείνα. Γνώρισα έναν νέο που ήθελε να σπουδάση θεολογία και να γίνη ιερέας. Η μάνα του όμως δεν τον άφηνε· τον πίεζε να πάη ιατρική. Το παιδί είχε μάθει βυζαντινή μουσική και έψελνε. Είχε κάνει μόνος του και ένα όργανο μουσικό και εύρισκε τους ήχους. Ήξερε τα μουσικά απ᾿ έξω. Είχε χάρισμα. Έφτιαχνε τροπάρια, ακολουθίες... Μόλις τελείωσε το γυμνάσιο, έδωσε εξετάσεις και πέρασε στην Θεολογική Σχολή. Η μάνα του έπαθε νευρικό κλονισμό από την στενοχώρια της. Ερχόταν ύστερα και με παρακαλούσε: «Κάνε προσευχή, Πάτερ, να γίνω καλά, και ας κάνη ό,τι θέλει το παιδί μου». Μόλις έγινε καλά, πάλι δεν τον άφηνε να κάνη αυτό που ήθελε. Ύστερα και αυτός τα παράτησε όλα, και τελικά χαραμίστηκε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εγώ λέω στους νέους που βλέπω να προβληματίζωνται ποιά επιστήμη να ακολουθήσουν: «Δέστε ποιά επιστήμη σάς αρέσει, ώστε να κάνετε αυτό που είναι στην φύση σας». Αν δεν είναι στην φύση τους αυτό που σκέφτονται να κάνουν, προσπαθώ να τους κάνω να δώσουν την καρδιά τους σ᾿ αυτό που είναι στην φύση τους, για να βοηθηθούν. Τους βοηθάω δηλαδή να ακολουθήσουν την επιστήμη που θέλουν και να κάνουν το επάγγελμα που είναι ανάλογο με τις δυνάμεις τους, φθάνει να το κάνουν κατά Θεόν. Έχει κλίση κάποιος στην μουσική; Να γίνη μουσικός ή καλός ιεροψάλτης, που θα βοηθάη με την ζωή του και με την ψαλτική του όσους θα τον ακούν, ώστε να αγαπήσουν την Εκκλησία και την προσευχή. Έχει κλίση στην ζωγραφική; Να γίνη ζωγράφος ή αγιογράφος και να κάνη με ευλάβεια εικόνες, που θα κάνουν θαύματα. Έχει κλίση σε κάποια επιστήμη; Να αφοσιωθή σ᾿ αυτήν και να εργασθή με φιλότιμο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και να δήτε, φαίνεται από μικρός κανείς τί κλίση έχει. Μια φορά στο μοναστήρι στο Στόμιο είχε έρθει κάποιος με δυο ανηψάκια του. Το ένα, έξι-επτά χρονών, κάθησε κοντά μας και συνέχεια μας έκανε διάφορες ερωτήσεις. Το ρωτάω: «Τί θα γίνης, όταν μεγαλώσης;». «Δικηγόρος!», μου λέει. Το άλλο το χάσαμε. Ρωτάω τον θείο του: «Που πήγε το άλλο το παιδί; μήπως πέση σε κανέναν γκρεμό». Βγαίνουμε έξω να το βρούμε και ακούμε κάτι χτυπήματα στο μαραγκούδικο. Πάμε μέσα, και τί να δούμε; Το σανίδι που είναι στον μπάγκο, όπου πλανίζουμε και είναι πολύ λείο, το είχε κάνει με το σκεπάρνι χάλια! «Τί θα γίνης, όταν μεγαλώσης;», το ρωτάω. «Επιπλοποιός!», μου λέει. «Να γίνης, του λέω. Χαλάλι που χάλασε το σανίδι! Δεν πειράζει!».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αγάπη για την δουλειά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί πολλοί άνθρωποι νιώθουν ανία στην δουλειά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως δεν αγαπούν την δουλειά τους; Ή μήπως ασχολούνται με το ίδιο πράγμα; Συχνά, σε μερικές δουλειές, σε ένα εργοστάσιο, ας πούμε, που φτιάχνει κουφώματα, ένας υπάλληλος, από το πρωί ώς την ώρα που θα φύγη, κολλάει-κολλάει· ένας άλλος περνάει συνέχεια τζάμια, άλλος στόκο. Κάνουν συνέχεια την ίδια δουλειά, ένα μονότονο πράγμα, και το αφεντικό τους παρακολουθεί. Και δεν είναι μια μέρα ή δυό. Όλο το ίδιο-τό ίδιο το βαριούνται. Παλιά δεν ήταν έτσι. Ένας μαραγκός παραλάμβανε τέσσερις τοίχους από τους χτίστες και έπρεπε να παραδώση στον νοικοκύρη τελειωμένο το σπίτι με το κλειδί. Θα έφτιαχνε τα πατώματα, τα κουφώματα, θα περνούσε τα τζάμια με στόκο. Ύστερα θα έκανε σκάλες γυριστές, τορναριστά κάγκελα, μετά θα άσπριζε, θα έκανε τα ντουλάπια, τα ράφια, στην συνέχεια θα έκανε και τα έπιπλα. Και αν ακόμη δεν ασχολούνταν ο ίδιος με όλα αυτά, ήξερε όμως να τα φτιάχνη. Σε μια ανάγκη θα έκανε ακόμη και την σκεπή, θα έβαζε και τα κεραμίδια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα πολλοί άνθρωποι είναι βασανισμένοι, γιατί δεν αγαπούν την δουλειά τους. Κοιτάζουν πότε να έρθη η ώρα να φύγουν. Ενώ, όταν υπάρχη ζήλος για την δουλειά και έχη κανείς ενδιαφέρον γι᾿ αυτό που φτιάχνει, όσο δουλεύει, τόσο ανάβει ο ζήλος. Αφοσιώνεται μετά στην δουλειά του καί, όταν είναι να φύγη, λέει: «Πότε πέρασε η ώρα;». Ξεχνάει και το φαγητό και τον ύπνο, τα ξεχνάει όλα. Και νηστικός να είναι, δεν πεινάει, και άυπνος να είναι, δεν νυστάζει, αλλά και χαίρεται που δεν κοιμάται. Δεν είναι ότι βασανίζεται από την πείνα ή από την νύστα· είναι πανηγύρι γι᾿ αυτόν η δουλειά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δυο άνθρωποι που κάνουν την ίδια δουλειά, πώς γίνεται ο ένας να βγαίνη ωφελημένος πνευματικά από αυτό που κάνει και ο άλλος ζημιωμένος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εξαρτάται από το πώς ο καθένας κάνει αυτήν την δουλειά και τί έχει μέσα του. Αν εργάζεται με ταπείνωση και αγάπη, όλα θα είναι φωτισμένα, λαμπικαρισμένα, χαριτωμένα, και θα νιώθη εσωτερική ξεκούραση. Αν όμως βάζη υπερήφανο λογισμό, ότι κάνει την δουλειά καλύτερα από τον άλλον, μπορεί να νιώθη μια ικανοποίηση, αλλά αυτή η ικανοποίηση δεν γεμίζει την καρδιά του, γιατί η ψυχή του δεν πληροφορείται, δεν έχει ανάπαυση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ύστερα, όταν κανείς δεν κάνη την δουλειά του με αγάπη, κουράζεται. Ένας, και μόνον που βλέπει ότι πρέπει να ανεβή μια ανηφόρα, για να τελειώση κάποια δουλειά, κουράζεται, γιατί δεν αγαπάει αυτήν την δουλειά. Ενώ ένας άλλος που την κάνει με την καρδιά του, πάει και έρχεται στην ανηφόρα, χωρίς να το καταλαβαίνη. Ώρες μπορεί λ.χ. να σκαλίζη ένας εργάτης μέσα στον ήλιο και να μην κουράζεται, αν το κάνη με την καρδιά του. Ενώ, αν δεν το κάνη με την καρδιά του, όλο σταματάει, χαζεύει, γκρινιάζει: «ώ, πολλή ζέστη κάνει», λέει, και υποφέρει.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να τον απορροφήση κάποιον η επιστήμη του, η δουλειά του, και να αδιαφορή για την οικογένειά του κ.λπ.;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Την δουλειά του θα την αγαπάη απλά· δεν θα την ερωτευθή. Αν δεν αγαπήση την δουλειά του, θα κουράζεται διπλά, και σωματικά και ψυχικά, οπότε και η σωματική ανάπαυση δεν θα τον ξεκουράζη, γιατί ψυχικά θα είναι κουρασμένος. Η ψυχική κούραση είναι αυτή που καταβάλλει τον άνθρωπο. Όταν δουλεύη κανείς με την καρδιά του και είναι χαρούμενος, είναι ψυχικά ξεκούραστος και εξαφανίζεται η σωματική κούραση. Νά, γνώρισα κάποιον στρατηγό που κάνει ακόμη και τις δουλειές των στρατιωτών. Και πώς πονάει για τους στρατιώτες! Σαν πατέρας! Ξέρετε τί χαρά νιώθει! Κάνει το καθήκον του και χαίρεται. Μια φορά ξεκίνησε μεσάνυχτα από τον Έβρο, για να πάη στην Λάρισα στην μνήμη του Αγίου Αχιλλίου και να προλάβη να είναι στην Θεία Λειτουργία, ενώ ήταν δικαιολογημένος να πάη και αργότερα, στην Δοξολογία που θα έκαναν στο τέλος. Αλλά σού λέει: «Πρέπει να είμαι εγκαίρως, για να τιμήσω τον Άγιο». Όλα τα κάνει με την καρδιά του. Η ευχαρίστηση που νιώθει όποιος κάνει φιλότιμα την δουλειά του είναι καλή ευχαρίστηση. Την έδωσε ο Θεός, για να μην κουράζεται το πλάσμα Του. Αυτή είναι ξεκούραση από την κούραση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο καθένας να αξιοποιήση πνευματικά το χάρισμα που έχει
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το χάρισμα που έχει ο κάθε άνθρωπος πρέπει να το αξιοποιήση στο καλό, γιατί ο Θεός, για να του το δώση, έχει και απαιτήσεις. Το μυαλό λ.χ. είναι μια δύναμη, αλλά, ανάλογα με το πώς το χρησιμοποιεί ο καθένας, μπορεί να κάνη καλό ή κακό. Ένας που έχει πολλή εξυπνάδα, αν την χρησιμοποιήση σωστά, μπορεί να κάνη εφευρέσεις που θα βοηθούν τον κόσμο. Αν όμως δεν την χρησιμοποιήση σωστά, μπορεί να εφευρίσκη, ας υποθέσουμε, πώς να ληστεύη τον άλλον. Ή αυτοί που κάνουν γελοιογραφίες σε εφημερίδες κ.λπ., σε μια γελοιογραφία, σε ένα σκίτσο, κρύβουν ολόκληρο γεγονός. Και αν αυτό έχη σχέση με εκκλησιαστικά θέματα κ.λπ., μπορεί να κρύβη και ολόκληρη θεολογία. Μερικοί από αυτούς, αν σπούδαζαν θεολογία, επειδή ο νούς τους παίρνει στροφές, θα μπορούσαν να εμβαθύνουν πολύ στα θεία νοήματα. Θα αξιοποιούσαν δηλαδή αυτήν την ευστροφία, θα την αγίαζαν, και θα βοηθούσαν και τον εαυτό τους και τους άλλους. Ενώ τώρα πολλοί κάνουν αρνητικό έργο· αν είναι αισχροί, αισχρό, αν είναι γελοίοι, γελοίο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι δηλαδή έχουν κάποια ιδιαίτερη ικανότητα, θα γίνουν ή χρήσιμοι ή καταστρεπτικοί. Ενώ όσοι δεν έχουν κάποια ιδιαίτερη ικανότητα, δεν μπορούν βέβαια να κάνουν κάποιο μεγάλο καλό, αλλά τουλάχιστον δεν μπορούν να κάνουν ούτε μεγάλο κακό.
- type: h2
  initial:
    ru: ''
  text:
    ru: Άγχος και εργασία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πολλοί, όταν επιστρέφουν στο σπίτι από την δουλειά, είναι εκνευρισμένοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εγώ συνιστώ στους άνδρες, μετά την δουλειά τους, αν βρίσκουν καμμιά εκκλησία ανοιχτή, να μπαίνουν να ανάβουν ένα κερί, να μένουν μέσα δέκα-δεκαπέντε λεπτά ή να κάθωνται σε κάποιο πάρκο να διαβάζουν ένα κομματάκι από το Ευαγγέλιο, για να γαληνεύουν λίγο, και ύστερα να πηγαίνουν στα σπίτια τους ήρεμοι και χαμογελαστοί, και όχι να πηγαίνουν εκνευρισμένοι και να στήνουν τον καβγά. Να μη μεταφέρουν τα προβλήματα που αντιμετωπίζουν στην δουλειά τους μέσα στο σπίτι· να τα αφήνουν έξω από την πόρτα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί όμως είναι και κάπως δικαιολογημένοι, γιατί η ευθύνη που έχουν στην δουλειά τους γεμίζει άγχος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τους γεμίζει άγχος, γιατί δεν βάζουν και τον Θεό στις υποθέσεις τους. Ο τεμπέλης που λέει «έ, έχει ο Θεός...», είναι καλύτερος από αυτούς. Εγώ προτιμώ να είναι κανείς υπάλληλος, να κάνη σωστά και με φιλότιμο την δουλειά του, αλλά να απλοποιή την ζωή του, να περιορίζεται στα απαραίτητα και να έχη ήσυχο το κεφάλι του, παρά να είναι εργοστασιάρχης και να είναι συνέχεια «άχ και βάχ», γιατί συνήθως είναι χρεωμένος. Μπαίνει και η υπερηφάνεια, «θά πάρω τόσο δάνειο, να παρουσιάσω κι αυτό και το άλλο, για να τακτοποιηθώ καλύτερα...», και μετά πέφτει έξω, χρεωκοπεί, οπότε μετά πλειστηριασμός κ.λπ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ύστερα πολλοί στην εργασία τους δεν δουλεύουν το μυαλό τους, κουράζονται άσκοπα, και δουλειά δεν βγάζουν. Δεν μπορούν μετά να ανταποκριθούν και τους πιάνει άγχος. Κάποιος λ.χ. θέλει να μάθη μια τέχνη καί, επειδή δεν προσέχει, χρόνια πάει-έρχεται, χωρίς να κάνη προκοπή, γιατί δεν δουλεύει το μυαλό του. Πρέπει να δη τί του χρειάζεται στην δουλειά του και να το προσθέση. Νά, όταν δούλευα στον κόσμο σαν μαραγκός, είδα πώς για τα έπιπλα που έκανα μου χρειαζόταν και ένας τόρνος. Τί; να πήγαινα σε άλλον να μου τα φτιάξη; Πήρα έναν τόρνο και έμαθα να τον δουλεύω. Στην συνέχεια είδα ότι χρειαζόταν να φτιάξω κυκλικές σκάλες. Κάθησα, θυμήθηκα και την γεωμετρία και την αριθμητική και έμαθα να τις φτιάχνω. Αν δεν δουλεύης το μυαλό, θα παιδεύεσαι. Θέλω δηλαδή να τονίσω πώς πρέπει κανείς να δουλεύη το μυαλό του, γιατί επάνω στην δουλειά παρουσιάζονται ένα σωρό περιπτώσεις. Έτσι θα γίνη κανείς καλός τεχνίτης και από εκεί και πέρα θα ξέρη τί να κάνη και θα προχωράη. Όλη η βάση εκεί είναι. Το μυαλό να γεννάη σε όλα. Αλλιώς ο άνθρωπος μένει υπανάπτυκτος και χάνει τον χρόνο του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο αγιασμός της εργασίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο καθένας πρέπει με την προσευχή του, με την ζωή του, να αγιάζη την εργασία του και να αγιάζεται. Αλλά, αν είναι αφεντικό και έχη ευθύνη, να βοηθάη πνευματικά και τους υπαλλήλους του. Αν έχη καλή εσωτερική κατάσταση, αγιάζει και την δουλειά του. Όταν λ.χ. πηγαίνουν νέοι σε έναν τεχνίτη να τους μάθη την δουλειά, παράλληλα πρέπει να βοηθηθούν να ζουν πνευματικά. Αυτό θα ωφελήση και τον ίδιο και τους υπαλλήλους και τους πελάτες του, γιατί ο Θεός θα ευλογή την εργασία του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Το κάθε επάγγελμα αγιάζεται. Ένας γιατρός λ.χ. δεν πρέπει να ξεχνάη ότι στην ιατρική αυτό που βοηθάει πολύ είναι η Χάρις του Θεού. Γι᾿ αυτό να προσπαθήση να γίνη δοχείο της θείας Χάριτος. Ο γιατρός που είναι καλός Χριστιανός, παράλληλα με την επιστήμη του, βοηθάει τους αρρώστους με την καλωσύνη και με την πίστη του, γιατί τους ενθαρρύνει να αντιμετωπίζουν την αρρώστια τους με πίστη. Σε μια σοβαρή αρρώστια μπορεί να πη στον άρρωστο: «Μέχρις εδώ έχει προχωρήσει η επιστήμη. Από ᾿δώ και πέρα όμως υπάρχει και ο Θεός που κάνει θαύματα».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ή ένας δάσκαλος πρέπει να προσπαθήση να κάνη την διακονία του δασκάλου με χαρά και να βοηθάη τα παιδιά για την πνευματική αναγέννηση, πράγμα που δεν έχουν την δυνατότητα όλοι οι γονείς να το κάνουν, έστω και αν έχουν καλή διάθεση. Να φροντίση παράλληλα με τα γράμματα που μαθαίνουν τα παιδιά να γίνουν και σωστοί άνθρωποι. Διαφορετικά, τί θα τους ωφελήσουν τα γράμματα; Η κοινωνία έχει ανάγκη από σωστούς ανθρώπους, οι οποίοι, όποιο επάγγελμα κι αν κάνουν, θα το κάνουν καλά. Ο δάσκαλος δεν πρέπει να κοιτάζη μόνον αν οι μαθητές ξέρουν καλά το μάθημα, αλλά να λαμβάνη υπ᾿ όψιν του και άλλα καλά που έχουν τα παιδιά, όπως την ευλάβεια, την καλωσύνη, το φιλότιμο. Οι βαθμοί του Θεού δεν συμφωνούν πάντοτε με τους βαθμούς των δασκάλων. Μπορεί το τέσσερα ενός παιδιού για τον Θεό να είναι δέκα και μπορεί το δέκα ενός άλλου για τον Θεό να είναι τέσσερα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το επάγγελμα δεν κάνει τον άνθρωπο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος ζορίζεται σε μια δουλειά, τί φταίει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μήπως δεν την αντιμετωπίζει με καλούς λογισμούς; Αν την αντιμετωπίζη όμορφα, τότε, όποια δουλειά και αν κάνη, θα είναι πανηγύρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, και όταν κανείς στενοχωριέται, γιατί κάνει μια δουλειά βαρειά ή καταφρονητική, λ.χ. χτίζει ή πλένει κατσαρόλες σε κάποιο μαγειρείο κ.λπ., πώς πρέπει να τοποθετηθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν σκεφθή ότι ο Χριστός έπλυνε τα πόδια των μαθητών Του[58], θα πάψη να στενοχωριέται. Με αυτό που έκανε ο Χριστός ήταν σαν να μας έλεγε: «Έτσι πρέπει να κάνετε και εσείς». Είτε κατσαρόλια πλένει κανείς είτε σκάβει, να χαίρεται. Άλλος καθαρίζει υπονόμους, γιατί δεν έχει άλλη δουλειά και είναι ο καημένος συνέχεια μέσα στα μικρόβια. Αυτός δεν είναι άνθρωπος; Δεν είναι εικόνα Θεού; Ήταν ένας οικογενειάρχης που είχε σαν επάγγελμα να καθαρίζη υπονόμους και είχε φθάσει σε μεγάλη πνευματική κατάσταση. Είχε πάθει φυματίωση καί, ενώ είχε την δυνατότητα να φύγη, δεν ήθελε, επειδή σκεφτόταν, γιατί να παιδεύεται κάποιος άλλος; Αγαπούσε την περιφρονημένη ζωή, γι᾿ αυτό ο Θεός τον χαρίτωσε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Το επάγγελμα δεν κάνει τον άνθρωπο. Εγώ γνώρισα έναν αχθοφόρο που είχε αναστήσει νεκρό. Όταν ήμουν δικαίος[59]͵ στην Σκήτη των Ιβήρων, με επισκέφθηκε μια μέρα κάποιος που ήταν περίπου πενήντα πέντε χρονών. Είχε έρθει αργά το απόγευμα και δεν χτύπησε, για να μην ενοχλήση τους Πατέρες και κοιμήθηκε έξω. Όταν τον είδαν οι Πατέρες, τον πήραν μέσα και με ειδοποίησαν. «Καλά, του είπα, γιατί δεν χτύπησες το καμπανάκι, για να σού ανοίξουμε και να σε τακτοποιήσουμε;». «Τί λές, Πάτερ μου, πώς να ενοχλήσω τους Πατέρες;», μου είπε. Βλέπω, το πρόσωπό του είχε μία λάμψη. Κατάλαβα ότι θα ζούσε πολύ πνευματικά. Μου είπε μετά ότι είχε μείνει μικρός ορφανός από πατέρα και γι᾿ αυτό, όταν παντρεύτηκε, αγαπούσε πάρα πολύ τον πεθερό του. Πρώτα περνούσε από το σπίτι των πεθερικών του και μετά πήγαινε στο σπίτι του. Στενοχωριόταν όμως, γιατί ο πεθερός του έβριζε πολύ. Πολλές φορές τον είχε παρακαλέσει να μη βρίζη, αλλά εκείνος γινόταν χειρότερος. Κάποτε αρρώστησε βαριά ο πεθερός του. Τον πήγαν στο νοσοκομείο και μετά από λίγες μέρες πέθανε. Εκείνος δεν ήταν κοντά του την ώρα που ξεψύχησε, γιατί έπρεπε να ξεφορτώση ένα πλοίο. Όταν πήγε στο νοσοκομείο και τον βρήκε στο νεκροστάσιο, προσευχήθηκε με πολύ πόνο: «Θεέ μου, Σε παρακαλώ, είπε, ανάστησέ τον, για να μετανοήση, και μετά πάρ᾿ τον». Αμέσως ο νεκρός άνοιξε τα μάτια του και άρχισε να κουνάη τα χέρια του. Το προσωπικό, μόλις τον είδαν, εξαφανίσθηκαν. Τον τακτοποίησε και τον πήγε στο σπίτι του εντελώς καλά. Έζησε πέντε χρόνια με μετάνοια και μετά πέθανε. «Πάτερ μου, μου είπε, ευχαριστώ πολύ τον Θεό, που μου έκανε αυτήν την χάρη. Ποιός είμαι εγώ, για να μου κάνη ο Θεός τέτοια χάρη;». Είχε πολλή απλότητα και τέτοια ταπείνωση, που ούτε καν του περνούσε από το μυαλό ότι ανέστησε νεκρό. Είχε διαλυθή από ευγνωμοσύνη προς τον Θεό γι᾿ αυτό που του έκανε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πολλοί άνθρωποι βασανίζονται, γιατί δεν κατορθώνουν να δοξασθούν με μάταιες δόξες ή να πλουτίσουν με μάταια πράγματα. Δεν σκέφτονται ότι αυτά στην άλλη, την αληθινή, ζωή ούτε χρειάζονται, αλλά ούτε και μεταφέρονται. Εκεί μόνον τα έργα μας θα μεταφέρουμε, τα οποία θα μας βγάλουν από εδώ και το ανάλογο διαβατήριο για το μεγάλο και αιώνιο ταξίδι μας.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 3 – Η εγκράτεια στην καθημερινή ζωή
- type: h2
  initial:
    ru: ''
  text:
    ru: Με την άσκηση εξαϋλώνεται ο άνθρωπος
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, κάποια φορά μας είχατε πεί: «χρειάζεται αποκλεισμός στον πνευματικό αγώνα». Τί εννοούσατε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στον πόλεμο προσπαθούν τον εχθρό να τον αποκλείσουν. Τον περικυκλώνουν, τον κλείνουν μέσα στα τείχη, τον αφήνουν νηστικό. Μετά του κόβουν και το νερό. Γιατί ο εχθρός, αν δεν έχη βασικά εφόδια και πυρομαχικά, θα αναγκασθή να παραδοθή. Έτσι, θέλω να πώ, και με την νηστεία και την αγρυπνία αφοπλίζεται ο διάβολος και υποχωρεί. «Νηστεία, αγρυπνία, προσευχή, ουράνια χαρίσματα λαβών...»[60], λέει ο υμνωδός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Με την άσκηση εξαϋλώνεται ο άνθρωπος. Φυσικά πρέπει να εγκρατεύεται κανείς αποβλέποντας σε έναν ανώτερο πνευματικό σκοπό. Αν κάνη εγκράτεια, για να αποτοξινωθή από τα λίπη, πάλι για το καλό του σαρκίου του φροντίζει. Τότε η άσκησή του μοιάζει με την γιόγκα. Δυστυχώς το θέμα της ασκήσεως ακόμη και άνθρωποι της Εκκλησίας το έχουν κάνει στην άκρη. «Πρέπει να φάω, λένε, το φαγάκι μου, να απολαύσω και εκείνο και το άλλο, γιατί ο Θεός όλα τα έφτιαξε για μάς». Ξέρετε τί μου είπε μια φορά ένας αρχιμανδρίτης σε ένα τραπέζι που μας είχαν κάνει; Εγώ δεν μπορούσα να βιάσω τον εαυτό μου να φάω περισσότερο από όσο έτρωγα και εκείνος το πρόσεξε και μου είπε: «Όποιος φθείρει τον ναό του Θεού, «φθερεί τούτον ο Θεός"»[61]! «Μήπως το πήρες ανάποδα; του λέω. Στην άσκηση αναφέρεται αυτό ή στην ασωτία; Το χωρίο εννοεί αυτούς που φθείρουν, που καταστρέφουν τον ναό του Θεού με την ασωτία, με τις καταχρήσεις· δεν εννοεί αυτούς που κάνουν άσκηση από αγάπη προς τον Χριστό». Και βλέπεις, ανέπαυε τον λογισμό του και έλεγε: «Πρέπει να τρώμε, για να μη φθείρουμε τον ναό του Θεού»! Κάποιος άλλος, μετά από μια επίσκεψή του σε κάποια Μονή, μου είπε: «Πήγα σε ένα μοναστήρι και οι καλόγεροι αρρώστησαν από την πολλή νηστεία που έκαναν. Τα ασκιά με το λάδι ήταν άθικτα. Αυτά κάνουν, Πάτερ μου, η νηστεία και η αγρυπνία»! Τί να πής; Τέτοιοι άνθρωποι θέλουν να μη στερηθούν τίποτε. Τρώνε το φαγητό τους, το φρούτο τους, το γλυκό τους και έπειτα, για να δικαιολογήσουν τον εαυτό τους, κατηγορούν τους άλλους που κάνουν άσκηση. Δεν έχουν αισθανθή την πνευματική χαρά της ασκήσεως. Σού λέει ο άλλος: «Πρέπει να πιώ τόσα ποτήρια γάλα. Θα νηστέψω την Σαρακοστή, αλλά μετά θα τα συμπληρώσω, γιατί πρέπει να πάρω τόσο λεύκωμα». Δεν είναι ότι το έχει ανάγκη ο οργανισμός του, αλλά λέει ότι το δικαιούται και αναπαύει τον λογισμό του ότι είναι εντάξει, ότι δεν είναι αμαρτία. Μά και μόνο να σκεφθή κανείς έτσι είναι αμαρτία. Που φθάνει η ανθρώπινη λογική; Να είναι εντάξει και με τις νηστείες που έχει καθορίσει η Εκκλησία, αλλά να μη στερηθή και αυτά που έχασε στο διάστημα της νηστείας. Έ, πώς να σταθή μετά το Άγιο Πνεύμα;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπεις, μερικοί οικογενειάρχες τί φιλότιμο έχουν! Πήγε κάποτε να εξομολογηθή κάποιος πολύ απλός, που είχε εννιά παιδιά, και του είπε ο Πνευματικός να κοινωνήση. «Έμ, πώς να κοινωνήσω; του λέει. Βάζουμε λίγο λάδι στο φαγητό, γιατί δουλεύω και εγώ και τα παιδιά μου». «Πόσα παιδιά έχεις;», τον ρωτάει ο Πνευματικός. «Εννιά». «Πόσο λάδι βάζετε στο φαγητό;». «Δυο κουτάλια». «Πόσο λάδι σού πέφτει, κακομοίρη μου; του λέει ο Πνευματικός, πήγαινε να κοινωνήσης!». Ήταν έντεκα άτομα και έτρωγαν δυο κουταλάκια λάδι όλο κι όλο και τον πείραζε ο λογισμός!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχω γνωρίσει λαϊκούς που αγίασαν με την άσκηση που έκαναν. Νά, δεν έχει πολλά χρόνια που στο Άγιον Όρος εργαζόταν για αρκετό καιρό ένας λαϊκός με το παιδί του. Έπειτα βρέθηκε μια καλή δουλειά στην πατρίδα τους και ο πατέρας αποφάσισε να φύγη και να πάρη και το παιδί, για να είναι όλη η οικογένεια κοντά. Το παιδί του όμως είχε συγκινηθή από την ασκητική ζωή των μοναχών και έχοντας υπ᾿ όψιν του και την κοσμική ζωή με το άγχος δεν θέλησε να τον ακολουθήση και να γυρίση στον κόσμο. «Αφού, πατέρα, έχεις και άλλα παιδιά, του είπε, άφησε και ένα στο Περιβόλι της Παναγίας». Επειδή επέμενε, αναγκάσθηκε  ο πατέρας του να τον αφήση. Το παλληκάρι αυτό ήταν αγράμματο, αλλά ήταν πολύ ευαίσθητο και είχε πολύ φιλότιμο και απλότητα. Αισθανόταν τον εαυτό του πολύ ανάξιο, για να γίνη μοναχός, επειδή νόμιζε ότι δεν θα μπορέση να ανταποκριθή στα μοναχικά του καθήκοντα. Βρήκε λοιπόν μια μικρή καλύβα, που την χρησιμοποιούσαν παλιά για τα ζώα, έκλεισε με πέτρες και φτέρες την πόρτα και το παράθυρο και άφησε μια μικρή στρογγυλή τρύπα, για να μπαινοβγαίνη στρυμωχτά, την οποία έκλεινε από μέσα με ένα κουρελιασμένο παλτό, που είχε βρει εκεί πεταγμένο. Ούτε φωτιά δεν άναβε. Οι φωλιές των πουλιών φυσικά ήταν καλύτερες από την φωλιά του, όπως και τα γιατάκια των ζώων πάλι ήταν καλύτερα από το δικό του. Την χαρά όμως που είχε αυτή η ψυχή δεν την έχουν όσοι ζουν σε πλούσια παλάτια, γιατί αυτός αγωνιζόταν για τον Χριστό, και ο Χριστός ήταν κοντά του, όχι μόνο στην καλύβα του, αλλά και μέσα στο πνευματικό του σπίτι, στο σώμα του, στην καρδιά του. Γι᾿ αυτό ζούσε μέσα στον Παράδεισο. Από την φωλιά του έβγαινε κατά καιρούς και περνούσε από κανένα Κελλί, στο οποίο οι Πατέρες είχαν εξωτερικές εργασίες στους κήπους. Βοηθούσε στις δουλειές και του έδιναν λίγο παξιμάδι και λίγες ελιές. Εάν δεν τον άφηναν να εργασθή, δεν δεχόταν ευλογίες. Τις ευλογίες που έπαιρνε, έπρεπε να τις πληρώση με την εργασία του διπλά. Φυσικά την πνευματική του ζωή μόνον ο Θεός την γνώριζε, γιατί ζούσε στην αφάνεια, απλά και αθόρυβα. Από ένα όμως περιστατικό που έγινε γνωστό μπορεί κανείς πολλά να καταλάβη. Μια φορά πέρασε από ένα μοναστήρι και ρώτησε πότε αρχίζει η Μεγάλη Σαρακοστή – αν και γι᾿ αυτόν όλος ο χρόνος σχεδόν ήταν Μεγάλη Σαρακοστή –, και ύστερα πήγε και κλείστηκε στην φωλιά του. Πέρασαν σχεδόν τρεις μήνες, χωρίς να καταλάβη πότε πέρασαν. Κάποια μέρα βγήκε και πήγε σε ένα μοναστήρι να ρωτήση πότε είναι το Πάσχα. Παρακολούθησε την ακολουθία, κοινώνησε στην Θεία Λειτουργία και εν συνεχεία πήγε με τους Πατέρες στην τράπεζα. Βλέπει στην τράπεζα κόκκινα αυγά – ήταν απόδοση του Πάσχα. Παραξενεύτηκε και ρώτησε έναν αδελφό: «Καλά, ήρθε το Πάσχα;». «Τί Πάσχα; του απαντά ο αδελφός. Αύριο είναι της Αναλήψεως!». Δηλαδή είχε νηστέψει όλη την Μεγάλη Σαρακοστή και άλλες σαράντα μέρες μέχρι της Αναλήψεως! Με τέτοιον τρόπο αγωνιζόταν μέχρι την ώρα του θανάτου του. Τον βρήκε νεκρό ένας κυνηγός δύο μήνες μετά τον θάνατό του και ειδοποίησε την αστυνομία και τον γιατρό. Ο γιατρός μου είπε: «Όχι μόνο δεν μύριζε, αλλά αντιθέτως είχε μια ευωδία».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Νηστεία παιδιών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παιδάκια πέντε-έξι ετών πρέπει να νηστεύουν πριν από την Θεία Κοινωνία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τουλάχιστον το βράδυ να έχουν φάει λαδερό φαγητό. Αλλά αυτό είναι θέμα Πνευματικού. Καλύτερα η μητέρα να ρωτήση τον Πνευματικό, γιατί μπορεί το παιδάκι να έχη πρόβλημα με την υγεία του και να πρέπη λ.χ. να πιή γάλα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένα παιδάκι πόσο πρέπει να νηστεύη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αν το παιδί είναι γερό, έχη υγεία, μπορεί να νηστεύη. Άλλωστε τώρα υπάρχουν ένα σωρό τροφές νηστήσιμες. Παλιά τα παιδιά νήστευαν και όλη μέρα έτρεχαν και έπαιζαν, αλλά έτρωγαν πολλές φορές. Στα Φάρασα, την Μεγάλη Σαρακοστή όλοι, μικροί-μεγάλοι, έκαναν ενάτη[62]. Μάζευαν οι γονείς τα παιδιά στο Κάστρο[63], τους έδιναν παιχνίδια, για να παίζουν, και στις τρεις το απόγευμα, που χτυπούσε η καμπάνα για Προηγιασμένη, πήγαιναν και κοινωνούσαν. Έλεγε ο Άγιος Αρσένιος: «Τα παιδιά, όταν παίζουν όλη την ημέρα, δεν θυμούνται το φαγητό· τώρα που θα βοηθήση και ο Χριστός, δεν θα αντέξουν;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και οι μεγάλοι, όταν δεν νηστεύουν, ελέγχονται βλέποντας τα παιδιά να νηστεύουν. Όταν μικρός δούλευα με τον μάστορά μου για πολύ καιρό σε κάποιο σπίτι και τρώγαμε εκεί, Τετάρτη και Παρασκευή έφευγα και πήγαινα να φάω στο σπίτι μου, γιατί αυτοί δεν νήστευαν. Μια φορά, Τετάρτη ήταν, έφεραν να με κεράσουν μπακλαβά. «Ευχαριστώ, τους είπα, αλλά νηστεύω». «Για δές, είπαν, μικρό παιδί να νηστεύη και εμείς μεγάλοι άνθρωποι να τρώμε!».
- type: h2
  initial:
    ru: ''
  text:
    ru: Νηστεία με φιλότιμο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Με την νηστεία ο άνθρωπος δείχνει την προαίρεσή του. Κάνει από φιλότιμο μια άσκηση και ο Θεός βοηθάει. Αν όμως ζορίζη τον εαυτό του και πη «τί να κάνω; είναι Παρασκευή, πρέπει να νηστέψω», θα βασανίζεται. Ενώ, αν μπή στο νόημα και νηστέψη από αγάπη για τον Χριστό, θα χαίρεται. «Αυτήν την ημέρα, να σκεφθή, ο Χριστός σταυρώθηκε· ούτε νερό δεν Του έδωσαν να πιή· ξίδι Του έδωσαν[64]. Κι εγώ δεν θα πιώ νερό όλη την ημέρα». Αν το κάνη αυτό, τότε θα νιώθη ανώτερη χαρά μέσα του από αυτόν που πίνει τα καλύτερα αναψυκτικά!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Και βλέπεις, πολλοί κοσμικοί μια Μεγάλη Παρασκευή δεν μπορούν να νηστέψουν, αλλά έξω από το Υπουργείο μπορούν να κάθωνται και να κάνουν απεργία πείνας για ένα πείσμα, για να πετύχουν κάτι. Εκεί ο διάβολος τους δίνει κουράγιο. Αυτοκτονία είναι αυτό που κάνουν. Άλλοι πάλι, όταν έρχεται το Πάσχα, ψάλλουν το «Χριστός Ανέστη» με χαρά και με όλη τους την δύναμη, γιατί θα φάνε καλά. Μοιάζουν με τους Ιουδαίους που ήθελαν να κάνουν βασιλιά τον Χριστό, επειδή τους τάισε στην έρημο[65].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θυμάστε τί λέει και ο Προφήτης; «Επικατάρατος ο ποιών τα έργα Κυρίου αμελώς»[66]. Άλλο είναι, όταν κανείς έχη καλή διάθεση να νηστέψη, αλλά δεν μπορή, γιατί, αν δεν φάη, τρέμουν τα πόδια του, πέφτει κάτω – δεν τον βοηθάει δηλαδή η αντοχή του, η υγεία του κ.λπ. – και άλλο να έχη δυνάμεις και να μη νηστεύη. Που είναι η καλή διάθεση τότε; Και η στενοχώρια αυτού που θέλει να κάνη έναν αγώνα και δεν μπορεί, αναπληρώνει πολλή άσκηση, και αυτός έχει πιο πολύ μισθό από τον άλλον που έχει κουράγιο και κάνει έναν αγώνα, γιατί εκείνος νιώθει και μια ευχαρίστηση. Ήρθε σήμερα μια φουκαριάρα, πενήντα πέντε χρονών περίπου, και έκλαιγε, γιατί δεν μπορεί να νηστέψη. Την έχει χωρίσει ο άνδρας της. Ένα παιδί είχε, το έχασε και αυτό σε κάποιο δυστύχημα και έμεινε μόνη της. Η μάνα της πέθανε, δεν έχει ούτε σπίτι ούτε φαγητό, και την παίρνει πότε η μια και πότε η άλλη στο σπίτι της και κάνει καμμιά δουλειά εκεί. «Έχω βάρος μεγάλο στην συνείδησή μου, Πάτερ, μου είπε η καημένη, γιατί δεν κάνω τίποτε· και το χειρότερο από όλα είναι, που δεν μπορώ να κάνω νηστείες. Ό,τι μου δίνουν τρώω. Μερικές φορές Τετάρτη και Παρασκευή μου δίνουν νηστήσιμα, αλλά συχνά μου δίνουν αρτυμένα και αναγκάζομαι να τα τρώω, γιατί εξαντλούμαι και δεν μπορώ να σταθώ στα πόδια μου». «Φάε, της λέω, αφού δεν έχεις κουράγιο». Πρέπει να παρακολουθή κανείς τον εαυτό του. Αν δη ότι δεν αντέχει, θα φάη λίγο παραπάνω. «Μέτρησον τον εαυτόν σου»[67], λέει ο Όσιος Νείλος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παλιά, πώς μερικές γυναίκες στα χωριά δεν έτρωγαν τίποτε από την Καθαρά Δευτέρα μέχρι το Σάββατο του Αγίου Θεοδώρου; Με ένα σωρό δουλειές, σπίτι, παιδιά, ζώα, χωράφια, πώς άντεχαν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Με τον λογισμό τους έλεγαν: «Κανονικά πρέπει να φάμε το Μέγα Σάββατο». Οπότε, σού λέει, αυτό το Σάββατο είναι κοντά. Ή μπορεί να έλεγαν: «Ο Χριστός σαράντα μέρες νήστεψε[68], εγώ τί είναι να νηστέψω μια εβδομάδα;». Ύστερα είχαν απλότητα, γι᾿ αυτό άντεχαν. Αν έχη κανείς απλότητα, ταπείνωση, δέχεται την Χάρη του Θεού, νηστεύει ταπεινά και τρέφεται θεϊκά. Τότε έχει θεϊκή δύναμη και πολλή αντοχή σε μεγάλες νηστείες. Στην Αυστραλία ένας νέος περίπου είκοσι επτά χρονών έφθασε σε σημείο να μη φάη τίποτε για είκοσι οκτώ ημέρες. Τον είχε στείλει ο Πνευματικός του να μου το πή. Ήταν πολύ ευλαβής και είχε πολύ αγωνιστικό πνεύμα. Εξομολογείτο, εκκλησιαζόταν, μελετούσε πατερικά βιβλία, και κυρίως την Καινή Διαθήκη. Μια μέρα εκεί που διάβαζε στο Ευαγγέλιο ότι ο Χριστός νήστεψε σαράντα μέρες συγκινήθηκε πολύ και σκέφτηκε: «Αν ο Κύριος που ήταν Θεός και ως άνθρωπος αναμάρτητος νήστεψε σαράντα μέρες[69], εγώ σαν άνθρωπος πολύ αμαρτωλός, τί πρέπει να κάνω;». Γι᾿ αυτό ζήτησε ευλογία από τον Πνευματικό του να νηστέψη και αυτός, αλλά δεν σκέφτηκε να του πη τον λογισμό του ότι ήθελε να μη φάη τίποτε σαράντα μέρες. Άρχισε λοιπόν την νηστεία του από την Καθαρά Δευτέρα, πέρασε και την Κυριακή της Σταυροπροσκυνήσεως, χωρίς να πιή ούτε νερό, ενώ εργαζόταν σε εργοστάσιο και έκανε μάλιστα βαρειά δουλειά – στοίβαζε κιβώτια. Όταν έφθασε η εικοστή ογδόη ημέρα, αισθάνθηκε μια μικρή ζάλη την ώρα που δούλευε, γι᾿ αυτό κάθησε λίγο. Ύστερα ήπιε ένα τσάι και έφαγε λίγο παξιμάδι, γιατί σκέφτηκε πώς, αν πέση κάτω και τον μεταφέρουν σε νοσοκομείο, θα διαπιστώσουν ότι το έπαθε από νηστεία και θα πούν: «Για δές, οι Χριστιανοί πεθαίνουν από την νηστεία». «Γέροντα, μου είπε, μετά από την νηστεία τόσων ημερών, απεχθανόμουν τις τροφές, αλλά πίεζα τον εαυτό μου κάτι να τρώω, για να μπορώ να εργάζωμαι». Τον πείραζε όμως ο λογισμός του που δεν συμπλήρωσε τις σαράντα μέρες και το είπε στον Πνευματικό του. Εκείνος του είπε με διάκριση: «Και αυτές οι ημέρες που νήστεψες ήταν αρκετές· μην έχης λογισμούς». Στην συνέχεια τον έστειλε σ᾿ εμένα, για να μην του μείνη κανένας λογισμός και βασανίζεται. Για να είμαι σίγουρος ότι τα κίνητρά του ήταν αγνά, τον ρώτησα: «Έκανες όρκο να νηστέψης σαράντα μέρες;». «Όχι», μου λέει. «Όταν πήρες ευλογία από τον Πνευματικό σου να νηστέψης, δεν σκέφθηκες εκείνη την ώρα να πής τον λογισμό σου, ότι δηλαδή ήθελες να μη φάς τίποτε σαράντα μέρες ή έκρυψες τον δήθεν καλό λογισμό σου, για να νηστέψης με το θέλημά σου σαράντα μέρες;». «Όχι, Πάτερ», μου είπε. Τότε του είπα: «Αυτό φυσικά το ήξερα· απλώς σε ρώτησα, για να καταλάβης μόνος σου ότι έχεις μισθό ουράνιο για τις ημέρες που νήστεψες, οι οποίες ήταν αρκετές, και να μην ανησυχής που δεν μπόρεσες να κρατήσης σαράντα μέρες. Άλλη φορά όμως να λές στον Πνευματικό σου και τους καλούς λογισμούς που έχεις και ό,τι καλό κρύβεις στην καρδιά σου, και ο Πνευματικός σου θα κρίνη, αν πρέπη να κάνης μια άσκηση κ.λπ.». Επειδή είχε πολλή ταπείνωση, χάρη στους ταπεινούς λογισμούς που καλλιεργούσε, και έκανε την νηστεία αυτή από πολύ φιλότιμο για τον Χριστό, επόμενο ήταν να τον ενισχύη ο Χριστός με την θεία Του Χάρη. Αν πάη και κάποιος άλλος να κάνη μια τέτοια νηστεία και πη εγωιστικά «γιατί να μην το κάνω και εγώ, αφού το έκανε αυτός;», μιά-δυό μέρες μόνο θα νηστέψη και θα σωριαστή κάτω. Θα σκοτιστή και το μυαλό του, γιατί θα τον εγκαταλείψη η Χάρις του Θεού και θα λυπηθή ακόμη και τον κόπο που έκανε. Μπορεί να φθάση να πή: «Και τί βγήκε μ᾿ αυτό;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο άνθρωπος με την νηστεία γίνεται αρνί. Όταν γίνεται θηρίο, σημαίνει ότι η άσκηση που κάνει ή είναι πάνω από τις δυνάμεις του ή την κάνει από εγωισμό, γι᾿ αυτό δεν δέχεται θεία βοήθεια. Αλλά και τα άγρια ζώα, τα θηρία, μερικές φορές τα ημερεύει, τα ταπεινώνει η νηστεία. Βλέπεις, όταν πεινούν, πλησιάζουν τον άνθρωπο. Από ένστικτο νιώθουν ότι από την πείνα θα ψοφήσουν, ενώ, αν πλησιάσουν τον άνθρωπο, για να βρουν τροφή, μπορεί να μην πάθουν τίποτε. Εγώ είδα λύκο που ήταν σαν αρνάκι, γιατί ήταν νηστικός. Είχε κατεβή στην αυλή μας μια φορά τον χειμώνα με χιόνια πολλά. Είχαμε βγή με τον αδελφό μου να ταΐσουμε τα ζώα και εγώ κρατούσα το λυχνάρι. Πήρε ο αδελφός μου το φουρνόξυλο και τον χτυπούσε και δεν αντιδρούσε καθόλου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν δεν φθάση κανείς, ό,τι κάνει, να το κάνη από αγάπη προς τον Θεό και προς τον συνάνθρωπό του, κάνει σπατάλη. Αν νηστεύη και έχη υπερήφανο λογισμό ότι κάτι κάνει, πάει χαμένη η νηστεία του. Είναι μετά σαν ένα τρύπιο ντεπόζιτο που δεν κρατάει τίποτε. Ρίξε νερό μέσα σε ένα τρύπιο ντεπόζιτο· σιγά-σιγά φεύγει όλο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η ευχαρίστηση του ελαφρού στομαχιού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν δεν κάνη κανείς εγκράτεια, έχει επάνω του αποθήκες ολόκληρες. Ενώ, όταν κάνη εγκράτεια και τρώη αυτό που του χρειάζεται, το καίει ο οργανισμός του και δεν αποθηκεύει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ποικιλία των φαγητών τεντώνει το στομάχι και φέρνει όρεξη, αλλά και δημιουργεί χαύνωση και πυρώσεις. Αν στο τραπέζι υπάρχη μόνον ένα φαγητό και δεν είναι πολύ νόστιμο, ίσως να μην το φάη κανείς όλο ή, αν είναι νόστιμο και λαιμαργήση, ίσως φάη λίγο παραπάνω. Όταν όμως υπάρχη ψάρι, σούπα, πατάτες, τυρί, αυγό, σαλάτα, φρούτο, γλυκό, θέλει όλα να τα φάη και ζητάει και άλλα. Όλα τα τραβάει η όρεξη, γιατί το ένα παρακινεί στο άλλο. Και βλέπεις, ο άνθρωπος έναν λόγο δεν σηκώνει· τον έναν δεν τον χωνεύει, τον άλλον δεν τον χωνεύει, ενώ το καημένο το στομάχι, ό,τι του ρίχνουμε, το υπομένει. Το ρωτήσαμε αν τα χωνεύη; Το στομάχι δηλαδή που δεν έχει λογική, μας περνάει στην αρετή και αγωνίζεται όλα να τα χωνέψη. Και αν δεν ταιριάζη το ένα είδος με το άλλο, όταν μπούν μέσα, μαλώνουν, και τί να κάνη τότε και εκείνο; Αρχίζει μετά η βαρυστομαχιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς μπορείς, Γέροντα, να κόψης την συνήθεια να τρώς πολύ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χρειάζεται λίγο φρένο. Ας μη φάς κάτι που σού αρέσει, για να μην ανοίγης δουλειά, γιατί σιγά-σιγά μεγαλώνει η αχυρώνα. Το στομάχι, ο κακός «τελώνης» που λέει ο Αββάς Μακάριος[70], μετά συνέχεια ζητάει. Την ώρα του φαγητού ευχαριστιέσαι, ύστερα όμως θέλεις να κοιμηθής· ούτε να δουλέψης μπορείς. Αν τρώς ένα είδος φαγητού, αυτό βοηθάει να κόψης την όρεξη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άν, Γέροντα, υπάρχη ποικιλία φαγητών, αλλά σε μικρές ποσότητες, υπάρχει πάλι η ίδια δυσκολία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, πάλι η ίδια δυσκολία είναι, αλλά είναι μικρά τα ...κόμματα και δεν μπορούν να κάνουν κυβέρνηση!... Όταν υπάρχη μεγάλη ποικιλία, είναι σαν να μαζεύωνται πολλά ...κόμματα στο στομάχι και το ένα κόμμα ερεθίζει το άλλο, πιάνονται μεταξύ τους, χτυπιούνται και αρχίζει βαρυστομαχιά...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ευχαρίστηση από το λιτό φαγητό είναι μεγαλύτερη από την ευχαρίστηση που δίνουν τα καλύτερα φαγητά. Όταν μικρός έφευγα στο δάσος και έτρωγα μόνον ένα κομμάτι κουλούρα, ώ, δεν ήθελα τίποτε άλλο! Τα καλύτερα φαγητά δεν μπορούσαν να αντικαταστήσουν εκείνη την πνευματική ευχαρίστηση που ένιωθα. Αλλά το έκανα με χαρά. Πολλοί άνθρωποι όμως δεν έχουν αισθανθή την ευχαρίστηση του ελαφρού στομαχιού. Στην αρχή, όταν τρώνε κάτι νόστιμο, αισθάνονται μια ευχαρίστηση και μετά μπαίνει η λαιμαργία, η γαστριμαργία, τρώνε πολύ καί, ιδίως όταν είναι ηλικιωμένοι, νιώθουν βάρος, και έτσι στερούνται την ευχαρίστηση του ελαφρού στομαχιού.
- type: h2
  initial:
    ru: ''
  text:
    ru: Πέμπτο Μέρος – Οι Δοκιμασίες Στη Ζωή Μας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Για να πάη κανείς στον γλυκό Παράδεισο,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: πρέπει να φάη πολλά πικρά εδώ,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: νά έχη το διαβατήριο των δοκιμασιών στο χέρι».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 1 – «Διήλθομεν δια πυρός και ύδατος...»[71]
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι σταυροί των δοκιμασιών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, το σταυρουδάκι που μου δώσατε το φορώ συνέχεια και με βοηθάει στις δυσκολίες μου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Νά, τέτοια σταυρουδάκια είναι οι δικοί μας σταυροί, σαν αυτά που κρεμούμε στον λαιμό μας και μας προστατεύουν στην ζωή μας. Τί νομίζεις, έχουμε μεγάλο σταυρό εμείς; Μόνον ο Σταυρός του Χριστού μας ήταν πολύ βαρύς, γιατί ο Χριστός από αγάπη προς εμάς τους ανθρώπους δεν θέλησε να χρησιμοποιήση για τον εαυτό Του την θεϊκή Του δύναμη. Και στην συνέχεια σηκώνει το βάρος των σταυρών όλου του κόσμου και μας ελαφρώνει από τους πόνους των δοκιμασιών με την θεία Του βοήθεια και με την γλυκειά Του παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός οικονομάει για τον κάθε άνθρωπο έναν σταυρό ανάλογο με την αντοχή του, όχι για να βασανιστή, αλλά για να ανεβή από τον σταυρό στον Ουρανό – γιατί στην ουσία ο σταυρός είναι σκάλα προς τον Ουρανό. Αν καταλάβουμε τί θησαυρό αποταμιεύουμε από τον πόνο των δοκιμασιών, δεν θα γογγύζουμε, αλλά θα δοξολογούμε τον Θεό σηκώνοντας το σταυρουδάκι που μας χάρισε, οπότε και σε τούτη την ζωή θα χαιρώμαστε, και στην άλλη θα έχουμε να λάβουμε και σύνταξη και «εφάπαξ». Ο Θεός μας έχει εξασφαλισμένα κτήματα εκεί στον Ουρανό. Όταν όμως ζητούμε να μας απαλλάξη από μια δοκιμασία, δίνει αυτά τα κτήματα σε άλλους και τα χάνουμε. Ενώ, αν κάνουμε υπομονή, θα μας δώση και τόκο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Είναι μακάριος αυτός που βασανίζεται εδώ, γιατί, όσο πιο πολύ παιδεύεται σ᾿ αυτήν την ζωή, τόσο περισσότερο βοηθιέται για την άλλη, επειδή εξοφλά αμαρτίες. Οι σταυροί των δοκιμασιών είναι ανώτεροι από τα «τάλαντα», από τα χαρίσματα, που μας δίνει ο Θεός. Είναι μακάριος εκείνος που έχει όχι έναν σταυρό αλλά πέντε. Μια ταλαιπωρία ή ένας θάνατος μαρτυρικός είναι και καθαρός μισθός. Γι᾿ αυτό σε κάθε δοκιμασία να λέμε: «Σ᾿ ευχαριστώ, Θεέ μου, γιατί αυτό χρειαζόταν για την σωτηρία μου».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι δοκιμασίες βοηθούν να συνέλθουν οι άνθρωποι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μαθαίνω για την ταλαιπωρία των δικών μου. Θα τελειώσουν ποτέ τα βάσανά τους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κάνε υπομονή, αδελφή μου, και μη χάνεις την ελπίδα σου στον Θεό. Όπως κατάλαβα από όλες τις δοκιμασίες που περνούν οι δικοί σου, ο Θεός σάς αγαπάει και επιτρέπει όλες αυτές τις δοκιμασίες για ένα λαμπικάρισμα πνευματικό ολόκληρης της οικογένειας. Εάν εξετάσουμε κοσμικά τις δοκιμασίες της οικογένειάς σου, φαίνεστε δυστυχισμένοι. Εάν όμως τις εξετάσουμε πνευματικά, είστε ευτυχισμένοι, και στην άλλη ζωή θα σάς ζηλεύουν όσοι θεωρούνται σε τούτη την ζωή ευτυχισμένοι. Με αυτόν τον τρόπο ασκούνται και οι γονείς σου, μια που τον αρχοντικό τρόπο, τον πνευματικό, δεν τον γνωρίζουν ή δεν τον καταλαβαίνουν. Πάντως, κρύβεται ένα μυστήριο στις δοκιμασίες του σπιτιού σου, αλλά και σε ωρισμένα άλλα σπίτια, ενώ γίνεται τόση προσευχή! «Τις οίδε τα κρίματα του Θεού;»[72]. Ο Θεός να βάλη το χέρι Του και να δώση τέρμα στις δοκιμασίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, δεν γίνεται οι άνθρωποι να συνέλθουν με άλλον τρόπο και όχι με κάποια δοκιμασία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πριν επιτρέψη ο Θεός να έρθη μια δοκιμασία, εργάστηκε με καλό τρόπο, αλλά δεν τον καταλάβαιναν, γι᾿ αυτό μετά επέτρεψε την δοκιμασία. Βλέπετε, και όταν ένα παιδί είναι ανάποδο, στην αρχή ο πατέρας του το παίρνει με το καλό, του κάνει τα χατίρια, αλλά, όταν εκείνο δεν αλλάζη, τότε του φέρεται αυστηρά, για να διορθωθή. Έτσι και ο Θεός μερικές φορές, όταν κάποιος δεν καταλαβαίνη με το καλό, του δίνει μια δοκιμασία, για να συνέλθη. Αν δεν υπήρχε λίγος πόνος, αρρώστιες κ.λπ., θα γίνονταν θηρία οι άνθρωποι· δεν θα πλησίαζαν καθόλου στον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ζωή αυτή είναι ψεύτικη και σύντομη· λίγα είναι τα χρόνια της. Και ευτυχώς που είναι λίγα, γιατί γρήγορα θα περάσουν οι πίκρες, οι οποίες θα θεραπεύσουν τις ψυχές μας σαν τα πικροφάρμακα. Βλέπεις, οι γιατροί, ενώ οι καημένοι οι άρρωστοι πονούν, τους δίνουν πικρό φάρμακο, γιατί με το πικρό θα γίνουν καλά, όχι με το γλυκό. Θέλω να πω ότι και η υγεία από το πικρό βγαίνει, και η σωτηρία της ψυχής από το πικρό βγαίνει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Με τον πόνο μας επισκέπτεται ο Χριστός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Άνθρωπος που δεν περνάει δοκιμασίες, που δεν θέλει να πονάη, να ταλαιπωρήται, που δεν θέλει να τον στενοχωρούν ή να του κάνουν μια παρατηρήση, αλλά θέλει να καλοπερνάη, είναι εκτός πραγματικότητος. «Διήλθομεν δια πυρός και ύδατος, και εξήγαγες ημάς εις αναψυχήν»[73], λέει ο Ψαλμωδός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπεις, και η Παναγία μας πόνεσε και οι Άγιοί μας πόνεσαν, γι᾿ αυτό και εμείς πρέπει να πονέσουμε, μια που τον ίδιο δρόμο ακολουθούμε. Με την διαφορά ότι εμείς, όταν έχουμε λίγη ταλαιπωρία σ᾿ αυτήν την ζωή, ξοφλούμε λογαριασμούς και σωζόμαστε. Αλλά και ο Χριστός με πόνο ήρθε στην γή. Κατέβηκε από τον Ουρανό, σαρκώθηκε, ταλαιπωρήθηκε, σταυρώθηκε. Και τώρα ο Χριστιανός την επίσκεψη του Χριστού έτσι την καταλαβαίνει, με τον πόνο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν επισκέπτεται ο πόνος τον άνθρωπο, τότε του κάνει επίσκεψη ο Χριστός. Ενώ, όταν δεν περνάη ο άνθρωπος καμμιά δοκιμασία, είναι σαν μία εγκατάλειψη του Θεού. Ούτε ξοφλάει, ούτε αποταμιεύει. Μιλάω βέβαια για έναν ο οποίος δεν θέλει την κακοπάθεια για την αγάπη του Χριστού. Σού λέει: «Έχω την υγεία μου, έχω την όρεξή μου, τρώω, περνάω μια χαρά, ήσυχα...», και δεν λέει ένα «δόξα Σοι ο Θεός». Τουλάχιστον, αν αναγνωρίζη όλες αυτές τις ευλογίες του Θεού, κάπως τακτοποιείται η υπόθεση. «Δεν μου άξιζαν αυτά, να πή, αλλά, επειδή είμαι αδύνατος, γι᾿ αυτό ο Θεός με οικονομάει». Στον βίο του Αγίου Αμβροσίου[74]αναφέρεται ότι κάποτε ο Άγιος φιλοξενήθηκε με την συνοδεία του στο σπίτι κάποιου πλουσίου. Βλέποντας ο Άγιος τα αμύθητα πλούτη του τον ρώτησε αν είχε καμμιά φορά δοκιμάσει κάποια θλίψη. «Όχι, ποτέ, του απάντησε εκείνος. Τα πλούτη μου συνέχεια αυξάνονται, τα κτήματά μου ευφορούν, ούτε πόνο έχω, ούτε αρρώστια είδα ποτέ». Τότε ο Άγιος δάκρυσε και είπε στην συνοδεία του: «Ετοιμάστε τα αμάξια να φύγουμε γρήγορα από ᾿δώ, γιατί αυτόν δεν τον επισκέφθηκε ο Θεός!». Και μόλις βγήκαν στον δρόμο, το σπίτι του πλουσίου βούλιαξε! Η καλοπέραση που είχε ήταν εγκατάλειψη Θεού[75].'
- type: h2
  initial:
    ru: ''
  text:
    ru: «Όν αγαπά Κύριος παιδεύει»[76]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ο κόσμος υποφέρει σήμερα τόσο πολύ;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Από την αγάπη του Θεού! Εσύ σαν μοναχή σηκώνεσαι το πρωί, κάνεις τον κανόνα σου, κάνεις κομποσχοίνια, μετάνοιες κ.λπ. Για τους κοσμικούς οι δυσκολίες που περνούν είναι ο κανόνας τους, οπότε εξαγνίζονται μ᾿ αυτές. Τους κάνουν μεγαλύτερο καλό από την κοσμική καλοπέραση, η οποία δεν τους βοηθάει ούτε να πλησιάσουν στον Θεό, ούτε να αποταμιεύσουν μισθό ουράνιο. Γι᾿ αυτό πρέπει να τις δέχωνται ως δώρα από τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Καλός Θεός με τις δοκιμασίες παιδαγωγεί σαν καλός Πατέρας τα παιδιά Του, από αγάπη, από θεία καλωσύνη, και όχι από κακότητα ούτε από κοσμική, νομική, δικαιοσύνη, γιατί θέλει να επιστρέψουν κοντά Του. Επειδή δηλαδή θέλει να σώση τα πλάσματά Του και να κληρονομήσουν την ουράνια Βασιλεία Του, επιτρέπει τις δοκιμασίες, για να παλέψη ο άνθρωπος, να αγωνισθή και να δώση εξετάσεις στην υπομονή στους πόνους, ώστε να μην μπορή να Του πη ο διάβολος: «Πώς τον ανταμείβεις αυτόν ή πώς τον σώζεις, αφού δεν κοπίασε;». Τον Θεό δεν Τον ενδιαφέρει αυτή η ζωή, αλλά η άλλη. Πρώτα μας φροντίζει για την άλλη ζωή και ύστερα γι᾿ αυτήν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί όμως, Γέροντα, ο Θεός σε μερικούς ανθρώπους δίνει πολλές δοκιμασίες, ενώ σε άλλους δεν δίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί λέει η Αγία Γραφή; «Όν αγαπά Κύριος παιδεύει»[77]. Ένας πατέρας έχει λ.χ. οκτώ παιδιά. Τα πέντε μένουν στο σπίτι, κοντά στον πατέρα τους, και τα τρία φεύγουν μακριά του και δεν τον σκέφτονται. Σ᾿ αυτά που μένουν κοντά του, αν κάνουν καμμιά αταξία, τους τραβάει το αυτί, τους δίνει κανένα σκαμπιλάκι· ή, αν είναι φρόνιμα, τα χαϊδεύει, τους δίνει και καμμιά σοκολάτα. Ενώ αυτά που είναι μακριά, ούτε χάδι ούτε σκαμπίλι έχουν. Έτσι κάνει και ο Θεός. Τους ανθρώπους που είναι κοντά Του και εκείνους που έχουν καλή διάθεση, αν σφάλουν λίγο, τους δίνει ένα σκαμπιλάκι και εξοφλούν ή, αν τους δώση περισσότερα σκαμπίλια, αποταμιεύουν. Σ᾿ εκείνους πάλι που είναι μακριά Του δίνει χρόνια, για να μετανοήσουν. Γι᾿ αυτό βλέπουμε κοσμικούς ανθρώπους να κάνουν σοβαρές αμαρτίες και παρ᾿ όλα αυτά να έχουν άφθονα υλικά αγαθά και να ζουν πολλά χρόνια, χωρίς να περνούν δοκιμασίες. Αυτό γίνεται κατ᾿ οικονομίαν Θεού, για να μετανοήσουν. Αν δεν μετανοήσουν, θα είναι αναπολόγητοι στην άλλη ζωή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο πόνος του Θεού για τις δοκιμασίες των ανθρώπων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πόσα βάσανα έχει ο κόσμος! Πόσα προβλήματα! Και έρχονται μερικοί εδώ να μου τα πούν σε δυο λεπτά στο πόδι, για να παρηγορηθούν λίγο. Μια βασανισμένη μάνα μου έλεγε: «Γέροντα, έρχονται στιγμές που δεν αντέχω άλλο και τότε λέω: «Χριστέ μου, κάνε μια μικρή διακοπή και ύστερα ας ξαναρχίσουν τα βάσανα"». Πόση ανάγκη από προσευχή έχουν οι άνθρωποι! Αλλά και κάθε δοκιμασία είναι δώρο από τον Θεό, είναι ένας βαθμός για την άλλη ζωή. Αυτή η ελπίδα της ανταμοιβής στην άλλη ζωή μου δίνει χαρά, παρηγοριά και κουράγιο, και μπορώ να αντέξω τον πόνο για τις δοκιμασίες που περνούν πολλοί άνθρωποι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός μας δεν είναι Βάαλ, αλλά Θεός αγάπης. Είναι Πατέρας που βλέπει την ταλαιπωρία των παιδιών Του από τους διάφορους πειρασμούς και τις δοκιμασίες που περνούν και θα μας ανταμείψη, φθάνει να κάνουμε υπομονή στο μικρό μαρτύριο της δοκιμασίας ή μάλλον της ευλογίας.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, μερικοί λένε: «Δεν είναι σκληρό αυτό που επέτρεψε ο Θεός; Δεν πονάει ο Θεός;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο πόνος του Θεού για τους ανθρώπους που βασανίζονται από αρρώστιες, από δαίμονες, από βαρβάρους κ.λπ. έχει συγχρόνως και χαρά για την ουράνια αμοιβή που τους έχει ετοιμάσει. Έχοντας δηλαδή υπ᾿ όψιν Του ο Θεός την ανταπόδοση που θα λάβη στον Ουρανό όποιος περνάει δοκιμασίες και γνωρίζοντας τί τον περιμένει στην άλλη ζωή, αυτό Τον κάνει να μπορή να «αντέχη» τον πόνο. Εδώ επέτρεψε να κάνη τόσα εγκλήματα ο Ηρώδης[78]. Δεκατέσσερις χιλιάδες νήπια έσφαξε και πόσους γονείς, που δεν άφηναν τους στρατιώτες να σκοτώσουν τα παιδιά τους, τους σκότωναν κι εκείνους! Οι βάρβαροι στρατιώτες, για να φανούν στους αρχηγούς τους καλύτεροι, έκοβαν τα παιδάκια κομματάκια. Όσο πιο πολύ βασανίζονταν τα παιδάκια, τόσο περισσότερο πονούσε ο Θεός, αλλά και τόσο περισσότερο χαιρόταν για την μεγαλύτερη δόξα που θα είχαν να απολαύσουν στον Ουρανό. Χαιρόταν για τα Αγγελουδάκια αυτά, που θα αποτελούσαν το αγγελικό μαρτυρικό τάγμα. Άγγελοι από Μάρτυρες!
- type: h2
  initial:
    ru: ''
  text:
    ru: Στις θλίψεις ο Θεός δίνει την αληθινή παρηγοριά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός βλέπει από κοντά τις ταλαιπωρίες των παιδιών Του και τα παρηγορεί σαν καλός Πατέρας. Γιατί, τί νομίζεις, θέλει να βλέπη το παιδάκι Του να ταλαιπωρήται; Όλα τα βάσανά του, τα κλάματά του, τα λαμβάνει υπ᾿ όψιν Του και ύστερα πληρώνει. Μόνον ο Θεός δίνει στις θλίψεις την αληθινή παρηγοριά. Γι᾿ αυτό, άνθρωπος που δεν πιστεύει στην αληθινή ζωή, που δεν πιστεύει στον Θεό, για να Του ζητήση το έλεός Του στις δοκιμασίες που περνάει, είναι όλο απελπισία και δεν έχει νόημα η ζωή του. Πάντα μένει αβοήθητος, απαρηγόρητος και βασανισμένος σ᾿ αυτήν την ζωή, αλλά καταδικάζει και αιώνια την ψυχή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι πνευματικοί όμως άνθρωποι, επειδή όλες τις δοκιμασίες τις αντιμετωπίζουν κοντά στον Χριστό, δεν έχουν δικές τους θλίψεις. Μαζεύουν τις πολλές πίκρες των άλλων, αλλά παράλληλα μαζεύουν και την πολλή αγάπη του Θεού. Όταν ψάλλω το τροπάριο «Μη καταπιστεύσης με ανθρωπίνη προστασία, Παναγία Δέσποινα», καμμιά φορά σταματώ στο «αλλά δέξαι δέησιν του ικέτου σου...». Αφού δεν έχω θλίψη, πώς να πω «θλίψις γαρ έχει με, φέρειν ου δύναμαι»[79]; Ψέματα να πώ; Στην πνευματική αντιμετώπιση δεν υπάρχει θλίψη, γιατί, όταν ο άνθρωπος τοποθετηθή σωστά, πνευματικά, όλα αλλάζουν. Αν ο άνθρωπος ακουμπήση την πίκρα του πόνου του στον γλυκύ Ιησού, οι πίκρες και τα φαρμάκια του μεταβάλλονται σε μέλι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν καταλάβη κανείς τα μυστικά της πνευματικής ζωής και τον μυστικό τρόπο με τον οποίο εργάζεται ο Θεός, παύει να στενοχωριέται για ό,τι του συμβαίνει, γιατί δέχεται με χαρά τα πικρά φάρμακα που του δίνει ο Θεός για την υγεία της ψυχής του. Όλα τα θεωρεί αποτελέσματα της προσευχής του, αφού ζητάει συνέχεια από τον Θεό να του λευκάνη την ψυχή. Όταν όμως οι άνθρωποι αντιμετωπίζουν τις δοκιμασίες κοσμικά, βασανίζονται. Αφού ο Θεός όλους μας παρακολουθεί, πρέπει να παραδίνεται κανείς εν λευκώ σ᾿ Αυτόν. Αλλιώς είναι βάσανο· ζητάει να του έρθουν όλα, όπως εκείνος θέλει, αλλά δεν του έρχονται όλα, όπως τα θέλει, και ανάπαυση δεν βρίσκει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είτε χορτάτος είναι κανείς είτε νηστικός, είτε τον επαινούν, είτε τον αδικούν, πρέπει να χαίρεται και να τα αντιμετωπίζη όλα ταπεινά και με υπομονή. Τότε ο Θεός συνέχεια θα του δίνη ευλογίες, ώσπου να φθάση η ψυχή του σε σημείο να μη χωράη, να μην αντέχη την καλωσύνη του Θεού. Καί, όσο θα προχωράη πνευματικά, τόσο θα βλέπη την αγάπη του Θεού σε μεγαλύτερο βαθμό και θα λειώνη από την αγάπη Του.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι κατά παραχώρησιν Θεού πειρασμοί και θλίψεις
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι δοκιμασίες που μας έρχονται είναι μερικές φορές η αντιβίωση που δίνει ο Θεός για τις αρρώστιες της ψυχής μας και πολύ μας βοηθούν πνευματικά. Τρώει ο άνθρωπος ένα μαλακό σκαμπίλι και μαλακώνει η καρδιά του. Ο Θεός ξέρει φυσικά σε τί κατάσταση βρίσκεται ο καθένας μας, αλλά, επειδή εμείς δεν ξέρουμε, επιτρέπει να δοκιμασθούμε, για να γνωρίσουμε τον εαυτό μας, να βρούμε τα πάθη που υπάρχουν κρυμμένα μέσα μας και να μην έχουμε παράλογες απαιτήσεις την ημέρα της Κρίσεως. Γιατί, και να παρέβλεπε τα πάθη μας και να μας έπαιρνε όπως είμαστε στον Παράδεισο, και εκεί πάλι θα δημιουργούσαμε προβλήματα. Γι᾿ αυτό ο Θεός επιτρέπει στον διάβολο να δημιουργή εδώ πειρασμούς, για να μας ξεσκονίζουν, ώστε να ταπεινωθή και να εξαγνισθή η ψυχή μας με τις θλίψεις, οπότε μετά μας χαριτώνει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η πραγματική χαρά γεννιέται από την πίκρα που γεύεται κανείς με χαρά για τον Χριστό που πικράθηκε, για να μας σώση. Ο Χριστιανός πρέπει να χαίρεται ιδιαίτερα, όταν τον βρίσκη κάποια δοκιμασία, χωρίς να έχη δώσει ο ίδιος αφορμή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Λέμε καμμιά φορά στον Θεό: «Θεέ μου, δεν ξέρω τί θα κάνης, εν λευκώ σού παραδίδω τον εαυτό μου, για να τον κάνης άνθρωπο». Οπότε και ο Θεός πάει να με κάνη όχι μόνον άνθρωπο αλλά υπεράνθρωπο και αφήνει τον διάβολο να ᾿ρθή να με πειράξη και να με ταλαιπωρήση. Τώρα με τον καρκίνο βλέπω τα τερτίπια του και γελάω. Βρέ τον διάβολο! Εσείς ξέρετε με τί σαπούνι πλένει ο διάβολος τον άνθρωπο, όταν ο Θεός επιτρέπη να τον πειράξη, για να δοκιμασθή; Με τους αφρούς της κακίας του. Έχει καλό ...σαπούνι! Όπως η γκαμήλα βγάζει αφρούς, όταν θυμώνη, έτσι κάνει και ο διάβολος σε τέτοιες περιπτώσεις. Και μετά τρίβει τον άνθρωπο, όχι για να φύγουν οι λεκέδες του και να εξαγνισθή, αλλά από κακία. Και ο Θεός όμως αφήνει τον διάβολο να τρίβη τον άνθρωπο, ίσα-ίσα μέχρι να φύγουν οι λεκέδες και να καθαρίση. Αν άφηνε να τον τρίψη όπως τρίβουν τα ρούχα, θα τον ξέσχιζε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μπορούμε να λέμε για τους διάφορους πειρασμούς που συμβαίνουν στην ζωή μας ότι αυτό ήταν το θέλημα του Θεού;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Όχι, να μην μπερδεύουμε το θέλημα του Θεού με τον πειρασμό και με όσα φέρνει ο πειρασμός. Ο Θεός αφήνει τον διάβολο ελεύθερο μέχρις ενός σημείου να πειράξη τον άνθρωπο, και τον άνθρωπο τον αφήνει ελεύθερο να κάνη το καλό ή το κακό. Δεν φταίει όμως ο Θεός για το κακό που θα κάνη ο άνθρωπος. Ο Ιούδας λ.χ. ήταν μαθητής του Χριστού. Μπορούμε να πούμε ότι ήταν θέλημα Θεού να γίνη προδότης; Όχι, αλλά ο ίδιος ο Ιούδας επέτρεψε στον διάβολο να μπή μέσα του. Κάποιος είπε σε έναν ιερέα: «Πάτερ, σε παρακαλώ, κάνε ένα Τρισάγιο για τον Ιούδα». Ήταν δηλαδή σαν να έλεγε: «Εσύ, Χριστέ, είσαι άδικος· έτσι ήταν θέλημά Σου, να Σε προδώση ο Ιούδας· γι᾿ αυτό τώρα βοήθησέ τον».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μετρημένες είναι οι περιπτώσεις που επιτρέπει ο Θεός να δοκιμασθούν μερικοί ευλαβείς, για να έρθη σε συναίσθηση κάποιος που έχει άσχημη ζωή και να μετανοήση. Αυτοί οι άνθρωποι έχουν διπλό μισθό. Δίνει δηλαδή ο Θεός την δυνατότητα σε μερικούς οι οποίοι με τις δοκιμασίες που περνούν εξοφλούν σ᾿ αυτήν την ζωή αμαρτίες και γκρινιάζουν παράλογα, να βοηθηθούν από την υπομονή αυτών πού, ενώ δεν έσφαλαν, ταλαιπωρούνται, αλλά δεν γογγύζουν. Ας υποθέσουμε ότι ένας πολύ καλός, πολύ ευλαβής, οικογενειάρχης βρίσκεται στο σπίτι του με την οικογένειά του και ξαφνικά γίνεται σεισμός και πέφτει το σπίτι, πλακώνει όλη την οικογένεια και μετά από φοβερή ταλαιπωρία πεθαίνουν όλοι. Γιατί το επέτρεψε αυτό ο Θεός; Για να μη γογγύζουν οι άλλοι που φταίνε και τιμωρούνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γι᾿ αυτό, όσοι σκέφτονται τους μεγάλους σταυρούς των δικαίων, ποτέ δεν στενοχωριούνται για τις δικές τους μικρές δοκιμασίες. Βλέπουν ότι, ενώ έσφαλαν στην ζωή τους, εν τούτοις υποφέρουν λιγώτερο από τους δικαίους, γι᾿ αυτό λένε σαν τον καλό ληστή[80]: «Αυτοί δεν έκαναν τίποτε και υπέφεραν τόσο· εμείς τί πρέπει να πάθουμε;». Δυστυχώς όμως μερικοί μοιάζουν με τον ληστή που σταυρώθηκε εξ αριστερών του Χριστού[81]και λένε: «Πήγαιναν με τον σταυρό στο χέρι και δές τί έπαθαν!».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Υπάρχουν και περιπτώσεις – αυτές είναι πολύ σπάνιες – που επιτρέπει ο Θεός από αγάπη να βρίσκουν μεγάλες δοκιμασίες μερικούς πολύ εκλεκτούς αγωνιστές, για να τους στεφανώση. Αυτοί είναι μιμητές του Χριστού. Βλέπετε, στην Αγία Συγκλητική, επειδή βοηθούσε πνευματικά πολλές ψυχές με τις νουθεσίες της, πήγε ο διάβολος να την εμποδίση από αυτό το έργο. Τριάμισι χρόνια έμεινε άφωνη από την αρρώστια της[82].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Άλλοτε πάλι κάποιος πραγματικός μιμητής του Χριστού ζητάει ως χάρη από τον Θεό να συγχωρήση σφάλματα των συνανθρώπων του, να τους απαλλάξη από την δικαία Του οργή, και να τιμωρηθή αυτός αντί αυτών, ενώ δεν φταίει ο ίδιος. Αυτός πολύ συγγενεύει με τον Θεό και πολύ συγκινεί τον Θεό η μεγάλη αυτή αρχοντική αγάπη του παιδιού Του. Εκτός δε από την χάρη που του κάνει και χαρίζει τα σφάλματα των άλλων, επιτρέπει να έχη και μαρτυρικό τέλος, κατά το επίμονο αίτημά του. Συγχρόνως όμως του ετοιμάζει και το καλύτερο αρχοντικό παραδεισένιο παλάτι με ακόμη μεγαλύτερη δόξα, διότι πολλοί άνθρωποι τον είχαν αδικήσει με την κατ᾿ όψιν κρίση τους, που νόμιζαν ότι ο Θεός τον τιμώρησε για τις δικές του αμαρτίες.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αχαριστία για την αγάπη του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι δοκιμασίες πάντοτε ωφελούν τους ανθρώπους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εξαρτάται από το πώς αντιμετωπίζει κανείς τις δοκιμασίες. Όσοι δεν έχουν καλή διάθεση, βρίζουν τον Θεό, όταν τους βρίσκουν διάφορες δοκιμασίες. «Γιατί να το πάθω εγώ αυτό; λένε. Νά, ο άλλος έχει τόσα καλά! Θεός είναι αυτός;». Δεν λένε «ήμαρτον», αλλά βασανίζονται. Ενώ οι φιλότιμοι λένε: «Δόξα τω Θεώ! Αυτή η δοκιμασία με έφερε κοντά στον Θεό. Ο Θεός για το καλό μου το έκανε». Και ενώ μπορεί πρώτα να μην πατούσαν καθόλου στην εκκλησία, μετά αρχίζουν να εκκλησιάζωνται, να εξομολογούνται, να κοινωνούν. Πολλές φορές μάλιστα ο Θεός τους πολύ σκληρούς τους φέρνει κάποια στιγμή με μια δοκιμασία σε τέτοιο φιλότιμο, που μόνοι τους παίρνουν μεγάλη στροφή και εξιλεώνονται με τον πόνο που νιώθουν για όσα έκαναν.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πρέπει να λέμε «δόξα Σοι ο Θεός», όταν όλα πηγαίνουν καλά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μά, αν δεν λέμε το «δόξα Σοι ο Θεός» στις χαρές, πώς θα το πούμε στις θλίψεις; Εσύ το λές στις θλίψεις και δεν θέλεις να το πής στις χαρές; Αλλά, όταν είναι αχάριστος κανείς, δεν γνωρίζει την αγάπη του Θεού. Η αχαριστία είναι μεγάλη αμαρτία. Για μένα είναι θανάσιμο αμάρτημα. Ο αχάριστος με τίποτε δεν ευχαριστιέται. Για όλα γκρινιάζει, όλα του φταίνε. Στην πατρίδα μου, τα Φάρασα, χρησιμοποιούσαν πολύ το πετιμέζι. Ένα βράδυ μια κοπέλα έκλαιγε, γιατί ήθελε πετιμέζι. Η μάνα της – τί να κάνη; – πήγε και ζήτησε από την γειτονιά. Αυτή, μόλις πήρε το πετιμέζι, έβαλε πάλι τα κλάματα. Χτυπούσε τα πόδια της κάτω και φώναζε: «Μαμά, θέλω και γιαούρτι». «Τέτοια ώρα, παιδάκι μου, που να βρώ γιαούρτι;», της λέει η μάνα της. «Όχι, θέλω γιαούρτι». Πήγε, υποχρεώθηκε η καημένη σε μια γειτόνισσα, της έφερε και γιαούρτι. Το παίρνει η κόρη και βάζει πάλι τα κλάματα. «Τώρα γιατί κλαίς;», την ρωτάει η μάνα της. «Μαμά, τα θέλω ανακατεμένα». Τα παίρνει η μάνα, τα ανακατεύει. Αυτή βάζει πάλι τα κλάματα. «Μαμά, δεν μπορώ να τα φάω έτσι. Θέλω να τα ξεχωρίσω!». Οπότε την περιέλαβε στα σκαμπίλια η μάνα της, καί... ξεχωρίσθηκε το πετιμέζι από το γιαούρτι!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Έτσι, θέλω να πώ, κάνουν μερικές φορές πολλοί άνθρωποι, και τότε έρχεται η παιδαγωγία του Θεού. Τουλάχιστον να αναγνωρίζουμε την αχαριστία μας και να ευχαριστούμε τον Θεό μέρα-νύχτα για τις ευλογίες που μας δίνει. Με αυτόν τον τρόπο θα πάρουμε καταπόδι τον δειλό διάβολο, ο οποίος θα συμμαζέψη τα ταγκαλάκια του και θα γίνη μαύρος καπνός, γιατί θα του έχουμε βρει πια το αδύνατο σημείο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Να συγκρίνουμε την δοκιμασία μας με την μεγαλύτερη δοκιμασία του άλλου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Το καλύτερο φάρμακο για την κάθε δοκιμασία μας είναι η μεγαλύτερη δοκιμασία των συνανθρώπων μας, αρκεί να την συγκρίνουμε με την δική μας δοκιμασία, για να διακρίνουμε την μεγάλη διαφορά και την μεγάλη αγάπη που μας έδειξε ο Θεός και επέτρεψε μικρή δοκιμασία σ᾿ εμάς. Τότε θα Τον ευχαριστήσουμε, θα πονέσουμε για τον άλλον που υποφέρει πιο πολύ και θα κάνουμε καρδιακή προσευχή να τον βοηθήση ο Θεός. Μου έκοψαν λ.χ. το ένα πόδι; «Δόξα Σοι ο Θεός, να πώ, που έχω τουλάχιστον ένα πόδι· του άλλου του έκοψαν και τα δύο». Και αν ακόμη μείνω ένα κούτσουρο, χωρίς χέρια και πόδια, πάλι να πώ: «Δόξα Σοι ο Θεός, που περπατούσα τόσα χρόνια, ενώ άλλοι γεννήθηκαν παράλυτοι».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εγώ, από την στιγμή που άκουσα ότι ένας οικογενειάρχης έχει έντεκα χρόνια αιμορραγία, είπα: «Τί κάνω εγώ; Κοσμικός άνθρωπος αυτός και να έχη έντεκα χρόνια αιμορραγία, να έχη παιδιά, να πρέπη να σηκωθή το πρωί να πάη στην δουλειά, και εγώ ούτε επτά χρόνια δεν συμπλήρωσα που έχω αιμορραγίες!»[83]. Αν σκέφτωμαι τον άλλον που υποφέρει τόσο πολύ, δεν μπορώ να δικαιολογήσω τον εαυτό μου. Ενώ, αν σκέφτωμαι ότι εγώ υποφέρω και οι άλλοι είναι μια χαρά, ότι σηκώνομαι την νύχτα κάθε μισή ώρα, επειδή έχω πρόβλημα με το έντερο και δεν μπορώ να κοιμηθώ, ενώ οι άλλοι κοιμούνται ήσυχα, δικαιολογώ τον εαυτό μου, αν γογγύσω. Εσύ, αδελφή, πόσον καιρό έχεις τον έρπητα[84];'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οκτώ μήνες, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Βλέπεις; Ο Θεός σε άλλους τον αφήνει δύο μήνες, σε άλλους δέκα μήνες, σε άλλους δεκαπέντε. Καταλαβαίνω, είναι μεγάλος ο πόνος. Μερικοί φθάνουν σε απόγνωση. Ένας κοσμικός όμως που έχει έρπητα έναν-δύο μήνες και από τον πολύ πόνο απελπίζεται, αν μάθη ότι ένας πνευματικός άνθρωπος τον έχει έναν χρόνο και κάνει υπομονή και δεν γογγύζει, τότε αμέσως παρηγοριέται. «Βρέ, λέει, εγώ τον έχω δύο μήνες και έφθασα στην απελπισία· ο άλλος ο καημένος έναν χρόνο τον έχει και δεν μιλάει! Εγώ κάνω και αταξίες, ενώ εκείνος ζη πνευματικά!». Οπότε βοηθιέται χωρίς συμβουλή!
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι θλίψεις που μας προξενούν οι άνθρωποι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κάποιος υπομένη κατά Θεόν τις θλίψεις και τις αδικίες που του προξενούν οι άνθρωποι, αυτή η υπομονή τον καθαρίζει από τα πάθη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν τον καθαρίζη λέει! Τον λαμπικάρει! Μά, υπάρχει ανώτερο απ᾿ αυτό; Έτσι μπορεί να εξοφλήση αμαρτίες. Βλέπετε, έναν εγκληματία τον δέρνουν, τον κλείνουν στην φυλακή, κάνει εκεί τον μικρό κανόνα του καί, εάν ειλικρινά μετανοήση, γλιτώνει την αιώνια φυλακή. Μικρό πράγμα είναι να εξοφλήση με αυτήν την ταλαιπωρία έναν αιώνιο λογαριασμό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Κάθε θλίψη να την υπομένετε με χαρά. Οι θλίψεις που μας προκαλούν οι άνθρωποι είναι πιο γλυκές από όλα τα σιρόπια που μας προσφέρουν όσοι μας αγαπούν. Βλέπεις, στους μακαρισμούς ο Χριστός δεν λέει: «μακάριοί εστε, όταν επαινέσωσιν υμάς», αλλά «μακάριοί εστε, όταν ονειδίσωσιν υμάς»[85], και μάλιστα «ψευδόμενοι». Όταν ο ονειδισμός δεν είναι δίκαιος, αποταμιεύει κανείς. Ενώ, όταν είναι δίκαιος, ξοφλάει. Γι᾿ αυτό, όχι μόνον πρέπει να υπομένουμε αγόγγυστα αυτόν που μας πειράζει, αλλά και να νιώθουμε ευγνωμοσύνη, γιατί μας δίνει την ευκαιρία να αγωνισθούμε στην αγάπη, στην ταπείνωση, στην υπομονή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι συκοφάντες βέβαια εργάζονται συνεργαζόμενοι με το ταγκαλάκι. Αλλά ο δυνατός αέρας συνήθως σπάζει και ξερριζώνει τα ευαίσθητα δένδρα που δεν έχουν βαθειές ρίζες· ενώ όσα έχουν βαθειές ρίζες, τα βοηθάει να προχωρήσουν τις ρίζες τους πιο βαθιά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Εμείς πρέπει να προσευχώμαστε για όλους που μας κακολογούν, και να ζητούμε από τον Θεό να τους δίνη μετάνοια, φωτισμό και υγεία και να μην αφήνουμε μέσα μας ούτε ίχνος μίσους γι᾿ αυτούς. Να κρατούμε μόνον την πείρα από τον πειρασμό, να πετούμε όλα τα φαρμάκια και να έχουμε υπ᾿ όψιν μας τα λόγια του Οσίου Εφραίμ: «Εάν συμβή σοι συκοφαντία, και μετά ταύτα φανερωθή το καθαρόν της συνειδήσεώς σου, μη υψηλοφρόνει, αλλά δούλευε τω Κυρίω εν ταπεινοφροσύνη τω λυτρουμένω σε από συκοφαντίας ανθρώπων, ίνα μη πέσης πτώμα εξαίσιον»[86].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 2 – Η αρρώστια
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι αρρώστιες βοηθούν τους ανθρώπους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί θα πή, Γέροντα, «Καλό Παράδεισο»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Με το καλό να πάς στον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Μπορεί, Γέροντα, να εννοή: «Να πάς στον καλό Παράδεισο»;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άκουσες εσύ ποτέ να μιλούν για κακό Παράδεισο; Πάντως, για να πάη κανείς στον γλυκό Παράδεισο, πρέπει να φάη πολλά πικρά εδώ, να έχη το διαβατήριο των δοκιμασιών στο χέρι. Τί γίνεται στα νοσοκομεία! Τί δράματα! Τί πόνο έχει ο κόσμος! Πόσες μητέρες, οι καημένες, κάνουν επεμβάσεις, σκέφτονται τα παιδάκια τους και έχουν την αγωνία όλης της οικογένειας! Πόσοι οικογενειάρχες έχουν καρκίνο, κάνουν ακτινοβολίες και τί βάσανο έχουν! Να μην μπορούν να δουλέψουν, να πρέπη να πληρώσουν νοίκια, να έχουν ένα σωρό έξοδα! Εδώ άλλοι έχουν την υγεία τους και πάλι δεν μπορούν να τα βγάλουν πέρα, πόσο μάλλον να μην έχη κανείς την υγεία του και να ζορίζεται να δουλέψη, για να ανταποκριθή λίγο στις υποχρεώσεις του! Πολύ με έχουν καταβάλει τα προβλήματα των ανθρώπων. Πόσα ακούω κάθε μέρα! Συνέχεια βάσανα, δυσκολίες!... Πίκρα όλη μέρα το στόμα και το βράδυ να πέφτω νηστικός λίγο να ξεκουραστώ. Νιώθω πολλή σωματική κούραση, αλλά και εσωτερική ξεκούραση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πάντα ωφελεί η αρρώστια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, πάντα πολύ ωφελεί. Οι αρρώστιες βοηθούν τους ανθρώπους να «εξιλεωθούν»[87], όταν δεν έχουν αρετές. Μεγάλο πράγμα η υγεία, αλλά και το καλό που προσφέρει η αρρώστια, η υγεία δεν μπορεί να το δώση! Πνευματικό καλό! Είναι πολύ μεγάλη ευεργεσία, πολύ μεγάλη! Καθαρίζει τον άνθρωπο από την αμαρτία, και μερικές φορές του εξασφαλίζει και μισθό. Η ψυχή του ανθρώπου είναι σαν το χρυσάφι και η αρρώστια είναι σαν την φωτιά που την καθαρίζει. Βλέπεις, και ο Χριστός είπε στον Απόστολο Παύλο: «Η δύναμίς μου εν ασθενεία τελειούται»[88]. Όσο περισσότερο ταλαιπωρηθή με κάποια αρρώστια ο άνθρωπος, τόσο περισσότερο εξαγνίζεται και αγιάζεται, αρκεί να κάνη υπομονή και να την δέχεται με χαρά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικές αρρώστιες θέλουν μόνο λίγη υπομονή, και τις επιτρέπει ο Θεός, για να πάρη ο άνθρωπος λίγο μισθό και να του αφαιρέση ο Θεός μερικά κουσούρια. Γιατί η σωματική αρρώστια βοηθάει στην θεραπεία της πνευματικής αρρώστιας. Την εξουδετερώνει με την ταπείνωση που φέρνει. Ο Θεός όλα τα αξιοποιεί για το καλό! Ό,τι επιτρέπει είναι για το πνευματικό μας συμφέρον. Ξέρει τί χρειάζεται ο καθένας μας και μας δίνει κάποια αρρώστια, είτε για να ανταμειφθούμε, είτε για να εξοφλήσουμε αμαρτίες.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο ουράνιος μισθός από την αρρώστια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί κάνει η μητέρα σου;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν είναι καλά, Γέροντα. Ανεβάζει κατά διαστήματα ψηλό πυρετό και τότε χάνεται. Το δέρμα της γεμίζει πληγές και τις νύχτες πονάει.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ξέρεις; Αυτοί είναι μάρτυρες· αν δεν είναι ολόκληροι μάρτυρες, είναι μισοί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όλη η ζωή της, Γέροντα, ήταν μια ταλαιπωρία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Επομένως ο μισθός της θα είναι διπλός. Πόσα έχει να λάβη! Τον Παράδεισο τον έχει εξασφαλισμένο. Όταν ο Χριστός βλέπη ότι κάποιος αντέχει μια βαρειά αρρώστια, του την δίνει, ώστε με την λίγη ταλαιπωρία στην επίγεια ζωή να ανταμειφθή πολύ στην ουράνια, την αιώνια, ζωή. Υποφέρει εδώ, αλλά θα ανταμειφθή εκεί, στην άλλη ζωή, γιατί υπάρχει Παράδεισος, υπάρχει και ανταμοιβή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Σήμερα μου είπε μια νεφροπαθής που χρόνια τώρα κάνει αιμοκάθαρση: «Παππούλη, σταυρώστε, σάς παρακαλώ, το χέρι μου. Οι φλέβες είναι όλο πληγές και δεν μπορώ να κάνω αιμοκάθαρση». «Αυτές οι πληγές, της είπα, στην άλλη ζωή θα είναι διαμάντια μεγαλύτερης αξίας από τα διαμάντια αυτού του κόσμου. Πόσα χρόνια κάνεις αιμοκάθαρση;». «Δώδεκα», μου λέει. «Δηλαδή δικαιούσαι ένα «εφάπαξ» και μία σύνταξη μειωμένη», της είπα. Μετά μου δείχνει μια πληγή στο άλλο χέρι και μου λέει: «Παππούλη, αυτή η πληγή δεν κλείνει· φαίνεται το κόκκαλο». «Ναί, αλλά από εκεί μέσα φαίνεται ο Ουρανός, της λέω. Άντε, καλή υπομονή. Εύχομαι ο Χριστός να σού αυξάνη την αγάπη Του, για να ξεχνιέται ο πόνος σου. Φυσικά υπάρχει και η άλλη ευχή, να εξαλειφθούν οι πόνοι, αλλά τότε εξαλείφεται και ο πολύς μισθός. Επομένως, η προηγούμενη ευχή είναι καλύτερη». Παρηγορήθηκε η καημένη.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν το σώμα δοκιμάζεται, τότε η ψυχή αγιάζεται. Με την αρρώστια πονάει το σώμα μας, το χωματόκτιστο αυτό σπίτι μας, αλλά έτσι θα αγάλλεται αιώνια ο νοικοκύρης του, η ψυχή μας, στο ουράνιο παλατάκι που μας ετοιμάζει ο Χριστός. Με αυτήν την πνευματική λογική, που είναι παράλογη για τους κοσμικούς, χαίρομαι και εγώ και καμαρώνω για τις σωματικές βλάβες που έχω. Το μόνο που δεν σκέφτομαι είναι ότι θα έχω ουράνια ανταμοιβή. Καταλαβαίνω ότι εξοφλώ την αχαριστία μου στον Θεό, αφού δεν έχω ανταποκριθή στις μεγάλες Του δωρεές και ευεργεσίες. Γιατί στην ζωή μου όλα γλέντι είναι· και η καλογερική και οι αρρώστιες που περνώ. Όλο φιλανθρωπίες μου κάνει ο Θεός και όλο οικονομίες. Ευχηθήτε όμως να μη με ξοφλάη με αυτά σ᾿ αυτήν την ζωή, γιατί τότε αλλοίμονό μου! Μεγάλη τιμή θα μου έκανε ο Χριστός να υπέφερα ακόμη περισσότερο για την αγάπη Του, αρκεί να με ενίσχυε, ώστε να αντέχω, και μισθό δεν θέλω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο άνθρωπος, όταν είναι τελείως καλά στην υγεία του, δεν είναι καλά. Καλύτερα να έχη κάτι. Εγώ, όσο  ωφελήθηκα από την αρρώστια, δεν ωφελήθηκα από όλη την άσκηση που είχα κάνει μέχρι τότε. Γι᾿ αυτό λέω, αν δεν έχη κανείς υποχρεώσεις, να προτιμά αρρώστιες παρά υγεία. Από την υγεία του είναι χρεώστης, ενώ από την αρρώστια, όταν την αντιμετωπίζη με υπομονή, έχει να λάβη. Όταν ήμουν στο Κοινόβιο[89], είχε έρθει μια φορά ένας άγιος Επίσκοπος, πολύ γέρος, ονόματι Ιερόθεος, που ασκήτευε στην Σκήτη της Αγίας Άννης. Την ώρα που έφευγε, όπως πήγε να ανεβή στο ζώο, τραβήχτηκε το παντελόνι του και φάνηκαν τα πρησμένα του πόδια. Οι Πατέρες που πήγαν να τον βοηθήσουν, τα είδαν και τρόμαξαν. Εκείνος το κατάλαβε και τους είπε: «Αυτά είναι τα καλύτερα δώρα που μου έδωσε ο Θεός. Τον παρακαλώ να μη μου τα πάρη».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η υπομονή στους πόνους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν μας βρίσκη μια αρρώστια, καλά είναι να αφηνώμαστε στον Χριστό εν λευκώ. Να σκεφτώμαστε ότι η ψυχή μας έχει μεγαλύτερη ανάγκη από υπομονή και δοξολογία στους πόνους παρά από ατσαλένιο σώμα με το οποίο μπορούμε να κάνουμε μεγάλους σωματικούς αγώνες, οι οποίοι όμως ίσως μας κάνουν να καυχηθούμε, χωρίς να το καταλάβουμε, γιατί θα νομίσουμε ότι με το σπαθί μας θα κερδίσουμε τον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ξέρετε πόσα χρόνια έχω άλλοτε υποφερτό πόνο και άλλοτε ανυπόφορο; Ο υποφερτός είναι μια μόνιμη κατάσταση. Πόσα τράβηξα πρώτα από την βρογχεκτασία και έπειτα με την εγχείρηση που έκανα! Έπειτα άρχισαν ιστορίες με τα έντερα. Ύστερα, μισή χρονιά την πέρασα με την δισκοπάθεια· πονούσα πολύ. Δεν μπορούσα να κάνω ούτε τις μετάνοιες που έκανα, αλλά δυσκολευόμουν και να εξυπηρετηθώ, ενώ χρειαζόταν να υπηρετήσω και τον κόσμο που ερχόταν. Στην συνέχεια μου παρουσιάστηκε κάτι σκληρό στην κοιλιά· μου είπαν ότι ήταν κήλη. Όταν κουραζόμουν, πονούσε και πρηζόταν πολύ. Μια μέρα, παραμονή του Αγίου Παντελεήμονος, ήταν πρησμένο και πονούσα. Έπρεπε όμως να πάω στην Σκήτη, στην ολονυκτία. Είπα: «θά πάω και ό,τι θέλει ας γίνη», γιατί έπρεπε να πάω. Στην διάρκεια της αγρυπνίας σκέφθηκα να καθήσω λίγο, αλλά είπα «άν κατεβάσω εγώ το στασίδι, για να καθήσω, θα το κατεβάσουν όλοι», οπότε προτίμησα να μην καθήσω καθόλου. Μετά από δώδεκα ώρες που κράτησε η αγρυπνία υπέθεσα ότι θα χειροτερέψη πολύ. Όταν επέστρεψα στο Κελλί μου, δεν πρόλαβα καλά-καλά να μπώ μέσα, χτύπησε το καμπανάκι. «Έ, Πάτερ, άνοιξε!», ακούω κάποιον να φωνάζη. Έβαλα τα γέλια. «Εντάξει, είπα, τώρα θα πάμε συνέχεια». Και πράγματι σε λίγο ήρθαν και άλλοι και άλλοι. Το βράδυ που τελείωσα με τον κόσμο, είδα ότι είχε εξαφανισθή τελείως! Την άλλη ημέρα, ενώ είχα ξεκουραστή, πάλι παρουσιάστηκε! Έπειτα με εμπόδιζε και με πονούσε, αλλά και το καμάρωνα κιόλας. Αφού ο Χριστός το ήξερε, ήξερε και ότι με βοηθάει, γι᾿ αυτό το άφηνε. Πέντε χρόνια κράτησε αυτό. Ξέρεις τί δυσκολία;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τότε, Γέροντα, που είχατε πρόβλημα με τα πόδια σας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Εκείνο ήταν άλλο. Δεν μπορούσα να σταθώ όρθιος. Όταν ερχόταν κόσμος, ζοριζόμουν. Πέρασε εκείνο, μετά άρχισε η αιμορραγία. «Ελκώδη κολίτιδα», μου είπαν. Άλλη ιστορία... Πάνε επτά χρόνια με αιμορραγίες, με πόνους...  Αλλά μη στενοχωριέσθε· μόνο να εύχεσθε για την υγεία της ψυχής μου. Εγώ χαίρομαι που με τίμησε ο Θεός και μου έδωσε αυτό το δώρο και δεν θέλω να μου το στερήση. Δόξα τω Θεώ· ο Θεός το επιτρέπει, για να βοηθηθώ κατ᾿ αυτόν τον τρόπο. Έτσι δίνουμε εξετάσεις στην υπομονή. Τώρα αυτό, ύστερα το άλλο... «Υπομονής χρείαν έχομεν»[90]. Γιατί, αν εμείς που έχουμε λίγο φόβο Θεού, δεν κάνουμε υπομονή, τί θα κάνουν οι κοσμικοί; Αν και βλέπω ότι πολλοί λαϊκοί μας ξεπερνούν στην αρετή. Μου έλεγαν οι γονείς μου ότι οι Φαρασιώτες, όταν αρρώσταιναν, δεν έτρεχαν αμέσως στον Χατζεφεντή[91]να τους θεραπεύση. Υπέμεναν πρώτα τους πόνους, όσο μπορούσαν, ανάλογα με το φιλότιμο και την υπομονή τους, διότι θεωρούσαν ευλογία να υποφέρουν. «Ας βασανίσω κι εγώ, έλεγαν, λίγο την ψυχή μου για τον Χριστό, αφού ο Χριστός βασανίστηκε πολύ, για να με σώση». Καί, όταν πια έβλεπαν ότι πήγαιναν πίσω οι δουλειές τους και ταλαιπωρούνταν η οικογένειά τους, τότε πήγαιναν στον Χατζεφεντή να τους θεραπεύση. Βλέπεις τί φιλότιμο είχαν! Όταν εκείνοι, που ήταν λαϊκοί, σκέφτονταν έτσι και έκαναν υπομονή, εγώ σαν καλόγερος πώς πρέπει να σκέφτωμαι; Ο Χριστός είπε: «Εν τη υπομονή υμών κτήσασθε τας ψυχάς υμών»[92]. Βλέπετε, ο Θεός δεν ευχαριστήθηκε τόσο από τις ελεημοσύνες του Ιώβ, όταν είχε όλα τα αγαθά, όσο από την υπομονή του τον καιρό της δοκιμασίας[93].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν λέτε ότι ένας άρρωστος κάνει υπομονή στους πόνους, εννοείτε ότι δεν δείχνει καθόλου ότι πονάει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην εσχάτη ανάγκη μπορεί να αφήση να γίνη στους άλλους λίγο αντιληπτό. Μπορεί να πη ότι πονάει, αλλά όχι σε τί βαθμό. Γιατί, αν δεν το κάνη καθόλου γνωστό στους άλλους, οι άλλοι μπορεί να σκανδαλίζωνται από κάποια συμπεριφορά του. Αν λ.χ. ένας μοναχός υποφέρη από κάτι και δεν μπορή να πάη στην Ακολουθία, ίσως να βλαφτή κάποιος που δεν έχει καλούς λογισμούς.
- type: h2
  initial:
    ru: ''
  text:
    ru: Αντιμετώπιση του πόνου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιόν πόνο λέτε ανυπόφορο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τον πόνο που κάνει να τρέχουν δάκρυα από τα μάτια! Αυτά τα δάκρυα δεν είναι ούτε μετανοίας ούτε αγαλλιάσεως· που υπάγονται; τί λέτε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μαρτύριο δεν είναι, Γέροντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, μαρτύριο είναι!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν έχω δυνατό πόνο, δυσκολεύομαι να πω «δόξα Σοι ο Θεός».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί δυσκολεύεσαι; Να σκέφτεσαι τί τράβηξε ο Χριστός. Ξύλο, ονειδισμούς, φραγγέλωμα, σταύρωση[94]! Και όλα τα υπέμεινε, «αναμάρτητος ών»[95], για την σωτηρία μας. Και εσύ, όταν πονάς, να λές: «Για την αγάπη Σου, Χριστέ μου, θα υπομείνω».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί χρειάζεται για να ξεπεράσης τον πόνο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Παλληκαριά, βία χρειάζεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τον ανυπόφορο πόνο πώς τον αντιμετωπίζει κανείς;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν είναι κοσμικός, με το τραγούδι, αν είναι πνευματικός άνθρωπος, με την ψαλμωδία... Ο πατέρας μου μια φορά είχε πυρετό και πολύ πονοκέφαλο. Τί κάνει λοιπόν; Παίρνει και τρώει μια αλμυρή σαρδέλα, πίνει και ένα ποτήρι κρασί και άρχισε να τραγουδάη το «Ξύπνα, καημένε μου ραγιά» και άλλα τραγούδια της κλεφτουριάς και έγινε καλά! Έτσι και εμείς να ψέλνουμε, για να διασκεδάζεται ο πόνος! Κι εγώ μια μέρα κρύωσα και είχα έναν πονοκέφαλο, που πήγαινε να σπάση το κεφάλι μου. Άρχισα λοιπόν μια πολύ ωραία ψαλμωδία και μου έφυγε ο πονοκέφαλος. Πράγματι η ψαλμωδία μαζί με την ευχή πολύ βοηθάει σ᾿ αυτές τις περιπτώσεις· απαλαίνει την ψυχή, την γλυκαίνει, γιατί οι συνεχείς θλίψεις και οι πόνοι την καταβάλλουν και της δημιουργούν ψύξη. Και χθές βράδυ δεν μπορούσα να κοιμηθώ από τον πόνο. Είπα πώς, αν δεν ξημερώσω και πεθάνω, τότε θα έχω ...μεγάλη μέρα. Στην άλλη ζωή δεν θα βραδιάζη ποτέ, ούτε θα ξημερώνη... Έπειτα πήρα ένα... χάπι· έψαλα «Τας αλγηδόνας των Αγίων...»[96]. Αυτό το ...χάπι διαρκεί όλη την νύχτα! Έχουν τέτοιο χάπι εδώ οι γιατροί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, λένε ότι την νύχτα οι πόνοι δυναμώνουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, βαραίνει την νύχτα ο άνθρωπος. Ύστερα την ημέρα οι άρρωστοι, επειδή έχουν συντροφιά, συζητούν κ.λπ., ξεχνούν τον πόνο. Το βράδυ που είναι μόνοι τους, πάει ο νούς τους στον πόνο και νομίζουν ότι πονούν περισσότερο. Στην αρρώστια πόνοι θα υπάρχουν, αλλά σκοπός είναι να γυρίζουμε το κουμπί σε άλλη συχνότητα, για να ξεχνιούνται. Γιατί, αν δεν αντιμετωπίζης σωστά τον πόνο, θα πονάς δυο φορές. Αν σκέφτεσαι τον πόνο, θα διπλασιάζεται ο πόνος. Ενώ με έναν καλό λογισμό, αν λ.χ. θυμάσαι αυτούς που πονούν πιο πολύ από σένα ή αν ψάλης λίγο, ο πόνος ξεχνιέται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο πόνος συνήθως σε προειδοποιεί ότι κάτι συμβαίνει στον οργανισμό. Στην συνέχεια πόση προσοχή πρέπει να του δίνης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πρέπει να δοκιμάζη κανείς την αντοχή του και ανάλογα να προσέχη. Ιδίως, όταν περάση η ηλικία, χρειάζεται προσοχή, γιατί ένα παλιό αυτοκίνητο, αν συνεχίση να τρέχη με την ίδια ταχύτητα που έτρεχε, όταν ήταν καινούργιο, θα φύγουν οι ρόδες από ᾿δώ, το καρμπιρατέρ από ᾿κεί... Το διάστημα που μου πονούσε η μέση, δεν μπορούσα να κάνω κομποσχοίνι όρθιος. Όταν είδα ότι λιγάκι βελτιώθηκε, σηκώθηκα και έκανα τα κομποσχοίνια όρθιος και μεγάλες μετάνοιες, οπότε με ξαναπόνεσε. Κάθησα λίγο. Μετά είπα: «Άντε να ξαναδοκιμάσω». Πάλι τα ίδια· πονούσα. Ύστερα δεν συνέχισα, αλλά είχα αναπαυμένο τον λογισμό μου.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ένας πόνος, Γέροντα, που ξέρω ότι δεν έχει άλλη επίπτωση στον οργανισμό, δεν με ανησυχεί. Όταν όμως δείχνη ότι υπάρχει μια σοβαρή βλάβη, με ανησυχεί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, ο πόνος λ.χ. της μέσης μπορεί να μην έχη καμμιά επίπτωση στον οργανισμό, αλλά καθηλώνει το σώμα, ενώ τους άλλους πόνους τους υποφέρει το σώμα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν υποφέρη το σώμα, υποφέρει συγχρόνως και η ψυχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο οδηγός είναι άρρωστος, δεν μπορεί να τρέξη το αυτοκίνητο. Η ψυχή υποφέρει, όταν πονάη το σώμα. Κατάλαβες; Της λείπει η διάθεση που έχει, όταν το σώμα είναι καλά. Αδιαθετεί και η ψυχή κατά κάποιον τρόπο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο πόνος αγριεύει τον άνθρωπο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο άνθρωπος δεν αντιμετωπίση πνευματικά τον πόνο, μπορεί να αγριέψη. Όταν όμως τον αντιμετωπίση πνευματικά, ηρεμεί και παρηγοριέται θεϊκά. Είναι πανηγύρι μετά η αρρώστια. Χαίρεται, γιατί θα πάη με τους Ομολογητές και τους Μάρτυρες. Οι άγιοι Μάρτυρες ξεχνούσαν τον πόνο, γιατί η αγάπη τους προς τον Χριστό ήταν μεγαλύτερη από τον πόνο και τον εξουδετέρωνε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτός που πονάει και δεν αντιμετωπίζει πνευματικά τον πόνο, δεν εξαγνίζεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο κοσμικός εξαγνίζεται, όχι όμως και ο μοναχός.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η  συμμετοχή στον πόνο των άλλων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν ο άνθρωπος πονάη για τον συνάνθρωπό του, ο Θεός κατά κάποιον τρόπο συγκινείται, χαίρεται, γιατί ο άνθρωπος αυτός, με την αγάπη που έχει, συγγενεύει μαζί Του, και του δίνει θεία παρηγοριά. Αλλιώς δεν θα μπορούσε να αντέξη τον πόνο για τον συνάνθρωπό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς μπορείς να νιώσης τον πόνο των άλλων;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν έχης κι εσύ κάποιον πόνο, σκέφτεσαι τον πόνο του άλλου, έρχεσαι στην θέση του και πονάς πιο πολύ για ᾿κείνον. Ο πόνος ο δικός σου δηλαδή σε βοηθάει να καταλάβης τον πόνο των άλλων. Και όταν δέχεσαι με χαρά τον δικό σου πόνο, δίνεις στους πονεμένους παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως άλλο είναι να μαθαίνης ότι αρρώστησε κάποιος και άλλο είναι να αρρωσταίνης ο ίδιος. Τότε καταλαβαίνεις τον άρρωστο. Άκουγα «χημειοθεραπείες» και νόμιζα ότι είναι «χυμοθεραπείες», δηλαδή ότι κάνουν στους καρκινοπαθείς θεραπεία με χυμούς, με φυσικές τροφές! Που να ξέρω; Τώρα όμως κατάλαβα τί ταλαιπωρία είναι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι χημειοθεραπείες, Γέροντα, είναι πιο δύσκολες από τις ακτινοβολίες;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πιό δύσκολες; Όλα, και οι ακτινοβολίες και οι χημειοθεραπείες είναι... Το χειρότερο είναι που σού κόβουν την όρεξη· ενώ πρέπει να φάς καλά, δεν μπορείς να φάς καθόλου. Και οι γιατροί σού λένε: «Πρέπει να τρώς». Έμ, πώς να φάς, αφού όλα αυτά σού κόβουν την όρεξη και σε κάνουν πτώμα! Όταν έκανα ακτινοβολίες, ενώ καιγόμουν, δεν μπορούσα να πιώ καθόλου νερό. Μου ερχόταν να κάνω εμετό, αισθανόμουν απέχθεια ακόμη και για το νερό[97].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κάνατε λίγο νωρίτερα την εγχείρηση...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τί νωρίτερα; Εγώ δεν κάνω προσευχή να περάση, γιατί έτσι συμπάσχω με τον κόσμο που υποφέρει. Καταλαβαίνω πιο πολύ τους πονεμένους και συμμετέχω στον πόνο τους. Άλλωστε και εμένα με ωφελεί πνευματικά. Ζητάω μόνο να μπορώ λίγο να εξυπηρετούμαι και να εξυπηρετώ. Ό,τι θέλει όμως ο Θεός.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν έχης κάποιο πρόβλημα στην υγεία σου και δεν σε απασχολή αυτό, τότε έχεις κατά κάποιον τρόπο το δικαίωμα να παρακαλής τον Θεό να βελτιώση την κατάσταση της υγείας των άλλων. Αλλά και όποιος δεν έχει δικό του πόνο, ας πονάη τουλάχιστον γι᾿ αυτούς που πονούν. «Να πάρω τον γαταδόκκο σου», έλεγαν οι Φαρασιώτες, δηλαδή τον πόνο σου, το βάσανό σου, το φαρμάκι σου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, με τί τρόπο τον έπαιρναν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Με την αγάπη. Όταν με αγάπη λέη κανείς «νά πάρω τον πόνο σου», τον παίρνει. Αλλά, αν τον πάρη, μετά θέλει πολλή υπομονή, πολλή παλληκαριά, πολλή δύναμη, για να τον αντιμετωπίση. Έρχονται μερικοί και μου λένε: «Γέροντα, θέλω να πάρω τον πόνο σου». Μερικοί το λένε από παλληκαριά, μερικοί όμως φοβητσιάρηδες δεν ξέρουν τί λένε. Αυτοί με το παραμικρό τρέχουν στον γιατρό και εύκολα απογοητεύονται. Τον λίγο πόνο τον δικό τους δεν μπορούν να σηκώσουν και λένε να πάρουν τον δικό μου πόνο! Καλύτερα να κάνουν υπομονή στον δικό τους πόνο, να δέχωνται με χαρά ό,τι επιτρέπει γι᾿ αυτούς ο Θεός και να μη ζητούν δήθεν από αγάπη να πάρουν την αρρώστια του άλλου. Γιατί, αν τυχόν ο Θεός εκπληρώση το αίτημά τους και ξεχάσουν ότι οι ίδιοι το ζήτησαν, θα γογγύσουν και μπορεί να τα βάλουν και με τον Θεό.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Διακονία αρρώστων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Χθές βράδυ, την ώρα που πήγαινα στον ναό για την αγρυπνία, είδα σε μια άκρη έναν πατέρα με ένα παιδάκι σε αναπηρικό καροτσάκι. Πλησίασα, αγκάλιασα τον μικρό και τον φίλησα. «Είσαι ένας άγγελος, του είπα, το ξέρεις;». Και στον πατέρα του είπα: «Μεγάλη τιμή για σένα να υπηρετής έναν άγγελο. Να χαίρεστε, γιατί θα πάτε και οι δύο στον Παράδεισο». Έλαμψαν από χαρά τα πρόσωπά τους, γιατί ένιωσαν την θεϊκή παρηγοριά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αυτοί που διακονούν αρρώστους, αναπήρους κ.λπ. με αγάπη και υπομονή, αν έχουν αμαρτίες, σβήνουν τις αμαρτίες τους με την θυσία που κάνουν· αν δεν έχουν αμαρτίες, αγιάζονται. Κάποτε μια γυναίκα μου διηγήθηκε μερικά γεγονότα από την ζωή της πολύ θαυμαστά. Απόρησα, γιατί ήταν καταστάσεις που συναντούμε στους βίους των Αγίων και αυτή ήταν μια απλή γυναίκα. Όταν μου είπε πώς είχε περάσει τα περισσότερα χρόνια της ζωής της, είδα ότι όλη η ζωή της ήταν μια θυσία. Από νέα ακόμη υπηρετούσε αρρώστους, γιατί στο πατρικό της σπίτι είχαν και τον παππού και την γιαγιά, που ήταν άρρωστοι. Όταν παντρεύτηκε, έμενε με τον πεθερό και την πεθερά της, που ήταν επίσης άρρωστοι. Μετά αρρώστησε ο άνδρας της, έμεινε κατάκοιτος και τον υπηρετούσε. Όλη την ζωή της δηλαδή αυτή η γυναίκα την πέρασε διακονώντας αρρώστους. Διψούσε όλα αυτά τα χρόνια να μελετήση, να πάη σε κάποια αγρυπνία, αλλά δεν είχε χρόνο. Επειδή όμως ήταν δικαιολογημένη, ο Θεός στο τέλος της έδωσε μαζεμένη την Χάρη Του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί άνθρωποι, όταν αρρωσταίνουν, αποκτούν πολλές παραξενιές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αυτό συμβαίνει, αλλά και οι υγιείς πρέπει να δικαιολογούν λίγο την ανησυχία, την γκρίνια ή την ιδιοτροπία των αρρώστων, γιατί αυτά είναι φυσικά στους αρρώστους. Ειδικά, όποιος δεν έχει αρρωστήσει, δεν μπορεί να καταλάβη τον άρρωστο, γιατί δεν έχει πονέσει και η καρδιά του είναι λίγο σκληρή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όσοι υπηρετούν έναν άρρωστο, έναν κατάκοιτο, χρειάζεται πολύ να προσέξουν να μην τον κάνουν να γογγύση. Μπορεί να τον υπηρετούν για χρόνια, αν όμως μια φορά στο τέλος τον κάνουν να γογγύση, τα χάνουν όλα. Είναι βαρύ να φύγη η ψυχή  με γογγυσμό από αυτόν τον κόσμο. Αλλά και εκείνους μετά ο πονηρός θα τους βασανίζη, λεπταίνοντας δήθεν την συνείδησή τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν υπηρετής έναν άρρωστο, δεν σε καταβάλλει μόνον η κούραση, αλλά και η στενοχώρια, γιατί βλέπεις έναν δικό σου άνθρωπο σιγά-σιγά να σβήνη.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, αλλά και ο Θεός όλους τους οικονομάει! Βλέπεις, όταν αρρωσταίνη ένα μέλος από την οικογένεια, όλη η οικογένεια πονάει. Και αν τυχόν είναι ο πατέρας και δεν μπορή να εργαστή, ολόκληρη η οικογένεια και πονάει και δυστυχεί. Έχει την αγωνία, «θά ζήση ο πατέρας, δεν θα ζήση;». Βασανίζεται αυτός, βασανίζονται και οι άλλοι. Σβήνει αυτός, σβήνουν και οι γύρω του. Και η μητέρα τότε πρέπει να δουλέψη περισσότερο. Να φροντίση τα παιδιά, να πάη και στο νοσοκομείο, για να κοιτάξη τον άρρωστο. Θέλω να πώ, όταν κάποιος αρρωστήση από μια βαρειά αρρώστια, και ο ίδιος υποφέρει, κουράζεται και θέλει να πεθάνη, αλλά και οι δικοί του που τον υπηρετούν, στενοχωριούνται, ταλαιπωρούνται και κουράζονται. Και όσο περισσότερο δεμένοι και αγαπημένοι είναι, επιτρέπει στο τέλος ο Θεός, και ο άρρωστος και αυτοί που τον υπηρετούν να ταλαιπωρούνται πιο πολύ, να πονούν πιο πολύ, μέχρι να φθάσουν να πούν: «άς τον πάρη ο Θεός, για να ξεκουρασθή» – αλλά για να ξεκουρασθούν και αυτοί. Βλέπετε, όταν μια οικογένεια είναι πολύ αγαπημένη, και οι γονείς πεθαίνουν στα καλά καθούμενα, χωρίς να αρρωστήσουν, και δεν ταλαιπωρούνται ούτε αυτοί ούτε τα παιδιά τους, γιατί χρειάσθηκε να τους υπηρετήσουν, ο πόνος του χωρισμού για τα παιδιά είναι πολύ οδυνηρός.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο ψυχικός παράγων πόσο μπορεί να επηρεάση την σωματική υγεία;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν κανείς είναι ψυχικά καλά, ο σωματικός πόνος ελαφρώνει. Όταν δεν είναι καλά ψυχικά, η άσχημη ψυχική κατάσταση επιδεινώνει την υγεία του. Πάρε έναν καρκινοπαθή που τον έχουν ξεγραμμένο οι γιατροί. Αν πιστεύη στον Θεό και βρεθή σε μια χαρούμενη πνευματική ατμόσφαιρα, μπορεί να ζήση περισσότερο, ενώ διαφορετικά μπορεί να λειώση από την στενοχώρια του και να σβήση μέσα σε λίγες εβδομάδες. Καμμιά φορά μπορεί κάποιος από ιατρικής πλευράς να είναι υγιής, οι εξετάσεις να μη δείχνουν τίποτε, αλλά, αν έχη κάτι που τον σακατεύει ψυχικά, τότε να μην είναι πραγματικά καλά. Γιατί οι περισσότερες αρρώστιες από την στενοχώρια ξεκινούν. Όλοι οι άνθρωποι έχουν κάποιο ευαίσθητο σημείο. Μια στενοχώρια άλλον θα τον χτυπήση στο στομάχι, άλλον στο κεφάλι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το καλύτερο φάρμακο για μια αρρώστια είναι η πνευματική χαρά, γιατί σκορπάει την θεία Χάρη στην ψυχή. Η πνευματική χαρά έχει την μεγαλύτερη ιαματική δύναμη για όλες τις αρρώστιες. Είναι η θεϊκή αλοιφή που επουλώνει τις πληγές, ενώ η στενοχώρια τις ερεθίζει.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η  ταλαιπωρία του αρρώστου και η εμπιστοσύνη στον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αν κάποιος έχη μια βαρειά αρρώστια και αποφασίση να αφεθή στον Θεό, θα κάνη καλά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άμα δεν έχη υποχρεώσεις, ό,τι θέλει κάνει. Άμα  όμως έχη υποχρεώσεις, αυτό θα εξαρτηθή και από τους άλλους. Και εγώ πήγα στον γιατρό «άκων και μη βουλόμενος»... Αν δεν πήγαινα για εκείνη την «απλή εξέταση» που είπε ο γιατρός, θα έκλεινε τελείως το έντερο. Οπότε θα έπινα μόνο λίγα υγρά και μετά πάει, θα τελείωναν όλα. «Μια απλή εξέταση», μου είπε, και μπήκα σε έναν τέτοιο κύκλο... Αξονικές από εδώ, καρδιολόγος από εκεί, τώρα τα λευκά αιμοσφαίρια κατέβηκαν, τώρα ανέβηκαν, κοψίματα, μπαλώματα... Και τελικά τί βγήκε; Όπως πάω, θα καθήσω εδώ...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Συνήθως λέμε: «Οι άρρωστοι πρώτα να φροντίσουν να βοηθηθούν ανθρωπίνως και σε ό,τι δεν μπορούν να βοηθηθούν ανθρωπίνως θα βοηθήση ο Θεός». Αλλά δεν πρέπει να ξεχνούμε ότι, για να βοηθηθούν ανθρωπίνως οι άνθρωποι που πάσχουν από κάποια βαρειά αρρώστια, περνούν μεγάλη ταλαιπωρία, ολόκληρο μαρτύριο. Πρέπει να κάνουν ένα σωρό εξετάσεις, εγχειρήσεις, μεταγγίσεις, χημειοθεραπείες, ακτινοβολίες. Τρυπήματα για τις μεταγγίσεις, τρυπήματα για τους ορούς...  Να σπάζουν οι φλέβες, να τους βάζουν την τροφή από την μύτη, να μην μπορούν να κοιμηθούν... Και όλα αυτά, για να γίνη αυτό που γίνεται ανθρωπίνως. Κατάλαβες; Δεν είναι κάτι απλό, πρόκειται λ.χ. για μια πληγή  που μάζεψε πύον και πρέπει να σπάση, για να βγή το πύον, και μετά θα γίνουν καλά. Εδώ τούτα είναι ολόκληρη διαδικασία. Γι᾿ αυτό δεν πρέπει να επαναπαυώμαστε και να λέμε «εντάξει, αυτός ο άρρωστος έπεσε σε καλούς γιατρούς», αλλά να έχουμε υπ᾿ όψιν ότι, για να βοηθηθή ο άρρωστος ιατρικά, πρέπει να περάση μια ολόκληρη ταλαιπωρία και να προσευχώμαστε με πόνο να του δίνη ο Χριστός υπομονή. Να φωτίζη τους γιατρούς, γιατί οι γιατροί μπορεί να κάνουν λάθη, ιδίως αν δεν έχουν ταπείνωση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπεις, όταν χαλάση το σπίτι, ο νοικοκύρης του σπιτιού δεν μπορεί να σταθή. Έτσι και ο νοικοκύρης του σώματος, η ψυχή, δεν μπορεί να σταθή, αν χαλάση το σπίτι της, το σώμα. Και τώρα προσπαθούν να κρατήσουν τον νοικοκύρη μέσα στο σπίτι με το σίδηρο, με το ...ατσάλι, με βιταμίνες Α, Β, C..., να βοηθήσουν δηλαδή τους αρρώστους με την επιστήμη, αλλά δεν βοηθιούνται όλοι καί, με την βοήθεια που τους προσφέρουν, απλώς παρατείνεται η ζωή τους με πόνο, παρατείνεται μάλλον ο πόνος. Γιατί δεν φθάνει μόνον η επιστήμη. Χρειάζεται και πίστη και προσευχή. Καμμιά φορά βλέπω και εδώ στο μοναστήρι τις αδελφές που είναι γιατροί να θέλουν περισσότερο με την επιστήμη τους να βοηθήσουν τον άρρωστο παρά με την εμπιστοσύνη στον Θεό και με την προσευχή. Η καρδιακή όμως προσευχή θα τις δώση ανώτερο ιατρικό πτυχίο, διότι θα σταματούν την ανθρώπινη επιστήμη. Όταν καλλιεργηθή η αγάπη με τον πόνο γενικά για όλους τους ανθρώπους, τότε ενεργούν οι θείες δυνάμεις, αρκεί να υπάρχη βαθειά ταπείνωση στην ψυχή, για να μην υπερηφανευθή και αδικήση τον Θεό νομίζοντας ότι είναι δικές της αυτές οι δυνάμεις.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Δεν πρέπει να ξεχνούμε ότι ο Χριστός μπορεί ακόμη και αυτά που δεν θεραπεύονται από γιατρούς να τα θεραπεύση, αλλά πρέπει να υπάρχη σοβαρός λόγος και ο πιστός να είναι πολύ πιστός και πολύ δοσμένος στον Χριστό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, όταν οι άνθρωποι υποφέρουν, να μη ζητούν ιατρική βοήθεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν εννοώ αυτό, βρέ παιδί! Δεν λέω «μήν του βάζης λ.χ. οξυγόνο», για να σκάση ο άνθρωπος. Θέλω να πώ, τί τραβάει ο άρρωστος, για να βοηθηθή ανθρωπίνως, και ότι πρέπει να κάνουμε προσευχή να βοηθάη ο Χριστός τους αρρώστους, για να μην ταλαιπωρούνται. Αν κάτι είναι σοβαρό, να παρακαλούμε τον Χριστό να το πάρη με ένα χάδι Του. Γιατί ο Χριστός, λίγο αν χαϊδέψη τους αρρώστους στο χέρι, φεύγουν όλα και γίνονται καλά! Ούτε φάρμακα χρειάζονται μετά ούτε φαρμάκια. Κι αν τους χαϊδέψη στο πρόσωπο, είναι ακόμη καλύτερα. Αν τους αγκαλιάση κιόλας, θα μαλακώση και η καρδιά τους! Καταλάβατε; Χρειάζεται όμως μεγάλη πίστη. Αν δεν έχη πίστη ο ίδιος ο άρρωστος, δεν γίνεται καλά.
- type: h2
  initial:
    ru: ''
  text:
    ru: Άρρωστα παιδάκια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτό το άρρωστο παιδάκι, που έφεραν σήμερα οι γονείς του, πολύ ταλαιπωρείται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, σιγά-σιγά θα ξεπεράση την αρρώστια του, αλλά θα του μείνη μια ευαισθησία, για να θυμάται την αρρώστια του, και αυτή η ευαισθησία θα το βοηθάη πνευματικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τα παιδάκια, Γέροντα, που έχουν λευχαιμία πολύ υποφέρουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά πολύ τα βοηθάει η Θεία Κοινωνία. Πολλά παιδάκια ξεπέρασαν την αρρώστια τους με την Θεία Κοινωνία. Όταν διαβάζουμε τον 145ο Ψαλμό[98], με τον οποίο παρακαλούμε τον Θεό να σταματήσουν οι αιμορραγίες, να προσευχώμασε να βοηθήση ο Θεός τα παιδάκια που έχουν λευχαιμία, αλλά και να υπάρχη αίμα στα νοσοκομεία για τα παιδιά που έχουν μεσογειακή αναιμία. Τα παιδιά αυτά περνούν μαρτύριο μεγαλύτερο και από το μαρτύριο των παιδιών που έσφαξε ο Ηρώδης[99]. Τα παιδάκια έχουν καθαρό μισθό από την ταλαιπωρία της αρρώστιας, γιατί δεν έχουν αμαρτίες. Πόσα μικρούτσικα παιδιά θα δούμε στην άλλη ζωή να είναι με το μαρτυρικό, το αγγελικό, τάγμα εκείνων των νηπίων! Μωρά δύο μηνών, να τα εγχειρίζουν, να τους βάζουν ενέσεις, ορούς! Που να βρουν φλέβα στα καημένα! Τα τρυπούν από ᾿δώ-από ᾿κεί... Να βλέπης παιδάκι να έχη όγκο στο κεφάλι και να του κάνουν ακτίνες, να βάζουν κάτι καλώδια σε ένα τόσο δά κεφαλάκι. Εδώ ένας μεγάλος δεν μπορεί να αντέξη, που να αντέξουν τα παιδάκια!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά τα παιδάκια, Γέροντα, τελικά θεραπεύονται ή πεθαίνουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έ, πολλά φυσικά πεθαίνουν, αλλά και οι γονείς πώς να τα αφήσουν;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αξίζει τον κόπο οι παιδίατροι να προσπαθούν να διατηρήσουν στην ζωή τα πρόωρα βρέφη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι γιατροί πρέπει να κάνουν ό,τι μπορούν και παράλληλα να προσεύχωνται γι᾿ αυτά. «Θεέ μου, να λένε, αν είναι αυτό το παιδί να ζήση και να υποφέρη σε όλη του την ζωή, τότε, Σε παρακαλώ, να το πάρης». Να φροντίζουν όμως να βαπτίζωνται τα βρέφη, και τότε θα τους προϋπαντήσουν στον Παράδεισο με αναμμένη λαμπάδα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Και όταν είναι μεγαλύτερα τα παιδιά, πρέπει οι γιατροί πολύ να προσέξουν πώς θα πούν την διάγνωση. Οκτώ χρονών παιδάκι του είπε ο γιατρός: «Θα τυφλωθής». Έρχεται και μου λέει και ο πατέρας μπροστά στο παιδί: «Το πήγαμε στο εξωτερικό για εξετάσεις και μας είπαν ότι θα τυφλωθή». Και καλά να είναι το παιδί, η στενοχώρια μπορεί να το χτυπήση όπου έχει ευαισθησία, πόσο μάλλον αν είναι άρρωστο!'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η θυσία για το καλό του αρρώστου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αν ζητούμε κάτι από τον Θεό, χωρίς να θυσιάζουμε και κάτι, δεν έχει αξία. Αν κάθωμαι και λέω: «Θεέ μου, Σε παρακαλώ, κάνε καλά τον τάδε άρρωστο», χωρίς να κάνω κάποια θυσία, είναι σαν να λέω απλώς καλά λόγια. Ο Χριστός θα δη την αγάπη μου, την θυσία μου, και τότε θα εκπληρώση το αίτημά μου, αν βέβαια αυτό είναι για το πνευματικό καλό του άλλου. Γι᾿ αυτό, όταν οι άνθρωποι σάς ζητούν να προσευχηθήτε για κάποιον άρρωστο, να τους λέτε να προσευχηθούν και αυτοί ή τουλάχιστον να αγωνισθούν να κόψουν τα κουσούρια τους.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μερικοί άνθρωποι έρχονται και μου λένε: «Κάνε με καλά· έμαθα ότι μπορείς να με βοηθήσης». Θέλουν όμως να βοηθηθούν, χωρίς οι ίδιοι να καταβάλουν καθόλου προσπάθεια. Λές λ.χ. στον άλλον: «μήν τρώς γλυκά, κάνε αυτήν την θυσία, για να σε βοηθήση ο Θεός», και σού λένε: «Γιατί; δεν μπορεί να με κάνη καλά ο Θεός;». Δεν κάνουν μια θυσία για τον εαυτό τους, πόσο μάλλον να θυσιασθούν για τον άλλον. Άλλος δεν τρώει γλυκά, για να βοηθήση ο Χριστός όσους πάσχουν από ζάχαρο, ή δεν κοιμάται, για να δώση λίγο ύπνο ο Χριστός σ᾿ αυτούς που πάσχουν από αϋπνίες. Έτσι συγγενεύει ο άνθρωπος με τον Θεό. Τότε ο Θεός δίνει την Χάρη Του.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Εγώ, όταν μου λέη κάποιος πώς δεν μπορεί να προσευχηθή για κάποιον δικό του που είναι άρρωστος, του λέω να κάνη και αυτός μια θυσία για τον άρρωστο. Συνήθως του λέω να κάνη κάτι που θα είναι καλό και για την δική του υγεία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ήρθε κάποτε από την Γερμανία στο Καλύβι ένας πατέρας, που το κοριτσάκι του είχε αρχίσει να παραλύη. Οι γιατροί το είχαν ξεγράψει. Ήταν ο καημένος τελείως απελπισμένος. «Κάνε κι εσύ μια θυσία, του είπα, για την υγεία του παιδιού σου. Να κάνης μετάνοιες, δεν μπορείς· να προσευχηθής, δεν μπορείς, εντάξει. Πόσα τσιγάρα καπνίζεις την ημέρα;». «Τεσσεράμισι κουτιά», μου λέει. «Να καπνίζης ένα κουτί, του λέω, και τα χρήματα που θα έδινες για τα υπόλοιπα να τα δίνης σε κανέναν φτωχό». «Να γίνη, Πάτερ, καλά το παιδί, μου λέει, και εγώ θα το κόψω το τσιγάρο». «Έ, τότε δεν θα έχη αξία· τώρα πρέπει να το κόψης· πέταξε το τσιγάρο, του λέω. Δεν αγαπάς το παιδί σου;». «Εγώ δεν αγαπώ το παιδί μου; Από τον πέμπτο όροφο πετιέμαι κάτω για την αγάπη του παιδιού μου», μου λέει. «Εγώ δεν σού λέω να πεταχτής από τον πέμπτο όροφο κάτω, αλλά να πετάξης το τσιγάρο. Αν κάνης μια παλαβωμάρα και πεταχτής από τον πέμπτο όροφο κάτω, θα αφήσης το παιδί σου στον δρόμο κι εσύ θα χάσης την ψυχή σου. Εγώ σού λέω να κάνης κάτι εύκολο. Νά, πέταξε τώρα τα τσιγάρα!». Με κανέναν τρόπο δεν ήθελε να τα πετάξη. Και τελικά έφυγε έτσι και έκλαιγε! Πώς να βοηθηθή αυτός ο άνθρωπος; Ενώ όσοι ακούν βοηθιούνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Μια άλλη μέρα ήρθε ένας που αγκομαχούσε από την πεζοπορία. Κατάλαβα ότι κάπνιζε πολύ και του είπα: «Βρέ ευλογημένε, γιατί καπνίζεις τόσο; Θα πάθης κακό». Μόλις ξελαχάνιασε και μπόρεσε να μιλήση, μου είπε: «Η γυναίκα μου είναι πολύ άρρωστη και κινδυνεύει να πεθάνη. Σε παρακαλώ, κάνε μια προσευχή να γίνη κανένα θαύμα. Οι γιατροί σήκωσαν τα χέρια». «Την αγαπάς την γυναίκα σου;», τον ρωτάω. «Την αγαπώ», μου λέει. «Τότε γιατί δεν κάνεις κι εσύ κάτι, για να την βοηθήσης; Αυτή έκανε ό,τι μπορούσε, οι γιατροί έκαναν ό,τι μπορούσαν, και τώρα έρχεσαι εδώ, για να μου πής να κάνω κάτι και εγώ, να προσευχηθώ, για να βοηθήση ο Θεός. Εσύ όμως τί έκανες, για να βοηθηθή η γυναίκα σου;». «Τί μπορώ να κάνω εγώ, Γέροντα;», με ρωτάει. «Αν σταματήσης το κάπνισμα, του λέω, η γυναίκα σου θα γίνη καλά». Σκέφθηκα ότι, αν ο Θεός δη ότι δεν συμφέρει πνευματικά στην γυναίκα του να γίνη καλά, τουλάχιστον θα γλιτώση αυτός από το κακό που κάνει το τσιγάρο. Ύστερα από έναν μήνα ήρθε χαρούμενος να με ευχαριστήση. «Γέροντα, σταμάτησα το κάπνισμα, μου είπε, και η γυναίκα μου έγινε καλά». Μετά από ένα διάστημα ξαναήρθε αναστατωμένος να μου πη ότι ξανάρχισε κρυφά να καπνίζη και η γυναίκα του έπεσε πάλι βαριά άρρωστη. «Το φάρμακο τώρα το ξέρεις, του είπα. Κόψε το τσιγάρο».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η  προσευχή για τους αρρώστους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παρακάλεσαν να σάς πούμε να προσευχηθήτε για ένα άρρωστο παιδάκι και ρωτούν αν θα γίνη καλά. Τί να τους πούμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πέστε τους: «Ο Γέροντας θα προσευχηθή. Ο Χριστός αγαπάει το παιδί και θα κάνη ό,τι είναι για το καλό του. Αν δη ότι το παιδί, όταν μεγαλώση, θα γίνη καλύτερο, θα ακούση την προσευχή του. Αν δη όμως ότι αργότερα δεν θα είναι σε καλή πνευματική κατάσταση, τότε, επειδή το αγαπάει, θα το πάρη». «Ζήτησε, λέει, και θα σού δώσω»[100]. Αλλά θα μου το δώση ο Θεός, αν εγώ είμαι δοσμένος στον Θεό· αλλιώς, τί να μου δώση την ζωή, για να ξεφύγω; Εγώ χαίρομαι, είτε γίνη καλά είτε πεθάνη ένας άρρωστος για τον οποίο προσεύχομαι.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, είναι καλό να προσευχώμαστε για την υγεία μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλύτερα είναι να ζητούμε από τον Θεό να ελευθερωθούμε από τα πάθη μας. Να ζητούμε δηλαδή πρώτα την Βασιλεία του Θεού. Αν παρακαλούμε τον Θεό να μας κάνη καλά, τρώμε την ουράνια περιουσία. Όταν όμως δεν αντέχουμε τους πόνους της αρρώστιας, τότε να παρακαλούμε τον Θεό να μας θεραπεύση, και Εκείνος θα ενεργήση ανάλογα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, το αν βοηθηθή ένας άρρωστος από την προσευχή που κάνουμε, εξαρτάται και από το τί ζητάει και ο ίδιος από τον Θεό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ο άρρωστος, αν ζητάη από τον Θεό να γίνη καλά μόνον εκείνος και δεν προσεύχεται να γίνουν καλά και οι άλλοι άρρωστοι, δεν κάνει καλά. Εσύ, αδελφή, όταν ήσουν στον κόσμο και εργαζόσουν στο νοσοκομείο, τί έκανες, όταν ο άρρωστος δεν μπορούσε να λέη την ευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Την έλεγα εγώ, Γέροντα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Καλά εσύ, αλλά και ο άρρωστος έπρεπε να λέη κάποια προσευχή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έλεγε και εκείνος «Παναγία μου» ή «Παναγία μου, σώσε με». Αλλά, Γέροντα, και η υπομονή στον πόνο δεν είναι προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, μπράβο! Είναι και αυτό! Εσείς, όταν σάς ζητάη κάποιος να κάνετε προσευχή, γιατί την τάδε ημέρα θα μπή στο χειρουργείο, να προσεύχεσθε από την στιγμή που σάς το ζητάει. Να μην περιμένετε την ώρα που θα μπή στο χειρουργείο να προσευχηθήτε. Και στις ακολουθίες, όταν λέη ο ιερέας «υπέρ των εν ασθενείαις κατακειμένων»[101], να λέτε με πόνο το «Κύριε, ελέησον». Αν κάνετε με το διαπασών «βού...», για να πήτε «Κύριε, ελέησον» μουσικό, ο νούς σας θα είναι στο «βού...» και στον χαβά, και οι άρρωστοι οι καημένοι που υποφέρουν θα περιμένουν από σάς λίγη βοήθεια! Εκείνοι έχουν τον πόνο τους. Εσύ, που δεν έχεις πόνο, προσευχήσου για εκείνους, να βοηθηθούν. Αφού δεν αναστενάζεις στο κρεββάτι, αναστέναξε τουλάχιστον στην προσευχή για τους αρρώστους. Αν οι υγιείς δεν κάνουν λίγη προσευχή για τους αρρώστους, θα τους πη μεθαύριο ο Χριστός: «Είχατε την υγεία σας και δεν κάνατε προσευχή γι᾿ αυτούς που υπέφεραν; «Ουκ οίδα υμάς..."[102]».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αν για έναν άρρωστο δεν κάνουμε προσευχή, η αρρώστια θα ακολουθήση την φυσική της πορεία. Ενώ, αν κάνουμε προσευχή, μπορεί να αλλάξη δρόμο. Γι᾿ αυτό πάντα να κάνετε προσευχή για τους αρρώστους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 3 – Η αναπηρία είναι ευλογία από τον Θεό
- type: h2
  initial:
    ru: ''
  text:
    ru: Σωστή αντιμετώπιση της αναπηρίας
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μια αναπηρία, Γέροντα, μπορεί να δημιουργήση σύμπλεγμα κατωτερότητος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά είναι μπανταλά[103].
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στους αναπήρους όμως, Γέροντα, μερικές φορές συμβαίνει αυτό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συμβαίνει, γιατί δεν τοποθετούνται σωστά. Όταν καταλάβουν ότι η αναπηρία είναι ευλογία από τον Θεό, τοποθετούνται σωστά και απαλλάσσονται από την μειονεκτικότητα. Όταν ένα μικρό παιδί έχη κάποια αναπηρία και δεν έχη βοηθηθή, ώστε να χαίρεται για την αναπηρία του, τότε έχει ελαφρυντικά, αν αισθάνεται μειονεκτικά. Αλλά, αν μεγαλώση και παραμένη η μειονεκτικότητα, σημαίνει ότι δεν έχει συλλάβει το βαθύτερο νόημα της ζωής. Σε ένα κοριτσάκι, όταν ήταν εννέα χρονών, παρουσιάσθηκε όγκος στο μάτι του και οι γιατροί του αφήρεσαν το ένα μάτι. Τα παιδιά στο σχολείο το κορόιδευαν και αυτό το καημένο βασανιζόταν. Ο πατέρας του ήρθε στο Καλύβι και μου είπε το πρόβλημά του. «Σκέφθηκα, Γέροντα, μου είπε, πώς, αν του παίρνω ό,τι μου ζητάει, θα το βοηθήσω, γιατί θα χαίρεται και θα ξεχνάη την στενοχώρια για την αναπηρία του. Ναί, αλλά πώς να το κάνω αυτό; Έχω άλλα πέντε μικρά παιδιά, που ζηλεύουν, γιατί δεν καταλαβαίνουν». «Τί είναι αυτά; του λέω. Αυτά είναι μια ψεύτικη παρηγοριά· δεν είναι λύση. Αν του παίρνης τώρα όποιο φόρεμα σού ζητάει, μετά από λίγα χρόνια θα σού ζητήση να του πάρης και μερσεντές. Πώς θα τα βγάλης πέρα; Ύστερα θα μάθη ότι μερικοί έχουν αεροπλάνα στην ταράτσα τους και θα σού ζητάη να του πάρης αεροπλάνο! Τί θα κάνης τότε; Προσπάθησε να βοηθήσης το παιδί σου να χαρή που έχει ένα μάτι. Να αισθάνεται ότι είναι μάρτυρας. Πολλούς Μάρτυρες τους έβγαζαν τα μάτια, τους έκοβαν τα αυτιά, την μύτη, και ο κόσμος γελούσε μαζί τους. Αυτοί όμως, ενώ υπέφεραν από τον πόνο και από την κοροϊδία των ανθρώπων, δεν υποχωρούσαν και υπέμειναν ακλόνητοι το μαρτύριο. Αν το παιδί καταλάβη και αντιμετωπίση με δοξολογία την αναπηρία του, ο Θεός θα το κατατάξη με τους Ομολογητές. Μικρό πράγμα είναι να οικονομήση ο Θεός να βγάλουν το μάτι του παιδιού με τέτοιο τρόπο, που να μην πονέση, και να το κατατάξη με τους Ομολογητές; Γιατί αυτό δεν έχει αμαρτίες να εξοφλήση και θα έχη καθαρό μισθό από αυτήν την αναπηρία». Με ευχαρίστησε ο καημένος και έφυγε αναπαυμένος. Πράγματι βοήθησε το κοριτσάκι του να καταλάβη ότι η αναπηρία του ήταν ευλογία από τον Θεό και να δοξολογή τον Θεό. Έτσι μεγάλωσε φυσιολογικά, σπούδασε φιλολογία και τώρα εργάζεται ως καθηγήτρια και χαίρεται πιο πολύ από άλλες κοπέλες που τα έχουν όλα και βασανίζονται, γιατί δεν έχουν συλλάβει το βαθύτερο νόημα της ζωής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν οι άνθρωποι δεν καταλάβουν το βαθύτερο νόημα της ζωής, βασανίζονται και με τις ευλογίες και με τις ευκαιρίες που τους δίνει ο Θεός για την σωτηρία τους. Ενώ, όποιος τοποθετείται σωστά, όλα τα χαίρεται. Και κουτσός να είναι, το χαίρεται! Και να μην του κόβη πολύ, το χαίρεται. Και φτωχός να είναι, το χαίρεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Καταλαβαίνω βέβαια πόσο δυσκολεύονται οι ανάπηροι και προσεύχομαι πολύ γι᾿ αυτούς, και πιο πολύ για τις κοπέλες. Για ένα αγόρι μια αναπηρία δεν είναι και τόσο βαρύ· για μια κοπέλα όμως, που θέλει να αποκατασταθή, είναι δύσκολο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ιδίως οι τυφλοί πόσο δυσκολεύονται! Οι καημένοι δεν μπορούν να εξυπηρετηθούν· όταν περπατούν, σκοντάφτουν... Στην προσευχή μου ζητώ από τον Θεό να δώση στους τυφλούς τουλάχιστον λίγο φώς, για να μπορούν κάπως να αυτοεξυπηρετούνται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, κι εγώ στενοχωριέμαι που δεν μπορώ να διαβάσω έστω ένα κεφάλαιο από το Ευαγγέλιο, γιατί δεν βλέπω καλά.Μας έχετε πει πώς, αν διαβάζη κανείς κάθε μέρα ένα κεφάλαιο, αγιάζεται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γιατί να στενοχωριέσαι γι᾿ αυτό; Αν διαβάσης λίγους στίχους ή μόνο μία λέξη ή απλώς ασπασθής το Ευαγγέλιο, δεν αγιάζεσαι; Άλλωστε εσύ δεν γνώρισες τώρα τον Χριστό. Γιατί δεν μελετάς νοερά όσα διάβασες ή όσα άκουσες μέχρι τώρα; Όλη η βάση είναι η σωστή τοποθέτηση. Να πής: «Τώρα ο Θεός με θέλει έτσι, πριν από λίγα χρόνια με ήθελε αλλιώς». Ένας ευλαβής δικηγόρος στα γεράματά του δεν έβλεπε και μου είπε μια φορά: «Κάνε, άγιε Γέροντα, προσευχή να μπορώ λίγο να διαβάζω και να γνωρίζω τα προσφιλή μου πρόσωπα». «Τα προσφιλή πρόσωπα τα γνωρίζεις και από την φωνή, του είπα. Όσο για το διάβασμα, τόσα χρόνια διάβαζες. Τώρα να λές την ευχή. Φαίνεται ότι τώρα ο Θεός αυτό θέλει από σένα». Και από τότε ο καημένος ένιωθε μεγαλύτερη χαρά από ό,τι όταν έβλεπε.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο ουράνιος μισθός για την αναπηρία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όταν έχουμε κάποια αναπηρία, αν κάνουμε υπομονή και δεν γκρινιάζουμε, τότε έχουμε μεγαλύτερο μισθό. Γιατί όλοι οι ανάπηροι αποταμιεύουν. Ένας κουφός έχει τσέκ στο Ταμιευτήριο του Θεού από το κουφό αυτί, ένας τυφλός από το τυφλό μάτι, ένας κουτσός από το κουτσό πόδι. Είναι μεγάλη υπόθεση! Αν κάνουν και λίγο αγώνα κατά των ψυχικών παθών, θα έχουν να λάβουν και στεφάνια από τον Θεό. Βλέπεις, οι ανάπηροι πολέμου παίρνουν σύνταξη, παίρνουν και παράσημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όποιος έχει ομορφιά, λεβεντιά, υγεία, και δεν αγωνίζεται να κόψη τα ελαττώματά του, θα του πη ο Θεός: «Απήλαυσες στην ζωή σου τα αγαθά σου, την λεβεντιά σου! Τί σού χρωστώ τώρα; Τίποτε». Ενώ όποιος έχει μια αναπηρία – είτε έτσι γεννήθηκε, είτε την κληρονόμησε από τους γονείς του, είτε την απέκτησε αργότερα -, πρέπει να χαίρεται, γιατί έχει να λάβη στην άλλη ζωή. Όταν μάλιστα δεν έχη φταίξει, θα έχη καθαρό ουράνιο μισθό, χωρίς κρατήσεις. Δεν είναι μικρό πράγμα μια ολόκληρη ζωή να μην μπορή κάποιος λ.χ. να απλώση το πόδι του, να μην μπορή να καθήση, να μην μπορή να κάνη μετάνοιες κ.λπ. Στην άλλη ζωή ο Θεός θα του πή: «Έλα, παιδί μου, κάθησε πια αιώνια άνετα σ᾿ αυτήν την πολυθρόνα». Γι᾿ αυτό λέω, χίλιες φορές να είχα γεννηθή καθυστερημένος διανοητικά, τυφλός, κουφός, γιατί θα είχα να λάβω τότε από τον Θεό.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι ανάπηροι, εάν δεν γογγύζουν, αλλά δοξολογούν ταπεινά τον Θεό και ζουν κοντά Του, θα έχουν την καλύτερη θέση στον Παράδεισο. Ο Θεός θα τους κατατάξη με τους Ομολογητές και τους Μάρτυρες, που έδωσαν για την αγάπη του Χριστού τα χέρια και τα πόδια τους, και τώρα στον Παράδεισο φιλούν με ευλάβεια συνέχεια τα πόδια και τα χέρια του Χριστού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, κάποιος είναι λ.χ. κουφός και γκρινιάρης;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και τα μικρά παιδιά γκρινιάζουν. Ο Θεός σε πολλά δεν δίνει σημασία. Βλέπετε, οι καλοί γονείς αγαπούν όλα τα παιδιά τους εξίσου, αλλά δείχνουν ιδιαίτερο ενδιαφέρον για τα αδύνατα ή τα ανάπηρα. Το ίδιο κάνει και ο Θεός, ο Καλός μας Πατέρας, για τα παιδιά Του που είναι αδύνατα σωματικά ή πνευματικά, αρκεί αυτά να έχουν αγαθή διάθεση και να Του δίνουν το δικαίωμα να επεμβαίνη στην ζωή τους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα καθυστερημένα παιδιά
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Οι μάνες που έχουν καθυστερημένα παιδιά, που κάνουν συνέχεια σκηνές, που λερώνουν, τί τραβάνε οι καημένες! Μαρτύριο! Γνώρισα μια μάνα που έχει κοτζάμ παιδί και δεν μπορεί να το κουμαντάρη, γιατί κάνει κάτι αταξίες!... Το καημένο παίρνει τις ακαθαρσίες και πασαλείβει τα ντουβάρια, τα σεντόνια... Η μάνα να συμμαζεύη, να καθαρίζη το σπίτι, να κάνη όλο το νοικοκυριό, και αυτό να τα κάνη όλα άνω-κάτω, όλα να τα λερώνη. Να κρύβη η φουκαριάρα τα απορρυπαντικά και αυτό να τα βρίσκη και να τα πίνη! Ολόκληρα ντουλάπια τα πετάει κάτω από το μπαλκόνι. Φύλαξε ο Θεός και δεν σκότωσε κανέναν μέχρι τώρα. Και δεν είναι μια μέρα και δυό. Χρόνια ολόκληρα είναι αυτή η κατάσταση!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κάποιος που είναι λειψός στο μυαλό να έχη ταπείνωση και καλωσύνη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πώς δεν μπορεί! Νά, αυτό το παιδάκι που έρχεται συχνά εδώ στο μοναστήρι μπορεί να είναι διανοητικά καθυστερημένο, αλλά την καλωσύνη που έχει αυτό, ποιός λογικός άνθρωπος την έχει; Τί προσευχή, τί μετάνοιες κάνει! Όταν με την κήλη δυσκολευόμουν να κάνω μετάνοιες, του είπαν οι γονείς του: «Ο Παππούλης είναι άρρωστος· δεν μπορεί να κάνη μετάνοιες». «Κάνω ᾿γώ», είπε εκείνο, και έκανε μετά μετάνοιες για μένα και γινόταν μούσκεμα στον ιδρώτα. Πόσο φιλότιμο, πόση αρχοντιά έχει! Μια φορά το έδειρε ένα παιδί στην γειτονιά, κι εκείνο, αφού έφαγε το ξύλο, του έδωσε το χέρι και του είπε: «Γειά, χαρά!». Ακούς; Ποιός γνωστικός το κάνει αυτό, κι ας έχη διαβάσει Ευαγγέλιο και ένα σωρό πνευματικά βιβλία. Νά, και πριν από λίγες μέρες που είχε έρθει εδώ όλη η οικογένειά του να με δή, αυτό κάθησε δίπλα μου και η αδελφούλα του πιο πέρα. Μόλις είδε την αδελφούλα του που κάθησε μακριά μου, «έλα, κοντά Παππούλη», της λέει και την έβαλε δίπλα μου. Πολύ με συγκίνησε και του έδωσα ευλογία έναν μεγάλο φιλντισένιο σταυρό που μου είχαν φέρει από τα Ιεροσόλυμα. Μόλις τον πήρε στα χέρια του, «γιαγιά», είπε και έδειξε πώς θα τον βάλη στον τάφο της γιαγιάς του! Φοβερό! Τίποτε δεν θέλει για τον εαυτό του· όλα για τους άλλους! Αυτό θα πάη με τα τσαρούχια στον Παράδεισο, αλλά θα βάλη και τους γονείς του στον Παράδεισο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μακάρι να ήμουν και εγώ στην θέση του, και ας μην καταλάβαινα και ας μη μιλούσα. Ενώ ο Θεός μου έδωσε όλα τα αγαθά, εγώ τα αχρήστευσα. Στην άλλη ζωή θα κρύβωνται μπροστά του ακόμη και θεολόγοι. Μου λέει ο λογισμός ότι οι θεολόγοι Άγιοι στον Ουρανό δεν θα είναι σε καλύτερη θέση ως προς την γνώση του Θεού από αυτά τα παιδάκια. Ίσως σ᾿ αυτά να δώση ο δίκαιος Θεός και κάτι παραπάνω, γιατί εδώ έζησαν στερημένα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ψυχικές ασθένειες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν μελαγχολή κανείς, τί πρέπει να κάνη, για να το ξεπεράση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Χρειάζεται θεία παρηγοριά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και πώς θα την πάρη;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να γαντζωθή στον Χριστό και ο Χριστός θα του την δώση. Πολλές φορές μπλέκεται το φιλότιμο με τον εγωισμό. Οι περισσότεροι σχιζοφρενείς είναι ευαίσθητες ψυχές. Τυχαίνει να συμβή ένα τιποτένιο πράγμα ή κάτι που δεν μπορούν να το αντιμετωπίσουν και υποφέρουν πολύ. Άλλος σκοτώνει άνθρωπο και είναι σαν να μη συμβαίνη τίποτε, ενώ ένας ευαίσθητος, ένα γατάκι αν πατήση λίγο στο πόδι κατά λάθος, υποφέρει και δεν κοιμάται από την στενοχώρια του. Και άμα δεν κοιμηθή δυό-τρία βράδια, μετά φυσικά θα τρέξη στον γιατρό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, η ψυχολογία λέει ότι, για να βοηθηθή ένας ψυχοπαθής, πρέπει να λείψη το αίτιο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά αν υπάρχη αίτιο. Γιατί μερικές φορές, ενώ κάποια πράγματα είναι φυσιολογικά, δικαιολογούνται κατά κάποιον τρόπο, οι άνθρωποι μπαίνουν σε λογισμούς, που πάνε να παλαβώσουν. «Μήπως έχω κάτι κληρονομικό; μήπως δεν είμαι καλά;», λένε. Γνώρισα ένα παλληκάρι που σπούδαζε, διάβαζε έντεκα ώρες το εικοσιτετράωρο και έπαιρνε υποτροφία. Βοηθούσε και την οικογένειά του, γιατί ο πατέρας του ήταν άρρωστος. Στο τέλος κουράστηκε, γιατί ήταν ευαίσθητο· είχε συνεχώς πονοκεφάλους και με πολύ κόπο πήρε το πτυχίο. Είχε μετά λογισμούς μήπως ήταν κληρονομικό. Τί κληρονομικό; Μά και μόνον αν διαβάζη κανείς έντεκα ώρες την ημέρα, θα πάθη υπερκόπωση, πόσο μάλλον να βοηθάη και τους γονείς και να είναι και ευαίσθητος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ένα παιδί παρουσίασε κάποια μελαγχολία μετά την αυτοκτονία του πατέρα του. Μήπως είναι κληρονομικό;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί να τραυματίσθηκε ψυχικά το παιδί. Δεν είναι απόλυτο ότι αυτό είναι κληρονομικό. Ύστερα δεν ξέρουμε και ο πατέρας σε τί κατάσταση βρέθηκε και αυτοκτόνησε. Βέβαια, ένα παιδί που ο πατέρας του είναι κλειστός εκ φύσεως χρειάζεται βοήθεια. Γιατί, αν συνεχίση και αυτό να είναι κλειστό – έχει και τον λογισμό μήπως είναι κάτι κληρονομικό –, μπορεί να αρρωστήση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Θεός πάντοτε επιτρέπει να δοκιμασθή ο άνθρωπος όσο αντέχει, αλλά προστίθενται και οι κοροϊδίες των ανθρώπων, οπότε κάμπτεται η ψυχή από το επιπλέον βάρος και γογγύζει. Τους τρελλούς οι άνθρωποι τους αποτρελλαίνουν. Στην αρχή η τρέλλα οικονομιέται. Παλιά δεν υπήρχαν ψυχιατρεία καί, αν ήταν κανείς τρελλός, τον έκλειναν σε κάποιο δωμάτιο με σιδεριές! Ήταν μιά, Περιστέρω την έλεγαν, που την είχαν κλεισμένη στο σπίτι! Τα παιδιά την πετροβολούσαν, την κορόιδευαν. Αγρίευε η φουκαριάρα, έπιανε τις σιδεριές, φώναζε και ό,τι έβρισκε μπροστά της το πετούσε έξω! Στην άλλη ζωή όμως θα δής η Περιστέρω να ξεπερνάη πολλές γνωστικές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Θυμάμαι και μια άλλη περίπτωση. Ήταν μια οικογένεια που η μεγάλη κόρη τους ήταν λίγο λειψή, αλλά είχε πολλή καλωσύνη. Ήταν σαράντα ετών, αλλά ήταν σαν πέντε. Τί σκηνές της έκαναν μικροί-μεγάλοι! Μια φορά την άφησαν οι γονείς της να μαγειρέψη κι εκείνοι πήγαν στο χωράφι. Θα ερχόταν ο αδελφός της από το χωράφι, για να φέρη τα καλαμπόκια, και θα έπαιρνε το φαγητό να το πάη στο χωράφι να φάνε οι γονείς τους και οι εργάτες. Μάζεψε η καημένη από τον κήπο κολοκυθάκια, μελιτζάνες, φασολάκια και τα είχε έτοιμα να τα μαγειρέψη. Πάει η μικρότερη αδελφή της, που ήταν σωστός πειρασμός, τραβάει τον γάιδαρο από το αυτί και τον βάζει και τα τρώει όλα! Άντε μετά η καημένη να πάη να μαζέψη άλλα. Και δεν είπε τίποτε. Μέχρι να τα ετοιμάση ξανά, ήρθε ο αδελφός της, και αυτή μόλις τότε έβαζε το φαγητό στην φωτιά. Ξεφόρτωσε τα ζώα καί, όταν είδε ότι δεν ήταν έτοιμο το φαγητό, της έδωσε ένα ξύλο! Τί ταλαιπωρία περνούσε κάθε μέρα! Η μάνα της η φουκαριάρα παρακαλούσε να πεθάνη πρώτα η κόρη της και μετά αυτή, γιατί σκεφτόταν ποιός θα την φρόντιζε. Και πράγματι, πέθανε πρώτα η κόρη και ύστερα η μάνα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πάντως, αυτοί που δεν είναι καλά στο μυαλό, είναι καλύτερα από πολλούς άλλους. Έχουν το ακαταλόγιστο και χωρίς εξετάσεις περνούν στην άλλη ζωή.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η σωστή τοποθέτηση των γονέων για την αναπηρία των παιδιών τους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Υπάρχουν μητέρες πού, αν διαπιστωθή κατά την εγκυμοσύνη ότι το παιδάκι που θα γεννήσουν θα είναι ανάπηρο ή διανοητικά καθυστερημένο, κάνουν έκτρωση και το σκοτώνουν. Δεν σκέφτονται ότι και αυτό έχει ψυχή. Πόσοι πατέρες έρχονται και μου λένε: «Το δικό μου το παιδί να είναι σπαστικό; Γιατί να το κάνη έτσι ο Θεός; Δεν μπορώ να το αντέξω». Πόση αναίδεια προς τον Θεό έχει αυτή η αντιμετώπιση, πόσο πείσμα, πόσο εγωισμό. Αυτοί, αν τους βοηθήση ο Θεός, θα γίνουν χειρότεροι. Κάποτε ήρθε στο Καλύβι με τον πατέρα του ένας φοιτητής που είχε πάθει το μυαλό του από λογισμούς και του είχαν κάνει ηλεκτροσόκ. Το καημένο είχε στρυμωχθή πολύ από το σπίτι του. Είχε και μια ευλάβεια! Έκανε μετάνοιες και χτυπούσε το κεφάλι του κάτω στο χώμα. «Μήπως λυπηθή το χώμα ο Θεός, έλεγε, και λυπηθή και εμένα που το χτύπησα». Δηλαδή μήπως λυπηθή ο Θεός το χώμα που πόνεσε από το δικό του χτύπημα και λυπηθή κι εκείνον. Μου έκανε εντύπωση! Αισθανόταν τον εαυτό του ανάξιο. Όποτε ζοριζόταν, ερχόταν στο Όρος. Του τακτοποιούσα τους λογισμούς, περνούσε έναν-δυό μήνες καλά και ύστερα πάλι τα ίδια. Ο πατέρας του δεν ήθελε να βλέπουν οι γνωστοί τους το παιδί, γιατί θιγόταν η υπόληψή του. Υπέφερε από τον εγωισμό του. «Εκτίθεμαι στον κόσμο με τον γιό μου», μου είπε. Μόλις το ακούει το παιδί, του λέει: «Βρέ, να ταπεινωθής. Εγώ είμαι τρελλός και κινούμαι άνετα. Θα με βάλης σε καλούπια; Να ξέρης ότι έχεις ένα τρελλό παιδί και να κινήσαι άνετα. Ο μόνος είσαι που έχεις τρελλό παιδί;». Σκέφθηκα: «Ποιός είναι τώρα από τους δυο τρελλός;».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Βλέπετε που οδηγεί πολλές φορές ο εγωισμός; Να θέλη ο πατέρας ακόμη και την καταστροφή του παιδιού του! Και στον κόσμο όταν ήμουν, γνώριζα έναν καθυστερημένο διανοητικά, που οι συγγενείς του, όταν πήγαιναν κάπου με καμμιά συντροφιά, δεν τον έπαιρναν μαζί τους, για να μη ντροπιασθούν! Και εμένα με κορόιδευαν, επειδή καταδεχόμουν να συζητάω μαζί του. Εγώ όμως τον είχα σε καλύτερη θέση στην καρδιά μου από ό,τι εκείνους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφαλαιο 4 – Οι πνευματικοί νόμοι[104]
- type: h2
  initial:
    ru: ''
  text:
    ru: Πώς λειτουργούν οι πνευματικοί νόμοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ποιοί νόμοι λέγονται πνευματικοί;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Θα σού εξηγήσω: Όπως στην φύση υπάρχουν οι φυσικοί νόμοι, έτσι και στην πνευματική ζωή υπάρχουν οι πνευματικοί νόμοι. Ας πούμε, όταν πετάη κανείς ένα βαρύ αντικείμενο ψηλά, με όσο περισσότερη ορμή και όσο πιο ψηλά το πετάξη, με τόσο μεγαλύτερη δύναμη θα πέση κάτω και θα συντριβή. Αυτός είναι φυσικός νόμος. Στην πνευματική ζωή, όσο περισσότερο υψώνεται κανείς με την υπερηφάνειά του, τόσο μεγαλύτερη θα είναι και η πνευματική του πτώση και ανάλογα με το ύψος της υπερηφανείας του θα συντριβή. Γιατί ο υπερήφανος ανεβαίνει, φθάνει σε ένα σημείο και μετά πέφτει και σπάζει τα μούτρα του – «ο υψών εαυτόν ταπεινωθήσεται»[105]. Αυτός είναι πνευματικός νόμος.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Υπάρχει όμως μια σημαντική διαφορά ανάμεσα στους φυσικούς και στους πνευματικούς νόμους: Ενώ οι φυσικοί νόμοι δεν έχουν σπλάχνα και ο άνθρωπος δεν μπορεί να τους αλλάξη, οι πνευματικοί νόμοι έχουν σπλάχνα και ο άνθρωπος μπορεί να τους αλλάξη, γιατί έχει να κάνη με τον Δημιουργό και Πλάστη του, τον Πολυεύσπλαχνο Θεό. Αν δηλαδή καταλάβη αμέσως το ανέβασμα της υπερηφανείας του και πή: «Θεέ μου, εγώ δεν έχω τίποτε δικό μου και υπερηφανεύομαι· συγχώρεσέ με!», αμέσως τα σπλαχνικά χέρια του Θεού τον αρπάζουν και τον κατεβάζουν απαλά κάτω, χωρίς να γίνη αντιληπτή η πτώση του. Έτσι δεν συντρίβεται, αφού προηγήθηκε η καρδιακή συντριβή με την μετάνοια που έδειξε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το ίδιο ισχύει και για το «μάχαιραν έδωκας, μάχαιραν θα λάβης»[106], που λέει το Ευαγγέλιο. Αν δηλαδή «έδωσα μάχαιρα», κανονικά πρέπει να ξοφλήσω με μάχαιρα. Όταν όμως συναισθάνωμαι το σφάλμα μου, με μαχαιρώνη η συνείδησή μου και ζητάω συγχώρηση από τον Θεό, τότε πλέον παύουν να λειτουργούν οι πνευματικοί νόμοι και δέχομαι από τον Θεό την αγάπη Του σαν βάλσαμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μέσα δηλαδή στα κρίματα του Θεού, που είναι άβυσσος, βλέπουμε να αλλάζη ο Θεός, όταν αλλάζουν οι άνθρωποι. Όταν το άτακτο παιδί συνέρχεται, μετανοή και δέρνεται από την συνείδησή του, τότε ο Πατέρας του το χαϊδεύει με αγάπη και το παρηγορεί. Δεν είναι μικρό πράγμα να μπορή ο άνθρωπος να αλλάξη την απόφαση του Θεού! Κάνεις κακό; Ο Θεός σού δίνει σκαμπιλάκι. Λές «ήμαρτον»; Σού δίνει ευλογίες.
- type: h2
  initial:
    ru: ''
  text:
    ru: Τα αρχοντόπουλα του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικοί άνθρωποι, παρόλο που μετάνοιωσαν για κάποιο σφάλμα τους και ο Θεός τους συγχώρεσε, οπότε έπαψαν να λειτουργούν οι πνευματικοί νόμοι, αυτοί δεν ξεχνούν το σφάλμα τους. Ζητούν επίμονα από τον Θεό να τιμωρηθούν σ᾿ αυτήν την ζωή για το σφάλμα τους, για να εξοφλήσουν. Αφού λοιπόν επιμένουν, ο Καλός Θεός εκπληρώνει αυτό το φιλότιμο αίτημά τους, τους κρατάει όμως τοκισμένη την πληρωμή στο Ουράνιο Ταμιευτήριό Του, στον Παράδεισο. Αυτοί είναι τα αρχοντόπουλα του Θεού, είναι τα πιο φιλότιμα παιδιά του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Στο Λειμωνάριο[107]λ.χ. αναφέρεται το εξής για τον αββά Ποιμένα τον βοσκό: Μια φορά τον επισκέφθηκε κάποιος και ζήτησε να τον φιλοξενήση στο κελλί του. Επειδή ο αββάς δεν είχε ιδιαίτερο χώρο για φιλοξενία, τακτοποίησε τον επισκέπτη στο κελλί του και αυτός πήγε να διανυκτερεύση σε μια σπηλιά. Το πρωί που επέστρεψε, τον ρώτησε ο επισκέπτης: «Πώς τα πέρασες, αββά; Μήπως κρύωσες;». «Όχι, πέρασα καλά. Μπήκα σε μια σπηλιά και βρήκα μέσα ένα λιοντάρι να κοιμάται. Ξάπλωσα κι εγώ και ακούμπησα την πλάτη μου στην χαίτη του. Από τα χνώτα του η σπηλιά ήταν σαν φούρνος και δεν κρύωσα». «Καλά, δεν φοβήθηκες μήπως σε φάη το λιοντάρι;», τον ρώτησε ο επισκέπτης. «Όχι, του λέει ο αββάς, αλλά, να ξέρης, εμένα θα με φάνε τα θηρία». «Πώς το ξέρεις αυτό;». «Εγώ στον κόσμο ήμουν βοσκός, του λέει ο αββάς, και κάποτε που βοσκούσα το κοπάδι μου οι σκύλοι μου καταξέσχισαν κάποιον περαστικό καί, ενώ μπορούσα να τον σώσω, αδιαφόρησα. Από τότε ζητάω από τον Θεό συνέχεια να με φάνε τα θηρία. Πιστεύω να μου κάνη ο Θεός αυτό το χατίρι». Και πράγματι αυτόν τον αββά τον έφαγαν τα θηρία. Στην άλλη όμως ζωή αυτοί οι άνθρωποι θα είναι στον πιο εκλεκτό τόπο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, διάβασα σε σχόλια κάποιου πατερικού βιβλίου ότι ο άνθρωπος, όταν κάνη κάποια αμαρτία, πρέπει να τιμωρηθή, για να πληρώση για το κακό που έκανε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν είναι έτσι. Ο άνθρωπος, αν μετανοιώση, δεν τιμωρείται· τον ελεεί ο Χριστός. Χρειάζεται πολλή προσοχή στα σχόλια, γιατί μπορεί ένας σχολιαστής να είναι αρκετά καλός, αλλά καμμιά φορά να κάνη λανθασμένες ερμηνείες. Αν κανείς δεν είναι σίγουρος ότι ο σχολιαστής είναι καλός, καλύτερα ας διαβάση μόνον το κείμενο. Και σ᾿ εμένα είπε κάποιος ότι τον Προφήτη Ησαΐα τον πριόνισαν[108], γιατί έπρεπε να πριονισθή για τις αμαρτίες του κόσμου. Ενώ ο ίδιος παρακάλεσε τον Θεό να πριονισθή για τις αμαρτίες του κόσμου και ο Θεός υπέκυψε στην πολλή αγάπη που είχε για τον λαό. Αλλά για κάθε πριονιά ο Θεός θα του δώση και ένα στεφάνι. Είναι απαραίτητο να ξέρη κανείς μερικά πράγματα, για να καταλάβη κάποια άλλα. Ο αββάς Ποιμήν, για τον οποίο ανέφερα προηγουμένως, μπορούσε να καταλάβη τον Προφήτη Ησαΐα – αν και η περίπτωση του ενός διέφερε από του άλλου, γιατί στην περίπτωση του Προφήτη Ησαΐα υπήρχε η θυσία για τον κόσμο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έχουμε, Γέροντα, και στην εποχή μας τέτοια περιστατικά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, βέβαια. Θυμάμαι κάποιο γεγονός που συνέβη, όταν ήμουν στην Μονή Φιλοθέου. Κάποιος μοναχός, όταν ήταν στον κόσμο, είχε κάψει έναν Τούρκο στον φούρνο, επειδή είχε σφάξει τον πατέρα του. Μετά μετανόησε, ήρθε στο Άγιον Όρος, έγινε μοναχός και είχε βάλει μια καλή σειρά. Μέρα-νύχτα όμως παρακαλούσε τον Θεό να επιτρέψη να καή και ο ίδιος. Μια φορά έπιασε πυρκαγιά στο Μοναστήρι. Εγώ τότε ήμουν δοχειάρης. Ετοίμασα δοχεία με νερό και τρέξαμε όλοι και σβήσαμε την φωτιά. Τελικά αυτόν τον μοναχό τον βρήκαμε καμένο. Θα μου μείνη αλησμόνητη η σκηνή... Τί είχε γίνει; Αυτός τότε ήταν ογδόντα πέντε χρονών και τον διακονούσε ένας μοναχός που ήταν εβδομήντα πέντε. Εκείνη την ημέρα, για να τον ανακουφίση λίγο από τους πόνους των ρευματισμών, του έτριψε τα πόδια του με πετρέλαιο και τον κουκούλωσε κοντά στο τζάκι. Πετάχθηκε όμως μια σκανδαλήθρα από τα ξύλα της καστανιάς, πήρε φωτιά, κάηκε εκείνος και έπιασε φωτιά και όλο το μοναστήρι. Εγώ στενοχωρήθηκα πολύ για το γεγονός· δεν μπορούσα να ησυχάσω! Ύστερα μου είπε ο Πνευματικός: «Μη στενοχωριέσαι· αυτός ζητούσε από τον Θεό να καή, για να εξιλεωθή· αυτό ήταν δώρο Θεού».'
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι πνευματικοί νόμοι και η αγάπη του Θεού
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι πνευματικοί νόμοι λειτουργούν πάντοτε αμέσως;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αναλόγως. Πολλές φορές απορεί κανείς! Ενώ λίγο υπερηφανεύθηκε, αμέσως έσπασε τα μούτρα του· λειτούργησαν οι πνευματικοί νόμοι αστραπιαίως. Π.χ. καθαρίζει μία αδελφή τα τζάμια και της έρχεται ένας υπερήφανος λογισμός ότι τα καθαρίζει καλύτερα από την άλλη, οπότε κάτι συμβαίνει καί, τσάκ, σπάζει το τζάμι. Άλλες φορές λειτουργούν αργότερα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, οι πνευματικοί νόμοι λειτουργούν αμέσως, αυτό τί σημαίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Αυτό είναι καλό. Τότε πρέπει να καταλάβη ο άνθρωπος ότι η αγάπη του Θεού τον προστατεύει, γιατί ξοφλάει και δεν θα τα πληρώση όλα μαζεμένα. Όταν όμως δεν λειτουργούν οι πνευματικοί νόμοι σε έναν άνθρωπο, είναι επικίνδυνο, γιατί δείχνει ότι είναι απομακρυσμένο παιδί του Θεού· δεν είναι στο σπίτι Του. Υπάρχουν μερικοί που ενεργούν συνέχεια με υπερηφάνεια και δεν παθαίνουν τίποτε. Αυτό σημαίνει ότι η υπερηφάνειά τους ξεπέρασε την ανθρώπινη και έφθασε στον ανώτατο βαθμό της, στην δαιμονική υπερηφάνεια, στην έπαρση. Η πτώση τότε γίνεται από την άλλη μεριά της κορυφής, οπότε πέφτει κατ᾿ ευθείαν στην κόλαση. Είναι εωσφορική πτώση και δεν την βλέπουν όσοι βρίσκονται από την άλλη μεριά της κορυφής. Αυτούς δηλαδή δεν τους πιάνει ο πνευματικός νόμος σε τούτη την ζωή, αλλά ισχύει γι᾿ αυτούς το Αποστολικό: «Πονηροί άνθρωποι και γόητες προκόψουσιν επί το χείρον, πλανώντες και πλανώμενοι»[109].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, να θαυμάση κανείς ένα έργο που έκανε και να γίνη κάποια ζημιά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, γιατί λειτουργούν οι πνευματικοί νόμοι. Παίρνει την Χάρη Του ο Θεός από κάποιον και κάνει την ζημιά, για να συνετισθή ο άλλος που υπερηφανεύτηκε για το έργο του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, όταν γίνεται ζημιά, σημαίνει ότι έχουν λειτουργήσει οι πνευματικοί νόμοι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φυσικά.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αποκλείεται να είναι κανείς αδέξιος και να κάνη ζημιές;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σπάνιες είναι αυτές οι περιπτώσεις. Γι᾿ αυτό, όσο μπορείτε, να ζήτε ταπεινά. Να σκέφτεσθε ότι δεν έχουμε τίποτε δικό μας. Όλα ο Θεός μας τα έχει δώσει. Όλα όσα έχουμε είναι του Θεού. Μόνον οι αμαρτίες είναι δικές μας. Αν δεν ταπεινωνώμαστε, θα λειτουργούν σ᾿ εμάς συνεχώς οι πνευματικοί νόμοι, μέχρις ότου καμφθή ο εγωισμός μας. Ο Θεός να δώση να γίνη αυτό, πριν μας βρη ο θάνατος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, ο άνθρωπος να μην καταλάβη ότι έχουν λειτουργήσει οι πνευματικοί νόμοι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν παρακολουθή κανείς τον εαυτό του, τίποτε δεν καταλαβαίνει και από τίποτε δεν βοηθιέται, ούτε ωφελείται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, οι πνευματικοί νόμοι παύουν να λειτουργούν, μόνον όταν ταπεινωθή ο άνθρωπος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ναί, κυρίως με την ταπείνωση ή, όταν έχη κανείς το ακαταλόγιστο. Να σού πω ένα παράδειγμα: Μια γυναίκα έδερνε συνέχεια τον άνδρα της και αυτός δεν μιλούσε, για να μη χάση την αξιοπρέπειά του, γιατί ήταν και δάσκαλος. Λειτουργούσαν όμως σ᾿ αυτόν οι πνευματικοί νόμοι. Είχε ορφανέψει μικρός από πατέρα και η χήρα μάνα του με μια σύνταξη προσπαθούσε να τον σπουδάση, να τον κάνη δάσκαλο, και αυτός την έδερνε! Τί είχε τραβήξει η φουκαριάρα η μάνα του! Οπότε επέτρεψε ο Θεός να τον δέρνη η γυναίκα του, για να εξοφλήση. Ύστερα τί γίνεται; Πεθαίνει αυτός, και ο γιός του έδερνε την μάνα του. Ξόφλησε έτσι και αυτή. Παντρεύεται ο γιός και παίρνει μια ελαφρούτσικη, που τον έδερνε και έψελνε το «Χριστός Ανέστη»! Πώς οικονόμησε ο Θεός, για να εξοφλήση και αυτός! Εδώ όμως σταμάτησαν να λειτουργούν οι πνευματικοί νόμοι, γιατί αυτή είχε το ακαταλόγιστο.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, κάποιος έχη μια πτώση και λυπάται, έτσι ξεπληρώνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αισθάνεται ότι χρωστάει ή λυπάται εγωιστικά; Αν αισθάνεται ότι χρωστάει, δεν θα πληρώση. Όταν όμως δεν αισθάνεται το χρέος του, επιτρέπει ο Θεός να πληρώση. Ο Χριστιανός λ.χ. πρέπει να κάνη ελεημοσύνες. Αν κάποιος είναι σκληρός και δεν δίνη, αλλά μαζεύη τα χρήματα, θα πάνε οι κλέφτες, θα τον δείρουν, θα του πάρουν και τα χρήματα, και έτσι θα ξοφλήση. Όταν έχουμε χρέη και δεν ξοφλούμε σ᾿ αυτήν την ζωή, αυτό είναι πολύ κακό σημάδι, είναι εγκατάλειψη από τον Θεό. Όταν πάλι κάποιος δεν τρώη σκαμπίλια και δέχεται ευλογίες, τότε φαίνεται ότι έκανε κάτι καλό και ανταμείβεται εδώ γι᾿ αυτό από τον Χριστό διπλά και τριπλά. Δεν ξοφλάει όμως για τα σφάλματά του. Και αυτό πάλι είναι κακό. Ας πούμε ότι έκανα δέκα τοις εκατό καλωσύνες και ο Χριστός με ανταμείβει για είκοσι τοις εκατό και δεν έχω ούτε θλίψεις ούτε στενοχώρια· τότε όμως δεν ξοφλώ αμαρτίες.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ταλαιπωρία σ᾿ αυτήν την ζωή τρώει την κόλαση, λέει ο Αββάς Ισαάκ[110]. Δηλαδή, όταν λειτουργούν σε κάποιον οι πνευματικοί νόμοι, αφαιρείται ένα μέρος από τα βάσανα της κολάσεως.
- type: h2
  initial:
    ru: ''
  text:
    ru: Έκτο Μέρος – Ο Θάνατος Και Η Μέλλουσα Ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: «Είναι πολύ βαρύ, μετά από όσα έκανε ο Θεός
- type: paragraph
  initial:
    ru: ''
  text:
    ru: γιά μας τους ανθρώπους, να πάμε στην κόλαση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: καί να Τον λυπήσουμε. Ο Θεός να φυλάξη,
- type: paragraph
  initial:
    ru: ''
  text:
    ru: όχι μόνον άνθρωπος αλλά ούτε πουλί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: νά μην πάη στην κόλαση».
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 1 – Η  αντιμετώπιση του θανάτου
- type: h2
  initial:
    ru: ''
  text:
    ru: Μνήμη θανάτου
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, τί πρέπει να σκέφτεται κανείς την ημέρα που γεννήθηκε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να σκέφτεται την ημέρα που θα πεθάνη και να ετοιμάζεται για το μεγάλο ταξίδι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν κατά την εκταφή βρεθή άλειωτο το σώμα του νεκρού, αυτό οφείλεται σε κάποια αμαρτία για την οποία δεν μετάνοιωσε ο άνθρωπος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όχι, δεν είναι πάντα αιτία κάποια αμαρτία. Μπορεί να οφείλεται και σε φάρμακα που έπαιρνε ή στο χώμα του νεκροταφείου. Όπως και νάναι όμως, όταν κάποιος βγή άλειωτος, εξιλεώνεται κάπως με το ρεζίλεμα που παθαίνει μετά τον θάνατό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί, ενώ ο θάνατος είναι το πιο σίγουρο γεγονός για τον άνθρωπο, εμείς τον ξεχνούμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ξέρεις, παλιά στα Κοινόβια υπήρχε ένας μοναχός που είχε ως διακονία να θυμίζη στους άλλους Πατέρες τον θάνατο. Περνούσε λοιπόν την ώρα της διακονίας από όλους τους αδελφούς και έλεγε στον καθέναν: «Αδελφέ, θα πεθάνουμε». Η ζωή είναι τυλιγμένη με την θνητή σάρκα. Το μεγάλο αυτό μυστικό δεν είναι εύκολο να το καταλάβουν όσοι άνθρωποι είναι μόνο «σάρκες», γι᾿ αυτό δεν θέλουν να πεθάνουν, δεν θέλουν ούτε να ακούσουν για θάνατο. Έτσι ο θάνατος γι᾿ αυτούς είναι διπλός θάνατος και διπλή στενοχώρια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ευτυχώς όμως ο Καλός Θεός οικονόμησε, ώστε να βοηθιούνται από μερικά πράγματα τουλάχιστον οι ηλικιωμένοι, που φυσιολογικά είναι πιο κοντά στον θάνατο. Ασπρίζουν τα μαλλιά, κόβεται το κουράγιο, οι δυνάμεις τους σιγά-σιγά τους εγκαταλείπουν, αρχίζουν να τρέχουν τα σάλια, οπότε ταπεινώνονται και αναγκάζονται να φιλοσοφούν πάνω στην ματαιότητα αυτού του κόσμου. Και να θέλουν να κάνουν καμμιά αταξία, δεν μπορούν, γιατί όλα αυτά τους φρενάρουν. Ή ακούν ότι κάποιος στην ηλικία τους ή και νεώτερος πέθανε, και θυμούνται τον θάνατο. Βλέπουμε στα χωριά, όταν χτυπάη η καμπάνα για κηδεία, οι ηλικιωμένοι που κάθονται στο καφενείο σηκώνονται, κάνουν τον σταυρό τους και ρωτούν να μάθουν ποιός πέθανε και πότε γεννήθηκε. «Ώ, τί γίνεται, λένε, φθάνει και η δική μας σειρά· όλοι θα φύγουμε από αυτόν τον κόσμο!». Καταλαβαίνουν ότι τα χρόνια πέρασαν, ότι το σχοινί της ζωής τους άρχισε να μαζεύεται και ο Πολυχρόνης[111]πλησιάζει. Έτσι διαρκώς σκέφτονται τον θάνατο. Πές σε ένα μικρό παιδί «κάνε μνήμη θανάτου», αυτό θα πη «τραλαλά» και θα συνεχίση να χτυπάη το τόπι του. Γιατί το μικρό παιδί, αν το βοηθούσε ο Θεός να καταλάβη τον θάνατο, θα απογοητευόταν το κακόμοιρο και θα αχρηστευόταν, γιατί δεν θα είχε όρεξη για τίποτε. Γι᾿ αυτό οικονομάει ο Θεός σαν καλός Πατέρας να μην καταλαβαίνη τον θάνατο και να παίζη ξένοιαστο και χαρούμενο το τόπι του. Όσο περνάει όμως η ηλικία, σιγά-σιγά καταλαβαίνει και αυτό τον θάνατο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βλέπεις, και ένας αρχάριος μοναχός, ιδίως όταν είναι νέος, δεν μπορεί να έχη μνήμη θανάτου. Σκέφτεται ότι έχει χρόνια μπροστά του και δεν τον απασχολεί το ζήτημα αυτό. Θυμάστε και ο Απόστολος Πέτρος που είπε: «Φωνάξτε τους νεανίσκους να πάρουν τον νεκρό Ανανία και την Σαπφείρα»[112]; Και στα μοναστήρια συνήθως τα νέα καλογέρια θάβουν τους νεκρούς. Οι μεγάλοι συγκινημένοι ρίχνουν λίγο χώμα επάνω στο σώμα του νεκρού με ευλάβεια και ποτέ στο κεφάλι. Έχω μια δυσάρεστη εικόνα από ένα μοναστήρι όπου είχε πεθάνει ένας αδελφός. Την ώρα του ενταφιασμού, όταν έλεγε ο ιερεύς «γή εί και εις γήν απελεύσει»[113], όλοι οι Πατέρες με πολλή ευλάβεια και συστολή πήραν λίγο χώμα και το έρριξαν επάνω στην σορό του μοναχού, όπως συνηθίζεται να γίνεται. Ένας νεαρός μοναχός μάζεψε το ζωστικό του, πήρε το φτυάρι και απρόσεκτα και με ορμή έρριχνε πάνω στον νεκρό οτιδήποτε εύρισκε μπροστά του, χώμα, πέτρες, ξύλα, πάφ-πάφ..., για να δείξη παλληκαριά! Βρήκε την ώρα να δείξη την δύναμή του, την εργατικότητά του. Δεν είναι ότι φύτευαν δένδρα ή γέμιζαν κάποιον λάκκο, για να μπή η καλωσύνη, η θυσία, και να πή: «Οι άλλοι είναι γεροντάκια. Τί να περιμένω από αυτούς; Ας δουλέψω εγώ». Οπότε θα κουραζόταν λίγο παραπάνω, για να ξεκουράση τους άλλους. Εδώ και ένα ζώο να δη κανείς νεκρό, λυπάται, πόσο μάλλον να βλέπη τον αδελφό του στον τάφο και με το φτυάρι να ρίχνη με μια ορμή και απρόσεκτα πάνω στον νεκρό χώμα, πέτρες... Αυτό δείχνει ότι δεν είχε καμμιά συναίσθηση του θανάτου.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η συμφιλίωση με τον θάνατο
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έγινε η τελική διάγνωση. Ο όγκος που έχετε είναι καρκίνος, και μάλιστα άγριος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Φέρε ένα μαντήλι να χορέψω το «Έχε γειά, καημένε κόσμε»! Εγώ ποτέ δεν χόρεψα στην ζωή μου, αλλά τώρα από την χαρά μου που πλησιάζει ο θάνατος θα χορέψω.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, ο γιατρός είπε ότι πρέπει να γίνουν πρώτα ακτινοβολίες, για να συρρικνωθή ο όγκος, και μετά να γίνη επέμβαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κατάλαβα! Πρώτα θα βομβαρδίση η αεροπορία και μετά θα γίνη η επίθεση! Λοιπόν θα πάω επάνω και θα σάς φέρω νέα!... Μερικοί, ακόμη και γέροι, αν τους πη ο γιατρός «θά πεθάνης» ή «πενήντα τοις εκατό υπάρχει ελπίδα να ζήσης», στενοχωριούνται. Θέλουν να ζήσουν. Τί θα βγάλουν; Απορώ! Αν είναι κανείς νέος, έ, κάπως δικαιολογείται, αλλά ένας γέρος να κάνη προσπάθεια να ζήση, αυτό δεν το καταλαβαίνω. Άλλο είναι να κάνη μια θεραπεία, για να μπορή να αντέξη κάπως τον πόνο. Δεν θέλει δηλαδή να παρατείνη την ζωή του, αλλά θέλει μόνο να είναι λίγο πιο υποφερτοί οι πόνοι και να αυτοεξυπηρετήται, μέχρι να πεθάνη· αυτό έχει νόημα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, παρακαλούμε τον Θεό να σάς δώση παράταση ζωής.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί; Ο Ψαλμός δεν λέει ότι εβδομήκοντα είναι τα χρόνια της ζωής μας[114];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Προσθέτει όμως ο Ψαλμωδός και «εάν εν δυναστείαις, ογδοήκοντα»...
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, αλλά λέει και «τό πλείον αυτών κόπος και πόνος»[115], οπότε καλύτερη η ανάπαυση στην άλλη ζωή!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, κάποιος από ταπείνωση να μην αισθάνεται έτοιμος πνευματικά για την άλλη ζωή και να θέλη ακόμη να ζήση, για να ετοιμασθή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτό είναι καλό, αλλά που ξέρει ότι, αν ζήση κι άλλο, δεν θα γίνη χειρότερος;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πότε συμφιλιώνεται κανείς με τον θάνατο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πότε; Άμα ζη μέσα του ο Χριστός, τότε είναι χαρά ο θάνατος. Όχι όμως να χαίρεται που θα πεθάνη, γιατί βαρέθηκε την ζωή του. Όταν χαίρεσαι τον θάνατο, με την καλή έννοια, φεύγει ο θάνατος και πάει να βρη κανέναν φοβητσιάρη! Όταν θέλης να πεθάνης, δεν πεθαίνεις. Όποιος καλοπερνάει, φοβάται τον θάνατο, γιατί ευχαριστιέται με την κοσμική ζωή και δεν θέλει να πεθάνη. Αν του πούν για θάνατο, λέει: «Κουνήσου από την θέση σου»! Ενώ, όποιος ταλαιπωρείται, πονάει κ.λπ., θεωρεί τον θάνατο λύτρωση και λέει: «Κρίμα, δεν ήρθε ακόμη ο Χάρος να με πάρη... Κάποιο εμπόδιο θα τον βρήκε»!'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Λίγοι άνθρωποι θέλουν τον θάνατο. Οι πιο πολλοί κάτι θέλουν να τελειώσουν και δεν θέλουν να πεθάνουν. Ο καλός Θεός όμως οικονομάει να πεθάνη ο καθένας, όταν ωριμάση. Πάντως ένας πνευματικός άνθρωπος, είτε νέος είναι είτε γέρος, πρέπει να χαίρεται που ζή, να χαίρεται που θα πεθάνη, αλλά να μην επιδιώκη να πεθάνη, γιατί αυτό είναι αυτοκτονία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Για έναν πεθαμένο κοσμικά και αναστημένο πνευματικά δεν υπάρχει ποτέ καθόλου αγωνία, φόβος και άγχος, γιατί περιμένει τον θάνατο με χαρά, επειδή θα πάη κοντά στον Χριστό και θα αγάλλεται. Αλλά χαίρεται και γιατί ζή, επειδή ζη πάλι κοντά στον Χριστό και νιώθει ένα μέρος της χαράς του Παραδείσου επί της γης και διερωτάται αν υπάρχη ανώτερη χαρά στον Παράδεισο από αυτήν που νιώθει στην γή. Τέτοιοι άνθρωποι αγωνίζονται με φιλότιμο και αυταπάρνηση καί, επειδή βάζουν μπροστά τους τον θάνατο και τον σκέφτονται καθημερινά, ετοιμάζονται πιο πνευματικά, αγωνίζονται τολμηρότερα και νικούν την ματαιότητα.
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι ετοιμοθάνατοι
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μας ζήτησαν να ευχηθούμε για κάποιον που μέρες ψυχορραγούσε και δεν έβγαινε η ψυχή του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί δεν έβγαινε η ψυχή του; Εξομολογήθηκε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: -Όχι, δεν θέλησε να εξομολογηθή. Δηλαδή, Γέροντα, η ταλαιπωρία του ανθρώπου, όταν βγαίνη η ψυχή του, οφείλεται στην αμαρτωλότητά του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν είναι απόλυτο αυτό. Ούτε όταν βγαίνη η ψυχή του ανθρώπου ήρεμα, σημαίνει πώς είναι σε καλή κατάσταση, αλλά ούτε και όσοι ταλαιπωρούνται στα τελευταία τους σημαίνει πώς έχουν πολλές αμαρτίες. Είναι μερικοί που από μεγάλη ταπείνωση ζητούν επίμονα από τον Θεό να έχουν άσχημο τέλος, για να μείνουν μετά τον θάνατό τους στην αφάνεια. Ή μπορεί κάποιος να έχη άσχημο τέλος, για να ξεχρεώση λίγο χρέος. Επειδή λ.χ. τον εγκωμίαζαν οι άνθρωποι περισσότερο από όσο άξιζε, επιτρέπει ο Θεός να παρουσιάση παραξενιές την ώρα του θανάτου του, για να ξεπέση στα μάτια των ανθρώπων. Άλλες φορές πάλι οικονομάει ο Θεός να έχουν μερικοί δυσκολία, όταν ψυχορραγούν, για να καταλάβουν όσοι είναι κοντά του πόσο δύσκολα είναι εκεί στην κόλαση, όταν δεν τακτοποιηθής εδώ. Ενώ, εάν είναι τα χαρτιά καλά, είσαι δηλαδή τακτοποιημένος, περνάς από την μια ζωή στην άλλη, χωρίς να σε πλησιάζουν καθόλου τα ταγκαλάκια.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, σε έναν ετοιμοθάνατο ή σε κάποιον που έχει μια σοβαρή αρρώστια είναι σωστό να μην πούμε την αλήθεια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Ανάλογα και με το τί άνθρωπος είναι. Καμμιά φορά με ρωτάει κανένας καρκινοπαθής: «Τί λές, Γέροντα, θα ζήσω ή θα πεθάνω;». Αν του πω «θά πεθάνης», θα πεθάνη εκείνη την ώρα από την στενοχώρια του. Ενώ, αν δεν του το πώ, παίρνει κουράγιο και αντιμετωπίζει με θάρρος την αρρώστια του. Όταν ωριμάση, σηκώνει μόνος του τον σταυρό του και προχωράει. Έτσι μπορεί να ζήση μερικά χρόνια, να συμπαρασταθή στην οικογένειά του και να ετοιμασθή και αυτός και οι δικοί του. Δεν του λέω φυσικά ότι θα ζήση χίλια χρόνια ή ότι αυτό που έχει δεν είναι τίποτε, αλλά του λέω: «Ανθρωπίνως είναι δύσκολο να βοηθηθής. Φυσικά για τον Θεό δεν είναι τίποτε δύσκολο, αλλά εσύ κοίταξε να τακτοποιηθής».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μερικές φορές, Γέροντα, οι δικοί του διστάζουν να τον κοινωνήσουν, για να μην τον βάλουν σε λογισμούς.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δηλαδή να πάη ακοινώνητος, για να μην καταλάβη ότι θα πεθάνη και στενοχωρεθή; Ας του πούν οι δικοί του: «Η Θεία Κοινωνία είναι φάρμακο. Θα σε βοηθήση. Καλά είναι να κοινωνήσης». Οπότε κοινωνάει, βοηθιέται και συγχρόνως ετοιμάζεται για την άλλη ζωή.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στους ψυχορραγούντας πρέπει να κάνουν Ευχέλαιο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Σε όσους δυσκολεύονται να ξεψυχήσουν, διαβάζουν την «Ακολουθία εις ψυχορραγούντα»[116]. Το Ευχέλαιο γίνεται για όλους τους αρρώστους, δεν γίνεται μόνο για όσους βρίσκονται στα τελευταία τους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αυτά που λέει, Γέροντα, κανείς, όταν ψυχορραγή, έχουν κάποια σχέση με την κατάστασή του;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Να μη βγάζουμε εύκολα συμπεράσματα. Μπορεί κάποιος την ώρα που ξεψυχάει να πονάη, να ζορίζεται και το πρόσωπό του να έχη την έκφραση του πόνου, οπότε οι άλλοι νομίζουν ότι δεν είναι καλά ψυχικά. Διαφέρει όμως η πονεμένη έκφραση από την άλλη που είναι άγρια και τρομαγμένη. Εκείνος υποφέρει, έχει τον πόνο του ο καημένος, και οι άλλοι μπορεί να λένε ότι παλεύει με τα δαιμόνια που ήρθαν να του πάρουν την ψυχή!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια ψυχή που φεύγει από αυτήν την ζωή  τακτοποιημένη θα περάση από τα τελώνια;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν μια ψυχή είναι τακτοποιημένη και ανεβαίνη στον Ουρανό, δεν μπορούν τα ταγκαλάκια να την πειράξουν. Ενώ, αν δεν είναι τακτοποιημένη, βασανίζεται από τα ταγκαλάκια. Μερικές φορές μάλιστα ο Θεός επιτρέπει να βλέπη τα τελώνια η ψυχή του ανθρώπου που έχει χρέη, την ώρα που ψυχορραγεί, για να βοηθήση εμάς που θα ζήσουμε ακόμη, ώστε να αγωνισθούμε να εξοφλήσουμε εδώ τα χρέη μας. Θυμάστε το γεγονός με την Θεοδώρα[117]; Οικονομάει δηλαδή να βλέπουν μερικοί ορισμένα πράγματα, για να βοηθηθούν οι άλλοι και να μετανοήσουν. Στον βίο του Οσίου Ευφροσύνου[118]λ.χ. διαβάζουμε ότι ο Ηγούμενος, μετά από το όραμα που είδε, βρέθηκε με τα μήλα στο χέρι, για να τα δούν οι άλλοι και να βοηθηθούν .
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Καμμιά φορά πάλι οικονομάει ο Θεός να έχη η ψυχή έναν διάλογο την ώρα που ξεψυχάει, για να μετανοήση ο ίδιος ο άνθρωπος που βρίσκεται στα τελευταία του ή αυτοί που τον ακούν. Βλέπεις, ο Θεός έχει πολλούς τρόπους που σώζει τον άνθρωπο. Πότε βοηθάει με Αγγέλους, πότε με δοκιμασίες ή με διάφορα σημεία. Είχα γνωρίσει μια γυναίκα που φερόταν βάρβαρα στον άνδρα της και στην πεθερά της· τους έδερνε και τους δύο. Εκείνη γύριζε στις γειτονιές και κουβέντιαζε και την πεθερά της, που ήταν γριούλα, την έστελνε κάθε μέρα στο χωράφι. Πήγαινε η φουκαριάρα η γριά κάθε μέρα στο χωράφι, δυο ώρες δρόμο, σβαρνίζοντας τα πόδια της και δούλευε από το πρωί ώς το βράδυ, χωρίς να παραπονιέται. Ώσπου μια μέρα, μόλις γύρισε στο σπίτι, πτώμα από την κούραση, έπεσε κάτω και έλεγε στην νύφη της: «Ο Αρχάγγελος Μιχαήλ μου παίρνει την ψυχή. Σκούπισε, παιδάκι μου, τα αίματα». «Ποιά αίματα, γιαγιά;», την ρωτούσε με αγωνία η νύφη, γιατί δεν έβλεπε να έχη αίματα επάνω της. «Νά, παιδάκι μου, τα αίματα που τρέχουν! Σκούπισέ τα, σκούπισέ τα!». Γυρίζει η νύφη να κοιτάξη, και η γιαγιά είχε ξεψυχήσει. Μετά από αυτό το περιστατικό συνετίσθηκε και άλλαξε ζωή· από θηρίο έγινε αρνί. Ήταν οικονομία Θεού να δη την πεθερά της να ξεψυχάη με αυτά τα λόγια, να πιστέψη ότι ο Αρχάγγελος Μιχαήλ παίρνει τις ψυχές δήθεν με το σπαθί, για να φοβηθή και να μετανοήση. Της μίλησε δηλαδή ο Θεός με την γλώσσα που καταλάβαινε, για να συνέλθη, γιατί, φαίνεται, θα είχε καλή διάθεση.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και όταν, Γέροντα, ο ετοιμοθάνατος φωνάζη κεκοιμημένους συγγενείς του, τί σημαίνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πολλές φορές και αυτό γίνεται, για να παραδειγματίζωνται οι άλλοι που είναι κοντά στον ετοιμοθάνατο. Γνώρισα μια πλούσια κυρία, που ήταν αγία γυναίκα. Δεν είχε παντρευτή και έμενε με την αδελφή της, στην οποία είχε δώσει όλη την περιουσία της. Ο γαμπρός της, που πέθανε μετά από αυτήν, όταν ξεψυχούσε, την φώναζε: «Έλα, Δέσποινα, να συγχωρεθούμε. Να με συγχωρέσης..., πολύ σε ταλαιπώρησα, να με συγχωρέσης!». «Που είναι η Δέσποινα;», τον ρώτησαν. «Νά, δεν την βλέπετε; νά, εκεί είναι!» τους είπε και μετά ξεψύχησε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Συγχωρούνται, Γέροντα, έτσι οι άνθρωποι, ακόμη και την τελευταία στιγμή της ζωής τους με κάποιον που έχει ήδη πεθάνει;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Επιτρέπει ο Θεός, έστω και έτσι να συγχωρεθούν, επειδή ο άνθρωπος, την ώρα που πεθαίνει, μετανοιώνει και αισθάνεται την ανάγκη να ζητήση συγγνώμη.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η αυτοκτονία
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί άνθρωποι, αν συναντήσουν κάποια μεγάλη δυσκολία στην ζωή τους, αμέσως σκέφτονται να αυτοκτονήσουν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπαίνει ο εγωισμός στην μέση. Οι περισσότεροι που αυτοκτονούν, ακούν τον διάβολο που τους λέει πώς, αν τερματίσουν την ζωή τους, θα γλιτώσουν από το εσωτερικό βάσανο που περνούν, και από εγωισμό αυτοκτονούν. Αν λ.χ. κάνη κάποιος μια κλεψιά και αποδειχθή ότι έκλεψε, «πάει, λέει, τώρα έγινα ρεζίλι» καί, αντί να μετανοήση, να ταπεινωθή και να εξομολογηθή, για να λυτρωθή, αυτοκτονεί. Άλλος αυτοκτονεί, γιατί το παιδί του είναι παράλυτο. «Πώς να έχω παράλυτο παιδί εγώ;», λέει και απελπίζεται. Αν είναι υπεύθυνος γι᾿ αυτό και το αναγνωρίζη, ας μετανοήση. Πώς βάζει τέρμα στην ζωή του και αφήνει το παιδί του στον δρόμο; Δεν είναι πιο υπεύθυνος μετά;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, συχνά ακούμε για κάποιον που αυτοκτόνησε ότι είχε ψυχολογικά προβλήματα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι ψυχοπαθείς, όταν αυτοκτονούν, έχουν ελαφρυντικά, γιατί είναι σαλεμένο το μυαλό τους. Και συννεφιά να δούν, νιώθουν ένα πλάκωμα. Αν έχουν και μια στενοχώρια, έχουν διπλή συννεφιά. Γι᾿ αυτούς όμως που αυτοκτονούν χωρίς να είναι ψυχοπαθείς – καθώς και για τους αιρετικούς –, δεν εύχεται η Εκκλησία, αλλά τους αφήνει στην κρίση και στο έλεος του Θεού. Ο ιερέας δεν μνημονεύει τα ονόματά τους στην Προσκομιδή ούτε τους βγάζει μερίδα, γιατί με την αυτοκτονία αρνούνται, περιφρονούν την ζωή που είναι δώρο του Θεού. Είναι  σαν να τα πετούν όλα στο πρόσωπο του Θεού.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Αλλά εμείς πρέπει να κάνουμε πολλή προσευχή για όσους αυτοκτονούν, για να κάνη κάτι ο Καλός Θεός και γι᾿ αυτούς, γιατί δεν ξέρουμε πώς έγινε και αυτοκτόνησαν, ούτε σε τί κατάσταση βρέθηκαν την τελευταία στιγμή. Μπορεί, την ώρα που ξεψυχούσαν, να μετάνοιωσαν, να ζήτησαν συγχώρηση από τον Θεό και να έγινε δεκτή η μετάνοιά τους, οπότε την ψυχή τους να την παρέλαβε Άγγελος Κυρίου.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Είχα ακούσει ότι ένα κοριτσάκι σε ένα χωριό πήγε να βοσκήση την κατσίκα τους. Την έδεσε στο λιβάδι και πήγε πιο πέρα να παίξη. Ξεχάστηκε όμως στο παιχνίδι και η κατσίκα λύθηκε και έφυγε. Έψαξε, αλλά δεν την βρήκε και γύρισε στο σπίτι χωρίς την κατσίκα. Ο πατέρας του θύμωσε πολύ, το έδειρε και το έδιωξε από το σπίτι. «Να πάς να βρής την κατσίκα, του είπε. Αν δεν την βρής, να πάς να κρεμασθής». Ξεκίνησε το ταλαίπωρο να πάη να ψάξη. Βράδιασε και αυτό ακόμη δεν είχε γυρίσει στο σπίτι. Οι γονείς, βλέποντας ότι νύχτωσε, βγήκαν ανήσυχοι να βρουν το παιδί. Έψαξαν και το βρήκαν κρεμασμένο σε ένα δένδρο. Είχε δέσει στον λαιμό του το σχοινί της κατσίκας και κρεμάστηκε στο δένδρο. Το κακόμοιρο είχε φιλότιμο και πήρε κατά γράμμα αυτό που του είπε ό πατέρας του. Το έθαψαν μετά έξω από το κοιμητήρι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η Εκκλησία φυσικά καλά έκανε και το έθαψε απ᾿ έξω, για να φρενάρη όσους αυτοκτονούν για το παραμικρό, αλλά και ο Χριστός καλά θα κάνη, αν το βάλη μέσα στον Παράδεισο.
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 2 – «Ίνα μη λυπήσθε καθώς και οι λοιποί οι μη έχοντες ελπίδα»[119]
- type: h2
  initial:
    ru: ''
  text:
    ru: Θάνατος παιδιών
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μια μάνα, Γέροντα, που το παιδί της πέθανε πριν από εννέα χρόνια, σάς παρακαλεί να κάνετε προσευχή να το δη έστω στον ύπνο της, για να παρηγορηθή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πόσων χρονών ήταν το παιδί; ήταν μικρό; Είναι σημαντικό αυτό. Άμα το παιδί ήταν μικρό και η μητέρα είναι σε κατάσταση πού, αν της παρουσιασθή, δεν θα αναστατωθή, θα παρουσιασθή. Αιτία είναι η μητέρα που δεν παρουσιάζεται το παιδί.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Μπορεί, Γέροντα, αντί να παρουσιασθή το παιδί στην μητέρα που το ζητάει, να παρουσιασθή σε κάποιον άλλον;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς δεν μπορεί! Κανονίζει ανάλογα ο Θεός. Όταν ακούω για τον θάνατο κάποιου νέου, λυπάμαι, αλλά λυπάμαι ανθρωπίνως. Γιατί, αν εξετάσουμε τα πράγματα πιο βαθιά, θα δούμε ότι, όσο μεγαλώνει κανείς, και περισσότερο αγώνα πρέπει να κάνη, αλλά και περισσότερες αμαρτίες προσθέτει. Ιδίως όταν είναι κοσμικός, όσο περνούν τα χρόνια, αντί να βελτιώση την πνευματική του κατάσταση, την χειροτερεύει με τις μέριμνες, με τις αδικίες κ.λπ. Γι᾿ αυτό είναι πιο κερδισμένος, όταν τον παίρνη ο Θεός νέο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί ο Θεός επιτρέπει να πεθαίνουν τόσοι νέοι άνθρωποι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Κανείς δεν έχει κάνει συμφωνία με τον Θεό πότε θα πεθάνη. Ο Θεός τον κάθε άνθρωπο τον παίρνει στην καλύτερη στιγμή της ζωής του, με έναν ειδικό τρόπο, για να σώση την ψυχή του. Εάν δη ότι κάποιος θα γίνη καλύτερος, τον αφήνει να ζήση. Εάν δη όμως ότι θα γίνη χειρότερος, τον παίρνει, για να τον σώση. Μερικούς πάλι που έχουν αμαρτωλή ζωή, αλλά έχουν την διάθεση να κάνουν το καλό, τους παίρνει κοντά Του, πριν προλάβουν να το κάνουν, επειδή ξέρει ότι θα έκαναν το καλό, μόλις τους δινόταν η ευκαιρία. Είναι δηλαδή σαν να τους λέη: «Μήν κουράζεσθε· αρκεί η καλή διάθεση που έχετε». Άλλον, επειδή είναι πολύ καλός, τον διαλέγει και τον παίρνει κοντά Του, γιατί ο Παράδεισος χρειάζεται μπουμπούκια.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Φυσικά οι γονείς και οι συγγενείς είναι λίγο δύσκολο να το καταλάβουν αυτό. Βλέπεις, πεθαίνει ένα παιδάκι, το παίρνει αγγελούδι ο Χριστός, και κλαίνε και οδύρονται οι γονείς, ενώ έπρεπε να χαίρωνται, γιατί που ξέρουν τί θα γινόταν, αν μεγάλωνε; Θα μπορούσε άραγε να σωθή; Όταν το 1924 φεύγαμε από την Μικρά Ασία με το καράβι, για να έρθουμε στην Ελλάδα, εγώ ήμουν βρέφος. Το καράβι ήταν γεμάτο πρόσφυγες καί, όπως με είχε η μητέρα μου μέσα στις φασκιές, ένας ναύτης πάτησε επάνω μου. Η μάνα μου νόμισε ότι πέθανα και άρχισε να κλαίη. Μια συγχωριανή μας άνοιξε τις φασκιές και διαπίστωσε ότι δεν είχα πάθει τίποτε. Αν πέθαινα τότε, σίγουρα θα πήγαινα στον Παράδεισο. Τώρα που είμαι τόσων χρονών και έχω κάνει τόση άσκηση, δεν είμαι σίγουρος αν πάω στον Παράδεισο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Αλλά και τους γονείς βοηθάει ο θάνατος των παιδιών. Πρέπει να ξέρουν ότι από εκείνη την στιγμή έχουν έναν πρεσβευτή στον Παράδεισο. Όταν πεθάνουν, θα ᾿ρθούν τα παιδιά τους με εξαπτέρυγα στην πόρτα του Παραδείσου να υποδεχθούν την ψυχή τους. Δεν είναι μικρό πράγμα αυτό! Στα παιδάκια πάλι που ταλαιπωρήθηκαν εδώ από αρρώστιες ή από κάποια αναπηρία ο Χριστός θα πή: «Ελάτε στον Παράδεισο και διαλέξτε το καλύτερο μέρος». Και τότε εκείνα θα Του πούν: «Ωραία είναι εδώ, Χριστέ μας, αλλά θέλουμε και την μανούλα μας κοντά μας». Και ο Χριστός θα τα ακούση και θα σώση με κάποιον τρόπο και την μητέρα.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Βέβαια δεν πρέπει να φθάνουν οι μητέρες και στο άλλο άκρο. Μερικές μανάδες πιστεύουν ότι το παιδί τους που πέθανε αγίασε και πέφτουν σε πλάνη. Μια μητέρα ήθελε να μου δώση κάτι από τον γιό της που είχε πεθάνει, για ευλογία, γιατί πίστευε ότι αγίασε. «Έχει ευλογία, με ρώτησε, να δίνω από τα πράγματά του;». «Όχι, της είπα, καλύτερα να μη δίνης». Μια άλλη είχε κολλήσει την Μεγάλη Πέμπτη το βράδυ στον Εσταυρωμένο την φωτογραφία του παιδιού της που το είχαν σκοτώσει οι Γερμανοί και έλεγε: «Και το παιδί μου σαν τον Χριστό έπαθε». Οι γυναίκες που κάθονταν και ξενυχτούσαν στον Εσταυρωμένο την άφησαν, για να μην την πληγώσουν. Τί να έλεγαν; Πληγωμένη ήταν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Παρηγοριά στους πενθούντες
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πόση δύναμη χρειάζονται, Γέροντα, οι άνθρωποι, για να αντιμετωπίσουν τον αιφνίδιο θάνατο!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άμα έχουν συλλάβει το βαθύτερο νόημα της ζωής, βρίσκουν την δύναμη να αντιμετωπίσουν τον θάνατο, γιατί τον αντιμετωπίζουν πνευματικά. Με τα μηχανάκια πόσα παιδιά καταστρέφονται! Πόσα παλληκάρια σκοτώνονται με τις μοτοσυκλέτες! Σηκώνουν την μοτοσυκλέτα πίσω στην μία ρόδα, οπότε εύκολα τουμπάρουν και σπάζουν το κεφάλι τους. Το θεωρούν κατόρθωμα ποιός θα σηκώση την μοτοσυκλέτα περισσότερο! «Κρατούσα, λέει, σούζα την μοτοσυκλέτα στην πίσω ρόδα και τουμπάρισα». Ο διάβολος, βλέπεις, τί τους βάζει να κάνουν, για να χτυπήσουν στο κεφάλι; Γιατί αλλιώς, ακόμη κι αν είχαν κάποιο ατύχημα, μπορεί να χτυπούσαν αλλού και να μη σακατεύονταν. Για να επιτρέψη όμως ο Θεός την κακία του διαβόλου ή την απροσεξία του άλλου, σημαίνει ότι θα βγή κάτι καλό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τότε, Γέροντα, γιατί η Εκκλησία μας εύχεται «υπέρ του διαφυλαχθήναι» από αιφνίδιο θάνατο[120];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εκείνο είναι άλλο. Ζητά από τον Θεό να μη μας βρη ο θάνατος ανέτοιμους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μια μητέρα είναι απαρηγόρητη, γιατί το παιδί της πηγαίνοντας στην δουλειά σκοτώθηκε σε τροχαίο.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Πές της: «Από κακότητα χτύπησε ο οδηγός το παιδί σου; Όχι. Εσύ, για να σκοτωθή το έστειλες στην δουλειά; Όχι. Να πής λοιπόν «δόξα Σοι ο Θεός», γιατί μπορεί να γινόταν ένα αλητάκι και ο Θεός το πήρε στην κατάλληλη ώρα. Τώρα είναι ασφαλισμένο στον Ουρανό. Τί κλαίς; Ξέρεις ότι βασανίζεις το παιδί με το κλάμα; Θέλεις να βασανίζεται το παιδί σου ή να χαίρεται; Φρόντισε να βοηθήσης τα άλλα παιδιά που έχεις και είναι μακριά από τον Θεό. Γι᾿ αυτά να κλαίς». Νά, και χθές ήρθε μια μητέρα με κλάματα και μου είπε: «Μου πήρε ο Θεός το μονάκριβο παιδί μου», και τα έβαζε με τον Θεό. «Αν το καλοσκεφθής, της είπα, σε τίμησε ο Θεός. Το πήρε κοντά Του αγγελούδι, βαπτισμένο όπως ήταν. Αυτό είναι αγγελούδι και εσύ τα βάζεις με τον Θεό; Αυτό θα βρής μεθαύριο να πρεσβεύη στον Θεό». Μετά που μου μίλησε για την ζωή της, είπε πώς μπορούσε να έχη πολλά παιδιά, αλλά, όταν ήταν νέα, δεν ήθελε να έχη παιδιά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Πόσες μητέρες προσεύχονται και ζητούν να είναι τα παιδιά τους κοντά στον Θεό! «Δεν ξέρω, λένε, τί θα κάνης, Θεέ μου, θέλω να σωθή το παιδί μου· να είναι κοντά Σου». Αν τυχόν όμως ο Θεός δη ότι το παιδί θα παραστρατήση, ότι πηγαίνει στην καταστροφή και δεν υπάρχει άλλος τρόπος να σωθή, το παίρνει με αυτόν τον τρόπο. Επιτρέπει λ.χ. έναν μεθυσμένο να το χτυπήση με το αυτοκίνητο και να το σκοτώση, και έτσι το παίρνει κοντά Του. Αν υπήρχε περίπτωση να γίνη καλύτερο, θα έφερνε ένα εμπόδιο να αποφύγη το ατύχημα. Μετά ξεμεθάει και αυτός που χτύπησε το παιδί, έρχεται σε συναίσθηση και σε όλη του την ζωή τον πειράζει η συνείδησή του. «Εγκλημάτησα», λέει, και παρακαλεί συνέχεια τον Θεό να τον συγχωρήση. Σώζεται και αυτός. Η μάνα πάλι με τον πόνο της συμμαζεύεται, σκέφτεται τον θάνατο και ετοιμάζεται για την άλλη ζωή, οπότε σώζεται και αυτή. Βλέπετε πώς οικονομάει ο Θεός από την προσευχή της μάνας να σώζωνται ψυχές; Αν όμως οι μητέρες δεν το καταλαβαίνουν αυτό, τα βάζουν με τον Θεό! Τί τραβάει και ο Θεός με εμάς!
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Όταν κανείς παύη να αντιμετωπίζη τα πράγματα κοσμικά, βρίσκει ανάπαυση. Γιατί, πώς είναι δυνατόν ο άνθρωπος να παρηγορηθή αληθινά, αν δεν πιστέψη στον Θεό και στην αληθινή ζωή, την μετά θάνατον, την αιώνια; Τον καιρό που ήμουν στο Μοναστήρι του Στομίου, ζούσε στην Κόνιτσα μια χήρα γυναίκα, που πήγαινε συνέχεια στο Κοιμητήρι και έσκουζε ώρες ολόκληρες. Τους αναστάτωνε όλους με τις φωνές της. Χτυπιόταν, χτυπούσε το κεφάλι της στην πλάκα του τάφου! Όλο τον πόνο της τον έβγαζε εκεί. Πήγαιναν, την έπαιρναν από εκεί και αυτή ξαναγύριζε. Αυτό γινόταν για χρόνια. Ο άνδρας της είχε σκοτωθή από τους Γερμανούς και η κόρη της, λίγα χρόνια μετά τον θάνατο του πατέρα, μόλις έγινε δεκαεννιά χρονών, πέθανε από καρδιά και είχε μείνει μόνη της η φουκαριάρα. Αν το δη κανείς αυτό εξωτερικά, θα πή: «Γιατί να το επιτρέψη ο Θεός;». Και αυτή έτσι εξωτερικά το αντιμετώπιζε και δεν μπορούσε να παρηγορηθή. Μια φορά που πήγα να δώ τί συμβαίνει, μου έλεγε: «Γιατί ο Θεός το έκανε αυτό; Ο άνδρας μου σκοτώθηκε στον πόλεμο. Είχα μια κόρη, μου την πήρε και αυτή...». Έλεγε-έλεγε, τα έβαζε με τον Θεό. Αφού την άφησα να ξεσπάση λίγο, της είπα: «Να σού πω κι εγώ κάτι. Τον άνδρα σου τον ήξερα· ήταν πολύ καλός. Σκοτώθηκε στον πόλεμο για την Πατρίδα, πάνω στο ιερό καθήκον. Ο Θεός δεν θα τον αφήση. Μετά σού άφησε την κόρη σου για λίγα χρόνια κοντά σου, οπότε είχες μια παρηγοριά. Έπειτα όμως, επειδή ίσως θα ξέφευγε η κοπέλα, την πήρε ο Θεός σ᾿ αυτήν την καλή κατάσταση που βρισκόταν, για να την σώση». Αυτή, ενώ ο άνδρας της ήταν πολύ ήσυχος, ήταν λίγο κοσμική. Δεν της είπα φυσικά ότι «εσύ ήσουν κοσμική», αλλά την ρώτησα: «Τώρα, εσύ, τί σκέφτεσαι; Αγαπάς τον κόσμο;». «Δεν θέλω να δώ τίποτε και κανέναν», μου λέει. «Βλέπεις, της λέω, τώρα και για σένα ο κόσμος πέθανε. Ο πόνος σε βοηθάει και δεν σε ενδιαφέρει τίποτε το κοσμικό. Έτσι μεθαύριο θα είστε όλοι μαζί στον Παράδεισο. Τέτοια τιμή ο Θεός σε ποιόν την έχει κάνει; Το καταλαβαίνεις;». Μετά από αυτήν την συζήτηση σταμάτησε να πηγαίνη στο Κοιμητήρι. Μόλις βοηθήθηκε να συλλάβη το βαθύτερο νόημα της ζωής, ησύχασε.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, άκουσα ότι, όταν κάποιος δολοφονήται, εξιλεώνεται, γιατί παίρνει τις αμαρτίες του ο δολοφόνος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έχει ελαφρυντικά κατά κάποιον τρόπο. Μπορεί να πη στον Θεό: «Εγώ θα μετανοούσα, αλλά αυτός με σκότωσε». Έτσι θα πέση το βάρος στον δολοφόνο. Μερικοί που δεν τους κόβει λένε: «Αν υπήρχε Θεός, δεν θα άφηνε να γίνωνται συνέχεια εγκλήματα· θα τιμωρούσε τους εγκληματίες». Δεν καταλαβαίνουν ότι ο Θεός αφήνει τους εγκληματίες να ζήσουν, για να είναι αναπολόγητοι την ημέρα της Κρίσεως, που δεν μετανόησαν, παρόλο που τους έδωσε χρόνια, για να μετανοήσουν, ενώ εκείνους που σκοτώνονται θα τους τακτοποιήση.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Ο θάνατος είναι αποχωρισμός για λίγα χρόνια
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Πρέπει να καταλάβουμε ότι ο άνθρωπος στην πραγματικότητα δεν πεθαίνει. Ο θάνατος είναι απλώς μετάβαση από την μια ζωή στην άλλη. Είναι ένας αποχωρισμός για ένα μικρό διάστημα. Όπως, όταν πάη κάποιος, ας υποθέσουμε, στο εξωτερικό για έναν χρόνο, οι δικοί του στενοχωριούνται, γιατί θα τον αποχωρισθούν για έναν χρόνο, ή αν λείψη δέκα χρόνια, έχουν στενοχώρια για τον αποχωρισμό των δέκα χρόνων, έτσι πρέπει να βλέπουν και τον αποχωρισμό από τα αγαπημένα τους πρόσωπα με τον θάνατο. Αν πεθάνη, ας υποθέσουμε, κάποιος και οι δικοί του είναι ηλικιωμένοι, να πούν: «Μετά από καμμιά δεκαπενταριά χρόνια θα ανταμώσουμε». Αν είναι νεώτεροι, να πούν: «Μετά από πενήντα χρόνια θα ανταμώσουμε». Πονάει φυσικά κανείς για τον θάνατο κάποιου συγγενικού του προσώπου, αλλά χρειάζεται πνευματική αντιμετώπιση. Τί λέει ο Απόστολος Παύλος; «Ίνα μη λυπήσθε καθώς και οι λοιποί οι μη έχοντες ελπίδα»[121]. Πόσες φορές λ.χ. θα τον έβλεπε εδώ στην γή; Κάθε μήνα; Να σκεφθή ότι εκεί θα τον βλέπη συνέχεια. Μόνον όταν δεν έχη καλή ζωή αυτός που φεύγει, δικαιολογούμαστε να ανησυχούμε. Αν λ.χ. ήταν σκληρός, τότε, αν πραγματικά τον αγαπάμε και θέλουμε να συναντηθούμε στην άλλη ζωή, πρέπει να κάνουμε πολλή προσευχή γι᾿ αυτόν.'
- type: h2
  initial:
    ru: ''
  text:
    ru: Κεφάλαιο 3 – Η μετά θάνατον ζωή
- type: h2
  initial:
    ru: ''
  text:
    ru: Οι υπόδικοι νεκροί
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, όταν πεθάνη ο άνθρωπος, συναισθάνεται αμέσως σε τί κατάσταση βρίσκεται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Ναί, συνέρχεται και λέει «τί έκανα;», αλλά «φαϊντά γιόκ»[122], δηλαδή δεν ωφελεί αυτό. Όπως ένας μεθυσμένος, αν σκοτώση λ.χ. την μάνα του, γελάει, τραγουδάει, επειδή δεν καταλαβαίνει τί έκανε, καί, όταν ξεμεθύση, κλαίει και οδύρεται και λέει «τί έκανα;», έτσι και όσοι σ᾿ αυτήν την ζωή κάνουν αταξίες είναι σαν μεθυσμένοι. Δεν καταλαβαίνουν τί κάνουν, δεν αισθάνονται την ενοχή τους. Όταν όμως πεθάνουν, τότε φεύγει αυτή η μέθη και συνέρχονται. Ανοίγουν τα μάτια της ψυχής τους και συναισθάνονται την ενοχή τους, γιατί η ψυχή, όταν βγή από το σώμα, κινείται, βλέπει, αντιλαμβάνεται με μια ασύλληπτη ταχύτητα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μερικοί ρωτούν πότε θα γίνη η Δευτέρα Παρουσία. Για τον άνθρωπο όμως που πεθαίνει γίνεται κατά κάποιον τρόπο η Δευτέρα Παρουσία, γιατί κρίνεται ανάλογα με την κατάσταση στην οποία τον βρίσκει ο θάνατος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς είναι τώρα οι κολασμένοι;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Είναι υπόδικοι, φυλακισμένοι, που βασανίζονται ανάλογα με τις αμαρτίες που έκαναν και περιμένουν να γίνη η τελική δίκη, η μέλλουσα Κρίση. Υπάρχουν βαρυποινίτες, υπάρχουν και υπόδικοι με ελαφρότερες ποινές.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και οι Άγιοι και ο ληστής[123];
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Οι Άγιοι και ο ληστής είναι στον Παράδεισο, αλλά δεν έχουν λάβει την τέλεια δόξα, όπως και οι υπόδικοι είναι στην κόλαση, αλλά δεν έχουν λάβει την τέλεια καταδίκη. Ο Θεός, ενώ έχει πει εδώ και τόσους αιώνες το «μετανοείτε· ήγγικε γαρ η βασιλεία των ουρανών»[124], παρατείνει-παρατείνει τον χρόνο, επειδή περιμένει εμάς[125]να διορθωθούμε. Αλλά εμείς παραμένοντας στις κακομοιριές μας αδικούμε τους Αγίους, γιατί δεν μπορούν να λάβουν την τέλεια δόξα, την οποία θα λάβουν μετά την μέλλουσα Κρίση.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η προσευχή και τα μνημόσυνα για τους κεκοιμημένους[126]
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι υπόδικοι νεκροί μπορούν να προσεύχωνται;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Έρχονται σε συναίσθηση και ζητούν βοήθεια, αλλά δεν μπορούν να βοηθήσουν τον εαυτό τους. Όσοι βρίσκονται στον Άδη μόνον ένα πράγμα θα ήθελαν από τον Χριστό: να ζήσουν πέντε λεπτά, για να μετανοήσουν. Εμείς που ζούμε, έχουμε περιθώρια μετανοίας, ενώ οι καημένοι οι κεκοιμημένοι δεν μπορούν πια μόνοι τους να καλυτερεύσουν την θέση τους, αλλά περιμένουν από μας βοήθεια. Γι᾿ αυτό έχουμε χρέος να τους βοηθούμε με την προσευχή μας.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Μου λέει ο λογισμός ότι μόνον το δέκα τοις εκατό από τους υπόδικους νεκρούς βρίσκονται σε δαιμονική κατάσταση καί, εκεί που είναι, βρίζουν τον Θεό, όπως οι δαίμονες. Δεν ζητούν βοήθεια, αλλά και δεν δέχονται βοήθεια. Γιατί, τί να τους κάνη ο Θεός; Σαν ένα παιδί που απομακρύνεται από τον πατέρα του, σπαταλάει όλη την περιουσία του και από πάνω βρίζει τον πατέρα του. Έ, τί να το κάνη αυτό ο πατέρας του; Οι άλλοι όμως υπόδικοι, που έχουν λίγο φιλότιμο, αισθάνονται την ενοχή τους, μετανοούν και υποφέρουν για τις αμαρτίες τους. Ζητούν να βοηθηθούν και βοηθιούνται θετικά με τις προσευχές των πιστών. Τους δίνει δηλαδή ο Θεός μια ευκαιρία, τώρα που είναι υπόδικοι, να βοηθηθούν μέχρι να γίνη η Δευτέρα Παρουσία. Και όπως σ᾿ αυτήν την ζωή, αν κάποιος είναι φίλος με τον βασιλιά, μπορεί να μεσολαβήση και να βοηθήση έναν υπόδικο, έτσι και αν είναι κανείς «φίλος» με τον Θεό, μπορεί να μεσολαβήση στον Θεό με την προσευχή του και να μεταφέρη τους υπόδικους νεκρούς από την μια «φυλακή» σε άλλη καλύτερη, από το ένα «κρατητήριο» σε ένα άλλο καλύτερο. Ή ακόμη μπορεί να τους μεταφέρη και σε «δωμάτιο» ή σε «διαμέρισμα».
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Όπως ανακουφίζουμε τους φυλακισμένους με αναψυκτικά κ.λπ. που τους πηγαίνουμε, έτσι και τους νεκρούς τους ανακουφίζουμε με τις προσευχές και τις  ελεημοσύνες που κάνουμε για την ψυχή τους. Οι προσευχές των ζώντων για τους κεκοιμημένους και τα μνημόσυνα είναι η τελευταία ευκαιρία που δίνει ο Θεός στους κεκοιμημένους να βοηθηθούν, μέχρι να γίνη η τελική Κρίση. Μετά την δίκη δεν θα υπάρχη πλέον δυνατότητα να βοηθηθούν.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Ο Θεός θέλει να βοηθήση τους κεκοιμημένους, γιατί πονάει για την σωτηρία τους, αλλά δεν το κάνει, γιατί έχει αρχοντιά. Δεν θέλει να δώση δικαίωμα στον διάβολο να πή: «Πώς τον σώζεις αυτόν, ενώ δεν κοπίασε;». Όταν όμως εμείς προσευχώμαστε για τους κεκοιμημένους, Του δίνουμε το δικαίωμα να επεμβαίνη. Περισσότερο μάλιστα συγκινείται ο Θεός, όταν κάνουμε προσευχή για τους κεκοιμημένους παρά για τους ζώντες.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Γι᾿ αυτό και η Εκκλησία μας έχει τα κόλλυβα, τα μνημόσυνα. Τα μνημόσυνα είναι ο καλύτερος δικηγόρος για τις ψυχές των κεκοιμημένων. Έχουν την δυνατότητα και από την κόλαση να βγάλουν την ψυχή. Κι εσείς σε κάθε Θεία Λειτουργία να διαβάζετε κόλλυβο για τους κεκοιμημένους. Έχει νόημα το σιτάρι. «Σπείρεται εν φθορά, εγείρεται εν αφθαρσία»[127], λέει η Γραφή. Στον κόσμο μερικοί βαριούνται να βράσουν λίγο σιτάρι και πηγαίνουν στην εκκλησία σταφίδες, κουραμπιέδες, κουλουράκια, για να τα διαβάσουν οι ιερείς. Και βλέπεις, εκεί στο Άγιον Όρος κάτι γεροντάκια τα καημένα σε κάθε Θεία Λειτουργία κάνουν κόλλυβο και για τους κεκοιμημένους και για τον Άγιο που γιορτάζει, για να έχουν την ευλογία του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, αυτοί που έχουν πεθάνει πρόσφατα έχουν μεγαλύτερη ανάγκη από προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Έμ, όταν μπαίνη κάποιος στην φυλακή, στην αρχή δεν δυσκολεύεται πιο πολύ; Να κάνουμε προσευχή για τους κεκοιμημένους που δεν ευαρέστησαν στον Θεό, για να κάνη κάτι και γι᾿ αυτούς ο Θεός. Ιδίως, όταν ξέρουμε ότι κάποιος ήταν σκληρός – θέλω να πώ, ότι φαινόταν σκληρός, γιατί μπορεί να νομίζουμε ότι ήταν σκληρός, αλλά στην πραγματικότητα να μην ήταν – και είχε και αμαρτωλή ζωή, τότε να κάνουμε πολλή προσευχή, Θείες Λειτουργίες, Σαρανταλείτουργα για την ψυχή του και να δίνουμε ελεημοσύνη[128]σε φτωχούς για την σωτηρία της ψυχής του, για να ευχηθούν οι φτωχοί «ν᾿ αγιάσουν τα κόκκαλά του», ώστε να καμφθή ο Θεός και να τον ελεήση. Έτσι, ό,τι δεν έκανε εκείνος, το κάνουμε εμείς γι᾿ αυτόν. Ενώ ένας άνθρωπος που είχε καλωσύνη, ακόμη και αν η ζωή του δεν ήταν καλή, επειδή είχε καλή διάθεση, με λίγη προσευχή πολύ βοηθιέται.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Έχω υπ όψιν μου γεγονότα που μαρτυρούν πόσο οι κεκοιμημένοι βοηθιούνται με την προσευχή πνευματικών ανθρώπων. Κάποιος ήρθε στο Καλύβι και μου είπε με κλάματα: «Γέροντα, δεν έκανα προσευχή για κάποιον γνωστό μου κεκοιμημένο και μου παρουσιάσθηκε στον ύπνο μου. «Είκοσι μέρες, μου είπε, έχεις να με βοηθήσης· με ξέχασες και υποφέρω». Πράγματι, μου λέει, εδώ και είκοσι μέρες είχα ξεχασθή με διάφορες μέριμνες και ούτε για τον εαυτό μου δεν προσευχόμουν».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, πεθάνη κάποιος και μας ζητήσουν να προσευχηθούμε γι᾿ αυτόν, είναι καλό να κάνουμε κάθε μέρα ένα κομποσχοίνι μέχρι τα σαράντα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άμα κάνης κομποσχοίνι γι᾿ αυτόν, βάλε και άλλους κεκοιμημένους. Γιατί να πάη μια αμαξοστοιχία στον προορισμό της με έναν μόνον επιβάτη, ενώ χωράει και άλλους; Πόσοι κεκοιμημένοι έχουν ανάγκη οι καημένοι και ζητούν βοήθεια και δεν έχουν κανέναν να προσευχηθή γι᾿ αυτούς! Μερικοί κάθε τόσο κάνουν μνημόσυνο μόνο για κάποιον δικό τους. Με αυτόν τον τρόπο δεν βοηθιέται ούτε ο δικός τους, γιατί η προσευχή τους δεν είναι τόσο ευάρεστη στον Θεό. Αφού τόσα μνημόσυνα έκαναν γι᾿ αυτόν, ας κάνουν συγχρόνως και για τους ξένους.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, με απασχολεί μερικές φορές η σωτηρία του πατέρα μου, γιατί δεν είχε καμμιά σχέση με την Εκκλησία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν ξέρεις την κρίση του Θεού την τελευταία στιγμή. Πότε σε απασχολεί; κάθε Σάββατο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δεν έχω παρακολουθήσει, αλλά γιατί το Σάββατο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί αυτήν την ημέρα την δικαιούνται οι κεκοιμημένοι.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, οι νεκροί που δεν έχουν ανθρώπους να προσεύχωνται γι᾿ αυτούς βοηθιούνται από τις προσευχές εκείνων που προσεύχονται γενικά για τους κεκοιμημένους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και βέβαια βοηθιούνται. Εγώ, όταν προσεύχωμαι για όλους τους κεκοιμημένους, βλέπω στον ύπνο μου τους γονείς μου, γιατί αναπαύονται από την προσευχή που κάνω. Κάθε φορά που έχω Θεία Λειτουργία, κάνω και γενικό μνημόσυνο για όλους τους κεκοιμημένους και εύχομαι για τους βασιλείς, για τους αρχιερείς κ.λπ. και στο τέλος λέω «καί υπέρ ών τα ονόματα ουκ εμνημονεύθησαν». Αν καμμιά φορά δεν κάνω ευχή για τους κεκοιμημένους, παρουσιάζονται γνωστοί κεκοιμημένοι μπροστά μου. Έναν συγγενή μου, που είχε σκοτωθή στον πόλεμο, τον είδα ολόκληρο μπροστά μου μετά την Θεία Λειτουργία, την ώρα του μνημοσύνου, γιατί αυτόν δεν τον είχα γραμμένο με τα ονόματα των κεκοιμημένων, επειδή μνημονευόταν στην Προσκομιδή με τους ηρωικώς πεσόντες. Κι εσείς στην Αγία Πρόθεση να μη δίνετε να μνημονευθούν μόνον ονόματα ασθενών, αλλά και ονόματα κεκοιμημένων, γιατί μεγαλύτερη ανάγκη έχουν οι κεκοιμημένοι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Το καλύτερο μνημόσυνο για τους κεκοιμημένους
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Το καλύτερο από όλα τα μνημόσυνα που μπορούμε να κάνουμε για τους κεκοιμημένους είναι η προσεκτική ζωή μας, ο αγώνας που θα κάνουμε, για να κόψουμε τα ελαττώματά μας και να λαμπικάρουμε την ψυχή μας. Γιατί η δική μας ελευθερία από τα υλικά πράγματα και από τα ψυχικά πάθη, εκτός από την δική μας ανακούφιση, έχει ως αποτέλεσμα και την ανακούφιση των κεκοιμημένων προπάππων όλης της γενιάς μας. Οι κεκοιμημένοι νιώθουν χαρά, όταν ένας απόγονός τους είναι κοντά στον Θεό. Αν εμείς δεν είμαστε σε καλή πνευματική κατάσταση, τότε υποφέρουν οι κεκοιμημένοι γονείς μας, ο παππούς μας, ο προπάππος μας, όλες οι γενεές. «Δές τί απογόνους κάναμε!», λένε και στενοχωριούνται. Αν όμως είμαστε σε καλή πνευματική κατάσταση, ευφραίνονται, γιατί και αυτοί έγιναν συνεργοί να γεννηθούμε και ο Θεός κατά κάποιον τρόπο υποχρεώνεται να τους βοηθήση. Αυτό δηλαδή που θα δώση χαρά στους κεκοιμημένους είναι να αγωνισθούμε να ευαρεστήσουμε στον Θεό με την ζωή μας, ώστε να τους συναντήσουμε στον Παράδεισο και να ζήσουμε όλοι μαζί στην αιώνια ζωή.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Επομένως, αξίζει τον κόπο να χτυπήσουμε τον παλαιό μας άνθρωπο, για να γίνη καινός και να μη βλάπτη πια ούτε τον εαυτό του ούτε άλλους ανθρώπους, αλλά να βοηθάη και τον εαυτό του και τους άλλους, είτε ζώντες είναι είτε κεκοιμημένοι.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η παρρησία των δικαίων προς τον Θεό
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γέροντα, στην προς Αρχαρίους Επιστολή σας γράφετε: «Παρόλο που καταλαβαίνουν οι αληθινοί μοναχοί ότι αυτό που απολαμβάνουν σ᾿ αυτήν την ζωή είναι μέρος της χαράς του Παραδείσου και ότι στον Παράδεισο θα είναι περισσότερη, εν τούτοις από πολλή αγάπη προς τον πλησίον τους θέλουν να ζήσουν επί της γής, για να βοηθούν τους ανθρώπους με την προσευχή, να επεμβαίνη ο Θεός και να βοηθιέται ο κόσμος»[129].'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Γράψε: «Θέλουν να ζήσουν επί της γής, για να συμπάσχουν με τους ανθρώπους και να τους βοηθούν με την προσευχή».'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Στην άλλη ζωή, Γέροντα, ένας σωστός μοναχός πάλι δεν θα βοηθάη με την προσευχή του τους ανθρώπους;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Και στην άλλη ζωή θα βοηθάη με την προσευχή του, αλλά δεν θα υποφέρη, ενώ τώρα συμπάσχει· δεν περνάει χαρούμενα εδώ, «μέ χαρούμενη την όψη και με βλέμμα λαμπερό»! Όσο όμως υποφέρει για τον πλησίον του, τόσο ανταμείβεται με θεία παρηγοριά, και αυτό είναι κατά κάποιον τρόπο και η πληροφορία ότι βοηθιέται ο άλλος. Αυτή η παραδεισένια χαρά είναι η θεία ανταμοιβή για τον πόνο που νιώθει για τον αδελφό του.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Δηλαδή, Γέροντα, οι Άγιοι που επικαλούμαστε να μας βοηθήσουν δεν συμπάσχουν μαζί μας;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Εκεί δεν έχει πόνο, βρέ παιδάκι μου! Στον Παράδεισο υποφέρουν; «Ένθα ουκ έστι πόνος ου λύπη ου στεναγμός»[130]δεν λέει; Ύστερα οι Άγιοι έχουν υπ όψιν τους την θεία ανταμοιβή που θα λάβουν όσοι άνθρωποι βασανίζονται σ᾿ αυτήν την ζωή και αυτό τους κάνει να χαίρωνται. Μά και ο ίδιος ο Θεός που έχει τόση αγάπη, τόση ευσπλαχνία, πώς αντέχει αυτόν τον μεγάλο πόνο των ανθρώπων; Αντέχει, γιατί έχει υπ᾿ όψιν Του την θεία ανταμοιβή που τους περιμένει. Όσο δηλαδή βασανίζονται εδώ οι άνθρωποι, τόσο τους αποταμιεύει εκεί ουράνιο μισθό. Ενώ εμείς αυτά δεν τα βλέπουμε και συμπάσχουμε με όσους υποφέρουν. Γι᾿ αυτό, όταν κάποιος τα βλέπη λίγο αυτά και έχη υπ᾿ όψιν του την ανταμοιβή που θα λάβουν, δεν υποφέρει τόσο πολύ.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν, Γέροντα, παρακαλούμε τον Θεό να βοηθήση κάποιον κεκοιμημένο που δεν έχει ανάγκη, πάει χαμένη αυτή η προσευχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Πώς να πάη χαμένη; Όταν λέμε «ανάπαυσον τον τάδε» και αυτός είναι σε καλή θέση στην άλλη ζωή, δεν παρεξηγείται· ίσα-ίσα συγκινείται. «Για δές, λέει, εγώ είμαι σε καλή θέση και εκείνοι αγωνιούν», οπότε φιλοτιμιέται και μας βοηθάει πιο πολύ, πρεσβεύοντας στον Θεό για μάς. Αλλά που να ξέρης σε τί κατάσταση βρίσκεται ο άλλος; Φυσιολογικά κάνεις ευχή πρώτα γι᾿ αυτούς που γνωρίζεις ότι με την ζωή τους λύπησαν τον Θεό και εύχεσαι και για άλλες ανάλογες περιπτώσεις και ύστερα εύχεσαι και για όλους τους κεκοιμημένους.
- type: h2
  initial:
    ru: ''
  text:
    ru: Η μέλλουσα Κρίση
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς εξαγνίζεται η ψυχή;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Όταν ο άνθρωπος εργασθή τις εντολές του Θεού, κάνη δουλειά στον εαυτό του και καθαρισθή από τα πάθη, τότε ο νούς φωτίζεται, φθάνει σε ύψος θεωρίας, και η ψυχή λαμπρύνεται και γίνεται όπως ήταν πριν από την πτώση των Πρωτοπλάστων. Σε τέτοια κατάσταση θα βρίσκεται μετά την ανάσταση των νεκρών. Μπορεί όμως ο άνθρωπος να δη την ανάσταση της ψυχής του πριν από την κοινή ανάσταση, αν καθαρισθή τελείως από τα πάθη. Το σώμα του τότε θα είναι αγγελικό, άυλο, και δεν θα νοιάζεται για τροφή υλική.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα γίνη η μέλλουσα Κρίση;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Στην μέλλουσα Κρίση θα αποκαλυφθή σε μια στιγμή η κατάσταση του κάθε ανθρώπου και μόνος του καθένας θα τραβήξη για ᾿κεί που είναι. Καθένας θα βλέπη[131]σαν σε τηλεόραση τα δικά του χάλια και την πνευματική κατάσταση του άλλου. Θα καθρεφτίζη τον εαυτό του στον άλλον και θα σκύβη το κεφάλι και θα πηγαίνη στην θέση του. Δεν θα μπορή λ.χ. να πη μια νύφη που καθόταν μπροστά στην πεθερά της σταυροπόδι και η πεθερά της με σπασμένο πόδι φρόντιζε το εγγονάκι: «γιατί, Χριστέ μου, βάζεις την πεθερά μου στον Παράδεισο κι εμένα δεν με βάζεις;», επειδή θα έρχεται μπροστά της εκείνη η σκηνή. Θα θυμάται την πεθερά της που στεκόταν όρθια με σπασμένο πόδι και φρόντιζε το εγγονάκι της και δεν θα έχη μούτρα να πάη στον Παράδεισο, αλλά ούτε και θα χωράη στον Παράδεισο. Ή οι μοναχοί θα βλέπουν τί δυσκολίες, τί δοκιμασίες είχαν οι κοσμικοί και πώς τις αντιμετώπισαν καί, αν δεν έχουν ζήσει σωστά, θα σκύψουν το κεφάλι και θα τραβήξουν μόνοι τους για εκεί που θα είναι. Θα δούν εκεί οι μοναχές, που δεν ευαρέστησαν στον Θεό, ηρωίδες μάνες, που ούτε υποσχέσεις έδωσαν, ούτε τις ευλογίες και τις ευκαιρίες τις δικές τους είχαν, πώς αγωνίσθηκαν και σε τί κατάσταση πνευματική έφθασαν, και εκείνες, καλόγριες, με τί μικροπρέπειες ασχολούνταν και βασανίζονταν, και θα ντρέπωνται! Έτσι μου λέει ο λόγισμός ότι θα γίνη η Κρίση. Δεν θα πη δηλαδή ο Χριστός: «έλα εδώ εσύ, τί έκανες;» ή «εσύ θα πάς στην κόλαση, εσύ στον Παράδεισο», αλλά ο καθένας θα συγκρίνη τον εαυτό του με τον άλλον και θα τραβήξη για εκεί που θα είναι[132].'
- type: h2
  initial:
    ru: ''
  text:
    ru: Η μέλλουσα ζωή
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, έφερα γλυκά να κεράσετε.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δές πώς χαίρονται! Στην άλλη ζωή θα λέμε: «Με τί χαζά χαιρόμασταν! Τί μας συγκινούσαν τότε!». Ενώ τώρα σκιρτάει η καρδιά γι᾿ αυτά.'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, πώς θα το καταλάβουμε αυτό από τώρα;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Άμα το καταλάβετε αυτό από τώρα, δεν θα το πήτε μεθαύριο στην άλλη ζωή. Πάντως, όσοι βρίσκονται εκεί επάνω, καλά περνούν. Ξέρεις τί εργόχειρο κάνουν εκεί  στον Ουρανό; Συνέχεια δοξολογούν τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, γιατί το σώμα του νεκρού λέγεται «λείψανο»;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γιατί είναι ό,τι μένει εδώ στην γη από τον άνθρωπο μετά τον θάνατο. Ο κυρίως άνθρωπος, που είναι η ψυχή, φεύγει στον Ουρανό. Στην μέλλουσα Κρίση θα αναστήση ο Θεός και το σώμα, για να κριθή με αυτό ο άνθρωπος, γιατί με αυτό έζησε και αμάρτησε. Στην άλλη ζωή όλοι θα έχουν το ίδιο σώμα – πνευματικό σώμα -, το ίδιο ανάστημα, και οι κοντοί και οι ψηλοί, την ίδια ηλικία, και οι νέοι και οι γέροι και τα μωρά, αφού η ψυχή είναι ίδια. Θα υπάρχη δηλαδή μια αγγελική ηλικία.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, στην άλλη ζωή όσοι θα είναι στην Κόλαση θα βλέπουν αυτούς που θα είναι στον Παράδεισο;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Κοίταξε, όπως αυτοί που είναι την νύχτα έξω στο σκοτάδι βλέπουν όσους είναι μέσα σε ένα δωμάτιο φωτισμένο, έτσι και όσοι θα βρίσκωνται στην κόλαση θα βλέπουν όσους θα είναι στον Παράδεισο. Και αυτό θα είναι μεγαλύτερη κόλαση. Όπως πάλι όσοι την νύχτα είναι στο φώς, δεν βλέπουν αυτούς που είναι έξω στο σκοτάδι, έτσι και αυτοί που θα βρίσκωνται στον Παράδεισο δεν θα βλέπουν αυτούς που θα είναι στην κόλαση. Γιατί, αν έβλεπαν τους κολασμένους, θα πονούσαν, θα θλίβονταν για την ταλαιπωρία τους, και δεν θα απολάμβαναν τον Παράδεισο, αλλά εκεί «ουκ έστι πόνος...»[133]. Και όχι μόνο δεν θα τους βλέπουν, αλλά ούτε θα θυμούνται αν είχαν αδελφό ή πατέρα ή μητέρα, αν δεν είναι και εκείνοι στον Παράδεισο. «Εν εκείνη τη ημέρα απολούνται πάντες οι διαλογισμοί αυτού»[134]λέει ο Ψαλμωδός. Γιατί, άμα τους θυμούνται, πώς θα είναι Παράδεισος; Αυτοί μάλιστα που θα είναι στον Παράδεισο, θα νομίζουν ότι δεν θα υπάρχουν άλλοι άνθρωποι, ούτε θα θυμούνται τις αμαρτίες που είχαν κάνει. Γιατί, αν θυμούνται τις αμαρτίες τους, δεν θα αντέχουν από φιλότιμο στην σκέψη ότι λύπησαν τον Θεό.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Η ποσότητα πάλι της χαράς του καθενός στον Παράδεισο θα είναι διαφορετική. Άλλος θα έχη μια δαχτυλήθρα χαρά, άλλος ένα ποτήρι, άλλος μια ολόκληρη δεξαμενή. Όλοι όμως θα αισθάνωνται πλήρεις και κανένας δεν θα ξέρη το μέγεθος της χαράς, της αγαλλιάσεως, του άλλου. Τα κανόνισε έτσι ο Καλός Θεός, γιατί, αν γνώριζε ο ένας ότι ο άλλος έχει περισσότερη χαρά, δεν θα ήταν τότε Παράδεισος, επειδή θα υπήρχε το «γιατί εκείνος να έχη περισσότερη χαρά και εγώ λιγώτερη;». Δηλαδή καθένας θα βλέπη στον Παράδεισο την δόξα του Θεού ανάλογα με την καθαρότητα των οφθαλμών της ψυχής του. Η ορατότητα όμως δεν θα καθορισθή από τον Θεό, αλλά θα εξαρτηθή από την δική του καθαρότητα.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Γέροντα, μερικοί δεν πιστεύουν ότι υπάρχει κόλαση και Παράδεισος.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: '– Δεν πιστεύουν ότι υπάρχει κόλαση και Παράδεισος; Πώς είναι δυνατόν οι νεκροί να μείνουν στην ανυπαρξία, αφού είναι ψυχές; Ο Θεός είναι αθάνατος και ο άνθρωπος είναι κατά χάριν αθάνατος. Επομένως αθάνατος θα είναι και στην κόλαση. Ύστερα τον Παράδεισο και την κόλαση τα ζη η ψυχή μας σε έναν βαθμό και από αυτήν την ζωή, ανάλογα με την κατάσταση στην οποία βρίσκεται. Όταν κάποιος έχη τύψεις συνειδήσεως και νιώθη φόβο, ταραχή, άγχος, απελπισία, ή είναι κυριευμένος από μίσος, από φθόνο κ.λπ., τότε ζη την κόλαση. Ενώ, όταν μέσα του υπάρχη αγάπη, χαρά, ειρήνη, πραότητα, καλωσύνη κ.λπ., τότε ζη τον Παράδεισο. Όλη η βάση είναι η ψυχή, γιατί αυτή είναι που αισθάνεται και την χαρά και τον πόνο. Νά, πήγαινε σε έναν πεθαμένο και πές του τα πιο ευχάριστα πράγματα, λ.χ. «ήρθε ο αδελφός σου από την Αμερική» κ.λπ., δεν θα καταλάβη τίποτε. Αν του σπάσης τα χέρια, τα πόδια, πάλι δεν θα καταλάβη. Επομένως η ψυχή είναι που αισθάνεται. Αυτά όλα δεν τους προβληματίζουν; Ή, ας υποθέσουμε, βλέπεις ένα ωραίο, ένα ευχάριστο όνειρο, χαίρεσαι, χτυπάει γλυκά η καρδιά σου και δεν θέλεις να τελειώση. Ξυπνάς και στενοχωριέσαι, γιατί ξύπνησες. Ή βλέπεις ένα άσχημο όνειρο, ότι έπεσες λ.χ. και έσπασες τα πόδια σου, και υποφέρεις, κλαίς. Από την αγωνία σου ξυπνάς με δάκρυα στα μάτια, βλέπεις ότι δεν έπαθες τίποτε, και λές: «Ευτυχώς όνειρο ήταν!». Δηλαδή συμμετέχει η ψυχή. Από ένα άσχημο όνειρο υποφέρει κανείς περισσότερο από ό,τι στην πραγματικότητα, όπως και ο άρρωστος υποφέρει πιο πολύ την νύχτα απ᾿ ό,τι την ημέρα. Έτσι και όταν πεθάνη ο άνθρωπος, αν πάη στην κόλαση, θα είναι πιο οδυνηρό. Σκεφθήτε να ζη κανείς ένα αιώνιο εφιαλτικό όνειρο και να βασανίζεται αιώνια! Εδώ δεν μπορείς να αντέξης για λίγα λεπτά ένα άσχημο όνειρο, άντε τώρα αιώνια – Θεός φυλάξοι – να είσαι μέσα στην θλίψη. Γι᾿ αυτό καλύτερα να μην πάμε στην κόλαση. Εσείς τί λέτε;'
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Τόσον καιρό, Γέροντα, κάνουμε αγώνα να μην πάμε στην κόλαση· λέτε, εκεί να καταλήξουμε;
- type: paragraph
  initial:
    ru: ''
  text:
    ru: – Αν δεν έχουμε μυαλό, εκεί θα πάμε. Εγώ εύχομαι ή όλοι στον Παράδεισο ή κανένας στην κόλαση... Καλά δεν λέω; Είναι πολύ βαρύ, μετά από όσα έκανε ο Θεός για μας τους ανθρώπους, να πάμε στην κόλαση και να Τον λυπήσουμε. Ο Θεός να φυλάξη, όχι μόνον άνθρωπος, αλλά ούτε πουλί να μην πάη στην κόλαση.
- type: paragraph
  initial:
    ru: ''
  text:
    ru: Ο Καλός Θεός ας μας δώση καλή μετάνοια, για να μας βρη ο θάνατος σε καλή πνευματική κατάσταση και να αποκατασταθούμε στην Ουράνια Βασιλεία Του. Αμήν.
- type: h2
  initial:
    ru: ''
  text:
    ru: Ευρετηρια
- type: h2
  initial:
    ru: ''
  text:
    ru: ΙΙ. Πατερικών χωρίων
- type: paragraph
  initial:
    ru: ''
  text:
    ru: 'Γρηγορίου Μοναχού, μαθητή Αγ. Βασιλείου του Νέου, «Ο τελωνισμός των ψυχών κατά την ώρα του θανάτου: Τα είκοσι τρία βασικά τελώνια», Ι. Η συχ. Αγ. Αθανασίου και Αγ. Νεομαρτύρων Ακυλίνης, Κυράννης και Αργυρής, Γαλήνη Όσσης Λαγκαδά'
- type: paragraph
  initial:
