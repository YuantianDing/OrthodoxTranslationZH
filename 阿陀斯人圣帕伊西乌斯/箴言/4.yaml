  '35': Ο Μολόχ ήταν σημιτική θεότητα. Στην Παλαιά Διαθήκη αναφέρεται πάντοτε σε σχέση με τις ανθρωποθυσίες, ιδίως μικρών παιδιών, τα οποία έσφαζαν και στην συνέχεια έκαιγαν επάνω σε σχάρες και τα πρόσφεραν θυσία στο άγαλμα του Μολόχ.
