  '10': Ο Γέροντας εννοεί ότι η εργασία αυτή γίνεται από τον Πνευματικό και είναι αποτελεσματική, εφόσον οι σύζυγοι θα έχουν τον ίδιο Πνευματικό, ώστε το πλάνισμα να γίνη «μέ την ίδια πλάνη».
