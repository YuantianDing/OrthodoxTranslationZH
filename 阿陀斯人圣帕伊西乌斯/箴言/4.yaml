  '25': Ο Άγιος Αρσένιος, όπως αναφέρεται στον βίο του, στις περιπτώσεις στειρώσεως ευλογούσε ένα σχοινάκι και το έδινε στην γυναίκα να το φορέση, για να λυθή η στείρωση. Ο Γέροντας μας έλεγε σε παρόμοιες περιπτώσεις να σταυρώνουμε μία κορδέλα στα ιερά Λείψανα του Αγίου Αρσενίου και να την δίνουμε στην γυναίκα που έχει το πρόβλημα να την φορέση.
