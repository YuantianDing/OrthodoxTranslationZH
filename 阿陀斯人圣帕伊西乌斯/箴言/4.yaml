  '39': Κάποτε πήγαν σταφύλια στον Αββά Μακάριο. Εκείνος, αν και του άρεζαν, έκανε εγκράτεια και τα έστειλε σε κάποιον ασθενή αδελφό που επιθυμούσε να φάη σταφύλια. Ο αδελφός, μόλις τα είδε, χάρηκε πολύ, αλλά, επειδή και αυτός δεν ήθελε να ικανοποιήση την επιθυμία του, τα έστειλε σε άλλον αδελφό και του παρήγγειλε ότι αυτός δεν είχε όρεξη να τα φάη. Εκείνος έκανε πάλι το ίδιο, και έτσι τα σταφύλια γύρισαν πολλούς αδελφούς, χωρίς κανείς να τα δοκιμάση. Ο τελευταίος δε αδελφός μη ξέροντας ότι προέρχονταν από τον Αββά Μακάριο τα έστειλε σ᾿ εκείνον ως μεγάλο δώρο, ο οποίος τα γνώρισε και θαύμασε την εγκράτεια των αδελφών. (Παλλαδίου, Επισκόπου Ελενοπόλεως,Λαυσαϊκή Ιστορία, Φιλοκαλία των Νηπτικών και Ασκητικών, Τόμος 6, έκδ. «Το Βυζάντιον», Θεσσαλονίκη 1996, σ. 122).
