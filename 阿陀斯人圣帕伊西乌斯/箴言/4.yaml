  '117': 'Βλ. Γρηγορίου Μοναχού, μαθητή Αγ. Βασιλείου του Νέου, «Ο τελωνισμός των ψυχών κατά την ώρα του θανάτου: Τα είκοσι τρία βασικά τελώνια», Ι. Ησυχ. Αγ. Αθανασίου και Αγ. Νεομαρτύρων Ακυλίνης, Κυράννης και Αργυρής, Γαλήνη Όσσης Λαγκαδά.'
  '118': Ο Όσιος Ευφρόσυνος στο Κοινόβιο όπου μόναζε είχε την διακονία του μαγείρου. Εργαζόταν κρυφά τις αρετές και είχε φθάσει σε πνευματικά μέτρα. Ο Ηγούμενός του κάποια νύχτα προσευχόταν στον Θεό να του αποκαλύψη ποιός αδελφός ήταν ο πιο ενάρετος του Κοινοβίου. Τότε έπεσε σε έκσταση και βρέθηκε σε ένα περιβόλι γεμάτο από εξαίσια αγαθά. Ενώ μάταια προσπαθούσε να κόψη κάποιους καρπούς από τα δένδρα, είδε μπροστά του τον Όσιο Ευφρόσυνο να απολαμβάνη όλη εκείνη την τρυφή και του ζήτησε από εκείνους τους καρπούς. Ο Όσιος έκοψε και του έδωσε τρία μήλα. Ο Ηγούμενος, όταν συνήλθε από την οπτασία εκείνη, βρέθηκε να κρατάη τα μήλα, που είχαν μία εξαίσια ευωδία. Από δε τον Όσιο Ευφρόσυνο έμαθε ότι πράγματι εκείνη την νύχτα βρισκόταν εκεί όπου είναι τα αγαθά που μέλλουν να κληρονομήσουν οι αγαπώντες τον Θεό. (Ευεργετινός, τόμος Β´, Υπόθεσις Α´, έκδ. Ματθαίου Λαγγή, Αθήναι 1980, σ. 37–38).
  '119': Α´ Θεσ. 4, 13.
  '120': Βλ.Ωρολόγιον το Μέγα, Ακολουθία του Μεσονυκτικού, Εκτενή Δέησιν, σ. 22.
  '121': Α´ Θεσ. 4, 13.
  '122': Έκφραση της τουρκικής γλώσσας που σημαίνει «δέν υπάρχει όφελος, δεν υπάρχει χαΐρι».
  '123': Λουκ. 23, 32–33 και 39–43.
  '124': Ματθ. 3, 2 και 4, 17· βλ. καιΜατθ. 10, 7·Μάρκ. 1, 15·Λουκ. 10, 9 και 11.
  '125': Με το «εμάς» ο Γέροντας εννοεί την σύνολη ανθρωπότητα.
  '126': 'Ο Άγιος Νεκτάριος στο έργο του «Μελέτη περί της αθανασίας της ψυχής και περί των ιερών μνημοσύνων», εκδ. Βασ. Ρηγοπούλου, Θεσσαλονίκη 1973, σ. 202, γράφει ως συμπέρασμα των όσων ανέπτυξε βάσει των σχετικών μαρτυριών των Αγίων Πατέρων: «Εξ όλων δη τούτων δήλον γίνεται, ότι η ψυχή μετά θάνατον αδυνατεί να κάμη τι έργον σωτηριώδες και να απαλλαγή των του Άδου αλύτων δεσμών, και ότι μόνον αι θείαι λειτουργίαι, αι προσευχαί των οικείων, των δικαίων, αι υπέρ αυτών γινόμεναι και αι ελεημοσύναι γίνονται πρόξενοι σωτηρίας και ελευθερίας από των δεσμών του Άδου».'
  '127': Α´ Κορ. 15, 42.
  '128': Πρβλ. Αγίου Ιωάννου του Δαμασκηνού,Περί των εν πίστει κεκοιμημένων, όπως αι περί αυτών γινόμεναι λειτουργίαι και ευποιΐαι τούτους ονίνησιν,PG95, 248.
  '129': Γέροντος Παϊσίου Αγιορείτου,Επιστολές, Ιερόν Η συχαστήριον «Ευαγγελιστής Ιωάννης ο Θεολόγος», έκδ. 6η, Σουρωτή Θεσσαλονίκης, 2002, σ. 49.
  '130': Βλ.Ευχολόγιον το Μέγα, Ακολουθία Νεκρώσιμος, σ. 411.
  '131': 'Ο Άγιος Ιωάννης ο Δαμασκηνός γράφει: «Μη γαρ οιέσθω τις, ότι ουκ αναγνωρισμός εκάστου προς έκαστον επί της φοβεράς εκείνης συναγωγής γενήσεται. Ναί, όντως έκαστος αναγνωριεί τον πλησίον αυτού, ου τω του σώματος σχήματι, αλλά τω διορατικώ της ψυχής όμματι». PG 95, 276Α.'
  '132': 'Ο Άγιος Συμεών ο Νέος Θεολόγος γράφει: «Και απλώς πάς άνθρωπος αμαρτωλός εν τη φοβερά ημέρα της κρίσεως απεναντίας αυτού εις την αιωνίαν ζωήν και εις το ανεκλάλητον εκείνο φως όψεται τον όμοιον αυτού και κριθήσεται παρ᾿ αυτού»,Περί μετανοίας, Λόγος Ε´,SourcesChrétiennes96, 434.'
  '133': Βλ.Ευχολόγιον το Μέγα, Ακολουθία Νεκρώσιμος, σ. 411.
  '134': Ψαλμ. 145, 4.
  '*': Στην εκκλησιαστική γλώσσα ο όρος «οικονομία» εκφράζει την παρέκκλιση από την ακρίβεια του κανόνος, την οποία αποφασίζει η Εκκλησία κατά το πρότυπο της άπειρης συγκατάβασης και φιλανθρωπίας του Θεού, όταν κρίνη ότι αυτό είναι προς πνευματική ωφέλεια.
