  '18': Η Θεοτόκος γεννήθηκε κατά φυσικό τρόπο και όχι παρθενικώς. «Ήταν πάναγνη», γιατί, όπως γράφει ο Άγιος Ιωάννης ο Δαμασκηνός στον Λόγο του «Εις το Γενέσιον της Υπεραγίας Δεσποίνης ημών Θεοτόκου», συνελήφθηκε από τους Αγίους Θεοπάτορες «σωφρόνως» (βλ.PG96, 669Α), αλλά και αύξησε με τον αγώνα της την αγιότητα που έλαβε από τους γονείς της, αποκρούοντας «πάντα λογισμόν περιττόν και ψυχοβλαβή πριν γεύσασθαι» (αυτόθι 676Β).
  '19': Ο Γέροντας ασκήτεψε στο Σινά, στο ασκητήριο των Αγίων Επιστήμης και Γαλακτίωνος, από το 1962 μέχρι το 1964. Το γεγονός αυτό δεν μας το απεκάλυψε.
  '20': Βλ.Γέν. 1, 31.
  '21': 'Σχετικά με το θέμα των συζυγικών σχέσεων έγραφε ο Γέροντας Παΐσιος σε μια επιστολή του: «Δια το θέμα των συζυγικών σχέσεων των εγγάμων ιερέων, αλλά και των λαϊκών, που μου αναφέρεις, αφού δεν καθορίζουν οι Άγιοι Πατέρες το πώς ακριβώς, σημαίνει ότι είναι κάτι που δεν καθορίζεται, γιατί δεν μπορούν όλοι οι άνθρωποι να μπούν σε ένα καλούπι. Οι Πατέρες το αφήνουν στη διάκριση, το φιλότιμο, την πνευματική ευαισθησία και τη δύναμη του καθενός. Δια να γίνω πιο αντιληπτός, γράφω περιπτώσεις αγωνιστών εγγάμων ιερέων και λαϊκών που ζουν και γνωρίζω. Εξ αυτών υπάρχουν εκείνοι που ήρθαν σε επαφή μετά τον γάμο και αποκτήσανε ένα, δυό, τρία παιδιά και μετά ζουν εν παρθενία. Άλλοι έρχονται μια φορά τον χρόνο για τεκνογονία και μετά ζουν σαν αδέλφια πάλι. Άλλοι απέχουν τις περιόδους των νηστειών και μετά έρχονται σε επαφή. Άλλοι δεν μπορούν να το πετύχουν ούτε αυτό. Άλλοι μια φορά στο ενδιάμεσο της εβδομάδος, για να είναι τρεις ημέρες πριν από την θεία Κοινωνία και τρεις μετά την θεία Κοινωνία. Άλλοι σκοντάφτουν και αυτού, δι᾿ αυτό και ο Χριστός μετά την Ανάσταση που παρουσιάσθηκε στους Αποστόλους, η πρώτη του λέξη ήτο: «Καθώς απέσταλκέ με ο Πατήρ, καγώ πέμπω υμάς... Λάβετε Πνεύμα Άγιον· αν τινων αφήτε τας αμαρτίας, αφίενται αυτοίς, αν τινων κρατήτε, κεκράτηνται». Ο σκοπός είναι να αγωνισθεί κανείς με διάκριση και φιλότιμο, ανάλογα με τις πνευματικές του δυνάμεις. Στην αρχή φυσικά δεν βοηθάει η ηλικία, αλλά, όσο περνάνε τα χρόνια και εξασθενεί η σάρκα, μπορεί να επιβληθεί το πνεύμα και παράλληλα αρχίζουν να γεύονται και οι έγγαμοι λίγες από τις θείες ηδονές. Αποσύρονται φυσιολογικά από τις σαρκικές ηδονές, τις οποίες τότε τις βλέπουν πολύ τιποτένιες. Έτσι εξαγνίζονται κατά κάποιον τρόπο και οι έγγαμοι και φθάνουν στον Παράδεισο από το ξεκούραστο μονοπάτι με τις στροφές. Ενώ οι μοναχοί χτυπάνε κατακόρυφα, σκαρφαλώνοντας στα βράχια, και ανεβαίνουν στον Παράδεισο. Πρέπει να έχεις υπ᾿ όψη σου ότι το θέμα των σχέσεων δεν είναι θέμα μόνο δικό σου, ούτε έχεις δικαίωμα να το ρυθμίσεις μόνος σου, αλλά «εκ συμφώνου» κατά τον Απόστολο Παύλο. Όταν γίνεται και αυτό το «εκ συμφώνου», πάλι χρειάζεται προσοχή. Ο δυνατός θα πρέπει να παίρνει τη θέση του αδυνάτου. Πολλές φορές, για να μη λυπήσει το ένα μέρος το άλλο, λέγει ότι συμφωνεί, αλλά εσωτερικά ταλαιπωρείται. Αυτό συμβαίνει ιδίως στις γυναίκες που έχουν λίγο φόβο Θεού και έχουν ζωηρή σάρκα. Πολλές φορές από αδιακρισία μερικοί ευλαβείς άνδρες, επειδή ακούνε από τις γυναίκες τους ότι συμφωνούν, προχωρούν αδιάκριτα σε μεγάλο διάστημα εγκρατείας και τότε οι γυναίκες ταλαιπωρούνται και ξεσπάνε σε νευρικότητες κ.λπ. Οι άνδρες νομίζουν ότι οι γυναίκες τους έχουν προχωρήσει στην αρετή και θέλουν να ζουν πιο αγνά σε μεγαλύτερα διαστήματα και μπαίνει μετά ο πειρασμός στις γυναίκες και θέλουν να γνωρίσουν φίλους. Και όταν γίνει αυτό, τις πιάνει η τύψη της συνειδήσεως για την πτώση και οι άνδρες προσπαθούν να ζήσουν πιο αγνά, βλέποντας τις γυναίκες να μην έχουν διάθεση. Νομίζουν έτσι ότι έχουν προχωρήσει πιο πνευματικά και δεν επιθυμούν σαρκικά πράγματα. Αιτία φυσικά είναι και ο δικαιολογημένος γυναικείος εγωισμός και η ζήλεια, που νιώθουν μειονεκτικές. Η  γυναίκα, όταν ιδεί τον άνδρα να θέλει να ζήσει πνευματική ζωή, ζορίζει τον εαυτό της, για να τον ξεπεράσει. Συγχώρησέ με που μπήκα σε ξένα αμπέλια, διότι το έργο του μοναχού είναι το κομβοσχοίνι και όχι αυτά τα θέματα, αλλά, για να μη σε λυπήσω, αναγκάστηκα να σού γράψω μερικά από αυτά (πού γνωρίζω από μακριά), τα οποία ταλαιπωρούν τα αδέλφια μας στον κόσμο και δίνουν χώρο στον εχθρό. Έχει μεγάλη σημασία εάν είναι και οι δυο σύζυγοι όμοιοι στην κράση. Όταν τύχει ο ένας να έχει ήπια και ο άλλος ζωηρή, θα πρέπει να γίνεται μια θυσία από τον δυνατότερο προς τον φιλάσθενο και σιγά-σιγά να βοηθηθεί να λάβει την υγεία ο φιλάσθενος, και με υγεία και οι δυο τότε να προχωρούν». (Βλ. π. Δ. Τάτση, Ο Γέροντας Παΐσιος, Κόνιτσα, 1995, σ. 176–178).'
  '22': Ειπώθηκε τον Νοέμβριο του 1990.
  '23': Ο Γέροντας είχε πάει στην Αυστραλία το 1977, μετά από πρόσκληση της Εκκλησίας, για να βοηθήση πνευματικά τους εκεί Έλληνες.
