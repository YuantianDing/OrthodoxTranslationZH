  '[12]':
    ru: Ср.:«О, бездна богатства и премудрости и ведения Божия! Как непостижимы судьбы Его и неисследимы пути Его»(Рим.11:33)!
    cn: 参阅：「深哉，上帝的财富、智慧和知识！祂的判断何等不可测度，祂的道路何等难以寻究！」(罗马书 11:33)
  '[13]':
    ru: Ср.:«телесное упражнение мало полезно, а благочестие на все полезно, имея обетование жизни настоящей и будущей»(1Тим.4:8).
    cn: 参看：「身体操练益处不大，而敬虔对凡事都有益处，因为它有今生和来生的应许」(提摩太前书 4:8)。
  '[14]':
    ru: 'Согласно святоотеческой терминологии, эрос является высшей ступенью любви. (См.: АрхиепископВасилий (Кривошеин). Преподобный Симеон Новый Богослов. М., 1995. С. 313–321.)'
    cn: '根据教父学学术语，厄洛斯是爱的最高阶段。

      （参见：瓦西里总主教（克里沃舍因）。《新神学家圣西缅》。莫斯科，1995年。第313–321页。）'
  '[15]':
    ru: Дословно – киновиаты.
    cn: 逐字地——共生修士。
  '[16]':
    ru: В тексте дословно – пользы.
    cn: 益处
  '[17]':
    ru: Не правда ли, как это точно сказано о многих из нас!
    cn: 可不是吗，这话多么准确地描述了我们许多人！
  '[18]':
    ru: Имеются ввиду печати для просфор, которые вырезают из деревянных заготовок. На Афоне очень многие монахи зарабатывают себе на хлеб именно таким рукоделием.
    cn: 这里指的是普施法饼印章，它们由木材坯料雕刻而成。在阿索斯山，许多修士正是凭借这种手工艺谋生。
  '[19]':
    ru: 'В греческих монастырях в ответ на повеление или просьбу что-либо сделать в знак согласия исполнить послушание принято отвечать «буди благословенно» или «благослови». Кроме того, зачастую в таких случаях, когда на Руси принято говорить «Ангела за трапезой» или «прости», в Греции говорят «благослови». Эта традиция, безусловно, восходит к традиции святоотеческой, согласно которой монах должен знать только два слова: «прости» и «благослови».'
    cn: 在希腊修道院里，为回应做某事的命令或请求，作为同意遵行顺服的标志，习惯上会回答「愿它蒙福」或「求祝福」。此外，通常在这样的情况下，当在罗斯习惯上说「愿天使与你一同用膳」或「请宽恕我」时，在希腊他们会说「求祝福」。这一传统无疑可以追溯到教父的传统，根据该传统，修士只需知道两个词：「请宽恕我」和「求祝福」。
  '[20]':
    ru: Киновия (греч.) – общежительный монастырь. Архимандрит Ефрем долгое время являлся настоятелем афонского монастыря преподобного Филофея Святогорца, куда перешел после смерти своего преподобного Старца.
    cn: 基诺维亚（希腊语）——共同生活修道院。大司祭叶弗列姆长期担任阿索斯山圣菲洛菲·圣山者修道院的院长，他在其圣长老离世后便前往该修道院。
  '[21]':
    ru: 'В Греции для удобства сосредоточения внимания в сердце при занятиях умной молитвой применяются низкие скамейки, на которые и садятся для молитвы (см.: Преподобный Григорий Синаит. Творения. Глава: «О безмолвии и двух образах молитвы». М., 1999. С. 95). Именно за такое согбенное положение тела исихастов при молитве, когда голова преклоняется ко груди, Варлаам издевательски называл в XIV веке сторонников святителя Григория Паламы «омфалопсихами» (от греч. омфалос – пуп, то есть те, у кого душа в пупе).'
    cn: 在希腊，为了便于在心中专注进行心祷时，会使用矮凳，人们就坐在上面祷告（参见：可敬者西奈的格里高利。《著作》。章：《论静默与两种祷告形式》。莫斯科，1999年，第95页）。正是由于隐修士们在祷告时身体的这种弯曲姿势，即头部垂向胸口，巴拉姆在十四世纪嘲讽地称呼圣格里高利·帕拉马的追随者为「脐魂者」（源自希腊语「omphalos」——意为肚脐，也就是指那些灵魂在肚脐里的人）。
  '[22]':
    ru: Ср.:Пс.76:11.
    cn: 参阅：(诗篇 76:11)
