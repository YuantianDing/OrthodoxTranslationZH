  '[26]':
    ru: 'Ср.:«Ибо мы Христово благоухание Богу в спасаемых и в погибающих: для одних запах смертоносный на смерть, а для других запах живительный на жизнь»(2Кор.2:15–16).'
    cn: 参阅：「因为我们是在上帝面前基督的馨香，在蒙拯救的人中间，也在灭亡的人中间：对一些人，是死亡的气息，引向死亡；对另一些人，是生命的气息，引向生命。」（哥林多后书 2:15-16）
  '[27]':
    ru: Катунаки – хижины (греч.) – название одного из афонских скитов.
    cn: 卡图纳基——茅屋（希腊语），是阿索斯山其中一座隐修院的名称。
  '[28]':
    ru: Стасидия – удобная деревянная форма, в которой можно стоять, оперевшись на подлокотники, либо сидеть во время долгих уставных служб.
    cn: 斯塔西迪亚是一种便利的木制结构，在其中，人们可以在漫长的规定义务礼仪期间倚靠扶手站立，或安坐。
  '[29]':
    ru: Ср.:«Повинуйтесь наставникам вашим и будьте покорны, ибо они неусыпно пекутся о душах ваших»(Евр.13:17).
    cn: 参阅：顺从你们的引导者，并要顺服，因为他们为你们的灵魂警醒看顾。(希伯来书 13:17)
  '[30]':
    ru: Било – деревянный или железный брус, ударами в который монахи созываются на молитву.
    cn: 比罗——木制或铁制的梁木，修士们通过敲击它被召集去祷告。
  '[31]':
    ru: Карея – административный центр Афона, место нахождения Протата, органа местного афонского монашеского самоуправления.
    cn: 卡雷亚是阿陀斯山的行政中心，普罗塔顿——这一阿陀斯山地方修道自治机构——的所在地。
  '[32]':
    ru: В этих беседах чувствуется разговорный стиль. Монастырь преподобного Филофея Афонского, где старец Ефрем долгое время был настоятелем, географически действительно находится гораздо ниже скита святого Василия, что и дает ему право говорить «там, наверху».
    cn: 在这些谈话中，能感受到口语化的风格。圣叶夫雷姆长老曾长期担任院长的阿丰山圣菲洛修斯修道院，在地理位置上确实远低于圣瓦西里隐修小室，这也使得他有权说「在那上面」。
  '[33]':
