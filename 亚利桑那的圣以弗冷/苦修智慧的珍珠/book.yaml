- type: heading1
  text:
    ru: Жемчужины подвижнической мудрости. Главы о молитве и послушании
    cn: 修道智慧的珠玑。祷告与顺服诸章。
  children:
  - type: heading2
    text:
      ru: Предисловие переводчика
      cn: 译者前言
    children:
    - type: paragraph
      text:
        ru: Прежде чем начать чтение этого замечательного сборника слов и писем, читателю, вероятно, будет совсем небезынтересно узнать что-нибудь и об их авторе. Но, говоря об отце Ефреме, нельзя не сказать и о его Старце[1], которого он так часто упоминает в своих словах, –Иосифе Исихасте, или Пещернике, как его еще называют. Это – одно из великих имен в современной истории Афона. Можно сказать, что как без преподобногоСимеона Благоговейногоне было бы преподобногоСимеона Нового Богослова, а без него, в свою очередь, и преподобногоНикиты Стифата, так и без старца Иосифа, наверное, не было бы и нынешнего отца Ефрема. Здесь мы видим ту «золотую цепочку» живого святоотеческого предания, о которой так много говорит преподобный Симеон Новый Богослов. «Живую воду» Духа, которую в личном подвиге стяжал старец Иосиф, отец Ефрем, как «совершенный послушник» (см. его «Три слова о послушании»), принял «даром». Как видно из нижеследующих Слов, «даром» вовсе не означает совершенного бездействия со стороны послушника. Скорее наоборот.
        cn: '在开始阅读这部精彩的言论与书信集之前，读者或许会对它们的作者产生浓厚的兴趣，并想对其有所了解。然而，谈及以弗列姆教父时，就不能不提及他的长者[1]，这位教父在他的言论中时常提及的长者——约瑟夫·伊西哈斯特，亦称「洞穴隐士」。这是阿索斯山近代史上最伟大的名字之一。


          可以说，犹如没有圣敬虔者西缅，就不会有圣新神学家西缅；而没有圣新神学家西缅，也就不会有圣尼基塔·斯提法特；同样地，如果没有长者约瑟夫，恐怕也不会有今日的以弗列姆教父。在此我们看到那活生生的教父传承的「黄金链条」，正是圣新神学家西缅常常提及的。长者约瑟夫通过个人苦修所获得的圣灵的「活水」，以弗列姆教父，作为「完美的顺从者」（参见其《论顺从三言》），「白白地」领受了。从以下言论可见，「白白地」绝非意味着顺从者完全无所作为。恰恰相反。'
    - type: paragraph
      text:
        ru: Старец Иосиф Исихаст (1898 – 15.08.1959 †) прибыл на Афон в двадцать три года, полный юношеского максимализма и аскетического рвения, но не нашел там того, чего так пламенно искала его душа. А искала она той пустыни и тех подвигов, о которых повествовали книги древних египетских отцов. Начались годы поисков духоносного старца, уединенного места для сосредоточенной молитвы и чрезвычайных аскетических трудов, которые кажутся просто невероятными для нашего рода. (На протяжении многих лет Старец вкушал пищу всего лишь один раз в день за три часа до захода солнца, и при этом всю трапезу его составляли 75 граммов сухарей.)
        cn: 约瑟夫·伊西哈斯特长老（1898 – 1959年8月15日 †）二十三岁时来到阿索斯山，当时他充满着青年人极致的追求和苦修的热忱，但并未在那里找到他灵魂所热切寻求的。她所寻求的却是古代埃及教父们的书籍中所记载的那样的旷野和那样的苦行。于是，他开始了多年的寻找：寻找一位属灵的长老，一个可以专注祈祷的隐居之地，以及极其艰苦的苦修劳作，这些在我们这个时代看来简直是不可思议的。（在许多年里，这位长老每天只在日落前三小时进食一次，并且他所有的餐食只有75克干面包。）
    - type: paragraph
      text:
        ru: Спустя некоторое время, он встретил своего целожизненного сподвижника – отца Арсения, которому впоследствии и суждено было проводить Старца в жизнь вечную. Наконец был найден и духовник – отец Даниил Исихаст с келии святого Петра, уединеннейшего места афонской «пустыни». Но искушения не оставляли отца Иосифа, и даже усугублялись. Он стойко переносил их и восходил«от силы в силу», и ему также«явился Бог богов»(ср.:Пс.83:8), открывая ему тайны Неба и земли. Постепенно, привлекаемые славой о его подвижнической жизни и замечательной духовной опытности, иноки-афониты устремились к Старцу в поисках духовного назидания, так что за советом к нему стало стекаться множество монахов со всех концов Святой Горы. Тогда отец Иосиф с отцом Арсением решили переехать из скита святого Василия, где они жительствовали, в более уединенное место, подальше от людей, – в Малый скит святой Анны, – на место, где некогда жил кто-то из русских, но к их времени от построек остались лишь одни руины. Сколько труда стоило немолодым монахам – а старец Иосиф уже тогда передвигался с трудом – на диком склоне, фактически на обрыве к морю, на высоте нескольких сот метров отстроить хотя бы что-то похожее на человеческое жилье! Здесь у отца Иосифа собралось то небольшое братство, слава о котором разошлась далеко за пределами Афона. Сюда и приехал к нему из Волоса в 1947 году ревностный девятнадцатилетний юноша, будущий отец Ефрем. Он провел, по собственному выражению, «у ног Старца» двенадцать лет, окреп и окрылился духовно, принял постриг в схиму и священство.
        cn: 一段时间后，他遇见了终生的同修——阿瑟尼长老，后来正是他送这位长者进入了永生。终于也找到了灵性导师——隐修士达尼尔长老，他来自圣彼得小室，那是阿索斯「隐修地」中最清幽的地方。然而，试探并未离开约瑟夫长老，甚至变得更加强烈。他坚定地承受着它们，并且「力上加力」，上帝中的上帝也向他「显现」（参阅：诗篇 83:8），向他揭示天地的奥秘。渐渐地，因着他苦修生活和卓越灵性经验的盛名，阿索斯修士们纷纷涌向这位长者寻求灵性教导，于是，整个圣山的许多修士都前来向他求取建议。于是，约瑟夫长老和阿瑟尼长老决定从他们曾居住的圣瓦西里小隐修院搬离，到一个更隐秘、远离人群的地方——圣安娜小隐修院。那里曾有俄罗斯人居住过，但到他们的时候，建筑物只剩下了一片废墟。对于这两位不再年轻的修士来说——当时的约瑟夫长老已经行动不便了——那是何等的艰辛啊，要在险峻的山坡上，实际上是几百米高的悬崖边，紧邻大海，重建出哪怕是一点点像样的住处！在这里，约瑟夫长老身边聚集了那个小小的修士团体，它的盛名远播阿索斯之外。1947年，一位热忱的十九岁青年从沃洛斯来到他这里，他就是未来的以法莲长老。他用自己的话说，在「长者膝下」度过了十二年，在灵性上得以坚固并生出翅膀，接受了大圣修道袍的授服并领受了神职。
    - type: paragraph
      text:
        ru: 'О напряженности духовного подвига в пустыне остались некоторые свидетельства учеников Старца. Вот взять хотя бы первую фразу из третьего Слова отца Ефрема о молитве: «Когда мы были в пустыне, наше бдение начиналось с заходом солнца и продолжалось до самых утренних часов».'
        cn: 关于老者门徒们在旷野中灵修苦行的艰辛，留下了一些见证。就拿埃弗雷姆教父论祷告的第三篇论述中的第一句话来说吧：「当我们在旷野时，我们的守夜从日落开始，一直持续到清晨时分。」
    - type: paragraph
      text:
        ru: 'А вот свидетельство другого ученика Старца, монаха Иосифа из монастыря Ватопед: «До полудня мы трудились в том, что необходимо было сделать. Потом останавливались и совершали вечерню наедине по четкам или еще и читали немного. Потом собирались на обед, или, скорее, на ужин. Затем мы брали благословение у Старца и уходили спать по келиям. После отдыха мы готовили то, что было нужно на завтра, и расходились по своим келиям для молитвы и бдения до полуночи. Если должна была быть Литургия, то совершалась она после полуночи. Если же нет, то было чтение духовной литературы. Нам, молодым, в этот час разрешалось посещать Старца, чтобы поведать ему свои помыслы и услышать его советы».'
        cn: '还有以下是长老的另一位门徒——瓦托佩迪修道院的修士约瑟夫的见证：


          「直到中午，我们劳作于那些必须做的事情。然后停下来，独自用念珠做晚祷，或者再读一点。之后我们聚餐，或者，更确切地说，是晚餐。接着，我们从长老那里领受祝福，然后各自回修行室睡觉。休息之后，我们准备好第二天需要的东西，然后各自回修行室祷告和守夜，直到午夜。如果要举行神圣礼仪，那就在午夜之后举行。如果没有，则会阅读属灵书籍。在这个时刻，我们这些年轻人获准拜访长老，向他倾诉自己的思虑，并听取他的建议。」'
    - type: paragraph
      text:
        ru: 'Надо сказать, что молитва была главным занятием членов братства Старца. Ей посвящалось самое плодотворное время суток – первые ночные часы. Режим на келии был построен таким образом: все работы бытового плана производились с утра до полудня. Потом служили вечерню по келиям. Каждый совершал ее самостоятельно по четкам. К этому добавлялось немного духовного чтения. Затем собирались на обед, или, как пишет отец Иосиф, скорее, на ужин. Взяв благословение у Старца, все расходились по келиям для сна, так как предстояла ночь молитвы. Таким образом, братия ложилась отдыхать еще днем, во второй его половине. Незадолго до захода солнца они вставали, приготовляли то, что требовалось на следующий день, и снова расходились по келиям для бдения до полуночи.'
        cn: 必须指出的是，祷告是长老修道团成员们的主要事务。他们将一天中最有益的时段——夜间初更时分——奉献给祷告。小室内的作息安排是这样的：所有日常事务都在上午进行。随后，他们在各自的小室里诵读晚课。每个人都独自手持念珠进行。在此之上，还会进行少量灵修阅读。接着，他们集合用餐，或者，正如约瑟夫神父所写，更确切地说，是晚餐。领受了长老的降福后，众人便各自回到小室休息，因为祷告之夜即将来临。因此，弟兄们尚在白天，在下午时分便躺下休息。日落前不久，他们便起身，预备好翌日所需，并再次回到小室，守夜直到午夜。
    - type: paragraph
      text:
        ru: 'Здесь, впрочем, необходимо сделать одну оговорку. На Афоне время отсчитывают по византийской традиции. Эта система очень удобна для монахов. А состоит она в следующем. Прежде всего сутки начинаются с вечера. Это библейская традиция, которая утвердилась в христианской Церкви[2]. Сутки делятся на две равные части: ночь и день. Сутки начинаются ночью, то есть с захода солнца, а заканчиваются днем, то есть тоже заходом солнца. Заход солнца является отправной точкой для исчисления времени. Прошло два часа после захода солнца? Значит, сейчас два часа ночи. Независимо от времени года и астрономической долготы дня и ночи, день и ночь, как считается по этой системе, имеют двенадцать часов. К примеру, летом солнце по византийскому времени может вставать в восемь часов ночи, то есть через восемь часов после своего захода. А зимой – в два часа дня, то есть через четырнадцать часов после захода.'
        cn: 不过，这里有必要说明一点。在阿索斯山，时间是按照拜占庭传统计算的。这种体系对修士们来说非常方便。它的构成如下。首先，一天从傍晚开始。这是圣经传统，在基督教会中得以确立[2]。一天分为两个相等的部分：夜晚和白天。一天从夜晚开始，也就是说从日落时分开始，并在白天结束，也就是说也是在日落时分结束。日落是时间计算的起点。日落之后过去了两个小时？那么，现在就是夜里两点。无论季节如何，也无论昼夜在天文上的长短如何，按照这种体系，白天和夜晚都被认为是十二小时。举例来说，夏天，按照拜占庭时间，太阳可能在夜里八点升起，也就是说在日落之后八个小时。而冬天则在白天两点升起，也就是说在日落之后十四个小时。
    - type: paragraph
      text:
        ru: 'Устав братства старца Иосифа был очень строгим. По свидетельству учеников Старца, Великим постом с понедельника по пятницу на келии устанавливалось правило молчания. Никто не имел права разговаривать, а нужное объяснялось знаками. Даже когда Старец посылал братий за послушание сходить по какой-либо нужде в монастырь или скит, то и там им не разрешалось промолвить даже слова. Епитимья за преслушание составляла двести-триста земных поклонов. Однако вся внешняя строгость покрывалась удивительной любовью Старца, который по ночам, после исполнения братиями келейного правила, принимал у них откровение помыслов и давал необходимые советы. Среди братии было двое иеромонахов, и Литургию они совершали каждый день: старец Иосиф не мыслил себя без Литургии и причащался за каждой службой.'
        cn: 约瑟夫长老弟兄会的规章非常严格。根据长老门徒们的见证，大斋期内，小室从周一到周五都实行静默的规矩。任何人无权交谈，需要表达的则用手势解释。即使长老派遣弟兄们为着顺从去修道院或隐修院办理一些事务，在那里他们也不被允许说一句话。因着违命所受的苦修是两三百个大作揖。然而，所有的外在严厉都被长老奇妙的爱所覆盖，他在夜间，在弟兄们完成小室规矩之后，接受他们的思想坦露，并给予必要的建议。在弟兄们中间有两位修士司祭，他们每天都举行事奉圣礼：约瑟夫长老不能想象自己没有事奉圣礼，并且在每次礼仪中领受圣体。
    - type: paragraph
      text:
        ru: Место их жительства отличалось суровым климатом, и практически все братство заболело. Они были вынуждены переехать, и их очередным временным прибежищем стал Новый скит, который находится у самого моря и славится своим мягким микроклиматом. Там их ждали новые строительные работы. Там же старец Иосиф и закончил свою земную жизнь – в самый день Успения Пресвятой Богородицы, Которая явила ему так много Своих заступлений на его жизненном пути и к Которой он питал удивительную любовь и благоговение. В Новом скиту старец Иосиф был и похоронен. Теперь частицы его мощей, как еще не прославленного, но широко почитаемого на Афоне святого, находятся в разных монастырях Святой Горы[3].
        cn: 他们居住的地方气候严酷，几乎整个修士团体都病了。他们被迫搬迁，他们下一个临时的避难所是新隐修院，它坐落在海边，以其温和的微气候而闻名。在那里，有新的建筑工程等着他们。也是在那里，长老约瑟夫结束了他的尘世生命——就在至圣圣母安息日当天。圣母在他的生命旅程中向他显明了如此多的代祷，而他对她怀有惊人的爱和敬畏。长老约瑟夫也葬在新隐修院。如今，他的部分圣髑，作为一个尚未被正教会册封但在阿索斯山上广受尊敬的圣人，分布在圣山各处的修道院中[3]。
    - type: paragraph
      text:
        ru: Ученик же его, отец Ефрем, стал старцем на келии Благовещения, также относившейся к Новому скиту. Впоследствии он перешел в монастырь преподобного Филофея Афонского, где был избран игуменом. Ныне он живет в Соединенных Штатах, где ревностно проповедует слово Божие и уже открыл несколько монастырей, в которых является духовником. Братия Филофея принимают своего старца на один месяц каждый год, когда он приезжает из-за океана. Монастырь их тогда наполняется монахами-святогорцами, которые приходят за советом и благословением отца Ефрема.
        cn: 他的门徒，叶弗列姆神父，成为了圣母领报小室的长老，该小室也隶属于新隐修院。后来他转入阿丰山圣菲洛费修道院，并在那里被选为院长。如今他居住在美国，热忱地宣讲上帝的圣言，并且已经创立了数座修道院，他在这些修道院中担任神师。圣菲洛费修道院的修士们每年接待他们的长老一个月，当他从海外归来时。那时他们的修道院便挤满了阿丰山修士们，他们前来寻求叶弗列姆神父的建议和祝福。
    - type: paragraph
      text:
        ru: Настоящая брошюра является переводом части сборника слов и писем старца Ефрема, который братия обители преподобного Филофея составила и издала под общим названием «Отеческие советы». Большая часть этих слов и писем отца Ефрема, адресованных его духовным чадам, на русском языке публикуется впервые. Верю, что они дадут читателям глоток той «живой воды» Святаго Духа, которую сам отец Ефрем, как я глубоко убежден, носит в своем сердце.
        cn: 本册小册子是厄弗仑长老言论和书信文集的一部分译文，该文集由圣斐洛提修道院的修士们编纂并出版，总题为《教父的建议》。厄弗仑神父的这些言论和书信，其中大部分是写给他属灵的子女们的，是首次以俄语出版。我相信，它们会带给读者一口圣灵的「活水」，这「活水」是厄弗仑神父本人，我深信，他心中所怀有的。
  - type: heading2
    text:
      ru: О духовном трезвении и молитве
      cn: 论属灵的警醒与祷告
    children: []
  - type: heading2
    text:
      ru: О трезвении[4]
      cn: 论警醒[4]
    children:
    - type: paragraph
      text:
        ru: '1'
        cn: '1'
    - type: paragraph
      text:
        ru: Времени мало, и неизвестно, когда оно иссякнет. Поэтому будем подвизаться и внимать себе и изгонять с гневом и сильной молитвой всякий плохой помысл. Если же прольем и слезы, то получим большую пользу, потому что слезы очищают душу и паче снега всю ее убеляют. Станем мужественно, потому что брань наша против сил тьмы, которые никогда не становятся на нашу сторону, никогда не ослабляют своих атак. Посему восстанем и мы и не будем предаваться дреме, потому что перед нами опасность, ценой в вечную жизнь. Если проиграем, то потеряем свою душу, лишимся вечного наслаждения и радости в Боге и будем осуждены на вторую смерть, которая есть вечное отлучение от Бога, чего да не будет.
        cn: 时日无多，且不知何时耗尽。故当奋力争战，谨慎自守，并以愤然之心和强力祷告，驱逐一切恶念。倘若倾流泪水，便能获益良多，因泪水洁净灵魂，且比雪更甚，将其全然洁白。当勇敢站立，因我们的争战是对抗幽暗权势，它们永不与我方同盟，永不减弱其攻势。故此，我们也当奋起，不可沉溺于昏睡，因摆在我们面前的乃是危险，其代价乃是永生。若我们失败，便会丧失自己的灵魂，失去在上帝里那永恒的喜乐与愉悦，并被判入第二次死亡，那就是永远与上帝隔绝，愿此永不发生。
    - type: paragraph
      text:
        ru: 'Трезвясь же, будем бдеть над помыслами, потому что начало падений – от помыслов. Итак, начало помыслов будем поборать мужественно и не будем позволять им из-за нашего нерадения утвердиться в нас, но сразу по их пришествии изгоним мечтание и разгневаемся на них, взяв меч духовный, который есть слово Божие, то есть:Господи, Иисусе Христе, помилуй мя[5]. Когда же мы взываем к сладкому Иисусу, Он сразу приходит к нам на помощь и демоны тут же удаляются. Но будем молиться не нерадиво, а горя духом, из глубины взывая: «Наставник! Спаси меня, погибаю» (см.:Лк.8:24). Труд небольшой, если мы вначале предпринимаем подвиг. Если же мы оставим помыслы и они укрепятся, тогда труден подвиг, тогда часто мы терпим поражение и получаем раны. Но когда мы восстанем и воззовем, тогда снова приходит добрый Кормчий Иисус и ведет наш корабль в тихую и безоблачную пристань.'
        cn: 警醒地，我们要看顾意念，因为堕落的开端源于意念。于是，我们要勇敢地抵御意念的开端，并且不要因我们的懈怠而允许它们在我们里面立足，而要它们一来到，就立刻驱逐幻想，并要对它们发怒，拿起属灵的宝剑，这宝剑就是上帝的圣言，即是说：主耶稣基督，求祢怜悯我[5]。当我们呼求甘甜的耶稣时，他立刻来到我们身边帮助我们，并且魔鬼随即退去。但我们祷告不要懈怠，而要灵里火热，从深处呼喊：「导师！救我，我丧命了！」（参：路加福音 8:24）。如果我们一开始就投入苦修，这劳苦不算大。但如果我们任凭意念，让它们在我们里面壮大，那么苦修就变得艰难了，我们常常遭受失败并受到创伤。但当我们重新振作并呼求时，那么良善的舵手耶稣又会再次来到，引导我们的船只驶向平静无云的港湾。
    - type: paragraph
      text:
        ru: Благодаря помыслу мы оскверняемся и благодаря помыслу же становимся лучше, преуспеваем. Поэтому поставим в сердце своем бесстрашного стража – ум, то есть внимание с оружием мужества, молитвы, молчания и самоукорения. Если будем так подвизаться, то в результате получим сладкий мир, радость, чистоту, любомудрие духовное, молитву, которая, как благовонный фимиам, будет возноситься в храме Божием – во внутреннем человеке.«Разве не знаете, – говорит апостол Павел, –что вы храм Божий, и Дух Божий живет в вас»(1Кор.3:16)? Я пишу это, дабы воздвигнуть ваши души к духовному трезвению, чтобы вы нашли внутренний мир Божий к своей же радости. Аминь, буди.
        cn: 借着意念我们被玷污，也借着意念我们变得更好，有所长进。因此，让我们在心中设立一个无畏的守卫——心智，也就是带着勇气、祷告、静默和自我谴责之武器的警醒。如果我们如此修持，那么我们就会得到甘甜的平安、喜乐、洁净、属灵的爱智，以及如同馨香之香升腾于上帝的殿宇——我们内在之人——中的祷告。「难道你们不知道吗，」使徒保罗说，「你们是上帝的殿，上帝的灵住在你们里面吗？」（哥林多前书 3:16）。我写下这些，是为了唤醒你们的灵魂进入属灵的警醒，好让你们找到内在的上帝的平安，以致你们自己得享喜乐。阿们，愿成就。
    - type: paragraph
      text:
        ru: '2'
        cn: '2'
    - type: paragraph
      text:
        ru: Будем подвизаться по силам в посте телесном. В посте же чувств, ума и сердца всеми силами будем бороться с врагом нашей души. Храни, чадо мое, свои чувства и особенно глаза. Глаза – это щупальца осьминога, которые хватают все, что движется перед ними. Они легче всего схватывают греховную добычу. Из-за глаз пали духовные столпы и погибли. Давид, будучи небрежным в обращении с глазами, соделал убийство и прелюбодейство, хотя был великим пророком Божиим, имел благодать и дар провидения.
        cn: 让我们量力而行，在肉身斋戒上刻苦修行。然而，在感官、心智和心灵的斋戒上，我们当竭尽全力，与我们灵魂的仇敌争战。我的孩子，保守你的感官，尤其是你的眼睛。眼睛是章鱼的触手，它们抓住所有在它们面前移动的东西。它们最容易抓住罪恶的猎物。因为眼睛，属灵的柱石都堕落并灭亡了。大卫因疏于管束自己的眼睛，犯下了谋杀和奸淫，尽管他曾是上帝伟大的先知，拥有恩典和先见的恩赐。
    - type: paragraph
      text:
        ru: Поскольку, чадо мое, ты находишься посреди различных греховных причин, то береги чувства, особенно же ум, этого кормчего, «бесстыднейшую птицу», по авве Исааку. Ум входит в тайные дела ближнего. Он мерзкий художник, когда изображает постыдное. Поэтому любой ценой старайся сохранить его чистым, изгоняя любой помысл и греховное мечтание с помощью сильной молитвы и гнева:«Гневаясь, не согрешайте»(Еф.4:26).
        cn: 既然，我的孩子，你身处各种罪恶缘由之中，那么要保守感官，尤其是理智，这位舵手，根据阿爸伊撒格的话，它是「最无耻的飞禽」。理智窥探邻人的隐秘之事。当它描绘可耻之事时，它是个卑劣的画师。因此，不惜一切代价务必努力保持它的洁净，藉着强烈的祷告和义怒驱逐一切意念和罪恶幻想：「发怒却不要犯罪」(以弗所书 4:26)。
    - type: paragraph
      text:
        ru: '3'
        cn: '3'
    - type: paragraph
      text:
        ru: Непрестанно бодрствуйте в хранении ума, потому что от усердия или небрежности зависят жизнь и смерть бессмертной души.
        cn: 不住地警醒，看守心神，因为不朽灵魂的生与死，维系于殷勤或疏忽。
    - type: paragraph
      text:
        ru: Все начинается с воображательной части ума. Нет такого греха или такой добродетели, которые бы не имели своим началом и отправной точкой воображательную часть ума. Следовательно, доброе хранение этого умного начала достигает святой цели спасения.
        cn: 一切都始于心智的想象部分。没有一种罪恶或一种美德，不是以心智的想象部分作为其开端和起点。因此，妥善守护这个心智的开端，就能达到救赎的圣善目标。
    - type: paragraph
      text:
        ru: 'Духовное трезвение в своем главном значении является вот чем: хранением ума чистым от страстных фантазий и противоборством любому нападению диавола с помощью имени Иисуса и слова противоречия.'
        cn: 灵性清醒，其主要意义在于：保持心智免受情欲幻想的侵扰，并借着耶稣的圣名和抗拒之言，抵御魔鬼的任何攻击。
    - type: paragraph
      text:
        ru: Без трезвения недостижимо очищение души и тела, а без этого и Бог не может быть видим в чувстве ума и сердца.
        cn: 若无警醒，灵魂与身体的洁净便不可企及；而若无此，上帝亦无法在心智与心灵的感知中被看见。
    - type: paragraph
      text:
        ru: Если Господь не посещает душу человека, то он все еще пребывает во тьме греха. Мы же, монахи и посвятившие себя святой цели достижения внутреннего очищения по Христу – очищения от страстей, должны хорошенько вызубрить важнейший урок трезвения, благодаря которому приблизимся к Богу в чувстве сердца.
        cn: 如果上帝不眷顾人的灵魂，那么他仍旧身陷于罪恶的黑暗中。而我们，修士，以及那些献身于按照基督之道达致内在洁净——即脱离情欲的洁净——这一神圣宗旨的人，务必牢记那最重要之警醒的功课，借此我们将在内心感受中亲近上帝。
    - type: paragraph
      text:
        ru: Этой спасительнейшей науке, то есть трезвению, освящающему человека, диавол сильно противится и употребляет все средства, чтобы воспрепятствовать трезвению, творя соблазны и нашествия различных помыслов.
        cn: 魔鬼极力抵挡这最能使人得救的学问，即那使人成圣的警醒，并用尽一切手段来阻碍警醒，制造诱惑和各样念头的侵袭。
    - type: paragraph
      text:
        ru: Но и мы сами должны во что бы то ни стало отразить это, чтобы достичь вознаграждения внутреннего очищения и быть увенчанными от Подвигоположника Христа Бога нашего. Не бойтесь сатанинских нападок нашего общего врага, но подвизайтесь с мужеством и надеждой на Господа, Который не допускает искушений, превосходящих наши силы.
        cn: 但我们自己也必须不惜一切代价反映它，为了获得内心洁净的奖赏，并由我们的竞赛之发起者基督上帝为我们加冕。不要惧怕我们共同的敌人撒旦的攻击，但要以勇气和对上主的希望来奋力争战，祂不会允许超出我们力量的试探。
    - type: paragraph
      text:
        ru: Итак, дерзайте, чада мои, и шествуйте со сладкой надеждой на Христа и на могущественный покров Божией Матери, и я верю непоколебимо, что мы сподобимся вечной жизни со всеми добре подвизавшимися и получим венцы в торжествующей на Небесах Церкви. Аминь, буди.
        cn: Итак，我的孩子们，要勇敢，并怀着对基督的甜蜜盼望以及对圣母大能庇护的仰赖前行。我坚定不移地相信，我们将与所有善于争战之人一道蒙受永生，并在天上凯旋的教会中获得冠冕。阿们，愿其成就。
    - type: paragraph
      text:
        ru: '4'
        cn: '4'
    - type: paragraph
      text:
        ru: 'Один святой изгонял демонов, и те его боялись. Его послушник задал ему вопрос:'
        cn: 一位圣人驱逐魔鬼，魔鬼都害怕他。他的初学修士问了他一个问题：
    - type: paragraph
      text:
        ru: – Старче, почему демоны тебя боятся?
        cn: 长老，为什么邪魔畏惧你？
    - type: paragraph
      text:
        ru: – Чадо, вот что я тебе скажу, – отвечал старец, – у меня была плотская брань в уме, в помыслах, но я никогда не позволял себе уступить помыслам. Всегда я вел войну таким образом, чтобы фронт проходил в районе прилога, и никогда не позволял диаволу пробиться дальше прилога[6]. И поскольку брань была непрерывной, то Бог дал мне это благословение, эту благодать, несмотря на все мое недостоинство, чтобы демоны боялись меня и исходили.
        cn: ——孩子，我要对你说的是，——长老回答道，——我曾有过肉体的争战，在心智中，在意念中，但我从未允许自己屈从于意念。我总是以这样的方式进行争战，好让战线维持在引诱的阶段，也从未允许魔鬼突破引诱的阶段[6]。又因为这场争战是持续不断的，上帝便赐予我这份祝福，这份恩典，尽管我如此不配，以致鬼魔都惧怕我并离开。
    - type: paragraph
      text:
        ru: Подумайте, он отсекал искушение еще за дверью, как только оно начинало стучать в дверь. Почему он не открывал ему дверь? Что было у него внутри и препятствовало искушению? У него были святые воспоминания. Они занимали его ум. Искушение стучало снаружи, желая войти, но не было места, чтобы искушение вошло внутрь, его останавливала память Божия. Эта постоянная победа дала такую благодать святому, что демоны боялись его и выходили из людей.
        cn: 你们想想看，他还在门外就杜绝了试探，只要它一开始敲门。他为什么不给它开门呢？他内心有什么阻碍着试探呢？他拥有圣洁的记忆。这些记忆占据了他的思想。试探在外面敲门，渴望进来，但试探没有地方可以进入他的里面，它被上帝的忆念所阻止。这种持续不断的胜利赐予了这位圣人如此大的恩典，以至于恶魔们都畏惧他，并从人身上出来。
    - type: paragraph
      text:
        ru: Великая похвала тому человеку, который по благодати Божией достиг того, чтобы удерживать диавола на расстоянии прилога.
        cn: 极大的赞美归于那人，他靠着上帝的恩典，达到了能够将魔鬼抵挡在初次意念之外的地步。
    - type: paragraph
      text:
        ru: Нет ни одного смертного, ни одного духовного человека и подвижника, который не был бы подвержен прилогам диавола. То есть каждый человек подвержен искушению. Если у тебя открыты окна и двери, как бывает с мирскими, которые не имеют ведения Бога, тогда враг преуспевает и побеждает.
        cn: 没有一个凡人，没有一个属灵人，也没有一个苦修者，是不受魔鬼引诱的。也就是说，每个人都会受试探。如果你的窗户和门都开着，就像世俗之人那样，他们没有对上帝的认识，那么仇敌就会得逞并获胜。
    - type: paragraph
      text:
        ru: Духовные люди подвизаются, чтобы не открыть врагу ни двери, ни окна, ни щели.
        cn: 属灵之人刻苦修持，为的是不给仇敌打开任何门、窗，甚至是一条缝隙。
    - type: paragraph
      text:
        ru: Грех на деле, тот, который происходит не в сердце, а через уста или выражается в каком-либо действии, часто трудноисполним, потому что многое должно поспособствовать для его совершения. Но грех в уме очень легок. Человек может его совершить на любом месте и в любое время, и о нем не узнает никто. Внешнее действие часто не может произойти и потому, что для этого требуется стечение многих обстоятельств, и потому, что этому препятствует стыд. Напротив же, внутренний грех, грех в мысли, может убедить человека согрешить внутренне и остаться незамеченным.
        cn: 行为之罪，即并非发生在心中，而是通过口舌或表现为某种行动的罪，往往难以实行，因为其发生需要许多条件的促成。但意念之罪却非常容易。人可以在任何地方和任何时候犯下它，且无人知晓。外在的行为常常无法发生，一方面是因为这需要许多环境条件的汇聚，另一方面则是因为羞耻心会阻碍它。相反地，内在之罪，即意念之罪，能够使人内心犯罪，并且不被察觉。
    - type: paragraph
      text:
        ru: Этот внутренний грех незаметен. Его не видят люди, но видит Бог. И если мы не боимся людей и не стыдимся, потому что этот грех невидим для них, то должны бояться Бога, потому что это мысленное нравственное преступление происходит перед Ним.
        cn: 这个内在的罪是隐蔽的。世人看不见它，但上帝看得见。若是我们不畏惧世人，也不感到羞耻，因为这个罪对他们而言是看不见的，那么我们就应当畏惧上帝，因为这种思想上的道德犯罪是在祂面前发生的。
    - type: paragraph
      text:
        ru: Многие люди обмануты своим эгоизмом, благодаря которому происходит грех.
        cn: 许多人被自己的利己主义所蒙蔽，罪就因此而产生。
    - type: paragraph
      text:
        ru: Сначала происходит внутреннее предательство, и потом оно уже обнаруживается посредством членов тела.
        cn: 首先发生的是内在的背叛，然后它便借着肢体显露出来。
    - type: paragraph
      text:
        ru: Поэтому необходимо усиленное и непрестанное внимание, усиленное трезвение, как уже сказано нами. Внутри нас должен стоять страж и часовой, который бы следил за входящими и исходящими помыслами, опознавал их, чтобы внутрь не пробрались шпионы и не разожгли в государстве души междуусобную войну.
        cn: 因此，正如我们已经说过，有必要加倍的持续警醒，加倍的醒悟。在我们之内，应当有守卫和哨兵站岗，密切留意进出之意念，辨明它们，以免有奸细潜入，并在灵魂的国度里挑起内战。
    - type: paragraph
      text:
        ru: Душевному оку необходимо быть чистым и иметь сильное зрение, издалека замечать врага и принимать соответствующие меры.
        cn: 灵魂的眼睛需要是纯洁的，并拥有敏锐的视力，能从远处察觉仇敌并采取相应的措施。
    - type: paragraph
      text:
        ru: 'Сколько помыслов нападает на нас постоянно! Очень много. Помыслы каждой страсти. И если душа обладает хорошим зрением, то еще издалека чинит помыслам препятствия. По «запаху» она определяет, что страсть должна восстать, и тут же начинает подготовку: расставляет часовых, воздвигает земляные валы и приходит в готовность отразить атаку страсти.'
        cn: 有多少意念持续不断地攻击我们！非常多。它们是每一种情欲的意念。如果灵魂拥有敏锐的眼光，它就能从很远处就为意念设置障碍。它凭着「气味」辨别出情欲即将兴起，并立刻开始准备：布置哨兵，修筑土垒，并准备好抵挡情欲的攻击。
    - type: paragraph
      text:
        ru: Люди попадают в плен. Страсть похожа на змею, у которой внутри яд. Бывают большие змеи, которые дуют, и это ядовитое дуновение отравляет все, что находится поблизости. После этого они проглатывают свою добычу. Так же поступает и змея греха. Издалека она расточает яд-наслаждение и парализует ум, парализует силы. Человек попадает в рабство страсти и невольно влечется ко злу.
        cn: 人们被掳。情欲像一条内藏毒液的蛇。有些巨蟒会喷吐毒气，而这有毒的吐息毒害了周遭的一切。之后它们便吞噬自己的猎物。罪恶之蛇也同样如此。它从远处散播享乐之毒，麻痹心智，麻痹力量。人便沦为情欲的奴隶，不由自主地被恶所牵引。
    - type: paragraph
      text:
        ru: 'Люди, оказывающиеся в таком положении, свидетельствуют следующее: «В это время я не могу сопротивляться, не могу ничего поделать». Ответ на это таков: должны быть предприняты соответствующие меры, чтобы дело не дошло до пленения и разоружения ума и сердца. Исходя из опыта, как только умный змий начнет расточать свой яд, еще издалека, прежде чем он дойдет до нас и отравит душу, мы должны предпринять меры для избежания опасности. Потому что после отравления мы уже ничего не сможем сделать.'
        cn: 处于这种境地的人们如此见证：「在这种时候，我无法抵抗，什么也做不了。」对此的回答是：必须采取相应的措施，以免心灵和思想被俘虏和解除武装。根据经验，一旦那狡猾的毒蛇开始散布它的毒液，尚在远处，在它来到我们身边并毒害灵魂之前，我们就必须采取措施来规避危险。因为中毒之后，我们就什么也做不了了。
    - type: paragraph
      text:
        ru: Когда человек будет побежден греховными помыслами и уступит воображению, то отсюда, от воображения, и все зло! И когда он претерпит в уме множество духовных крушений и множество раз будет ранен сластолюбивыми мечтаниями, тогда, как только сатана снова придет с подобными мечтаниями, как только принесет их уму, он сразу пленяется ими. Поэтому монах не должен уступать, чтобы мечтания и страсти не усилились и не окрепли.
        cn: 当人被罪恶的意念所战胜，并屈从于想象时，那么，所有的邪恶都源于此，源于这想象！当他在心神中经历无数次属灵的挫败，并无数次被耽于享乐的幻想所伤时，那么，一旦撒旦再次带着类似的幻想前来，一旦将它们带到心神中，他就会立刻被它们俘虏。因此，修士不应屈服，以免幻想和情欲滋长并变得强固。
    - type: paragraph
      text:
        ru: '5'
        cn: '5'
    - type: paragraph
      text:
        ru: Пусть очи твоей души будут бдительны и хранят чувства как тела, главным образом глаза, так и души, особенно же ум, – от рассеяния, потому что через чувства входят ядовитые микробы духовных болезней, и со временем невнимательный христианин приобретает множество болезней и теряет бесценное здоровье своей бессмертной души.
        cn: 愿你灵魂的眼睛保持警醒，并看守好感官——无论是身体的感官，主要是眼睛，还是灵魂的感官，尤其是心智——免于散漫，因为有毒的灵魂疾病微生物会经由感官侵入，久而久之，不留心的基督徒会染上许多疾病，并失去他那不朽灵魂的无价健康。
    - type: paragraph
      text:
        ru: '6'
        cn: '6'
    - type: paragraph
      text:
        ru: 'Подвизайся, чадо мое, добрым подвигом, ведущим к вечной жизни. Положи доброе начало, чтобы приобрести наилучший конец. Ум свой пригвозди к памяти Иисус-Христовой, и Он станет для тебя всем: радостью и миром, скорбью и обилием животочных слез, которые сделают твою душу белее снега и легче облака.'
        cn: 我的孩子，你要竭力从事那引向永生的美好善工。打下美好的开端，好叫你获得最佳的结局。将你的心智钉在对耶稣基督的记念上，祂将成为你的一切：喜乐与平安，悲伤和充沛的活水之泪，这些泪水将使你的灵魂比雪更白，比云更轻。
    - type: paragraph
      text:
        ru: 'Чадо мое, когда ты молчишь и творишь молитву со вниманием, то есть когда ум следит за молитвой, не переходя к чему-либо другому, кроме молитвы, тогда твой ум начинает приближаться к сладости Иисусовой. Если всегда будешь себя смирять, то это принесет тебе огромную пользу. Непрестанно ругай себя и никогда не оправдывай. Это значит: при любом искушении и в любом деле почитай брата правым и говори, что ошибаешься всегда ты. Это называется смирением.'
        cn: 我的孩子，当你静默并专心作祷告时，也就是说，当你的心神专注于祷告，不转向祷告之外的任何事物时，你的心神便开始趋近于耶稣的甘甜。如果你常常谦卑自己，这会为你带来巨大的益处。不断地责备自己，永不为自己辩护。这意味着：在任何诱惑和任何事务中，都要认为你的弟兄是对的，并说错的永远是你。这即是谦卑。
    - type: paragraph
      text:
        ru: '7'
        cn: '7'
    - type: paragraph
      text:
        ru: Чадо мое, будь осторожен с мечтаниями и греховными помыслами. Все заключается в помысле. Поставь стража в уме, чтобы он не позволял безнравственным картинкам входить в воображательную часть ума. Иначе сразу рождается опасность, что душа согрешит и опечалит Того, Который ради всех нас был распят на бесчестном тогда древе, а теперь Честном Кресте.
        cn: 我的孩子，要谨慎虚妄的幻想和罪恶的念头。一切都在于念头。在心智中设立一个守卫，以免它允许不道德的画面进入心智的想象领域。否则，立刻就有危险，灵魂会犯罪并使那位忧伤——祂为了我们所有人，被钉死在当时那受辱的木头上，而如今却是可敬的十字架上。
    - type: paragraph
      text:
        ru: Душевное прелюбодейство происходит очень легко, если мы позволяем постыдным помыслам и подобным мечтаниям господствовать внутри нас. Это не что иное, как душевное прелюбодейство.
        cn: 心灵的奸淫轻而易举地发生，如果我们任凭可耻的意念和那样的幻想在我们内心辖制。这无非就是心灵的奸淫。
    - type: paragraph
      text:
        ru: Чадо мое, если ты желаешь победить демона блуда, то будь осторожен с глазами. Также в немалой степени опасно рассматривать неподобающие изображения, газеты, журналы и тому подобное.
        cn: 我儿，如果你渴望战胜淫欲的魔鬼，就当谨慎你的双眼。同样地，观看不合宜的图像、报纸、杂志以及诸如此类的事物，也危害甚大。
    - type: paragraph
      text:
        ru: '8'
        cn: '8'
    - type: paragraph
      text:
        ru: Величайшаяцерковь, где с радостью поселяется Бог, это та, которую Он весьма искусно сотворил собственными руками, – наше всецелое бытие, наша душа, когда она чиста.
        cn: 最伟大的教会，上帝欣然居于其中，就是祂以无比的巧思亲手创造的——我们的整个存在，我们洁净的灵魂。
    - type: paragraph
      text:
        ru: Сердечная чистота состоит в свободе ума от плохих мыслей, от которых проистекают дурные и страстные чувства, приносящие телу страстные взыграния, благодаря которым и душа, и тело оскверняются и оба в одинаковой мере теряют чистоту и непорочность.
        cn: 心灵的纯净在于心意脱离恶念，由此产生邪恶和情欲性的情感，给身体带来情欲的骚动，通过这些，灵魂和身体都受到玷污，并且二者都同样失去纯洁和贞洁。
    - type: paragraph
      text:
        ru: Первоначальная плохая и страстная мысль, а прежде ее страстное мечтание, является источником всех видов греха. Ни одно прегрешение не происходит на деле, если ему не предшествует посредством мечтания плохая мысль.
        cn: 一切罪恶的根源，是最初的恶劣而情欲的念头，在此念头之前，更有情欲的幻想。任何罪过都不会付诸行动，除非有恶念借由幻想先行。
    - type: paragraph
      text:
        ru: Стало быть, чтобы достигнуть величайшего из благ – действительной чистоты, нужно очистить свой ум от греховных мечтаний и мыслей. Только так приобретается чистота на прочном основании.
        cn: 因此，为要达到至高的福祉——真实的洁净，就必须洁净自己的心思，除去罪恶的幻想与意念。唯有如此，洁净方能建立在坚实的基础上。
    - type: paragraph
      text:
        ru: Если мы желаем прекратить дурные дела, не заботясь о внутренних помыслах, то трудимся напрасно. Когда позаботимся о чистоте своей души, тогда вселится в нее Бог славы, и она станет святым и великолепным Его храмом, благоухающим фимиамом непрестанной к Нему молитвы.
        cn: 如果我们希望终止恶事，却不顾及内心的意念，那么我们的努力是徒劳无益的。当我们照管自身灵魂的洁净时，荣耀的上帝将栖居其内，她便会成为祂圣洁而华美的殿堂，弥漫着对祂不绝祈祷的馨香。
    - type: paragraph
      text:
        ru: '9'
        cn: '9'
    - type: paragraph
      text:
        ru: Что пользы, если мы телом трудимся день и ночь и изнемогаем, а внутренне не заботимся о том, чтобы выдернуть те корешки, из которых произрастает всякое зло?
        cn: 有什么益处，如果我们身体昼夜劳苦，精疲力尽，而内心却不费心拔除那些滋生一切邪恶的根呢？
    - type: paragraph
      text:
        ru: Совершенно необходимо трезвение и непрестанная молитва, чтобы зло, которое свило себе гнездо внутри нас, изгнать и заменить его духовным добром.
        cn: 绝对必要警醒和不住的祷告，为了驱逐那在我们里面筑巢的恶，并以属灵的善替换它。
    - type: paragraph
      text:
        ru: Будьте внимательны, чтобы вашу устную молитву не похитила дневная работа. Выкрикивайте преславное и сладкое имя Иисусово, и Он не замедлит тут же прийти на помощь и утешить. Чего только не может исправить и обновить эта благословенная молитва!
        cn: 务要警醒，以免你们的口祷被日常工作夺去。呼求极其荣耀和甘甜的耶稣之名，祂必不迟延，立刻前来帮助并安慰。这蒙福的祈祷，有何不能修正并更新呢！
    - type: paragraph
      text:
        ru: Понуждайте себя на молитву. Ради чего уму таскаться здесь и там и не обращаться к Иисусу, ради Которого мы оставили все и ради Которого все претерпеваем!
        cn: 勉强自己祷告。为何心神游荡，而不归向耶稣呢？祂是我们为之撇弃一切、为之忍受一切的啊！
    - type: paragraph
      text:
        ru: '10'
        cn: '10'
    - type: paragraph
      text:
        ru: Чадо мое, храни свой ум от плохих мыслей. Тут же, как только они придут, прогоняй их молитвой Иисус-Христовой. Потому что как улетают пчелы, когда их окуривают дымом, так удаляется и Дух Святый, когда почувствует смрадный дым постыдных помыслов. Как пчелы садятся на те цветы, где есть нектар, так и Дух Святый приходит в те ум и сердце, где производится сладкий нектар добродетелей и добрых помыслов.
        cn: 我儿，保守你的心智远离恶念。它们一出现，就立刻借着耶稣基督祷文驱逐它们。因为正如蜜蜂被烟熏时会飞走一样，圣灵也会离开，当祂感受到可耻意念的恶臭烟雾时。正如蜜蜂落在有花蜜的花朵上一样，圣灵也会降临，进入那样的心智与心灵，在其中产生美德和良善意念的甘甜花蜜。
    - type: paragraph
      text:
        ru: Ум да внемлет без мечтаний словам молитвы, которую произносит либо сам ум, либо уста. Целью всех способов молитвы является молитва без мечтаний со вниманием к словам, которые произносят ум или уста.
        cn: 愿心神无妄想地留意祷词，无论这祷词是心神自身所念，抑或口唇所念。一切祷告方式的目的，皆是旨在达成一种无妄想的祷告，即心神或口唇所诵念的祷词须得到全神贯注。
    - type: paragraph
      text:
        ru: '11'
        cn: '11'
    - type: paragraph
      text:
        ru: Из собственного опыта я знаю, что благочестие посредством безмолвия, молитвы, чтения, очистительных слез, истинного покаяния и созерцания Божественных предметов очищает как телесную, так и духовную сторону подвизающегося человека. Конечно, приносит пользу и телесный подвиг, когда есть сильное тело. Когда телесные силы отсутствуют, тогда благодарение и самоукорение восполняют телесный подвиг.
        cn: 从我自身的经验中我知道，敬虔借着静默、祷告、阅读、涤净的泪水、真正的悔改以及对神圣事物的默观，洁净修道者身体与属灵的两个方面。当然，当身体强健时，身体上的苦修也带来益处。当身体力量缺乏时，那时感恩和自我责备就弥补了身体上的苦修。
    - type: paragraph
      text:
        ru: Во всеобъемлющем благочестии и трезвении заключается все. Это истинные признаки живущей во Христе души. Если это отсутствует, а есть только однобокий аскетизм, то человек либо получает мало пользы, либо совершенно погибает, кичась похвалами людей и помыслов. Не имеющий трезвения, этого всеобъемлющего света души, бесценного сокровища, теряет свои труды, о чем мы знаем и из книг, согласно которым многие подвижники в пустыне погибли в буквальном смысле этого слова.
        cn: 一切皆寓于全备的虔敬与警醒之中。这是活在基督里的灵魂的真正标志。如果缺少这些，而只有片面的苦修，那么人要么获益甚微，要么完全沉沦，因人与意念的赞美而自傲。缺乏警醒之人，即缺少这包罗万象的灵魂之光、这无价之宝的人，将虚掷他们的劳作；对此我们从书本中也得知，据载许多在旷野的修道者在字面意义上真正地灭亡了。
    - type: paragraph
      text:
        ru: Телесный подвиг подобен листьям древа, трезвение же – плоду.«По плодам их узнаете их»(Мф.7:16). Нам было заповедано принести плод. Бог да просветит нас, как нам шествовать, потому что иссякли истинные руководители и каждый идет своим путем. Бог да будет для всех нас незаблудным Путеводителем.
        cn: 肉身苦修如同树叶，警醒却是果实。《凭着他们的果子，你们就认出他们来》（马太福音 7:16）。我们受命要结出果实。愿上帝光照我们当如何前行，因为真实的引导者已然枯竭，每个人都各行其道。愿上帝成为我们所有人永不迷失的引路者。
    - type: paragraph
      text:
        ru: '12'
        cn: '12'
    - type: paragraph
      text:
        ru: Чада мои, о чем бы скорбном ни напоминал вам враг наших душ диавол, старайтесь тут же безотлагательно это прогонять, потому что любое промедление приносит нежелательные плоды.
        cn: 我的儿女们，无论我们灵魂的敌人魔鬼向你们提起任何悲伤之事，当立刻毫不迟延地驱逐它，因为任何迟延都会带来不合意的果子。
    - type: paragraph
      text:
        ru: Диавол совершенно побеждается молитвой и трезвением. Суть трезвения состоит в неусыпном умном бодрствовании против страстных помыслов и мечтаний постыдных демонов. Здесь жизнь и смерть, развращение и улучшение. Другими словами, молящаяся умно, презирающая различные лукавые помыслы и гнушающаяся ими душа со временем очищается и освящается.
        cn: 魔鬼完全地被祷告和警醒战胜。警醒的精髓在于，心智不眠不休地警惕，抵挡情欲的意念和恶魔可耻的幻想。在这里，是生与死，是败坏与更新。换言之，心智祷告、蔑视各种诡诈意念并憎恶它们的灵魂，久而久之得以洁净和圣化。
    - type: paragraph
      text:
        ru: '13'
        cn: '13'
    - type: paragraph
      text:
        ru: Будем убегать приражения помысла и противостанем в самом начале греху, являющемуся в виде тонкого помысла, и благодатью Христовой избежим незавидной и весьма горькой участи. Вначале грех, подобно коварной и лукавой лисе, подходит незаметно, приступает и убеждает, что он – мурашка, не стоящая внимания, и что бороться с ним все равно что бороться с муравьем. Душа небрежет о нем и расслабляется. И потом малый муравей в малое время становится неукротимым львом, справиться с которым душе очень и очень трудно.
        cn: 我们要逃避意念的攀附，并在最初就抵制显现为微妙意念的罪恶，借着基督的恩典，我们就能避免那不容艳羡、极其痛苦的结局。起初，罪恶如同狡猾诡诈的狐狸，悄然靠近，发起攻击，并说服道：它只是一个不值一提的小虫，与它争斗，就如同与一只蚂蚁搏斗。灵魂便轻忽它，并松懈下来。之后，这只小蚂蚁在短时间内就会变成一头无法驯服的狮子，灵魂要制服它就非常非常困难了。
    - type: paragraph
      text:
        ru: '14'
        cn: '14'
    - type: paragraph
      text:
        ru: При плотской брани только тылы спасают человека, то есть бегство от мечтаний и помыслов сразу после их появления. Совсем не любопытствуй и не беседуй с мечтаниями! Мечтание – это большая и страшная сеть. Чего иной человек избегает в зрении и осязании, то с легкостью приносит ему мечтание.
        cn: 在肉体争战中，唯有退却能救人，即在妄想和意念刚一出现时就立刻逃离它们。切勿好奇，也不要与妄想交谈！妄想是一张巨大而可怕的网。人在视觉和触觉上所避免的，妄想却能轻而易举地带给他。
    - type: paragraph
      text:
        ru: Подвизайся сделать свой ум совершенно не мечтающим ни о чем мирском, кроме твоего монастыря. Все это заменит всего лишь одна память, память Иисуса, Которому мы служим.
        cn: 致力于使你的心神全然不驰想任何世俗之事，除了你的修道院。所有这一切，都将被仅仅一个记忆所取代，那就是耶稣的记忆，我们所事奉的祂。
    - type: paragraph
      text:
        ru: Если что-либо в твоей келии приводит тебе на память что-то из мирского, то по необходимости ты должен это выбросить, чтобы любыми средствами устранить повод для новой духовной брани.
        cn: 若你的居室里有任何使你忆起世俗之物，那么你必需将其丢弃，以便用一切方法消除新的属灵争战的由头。
    - type: paragraph
      text:
        ru: Постарайся забыть о своем прошлом, и, когда оно восстает и душит тебя, тогда призывай Иисуса, и Он готов прийти тебе на помощь.
        cn: 努力忘记你的过去；当它复苏并扼住你时，那时呼求耶稣，祂就准备好来帮助你。
  - type: heading2
    text:
      ru: Об умной и сердечной молитве
      cn: 论心智与内心的祷告
    children:
    - type: paragraph
      text:
        ru: '1'
        cn: '1'
    - type: paragraph
      text:
        ru: 'Молитесь, прошу вас, по завещанию апостола Павла:«Непрестанно молитесь»(1Фес.5:17). Святые отцы говорят: «Если ты богослов, ты молишься хорошо, и если ты хорошо молишься, то ты богослов». Действительно, святые отцы пустыни учат, что посредством различных телесных подвигов, делания и созерцания, нравственного и духовного любомудрия, трезвения и молитвы ум человека очищается, просвещается и совершенствуется и впоследствии получает дар богословия, не рассудочного богословия, которым занимаются богословы в университетах, а богословия, происходящего и струящегося из Божественного источника, откуда поистине вечно проистекают реки Божественного богословия.'
        cn: 恳请你们祈祷，我请求你们，依照使徒保罗的嘱咐：「要不住地祷告」（帖撒罗尼迦前书 5:17）。圣教父们说：「如果你是神学家，你便祷告得很好；如果你祷告得很好，你便是神学家。」诚然，旷野圣教父们教导说，人的心智通过各种肉体上的苦修、行功与静观、道德上与属灵上的爱智、警醒与祷告，得以被洁净、被光照并被完善，随后便获得神学的恩赐，这并非大学里神学家们所从事的理性神学，而是源于并流淌自神圣泉源的神学，在那里，神圣神学的江河真正地永远涌流。
    - type: paragraph
      text:
        ru: Святые отцы говорят, что отступивший от Бога ум становится либо скотоподобным, либо звероподобным. Напротив, через молитву, наипаче же умную, ум становится боговидным и озаряется Божественным сиянием.
        cn: 圣教父们说，离弃上帝的心智要么变得畜类般，要么变得兽类般。相反地，通过祷告，尤其是智性祷告，心智变得肖乎上帝，并蒙神性光芒的光照。
    - type: paragraph
      text:
        ru: От молитвы зависит спасение человека, потому что молитва приближает его к Богу и соединяет с Ним. А когда человек с Богом, тогда он не сбивается с нравственного пути, потому что следит за каждым своим шагом. Несмотря на нашу осторожность, диавол не прекращает нас подкарауливать, чтобы, застигнув в час немощи, увлечь на свою дорогу, которая всегда довольно круто идет вниз.
        cn: 人的得救取决于祷告，因为祷告使他亲近上帝并与祂结合。当人与上帝同在时，他便不会偏离道德之路，因为他留意自己的每一步。尽管我们小心谨慎，魔鬼不停止伏击我们，以便在软弱之时抓住我们，引诱我们走上它的道路，这条路总是相当陡峭地下行。
    - type: paragraph
      text:
        ru: Посему, возлюбленные мои чада, совершенно необходимым условием является то, чтобы мы всегда были вооружены непрестанной молитвой сладчайшего Иисуса.
        cn: 因此，我蒙爱的孩子们，一个完全必要的条件是，我们务必时刻被至甘甜的耶稣不住的祷告所武装。
    - type: paragraph
      text:
        ru: Мы не должны упускать из виду, что на умную молитву ополчаются и ей препятствуют демоны, чтобы с помощью рассеяния сделать ее тщетной. Мысли различного происхождения окружают ум бедного человека во время молитвы, дабы похитить плод молитвы и оставить молящемуся только листья[7]– телесный труд и старание.
        cn: 我们不应忽略，邪魔会攻击并阻碍理智祷告，以便藉着散乱使其归于徒然。各种来源的念头在祷告时围困着可怜人的心智，以便盗取祷告的果实，只给祷告者留下叶子[7]——肉体上的劳苦和努力。
    - type: paragraph
      text:
        ru: Поэтому желающий хорошо помолиться должен прежде принесения самой молитвы изгнать любое попечение и любой помысл. Ум же, подобно надсмотрщику, да будет поставлен для слежения за произносимыми словами, чтобы молитва стала плодоносным источником Божественной помощи и благодати.
        cn: 因此，凡愿善祷者，务必在献上祷告本身之前，摒除一切挂虑和一切意念。而心智，犹如监工一般，当被设立以监察所发出的言语，好使祷告成为神圣帮助和恩典的丰硕源泉。
    - type: paragraph
      text:
        ru: Как говорят отцы, сатана всегда будет, наподобие рожна или скалы, противостоять святой молитве, потому что она ему досаждает и попаляет его.
        cn: 正如教父们所言，撒旦总会如同尖刺或磐石一般，抵挡圣洁的祷告，因为它令他烦扰并焚烧他。
    - type: paragraph
      text:
        ru: Итак, чада мои, понуждайте себя к молитве и поминайте и меня, вашего старца, чтобы Господь помиловал меня.
        cn: 所以，我的孩子们，勉力祷告，也请为我，你们的长老，代祷，好让上主怜悯我。
    - type: paragraph
      text:
        ru: '2'
        cn: '2'
    - type: paragraph
      text:
        ru: Чтобы сохранить любовь – венец добродетелей, необходимо прилежание в молитве. Подвизайтесь в молитве, если желаете, чтобы Христос вселился в вас. И Он, опытнейший Полководец, будет подвизаться вместе с вами. И Он Сам победит, а победу подарит вам.
        cn: 为了保守爱——德行之冠冕，需要在祷告中殷勤。如果你们渴望基督内住于你们之中，就在祷告中努力争战吧。而祂，那位最有经验的统帅，将与你们一同争战。并且祂亲自得胜，而将胜利赐予你们。
    - type: paragraph
      text:
        ru: Мы становимся похожими на рыкающих львов, когда беремся за молитву не нерадиво, не теплохладно, но сильно, всей силой души! Укрепляйтесь помыслом, что молитва – это все. Без молитвы приходит всеобщий упадок сил, падение за падением. Если во время искушения мы всей силой возьмемся за молитву, то неизбежно одолеем диавола и воздадим победу всесвятому имени Христову.
        cn: 我们变得如同咆哮的狮子，当我们致力于祷告时不是怠惰的，不是不冷不热的，而是以极大的力量，以全副心灵的力量！要以这个念头来坚固自己，即祷告就是一切。没有祷告，便会普遍地力量衰竭，一次又一次的跌倒。如果在受试探时，我们以全副力量投身于祷告，就必能战胜魔鬼，并将胜利归于基督至圣的名。
    - type: paragraph
      text:
        ru: '3'
        cn: '3'
    - type: paragraph
      text:
        ru: Ты, чадо мое, держа в руках оружие молитвы, защищай Божественную крепость, потому что подвизающийся увенчается, но не масличной веткой, а неувядающим венцом вечной славы в горнем Иерусалиме!
        cn: 我的孩子，你手持祷告的武器，要保卫神圣的堡垒，因为那争战的人将得加冕，不是用橄榄枝，而是用永不衰残的、在上方耶路撒冷里的永恒荣耀冠冕！
    - type: paragraph
      text:
        ru: В этом подвиге есть смысл, потому что стяжеваемая в нем слава остается неувядающей и вечной, а слава атлетов, борющихся ради тленных вещей, временна и суетна! Поэтому, чем-то жертвуя и в чем-то себя ущемляя, мы должны подвизаться, чтобы и нами, ничтожными, было прославлено святое имя Божие.
        cn: 这项属灵的努力是有意义的，因为在其中所获得的荣耀是永不朽坏、永恒的；而那些为朽坏之物而争竞的运动员的荣耀，却是暂时的、虚妄的！因此，我们应当借着某些牺牲，并克制自我，去努力奋进，好叫上帝的圣名也能因我们这微不足道的人而得荣耀。
    - type: paragraph
      text:
        ru: '4'
        cn: '4'
    - type: paragraph
      text:
        ru: Чада мои, ради любви Божией прошу вас, не прекращайте молитву Христову ни на миг. Уста ваши пусть непрерывно шепчут имя Иисуса, попирающего диавола и разрушающего все его козни. Непрестанно призывайте на помощь Христа, и Он тут же со всем усердием поспешит вам на помощь.
        cn: 我的儿女们，为着上帝的爱，我恳求你们，一刻也不要停止基督祷文。你们的口要不住地低语耶稣之名，这名践踏魔鬼，并摧毁他一切的诡计。不住地呼求基督来帮助，祂便立刻以全副的热忱飞奔前来帮助你们。
    - type: paragraph
      text:
        ru: Как к раскалившемуся железу невозможно ни приблизиться, ни прикоснуться, так и демоны не приближаются к душе, в которой молитва с теплотой Христовой. Иначе, приблизившись к ней, они будут попалены Божественным огнем, который заключает в себе Божественное имя.
        cn: 就像那烧红的铁，既无法靠近，也无法触碰，同样，魔鬼也不会靠近那灵魂，其中带有基督炽热的祷告。否则，一旦靠近它，他们便会被那包含着上帝之名的神圣火焰所焚烧。
    - type: paragraph
      text:
        ru: Кто молится, просвещается, а кто не молится, помрачается. Молитва – подательница Божественного света. Поэтому каждый хорошо молящийся человек становится весь световидным, и Дух Божий вселяется в него.
        cn: 凡祷告的，必蒙光照；凡不祷告的，必被蒙蔽。祷告是神圣之光的赐予者。因此，每个善于祷告的人都变得全然充满光辉，并且圣灵居于他内。
    - type: paragraph
      text:
        ru: Если к нам приближаются уныние, нерадение, лень и тому подобное, то будем молиться со страхом, болью, с большим трезвением ума, и по благодати Божией с нами произойдет чудо утешения и радости.
        cn: 若灰心、懈怠、懒惰及诸如此类临近我们，我们就当怀着敬畏、痛苦，并以极大的心思警醒来祷告，且藉着上帝的恩典，慰藉与喜乐的奇迹就会临到我们。
    - type: paragraph
      text:
        ru: Молящийся человек не может держать злобу на другого, не прощать его за какую-то ошибку. Все это сгорает дотла, когда человек приближается к огню Иисусовой молитвы.
        cn: 祈祷者不能对他人心怀怨恨，不宽恕他所犯的任何错误。这一切都会在一个人接近耶稣祷文之火时，完全焚尽。
    - type: paragraph
      text:
        ru: Итак, чада мои, подвизайтесь в спасительной и святой молитве Христовой, чтобы стать световидными и освятиться. Помолитесь и о мне, нерадивом и грешном, чтобы милостивым стал Бог ко множеству моих грехов и огромной ответственности, возложенной на меня.
        cn: 那么，我的儿女们，你们当竭力操练施予救恩且圣洁的基督祷告，好使你们成为光明并蒙受圣化。也请为我这不勤勉的罪人祷告，好使上帝能对我众多的罪和那加诸于我身的巨大责任施予慈悲。
    - type: paragraph
      text:
        ru: '5'
        cn: '5'
    - type: paragraph
      text:
        ru: 'Чадо мое, всегда поминай Иисуса, чтобы обрести подходящее лекарство для любых немощей. Тебе больно? Через призывание Иисуса ты найдешь облегчение и просвещение. У тебя скорбь? Призови Иисуса, и вот утешение уже восходит на тверди твоего сердца. Одолевает тебя отчаяние? Не медли возложить свою надежду на Иисуса, и душа твоя исполнится дерзновения и силы. Плотские помыслы осаждают тебя и влекут к чувственным наслаждениям? Во имя Иисусово приими пожирающий огнь и подожги плевелы. Приносит тебе скорбь житейская проблема? Скажи: «Просвети меня, Иисусе мой, как мне здесь поступить? Управь это по Своей воле». И вот, ты придешь в мирное расположение и будешь идти по жизни с надеждой.'
        cn: 我的孩子，要常常称念耶稣，以寻得医治一切软弱的合适良药。你痛苦吗？借着呼求耶稣之名，你将寻得宽慰与光照。你忧伤吗？呼求耶稣，看哪，安慰便已升起在你心之穹苍之上。绝望压倒你了吗？不要迟疑，将你的希望寄托于耶稣，你的灵魂必充满胆量与力量。肉体的思念围困你，并引诱你趋向感官的享乐吗？奉耶稣之名，领受那吞噬之火，并将稗子焚烧殆尽。生活中的问题带给你忧伤吗？说：「我的耶稣啊，求祢光照我，我该如何处理此事呢？愿祢按祢的旨意引导此事。」看哪，你必进入平安的境地，并以希望行走于生命之中。
    - type: paragraph
      text:
        ru: Во всем и для всего имя Иисусово полагай основанием, опорой, украшением и кровом и не бойся врагов. Бойся тогда, когда повсюду шествуешь без Иисуса. Без лекарства ожидай не исцеления, а истления.
        cn: 在一切事上，为一切事，将耶稣之名视作根基、支柱、妆饰与庇护，便不要惧怕仇敌。你当惧怕的，是当你处处行走却无耶稣相伴之时。若无药物，你所期待的并非痊愈，而是败坏。
    - type: paragraph
      text:
        ru: Трудись в молитве, чадо мое, и тогда познаешь великую пользу, упокоение и душевное отдохновение.
        cn: 我的孩子，在祷告中劳作吧，你便会认识到巨大的益处、安息和灵魂的休憩。
    - type: paragraph
      text:
        ru: '6'
        cn: '6'
    - type: paragraph
      text:
        ru: Призывайте имя Божие. Бог готов прийти на помощь каждому просящему. Не забывайте о молитве. Молитвой освящается все бытие человека. Это единственное, чего не могут сделать те, кто не подвизается до крови.
        cn: 呼求上帝之名。上帝乐意前来帮助每一个祈求者。不要忘记祷告。藉着祷告，人的一切存在都被圣化。这是那些不奋战至流血的人所不能做的唯一之事。
    - type: paragraph
      text:
        ru: Как прекрасна молитва! Молящийся просвещается и познает волю Божию. И как он познает ее? Конечно, когда хорошо молится. А когда он хорошо молится? Когда воссылает Богу молитву со всеми ее компонентами. И каковы эти компоненты, которые придают молитве вкус? Смирение, слезы, самоукорение, простота, и особенно послушание с любовью. Молитва проливает свет, и этот свет указывает правильный путь, который находится в согласии с волей Божией.
        cn: 祷告何等美好！祷告者蒙光照，并认识上帝的旨意。而他如何认识它呢？当然，当他好好祷告时。而他何时好好祷告呢？当他向上帝献上带着其所有要素的祷告时。而这些赋予祷告以特有滋味的要素是什么呢？谦卑、泪水、自责、纯朴，尤其是带着爱的顺服。祷告倾泻光明，而这光明指明了正确的道路，这道路是与上帝的旨意相符的。
    - type: paragraph
      text:
        ru: Молитва да будет неослабной, и, молясь таким образом, вы сохраните себя неуязвимыми со всех сторон. Когда вас будут обуревать страстные помыслы, с рвением возьмитесь за напряженную молитву, и тут же познаете пользу облегчения. Твердо держитесь молитвы Иисусовой.
        cn: 祷告当不懈怠，如此祷告，你们将保守自己周全无损。当情欲思虑困扰你们时，当热切地投身于恳切的祷告，你们便会立刻体会到解脱之益。坚定持守耶稣祷文。
    - type: paragraph
      text:
        ru: '7'
        cn: '7'
    - type: paragraph
      text:
        ru: Говори молитву с болью и скорбью душевной и тогда почувствуешь себя по-иному. Только себе внимай! Тогда ты увидишь себя и от этого ви́дения почувствуешь боль, которая привлечет к тебе милость Божию.
        cn: 带着心灵的痛楚与忧伤祷告，那时你便会感受到自己的不同。只管省察己心！那时你便会看见自己，而从这番看见中你将感受到痛苦，这痛苦会为你招致上帝的怜悯。
    - type: paragraph
      text:
        ru: Во время молитвы не обращай внимания на биение сердца. Только держи нерассеянным в молитве свой ум. Это является центром и целью молитвы.
        cn: 在祷告时，不要留意心脏的跳动。只要在祷告中保持你的心神不涣散。这就是祷告的中心和目标。
    - type: paragraph
      text:
        ru: Непрерывно внимай молитве. Она все исправит, потому что молящийся просвещается, а нерадивый в молитве, как я, помрачается. Молитва – это небесный свет, и у кого молитва внутри или на устах, у того свет молитвы бьет ключом в его сердце и просвещает человека в том, что ему помышлять и как уберечь себя от диавольских сетей.
        cn: 持续地潜心祷告。它会修正一切，因为祷告的人蒙受光照，而疏于祷告的人，像我一样，心灵昏暗。祷告是属天的光，谁若心中有祷告或口中有祷告，祷告的光就会在他心中涌流，并光照他当思想什么，以及如何保护自己免受魔鬼的罗网。
    - type: paragraph
      text:
        ru: '8'
        cn: '8'
    - type: paragraph
      text:
        ru: 'Понуждайте себя к Иисусовой молитве, и она станет для вас всем: пищей и питием, одеянием и светом, утешением и жизнью духовной. Все будет тому, кто обладает молитвой. Без нее ничем не удовлетворить душевную пустоту. Хотите возлюбить Христа? Возжаждите молитвы и приимите смирение, и тогда вы познаете, что Царство Божие внутри нас[8].'
        cn: 迫使自己进行耶稣祷文，它就将成为你们的一切：饮食、衣裳与光、慰藉与属灵的生命。拥有祷文之人，一切都将属于他。没有它，任何事物都无法满足灵魂的空虚。你们若想爱慕基督，就当渴慕祷文并领受谦卑，那时你们就将认识到，上帝的国就在我们里面[8]。
    - type: paragraph
      text:
        ru: Не позволяйте дурным мыслям господствовать в вас, но тут же изгоняйте их молитвой. О, какие только чудеса не совершает эта молитва! Выкрикивайте молитву, и Ангел-Хранитель пошлет вам благоухание духовное! Ангелы радуются радостью великой, когда монах молится молитвой сладчайшего Иисуса. Иисус да будет пищей вашей души.
        cn: 不要让恶念辖制你，却要立即借祷告将它们驱逐。哦，这祷告能成就何等奇迹！呼喊祷告，你的守护天使就会赐予你属灵的馨香！当修士以至甜耶稣之名祷告时，众天使便以极大的喜乐欢欣。愿耶稣成为你灵魂的食粮。
    - type: paragraph
      text:
        ru: '9'
        cn: '9'
    - type: paragraph
      text:
        ru: Выкрикивайте молитву непрестанно. «Это благословенное начало»! Да не оставит она вас, наипаче же вы да не оставите молитву – жизнь души, дыхание сердца, воздух благовонный, который приносит духовную весну понуждающей себя душе.
        cn: 不住地呼求祷告。«这是蒙福的开始»！愿祷告不离弃你们，更当是你们不离弃祷告——它是灵魂的生命，心的呼吸，馨香之气，为努力克己的灵魂带来属灵的春天。
    - type: paragraph
      text:
        ru: Молитва, чада мои, и смирение – это всесильные орудия, которые мы все время должны держать в руках с неусыпным вниманием, потому что они, Богу содействующу, дадут нам победу над демонами.
        cn: 我的孩子们，祷告和谦卑是全能的武器，我们必须时刻以不倦的警醒持守在手中，因为它们，在上帝的协同下，将会赐给我们胜过邪魔的胜利。
    - type: paragraph
      text:
        ru: '10'
        cn: '10'
    - type: paragraph
      text:
        ru: Терпите, чада мои, и не теряйте своего дерзновения. Произносите молитву с напряжением. Не распыляйте свой ум в земном, пускай у вас даже множество попечений. Да будут они для вас преходящими. Только молитву и память смертную имейте непрестанно пред очами:«Предзрех Господа предо мною выну,... да не подвижуся»(Пс.15:8).
        cn: '我的儿女们，要忍耐，不要丧失你们的坦然无惧。要带着专注诵念祷告。不要让你们的心思被世俗之事分散，即使你们有许多挂虑。让它们对你们而言都是暂时的。唯独祷告与默念死亡，要常常在你们眼前：


          「我常将上主摆在我面前，… 使我不动摇。」(诗篇 15:8)'
    - type: paragraph
      text:
        ru: Если вы непрерывно и напряженно молитесь, то не падете. Если же будете пренебрегать молитвой, то знайте, что с вами произойдет глубокое падение[9].
        cn: 如果你们持续并竭力地祷告，就不会跌倒。但如果你们轻忽祷告，那么要知道，你们将会遭遇深刻的跌倒[9]。
    - type: paragraph
      text:
        ru: '11'
        cn: '11'
    - type: paragraph
      text:
        ru: Я молюсь, чадо мое, чтобы ты добре шествовал духовно. Будут и трудности, и искушения, и многое другое. Все это мы будем отражать молитвой и страхом Божиим. Диавол, подобно льву, с яростью рыщет здесь и там, чтобы найти кого-нибудь и разорвать на части. Поэтому и мы должны иметь большое внимание и непрестанную молитву ко Христу и Божией Матери, доколе сила Божия не упразднит диавола и не остановит его злобу.
        cn: 我祈祷，我的孩子，愿你灵性康泰，顺利前行。会有困难、诱惑，以及许多其他事情。所有这些，我们将以祈祷和敬畏上帝的心来抵御。魔鬼如同狮子，带着怒气四处游荡，为要寻找可吞噬的人。因此我们必须格外警醒，并向基督和圣母不住地祈祷，直到上帝的能力废除魔鬼并止息其恶毒。
    - type: paragraph
      text:
        ru: Ты, чадо мое, не теряй смелости, противоборствуй врагу всей силой твоей души, и благодать Божия не допустит тебе впасть ни в какую беду.
        cn: 我的孩子，你不要丧失勇气，要以你灵魂的全部力量抵挡仇敌，上帝的恩典就不会让你陷入任何灾祸。
    - type: paragraph
      text:
        ru: '12'
        cn: '12'
    - type: paragraph
      text:
        ru: Усердствуйте в молитве. Не думайте, что так легко достигнуть великих благ. Вы потрудитесь, прольете пот, и увидит Бог ваш труд и смирение и тогда дарует легкую молитву.
        cn: 当在祷告上殷勤。不要以为如此轻易就能达到伟大的福分。你们要劳苦，要流汗；上帝必看见你们的劳苦和谦卑，那时便会赐予你们轻松的祷告。
    - type: paragraph
      text:
        ru: 'Чем больше вы будете молиться, тем больше меня, наипаче же Бога, порадуете и облегчите свою душу. Один должен помогать другому следующим образом: когда вы произносите молитву вслух, а другой не говорит ее и его ум блуждает на стороне, то, услышав вас, он пробуждается от рассеяния, и совесть его обличает, почему и он не произносит молитвы, а бездельничает и блуждает умом. Тогда и он сразу начинает молитву, и исполняется изречение:«Брат от брата помогаемый, яко град укреплен»(ср.:Притч.18:19) и«носите бремена друг друга»(Гал.6:2).'
        cn: 你们祷告得越多，就越发使我，尤其使上帝喜悦，并使你们的灵魂得到轻省。人们应当这样彼此帮助：当你们出声祷告时，而另一个人没有祷告，且他的心神游荡他处，那么，他听到你们的祷告后，便从散漫中醒来，他的良心便责备他，为何他没有祷告，却在懒惰和心神游荡。于是，他立刻也开始祷告，这便应验了这句箴言：「弟兄从弟兄得助，如同坚固之城」(参阅：箴言 18:19) 以及「你们要彼此担当重担」(加拉太书 6:2)。
    - type: paragraph
      text:
        ru: '13'
        cn: '13'
    - type: paragraph
      text:
        ru: Главной целью монашеской жизни является единение монахов с Богом, Который есть край желаний. Когда человек соединен с Богом и в сердце его обитает Бог, тогда он ни в чем не имеет нужды. Внутри него, в его душе нет никакой пустоты. Но и ничего вещественного, что необходимо для жизни, он не лишен. И это еще одно доказательство, которое показывает, как любит Бог слушающих Его.
        cn: 修道生活的主要目的，是修道者与上帝的合一，因为祂是所有欲望的终极。当人与上帝合一，且上帝居住在他的心中时，他便一无所缺。在他里面，在他的灵魂中，没有任何空虚。但他也不会缺乏任何生命所需的物质之物。而这又是另一个证据，表明上帝何等爱那些听从祂的人。
    - type: paragraph
      text:
        ru: Средством же такого тесного единения с Богом является молитва. И, говоря о молитве, мы не подразумеваем только молитву перед иконами, которая тоже должна быть. Но вместе с этим монах употребляет пять слов молитвы, которые говорит и когда работает, и когда ест, и когда сидит, и когда делает что-либо другое, говорит без остановки! Эти слова мы проговариваем либо устами, либо умом, либо сердцем:Господи, Иисусе Христе, помилуй мя.
        cn: 与上帝如此紧密结合的方式，便是祷告。而谈到祷告，我们并非只指圣像前的祷告，这种祷告也当有之。但与此同时，修士会使用五个祷告词，无论工作、用餐、坐着，还是做任何其他事情，他都永不停歇地诵念！这些词语我们或口诵，或心念，或以心灵默祷：主耶稣基督，求祢怜悯我。
    - type: paragraph
      text:
        ru: Нас не утомляет то, что мы произносим эти слова непрерывно. Вначале нужно приложить немного усердия, но потом привыкаешь и произносишь молитву с большой легкостью и не хочешь остановиться. Произнося же ее, чувствуешь такое душевное ликование, что и в наиболее трудные минуты, которые случаются, не возмущаешься и даже не скорбишь, но с терпением прибегаешь ко Христу, Которого просишь о помиловании, и Христос утешает тебя и дает радость. Как прекрасно каждую минуту молить Бога и произносить Его святое имя своими земными устами! Разве может быть большая честь?
        cn: 我们不会因不停地诵念这些话语而感到疲倦。起初需要付出一点努力，但后来就会习惯，并且能非常轻松地诵念祷文，甚至不愿停下。而当诵念祷文时，你会感受到如此的内心欢腾，以至于即使在所遭遇的最艰难时刻，你也不会被激怒，甚至不会感到悲伤，而是忍耐地投靠基督，向祂祈求怜悯，基督就会安慰你，并赐予你喜乐。时时刻刻向上帝恳求，并用我们这尘世的口亲口念诵祂的圣名，这是何等美好！难道还有更大的荣耀吗？
    - type: paragraph
      text:
        ru: В этих словах вся наша религия. Говоря:Господи, мы верим, что мы – рабы Божии, а Он – наш Господин. И этим воздается честь Христу, Которого мы делаем своим Господином, а также воздается честь и нам, потому что мы служители такого Господина, Который является Богом.
        cn: 在这些话语中，蕴含着我们全部的信仰。当我们说：「主啊，」我们相信我们是上帝的仆役，而祂是我们的主。以此，基督便得着尊荣，我们使祂成为我们的主；同样，我们也得着了尊荣，因为我们是这样一位主的仆役，祂就是上帝。
    - type: paragraph
      text:
        ru: Когда мы говорим:Иисусе, что является человеческим именем Бога, нам приходит на ум вся земная жизнь Христа, от Его Рождества до Вознесения.
        cn: 当我们说：耶稣，作为上帝属人的名，我们便会想到基督的整个尘世生命，从祂的圣诞直到升天。
    - type: paragraph
      text:
        ru: Когда мы говорим:Христе, что означает «помазанный Богом», «Царь Неба и земли», то есть, другими словами, означает «Бог», мы исповедуем и верим в то, что Христос – наш Бог, Который сотворил все, находится на Небе и придет снова, чтобы судить мир.
        cn: 当我们称呼：基督，它意味着「受上帝膏抹的」，「天地之君王」，也就是说，换言之，意即「上帝」。我们因此宣信并相信，基督是我们的上帝，祂创造了万有，身居天堂，并将再次降临，审判世界。
    - type: paragraph
      text:
        ru: Говоря:помилуй мя, мы просим Бога послать нам Свою помощь и милость, потому что признаем, что без Божественной помощи не можем сотворить ничего. Вот вкратце объяснение этих святых слов. Кто их произносит, на опыте испытывает многое.
        cn: 当我们说：求祢怜悯我，我们祈求上帝赐予我们祂的帮助和怜悯，因为我们承认，没有了神圣的帮助，我们便一无所成。这便是这些圣洁话语的简短解释。凡是口称这些话语的人，都能亲身经历许多。
    - type: paragraph
      text:
        ru: Я всей душой желаю, чтобы сладчайший наш Иисус даровал душе эту молитву внутрь и для своего укрепления она вкусила духовной сладости.
        cn: 我衷心切愿，我们至甘甜的耶稣能将这祷告赐予灵魂深处，并使其得以坚固，尝到属灵的甘甜。
    - type: paragraph
      text:
        ru: '14'
        cn: '14'
    - type: paragraph
      text:
        ru: Молись как можно чаще, старайся прийти в умиление, пролить слезы, и ты увидишь, какое найдешь облегчение от помыслов и скорби.
        cn: 尽可能时常祷告，力求心怀痛悔，流下泪水，你便会发现从妄念和忧伤中获得何等的解脱。
    - type: paragraph
      text:
        ru: Молитва – это беседа человека с Богом, и молящийся в смиренном и сокрушенном духе исполняется Божественных даров и благословений, то есть радости, мира, облегчения, просвещения, утешения, и сам становится блаженным. Молитва – это обоюдоострый меч, разрубающий отчаяние, опасность, скорбь и тому подобное. Молитва – это противоядие от всех болезней души и тела.
        cn: 祷告是人与上帝的交谈，祷告者以谦卑痛悔的心，充满着神圣的恩赐和祝福，即是喜乐、平安、舒缓、光照、慰藉，并自身蒙受福哉。祷告是一把两刃的剑，斩断绝望、危险、悲伤以及诸如此类的事物。祷告是医治灵魂与肉体一切疾病的解药。
    - type: paragraph
      text:
        ru: Также проси Матерь Света – Непорочную Богородицу – утешить тебя, потому что после Бога Она – величайшая Утешительница. Когда кто-либо призывает Ее святое имя, то тотчас чувствует Ее заступление. Она – Мать, и когда была на земле, то страдала и Она, как подобный нам человек. Поэтому Она сочувствует страждущим душам, спешит и приходит на помощь.
        cn: 也要祈求光明之母——无玷圣母——安慰你，因为在上帝之后，她是至大的安慰者。每当有人呼求她圣洁的名，便立刻感受到她的代祷。她是母亲，她在世时也曾受苦，像我们一样是个凡人。因此，她同情受苦的灵魂，迅速前来施予援手。
    - type: paragraph
      text:
        ru: '15'
        cn: '15'
    - type: paragraph
      text:
        ru: Пусть охрипнет наша гортань, весь день призывая сладчайшее имя Иисусово, и станет оно для умной гортани – сердца –«слаще, паче меда и сота»[10].
        cn: 愿我们的喉咙沙哑，整日呼唤着至甘饴的耶稣圣名，并让它对理智的喉咙——即心——而言，「比蜜和蜂房的滴蜜更甘甜」[10]。
    - type: paragraph
      text:
        ru: Никаким другим именем, кроме имени Иисусова, невозможно одолеть страсти. Никаким другим именем, кроме имени Иисусова, невозможно устранить из сердца тьму и осиять ум молниями светлых познаний. Мы вооружимся этим именем и, как Военачальника, будем призывать Его на помощь при любой борьбе и сражении. Он предстанет по первому зову, и тогда душа наша исполнится смелости, и мы, имея споборником Иисуса, бесстрашно пойдем на невидимую брань.
        cn: 除了耶稣之名，不可能战胜情欲。除了耶稣之名，不可能从心中除去黑暗，并以光明的知识之闪电照亮心智。我们要以这名为兵器，并将祂当作元帅，在任何争战与战斗中呼求祂前来相助。祂必应第一声呼唤而显现，届时，我们的灵魂将充满勇气，并且我们，有耶稣作我们的助战者，必无畏地投入那无形之战。
    - type: paragraph
      text:
        ru: Будем подвизаться в помыслах, всегда уповая на Бога. Будем всегда стоять вооруженными молитвой и трезвением. Будем следить за ворами – помыслами «от шуиих», не оставляя без контроля и помыслов «от десных», чтобы под безобидным предлогом не принять зла.
        cn: 愿我们致力在意念上的争战，始终仰赖上帝。愿我们始终以祷告和警醒自守为武装，坚立不移。愿我们警惕那些盗贼——来自左方的意念，也不放松对来自右方的意念的看管，以免在貌似无害的借口下接受邪恶。
    - type: paragraph
      text:
        ru: '16'
        cn: '16'
    - type: paragraph
      text:
        ru: Трудитесь в умной молитве с большим усердием, терпением, настойчивостью и смирением. Вы должны познать, что этот образ молитвы не дело случая, а плод долгого труда и многого времени. Не будем забывать, что диавол страшно ненавидит умную молитву, и, следовательно, мы будем испытывать разнообразные и сильные противодействия. Итак, необходимо понуждение, смелость, терпение, настойчивость, смирение и любвеобильное расположение по отношению к Иисусу.
        cn: 当以极大的热心、忍耐、恒心和谦卑在心祷中劳作。你们应当认识到，这种祷告方式并非偶然之事，而是长久辛劳和漫长时间的果实。我们不要忘记，魔鬼极其憎恨心祷，因此，我们将经历各种各样且强烈的抵挡。因此，勉力、勇气、忍耐、恒心、谦卑以及对耶稣的爱慕之情是必需的。
    - type: paragraph
      text:
        ru: 'При первых трудностях подвига не разочаровывайтесь. Доброе достигается трудом и болезнью. Но когда вы увидите плод – да и какой плод! – тогда сами скажете: «Действительно, стоило потрудиться ради такого духовного плода».'
        cn: 在灵修奋进遭遇最初的困难时，不要灰心丧志。美善之事是通过劳苦与苦难达成的。但当你看见果实——而且是何等硕果！——那时你自己便会说：「确实，为了这等属灵的果实，付出劳苦是值得的。」
    - type: paragraph
      text:
        ru: '17'
        cn: '17'
    - type: paragraph
      text:
        ru: Молись, молись, и теперь – только непрестанная молитва. Чудес горячей молитвы невозможно ни рассказать, ни изъяснить. Человек удивляется тому, как стихает море и ветер умеряет свою ярость! Искушения, как ужасный шторм с громадными волнами и неумолимым ветром, часто восстают и грозят нам совершенной погибелью. Но, молитвенно возгласив:«Наставниче, спаси нас, погибаем»(ср.:Лк.8:24;Мф.8:25), ты видишь, как все чудесным образом умиряется и мы спасаемся. Аминь.
        cn: 祈祷吧，祈祷吧，而现在——唯有不住的祷告。热切祷告的奇迹是无法述说也无法阐明的。人惊奇于大海如何平静，狂风如何止息其狂怒！诱惑如同带着巨浪和无情之风的可怕暴风雨，常常兴起，并威胁我们要完全灭亡。但当人在祷告中呼喊：「老师，救我们，我们快丧命了！」(参：路加福音 8:24，马太福音 8:25)，你便会看到一切都奇妙地平静下来，而我们就得救了。阿们。
    - type: paragraph
      text:
        ru: '18'
        cn: '18'
    - type: paragraph
      text:
        ru: Я получил, чадо мое, оба твоих письма. Ты добиваешься приобретения Божественной любви и непрестанной молитвы. Это богатейшие дары. Дары, которые предполагают скорби, искушения, время и многое другое. Стало быть, чадо мое, твои искушения закономерны и не должны вызывать недоумения, откуда, мол, эти искушения.
        cn: 我收到了，我的孩子，你的两封信。你寻求获得上帝的爱以及不住的祷告。这是最丰厚的恩赐。这些恩赐，它们意味着苦难、试探、时间以及许多别的。因此，我的孩子，你的试探是理所当然的，不应引起困惑，思忖这些试探究竟从何而来。
    - type: paragraph
      text:
        ru: Итак, подвизайся, имея целью приобрести Божественную любовь через непрестанную молитву Иисусову. На каждое падение отвечай не унынием, а новым контрнаступлением!
        cn: 那么，操练吧，以借着不间断的耶稣祷文来获得神圣的爱为目标。对于每一次跌倒，不要以灰心回应，而要以新的反击回应！
    - type: paragraph
      text:
        ru: '19'
        cn: '19'
    - type: paragraph
      text:
        ru: Мы живем в этом суетном мире, который не должен привлечь и поглотить наше сердце, умертвить духовную жизнь и отлучить нас от Творца и Бога. Поэтому мы должны молиться непрестанно, чадо мое, чтобы поддерживать непрерывное общение со Христом, черпать от Него духовную силу и победоносно противостоять любому демоническому вмешательству. Молись молитвой Иисусовой, и Чудотворец Господь сначала простит множество наших грехов, а потом Своею благодатью поможет нам победить плоть, мир и диавола – наших трех великих врагов. Также молитва является подателем мира и радости по Бозе.
        cn: 我们生活在这世俗纷乱的世界中，它不应吸引并吞噬我们的心，使属灵生命枯萎，并使我们与造物主和上帝隔绝。因此，我的孩子，我们应当不住地祷告，以维系与基督不间断的相通，从祂那里汲取属灵的力量，并得胜地抵挡一切魔鬼的搅扰。你当诵念耶稣祷文，那么行神迹的主便会首先赦免我们众多的罪过，之后祂会以祂的恩典帮助我们战胜肉体、世界和魔鬼——我们这三大仇敌。此外，祷告乃是上帝里平安与喜乐的赐予者。
    - type: paragraph
      text:
        ru: Помысли о том, как необходима нам радость душевная, и особенно Божественная. Поэтому позаботимся любой ценой использовать для молитвы находящееся в нашем распоряжении время.
        cn: 思想一下，灵魂的喜乐对我们是何等必要，尤其是那神圣的喜乐。因此，让我们务必不惜任何代价，将我们所拥有的时间用于祷告。
    - type: paragraph
      text:
        ru: '20'
        cn: '20'
    - type: paragraph
      text:
        ru: Постоянно, день и ночь, молюсь о тебе Богу и Богородице – любвеобильной Матери всех христиан, и особенно монахов, «непоколебимой Стене для девственников»[11]. Посему положись на Воеводу сражающихся и подвизайся мужественно против демонских помыслов и мечтаний, умно произнося молитву нашего сладчайшего Иисуса.
        cn: 昼夜不息地，我为你向上帝和圣母祷告——祂是所有基督徒，尤其是修士们的慈爱母亲，「童贞者的不朽之墙」[11]。因此，你要倚靠战斗者的统帅，勇敢地抵挡魔鬼的意念和幻象，智性地诵念着我们至甘甜的耶稣的祷文。
    - type: paragraph
      text:
        ru: Поминай это святейшее имя, которого трепещут все силы тьмы.
        cn: 称念这至圣之名，一切黑暗的权势都在它面前战栗。
    - type: paragraph
      text:
        ru: Призывай в своем сердце святое имя Божией Матери, чтобы получить духовную силу для отражения любого демонического вмешательства.
        cn: 在你心中呼求圣母的圣名，以便获得属灵的力量，抵御任何邪魔的干预。
    - type: paragraph
      text:
        ru: '21'
        cn: '21'
    - type: paragraph
      text:
        ru: Молись, чадо мое, потому что от молитвы зависит все, и особенно спасение наших душ. Когда мы молимся с болью и смирением, Бог слышит нашу молитву, и Его ответ приносит нам пользу. Часто случается, что воля Божия после нашей молитвы выражается в таком деле, которое абсолютно противоположно тому, о чем мы молились. Часто это нас огорчает, потому что происходит не по нашей воле. Мы не постигаем глубины Божиих судов, и, несмотря на все отличие Божественной воли от нашей собственной, Бог, как Всеведущий, различными способами соделовает полезное для нас.
        cn: 祈祷吧，我的孩子，因为一切都取决于祈祷，尤其我们灵魂的得救。当我们怀着痛苦和谦卑祈祷时，上帝垂听我们的祈祷，祂的回应便会造益我们。常常会发生，在我们祈祷之后，上帝的旨意却以这样一种方式显明，完全与我们所祈求的相悖。这常常令我们忧伤，因为这并非出于我们的意愿。我们无法理解上帝审判的奥秘，尽管上帝的旨意与我们自己的意愿截然不同，上帝作为全知者，仍以各种方式成就对我们有益的事。
    - type: paragraph
      text:
        ru: Посему, чадо мое, соберем все силы своей души для стойкости и исполнения великой добродетели, которая называется терпением.
        cn: 因此，我儿，让我们集聚我们灵魂的所有力量，为着坚忍，并实行那被称为忍耐的伟大美德。
    - type: paragraph
      text:
        ru: '22'
        cn: '22'
    - type: paragraph
      text:
        ru: Слава Его святому имени, потому что мы познали Его и по силам служим Ему и избегаем смятения и суеты века сего.«Слава Ему, возлюбившему нас и омывшему нас от грехов наших Кровию Своею»(ср.:Откр.1:5–6).
        cn: 荣耀归于祂的圣名，因为我们认识了祂，并尽力事奉祂，且避开这世俗的纷扰与虚浮。「荣耀归于祂，那爱我们并用祂的宝血洗净我们罪愆的」（参：启示录 1:5-6）。
    - type: paragraph
      text:
        ru: 'Познай, чадо мое, что когда сердце удаляется от мирских вещей и занимается чтением Божественных Писаний, тогда убегают суетные помыслы, а ум, довольствуясь воспоминанием Божественных мыслей, не интересуется настоящей жизнью, но от великого наслаждения непрестанным чтением возвышается к Богу. Постоянным призыванием имени Божия, которое происходит посредством непрестанной молитвы:Господи, Иисусе Христе, помилуй мя, человек приемлет чувство иной жизни будущего века и надежды праведных. Он предвкушает величие той жизни и с изумлением говорит: «О, глубина богатства и премудрости и ведения непостижимого Бога![12]Ведь Он приготовил такой чудесный иной мир, чтобы ввести в него все разумное творение и сохранить его в нескончаемой жизни»!'
        cn: 吾子，当知，当人心远离世俗之事，并致力于诵读神圣经文时，虚妄的念头便会遁去；而心智，满足于回忆神圣的意念，便不关注今世的生活，却因着不间断阅读所带来的巨大喜悦而升向上帝。借着恒常呼求上帝圣名——这呼求借着不间断的祷告「主，耶稣基督，求祢怜悯我」而成就——人便领受了来世另一种生命的感受以及义人的盼望。他预尝了那生命的伟大，并惊叹而言：「哦，不可测度之上帝，祢的丰盛、智慧和知识是何等深奥啊！[12] 因祂预备了如此奇妙的另一世界，以将一切有理智的受造物引入其中，并使其在永无止境的生命中得以维系！」
    - type: paragraph
      text:
        ru: '23'
        cn: '23'
    - type: paragraph
      text:
        ru: 'Чада мои, будьте прилежны в духовном благоухании, то есть в молитве, в этой святой беседе с Иисусом, Который богато подает Свои благословения. Да, чада Духа, вы всем сердцем возлюбили эту беседу, чтобы всем вам стать благоуханием благодати, чтобы ваше благовоние распространялось и на ближних и они сказали: «Действительно, монашество посредством духовной благодати дает монахам ангельское благоухание».'
        cn: 我的孩子们，你们务要殷勤于灵性的馨香，即在祷告中，在这与耶稣的圣洁交谈中，祂丰盛地赐下祂的祝福。是的，圣灵的子女们，你们全心爱慕这交谈，好使你们众人成为恩宠的馨香，好使你们的芬芳也传达到近人那里，并且他们会说：「诚然，隐修生活借着属灵的恩宠，赐予隐修士们天使般的馨香。」
    - type: paragraph
      text:
        ru: Итак, да бегут от нас прочь грязные страсти – причины зловония и дурного впечатления, производимого на окружающих.
        cn: 因此，愿污秽的情欲远离我们而去，它们是恶臭的根源，并给旁人留下恶劣的印象。
    - type: paragraph
      text:
        ru: '24'
        cn: '24'
    - type: paragraph
      text:
        ru: Будем понуждать себя, чада, на молитву нашему сладчайшему Иисусу, чтобы дал Он нам Свою милость и мы соединились с Его благодатью, дабы нам исполнить Его заповеди и приобрести Его любовь. И когда мы приобретем любовь, она соделает нас богами по благодати и по причастию. Тогда и путь Христов будет для нас не тернистым и крутым, а сладким и радостным. И тогда с легкостью мы будем творить Его заповеди.
        cn: 孩子们，让我们勉力向我们最甘甜的耶稣祷告，好叫祂赐予我们祂的怜悯，使我们与祂的恩典结合，好叫我们遵行祂的诫命，并获得祂的爱。当我们获得爱时，它会使我们藉着恩典并藉着领受成为神。那时，基督的道路于我们而言不再是荆棘密布和崎岖险峻的，而是甘甜且喜乐的。那时，我们将轻而易举地遵行祂的诫命。
- type: heading1
  text:
    ru: Слово первое. О трезвении и умной и сердечной молитве
    cn: 第一篇：论警醒、心意祷告和心祷
  children:
  - type: heading2
    text:
      ru: Слово Первое. О трезвении и умной и сердечной молитве
      cn: 第一篇。论警醒与心智及心之祷告
    children:
    - type: paragraph
      text:
        ru: 'Святые отцы много трудились, дабы обрести посредством молитвы благодать Божию. Поэтому и мы, их чада, обязаны им всегдашней благодарностью за то, что они указали нам путь, который ведет душу к единению с Богом. Удивляешься и говоришь: «Но как же могут люди, особенно же монахи и священнослужители, жить духовно, удовлетворяя нужды своей души без молитвы, которую наши святые отцы даровали нам из своего опыта?».'
        cn: 圣教父们辛勤劳作，为要藉着祷告获得上帝的恩典。因此我们，作为他们的子女，永远亏欠他们一份感恩，因为他们为我们指明了那引领灵魂与上帝合一的道路。你会感到惊讶并说：「但是人们，尤其是修道士和圣职人员，怎能缺少那我们的圣教父们从他们的经验中赐予我们的祷告，而属灵地生活，满足自己灵魂的需要呢？」
    - type: paragraph
      text:
        ru: СвятойГригорий Палама, великий светильник безмолвия, трезвения, и особенно непрестанной молитвы, написал большие и систематически составленные книги и получил имя «корифея и главы святых отцов».
        cn: 圣格列高利·帕拉马，伟大的静默、警醒，尤其是不间断祷告的明灯，撰写了诸多系统编撰的巨著，并被尊称为『诸圣教父之冠冕与首领』。
    - type: paragraph
      text:
        ru: 'Однажды, когда он вместе со своим братством подвизался вне Великой Лавры, он пришел в созерцание и увидел перед собой сосуд, похожий на кувшин, в котором была жидкость. От преизбытка она проливалась и пропадала зря. Это прекрасное питие было белым, как молоко. Некий священнолепный муж говорит ему: «Григорий, почему ты допускаешь, чтобы столько духовного вещества изливалось напрасно, и не даешь это тем, кто имеет в том нужду?». Понял, конечно, святой, что это была благодать Божия. Это духовное вещество и питие, которое было в нем, являлось благодатью Божией, мудростью, опытом, трезвением, силой слова. Муж говорит ему: «Почему ты ограничиваешься этим местом и не передаешь этого немощным, голодным, алчущим и жаждущим людям?».'
        cn: 有一次，当他与他的修士团在大修道院之外一同修道时，他进入了默观，看见一个像水罐的器皿在他面前，里面盛满了液体。因其满溢，它倾泻而出，白白地流失了。这美妙的饮品洁白如乳。一位庄严的男子对他说：「格里高利，你为何容许如此多的灵性实质白白倾泻而出，却不将它赐予那些有需要的人？」这位圣者当然明白，那是上帝的恩典。这灵性实质与其中盛放的饮品，乃是上帝的恩典、智慧、经验、警醒、言语的力量。那男子对他说：「你为何局限于此地，却不将它传授给那些软弱、饥饿、渴慕和干渴的人？」
    - type: paragraph
      text:
        ru: Действительно, по прошествии многих лет, с помощью Божией и под Его руководством, он оказался среди множества людей и расточал свое богатство, напоял нуждающихся в духовной помощи.
        cn: 确实，许多年过去后，在上帝的帮助下，并在祂的引导下，他置身于众多人群之中，分施自己的恩赐，滋润了那些需要属灵帮助的人。
    - type: paragraph
      text:
        ru: Но и находясь в миру, он молился в уединении, безмолвствовал в уединении в своей келии и только в субботу и воскресенье присутствовал за богослужением. Все остальные дни, пять дней в неделю, он закрывался в своей келии и не выходил никуда, не ел и не пил. Только в субботу он нарушал безмолвие и ходил на Литургию. Он причащался, спускался в трапезу, беседовал с отцами и братиями и с вечера воскресенья снова безмолвствовал до субботы.
        cn: 但即便在世间，他也在隐居中祷告，在他的小室里隐居静默，并且只在周六和周日参与礼拜。所有其他日子，一周五天，他把自己关在他的小室里，哪里都不出去，不吃也不喝。只在周六，他才打破静默，去侍奉圣礼。他领圣体，下到斋堂，与众神父和众弟兄交谈，并在周日晚上起再次静默，直到周六。
    - type: paragraph
      text:
        ru: Эти великие отцы научили нас, что душа человека окружена помыслами нечистыми, гордыми, эгоистичными, хульными, грешными и тому подобными, что для их изгнания душа должна употреблять вместе со словами противоречия помыслам и гнев против них, и ярость с молитвой.
        cn: 这些伟大的教父教导我们，人的灵魂被不洁的、骄傲的、自私的、亵渎的、有罪的思虑等等所包围，为了驱逐这些思虑，灵魂必须同时运用言语反驳它们，以愤怒对抗它们，并将怒火与祷告结合起来。
    - type: paragraph
      text:
        ru: Для противоборства дурным мечтаниям и помыслам недостаточно только гнева против них и ярости, но для борющегося с ними человека совершенно необходима и молитва, молитва непрестанная с призыванием Божественного имени:Господи, Иисусе Христе, помилуй мя.
        cn: 为了对抗邪恶的妄念和意念，仅仅对其怀抱愤怒和怒火是不够的；对于与之争战之人而言，绝对必要的乃是祷告，是不住的祷告，并呼求神圣之名：「主耶稣基督，求祢怜悯我。」
    - type: paragraph
      text:
        ru: Согласно отцам, имя Христово содержит в себе силу, исправляющую человека. Молитва Христова заключает в себе силу, которая может исправить падшую душу, падшую низко, душу немощную, небрежную, грешную.
        cn: 根据教父所言，基督之名蕴含着修正人的力量。基督祷文包含着一种能力，它能够修正堕落的灵魂——那深深堕落、软弱无力、懈怠以及有罪的灵魂。
    - type: paragraph
      text:
        ru: У духовного человека бывают в жизни такие дни и моменты, когда он чувствует внутри себя опустошение, душевную немощь. Чего-то недостает, что-то покинуло его, и он не знает точно, как ему прийти в себя, как вернуть прежнюю силу и благодать, которая была в душе. Он не знает, как вернуть потерянную душевную полноту.
        cn: 属灵之人在生命中会有这样的日子和时刻，当他感到内心空虚，灵魂软弱。他感到有所缺乏，某些事物已然离弃了他，而且他不知道究竟如何才能恢复过来，如何才能找回他灵魂里曾有的往日的力量和恩典。他不知道如何才能找回那失落的灵魂的丰盛。
    - type: paragraph
      text:
        ru: 'В этом случае святые отцы нас учат: «Повторяй молитву, начни ее снова либо устами, либо умом, либо сердцем, и душевная полнота вернется». Человек снова обретет ее, только бы понудил себя к молитве.'
        cn: 此时，圣教父们教导我们：「重复祷告，重新开始它，无论是用口、用心思，还是用心，灵魂的丰盛就会回来。」人会再次获得它，只要他强迫自己去祷告。
    - type: paragraph
      text:
        ru: Очень важно, когда человек не прерывает молитвы. Но когда человек работает – спросит кто-нибудь, – ум ведь блуждает то здесь, то там. Но и тогда он может осторожно и тихо творить молитву устами и возвращать душу в прежнее чувство благодати.
        cn: 当一个人不中断祷告时，这是非常重要的。但当一个人工作时——会有人问——思绪会在此处彼处游荡。但即便那时，他也可以谨慎而轻声地口中诵念祷文，并将灵魂带回往日的恩宠感受中。
    - type: paragraph
      text:
        ru: Наши отцы оставили нам великое наследие, ценность которого безмерна, безгранична и не поддается учету. Этим наследием является трезвенное делание.
        cn: 我们的教父们留给了我们一份伟大的遗产，其价值是无限的、无尽的，无法估量的。这份遗产就是醒察的操练。
    - type: paragraph
      text:
        ru: Под трезвенным деланием понимается внимание к помыслам, мечтаниям и движениям чувств; сила души, которая противостоит злу; дальновидность, когда ум издалека видит искушения и избегает их, предпринимая соответствующие меры безопасности; непрестанная молитва и слежение ума за сердцем, за входящими и исходящими из сердца помыслами.
        cn: 警醒修持指的是对意念、幻想以及情感动向的警觉；灵魂对抗邪恶的力量；远见，即心智能够从远处看见试探并规避它们，采取相应的安全措施；不间断的祷告以及心智对心神的看守，看守进入和离开心神的意念。
    - type: paragraph
      text:
        ru: 'Прежде чем святые отцы привели в систему учение об умной молитве, монахи занимались главным образом деятельной добродетелью, под чем подразумевается телесный подвиг: пост, воздержание, поклоны, бдение, установленные молитвы, послушание, смирение и тому подобное. Это и есть деятельная добродетель, которая«мало полезна», а трезвение«на все полезно»[13].'
        cn: 在圣教父们系统化关于心祷的教导之前，修士们主要致力于实践德行，这指的是身体的苦修：禁食、节制、大礼拜、彻夜守祷、规定祷文、顺服、谦卑及诸如此类。这就是实践德行，它「益处甚少」，而警醒则「于凡事皆有益」[13]。
    - type: paragraph
      text:
        ru: С XIV века святые отцы начали приводить учение о молитве в систему. Они оставили труды о молитве и гласно объявили всем, что трезвенное делание необходимо для совершенствования человека.
        cn: 自十四世纪起，圣教父们开始将论祷告的教导系统化。他们留下了关于祷告的著作，并公开向所有人宣告，警醒的操练对于人的成全而言是必要的。
    - type: paragraph
      text:
        ru: Когда же учение о трезвенном делании еще не было приведено в систему, не стало широко известным, о нем не передавали из уст в уста, тогда отцы и духовные люди подвизались в деятельной добродетели. Они много постились, совершали много бдений, смиряли свое тело и делали тому подобное. Когда же трезвенное делание как система стало известным, тогда телесное подвижничество уменьшилось, не как ненужное, а потому, что святые отцы стали предаваться духовной деятельности более, нежели практической добродетели. Потому что благодаря трезвенному деланию они освобождались от помыслов и страсти уменьшались. Трезвенное делание даровало им чистоту сердечную, поэтому для достижения душевной чистоты у них не было крайней необходимости в телесном подвиге.
        cn: 当警醒操练的教义尚未被系统化，未广为人知，也未口耳相传之时，诸教父和属灵人便积极地操练美德。他们禁食甚多，多次守夜，克制己身，并作诸如此类的事。然而，当警醒操练作为一种体系广为人知后，身体的苦修便减少了，并非因为它不再需要，而是因为圣教父们开始更多地致力于灵性活动，而非实践性的美德。因为借着警醒操练，他们得以从意念中得释放，情欲也随之减少。警醒操练赐予他们内心的纯洁，因此为了达到灵魂的纯洁，他们便不再有在身体苦修上的极大必要。
    - type: paragraph
      text:
        ru: Ради этого и мы, монахи, не должны оставлять эту молитву, ибо она приносит тысячепроцентную пользу. Потому что, когда трезвенное делание очищает ум и сердце и дает разумную прилежность как внешним телесным чувствам, так и внутренним чувствам души, тогда монах для достижения своей цели уже не нуждается в великом подвиге.
        cn: 为此，我们这些修士也不应舍弃这祷告，因为它带来千百倍的益处。因为，当警醒操练洁净心智和心灵，并赋予理智的勤勉，无论对外在的肉身感官，还是对内在的灵魂感官，那时修士为了达到其目标，就不再需要伟大的苦修了。
    - type: paragraph
      text:
        ru: Деятельное подвижничество является вспомогательным средством для трезвения. Поэтому и отцы по силам своим занимались деятельным подвигом для поддержки трезвенного делания. Но главные их усилия были направлены на трезвенное делание, потому что молитва и трезвение преподавали совершеннейшие духовные и теоретические уроки.
        cn: 实践性的苦修是警醒的辅助手段。因此，教父们也尽其所能地从事实践性的苦修功课，以辅助警醒的操练。但他们主要的努力都集中在警醒的操练上，因为祷告与警醒传授了最完美的属灵和理论性的教导。
    - type: paragraph
      text:
        ru: Трезвенное делание ведет занимающегося им человека к созерцанию, от созерцания – к мудрости, от мудрости – к любви, а от любви рождается Божественный эрос[14].
        cn: 警醒操练引导从事之人达于默观，从默观到智慧，从智慧到爱，而从爱中生出神圣的厄洛斯[14]。
    - type: paragraph
      text:
        ru: Чистота являлась естественным следствием этого трезвенного делания и приходила сама собой. В то время как в подвиге отцы мучили себя и омрачали, трезвенное делание сделало ненужной большую часть труда и пота.
        cn: 纯洁是这种警醒的操练的自然成果，且自然而然地到来。然而，在苦修中，教父们折磨自己，使自己变得愁苦，警醒的操练却使大部分的劳苦和汗水变得不必要了。
    - type: paragraph
      text:
        ru: Трезвенное делание привело отцов к беспопечительности, потому что они увидели, что забота о многих делах и вещах является серьезным препятствием для достижения трезвения, ибо рождает помыслы. А помыслы отвлекают внимание ума от молитвы и созерцания.
        cn: 警醒操练引导教父们达致不挂虑的境地，因为他们领悟到，对许多事务和事物的挂虑，是达致警醒的严重阻碍，因其会滋生意念。而意念则会分散心智对祷告和默观的注意力。
    - type: paragraph
      text:
        ru: Поэтому, согласно отцам, то попечение о вещах, которое выходит за пределы необходимого, называется духовным туберкулезом.
        cn: 因此，按照教父们的说法，那超出必要限度对事物的挂虑，被称为属灵的肺痨病。
    - type: paragraph
      text:
        ru: Монахи общежительного монастыря[15]живут по послушанию. Послушание, как и следует, приносит послушнику беспопечение. Потому что если я совершаю послушание и обо всем заботится другой человек, то я могу выполнять свою работу в мире и безмолвии.
        cn: 共住制修道院[15]的修士们过着听命的生活。听命，照理说，能给顺从者带来免于挂虑。因为如果我实行听命，而所有的事情都由另一个人负责，那么我就可以在平安和静默中完成我的工作。
    - type: paragraph
      text:
        ru: Когда я работаю и помышляю, что, кроме этой работы, меня ничего не заботит, то могу великолепно сочетать свою работу с молитвой.
        cn: 当我工作，并默想除了这份工作，我别无他念时，我便能完美地将我的工作与祷告结合起来。
    - type: paragraph
      text:
        ru: Если я увижу, что мой ум не может совершать рукоделие с молитвой из-за отвлечения на другие, не связанные с работой вещи, то по необходимости начну устное призывание имени Христова, проговаривая шепотом:Господи, Иисусе Христе, помилуй мя.
        cn: 如果我发现我的心思无法带着祷告进行手作，因为被其他与工作无关的事物所分心，那么，出于需要，我便开始口头呼求基督圣名，低声念诵着：主啊，耶稣基督，求祢怜悯我。
    - type: paragraph
      text:
        ru: Когда уста молятся, а руки работают, то труд имеет двойную благодать – благодать послушания и молитвы. Послушание вознаграждает труд, а молитва его освящает, потому что и рукоделие, и какой бы то ни было другой труд, спутником которого является молитва, имеют особую благодать.
        cn: 当口唇祈祷而双手工作时，劳动就拥有双重的恩典——顺从的恩典和祷告的恩典。顺从奖赏劳动，而祷告使其成圣，因为无论是手工活，还是任何以祷告为伴的劳动，都拥有特殊的恩典。
    - type: paragraph
      text:
        ru: В Тавеннисиотском монастыре была такая тишина, что его называли некрополем – городом мертвых. Этим люди хотели сказать, что отцы имели такое молчание, что не были похожи на живых людей, которые не обходятся без разговора и шума. Располагая таким безмолвием, они, конечно, располагали и временем для молитвы или созерцания Бога.
        cn: 在塔文尼西奥特修道院，有着如此的寂静，以至于它被称为墓园——死者之城。人们以此意欲表明，那些教父们守持着如此的静默，以至于他们不像那些离不开交谈和喧哗的活人。拥有着如此的无声静默，他们当然也拥有时间，用于祈祷或默观上帝。
    - type: paragraph
      text:
        ru: Любящий безмолвие, очевидно, уразумел пользу безмолвия и молитвы. Мы еще не познали пользы самособранности. Мы еще не познали цену молчания. Мы еще не уразумели, какую пользу приносит безмолвие в келии.
        cn: 喜爱静默的人，显然已领悟了静默与祷告的益处。我们尚未认识心神收摄的益处。我们尚未认识静默的价值。我们尚未领悟，静默在隐修室里能带来何种益处。
    - type: paragraph
      text:
        ru: Монах без молитвы пуст, кроме того случая, когда он еще не вкусил пользы молитвы и не чувствует своей пустоты. Нищий не печалится из-за своей нищеты.
        cn: 没有祷告的修士是空虚的，除非他尚未尝到祷告的益处，并且不觉得自己的空虚。乞丐不因为自己的贫乏而忧愁。
    - type: paragraph
      text:
        ru: Но тот монах, который научился молитве, но потом предался нерадению и потерял ее, тот познал потерю и опечалился.
        cn: 但是那个学会了祷告，但后来陷入了懈怠并失去了它的修士，他认识到了损失并感到悲伤。
    - type: paragraph
      text:
        ru: Поэтому монахи и должны молиться, чтобы и долг свой монашеский исполнять, и быть монахами на деле, внутренне, а не только по имени и внешнему образу.
        cn: 因此，僧侣们也理应祷告，既是为了履行他们的修道本分，也是为了在行动和内心上都成为真正的僧侣，而不是仅仅徒有其名和外在形貌。
    - type: paragraph
      text:
        ru: Согласно святым отцам, монах не может называться таковым, если не имеет сокровенного делания.
        cn: 根据圣教父们，修士若无隐秘的修行，便不能被称为修士。
    - type: paragraph
      text:
        ru: Поэтому и мы должны заниматься молитвой и понуждать себя к ней, чтобы наша душа была исполнена плодов[16]. Только тогда мы почувствуем себя монахами.
        cn: 因此，我们也应当致力于祷告，并勉强自己去祷告，好让我们的灵魂结满果实[16]。唯有如此，我们才能自觉是修士。
    - type: paragraph
      text:
        ru: Как удивительно было бы услышать, что тело живет без души, так вызывает недоумение и то, как люди живут без этой духовной пищи!
        cn: 听到身体没有灵魂而活着，是多么令人惊奇啊，同样令人困惑不解的是，人们竟能没有这种灵性食物而生活！
    - type: paragraph
      text:
        ru: Святые отцы говорят нам, что молящиеся так приобретают великие дары. Пост, молитва, воздержание, бдение даруют благодать, разнообразную благодать Святаго Духа.
        cn: 圣教父们告诉我们，如此祷告的人们将获得伟大的恩赐。斋戒、祷告、节制、警醒，赐予恩典，亦即圣灵多样的恩典。
    - type: paragraph
      text:
        ru: Благодать Святаго Духа является под многими образами и в разных чувствах. Святый Дух посредством преуспевшей молитвы и трезвенного делания дарует благодать слез, благодать радости, благодать предвидения, благодать наставления, благодать апостольского дара, силу долготерпения, терпения, Божественного утешения, великой надежды, благодать Божественного эроса, созерцания и пленения.
        cn: 圣灵的恩典以多种形式和不同的感受显现。圣灵藉着恒切的祈祷和警醒的操练，赐予流泪的恩典、喜乐的恩典、预见的恩典、教导的恩典、使徒恩赐的恩典、恒忍的力量、忍耐、神圣的安慰、伟大的希望、神圣爱慕的恩典、默观和陶醉。
    - type: paragraph
      text:
        ru: Мы постоянно учимся, и чем больше учимся, тем более увеличивается наш долг перед Богом и отцами.
        cn: 我们不断地学习，学得越多，我们对上帝和教父们的亏欠就越大。
    - type: paragraph
      text:
        ru: Каждый человек в соответствии с преуспеянием и пользой, которую он получил от молитвы, исправил свои душевные и телесные страсти. Исправление страстей и немощей показывает, насколько человек преуспел в молитве.
        cn: 每个人都依照他在祷告中所获得的进步和益处，纠正了自身灵魂和肉体的激情。激情的纠正以及软弱的消除，显示出一个人在祷告中取得了多大的进步。
    - type: paragraph
      text:
        ru: 'Следовательно, мы должны понуждать себя. Будем постоянно понуждать себя не забывать молитву, не оставлять ее. Если мы заметим, что молитва «дала течь», обессилела и начала дрожать и шататься, то тут же должны приступить к ее исправлению, взяться за молитву с усердием, чтобы вернуть ей прежнюю силу. Как это произойдет? Пусть душа соберется, сосредоточится, «подтянет ремни», как говорится, и начнет напряженную молитву. Пусть она изгонит помыслы, отложит попечение, освободит свой ум от рассеянности и скажет: «Теперь я займусь молитвой». И когда она таким образом помолится некоторое время, тогда тотчас почувствует силу, которая исходит от усердной молитвы.'
        cn: 因此，我们必须强迫自己。我们要不断地强迫自己不要忘记祷告，不要放弃祷告。如果我们察觉到祷告「出现了漏洞」，变得无力，开始颤抖和摇摆不定，那么我们立刻就应该着手纠正它，以热诚重拾祷告，以便使它恢复从前的力量。这将如何实现呢？让灵魂聚集起来，集中精力，如俗语所说，绷紧精神，开始全神贯注的祷告。让它驱逐杂念，放下挂虑，使自己的心免于散漫，然后说：「现在我将专心祷告。」当它这样祷告了一段时间，它立刻就会感受到那来自热诚祷告的力量。
    - type: paragraph
      text:
        ru: Молитва – это катапульта против демонов, против страстей, против греха и вообще против всего того, что встает на пути спасения.
        cn: 祷告是一架对抗恶魔、对抗情欲、对抗罪恶的投石车，总而言之，更是对抗一切拦阻救恩道路的事物。
    - type: paragraph
      text:
        ru: Ты не ошибешься, если назовешь молитву пристанью, потому что в пристани корабль, который кидали штормовые волны, находит тишину, находит спасение и безопасность.
        cn: 你若称祷告为港湾，必不为错，因为在港湾里，饱受风暴浪潮抛掷的船只，寻得宁静，寻得拯救和安稳。
    - type: paragraph
      text:
        ru: Если ты назовешь молитву заступом, если назовешь ее топором, или компасом, или светом, или придумаешь ей тысячу других названий, не ошибешься.
        cn: 如果你称祷告为铲子，如果你称它为斧头，或罗盘，或光，即使你再给它起一千个别的名字，你也不会错。
    - type: paragraph
      text:
        ru: Поэтому мы, монахи, совсем не должны пренебрегать ею. В миру – множество людей, главным образом женщин, которые трудятся в молитве, несмотря на то что у них мирские попечения, дети, работа и множество других обязанностей. Однако они выкраивают время для молитвы и поминания имени Божия.
        cn: 因此，我们这些修士绝不应当忽视它。在世俗之中有许多人，主要是女性，尽管她们有世俗的挂虑、孩子、工作以及许多其他职责，却仍在祷告中劳作。然而，她们挤出时间用于祷告和纪念上帝之名。
    - type: paragraph
      text:
        ru: Что же тогда скажем мы, когда Бог дал нам такую свободу и беспопечение? Что скажем мы, если пренебрегаем молитвой и делаем ее настолько бессильной, что ее бессилие позволяет болезни греха и страстей подавлять нас и делать больными?
        cn: 那么，当上帝赐予我们如此的自由和无挂虑时，我们该说什么呢？如果我们轻忽祷告，并使其变得如此无力，以至于它的无力让罪和情欲的疾病压制我们，并使我们生病，我们又该说什么呢？
    - type: paragraph
      text:
        ru: С нами воюют помыслы? Великим оружием является молитва. Влечение греха отвлекает ум ко злу. Но когда ум возьмет в руки топор молитвы, поднимет его и начнет разить, то искореняет даже самые неподатливые помыслы. Надо только, чтобы человек хорошенько ухватился за топор и правильно его применял. Тогда он достигнет действительно чудесных результатов.
        cn: 意念与我们争战吗？祷告是伟大的武器。罪的诱惑使理智偏向邪恶。但是，当理智拿起祷告的斧头，举起它并开始劈砍时，它甚至能根除最顽固的意念。只需要人牢牢地握住斧头并正确地运用它。那么他就会获得确实奇妙的结果。
    - type: paragraph
      text:
        ru: Поэтому диавол препятствует творению молитвы, чтобы ему легче можно было пленить нас. Он приносит нам нерадение, различные попечения, он творит нам сотни преград с единственной целью – воспрепятствовать молитве.
        cn: 因此，魔鬼阻碍祈祷的进行，为要更容易地掳掠我们。他带给我们懈怠、各种挂虑，他为我们制造数百重障碍，唯一的目的就是阻碍祈祷。
    - type: paragraph
      text:
        ru: Демоны, как было доказано многими событиями, трепещут пред именем Христовым. Они сами устами людей исповедовали, что пожигаются, когда человек молится.
        cn: 鬼魔，正如许多事件所证明的，在基督的圣名面前战栗。他们自己也借着人的口承认，当人祈祷时，他们便被烧灼。
    - type: paragraph
      text:
        ru: 'Был один монах, который впал в такое нерадение, что и правило свое оставил, и обратился к миру. Он поехал на свою родину – остров Кефаллинья, куда, как известно, приезжает множество бесноватых, чтобы их исцелил святой Герасим. Оказавшись на своей родине, пошел и он к мощам святого. И вот по дороге ему встречается бесноватая женщина и говорит ему:'
        cn: 有一位修士，他陷入了如此懈怠之中，以至于连自己的定课也抛弃了，并转向了世俗。他回到了自己的故乡——凯法利尼亚岛，众所周知，那里有许多被邪魔附身的人前来，以求圣格拉西姆治愈他们。回到故乡后，他也前往了圣人的圣髑所在地。就在路上，他遇到了一位被邪魔附身的妇人，并对他说：
    - type: paragraph
      text:
        ru: – Знаешь ли ты, что у тебя в руке? О, если бы ты знал, бедный, что ты держишь в руке! Если бы ты знал, как пожигают меня твои четки, а ты держишь их по привычке и ради приличия!
        cn: – 你可知道你手里拿着什么？哦，可怜的你啊，要是你知道你手里所持的是什么！要是你知道你的念珠是如何焚烧我，而你却只是出于习惯，并为了体面而拿着它们！
    - type: paragraph
      text:
        ru: 'Монах был потрясен. Демон сказал это по воле Божией. Монах пришел в себя. Бог просветил его, и он сказал сам себе:'
        cn: 僧侣被震惊了。邪魔按照上帝的旨意说了这话。僧侣恢复了神志。上帝光照了他，于是他自言自语道：
    - type: paragraph
      text:
        ru: – Смотри-ка, что я делаю, безумный! У меня в руке сильнейшее оружие, а я не могу поразить ни одного беса. И я не только не могу его поразить, но он еще и влечет меня, куда сам пожелает. Согрешил я, Боже мой!
        cn: – 看哪，我做了什么，愚人！我手中握有最强大的武器，却不能击败任何一个魔鬼。我不仅不能击败它，它反而随心所欲地牵引着我。我犯了罪，我的上帝啊！
    - type: paragraph
      text:
        ru: И в ту же минуту он поехал обратно в свой монастырь. Возвратившись, он снова положил доброе начало и настолько преуспел в молитве и монашеском жительстве, что стал добрым примером для многих. Этого старца застал и я, смиренный. Из уст его невозможно было услышать ничего, кроме:Господи, Иисусе Христе, помилуй мя! Непрестанно! Ты говоришь ему о чем-то, а он отвечает тебе два слова, и язык его тотчас возвращается к молитве. Так он привык к ней, так она изменила его. Подумать только, что по неисследимым судьбам Всевышнего цену молитвы и четок открыл ему, сам, конечно, того не желая, диавол!
        cn: 随即他就回了自己的修道院。返回后，他重新立下了善好的开端，并在祷告和修士生活中大有长进，以至于他成了许多人的善好榜样。我这卑微之人也曾见过这位长老。从他口中不可能听到任何别的，除了：「主耶稣基督，求祢怜悯我！」不住地！你跟他谈论什么事，他只回答你两句话，他的舌头便即刻回到祷告上。他就这样习惯了祷告，祷告也正是这样改变了他。想想看吧，按照至高者那不可测度的旨意，竟是魔鬼——他自己当然并非出于本意——向他揭示了祷告和念珠的价值！
    - type: paragraph
      text:
        ru: Послушай и еще одну похожую историю. Когда я был в Новом скиту и был жив мой старец Иосиф, пришел к нам один бесноватый молодой человек.
        cn: 再听一个类似的故事。当我还在新斯基特，我的长老约瑟夫尚健在的时候，有一个被鬼附的年轻人来到我们这里。
    - type: paragraph
      text:
        ru: Старец по своему милосердию принимал этих несчастных. Они жили с нами столько, сколько желали, а потом уходили сами. Они не могут долго находиться на одном месте. Лишенные внутреннего Божественного утешения ищут его, меняя места и людей[17].
        cn: 长老出于他的怜悯，接纳了这些不幸的人。他们想与我们同住多久就住多久，之后便自行离开。他们无法久居一处。他们缺乏内在的属神慰藉，便通过改变居所和人际来寻找它[17]。
    - type: paragraph
      text:
        ru: 'В этом молодом человеке находился демон уличной женщины. Когда он овладевал им, то голос его менялся на голос «публичной» женщины и говорил вещи, о которых, по апостолу,«стыдно и говорить»(Еф.5:12). По профессии он был бочаром. Мы опускаем его имя. Он жил в нашем братстве достаточно долго и в часы работы приходил и, как мог, помогал нам в рукоделии. На третий день он говорит мне:'
        cn: 在这个年轻人身上附着一个淫妇的邪魔。当它控制他时，他的声音就会变成一个「淫妇」的声音，并说出一些事，关于这些事，按使徒所说，「连提及都是可耻的」（以弗所书 5:12）。他的职业是个桶匠。我们省略了他的名字。他在我们的修士团体里住了相当长一段时间，并且在工作时间会过来，并尽其所能地帮助我们做手工活。第三天，他对我说：
    - type: paragraph
      text:
        ru: – Отче, не научишь ли ты и меня делать печати[18]? Изготовление бочек – тяжелая работа. Кроме того, и тот, кто внутри меня, постоянно меня позорит.
        cn: ——父啊，您不也教教我制作印章[18]吗？制作木桶是件重活。此外，我里面那一个也总是让我蒙羞。
    - type: paragraph
      text:
        ru: '– Я научу тебя, брат, буди благословенно[19]! Вот, делай так. Инструменты здесь, заготовки вон там, а образцы перед тобой. За этим столом ты будешь работать. Только еще вот что: в нашем братстве отцы не разговаривают, а всегда творят молитву.'
        cn: ——我来教导你，弟兄，愿你蒙受祝福[19]！喏，就这样做吧。工具在这里，坯料在那里，样本就在你面前。你将在这张桌子旁工作。不过还有一件事：在我们弟兄会中，众修士父不交谈，而是始终行祷。
    - type: paragraph
      text:
        ru: 'Говоря это, я хотел избежать, насколько это возможно, празднословия и рассеяния во время своей молитвы. И в ту же минуту в уме моем родилась следующая мысль: «Стало быть, бесноватые могут творить молитву?». Итак, принялись мы за работу и молитву. Не прошло и нескольких минут, как демон восстал в нем. Голос его изменился, и он начал кричать, сквернословить, угрожать и ругаться.'
        cn: 我这么说，是想在我的祷告中，尽可能避免闲谈和散乱。就在那一刻，我心中生出了以下的想法：「那么，被邪魔附体的人也能祷告吗？」于是，我们便着手工作和祷告。还没过几分钟，那邪魔就在他里面发作了。他的声音变了，他开始喊叫、辱骂、威胁和咒骂。
    - type: paragraph
      text:
        ru: – Заткнись, паршивец! – кричало изнутри.– Заткнись! Прекрати это бормотание! Что ты говоришь все время одни и те же слова? Брось эти слова, ты сводишь меня с ума. Мне хорошо внутри тебя, зачем ты будоражишь меня?
        cn: ——闭嘴，你这混账！——从里面喊道。——闭嘴！停止这嘀咕！你为什么老是说一样的话？别再说这些话了，你快把我逼疯了。我待在你里面挺好的，你为什么要搅动我？
    - type: paragraph
      text:
        ru: Он сказал приблизительно так. Демон помучил его и оставил.
        cn: 他大致是这么说的。恶魔磨难了他，然后离开了。
    - type: paragraph
      text:
        ru: – Видишь, что он делает со мной? – говорит мне несчастный.– И это происходит со мной постоянно.
        cn: – 你看，他对我做了什么？– 那不幸的人对我说。– 而且这事不断地发生在我身上。
    - type: paragraph
      text:
        ru: – Терпение, брат, – говорю ему, – терпение! Не придавай этому значения, ведь это не твое. Не скорби, а заботься о молитве.
        cn: ——忍耐，弟兄，我对他说，——忍耐！不要把这放在心上，因为这不属于你。不要忧愁，而要留心于祈祷。
    - type: paragraph
      text:
        ru: 'Закончив работу, мы пошли к Старцу. По дороге он говорит мне:'
        cn: 完成工作后，我们去了长老那里。在路上他对我说：
    - type: paragraph
      text:
        ru: – Отче, может быть, мне помолиться и о том, который во мне, чтобы Бог помиловал и его?
        cn: ——教父，或许我也该为那在我里面的祈祷，求上帝也怜悯他吗？
    - type: paragraph
      text:
        ru: 'И зачем он только это сказал, бедняга! Тут же им овладел демон, поднял его и грохнул оземь. Все затряслось вокруг. Демон изменяет его голос и начинает:'
        cn: 他为什么要说那样的话呢，这可怜的人啊！立刻，恶魔便附在他身上，将他举起，狠狠地摔在地上。周围的一切都震颤起来。恶魔改变了他的声音，并开口说道：
    - type: paragraph
      text:
        ru: – Заткнись, паршивец! Заткнись, я сказал! О чем это ты говоришь? Какая еще милость? Не нужно милости, не нужна она мне! Нет! Что сделал я, чтобы просить милости? Это Бог несправедлив! За один маленький грех, за гордость он лишил меня славы. Мы невиновны, это Он виноват. Пусть Он Сам покается, а не мы! Прочь милость!
        cn: – 闭嘴，你这混蛋！我说了，闭嘴！你在说什么？什么恩典？不需要恩典，我不需要它！不！我做了什么要乞求恩典？是上帝不公！为了小小一个罪，为了骄傲，他剥夺了我的荣耀。我们无辜，是他有罪。让他自己忏悔，而不是我们！恩典滚开！
    - type: paragraph
      text:
        ru: 'Демон сильно мучил его и, измотав вконец, оставил. Я ужаснулся его словам. За несколько минут на собственном опыте я понял то, что был бы не в состоянии понять, прочитав о бесах тысячи книг. Мы продолжили свой путь к Старцу. Старец всегда принимал его и говорил с ним с большой любовью. И бесноватый рядом с ним всегда оставался спокойным. Старец много молился за бесноватых, потому что знал, какие муки они терпели от демонов, и говорил нам:'
        cn: 邪魔剧烈折磨他，耗尽其力后才离开。我惊惧于他的话语。几分钟之内，凭着亲身经历，我明白了即使读了关于邪魔的千百本书也无法理解的真相。我们继续走向长老。长老总是接纳他，并怀着极大的爱与他交谈。而附魔者在他身边总是安详宁静。长老多多为附魔者祷告，因为他深知他们遭受了来自邪魔的何等折磨，并对我们说：
    - type: paragraph
      text:
        ru: – Если мы, имея демонов снаружи, мучаемся от помыслов и страстей, то какие муки испытывают эти несчастные, в которых демоны находятся день и ночь! – и, печально качая головой, добавлял.– Наверное, свою муку они переживают здесь. Но горе тем, кто не покается, чтобы Бог милостиво наказал их так или иначе здесь, в этой жизни!
        cn: '– 如果我们，外面有魔鬼，尚且受意念和情欲的折磨，那么那些魔鬼昼夜住在他们里面的不幸者，承受着怎样的痛苦啊！

          他悲伤地摇着头，又补充道：

          – 也许，他们在此生中就经历了他们的痛苦。但祸哉那些不悔改的人，以致上帝不在这生命中以这样或那样的方式怜悯地惩罚他们！'
    - type: paragraph
      text:
        ru: 'И он приводил слово одного святого, говорившего вот что: «Если увидишь человека, который явно грешит и не кается и до самого смертного часа с ним не происходит ничего скорбного, знай, что в час Суда обличение этого человека будет без милости».'
        cn: 他引用了一位圣徒的话，这位圣徒这样说：「如果你看到一个人，他明明犯罪却不悔改，直到临终之时，也没有任何悲苦之事临到他，你当知道，在审判之时，对这个人的谴责将是毫无怜悯的。」
    - type: paragraph
      text:
        ru: После таких слов Старца мы все больше сочувствовали искушаемому брату.
        cn: 长老说了这些话后，我们对那受试探的弟兄越发同情了。
    - type: paragraph
      text:
        ru: На службы он не входил в церковь вместе с отцами, а ходил с четками снаружи по скалам и непрестанно громко произносил молитву:Господи, Иисусе Христе, помилуй мя! Господи, Иисусе Христе, помилуй мя! Господи, Иисусе Христе, помилуй мя!Молитва его эхом отзывалась среди скал.
        cn: '参加礼拜时，他没有与教父们一同进入教堂，而是手持念珠，在岩石外面走动，不住地大声诵念着祷文：

          主耶稣基督，求祢怜悯我！主耶稣基督，求祢怜悯我！主耶稣基督，求祢怜悯我！

          他的祷文在岩石间回荡着。'
    - type: paragraph
      text:
        ru: 'Он на опыте испытал, как молитва пожигает демона. И вот, когда он так обходил скалы и непрестанно проговаривал молитву, внезапно изменяется его голос, и демон начинает:'
        cn: 他曾亲身经历过祷告如何焚烧魔鬼。就这样，当他环绕着岩石，不住地诵念祷告时，他的声音骤然一变，魔鬼便开口了：
    - type: paragraph
      text:
        ru: – Заткнись, я сказал, заткнись! Ты замучил меня! Зачем ты ходишь среди скал снаружи церкви и бормочешь? Иди внутрь вместе с другими и прекрати свое бормотание. Зачем ты день и ночь говоришь и повторяешь одно и то же и не даешь мне успокоиться ни на минуту? Ты заморочил меня, ошпарил! Ты жжешь меня, неужто непонятно?
        cn: ——闭嘴，我说，闭嘴！你把我折磨死了！你为何在教堂外的岩石间徘徊，还喃喃自语？进去和大家一起，停止你的喃喃自语。你为何昼夜不停地说着重复的话语，一刻也不让我安宁？你把我弄糊涂了，把我烫伤了！你烧灼着我，难道还不明白吗？
    - type: paragraph
      text:
        ru: И когда искушение проходило, он снова начинал молитву по четкам:Господи, Иисусе Христе, помилуй мя. Он очень хорошо понял то, о чем демон думал, что он не понимает. Это было и болью души, и надеждой, когда ты видел, как он все переносит, подвизается и терпит. Он долго жил с нами, и когда ему стало гораздо лучше, ушел. Больше мы его не видели. Бог знает, чем все это закончилось.
        cn: 当诱惑过去时，他再次开始用念珠祷告：「主耶稣基督，怜悯我。」他非常清楚地明白恶魔以为他不明白的一切。当你看到他如何忍受一切、奋力挣扎并恒心坚忍时，这既是灵魂的痛苦，也是希望。他与我们一同生活了很久，当他的状况好转许多时，便离开了。我们再也没有见过他。上帝知道这一切的结局如何。
    - type: paragraph
      text:
        ru: 'Видите силу молитвы и нераскаянность демонов? Они пожигаются, но кричат: «Нет милости!» – и непрестанно осуждают Бога. О, гордость денницы! Стало быть, чем отличается от демона эгоист и до конца нераскаянный человек, – тот, кто не желает исповедать Христа Богом и Человеком и испросить Его милости и милосердия?'
        cn: 你们看见祷告的力量和邪魔的不悔改了吗？他们被焚烧，但他们却喊叫：「没有怜悯！」——并不断地谴责上帝。哦，晨星的骄傲！如此说来，一个自私自利以及一个至死不悔改的人，与邪魔有何不同呢？——就是那不愿认信基督是上帝和人，并祈求祂的怜悯和慈悲的人呢？
    - type: paragraph
      text:
        ru: Теперь вы понимаете глубочайший смысл молитвы? Как она выявляет людей, кто близок ко Христу, а кто далек от Него?
        cn: 现在您明白祷告最深层的意义了吗？它如何揭示哪些人亲近基督，哪些人远离祂？
    - type: paragraph
      text:
        ru: Мы допускаем помыслам господствовать над нами. Мы позволяем помыслам брать нас в плен, а ведь у нас есть всесветлое оружие молитвы, то оружие, которое называется пламенем и огнем. Молитва – это бич, который бичует любой демонический помысл.
        cn: 我们允许意念辖制我们。我们容许意念将我们掳去为囚，然而，我们却拥有全光明的祈祷武器，那被称为火焰与烈火的武器。祈祷是刑鞭，鞭挞任何邪魔的意念。
    - type: paragraph
      text:
        ru: Но мы недостойны, и я первый, заниматься молитвой. Не потому, что мы не можем или не призваны к молитве, а потому, что мы ленивы и нерадивы, и диавол обманывает нас, и мы творим ему послушание и не занимаемся молитвой как должно. Если бы занимались ею, то не допустили бы стольким страстям и немощам овладеть нами.
        cn: 但我们不配，而我正是那不配的第一人，来从事祷告。并非因为我们不能或未蒙召祷告，而是因为我们懒惰懈怠，魔鬼欺骗我们，我们顺从他，以致未能如其所当地从事祷告。若我们从事祷告，便不会允许如此多的情欲与软弱来辖制我们了。
    - type: paragraph
      text:
        ru: Мы видим, как освятились миряне, занимаясь молитвой. Отец святого Григория Паламы был в царском дворце и правительстве Андроника Палеолога, византийского императора. Несмотря на все свои дела, хлопоты и суету, он не остался непричастным пользы молитвы и преуспеяния в ней. Этим он явил, что человек, где бы ни был, где бы ни находился и какую бы жизнь ни проводил, занимаясь этой чудотворной молитвой, сподобляется благодати Божией.
        cn: 我们看到平信徒借着祷告怎样得以成圣。圣格里高利·帕拉马斯的父亲曾在皇宫中，并在拜占庭皇帝安德罗尼库斯·帕莱奥洛格斯手下的政府里任职。尽管他事务繁多、操劳奔波、尘世喧嚣，他并未与祷告的益处隔绝，并在其中取得了成功。借此他显明，一个人无论身在何处，无论处于何种境地，无论过着何种生活，只要专注于这种行奇迹的祷告，就能蒙受上帝的恩典。
    - type: paragraph
      text:
        ru: 'Мы видим, как святой Максим Кавсокаливит ходил по пустынным и безлюдным местам Афона, чтобы взрастить молитву. И когда отцы спрашивали его: «Отче, почему ты ходишь по пустынным местам, избегаешь людей и не приближаешься к ним»? – Он отвечал: «Я брожу по пустынным местам, чтобы приумножить молитву». Опыт показал, что без должной тишины молитва не сподобляется великих и больших даров, которые происходят из нее.'
        cn: 我们看到圣马克西姆·卡夫索卡利维特在阿索斯山的荒凉无人之地行走，以培养祷告。当教父们问他：「父啊，您为何在荒凉之地行走，避开人群，不亲近他们？」他回答说：「我走遍荒凉之地，是为了倍增祷告。」经验表明，若没有适当的静默，祷告就不能蒙受从它而来的伟大而丰盛的恩赐。
    - type: paragraph
      text:
        ru: И в миру, и в тишине гор можно достигнуть многого благодаря молитве.
        cn: 无论在尘世中，还是在群山寂静里，借着祷告都可以成就许多。
    - type: paragraph
      text:
        ru: Мы, находясь в киновии[20], должны держать молитву и подвиг деятельной добродетели, творя послушание, отсекая свою волю, любя друг друга, терпя один другого, чисто исповедуя помыслы, духовно слушаясь своих начальников, непрестанно творя молитву во время работы. И когда мы совершим все это, тогда придет благодать Божия, которая будет соответствовать нашему произволению и вере, нашей вере и послушанию старшим, нашей деятельной добродетели.
        cn: 我们，身处共生修道院[20]中，应当持守祷告，并操练积极德行的功修，实行顺服，舍弃己意，彼此相爱，互相忍耐，洁净地告解自己的思虑，在灵性上顺从自己的长上，在劳作之时不住地祷告。当我们完成了这一切，那时，上帝的恩典便会降临，这恩典将与我们的意愿和信心相称，与我们的信心和对长上的顺服相称，与我们的积极德行相称。
    - type: paragraph
      text:
        ru: И мы, находясь под одной крышей, под одним пастырским руководством, можем достигнуть удовлетворительных мер благодати, потому что Бог нелицеприятен. Творящих Его заповеди с чистым сердцем, с чистой совестью Он вознаграждает, утешает и дает им надежду спасения.
        cn: 我们，同在一檐之下，在同一牧者指导之下，能够获得令人满足的恩典尺度，因为上帝不偏待人。那些以洁净的心、洁净的良心遵行祂诫命的人，祂必酬报、安慰他们，并赐予他们救赎的希望。
    - type: paragraph
      text:
        ru: Не остается ничего другого, как только понуждать себя, понуждать непрерывно. Будем заниматься главным образом молитвой, как нас научил сегодняшний урок. Непрестанно:Господи, Иисусе Христе, помилуй мя. Просыпаясь утром, будем творить молитву. И трудиться будем с именем Христовым. Так мы с помощью молитвы отсечем празднословие, многословие, осуждение, гнев и недовольство, и каждый будет безмолвствовать сам в себе.
        cn: 别无他法，唯有不断地勉励自己。我们要主要致力于祷告，正如今日的教导所训示我们的。不住地祷告：「主耶稣基督，求祢怜悯我！」 清晨醒来时，我们要献上祷告。我们也要奉基督之名劳作。如此，我们藉着祷告，将斩断虚谈、冗言、论断、愤怒和不满，并且每个人都将在自己里面保持静默。
    - type: paragraph
      text:
        ru: Горе нам, если мы учимся и не делаем, не понуждаем себя, если нам подаются средства и мы бездействуем. Что тогда нам остается делать, как не осуждать себя постоянно, как недостойных, ленивых и убогих? Хотя бы через самоосуждение и смирение обретем понуждение к молитве, потому что смирение и самоосуждение приносят благодать Божию. А благодать снова приносит рвение и легкость молитвы.
        cn: 祸哉我们，如果我们学习却不实行，不勉强自己，如果我们获得了恩典却无所作为。那时我们还能做什么，除了不断地谴责自己是不配的、懒惰的、卑微的？至少藉着自我谴责与谦卑，我们才能获得勉力祈祷的动力，因为谦卑和自我谴责带来上帝的恩典。而恩典又再次带来祈祷的热忱与轻松。
    - type: paragraph
      text:
        ru: Как мы уже сказали в начале слова, мы обязаны непрестанно благодарить святых отцов, благоговеть пред ними, любить их и прославлять, просить их молитв и предстательства пред Богом, умолять их, чтобы они послали и нам малый дар, малое благословение молитвы.
        cn: 正如我们已在开篇所说，我们有义务不停地感谢圣教父们，敬畏他们，爱他们并颂扬他们，请求他们的代祷和在上帝面前的代求，恳求他们也能赐予我们一份小小的恩赐，一份小小的祷告祝福。
  - type: heading2
    text:
      ru: Слово второе. О молитве
      cn: 第二言 论祷告
    children:
    - type: paragraph
      text:
        ru: Неразлучным спутником монаха должна быть молитва. В час, определенный нами для более собранной и внимательной молитвы, мы должны некоторым образом понуждать себя и стараться пригвоздить ум к сердечному месту, избегая, конечно же, мечтаний.
        cn: 祷告应该是修士不可分离的伴侣。在我们为更专注、更留心的祷告所确定的时刻，我们必须以某种方式勉强自己，努力将心神钉住于内心，当然要避免妄念。
    - type: paragraph
      text:
        ru: Будем вдыхать медленно и заключим молитву в слова:Господи, Иисусе Христе, помилуй мя.
        cn: 我们将缓慢吸气，并将祷词付诸言语：主啊，耶稣基督，求祢怜悯我。
    - type: paragraph
      text:
        ru: Ум свой поставим стражем и надзирателем, дабы он следил за произносимыми в молитве словами, внимательно относился к мечтаниям и не принимал никаких образов.
        cn: 我们将心智立为守卫和监察者，好叫它监察祷告时所说的言语，留意那些妄想，并且不接受任何形像。
    - type: paragraph
      text:
        ru: Вместе с тем подвигнем свою душу любовным расположением, чтобы укрепить молитву, придать ей законченность, хорошее чувство, дабы она принесла хороший результат. Этим результатом может быть свобода молитвы, духовная теплота, радость, слезы и многое другое.
        cn: 与此同时，我们要以爱的心境来激励我们的灵魂，以巩固祷告，使其臻于完善，并充满美好的情感，好使它带来好的结果。这样的结果可以是祷告的自由、属灵的温暖、喜乐、眼泪以及许多其他方面。
    - type: paragraph
      text:
        ru: Но, прежде чем начать молитву, полезно на две-три минуты бросить взгляд на свои грехи, на свои страсти, подумать о своей греховности, о своем страстном состоянии, о уничиженном состоянии своей души и о том, что мы не в силах ничего сделать без Бога.
        cn: 但是，在开始祷告之前，有益的是花两三分钟审视自己的罪，审视自己的情欲，思考自己的罪性，思考自己情欲缠身的状态，思考自己灵魂的卑微境况，以及我们若无上帝，便一无所能的事实。
    - type: paragraph
      text:
        ru: Также человек может вспомнить и о Суде Божием или о муке иного мира. Чувство, которое родится при этом в душе, подвигнет человека связать молитву с дыханием.
        cn: 此外，人也可以回想起上帝的审判，或是彼世的磨难。届时在灵魂中萌生的情感，会促使人将祷告与呼吸结合起来。
    - type: paragraph
      text:
        ru: Так происходит подготовка души, чтобы через несколько минут, когда мы начнем молитву, наша молитва имела духовный импульс и окраску.
        cn: 就这样，灵魂的预备完成了，以便在几分钟后，当我们开始祷告时，我们的祷告能拥有属灵的动力和色彩。
    - type: paragraph
      text:
        ru: Когда мы будем поступать таким образом, наш ум будет более собранным, более внимательным. Такое созерцание своих грехов заключает ум внутрь. Потом уму дается молитва, и он начинает молиться хорошо.
        cn: 当我们如此行事时，我们的心智会更加集中，更加警醒。如此默观己罪，能使心智收摄于内。之后，心智便领受了祷告，并开始好好地祷告。
    - type: paragraph
      text:
        ru: Когда человек привыкнет так молиться, то по прошествии некоторого времени, длительность которого зависит от рвения человека, он преуспевает в молитве с помощью, разумеется, благодати Божией. Потому что я верю, что молитва целиком зависит от благодати Божией.
        cn: 当人习惯这样祈祷时，那么在经过一段时间之后——其长短取决于人的热忱——他便在祈祷中取得进步，这当然是借助于上帝的恩典。因为我相信，祈祷完全取决于上帝的恩典。
    - type: paragraph
      text:
        ru: Человек посредством различных образов молитвы становится соработником благодати, которая помогает поминать имя Божие. Доказательством этого является то, что человек может обдумывать любую мысль, а для поминания имени Божия должен прилагать огромные усилия.
        cn: 人借由各种祷告方式，成为恩典的同工，这恩典有助于记念上帝之名。其证明便是人可以思虑任何念头，然而，为了记念上帝之名，则必须付出巨大的努力。
    - type: paragraph
      text:
        ru: Нечто подобное происходит, для примера, с земными цветами. Дикие цветы и колючки растут сами по себе, без всякого усилия со стороны человека. Садовые же цветы, о которых человек заботится и прилагает много труда, если не поможет Бог и не пошлет солнца с его чудотворными лучами, не пробьются на поверхность земли, не вырастут и не зацветут.
        cn: 类似的事情，例如，也会发生在尘世的花朵身上。野花和荆棘自行生长，无需人的任何努力。而园艺花卉，人虽然为之悉心照料，倾注大量心血，但若上帝不施予帮助，不降下太阳及其奇妙的光芒，它们就无法破土而出，无法生长，也无法开花。
    - type: paragraph
      text:
        ru: То же и в духовном делании. Человек с помощью различных способов молитвы старается достичь единения с Богом. Но если Бог не пошлет Своего благословения, если не посодействует, то все эти способы и старание, приложенное в молитве, останутся духовно бесплодными.
        cn: 在灵修功夫上亦然。人通过各种祷告方式，力求与上帝合一。然而，如果上帝不赐下祂的祝福，不施予帮助，那么所有这些方式以及在祷告中所付出的努力，在灵性上仍将是毫无果效的。
    - type: paragraph
      text:
        ru: Поэтому прежде молитвы необходимо созерцание, духовное созерцание своего уничижения, самоукорение, память смертная и многое другое, чтобы во время молитвы привлечь помощь Божию.
        cn: 因此，在祷告之前，默观，属灵地默观自己的卑微、自责、对死亡的记念以及许多其他事项是必要的，以便在祷告中吸引上帝的帮助。
    - type: paragraph
      text:
        ru: И если даже во время молитвы человек примет тщеславные помыслы, молитва прерывается, то есть благодать Божия тут же встречает препятствие и не действует.
        cn: 即便是在祷告的时候，如果人接受了虚荣的念头，祷告便会中断，也就是说，上帝的恩典会立刻遭遇阻碍，并不发挥作用。
    - type: paragraph
      text:
        ru: 'Тогда человек негодует на эти помыслы и думает: «Только молитва начала действовать и я почувствовал благодать Божию, как вклинились помыслы, и благодать отступила».'
        cn: 于是人就愤恨这些意念，他心想：「祷告刚开始显效，我就感受到了上帝的恩典，不料意念就插了进来，恩典就退去了。」
    - type: paragraph
      text:
        ru: 'Часто различные помыслы приближаются снова, и молитва тут же прекращается. Человек задается вопросом: «Но я же не принял плохих помыслов, почему же оказался лишенным молитвы и ее благодати?».'
        cn: 常常，各种念头再次逼近，祷告便随即中断。人不禁会问：「但我并未接纳这些恶念啊，为何却被剥夺了祷告及其恩典呢？」
    - type: paragraph
      text:
        ru: 'И это, конечно же, в рамках Промысла Божия, чтобы как бы дать понять человеку следующее: «Не думай, что ты лишаешься благодати молитвы только тогда, когда принимаешь гордые помыслы. Но когда Я пожелаю, то и без гордых помыслов лишаю тебя убеждения, что ты своей подготовкой и своим старанием можешь достичь действенной молитвы».'
        cn: 这当然是在上帝护理的范围内，仿佛是为了让人明白以下的事理：「不要以为你只有在接受骄傲的思想时，才会失去祷告的恩典。但当我愿时，即使没有骄傲的思想，我也会让你失去这种确信：即你的预备和你的努力能够达到有效的祷告。」
    - type: paragraph
      text:
        ru: На собственном опыте я почувствовал, что молитва – это дело благодати, и понял это настолько глубоко, что никто не в силах убедить меня в обратном. Мы имеем ввиду, конечно, действенную молитву, молитву с чувством благодати, потому что молитвой называется любая другая молитва и без чувства благодати.
        cn: 我凭着自身的经验感受到祈祷是恩典的作为，对此我领悟之深，以至于没有任何人能使我改变这个看法。我们当然指的是有功效的祈祷，即是带着恩典之感的祈祷，因为任何其他祈祷，即使没有恩典之感，也仍被称为祈祷。
    - type: paragraph
      text:
        ru: Итак, человеку иногда полезно лишаться молитвы, чтобы хорошенько выучить этот урок смирения.
        cn: 因此，人有时失去祷告是有益的，为要好好地学习这个谦卑的功课。
    - type: paragraph
      text:
        ru: После многих лет, после многочисленных потерь молитвы из-за помыслов человек, естественно, научается тому, что молитва достижима только с помощью Божией.
        cn: 经过多年，在无数次因意念而失去祷告之后，人自然而然地学会了祷告唯有靠着上帝的帮助才能得以达成。
    - type: paragraph
      text:
        ru: 'АвваИсаак Сиринговорит: «Ты получаешь благодать Божию не тогда, когда приготовишься с помощью всевозможных средств и способов молитвы, но когда пожелает того Бог. Бывает, что ты получаешь ее тогда, когда не приготовился, а бывает, что и приготовившись не имеешь молитвы и не находишь ее».'
        cn: 阿爸伊萨克叙利亚人说：「你领受上帝的恩典，并非在你藉着各种各样的祷告方式和手段准备好之时，而是当上帝愿意如此之时。有时，你会在没有准备好的时候领受这恩典；而有时，即使你已经准备好了，却没有祷告，也没有寻得这份祷告。」
    - type: paragraph
      text:
        ru: Это великая истина. Нередко и я, смиренный, предпринимая все меры для того, чтобы обрести ночью молитву, чаще всего не находил ее. Я вставал в свое время, в тишине, делал все по порядку и со вниманием, но совершенно не бывал услышан. Часами я боролся и все же не обретал молитвы.
        cn: 这是一项伟大的真理。常常，甚至我这卑微之人，在采取一切措施为了在夜间获得祷告时，却常常无法找到它。我在合宜的时间起身，在寂静中，井然有序地、全神贯注地做着一切，但却完全没有被垂听。我挣扎了数小时，但仍然没有获得祷告。
    - type: paragraph
      text:
        ru: 'Потом, после этой долгой внимательной молитвы, я переходил к какому-нибудь другому делу и обретал великую благодать Божию. Я помышлял: «Столько труда, столько стараний, столько внимания – и все безрезультатно. И вдруг такая благодать?». Бог давал мне понять, что не должно оставлять своих стараний, но нужно не верить в них, не верить, что с помощью их возможно обрести молитву.'
        cn: 然后，在这漫长而专注的祈祷之后，我转向其他事情，并领受了上帝的宏恩。我心想：「如此多的劳苦，如此多的努力，如此多的专注——而一切都毫无结果。突然间竟有如此的宏恩？」上帝让我明白，不应放弃自己的努力，但不应信赖它们，不应相信凭借它们能够获得祈祷。
    - type: paragraph
      text:
        ru: Это во власти, в компетенции Бога и без стараний со стороны человека дать чувство молитвы.
        cn: 这在上帝的权柄和职权范围之内，并且无需人这方面的努力，就能赐予祈祷的感受。
    - type: paragraph
      text:
        ru: Во всяком случае, со стороны молящегося должны приниматься все меры, которые необходимы, чтобы обрести молитву, и в то же время он не должен верить, что эти меры обязательно принесут ему молитву. Напротив, он должен верить, что если Бог пожелает, то даст молитву. Иначе он не добьется ничего.
        cn: 无论如何，祈祷者自身应当采取一切必要的措施以获得祈祷，同时他却不应相信这些措施必然会给他带来祈祷。相反地，他应当相信，若上帝愿意，就会赐予祈祷。否则他将一无所获。
    - type: paragraph
      text:
        ru: Земледелец сеет. Он добросовестно возделывает поле, следит за тем, чтобы плуг входил глубоко, переворачивал землю. Только после этого он сеет. Потом он ожидает дождя, ожидает хорошей погоды. Если хорошая погода совпадет с дождем и необходимыми климатическими условиями, то семена взойдут, возрастут и принесут свой плод. В противном случае ничего не выйдет. А если что и прорастет, то будет настолько ничтожным, что земледелец соберет меньше, чем посеял.
        cn: 农夫撒种。他勤恳地耕耘田地，留意确保犁入土深，翻动土壤。唯有如此之后，他才播种。然后他等候雨水，等候好天气。倘若好天气与雨水相合，并符合所需的气候条件，那么种子就会发芽，长大，并结出果实。反之，将一无所成。而倘若真有发芽的，那也将是如此微不足道，以至于农夫所收的将少于他所播的。
    - type: paragraph
      text:
        ru: 'Земледелец тоже надеется на Бога и говорит: «Если Бог пожелает, я соберу урожай». А во времена засухи бедный земледелец и молится, и просит совершать освящение воды, потому что верит, что если Бог пожелает, то пошлет дождь, солнце – одним словом, то, что потребуется, и труд его принесет плод. Иначе же, несмотря на все предпринятые меры, он не соберет урожая.'
        cn: 农夫也寄望于上帝，并且说：「若蒙上帝允准，我将收割庄稼。」而在干旱时期，那贫穷的农夫既祷告，也请求举行祝圣水礼，因为他相信，若蒙上帝允准，祂就会降下雨水、阳光——简而言之，一切所需的，而他的劳作也必结出果实。否则的话，尽管采取了一切措施，他也无法收割庄稼。
    - type: paragraph
      text:
        ru: Так же случается и в духовной жизни. Что бы человек ни предпринимал, он получит плод, только если пожелает того Бог.
        cn: 在灵修生活中也是如此。无论人做什么，他只有当上帝愿意时，才能得着果实。
    - type: paragraph
      text:
        ru: Для этого необходимо, чтобы всем духовным устремлениям предшествовало смирение.
        cn: 为此，有必要让谦卑先于所有属灵的追求。
    - type: paragraph
      text:
        ru: 'Человек доходит до убеждения, что без Бога совершенно ничего невозможно. Он верит в это и говорит: «Подписываюсь своей кровью под тем, что я ничто и не могу сделать ничего благого». И, еще не закончив подписываться под тем, что он ничто, тут же видит тщеславные помыслы и думает: «Ведь только что я своей кровью подписывался под тем, что я ничто, и как же поразил меня тщеславный помысл?».'
        cn: 人达到一种确信，就是离开上帝，绝对一无所能。他相信这一点，并说道：「我以我的血为证，署名确认我算不得什么，并且不能做任何善事。」并且，他还没来得及签署完毕他算不得什么，立刻就看见虚荣的意念，并心想：「我刚才才以我的血为证，签署确认我算不得什么，这虚荣的意念怎会如此袭击了我？」
    - type: paragraph
      text:
        ru: На этом примере видно, что и смирение человеку должен даровать Бог. Несмотря на весь наш труд, который мы подъемлем для познания своей ничтожности, и чувство ничтожности должен нам даровать Бог.
        cn: 由此可见，连同谦卑，也必须由上帝赐予人。尽管我们为认识自身的渺小而付出一切劳苦，但连同对自身渺小的感受，也必须由上帝赐予我们。
    - type: paragraph
      text:
        ru: Но что же тогда должен делать человек, если так обстоят дела? Не нужно совершать никаких добрых дел, не нужно прилагать никаких усилий, а только ждать, когда Бог дарует смирение и благодать? Нет. Человек должен делать то, что от него требуется, всякую добродетель, и ожидать с великим смирением и чувством, что если Бог пожелает, то добродетель получит плоть и кости и принесет плод. Иначе же останется только голый труд.
        cn: 那么，如果情况是这样的话，人究竟该做些什么呢？无需行任何善工，无需付出任何努力，而只需等待上帝赐予谦卑和恩典吗？不，并非如此。人应当做他本分之事，一切美德，并怀着极大的谦卑与觉悟期待着，如果上帝愿意，那么美德就会获得血肉和骨骼，并结出果实。否则，就只剩下赤裸裸的劳作了。
    - type: paragraph
      text:
        ru: 'Возвращаясь к разговору о молитве, я повторяю, что мы должны применять все свои средства: в свое время запираться в келии, помышлять о том, что имеет отношение к молитве, например: о своих грехах, о том, что время проходит, а мы ничего не делаем, о смерти, ожидающей нас, и Суде.'
        cn: 回到关于祈祷的对话，我重申，我们当尽一切努力：在适当的时候，把自己关在小室里，默想与祈祷相关之事，例如：自己的罪过，时光流逝而我们却一无所成，以及等待着我们的死亡和审判。
    - type: paragraph
      text:
        ru: После такого краткого напоминания сразу приходит расположение к молитве. Помещаем ум в сердце и вдыхаем редко, произнося молитовку:Господи, Иисусе Христе, помилуй мя. И если мы почувствуем усталость, сон, то должны проявить настойчивость. Мы ничего, конечно, не добиваемся, но незаметно внутри нас рождается нечто доброе. В следующий раз, когда мы сядем для молитвы[21], мы почувствуем себя лучше, а в другой раз еще лучше. Так постепенно мы начнем находить нечто в молитве, и со временем будем находить все больше. Конечно, этому старанию обязательно будет препятствовать диавол. Он будет уводить наш ум то туда, то сюда, приносить нам различные мечтания. Наши же усилия будут сосредоточены на том, чтобы исключить все это и внимать молитве.
        cn: 经过这番简短的提醒，立刻就生出祈祷的意愿。我们将心智置于心中，稀疏地呼吸着，同时诵念着这简短的祷文：「主耶稣基督，求祢怜悯我。」倘若我们感到疲惫、困倦，那么就当持之以恒。我们固然没有取得什么成果，却在不知不觉中，我们内心生出了某种良善之物。待到下一次我们坐下祈祷[21]时，我们会感觉更好，而再下一次则会感觉更好。如此循序渐进地，我们会开始在祈祷中有所发现，并且随着时间的推移，我们将发现更多。当然，这种努力必定会受到魔鬼的阻挠。它会将我们的心智引向此处、彼处，带给我们各种各样的幻象。而我们的努力将集中于排除所有这些，并专注于祈祷。
    - type: paragraph
      text:
        ru: 'Немалое это дело, а кажется простым: склони голову, собери ум и внимай молитве. Но на деле это чрезвычайно трудно, потому что лукавый не желает этой молитвы.'
        cn: 这并非小事，却看似简单：俯首，收敛心神，并专心于祷告。然而实际上这极其艰难，因为那恶者不愿这祷告。
    - type: paragraph
      text:
        ru: Непримиримым врагом сатаны является умная молитва! Следовательно, не так легко, чтобы диавол позволял ей жечь и обжигать себя, чтобы он позволял ей водворять Христа в нашем сердце, а его изгонять из окрестностей сердца вон.
        cn: 心祷是撒旦不共戴天的仇敌！因此，魔鬼绝不会轻易任由它烧灼自己，也绝不会任由它将基督安立在我们心中，而将他自己从心的周围驱逐出去。
    - type: paragraph
      text:
        ru: Молитва, как мы сказали, имеет целью ввести Христа в наше сердце, что совершенно неприемлемо для сатаны.
        cn: 祷告，正如我们所说，其目的在于将基督引入我们心中，这对于撒但而言是完全不可接受的。
    - type: paragraph
      text:
        ru: Эта простая и немногословная молитва настолько сильна, что того не в силах вместить ум человека. Поэтому сатана так воюет с ней, так жестоко борется, приносит нам рассеяние, беспокойство, печаль, удушье с единственной целью – отвлечь человека от молитвы.
        cn: 这篇简朴而少言的祷告是如此大有能力，以至于人的心智无法全然领会。故此，撒旦如此与她争战，如此残酷地搏斗，加诸于我们散乱、不安、忧伤、窒息，其唯一目的就是引人偏离祷告。
    - type: paragraph
      text:
        ru: «В молитве постоянны»(Рим.12:12). Молитва требует терпения, упорства и долготерпения.
        cn: «在祷告中恒切»（罗马书 12:12）。祷告需要忍耐、毅力和恒心。
    - type: paragraph
      text:
        ru: Не будем говорить, что мы ничего не можем сделать, потому что иначе мы не достигнем этой молитвы, которая настолько велика в своих размерах, что вмещает небесное! Постараемся объяснить величие молитвы.
        cn: 我们不应说我们一无所能，否则我们将无法达到这种祷告；它在其规模上如此宏大，以至于能容纳天上的事物！我们当努力阐明祷告的伟大。
    - type: paragraph
      text:
        ru: 'Когда действует молитва, ум становится настолько чистым, настолько светлым, настолько динамичным, он получает такие крылья, что поднимается очень высоко и встречает Бога со всей Его благодатью! Тогда ум становится настолько восприимчивым для духовных созерцаний, что говорит: «Какое бы созерцание мне выбрать?».'
        cn: 当祷告发挥作用时，心智变得如此洁净，如此光明，如此充满活力，它获得如此的翅膀，以至于它升得极高，并与上帝及其一切恩典相遇！那时，心智对于属灵的默观变得领受能力极强，以至于它会说：「我该选择哪一种默观呢？」
    - type: paragraph
      text:
        ru: Напротив, когда ум не просвещен молитвой, то чрезвычайно инертен. Он не в состоянии плодотворно подвигнуться к созерцанию.
        cn: 反之，当心智未蒙祈祷光照时，则极其迟钝。它无法有效趋近于默观。
    - type: paragraph
      text:
        ru: 'Когда человек прилагает усилия и не обретает молитвы, тогда приходит лукавый и говорит ему: «Вот, ты так старался и не обрел ничего. Прекрати ты эту молитву». Но опыт на своем языке говорит нам, что необходимы терпение и настойчивость, потому что сердце нелегко открывается навстречу молитве. Нужно много ударов и большое усердие в молитве.'
        cn: 当人付出努力却未得着祷告时，那恶者便会来到对他说：「看哪，你如此努力，却一无所获。停止这祷告吧。」但经验以其特有的语言告诉我们，乃是需要耐心和恒心，因为心不会轻易地向祷告敞开。需要多次的敲击和在祷告中极大的热忱。
    - type: paragraph
      text:
        ru: Что происходит с зерном? Оно прорастает, постепенно поднимается наверх, разрывает поверхность земли, почву и выходит на свет этого мира. Потом оно растет, подрастает, цветет и приносит плод.
        cn: 谷粒会发生什么呢？它发芽，逐渐向上生长，挣破地表，冲出土壤，并来到这世间的光明之中。然后，它生长，长成，开花，并结出果实。
    - type: paragraph
      text:
        ru: То же происходит и с молитвой. Постепенно она разобьет черствость сердца, выйдет на его поверхность, выйдет как бы на свет духовного мира и тогда начнет расти, возрастать, цвести и приносить плод.
        cn: 祷告也是如此。它会渐渐打破心的刚硬，浮现于其表面，仿佛进入属灵世界的光中，然后便会开始生长、增进、开花并结果。
    - type: paragraph
      text:
        ru: Если прежде человек чувствовал себя немощным удержать смирение и легко терял молитву, то по прошествии многих лет делания духовной молитвы благой Бог удостоит человека, и он увидит, как смирение укрепляется и становится его естественным духовным состоянием, вследствие чего укрепляется и молитва.
        cn: 如果从前人感到自己软弱无力持守谦卑，并轻易就失掉祷告，那么在操练属灵祷告多年之后，良善的上帝将恩待人，他将看到谦卑如何得以坚固，并成为他灵性自然的景况，随之祷告也得以坚固。
    - type: paragraph
      text:
        ru: Маленький ребенок, когда начинает ходить, не имеет сил. Колени его слабы, он часто падает и ушибается. Но когда он подрастает, лодыжки его укрепляются, он ходит легко и уже не падает. Так бывает и с молитвой.
        cn: 幼童初学步时，是没有力气的。他的双膝软弱，常常跌倒并摔伤。但待他长大一些，他的脚踝便会强健起来，他行走轻快，且不再跌倒。祈祷亦是如此。
    - type: paragraph
      text:
        ru: Итак, все эти труды по Богу должны быть, потому что располагают Бога послать Свою благодать. Наносят же вред духовному подвигу уныние и отчаяние. Отчаяния быть не должно. В любой духовной области оно всегда от диавола, и никогда оно не бывает от Бога. И когда отчаяние приближается к нам, будем помышлять, что оно от диавола.
        cn: 所以，所有这些敬虔的劳作是必要的，因为它们使上帝乐意赐下祂的恩典。然而，沮丧和绝望却会损害属灵的苦修。绝望是不应有的。在任何属灵领域中，它总是来自魔鬼的，并且它绝不是来自上帝的。当绝望临近我们时，我们应当思想它是来自魔鬼的。
    - type: paragraph
      text:
        ru: Диавол агрессивен по отношению к любой молитве, особенно же к этой. Все молитвы человек творит легко в сокровении душевном. Но когда он начинает эту молитву, тогда собираются вокруг все демоны.
        cn: 魔鬼对任何祷告都充满敌意，尤其对待这一祷告。人可以轻易地在灵魂的隐秘处进行所有的祷告。但当他开始这一祷告时，所有的邪魔便会聚集在他周围。
    - type: paragraph
      text:
        ru: Благодаря противоборству и сопротивлению сатаны становится явным, насколько доброй, насколько духовной и плодоносной она является. Мы еще не уразумели, что можем приобрести и какую пользу получить от этой молитвы, поэтому и не имеем вкуса к молитве, не обладаем терпением для нее.
        cn: 由于撒旦的对抗和抵挡，（祈祷）显明了它是何等的良善，何等的属灵，又是何等的富有成效。我们尚未明了我们能从这祈祷中获得什么，以及能得到什么益处，因此我们没有尝到祈祷的滋味，也缺乏为它忍耐的心志。
    - type: paragraph
      text:
        ru: Итак, будем подвизаться, потрудимся в молитве, доколе Бог не пошлет Свою благодать. И тогда, придя, она поведает нам обо всем.
        cn: 所以，让我们修苦行，在祷告中劳苦，直到上帝差遣祂的恩典。届时，恩典会来，并告知我们一切。
  - type: heading2
    text:
      ru: Слово третье. О практике умной молитвы
      cn: 第三篇：论心祷的实践
    children:
    - type: paragraph
      text:
        ru: '1'
        cn: '1'
    - type: paragraph
      text:
        ru: Когда мы были в пустыне, наше бдение начиналось с заходом солнца и продолжалось до самых утренних часов.
        cn: 当我们在旷野中时，我们的守夜始于日落，并持续到清晨时分。
    - type: paragraph
      text:
        ru: Наш блаженный старец Иосиф, преподавая нам обязанности монашеского жительства, настаивал на практике умной молитвы. Подобно тому как его собственная жизнь была постоянным понуждением себя на молитву, так и в отношении нас он настаивал, чтобы мы понуждали себя, сколько могли, дабы утвердить в глубинах ума и сердца имя Господне, которое является краеугольным камнем всего духовного строения.
        cn: 我们的福哉长老约瑟夫，在教导我们修道生活的职责时，坚持要我们实行心祷。正如他自己的生命是对祷告的持续强迫自己，他也同样坚持，我们应尽我们所能地强迫自己，以便在心智与心灵的深处确立上主之名，那是整个灵性架构的房角石。
    - type: paragraph
      text:
        ru: После сна, говорил нам Старец, ум человека свеж и чист. Как раз тогда мы должны в качестве первой духовной пищи дать ему имя Господа и Бога и Спаса нашего, Иисуса Христа.
        cn: 睡醒之后，长老对我们说，人的心思清新而洁净。正是那时，我们应该作为首要的属灵食粮，将我们主、上帝和救主耶稣基督的圣名给予它。
    - type: paragraph
      text:
        ru: Но диавол, зная об этом, с момента нашего пробуждения спешит, как молния, посеять свои плевелы лукавых помыслов, чтобы жернов памяти начал их перемалывать и звук его вращения был как бы диавольской молитвой.
        cn: 但魔鬼，深知这一点，从我们觉醒的那一刻起，急如闪电，撒下它邪恶思念的稗子，为使记忆的磨盘开始研磨它们，且其转动之声，宛如魔鬼的祷告。
    - type: paragraph
      text:
        ru: Мельники на своем языке то место, куда засыпают пшеницу, ячмень, кукурузу и все то, что нужно перемолоть, называют «пофос» (желание). Широкий сверху пофос внизу становится настолько узким, что на жернова в определенном ритме падает только несколько зерен.
        cn: 磨坊主们用他们自己的语言，将倾倒小麦、大麦、玉米以及所有需要研磨之物的那个地方称作「波福斯」（渴望）。顶部宽阔的波福斯，在底部变得如此狭窄，以至于磨盘上只能以某种特定的节奏落下几粒谷物。
    - type: paragraph
      text:
        ru: Итак, все, попадающее в пофос, пройдет через жернова и перемелется. Но вошедшее в сердце, где находятся все человеческие желания (пофосы), вовсе не обязательно поднимется и пройдет через жернова ума.«Из сердца, – говорит Господь, –исходят злые помыслы»(Мф.15:19), поднимаются, проходят по одному и перемалываются умом. Чем более нечисто и приземленно сердце, тем более постыдны и низки помыслы.
        cn: 因此，所有进入情欲之中的，都将经过磨盘，被磨碎。然而，凡进入人心中的，其中蕴含着所有人类的欲望（情欲），却不一定都会升起并经过心灵的磨盘。「从心里发出的，是恶念，」主说（马太福音 15:19），这些恶念升起，一个接一个地经过，被心灵磨碎。人心越是不洁和属世，其意念就越是可耻和低劣。
    - type: paragraph
      text:
        ru: Чтобы вся муть помыслов не поднялась к уму, а также чтобы очистилось и сердце, как того желает его Творец, с помощью умной молитвы мы опускаем свой ум на сердечное небо и преображаем то место, где посредством страстей совершалось поклонение сатане, в святой храм Бога, в обитель Святой Троицы.
        cn: 为了不让所有思虑的混浊升到心智，并为了让心得到洁净，正如它的造物主所愿，我们藉着心智祷告，便将心智降至心之天穹，并将那曾藉着情欲敬拜撒旦之处，转化为上帝的圣殿，成为圣三一的居所。
    - type: paragraph
      text:
        ru: На словах схема, обрисованная нами, проста, но для исполнения ее на деле требуется привлечение всех сил человека и безмерное содействие Божественной благодати. Поскольку Бог всегда жертвует Собой и Сам просит нас:«Сын Мой! отдай сердце твое Мне»(ср.:Притч.23:26), то и мы должны послушно жертвовать собой всецело, ради подвижнических правил наших святых отцов.
        cn: 在言语上，我们所描绘的图景是简单的，但要将其付诸实践，则需要人倾尽所有的力量，以及神圣恩典无量的协助。既然上帝总是舍弃自己，并且亲自请求我们：「我儿！将你的心献给我」（参阅：箴言 23:26），那么我们也必须为了我们圣教父们的苦修规矩，顺服地全然舍弃自己。
    - type: paragraph
      text:
        ru: Посему будем внимательно относиться к первым помыслам после сна. И хорошие, и плохие сны, и мечтания – все то, что оставит после себя ночной отдых, тут же уничтожаем. Сразу беремся за имя Христово – дыхание нашей души.
        cn: 因此，我们要留意醒后最初的思绪。无论是好梦，是恶梦，还是幻想——所有这一切，凡是夜间安歇后留下的，我们都要立刻将其消除。我们要立刻抓住基督之名——我们灵魂的呼吸。
    - type: paragraph
      text:
        ru: Потом, освежив немного лицо водой, чтобы проснуться окончательно, для поддержания тонуса выпиваем чашку кофе или чего-либо другого – ведь наше бдение начинается задолго до полуночи, – читаем Трисвятое,Символ веры, Достойно есть и садимся на свое место молитвы, держа в руке оружие против Диавола – четки.
        cn: 之后，用水稍稍拂面，以便彻底醒来，为了保持精神抖擞，我们喝一杯咖啡或其他饮品——因为我们的守夜礼在午夜前很久就开始了——接着诵读三圣颂、信经和诚然当赞，然后坐于自己的祈祷之处，手中拿着对抗魔鬼的兵器——念珠。
    - type: paragraph
      text:
        ru: 'Старец говорил: «Сел на свою скамеечку? Не начинай молитву как попало, но сначала собери свой ум и помысли немного о смерти и о том, что последует за ней».'
        cn: 长老说：「你坐到自己的小凳子上了吗？不要随意地开始祷告，而要先收敛你的心神，并稍作默想，思念死亡以及死后之事。」
    - type: paragraph
      text:
        ru: 'Помысли, что это последняя ночь в твоей жизни. Все предыдущие ночи и дни прошли и привели тебя к этой границе твоей жизни. Однако об этой ночи, которая перед тобой, ты не уверен: передаст ли она тебя наступающему дню или надвигающейся смерти? Сколько людей умрет в эту ночь! Откуда ты знаешь, что тебя не будет среди них?'
        cn: 设想这是你生命中的最后一夜。所有先前的夜晚与白昼已然逝去，并已将你引至生命的这一边界。然而对于眼前这一夜，你并不确定：它是否会将你交付给那即将到来的白昼，抑或是那逼近的死亡？多少人将会在这一夜死去！你又怎会知道，你不会是他们中的一员呢？
    - type: paragraph
      text:
        ru: Помысли, что когда ты будешь отходить, то придут искать твоей души Ангелы либо демоны, согласно твоим делам. Демоны, горько осуждая твою душу, в час смерти приводят на память все дела твоей жизни и подталкивают к отчаянию. Ангелы противопоставляют этому то, что сделано по Богу. И от этого предварительного суда зависит шествие души. За этим следуют воздушные мытарства, потом престол Судии и затем решение.
        cn: 思量，当你将要离世之时，天使抑或魔鬼将根据你的行为前来寻求你的灵魂。魔鬼们苦毒地定罪你的灵魂，在死亡之时将你一生所有的行为都唤入记忆中，并推向绝望。天使们则以此对抗，显明那按着上帝而行的作为。而灵魂的去向便取决于这初步的审判。在此之后，接着便是空中关卡，然后是审判主的宝座，最终是判决。
    - type: paragraph
      text:
        ru: И если результатом всего этого будет мука, то что же ты будешь делать, окаянная душа? Что дала бы ты в тот час, чтобы спастись? Приди в себя, как блудный сын, который покаялся и испросил милости у всемилостивого Бога. То, что ты делала бы тогда, сделай сейчас. Ты согрешил? Покайся.«Се, ныне время благоприятно»(2Кор.6:2).
        cn: 而如果这一切的结局是苦痛，那么你将如何是好，不幸的灵魂啊？在那时辰，你将付出什么才能得救呢？快醒悟过来吧，就像那浪子，他忏悔了，并从至仁至慈的上帝那里祈求了怜悯。你那时辰本会做的事，现在就去做吧。你犯罪了吗？忏悔吧。「看哪，现在正是蒙悦纳的时期」（哥林多后书 6:2）。
    - type: paragraph
      text:
        ru: Если без образов и фантазий человек хотя бы короткое время побеседует с этими мыслями, то умиляется, умягчается его сердце, подобно воску, и ум перестает рассеиваться. Память смерти обладает тем преимуществом, что побеждает житейскую ложь и рождает в сердце печаль по Богу. В этой атмосфере умиления можно начинать немногословную и непрерывную умную молитву.
        cn: 如果人能毫无形象和幻想地，哪怕只是短暂地与这些思想交流，他的心就会受感而生柔和，如同蜡一般被软化，心思也不再散漫。念死具有这样的益处：它能胜过世俗的谎言，并在心中生出对上帝的哀伤。在这种柔和受感的氛围中，就可以开始寡言而无间断的心祷了。
    - type: paragraph
      text:
        ru: Когда ум твой собран, когда твой дух стал сокрушенным и смиренным, тогда приклони голову и обрати свое внимание к сердечному месту. И сердце тоже сокрушенно и смиренно. Оно ждет, когда снидет ум, чтобы вместе с ним принести мольбу Многоблагоутробному в надежде, что Он не уничижит.
        cn: 当你的心神专注时，当你的精神变得痛悔和谦卑时，那时，垂下你的头，并将你的注意力转向心的所在。心也是痛悔和谦卑的。它等待着心神的降临，以便与心神一同向至仁慈者献上恳求，盼望祂不会轻视。
    - type: paragraph
      text:
        ru: Процесс дыхания тела начинается со вдоха через ноздри. Там молитвой прикуй свое дыхание. Вдыхая, произноси молитву один раз, провожая ее до самого сердца, и, выдыхая, повторяй молитву еще один раз. Там, в сердечном месте, где останавливается молитва, там утверди и свой ум и без рассеяния посредством вдоха и выдоха следи за сопутствующей вдоху и выдоху молитвой:Господи, Иисусе Христе, помилуй мя.
        cn: 身体的呼吸过程始于通过鼻孔的吸气。在那里，藉祷文系住你的气息。吸气时，诵念祷文一次，伴随它直到内心深处；呼气时，再重复祷文一次。在那里，在内心之处，祷文止息之处，在那里也安顿你的心神，并毫无散乱地，借着吸气和呼气，追随那伴随吸气与呼气的祷文：主啊，耶稣基督，求祢怜悯我。
    - type: paragraph
      text:
        ru: Мобилизуй все свое любовное расположение и без мечтаний и образов сокровенно поминай имя Господа Иисуса.
        cn: 调动你所有的爱意，不带任何幻想和形象，在隐秘中默念主耶稣的圣名。
    - type: paragraph
      text:
        ru: Удали любую мысль, даже самую красивую, самую чистую и спасительную. Это от десных искушение лукавого, чтобы остановить молитву. Презри все лукавые помыслы, сколь бы постыдными, скверными и кощунственными они ни были. Они не твои, не волнуйся, ты за них не отвечаешь. Бог знает, откуда они приходят. Лишь не ленись, не бойся, не увлекайся и не сочетайся с ними.
        cn: 移除任何思虑，即使是最美丽、最纯洁和能导向救赎的思虑。这是恶者从右侧而来的诱惑，旨在阻碍祷告。藐视一切恶念，无论它们多么可耻、污秽和亵渎。它们不属于你，不必忧虑，你无需为它们负责。上帝知道它们从何而来。只是不要懒惰，不要害怕，不要被其吸引，也不要与之联合。
    - type: paragraph
      text:
        ru: И если немного рассеешься, то, как только поймешь, что удалился от места и образа молитвы, возвратись обратно. И если увлечешься снова, снова возвратись. Сколько раз рассеешься, столько раз и возвращайся. Бог увидит твой труд и желание и понемногу укрепит твой ум.
        cn: 即使你稍微有些心散，那么一旦你明白自己已经偏离了祈祷的境地和心境，就回到原处。如果你再次被牵引走，就再次回到原处。你心散多少次，就回来多少次。上帝会看到你的辛劳和愿望，并会逐渐坚固你的心智。
    - type: paragraph
      text:
        ru: Поскольку ум имеет обыкновение блуждать, а также оставаться там, где болит, то ты сдерживай свое дыхание. Не выдыхай тут же. Это вызовет маленькую безобидную боль в сердце, где мы желаем утвердить свой ум. Эта маленькая боль, подобно магниту, будет притягивать и удерживать около себя ум, чтобы, подобно служанке, служить ему.
        cn: 鉴于心智惯于游荡，并且停留在它感到痛苦之处，你当抑制你的呼吸。不要立即呼出。这会在心内引起一丝微小而无害的痛楚，那里正是我们渴望安立心智的地方。这丝微小的痛楚，如同磁石，会将心智吸引并维系在自身周围，好使它像使女一样侍奉心智。
    - type: paragraph
      text:
        ru: И действительно, сладкое имя Господне, прежде всякого имени призываемое с болью и сокрушением, понемногу со временем производит«изменудесницыВышняго»[22]в том месте, где прежде обитал грех.
        cn: 确实，上主甜美的圣名，在任何名号之前，以痛悔与哀恸所呼求的，渐渐地，随着时间的推移，在那先前罪恶所居住之处，产生「至高者右手之变」[22]。
    - type: paragraph
      text:
        ru: Вращение молитвы в сердечном месте настолько расширяет границы сердца, что оно становится сердечным небом, способным вместить Невместимого.
        cn: 祷告在心中的运行如此拓展心的边界，以至于它成为心之天，能够容纳那不可容纳者。
    - type: paragraph
      text:
        ru: За престол сердечный будет вестись война и крепкая брань. Вначале диавол будет действовать посредством своих страстей и зловонных испарений, то есть различных противящихся молитве помыслов. И чем более с помощью поста, бдения, молитвы и других аскетических упражнений ты будешь выбивать у него почву из-под ног, тем больше он будет неистовствовать, тем больше он попытается, по попущению Божию, проявить свою злобу и вероломство посредством различных воздействий, искушений и скорбей. Но границы его влияния всегда будет очерчивать нежная забота Небесного Отца в соответствии с возможностью человека отражать атаки противника.
        cn: 为心灵的宝座，一场战争和一场激烈的争战将要展开。起初，魔鬼将通过它的诸般情欲和污秽的气息，即各种抵触祷告的意念，来作祟。你越是通过禁食、守夜、祷告以及其他苦修功课的帮助，使它失去立足之地，它就越是暴怒不已；它就越会尝试，在上帝的允许下，借着各种影响、诱惑和苦难，显露它的恶毒和背信弃义。然而，它影响的界限，将总会由天父温柔的看顾，根据人抵挡仇敌攻击的能力，来划定。
    - type: paragraph
      text:
        ru: Перед искушением Подвигоположник Христос всегда сокровенно дарует подвизающемуся благодать, чтобы с помощью этой благодати была сокрушена ярость диавола и он возвратился побежденным и постыженным. Терпя скорби, мы должны принести Господу столько радости, сколько принесли Ему скорби, соблазняясь грехом. Тогда радовался диавол и скорбел Бог, а теперь очередь радоваться Богу и скорбеть и разрываться от злобы диаволу.
        cn: 在试探之前，设立苦行的基督总是隐秘地赐予苦修者恩典，好叫借着这恩典，魔鬼的怒气被击碎，并且它败北蒙羞而归。承受苦难时，我们应该献给主多少喜乐，就像我们因罪受诱惑时，给祂带来了多少苦楚那样。那时魔鬼欢喜，上帝忧伤；而现在轮到上帝欢喜，魔鬼则要忧伤，并气得肝肠寸断。
    - type: paragraph
      text:
        ru: '2'
        cn: '2'
    - type: paragraph
      text:
        ru: «Но это дело не одного и не двух дней. На это требуется много времени, – замечает божественный Златоуст, – необходим большой подвиг и много времени, чтобы был изгнан диавол и вселился Христос… Но поучитесь и потерпите Господа Бога нашего,“дóндеже ущедрит ны”(Пс.122:2). И ничего другого не просите у Господа славы, кроме милости. Прося же милости, просите ее смиренным и милостивым сердцем. И взывайте с утра до вечера и, если возможно, всю ночь:Господи, Иисусе Христе, помилуй мя. И понуждайте даже до смерти свой ум на это дело».
        cn: 「但这并非一日两日之功。这需要很多时间，——神圣的金口圣徒[若望]指出，——需要极大的苦修和漫长的时间，才能将魔鬼驱逐，让基督居住其中……但你们要学习并忍耐我们的主上帝，『直等到祂怜恤我们』（诗篇 122:2）。除了怜悯，不要向荣耀的上主祈求任何其他。祈求怜悯时，要以谦卑和怜恤的心去祈求。并且从早到晚，如果可能，整夜地呼求：主耶稣基督，求祢怜悯我。并且要甚至至死，也迫使自己的心意专注于此。」
    - type: paragraph
      text:
        ru: Подобные советы дают все святые отцы, каждый своеобразно и своими словами, но имея за плечами опыт войны и победы над диаволом, которого раздражает и буквально обессиливает непрестанная умная молитва.
        cn: 所有的圣教父们都给出类似的建议，每一位都以其独特的方式和他们自己的言语，但他们都拥有与魔鬼争战并战胜魔鬼的经验；这魔鬼因不住的理智祷告而恼怒，并全然丧失气力。
    - type: paragraph
      text:
        ru: «Братья, всегда дышите Христом», – побуждает нас учитель пустыниАнтоний Великий.
        cn: «弟兄们，总是呼吸基督»——旷野导师安东尼大帝如此劝勉我们。
    - type: paragraph
      text:
        ru: «Всегда поминай Бога, и ум твой станет небом», – говорит преподобный Нил Премудрый.
        cn: 「恒常思念上帝，你的心便会成为天堂。」—— 圣尼尔智者言。
    - type: paragraph
      text:
        ru: Чем упорнее молится человек, тем больше очищается сердце и просвещается ум, тем добрее становится произволение, тем больше радости Царствие Божие приносит человеку, который по образу Божию и ради которого Богочеловек Иисус покрыл все небо и всю землю Своей добродетелью, страданием и Воскресением.
        cn: 人越是恒切地祈祷，心就越蒙洁净，理智就越蒙光照，意志就越发良善，上帝之国就带给人越多的喜乐；这个人是照着上帝的形像被造的，并且神人耶稣正是为了这个人，以其善德、苦难与复活，遮盖了诸天穹与全地。
    - type: paragraph
      text:
        ru: Еще отсюда вкушает блага Небесного Царствия тот, кто иссушит свой вкус, удалит свои чувства от красот мира и встанет мужественно, даже до смерти, против нападок миродержца. Тишина помыслов, мир сердца, сладко текущие слезы, пленение ума, познание таин, преизбыток любви, созерцание Бога, совершенство, «какое только возможно для человеческого естества», – все это достигается систематическим, постоянным, упорным, неотступным подвигом и при посредстве умной молитвы.
        cn: 同样，在此地就能尝到天国福乐的，是那干涸自己的口腹之欲，将自己的感官从世界的华美中抽离，并勇敢地，甚至以死相搏，对抗世界统治者的攻击的人。思想的宁静，内心的平安，甘甜流淌的泪水，心智的降服，对奥秘的认知，满溢的爱，对上帝的默观，以及达致「人类本性所能达到的」完善——这一切皆借着系统性的、持续的、坚韧不拔的、毫不退缩的苦修，并借着理智的祷告而达致。
    - type: paragraph
      text:
        ru: Но прежде, чем эта непрерывная умная беседа будет услышана, со стороны молящегося необходимо параллельное исполнение монашеских и христианских условий для духовной жизни.
        cn: 但在此之前，要使这种不间断的心智交谈得以听闻，祈祷者必须同时遵行修道生活和基督徒生活对属灵生命的各项条件。
    - type: paragraph
      text:
        ru: От монаха-послушника требуется непоколебимое послушание старцу, который являет видимый образ жизни Спаса Христа. От всех же христиан требуется приведение своей жизни в соответствие с указаниями духовников и послушание канонам Единой Святой Православной Церкви, чтобы никто не блуждал по пути своих похотей и желаний, от чего нас предостерегает Священное Писание.
        cn: 见习修士需要对属灵导师保持坚定不移的顺服，这位导师彰显着救主基督生命的可见形象。而所有基督徒，则被要求使自己的生活与属灵指导者的指引相符，并顺服独一、圣洁、正教会的教会法规，为使无人迷失在自己的私欲和欲望的道路上，对此，圣经已警戒我们。
    - type: paragraph
      text:
        ru: 'В Патерике приводится очень содержательное и простое высказывание аввы Мины: «Послушание за послушание: кто слушается Бога, того слушается Бог». Аавва Исаияуточняет: «Невозможно, чтобы Бог не послушал человека, который слушается Бога. Бог недалеко от человека, но наши желания не позволяют Ему услышать нас».'
        cn: 在《教父言行录》中记载了阿爸米纳一句寓意深长而又简单的话：「顺服换顺服：谁听从上帝，上帝就听从谁。」阿爸以赛亚阐明道：「上帝不可能不听从听从祂的人。上帝离人并不遥远，但我们的私欲不容祂听见我们。」
    - type: paragraph
      text:
        ru: Наша молитва не может быть услышана из-за наших желаний.
        cn: 我们的祷告不能因我们的欲望而被垂听。
    - type: paragraph
      text:
        ru: Если ты молишься и не бываешь услышан, то подумай, может быть, ты непослушен.
        cn: 如果你祈祷，却未蒙垂听，那么，请思考，或许你是不顺从的。
    - type: paragraph
      text:
        ru: Если ночью ты молишься, а днем проводишь невнимательную жизнь, то это все равно что строить и одновременно разрушать.
        cn: 如果夜间你祷告，而白日你过着疏于警醒的生活，那就如同建造又同时拆毁。
    - type: paragraph
      text:
        ru: Если ты невнимателен в мелочах, то тебе обязательно будет попущено впасть в великое. Внемли себе.
        cn: 如果你在小事上不谨慎，那么你必然会被许可堕入大错。警醒自身。
    - type: paragraph
      text:
        ru: Невозможно, чтобы Бог всегда посылал Свою благодать тому сердцу, которое не полагает предела своим пожеланиям, и тому уму, который не прекращает своего бесцельного блуждания. Бог вначале дает Свою благодать для того, чтобы помочь нам, восставить нас, усладить чувства нашей души и привлечь к Себе. Но если не будем трудиться и мы сами, то благодать останется бездейственной. В процессе еды пробуждается аппетит, а молитва рождается в процессе молитвы.
        cn: 不可能上帝总是派遣祂的恩典给那不对其渴望设限的心，以及那不停止其漫无目的游荡的心智。上帝起初赐下祂的恩典，是为了帮助我们，扶立我们，愉悦我们灵魂的感受，并吸引我们归向祂。但如果我们自己不劳作，那么恩典就会保持无作用。在进食的过程中胃口被唤醒，而祷告则在祷告的过程中诞生。
    - type: paragraph
      text:
        ru: 'Находишься ты на работе, на своем послушании? Вспомни святых отцов, которые, работая, говорили самим себе:'
        cn: 你正在工作，在你的职事上吗？回想一下那些圣教父们，他们在工作时对自己说：
    - type: paragraph
      text:
        ru: Тело, трудись, чтобы питаться.
        cn: 身体，劳作，以便滋养。
    - type: paragraph
      text:
        ru: Душа, трезвись, дабы спастись.
        cn: 灵魂，警醒，为要得救。
    - type: paragraph
      text:
        ru: Рассеивается ум твой? Проговаривай молитву шепотом и не пустословь, иначе, кроме самого себя, причинишь вред и другим.
        cn: 你的心神涣散吗？轻声祷告，也不要说空话，否则，除了伤害你自己，还会伤害到他人。
    - type: paragraph
      text:
        ru: 'Авва Филимон говорит: «Многие святые отцы, и созерцая Ангелов, хранили себя. Молчанием они хранили себя, не вступая ни с кем в беседу».'
        cn: 阿爸菲利门说：「许多圣教父，甚至在默观天使时，仍旧守持自身。他们以静默守持自身，不与任何人交谈。」
    - type: paragraph
      text:
        ru: Вместо того чтобы терять время, говори молитву. И когда приходят к тебе лень и нерадение, бойся угрозы Господа для лукавого и ленивого раба.
        cn: 与其浪费时间，不如祈祷。当你被懒惰和怠惰侵扰时，要惧怕上主对那邪恶又懒惰之仆人的威胁。
    - type: paragraph
      text:
        ru: Если ты допустишь, чтобы день передавал тебя ночи нерадивым и ночь передавала тебя дню еще более нерадивым, то вскоре дойдешь до совершеннейшего нерадения.
        cn: 如果你任凭白昼将懈怠的你交给夜晚，而夜晚又将更加懈怠的你交给白昼，那么你很快就会达到全然的懈怠。
    - type: paragraph
      text:
        ru: Неужели ты будешь хвалиться своим нерадением, когда другие будут получать венцы за свои труды?
        cn: 难道你竟会夸耀自己的懈怠，当别人因他们的劳苦而领受冠冕的时候吗？
    - type: paragraph
      text:
        ru: Потрудись немного, брат, в молитве и трезвении, и ты увидишь, как радость забьет ключом в твоем сердце и свет взойдет на тверди твоего ума. Это не та радость, которая проходит прежде, чем ты порадуешься. Это сладость Ангелов, это невечерний свет иного мира, который Христос – Свет мира, приходящий через молитву, – дарует тебе прежде твоего отшествия из этого мира. Может, этого не было с нашими отцами? Может, этого не может произойти с нами? Это будет, если не помешают тому наши маловерие и лень.
        cn: 稍微努力吧，弟兄，在祷告和警醒中，你将看见喜乐如泉涌般在你心中涌流，光明将升起在你心意的穹苍。这并非那样的喜乐，在你得享喜乐之前便已消逝。这是天使的甘甜，是另一世界的永不昏暗之光，是基督——那藉着祷告而来的、世界之光——在你离世之前所赐予你的。难道这未曾降临我们的父辈吗？难道这不能临到我们吗？必将如此，若非我们的小信和懒惰阻碍了它。
    - type: paragraph
      text:
        ru: 'И мой Старец говорил: «Потрудись немного, чтобы сделать должником Бога, дабы в свое время Он послал тебе гораздо больше и во много раз больше того, что ты заслужил и просил».'
        cn: 我的长老说：「稍作劳苦，使上帝对你有所亏欠，以便在祂所定之时，祂赐予你远超你所配得和所求的，多得多，且多出许多倍。」
    - type: paragraph
      text:
        ru: 'Но не забывай и слова святого Исаака Сирина: «Сначала диавол старается упразднить непрестанную молитву сердца, а потом убеждает монаха презреть определенные для молитвы время и правило, которое состоит из поклонов и коленопреклонений».'
        cn: 但也不要忘记圣伊萨克·叙利亚的教诲：「魔鬼首先试图废除不间断的心祷，然后劝诱修士轻视那些为祷告所定的时间与规矩，这规矩包括叩拜和跪拜。」
    - type: paragraph
      text:
        ru: Посему не слушай шепота нерадения, и если желаешь, чтобы Бог покрыл твои ошибки, то покрой и ты ошибки твоего брата и потерпи его в день его искушения и боли.
        cn: 因此，不要听从怠惰的私语，若你渴望上帝遮盖你的过错，那么你也当遮盖你弟兄的过错，并在他受试探与痛苦的日子容忍他。
    - type: paragraph
      text:
        ru: Не пререкайся и не скрывай помыслов от своего духовного отца, иначе всуе будешь трудиться всю свою жизнь, и молитва твоя останется бесплодной.
        cn: 勿与你的灵性父亲争辩，亦勿向他隐藏你的意念，否则你一生都将徒然劳碌，你的祷告也将毫无果效。
    - type: paragraph
      text:
        ru: Если ты не очистишься благодаря откровенной исповеди, как приступишь к причащению Пречистых и Животворящих Христовых Таин? Разве ты не слышал, что для достойно причащающихся они становятся жизнью, а для недостойно – смертью?
        cn: 如果你没有藉着坦诚的忏悔洁净自己，你如何能就近领受基督至洁和赐生命的圣奥秘呢？难道你没有听过吗，对于那些配称地领受圣奥秘的人，它们就成为生命；而对于那些不配领受的人，它们就成为死亡吗？
    - type: paragraph
      text:
        ru: 'Не говори: «Как поступают другие, так делаю и я», ибо это безумное слово, а ведь Судия не безумен.'
        cn: 不要说：「别人如何行事，我也如何行事」，因为这是愚妄的话语，而审判者并不愚妄。
    - type: paragraph
      text:
        ru: Всякий помысл, приносящий отчаяние и печаль, от диавола. Отвергай его тут же, иначе он порвет нить твоей молитвы. Всякий помысл, рождающий умеренную печаль, смешанную с радостью и слезами, от Бога. Благодать Божия никогда не приводит человека в отчаяние, но ведет его только к покаянию.
        cn: 凡是带来绝望和忧伤的意念，都源于魔鬼。立刻弃绝它，否则它会扯断你祷告的线。凡是产生适度忧伤、混合着喜乐和泪水的意念，都源于上帝。上帝的恩典绝不会使人陷入绝望，唯独引导他走向悔改。
  - type: heading2
    text:
      ru: Слово четвертое. О молитве
      cn: 第四篇 论祷告
    children:
    - type: paragraph
      text:
        ru: Господи, Иисусе Христе, помилуй мя.
        cn: 主啊，耶稣基督，求祢怜悯我。
    - type: paragraph
      text:
        ru: Сердце человеческое является центром сверхъестественных, естественных и противоестественных движений. Все начинается в сердце. Если сердце человека очистится, то он увидит Бога.
        cn: 人心是超自然、自然和反自然运动的中心。一切都始于心中。如果人的心得以洁净，他就会看见上帝。
    - type: paragraph
      text:
        ru: Но как мы увидим Бога? Может быть, Бог антропоморфичен? У Него человеческий образ? Нет! Бог невидим, Он – Дух, но Он может воцариться в человеческом сердце, когда оно станет сосудом, способным Его принять.
        cn: 但是我们如何能看见上帝呢？难道上帝是拟人化的吗？祂有人的形象吗？不！上帝是不可见的，祂是灵，但是当人的心成为一个能够领受祂的器皿时，祂就能在其中作王。
    - type: paragraph
      text:
        ru: Чтобы сердце стало таким сосудом, оно должно стать чистым от нечистых помыслов. Но для своего очищения сердце должно вкусить лекарства. Таким лекарством является молитва.
        cn: 为了让心成为这样的器皿，它必须脱离不洁的思虑而变得洁净。然而，为了自身的洁净，心必须领受良药。这样的良药就是祷告。
    - type: paragraph
      text:
        ru: Куда приходит царь, оттуда изгоняются враги. Когда в сердце войдет Христос, Его святое имя, тогда убегут оттуда колонны демонов.
        cn: 只要君王驾临，仇敌便会从那里被驱逐。当基督，祂的圣名进入人心时，成群的邪魔便会从那里逃离。
    - type: paragraph
      text:
        ru: Когда на престоле сердца действительно воссядет Христос, тогда Ему подчинится все. Так и царь, когда овладеет государством и воссядет на престоле, тогда подчинит себе всех мятежников и их воинов. То есть он изгонит врагов, умирит государство от внутренних волнений, и тогда наступит мир. Царь восседает на престоле и видит, что все подчиняются ему и платят дань. Тогда он радуется и ликует, видя, что борьба и труд покорили ему всех, принесли мир и успех.
        cn: 当基督真正地坐上心灵的宝座时，那时一切都将顺服于祂。正如君王，当他掌管了国家并坐上宝座时，那时他便会制服所有叛乱者和他们的士兵。也就是说，他将驱逐敌人，平息国家内部的动荡，那时和平就会降临。君王坐在宝座上，看到所有人都顺服他并缴纳贡赋。那时他便欢欣雀跃，看到争战和劳苦已使所有人都臣服于他，带来了和平与成功。
    - type: paragraph
      text:
        ru: То же самое происходит и в государстве нашего сердца. Там и враги, и восстания, и помыслы, и страсти, и немощи, и бури, и возмущения. Все это в сердце человека.
        cn: 同样的事情也发生在我们心灵的国度里。在那里有仇敌、有叛乱、有意念、有情欲、有软弱、有风暴、有骚动。所有这些都在人的心里。
    - type: paragraph
      text:
        ru: Чтобы государство сердца умирилось и стало послушным, туда должен прийти Христос-Царь со Своим войском, захватить власть, изгнать врага-диавола, умирить всякое возмущение страсти и немощи и воцариться, подобно всесильному императору. Тогда это состояние, по выражению отцов, называется сердечным безмолвием, то есть когда царствует непрерывная молитва, которая очищает и умиротворяет сердце.
        cn: 为了让心灵的国度平息下来并变得顺服，基督君王必须带着祂的军队降临那里，夺取权柄，驱逐仇敌——魔鬼，平息情欲与软弱的一切骚动，并像一位全能的皇帝那样掌权为王。那时，这种状态，按教父们的说法，被称为心灵的静默，即是当不间断的祷告掌权之时，这祷告洁净并安宁心灵。
    - type: paragraph
      text:
        ru: Много способов молитвы. Существует, конечно, устный способ, то есть проговаривание молитвы устами. Это тот способ, который мы должны использовать вначале, начиная заниматься молитвой, чтобы достигнуть нашей конечной цели.
        cn: 祷告的方式有多种。当然，存在口祷的方式，即用口诵念祷告。这是我们在起初，开始操练祷告时，为达到我们最终目的所必须采用的方式。
    - type: paragraph
      text:
        ru: Ум человека приснодвижим, всегда находится в движении. И поскольку он движется не по естеству и не по назначению, а противно своему назначению, то бегает по всему миру и упокаивается в различных наслаждениях.
        cn: 人心永不停歇地运动着，总是处于活动之中。又因为它不按本性、也不按其功用运动，反而是违背其功用，所以便奔走于整个世界，在各种享乐中安息。
    - type: paragraph
      text:
        ru: Иногда он движется к плотскому и наслаждается, иногда – к другим страстям, а иногда просто глазеет по сторонам. Куда бы он ни пошел, на чем бы он ни остановился, везде он чем-нибудь наслаждается.
        cn: 有时，他转向属肉体之事并以此为乐；有时，转向其他情欲；有时，则只是四处张望。无论他去到何处，无论他停留在何物之上，他无不在其中寻得一些乐趣。
    - type: paragraph
      text:
        ru: Теперь, человек, который желает достичь непрестанной молитвы (см.:1Фес.5:17), должен собрать свой рассеяный ум, этого бродягу, слоняющегося по переулкам, чтобы он исправился и стал хозяином.
        cn: 现在，凡渴望达到恒常祷告（参阅：帖撒罗尼迦前书 5:17）的人，务必收敛其散乱的心智，这个在街巷中游荡的流浪者，使其得以纠正，并成为主人。
    - type: paragraph
      text:
        ru: Но чтобы его собрать, необходимо принести ему какую-либо сладость, потому что, как мы сказали, ему нравится слоняться то там, то здесь. Мы должны привлечь его чем-то сладким. Поэтому вначале необходимо молитву проговаривать устами.
        cn: 但要将它聚集起来，就需要带给他某种甜美之物，因为，正如我们所说，它喜欢漫无目的地游荡，一会儿在这里，一会儿在那里。我们必须用某种甜美之物吸引它。因此，起初必须口诵祷文。
    - type: paragraph
      text:
        ru: Новоначальный, который учится молитве, должен начать устами произноситьГосподи, Иисусе Христе, помилуй мя, и стараться отвлекать от мирского свой ум. Голос, который будет исходить, звук голоса будет привлекать ум, чтобы он внимал молитве. Тогда ум постепенно будет приучаться собираться и не рассеиваться.
        cn: 初学者，在学习祷告时，应该开始用口诵念「主耶稣基督，求祢怜悯我」，并努力使自己的心神脱离世俗。口中所发出的声音，那声音的响动，将会吸引心神，使其专注于祷告。这样一来，心神便会逐渐习惯于集中，而不涣散。
    - type: paragraph
      text:
        ru: Конечно, и старание, и внимание, и желание, и преследуемая нами цель достижения непрестанной молитвы помогают нам сосредоточиться.
        cn: 当然，努力、专注、渴望，以及我们所追求的达成不间断祷告的目标，都帮助我们集中精神。
    - type: paragraph
      text:
        ru: При таком произнесении молитвы со временем приходит некое удовлетворение, некая радость, мир, нечто духовное, чего не было у нас раньше. Это постепенно привлекает ум.
        cn: 如此诵念祷告，久而久之，便会生出一种慰藉，一种喜乐，平安，以及我们以前所没有的属灵之物。这会逐渐吸引心思。
    - type: paragraph
      text:
        ru: Когда устная молитва преуспевает и привлекает ум вовнутрь, тогда дает уму свободу произносить молитву самому без участия уст, приобретается некоторый плод. Потом, когда через уста, а когда через ум, молитва постепенно начинает господствовать в душе.
        cn: 当口祷渐有成效，并将心智引入内在时，便赋予心智自行诵念祷文的自由，而口舌无需参与，此时便获得了一些果实。之后，或通过口舌，或通过心智，祷文便逐渐开始在灵魂中占据主导地位。
    - type: paragraph
      text:
        ru: Ум, беседуя в молитве, начинает входить в сердце. И где бы человек ни был, он будет видеть, как его сердце произносит молитву.
        cn: 理智在祷告中对话时，便开始进入心中。无论人在何处，他都会看见他的心在诵念祷告。
    - type: paragraph
      text:
        ru: Для чего мы пришли сюда? Разве не для того, чтобы найти Бога, обрести Его благодать, мир, свободу от страстей? Так вот, все это придет благодаря этой молитве. Молитва произведет внутри теплоту, пламя. Когда молитва родит теплоту, теплота принесет еще большую молитву и так далее. И тогда, когда это произойдет, вы увидите, как пожигаются немощи, пожигаются помыслы, постепенно пожигаются страсти. Заканчивается это чистотою сердца, когда придут Отец, Сын и Дух Святый и сотворят обитель, жилище в сердце.
        cn: 我们为何来到这里？难道不是为了寻得上帝，获得祂的恩典、平安，并摆脱情欲的自由吗？那么，这一切都将藉着这祷告而来临。祷告会在内心深处生发暖意，火焰。当祷告生发出暖意时，这暖意会带来更大的祷告，如此循环往复。而当这一切发生时，你们将看到软弱被焚烧殆尽，意念被焚烧殆尽，情欲也逐渐被焚烧殆尽。这一切最终以心之纯洁告终，届时，圣父、圣子和圣灵将临在，并在心中设立居所，建造殿宇。
    - type: paragraph
      text:
        ru: Святые отцы говорят, что ум легко пачкается и легко очищается. Сердце трудно пачкается и с трудом очищается. Ум, как только наткнется на плохое, тут же оскверняется. Но сердце не сразу становится участником скверны. Когда, благодаря сердцу, наступит духовное состояние, но потом оно пропадет и ум начнет оскверняться различными предметами, то сердце изменяется нелегко, потому что прежде изменилось благодатью, и с трудом, шаг за шагом преуспевает во зле.
        cn: 圣教父们说，心神易受玷污，也易得洁净。心则难受玷污，也难得洁净。心神一旦遭遇恶事，立刻就受玷污。但心并非立刻涉入污秽。当借由心，一种属灵状态得以实现，但随后它会消逝，心神也开始被各种事物所玷污时，那么，心就不易改变，因为它之前已被恩典所改变，并且艰难地、循序渐进地在邪恶中步步进展。
    - type: paragraph
      text:
        ru: Поэтому, чтобы преобразить сердце из плотского, страстного и эгоистичного в бесстрастное, необходима молитва. Когда очистится центр, тогда очистится и все вокруг. Молитва изгонит отчаяние, уныние, нерадение, леность и принесет новое произволение, новую жажду новых подвигов.
        cn: 因此，为了将心从属肉的、情欲的和自私自利的状态，转化为无情欲的状态，祷告是必不可少的。当中心被洁净时，那么周围的一切也都会洁净。祷告将驱逐绝望、灰心丧志、懈怠和懒惰，并带来新的意愿，以及对新的功行的新渴慕。
    - type: paragraph
      text:
        ru: Когда мы это почувствуем, тогда постигнем плод молитвы, ее цель. Тогда мы уразумеем, что Царство Небесное внутри нашего сердца:«Царствие Божие внутрь вас есть»(Лк.17:21).
        cn: 当我们感受到这一点时，我们便能领悟祷告的果实，及其目的。那时我们便会明白，天国就在我们内心深处：「上帝的国就在你们心里」（路加福音 17:21）。
    - type: paragraph
      text:
        ru: Там, в сердце, с помощью «лопаты» молитвы, вдыхая и выдыхая и стараясь вниманием удерживать ум в сердце, мы обрящем сокрытый жемчуг. Что это за жемчуг? Это благодать Святаго Духа, которую мы получили в крещении. Если мы предались страстям, то благодать погребена.
        cn: 在那里，在我们的心中，借着祷告这把「铲子」，在一呼一吸之间，并努力以专注将心智持守在心中，我们将寻得那被隐藏的珍珠。这珍珠是什么？这是我们在洗礼中领受的圣灵的恩典。如果我们屈服于诸情欲，那么恩典就被埋没了。
    - type: paragraph
      text:
        ru: Старец Иосиф часами творил сердечную молитву. Когда он уставал, то отдыхал в созерцаниях, и потом снова сердечная молитва. До 7–8 часов кряду он творил молитву.
        cn: 长老约瑟夫数小时地操练心祷。当他感到疲惫时，他便在默观中休息，之后又进行心祷。他曾连续七八个小时地进行祷告。
    - type: paragraph
      text:
        ru: Постепенно в молитвенной беседе человек внутренне совершенствуется. Сердце непрестанно очищается и потом приобретает безмолвие.
        cn: 逐渐地，在祷告的对话中，人内在得到完善。心不停地被洁净，然后获得静默。
    - type: paragraph
      text:
        ru: Святые отцы, на протяжении многих лет занимаясь молитвой, достигли высоких состояний. Они приходили в созерцания, в исступления, выходили из самих себя, были пленяемы в созерцания, как апостол Павел:«аще в теле,... аще вне тела, не вем»(ср.:2Кор.12:2). То же было и со многими другими святыми.
        cn: 圣教父们，多年来专注祷告，达到了崇高的境界。他们进入默观，进入神魂超拔，超越自身，被提入默观，如同使徒保罗所言：「或在身内，或在身外，我不知。」(参：哥林多后书 12:2)。许多其他圣徒亦是如此。
    - type: paragraph
      text:
        ru: 'Святой Максим Кавсокаливит, когда был спрошен святымГригорием Синаитомо молитве, сказал: «Прости меня, отче, я прельщенный».– «Сейчас не надо об этом, – сказал ему святой Григорий, – расскажи мне, ради Господа, о своей добродетели. Скажи мне, прошу тебя, держишь ли ты умную молитву?». Тогда святой Максим рассказал, как на протяжении долгого времени молился Божией Матери, прося дать ему благодать умной молитвы. Однажды теплота изошла из иконы Божией Матери и вошла в его сердце. И сердце начало изнутри говорить молитву. Потом, принуждаемый святым Григорием, он сказал ему, что плодом умной молитвы была великая любовь к Богу и пленение ума в созерцания. Это происходит по действию Святаго Духа и иногда уводит его в невещественный воздух Божественного света, или приводит к Божественной беседе, или к какому-либо другому неизреченному созерцанию.'
        cn: 圣马克西姆·卡夫索卡利维特在被圣格里高利·西奈特问及祷告时说：「请宽恕我，父啊，我已受了迷惑。」 – 「现在不必谈论这个，」圣格里高利对他说，「请祢为了上主告诉我，关于祢的德行。请祢告诉我，我恳求祢，祢是否持守着心祷？」 于是圣马克西姆讲述道，他在很长一段时间里向圣母祷告，祈求赐予他心祷的恩典。有一次，一股暖流从圣母圣像中发出并进入了他的心。于是心开始从里面发出祷告。后来，在圣格里高利的催促下，他告诉圣格里高利，心祷的果实是对上帝的极大爱以及心智在默观中的被虏。这发生于圣灵的作为之下，有时将他引入神圣光明的无形氛围中，或引他进入神圣的交谈，或进入任何其他不可言喻的默观。
    - type: paragraph
      text:
        ru: Все исходит из умной молитвы.
        cn: 一切都源于心智祷告。
    - type: paragraph
      text:
        ru: Преуспевая в молитве, мы обретем облегчение от страстей. Со временем сокрытые помыслы исчезнут, и наше сердце станет беззлобным сердцем ребенка.
        cn: 在祷告中长进，我们得以从情欲中获得解脱。久而久之，隐秘的意念将会泯灭，我们的心将会变成无邪的孩子之心。
    - type: paragraph
      text:
        ru: Но вначале, как было сказано, будет трудно, пока «дело не пойдет на лад». Это как в каком-либо ручном механизме, где необходимо усилие. Если этот механизм станет автоматическим, то эффективность повысится во много раз, работа не потребует никаких усилий. Так и молитва, когда со временем станет нашим достоянием, тогда будет твориться без труда и принесет много плода.
        cn: 但起初，如前所述，会很困难，直到「事情步入正轨」。这就像某种需要施力的手动机械。如果这个机械变得自动化，那么效率将提高许多倍，工作将不费吹灰之力。祷告也是如此，当它随着时间成为我们固有的，那么就会毫不费力地进行，并会带来丰盛的果实。
    - type: paragraph
      text:
        ru: Занимаясь молитвой, будем остерегаться дерзости, гордости, потому что это очень большое препятствие для молитвы. Посему необходимо многое самоукорение, постоянное осуждение себя самого.
        cn: 在祷告时，我们要警惕僭越和骄傲，因为这是祷告极大的障碍。因此，许多的自我谴责和不断地谴责自己是必要的。
    - type: paragraph
      text:
        ru: Когда мы заходим в кондитерскую, то видим пирожные, шоколадки, разные сладости. Так и в духовной кондитерской можно найти много различных вещей. Мы будем творить молитву, а там – что Бог пошлет. Мы будем делать все то, что необходимо, для Бога же важна сама молитва. Чем мы смиреннее, тем больше благодать во время молитвы.
        cn: 当我们走进糕点店，就会看到小蛋糕、巧克力和各种甜点。照样，在属灵的糕点店里也能找到许多不同的事物。我们进行祷告，至于在那里——就看上帝将赐予什么吧。我们会做一切必要的事，而对于上帝来说，重要的却是祷告本身。我们越是谦卑，在祷告时所蒙受的恩典就越多。
    - type: paragraph
      text:
        ru: Повторяю, что мы должны быть внимательными и не думать ни о чем во время молитвы. Здесь – эпицентр молитвы.
        cn: 我重申，我们必须在祷告时保持警醒，并心无杂念。这里是祷告的核心。
    - type: paragraph
      text:
        ru: 'Святой Григорий Палама говорит: «Когда молитва произносится через вдох и выдох, то со временем из ноздрей исходит духовное благоухание». Поистине это так и есть. Молитвой производится благоуханный воздух, который является не чем иным, как плодом молитвы, который созревает благодаря имени Христову. Что только не совершает имя Христово! Оно освящает Честные Дары. Именем Христовым приходит Святый Дух. Именем Христовым святые воскрешают мертвых. Для имени Христова все возможно.'
        cn: 圣格里高利·帕拉马斯说：「当祷告借着吸气和呼气发出时，那么久而久之，从鼻孔中会散发出属灵的馨香。」诚然，确是如此。借着祷告，会产生芬芳的空气，这正是祷告的果实，这果实因着基督之名而成熟。基督之名所成就的何其多！它祝圣尊贵圣礼。借着基督之名，圣灵降临。借着基督之名，圣徒使死人复活。对于基督之名，凡事皆有可能。
    - type: paragraph
      text:
        ru: Один святой отец говорил, что когда душа, имеющая эту молитву, выйдет из тела, то как возможно, чтобы рядом с ней стали демоны? Эта душа будет как бы одета в броню молитвы, и к ней не смогут приступить демоны. Так велика польза от этой молитвы.
        cn: 一位圣教父曾言，当拥有这祷文的灵魂出离肉身时，恶魔怎能立于其侧呢？这灵魂将如同披戴着祷文的甲胄，恶魔便无法临近它。这祷文的益处是何等巨大啊！
    - type: paragraph
      text:
        ru: 'Я полагаю, что уже рассказывал вам о некотором паломнике, который был посвящен в умную молитву. От многого чтения, самоотречения и безпопечения, которое у него было, как у человека, свободного от семьи, работы и многого другого, он непрестанно произносил молитву и чувствовал огромную любовь ко Христу. Действительно, в его душе была Божественная любовь. Он страстно желал поехать ко Святому Гробу. Он думал, что там насладится любовью возлюбленного Христа. Итак, он поехал в Иерусалим ко Гробу Христову и вошел в Кувуклию, чтобы приложиться к нему. Он почувствовал сильнейшую духовную любовь. Он помышлял, что здесь был погребен Тот, Которому он покланяется, то есть Иисус Христос, здесь Его пустой Гроб и тому подобное. Во время поклонения Святому Гробу он испустил дух! Люди, увидев это, сказали: «Давайте-ка посмотрим, что скрывал в сердце этот человек!». Сделали вскрытие, разрезали его сердце и остолбенели: в сердце его были написаны слова: «Иисусе, сладкая моя любовь…».'
        cn: '我想，我大概已经跟你们讲过一位朝圣者，他被授予了心祷。由于他勤于阅读，自我否定，并且无忧无虑——因为他是一个脱离了家庭、工作以及许多世俗事务的人——他不间断地诵念心祷，并对基督怀有巨大的爱。的确，他的灵魂中充满了神圣的爱。他热切地渴望前往圣墓。他想，在那里，他会沉浸在所爱基督的爱中。


          于是，他前往耶路撒冷，去到基督的圣墓，进入了圣龛（库福克利亚），为了瞻仰和亲吻它。他感受到一种极其强烈的属灵之爱。他思索着，他所敬拜的那一位，亦即耶稣基督，曾在此处被安葬，如今这里是祂空空的坟墓，等等。在他敬拜圣墓的时候，他溘然离世！人们看到此景，便说：「让我们来看看这个人心底究竟藏着什么吧！」他们进行了尸检，剖开了他的心脏，结果他们目瞪口呆：他的心中赫然写着这些字样：「耶稣，我甘甜的爱……」'
    - type: paragraph
      text:
        ru: Вы видите, каким богатым сделала его молитва? Как она обогатила его Божественной любовью? А теперь подумайте, где он оказался, сподобившись такой смерти? Конечно же, Ангелы взяли его душу и, увенчанную, светоносную, привели к престолу Христову.
        cn: 你们看见了吗，祷告使他变得多么富足？它又是如何以神圣的爱使他丰足的呢？现在你们再想想，当他得蒙如此的死亡时，他身在何处？当然，天使们接走了他的灵魂，那灵魂佩戴着冠冕，光芒四射，并将它引到基督的宝座前。
    - type: paragraph
      text:
        ru: 'Ангел, учивший святого Пахомия, говорил: «Многие образованные люди оставили и свою учебу, и ученые занятия и занялись молитвой». Только с помощью умной молитвы человек достигает бесстрастия. Ни чтением, ни каким другим образом невозможно достичь бесстрастия.'
        cn: 教导圣帕霍米的天使曾说：「许多饱学之士舍弃了他们的学业和学术追求，而致力于祷告。」唯有凭借理智祷告，人方能达致无情欲。无论是借着阅读，或是借着其他任何方式，都不可能达致无情欲。
    - type: paragraph
      text:
        ru: Молящийся таким образом возненавидит и пустословие, и дерзость, и многое другое, чтобы не потерять того состояния, которое обрел в молитве.
        cn: 这样祷告的人，会憎恶空谈、放肆和许多其他的事，以免失去在祷告中所得的那个状态。
    - type: paragraph
      text:
        ru: Молюсь, дабы Бог даровал вам чувство молитвы, и, когда придет благодать, тогда вы познаете все это на деле и поймете то, о чем я вам говорю.
        cn: 我祷告，愿上帝赐予你们祷告的感受；并且，当圣宠降临之时，那时你们便会在实践中体会到这一切，并会明白我所告诉你们的。
  - type: heading2
    text:
      ru: Главы об умной молитве
      cn: 心祷篇
    children:
    - type: paragraph
      text:
        ru: '1'
        cn: '1'
    - type: paragraph
      text:
        ru: Молитва – это главнейшая и мощнейшая сила, которая возрождает молящегося и дарует ему телесное и духовное здоровье.
        cn: 祷告是首要且最有力的力量，它使祷告者得以复兴，并赐予他肉体和属灵的健康。
    - type: paragraph
      text:
        ru: '2'
        cn: '2'
    - type: paragraph
      text:
        ru: Молитва – это очи и крылья нашей души. Она дает нам дерзновение и силу увидеть Бога.
        cn: 祷告是我们的灵魂的眼目与翅膀。它赋予我们坦然无惧与力量，以得见上帝。
    - type: paragraph
      text:
        ru: '3'
        cn: '3'
    - type: paragraph
      text:
        ru: Итак, молись, брате мой, устами, пока не просветит тебя Божественная благодать, чтобы ты молился сердцем. Тогда внутри тебя чудесным образом совершится праздник и торжество, и ты уже не будешь молиться устами, но со вниманием, которое действует в сердце.
        cn: 所以，我的弟兄，用口祷告吧，直到神圣的恩典光照你，使你用心祷告。那时，在你里面将奇妙地成就节期和庆典，你就不再用口祷告，而是以那在心中运行的专注来祷告。
    - type: paragraph
      text:
        ru: '4'
        cn: '4'
    - type: paragraph
      text:
        ru: Если ты действительно желаешь изгнать всякую антихристианскую мысль и очистить свой ум, то этого ты достигнешь только молитвой, поскольку так, как упорядочивает наши помыслы молитва, упорядочить их ничто не в силах.
        cn: 如果你真的渴望驱逐一切反基督的思想并洁净你的心智，那么你唯有通过祷告方能达成此愿；因为没有任何事物能像祷告那样，使我们的心思意念井然有序。
    - type: paragraph
      text:
        ru: '5'
        cn: '5'
    - type: paragraph
      text:
        ru: 'Внемли: если ты ленив и невнимателен в молитве, то не достигнешь преуспеяния ни в верности Господу, ни в стяжании мира помыслов и спасения.'
        cn: 谨记：如果你在祷告中懈怠且不专心，就无法取得进展：无论是在对上主的忠诚上，还是在思想平安的获取与救赎上。
    - type: paragraph
      text:
        ru: '6'
        cn: '6'
    - type: paragraph
      text:
        ru: Имя Иисуса Христа, которое мы призываем в молитве, содержит в себе самобытийную и самодействующую силу. Не волнуйся из-за несовершенства и сухости твоей молитвы, но ожидай с терпением плода частого призывания Божественного Имени.
        cn: 耶稣基督之名，我们于祷告中呼求此名，它本身包含着自存与自行运作之力。不要因你祷告的不足与枯干而忧虑，但要耐心等候常常呼求神圣之名所结出的果实。
    - type: paragraph
      text:
        ru: '7'
        cn: '7'
    - type: paragraph
      text:
        ru: Наши нравственные силы, когда руководятся молитвой, становятся сильнее всех искушений и побеждают их.
        cn: 我们的道德力量，当蒙祷告引导时，会变得比一切诱惑都更强大，并战胜它们。
    - type: paragraph
      text:
        ru: '8'
        cn: '8'
    - type: paragraph
      text:
        ru: Частота молитвы превращается в привычку к молитве, которая не замедляет стать второй природой и часто приводит ум и сердце в высшее духовное состояние. Частота в молитве – это единственный способ достижения высот истинной и чистой молитвы. Частота является лучшим способом подготовки к молитве и безопаснейшим путем достижения конца молитвы и спасения.
        cn: 祷告的恒常会转化为祷告的习惯，这习惯很快便成为第二天性，并常引心思和心灵进入更高的灵性状态。在祷告中的恒常，是达至真正纯全祷告之高峰的唯一途径。恒常是预备祷告的最佳方式，也是达至祷告终点与救赎最稳妥的途径。
    - type: paragraph
      text:
        ru: '9'
        cn: '9'
    - type: paragraph
      text:
        ru: Каждый из нас может стяжать внутреннюю молитву – средство общения с Господом. Она даруется бесплатно, необходимо только старание, чтобы погрузиться в пучину молчания и глубину сердечную, а также забота о насколько только возможно частом призывании имени сладчайшего Иисуса Христа, которое наполняет человека радованием. Погружение в самих себя и исследование нашего внутреннего мира даруют нам возможность познать, что это за тайна – человек, почувствовать радость самопознания и пролить горькие слезы покаяния о своем падении и о немощи нашей воли.
        cn: 我们每个人都可以得着内在祷告——这与上主交通的途径。它白白蒙赐，所需要的只是努力，以便潜入寂静的深渊和心灵的深处，以及关怀尽可能频繁地呼求至甘甜的耶稣基督之名，这名使人充满喜乐。潜入我们自身并探索我们内在的世界，赐予我们机会去认识人——这奥秘——究竟为何，感受自我认识的喜乐，并倾流悔改的苦泪，为自己的堕落和我们意志的软弱。
    - type: paragraph
      text:
        ru: '10'
        cn: '10'
    - type: paragraph
      text:
        ru: 'Вся твоя душа да прилепится с любовью к мыслям, которые заложены в молитве, чтобы ум, сокровенное слово[23]и твоя воля, эти три составляющие души, стали едины и единое тремя, потому что таким образом человек, являющийся образом Святой Троицы, приходит в общение и соединяется со своим Первообразом, как сказал великий делатель и учитель умной молитвы божественный Григорий Палама Фессалоникийский: «Когда единое ума станет троичным, оставаясь единым, тогда соединяется с богоначальной триединой Единицей, исключая вход любой прелести и становясь превыше плоти, мира и миродержца».'
        cn: 你整个的灵魂应当爱慕地紧紧依附于那些蕴含在祷告中的思想，以使悟性、隐秘之言[23]以及你的意志，这灵魂的三种要素，成为合一，并一而三，因为如此一来，人作为圣三一的肖像，便进入交通，并与他的原型相结合，正如伟大的行者与心祷的导师、神圣的帖撒罗尼迦的格里高利·帕拉马斯所言：「当悟性作为一体成为三一的，却仍旧合一，便与那神始的三一合一者相结合，排除任何虚妄之灵的进入，并超乎肉体、世界和世界的掌权者。」
    - type: paragraph
      text:
        ru: '11'
        cn: '11'
    - type: paragraph
      text:
        ru: Цель молитвы заключается в том, чтобы соединить Бога и человека, чтобы привести Христа в человеческое сердце.
        cn: 祷告的目的在于使上帝与人结合，并将基督引入人心。
    - type: paragraph
      text:
        ru: '12'
        cn: '12'
    - type: paragraph
      text:
        ru: Где действие молитвы, там – Христос со Отцом и Святым Духом, единосущная и нераздельная Святая Троица.
        cn: 凡有祷告的行动之处，那里就有基督与父、与圣灵，即同本体、不可分离的圣三一。
    - type: paragraph
      text:
        ru: '13'
        cn: '13'
    - type: paragraph
      text:
        ru: Где Христос – Свет мира – там вечный свет иного мира, там мир и радость, там Ангелы и святые, там веселие Царства.
        cn: 基督，这世界之光，所在之处，便有彼世的永恒之光，便有平安与喜乐，便有天使与圣徒，便有天国的欢欣。
    - type: paragraph
      text:
        ru: '14'
        cn: '14'
    - type: paragraph
      text:
        ru: Блаженны те, кои оделись в Свет мира – Христа – в настоящей жизни, потому что они уже одели одежду нетления.
        cn: 福哉那些在今生穿上世界之光——基督——的人，因为他们已穿上不朽之衣。
    - type: paragraph
      text:
        ru: '15'
        cn: '15'
    - type: paragraph
      text:
        ru: Итак, цель умной молитвы привести Христа в сердце человека, изгоняя оттуда диавола и разрушая все его дело, которое он совершил благодаря греху. Потому что«для сего-то и явился Сын Божий, чтобы разрушить дела диавола»(1Ин.3:8), как говорит возлюбленный ученик. И потому только диавол знает невыразимую силу этих пяти слов и с бешеной яростью ополчается и воюет против этой молитвы.
        cn: 所以，智性祷告的目的是将基督带入人心，将魔鬼从那里驱逐出去，并摧毁它因着罪所成就的一切作为。因为，「上帝之子显现，正是为此，为要除灭魔鬼的作为」（约翰一书 3:8），正如蒙爱的门徒所说。因此，唯有魔鬼才深知这五个词语无法言喻的力量，并带着狂暴的愤怒攻击并对抗这种祷告。
    - type: paragraph
      text:
        ru: '16'
        cn: '16'
    - type: paragraph
      text:
        ru: Бесчисленное множество раз демоны устами бесноватых исповедали, что действие молитвы их пожигает.
        cn: 无数次，魔鬼借着被附者之口承认，祷告的力量焚烧着他们。
    - type: paragraph
      text:
        ru: '17'
        cn: '17'
    - type: paragraph
      text:
        ru: Поскольку Христос – это Свет мира, то те, кто не видят Его, не веруют в Него, все они, конечно же, слепы. И напротив, идут к свету те, кто подвизается исполнить заповеди Христовы. Они исповедуют Христа, поклоняются Ему как Богу и служат Ему. И тот, кто исповедует Христа своим Господом и Богом, тот благодаря силе призывания Его имени укрепляется в исполнении Его воли. Если же не укрепляется, то явно, что он исповедует Христа только устами, а сердцем далек от Него.
        cn: 既然基督是世界之光，那么那些看不见祂，不信祂的人，当然都是瞎眼的。反之，那些努力遵行基督诫命的人，则走向光明。他们宣认基督，敬拜祂为上帝，并事奉祂。而那宣认基督为自己的上主和上帝之人，藉着呼求祂圣名的力量，在遵行祂旨意上得以坚固。若非得以坚固，则显明他仅仅口头宣认基督，而内心却远离祂。
    - type: paragraph
      text:
        ru: '18'
        cn: '18'
    - type: paragraph
      text:
        ru: Молитва насколько единит нас со Христом, настолько отделяет нас от диавола. И отделяет нас не только от диавола, но и от мудрования мира, которое рождает и сохраняет страсти.
        cn: 祷告有多少使我们与基督合一，就有多少使我们与魔鬼分离。并且，它不仅使我们与魔鬼分离，也使我们与世界的思虑分离，这思虑滋生并维系着诸情。
    - type: paragraph
      text:
        ru: '19'
        cn: '19'
    - type: paragraph
      text:
        ru: Сатана («сатана» в переводе с сирийского означает «противник») молитвы есть леность. Сатана сатаны – желание молитвы, горение сердца.«Духом пламенейте, – говорит апостол, –Господу служите»(Рим.12:11). Это горение притягивает и удерживает в молящемся благодать и становится в нем светом, радостью и утешением неизглаголанным, для демонов же огнем, горечью и изгнанием. Благодать эта, пришедши, собирает ум от блуждания и услаждает его поминанием Бога, исцеляя его от всех лукавых и нечистых помыслов.
        cn: 祷告的撒旦（「撒旦」在叙利亚语中意为「仇敌」）乃是怠惰。撒旦的撒旦——乃是祷告的渴慕、心火炽热。使徒说：「在灵里火热，服事上主。」（罗马书 12:11）这炽热吸引并维系住祈祷者心中的恩典，并在他里面成为光、喜乐和难以言喻的安慰，对于恶魔而言，则成为火焰、苦涩和驱逐。这恩典临到时，将心神从游荡中收敛，并以记念上帝使其心神得享甘美，医治它脱离一切邪恶和不洁的意念。
    - type: paragraph
      text:
        ru: '20'
        cn: '20'
    - type: paragraph
      text:
        ru: В устах молитва? Там и благодать. Но из уст она должна пройти в ум, опуститься в сердце. Для этого требуется много труда и времени.
        cn: 祷告在口中吗？恩典便在那里。但它必须从口中进入心思，降入心中。为此需要许多劳苦和时间。
    - type: paragraph
      text:
        ru: '21'
        cn: '21'
    - type: paragraph
      text:
        ru: Язык должен утрудиться, расплачиваясь за все свое пустословие и все падения, чтобы родилась привычка, потому что без труда и подвига привычка не рождается. Должно проявиться смирение, чтобы пришла благодать. Потом открывается путь. Молитва прилепляется к дыханию, а ум пробуждается и следит за ней. Со временем ослабевают страсти, умиряются помыслы и утихает сердце.
        cn: 舌头必须受劳苦，为它一切的空谈和一切的过犯付出代价，以便习惯得以养成；因为没有劳苦和苦修，习惯就不能养成。谦卑必须显现，好使恩典临到。接着，道路就敞开了。祷告紧贴着呼吸，而心神则醒悟过来并随之警醒。随着时间的推移，情欲就减弱了，意念就平息了，心也就安静下来了。
    - type: paragraph
      text:
        ru: '22'
        cn: '22'
    - type: paragraph
      text:
        ru: Не изнемогай, сколько бы раз ты ни возвращал убежавший ум. Бог увидит твое расположение и труд и пошлет Свою благодать, которая соберет ум. Когда присутствует благодать, тогда все делается с радостью и без труда.
        cn: 不要气馁，无论你多少次召回那逃逸的心神。上帝会看见你的心志和辛劳，并会派遣祂的恩典，那恩典会收摄你的心神。当恩典临在时，那时一切都会带着喜乐，且不费力地成就。
    - type: paragraph
      text:
        ru: '23'
        cn: '23'
    - type: paragraph
      text:
        ru: С молитвой мы идем от одной радости к другой. Без молитвы – от падения к падению, от скорби к скорби; и тяжело обличение совести. Кратко сказать, за небольшой труд и боль в молитве мы получаем много радостотворной печали, умиления, слез и сладости присутствия Божия, чистейшего Его страха, который очищает ум и сердце и делает их непорочными.
        cn: 藉着祷告，我们从一个喜乐走向另一个喜乐。没有祷告，我们则从一个跌倒走向另一个跌倒，从一个忧伤走向另一个忧伤；并且良心的责备是沉重的。简而言之，为着在祷告中那微小的劳苦与痛苦，我们便会得到许多生发喜乐的忧伤、痛悔之心、眼泪、上帝同在的甘甜，以及祂最纯净的敬畏，这敬畏洁净人的心思和心灵，使它们纯全无瑕。
    - type: paragraph
      text:
        ru: '24'
        cn: '24'
    - type: paragraph
      text:
        ru: Необходимо очиститься сердцу, чтобы от него просветился ум чистыми небесными помыслами, которые отражаются в нем.
        cn: 心灵必须洁净，以便心智能从其中被纯净属天的意念所光照，这些意念倒映在心智中。
    - type: paragraph
      text:
        ru: '25'
        cn: '25'
    - type: paragraph
      text:
        ru: Как невозможно не преткнуться идущему в ночи, так невозможно не грешить еще не видевшему Божественный свет.
        cn: 正如在黑夜中行走的人不可能不跌倒，同样，尚未见过神圣之光的人也不可能不犯罪。
    - type: paragraph
      text:
        ru: '26'
        cn: '26'
    - type: paragraph
      text:
        ru: В Царство Божие входят не нераскаянные, а грешники, преображенные покаянием и слезами. Ничто так не помогает человеку бороться со страстями и побеждать их, как непрестанная умная молитва.
        cn: 进入上帝的国度的，不是不悔改的人，而是那些被悔改和泪水所改变的罪人。没有什么能像不间断的默祷那样，如此帮助人去对抗情欲并战胜它们。
    - type: paragraph
      text:
        ru: '27'
        cn: '27'
    - type: paragraph
      text:
        ru: 'Во время искушения ленью, когда ослабевает ум, язык и пальцы на четках, я прошу твою любовь: не отступай. Приложи еще немного усилия, чтобы Бог увидел твое произволение и укрепил тебя. Бог чего-то еще желает от тебя и оставляет этот час искушения для твоей пользы, потому что знает и ты знаешь, что ты это можешь.'
        cn: 在懒惰的诱惑中，当心智、舌头和念珠上的手指都变得软弱时，我祈求你的爱：不要退缩。再多努力一点，好让上帝看见你的意愿并坚固你。上帝还在期盼着你什么，并将这诱惑的时刻留下来为了你的益处，因为祂知道你也知道，你能做到。
    - type: paragraph
      text:
        ru: '28'
        cn: '28'
    - type: paragraph
      text:
        ru: 'Временами случается, что без повода с твоей стороны благодать умаляется. Бог как бы желает тебе сказать: «Все хорошо с твоей стороны, но не думай, что все зависит от тебя. Я прихожу и ухожу тогда, когда пожелаю. Я научу тебя совершенному отсечению своей воли и терпению, чтобы ты хорошенько выучил урок смирения».'
        cn: 有时会发生这样的情况，并非因为你有什么缘由，恩典却被削减了。上帝仿佛想要告诉你：「你这边一切都好，但不要以为一切都取决于你。我来去都在我所愿之时。我要教导你彻底舍弃你的意愿以及忍耐，以便你好好学习谦卑这一课。」
    - type: paragraph
      text:
        ru: '29'
        cn: '29'
    - type: paragraph
      text:
        ru: Посему в назначенный час понуждай себя, сколько можешь, исполняй свой долг, чтобы Бог был твоим должником. И если ты не получишь благодати, то приготовишь себя к следующему или послеследующему разу. Во всяком случае, рано или поздно, но ты ее получишь, и не можешь не получить. Более того, у Бога есть обычай, отлагая, позже давать гораздо большее.
        cn: 因此，在指定之时，你当尽你所能勉强自己，履行你的本分，好让上帝成为你的债务人。倘若你未曾领受恩典，你便当预备自己，为下一次或再下一次。无论如何，迟早你必会领受它，且不能不领受它。不仅如此，上帝有一个习性，便是延宕之后，赐予远为更丰盛的。
    - type: paragraph
      text:
        ru: '30'
        cn: '30'
    - type: paragraph
      text:
        ru: Поле сердца воздает плод в зависимости от вспахивания молитвой, орошения слезами и прополки помыслов.
        cn: 心田结出果实，取决于用祷告耕耘，用泪水浇灌，以及除净思虑。
    - type: paragraph
      text:
        ru: '31'
        cn: '31'
    - type: paragraph
      text:
        ru: 'Преуспевшие в молитве несомненно знают только одно: что, независимо от труда человека, молитва – это дело благодати.'
        cn: 在祷告上精进的人，无疑只知一事：即，不倚赖人的劳作，祷告乃是恩典的作为。
    - type: paragraph
      text:
        ru: '32'
        cn: '32'
    - type: paragraph
      text:
        ru: Святой Симеон ясно говорит, что никто не может сам славословить Бога, но благодать Христова, поселившаяся в нем, славословит, воспевает Бога и творит в нем молитву.
        cn: 圣西缅清楚地指出，没有任何人能够凭自己颂赞上帝，而是基督的恩典，内住于他里面，颂赞上帝、歌颂上帝，并在他里面运行祷告。
    - type: paragraph
      text:
        ru: '33'
        cn: '33'
    - type: paragraph
      text:
        ru: Знаком посещения души благодатью Божией является молитва со страхом и благоговением, стояние на ней с благоприличием и великим вниманием к молитве.
        cn: 灵魂蒙受上帝恩典眷顾的标志，乃是带着敬畏和虔诚的祈祷，并在祈祷中保持端庄得体与极大的专注。
    - type: paragraph
      text:
        ru: '34'
        cn: '34'
    - type: paragraph
      text:
        ru: Внимание настолько должно быть связано с молитвой и неразлучно с ней, как связана и неразлучна с телом душа.
        cn: 专注应当如此与祷告紧密相连，并与之密不可分，如同灵魂与身体紧密相连、密不可分。
    - type: paragraph
      text:
        ru: '35'
        cn: '35'
    - type: paragraph
      text:
        ru: Ум во время молитвы должен хранить сердце и ограждать его изнутри и из глубины сердечной воссылать молитвы Богу, непрерывно говоря:Господи, Иисусе Христе, помилуй мя. И когда там, внутри сердца, ум вкусит и познает, что благ Господь, и усладится, то не захочет более он удаляться от сердечного места, говоря вместе с апостолом Петром:«хорошо нам здесь быть»(Мф.17:4). И он оградит сердце, отталкивая неким образом и изгоняя все помышления, которые посеваются внутри диаволом, не оставляя никакого помышления сего мира, но становясь нищим духом, нищим от всякого мирского помысла.
        cn: 心智在祷告时应当保守心灵并护卫它，从内心深处向上帝献上祷告，不断地说：「上主，耶稣基督，怜悯我。」当在那里，在心灵之内，心智尝到并认识到上主是美善的，并从中得到甘甜时，它就不再愿意离开心灵之处，偕同宗徒伯多禄说：「我们在这里真好」（马太福音 17:4）。它将护卫心灵，以某种方式推开并驱逐所有意念，这些意念是魔鬼在内心播种的，不留下任何属世的意念，而是成为神贫的，贫乏于一切属世的思虑。
    - type: paragraph
      text:
        ru: '36'
        cn: '36'
    - type: paragraph
      text:
        ru: Это делание для тех, кто его не познал, кажется очень трудным и скучным. Но вкусившие сладость, заключающуюся в этом делании, и насладившиеся сладостью в глубине своего сердца, кричат вместе с божественным Павлом:«Кто отлучит нас от любви Христовой»(ср.:Рим.8:35)?
        cn: 对于那些未曾认识这修持的人来说，它似乎非常艰难和乏味。但那些尝过这修持中所蕴含的甘甜，并在内心深处享受到这甘甜的人，则与神圣的保罗一同呼喊：「谁能使我们与基督的爱隔绝呢？」 (罗马书 8:35)
    - type: paragraph
      text:
        ru: '37'
        cn: '37'
    - type: paragraph
      text:
        ru: Итак, наши святые отцы, слыша Господа, Который говорит, что от сердца исходят помыслы, оскверняющие человека[24], и снова, что мы должны очистить внутреннее сосуда, чтобы и внешнее стало чисто[25], оставили всякое другое духовное делание и целиком предались этому деланию, то есть хранению сердца, будучи уверенными, что вместе с этим деланием они легко приобретут и любую другую добродетель.
        cn: 故此，我们的圣教父们，听闻上主说，从心里发出意念，污秽人[24]，又说，我们应当洁净器皿的里面，好使外面也干净[25]，便舍弃了其他一切属灵的操练，并完全投身于此操练，即是守心，他们确信借着此操练，能轻易地获得以及任何其他的德行。
    - type: paragraph
      text:
        ru: '38'
        cn: '38'
    - type: paragraph
      text:
        ru: 'Святой и богоносный Симеон Новый Богослов говорит: «Очистим свои сердца, чтобы найти в них везде присутствующего Господа. Очистим свои сердца огнем Его благодати, чтобы увидеть внутри себя свет и славу Его Божества».'
        cn: 圣负神者西美翁新神学家说道：「洁净我们的心，以便在其中寻见遍在的主。洁净我们的心，借着祂恩典的烈火，以便在自身之内得见祂神性的光与荣耀。」
    - type: paragraph
      text:
        ru: '39'
        cn: '39'
    - type: paragraph
      text:
        ru: Счастливы те, кои приблизились к Божественному свету, вошли в него, соединились со светом и все стали свет, потому что они совершенно совлеклись оскверненной одежды греха и уже не будут плакать горькими слезами.
        cn: 福哉那些亲近了神圣之光，进入了它，与光合一，且都成了光的人，因为他们已彻底脱去了罪污的衣裳，且不再流苦泪了。
    - type: paragraph
      text:
        ru: '40'
        cn: '40'
    - type: paragraph
      text:
        ru: Счастливы те, которые еще здесь познали свет Господень, как Его Самого, потому что они предстанут перед Ним в будущей жизни с дерзновением.
        cn: 福哉那些仍在今世认识上主的光、如同祂本身的人，因为他们将来生能坦然无惧地侍立在祂面前。
    - type: paragraph
      text:
        ru: '41'
        cn: '41'
    - type: paragraph
      text:
        ru: Счастливы те, кто принял Христа, Который пришел к ним как свет. Раньше они были во тьме, а теперь стали сынами Света и Невечернего Дня.
        cn: 幸福的那些人，他们接受了基督，祂来到他们那里，如同光。之前他们身处黑暗中，而今他们已成为光明之子和永不落幕之日。
    - type: paragraph
      text:
        ru: '42'
        cn: '42'
    - type: paragraph
      text:
        ru: Поистине ничего нет, подобного дыханию молитвы, непрестанной умной молитвы.
        cn: 诚然，没有什么比得上祷告的呼吸，比得上不间断的心祷。
    - type: paragraph
      text:
        ru: '43'
        cn: '43'
    - type: paragraph
      text:
        ru: Святой Григорий Палама говорит, что молитва, действующая при вдохе и выдохе, со временем исходит из ноздрей молящегося как сладкое дуновение благодати, аромат благоухания духовного, «запах жизни в жизнь»[26], по великому Павлу.
        cn: 圣格里高利·帕拉马说，在呼吸（吸气与呼气）中运作的祷告，随着时间会从祷告者的鼻孔中散发出来，如同恩典的甘甜气息，属灵芬芳的香气，依据伟大的保罗所言，「生命的香气入于生命」[26]。
    - type: paragraph
      text:
        ru: '44'
        cn: '44'
    - type: paragraph
      text:
        ru: 'Итак, смотри: молитва дарует благодать не только молящемуся, но, переливаясь через край, разливается, передается через него творению. Когда он вдыхает, то очищается, оживотворяется, освящается сам. Когда он выдыхает, то не сам он, а Божественная благодать очищает, оживотворяет и освящает творение.'
        cn: 如此，请看：祷告赐予恩典，不仅赐予祷告者，然而，恩典满溢而出，倾流、并通过他传递给受造之物。当他吸气时，他自己被洁净、被赐予生命、被圣化。当他呼气时，并非他自己，而是神圣的恩典洁净、赐予生命并圣化受造之物。
    - type: paragraph
      text:
        ru: '45'
        cn: '45'
    - type: paragraph
      text:
        ru: В эти последние дни, когда дыхание антихриста оскверняет землю, море и все дыхание жизни, Бог раздувает в груди и в сердце Церкви действие умной молитвы, как освежающую росу благодати, как дуновение ветерка у пророка Илии, как противоядие, обеспечивающее душевное и телесное здоровье во дни грядущие и еще имеющие прийти.
        cn: 在这些末后的日子里，当敌基督的气息玷污大地、海洋和所有生命的气息时，上帝在教会的胸膛和心中，激发起心祷的实行，如同恩典的清新甘露，如同先知以利亚所经历的微风，如同一剂解药，保障在将要来临和持续到来的日子里灵魂与身体的健康。
    - type: paragraph
      text:
        ru: '46'
        cn: '46'
    - type: paragraph
      text:
        ru: Я знаю тысячи душ в миру, я бы сказал, во всем мире, которые понуждают себя на молитву, и это приносит чудесные плоды. Молитва укрепляет их в духовном подвиге, она просвещает их внутри, и они исповедуются глубоко, искренне, и, огорченные своими помыслами и искушениями, которые поднимает молитва со дна души, с желанием прибегают к Пречистым Таинам. И снова на борьбу с помыслами и страстями, и снова к Таинам. И они не могут более жить без молитвы.
        cn: 我知道世上有数千灵魂，我要说，是全世界，他们勉力自己去祷告，这带来了奇妙的果实。祷告在他们的属灵苦修中坚固他们，它在他们内在光照他们，他们就深深地、真诚地告解，并因祷告从灵魂深处升起的意念和诱惑而忧伤，渴望领受纯洁的圣奥秘。于是再次投入与意念和情欲的争战，于是再次趋向圣奥秘。他们再也不能没有祷告而活。
    - type: paragraph
      text:
        ru: '47'
        cn: '47'
    - type: paragraph
      text:
        ru: Молитва – это дыхание. Когда человек дышит, то он живет, заботится о своей жизни. Начинающий молитву начинает исправлять всю свою жизнь под руководством своего духовного отца. И как солнце, восходя, пробуждает, освещает, оживотворяет творение, так и Солнце Правды, Христос, через молитву восходя в уме и в сердце человека, пробуждает его для дел света и невечернего дня.
        cn: 祷告是呼吸。当人呼吸时，他便活着，照管自己的生命。开始祷告的人，在他的属灵父亲的指引下，开始修正他全部的生命。正如太阳升起时，唤醒、光照并赋予受造物生机；照样，公义的日头——基督，藉着祷告在人的心思和心里升起，唤醒他，使他投入光明的事工和永不落幕之日。
    - type: paragraph
      text:
        ru: '48'
        cn: '48'
    - type: paragraph
      text:
        ru: 'Итак, братия, начальник подвижников великий Антоний говорил: «Всегда дышите Христом». И апостол языков, назидая, просит и заповедует христианам всех времен – всем и повсюду:«Непрестанно молитесь»(1Фес.5:17). «Непрестанно же не имеет ни предела, ни меры», – толкуют божественные отцы.'
        cn: 所以，弟兄们，苦修者之长，大安东尼曾言道：「时时以基督为呼吸。」而万邦的使徒，教诲道，恳求并诫命历世历代的基督徒——所有在各处的人：「不住地祷告」(帖撒罗尼迦前书 5:17)。「而『不住地』，则无有止境，亦无有度量」，——圣教父们如此诠释道。
    - type: paragraph
      text:
        ru: 'Итак, во время мира не предавайся небрежению, но молись, исправляйся, готовься к войне, набирайся мужества. Не бойся искушений. Все подвержены изменениям, но подвиг требует терпения и настойчивости. Праведный, если и тысячу раз в день падет, восстает снова, и вменяется ему это в победу. Это и означает молитва: постоянное покаяние, непрерывное призывание Божественной милости.'
        cn: 那么，在平安时期不要陷入懈怠，而要祷告，修正自己，预备战争，积聚勇气。不要惧怕诱惑。万物皆受变迁影响，但属灵争战需要忍耐和坚韧。义人，即便一天跌倒千次，也会重新站起，这便归算给他为胜利。这也就是祷告：恒久的悔改，不间断地呼求神圣的怜悯。
    - type: paragraph
      text:
        ru: Дающему же молитву молящемуся – Христу Богу нашему – слава и благодарение во веки. Аминь.
        cn: 向那将祷告赐予祈祷者、我们的上帝基督，愿荣耀和感谢永归于祢。阿们。
  - type: heading2
    text:
      ru: Три слова о послушании
      cn: 论顺服三言
    children: []
  - type: heading2
    text:
      ru: Слово первое
      cn: 第一篇
    children:
    - type: paragraph
      text:
        ru: Я вам уже об этом рассказывал, но для наших новых братьев, которые еще не слышали, я бы хотел снова обратиться к этой истории и дать вам уразуметь, что такое послушание.
        cn: 我已向你们讲述过此事，但为了我们新的弟兄们，他们尚未听闻此事的，我愿再次回溯这个故事，并让你们领悟何为顺服。
    - type: paragraph
      text:
        ru: На Катунаках[27]был один старец, именем Кирилл, и у него был послушник. Послушник этот досаждал старцу и огорчал его своим частым непослушанием. Со временем он начал плохо себя чувствовать. Еще не достигнув заключительной стадии беснования, он вел себя странным образом. С нашими отцами, Афанасием и Иосифом, он ходил собирать лесные орехи, но и это оказалось для него слишком трудным. От этого человека пахло серой, о чем я знаю по собственному опыту. Он носил в себе ненормальные помыслы, и вид его показывал все его состояние. Иногда он приходил и к нашему старцу Иосифу и говорил ему о своих помыслах, советовался, но ни в чем не исполнял послушания.
        cn: 在卡图纳克斯[27]，曾有一位名叫基里尔的长老，他有一个侍从修士。这位侍从修士因经常不顺从，令长老烦恼并使他忧伤。渐渐地，他开始感觉不适。尽管尚未达到被鬼附的最后阶段，他的行为举止却很奇怪。他曾和我们的两位教父，阿塔纳修斯和约瑟夫一起去采摘榛子，但对他来说，这也太过艰难了。这个人身上散发着硫磺味，我对此深有体会。他心中怀着不正常的意念，他的外表也显露出他全部的状况。有时他也来到我们的长老约瑟夫那里，告诉他自己的意念，寻求建议，但在任何事情上都不顺从。
    - type: paragraph
      text:
        ru: 'Прежде своей смерти отец Кирилл сказал ему: «Чадо мое, когда я умру, похорони меня здесь». Но он, когда умер его старец, похоронил его в ином месте. Другие отцы советовали ему не проявлять непослушания хотя бы теперь и исполнить последнюю волю своего старца, но он отвечал: «Нет, я хочу погребсти его здесь».'
        cn: 在他去世前，基里尔神父对他说：「我的孩子啊，当我死后，把我葬在这里。」 但他，当他的长老去世后，却把他葬在另一个地方。其他神父们建议他即使现在也不要再表现出不顺从了，并遵从他长老的最后遗愿，但他回答说：「不，我就是要把他葬在这里。」
    - type: paragraph
      text:
        ru: 'Когда он похоронил старца, явился ему диавол и говорит: «Ведь это я все тебе устроил, я подталкивал тебя огорчать старца своим непослушанием». И как только он открыл свои уста, диавол вошел через них внутрь, и с тех пор он стал совершать всякие безумные выходки… Во время пения Херувимской он кощунствовал, притворялся волком, зверем. Взял топор и разрубил икону святого Иоанна Богослова. Жил он то там, то здесь, лишь изредка приходя в себя.'
        cn: 当他埋葬了那位长老，魔鬼向他显现并说：「这一切都是我为你安排的，是我唆使你用不顺服来使那位长老忧伤的。」就在他张开嘴巴的那一刻，魔鬼便通过他的嘴巴进入他里面，从那时起，他就开始做出各种疯狂的举动……在咏唱赫鲁维姆圣歌的时候，他亵渎神圣，假装成狼，成野兽。他拿起一把斧头，砍碎了圣约翰·神学家的圣像。他居无定所，只是偶尔才会清醒过来。
    - type: paragraph
      text:
        ru: 'Однажды в полдень послышался лай лисы. Отец Иосиф Киприот говорит мне:'
        cn: 一日正午，传来狐狸的吠叫声。约瑟夫·塞浦路斯神父对我说：
    - type: paragraph
      text:
        ru: – Смотри-ка, какое нахальство имеет лисица! Днем в полдень не боится и лает.
        cn: —— 你看，这狐狸多么嚣张！大白天正午的，它竟不怕，还吠叫。
    - type: paragraph
      text:
        ru: 'Я ему говорю:'
        cn: 我对他（或「我对他」或「我对他说」）说：
    - type: paragraph
      text:
        ru: – Это не лиса, это бесноватый отец Иоанн.
        cn: – 这不是狐狸，这是被鬼附的约翰神父。
    - type: paragraph
      text:
        ru: – Не верю, – отвечает он мне.
        cn: 「我不信。」他回答我。
    - type: paragraph
      text:
        ru: – Тогда подожди и увидишь сам, – говорю я ему.
        cn: – 那么你等着自己看吧，– 我对他说道。
    - type: paragraph
      text:
        ru: И действительно, вскоре проходит перед нашим домом отец Иоанн!
        cn: 果然，很快伊望神父就从我们家门前经过了！
    - type: paragraph
      text:
        ru: Я рассказываю вам все это для примера, чтобы вы уразумели, что такое послушание, и потому, что все это вам очень пригодится в будущем.
        cn: 我将这一切告诉你们，作为例子，以便你们理解何为顺服，并且因为这一切在未来对你们大有益处。
    - type: paragraph
      text:
        ru: В другой раз отец Иоанн, будучи в себе, пришел увидеть моего Старца – старца Иосифа. Согласно нашему уставу и заповеди Старца, я должен был уйти. Едва завидев чужого, я прятался. Как только он пришел, я зашел в соседнюю келию и сел там.
        cn: 另一次，伊望神父独自前来拜访我的长老——约瑟夫长老。依照我们的会规和长老的吩咐，我必须退避。我一看见外人，就躲藏起来。他刚一来，我就走进隔壁的会室，并在那里坐下。
    - type: paragraph
      text:
        ru: Старец Иосиф сидел на скамеечке. Пришел отец Иоанн и сел рядом с ним. Я знал от своего Старца, что он был бесноватым, потому что для вразумления и приобретения опыта Старец часто говорил мне о нем.
        cn: 长老约瑟夫坐在一张小板凳上。伊望神父来了，坐在他旁边。我从我的长老那里得知，他曾是一个被邪灵附身的人，因为为了训诫和获取经验，长老常常对我谈起他。
    - type: paragraph
      text:
        ru: Итак, сидя в соседней келии, я ради любопытства и получения пользы хотел услышать, что скажет отец Иоанн и что ему посоветует Старец.
        cn: 于是，我坐在隔壁的修士小室里，出于好奇，也为了获得益处，想听听约翰神父会说什么，以及长者会给他什么建议。
    - type: paragraph
      text:
        ru: «Отче, – начал отец Иоанн, – когда меня захватывает демон, он поднимает меня вверх, бьет меня, я говорю что-то бессвязное, делаю бессмысленные поступки и становлюсь зрителем того, что делает мое тело и произносят мои уста! Я – зритель, и не могу ничего поделать, а все члены моего тела послушны диаволу!».
        cn: «神父啊，——约翰神父开始说，——当邪魔攫住我时，它把我举起，殴打我，我说着语无伦次的话，做着毫无意义的举动，并且成了我身体所做的一切以及我口中所发出的一切的旁观者！我只是个旁观者，无能为力，而我身体所有的肢体都顺从魔鬼！»
    - type: paragraph
      text:
        ru: 'Когда мы были в Новом скиту, у нас было много работы и суеты из-за постройки келии. Искуситель подтолкнул отца N чем-то огорчить меня. Я говорил ему: «Не поступай так, это тебе неполезно». Наконец однажды Бог, чтобы дать ему личный опыт и показать ему, что не следует так себя вести, на великом повечерии (была великая Четыредесятница), когда он читал за аналоем, а я сидел в стасидии[28]старца, попустил следующее. Этот брат на минуту прерывает чтение, подходит ко мне и говорит испуганно:'
        cn: 当我们在新隐修地时，我们有许多工作和忙乱，因为建造会院小室。诱惑者唆使N神父以某事使我忧伤。我对他说：「不要这样做，这对你无益。」最终，有一次上帝，为了给予他个人的经验并向他表明不应如此行事，在大晚课上（当时正值大斋期），当他在读经架前诵读时，而我坐在长者[28]的立席上，许可了以下之事。这位弟兄暂停了诵读片刻，走向我并且惊恐地说：
    - type: paragraph
      text:
        ru: – Отче, я становлюсь бесноватым!
        cn: – 神父，我正在被邪灵附体！
    - type: paragraph
      text:
        ru: – Почему? – спрашиваю я его.
        cn: – 为什么？ – 我问他。
    - type: paragraph
      text:
        ru: – Вот, – отвечает он, – каждый мой палец становится толстым, как рука, а рука моя, по диавольскому действию, становится в три-четыре раза больше! Погибаю, отче, перекрести меня, иначе я стану бесноватым.
        cn: ——你看，他回答说，我的每个手指都变得像手臂一样粗壮，而我的手臂，凭着魔鬼的作为，变得有三四倍大！我快要死了，神父啊，为我划十字圣号，否则我就会被魔鬼附身了。
    - type: paragraph
      text:
        ru: 'Тогда я крещу его и говорю:'
        cn: 然后我为他施洗，并说：
    - type: paragraph
      text:
        ru: – Ну теперь иди читай повечерие и в другой раз будь внимателен, не противоречь и не имей мнения, отличного от мнения старца, ибо это тебе неполезно.
        cn: ——那么现在你去读晚祷，下次要留心，不要反驳，也不要有与长老意见相异的看法，因为这对你无益。
    - type: paragraph
      text:
        ru: Когда я перекрестил его, искушение прошло, он пришел в себя и в трепете пошел читать.
        cn: 当我为他画了十字圣号时，诱惑便消散了，他清醒过来，并战兢地去阅读了。
    - type: paragraph
      text:
        ru: Велики достижения хорошего послушника. Те, которые послушны и не огорчают своего старца, наследуют ангельские венцы. Послушанием великую благодать получает послушник.
        cn: 良善的顺服者，其成就伟哉。凡顺从且不惹其长老忧伤者，必继承天使的冠冕。顺服者借由顺从，获得莫大的恩典。
    - type: paragraph
      text:
        ru: Апостол Павел, несмотря на то что поучал простых христиан, делает акцент на фундаменте всех добродетелей – послушании, говоря, что мы должны своим духовным преуспеянием доставлять радость духовникам, ибо они бодрствуют, как он говорит, о душах наших[29]. Ибо неполезно людей, которые подвизаются ради наших душ, огорчать и доставлять им неприятности.
        cn: 使徒保罗，尽管教导平信徒，却强调众德之基石——服从，说道我们应当以我们的属灵长进使属灵导师喜乐，因为他们如他所言，为了我们的灵魂而警醒[29]。因为使那些为我们灵魂而奋斗的人忧伤并令他们不快，是无益的。
    - type: paragraph
      text:
        ru: Если мы в послушании не находим пользы и упокоения, значит, не все в порядке, значит, что-то от нас ускользает.
        cn: 如果我们未能在顺服中寻得益处和安息，那就说明并非一切都妥当，那就说明有些东西从我们身边溜走了。
    - type: paragraph
      text:
        ru: 'Послушник, получая наставления старца по поводу того или другого, да не думает, что это простые советы. По сути, это заповеди, пусть об этом и не говорится так явно. К примеру, старец наставляет и говорит: «Чадо мое, будь послушным, твори молитву и прогоняй плохие помыслы сразу, как только они придут, потому что чем дольше они остаются, тем больше марают место. Но если они и уйдут через продолжительное время, то все же оставят после себя пометины и выщерблины!». Или другое: «Если ударят в било[30], тотчас спускайся вниз». Или: «В церкви не ходи туда и сюда, но стой терпеливо в своей стасидии и переходи с места на место только в случае крайней нужды».'
        cn: 侍从修士在领受灵性导师关于这样或那样的事情的指导时，不要以为这只是简单的建议。实际上，这些都是诫命，即使没有如此明确地说出来。例如，灵性导师教导说：「我的孩子，要顺服，要祈祷，邪恶的念头一来，就要立刻驱逐它们，因为它们停留得越久，就会把地方玷污得越厉害。但即使它们在很长时间之后才离去，它们仍然会在身后留下痕迹和缺损！」或者另一个例子：「如果敲响了钟板[30]，就立即下来。」或者：「在教堂里不要走来走去，而要耐心地站在你的唱经座里，只有在极其必要的情况下才可从一个地方挪到另一个地方。」
    - type: paragraph
      text:
        ru: 'Если монах не слушает советов и увещаний старца, то он находится в непослушании. Тогда не должен ли старец так прямо и сказать: «Я заповедую это и вот это», дабы монах устрашился и был послушным? Заповеди даются лишь в определенных случаях.'
        cn: 如果修士不听从长老的建议和规劝，那么他就是处于不顺从之中。那么长老是不是就应该干脆直接地说：「我命令你如此这般」，好让修士生出敬畏之心，并变得顺从呢？命令仅在特定情况下下达。
    - type: paragraph
      text:
        ru: Когда кто-то приходит для того, чтобы стать послушником, то совершенно очевидно, что он приходит не ради игумена или монастыря. Понятно, что он приходит ради любви Христовой и спасения своей души. Но поскольку он не увидит Христа, чтобы сотворить Ему послушание, то Христос оставляет Своего представителя – игумена в монастыре, чтобы то послушание, которое он желает показать Христу, показать игумену.
        cn: 当有人前来想要成为见习修士时，那么显而易见，他并非为了院长或修道院而来。可以理解，他前来是为了基督的爱以及他灵魂的得救。但由于他不会看到基督以便向祂表示顺服，那么基督就留下祂的代表—即修道院的院长，以便他想要向基督表示的顺服，可以向院长表示。
    - type: paragraph
      text:
        ru: Каждый духовник носит в себе образ Христов. Итак, насколько он послушлив духовнику, настолько послушлив и Христу.
        cn: 每位神父内里都带有基督的肖像。因此，人若对神父顺服多少，就对基督顺服多少。
    - type: paragraph
      text:
        ru: Страшный грех – не почитать иконы Христа, Божией Матери, святых. Мы полагаем, что хуже греха и не существует. Икона представляет Божественное лицо, мы ей покланяемся и лобызаем ее, а поклонение это относится к самому тому лицу, которое изображено на иконе.
        cn: 不敬奉基督圣像、圣母和圣徒圣像，是可怕的罪。我们认为，没有比这更甚的罪了。圣像代表着神圣的容颜，我们敬拜她，亲吻她，而这份敬拜是归于圣像上所描绘的那个容颜本身的。
    - type: paragraph
      text:
        ru: 'Живую икону Христа носит в себе духовник, слушаться которого заповедуется послушнику ради одной только любви Христовой. Не ради личности старца, ибо он может быть и грешным человеком, может быть и достойным геенны, как и я, но послушание имеет совсем другой смысл: оно относится прямо ко Христу. И поскольку любовь Христова нас призвала прийти сюда для подвига и спасения своей души, то мы должны всячески приобретать эту фундаментальнейшую добродетель – послушание, – которая многостороння, ибо хороший послушник, безусловно, имеет не только послушание, но окружен стеной из многих других добродетелей и подвигов.'
        cn: 属灵导师心中承载着基督的活圣像，而修行者被吩咐要听从他，仅仅是出于对基督的爱。并非为了长老其人，因为他可能也是个罪人，甚至可能像我一样配得革赫那，但顺从却有完全不同的意义：它直接指向基督。既然基督的爱呼召我们来到此处，为了灵性争战和拯救自己的灵魂，那么我们就应竭力获取这最根本的美德——顺从——它是多方面的，因为一个好的修行者，无疑地，不仅拥有顺从，而且被许多其他美德和灵性争战的墙垣所环绕。
    - type: paragraph
      text:
        ru: Мой святой Старец, чтобы укрепить нас в послушании, вере и любви к личности старца, кроме многих прочих рассказов, приводил и следующий случай, приключившийся на Катунаках.
        cn: 我的圣长老，为了坚固我们在顺服、信德和对长老本人的爱之中，除了许多其他故事之外，还讲了下面这个发生在卡图纳克斯的事例。
    - type: paragraph
      text:
        ru: Один послушник очень любил своего старца и был чрезвычайно послушлив. Как-то они пошли в Карею[31]. Там старец тяжело заболел и захотел вернуться в свою келию. Послушник взял его на свои плечи и, пройдя несколько часов, преодолев горный хребет, принес его на Катунаки, туда, где они жили.
        cn: 一个修士非常敬爱他的长老，并且极其顺从。有一次，他们去了卡雷亚[31]。在那里，长老重病缠身，并想回到自己的隐修室。这位修士将他背到自己的肩上，走了几个小时，翻过一道山脊，将他带到了卡图纳基，那是他们居住的地方。
    - type: paragraph
      text:
        ru: Этот монах впоследствии связался с одним монашеским братством там, наверху[32], в скиту святого Василия, где отцы причащались без предварительного поста, и он захотел оставить своего старца и уйти монашествовать к ним. Будучи схимником, он желал уйти от своего старца и пойти туда.
        cn: 这个修士后来联系上了一个修士兄弟会，在上面[32]，于圣瓦西里隐修院，那里的修士们在没有预先禁食的情况下领圣体，于是他想要离开他的长老，去他们那里修道。作为一名大圣安士，他渴望离开他的长老，去那里。
    - type: paragraph
      text:
        ru: 'Старец ему говорил:'
        cn: 长老对他说：
    - type: paragraph
      text:
        ru: – Ты не пойдешь.
        cn: ——你不会去。
    - type: paragraph
      text:
        ru: 'Тот отвечал:'
        cn: 他回答说：
    - type: paragraph
      text:
        ru: – Нет, пойду.
        cn: ——不，我要去。
    - type: paragraph
      text:
        ru: – Чадо мое, – снова говорит ему старец, – не ходи. Приближается Пасха, останься здесь, чтобы отпраздновать нам вместе Воскресение…
        cn: ——我的孩子啊，——老者又对他说，——不要走。复活节临近了，留在这里，好让我们一起庆祝主复活……
    - type: paragraph
      text:
        ru: – Нет, пойду, – снова говорит тот.
        cn: – 不，我去，那人再次说道。
    - type: paragraph
      text:
        ru: 'Однажды старец потерял терпение и говорит ему: «Лукавый ангел да последует тебе». На следующий день на носу у него выскочил огромный прыщ и начал раздуваться. Наконец этот послушник пришел к отцу Артемию, врачу-самоучке, вылечившему старца Иосифа и меня. Он показал ему чирей, но вылечить его отец Артемий не смог…'
        cn: 有一次，长老失去了耐心，对他说：「愿邪恶的天使随从你。」第二天，他的鼻子上长出了一个巨大的疖子，并开始肿胀起来。最后，这位修士来到阿尔捷米神父那里，他是一位自学成才的医生，曾治愈了约瑟夫长老和我。他把疖子给阿尔捷米神父看，但阿尔捷米神父却没能治好它……
    - type: paragraph
      text:
        ru: 'Через три-четыре дня вздутие увеличилось, чирей лопнул, пошел гной, и монах этот был уже недалек от смерти. Отцы говорили ему:'
        cn: 过了三四天，肿胀加剧了，疖子破裂，流出脓液，这位修士已濒临死亡。教父们对他说：
    - type: paragraph
      text:
        ru: – Примирись со своим старцем ради любви Христовой, возьми его благословение с собой, дабы он простил тебя.
        cn: ——为了基督的爱，与你的长老和好吧，带着他的祝福，好让他赦免你。
    - type: paragraph
      text:
        ru: '– Нет! – говорил он. Он уже ожесточился, как бесноватый! Но в конце, перед тем как испустить дух, он бил себя в грудь и говорил: «Проиграл, проиграл, проиграл я игру за свое спасение!!!».'
        cn: 「不！」他说。他已心硬如铁，如同被魔鬼附身！但最后，在他断气之前，他捶打自己的胸膛，说道：「我输了，我输了，我输掉了我救恩的这场争战！！！」
    - type: paragraph
      text:
        ru: Очень много рассказывал нам мой Старец, старец Иосиф, ибо он знал многих старых монахов.
        cn: 我的长老，长老约瑟夫，给我们讲述了很多很多，因为他认识许多年长的修士。
    - type: paragraph
      text:
        ru: В отеческих книгах написано об одном хорошем послушнике, которому старец давал наставления каждый день после повечерия. Он давал ему различные советы относительно послушания и того, что он должен делать, чтобы спастись.
        cn: 在教父言行录中记载着一位好见习修士，他的长老每天在晚课之后都给他教导。长老给了他各种关于顺服以及他为得救所当行的建议。
    - type: paragraph
      text:
        ru: 'Однажды за разговором старец заснул. Тогда диавол начал досаждать послушнику помыслами и говорил ему: «Уходи, ведь старец заснул. Что ты теперь сидишь? Иди теперь и ты отдыхать, ты устал» и тому подобное. «Как я пойду, – думал он, – я должен получить благословение старца».– «Но он теперь заснул», – снова говорил ему помысл. «Ничего, я потерплю». Помысл борол его семь раз, чтобы он ушел, но он не ушел.'
        cn: 有一次，长老在谈话中睡着了。于是魔鬼开始用意念困扰修士，并对他说：「走吧，长老睡着了。你现在还坐着干什么？你现在也去休息吧，你累了。」诸如此类的话。「我怎能走呢？」他想道，「我必须得到长老的祝福。」「但他现在睡着了。」意念又对他说。「没关系，我会忍耐。」意念与他争斗了七次，要他离开，但他没有离开。
    - type: paragraph
      text:
        ru: 'По истечении нескольких часов, когда приблизился час совершения утрени, старец проснулся и говорит ему:'
        cn: 数小时后，当晨祷时辰临近之际，长老醒来对他说：
    - type: paragraph
      text:
        ru: – Ты не пошел отдыхать?
        cn: 你没去休息吗？
    - type: paragraph
      text:
        ru: – Я не мог, отче, без вашего благословения.
        cn: ——我不能，神父，没有您的祝福。
    - type: paragraph
      text:
        ru: – А почему ты меня не разбудил?
        cn: 你为什么没有叫醒我？
    - type: paragraph
      text:
        ru: – Ничего, отче, я сотворил послушание и терпение.
        cn: – 没关系，神父，我已行出了顺从与忍耐。
    - type: paragraph
      text:
        ru: – Хорошо, теперь отслужим утреню, а потом ты пойдешь и хорошенько поспишь.
        cn: 好的，现在我们举行晨祷，然后你就可以去好好睡一觉了。
    - type: paragraph
      text:
        ru: Так и было.
        cn: 正是如此。
    - type: paragraph
      text:
        ru: 'Когда снова, уже после утрени, старец заснул, он увидел себя в некоей очень светлой комнате, и там был сияющий престол, над которым находились семь прекраснейших венцов. Недоумевая, старец сказал: «Кто знает, какого великого преподобного и святого мужа этот престол? И какие подвиги он должен был бы совершить, чтобы заработать эти венцы?». И вот, когда он так стоял, подошел к нему один священнолепный муж и спросил:'
        cn: 再次地，在晨祷之后，这位长老入睡了，他看见自己身处一间非常明亮的房间里，那里有一个闪耀的宝座，其上方有七顶最美丽的冠冕。这位长老困惑不解，说道：「谁知道这宝座是哪一位伟大的可敬者和圣人的？他又该完成怎样的善工，才能赢得这些冠冕呢？」就在他这样站着的时候，一位庄严圣洁的男子走近他，问道：
    - type: paragraph
      text:
        ru: – Чему дивишься, отче?
        cn: – 神父，你在惊奇什么？
    - type: paragraph
      text:
        ru: – Удивляюсь я светлости престола и думаю, что это будет престол какого-то великого святого.
        cn: ——我惊叹于宝座的光辉，心想这定是某位伟大圣人的宝座。
    - type: paragraph
      text:
        ru: – Нет, – говорит тот, – не великого святого, а твоего послушника.
        cn: – 不， – 那人说， – 不是一位大圣人，而是你的初修士。
    - type: paragraph
      text:
        ru: – Да это невозможно, – говорит старец, – он еще совсем молодой и только недавно пришел, и ему даны и престол, и венцы?
        cn: '"这不可能啊，" 长老说，"他还很年轻，而且才刚来不久，就赐予了他宝座和冠冕？"'
    - type: paragraph
      text:
        ru: – Конечно. Престол дан ему с того момента, когда он положил поклон подчинения[33], а семь венцов – вчера вечером, когда он противостоял помыслам.
        cn: – 当然。宝座从他行了顺服的叩拜[33]那一刻起就赐予了他，而七个冠冕则是在昨晚他抵制了意念时。
    - type: paragraph
      text:
        ru: 'Наконец старец пришел в себя. Зовет своего послушника и говорит ему:'
        cn: 最后，长老恢复了神智。他唤来他的随侍者，对他说：
    - type: paragraph
      text:
        ru: – Чадо мое, какие помыслы были у тебя вчера? Говори.
        cn: – 我的孩子，你昨天有什么意念？说吧。
    - type: paragraph
      text:
        ru: – Ничего у меня не было, отче. Никакого плохого помысла я не имел, не помню.
        cn: – 我什么都没有，神父。我没有过任何恶念，不记得了。
    - type: paragraph
      text:
        ru: – Ну-ка, подумай получше, вспомни все по порядку.
        cn: – 来，再仔细想想，把一切都按顺序回忆起来。
    - type: paragraph
      text:
        ru: 'Немного погодя, испытав самого себя, он говорит:'
        cn: 不久之后，省察了自己，他说：
    - type: paragraph
      text:
        ru: – Да, да, отче! Вчера вечером после повечерия, когда вы заснули, я семь раз был борим помыслом оставить вас и пойти отдохнуть, но противостоял и, как видите, ждал вас.
        cn: ——是的，是的，神父！昨天晚上在小晚课之后，当您睡着的时候，我七次被意念所困扰，想要离开您去休息，但我抵制住了，并且，如您所见，我一直在等您。
    - type: paragraph
      text:
        ru: – Хорошо, чадо мое, иди.
        cn: 好的，我的孩子，去吧。
    - type: paragraph
      text:
        ru: И понял старец, что эти семь венцов его послушник заработал вчера вечером, противостоя помыслам.
        cn: 于是长者明白，这七顶冠冕是他的见习修士昨晚因抵御思虑而赢得的。
  - type: heading2
    text:
      ru: Слово второе
      cn: 第二篇训言
    children:
    - type: paragraph
      text:
        ru: 'На примере нашего Спасителя, Который так смирил Самого Себя, мы научились величию, которое скрывает в себе послушание. Послушание – это не только послушание старцу, но и послушание всякой заповеди Божией. Здесь повелевает старец, но сперва повелевает Бог Своими заповедями: «Сотвори сие». Если человек совершает послушание, то за этим следует пользование плодами этого послушания.'
        cn: 借着我们救主的榜样，祂如此谦卑自己，我们学会了顺服所蕴藏的伟大。顺服不仅是对长老的顺服，更是对上帝每一条诫命的顺服。在此，长老发出命令，但首先是上帝借着祂的诫命发出命令，曰：「行此。」若人实行顺服，那么随之而来的，便是享用这份顺服的果实。
    - type: paragraph
      text:
        ru: Христос смирил Самого Себя, послушав Своего Небесного Отца. Он был послушлив, как Человек, чтобы научить нас высочайшей добродетели смирения, ибо без смирения никто не может приблизиться к Богу.
        cn: 基督谦抑自己，顺从祂的天父。祂作为人而顺从，是为了教导我们谦卑这一至高的美德，因为没有谦卑，谁也不能亲近上帝。
    - type: paragraph
      text:
        ru: Мы видим, что в Раю, когда Адам и Ева исполняли послушание и сохраняли заповедь Божию, состоявшую в том, чтобы не есть от запретного плода, они были счастливы. Они были царями всех земных тварей, господствовали надо всем, были счастливы и чувствовали и видели Бога. Это было самое блаженное время их жизни. Над ними был покров Божий. Никто их не беспокоил, никто их не осуждал. Они могли беспрепятственно ходить по Раю без страха, без мучения совести. Почему? Потому что они еще не падали ни в какое прегрешение пред Богом.
        cn: 我们看到，在乐园里，当亚当和夏娃遵行顺服并谨守上帝的诫命——这诫命就是不可吃禁果时，他们是幸福的。他们是地上一切受造物的君王，管辖着一切，他们是幸福的，并感受到且看见上帝。这是他们生命中最蒙福的时期。上帝的庇佑覆庇着他们。没有任何人打扰他们，没有任何人定他们的罪。他们可以自由自在地行走在乐园里，没有恐惧，没有良心的折磨。为什么呢？因为他们尚未在上帝面前堕入任何过犯。
    - type: paragraph
      text:
        ru: Впоследствии, употребив во зло свою свободу, они, как свободные, захотели преступить заповедь и преступили ее, и погрешили пред Богом.
        cn: 后来，他们滥用了自己的自由，作为自由者，他们想要违背诫命，并违背了它，并在上帝面前犯了罪。
    - type: paragraph
      text:
        ru: Сразу же после преступления совесть возвысила свой глас. Тотчас после падения совесть начала удручающе беспокоить их души. Ясно, что угрызения совести были следствием преступления и греха.
        cn: 罪行甫一发生，良心立刻就发出了呼声。堕落之后，良心随即开始令人沮丧地搅扰他们的灵魂。显而易见，良心的谴责是罪行和罪恶的后果。
    - type: paragraph
      text:
        ru: После преступления первозданные оказались в тупике. «Услышали голос Бога, ходящего по Раю, – говорит Писание, – и убоялись и скрылись!»[34]. Но прежде, когда они еще не провинились пред Богом, почему они не боялись Его? Может быть, только тогда гулял Бог по Раю? Тогда только Он приблизился к ним, как к преступникам? Неужели Бог не посещал их, когда они были истинными Его чадами, и не гулял по Раю? Но тогда они не боялись Его, потому что их не обличала совесть, которая была спокойна и мирна, поэтому и сами они пребывали в мире.
        cn: 犯罪之后，始祖们陷入绝境。「他们听见了上帝在乐园中行走的声音，」圣经说，「便惧怕，藏了起来！」[34] 但此前，当他们尚未得罪上帝时，为何他们不惧怕祂呢？难道仅仅在那个时候，上帝才在乐园中行走吗？难道那时祂才作为罪犯靠近他们吗？难道当他们是祂真正的儿女时，上帝不曾造访他们，也不在乐园中行走吗？但那时他们不惧怕祂，因为他们的良心没有谴责他们，这良心是平静安宁的，因此他们自己也安处于平安之中。
    - type: paragraph
      text:
        ru: Итак, «когда Бог гулял по Раю, оба скрылись, ибо убоялись Бога».
        cn: 所以，「当上帝在伊甸园里行走时，他们二人都藏了起来，因为他们惧怕上帝。」
    - type: paragraph
      text:
        ru: 'Бог им говорит:'
        cn: 上帝对他们说：
    - type: paragraph
      text:
        ru: –    Адам и Ева, где вы? Где вы сокрылись?
        cn: ——亚当和夏娃，你们在哪里？你们藏身何处？
    - type: paragraph
      text:
        ru: Что они теперь скажут Ему, Богу?
        cn: 他们现在会对祂——上帝——说什么呢？
    - type: paragraph
      text:
        ru: –    Адам, где ты спрятался?
        cn: – 亚当，你藏在哪里了？
    - type: paragraph
      text:
        ru: –    Я убоялся, – говорит Адам, – я услышал, что Ты ходишь по Раю, и убоялся.
        cn: – 我惧怕了，– 亚当说，– 我听见祢在乐园中行走，就惧怕了。
    - type: paragraph
      text:
        ru: –    Но почему же ты боишься, боишься своего Отца, своего Творца, своего Благодетеля, Меня, Который по безграничной Божественной любви отдал тебе весь Рай? Ты боишься, что Я к тебе подойду? К тебе приближается Счастье, Источник жизни, радости и мира, и ты боишься?
        cn: – 那么你为何害怕，为何恐惧你的父、你的创造者、你的施恩者，我，这位因着无限的神圣之爱将整个天堂赐予你的？你害怕我会走向你？幸福、生命、喜乐与平安的泉源正向你靠近，而你却害怕？
    - type: paragraph
      text:
        ru: –    Да, – говорит Адам, – я боюсь, потому что согрешил. Но я невиновен. Ева, жена, которую Ты мне дал, она меня подвигнула, подтолкнула, и я преступил заповедь Твою и ел от запретного плода.
        cn: 「是的，」亚当说，「我害怕，因为我犯了罪。但我没有罪责。祢赐给我的妻子夏娃，她引诱我，怂恿我，我便违背了祢的诫命，吃了禁果。」
    - type: paragraph
      text:
        ru: –    Ева, – говорит Бог, – ты почему прельстила своего мужа, почему ела?
        cn: 『夏娃，』上帝说，『你为什么诱惑你的丈夫？你为什么吃了？』
    - type: paragraph
      text:
        ru: –    Я невиновна, – говорит Ева, – змей, которого, конечно, Ты сотворил, и он был здесь у нас в Раю, он сказал мне съесть, и что если я съем от этого плода, то стану равной Богу и познаю добро и зло[35].
        cn: ——我无辜，——夏娃说，——祢当然创造了那蛇，它就在我们的乐园里，它叫我吃，并且说，如果我吃了这果子，就会与上帝同等，并能辨善恶[35]。
    - type: paragraph
      text:
        ru: Сразу видны эгоизм и пререкание. Эгоизм приносит в сердце и уме свой плод – пререкание, которое восстает против Бога и косвенно возлагает на Hero ответственность.
        cn: 自私和争辩立即显明。自私在内心和意念中结出其果子——争辩，这争辩反抗上帝，并间接将责任归咎于祂。
    - type: paragraph
      text:
        ru: Поскольку Бог не увидел покаяния, не увидел, чтобы они попросили прощения, Он тут же повелевает их изгнать.
        cn: 因为上帝没有看见悔改，没有看见他们请求宽恕，祂立刻命令将他们驱逐。
    - type: paragraph
      text:
        ru: 'Этот диалог между Богом и первозданными людьми дарует нам ценнейший совет и научает, что Бог, когда человек преступает Его заповедь, не покидает его, не наказывает его тут же, а приближается к нему. Но как Он к нему приближается? Человек не слышит, как Он ходит, как услышал Его Адам! Однако я очень хорошо Его слышу, когда Он обличает меня и говорит мне: «Здесь ты сделал плохо, там поступил нехорошо. Почему ты это сделал?». Через совесть Бог зовет: «Покайся, ибо ты – человек».'
        cn: 这段上帝与初创人类之间的对话，赐予我们宝贵的建议，并教导我们，当人违背祂的诫命时，上帝不会离弃他，不会立刻惩罚他，而是亲近他。但祂如何亲近他呢？人听不见祂行走的声音，不像亚当那样听见了祂！然而，我却非常清晰地听见祂，当祂责备我并对我说：「你在这里做得不好，在那里做得不对。你为什么要这样做？」通过良心，上帝呼唤：「悔改吧，因为你只是一个人。」
    - type: paragraph
      text:
        ru: Человек удобопреклонен, убеждается легко; он легко поддается влиянию, изменчив и ненадежен. Бог это знает, ибо Он тебя сотворил, Он сделал тебя человеком. Но Он дал тебе и благодать покаяния, Он дает тебе силу подняться. Почему ты не встаешь?
        cn: 人心性柔弱，易被劝服；他容易受影响，善变且不可靠。上帝深知此点，因为祂创造了你，造你为人。但祂也赐予了你悔改的恩典，祂赐予你重新振作的力量。你为何不站起来呢？
    - type: paragraph
      text:
        ru: Но когда Он обличает тебя через совесть и Писаниями побуждает тебя к покаянию и ты не каешься, тогда начинается осуждение и наказание.
        cn: 但是当祂借由良心责备你，并以圣经促使你悔改，而你却不悔改时，那么，审判与惩罚便开始了。
    - type: paragraph
      text:
        ru: Теперь перейдем к нашей жизни. И здесь мы снова увидим, что, когда человек послушлив, он живет счастливо. Совесть его не обличает, не досаждает ему и не доставляет никакого беспокойства.
        cn: 现在，我们转向我们的生活。在此，我们再次看到，当一个人顺从时，他生活得幸福。他的良心不责备他，不困扰他，也不带来任何不安。
    - type: paragraph
      text:
        ru: 'Когда же он не слушается, тогда совесть обличает его и говорит: «Здесь ты поступил нехорошо». Эгоизм кричит: «Нет!». А совесть говорит снова: «Ты должен покаяться». И так происходит беспокойство, война, и человек обличается в душе.'
        cn: 当他不顺从时，良心就责备他，并说：「你在这里做得不对。」自我中心喊叫：「不！」而良心又说：「你必须悔改。」于是便产生了不安、战争，而人在灵魂里被责备。
    - type: paragraph
      text:
        ru: Но у хорошего человека не бывает такого состояния обличения и беспокойства, и он живет в мире и спокойствии, с благой надеждой будущего вечного по Богу восстановления.
        cn: 但一个善良的人不会有那种内心的谴责和不安，他生活在平安与宁静中，怀着对由上帝而来的未来永恒复兴的美好希望。
    - type: paragraph
      text:
        ru: Теперь мы в киновии, где все происходит в определенном порядке, по определенному закону, установлению, дисциплине, наставлению и послушанию. Если послушник плохо исполняет порядок, наставления, заповеди – как Бога, так и старца, – то он внутренне обличается.
        cn: 现在我们身处协同院，在这里，一切都按照既定秩序、既定律法、章程、规戒、训谕和服从进行。如果初修士未能好好遵守秩序、训谕和诫命——无论是上帝的，还是长老的——他便会在内心受到责备。
    - type: paragraph
      text:
        ru: 'Отцы с такой точностью хранили послушание, что даже спрашивали: «Хорошо ли я делаю, выпивая десять глотков воды?». Что они хотят этим сказать? Они желают нас научить тому, с какой точностью мы должны слушаться поучений и наказов старца.'
        cn: 教父们如此精确地持守顺服，乃至他们甚至会问：「我喝十小口水，做得好吗？」他们想借此说什么呢？他们渴望教导我们，我们应当以何等精确性来听从长老的教导和吩咐。
    - type: paragraph
      text:
        ru: И снова нам говорят отцы, что мы становимся посмешищем перед Богом, Ангелами, людьми и демонами, если, отрекшись родителей, мира и свободы, спорим из-за иглы, нитки или другой какой-либо ничтожной вещи.
        cn: 教父们再次告诉我们，如果我们在弃绝了父母、世俗与自由之后，却仍为一根针、一线或任何其他微不足道的事物争执不休，我们就会在上帝、天使、世人与魔鬼面前沦为笑柄。
    - type: paragraph
      text:
        ru: Мы пообещали Богу самоотречение. Что такое самоотречение? Самоотречение – это отречение от страстей и всех своих хотений. Но когда мы творим свою волю и без благословения создаем себе комфорт и удобства, разве исполняем мы тогда послушание?
        cn: 我们向上帝许诺了舍己。舍己是什么？舍己就是弃绝诸般情欲以及自己一切的意愿。但是，当我们行自己的意愿，并且未经祝福就为自己营造舒适和便利时，我们那时难道还在遵行顺服吗？
    - type: paragraph
      text:
        ru: Если и за одно многословие мы ответим перед Богом, то за свою волю неужели не дадим Ему ответ?
        cn: 如果即便只为冗言，我们都要在上帝面前交账；那么，难道不为我们的私意向祂交账吗？
    - type: paragraph
      text:
        ru: 'Став монахами, мы пообещали самоотречение и послушание до смерти. Но как мы оправдаемся, когда станем пред смиренным Иисусом, крайне послушливым, и Он покажет нам язвы от гвоздей и Распятие? Когда Он скажет нам: «Вот Я насколько был послушлив Небесному Отцу и отсек Свою волю, что не пожелание иглы, не пожелание нитки отсек, не нежелание выполнить маленькое приказание отсек, а отсек Свою волю“даже до смерти, смерти же крестной”(Флп.2:8)»?'
        cn: 成为修士后，我们许下了舍己和顺服至死的诺言。但是，当我们站立在谦卑且全然顺服的耶稣面前，祂将向我们展示祂的钉痕和祂的受难像时，我们如何称义呢？当祂对我们说：「看哪，我对天父是如此顺服，并且舍弃了自己的意志，我舍弃的不是一根针的愿望，也不是一根线的愿望，也不是不愿执行一个小小的命令，而是舍弃了自己的意志，「甚至死，且死在十字架上」（腓立比书 2:8）」时，我们又将如何呢？
    - type: paragraph
      text:
        ru: Мы, если нас обличат, что мы, к примеру, творим свою волю, внезапно приходим в смущение и внутри нас начинается война. Когда что-то препятствует исполнению нашей воли, внутри нас происходит «вселенский» переворот.
        cn: 我们，如果有人指责我们，比如说，我们是在行自己的私意，就会突然心神烦乱，我们内在便开始一场争战。当有什么阻碍我们私意的成就时，我们内在就会发生一场「宇宙性的」颠覆。
    - type: paragraph
      text:
        ru: 'Мы видим Христа, когда Он получает повеление и говорит: «Если возможно, да минует Меня час сей, да пройдет мимо Меня чаша сия, да совершится по-другому спасение человека». Ответ же Отца: «Нет. Шествуй через Крест и Голгофу». –«Да будет воля Твоя»[36].'
        cn: 我们看到基督领受命令时说：「如果可能，愿这时刻过去，愿这苦杯离开我，愿人类的救赎以别样方式成就。」而父的回应是：「不。你要经由十字架和髑髅地。」——「愿祢的旨意成就」[36]。
    - type: paragraph
      text:
        ru: Поэтому будем внимать своей совести и не будем ничего делать без ведома старца. Ибо сейчас мы успокаиваем себя, творя свою волю; теперь мы наслаждаемся этим; ныне мы исполняем то, чего желает наше сердце. Но придет час, наступит момент, когда мы окажемся в затруднительной ситуации, и тогда вспомним свою предшествующую жизнь и будем просить времени для покаяния и исправления, но будет уже слишком поздно! Исправимся теперь, когда мы можем исправиться. He будем ничего делать без благословения.
        cn: 因此，我们要留心自己的良知，并且不要在未经长老知晓的情况下做任何事。因为现在我们凭己意行事，以此自我安慰；现在我们乐在其中；此刻我们满足我们内心所欲。但是，时辰将至，时刻将来，届时我们将身陷困境，那时我们会回想我们过去的生活，并恳求时间悔改和改正，但那时将为时已晚！现在就改正吧，趁我们尚能改正之时。不要在未经降福的情况下做任何事。
    - type: paragraph
      text:
        ru: 'Одна монахиня, повествует Патерик, пришла в сад и без благословения взяла и съела лист салата, и вошел в нее демон. Тогда она начала бесноваться. Позвали игумена, чтобы он исцелил ее. Старец запретил демону и сказал ему: «Почему ты вошел в сестру?». – «Я не виноват, – говорит демон, – я был на салате, и она меня съела!».'
        cn: 《教父言行录》记载，一位修女来到花园，未蒙准允摘食了一片生菜叶，遂有邪魔入其身。于是她开始着魔。人们请来掌院医治她。长老斥责邪魔，对它说：「你为何进入这位姊妹？」邪魔说：「我无罪，我是在生菜上，是她把我吃了！」
    - type: paragraph
      text:
        ru: В эту монахиню демон вошел ипостасно[37], в то время как в нас, когда мы творим те же самые дела и похотения, он входит по-другому, через вину. И последнее гораздо хуже, ибо тот демон был выявлен и поддался заступлению старца, и монахиня была исцелена. Но когда мы что-то преступаем, тогда демон остается, и это хуже.
        cn: 恶魔位格性地[37]进入了这位修女，而当我们做着同样的行径和私欲时，它则以另一种方式，通过罪愆进入我们。后者则糟糕得多，因为那恶魔被揭示出来，并屈服于长老的代祷，修女也因此得了医治。但当我们有所逾越时，恶魔便留下，而这更糟。
    - type: paragraph
      text:
        ru: 'Отцы говорят: «Невелико дело, если демон выйдет из человека. Велико, если мы сможем изгнать демона страсти». Святой может изгнать демона, но для того, чтобы искоренить страсть, требуется личный подвиг.'
        cn: 教父们说：「如果魔鬼从人身上出去，这不是什么了不起的事。如果我们能驱逐情欲之魔，这才是了不起的事。」圣人能够驱逐魔鬼，但为了根除情欲，则需要个人的苦修。
    - type: paragraph
      text:
        ru: Поэтому не будем трудиться напрасно, заблуждаться и терять время, полагая, что мы шествуем монашеской стезей и находимся в послушании, и, будучи преступниками, самодовольно успокаивать себя. Возможно, нас обольщает помысл, а точнее, возношение[38], и мы полагаем, что это ничего не значит, нет ничего страшного и в другом; эх, невелико дело, если я сделаю и вот то. Но в действительности – это преступление Божественного закона. He будем забывать, что мы его пытаемся модернизировать, но закон Божий неизменен и непоколебим, и однажды он будет приведен в исполнение, тогда, когда мы предстанем на Суд!
        cn: 因此，我们不要白费力气，不要误入歧途，不要浪费时间，以为我们正走在修士的道路上，并处于顺服之中，却作为罪犯而自满地安慰自己。也许是某个念头在引诱我们，更准确地说，是骄傲[38]，我们以为这没什么大不了的，其他事情也没什么好怕的；哎，即使我做了那件事，也微不足道。但实际上，这是对神圣律法的触犯。我们不要忘记，我们试图将其现代化，但上帝的律法永恒不变，坚不可摧，而且有一天它会被执行，届时，正是我们站立在审判台前的时候！
  - type: heading2
    text:
      ru: Слово третье
      cn: 第三论
    children:
    - type: paragraph
      text:
        ru: Смирением святые отцы достигли великой меры благодати. Но, может быть, послушник не может достигнуть, добиться такого успеха? Конечно, может. Когда он будет хранить молчание, свои духовные подвиги, беспопечительность; когда он обращен на своего внутреннего человека и регулярно что-то вкладывает в свою внутреннюю сокровищницу, он преуспеет несомненно.
        cn: 圣教父们借着谦卑达到了极大的恩典。但是，也许初修士不能达到、获得这样的成功吗？当然，他能。当他保守静默，保守他的属灵操练，不挂虑世事；当他转向上他的内在之人，并且规律地投入一些东西进入他的内在宝库时，他就会毫无疑问地成功。
    - type: paragraph
      text:
        ru: И мы были послушниками Старца. У нас были послушания, дневные труды и тому подобное. Имея проводником опытного в этом божественном шествии Старца, соблюдая наш устав, некоторые отцы[39]смогли и познали такие вещи, которые отцы-исихасты нам оставили как некую священную сокровищницу.
        cn: 我们是长老的见习修士。我们有顺服功课、日常劳作以及诸如此类的事情。以在此神圣旅程中经验丰富的长老为向导，并遵守我们的规章，有些教父[39]得以认识并通晓了那些静修教父们作为神圣宝库留给我们的事物。
    - type: paragraph
      text:
        ru: Будем избегать разговоров о бесполезных вещах. В правиле своем[40]да будем постоянны; в своем посещении храма также будем постоянны. Будем находиться в церкви и слушать службу, Литургию, вечерню. На трапезе да будем все вместе. Во всем будем иметь порядок. Где порядок, там и мир. Где мир, там и Бог. Где беспорядок, там и смущение. А где смущение, там и диавол.«Вся благообразно и по чину да бывают», – говорит божественный Павел (1Кор.14:40).
        cn: 我们当避免谈论无益之事。在自己的规条[40]中，我们当恒常不懈；在我们前往圣殿一事上，也当恒常不懈。我们当身处圣堂中，聆听礼仪、圣礼、晚祷。用膳时，我们当一同进餐。在一切事上，我们当持守秩序。凡有秩序之处，就有平安。凡有平安之处，就有上帝。凡有混乱之处，就有扰乱。凡有扰乱之处，就有魔鬼。「万事都当端庄合宜，按着次序而行。」神圣的保罗说（哥林多前书 14:40）。
    - type: paragraph
      text:
        ru: Как послушники, будем исполнять свое послушание. He будем творить своей воли. Своя воля изгнала первозданных людей из Рая. Покорность воли Христа Своему Отцу снова ввела их в Рай, и так восторжествовало послушание.
        cn: 作为顺从者，我们将遵行自己的顺从。我们不当按照自己的意愿行事。私意将原初的人逐出了乐园。基督顺服祂的父的旨意，再次将他们引入乐园，于是顺从便凯旋了。
    - type: paragraph
      text:
        ru: Преслушал денница Бога, гордо возмечтал о себе, и Бог отдалил его от Себя, и он стал диаволом, который теперь воюет с нами. Остальные ангельские чины остались верны послушанию Богу и пребывают во славе Божией. Ангелы, будучи в тот момент изменчивыми по природе, по благодати приобрели постоянство, ибо с падением денницы и человека они узнали такие вещи, что теперь пребывают неизменными в послушании Богу.
        cn: 晨星违背了上帝，心生骄傲，上帝就使他远离了自己，他就成了魔鬼，现在与我们争战。其余的天神品级忠于对上帝的顺服，并常存在上帝的荣光中。天使们，当时本性是可变的，藉着恩典获得了恒常性，因为随着晨星和人的堕落，他们认识到这样的事，以至于现在他们在顺服上帝上恒久不变。
    - type: paragraph
      text:
        ru: Как испорчена воля человека, ибо скрывает в себе эгоизм, гордость, себялюбие и многое другое! Поэтому послушник, освободившийся от своей воли, освобождается и от страстей.
        cn: 人的意志何等败坏，因其内藏自私、骄傲、爱慕自身等等！所以，摆脱了自身意志的顺服者，也就摆脱了情欲。
    - type: paragraph
      text:
        ru: Христос был послушлив до крестной смерти, то есть до полного умерщвления Своей воли.
        cn: 基督顺服，直至受死于十字架上，也就是说，直至祂意志的完全死灭。
    - type: paragraph
      text:
        ru: Если бы Христос как Человек не сотворил бы послушания, не отсек бы Свою волю, то человек бы не спасся! Точно так, как не спасается и тот человек, который держится за свою волю и делает то, что хочет сам.
        cn: 若基督作为人，不实行顺从，不斩断自己的意愿，那么人类就无法得救！正是如此，正如那个执着于自己的意愿、并做自己所愿的人也无法得救一样。
    - type: paragraph
      text:
        ru: Что значит отречение своей воли? Это значит, что я отбрасываю, отвергаю свою волю, отрекаюсь от нее. Я уже не имею с ней никаких отношений.
        cn: 弃绝自己的意志，意谓何？这意谓着，我摒弃，我弃绝自己的意志，我弃绝它。我已与它全然无涉。
    - type: paragraph
      text:
        ru: Только тогда послушник освобождается от страстей, когда достигает состояния отречения от своей воли вышесказанным образом. Насколько он оставляет свою волю, настолько он познает облегчение от брани страстей.
        cn: 修道者唯有当以先前所述方式，达到弃绝自身意愿的状态时，方可从情欲中得到解脱。他越是舍弃己意，就越能从情欲的争战中领受到轻松。
    - type: paragraph
      text:
        ru: Если послушник на практике познает значение слов «благословите» и «буди благословенно»[41], то он увенчается неувядаемым венцом в небесном мире.
        cn: 如果见习修士在实践中领悟了«请降福»和«愿蒙赐福»[41]这些话语的意义，那么他将在天上的国度里戴上不朽的冠冕。
    - type: paragraph
      text:
        ru: Там, где послушник приложил свою волю, он приложил яд, и, принимая яд, он отравляет сам себя.
        cn: 凡是见习修士施加己意之处，他便掺入了毒药；而当他领受这毒药时，他便自我毒害了。
    - type: paragraph
      text:
        ru: И даже если бы было ему дано ошибочное приказание, за послушание, которое он выполняет, Бог его благословит...
        cn: 即使他领受了一个错误的命令，上帝仍会因他所遵行的顺服而赐福于他。
    - type: paragraph
      text:
        ru: 'Один послушник без всякого любопытства совершал послушание, которое давал ему старец, и по послушанию ходил и крал вещи из келий братии и потом приносил их старцу! Тот брал их и отдавал обратно, и никогда послушника не искушал помысл: «Да что же это такое делает со мною старец? Он побуждает и учит меня воровать? Чтобы впоследствии воровство вошло в мою привычку?». Он подумал и сказал: «Я совершаю послушание; что это такое, что я делаю теперь, я не знаю. Я знаю только одно, что я выполняю послушание».'
        cn: 一个初修道者毫无好奇心地遵行着长老给他的顺服，并按照顺服去弟兄们的修道室里偷窃物品，然后把它们带给长老！那位（长老）接过它们，然后还了回去，而初修道者从未被这样的念头所诱惑：「长老这是在对我做什么？他是在怂恿并教我偷窃吗？以至于偷窃日后会成为我的习惯吗？」他想了想，说道：「我正在遵行顺服；我现在所做的是什么，我不知道。我只知道一件事，那就是我正在履行顺服。」
    - type: paragraph
      text:
        ru: 'Некто пришел и стал послушником у одного старца, у которого уже было свое монашеское братство. Старец ему говорит: «Раз ты хочешь жить в нашей общине, я даю тебе заповедь не произносить ни одного слова. Стань немым ради Христа!». Тот ответил: «Буди благословенно».'
        cn: 某人来到一位长老那里，成为他的初学修士，这位长老已经拥有自己的修士团体。长老对他说：「既然你愿意住在我们的团体中，我给你一条诫命：不发一言。为基督的缘故，成为不言语之人！」他回答说：「愿其蒙福。」
    - type: paragraph
      text:
        ru: 'Когда он пробыл некоторое время в этом братстве, старец увидел, что его община не приносит этому послушнику пользы и лучше ему не жить в ней. Он говорит ему однажды: «Я пошлю тебя к другому старцу в другой монастырь». И, дав ему записку, снова говорит ему: «Ступай в тот-то монастырь, отдай это игумену и оставайся там».'
        cn: 他在这修道团体中住了一段时间后，长老看出，他所在的团体对这位初学者并无益处，他最好不要住在其中。有一天，长老对他说：「我将把你送到另一位长老那里，在另一所修道院。」他给了他一张字条，又对他说：「去那所修道院，把它交给院长，然后留在那里。」
    - type: paragraph
      text:
        ru: 'Берет игумен письмо – это было рекомендательное письмо, в котором было написано: «Я прошу Вас, отче, принять этого брата. Он хороший монах» и тому подобное. Он принимает его.'
        cn: 院长接过一封信，这是一封推荐信，信中写道：「我恳请您，父啊，接纳这位修士。他是一位好修士。」诸如此类的话。院长接纳了他。
    - type: paragraph
      text:
        ru: 'Через некоторое время монах этот умер, но не нарушил своего молчания. После его смерти второй старец, игумен, пишет первому: «Хоть и безгласного брата послал ты мне, но он был настоящим Ангелом!».'
        cn: 过了一段时间，这位修士死了，他却未曾打破他的静默。在他去世之后，第二位长老，也就是修道院院长，写信给第一位长老说：「尽管你派给我的是一个无言的弟兄，但他却是一位真正的天使！」
    - type: paragraph
      text:
        ru: 'Тогда первый отвечает второму: «От природы он не был таковым, но, храня заповедь, пребыл безгласным!». И удивился второй старец силе этого брата, что так безупречно сохранил он заповедь своего первого старца.'
        cn: 于是，第一个人回答第二个人说：「他生来并非如此，而是通过遵守诫命，保持了沉默！」 第二位长老对此弟兄的力量感到惊奇，因为他如此完美地遵守了他第一位长老的诫命。
    - type: paragraph
      text:
        ru: Я хочу сказать, что совершенное оставление своей воли есть святость.
        cn: 我想说的是，完全舍弃己意就是圣洁。
    - type: paragraph
      text:
        ru: 'Часто я думаю и говорю: как будет почтен совершенный послушник Христом – первым Послушником! И как возможно, чтобы совершенных послушников Христос не взял с Собою в Свое братство, где они будут вечно лицезреть Его лик, как пишет в Апокалипсисе святой евангелист Иоанн Богослов[42]!'
        cn: 经常我思忖并说道：一个完美的顺服者将如何受基督——首位顺服者——所尊荣！又怎可能基督不将这些完美的顺服者带到祂的弟兄团契中，在那里他们将永远瞻仰祂的圣容，正如圣福音传者圣约翰·神学家在启示录中所写[42]！
    - type: paragraph
      text:
        ru: 'Мы, сегодняшние монахи, судорожно держимся и цепляемся за свою волю, поэтому и не можем продвинуться далее вверх. Мы не говорим «благослови» и «буди благословенно», а говорим: «Не это, а тο» и тому подобное и бросаем яд в самих себя, в свою жизнь. Поэтому мы и не имеем преуспеяния хороших монахов.'
        cn: 我们，今天的修士们，抽搐般地紧抓并执着于自己的意志，因此也无法再向上迈进。我们不说「请赐福」和「愿蒙赐福」，却说：「不是这个，而是那个」等等，并将毒药投向我们自己，投向我们的生命。因此，我们也没有优秀修士们所拥有的长进。
    - type: paragraph
      text:
        ru: В книгах отцов мы читаем о некоторых святых послушниках.
        cn: 在教父的典籍中，我们读到了一些圣初修道者。
    - type: paragraph
      text:
        ru: 'Представь себе, игумен поместил в келию послушника вола, который столько лет рвал ему нити и ломал ткацкий станок! И там, внутри, конечно, сколько он делал и всякого иного! Спокойствия от него не было совсем! Но, несмотря на все это, никогда у брата не было помысла, как он говорил авве Пафнутию: «Никогда, авва, у меня не было плохого помысла о моем старце, почему он поместил в мою келию вола. Но раз он поместил его сюда, значит, он знает что делает, и кончено дело».'
        cn: 试想一下，院长将一头公牛安置在修士的隐室里，这头公牛多年来扯断他的线，弄坏他的织机！而在隐室里，当然，它还做了多少其他的事情！从它那里完全没有安宁！但尽管如此，那位弟兄从未有过这样的念头，正如他对阿爸帕夫努提所说的：「阿爸，我从未对我的长老有过不好的念头，关于他为何把一头公牛安置在我的隐室里。但既然他把它安置在这里，这就意味着他知道自己在做什么，事情就此了结了。」
    - type: paragraph
      text:
        ru: Сам он не имел своего помысла. Помысл старца и был его собственным помыслом.
        cn: 他自己没有己意。长者的意念便是他的己意。
    - type: paragraph
      text:
        ru: 'Поэтому мы говорим: «Если у нас нет духовного послушания, то мы совершенно ничего не достигли. Когда мы не желаем того, чего желает старец, мы, по сути, уже не послушники и не имеем духовного послушания. Пусть мы и совершаем послушание на деле, но мы тогда становимся, словно люди, у которых есть тело, но нет души. Ведь логически совершенно неприемлемо, чтобы существовал человек, у которого нет души».'
        cn: 因此我们说：「如果我们没有属灵的顺从，那么我们便全然一无所成。当我们不愿长老所愿之事时，我们实质上已不再是顺从者，并且不具备属灵的顺从。即使我们在行动上实行顺从，但那时我们便如同人一样，拥有身体，却没有灵魂。因为从逻辑上来说，竟然会有一个没有灵魂的人存在，是完全不可接受的。」
    - type: paragraph
      text:
        ru: 'Точно так же, согласно духовной логике, неприемлемо считать послушником того, кто имеет послушание только на деле. Прежде всего он должен иметь душу, иметь духовное послушание и говорить: «Во что верит, что думает, помышляет, полагает и решает старец, так же в точности думаю, считаю, решаю и я».'
        cn: 同样地，按照属灵的逻辑，将仅仅在行为上顺从的人视为顺从者，是不可接受的。他首先必须拥有心灵，拥有属灵的顺从，并说：「长老所信仰的、所思虑的、所思量的、所认为的以及所决定的，我也同样准确地思考、认为并决定。」
    - type: paragraph
      text:
        ru: Святой Симеон Новый Богослов получил благословение свыше только за послушание. Это очень сильный и яркий пример.
        cn: 圣西缅新神学家蒙受从上方而来的福佑，唯独因着顺从。这是一个非常有力且鲜明的例子。
    - type: paragraph
      text:
        ru: 'Святой Паисий имел послушника, которому однажды сказал: «Чадо мое, иди выпей воды вон из той лохани». Послушник сказал в своем помысле: «Вместо того чтобы сказать мне пойти попить из кувшина или из источника, когда я пришел с послушания усталый и потный, старец говорит мне пить эти помои из лохани!». Он доверился своему помыслу и так много упустил!'
        cn: '圣帕伊西奥斯有一位听命弟子。有一次，他对弟子说：「我的孩子，去喝那边那个水盆里的水吧。」

          听命弟子心想道：「我刚从听命中回来，又累又出汗，长者却没有叫我从水罐或泉源里喝水，反而叫我喝这水盆里的脏水！」他信任了自己的心念，结果错失了许多！'
    - type: paragraph
      text:
        ru: 'Потом он подумал: «Неужели не идти мне пить?» – но совсем не нашел воды. Тогда говорит ему авва Паисий: «Несчастный, знаешь ли ты, что это были за “помои”? Это была вода после умовения ног Христа!».'
        cn: 之后他心想：「难道我就不去喝了吗？」——但完全没有找到水。于是阿爸帕西西对他说道：「不幸的人啊，你可知道那「泔水」是什么吗？那是为基督洗脚后的水啊！」
    - type: paragraph
      text:
        ru: 'С тех пор к нему пришел дух скорби, и авва Паисий старался его утешить, но где там! Он дошел до того, что уже совсем не имел мира. Тогда святой, раз брат не мог успокоиться и жить вместе с ним, как-то говорит ему: «Иди в такое-то место. Там три гроба. В одном из них (который ему кто-то показал) сотвори молитву и слушай, что тебе будет сказано...». Так и произошло. Он слышит голос, говорящий ему: «Иди обратно к своему старцу и твори послушание».'
        cn: 从那时起，忧伤之灵降临到他身上，阿巴·白西努力安慰他，但无济于事！他甚至到了完全没有平安的地步。于是圣者见修士无法平静下来并与他同住，就对他说：「去某个地方。那里有三座坟墓。在其中一座坟墓里（有人指给他看的那座），你要祈祷并听你将会被告知什么……」事情果然如此。他听到一个声音对他说：「回到你的长老那里，并实行听命。」
    - type: paragraph
      text:
        ru: Но он уже потерпел внутреннее крушение. Дом его души покрылся такими трещинами, что он уже не в силах был их закрыть. Поэтому до конца своей жизни он был в послушании у аввы Паисия, сотрясаемый и бросаемый, словно бурей.
        cn: 但他已经遭受了内在的崩塌。他灵魂的殿堂布满了如此多的裂缝，以至于他已无力弥合它们。因此，直到他生命的尽头，他都在阿巴帕伊西乌斯的顺服中，仿佛被暴风雨震荡冲击，抛掷摆布。
    - type: paragraph
      text:
        ru: Симеон же Новый Богослов, одержавший победу над своей волей, приял свыше богословие за свое совершенное послушание. А второй, творя свою волю, остался вне послушания и благодати.
        cn: 圣西缅，新神学家，因战胜了自己的意志，又因其全然的顺服，从上领受了神学。而另一个人，行着自己的意志，却留在了顺服和恩典之外。
    - type: paragraph
      text:
        ru: Это, конечно, немногие примеры, ибо если бы было записано все, что сотворили те отцы – изумительные послушники, то могли бы быть написаны целые тома книг.
        cn: 这当然只是寥寥数例，因为如果凡是那些教父们——那些令人惊叹的顺服者——所行的都被记录下来，那么就能写成卷帙浩繁的巨著了。
    - type: paragraph
      text:
        ru: Эти примеры, словно зеркала, в которых мы можем увидеть самих себя и свой облик...
        cn: 这些例子，仿佛一面面镜子，我们可以在其中看到我们自己和我们的样貌……
    - type: paragraph
      text:
        ru: Бог да поможет каждому из нас прийти в себя, увидеть самого себя, насколько мы отреклись от своей воли. Будем подвизаться, чтобы очиститься от этого яда и суметь прожить по Богу, так, как Бог хочет и как того требует от нас монашеское житие[43].
        cn: 愿上帝帮助我们每个人醒悟过来，看清我们自己，看清我们舍弃己意到何种程度。我们要精进修持，以便洁净自己，摆脱这毒素，并能照着上帝的旨意生活，就像上帝所愿，以及修道生活对我们的要求[43]。
footnotes:
  '[1]':
    ru: Здесь и в других случаях, следуя традиции самих афонских монахов, мы пишем о старце Иосифе с большой буквы ввиду исключительной роли, которую он сыграл не только в жизни отца Ефрема, но и в жизни всего современного Афона.
    cn: 这里及其他地方，我们遵循阿索斯（Athon）修道士们自身的传统，将长老约瑟夫（Иосиф）的名字首字母大写，因为他不仅在叶弗雷姆神父的生命中，而且在整个现代阿索斯的生命中都扮演了卓越的角色。
  '[2]':
    ru: '«И был вечер, и было утро: день один»(Быт.1:5). Не сказано, к примеру: «И было утро, и был вечер: день один», – как сказал бы современный человек, а наоборот. Вечер предваряет утро, потому что прежде света, который был сотворен в первый день, была тьма.'
    cn: 「有晚上，有早晨，这是头一日。」 (创世记 1:5)。并没有说，例如：「有早晨，有晚上，这是头一日」，如同现代人会说的那样，而是相反。晚上先于早晨，因为在光以先，这光是在第一日被造的，曾有黑暗。
  '[3]':
    ru: Много удивительного можно было бы еще рассказать о жизни старца Иосифа, по прозванию Исихаст, и его чудного братства. Для лучшего ознакомления с ней читателя можно отослать к изданным ранее книгам «Афонский исихаст», «Старец Иосиф Исихаст» (житие Старца) и «Изложение монашеского опыта» (сборник его писем).
    cn: 关于长老约瑟夫（人称「静修者」）及其奇妙修士团体生平的许多奇妙事情，还可以讲述。为了更好地了解他，读者可以参考那些已出版的书籍：《阿索斯山的静修者》、《长老约瑟夫静修者》（长老生平）以及《修道经验的阐释》（他的书信集）。
  '[4]':
    ru: Термин «трезвение» укоренен в новозаветной и святоотеческой традиции. Еще апостол Петр увещевал христиан:«Трезвитесь, бодрствуйте, потому что противник ваш, диавол, ходит, как рыкающий лев, ища, кого поглотить»(1Пет.5:8). Святые отцы под трезвением всегда понимали бдительность в отношении помыслов, трезвение ума, отвержение явно демонических, да и вообще всех помыслов во время молитвы. Нередко и само безмолвие, исихию, то есть занятие Иисусовой молитвой, называли трезвением.
    cn: 「警醒」一词根植于新约和教父传统之中。使徒彼得早已劝勉基督徒：「务要谨守，警醒，因为你们的仇敌魔鬼，如同吼叫的狮子，遍地游行，寻找可吞吃的人。」(彼得前书 5:8) 圣教父们始终将「警醒」理解为对意念的警惕，心神的警醒，以及在祷告时摒弃明显属魔鬼的，乃至所有意念。许多时候，甚至静默本身——赫西卡（亦即操练耶稣祷文）——也被称为「警醒」。
  '[5]':
    ru: 'На Востоке Иисусова молитва состоит обычно из пяти слов:Господи, Иисусе Христе, помилуй мя. Основание тому мы находим и в трудах преподобного Григория Синаита: «Мысленно или душевно восклицай непрерывно:Господи, Иисусе Христе, помилуй мя». (Преподобный Григорий Синаит. Творения. Глава: «О безмолвии и двух образах молитвы». M., 1999. С. 95.)'
    cn: 在东方，耶稣祷文通常由五个词组成：主啊，耶稣基督，求祢怜悯我。我们在圣格列高利·西乃山修士的著作中也能找到其根据：「在思想上或心灵上不断地呼喊：主啊，耶稣基督，求祢怜悯我。」（圣格列高利·西乃山修士。《著作集》。「论静默与两种祷告方式」章节。莫斯科，1999年，第95页。）
  '[6]':
    ru: Согласно святым отцам, грех при своем развитии проходит несколько стадий, первой из которых является прилог. Если грех задержан на этой ступени, то он не вменяется человеку в вину и его дальнейшее развитие не происходит.
    cn: 依照圣教父们的教导，罪在其发展过程中经历几个阶段，其中第一个阶段是触动。如果罪在这一阶段被阻截，那么这罪就不被算作人的罪过，其进一步的发展就不会发生。
  '[7]':
    ru: Дословно – кости.
    cn: 骨头。
  '[8]':
    ru: «Царствие Божие внутрь вас есть»(Лк.17:21).
    cn: 「上帝之国在你们心里」(路加福音 17:21)。
