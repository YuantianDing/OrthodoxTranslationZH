  '[39]':
    ru: Под «некоторыми отцами», несомненно, можно подразумевать и самого отца Ефрема. Его удивительные главы «О молитве» являются прекрасным тому подтверждением.
    cn: 在「某些教父们」的称谓中，无疑也可以指代叶夫列姆神父本人。他那些关于《论祷告》的奇妙篇章，正是绝佳的佐证。
  '[40]':
    ru: Монашеское правило на Афоне выполняется сразу после сна – обычно за час до начала полунощницы. Состоит же оно традиционно из Иисусовой молитвы, выполняемой по четкам в ночном мраке келии. Для совершения правила на Афоне используют четки, состоящие из трехсот узелков. Правило включает в себя девятьсот молитв Иисусовых (как мы сказали, в Греции используют пятисловную молитвуГосподи, Иисусе Христе, помилуй мя) – три четки, и триста молитв Божией Матери (Пресвятая Богородице, спаси нас) – одна четка.
    cn: 阿索斯山上的修道规程在睡醒后立刻执行——通常在半夜礼拜开始前一小时。它传统上由在小室的夜色中用念珠执行的耶稣祷文组成。为了在阿索斯山执行此规程，使用的是由三百个结组成的念珠。该规程包括九百遍耶稣祷文（正如我们所说，在希腊，人们使用五字祷文：上主，耶稣基督，怜悯我）——即三串念珠，以及三百遍圣母祷文（至圣圣母，拯救我们）——即一串念珠。
