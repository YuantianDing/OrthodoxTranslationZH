    text:
      ru: Предисловие святителя Феофана Затворника к первому изданию
      cn: 圣主教提奥凡隐修者为第一版撰写的序言
  - type: paragraph
    text:
      ru: Тропарь и кондак преподобному Ефрему Сирину
      cn: 可敬者埃弗雷姆·叙利亚人的颂词与赞词
  - type: paragraph
    text:
      ru: Предисловие святителяФеофана Затворникак первому изданию
      cn: 圣主教提奥凡·扎特沃尼克为第一版所作的前言
  - type: paragraph
    text:
      ru: «Псалтирь, или Богомысленные размышления, извлеченные из творений святого отца нашего Ефрема Сирианина и расположенные по порядку псалмов Давидовых» – такое название дается настоящему изданию, заключающему в себе избранные молитвенные к Богу возношения святого преподобногоЕфрема Сирина, ибо Псалтирь и есть книга богохвалений, или молитвенных к Богу возношений. Святой Ефрем исполнен был благодати Божией и, ею движимый, изливал пред Богом сердечные молитвы свои.
      cn: 「《诗篇集，或神思冥想，摘自我们的圣父埃弗雷姆·叙利亚人的著作，并按照达维德诗篇的顺序编排》」——这样的名称赋予了本出版物，其中包含圣大德埃弗雷姆·叙利亚人精选的献给上帝的祷告文，因为诗篇集就是一本颂赞上帝之书，或者说是一本献给上帝的祷告之书。圣埃弗雷姆被上帝的恩典充满，并受其感动，向上帝倾吐了他衷心的祷告。
  - type: paragraph
    text:
      ru: Возгревать в себе дух благодатный есть долг всякого христианина. Главное средство к тому – молитва. В ком возгрета благодать, тот и сам молится как должно, когда благодатная сила в нем в движении, но кто не дошел еще до того, тому необходимо самую молитву воспитывать в себе, воспитывается же она духодвижимыми молитвами, излившимися из пламеневших благодатью душ. Вот почему СвятаяЦерковьдает в руки православным христианам молитвенники; этому же способствовать может и настоящее издание избранных молитв.
      cn: 挑旺自己里面的恩典之灵，是每一位基督徒的义务。达此目的的主要方法就是祷告。在那里面恩典已被挑旺的人，当恩典的力量在他里面运行之时，他自己也会如其所当的祷告；但那尚未达到此境地的人，则有必要在自己里面培养祷告，而祷告则通过从那些被恩典之火焚烧的灵魂中倾泻而出的、被圣灵感动的祷告来培养。这就是为何圣教会将祷告书递到正教基督徒手中；而本版精选祷告文集也能为此助益。
  - type: paragraph
    text:
      ru: Как между пророками святой Давид есть по преимуществу псалмопевец, так между святыми отцами святой Ефрем есть по преимуществу молитвенник. Душа его ни одного божественного предмета не могла коснуться без того, чтобы не восторгаться горé в молитвенных излияниях чувств. Оттого писания его преисполнены молитв. Сего святого отца по справедливости можно назвать христианским псалмопевцем.
      cn: 就像在先知之中，圣大卫是卓越的诗篇歌者；同样，在圣教父之中，圣厄弗楞是卓越的祈祷者。他的灵魂，一触及任何神圣的事物，便会立即在祈祷情感的倾泻中，向上激昂。因此，他的著作充满了祷告。这位圣教父可以被公正地称为一位基督徒诗篇歌者。
  - type: paragraph
    text:
      ru: Мерой числа выбранных статей послужило число псалмов богодухновенной Псалтири, а указателем содержания их – содержание псалмов. В псалмах кроме молитв есть догмат, есть история, есть нравоучение. Такого же содержания статьи внесены и в настоящее издание избранных молитв из писаний святого Ефрема.
      cn: 所选文章数量的衡量标准是那受上帝默示的《诗篇》中诗篇的数量，而其内容的指示则为诗篇的内容。在诗篇中，除了祷文，还有教义、历史和道德教诲。同样内容的文章也被收录于本版选自圣厄弗冷著作的祷文之中。
  - type: paragraph
    text:
      ru: Из догматов у нас исстари при Псалтири печатаются исповедания веры святогоАфанасия Великогои святогоМаксима Исповедникао Пресвятой Троице и о воплощении Бога Слова. Изложение этих догматов взято здесь из святого Ефрема. История в псалмах есть история народа Божия. История в молитвах святого Ефрема есть история всякого христианина, которая внешне определяется рождением, житием на земле, смертью, воскресением и вечной участью, а внутренне состоит преимущественно из борьбы с грехом, из восстаний и падений, из светлых состояний в добре и из мрачных пребываний во зле. В писаниях святого Ефрема всё это изображено в самых тонких оттенках и в самых разнообразных подробностях. Это преимущественная часть нашего издания.
      cn: 在我们的传统中，自古以来，与《诗篇》一同印有圣大阿塔纳修和圣马克西姆宣信者关于至圣三位一体和上帝圣言道成肉身的信德告白。这些教义的阐述取自圣埃弗雷姆。诗篇中的历史是上帝子民的历史。圣埃弗雷姆祷文中的历史是每一位基督徒的历史，它在外在层面由出生、世上的生活、死亡、复活和永恒的归宿所决定；而在内在层面则主要由与罪恶的搏斗、兴起与跌倒、在善中的光明状态和在恶中的阴暗境况构成。在圣埃弗雷姆的著作中，这一切都以最细微之处和最详尽的细节描绘出来。这是我们出版物的主要部分。
  - type: paragraph
    text:
      ru: Нравоучение в Псалтири составляет содержание большей части псалмов. В соответствие им из святого Ефрема взяты «блаженства» и «горе» с прибавлением других очень немногих статей под заглавием «Уроки жизни». Внести и нравоучительные статьи в Псалтирь нашу заставило желание разнообразить ее содержание, а избирать преимущественно указанные статьи располагало то, что по форме выражения они очень подходят к молитвенным оборотам речи.
      cn: 诗篇集中的道德教诲构成了大部分诗篇的内容。与此相应，从圣厄弗冷那里选取了「真福」和「祸哉」，并增补了极少数其他题为「生命课程」的篇章。将这些道德教诲性文章纳入我们的诗篇集，是出于希望使其内容多样化；而之所以主要选择上述篇章，是由于就其表达形式而言，它们非常适合祈祷的言语表达方式。
  - type: paragraph
    text:
      ru: 'Подражая богодуховенной Псалтири в числе и содержании статей, подражаем ей и в разделении, какое дается ей в церковном употреблении: 150 статей разделены на 20 отделений, как Псалтирь – на 20 кафизм. В начале каждого почти из двадцати отделений помещается догмат, а в конце нравоучение – «Уроки жизни».'
      cn: 效仿上帝所默示的《诗篇》在篇章数目和内容上，我们也效仿它在教会使用中所具有的划分方式：150篇章被划分为20个部分，如同《诗篇》被划分为20首「卡菲斯玛」一样。几乎每个这20个部分的开头都设有一篇教义，而在末尾则有道德训诫——题为「生命课程」。
  - type: paragraph
    text:
      ru: 'Имелось в виду, чтобы каждая молитва содержала нечто особое. Со вниманием читающий тотчас заметит это при всей, по-видимому, одинаковости молитвенных оборотов речи. Но и для того, кому иные молитвы покажутся одинаковыми, не должно быть скучно читать их, как не скучно любящему молиться повторять неисчетное число раз: «Господи, помилуй» или: «Господи Иисусе Христе, Сыне Божий, помилуй мя грешнаго».'
      cn: 本意是让每句祷文都包含独特之处。用心阅读之人，尽管祷文的语句表面上似乎千篇一律，却会立刻注意到这一点。然而，即便对于那些觉得某些祷文千篇一律的人，也不应该对阅读这些祷文感到厌倦，正如热爱祷告之人，重复无数次「求主怜悯」或「主耶稣基督，上帝之子，怜悯我这罪人」也不会感到厌倦一样。
  - type: paragraph
    text:
      ru: 'Сопровождаем сию Псалтирь желанием искренним, чтобы всякий, раскрывающий ее, всегда находил в ней для себя нужное по состоянию своего духа: то вразумление, то сокрушение, то воодушевление, то утешение.'
      cn: 我们怀着真挚的愿望，附上此《诗篇》，愿凡翻阅此书者，总能按其心灵的光景，在其中找到于己所需的：或得训诲，或得痛悔，或得鼓舞，或得安慰。
  - type: paragraph
    text:
      ru: Молитвами святого отца нашего Ефрема Сирина да подаст сие Господь всем нам!
      cn: 藉着我们圣父叙利亚的埃弗莱姆的祷告，愿主将此恩赐给我们众人！
  - type: paragraph
    text:
      ru: Тропарь и кондак преподобному Ефрему Сирину
      cn: 可敬者埃弗雷姆·叙利亚人的颂词与赞词
  - type: paragraph
    text:
      ru: Тропарь преподобному Ефрему, глас 8
      cn: 敬拜赞歌：献给圣徒埃弗雷姆，第八调
  - type: paragraph
    text:
      ru: Слез твоих теченьми пустыни безплодное возделал еси, и иже из глубины воздыханьми во сто трудов уплодоносил еси, и был еси светильник вселенней, сияя чудесы, Ефреме отче наш, моли Христа Бога спастися душам нашим.
      cn: '祢以泪水之流，开垦了那不毛的旷野，

        并以由衷的叹息，使其在百般劳苦中百倍结实。

        祢成了普世的明灯，以神迹光耀照彻。

        我们的教父厄弗冷啊，祈求基督上帝拯救我们的灵魂。'
  - type: paragraph
    text:
      ru: Кондак, глас 2-й
      cn: 孔达克，第二调
  - type: paragraph
    text:
      ru: Час присно провидя Суда, рыдал еси горько, Ефреме, яко любобезмолвный, делателен же был еси в делех учитель, преподобне. Темже, отче всемирный, ленивыя воздвизаеши к покаянию.
      cn: 常常预见审判之期，你曾痛哭流涕，厄弗楞啊，作为爱慕静默者，你却在言行上是一位勤勉的导师，圣者啊。因此，普世之父啊，你唤醒那些懒惰者归向悔改。
- type: heading1
  text:
    ru: Псалтирь прп. Ефрема Сирина
    cn: 可敬者厄弗冷叙利亚人的《诗篇》
  children: []
- type: heading1
  text:
    ru: Отделение первое
    cn: 第一部分
  children:
  - type: heading2
    text:
      ru: Блаженства
      cn: 真福
    children:
    - type: paragraph
      text:
        ru: Блажен, кто о Господе стал совершенно свободен от всего земного в этой суетной жизни и возлюбил единого благого и милосердого Бога.
        cn: 有福了，那在主里已然全然脱离了这虚妄生命中一切属世之事，并且爱慕独一、良善且慈悲的上帝的人。
    - type: paragraph
      text:
        ru: Блажен, кто стал делателем добродетелей и, как плодоносная нива, приносит великое обилие плодов жизни о Господе.
        cn: 有福的，是那成为美德的实行者，他如同多结果子的田地，在主里结出极丰盛的生命果实。
    - type: paragraph
      text:
        ru: Блажен, кто, стоя у Божией службы на молитве, и всякий час, как Ангел небесный, имеет чистые помыслы и не дает доступа к себе лукавому, чтоб не взял он в плен душу его и не отвел ее от Бога Спасителя.
        cn: 有福的，就是凡是那在上帝的侍奉中祷告时，时时刻刻如同天上的天使一般，怀有纯洁的意念，不给那恶者任何可乘之机，以免他掳掠了他的灵魂，不使它偏离救主上帝。
    - type: paragraph
      text:
        ru: Блажен, кто любит святыню (чистоту), как свет, и не осквернил пред Господом тела своего срамными делами лукавого.
        cn: 蒙福的，是那爱圣洁（纯洁）如同光的人，且未曾在主面前用那恶者的羞耻行为玷污自己的身体。
    - type: paragraph
      text:
        ru: Блажен, кто всегда имеет в себе памятование о Боге, потому что таковой на земле есть как Ангел небесный, непрестанно священнодействующий Господу со страхом и любовью.
        cn: 有福的，凡心里常存对上帝的思念，因为这样的人在地上就像是天上的天使，不住地以敬畏和爱侍奉主。
    - type: paragraph
      text:
        ru: Блажен, кто любит покаяние, спасающее грешных, и не услаждается грехом, чтоб не явиться неблагодарным пред Спасителем нашим Богом.
        cn: 蒙福的，是爱慕那拯救罪人的悔改，并且不以罪为乐的人，免得在我们的救主上帝面前显得忘恩负义。
    - type: paragraph
      text:
        ru: Блажен, кто, подобно мужественному воину, хранящему сокровища царские, хранит душу свою и тело неукоризненными о Господе.
        cn: 蒙福了，那人如同守护王室珍宝的英勇战士，在主里保守自己的灵魂和身体无可指摘。
    - type: paragraph
      text:
        ru: Блажен, кто, как Ангел на небе, имеет чистые помыслы и устами песнословит Имеющего власть над всяким дыханием.
        cn: 有福了，凡如同天使在天上，怀有纯洁意念，并口颂赞歌赞美那掌管一切有气息者。
    - type: paragraph
      text:
        ru: Блажен, кто стал подобен серафиму и херувиму и никогда не бывает ленив для духовного священнослужения, неумолчно славословя Господа.
        cn: 蒙福的，是那变得像塞拉芬和基路伯，并从不懈怠于属灵的圣职事奉，不住地颂赞主的人。
  - type: heading2
    text:
      ru: Славословие Спасителю
      cn: 颂赞救主
    children:
    - type: paragraph
      text:
        ru: Поклоняюсь Тебе, Владыко, благословляю Тебя, Благий, умоляю Тебя, Святый, припадаю к Тебе, Человеколюбец, и прославляю Тебя, Христе, потому что Ты, Единородный, Владыко всяческих, Единый Безгрешный, за меня, недостойного грешника, предан смерти, и смерти крестной, чтоб освободить душу грешника от греховных уз.
        cn: 我敬拜祢，主宰，我称颂祢，至善者，我恳求祢，圣者，我俯伏于祢，爱人者，并颂扬祢，基督。因为祢，独生子，万有之主宰，唯一无罪者，为我这不配的罪人，被交付于死，且是死在十字架上，为要将罪人的灵魂从罪的捆绑中释放出来。
    - type: paragraph
      text:
        ru: И что воздам Тебе за сие, Владыко? Слава Тебе, Человеколюбче! Слава Тебе, Милосердый! Слава Тебе, Долготерпеливый! Слава Тебе, Прощающий все грехопадения!
        cn: 我为此将何以报答你，主宰啊？荣耀归于你，好施仁爱者！荣耀归于你，慈悲者！荣耀归于你，恒忍耐者！荣耀归于你，赦免一切罪愆者！
    - type: paragraph
      text:
        ru: Слава Тебе, Снисшедший спасти души наши! Слава Тебе, Воплотившийся во чреве Девы! Слава Тебе, Понесший узы! Слава Тебе, Приявший бичевания! Слава Тебе, Преданный посмеянию! Слава Тебе, Распятый! Слава Тебе, Погребенный!
        cn: '荣耀归于你，你降临拯救我们的灵魂！

          荣耀归于你，你道成肉身在童贞女的腹中！

          荣耀归于你，你担当了枷锁！

          荣耀归于你，你承受了鞭打！

          荣耀归于你，你被交付嘲弄！

          荣耀归于你，你被钉在十字架上！

          荣耀归于你，你被埋葬！'
    - type: paragraph
      text:
        ru: Слава Тебе, Воскресший! Слава Тебе, Проповеданный! Слава Тебе, в Которого мы уверовали! Слава Тебе, Вознесшийся на Небо! Слава Тебе, Восседший со славойодеснуюОтца и паки грядущий с сонмами Ангелов судить всякую душу, уничижавшую святые страдания Твои!
        cn: 荣耀归于祢，复活的祢！荣耀归于祢，被宣讲的祢！荣耀归于祢，我们所信的祢！荣耀归于祢，升天的祢！荣耀归于祢，荣耀地坐在父右边的祢，并再次带着天使万军降临，审判那一切轻蔑祢圣洁受难的灵魂！
    - type: paragraph
      text:
        ru: 'В оный трепетный и страшный час, когда подвигнутся небесные Силы, когда пред славой Твоей со страхом и трепетом будут стоять все ангелы, архангелы, херувимы и серафимы, когда потрясутся основания земли и ужаснется всякое дыхание от несравнимого величества славы Твоея, – в оный час да покроет меня рука Твоя под крылами Своими и да избавится душа моя от страшного огня, и скрежета зубов, и тьмы кромешной, и вечного плача, чтоб и я мог сказать, благословляя Тебя: «Слава Восхотевшему спасти грешника по великим щедротам Своего благоутробия!»'
        cn: '在那战栗可怖的时刻，

          当天上的众能力被触动时，

          当一切天使、大天使、基路伯和撒拉弗在你的荣耀前战兢恐惧地站立时，

          当你的地的根基震动，万物生灵都因你那无可比拟的荣耀威严而惊恐不已时，

          ——在那时刻，愿你的手在你的翅膀下遮蔽我，

          愿我的灵魂得以脱离那可怕的火，脱离切齿，脱离外边的黑暗，脱离永远的哀哭，

          好使我，也能在称颂你时说：

          「荣耀归于那乐意凭他腹中极大的怜悯拯救罪人者！」'
  - type: heading2
    text:
      ru: Даруй благодать всеудовлетворяющую!
      cn: 赐予全然满足的恩典！
    children:
    - type: paragraph
      text:
        ru: 'Исцели меня, Господи, и исцелюсь! Единый Премудрый и Милосердый Врач, умоляю благостыню Твою: исцели язвы души моей и просвети очи ума моего, чтоб уразуметь мне всегдашнее Твое о мне домостроительство! И поскольку сердце мое и ум мой объюродели, то да исправит их благодать Твоя, эта истинная соль.'
        cn: 医治我，主啊，我就必得医治！独一全智又慈悲的医者啊，我恳求祢的良善：医治我灵魂的创伤，光照我心智的眼目，使我能明白祢对我永恒的经纶！又因我的心和我的意念都已变得愚钝，愿祢的恩典，这真正的盐，来修正它们。
    - type: paragraph
      text:
        ru: Что скажу Тебе, Сердцеведец, испытующий сердца и утробы? Ты Сам знаешь, что, как земля безводная, жаждет Тебя душа моя и вожделевает Тебя сердце мое. Благодать же Твоя всегда насыщала того, кто любит Тебя.
        cn: 测透人心的主啊，察验人心和肺腑的祢，我该向祢说什么呢？祢自己知道，我的灵魂如同无水的旱地般切慕祢，我的心也渴慕祢。然而祢的恩典，却始终使那爱祢的人得饱足。
    - type: paragraph
      text:
        ru: Сего ради как всегда внимал Ты мне, так и ныне не презри моления моего! Ибо вот ум мой, как пленник, ищет Тебя, единого истинного Спасителя.
        cn: 为此，祢向来垂听我，此刻亦莫轻看我的恳求！因为看哪，我的心智如同囚犯，寻求祢，唯一的真正救主。
    - type: paragraph
      text:
        ru: Пошли же благодать Твою, да насытит глад мой и утолит жажду мою, ибо ненасытимо вожделеваю Тебя, Владыко мой! И кто может насытиться Тобою, если истинно любит Тебя и жаждет света истины Твоей?
        cn: 愿你降下你的恩典，以满足我的饥饿，止息我的干渴，因我永不止息地切慕你，我的主宰啊！又有谁能因你而得饱足呢，若他真切地爱你，并渴慕你真理的光辉？
    - type: paragraph
      text:
        ru: Податель света! Исполни прошение мое и даруй мне по молитве моей, источи в сердце мое единую каплю благодати Твоей, да возгорится в сердце моем пламень любви Твоей, как огонь, и, как терния и волчцы, да пояст лукавые помыслы!
        cn: '赐光者啊！

          求你成就我的祈求，并按照我的祷告赐予我，

          将你恩典的一滴倾注在我心中，

          使你爱的火焰如火般在我心中燃起，

          并像荆棘和蒺藜一般，吞噬我邪恶的意念！'
    - type: paragraph
      text:
        ru: Даруй мне сие богатне, яко Бог человеку, подай, как Царь царствующих, умножь, как добрый Отец!
        cn: 愿你将此财富恩赐于我，如同上帝恩赐世人；赐予我，如同万王之王；使之倍增，如同慈父！
  - type: heading2
    text:
      ru: В Тебе все для нас, Господи!
      cn: 在你里面，一切都为了我们，主啊！
    children:
    - type: paragraph
      text:
        ru: Тебя, Господа, ищем мы в молитве, потому что в Тебе заключено все. Тобою да обогатимся, потому что Ты – богатство, не изменяющееся от перемены времен.
        cn: 主啊，我们在祷告中寻求祢，因为万物都包含在祢之内。愿我们因祢而丰盛，因为祢是不因时光流转而改变的财富。
    - type: paragraph
      text:
        ru: Милосердие Твое да приидет на помощь к нам! Благодать Твоя да защитит нас! Из сокровища Твоего излей на нас врачевство, исцеляющее язвы наши!
        cn: 愿你的怜悯前来帮助我们！愿你的恩典保护我们！从你的宝库中，倾注医治我们创伤的良药！
    - type: paragraph
      text:
        ru: Тебя должны мы искать вместо всего иного и кроме Тебя не искать ничего, ибо кто ищет Тебя, тот все находит в Тебе.
        cn: 我们应当寻求您，而不是寻求其他一切，并且除了您，不寻求任何事物；因为凡是寻求您的人，那人将在您里面寻得一切。
    - type: paragraph
      text:
        ru: В Тебе – богатство для нуждающихся, сердечная радость для скорбящих, врачевство для всех уязвленных, утешение для всех сетующих.
        cn: '在祢里面，是贫乏者的财富，

          是忧伤者由衷的喜乐，

          是所有受创者的医治，

          是所有哀叹者的安慰。'
    - type: paragraph
      text:
        ru: Приими молитву нашу, Господи наш, и даруй нам Себя Самого. В Тебе да живем мы, Тобою да обладаем вместо всего иного, и тогда всё – наше.
        cn: 垂听我们的祷告，我们的主啊，并赐予我们祢自己。愿我们活在祢里面，愿我们拥有祢以取代万物，那时，一切就都是我们的了。
    - type: paragraph
      text:
        ru: Дай нам, Господи, быть Твоими! По милосердию Своему будь и Ты нашим, потому что Праведный Отец дал нам Тебя во врачевство от язв наших.
        cn: 愿我们属于祢，主啊！凭着祢的慈悲，愿祢也属于我们，因为公义的父将祢赐予我们，作为医治我们创伤的良药。
    - type: paragraph
      text:
        ru: Наш Ты по воле Отца Твоего, наш Ты и по Твоему изволению. С нами Ты – Эммануил! С нами Ты, яко Господь наш.
        cn: 祢是我们的，因祢父的旨意；祢也是我们的，因祢自己的决意。祢与我们同在——厄玛努埃尔！祢与我们同在，因祢是我们的主。
    - type: paragraph
      text:
        ru: Приими от нас молитвы наши, снисшедший к нам Боже наш, приими слезы грешников и окажи милость виновным.
        cn: 求你垂纳我们的祈祷，降临于我们的上帝啊，求你垂纳罪人的泪水，并施怜悯于有罪之人。
    - type: paragraph
      text:
        ru: По Своему изволению соединился Ты с нами, будь Ходатаем нашей молитвы. Вознеси ее к Отцу Твоему и утверди мир в душах наших!
        cn: '按祢的旨意，祢与我们联合，

          作我们祷告的代祷者。

          将它呈献给祢的父，

          并在我们的灵魂中确立平安！'
  - type: heading2
    text:
      ru: Будь для нас всем и дай нам Тебе посвятить все свое!
      cn: 成为我们的一切吧，并赐予我们将我们的一切都奉献给你！
    children:
    - type: paragraph
      text:
        ru: Как зеницу ока сохрани меня, Господи Боже, защити и под крылами Твоими укрой меня от искушений.
        cn: 主上帝啊，求你如同眼中的瞳人保守我，保护我，并在你翅膀的荫下庇护我，使我免受试探。
    - type: paragraph
      text:
        ru: Будь стражем ока, чтоб не смотрело оно татски[1]; будь стражем уха, чтоб не внимало оно неправде.
        cn: 作你眼睛的守卫，以免它像贼一样张望[1]；作你耳朵的守卫，以免它听从虚假。
    - type: paragraph
      text:
        ru: Будь стражем устен, чтоб не исходила из них клевета, осуждение, хула и даже праздное слово.
        cn: 看守你的口舌，以免从中发出诽谤、论断、亵渎，甚至是一句闲话。
    - type: paragraph
      text:
        ru: Будь стражем сердца, чтоб оно не уклонялось в лукавство и не делало беззаконий.
        cn: 守卫你的心，以免它偏离诡诈，也不行不法之事。
    - type: paragraph
      text:
        ru: Даруй нам, Господи, познание (что делать) и приложи нам ведение (умение делать).
        cn: 主啊，求祢恩赐我们认识（当做什么）并加添我们实行之能（会做什么）。
    - type: paragraph
      text:
        ru: Даруй нам, Господи наш, быть для Тебя приятнее благовоний и ароматов.
        cn: 我主啊，求祢赐予我们，使我们比各样馨香与芳香更蒙祢喜悦。
    - type: paragraph
      text:
        ru: Даруй нам, Господи наш, возлюбить Тебя и возненавидеть мир. Даруй нам, Господи наш, вместо переходящих имений приобрести Тебя Единого.
        cn: 我们的主啊，求你赐予我们爱慕你，并憎恶世界。我们的主啊，求你赐予我们，取代那转瞬即逝的财物，只获得你。
    - type: paragraph
      text:
        ru: 'Даруй нам, Господи наш, принести Тебе три избранные дара. Даруй нам, Господи наш, воскурить пред Тобою три благоуханных кадила. Даруй нам, Господи наш, возжечь Тебе три ярко горящих светильника: дух, душу и тело, сии три дара Единой Троице.'
        cn: '我们的主啊，求祢恩准我们向祢奉献三份精选的献礼。

          我们的主啊，求祢恩准我们向祢焚献三份馨香的香。

          我们的主啊，求祢恩准我们为祢点燃三盏明亮燃烧的明灯：

          灵、魂与身体，这三份恩赐，献给独一三一真上帝。'
    - type: paragraph
      text:
        ru: Дух посвятим Отцу, душу посвятим Сыну, тело посвятим Духу Святому – Духу, Который вновь восставит его из праха.
        cn: 我们将灵奉献给父，将魂奉献给子，将身体奉献给圣灵——那位将使身体从尘土中再次复活的灵。
    - type: paragraph
      text:
        ru: Отче, освяти Себе дух наш! Сыне, освяти Себе душу нашу! Душе Святый, освяти Себе тело наше, изнемогающее от язв!
        cn: '父啊，圣化我们的灵！

          子啊，圣化我们的魂！

          圣灵啊，圣化我们这因创伤而衰弱的身体！'
    - type: paragraph
      text:
        ru: Даруй нам, Господи наш, возрадоваться о Тебе, и Ты возрадуйся о нас в последний день! Хвала Тебе от духа, души и тела! А нам – щедроты Твои.
        cn: 哦，我们的主，求祢赐予我们因祢而欢喜，并且祢在末日也因我们而欢喜！赞美归于祢，发自灵、魂、体！而我们，则蒙祢的丰盛恩泽。
  - type: heading2
    text:
      ru: Надежды оставивших мир
      cn: 弃世者的希望
    children:
    - type: paragraph
      text:
        ru: 'Сын Иессеев, настроив цевницу свою, воспевает:Блаженны непорочные в путиГосподни,ходящие в законеЕго (Пс. 118:1). И Спаситель наш в Евангелии жизни сказал: блажени чистии сердцем, яко тии Бога узрят; блажени сетующие, яко тии утешатся; блажени плачущие, яко тии возвеселятся (см.:Мф. 5:4, 8).'
        cn: 耶西之子，调好他的琴，歌唱道：「行为完全，遵行上主律法的，这人便为有福！（诗篇 118:1）」 我们的救主在生命的福音里说道：「清心的人有福了，因为他们必得见上帝；哀恸的人有福了，因为他们必得安慰；哭泣的人有福了，因为他们必得喜乐。（参：马太福音 5:4，8）」
    - type: paragraph
      text:
        ru: Отрекшимся от мира и от суетных дел его, возненавидевшим похоти его и гнушающимся утехами его в Евангелии спасения дано обетование воздаяния – непереходящий чертог и нескончаемая жизнь.
        cn: 那些弃绝世界及其虚妄之事，憎恶其情欲，并厌弃其享乐的人，在救赎的福音中，已蒙应许赏赐——不朽的殿堂和无尽的生命。
    - type: paragraph
      text:
        ru: Из любви к Господу своему оставили они в мире сем родных, родителей, богатства и имение, ибо слышали, чтоблаженны нищие духоми за сие ожидает их Горнее Царство (Мф. 5:3).
        cn: 因着对他们主的爱，他们在这世上舍弃了亲人、父母、财富和产业，因为他们听见说虚心的人有福了，并且天国必将属于他们（马太福音 5:3）。
    - type: paragraph
      text:
        ru: Тела свои соделали они храмом Духа Святого, строгостью жизни препобедили похоти, несли иго тяжких трудов, из любви к Господу своему презирали жизнь свою.
        cn: 他们将自己的身体化作圣灵的殿堂，以严谨的生活克服了情欲，承受了繁重劳作的轭，并出于对他们主的爱，轻看自己的生命。
    - type: paragraph
      text:
        ru: Распяли они души свои, пригвоздили ко кресту тела свои и подвижничеством своим умилостивили Творца своего.
        cn: 他们钉死了自己的灵魂，将自己的身体钉在十字架上，并藉着他们的苦修，使他们的造物主得蒙悦纳。
    - type: paragraph
      text:
        ru: Они возгнушались чревоугодием и возлюбили воздержание, отгнали от себя плотскую нечистоту и возлюбили целомудрие.
        cn: 他们憎恶暴食，爱慕节制；摒弃肉体的不洁，爱慕贞洁。
    - type: paragraph
      text:
        ru: Они избрали себе злострадания (всякие лишения) и возненавидели покой, совлеклись гордости и облеклись в смирение.
        cn: 他们拣选了困苦（各种克己和舍弃），憎恶安逸，脱去了骄傲，披戴上谦卑。
    - type: paragraph
      text:
        ru: Победили они врага и восторжествовали над ним, обратили его в бегство и приобрели себе славу; победили его – и возвеличены, презрели его – и увенчаны.
        cn: 他们战胜了仇敌，并得胜了他，使他溃逃，为自己赢得了荣耀；他们战胜了他，就被尊荣；藐视了他，就被加冕。
    - type: paragraph
      text:
        ru: 'Отец любит их, и Сын с любовью объемлет, и Дух Святой вселяется в чистые тела их. Христос взывает к ним, говоря: «Приидите, потрудившиеся во имя Мое, войдите в чертог, из которого никогда не выйдут званые!»'
        cn: 父爱他们，子慈爱地拥抱他们，圣灵内住于他们洁净的身体里。基督呼唤他们说：「来吧，那些为我的名劳苦的人，进入那殿堂吧，蒙召者永不从那里出去！」
    - type: paragraph
      text:
        ru: На таковых Господь возлагает венцы, и вкушают они блаженство в чертогах Его за скорби, понесенные с Ним с утра до вечера. Горнее Царство ожидает к себе тех, которые одержали победу во брани и прославились тем.
        cn: 主给这样的人加冕，他们因着从早到晚与祂一同承担的苦难，在祂的殿宇中尝到福乐。天上的国度等待那些在争战中得胜并因此得荣耀的人。
    - type: paragraph
      text:
        ru: 'Ангелы по обычаю своему нисходят подкреплять борцов во время брани. Духи стремятся во сретение победителям, именуют их блаженными и говорят: «Приидите, утружденные, успокойтесь от трудов своих: терпением страданий победили вы лукавого».'
        cn: 天使按其惯例，在争战之时降临，以坚固那些搏斗者。众灵奔赴相迎胜利者，称他们为有福的，并说：「来吧，劳苦的人啊，从你们的劳苦中得享安息吧：你们借着忍受苦难，已经战胜了那恶者。」
    - type: paragraph
      text:
        ru: Рай отверзает им врата свои; вселяются они в обители света и упокоеваются там. В устах их глас славословия и хвалы Тому, Кто укреплял их во брани.
        cn: 天堂为他们敞开大门；他们安居在光明居所中，并在那里安歇。在他们口中，有颂赞与称颂之声，归于那位在争战中坚固他们的。
  - type: heading2
    text:
      ru: Душа, ощутившая спасение в Господе
      cn: 灵魂，在主里感受到了救恩
    children:
    - type: paragraph
      text:
        ru: Ты, Христе Спасителю, стал для меня путем жизни, ведущим к Отцу. Сей один путь – моя радость, а конец его – Царство Небесное.
        cn: 你，基督救主，成为我生命的道路，通向父。这唯一的道路是我的喜乐，而它的终点是天国。
    - type: paragraph
      text:
        ru: Ты, Владыко Иисусе, Сыне Божий, стал для меня путем жизни и просвещением.
        cn: 你，吾主耶稣，上帝之子，成了我的生命之道和光照。
    - type: paragraph
      text:
        ru: Благодать Твоя в сердце раба Твоего стала светом и радостью, которые сладостнее паче меда и сота устам служителя Твоего.
        cn: 你的恩典在你仆人的心中成了光和喜乐，这些光和喜乐对你仆役的口舌而言，比蜜和蜂房更甘甜。
    - type: paragraph
      text:
        ru: Благодать Твоя в душе раба Твоего стала сокровищем, обогатила нищету его, изгнала бедность и растление.
        cn: 你的恩典在你仆人的灵魂中，成了宝藏，丰裕了他的贫乏，驱逐了贫困和败坏。
    - type: paragraph
      text:
        ru: Благодать Твоя стала для раба Твоего прибежищем, силой, заступлением, возвышением, похвалой, пищей для всей жизни.
        cn: 你的恩典已成为你的仆人的避难所、力量、护佑、提升、赞美和一生之粮。
    - type: paragraph
      text:
        ru: Как умолчит раб Твой, Владыко, вкусив великую сладость любви Твоей и благодати? И как опять осмелюсь я положить преграду волнам благодати, изливающимся в сердце грешника и исполненным сладости по множеству дарований?
        cn: 您的仆人怎能缄默呢，主宰啊，他已尝过祢爱和恩典那莫大的甘甜？我又怎敢再次为恩典的波浪设置阻碍，这波浪倾泻入罪人的心，并因着那众多的恩赐而充满甘甜？
    - type: paragraph
      text:
        ru: Воспою славу Владыки небесных Сил, возвеличу благодать Твою, Христе Спасителю, не престану языком моим песнословить любовь Твою.
        cn: 我将歌颂天军主宰的荣耀，颂扬你的恩典，基督救主，我必不止息地以我的舌头歌颂你的爱。
    - type: paragraph
      text:
        ru: Любовь Твоя влечет меня к Тебе, Спаситель, хвала жизни моей.
        cn: 你的爱将我牵引到你身边，救主，我生命的颂赞。
    - type: paragraph
      text:
        ru: Благодать Твоя делает сладостным для меня то, что ум мой влечется вслед Тебя.
        cn: 祢的恩典，使我的心神受祢牵引一事，于我甘甜。
    - type: paragraph
      text:
        ru: Да будет сердце мое доброй для Тебя землей и благодать Твоя да орошает его росой жизни вечной.
        cn: 愿我的心成为祢的良土，且愿祢的恩典以永生之露浇灌它。
    - type: paragraph
      text:
        ru: 'Да пожнет благодать Твоя добрую рукоять на земле сердца моего: сокрушение, поклонение, святыню и все, угодное Тебе всегда.'
        cn: 愿你的恩典在我心田里，收割美好的禾捆：痛悔、敬拜、圣洁，以及一切永远蒙你悦纳的事。
    - type: paragraph
      text:
        ru: 'Возврати душу мою в ограду рая сладости, да пребудет она во свете, чтобы среди райского наслаждения и мне сказать со всеми святыми: «Слава Отцу Бессмертному, поклонение Тому, Кто дает небесные дарования ничтожному, чтобы и он принес драхму славы Царю всех!»'
        cn: 将我的灵魂归回甜美天堂的园囿，使其安住在光明中，以便我亦能身处天堂的喜乐中，与众圣徒一同说：「荣耀归于不朽的父，崇敬归于那将属天恩赐施予卑微者，使他也能将一德拉克马的荣耀献给万有之王！」
- type: heading1
  text:
    ru: Отделение второе
    cn: 第二部分
  children:
  - type: heading2
    text:
      ru: Падшим грешникам одна надежда – Господь распятый
      cn: 堕落的罪人唯一的希望——被钉十字架的主。
    children:
    - type: paragraph
      text:
        ru: Оплачьте наготу мою, возлюбленные братья мои! Прогневал я Христа порочной жизнью своей. Как Благой сотворил Он меня и дал мне свободу, а я, злоупотребив ею, воздал Ему злом – нечестивыми делами своими.
        cn: 请为我的赤裸哀哭吧，我蒙爱的弟兄们！我以我败坏的生活触怒了基督。祂本是良善的，祂创造了我并赐予我自由；而我却滥用了这自由，以我那不虔敬的行为，以恶回报了祂。
    - type: paragraph
      text:
        ru: Господь всяческих сотворил меня совершенным и соделал орудием славы Своей, чтобы я служил Ему и святил имя Его, а я, несчастный, соделал члены свои орудиями греха и творил ими всякую неправду. Увы мне, потому что Он праведно осудит меня.
        cn: 万物之主创造了我，使我完美无缺，并且使我成为祂荣耀的工具，为了让我事奉祂，并尊崇祂的名。然而，我这不幸之人，却使我的肢体成为罪的工具，并且借由它们行了各样不义。唉，我真不幸，因为祂将公义地定我的罪。
    - type: paragraph
      text:
        ru: Срамные дела мои предварят меня на Суде и будут обвинять бедную душу мою. Неотступно умоляю Тебя, Спаситель мой, осени меня крылами Своими и не обнаруживай скверн моих на Великом Суде Твоем, чтоб прославил я благость Твою.
        cn: 我的卑劣行径将在我之前，在审判日控告我可怜的灵魂。我不住地恳求祢，我的救主，用祢的翅膀荫庇我，不要在祢的大审判日显露我的污秽，好使我能颂扬祢的良善。
    - type: paragraph
      text:
        ru: Злые дела, какие делал я пред Господом всяческих, отлучают меня от сообщества святых. И поскольку жизнью своей не служил я Богу, как они, то и не имею никакой части в добрых делах их. Увы, я погиб!
        cn: 我在万有之主面前所行的恶事，使我与圣徒的团契隔绝。并且因为我没有像他们那样以生命侍奉上帝，所以我也没有在他们的善工中有任何份。唉，我灭亡了！
    - type: paragraph
      text:
        ru: Теперь постигает меня горе, чего и достоин я. А если бы подвизался вместе с ними, то, подобно им, был бы прославлен. Но поскольку был я нерадив и служил похотям, то и не принадлежу к сонму победителей, а стал наследником геенны.
        cn: 现在悲伤临到我，这也是我罪有应得的。然而，如果我曾与他们一同争战，那么我就会像他们一样得荣耀。但由于我曾懈怠又顺从了情欲，所以我不属于得胜者的行列，反而成了地狱的继承者。
    - type: paragraph
      text:
        ru: 'Тебя, пронзенный гвоздями на Кресте Победитель, взывающий грешникам: «Приидите, получайте отпущение даром!» – Тебя неотступно молю, Спаситель мой, отврати очи Твои от нечестия моего; страданиями же Твоими уврачуй язвы мои, чтобы прославил я благость Твою.'
        cn: 祢，那位在十字架上被钉穿的得胜者，向罪人呼唤说：「来吧，白白领受赦免！」我的救主啊，我不住地向祢祈求，求祢转目不看我的不虔；愿祢以祢的苦难医治我的创伤，好使我能颂扬祢的良善。
    - type: paragraph
      text:
        ru: О Всеблагой, Чья благость безмерно выше неправд мира, упованием на благость Твою укрепи бедную душу мою, которая обессилена и вконец истощена тяжкими недугами неправды и греха и держится только упованием на Тебя, в Тебе надеясь найти себе утешение!
        cn: 哦，至善者，祢的美善无限超越世间的诸般不义，靠着对祢美善的信靠，坚固我贫乏的灵魂；它因不义与罪的沉重病患而衰弱无力，并已彻底枯竭，它仅靠着对祢的信靠而得以维系，只望在祢内寻得慰藉！
  - type: heading2
    text:
      ru: Оплакивается невнимание к благодатным воздействиям
      cn: 对恩典运作的漠视令人惋惜
    children:
    - type: paragraph
      text:
        ru: Как мытарь, воздыхаю, как блудница, проливаю слезы, как разбойник, вопию, как блудный сын, взываю к Тебе, Человеколюбче Христе, Спасителю мой! Укрепи изнемогшую душу мою, расслабленную от упоения сластолюбием, уврачуй струпы ее и Честною Твоею Кровию омой ее, очерненную грехами!
        cn: 如同税吏，我叹息；如同娼妓，我流泪；如同强盗，我呼喊；如同浪子，我向祢呼求，爱世人之基督，我的救主啊！求祢坚固我软弱的灵魂，它因沉湎于享乐而被削弱，医治它的创伤，并用祢宝贵的血洗净它，这被罪恶玷污的灵魂啊！
    - type: paragraph
      text:
        ru: По множеству милосердия Твоего обрати меня, единый Долготерпеливый, и избавь от всякой поблажки сластолюбия. Угаси во мне пещь страстей моих, да не сожжет она меня вконец.
        cn: 凭你丰盛的怜悯，引导我回转，你这独一恒久忍耐者，并使我脱离一切纵情逸乐的放纵。求你熄灭我里面情欲的炉火，免得它将我彻底烧尽。
    - type: paragraph
      text:
        ru: Увы мне! Ты, Господи, даровал мне свет ведения, а я омрачил его. Увы мне! Ты непрестанно посещал и посещаешь меня благодатью Твоей, а я ежечасно отвергал и отвергаю сей дар исцеления моего.
        cn: '唉，我真不幸！主啊，祢曾赐予我真知之光，而我却使它黯淡无光了。

          唉，我真不幸！主啊，祢不住地用祢的恩典眷顾着我，并仍在眷顾着我，而我却每时每刻都在拒绝，并仍在拒绝我这得以痊愈的恩赐。'
    - type: paragraph
      text:
        ru: Сколь многими дарами наделял и наделяешь Ты, Владыко, меня, грешного, а я, окаянный, всегда был и сознательно остаюсь неблагодарным Тебе!
        cn: 主宰啊，你曾赐予，且正赐予我这罪人何等丰厚的恩典，而我这可怜的，却总是对你忘恩负义，并自觉地继续如此！
    - type: paragraph
      text:
        ru: Благодать Твоя то утешает, то просвещает, то укрепляет меня, а я, по невниманию предаваясь чему-либо суетному, всегда опять погружаюсь в желчь и горечь страстей своих.
        cn: 祢的恩典或安慰我，或光照我，或坚固我；然而我，因着疏忽大意，沉湎于虚妄之事，又总是再次沉溺在我情欲的苦胆与苦毒之中。
    - type: paragraph
      text:
        ru: Ты, Преблагий, напоминаешь мне смерть и вечные муки и влечешь меня к жизни, чтобы спастись мне, а я всегда уклоняюсь от сих спасительных помышлений и отгоняю их, занявшись тем, что для меня неполезно. Посему нет мне никакого оправдания пред Тобою.
        cn: 至善者啊，你提醒我死亡和永远的刑罚，并吸引我归向生命，为使我得救。我却总是回避这些救赎的思念，并驱逐它们，沉溺于对我无益之事。因此，在你面前我毫无任何辩解。
    - type: paragraph
      text:
        ru: Ударяю в дверь милосердия Твоего, Господи, да отверзется она мне. Не престаю умолять, чтоб получить просимое, и неотступно домогаюсь помилования.
        cn: 我叩击着您慈悲的门，主啊，愿它为我敞开。我不住地恳求，为要得到所求的，并且不懈地祈求怜悯。
    - type: paragraph
      text:
        ru: Будь долготерпелив ко мне, развращенному, избавь меня от обладающих мною грехов, да, став здравым, восстану я с одра тлетворного греха.
        cn: 愿祢对我这败坏之人恒久忍耐，将我从辖制我的罪恶中解救出来，使我得以康健，能从那败坏之罪的卧榻上重新起来。
    - type: paragraph
      text:
        ru: Освободи меня от моих порочных навыков прежде, чем постигнет меня конец, ибо во аде кто исповестся Тебе?
        cn: 求你解救我脱离我那败坏的习性，在我终结临到我之前；因为在阴间谁能颂赞你呢？
    - type: paragraph
      text:
        ru: Убели оскверненный мой хитон прежде, чем вышло страшное повеление и застигло меня неготовым и постыженным.
        cn: 求你洁白我那被玷污的圣袍，免得可怕的命令发出，使我措手不及，蒙羞受辱。
    - type: paragraph
      text:
        ru: Избавь сокрушенную душу мою из уст львовых и спаси ее по благодати и щедротам Твоим молитвами Всепречистой Владычицы нашей Богородицы и всех святых.
        cn: 从狮子的口中，救拔我痛悔的灵魂，并按着祢的恩典与丰盛的慈悲拯救它，借着我们至洁的主母诞神女和所有圣徒的代祷。
  - type: heading2
    text:
      ru: Не слажу с собой, даруй дух покаяния!
      cn: 我与自己不睦，求赐悔改之灵！
    children:
    - type: paragraph
      text:
        ru: Пред славой Твоей, Христе Спасителю мой, изреку всё непотребство мое и исповедую всю неизмеримость щедрот Твоих, какие изливаешь Ты на меня по благости Твоей.
        cn: 在你的荣光面前，基督，我的救主啊，我要陈述我一切的污秽，并承认你那不可限量的厚恩，就是你按着你的美善倾泻在我身上的。
    - type: paragraph
      text:
        ru: От чрева матери моей стал я преогорчевать Тебя и ни во что вменять благодать Твою, нерадя о душе своей. Ты же, Владыко мой, по множеству щедрот Твоих милостиво и терпеливо взирал на всё лукавство мое. Главу мою возносила благодать Твоя, но она ежедневно унижаема была грехами моими.
        cn: 从我母腹中，我便开始使你深感忧伤，并将你的恩典视若无物，不顾惜自己的灵魂。然而，我的主宰啊，因你丰盛的怜悯，你仁慈而有耐心地察看我一切的邪恶。你的恩典曾使我昂首，但它却日复一日地被我的罪恶所贬抑。
    - type: paragraph
      text:
        ru: Злые навыки опутывают меня, как сети, и я радуюсь, что связан. Погружаюсь в самую глубину зла, и это веселит меня. Враг ежедневно обновляет узы мои, потому что видит, сколько рад я разнообразию сих уз.
        cn: 恶习将我缠绕，如同罗网，我却为被束缚而欢欣。我沉溺于罪恶的深渊，而这令我欢喜。仇敌每日更新我的捆绑，因为他看见我多么欢喜于这些形形色色的捆绑。
    - type: paragraph
      text:
        ru: То и достойно рыдания и плача, в том и позор и стыд, что связан я своими хотениями. И еще ужаснее то, что связываю себя теми узами, какие налагает на меня враг, и умерщвляю себя теми страстями, какие его радуют.
        cn: 这确实值得哀哭与痛泣，也带来了羞辱与耻辱，因为我被自己的意愿所束缚。更令人恐惧的是，我用仇敌加在我身上的捆绑来束缚自己，并用那些令他欢喜的私欲来杀死自己。
    - type: paragraph
      text:
        ru: Зная, однако ж, коль страшны узы сии, тщательно скрываю их от всех зрителей под благовидной наружностью. На вид облечен я в прекрасную одежду благоговения, а душа опутана срамными помыслами. Пред зрителями я благоговеен, а внутри исполнен всякого непотребства.
        cn: 然而，我深知这些束缚何等可怕，便小心翼翼地将它们隐藏起来，不让所有旁观者看见，藏在一副体面的外表之下。从外表看，我身披敬虔的华美衣裳，但我的灵魂却被可耻的念头所缠绕。在旁观者面前，我显得敬虔，但在内心，我却充满了各种污秽。
    - type: paragraph
      text:
        ru: Совесть моя обличает меня в этом, и я будто и хочу освободиться от уз своих и каждый день сетую и воздыхаю о сем, – но всё оказываюсь связанным теми же сетями.
        cn: 我的良心在这事上责备我，我仿佛确实想要从我的桎梏中解脱，并且每天为此哀叹并叹息，—— 但我结果却仍然被同样的罗网捆绑着。
    - type: paragraph
      text:
        ru: Жалок я, жалко и ежедневное покаяние мое, потому что не имеет оно твердого основания. Каждый день полагаю основание зданию – и опять собственными руками своими разоряю его.
        cn: 我真可怜，我每日的悔改也是可怜的，因为它没有坚固的基础。我每天为一座建筑物奠定基础——又亲手毁坏了它。
    - type: paragraph
      text:
        ru: Покаяние мое не положило еще доброго начала, злому же нерадению моему не видно конца. Порабощен я страстям и злой воле врага, губящего меня.
        cn: 我的忏悔尚未有一个善的开端，而我邪恶的懈怠却望不见尽头。我被情欲和正在毁灭我的仇敌的邪恶旨意所辖制。
    - type: paragraph
      text:
        ru: Кто даст главе моей воду и очесам моим источники слез, да плачуся всегда пред Тобою, милосердый Боже, чтоб, послав благодать Твою, извлек Ты меня, грешника, из моря, свирепеющего волнами грехов и ежечасно обуревающего душу мою? Ибо хотения мои хуже ран, которые не терпят врачебных перевязок.
        cn: '谁能赐我的头颅以水，赐我双眼以泪泉，

          使我能在您，慈悲的上帝面前，永远哭泣？

          愿您降下您的恩典，将我这罪人从那在罪恶之浪中翻腾、每时每刻冲击我灵魂的海洋中救出。

          因为我的意念比伤口更甚，它们不容许医治的包扎。'
    - type: paragraph
      text:
        ru: 'Выжидаю в надежде покаяния и обманываю себя сим суетным обещанием, пока умру. Всегда говорю: покаюсь – и никогда не каюсь. На словах будто усердно каюсь, а делами весьма далек от покаяния.'
        cn: 我怀着悔改的希望蹉跎等待，并凭着这空虚的应许欺骗自己，直到我死去。我总是说：「我会悔改」，却从不悔改。言语上，我仿佛殷勤地悔改，但行动上，我却离悔改甚远。
    - type: paragraph
      text:
        ru: Что же будет со мною в день испытания, когда Бог откроет все пред Судилищем Своим! Конечно, осужден буду на муки, если здесь слезами не умилостивлю Тебя, Судию моего.
        cn: 那么，在审判之日，当上帝在祂的审判台前揭示一切时，我将如何呢！当然，如果我在此生不以泪水恳求祢——我的审判者的怜悯，我必将被判受苦难。
    - type: paragraph
      text:
        ru: 'Уповая убо на щедроты Твои, Господи, к Тебе припадаю и Тебя умоляю: даруй мне дух покаяния и изведи из темницы беззаконий душу мою! Да воссияет луч света в моем разуме, пока не отошел я на страшный ожидающий меня Суд, на котором уже не будет места покаянию в худых делах.'
        cn: 主啊，我因此仰仗着祢丰盛的怜悯，俯伏在祢面前，恳求祢：赐给我悔改的灵，并将我的灵魂从罪孽的监牢中领出！愿一道光芒照耀我的心智，在我尚未离去，去那等候着我的可怕审判之前，在那审判中，为我的恶行将不再有悔改的余地。
  - type: heading2
    text:
      ru: Не справлюсь с собой и с врагом, Ты, Господи, помоги!
      cn: 我无法克服自己，也无法克服仇敌，主啊，求你帮助我！
    children:
    - type: paragraph
      text:
        ru: Никто не может уврачевать болезнь мою, кроме Того, Кто ведает глубины сердечные.
        cn: 无人能医治我的疾病，除了那洞悉心灵深处者。
    - type: paragraph
      text:
        ru: Сколько раз полагал я себе пределы и строил стены между собой и грехом! Но мысль моя преступала пределы, и своя воля подрывала стены, потому что пределы не были обезопашены страхом Божиим и стены не были основаны на искреннем покаянии.
        cn: 我多少次给自己设定界限，在自己和罪之间筑起高墙！但是我的思想越过了界限，我的私欲破坏了高墙，因为这些界限没有被对上帝的敬畏所保守，那些高墙也没有建立在真诚的悔改之上。
    - type: paragraph
      text:
        ru: И паки ударяю в дверь, чтоб отверзлась она для меня, не престаю просить, чтоб получить просимое, и стыда не знаю, домогаясь себе помилования у Тебя, Господи.
        cn: 我再次敲门，为要使它为我敞开；不住地祈求，为要获得所求的；并且，主啊，我向你为自己恳求怜悯，却毫不感到羞耻。
    - type: paragraph
      text:
        ru: Господи Спасителю мой! Почто Ты меня оставил? Умилосердись надо мной Ты, единый Человеколюбивый! Спаси меня грешного Ты – единый Безгрешный!
        cn: '我的主，我的救主啊！

          你为何撇下我？

          怜悯我吧，你这唯一爱世人的！

          拯救我这罪人吧，你这唯一无罪的！'
    - type: paragraph
      text:
        ru: Исторгни меня из тины беззаконий моих, чтоб не погрязнуть мне в них навеки, избавь меня от челюстей врага, который, как лев, рыкая, хочет поглотить меня.
        cn: 将我从我罪孽的泥沼中拔出，免得我永远陷溺其中；将我从仇敌的口中解救，他如同吼叫的狮子，想要吞噬我。
    - type: paragraph
      text:
        ru: Воздвигни силу Твою и прииди во еже спасти мя! Блесни Твоей молнией и разжени силу его, чтоб, страхом пораженный, бежал от лица Твоего, ибо нет у него силы стоять пред Тобой и пред лицом любящих Тебя. Как скоро видит он знамение благодати Твоей, приходит в страх от Тебя и со стыдом удаляется от них.
        cn: 兴起你的能力，前来拯救我！发出你的闪电，驱散他的势力，好叫他被恐惧击打，从你的面前逃跑，因为他没有力量在你面前，也没有力量在那些爱你的人面前站立。他一看见你恩典的记号，就因你而心生恐惧，并羞愧地从他们那里退去。
    - type: paragraph
      text:
        ru: И ныне, Владыко, спаси меня, яко к Тебе прибегох!
        cn: 而今，主啊，拯救我，因我已投奔于祢！
  - type: heading2
    text:
      ru: Близок последний час. Дай, Господи, покаяться, чтобы безопасно совершить страшный переход по смерти!
      cn: 临终时刻临近了。求主赐我悔改，以便能平安地度过死亡的可怕过渡！
    children:
    - type: paragraph
      text:
        ru: Долго ли не покаешься ты, бедная душа моя? Суд уже близок, огонь готов для членов твоих.
        cn: 可怜的我的灵魂啊，你还要多久不悔改呢？审判已然临近，烈火已为你的肢体预备。
    - type: paragraph
      text:
        ru: В море зол погрязал я все дни жизни моей, не оплакивая грехов своих, и се внезапно смерть наложит на меня оковы свои.
        cn: 我一生所有的日子都深陷于罪恶的汪洋之中，不曾为自己的罪孽哀恸，看哪，死亡将忽然把它的枷锁加诸在我身上。
    - type: paragraph
      text:
        ru: Сатана обольстил меня и, связав своими похотьми, увлек в плен и без жалости поверг на землю. Увы, что теперь делать мне?
        cn: 撒旦诱惑了我，用它的欲望捆绑住我，将我掳去，又毫不留情地把我摔倒在地。唉，我如今该怎么办呢？
    - type: paragraph
      text:
        ru: Ты, Праведный Судия, посрами лукавого, который воюет против меня и, когда желаю покаяться, скрытно ставит мне хитрые сети свои!
        cn: 你，公义的审判者，使那恶者蒙羞，他与我争战，且在我渴望悔改时，暗中设下他狡猾的罗网！
    - type: paragraph
      text:
        ru: Будь Помощником моим, многомилостивый Господи, и я восстану, посмеюсь над ним, разорву все сети его. Горе мне в день тот, когда будешь Ты, Господи, судить грешников! О, да не постыжусь тогда пред сонмом Ангелов!
        cn: 求你作我的帮助者，多有怜悯的主啊，我必起来，嗤笑它，扯断它所有的网罗。我有祸了，在那日，当你，主啊，审判罪人的时候！哦，愿我那时在天使的群集面前不至于羞愧！
    - type: paragraph
      text:
        ru: 'Трепещи и смущайся, душа моя, и, умоляя Господа своего, говори Ему: «Помилуй меня, Спаситель мой, и извлеки меня, погрязшую в пороках. Я – грешница и стыжусь умолять Тебя. Благодатью Твоей спаси меня, Господи, от геенны!»'
        cn: '我的灵魂啊，当战栗并感到羞愧，并恳求你的主，对祂说：

          「怜悯我吧，我的救主，把我从沉溺于罪恶之中拉出来。我是一个罪人，我羞于向您恳求。主啊，凭您的恩典，将我从地狱中拯救出来！」'
    - type: paragraph
      text:
        ru: Вот день Господень внезапно возблистает для твари и праведники выйдут в сретение Господу с горящими светильниками, а я – тьма, нет елея в моем светильнике, чтоб сретить Жениха, когда придет Он.
        cn: 看哪，主日将忽然光照万物，并且义人要拿着燃烧的灯出来迎见主。而我却是黑暗，我的灯里没有油，好去迎见新郎，当祂来的时候。
    - type: paragraph
      text:
        ru: Трепещет дух мой, слыша, что день Суда близок, в смущение приходят мысли мои от представления, что нечестивых ожидает огонь. По благости Твоей, милосердствующей о грешниках, помилуй меня, погибшего, и буду славословить Тебя, когда явится Царство Твое. Крест твой да сопровождает меня при этом страшном переходе, да отженет он от меня темные силы, да послужит мне ключом и отверзет райские двери, чтоб войти в веселие, возрадоваться и прославить мне щедроты Твои, Многомилостивый!
        cn: 我的心神战兢，听闻审判日临近；因想到有烈火等候不虔敬者，我的思绪纷乱不安。凭着你怜悯罪人的良善，怜悯我这将亡之人，当你的国度降临之时，我必称颂你。愿你的十字架在这可怖的过渡中伴随我，愿它将黑暗势力从我身边驱逐，愿它作我的钥匙，并开启乐园之门，使我进入欢欣与喜乐，并颂扬你的厚恩，多有怜悯者啊！
  - type: heading2
    text:
      ru: Вразуми и укрепи ради искупления!
      cn: 赐予明悟并加固，为着救赎的缘故！
    children:
    - type: paragraph
      text:
        ru: Да приидет в пособие нам помощь Твоя, Всеблагой, никогда не оставляющий рода нашего! Удели нам Твоей всеиспытующей премудрости, чтоб познали мы скоротечность всего! Уврачуй язвы наши покаянием!
        cn: 愿祢的帮助临到我们，哦，至善者，祢从不离弃我们人类！恳求祢赐予我们祢那洞察一切的智慧，好使我们认识万物的短暂！以悔改医治我们的创伤！
    - type: paragraph
      text:
        ru: Посети нас, чтобы не закосневали мы долее во грехах своих. Ты, Многомилостивый к душам нашим, вложи в нас памятование доброго, потому что много возлюбили мы зла. Отврати от нас, о Благой, всё вредное.
        cn: 求你垂顾我们，使我们不再长久地僵化在自己的罪中。你，对我们的灵魂广施慈悲者，请将对美善的记念植入我们里面，因为我们深深地爱上了邪恶。哦，美善者，求你将一切有害的从我们身上挪去。
    - type: paragraph
      text:
        ru: Приими доброе изволение, сколько есть его в нас, и пошли нам соразмерную силу. Душа наша не в состоянии принести тебе столь же великий дар, сколь велик Ты. Да умилостивит Тебя, Господи, чудная смерть Твоя.
        cn: 接受我们里面所有美善的意愿，并赐予我们相应的力量。我们的灵魂无法献上给你一份与你伟大程度相称的礼物。愿你奇妙的死亡，主啊，使你施恩。
    - type: paragraph
      text:
        ru: Неправда наша гораздо сильнее молитв наших. Моление наше незначительно, а вина наша велика. Какую жертву могли бы мы принести для примирения своего с Тобою? Нечего нам дать Тебе. Посему Кровию Твоею примири нас, Всемилостивый.
        cn: 我们的过犯远胜过我们的祷告。我们的祈求微不足道，而我们的罪孽深重。我们能献上什么祭物，才能与你和好呢？我们没有什么可以献给你的。因此，借着你的宝血使我们和好，至仁慈者啊。
    - type: paragraph
      text:
        ru: Благодарение Отцу, пославшему Тебя, Спаситель наш! Ибо Тобою оправдываемся мы, виновные. Ты отъял грехи наши Крестом Своим, отыми от нас вины наши и в Пришествие Твое!
        cn: '感恩圣父，祂派遣了祢，我们的救主！

          因我们这些有罪之人，借着祢得以称义。

          祢借着祢的十字架除去了我们的罪，

          求祢在祢的再临中也除去我们的罪愆！'
  - type: heading2
    text:
      ru: Искупитель всех, спаси и меня и даруй слезы размыть стену, отгораживающую меня от Тебя!
      cn: 普世的救赎主啊，也拯救我，并赐予我眼泪，以冲刷掉将我与你隔开的墙垣！
    children:
    - type: paragraph
      text:
        ru: Хвала Благому, Который снизшел ради нас, стал подобен нам и уврачевал язвы наши Своей всеосвящающей Плотью и Своей всеосвящающей Кровью! Да воспевает хвалу Тебе всё!
        cn: 赞美至善者，祂为我们屈尊降临，成为我们的样式，并医治了我们的创伤，借着祂全然圣化的肉身和祂全然圣化的宝血！愿万物都歌颂赞美祢！
    - type: paragraph
      text:
        ru: Благодарение Милосердому, Который постоянно несет бремя наше, хотя известна Ему злоба наша, Который сотворил, питает нас и велит воссиявать для нас солнцу Своему! Хвала Его благости!
        cn: 感恩仁慈者，祂不断地背负我们的重担，尽管祂知道我们的邪恶，祂创造了我们，喂养我们，并命令祂的太阳为我们照耀！赞美祂的良善！
    - type: paragraph
      text:
        ru: Отверзи мне дверь милосердия, исполненный щедрот Господи наш, простри мне руку Твою, Благой и Милостивый, и возврати меня в овчий Твой двор, да прославлю благость Твою.
        cn: 求祢为我敞开怜悯之门，我们满有丰盛恩赐的主啊，向我伸出祢的手，良善又慈悲的祢啊，并把我领回祢的羊圈，好使我能颂扬祢的良善。
    - type: paragraph
      text:
        ru: Грехи мои – это стена между мною и Твоей благостью. Разори ее, чтобы мог я приступить к милосердию Твоему, излей на меня любовь Твою и восторгни меня до высоты Твоей!
        cn: 我的罪孽是我与祢的良善之间的墙垣。拆毁它，使我得以亲近祢的怜悯，将祢的爱倾泻在我身上，并将我高举到祢的崇高之处！
    - type: paragraph
      text:
        ru: Но стена грехов моих разоряется слезами и сокрушением, посему даруй мне все дни жизни своей прилежно оплакивать грехи свои и собирать для себя плоды, которые полезны мне будут в день Суда.
        cn: 但 我罪的围墙 借着眼泪和痛悔 而被拆毁，因此，求你恩赐我，在我一生的年日里，殷勤地为我的罪哀哭，并为自己积攒那些在审判的日子将对我大有益处的果实。
- type: heading1
  text:
    ru: Отделение третье
    cn: 第三部分
  children:
  - type: heading2
    text:
      ru: Богочеловечество
      cn: 神人
    children:
    - type: paragraph
      text:
        ru: Отец воззвал:Сей есть Сын Мой Возлюбленный, в Котором Мое благоволение, Его слушайте(Мф. 17:5), – воззвал о Сыне, неотлучном от славы Божества. Ибо Отец и Сын со Святым Духом – едино естество, одна сила, одна сущность и одно царство.
        cn: 父宣召说：这是我的爱子，我所喜悦的，你们要听祂！（马太福音 17:5）——祂宣召的是那位与神性荣耀不可分离的圣子。因为父、子和圣灵是同一性体、同一能力、同一本体、同一个国度。
    - type: paragraph
      text:
        ru: И Мария Богоматерь называла Его Сыном по человеческому телу, не отлученному от славы Его Божества. Ибо один есть Бог, явившийся в мир в теле.
        cn: 圣母马利亚称祂为子，是按着祂属人的身体，这身体未曾与祂神性的荣耀分离。因为只有一位上帝以肉身显现于世。
    - type: paragraph
      text:
        ru: Слава Его возвещала о Божеском естестве, которое от Отца, а тело Его возвещало о человеческом естестве, которое от Марии; оба же естества сошлись и соединились в единой ипостаси.
        cn: 祂的荣耀彰显了源于父的神性，而祂的身体彰显了源于马利亚的人性；这两个本性聚合并结合在一个位格里。
    - type: paragraph
      text:
        ru: Единородный от Отца, Тот же единороден и от Марии. И кто разделяет в Нем ипостаси, тот отделен будет от Царства Его, и кто сливает естества, тот лишен будет жизни Его.
        cn: 父所独生者，祂同样独生于玛利亚。凡在祂内分割位格者，将与祂的国度隔绝；凡融合性体者，将与祂的生命无份。
    - type: paragraph
      text:
        ru: Кто отрицает, что Мария родила Бога, тот не увидит славы Божества Его, и кто отрицает, что носил Он безгрешную плоть, тот не получит спасения и жизни, даруемой чрез тело Его.
        cn: 凡否认玛利亚诞下上帝者，就不会看见祂神性的荣耀；凡否认祂身负无罪之肉身者，就不会获得借由祂身体所赐予的救赎与生命。
    - type: paragraph
      text:
        ru: Самые дела свидетельствуют и Божеские силы Его научают рассудительных, что Он – Истинный Бог. А страдания Его показывают, что Он – истинный Человек.
        cn: 祂的作为本身就见证，和祂的神性能力教导明辨之人，祂是真神。而祂的苦难则显明，祂是真真正正的人。
  - type: heading2
    text:
      ru: Ниспосли благодать, да оживотворит меня, как весной все оживляется дыханием жизни!
      cn: 愿你降下恩典，使我得生，如同春天万物借着生命的气息而复苏！
    children:
    - type: paragraph
      text:
        ru: Благой Человеколюбец! Если на траву, на цветы, на всякую зелень земную обильно изливается благодать Твоя во время свое, то кольми паче подашь Ты просимое рабу Твоему, умоляющему Тебя!
        cn: 仁慈的爱人者啊！如果你的恩典在适当时候丰沛地倾泻在草地、鲜花和地上一切青草翠绿之上，那么，你岂不更会赐予恳求你的仆人所求的吗！
    - type: paragraph
      text:
        ru: Ибо вот проясняется воздух и птицы разнообразят голоса свои, воспевая славу великой премудрости Твоей. Вот вся земля облекается в ризу испещренных цветов, сотканную без рук человеческих, веселится и празднует праздник.
        cn: 因为看哪，空气澄明，众鸟发出多样的鸣唱，歌颂着祢伟大智慧的荣耀。看哪，全地披上了由斑斓花朵织成的华服，非人手所织，欢欣地庆祝着这节日。
    - type: paragraph
      text:
        ru: Воскропи и на мое сердце росой благодати Твоей, Благой Человеколюбец! Как засеянная земля без ниспадения довольного[2]дождя не может дать и воспитать произращений своих, так и сердце мое без благодати Твоей не в силах изнести благоугодное Тебе и принести плод правды.
        cn: 仁爱良善者啊，求您也用您恩典的甘露洒在我的心上！正如已播种的土地若没有充足[2]的雨水降下，便不能生长并滋养其所生的幼苗；照样，我的心若没有您的恩典，也无力生出蒙您喜悦的成果，并结出公义的果实。
    - type: paragraph
      text:
        ru: Се дождь питает растения, и дерева увенчиваются разнообразными цветами – и роса благодати Твоей да просветит ум мой и сердце мое да украсит цветами умиления, смирения, любви и терпения.
        cn: 正如雨水滋养植物，树木戴上各式花朵的冠冕——愿你的恩典甘露光照我的心智，并以悔罪、谦卑、爱与忍耐的花朵装饰我的心。
    - type: paragraph
      text:
        ru: 'Да приближится моление мое пред Тя, Господи! Даруй мне святого семени Твоего, чтоб мог я принести Тебе рукояти, полные плодов благих, и сказать: «Слава Давшему, что принести Ему» – и поклониться Отцу и Сыну и Святому Духу.'
        cn: 愿我的祈祷临近你面前，主啊！赐予我你神圣的种子，好使我能献给你满载美善果实的禾捆，并说：「荣耀归于那赐予者，因所献之物皆源于祂」——并俯伏敬拜圣父、圣子、圣灵。
  - type: heading2
    text:
      ru: О руководящей благодати и слезах
      cn: 论引导的恩典与泪水
    children:
    - type: paragraph
      text:
        ru: Благой Человеколюбец, принявший две лепты и похваливший произволение вдовицы, приими моление раба Твоего, умножь молитву мою и даруй просимое мною, да соделаюсь храмом благодати Твоей, да вселится она во мне и сама да научит меня, как благоугождать ей; сама, ударяя в гусли мои, да взыграет песни умиления, исполненные веселия; сама да свяжет ум мой как бы уздой, чтобы мне не погрешить пред Тобой, заблудившись, и не быть изринутым из оного света.
        cn: 仁慈爱世者啊，你曾接受那两文小钱，并称赞寡妇的乐意奉献；求你接受你仆人的祈求，加增我的祷告，并赐予我所祈求的，使我成为你恩典的殿堂。愿恩典住在我里面，亲自教导我如何取悦于她；愿她亲自拨动我的诗琴，奏出充满喜乐的柔情之歌；愿她亲自以缰绳束缚我的心智，以免我在你面前因迷失而犯错，不至于被逐出那光明的境地。
    - type: paragraph
      text:
        ru: Услышь, Господи, услышь моление мое и даруй, чтоб я, нечистый, сделался чистым, я, безумный, умудрился, я, непотребный, стал благопотребен в стаде избранных Твоих подвижников и всех святых, благоугодивших Тебе, и был принят в Царство Твое.
        cn: 垂听，主啊，垂听我的祈求，并求祢赐予：使我这不洁的，得以洁净；我这愚妄的，得以有智慧；我这无用的，在祢所拣选的禁欲修道者群中，以及所有蒙祢喜悦的圣徒中，成为合宜可用的，并蒙接纳进入祢的国度。
    - type: paragraph
      text:
        ru: Веселящиеся в раю сами ходатайствуют за меня и взывают к Тебе, Единому Человеколюбцу. И Ты вонми молению их. А я чрез них воздам Тебе славу за то, что услышал Ты молитвы их и ущедрил меня и не презрел моления моего.
        cn: 在乐园中欢欣的众圣徒亲自为我代求，并呼求祢，独一的爱人者。祢就垂听他们的恳求。我将借由他们归荣耀于祢，因祢垂听了他们的祷告，并恩待了我，也没有轻看我的恳求。
    - type: paragraph
      text:
        ru: Ты, Господи, сказал чрез пророка Твоего:Открой уста твои, и Я наполню их(Пс. 80:11). Вот отверсты и сердце, и уста раба Твоего; исполни их благодатью Твоей, чтоб непрестанно благословлять мне Тебя, Христе Боже, Спасителю мой.
        cn: 您，主啊，藉着您的先知说：『敞开你的口，我必使其充满』（诗篇 80:11）。看哪，您仆人的心和口都已敞开；求您以您的恩典充满它们，好使我能不停地称颂您，基督上帝，我的救主。
    - type: paragraph
      text:
        ru: Молитва моя немощна, а беззакония мои велики и сильны. Грехи подавляют меня, и немощи мои смущают меня; Ты же богат и благ, милосерд и щедр.
        cn: 我的祷告软弱无力，而我的罪孽深重且强大。罪恶压制着我，我的软弱搅扰着我；祢却是丰盛良善，怜悯慷慨。
    - type: paragraph
      text:
        ru: Ты, отверзший очи слепому, отверзи очи ума моего, да непрестанно созерцаю красоту Твою.
        cn: 祢，那曾开启瞎子眼目的，求祢也开启我心智的眼睛，使我能不住地默观祢的荣美。
    - type: paragraph
      text:
        ru: Ты, положивший предел морю словом повеления Твоего, положи предел и сердцу моему благодатью Твоею, чтобы не совращалось оно ни направо, ни налево от красоты Твоей.
        cn: 您，凭您命令的话语为大海划定了界限，也凭您的恩典，为我的心划定界限，使它无论向左向右，都不偏离您的荣美。
    - type: paragraph
      text:
        ru: Ты, давший воду в пустыне народу непокоривому и пререкающему, дай мне сокрушение и глазам моим слезы, чтобы плакать мне день и ночь во все продолжение жизни моей со смиренномудрием, с любовью и с чистым сердцем.
        cn: 你，曾在旷野中赐水予那顽梗顶撞的百姓，赐给我痛悔，并赐我眼目泪水，使我一生之久，日夜哭泣，带着谦卑、爱和一颗纯洁的心。
    - type: paragraph
      text:
        ru: Услышь, Господи, молитву раба Твоего по ходатайству всех святых Твоих, Сый над всеми благословен во веки.
        cn: 主啊，垂听祢仆人的祷告，藉着祢众圣徒的代祷。祢是那超乎万有之上，永远受颂赞的。
  - type: heading2
    text:
      ru: Несмотря на грехи, услышь, отжени врага и укрепи на добро!
      cn: 尽管有罪，垂听，驱逐仇敌，并坚固我行善！
    children:
    - type: paragraph
      text:
        ru: Боже Праведный и хвалимый, Боже Предвечный! Услыши человека грешника в час сей!
        cn: 公义可赞美的上帝啊，亘古永恒的上帝啊！在此时刻垂听我这罪人！
    - type: paragraph
      text:
        ru: Послушай меня, Боже, послушай в крепости Твоей, не памятуя всегдашних преслушаний моего ничтожества.
        cn: 求你垂听我，上帝啊，求你在你的坚固中垂听我，不记念我这卑微者的恒常悖逆。
    - type: paragraph
      text:
        ru: Послушай меня, Господи, послушай меня огнем молитвенным, как некогда пророка Твоего.
        cn: 主啊，求你垂听我，以祈祷的火焰垂听我，正如你昔日垂听你的先知一般。
    - type: paragraph
      text:
        ru: Ей, Боже святых Сил! Ей, Творче бесплотных! Ей, Изрекший:Просите, и получите(Ин. 16:24), не возгнушайся мною, нечистым, осквернившим уста свои и покрытым грехами!
        cn: 祢，圣善众力之上帝！祢，无形体众者之创造主！祢，曾说：「祈求，就必得到」（约翰福音 16:24）者啊！不要厌弃我这不洁净的、玷污了自己口舌、并满身罪孽之人！
    - type: paragraph
      text:
        ru: Послушай меня, Давший обетование послушать призывающих Тебя в правде, и направь стопы раба Твоего на путь мирен.
        cn: 垂听我，那赐下应许要垂听在真理中呼求祢的人啊，并引导祢仆人的脚步走上平安的道路。
    - type: paragraph
      text:
        ru: 'К тебе, Боже, взываю всем сердцем моим: Боже, Боже, услыши мя, упование всех концев земли и странствующих далече! Запрети всем нечистым духам, да бегут от лица раба Твоего.'
        cn: 祢啊，上主，我倾我全心向祢呼求！上主啊，上主啊，求祢垂听我，祢是地极和远方客旅的盼望！求祢斥责所有不洁之灵，使它们遁逃，远离祢仆人的面。
    - type: paragraph
      text:
        ru: 'Приими оружие и щит и восстани в помощь мою. Изсуни меч и заключи сопротив гонящих мя. Рцы, Господи, рцы душе моей: «Спасение твое есмь Аз».'
        cn: '拿起兵器和盾牌，兴起帮助我。

          拔出刀剑，抵挡追赶我的人。

          主啊，对我的灵魂说：「我就是你的救恩。」'
    - type: paragraph
      text:
        ru: Да отступит от души моей дух боязни, дух уныния, дух гордыни и всякой злобы, да угаснет в ней всякое разжжение, производимое действием диавольским, да просветится дух мой, душа и тело светом ведения Твоего, да, пришедши в мужа совершенна, в меру возраста, в век века, с Ангелами и со всеми благоугодившими Тебе прославлю всечестное и поклоняемое имя Твое – Отца и Сына и Святого Духа.
        cn: 愿恐惧之灵、沮丧之灵、骄傲之灵和一切邪恶都从我灵魂退去，愿其中一切由魔鬼作为所产生的炽热情欲都熄灭，愿我的灵、魂和身体都被祢知识的光所照亮，愿我达到完全人的境地，达到身量的程度，永永远远，与众天使和所有蒙祢喜悦的人一同颂扬祢那至尊和可敬拜的名——父、子、圣灵。
  - type: heading2
    text:
      ru: Об успокоении совести от внутреннего смятения
      cn: 论良心脱离内心纷扰而得安宁
    children:
    - type: paragraph
      text:
        ru: Владыко Господи! Боже Небесе и земли! Благоволи отверзть мне дверь покаяния, умоляю Тебя болезненной душой!
        cn: '圣主、上主啊！天地之主！

          我以痛苦的心灵恳求祢，求祢开恩为我敞开悔改之门！'
    - type: paragraph
      text:
        ru: Призри на меня по великому благоутробию Твоему, приклони ухо Твое к молению моему и прости меня, виновного во многих грехопадениях, прости мне все, что соделал я худого, побеждаемый злым произволением своим.
        cn: 垂顾我，按你莫大的慈悲，侧耳垂听我的恳求，并赦免我这犯了诸多过犯之人，赦免我一切因被己之恶性意愿所胜而行的恶事。
    - type: paragraph
      text:
        ru: Ищу покоя и не нахожу, потому что совесть моя осквернена, и нет во мне мира по множеству беззаконий моих.
        cn: 我寻求平安却寻不见，因为我的良心已被玷污，并且因我罪孽众多，我心中也没有平安。
    - type: paragraph
      text:
        ru: Услыши, Господи, сердце, вопиющее Тебе с болезнью! Не на дела мои, но на болезнь души моей вонми и поспеши уврачевать меня, жестоко уязвленного; дай мне скоро прийти в себя по благодати человеколюбия Твоего.
        cn: 主啊，求你垂听这颗带着病痛向你哀求的心！不要看我的行为，却要留意我灵魂的病痛，并速速医治这深受重创的我；求你凭着你慈爱的恩典，使我迅速恢复过来。
    - type: paragraph
      text:
        ru: Сними с меня бремя грехов моих и не воздай мне, чего заслуживает содеянное мною, чтоб не погиб я вконец и не лишился всякого попечения и помышления об исправлении своем.
        cn: 求你除去我罪孽的重担，并且不要照我所行的报应我，免得我全然灭亡，也不至于丧失一切关切和思虑，以求自我改正。
    - type: paragraph
      text:
        ru: Припадаю к щедротам Твоим, помилуй меня, осуждением дел своих поверженного в прах.
        cn: 我俯伏在祢丰盛的怜悯前，求祢怜悯我这因自己行为的定罪而仆倒于尘埃之人。
    - type: paragraph
      text:
        ru: Воззови, Владыко, меня, пленника, которого держат и как бы цепями связывают дела, ибо Ты один знаешь, как разрешать связанных и исцелять невидимые язвы, известные Тебе единому, ведающему тайное.
        cn: '呼唤我，主啊，我这囚徒，

          我被行为束缚，仿佛被锁链捆绑，

          因为唯独祢知道如何释放被捆绑的，并医治那看不见的创伤，

          那唯独祢所知，祢这深知隐秘者。'
    - type: paragraph
      text:
        ru: Благоволи простереть ко мне руку и извлечь меня из тины беззаконий моих – Ты, не увеселяющийся погибелью человеческой и не отвращающий лица Своего от взывающих к Тебе со слезами.
        cn: 愿你施恩向我伸出你的手，将我从我罪孽的泥淖中拔出——你，不以人的灭亡为乐，也不向那些含泪呼求你的人掩面。
    - type: paragraph
      text:
        ru: Услыши, Господи, глас раба Твоего, вопиющего к Тебе, яви лицо Твое мне, омраченному, просвети меня пришествием Святого Твоего Духа!
        cn: 主啊，求祢垂听祢仆人向祢的呼求，向我这幽暗之人显现祢的圣容，并藉着祢圣灵的降临来光照我！
    - type: paragraph
      text:
        ru: Даруй, Господи, усердие мне, оскверненному, и труд мой обрати в радость мне.
        cn: 主啊，求祢赐予被玷污的我以殷勤，并使我的劳苦转变为我的喜乐。
    - type: paragraph
      text:
        ru: Раздери мое вретище и препояшь меня веселием, и да отверзется мне дверь Царствия Твоего, да, вошедши в него, прославлю всесвятое имя Твое, Отца и Сына и Святого Духа.
        cn: 撕裂我的麻衣，并以喜乐束我腰，愿祢国度的门为我敞开，使我得以进入，颂扬祢至圣的名——圣父、圣子、圣灵的名。
  - type: heading2
    text:
      ru: О свободном проходе мытарств и помиловании на Суде
      cn: 关于自由通过空中关卡和在审判中蒙怜悯
    children:
    - type: paragraph
      text:
        ru: Величая величаю Тебя, Господи, что призрел Ты на смирение мое и не предал меня в руки врагов моих и спас от нужд душу мою.
        cn: 我极力颂扬你，主啊，因为你眷顾了我的卑微，没有把我交在我仇敌的手中，并且从苦难中拯救了我的灵魂。
    - type: paragraph
      text:
        ru: И ныне, Владыко, да покроет меня рука Твоя и да приидет на меня милость Твоя, ибо смущена душа моя и сильно скорбит, чтоб при исходе из бедного тела сего не встретила ее лукавая рука сопротивника и не удержала во тьме за грехи, соделанные мною в жизни сей, в ведении и неведении.
        cn: 主宰啊，愿你的手如今遮盖我，愿你的怜悯临到我；因为我的灵魂困惑不安，且极其悲伤，好叫在我这贫乏之躯离世时，不致被仇敌的邪恶之手阻拦，不致因我在今生所犯的罪，无论是在有知或无知之中，将它拘禁在黑暗中。
    - type: paragraph
      text:
        ru: Буди милостив ко мне, Владыко всяческих, да не увидит душа моя омраченного взора лукавых бесов, но да приимут ее чистые и светлые Ангелы Твои.
        cn: '愿你怜悯我，万有之主宰啊，

          愿我的灵魂不见邪恶魔鬼幽暗的目光，

          却愿你的纯洁而光明的众天使接纳它。'
    - type: paragraph
      text:
        ru: Дай славу имени Твоему святому и силою Твоею возведи меня к Божественному Твоему Престолу!
        cn: 赐荣耀予你的圣名，并以你的大能，提引我至你的神圣宝座！
    - type: paragraph
      text:
        ru: И когда буду судим, да не восхитит меня рука князя мира сего, чтоб увлечь меня грешного в глубину адскую. Но Ты предстань мне и будь моим Заступником.
        cn: 当我受审判时，愿这世界之君的手不掳去我，以致将我这罪人拖入地狱深渊。但愿你临在于我，并作我的护佑者。
    - type: paragraph
      text:
        ru: Помилуй, Господи, душу мою, осквернившуюся страстями жизни сей, и если в чем как человек по слабости естества прегрешил я словом, или делом, или мыслью, – Ты, имеющий власть отпускать грехи, прости и отпусти мне, да обрету прохладу и окажусь пред Тобой не имеющим нечистоты или скверны и неукоризненным, неочерненным, да приимет меня рука Твоя, Владыко, ибо Ты благословен во веки.
        cn: 主啊，垂怜我因今生诸情欲而沾染污秽的灵魂，并且，如果我作为一个人，因本性软弱，在言语、行为或意念上有所过犯， — 您是拥有赦罪权柄的，求您赦免并宽恕我，好使我得享安息，并在您面前显现为没有不洁或污秽、无可指摘、未受玷污的，愿您的手接纳我，至高主宰啊，因为您是永永远远受称颂的。
  - type: heading2
    text:
      ru: Иди с покаянием, Господь готов принять
      cn: 去吧，带着悔改，主已预备好接纳。
    children:
    - type: paragraph
      text:
        ru: Ты, Которому благоугодны кающиеся, благоволи и ко мне, грешнику. Насыти меня крупицами с великой трапезы Твоей, не попусти, чтобы жизнь моя погибла во тьме ошуюю[3], и правда Твоя да не воззрит на страшные нечистоты моего убожества в то великое утро, в которое изречен будет вечный приговор.
        cn: 你，那以悔改者为悦纳的，亦请恩待我这罪人。求你以从你盛大筵席上的碎屑饱足我，不要让我的生命在左边的黑暗中[3]灭亡，也不要让你的公义正视我这卑微之人的可怖不洁，在那将宣判永恒判决的伟大清晨。
    - type: paragraph
      text:
        ru: Радость мира сего горька, горе тому, кто обольщается ею! Как корабль волнами, обуревается жизнь моя бедствиями, суетная радость пленяет ее зрелищем удовольствий. Ты будь Кормчим моим и введи корабль мой в пристань Свою в то великое утро Твое, в которое изречен будет вечный приговор.
        cn: 世上的喜乐是苦涩的，祸哉那被它诱惑的人！我的生命如同船只被波浪冲击，饱受灾祸的冲击，虚妄的喜乐以逸乐的景致迷惑着它。愿祢作我的舵手，将我的船引至祢的港湾，在祢那伟大的清晨，那时，永恒的判决将被宣判。
    - type: paragraph
      text:
        ru: 'Бог любит грешника, когда приступает он к покаянию и с полными слез очами, воздыхая и рыдая, взывает к Нему: «Господи наш, избавь меня от огня! Молю Тебя, приими слезы моего убожества. Добровольно грешил я пред Тобою, но добровольно и каюсь».'
        cn: 上帝爱罪人，当他开始悔改，且泪水盈眶，叹息、恸哭着向祂呼求：「我们的主，求你救我脱离那火！我恳求你，接纳我这卑微之人的泪水。我曾甘心在你面前犯罪，如今也甘心悔改。」
    - type: paragraph
      text:
        ru: 'Итак, смело приступи, грешник: дверь уже отверзта и готова принять тебя. Принеси Господу в жертву слезы и свободно иди к Нему. Не требует Он даров, и на лица зрения нет у Него. Милосерд Он к человекам и охотно прощает грехи грешникам кающимся.'
        cn: 那么，罪人啊，大胆地前来吧：门已经敞开，准备好接纳你。将泪水献给主为祭，并自由地到祂那里去。祂不要求礼物，也不看人的外貌。祂怜悯世人，并乐意赦免悔改之罪人的罪。
  - type: heading2
    text:
      ru: Уроки жизни. Блаженства
      cn: 生命的教训。真福八端
    children:
    - type: paragraph
      text:
        ru: Блажен человек, который имеет в себе страх Божий, как ублажает его Дух Святой, говоря:Блажен муж боящийся Господа(Пс. 111:1).
        cn: 人是有福的，他心中怀有敬畏上帝之心，正如圣灵称颂他，说：『敬畏上主的人是有福的。』 (诗篇 111:1)
    - type: paragraph
      text:
        ru: Блажен человек, в котором есть любовь Божия, ибо он носит в себе Бога.Бог есть любовь, и пребывающий в любви пребывает в Боге(1Ин. 4:16).
        cn: 那心中有上帝的爱的人是有福的，因为他里面怀着上帝。上帝就是爱，住在爱里的，就住在上帝里面（约翰一书 4:16）。
    - type: paragraph
      text:
        ru: Блажен стяжавший долготерпение, ибоу терпеливого человека много разума(Притч. 14:29).
        cn: 有福了，那培养了恒忍的人，因为有忍耐的人多有悟性（箴言 14:29）。
    - type: paragraph
      text:
        ru: Блажен чуждый гнева и раздражительности:Гнев человека не творит правды Божией(Иак. 1:20).
        cn: 蒙福的是那远离愤怒和烦躁的人：人的怒气并不成就上帝的公义（雅各书 1:20）。
    - type: paragraph
      text:
        ru: Блажен возлюбивший кротость, по слову Господа:Блаженны кроткие(Мф. 5:5).
        cn: 那爱慕温柔的人蒙福，正如主所说：温柔的人有福了（马太福音 5:5）。
    - type: paragraph
      text:
        ru: Блажен, кто стяжал истинное послушание, ибо такой стал подражателем Господа Спасителя, Который послушлив был даже до смерти.
        cn: 有福的，是那获得了真正顺服的人，因为这样的人成了主救主的效法者，祂顺服以至于死。
    - type: paragraph
      text:
        ru: Блажен, кто чужд зависти и соперничества, ибозавистью... вошла в мир смерть(Прем. 2:24).
        cn: 有福的，是那远离嫉妒与争竞的人，因为嫉妒……死亡就进入了世界（智慧篇 2:24）。
    - type: paragraph
      text:
        ru: Блажен, кто не сквернит языка своего злословием, ибо сердце злословливого полно всяких скверн.
        cn: 蒙福的人，不以恶语玷污其舌，因为好说恶语者的心充满各样污秽。
    - type: paragraph
      text:
        ru: Блажен, кто стяжал воздержание, потому что оно есть опора всех добродетелей.
        cn: 蒙福的，是那修得节制的人，因为它是所有美德的支柱。
    - type: paragraph
      text:
        ru: Блажен благодетельствующий бедным, ибо он на Суде встретит себе многих защитников.
        cn: 有福了，那施恩惠于穷人的人，因为他将在审判日遇到许多为他辩护的人。
    - type: paragraph
      text:
        ru: 'Блажен, кто при высокой жизни имеет смиренный образ мыслей: он подражает Христу и с Ним будет восседать во славе.'
        cn: 有福了，凡是拥有崇高生命却存谦卑心思的人：他效法基督，并要与祂一同坐在荣耀里。
    - type: paragraph
      text:
        ru: Блажен, кто принуждает себя ко всякому делу благому, ибоупотребляющие усилие восхищаютЦарствие Небесное (Мф. 11:12).
        cn: 蒙福的，是那勉力自己行一切美善之事的人，因为那努力的人夺取天国（马太福音 11:12）。
    - type: paragraph
      text:
        ru: Блажен, кто ходит путем узким, ибо он войдет в небо венценосцем.
        cn: 有福的，凡行走窄路者，因为他必作戴冠冕者进入天堂。
    - type: paragraph
      text:
        ru: Блаженны все сии, ибо они с дерзновением предстанут тогда Судии и из рук Его приимут святую награду.
        cn: 所有这些人是有福的，因为他们那时将坦然无惧地觐见审判者，并从祂手中领受圣洁的奖赏。
- type: heading1
  text:
    ru: Отделение четвертое
    cn: 第四部分
  children:
  - type: heading2
    text:
      ru: Богочеловечество Спасителя
      cn: 救主的神人道性
    children:
    - type: paragraph
      text:
        ru: Одного и Того же исповедуем совершенным Богом и совершенным Человеком. Он есть Бог – Слово, Которое бысть плоть.
        cn: 我们宣认同一位是完全的上帝，又是完全的人。祂是上帝—道，成了肉身。
    - type: paragraph
      text:
        ru: Ибо если Он не был плотью, то для чего выведена на среду Мария? И если не Бог Он, то кого Гавриил именует Господом (см.:Лк. 1:28)?
        cn: 因为如果他没有成为肉身，那么玛利亚被带到世上是为了什么？而如果他不是神，那么加百列称呼谁为主呢？(参：路加福音 1:28)
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто возлежал в яслях? И если не Бог Он, кого славили Ангелы, сшедшие с неба?
        cn: 他若非肉身，谁躺在马槽里呢？他若非上帝，从天降下的天使所荣耀的又是谁呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто обвит был пеленами? И если не Бог Он, в честь кого шла звезда?
        cn: 如果他不是肉身，谁被襁褓包裹？那么如果他不是神，星辰又为谁而行呢？
    - type: paragraph
      text:
        ru: 'Если не был Он плотью, кого носил в объятиях Симеон? И если не Бог Он, кому говорил: «Ныне отпущаеши раба Твоего, Владыко»?'
        cn: 如果他不是肉身，西缅怀抱的是谁？如果他不是上帝，他对谁说：『如今你释放你的仆人，主啊？』
    - type: paragraph
      text:
        ru: Если не был Он плотью, кого взяв, Иосиф бежал во Египет? И если не Бог Он, на ком исполнилось сказанное:Из Египта вызвал Сына Моего(Ос. 11:1)?
        cn: 如果他不是肉身，约瑟带着谁逃往埃及呢？如果他不是神，那应验了以下所说的话是在谁身上呢：我从埃及召出我的儿子（何西阿书 11:1）？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кого крестил Иоанн? И если не Бог Он, Кому Отец говорил:Сей есть Сын Мой возлюбленный, в Котором Мое благоволение(Мф. 3:17)?
        cn: 如果他不是肉身，约翰施洗的是谁呢？如果他不是神，父对谁说呢：『这是我的爱子，我所喜悦的（马太福音 3:17）』？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто взалкал в пустыне? И если не Бог Он, кому, пришедши, стали служить Ангелы?
        cn: 如果他不是肉身，谁会在旷野中饥饿呢？如果他不是上帝，天使们前来服侍的又是谁呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто зван был на брак в Кане Галилейской? И если не Бог Он, кто превратил воду в вино?
        cn: 如果祂不是肉身，那么在加利利的迦拿婚筵上被邀请的是谁呢？如果祂不是上帝，那么把水变成酒的又是谁呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто брал в руки хлебы в пустыне? И если не Бог Он, кто пятью хлебами и двумя рыбами напитал пять тысяч мужей, кроме жен и детей?
        cn: 如果祂不是肉身，谁能在旷野里拿起饼来呢？如果祂不是上帝，谁又能用五个饼和两条鱼喂饱五千男丁，不计妇女和孩童呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто спал в корабле? И если не Бог Он, кто запретил волнам и морю?
        cn: 如果祂没有肉身，谁在船上睡觉呢？如果祂不是上帝，谁又斥责了风浪和大海呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, с кем вкушал Симон фарисей? И если не Бог Он, кто отпустил грехи грешнице?
        cn: 如果他没有肉身，西门法利赛人与谁一同用餐？如果他不是上帝，谁赦免了那女罪人的罪？
    - type: paragraph
      text:
        ru: Если не был Он плотью, то кто носил человеческие одежды? И если не Бог Он, то кто исцелил кровоточивую прикосновением к одежде?
        cn: 如果他不是肉身，那么是谁穿上了人的衣服？如果他不是神，那么是谁通过触摸衣裳医治了那患血漏的妇人？
    - type: paragraph
      text:
        ru: Если не был Он плотью, то кто плюнул на землю и сотворил брение? И если не Бог Он, кто брением дал прозрение очам?
        cn: 如果他不是肉身，那么是谁吐唾沫在地上并造了泥呢？如果他不是上帝，那么是谁用泥土使眼睛重见光明呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто плакал при гробе Лазаря? И если не Бог Он, кто повелел выйти из гроба четверодневному умершему?
        cn: 如果他不是肉身，谁会在拉撒路的坟墓旁哭了呢？如果他不是上帝，谁又能吩咐那个死了四天的人从坟墓里出来呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кого взяли иудеи в саду? И если не Бог Он, кто словом:Это Я(Ин. 18:5) поверг их на землю?
        cn: 如果他不是肉身，犹太人在园子里抓的是谁？如果他不是上帝，又是谁用「我就是」（约翰福音 18:5）这句话把他们击倒在地？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто предстал на суд Пилату? И если не Бог Он, кто во сне устрашил жену Пилатову?
        cn: 如果他不是肉身，谁在彼拉多面前受审？如果他不是上帝，谁在梦中惊吓了彼拉多的妻子？
    - type: paragraph
      text:
        ru: Если не был Он плотью, с кого совлеченные одежды делили воины? И если не Бог Он, почему с распятием Его затмилось солнце?
        cn: 如果他不是肉身，士兵们又从谁身上剥下衣服并分了呢？而如果他不是神，为什么他被钉十字架时，太阳会变暗呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто распят был на Кресте? И если не Бог Он, кто поколебал землю в основаниях?
        cn: 如果祂不是血肉之躯，谁被钉死在十字架上呢？而如果祂不是上帝，谁使大地根基动摇呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, у кого руки и ноги пригвождены были ко Кресту? И если не Бог Он, отчего разодралась завеса церковная, расселись камни, отверзлись гробы?
        cn: 如果他不是肉身，谁的手和脚被钉在十字架上呢？如果他不是神，殿里的幔子为何撕裂，磐石崩裂，坟墓敞开呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто висел на Кресте среди разбойников? И если не Бог Он, кто сказал разбойнику:Ныне же будешь со Мною в раю(Лк. 23:43)?
        cn: 如果他不是肉身，那么谁与强盗们一同被挂在十字架上呢？如果他不是上帝，那么谁对那个强盗说：「今日你将与我同在乐园里」（路加福音 23:43）？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто, возопив, испустил дух? И если не Бог Он, от чьего гласамногие тела усопших святых воскресли(Мф. 27:52)?
        cn: 如果他不是肉身，谁会呼喊一声，便断气了呢？如果他不是神，又是从谁的声音，许多已故圣徒的身体复活了呢？(马太福音 27:52)
    - type: paragraph
      text:
        ru: 'Если не был Он плотью, кого жены видели полагаемым во гроб? И если не Бог Он, о ком сказали им Ангелы:Его нет здесь: Он воскрес(Мф. 28:6)?'
        cn: 如果他不是肉身，妇女们看见谁被安放在坟墓里呢？而如果他不是上帝，天使们又是说了谁，「他不在这里，他已经复活了」（马太福音 28:6）呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, у кого Фома осязал язвы гвоздиные? И если не Бог Он, кто взошел,когда двери были заперты(Ин. 20:26)?
        cn: 如果他不是肉身，多马触碰了谁的钉痕伤口？那么如果他不是上帝，当门都关了的时候，是谁进来了（约翰福音 20:26）？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кто вкушал на море Тивериадском? И если не Бог Он, по чьему повелению наполнились мрежи?
        cn: 如果他不是肉身，谁在提比利亚海吃过东西呢？如果他不是上帝，渔网又是奉谁的命令满的呢？
    - type: paragraph
      text:
        ru: Если не был Он плотью, кого апостолы видели вземлемым на небо? И если не Бог Он, ктовосшел... при восклицаниях(Пс. 4:6) святых Ангелов и к кому вещал Отец:СедиодеснуюМеня(Пс. 109:1)?
        cn: 如果他不是肉身，使徒们看见谁被接到天上？如果他不是神，谁升天了……伴随着圣天使的欢呼（诗篇 4:6），父亲对谁说：「你坐在我的右边」（诗篇 109:1）？
    - type: paragraph
      text:
        ru: Если Он – не Бог и Человек, то ложно, наконец, спасение наше, ложны и вещания пророков.
        cn: 如果他不是神人，那么我们最终的救赎就是虚假的，先知们的宣告也是虚假的。
  - type: heading2
    text:
      ru: О даровании слез и отгнании врага
      cn: 论赐下泪水与驱逐仇敌
    children:
    - type: paragraph
      text:
        ru: Господи Иисусе Христе, Сыне Божий, Спасителю наш! Даруй мне, рабу Твоему, сокрушение и просвещение сердца, чтобы, просветившись сердцем, со сладостью источать мне слезы в чистой молитве и Ты немногими моими слезами изгладил рукописание грехов моих и ради малого плача угасил во мне разгоревшийся огонь. Ибо если дашь мне, Владыко, плакать здесь, то освободишь меня там от огня неугасимого.
        cn: '主耶稣基督，上帝之子，我们的救主啊！

          恳求你赐予我，你的仆人，心灵的痛悔和光照，

          以便我的心被光照后，能在纯洁的祷告中甘甜地流出泪水，

          而你凭我这微薄的泪水，涂抹我罪愆的记录，

          并因着我微小的哭泣，熄灭在我里面燃起的火焰。

          因为如果你，我的主宰者，在此地赐我哭泣，

          那么你将在彼处使我脱离不灭的火。'
    - type: paragraph
      text:
        ru: Хотя знаю я, долготерпеливый и человеколюбивый Господи, что каждый день и час безмерно преогорчеваю и прогневляю Тебя, но благость долготерпения Твоего препобедит мою злобу и горечь.
        cn: 尽管我知道，恒久忍耐又慈爱世人的主啊，我每日每时无限地使你忧伤，并触怒你，但你恒久忍耐的美善，必将胜过我的恶意和苦毒。
    - type: paragraph
      text:
        ru: Ей, благолюбивый Господи, Бог милости и щедрот! Спаси меня от скверного и страшного врага, который ежечасно оцепляет и угнетает душу мою злыми и скверными помыслами.
        cn: 啊，慈爱的主，满有怜悯与丰盛的上帝！救我脱离污秽而可怕的仇敌，它每时每刻以邪恶污秽的意念围困并压迫我的灵魂。
    - type: paragraph
      text:
        ru: Неизреченная сила Твоя, Христе, запретившая волнам морским, да запретит ему, да приведет его в бездействие и да отгонит далеко прочь от меня, раба Твоего.
        cn: 祢莫可言喻的力量，基督，那曾禁止了海浪，愿它禁止他，愿它使他归于无能，并愿它将他远远地驱逐，远离我——祢的仆人。
    - type: paragraph
      text:
        ru: Каждый день обновляет он против меня козни свои и спешит возобладать расслабленным умом и удалить меня от Тебя и от божественных заповедей Твоих.
        cn: 他每日更新针对我的诡计，并急于控制我那松懈的心智，使我远离你和你的神圣诫命。
    - type: paragraph
      text:
        ru: Но, Владыко, многомилостивый Господи, пошли вскоре силу Твою и от меня, непотребного раба Твоего, отжени сего великого змия со всеми лукавыми и срамными его помыслами, да буду чисто воспевать и славословить Тебя со Безначальным Твоим Отцем и Всесвятым, Благим и Животворящим Твоим Духом ныне и присно и во веки веков. Аминь.
        cn: 但是，主宰者，大有怜悯的上主啊，请您速速降下您的权能，并从我这不配的仆人身上，驱逐这大蛇连同它所有邪恶和可耻的意念，使我能纯洁地歌颂和赞美您，同您那无始的父以及您那全圣、至善、并赋予生命的圣灵，从今时直到永远，世世无尽。阿们。
  - type: heading2
    text:
      ru: Избавь от нерадения и лености!
      cn: 求你救我脱离懈怠和懒惰！
    children:
    - type: paragraph
      text:
        ru: 'Безгрешный Агнец Божий, по свободному изволению Своему Крест претерпевший во плоти, закланный за спасение нас грешных и нетленно плотью вкусивший смерть, чтобы спасти падшее естество наше, Премудрость и Сила Бога Отца, Сияние славы Его, непостижимый Иисусе, неисследованный Христе, единый Милосердый и Человеколюбивый, на меня грешного излей великую Твою милость и благодатью Твоей отжени от меня всякое нерадение, леность и нетерпение, чтобы во Второе Пришествие Твое не услышать и мне страшного обличения Твоего: «Что потерпел ты ради Меня?»'
        cn: 无罪的上帝羔羊，照祂自己的自由旨意，在肉身中忍受十字架的苦难，为我们罪人的得救而被宰杀，并以不朽坏的肉身尝了死亡，为要拯救我们堕落的本性，上帝父的智慧和能力，祂荣耀的光辉，不可测度的耶稣，不可究察的基督，唯一仁慈和爱人的（主），求祢将祢的洪恩倾注于我这罪人身上，并藉着祢的恩典，将我身上一切的疏忽、怠惰和不耐烦驱逐，好使在祢第二次降临时，我也不致听到祢那可畏的谴责：「你为我忍受了什么？」
    - type: paragraph
      text:
        ru: 'В оный страшный и ужасный день скажешь Ты, Господи, нам, грешным: «Все вы хорошо знаете, что потерпел Я ради вас. Я, Бог, ради вас плоть принял; Я, Невидимый, ради вас видимо обитал на земле, ради вас алкал, жаждал, утруждался, ради вас был гоним, побиваем камнями; Я, Невинный, ради вас был заушаем и оплевываем; Я, Безгрешный, ради вас потерпел позорную смерть, ради вас прободен в ребра копием, напоен оцтом, смешанным с желчью. Всё это потерпел Я ради вас, чтоб вас сделать святыми и небесными; Царство Небесное даровал вам, всех вас наименовал братьями, ниспослал вам Духа Святого. Что же вы претерпели ради Меня, человеки?»'
        cn: 在那可怖而又可怕的日子，主啊，您将对我们这些罪人说：「你们都清楚地知道我为你们所受的苦。我，上帝，为你们取了肉身；我，那不可见的，为你们可见地住在地上，为你们饥饿，口渴，劳苦，为你们受逼迫，被石头击打；我，那无罪的，为你们被掌掴和吐唾沫；我，那无瑕的，为你们忍受了羞辱的死亡，为你们肋旁被长矛刺穿，被灌以掺杂着胆汁的醋。所有这一切我为你们忍受，为要使你们成为圣洁并属乎天上的；将天国赐予你们，将你们所有人都称为弟兄，赐下圣灵给你们。那么，世人啊，你们为我忍受了什么呢？」
    - type: paragraph
      text:
        ru: Что скажу на сие я, окаянный, лукавый, грешный и скверный? Мученики укажут на раны свои, на мучения, на отсечение членов и на терпение свое до конца. Подвижники укажут на свое подвижничество, на продолжительный пост, на бдения, на нестяжательность, на слезы и все другие злострадания. А я, ленивый и грешный, на что укажу, кроме постыдных плодов чревоугодия, сластолюбия, многоспания, любостяжания, нетерпения, тщеславия, нерадения?
        cn: 我这悲惨的、诡诈的、有罪的、污秽的人，对此能说什么呢？殉道者会指出他们的伤痕、折磨、肢体被截断，以及他们坚持到底的忍耐。苦修者会指出他们的苦修、长时间禁食、守夜、不贪财、眼泪，以及所有其他的苦难。而我，这懒惰有罪的人，除了贪食、贪图享乐、嗜睡、贪恋财物、不耐烦、虚荣和怠惰这些可耻的果子，还能指出什么呢？
    - type: paragraph
      text:
        ru: Если потребуешь у меня, Господи, отчета в том времени, которое дано мне на покаяние, а мною проведено в нерадении, то какое дам оправдание? А если еще подвергнуть меня допросу за праздные слова, за лукавые помышления и пожелания, то какой страх, какое смятение обымут тогда меня, бедного, и какое последует за тем мучение?
        cn: 如果祢，主啊，要向我追讨祢赐予我悔改的时间，而我却将其虚度于懈怠之中，我将给出什么辩解呢？如果再因我的闲言、邪恶的思虑和欲望而审问我，那时我这可怜的人将要被怎样的恐惧和混乱所笼罩，而随之而来的又将是怎样的折磨呢？
    - type: paragraph
      text:
        ru: Пощади, Господи! Пощади, Благоутробный! Пощади, Человеколюбивый! Пощади, единый Благой! Умилосердись и помилуй меня по единой благости Твоей. Укрепи душу мою, растлевшую от лености и нерадения моего, Ты, восставляющий низверженных и врачующий сокрушенных!
        cn: 求祢饶恕，主啊！求祢饶恕，满有慈悲者！求祢饶恕，仁爱世人的！求祢饶恕，独一良善者！求祢施怜悯，垂怜于我，因着祢独一的良善。求祢坚固我那因我的怠惰和懈怠而败坏的灵魂，祢，那使被倾覆的重新站立，并医治那心灵破碎的！
    - type: paragraph
      text:
        ru: Ты знаешь нерадивость окаянства моего, знаешь, сколько лукавых зломыслий воюет против меня, видишь многокозненную вражию злобу на меня. Заступи меня по великой милости Твоей, отрезви, возбуди, оживи и спаси благодатью Твоей молитв ради Пречистой Владычицы нашей Богородицы и всех святых.
        cn: 你知道我可怜可憎的懈怠，你知道有多少诡诈的恶念与我争战，你看到仇敌对我多方设下的恶意。求你按着你丰盛的怜悯扶助我，使我清醒、激励我、使我复苏，并凭你的恩典拯救我，因着我们至洁的女皇、诞神女以及诸圣的代祷。
  - type: heading2
    text:
      ru: Вся надежда – Христос. К Нему взывай
      cn: 全部的盼望就是基督。向祂呼求。
    children:
    - type: paragraph
      text:
        ru: Ты, Господь всяческих, по милосердию Своему будь для меня пристанью спасения, прибежищем помощи и спаси меня.
        cn: 你，万有之主，按着你的慈悲，成为我救恩的港湾、帮助的避难所，并拯救我。
    - type: paragraph
      text:
        ru: Умоляю благость Твою, Спаситель мой, отныне излей на меня щедроты Твои и там поставь меня вдали от мучимых.
        cn: 我恳求您的慈恩，我的救主，从今以后，将您的丰盛恩典倾降于我，并将我安置在远离受折磨者之地。
    - type: paragraph
      text:
        ru: Христе, благоволивший стать жертвой за нас, умертви грех, которым поражены все члены мои, снизойди, обитай в членах моих.
        cn: 基督啊，祢乐意为我们献上自己为祭，求祢治死那毒害我所有肢体的罪，求祢降临，居于我肢体之中。
    - type: paragraph
      text:
        ru: Как скоро узнает о сем лукавый, сокрушатся зубы его и огнь гееннский будет угашен Твоим блистанием.
        cn: 一旦那恶者得知此事，他的牙齿就会被打碎，格欣纳的火也必被祢的光辉所熄灭。
    - type: paragraph
      text:
        ru: Лукавый сатана изблевал на меня яд свой, растлил и низложил меня грехом. Но поскольку иду я Твоим путем, а Ты всемогущ, то питает надежду немощь моя, что Ты, презря его, окажешь мне помощь оставлением грехов и посрамится растлитель мой.
        cn: 诡诈的撒旦向我喷吐它的毒液，用罪败坏了我，并击垮了我。但既然我行走在祢的道路上，而祢是全能的，我的软弱便怀抱希望，相信祢必轻蔑他，以赦免我的罪孽来帮助我，我的败坏者就必蒙羞。
    - type: paragraph
      text:
        ru: Князья злобы ослепили меня страстями своими и хитростью своей похитили у меня красоту юности моей. Что же делать мне, утратившему чистоту свою? Возопию ко Христу, чтобы возвратил Он мне красоту мою, и тогда посрамятся лукавые.
        cn: 邪恶的君王们以他们的情欲蒙蔽了我，并以他们的诡计窃取了我青春的荣美。我这已失去纯洁的人，该怎么办呢？ 我要向基督呼求，求他将我的荣美归还于我，这样，那邪恶的必蒙羞受辱。
    - type: paragraph
      text:
        ru: 'Спаситель мой взывает ко мне, ученику Своему: «Не отчаивайся в своем спасении, Я восстановляю тебя и отпускаю тебе грехи твои! Мое ты приобретение, и Я не оставлю тебя, потому что искупил тебя собственной Своей кровью».'
        cn: '我的救主呼唤着我，祂的门徒：

          「不要为你的救恩绝望，我正在恢复你，并赦免你的罪！你是我所获取的，我永不离弃你，因为我已用自己的宝血将你赎回。」'
    - type: paragraph
      text:
        ru: Взывай же, грешник, изо всех сил и не щади гортани своей, ибо Господь твой милостив и любит кающихся. Коль скоро возвратишься ты, Отец твой предварит тебя сретением Своим, заколет тельца упитанного, облечет тебя в светлую ризу и возвеселится о тебе.
        cn: 呼求吧，罪人，尽你的一切力量，不要顾惜你的嗓音，因为你的主是怜悯的，且喜爱悔改者。一旦你归回，你的父必抢先前来与你相遇，宰杀那肥牛犊，给你穿上洁白的衣袍，并要因你而欢喜快乐。
  - type: heading2
    text:
      ru: 'Не падай духом: есть надежда – Христос'
      cn: 不要灰心：有希望——基督
    children:
    - type: paragraph
      text:
        ru: 'Не упадай духом, душа, не скорби, не произноси над собой решительного суда по множеству грехов, не привлекай на себя огня, не говори: «Отринул меня Господь от лица Своего».'
        cn: 灵魂啊，不要灰心，不要忧伤，不要因着你众多的罪过，就对自己作出决定性的审判，不要给自己招引火，不要说：「主已经把我从祂的面前弃绝了。」
    - type: paragraph
      text:
        ru: Богу неугодны такие слова. Разве тот, кто пал, не может восстать? Разве тот, кто отвратился, не может обратиться? Или не слышишь, какова благодать Отца к блудному?
        cn: 上帝不悦纳这样的话语。难道那跌倒的人不能复起吗？难道那转离的人不能归回吗？或者你难道没听到父对那浪子的恩典是何等大吗？
    - type: paragraph
      text:
        ru: Не стыдись же обратиться, но с дерзновением скажи:Встану, пойду к Отцу моему(Лк. 15:18)! Встань и иди.
        cn: 不要羞愧回转，却要带着坦然无惧的心说：「我要起来，到我父亲那里去！」（路加福音 15:18）起来，去吧。
    - type: paragraph
      text:
        ru: Он примет тебя и не укорит, а паче возрадуется твоему возвращению. Он ждет тебя, только не стыдись и не скрывайся от лица Божия, как Адам.
        cn: 他会接纳你，不会责备你，反而会为你的归来更要欢喜。他在等你，只是你不要像亚当那样感到羞耻，也不要躲避上帝的面。
    - type: paragraph
      text:
        ru: Ради тебя Христос распялся – и отринет ли тебя? Он знает, кто утесняет нас, знает, что нет у нас другого помощника, кроме Него единого.
        cn: 为你，基督被钉十字架——祂会弃绝你吗？祂知道谁在压迫我们，知道我们除了祂独一的一位，没有别的帮助者。
    - type: paragraph
      text:
        ru: Христос знает, что человек беден. Не предавайся же нечаянию и нерадению, как бы уготованный в огнь. Христу нет утешения ввергать нас в огнь, не приобретение для Него посылать нас в бездну на мучения.
        cn: 基督知道人是贫穷的。所以，不要沉溺于绝望和怠惰，仿佛已被预备投入火中。基督将我们投入火中，祂毫无慰藉可言；将我们送入深渊受苦，对祂而言毫无益处。
    - type: paragraph
      text:
        ru: 'Подражай блудному сыну: оставь морящий голодом город. Приступи и умоляй – и узришь славу Божию. Просветится лицо твое, и ты возвеселишься в раю сладости. Слава спасающему нас Господу Человеколюбцу!'
        cn: 效法浪子：离开那令人饿死的城市。近前恳求——你就必看见上帝的荣耀。你的脸必得光照，你将在甜美的乐园中欢欣。荣耀归于那拯救我们的爱世人的主！
  - type: heading2
    text:
      ru: Уроки жизни
      cn: 生命的课程
    children:
    - type: paragraph
      text:
        ru: Желаешь ли правой жизни? Упражняйся в смиренномудрии, потому что без него правая жизнь невозможна.
        cn: 你是否愿意过正直的生活？操练谦卑吧，因为没有它，正直的生活是不可能的。
    - type: paragraph
      text:
        ru: Все дела свои делай во имя Спасителя нашего Иисуса Христа, и чрез это плод твой вознесен будет до неба.
        cn: 你一切所行的事，都要奉我们救主耶稣基督的名去做，借此，你的果实将被提升直到天上。
    - type: paragraph
      text:
        ru: Начало отступления в человеке есть удаление его от смирения. Оставленного же Богом давит лукавый дух, как Саула.
        cn: 人在灵性上的背离，始于他远离谦卑。而被上帝所舍弃的，恶灵就压制他，如同压制扫罗一样。
    - type: paragraph
      text:
        ru: Сети врага намазаны медом; увлекшийся сладостью меда запутывается в сети и исполняется всякой горечи.
        cn: 仇敌的网涂满了蜂蜜；被蜂蜜的甜味所吸引的人，就会被网缠住，并充满各样的苦涩。
    - type: paragraph
      text:
        ru: Возлюби смирение, и никогда не впадешь в диавольскую сеть, потому что, воспаряя на быстрых крыльях его, всегда будешь выше вражеских сетей.
        cn: 爱慕谦卑，便永不堕入魔鬼的网罗，因为你将借其疾飞之翼高翔，常在仇敌的网罗之上。
    - type: paragraph
      text:
        ru: Гордыня подобна весьма высокому согнившему дереву, у которого ломки все сучья, и если кто взберется на него, тотчас обрушится с высоты.
        cn: 骄傲犹如一棵极高的腐朽之树，其所有枝桠都脆弱易断；一旦有人攀爬其上，随即会从高处跌落。
    - type: paragraph
      text:
        ru: 'Блажен утучненный благими надеждами и озаренный благими помышлениями: слава его велика и нескончаема.'
        cn: 蒙福的是那被良善希望所滋养，并被良善思念所光照的人：他的荣耀伟大而无穷尽。
    - type: paragraph
      text:
        ru: Будем стремиться к трезвенному вниманию, чтоб, видя свои прегрешения, постоянно нам смиряться и не воспитывать в себе, как змия, помысла самомнения или лукавства.
        cn: 我们当努力追求警醒的专注，好使我们看见自己的过犯，就不断地谦卑自己，也不在自身培育，如同毒蛇般，自负或诡诈的意念。
    - type: paragraph
      text:
        ru: Возлюбим трезвение, чтоб иметь чистое сердце и чтобы вверенный нам храм сохранить неоскверненным от греховного растления.
        cn: 我们当爱灵性警醒，好使我们拥有一颗纯洁的心，并使托付给我们的殿宇得以保持洁净无玷，免受罪恶的败坏。
    - type: paragraph
      text:
        ru: Прекрасна молитва с воздыханиями и слезами, особенно если слезы проливаем втайне.
        cn: 祈祷是美好的，若伴随着叹息和眼泪，尤其如果我们是在隐秘中倾流眼泪。
    - type: paragraph
      text:
        ru: Кто молится умом с верою, тот зрит пред собой Господа, о Нем бо живем, движемся и пребываем.
        cn: 凡用心灵并凭信心祈祷的人，他便在自己面前看见主，因我们生活、动作、存留，都在乎他。
    - type: paragraph
      text:
        ru: Если окаменело сердце твое, плачь пред Господом, чтоб источил Он на тебя озарение ведения и дал с горячностью сердца возноситься к Нему.
        cn: 如果你的心石化了，就在主面前哭泣，好让祂将识见的光照倾注在你身上，并赐予你以炽热的心向祂高升。
- type: heading1
  text:
    ru: Отделение пятое
    cn: 第五部分
  children:
  - type: heading2
    text:
      ru: Исповедание Богочеловечества во Христе Иисусе, Господе
      cn: 认信在基督耶稣，主里的神人二性
    children:
    - type: paragraph
      text:
        ru: Тот, Кто от Бога, Бог Слово, от Отца Единородный Сын, Единосущный Отцу, Сущий от Сущего, рожденный от Отца без матери прежде всех веков неизреченно, Сей самый в последок дней рождается от дщери человеческой, от Марии Девы без отца, рождается Бог воплощенный, понесший на Себе заимствованную от Нее плоть, соделавшись человеком, которым не был, и пребыв Богом, Которым был, чтобы спасти мир. И Он есть Христос, Сын Божий, единородный от Отца, единородный от матери.
        cn: 那位出于上帝的，上帝圣言，从父而生的独生子，与父同本体，出于自有永有者，在万古之先，无母而从父所生，难以言喻。这位独生子，在末后的日子，从人类的女儿，从童贞女马利亚所生，无父而生，祂是道成肉身的上帝，取了从她而来的肉身，成了祂原不曾是的人，却仍是祂原是的那位上帝，为要拯救世界。祂就是基督，上帝的儿子，从父而生的独生子，从母而生的独生子。
    - type: paragraph
      text:
        ru: Одного и Того же исповедую совершенным Богом и совершенным Человеком – в двух естествах, ипостасно, или лично, соединенных, познаваемых нераздельно, неслиянно, неизменно, – Богом, облекшимся в плоть, одушевленную словесной и разумной душой, и соделавшимся нам подобным во всем, кроме греха.
        cn: 我承认祂是同一位完全的神和完全的人——在两个本性之中，位格性地，或者说，人格性地结合在一起的，不可分割、不可混淆、不可改变地被认识——是神，祂取了肉身，这肉身被有理性的和有悟性的灵魂所赋予生命，并在除罪之外的一切事上都与我们相似。
    - type: paragraph
      text:
        ru: Один и Тот же есть земной и небесный, временный и вечный, подначальный и безначальный, безлетный и подлежащий времени, созданный и несозданный, страдательный и бесстрастный, Бог и Человек, в том и другом совершенный. Один в два естества и в двух Один.
        cn: 独一且同一位，是属地的又是属天的，是暂时的又是永恒的，是有始的又是无始的，是超越时间的又是受时间的，是受造的又是非受造的，是能受苦的又是不受苦的，是上帝又是人，在两者中都是完全的。一位在两种本性中，在两种本性中仍是一位。
  - type: heading2
    text:
      ru: Вот-вот смерть. Отрезвись, душа!
      cn: 死亡在即。灵魂啊，清醒吧！
    children:
    - type: paragraph
      text:
        ru: Время жизни моей истрачено в суете и срамных помыслах. Даруй же мне, Господи, врачевство, чтобы вполне излечиться мне от сокровенных язв моих, и укрепи меня хотя один час усердно потрудиться в винограднике Твоем. Ибо время суетной жизни моей уже во единонадесятом часе.
        cn: 我生命中的时光已在虚妄和可耻的念头中耗尽。主啊，求你赐我医治，使我能完全摆脱我隐秘的创伤，并坚固我，哪怕只用一个小时，也能在你的葡萄园里殷勤劳作。因为我虚妄生命的时光已是第十一个时辰了。
    - type: paragraph
      text:
        ru: Ладью с моей куплей управь заповедями Твоими и мне, ничтожному купцу, даруй благоразумие продать свою куплю, пока есть еще время.
        cn: 求你用你的诫命掌舵我承载着我所得的船，并赐予我这卑微的商人明智，使我能趁着仍有时日，卖出我的所得。
    - type: paragraph
      text:
        ru: 'Время плавания приблизилось к концу, и будто слышится уже глас Судии ко мне, рассеянному: «Покажи теперь, ленивый, куплю, какую имел ты в продолжение своей жизни».'
        cn: 我此生航程的时刻已接近终点，仿佛审判者的声音，已传入我这心神散乱者的耳中，说：「你这懒惰之人，现在就将你一生中所获得的成果显现出来吧。」
    - type: paragraph
      text:
        ru: Час смертный устрашает меня, бедного. Ибо смотрю на дела свои, и душа моя трепещет, вижу нерадение свое и леность, и цепенеют кости мои.
        cn: 死期令我这可怜人惊惧。因为我审视自己的作为，我的灵魂便战兢不已，看见我的懈怠与懒惰，我的骨头都僵硬了。
    - type: paragraph
      text:
        ru: Час разлучения предстал очам моим, и я пришел в потрясающий страх, помыслив о нем. Вместо того чтобы радоваться, еще более убоялся я, потому что при благодати не делал дел, достойных Бога.
        cn: 离别之时呈现在我眼前，思及此，我心中便充满令人震颤的恐惧。我非但没有欢欣喜乐，反而更加惧怕，因为我在恩典之中，并未行出配得上神的作为。
    - type: paragraph
      text:
        ru: Увы, душа моя! Зачем нерадишь ты о жизни своей? Зачем в рассеянии проводишь немногие дни ее? Не знаешь разве, что вот-вот позовут тебя? Что же будешь делать там, живя нерадиво здесь? Что станешь отвечать в оправдание свое, представ престолу страшного Судии?
        cn: '唉，我的灵魂啊！你为何懈怠自己的生命？

          你为何在散漫中虚度她寥寥无几的日子？

          难道你不知道，你即将被召离世吗？

          你在此地如此懈怠地生活，到了那里又将如何？

          当你呈现在可畏的审判者宝座前时，你将作何答辩以自辩呢？'
    - type: paragraph
      text:
        ru: Враг обманывает тебя и изо дня в день расхищает достояние твое, а ты и не разумеешь того.
        cn: 仇敌欺骗你，日复一日地窃取你的产业，而你却不察觉。
    - type: paragraph
      text:
        ru: 'Отрезвись же, войди в себя и молись к Богу со слезами, взывая к Нему с сердечною скорбью: «Даруй мне, Господи, возлюбить Тебя всей силой моей и усердно послужить Тебе исполнением святых заповедей Твоих, чтобы, когда придет час разлучения, нашел Ты меня готовой и с великой радостью ожидающей сретения Твоего и ввел в Царство Твое вечное, в сорадование со всеми святыми, Тебе благоугодившими!»'
        cn: 醒悟过来吧，进入你内心，含泪向上帝祈祷，怀着心中的愁苦向祂呼求：「主啊，求祢赐予我，尽我全心全力爱祢，并藉着遵行祢的圣洁诫命殷勤地事奉祢，为使当离别的时刻来临时，祢能发现我已预备妥当，并以极大的喜乐等候与祢相遇，引我进入祢永恒的国度，与所有蒙祢喜悦的圣徒一同欢庆！」
  - type: heading2
    text:
      ru: Дай память о жизни вечной, чтобы достойно приготовиться к ней
      cn: 赐予我对永生的记念，好使我能配得地为此作预备。
    children:
    - type: paragraph
      text:
        ru: Спаси меня, долготерпеливый Господи!
        cn: 拯救我，长久忍耐的主啊！
    - type: paragraph
      text:
        ru: 'Спаси меня, Сыне Божий, безгрешный Христе! И даруй мне помышление о жизни вечной, чтоб, ничего не имея в сердце своем, кроме сего помышления, всегда исполнять мне волю Твою при содействующей мне, грешному, благодати Твоей и охотно ходить в повелениях Твоих, с пользой употребив в дело мнас[4], который дал мне Сам Ты, Небесный Царь, – и, на него совершив добрую куплю, сподобиться похвалы от Тебя, Владыко, и, когда приидешь Ты, Господи, сказать с дерзновением от чистого сердца: «Блажен я, что пришел Ты, Владыко!»'
        cn: 拯救我，上主之子，无罪的基督！并赐予我对永恒生命的思虑，以便在我心中除此思虑别无他物，始终遵行祢的旨意，在祢那襄助我这罪人的恩典之下，并乐意遵行祢的诫命，善用祢——天上的君王——亲自赐予我的米那[4]，并用它善作买卖，配得祢——主宰——的称赞，并在祢——主啊——降临时，从一颗纯洁的心坦然无惧地说：「我是蒙福的，因祢——主宰——降临了！」
    - type: paragraph
      text:
        ru: На брак Твой, Господи, облеки меня в достойное одеяние, которое да уготовит во мне еще здесь благодать Твоя. Сподоби меня возжечь тогда и светильник, который да дарует мне Твоя щедродательность.
        cn: 主啊，为您的婚筵，求您赐我披戴配得的袍服，愿您的恩典就在此生在我里面预备好这袍服。那时也求您恩准我点燃油灯，愿这灯是您的慷慨所赐予我的。
    - type: paragraph
      text:
        ru: Так с радостью изыду во сретение Тебя, прославляя и благословляя Тебя, в надежде быть сопричастником праведных и святых, от века Тебе благоугодивших.
        cn: 于是，我将怀着喜乐出迎你，颂扬并称颂你，盼望能与自亘古以来蒙你喜悦的义人圣徒同有份。
  - type: heading2
    text:
      ru: Ищешь милости? Будь сам милостив
      cn: 寻求怜悯吗？你自己要怜悯。
    children:
    - type: paragraph
      text:
        ru: Оставляются долги тем, кто просит о помиловании. Но смотри не питай ненависти к братьям своим, когда просишь оставления долгов.
        cn: 债务得蒙赦免，是赐予那些祈求怜悯之人。但要留意，当你祈求赦免债务时，不要对你的弟兄心存憎恨。
    - type: paragraph
      text:
        ru: За дверьми остаются те молитвы, которые, возносясь к Богу, не имеют при себе любви, потому что одна любовь отверзает двери молитве.
        cn: 那些献给上帝却不带爱的祷告，会被留在门外，因为唯有爱才能为祷告敞开大门。
    - type: paragraph
      text:
        ru: Если брат твой гневается на тебя, то гневается на тебя и Господь. И если примирился ты с братом своим долу, то примирился и с Господом горé. Если восприемлешь брата своего, то восприемлешь и Господа твоего.
        cn: 如果你的兄弟对你发怒，那么主也对你发怒。并且如果你在地上与你的兄弟和好了，那么你也在天上与主和好了。如果你接纳你的兄弟，那么你也接纳了你的主。
    - type: paragraph
      text:
        ru: Итак, примирись с Господом в лице оскорбленных, возвесели Его в лице опечаленных, посети Его в лице больных, напитай в лице алчущих.
        cn: 所以，与主在被冒犯的人身上和好，在忧伤的人身上使祂喜乐，在患病的人身上探望祂，在饥饿的人身上喂养祂。
    - type: paragraph
      text:
        ru: В лице утомленного путника уготовь Ему мягкое ложе, омой ноги Его, посади на первом месте за трапезой своей, преломи хлеб свой и удели Ему, подай Ему и чашу свою.
        cn: 在疲惫的旅客身上，为祂预备柔软的卧榻，洗净祂的脚，让祂在你的宴席上坐首位，掰开你的饼分给祂，也递上你的杯给祂。
    - type: paragraph
      text:
        ru: Он оказал уже тебе большую любовь, раздробил для тебя тело Свое и кровь Свою дал тебе в питие.
        cn: 他已经向你展现了莫大的爱，为你擘开了他的身体，并赐下他的宝血作你的饮品。
  - type: heading2
    text:
      ru: Прощение грехов за прощение обид
      cn: 罪的赦免，基于饶恕过犯
    children:
    - type: paragraph
      text:
        ru: 'Господь как бы так говорит всякой душе: «Прости согрешения брату твоему, и Я прощу тебе грехи твои. Ты простишь малые ошибки, может быть, несколько оволов или динария с три, а Я дарю тебе тысячи талантов. И ты прощаешь только, ничего не давая в дар, а Я грехи тебе оставляю и дарую исцеление и Царствие.'
        cn: 主仿佛如此对每一个灵魂说：「你要宽恕你弟兄的过犯，我就会宽恕你的罪。你会宽恕小的过失，也许是几个奥波尔或三第纳尔的数目，而我赐给你成千上万的他连得。你只是宽恕，什么都不作为礼物给予，而我赦免你的罪，并赐予医治和天国。」
    - type: paragraph
      text:
        ru: И дар твой тогда приму, когда примиришься с тем, кто враждует на тебя. Когда не будешь иметь никакой вражды, когда солнце не зайдет во гневе твоем, когда со всеми у тебя будет мир и любовь – тогда и молитва твоя благоприятна, и приношение твое благоугодно, и дом благословен, и сам ты блажен.
        cn: 那时我才接受你的奉献，当你与那对你怀有敌意的人和好时。当你不再存有任何仇恨，当不让怒气到日落，当你与众人享有和平与爱时——那时你的祷告蒙悦纳，你的献祭蒙喜悦，你的家蒙祝福，你自己也蒙福。
    - type: paragraph
      text:
        ru: А если не примиряешься с братом своим, то как же у Меня просишь прощения?
        cn: 如果你不与你的弟兄和解，你又怎能向我求得赦免呢？
    - type: paragraph
      text:
        ru: Я, Владыка твой, повелеваю тебе, и ты не внемлешь; ты же, раб, как дерзаешь приносить Мне молитву, или жертву, или начатки, имея на кого-нибудь вражду? Как ты отвращаешь лицо от брата своего, так и Я отвращу очи Мои от молитвы твоей и от дара твоего».
        cn: 「我，你的主宰，命令你，你却不听从；你这仆人啊，怎敢在对任何人怀有仇恨的情况下，向我献上祷告、祭物或初熟之物呢？你怎样转脸不顾你的弟兄，我也必照样转眼不看你的祷告和你的礼物。」
  - type: heading2
    text:
      ru: Дай слезы, чтобы омыться, и освободи от уз страстей!
      cn: 赐下泪水，使我得以洁净，并释放我脱离情欲的捆绑！
    children:
    - type: paragraph
      text:
        ru: 'Человеколюбче Иисусе Христе, Боже наш, на щедроты Твои твердо надеясь, умоляю Тебя: не поставь меня ошуюю Себя с козлищами, преогорчившими Тебя, и не скажи мне: «Аминь, аминь, говорю тебе, не вем тя», но по благости Своей дай мне непрестанные слезы, дай сокрушение и смирение сердцу моему и очисти его страхом Твоим, да соделается оно храмом благодати Твоей.'
        cn: 仁爱世人的耶稣基督，我们的上帝，坚定地仰望你的丰盛恩慈，我恳求你：不要把我安置在你左边，和那些惹你忧伤的山羊同列，也不要对我说：「我实实在在地告诉你，我不认识你」，但凭着你的慈爱，赐给我不住的眼泪，赐予我忧伤痛悔和心中的谦卑，并用你的敬畏洁净它，使它成为你恩典的殿。
    - type: paragraph
      text:
        ru: Хотя много я грешен и недостоин, однако ж ударяю непрестанно в дверь Твою, хотя нерадив и ленив и небрегу о своем спасении, однако же желаю Твоим идти путем. Спаси меня ради милости Твоей, потому что благ Ты, Господи, всяческим и щедроты Твоя на всех делех Твоих.
        cn: 尽管我罪孽深重、不配蒙恩，然而我仍不住地敲叩你的门。尽管我怠惰懈怠，且疏忽自己的救恩，然而我仍渴望行你的道路。求你因你的怜悯而拯救我，因为你本为良善，主啊，对万有都是如此，你的恩慈遍及你的一切作为。
    - type: paragraph
      text:
        ru: Буди в помощь мне, Владыко всех, защити душевную мою немощь, чтоб избавиться мне от греховного растления и стать свободным от уз страстей, да не мучительствует во мне злоба и мною как пленником да не обладает враждебный демон, но да приидет на меня Царство Божественнаго и Поклоняемого Твоего Духа, чтоб удалились от меня скверные страсти, которые теперь преобладают и царствуют во мне. Ибо Ты – Бог милосердия, человеколюбия и щедрот.
        cn: 愿你帮助我，万有之主，保护我灵魂的软弱，使我得以摆脱罪恶的腐化，并从情欲的枷锁中获得自由。愿邪恶不再在我里面施虐，愿敌对的魔鬼不再奴役我如同奴役俘虏一般，反而愿你神圣且当受敬拜之圣灵的国度降临到我身上，使那些现在在我里面占据主导并掌权的污秽情欲远离我。因为你是怜悯、仁爱和丰盛慈悲的上帝。
  - type: heading2
    text:
      ru: К Богородице об очищении от страстей и внутреннем благонастроении
      cn: 致圣母：为从情欲中洁净并获得内在的良好心境
    children:
    - type: paragraph
      text:
        ru: Пресвятая Владычица Богородица, единая Чистейшая душой и телом, призри на меня, мерзкого, нечистого, душу и тело очернившего скверной страстной и сластолюбивой жизни моей, очисти страстный мой ум, непорочными соделай и благоустрой блуждающие и слепотствующие помыслы мои, приведи в порядок чувства мои и руководствуй ими, освободи меня от мучительствующего надо мной злого и гнусного навыка к нечистым предрассудкам и страстям, останови всякий действующий во мне грех, омраченному и окаянному уму моему даруй трезвение и рассудительность для исправления моих поползновений и падений, чтобы, освободившись от греховной тьмы, сподобился я с дерзновением прославлять и песнословить Тебя, единую истинную Матерь истинного Света – Христа Бога нашего, потому что Тебя с Ним и о Нем благословляет и славит всякая невидимая и видимая тварь.
        cn: '至圣的圣母女皇，诞神女，


          垂顾我这可憎、污秽之人，我那充满情欲和贪恋享乐的生活玷污了我的灵魂和肉身；洁净我那充满情欲的理智，使我游荡和盲目的意念纯洁无瑕并妥善整理；整理我的感官并引导它们；将我从缠磨着我的，对不洁偏见和情欲的邪恶可憎习性中释放；止息一切在我里面运作的罪；赐予我昏暗可怜的理智警醒和辨别力，以便纠正我的过失和跌倒；使我从罪恶的黑暗中得以自由，得以坦然无惧地荣耀并歌颂您，那唯一真正之光——我们的上帝基督的唯一真实母亲，因为一切有形无形之受造物，都因着祂而与祂一同称颂并荣耀您。'
  - type: heading2
    text:
      ru: Уроки жизни. Блаженства
      cn: 生命的教训。真福八端
    children:
    - type: paragraph
      text:
        ru: Блажен, кто всегда исполнен духовной радости и неленостно несет благое иго Господне, потому что будет он увенчан во славе.
        cn: 蒙福的，是那总是充满属灵的喜乐，并且不懈怠地背负主的良善的轭的人，因为他将在荣耀中被加冕。
    - type: paragraph
      text:
        ru: Блажен, кто очистил себя от всякой греховной скверны, чтоб с дерзновением принять ему в дом свой Царя славы, Господа нашего Иисуса Христа.
        cn: 有福的，是那洁净自己脱离一切罪恶污秽的人，好使他能坦然无惧地迎接荣耀的君王、我们的主耶稣基督进入自己的家。
    - type: paragraph
      text:
        ru: Блажен, кто со страхом и трепетом, благоговейно приступает к Пречистым Тайнам Спасителя, сознавая, что приемлет в себя неразрушимую жизнь.
        cn: 有福了，那怀着恐惧和颤栗，恭敬地领受救主至圣奥秘的人，他意识到自己领受了不朽的生命。
    - type: paragraph
      text:
        ru: Блажен, кто ежечасно помышляет о смерти и привел в себе в бездействие постыдные страсти, гнездящиеся в сердце у нерадивых, потому что такой будет утешен в час кончины своей.
        cn: 有福了，那每时每刻默想死亡，并在自身内使那盘踞在不警醒之人心中可耻情欲归于止息的人，因为这样的人在他临终之时必得安慰。
    - type: paragraph
      text:
        ru: Блажен, кто непрестанно помнит о муках гееннских и спешит со слезами и воздыханиями искренно покаяться Господу, потому что он избавится от всякой скорби.
        cn: 蒙福的，是那不住地记念地狱之苦，并且带着眼泪和叹息真诚地向主悔改的人，因为他必脱离一切的忧愁。
    - type: paragraph
      text:
        ru: Блажен, кто всегда добровольно смиряет себя самого, потому что он будет увенчан Тем, Кто добровольно смирил Себя за нас.
        cn: 有福了，凡是常常甘心谦卑自己的人，因为他将由那位为我们甘心谦卑自己者所加冕。
    - type: paragraph
      text:
        ru: Блажен, кто со всяким благоговением, как Мария, пребывает у ног Господа (молитвой) и, как Марфа, спешит принять Господа и Спасителя (благотворением).
        cn: 有福的人，凡以全然的敬虔，如同马利亚，安坐于主的脚前（借着祷告），又如同马大，急切地接待主和救主（借着善行）。
    - type: paragraph
      text:
        ru: Блажен, кто, разжигаемый страхом Божиим, всегда имеет в себе теплоту Святого Духа и попалил терния и волчцы лукавых помыслов.
        cn: 有福了，那被敬畏上帝的恐惧所点燃，心中常有圣灵的温暖，并烧尽了邪恶思念的荆棘和蒺藜的人。
    - type: paragraph
      text:
        ru: Блажен, кто с духовным благоразумием любит кротость и не дает себя в обман лукавому змию, возлагая надежду на благого и милосердного Господа.
        cn: 福哉，那怀着属灵的明智爱慕谦卑，并且不让自己受诡诈之蛇的欺骗，将希望寄托于善良且慈悲的上帝的人。
- type: heading1
  text:
    ru: Отделение шестое
    cn: 第六部分
  children:
  - type: heading2
    text:
      ru: Исповедание Пресвятой Троицы
      cn: 至圣三位一体宣认
    children:
    - type: paragraph
      text:
        ru: Одно лицо Отца, и одно лицо Сына, и одно лицо Духа Святого – одно Божество, одна сила, одно царство в трех лицах, или ипостасях.
        cn: 一个位格的父，一个位格的子，一个位格的圣灵——一个神性，一个权能，一个国度，在三个位格中，或曰三个本体。
    - type: paragraph
      text:
        ru: Так славим святую едúницу в Троице и Святую Троицу в едúнице, так исповедует Святая Божия Вселенская Церковь!
        cn: 我们如此颂赞在圣三一中的圣一，以及在圣一中的圣三一；神圣大公的教会如此宣认！
    - type: paragraph
      text:
        ru: О сей Святой Троице крестит она в жизнь вечную, Ее святит равночестием, Ее исповедует нераздельно и неотлучно, Ей поклоняется непогрешительно, Ее прославляет немолчно.
        cn: '关于这圣三一，

          她使人受洗，进入永生；

          她以同等的尊荣使其成圣；

          她不分离、不间断地宣认祂；

          她无误地敬拜祂；

          她不停止地赞美祂。'
    - type: paragraph
      text:
        ru: Сей Триипостасной едúнице – Отцу, и Сыну, и Святому Духу подобает слава, благодарение, честь, держава, величие во веки.
        cn: 这三位格的独一者——圣父、圣子、圣灵，配得荣耀、感恩、尊贵、权能、威严，直到永远。
  - type: heading2
    text:
      ru: Вспомни Второе Пришествие и отрезвись
      cn: 回想第二次降临，并警醒。
    children:
    - type: paragraph
      text:
        ru: 'Возведи очи свои на небо, когда оно, подобно чистому зеркалу, со славой осиявает звездами землю, и в удивлении скажи: «Если звезды сияют с такой славой, то кольми паче праведные и святые, сотворившие волю Святого Бога, в тот час, когда приидет Господь, воссияют неизглаголанным светом спасительной славы.'
        cn: 举目仰望天空，当它如同明净的镜子，以荣耀的星辰光照大地时，并满怀惊奇地说：『如果星辰以如此荣耀闪耀，那么，那些遵行圣洁上帝旨意的义人与圣徒，岂不更要在主降临之时，以不可言喻的救赎荣耀之光闪耀吗。』
    - type: paragraph
      text:
        ru: 'Вспомнив же о страшном оном Пришествии, содрогнись телом и душой и с сердечной болезнью скажи себе: «Каким же я, грешный, окажусь в этот страшный час? Как предстану престолу Страшного Судии? Как мне, рассеянному, иметь место с совершенными? Или как мне, козлищу, стать с овцамиодеснуюХриста? Или как мне, бесплодному, оказаться в числе святых, совершивших здесь плоды правды?'
        cn: 回想起那可怕的降临，身体和灵魂都战栗吧，并以心之痛苦对自己说：「我这罪人，在那可怕的时刻将是怎样的呢？我将如何站立在可怕审判者的宝座前？我这心神散乱之人，怎能与那完全人同得一席之地？或者我这山羊，怎能与绵羊一同站立在基督的右边？或者我这不结果子之人，怎能与在此地结出公义果实的圣徒一同被算入其中呢？」
    - type: paragraph
      text:
        ru: Мученики покажут свои муки, подвижники – свои добродетели, а я что покажу, кроме своего нерадения и всегдашних себе поблажек?
        cn: 殉道者会展示他们的痛苦，苦修者会展示他们的美德，而我又能展示什么呢，除了我的懈怠和总是自我放任？
    - type: paragraph
      text:
        ru: О душа грешная, душа бесстыдная, душа, ненавидевшая всегда богоугодную жизнь! Долго ли увлекаться тебе худым навыком к лукавым помыслам? Чего ждешь в нерадении своем?
        cn: 哦，有罪的灵魂啊！哦，无耻的灵魂啊！哦，你这素来憎恶蒙神喜悦之生活的灵魂啊！你还要沉溺于那引向诡诈意念的恶习多久呢？你在这疏忽不顾中，还在等什么呢？
    - type: paragraph
      text:
        ru: Думаешь, что укоснит[5]прийти Судия? Не укоснит Он, но как страшная молния будет пришествие Его с небес.
        cn: 你认为审判者会延迟[5]到来吗？他不会延迟，但他会像一道可怕的闪电一样从天上降临。
    - type: paragraph
      text:
        ru: Постарайся же оказаться готовой в тот страшный час, чтобы не плакать там во век века».
        cn: 务要在那可怕的时刻做好准备，以免在那里直到永远地哭泣。
  - type: heading2
    text:
      ru: Здесь накажи и благодатью исправь, чтоб там не постыдиться!
      cn: 在这里管教我，并以恩典改正我，好叫我在那里不蒙羞！
    children:
    - type: paragraph
      text:
        ru: Пощади, милосердый Господи, пощади раба Твоего, чтоб не оказаться мне там предстоящим Судилищу Твоему в страхе и великом стыде и не стать позором для Ангелов и человеков.
        cn: 慈悲的上帝啊，求你怜悯，怜悯你的仆人，以免我站在你的审判台前，带着恐惧和极大的羞耻，不至于成为天使和世人的羞辱。
    - type: paragraph
      text:
        ru: Здесь, Спаситель мой, накажи меня как чадолюбивый и сердобольный Отец, а там прости как единый безгрешный и многомилостивый Бог.
        cn: 在这里，我的救主啊，求您如同爱孩子的、仁慈怜悯的父亲那样惩戒我；在那里，求您如同唯一无罪、极其怜悯的上帝那样赦免我。
    - type: paragraph
      text:
        ru: Ибо если здесь не вразумишь несчастного и не дашь ему сердечного озарения, чтобы ежедневно без стыда приносил он покаяние во грехах своих, – что там делать ему, не имеющему оправдания?
        cn: 因为如果在这里你不安慰那可怜人，也不赐予他心灵的启迪，使他能每日毫无羞愧地为自己的罪悔改，——那么在那里，没有称义的他又能做什么呢？
    - type: paragraph
      text:
        ru: Когда не было еще меня на земле, угодно было Тебе, Владыко, по великим щедротам Твоим образовать меня во чреве грешной матери моей; когда же родился я, то по милости Своей сподобил Ты меня стать сосудом благодати. Но, получив дар, я, слабый и грешный, по лености уклонился от воздаяния за него.
        cn: 当我尚未在地之时，蒙祢喜悦，主宰啊，凭祢的丰盛恩慈，在我有罪之母的胎中塑造了我；待我降生之际，祢又凭着祢的慈爱，恩准我成为恩典的器皿。然而，我这软弱有罪之人，在领受了这恩赐之后，却因怠惰而偏离了应有的报答。
    - type: paragraph
      text:
        ru: 'Почему, припадая к благости Твоей, молюсь Тебе, Сыне Единородный, Спасителю наш: отрезви меня, и восстави, и паки осени благодатью Твоей, да озаряет она помраченный мой ум, как угодно Твоей благости, и, всегда пребывая со мной, своим невидимым руководством соделает меня достойным Царствия Небесного, дабы как здесь сия благодать Твоя была для меня, недостойного, на всякий час озарением, покровом, защитой, убежищем и радостью, так и там, Спаситель мой, под покровом ее укрылся бы я от Страшного Суда и в Царствии Твоем, ущедренный ею, спасенный милостью Твоей, сталодесную, воспевая и прославляя долготерпение Твое, Пречистый Создатель мой, потому что не презрел Ты слез непотребного и грешного раба Твоего.'
        cn: 因此，我俯伏在祢的恩慈前，向祢，独生子，我们的救主祈祷：使我清醒，并使我站立，再次以祢的恩典覆庇我，愿它照亮我昏暗的心智，合祢恩慈之意，并永远与我同在，以其无形的引导使我配得上天国；好使祢这恩典，在这里，对我这不配之人，在每一刻都是光照、覆庇、保护、避难所和喜乐，如此在那里，我的救主，在其覆庇之下，我得以躲避可怕的审判，并在祢的国度里，蒙其厚赐，因祢的怜悯得救，得以站立在右边，歌颂并荣耀祢的恒忍，我至圣的造物主，因为祢未曾轻视祢这无用而有罪之仆的眼泪。
  - type: heading2
    text:
      ru: Возбуди, дай силы и слезы!
      cn: 激发，赐予力量和眼泪！
    children:
    - type: paragraph
      text:
        ru: 'Простри, Господи, руку помощи мне, лежащему во прахе. Ибо хочу встать – и не могу: бремя греховное подавило меня, лукавый навык держит меня прикованным к земле, и весь я как расслабленный. Даю обет перемениться и пощусь, но всё остаюсь тот же; ревностен я славить Тебя устами, но благоугождать Тебе делами не усердствую.'
        cn: 主啊，求你向卧于尘土之中的我伸出援助之手。因为我想要站起来——却不能：罪孽的重负将我压垮，邪恶的习性将我紧紧地束缚在地上，我整个人如同瘫痪一般。我许诺改变自己并禁食，但我仍旧一如既往；我热衷于用我的口赞美你，却不殷勤努力以行为取悦于你。
    - type: paragraph
      text:
        ru: Как осмелюсь просить об оставлении прежних грехов, не положив начала оставлению прежнего грехолюбия? Или как совлекусь ветхого человека, не пресекши вожделений греховного обольщения?
        cn: 我怎敢祈求弃绝往昔的诸罪，若不开始弃绝往昔对罪的恋慕呢？或者我怎能脱去旧人，若不截断罪恶诱惑的私欲呢？
    - type: paragraph
      text:
        ru: О Господи, воздвигни меня, расслабленного, возбуди спящего, воскреси умерщвленного грехом! Спаси бедную душу мою от смерти, Господи, имеющий власть над жизнью и смертью!
        cn: 哦，主啊，扶起我这软弱无力的，唤醒那沉睡的，复活那被罪恶致死的！拯救我这可怜的灵魂脱离死亡，主啊，您是掌管生命与死亡权柄的！
    - type: paragraph
      text:
        ru: Прежде кончины истреби во мне всякий грех и даруй мне, Человеколюбче, во всю эту краткую жизнь мою источать из сердца слезы к очищению душевных скверн моих, чтобы там мог я спастись под кровом всесильной руки Твоей, когда всякая душа вострепещет пред страшной Твоей славой.
        cn: 在我临终之前，根除我心中一切罪孽，并赐予我，祢这慈爱世人者，在我这短暂的一生中，从心中倾流泪水，为要洁净我灵魂的污秽，好使我在祢全能之手的荫庇之下得救，当每一个灵魂在祢可畏的荣耀面前战兢之时。
    - type: paragraph
      text:
        ru: Ей, Владыко, услыши и приими прошение грешного и недостойного раба Твоего, спаси меня туне, по благодати Твоей, потому что Ты – милосердый и человеколюбивый Бог, и Тебе славу, благодарение и поклонение воссылаем, Отцу и Сыну и Святому Духу.
        cn: 啊，主宰啊，求你垂听并接纳你这有罪且不配的仆人的祈求。求你凭着你的恩典，白白地拯救我，因为你是一位仁慈又爱世人的上帝。我们向你——父、子和圣灵，献上荣耀、感谢和敬拜。
  - type: heading2
    text:
      ru: Внутренне я не то, что наружно. Исцели!
      cn: 我的内在与外在不同。医治！
    children:
    - type: paragraph
      text:
        ru: 'Увы мне, какому подлежу я осуждению и какого достоин посрамления! Сокровенное мое не таково, как наружное: беседую о бесстрастии, а сам день и ночь помышляю о срамных страстях, веду речь о непорочности, а сам мысленно занимаюсь непотребством.'
        cn: 唉，我该受何等样的定罪，又当得何等样的羞辱！我的内在与外表不符：我谈论无情欲，而我自己却昼夜思想可耻的情欲；我谈论纯洁，而我自己却在心思中从事不洁之事。
    - type: paragraph
      text:
        ru: Увы! Какое предстоит мне испытание? Подлинно, ношу я на себе образ благочестия, а не силу его. С каким лицом приступлю к Господу Богу, знающему тайны сердца моего, будучи повинен в таком непотребстве? Стоя на молитве, боюсь, чтобы не сошел огнь с неба и не попалил меня, как некогда принесших чуждое кадило в пустыне пожег огонь от Господа.
        cn: 唉！我将面临怎样的考验？确实，我身上披着虔敬的形像，而非其力量。我将以怎样的面目来到主上帝面前，祂洞悉我心之隐秘，我竟然犯下如此不堪之罪？站立祈祷时，我害怕有火从天而降，将我焚烧殆尽，就像从前在旷野中献上异样香火之人，被主所降之火焚毁。
    - type: paragraph
      text:
        ru: Чего ожидать мне, на котором лежит такое тяжкое бремя грехов? Сожжено сердце мое, омрачен ум, изменился благочестивый помысл – как пес, всегда обращаюсь на свою блевотину.
        cn: 背负着如此沉重罪担的我，还能期待什么呢？我的心被烧灼了，意念被蒙蔽了，虔敬的思虑变质了——我像狗一样，总是回到自己的呕吐物。
    - type: paragraph
      text:
        ru: Нет у меня дерзновения пред Испытующим сердца и утробы, нет у меня чистых мыслей, нет слез во время молитвы, хотя и воздыхаю я, и склоняю ниц покрытое стыдом лицо свое, и бью себя в грудь – это жилище страстей, эту рабочую храмину лукавых помыслов.
        cn: 我没有坦然的信心在鉴察人心肠肺腑的主面前，我没有纯洁的意念，祷告时也没有泪水，尽管我叹息，尽管我俯下我那蒙羞的脸，尽管我捶胸——这情欲的居所，这邪恶意念的作坊。
    - type: paragraph
      text:
        ru: Знаешь Ты, Господи, скрытые во тьме страсти мои, известны Тебе язвы души моей. Исцели же мя, Господи, – и исцелюсь. Если не Ты созиждешь дом души моей, всуе потружусь, зиждя его сам.
        cn: 主啊，你深知我隐藏在黑暗中的情欲，我灵魂的创伤你也明了。求你医治我，我便得医治。若非你建造我灵魂的殿堂，我独自建造，便是徒劳无功。
    - type: paragraph
      text:
        ru: Правда, уготовляюсь иногда и сам я к противоборству страстям, когда они воюют на меня, – но злокозненность змия расслабляет душевные силы мои сластолюбием, и я уступаю. Хотя никто не вяжет мне руки видимо, невидимые страсти влекут меня как пленника.
        cn: 确实，有时我自己也预备与诸情欲争战，当它们攻打我时，——但那蛇的诡诈借着贪爱享乐，使我灵魂的力量松懈下来，我就屈服了。虽然没有人肉眼可见地捆绑我的手，无形的情欲却将我如同俘虏一般牵引着。
    - type: paragraph
      text:
        ru: О Господи, просвети очи сердца моего, чтобы познать мне всё коварство и злобу страстей! Благодать Твоя да приосенит меня, чтоб я мог стать и устоять, препоясав чресла свои мужеством.
        cn: 哦，主啊，光照我心之眼，使我得以认识诸情欲的一切诡诈和邪恶！愿祢的恩典荫蔽我，使我能站立并站稳，以勇气束我腰身。
    - type: paragraph
      text:
        ru: Ты, Господи, некогда для народа Твоего непроходимое море сделал удобопроходимым. Ты из твердого камня жаждущим людям Твоим дал воду. Ты один по благодати Своей спас впадшего в разбойники. Умилосердись и надо мной, который также попался в руки разбойникам и, как узник, связан злоумием.
        cn: 主啊，祢曾几何时为祢的子民使那难以逾越的海洋变为易于通行。祢从坚硬的磐石中为祢口渴的人们赐予了水。唯有祢凭借祢的恩典，拯救了那落入强盗手中的人。也怜悯我吧，我也同样落入了强盗手中，并且像一个囚犯，被恶念所捆绑。
    - type: paragraph
      text:
        ru: Никто не силен исцелить страстность души моей, кроме Тебя, Господи, ведущего глубины сердца моего. Преклонись убо милосердием Твоим и спаси меня!
        cn: 没有人能医治我魂的情欲，除了祢，主啊，祢洞悉我心的深处。求祢以祢的慈悲俯就，并拯救我！
  - type: heading2
    text:
      ru: Пал я. Восставь и дай хоть немного потрудиться, чтобы на Суде не быть посрамленным!
      cn: 我跌倒了。求祢使我重新站立，并求祢赐我哪怕一点点的劳作，免得我在审判时蒙羞！
    children:
    - type: paragraph
      text:
        ru: Очисти меня благодатью Твоей, милосердый Отец, отри скверны мои всеочищающим иссопом Твоим и исцели язвы мои, чтоб возблагодарил я благодать Твою!
        cn: 慈悲的父啊，凭祢的恩典洁净我，凭祢那洁净一切的牛膝草擦去我的污秽，并医治我的创伤，好让我能感谢祢的恩典！
    - type: paragraph
      text:
        ru: Я пал, восставь и укрепи меня, Господи, ибо Ты восставляешь всех падших. Простри ко мне руку и снова оживотвори меня Твоими щедротами!
        cn: 我堕落了，主啊，求祢扶持并坚固我，因为祢扶持所有堕落之人。向我伸出祢的手，并再次藉着祢的厚恩使我活过来！
    - type: paragraph
      text:
        ru: Противник обманул меня, совлек с меня и похитил всё мое убранство, сделал, что остаюсь бесплодным и должен идти (туда) обнаженный от всего. Милость Твоя да будет мне ризой в день Суда!
        cn: 仇敌欺骗了我，剥夺并偷走了我所有的妆饰，使我变得贫瘠，并且我必须赤身露体地前往（那里），一无所有。愿祢的恩典成为我审判之日的长袍！
    - type: paragraph
      text:
        ru: Велик страх в тот день Суда, когда каждый даст отчет в делах своих и в помыслах и даже в мановении очей. Ты оправдай меня тогда, Судия мой, ибо хоть и виновен я, но имею волю каяться.
        cn: 在审判日，恐惧将是巨大的，届时每个人都要为自己的行为、意念，甚至为每一次眨眼交账。我的审判主啊，那时求祢判我为义，因为我虽有罪，却有悔改的心意。
    - type: paragraph
      text:
        ru: Терзаться и беспредельно мучиться будет сердце наше, когда прейдет всё, возбуждавшее в нас похотения, когда всякий предстанет обнаженным и поведен будет к ответу.
        cn: 我们的心将受煎熬，无边无际地痛苦，当那一切曾激动我们情欲的事物都消逝时，当每一个人都赤身露体地站立，并被引至交账之时。
    - type: paragraph
      text:
        ru: Тогда горе тому, кто, подобно мне, соделал множество беззаконий, кто грешил и скрывал свои грехи, чтоб не быть посрамленным здесь! Там в день Суда будут указывать на него перстами.
        cn: 那么，祸哉那人，他像我一样，犯下了众多的不法之事，他犯了罪，又隐藏自己的罪，为的是免得在此蒙羞！在那里，在审判之日，人将用指头指着他。
    - type: paragraph
      text:
        ru: Беззакония мои умножились, дни мои протекли и исчезли, приближается время конца, а покаяния нет во мне. Если не будет места щедротам, горе мне в день Суда!
        cn: 我的罪孽加增了，我的年日流逝并消失了，结局的时刻临近了，然而我里面却没有悔改。若没有怜恤的余地，我在审判之日便有祸了！
    - type: paragraph
      text:
        ru: Блажен человек, который потрудился немного в этом мире, ибо он наследует Царство в мире непреходящем. За малый труд приобретет он великое наследие.
        cn: 蒙福的人，在这世上略有辛劳，因为他将继承那在不朽坏世界中的天国。因着微小的劳苦，他将获得一份丰盛的产业。
    - type: paragraph
      text:
        ru: 'На Суде Твоем, Господи наш, нет лицеприятия, тогда каждому воздано будет по делам его: у кого дела хороши, тому Царство, а у кого худы, тому мучение.'
        cn: 在您的审判台前，我们的主，没有偏私；届时各人必照其行为受报：行为良善的，必得天国；行为邪恶的，必受苦楚。
    - type: paragraph
      text:
        ru: Отверзи мне дверь щедрот Твоих, Надежда кающихся, и простри ко мне руку Твою, исполненную врачевств, чтобы обвязала струпы мои и исцелила язвы мои.
        cn: '为我敞开你厚恩之门，悔罪者的盼望啊，

          并向我伸出你那满有医治之能的手，

          好使它能包扎我的创伤，医治我的疮疤。'
    - type: paragraph
      text:
        ru: Воля моя отказывается следовать Твоей воле. Ты Сам покори меня воле Твоей, чтобы чрез то получил я спасение и прославил волю Твою, которая благоволит к кающимся.
        cn: 我的意志拒绝顺从你的旨意。愿你亲自使我顺服你的旨意，好叫我借此得着救恩，并荣耀你那恩待悔改之人的旨意。
    - type: paragraph
      text:
        ru: Милостиво приими молитву мою о примирении с Тобой и по благости Твоей даруй мне жизнь в Пришествие Твое, и посрамится лукавый, когда увидит, что помиловала меня правда Твоя.
        cn: 仁慈地垂纳我为与祢和好所献的祈祷，并按祢的恩慈，在祢再临时赐我生命，那恶者必蒙羞，当他看见祢的公义怜悯了我。
  - type: heading2
    text:
      ru: Уроки жизни
      cn: 生命的课程
    children:
    - type: paragraph
      text:
        ru: Видя приятности жизни, остерегайся, чтобы они не увлекли тебя, ибо в них сокрыта сеть смертная. Так и рыболов не пустую закидывает уду.
        cn: 看到生活的享乐，要警惕，免得你被它们诱惑，因为在它们里面藏着死亡的网罗。渔夫亦是如此，他不会抛下空钩。
    - type: paragraph
      text:
        ru: Враг, как приманку на уде, употребляет в дело прелесть сласти, раздражающей вожделение, чтоб чрез то уловлять души и ставить их в зависимость от себя.
        cn: 仇敌，如同鱼钩上的诱饵，运用甜美的诱惑，激起贪欲，为要借此网罗灵魂，并使它们受制于己。
    - type: paragraph
      text:
        ru: Душа, прежде уловленная в волю врага, делается для других душ вражьей сетью, кажущимся наслаждением своим прикрывая горечь греха.
        cn: 一个曾经被仇敌的意愿所掳获的灵魂，对其他灵魂来说，就变成了仇敌的罗网，用其虚假的享乐遮盖着罪恶的苦楚。
    - type: paragraph
      text:
        ru: Прилежа добродетели, не приходи в уныние от трудов, потому что без труда нет добродетели.
        cn: 勤勉于美德，不要因劳苦而灰心，因为没有劳苦就没有美德。
    - type: paragraph
      text:
        ru: Во время труда возводи душевное око горé и, созерцая оную радость, не будешь отрекаться от трудов.
        cn: 在劳作之时，向上举起灵魂之眼，并默观那份喜乐，你便不会厌弃劳作。
    - type: paragraph
      text:
        ru: Труды праведных произращают плод жизни, а труды грешников исполнены гибели. Предаваясь первым и удалясь от вторых, не давай, однако ж, места и трудам пустым, не приносящим плода добра.
        cn: 义人的劳作结出生命的果实，而罪人的劳作则充满毁灭。投身于前者，远离后者，然而，也不要给不结善果的空虚劳作留地步。
    - type: paragraph
      text:
        ru: Терпи для Бога скорби настоящей жизни – и не напрасно будешь водиться упованием святых.
        cn: 为着上帝忍耐今生的磨难，你就不会徒然地由圣徒的盼望引领。
    - type: paragraph
      text:
        ru: Трудящиеся для суетной жизни стараются запнуть трудящихся в делах Божиих, чтобы близ себя не иметь обличения, но тем увеличивают только венцы внимательных тружеников.
        cn: 为世俗生活劳碌的人，试图绊倒在神圣工上劳碌的人，以免他们身边有责备，但他们这样反而只会增加那些警醒劳碌之人的冠冕。
    - type: paragraph
      text:
        ru: Держи смиренномудрие, чтобы не утратить плода добрых дел. Если отринешь оное, то будешь причислен к трудящимся всуе.
        cn: 持守谦卑的心志，以免丧失善行的果实。若你弃绝它，就必被列入徒劳工作者之列。
    - type: paragraph
      text:
        ru: Хочешь ли стать стражем души? Отовсюду приведи себя в безопасность, чтоб не прокрались где сластолюбивые помыслы и не погрузили ладьи твоей в пристани.
        cn: 你是否愿成为灵魂的守卫者？从各方面保障自己的安全，以免贪恋肉欲的念头在某处悄悄潜入，并使你的小舟在港湾中沉没。
    - type: paragraph
      text:
        ru: Если хочешь, чтобы пристань была безопасна, огради ее оплотами, которые бы не вдруг колебались от бури страстей, иначе пристань обратится в место крушения.
        cn: 如果你希望港湾是安全的，就用屏障护卫它，使之不致轻易被情欲的风暴所动摇，否则，这港湾便会成为倾覆之所。
    - type: paragraph
      text:
        ru: Слова страстные если найдут себе место в душе, как крючьями влекут ее на зло, в ров пагубы.
        cn: 情欲之言，若在灵魂中占据一席之地，便如同钩子，将它拖入邪恶，陷入毁灭的深渊。
    - type: paragraph
      text:
        ru: Избегай душевредных сходбищ – и душа твоя всегда будет наслаждаться тишиной.
        cn: 避免损害灵魂的聚会——你的灵魂将永远享受宁静。
- type: heading1
  text:
    ru: Отделение седьмое
    cn: 第七章
  children:
  - type: heading2
    text:
      ru: Славословие Искупителю
      cn: 颂赞救赎主
    children:
    - type: paragraph
      text:
        ru: Благодарение Благому, освободившему род наш от рабства диаволу и смерти и примирившему нас с горней Правдой, Которая гневалась на нас за неправду нашу.
        cn: 感谢那至善者，他将我等族类从魔鬼与死亡的奴役中解放出来，并使我等与曾因我等的不义而向我等发怒的至高公义和解。
    - type: paragraph
      text:
        ru: Благословен Милосердый, взыскавший нас, не искавших Его, возрадовавшийся нашему спасению и в притче о заблудшей овце представивший образ, как мы блуждали и возвращены.
        cn: 受颂赞的慈悲者啊，祂寻找了我们这些不曾寻求祂的人，并为我们的救赎欢欣喜悦，又在迷失羊的比喻中，描绘出我们如何迷失而又被寻回的景象。
    - type: paragraph
      text:
        ru: Наследник и Сын воззвал и возвратил заблудшее естество наше, умер и воскрес и нашим покаянием и обращением возвеселил сонмы духов.
        cn: 继承者和圣子呼召并恢复了我们迷失的本性，祂受死并复活，又藉着我们的悔改和回转，使众灵的群队欢欣。
    - type: paragraph
      text:
        ru: Неизреченна великая любовь, какую явил Человеколюбец, ибо из нашего рода взял Он Ходатая и Им примирил мир с величием Своим.
        cn: 爱人类者所彰显的伟大之爱，难以言喻，因为祂从我们人类中取了中保，并藉着祂使世界与祂的伟大和好。
    - type: paragraph
      text:
        ru: Великое для нас и для всей твари новое чудо совершил Бог в нашем человечестве. Ибо тело наше соделал храмом, чтобы наполнить его тем, что досточтимо всеми.
        cn: 上帝在我们的人性中，为我们和所有受造之物，行了一个伟大的新奇迹。因为祂使我们的身体成为殿宇，好使它充满那为万物所尊崇的。
    - type: paragraph
      text:
        ru: Приидите, земные и небесные, дивитесь и изумляйтесь пред величием достоинства, потому что род наш возведен на чрезмерную высоту недостижимого Божества.
        cn: 你们这些地上和天上的生灵，请来，惊叹并诧异吧，面对这尊严的伟大，因为我们人类已被提升，到达了那不可企及的神性之极高境界。
    - type: paragraph
      text:
        ru: Небо, и земля, и все, что в них, да славословят вместе с нами Возвеличившего род наш, потому что обновил Он образ Свой в нас, изгладил грехи наши, дал нам имя Свое и всё покорил нам.
        cn: 愿天、地以及其中所有的一切，与我们一同赞美那尊崇了我们族类的那一位，因为祂在我们里面更新了祂的形象，涂抹了我们的罪，赐给我们祂的名，并且使万物都顺服了我们。
    - type: paragraph
      text:
        ru: Всякого прославления от чтущих Его достоин Тот, Кто над всем превознес нас! Все единогласно воспоем хвалу Ему, и Отцу, пославшему Его, и Духу Святому!
        cn: 祂配得一切敬拜祂之人的颂赞，因祂使我们超乎万有之上！愿我们齐心合一地向祂、向那差遣祂的父、并向圣灵，同声赞美！
    - type: paragraph
      text:
        ru: Свят, Свят, Свят! Благословен уничиживший Себя по благоизволению Своему и обручивший Себе Святую Церковь!
        cn: 圣哉，圣哉，圣哉！蒙福哉，那按着自己的美意降卑自己，并将圣教会聘为己有者！
    - type: paragraph
      text:
        ru: Свет Твой, Господи наш Иисусе, воссиял над тварью и рассеял тьму заблуждения. Да воссияет ныне и в душах наших свет Твой, Иисусе, Царь наш, Свет истинный.
        cn: 你的光，我们的主耶稣啊，普照在受造物之上，驱散了迷误的黑暗。愿你的光此刻也照耀在我们灵魂里，耶稣啊，我们的君王，真光。
    - type: paragraph
      text:
        ru: Избавь нас от всяких пагубных помыслов, смущающих душу. Тогда с чистым умом будем восхвалять Тебя, Сын Сокровенного Отца, ибо Ты – истинный Свет.
        cn: 求你救我们脱离一切败坏的、搅扰灵魂的意念。那时，我们便能以洁净的心智赞美你，隐秘之父的圣子，因为你是真光。
  - type: heading2
    text:
      ru: Непонятно невнимание к вечным благам и мукам нескончаемым. Призвание к сокрушению
      cn: 漠视永恒的福祉和无尽的痛苦，令人费解。悔罪的呼召。
    children:
    - type: paragraph
      text:
        ru: Увы мне! Какие утешения и какие сладости уготованы нам, а нет подвизающегося, нет вожделевающего! Напротив того, предпочитаем мы настоящее, временное, непостоянное, а вечных оных благ и на мысль себе не приводим. Какое ослепление! Какой вражий обман!
        cn: 哎呀！为我们预备了何等的安慰和甜蜜，却没有努力追求的人，也没有渴慕的人！反之，我们却偏爱这现世的、暂时的、变幻无常的一切，甚至不曾思及那些永恒的福益。何等的盲目！何等的仇敌欺骗！
    - type: paragraph
      text:
        ru: Увы мне! Какие мучения уготованы в наказание подобным мне грешникам, живущим нерадиво, и нет боящегося и трепещущего, но как бы пустословием почитаем внушаемое нам, увеселяясь страстями плотскими, потому что связаны мы ими, как железными цепями, и нет противоборствующего, – но, связуемы, радуемся.
        cn: 哀哉，我！何等样的苦楚预备好，作为对像我这般懈怠生活的罪人的惩罚啊！却没有惧怕和战兢的人，反而将默示于我们的一切视为虚空之言，沉溺于肉体的私欲，因为我们被它们如同铁链一般捆绑着，却没有抵挡之人，反而，被捆绑着，我们却欢喜。
    - type: paragraph
      text:
        ru: О всегубительные козни нечистого змия! Как помрачил он умы всех, чтоб думать нам превратно и пагубное любить паче будущих благ!
        cn: 哦，不洁之蛇那极具毁灭性的诡计啊！他何等蒙蔽了所有人的心智，使我们思想悖谬，爱慕败坏之事，甚于未来的美善！
    - type: paragraph
      text:
        ru: Приидите же, сокрушим сердца свои и будем день и ночь плакать пред Господом. Приидите, напомним себе оный час и неотвратимую нужду и в сокрушении прольем слезы. Приидите, воспомянем неизреченные и неописанные оные блага и сокрушимся. Приидите, воспомянем оный страшный и в ужас приводящий Престол и тот стыд, какой ожидает нас пред ним, и восплачем о себе.
        cn: 来吧，破碎我们的心，并要昼夜在主面前哭泣。来吧，让我们想起那个时刻和不可避免的必然，并要带着痛悔流下眼泪。来吧，让我们回想那些无法言喻、不可描述的恩福，并要痛悔。来吧，让我们回想那可怕且令人惊惧的宝座，以及那在其面前等待我们的羞耻，并要为己痛哭。
    - type: paragraph
      text:
        ru: Приидите, напомним себе, как праведники просветятся, яко солнце, и грешники окажутся подобными пригари на горшке, и, сокрушившись сердцем, возревнуем о добрых делах.
        cn: 来吧，让我们回想，义人将要如同太阳一般发光，而罪人将要显得如同锅底的焦垢；并且，心怀痛悔，为善行发热心。
    - type: paragraph
      text:
        ru: Приидите, утвердим себя в страхе Божием, чтоб сподобиться нам вечных благ.
        cn: 来罢，让我们在敬畏上帝中确立自己，好叫我们得以蒙受永恒的福益。
    - type: paragraph
      text:
        ru: Приидите, в сокрушении и в простоте сердца припадем к Богу, потому что Он благ и милосерд и спасет кающихся.
        cn: 来吧，让我们以忧伤痛悔与纯朴的心俯伏在上帝面前，因为祂是美善和怜悯的，并要拯救悔改的人。
    - type: paragraph
      text:
        ru: Будем умолять Его, чтобы ввел Он нас в Царство Свое, неописанно блаженное и не имеющее конца.
        cn: 让我们恳求祂，愿祂引导我们进入祂那无可言喻的、至福的、永无止境的国度。
  - type: heading2
    text:
      ru: К Богородице. Сам не имею дерзновения, помолись Ты, скорая Помощница!
      cn: '致圣母。

        我自己没有这份勇气，求你代祷吧，速助者！'
    children:
    - type: paragraph
      text:
        ru: Дева Владычица Богородица, Преблагословенная и Богоблагодатная, приклони ухо Твое и выслушай слова мои, произносимые скверными и нечистыми устами моими! Не презри меня, бедного, не попусти до конца погибнуть мне, недостойному рабу Твоему, но употреби матерние Твои молитвы и исцели окаянную мою душу, немилосердно сокрушенную лукавыми моими страстями. Злой враг, сокрушив ее грехами сластолюбия, попрал в прах. Потому, исполненный всякого стыда, и думать не могу и лица не имею, чтоб у человеколюбивого Бога моего просить прощения за множество грехов и уврачевания неисцеленных моих язв. Ибо осквернил я храм телесный, непотребными пожеланиями своими внес в него множество нечистот и все чувства повредил непозволительными делами. Почему не имею дерзновения воздеть к небу руки, оскверненные худыми занятиями. Посему пред Твоими неизреченными щедротами, всенепорочная Владычица, повергаюсь я, бедный и блудный. Ибо нет у меня иного прибежища, кроме Тебя, единственного моего утешения и скорой защиты. На Тебя уповаю, не оставь меня. Приятны прошения Твои Единородному Сыну Твоему; радуется Он ходатайствам Твоим и скоро исполняет Твои о нас молитвы. Не презри меня, беднейшего, и непотребство дел моих да не пресечет безмерной милости Твоей, Богородице. Приими сие ничтожное прошение мое и матерними Твоими молитвами соделай его благоприятным Сыну Твоему и Богу, Небесного Царствия сподобив меня, хвалящего и благословляющего Отца и Сына и Святого Духа.
        cn: 童贞女、主宰者、诞神女，至蒙赐福、充满神恩的祢啊，求祢侧耳倾听我由我污秽不洁之口所发出的言语！莫轻蔑我这卑微之人，莫任凭我这不配的仆人彻底沉沦，而要以祢母性的祷告，医治我这可怜的灵魂，它因我邪恶的私欲而无情地破碎。那恶者，以纵欲之罪将它破碎，又将它践踏成尘。因此，我满怀羞耻，不敢思想，也无颜面，向我那慈爱人类的上帝恳求我众多罪孽的赦免，以及我无法痊愈之创伤的医治。因我已玷污了肉身的殿宇，以我无益的欲望将许多不洁之物带入其中，并以不被允许的行为损害了所有的感官。因此，我没有勇气将这被邪恶行径玷污的双手举向天堂。为此，我在祢那无可言喻的丰盛恩慈面前，全然无瑕的主宰者啊，我这卑微和放荡之人俯伏于地。因我除祢以外，别无他处可投奔，祢是我唯一的安慰和迅速的庇护。我仰望祢，求祢不要离弃我。祢的恳求蒙祢的独生子所悦纳；祂喜悦祢的代祷，并迅速地成就祢为我们所作的祷告。莫轻蔑我这极度卑微之人，愿我行为的不洁不致阻断祢那无限的仁慈，诞神女啊。求祢接纳我这微不足道的恳求，并以祢母性的祷告，使它蒙祢的圣子和上帝所悦纳，使我这颂扬和赞美父、子、圣灵的人，配得天国。
  - type: heading2
    text:
      ru: Сам не смею – помолитесь, святые!
      cn: 我自己不敢——圣徒们，请为我祷告！
    children:
    - type: paragraph
      text:
        ru: Кто не будет плакать обо мне, который за малое удовольствие презрел вечное Царство, ни во что ставя нескончаемый огнь? Предавшись страстям, погубил я достоинство души своей и стал подобен скотам несмысленным.
        cn: 谁能不为我哀哭呢？我竟为区区小乐，藐视了永恒的国度，将无尽的烈火视若无物！沉溺于情欲之中，我丧失了灵魂的尊严，变得如同无理性的牲畜一般。
    - type: paragraph
      text:
        ru: Почивал я некогда, обогащаемый дарованиями, а теперь возлюбил нищету страстей. Чужд стал добродетелей, отлучившись в дальнюю страну порока. Полумертв я и весьма малый являю в себе остаток жизни.
        cn: 我曾一度安歇，蒙受恩赐的丰足，如今却爱上了情欲的贫乏。我已变得与美德格格不入，离弃而去，到了那罪恶的远方。我已半死不活，在我自身中，唯有极微小的生命残存。
    - type: paragraph
      text:
        ru: Будучи таков самопроизвольно, и очей не могу я возвести к благосердому Господу. Плачьте, преподобные и праведные, о мне, объятом страстями и грехами! Плачьте, подвижники воздержания, о мне, чревоугоднике и сластолюбце!
        cn: 既然我如此自行，我便不能举目仰望那慈悲的主。哭泣吧，修道圣者和义人们，为我这被情欲和罪恶缠裹之人而哭泣吧！哭泣吧，禁欲苦修者们，为我这贪食者和纵欲者而哭泣吧！
    - type: paragraph
      text:
        ru: Плачьте, милостивые и снисходительные, о мне, немилосердом и преогорчевающем!
        cn: 哭泣吧，仁慈而宽容的人们，为我这无怜悯而使人大大忧伤的人！
    - type: paragraph
      text:
        ru: Плачьте, благоугодившие Богу, о мне, человекоугоднике!
        cn: 蒙神喜悦的你们，为我这讨人喜悦者哀哭吧！
    - type: paragraph
      text:
        ru: Плачьте, приобретшие кротость, о мне, раздражительном и гневливом!
        cn: 哭泣吧，已获得温良的人，为我这易怒和暴怒之人！
    - type: paragraph
      text:
        ru: Плачьте, смиренномудрые, о мне, высокоумствующем и горделивом!
        cn: 哭泣吧，谦卑心智者们，为我这个心智自高又骄傲的人！
    - type: paragraph
      text:
        ru: Плачьте, приобретшие апостольскую нестяжательность, о мне, приверженном к вещественному и обремененном любоиманием!
        cn: 哀哭吧，你们这些已获得使徒般不贪恋世物的人，为我这个执着于物质并被贪婪所重负的人！
    - type: paragraph
      text:
        ru: Плачьте, возлюбившие плач и возненавидевшие смех, о мне, возлюбившем смех и возненавидевшем плач!
        cn: 哭泣吧，你们这些钟爱哭泣、憎恨欢笑的人啊！为我这个钟爱欢笑、憎恨哭泣的人哭泣吧！
    - type: paragraph
      text:
        ru: Плачьте, содержащие в уме Суд по смерти, о мне, который утверждаю, что помню Суд, а делаю противное!
        cn: 哭泣吧，那些心中铭记死后审判的人们，为我哭泣吧，我声称铭记审判，却行了相反的事！
    - type: paragraph
      text:
        ru: Молитесь, святые Божии, о душе, обуреваемой всякими страстями; чем можете, тем и помогите, святые Божии!
        cn: '为这被各种激情所困扰的灵魂代祷吧，上帝的圣徒们；

          以你们所能，就请帮助吧，上帝的圣徒们！'
    - type: paragraph
      text:
        ru: Ибо знаю, что если будете умолять Человеколюбца Бога, всё будет даровано вам из моря Его благости. И как Бог человеколюбив, так и вы, умоляемые мною, грешным, не презрите прошения моего, потому что сам я по множеству грехов своих не имею дерзновения.
        cn: 因为我知道，如果你们恳求爱好人类的上帝，一切都将出自祂丰盛的恩慈之海赐予你们。并且，正如上帝是爱好人类的，你们也当，被我这个罪人所恳求的，不要藐视我的恳求，因为我自己因我罪恶众多，没有坦然无惧的心。
    - type: paragraph
      text:
        ru: Ваше дело, святые, ходатайствовать за грешных; дело Божие – миловать отчаянных.
        cn: 圣徒们，你们的职责是为罪人代求；上帝的职责是怜悯绝望之人。
    - type: paragraph
      text:
        ru: Умоляйте же, святые Божии, Царя о пленнике, умоляйте Пастыря об овце, умоляйте Жизнь о мертвеце, чтобы послал руку помощи и подкрепил смиренную душу мою в ее поползновенности!
        cn: 恳求吧，上帝的圣者们，为这囚犯恳求君王，为这羊恳求牧者，为这死者恳求生命，好让他派遣援手，在我谦卑的灵魂软弱之中扶持我！
  - type: heading2
    text:
      ru: Там все въявь придет. Спеши исправиться, пока время!
      cn: 届时一切都将全然显现。赶紧改正，趁着还有时间！
    children:
    - type: paragraph
      text:
        ru: Припадаю к щедротам Твоей благости, Владыко всех! Приими моление грешного, услади душу, томимую горечью греха, напой жаждущего из источника жизни и руководи меня путем ее!
        cn: 我俯伏于你丰盛的恩慈前，万有之主啊！求你悦纳罪人的祈求，使被罪的苦毒煎熬的灵魂得甘甜，使饥渴者从生命的泉源得饮，并引领我走在生命的道路上！
    - type: paragraph
      text:
        ru: Как Владыка, раба Своего исхити из плена, чтоб стал я свободен от рабства страстям бесчестным, коими опутано сердце мое!
        cn: 主宰啊，求您将您的仆人从桎梏中救拔出来，使我能摆脱那可耻情欲的奴役，重获自由，因我的心已被它们缠绕不休！
    - type: paragraph
      text:
        ru: Да предварят меня щедроты Твои, Господи, прежде нежели повлечен буду во ад вместе с делающими беззаконие!
        cn: 愿您的丰盛怜悯先临到我，主啊，在我与作恶之人一同被拖入地狱之前！
    - type: paragraph
      text:
        ru: Тогда въявь придет всё, что я делаю теперь во тьме. Увы, какой стыд обымет меня, когда увидят меня осужденным думающие теперь, что я неукоризнен, тогда как, оставя духовное делание, я, бедный, работаю страстям!
        cn: 那时，我现在在黑暗中所做的一切都将显露出来。唉，当那些现在认为我无可指责的人，看到我被定罪时，我将被何等羞愧笼罩！而实际上，我这可怜人，放弃了属灵的操练，却在为情欲效劳！
    - type: paragraph
      text:
        ru: Увы, душа моя, зачем у тебя умное солнце омрачается мглой страстей? И для чего эта мгла не исчезает при появлении лучей света? Для чего дозволяешь страстям влечь тебя к земле и вместо свободы избрала ты узы?
        cn: 呜呼，我的灵魂啊，为何你理智之日竟被诸般情欲的迷雾所遮蔽？又为何这迷雾在光之射线出现时仍不消散？为何你容许诸般情欲将你牵引向大地，并舍弃自由而选择了枷锁？
    - type: paragraph
      text:
        ru: Боготканую одежду соделала ты негодной для употребления и недостойной царского брака, добровольно отдала себя грехам, поработилась врагу жизни.
        cn: 你已使神织的衣裳不合用，且不配君王的婚筵，你甘心把自己交给了罪，沦为生命的仇敌的奴隶。
    - type: paragraph
      text:
        ru: Что скажешь Судии в тот страшный и трепетный день? Прииди же в себя, пока есть еще время. Пока ты еще госпожа помыслов, пока еще в действии ум твой и тело в движении, пока еще благодать может касаться сердца твоего и ты можешь излить очистительные слезы, восстань мужественно против страстей и с Божией помощью доблестно сразись с Голиафом.
        cn: 在那个可怕而战兢的日子里，你将对审判者说什么呢？那么，趁着还有时间，清醒过来吧。趁着你仍能主宰你的思虑，趁着你的心智仍在运作、身体仍在活动，趁着恩典仍能触及你的心，并且你还能倾泻出洁净的泪水，勇敢地起来对抗情欲，并借着上帝的帮助，英勇地与哥利亚作战吧。
    - type: paragraph
      text:
        ru: Спеши и не дай предупредить тебя какому-либо разбойнику, или предвосхитить вход какой-либо блуднице, или заградить дверь кому-либо из восхищающих Царствие Божие силой.
        cn: 赶紧，不要让任何强盗抢先于你，也不要让任何娼妓抢先进入，更不要让那些强力夺取上帝的国的人堵住门。
    - type: paragraph
      text:
        ru: Спеши, ибо когда кончится ристалище, неуместно уже искать состязаний, когда прекратится торг, неуместно искать купли и когда запечатлеются дела, неуместно искать деятельности.
        cn: '务要速速，因当竞技之期终结，再觅争竞已然不当；

          当市集停歇，再觅买卖已然不当；

          以及当行为盖印，再觅作为已然不当。'
    - type: paragraph
      text:
        ru: Пока есть время, спеши вступить в брань, чтоб, преодолев врагов, явиться достойной принять венцы.
        cn: 趁着还有时间，赶紧投入争战，以便战胜仇敌，配得领受冠冕。
  - type: heading2
    text:
      ru: Блаженство помилования
      cn: 怜悯的至福
    children:
    - type: paragraph
      text:
        ru: Блажен, кого по любви Своей вразумляешь Ты, Господи, потому что не отвращаешься от тех, кого любишь. Не отвратись и от меня, Господи, чтоб не погубил меня лукавый. По благости Твоей пощади меня, немощного, и удостой меня прощения многих грехов моих, чтобы со всеми благоугодившими Тебе прославил и я благость Твою.
        cn: 主啊，蒙福啊，那被祢因爱而训诲的人，因为祢不转离祢所爱的人。主啊，也不要转离我，免得那恶者败坏我。凭着祢的恩慈怜悯我这软弱的，并使我配得我众多罪过的赦免，好使我能与所有蒙祢喜悦的人一同颂扬祢的恩慈。
    - type: paragraph
      text:
        ru: Пощади, Господи, по благости Твоей и помилуй всех нас, отринутых правдой Твоей за то, что не соблюдали слова Твоего, соблюдя которое получили бы спасение.
        cn: 主啊，凭着您的恩慈赦免并怜悯我们所有人，我们因没有遵守您的圣言，而被您的公义所弃绝，倘若遵守了它，就能获得救赎。
    - type: paragraph
      text:
        ru: И я отвержен со всеми такими, даже более всех их. Итак, соделай меня достойным по благости Твоей получить прощение грехов, а по силе сего прощения и упование спасения.
        cn: 我与所有这样的人一同被弃绝，甚至比他们所有人都更甚。因此，求你凭着你的恩慈，使我配得领受罪的赦免；并凭着这赦免的力量，也使我配得救恩的盼望。
    - type: paragraph
      text:
        ru: 'С любовью всякий день поучался я слову Твоему. Удостой меня вместе с праведными возглашать и славословие сие: «Хвала Помиловавшему меня! Слава Простившему мне!»'
        cn: 我天天以爱心默想祢的圣言。求祢赐我恩典，使我能与义人一同颂扬这颂赞：「赞美那怜悯我者！荣耀归于那赦免我者！」
    - type: paragraph
      text:
        ru: Тебя благословляет высота, Тебя величает глубина, Тебе поклоняются всяческая, потому что всё сотворено Тобой. Всё песнословит Тебя, милосердый Господи!
        cn: 高天称颂你，深渊尊崇你，万有都向你敬拜，因为万物皆由你所造。万物歌颂你，慈悲的主啊！
  - type: heading2
    text:
      ru: Упование помилования
      cn: 怜悯的盼望
    children:
    - type: paragraph
      text:
        ru: Помилуй мя, Боже, по велицей милости Твоей и по множеству щедрот Твоих очисти беззаконие мое! Ибо если помилуешь меня, освободив от жалкого недуга страстей, – если только помилуешь меня, то желаю быть послушным Твоей благости.
        cn: 上帝啊，求你照你的丰盛怜悯我，按你浩瀚的慈爱涂抹我的过犯！因为如果你怜悯我，使我脱离可怜的情欲病症——如果你果真怜悯我，那么我渴望顺服你的良善。
    - type: paragraph
      text:
        ru: Если сотворишь по множеству благости Твоей, то избавишь меня. Если излиешь на меня благость Свою, то спасусь.
        cn: 如果祢照着祢丰盛的恩慈而行，祢必拯救我。如果祢将祢的恩慈倾注在我身上，我必得救。
    - type: paragraph
      text:
        ru: Уверен я, что сие возможно Тебе. Знаю, что Ты помиловал и помилуешь всех обращающихся к Тебе всей крепостью своей.
        cn: 我确信，这事您能做到。我知道，您已经怜悯并将怜悯所有全心全意归向您的人。
    - type: paragraph
      text:
        ru: Исповедаю, что и я многократно пользовался благодатью Твоей, но после, отринув благодать Твою, грешил, как не грешил никто другой.
        cn: 我承认，我也多次蒙受了祢的恩典，但之后，我弃绝了祢的恩典，犯了仿佛无人能及的罪。
    - type: paragraph
      text:
        ru: Но Ты, воскрешавший мертвых, восставь и меня, умерщвленного грехом! Ты, исцелявший слепых, просвети омраченные очи сердца моего! Ты, избавивший Адама из уст змиевых, извлеки меня из тины беззаконий моих, потому что и я принадлежу к числу овец Твоих и по своим хотениям стал пищей львов!
        cn: 但祢，那使死人复活的，也请使这被罪恶致死的我复活！祢，那医治瞎子的，求祢光照我蒙蔽的心眼！祢，那将亚当从蛇口中拯救出来的，求祢将我从我罪孽的泥淖中拉出，因为我也属于祢的羊群，却因我自己的私欲，成了狮子的食物！
    - type: paragraph
      text:
        ru: Грехи сделали меня псом, но, исцеленный благодатью Твоей, буду сыном. Брошен был я, как мертвец, но, если восхощешь, оживлен буду.
        cn: 罪恶使我沦为犬类，但靠着你的恩典蒙受医治，我将成为你的儿子。我曾被抛弃，如同死尸，但若你意愿，我将得以复生。
    - type: paragraph
      text:
        ru: Знаю, что грешил я с ведением, но имею за себя молитвенниками святых Твоих. Знаю, что превосхожу всякую меру грехами своими, но благость Твоя непреодолима.
        cn: 我知道我明知而犯了罪，但我有你的圣者作我的代祷者。我知道我的罪过已超越一切限度，但你的美善是不可战胜的。
    - type: paragraph
      text:
        ru: Ты, давший преимущество мытарю, дай оное и мне, который (сознаюсь) еще более делал худого. Ты, Господи, помиловал Закхея как достойного, меня же помилуй и недостойного!
        cn: 你，曾赐予税吏恩典，也请赐予我这（我承认）做了更多恶事的人。你，主啊，怜悯了撒该，将他视为配得之人；而我虽不配，也求你怜悯！
    - type: paragraph
      text:
        ru: Волком был некогда Павел и гнал овец стада Твоего, по благости же Твоей стал он пастырем, усердно ходившим за овцами.
        cn: 保罗曾是狼，迫害祢的羊群，但凭着祢的恩慈，他成了牧者，尽心牧养羊群。
    - type: paragraph
      text:
        ru: Знаю, что по неведению сделал он грех и как неведавший сподобился отпущения грехов и вящей благодати. Но Ты, Господи, осудив мой в ведении учиненный грех, помилуй меня по преизбыточествующей благодати Твоей!
        cn: 我知道他因着无知犯了罪，并且因着无知，蒙得了罪的赦免和更大的恩典。但你啊，主，鉴察了我明知所犯的罪，求你照着你极其丰盛的恩典怜悯我！
  - type: heading2
    text:
      ru: Уроки жизни. Блаженства
      cn: 生命的教训。真福八端
    children:
    - type: paragraph
      text:
        ru: Блажен, кто, просветив сердечные очи, всегда, как в зеркале, видит в себе Господа – таковой получит облегчение от страстей и от лукавых помыслов.
        cn: 有福了，那使心眼得蒙光照，总是在自己里面如同在镜中般看见主的人——这样的人将从情欲和邪恶的意念中得到解脱。
    - type: paragraph
      text:
        ru: Блажен, кто любит прекрасные, добрые речи, ненавидит же слова срамные и тлетворные, потому что не попадется он в плен лукавому.
        cn: 有福了，那爱慕美好良善言语，而憎恨羞耻败坏言语的人，因为他不会被恶者俘掳。
    - type: paragraph
      text:
        ru: Блажен, кто назидает ближнего страхом Божиим и не обольщает души своей, ежечасно боясь железного жезла Великого Пастыря.
        cn: 蒙福的，是那借着敬畏上帝教导邻舍，并且不欺骗自己的灵魂，每时每刻都惧怕着大牧者的铁杖的人。
    - type: paragraph
      text:
        ru: Блажен, кто послушен ближнему по Богу и терпит скорби с благодарением, ибо таковой будет увенчан, став исповедником о Господе.
        cn: 蒙福的，是那顺服出于上帝的近人，并以感恩的心忍受苦难的人，因为这样的人必得冠冕，成为为主的认信者。
    - type: paragraph
      text:
        ru: Блажен, кто любит воздержание по Богу и за чрево свое не подвергается осуждению как сластолюбец и нечистый, ибо таковой возвеличен будет о Господе.
        cn: 蒙福的，是那按着上帝的心意喜爱节制的人，他的口腹不使他被定罪为贪图享乐者和不洁净之人，因为这样的人将在主里被高举。
    - type: paragraph
      text:
        ru: Блажен, кто не упивается вином, но всегда увеселяется памятованием о Господе, Которым непрестанно увеселяются все святые.
        cn: 有福啊，那不沉湎于酒，却常常因记念主而喜乐的人；众圣徒也因祂不住地喜乐。
    - type: paragraph
      text:
        ru: Блажен, кто по Богу распоряжается своим имением и не подлежит осуждению от Бога Спасителя как сребролюбец и немилосердный к ближнему.
        cn: 蒙福的，是那按着上帝的心意管理自己财产，且不被救主上帝定罪为贪爱钱财、对邻人不施怜悯的人。
    - type: paragraph
      text:
        ru: 'Блажен, кто бодрствует в молитвах, чтении и добрых делах: он просветится и не уснет в смерть.'
        cn: 有福的，是那在祷告、阅读和善行中儆醒的人：他将蒙光照，不致在死亡中睡去。
    - type: paragraph
      text:
        ru: 'Блажен, кто стал прекрасной духовной мрежей и многих уловил Благому Владыке: он весьма будет восхвален о Господе.'
        cn: 有福了，凡成为优美属灵之网，并为美善的主捕获了许多人者：他必在主里大受称赞。
    - type: paragraph
      text:
        ru: 'Блажен, кто стал прекрасным образцом для ближнего и не уязвил совести подобного себе раба делами непотребными: он будет благословляем о Господе.'
        cn: 有福了，那成为邻人美好榜样，并且没有以不端的行为刺伤与自己同为仆人的良心的人：他将蒙主的祝福。
- type: heading1
  text:
    ru: Отделение восьмое
    cn: 第八部分
  children:
  - type: heading2
    text:
      ru: Жалоба на врага. Молитва об избавлении от него и пощаде на Суде ради искупления
      cn: 控诉仇敌。求蒙拯救脱离仇敌，以及在审判时因着救赎之功得蒙怜悯的祷告。
    children:
    - type: paragraph
      text:
        ru: О Судия, Которого суд праведен и Которому ведомо всё сокровенное, не осуди меня на праведном Суде Твоем, когда обнаружены будут все тайны!
        cn: 哦，审判者啊，您的审判公义，且您洞悉一切隐秘。在您公义的审判中，当一切隐秘显露之时，求您不要定我的罪！
    - type: paragraph
      text:
        ru: Грешница слезами, какие принесла Тебе, уничтожила рукописание долгов своих. Вот и я приношу в дар Тебе слезы. Приими их и от меня, Господи, как принял от нее.
        cn: '那罪妇以她献给您的眼泪，抹去了她罪债的记录。

          看哪，如今我也向您献上眼泪。

          主啊，求您也从我这里接纳它们，正如您接纳了她的一样。'
    - type: paragraph
      text:
        ru: Лукавый обманул меня своими ласкательствами и пленил ум мой своими обольщениями. Отжени его, Господи наш, от меня, бедного, исхить из руки его, чтобы не растерзал меня!
        cn: 那恶者用他的甜言蜜语欺骗了我，又以他的诱惑俘虏了我的心智。我们的主啊，求祢将他从我这可怜的人身上驱逐，将我从他手中抢救出来，免得他将我撕裂！
    - type: paragraph
      text:
        ru: Суди меня, Господи, и рассуди прю мою с немилосердным врагом. Он поставил меня целью для стрел своих. По щедротам Твоим да пронзят его самого стрелы сии!
        cn: 主啊，求你审判我，并裁决我与无怜悯之仇敌的争讼。他使我成为他箭矢的目标。愿这些箭矢照着你的丰盛恩慈，刺透他自己！
    - type: paragraph
      text:
        ru: Будь Помощником мне, бедному, Господи, потому что нет у меня иного помощника, и не попусти врагу посмеяться надо мною, побежденным, как посмеялся он над нашей праматерью.
        cn: 主啊，求祢成为我这贫乏之人的帮助者，因为我别无其他帮助者，也不要容许仇敌嘲笑我这被击败者，如同他曾嘲笑我们的始祖母一样。
    - type: paragraph
      text:
        ru: Горе мне, если все тайны мои будут открыты и подвергнуты испытанию там, где не уважится никакое оправдание! Содрогается дух мой, Господи, ибо слышу, что нечестивых огнь искусит, а я – сено и солома. И если Ты, Господи, воззришь на вины мои, то я погиб.
        cn: 我真有祸了，如果我所有的隐秘都被揭露，并受审验，在那里，任何辩解都得不到尊重！主啊，我的灵战栗不安，因为我听见不虔敬之人必受火焰的试炼，而我——却是干草和禾秸。倘若祢，主啊，审视我的罪过，那么我必灭亡。
    - type: paragraph
      text:
        ru: Благость Твоя, Господи, которая некогда вознесла Тебя на Крест для искупления рода нашего, – она у Тебя да предварит меня, бедного, чтобы сподобиться мне оставлению грехов моих.
        cn: 主啊，你的良善，曾将你高举于十字架，为要救赎我族人类——愿这良善从你那里临到我这贫乏之人，使我得蒙赦免我的罪孽。
    - type: paragraph
      text:
        ru: Ты, Иисусе, искупивший всех Своей кровью и смертью Своею связавший крепкого, сними с меня путы лукавого, сокруши оковы и узы его.
        cn: 祢，耶稣啊，祢以宝血救赎了众人，又以祢的死亡捆绑了那壮士，求祢除去那恶者在我身上的桎梏，打碎他的锁链和束缚。
    - type: paragraph
      text:
        ru: Запрети ему, чтоб удалился он от меня, бедного, и не исполнял на мне воли своей. Согласи волю мою с Твоей волей, Господи, милосердием Своим изглаждающий грехи мои.
        cn: 禁止他，使他远离我这贫乏的人，不再将他的意愿实现在我身上。主啊，祢以祢的慈悲涂抹我的罪恶，求祢使我的意愿与祢的意愿相符。
    - type: paragraph
      text:
        ru: Не оставь меня в руках ненавистника и не давай ему власти надо мной, потому что Плоть и Кровь Свою уготовал Ты в снедь мне и крест Твой напечатлен на челе моем.
        cn: 不要将我撇在仇敌手中，也不要给他权柄辖制我，因为你已为我预备了你的圣体与宝血作我的食粮，你的十字架也印刻在我的额上。
    - type: paragraph
      text:
        ru: Подкрепи меня, Господи, потому что я немощен, загладь вины мои, потому что много согрешил я, уцеломудри чувства мои, чтоб с покорностью держались они царского пути.
        cn: 主啊，扶持我，因为我软弱；涂抹我的罪孽，因为我多有罪愆；使我的情感纯洁，好使它们顺服地持守王道。
    - type: paragraph
      text:
        ru: Да воссияет свет Твой в помыслах моих, да просветятся они лучами Твоими и величественное сияние Твое да возвеселит их, потому что Ты – Всеозаряющее Солнце. Иссопом Твоим очисти скверны наши, Кровью Твоей омой язвы наши, Телом Твоим освяти сокровенные движения помыслов наших!
        cn: 愿你的光在我的意念中照耀，愿它们蒙你的光芒所照亮，愿你那威严的荣光使它们充满喜乐，因为你是普照一切的太阳。愿你用你的牛膝草洁净我们的污秽，用你的宝血洗净我们的创伤，愿你用你的圣体圣化我们意念深处的动向！
    - type: paragraph
      text:
        ru: Слава и слава Тебе, искупившему погибший человеческий род, подъявшему его на рамена Свои и принесшему в дом Отца Твоего!
        cn: 荣耀归祢，荣耀归祢！祢救赎了失丧的人类，将其举在祢的肩上，并带入祢父的家中！
  - type: heading2
    text:
      ru: Плач об оскудении святых
      cn: 圣徒衰微的悲叹
    children:
    - type: paragraph
      text:
        ru: Сердце мое болит, страждет душа моя, и внутренности мои раздираются! Где взять мне слез, где взять сокрушения и воздыханий, чтоб достойно оплакать осиротение наше и оскудение святости среди нас?
        cn: 我的心在痛，我的灵魂在受苦，我的五内俱裂！我从何处得来眼泪，从何处得来忧伤痛悔和叹息，好叫我能配得哀悼我们的孤寂无依，以及我们中间圣洁的匮乏？
    - type: paragraph
      text:
        ru: Вижу, Владыко, что святых Своих, как избранное золото, берешь Ты из суетного мира сего в упокоение жизни.
        cn: 我看见，吾主啊，您将您的圣徒，如同精选的黄金一般，从这虚妄的世界取走，进入生命的安息。
    - type: paragraph
      text:
        ru: Как земледелец, видя плоды хорошо созревшими, с предусмотрительностью поспешает собирать их, чтобы не потерпели они повреждения от чего-нибудь, – так и Ты, Спаситель, собираешь избранных, трудящихся праведно.
        cn: 就像农夫，看到果实丰熟，便带着审慎赶忙收聚它们，以免它们遭受任何损害——照样，你，救主啊，也收聚那些行义劳作的选民。
    - type: paragraph
      text:
        ru: А мы, ленивые, слабые произволением, пребываем в ожесточении своем, и плод наш остается всегда незрелым, потому что нет у нас решимости потрудиться, не жалея себя, чтоб созреть в добрых делах и праведно быть собранными в житницу жизни.
        cn: 而我们，这些懒惰、意志薄弱的人，持续处于我们自己的刚硬之中，并且我们的果实始终是不成熟的，因为我们没有决心去辛劳、不顾惜自己，以便在善行中成熟，并公义地被聚集到生命的粮仓里。
    - type: paragraph
      text:
        ru: «Увы мне, увы!» – скажи, душа, и плачь, лишившись так скоро совершенных отцов и праведных подвижников! Где у нас отцы? Где святые? Где бденники? Где трезвенники? Где смиренные? Где кроткие? Где безмолвники? Где воздержники? Где сокрушенные сердцем, которые в чистой молитве стояли пред Господом, как Ангелы Божии? Переселились отсюда к Святому Богу, имея светильники свои горящими.
        cn: '«唉，我何其不幸！唉，我何其不幸！» 我的灵魂啊，你当如此呼喊并哭泣，因你如此快地失去了那些完善的教父和公义的苦修者！

          我们的教父在哪里？圣徒在哪里？彻夜守望者在哪里？警醒自持者在哪里？谦卑者在哪里？温良者在哪里？寂静修行者在哪里？节制者在哪里？那些心灵破碎者在哪里？他们曾在洁净的祷告中，如同上帝的天使一样侍立在主面前，他们又在哪里呢？

          他们已从此处迁往圣洁的上帝那里，他们的灯盏依然燃着。'
    - type: paragraph
      text:
        ru: Горе нам! В какие живем мы времена? В какую пучину зол зашли мы? Отцы наши вошли в пристань жизни, чтоб не видеть им скорби и соблазнов, постигающих нас за грехи наши. Они венчаются, а мы дремлем, спим и предаемся самоугодию.
        cn: 祸哉我们！我们生活在怎样的时代？我们已堕入何等的罪恶深渊？我们的父辈已进入生命的港湾，以免他们看到因我们的罪而临到我们身上的悲伤和诱惑。他们受加冕，而我们却昏昏欲睡，沉睡不醒，并沉溺于自我放纵。
    - type: paragraph
      text:
        ru: О Господи, сжалься над нами! Отрезви мысли наши, кружащиеся в суете! Даруй нам сокрушение и слезы, чтобы ими несколько просветлилась слепота сердца нашего и мы могли узреть путь, которым шли вслед Тебя отцы наши! Даруй нам желание и силу идти сим же путем, чтобы вместе с ними получить нам и часть спасаемых во славу имени Твоего.
        cn: '哦，主啊，怜悯我们！

          使我们那在虚妄中盘旋的心思清醒吧！

          赐给我们痛悔与泪水，好叫借着它们，我们心中的昏蒙稍得光照，使我们得以洞察那我们的列祖追随祢而行的道路！

          赐给我们意愿与能力行走这同一条道路，为要叫我们能与他们一同，得享蒙救赎者的份额，归于祢名的荣耀。'
  - type: heading2
    text:
      ru: Дни проходят. Не отлагай покаяния
      cn: 岁月流逝。不要延宕悔改。
    children:
    - type: paragraph
      text:
        ru: Любовь побуждает меня вещать к Богу, а недостоинство мое заставляет меня молчать. Мучительные болезни душевные вынуждают меня говорить, а грехи заставляют хранить молчание. Душа моя болезнует, глаза мои вожделевают слез.
        cn: '爱促使我向上帝倾诉，而我的不配感却迫使我沉默。

          痛苦的灵魂疾病强迫我言说，而我的罪过却使得我保持静默。

          我的灵魂在痛苦，我的眼睛渴求眼泪。'
    - type: paragraph
      text:
        ru: Согрешила ты, душа, покайся. Ибо вот дни наши проходят, как тень. По страшным и ужасным пойдем мы местам. Не откладывай же день за днем обращения своего ко Господу, приди наконец в сокрушение, душа моя.
        cn: '灵魂啊，你犯了罪，当悔改。

          因为看哪，我们的日子如影消逝。

          我们将去往可怖而骇人的地方。

          不要日复一日地推迟你归向主的转变，

          我的灵魂啊，最终达至忧伤痛悔吧。'
    - type: paragraph
      text:
        ru: Приди в сокрушение при мысли о всех благах, которые получила ты от Господа и не сохранила, приди в сокрушение при мысли о том, что сделала ты и как Бог был долготерпелив к тебе, приди в сокрушение, чтоб на Страшном Суде Христовом не предали тебя кромешной тьме.
        cn: 当你思及你从主领受却未能保守的一切恩惠时，进入痛悔吧；当你思及你所行的以及上帝对你何等恒忍时，进入痛悔吧；进入痛悔吧，以免在基督可畏的审判台前，你被投入到漆黑的幽暗中。
    - type: paragraph
      text:
        ru: Горе мне грешному! Ибо по слабости своей осквернил я и всегда скверню чистоту сердца своего. Нерадение и леность посрамили дерзновение сердца моего, лукавое вожделение повелевает мною, как властелин рабом, и я, как ребенок, тотчас со страхом повинуюсь ему. Оно вводит меня в прегрешения, и я услаждаюсь тем.
        cn: 祸哉我这罪人！因为我因自身的软弱，玷污了我心的纯洁，并总是在玷污。懈怠和懒惰羞辱了我心的坦然无惧，邪恶的欲望吩咐我，如同主宰对待奴隶，我就如同孩童，立刻恐惧地顺服它。它引我陷入过犯，我却以此为乐。
    - type: paragraph
      text:
        ru: Увы мне, Господи! Благодать Твоя влечет меня к жизни, а я предпочитаю скорее смерть. Ты прилагаешь попечение о том, чтобы я стал равночестен Ангелам, а я по испорченности своей унижаю сам себя. Умножились грехи мои, Господи, и непрестанно умножаются, и нет предела их множеству.
        cn: 我苦啊，主啊！你的恩典牵引我归向生命，而我却宁可选择死亡。你悉心照料，使我与天使同等尊荣，而我却因着我的败坏贬低自己。我的罪恶增多了，主啊，并且不停地增多，并且它们的数量没有止境。
    - type: paragraph
      text:
        ru: И кто оплачет меня или умолит за меня? Ты Сам, Спаситель мой, преклоняемый на милость благостью Твоей, милосердо воззри на меня, отчаянного! Ибо как стану умолять Тебя, Владыко, когда уста мои исполнены злословия? Или как буду песнословить Тебя, когда совесть моя осквернена? Или как возлюблю Тебя, когда полон я страстей? Или как будет обитать во мне истина, когда поругал я себя ложью? Или как призову Тебя, когда не сохранил я заповедей Твоих?
        cn: 而有谁会为我哀哭，或为我恳求呢？唯有祢自己，我的救主啊，祢以祢的良善俯就施怜悯，求祢怜悯地垂顾我这绝望之人吧！因为，主宰啊，当我的口充满恶言时，我怎能恳求祢呢？或是我怎能歌颂祢呢，当我的良心已被玷污时呢？或是我怎能爱祢呢，当我充满情欲时呢？或真理怎能住在我里面呢，当我以虚谎玷污了自己时呢？或是我怎能呼求祢呢，当我没有遵守祢的诫命时呢？
  - type: heading2
    text:
      ru: Образец самоиспытания и самоукорения
      cn: 自我省察与自我责备的范本
    children:
    - type: paragraph
      text:
        ru: После того как уже приобрел я познание истины, стал я убийцей и обидчиком, ссорюсь из-за малости, стал завистлив и жесток к живущим со мной, немилостив к нищим, гневлив, спорлив, упорен, ленив, раздражителен, питаю злые мысли, люблю нарядные одежды, и доныне еще очень много во мне скверных помыслов, вспышек самолюбия, чревоугодия, сластолюбия, тщеславия, гордыни, зложелательства, пересудов, тайноядения, уныния, соперничества, негодования. Не значу ничего, а думаю о себе много, непрестанно лгу – и гневаюсь на лжецов, оскверняю свой храм (тело) блудными помыслами – и строго сужу блудников, осуждаю падающих, а сам непрестанно падаю, осуждаю злоречивых и татей, а сам и тать, и злоречив. Хожу с светлым взором, хотя весь нечист.
        cn: 在我已然认识真理之后，我成了杀人者和冒犯者，为琐事争吵，对与我同住的人变得嫉妒和残酷，对贫者毫无怜悯，易怒、好争、顽固、懒惰、烦躁，心存恶念，喜爱华丽衣裳；至今在我里面仍有许多污秽思想、自爱冲动、饕餮、淫欲、虚荣、骄傲、恶意、搬弄是非、暗中偷食、沮丧、争竞和愤恨。我微不足道，却自视甚高，不住地撒谎，却又向撒谎者发怒；我用淫秽思想玷污自己的殿（身体），却严厉论断行淫者；我论断跌倒的人，自己却不住地跌倒；我论断好说人坏话者和盗贼，自己却既是盗贼，又好说人坏话。我带着明亮的目光行走，然而浑身不洁。
    - type: paragraph
      text:
        ru: В церквах и за трапезами хочу быть на первом месте. Вижу иноков и величаюсь, вижу монахов и кичусь. Домогаюсь того, чтоб казаться приятным для женщин, величавым для чужих, смышленым и благоразумным для своих, совершеннейшим для благоразумных, с благочестивыми обхожусь как мудрейший, неразумных презираю как бессловесных.
        cn: 在教堂里和在宴席上，我想要居首位。我看见隐修士就自高自大，我看见修士就自夸。我追求在女人面前显得讨人喜欢，在外人面前显得高傲自大，在自己人面前显得机敏和明智，在明智的人面前显得最完美；我对待虔敬的人如同最智慧的，我鄙视不明智的人如同无言的畜类。
    - type: paragraph
      text:
        ru: Если оскорблен, мщу, если почтен, гнушаюсь почтившим, если требуют чего от меня по праву, начинаю тяжбу, а тех, кто говорит мне правду, почитаю врагами. Обличаемый, гневаюсь, но если льстят мне, не совсем недоволен.
        cn: 如果受辱，我就报复；如果受敬重，我就鄙视那敬重我的人；如果有人依权利向我要求什么，我就兴讼；而那些对我说真话的人，我就视他们为仇敌。当我被指摘时，我就发怒；但如果奉承我，我就并非完全不悦。
    - type: paragraph
      text:
        ru: Не хочу почтить достойного, а сам, будучи недостоин, требую почестей. Не хочу утруждать себя, а если кто мне не услужит, гневаюсь на него. Не хочу идти вместе с работающими, а если кто мне не поможет в деле, злословлю его.
        cn: 我不愿尊荣配得之人，而我自己不配，却要求受尊荣。我不愿劳累自己，而如果有人不为我服务，我就向他发怒。我不愿与劳作之人一同，而若有人不在事务上帮助我，我就诋毁他。
    - type: paragraph
      text:
        ru: Брату, когда он в нужде, горделиво отказываю, а когда сам нуждаюсь, обращаюсь к нему. Ненавижу больного, а когда сам болен, желаю, чтобы все любили меня. Высших знать не хочу, низших презираю.
        cn: 对弟兄，当他有需要时，我傲慢地拒绝；但当我自身有需要时，我转向他。我憎恨生病的人；但当我自身生病时，我希望所有人爱我。我不想认识地位较高的人，我鄙视地位较低的人。
    - type: paragraph
      text:
        ru: Если удержу себя от неразумного пожелания, тщеславлюсь, если преуспеваю в бдении, впадаю в сети непокорности и прекословия, если воздержусь от снедей, утопаю в кичливости и высокомерии, если неусыпен в молитве, препобеждаюсь раздражительностью и гневом, если вижу в ком добродетель, не останавливаюсь на нем вниманием.
        cn: 如果我克制自己不生不理智的愿望，就会心生虚荣；如果我在警醒中有所成就，就会落入不顺服和顶撞的网罗；如果我克制饮食，就会沉溺于自大和狂妄；如果我祷告不倦，就会被易怒和愤怒胜过；如果我在某人身上看到美德，却不把注意力停留其上。
    - type: paragraph
      text:
        ru: Презрел я мирские приятности, но не отстаю от суетного пожелания оных. Если вижу женщину, развеселяюсь. По наружности смиренномудрствую, а в душе высокоумствую, по видимому нестяжателен, а на самом деле страдаю любоиманием. И к чему распространяться? По видимости отрекся я от мира, а на деле опять все думаю о мирском.
        cn: 我藐视了世俗的享乐，但未能摆脱对它们的虚妄渴望。如果我看到女人，就心生欢愉。在外表上我表现出谦卑，但在内心深处我却心存高傲；表面上我似乎不置产业，而实际上我却为爱财所苦。何必多言呢？表面上我已弃绝世界，而实际上我却仍然心系世俗。
    - type: paragraph
      text:
        ru: Во время службы занимаюсь все разговорами, блужданием помыслов, суетными припоминаниями. Во время трапезы вдаюсь в пустословие; имею алчность к подаркам, принимаю участие в чужих падениях, вдаюсь в гибельное соперничество.
        cn: 在侍奉中，我总是交谈、意念游荡、徒然回忆。在用餐时，我多说空话；我贪恋礼物，参与他人的过犯，陷入败坏的争竞。
    - type: paragraph
      text:
        ru: Такова моя жизнь! Столько худого противополагаю я своему спасению! И мое высокомерие, мое тщеславие не дозволяют мне подумать о своих язвах, чтоб уврачевать себя. Вот мои доблестные подвиги! Таким множеством грехов ополчается на меня враг! И при всем том я домогаюсь прославиться святостью, окаянный! Живу во грехах, а желаю, чтоб почитали меня праведником!
        cn: 我的生活就是如此！我以如此多的恶事抵触我的救恩！而我的傲慢，我的虚荣，不允许我去思量自己的疮疤，以便医治自己。这就是我英勇的功绩！仇敌以如此众多的罪恶攻击我！尽管如此，我这可怜虫，竟还奢求以圣洁得享荣光！我活在罪中，却渴望人们尊我为义人！
    - type: paragraph
      text:
        ru: 'Одно у меня оправдание во всем этом: диавол опутал. Но это не послужило в оправдание Адаму. Конечно, и Каина научил диавол, но и он не избежал осуждения. Что же буду делать, если посетит меня Господь? Никакого нет у меня оправдания в нерадении моем.'
        cn: 我对此只有一个辩解：是魔鬼缠住了我。但这并没有成为亚当的辩解。当然，魔鬼也教唆了该隐，但他也没有逃脱谴责。那么，如果主临到我，我该怎么办？对于我的懈怠，我没有任何辩解。
    - type: paragraph
      text:
        ru: Боюсь, чтобы и мне не быть в числе тех, которых Павел наименовал сосудами гнева, которые подвергнутся подобной с диаволом участи и которых Бог за пренебрежение их к Нему предал в страсти бесчестия (см.:Рим. 9:22;Рим. 1:26)! Итак, опасно, чтоб и на меня не было произнесено такое же определение.
        cn: 我害怕自己也会成为那些人中的一员，就是保罗所称的「盛怒之器」，他们将遭受与魔鬼相似的命运；也是那些因藐视上帝，而被上帝任凭陷入可耻情欲的人（参：罗马书 9:22，罗马书 1:26）！因此，危险在于，同样的判决也可能降临到我身上。
    - type: paragraph
      text:
        ru: Если хочешь спасти меня, недостойного, милостивый Господи, положи покаяние мне грешному, оживотвори умерщвленную грехами душу мою, Жизнодатель! Изгони каменное ожестение из бедного сердца моего и даруй мне источник сокрушения, Источивший нам жизнь из животочного ребра Своего!
        cn: '如果祢愿意拯救我这不配之人，慈悲的主啊，

          求祢赐给我这罪人悔改之心；

          生命的赐予者啊，求祢使我这被罪恶致死的灵魂复苏！

          求祢将我这可怜心中刚硬如石的心驱逐出去，

          并赐给我痛悔的泉源，

          祢就是那位从自己赐生命的肋旁为我们涌流出生命的主啊！'
  - type: heading2
    text:
      ru: Диавол в нерадивых успевает, а радивым венцы уготовляет
      cn: 魔鬼在怠惰的人身上得逞，却为殷勤的人预备冠冕。
    children:
    - type: paragraph
      text:
        ru: 'Лукавый диавол после решительной над ним победы, одержанной по благодати Божией святыми подвижниками, сев, сам на себя жаловался с плачем и говорил: «Увы мне, бедному! Чему я подвергся? Как проиграл битву, уступив над собой победу? Впрочем, сам я стал виновником своего стыда, надолго завязав с ними борьбу.'
        cn: 狡猾的魔鬼在被圣洁的苦行修士们借着上帝的恩典彻底击败之后，坐下，哭泣着抱怨自己，并说：「唉，我这可怜虫！我竟遭遇了什么？我怎会输掉这场战役，拱手让出胜利？然而，我正是自己蒙羞的罪魁祸首，因为我与他们缠斗太久了。」
    - type: paragraph
      text:
        ru: Побежденному на первом и втором сражении, надлежало бы мне тотчас удалиться, видя, что с ними Христос, а теперь, погнавшись за победой над ними, увеличил я только награду их, к бесчестию моему.
        cn: 在第一和第二次交锋中战败的我，本该即刻退离，因见基督与他们同在；而今，我却在追逐战胜他们的过程中，徒增了他们的奖赏，反倒使我蒙受耻辱。
    - type: paragraph
      text:
        ru: Вразумиться мне надлежало уже после того, что потерпел я от Христа, после того, как Им низложена вся сила моя. Ибо всё тогда сделал я, чтобы распяли Его, но смерть Его меня же поразила.
        cn: 我本该在从基督那里所承受的一切之后就醒悟过来，本该在祂倾覆了我所有的力量之后就醒悟过来。因为那时我做了一切，为要将祂钉上十字架，但祂的死却反过来重击了我。
    - type: paragraph
      text:
        ru: То же самое потерпел я от мучеников. Я подвигнул царей, приготовил мучения, чтоб мученики, видя это, пришли в ужас и отреклись от Христа. Они же не только не ужаснулись различных казней, но до самой смерти исповедовали Христа.
        cn: 我从殉道者那里也遭受了同样的事。我煽动君王，预备酷刑，好叫殉道者看到这些后，心生恐惧，否认基督。然而他们不仅没有因各种处决而恐惧，反而至死都宣认基督。
    - type: paragraph
      text:
        ru: Так и теперь, хотев победить этих подвижников в брани, с великим стыдом отступил, побежденный. Хвалился я хитрыми замыслами, но все они разорваны, как сеть паутинная. Я хотел одолеть их различными страстями, но они обратили меня самого в бегство силой креста. И не знаю, что наконец мне делать?
        cn: 同样，现在，我想要在争战中战胜这些苦修者，却带着极大的羞辱被击败而退却了。我曾夸耀我的诡计，但它们都被撕碎了，如同蜘蛛网一般。我曾想用各种情欲来制服他们，但他们却借着十字架的力量，反过来把我驱逐逃跑。我也不知道，最终我该怎么办？
    - type: paragraph
      text:
        ru: Оставлю я этих мужественных подвижников и пойду к друзьям своим, избравшим беспечную жизнь, где не будет мне труда и не нужны никакие ухищрения.
        cn: 我将离开这些刚毅的修道士，去和那些选择了安逸生活的朋友们在一起，在那里我将不再有劳苦，也无需任何机巧。
    - type: paragraph
      text:
        ru: У них же самих взяв узы, свяжу их оными, а связав их узами, к которым они привержены, буду иметь их уже у себя под рукой как рабов, добровольно исполняющих всегда хотения мои.
        cn: 从他们自己那里取来那些羁绊，我就用这些捆绑他们；而当用他们所依恋的羁绊捆绑了他们之后，我就将他们收为己有，作为在我手下的奴仆，永远甘心乐意地遵行我的旨意。
    - type: paragraph
      text:
        ru: Так они ввергнут себя в пропасть, и я буду радоваться их погибели и держать в ней, чтоб иметь сообщников в огне неугасимом!»
        cn: 「这样他们就会将自己投入深渊，我将欣喜于他们的灭亡，并将他们困于其中，好在不灭的火中拥有同伴！」
    - type: paragraph
      text:
        ru: Итак, сами мы, неразумные, даем власть над собой врагу тем, что отделяемся от Бога отриновением Его заповедей. Застигнув нас обнаженными за то благодати, он свободно овладевает нами и без сопротивления ведет в путь свой – путь пагубы.
        cn: 因此，我们自己，这些愚昧的人，将掌管自己的权柄交给了仇敌，乃是借由背弃上帝的诫命，与祂分离。当他发现我们因此失去了恩典的遮蔽时，他就自由地占据了我们，并毫不抵抗地将我们引上他自己的道路——那毁灭之路。
    - type: paragraph
      text:
        ru: О Господи! Даруй нам убежать от лукавого, разорвав узы, которыми он связал нас по нашему произволению! Возложи на нас благое и легкое иго Твое и ниспосли силы понести его, да, шествуя благим путем заповедей Твоих, достигаем града, который уготовал Ты любящим Тебя!
        cn: 主啊！求你恩准我们逃离那恶者，挣脱他因我们随己意而捆绑我们的枷锁！将你那美善而轻省的轭加在我们身上，并赐予我们力量去承担它，好使我们，行在祢诫命的美善道路上，能抵达你为爱祢之人所预备的城！
  - type: heading2
    text:
      ru: Уроки жизни
      cn: 生命的课程
    children:
    - type: paragraph
      text:
        ru: Если еще не сильно распален ты Духом Святым, то не желай выслушивать чужие помыслы, чтобы, чрез слышанное возбудив страсти, еще не умершие, не развратить души своей.
        cn: '如果你尚未被圣灵强烈点燃，

          就不要渴望听取他人的意念，

          免得你因所听闻的，激起那些尚未死去的情欲，以致败坏自己的灵魂。'
    - type: paragraph
      text:
        ru: Если прилежишь чтению, то ищи не разительного и витиеватого, иначе бес самомнения поразит сердце твое. Но как мудрая пчела собирает с цветов мед, так и ты чрез чтение приобретай врачевство для души своей.
        cn: 如果你勤于阅读，就不要寻求震撼人心和辞藻华丽的（内容），否则，自负的魔鬼会击中你的心。但正如一只智慧的蜜蜂从花朵中采集蜂蜜，你也当通过阅读为自己的灵魂获取良药。
    - type: paragraph
      text:
        ru: Блажен, кто делами проповедует добродетель. А если говоришь свойственное добродетели, делаешь же противное ей, то сие не спасет.
        cn: 蒙福的人，是藉着行为宣扬美德的。但若你所说的合乎美德，你所做的却与美德相悖，那么这便无法救赎。
    - type: paragraph
      text:
        ru: 'Когда видишь людей, рачительных на дела нечистой любви, не дивись им, и да не обольщает тебя доброцветная кожа, которая вскоре превратится в прах, но, вздохнув в себе, воспой: «Помяни, Господи, яко персть есмы» – и по благодати Божией не будешь пленником лукавого.'
        cn: 当你见到那些热衷于不洁之爱行径的人时，不要惊奇，也不要让那很快将化为尘土的美丽皮囊诱惑你，而当你在心中叹息时，吟唱道：「主啊，求你记念，我们不过是尘土！」——你便会因着上帝的恩典，不作那恶者的俘虏。
    - type: paragraph
      text:
        ru: Усердно молись Господу, чтобы даровал тебе дух совершенного целомудрия, чтобы и в ночных мечтаниях убегать тебе козней лукавого, как бежит иной, видя, что за ним гонится зверь, или как преследуемый человек с горящим пламенником[6]перебегает из комнаты в комнату, чтобы не опалил его огонь.
        cn: 恳切地向主祷告，求他赐予你完全的贞洁之灵，好让你即便在夜间的梦境中也能逃避恶者的诡计，如同有人看见野兽在追赶他而逃跑，又如同被追赶的人拿着燃烧的火把[6]从一个房间跑到另一个房间，以免火焰灼伤他。
    - type: paragraph
      text:
        ru: Как нельзя, не трудясь, купить себе за деньги грамотности или какого искусства, так невозможно стяжать навыки в добродетелях без рачительности и усердия.
        cn: 正如一个人无法不付出劳动，仅凭金钱获得学识或任何一门技艺，同样，若没有勤勉和热忱，也无法习得德行。
    - type: paragraph
      text:
        ru: Как голова предпочтительнее для тебя всех членов тела твоего, и если занесены на тебя камень, или палка, или меч, то подставляешь прочие члены тела, только бы отвести удар от головы, зная, что без головы невозможно и жить в этой жизни, так пусть будет для тебя всего предпочтительнее вера во Святую Единосущную Троицу, потому что без сей веры невозможно никому жить истинной жизнью.
        cn: 就像头对你来说比你身体的所有肢体都更优先，并且如果石头、棍棒或剑向你袭来，你就会用身体的其他肢体去抵挡，只为了将打击从头部引开，因为你知道，没有头在此生中不可能生存；同样，对你来说，对圣而同体的三一上帝的信仰应当是最优先的，因为没有这份信仰，没有人能活出真正的生命。
    - type: paragraph
      text:
        ru: Всем сердцем своим уповай на Господа – и удобно избежишь злодейских козней, ибо Господь не оставит без призрения работающих Ему.
        cn: 你当全心信靠主，便能轻易地摆脱恶者的诡计，因为主必不使服事祂的人无人看顾。
- type: heading1
  text:
    ru: Отделение девятое
    cn: 第九部分
  children:
  - type: heading2
    text:
      ru: От лица Господа укор нерадивой душе
      cn: 从主而来，对懈怠之魂的斥责。
    children:
    - type: paragraph
      text:
        ru: 'Очами сердца своего узрел я Господа, сидящего в великой славе, и (будто слышу, что) Он сказал душе моей: «Для чего ты, душа, возгнушалась небесным своим чертогом, который исполнен светом славы? Для чего ты возгнушалась благами, какие уготовал я Тебе во свете жизни? Для чего ты сделалась Мне чуждой по непотребным делам и помыслам? Для чего ты не заботишься о том, как достойно предстать Мне в Пришествие Мое? Для чего ты не держишь светильника своего наготове в ожидании гласа: «Се Жених грядет», чтоб изыти в сретение Меня с радостью? Для чего ты не стараешься приготовить на брак приличное одеяние? Для чего не готовишь себя так, чтобы войти с радостью в святой небесный чертог? Для чего не прилепляешься ко Мне, искупившему тебя от смерти?'
        cn: '我以心眼看见主，祂坐在极大的荣耀中，（我仿佛听见）祂对我的灵魂说：


          「灵魂啊，你为何厌弃了你那充满荣耀之光的天上殿宇呢？你为何厌弃了我为你预备在生命之光中的福乐呢？你为何因着卑劣的行径和思想与我疏远了呢？你为何不关心如何在我的降临中配得体面地来到我面前呢？你为何不把你的灯预备好，等候那声音说：『看哪，新郎来了』，好出去欢喜地迎接我呢？你为何不努力为婚筵预备合宜的礼服呢？你为何不这样预备自己，以便欢喜地进入圣洁的天上殿宇呢？你为何不亲近我，我曾将你从死亡中救赎出来呢？'
    - type: paragraph
      text:
        ru: Я вошел в общение со смертью, чтобы тебя уготовить Себе в невесту. В наследие тебе приготовил Я вечное Царство. Все блага Мои тебе вручил как Царь. Для тебя и Человеком Я стал, желая искупить жизнь твою от тления. Тебе уготовал Я чертог на небесах и сделал, чтобы Ангелы руководили тебя в этот чертог и ты вошла туда с радостью.
        cn: 我进入了与死亡的相交，为要预备你作我的新妇。我为你预备了永恒的国度作为你的产业。我以君王的身份将我一切的美善交付给你。为了你，我甚至成了人，渴望救赎你的生命脱离败坏。我在天上为你预备了殿宇，并使天使引导你进入这殿宇，你便欢喜快乐地进入其中。
    - type: paragraph
      text:
        ru: А ты отвратилась от Меня, Жениха твоего, и от неизреченных благ, какие уготовал Я тебе.
        cn: 你却离弃了我，你的良人，以及我为你预备的、那无法言说的福分。
    - type: paragraph
      text:
        ru: Но кто вожделеннее Меня, всякую тварь спасающего щедротами Своими? Какой отец даст жизнь, как даю Я? И ты оставила Меня, душа, возлюбив чуждого и ненавистного!»
        cn: 然而，谁比我更被渴望呢？我以自己的丰盛恩慈拯救一切受造物。哪个父亲能像我这样赐予生命呢？而你，灵魂啊，却离弃了我，转而爱上了一个陌生而可憎的！
    - type: paragraph
      text:
        ru: Кто не придет в трепет и ужас от слов сих?
        cn: 谁不会因这些话而战栗和恐惧？
    - type: paragraph
      text:
        ru: 'Кто не падет в стыде и, проливая слезы, не возопиет: «Зачем вышел я из матерней утробы раздражать святого, благого и милосердого Бога?»'
        cn: 谁不羞愧地俯伏，并且潸然泪下，呼喊说：「我为何要从母腹中出来，去激怒那圣洁、良善、又慈悲的上帝呢？」
    - type: paragraph
      text:
        ru: Но, Господи, даруй нам отрезвиться от суеты, прийти в себя и возвратиться к Тебе, в Коем едином все истинное благо наше!
        cn: 然而，主啊，求祢赐予我们从虚妄中清醒过来，回到自己里面，并归向祢，唯独在祢里面，我们的一切真正福祉！
  - type: heading2
    text:
      ru: Ради слез обрати и даруй принести плоды покаяния!
      cn: 为着眼泪的缘故，求你使我回转，并赐予我结出悔改的果实！
    children:
    - type: paragraph
      text:
        ru: Услышь, Владыко, плач мой и приими слова моления моего, какие грешник приносит Тебе, Долготерпеливый и Многомилостивый.
        cn: 吾主，求您垂听我的哀哭，并垂纳我祈求的话语，这些是罪人向您献呈的，您是恒忍并大有慈悲的。
    - type: paragraph
      text:
        ru: Не сотвори со мной по делам моим, не помяни великих беззаконий моих, какими преогорчевал я благодать Твою, всеблагой Владыко.
        cn: 不要照我的行为待我，不要纪念我极大的罪孽，我曾因此使你的恩典忧伤，至善的主宰啊。
    - type: paragraph
      text:
        ru: Благость Твоя терпела грехи юности моей, коих великое множество. Да потерпит она и еще моему непотребству, невниманию и беспечности.
        cn: 你的恩慈忍耐了我年少时极多的罪愆。愿它仍旧忍耐我的不配、不专心和懈怠。
    - type: paragraph
      text:
        ru: Щедротами Твоими клялся Ты, Владыко Человеколюбче, что не хочешь смерти грешника, но чтобы обратился... и жив был (Иез. 33:11). Сими щедротами Твоими умолен буди и о мне, грешном, – умилосердись и ущедри меня.
        cn: 你曾指着你的丰盛恩慈起誓，主宰，仁爱世人者啊，你不愿罪人死亡，却愿他回转……并存活（以西结书 33:11）。愿你因着你的这些丰盛恩慈，也俯允我这罪人的祈求——怜悯我，并以厚恩待我。
    - type: paragraph
      text:
        ru: Воззри, Христе Спасителю, на источники слез моих, на сокрушение и воздыхание недостойной души моей! Да приидет милость Твоя и покроет меня прежде, чем приидет страшное определение о смерти и застанет меня неготового и смущенного.
        cn: 基督救主啊，求祢垂顾我泪水的源泉，垂顾我这不配的灵魂的痛悔与叹息！愿祢的怜悯降临，覆庇我，免得可怕的死亡定命临到时，发现我毫无准备，心神不安。
    - type: paragraph
      text:
        ru: Да дарует мне благость Твоя несколько времени для истинного покаяния. Ибо она обыкла всякого грешника, проливающего слезы, миловать и прощать ему все грехи, соделанные им. Сотвори, чтоб и я принес Тебе плод покаяния!
        cn: 愿祢的恩慈赐予我一段为了真正悔改的时间。因为她惯于怜悯每一个流泪的罪人，并赦免他所犯的一切罪孽。求祢也使我能向祢献上悔改的果子！
    - type: paragraph
      text:
        ru: Привлеки меня к жизни и спаси меня. Даруй мне чистым сердцем послужить Тебе все дни жизни моей и, благоугодив Тебе добрыми делами, сподобиться по прохождении жизни сей вступить в вечное блаженство, которое уготовал Ты всем святым Твоим, благоугодившим Тебе во всяком роде.
        cn: 引我归向生命，并拯救我。求你恩赐我以清洁的心事奉你，在我一生中，并借着善行蒙你喜悦，使我配得在此生终了之后，进入你为你所有的圣徒、凡在各样事上蒙你喜悦的，所预备的永恒的福乐。
  - type: heading2
    text:
      ru: К Богородице о руководстве жизни и заступлении в смерти
      cn: 致圣母：关于生命的指引以及临终的代求
    children:
    - type: paragraph
      text:
        ru: Дево Владычице Богородице, носившая во чреве Христа Спасителя и Бога нашего, на Тебя возлагаю всю надежду, на Тебя уповаю, высшую всех небесных Сил. Ты, Пречистая, охраняй меня всесильными молитвами Твоими!
        cn: 贞女主母、诞神女，您在腹中怀抱了我们的救主基督和我们的上帝，我将一切希望寄托在您身上，我信赖您，您超越一切天上之能力。您，至洁者，借由您全能的祷告护佑我！
    - type: paragraph
      text:
        ru: Управь жизнь мою и путеводствуй согласно со святой волей Сына Твоего и Бога нашего.
        cn: 掌管我的生命，并依照祢的圣子和我们的上帝的圣洁旨意引导我。
    - type: paragraph
      text:
        ru: Даруй мне оставление грехопадений, будь мне прибежищем, покровом, защитой и Руководительницей, препровождающей в жизнь вечную.
        cn: 赐予我罪愆的赦免，作我的避难所、遮蔽、卫护和引导者，引我进入永生。
    - type: paragraph
      text:
        ru: В страшный же час смертный не оставь меня, Владычица моя, но ускори на помощь мне, исхити меня из горького мучительства бесов. Ибо в произволении Своем имеешь и силу соделать сие как воистину Матерь Божия и над всеми владычествующая.
        cn: 在那可怕的死亡时刻，我的主母啊，不要离弃我，反倒急速前来帮助我，将我从魔鬼那痛苦的折磨中拯救出来。因为您凭借自己的意愿，拥有成就此事的力量，作为真真正正的上帝之母，并且统管万有。
    - type: paragraph
      text:
        ru: Не переставай умолять и за всех нас, недостойных рабов Твоих, чтоб избавиться нам от всякой козни лукавого и от всякой крайности и соблюстись неуязвленными при всяком ядовитом приражении.
        cn: 不停地为我们所有人，你那不配的仆人恳求，好使我们能摆脱那恶者的一切诡计，免除一切艰难困苦，并在一切恶毒的侵袭中得以保守，不受伤损。
    - type: paragraph
      text:
        ru: И даже до конца молитвами Твоими сохрани нас неосужденными, да, спасенные Твоим заступлением и Твоей помощью, всегда будем воссылать славу, хвалу, благодарение и поклонение Единому в Троице Богу, Создателю всех.
        cn: 甚至直到末了，藉着你的祷告，保守我们不被定罪，使我们，藉着你的代祷和你的帮助，得蒙拯救，永远向上献上荣耀、赞美、感谢和敬拜，归于三一中的独一之上帝，万物的创造者。
  - type: heading2
    text:
      ru: Здесь исправь всех грешнейшего!
      cn: 这里匡正罪人中的罪魁！
    children:
    - type: paragraph
      text:
        ru: Всевышний Боже, Единый имеющий власть над жизнью и смертью, яви мне, грешному, великую милость Твою в оный час страшного Твоего Пришествия, чтобы там пред Престолом Твоим не быть мне укоризной и великим стыдом для взирающих на меня ангелов, архангелов, пророков, апостолов, патриархов, мучеников, подвижников и всех праведных.
        cn: 至高上帝，您是唯一掌管生命与死亡的，求您在您那可畏降临的时刻，向我这罪人显明您伟大的怜悯，使我在那里，在您的宝座前，不至于在所有注视着我的天使、大天使、先知、使徒、宗主教、殉道者、苦行者和众义人面前，成为被指责和极大的羞辱。
    - type: paragraph
      text:
        ru: Здесь, Спаситель мой, здесь, где наслаждался я прелестью греха, вразуми меня, как благосердый и чадолюбивый Отец, а там прости мне, как милостивый Бог, единый Безгрешный.
        cn: 在此，我的救主，在此，我曾沉溺于罪的诱惑之处，求您开导我，如同仁慈且疼爱子女的父亲；在那时赦免我，如同慈悲的上帝，那唯一无罪者。
    - type: paragraph
      text:
        ru: Всякий грех соделан мной, окаянным, всех превзошел я распутством. Заслужил я наказание, и если начну просить покаяния, то нет у меня слез.
        cn: 一切罪过都由我这可怜之人所犯，我的放荡更超越了所有人。我罪有应得，即使我开始祈求悔改，我却无泪。
    - type: paragraph
      text:
        ru: Увы, какими очами я, грешный и нерадивый, буду взирать на тот страшный Престол, на котором воссядешь Ты, Господи, и будешь обличать соделанное мною? Всю жизнь свою расточил я блудно, непрестанно валяясь в тине сластолюбия.
        cn: 唉，我这罪人、怠惰之人，将凭何双目瞻望那可畏的宝座，你，主啊，将要坐上，并斥责我所行的一切呢？我荒淫无度地虚掷了一生，不停地沉溺于贪恋逸乐的泥淖中。
    - type: paragraph
      text:
        ru: Все тайные мои падения и всю обширность грехов моих знаешь Ты один, Творец мой. Никто не был таким обиталищем греха, как я. Никто не преогорчевал столько благодать Твою, Владыко, как я, последовав стремлениям греха.
        cn: 我所有隐秘的堕落，以及我罪孽的全部广阔，唯有祢知晓，我的造物主。没有人曾是如此的罪孽居所，如同我一般。没有人如此使祢的恩典忧伤，主啊，如同我一般，随从了罪的私欲。
    - type: paragraph
      text:
        ru: Но Ты, как море благости, иссуши пагубные моря грехов моих и, как бездна милосердия, потопи бездну грехов моих!
        cn: 然而你，如同良善的海洋，使我罪孽的毁灭性海洋枯竭，并且，如同怜悯的深渊，淹没我罪孽的深渊！
    - type: paragraph
      text:
        ru: Не воздавай мне по достоинству соделанного мной и не осуди меня в гееннский пламень! Ибо невыносим гнев Твой, Господи, и кто стерпит угрозы Твои?
        cn: '不要按我所行的功过报应我，

          也不要将我定罪于地狱的火焰中！

          因为，主啊，您的烈怒是难以忍受的，

          谁能承受您的威吓呢？'
  - type: heading2
    text:
      ru: К святым о ходатайстве
      cn: 向圣徒求代祷
    children:
    - type: paragraph
      text:
        ru: Убойся, душа, Суда и геенны и отжени тяжкий сон нерадения и дремоту страшной беспечности. Конец близок, Суд при дверях. Что встретит нас по разлучении с жизнью?
        cn: 你的灵魂啊，当敬畏审判和地狱，驱除怠惰的沉重睡意和可怕疏忽的昏沉。终结临近，审判近在门前。当我们与生命分离之后，将有什么等待着我们呢？
    - type: paragraph
      text:
        ru: Приидите на помощь мне, святые и праведные, подвизавшиеся добрым подвигом, и плачьте обо мне как о мертвеце или пожалейте обо мне как о живом, но полумертвом, потому что полон я стыда и не имею дерзновения по причине грехов, в ведении мною содеянных.
        cn: '援助我吧，圣者与义人，你们善尽了美好的灵修苦功；

          为我哭泣吧，如同为死人哭泣；

          或者怜悯我吧，如同怜悯一个活人，却是半死之人，

          因为我充满了羞耻，且毫无坦然无惧之心，只因我明知故犯的罪过。'
    - type: paragraph
      text:
        ru: 'Излейте на меня милосердие свое как на пленника, как на покрытого загнившими язвами. Умилосердитесь ко мне вы, таинники милостивого Бога Спасителя нашего, и умолите Его, чтобы обратил меня туне и чтобы в час Пришествия Его не оказаться мне недостойным и не услышать страшного оного определения: «Иди от Меня, делатель неправды, сказываю тебе, что не знаю тебя!»'
        cn: 求您将您的怜悯倾泻于我，如同倾泻于一名囚徒，如同倾泻于一个遍布腐烂创伤的人。你们这些我们慈悲的救主上帝的奥秘执事者啊，求您们怜悯我，并恳求祂白白地使我回转，以免在祂降临之时，我不致被发现为不配的，也不致听到那可怕的判决：「离开我吧，作恶的人，我告诉你，我不认识你！」
  - type: heading2
    text:
      ru: Моление о даровании всякой добродетели
      cn: 祈求赐予一切美德
    children:
    - type: paragraph
      text:
        ru: То даруй мне, Сын Всеблагого, к чему стремятся помыслы мои, и присовокупи еще к тому, что угодно воле Твоей.
        cn: 至善者之子啊，愿你赐予我我的心思所向往的，并请你额外增添凡合乎你旨意的。
    - type: paragraph
      text:
        ru: Даруй мне изволение делать добро и ни в чем не уклоняться от воли Твоей.
        cn: 求你赐予我行善的意愿，使我在任何事上都不偏离你的旨意。
    - type: paragraph
      text:
        ru: Не попусти мне быть учеником лукавым и лицемерным и нарушать заповеди Твои.
        cn: 不容许我成为诡诈和虚伪的门徒，也不容许我违犯你的诫命。
    - type: paragraph
      text:
        ru: Охрани меня от помысла ходить путем Твоим только для вида и лицемерием своим обманывать видящих меня, чтобы провозглашали меня блаженным.
        cn: 保护我免于有此念头：仅仅是为了做做样子而走祢的道路，并用我的虚伪欺骗看见我的人，好叫他们宣称我为有福的。
    - type: paragraph
      text:
        ru: Даруй, чтобы сердце мое благоугождало величию Твоему втайне и чтобы правая жизнь моя прославляла Тебя явно.
        cn: 求你恩赐，使我的心在隐秘中蒙你的伟大悦纳，并使我公义的生命公开地荣耀你。
    - type: paragraph
      text:
        ru: Истина да будет наставницей мне, поклоннику Твоему; она и вблизи и вдали да содержит меня в целомудрии.
        cn: 真理啊，愿你成为我这敬拜祢者的导师；愿它无论近处或远处，都使我保持贞洁。
    - type: paragraph
      text:
        ru: Избавь меня от несчастья знать закон твой и, зная закон Твой, не иметь желания благоугождать Тебе.
        cn: 求你救我脱离知道你的律法，却在知晓你的律法之后，没有讨你喜悦的意愿这种不幸。
    - type: paragraph
      text:
        ru: Удостой меня сообщества людей простых, но которые опытны и мудры в делании добродетелей.
        cn: 求你使我配得与那些朴实无华，但在修习美德上经验丰富且充满智慧的人为伴。
    - type: paragraph
      text:
        ru: Плоть моя немощна, укрепи меня силой Твоей. Помоги и сокруши стрелы коварного врага и сопричти меня к сонму первородных Твоих.
        cn: 我的肉体软弱，求你以你的能力坚固我。帮助我，并击碎诡诈仇敌的箭矢，又将我列入你的众长子之列。
    - type: paragraph
      text:
        ru: Даруй мне, Господи, всегда быть Твоим достоянием и без страха творить благоугодное Тебе. И как скоро начну что доброе, Ты, Господи, укрепи меня и совершить то.
        cn: 主啊，求你赐予我，永远作你的产业，并无所畏惧地行你所喜悦之事。我一着手行任何善事，主啊，求你坚固我，使我能完成它。
    - type: paragraph
      text:
        ru: Знаю, что согрешил я против воли Твоей, ясно вижу, что преступил я повеление Твое. Но Ты, сияющий солнце Свое на злые и благие, благоволи, да воссияет свет Твой и в моем омраченном уме. Сим светом Твоим изгнаны будут грехи – эти убийцы и разбойники, водворившиеся во внутренности моей.
        cn: 我知道我得罪了您的旨意，我清楚地看到我逾越了您的诫命。然而您，使您的太阳普照恶人与善人，求您恩准，使您的光也照耀在我昏暗的心智中。靠着您的这光，罪恶将被驱逐——这些盘踞在我内心深处的凶手和强盗。
    - type: paragraph
      text:
        ru: 'Лукавый не видит во мне зла, которое бы не от него было, ибо от него стал я зол; впрочем, побежден им по собственной своей воле: опутал меня лукавый, потому что сам я научил его тому.'
        cn: 那恶者在我里面所看见的恶，没有一样不是从他而来的，因为我正是从他那里变得邪恶的；然而，我却是凭着自己的意志被他击败的：那恶者缠住了我，因为我亲自教会了他那样做。
    - type: paragraph
      text:
        ru: Ленивые и робкие бегут от ига Твоего, нерадивых постыжает любовь Твоя.
        cn: 懒惰和怯懦的人逃避你的轭，你的爱使不殷勤的人感到羞愧。
    - type: paragraph
      text:
        ru: Хвала Твоей благости, сей матери учителей, которые, как ни болезненны удары их, вразумляющие упорных, сострадательно подают врачевство кающимся.
        cn: 赞美您的良善，这导师们的母亲；他们，尽管其打击多么痛苦，训诫着顽固者，却怀着怜悯施予悔改者良药。
    - type: paragraph
      text:
        ru: Достопоклоняем Отец Твой и Дух Твой, веселящийся о нашем обращении!
        cn: 你的父和你的灵，因我们的归正而欢欣喜乐，是可敬可拜的！
  - type: heading2
    text:
      ru: Уроки жизни. Блаженства
      cn: 生命的教训。真福八端
    children:
    - type: paragraph
      text:
        ru: 'Блажен, кто стал великодушен и милосерд и не поработил себя дикой раздражительности, то есть злому гневу: он будет возвеличен от Господа.'
        cn: 蒙福的，是那些变得宽宏大量、仁慈怜悯，并且没有使自己沦为狂野的暴躁——也就是邪恶的忿怒——的奴仆的人：他必蒙主高举。
    - type: paragraph
      text:
        ru: Блажен, кто, возвысившись в любви, стал как город, построенный наверху горы, от которого враг, посмотрев на него, удаляется со страхом, убоявшись того, что он тверд о Господе.
        cn: 蒙福的人，他在爱中得以高举，变得如同一座建在山巅之上的城。仇敌一见，便怀着恐惧退却，因畏惧他在主里坚固不移。
    - type: paragraph
      text:
        ru: Блажен, кто просиял верой в Господа, как ясный светильник на высоком подсвечнике, и просветил души омраченные, которые последовали учению неверных и злочестивых.
        cn: 蒙福的，凡是因信靠主而发出光辉，如同高置灯台上的明灯，并光照了那些晦暗的灵魂，他们曾追随不信者和邪恶之人的教训。
    - type: paragraph
      text:
        ru: Блажен, кто всегда любит истину и уст своих не дал лжи в оружие нечестия, боясь заповеди, запрещающей даже праздное слово.
        cn: 有福的，是凡恒久爱真理，并且不将自己的口作为不虔的谎言的武器的人，因他们惧怕那甚至禁止一句闲话的诫命。
    - type: paragraph
      text:
        ru: Блажен, кто не осуждает ближнего как немудрый, но как человек разумный и духовный старается вынуть прежде бревно из собственного своего глаза.
        cn: 蒙福的，凡不像愚昧人那样论断邻舍，而是像明智且属灵的人那样，努力先从自己的眼中除去梁木。
    - type: paragraph
      text:
        ru: Блажен, кто воздерживал вежды и ни мысленно, ни чувственно не обольщался кожей плоти, которая вскоре будет источать из себя гной.
        cn: 有福的，是那克制眼睑的人，他既不在思想上，也不在感官上被肉体的皮肤所诱惑，这肉体的皮肤不久将流出脓液。
    - type: paragraph
      text:
        ru: Блажен, кто имеет пред очами день исшествия и возненавидел гордыню прежде, чем обличена естественная наша ничтожность согнитием во гробе.
        cn: 蒙福的，是那常将离世之日置于眼前，并且在坟墓中，我们与生俱来的渺小因朽坏而显明之前，就已憎恶了骄傲的人。
- type: heading1
  text:
    ru: Отделение десятое
    cn: 第十部
  children:
  - type: heading2
    text:
      ru: На чем утверждается упование оправдания на Суде
      cn: 称义的盼望在审判中建立在何处？
    children:
    - type: paragraph
      text:
        ru: Огнь угрожает, Господи, членам моим, но во мне, Избавитель мой, сокрыта примиряющая Кровь Твоя, геенна ожидает меня на мучения, но тесно соединено со мной Животворящее Тело Твое. Я облечен в ризу Духа Святого – и не опалюсь. Когда восшумит река огненная, угрожая отмщением, тогда угаснет во мне огонь, как скоро приразится к нему воня Плоти и Крови Твоей.
        cn: 主啊，火威胁着我的肢体，但我的救赎主啊，你的施行和解的宝血藏在我里面；欣嫩子谷（地狱）等待着我受煎熬，但你的赐生命的身体与我紧密结合。我披戴着圣灵的袍子——我不会被灼伤。当火河喧嚣而起，威胁着报复时，那火将在我里面熄灭，一旦你的肉身和宝血的馨香触及它。
    - type: paragraph
      text:
        ru: 'Ты, Господи наш, упование кающихся, Ты – друг всех грешников. Умоляю Тебя, Господи, святым именем Твоим: не накажи меня праведным судом Твоим! Любовью Родителя Твоего, Матерним лоном, носившим Тебя, копьем, которое на Голгофе отверзло ребра Твои, умоляю Тебя: источи мне росу милосердия Твоего, чтобы не томиться мне там жаждою воды!'
        cn: 祢，我们的主啊，悔改者的盼望，祢是所有罪人的朋友。我恳求祢，主啊，凭祢的圣名：不要凭祢公义的审判惩罚我！我恳求祢，凭祢父的爱，凭那怀抱祢的母腹，凭那在各各他刺穿祢肋旁的枪：为我倾泻祢慈悲的甘露，使我不在那里因缺水而煎熬！
    - type: paragraph
      text:
        ru: Крест Твой, Господи, в котором ищу себе прибежища, да будет для меня там мостом чрез великую пламенную реку. Им да пройду в обитель жизни!
        cn: '祢的十字架，主啊，我在其中寻求庇护，

          愿它在那里成为我的桥梁，跨越那巨大的火焰之河。

          愿我借此进入生命的居所！'
    - type: paragraph
      text:
        ru: Взывали к Тебе Иона в глубине моря и Даниил во рве львином, призывали Тебя три отрока еврейские в пещи, разожженной халдеями. Извел Ты Иону из бездны, спас Даниила, и милосердие Твое оросило и угасило пламень в пещи. Помилуй и меня, Господи, и спаси за то, что исповедовал я Тебя, и по благодати Твоей оставь мне долги мои!
        cn: 约拿在深海中，但以理在狮子坑中，曾向祢呼求。三位希伯来少年在迦勒底人点燃的火炉中，曾向祢呼求。祢将约拿从深渊中带出，拯救了但以理，祢的慈悲浇灌并熄灭了炉中的火焰。主啊，也求祢怜悯我，并拯救我，因我曾认信了祢，并照祢的恩典赦免我的罪债！
    - type: paragraph
      text:
        ru: Помилуй меня, милосердый Господи наш, и по множеству щедрот Твоих изгладь грехи мои. Омой меня от беззакония рук моих, да очищусь и омоюсь от скверн моих. Знаю, что согрешил я, грехи мои всегда предо мною, и я вижу их. Пред Тобой только я виновен и согрешил, будь милостив ко мне, Господи Иисусе, Боже наш!
        cn: 怜悯我，我们慈悲的上主，并照着你丰盛的怜悯涂抹我的罪恶。洗净我手所行的不法之事，使我洁净并洗涤干净，脱离我的污秽。我知道我犯了罪，我的罪孽常在我眼前，我也看见它们。唯独在你面前，我有罪并犯了罪，求你怜悯我，主耶稣，我们的上帝！
    - type: paragraph
      text:
        ru: Симон три раза отрекся от Тебя, Господи, но принес Тебе слезы, и Ты принял его. Вот и я приношу чистое исповедание. Много грехов моих, они несчетны. По щедротам Твоим, Господи наш, прости мне беззакония мои, благодатью Твоей изгладь рукописание скверн моих и не помяни грехов моих.
        cn: 西蒙三次否认了你，主啊，但他向你献上了眼泪，你便悦纳了他。看哪，我也献上纯洁的忏悔。我的罪孽深重，数不胜数。我们的主啊，照你丰盛的怜悯，赦免我的不法行为；靠着你的恩典，涂抹我污秽的罪状，且不再记念我的罪孽。
    - type: paragraph
      text:
        ru: Хвала Господу Богу, Который не хочет смерти грешника! Хвала Тебе, Милующий грешников! Хвала Тебе, Приемлющий кающихся! Хвала Тебе, Иисусе, отверзающий Свою дверь всякому, кто ударяет в нее и просит себе оставления грехов! Хвала Тебе, Господи, а нам щедроты Твои! Будь милостив к нам, Господи наш Иисусе!
        cn: 赞美不愿罪人死亡的上主上帝！赞美祢，怜悯罪人者！赞美祢，接纳悔改者！赞美祢，耶稣，祢向一切叩门并祈求罪得赦免者敞开祢的门！赞美祢，主啊，愿祢的丰盛恩典赐予我们！求祢怜悯我们，我们的上主耶稣！
  - type: heading2
    text:
      ru: Увлек меня враг, и я нагрешил много. Исповедую грехи, помилуй!
      cn: 仇敌引诱了我，我犯了许多罪。我认罪，求祢怜悯！
    children:
    - type: paragraph
      text:
        ru: 'По благодати Твоей, призывающей нас, Боже, приближаться к Тебе, а не погибать, о Благой, давший обетование и вещавший: «Призовите Меня, и услышу вас», в дверь благости Твоей ударяю я, Избавитель мой! Услыши меня по щедротам Твоим и не воззри на беззакония мои! Помилуй меня, Господи, помилуй меня по благости Твоей, потому что много я виновен пред правдой Твоей!'
        cn: 凭祢的恩典，喔，上帝，祢呼召我们亲近祢，而非灭亡；喔，良善者，祢曾应许并宣告说：「呼求我，我必应允你们。」我的救赎主啊，我敲叩祢良善之门！求祢凭祢丰盛的怜悯垂听我，且不要察看我的不法之事！求祢怜悯我，主啊，求祢凭祢的良善怜悯我，因为我实在在祢的公义前罪孽深重！
    - type: paragraph
      text:
        ru: Ты сотворил меня, Господи, наименовал меня образом Твоим по благости Твоей, создал меня по подобию Твоему, Ты научил меня знать путь в обитель жизни и показал мне путь в геенну. Лукавый по зависти своей поставил мне скрытные засады, сманил меня с пути Твоего – и погряз я в мерзостях.
        cn: 主啊，你创造了我，凭你的美善称我为你的肖像，按照你的样式造了我。你教导我认识通往生命居所的道路，并指示我通往地狱的道路。恶者出于他的嫉妒，给我设下隐秘的埋伏，引诱我偏离了你的道路——我就深陷于可憎之事中。
    - type: paragraph
      text:
        ru: Увы мне, Господи наш, много виновен я! Помилуй меня, Господи, и спаси по благодати Твоей!
        cn: 我真有祸了，我们的主啊，我罪孽深重！主啊，求你怜悯我，并凭你的恩典拯救我！
    - type: paragraph
      text:
        ru: Разбойник, похититель душ, злокозненно отнял у меня свободу мою, обольстил меня и наругался надо мной. Взором очей прельстил и пленил он меня и вложил в меня греховные мысли. Взглянул я и пожелал, посмотрел с любопытством и согрешил. поскольку же руки мои простерлись на беззаконное дело, то погиб я совершенно. Увы, теперь мне угрожает огонь! Спаси меня, Милосердый, да не умру!
        cn: 强盗，灵魂的掠夺者，邪恶地夺走了我的自由，诱惑了我并侮辱了我。他以目光引诱并俘虏了我，并将罪恶的思想植入我心。我看了就起了欲望，好奇地看了看就犯了罪。既然我的手伸向了不法之事，我就彻底沉沦了。唉，现在火焰威胁着我！拯救我，慈悲者，免得我死亡！
    - type: paragraph
      text:
        ru: Несчастнее я всех, рожденных женами, потому что сам себя делами своими сделал несчастным и вверг в пагубу. Каждый день грешил я и утешался тем, не помышляя, что подстерегает меня смерть. Увы, близко уже Ангел смерти, посланный с повелением поять меня на Суд! Увы, все сокровенное будет там обнаружено, и я покроюсь стыдом!
        cn: 我比所有生于妇人者更不幸，因为我亲手所为使自己不幸，并陷入败坏之中。我每日犯罪，且以此自慰，不曾思及死亡正伺伏于我。哀哉！死亡天使已近，奉命将我带往审判！哀哉！所有隐秘之事都将显露无遗，我将蒙羞受辱！
    - type: paragraph
      text:
        ru: Вот дела мои отмечены правосудием, не забыто даже ни единое слово. В этой великой книге у Судии записаны дела и беззакония мои. Горе мне, когда правосудие прочтет там все грехи, какие сделаны мною от юности до старости моей! Что мне делать в тот час и куда бежать от Тебя, Господи?
        cn: 看哪，我的行为已被公义所记录，甚至没有一个字被遗忘。在这本伟大的书中，审判者记录了我的行为和我的罪孽。祸哉我，当公义在那里读出我从年轻到年老所犯下的一切罪恶时！在那个时刻我该怎么办？主啊，我又能往何处逃离你呢？
    - type: paragraph
      text:
        ru: Увы мне, Господи! Как много виновен я! Увы мне, грешил я и не приносил покаяния! Боже, помиловавший грешницу, помилуй и меня, бедного, Господи наш, да не погибну! Вместо мира, которое принесла Тебе грешница, у меня Плоть и Кровь Твоя, соединявшаяся с членами моими. Нет, Господи наш, не взирай на дела мои – благодать твоя да изгладит вины мои!
        cn: '唉，我主啊！我何其有罪！

          唉，我真不幸！我犯罪了，却没有悔改！

          上主啊，祢曾怜悯那罪妇，也求祢怜悯我这可怜的人，我们主啊，免得我灭亡！

          罪妇向祢献上的是香膏，而我所领受的却是祢的圣体圣血，这圣体圣血已与我的肢体合而为一。

          不，我们主啊，不要鉴察我的行为——愿祢的恩典涂抹我的罪愆！'
    - type: paragraph
      text:
        ru: Не вниди в суд со мною, Господи наш, яко не оправдится пред Тобою всяк живый. Ты один, Господи, чист. Пощади меня и очисти от грехов благодатью Твоей, сподоби меня, Милосердый, великих щедрот Твоих, да обогащусь ими и получу прощение, и возрадуются Ангелы Твои по слову Твоему, Милосердый к грешникам!
        cn: '不要与我进入审判，我们的主啊，因为在你面前，凡有血气的，没有一个能得称为义。

          唯有你，主啊，是纯洁的。

          怜悯我，并藉着你的恩典洁净我的罪，

          慈悲者啊，使我配得你丰盛的怜悯，

          好使我借此得着丰盛，并得蒙赦免，

          你的天使将为此欢欣，依照你的话语，怜悯罪人的！'
  - type: heading2
    text:
      ru: Против козней врага
      cn: 对抗仇敌的诡计
    children:
    - type: paragraph
      text:
        ru: Умоляю Тебя, Свет истинный, Рождение Благословенного Отца, Образ ипостаси Его, Сидящийодеснуювеличества Его, Христе, похвала и радость любящих Тебя, жизнь моя, свет мой, отрада моя!
        cn: 我恳求祢，真光，蒙福之父的所生，祂位格的形像，坐在祂威严的右边者，基督啊，爱祢之人的称颂与喜乐，我的生命，我的光，我的慰藉！
    - type: paragraph
      text:
        ru: Не презри меня уничиженного, не отринь меня мерзкого, потому что врагу крайне будет приятно, когда я ввержен буду в отчаяние по причине окружающей меня мглы порока. Тому только и радуется он, когда видит, что отчаяние начинает делать меня его пленником.
        cn: 不要藐视卑微的我，不要弃绝污秽的我，因为当仇敌看见我因着环绕我的罪恶迷雾被投入绝望时，他将极其喜悦。他唯独以此为乐，就是当他看见绝望开始使我成为他的囚犯时。
    - type: paragraph
      text:
        ru: Но Ты по сердолюбию Своему посрами его надежду, исхить меня из зубов его, избавь от злокозненного умысла его, от всего, что воздвигает он против меня, потому что многим ополчается он на меня.
        cn: 但愿你凭着你的慈悲，使他的希望蒙羞，从他的利齿下夺回我，救我脱离他恶毒的诡计，脱离他向我兴起的一切，因为他多方与我为敌。
    - type: paragraph
      text:
        ru: 'Даруй мне, Господи, просвещение к познанию козней сопротивника моего и ненавистника всякого добра, потому что он ставит мне на пути бесчисленное множество соблазнов и случаев к поползновению: и ущерб, и выгоду, утехи века сего и плотское удовольствие, долготу настоящей жизни, робость к подвигам, леность к молитве, сон и телесный покой во время псалмопения.'
        cn: 主啊，求您赐予我启迪，以便认识我那敌对者和一切良善之仇敌的诡计，因为他在我的道路上设置了无数的诱惑和致使我跌倒的缘由：损害和利益，今世的欢愉和肉体的享乐，今生漫长的生命，对苦修的胆怯，对祷告的懒惰，以及在诵读诗篇时的睡眠和身体的安逸。
    - type: paragraph
      text:
        ru: Сколько старается враг о моей погибели, столько я, бедный, предаюсь беспечности и нерадению, и чем более ставит он мне сетей, тем более я небрежен.
        cn: 敌人竭力图谋我的毁灭，我这可怜人就同样地沉溺于漫不经心和懈怠之中；他给我设下越多的罗网，我就越发疏忽大意。
    - type: paragraph
      text:
        ru: Будь осторожна, душа моя, попекись о совести своей, не обращай внимания на падения других, но будь паче внимательна к одним своим падениям. Спеши, предупреждай, примирись со Христом, распятым за тебя плотью! Если сами себя осудили, то не будем осуждены там, где великое и нескончаемое осуждение.
        cn: 我的灵魂啊，务要警醒，照管好你的良心，不要留意他人的跌倒，反而要格外留意自己的跌倒。赶紧啊，预先防范，与那位为你以肉身被钉十字架的基督和好！如果我们自己审判了自己，就不会在那个有巨大且永无止境定罪的地方被定罪。
    - type: paragraph
      text:
        ru: Умилосердись обо мне, Господи, по благоутробию Твоему и спаси меня по единой благости Твоей молитвами Пречистой Владычицы нашей Богородицы и всех святых Твоих.
        cn: 主啊，求你怜悯我，按照你深厚的慈悲，并拯救我，全凭你独有的恩慈，藉着我们至洁主母诞神女以及你所有圣者的代祷。
  - type: heading2
    text:
      ru: Избавь от врага, как ревнитель о душе, обрученной Тебе!
      cn: 求祢救拔我脱离仇敌，作为那为许配给祢的灵魂的热心保护者！
    children:
    - type: paragraph
      text:
        ru: Скорбью подавленная душа приступает к Тебе, Владыко Святый, и со слезами предстает, жалуясь на губителя-врага, и со всяким смирением припадает, прося защиты от угнетающего ее сопротивника.
        cn: 被悲痛压伤的灵魂，来到祢跟前，圣洁的主宰，并流泪呈现在祢面前，抱怨着那毁灭者仇敌，又带着全然的谦卑俯伏，祈求祢保护它脱离那压迫它的对抗者。
    - type: paragraph
      text:
        ru: Поелику дерзновенно приступает она к Тебе, то выслушай ее вскоре и внимательно посети ее, с любовью к Тебе прибегающую.
        cn: 既然她冒昧地来到您面前，并且怀着对您的爱而投奔您，就求您尽快垂听她，并细心眷顾她。
    - type: paragraph
      text:
        ru: Если презришь ее, подавленную скорбью, то она погибнет. Если замедлишь выслушать ее, умерщвленную, то оскудеет она в силах.
        cn: 如果你轻蔑那被悲伤压垮的她，她就会消亡。如果你耽延倾听那被置于死地的她，她的力量就会枯竭。
    - type: paragraph
      text:
        ru: Но если по щедротам Твоим посетишь ее, то обретется (целой), если призришь на нее, то спасена будет, если услышишь ее, то укрепится в силах.
        cn: 但如果你凭着你的丰盛恩典眷顾她，她就会得以保全；如果你垂顾她，她就会蒙受拯救；如果你垂听她，她就会得以坚固其力量。
    - type: paragraph
      text:
        ru: Поревнуй о ней, потому что она обручена с Тобой и обручивший ее с Тобой Павел сказал, что Ты, Бессмертный, – ревнитель (см.:2Кор. 11:2).
        cn: 为她嫉妒吧，因为她已与你订婚，而那将她与你订婚的保罗曾说，你，不朽者，是位嫉妒者（参：哥林多后书 11:2）。
    - type: paragraph
      text:
        ru: Не презри ее, чтоб враг не подумал, что Ты в разводе с ней и отослал ее от Себя. Накажи меня, Господи, по щедротам Твоим, но не предавай меня в руки губителя!
        cn: 不要轻视她，免得仇敌以为你已与她离绝，并将她从你身边打发走。主啊，求你照着你的丰盛恩慈管教我，但不要将我交于那毁灭者手中！
    - type: paragraph
      text:
        ru: Вот отовсюду собрал я мысли свои и не могу пред Тобой припомнить чего-либо доброго, исключая одного того, что не знаю другого бога, кроме Тебя.
        cn: 我已从各处收集我的思绪，却无法在祢面前回想起任何良善之事，除了这一件：我不认识祢以外的任何别的上帝。
  - type: heading2
    text:
      ru: Козни врага и изворотливость греха
      cn: 仇敌的诡计与罪的诡诈
    children:
    - type: paragraph
      text:
        ru: Се снова припадаю к стопам Владыки моего, прося, умоляя, поклоняясь и со страхом взывая.
        cn: 看哪，我又俯伏在我的上主脚下，恳求着，哀求着，叩拜着，并带着敬畏呼求。
    - type: paragraph
      text:
        ru: Вонми, Владыко, сетованию моему и приими слова прошения моего, какие приношу Тебе я, посрамленный грешник.
        cn: 垂听，吾主，我的哀叹，并接纳我恳求的话语，就是我这蒙羞的罪人向祢呈献的。
    - type: paragraph
      text:
        ru: Излей на меня, бедного, по милости Своей хотя малую каплю благодати вразумления и обращения – возыметь мне хотя малое усердие к исправлению себя самого. Ибо если благодать Твоя не просветит души моей, не буду я в состоянии увидеть в себе повреждение и опустошение, производимое во мне страстями по моему нерадению и беспечности.
        cn: 凭藉您的慈悲，将哪怕一小滴醒悟与归正的恩典倾倒在我这贫乏之人身上，使我能拥有哪怕一点点热忱来修正我自己。因为若您的恩典不光照我的灵魂，我将无法在自己里面看见因我的疏忽和漫不经心，情欲在我里面造成的损害与荒芜。
    - type: paragraph
      text:
        ru: Увы, возобладавший мною грех нашел во мне пажить свою и с каждым днем более и более унижает и погружает меня в глубину свою, и я, окаянный, не престаю прогневлять Бога, не страшась оного неугасимого огня, не трепеща нескончаемых мучений.
        cn: 唉，战胜了我的罪在我里面找到了它的滋生地，并且日复一日地更深地羞辱我，把我沉入它的深渊；而我，这可怜人，仍不停地触怒上帝，不惧怕那不灭的火，不战栗于那无尽的折磨。
    - type: paragraph
      text:
        ru: Грех, обратившись в навык, вовлек меня в совершенную погибель. Хотя я сам себя обличаю и не перестаю приносить исповедание, однако ж всё пребываю во грехах. Смотрю – и не вижу, потому что погрешаю в самом покаянии, не углубляясь в различение дел.
        cn: 罪，一旦变为习惯，便将我卷入彻底的毁灭。尽管我自我谴责，并且不停地认罪，然而我仍旧活在罪中。我看——却看不见，因为我在忏悔本身上犯了错，没有深入分辨我的行为。
    - type: paragraph
      text:
        ru: Как раб греха, и не хотя, делаю худое, как воинствующий под властью его, ему подчиняюсь и, имея возможность бежать, плачу дань этому царствующему во мне навыку. Радея о страстях, несу оброки плоти. Зная, что растление во мне усиливается, сам содействую ему, влекомый какой-то тайной силой; хочу будто бежать, но, как пес на железной цепи, опять возвращаюсь туда же.
        cn: 作为罪的奴仆，虽不愿却行恶，像在其权势下争战的兵士，我顺服于它，并且，明明有机会逃脱，我却纳贡给这在我里面掌权的恶习。耽溺于情欲，我向肉体献上贡物。明知败坏在我里面加剧，我自己却助长它，被某种秘密的力量所牵引；我好似想逃跑，但像被铁链栓住的狗，我又回到原地。
    - type: paragraph
      text:
        ru: 'Иногда дохожу до ненависти ко греху и питаю отвращение к беззаконию, но всё же пребываю порабощенным страсти; она обладает мною, несчастным, и сластью греховной против воли вовлекает в грех. Страсть купила себе мое произволение и источает на меня грех. Кипят во мне страсти вопреки уму: они срастворились с плотью и не терпят разлучения.'
        cn: 有时我甚至憎恨罪，并厌恶不法，但却仍旧被情欲所奴役；它掌控着我这不幸之人，并以罪恶的甘美，违背我的意愿将我拖入罪中。情欲为自己买下了我的自由意志，并向我倾泻罪恶。诸情欲在我里面沸腾，违背我的心智：它们已与肉体融合为一，不容分离。
    - type: paragraph
      text:
        ru: Напрягаюсь переменить произволение, но предшествовавшее мое состояние никак не даст мне успеть в этом. Стараюсь, бедный, освободить душу от долгов, но злой заимодавец тут же вводит меня в еще большие долги. Щедро дает он в заем и не напоминает об отдаче, даже совсем не хочет брать обратно, желая только рабства моего; дает и не взыскивает долга, чтоб обогащался я страстями. Хочу отдать ему старый долг, а он прибавляет новый.
        cn: 我竭力改变自己的意愿，但我从前的境况绝不让我在其中成功。我努力，可怜的我，想要使灵魂摆脱债务，但那邪恶的债主立刻又使我陷入更大的债务中。他慷慨地借出，且不提醒我还债，甚至根本不想收回，只愿我为奴；他给出却不追讨债务，为要使我被情欲所充满。我想要还他旧债，他却又加上新债。
    - type: paragraph
      text:
        ru: Если же делаю себе небольшое принуждение, попереча страстям, он, чтоб низложить меня, придает новые страсти и, видя, что постоянное пребывание в долгу заставляет меня быть грешным, вводит в меня новые пожелания, а чтоб я не исповедовался, ввергает меня в забвение моих страстей.
        cn: 然而，如果我稍稍强制自己，违抗情欲，它为了击垮我，就添上新的情欲；又看到我持续地陷于罪债之中，使我犯罪，它就将新的私欲注入我心；而为了让我不告解，它就使我遗忘我的情欲。
    - type: paragraph
      text:
        ru: Встречаюсь с новыми страстями и, занятый ими, забываю о прежних. Дружусь с появившимися вновь страстями – и опять оказываюсь должником, бегу к ним как к друзьям, и заимодавцы мои опять обходятся со мной как властелины, и я, который незадолго до сего старался получить свободу, ради них делаюсь преданным рабом. Спешу снова разорвать их узы – и снова облагаюсь новыми. Спешу освободиться от воинствования в рядах их, но, как взявший с них много даров, оказываюсь невольно связанным с ними.
        cn: 我遭遇新的私欲，一被它们缠绕，就忘却了旧的。我与重新出现的私欲结为朋友——又再次成为它们的债务人，我奔向它们，如同奔向朋友，而我的债主们又再次将我当作主宰者一般对待，而我，才在不久前努力争取自由，却为了它们而成为一个忠实的奴仆。我急忙再次挣断它们的束缚——却又再次被新的束缚缠绕。我急于摆脱在它们的队伍中征战，但是，我如同从它们那里收受了许多礼物的人，身不由己地与它们关联在一起。
    - type: paragraph
      text:
        ru: О, какая власть надо мной греховных страстей! О, какое господство злохитрого и коварного змия! Действуя по природе, и он входит в торг, дает залог, чтобы продать ум самому греху. Убеждает меня угождать плоти под предлогом употреблять ее на служение душе, и я препобеждаюсь сластолюбием и, предавшись тотчас невоздержному сну, совершенно лишаюсь ее услуги. Когда молюсь, внушает мне мысль о каком-нибудь ничтожном удовольствии и ею, как медной цепью, держит слабый ум мой и не ослабляет уз, хотя он и порывается бежать.
        cn: 哦，罪恶情欲在我身上何等大的权势！哦，那诡诈又狡猾的蛇何等强大的辖制！它按着本性行事，也进入交易，支付定金，为要将心智卖给罪本身。它劝服我满足肉体，借口说将其用于服事灵魂，我便被贪爱享乐胜过，并且立刻屈服于放纵的睡眠，从而彻底失去了它的功用。当我祷告时，它给我灌输某种微不足道享乐的念头，并且借此，像一条铜链般，牢牢抓住我软弱的心智，也不松开束缚，尽管心智竭力挣脱。
    - type: paragraph
      text:
        ru: Так грех блюдет под стражей ум и запирает от меня дверь ведения. Враг непрестанно наблюдает за умом, чтобы не пришел он в согласие с Богом и не воспрепятствовал продать плоть, для того приводит множество перепутанных помыслов, уверяя, что на Суде и вопроса не будет о такой малости, что невозможно даже быть и ведению о сих помыслах и что всё подобное сему предано будет забвению. Но я представляю пред взор себе обличение свое и знаю, что мне угрожает наказание.
        cn: 罪恶如此看守着我的心智，并向我关闭了领悟之门。仇敌不断地监视着心智，以免它与上帝和合，不阻止肉体的沉沦。为此，它引来众多纷乱思绪，并声称在审判时连这样微不足道的小事都不会被提及，甚至连对这些思绪的认知也不可能存在，并且一切与此相似的都将被遗忘。但我将自己的过犯呈现在眼前，并且知道惩罚正威胁着我。
    - type: paragraph
      text:
        ru: Сим удерживает, сим связывает, сим продает и покупает меня грех, сим вводит меня в заблуждение, сим льстит мне и подчиняет меня себе, потому что, как говорит апостол, человек плотян, продан под грех (см.:Рим. 7:14). Ибо грех, который во плоти моей, властвует над умом и, по причине моей вины употребляя в действие плоть, ею обременяет душу.
        cn: 罪恶以此辖制我，以此捆绑我，以此将我买卖，以此迷惑我，以此谄媚我，并使我臣服于己；因为，正如使徒所言，人是属肉体的，被卖给罪了（参：罗马书 7:14）。因为在我肉体里的罪辖制着心智，并因我的过犯，利用肉体，借着肉体使灵魂承受重负。
    - type: paragraph
      text:
        ru: Если вознамерится кто поститься, или пребывать в бдении, или наложить на себя раны, грех посредством плоти, как собственность свою, обременяет душу цепями, и, как овцу на заклание, связывает ее, и, посредством также плоти, отсекает руки и ноги. Не могу ни бежать, ни помочь себе.
        cn: 如果有人想要禁食，或警醒守夜，或伤害自己，罪就会藉着肉体，如同自己的产业一般，用锁链捆绑灵魂，并像待宰的羔羊一样捆绑它，又藉着肉体，砍断手脚。我既不能奔跑，也无法自救。
    - type: paragraph
      text:
        ru: Увы, живой я мертвец, смотрю – и не вижу, из человека стал псом, и со мною, разумным, обходятся, как со скотом.
        cn: 唉，我是个活死人，我看着却看不见；我由人变成了狗，而有理智的我，却被当作牲畜对待。
    - type: paragraph
      text:
        ru: Помилуй же, душа, сама себя и поспеши вступить наконец в борьбу с грехом прежде разлучения с телом, чтобы не остаться нам за дверьми вместе с юродивыми девами, потому что смертным невозможно увидеть жизнь или помышлять о праведности там, где нет борьбы, в которой жизнь и смерть, и где нет плоти, которой предается поруганию враг, препобеждаемый посредством ее.
        cn: 那么，灵魂啊，要怜悯你自己，并赶快在与身体分离之前，最终投入与罪的争战，以免我们像愚拙的童女一样被留在门外，因为在没有争战之地，凡人不可能看见生命或思念公义，在这争战之中包含着生命与死亡；并且在没有肉身之地，敌人无法借着肉身蒙受羞辱，因那敌人正是借着肉身才得以被彻底战胜的。
- type: heading1
  text:
    ru: Отделение одиннадцатое
    cn: 第十一部分
  children:
  - type: heading2
    text:
      ru: Как милостиво принимает Господь кающихся!
      cn: 主多么慈悲地接纳悔改者啊！
    children:
    - type: paragraph
      text:
        ru: Источник, полный вод, непрерывно струящийся и обильно подающий питие всем приходящим к нему, изображает собой обилие и неистощимость щедрот Твоих, Господи! Ты изобильно питаешь небесные силы и наделяешь пищей всякое дыхание на земле. Любовь Твоя, желая нашего спасения, сама преклоняется к нам, чтобы привлечь к себе и спасти приходящих к ней.
        cn: 涌流不息、水流丰沛、向所有来者慷慨赐下饮水的源泉，描绘出祢恩慈的丰盛与取之不尽，主啊！祢丰盛地供养天上的力量，并赐予地上一切有气息的生命以食物。祢的爱，因渴望我们的救赎，亲自俯就我们，为要吸引归向它的人，并拯救他们。
    - type: paragraph
      text:
        ru: Как Всеведец, видишь Ты, Владыко, с какой кто готовностью отвращается от греха, и, прежде нежели придет он к двери, отверзаешь ему, прежде нежели припадет, простираешь к нему руку, прежде нежели источит слезы, повергаешь на него щедроты Свои, прежде нежели исповедует долги свои, даешь ему прощение.
        cn: 作为全知者，主啊，祢看见人以何等甘心乐意的态度离弃罪恶，并且，在他来到门前之前，祢就为他敞开；在他俯伏之前，祢就向他伸出手；在他流出眼泪之前，祢就将祢丰厚的恩惠倾倒在他身上；在他承认自己的亏欠之前，祢就赐给他赦免。
    - type: paragraph
      text:
        ru: 'Не обвиняешь и не говоришь: «Куда расточил имение?» Не поминаешь, сколько прогневал Тебя своим развращением, не упрекаешь за пренебрежение благодеяний Твоих, но, предвидя смирение, плач и сердечное расположение, возглашаешь: «Выньте одежду первую и облецыте его, заколите тельца упитанного на упокоение и веселие! Пусть соберутся Ангелы и радуются обретению погибшего сына и возвращению заблудшего наследника!»'
        cn: 你不责备，也不说：「你把产业挥霍到哪里去了？」你不记念他曾如何以放荡激怒了你，也不责备他曾轻蔑你的恩惠。但是，你预见到他的谦卑、他的哀哭以及他内心的回转，便宣告说：「把那上好的袍子拿出来给他穿上，把肥牛犊牵来宰了，为了安歇和欢庆！让天使们聚集，并且欢喜快乐，因为失丧的儿子被寻回，因为迷途的后嗣已然归来！」
    - type: paragraph
      text:
        ru: Как встречают купца, возвратившегося домой с великим богатством, так благодать Твоя приемлет грешника, от всей души к Тебе приходящего. Ибо любит видеть слезы, жаждет видеть покаяние, радуется рачительности старающихся покаяться.
        cn: 就像人们迎接一位带着巨大财富归家的商人一样，你的恩典也照样接纳全心全意来到你面前的罪人。因为它喜爱看见眼泪，渴望看见悔改，并为那些努力悔改之人的殷勤而喜悦。
    - type: paragraph
      text:
        ru: Слава долготерпению и милосердию Твоему, Владыко Человеколюбие!
        cn: 荣耀归于祢的恒久忍耐和慈悲，上主，爱好人类者！
  - type: heading2
    text:
      ru: Непостоянство воли и нетвердость решимости
      cn: 意志的善变和决心的不坚定
    children:
    - type: paragraph
      text:
        ru: Страшен и ужасен день Суда Твоего, Спаситель наш, когда откроются греховные тайны! Посему трепещу, Господи, и объемлюсь ужасом, ибо грехи мои превзошли меру. Будь ко мне милостив по щедротам Твоим, о Благой и Благосердый!
        cn: 您的审判日是何等可怖又可畏，我们的救主啊，届时，罪恶的隐秘都将显露！因此我战栗，主啊，我被恐惧所笼罩，因为我的罪愆已逾越限度。求您按着您的丰盛怜悯待我，啊，良善又慈悲的那一位！
    - type: paragraph
      text:
        ru: Смотрю я, Господи, на грехи свои и сетую, видя их многочисленность. Увы, как это постигло меня такое бедствие? Язык мой говорит прекрасно, а поведение мое срамно и презренно. Горе мне в тот день, когда откроются тайны!
        cn: 主啊，我看着我的罪孽，又见它们如此众多，便不禁悲叹。唉！这样的灾祸是如何临到我的？我的舌头言语美好，而我的行为却可耻又卑劣。在那隐秘之事被揭露的日子，我有祸了！
    - type: paragraph
      text:
        ru: Весьма прекрасны слова мои для других, а дела мои отвратительны. Других учу порядку в мире, а сам, несчастный, предаюсь страсти.
        cn: 我的言语对他人而言极其美好，然而我的行为却可憎。我教导他人世上的秩序，然而我自己，这个不幸的人，却沉溺于情欲。
    - type: paragraph
      text:
        ru: Все дни мои протекли и исчезли во грехах, и ни одного дня не служил я правде. Едва начинал каяться с намерением более не грешить, как приходил лукавый и уловлял меня по ненависти своей. Горе мне, потому что добровольно попадаюсь в сеть его!
        cn: 我所有的日子都在罪中流逝消逝，并且我没有一天服事过公义。我刚一开始悔改，存着不再犯罪的心志，恶者便来了，因着他的憎恨诱捕了我。祸哉我！因为我自愿落入他的网罗！
    - type: paragraph
      text:
        ru: Если выйду пройтись, то выступаю как праведник и мудрец. Увижу ли, что иной грешит, смеюсь и издеваюсь над ним. Увы, обнаружатся и мои беззакония, и посрамлюсь!
        cn: '如果我出去走走，我就表现得像个义人和智者。

          如果我看见别人犯罪，我就嘲笑他，讥讽他。

          唉，我的罪孽也将显露出来，我就要蒙羞了！'
    - type: paragraph
      text:
        ru: О, лучше бы мне не рождаться на свет! Тогда не развратил бы меня этот преходящий мир, не видя его, не сделался бы я виновным, не осквернил бы себя грехами и не боялся бы истязания, суда и мучения.
        cn: 啊，我宁愿不曾降生于世！如此这转瞬即逝的世界就不会败坏我，不曾见过它，我就不致有罪，不会以罪玷污自身，也就不必惧怕拷打、审判和苦楚了。
    - type: paragraph
      text:
        ru: Едва даю я обет принести покаяние, как снова возвращаюсь и впадаю в те же грехи. Радует меня час, проведенный в грехе, и думаю еще, что делаю похвальное. Увы мне! Доселе не помышлял я, что ожидает меня геенна.
        cn: 我才刚一发誓要悔改，就又故态复萌，陷入同样的罪中了。在罪中度过的时光竟令我欢喜，我甚至还以为我所做的是值得称赞的。唉，我真是可怜啊！至今我竟未曾想到，地狱正等着我。
    - type: paragraph
      text:
        ru: Лукавая воля вводит меня в грех, но когда согрешу, слагаю вину на сатану. Но горе мне! Потому что сам я – причина грехов моих. Лукавый не заставит меня насильно согрешить, грешу я по своей воле.
        cn: 邪恶的意愿引我入罪，但当我犯罪时，却将罪责归咎于撒但。但我真有祸了！因为我自身才是我的罪的原因。那恶者不会强迫我犯罪，我犯罪是出于我自己的意愿。
    - type: paragraph
      text:
        ru: Умилосердись ко мне, Милосердый к кающимся! Прости мне вины мои по множеству благости Твоей. Приими, Господи, слезы, приносимые Тебе мною, и очисти меня от грехов, как грешницу. Сознаю, Господи, что согрешил я, пощади меня по щедротам Твоим!
        cn: '求你怜悯我，你这怜悯悔改者的！

          求你照你丰盛的良善赦免我的罪愆。

          主啊，求你接纳我向你献上的泪水，并像洁净一个女罪人一样，洁净我脱离罪恶。

          主啊，我承认我犯了罪，求你照你丰盛的慈悲宽恕我！'
  - type: heading2
    text:
      ru: Со слезами ко врачу – и исцелит
      cn: 含泪来到医者面前，祂必医治。
    children:
    - type: paragraph
      text:
        ru: Приидите, взыщем щедрот, пока возможно для нас искать их. Место покаяния – в этом, преходящем мире, а в том, непреходящем мире, не будут приняты ни молитвы, ни слезы.
        cn: 来吧，让我们寻求怜悯，趁着我们尚能寻求之时。悔改之地在此必朽坏的世界，而在那永恒不灭的世界，祷告和泪水都将不被接纳。
    - type: paragraph
      text:
        ru: Грешница слезами, какие пролила, уничтожила рукописание грехов своих. И ты, грешник, возьми с собой и принеси в дар слезы; воздыхая, воззови ко Господу, и тотчас простит тебе долги твои.
        cn: 罪妇以她所流的泪水，抹去了她罪债的字据。你这罪人啊，也带着泪水，并献上泪水为礼物；叹息着呼求主，主就立刻赦免你的债。
    - type: paragraph
      text:
        ru: 'Как дар Христу Господу принеси, кающийся, слезы и ударяй себя в перси, как оный мытарь, который, воздыхая, молился и говорил: «Милостив буди, Господи, мне грешному, прогневавшему Тебя!»'
        cn: 悔改的人啊，将眼泪作为献给基督主的一份礼物呈上，并捶打自己的胸膛，像那位税吏一样——他曾叹息着祷告说：「主啊，求你怜悯我这个得罪了你的罪人！」
    - type: paragraph
      text:
        ru: Вот дверь отверста и ждет возвращения твоего, грешник. Возвратись ко Господу Твоему, оставь путь непотребства, встань и вступи на стезю к Царствию.
        cn: 看哪，门已敞开，等待你的归来，罪人。回归你的主，离弃不道德的道路，起来，踏上通往天国的路径。
    - type: paragraph
      text:
        ru: Открылась у тебя греховная язва, если замедлишь, она всецело погубит тебя. Врач твой многоискусен, покажи Ему язву свою, слезно плачь у двери Его, побуди Его щедроты, чтобы уврачевал тебя.
        cn: 你的罪之疮疤已显露，若你迟延，它必将彻底毁灭你。你的医者经验丰富，向他展示你的疮疤，在他门前流泪哭泣，激发他的怜悯，好使他医治你。
    - type: paragraph
      text:
        ru: О Благой, за нас предавший Себя на распятие и смерть, чтоб искупить нас, избавь душу раба Твоего от множества грехов его, да вознесет он глас благодарения Тебе и Отцу Твоему и Духу Твоему Святому!
        cn: 哦，良善者啊，为我们舍己，受钉十字架而死，为要救赎我们，求你拯救你仆人的灵魂，脱离他众多的罪愆，使他得以向你、向你的父以及你的圣灵发出感恩之声！
  - type: heading2
    text:
      ru: Крайне худ я, но по милости Твоей дай покаяться и избавь от осуждения!
      cn: 我极其败坏，但凭你的怜悯，赐我悔改，并救我脱离定罪！
    children:
    - type: paragraph
      text:
        ru: К Тебе взываю, Господи, не презри жалкого прошения моего! К Тебе простираю оскверненные руки, не отринь меня, кающегося, но человеколюбно воззри на меня и приими с благосердым благоутробием!
        cn: 我呼求你，主啊，不要藐视我卑微的祈求！我向你伸出污秽的双手，不要弃绝我这悔改的人，但要以仁爱垂顾我，并以慈悲的怜悯接纳我！
    - type: paragraph
      text:
        ru: Осквернил я себя сластью греховной, обесчестил душевную красоту, поработился плотским мудрованиям, погубил прежнее владычество, послушав врага-наветника, затмил светлость естества своего и, имея честь сыновства (Богу), уподобился скотам несмысленным.
        cn: 我因罪恶的甘甜玷污了自己，玷辱了灵魂的美丽，为肉体的思虑所奴役，丧失了先前的统管权，听从了那谗谤的仇敌，遮蔽了自己本性的光明，并且，享有作上帝儿女的尊荣，却变得如同无悟性的牲畜。
    - type: paragraph
      text:
        ru: Объемлет меня страх, трепет и ужас, когда представлю смертное посечение, неприметно приближающееся ко всякому, – и всё же остаюсь неисправляющимся.
        cn: 恐惧、战兢和惊骇笼罩着我，每当我想到那无声无息逼近每一个人的死亡截断时，我却依然故我，不思悔改。
    - type: paragraph
      text:
        ru: Будь милостив ко мне, Человеколюбец! В Тебе едином полагаю всю мою надежду. Даруй мне покаяться и, исправившись, принести плоды покаяния, чтобы, когда придет конец, не был я посечен, как бесплодное древо, или предан огню, как плевелы, но, как пшеница, был собран в житницу Твою.
        cn: 求你怜悯我，爱人者！我唯独将我一切的希望寄托于你。求你赐我悔改，并改过自新，结出悔改的果子，以便在末期来临时，我不致于像不结果子的树那样被砍伐，或像稗子那样被丢进火里，而是像麦子一样，被收进你的仓里。
    - type: paragraph
      text:
        ru: Колена, сердце преклоняю, не дерзая воззреть на небо. Приими моление нечистых уст, единый Безгрешный Создатель мой! Ты, Царь всяческих, низложивший мятежного велиара, избавь меня от всяких беззаконий! Ангелы и смертные, увидя мое обращение, составят праздник во славу Твою.
        cn: 我屈膝，心怀谦卑，不敢仰望上天。我独一无罪的造物主啊！求您垂纳我这不洁之口的恳求吧！您这万有之君，曾击败叛逆的彼列，求您救我脱离一切罪恶！天使和世人，看见我的悔改，将为颂扬您的荣耀而欢庆。
    - type: paragraph
      text:
        ru: Презрел я животворные заповеди Твои, обольстился делами срамными, но, Благой Владыко, не погнушайся избавить меня от рабства лукавого.
        cn: 我轻忽了您赐生命的诫命，被可耻的行为所诱惑。但是，良善的上主，求您不要厌弃，拯救我脱离邪恶的奴役。
    - type: paragraph
      text:
        ru: 'Весь я сделался рабом греховной сласти, осквернил тело и душу, каждый день вопию: «Согрешил!» – и не перестаю делать худое. И стою ныне пред Тобой, яко осужденный.'
        cn: 我整个人都成了罪恶甘饴的奴仆，玷污了身体和灵魂，每天呼喊着：「我犯了罪！」——却又不停地作恶。而今，我站在祢面前，如同一个被判了罪的人。
    - type: paragraph
      text:
        ru: Даруй мне, Благой, отпущение в злых делах моих как милостивый и человеколюбивый Бог.
        cn: 赐予我，良善者，赦免我所犯的恶行，因为祢是慈悲爱人的上帝。
  - type: heading2
    text:
      ru: Ради слез очисти грехи и дай крепость, да посрамится враг!
      cn: 为着泪水，洁净罪过，并赐予刚强，好使仇敌蒙羞！
    children:
    - type: paragraph
      text:
        ru: Кто уврачует душу мою, если не Ты, единый Врачу душ Христе? У кого найду врачевство от болезней душевных, если не у Тебя, Источника исцелений? Уврачевавший недужную, уврачуй и мою душу, погубленную грехами!
        cn: '谁能医治我的灵魂，若不是祢，独一的灵魂医者，基督啊？

          我能从谁那里寻得灵魂疾病的医治，若不是从祢，医治的泉源啊？

          祢曾医治患病的，也医治我的灵魂吧，这被罪恶所毁损的灵魂啊！'
    - type: paragraph
      text:
        ru: Да снидут на меня щедроты Твои и да помогут мне низложить врага моего! Подкрепи мышцей Твоей меня, немощного, – и лукавый посрамится, увидев, что готов я на брань. Воодушеви меня – и враг устыдится и в стыде обратится вспять, а я прославлю имя Твое.
        cn: '愿您的恩慈降临于我，并帮助我降伏我的仇敌！

          求您用您的膀臂坚固我这软弱的，那恶者看见我已预备争战，就必蒙羞。

          求您激励我，我的仇敌就必羞愧退却，我便要荣耀您的圣名。'
    - type: paragraph
      text:
        ru: Приими слезы убожества моего и изгладь рукописание долгов моих – и снова посрамится враг, видя, что милосердие Твое уничтожило плод трудов его злых и я не буду наказан.
        cn: 求祢垂纳我卑微的泪水，抹去我罪债的契据——仇敌就必再次蒙羞，因它看见祢的慈悲已败坏它一切恶行的果子，而我也不至受罚。
    - type: paragraph
      text:
        ru: Щедроты Твои да приидут в помощь мне, чтобы безопасно прейти мне страну искушений и потом навсегда пребыть близ Тебя и с Тобой.
        cn: 愿祢的恩慈临到我，帮助我，使我能平安地经过试探之地，然后永远在你身边，与你同在。
    - type: paragraph
      text:
        ru: Душа грешная будет славословить Тебя и Отца Твоего и Духа Святого, потому что плакала она – и услышана и, омытая слезами покаяния, соделана храмом, в коем вселилось Божество, сотворившее миры.
        cn: 有罪的灵魂将要颂扬祢、祢的父及圣灵，因为她流泪了——并蒙垂听；且被悔改的泪水涤净，成为殿宇，其中内住着创造诸世界的神性。
  - type: heading2
    text:
      ru: Жалоба на мир и молитва об извлечении из него
      cn: 对世界的抱怨和求脱离世界的祷告
    children:
    - type: paragraph
      text:
        ru: 'Никаких выгод не приносишь ты любителям своим, мир, жилище скорбей. Всех приближенных своих обольщаешь сокровищами и всякими удовольствиями, но в день смерти и благообразие красивых, и крепость сильных низвергаешь во гроб. Горе тому, кто любит тебя и любим тобой: его радости превращаются в вопли.'
        cn: 世界啊，你这忧伤的居所，你丝毫未给爱你的人带来益处。你用财宝和各样享乐引诱所有亲近你的人，但在死亡之日，你却将俊美者的华美和强壮者的力量一同投入坟墓。祸哉，爱你的并受你所爱的人：他的喜乐必变为哀哭。
    - type: paragraph
      text:
        ru: 'В мире – этом море грехов – все дни мои протекли напрасно: жизнь моя проходила без пользы для меня, даже забывал я о дне смертном, кружился и собирал себе бремя грехов, рукояти плевел, назначенных на сожжение. И вот – плач и воздыхание ожидают меня в оной стране, исполненной ужасов.'
        cn: 在这世上——这罪恶的海洋——我所有的日子都虚度了：我的生命于我无益地流逝着，我甚至忘记了死期，我打转忙碌着，为自己积攒了罪孽的重担，那些注定要被焚烧的稗子的捆。而今——在那充满惊骇的国度里，哀哭和叹息正等待着我。
    - type: paragraph
      text:
        ru: 'Поелику с юности до старости моей любил я тебя, коварный мир, то время жизни моей прошло для меня незаметно, и се во грехах похищает меня смерть. О, если бы не вступать мне в тебя, мир, обманывающий всякого входящего! Любящие тебя не наслаждаются радостями, и ненавидящие тебя не плачут. Блажен, кто расторг твои сети: он наследует чертог радости!'
        cn: 既然我从年少到暮年都爱慕着你，诡谲的世界啊，我的生命时光便在我不知不觉中逝去，而今死亡竟在罪中将我掳掠而去。唉，但愿我未曾进入你啊，世界，你欺哄着每一个进入你的人！爱慕你的人并未享受到喜乐，恨恶你的人也并未哭泣。挣脱你网罗的人有福了：他将承受喜乐的殿堂！
    - type: paragraph
      text:
        ru: Мир сей видом своим обманывает и мудрых, потому что на несколько времени кажется вожделенным, даже ссужает благами и сокровищами, но в день смерти берет их назад, воздаст же мучением, несравненно большим наших грехов. Малое время позволяет он грешить, а в награду даст вечную тьму.
        cn: 今世以其外表欺骗甚至智者，因为它暂时显得令人向往，甚至借予福乐和财宝，但在死亡之日，它会将这些收回，并回报以远超我们罪孽的痛苦。它只容许人短暂地犯罪，却以永恒的黑暗作为奖赏。
    - type: paragraph
      text:
        ru: Праведен Ты, Господи, и праведен суд Твой, осуждающий мир и миролюбцев! Молюся убо Тебе, да десница Твоя, извлекшая Симона из моря, и меня извлечет из волн и мятежей восстающего на меня мира. Погряз я в тине, потопляют меня воды мира, не дают мне изникнуть и перевести дыхание. Крест Твой, Господи, да будет мне жезлом и опорой в пути, которым иду!
        cn: 主啊，祢是公义的，祢审判世界和爱世界之人的判决也是公义的！因此我向祢祈祷，愿祢曾将西蒙从海中拉出的右手，也能将我从那向我兴起的世界的波涛和骚乱中拉出。我已深陷泥沼，世界的洪流将我淹没，不让我露出头来，也无法喘息。主啊，愿祢的十字架成为我所行路上的杖和倚靠！
  - type: heading2
    text:
      ru: Непрочность благ мира. Побуждение к отчуждению от него
      cn: 世俗福益的易逝性。劝勉人与其疏离。
    children:
    - type: paragraph
      text:
        ru: Как прекрасен мир, но полон смерти!
        cn: 世界何等美丽，但充满死亡！
    - type: paragraph
      text:
        ru: 'Он подобен цветку, развернувшемуся в весенний месяц: цветет, пока роса и дождь поддерживают в нем жизнь; настал зной – и цвет увядает. Так смерть заставляет блекнуть ланиты и прекрасно сложенные члены разрушает во гробе. Даруй нам, Господи, прибежище и защиту в стране, где обитают праведные!'
        cn: 他如同花朵，在春月里绽放：开放着，只要露水和雨水维持着它的生命；酷热一到，花朵就凋零。死亡也同样使面颊失色，并将匀称优美的肢体在坟墓中摧毁。主啊，求你赐予我们避难所和庇护，在义人所居住的国度里！
    - type: paragraph
      text:
        ru: Мир объюродел в чадах своих. Они грешат, мятутся, обуреваются собственными своими волнениями. Как многие из них кружатся, не зная себе покоя, но собирают терния для огня! Нечестие надменно отверзает свои уста, истина безмолвна и молчит. Беззаконие витийствует, а правда скрывается. Только смерть заставляет умолкать всех вступивших в мир. Блажен, кто совершил в нем путь и не погряз!
        cn: 世界在它的儿女中变得愚妄了。他们犯罪，心神不安，被自身的纷扰所困扰。他们中有多少人，兜兜转转，不得安宁，却为火堆收集荆棘啊！不敬虔傲慢地张开其口，真理却沉寂无声，默然不语。不法之事雄辩滔滔，而公义却隐匿不现。唯有死亡使所有进入世界的人缄默。蒙福的是那在世间行完路程且未曾沉沦的人！
    - type: paragraph
      text:
        ru: Мир много бурнее мутящихся волн и сильнее возмущается грехами, нежели море ветром. Бывает время, что воды морские спокойны, когда ветры сокроются в свои сокровищницы, – но в мире непрестанно мятутся волны вожделений, и ветр обмана дует в двери судей его. Впрочем, близок день, в который он стихнет. Блажен, кто совершил в нем путь и не попал в его сети!
        cn: 世界远比翻腾的波涛更为汹涌，其因罪孽而起的骚动，远甚于海因风而起的激荡。有时，海水也会平静，当风藏匿于其宝库之中时——但世间却欲望之波涛不息翻腾，欺骗之风吹入其审判者之门。然而，其平息之日已近。蒙福哉，凡在其间行完了路程，未曾落入其网罗者！
    - type: paragraph
      text:
        ru: Волнуется и мятется беззаконие, совершаемое в мире; сильнее волн свирепеют в мире распаленные похоти; тенета и сети опутывают тех, которые служат ему; грехи и беззакония – вот их лукавые бремена. Но для добродетельных приближается время, когда корабль их упокоится в пристани.
        cn: 世上的不法动荡不安，骚乱不休；炽烈的私欲比波涛更甚地在世间肆虐；罗网与陷阱缠绕着那些服事它的人；罪恶与不法——这便是他们狡诈的重担。然而，对有德之人而言，他们的船只得享港湾安歇的时刻临近了。
    - type: paragraph
      text:
        ru: Приятны времена и лета твои, мир, но они – как дым. Ты подобен летучему сновидению, и дни твои – то же, что тень, вечер твой проходит скоро, утро твое непродолжительно, часы твои наперегонки бегут к концу... Спеши, грешник, получить прощение, пока светит для тебя дневной свет!
        cn: 世间啊，你的时日和岁月何其宜人，然而它们如同烟。你如同飞逝的梦境，你的时日亦如阴影；你的黄昏匆匆而过，你的清晨转瞬即逝，你的时辰竞相奔向终结……罪人啊，赶快求得宽恕，趁着白昼之光仍为你照耀！
    - type: paragraph
      text:
        ru: 'Праведен Судия, праведен и суд правды, на нем взвесятся и вознаградятся дела каждого по достоинству: делавшие беззаконие будут в тот день мучиться раскаянием, а подвижники добродетелей в той стране насладятся радостью. Милостью Твоей побуждаемый Господи, даруй мне высвободиться из сетей мира, чтобы безопасно вступить в пристань жизни!'
        cn: 公义的审判者，公义的也是真理的审判，在此之上，各人的行为将按其当得的被衡量并得到奖赏。行不法之事的人，在那日将受悔恨的煎熬，而修德者则在那国度享受喜乐。主啊，蒙祢慈悲的激励，求祢恩准我挣脱世界的网罗，以便我能平安地进入生命的港湾！
  - type: heading2
    text:
      ru: Уроки жизни
      cn: 生命的课程
    children:
    - type: paragraph
      text:
        ru: Иосиф, оросив душу памятованием о Вседержителе, не воспламенился беззаконным огнем и, победив искушение, сделался царем Египта.
        cn: 约瑟，以对全能者的记念滋润灵魂，未被不法的火焰点燃，并且战胜了诱惑，成为了埃及的王。
    - type: paragraph
      text:
        ru: Пойдем путем тесным и прискорбным, чтобы, соделавшись досточестными, иметь нам хранителем своим Бога.
        cn: 我们当行走在狭窄而悲苦的道路上，好使我们得以成为配受尊荣的人，并以上帝为我们的守护者。
    - type: paragraph
      text:
        ru: Жемчужины сберегаются всегда в самых внутренних сокровищницах, а негодное, как сор, выбрасывается даже и на улицу.
        cn: 珍珠总是被珍藏在最深层的宝库里，而无用的东西，像糠秕一样，甚至被抛到街上。
    - type: paragraph
      text:
        ru: Очисти себя покаянием от срамных дел – и не будет устрашать тебя укоризна злоречивого.
        cn: 以悔改洁净自己，远离可耻的行为——你就不会惧怕诽谤者的指责。
    - type: paragraph
      text:
        ru: С помощью божественного огня должны мы противиться огню (страстей). Так кирпич, пока не обожжен, бывает нетверд и ломок, а когда побывает в огне и обожжется, тогда делается преградой огню и воде.
        cn: 我们必须借助神圣之火来抵挡情欲之火。正如砖块，若未被烧制，便是软弱易碎的；但当它经历火的烧制之后，便能成为火和水的屏障。
    - type: paragraph
      text:
        ru: Прилагай старание не раболепствовать собственной своей воле, но будь послушен боящимся Господа, и по милости Божией сокрушишь главу змиеву.
        cn: 努力不要作自己意志的奴仆，但要顺服敬畏主的人，并且藉着上帝的怜悯，你将击碎蛇的头。
    - type: paragraph
      text:
        ru: Терпи скорбь о Господе, чтоб объяла тебя радость. Перенеси труд, чтобы получить обильную награду.
        cn: 为主忍受苦楚，好叫喜乐将你环抱。忍受劳苦，以便获得丰厚的奖赏。
    - type: paragraph
      text:
        ru: Не осмеивай и не осуждай впадшего в искушение, но чаще молись, чтобы самому не впасть в искушение.
        cn: 不要嘲笑或论断陷入试探的人，但要常常祷告，以免自己也陷入试探。
    - type: paragraph
      text:
        ru: У кого сердце омрачено бурей помыслов и побеждено страстями, тот и человека не стыдится, и Бога не боится.
        cn: 谁的心被思虑的狂风暴雨所蒙蔽，又被情欲所胜，那人就不羞于人，也不畏惧上帝。
    - type: paragraph
      text:
        ru: Молись чаще со смиренным сердцем и не делай из себя вертепа разбойников, предаваясь непотребным помыслам и пожеланиям, чтобы не постыдиться в день Суда, когда откроются тайны человеческие.
        cn: 更常带着谦卑的心祷告，不要让自己成为贼窝，沉溺于不洁的念头和欲望，以免在审判日，当人的隐秘显露时蒙羞。
    - type: paragraph
      text:
        ru: Кто нерадив во время жатвы, у того дом не будет в обилии. И кто теперь небрежен, тот во время воздаяния останется без утешения праведных.
        cn: 凡在收割时不尽心的，他的家必不丰裕。而现在疏忽的，在报偿之时将得不到义人的慰藉。
- type: heading1
  text:
    ru: Отделение двенадцатое
    cn: 第十二部
  children:
  - type: heading2
    text:
      ru: Уврачуй, Господи, на посрамление врага!
      cn: 主啊，求你医治，好叫仇敌蒙羞！
    children:
    - type: paragraph
      text:
        ru: Господи! Покажи на мне великое Твое милосердие и дай мне ослабу от угнетений губителя, ибо, изъязвив меня, стоит он и насмехается надо мной!
        cn: 主啊！求你将你伟大的怜悯彰显在我身上，并赐我摆脱那毁灭者压迫的解脱，因为他已伤害了我，还站在那里嘲笑我！
    - type: paragraph
      text:
        ru: Как, пробужденный учениками, одним словом уст Своих укротил Ты море, так услышь стенание и вопль мой, укроти волны страстных движений, возбуждаемых в душе моей врагом спасения моего.
        cn: 正如你被门徒唤醒，用你口中的一句话平息了大海，照样，求你垂听我的呻吟和哀号，平息那由我救恩的仇敌在我灵魂中激起的情欲的波浪。
    - type: paragraph
      text:
        ru: Как одним прикосновением к воскрылию одежды Твоей уврачевалась кровоточивая и тотчас стал ток крови ее, так да уврачуется душа моя, из которой враг непрестанно источает токи греховных помышлений, ради единого моего прикосновения верой к Тебе, Врачу душ и телес.
        cn: 就像那患血漏的妇人，仅因一次触碰祢衣裳的䍁子，便得了医治，她的血流也立刻止住；愿我的灵魂也照样得以医治，我的灵魂，仇敌不断从中倾泻出罪恶思念的洪流，仅因我以信心触碰祢，祢，灵魂与身体的医治者。
    - type: paragraph
      text:
        ru: Покажи на уврачевании членов моих, изъязвленных врагом, врачевательную силу веры в Тебя – Целителя всех недугов. Сделай язвы не язвами и место их покрой добродетелями, да посрамится враг, радовавшийся погибели моей.
        cn: 在你医治我那被仇敌所创伤的肢体上，彰显那信靠你——一切病患的医治者——的信心，所具有的医治大能。使这些创伤不再是创伤，并以美德覆盖其处，好使那曾因我的沉沦而欢喜的仇敌蒙受羞辱。
    - type: paragraph
      text:
        ru: Благодать же Твою, Безгрешный Агнец, закланный за спасение мира и умиротворивший небо и землю, выну будет восхвалять спасенный Тобой и обрадованный раб Твой!
        cn: 蒙您所救赎并蒙您所喜悦的仆人，必将永远颂扬您的恩典，啊，无罪的羔羊，您为拯救世人而被宰献，又使天地得享太平！
  - type: heading2
    text:
      ru: Плач от созерцания горькой участи, ожидающей грешника
      cn: 默观罪人所等待之苦楚命运的哀恸
    children:
    - type: paragraph
      text:
        ru: Когда увидел Ты, Господи наш, что утратил я славу Твою, не потерпела сего любовь Твоя. Ты, снисшед рождением Твоим, страданием Твоим и крестной Твоей смертью избавил меня от сатаны.
        cn: 当你，我们的主，看到我失去了你的荣耀，你的爱不容许此事。你，降临，借着你的诞生、你的受难以及你十字架上的死亡，将我从撒旦手中解救出来。
    - type: paragraph
      text:
        ru: Но вот я опять грешил, прогневлял Тебя, оскорблял имя Твое беззакониями, грехами и злодеяниями, соделанными мною. Горе мне, неблагодарен был я и осквернил себя множеством злых дел!
        cn: 然而，我却再次犯了罪，惹祢发怒，并以我所行的不法、罪恶和恶行，亵渎了祢的名。我真有祸了，我曾是忘恩负义的，并且以众多的恶行玷污了我自己！
    - type: paragraph
      text:
        ru: Плакал и проливал я горькие слезы, когда пришел в размышление о сем. Оно переселило меня в огонь, привело в страну ужаса, перенесло в страшную и ужасную бездну, погрузило в пламень, ввергло во тьму. Сердце мое ощутило сие, и воздыхал я от страха и ужаса при мысли о сем переселении.
        cn: '当我默想此事时，我哭泣，流下苦涩的泪水。

          它将我迁移到火中，引领我进入恐怖之境，带入可怕而可怖的深渊，沉入烈焰，投入黑暗。

          我的心感受到了这一切，思及这次迁移时，我因恐惧与惊骇而叹息。'
    - type: paragraph
      text:
        ru: 'Уносясь мыслями, рассматривал я жилище тьмы. Тогда с рыданием и плачем, скорбя и болезнуя, осуждал я сам себя и горько восклицал: «Горе мне, сугубое горе! Что уготовано мне правдой?»'
        cn: 我心神驰骋，审视着黑暗的居所。于是，我泪流满面，哀声哭泣，悲伤痛苦地谴责自己，并悲切地大声喊道：「我真有祸了，祸患深重！公义为我预备了什么呢？」
    - type: paragraph
      text:
        ru: 'В ужасе пробудился я, как от сна, но не избавился тем от сердечных мучений. Растерзал я одежду свою, плакал и рыдал: «Что сделал я с собой, бедным?» Открою главу свою, подобно блуднице исповедаюсь во грехах своих, с воздыханием буду умолять, обращу очи свои в слезные источники, чтоб оплакивать себя, злосчастного.'
        cn: 我惊恐地醒来，仿佛从梦中，但却未因此摆脱心灵的苦楚。我撕裂了我的衣服，哭泣并哀号：「我这可怜人，对我自己做了什么？」我要敞开我的心思，像个娼妓般忏悔我的罪过，带着叹息恳求，我要让我的双眼化作泪泉，好为我这不幸的人哀哭。
    - type: paragraph
      text:
        ru: Пойду к подобным мне мытарям, пойду к грешникам, которые покаялись, пробужу спящее сердце свое, заматеревшее во множестве зол, к ним присоединюсь, им уподоблюсь. Как они, стану рыдать о соделанных мною грехах, чтобы не приходить мне на Божий Суд и не мучиться в бездне гееннской!
        cn: 我要去找像我一样的税吏，我要去找那些已经悔改的罪人，唤醒我那沉睡的心，它已在众多的邪恶中变得刚硬，我要加入他们，效法他们。我要像他们一样，为我所犯的罪而哭泣，以免我降临到上帝的审判中，并在地狱的深渊里受苦！
    - type: paragraph
      text:
        ru: Сподоби меня, Господи, возлюбить любовь Твою, в которой святые и праведные находят себе утешение и не любят ничего чуждого Тебе, Боже, благоволящий к кающимся, любящий грешника, который лицо свое орошает слезами и горько оплакивает преступление свое! Сподоби меня, Господи, того благословенного конца, который уготовал Ты для всех святых!
        cn: 求你施恩使我，主啊，热爱你的爱，在其中圣徒和义人得享安慰，并且不爱任何与你相异的事物。神啊，你恩待悔改者，爱那以泪水沾湿其面、并为自己的罪过苦苦哀哭的罪人！求你施恩使我，主啊，得享你为所有圣徒所预备的、那蒙福的结局！
  - type: heading2
    text:
      ru: Наша слабость и изменчивость и твердость святых
      cn: 我们的软弱和反复无常，以及圣徒的坚定
    children:
    - type: paragraph
      text:
        ru: Милостив буди, о Благой, к нашему злому изволению, этой вине всех бед. Мысли его – это болезни тайные, а дела – болезни явные. От него произошло первое преступление заповеди, имевшее последствием все грехи. Ты, Чистый, очисти свободу нашу, сама по себе она – мутный источник.
        cn: 哦，良善者，求你怜悯我们邪恶的意愿，这乃是诸祸之因。它的思想是隐秘的病痛，而行为则是显明的病痛。从它而来的是对诫命的首次违犯，其后果乃是所有的罪。哦，纯洁者，求你洁净我们的自由意志，它本身就是一个混浊的源泉。
    - type: paragraph
      text:
        ru: 'Дивлюсь свободной воле нашей: она сильна – и, однако ж, низложена; она властелин – и стала рабой; имеет возможность побеждать – и любит уступать над собой победу; хотя свободна, однако же сама отдается в рабство, как невольница, и своей рукою пишет согласие на свое невольничество.'
        cn: 我惊叹于我们的自由意志：它强大——然而却被贬抑；它是主宰——却成了奴隶；它有能力战胜——却喜欢让别人胜过自己；虽然它自由，然而它却自愿沦为奴役，如同一个女奴，并亲手写下同意书，自愿成为奴隶。
    - type: paragraph
      text:
        ru: Благословенной да будет память праведников, которые пребыли твердыми! Они не изменялись, как луна, но уподоблялись солнцу, свет которого всегда одинаков. Дух их не был подобен дождевым потокам, которые то полны, то вдруг иссыхают.
        cn: 愿义人的纪念蒙福，他们坚忍不拔！他们不像月亮那样变幻无常，却如同太阳，其光芒始终如一。他们的灵性不像雨水洪流，时而充盈，时而骤然干涸。
    - type: paragraph
      text:
        ru: Волны искушений всякого рода устремлялись на праведников, но они не изнемогали. И слава не надмевала их, и поношение не доводило их до уныния. Всегда были они одинаковы – никогда не терялось благоухание высоких добродетелей их.
        cn: 各样试探的波涛冲击着义人，但他们从未衰弱。荣耀不使他们自高自大，羞辱也不使他们陷入沮丧。他们总是始终如一——他们崇高美德的馨香从未消散。
    - type: paragraph
      text:
        ru: Благословен Благой, Который из сокровищ Своих источал благоухание дел их! Благословен Правосудный, Который венцами прославил подвиги их!
        cn: '蒙福哉至善者，祂从自己的宝库中倾流他们德行的馨香！

          蒙福哉公义者，祂以冠冕荣耀了他们的属灵功德！'
  - type: heading2
    text:
      ru: И неотступное прошение слышится при условии обещания доброго произволения
      cn: 不住的祈求，在承诺良善意愿的条件下，得蒙垂听。
    children:
    - type: paragraph
      text:
        ru: Увы, стыжусь тех, которые теперь уважают меня, чтобы не быть постыженным пред ними (там) за сокровенные грехи мои, стыжусь родивших меня, чтобы со временем не осудили они меня, давшего обет жить не по-мирскому.
        cn: 唉，我羞愧于那些现在敬重我的人，以免有朝一日，我因自己的隐秘罪愆而在他们面前（在那里）蒙羞；我羞愧于生养我的人，以免日后他们定我——这曾许下不按世俗生活誓愿的人——的罪。
    - type: paragraph
      text:
        ru: 'Хочу стать подобным той вдове, которая, долго беспокоив судью, достигла цели своей. Хочу оказаться пред Тобой, Преблагим Владыкой моим, подобным неотвязному другу, чтоб обратил Ты душу мою, плененную грехами: тот просил хлеба на утоление голода, а я прошу душевного утешения, тот просил плотской пищи, а я прошу воззвания души.'
        cn: 我愿效法那位寡妇，她长久缠磨着法官，最终达到了自己的目的。我愿来到祢面前，我至善的君王啊，像一个不依不饶的朋友，为的是祢能回转我这被罪所掳掠的灵魂：他是为解除饥饿而求饼，而我所求的是灵魂的安慰，他所求的是肉体的食粮，而我所求的是灵魂的唤醒。
    - type: paragraph
      text:
        ru: Как Благой и Преблагой, услышь глас слезного плача моего и обрати меня, чтобы принес я плод покаяния! Ороси запаление совести моей, обнови меня, состарившегося в греховных страстях, чтобы, освободившись от рабства их, приятно вздохнуть мне воздухом свободы и с радостью и веселием прославить благость Твою!
        cn: 作为良善又至善者，垂听我含泪的哀哭之声，并使我回转，好让我结出悔改的果实！滋润我良心的灼热，更新我这在罪恶情欲中日益衰老之人，好使我从其奴役中得以释放，得以惬意地呼吸自由的空气，并以喜乐和欢欣颂扬你的恩慈！
    - type: paragraph
      text:
        ru: 'Знаешь, Владыко, что осмеливаюсь вещать это пред Тобой с готовностью души на труд, хотя малый. Ибо знаю я, грешный, что благоутробен Ты, Господи, и хочешь, чтоб я переменился; желателен Тебе и плод произволения: готов Ты помиловать меня, но ожидаешь моего доброго расположения, ибо, милуя, хочешь обучить меня добру и, прощая, желаешь сделать меня достойным причастия Царства Твоего.'
        cn: 祢知道，主宰啊，我敢在祢面前述说此事，我的灵魂已准备好付诸辛劳，哪怕是微小的。因为我这罪人知道，祢是满有慈悲的主啊，并且祢希望我能改变；祢也悦纳我自由意志的果实：祢已准备好宽恕我，但祢期待我良善的意愿，因为祢在施怜悯时，希望教导我行善，并在赦免时，渴望使我配得与祢的国度有份。
  - type: heading2
    text:
      ru: О сне безмятежном
      cn: 关于宁静的睡眠
    children:
    - type: paragraph
      text:
        ru: Даруй мне, Господи, и когда бодрствую, чистым предстоять Тебе, Искупитель мой, и когда сплю, вкушать сон без греха.
        cn: 主啊，求祢赐予我，无论我醒着，都能以纯洁之身侍立在祢——我的救赎主——面前；抑或我睡着，都能享受无罪的睡眠。
    - type: paragraph
      text:
        ru: Если, бодрствуя, совершу беззаконие, да буду очищен благодатью Твоей, Господи, и если согрешу во время сна, да будет мне очищением милосердие Твое.
        cn: 如果我清醒时犯下罪孽，主啊，愿我能蒙祢的恩典得洁净；如果我在睡梦中犯罪，愿祢的怜悯成为我的洁净。
    - type: paragraph
      text:
        ru: Крестом уничижения Твоего соделай сон мой безмятежным, предохрани меня от беззаконных сонных мечтаний и от нечистых представлений воображения; даруй мне всю ночь проводить в покойном сне, и да не возобладают мною лукавые и порочные помышления.
        cn: 藉祢降卑的十字架，使我的睡眠安宁，保守我脱离不法的梦境，以及想象中不洁的幻象；赐我一夜安稳睡眠，不让诡诈和邪恶的意念胜过我。
    - type: paragraph
      text:
        ru: Животворящим Телом Твоим, которое вкушал я, предохрани меня от нечистой похоти, да возлягу и усну в покое. Кровь Твоя да сохраняет меня. И душе моей, которая есть Твой образ, даруй свободу, приличную образу Твоему, и тело мое, созданное руками Твоими, да покрывает десница Твоя.
        cn: 你赐予生命的圣体，我所领受的，求你保护我免受不洁的贪欲，使我安然躺卧并入睡。你的宝血，求你保守我。并且赐予我的灵魂——这灵魂是你的肖像——与你肖像相称的自由；我的身体是你亲手所造的，愿你的右手遮盖它。
    - type: paragraph
      text:
        ru: 'Стеной щедрот Твоих закрой меня, как оборонительным щитом, и когда тело мое покоится и спит, благость Твоя да будет стражем моим, чтобы к ложу моему не приблизился лукавый. Предстательством родившей Тебя Матери, жертвой, которая принесена Тобой за всех, умоляю: отжени сатану, чтобы не тревожил меня.'
        cn: 愿你丰盛恩典的墙环绕我，如同防御的盾牌，当我的身体安息入睡时，愿你的良善成为我的守望者，以免那恶者靠近我的卧榻。藉着生养你的母亲的代祷，并藉着你为众人所献的牺牲，我恳求：求你驱逐撒旦，使他不再搅扰我。
    - type: paragraph
      text:
        ru: На мне, Господи, исполни обетование Твое и крестом охраняй жизнь мою. Тебя восхвалю по пробуждении своем, потому что мне, бедному, оказал Ты любовь Свою. И спящие, почивающие в покое, и бодрствующие, ограждаемые оружием Твоим, да воздадут хвалу Тебе, живущий вечно Хранитель, возбудивший меня на славословие Твое!
        cn: 主啊，愿您在我身上成就您的应许，并用十字架守护我的生命。我在苏醒之际要赞美您，因为您向贫乏的我施予了您的爱。愿安息熟睡者，和蒙您兵器护卫的警醒者，都将赞美归于您，永活的守护者，是您唤醒我来颂赞您！
  - type: heading2
    text:
      ru: Проси со слезами прощения, но прежде сам прости
      cn: 带着眼泪祈求饶恕，但首先，你自己要饶恕。
    children:
    - type: paragraph
      text:
        ru: 'Уста Твои, Господи наш, обещали и изрекли: «Призовите – и услышу, ударяйте в дверь – и отверзу».'
        cn: 我们的主啊，祢的口应许并说出：「呼求，我必垂听；敲门，我必开门。」
    - type: paragraph
      text:
        ru: 'Подобно грешнице взываем к Тебе: «По преизбыточествующим щедротам милосердия Твоего прости нам долги и грехи наши!»'
        cn: 如同那罪妇，我们向您呼求：「凭着您极其丰盛的怜悯与恩慈，赦免我们的亏欠和罪过！」
    - type: paragraph
      text:
        ru: 'Как оный мытарь, умоляем Тебя и, как сын, расточивший имение свое, с душевным покаянием взываем к Тебе: «Согрешихом на небо и пред Тобою, Господи!»'
        cn: 如同那位税吏，我们向你祈求，又如同那耗尽家产的儿子，我们带着由衷的悔改向你呼求：「主啊，我们得罪了天，又得罪了你！」
    - type: paragraph
      text:
        ru: Приими нас, как Сам обещал, и да возрадуются о нас и Ангелы Хранители, и архангелы. Ты, принявший покаяние Симоново, приими и покаяние рабов Твоих и помилуй нас!
        cn: 接纳我们，如你亲自应许的，愿守护天使和大天使都因我们而欢欣。你曾接纳西门的悔改，也请接纳你仆人的悔改，并怜悯我们！
    - type: paragraph
      text:
        ru: Приступи, грешник, согрешивший пред Господом, приступи к Нему с душевным покаянием – и Он простит тебе долги и грехи Твои.
        cn: 近前来吧，罪人，你这在主面前犯了罪的，带着发自灵魂的悔改近前来吧——祂必赦免你的亏欠和罪过。
    - type: paragraph
      text:
        ru: Проливай слезы у дверей Врача, с воздыханиями умоляй Его, покажи Ему струпы, какие на душе твоей.
        cn: 倾洒泪水在医者门前，带着叹息恳求祂，向祂显明你灵魂上的创伤。
    - type: paragraph
      text:
        ru: Охраняй язык твой от всякого зла, и уста твои, сотворенные для хвалы, да не произносят хульного слова.
        cn: 守护你的舌头，使其远离一切邪恶；而你的口，受造是为了颂赞，切勿发出亵渎之言。
    - type: paragraph
      text:
        ru: Прости брату своему, если согрешил он против тебя, и Христос простит тебе, как обещал, по милосердию Своему.
        cn: 赦免你的弟兄，如果他得罪了你，基督必将赦免你，正如他所应许的，按照他的怜悯。
    - type: paragraph
      text:
        ru: Помилуй нас, Господи наш, прости нам долги и грехи наши и сподоби нас чертога Твоего пресветлого!
        cn: 我们的主啊，求你怜悯我们，赦免我们的亏欠和罪，并使我们配得你那至光明的殿堂！
  - type: heading2
    text:
      ru: Помилуй прежде, нежели постигли меня последняя моя!
      cn: 求你怜悯，趁着我的末了还未临到我！
    children:
    - type: paragraph
      text:
        ru: Прежде нежели колесо времени совершило для меня обращение свое, помилуй меня.
        cn: 在时间之轮为我转动一周之前，求你怜悯我。
    - type: paragraph
      text:
        ru: Прежде нежели подул на меня ветр смерти и в теле моем появились болезни, предвещающие близкий конец, помилуй.
        cn: 在死亡之风吹到我身上，以及我身体里出现预示着临近终结的疾病之前，求你怜悯。
    - type: paragraph
      text:
        ru: Прежде нежели величественное солнце померкло для меня в высоте, помилуй, и да воссияет для меня свет Твой свыше и да рассеет страшную тьму ума моего.
        cn: 在威严的太阳从高处为我黯淡之前，求你怜悯，并愿你的光从高处为我照耀，驱散我心智的可怕黑暗。
    - type: paragraph
      text:
        ru: Прежде нежели персть возвратилась в землю и стала гнилостью и все черты красоты ее истлели, помилуй.
        cn: 在尘土归于大地，化为腐朽，并且其一切美丽的特征都已朽坏之前，求你怜悯。
    - type: paragraph
      text:
        ru: Прежде нежели грехи мои предварили меня на Суде и посрамили пред Судией, помилуй меня, исполненный щедрот Господи.
        cn: 在我的罪孽于审判前抢先我，并在审判者面前使我蒙羞之前，怜悯我，充满怜悯的主啊。
    - type: paragraph
      text:
        ru: Прежде нежели воинства вышли, предшествуя Сыну Цареву, чтобы собрать бедный род наш к престолу Судии, помилуй.
        cn: '在众天军出动之前，

          走在君王之子前头，

          为要招聚我们这贫苦的族类

          到审判者的宝座前，

          求祢怜悯。'
    - type: paragraph
      text:
        ru: Прежде нежели прозвучит глас трубы пред Пришествием Твоим, Господи наш Иисусе, пощади рабов Твоих, умоляющих Тебя, и помилуй.
        cn: 在祢降临前号角吹响之前，我主耶稣啊，求祢怜恤恳求祢的仆人，并怜悯。
    - type: paragraph
      text:
        ru: Прежде нежели заключил Ты дверь Твою для меня, Сын Божий, и соделался я пищей неугасимого огня в геенне, помилуй меня.
        cn: 在你向我关上你的门，神的儿子啊，并且在我成为地狱里那不灭之火的食物之前，怜悯我。
  - type: heading2
    text:
      ru: Уроки жизни. Блаженства
      cn: 生命的教训。真福八端
    children:
    - type: paragraph
      text:
        ru: Блажен, кто помышляет о множестве почивающих в гробах и отверг всякую зловонную похоть, потому что восстанет он во славе, когда прозвучит небесная труба, имеющая пробудить всех сынов человеческих.
        cn: 有福的，是那默想坟墓中安息的众人，并弃绝一切污秽情欲的人，因为他将在荣耀中复活，当那属天的号筒吹响时，那号筒将唤醒所有世人。
    - type: paragraph
      text:
        ru: Блажен, кто имеет надежду не на человека, но на Господа, грядущего паки со славой многой судить вселенную в правде, потому что будет он как древо, растущее при водах, и не перестанет приносить плод.
        cn: 有福了，那不将希望寄托于人，而是寄托于主的人，主将带着丰盛的荣耀再次降临，以公义审判普世。因为他必像一棵栽在水旁的树，并且不断结果子。
    - type: paragraph
      text:
        ru: Блажен, у кого ум стал по благодати как облако, полное дождя, и напояет души смертных к возращению плодов жизни, потому что благодать будет ему в вечную похвалу.
        cn: 有福了，那人的心智因着恩典，成了满载雨水的云朵，浇灌凡人的灵魂，使之结出生命的果实；因为恩典将成为他永远的赞美。
    - type: paragraph
      text:
        ru: Блажен трезвящийся всегда по Богу, потому что в день Суда будет он защищен Самим Богом и, став сыном брачного чертога, в радовании и веселии увидит Жениха.
        cn: 蒙福的是那常常按着上帝警醒自守的人，因为在审判之日，他将蒙上帝亲自护佑，并成为婚筵的儿子，在喜乐和欢愉中得见新郎。
    - type: paragraph
      text:
        ru: Блажен, кто возненавидел и оставил всё человеческое житие и у кого все помышления о Едином Боге.
        cn: 有福了，那憎恶并离弃了凡属人的生活，并且其全部思虑都系于独一真神的人。
    - type: paragraph
      text:
        ru: Блажен, кто возненавидел грех зловредный и гнушается им, возлюбил же Единого Благого и Человеколюбивого Бога.
        cn: 有福的，是那憎恨作恶的罪并憎恶它，却爱了独一、良善、仁慈的上帝的人。
    - type: paragraph
      text:
        ru: Блажен, кто на земле уподобляется Ангелу небесному и подражает серафимам, постоянно имея непорочные мысли.
        cn: 蒙福的，是那在地上效法天上天使，并效法撒拉弗，常常怀有纯洁意念的人。
    - type: paragraph
      text:
        ru: Блажен, кто стал непорочен пред Богом и чист от всех скверн – от помыслов и дел лукавых.
        cn: 有福了，那在神面前成为纯全，并洁净脱离一切污秽的——无论是意念还是诡诈的行为。
- type: heading1
  text:
    ru: Отделение тринадцатое
    cn: 第十三章
  children:
  - type: heading2
    text:
      ru: Исповедание искупления и молитва о Церкви
      cn: 认信救赎与为教会祷告
    children:
    - type: paragraph
      text:
        ru: Хвала щедротам Твоим, Христе, Царь наш, всеми поклоняемый Сын Божий! Ты – Царь наш, Ты – Бог наш, Ты – Виновник нашей жизни и великое наше упование!
        cn: 赞美您的丰盛恩慈，基督，我们的君王，万民所敬拜的上帝之子！您是我们的君王，您是我们的上帝，您是我们生命的创始者，以及我们伟大的盼望！
    - type: paragraph
      text:
        ru: Единодушно восхваляют Тебя и горние сонмы, и дольние чины, и Тебе благодарную воспевают песнь, потому что Ты, Сокровенный, напоследок времени явился в нашей плоти.
        cn: 上界众军与下界万民同心合意地赞美祢，并向祢献上感恩之歌，因为祢，那隐秘者，在末世显现于我们的肉身中。
    - type: paragraph
      text:
        ru: Когда подвиглись щедроты Твои и благоугодно стало любви Твоей, пришел Ты для нашего искупления и освободил род наш.
        cn: 当你的恩慈涌动，且你的爱蒙了悦纳之时，你便为我们的救赎而来，并释放了我们人类。
    - type: paragraph
      text:
        ru: Ты уврачевал болезни наши, очистил грехи наши и по щедротам Твоим воскресил бывших мертвыми.
        cn: 祢医治了我们的疾病，洁净了我们的罪孽，并按着祢的丰盛怜悯，使那些已死之人复活了。
    - type: paragraph
      text:
        ru: Ты основал на земле Святую Церковь по образу Горнего Царства, Ты создал ее любовью, насадил щедротами, обручился с ней духовно, стяжал ее страданием Своим.
        cn: 你照着属天国度的样式，在地上建立了圣教会，你以爱创造了她，以丰盛栽种了她，与她属灵地订婚，以你的受难赢得了她。
    - type: paragraph
      text:
        ru: Но ненавистник человечества по бесстыдной дерзости своей нападает на нее в лице своих служителей.
        cn: 但人类的仇敌，凭着他无耻的狂妄，借着他的仆人攻击她。
    - type: paragraph
      text:
        ru: Не оставь, Господи, без попечения Твоего Церковь Твою Святую, чтобы не оказалось тщетным изреченное Тобою обетование о неодолимости ее!
        cn: 主啊，不要离弃你的圣教会，不施你的看顾，免得你所说出的关于它不可战胜的应许显得徒然！
    - type: paragraph
      text:
        ru: Не попусти, чтоб обезображена была благолепная красота ее и расхищено было богатство ее!
        cn: 求你不要让她的荣美被损毁，也不要让她的财富被掠夺！
    - type: paragraph
      text:
        ru: Исполни обетование Твое, данное Петру; что сказал Ты, запечатлей то самым делом.
        cn: 成就祢赐给彼得的应许；祢所说的，就用行动印证。
    - type: paragraph
      text:
        ru: Утверди врата ее, укрепи запоры ее, воздвигни рог ее, вознеси главу ее.
        cn: 坚固她的城门，加固她的门闩，兴起她的角，高举她的头。
    - type: paragraph
      text:
        ru: Благослови сынов ее, сохраняй чад ее, дай мир священникам ее и низложи зложелателей ее.
        cn: 祝福她的众子，守护她的众子女，赐予她的众司祭平安，并降服她的恶意仇敌。
    - type: paragraph
      text:
        ru: Посели в ней мир Твой и отжени от нее лукавые расколы.
        cn: 使你的平安安住其中，并从其中驱逐邪恶的分裂。
    - type: paragraph
      text:
        ru: Даруй нам проводить мирное и безмятежное житие во страхе Твоем.
        cn: 赐予我们度过一个平安而宁静的生活，在您的敬畏之中。
    - type: paragraph
      text:
        ru: Да храним веру нашу с великим упованием и совершенной любовью.
        cn: 愿我们怀着极大的盼望和完全的爱来持守我们的信仰。
    - type: paragraph
      text:
        ru: Да благоугодна Тебе будет жизнь наша и да обрящем щедроты Твои в день воздаяния.
        cn: 愿我们的生命蒙你悦纳，并愿我们在那报应之日得蒙你的恩慈。
    - type: paragraph
      text:
        ru: Непрестанно да возносим хвалу Тебе, Господи, и Отцу Твоему и Духу Святому.
        cn: 愿我们不住地赞美祢，主啊，以及祢的父，和圣灵。
  - type: heading2
    text:
      ru: Будь милостив к нам и к отшедшим!
      cn: 求祢怜悯我们和已逝者！
    children:
    - type: paragraph
      text:
        ru: Милосердый к грешникам, будь милостив и к нам в день Суда; оставь нам долги наши по милосердию Твоему и в день явления Твоего сподоби нас чертога Твоего.
        cn: 怜悯罪人的主啊，在审判日也求你怜悯我们；照着你的怜悯，赦免我们的债；在你显现的日子，恩准我们进入你的婚筵厅。
    - type: paragraph
      text:
        ru: Когда сонмы судимых вострепещут пред правосудием и в страхе будут предстоять обнаженными, тогда, Судия мой, помилуй меня, потому что я славословил Тебя.
        cn: 当蒙审判的万众在公义面前战栗，并且在恐惧中赤身露体地站立时，那时，我的审判者啊，求你怜悯我，因为我曾颂扬你。
    - type: paragraph
      text:
        ru: Когда заградятся там уста мудрых и будет угрожать мощный и страшный скипетр Твой, тогда да отверзутся уста мои, потому что я исповедал Тебя.
        cn: 当那里智者的口被封住，你的大能可畏的权杖发出威胁时，愿我的口被开启，因为我认信了祢。
    - type: paragraph
      text:
        ru: Когда не спасет ни друг, ни приятель и всякий обнаженным повлечен будет к отчету, тогда, Господи, будь моим Ходатаем, потому что на Тебя уповал я.
        cn: 当朋友和相识之人均无法拯救，并且每个人都将赤身裸体被带去交账之时，那时，主啊，求祢作我的代求者，因为我唯独仰赖祢。
    - type: paragraph
      text:
        ru: Когда возгремит глас трубы, содрогнутся племена и предстанет всякий приять воздаяние по трудам своим, тогда, Господи, будь моим Заступником, потому что к Тебе прибегаю.
        cn: 当号角声鸣响，列邦战栗，人人都将站立，按着各人所行的领受报偿时，那时，主啊，求你作我的护卫者，因为我投奔于你。
    - type: paragraph
      text:
        ru: Приими служение наше, Господь горних и надежда дольних, и помилуй нас.
        cn: 领受我们的事奉，高天之主，地上之人的盼望，并怜悯我们。
    - type: paragraph
      text:
        ru: Будь милостив к нам, Господи, будь милостив к родителям нашим, будь милостив к наставникам нашим, будь милостив к собратиям нашим.
        cn: 求你怜悯我们，主啊，求你怜悯我们的父母，求你怜悯我们的导师，求你怜悯我们的弟兄们。
    - type: paragraph
      text:
        ru: Будь милостив к нам, Господи, и упокой усопших наших и всех умерших, которые исповедовали Тебя, веровали в Тебя, вкушали Плоть Твою и пили Животворящую Кровь Твою.
        cn: 主啊，求你怜悯我们，并求你使我们已故的亲人，以及所有向你认信、信靠你、领受了你的圣体并饮了你赐生命宝血的逝者安息。
    - type: paragraph
      text:
        ru: Сподоби нас вместе с овцами Твоими войти в овчий двор Твой и вместе со святыми Твоими в веки веков воздавать величию Твоему подобающую похвалу.
        cn: 求你恩准我们与你的羊群一同进入你的羊圈，并与你的圣徒一同，直到永永远远向你的伟大献上合宜的赞美。
  - type: heading2
    text:
      ru: К Богородице о внутреннем духовном благонастроении
      cn: 致圣母：关于内在的属灵安和心境
    children:
    - type: paragraph
      text:
        ru: Благая Матерь всеблагого Бога, призри милостивым оком Твоим на молитву недостойного раба Твоего и даруй мне сокрушение, тишину помыслов, постоянство мысли, ум целомудренный, трезвение души, смиренный образ мыслей, святолепное настроение духа, нрав благоразумный и мир душевный, который Господь даровал ученикам Своим.
        cn: '全善之神的至善之母，

          求祢以慈目垂顾祢不配的仆人之祷告，

          并赐予我：

          忧伤痛悔，

          意念的宁静，

          心志的恒定，

          贞洁的心智，

          灵魂的警醒，

          谦卑的心思，

          圣洁的灵性心境，

          审慎的品格，

          以及主赐予祂门徒的灵魂平安。'
    - type: paragraph
      text:
        ru: Изгладь рукописание грехопадений моих, рассеки облаки печали моей, мглу и смятение помыслов, удали от меня бурю и смятение страстей, расширь сердце мое духовным расширением, возвесели меня радостью и даруй, чтобы правыми путями заповедей Сына Твоего шел я верно и с неукоризненной совестью проходил непоползновенное житие.
        cn: 涂抹我罪愆的笔录，驱散我忧愁的云雾，我思想的迷雾与纷乱，挪去我情欲的暴风与扰乱，以属灵的开广拓宽我的心，以喜乐使我欢欣，并求你恩赐，使我坚定不移地走你圣子诫命的正路，以无可指责的良心，过着不跌倒的生活。
    - type: paragraph
      text:
        ru: Даруй мне, молящемуся пред Тобой, и чистую молитву, чтобы невозмутимым умом и неблуждающим размышлением всегда приносил я молитву в честь, славу и величание Единородного Сына Твоего, Господа нашего Иисуса Христа.
        cn: 求祢赐予我，在你面前祷告的我，纯洁的祷告，好使我能以平静的心灵和不游荡的思虑，总能献上祷告，为着尊荣、荣耀和颂扬祢的独生子——我们的主耶稣基督。
  - type: heading2
    text:
      ru: Душа сама увлекается – враг не непреодолим
      cn: 灵魂自行被引诱——敌人并非不可战胜。
    children:
    - type: paragraph
      text:
        ru: О, какое у меня бесчувствие! Какая грубая, поземленевшая душа у меня! О сердце развращенное, уста, исполненные горечи, гортань – гроб отверстый!
        cn: 哦，我何等的麻木不仁！我这灵魂是何等粗糙，何等泥土般的！哦，败坏的心啊，充满苦涩的口啊，喉咙啊，敞开的坟墓！
    - type: paragraph
      text:
        ru: Почему не помнишь ты, душа, о неизбежном пути разлучения твоего? Почему не готовишься к сему шествию? Зачем без жалости к себе приближаешься к погибели? Для чего навлекаешь на себя вечные мучения? Что ты делаешь, душа, живя, как несмысленное бессловесное?
        cn: '灵魂啊，你为何不记念你那不可避免的分离之路？

          你为何不为此行程作预备？

          你为何不怜悯自己，而趋向沉沦？

          你为何招致永恒的折磨临到自己身上？

          灵魂啊，你活着像无知无言的生灵一般，究竟在做什么？'
    - type: paragraph
      text:
        ru: Увы, как это я вместо света избираю тьму? Как это удовольствие, которое сегодня у меня есть и которого завтра не будет, предпочитаю я вечным и неизреченным благам?
        cn: 唉，我为何舍光明而取黑暗呢？我怎能如此，偏爱那些今日我拥有、明日却不复存在的快乐，而不选择那永恒且不可言喻的福祉呢？
    - type: paragraph
      text:
        ru: Увы, как вместо солнцезрачной оной ризы соглашаюсь лучше быть облеченным в ризу темную и мрачную? Как предпочитаю Царству бедственное вселение во аде?
        cn: 唉，我怎能舍弃那光辉如日的袍子，却情愿披上黑暗阴沉的袍子呢？我怎能宁愿在地狱里悲惨栖身，而舍弃天国呢？
    - type: paragraph
      text:
        ru: Увы мне, грешному! Я сам собой, добровольно, с ведением ввергаю себя в конечную пагубу!
        cn: 哀哉我这罪人！我竟凭着自己，甘心乐意地，明知地将自己投入最终的沉沦！
    - type: paragraph
      text:
        ru: Прииди же наконец в себя, душа моя, убойся Бога и начни с мужеством шествовать путем заповедей Его!
        cn: 我的灵魂啊，终于回转到自己里面吧，敬畏上帝，并鼓起勇气，行走在祂诫命的道路上！
    - type: paragraph
      text:
        ru: Уразумей, душа, что век сей подобен поприщу и хитрый змий всеми мерами усиливается одержать победу. Иными он бывает низложен и поруган, а иных сам низлагает и предает поруганию.
        cn: 灵魂啊，当明白，此生犹如赛场，诡诈之蛇竭尽一切手段，力图得胜。他被一些人击败、蒙受羞辱；而他自己，则击败另一些人，使其蒙受羞辱。
    - type: paragraph
      text:
        ru: Одни, обманутые им, преодолеваются, а другие вступают с ним в борьбу и увенчиваются. Одни, вкусив от него горечь, достигают приятностей вечной жизни, а другие, вкусив от его сластей, обретают горечь вечного мучения.
        cn: 有些人被它欺骗，被其胜过；而另一些人则与它争战，并得冠冕。有些人尝了它的苦涩，便达致永生的甜美；而另一些人尝了它的甜美，却获得了永恒折磨的苦涩。
    - type: paragraph
      text:
        ru: Одни крайним отрешением от всего удобно приобретают над ним верх, а другие по причине привязанности к земному легко им преодолеваются. Для любящих Бога от всей души ничего не значит брань с ним, а для любящих мир она трудна и неодолима.
        cn: 一些人通过极端地割舍一切，便能轻而易举地胜过它；而另一些人则因依恋属世之物，轻易地被它制服。对于全心全意爱主的人，与它争战算不得什么；而对于爱世界的人，这场争战却是艰难且无法克服的。
    - type: paragraph
      text:
        ru: Пойми, жалкая душа, что радость, роскошь и покой века сего исполнены печали и горести, а скорби, лишения и самоозлобления доставляют неизглаголанную радость и вечную жизнь.
        cn: 当明白，可怜的灵魂，今世的喜乐、奢华与安宁充满着悲伤和愁苦，而苦难、匮乏与自我苦待却带来无法言喻的喜乐和永生。
    - type: paragraph
      text:
        ru: Решись вступить в путь тесный и прискорбный и подвизайся в безмолвии, чтобы, когда придет час смерти и разлучения, не оказаться тебе неготовой.
        cn: 决心步入那狭窄而痛苦的道路，并在寂静中努力修持，以免当死亡与分离的时刻来临时，你却毫无准备。
  - type: heading2
    text:
      ru: Ночные слезы
      cn: 夜泪
    children:
    - type: paragraph
      text:
        ru: 'На ложе моем помыслил я о Тебе, Человеколюбец, и в полночь восстал прославить благость Твою. Привел себе на память долги и грехи свои – и пролил потоки слез. Ободряли меня разбойник, мытарь, Мария-грешница, хананеянка, а также кровоточивая и самарянка при кладезе водном. Они говорили мне: «Восстань, умоляй о щедротах – Господь твой исполнен щедрот!»'
        cn: 在我的卧榻上，我思念着祢，仁爱者，我在半夜里起来，颂扬祢的慈恩。我忆起我的亏欠与罪愆，便泪流如注。强盗、税吏、罪妇马利亚、迦南妇人，以及患血漏症的妇人，和井旁的撒玛利亚妇人，他们激励着我。他们对我说：「起来吧，恳求恩慈——你的主充满恩慈！」
    - type: paragraph
      text:
        ru: 'Давид, сын Иессеев, взывал мне в псалмах своих, пробудил меня от сна, бременившего члены мои, и сказал мне: «Восстань, человек, что спишь? Судия в полночь приемлет дары – встань, молись и проси себе прощения. Милосердый Господь возрадуется о тебе. Дверь Его день и ночь отверста кающимся».'
        cn: 大卫，耶西的儿子，在他的诗篇中向我呼唤，唤醒我脱离那使我肢体沉重不堪的沉睡，并对我说：「起来吧，人啊，你为何沉睡不醒？审判者在午夜时分接纳献礼——起来，祷告，并为自己祈求赦免吧。慈悲的圣主必为你欢喜。祂的门日夜向悔改者敞开着。」
    - type: paragraph
      text:
        ru: 'Ночью, покоясь на ложе своем, приводил я себе на память долги и грехи свои, тогда ужас объял меня, и я воззвал: «Увы, наступает уже грозная ночь и всякого света лишенная тьма! У кого жизнь беззаконна, тот не возрадуется в день воскресения, но без конца пребудет во тьме».'
        cn: 夜晚，我安歇在自己的床上，回想自己的过犯和罪孽，恐惧便笼罩了我，我便呼喊道：「唉，那可怕的夜晚和全然没有亮光的黑暗已经来临了！凡生活不法的人，在复活的日子将不会欢喜，却会永无止境地留在黑暗里。」
    - type: paragraph
      text:
        ru: 'И Давид бодрствовал ночью на ложе своем, помышлял о беззаконии своем и исповедовал грехи свои. Ночью омочал он постель свою слезами очей своих и с воздыханиями умолял, говоря: «Беззакония моя, Господи наш, аз знаю и грех мой предо мною есть выну, Тебе Единому, Господи, согреших, помилуй мя!»'
        cn: 于是大卫在他的卧榻上彻夜警醒，默想自己的罪孽，并忏悔自己的罪恶。夜间他用自己眼中的泪水浸湿了他的卧榻，带着叹息恳求说：「我的罪孽，我们的主啊，我深知，我的罪恶常在我面前。我唯独得罪了你，主啊，求你怜悯我！」
    - type: paragraph
      text:
        ru: Тебя призываем, Отец, Сын и Дух Святой, Тебя умоляем день и ночь, пощади нас. По множеству щедрот Твоих очисти беззакония и грехи наши, даруй нам, Господи, душевное и телесное здравие, избавь нас от лукавого и от силы его, от пут его и от всех сетей его и не отказывай нам ни днем ни ночью в щедротах Твоих!
        cn: '我们呼求祢，父、子和圣灵，我们昼夜恳求祢，怜悯我们。

          照着祢丰盛的恩慈，洁净我们的罪孽和罪恶，主啊，赐予我们灵魂与身体的健康。

          救我们脱离那恶者和他的权势，脱离他的羁绊和他一切的陷阱，并且昼夜不绝地向我们施予祢的恩慈！'
  - type: heading2
    text:
      ru: День и ночь бодрствуй в молитве, чтобы не застал внезапно день смерти
      cn: 昼夜在祷告中警醒，以免死亡之日突然临到。
    children:
    - type: paragraph
      text:
        ru: Пробудимся от сна, с воздыханием воззовем ко Господу, день и ночь будем трудиться, заботясь об исправлении своем, пока продолжается еще жизнь наша, пока не пришло еще время, после которого не будет и места покаянию. Будем бодрствовать при дверях Жениха, чтобы с Женихом войти нам в чертог Его и наследовать вечную жизнь. Приидите и ночью будем воспевать все хвалу Богу и подражать сонмам Ангелов, которые непрестанно восхваляют Его. И Спаситель наш, когда подвигнется и приидет, сопровождаемый Ангелами, видя бодрствование и бдение наше, наименует нас благими рабами и посадит за Трапезу Свою.
        cn: 让我们从沉睡中醒来，带着叹息呼求主，日夜辛劳，专注于自身的修德，趁着我们生命尚存，在那悔改无门之时未到之前。我们要在新郎的门前警醒守候，好与新郎一同进入他的婚筵殿堂，并承受永生。来吧，即使在夜间，我们也要歌颂赞美神，并效法众天使，他们不住地赞美祂。而我们的救主，当祂被天使簇拥着到来之时，看到我们的警醒和守夜，将称我们为良善的仆人，并让我们入席，与祂同享筵席。
    - type: paragraph
      text:
        ru: 'С праведными, день и ночь благоугождавшими Богу, будем подвизаться в добре, просить щедрот у Господа нашего и, воспевая с Давидом, говорить: «Полунощи восстах исповедатися Тебе о судьбах правды Твоея, пощади и помилуй меня и сподоби наследовать Царство Твое».'
        cn: 与那些日夜蒙神喜悦的义人，我们要在善中竭力奋斗，向我们的主祈求恩慈，并与达味一同歌唱，说：「我半夜起来称谢祢，为了祢公义的典章，怜恤并怜悯我，并使我配承受祢的国度。」
    - type: paragraph
      text:
        ru: Не престану восхвалять Тебя, Господи наш, непрестанно буду славословить Тебя, да не осудит меня правда Твоя. Знаю, сколько виновен я. Знаю, что если накажешь меня по грехам моим, то наследие мое – геенна, потеряна тогда будет вся надежда, умолкнет моление мое. Посему помилуй меня и отпусти долги мои.
        cn: 我必不住地赞美祢，我们的主啊，我必不停地颂扬祢，免得祢的公义定我的罪。我知道我有多么大的罪过。我知道，如果祢按我的罪孽惩罚我，那么我的产业就是地狱，那时所有的希望都将丧失，我的祈祷也将止息。因此，求祢怜悯我，并免我的债。
    - type: paragraph
      text:
        ru: Поползнулся я и пал в грехи – простри ко мне десницу Твою, и я восстану, как грешница в дому Симона, как разбойник на кресте. Помилуй меня, Милосердый к грешникам!
        cn: 我失足堕入罪中——请向我伸出你的圣手，我就能重新站立，如同西门家中的罪妇，如同十字架上的强盗。求你怜悯我，啊，慈悲待罪人者！
  - type: heading2
    text:
      ru: 'Плачь: дни проходят, а там – мытарства'
      cn: 哭泣吧：时日流逝，而彼处是空中收费站。
    children:
    - type: paragraph
      text:
        ru: Увы мне, беспечному! Увы мне, нерадеющему о спасении! Увы мне, грешащему с ведением! Знаю, что делаю зло, – и не уклоняюсь от зла. Увы мне, ибо нет мне оправдания! По словам причисляюсьодесную, а по делам стою ошуюю.
        cn: '哀哉我这漫不经心之人！

          哀哉我这不殷勤于救恩之人！

          哀哉我这明知而犯罪之人！

          我知道我作恶，却不偏离恶。

          哀哉我，因为我毫无辩白之词！

          按着言语，我被归入右边，而按着行为，我却站在左边。'
    - type: paragraph
      text:
        ru: 'Тебе, Господи, единому Благому и Непамятозлобному, исповедую грехи мои. Если б и умолчал я – Ты, Господи, знаешь всё, и ничто не сокрыто пред очами Твоими. Но поскольку Ты, Господи, сказал чрез пророка: Говори ты грехи твои прежде, чтоб оправдаться (Ис. 43:26), то скажу: «Согреших, Господи, и несмь достоин воззрети и видети высоту небесную от множества неправд моих».'
        cn: 主啊，我向祢——这唯一良善和不记恶的——忏悔我的罪。即便我保持沉默，主啊，祢也知晓一切，在祢的眼前，没有什么能被隐藏。但因为主啊，祢藉着先知说：「你要述说你的罪愆，好使你得称为义」（以赛亚书 43:26），那么我就说：「我犯了罪，主啊，且因我众多的不义，不配仰望并看见天上的高处。」
    - type: paragraph
      text:
        ru: Что же мне делать, беднейшему из людей? Буду плакать о себе день и ночь, пока есть время принятию слез. Даруй мне слезы сокрушения, Господи, единый Благой и Милостивый, чтобы слезами сими испросить мне у Тебя очищения от сердечной скверны.
        cn: 我该怎么办呢，人中最贫乏的我？我要为自己日夜哭泣，趁着还有时间让我的眼泪蒙受悦纳。主啊，独一的良善与慈悲者，求你赐给我痛悔的眼泪，好叫我藉着这些眼泪向你恳求，洁净我心中的污秽。
    - type: paragraph
      text:
        ru: Увы, согрешила ты, душа моя! Покайся, ибо вот дни наши проходят, как тень. Еще немного, и пойдешь ты отсюда, страшными местами проходить будешь, душа моя, не отлагай же день за днем обращения своего ко Господу.
        cn: 唉！我的灵魂啊，你犯了罪！悔改吧，因为看哪，我们的日子如影逝去。再过不久，你就要从此处离去，我的灵魂啊，你将经过可怕之地，所以就不要日复一日地耽延你归向上主。
    - type: paragraph
      text:
        ru: Увы мне, душа моя! Нечистыми делами отогнала ты от себя милость Божию. Не давай же себе покоя, день и ночь припадая к Благому и Человеколюбивому, чтобы даны были тебе с высоты благодать и милость.
        cn: 唉，我的灵魂啊！你以不洁的行径，将上主的恩慈从自身驱离了。所以，不要容自己有片刻安息，日夜俯伏于那良善而爱世人的主面前，为使恩宠与慈悲自高天赐予你。
  - type: heading2
    text:
      ru: Уроки жизни
      cn: 生命的课程
    children:
    - type: paragraph
      text:
        ru: Наступит для нас время, исполненное страха и трепета, в которое откроется всё, что сделано каждым втайне и во тьме, – и горе душе, которая не имеет Помощником Господа!
        cn: 对我们而言，将有一个充满恐惧与战栗的时刻临到，届时，每个人在隐秘与黑暗中所行的一切都将显露出来，——那么，没有主作为帮助者的灵魂，就有祸了！
    - type: paragraph
      text:
        ru: Воздыхает сердце мое, и глаза мои вожделевают слез, но грех мой содержит в плену мой ум, чтобы не пришел я в сокрушение и не стал умолять Господа не ввергать меня во тьму кромешную.
        cn: 我的心叹息着，我的眼目渴望泪水；但我的罪孽将我的心智掳去，使我无法痛悔，也不能向主恳求不要将我投入外面的黑暗。
    - type: paragraph
      text:
        ru: Пока есть у нас силы, поработаем Господу в правоте сердца, чтобы во время скорби иметь Его своим Помощником, избавляющим нас от всяких бед!
        cn: 趁我们仍有力量，就让我们以正直的心服事上主，为的是在患难之时，能有祂作为我们的帮助者，将我们从一切患难中拯救出来！
    - type: paragraph
      text:
        ru: Как идущий со светильником светит тем, которые с ним, так светит и добродетель, которая всегда носит с собой славу.
        cn: 就像一个提着灯行走的人照亮那些与他同行的人，同样，美德也照亮他人，因为它总是带着荣耀。
    - type: paragraph
      text:
        ru: Пока не положишь в уме своем, что ты преставился уже от жизни сей, и не будешь на мир сей и на славу его взирать как на разоренную кущу, до тех пор невозможно преодолеть земные страсти и мирские похоти, которые погружают человека во всегубительство и погибель.
        cn: 除非你心中笃定你已脱离今生，并且不将今世及其荣耀看作一座倾颓的茅棚，否则便无法战胜地上的情欲和世俗的贪恋，它们将人拖入彻底的败坏和毁灭之中。
    - type: paragraph
      text:
        ru: Невелик труд положить основание, а трудно совершить здание, и чем выше возводится здание, тем больше представляет оно трудов строителю до самого окончания дела.
        cn: 奠定基础并非难事，但建成楼房却很困难。并且，建筑建造得越高，就越给建造者带来辛劳，直到工程彻底完工。
    - type: paragraph
      text:
        ru: 'Вот что бывает с приступающим работать Господу: сперва искушение, потом скорби, затем труд, уныние, нагота, страдание, теснота, унижение. Препобеждает всё тот, кто всем сердцем предает себя управлению Божию и пребывает в воле Божией. Бог требует от нас только совершенной решимости, Сам подает нам силы и дарует победу.'
        cn: 这就是那些开始服事主的人会遇到的：首先是试探，然后是苦难，接着是劳苦、灰心、贫乏、痛苦、困境和羞辱。凡是全心全意将自己交托给上帝管理、并恒久住在上帝旨意中的人，就必能战胜这一切。上帝只向我们要求完全的决志，他自己会赐予我们力量，并赐下胜利。
- type: heading1
  text:
    ru: Отделение четырнадцатое
    cn: 第十四章
  children:
  - type: heading2
    text:
      ru: Бденное утруждение себя в молитве милость привлечет там
      cn: 在祷告中警醒的刻苦己身，将在那里引来怜悯。
    children:
    - type: paragraph
      text:
        ru: Хвала Всеблагому, Который по любви Своей открыл славу сынам человеческим! Из персти создал Он бессловесное естество и украсил его душой, обладательницей сокровищ небесных.
        cn: 赞美至善者，祂因自己的爱，向人类儿女显明了荣耀！从尘土中，祂创造了无言的受造之物，并以灵魂装饰了它，这灵魂是属天财宝的拥有者。
    - type: paragraph
      text:
        ru: Перстные уста соделал Он способными величать Его, чтобы вся тварь чрез них воспевала Ему хвалу.
        cn: 祂使属土的口舌得以颂扬祂，为要使一切受造之物藉着它们向祂歌颂赞美。
    - type: paragraph
      text:
        ru: Приидите, одаренные словом, воспоем Ему хвалу, пока не уснули мы сном смертным.
        cn: 来吧，蒙受圣言的，让我们向祂歌颂赞美，趁我们尚未沉睡于死亡之眠。
    - type: paragraph
      text:
        ru: В каждую ночь будем помышлять о смерти, которая заградит уста наши и наложит на нас молчание.
        cn: 每个夜晚，我们都当默想那将封住我们的口并使我们归于寂静的死亡。
    - type: paragraph
      text:
        ru: Праведные, проводившие ночи во бдениях, живы и по смерти, а нечестивые, отрицающие славу Сына Божия, и в жизни уже мертвы.
        cn: 义人，那些彻夜警醒守夜的，死后依然活着；而不敬虔的人，那些否认神子荣耀的，在生前就已经死了。
    - type: paragraph
      text:
        ru: Будем возбуждать тело наше псалмами и духовными песнями, чтобы нам приобщиться к мудрым девам, которых похвалил Господь наш, и бодрственно узреть Сына Божия в ту ночь, которая в трепет приведет миры.
        cn: 让我们以圣咏和属灵的诗歌来激发我们的身体，好使我们能与蒙主赞许的明智童女一同有份，并在那将使万物颤栗的夜晚，警醒得见上帝之子。
    - type: paragraph
      text:
        ru: Не будем утопать в удовольствиях, чтоб узреть нам славу Его в день явления Его. Будем бдительными пред Ним рабами, готовыми на час, в который изведет Он сынов человеческих на Суд.
        cn: 我们不可沉溺于享乐，为要使我们在祂显现之日得见祂的荣耀。我们当是祂面前警醒的仆人，随时预备妥当，迎候祂领世人受审判的时刻。
    - type: paragraph
      text:
        ru: Тело, которое утруждало себя в молитвах, в день воскресения воспарит по воздуху, без посрамления будет взирать на Господа своего, с Ним войдет в чертог света и будет там любезно Ангелам и человекам, которые здесь утруждали себя бдениями и молитвами.
        cn: 那在祷告中劳苦的身体，在复活之日将腾空而起，不蒙羞地瞻仰其主，并与祂一同进入光明之殿；在那里，它将蒙天使和那些在此世以警醒与祷告劳苦之人所喜爱。
    - type: paragraph
      text:
        ru: Благословен Сотворивший нас орудиями славы Своей и вложивший славословие в недостойные уста наши! Хвала щедротам Его, потому что перстных соделал Он сослужителями Ангелов, чтобы всякую ночь и во всякое время воспевали они святое имя Его!
        cn: '愿颂赞归于创造我们成为祂荣耀器皿，并将颂赞置于我们不配之口的祂！

          赞美祂的丰盛恩慈，因为祂使尘土之躯成为天使的同工，好让他们每夜并随时歌颂祂的圣名！'
  - type: heading2
    text:
      ru: Утреннее пение
      cn: 清晨颂歌
    children:
    - type: paragraph
      text:
        ru: Хвалите Бога утром, чада Церкви. Всякое утро будем славословить Благого и поклоняться Ему, устроившему светила в область дня и в область ночи.
        cn: '清晨赞美上帝，教会的儿女们。

          每个清晨，我们都要颂扬良善的上帝并敬拜祂，是祂设立了众光体来掌管白昼和黑夜。'
    - type: paragraph
      text:
        ru: Покрывало ночи поднято, и воссиял свет Божий над тварью; явление утра пробуждает спящих. Свет Твой, Господи, да озарит сердца наши!
        cn: 夜的帷幕已揭开，上帝之光普照在万有之上；清晨的显现唤醒了沉睡之人。愿祢的光，主啊，照亮我们的心！
    - type: paragraph
      text:
        ru: Сам Ты, Господи наш, научи нас славословить Тебя, и вложи жизнь в души наши, и как извел нас из тьмы, так избавь нас от геенны.
        cn: 主啊，你亲自教导我们颂赞你，并将生命注入我们的灵魂中。并且，正如你将我们从黑暗中领出，照样，求你拯救我们脱离地狱。
    - type: paragraph
      text:
        ru: По милости Твоей напитай чад Церкви, прилепившихся к Тебе. Заступником нашим да будет милосердие Твое, Господа утра и вечера.
        cn: 愿祢以祢的慈悲滋养那些亲近祢的教会儿女。愿祢的怜悯，掌管晨昏之主的怜悯，成为我们的护卫者。
    - type: paragraph
      text:
        ru: Благодать Твоя, Господи, да сопровождает нас и да приведет к великому утру. Десница щедрот Твоих да ущедрит нас благословениями, и ею да прейдем огненное море.
        cn: '祢的恩典，主啊，愿它伴随着我们，并引领我们到达那伟大的清晨。

          祢丰盛慈悲的右手，愿以祝福慷慨赐予我们，并借着它，愿我们渡过那火焰之海。'
    - type: paragraph
      text:
        ru: Небо и земля и всё, что на них, с нами вкупе да славословят Тебя за обращение наше. Славословие Тебе, Поклоняемому Отцу и Единородному Твоему Сыну и Духу Святому!
        cn: 天和地以及其上的一切，愿与我们一同赞美你，因着我们的归正。赞美归于你，受敬拜的父，和你的独生子，和圣灵！
  - type: heading2
    text:
      ru: Вечернее славословие
      cn: 晚间颂词
    children:
    - type: paragraph
      text:
        ru: Всякий вечер хвала Тебе от всех устен человеческих! Ты дал им день на дела и работу для приобретения пропитания. Вот утомленные тяжкими трудами благодарят Тебя, что даровал Ты им покой.
        cn: 每晚，颂赞归于你，出自世人所有的口！你赐予他们白昼，以从事工作与劳作，为要赚取生计。看哪，那些被沉重劳苦所压垮的疲惫之人，感谢你，因为你赐予他们安息。
    - type: paragraph
      text:
        ru: Кто не будет поклоняться Тебе, с такой любовью пекущемуся о нас, человеках? Ты изводишь звезды и время приводишь к вечеру, которым пресекаются труды целый день работавших до утомления.
        cn: 谁能不敬拜您呢，您以如此的爱眷顾我们世人？您引出星辰，又使时光入暮，借此止息了那些整日辛劳至疲惫者的劳作。
    - type: paragraph
      text:
        ru: Приходит вечер – и успокаивает тех, которые, борясь с голодом и жаждой, изнуряли и утомляли себя трудом. Приходит вечернее время – и радует мир и тружеников его.
        cn: 夜幕降临，安抚那些与饥饿和干渴搏斗、劳碌以致身心俱疲的人们。傍晚时分到来，使世人及其劳作者欢欣喜悦。
    - type: paragraph
      text:
        ru: Благословенно величие Твое, из начала Промышляющий о нас, человеках!
        cn: 愿祢的伟大蒙福！祢从起初就眷顾我们人类！
    - type: paragraph
      text:
        ru: И людям и скотам доставляешь Ты отдохновение в вечернее время.
        cn: 无论是人还是牲畜，你都在傍晚时分赐予安息。
    - type: paragraph
      text:
        ru: Печатлеющий Церковь Твою и хранящий чад ее от сатаны и воинств его, крест Твой, Господи, да будет отрадой для овец Твоих, которых искупил Ты Животворящей Твоей Кровью!
        cn: 那为祢教会盖印，并保守她的子女脱离撒但和它军队的祢的十字架啊，主啊，愿它成为祢羊群的慰藉，祢以祢那赐生命的宝血救赎了他们！
    - type: paragraph
      text:
        ru: Пошли мир Твой, Господи, на все концы вселенной, и лукавый да бежит от среды нас.
        cn: 主啊，愿祢的平安降下，遍及全宇宙各处，并愿那恶者从我们中间退去。
    - type: paragraph
      text:
        ru: Всякий язык и все уста во всех концах мира да приносят Тебе хвалу.
        cn: 一切语言和一切口舌，在世界的各处，愿都向你献上赞美。
    - type: paragraph
      text:
        ru: С ними и мы прославляем Тебя, Господи, и Отца Твоего и Духа Святого!
        cn: 我们与他们一同颂扬祢，主啊，以及祢的父和圣灵！
  - type: heading2
    text:
      ru: Трудившимся здесь во славу Твою членам не дай испытать страдания там!
      cn: 在此为您的荣耀而劳苦的肢体，求您不要让他们在那里承受苦难！
    children:
    - type: paragraph
      text:
        ru: От всех нас, Господи наш, приими молитву, и служение, и прошение наше. Даруй нам сердце, исполненное любви, и дух терпения в страданиях.
        cn: 主啊，求祢从我们所有人中间，接受我们的祷告、侍奉和祈求。求祢赐予我们一颗充满爱的心，以及在苦难中忍耐的灵。
    - type: paragraph
      text:
        ru: Уста, исповедующие веру, и глас наш да будут гуслями хваления. Бдение и труд, переносимые телами нашими, да соделают Тебя милосердым ко грехам нашим.
        cn: 承认信德的口和我们的声音，愿它们成为赞美之琴。我们的身体所承受的警醒和劳苦，愿它们使你怜悯我们的罪。
    - type: paragraph
      text:
        ru: Уста, служившие для Тебя гуслями, и язык, воспевавший Тебе хвалу, да не издадут, Господи, воплей в муках, потому что сподобил Ты их воспевать Тебе хвалу.
        cn: 曾为你弹奏古斯里琴的口唇，和曾歌颂你赞美的舌头，主啊，愿它们不在苦楚中发出哀嚎，因为你曾恩准它们赞美你。
    - type: paragraph
      text:
        ru: Очи, которые, и отягчаемые сном, бодрствовали, и ноги, которые утомлялись, стоя пред Тобой, да не будут лишены упования и да не утратят мзды своей в день воздаяния.
        cn: 那些即使被睡意沉重，却依然警醒的眼目，以及那些因站立在祢面前而疲惫的双足，愿它们不致被剥夺盼望，也不致在赏报之日丧失其赏赐。
    - type: paragraph
      text:
        ru: Звук уст и песней наших да не превратится в рыдания и плач, но по щедротам Твоим, по милосердию и благости Твоей приими бдение наше.
        cn: 我们口唇与诗歌之声，愿不化作恸哭与哀号，而是照祢的丰盛、祢的怜悯与良善，悦纳我们的守夜。
    - type: paragraph
      text:
        ru: Сподоби нас единодушно, с чистым сердцем предстоять Тебе и согласно приносить хвалу Тебе, Господи, и Отцу Твоему и Духу Твоему Святому.
        cn: 求你恩准我们同心合意地，以清洁的心侍立在你面前，并同声向你，主啊，以及你的父和你的圣灵，献上赞美。
  - type: heading2
    text:
      ru: Скверны мешают благодати войти – омой, чтобы она возобитала!
      cn: 污秽阻碍恩典进入，洁净吧，使恩典能丰盛地居住！
    children:
    - type: paragraph
      text:
        ru: Душа скорбная приходит к Тебе, Святый Владыко, и со слезами припадает к щедротам Твоим.
        cn: 忧伤的灵魂来到祢面前，圣洁的主宰，并带着眼泪俯伏在祢的怜悯中。
    - type: paragraph
      text:
        ru: Самим Собой клялся Ты, что не хочешь смерти грешника, но желаешь паче спасти его от грехов. И благость Твоя воистину препобеждает ежедневно все неправды человеческие – Ты милуешь и грешащих, как милуешь и спасаешь ходящих по заповедям Твоим.
        cn: 祢曾凭着自己起誓，祢不愿罪人死亡，但更愿他脱离罪恶而得救。而祢的良善，每日真实地胜过一切人类的不义——祢怜悯犯罪的人，如同祢怜悯并拯救遵行祢诫命的人。
    - type: paragraph
      text:
        ru: Щедроты Твои повсюду проповеданы в Евангелиях и писаниях апостольских, о них вещают святые отцы и учителя, именитые в Церкви и неименуемые.
        cn: 您的恩慈在福音书和使徒书信中处处被宣讲，它们由教会中声名显赫的以及无名的圣教父和教师们所传述。
    - type: paragraph
      text:
        ru: Знаю блудного сына, Манассию, разбойника, Закхея, мытаря, блудницу, хананеянку, кровоточивую, расслабленного, слепого, Иаира и всех преднаписанных – и прихожу к Тебе.
        cn: 我知道浪子、玛拿西、强盗、撒该、税吏、妓女、迦南妇人、患血漏病的妇人、瘫子、瞎子、睚鲁以及所有被预先记载的——我来到祢面前。
    - type: paragraph
      text:
        ru: Отверзи благоутробие Твое и приими меня, услади ум мой и удержи меня, часто впадающего в прежние беззакония и, как в тину, погруженного в скверные помыслы.
        cn: 开启你的慈怀，接纳我；使我心意甘甜，并保守我这常常陷入往日罪愆，如同沉溺于泥沼般污秽思想中的人。
    - type: paragraph
      text:
        ru: Благодать Твоя, пришедши к сердцу моему, находит там зловоние скверных помыслов, почему тотчас отступает, не обретая себе входа и не имея возможности войти и вселиться во мне, как желательно ей.
        cn: 你的恩典，临到我心时，在那里发现了污秽意念的恶臭，因此立刻退去，因寻不见入口，并且无法照它所愿望的，进入我里面并居住。
    - type: paragraph
      text:
        ru: Омой же сердце мое светоносным услаждением, чтобы пришел я в чувство и благодать Твоя возобитала во мне, всещедрый Господи!
        cn: 求你以光明的甘饴洗涤我心，使我觉醒，愿你的恩典住在我内，哦，普施恩惠之主啊！
  - type: heading2
    text:
      ru: Страшен переход чрез мытарства – здесь очисти, Господи!
      cn: 穿越空中关卡是可怖的——主啊，求祢在此洁净我！
    children:
    - type: paragraph
      text:
        ru: 'Страшными и ужасными местами будем проходить мы в скором времени, и никому из здешних невозможно не идти путем тем. Там никто не будет сопутствовать нам для помощи: ни родители, ни братья, ни друзья, ни род, ни богатство, ни что-либо тому подобное.'
        cn: 可怕而可怖的地方，我们将在不久的将来经过，对这里的任何人来说，都不可能不走那条路。在那里，没有人会陪伴我们提供帮助：无论是父母、兄弟、朋友、亲属、财富，还是任何类似的事物，都不会陪伴我们。
    - type: paragraph
      text:
        ru: Если только в оный час окажемся обнаженными от Божия покрова, то князья тьмы непременно задержат нас. Они неумолимы и немилостивы, ни царя не боятся, ни властителей не уважают, не чтут ни малого, ни великого. Только от живущего в благочестии отступят они со страхом, давая ему свободный путь.
        cn: 如果在那一刻我们失去了上帝的遮盖，那么幽暗的君王必定会阻拦我们。他们冷酷无情且不施怜悯，既不惧怕君王，也不尊重掌权者，既不敬重微小者，也不敬重大人物。只有面对那些生活在虔诚中的人，他们才会带着恐惧退去，给他一条畅通无阻的道路。
    - type: paragraph
      text:
        ru: 'Представляя в уме час оный, припадаю к Твоей благости, Господи: не предай меня обидящим мя, да враги Твои не похвалятся о рабе Твоем, Благой Господи. Скрежеща зубами и устрашая грешную душу мою, да не скажут они: «Нам достался ты в руки, нам отдан, этого-то дня и ожидали мы!»'
        cn: 在心中构想那时刻，我俯伏于您的良善之下，主啊：不要把我交给那些凌辱我的人，以免您的仇敌夸耀您的仆人，良善的主啊。他们咬牙切齿地恐吓我这有罪的灵魂，以免他们说：「你落入了我们手中，你被交给了我们，我们一直等待的正是这一天！」
    - type: paragraph
      text:
        ru: 'Нет, Господи, не воздавай мне по беззакониям моим и не отврати от меня лица Твоего! Не скажи мне: «Аминь глаголю Тебе, не вем тя». Накажи меня, Господи, по щедротам Твоим, враг же мой да не порадуется о мне! Угаси прещения его, упраздни все его действия, устрой путь мой к Тебе свободным от нападения и поруганий!'
        cn: 不，主啊，不要按我的不法行为报应我，也不要向我掩面！不要对我说：「我实实在在告诉你，我不认识你。」主啊，求你按你丰盛的怜悯管教我，而我的仇敌不要因我而欢喜！熄灭他的恐吓，使他所有的作为归于无效，使我通往你的道路免受攻击和侮辱！
    - type: paragraph
      text:
        ru: Склонись на молитву мою, Благой Господи, не ради правд моих, но ради щедрот Твоих и великой милости Твоей! Спаси от смерти скорбную мою душу! Ты – Господь всяческих и имеешь власть над всяким дыханием.
        cn: 俯允我的祷告，良善的主啊，不是为了我的义行，而是为了祢丰盛的恩慈和祢伟大的怜悯！从死亡中拯救我忧伤的灵魂！祢是万有之主，并拥有掌管一切气息的权柄。
    - type: paragraph
      text:
        ru: Ты сказал, Господи:Просите, и дано будет вам... стучите, и отворят вам(Мф. 7:7). Се прошу и стучу. Прежде конца моего, Господи, очисти меня от всякого греха!
        cn: 你曾说过，主啊：祈求，就给你们；叩门，就给你们开门(马太福音 7:7)。今我祈求并叩门。在我末了之前，主啊，洁净我脱离一切罪恶！
  - type: heading2
    text:
      ru: Встань, пока время, и слезами очистись
      cn: 兴起，趁着时日，以泪水涤净自己。
    children:
    - type: paragraph
      text:
        ru: Встань, душа, спавшая доныне во грехе, отряси сон свой, спеши и в покаянии ищи прибежища – и Правдивый умилостивится, может быть, слезами твоими. Совлеки с ума своего покрывало скверны, чтоб око твое видело верно.
        cn: 起来，灵魂啊，你直到如今仍沉睡在罪中，抖落你的沉睡，速速在悔改中寻求庇护——并且，那公义者或许会因你的眼泪而施恩。从你的心思上除去污秽的帕子，好使你的眼睛能看得真切。
    - type: paragraph
      text:
        ru: Ежечасно проливай пред Судией слезы сокрушения о срамных делах своих. Бездна мучений ожидает тебя за дела твои и в воздаяние за непотребства твои. Сугубо плачь о себе, чтобы Правдивый и услышал тебя, и примирился с тобой.
        cn: 每时每刻在审判者面前倾泻悔罪的泪水，为自己羞耻的行为。苦难的深渊正等着你，为了你的行为，并作为你败坏之举的报应。为自己加倍地哭泣，好让公义者听见你，并与你和解。
    - type: paragraph
      text:
        ru: Вострепещи, несчастная, и ужаснись мучений, какие сама себе приготовила ты! Плачь о себе, сообщница нечистых сил, потому что всюду с тобой пойдет вечный огонь. Глубоко погрязла ты в похотях и никогда не изникала из них.
        cn: 可怜的你，颤抖吧，为你自己预备的折磨而惊恐吧！为你自己哭泣吧，污秽势力的同伙，因为无论你到哪里，永火都将与你同去。你深深地沉溺于情欲之中，从未从中挣脱出来。
    - type: paragraph
      text:
        ru: Терниями и волчцами заглушены помышления твои, и не принесла еще ты плодов покаяния. Страсти обуревали тебя, как волны, и потопили корабль твой в море грехов.
        cn: 你的心思意念被荆棘和蒺藜所窒息，你尚未结出悔改的果实。情欲如波浪般冲击着你，将你的船只沉没于罪恶之海。
    - type: paragraph
      text:
        ru: Никогда не приводила ты себе на память того дня, который подвергнет испытанию все сокровенное. Что будешь делать, когда приведет тебя в трепет глас, требующий, чтобы шла ты в сретение Жениху?
        cn: 你从未记起过那将要考验一切隐秘之事的那一天。当有呼声使你颤栗，要求你前去迎接新郎时，你将怎么做？
    - type: paragraph
      text:
        ru: Свет очей твоих померкнет и исчезнет, и останешься ты вне с юродивыми девами.
        cn: 你眼中的光将会黯淡并消失，你将与愚拙的童女一同留在外面。
    - type: paragraph
      text:
        ru: Запасайся елеем, бедная душа, пока есть еще время к оправданию. Проси себе оставления грехов вместе с блудницей и слезами своими врачуй язвы свои.
        cn: 积蓄圣油吧，可怜的灵魂，趁着尚有时日得蒙称义。为自己求得罪的赦免，与那娼妓一同，并用你的泪水医治你的创伤。
    - type: paragraph
      text:
        ru: Отверста еще дверь покаяния – войди, очистись от скверн своих.
        cn: 忏悔之门仍然敞开着 — 进去吧，洁净自己，洗净你自身的污秽。
    - type: paragraph
      text:
        ru: Ты, Желающий спасения сынов человеческих, пощади душу, удалившуюся от Тебя!
        cn: 你，切愿人类儿女得救的，怜悯这远离你的灵魂吧！
    - type: paragraph
      text:
        ru: Приими ее, Господи, с обычной Тебе милостью. На Праведном Суде щедроты Твои да покроют меня, грешного, и да избавят меня от мучения.
        cn: 主啊，愿你以你惯常的慈悲接纳她。愿在你公义的审判中，你的恩慈遮盖我这罪人，并使我脱离苦难。
    - type: paragraph
      text:
        ru: Ты, Оставляющий грехи и милующий туне, прости мне душевные прегрешения на Праведном Суде. Славословие Тебе от заблудших, которых собрал и привел Ты к покаянию.
        cn: 祢，赦免罪恶并白白施恩者，求祢在公义的审判中，赦免我灵魂的过犯。颂赞归于祢，来自祢所召集并引领其悔改的迷途者。
  - type: heading2
    text:
      ru: Уроки жизни. Блаженства
      cn: 生命的教训。真福八端
    children:
    - type: paragraph
      text:
        ru: Блажен, кто стал в Господе свободным от всех дел суетной жизни.
        cn: 蒙福的，是那在主里得以脱离虚妄生命一切事务的人。
    - type: paragraph
      text:
        ru: Блажен, кто имеет в уме будущий Страшный Суд и старается слезами уврачевать язвы души своей.
        cn: 有福了，那心中常存将来末日审判，并努力以泪水医治他灵魂创伤的人。
    - type: paragraph
      text:
        ru: Блажен, кто в слезах стал подобен облаку и ежедневно угашает ими огненный пламень злых страстей.
        cn: 有福的人，他流泪如云，并每日借此熄灭那邪恶情欲的烈焰。
    - type: paragraph
      text:
        ru: Блажен, кто преуспевает в добрых правилах подвижничества, надеясь получить от Бога Небесное Царство.
        cn: 蒙福者，是在良善的苦修规条中精进，并盼望从上帝那里领受天国的人。
    - type: paragraph
      text:
        ru: Блажен, кто, как огнем, разжжен любовью и попалил в себе всякий нечистый помысел и всякую душевную скверну.
        cn: 有福了，那被爱如火般点燃，并在自己里面烧尽了一切不洁的意念和一切灵魂污秽的人。
    - type: paragraph
      text:
        ru: Блажен, кто нашел избранную небесную жемчужину и, продав все, что было у него на земле, купил ее одну.
        cn: 有福的，是那寻得蒙拣选的天上珍珠，并卖掉他在世上所有的一切，只买了这一颗的人。
    - type: paragraph
      text:
        ru: Блажен, кто нашел сокровище, сокрытое на селе, и, обрадовавшись, бросил всё и то одно приобрел.
        cn: 有福的，是那寻见藏在田地里的财宝，就欢欢喜喜地撇下一切，单单取得了那一个的人。
    - type: paragraph
      text:
        ru: Блажен, кто непрестанно помнит день исхода своего и старается оказаться в тот час готовым и бесстрашным.
        cn: 蒙福的，是那不断记念自己离世之日，并努力在那时刻显出是预备妥当且毫无畏惧的人。
    - type: paragraph
      text:
        ru: Блажен, кто нашел дерзновение в час разлучения, когда душа со страхом и трепетом разлучается с телом, ибо приходят Ангелы взять душу, разлучить ее с телом и поставить пред Престолом бессмертного и страшного Судилища.
        cn: 蒙福的，是那些在分离之时——当灵魂带着恐惧战兢与身体分离之际——找到了坦然无惧的人，因为天使将前来取走灵魂，使其与身体分离，并将其置于那不朽而可畏的审判台前。
- type: heading1
  text:
    ru: Отделение пятнадцатое
    cn: 第十五章
  children:
  - type: heading2
    text:
      ru: Надежда помилования – в искуплении
      cn: 希望得到赦免，在于救赎。
    children:
    - type: paragraph
      text:
        ru: Украшение молитвы нашей, Иисусе, подкрепи моление наше, да взыдет оно с Тобой ко Отцу Твоему и получит просимое нами!
        cn: 我们祷告的荣美啊，耶稣，求祢坚固我们的祈求，好叫它能与祢一同升到祢的父那里，并能领受我们所祈求的！
    - type: paragraph
      text:
        ru: По милосердию Твоему Ты защищаешь нас пред Отцом Твоим, потому что Ты – Избранная Жертва, принесенная за мир.
        cn: 照着你的恩慈，你在你父面前保护我们，因为你是那为世人献上的蒙拣选的牺牲。
    - type: paragraph
      text:
        ru: За Адама, который вкусил плод, обнимал Ты столп в судилище. За детей Адамовых, которые согрешили пред Тобой, распинатели пронзили Тебя гвоздями.
        cn: 为那尝了禁果的亚当，你在审判堂里拥抱了柱子。为那在你面前犯了罪的亚当的后代，钉死你的人用钉子扎透了你。
    - type: paragraph
      text:
        ru: На Себя принял Ты общий всех долг, чтоб уплатить оный Отцу Твоему, уплати же, Неповинный Господи, и те грехи, коими задолжала наша свобода!
        cn: 你承担了众人共同的罪债，为要向你的父偿还。无罪的主啊，求你偿还，还有那些我们的自由所亏欠的罪！
    - type: paragraph
      text:
        ru: Драгоценной кровью Твоей искупил Ты нас от клятвы законной, избавь же искупленных Твоей кровью и от строгости правосудия!
        cn: 借着你宝贵的血，你将我们从律法的咒诅中赎出；求你也将那些蒙你宝血救赎的人，从公义的严厉中解救出来！
    - type: paragraph
      text:
        ru: Долги рабов да не превозмогут над щедротами милосердого Господа, потому что как ни велики неправды наши, но милосердие Твое еще больше.
        cn: 愿众仆的亏欠，不要胜过怜悯之主丰盛的恩慈；因为无论我们的不义何等深重，祢的怜悯却更加浩大。
    - type: paragraph
      text:
        ru: Правда, что много, много долгов на нас, но у Тебя множество щедрот. И если взвесит сама правда, то долги наши всё будут меньше щедрот Твоих.
        cn: 诚然，我们身上有许多、许多的债务，但你却有丰厚的恩典。即便公义本身来衡量，我们的债务也仍会少于你的恩典。
    - type: paragraph
      text:
        ru: Кто возьмется взвешивать щедроты Твои и сравнивать с ними беззакония наши? Горам есть вес, а щедротам Твоим нет веса!
        cn: 谁能衡量你的丰盛恩惠，又用我们的罪孽与它们相比呢？群山有重量，而你的丰盛恩惠却是无量的！
    - type: paragraph
      text:
        ru: Щедроты Твои драгоценнее жизни, потому что жизни есть мера, а щедроты Твои неизмеримы. И Твои щедроты да будут нашим оплотом!
        cn: 祢的恩典比生命更宝贵，因为生命有尺度，而祢的恩典无可衡量。愿祢的恩典成为我们的堡垒！
  - type: heading2
    text:
      ru: Встань, состарившийся во грехах, и с надеждой приступи к Спасителю
      cn: 起来，在罪中衰老的人，怀着希望来到救主面前。
    children:
    - type: paragraph
      text:
        ru: Встань, душа, состарившаяся во грехах, и обновись покаянием! Из сокрушения и слез раствори себе врачевство и врачуй язвы падшего в тебе образа. Воззови от сердца своего и открой беззакония свои, потому что Всеблагой щадит тебя, падшую.
        cn: 起来吧，你在罪中衰老的灵魂啊，当藉着悔改而得以更新！从痛悔与泪水之中，为你自己调和医治的良药，并医治你里面堕落形像的创伤。从你心中呼求，敞开你的不法，因为至善者怜恤你，这已堕落的！
    - type: paragraph
      text:
        ru: Возлюбила ты красоту обманчивую и преходящую, погубила же свою красоту, дщерь света. Храм тела твоего искажен нерадением, которому поработилась ты.
        cn: 你爱慕了那虚妄又转瞬即逝的美丽，却毁灭了你自己的美丽，光明的女儿。你身体的殿宇因你的怠惰而扭曲变形，你已沦为它的奴隶。
    - type: paragraph
      text:
        ru: Горе тебе, бедная! Долго ли заниматься тебе преходящим? Вострепещи и ужаснись того огня, который возгнела ты себе неправдами своими!
        cn: 祸哉，你这可怜的人啊！你还要沉溺于转瞬即逝之物多久呢？战兢吧，并惊恐于那火，那是你因着自己的不义而为自己点燃的！
    - type: paragraph
      text:
        ru: Безобразные грехи, какие делала ты от юности доселе, превысили главу твою. Они погрузили тебя в отчаяние, и потому нерадишь ты о покаянии.
        cn: 你从年幼至今所犯下的丑陋罪孽，已经高过你的头顶。它们使你陷入绝望，因此你疏忽了悔改。
    - type: paragraph
      text:
        ru: Вспомни, что пленена ты похотями, вспомни, что матерь твою умертвило вожделение. Как долготерпелив к тебе Благой, а ты погрязаешь в греховном море!
        cn: '回想你曾被肉欲所辖制，回想你的母亲曾被贪欲致死。

          仁慈者（上主）对你何等恒忍，而你却深陷罪恶之海！'
    - type: paragraph
      text:
        ru: Ужели не страшишься того дня, в который обнаружатся язвы твои и тайны твои? Кто защитит тебя там, где всякий будет озабочен Судом о нем самом?
        cn: 难道你不惧怕那一天吗，在那一天里，你的疮疤和秘密将显露无遗？在那里，当每个人都只专注于自己受审时，谁又会保护你呢？
    - type: paragraph
      text:
        ru: Страсти твои сделали тебя истуканом, погубили тебя и оставили.
        cn: 你的情欲使你成了石像，毁灭了你，并且离弃了你。
    - type: paragraph
      text:
        ru: О Великая Надежда, явившаяся нам при конце времен, пощади душу, удалившуюся от Тебя! Я – овца Твоя, но долгое время блуждал вдали от Тебя, служа лукавому. Изыди, Господи, взыскать меня! Взыщи достояние Твое, потому что в суете расточил я богатство Твое!
        cn: 哦，伟大的盼望，在末世向我们显现的，求你怜悯那远离了你的灵魂！我是你的羊，但我长久以来远离你而迷失，服侍那恶者。主啊，求你出来寻找我！寻找你的产业，因为我已在虚妄中挥霍了你的财富！
    - type: paragraph
      text:
        ru: За грешников понес Ты на Себе крест Свой, а я – один из них, не отвратись от меня! Твое мы достояние, но лукавый похитил нас. Запрети ему и отыми у него плененное им. Помилуй меня, Человеколюбец, потому что нет у меня иной надежды, кроме Тебя!
        cn: 为了罪人，你背负了自己的十字架，而我正是其中之一，不要转离我！我们是你的产业，但那恶者劫持了我们。斥责他，并从他手中夺回他所掳掠的。怜悯我，爱人者啊，因为除了你我别无他望！
    - type: paragraph
      text:
        ru: Хвала щедротам Твоим, всемилостивый Сыне Божий, потому что долготерпелив Ты к грешникам! Благодарение Тебе от погибших, которых собрал и привел Ты к покаянию!
        cn: 赞美祢丰盛的怜悯，至仁慈的上帝之子啊，因为祢对罪人恒久忍耐！失丧之人向祢献上感谢，因祢召集并引领他们悔改！
  - type: heading2
    text:
      ru: Против врага злого и неотступного
      cn: 对抗邪恶且步步紧逼的仇敌
    children:
    - type: paragraph
      text:
        ru: Сколь велика благодать Божия! Сколь велико Божие человеколюбие! Как желает и побуждает Он всех человеков, чтобы спаслись! Пощади, Господи, и меня, непотребного раба Твоего; пощади, благоутробный Христе Спасителю, создание Твое!
        cn: 神的恩典何其伟大！神的慈爱何其浩瀚！祂何等切愿并促使所有世人得救！主啊，求你怜悯我这不配的仆人；慈悲的基督救主啊，求你怜悯你的受造物！
    - type: paragraph
      text:
        ru: Если Ты, Господи, не образумишь меня, бедного, и не дашь мне сердечного просвещения, то по причине великого нерадения своего не в состоянии буду я увидеть пагубу и растление свое.
        cn: 如果祢，主啊，不开导我这可怜人，也不赐给我心灵的光照，那么由于我巨大的懈怠，我就无法看见我自身的败坏和堕落。
    - type: paragraph
      text:
        ru: Поелику утеснен я немилосердным врагом, гнетущим меня, то непрестанно со слезами ночь и день вопию к благости Твоей, чтоб избавил меня от сетей его, потому что каждый час обновляет он козни свои против меня, каждый час тревожит душу мою блудными помыслами и вожделениями удовольствий.
        cn: 鉴于我被那无情的仇敌所压迫，所辖制，所以，我日夜不住地含泪向祢的良善呼求，求祢将我从他的网罗中解救出来，因为他每时每刻都更新他针对我的诡计，每时每刻都用淫乱的意念和对享乐的贪恋来搅扰我的灵魂。
    - type: paragraph
      text:
        ru: Твоя, Христе, сила, запретившая морским волнам, да запретит и ему, чтоб не имел он действия на меня, непотребного раба Твоего. Пошли, Владыко, благодать Твою вскоре, да отженет от раба Твоего великого змия со всеми скверными и лукавыми его помыслами, потому что язвы, причиненные сердцу стрелами его, стали гнилыми струнами, а я в неразумении своем всеми мерами скрываю их.
        cn: 基督啊，你的大能，曾斥责海浪的，愿它也斥责那恶者，使他无法对你无用的仆人我，产生任何作用。吾主啊，求你快快派遣你的恩典，好使它从你仆人身上驱走那大蛇，连同他一切污秽和狡诈的意念。因为他的箭对心造成的创伤，已变成腐烂的弦，而我，在我的无知中，尽一切方法隐藏它们。
    - type: paragraph
      text:
        ru: Благой Врач вопиет ко мне, не требует платы, не проливает крови, но леность моя не позволяет мне идти к Нему. Сам Он приходит уврачевать меня, но всегда находит меня вкушающим то, что не дает врачевствам Его оказать свою врачевательную надо мною силу.
        cn: 良医向我呼唤，不要求报酬，不流血，但我的怠惰使我无法走向祂。祂亲自前来医治我，却总是发现我在享用那些阻碍祂的医治之方在我身上发挥其医治力量的事物。
    - type: paragraph
      text:
        ru: О Господи, вразуми и отрезви меня, исцели – и исцелюсь!
        cn: 哦，主啊，开导我，使我清醒，医治我，我便得医治！
  - type: heading2
    text:
      ru: К Богородице о даровании покаяния
      cn: 向圣母求赐悔改
    children:
    - type: paragraph
      text:
        ru: Умоляю Тебя, Родительница Невечернего Света, внемли, что поведаю пред Тобой!
        cn: 我恳求您，诞育不落之光者，垂听我将在您面前所要倾诉的！
    - type: paragraph
      text:
        ru: В тине погрязаю я, окаянный, весь покрыт нечистотами, весь омрачился. И землю осквернил я множеством грехов своих, Владычица моя, посему, воздыхая, вопиет она теперь на меня Неподкупному Судии, призывая во свидетели и небо со звездами, и солнце.
        cn: 我，这可怜的罪人，深陷泥沼之中，全身被不洁之物覆盖，心神完全昏暗了。我的主母啊，我以我众多的罪恶玷污了大地，因此，她现在叹息着，向那不被腐化的审判者控诉我，并呼唤连同星辰的苍穹与太阳为证。
    - type: paragraph
      text:
        ru: А буря помыслов моих погружает уже меня в отчаяние. Всё упование мое на Тебя, Богородица, возложил я, блудный. Ты одна, чревоносившая Избавителя мира, разреши неразрешимые узы мои, Ты очерненного меня и сделавшегося тьмою убели слезами покаяния, Ты, рождшая жизнь мою, воскреси меня, умерщвленного великой беспечностью и отчужденного от Бога и от Ангелов, возведи к ним, Богородица!
        cn: 我思绪的狂风巨浪已将我卷入绝望深渊。我这迷途之人，将所有的希望都寄托于您，圣母。唯有您，曾孕育世界救主，求您解开我这无法解脱的束缚；求您以悔罪的泪水，洁净我这已被玷污、且化为黑暗之人；您，赐予我生命者，求您复活我这因极度疏忽而枯死、并与上帝和众天使隔绝之人；圣母，将我引领归向他们！
    - type: paragraph
      text:
        ru: Страшное подлинно чудо! Как Господь терпел грехи мои? Как тотчас живого еще не свел меня, бедного, на дно адово? Как не послал свыше невидимого жезла или меча поразить меня? Без сомнения, Ты, Владычица, ходатайствами Своими даровала мне жизнь, взыскуя моего покаяния, которое Сама, Преблагая, и подай мне, рабу Твоему, ибо Ты – моя стена, пристань и ограда!
        cn: 确实是可畏的神迹！主怎能容忍我的罪孽？怎能没有立刻将我这可怜的活人，打入地狱深渊？怎能没有从上头差遣无形的杖或剑来击打我？毫无疑问，圣母女皇啊，您借由您的代祷赐予我生命，寻求我的忏悔；这忏悔本身，至善者啊，也请您赐予我，您的仆人，因为您是我的城墙，我的港湾，我的屏障！
  - type: heading2
    text:
      ru: По трудам – воздаяние
      cn: 按行为报应
    children:
    - type: paragraph
      text:
        ru: Господи наш Иисусе, Достопоклоняемый Царь, страданием Своим победивший мучителя – смерть, Сын Божий, обетовавший нам новую жизнь и Горнее Царство, удали от нас всё вредное, да обитает в нас благодать Твоя, чтобы в день явления Твоего могли мы по благоволению Твоему выйти в сретение, узреть Тебя и предстать Тебе с радостью!
        cn: 我们的主耶稣，至尊的君王，以祂的苦难战胜了那折磨人的死亡，神的儿子，应许了我们新生命和天国，求你除去我们一切有害之物，使你的恩典居于我们之中，好使在你显现之日，我们能按你的美意出去迎接你，瞻仰你，并欢喜地侍立在你面前！
    - type: paragraph
      text:
        ru: Изгладь грехи наши прощением Твоим, да восхвалим имя Твое за благодеяние Твое. Сподоби всех нас, Господи, по благодати Твоей прославлять Божество Твое и поклоняться Ему.
        cn: 愿你以你的赦免涂抹我们的罪孽，使我们因你的恩惠而颂扬你的名。主啊，愿你按你的恩典，使我们所有的人都能够颂赞你的神性并敬拜祂。
    - type: paragraph
      text:
        ru: 'Очи, видевшие здесь славу Твою, да узрят там великую милость Твою. Уши, слышавшие глас словес Твоих, да слышат и там одни гласы радования. Уста, славившие Тебя в церквах, сподоби и там воспевать Тебе хвалу. Язык, взывавший здесь: «Свят, свят, свят», и там настрой к хвалению Твоему. Руки, державшие Тело Твое и Кровь Твою, да приимут от Тебя оставление долгов. Ноги, вступавшие во святой храм, да ходят и там во стране жизни.'
        cn: '在此曾看见你荣耀的眼睛，愿在那里得见你丰盛的怜悯。

          曾听闻你话语之声的耳朵，愿在那里也只听见喜乐之声。

          在众教会中曾赞美你的口唇，也求你使它在那里也能歌颂赞美你。

          在此曾呼喊「圣哉，圣哉，圣哉」的舌头，愿它在那里也为你的赞美而调准。

          曾执持你圣体和宝血的双手，愿它们从你那里领受罪债的赦免。

          曾踏入圣殿的双脚，愿它们在那里也能行走在生命之地。'
    - type: paragraph
      text:
        ru: Собору нашему (братству), который поклоняется Божеству Твоему, пошли всю полноту спасительных даров Твоих.
        cn: 我们圣会（弟兄团），敬拜祢神性者啊，求祢赐下祢一切丰盛的救赎恩赐。
    - type: paragraph
      text:
        ru: Да пребывает с нами высокая любовь Твоя и да соделает нас достойными приносить Тебе должную хвалу.
        cn: 愿您崇高的爱常与我们同在，并使我们配得向您献上合宜的赞美。
    - type: paragraph
      text:
        ru: Отверзи дверь Твою молитве нашей, и да будет приятно Тебе служение наше.
        cn: 敞开祢的门，向我们的祷告，并愿我们的事奉蒙祢的悦纳。
    - type: paragraph
      text:
        ru: Обратись к нам, Благой, по щедротам Твоим и отжени от нас всё вредное, чтобы немолчно восхваляли мы Тебя, Господи, и Отца Твоего и Духа Святого!
        cn: 良善者啊，按照你的厚恩眷顾我们，并从我们身上驱逐一切有害之物，好使我们不住地赞美你，主啊，以及你的父和圣灵！
  - type: heading2
    text:
      ru: Даруй, Господи, покаяние и твердость до конца!
      cn: 主啊，求祢赐予悔改和坚忍到底！
    children:
    - type: paragraph
      text:
        ru: Не отринь моления моего, Благий Господи! Вопиют к Тебе уста недостойные, сердце нечистое и душа, оскверненные грехами.
        cn: 不要弃绝我的恳求，良善的主啊！不配的口，不洁的心，以及被罪玷污的灵魂，向你呼求。
    - type: paragraph
      text:
        ru: Услышь меня, Господи, по благости Твоей! Утверди сердце мое в страхе Твоем. Поставь ноги мои на камень покаяния. Благость Твоя, Господи, да победит мою греховность. Свет благодати Твоей да преодолеет тьму, которая во мне.
        cn: '主啊，凭着您的恩慈垂听我！

          愿我的心坚定在您的敬畏之中。

          将我的脚立定在悔改的磐石上。

          主啊，愿您的恩慈战胜我的罪性。

          愿您的恩典之光胜过我里面的黑暗。'
    - type: paragraph
      text:
        ru: Ты, Господи, отверзший очи слепому, отверзи потемненные очи сердца моего. Ты, очистивший прокаженных словом, очисти скверны души моей. Благодать Твоя, Господи, да будет во мне огнем, попаляющим нечистые помыслы мои.
        cn: 主啊，祢曾开启瞎子之眼，求祢开启我心中昏暗的眼睛。祢曾以言语洁净麻风病人，求祢洁净我灵魂的污秽。主啊，愿祢的恩典在我内成为烈火，焚尽我不洁的思想。
    - type: paragraph
      text:
        ru: Ты один благ, Ты – Свет, превысший всякого света, Ты – Радость, превысшая всякой радости, Ты – Покой, превысший всякого покоя, Ты – Жизнь истинная, Ты – Спасение, пребывающее вовеки.
        cn: 唯有祢是美善的，祢是光，超越一切光；祢是喜乐，超越一切喜乐；祢是安息，超越一切安息；祢是真生命；祢是救恩，存留直到永远。
    - type: paragraph
      text:
        ru: К Тебе, единому Благому, припадаю с молением я, достойный всякого наказания, заслуживший всякое мучение. Тебя, Искупителя, умоляю, да не вконец овладеет мною сопротивник.
        cn: 唯有祢是至善的，我向祢俯伏恳求，我这配受一切惩罚、罪当一切苦刑的人。我恳求祢，我的救赎主，不要让仇敌彻底掌控我。
    - type: paragraph
      text:
        ru: Но Ты, Господи, Благой и Милостивый, воздвигни члены мои, расслабленные грехом, оживотвори душу мою, умерщвленную беззаконием, просвети сердце мое, омраченное лукавой похотью, избавь меня от всякого дела злого, вложи в меня совершенную любовь Твою, Господи Иисусе Христе, Спасителю мира, и напиши имя раба Твоего в Книге жизни, даруя мне конец благой, чтобы, одержав победу над диаволом, непостыдно поклонился я пред Престолом Царства Твоего со всеми праведными!
        cn: 但祢，主啊，良善又慈悲的，请举起我因罪而瘫软无力的肢体，使我因不法而死亡的灵魂复活，光照我因恶欲而昏暗的心，救我脱离一切恶行，将祢那完全的爱注入我心，主耶稣基督，世界的救主啊，并将祢仆人的名字写在生命册上，赐我美好的结局，使我能战胜魔鬼，并与所有义人一同无愧地在祢国度的宝座前敬拜！
  - type: heading2
    text:
      ru: Уроки жизни. Горе
      cn: 生命的教训。悲痛
    children:
    - type: paragraph
      text:
        ru: Горе тебе, душа, что пребываешь бесчувственной в настоящей жизни, каждый день предаваясь самоугодию и утехам и живя распутно. В будущий век будешь плакать, подобно богачу, мучимая в пламени вечного огня.
        cn: 祸哉，你这灵魂，竟在此生麻木不仁，每日沉溺于自我放纵和享乐，生活放荡。在来世，你将哭泣，如同那财主，在永火的火焰中受折磨。
    - type: paragraph
      text:
        ru: Горе тебе, душа, что не выносишь никакой скорби, причиняемой тебе братом, ни даже слова обидного, но тотчас вступаешь в противоречие и сопротивление и за сие теряешь венец терпения и кротости и будешь навеки осуждена с памятозлобными.
        cn: 你的灵魂有祸了！因你不能忍受弟兄加给你的任何苦楚，甚至一句侮辱之言也无法忍受，却立刻陷入争辩和反抗之中，因此你失去了忍耐和温柔的冠冕，并将与那些心怀怨恨之人一同被永远定罪。
    - type: paragraph
      text:
        ru: Горе тебе, душа, что ненавидишь и поносишь брата своего или терпишь, когда другие делают то же, – за это будешь наказана с убийцами, ибоненавидящий брата своего есть человекоубийца(1Ин. 3:15).
        cn: 祸哉，你这灵魂，你憎恨并诋毁你的弟兄，或者容忍他人做同样的事——因此你将与杀人犯一同受罚，因为憎恨自己弟兄的便是杀人犯（约翰一书 3:15）。
    - type: paragraph
      text:
        ru: 'Горе тебе, душа, что пренебрегаешь Божии заповеди и предполагаешь, что спасение – в одном имени христианина, ибо в страшный день услышишь, что Господь скажет:Не всякий говорящий Мне: Господи, Господи! войдет в Царство(Мф. 7:21).'
        cn: 祸哉，你这灵魂，你轻忽上帝的诫命，并以为救恩只在于基督徒之名，因为在那可畏之日，你将听到主说：「凡称呼我『主啊，主啊』的人，不能都进天国。」 (马太福音 7:21)
    - type: paragraph
      text:
        ru: Горе тебе, душа, что любишь славу человеческую, и почести, и нарядные одежды, и приобретение вещественного – посему в день Суда будешь мерзка пред Богом, отринута от лица Его и сопричислена к надменным бесам.
        cn: 祸哉，你这灵魂，竟爱慕人的荣耀、尊荣、华丽的衣裳，以及物质的获取——因此，在审判之日，你必在上帝面前成为可憎，被从祂的面前弃绝，并与那些傲慢的邪魔同列。
    - type: paragraph
      text:
        ru: 'Горе тебе, душа, что каждый день грешишь, а покаяние отлагаешь со дня на день: постигнет тебя смерть, как тать в ночи, внезапно, и, связанная, отведена будешь в геенну огненную, без пользы проливая слезы и обвиняя свое неразумие.'
        cn: 祸哉你这灵魂，你日复一日地犯罪，又日复一日地推迟悔改：死亡将如夜间的窃贼般突然临到你，你将被捆绑，引到烈火的欣嫩谷，徒然流泪，并归咎于你自己的愚蠢。
    - type: paragraph
      text:
        ru: Горе тебе, душа, что не трепещешь, помышляя, как в страшный день Суда, когда Силы небесные подвигнутся от страха, явишься ты лицу Божию, имея на себе срамную и оскверненную ризу.
        cn: 祸哉你这灵魂，竟然不颤栗，思量着在可怕的审判之日，当天上众力都因惧而震动之时，你却要穿着可耻又污秽的衣袍，出现在上帝的面容前。
- type: heading1
  text:
    ru: Отделение шестнадцатое
    cn: 第十六部
  children:
  - type: heading2
    text:
      ru: Даруй благодать песнопения и учения, чтобы ими загладить хотя мало грехи!
      cn: 求祢赐予歌咏和教导的恩典，好使我们借此，哪怕是些微地，弥补罪过！
    children:
    - type: paragraph
      text:
        ru: Святые отцы, будучи боголюбивыми, в страданиях и искушениях сделались благоискусными и от Царя Небесного со славой и похвалами прияли неувядающий венец. Я же, бедный, без всякого искушения грешу, раздражаю и огорчаю Владыку моего.
        cn: 圣教父们，因着敬爱上帝，在苦难和试探中，在德行上变得娴熟，并从天上的君王那里，带着荣耀和称赞，领受了不朽的冠冕。而我，这可怜的人，却在没有任何试探的情况下犯罪，惹怒并使我的主忧伤。
    - type: paragraph
      text:
        ru: 'Однако же, изведав опытом многие и неизреченные щедроты Твои, Господи, умоляю величие благодати Твоей: спаси меня и даруй рабу Твоему прошения сердца его из сокровищ милосердия Твоего, чтобы благодать Твоя, как поток, непрестанно струилась в сердце и устах у меня, раба Твоего, чтобы сердце мое по благодати Твоей было чистым и нескверным храмом, приемлющим в себя Небесного Царя, чтобы перст благодати всегда приводил в движение язык мой, как струну на гуслях, к славе Твоей, Человеколюбец, и я непрестанно все дни жизни моей и сердцем и устами с любовью прославлял и благословлял Тебя.'
        cn: 然而，主啊，我已亲身体验了您诸多无法言喻的恩惠，我恳求您恩典的浩大：拯救我，并从您怜悯的宝库中，赐予您的仆人他心中的祈求。愿您的恩典如同溪流，在我，您仆人的心中和口中不住地流淌；愿我的心凭着您的恩典，成为一个洁净无瑕的圣殿，接纳天上的君王；愿恩典的手指总能拨动我的舌头，如同古瑟琴上的琴弦，为了您的荣耀，哦，仁爱者，使我生命中的所有日子，无论是用心还是用口，都能怀着爱不停地赞美并称颂您。
    - type: paragraph
      text:
        ru: Христе Спасителю! Даруй мне по прошению сердца моего, да уподобится язык мой сладкозвучной цевнице, чтоб, утешая, вразумляя и назидая, мог я хотя немного уплатить за многие долги мои и под кровом милости Твоей спастись там, когда пред страшной славой Твоей вострепещет всякая душа.
        cn: 基督救主啊！愿祢按我心所求的赐予我，使我的舌头如同那甜美发声的箫笛，好叫我藉着安慰、开导和造就，能够多少偿还我的诸多亏欠，并在祢慈悲的庇护下蒙救赎，当在祢可畏的荣耀前，每个灵魂都战栗不已之时。
    - type: paragraph
      text:
        ru: Ей, Владыко, Сыне Божий Единородный, услышь меня и прошение раба Твоего приими как дар. Я – грешник, спасаемый благодатью. Тебе, спасающему грешника щедротами Своими, подобает всякая слава во веки!
        cn: 啊，主宰啊，上帝的独生子！垂听我，收纳你仆人的恳求，如同恩赐。我是蒙恩得救的罪人。唯独你，以你丰盛的恩慈拯救罪人，配得一切荣耀，直到永远！
  - type: heading2
    text:
      ru: Стыд и срам ожидают нерадивых, плачь!
      cn: 羞愧和耻辱等待着怠惰之人，哀哭吧！
    children:
    - type: paragraph
      text:
        ru: 'Вострубит с неба небесная труба и скажет: «Пробудитесь, возлюбленные Христовы, вот пришел Царь Небесный дать вам упокоение и радость в вечной жизни за труды вашего подвижничества! Пробудитесь и зрите Христа Царя, Бессмертного Жениха, Которого любили, зрите Царство Его, которое Он уготовал вам! Приступите и радуйтесь с Ним радостью неизглаголанной!»'
        cn: '天上的号筒将从天上吹响，并说：

          「醒来吧，基督的蒙爱者们！看哪，天上的君王已来临，要为你们苦修的劳苦，在永恒的生命中赐予你们安息和喜乐！醒来吧，仰望基督君王，就是你们所爱的那不朽的新郎；仰望他为你们所预备的国度！走近他，与他一同以那不可言喻的喜乐欢庆吧！」'
    - type: paragraph
      text:
        ru: И воспарят праведные и достойные Бога на высоту воздушную в неисповедимой славе, а все нечестивые останутся внизу с великим стыдом. Блаженство и радость потрудившимся здесь, стыд и наказание всем грешникам!
        cn: 义人与配得神的人将升入空中，在无法言喻的荣耀中翱翔，而所有不敬虔之人将带着极大的羞耻留在下方。在此辛劳耕耘之人将得蒙真福与喜乐，而所有罪人则将蒙受羞耻与惩罚！
    - type: paragraph
      text:
        ru: Блажен, кто здесь потрудился оказаться достойным в тот час, и жалок тот, кто сделал себя недостойным на оный час. Облака восхитят всех святых с земли на небо, нечестивых же схватят Ангелы и ввергнут их в печь, горящую огнем неугасимым.
        cn: 蒙福的，是凡在此地劳苦努力，以求在那时刻被发现是配得的人；可怜的，是凡使自己在那时刻不配的人。云彩将把所有圣徒从地上提接到天上，不敬虔的人则将被天使抓住，投入那燃烧着不灭之火的炉子。
    - type: paragraph
      text:
        ru: 'Кто даст главе моей обильные воды и очесам источник, который бы всегда изливал слезы, да плачусь о себе день и ночь, умоляя Бога, чтобы не оказаться мне недостойным в час Его явления и не услышать от Владыки страшного оного приговора: «Отыди отМене, делатель беззакония: не вем, откуда еси ты»?'
        cn: 谁能赐予我的头丰沛的水，和我的双眼一个能常常涌出泪水的泉源，好让我为自己日夜哭泣，恳求上帝，免得我在他显现的时刻被判为不配的，也不从主宰口中听到那个可怕的判决：「离开我吧，作恶的人：我不知道你从哪里来！」
    - type: paragraph
      text:
        ru: 'Всевышний Боже, Единый Бессмертный! Окажи в оный час грешнику великие щедроты Свои, чтобы тайное нечестие мое не открылось пред зрителями: ангелами, архангелами, пророками, апостолами, праведными и святыми! Спаси нечестивого благодатью и щедротами и введи его в рай сладости с совершенными праведниками! Приими, Владыко, прошение раба Твоего по молитвам благоугодивших Тебе святых!'
        cn: '至高上帝，独一永生者！

          在那个时刻，施予罪人祢丰盛的怜悯，以免我隐秘的不虔敬在众见证者——天使、天使长、先知、使徒、义人和圣徒——面前显露！

          凭祢的恩典和怜悯拯救这不虔敬者，并引导他与完全的义人一同进入甜美的乐园！

          主宰者啊，垂听祢仆人的恳求，藉着蒙祢喜悦的圣徒的祈祷！'
  - type: heading2
    text:
      ru: К Богородице с исповеданием Приснодевства Ее и молитвой о достойном причащении Святых Таин
      cn: 向圣母，认信她的终身童贞，并祈求配得领受圣体圣血
    children:
    - type: paragraph
      text:
        ru: О Матерь Божия, превысшая всякого ума и слова! О Дева, несравненно превзошедшая всякое девство, потому что и до Божественного рождения была Ты девой паче всех дев – и таковой же пребыла в самом рождении и по рождении!
        cn: 噢，上帝之母，祢超越一切理智与言语！噢，贞女，祢无可比拟地超乎一切贞洁，因为祢在神圣的诞生之前，已是超越一切贞女的贞女——并且在生产之中与生产之后，亦复如是！
    - type: paragraph
      text:
        ru: 'Тебя, Владычица, прошу, Тебя умоляю, милосердую и человеколюбивую Матерь милосердого и человеколюбивого Бога: и в сей час защити меня, более чем когда-либо нуждающегося в Твоем покрове и в Твоей помощи!'
        cn: 主母啊，我恳求您，我向您祈求，您是慈悲仁爱的母亲，慈悲仁爱之神的母亲：就在此刻庇护我，我比以往任何时候都更需要您的护佑和您的帮助！
    - type: paragraph
      text:
        ru: Весь я – нечистота и греховная тина, весь жилище душепагубных страстей и намереваюсь приступить к Пречистым и Страшным Тайнам Сына Твоего и Бога, а потому мучусь страхом и объемлюсь трепетом по причине нестерпимого множества грехов моих.
        cn: 我整个人尽是不洁和罪恶的淤泥，尽是败坏灵魂之情欲的居所，并且我意欲临近你圣子与上帝至洁可畏的奥秘，因此我饱受恐惧与战栗的煎熬，皆因我那难以承受的众多罪孽。
    - type: paragraph
      text:
        ru: Но если остаюсь когда без причащения под предлогом своего недостоинства, то впадаю в большую глубину зол и подвергаю себя большим наказаниям. Тесно мне в том и другом случае.
        cn: 但如果我有时以自己不配为由而不领受圣餐，我便陷入更深的罪恶深渊，并使自己遭受更大的惩罚。无论在哪种情况下，我都感到左右为难。
    - type: paragraph
      text:
        ru: К Тебе прибегаю, будь благосерда ко мне, Пренепорочная Владычица моя! Употребив матернее дерзновение пред Сыном Твоим и Богом, испроси мне оставление прежних грехопадений, сподоби меня очиститься и просветиться приобщением сих Таин и укажи мне путь, как остаток жизни своей проводить в покаянии, чистоте и смирении, со мною всегда пребывая в делах, словах, помыслах и во всех душевных и телесных движениях, давая мне направление, предшествуя мне, руководствуя мною, отражая от меня сопротивные силы и, как раба, хотя и непотребного, всеми мерами снабжая и охраняя Твоей благостью.
        cn: '我投奔于祢，我至洁无玷的母后，求祢怜悯我！

          仗着祢在祢的圣子和上帝面前为母的坦然无惧，求祢为我求得往昔罪愆的赦免，

          使我配得借着领受这些圣事得以洁净并蒙受光照，

          并为我指明道路，如何在我的余生中，在悔改、洁净和谦卑中度过。

          求祢总是与我同在，在我的行为、言语、意念以及一切灵魂和肉体的活动中，

          给予我指引，先行在我前面，引导我，为我抵御敌对势力，

          并以祢的慈恩，以各种方式供应并保护我这虽不配的仆人。'
  - type: heading2
    text:
      ru: Слезами покупается врачевство души
      cn: 灵魂的医治，借眼泪购得。
    children:
    - type: paragraph
      text:
        ru: Податель всех благ, Источник исцелений и Сокровище щедрот – Ты единый Благой и Милосердый Боже, всегда дарующий блага просящим! Умоляю Тебя, да снидет на меня обильная благодать Твоя и да соберет воедино ум мой и исцелит снова сокровенные язвы мои, ибо развлечения и парения мысли непрестанно возобновляют тайные мои язвы.
        cn: 诸善的赐予者，医治的泉源，丰盛恩慈的宝藏——你这独一良善而仁慈的上帝，永远将美善赐予祈求者！我恳求你，愿你丰盛的恩典降临于我，并愿它将我的心思意念合而为一，再次医治我隐秘的创伤，因为纷扰和意念的游荡不断地重开我隐秘的创伤。
    - type: paragraph
      text:
        ru: Долготерпеливый Господи, всегда врачующий благодатью и щедротами, исцели великие душевные немощи во мне, грешном!
        cn: 恒久忍耐的主啊，您总是借着恩典和丰盛的怜悯来施行医治的，求您医治我这罪人身上极大的灵魂软弱！
    - type: paragraph
      text:
        ru: Я же, Владыко, не имею, чем воздать Тебе за врачевства Твои. Да и какую цену положить врачевствам Твоим? Ни небо, ни земля не могут дать вознаграждения, достойного их. Купить невозможно сих небесных святых врачевств, ибо им и цены нет. Только за слезы подаешь Ты их, Спаситель наш, и за горький плач даруешь их всем.
        cn: 然而我，主宰啊，没有什么可以报答祢的良药。又怎能给祢的良药定价呢？无论是天是地，都不能给出配得上它们的报答。不可能买到这些属天又圣洁的良药，因为它们根本没有价格。我们的救主啊，祢唯独凭着眼泪赐下它们，也凭着苦涩的哭泣将它们赐予众人。
    - type: paragraph
      text:
        ru: Даруй же, Владыко мой, мне, недостойному, на всякий день слезы и силу, чтобы сердце мое, с услаждением проливая источники слез, непрестанно просвещалось чистой молитвой, чтобы немногими слезами изгладилось великое рукописание и небольшим плачем угашен был там пламенеющий огонь. Ибо если здесь буду плакать, то там избавлюсь от неугасимого огня.
        cn: 求你赐予吧，我的主宰，我这不配之人，每一天都有泪水与力量，好使我的心，带着甘甜倾流泪水的源泉，不住地借着洁净的祷告被光照，好使借着几滴泪水，伟大的债券被涂抹净尽，并借着微小的哭泣，在那里燃烧的火焰被熄灭。因为如果在此地我哭泣，那么在那里我将免于不灭之火。
  - type: heading2
    text:
      ru: Отжени врага, ибо без Тебя кто с ним сладит?
      cn: 驱逐仇敌，因为没有你，谁能胜过他呢？
    children:
    - type: paragraph
      text:
        ru: Ежедневно раздражаю я долготерпение Твое, Владыко. Пред очами у меня и худость моя, и милосердие Твое.
        cn: 主宰啊，我日日触犯祢的久忍。在我眼前，是我的不堪与祢的慈悲。
    - type: paragraph
      text:
        ru: Поелику я во власти у нечистого врага, который всегда угнетает меня, то день и ночь со слезами буду взывать к Твоему милосердию, чтобы избавил Ты меня от нападений его. Ибо кто возможет перенести лукавого, если хотя на минуту отступит благодать Твоя, Владыко?
        cn: 因为我处于不洁净仇敌的权势之下，他总是压迫我，我就昼夜含泪呼求祢的怜悯，求祢将我从他的攻击中解救出来。因为，主宰啊，若祢的恩典哪怕片刻退去，谁又能忍受那恶者呢？
    - type: paragraph
      text:
        ru: Враг с часу на час и словами и делами угнетает душу мою. Сила Твоя, Христе, запретившая волнам морским, да запретит и ему, чтобы не имел он силы надо мной, рабом Твоим, потому что ежедневно обновляет он против меня ухищрения свои и спешит овладеть умом моим, отвлекая его от сладости божественных заповедей Твоих и спасительного поучения в оных. Пошли же, Владыко, благодать Твою вскоре, чтоб от раба Твоего отогнать великого змия со всеми скверными и злыми помыслами!
        cn: 仇敌时时刻刻无论言语还是行为都压制我的灵魂。基督啊，祢曾斥责海浪的能力，也愿它斥责仇敌，使它无法在我这祢的仆人身上拥有能力，因为它每日更新针对我的诡计，并急切地想要掌控我的心思，将它从祢神圣诫命的甘甜中以及其中那带来救恩的教诲中引开。求祢啊，主宰，速速降下祢的恩典，为要从祢的仆人身上驱逐那大蛇，连同它所有污秽和邪恶的意念！
    - type: paragraph
      text:
        ru: Обиженная вдова приходит к немилосердому и неправедному судье, чтобы защитил ее от соперника ее, а я прихожу к милосердому своему Владыке, долготерпеливому и благому, имеющему во власти небо и землю, – да услышит меня вскоре! Являющий защиту Свою всем надеющимся на Тебя день и ночь, не замедли защитить и меня, Владыко. Исхити меня у врага и управь путь мой к Тебе, чтобы, победив врага благодатью Твоей, благословлял я Тебя, Милосердый и Долготерпеливый, и прославлял Тебя единого, желающего спасения всем человекам!
        cn: 受欺压的寡妇来到无怜悯又不公义的审判官那里，为要他保护她，抵挡她的对头，而我来到我的慈悲主宰面前，祂是恒忍又良善的，拥有天地权柄——愿祂速速垂听我！祢日夜向所有仰赖祢的人显明祢的保护，主宰啊，不要迟延保护我。将我从仇敌手中救拔出来，并引导我的道路归向祢，好让我靠着祢的恩典战胜仇敌，称颂祢这位慈悲和恒忍的，并荣耀祢这位独一的、愿所有人得救的！
  - type: heading2
    text:
      ru: Благодать приходит и, находя сердце нечистым, отходит. Храни же сердце чистым!
      cn: 恩典临到，寻见心不洁净，就退去了。那么，当保守心洁净！
    children:
    - type: paragraph
      text:
        ru: Благой Бог дарует нам просвещение ведения, и благодать Его во всякое время часто посещает сердца наши. Если находит она себе упокоение, то, вошедши, постоянно обитает в душе, если же не находит чистого сердца, тотчас отступает. Но щедроты снова побуждают ее снизойти и посетить нас, грешных, потому что все мы изменчивы по произволению, но не по природе.
        cn: 良善的上帝赐予我们知识的启迪，祂的恩典在任何时候都常常眷顾我们的心。如果它找到了安歇之处，那么它一旦进入，便恒久居住在灵魂里；如果它没有找到一颗纯洁的心，便立刻退去。然而，祂的丰盛怜悯再次促使它降临并眷顾我们这些罪人，因为我们所有人都意愿多变，但本性并非如此。
    - type: paragraph
      text:
        ru: Всегда мы рассеянны и слабы, завистливы и лукавы, часто думаем друг о друге худо, занимаемся лукавыми помышлениями и всегда, как в ужасную тину, погружены в нечистые помыслы. Отчего, когда благодать приходит посетить нас, то, встречая в сердцах наших зловоние нечистых помыслов, тотчас отступает, не находя себе входа, чтобы вселиться и обитать в нас, как ей угодно, и разве только светоносной своей сладостью оставляет след в сердце, чтобы познал человек, что благодать посещала его, но не нашла себе входа, чтобы таким образом, усладившись озарением благодати, взыскал он ее.
        cn: 我们总是心神涣散、软弱无力，嫉妒而狡诈，常常彼此恶思，沉湎于狡诈的意念，并且总是如同陷入可怖的泥沼，浸没在不洁的意念中。因此，当恩典前来拜访我们时，它在我们的心中遇到不洁意念的恶臭，便立刻退去，因找不到入口，无法照她所愿地内住与安居在我们里面，也许仅以她光照的甘甜在心中留下痕迹，使人得以认识恩典曾到访过他，却未找到入口，好使他如此因恩典的光照而喜悦，便寻求她。
    - type: paragraph
      text:
        ru: Видишь ли Промысл Божий? Видишь ли милосердие Христово? Видишь ли, как Святой Бог всегда любит нас и хочет, чтобы спаслись мы?
        cn: 你看到神的摄理了吗？你看到基督的怜悯了吗？你看到圣洁的神总是爱我们，并希望我们得救了吗？
    - type: paragraph
      text:
        ru: Блажен человек, который всегда старается уготовать благодати чистое сердце, чтобы, пришедши, нашла она благоухание добродетелей и святыню души и возобитала в нем во век века!
        cn: 有福的人，他总是努力为恩典预备一颗清洁的心，以便它来临之时，能找到美德的芬芳和灵魂的圣洁，并在他里面永远居住！
  - type: heading2
    text:
      ru: По крайней скверноте недостоин я приступить к Тебе, Господи, и молиться
      cn: 因我极度的污秽，我不配来到你面前，主啊，也不配祷告。
    children:
    - type: paragraph
      text:
        ru: Доныне и в сей самый день с постыженным и поникшим долу лицом дерзаю вещать Тебе, Владыко Ангелов и Создателю всяческих. Я – земля и пепел, поношение человеков и уничижение людей, я – осужденник, весь покрытый ранами и исполненный уныния. Как вознесу взор ко благодати Твоей, Владыко? Как осмелюсь подвигнуть нечистый и оскверненный язык? Как положу начало исповеди моей?
        cn: 至今，甚至就在今日，我带着羞愧而低垂的面容，竟敢向祢述说，众天使之主，万有之创造者。我是尘土和灰烬，是世人的耻辱和人所藐视的，我是个受审判之人，遍体鳞伤，满心沮丧。主宰啊，我怎能抬头仰望祢的洪恩？我怎敢开启这不洁和污秽的舌头？我怎能开始我的忏悔呢？
    - type: paragraph
      text:
        ru: Сверх меры оскорбил я, окаянный, имя Твое и жил блудно, паче блудного сына, осквернил и повредил я в себе образ Твой, не соблюл гласа заповедей Твоих.
        cn: 我这悲惨的人，分外地亵渎了你的圣名，过着淫乱的生活，甚于浪子，玷污并败坏了我自身内你的形像，没有遵守你诫命的声音。
    - type: paragraph
      text:
        ru: Знаю, Господи, что по причине множества душевных скверн моих и по нечистоте моей недостоин я именоваться святым именем Твоим, не могу стать пред Тобой на молитву, не могу воззреть и видеть высоту небесную, потому что отверз я дверь непотребным вожделениям и, предавшись бесчинным стремлениям, осквернил страстями бедную душу свою, злоправием воли очернил душевный хитон свой. Весь ум мой наполнен бесовскими помыслами, всеми делами своими и помышлениями преогорчал я, преогорчаю и преогорчеваю благость Твою, а врагу своему, который ведет против меня брань, всегда угождаю и делаю приятное.
        cn: 主啊，我知道，因为我灵魂的众多污秽和我的不洁，我不配被称呼为您的圣名，无法站立在您面前祈祷，也无法仰望并看见天上的高处。因为我向不当的欲望敞开了门，并沉溺于放荡的冲动，用情欲玷污了我可怜的灵魂，又因意志的邪恶管理玷污了我灵魂的袍子。我的整个心思都充满着魔鬼的意念，我所有的行为和意念都已大大得罪，正大大得罪，且将大大得罪您的良善，而我的仇敌，那与我争战的，我却总是取悦他，并让他欢喜。
    - type: paragraph
      text:
        ru: Совесть моя обличает ум мой, стыдом покрываю лицо свое в сердце своем, прежде ожидающего меня Суда осуждаю сам себя.
        cn: 我的良心谴责我的心智，我在心里以羞愧蒙上我的脸，在等候着我的审判之前，我定自己的罪。
    - type: paragraph
      text:
        ru: С торжеством влечет меня за собой не оставляющий меня блудный навык, всегда погрязаю я в тине чревоугодия, всегда опутан скверными помыслами, с детства стал сосудом тлетворного греха, и доныне, ежедневно слыша о Суде и воздаянии, не хочу воспротивиться плотским похотям, но непрестанно вдаюсь в поползновения, непрестанно делаюсь пленником.
        cn: 那一直纠缠我的放荡习性凯旋般地牵引着我，我总是深陷于贪食的泥淖中，总是被污秽的念头缠绕，自幼就成了腐朽之罪的器皿。直至今日，每日听闻审判与报应，却不愿抗拒肉体的私欲，反而不住地屡屡跌倒，不住地沦为俘虏。
    - type: paragraph
      text:
        ru: Увы мне, Господи, худо расточил я долготерпение Твое! Увы мне, многие годы оскорблял я Духа Твоего Святого! Увы мне, время жизни моей протекло во всякой суете! Но ты, Господи, не обличай меня в ярости Твоей и ненавистных, срамных дел моих не выставляй на всемирное позорище пред всеми Ангелами и человеками к моему стыду и вечному осуждению, хотя и достоин я всякого стыда и осуждения. По одним великим щедротам Твоим помилуй меня и прежде Суда очисти все грехи мои!
        cn: '哀哉我，主啊，我竟糟蹋了您的恒忍！

          哀哉我，多年亵渎了您的圣灵！

          哀哉我，我生命的年日竟在各样虚妄中流逝了！

          然而，主啊，求您不要在您的烈怒中责备我，也不要将我可憎可耻的行径在所有天使和世人面前公诸于众，使我蒙羞受辱，并受永远的定罪，尽管我配得一切的羞耻和定罪。

          唯独因着您伟大的怜悯，求您怜悯我，并在审判之前洁净我所有的罪！'
  - type: heading2
    text:
      ru: Смерть и суд – к покаянию
      cn: 死亡与审判——归向悔改
    children:
    - type: paragraph
      text:
        ru: Воспомянул я день кончины и восстенал, увидев, как многочисленны вины мои, как тяжки беззакония мои, и размыслив, что неправды мои будут открыты взору всякого.
        cn: 我回想起离世之日，便哀叹不已，因为我看见我的罪愆何其众多，我的不法之事何其沉重，并思忖我的不义将展现在众人眼前。
    - type: paragraph
      text:
        ru: Нет там места покаянию, слезам и молитвам, но каждый получит награду по трудам своим, воздаяние по деланию своему, и Праведного Судию не преклонят на милость ни плач, ни страдания. Умилосердись надо мной, Человеколюбец!
        cn: 在那里没有悔改、眼泪和祷告之地，但各人将照他们所行的得赏报，照他们所作的得偿报；公义的审判者不会因哭泣或苦难而动怜悯。仁爱者啊，怜悯我！
    - type: paragraph
      text:
        ru: В день, когда отверзутся гробы умерших, возгласит труба, возгремит глас ее, великий трепет и ужас обымут вселенную, все Ангелы низойдут по Твоему повелению разлучать добрых и злых, явятся огненные облака и понесут на себе чистые плоти святых, – в тот день и на мне да явятся щедроты Твои, да стануодеснуюТебя, Благий Господи, и буду помилован!
        cn: '在死者的坟墓开启之日，

          号筒将发出声响，其声音将如雷鸣般震撼，

          巨大的战栗与恐惧将笼罩整个宇宙，

          所有天使将奉祢的命令降临，将善人与恶人分开，

          火云将显现，并承载着圣徒纯洁的身体，

          ——在那日，愿祢的慈爱也临到我身，愿我能侍立在祢的右边，良善的主啊，并蒙怜悯！'
    - type: paragraph
      text:
        ru: 'Сошел я мыслью в могилы видеть нетление наше и, рассмотрев, что в них, воззвал: «Не отвратись от раба Твоего, Господи! Воскреси погибающего, да воздам хвалу владычеству Твоему, низложи лукавого, который радовался о мне в день скорби, и помилуй меня, потому что на Тебя возлагал я упование!»'
        cn: 我的思绪降入坟墓，欲见我们之不朽；审视其中所有之物后，我高呼道：「主啊，求祢不要转面不顾祢的仆人！复活这濒亡之人，好使我能颂扬祢的权能；击败那在我忧患之日曾为我幸灾乐祸的恶者，并怜悯我，因我将我的指望寄予祢！」
    - type: paragraph
      text:
        ru: Суд без милости ожидает при конце тех, которые согрешили и не покаялись в лукавых делах своих, а творившие правду и хранившие заповеди Господа своего приимут от Него небесные блага, наследуют вечную жизнь. Возрадуются там праведники о трудах своих, возвеселятся святые о приятых ими наградах.
        cn: 在末日，没有怜悯的审判等待着那些犯了罪却未曾为他们邪恶的行径悔改的人。然而，行公义并谨守他们主诫命的人，将从祂那里领受天上的福祉，继承永生。在那里，义人将因他们的劳苦而欢欣鼓舞，圣徒们将因他们所领受的奖赏而欢庆。
    - type: paragraph
      text:
        ru: Всех нас всели в брачном чертоге Твоем, милосердый к грешникам Господь наш!
        cn: 使我们众人安居在祢的婚殿中，怜悯罪人的我们的主啊！
  - type: heading2
    text:
      ru: Уроки жизни. Восемь злых помыслов
      cn: 生命课程。八种恶念
    children:
    - type: paragraph
      text:
        ru: 'Знай, что восемь помыслов, которыми производится всё худое: чревоугодие, блуд, сребролюбие, гнев, безвременная печаль, уныние, тщеславие, гордость, – ведут брань с каждым человеком.'
        cn: 须知，八种意念——由此生发一切邪恶：贪食、淫欲、贪财、忿怒、无益的忧伤、懈怠、虚荣、骄傲——与每个人争战。
    - type: paragraph
      text:
        ru: Если хочешь победить чревоугодие, возлюби воздержание, имей страх Божий – и победишь.
        cn: 如果你想战胜贪食，就要爱节制，要有敬畏上帝的心，你就能战胜。
    - type: paragraph
      text:
        ru: Если хочешь победить блуд, возлюби бдение и жажду, помышляй всегда о смерти, никогда не имей бесед с женщиной – и победишь.
        cn: 如果你想战胜淫乱，就当爱警醒与饥渴，时常默想死亡，绝不与女子交谈，便能得胜。
    - type: paragraph
      text:
        ru: Если хочешь победить сребролюбие, возлюби нестяжательность и нерасточительность.
        cn: 如果你想战胜贪财，就当爱不贪求和不挥霍。
    - type: paragraph
      text:
        ru: 'Если хочешь победить гнев, приобрети кротость и великодушие и содержи в мысли, сколько зла делали иудеи Господу нашему Иисусу Христу, и, однако ж, Он, как Человеколюбец Бог, не гневался на них, а, напротив того, молился за них, говоря: «Отче, отпусти им грех сей, не ведят бо, что творят».'
        cn: 如果你想战胜愤怒，就要获得温柔和宽宏大量，并牢记在心，犹太人曾对我们的主耶稣基督做了多少恶事，然而他，作为喜爱世人的上帝，并没有对他们发怒，反而为他们祈祷，说：「父啊，赦免他们这罪，因为他们不晓得他们所做的。」
    - type: paragraph
      text:
        ru: Если хочешь преодолеть безвременную печаль, никогда не печалься о чем-либо временном, но если тебя язвят словом, или беспокоят, или бесчестят, не печалься, а, напротив того, радуйся. Тогда только печалься, когда согрешишь, но и в сем случае соблюдай меру, чтобы не впасть в отчаяние и не погибнуть.
        cn: 如果你想克服无益的忧愁，绝不要为了任何暂时的事物而忧愁；但是如果有人用言语中伤你，或者搅扰你，或者羞辱你，不要忧愁，相反地，要欢喜。只有当你犯罪的时候才忧愁，但即使在这种情况下，也要保持分寸，以免陷入绝望，并且不至灭亡。
    - type: paragraph
      text:
        ru: Если хочешь преодолеть уныние, займись, хотя ненадолго, каким-либо рукоделием, или читай, или часто молись.
        cn: 如果你想克服沮丧，即使只是短暂地，也要做些手作，或者阅读，或者常常祷告。
    - type: paragraph
      text:
        ru: Если хочешь победить тщеславие, не люби ни похвал, ни почестей, ни хороших одежд, ни первоседания, ни предпочтения, а, напротив того, люби, чтобы порицали и бесчестили тебя, возводя на тебя ложь, и укоряй сам себя, что ты грешнее всякого грешника.
        cn: 如果你想战胜虚荣，就不要喜爱赞扬、尊荣、华美的衣裳、首座或受人偏爱；相反地，要喜爱被人责备和羞辱，喜爱被人捏造谎言诬陷你；并且要责备自己，认为自己比任何罪人更有罪。
    - type: paragraph
      text:
        ru: Если хочешь победить гордость, что ни делаешь, не говори, что делается сие собственными твоими трудами или собственными твоими силами, но, постишься ли, проводишь ли время в бдении, спишь ли на голой земле, поешь ли псалмы, или прислуживаешь, или кладешь много земных поклонов, говори, что при Божией помощи и при Божием покровительстве делается сие, а не моей силой и не моим старанием.
        cn: 如果你想战胜骄傲，无论你做什么，都不要说这是凭你自己的劳苦或你自己的力量完成的，无论是禁食，是守夜，是睡在光秃的地上，是吟唱圣咏，是服侍，是多次叩拜，你要说这是在上帝的帮助和上帝的庇护下完成的，而不是凭我自己的力量和我的努力。
- type: heading1
  text:
    ru: Отделение семнадцатое
    cn: 第十七章
  children:
  - type: heading2
    text:
      ru: Хвала воплотившемуся для нашего спасения Господу
      cn: 颂赞为我们的救赎道成肉身的主
    children:
    - type: paragraph
      text:
        ru: Хвала Тому, Кто снисшел к нам в человеческом естестве. Хвала Невидимому, ради нас соделавшемуся видимым. Хвала Вечному, за нас вкусившему смерть. Хвала Сокровенному, Которого никакой ум постигнуть не может и Который по благодати Своей соделал Себя осязаемым чрез воплощение.
        cn: 赞美那以人的本性降临于我们者。赞美那不可见者，为着我们成为可见。赞美那永恒者，为着我们尝受了死亡。赞美那隐秘者，没有任何心智能够领悟祂，而祂凭着祂的恩典，藉着道成肉身使祂自己成为可触知。
    - type: paragraph
      text:
        ru: Благословен Тот, Кого собственная Его благая воля довела до матернего чрева и лона, до рождения и возрастания. Благословен Тот, Кто, став причастным смерти, даровал тем жизнь человечеству.
        cn: '愿祂蒙福，祂那美善的旨意，将祂引至母腹与怀抱，直至降生与长成。

          愿祂蒙福，祂藉着分尝死亡，将生命赐予了人类。'
    - type: paragraph
      text:
        ru: Благословен Соделавший плоть нашу жилищем сокровенного существа Своего. Благословен Тот, Кто нашим языком поведал нам тайны Свои.
        cn: 愿颂赞归于那使我们的肉体成为祂隐秘之存在居所的。愿颂赞归于那藉着我们的口舌向我们言明祂奥秘的。
    - type: paragraph
      text:
        ru: Хвала Тому, Кто освободил нас, быв Сам связан за нас. Слава Богатому в милости, Который за нас заплатил всё, чего Сам не брал в заем. Хвала Судии, Который за нас осуждение принял.
        cn: '赞美那为我们被捆绑，却释放了我们的一位。

          荣耀归于那位在怜悯上富足的，他为我们偿清了他自己从未借贷的一切。

          赞美那位为我们担当了定罪的审判者。'
    - type: paragraph
      text:
        ru: Поклонимся Тому, Кто просветил ум наш учением Своим и в слухе нашем проложил стезю слову Своему. Возблагодарим Того, Кто к нашему древу привил плод Свой.
        cn: 我们俯伏敬拜那位，祂藉着祂的教导光照了我们的心智，并在我们的耳中为祂的圣言开辟了道路。我们感谢那位，祂将祂的果实嫁接到我们的树上。
    - type: paragraph
      text:
        ru: Хвала Тому, Кто невидимо возделывает дух наш. Благословен Тот, Кто настроил чувства духа нашего, чтобы на гуслях своих духовных воспевал он Его выну.
        cn: 赞美那无形中耕耘我们灵的祂。蒙福的祂，调和了我们灵的感受，为要使它能在其属灵的古斯里琴上，不停地歌颂祂。
  - type: heading2
    text:
      ru: Согрешил, прости! Постараюсь быть исправным при помощи благодати Твоей
      cn: 我犯了罪，求你赦免！我将努力，借着你的恩典改过自新。
    children:
    - type: paragraph
      text:
        ru: 'Приступи ко Отцу щедрот, грешник, и, исповедуя грехи свои, скажи со слезами: «Согреших на небо и пред Тобою, Господи Боже Вседержителю, и уже несмь достоин нарещися сын Твой, ниже наименовать славное имя Твое грешными устами моими, потому что я сделал себя недостойным неба и земли, прогневав Тебя, Благого Владыку!»'
        cn: '罪人哪，当就近施恩之父，认自己的罪，含泪说：


          「主上帝，全能者啊，我得罪了天，又得罪了你，如今不配称为你的儿子，也不配用我这罪污的嘴唇称颂你荣耀的圣名；因为我触怒了你这位善良的主宰，使自己不配得天与地！」'
    - type: paragraph
      text:
        ru: Умоляю Тебя, Господи, не отвергни меня от лица Твоего и не отступи от меня, чтобы не погибнуть мне. Если бы рука Твоя не покрывала меня, то я погиб бы уже, был бы как прах пред лицом ветра и стал бы как не появлявшийся никогда в мир сей. Ибо с тех пор, как оставил я путь Твой, не встречал себе доброго дня, так как день, проведенный во грехе, хотя кажется добрым, но на деле из самых горьких есть наиболее горький.
        cn: 我恳求祢，主啊，不要从祢的面前弃绝我，也不要离开我，免得我灭亡。若非祢的手遮盖我，我早已灭亡了；我必如同风面前的尘土，并且如同从未出现在这世上一般。因为自从我离开了祢的道路，就未曾遇见过一个好日子；因为在罪中度过的日子，尽管看起来是好的，但实际上，在所有苦涩之中，它是最苦涩的。
    - type: paragraph
      text:
        ru: 'И отныне надеюсь на милость Твою, что дашь Ты мне силы позаботиться о спасении своем. Ныне припадаю к Тебе, умоляя: помоги мне, уклонившемуся с пути правды. Излей на меня щедроты Твои, как на блудного сына, потому что осрамил я жизнь свою, расточил богатство благодати Твоей. Помилуй меня и не презри меня по причине непотребной жизни моей. Помилуй меня, как грешницу, как мытаря, ущедри меня, как разбойника: он на земле был отвержен всеми, но Ты принял его и сделал жителем рая сладости. Приими покаяние и от меня, потому что и я отвержен всеми. Ты, Господи, пришел не праведников спасать, но грешников призвать к покаянию – приими убо и меня, кающегося Тебе!'
        cn: 从今以后，我仰望祢的怜悯，愿祢赐予我力量，顾念我自己的救恩。如今我俯伏在祢面前，恳求祢帮助我这偏离了公义道路的人。求祢将祢的厚恩倾泻在我身上，就像对待那浪子一样，因为我羞辱了自己的生命，耗尽了祢恩典的财富。怜悯我，不要因我败坏的生活而轻视我。怜悯我这罪妇，就像怜悯那税吏一样；施恩于我，就像对待那强盗一样：他虽在地上被众人弃绝，但祢却接纳了他，使他成为乐园的居民。也求祢接受我的悔改，因为我也被众人弃绝。主啊，祢来不是要拯救义人，乃是要召罪人悔改——那么，也求祢接纳我这向祢悔改的人吧！
  - type: heading2
    text:
      ru: Сколько раз давал обещание – и все обманывал, но по благодати Твоей презри и это!
      cn: 我多少次许下诺言——却都背弃了，但因你的恩典，也求你轻看这一切吧！
    children:
    - type: paragraph
      text:
        ru: Даруя прощение, Господи, посли и силу, обрати меня так, чтоб и жить мне в преподобии, по святой воле Твоей. Освяти сердце мое, соделавшееся вертепом и жилищем бесов!
        cn: 主啊，在祢赐予赦免的同时，也赐下力量，改变我，使我能照祢的圣善旨意，以敬虔度日。圣化我的心，这颗已然成为邪魔巢穴和居所的心！
    - type: paragraph
      text:
        ru: Недостоин я просить себе прощения, Господи, ибо много раз давал обещание покаяться – и делался лжецом, не исполнившим обещания, много раз уже восставлял Ты меня, но я снова падал самохотно.
        cn: 不配为自己求得赦免，主啊，因为我曾多次许诺悔改，却成了没有履行诺言的说谎者；你已多次扶立我，但我却又自愿跌倒了。
    - type: paragraph
      text:
        ru: Поэтому сам на себя произношу приговор и признаюсь, что достоин я всякого наказания и мучения. Сколько раз просвещал Ты омраченный ум мой, но я снова возвращаюсь на худшее! Весь прихожу в трепет, размыслив о сем, и снова препобеждает меня сласть греховная.
        cn: 因此，我宣判自己，并承认我配受一切的惩罚和苦难。您多少次光照我昏暗的心智，我却又重返更差的光景！思及此事，我全身战栗，罪恶的甘美却又再次胜过我。
    - type: paragraph
      text:
        ru: Как перечислю все дары благодати Твоей, Господи, какие получил я, жалкий, но обращал и обращаю в ничто своим нерадением? Тысячами даров исполнял Ты меня, а я, бедный, воздаю Тебе тем, что противно Тебе.
        cn: 主啊，祢恩典的一切恩赐，我怎能尽述？我这可怜人所领受的，却因着自己的懈怠，曾将它们化为乌有，现今亦复如是？祢以千万恩赐充满了我，而我这可怜人，所回报祢的，却是那与祢心意相悖逆之事。
    - type: paragraph
      text:
        ru: Но Ты, Господи, поскольку в Тебе море долготерпения и бездна у Тебя благоутробия, не дозволяй посечь меня, бесплодную смоковницу, и не допусти пожечь меня, на поле жизни еще не созревшего. Не восхищай меня неготового, не поемли не возжегшего еще светильника, не бери отсюда не имеющего у себя брачного одеяния, но, как Благой и Человеколюбивый, помилуй меня, дай мне время на покаяние и пред страшным, неподкупным Престолом Твоим не поставь душу мою обнаженной, как жалкое позорище бесславия.
        cn: 但祢，主啊，因为在祢有忍耐的海洋，在祢有怜悯的深渊，不要允许我这不结果子的无花果树被砍伐，也不要让我这在生命的田地里尚未成熟的被焚烧。不要接走我这未预备好的，不要取走我这尚未点燃灯盏的，不要从这里带走我这没有婚筵礼服的。但祢作为美善和爱人的主，求祢怜悯我，给我悔改的时间，并且在祢那可畏、不被收买的宝座前，不要让我的灵魂赤身露体地站立，如同一场凄惨蒙羞的景况。
    - type: paragraph
      text:
        ru: Если праведник едва спасется, то где явлюсь я, нечестивый и грешный? Если узок и тесен путь, вводящий в живот, то как сподобиться оных благ мне, живущему пространно, самоугодливо и рассеянно? Но Ты, Господи, Спасителю мой, Сын Бога истинного, как Сам знаешь и как Сам хочешь, по единой благости Твоей туне обрати меня от пребывающего во мне греха и спаси от погибели!
        cn: 如果义人仅仅得救，那么我这不敬虔、有罪之人将出现在哪里呢？如果那引向生命的道路是狭窄而崎岖的，那么我这生活放纵、自私放任、心神涣散的人，怎能配得那些恩惠呢？然而祢，主啊，我的救主，真实上帝的儿子，照祢自己所知和所愿的，凭祢独有的美善，白白地将我从我里面常存的罪中回转，并拯救我脱离灭亡！
  - type: heading2
    text:
      ru: Обрати силой, не ожидая моего произволения!
      cn: 以大能扭转我，不待我的自由意志！
    children:
    - type: paragraph
      text:
        ru: Как оплачу ослепление души своей? Как оплачу пагубное неведение себя самого? Как оплачу страстное и нераскаянное произволение свое? Подвижники упокоеваются, утешаемые Духом Святым, а я мятусь, ропща на убожество, причина которого – мое нерадение. Приложихся скотом несмысленным и уподобихся им. Наг стал я, окаянный, по лености своей, потому что чуждаюсь пребывающих в молитве и бдении.
        cn: 如何弥补我灵魂的蒙蔽？如何弥补我那毁灭性的不认识自己？如何弥补我那充满私欲又不悔改的任性？苦修者们得享安宁，受圣灵安慰，而我却心绪不宁，抱怨着自己的贫乏，其原因是我自己的怠惰。我被比作无知的牲畜，与它们相似。我这可怜的人因自己的懒惰而变得赤身裸体，因为我远离那些在祷告和守夜中的人。
    - type: paragraph
      text:
        ru: 'Призри на меня милостью, Владыко, с высоты святыя Твоея! Воззри на неисправимость бедной души моей и какими Сам знаешь судьбами помилуй и исправь меня! Как бы предстоя Престолу славы Твоей, как бы касаясь пречистых ног Твоих, умоляю и прошу с сокрушенным сердцем: помилуй меня, милосердуя о создании Своем, обрати меня туне благодатью Твоей!'
        cn: 上主啊，求你从你圣洁的高天以恩慈垂顾我！垂顾我贫乏灵魂无可救药的光景，并以你所知的方式怜悯并纠正我！仿佛侍立在你荣耀的宝座前，仿佛触碰你至洁的圣足，我以破碎的心恳求和祈求：怜悯我，因你怜恤你的受造物，愿你白白地以你的恩典使我回转！
    - type: paragraph
      text:
        ru: Знаю, что всё Ты можешь и нет ничего невозможного для Тебя. Не ожидай растленного моего произволения, потому что нет у меня усердия исправить себя.
        cn: 我知道你凡事都能，并且对你而言，没有不可能的事。不要期待我那败坏的私意，因为我没有热心去修正自己。
    - type: paragraph
      text:
        ru: Всякое видимое и невидимое естество да плачет обо мне, состарившемся во грехах и страстях! Плачьте обо мне, который напоказ видящим меня целомудрен, а внутренне всегда любодействую!
        cn: 愿所有可见的和不可见的受造物都为我哭泣，因我已在罪恶和情欲中衰老！为我哭泣吧，我在人前显出贞洁，而内心却总是淫乱！
  - type: heading2
    text:
      ru: Пора наконец познать обман врага и опомниться
      cn: 是时候了，终于要认识仇敌的欺骗，并醒悟过来。
    children:
    - type: paragraph
      text:
        ru: 'Займись наконец, грешник, своим спасением и, уединясь, собери свои помыслы и скажи себе: «Сколько времени исполнял ты похоти плоти и помышлений своих, какую же получил ты пользу и что приобрел себе, делая это?» Увы, душа моя, до какого дошли мы с тобой состояния, до какого расстройства!'
        cn: 是时候了，罪人，去着手你的救恩吧；独处一室，收敛你的意念，并对自己说： 「你随从肉体的私欲和自己的意念，已经有多久了？如此行，你究竟得了什么益处，又为自己赢得了什么呢？」 唉，我的灵魂，我们俩竟沦落到何等光景，何等败坏的地步！
    - type: paragraph
      text:
        ru: 'Смотри: вон все вокруг украшены добродетелями и поистине боятся Бога, а я один хожу во тьме. С раннего утра раскаиваюсь в том, что делаю, а немного спустя поступаю еще хуже. Господь дал мне силу и здоровье – и вот, полагаясь на то, прогневляю я Создателя своего.'
        cn: 看啊：周围的人都以美德为妆饰，并且真诚地敬畏上帝，而我独自一人却行在黑暗中。从清晨起，我就为我所做的事悔改，可是没过多久，我就做得更糟了。主赐予我力量和健康——然而，我却仗恃着这些，惹怒了我的造物主。
    - type: paragraph
      text:
        ru: Зачем же так нерадива ты, душа моя? Зачем так беспечна? Не всегда же тебе оставаться здесь! Пошлет наконец Господь Ангела Своего по тебя – и должна будешь нехотя идти отсюда. Тогда что?
        cn: 我的灵魂啊，你为何如此疏忽怠惰？你为何如此掉以轻心？你不可能永远留在这里！主最终会差遣祂的天使来接你——那时你将不得不不情愿地离开这里。那时该怎么办呢？
    - type: paragraph
      text:
        ru: 'Познай же наконец крайнюю беду свою, человек, и перестань прекословить Создавшему тебя и противиться повелениям Его. Врагу же, обольщающему тебя, с дерзновением скажи: «Позором для Ангелов и человеков сделал ты меня, диавол, когда я послушался злочестивого совета твоего. Ты внушил мне мысль: однажды удовлетвори похотению своему – и вот малое это дело стало для меня великой пропастью, и я предался срамным твоим вожделениям. Вода нашла малую скважину и сделала из нее большое отверстие.'
        cn: 人啊，终于认识到你深重的祸患吧，停止悖逆那创造你的主，并违抗他的诫命。至于那诱惑你的仇敌，你要大胆地对他说：「魔鬼啊，当我听从了你那邪恶的建议时，你使我成为天使和世人的羞辱。你向我灌输了一个念头：「满足一次你的私欲吧」——结果这件小事却成了我的万丈深渊，我便沉溺于你那可耻的情欲。水找到了一个微小的裂缝，并将其扩大成一个大窟窿。」
    - type: paragraph
      text:
        ru: 'Ты омрачил ум мой нечистыми помыслами и ввергал меня из греха в грех: уничтожил во мне воздержание под предлогом немощей чрева моего, сделал меня чуждым для молитвенного бдения, насадил во мне сребролюбие под предлогом продолжительной старости, иссушал мои слезы, ожесточил сердце мое, отвлек меня от подчинения во Христе, умножил для меня развлечения, сделал меня непокорным, довел до того, что я не трудился над должным, а занимался суетами, научил меня зависти и злословию, сделал меня высокомерным, раздражительным и гневливым, научил меня объядению, пьянству и сластолюбию, приучил рассеиваться во время чтения и псалмопения, так что молюсь – и не знаю, о чем, читаю псалмы, а между тем отдаюсь в плен неудержному блужданию помыслов».'
        cn: 你蒙蔽了我的心智，使我充满不洁的意念，将我从一个罪引向另一个罪：你以我肚腹的软弱为借口，摧毁了我里面的节制；使我疏远了祈祷守夜；以年迈为借口，在我里面植入了贪爱钱财的心；使我的眼泪枯干；使我的心刚硬；使我偏离了在基督里的顺服；为我增加了分心之事；使我悖逆不顺从；使我不再努力做当做之事，反而沉溺于虚空之中；教导我嫉妒和毁谤；使我傲慢、易怒、好生气；教导我暴饮暴食、酗酒和贪恋肉欲；使我习惯在阅读和唱颂诗篇时心神涣散，以致我祷告时，不知所祷为何，诵读诗篇时，我的意念却毫无节制地游荡，沦为其俘虏。
    - type: paragraph
      text:
        ru: 'Обличив так козни врага, скажи ему наконец с твердостью: «Довольно с тебя, диавол!» – и, оставя лукавого, прилепись к Человеколюбцу Богу. Уязвлена ты? Не отчаивайся. Пала? Восстань и мужественно скажи: «Ныне начах». Припади ко Владыке своему милостивому и исповедуй грехи свои.'
        cn: 如此揭露了仇敌的诡计，最终坚定地对它说：「魔鬼，你够了！」然后，离弃那恶者，紧密依附于爱人的上帝。你被创伤了吗？不要绝望。你跌倒了吗？起来并勇敢地说：「现在我开始了。」俯伏于你那慈悲的主宰，并忏悔你的罪过。
    - type: paragraph
      text:
        ru: 'Но прежде нежели что скажешь, Он уже наперед ведает, что будешь говорить, прежде нежели отверзешь уста, Он узнает, что у тебя на сердце. Не успеешь сказать: «Согрешил», как увидишь Его простирающим к тебе длани Свои, чтобы приять тебя и обнять.'
        cn: 但你在开口说什么之前，他早已预先知晓你将要说什么；在你张开嘴唇之前，他就明白你心中所想。你还来不及说：「我犯了罪」，就将看到他向你伸出他的双手，为要接纳你并拥抱你。
    - type: paragraph
      text:
        ru: С верою приступи – и Он тотчас очистит тебя, как прокаженного, восставит с одра, как расслабленного, воскресит, как Лазаря.
        cn: 凭着信心前来——祂就立刻洁净你，如同麻风病人；使你从病榻上复起，如同瘫痪病人；使你复活，如同拉撒路一般。
  - type: heading2
    text:
      ru: Ради поползновенности нашей яви милость!
      cn: 因着我们易于跌倒的本性，施予怜悯！
    children:
    - type: paragraph
      text:
        ru: К милосердию Твоему прибегаю я, изъязвленный. Приими воздыхания мои, как слезы блудницы.
        cn: 满身创伤的我，投奔祢的慈悲。求祢接纳我的叹息，如同那妓女的眼泪。
    - type: paragraph
      text:
        ru: Ведаешь Ты, Владыко, поползновенность естества человеческого. Помяни, что от юности прилежно прилежит человеку помышление на злое, и не гневайся на меня до конца, но отверзи мне руку и дверь милосердия Твоего; беспечность моя да не одолеет попечительности Твоей.
        cn: 主宰啊，祢深知人性易于跌倒之处。求祢记念，从幼年起，恶念便殷勤地依附于人，求祢不要终究向我发怒，但求祢为我开启祢怜悯之手和怜悯之门；愿我的懈怠不致胜过祢的眷顾。
    - type: paragraph
      text:
        ru: Приими, Владыко, и услыши нечистое и недостойное прошение мое – Ты, спасающий уповающих на Тебя, не отвергающий моления грешных, подающий руку Свою поверженному на землю! Путеводствуй мною в страхе Твоем и дай мне слезы умиления.
        cn: 接受吧，主宰啊，并垂听我不洁和不配的恳求——你，拯救那些仰赖你的人，不拒绝罪人的祷告，向那仆倒在地上的伸出你的手！在你的敬畏中引导我，并赐予我痛悔的泪水。
    - type: paragraph
      text:
        ru: Мысленные очи души моей возвел я к Тебе, Господи, не отвергай меня от лица Твоего, потому что благословенно имя Твое во веки!
        cn: 我灵魂的意念之眼向你仰望，主啊，不要将我从你面前弃绝，因为你的名是永受称颂的！
  - type: heading2
    text:
      ru: Божие наказание и любовь
      cn: 上帝的惩罚与爱
    children:
    - type: paragraph
      text:
        ru: Прогневал я грехами своими Тебя, Господи, но Ты неохотно гневаешься, потому что преисполнен преизбыточествующей милости и лепота Твоя невозмутима.
        cn: 我因我的罪孽触怒了你，主啊，但你并不情愿发怒，因为你充满丰盈的怜悯，你的荣美安宁不动。
    - type: paragraph
      text:
        ru: Ты – море щедрот, а наши неправды – нечистая капля. Одна же капля не может возмутить необъятного моря.
        cn: 你——是恩慈的海洋，而我们的不义——只是一滴不洁的水。然而，一滴水怎能搅动那浩瀚无垠的大海？
    - type: paragraph
      text:
        ru: Ты не смущаешься, когда негодуешь, и не гневаешься, когда наказываешь. Если бы разгневался Ты, когда наказываешь, то мир не стерпел бы гнева Твоего.
        cn: 祢在愤慨时并不困扰，在惩罚时也不发怒。如果祢在惩罚时发怒，世界就无法承受祢的怒气。
    - type: paragraph
      text:
        ru: Твои удары исполнены любви, Твое наказание пламенеет щедротами; по любви Своей, когда и наказываешь, имеешь в виду одно только благо.
        cn: 你的击打充满爱意，你的管教炽热着丰盛的恩慈；出于你的爱，即便管教时，你所意图的唯有益处。
    - type: paragraph
      text:
        ru: 'Жезлы наказания Твоего срезаны с древа милосердия Твоего: к чему коснется жезл Твой, везде удар приносит великое благо.'
        cn: 祢的惩戒之杖，乃是从祢的仁慈之树上截取下来的：祢的杖触及之处，其击打总能带来极大的益处。
    - type: paragraph
      text:
        ru: Когда наставник наказывает своего воспитанника, то не по ненависти бьет его, но желает ему пользы и, любя, наказывает его. И Твой удар поражает из любви, а не по злобе наказываешь Ты. Нашего блага желаешь Ты, Господи, потому что всеми способами доказываешь милосердие Свое.
        cn: 当导师惩戒他的门生时，并非出于憎恨鞭打他，而是愿他得益，并出于爱而惩戒他。祢的击打出于爱，祢的惩戒并非出于恶意。主啊，祢愿我们得益，因为祢用尽一切方式显明祢的怜悯。
    - type: paragraph
      text:
        ru: Нетрудно Тебе сносить неправды наши, потому что Ты – Творец естества нашего. Ты не обременяешься Своим творением, потому что знал нас прежде, нежели сотворил.
        cn: 您忍受我们的不义毫无困难，因为您是我们的本性的创造者。您不被您的受造物所累，因为您在创造我们之前就已认识我们了。
    - type: paragraph
      text:
        ru: Кто переносит беспокойства от хождения за младенцем, как не матерь, которая родила его? Кто переносит неправды мира, как не Господь его?
        cn: 谁会忍受照顾婴儿的烦恼，若不是那生下他的母亲呢？谁会忍受世间的诸般不义，若不是那世界的主呢？
    - type: paragraph
      text:
        ru: Творцу легко переносить всё тяжелое от тварей Своих, потому что если бы не захотел Он переносить, то и не сотворил бы тварей.
        cn: 造物主轻易地承载来自祂受造物的一切重担，因为如果祂不愿承载，祂也就不会创造受造物了。
    - type: paragraph
      text:
        ru: Еда забудет жена отроча свое, еже не помиловати исчадия чрева своего? Но если и забудет жена отроча свое, то Бог не забудет мира, сотворенного Им (Ис. 49:15).
        cn: 妇人岂能忘记自己的婴孩，以致不怜恤她腹中所生的呢？但即便妇人会忘记自己的婴孩，上帝却不会忘记祂所创造的世界（以赛亚书 49:15）。
    - type: paragraph
      text:
        ru: Подвиглись естественные щедроты Его, и Он зачал и породил тварь; как младенец из матернего чрева, изник из воли Его мир.
        cn: 祂固有的恩慈被激发，祂就怀胎并产出万有；世界如同婴孩从母腹中，从祂的旨意中涌现。
    - type: paragraph
      text:
        ru: И вот подъемлет и носит Он мир, как питающая млеком своим мать с любовью носит плод, порожденный из чрева ее.
        cn: 而今祂托举并承载着世界，如同一个以乳汁滋养的母亲，带着爱怀抱那从她腹中所出的胎儿。
    - type: paragraph
      text:
        ru: Милосердый Отец родил нас и питает Кровью Сына Своего. Так матерь дает сосцы свои детищу своему, чтобы напитать его.
        cn: 慈悲的父生了我们，并以他儿子的宝血滋养我们。正如母亲把乳房给她的婴孩，好喂养他。
    - type: paragraph
      text:
        ru: Младенец сосет грудь – и приемлет от матери потребную для себя пищу, сколько нужно ему, столько и всасывает в себя пищи из сосцов матерних.
        cn: 婴儿吸吮乳房——并从母亲那里领受自己所需的食物。他需要多少，就从母亲的乳头吸入多少食物。
    - type: paragraph
      text:
        ru: Младенец не умеет обратиться в другую сторону и где-нибудь в другом месте искать себе пищи, а не у матери своей.
        cn: 婴孩不能转向别处，在别的地方为自己寻找食物，而不向自己的母亲寻求。
    - type: paragraph
      text:
        ru: Так и мир от Тебя только, Творец, заимствует поддержание жизни, и никто не может дать ему пищу, кроме Тебя Единого.
        cn: 如此，世界唯独从你，造物主啊，汲取生命的维系；并且除了你这位独一者，无人能赐予它食粮。
  - type: heading2
    text:
      ru: Уроки жизни
      cn: 生命的课程
    children:
    - type: paragraph
      text:
        ru: Когда предстоишь Богу, представляй себе служащих земным властям. Из примера рабов и владык заключай о своем предстоянии.
        cn: 当你侍立在上帝面前时，设想那些服侍地上掌权者的人。从仆人与主人的例子中，思考你自己的侍立。
    - type: paragraph
      text:
        ru: Представь свою греховность и призывай в помощь Бога.
        cn: 正视你的罪性，并呼求神的帮助。
    - type: paragraph
      text:
        ru: Учись у святых и проси Божией благодати на совершение дела.
        cn: 向圣徒学习，并祈求上帝的恩典以成全此事。
    - type: paragraph
      text:
        ru: Не гордись Божией благодатью и не вдавайся в нечестие.
        cn: 不要因着神的恩典而骄傲，也不要陷入不敬虔。
    - type: paragraph
      text:
        ru: Успев в добром, не хвались паче человека; погрешив по незнанию, не падай духом, как человек; успехами не хвались и при прегрешении не отчаивайся.
        cn: 在善行上有所成就时，不要高过人地自夸；因无知而犯错时，不要如同世人般灰心丧志；不要夸耀自己的成就，也不要在犯下过犯时绝望。
    - type: paragraph
      text:
        ru: Деятельно ревнуй о добре и столько же имей ненависти к злу.
        cn: 殷勤地热心于善，同样地憎恨恶。
    - type: paragraph
      text:
        ru: Подавая совет, не произноси решительного приговора, ибо не знаешь тайн Божиих.
        cn: 给出建议时，不要做出决定性的判决，因为你不知道上帝的奥秘。
    - type: paragraph
      text:
        ru: Согласись лучше идти на меч, нежели отдаться гневу. Гнев лучше скрыть в сердце, нежели высказать.
        cn: 宁可选择面对刀剑，也不要屈服于愤怒。愤怒宁可藏在心里，也不要说出来。
    - type: paragraph
      text:
        ru: Не услаждайся пустословием и не сиди там, где идет страстный разговор. Не ищи себе удовольствия в смехе и приятности в шутках, чтобы не сделаться рассеянным.
        cn: 不要以空谈为乐，也不要坐在有情欲谈话的地方。不要在欢笑中寻求愉悦，也不要在玩笑中寻求乐趣，以免心神散乱。
    - type: paragraph
      text:
        ru: Не люби многолюдных собраний, потому что они производят в душе смущение.
        cn: 不要喜爱人多的聚会，因为它们会在灵魂中产生纷扰。
    - type: paragraph
      text:
        ru: Избегай пиров, чтобы не стать блудником и без женщин.
        cn: 避开宴席，以免沦为淫乱者，即便没有女性亦然。
    - type: paragraph
      text:
        ru: Воздерживайся от яств, чтобы не сделаться тебе страстным. Будь внимателен к обузданию плоти, чтобы не ввергла она в опасность всадника – ум.
        cn: 禁戒美食，免得你被情欲所胜。要留意勒住肉体，免得它将骑者——你的心智——置于险境。
    - type: paragraph
      text:
        ru: Владей чувствами, чтобы, подобно воинским орудиям, не приняли они в себя тлетворной ржавчины.
        cn: 掌控你的感官，以免它们如同兵器，沾染上败坏的锈蚀。
    - type: paragraph
      text:
        ru: Большую часть времени проводи в уединении, чтобы, когда будешь в обществе, узнать тебе пользу того и другого.
        cn: 大部分时间当独处，以便当你身处人群中时，能明白独处与群居两者的益处。
- type: heading1
  text:
    ru: Отделение восемнадцатое
    cn: 第十八部分
  children:
  - type: heading2
    text:
      ru: 'Не отчаивайся и не будь самоуверен, но в смиренной надежде вопи: «Господи, помилуй!»'
      cn: 不要绝望，也不要自恃，但要以谦卑的盼望呼求：「主啊，怜悯我！」
    children:
    - type: paragraph
      text:
        ru: 'Смотрите, никто не говори: «Много грешил я, нет мне прощения». Кто говорит это, тот не знает, что Бог есть Бог кающихся, что Он пришел на землю не праведных спасать, а грешников призвать к покаянию и что, когда кто кается, радость бывает о нем на небесах.'
        cn: 你们看，谁也不要说：「我罪孽深重，我没有赦免。」谁这样说，他就不知道上帝是悔改者的上帝，不知道他来到地上不是拯救义人，而是召罪人悔改，并且，当有人悔改时，天上就为他欢喜。
    - type: paragraph
      text:
        ru: 'Истинное покаяние состоит в том, чтоб удалиться от греха и возненавидеть оный. И вот когда кто скажет от сердца: «Неправду возненавидех и омерзих», тогда Бог с радостью приемлет такого.'
        cn: 真正的悔改在于远离罪恶并憎恨它。当有人发自内心地说：「我憎恶并厌弃虚谎」，那时，上帝就必欣然悦纳这样的人。
    - type: paragraph
      text:
        ru: 'Но смотрите никто да не дерзнет также сказать: «Я не согрешил». Кто говорит это, тот слеп, смежил очи, сам себя обманывает и не знает, как окрадывает его сатана и в словах, и в делах: то чрез слух, то чрез глаза, то чрез осязание, то чрез помыслы. Ибо кто похвалится, что у него невинно сердце и чисты все чувства?'
        cn: '然而，你们要当心，愿无人胆敢也这样说：『我没有犯罪。』

          凡是这样说的人，他就是瞎眼的，闭合了双眼，自欺，且不知道撒但如何无论在言语上还是在行为上窃取他：或藉着听觉，或藉着眼睛，或藉着触觉，或藉着意念。

          因为谁能夸口自己的心是纯洁的，且所有感官都是纯洁的呢？'
    - type: paragraph
      text:
        ru: Никто не безгрешен, никто не чист от скверны, никто из человеков не свободен от вины, кроме Того единого, Кто нас ради обнищал, богат сый. Безгрешен Он один, взявший грехи мира, желающий спастись всем человекам, не хотящий смерти грешника, Человеколюбивый, Многоблагоутробный, Милосердый, Душелюбивый.
        cn: 没有人是无罪的，没有人是洁净无玷污的，人类中没有人能免于罪责，除了那一位独一的，祂本是富足的，却为我们成了贫穷。唯有祂是独一无罪的，是那担当世人罪孽的，祂愿世人都能得救，不愿罪人死亡，祂是爱世人的，慈悲深切的，怜悯的，爱灵魂的。
    - type: paragraph
      text:
        ru: К Нему прибегнем и мы, потому что все грешные, прибегавшие к Нему, улучили спасение.
        cn: 我们也要投奔他，因为所有投奔他的罪人都已得着救恩。
  - type: heading2
    text:
      ru: Слова на Суде к сущимодеснуюи ошуюю
      cn: 审判日的话语：致右边和左边的人
    children:
    - type: paragraph
      text:
        ru: 'На Страшном Суде скажет Господь сущимодесную: «Приидите, сыны света Моего, приидите, благословенные наследники Царства Моего, приидите, ради Меня обнищавшие, алкавшие и жаждавшие, не возлюбившие мира, ни всего, что в мире. Приидите, ради Меня оставившие всю мирскую область[7]и радость, сродников и друзей, родителей и чад. Приидите, вселившиеся в пустынях, горах, вертепах и пропастях земных вместе со зверями, и веселитесь с Ангелами на небесах. Приидите, все милостивые и странноприимные, приидите, все шествовавшие узким и тесным путем. Приидите, благословении Отца Моего, наследуйте уготованное вам Царство от сложения мира!»'
        cn: '在最后审判时，主将对那些立于祂右边的人说：


          「来吧，我的光明之子们，来吧，我国度的蒙福继承者们，来吧，为我而贫穷、饥渴的，不爱世俗，亦不爱世俗一切所有的。来吧，为我而舍弃所有世俗[7]与欢愉、亲戚与朋友、父母与子女的。来吧，在旷野、山峦、洞穴和大地深渊中与野兽为伴的，并与众天使在诸天之上同享喜乐。来吧，所有慈悲与好客的，来吧，所有行走于窄路与困途的。来吧，我父所祝福的，承受那从创世之初就为你们预备的国度吧！」'
    - type: paragraph
      text:
        ru: 'А сущим ошуюю скажет: «Идите от Меня в огнь кромешный. Идите от Меня, немилосердые, братоненавистники, христоненавистники. Вы не миловали – и не будете помилованы, вы не слушали пречистых Моих Евангелий и блаженных Моих учеников – и Я не услышу плача вашего; вы роскошествовали на земле, наслаждались благами в жизни своей, и здесь вам нечего получать: прияли свое; там ежедневно Я взывал чрез Писания, а вы, слыша, насмехались над читающими – и теперь говорю вам: не вем вас. Идите от Меня, проклятые, в огнь вечный, уготованный диаволу и ангелам его».'
        cn: 祂将对那些在左边的说：「离开我吧，进入那外面的火。离开我吧，你们这些不怜悯的，憎恨弟兄的，憎恨基督的。你们没有施怜悯，也必不蒙怜悯；你们没有听从我至洁的福音和我蒙福的门徒们，我也必不听你们的哀哭；你们在地上享尽奢华，在生命中享乐，在这里你们无可得到：你们已经得了你们的份；在那里我每日藉着圣经呼唤，而你们，听见了，却嘲笑那些读经的人——而现在我对你们说：我不认识你们。离开我吧，你们这些受咒诅的，进入那永火，是为魔鬼和它的使者们所预备的。」
    - type: paragraph
      text:
        ru: И пойдут они в муку вечную, а праведники – в живот вечный.
        cn: 他们将进入永刑，而义人将进入永生。
  - type: heading2
    text:
      ru: Одно желание добра приношу, ради него помилуй и спаси!
      cn: 我献上一个向善的愿望，为此求你怜悯并拯救！
    children:
    - type: paragraph
      text:
        ru: Как Творец Ты знаешь, что сотворил. Как Судия знаешь, что осудил (по падении). Как Вочеловечившийся знаешь, что устроил во спасение.
        cn: 作为造物主，你知道你所造的。作为审判者，你知道你所定罪的（在堕落之后）。作为成了肉身者，你知道你为着救恩所成就的。
    - type: paragraph
      text:
        ru: Ты дал мне природу неоскверненную, но отец мой Адам покрыл ее великой нечистотой и сделал немощной. К нечистоте присоединил я услаждение суетой – и теперь невольно несу наказание. В самую природу мою внесено тление – и вот бедствую, как обуреваемый в море.
        cn: 祢赐予我纯洁无瑕的本性，然而我的祖先亚当使其蒙上了极大的不洁，并使其变得软弱无力。我在这不洁之外又增添了沉溺于虚妄之乐——于是如今，我情不自禁地承受着惩罚。腐朽已深入我的本性之中——于是，我饱受磨难，如同在海上遭遇风暴的人一般。
    - type: paragraph
      text:
        ru: Помилуй меня как Творец, будь сострадателен к моей немощи как Вочеловечившийся ради меня, не отринь по причине моих страстей, но рассей их, воззрев на стремление моего произволения. Не возгнушайся мною по причине нечистоты, но воззри на сокрушение и желание лучшего!
        cn: '作为造物主，求你怜悯我；

          对我的软弱，求你怜恤，因你为我降生成人；

          不要因我的情欲而弃绝我，但求你垂顾我意愿的努力，并驱散它们；

          不要因我的不洁而厌弃我，但求你垂顾我的痛悔以及对美好的向往！'
    - type: paragraph
      text:
        ru: Если отвращаешься от меня по причине скверных моих помыслов, то обрати взор на мой плач и на осуждение мною самим моего сластолюбия.
        cn: 如果你因我污秽的意念而对我转离，就请垂顾我的哀哭，并垂顾我对我自身享乐主义的定罪。
    - type: paragraph
      text:
        ru: Есть у меня произволение, но не могу сказать, что есть и силы. Даю, что есть. Если хочешь дать и то, чего недостает, даруй, воззрев на мое расположение.
        cn: 我有一番意愿，但我不能说我也有力量。我献上我现有的。倘若你愿意赐下我所缺乏的，求你垂顾我的心志而恩赐吧。
    - type: paragraph
      text:
        ru: Нищ я, окраденный змием; немощен я, связанный тлением; не имею сил, подавленный грехом. Утратил я дар Твой и потому не имею совершенного благоразумия. Утратил я общение с Тобой, потому не знаю, куда иду.
        cn: 我贫乏，被蛇窃取的；我软弱，被败坏所束缚的；我没有力量，被罪所压垮的。我失去了你的恩赐，因此我没有完全的明智。我失去了与你的相通，因此我不知道我将往何处去。
    - type: paragraph
      text:
        ru: Ничего нет у меня. Если имею что, то Ты же, умилосердившись, дал мне. Крайне нищ я, если же обогащусь, всё это будет Твое дарование. И теперь оно Твое, и прежде было Твоим.
        cn: 我一无所有。若我拥有什么，那也是祢出于怜悯赐予我的。我极其贫乏；若我富足，那一切也都将是祢的恩赐。它现在是祢的，从前也是祢的。
    - type: paragraph
      text:
        ru: 'Прошу только благодати: исповедую, что чрез Тебя спасусь, если только спасусь.'
        cn: 我只求恩典：我承认，我要藉着祢得救，倘若我果真能得救。
  - type: heading2
    text:
      ru: Враг хитер, а мы беспечны – будем внимать, как бы не потерять Царствия
      cn: 仇敌狡诈，我们却疏忽大意——当警醒留意，免得失去天国。
    children:
    - type: paragraph
      text:
        ru: Приидите, приложим старание, приидите, припадем к Богу, будем неотступно плакать и проливать пред Ним слезы, чтобы даровал нам душевное просвещение.
        cn: 来吧，让我们倾注心力；来吧，让我们俯伏于神；让我们不住地哭泣，并在祂面前流泪，好使祂赐予我们灵魂的光照。
    - type: paragraph
      text:
        ru: Уразумейте козни врага и сопротивника нашего, сего ненавистника всякого добра, который устрояет нам на пути поползновения и соблазны, пагубную любостяжательность, превозношение века сего, плотское удовольствие, а также чаяние долговременного продолжения настоящей жизни, боязнь подвигов, леность к молитве, сон во время псалмопения и телесный покой.
        cn: 要洞悉我们仇敌和对抗者的诡计，这憎恨一切美善者，他为我们在道路上设下绊跌和诱惑：毁灭性的贪婪，这世代的骄傲，肉体的享乐，以及期盼现世生命的长久延续，惧怕功苦，祈祷时的懈怠，咏唱诗篇时的沉睡，和身体的安逸。
    - type: paragraph
      text:
        ru: Сколько он старателен, столько мы нерадивы и беспечны, сколько он коварен, столько мы невнимательны, хотя знаем, что дни наши сокращены, что настало время и Господь Славы грядет в благолепии красоты Своей со страшными Силами Царства Своего воздать каждому по делам его.
        cn: 他越是殷勤，我们便越是懈怠和疏忽；他越是狡猾，我们便越是漫不经心。尽管我们知道我们的年日已然缩短，时间已然临到，荣耀之主将驾临，身披其荣美的辉煌，偕同其国度可畏的权能，按各人的行为施行报应。
    - type: paragraph
      text:
        ru: 'Боюсь, как бы на нас не исполнилось слово Господне: Придут с востока и запада и севера и моря и возлягут с Авраамом, Исааком и Иаковом в Царстве Небесном, мы же изгнаны будем вон (Мф. 8:11).'
        cn: 我担心，主的话语恐怕会应验在我们身上：将有人从东方、西方、北方和海而来，与亚伯拉罕、以撒和雅各一同在天国里坐席，我们却要被赶到外面去 (马太福音 8:11)。
    - type: paragraph
      text:
        ru: 'Умоляю Тебя, Христе, Свет истины, Рождение Благословенного Отца, Образ и Сияние ипостаси Его, Сидящийодеснуювеличествия Его, Хвала и Радость любящих Тя, Жизнь моя: спаси меня, грешного, во Царствии Твоем и не воздай мне по делам моим, но спаси меня по благодати Твоей и ущедри меня по благоутробию Твоему, ибо Ты благословен и препрославлен во веки!'
        cn: 我恳求你，基督，真理之光，蒙福之父所生，祂本体的形像与荣光，坐在祂威严的右边，爱你之人的赞美与喜乐，我的生命啊：拯救我这罪人，进入你的国度；不要按我的行为报应我，但要按你的恩典拯救我，并按你的慈悲恩待我，因为你蒙福且万世受极大的颂赞！
  - type: heading2
    text:
      ru: Не то я, чем должен быть, боюсь обличения на Суде. Дай покаяние и силу!
      cn: 我并非我所当是，我惧怕在审判中蒙受指责。求你赐予悔改和力量！
    children:
    - type: paragraph
      text:
        ru: Для чего вводит меня в заблуждения принятый мною образ, когда чужд я добродетелей и пред Богом, всё назирающим, делаю противное?
        cn: 为何我所领受的生命样式，竟将我引入歧途，而我却与美德无份，并在鉴察万事的上帝面前做着相反的事呢？
    - type: paragraph
      text:
        ru: Справедливо фарисеи терпели обличение от Христа Спасителя, Который наружность их называл лицемерной. И я всего больше бываю достоин такого же укора, но, обличаемый совестью, негодую, ибо истина горька желающим казаться, а не быть.
        cn: 法利赛人理所当然地承受了基督救主的责备，祂称他们的外表是假冒为善的。而我，更是全然配受同样的指责；但被良心责备时，我便感到痛心，因为对于那些只求徒有其表而非真实存在的人来说，真理是苦涩的。
    - type: paragraph
      text:
        ru: 'Истинно, если раскрыть мою наружность, то внутри окажутся черви, если снять повапленный[8]покров, то окружающие увидят, что лежит во гробе. Пусть, впрочем, и не сделается это явным здесь: всяко огнь искусит на Суде, каков я.'
        cn: 确实地，如果揭开我的外表，里面就会发现蛆虫；如果揭去这粉饰过的[8]遮盖，周围的人就会看到墓穴中躺着什么。然而，即便这事在此不显明，审判之火无论如何都将在审判中考验我究竟是怎样的。
    - type: paragraph
      text:
        ru: Увы мне, как тогда перенесу обличение в беззаконных моих делах и помыслах! Помилуй меня, Боже, по великой милости Твоей и по множеству щедрот Твоих очисти беззакония мои! Услыши меня по благости Твоей, Владыко, и не отринь прошения моего, как не отвергаешь прошения всех истинно кающихся!
        cn: 哀哉我！那时我将如何承受因我悖逆的言行和意念而来的谴责！神啊，求祢怜悯我，照祢丰盛的慈爱，并照祢丰沛的恩慈洁净我的悖逆！主啊，求祢照祢的良善俯听我，不要弃绝我的祈求，正如祢不拒绝所有真心悔改者的祈求一样！
    - type: paragraph
      text:
        ru: Правда, и покаяние мое нечисто, ибо один день каюсь, а два – преогорчеваю Тебя. Но ниспосли в сердце мое страх Твой и утверди душу мою на камне искреннего покаяния. Свет благодати Твоей да препобедит тьму, которая во мне.
        cn: 确实，我的悔改也不洁净，因为我悔改一天，却有两天又使你忧伤。但是，愿你将你的敬畏降在我心中，并使我的灵魂坚固在真诚悔改的磐石上。愿你恩典的光芒战胜我里面的黑暗。
    - type: paragraph
      text:
        ru: Снизойди на моление мое, Благой Господи, не по правде моей, потому что не имею ничего доброго, но по щедротам Твоим, по великой и несказанной благости Твоей. Воздвигни члены мои, сокрушенные грехом, просвети сердце мое, омраченное лукавым вожделением, спаси меня от навыка греховного, да не до конца низложит меня противник.
        cn: 俯允我的祈求，良善的主啊，不是按我的公义，因为我一无良善可言，乃是凭祢的丰盛恩慈，凭祢那伟大且不可言喻的良善。扶起我因罪被摧毁的肢体，光照我被邪情私欲所蒙蔽的心，拯救我脱离罪恶的习惯，免得仇敌将我彻底击垮。
  - type: heading2
    text:
      ru: Вся надежда на милость Божию
      cn: 一切希望都在于神的怜悯。
    children:
    - type: paragraph
      text:
        ru: 'Благодать Твоя даровала мне изречь Тебе, Господи: «Как единый Благой и Создатель всех нас, прости беззакония и грехи рабу Твоему, грешному и неблагодарному!»'
        cn: '你的恩典赐予我向你诉说，主啊：

          「作为独一的良善者和我们所有人的创造主，求你赦免你那有罪且忘恩负义的仆人的罪孽和罪过！」'
    - type: paragraph
      text:
        ru: Знаю, Господи, что превосхожу грехами всех человеков, но имею прибежищем всё превосходящую бездну щедрот Твоих. Уверен я, что приемлешь и милуешь Ты всех приходящих к благости Твоей, ибо любишь видеть покаяние и радуешься прилежанию подвизающихся рабов Твоих.
        cn: 我知道，主啊，我在罪恶上超越了所有世人，但我以你那超越一切的丰盛恩慈深渊为避难所。我确信你接纳并怜悯所有归向你良善的人，因为你喜爱看到悔改，并且你因你那些竭力奋斗的仆人的勤勉而欢喜。
    - type: paragraph
      text:
        ru: Мне, недостойному рабу Твоему, даруй слезы, чтобы с просвещенным умом, с любовью и верой умолять мне несравненную благость Твою и исцелиться от сокровенных язв своих. Покажи на мне, бедном, благоутробие Твое, избавь меня от заслуженных мною мучений, да будет проповедана благодать Твоя, как всегда и повсюду и на бесчисленном множестве нерадивых, так и на мне.
        cn: 我这不配的，你的仆人，求你赐予我眼泪，以便我能带着蒙光照的心智、爱与信，恳求你无可比拟的良善，并从我隐秘的创伤中得医治。求你在我这贫乏人身上彰显你的怜悯，救我脱离我所应得的苦楚，好使你的恩典得蒙宣扬，如同往昔和在各处，并如同在你那无数懈怠之人身上，也同样在我身上。
    - type: paragraph
      text:
        ru: Как наполнил Ты водоносы благословением Твоим, так наполни сердце мое благодатью Твоей и благостыней Твоей! Сердобольная мать, отвергаемая детищем своим, не презирает его, Господи, потому что препобеждает ее матернее сердоболие, – да не преодолеют и мои грехи Твоей благости!
        cn: 你怎样用你的祝福充满了水缸，就照样用你的恩典和你的良善充满我的心！主啊，一个慈悲为怀的母亲，即使被自己的孩子所拒绝，也不会轻视他，因为母亲的慈悲心怀胜过了她，但愿我的罪也不要胜过你的良善！
    - type: paragraph
      text:
        ru: Знаю я, что подвергнусь наказанию даже за праздное слово, за лукавые помыслы, за самое вожделение. Между тем, как скоро представляется мне удовольствие, тотчас и вдруг всё забываю я и, как безумный, раболепствую во всем греху. Тщеславный, гневливый, расслабленный, ленивый, рассеянный, чревоугодник, сластолюбец, покрытый нечистотами, ежечасно блуждаю и не разумею того.
        cn: 我知道，我将遭受惩罚，甚至为一句闲话，为邪恶的意念，为那私欲本身。然而，一旦有享乐呈现在我面前，我便立即、突然地忘却一切，并如痴人般，在一切事上沦为罪的奴仆。虚荣的，易怒的，懈怠的，懒惰的，心猿意马的，贪食的，好色的，满身污秽的，我每时每刻都在迷失，却不明白这一点。
    - type: paragraph
      text:
        ru: Только одно чаяние явления благодати Твоей, человеколюбивый Владыко, утешает меня и удерживает от отчаяния – хочешь или не хочешь, спаси меня, Преблагой Господи, по великой благости Твоей!
        cn: 唯独对祢恩典显现的盼望，仁爱的主宰啊，安慰我，并使我免于绝望——祢愿与不愿，至善的主啊，凭着祢极大的良善，拯救我！
  - type: heading2
    text:
      ru: Там уже нет помилования – здесь вопи
      cn: 在那里已无怜悯——在这里哭求
    children:
    - type: paragraph
      text:
        ru: 'Как бы пред страшным Твоим Престолом предстоя, Господи, вижу я, осужденный, и обличение дел моих, и Твой о мне приговор, который меня, бедного, удаляя от святого лица Твоего, ввергает в невыносимые мучения. И как тогда буду взывать к Тебе, так и теперь с трепетом и со слезами вопию: «Праведен Ты, Судия Праведнейший, и праведен Суд Твой, и мне не учинено (таким судом) никакой неправды!»'
        cn: 仿佛站立在祢可畏的宝座前，主啊，我，这被判罪之人，看见我诸行被揭露，以及祢对我这可怜之人的判决，这判决使我远离祢圣洁的圣容，并投入不可忍受的苦楚之中。正如那时我将向祢呼求，如今我亦带着颤栗与泪水哀号：「祢是公义的，至公义的审判者，祢的审判也是公义的，我也未曾受到任何不公！」
    - type: paragraph
      text:
        ru: 'Как будто там стоя, обращаюсь я к Ангелам: «Добрые и светлейшие Ангелы, источите о мне слезы, потому что не помиловал я сам себя, презрев Божию милость, и наконец совершенно справедливо подвергаюсь наказанию. Господь предлагал мне милость, а я никогда не обращал на это должного внимания, безрассудный, и теперь по справедливой причине отвращается Он от меня!»'
        cn: '仿佛站在那里，我向天使们呼告：

          「善良而光明天使们，为我流泪，因为我没有怜悯自己，藐视了上帝的慈悲，最终完全公义地遭受刑罚。上主曾赐予我慈悲，而我从未正视，如此愚昧，如今，祂也理所当然地转离了我！」'
    - type: paragraph
      text:
        ru: 'С гневом скажут, конечно, тогда мне и Ангелы: «Теперь время не покаянию, а воздаянию. Моление не имеет уже силы, недействительны и слезы покаяния, преизбыточествуют одни слезы, проливаемые от мучений; не умиленные воздыхания слышны здесь, а непрестанные стоны и болезненные вопли. Иди же и приими горькое и тяжкое воздаяние за дела свои, горя в пламени, как нечистое вещество, и воспаляя неугасимую геенну. Насладись как сын тьмы, возлюбивший вечнующую тьму, увеселяйся, взирая на черные зраки, для которых возгнушался ты вечным светом».'
        cn: 怒气冲冲地，当然，那时连天使也会对我说：「现在已不是悔改的时候，而是报应的时候了。恳求已不再有力量，悔改的泪水也已无效；唯有从折磨中流下的泪水盈溢。在这里听不见感动的叹息，只有不绝的呻吟和痛苦的哀号。去吧，接受你行为的苦涩而沉重的报应，在火焰中燃烧，如同不洁的物质，并燃起永不熄灭的火刑地。作为黑暗之子，你曾爱慕永恒的黑暗，现在尽情享受吧！欢喜吧，凝视着那些漆黑的形影，为了它们，你曾厌弃永恒的光明。」
    - type: paragraph
      text:
        ru: Там, там будет непрекращающийся плач и болезненный скрежет зубов! Увы, бедная душа моя, обнаженная от всех дел, как будешь взирать на Нелицемерного Судию, на предстоящих ангелов и архангелов и на земнородных, предстоящих в бесчисленном множестве?
        cn: 在那里，在那里将有不间断的哀哭和痛苦的切齿！哎呀，我贫困的灵魂啊，一无善功，你将如何瞻仰那无伪的审判者，以及肃立的众天使和众天使长，还有那以无数之众侍立的世人呢？
    - type: paragraph
      text:
        ru: Увы, возболезнуешь тогда, душа моя, но не будешь услышана. Всё изменится. Всё станет иным. Вечно будут веселиться праведники и вечно будут мучиться грешники. Не возвеселили они Бога всяческих – и сами чужды будут всякой радости вовеки.
        cn: 呜呼，那时，我的灵魂啊，你将悲伤，却不会被垂听。一切都将改变。一切都将变得不同。义人将永远地喜乐，而罪人将永远地受苦。他们未曾使万有之上帝喜乐，于是他们自己也将永永远远地与一切喜乐无缘。
    - type: paragraph
      text:
        ru: 'Возопием же, душа, к Богу, пока мы здесь: «Прежде даже до конца не погибли мы, спаси нас!»'
        cn: 趁我们尚在此，灵魂啊，向上帝呼求吧：「趁我们尚未彻底灭亡，拯救我们！」
  - type: heading2
    text:
      ru: Слышит или не слышит Бог молитвы – все во благо
      cn: 无论上帝听不听祷告，万事都为益处。
    children:
    - type: paragraph
      text:
        ru: Господь – Премудрый Раздаятель. Он смотрит на пользу просящего и как скоро видит, что просимое им вредно или, по крайней мере, бесполезно ему, не исполняет просимого и отказывает в мнимом благодеянии. Он выслушивает всякую молитву, и тот, чья молитва не исполняется, получает от Господа столь же спасительный дар, как и тот, чья молитва бывает исполнена.
        cn: 上主是至智的施予者。祂察看祈求者的益处，并一旦看到祂所求的有害，或，至少，对他无益，就不成全所求的，并拒绝这种虚假的恩惠。祂垂听一切祈祷，而凡祈祷未蒙成全者，从上主那里领受同样具救赎性的恩赐，正如凡祈祷蒙成全者所领受的。
    - type: paragraph
      text:
        ru: 'Приходят ли к Благому нуждающийся или должник – и первому дает, и последнему прощает. Посему оба от дверей Подателя отходят с дарами: нуждающийся получает избавление от нужды, а должник – оставление долга.'
        cn: 若有贫乏者或欠债者前来良善者面前——祂都赐予前者，并赦免后者。因此，二者都从赐予者的门前带着恩赐离去：贫乏者从贫乏中得蒙解脱，而欠债者则债务得蒙赦免。
    - type: paragraph
      text:
        ru: 'Всеми возможными способами Бог показывает, что Он – Милостивый Податель: дарит нас Своей любовью и являет нам милосердие Свое. А потому и не отвечает ни на одну неправильную молитву, исполнение которой принесло бы нам смерть и погибель.'
        cn: 上帝以一切可能的方式显明，祂是慈悲的施予者：祂以自己的爱赐予我们，并向我们显明祂的怜悯。因此，祂不应允任何不正确的祈祷，倘若其实现将会给我们带来死亡和灭亡。
    - type: paragraph
      text:
        ru: Однако ж и в этом случае, отказывая в просимом, не оставляет нас без весьма полезного дара в том самом, что устраняет от нас вредное, отверзает уже нам дверь щедрот Своих.
        cn: 然而，即便在此情形下，当祂拒绝所求之时，祂也并未不赐予我们极有益的恩赐；这恩赐即在于祂替我们消除有害之物，并已然向我们敞开了祂丰盛恩典之门。
    - type: paragraph
      text:
        ru: Посему будь уверен, что всякое прошение, которое не бывает исполнено, несомненно вредно, а то прошение, которое услышано, полезно. Раздаятель праведен и благ и не оставит твоих прошений неисполненными, потому что в благости Его нет злобы и в правде Его – зависти.
        cn: 因此，你当确信，凡未蒙应允的祈求，必然有害，而蒙垂听的祈求，则是有益的。施予者是公义且良善的，祂不会让你的祈求不蒙应允，因为在祂的良善中没有恶意，在祂的公义中也没有嫉妒。
- type: heading1
  text:
    ru: Отделение девятнадцатое
    cn: 第十九章
  children:
  - type: heading2
    text:
      ru: Творение, искупление, воскресение
      cn: 创造，救赎，复活
    children:
    - type: paragraph
      text:
        ru: 'Став при гробе, приник я в него взором и увидел там сотлевшую плоть, в могиле стала она отвратительной: нет и подобия привлекательного лица, видны рассыпавшиеся иссохшие и покрывшиеся тлением кости. Со скорбью и горестью отступил я от гроба, перенесся мыслью к тому времени, когда воскреснем по гласу трубы и прославим Тебя за уготованное Адамовым чадам воскресение, и сказал: «Хвала Тебе, Господи всяческих!»'
        cn: 站在墓旁，我俯身向里凝视，看见了腐朽的肉身，它在墓穴中已变得可憎：甚至没有了曾经那张迷人脸庞的模样，只显露出散落、枯干且被腐蚀覆盖的骨骸。我带着忧伤和痛苦从墓旁退开，思绪被带回到那时，当我们借着号角的响声而复活，并为了祢为亚当的子孙所预备的复活而将荣耀归于祢。我说道：「万有之上主啊，赞美祢！」
    - type: paragraph
      text:
        ru: 'Слыша сказанное в Евангелии о воскресении, возблагодарил я Бога и воскликнул: «Хвала преславному естеству владычества Твоего, которое вначале украсило и образом Своим почтило наше естество, в конце же времен ниспослало Сына Своего! И Он спас нас от погибели и паки приидет воскресить весь Адамов род – праведников вознесет на небо, а нечестивых ввергнет в геенну, – и воскликнут Ему: праведен суд Твой, Господи Царю! Хвала Тебе, Господи всяческих!»'
        cn: '听到福音中关于复活所言说的，我向上帝献上感谢，并呼喊道：

          「赞美祢主宰之至尊荣的本性，此本性起初妆点并以自己的形象尊荣了我们的本性，然而至末世，降下了自己的上帝之子！祂拯救我们脱离了败坏，并必再次降临，使亚当的全族复活——祂将义人提升至天堂，而将不敬虔者投入到欣嫩子谷——那时他们必向祂呼喊：祢的审判是公义的，上主君王！赞美祢，万有的上主！」'
  - type: heading2
    text:
      ru: Что воздам? Чашу спасения прииму
      cn: 我将何以为报？我将领受救恩之杯。
    children:
    - type: paragraph
      text:
        ru: Долготерпелив Господь и всех нас влечет в Царство Свое, но потребует от нас отчета за нерадение в это короткое время.
        cn: 上主恒久忍耐，并且牵引我们众人归入祂的国度，但祂会要求我们为在这短暂的年日里的懈怠而交账。
    - type: paragraph
      text:
        ru: 'Он скажет нам: «Для вас Я воплотился, для вас видимо ходил по земле, за вас биен был, за вас заушаем, за вас распят, вознесенный на Древе, за вас, земнородных, напоен отцом, чтобы вас сделать святыми и небесными, Царство Мое даровал вам, всех вас наименовал Своими братьями и ниспослал вам Духа Святого.'
        cn: 他将对我们说：「为了你们我道成肉身，为了你们显现于地上行走，为了你们被鞭打，为了你们被掌掴，为了你们被钉十字架，被高举于木上，为了你们这些尘世之人，被父亲所饮，为要使你们成为圣洁和属天的，我将我的国度赐予你们，称你们所有人为我的弟兄，并赐给你们圣灵。」
    - type: paragraph
      text:
        ru: Что мог бы Я сделать еще более всего этого и не сделал для того, чтобы спасти вас? Не хочу только делать принуждения произволению, чтобы спасение ваше не стало делом необходимости непроизвольной.
        cn: 我还能做什么，是比这一切更多，却未曾为拯救你们而做的呢？我只是不愿强迫自由意志，以免你们的救恩成为一件非自愿的必然之事。
    - type: paragraph
      text:
        ru: Скажите, грешники, смертные по естеству, что претерпели вы ради Меня, Владыки вашего, за вас пострадавшего?»
        cn: 你们这些罪人，按本性必死的人啊，请说：你们为了我——你们的主宰，那为你们受苦者——忍受了什么呢？
    - type: paragraph
      text:
        ru: 'Приидите же все вкупе поклонимся Ему, восплачемся пред создавшим нас Господом и скажем: «Что род грешных воздаст Тебе, Непостижимому, Благому и Милосердому Богу? Ты, всю вселенную просветивший благодатью, просвети и очи сердца нашего, чтобы возлюбить нам Тебя, Владыко, и с любовью исполнять всегда святую волю Твою!'
        cn: 来吧，我们都一同叩拜祂，在创造我们的上主面前哀哭，并说：「我们罪人一族能拿什么报答祢，那不可测度、良善且仁慈的上帝呢？祢，以恩典光照了整个宇宙，也光照并洁净我们的心，为使我们能爱祢，噢，主宰者，并带着爱心永远遵行祢的圣洁旨意！」
    - type: paragraph
      text:
        ru: Вот чаша страшной Твоей Крови, исполненная света и жизни. Даруй нам разумение и просвещение, чтобы с любовью и святыней веры приступили мы к ней и была она нам в оставление грехов, а не в осуждение!»
        cn: 看啊，这杯令人敬畏的祢的宝血，充满光明与生命。恩赐我们悟性和光照，使我们怀着爱与信仰的圣洁领受这杯，使它成为我们罪愆的赦免，而非定罪！
  - type: heading2
    text:
      ru: Вразумление себя мыслью о смерти и о том, что сопровождает ее
      cn: 借死亡之念与随之而来者警省自身
    children:
    - type: paragraph
      text:
        ru: Страшно пришествие смерти людям страстным, грешным и слабым, не старавшимся жить непорочно в этом суетном мире. Делатели и совершенные подвижники радуются в час разлучения. Имея у себя пред очами великий труд подвижничества своего, бдений, постов, поклонов, молитв, слез, вретищ, души их ликуют, что призываются они из тела своего войти в покой.
        cn: 死亡的降临对那些有情欲、有罪且软弱，没有努力在这虚妄世界中活出圣洁生命的人而言，是可畏的。修道者和完善的苦修者在魂体分离之时欢喜。因他们眼前有其苦修的伟大劳苦，即守夜、斋戒、叩拜、祷告、眼泪和麻衣，他们的灵魂雀跃，因他们蒙召脱离肉身，进入安息。
    - type: paragraph
      text:
        ru: Но разлучение с жизнью сей крайне опечаливает грешника, который видит у себя пред очами свое нерадение с горькими плодами его. Какое раскаяние обымет тогда сердце нерадевшего здесь о спасении своем!
        cn: 然而，与今生分离，却使罪人极其忧伤，他眼见自己的懈怠及其苦果。那时，那在此生疏于自己救赎的人，他的心将涌起何等的悔恨啊！
    - type: paragraph
      text:
        ru: Увы, душа моя, увы, для чего нерадишь ты о жизни своей? Внезапно будет призвание твое – что же будешь делать там, быв нерадива здесь? Что будешь делать пред Престолом Праведного Судии? Как это враг окрадывает тебя и ты не разумеешь сего? Как это враг похищает у тебя небесное богатство и ты, рассеянная, не знаешь того?
        cn: 唉，我的灵魂，唉，祢为何懈怠自己的生命？突然之间祢的召唤将至——祢在此地如此懈怠，那时祢将如何是好？在公义审判者的宝座前，祢将如何是好？仇敌竟如此窃取祢，祢却不明此理？仇敌竟如此掠夺祢天上的财富，而祢却心神涣散，竟浑然不知？
    - type: paragraph
      text:
        ru: Помилуй меня, долготерпеливый Сыне Божий и Безгрешный Христе! Даруй мне, Спаситель мой, помышление о будущей жизни, чтоб исполнял я волю Твою. Хотя в старости соделай меня содейственником благодати Твоей, чтобы хоть концом добрым завершить мне недобрую жизнь.
        cn: 求祢怜悯我，祢是恒忍的上帝之子，无罪的基督啊！我的救主啊，求祢赐予我对来世的思念，使我能遵行祢的旨意。纵然已至暮年，也使我成为祢恩典的协力者，好使我能以一个善终，来结束这不善的一生。
    - type: paragraph
      text:
        ru: Как я, нерадивый, предстану страшному Престолу? Как я, нетерпеливый и бесполезный, вступлю в сообщество принесших здесь плод праведности? По каким чертам меня признают, когда в небесных ложах святые и праведные узнают друг друга по делам своим?
        cn: 我这懈怠之人，将如何站立在可畏的宝座前？我这急躁又无用之人，将如何加入那些在此结出公义之果的社群？当圣者与义人在天上的居所凭着他们的作为彼此认出时，我将凭着何种特征被认出？
    - type: paragraph
      text:
        ru: Нет, нечего себе льстить! Праведные, целомудренные, смиренные будут ходить во свете неприступном, а грешные, беззаботно живущие в угоду себе, как я, – в вечном и неугасимом огне.
        cn: 不，不可自诩！义人、贞洁者、谦卑者，必将行在不可靠近的光中，而那些漫不经心、随己意而活的罪人——像我这样——则将在永恒且不灭的火中。
    - type: paragraph
      text:
        ru: Отрезвись же, душа моя, и молись со слезами! Возопи от всего сердца своего, чтобы кончина застигла тебя обратившейся и положившей доброе начало.
        cn: 我的灵魂啊，警醒吧，并带着泪水祷告！从你全心呼求吧，好叫当临终临到你时，发现你已悔改，并已立下善的开端。
    - type: paragraph
      text:
        ru: Молитвами Пречистой Владычицы нашей Богородицы и всех святых Твоих даруй нам сие, Господи, яко благословен еси во веки!
        cn: 借着我们至洁的圣母和祢的所有圣者的祷告，主啊，愿祢赐予我们此，因祢是直到永远蒙福的！
  - type: heading2
    text:
      ru: Жизнь течет
      cn: 生命流淌
    children:
    - type: paragraph
      text:
        ru: Дни текут и улетают, часы бегут и не останавливаются, в стремительном течении времени мир приближается к концу своему. Ни один день не дозволяет другому идти с ним вместе, ни один час не ждет другого, чтобы лететь заодно. Как воду невозможно удержать и остановить перстами, так не остается неподвижной и жизнь рожденного от жены.
        cn: 岁月流逝飞逝，时辰奔流不息，在时间湍急的洪流中，世界正趋近其末了。任何一日都不容许另一日与它同行，任何一时辰都不等待另一时辰一同飞逝。正如水流无法用指尖挽留或止住，照样，那由妇人所生者的生命也不会静止不动。
    - type: paragraph
      text:
        ru: Взвешена и измерена жизнь всякого вступающего в мир, нет ему ни средств, ни возможности переступить за назначенный предел.
        cn: 每一个进入世界之人的生命，都被称量和衡量；他既无手段，也无可能逾越那既定的界限。
    - type: paragraph
      text:
        ru: Бог определил меру жизни человека, и эту определенную меру дни делят на части. Каждый день, незаметно для тебя, берет свою часть из жизни твоей, и каждый час с своей частицей неудержимо бежит путем своим. Дни разоряют жизнь твою, часы подламывают здание ее, и ты спешишь к своему концу, потому что ты – пар.
        cn: 上帝规定了人的寿数，而这既定的寿数，时日将其分割成部分。每日，于你不知不觉间，从你的生命中取走其一部分；每一时辰，亦带着其微尘，势不可挡地奔赴其途。岁月拆毁你的生命，时辰摧垮其殿宇；而你正急促地奔向你的结局，因为你不过是气息。
    - type: paragraph
      text:
        ru: Дни и часы, как тати и хищники, окрадывают и расхищают тебя, нить жизни твоей постепенно отрывается и сокращается. Дни предают погребению жизнь твою, часы кладут ее во гроб, а вместе со днями и часами исчезает на земле и жизнь твоя.
        cn: 日子和时辰，像盗贼和强盗一样，偷窃并掠夺你，你生命的丝线渐渐地断裂和缩短。日子将你的生命交付安葬，时辰将它放入坟墓，而随着日子和时辰，你的生命也在地上消逝。
    - type: paragraph
      text:
        ru: Жизнь, которую живешь ты сегодня, уходит и улетает с концом этого же дня, потому что каждый день берет свою часть из твоей жизни и с ней уходит. Каждый день предает погребению свою часть, каждый час кладет во гроб свою долю, и в быстром полете времени они уходят, исчезают и обращаются в ничто.
        cn: 今日你所过的生命，随着这一天的结束而消逝飞逝，因为每一天都从你的生命中取走其一部分，并随之而去。每一天都将其一部分安葬，每一个时辰都将其一分放入坟墓，并在时光的疾速飞逝中，它们消逝、隐去并归于虚无。
    - type: paragraph
      text:
        ru: Как спешно текут дни, так быстро пролетает и жизнь – нет ей возможности остановиться и стать на одном месте. Если солнце станет в высоте и луна будет задержана в течении своем, то может остановиться и время, определенное для жизни твоей, – может перестать стремиться к концу.
        cn: 岁月何其匆忙流逝，生命也同样迅速飞逝——它无法停驻，无法立足于一处。倘若太阳高悬不落，月亮也被挽留于其运行中，那么，为你的生命所限定的时间才可能停滞——它才可能停止趋向终结。
  - type: heading2
    text:
      ru: Бог все Сам даст, но и молиться надо
    children:
    - type: paragraph
      text:
        ru: Бог Милосердый дает просимое нами не молитвы ради нашей, но питает нас по собственным Своим щедротам, потому что сотворил нас.
    - type: paragraph
      text:
        ru: Всепревышающее Величие не испрошенного нами даровало нам Сына Своего, Который ради нас явился в мир и, хотя не просили мы Его, принес Себя в жертву для нашего спасения.
    - type: paragraph
      text:
        ru: Ибо кто упросил Отца, чтобы Сына Своего предал Он на крестную смерть? Или кто умолил Сына, чтоб умер Он за грешников?
    - type: paragraph
      text:
        ru: Кому из праведников приходило на мысль просить Отца, чтоб предал Он Сына Своего за беззаконных?
    - type: paragraph
      text:
        ru: Подлинно неслыханное это дело, и на мысль никому не приходило оно.
    - type: paragraph
      text:
        ru: Отец предал Сына Своего на крестную смерть – и смертью Его грешники приобрели себе жизнь. А если отдал Он величайшее Свое сокровище, то просящим от такого Человеколюбца воспрепятствует ли что получить всё, в чем только имеют нужду?
    - type: paragraph
      text:
        ru: Итак, будем просить Его, потому что Он дает, будем объявлять пред Ним желания свои, потому что не отказывает Он, будем умолять Его, потому что желает Он всеми способами удовлетворять нашим нуждам.
    - type: paragraph
      text:
        ru: Но по правде Своей ожидает Он, чтобы молитва наша предстала дверям Его и сей молитвой примирена была правда со всеми грешниками.
    - type: paragraph
      text:
        ru: Если бы благость без молитвы прощала преступления, то нарушилась бы правда и никто не помышлял бы о ней. Человечество более и более предавалось бы нечестию, потому что Судия не употребляет вразумляющего жезла. Каждый с радостью продолжал бы грешить, потому что никто не вразумляет его.
    - type: paragraph
      text:
        ru: Та же благость, столько для нас полезная, обратилась бы во вред, потому что давала бы повод грешникам более и более умножать число грехов своих.
    - type: paragraph
      text:
        ru: А теперь и то в мире, что правда побуждается к наказанию, есть дело благости, ибо грешник для того приводится в содрогание, чтобы перестал грешить и пришел в сердечное сокрушение, потому что сам на себя навлек наказание. И таким образом грешник хотя на малое время оставляет неправды свои и старается испросить себе оставление грехов.
    - type: paragraph
      text:
        ru: Кто же не возблагодарит Тебя, Господи наш, что и правда Твоя есть благость, и наказание Твое для нас благодать? Подлинно благ Ты во всем!
    - type: paragraph
      text:
        ru: Жезлом правды смиряешь Ты главу грешников, которые грешат с бесстыдным высокомерием и не обращаются без особенного побуждения.
    - type: paragraph
      text:
        ru: Наказание Твое, Господи, соединенное с милосердием, да будет нашим пестуном! Десница Твоя да поможет нам воспользоваться наказанием Твоим!
  - type: heading2
    text:
      ru: Все то же во мне, доколе же это? Обрати, ибо вот конец!
    children:
    - type: paragraph
      text:
        ru: Вот отовсюду собираю я помыслы свои и не имею успеха, ибо во мне еще производители их – страсти. Еще не освободился я от действия на меня лукавых духов, которые будут задерживать меня на воздушном пути. Еще не познал я тяжести множества грехов моих. Погрузившие меня в грех приносят плоды во плоти моей.
    - type: paragraph
      text:
        ru: Долго ли мне, окаянному, упиваться без вина и нерадеть о своем, как будто оно чужое? Как лукавый раб против господина своего, так я злоухищряюсь против собственного спасения, как будто другой кто понесет происходящий от того вред, – не хочу быть бдительным, ежедневно преогорчевая Твое долготерпение. Пред глазами у меня зло мое. Ты же всё долготерпишь мне по великой Твоей благости.
    - type: paragraph
      text:
        ru: Даруй мне, Господи, врачевство обращения, чтоб исцелиться мне от всего, что есть во мне худого. Даруй мне вступить на поприще воздержания, даруй мне в сердечном сокрушении проходить все дни жизни моей, просвети омраченные очи ума моего, чтобы со тщанием поспешил я вступить на путь, ведущий в виноградник Твой!
    - type: paragraph
      text:
        ru: Время жизни моей оскудело, проведено быв в суете и в срамных помыслах. Время жизни моей достигло уже единонадесятого часа. Управь, Господи, ладью купли моей и даруй разумение маломощному купцу, чтоб окончить мне куплю свою, пока есть еще у меня время! Ибо настал час разлучения – он уже пред глазами у меня, – и я крайне убоялся, увидев нищету свою.
  - type: heading2
    text:
      ru: 'Нечего укрываться: Бог все видит. Лучше поспеши омыться, пока есть время'
    children:
    - type: paragraph
      text:
        ru: Я грешу и скрываюсь, чтобы ни один человек не видел меня, но Господь видит меня, когда делаю злое.
    - type: paragraph
      text:
        ru: Если видит меня человек, мне стыдно, но не стыжусь я Бога. Пощади и помилуй нас, Судия и Владыка судей! Если человек обращается, рано ли это или поздно, Ты приемлешь его.
    - type: paragraph
      text:
        ru: Что делать мне с грехами моими? Не знаю, не видит ум мой, чем мне омыть и очистить себя. Если бы вздумал я омыться водами, то малы для меня моря, реки недостаточны, чтобы очистить меня. Если омою себя Кровью и водой из ребр Сына Божия, то очищусь, и излиются на меня щедроты.
    - type: paragraph
      text:
        ru: Трепещи, грешник, грядущего Суда, со скорбью и слезами прибегни к покаянию! Пока приемлется еще молитва, молись здесь, чтобы быть тебе принятым там. Молись, пока не пришла и не увлекла душу твою смерть, – тогда напрасны всякая молитва и моление, тогда бесполезны и слезы.
  - type: heading2
    text:
      ru: К Богородице. Хоть нечист я, приими молитву, дай покаяться и на суде защити!
    children:
    - type: paragraph
      text:
        ru: Всепетая и Всеблагая Владычица, источник милосердия, бездна человеколюбия! Хотя нечист я и предан миру прелюбодейному и мятежному, нерадив и в мысли, и в делах, и в произволении, блудно иждиваю жизнь свою, но Ты, как чадолюбивая и сострадательная Матерь Божия, не погнушайся мною, грешным и блудным, предвари принять прошение, приносимое Тебе скверными моими устами, и Твоими благоприятными и всеблагими молитвами милостивым ко мне соделай Судию.
    - type: paragraph
      text:
        ru: Отверзи мне благосердие Щедролюбивого Сына Твоего, умоли презреть грехопадения мои, направь помысл мой к покаянию, покажи во мне искусного делателя заповедей Его, не попусти стать мне снедью растлителя душ диавола, но ходатайством Твоим обнови меня, состарившегося во множестве грехов, исправь обветшавшую жизнь мою, чтоб, имея Ходатаицей Тебя, Преблагую, небоязненно мог я предстать Судии и избежать страшного мучения. Ходатайством Твоим сделай меня наследником славы, умоляя Творца моего, да улучу оную!
  - type: heading2
    text:
      ru: Уроки жизни. Горе
    children:
    - type: paragraph
      text:
        ru: Горе тому, кто пребывает во грехах и не знает времени покаяния, ибо он там будет раскаиваться, без пользы оплакивая грехи свои вовеки.
    - type: paragraph
      text:
        ru: 'Горе тому, кто говорит: «В настоящее время наслажусь плотью, а в старости покаюсь», ибо, подобно сети, внезапно накроет его смерть, и надежда его погибнет.'
    - type: paragraph
      text:
        ru: Горе тому, кто произвольно грешит в намерении утром покаяться, ибо не знает, что родит находящий день и предшествующая ему ночь.
    - type: paragraph
      text:
        ru: Горе тому, кто, зная доброе, дает руку лукавому, ибо в день исхода приимут его злые ангелы.
    - type: paragraph
      text:
        ru: Горе тому, кто лукавыми своими делами полагает претыкание ближнему, ибо в день Суда даст он отчет во всем, в чем только соблазнил других лукавыми своими обычаями.
    - type: paragraph
      text:
        ru: Горе тому, кто отрекся от мира и опять держится мирского образа мыслей, ибо к нему отнесется притча о взявшемся за рало и озирающемся вспять.
    - type: paragraph
      text:
        ru: Горе тому, кто следует желаниям плоти и пренебрегает попечением о душе своей, ибо жизнь его и надежды его рассыплются по земле.
    - type: paragraph
      text:
        ru: Горе тому, кто со всей крепостью своей не поспешает приготовиться здесь, как дать оправдание там.
- type: heading1
  text:
    ru: Отделение двадцатое
  children:
  - type: heading2
    text:
      ru: Благословен милостивый Творец и Искупитель!
    children:
    - type: paragraph
      text:
        ru: Благословен Благой и Милостивый, Который радуется о нас, если приносим покаяние, и без укора, с радостью приемлет нас по любви Своей.
    - type: paragraph
      text:
        ru: Благословен Благой, у Которого дверь отверста и добрым, чтобы входили в нее, Который и злым, если обращаются они, не заключает двери благости Своей.
    - type: paragraph
      text:
        ru: 'Благословен всем Дарующий средства наследовать Царство Небесное: праведникам – добрыми делами, а грешникам – покаянием.'
    - type: paragraph
      text:
        ru: Благословен за грешников Предавший Себя на смерть и поругание, Претерпевший позор, чтобы грешникам даровать жизнь.
    - type: paragraph
      text:
        ru: Благословен Сотворивший нас по милосердию Своему, снисшедший спасти нас Крестом и паки имеющий приити, чтобы воскресить нас в великий день Пришествия Своего.
    - type: paragraph
      text:
        ru: Сподоби и меня, Благой, по благости Твоей узреть щедроты Твои в день Суда и вместе с праведниками воспевать Тебе хвалу во веки веков!
  - type: heading2
    text:
      ru: Кто блаженные?
    children:
    - type: paragraph
      text:
        ru: Блаженны те, которые возлюбили Бога и из любви к Нему пренебрегают всем земным.
    - type: paragraph
      text:
        ru: Блаженны те, которые плачут день и ночь, ибо они избавятся от будущего гнева.
    - type: paragraph
      text:
        ru: Блаженны те, которые добровольно смиряют сами себя, ибо они будут возвышены.
    - type: paragraph
      text:
        ru: Блаженны воздержные, ибо их ожидают райские радости.
    - type: paragraph
      text:
        ru: Блаженны изнуряющие тело свое бдением и подвигами, ибо уготовано им райское веселие.
    - type: paragraph
      text:
        ru: Блаженны очистившие себя от лукавых помыслов, ибо в них обитает Дух Святой.
    - type: paragraph
      text:
        ru: Блаженны те, которые любят Бога от всей души паче всего мира, ибо они будут признаны друзьями Христовыми.
    - type: paragraph
      text:
        ru: Блаженны добровольно понесшие крест свой и деятельно последовавшие Христу, ибо они достигнут Горнего Иерусалима.
    - type: paragraph
      text:
        ru: Блаженны те, которые препоясали чресла свои истиной и светильники свои имеют готовыми, ожидая Небесного Жениха, ибо они с Ним будут царствовать в Небесном Царстве.
    - type: paragraph
      text:
        ru: Блажен, кто приобрел себе умные очи и неуклонно устремлял их в созерцание будущих благ, ибо он наследует их.
    - type: paragraph
      text:
        ru: Блажен, кто непрестанно имеет пред глазами день Суда и старается оказаться в оный благоугодным Богу.
    - type: paragraph
      text:
        ru: Блажен, кто сделался победителем плотских удовольствий, ибо в последний день испытания обретет он дерзновение.
    - type: paragraph
      text:
        ru: Блажен, кто плакал на земле для Бога, ибо плоды его возродятся на небе.
  - type: heading2
    text:
      ru: Смерть и надежды при ней
    children:
    - type: paragraph
      text:
        ru: 'Душа говорит: «В гостинице тела жила я, и прислал за мной Домовладыка, невозможно мне оставаться в ней долее, понуждает меня посланный: выходи из дома своего, оставь это жилище! Итак, оставайся с миром, плоть, временное жилище, да увижу тебя с радостью в день воскресения».'
    - type: paragraph
      text:
        ru: Поспешно пришли поемлющие меня, а я и не знал, посланный за мною предстоит уже, а я и не почувствовал. Избави меня, Господи наш, от того осуждения, какому подпал диавол, ненавистник непорочных сынов Твоих, и со святыми Твоими введи меня в Царство, да воспою хвалу и прославлю Тебя вместе с ними!
    - type: paragraph
      text:
        ru: 'Душа говорит телу: «Как горька для тебя чаша, растворенная смертью! Как страшно сие время и тяжел час испытания! Оставайся с миром, приятное жилище, в котором обитала я, пока угодно было сие Господу».'
    - type: paragraph
      text:
        ru: Какая скорбь наполнит сердце грешника в тот час, когда Судия Христос воссядет на страшном Престоле Своем, все поколения предстанут пред Ним и откроются все тайны сердечные! Страшен Суд, страшен Судия, страшен сей час!
    - type: paragraph
      text:
        ru: Блажен, кого покроет тогда благость Твоя, Господи!
    - type: paragraph
      text:
        ru: Тебя, Сыне Божий, приял я себе в напутие и когда алкал, то насыщался Тобою, Спасителем мира.
    - type: paragraph
      text:
        ru: Да бежит огнь от членов моих, да отженет его воня Плоти и Крови Твоей, крещение да будет для меня неутопающей ладьей!
    - type: paragraph
      text:
        ru: Тебя, Господи наш, да увижу там в день воскресения!
  - type: heading2
    text:
      ru: К кому прибегну? Имени ради Своего спаси!
    children:
    - type: paragraph
      text:
        ru: Увы мне, обремененному беспримерными грехами! Число прегрешений моих паче числа песка морского, и я изнемогаю от них, как от многих уз железных, потому что нет у меня дерзновения воззреть на высоту небесную.
    - type: paragraph
      text:
        ru: К кому же прибегну, кроме Тебя, Человеколюбче? Помилуй меня, Боже, по велицей милости Твоей и по множеству щедрот Твоих очисти беззаконие мое!
    - type: paragraph
      text:
        ru: К Тебе прибегаю по великой благости Твоей и по благоутробию Твоему!
    - type: paragraph
      text:
        ru: Тебя прогневал я, к Тебе и прибегаю по великому непамятозлобию Твоему.
    - type: paragraph
      text:
        ru: 'Тебя оскорбил я, к Тебе и прибегаю по великому человеколюбию Твоему и, умоляя, вопию: «Отврати лицо Твое от грех моих и вся беззакония моя очисти! Сердце чисто созижди во мне, Боже, и дух прав обнови в утробе моей!»'
    - type: paragraph
      text:
        ru: 'Ничего нет у меня, что бы мог я принести Тебе: ни дела доброго, ни сердца чистого, но, уповая на щедроты Твои, повергаю себя самого, чтобы привел Ты меня в сокрушение и постоянное делание заповедей Твоих и я не падал снова в грехи с такой легкостью, но отныне служил Тебе в преподобии и правде все дни жизни моей.'
  - type: heading2
    text:
      ru: К Богородице о заступлении в жизни, смерти и по смерти
    children:
    - type: paragraph
      text:
        ru: Дева Владычица, Матерь человеколюбивого Бога! Приведи в сокрушение сердце мое и смири его, наполни очи мои спасительными слезами и просвети их светом молитв Твоих, да не усну в смерть.
    - type: paragraph
      text:
        ru: Окропи и очисти меня иссопом милосердия Твоего, омой меня слезами моими, да паче снега убелюся.
    - type: paragraph
      text:
        ru: Ей, Матерь Господа моего Иисуса Христа, приими сие уничиженное мое исповедание и мольбу мою, плени ум мой и остаток жизни моей соблюди в покаянии без соблазна.
    - type: paragraph
      text:
        ru: Во время исхода смиренной души моей из тела, когда – увы мне! – при вратах будет у меня слово со врагами, тогда, Владычица, воззри на меня милостивым оком Твоим, освободи меня от немилосердных истязателей и страшных приставников князя века сего, будь моей Защитницей и уничтожь тогда все рукописания грехов моих. Непостыженным и спасенным приведи меня к Престолу Сына Твоего и Безначального Отца Его и Всесвятого Духа – Единой Светоначальной и Единосущной Троицы.
  - type: heading2
    text:
      ru: Сами святые удивятся славе своей
    children:
    - type: paragraph
      text:
        ru: 'Блажен человек, который обретет дерзновение в день Страшного Суда и услышит вместе с другими: «Приидите, благословенные Отца Моего, наследуйте уготованное вам Царствие от сложения мира!»'
    - type: paragraph
      text:
        ru: 'Тогда каждый, увидя себя во свете, станет рассматривать и размышлять, говоря: «Ужели это я? И каким же образом явился я здесь, недостойный?»'
    - type: paragraph
      text:
        ru: Приступят Ангелы с великой радостью и станут славить святых и восхвалять их житие, подвиги, воздержание, бдения, молитвы, произвольную нищету, совершенную нестяжательность, терпение в жажде, твердость в алчбе, постоянное пребывание в молитвах, радость в наготе ради совершенной о Христе любви – о всем этом с великой радостью скажут праведным Ангелы.
    - type: paragraph
      text:
        ru: 'А праведники скажут им в ответ: «Ни в один день на земле вовсе не оказывалось у нас ни одного доброго дела».'
    - type: paragraph
      text:
        ru: Ангелы снова напомнят им места и времена дел, а они опять, дивясь сами в себе, станут славить Бога, видя, что тела их на небе сияют паче света за то, что они терпели на земле небольшие произвольные лишения и скорби.
    - type: paragraph
      text:
        ru: Они нашли сокровище, скрытое на селе, и, продав всё, что было у них на земле, приобрели оное, нашли прекрасную жемчужину, и терпением укрыли ее у себя, и, сами того не замечая, уготовали себе нескверную и нетленную одежду.
    - type: paragraph
      text:
        ru: Невелик труд подвига, но велико отдохновение. Непродолжителен подвиг воздержания, но упокоение за оный в раю сладости продолжится во веки веков.
  - type: heading2
    text:
      ru: При виде смерти утешение воскресением
    children:
    - type: paragraph
      text:
        ru: Христос Воскреситель со славой явится с высоты, оживотворит мертвых, воздвигнет сущих во гробах. Чада перстного Адама все вкупе восстанут и воздадут хвалу Воскресителю мертвых.
    - type: paragraph
      text:
        ru: Да не печалятся сердца ваши, смертные. Приидет день Господень, пробудит и возвеселит нас, почивших, Хранители подвигнутся пред Господом, и Ангелы возвеселятся в день воскресения.
    - type: paragraph
      text:
        ru: 'Да не скорбит душа ваша, искупленные Крестом и призванные в Царство: приидет день Господень, даст глас к умершим, и мертвые восстанут и воздадут хвалу.'
    - type: paragraph
      text:
        ru: Воздадим славу и поклонимся Иисусу, Божию Слову, Который по любви Своей пришел и спас нас крестом Своим и паки приидет и воскресит чад Адамовых в велий день, когда воссияет величие Его!
    - type: paragraph
      text:
        ru: 'Не скорбите, смертные, об истлении своем: Царь Христос воссияет с высоты и всесильным мановением Своим воскресит мертвых из гробов и облечет их славой в Царстве Своем.'
    - type: paragraph
      text:
        ru: Если смерть воцарилась и погубила естество наше, потому что Адам согрешил и преступил заповедь, то не тем ли паче оправдаемся и спасемся страданиями Христа, победившего смерть и оправдавшего естество наше?
    - type: paragraph
      text:
        ru: Надежду и утешение даровал Господь наш скончавшимся, ибо Сам Он восстал из гроба, победил смерть, обетовал воскресение и жизнь, ущедрил великими благами Адама и всех чад его.
    - type: paragraph
      text:
        ru: Хвала и славословие Отцу, сотворившему нас, Сыну, спасшему нас Крестом Своим, и Духу Святому Утешителю – Всехвальной, Непостижимой Троице, воскрешающей умерших и облекающей славой тела их!
  - type: heading2
    text:
      ru: Хвала Воскресителю мертвых
    children:
    - type: paragraph
      text:
        ru: Все скончавшиеся восстанут по гласу трубы и воспоют хвалу Отцу и Сыну и Духу Святому, Воскресителю тел их.
    - type: paragraph
      text:
        ru: Отче, сотворивший Адама из праха, Сыне, крестом Своим избавивший чад Адамовых от погибели, воскреси меня и поставьодеснуюТебя, да славословлю имя Твое!
    - type: paragraph
      text:
        ru: 'Тебе поклонимся, Христе, Спасителю наш: Ты – Воскреситель и Спаситель всех скончавшихся, которые крестились во имя Твое, исповедовали крест Твой и смерть Твою.'
    - type: paragraph
      text:
        ru: Благословен Христос, Который чадам Адамовым обетовал жизнь и воскресение в день явления Своего! И мы восстанем и прославим Его среди святых, благоугодивших Ему.
    - type: paragraph
      text:
        ru: 'Хвала Тебе! Воскресением Твоим всему роду смертных даровал Ты надежду жизни и воскресения. Тебе возносим хвалу и мы: Ты – Воскреситель всякой плоти!'
    - type: paragraph
      text:
        ru: Славословьте и хвалите, смертные, Того, Кто Своей смертью упразднил державу смерти и всему роду смертных обетовал жизнь и воскресение!
    - type: paragraph
      text:
        ru: Душа, искавшая прибежища в кресте Твоем, наследница вечного непреходящего сокровища, да хвалит и славословит Тебя вместе с духами, к сонмам которых она причислена.
    - type: paragraph
      text:
        ru: Достопоклоняем Отец, пославший Единородного Сына Своего, Который спас род наш от смерти и сатаны, сидитодеснуюОтца Своего и всем испрашивает щедроты!
    - type: paragraph
      text:
        ru: Конец
