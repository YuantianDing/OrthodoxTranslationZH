title:
  ru: Луг духовный. Лимонарь или «Синайский патерик»
  cn: 属灵草场。利莫纳尔，或《西奈教父言行录》
authors:
- ru: блаженный Иоанн Мосх
  cn: 圣约翰·莫斯赫
languages:
- ru
- cn
document:
- type: heading1
  text:
    ru: Блаженный Иоанн МосхЛуг духовный. Лимонарь или «Синайский патерик»
    cn: '真福约翰·莫斯胡斯

      属灵草地。利莫纳里翁 或 《西奈教父言行录》'
  children:
  - type: paragraph
    text:
      ru: Аудио
      cn: 音频
  - type: paragraph
    text:
      ru: Приложение для мобильных устройств «Луг духовный»
      cn: 移动应用《属灵草地》
  - type: paragraph
    text:
      ru: Рассказ
      cn: 故事
  - type: paragraph
    text:
      ru: Продолжение «Иросанфион, или Новый Рай"
      cn: 续《伊罗桑锡翁，或新天堂》
  - type: paragraph
    text:
      ru: 'На пустынном берегу священного Иордана находилась обитель св. Илии. Сюда-то, прежде всего, пришел, влекомый духом подвижничества,Иоанн Мосх, и прожил здесь около десяти лет, пребывая иногда в полном уединении в близлежащей пещере. Это было в 568–79 годах. В царствование императора Тиверия II-го (гг. 578–582) Иоанну пришлось отправиться в Египет для служения. В Египте происходили страшные смуты, возбуждаемые монофизитской ересью. В то время патриархом Александрии был Евлогий, предшественник Иоанна Милостивого. Глубоко образованныйИоанн Мосхотправился в помощь для борьбы с ересью. В конце 6-го века мы находим блаженного Иоанна снова в Палестине, в обители преп. Феодосия. Здесь-то он и познакомился со своим знаменитым учеником Софронием, будущим патр. Иерусалимским. Общее стремление к духовному совершенству соединило наставника и ученика узами теснейшей дружбы. В обители они узнали о великих подвижниках и решили посетить и другие знаменитые обители Востока, чтобы побеседовать с опытными старцами. Все свои впечатления они записали для назидания грядущих веков. Их путешествие продолжалось десятки лет. Прежде всего, они обошли палестинские обители: преп. Герасима, «Башен», Каламонскую, св. Петра, обитель Евнухов, Евфимия Великого, монастыри в окрестностях Мертвого моря, обитель св. Саввы и другие. Поклонившись св. местам Иерусалима и Вифлеема, они остановились на время в Новой Лавре св. Саввы, при истоке Иордана из Галилейского озера. Из Северной Палестины путешественники отправились в Антиохию и Киликийские обители. Около 603 года они посетили Антиохию, Ливан, гору Росс, Селевкию, Эги, Тарс и Аназарв. В дальнейшем, после утомительного путешествия по аравийской пустыне, они достигли священной горы Синай. Проведя здесь некоторое время в подвигах молитвы и богомыслия, они обошли пустыни: Синайскую, Фаран, Раиф. Встречаясь с великими старцами, они собирали сведения о подвижниках отдаленных пустынь. Наконец, на берегу Суэцкого перешейка, они перешли в Египет и около 607 г. прибыли в Александрию. Посетив храмы и обители Александрии и ее окрестностей, путники решили посетить горные хребты Нильской долины, которые являлись колыбелью иночества. В этих каменистых скитах, после смерти основателя иночества св. Антония, начали селиться отшельники. Появились обители к востоку от Нила и до самого Красного моря и Синая, а к западу до страшных пустынь ливийских. Там-то и находилась славная Нитрийская пустыня. Обойдя почти все знаменитые палестинские и сирийские обители и Египет, они везде присматриваясь к подвижнической жизни и с любовью ее изучая. Свои впечатления и собранные сведения они заботливо записали в книгу, получившую название «Луг Духовный» (Лимонарь или «Синайский патерик»).'
      cn: 在圣约旦河的荒芜河岸，坐落着圣厄利亚修道院。首先，被苦修精神所吸引的约翰·莫斯赫来到了这里，居住了大约十年，有时在附近的洞穴中完全隐居。这发生在公元568-579年间。在提贝里乌斯二世皇帝（公元578-582年）在位期间，约翰不得不前往埃及服事。埃及当时正经历着由基督一性论异端所煽动的可怕动乱。那时亚历山大宗主教是欧洛吉乌斯，他是仁慈者约翰的前任。学识渊博的约翰·莫斯赫前往协助打击异端。在六世纪末，我们发现真福约翰再次身在巴勒斯坦，在圣提奥多西乌斯修道院。他就是在这里认识了他的著名弟子索夫罗尼乌斯，即未来的耶路撒冷宗主教。共同追求属灵的完美将师徒二人以最紧密的友谊纽带联系起来。在修道院里，他们了解了伟大的苦修者，并决定参访东方的其他著名修道院，以便与有经验的长老们交谈。他们将所有的见闻记录下来，旨在训导后世。他们的旅程持续了数十年。首先，他们走遍了巴勒斯坦的修道院：圣格拉西穆斯修道院、「塔楼」修道院、卡拉蒙修道院、圣彼得修道院、阉官修道院、圣尤西米乌斯大修道院、死海周边的修道院、圣萨瓦修道院等等。参拜了耶路撒冷和伯利恒的圣地后，他们暂住在圣萨瓦的新拉夫拉，这里位于约旦河从加利利湖流出的源头处。从巴勒斯坦北部，旅行者们前往安提阿和基利家地区的修道院。大约公元603年，他们参访了安提阿、黎巴嫩、罗斯山、塞琉西亚、埃吉、塔尔苏斯和阿那札尔布斯。随后，在穿越阿拉伯沙漠的疲惫旅程后，他们抵达了圣西奈山。在这里度过了一段在祷告和默想中的苦修时光后，他们走遍了这些沙漠：西奈、法兰、拉伊夫。在与伟大的长老们会面时，他们收集了关于偏远沙漠苦修者的信息。最后，在苏伊士地峡的岸边，他们进入了埃及，并于大约公元607年抵达亚历山大。参访了亚历山大及其周边地区的教堂和修道院后，旅行者们决定参访尼罗河谷的山脉，这里是修道生活的摇篮。在这些多岩石的隐修地，在修道生活的创始人圣安东尼去世后，隐修士们开始定居。修道院出现在尼罗河以东，直到红海和西奈，而在西部则延伸至可怕的利比亚沙漠。著名的尼特里亚沙漠就位于那里。他们走遍了几乎所有著名的巴勒斯坦和叙利亚修道院以及埃及，在各地观察苦修生活，并带着热爱进行研究。他们将自己的见闻和收集到的信息仔细地记录在一本书中，这本书名为《属灵的草地》（亦称《灵圃》或《西奈教父言行录》）。
  - type: heading2
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: Жизнь св. старца Иоанна, и о пещере «Сапсас».
      cn: 圣长老约安的生平，以及关于「萨普萨斯」山洞。
    children:
    - type: paragraph
      text:
        ru: 'Жил один старец, по имени Иоанн, в пустыне аввы Евсторгия. Архиепископ Иерусалимский св. Илия хотел его поставить игуменом монастыря, но старец отказался, говоря: «Я хочу отправиться на гору Синай для молитвы». Архиепископ настаивал, чтобы он сперва сделался игуменом, и потом уже отправился. Старец не согласился, и архиепископ отпустил его, взявши обещание, что он примет игуменство по своем возвращении. Простившись, таким образом, с архиепископом, старец отправился в путь, к горе Синай. Взял с собой и своего ученика. Но только что он перешел Иордан и прошел не более версты, как вдруг почувствовал озноб и жар. Дальнейшее путешествие стало невозможно. Путники нашли небольшую пещеру, и вошли в нее, чтобы успокоиться старцу. Болезнь настолько усилилась, что старец не мог уже двинуться, и в пещере пришлось пробыть три дня. Тогда старец во сне услышал голос кого-то, говорящему ему:'
        cn: 有一位名叫约翰的长老，住在阿爸欧斯托尔吉的旷野里。耶路撒冷大主教圣以利亚想任命他为修道院的院长，但长老拒绝了，说：「我想到西奈山去祷告。」大主教坚持要他先担任院长，然后再去。长老不同意，大主教便让他离开，取得了他的承诺，说他返回后会接受院长之职。于是，长老告别了大主教，踏上了前往西奈山的旅程。他也带上了自己的门徒。但他刚渡过约旦河，走了不到一俄里，突然感到发冷发热。无法继续前行了。旅人找到一个小洞穴，并进入其中，让长老安歇。病情恶化到如此地步，以至于长老已无法移动，他们不得不在洞穴里待了三天。那时，长老在梦中听到一个声音，对他说：
    - type: paragraph
      text:
        ru: – Скажи мне, старец, куда ты стремишься?
        cn: – 告诉我，长老，你往何处去？
    - type: paragraph
      text:
        ru: – Ha гору Синай, отвечает старец явившемуся.
        cn: ——去西奈山，长老回答了显现者。
    - type: paragraph
      text:
        ru: – Советую тебе не уходить отсюда, говорит незнакомец.
        cn: ——我建议你不要离开这里，陌生人说。
    - type: paragraph
      text:
        ru: Однако не удалось уговорить старца, и явившийся ему удалился. Между тем, горячка усилилась. В следующую ночь тот же самый, в прежнем виде, предстал старцу.
        cn: 然而未能说服长老，显现给他的人就离开了。与此同时，热病加剧了。第二天夜里，同样的那一位以从前的模样显现在长老面前。
    - type: paragraph
      text:
        ru: – Зачем ты, старец, желаешь страдать? Послушайся меня, и не уходи отсюда.
        cn: – 你这长老，为何你想要受苦？听我的话，不要离开这里。
    - type: paragraph
      text:
        ru: – Но кто же ты сам? – спросил старец.
        cn: — 但你究竟是谁呢？长老问道。
    - type: paragraph
      text:
        ru: '– Я – Иоанн Креститель, – отвечал явившийся, – и вот почему убеждаю тебя не уходить отсюда: эта малая пещера больше горы Синая. Сюда часто приходил посещать меня Господь наш Иисус Христос. Итак, дай мне слово остаться здесь, и я исцелю тебя.'
        cn: 「我是施洗者约翰，」出现的那位回答说，「这就是我劝说你不要离开这里的原因：这小小的洞穴比西奈山还要大。我们的主耶稣基督曾常常来这里看望我。所以，请你答应我留在这里，我就会医治你。」
    - type: paragraph
      text:
        ru: Услыхав это, старец с радостью обещал остаться в пещере. Немедленно получив исцеление, старец, действительно, пребыл в пещере до конца дней своих. Устроив из пещеры той храм, он собрал братию. Это место и называется Сапсас. Близ него, с левой стороны, протекает поток Хорив, на противоположной стороне – Иордан. Сюда был послан Илия Фесвитянин во время бездождия.
        cn: 听到这话，长老欣然答应留在洞穴里。随即获得医治，这位长老确实留居在洞穴里，直到他生命终结。他把那个洞穴建成了殿堂，并聚集了修士们。这个地方就叫做萨普萨斯。离它不远，左侧流淌着霍里夫小溪，对岸是约旦河。在旱灾期间，以利亚·提斯比派曾被差遣到这里。
  - type: heading2
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: О старце, питавшем львов в своей пещере.
      cn: 论一位在自己洞穴中喂养狮子的长老。
    children:
    - type: paragraph
      text:
        ru: В той же самой местности Сапсас жил другой старец, достигший столь великого духовного совершенства, что (без трепета) встречал львов, приходивших к нему в пещеру, и кормил их на своих коленах. Столь великой Божественной благодати исполнен был человек Божий!
        cn: 在那同一片萨普萨斯地区，住着另一位长老，他达到了如此崇高的灵性圆满，以至于（毫无畏惧地）接待那些来到他洞穴的狮子，并将它们抱在膝上喂养。这位属神之人，被如此伟大的神圣恩典所充满！
  - type: heading2
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: Жизнь Конона, пресвитера монастыря Пентуклы.
      cn: 彭图克利修道院长老柯农生平。
    children:
    - type: paragraph
      text:
        ru: 'Мы пришли в лавру св. отца нашего Саввы к Афанасию. Один старец рассказал нам: пришлось быть нам в монастыре Пентуклы. Там был старец Конон, киликиянин. Сперва, в качестве пресвитера, он служил при совершении таинства крещения, а потом ему, как великому старцу, поручили самому совершать крещение, и он стал помазывать и крестить приходивших к нему. Всякий раз как приходилось ему помазывать женщину, он приходил в смущение, и даже по этой причине вознамерился уйти из монастыря. Но тогда является ему св. Иоанн и говорит: «Будь тверд и терпи, и я избавлю тебя от этой брани». Однажды пришла к нему для крещения девица персианка. Она была так прекрасна собой, что пресвитер не решался помазать ее св. елеем. Она прожила два дня. Узнав об этом, архиепископ Петр был поражен этим случаем, и решил было уже для сего дела избрать диаконису, но не сделал этого, потому что не дозволял закон. Между тем пресвитер Конон, взяв свою мантию, удалился со словами: «Я не могу более здесь оставаться». Но едва взошел на холмы, как вдруг встречает его Иоанн Креститель и кротко говорит ему: «Возвратись в монастырь, и я избавлю тебя от брани». С гневом отвечает ему авва Конон: «Будь уверен – ни за что не вернусь. Ты не раз обещал мне это, и не исполнил своего обещания». Тогда св. Иоанн посадил его на один из холмов и, раскрыв его одежды, трижды осенил его крестным знамением. «Поверь мне, пресвитер Конон, – сказал Креститель, – я желал, чтобы ты получил награду за эту брань, но так как ты не захотел, я избавлю тебя от брани, но вместе с тем ты лишаешься и награды за подвиг». Возвратившись в киновию, где совершал крещение, пресвитер на утро, помазавши елеем, окрестил персиянку, даже совсем и не заметив того, что она была женщина. После того в течение 12 лет пресвитер совершал помазание и крещение, без всякого нечистого возбуждения плоти, даже не замечая, что пред ним женщина. И таким образом скончался.'
        cn: '我们来到我们圣父萨瓦的大修道院，拜访阿塔纳修斯。


          一位长老告诉我们：我们曾住在彭图克利修道院。那里有一位长老，科农，他是基利家（人）。起初，他以司祭的身份在举行洗礼圣事时服事。后来，作为一位伟大的长老，他被委任亲自举行洗礼，并开始为前来寻求他的人傅油和施洗。每当他需要为妇女傅油时，他就会陷入困扰，甚至因此打算离开修道院。但那时圣约安向他显现并说：「要坚定忍耐，我将使你摆脱这场属灵争战。」


          有一次，一位波斯少女前来寻求洗礼。她姿容如此美丽，以至于司祭不敢用圣油为她傅油。她住了两天。总主教彼得得知此事后，为此事所震惊，并曾打算为此选立一位女执事，但最终没有这样做，因为律法不许可。与此同时，司祭科农拿起他的长袍，离开了，并说道：「我不能再待在这里了。」但他刚走到山上，施洗者约安突然遇见他，温和地对他说：「回到修道院去，我将使你摆脱这场属灵争战。」


          长老科农愤怒地回答他：「请相信——我绝不会回去。你曾不止一次这样答应我，却未能履行你的承诺。」于是圣约安让他坐在一座小山上，解开他的衣服，三次在他身上画了十字圣号。「司祭科农，相信我，」施洗者说，「我原是希望你能因这场属灵争战而获得奖赏，但既然你却不愿如此，我将使你摆脱这场争战，然而与此同时，你也将失去为这场苦修争战所获得的奖赏。」


          回到举行洗礼的修道团体后，司祭在次日早晨傅油并施洗了那名波斯少女，甚至完全没有注意到她是一名女性。此后，司祭在长达12年的时间里进行傅油和施洗，没有任何不洁的肉体冲动，甚至不曾注意到站在他面前的是一位女性。他就这样离世了。'
  - type: heading2
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: Видение аввы Леонтия.
      cn: 圣师莱昂提乌斯的异象。
    children:
    - type: paragraph
      text:
        ru: 'Авва Леонтий, настоятель киновии св. отца нашего Феодосия, рассказал нам: после того как иноки из Новой лавры были изгнаны, я пришел в эту лавру и остался в ней. Однажды, в Воскресный день я пришел вцерковьдля приобщения Святых Таин. Войдя в храм, я увидел ангела, стоящего по правую сторону престола. Пораженный ужасом, я удалился в свою келью. И был глас ко мне: «С тех пор как освящен этот престол, мне заповедано неотлучно находиться при нем».'
        cn: 亚巴·莱昂蒂，我们圣父帖奥多西协同院的院长，告诉我们：在新大修道院的修士们被驱逐之后，我来到这座大修道院并住在里面。有一天，在主日，我来到教堂为领受圣奥秘。走进圣殿，我看见一位天使站在祭台的右边。惊恐万分，我退回到我的小室。有一个声音对我说：「自从这个祭台被祝圣以来，我奉命寸步不离地守候在它旁边。」
  - type: heading2
    initial:
      ru: '5.'
      cn: '5.'
    text:
      ru: Рассказ аввы Полихрония о трёх иноках.
      cn: 阿巴·波利赫罗尼关于三位修士的故事。
    children:
    - type: paragraph
      text:
        ru: 'Авва Полихроний, пресвитер Новой лавры, рассказал нам: в иорданской лавре «Башен» я заметил, что один из находившихся там братий был нерадив о себе самом и никогда не выполнял правила воскресного дня. Спустя немного времени вдруг вижу, что этот брат, столь нерадивый прежде, подвизается со всей ревностью и с большим усердием.'
        cn: 阿爸波利赫罗尼（新拉夫拉的司祭）告诉我们：在约旦的「塔楼」拉夫拉里，我注意到那里的一个弟兄对自己很疏忽，从不遵守主日的规矩。过了不久，我突然看到这个弟兄，以前是那么疏忽的，现在却怀着所有的热忱并带着极大的勤勉而修行。
    - type: paragraph
      text:
        ru: – Хорошо ты делаешь, брат, заботясь о своей душе, – говорю ему.
        cn: 「你做得很好，弟兄，你在关顾自己的灵魂，」 我对他说。
    - type: paragraph
      text:
        ru: – Авва, – отвечал он, мне, – скоро придется умереть.
        cn: – 阿爸，– 他对我答道，– 我很快就将要死去。
    - type: paragraph
      text:
        ru: 'И действительно чрез три дня он скончался. Тот же авва Полихроний рассказал мне: однажды я находился в лавре «Башен». Там скончался один брат. Эконом обратился ко мне со словами: «Брат, сделай милость, приди перенести со мною пожитки покойного в кладовую». Начали переносить – вижу: эконом плачет. «Что с тобою, авва? О чем ты так плачешь?» – спрашиваю его. «Сегодня, – отвечал он, – я переношу пожитки брата, а чрез два дня другие будут переносить мои». Так и случилось. На другой день эконом скончался, как и говорил.'
        cn: '果然，三天后他就去世了。


          这位阿巴·波利赫罗尼奥斯也告诉了我：有一次我在「塔楼」修道院。那里有一位弟兄去世了。财务主管对我说：「弟兄，劳驾，请来和我一起把亡者的遗物搬到储藏室。」我们开始搬运时，我看到财务主管在哭泣。我问他：「阿巴，你怎么了？你为什么哭得这么伤心？」他回答说：「今天我搬运这位弟兄的遗物，而两天后，别人就会搬运我的了。」果真如此。第二天，财务主管就去世了，正如他所说的。'
  - type: heading2
    initial:
      ru: '6.'
      cn: '6.'
    text:
      ru: О звезде, шедшей над умершим иноком.
      cn: 行过已故修士上空的星辰
    children:
    - type: paragraph
      text:
        ru: 'Пресвитер авва Полихроний рассказывал нам слышанное им от аввы Константина, игумена монастыря св. Марии Богородицы Нового: один из братий умер в больнице иерихонской. Мы взяли его тело и понесли в монастырь «Башен» для погребения. С того мгновения, как мы вышли из больницы, до самого монастыря, звезда шла над умершим и была видна до тех пор, пока мы не предали его земле.'
        cn: 长老阿爸波利赫罗尼给我们讲述了他从圣母玛利亚新修道院的院长阿爸康斯坦丁那里听来的事：一位修士死在耶利哥的医院里。我们抬着他的身体，把他送到「高塔」修道院安葬。从我们走出医院的那一刻起，直到修道院，一颗星辰一直走在亡者上方，并持续可见，直到我们把他安葬入土为止。
  - type: heading2
    initial:
      ru: '7.'
      cn: '7.'
    text:
      ru: О жизни и кончине старца, отказавшегося от настоятельства в монастыре «Башен».
      cn: 关于一位拒绝担任巴申修道院院长的长老的生平与安息。
    children:
    - type: paragraph
      text:
        ru: 'В том же монастыре «Башен» жил один старец. После кончины прежнего игумена настоятели и остальная братия обители желали его избрать игуменом, как великого и богоугодного мужа. Старец умолял их отказаться от этого: «Оставьте меня, отцы, оплакивать мои грехи. Я вовсе не таков, чтобы заботиться о душах других. Это дело великих отцов, подобных авве Антонию, Пахомию, св. Феодору и другим». Однако не проходило дня, чтобы братия не убеждали его принять игуменство. Старец продолжал отказываться. Наконец видя, что братия неотступно просят его, сказал всем: «Оставьте меня помолиться три дня, и что будет угодно Богу, то и совершу». Тогда была пятница, а в день воскресный рано утром старец скончался.'
        cn: 在那同一座「高塔」修道院里，住着一位长老。在前任院长安息后，众掌院和修院的其余弟兄们都希望推选他为院长，因他是一位伟大且蒙神喜悦的人。长老恳求他们放弃这个念头，说：「父亲们，请让我为自己的罪孽哀哭吧。我根本不适合去照管他人的灵魂。那是像安东尼长老、帕科米长老和圣帖奥多尔等伟大的教父们才做的事。」然而，没有一天弟兄们不劝说他接受院长之职。长老却持续拒绝。最终，他见弟兄们不依不饶地恳求他，便对众人说：「让我祈祷三天吧，凡是蒙神喜悦的，我便遵行。」那时是星期五，而在星期日清晨，长老便安息了。
  - type: heading2
    initial:
      ru: '8.'
      cn: '8.'
    text:
      ru: Жизнь аввы Мирогена.
      cn: 阿爸米罗革涅斯生平。
    children:
    - type: paragraph
      text:
        ru: 'В той же лавре «Башен» был один старец по имени Мироген, который от великой строгости жизни сделался болен водянкой. Его постоянно навещали старцы, чтобы походить за больным. «Молитесь лучше обо мне, отцы, – говорил больной, – чтобы внутренний человек мой не страдал водянкой. Я же молю Бога, чтобы Он продлил мою настоящую болезнь». Иерусалимский архиепископ Евстохий, услышав об авве Мирогене, пожелал прислать ему кое-что для телесных потребностей, но тот не принял ничего из присланного: «Помолись лучше за меня, отче, чтобы мне избавиться вечного мучения».'
        cn: 在同一个「塔楼」修道院里，有一位名叫米罗根的长老，他因严苛的生活而患上了水肿。长老们经常探望他，照料这位病人。「父亲们，你们最好为我祈祷，」病人说，「愿我的内在之人不患水肿。而我则祈求上帝，延长我目前的疾病。」耶路撒冷大主教欧斯多西听到关于阿巴·米罗根的事后，希望送他一些身体所需之物，但他没有接受任何送来的东西：「父亲，你最好为我祈祷，让我摆脱永恒的苦难。」
  - type: heading2
    initial:
      ru: '9.'
      cn: '9.'
    text:
      ru: О доброте одного св. отца.
      cn: 论一位圣洁的父亲的仁慈。
    children:
    - type: paragraph
      text:
        ru: 'В той же лавре «Башен» жил один старец, отличавшийся полной нестяжательностью. В то же время он очень любил подавать милостыню. Однажды пришел к нему в келлию один бедняк, прося милостыни. Старец ничего не имел, кроме хлеба, и, взяв его, подал нищему, но тот возразил: «Не нужно мне хлеба. Дай мне одежду». Желая услужить бедняку, старец, взяв его за руку, привел в свою келлию. Нищий не нашел в ней ничего, кроме того, что носил на себе сам старец. Глубоко тронутый святостью старца, нищий развязал свой мешок, вынул из него все, что имел, и положил посреди келлии, сказав: «Возьми это, добрый старец! A себе я найду, что мне нужно в другом месте».'
        cn: 在同一座「巴申」修道院里，住着一位长老，他以彻底的清贫著称。与此同时，他却非常乐善好施。有一天，一个穷人来到他的小室，请求施舍。长老除了面包一无所有，于是他拿起面包，递给了乞丐，但乞丐却回应说：「我不需要面包。给我一件衣服吧。」为了满足穷人的愿望，长老拉着他的手，把他带回自己的小室。穷人在里面什么也没找到，除了长老自己身上所穿的衣物。乞丐被长老的圣洁深深感动，他解开自己的袋子，拿出里面所有的东西，放在小室中央，说道：「收下这些吧，善良的长老！我会在别处找到我所需之物的。」
  - type: heading2
    initial:
      ru: '10.'
      cn: '10.'
    text:
      ru: Жизнь отшельника Варнавы.
      cn: 隐士瓦尔纳瓦生平。
    children:
    - type: paragraph
      text:
        ru: 'В пещерах св. Иордана жил один отшельник по имени Варнава. Однажды он отправился утолить жажду из Иордана. В ногу его вонзилась спица, и он оставил ее в ноге, не допуская, чтобы врач осмотрел его. Нога начала гноиться, и он принужден был отправиться в лавру «Башен» и взять себе келлию. Между тем нарыв в ноге увеличивался со дня на день, a старец говорил всем, навещавшим его: «Чем более страждет внешний человек, тем более возрастает в силе внутренний». Прошло несколько времени с той поры, как авва отшельник Варнава ушел из своей пещеры к «Башням». В оставленную пещеру пришел какой-то другой отшельник и, войдя внутрь, увидал ангела Божия, стоявшего пред престолом, который воздвиг и освятил старец.'
        cn: '在圣约旦的洞穴里，住着一位名叫瓦尔纳瓦的隐修士。有一次，他动身去约旦河解渴。一根尖刺扎进了他的腿，他就让它留在腿里，不允许医生检查他的伤势。他的腿开始化脓，他被迫前往「诸塔」修道院，并为自己取了一间小室。与此同时，他腿上的脓肿日渐增大，而这位长老告诉所有探望他的人：「外在的人越是受苦，内在的人就越发强大。」


          自从阿巴隐修士瓦尔纳瓦离开了他的洞穴，去了「诸塔」修道院以来，过去了一段时间。另一位隐修士来到了那被遗弃的洞穴，他进入洞内，看见一位上帝的使者，站在那长老所建造并祝圣的宝座前。'
    - type: paragraph
      text:
        ru: – Что ты здесь делаешь? – спросил отшельник ангела.
        cn: 「你在这里做什么？」隐修士问天使。
    - type: paragraph
      text:
        ru: – Я – ангел Господень, – отвечал он, – и этот престол вверен моему смотрению от Бога с той поры, как был освящен.
        cn: 「我——是上主的使者，」他回答说，「而且这个宝座自从被祝圣以来，就蒙上帝托付给我看顾。」
  - type: heading2
    initial:
      ru: '11.'
      cn: '11.'
    text:
      ru: Жизнь аввы Агиодула.
      cn: 阿巴·阿吉奥杜洛斯的生平
    children:
    - type: paragraph
      text:
        ru: 'Авва Петр, пресвитер монастыря святого отца нашего Саввы, рассказал нам об Агиодуле следующее: когда он был настоятелем лавры блаженного Герасима, один из тамошней братии умер, но старец не знал об этом. Канонарх ударил в било, чтобы собралась братия для выноса умершего. Пришел и старец и, увидав тело брата, лежавшее в церкви, опечалился, что не успел проститься с братом пред смертию. Подойдя к одру, он обратился к почившему со словами: «Встань, брат, и дай мне последнее целование». Умерший поднялся и поцеловал старца. «Теперь покойся, – сказал старец, – пока не придет Сын Божий и не воскресит тебя!»'
        cn: '阿爸彼得，我们圣父萨瓦修道院的长老，给我们讲了关于阿吉奥杜勒的以下故事：


          当他担任蒙福格拉西姆修道院的院长时，院里一位修士去世了，但这位长老并不知道。卡诺纳尔赫敲响了宣召木牌，以便修士们集合为亡者送葬。长老也来了，看到兄弟的遗体躺在教堂里，感到悲伤，因为他没能及时在兄弟临终前与他告别。他走到灵柩前，对逝者说：「起来，兄弟，给我一个最后的亲吻。」逝者站了起来，亲吻了长老。「现在安息吧，」长老说，「直到上帝之子到来并使你复活！」'
    - type: paragraph
      text:
        ru: Тот же авва Агиодул, проходя однажды близ берегов Иордана, размышлял о том, что произошло с теми камнями, взятыми по числу двенадцати колен, которые положил на дне реки Иисус Навин, вместо тех, которые раньше взяты были со дна реки? Вдруг воды разделились на обе стороны, и старец увидел те 12 камней. Повергшись на землю, он воздал хвалу Богу и удалился.
        cn: 那位阿爸阿吉奥杜尔有一次在约旦河畔行走时，思想着那些按照十二支派的数目取来、被约书亚放在河底的石头，代替先前从河底取出的石头，后来发生了什么事？突然，河水向两边分开，这位长老看到了那12块石头。他俯伏在地，向上帝献上赞美，然后离开了。
  - type: heading2
    initial:
      ru: '12.'
      cn: '12.'
    text:
      ru: Слово аввы Олимпия.
      cn: 阿爸奥林匹的话语。
    children:
    - type: paragraph
      text:
        ru: 'Брат просил авву Олимпия, пресвитера лавры аввы Герасима:'
        cn: 修士问阿巴奥林匹亚，阿巴革拉西姆拉夫拉的长老：
    - type: paragraph
      text:
        ru: – Скажи мне что-нибудь.
        cn: ——请告诉我一些事。
    - type: paragraph
      text:
        ru: '– He будь с еретиками, – отвечал тот, – и воздерживай язык и чрево. И где бы ты ни был, говори себе непрестанно: «я – пришлец».'
        cn: 那人回答说：「不要与异端为伍，并要克制你的言语和肚腹。无论你在何处，都要不住地对自己说：『我是一个寄居的。』」
  - type: heading2
    initial:
      ru: '13.'
      cn: '13.'
    text:
      ru: Жизнь отшельника аввы Марка.
      cn: 隐士阿爸马可的生平。
    children:
    - type: paragraph
      text:
        ru: 'Об авве, отшельнике Марке, жившем близ монастыря Пентуклы, рассказывали, что он в течение шестидесяти девяти лет вел такой образ жизни: постился по целым неделям, так что некоторые считали его бесплотным. Трудился день и ночь по заповеди Христа и все раздавал бедным, не принимая за то никакого воздаяния. Узнав об этом, некоторые христолюбивые люди пришли к нему, прося взять от них то, что принесли в знак своей любви к нему. «He возьму, – сказал старец, – потому что труды рук моих питают меня и тех, кто во имя Божие приходят ко мне».'
        cn: '关于阿爸、隐修士马尔克，他住在彭图克勒斯修道院附近，人们讲述说他六十九年之久过着这样的生活：整周整周地禁食，以至于有些人认为他没有肉身。他依照基督的诫命日夜劳作，并且把所有的一切分发给穷人，不为此接受任何回报。


          得知此事后，一些爱基督的人来到他这里，请求他收下他们带来的东西，作为他们爱他的标记。「我不会收的，」那位长者说，「因为我双手的劳作供养着我，以及那些奉上帝之名前来我这里的人。」'
  - type: heading2
    initial:
      ru: '14.'
      cn: '14.'
    text:
      ru: О брате, который был обуреваем помыслами блуда и впал в проказу.
      cn: 关于一位被淫乱意念所侵扰并罹患麻风病的弟兄。
    children:
    - type: paragraph
      text:
        ru: 'Аввa Полихроний рассказывал нам еще, что в монастыре Пентуклы был один брат, весьма внимательный к себе самому и строгий подвижник. Но он был обуреваем страстью блуда. He вынеся плотской брани, вышел из монастыря и отправился в Иерихон, чтобы удовлетворить свою страсть. Но лишь только вошел в жилище блудницы, как вдруг весь был поражен проказою. Увидав это, он немедленно возвратился в монастырь, благодаря Бога и говоря: «Бог послал мне эту болезнь, да спасет мою душу». И воздал великую хвалу Богу.'
        cn: Ав瓦·波利赫罗尼还告诉我们，在本图克拉斯修道院里，有一位修士，对自己非常警醒，并且是一位严厉的苦行者。但他被淫欲之情所侵扰。他无法忍受肉体的争战，便离开了修道院，前往耶利哥，为了满足他的情欲。但他刚一踏入娼妓的住所，突然全身长满了麻风病。看到这一切，他立刻回到了修道院，感谢上帝并说：「上帝把这疾病差遣给我，是为了拯救我的灵魂。」并且大大地赞美了上帝。
  - type: heading2
    initial:
      ru: '15.'
      cn: '15.'
    text:
      ru: Чудесное происшествие с аввою Кононом.
      cn: 阿爸科农的奇妙事件。
    children:
    - type: paragraph
      text:
        ru: Рассказывали нам об авве Кононе, игумене монастыря Пентуклы, что однажды на пути в святое место Битон встретились ему евреи и хотели его умертвить. Обнажив мечи, они бросились к старцу и, подбежав, подняли руки, чтобы нанести смертельный удар, но их руки вдруг как бы окаменели, сделавшись неподвижными. Старец совершил над ними молитву, и они удалились, радуясь и прославляя Бога.
        cn: 曾有人向我们讲述了阿爸科农，彭图克勒斯修道院的院长，说有一次，在他去往圣地比顿的路上，他遇到了犹太人，他们意欲置他于死地。他们拔出刀剑，冲向这位长老，跑上前举起手来，想要施以致命一击，但他们的手突然间仿佛石化了一般，变得动弹不得。这位长老为他们做了祷告，于是他们欢喜雀跃，赞美上帝而离去。
  - type: heading2
    initial:
      ru: '16.'
      cn: '16.'
    text:
      ru: Рассказ аввы Николая о себе самом и о своих спутниках.
      cn: 阿爸尼古拉关于他自己和他的同伴的记述。
    children:
    - type: paragraph
      text:
        ru: 'Один старец жил в лавре аввы Петра, что вблизи Иордана, по имени Николай. Он рассказал нам про себя следующее: однажды, во время моего пребывания в Раифе мы были посланы, в числе трех братий, на служение в Фиваиду. Проходя по пустыне, мы сбились с пути и начали блуждать. Вода у нас вся вышла. Целые дни мы не находили ни капли воды, и жажда нас сильно истомила. Наконец, мы не могли уже продолжать путешествия. Найдя в той же пустыне кустарники тамариска, мы легли, где кому пришлось найти тенистый уголок, и стали ожидать смерти от сильной жажды. Возлежа, я пришел в восторженное состояние и – вижу водоем, наполненный водою, и воду, изливающуюся чрез все края его, и кто-то двое стоят над краем водоема и черпают воду деревянным ковшом. И начал я просить одного: сделай милость, господин мой, дай мне немного воды, потому что я изнемогаю. Но он не хотел дать мне. Тогда другой говорит ему:'
        cn: 一位名叫尼古拉的长老，曾住在约旦河附近的阿爸彼得拉修道院里。他向我们讲述了他自己的经历：有一次，我在拉伊法居住期间，我们与另外两名弟兄被差派前往底比斯服侍。我们在穿越沙漠时迷了路，开始漫无目的地游荡。我们所有的水都用完了。整整几天我们都找不到一滴水，饥渴使我们筋疲力尽。最后，我们再也无法继续旅程了。我们在那片沙漠中找到了一些柽柳灌木，各自找到一个阴凉处躺下，开始等待因极度饥渴而来的死亡。当我躺着的时候，我进入了神魂超拔的状态——我看到一个水池，里面充满了水，水从池子的所有边缘溢出；有两个人站在水池边缘，用木勺舀水。我开始请求其中一人说：『请您发发慈悲，我的主人，给我一点水吧，因为我筋疲力尽了。』但他不愿给我。于是另一个人对他说：
    - type: paragraph
      text:
        ru: – Дай ему немного.
        cn: ——给他一点。
    - type: paragraph
      text:
        ru: – He дадим ему, – возражает первый. – Он очень ленив и нерадив о себе.
        cn: ——我们不给他，——第一个人反驳道。——他非常懒惰，对自己疏忽大意。
    - type: paragraph
      text:
        ru: – Что правда, то правда, – отвечает другой. – Точно, он нерадив, но все-таки дадим ему ради гостеприимства. И они дали мне воды.
        cn: – 是啊，确实如此，– 另一个答道。– 没错，他确实懈怠，但我们仍要因着款待的缘故给他。于是他们给了我水。
    - type: paragraph
      text:
        ru: – Дай же, – говорит, – и тем, которые были со мною.
        cn: 他说：「那么，也请给那些与我在一起的人。」
    - type: paragraph
      text:
        ru: Таким образом, все мы утолили жажду и прошли, не пивши, остальные три дня, пока, наконец, не достигли селения.
        cn: 这样，我们都解了渴，并且在剩下的三天里滴水未进地行路，直到我们最终抵达了村庄。
  - type: heading2
    initial:
      ru: '17.'
      cn: '17.'
    text:
      ru: Жизнь великого старца.
      cn: 伟大长老的生平。
    children:
    - type: paragraph
      text:
        ru: 'Вот что еще рассказал нам тот же старец об одном великом старце, жившем в том же монастыре: пятьдесят лет подвизался он в своей пещере: не пил вина, не ел хлеба, а только отруби, и три раза в неделю приобщался.'
        cn: 同一位长老又告诉了我们一件事，是关于一位伟大的长老的，他住在同一个修道院里：他在自己的洞穴里修行了五十年，不喝酒，不吃面包，而只吃麸皮，并且每周领圣餐三次。
  - type: heading2
    initial:
      ru: '18.'
      cn: '18.'
    text:
      ru: Жизнь другого старца, который спал со львами.
      cn: 另一个与狮子同睡的长老的生平。
    children:
    - type: paragraph
      text:
        ru: Авва Полихроний в другой раз рассказал нам еще об одном старце, жившем в монастыре аввы Петра, что он часто удалялся на берега св. Иордана и, оставаясь там, ложился спать в львином логовище. Однажды, найдя двух львят в пещере, он принес их в своем плаще вцерковь.
        cn: 阿爸波利赫罗尼奥斯另一次告诉了我们另一位长老的事，这位长老住在阿爸彼得的修道院里，他经常退隐到圣约旦河畔，并在那里停留，睡在狮穴中。有一次，他在洞穴中发现了两只幼狮，便用自己的披风把它们带到了教堂里。
    - type: paragraph
      text:
        ru: «Если бы мы соблюдали заповеди Господа нашего Иисуса Христа, – сказал он, – то звери боялись бы нас. Но за грехи наши мы стали рабами, и теперь скорее – мы боимся их». И братия, получив большую пользу, удалились в свои пещеры.
        cn: 「如果我们遵守我们主耶稣基督的诫命，」他说，「那么野兽就会惧怕我们。但因为我们的罪，我们成了奴仆，而现在反倒——是我们惧怕它们了。」弟兄们获得了极大的益处，便回到各自的洞穴里去了。
  - type: heading2
    initial:
      ru: '19.'
      cn: '19.'
    text:
      ru: Рассказ аввы Илии о себе самом.
      cn: 阿爸伊利亚的自述。
    children:
    - type: paragraph
      text:
        ru: Однажды я находился в пещере близ Иордана, рассказал нам о себе авва Илия воск, – чтобы не иметь общения с аввою Макарием, епископом Иерусалимским. В это время, приблизительно в шестой час дня (полдень), в сильнейший зной кто-то постучался ко мне в пещеру. Я вышел и увидел женщину.
        cn: 长老伊利亚·沃斯克向我们讲述了他自己的经历，说：「有一次我住在约旦河畔的一个洞穴里，为的是不与耶路撒冷主教马卡里奥斯长老交通。在这期间，大约在白天的第六个时辰（中午），正值最酷热的时候，有人敲响了我的洞穴。我出去，看到一个女人。」
    - type: paragraph
      text:
        ru: – Что тебе надо? – говорю ей.
        cn: 「你需要什么？」 我对她说。
    - type: paragraph
      text:
        ru: – Отец мой, и я провожу такую же жизнь, как и ты. Моя небольшая пещера не более как на расстоянии одного камня от тебя, – и она указала мне место несколько на юг.
        cn: ——我的灵父，我也过着与你同样的生活。我的小洞穴离你不过一块石头那么远——她指给我看那个稍微偏南的地方。
    - type: paragraph
      text:
        ru: – Проходя этой пустыней,   – продолжала она, – почувствовала жажду от сильного зноя. Сделай милость, дай мне немного воды.
        cn: 「她接着说：『当我经过这片荒漠时，因着酷热感到口渴。求你发发慈悲，给我一点水喝。』」
    - type: paragraph
      text:
        ru: 'Вынеся кружку, я подал ей. Она напилась, и я отпустил ее. После ее удаления, диавол воздвиг во мне плотскую брань и внушил нечистые помыслы. Изнемогши в борьбе и будучи не в силах погасить плотского разжжения, я, схватив посох, вышел из пещеры в такое время, когда от зноя самые камни раскалялись, и поспешил за женщиной, чтобы удовлетворить свою страсть. Я уже находился от нее на расстоянии не более одной стадии. Страсть пылала во мне. Вдруг я пришел в восторженное состояние и увидал, что земля разверзлась и поглотила меня. И вот я вижу: лежат мертвые тела, согнившие, разложившиеся и испускающие нестерпимое зловоние... Кто-то, сияя святостию, указал мне на тела и сказал: «Это вот тело женщины, а это – мужчины. Удовлетворяй, как хочешь и сколько хочешь, свою страсть... И ради такого-то удовольствия – смотри, сколько подвигов желаешь ты потерять! Вот из-за какого греха желаете вы лишить себя царствия небесного! О, бедное человечество! За один час (греховного удовольствия) вы готовы погубить подвиг целой жизни?!» Между тем от сильного зловония я упал на землю. Подойдя ко мне, явившийся мне святой муж поднял меня и укротил во мне брань. И я возвратился в свою келлию, принося благодарение Богу.'
        cn: '我拿出杯子递给她。她喝足了，我便让她离开了。


          她离开后，魔鬼在我里面激起肉体的争战，并注入不洁的念头。我在这场争战中筋疲力尽，无力熄灭肉体的欲火，便抓起手杖，走出洞穴。那时酷热难当，连石头都被烤得滚烫。我急忙追赶那女人，为要满足自己的情欲。我当时离她已不超过一斯塔迪昂的距离了。情欲在我心中熊熊燃烧。


          忽然我进入一种神魂超拔的状态，看见大地裂开，将我吞噬。于是我看见：躺着一些腐烂分解、发出难以忍受恶臭的死尸……有个人，全身散发着圣洁的光辉，指着那些尸体对我说：


          「这是女人的身体，那是男人的。尽情满足你的情欲吧，你想怎么做就怎么做，想满足多少就满足多少……就为了这般的欢愉——看哪，你为了它愿意失去多少苦修的功劳啊！看哪，就是为了这般的罪，你们竟愿意使自己失去天国！哦，可怜的人类啊！就为了一个小时（罪恶的欢愉），你们竟然愿意毁掉一生的苦修功劳吗？！」


          与此同时，由于那强烈的恶臭，我倒在了地上。向我显现的那位圣洁的男子来到我身边，将我扶起，并平息了我里面的争战。我便回到了自己的小室，向神献上感恩。'
  - type: heading2
    initial:
      ru: '20.'
      cn: '20.'
    text:
      ru: Обращение одного воина, вследствие оказанной ему чудесной помощи.
      cn: 一名战士的皈依，缘于他所蒙受的奇妙帮助。
    children:
    - type: paragraph
      text:
        ru: 'Один из отцов передал мне следующий рассказ воина, бывшего драконария: во время войны в Африке с мавританцами мы потерпели поражение от варваров и подверглись преследованию, во время которого многие из наших были убиты. Один из неприятелей настиг меня, – передавал он дальше, – и уже поднял копье, чтобы поразить меня. Увидав это, я начал призывать Бога: «Господи Боже, – взывал я, – явившийся рабе Твоей Фекле и избавивший ее от рук нечестивых, избавь и меня от настоящей напасти, и спаси меня от злой смерти. Я удалюсь в пустыню и проведу остаток моей жизни в уединении». И обернувшись, – говорил, – я уже не увидал никого из варваров. Немедленно удалился я в эту лавру Копраты. И вот по милости Божией прожил в этой пещере тридцать пять лет.'
        cn: 一位教父给我讲述了以下一位曾是「龙旗手」的士兵的故事：在非洲与毛里塔尼亚人作战时，我们被野蛮人击败，且遭到追击，在追击中，我们许多人被杀。一个敌人追上了我——他接着讲述道——并且已经举起长矛，要刺杀我。看到这情形，我开始呼求上帝：「主上帝啊！」——我呼求道——「您曾显现给您的婢女忒克拉，并将她从不敬虔之人的手中解救出来，也请将我从眼前的灾祸中解救出来，并拯救我脱离凶恶的死亡。我将退隐沙漠，并在隐修中度过余生。」我一转身——他说——就再也看不到任何野蛮人了。我立刻就隐入科普拉塔斯修道院。靠着上帝的恩典，我在这山洞里居住了三十五年。
  - type: heading2
    initial:
      ru: '21.'
      cn: '21.'
    text:
      ru: Смерть отшельника и его убийцы.
      cn: 隐士及其凶手的死亡。
    children:
    - type: paragraph
      text:
        ru: 'Авва Геронтий, настоятель монастыря св. отца нашего Евфимия, рассказал мне следующее: трое нас, восков, находились по ту сторону Мертвого моря, близ Висимунта. Мы шли по горе, а один – ниже по самому берегу моря. С ним повстречались сарацины, бродившие по тем местам. Они уже прошли мимо него, как вдруг один из них, вернувшись, отрубил голову отшельнику. Нам оставалось только издали смотреть на это, потому что мы были на горах. Мы еще плакали об отшельнике, как вдруг сверху спустилась птица на сарацина. Схватив, она подняла его вверх и затем бросила на землю, причем сарацин разбился на части.'
        cn: 阿爸格隆提，我们圣父优提米乌斯修道院院长，告诉我以下的事：我们三人，修道士，当时在死海的另一边，靠近维西蒙塔。我们在山上行走，而其中一人在下面的海边。有几个撒拉逊人，那些在那些地方游荡的，与他相遇。他们已经从他身边走过，突然，其中一人返回，砍下了隐士的头。我们只能远远地看着这一切，因为我们在山上。我们还在为这位隐士哭泣，突然，一只鸟从空中降下，落在那个撒拉逊人身上。它抓住他，把他举到空中，然后扔到地上，结果那个撒拉逊人粉身碎骨。
  - type: heading2
    initial:
      ru: '22.'
      cn: '22.'
    text:
      ru: Жизнь старца Конона, из обители св. Феодосия.
      cn: 长老科农的生平，出自圣狄奥多西修道院。
    children:
    - type: paragraph
      text:
        ru: 'В монастыре св. отца нашего Феодосия архимандрита жил один старец, по имени Конон, родом из Киликии. В течение тридцати пяти лет он соблюдал следующее правило: однажды в неделю вкушал хлеб с водою, непрестанно трудился и никогда не пропускал Божественной службы.'
        cn: 在我们的圣父大司祭忒奥多西的修道院里，住着一位名叫科农的长老，他来自奇里乞亚。在三十五年里，他遵守着以下规矩：每周只进食水和面包一次，不间断地劳作，并且从不缺席神圣礼拜。
  - type: heading2
    initial:
      ru: '23.'
      cn: '23.'
    text:
      ru: Жизнь инока Феодула.
      cn: 《修士提奥杜洛斯生平》
    children:
    - type: paragraph
      text:
        ru: В том же самом монастыре мы видели другого старца, Феодула, бывшего прежде воином. Постясь все дни, он никогда не спал на боку.
        cn: 在同一个修道院里，我们又看到另一位长老，费奥杜尔，他以前是一名战士。他每日禁食，从不侧卧入睡。
  - type: heading2
    initial:
      ru: '24.'
      cn: '24.'
    text:
      ru: Жизнь одного старца, обитавшего в кельях Хузива.
      cn: 一位住在胡齐瓦修道室的长老的生平。
    children:
    - type: paragraph
      text:
        ru: 'В кельях Хузива жил один старец. Старцы того места рассказывали нам о нем следующее: живя еще в своем селении, он поступал таким образом: если случалось ему видеть, что кто-либо из односельчан по бедности не мог засеять своего поля, он выходил ночью, так что этого не знал и сам хозяин поля, и, взяв свой скот и свои семена, засевал поле другого. Таким же состраданием отличался старец, когда удалился в пустыню и стал жить в кельях Хузива. Он выходил на дорогу, ведущую от священного Иордана ко святому граду, взяв с собою хлеба и воды. Замечал ли кого-либо утомившимся  – он брал его ношу и провожал до св. горы Елеонской. Возвращаясь обратно по той же дороге – нес тяжести других до Иерихона. Можно были видеть иногда то, как старец обливается потом под большой тяжестью, то – как несет на плечах одного, а иногда и двоих отроков. Иногда он сидел за чинкой износившейся мужской или женской обуви, для чего брал с собою необходимые орудия. Одних поил водою, которую носил при себе, других кормил хлебом. Встречал ли нагого – снимал с себя одежду и отдавал ему. Можно было видеть, как он трудился в течение целого дня. Случалось ли ему находить мертвого на дороге – он совершал над ним чин погребения и хоронил.'
        cn: 在呼齐瓦的隐修室里住着一位独修修士。那里的独修修士们向我们讲述了他以下的事迹：当他还在自己的村庄生活时，他会这样做：如果他碰巧看到某个同村人因为贫困无法播种自己的田地，他就会在夜间出门，甚至田地的主人自己都不知道，然后牵着自己的牲畜，带着自己的种子，为别人播种田地。当他退隐到旷野并在呼齐瓦的隐修室居住时，这位独修修士也以同样的怜悯心著称。他带着面包和水，走到从圣约旦河通往圣城的道路上。无论他看到谁疲惫不堪——他就会拿起他的重担，护送他到圣橄榄山。沿着同一条路返回时——他会把别人的重物背到耶利哥。有时可以看到，这位独修修士在重压下汗流浃背，有时则是肩上背着一个，甚至两个孩子。有时他会坐下来修补磨损的男鞋或女鞋，为此他带着必要的工具。他用他随身带的水给一些人解渴，用面包喂饱另一些人。无论他遇到赤身露体的人——他就会脱下自己的衣服，送给他。可以看到他整日劳作。无论他碰巧在路上发现死者——他都会为他举行安葬仪式并将其埋葬。
  - type: heading2
    initial:
      ru: '25.'
      cn: '25.'
    text:
      ru: Об одном из братии монастыря Хузива и о силе слов св. возношения.
      cn: 关于霍齐巴修道院的一位弟兄以及圣奉献言语的力量。
    children:
    - type: paragraph
      text:
        ru: 'Авва Григорий, из схолариев (один из императорских телохранителей), рассказал нам следующее: в монастыре Хузив был один брат, хорошо знавший чин св. возношения. Однажды он был послан за хлебами для литургии. На обратном пути в монастырь он совершал над ними молитвы возношения по чиноположению. А затем диаконы эти самые хлебы на дискосе возложили на св. престол. Св. возношение должен был совершать авва Иоанн, по прозванию Хозевит, бывший тогда пресвитером, а потом – епископом Кесарии палестинской. И вот он не замечает, чтобы Дух Святый освятил их, как замечал это прежде. Сильно опечалился старец при мысли, не оскорбил ли он каким-либо грехом Св. Духа, Который и отступил от него. Придя в диаконикон, он залился слезами и пал на лице свое. И явился ему ангел Господень, возвещая, что с той поры, как брат, принесший эти хлебы, на пути произнес над ними слова св. возношения, они уже освящены и вполне уготованы. И с того времени старец установил правило, чтобы никто из не рукоположенных не заучивал слов св. возношения, – тем более не произносил их, как случится, не разбирая времени и вне освященного места.'
        cn: '亚巴·格里高利，来自禁卫军（皇帝的贴身侍卫之一），向我们讲述了以下这件事：


          在胡齐夫修道院，有一位弟兄，他非常熟悉圣献祭礼仪。有一次，他被派去取圣餐用饼。在返回修道院的路上，他按照礼仪规定，对着这些饼念诵了献祭祷文。随后，执事们将这些饼放在圣盘上，并置于圣坛。圣献祭本应由亚巴·约翰主持，他当时是司祭，后来成为巴勒斯坦凯撒利亚的主教，人称「胡齐夫的」。然而，他却察觉不到圣灵像往常一样祝圣这些饼。这位长老为此深感悲伤，心想他是否因某种罪过冒犯了圣灵，以至于圣灵离开了祂。他来到祭衣室，泪流满面，俯伏在地。主的使者向他显现，宣告说：自从那位带来这些饼的弟兄在路上对着它们念诵了圣献祭祷文之时起，它们就已经被祝圣并完全预备好了。从那时起，这位长老便立下规矩，禁止任何未受圣职者背诵圣献祭祷文——更不许他们随意，不分时间，不在圣化之地内念诵这些祷文。'
  - type: heading2
    initial:
      ru: '26.'
      cn: '26.'
    text:
      ru: Жизнь брата Феофана и его дивное видение.
      cn: 修士提奥凡的生平和他那奇妙的异象。
    children:
    - type: paragraph
      text:
        ru: 'Старец, великий пред Богом, именем Кириак, жил в лавре Каламонской, около священного Иордана. Однажды пришел к нему брат чужестранец, из страны Дора, по имени Феофан, спросил старца о блудных помыслах. Старец начал наставлять его речами о целомудрии и чистоте. Брат, получив от этих наставлений великую пользу, воскликнул: «Отец мой, в моей стране я нахожусь в общении с несторианами. He будь этого – я бы остался навсегда с тобой»! Услыхав имя Нестория, старец глубоко опечалился о погибели брата и стал убеждать его и молить, чтобы он оставил эту пагубную ересь и присоединился ко святой кафолической и апостольской Церкви.'
        cn: 上帝面前伟大的长老，名叫基里亚克，住在神圣约旦河附近的卡拉蒙拉夫拉。有一次，一位名叫提奥芬的外地修士，来自多拉地区，来到他那里，向长老请教关于淫荡思想的问题。长老开始用关于贞洁与纯洁的话语教导他。这位修士从这些教导中获得了极大的益处，便喊道：「我的神父，在我的家乡，我与聂斯脱利派人士往来。若非如此——我就会永远与您在一起了！」听到聂斯脱利这个名字，长老为这位修士的沉沦深感悲痛，并开始劝说他、恳求他，让他放弃这毁灭性的异端，并归入神圣、大公并使徒的教会。
    - type: paragraph
      text:
        ru: – Невозможно спастись, если не будешь право мыслить и веровать, что Пресвятая Дева Мария есть истинная Богородица.
        cn: 若非持守正思，并相信至圣童贞玛利亚是真正的生神女，就不能得救。
    - type: paragraph
      text:
        ru: '– Отче, – возражал брат, – да ведь все ереси говорят точно так же: если не будешь в общении с нами, не получишь спасения. He знаю, несчастный, как мне и поступить. Помолись Господу, чтобы Он явно показал мне, какая вера истинная. Старец радостно выслушал слова брата.'
        cn: 「父啊，」弟兄反驳道，「可是所有异端也都这样说：如果你不与我们相通，就不能得到救恩。我这不幸之人，不知该如何行事。求主，让他清楚地向我显明，哪个信仰才是真信仰。」长老喜乐地听了弟兄的话。
    - type: paragraph
      text:
        ru: – Оставайся в моей келье, – сказал он. – Я имею упование на Бога, что Он по Своему милосердию откроет тебе истину.
        cn: 「留在我的小室里，」他说。「我有对上帝的信靠，相信祂会凭着祂的怜悯向你启示真理。」
    - type: paragraph
      text:
        ru: 'И оставив брата в своей пещере, старец отправился к Мертвому морю и стал молиться о брате. И точно, на другой день, около девятого часа, брат видит, что кто-то явился к нему, страшный по виду, и говорит: «Поди и познай истину»! И взяв его, ведет в место мрачное, смрадное и испускающее пламя и показывает ему в пламени Нестория и Феодора, Евтихия и Аполлинария, Евагрия и Дидима, Диоскора и Севера, Ария иОригенаи других. И говорит явившийся брату: «Вот это место уготовано еретикам, и тем, кто нечестиво учит о Пресвятой Богородице, равно как и тем, кто следуют их учению. Если тебе нравится это место, оставайся при своем учении. Если же не желаешь вкусить такого наказания, обратись к св. кафолической Церкви, к которой принадлежит и наставлявший тебя старец. Я говорю тебе: хотя бы и всеми добродетелями украсился человек, но если он неправо верует, он попадет в это место». При этих словах брат пришел в себя. Когда старец возвратился, брат рассказал ему все, что видел, и в скором времени присоединился к св. кафолической апостольской Церкви. Оставшись к Каламоне при старце, он прожил с ним несколько лет и скончался в мире.'
        cn: 留下他的修士弟兄在自己的洞穴里，长老前往死海，并为这修士弟兄祷告。果然，第二天，大约在第九个时辰，这修士弟兄看见有位形貌可怖者向他显现，并说：「来吧，认识真理！」便带他到一处幽暗、恶臭且喷出火焰的地方，并在火焰中向他指出涅斯多留、提奥多尔、优提克斯、阿波利纳里斯、伊瓦格里乌斯、迪迪姆斯、迪奥斯科罗斯、塞维鲁、亚流、奥利金以及其他人。显现者对修士弟兄说：「看哪，这个地方是为异端者预备的，也是为那些不虔敬地教导关于至圣上帝之母的人，以及那些追随他们教导的人预备的。如果你喜欢这个地方，就坚持你的教义吧。但如果你不愿尝受这样的惩罚，就归向圣公教会吧，你的那位指导长老也属于并教导这教会。我告诉你：即使一个人被所有的美德所装饰，但如果他信仰不正确，他就会来到这个地方。」听到这些话，修士弟兄清醒过来。当长老回来时，这修士弟兄把所看到的一切都告诉了他，很快便加入了圣公使徒教会。他留在卡拉蒙，与长老在一起，与他同住了几年，然后平安离世。
  - type: heading2
    initial:
      ru: '27.'
      cn: '27.'
    text:
      ru: Жизнь пресвитера селения «Мардард».
      cn: 马尔达尔德村司祭生平。
    children:
    - type: paragraph
      text:
        ru: 'В Киликии есть город Эги. На расстоянии 10000 шагов от него есть селение Мардард. В том селении – храм во имя св. Иоанна Крестителя. Священником при этом храме был старец, великий пред Богом и исполненный добродетели. Однажды жители селения пришли к епископу города Эгов с просьбой: «Возьми от нас этого старца – он тяжел для нас. В воскресный день он совершает литургию в девятом часу и не соблюдает установленного чина Божественной службы». Епископ, призвав старца, спросил его:'
        cn: 在基利家有一个城市名叫埃吉。距离该城一万步远的地方，有一个村庄名叫马尔达德。在那个村庄里，有一座以圣约翰·施洗者之名命名的教堂。这座教堂的神父是一位长老，他在上帝面前是伟大的，且满有美德。有一天，村里的居民们来到埃吉城的主教那里，带着一个请求：「请把这位长老从我们这里带走吧——他令我们难以忍受。在主日，他在第九时辰举行礼仪，并且不遵守神圣礼仪既定的规程。」主教便召来这位长老，询问他：
    - type: paragraph
      text:
        ru: – Зачем ты так поступаешь, старец? Или не знаешь устава св. Церкви?
        cn: ——你为何如此行事，长老？难道你不知道圣教会的规章吗？
    - type: paragraph
      text:
        ru: – Поистине, так, владыко, – отвечал старец, – и ты справедливо говоришь. Но я не знаю, что мне делать. В воскресные дни от самой полуночницы я нахожусь у св. престола и не начинаю литургии, пока не увижу Св. Духа, нисходящего на св. престол. Когда же увижу наитие Св. Духа, немедленно совершаю литургию. Епископ подивился добродетели старца. Вразумив жителей селения, он отпустил их с миром и хвалою Богу.
        cn: ——「确实如此，主教大人，」长老回答说，「您言之有理。但我不知道该怎么办。每逢主日，从半夜祷开始，我就守候在圣祭台旁，并且不开始举行圣礼，直到我看见圣灵降临在圣祭台上。当我一看到圣灵的降临，我就立刻举行圣礼。」主教惊叹于长老的德行。在开导了村民之后，他便平安地让他们离去，并赞美上帝。
  - type: heading2
    initial:
      ru: '28.'
      cn: '28.'
    text:
      ru: Чудо Иулиана столпника.
      cn: 尤利安柱圣的奇迹。
    children:
    - type: paragraph
      text:
        ru: Одному старцу авва столпник послал приветствие и вместе с тем вретище с положенными в нем тремя горящими углями. Старец, получив приветствие и еще не угасшие угли, отослал вретище обратно к авве Иулиану, налив в него воды и завязав. А расстояние между ними было около 20 миль.
        cn: 一位柱圣阿爸向一位长老送上问候，并附带一个装有三块燃烧着的炭火的麻袋。长老收到问候和尚未熄灭的炭火后，往麻袋里倒了水并系紧，然后将其送回给阿爸尤利安。他们之间的距离大约是二十英里。
    - type: paragraph
      text:
        ru: 'Авва Кирилл, ученик аввы Иулиана столпника, о котором мы только что упомянули, рассказал следующее: я, отец мой и брат пришли из нашей местности к авве Иулиану, наслышавшись много об его жизни. Я имел, – продолжал авва Кирилл, – неизлечимую болезнь: все врачебные средства оказались бессильны. Когда же я пришел к старцу, он, сотворив молитву, исцелил меня. Все трое мы остались при нем и отреклись от мира. Старец приставил моего отца к житнице. Однажды отец приходит к авве Иулиану и говорит: «У нас нет хлеба». Старец отвечает ему: «Ступай, брат, и собери, что найдешь, – смели, а на завтра Сам Бог попечется об нас». Отец, смутившись этими словами (он хорошо знал, что в житнице уже ничего не было), удалился в свою келлию. Настала крайняя нужда. Старец послал за отцом: «Приди немедленно сюда». Едва только он пришел, старец сказал: «Брат Конон, пойди и что найдешь, употреби на пользу братии». Отец, как бы в гневе, взял ключи от житницы: «Что ж, разве пыль принесу!» Отомкнув замок, он хотел было отворить двери, но не мог этого сделать: житница была доверху полна хлеба... Видя это, отец принес покаяние старцу, славя Бога.'
        cn: '我们刚刚提及的阿爸尤利安隐士柱修士的门徒阿爸基里尔讲述了以下事情：


          我、我的父亲和兄弟从我们那里来到阿爸尤利安那里，听闻了他许多关于他生活的事迹。阿爸基里尔继续说道：「我患有一种不治之症：所有的医疗手段都束手无策。当我来到长老那里时，他做了祈祷，便治愈了我。我们三人便留在他身边，并且弃绝了世俗。长老指派我的父亲负责粮仓。


          一天，父亲来到阿爸尤利安面前，说：「我们没有面包了。」长老回答他：「去吧，弟兄，把你找到的都收集起来——磨成粉，至于明天，上帝自会眷顾我们。」父亲被这些话困扰（他很清楚粮仓里已经什么都没有了），便回到自己的修士小室。


          极度的匮乏降临了。长老派人去叫父亲，说：「立刻到这里来。」他刚一来到，长老便说：「科农弟兄，去吧，把你找到的都用来供给弟兄们。」父亲，仿佛带着怒气，拿起了粮仓的钥匙，心想：「那好吧，难道我去拿些灰尘回来吗？！」解开锁后，他正想打开门，却无法做到：因为粮仓里满满当当地全是面包……看到这一切，父亲便向长老忏悔，赞美上帝。'
  - type: heading2
    initial:
      ru: '29.'
      cn: '29.'
    text:
      ru: Чудо св. Евхаристии.
      cn: 圣体圣事的奇迹
    children:
    - type: paragraph
      text:
        ru: На расстоянии 30 миль от киликийского города Эгов живут два столпника, в шести милях один от другого. Один из них принадлежал к св. кафолической и апостольской Церкви, а другой, больше пробывший на столпе близ селения Кассиодора, был последователем ереси Севера. Еретик возводил на православного разнообразные обвинения, стараясь о том, чтобы привлечь его к своей ереси. Распространяя о нем молву, он решил добиться его осуждения. Православный подвижник, как бы свыше озаренный, просил еретика прислать ему частицу причастия. Тот обрадовался, как будто уже совратил собрата в свою ересь, и немедленно послал ему просимое, ничего не подозревая. Православный, приняв частицу, присланную еретиком, т.е. последователем Севера, раскалил сосуд и положил в него частицу, и она немедленно исчезла в жару пылающего сосуда. Затем взяв частицу св. Причастия православной Церкви, он сделал то же самое, и мгновенно раскаленный сосуд охладился, и св. Причастие осталось целым и невредимым. Он благоговейно хранил его и показал нам, когда мы были у него.
        cn: 在距离基利家城埃戈夫30英里处，住着两位柱士，彼此相距六英里。他们其中一位属于神圣、大公而使徒所传的教会，而另一位，曾在卡西奥多拉村附近之柱上居住更久，是塞维鲁异端的追随者。这位异端者对正教徒提出各种指控，试图引诱他皈依自己的异端。他散布关于他的谣言，试图使他被定罪。这位正教苦修者，仿佛受了上天的启示，请求异端者送给他一块圣体碎片。异端者为此感到高兴，仿佛他已经把他的弟兄引诱到自己的异端里，于是毫不知情地立刻送去了所求之物。正教徒接受了异端者（即塞维鲁的追随者）送来的碎片后，烧红了一个器皿，将碎片放入其中，碎片立刻在炽热器皿的高温下消失了。然后，他取来一块正教教会的圣体碎片，也做了同样的事情。烧红的器皿瞬间冷却下来，圣体完好无损地保留了下来。他恭敬地保存着它，并在我们拜访他时展示给我们看。
  - type: heading2
    initial:
      ru: '30.'
      cn: '30.'
    text:
      ru: Жизнь инока Исидора, и чудо от св. Причастия.
      cn: 修道士伊西多尔的生平，以及圣餐所行的奇迹。
    children:
    - type: paragraph
      text:
        ru: На о. Кипре есть гавань Таде. Поблизости от нее находится монастырь, называемый Филоксенов («Страннолюбцев»). Прибыв туда, мы нашли там инока, родом из Милета, по имени Исидора. Мы видели, как он непрестанно плакал с воплями и рыданиями. Все убеждали его, чтобы он, хотя немного престал от плача, но он не соглашался.
        cn: 在塞浦路斯岛上，有一个塔代港口。离它不远处有一座修道院，名为菲洛克塞诺夫（意为「款待客旅者」）。抵达那里后，我们发现一位修士在那里，他来自米利都，名叫伊西多尔。我们看到他带着哭号和抽泣不停地哭泣。所有人都劝他哪怕稍稍止住哭泣，但他不肯。
    - type: paragraph
      text:
        ru: – Я – столь великий – великий грешник, – говорил инок всем, – какого не было еще от Адама до сего дня...
        cn: ——我是一个如此巨大的——如此巨大的罪人，——修士对所有人说，——从亚当至今，未曾有过这样的人……
    - type: paragraph
      text:
        ru: – Правда, отче, – возражали мы. – Мы все – грешники. Кто без греха, кроме одного Бога?
        cn: – 真的，神父，我们反驳道。 – 我们都是罪人。除了独一的上帝，谁能没有罪呢？
    - type: paragraph
      text:
        ru: – Поверьте мне, братия, – отвечал инок, – ни в Писании, ни в Предании, ни между людьми я не нашел грешника, подобного мне, и греха, который я совершил. Если вы полагаете, что я наговариваю сам на себя, выслушайте о моем грехе и помолитесь обо мне.
        cn: 「弟兄们，相信我，」修士回答道，「无论在《圣经》中，无论在《圣传》中，无论在世人中间，我都未曾找到像我这样的罪人，以及我所犯的罪。如果你们认为我是在自诬，那就请听我述说我的罪，并为我祷告。」
    - type: paragraph
      text:
        ru: – В миру я был женат, – продолжал инок. – Я и жена принадлежали к секте Севера. Придя однажды домой, я не застал дома жены и узнал, что она ушла к соседке, чтобы вместе причаститься. А соседка принадлежала к св. кафолической Церкви. Я бросился немедленно туда, чтобы остановить жену. Войдя в дом соседки, я узнал, что жена недавно приняла св. Причастие. Схвативши ее за горло, я заставил ее извергнуть святыню. Подхватив святыню, я бросал ее в разные стороны, и наконец, она упала в грязь. И мгновенно, пред моими очами, молния восхитила св. Причастие с того места... Прошло два дня, и вот я вижу эфиоплянина, одетого в рубище.
        cn: ——在世俗中，我曾结过婚，」修士继续说道。「我和妻子都属于北方的异端教派。有一次我回到家，没有见到妻子，才知道她去了邻居家，要一同领受圣餐。而那邻居则属于圣大公教会。我立刻冲到那里，想阻止妻子。走进邻居的家，我得知妻子刚刚领受了圣餐。我抓住她的喉咙，强迫她把圣物吐出来。我捡起那圣物，把它抛向各处，最终它掉进了泥里。顷刻之间，在我眼前，一道闪电从那地方将圣餐提走了……两天过去了，这时我看到一个身穿破烂衣衫的埃塞俄比亚人。」
    - type: paragraph
      text:
        ru: – Я и ты – мы оба осуждены на одинаковую кару, сказал он.
        cn: 「我和你，我们都被判处同样的刑罚，」他说。
    - type: paragraph
      text:
        ru: – Но кто ты? – спросил я.
        cn: ——但是你是谁？我问道。
    - type: paragraph
      text:
        ru: – Я тот, кто ударил Творца всех Господа нашего Иисуса Христа по ланите во время Его страданий, – отвечал мне явившийся эфиоплянин.
        cn: 「——我就是那个在祂受难之时，打了我们万有的创造主、主耶稣基督脸颊的人，——那显现的埃塞俄比亚人回答我。」
    - type: paragraph
      text:
        ru: – Вот почему, – закончил инок свой рассказ, – я не могу перестать плакать.
        cn: 「这就是为什么，」修士结束了他的讲述，「我无法停止哭泣。」
  - type: heading2
    initial:
      ru: '31.'
      cn: '31.'
    text:
      ru: Обращение и жизнь блудницы Марии.
      cn: 归正与妓女玛利亚的生平
    children:
    - type: paragraph
      text:
        ru: 'Два старца шли однажды из Эгов в Тарс киликийский и зашли, по усмотрению Божию, в гостиницу для отдохновения. Стоял сильный зной. В гостинице они нашли трех молодых людей, отправлявшихся в Эги, и с ними была блудница. Старцы сели поодаль. Один из них, вынув из своей сумки св. Евангелие, начал читать. Блудница, увидав это, оставила своих спутников и, подойдя, села близ старца. Но он, отстранив ее, сказал:'
        cn: 两位长老有一天从埃吉前往奇里乞亚的塔尔苏斯，并按照上帝的旨意，走进一家旅店休息。天气非常炎热。在旅店里，他们遇到三个正要前往埃吉的年轻人，并且他们当中有一位娼妓。长老们坐到稍远处。其中一位长老从他的袋子里取出圣福音书，开始阅读。娼妓看到此景，离开了她的同伴们，走过去，坐在那位长老身边。但是他，使她退开，说：
    - type: paragraph
      text:
        ru: – Несчастная, в тебе и стыда нет. Ты не задумалась подойти и сесть вблизи от нас!
        cn: 「你这不幸的女人，你连羞耻心都没有。你竟然没想到走近我们坐下！」
    - type: paragraph
      text:
        ru: – Отец, не отвергай меня, – отвечала блудница. – Хотя я и преисполнена всякими грехами, но Владыка всех Господь и Бог наш не отверг приступившей к Нему блудницы.
        cn: 「父亲，不要拒绝我，」淫妇回答说，「虽然我满身罪恶，但我们众人的主宰、我们的主和神，并没有拒绝那亲近祂的淫妇。」
    - type: paragraph
      text:
        ru: – Но ведь та блудница с той поры перестала быть блудницей, – возразил старец.
        cn: ——但是毕竟那个妓女从那时起就不再是妓女了，——长老反驳道。
    - type: paragraph
      text:
        ru: – Уповаю на Сына Бога живого, воскликнула женщина, что от нынешнего дня, и я отвергаю грех мой!..
        cn: ——我仰望永生神的儿子！——那女人惊呼道——从今日起，我也弃绝我的罪！
    - type: paragraph
      text:
        ru: И оставив молодых людей и свое имущество, она последовала за старцами. Они поместили ее в монастырь, близ Эгов, называемый Нанкиба. И я видел ее уже старицей, отличавшейся великим разумом. От нее самой я и слышал это.
        cn: 她撇下年轻人和自己的财物，跟随了那些长老们。他们把她安置在埃戈夫附近，一个名叫南基巴的修道院里。我见到她时，她已是一位女长老，以其卓越的智慧而著称。我就是从她本人那里听来此事的。
  - type: heading2
    initial:
      ru: '32.'
      cn: '32.'
    text:
      ru: Обращение комедианта и его двух наложниц.
      cn: 喜剧演员和他的两位妾的归信。
    children:
    - type: paragraph
      text:
        ru: 'В Тарсе киликийском был один комедиант, по имени Вавила. Он имел двух наложниц. Одну звали Комито, а другую – Никосой. Комедиант жил распутно и творил дела диавола, по его внушению. Однажды случилось ему войти вцерковь. По промыслу Божию, читалось тогда следующее место из Евангелия: покайтеся, приближибося царствие небесное. Пораженный этими словами, он пришел в ужас, вспомнив всю свою жизнь. И немедленно выйдя из храма, он позвал своих наложниц.'
        cn: 在基利家省的塔尔苏斯，有一个名叫瓦维拉的喜剧演员。他有两个妾，一个名叫科米托，另一个名叫尼科索。这位喜剧演员生活放荡，受魔鬼唆使，行魔鬼的作为。有一天，他恰巧走进教堂。按照上帝的安排，当时正在宣读福音书的以下经文：「你们要悔改，因为天国近了！」（马太福音 3:2）。他被这些话语所震撼，回想起他的一生，感到极度惊恐。于是他立刻走出圣殿，叫来了他的妾们。
    - type: paragraph
      text:
        ru: – Вы знаете, как распутно я жил с вами, – сказал он им, – и никогда не предпочитал одну другой. Теперь – все ваше, что я приобрел для вас. Возьмите и мое все имущество и поделите между собою. А я от нынешнего дня удаляюсь от вас, оставляю мир и иду в монахи.
        cn: 「你们知道，我与你们一起过着何等放荡的生活，从未偏爱过任何一人，」他对她们说，「现在，我为你们所得的一切都归你们。把我的全部财产也拿去，分给你们。而我从今日起，将离开你们，舍弃尘世，去当修士。」
    - type: paragraph
      text:
        ru: – Для греха и погибели души мы жили вместе с тобой, – воскликнули обе в один голос, залившись слезами, – а теперь, возжелав богоугодной жизни, ты бросаешь нас и хочешь спастись один!? Этого не будет – ты не оставишь нас! Мы желаем быть участницами с тобою и в добре!
        cn: 「我们与你一同生活，是为了罪和灵魂的灭亡，」她们两人异口同声地喊道，泪流满面，「而现在，你却渴望过蒙神喜悦的生活，你抛弃我们，并且想要独自得救！？这不会发生——你不会抛弃我们！我们也渴望与你一同在美善中有份！」
    - type: paragraph
      text:
        ru: Актер вскоре заключился в одной из стен городского укрепления, а женщины, продав свое имущество, деньги раздали бедным и, приняв иноческий образ, также затворились, устроив себе келью вблизи того же укрепления. Мне удалось видеться с иноком, бывшим комедиантом, и я получил большую пользу. Это – муж весьма сострадательный, милостивый и смиренномудрый. И я записал это для пользы читателей.
        cn: 演员不久便在城防工事的一面墙内隐修；而那些妇女，卖掉自己的财产，把钱分给了穷人，并领受了修道形像后，也隐修起来，在同一座工事附近为自己安排了一间隐修室。我得以见到那位隐修士，他曾是喜剧演员，我从中获益良多。他是一位极其有怜悯心、仁慈且谦卑智慧的人。我写下这些，是为了读者的益处。
  - type: heading2
    initial:
      ru: '33.'
      cn: '33.'
    text:
      ru: Жизнь епископа Феодота.
      cn: 费奥多特主教生平。
    children:
    - type: paragraph
      text:
        ru: 'Один из отцов поведал нам, что в Феополисе был архиепископ, по имени Феодот, отличавшийся добротой сердца. Когда наступал праздничный день, он приглашал некоторых из служившего с ним духовенства к своей трапезе, но один не оказал послушания и отказался от приглашения. Патриарх сохранил спокойствие духа и сам пошел к нему пригласить его – разделить с ним трапезу. Тот же самый и о том же архиепископе Феодоте рассказал нам еще следующее: он был очень кроток и смиренномудр. Например, однажды он был в дороге вместе с одним клириком. Архиепископ совершал путь в носилках, а клирик ехал на коне. И говорит патриарх клирику: «Поделим длину пути и будем меняться местами». Клирик не соглашался: «Это будет бесчестие для патриарха, сказал клирик, если я сяду в носилках, а святитель поедет на коне». Но чудный Феодот настоял на своем и, убедив клирика, что в этом не будет для него бесчестия, заставил поступить по своему желанию.'
        cn: '这位教父中的一位告诉我们，在泰奥波利斯有一位名叫泰奥多特的总主教，以其心地仁慈而著称。每逢节日到来之际，他会邀请一些与他一同供职的神职人员到他的餐桌赴宴，但其中一位不顺从，拒绝了他的邀请。总主教保持了平静的心境，并且亲自去邀请他——与他一同用餐。


          还是这位教父，关于这位名叫泰奥多特的总主教，又告诉我们以下的事情：他为人非常温和谦卑。例如，有一次，他在旅途中和一位教士同行。总主教坐着轿子赶路，而那位教士骑着马。总主教对教士说：「我们分段走这段路，然后交换位置吧。」教士不同意：「如果我坐轿子，而圣主教骑马，那对总主教来说将是一种羞辱。」教士说。但奇妙的泰奥多特坚持己见，并且说服教士，这样对他（总主教）来说不会是羞辱，最终使他按自己的意愿行事。'
  - type: heading2
    initial:
      ru: '34.'
      cn: '34.'
    text:
      ru: Жизнь чудного Александра, патриарха Антиохийского.
      cn: 奇妙的亚历山大，安提阿牧首的生平。
    children:
    - type: paragraph
      text:
        ru: 'В Феополисе был другой патриарх, по имени Александр. Он был также очень милостив и сострадателен. Однажды один из его писцов, похитив у него золото, бежал от страха в Фиваиду, в Египет... Блуждая там, он попал в руки египетским и фивским разбойникам, и эти кровожадные варвары увели его в самые дальние местности их страны. Узнав об этом, дивный Александр выкупил пленника за восемьдесят номисм. И когда беглец вернулся к нему, он обошелся с ним так ласково и человеколюбиво, что один из граждан выразился так: «Нет ничего выгоднее, как согрешить против Александра!» В другой раз один из его диаконов пред всеми клириками стал укорять дивного Александра. Александр поклонился ему и просил у него извинения: «Прости ж меня, брат мой!»'
        cn: 在提奥波利斯，还有一位名叫亚历山大的宗主教。他也同样非常仁慈和富有怜悯心。有一次，他的一位抄写员从他那里偷走了黄金，因惧怕而逃到了埃及的底拜……在那里流浪时，他落入了埃及和底拜强盗的手中，这些嗜血的野蛮人将他带到了他们国家最偏远的地方。奇妙的亚历山大得知此事后，用八十诺米斯玛赎回了这位俘虏。当这位逃犯回到他身边时，他对待他如此温柔和充满爱心，以至于一位市民这样说：「没有什么比得罪亚历山大更有利可图的了！」另有一次，他的一位执事在所有神职人员面前开始责备奇妙的亚历山大。亚历山大向他鞠躬，并请求他原谅说：「请原谅我吧，我的弟兄！」
  - type: heading2
    initial:
      ru: '35.'
      cn: '35.'
    text:
      ru: Жизнь иерусалимского архиепископа Илии и о Флавиане, патриархе Антиохийском.
      cn: 耶路撒冷大主教以利亚的生平，以及关于安提阿牧首弗拉维安。
    children:
    - type: paragraph
      text:
        ru: 'Авва Полихроний говорил нам об авве Илии, архиепископе иерусалимском, что он не пил вина, будучи простым монахом и, сделавшись патриархом, соблюдал то же правило. Рассказывали нам о том же архиепископе иерусалимском и об антиохийском – Флавиане следующее: император Анастасий обоих сослал в ссылку из-за св. Собора отцов, бывших в Халкидоне: Илию – в Аил, Флавиана – в Петру. Однажды патриархи извещают друг друга: «Анастасий сегодня умер, пойдем и мы на суд с ним». И чрез два дня оба отошли ко Господу.'
        cn: 阿爸波利赫罗尼乌斯告诉我们关于耶路撒冷大主教阿爸伊利亚斯的事，说他当还是个普通的修士时就不饮酒，并且在成为牧首后，依然遵守着同样的规矩。人们也告诉我们关于这位耶路撒冷大主教以及安提阿大主教弗拉维安如下的事：皇帝阿纳斯塔修斯因为在迦克墩举行的圣教父会议，将他们二人都流放了：伊利亚斯被流放到艾尔，弗拉维安被流放到佩特拉。有一天，两位牧首彼此告知：「阿纳斯塔修斯今天死了，我们也去与他一同受审吧。」于是，两天后，他们二人都归于主了。
  - type: heading2
    initial:
      ru: '36.'
      cn: '36.'
    text:
      ru: Жизнь антиохийского патриарха Ефрема и обращение православной вере одного столпника.
      cn: 安提阿牧首厄弗冷的生平，以及一位柱圣者归信东正教信仰。
    children:
    - type: paragraph
      text:
        ru: Один из старцев поведал нам о блаженном Ефреме, патриархе антиохийском, который был пламенным ревнителем православной веры. Услышав об одном столпнике в области города Иераполя, что он принадлежит к числу последователей Севера и акефалов, отправился, чтобы вразумить его. Прибыв к столпнику, он начал убеждать и молить его, чтобы он прибег к апостольскому престолу и вступил в общение со св. кафолической и апостольской Церковью.
        cn: 一位长老告诉我们关于蒙福的安提阿牧首厄弗伦，他是正教信仰的炽热捍卫者。他听说在希拉波利斯城地区有一位柱圣者，属于塞维鲁及其无首派的追随者之一，他便前往劝谕他。抵达柱圣者那里后，他开始规劝并恳求他，让他归依使徒教座，并与圣至公使徒教会共融。
    - type: paragraph
      text:
        ru: – Я не вступлю в общение с собором без особенного основания, – отвечал столпник.
        cn: ——我不会在没有特殊根据的情况下，与教会会议共融。——柱圣者答道。
    - type: paragraph
      text:
        ru: – Какого же доказательства желаешь ты от меня для убеждения в том, что, по благодати Иисуса Христа, Господа Бога нашего, святаяЦерковьсвободна от всякой нечистой примеси еретического учения? – спросил дивный Ефрем.
        cn: ——你想要我拿出什么样的证据，以确信借着我们主上帝耶稣基督的恩典，圣教会是自由的，摆脱了一切异端教导的不洁杂质呢？——奇妙的厄弗楞问道。
    - type: paragraph
      text:
        ru: – Господин патриарх, – сказал столпник, – разведем огонь и войдем вместе в пламя. Кто выйдет невредимым, тот и будет православным, и мы должны будем последовать ему.
        cn: 「主教长阁下，」柱圣者说道，「我们生火，然后一起走进火焰中。谁能毫发无损地出来，谁就是东正教徒，我们都必须跟随他。」
    - type: paragraph
      text:
        ru: – Следовало бы тебе, чадо, послушаться меня, как отца, – возразил патриарх, – и ничего более не требовать, а ты потребовал от меня того, что выше моих слабых сил. Впрочем, я уповаю на милосердие Сына Божия, что ради спасения души твоей исполню и это.
        cn: ——「孩子，你本该听从我，如同听从父亲一样，」宗主教反驳道，「并且不再要求什么，但你却向我提出了超出我微薄力量的要求。不过，我仰望上帝之子的怜悯，为了你灵魂的得救，我也会满足你这要求。」
    - type: paragraph
      text:
        ru: 'И немедленно чудный Ефрем обращается к предстоявшим со словами: «Благословен Господь! Принесите дров». Дрова принесены. Патриарх зажигает их пред столбом и говорит столпнику: «Сойди со столба и, согласно твоему решению, войдем оба в пламя». Столпник был поражен твердым упованием патриарха на Бога и не соглашался сойти.'
        cn: 立即，奇妙的埃弗雷姆转向在场的人们，说道：「赞美主！把柴火拿来。」柴火被拿来了。宗主教在柱子前点燃了它们，并对柱圣者说：「从柱子上下来，照你的决定，我们俩都走进火焰里。」柱圣者对宗主教对上帝的坚定信靠感到惊愕，不肯下来。
    - type: paragraph
      text:
        ru: – He ты ли сам пожелал этого? – спросил патриарх. – Отчего же теперь не хочешь исполнить?
        cn: 「——这难道不是你自己所希望的吗？」牧首问道，「那现在你为何不愿去履行呢？」
    - type: paragraph
      text:
        ru: 'Сказав это, патриарх снял с себя омофор и, близко подойдя к пламени, вознес молитву: «Господи Христе, Боже наш, благоволивший ради нас воистину воплотиться от Госпожи нашей Пресвятой Богородицы и Приснодевы Марии, Сам укажи нам истину!» И, окончив молитву, бросил свой омофор в средину пламени. Пламя пылало около трех часов. Дрова все сгорели, а омофор оказался целым и невредимым, без всякого даже знака от пламени. При виде этого, столпник, уверившись в истине, умилился, проклял Севера и ересь его и присоединился к св. Церкви. Приобщившись из рук блаженного Ефрема, он прославил Бога.'
        cn: 说罢，宗主教卸下他的奥莫福，走近火焰，献上祷告：「主基督，我们的上帝啊，祢为我们之故，真实地由我们的主母、至圣的生神女兼永远童贞的马利亚道成肉身，求祢亲自指示我们真理！」祷告完毕后，他将自己的奥莫福投入火焰之中。火焰燃烧了大约三个小时。柴火都烧尽了，而那奥莫福却完好无损，甚至没有丝毫被火焰触及的痕迹。看到这一幕，柱顶修士确信了真理，心生虔敬，咒骂塞维鲁和他的异端，并加入了圣教会。他从蒙福的叶夫列姆手中领受了圣餐后，便颂赞上帝。
  - type: heading2
    initial:
      ru: '37.'
      cn: '37.'
    text:
      ru: Жизнь епископа, который, оставив кафедру, работал вместе с плотниками.
      cn: 主教的生平，他放弃了主教座，与木匠们一同工作。
    children:
    - type: paragraph
      text:
        ru: 'Сколько есть никому неведомых рабов у Господа, и только Он один знает их! Один отец рассказал нам о епископе, который, оставив свою епископию, прибыл в Феополис, и работал вместе с плотниками. Областным правителем Востока в то время был Ефрем, человек милостивый и сострадательный. Он занят был восстановлением и исправлением общественных зданий, так как город пострадал от землетрясения. Однажды Ефрем видит во сне спящего епископа, и над ним поднимался до неба огненный столб. Это сновидение повторялось не раз, и Ефрем пришел в ужас: явление было страшно и изумительно. Он долго раздумывал, что бы это значило, и не мог догадаться, потому что не знал, что у него в числе рабочих был епископ. Да и как можно было узнать епископа в человеке с неприбранными волосами, в грязной одежде, совершенно простого вида, изможденном от терпения, подвигов и работы? Но однажды Ефрем посылает за этим работником, бывшим некогда епископом, чтобы от самого узнать, кто он такой. Увидав его, стал подробно расспрашивать, откуда он и как его зовут.'
        cn: 有多少无人知晓的主的仆人，只有祂独自知晓他们！一位教父告诉我们，有一位主教放弃了自己的主教区，来到费奥波利斯，并与木匠一同工作。当时东方的地区总督是叶夫列姆，一个仁慈且富有同情心的人。他当时正忙于修复和修缮公共建筑，因为这座城市曾遭受地震的破坏。有一天，叶夫列姆在梦中看见一位沉睡中的主教，在他上方有一道火柱升至天空。这个梦境不止一次地重复出现，叶夫列姆感到惊恐万分：这个景象既可怕又令人惊异。他长时间地思索着这意味着什么，却无法猜透，因为他不知道在他的工人中有位主教。再说，如何在一位头发蓬乱、衣衫褴褛、相貌极其普通、因忍耐、苦修和劳作而疲惫不堪的人身上认出一位主教呢？但是有一天，叶夫列姆派人去请这位曾是主教的工人，好亲自向他询问，他究竟是谁。见到他后，便开始详细询问他来自何处，叫什么名字。
    - type: paragraph
      text:
        ru: – Я – один из бедных жителей этого города. Не имея средств к пропитанию, я занимаюсь работой, и Бог питает меня от трудов моих.
        cn: – 我是这个城市贫困的居民之一。我没有谋生手段，我做工，并且上帝从我的劳作中供养我。
    - type: paragraph
      text:
        ru: – Поверь мне, – воскликнул Ефрем как бы по вдохновению свыше, – я не отпущу тебя до тех пор, пока ты мне не скажешь всей правды о себе.
        cn: ——相信我，——厄弗所姆仿佛是受了上天的启示，喊道，——我不会放你走，直到你把关于你自己的全部真相都告诉我。
    - type: paragraph
      text:
        ru: – Дай мне слово, что при жизни моей ты никому не будешь рассказывать обо мне, – сказал епископ, видя, что не может более скрываться. – С этим условием я открою тебе правду о себе, не называя, впрочем, ни моего имени, ни отечества.
        cn: ——给我一个承诺，在我有生之年，你不会向任何人讲述我的事，——主教说，他看到自己已无法再隐藏。——带着这个条件，我会向你揭示关于我自己的真相，但既不提及我的名字，也不提及我的故乡。
    - type: paragraph
      text:
        ru: – Не скажу о тебе никому, до тех пор, пока Бог продлит твою жизнь, – поклялся св. Ефрем.
        cn: ——我不会向任何人提及你，直到上帝延长你的寿命，——圣厄弗愣起誓说。
    - type: paragraph
      text:
        ru: '– Я – епископ и, ради Бога оставив свою епископию, пришел сюда, где меня никто не знает, чтобы изнурять себя трудами, – сказал епископ. – От своего труда я добываю себе немного хлеба. Что касается тебя – то подавай милостыню по мере сил. На этих днях Бог возведет тебя на апостольский престол Церкви города Феополиса, чтобы пасти тебе народ Его, который стяжал Своею Кровию Христос, истинный Бог наш. И еще раз скажу: подвизайтесь в делах милостыни и за веру православную, ибо такими жертвами благоугождается Бог.'
        cn: 「我是主教，并且，为了上帝，我舍弃了自己的主教职，来到这里，没有人认识我，为了以劳作苦修自身，」主教说，「我从自己的劳作中获得少许面包。至于你——则要尽力施舍。不久，上帝要将你提升至提奥波利斯城教会的宗徒宝座上，以牧养他的子民，这些子民是我们的真上帝基督用自己的宝血所获得的。我还要再说一次：你们要在施舍和为正教信仰而奋斗的事上竭力，因为上帝喜悦这样的祭献。」
    - type: paragraph
      text:
        ru: 'Спустя немного времени так действительно и случилось. А св. Ефрем, выслушав епископа, прославил Бога, воскликнув: «Сколько есть никому неведомых рабов у Господа, и только Он Один знает их!»'
        cn: 没过多久，事情果然如此。圣厄弗伦听了主教的话，荣耀了上帝，并惊呼道：「主啊，您有多少不为人知的仆人，只有您独自知道他们！」
  - type: heading2
    initial:
      ru: '38.'
      cn: '38.'
    text:
      ru: Смерть нечестивого императора Анастасия.
      cn: 不敬虔的阿那斯塔修斯皇帝之死。
    children:
    - type: paragraph
      text:
        ru: 'Один христолюбец поведал нам следующее об императоре Анастасии. После того, как он изгнал патриархов константинопольских Евфимия и Македония и отправил их в ссылку к Понту в Евхаиты, по делу о Соборе отцов, бывших в Халкидоне, сам император Анастасий видел во сне прекрасного мужа, одетого в белую одежду. Явившийся стоял против него, держал в руках исписанную книгу и читал ее. Перевернув пять листов, он прочитал имя императора и сказал ему: «Се – за твое зловерие я изглаждаю четырнадцать», – и изгладил своим перстом. Спустя два дня – вдруг сверкнула ослепительная молния и раздался страшный удар грома. Анастасий в ужасе испустил дух с невыразимой тоской. Это – воздаяние за то, что он нечестиво поступал против св. Церкви Христа Бога нашего и ссылал в ссылку ее пастырей.'
        cn: 一位爱基督者向我们叙述了以下关于皇帝阿纳斯塔西乌斯的事。在他放逐了君士坦丁堡的宗主教尤菲米乌斯和马其顿尼乌斯，并将他们流放到本都的欧卡伊塔斯，就迦克墩教父会议之事后，皇帝阿纳斯塔西乌斯本人在梦中看见一位穿着白衣的俊美男子。显现者站在他对面，手中拿着一本写满了字的册子，并在阅读它。翻了五页之后，他念出了皇帝的名字，并对他说：「看哪！因你的邪信，我要抹去十四。」他便用指头抹去了。两天之后——突然一道耀眼的闪电划过，并响起一声可怕的雷鸣。阿纳斯塔西乌斯在恐惧中，带着难以名状的愁苦断了气。这是对他的报应，因为他不虔敬地行事，对抗我们神基督的圣教会，并将她的牧者们流放。
  - type: heading2
    initial:
      ru: '39.'
      cn: '39.'
    text:
      ru: Инок обители аввы Севериана, спасенный девицею от греха.
      cn: 阿巴塞维利亚努斯修道院的修士，被一位少女从罪恶中拯救。
    children:
    - type: paragraph
      text:
        ru: 'Когда я был в великой Антиохии, один из пресвитеров той Церкви рассказал мне следующее происшествие, о котором слышал от патриарха Анастасия. Один монах из монастыря аввы Севериана послан был на служение в область Елевферопольскую, и дорогой зашел к одному христолюбивому земледельцу. У него была одна дочь. Мать ее уже скончалась. Монах прожил в доме земледельца три дня. Всегдашний враг людей – диавол внушил брату нечистые помыслы и страсть к девице, и он искал удобного случая причинить ей насилие. Внушивший нечистую похоть диавол позаботился и об этом. Отец девицы по неотложной нужде отправился в Аскалон. Монах, видя, что в доме никого нет, кроме его и девушки, приступил к ней с явным намерением обесчестить ее. Увидав его в сильном волнении, в пылу нечистой похоти, девица сказала ему:'
        cn: '当我身处伟大的安提阿时，那间教会的一位长老告诉我以下这件事，他是从宗主教阿纳斯塔西奥斯那里听来的。


          有一位修士，来自阿巴·塞维里阿诺斯的修道院，被差派去埃莱夫塞罗波利斯地区服事，路上他拜访了一位爱基督的农夫。这位农夫有一个女儿，她的母亲已经去世了。这位修士在农夫家中住了三天。人类永恒的仇敌——魔鬼，唆使这位弟兄产生了不洁的思想和对那少女的欲望，他便寻找方便的时机侵犯她。唆使不洁情欲的魔鬼也为此作了安排。少女的父亲因急事前往阿什克隆。这位修士看见家中除了他和少女之外空无一人，便走近她，带着玷辱她的明确意图。少女看见他处于极度不安中，在不洁情欲的炽热中，便对他说：'
    - type: paragraph
      text:
        ru: – Успокойся, и не спеши причинить мне бесчестие... Отец мой не вернется домой ни сегодня, ни завтра... Выслушай сперва, что я скажу тебе... Видит Бог, я готова удовлетворить твоей страсти...
        cn: – 平静下来，不要急着羞辱我... 我的父亲今天明天都不会回家... 先听我说完... 上帝作证，我愿意满足你的欲望...
    - type: paragraph
      text:
        ru: 'И, стараясь перехитрить монаха, девушка начала говорить ему:'
        cn: 于是，那女子试图智取修士，便开始对他说：
    - type: paragraph
      text:
        ru: – Скажи мне, мой брат, сколько времени ты прожил в монастыре?
        cn: ——告诉我，我的弟兄，你住在修道院里多长时间了？
    - type: paragraph
      text:
        ru: – Семнадцать лет.
        cn: – 十七年。
    - type: paragraph
      text:
        ru: – Имел ли ты сношения с женщинами?
        cn: ——你曾与女人有过性关系吗？
    - type: paragraph
      text:
        ru: – Нет.
        cn: – 不。
    - type: paragraph
      text:
        ru: '– И ты теперь не прочь ради одного часа потерять весь свой подвиг!? О, сколько раз ты проливал слезы, чтобы представить плоть свою Христу незапятнанной! И неужели из-за минутного наслаждения ты желаешь теперь лишиться всех своих трудов!?.. Погоди – вот еще что: хорошо, я послушаюсь тебя... Но если ты падешь со мною, возьмешь ли ты меня к себе и будешь ли кормить?'
        cn: ——你现在竟然为了一个小时，就不惜失去你所有的苦修吗！？哦，你曾多少次流泪，只为将你的肉体呈献给基督，毫无瑕疵！难道你现在竟然为了片刻的欢愉，就想失去你所有的劳苦吗！？……等等——还有一件事：好吧，我听你的……但如果你与我一同堕落，你会收留我并供养我吗？
    - type: paragraph
      text:
        ru: – Нет, – ответил монах.
        cn: – 不，修士回答说。
    - type: paragraph
      text:
        ru: – Так я тебе скажу сущую правду, – воскликнула девица, – если ты обесчестишь меня, будешь виновником многих зол...
        cn: – 那么我告诉你真真切切的实话，– 少女惊呼道，– 如果你玷辱我，你将成为许多祸患的罪魁祸首……
    - type: paragraph
      text:
        ru: – Каким образом? – спросил монах.
        cn: ——以何种方式？——修士问道。
    - type: paragraph
      text:
        ru: '– Во-первых, – отвечала девушка, – ты погубишь свою душу, а затем и моя погибшая душа взыщется на тебе. Знай – и я клянусь Тем, Кто сказал: «Не лги», – знай, что если ты обесчестишь меня, я немедленно удавлюсь, и ты окажешься убийцей и будешь судим, как убийца! Чтобы не случилось этого, ступай-ка лучше в свой монастырь и там прилежно помолись обо мне.'
        cn: ——「首先，」姑娘回答说，「你会丧失自己的灵魂，接着，我那已然丧失的灵魂，也要向你追讨。你要知道——我也向那位说过『不可说谎』（歌罗西书 3:9）的主起誓——你要知道，如果你玷辱了我，我会立刻上吊自尽，你就会成为凶手，并将像凶手一样受审！为了避免这种情况发生，你最好回你的修道院去，并在那里殷切地为我祷告。」
    - type: paragraph
      text:
        ru: Монах пришел в себя, отрезвился и, оставив дом земледельца, возвратился в свой монастырь. Пав к ногам игумена, чистосердечно раскаялся и молил, чтобы ему никогда более не отлучаться из монастыря. Прожив еще три месяца, он отошел ко Господу.
        cn: 僧侣醒悟过来，警醒了，离开了农夫的家，回到了他的修道院。他俯伏在住持的脚下，真诚地忏悔了，并且恳求让他再也不要离开修道院。又活了三个月，他归回了主。
  - type: heading2
    initial:
      ru: '40.'
      cn: '40.'
    text:
      ru: Жизнь аввы Космы евнуха.
      cn: 阿爸科斯马宦官的生平。
    children:
    - type: paragraph
      text:
        ru: 'Авва Василий, пресвитер византийского монастыря рассказал нам следующее: пришлось мне быть в Феополисе у патриарха аввы Григория. В это время пришел из Иерусалима авва Косма евнух, из лавры Фаран. То был истинный монах и строгий ревнитель православной веры. К тому же он был весьма сведущ в Св. Писании. Спустя несколько дней, старец скончался. Желая почтить его останки, патриарх приказал похоронить, его в гробнице, где покоился уже епископ. Спустя два дня я пришел поклониться гробнице старца. На гробнице возлежал один бедный, расслабленный, просивший милостыню у входивших во храм. Я поклонился трижды и произнес пресвитерскую молитву. Увидав это, нищий сказал мне:'
        cn: 拜占庭修道院的司祭阿巴·瓦西里向我们讲述了以下这件事：我当时在忒俄波利斯宗主教阿巴·格里高利那里。彼时，来自法兰修道院的宦官阿巴·科斯马从耶路撒冷来了。他是一位真正的修士，也是一位正教信仰的严谨捍卫者。此外，他非常精通圣经。几天后，这位长老去世了。宗主教希望尊崇他的遗骸，便吩咐将他安葬在已有一位主教安息的墓穴中。两天后，我去瞻仰这位长老的墓穴。墓穴旁躺着一个贫困、瘫痪的人，向进入圣殿的人乞讨施舍。我三次敬拜，并念诵了司祭的祷文。看到这情景，那个乞丐对我说：
    - type: paragraph
      text:
        ru: – Отец мой, воистину, велик был этот старец, которого вы здесь похоронили за два дня.
        cn: – 我的神父，确实，这位长老很伟大，你们两天前把他埋葬在这里。
    - type: paragraph
      text:
        ru: – Откуда ты это знаешь? – спросил я.
        cn: ——你怎么知道的？——我问道。
    - type: paragraph
      text:
        ru: '– Двенадцать лет я был расслабленным, – отвечал нищий, –  и чрез него я получил исцеление от Господа. И всякий раз, как я бываю в печали, он приходит утешать меня и доставляет мне облегчение. Мало того – я расскажу тебе еще об одном дивном явлении. С тех пор, как погребен здесь старец, я слышу громкий голос его, обращенный к епископу: «Не прикасайся ко мне! Уйди прочь! Не приближайся ко мне, еретик и враг истины и святой Божией кафолической Церкви!»'
        cn: 「我瘫痪了十二年，」乞丐回答说，「藉着他，我从主那里得到了医治。并且每当我忧伤时，他就前来安慰我，并带给我纾解。不止如此——我还要告诉你另一个奇妙的现象。自从这位长老葬在这里之后，我就听到他响亮的声音，对着主教说：『不要碰我！走开！不要靠近我，你这异端分子，真理的仇敌，以及上帝神圣、大公的教会的仇敌！』」
    - type: paragraph
      text:
        ru: Услышавши это от исцеленного расслабленного, я пришел и рассказал обо всем патриарху. Вместе с тем я просил св. мужа о том, чтобы взять тело старца и перенести в другую гробницу.
        cn: 从被治愈的瘫痪者那里听到这话，我便前来将一切都告诉了宗主教。与此同时，我请求这位圣人，希望他能将长老的遗体移往另一处墓穴。
    - type: paragraph
      text:
        ru: – Поверьте мне, чада, – возразил патриарх, – что авва Косма нисколько не оскорбляется близостью еретика. Все это произошло для того, чтобы показать нам после его кончины добродетель его и ревность по вере, которую он выказывал при жизни. Вместе с тем нам открыт и образ мыслей епископа, чтобы мы не считали его православным.
        cn: ——我的孩子们，请相信我，——宗主教反驳道，——阿爸科斯马丝毫没有被那位异端分子的靠近所冒犯。这一切的发生是为了在他去世之后，向我们展示他的美德，以及他生前所表现出的对信仰的热忱。与此同时，那位主教的思想方式也向我们揭示了，以免我们认为他是正教徒。
    - type: paragraph
      text:
        ru: 'Вот что еще рассказал нам тот же авва Василий о старце авве Косме: я посетил его в лавре Фаран. Старец рассказывал мне: пришла мне в голову мысль, что значат слова Господа Его ученикам: «Имеющий одежду, пусть продаст ее и купит нож» (Лк.22:36, 38). Ученики отвечали Ему: «Вот два ножа». Я много размышлял и не мог уяснить себе смысла этих слов. Несмотря на сильный зной полуденного солнца, я вышел из моей келлии, чтобы пойти в лавру «Башен» к авве Феофилу и спросить его. Проходя пустыней близ Каламона, я увидал огромного змея, который сползал с горы к Каламону. Змей был так велик, что при своих движениях представлял вид как бы свода, и я прошел невредимо под этим сводом. Я понял, что диавол хотел ослабить мое усердие, но мне помогли молитвы старца. Придя к авве Феофилу, я спросил его о словах Писания. «Два ножа, – отвечал Феофил, – означают двоякую добродетель: созерцание и добрые дела. Имеющий  то и другое достигает совершенства». У аввы Космы я был еще в лавре Фаран. Там, ведь, я пробыл десять лет. Во время одного душеспасительного разговора приведено было изречение св. Афанасия, архиепископа Александрийского. При этом старец сказал мне: «Если встретится тебе слово св. Афанасия и не будешь иметь при себе бумаги, возьми и запиши его на своей одежде». Столь великое уважение питал старец к св. отцам и учителям нашим! Вот что еще передавали нам о нем: в ночь под воскресные дни стоял с вечера до самого утра, пел псалмы и читал, совсем не садясь, в своей келлии и в храме. На восходе солнца окончивши правило, он садился читать св. Евангелие – до начала службы.'
        cn: 同样是瓦西里长老还告诉我们这些关于科斯马长老的事情：我曾在法兰隐修院拜访过他。长老告诉我：「我曾有个念头闪过脑海，关于主对祂的门徒所说的话是什么意思：『没有刀的，就当卖衣服买刀。』（路加福音 22:36，38）门徒回答祂说：『看哪，这里有两把刀。』我多次思索，却无法弄清这些话的含义。尽管午日的太阳炎热难耐，我还是离开了我的隐修小室，前往『高塔』隐修院去请教提奥菲卢斯长老。当我经过靠近卡拉蒙的旷野时，我看到一条巨大的蛇，它正从山上蜿蜒爬向卡拉蒙。这条蛇是如此之大，以至于它移动时仿佛形成一个拱门，而我安然无恙地从这拱门下穿过。我明白魔鬼想削弱我的热忱，但长老的祷告帮助了我。我来到提奥菲卢斯长老那里，向他请教圣经中的这些话。『两把刀，』提奥菲卢斯回答说，『代表着双重美德：默观和善行。兼具两者的人便能达到完全。』」我曾在法兰隐修院和科斯马长老在一起。我在那里住了十年。在一次有益灵魂的谈话中，引述了亚历山大总主教圣阿塔纳西乌斯的一句话。那时长老对我说：「如果你遇到圣阿塔纳西乌斯的话语，而身边又没有纸，那就把它写在你的衣服上。」长老对圣教父和我们的导师们怀有如此崇高的敬意！关于他，人们还告诉我们这些事：在主日前的夜晚，他从傍晚一直站立到清晨，在自己的隐修小室和教堂里歌唱诗篇并阅读，全然不坐下。日出时分，他完成自己的礼仪规范后，便坐下来阅读圣福音书——直到礼拜开始。
  - type: heading2
    initial:
      ru: '41.'
      cn: '41.'
    text:
      ru: Жизнь Павла из Аназарва.
      cn: 阿纳扎尔布斯的保罗生平。
    children:
    - type: paragraph
      text:
        ru: В той же самой лавре Фаран мы видели авву Павла. Это был святой муж, пламеневший любовию к Богу, необыкновенно кроткий и великий подвижник. Он ежедневно проливал обильные слезы. Я не знаю, приходилось ли мне в моей жизни встречать другого, подобного ему. Этот св. старец провел в уединении около пятидесяти лет, довольствовался только дарами Церкви и хранил совершенное безмолвие. Родом он был из Аназарва.
        cn: 在同一座法兰修道院中，我们见到了阿巴·保罗。他是一位圣洁的人，心中燃着对上帝的爱，极其谦和，是一位伟大的苦修者。他每日都流下大量的眼泪。我不知我此生是否曾遇到过像他这样的人。这位圣长老在隐修中度过了约五十年，仅以教会的馈赠为满足，并保持着彻底的静默。他来自阿纳扎尔巴。
  - type: heading2
    initial:
      ru: '42.'
      cn: '42.'
    text:
      ru: Жизнь аввы Авксанона, раба Божия.
      cn: 阿瓦·奥克萨农，神的仆人生平。
    children:
    - type: paragraph
      text:
        ru: 'В той же самой лавре довелось нам увидать и авву Авксанона, в его келлии. Он отличался милостию и воздержанием. В своем уединении он проводил столь строгую жизнь, что в четыре дня вкушал одну только просфору в двадцать лепт ценою. А иногда и в течение всей недели довольствовался одной просфорой. Под конец жизни этот великий отец заболел расстройством желудка. Мы перенесли его в патриаршую больницу во св. граде. Однажды, когда мы находились при нем, авва Конон, настоятель обители св. отца нашего Саввы, прислал ему в платке благословенный хлеб и шесть номисм, наказавши сказать ему при этом: «Прости меня: недуг не дозволяет мне самому прийти и приветствовать тебя». Старец принял хлеб, а монеты отослал обратно, прося передать пославшему: «Если бы, отец мой, Богу угодно было продлить мою жизнь, то я имею еще десять номисм. Когда издержу их, пришлю сказать вам. Но знай, отец мой, что чрез два дня я расстанусь с этим миром». Так и случилось. Мы перенесли его в лавру Фаран и там похоронили. Блаженный старец раньше был синкеллом свв. Евстохия и Григория. Оставив обоих, он, ради духовного совершенства, удалился в пустыню. Родом был из Анкиры Галатийской.'
        cn: 我们在那同一所大修道院里，在他的隐修室中见到了阿巴·奥克萨农。他以慈悲和节制而闻名。他在独修生活中过着如此严苛的生活，以至于每四天才食用一片价值二十雷普塔的圣餐饼。有时他甚至整整一周只吃一片圣餐饼。临终前，这位伟大的教父患上了肠胃疾病。我们把他送到了圣城的宗主教医院。有一天，当我们在他身边时，我们的圣父萨瓦修道院的院长阿巴·科农派人送来一块蒙福的面包和六枚诺米斯马，并吩咐对他说：「请原谅我：疾病使我无法亲自前来问候你。」这位长老收下了面包，但把钱币退了回去，请人转告送礼者说：「我的父亲啊，如果上帝愿意延长我的生命，我还有十枚诺米斯马。等我用完这些，我会派人告诉你们。但请你知道，我的父亲啊，两天后我将告别这个世界。」事情果然如此。我们把他送到了法兰大修道院，并在那里安葬了他。这位蒙福的长老早先曾是圣尤斯托希乌斯和格里戈里的主教幕僚长。他离开了他们二人，为了属灵的完善而退隐到旷野。他原籍加拉太的安基拉。
  - type: heading2
    initial:
      ru: '43.'
      cn: '43.'
    text:
      ru: Ужасная смерть нечестивого солунского архиепископа Фалалея.
      cn: 不敬虔的帖撒罗尼迦大主教法拉莱的可怕死亡。
    children:
    - type: paragraph
      text:
        ru: 'В Фессалонике был один архиепископ, по имени Фалалей. Он не боялся ни Бога, ни будущего воздаяния, презирал христианское учение, ни во что ставил, несчастный, и свой священный сан – словом: то был не пастырь, а лютый волк. Отвергши поклонение Святой Единосущной Троице (прости, Господи!), он служил идолам... Церковные власти того времени соборным определением лишили его епископского сана. Прошло немного времени, и Фалалей, совсем потеряв совесть, вздумал снова возвратить себе священный сан. По слову премудрого Соломона – злата всяческая послушают... вот и этот епископ был приглашен вернуться в свою епископию... Он ведь побывал в Константинополе, где власти, по слову пророка Исаии,«оправдали нечестивого даров ради, и, еже есть праведное праведного, взимали от него»(Ис.5:23)... Однако Бог не оставил Своей Церкви без попечения: Он отверг, как неугодное Ему, определение, составленное вопреки апостольским правилам. Однажды Фалалей облачился в пышные одежды, намереваясь представиться властям, чтобы, согласно постановлению, принять утверждение в прежнем своем сане. Он уже готов был выйти из дому, как вдруг, почувствовав боль в желудке, должен был удалиться для отправления естественной нужды. Там он пробыл два часа. Видя, что он не выходит, некоторые из дожидавшихся его снаружи вошли в отхожее место сказать ему, чтобы он выходил, и нашли, что голова его застряла внизу в нечистом отверстии, а ноги торчат кверху... Несчастный погиб вечной смертью, столь же ужасной, как и нечестивый богоборец Арий. Арий так же надеялся насильственно войти вцерковьпри помощи властей, но дивный великого совета Ангел святой Божией Церкви поразил его: в отхожем месте разорвались его внутренности, носившие в себе богохульство... Так и Фалалей надеялся было при помощи беззаконного содействия властей сотворить еще горшие прежнего злодеяния, но ангел Церкви Солунской, вместе с великим мучеником Димитрием, не допустили этого: там, где он сидел, замышляя вместе с подстрекавшим его нечистым демоном козни против св. Божией Церкви, безбожная голова раба неключимого застряла внизу в смрадном месте, а ноги, не ходившие прямыми путями по земле, оказались торчащими на воздухе, в знамение грядущего осуждения, и того, как страшно впасть в руки Бога Живого.'
        cn: '在帖萨洛尼基有一位大主教，名叫法拉莱。他既不敬畏上帝，也不惧怕未来的报应，藐视基督教教义，这不幸之人，视自己的神圣圣职如无物——总之：他不是牧者，而是凶残的恶狼。他摒弃了对神圣同质三位一体的敬拜（主啊，赦免！），却事奉偶像……


          当时的教会当局经过公会议决，剥夺了他的主教圣职。没过多久，法拉莱完全丧失了良知，竟又企图夺回其神圣圣职。正如智慧的所罗门所言——金钱能使万事顺从……于是这位主教便被召回其主教区……他此前曾到访君士坦丁堡，在那里，掌权者正如先知以赛亚所言，「为贿赂，称恶人为义，将义人的义夺去。」（以赛亚书 5:23）……


          然而，上帝并未撇下祂的教会无人看顾：祂驳回了这份违背使徒教规的决议，因其不蒙祂喜悦。有一次，法拉莱穿上华丽的法衣，打算晋见当局，以便按照既定程序，获准恢复其原有的圣职。他已准备好出门，怎料突然感到胃部剧痛，不得不前往方便。


          他在那里待了两个小时。见他久不出来，一些在外面等候他的人便走进茅厕叫他出来，却发现他的头卡在下面的污秽孔洞里，双脚朝天竖着……这不幸之人死去了永恒的死亡，其死状之可怖，一如那不敬虔的与神为敌者亚略。亚略也曾企图借由当局之力强行进入教会，但圣上帝教会那奇妙的「大谋略天使」击打了他：在茅厕里，他那满载亵渎言语的内脏破裂而死……


          同样，法拉莱也曾企图借由当局的非法协助，犯下比以往更邪恶的罪行，但帖萨洛尼基教会的天使，与大殉道者季米特里耶一同，阻止了这一切：就在他与那煽动他的不洁魔鬼一同，策划针对圣上帝教会的阴谋之处，这无用的仆人那不敬虔的头，卡在了下面的恶臭之处，而他那些在世上未曾行走直路的双脚，却悬空朝天，作为未来审判的征兆，以及落入永生上帝之手是何等可畏的警示。'
  - type: heading2
    initial:
      ru: '44.'
      cn: '44.'
    text:
      ru: Жизнь старца-инока близ города Антинои, и о молитве за усопших.
      cn: 长老修士在安提诺伊城附近的生活，以及关于为亡者祈祷。
    children:
    - type: paragraph
      text:
        ru: 'Когда мы пришли в Фиваиду и один старец рассказывал нам: за городом Антиноей жил великий старец, проживший в своей келлии около семидесяти лет. У него было десять учеников. Один из них был очень нерадив. Старец не раз уговаривал и молил его: «Брат, подумай о своей душе. Придет смерть и вместе с нею – кара». Но брат никогда не слушал старца и не принимал к сердцу его слов. Спустя немного времени этот брат скончался. Много печалился о нем старец: он знал, что он покинул этот мир в великом нерадении и беспечности. И начал старец молиться: «Господи Иисусе Христе, истинный Бог наш, покажи мне, что сталось с душою брата». И вот как бы в забытьи он видит огненную реку. В огне – великое множество осужденных, и среди них – брат, погруженный по шею.'
        cn: 当我们来到提拜达时，一位长老告诉我们：在安提诺埃城外住着一位伟大的长老，他在自己的修士居室里居住了大约七十年。他有十个门徒。其中有一个人非常疏忽怠惰。长老不止一次地劝说并恳求他：「弟兄啊，想想你的灵魂吧。死亡将来临，随之而来的还有惩罚。」但那位弟兄从未听从长老的话，也没有把他的话放在心上。过了不久，这位弟兄就去世了。长老为他感到非常悲伤，因为他知道这位弟兄是在极大的疏忽怠惰和漫不经心中离开了这个世界。于是长老开始祷告：「主耶稣基督，我们真正的上帝，求你指示我，这位弟兄的灵魂怎么样了。」就在这时，他仿佛在一种恍惚中看到了一条火河。在火中，有无数被定罪的人，其中就有那位弟兄，他被火淹没到脖子。
    - type: paragraph
      text:
        ru: – Не ради ли этой муки я молил тебя, чадо, чтобы ты позаботился о своей душе?
        cn: 「难道我恳求你，孩子，要你照料你的灵魂，不正是为了这痛苦吗？」
    - type: paragraph
      text:
        ru: – Благодарю Бога, отец мой, что хотя моя голова свободна от мучений. По молитвам твоим я стою над головою епископа.
        cn: ——我的父亲，我感谢上帝，即使我的头脑脱离了苦难。借着你的祷告，我立于主教的头顶之上。
  - type: heading2
    initial:
      ru: '45.'
      cn: '45.'
    text:
      ru: Жизнь инока, подвизавшегося на горе Елеонской, и о почитании образа Пресвятой Богородицы.
      cn: 一位在橄榄山实行苦修的隐修士的生平，以及敬奉至圣圣母圣像的记述。
    children:
    - type: paragraph
      text:
        ru: 'Один из старцев передал нам следующий рассказ аввы Феодора илиотского: на горе Елеонской жил затворник, великий подвижник. Диавол сильно обуревал его блудными помыслами. Однажды при страшном нападении диавола старец, потеряв терпение, воскликнул: «Когда же, наконец, ты оставишь меня в покое? Отступи от меня, по крайней мере, в моей старости!» Тогда диавол видимым образом явился старцу.'
        cn: 一位长老传授给我们阿爸提奥多尔·伊里奥茨基的以下记载：在橄榄山上住着一位隐修士，一位伟大的苦修者。魔鬼以淫秽的思想猛烈地搅扰他。有一次，在魔鬼一次可怕的攻击中，这位长老失去了耐心，喊道：「你到底什么时候才能让我安静？至少在我年老时，离开我吧！」于是魔鬼以可见的方式显现给这位长老。
    - type: paragraph
      text:
        ru: – Поклянись мне, что никому не откроешь того, что скажу тебе, и я перестану нападать на тебя.
        cn: – 向上我起誓，你不会向任何人透露我将要告诉你的事，我就会停止攻击你。
    - type: paragraph
      text:
        ru: – Клянусь Живущим на небе, – поклялся старец, – что никому не открою сказанного тобою.
        cn: ——我指着那住在天上的永生者起誓，——长老起誓说，——我绝不会向任何人透露你所说的一切。
    - type: paragraph
      text:
        ru: – Перестань поклоняться вот этому образу, – сказал диавол, – и я прекращаю брань на тебя. На иконе было изображение Владычицы нашей Пресвятой Богородицы Марии с Предвечным Младенцем – Господом нашим Иисусом Христом.
        cn: 魔鬼说：「停止敬拜这个圣像，我就停止与你争战。」圣像上是我们的主母至圣上帝之母玛利亚，以及永恒的圣婴——我们的主耶稣基督的图像。
    - type: paragraph
      text:
        ru: – Дай мне подумать, – ответил старец.
        cn: ——让我想想，——长老答道。
    - type: paragraph
      text:
        ru: На следующий день старец передал обо всем авве Феодору илиотскому, жившему тогда в лавре Фаран. От него и мы узнали.
        cn: 次日，长老将所有事告知了当时住在法兰拉夫拉的阿爸提奥多尔·厄利奥特斯。我们也是从他那里得知的。
    - type: paragraph
      text:
        ru: – Воистину, авва, ты поруган, потому что поклялся, – сказал ему авва Феодор, – но хорошо поступил, что не умолчал. Знай, что нет греха гибельнее и ужаснее, как отречься от поклонения Господу нашему Иисусу Христу и Его Матери.
        cn: '「——阿爸，你确实受辱了，因为你起了誓，」阿爸西奥多对他说，「但你没有保持缄默，你做得很好。」

          「要知道，没有什么罪比背弃对我们的主耶稣基督和他的母亲的敬拜更具毁灭性、更可怕了。」'
    - type: paragraph
      text:
        ru: После этого, успокоив и подкрепив старца различными наставлениями, авва Феодор удалился к себе. Снова является затворнику диавол.
        cn: 在这之后，阿爸提奥多尔用各种训诫安慰并坚固了这位长老，然后便回到了自己的住处。魔鬼又一次显现给这位隐修者。
    - type: paragraph
      text:
        ru: – Что ж это значит, негодный старик!? – сказал диавол. – Не клялся ли ты мне, что никому не будешь говорить? Зачем ты рассказал все пришедшему к тебе? Знай, что ты будешь осужден в день суда, как клятвопреступник!..
        cn: ——这到底是什么意思，你这可恶的老头！？——魔鬼说。——你难道不是对我发誓，你不会告诉任何人吗？你为什么要将一切都告诉来找你的那个人呢？你要知道，你将会在审判日被定罪，作为一个背誓者！
    - type: paragraph
      text:
        ru: '– Не тебе, клятвопреступнику, уличать меня! – отвечал старец. – Сам знаю, что я клялся и нарушил свою клятву, но не перед тобою, а пред Господом и Творцом моим. Тебя же слушать не стану: ты-то вот уж, подлинно подвергнешься неизбежной каре, как первовиновник всякого зла и клятвопреступник!..'
        cn: ——你这背誓者，没有资格来指摘我！——长者答道。——我自己知道，我发过誓，也违背了我的誓言，但那不是在你面前，而是在我的主和我的造物主面前。至于你，我不会听从你的话：你才真正将要遭受不可避免的惩罚，作为一切邪恶的始作俑者和背誓者！……
  - type: heading2
    initial:
      ru: '46.'
      cn: '46.'
    text:
      ru: Удивительное видение аввы Кириака из лавры Каламонской и о двух книгах нечестивого Нестория.
      cn: 卡拉蒙拉夫拉的阿瓦基里亚科斯所见的奇妙异象，以及关于不敬虔的涅斯托利的两本书。
    children:
    - type: paragraph
      text:
        ru: 'Однажды пришли мы к авве Кириаку, пресвитеру лавры Каламонской, что около священного Иордана. Он рассказывал нам: однажды я видел во сне величественную Жену, облаченную в порфиру, и вместе с Ней двух мужей, сиявших святостию и достоинством. Все стояли вне моей келлии. Я понял, что это – Владычица наша Богородица, а два мужа – св. Иоанн Богослов и св. Иоанн Креститель. Выйдя из келлии, я просил войти и сотворить молитву в моей келлии. Но Она не соизволила. Я не переставал умолять, говоря: «Да не буду я отвержен, унижен и посрамлен и многое другое». Видя неотступность моей просьбы, Она сурово ответила мне: «У тебя в келлии – Мой враг. Как же ты желаешь, чтобы Я вошла?» Сказавши это, удалилась. Я пробудился и начал глубоко скорбеть, вообразив себе, не согрешил ли я против Нее хотя бы помыслом, так как, кроме меня одного, никого в келлии не было. После долгого испытания себя я не нашел в себе никакого прегрешения против Нее. Погруженный в печаль, я встал и взял книгу, чтобы чтением рассеять свою скорбь. У меня была в руках книга блаженногоИсихия, пресвитера иерусалимского. Развернув книгу, я нашел в самом конце ее два слова нечестивого Нестория, и тотчас сообразил, что он-то и есть враг Пресвятой Богородицы. Немедленно встав, я вышел и возвратил книгу тому, кто мне ее дал.'
        cn: 有一次我们来到卡拉蒙斯基大修道院的司祭阿巴·基里亚库那里，该修道院位于圣约旦河附近。他告诉我们：有一次我在梦中看见一位威严的女子，身着紫袍，和她在一起的还有两位男子，他们散发着圣洁与尊贵的光辉。他们都站在我的小室外面。我明白，这位是我们的主宰，上帝之母，而那两位男子是圣约翰·神学家和圣约翰·施洗者。我从小室出来，请求他们进入我的小室做祷告。但她没有应允。我不停地恳求，说：「请不要让我被拒绝、受屈辱和蒙羞，以及许多其他的话。」看到我恳求的坚持不懈，她严厉地回答我：「你的小室里有我的仇敌。你怎能希望我进去呢？」说完这些，她就离开了。我醒来后，开始深切地悲伤，心想自己是否曾在思想上冒犯了她，因为除了我一个人，小室里没有任何其他人。经过长时间的自我省察，我没有发现自己有任何冒犯她的罪过。沉浸在悲伤中，我起身拿了一本书，希望通过阅读来排遣我的悲伤。我手里拿着的是耶路撒冷司祭，蒙福者伊西希乌斯的书。翻开书，我在书的最后发现不虔诚的聂斯脱利的两句话，我立刻明白，他就是至圣上帝之母的仇敌。我立刻起身，走了出去，把书还给给我书的那个人。
    - type: paragraph
      text:
        ru: – Возьми, брат, обратно свою книгу. Она принесла не столько пользы, сколько вреда.
        cn: —— 弟兄，把你的书拿回去吧。它带来的益处不多，害处却不少。
    - type: paragraph
      text:
        ru: Он пожелал знать, в чем состоял вред. Я рассказал ему о своем сновидении. Исполнившись ревности, он немедленно вырезал из книги два слова Нестория и предал пламени.
        cn: 他希望知道危害何在。我告诉了他我的梦。他满怀热忱，立刻从书中剪下涅斯托利的两个词，并将其付之一炬。
    - type: paragraph
      text:
        ru: – Да не останется и в моей келлии, – сказал он, – враг Владычицы нашей Пресвятой Богородицы и Приснодевы Марии!..
        cn: 「甚至在我的修道室里，」他说，「也绝不容许留下任何我们女主宰、至圣圣母和常贞玛利亚的仇敌！…」
  - type: heading2
    initial:
      ru: '47.'
      cn: '47.'
    text:
      ru: Чудо Пресвятой Богородицы над Гаианом комедиантом
      cn: 至圣圣母在喜剧演员盖亚努斯身上所行的奇迹
    children:
    - type: paragraph
      text:
        ru: 'В одном из городов ливанской Финикии был комедиант Гаиан. Он, понося Пресвятую Богородицу, представлял Ее в театре. И вот является ему во сне Богоматерь, и говорит: «Какое зло Я причинила тебе? 3а что ты издеваешься и поносишь Меня?» Пробудившись, комедиант не только не образумился, но еще более поносил Ее. Снова явилась ему Пресвятая Богородица и, вразумляя его, произнесла те же слова. Но и это вразумление не подействовало на несчастного. В третий раз явилась ему Пресвятая Дева с тем же самым вразумлением, но комедиант оказался неисправим. Наконец, однажды во время полуденного отдыха Она явилась ему и, не сказавши ни слова, одним только перстом провела черту по его рукам и ногам. Проснувшись, он почувствовал, что у него отнялись руки и ноги и лежали без движения, как бревна... Всем показывал себя, несчастный, громко исповедуя свое нечестие, за которое восприял достойное возмездие – и то еще ради человеколюбия...'
        cn: 在黎巴嫩腓尼基的某座城市里，有一位喜剧演员，名叫盖扬。他亵渎至圣上帝之母，在剧院里将她搬上舞台。于是，上帝之母在梦中显现给他，并对他说：「我加害于你什么恶事了？你为何戏弄并亵渎我呢？」醒来后，这位喜剧演员不仅没有悔悟，反而更加亵渎她。至圣上帝之母再次显现给他，并劝诫他，说了同样的话。但这份劝诫对这不幸的人没有起作用。第三次，至圣童贞女向他显现，带着同样的劝诫，但这喜剧演员竟然无可救药。最终，有一天他在午间休息时，她向他显现，一言不发，仅用一根手指在他的手脚上划了一条线。醒来后，他感觉到自己的手脚都瘫痪了，像木头一样一动不动地躺着……这不幸的人向所有人展示自己，大声忏悔自己的不虔敬，因为这不虔敬，他承受了应得的报应——而这还只是因着（上帝的）爱人（之心）……
  - type: heading2
    initial:
      ru: '48.'
      cn: '48.'
    text:
      ru: Чудо Пресвятой Богородицы, побудившее Космиану, жену патриция Германа, возвратиться в лоно св. Церкви из ереси Северовой.
      cn: 至圣圣母的神迹，促使贵族赫尔曼的妻子科斯米娅娜，脱离塞维鲁派异端，回归圣教会的怀抱。
    children:
    - type: paragraph
      text:
        ru: Пресвитер Анастасий, ризничий церкви св. Воскресения Христа, Бога нашего, передавал нам, что однажды в ночь под воскресенье Космиана, жена патриция Германа, придя одна, желала поклониться св. и животворящему гробу Господа нашего Иисуса Христа – истинного Бога. Она уже приблизилась к вратам святилища, и вот навстречу ей явилась видимым образом наша Владычица Пресвятая Богородица, в сопровождении других жен.
        cn: 长老阿纳斯塔西奥斯，我们上帝基督神圣复活教会的圣器室管理人，曾告诉我们，有一天在主日前的夜晚，贵族赫尔马诺斯之妻科斯米亚娜独自前来，想要朝拜我们主耶稣基督——真上帝——神圣而赐生命的圣墓。她已临近圣所的门，此时，我们的女皇至圣上帝之母由其他妇女陪伴着，迎面可见地显现了。
    - type: paragraph
      text:
        ru: – Ты не принадлежишь к нам, не наша, поэтому и не входи сюда, – сказала Богоматерь.
        cn: 「你不属于我们，也不是我们的人，因此不要进来这里。」圣母说。
    - type: paragraph
      text:
        ru: 'Космиана действительно принадлежала к секте Севера акефала. На настойчивые мольбы о дозволении войти ко св. гробу Богоматерь отвечала:'
        cn: 科斯米安娜确实属于塞维鲁无头派。对于她再三恳求进入圣墓的祷告，圣母回答说：
    - type: paragraph
      text:
        ru: – Поверь мне, женщина, что ты не войдешь сюда, если не присоединишься к нам.
        cn: ——相信我，女人，如果你不加入我们，你就不能进来这里。
    - type: paragraph
      text:
        ru: Поняв, что уклонение в ересь возбраняет ей доступ к святыне, которой она не увидит, пока не обратится к св. кафолической и апостольской Церкви Христа, Бога нашего, Космиана тотчас позвала диакона. Когда диакон пришел с св. Чашею, она причастилась св. Тела и Крови великого Бога и Спаса нашего Иисуса Христа, а затем удостоилась беспрепятственно поклониться и св. животворящему гробу Господа.
        cn: 她明白，偏离异端会禁止她接触圣所，在她回归我们之神基督的圣大公和使徒教会之前，她将无法见到圣所。科斯米娅娜立刻召唤了执事。当执事带着圣杯到来时，她领受了我们伟大之神和救主耶稣基督的圣体与宝血。随后，她得蒙恩准，毫无阻碍地瞻仰了主那赐生命的圣墓。
  - type: heading2
    initial:
      ru: '49.'
      cn: '49.'
    text:
      ru: Дивное видение палестинского военачальника, побудившее его отречься от ереси и возвратиться в лоно Христовой Церкви.
      cn: 巴勒斯坦军事将领的一个奇妙异象，促使他弃绝异端，并归回基督教会的怀抱。
    children:
    - type: paragraph
      text:
        ru: 'Пресвитер Анастасий рассказал нам еще о следующем происшествии: Гевемер, сделавшись палестинским военачальником, прежде всего явился поклониться Св. Христову Воскресению. Лишь только хотел он войти во храм, как увидал барана, бросившегося на него, чтобы ударить рогами. В сильном испуге он отступил назад. Стоявшие здесь Азарий, хранитель св. Креста; и храмовые служители спрашивали его:'
        cn: 长老阿纳斯塔西奥斯还向我们讲述了以下这件事：盖韦梅尔成为巴勒斯坦的军事指挥官后，首先前来敬拜神圣基督复活堂。他刚想走进教堂，就看见一只公羊朝他猛冲过来，要用角顶他。他大吃一惊，便退了回去。站在那里的神圣十字架的守护者阿扎里奥斯和教堂的侍从们问他：
    - type: paragraph
      text:
        ru: – Что с тобой, господин? Отчего ты не войдешь?
        cn: — 先生，你这是怎么了？为何不进来？
    - type: paragraph
      text:
        ru: – Зачем вы пустили сюда этого барана? – спросил военачальник. Все были поражены удивлением. Осмотрели св. гроб, и ничего не нашли.
        cn: '「你们为什么把这只公羊放到这里来了？」军事统帅问道。

          所有人都大为震惊。他们察看了圣墓，却什么也没找到。'
    - type: paragraph
      text:
        ru: – Тут нет ничего – ступай!
        cn: – 这里什么都没有 – 走！
    - type: paragraph
      text:
        ru: 'Гевемер снова попытался войти – и снова то же явление: баран устремляется на него и не дает ему войти... Это повторилось не раз. Видение было только одному Гевемеру, другие совсем ничего не видели...'
        cn: 格韦梅尔再次尝试进入——却又再次发生同样的异象：一只公羊猛冲向他，不让他进入……这种情况重复了多次。这异象只有格韦梅尔一人看见，其他人则完全什么也没看见……
    - type: paragraph
      text:
        ru: – Поверь мне, господин, – сказал тогда хранитель св. Креста, у тебя что-нибудь есть на душе... Это и возбраняет тебе доступ к святому и животворящему гробу нашего Спасителя. Ты хорошо сделаешь – исповедавшись пред Богом. Милостивый и человеколюбивый, желая твоего спасения, Он явил тебе это знамение.
        cn: 「请相信我，先生，」圣十字架的守护者当时说道，「你心里有重担……正是这个阻碍了你接近我们救主神圣且赐予生命的坟墓。你最好在上帝面前认罪忏悔。祂满有怜悯和爱世人，渴望你的救赎，便向你显现了这个兆头。」
    - type: paragraph
      text:
        ru: – О, на мне много тяжких грехов пред Господом, – воскликнул Гевемер, проливая слезы.
        cn: ——噢，我在主面前背负着许多沉重的罪孽，——格弗梅尔泪流满面地喊道。
    - type: paragraph
      text:
        ru: 'И павши на лице свое, он долго плакал и исповедывал грехи свои пред Богом. И, поднявшись, снова хотел было войти и – не мог: явившийся баран еще с большей силой преграждал ему доступ к святыне.'
        cn: 他俯伏在地，许久哭泣，并在神面前认自己的罪。起来，他又想进去，却不能：那出现的公羊以更大的力量拦阻他进入圣所。
    - type: paragraph
      text:
        ru: – Видно, есть еще какая-нибудь преграда, – сказал хранитель Креста.
        cn: ——看来，还有某种障碍，——十字架的守护者说。
    - type: paragraph
      text:
        ru: – Не потому ли я не могу войти, что не состою в общении со св. кафолической и апостольской Церковию, а принадлежу к секте Севера? – сказал военачальник, и просил хранителя св. Креста, чтобы сподобил его причащения святого и животворящих тайн Христа Бога нашего.
        cn: ——难道我不能进入，是因为我没有与至圣、大公、使徒的教会共融，而是属于塞维鲁教派吗？军事长官说道，并请求圣十字架的守护者，使他配得领受我们神基督的至圣和赋予生命的圣奥秘。
    - type: paragraph
      text:
        ru: Пришел диакон со св. Чашею, и он, причастившись, присоединился к Церкви. После того приступил и поклонился св. Гробу, ничего более не видевши.
        cn: 执事带着圣杯来了，他领受了圣体圣血，便归入了教会。之后，他走上前去，朝拜了圣墓，再也没有看到其他什么了。
  - type: heading2
    initial:
      ru: '50.'
      cn: '50.'
    text:
      ru: Видение затворника аввы Георгия.
      cn: 隐修者阿爸格奥尔基的异象。
    children:
    - type: paragraph
      text:
        ru: 'Скифополь был вторым главным городом Палестины. Там мы виделись с аввою Анастасием, который передал нам рассказ о затворнике авве Георгии: однажды ночью я встал, чтобы ударить в било (он был канонархом), и слышу, что старец плачет. Подойдя к нему, я спросил:'
        cn: 斯基托波利斯是巴勒斯坦的第二大城市。我们在那里见到了阿瓦·阿那斯塔修斯，他向我们讲述了关于隐士阿瓦·格奥尔基的故事：有一天晚上，我起身去敲木铎（他当时是唱经员），听见那位长老在哭泣。我走到他身边，问道：
    - type: paragraph
      text:
        ru: – О чем ты так плачешь, авва?
        cn: – 你为何哭泣得这样，阿爸？
    - type: paragraph
      text:
        ru: Старец молчал.
        cn: 长老沉默了。
    - type: paragraph
      text:
        ru: – Скажи – же мне о причине твоего плача, – продолжал я спрашивать.
        cn: 「那么，就告诉我你哭泣的原因吧，」我继续问道。
    - type: paragraph
      text:
        ru: '– Как мне не плакать, – сказал старец, вздохнувши из глубины души, – когда Господь наш прогневался на нас! Мне казалось, чадо, что я стою пред Кем-то, сидящим на высоком престоле. Многие, многие тысячи обстоят вокруг престола, умоляя Его о чем-то. Но Он не склоняется на их молитвы. И приблизилась к Нему некая Жена, облеченная в порфиру. Припадши к Нему, Она воскликнула: «Умилостивись же, хотя ради Меня!» Но Он остался непреклонен. Вот почему я плачу и рыдаю – в сильном страхе за то, что угрожает нам.'
        cn: 「我怎能不哭泣呢，」长老深深地叹了口气说，「我们的主向我们发怒了！孩子，我好像看见，我站在一位坐在高高宝座上者的面前。成千上万的人围在宝座周围，恳求他什么事。但他不垂听他们的祷告。有一位身穿紫色长袍的妇人走近他。她俯伏在他面前，喊道：『求你发怜悯吧，哪怕是为我的缘故！』但他仍然不为所动。这就是我哭泣和哀号的原因——我为我们所面临的威胁而感到极度恐惧。」
    - type: paragraph
      text:
        ru: Он рассказал мне об этом в четверток утром, а на следующий день, в пятницу, часу в девятом, произошло страшное землетрясение, разрушившее города приморской Финикии.
        cn: 他是在星期四早上把这件事告诉我的，而第二天，星期五，约在九点钟的时候，发生了一场可怕的地震，摧毁了沿海腓尼基的城市。
    - type: paragraph
      text:
        ru: 'Тот же авва Анастасий рассказал нам еще об этом старце: спустя немного времени, стоял он у окна и начал горько плакать. Увы, брат, говорил старец, никакого сокрушения сердечного нет у нас, пребываем в нерадении, и я боюсь, что мы при дверях, и гнев Божий постиг нас. И на следующий день виден был огонь на небе.'
        cn: 同样的长老阿纳斯塔西又向我们讲述了关于这位长老的事：不久之后，他站在窗边，便开始悲痛地哭泣。「唉，弟兄啊，」长老说，「我们心中毫无忧伤痛悔，陷于懈怠之中，我担心我们已近在门前，上帝的愤怒已临到我们。」到了第二天，天上显出火光。
  - type: heading2
    initial:
      ru: '51.'
      cn: '51.'
    text:
      ru: Жизнь старца Юлиана.
      cn: 《长老尤利安的生平》
    children:
    - type: paragraph
      text:
        ru: Аназарв – главный город второй Киликии. Милях в двенадцати от него расположена лавра, называемая Египетской. Тамошние отцы рассказали нам, что пять лет назад в их лавре скончался старец по имени Юлиан. Они поведали также, что около семидесяти лет Юлиан провел в тесной пещере, не владея ничем, принадлежащим к веку сему, кроме платья из козьей шерсти, плаща, евангелия и деревянного кубка. А еще отцы сказали, что во все время жизни своей старец не зажигал светильника и по ночам небесный свет озарял пещеру и позволял ему при чтении различать буквы.
        cn: 安纳扎尔布是第二奇里乞亚的首府。离它约十二英里处，坐落着一个被称为「埃及」的修道院群。那里的教父们告诉我们，五年前，在他们的修道院群中，一位名叫尤利安的长老逝世了。他们还告知，尤利安大约有七十年时间是在一间狭窄的洞穴中度过的，除了今世之物一无所有，只拥有一件山羊毛制长袍、一件斗篷、一本福音书和一个木制杯子。教父们还说，在他一生中，这位长老从不点燃灯盏，而在夜晚，天上的光芒会照亮洞穴，使他能够在阅读时辨认文字。
  - type: heading2
    initial:
      ru: '52.'
      cn: '52.'
    text:
      ru: Слово аввы Илии молчальника.
      cn: 阿爸以利亚默言者的话。
    children:
    - type: paragraph
      text:
        ru: Пришел однажды брат к авве Илии молчальнику в Пещерную киновию аввы Саввы.
        cn: 一个弟兄有一次来到阿爸以利亚默者那里，当时他就在阿爸萨瓦的佩希尔纳娅基诺维亚。
    - type: paragraph
      text:
        ru: – Авва, скажи мне наставление, – просил брат.
        cn: – 阿爸，请给我一些教诲吧，– 那修士求道。
    - type: paragraph
      text:
        ru: '– Во дни отцев, – отвечал старец, – любили три добродетели: нестяжательность, кротость и воздержание, а теперь среди монахов преобладает корыстолюбие, чревоугодие и дерзость. Избирай, что хочешь.'
        cn: 长老回答说：「在教父时代，人们珍视三种美德：不贪财物、温柔和节制；可是现在在修士们中间，普遍盛行着贪财、贪食和放肆。你选择你想要的吧。」
  - type: heading2
    initial:
      ru: '53.'
      cn: '53.'
    text:
      ru: Жизнь старца Кириака из обители св. Саввы.
      cn: 圣萨瓦修道院的长老基里亚克生平。
    children:
    - type: paragraph
      text:
        ru: 'Авва Стефан Трихина рассказал нам об одном старце, жившем в лавре св. отца нашего Саввы: однажды он отправился в Кофилу и, пробывши немного времени близ Мертвого моря, возвращался обратно в свою келлию. Был страшный зной, и старец сильно изнемог. И начал он молиться Богу, простирая руки к небу: «Господи, ты видишь, что я не могу продолжать пути от жажды». И тотчас окружило его облако и сопутствовало ему до самой келлии, на расстоянии двенадцати миль.'
        cn: 阿爸斯提凡·特里希纳告诉我们一个关于一位长老的故事，他曾住在我们的圣父萨瓦修道院：有一次，他去了科菲鲁，在死海附近待了一小段时间后，正返回他的隐修室。当时酷热难当，长老感到非常虚弱。于是他开始向上帝祷告，向天伸出手说：「主啊，您看到我因口渴无法继续前行了。」随即，一片云朵环绕着他，并伴随他直到隐修室，路程长达十二英里。
    - type: paragraph
      text:
        ru: 'Тот же авва Стефан поведал нам еще об этом старце: пришли однажды к нему родственники, чтобы повидаться с ним. В лавре они искали его келлию. Некоторые указали им, и они, подойдя, постучались в дверь. Узнав своих, старец молил Бога, да не будет видим ими. И отворив дверь, вышел из келлии, не будучи замечен. Удалившись в пустыню, он пробыл там до тех пор, пока его родственники не оставили его келлии.'
        cn: 同一位阿爸·斯特凡又告诉我们关于这位长老的事：有一次，他的亲戚们来看望他。在拉夫拉修道院里，他们寻找他的隐修室。有人指引他们，于是他们走上前去敲门。长老认出是他的亲戚，便恳求上帝，使他不要被他们看见。他打开门，走出隐修室，却没有被发觉。他退隐到荒野中，一直待在那里，直到他的亲戚们离开了他的隐修室。
  - type: heading2
    initial:
      ru: '54.'
      cn: '54.'
    text:
      ru: Жизнь скитских монахов, и о старце Аммонии.
      cn: 修道林修士的生活，以及关于长老阿摩尼乌斯。
    children:
    - type: paragraph
      text:
        ru: 'Пришли мы в Теренуфу, к авве Феодору Александрийскому. Старец говорил нам: «Воистину, чада, скитские монахи совсем ослабили строгую скитскую жизнь, по предсказанию старцев. Поверьте, чада, мне, старику, что прежде у скитских иноков наблюдалась великая любовь, и строгое воздержание, и дар разумения. И я застал еще там старцев, которые вовсе не принимали пищи, если кто-нибудь не заходил к ним. Между ними был старец Аммоний, живший близ меня. Зная его образ жизни, я каждую субботу навещал его, чтобы он, ради моего прихода вкусил пищи. И все они наблюдали такое правило: в какое бы время кто ни пришел к ним, должен был сотворить молитву, а старцы, между тем, готовили трапезу, и потом вместе вкушали пищу.»'
        cn: 我们来到特雷努法，到亚历山大科普特的阿爸提奥多尔那里。长老对我们说：「确实，孩子们啊，斯基特的修士们完全松懈了严格的斯基特生活，正如长老们所预言的。孩子们啊，相信我这个老头子吧，以前在斯基特的修士中，可以看到极大的爱，和严格的节制，以及辨别的恩赐。我那时还在那里遇到了一些长老，如果没有人拜访他们的话，他们根本不进食。其中有一位长老名叫阿莫尼，就住在我的附近。我知道他的生活方式，所以我每个安息日都会去拜访他，好让他，因为我的到来而进食。他们所有人都遵守着这样一条规矩：无论什么时候有人来拜访他们，都必须先做祷告，而长老们，与此同时，则准备膳食，然后他们再一起进食。」
  - type: heading2
    initial:
      ru: '55.'
      cn: '55.'
    text:
      ru: Видение одного старца, жившего в скиту, и об авве Иринее.
      cn: 一位住在隐修院的长老的异象，以及关于阿爸·伊里涅。
    children:
    - type: paragraph
      text:
        ru: Авва Ириней рассказал нам, что один старец, живший в скиту, увидал ночью, как диавол раздавал братии грабли и корзины.
        cn: 阿爸 伊利涅 告诉我们，有一位住在隐修院的长老，在夜间看见魔鬼正在分发给弟兄们耙子和篮子。
    - type: paragraph
      text:
        ru: – Что такое? – спросил старец.
        cn: ——那是什么？——长者问道。
    - type: paragraph
      text:
        ru: – Готовлю развлечение для братии, – отвечал диавол, – чтобы они были рассеяннее во время славословия Бога.
        cn: ——「我在为修士们准备消遣，」魔鬼回答说，「好让他们在颂赞上帝时更加分心。」
    - type: paragraph
      text:
        ru: 'Тот же Авва Ириней рассказал нам следующее: при нападении варваров я удалился из скита и, придя в Галскую область, взял келлию в лавре. Взяв от аввы этой лавры книгу о жизни старцев, в тот же день присел за чтение. И лишь только раскрыл книгу, нашел главу, где говорилось о том, как один брат пришел к старцу, и говорит ему:'
        cn: 那位阿爸伊利涅也告诉我们以下的事：当野蛮人入侵时，我从斯基特退隐，来到加利亚地区，在拉夫拉里取了一间凯里亚。我从这间拉夫拉的阿爸那里取来一本关于长者生平的书，就在同一天坐下来阅读。我刚一打开书，就找到了一章，里面讲到，有一个弟兄来到一位长者那里，并对他说：
    - type: paragraph
      text:
        ru: – Помолись обо мне, отче.
        cn: ——神父，请你为我祈祷。
    - type: paragraph
      text:
        ru: – Когда ты был с нами, – ответил старец, – я молился за тебя, а теперь ты ушел к своим и я перестал молиться за тебя.
        cn: ——当你和我们在一起的时候，——长老回答说，——我为你祷告。可现在你回到了你的人那里，我就停止为你祷告了。
    - type: paragraph
      text:
        ru: 'Прочитав об этом, я сложил книгу и сказал сам себе: «Бедный Ириней, и ты ушел к себе, и отцы уже не молятся более о тебе!» И тотчас, возвратив книгу авве, я удалился и пришел сюда – в Келлии. Вот причина, чада мои, почему я нахожусь в этом месте.'
        cn: 读完这些，我合上书，自言自语道：「可怜的伊里奈乌斯啊，你也回到你自己那里去了，而圣父们也不再为你祷告了！」 随即，我把书还给长老，便离开了那里，来到这里——凯利亚。我的孩子们，这就是我身在此地的原因。
  - type: heading2
    initial:
      ru: '56.'
      cn: '56.'
    text:
      ru: Жизнь Иоанна, ученика великого старца.
      cn: 伟大长老的门徒约翰的生平。
    children:
    - type: paragraph
      text:
        ru: 'В Финикии есть город Птолемаида. Там есть предместье, называемое «Парасима». В нем жил один великий старец. У него был ученик, по имени Иоанн, тоже великий подвижник, особенно отличавшийся послушанием. Однажды старец послал ученика на работу и дал ему для подкрепления сил немного хлеба. Ученик ушел и, исполнив работу, возвратился, не дотронувшись до хлеба. Старец, увидав хлебы, сказал ему:'
        cn: 在腓尼基，有一座名叫托勒迈达的城。城中有一处城郊，叫作「帕拉西马」。在那里住着一位伟大的长老。他有一个名叫约翰的门徒，也是一位伟大的苦修者，尤其以顺服著称。有一次，这位长老派门徒去工作，并给了他一些饼，以补充体力。门徒去了，完成了工作后便回来了，丝毫未动那些饼。长老看见那些饼，便对他说：
    - type: paragraph
      text:
        ru: – Отчего же ты, чадо, не вкусил хлеба, который я дал тебе?
        cn: — 孩子啊，你为何不尝我给你的面包呢？
    - type: paragraph
      text:
        ru: – Прости меня, отче, – отвечал ученик, поклонившись старцу. – Отпуская меня, ты не благословил и не дал мне повеления вкусить пищи. Потому я и не ел.
        cn: ——请宽恕我，长老，——弟子回答道，向长老行了鞠躬礼。——您送我走时，没有给我祝福，也没有吩咐我进食。因此我就没有吃。
    - type: paragraph
      text:
        ru: 'Старец, подивившись разумению брата, благословил его. После кончины старца, этот брат постился сорок дней, и ему было небесное видение, причем он слышал голос: «На какого больного ты ни возложишь своих рук, он исцелится». И вот утром, по промыслу Божию, приходит к нему человек и приводит свою жену, страдавшую раком в груди. Муж начал просить, чтобы он исцелил его жену. Брат называл себя грешником и недостойным для такого дела. Однако муж неотступно молил его, чтобы он склонился на его просьбу и помилосердовал о жене его. Тогда он, возложив руку, осенил грудь (крестным знамением), и женщина немедленно получила исцеление. И с той поры Бог явил чрез него много других знамений не только при жизни, но и по смерти его.'
        cn: 长老对修士的悟性感到惊奇，就祝福了他。长老去世后，这位修士禁食了四十天，他有了一个属天的异象，并且他听到一个声音说：「无论你将手按在哪个病人身上，他都会痊愈。」就在第二天早上，照着神的护理，有一个人来到他那里，带着他患有乳腺癌的妻子。丈夫开始请求他医治自己的妻子。这位修士称自己是罪人，不配做这样的事。然而，丈夫不停地恳求他，求他俯允自己的请求，并怜悯他的妻子。于是他按手在她的胸部，并画了十字圣号，妇人立刻得到了医治。从那时起，神借着他显明了许多其他神迹，不仅在他生前，甚至在他去世后。
  - type: heading2
    initial:
      ru: '57.'
      cn: '57.'
    text:
      ru: Кончина Симеона столпника, и о другом столпнике, авве Иоанне.
      cn: 柱圣者西美翁的安息，以及关于另一位柱圣者阿爸约翰。
    children:
    - type: paragraph
      text:
        ru: 'В четырех милях от города Эгов стоял столпник Симеон. Пораженный молнией, он скончался. Тогда авва Юлиан столпник, стоявший близ залива, в необычное время сказал ученикам: «Положите фимиам в кадило!»'
        cn: 距埃戈夫城四英里处，站立着柱圣者西缅。他被闪电击中，便去世了。那时，站立在海湾附近的阿爸尤利安柱圣者，在一个不寻常的时刻对门徒们说：「把乳香放进香炉里！」
    - type: paragraph
      text:
        ru: – Что за причина, скажи нам, отче, – спросили ученики.
        cn: ——是什么原因，请告诉我们吧，神父，——门徒们问道。
    - type: paragraph
      text:
        ru: – Брат Симеон, живший в Эгах, скончался, пораженный молнией – и вот душа его отходит с радостию. А столпники находились один от другого на расстоянии почти двадцати четырех миль.
        cn: 住在艾盖的西缅弟兄被闪电击中逝世了——看哪，他的灵魂带着喜乐离去了。而那些柱顶隐士彼此相距近二十四英里。
  - type: heading2
    initial:
      ru: '58.'
      cn: '58.'
    text:
      ru: О том же Юлиане.
      cn: 关于同一位尤利安。
    children:
    - type: paragraph
      text:
        ru: 'Вот что еще рассказал нам авва Стефан Трихина об авве столпнике Юлиане: в его местности появился лев, пожравший многих странников и туземцев. Однажды старец приказал своему ученику Панкратию:'
        cn: 阿爸斯提凡·特里希纳还向我们讲述了关于柱圣者阿爸尤利安的以下故事：在他所在的地区，出现了一只狮子，吞噬了许多旅客和当地居民。有一天，这位长老命令他的门徒潘克拉季奥斯：
    - type: paragraph
      text:
        ru: '– Отправься за две мили отсюда к югу. Ты найдешь там лежащего льва. Скажи ему: Смиренный Юлиан именем Иисуса Христа, Сына Божия, повелевает тебе удалиться из этой местности».'
        cn: – 从这里往南两英里。你会在那里找到一只躺着的狮子。对它说：『谦卑的尤利安奉神之子耶稣基督的名，命令你离开这片区域。』
    - type: paragraph
      text:
        ru: Брат, отправившись, нашел льва. И лишь только произнес то, что ему было заповедано, лев удалился, и все прославили Бога.
        cn: 弟兄动身前往，找到了一头狮子。他刚一念出所受的吩咐，狮子就退去了，众人便颂赞了上帝。
  - type: heading2
    initial:
      ru: '59.'
      cn: '59.'
    text:
      ru: Об авве Фалалее.
      cn: 关于阿巴·塔拉莱俄斯。
    children:
    - type: paragraph
      text:
        ru: 'Пресвитер тамошней лавры авва Петр рассказал нам об авве Фалалее киликиянине, что он подвизался в иночестве шестьдесят лет и постоянно плакал, говоря: «Бог дал нам время этой жизни для покаяния и потребует от нас строгого отчета в нем».'
        cn: 当地大隐修院的长老阿爸彼得告诉我们，奇里乞亚人阿爸塔拉利乌斯在隐修生活中刻苦修行了六十年，并且常常哭泣，说：「上帝赐予我们今生的时间是为了悔改，并将就此向我们严厉追讨。」
  - type: heading2
    initial:
      ru: '60.'
      cn: '60.'
    text:
      ru: Удивительный поступок одной благочестивой женщины.
      cn: 一位虔诚女子的奇妙行为。
    children:
    - type: paragraph
      text:
        ru: 'Во время пребывания нашего в Александрии один христолюбивый человек рассказал нам следующее. Некая монахиня, говорил он, жила в своем доме, вела затворническую жизнь и, заботясь о душе своей, проводила время в постоянной молитве, посте и бдении, а также щедро подавала милостыню. Но диавол, вечно воинствующий против рода человеческого, не могши видеть такую добродетель девушки, наслал на нее напасть – он внушил одному юноше сатанинское влечение к ней. Юноша караулил ее перед домом. И вот когда монахиня хотела выйти и отправлялась из дома своего вцерковь, чтобы помолиться, юноша преграждал ей дорогу, докучая и надоедая ей, как это свойственно влюбленным, так что вскоре монахине пришлось из-за этой беды не выходить из дому. Однажды она посылает к юноше свою служанку, велев ей сказать: «Пойдем, госпожа моя хочет тебя видеть». Юноша пошел к ней, радуясь, что добился своего. Монахиня сидела за ткацким станком. Она говорит вошедшему: «Садись». Усадив юношу, девушка говорит ему: «Почтенный брат, скажи, почему ты так преследуешь меня и не даешь мне выйти из дома?». Юноша сказал в ответ: «Потому, госпожа, что действительно сильно люблю и с тех пор, как увидел тебя, весь объят пламенем». Она сказала ему: «Что же ты во мне находишь столь красивым, что так любишь меня?». Юноша говорит: «Глаза твои. Они ведь соблазнили меня». Когда монахиня услышала, что глаза ее соблазнили юношу, она схватила ткацкий челнок и выколола себе оба глаза. Подвигнутый тем, что монахиня лишилась из-за него обоих глаз, юноша удалился в Скит и тоже стал рачительным монахом.'
        cn: 当我们在亚历山大港逗留时，一个爱基督的人告诉了我们以下这件事。他说，有一位女修道士住在她自己的家里，过着隐修生活，她关爱自己的灵魂，终日祷告、禁食和守夜，并慷慨地施舍。但是魔鬼，永远与人类争战的，不能容忍这位女子如此的德行，就给她降下了一场攻击——它向一个年轻人灌输了对她撒旦般的迷恋。年轻人在她家门前守候她。当女修道士想出门，准备从家里去教堂祷告时，年轻人就会拦住她的去路，不断地纠缠她，打扰她，就像热恋中的人那样，以至于很快地，这位女修道士因为这场苦恼而不得不闭门不出。有一天，她派自己的女仆去见那年轻人，吩咐她对他说：「来吧，我的女主人想见你。」年轻人便去见她，欢喜自己终于如愿以偿。女修道士正坐在织布机前。她对进来的年轻人说：「请坐。」让年轻人坐下后，这位女子对他说：「受尊敬的弟兄，请告诉我，你为何这样纠缠我，不让我出门？」年轻人回答说：「因为，女主人，我确实深深地爱着你，自从我见到你以来，我就全身被爱火焚烧。」她对他说：「你觉得我身上有什么是如此美丽，以至于你这样爱我呢？」年轻人说：「是你的眼睛。它们引诱了我。」当女修道士听到她的眼睛引诱了那年轻人时，她抓起织布梭子，挖出了自己的双眼。受到女修道士因他而失去双眼的感召，年轻人隐退到斯基特，也成了一位勤勉的修士。
  - type: heading2
    initial:
      ru: '61.'
      cn: '61.'
    text:
      ru: Жизнь аввы Леонтия киликиянина.
      cn: 基利家地区的阿爸莱翁提奥斯的生平。
    children:
    - type: paragraph
      text:
        ru: 'Некоторые отцы передавали нам об авве Леонтии киликиянине, что он особенно усерден был к службам в обители Госпожи нашей Пресвятой Богородицы Марии, «Новой». Сорок пять лет подвизался он, не отходя от Ее храма, весь погруженный в себя самого... Рассказывали нам еще про него, что если приходил к нему бедный слепой – он сам подавал ему милостыню. Если же нищий был зрячий, то клал фолеры или на подставку колонны, или на скамейку, или на ступени храма, и оттуда брал их нищий. Один старец спросил его:'
        cn: 某些教父们曾告诉我们关于基利家修士列翁提（Leontius of Cilicia）的事，说他尤其勤勉于在我们至圣上帝之母马利亚的「新」修道院中服事。他修行了四十五年，不曾离开她的圣殿，完全沉浸于自身的默观中……关于他，人们还告诉我们，如果有一个贫穷的盲人来找他，他就会亲自施舍给他。如果乞丐是看得见的，他就会把钱（follis）放在柱基上，或放在长凳上，或放在圣殿的台阶上，乞丐就从那里取走。一位长老问他：
    - type: paragraph
      text:
        ru: – Отчего ты, отец, не подаешь из рук?
        cn: ——父亲，你为何不从手中递出？
    - type: paragraph
      text:
        ru: – Прости меня, отче, – отвечал Леонтий, – то не я подаю, но Госпожа моя Богородица, питающая меня и их.
        cn: 「请宽恕我，父亲，」 列昂季回答说，「那不是我在给予，而是我的主母上帝之母，是她养育着我和他们。」
  - type: heading2
    initial:
      ru: '62.'
      cn: '62.'
    text:
      ru: Жизнь аввы Стефана, пресвитера Илиотского.
      cn: 伊利奥特的阿爸司提反长老生平。
    children:
    - type: paragraph
      text:
        ru: 'Один старец рассказал нам следующее об авве Стефане, пресвитере лавры Илиотской. Однажды сидел он в своей келлии, и диавол внушил ему мысль: «Уйди отсюда, здесь ты не получишь пользы».'
        cn: 一个长老告诉我们以下这件事，关于伊利奥特斯修道院大院的司祭阿巴·斯特凡。有一天，他坐在自己的隐修小室里，魔鬼给他灌输了一个念头：「你离开这里吧，在这里你不会得到益处。」
    - type: paragraph
      text:
        ru: – Не послушаюсь тебя, – отвечал старец. – Я знаю, кто ты. Ты не хочешь видеть спасения кого-либо, но Христос, Сын Бога живого, сокрушит тебя.
        cn: 「我不会听从你，」长老答道，「我知道你是谁。你不想看到任何人的救恩，但基督，永生上帝的儿子，必将击碎你。」
  - type: heading2
    initial:
      ru: '63.'
      cn: '63.'
    text:
      ru: ''
      cn: ''
    children:
    - type: paragraph
      text:
        ru: 'Рассказали нам еще о нем, что он однажды сидел в своей келлии и читал, – и вот снова видимым образом, явился ему демон, и сказал:'
        cn: 我们还听说他有一次坐在自己的修道室里阅读，突然，那个魔鬼再次以可见的形式向他显现了，并说：
    - type: paragraph
      text:
        ru: – Уйди отсюда, старик, здесь тебе не будет пользы.
        cn: – 离开这里，老人，你在这里不会有益处。
    - type: paragraph
      text:
        ru: – Если, как я хорошо знаю, ты желаешь моего удаления отсюда, то вот сделай так, чтобы стул, на котором сижу, начал ходить.
        cn: – 如果，正如我深知，你希望我离开这里，那么，就请你这样做：好让我所坐的椅子开始行走。
    - type: paragraph
      text:
        ru: А сидел он на плетеном стуле. Выслушав слова старца, диавол сделал так, что заходил не только стул, но и вся келлия.
        cn: 他坐在一把藤椅上。听了长老的话，魔鬼使得不仅椅子，而且整个隐修室都摇晃起来。
    - type: paragraph
      text:
        ru: – Ловок же ты! – сказал старец, увидавши хитрость диавола. – А я все-таки отсюда не уйду.
        cn: 「你可真狡猾啊！」长老看见魔鬼的诡计，如此说道。「但我仍然不会离开这里。」
    - type: paragraph
      text:
        ru: Старец сотворил молитву, и нечистый дух исчез.
        cn: 长老作了祷告，不洁之灵就消失了。
  - type: heading2
    initial:
      ru: '64.'
      cn: '64.'
    text:
      ru: ''
      cn: ''
    children:
    - type: paragraph
      text:
        ru: 'Однажды трое старцев посетили уже упомянутого пресвитера авву Стефана. Пока они рассуждали о пользе духовной, он молчал. Старцы и говорят ему: «Ты нам ничего не отвечаешь, отец, а мы ведь пришли к тебе ради поучения». Тогда он говорит им: «Простите меня – я не слышал, о чем у вас была речь. Однако скажу, что могу. Ни ночью, ни днем я не вижу ничего, кроме распятого на кресте Господа нашего Иисуса Христа». Получив это поучение, старцы удалились.'
        cn: 有一次，三位长老拜访了那位已经提及的司祭阿爸·司提反。当他们谈论属灵益处的时候，他却一言不发。长老们便对他说：「父亲，你什么也没有回答我们，但我们到你这里来，是为了求教诲啊。」于是他对他们说：「请原谅我——我没有听清你们在谈论什么。不过我要说我能说的。无论是夜晚，还是白天，我所见的，唯有我们被钉在十字架上的主耶稣基督。」领受了这番教诲后，长老们便离开了。
  - type: heading2
    initial:
      ru: '65.'
      cn: '65.'
    text:
      ru: ''
      cn: ''
    children:
    - type: paragraph
      text:
        ru: 'Авва Иоанн, по прозванию Молива, рассказал нам о том же старце, т. е. о Стефане следующее: он очень ослаб и заболел. Тогда врачи заставили его есть мясное. У блаженного старца был в миру брат, человек благочестивой, богоугодной жизни. Однажды брат – мирянин пришел к брату – пресвитеру и, застав его за вкушением мясной пищи, смутился. Его очень огорчило то, что после великих подвигов воздержания под конец жизни брат разрешил себе мясную пищу. И вот, внезапно, в состоянии духовного восторга, он увидал пред собою незнакомца, говорившего ему: «Зачем ты соблазняешься тем, что старец вкушает мясо? Или ты не знаешь, что он делает это по необходимости и послушания ради? Воистину, тебе не следовало соблазняться. Хочешь ли видеть, какой славы достоин брат твой? – Обратись назад, и смотри». И обратившись, он увидал своего брата пригвожденным ко кресту, как Христос.'
        cn: 阿爸约翰，人称莫利瓦，向我们讲述了同一位长老，即是说，讲述了司提反的以下事迹：他身体极度虚弱，并且病了。于是医生们迫使他食用肉食。这位蒙福的长老在世俗中有一位兄弟，此人过着虔敬、蒙神喜悦的生活。有一次，这位平信徒兄弟来到身为司祭的兄弟那里，发现他正在吃肉，便感到困惑不安。他感到非常悲伤，因为他的兄弟在经过巨大的禁欲苦行之后，在生命的末了竟允许自己食用肉食。就在这时，他突然在一种属灵的狂喜状态中，看见一位陌生人出现在他面前，对他说：「你为何因这位长老吃肉而跌倒呢？难道你不知道他是出于需要和顺服才这样做的吗？确实，你本不该跌倒的。你想看看你兄弟配得怎样的荣耀吗？——请转身往后看吧。」于是他转过身来，看见他的兄弟被钉在十字架上，如同基督一样。
    - type: paragraph
      text:
        ru: – Вот какой славы сподобился брат твой! Воздай же славу Тому, Кто прославляет истинно любящих Его!
        cn: 「看哪，你的弟兄蒙受了何等的荣耀！将荣耀归于那位使真实爱祂之人得荣耀的！」
  - type: heading2
    initial:
      ru: '66.'
      cn: '66.'
    text:
      ru: Жизнь отшельника аввы Феодосия.
      cn: 隐士阿巴狄奥多西的生平。
    children:
    - type: paragraph
      text:
        ru: 'Авва Антоний, основатель и настоятель лавры Илиотской, рассказал нам об авве Феодосии молчальнике то, что слышал от него самого. «Прежде чем удалиться в пустыню, – рассказывал авва Феодосий, – в состоянии духовного восторга я видел юношу, лицо которого сияло светлее солнца. Взяв меня за руку, он сказал: пойдем, тебе предстоит состязание, и привел меня в театр, обширности которого я не могу описать. Весь театр был наполнен зрителями. Одна часть их была в белых одеждах, другие были черны, как эфиопы. Юноша привел меня на средину театра. Здесь я увидел эфиопа, необыкновенного роста: голова касалась облаков. Он был безобразен и имел вызывающий вид. Явившийся мне юноша говорит мне: вот с ним тебе предстоит борьба. При виде исполина я пришел в ужас и задрожал...'
        cn: '亚巴·安东尼，伊利奥特斯隐修院的创始人与院长，将他亲口从沉默者亚巴·费奥多西那里听到的事告诉了我们。

          「在我隐退到旷野之前，」亚巴·费奥多西讲述道，「我曾处于一种灵性狂喜的状态，看见一个少年，他的脸面比太阳还明亮。他牵着我的手，说道：来吧，你将有一场竞赛。他带我到一个剧场，其广阔我无法形容。整个剧场都坐满了观众。他们中的一部分身穿白衣，另一些则黑如埃塞俄比亚人。少年带我到剧场中央。在这里，我看见一个身高异常的埃塞俄比亚人：他的头触及云端。他面貌丑陋，且神情挑衅。显现给我的少年对我说：看，你将要与他搏斗。一见到这个巨人，我便心生恐惧，并颤抖起来……'
    - type: paragraph
      text:
        ru: – Кто же из людей с одними человеческими силами может бороться с ним?! – воскликнул я, обращая умоляющие взоры на приведшего меня юношу.
        cn: ——人类中究竟谁能单凭人自己的力量与他搏斗呢？！我惊呼道，将恳求的目光转向那领我来的青年。
    - type: paragraph
      text:
        ru: – А ты все-таки бодро выходи против него. Я буду при состязании... Сам буду Судьей и вручу тебе победный венец.
        cn: ——你仍要奋勇地迎战他。我将会在那较量中……我亲自将作审判者，并会赐给你得胜的冠冕。
    - type: paragraph
      text:
        ru: Мой противник также выступил на средину, и мы начали борьбу. Быстро явился дивный Судья и вручил мне венец. И вот – все множество эфиопов с воплем вдруг исчезли. Другая часть людей, облеченных в белые одежды, воссылали хвалы Тому, Кто помог и доставил мне славную победу».
        cn: 我的对手也走到中央，我们便开始搏斗。一位奇妙的审判者迅速显现，将冠冕授予我。于是，所有那些埃塞俄比亚人带着哀嚎突然消失了。另一群穿着白色衣裳的人，则向那位帮助了我并赐予我光荣胜利的发出颂赞。
  - type: heading2
    initial:
      ru: '67.'
      cn: '67.'
    text:
      ru: ''
      cn: ''
    children:
    - type: paragraph
      text:
        ru: Об этом же авве Феодосии молчальнике поведал нам ученик его авва Кириак, что он тридцать пять лет провел в уединении, причем постился по два дня и хранил совершенное молчание – не говорил ни с кем. Если же хотел что-либо сказать, выражал это знаками. И мне довелось увидеть его в лавре Илиотской, потому что я прожил в ней десять лет.
        cn: 关于这位默言者阿爸费奥多西，他的门徒阿爸基里亚克告诉我们，他独居了三十五年，持续禁食两天，并保持完全的静默——不与任何人说话。如果他想说什么，就用手势表达。我也曾有幸在伊里奥特大修道院见到他，因为我在那里住了十年。
  - type: heading2
    initial:
      ru: '68.'
      cn: '68.'
    text:
      ru: ''
      cn: ''
    children:
    - type: paragraph
      text:
        ru: Авраамий, настоятель киновии Пресвятой Богородицы Марии «Новой», рассказал нам об этом авве Феодосии, что у него не было зимнего плаща, и он купил ему. Однажды, прикрывшись им, старец заснул, а спал он при храме. Пришли разбойники, сняли с него плащ и ушли. И старец ничего не сказал об этом.
        cn: 亚布拉米，新圣母玛利亚隐修院的院长，告诉我们关于这位教父西奥多西的事。说他没有一件冬季斗篷，于是他给他买了一件。有一天，这位长老盖着斗篷睡着了，他睡在圣堂旁边。强盗们来了，拿走了他的斗篷就走了。而这位长老对此一言未发。
  - type: heading2
    initial:
      ru: '69.'
      cn: '69.'
    text:
      ru: Жизнь аввы Палладия и солунского затворника Давида.
      cn: 阿爸帕拉迪奥斯与帖撒罗尼迦隐修者大卫的生平。
    children:
    - type: paragraph
      text:
        ru: 'Вместе с господином софистом Софронием, еще до отречения его от мира, прибыли мы в Александрию, к авве Палладию. Этот боголюбивый муж и раб Божий имел свой монастырь в Лифазомене. Мы просили его сказать нам назидание, и старец начал говорить нам: «Чада, временная жизнь наша кратка: будем недолгое время здесь подвизаться и трудиться, чтобы удостоиться великих благ в вечности! Посмотрите на мучеников, посмотрите на святых, посмотрите на подвижников: как они были мужественны! Их хорошо знали минувшие века – мы также не перестаем никогда удивляться им. И кто бы ни слышал об них – изумляется терпению блаженных мучеников: – терпению, превышающему силы человеческие. Чего только не претерпели они! Одним выкалывали глаза, другим перебивали голени; одним отрубали руки, другим – ноги. Одних скоро пожирало пламя, других сожигали на медленном огне. Топили их в реках и в морских пучинах. Иных, как злодеев, живых терзали кровожадные звери, других, после всевозможных мук, по смерти пожирали хищные птицы. Словом – нельзя ни вообразить, ни пересказать все виды мук, каким враг диавол подвергал боголюбезных мучеников и подвижников. Но с каким мужеством и терпением они подвизались, торжествуя силою духа над немощью плоти! И вот теперь они получили награды за свои подвиги, несравненно большие, чем ожидали. Своими подвигами они оправдывают несокрушимую веру, во-первых, в то, что, пострадав здесь короткое время, можно достигнуть вечных благ, во-вторых, – что врага можно одолеть: сверхчеловеческие муки, которым враг наш диавол подвергал их, мужественно перенесены. Таким образом, если и мы перенесем все скорби и пребудем тверды в испытаниях, то воистину «други Божии» будем, Сам Бог будет споборствовать нам и преизлиха воздаст нам за подвиг... Мы знаем, каких трудов требует настоящая жизнь: испытаем самих себя в безмолвии! Прежде всего, нам необходимо искреннее раскаяние, чтобы сделаться храмами Божиими, потому что великая награда ожидает нас в вечности...»'
        cn: 与智者索弗罗尼先生一同，甚至在他弃绝世界之前，我们抵达了亚历山大，去见长老帕拉狄乌斯。这位敬爱上帝的男子和上帝的仆人在利法佐门拥有他的修道院。我们请求他给我们一些训诲，这位长老便开始对我们说：「孩子们，我们这暂时的生命是短暂的：我们将在世上短暂地挣扎和劳作，好能配得在永恒中获得极大的福祉！看看殉道者们，看看圣徒们，看看苦修者们：他们是何等勇敢啊！过去的时代对他们了如指掌——我们也从不停止对他们的惊叹。凡是听闻他们事迹的人，都会惊叹于那些蒙福殉道者的忍耐——那种超越人类力量的忍耐。他们忍受了多少苦难啊！有人被挖出眼睛，有人被打断小腿；有人被砍断手臂，有人被砍断双腿。有人被火焰迅速吞噬，有人被慢火焚烧。他们被投入江河湖海的深渊中溺毙。有人像恶徒一样，活生生地被嗜血的野兽撕裂，另一些人，在遭受了各种折磨之后，死后又被猛禽吞食。简而言之，仇敌魔鬼让那些蒙上帝喜悦的殉道者和苦修者所遭受的所有种类的苦难，是无法想象，也无法言说的。然而，他们以何等的勇气和忍耐进行苦修，凭着灵的力量战胜了肉体的软弱！而现在，他们已经获得了因其苦修而得的奖赏，远远超出他们所期望的。他们的苦修证实了坚不可摧的信仰，首先，在这里短暂受苦，便能获得永恒的福祉；其次，仇敌是可以被战胜的：我们的仇敌魔鬼让他们遭受的超乎人能承受的苦难，他们都勇敢地忍受了。因此，如果我们也能忍受一切苦难，并在试炼中坚定不移，那么我们必将真正成为『上帝的朋友』，上帝自己会与我们并肩作战，并会为我们的苦修超额地回报我们……我们知道今生需要怎样的劳苦：让我们在静默中省察自己吧！首先，我们需要真诚的忏悔，以便成为上帝的殿堂，因为在永恒中，有极大的奖赏等待着我们……」
    - type: paragraph
      text:
        ru: «Вспомним о Том, – продолжал старец, – Кто не имел, где главу преклонить... Скорбь, по слову Апостола порождает терпение, – сказал еще старец, – сделаем наш дух причастным царствия небесного...    Чада, не будем любить мира, ни того, что в мире... Будем хранить себя от помыслов, – сказал в заключение старец, – это – спасительное средство ко спасению...»
        cn: 「让我们回想那位，」长者继续说道，「祂没有枕首之处……照着使徒所言，苦难生忍耐，」长者又说，「让我们使我们的灵成为天国的有份者……孩子们，我们不要爱世界，也不要爱世界上的事……我们要谨防意念，」长者最后说道，「这是通往救恩的救赎之方……」
    - type: paragraph
      text:
        ru: – Сделай милость, отче, скажи нам, зачем, по каким побуждениям принял ты иночество? – спросили мы.
        cn: – 请您慈悲，父啊，请告诉我们，您为何，是出于何种动因接受了修道生活？ – 我们问道。
    - type: paragraph
      text:
        ru: '– В моем отечестве, – старец был из Фессалоник, – за три версты от городской стены жил отшельник, родом из Месопотамии, по имени Давид. То был муж весьма добродетельный, любвеобильный и строгой жизни. Он провел в затворничестве около семидесяти лет. Однажды ночью военная стража охраняла стены города от варваров. Воины стояли на стене, обращенной к той стороне, где в затворе жил старец. Вот и видят воины в одну ночь, что огонь исходит из всех окон келлии. Вообразив, что варвары подожгли келлию старца, лишь только рассвело, они бросились к келлии и, найдя, что старец – невредим и келлия цела, остановились в изумлении. В следующую ночь воины снова видят огонь в келлии старца – и это повторялось потом не раз. Необычайное явление стало известно всему городу и всей той стране, так что многие проводили ночи на стене, чтобы видеть дивный огонь. Явление продолжалось до самой кончины старца. Я сам видел это чудо не раз и не дважды, а много раз. И сказал я сам себе: если и в этом еще мире Бог прославляет рабов Своих столь великой славой, что же будет в грядущем веке, когда лице их просияет, как солнце? Вот, чада мои, это и было поводом к тому, что я принял иноческий образ.'
        cn: '——在我的家乡——这位长老来自塞萨洛尼基——离城墙三俄里处住着一位名叫达维德的隐士，他原籍美索不达米亚。他是一位品德高尚、充满爱心、生活严谨的人。他在隐修中度过了大约七十年。


          一天夜里，军方守卫正在城墙上防范野蛮人入侵。士兵们站在面向长老隐修处的那段城墙上。在一个夜晚，士兵们看到，火焰从修道室的所有窗户里冒出来。他们以为野蛮人点燃了长老的修道室，天一亮，他们就冲向修道室，却发现长老安然无恙，修道室也完好无损，他们惊奇不已。接下来的夜晚，士兵们再次看到长老修道室里的火焰——这之后重复发生了很多次。这一非凡现象传遍了整个城市和整个地区，许多人因此在城墙上彻夜守候，只为亲眼目睹那奇妙的火焰。这一现象一直持续到长老去世。我本人也曾多次，而非一两次，亲眼目睹这一神迹。


          我对自己说：如果在这个世上，上帝就以如此大的荣耀来彰显祂的仆人，那么在将来的世代，当他们的面容像太阳一样发光时，又将是怎样一番景象呢？看哪，我的孩子们，这正是我接受修士形象的缘由。'
  - type: heading2
    initial:
      ru: '70.'
      cn: '70.'
    text:
      ru: Жизнь затворника Адолы.
      cn: 隐修者阿多拉的生平
    children:
    - type: paragraph
      text:
        ru: Вот что еще рассказывал нам старец. После аввы Давида пришел некий инок, по имени Адола, также родом из Месопотамии. Поселившись в окрестностях города затворником в кленовом дупле, он устроил себе оконце, чрез которое и говорил с приходившими к нему. Однажды во время варварского нашествия та местность подверглась страшному погрому. Варвары случайно проходили мимо затворника. Увидав выглянувшего из оконца старца, один из варваров извлек меч и замахнулся, чтобы поразить отшельника, но его простертая рука вдруг осталась без движения. При виде этого чуда пораженные изумлением остальные варвары поверглись пред старцем с мольбою. Сотворив молитву, старец исцелил наказанного и отпустил их с миром.
        cn: '长老还给我们讲述了以下这件事。


          在阿巴·达维德之后，来了一位名叫阿多拉的隐修士，他同样来自美索不达米亚。他在城郊定居下来，作为一名隐修者，住在一棵枫树的树洞里，并在树洞上开了一个小窗，通过这个小窗与来访者交谈。有一次，在野蛮人入侵期间，那一带地区遭受了可怕的洗劫。这些野蛮人偶然路过这位隐修者。他们看到一位长老从窗户里探出头来，其中一个野蛮人拔出剑，并挥舞着，想要击打这位隐修者，但他的手伸出去后，突然僵住了，一动不动。看到这个神迹，其余的野蛮人震惊不已，都俯伏在长老面前，恳求不已。长老作了祷告，医治了受惩罚的人，并平安地让他们离开了。'
  - type: heading2
    initial:
      ru: '71.'
      cn: '71.'
    text:
      ru: Поучение от разбойника.
      cn: 强盗的教诲。
    children:
    - type: paragraph
      text:
        ru: 'Снова тот же авва Палладий рассказывал нам: в Фиваидской области, в городе Арсиноэ схвачен был убийца. После многих пыток он приговорен был к отсечению головы. Его нужно было отвести для казни за шесть миль (15 нем. мили) от города – на то место, где он совершил убийство. Вместе с другими за осужденным шел монах – посмотреть на его казнь. Идя на казнь, преступник увидал монаха.'
        cn: 再次，阿巴·帕拉迪乌斯向我们讲述：在底比斯地区的阿西诺厄城，一名杀人犯被抓获。经过多番拷打，他被判处斩首。他需要被带到城外六英里（15德里）之外——也就是他犯下谋杀罪的地方——接受处决。一名僧侣与其他人一同跟在被判刑的人后面，去观看他的行刑。在前往行刑的路上，罪犯看见了那位僧侣。
    - type: paragraph
      text:
        ru: – Отче, должно быть, у тебя нет ни келлии, ни рукоделия!?
        cn: – 父啊，想必你既没有小室，也没有手作吧！
    - type: paragraph
      text:
        ru: – Прости меня, брат, – возразил инок. – У меня есть и келлия и занятие.
        cn: ——请原谅我，兄弟，——修道士反驳道，——我既有斗室，也有差事。
    - type: paragraph
      text:
        ru: – Так что ж ты не сидишь в келлии и не предаешься сокрушению о грехах? – спросил осужденный.
        cn: ——那么你为什么不待在隐室里，不专注于痛悔己罪呢？——被定罪者问道。
    - type: paragraph
      text:
        ru: – Правда твоя, брат мой! – отвечал инок. Я вовсе не забочусь о душе своей. Потому-то и иду посмотреть на твою казнь, чтобы, хотя чрез это прийти в сокрушение.
        cn: 「你说得真对，我的弟兄！」修士回答道，「我根本不顾念我的灵魂。正是因此，我才去观看你的处决，以便至少借着这个生出痛悔。」
    - type: paragraph
      text:
        ru: '– Ступай-ка лучше, отче, – сиди в своей келлии и благодари Бога-Спасителя нашего: после того как, вочеловечившись, Он умер за нас, человек уже не умирает вечною смертию.'
        cn: 你最好还是去吧，神父，坐在你的修士室里，感谢我们的救主上帝：因为祂在道成肉身并为我们而死之后，人就不再承受永恒的死亡了。
  - type: heading2
    initial:
      ru: '72.'
      cn: '72.'
    text:
      ru: О старике-убийце, оклеветавшем юношу-христианина.
      cn: 关于那诬蔑了青年基督徒的杀人老者。
    children:
    - type: paragraph
      text:
        ru: 'Авва Палладий рассказал нам также следующее: один старик-мирянин задержан был за убийство. Во время пытки, по Александрийским законам, он заявил, что у него был еще сообщник в убийстве. Тот, на кого указывал старик, был юноша лет двадцати. И тот и другой подвергнуты были большим истязаниям. Старик продолжал стоять на своем: «Ты был со мною при совершении убийства!» Юноша не признавался: и в убийстве он не участвовал, и с ним вместе не был. После многих пыток они оба были присуждены к виселице. Их отвели за пять миль от города, на обычное место казни. В одной стадии от города находились развалины храма Крона (Сатурна). По прибытии на место казни толпы и воины пожелали, чтобы первым повешен был юноша. Бросившись к ногам воинов, юноша вскричал:'
        cn: 帕拉迪乌斯长老也向我们讲述了以下这件事：一位年迈的平信徒因谋杀被捕。在严刑拷问期间，按照亚历山大港的法律，他声称他还有一个谋杀同伙。老人所指认的那个人，是一个二十岁左右的青年。两人都遭受了巨大的折磨。老人坚持己见：「你与我一同参与了这起谋杀！」青年拒不承认：他既没有参与谋杀，也没有和那老人在一起。经过多次严刑拷问后，两人都被判处绞刑。他们被带到离城五英里之外，惯常的行刑地点。离城一斯塔迪昂处，有克洛诺斯（萨图尔努斯）神庙的废墟。抵达行刑地后，人群和士兵都希望先绞死那青年。青年扑倒在士兵脚下，大喊道：
    - type: paragraph
      text:
        ru: – Ради Господа, сделайте милость – повесьте меня лицом к востоку, так чтобы мне смотреть в ту сторону, когда буду висеть.
        cn: ——为了主的缘故，请您行个方便——把我面朝东方吊起来，好让我在被吊起来的时候能朝那个方向看去。
    - type: paragraph
      text:
        ru: – Зачем это? – спросили воины.
        cn: – 这有什么用？ – 战士们问道。
    - type: paragraph
      text:
        ru: – Ох, милостивые государи, не прошло и семи месяцев, как я, несчастный, удостоился св. крещения и стал христианином.
        cn: 哦，诸位仁慈的阁下，我这不幸之人，蒙受圣洗并成为基督徒至今，尚未满七个月。
    - type: paragraph
      text:
        ru: 'Это признание до слез тронуло воинов. Между тем старик затрясся от злобы и громко крикнул:'
        cn: 这个告白感动得战士们流下了眼泪。与此同时，老人因愤怒而颤抖，并大声喊道：
    - type: paragraph
      text:
        ru: – Ради Сераписа, повесьте меня лицом к Крону!
        cn: — 凭塞拉皮斯，把我吊起来，脸朝着克洛诺斯！
    - type: paragraph
      text:
        ru: 'Тогда воины, услыхав это богохульство, оставили юношу и сперва повесили старика. Лишь только они покончили со стариком, как вдруг прискакал всадник, посланный наместником Египта (августалием):'
        cn: 那时，士兵们听到这亵渎神明的话，就撇下少年，并首先绞死了老人。他们刚绞死老人，突然一个骑兵飞奔而来，他是受埃及总督（奥古斯塔利斯）派遣的：
    - type: paragraph
      text:
        ru: – Юношу не велено казнить. Возвратите его обратно!
        cn: – 未奉命处决这青年人。将他送回去！
    - type: paragraph
      text:
        ru: Воины и народ чрезвычайно обрадовались этому и, вернувшись с юношей, представили его в судилище, откуда он был освобожден августалием. Получив спасение сверх ожидания, юноша сделался иноком. Мы записали это для пользы многих.
        cn: '士兵和民众对此欣喜若狂，他们带着这少年回来，将他呈报给法庭，他在那里被奥古斯塔利斯释放了。


          这少年在意料之外获得拯救后，便成了一名修士。我们记录下此事，是为了许多人的益处。'
  - type: heading2
    initial:
      ru: '73.'
      cn: '73.'
    text:
      ru: Жизнь воина Иоанна.
      cn: 战士约翰生平。
    children:
    - type: paragraph
      text:
        ru: 'И это рассказ аввы Палладия: в Александрии был воин, по имени Иоанн. Он вел следующий образ жизни: каждый день с утра до девятого часа сиживал он в монастыре близ входа во храм св. Петра. Он был одет во вретище и плел корзинки, все время молчал и совсем ни с кем не разговаривал. Сидя у храма, он занимался своей работой и только одно возглашал с умилением: «Господи,...от тайных моих очисти мя(Пс. 18:13), да не постыжуся в молитве». Произнеся эти слова, он снова погружался в продолжительное молчание... И затем снова, по прошествии часа и более, повторял то же восклицание. Так он возглашал раз семь в течение дня, ни слова не говоря ни с кем. В девятом часу он снимал вретище и одевался в воинские одежды т.е. в свою хламиду, и шел к месту своей службы. С ним я пробыл около восьми лет и нашел много назидания и в его молчании и в его образе жизни.'
        cn: 这是阿巴·帕拉迪乌斯的记述：在亚历山大城，有一位名叫约安的战士。他过着以下的生活方式：每天从清晨直到第九时，他总是坐在修道院里，靠近圣彼得教堂的入口处。他穿着麻衣，编织篮子，一直沉默不语，完全不与任何人交谈。他坐在教堂旁，做着自己的工作，只带着虔敬呼喊一句话：「主啊，求你使我脱离隐而未现的过犯（诗篇 18:13），免得我在祷告中蒙羞。」说完这些话，他又再次沉浸在长时间的沉默中……然后再次，过了一个多小时后，他会重复同样的呼喊。他这样呼喊在一天当中重复七次，不与任何人说一句话。到了第九时，他脱下麻衣，穿上军装，即他的军袍，然后前往他的服役地点。我与他相处了大约八年，并从他的沉默和他的生活方式中得到了许多教益。
  - type: heading2
    initial:
      ru: '74.'
      cn: '74.'
    text:
      ru: Плоды ересей.
      cn: 异端的果实。
    children:
    - type: paragraph
      text:
        ru: 'Вразумляя нас однажды, старец говорил нам: «Поверьте мне, чада! Расколы и ереси ни к чему другому не ведут во святой Церкви, как только к ослаблению любви к Богу и ближнему».'
        cn: 有一次，长老教导我们说：「请相信我，孩子们！裂教和异端在圣教会中，只会削弱对上帝和邻人的爱。」
  - type: heading2
    initial:
      ru: '75.'
      cn: '75.'
    text:
      ru: Небесный покров.
      cn: 天上的覆庇。
    children:
    - type: paragraph
      text:
        ru: 'Этот же авва Палладий рассказал нам, когда мы посетили его в другой раз, такое: жил в Александрии некий христолюбец, весьма богобоязненный, сострадательный и гостеприимный к монахам; была у него весьма смиренная жена, которая всякий день наблюдала пост, и дочь около шести лет. Однажды христолюбец этот отправился в Константинополь; ведь он был купцом. И вот, оставив в доме жену, дочь и одного раба, он пошел в гавань. Перед тем как ему уйти, чтобы сесть на корабль, жена говорит: «Кому ты нас поручаешь, господин?» Муж отвечает ей: «Владычице нашей Богородице». Как-то, когда жена сидела за работой, а девочка была подле нее, раб по наущению диавола решил убить женщину и девочку, взять их добро и бежать. И вот, принеся из кухни нож, он направился в столовую, где сидела госпожа его. Как только раб дошел до двери столовой, его поразила слепота, и он не мог добраться ни до столовой, ни до кухни. В течение часа он ударами понуждал себя двинуться с места и, наконец, стал кричать госпоже: «Пойди сюда». А она удивилась, что раб, не входя к ней, стоит в дверях и кричит, и говорит ему: «Лучше ты иди сюда», – не зная, что он ослеп. Раб стал заклинать ее, чтобы она подошла, она же поклялась, что не подойдет к нему. Тут раб говорит ей: «Пошли мне хотя бы девочку». Она не сделала и этого, сказав: «Если хочешь, иди сам». Тогда раб, так как был совсем беспомощен, ударил себя ножом и рухнул замертво. Госпожа его, увидев, что случилось, подняла крик. Сбежались соседи, а вскоре пришли и люди из претории; они застали раба еще живым, и все от него узнали, и прославили Господа, явившего чудо и спасшего мать и дитя ее.'
        cn: '这位亚巴·帕拉迪奥斯也告诉我们，当我们再一次拜访他时，他说了下面这件事：在亚历山大城住着一位爱基督的人，他非常敬畏上帝，富有怜悯心，并且对修士们很热情好客。他有一个非常谦卑的妻子，每天都守斋，还有一个大约六岁的女儿。


          有一次，这位爱基督的人去了君士坦丁堡；因为他是一名商人。于是，他把妻子、女儿和一名仆人留在家里，自己去了港口。在他上船离开之前，妻子对他说：「主人，你把我们托付给谁呢？」丈夫回答她：「托付给我们的大主宰上帝之母。」


          有一天，当妻子正在做工，小女孩在她身边时，仆人受到魔鬼的诱惑，决定杀死女人和女孩，夺走她们的财物，然后逃跑。于是，他从厨房拿了一把刀，走向餐厅，他的女主人正坐在那里。仆人刚走到餐厅门口，就被失明击中了，他既无法进入餐厅，也无法回到厨房。在一个小时里，他跌跌撞撞地想挪动脚步，最终开始对女主人喊：「你过来！」她很惊讶仆人没有进来，而是站在门口喊叫，便对他说：「你最好过来。」她并不知道他已经失明了。仆人开始恳求她过去，但她发誓不走过去。仆人于是对她说：「至少把小女孩送过来给我。」她连这个也没有做，说：「如果你想，自己过来吧。」于是，仆人因为完全无助，用刀刺伤了自己，倒地而死。


          她的女主人看到发生的一切，便大声呼喊。邻居们都跑了过来，不久，行省总督府的人也来了；他们发现仆人还活着，并从他那里得知了所有的事情，于是赞美了显现神迹并拯救了母亲及其孩子的上主。'
  - type: heading2
    initial:
      ru: '76.'
      cn: '76.'
    text:
      ru: Потопление Марии грешницы.
      cn: 罪女马利亚的沉没。
    children:
    - type: paragraph
      text:
        ru: 'Вот что еще рассказал нам тот же авва Палладий. Хозяин одного корабля лично передавал ему, что ему нужно плыть с пассажирами обоего пола. Вышли в море. Между тем как другие корабли благополучно поплыли: одни – в Константинополь, другие – в Александрию, третьи – в иные места – и для всех были попутные ветры, – мы одни только не могли тронуться в путь и простояли неподвижно на одном месте целых 15 суток. Уныние и даже отчаяние овладели всеми. В особенности я, как хозяин корабля, сокрушался и о судьбе судна, и о пассажирах. И обратился я с молитвою к Богу. И вот однажды слышится мне голос кого-то незримого мною: «Брось в море Марию – и совершишь благополучно свое плавание!» Долго я размышлял в недоумении: что это значит? Кто такaя эта Мария? И вот снова тот же голос: «Я сказал тебе, брось в море Марию – и вы спасетесь!» Среди размышлений об этом я вдруг вскрикнул: «Мария!»  Я ведь и не знал никакой Марии. Женщина, лежавшая на своем ложе, отозвалась на мое восклицание и спросила:'
        cn: 同一位帕拉迪阿长老还告诉我们以下这件事。有一艘船的主人亲自告诉他，说他需要载着男女乘客出海。他们出海了。然而，当其他船只都顺利航行，有的去了君士坦丁堡，有的去了亚历山大，还有的去了其他地方，并且都得了顺风时，唯独我们不能启程，整整15天停在原地不动。沮丧甚至绝望攫住了所有人。尤其是我，作为船主，既为船只的命运，也为乘客而悲痛。于是我向上帝祷告。忽然有一天，我听见一个我看不见的人的声音说：「把玛利亚扔进海里——你就会顺利完成你的航程！」我困惑不解地思索了许久：这是什么意思？这个玛利亚是谁？忽然又是同样的声音说：「我告诉你，把玛利亚扔进海里——你们就会得救！」在我思考此事的时候，我忽然喊了一声：「玛利亚！」我根本不认识任何玛利亚。一个躺在她床上的女人应声我的呼喊，并问道：
    - type: paragraph
      text:
        ru: – Сделай милость, подойди сюда! – сказал я ей.
        cn: ——劳驾，到这边来！——我对她说道。
    - type: paragraph
      text:
        ru: 'Та встала и подошла. Удалившись от других, я обратился к ней со следующими словами:'
        cn: 她站起身走了过来。我避开众人，对她说了以下的话：
    - type: paragraph
      text:
        ru: – Видишь ли, сестра Мария, какой я грешник – и все вы погибнете из-за меня.
        cn: ——你看，玛利亚姊妹，我是何等大的一个罪人——你们都将因我而丧亡。
    - type: paragraph
      text:
        ru: – Нет, господин мой, это я – грешница, – глубоко вздохнув, произнесла она.
        cn: ——不，我的大人，我才是罪人，——她深深地叹了口气，说道。
    - type: paragraph
      text:
        ru: – Какие же у тебя грехи?
        cn: – 你都有什么罪呢？
    - type: paragraph
      text:
        ru: – Увы, нет греха, которого бы я не совершила, и за мои-то грехи и вы все погибнете...
        cn: ——唉，没有我没有犯过的罪，正是因为我的罪，你们也都要灭亡……
    - type: paragraph
      text:
        ru: 'После этого она мне поведала следующее: «Я, государь мой, несчастная – была за мужем, и у меня было двое детей: одному исполнилось девять лет, другому – пять. Муж мой скончался, и я осталась вдовою. Неподалеку от меня жил воин, и мне захотелось, чтобы он взял меня в жены. Я сама подсылала к нему кое-кого». Воин ответил: «Я не желаю брать за себя женщину, у которой есть дети от другого мужа». Узнав, что он не желает взять меня за себя из-за детей, но вместе с тем любя его, я, несчастная, зарезала своих детей и объявила ему: «Вот, теперь у меня нет никого!» Узнав о моем поступке с детьми, воин воскликнул: «Жив Господь Бог мой, Иже на небесех! Не возьму я ее за себя!» Испугавшись того, как бы ни открылось мое злодеяние, и, боясь смерти, я бежала. Выслушав рассказ женщины, я, однако, медлил и не решался бросить ее в море. Дай, думаю, еще сделаю опыт:'
        cn: 此后她向我讲述了以下内容：「我，我主，不幸的我——曾有过一位丈夫，并育有两个孩子：一个九岁，一个五岁。我的丈夫去世了，我成了寡妇。在我附近住着一位战士，我渴望他娶我为妻。我亲自派人去他那里。战士回答说：『我不愿娶一个与前夫有孩子的女人。』当我得知他因我的孩子而不愿娶我，然而我爱他，不幸的我，宰杀了我的孩子们，并对他说：『看啊，现在我一无所有了！』当战士得知我对孩子们所作的恶行时，他惊呼道：『我的主上帝是永活的，祂在天上！我绝不会娶她！』我害怕我的恶行被揭发，并害怕死亡，于是我逃走了。」听完这女人的叙述，然而，我迟疑了，不忍心将她扔进海里。我想，让我再做一次尝试：
    - type: paragraph
      text:
        ru: – Смотри, – говорю ей. – Вот я войду в лодку, и если корабль поплывет – знай, что мои грехи причиной его стоянки.
        cn: 「——你看，」我对她说，「——我这就进船，如果船开了——你要知道，是我的罪孽导致它停滞不前。」
    - type: paragraph
      text:
        ru: 'Зову матроса, и говорю ему: «Спусти лодку!»'
        cn: 我叫水手，对他说：「放下小船！」
    - type: paragraph
      text:
        ru: 'Схожу в лодку – и ничего: ни корабль, ни лодка не двигаются с места. Тогда, взойдя на корабль, обращаюсь к женщине: «Сойди-ка ты теперь в лодку». Та исполнила мое требование, и в ту же минуту лодка закружилась и, повернувшись раз пять, пошла ко дну. Между тем корабль понесся с такой быстротой, что в три дня мы совершили плавание, которое продолжалось обыкновенно пятнадцать дней.'
        cn: 我下到小船里——然而什么也没有发生：大船和小船都纹丝不动。于是，我登上大船，对一位女子说：「你现在就下到小船里去。」她照办了我的要求，就在那一刻，小船打起转来，旋转了五次之后，便沉入了水底。与此同时，大船以如此快的速度疾驰而去，以至于我们在三天之内就完成了通常需要十五天才能完成的航程。
  - type: heading2
    initial:
      ru: '77.'
      cn: '77.'
    text:
      ru: О том, как три слепца лишились зрения.
      cn: 关于三个盲人如何失明。
    children:
    - type: paragraph
      text:
        ru: 'Однажды, вместе с господином Софронием, мы пришли в дом софиста Стефана, чтобы заняться с ним. Было около полудня. Он жил близ храма Пресвятой Богородицы, именуемой «Дорофеи». Храм был воздвигнут блаженным папою Евлогием. На наш стук в дверь выглянула отроковица и сказала нам: «Он еще спит. Подождите немного». Тогда я говорю господину Софронию: «Пойдем на Тетрапил и там посидим». Местность Тетрапила в большом уважении у александрийцев. Говорят, что основатель города Александр, взявши из Египта останки пророка Иеремии, похоронил их там. Придя туда, мы никого не нашли, кроме троих слепцов; было, как уже сказано, около полудня. Молча и не говоря ни слова, мы подсели к слепцам со своими книгами в руках. Слепцы вели беседу между собой, и один из них говорит другому:'
        cn: 有一次，我们和索弗罗尼先生一同来到诡辩家斯特凡的家中，为了和他一起学习。当时大约是中午。他住在一个靠近名为「多萝西」的至圣圣母教堂的地方。这座教堂是由蒙福的教宗欧洛基乌斯建造的。当我们敲门时，一个年轻女孩探出头来，对我们说：「他还在睡觉。请稍等片刻。」于是我对索弗罗尼先生说：「我们去四门塔，在那里坐一会儿吧。」四门塔的区域在亚历山大人中备受尊重。人们说，这座城池的建立者亚历山大将先知耶利米的遗骸从埃及带来，并葬在那里。我们来到那里，除了三位盲人之外，没有发现任何人；正如之前所说，当时大约是中午。我们默默地、一言不发地走到盲人身边坐下，手中拿着我们的书。盲人们正在彼此交谈，其中一位对另一位说：
    - type: paragraph
      text:
        ru: – Как ты ослеп?
        cn: ——你是怎么瞎的？
    - type: paragraph
      text:
        ru: – В молодости я был матросом, – отвечал собеседник. – Мы плыли из Африки, и в море я вдруг разболелся глазами, так что не мог и ходить. У меня на глазах появились бельма, и я ослеп.
        cn: – 我年轻时是个水手，– 那位对话者答道。– 我们从非洲航行，在海上我的眼睛突然病了，以至于我无法行走。我的眼睛上长了白翳，我就失明了。
    - type: paragraph
      text:
        ru: – А ты как ослеп? – спросил тот же слепец другого товарища по несчастию.
        cn: – 你是如何失明的？ – 同一位盲人问了他另一位难友。
    - type: paragraph
      text:
        ru: – Я был стекольщиком по ремеслу – отливал стекла. Брызги попали мне в глаза – и я ослеп.
        cn: – 我是玻璃匠出身——我熔铸玻璃。飞溅物溅入我眼中——我就失明了。
    - type: paragraph
      text:
        ru: – Ну, а ты сам, каким образом потерял зрение? – спросили оба слепца первого.
        cn: ——那么，你自己又是怎么失明的呢？——两位盲人问第一个人。
    - type: paragraph
      text:
        ru: '– Сказать вам по правде, – отвечал тот, – в молодости я ненавидел труд, к тому же был и мот. Дошло до того, что мне нечего было есть, и я принялся за воровство. Однажды, уже совершив много преступлений, я стал на площади. Смотрю – хоронят покойника, роскошно разодетого. Иду за процессией, чтобы заметить место погребения. Обошлицерковьсв. Иоанна и, положив покойника в склепе, разошлись. Тогда я, оставшись один, вхожу в склеп. Сняв с покойника все одежды, я оставил на нем только один саван. (Собственно полотно, в которое было обернуто тело). Я уже собирался выйти, много забрав, как дурная привычка моя шепнула мне: прихвати-ка и саван, он из дорогой материи. Вот я и вернулся – на горе себе! Как только снял я саван, обнажив совершенно мертвеца, вдруг он встает прямо передо мною и простирает обе руки ко мне... Ощупав пальцами мое лицо, он вырвал мне глаза. Тогда я, несчастный, бросив все, с большою горестью и с ужасом ушел из могилы. Вот и я вам рассказал, как я ослеп... Выслушав это, господин Софроний кивнул мне головою. Мы поднялись и отошли от них.'
        cn: ——说句实话，那人答道，——我年轻时憎恶劳作，而且挥霍无度。以至于我无以为食，便开始盗窃。有一天，在我犯下许多罪行之后，我站在广场上。我看到人们正在安葬一位逝者，他穿着华丽的寿衣。我跟在送葬队伍后面，以便记下安葬地点。他们绕过了圣约翰教堂，将逝者放入墓穴后便散去了。那时，我独自一人，进入墓穴。我扒下逝者所有的衣物，只在他身上留下了一件寿衣。（就是裹着遗体的布料）。我正要离开，已经拿走了很多东西，这时我的恶习低声对我说：把寿衣也拿走吧，它是用昂贵的布料做的。于是我便折返回去——给自己招致了祸患！我刚一取下寿衣，完全暴露了尸体，他突然在我面前站起来，并向我伸出双手……他用手指摸索着我的脸，然后挖出了我的双眼。那时，我这个不幸的人，丢下所有东西，怀着巨大的悲痛和恐惧离开了墓穴。这就是我告诉你们的，我是如何失明的……索弗罗尼先生听完此话，向我点了点头。我们站起身来，离开了他们。
    - type: paragraph
      text:
        ru: – Ну, достопочтенный авва, – сказал он мне, – сегодня мы не будем более заниматься, потому что получили хороший урок.
        cn: ——好啦，可敬的阿爸，——他对我说道，——今天我们不再继续了，因为我们已经得到了一个好教训。
    - type: paragraph
      text:
        ru: Получив назидание, мы записали это, чтобы и вы, узнав об этом, извлекли себе пользу. Сущая правда, что никто, творящий злое, не скроется от очей Божиих. А рассказ этот мы сами слышали из уст пострадавшего.
        cn: 获得此教诲后，我们将其记录下来，好让你们在得知此事后，也能从中受益。千真万确，凡作恶的，无人能逃过上帝的眼目。而这个故事，乃是我们亲耳从受苦者口中听来的。
  - type: heading2
    initial:
      ru: '78.'
      cn: '78.'
    text:
      ru: Изумительное чудо умершей девицы, удержавшей грабителя и не отпускавшей его, пока тот не дал обещания стать иноком.
      cn: 已故少女拦住强盗并拒绝松手，直至他许诺成为修士的惊人神迹。
    children:
    - type: paragraph
      text:
        ru: 'Авва Иоанн, игумен монастыря Гигантов, поведал нам, когда мы пришли к нему в Теополь, также и следующее: недавно пришел ко мне какой-то юноша и сказал: «Бога ради прими меня. Я хочу покаяться». Он говорил это с великими слезами. Видя, как юноша подавлен и опечален, я говорю ему: «Скажи мне, какова причина такого твоего сокрушения?» Он говорит мне: «Поистине, авва владыка, я много грешен». Вновь я говорю ему: «Верь мне, дитя, сколь ни много есть разных грехов, столь же много и целительных средств. Если хочешь получить исцеление, расскажи мне по правде свои проступки, чтобы я наложил подходящие для них наказания. Ведь прелюбодеи врачуется так, убийца иначе, смешивающий яды – опять по-другому, для сребролюбца тоже свое средство». Юноша стал громко жаловаться и бить себя в грудь – слезы и стенания завладели им – и от сильного смущения сердца он не мог говорить. Когда я увидел, что юноша в беспомощности и несказанной печали не может открыть свое страдание, я говорю ему: «Дитя, послушай меня, напряги немного ум свой, расскажи, что ты совершил, и Господь наш Иисус поможет тебе. Ведь по неизреченному человеколюбию и безмерному милосердию своему он все претерпел ради нашего спасения – знался с мытарями, не погнушался блудницы, не отверг разбойника, был другом грешникам, а затем принял крестную муку; радостно примет он в длани свои и тебя, если ты раскаешься и обратишься, ибо не хочет смерти грешника, но, чтобы грешник обратился от пути своего и жив был». Тогда, превозмогши себя и немного сдержав слезы, он говорит мне: «Я, авва владыка, исполнен всяческого греха и недостоин ни небес, ни земли: два дня назад я услышал, что дочь одного из первых людей в этом городе, еще девушка, умерла, и ее схоронили в гробнице поодаль от города и положили с нею множество одежд. Услышав это – ведь подобные нечестивые дела были мне знакомы – я пошел ночью к гробнице и стал снимать с девушки одежды, и снял все, что на ней было, не пощадив даже последнего хитона; я совлек и его и оставил девушку голой, какой она была при рождении. Когда я уже собирался выйти из гробницы, девушка вдруг приподнялась, вытянутой левой рукой схватила меня за правую и говорит мне: «Человек, зачем тебе было обнажить меня? Разве ты не боишься Бога? Не страшишься грядущего суда и воздаяния? Разве не обязан чтить во мне мертвую? Разве не уважаешь нашу общую с тобой природу? Как же ты, будучи христианином, допустил, чтобы я нагой предстала пред Христом, не устыдившись, что я женщина? Разве не женщина родила тебя? Разве во мне ты не оскорбил мать свою? Какой ответ, несчастнейший из людей, ты дашь за меня перед грозным судом Христовым? Ведь пока я была жива, никто чужой не видел лица моего, а ты, когда я умерла и погребена, совлек с меня одежды и увидел мое обнаженное тело. О человеческая природа, в какую бездну зла ты низверглась! С каким сердцем, и с какими руками ты приступишь к святому телу и крови Господа нашего Иисуса Христа?» Слыша и видя это, я устрашился и испугался и, весь дрожа, с трудом вымолвил: «Отпусти меня, более я такого не сделаю». Она говорит мне: «Когда захотел, ты вошел сюда, но отсюда ты не выйдешь, когда захочешь – эта гробница будет нам общей. Не надейся умереть сразу: после многодневных страданий ты в мучениях отдашь свою исполненную зла душу». Я же со слезами молил ее отпустить меня, клянясь всемогущим Богом впредь отстать от этого нечестивого и беззаконного дела. Тогда, после долгих моих просьб и слез, она говорит мне в ответ: «Если хочешь жить и избавиться от ожидающей тебя муки, дай мне слово, что, если я отпущу тебя, ты не только отступишься от этого своего позорного и гнусного ремесла, но сейчас же не медля отречешься мира, и станешь монахом, и покаешься в содеянном, и будешь служить Христу». Я поклялся ей, говоря: «Я сделаю не только, что ты мне сказала, но уже сегодня не вернусь в дом свой и прямо отсюда пойду в монастырь». Тогда девушка говорит мне: «Одень меня, как я была одета». Когда я ее убрал, она вновь упала мертвой. Тотчас я, несчастный грешник, вышел из гробницы и пришел сюда». Услышав это от юноши и укрепив его речами о покаянии и воздержании, я затем постриг его в монахи. Облаченного в иноческое одеяние, я затворил юношу в одной из горных пещер в городе, а он воздавал великую благодарность Богу и с той поры подвизался о спасении души своей.'
        cn: '阿巴·约安，巨人修道院的院长，当我们在特奥波利斯拜访他时，也向我们讲述了以下这件事：最近有个年轻人来到我这里说：「看在上帝的份上，请接纳我。我想要悔改。」他说这话时泪流不止。


          看到这个年轻人如此沮丧和忧伤，我对他说：「告诉我，你如此悔悟的原因是什么？」他对我说：「阿巴长老，我罪孽深重。」


          我再次对他说：「孩子，相信我，罪恶虽多，但医治之道也多。如果你想要得到医治，就如实告诉我你的过犯，好让我施加合适的惩罚。因为奸淫者这样医治，杀人者那样医治，投毒者又另当别论，贪财者也有自己的办法。」


          年轻人开始大声哀号并捶打自己的胸膛——泪水和呻吟完全控制了他——他的心极度困惑，以致无法言语。当我看到年轻人无助地，带着难以言喻的悲伤，无法吐露他的苦痛时，我对他说：「孩子，听我说，集中一点心神，告诉我你做了什么，我们的主耶稣会帮助你。因为凭着他那无法言喻的仁爱和无量的慈悲，他为我们的救赎忍受了一切——他与税吏为伍，不嫌弃妓女，不拒绝强盗，是罪人的朋友，然后又承受了十字架的痛苦；如果你悔改回头，他也会欣然地把你接到他的手中，因为他不愿罪人死亡，却愿罪人回头改过得以存活。」


          于是，他强忍住自己，稍稍止住泪水，对我说道：「阿巴长老，我罪孽深重，不配得天，不配得地：两天前我听说这个城里一位显赫人家的小姐，一个年轻的女孩，去世了。人们把她安葬在城外不远处的墓穴里，并放了许多衣服陪葬。我听到这事——因为我过去就常做这种不敬虔的事——便在夜里去了墓穴，开始脱去那女孩的衣服，脱掉了她身上所有的衣物，连她最后一件内衣都没有放过；我也把那件内衣剥了下来，让她赤身裸体，就像她出生时一样。当我正要走出墓穴时，那个女孩突然坐了起来，伸出左手抓住我的右手，对我说：『人啊，你为什么要剥光我的衣服？难道你不敬畏上帝吗？难道你不害怕将来的审判和报应吗？难道你不应该尊重我这个死者吗？难道你不尊重我们与你共享的人性吗？你作为一个基督徒，怎么能让我赤身裸体地站在基督面前，不以我是女人为耻呢？难道不是女人把你生下来的吗？难道你这不是在羞辱你的母亲吗？你这个人啊，最不幸的人，你在基督那可畏的审判台前，将如何为我辩护呢？要知道，当我活着的时候，没有任何外人见过我的面容，而你，当我死去并被埋葬后，却剥光了我的衣服，看到了我赤裸的身体！哦，人性啊，你堕入了何等邪恶的深渊！你将怀着怎样一颗心，用怎样一双手，去领受我们主耶稣基督的圣体和宝血呢？』


          听到和看到这一切，我感到惊恐万分，全身颤抖，艰难地挤出几个字：『放了我吧，我再也不会做这种事了。』她对我说：『你想来就来了这里，但你想走却走不了——这座墓穴将成为我们共有的居所。别指望立刻死去：你将在多日的苦难之后，在折磨中交出你这充满罪恶的灵魂。』我流着泪恳求她放了我，并向上帝发誓，从今以后绝不再做这种不敬虔和不法的事。于是，在我长时间的恳求和泪水之后，她回答我说：『如果你想活下去，并摆脱那等待你的折磨，那就给我一个承诺：如果我放了你，你不仅要放弃你这可耻和卑鄙的行径，而且要立即毫不迟疑地与世俗决裂，成为一名修士，为你所做的一切悔改，并侍奉基督。』我向她发誓说：『我不仅会照你所说的去做，而且今天就离开我的家，直接从这里去修道院。』于是，那个女孩对我说：『把我穿戴好，就像我原来穿的那样。』当我为她穿好衣服后，她又一次倒地死去。随即，我这个不幸的罪人便走出了墓穴，来到这里。」


          听了年轻人这番话，我又用关于悔改和节制的话语来坚固他，然后我就为他举行了剃度礼，使他成为一名修士。我让他穿上修士的袍服，把他关在城里的一处山洞中，而他则向上帝献上极大的感谢，从那时起，他为拯救自己的灵魂而奋斗不懈。'
  - type: heading2
    initial:
      ru: '79.'
      cn: '79.'
    text:
      ru: Чудодействующая сила св. Евхаристии.
      cn: 圣体血施神迹的力量
    children:
    - type: paragraph
      text:
        ru: 'Прибыв в Селевкию, близ Антиохии, мы встретились с епископом города, аввою Феодором. Он рассказал нам о следующем событии, происшедшем при его предшественнике на епископской кафедре – блаженном Дионисии. Жил там богатый купец, человек весьма богобоязненный. Он держался ереси Севера, но у него был слуга, принадлежавший к святой кафолической и апостольской Церкви. По обычаю страны, в св. четверток он принял св. дары. Завернув их в чистое полотно, положил в свой шкап. После св. Пасхи купцу понадобилось по торговым делам послать слугу в Константинополь. Тот отправился, но, позабыв про св.дары, оставил их в своем шкапу, а ключ вручил хозяину. Однажды хозяин, отомкнув шкап, нашел полотно с находившимися там св. дарами. Смутившись, он не знал, как ему поступить. Принять их он не решался, не принадлежа к кафолической Церкви. Так на этот раз он и оставил их в шкапу, рассудив, что его слуга, возвратившись, примет их. Но пришел снова св. день Великого четверга, а слуга еще не возвратился. Тогда хозяин решился предать огню св. дары, чтобы они не остались еще на год. Отворив шкап, он видит, что все св. частицы произрастили стебли и колос... Страх и трепет объяли его при виде нового и необычайного чуда. Взяв св. Дары, он, громко вопия: «Господи, помилуй!» – со всем домом немедленно поспешил в храм к св. епископу Дионисию. Это столь великое и страшное, превосходящее всякий ум и понимание, чудо видели не двое, или трое, или немногие, но все собрание: горожане и поселяне, туземцы и пришельцы, путешествующие по суше и плавающие по морю, мужчины и женщины, старые и малые, юноши и старцы, господа и рабы, богатые и бедные, власти и подвластные, образованные н невежды, духовенство, девственники и подвижники, вдовцы и в браке живущие, правители и народ – все восклицали: «Господи, помилуй!» – и каждый взывал по своему, прославляя Бога. Все благодарили Бога за неизреченное и недомыслимое знамение. Многие, уверовав после чуда, присоединились ко святой кафолической и апостольской Церкви.'
        cn: '抵达安提阿附近的塞琉基亚时，我们见到了城里的主教，阿巴·费奥多尔。他向我们讲述了以下事件，发生在他的前任主教，蒙福者狄奥尼修斯在位期间。那里住着一位富有的商人，一个非常敬畏上帝的人。他持守着塞维鲁的异端，但他有一个仆人，属于神圣、至公和宗徒的教会。按照当地的习俗，他在圣周四领受了圣礼。他把它们用洁净的细麻布包好，放在自己的柜子里。圣复活节之后，商人因商业事务需要派仆人去君士坦丁堡。仆人去了，但忘记了圣礼，把它们留在了自己的柜子里，而把钥匙交给了主人。


          一天，主人打开柜子，发现了那块装着圣礼的细麻布。他感到困惑，不知该如何处理。他不敢领受它们，因为他不属于至公教会。于是这一次他便把它们留在柜子里，心想他的仆人回来后会领受它们。但圣周四的日子再次来临了，仆人却还没有回来。于是主人决定将圣礼付之一炬，以免它们再留存一年。打开柜子，他看到所有的圣体粒子都长出了茎和麦穗……当他看到这新奇而异乎寻常的神迹时，恐惧和战栗攫住了他。他拿起圣礼，大声呼喊：「主啊，怜悯我！」——便立刻带着全家赶往圣主教狄奥尼修斯的圣堂。


          这个如此伟大而可畏，超越一切理智和理解的神迹，不是两三个人，也不是少数人看到了，而是全体会众：市民和乡民、本地人和外来者、陆路旅行者和海路航行者、男人和女人、老人和小孩、青年人和老年人、主人和奴仆、富人和穷人、权贵和属下、有知识的和无知的、神职人员、贞洁者和苦修者、鳏夫和已婚者、统治者和百姓——所有人都呼喊：「主啊，怜悯我！」——每个人都以自己的方式呼求，赞美上帝。所有人都感谢上帝，为了这不可言喻、不可思议的征兆。许多人在神迹之后相信了，加入了神圣、至公和宗徒的教会。'
  - type: heading2
    initial:
      ru: '80.'
      cn: '80.'
    text:
      ru: Об источнике в Скопеле, явившемся по молитве аввы Феодосия.
      cn: 关于斯科派洛斯岛上，因阿爸提奥多西祷告而显现的泉源。
    children:
    - type: paragraph
      text:
        ru: 'Мы пришли в монастырь аввы Феодосия в Скопеле. Монастырь стоит на горе между прибрежной Селевкией и Россом Киликийским. Отцы этого монастыря повели нас еще выше на гору, на расстояние полета стрелы. Там указали нам на источник и сказали: «Этот обильный и прекрасный источник дан нам Богом. Воистину, он не от природы, но – дар Божий. Святой и великий отец наш Феодосий много постился и изливал, с коленопреклонением, источники слез, прося, чтобы Бог дал на наше утешение и употребление эту воду. Раньше отцы добывали воду из горного потока, но Бог, всегда исполняющий желания боящихся Его, даровал нам благословение воды сей по молитвам отца нашего. За два года пред сим некоторые из братии просили игумена, чтобы дозволил им построить в монастыре баню. Авва с неудовольствием выслушал эту просьбу, однако уступил, снисходя к слабости братии. Баня была выстроена, но всего только раз успели вымыться в ней, как источник богодарованной воды иссяк. И сказать вам правду: много мы постились и много молились со слезами, но воды не было. Целый год вода в источнике не показывалась, и мы много скорбели. Но когда отец наш разрушил баню, Бог снова дал нам воду».'
        cn: 我们来到了位于斯科佩利的阿瓦·菲奥多西乌斯修士院。这修士院坐落在一座山上，介于沿海的塞琉西亚和奇里乞亚的罗斯之间。这修士院的教父们带领我们往山上更高处走，约一箭之遥。他们在那里向我们指明了一处泉水，并说：「这股丰沛而美好的泉水是上帝赐予我们的。它确实并非出于自然，而是上帝的恩赐。我们圣洁而伟大的教父菲奥多西乌斯多次禁食，并跪下，流下泉涌般的泪水，祈求上帝赐予这水，作为我们的慰藉和使用。从前，教父们从山溪取水，但上帝，祂总会应允敬畏祂之人的愿望，因着我们教父的祷告，赐予我们这水的祝福。在此两年前，一些修士请求住持，允许他们在修士院里建造一座澡堂。阿瓦修士不悦地听取了这项请求，然而还是让步了，体恤修士们的软弱。澡堂建成了，但在里面只洗了一次澡，那上帝所赐的泉水就干涸了。老实告诉你们：我们多次禁食，并流泪多次祷告，但都没有水。一整年，泉水都没有再出现，我们为此深感悲痛。但当我们的教父拆毁了澡堂后，上帝就再次赐予我们水了。」
  - type: heading2
    initial:
      ru: '81.'
      cn: '81.'
    text:
      ru: О кладезе, в котором явилась вода, по чудотворной силе образа св. Феодосия.
      cn: 关于藉圣提奥多西圣像之神迹之力而现出水的水泉。
    children:
    - type: paragraph
      text:
        ru: 'Вот что еще рассказали нам отцы. «На днях, – говорили они, – одна христолюбивая женщина, из страны апамейской, рыла колодезь. Много она издержала и дорылась до большой глубины, но воды не нашла. На нее напало уныние: ей жаль было и напрасных трудов и денег. Однажды видит она незнакомца, который говорит ей: «Пошли и вели принести изображение аввы Феодосия из монастыря в Скопеле, и Бог, по его молитве, даст тебе воду». Женщина немедленно отрядила двоих, и, приняв из рук их образ святого, опустила его в колодезь. И тотчас показалась вода, наполнившая цистерну до половины. Те, кто вынули икону из воды, принесли и нам, и мы пили и прославили единодушно Бога».'
        cn: 教父们还给我们讲述了这样一件事：「他们说，前些日子，一位来自阿帕米亚地区的爱基督的女子，正在挖井。她花费甚多，挖得很深，却没有找到水。忧愁袭上心头：她为徒劳的辛劳和白费的金钱感到惋惜。有一天，她看见一位陌生人，他对她说：『你去，吩咐人从斯科佩尔的修道院取来阿爸提奥多西的圣像，上帝就会因他的祷告，赐给你水。』那女子立刻派了两个人去，并从他们手中接过圣人的圣像，将它放入井中。于是立刻有水涌出，灌满了水池的一半。那些将圣像从水中取出的人也把水带给了我们，我们喝了，并同心合意地赞美了上帝。」
  - type: heading2
    initial:
      ru: '82.'
      cn: '82.'
    text:
      ru: Жизнь старца Иоанна в Скопеле.
      cn: 长老伊奥安在斯科佩洛斯的生平。
    children:
    - type: paragraph
      text:
        ru: 'В том же монастыре мы видели старца, по имени Иоанн. Отцы этого места говорили нам про него: подлинно, христиане, велик этот старец и страшен демонам. Кто бы ни пришел, будучи одержим нечистым духом, он каждому дарует исцеление.'
        cn: 在同一个修道院里，我们看见了一位名叫约翰的长老。这个地方的教父们对我们说起他：「确实，基督徒们，这位长老是伟大的，并且令邪魔生畏。无论是谁，只要是被不洁之灵附着而来，他都赐予每个人医治。」
  - type: heading2
    initial:
      ru: '83.'
      cn: '83.'
    text:
      ru: Чудесная помощь отшельника Иоанна.
      cn: 隐士约翰奇妙的帮助。
    children:
    - type: paragraph
      text:
        ru: 'Вот еще что слышали мы от отцов этого места. В двадцати четырех милях от монастыря есть гавань, по прозванию «Малый мыс». В этой гавани хозяин одного корабля вместимостью в тридцать тысяч модий желал его спустить в море. Целых две недели пробился он с тремястами рабочих, трудившихся ежедневно, но не мог не только спустить корабля в море, но даже сдвинуть с места. Это было дело злых людей. В большом унынии и горе – хозяин не знал уже, на что ему решиться. По Божию устроению, старец пришел в то место. Корабелыцик, хорошо его знавший, увидав его, сказал:'
        cn: '我们还从本地教父们那里听到了以下事情：


          在距离修道院二十四英里处，有一个港口，人称「小海角」。在这港口里，一位船主有一艘容量为三万莫迪的船，他想把它下水。他与三百名工人，每天劳作，整整挣扎了两周，但不仅未能将船下水，甚至连挪动它也做不到。这是恶人所为。他陷入极大的沮丧和悲痛之中，船主已经不知道该怎么办了。蒙上帝安排，一位长老来到了那个地方。造船师很了解这位长老，见到他后说：'
    - type: paragraph
      text:
        ru: – Отче, помолись о корабле моем, от чародейства корабль мой не может быть спущен в море.
        cn: 「父啊，请为我的船祷告，我的船因为邪术无法下海。」
    - type: paragraph
      text:
        ru: – Поди и приготовь мне пищи, а Бог тебе поможет.
        cn: 你去给我预备食物，而上帝会帮助你的。
    - type: paragraph
      text:
        ru: 'Старец сказал это с целью удалить корабельщика в его дом. Тогда старец один вошел в корабль и, повергшись трижды пред Богом, осенил корабль так же три раза крестным знамением во имя Господа нашего Иисуса Христа. Придя после того в дом хозяина корабля, сказал ему:'
        cn: 长老说这话，是为要打发船主回家。于是长老独自一人上了船，在上帝面前三次俯伏后，奉我们主耶稣基督之名，也三次用十字圣号为船祝福。之后，他来到船主家中，对他说：
    - type: paragraph
      text:
        ru: – Ступай и спусти корабль свой в море.
        cn: – 去吧，并将你自己的船下入海中。
    - type: paragraph
      text:
        ru: Поверив старцу, корабельщик только с немногими отправился к кораблю. Стали спускать, и вот корабль – на море! И все воздали хвалу Богу.
        cn: 相信了长老，船夫只带着少数几个人前往船只。他们开始下水，看哪，船就在海上了！所有人都赞美了上帝。
  - type: heading2
    initial:
      ru: '84.'
      cn: '84.'
    text:
      ru: Жизнь и смерть одного отшельника, раба Божия.
      cn: 一个隐修士的生与死，上帝的仆人。
    children:
    - type: paragraph
      text:
        ru: В той же обители отцы рассказали нам об одном отшельнике, жившем в близлежащих горах. Этот отшельник был велик в очах Божиих и много лет провел в уединении, питаясь травою. Скончался он в малой пещере, и мы не знали об этом, решивши, что он удалился в другую пустыню. Однажды ночью он является во сне настоящему отцу нашему, благостному и досточтимому пастырю, авве Юлиану.
        cn: 在同一修道院里，教父们告诉我们一位隐士的事迹，他住在附近的山中。这位隐士在上帝眼中是伟大的，他多年隐居，以野草为食。他逝世于一个狭小的洞穴中，我们对此并不知情，以为他已前往另一处旷野。一天夜里，他显现在梦中，给我们的现任院长，圣善可敬的牧者亚威·尤利安。
    - type: paragraph
      text:
        ru: '– Возьми несколько человек братии, – сказал явившийся, – и ступай – принеси меня сюда из того места, где я лежу, на горе, под названием «Олень». Взяв несколько человек, отец наш пошел к указанной горе. Много часов мы проискали, но не нашли останков отшельника, так как вход в пещеру с течением времени закрылся от сучьев и снега. После тщетных поисков старец сказал нам: «Пойдемте, чада, сойдем с горы». Лишь только мы начали спускаться, как вдруг подошел олень и, остановившись недалеко от нас, начал ногами рыть землю. При виде этого, отец наш говорит нам: «Поверьте мне, чада, здесь лежит раб Божий!» И, расчистив вход, мы нашли тело его невредимым. Принесли в обитель и там похоронили.'
        cn: '——「带上几位弟兄，」那显现者说，「去，从我躺着的地方，在一座名为『鹿』的山上，把我带到这里来。」


          我们的父带上几位弟兄，前往那座指明的山。我们寻找了许多小时，但没有找到隐士的遗骸，因为洞穴的入口随着时间的推移被树枝和雪堵住了。在徒劳的搜寻之后，长老对我们说：「孩子们，我们下山吧。」我们刚开始下山，一头鹿突然走了过来，停在我们不远处，开始用蹄子刨土。看到这一幕，我们的父对我们说：「孩子们，相信我，上帝的仆人就躺在这里！」于是，我们清理了入口，找到了他完好无损的身体。我们把他带回修道院，并在那里安葬了他。'
  - type: heading2
    initial:
      ru: '85.'
      cn: '85.'
    text:
      ru: О проросшей пшенице, за прекращение раздачи милостыни.
      cn: 论发芽的麦子，由于停止施舍。
    children:
    - type: paragraph
      text:
        ru: 'Вот что еще рассказали нам: у нас в обители наблюдался следующий обычай: во св. и великий четверток сходились в обитель из той страны бедные и сирые и получали по полмодия пшеницы, по пяти благословенных хлебов, по секстарию вина и по полсектарию меда. За три года пред тем случился большой неурожай пшеницы, так что она продавалась за два модия. Настал великий пост. Некоторые из отцов сказали нашему игумену:'
        cn: 此外，他们还告诉我们：在我们的修道院里，有以下习俗：在圣周四这一神圣而隆重的日子，来自那个地区的贫苦无依之人会聚集到修道院里，领取半摩迪的小麦，五个受祝福的面包，一塞克斯塔里乌斯的葡萄酒，和半塞克斯塔里乌斯的蜂蜜。在那三年之前，小麦严重歉收，以至于它卖到了两个摩迪的价钱。大斋期到了。几位教父对我们的修道院院长说：
    - type: paragraph
      text:
        ru: – Сделай милость, отче, отложи на этот раз обычную раздачу бедным, чтобы не оскудела братия монастыря, так как нигде нет пшеницы.
        cn: ——求您，父亲，这一次请暂缓对穷人的惯常分发吧，以免修道院的修士们匮乏，因为各地都没有小麦了。
    - type: paragraph
      text:
        ru: – Не станем, чада, нарушать благословения отца нашего, – начал было возражать авва. – Вы знаете заповедь старца, нам не следует преступать ее. Воистину он сам позаботится о нас.
        cn: 「阿瓦刚要反驳道：『孩子们，我们不要违背我们父亲的祝福。你们知道长老的诫命，我们不应违犯它。诚然，他自己会照顾我们。』」
    - type: paragraph
      text:
        ru: 'Но братия продолжали упорно стоять на своем:'
        cn: 但弟兄们仍固执己见：
    - type: paragraph
      text:
        ru: – Нам самим не хватит, и нечего давать нам.
        cn: ——我们自己都不够用，也没什么可给的了。
    - type: paragraph
      text:
        ru: – Что ж, сказал игумен, – глубоко опечаленный, – будь по-вашему. Делайте, как знаете.
        cn: —— 那么，院长深深地忧伤着说，—— 就按你们说的办吧。你们就照你们所知道的去做吧。
    - type: paragraph
      text:
        ru: 'Так и не роздали милостыни ни в св. четверток, ни в св. пятницу. Заведующий пшеницей вскоре пошел туда и, войдя, увидал, что пшеница вся проросла. И пришлось ее побросать в море. Тогда стал нам говорить авва:'
        cn: 他们最终也未曾在圣周四或圣周五分发施舍。负责管理小麦的人很快去了那里，进去后，他看见小麦全都发芽了。并且不得不将其全部扔进海里。于是，长老开始对我们说：
    - type: paragraph
      text:
        ru: '– Вот и поделом приходится переносить кару нарушителям заповеди отца нашего. Пожинайте теперь плоды непослушания! Всего только пятьсот модий мы должны были раздать – и угодили бы своим послушанием отцу нашему Феодосию и бедных братий своих утешили бы. А теперь что   же? Погибло у нас пшеницы около пяти тысяч модий... Какую же пользу получили мы, чада? Поистине причинили себе сугубый вред: первое – нарушили заповедь отца нашего; второе – понадеялись не на Бога, но на пшеницу. Научимся, братия, из этого опыта, что есть Бог, пекущийся о всем человеческом роде, и что св. Феодосий невидимо заботится о нас, своих чадах.'
        cn: ——这便是我们这些违背我们父亲诫命的人，理所应当地承受的惩罚。如今，你们收割不顺从的果子吧！我们本只需分发五百莫迪的量——我们就能以顺从取悦我们的父亲提奥多西，并能安慰我们贫困的弟兄们。可现在呢？我们损失了大约五千莫迪的小麦……孩子们，我们又得到了什么益处呢？事实上，我们给自己造成了双倍的伤害：首先——我们违背了我们父亲的诫命；其次——我们没有仰赖上帝，而是仰赖小麦。弟兄们，让我们从这次经历中吸取教训，认识到有一位眷顾全人类的上帝，并且圣提奥多西也无形地关怀着我们这些他的孩子们。
  - type: heading2
    initial:
      ru: '86.'
      cn: '86.'
    text:
      ru: Об отшельнике, скончавшемся по принятии св. Причащения.
      cn: 论一位在领受圣餐后逝世的隐修士。
    children:
    - type: paragraph
      text:
        ru: 'Фома из Эгов рассказал нам: я вышел из Эгов после праздника. Стояла страшная стужа. Я зашел в монастырь аввы Феодосия в Скопеле. При мне произошло там следующее: в той местности жил отшельник питавшийся травою. По воскресным дням он приходил в монастырь и причащался Св. Таин. Однажды отшельник, придя в соблазн, целых пять недель не являлся, вопреки своему обычаю, в монастырь. Иноки были этим опечалены. Во время моего пребывания в монастыре, в воскресный день он, наконец, пришел туда. Увидав его, отцы монастыря возрадовались и, пав пред ним, просили прощения. Пал и он пред ними, и затем облобызались. И приняв пречистое тело и кровь Господа нашего Иисуса Христа, отшельник лег посреди церкви и тотчас скончался, вовсе не болевши. Отцы монастыря поняли тогда, что отшельник предузнал свою кончину. Потому-то он и пришел в монастырь, чтобы отойти ко Господу, примирившись со всеми».'
        cn: 埃戈夫的托马告诉我们：「我节期之后从埃戈夫出来。严寒凛冽。我进入了斯科佩勒阿巴狄奥多西的修道院。我在那里时发生了以下的事：在那片地区住着一位以草为食的隐士。每逢主日，他会来到修道院并领受圣奥秘。有一次，那位隐士受到诱惑，整整五周都没有像往常一样出现在修道院。僧侣们为此感到忧伤。在我逗留修道院期间，在一个主日，他终于来到了那里。看到他后，修道院的教父们欢喜雀跃，并且俯伏在他面前请求原谅。他也俯伏在他们面前，之后他们彼此亲吻。隐士领受了我们主耶稣基督的至洁圣体和宝血之后，便躺倒在教堂中央，随即安息了，他完全没有生病。修道院的教父们那时便明白了，那位隐士预知了自己的死期。所以他才来到修道院，为了与众人和解之后，归向上主。」
  - type: heading2
    initial:
      ru: '87.'
      cn: '87.'
    text:
      ru: Обретение тела отшельника Иоанна «Смиренного».
      cn: 寻获隐士约安『谦卑者』的遗体。
    children:
    - type: paragraph
      text:
        ru: Пришли мы в селение за шесть миль от Росса. Два мирских старца приняли нас в храме. Селение стояло у подошвы горы. В храме они указали нам каменную плиту.
        cn: 我们来到离罗斯六英里远的一个村庄。两位平信徒长者在教堂里接待了我们。村庄坐落于山脚下。在教堂里，他们向我们指明了一块石板。
    - type: paragraph
      text:
        ru: – В этой гробнице, христиане, покоится великий отшельник, – сказали старцы.
        cn: 「在这墓中，基督徒们啊，安息着一位伟大的隐士，」长老们说。
    - type: paragraph
      text:
        ru: – Откуда вы знаете об этом? – спросили мы.
        cn: ——你们是怎么知道这件事的？——我们问道。
    - type: paragraph
      text:
        ru: '– Семь лет тому назад жители этого селения стали замечать по ночам на вершине горы свет, как бы от огня. Не звери ли это? – думали мы. – Несколько дней мы наблюдали это. Однажды мы взошли на вершину и не нашли никакого знака: ни света, ни чего-либо опаленного в лесу. Снова ночью видим тот же свет... Так в течение трех месяцев – огни... Однажды мы взяли несколько человек... Ночью, с оружием в руках, на случай встречи со зверями, приходим на вершину горы, на место, где появлялся свет, и остаемся там до утра. Утром усматриваем небольшую пещеру: из нее-то и являлся свет. Входим в пещеру и видим умершего отшельника. На нем была власяница из козьей шерсти и плащ из пальмовых листьев. В руках у него было серебряное Распятие. При нем – хартия, на которой было написано: «Я, смиренный Иоанн, скончался пятнадцатого индикта». Сообразивши время, мы нашли, что кончина его последовала за семь лет, а он был точно скончавшийся только сегодня. Подняв его, мы принесли и похоронили в церкви.'
        cn: ——七年以前，这个村庄的居民们开始注意到夜里在山顶上出现光亮，好像是火光。「是不是野兽呢？」——我们想道。我们观察着这光亮几天。有一天，我们登上山顶，却没有发现任何迹象：没有光亮，也没有任何在林中被烧焦的东西。夜晚再次，我们看到同样的光亮……就这样持续了三个月——那些火光……有一天，我们带了几个人……夜里，我们手持武器，以防遇到野兽，来到山顶上光亮出现的地方，一直待到天亮。早上，我们发现了一个小洞穴：光亮正是从那里发出的。我们走进洞穴，看到一位已故的隐修士。他穿着一件山羊毛的苦行衣和一件棕榈叶做的斗篷。他手里拿着一个银制的受难十字架。在他身边有一张羊皮纸，上面写着：「我，谦卑的约安，在第十五个因狄克特年去世。」估算时间后，我们发现他的安息已经过去了七年，而他看起来就像是今天才刚安息的。我们抬起他，将他带到并安葬在教堂里。
  - type: heading2
    initial:
      ru: '88.'
      cn: '88.'
    text:
      ru: Жизнь аввы Фомы и чудодействие его тела по смерти.
      cn: 阿爸福马的生平及其死后身体的神迹作为。
    children:
    - type: paragraph
      text:
        ru: Мы прибыли в Феополь. Один пресвитер тамошней Церкви рассказал нам о некоем авве Фоме. Он был апокрисиарием киновии, что в Апамее. Однажды по монастырским нуждам пришел он в Феополь. Замедлив здесь, он скончался в Дафне, в храме св. Евфимии. Клирики того места похоронили его, как странника, на месте погребения странных. На следующий день погребли там же одну женщину, повыше его. Это было во втором часу. Около девятого часа земля выбросила покойницу. Жители были удивлены этим происшествием... Потом к вечеру снова похоронили ее в той же могиле, а на следующий день нашли труп ее опять вне могилы. Взяли тело покойницы и похоронили в другой могиле. Спустя несколько дней похоронили еще одну женщину над иноком, еще не сообразив, что он не дозволяет хоронить над собою женщин. Когда и эту земля не приняла, тогда только уразумели, что старец не желает этого. Доложили обо всем патриарху Домнину, и тот распорядился, чтобы все граждане со свечами шли в Дафну и с пением псалмов перенесли останки св. мужа. Его похоронили в усыпальнице, где покоилось много останков св. мучеников, а над его гробницей устроена была небольшая часовня.
        cn: 我们抵达提奥波利斯。当地教会的一位长老告诉我们关于一位阿爸托马斯的事迹。他是阿帕梅亚某共有修道院的特使。有一次，他因修道院事务来到提奥波利斯。在此逗留期间，他在达芙涅的圣欧菲米娅教堂去世。那里的神职人员将他安葬，把他当作一位异乡人，安葬在安葬异乡人的地方。第二天，他们也在那里安葬了一位妇女，在她之上。这发生在第二时辰。大约第九时辰，土地抛出了这位亡者。居民们对这件事感到惊讶……后来到了傍晚，他们再次将她安葬在同一个墓穴里，而第二天发现她的尸体再次在墓穴之外。他们取走了亡者的遗体，安葬在另一个墓穴里。几天之后，他们又安葬了一位妇女在这位修士之上，仍未明白他不容许妇女安葬在他之上。当土地也不接受这位妇人时，这时才明白这位长者不希望如此。他们将一切告知宗主教多姆宁，而他吩咐所有的公民手持蜡烛前往达芙涅，并唱着诗篇迁移这位圣人的遗骸。他被安葬在一座陵寝里，那里安息着许多圣殉道者的遗骸，而在他的墓穴上方建造了一座小型礼拜堂。
  - type: heading2
    initial:
      ru: '89.'
      cn: '89.'
    text:
      ru: Обретение тела на горе Аманской.
      cn: 阿曼山遗体的寻获
    children:
    - type: paragraph
      text:
        ru: 'В Феополе один из отцов поведал нам: однажды по некоторой надобности взошел я на гору Аман и нашел там пещеру. Войдя в нее, нашел отшельника, склонившегося на колена, с руками, простертыми к небу. Волосы, ниспадая с головы его, касались земли. Полагая, что он жив, я поклонился ему со словами: «Помолись обо мне, отче»! Ответа не было. Тогда я приблизился к нему, чтобы приветствовать его, но, дотронувшись, увидал, что он уже мертв... Отойдя немного, вижу другую пещеру, вхожу и нахожу в ней старца.'
        cn: 在提奥波利斯，一位教父告诉我们：有一次，因某种需要，我登上了阿曼山，并在那里找到一个山洞。进去后，我发现一位隐士跪着，双手伸向天空。他的头发从头上垂下，触及地面。我以为他还活着，便向他鞠躬并说道：「请为我祈祷，父亲！」没有回应。于是我走近他，想要问候他，但是，当我触摸到他时，我看到他已经死了……走开不远，我看到另一个山洞，我走了进去，并在里面发现一位长老。
    - type: paragraph
      text:
        ru: – По добру ли пришел, брат? Заходил ли в другую пещеру к старцу?
        cn: ——是为着善意而来吗，弟兄？你到另一座山洞去拜访过那位长老了吗？
    - type: paragraph
      text:
        ru: – Да, отче…
        cn: – 是的，父…
    - type: paragraph
      text:
        ru: – Получил ли что-нибудь там?
        cn: – 你在那里收到什么了吗？
    - type: paragraph
      text:
        ru: – Нет....
        cn: – 不……
    - type: paragraph
      text:
        ru: – Да, уж пятнадцать лет прошло, как старец скончался. А между тем он был в таком состоянии, как будто почил не более как за час.
        cn: ——是的，这位长老去世已经十五年了。然而，他的状态仿佛安息还不到一个小时。
    - type: paragraph
      text:
        ru: Старец совершил обо мне молитву, и я удалился, славя Бога.
        cn: 长老为我做了祷告，我就离开了，赞美着上帝。
  - type: heading2
    initial:
      ru: '90.'
      cn: '90.'
    text:
      ru: Смерть двух отшельников.
      cn: 两位隐修士的离世。
    children:
    - type: paragraph
      text:
        ru: 'Двое отшельников жили выше горы Росса, на горе, известной под названием «Крыша», близ реки Пиапи и обители аввы Феодосия в Скопеле. Старец скончался, и ученик его, совершив молитву, похоронил его в горе. Прошло несколько дней. Ученик отшельника спустился с горы и, проходя мимо селения, встретил человека, трудившегося на своем поле. «Почтенный старец, – сказал он ему, – сделай милость, возьми свой заступ и лопату, и пойдем со мною». Земледелец тотчас пошел за ним. Взошли на гору. Отшельник указал мирянину на могилу своего старца и сказал: «Копай здесь!» Когда тот вырыл могилу, отшельник стал на молитву и, окончив ее, спустился в могилу, лег над своим старцем и отдал душу Богу. Мирянин, зарыв могилу, вознес благодарение Богу. Сойдя с горы на такое расстояние, как может упасть брошенный камень, сказал сам в себе: «Я должен был бы принять благословение от святых!» Но, вернувшись, он уже не мог найти их могилы.'
        cn: 两位隐修士住在罗斯山上方，在一座名为「屋顶」的山上，靠近皮阿皮河以及斯科佩莱的阿巴·费奥多西修院。老者去世了，他的门徒做了祷告后，将他安葬在山上。几天过去了。隐修士的门徒从山上下来，路过一个村庄时，遇到一个在自己的田地里劳作的人。「尊敬的老者，」他对他说，「劳驾您，带上您的镐和铲子，和我一起走吧。」那个农夫立刻跟着他走了。他们爬上了山。隐修士指着他师傅的坟墓对那位平信徒说：「在这里挖！」当那人挖好坟墓后，隐修士开始祷告，祷告完毕后，他下了坟墓，躺在他师傅身上，并将灵魂交托给上帝。那位平信徒埋好坟墓后，向上帝献上感恩。从山上下来，走到一个投掷石子可及的距离时，他心里想：「我本该接受圣者的祝福！」然而，当他回去时，他再也找不到他们的坟墓了。
  - type: heading2
    initial:
      ru: '91.'
      cn: '91.'
    text:
      ru: Жизнь отшельника аввы Георгия и Фалалея, ученика его.
      cn: 阿爸格奥尔基隐修士与他的门徒法拉列的生平。
    children:
    - type: paragraph
      text:
        ru: 'Некоторые из отцов рассказывали нам об отшельнике авве Георгии, что он тридцать пять лет скитался без одежды по пустыням. О нем же говорили, что, живя в горах монастыря аввы Феодосия в Скопеле, он имел ученика. Когда ученик скончался, авва Георгий, не имея орудий, чтобы вырыть могилу и похоронить тело брата, сошел с горы к морю и увидал приближавшийся корабль. И стал он звать хозяина корабля и матросов, чтобы они шли за ним на гору и погребли брата. Те с готовностью согласились и, захватив необходимые орудия, взошли со старцем на гору. Вырыв могилу, они погребли тело. Один из матросов, по имени Фалалей, придя в умиление при виде добродетельного старца, стал просить его, чтобы позволил остаться при нем. Старец ответил, что ему не перенести трудов подвижничества. Но юноша утверждал, что он готов на все подвиги. И действительно, оставшись со старцем, он провел вместе с ним год в изнурительных подвигах. По прошествии года, брат Фалалей бросается к ногам старца со словами: «Помолись обо мне, отче! По твоим молитвам, Бог избавил меня от страданий: я не чувствую утомления, на меня не действует более ни суровость воздуха, не жжет палящий зной, не зябну во время стужи, напротив – испытываю полное спокойствие». И старец благословил брата. Прошло еще два года с половиной. Брат Фалалей предузнал свою кончину, и обратился с просьбою к старцу:'
        cn: 一些教父曾向我们讲述隐修士阿爸格奥尔基，说他三十五年来赤身裸体地游荡在荒漠中。人们也提到他，说他住在斯科佩洛斯阿爸忒奥多西修道院的山中时，有一位门徒。当这位门徒去世后，阿爸格奥尔基，因为没有工具可以挖掘坟墓并安葬兄弟的遗体，便下山来到海边，看见一艘船正在靠近。于是他开始呼唤船主和水手们，请他们跟他上山去安葬兄弟。他们欣然同意，带着必要的工具，和这位长者一起上山。挖好坟墓后，他们安葬了遗体。其中一位名叫法拉雷的水手，在看到这位品德高尚的长者时心生感动，便开始恳求他，允许他留在自己身边。长者回答说，他无法承受苦修的劳作。但这位年轻人坚持说，他已准备好接受一切苦修。事实上，他留在长者身边，和他一起度过了一年在疲惫不堪的苦修中。一年后，兄弟法拉雷俯伏在长者脚前，说道：「请为我祷告吧，父亲！因着你的祷告，上帝已将我从苦难中解救出来：我不再感到疲惫，严酷的空气对我也不再有影响，酷热不再灼烧我，寒冷时我也不再感到寒意，相反地——我感受到完全的平静。」长者便祝福了这位兄弟。又过了两年半。兄弟法拉雷预知了自己的死期，便向长者提出了请求：
    - type: paragraph
      text:
        ru: – Своди меня в Иерусалим, чтобы мне поклониться св. Кресту и св. воскресению Христа Бога нашего, потому что на этих днях Господь возьмет меня к Себе. Старец вместе с ним отправился во св. град. Поклонившись святым и дорогим местам, они прошли к св. Иордану и омылись в нем, а три дня спустя почил брат Фалалей. И старец похоронил его в лавре «Копрата». Прошло немного времени, и сам отшельник авва Георгий скончался. И похоронили его отцы лавры Копрата в своем храме.
        cn: '——「带我去耶路撒冷，为了我能朝拜圣十字架和我们神基督的圣复活，因为在这几天，主将要接我回祂身边。」

          长老与他一同前往圣城。

          他们朝拜了圣地与珍贵之处后，便来到圣约旦河并在其中沐浴。三天之后，法拉列弟兄便安息了。

          长老将他安葬在「科普拉塔」修道院。

          没过多久，隐修士阿巴·格奥尔基也安息了。

          「科普拉塔」修道院的众教父将他安葬在他们的圣堂中。'
  - type: heading2
    initial:
      ru: '92.'
      cn: '92.'
    text:
      ru: Жизнь Георгия Каппадокийского и обретение тела Петра, пустынника св. Иордана.
      cn: 卡帕多西亚的圣格奥尔基生平，以及寻获圣约旦隐士彼得的遗体。
    children:
    - type: paragraph
      text:
        ru: 'Св. отец наш авва Георгий, архимандрит монастыря св. отца нашего Феодосия, расположенного в пустыне близ св. града Христа, Бога нашего, рассказал мне и брату Софронию софисту: жил со мною здесь брат, по имени Георгий, родом из Каппадокии. Он служил в Фасаэлиде. Однажды братия пекли хлебы, а Георгий растапливал печь. Истопивши печь, он не знал, чем ее вытереть, так как братия, ради его испытания, спрятали лоскут. Тогда он влез в печь и вытер ее своим плащом, потом вышел из огня без всякого вреда. Узнав об этом, я сделал строгое порицание братии за такое испытание.'
        cn: 我们的圣父亚巴·格奥尔基，我们的圣父狄奥多西修道院的大司祭——该修道院坐落在靠近我们的上帝基督的圣城旁的旷野中——告诉了我与智者索福罗尼修士：曾有一位名叫格奥尔基的修士与我一同住在这里，他来自卡帕多基亚。他在法萨埃利德服事。有一次，修士们正在烤面包，而格奥尔基正在生火暖炉。炉子暖好后，他不知道用什么来擦炉子，因为修士们为了试验他，藏起了一块布。于是他爬进了炉子，并用他的斗篷擦拭了炉子，随后他从火焰中出来，丝毫未受伤害。知道此事后，我严厉地斥责了那些修士，因为他们进行了这样的试验。
    - type: paragraph
      text:
        ru: 'Тот же отец наш авва Георгий рассказывал о том же брате, что ему пришлось пасти свиней в Фасаэлиде. И пришли два льва, чтобы похитить одну из них. Тогда он, взяв свою палку, прогнал их к св. Иордану. В другой раз тот же отец наш поведал нам: я собирался строить храм во имя св. Кириака в Фаселаиде. Вырыли место для фундамента. И вот является мне во сне неизвестный инок, по наружности великий подвижник. Нижнее платье на нем было из пальмовых листьев, на плечах – короткая мантия из рогожи. И говорит он мне умоляющим голосом:'
        cn: '我们同一位教父，长老格奥尔基，讲述了关于同一位兄弟的故事，说他不得不在法萨埃利德牧猪。有两只狮子来了，企图偷走其中一只。于是他拿起他的棍子，把它们赶到了圣约旦河边。


          另一次，我们同一位教父告诉我们：「我正打算在法塞莱德建造一座奉圣基里亚克之名的教堂。地基的地方已经挖好了。这时，在梦中向我显现了一位不知名的修士，从外表看，他是一位伟大的苦行僧。他里面穿的衣服是用棕榈叶编成的，肩上披着一件用粗麻布做的短斗篷。他对我用哀求的声音说道：」'
    - type: paragraph
      text:
        ru: – Скажи мне, авва Георгий, ужели, после столь великих трудов и подвигов моих, ты оставишь меня лежать вне воздвигаемого храма?
        cn: ——告诉我，阿爸格奥尔基，难道在我如此巨大的劳苦和苦修之后，你竟要让我躺卧在那正在建造的圣殿之外吗？
    - type: paragraph
      text:
        ru: 'Изумляясь благолепному виду старца, я говорю ему:'
        cn: 惊叹于长老庄严的容貌，我对他说：
    - type: paragraph
      text:
        ru: – Кто же ты, господин мой?
        cn: – 你究竟是谁，我的主？
    - type: paragraph
      text:
        ru: – Я – Петр, пустынник и воск св. Иордана, – отвечал он.
        cn: – 我是彼得，隐修者，以及圣约旦的蜡， – 他回答道。
    - type: paragraph
      text:
        ru: Вставши утром, я расширил план храма. Когда начали рыть, нашли его тело, лежавшее в земле, в том же самом виде, как он являлся мне во сне. Выстроивши храм, в левом углу храма я устроил прекрасную гробницу и там положил его.
        cn: 清晨醒来，我扩充了圣殿的规划。当他们开始挖掘时，发现了他的遗体，安卧在土中，与他在我梦中显现时的样子完全一致。圣殿建成后，我在圣殿的左角建造了一座华美的坟墓，并将他安葬于其中。
  - type: heading2
    initial:
      ru: '93.'
      cn: '93.'
    text:
      ru: Кончина аввы Сизинния и его ученика.
      cn: 阿爸西西尼乌斯和他的门徒的安息。
    children:
    - type: paragraph
      text:
        ru: 'От того же отца нашего, аввы Георгия, мы слышали следующий рассказ: однажды я пришел к отшельнику авве Сизиннию. Этот старец, оставив для всецелого предания себя Богу свою епископию, поселился и начал проводить безмолвную жизнь близ селения Ветанаварии, на расстоянии шести миль от св. Иордана. Придя к нему, мы долго стучались. Прошло много времени, прежде чем ученик его отворил нам. «Отче, – сказал он нам, – старец при смерти... Он молил Бога не посылать ему смерти, прежде чем он услышит о вашем возвращении в эту страну». А мы, по нуждам обители, ездили в Константинополь к благочестивейшему императору Тиверию. Ученик пошел к старцу и возвестил ему о моем прибытии. Прошло опять много времени, прежде чем он возвратился. «Пожалуйте!» – сказал он. Войдя, мы нашли старца уже умершим. Потом я узнал, что он отошел ко Господу, лишь только узнал, что это я стучался к нему. И когда я облобызал его, умерший тихо сказал мне: «Благополучно возвратился авва мой», – и снова почил. Тогда я дал знать в селение, чтобы пришли и похоронили старца. Когда пришедшие из селения начали рыть могилу, ученик старца просил их: «Сделайте милость, ройте немного пошире, чтобы можно было положить двоих». Пока рыли могилу, ученик лег на рогожу и почил. И мы похоронили их вместе – старца и ученика его.'
        cn: '我们从我们敬爱的教父亚巴·格奥尔基那里听到了以下这个故事：


          有一次，我去看望隐修士亚巴·西津尼乌斯。这位长老为了将自己全然献给上帝，放弃了自己的主教职，定居下来，开始过起寂静的生活，靠近韦塔纳瓦里村，距离圣约旦河六英里。


          到了他那里，我们敲了很久的门。过了很久，他的门徒才给我们开了门。「教父啊，」他告诉我们，「长老快要死了……他曾向上帝祷告，在他听说你们回到这个国家之前，不要让他离世。」而我们，为了修道院的需要，曾去过君士坦丁堡拜见最虔诚的皇帝提比略。


          门徒走到长老身边，告知他我的到来。又过了很久，他才回来。「请进！」他说。我们进去后，发现长老已经去世了。后来我得知，仅仅在他得知是我在敲门之后，他就归主了。当我亲吻他时，逝者轻声对我说：「我的亚巴平安归来了。」——然后他又安息了。


          于是我便通知了村里，让他们过来安葬长老。当从村里来的人开始挖墓穴时，长老的门徒请求他们：「请帮个忙，挖宽一点，这样可以放下两个人。」当他们挖墓穴的时候，门徒躺在草席上，便安息了。于是我们便将他们合葬了——长老和他的门徒。'
  - type: heading2
    initial:
      ru: '94.'
      cn: '94.'
    text:
      ru: О Иулиане, епископе Бостры.
      cn: 关于尤利安，博斯特拉主教。
    children:
    - type: paragraph
      text:
        ru: 'Отец наш, архимандрит Георгий, рассказывал нам также об авве Иулиане, бывшем епископе Бострском. Когда он удалился из обители и сделался епископом в Бостре, некоторые из жителей города, ненавистники имени Христова, задумали погубить его при помощи яда. Они подговорили слугу, подававшего епископу вино, разбавленное водою, подкупив его, и дали ему яд, чтобы он подмешал его в чашу с вином. Тот так и сделал, как его подговорили, – подал блаженному Иулиану подмешанное вино. Епископ принял чашу и по вдохновению свыше узнал о злом умысле, равно как и о том, кто это подстроил. Взяв чашу, епископ поставил ее перед собою, ни слова не сказав слуге. Потом он созывает к себе всех жителей, в числе которых были и злоумышленники. Дивный Иулиан, не желая подвергать позору заговорщиков, обращается ко всем со скромными словами: «Если вы желаете умертвить смиренного Иулиана при помощи яда, – вот я пью его пред вами». Сказав это, он трижды крестообразно осенил перстом своим чашу. «Во имя Отца и Сына и Св. Духа – выпиваю сию чашу!» – произнес он и, выпив отраву пред всеми, остался невредим. Увидав это, пали пред ним и просили у него прощения.'
        cn: 我们的神父、大司祭格奥尔基也向我们讲述了关于阿爸尤利安的故事，他曾是博斯特拉的主教。当他从修道院隐退并成为博斯特拉的主教时，城里的一些居民，那些憎恨基督之名的人，计划用毒药害死他。他们收买了服侍主教递上掺水葡萄酒的仆人，给了他毒药，教唆他把毒药混入酒杯中。那个仆人照着他们教唆的做了，把混有毒药的酒递给了蒙福的尤利安。主教接过杯子，凭着从上而来的默示，知道了这邪恶的阴谋，也知道了是谁策划的。主教接过杯子，把它放在自己面前，对仆人一言不发。之后他召集了所有居民，其中包括那些心怀恶意的人。奇妙的尤利安不愿让阴谋者蒙羞，便谦逊地对大家说：「如果你们想用毒药杀死卑微的尤利安，——看，我就在你们面前喝下它。」说完这话，他用手指在杯子上三次划十字。「奉父、子、圣灵之名——我喝下此杯！」——他这样说，并在众人面前喝下了毒药，却毫发无损。众人见此情景，都俯伏在他面前，向他请求宽恕。
  - type: heading2
    initial:
      ru: '95.'
      cn: '95.'
    text:
      ru: Жизнь старца Патрикия в Скопеле.
      cn: 长老帕特里基在斯科佩勒的生平。
    children:
    - type: paragraph
      text:
        ru: В обители отца нашего Феодосия жил один старец, родом из Севастополя Армянского, по имени Патрикий. Он был очень стар, – говорил, что ему было 113 лет. Старец отличался кротостию и смирением. Тамошние отцы рассказывали нам об этом добродетельном старце, что прежде он был игуменом обители Абазанской, он отказался от игуменства, боясь ответственности. «Только великим людям под силу пасти словесных овец», – говорил он. Пришел в обитель Феодосия, чтобы жить в послушании, рассудив, что это гораздо полезнее для души.
        cn: 在我们父狄奥多西的修道院里，住着一位名叫帕特里基的长老，他来自亚美尼亚的塞瓦斯托波尔。他非常年迈，他说自己已经113岁了。这位长老以其温顺和谦卑著称。那里的教父们告诉我们，关于这位有德行的长老，他以前是阿巴赞修道院的院长，但他因害怕承担责任而放弃了院长职位。他说：「只有伟大的人才能牧养属灵的羊群。」他来到狄奥多西的修道院，过顺从的生活，认为这对灵魂更有益处。
  - type: heading2
    initial:
      ru: '96.'
      cn: '96.'
    text:
      ru: О слепце Иулиане, родом из Аравии.
      cn: 关于盲人尤利安，原籍阿拉伯。
    children:
    - type: paragraph
      text:
        ru: 'Был там так же, как рассказывали нам, другой старец, араб по происхождению, по имени Иулиан, слепец. Этот авва Иулиан соблазнился о Макарии, иерусалимском архиепископе, и сомневался, быть ли ему с ним в общении. Вот однажды авва Иулиан извещает авву Симеона, жившего на «Дивной горе», находящейся в девяти милях от Феополя: «Я слеп, да не знаю, куда бы мне и сходить; нет никого, кто бы вывел меня из затруднения, а между тем я сомневаюсь вступить в общение с Макарием. Объясни также мне, отче, как поступить мне с согрешившим братом, равно как и с тем, кто связал себя с ним клятвою?» Авва Симеон отвечает брату Иулиану: «Не удаляйся и не думай удаляться от св. Церкви. В ней, по благодати Господа нашего Иисуса Христа, нет ничего худого. Сверх того, – знай, брат, что если кто при св. возношении погрешит в вашей обители, у вас там есть старец, по имени Патрикий. Этот старец становится вне святилища, позади всех, близ западной стены храма. Он достойно совершает св. молитву проскомидии, и она принимается как жертва святая».'
        cn: 据我们所闻，那里也有一位长老，阿拉伯裔，名叫尤利安，他是个盲人。这位神父尤利安因耶路撒冷大主教马卡里奥斯而跌倒，并疑惑是否应与他共融。有一次，神父尤利安告知住在「奇妙山」上的神父西美翁——此山距狄奥波利斯九英里：「我是盲人，不知该往何处去；没有人能将我从困境中解救出来，与此同时，我疑惑是否应与马卡里奥斯共融。父亲，也请您向我解释，我该如何对待一位犯了罪的弟兄，以及那些与他以誓言相结之人？」神父西美翁回答弟兄尤利安说：「不要离开，也不要考虑离开圣教会。在其中，凭着我们主耶稣基督的恩典，没有任何不善之事。此外，弟兄，你要知道，若有人在你们修道院的圣奉献礼中犯了罪，你们那里有一位名叫帕特里基奥斯的长老。这位长老站在圣所之外，在所有人身后，靠近殿堂的西墙。他庄严地完成圣预备礼的祷文，这祷文被接纳为圣洁的祭品。」
  - type: heading2
    initial:
      ru: '97.'
      cn: '97.'
    text:
      ru: Жизнь и смерть двух отшельников, давших клятву никогда не разлучаться.
      cn: 两位立誓永不分离的隐士的生与死。
    children:
    - type: paragraph
      text:
        ru: 'Отшельник, авва Иоанн, по прозванию «Огненный», поведал нам следующее. Авва Стефан Моавитский рассказывал мне: однажды мы были в монастыре великого вождя иноков, св. Феодосия. Там были два брата, давшие друг другу клятвенное обещание – не разлучаться друг от друга ни в жизни, ни в смерти. В обители они для всех были примером назидания. Но вот один из них подвергся плотской брани и, будучи не в силах побороть ее, сказал другому брату: «Отпусти меня, брат! Похоть плоти одолевает меня, и я решился уйти в мир». Тот начал уговаривать его:'
        cn: 隐士阿巴·约安，人称「火热者」，给我们讲述了以下的事情。阿巴·斯特凡·摩押的对我讲述说：有一次，我们在伟大的修士领袖圣提奥多西的修道院里。那里有两个修士，他们彼此发誓立下誓言——无论是生是死都彼此不分离。在修道院里，他们对所有人来说都是一个教诲的榜样。但是其中一位遭受了肉体的争战，并且无力战胜它，对另一个修士说：「放我走吧，弟兄！肉体的私欲胜过了我，我决定回到世俗去。」另一位开始劝说他：
    - type: paragraph
      text:
        ru: – Не губи, брат, своего подвига.
        cn: – 不要糟蹋了你的属灵争战，弟兄。
    - type: paragraph
      text:
        ru: – Или ты иди вместе со мной, чтобы мне удовлетворить страсть, или отпусти меня одного, – возразил тот.
        cn: 「要么你跟我一起去，好让我满足情欲，要么就放我一个人去。」那人反驳道。
    - type: paragraph
      text:
        ru: 'Не желая отпустить одного в мир, брат пошел вместе с ним в город. Подвергшийся плотской брани зашел в дом блудницы, а другой брат стоял вне, посыпав голову пеплом, и сильно страдал. Впавший в блуд, совершив преступление, вышел из дому. Другой начал говорить ему:'
        cn: 不愿让他独自一人进入世俗，这位修士便与他一同进了城。经受肉体争战的那一位走进了妓女的家，而另一位修士则站在外面，头上蒙灰撒土，并且极其痛苦。犯了淫乱罪的那一位，在犯下这罪行之后，走出了家门。另一位修士便开始对他说话：
    - type: paragraph
      text:
        ru: – Какую пользу получил ты, брат, от греха? Не причинил ли, напротив, вред? Пойдем обратно в свое место...
        cn: ——兄弟，你从罪恶中得到了什么益处？难道不是反而造成了伤害吗？我们回去我们自己的地方吧……
    - type: paragraph
      text:
        ru: – Нет, уже не могу идти в пустыню... Ты ступай туда, а я останусь в миру.
        cn: ——不，我已经不能去旷野了……你到那里去吧，而我将留在世俗中。
    - type: paragraph
      text:
        ru: 'Напрасны были все усилия убедить его возвратиться в пустыню. Брат решился сам остаться с согрешившим в миру, и они оба начали трудиться для своего пропитания. В то время авва Авраамий строил свой монастырь, так называемый «Византийский». Незадолго до этого он устроил монастырь в Константинополе, называемый «Авраамиев», а впоследствии был архиепископом в Ефесе. То – был добрый и кроткий пастырь. Придя к нему, два брата нанялись за плату работать при постройке. Впавший в блуд получал плату за двоих, и каждый день отправлялся в город, тратя деньги на распутство. Между тем другой постился все дни, молча делал свое дело и не говорил ни с кем. Мастера, видя его ежедневно, – как он не ест и не пьет и весь сосредоточен в себе самом, доложили обо всем, – об его образе жизни св. авве Авраамию. Великий Авраамий зовет труженика к себе в келлию и обращается к нему с вопросом:'
        cn: 劝他回到旷野的所有努力都徒劳无功。这位弟兄决定亲自留在世俗中犯了罪的那个弟兄身边，他们两人开始劳作以维持生计。当时，阿瓦·阿夫拉米正在建造他那被称为「拜占庭」的修道院。不久前，他曾在君士坦丁堡建立了一座名为「阿夫拉米耶夫」的修道院，后来成为以弗所的大主教。他是一位良善而温柔的牧者。两位弟兄来到他那里，受雇为建造工程工作以获取报酬。犯了淫乱之罪的那个弟兄领着双份的工钱，每天进城，把钱挥霍在放荡之事上。与此同时，另一位弟兄则终日禁食，默默地做自己的工，一言不发。工头们天天看到他——他如何不吃不喝，全神贯注于自身——便将他的一切生活方式都禀报给了圣阿瓦·阿夫拉米。伟大的阿夫拉米召那位劳作者到自己的修道室，向他提问：
    - type: paragraph
      text:
        ru: – Откуда ты, брат, и какое у тебя занятие?
        cn: ——弟兄，你从哪里来？你有什么职业？
    - type: paragraph
      text:
        ru: Тот открылся ему во всем.
        cn: 那人凡事都向他敞开了。
    - type: paragraph
      text:
        ru: – Ради брата я терплю все это, да видит Бог скорбь мою и да спасет его.
        cn: ——为了我的弟兄，我忍受这一切，愿上帝看见我的忧伤，并愿他拯救他。
    - type: paragraph
      text:
        ru: – И Господь даровал тебе душу брата твоего! – выслушав все, произнес Авраамий.
        cn: – 主已将你弟兄的灵魂赐予了你！ – 听完一切后，亚伯拉罕说道。
    - type: paragraph
      text:
        ru: Лишь только авва Авраамий отпустил брата, и тот вышел из келлии, как вот пред ним – брат его...
        cn: 阿爸·亚伯拉罕刚一打发走那弟兄，那弟兄走出隐修室，就看见他的弟兄在他面前……
    - type: paragraph
      text:
        ru: – Брат мой, возьми меня в пустыню, – восклицал он, – да спасется душа моя!
        cn: 「我的弟兄，带我到旷野去吧，」他呼喊道，「使我的灵魂得救！」
    - type: paragraph
      text:
        ru: И немедленно взяв брата, он удалился с ним в пещеру, близ св. Иордана, и затворил его там. Прошло немного времени, и согрешивший брат, много усовершенствовавшись в духе пред Богом, скончался. А другой остался в той же пещере, согласно клятве, чтобы и самому скончаться там же.
        cn: 随即，他带着兄弟，与他一同退隐到圣约旦河附近的一个山洞里，并将他禁闭在那里。没过多久，那犯了罪的兄弟在上帝面前灵性大有长进，便安息了。而另一位则遵照誓言留在那同一个山洞里，为的是他自己也要在那里安息。
  - type: heading2
    initial:
      ru: '98.'
      cn: '98.'
    text:
      ru: Во время пребывания его близ св. Иордана, после кончины брата, навестил его один старец из лавры Каламонской.
      cn: 在他靠近圣约旦河居住期间，在他兄弟去世后，一位来自卡拉蒙修道院的长老拜访了他。
    children:
    - type: paragraph
      text:
        ru: – Проведя столько времени в безмолвии и подвижничестве – чего достиг ты, брат? – спросил гость.
        cn: 「在如此长时间的静默和苦修之后——弟兄，你取得了什么呢？」客人问道。
    - type: paragraph
      text:
        ru: – Ступай и возвратись дней через десять. Тогда я скажу тебе.
        cn: – 去吧，过十天再回来。那时我告诉你。
    - type: paragraph
      text:
        ru: 'Придя на десятый день, старец нашел брата уже умершим. На черепе было начертано: «Прости меня, отче, что я никогда при исполнении своего правила не обращал своих мыслей к земному».'
        cn: 第十天，长老前来，发现弟兄已经去世。在他的头颅上刻着：「父啊，请原谅我，我在履行我的定课时，从未将我的心思转向属世之事。」
  - type: heading2
    initial:
      ru: '99.'
      cn: '99.'
    text:
      ru: Жизнь Ианфа.
      cn: 伊安托斯生平
    children:
    - type: paragraph
      text:
        ru: 'Отцы той же обители поведали нам: незадолго здесь был один старец, именем Ианф. Всю свою жизнь он прожил в Кутилийской пустыне. Однажды он был в пустыне, и вот пришли в ту местность сарацины. Увидав старца, один из них обнажил меч и бросился на старца с целью убить его. Но старец, завидев сарацина, устремил свой взор к небу и воскликнул: «Господи Иисусе Христе! Да будет воля Твоя!» И мгновенно земля разверзлась и поглотила сарацина. Старец был спасен и пришел в монастырь, славя Бога.'
        cn: 同一修道院的教父们告诉我们：不久前，这里有一位名叫扬夫的长老。他一生都生活在库季利斯基旷野。有一天，他在旷野里，忽然撒拉逊人来到那个地方。他们中的一个看到长老，便拔出剑，扑向长老，意图杀害他。但是长老看到撒拉逊人后，便举目望天，呼喊道：「主耶稣基督啊！愿你的旨意成就！」瞬间，地面裂开，吞没了那个撒拉逊人。长老得救了，他来到修道院，颂赞上帝。
  - type: heading2
    initial:
      ru: '100.'
      cn: '100.'
    text:
      ru: Жизнь инока Петра, родом из Понта.
      cn: 隐修士彼得生平，原籍蓬图斯。
    children:
    - type: paragraph
      text:
        ru: 'В другой раз рассказывали нам отцы той же обители: жил здесь пресвитер, именем Петр, родом из Понта, отличавшийся многими и великими совершенствами. Феодор, бывший епископом в Россе, говорил нам об этом старце, что однажды он пришел к нему на Иордан, в лавру «Башен», где он жил.'
        cn: 另一次，同一修道院的教父们曾告诉我们：这里住着一位名叫彼得的长老，他来自本都，以许多且伟大的美德而闻名。曾是罗萨主教的忒奥多尔告诉我们关于这位长老的事情，说有一次他来到约旦河畔找他，在他居住的「塔楼」隐修院。
    - type: paragraph
      text:
        ru: – Сделай милость, брат Феодор, пойдем со мной на гору Синай. Я дал такой обет – помолиться там.
        cn: – 请你发发慈悲，费奥多尔弟兄，跟我一起去西奈山吧。我许下了一个这样的誓愿——要在那里祈祷。
    - type: paragraph
      text:
        ru: – Пойдем, – отвечал я, не желая ослушаться старца.
        cn: ——「我们走吧，」我答道，不愿违抗长老。
    - type: paragraph
      text:
        ru: 'По переходе чрез св. Иордан, старец говорит мне:'
        cn: 在穿过圣约旦河之后，长老对我说：
    - type: paragraph
      text:
        ru: – Брат Феодор, помолимся, чтобы нам не вкушать до самой горы Синая.
        cn: ——弟兄费奥多尔，让我们祈祷，好叫我们直到西奈山都不吃东西。
    - type: paragraph
      text:
        ru: – Отче, мне никак не вынести этого.
        cn: – 父啊，我实在无法承受这个了。
    - type: paragraph
      text:
        ru: 'Старец помолился и, действительно, не вкушал ничего до самой горы Синая, и только на Синае, причастившись Св. Таин, принял пищу. Точно так же от Синая мы пришли к св. Мине в Александрии, и он ничего не вкушал на пути, а там, причастившись, подкрепился пищей. От св. Мины мы прошли во св. град, и он опять совсем ничего не ел во время путешествия. Причастившись во св. храме Воскресения Христа, Бога нашего, принял пищу. Так, в продолжение столь долгого и столь трудного путешествия старец вкушал только три раза: раз на горе Синае, другой раз у св. Мины и, наконец, во св. граде.'
        cn: '老者做了祷告，确实在抵达西奈山之前什么也没吃，直到在西奈山领了圣餐后，才进食。


          同样地，从西奈山我们来到了亚历山大城的圣米纳那里，他一路上什么也没吃，但在那里领了圣餐后，才进食。


          从圣米纳那里我们去了圣城，他再次在旅途中完全什么也没吃。在他神基督复活圣殿里领了圣餐后，才进食。


          就这样，在如此漫长而艰辛的旅途中，老者只吃了三次：一次在西奈山，另一次在圣米纳那里，最后在圣城。'
  - type: heading2
    initial:
      ru: '101.'
      cn: '101.'
    text:
      ru: Жизнь инока Павла, из Рима
      cn: 来自罗马的修士保罗生平
    children:
    - type: paragraph
      text:
        ru: 'От отцов той же обители слышали мы также следующий рассказ: жил там авва Павел, родом римлянин. Он скончался незадолго. Однажды он пошел с лошаками. На постоялом дворе оказался ребенок, которого, по козням диавола, лошак раздавил до смерти. Сильно огорченный этим, авва Павел удалился и пришел в Арон. Сделавшись отшельником, он постоянно оплакивал смерть дитяти: «Я был причиной смерти ребенка, и меня будут судить на суде, как убийцу». По близости находилось львиное логовище, и авва Павел ежедневно подходил к логовищу, ударял и раздражал зверя, чтобы тот, поднявшись, растерзал его. Но лев не делал ему никакого вреда. Увидав, что ему не удается раздражить зверя, он решил так: «Вот я лягу на пути льва. Он выйдет, направится к реке для утоления жажды и пожрет меня». Лег. Спустя немного, лев, действительно, показался, но, подобно человеку, со всей осторожностью прошел, не задев старца. Тогда старец вразумился, что Бог простил ему его прегрешение. Возвратясь в свою обитель, он жил в ней, принося всем пользу примером своего подвига – до самой кончины своей.'
        cn: '我们也从同一所修院的教父们那里，听到了以下这个故事：


          那里住着一位阿巴·帕维尔，他原是罗马人。他不久前才安息主怀。有一天，他赶着几头骡子出去。在一家客栈里，魔鬼设下诡计，让一头骡子把一个孩子碾死了。对此深感悲痛的阿巴·帕维尔，离开了那里，来到了阿隆。成为了一名隐修士后，他不断地为孩子的死亡哀哭：「我是那个孩子死亡的原因，并且在审判中，我将被判为凶手。」附近有一个狮子的巢穴，阿巴·帕维尔每天都走到巢穴旁边，击打并激怒那野兽，好让它站起来把他撕裂。但那狮子丝毫没有伤害他。


          见他无法激怒那野兽，他便这样决定：「看哪，我要躺在狮子的路上。它会出来，走向河边解渴，然后把我吞噬。」他躺下了。没过多久，狮子果然出现了，但它就像一个人一样，极其小心地走了过去，没有碰到这位长老。那时，这位长老明白了，上帝已经赦免了他的罪孽。他回到了自己的修院，住在那里，以他苦修的榜样造福众人，直到他安息主怀。'
  - type: heading2
    initial:
      ru: '102.'
      cn: '102.'
    text:
      ru: Рассказ Софрония софиста о том, что он видел пред своим пострижением.
      cn: 索夫罗尼索菲斯特关于他受剃度礼之前所见之事。
    children:
    - type: paragraph
      text:
        ru: 'Когда авва Софроний софист, брат мой, решился принять пострижение, стояли близ него я, авва Схоластик, авва Кирик и некоторые другие отцы. И он говорил нам: «Иду я дорогой, и вот предо мною хор Дев... Они плясали, восклицая: «Благословен приход твой, Софроний... Софроний увенчан!..»'
        cn: 当诡辩者阿巴·索夫罗尼——我的兄弟——决定接受剃度时，我、阿巴·斯科拉斯提克、阿巴·基里克和一些其他教父站在他身边。他对我们说：「我走在路上，看哪，我面前有一群贞女之歌班……她们跳着舞，呼喊着：『蒙福你的到来，索夫罗尼……索夫罗尼已受冠冕！』」
  - type: heading2
    initial:
      ru: '103.'
      cn: '103.'
    text:
      ru: Жизнь и добродетели аввы Стратигия.
      cn: 阿巴·斯特拉季奥斯的生平与美德。
    children:
    - type: paragraph
      text:
        ru: 'Об авве Стратигии, настоятеле той же обители св. отца нашего Феодосия, братия монастыря рассказывала нам, что сравнительно с современными иноками три преимущества возвышали его: частый пост, бдение и великое трудолюбие.'
        cn: 关于阿巴·斯特拉提吉（他曾是我们圣父提奥多西乌斯那同一座修道院的院长），修道院的修士们告诉我们，与当代的修士们相比，有三样优点使他超群出众：勤于斋戒、守夜和极大的勤劳。
  - type: heading2
    initial:
      ru: '104.'
      cn: '104.'
    text:
      ru: Жизнь аввы Нонна пресвитера.
      cn: 长老农恩司祭的生平。
    children:
    - type: paragraph
      text:
        ru: 'В киновии св. отца нашего Феодосия авва Феодосий, бывший епископом в Капитолиаде, рассказывал нам об авве Нонне: однажды ночью, пред тем, как ударять в било, лежа на своей кровати, я услыхал, как кто-то восклицал: «Господи, помилуй!» Голос был тихий и умильный. Насчитав пятьдесят раз: «Господи, помилуй», я захотел посмотреть, кто это молится. Выглянув из окна своей келлии вцерковь, я увидал коленопреклоненного старца, и лучезарная звезда сияла над головой его... При свете ее я и узнал старца.'
        cn: '在我们圣父提奥多西的团体院里，曾任卡皮托利亚德主教的提奥多西长老向我们讲述了关于农恩长老的故事：

          一天夜里，在我躺在自己的床上，在敲击木铎之前，我听见有人呼喊：「主啊，求你怜悯！」 声音低微而充满柔情。我数了五十遍「主啊，求你怜悯」之后，我想看看是谁在祷告。我从我的小室窗户向教堂望去，我看见一位跪着的年长修士，一颗光芒四射的星星在他头上闪耀……借着它的光亮，我认出了这位年长修士。'
    - type: paragraph
      text:
        ru: 'А другой из старцев той же обители рассказал нам об авве Нонне следующее: однажды, также до удара в било, выйдя из кельи, я пошел во храм, и вот вижу – пред храмом стоит старец, с воздетыми к небу руками, и молится. И руки его сияли, как горящие лампады. Исполнившись страха, я удалился.'
        cn: 另一位同一所修道院的长老告诉我们有关阿爸农恩的以下事情：有一次，同样在击板敲响之前，我走出小室走向圣殿，我看到——一位长老站在圣殿前，双手举向天空，并且在祷告。他的双手闪耀着光芒，犹如燃烧的油灯。我心中充满了敬畏，便离开了。
  - type: heading2
    initial:
      ru: '105.'
      cn: '105.'
    text:
      ru: Жизнь св. старца Христофора, родом из Рима.
      cn: 圣长老赫里斯托弗的生平，原籍罗马。
    children:
    - type: paragraph
      text:
        ru: 'Когда мы были в Александрии, зашли к авве Феодулу, жившему у св. Софии, в Фаре. Вот что мы узнали от него: я отрекся от мира в обители св. отца нашего Феодосия, что в пустыне, близ св. града Христа, Бога нашего. Там я встретил великого старца, по имени Христофора, родом римлянина. Однажды, поклонившись ему, я спросил его:'
        cn: 当我们身在亚历山大时，我们拜访了阿巴·费奥杜勒，他住在法雷的圣索菲亚（教堂）旁。我们从他那里了解到以下内容：我弃绝世俗，是在我们的圣父费奥多西修道院，它位于旷野中，靠近我们的上帝基督的圣城。在那里我遇到了一位伟大的长老，名叫赫里斯托弗，他是一位罗马人。有一天，我向他行礼后，问道：
    - type: paragraph
      text:
        ru: – Сделай милость, авва, скажи мне, чем ты занимался в молодости?
        cn: 劳驾，阿爸，告诉我，你年轻时是做什么的呢？
    - type: paragraph
      text:
        ru: 'Долго умолял я старца, и, наконец, видя, что я прошу его для пользы души, он рассказал мне следующее:'
        cn: 我恳切地向长老请求了许久，最终，他见我所求是为了灵魂的益处，便向我讲述了以下内容：
    - type: paragraph
      text:
        ru: '– После отречения от мира, чадо мое, я имел горячую иноческую ревность: днем я пел каноны, по ночам уходил в пещеру, туда, где покоятся св. Феодосий и прочие св. отцы, и там молился. Входя в пещеру, я на каждой ступени клал по сто земных поклонов, а всех ступеней восемнадцать. Пройдя все ступени, я оставался там до тех пор, пока не ударяли в било. Тогда я возвращался к службе. Таким образом, я провел десять лет: в посте, великом воздержании и подвиге. Однажды, по обычаю, прихожу в пещеру. Исполнив все поклоны по ступеням, я хотел было сойти на пол пещеры, как вдруг пришел в восторженное состояние. Я увидел, что весь пол пещеры наполнен свечами. Одни горели, а другие – нет. Два мужа в мантиях – все в белом – приготовляли эти свечи.'
        cn: ——我的孩儿，在我舍弃世俗之后，我怀着炽热的修道热忱：白天我唱颂歌，夜晚我进到洞穴中去，那里安息着圣狄奥多西和其他圣教父们，并在那里祷告。进入洞穴时，我每登一级阶梯，便行一百个大叩拜，共有十八级阶梯。走完所有阶梯后，我便一直留在那里，直到敲响木铎为止。那时我便回去参加礼拜。就这样，我度过了十年：在禁食中，在极度的节制中，和苦修中。有一天，按照惯例，我来到洞穴。完成所有阶梯上的叩拜后，我正要走到洞穴的地上时，突然进入了一种狂喜的状态。我看到，整个洞穴的地上都摆满了蜡烛。有些燃烧着，有些却没有。两位身穿长袍的男子——全身雪白——正在准备这些蜡烛。
    - type: paragraph
      text:
        ru: – Зачем вы наставили столько свечей, – спросил я, – так что и войти нельзя помолиться?
        cn: 「——你们为什么摆放了这么多蜡烛，」我问道，「以至于都无法进去祷告了？」
    - type: paragraph
      text:
        ru: – То свечи – отцов! – отвечали мне.
        cn: ——那是教父们的蜡烛！——他们回答我。
    - type: paragraph
      text:
        ru: – Почему же одни горят, а другие – нет?
        cn: 「为什么有的人燃烧，有的人却不呢？」
    - type: paragraph
      text:
        ru: '– То их воля: желающие зажгли свои...'
        cn: — 那是他们的意愿：那些愿意的人点燃了他们自己的……
    - type: paragraph
      text:
        ru: – Сделайте милость – горит ли моя свеча или нет? – спрашиваю я.
        cn: – 请您行行好 – 我的蜡烛是否亮着呢？ – 我问道。
    - type: paragraph
      text:
        ru: – Молись, и мы зажжем, – было мне ответом.
        cn: ——祈祷吧，我们就会点亮它。这是给我的回答。
    - type: paragraph
      text:
        ru: – Молись! – подхватил я. – Да что же я делал... даже до последнего часа?!
        cn: 「——祷告吧！」我接话道，「——我到底做了些什么……甚至直到这最后一刻？！」
    - type: paragraph
      text:
        ru: 'Но тут я пришел в себя и, оглянувшись, никого уже более не видел. Тогда сказал сам себе: «Христофор, если желаешь спастись, должен усилить свой подвиг». И утром я удалился из монастыря и ушел на гору Синай, не взяв ничего, кроме одежды, которую носил. Там я подвизался пятьдесят лет... Наконец, слышу голос: «Христофор, Христофор, возвратись в обитель, где ты подвизался добрым подвигом, чтобы окончить жизнь вместе с отцами твоими». И спустя немного времени после этой беседы святая душа его с радостью почила в Господе. В другой раз тот же авва Феодул рассказал нам о Христофоре – старец однажды поведал мне следующее: однажды из монастыря пошел я во св. град на поклонение св. Кресту. Поклонившись и уже выходя, вижу одного брата при входе в предхрамие: ни входит во храм, ни назад не возвращается. Два ворона смело летали пред лицом его и бросались к его глазам, препятствуя ему вступить во храм. Поняв, что это демоны, я говорю ему:'
        cn: '但那时我清醒过来，环顾四周，就再也看不见任何人了。于是我对自己说：「赫里斯托弗，如果你渴望得救，就必须加强你的苦修。」于是早上我离开了修道院，前往西奈山，除了身上所穿的衣服，什么也没带。在那里我苦修了五十年……最终，我听到一个声音说：「赫里斯托弗，赫里斯托弗，回到你进行了美好苦修的修道院，好与你的教父们一同结束此生。」在这次谈话后不久，他圣洁的灵魂喜乐地在主内安息了。


          另一次，同位长老忒奥杜尔给我们讲述了关于赫里斯托弗的事情——这位老者有一次对我讲述了以下事情：有一次我从修道院出发前往圣城，为要朝拜圣十字架。朝拜完毕，正要出来时，我看见一位修士在圣堂前厅的入口处：他既不进入圣堂，也不退回去。两只乌鸦在他面前大胆地飞来飞去，并扑向他的眼睛，阻碍他进入圣堂。我明白这是魔鬼，于是我对他说：'
    - type: paragraph
      text:
        ru: – Скажи мне, брат, зачем стоишь среди входа и не идешь во храм?
        cn: ——请告诉我，弟兄，你为何站在入口中间，却不走进圣殿？
    - type: paragraph
      text:
        ru: '– Прости отче, – отвечал он, – я борюсь с помыслами; один внушает мне: – войди, поклонись св. Кресту, а другой говорит: нет, ступай назад и исполни свое дело. В другой раз поклонишься.'
        cn: 「请原谅，神父，」他回答说，「我正与意念搏斗；一个意念在我心中催促我：『进去，朝拜圣十字架吧。』而另一个却说：『不，回去做你的事吧。下次再朝拜也不迟。』」
    - type: paragraph
      text:
        ru: Услыхав это, я взял его за руку и ввел во храм. Вороны тотчас улетели. Заставив его поклониться св. Кресту и св. Христову Воскресению, я отпустил его с миром. Вот что рассказал мне старец, потому что видел, как я был занят многими делами и не радел о молитве.
        cn: 听到这话，我拉着他的手，领他进了圣殿。乌鸦立刻飞走了。让他敬拜了圣十字和圣基督复活之后，我平安地送走了他。这就是那位长者告诉我的，因为他看到我忙于许多事务，并且不勤于祷告。
  - type: heading2
    initial:
      ru: '106.'
      cn: '106.'
    text:
      ru: Рассказ аввы Феодора об иноке, державшемся ереси Севировой.
      cn: 阿爸提奥多尔关于一位持守塞维鲁派异端的修士的记述。
    children:
    - type: paragraph
      text:
        ru: 'Тот же авва Феодул в другой раз рассказывал нам: есть здесь недалеко от Фара, как раз посредине между св. Софией и св. Фавстом, гостиница. При ней был и гостиник. Однажды он просил меня прийти в гостиницу и на несколько дней заменить его. Придя в гостиницу, я нашел остановившегося там одного инока, родом сирийца. Он не имел ничего, кроме власяницы, плаща и нескольких хлебов. Стоя постоянно в одном углу, он день и ночь проводил в песнословии и ни с кем не говорил. Настал воскресный день. Я подхожу к нему и говорю:'
        cn: '那位阿巴·提奥杜尔另一次告诉我们：


          在法拉附近，圣索菲亚和圣法乌斯特之间，有一间旅店。旅店里有一个店主。有一次他请求我到旅店去，替他代班几天。我到了旅店后，发现那里住着一位修士，他来自叙利亚。他除了苦修衣、斗篷和几块面包之外，一无所有。他一直站在一个角落里，日夜不停地吟唱圣诗，不与任何人交谈。


          到了主日。我走近他，说：'
    - type: paragraph
      text:
        ru: – Брат, не сходишь ли ты ко св. Софии, чтобы причаститься св. и божественных Таин?
        cn: – 弟兄，你难道不去圣索菲亚教堂，领受圣而神圣的奥秘（圣体血）吗？
    - type: paragraph
      text:
        ru: – Нет! – отвечал он.
        cn: – 不！ – 他回答说。
    - type: paragraph
      text:
        ru: – Отчего же? – спрашиваю его.
        cn: 「为何呢？」我问他。
    - type: paragraph
      text:
        ru: – Я принадлежу к последователям Севира и не состою в общении с Церковью.
        cn: – 我属于塞维鲁的追随者，并且不与教会共融。
    - type: paragraph
      text:
        ru: 'Услышав, что он не принадлежит ко св. кафолической и апостольской Церкви, а вместе с тем видя его прекрасное поведение и добродетель, я ушел со слезами в свою келлию, запер дверь и, пав на лице свое пред Богом, три дня молился со слезами: «Господи Христе, Боже наш, преклонивый небеса по неизреченному и бесконечному человеколюбию и сошедый нашего ради спасения, воплотивыйся от Владычицы Пресв. Богородицы и Приснодевы Марии, открой мне: кто истинно и прямо верует, мы ли, чада Церкви, или последователи Севера?» На третий день Кто-то, незримый, сказал мне: «Иди, Феодул, и увидишь веру его». Придя на утро, я сел против него, надеясь увидать что-либо, по слову, бывшему ко мне. Я сидел около часу, пристально смотря на него. Он стоял и пел песнопения на сирском языке. И вот – Бог мне свидетель! – вижу, чада мои, голубя, парящего над главою его, почерневшего как бы от сажи в трубе, истрепанного и безобразного. Тогда я понял, что явившийся мне черный и безобразный голубь обозначает их веру. Вот что, обливаясь слезами и глубоко вздыхая, поведал мне этот поистине блаженный муж.'
        cn: '听说他不属于圣洁、大公和使徒的教会，但与此同时，又看到他美好的品行和美德，我便含着泪回到我的隐修室，关上门，俯伏在地，在神面前，含泪祷告了三天：


          「主基督，我们的神啊，您以莫可言喻、无穷无尽的爱世之心俯就诸天，为了我们的救赎降临，从掌管一切的至圣上帝之母、永远童贞女马利亚取了肉身，求您向我启示：究竟是谁真正而正直地信仰，是我们这些教会的子女，还是塞维鲁的追随者？」


          第三天，一个无形者对我说：「去吧，斐奥杜尔，你将看到他的信仰。」第二天早上，我来到他面前坐下，希望能看到什么，依照那临到我的话语。我坐了大约一个小时，专注地看着他。他站着，用叙利亚语唱着赞美诗。就在这时——神作我的见证！——孩子们，我看到一只鸽子，盘旋在他的头顶上，黑得像烟囱里的烟灰，羽毛凌乱，丑陋不堪。那时我才明白，那向我显现的黑色丑陋的鸽子象征着他们的信仰。


          这位真正蒙福的男子，流着泪，深深地叹息着，向我讲述了这一切。'
  - type: heading2
    initial:
      ru: '107.'
      cn: '107.'
    text:
      ru: Жизнь аввы Герасима.
      cn: 阿爸革拉西姆生平
    children:
    - type: paragraph
      text:
        ru: 'Примерно в миле от святой реки Иордан расположена лавра, зовущаяся лаврой святого аввы Герасима. Когда мы пришли в эту лавру, живущие там отцы рассказали нам об этом святом, что однажды, когда он шел по берегу святого Иордана, ему повстречался лев, который громко рыкал из-за того, что у него болела лапа. Он занозил лапу, и от этого она у него распухла и гноилась. Завидев старца, лев подошел и протянул ему больную лапу, в которой был терн; он плакал на свой лад и просил у старца помощи. А старец, увидев льва в такой беде, сел на землю, взял его лапу и, разрезав, вытащил занозу и выдавил много гною, затем тщательно промыл рану, обвязал ее тряпицей и отпустил зверя. А исцеленный лев уже не уходил от старца, но, как верный ученик, сопровождал его всюду, куда бы тот ни шел, так что старец дивился такой признательности его. И с тех пор авва Герасим стал кормить льва, давая ему хлеб и моченые бобы. В лавре держали осла, чтобы возить на нем воду для братии. Ведь монахи пьют воду из святого Иордана, а от лавры до реки целая миля. Отцы обыкновенно поручали льву пасти осла на берегу святого Иордана. Однажды, когда лев пас его, осел далеко отошел от него. А тут из Аравии приходят погонщики верблюдов; увидев осла, они угоняют его по пути восвояси. Лев, не уследив за ослом, вернулся в лавру к авве Герасиму очень опечаленным и угрюмым; авва решил, что лев съел осла, и говорит ему: «Где осел?» А тот, как человек, молча стоял, опустив голову. Старец говорит ему: «Ты съел осла? Благословен Господь. Все, что делал осел, отныне будешь делать ты». И вот с той поры на льва по велению старца навьючивали короб с четырьмя кувшинами, и он возил воду. Однажды на молитву к старцу пришел воин, и, увидев, что лев возит воду, и, узнав причину этого, пожалел его. И вот он вынул три номисмы, и отдал старцам, чтобы они купили для этих нужд осла, а льва освободили от его повинности. Вскоре после того как лев был освобожден от доставки воды, погонщик верблюдов, который увел осла, снова пришел, чтобы в святом граде продать хлеб; захватил он с собой и угнанного осла. Переправившись через святой Иордан, он опять повстречал того льва. Увидев его, погонщик оставил своих верблюдов и убежал. Лев же узнал осла, бросился к нему и, как обычно, взяв в зубы его узду, угнал осла и вместе с ним трех верблюдов; с радостными криками, потому что нашел потерянного осла, лев пришел к старцу. Ведь старец думал, что лев съел осла. Тогда старец Герасим понял, что лев был неправо оклеветан. Он дал льву имя – Иордан. Вместе со старцем лев прожил в лавре пять лет, будучи всегда неразлучен с ним. Когда же авва Герасим отошел к Господу и был схоронен отцами, льва по устроению Божию на тот раз не оказалось в лавре. Вскоре он вернулся и стал искать старца. Ученик старца и авва Савватий, увидев льва, говорят ему: «Иордан, старец наш оставил нас сиротами и отошел ко Господу, на вот поешь». Лев не захотел есть, но непрестанно обращал глаза то в одну, то в другую сторону, чтобы найти своего старца, громко кричал и не мог примириться с его кончиной. Авва Савватий и остальные отцы, глядя на льва и трепля его по спине, говорили ему: «Старец отошел к Господу и оставил нас». Говоря так, они не могли утишить его криков и стенаний, но чем более, как им казалось, они врачевали и ободряли его словами, тем сильнее и сильнее лев продолжал плакать, тем громче становилось его надгробное рыдание, и голосом, обликом и глазами он показывал свою печаль о том, что не видит старца. Тогда авва Савватий говорит ему: «Ну, пойдем со мной, если не веришь нам, и я покажу тебе, где лежит наш старец». И, взяв льва, он привел его туда, где они похоронили старца. Могила была в полумиле от церкви. Когда они остановились над могилой аввы Герасима, авва Савватий говорит льву: «Вот старец наш». И авва Савватий преклонил колена. Лев, увидев, как авва высказывает свою печаль, стал, стеная, сильно биться головой оземь и испустил дух тут же у могилы старца. Это произошло не потому, что лев был наделен разумной душой, но потому, что Бог пожелал прославить тех, кто прославил его, не только при их жизни, но и после смерти их и показать, каково было повиновение животных Адаму до того, как он преступил заповедь Божию и был лишен райского блаженства.'
        cn: '在圣约旦河约一英里外，有一座拉伏拉，名为圣阿巴·格拉西莫斯的拉伏拉。当我们来到这座拉伏拉时，住在那里的教父们向我们讲述了这位圣徒的故事：说有一次，当他沿着圣约旦河岸行走时，他遇到了一头狮子，那狮子因为爪子疼痛而大声咆哮。它的爪子扎进了刺，因此肿胀化脓。狮子一看到这位长者，便走上前去，伸出它受伤的爪子，爪子里扎着一根刺；它以自己的方式哭泣着，请求长者帮助。长者看到狮子如此困境，便坐到地上，抓住它的爪子，割开伤口，取出扎进去的刺，挤出许多脓液，然后仔细清洗了伤口，用一块布包扎好，便放走了这只野兽。但这只被治愈的狮子却没有离开长者，而是像一个忠实的门徒一样，无论他走到哪里，都跟着他，以至于长者对它的这种感恩之心感到惊奇。从那时起，阿巴·格拉西莫斯就开始喂养这头狮子，给它面包和泡过的豆子。


          拉伏拉里养着一头驴，用来给修士们运水。因为修士们饮用圣约旦河的水，而从拉伏拉到河边足有一英里远。教父们通常把看守驴子的任务交给狮子，在圣约旦河畔。有一天，当狮子看守驴子时，驴子离它走远了。这时，有骆驼商队的人从阿拉伯来；看到驴子，便在回家的路上把它牵走了。狮子没有看好驴子，回到拉伏拉见阿巴·格拉西莫斯，非常悲伤和沮丧；阿巴认定狮子吃了驴子，对它说：「驴子在哪里？」狮子像人一样，默默地低着头站着。长者对它说：「你吃了驴子吗？愿主受赞颂。驴子所做的一切，从今以后都由你来做。」从那时起，按照长者的吩咐，人们在狮子背上放置一个装有四个水罐的箱子，它便开始运水。


          有一天，一位战士来见长者祈祷，他看到狮子在运水，了解到原因后，便对它心生怜悯。于是他拿出三枚诺米斯马金币，交给长者们，让他们用这些钱再买一头驴来做这些工作，并让狮子摆脱这项任务。狮子被解除运水任务后不久，那个牵走驴子的骆驼商队的人，再次来到圣城贩卖面包；他也带着那头被牵走的驴子。当他渡过圣约旦河时，又遇到了那头狮子。骆驼商队的人一看到它，便撇下他的骆驼逃跑了。狮子认出了驴子，便冲过去，像往常一样，用牙齿咬住它的缰绳，牵走了驴子，以及三头骆驼；狮子因为找到了走失的驴子而欢呼雀跃，来到长者身边。因为长者一直以为是狮子吃了驴子。于是长者格拉西莫斯明白了，狮子是被冤枉了。他给狮子起名叫——约旦。狮子与长者一起在拉伏拉生活了五年，总是与他形影不离。


          当阿巴·格拉西莫斯归主，并由教父们安葬后，出于神的安排，狮子当时不在拉伏拉里。很快它回来了，开始寻找长者。长者的门徒，阿巴·萨瓦提，看到狮子，对它说：「约旦，我们的长者已抛下我们这些孤儿，归主了。来，吃点东西吧。」狮子不肯吃，却不停地四处张望，寻找它的长者，大声吼叫，无法接受他的离世。阿巴·萨瓦提和其他教父们，看着狮子，拍着它的背，对它说：「长者已归主，抛下了我们。」尽管如此，他们也无法平息它的吼叫和悲鸣，反而，他们越是自以为用言语安慰和鼓励它，狮子就哭泣得越厉害，它的哀嚎也变得更加响亮，如同临近墓地的悲鸣，它用声音、神态和眼神表达着因见不到长者而产生的悲伤。于是阿巴·萨瓦提对它说：「来，如果你不相信我们，就跟我来，我带你去看我们的长者安息的地方。」他带着狮子来到他们安葬长者的地方。墓地离教堂有半英里远。当他们停在阿巴·格拉西莫斯的墓前时，阿巴·萨瓦提对狮子说：「看，这就是我们的长者。」阿巴·萨瓦提跪了下来。狮子看到阿巴表达悲伤的样子，便也悲鸣着，猛烈地将头撞向地面，随即就在长者的墓旁断了气。这并非因为狮子被赋予了理性的灵魂，而是因为上帝希望荣耀那些荣耀他的人，不仅在他们生前，也在他们死后，并以此显示，在亚当违背上帝的诫命并被剥夺乐园的福乐之前，动物对亚当的顺服是何等光景。'
  - type: heading2
    initial:
      ru: '108.'
      cn: '108.'
    text:
      ru: Девственная жизнь пресвитера и жены его.
      cn: 长老和他的妻子的童贞生活。
    children:
    - type: paragraph
      text:
        ru: 'По прибытии на остров Самос, мы пришли в монастырь, называемый «Хариксенский», к игумену авве Исидору. Это был муж добродетельный, исполненный любви ко всем и украшенный простотою и бесконечным смирением. Немного спустя он был епископом в тамошнем городе Савии. Вот что мы узнали от него: за восемь миль от города есть селение и в нем храм. Там служит досточудный священник, которого родители против воли заставили вступить в брак. Однако он не только сам чуждался плотских вожделений, хотя был молод и состоял в законном супружестве, но убедил и свою супругу проводить свою жизнь с ним в целомудрии и чистоте. Они выучили псалтирь и вместе вдвоем занимались псалмопением в храме, сохранив девство до старости. Однажды на этого священника взвели клевету пред епископом. Не зная его образа жизни, епископ послал за ним. Когда его привели из селения, он был заключен под стражу, куда обыкновенно заключаемы были провинившиеся клирики. Во время пребывания его в темнице настал воскресный день. Ночью является ему юноша, благолепного вида, и говорит ему:'
        cn: 抵达萨摩斯岛后，我们来到一个名为「哈里克森斯基」的修道院，拜访了院长阿巴·伊西多尔。他是一位品德高尚的人，对所有人充满爱，并以其质朴和无限的谦卑而受人敬重。不久之后，他成为了当地萨维亚城的主教。我们从他那里听说了以下的事：离城八英里外有一个村庄，村里有一座教堂。那里有一位可敬的司祭，他的父母违背他的意愿强迫他结婚。然而他不仅自己远离肉体的情欲，尽管他年轻并合法地结了婚，而且说服了他的妻子与他一同过着贞洁和纯净的生活。他们学会了诗篇，并且两人一同在教堂里颂唱诗篇，保持童贞直至年老。有一天，这位司祭被人诽谤到了主教面前。主教不了解他的生活方式，便派人召他。当他从村庄被带到时，他被关押起来，那里通常是关押犯错的神职人员的地方。他在监狱里的时候，恰逢主日。夜里，有一位容貌俊美的少年向他显现，并对他说：
    - type: paragraph
      text:
        ru: – Восстань, священник, и ступай в свой храм для совершения св. литургии.
        cn: ——起身，司祭，去你的圣殿举行圣礼仪。
    - type: paragraph
      text:
        ru: – Я не могу, так как я содержусь в заключении, – отвечает священник.
        cn: – 我不能，因为我被关押着，– 神父回答道。
    - type: paragraph
      text:
        ru: – Я отверзу тебе двери темницы, – сказал явившийся. – Пойдем – иди за мною!
        cn: ——我将为你开启监牢之门，——显现者说。——来吧，跟随我！
    - type: paragraph
      text:
        ru: 'И отворив двери темницы, вышел пред ним и сопровождал его до самого селения на расстоянии мили. С наступлением дня его хватились. Сторож, не найдя его, явился к епископу и сказал:'
        cn: 他打开了牢狱的门，来到他面前，一直陪伴他直到一英里外的村庄。天亮时，他们才发现他不见了。看守找不到他，便去见主教，说道：
    - type: paragraph
      text:
        ru: – Бежал у меня священник... Ключ был при мне.
        cn: — 我的一个司铎跑了……钥匙在我这里。
    - type: paragraph
      text:
        ru: 'Епископ, решивший в самом деле, что он бежал, посылает одного из слуг епископского дома, наказавши ему: «Ступай и посмотри, нет ли священника в его селе, и пока ничего не говори ему». Слуга отправился, нашел священника совершающим в храме св. литургию и, возвратившись, сказал епископу: «Он – там, и я застал его за божественной службой». Епископ, еще более разгневавшись, поклялся, что на утро он вернет его с большим бесчестием. На следующую ночь снова предстает священнику явившийся ему прежде и говорит: «Пойдем в город под стражу, куда заключил тебя епископ». Взяв священника, юноша привел его обратно в темницу, так что заведующий ею и не знал об этом. Наутро епископ узнает от сторожа, что священник неведомо как оказался под стражею. Епископ призвал священника и стал его расспрашивать, каким образом он мог выйти из темницы и обратно вернуться без ведома сторожа. Тот отвечал, что прекрасный юноша, в светлой одежде, из епископского дома, по словам его, отворил дверь и беспрепятственно довел его, священника, до селения на расстоянии одной мили. В эту ночь обратно привел сюда. – Тогда епископ позвал всех слуг епископского дома, но священник не признал ни одного из них. Тогда епископ понял, что это совершил ангел Божий, чтобы не осталась скрытою добродетельная жизнь священника, но дабы все узнали о ней и воздали хвалу Богу, прославляющему рабов Своих. Получив от жизни священника назидание, епископ отпустил его с миром и сильно порицал клеветников.'
        cn: '一位主教，真的认为他已经逃跑了，于是派主教宅邸的一个仆人去，吩咐他说：「你去看看神父是否在他的村子里，并且暂时什么都不要告诉他。」仆人去了，发现神父正在教堂里举行圣礼仪，回来后告诉主教：「他就在那里，我看到他正在举行神圣的崇拜仪式。」主教更加愤怒，发誓第二天早上他将以极大的羞辱把他带回来。


          第二天晚上，之前向神父显现的那位再次出现在神父面前，对他说：「我们走吧，到主教囚禁你的城里的看守之下。」那个年轻人带着神父，把他带回了监狱，以至于负责看守的人都不知道此事。第二天早上，主教从看守那里得知，神父不知怎么地又回到了看守之下。主教召见神父，并开始询问他，是如何在看守不知情的情况下离开监狱又回来的。他回答说，据他所说，一位美好的青年，穿着光亮的衣服，来自主教宅邸，打开了门，并且毫不阻碍地把他，这位神父，带到了一英里外的村庄。当晚又把他带回了这里。


          于是主教召集了主教宅邸的所有仆人，但神父一个也没有认出来。这时主教明白了，这是上帝的天使所为，为了不让神父的德行生活隐藏起来，而是让所有人都能知道并赞美上帝，祂荣耀祂的仆人。主教从神父的生活中得到教益后，平安地让他离开，并且严厉谴责了那些诽谤者。'
  - type: heading2
    initial:
      ru: '109.'
      cn: '109.'
    text:
      ru: Жизнь аввы Георгия, никогда не возмущавшегося.
      cn: 阿爸格奥尔基从未心烦意乱的生活。
    children:
    - type: paragraph
      text:
        ru: 'В монастыре св. Феодосия рассказывал нам о настоятеле этой обители, авве Георгии, ученик его авва Феодосий, сам отличавшийся благостью, кротостью и смирением. Он был потом епископом Капитолиадским: в течение двенадцати лет я наблюдал за ним, не увижу ли его возмущенным, хотя один раз, и никогда не видал. А между тем теперь здесь царит распущенность и непослушание... Кто так смиренно опускал очи, как отец наш св. Георгий? Кто затворял так слух свой, как он, блаженный? Кто обуздывал так свой язык, как отец наш? Какой солнечный луч так озарял землю, как отец наш просвещал сердца всех нас?'
        cn: '在圣费奥多西修道院，阿爸格奥尔基的门徒阿爸费奥多西，曾向我们讲述关于这位修道院院长的事迹。阿爸费奥多西本人以良善、温柔和谦卑著称。他后来成为卡皮托利亚斯主教：在十二年间，我观察着他，看他是否会哪怕一次被激怒，但从未见过。然而如今这里却充斥着放荡与不顺从……


          谁曾如此谦卑地垂下眼睛，像我们的圣父格奥尔基一样？谁曾如此关闭自己的听觉，像他，这位蒙福者一样？谁曾如此勒住自己的舌头，像我们的父一样？哪一道阳光如此照亮大地，像我们的父光照我们所有人的心一样？'
  - type: heading2
    initial:
      ru: '110.'
      cn: '110.'
    text:
      ru: Наставления св. старца египетского.
      cn: 埃及圣长老的训诲
    children:
    - type: paragraph
      text:
        ru: Взял я господина Софрония, и мы вместе с ним пришли в г. Александрии в лавру Октодекат к старцу великой добродетели, родом египтянину.
        cn: 我带着索福罗尼先生，我们一同来到亚历山大城，在奥克托德卡特拉夫拉，拜访了一位品德高尚、出身埃及的长老。
    - type: paragraph
      text:
        ru: – Дай нам совет, отче, как нам вместе жить, так как господин софист имеет намерение отречься от мира.
        cn: ——神父，请给我们建议，我们该如何一同生活，因为这位智者有意要舍弃世界。
    - type: paragraph
      text:
        ru: – Доброе дело, чадо, – отвечал старец, – что желаешь отречься от мира и спасти свою душу. Пребывайте в келлии, где пожелаете жить, трезвенно, молчаливо и в непрестанной молитве, и я уповаю на Бога, чадо, что он пошлет вам вразумление и просветит ваш ум.
        cn: 「做得好，孩子，」长者答道，「你愿意弃绝世界并拯救你的灵魂。居住在你希望住的修道室里，警醒地，静默地，并恒切祷告。我信赖上帝，孩子，祂会赐给你开导并光照你的心智。」
    - type: paragraph
      text:
        ru: – Если желаете спасения, – говорил он снова, – избегайте общений с людьми. Теперь мы непрестанно стучимся во все двери, обходим грады и страны, где только можем найти пищу сребролюбию или тщеславию и наполнить душу суетностью.
        cn: 他又说：「如果你们渴望得救，就避免与人交往。现在，我们不住地敲遍所有的门，走遍城邑和各国，凡是能找到贪财或虚荣之养料的地方，并让灵魂充满虚妄。」
    - type: paragraph
      text:
        ru: – И так будем убегать (от мира), чада! – сказал он еще раз, – ибо время близ есть.
        cn: – 因此，让我们逃离（世界）吧，孩子们啊！– 他再次说道，– 因为时候近了。
    - type: paragraph
      text:
        ru: – Увы, как много нам придется плакать и раскаиваться в том, в чем теперь не желаем каяться! – говорил также он. – Когда нас превозносят похвалами, мы не умеем смиряться, равно как – в противном случае – не можем переносить слов. Первое питает в нас славолюбие, второе причиняет нам, несчастным, скорбь. Но где скорбь и тщеславие, там нет ничего доброго. Великие и дивные отцы наши пасли многих. А я, недостойный, и одной овцы не могу упасти, напротив сам постоянно подвержен нападению зверей. Вся забота демонов в том только и состоит, чтобы ввергнуть душу в грех и потом довести до отчаяния с целью окончательно погубить. Демоны непрестанно внушают душе:«когда умрет и погибнет имя его?»(Пс. 40:6) Но если душа бодрствует, она сама будет вопиять против них:«не умру, но жив буду и повем дела Господня»(Пс. 117:17). Но демоны бесстыдны и снова устремляются на душу, внушая ей:«превитай по горам яко птица»(Пс. 10:1). На это у нас должен быть готов ответ:«той Бог мой и Спас мой, Заступник мой не преселюся»(Пс. 61:7).
        cn: ——唉，我们将来要多么多地哭泣和忏悔那些我们现在不愿忏悔的事情啊！——他亦如此说。——当我们被赞美高举时，我们不懂得谦卑，同样地，反之，我们也无法承受（批评的）言语。前者滋养我们里面的贪图虚名，后者则给我们这些不幸之人带来忧伤。然而，凡有忧伤和虚荣之处，就了无良善。我们那些伟大而奇妙的教父们牧养了许多人。而我，这个不配的人，连一只羊也无法牧养，反而自己却不断地遭受野兽的攻击。邪魔的全部心思仅仅在于将灵魂投入罪恶，然后使其陷入绝望，以便最终将其毁灭。邪魔们不停地对灵魂低语：「他的名何时消灭，何时灭亡呢？」（诗篇 40:6）但如果灵魂保持警醒，它自己就会向他们呼喊：「我必不致死，仍要存活，并要传扬主的作为。」（诗篇 117:17）但邪魔们是无耻的，又再次冲向灵魂，低语对它说：「你当像雀鸟飞往你的山！」（诗篇 10:1）对此我们必须准备好答案：「他真是我的上帝，我的拯救者，我的护卫者，我必不致动摇。」（诗篇 61:7）
    - type: paragraph
      text:
        ru: – Будь стражем сердца своего, – сказал в заключение старец, –  чтобы не вошел кто-либо чужой со словами:«наш ли еси ты, или от супостат?»(Нав.5, 13).
        cn: 「作你心灵的守卫，」这位长老最后说，「以免有外人闯入，说着话：『你是属我们的，还是属仇敌的？』(约书亚记 5:13)。」
  - type: heading2
    initial:
      ru: '111.'
      cn: '111.'
    text:
      ru: Поступок юродивого.
      cn: 圣愚的行为。
    children:
    - type: paragraph
      text:
        ru: Однажды в Александрии вместе с другом Софронием мы отправились в храм в честь Феодосия. Нам встретилcя человек плешивый, одетый во власяницу до самых колен. Он нам показался как бы юродивым.
        cn: 有一次在亚历山大，我和朋友索弗罗尼一同前往一座纪念狄奥多西的教堂。我们遇到一个人，他秃着头，穿着及膝的苦修毛衣。他看起来仿佛是一位圣愚。
    - type: paragraph
      text:
        ru: – Дай мне денег, сказал авва Софроний, и ты увидишь добродетель прохожего.
        cn: 「给我钱，」阿爸索福罗尼说道，「你就会看到路人的德行。」
    - type: paragraph
      text:
        ru: Даю ему пять фолер, а он отдал их тому, кто казался нам юродивым. Тот молча принял. Мы потихоньку шли за ним. Свернув в переулок, он простер правую руку с фолерами к небу, выше головы, потом повергся пред Богом и, положив деньги на землю, удалился.
        cn: 我给了他五枚弗勒，但他把它们给了那个在我们看来是圣愚的人。那人默默地接了过去。我们悄悄地跟在他后面。转入一条小巷后，他将拿着弗勒的右手高过头顶，伸向天空，然后俯伏在上帝面前，并将钱放在地上，离开了。
  - type: heading2
    initial:
      ru: '112.'
      cn: '112.'
    text:
      ru: Жизнь и смерть инока Льва из Каппадокии.
      cn: 卡帕多奇亚的修士列夫的生与死。
    children:
    - type: paragraph
      text:
        ru: 'В царствование благоверного императора и кесаря Тиверия мы пришли в Оазис. Там увидали инока, великого пред Богом, родом из Каппадокии. Имя ему было Лев. Нам многие и много дивного рассказывали о нем. Познакомившись с ним и близко узнав этого святого мужа, мы получили от него великую пользу – особенно от его смирения, безмолвия, нестяжательности и любви, которую он имел ко всем. Этот достопочтенный старец говорил нам:'
        cn: 在虔诚的皇帝和凯撒提比略统治时期，我们来到了绿洲。在那里我们遇见了一位隐修士，他在上帝面前是伟大的，他来自卡帕多奇亚。他的名字叫利奥。许多人向我们讲述了许多关于他的奇事。在结识并亲近这位圣人之后，我们从他那里获得了巨大的益处——特别是来自他的谦卑、静默、不贪财以及他对所有人的爱。这位可敬的长老对我们说：
    - type: paragraph
      text:
        ru: – Поверьте, чада, я буду царствовать.
        cn: ——孩子们，相信我，我将作王。
    - type: paragraph
      text:
        ru: – Что ты говоришь, авва? – отвечали мы. – Поверь нам – в Каппадокии не было ни одного царя. Понапрасну ты питаешь такие мысли.
        cn: ——您说什么，阿爸？——我们回答说。——请相信我们——在卡帕多西亚，连一位君王都没有过。您抱持这样的念头是枉然的。
    - type: paragraph
      text:
        ru: – Нет, чада! Я буду царствовать, – утверждал он...
        cn: ——不，孩子们！我将要作王，——他断言道……
    - type: paragraph
      text:
        ru: 'И никто не мог разубедить его. Когда мазики[1]сделали набег и разрушили всю тамошнюю страну, – пришли и в Оазис. Там многих иноков умертвили, а многих забрали в плен. В числе других взяли из лавры авву Иоанна, который прежде был чтецом в великой Константинопольской церкви, также авву Евстафия римлянина и авву Феодора. Все трое были немощны. В плену авва Иоанн говорит варварам: «Отведите меня в город. Епископ, по моей просьбе, заплатит вам за меня двадцать четыре номисмы». Один из варваров взял его и подвел его к городу. Авва Иоанн отправился к епископу. В городе оказался авва Лев и другие отцы: они не были захвачены. Придя к епископу, авва Иоанн стал просить его, чтобы он дал за него выкуп. Но у епископа нашлось не более восьми номисм, которые и были предложены варвару. Но тот не соглашался: «Или отдайте мне все двадцать четыре или монаха!» И принуждены были отдать варвару авву Иоанна, несмотря на его горе и слезы. Его отвели в стан варваров. Чрез три дня авва Лев, взяв восемь номисм, пошел в пустыню к варварам и обратился к ним со словами: «Возьмите меня и восемь номисм и отпустите иноков. Они немощны и не могут работать. Все равно – вам придется их убить. А я здоров и могу служить вам». Варвары согласились на его предложение и отпустили трех иноков. Авва Лев дошел с ними до какого-то места и, когда изнемог, был обезглавлен. Так авва Лев поступил по слову Писания:«больши сея любве никтоже имать, да кто душу свою положит за други своя»(Иоан.15:13). Тогда-то мы поняли смысл его слов: «Я буду царствовать». Действительно он достиг царственной высоты, положив душу свою за други своя.'
        cn: '没有人能够说服他。当马齐克人[1]发动劫掠，摧毁了当地整个国家时，他们也来到了绿洲。在那里，许多隐修士被杀害，许多被掳走为俘虏。在其他人中，他们从修道院带走了约翰修士，他曾是伟大的君士坦丁堡教会的诵经士；还有罗马人欧斯塔菲修士和提奥多尔修士。他们三人都很虚弱。


          在被囚禁期间，约翰修士对野蛮人说：「带我进城去。主教应我的请求，会为我向你们支付二十四诺米斯马。」其中一个野蛮人带他来到了城边。约翰修士前往拜访主教。城里有利亚修士和其他修士：他们没有被俘。约翰修士来到主教面前，请求他为自己支付赎金。但主教那里只有不超过八诺米斯马，这些钱便提供给了那个野蛮人。但那人不肯同意：「要么把全部二十四诺米斯马给我，要么就把隐修士给我！」他们被迫把约翰修士交给了野蛮人，尽管他悲痛流泪。他被带回了野蛮人的营地。


          三天后，利亚修士带着八诺米斯马，去了沙漠中的野蛮人那里，对他们说：「你们把我带走，拿走这八诺米斯马，然后释放那些隐修士。他们身体虚弱，不能劳作。反正你们最终也得杀了他们。而我身体健壮，可以为你们服务。」野蛮人同意了他的提议，释放了三位隐修士。利亚修士与他们一同走到某个地方，当他精疲力尽时，便被斩首了。利亚修士正是按照圣经的话语行事：「人为朋友舍命，爱就没有比这个大的了」 (约翰福音 15:13)。那时我们才明白他话语的含义：「我将作王。」他确实达到了君王般的高度，为朋友舍弃了自己的生命。'
  - type: heading2
    initial:
      ru: '113.'
      cn: '113.'
    text:
      ru: Совет аввы Иоанна, из Петры.
      cn: 阿爸伊阿尼的忠告，来自佩特拉。
    children:
    - type: paragraph
      text:
        ru: 'Пришли мы к авве Иоанну, из Петры: я и друг мой Софроний и просили у него наставления. Старец сказал нам: «Возлюбите нищету и воздержание. Поверьте мне: когда я еще в молодости был в скиту, один из отцов заболел селезенкою. В четырех лаврах скита искали немного уксусу и не могли найти. Такова была у них нищета и воздержание! А между тем отцов было около трех тысяч пяти сот человек».'
        cn: 我和我的朋友索弗罗尼来到来自佩特拉的亚巴·约安那里，向他请求指导。老人对我们说：「你们要爱贫乏和节制。相信我：当我年轻时还在隐修院的时候，有一位教父得了脾病。在隐修院的四个大隐修院里寻找一点醋，却找不到。他们就是如此贫乏和节制！而那时有大约三千五百位教父。」
  - type: heading2
    initial:
      ru: '114.'
      cn: '114.'
    text:
      ru: Рассказ об авве Данииле египетском.
      cn: 关于埃及的阿爸但以理的记述。
    children:
    - type: paragraph
      text:
        ru: 'В другой раз рассказал нам тот же старец об авве Данииле, родом из Египта. Однажды старец пришел в Теренуф продать свое рукоделие. Один молодой человек обратился к старцу с просьбою: «Ради Бога, зайди, добрый старец, в дом мой и сотвори молитву над женой моей, потому что она неплодна». По просьбе молодого человека, старец пришел к нему в дом и сотворил молитву над женою его. И по воле Божией, жена зачала во чреве. Тогда некоторые, не боящиеся Бога, стали клеветать на старца, говоря, что бесплоден -то был муж, а не жена. Жена зачала от аввы Даниила. Дошли эти речи и до старца. И послал старец сказать мужу: «Дай мне знать, когда родит твоя жена». После родов, муж известил старца: «По милости Божией и по твоим молитвам, отче, моя жена родила». Тогда авва Даниил, придя к нему в дом, сказал: «Устрой пиршество и созови на него твоих родственников и друзей». Во время пира, старец, взяв младенца на руки, сказал ему пред лицом всех:'
        cn: '另一次，同一位长老向我们讲述了籍贯埃及的阿爸·达尼尔的故事。有一次，这位长老来到特雷努夫出售他的手工艺品。一个年轻人恳求长老说：「看在上帝的份上，善良的长老啊，请到我家里来，为我的妻子祈祷，因为她不能生育。」应年轻人的请求，这位长老来到他家里，为他的妻子祈祷。于是，按着上帝的旨意，他的妻子怀孕了。


          于是，一些不敬畏上帝的人开始诽谤这位长老，说不能生育的其实是丈夫，而不是妻子，妻子是从阿爸·达尼尔那里怀的孕。这些话也传到了这位长老那里。这位长老派人告诉那个丈夫：「请在你妻子生产时通知我。」生产后，丈夫通知长老说：「凭着上帝的恩典和您的祈祷，父亲啊，我的妻子生了。」于是，阿爸·达尼尔来到他家里，说：「设一个宴席，邀请你的亲戚朋友前来。」宴席上，这位长老抱起婴孩，在众人面前对婴孩说：'
    - type: paragraph
      text:
        ru: – Кто твой отец?
        cn: – 谁是你的父亲？
    - type: paragraph
      text:
        ru: – Вот он! – ответил младенец, указав на молодого мужа своим пальцем.
        cn: – 就是他！ – 婴儿指着那位年轻男子，回答道。
    - type: paragraph
      text:
        ru: А младенцу было всего двадцать два дня. И все прославили Бога, хранящего истину – для тех, кто всем сердцем ищет Его.
        cn: 而那婴孩才只有二十二天大。众人便都赞美了上帝，祂保守着真理——为着那些全心寻求祂的人。
  - type: heading2
    initial:
      ru: '115.'
      cn: '115.'
    text:
      ru: Советы аввы Иоанна, игумена Раифского.
      cn: 阿爸约翰，拉伊法院长的建议。
    children:
    - type: paragraph
      text:
        ru: 'Авва Иоанн, киликиянин, игумен Раифский, наставлял братию, говоря: «Чада, удалившись от мира, будем удаляться и от вожделений плотских. Будем подражать отцам нашим – строгости и безмолвию, с какими они жили здесь. Да не оскверним, чада, места сего, которое отцы наши очистили от демонов. Здесь место подвижников, а не торговцев. Я застал здесь старцев, проживших семьдесят лет в этом месте и питавшихся только травою и финиками. Семьдесят шесть лет прожил я здесь, и много зол и ужасов претерпел от демонов».'
        cn: 阿爸·约安，基利家人，赖法修道院院长，教导弟兄们说：「孩子们，既然我们已经远离了尘世，我们也要远离肉体的欲望。我们要效法我们的教父们——他们在此地所过的严谨和静默的生活。孩子们，我们切不可玷污此地，我们的教父们曾将此地从邪魔中洁净。这是苦行者之地，而非商贾之地。我在这里曾遇到一些长老，他们在此地居住了七十年，并且只以草和椰枣为食。我在此地居住了七十六年，并且从邪魔那里忍受了许多邪恶和恐惧的折磨。」
  - type: heading2
    initial:
      ru: '116.'
      cn: '116.'
    text:
      ru: О брате, несправедливо обвиненном в похищении денег.
      cn: 论一位被不公正指控盗窃金钱的修士。
    children:
    - type: paragraph
      text:
        ru: 'Вот что слышали мы от аввы Андрея Мессинского: когда я был молод, отправились мы с аввою из Раифа и пришли в Палестину. Там мы остановились у одного старца. У принявшего нас старца была всего одна номисма, да и ту он потерял, забыв, где положил. Он заподозрил меня, как молодого человека, в краже монеты и сказал отцам того места, что брат Андрей взял у него монету. Узнал об этом мой авва и, призвав меня, спросил:'
        cn: 我们从迈锡尼的阿瓦·安德烈那里听到了以下内容：当我年轻的时候，我们和阿瓦从拉伊法出发，来到了巴勒斯坦。在那里，我们住在一位长老那里。接待我们的那位长老只有一枚诺米斯马，而且他也把那枚弄丢了，忘记放在哪里了。他怀疑我这个年轻人偷了那枚钱币，并告诉了当地的教父们，说安德烈修士拿了他的钱币。我的阿瓦听说了这件事，就把我叫来，问道：
    - type: paragraph
      text:
        ru: – Скажи, Андрей, ты взял номисму у старца?
        cn: – 说，安德烈，你从长老那里拿了诺米斯玛吗？
    - type: paragraph
      text:
        ru: '– Прости, авва: я не брал ничего.'
        cn: —— 饶恕我，阿爸：我什么都没拿。
    - type: paragraph
      text:
        ru: 'У меня был плащ, и я продал его за номисму. Придя к старцу, я поклонился ему и сказал:'
        cn: 我曾有一个斗篷，我把它卖了一个诺米斯马。来到长老那里，我向他下拜，并对他说：
    - type: paragraph
      text:
        ru: '– Прости меня, авва: сатана посмеялся надо мною – и я взял у тебя номисму.'
        cn: ——请您原谅我，阿爸：撒旦嘲弄了我，——我从您那里拿走了一枚诺米斯马。
    - type: paragraph
      text:
        ru: 'В келлии старца находился один мирянин. Старец отвечает мне:'
        cn: 在长老的隐修室里，有一位平信徒。长老回答我说：
    - type: paragraph
      text:
        ru: – Ступай, чадо, я ничего не потерял.
        cn: ——去吧，孩子，我什么都没失去。
    - type: paragraph
      text:
        ru: 'Снова бросился я к ногам старца со словами:'
        cn: 我再次扑倒在长老的脚下，说道：
    - type: paragraph
      text:
        ru: – Ради Господа, возьми номисму – вот она! И сотвори обо мне молитву, потому что сатана внушил мне украсть ее и огорчить тебя.
        cn: ——看在主的份上，请收下这诺米斯马——就在这里！并请为我祈祷，因为撒旦唆使我偷走它，并使你忧伤。
    - type: paragraph
      text:
        ru: – Чадо, я вовсе не терял ничего, – снова то же самое сказал старец.
        cn: ——孩子，我什么都没失去，——长老又说了同样的话。
    - type: paragraph
      text:
        ru: 'Но я не слушал старца. Тогда мирянин сказал мне: «Действительно, брат, придя вчера к старцу, я нашел его в слезах, в большой скорби, на поклонах. Увидев старца в такой скорби, я спросил его: сделай милость, скажи мне, что с тобой? Старец ответил мне: я оклеветал брата, будто он взял номисму, между тем я нашел ее там, где сам положил». Так старец получил тогда от меня назидание. Не бравши номисмы, я принес ее ему и сказал: «Возьми номисму, так как я взял ее».'
        cn: 但是我没有听从长老。于是那平信徒对我说：「确实，弟兄，我昨天来找长老时，发现他正在流泪，在巨大的悲伤中，正在叩拜。看到长老如此悲伤，我问他：『求你，告诉我，你怎么了？』长老回答我：『我诽谤了弟兄，说他拿了那枚金币，然而我却发现它在我自己放的地方。』」这样，长老当时从我这里得到了教益。我虽然没有拿那枚金币，却把它带给他，并说：「拿这枚金币吧，因为是我拿的。」
  - type: heading2
    initial:
      ru: '117.'
      cn: '117.'
    text:
      ru: О брате бесноватом, исцеленном аввою Андреем раифским.
      cn: 论被赖夫的阿爸安德烈治愈的附魔修士。
    children:
    - type: paragraph
      text:
        ru: Один брат, одержимый злым духом, пришел на «Дивную гору» к Симеону Столпнику и просил его, чтобы он молитву сотворил о нем и изгнал из него демона.
        cn: 一位被恶灵附身的弟兄来到「奇妙山」，去见西缅·斯提列提斯，并请求他为他做祈祷，从他身上驱逐邪魔。
    - type: paragraph
      text:
        ru: – Где ты живешь? – спросил его авва Симеон.
        cn: —你住在哪里？—阿爸西蒙问他。
    - type: paragraph
      text:
        ru: – В Раифе.
        cn: ——在赖法。
    - type: paragraph
      text:
        ru: '– Удивляюсь, брат, на тебя: какой ты подвиг совершил, предприняв такое путешествие, чтобы дойти до меня, грешного, когда в твоей лавре живут столь великие отцы. Ступай к авве Андрею и поклонись ему, чтобы он помолился о тебе, – и он немедленно исцелит тебя.'
        cn: – 兄弟，我很惊讶你：你竟为了来找我这个罪人， совер下了如此壮举，踏上了如此旅程，而你的修道院里却住着那么多伟大的长老。去阿爸安德烈那里，向他叩拜，好让他为你祈祷，他就会立刻治好你。
    - type: paragraph
      text:
        ru: 'Придя в Раиф, брат бросился к ногам аввы Андрея, как повелел ему авва Симеон:'
        cn: 来到拉伊夫，修士俯伏在安德烈长老的脚下，正如西缅长老所吩咐的：
    - type: paragraph
      text:
        ru: – Помолись обо мне, авва!
        cn: – 请为我祷告，阿瓦！
    - type: paragraph
      text:
        ru: – Авва Симеон получил дар исцелений, – сказал в ответ авва Андрей. И сотворил молитву. Брат немедленно исцелился и воздал благодарность Богу.
        cn: 「阿巴·西缅获得了医治的恩赐，」阿巴·安德烈回答说。并作了祷告。弟兄立即得了医治，并向上帝献上感谢。
  - type: heading2
    initial:
      ru: '118.'
      cn: '118.'
    text:
      ru: Жизнь Мины, инока раифского.
      cn: 拉伊法修道士米纳传
    children:
    - type: paragraph
      text:
        ru: 'Вот что рассказал нам авва Сергий раифский об одном брате, бывшем у них диаконом, которого звали Миною: однажды он удалился в мир для служения. Что было с ним, мы не знаем, кроме того, что он снял с себя иноческую одежду и стал мирским человеком. Спустя много времени он пошел в Феополь и, проходя Селевкию, увидал издали монастырь св. аввы Симеона Столпника. «Дай-ка я зайду, – сказал он сам себе, – посмотрю на великого Симеона». Раньше ему никогда не приходилось увидать его. Пошел и приблизился к столпу. Лишь только увидал его авва Симеон, узнал, что он прежде был иноком и посвящен был во диакона. Подозвав слугу, сказал ему: «Принеси-ка сюда ножницы». Тот принес. «Благословен Господь! Постриги его», – сказал Симеон, указывая пальцем на Мину, так как около столпа стояло много народу. Изумившись словам старца и придя в то же время в великий страх, он принял пострижение, не произнеся ни одного слова. Ему пришло на мысль, что Сам Бог открыл св. старцу все, что случилось с ним. «Соверши диаконскую молитву!» – сказал авва Симеон. И когда тот исполнил повеление, святой старец продолжал: «Возвратись в Раиф, откуда ушел ты!» Мина отвечал, что ему стыдно и не вынести взоров людских. «Поверь мне, чадо, – возразил старец, – тебе нечего будет стыдиться. С веселым лицом и с радостью примут тебя отцы. Они возликуют о твоем возвращении. Знай: Бог явит тебе знамение – и ты поймешь, что Его милосердие простило тебе грех твой». Действительно, по приходе его в Раиф, отцы приняли его с распростертыми объятиями и допустили его до священнослужения. Однажды, в воскресный день, когда нес он святую и животворящую Кровь Великого Бога и Спаса нашего Иисуса Христа, внезапно выпал у него глаз. Из этого знамения познали, что Бог простил ему грех, по слову праведного Симеона.'
        cn: '拉伊夫的阿巴·谢尔吉乌斯向我们讲述了他们那里曾有一个名叫弥努的执事修士的故事：有一次，他为了服务而回到了尘世。他身上发生了什么，我们不得而知，只知道他脱下了修士服，变成了尘世之人。


          过了很久，他去了提奥波利斯，当他经过塞琉西亚时，从远处看到了圣阿巴·西美翁·斯图里特修道院。他自言自语道：「让我进去，看看伟大的西美翁。」以前他从未见过他。他走过去，靠近了柱子。阿巴·西美翁一看到他，就认出他以前是个修士，并且曾被祝圣为执事。他叫来仆人，对他说：「把剪刀拿过来。」仆人拿了过来。西美翁用手指着弥努说：「愿主受赞美！给他剃度吧。」因为柱子旁边站着许多人。弥努对这位长老的话感到惊讶，同时心中充满了极大的敬畏，他接受了剃度，一句话也没说。他心里想，是上帝亲自向圣长老显明了发生在他身上的一切。


          阿巴·西美翁说：「献上执事祷告！」当弥努遵行了吩咐之后，圣长老继续说：「回到拉伊夫去，就是你离开的地方！」弥努回答说，他感到羞愧，无法承受世人的目光。长老反驳说：「相信我，孩子，你没有什么可羞愧的。弟兄们会以喜乐的容颜和欢欣迎接你。他们会为你的归来而欢呼雀跃。要知道：上帝会向你显明一个记号，借此你将明白，祂的怜悯已经赦免了你的罪。」


          果然，当他回到拉伊夫后，弟兄们张开双臂欢迎了他，并允许他重新参与神圣事奉。有一次，在主日，当他手持我们的伟大上帝和救主耶稣基督的圣洁并赐予生命之血时，他的眼睛突然掉了出来。从这个记号，他们得知上帝已经赦免了他的罪，正如义人西美翁所言。'
  - type: heading2
    initial:
      ru: '119.'
      cn: '119.'
    text:
      ru: О явлении диавола в одежде инока в келье старца раифского.
      cn: 关于魔鬼身着修士装束在拉伊法长老独修室的显现。
    children:
    - type: paragraph
      text:
        ru: 'Однажды мы пришли к авве Евсевию, пресвитеру лавры Раифской. Он сказал нам, что в келлию старца в иноческом одеянии явился диавол. На стук в дверь старец отворил и сказал ему: «Произнеси молитву!» Диавол произнес: «Ныне, и присно, и во веки веков. Аминь». Старец трижды заставлял его сотворить молитву, и диавол все говорил: «Ныне, и присно, и во веки веков». «Недобро ты пришел, –  сказал старец. – Сотвори молитву и скажи: Слава Отцу, и Сыну, и Св. Духу, всегда, ныне, и присно, и во веки веков. Аминь». После этих слов диавол исчез, как бы убегая от огня.'
        cn: 有一次，我们去拜访拉伊法隐修院的司祭阿巴·叶夫谢维。他告诉我们，魔鬼曾穿着修士的衣服，出现在一位长老的小室里。听到敲门声，这位长老开门对他说：「诵念祷文！」魔鬼念道：「现在，直到永远，世世代代。阿门。」长老三次强迫他诵念祷文，魔鬼一直只说：「现在，直到永远，世世代代。」「你来得不怀好意，」长老说，「诵念祷文，并说：『荣耀归于父，及子，及圣灵，总是如此，现在，直到永远，世世代代。阿门。』」话音刚落，魔鬼便消失了，仿佛逃避烈火一般。
  - type: heading2
    initial:
      ru: '120.'
      cn: '120.'
    text:
      ru: О трех умерших иноках, найденных фаранскими рыбаками.
      cn: 关于法兰渔民所发现的三位逝世隐修士。
    children:
    - type: paragraph
      text:
        ru: 'Фаранские рыбаки рассказали нам следующее: однажды мы прибыли в Вухри по ту сторону Красного моря. Наловив много рыбы, мы стали возвращаться и приблизились к Птелею. Отсюда мы намеревались переправиться в Раиф, но были задержаны противными ветрами. В течение девяноста дней бури на море не утихали. Проходя там великой пустыней, мы нашли под одной скалой трех скончавшихся отшельников. Они были одеты в нижнее платье, а плащи их лежали подле них. Мы подняли их и отнесли на корабль, и немедленно море успокоилось, и противные ветры переменились на благоприятные. Благодаря им, мы переправились и прибыли в Раиф. Тамошние отцы похоронили их с древними старцами.'
        cn: 法兰的渔夫这样告诉我们：有一次，我们抵达了红海对岸的乌赫里。捕获了许多鱼后，我们便启程返回，并靠近了普特勒伊。从此处我们本打算渡海前往拉伊夫，却被逆风所阻。在九十天里，海上风暴没有平息。我们在那里行经一片浩瀚的沙漠时，在一块岩石下发现了三位已故的隐修者。他们身穿内衣，而他们的斗篷则躺在他们身边。我们抬起了他们，并带到船上，随即海面平静了下来，逆风也转变成了顺风。因着他们，我们得以渡海并抵达拉伊夫。那里的教父们将他们与古代的长老们一同安葬了。
  - type: heading2
    initial:
      ru: '121.'
      cn: '121.'
    text:
      ru: О кончине аввы Григория византийского и аввы Григория фаранского.
      cn: 论阿爸拜占庭的格里高利与阿爸法兰的格里高利的离世。
    children:
    - type: paragraph
      text:
        ru: 'Отцы того же места (раифские) рассказали нам об авве Григории византийском и об ученике его авве Григории фаранском, что они поселились на каком-то острове Красного моря. На этом острове не было совсем воды, но они доставали себе воду с материка, так как имели при себе судно, на котором и привозили воду. Однажды они спустили судно в море, привязавши его к скале. Но в ту ночь произошла буря на море, веревка оборвалась, и судно погибло. Тогда отцы остались совсем без воды. Прошло восемь месяцев. Прибыли на остров раифские иноки и нашли обоих мертвыми. На спине черепахи нашли надпись: «Авва Григорий фаранский, не пивши воды в течение двадцати восьми дней, скончался, а я – проживши без воды тридцать семь дней»... Нашли того и другого невредимыми и, взяв их, похоронили в Раифе.'
        cn: 同地（拉伊法）的教父们告诉了我们有关拜占庭的阿爸格里戈里和他的门徒，法兰的阿爸格里戈里，他们定居在红海的一个岛上。这个岛上完全没有水，但他们从大陆取水，因为他们有一艘船，用它运送水。有一次，他们把船放入海中，把它系在岩石上。但那天晚上，海上发生了风暴，绳子断了，船也毁了。于是这两位教父完全没有水了。八个月过去了。拉伊法的修士们来到岛上，发现两人都死了。他们在一只乌龟的背上发现了一段文字：「法兰的阿爸格里戈里，断水二十八天后去世了，而我——没有水生活了三十七天。」他们发现两人都完好无损，便将他们带走，安葬在拉伊法。
  - type: heading2
    initial:
      ru: '122.'
      cn: '122.'
    text:
      ru: О двух иноках, которые взошли нагие для причащения во храм и не были никем видимы, кроме аввы Стефана.
      cn: 关于两位修士赤身进入殿中领圣体，除了阿跋·司提反之外没有被人看见。
    children:
    - type: paragraph
      text:
        ru: 'Мы пришли на гору Синай, к авве Стефану, из Каппадокии. Он рассказал нам: за несколько лет пред сим я был в Раифе, на праздник Тайной Вечери я пришел вцерковь. Совершалась литургия, и все отцы предстояли в храме, и вот я вижу, что в храм пришли какие-то два отшельника. Они были наги, и никто из отцов не заметил этого, кроме меня. Причастившись св. Таин, они вышли из храма и стали удаляться. Я также вышел вместе с ними. Когда мы были уже вне храма, я повергся пред ними со словами: «Сделайте милость, возьмите меня с собою». Поняв, что я видел их наготу, они сказали мне: «Ты – в хорошем месте. Будь спокоен». Но я снова стал просить их, чтобы взяли меня с собой. Они ответили мне: «Не можешь ты быть с нами. Оставайся на своем месте. Тут хорошо». Помолившись обо мне, они, на моих глазах, вступили на воды Красного моря и прошли чрез него.'
        cn: '我们来到西奈山，拜访来自卡帕多基亚的长老司提反。


          他告诉我们：几年前，我曾在拉伊法，在圣餐节那天我来到教堂。圣礼正在举行，所有的教父们都侍立在圣殿中，我看见有两个隐修士来到圣殿。他们是赤身露体的，并且除了我以外，没有一位教父注意到这一点。领受了圣奥秘后，他们走出了圣殿，并渐渐走远了。我也和他们一同出去。当我们已经离开圣殿时，我俯伏在他们面前，说道：「请发慈悲，带我一同去吧。」他们明白我看见了他们的赤身露体，便对我说：「你身处佳处。要平静。」但我再次恳求他们带我一同去。他们回答我：「你不能与我们同在。留在你自己的地方吧。这里很好。」为我祷告之后，他们在我眼前，踏上红海的水面，并穿越了它。'
  - type: heading2
    initial:
      ru: '123.'
      cn: '123.'
    text:
      ru: Об авве Зосиме киликийском.
      cn: 论基利家籍的阿爸佐西马。
    children:
    - type: paragraph
      text:
        ru: 'Пришлось побывать у аввы Зосимы киликиянина, когда он жил на горе Синае. Старец отказался от епископства и вернулся в свою келлию. Это был великий подвижник. Вот что он рассказал мне: в молодости я ушел с горы Синая и пришел в Аммониак, чтобы там поселиться. Там я нашел старца, одетого во власяницу. Не успел я еще дать ему приветствие, как он сказал: «Зосима, зачем ты пришел сюда? Уйди отсюда! Ты не можешь остаться здесь». Рассудив, что он знает меня, я бросился к его ногам.'
        cn: 我曾有机会拜访在西奈山居住的阿巴·佐西马斯·基利基亚人。这位长老拒绝了主教职分，回到了他的隐修小室。他是一位伟大的苦行者。他这样对我讲述道：在我年轻的时候，我离开了西奈山，来到了安摩尼亚克，以便在那里定居。在那里我找到了一位身穿发衣的长老。我还没来得及向他致敬，他就说：「佐西马斯，你来这里做什么？离开这里！你不能留在这里。」我心想他认识我，于是我扑倒在他的脚前。
    - type: paragraph
      text:
        ru: – Сделай милость, старче, скажи мне, почему ты знаешь меня?
        cn: – 请您施恩，长老，告诉我，您为何认识我？
    - type: paragraph
      text:
        ru: '– За два дня, – отвечал он, мне – явился некто и сказал: «Вот к тебе придет инок Зосима. Не дозволяй ему оставаться здесь, потому, что я хочу вверить ему вавилонскуюцерковьв Египте».'
        cn: 他回答我说：「两天前，有位向我显现，并说：『看哪，修士佐西马将到你这里来。不要让他留在这里，因为我想要将埃及的巴比伦教会托付给他。』」
    - type: paragraph
      text:
        ru: 'И замолчав, старец отошел от меня на полет брошенного камня. Простояв на молитве около двух часов, он снова подошел ко мне и, поцеловав мне чело, сказал:'
        cn: 于是，在静默之后，长老离我而去，约一石之遥。站立祈祷了大约两个小时后，他再次走近我，亲吻了我的额头，说道：
    - type: paragraph
      text:
        ru: – Воистину, чадо, ты к добру пришел. Сам Бог привел тебя сюда, чтобы похоронить меня.
        cn: ——实在地，孩子，你来得是好的。是神亲自带你来这里的，好安葬我。
    - type: paragraph
      text:
        ru: – А сколько лет провел ты здесь, авва?
        cn: – 那你在这里度过了多少年，阿爸？
    - type: paragraph
      text:
        ru: – Сорок пять лет исполнилось... И вдруг лицо его стало как бы огненным...
        cn: – 四十五岁了……忽然他的脸变得如同火焰一般。
    - type: paragraph
      text:
        ru: – Мир тебе, чадо, помолись обо мне! – сказав это, раб Божий лег и почил. Вырыв яму, я похоронил его и чрез два дня отошел, прославляя Бога.
        cn: 「愿你平安，孩子，为我祷告吧！」——说完这话，上帝的仆人躺下安息了。我挖了个坑，将他埋葬了，两天后便离开了，赞美着上帝。
  - type: heading2
    initial:
      ru: '124.'
      cn: '124.'
    text:
      ru: Рассказ аввы Зосимы о себе самом.
      cn: 阿爸卓西马的自述。
    children:
    - type: paragraph
      text:
        ru: 'Тот же старец рассказал нам следующее: двадцать два года тому назад приходил я в Порфирит, желая поселиться там. Взял с собою и ученика своего Иоанна. Прибыв на место, мы нашли там двух отшельников и поселились поблизости от них. Один из них был родом из Милета, по имени Феодор, а другой Павел – из Галатии. Феодор был из монастыря аввы Евфимия. Оба носили одежды из кожи газели. Я прожил там около двух лет. Между нами было расстояние в две стадии. Однажды мой ученик сидел, и его укусила змея, отчего он внезапно скончался, весь истекая кровью. В большом горе прихожу я к отшельникам. Увидав меня в большом расстройстве и скорби, – прежде чем я успел им поведать о своем горе, они спросили меня:'
        cn: 同一位长老向我们讲述了以下这件事：二十二年前，我曾来到波尔菲里特，希望能在那里定居。我也带上了我的门徒约安。抵达那里后，我们发现那里有两位隐修士，并在他们附近定居下来。其中一位来自米利都，名叫提奥多尔；另一位名叫保罗，来自加拉提亚。提奥多尔来自阿巴·欧西米乌斯修道院。他们二人身穿羚羊皮衣。我在那里居住了大约两年。我们之间相距两斯塔迪亚。有一天，我的门徒约安坐着，一条蛇咬了他，他因此猝然离世，全身淌血不止。我悲痛欲绝地来到那些隐修士那里。他们见我情绪极其紊乱，悲伤不已——在我来得及向他们倾诉我的悲伤之前，他们就问我：
    - type: paragraph
      text:
        ru: – Что с тобой, авва Зосима? Умер брат твой?
        cn: – 你这是怎么了，阿爸卓西马？你的弟兄去世了吗？
    - type: paragraph
      text:
        ru: – Да! – говорю им.
        cn: – 是的！– 我对他们说。
    - type: paragraph
      text:
        ru: 'Придя вместе со мною и увидав его распростертым по земле, они сказали мне: «Не печалься, авва Зосима. Бог милостив!» И, воззвавши к умершему, сказали: «Брат Иоанн, встань! Ты нужен старцу!» И брат тотчас поднялся с земли. Найдя зверя и взяв его, они пред нами рассекли его надвое. Потом сказали мне: «Авва Зосима, ступай на Синай. Бог хочет вверить тебецерковьв Вавилоне (египетском)». И мы немедленно удалились. Когда мы вернулись на Синай, авва синайской обители спустя немного времени послал меня и еще двоих в Александрию. Блаженнейший Аполлинарий, папа Александрийский, принял нас и поставил всех троих епископами: одного – в Илиополь, другого – в Леонтополь, а меня – в Вавилон.'
        cn: '他们与我一同前来，看见他俯卧在地，便对我说：「不要忧伤，阿瓦·佐西马。上帝是仁慈的！」然后，他们呼唤那死者，说：「弟兄约安，起来！长老需要你！」那弟兄立刻从地上站了起来。他们找到那野兽，抓住它，在我们面前把它劈成两半。之后他们对我说：「阿瓦·佐西马，去西奈吧。上帝想将巴比伦（埃及的）的教会托付给你。」我们便立刻离开了。


          当我们回到西奈时，西奈修道院的阿瓦不久便派了我以及另外两人前往亚历山大。至福者阿波利纳里，亚历山大教宗，接待了我们，并祝圣我们三人为主教：一人前往赫利奥波利斯，另一人前往莱翁托波利斯，而我则前往巴比伦。'
  - type: heading2
    initial:
      ru: '125.'
      cn: '125.'
    text:
      ru: Подвиг аввы Сергия отшельника.
      cn: 隐士阿爸谢尔盖的苦修事迹。
    children:
    - type: paragraph
      text:
        ru: 'На Синае некоторые из отцов рассказали нам об отшельнике авве Сергии. Во время пребывания его на Синае эконом приставил его смотреть за лошаками. Однажды он шел с ними – и вот лев залег па пути. Увидали льва лошаки и их погонщики и, объятые ужасом, разбежались. Тогда авва Сергий, взяв из своей сумы один хлеб, подошел ко льву и говорит ему: «Прими благословение отцов и уйди с дороги, чтобы пройти нам». Лев взял хлеб и удалился.'
        cn: 在西奈山，有些教父告诉我们关于隐修士阿巴·谢尔盖的故事。他在西奈山期间，执事派他照看骡子。有一次，他和它们一起走，结果一只狮子卧在路上。骡子和它们的赶骡人看到了狮子，并且被恐惧笼罩着，四散奔逃。于是阿巴·谢尔盖从他的袋子里拿出一个面包，走到狮子面前对它说：「接受教父们的祝福，并且离开这条路，好让我们过去。」狮子拿走了面包，并且离开了。
  - type: heading2
    initial:
      ru: '126.'
      cn: '126.'
    text:
      ru: Ответ аввы Орента, на горе Синайской.
      cn: 阿爸奥伦特在西奈山上的答复。
    children:
    - type: paragraph
      text:
        ru: 'Отцы того же места рассказывали нам об авве Оренте. Однажды в воскресенье вошел он вцерковь, вывернув свою одежду и надев ее шерстью вверх. Когда он стал в хоре, ему стали говорить:'
        cn: 同地的教父们曾向我们讲述阿巴·奥连特的事迹。有一次，在一个主日，他进入教堂，却把自己的衣服翻过来，毛面朝外穿上。当他站立在诗班中时，人们便对他说：
    - type: paragraph
      text:
        ru: – Старче, зачем ты пришел в таком виде, – ты ведь бесчестишь нас пред чужими.
        cn: 「长老啊，你为何以这副模样前来？你这样真是令我们在外人面前蒙羞啊。」
    - type: paragraph
      text:
        ru: – Вы извратили Синай, и никто вам ничего не говорит, а меня укоряете за то, что я выворотил одежду?  Подите – исправьте то, что вы извратили, и я исправлю то, что я извратил.
        cn: 「你们扭曲了西奈，却没有一人责备你们，你们却因我翻转了衣服而责备我？去吧——改正你们所扭曲的，我就会改正我所扭曲的。」
  - type: heading2
    initial:
      ru: '127.'
      cn: '127.'
    text:
      ru: Жизнь аввы Георгия с горы Синая и поступок благочестивой старицы из Галатии фригийской.
      cn: 亚巴·格奥尔基（来自西奈山）的生平以及弗里吉亚加拉太一位虔诚老妇人的善行。
    children:
    - type: paragraph
      text:
        ru: Вот что рассказывала нам игумения Дамиана, жившая в уединении, мать аввы Афиногена, епископа Петрского.
        cn: 以下是达米亚娜女隐修院院长告诉我们的，她过着隐居生活，她是彼特拉斯主教阿提诺革涅斯长老的母亲。
    - type: paragraph
      text:
        ru: 'На св. горе Синае был игумен, по имени Георгий, великий подвижник. Когда авва сидел в своей келлии в Великую Субботу, ему пришла мысль: «Пойду-ка я, встречу Светлое Христово Воскресение во св. граде и причащусь Св. Таин во св. храме Воскресения Христа, Бога нашего». Целый день старец держал эту мысль в уме и молился. Настал вечер. Приходит ученик и говорит ему: «Благослови, отче, идти на правило». Старец отвечал: «Иди и когда настанет час св. Причащения, приди за мною». Сам все время оставался в келлии. Когда настало время св. Причащения во св. храме Воскресения (в Иерусалиме), старец появился подле блаженного епископа Петра, и он преподал ему Св. Тайны вместе с пресвитерами. Потом патриарх спросил своего сидкелла Мину:'
        cn: 在西奈圣山有一位名叫格奥尔基的院长，他是一位伟大的苦修者。当阿爸（Abba）在大圣周六坐在自己的隐修室里时，他有了一个念头：「我这就去圣城迎接基督光明复活节，并在我们的神基督复活圣殿里领受圣奥秘。」这位长老一整天都在心里思索这个念头并祈祷。夜晚降临。弟子前来对他说：「请祝福，父亲，我去行功课。」长老回答道：「你去吧，当领受圣奥秘的时刻到来时，来找我。」他自己则一直留在隐修室里。当复活圣殿（在耶路撒冷）领受圣奥秘的时间到来时，这位长老出现在蒙福的彼得主教身边，主教与众司祭一同将圣奥秘分施给他。然后，宗主教问他的近侍米纳：
    - type: paragraph
      text:
        ru: – Когда прибыл авва Синайский?
        cn: ——西奈的阿爸何时抵达？
    - type: paragraph
      text:
        ru: – Молитвами твоими, владыко... Я не видел его, владыко, раньше... только теперь увидал...
        cn: ——凭着您的祈祷，主教大人……我以前没有见过他，主教大人……只是现在才见到他……
    - type: paragraph
      text:
        ru: – Скажи ему, чтобы не уходил, – приказал патриарх синкеллу. – Я желаю, чтобы он разделил со мною трапезу.
        cn: – 吩咐他不要离开， – 宗主教命令主教助理说。 – 我希望他能与我一同进膳。
    - type: paragraph
      text:
        ru: 'Синкелл передал слова патриарха старцу. Тот ответил:'
        cn: 辛克尔将牧首的话语转达给了长老。那位回答说：
    - type: paragraph
      text:
        ru: '– Да будет воля Божия! Богослужение окончилось, старец поклонился св. гробу и – очутился в своей келлии. Ученик стучится к нему и говорит: «Повели, отче! Пришло время причащения». Старец пошел вцерковьвместе с учеником и причастился. Между тем архиепископ Петр, опечаленный тем, что старец ослушался его, после праздника послал старцу послание, также и к епископу Фаранскому, авве Фотию и к отцам синайским, чтобы они привели к нему авву Георгия. Письма были доставлены по назначению. Тогда авва со своей стороны послал к патриарху трех пресвитеров: авву Стефана каппадокийца, великого старца, авву Зосиму, о котором раньше упоминали, и авву Дулкетия римлянина. Старец оправдывался в письмах и говорил: «Да не будет того, святейший владыко, чтобы я презрел св. вестника вашего. Да будет ведомо Вашему Блаженству, – писал далее, – что мы чрез шесть месяцев встретимся пред лицом Господа Христа, Бога нашего, и там я поклонюсь вам». Отправленные пресвитеры вручили письмо патриарху, причем сказали, что старец уже много лет как не ходил в Палестину. Представили ему и послание фаранского епископа, удостоверявшего в том, что старец уже около семидесяти лет не отлучался со св. горы Синая. Тогда блаженный и благостный архипастырь Петр выставил свидетелями бывших за литургиею в день Пасхи епископов и клир, подтвердивших, что они видели старца и приветствовали его святым целованием (христосовались с ним). После того прошло шесть месяцев: старец и патриарх действительно скончались, согласно предсказанию старца. Та же мать Дамиана вот что еще рассказала нам: прежде моего удаления в затвор, однажды, в пятницу, я пришла вцерковьсвв. Космы и Дамиана и провела там всю ночь. Пришла также под вечер одна старица, родом из фригийской Галатии и начала раздавать всем бывшим во храме по две лепты. Я знала ее и раньше, потому что часто она и мне подавала. Однажды прибыла на богомолье во св. град и прожила здесь год двоюродная сестра – моя и благоверного императора Маврикия. Я взяла ее, и мы отправились к свв. Косьме и Дамиану. В храме я говорю своей родственнице:'
        cn: '——愿上帝旨意成就！神圣礼仪结束后，长老向圣墓敬拜，之后他便身处自己的修士小室里。弟子敲门进来对他说：「父亲，请吩咐！领受圣体圣血的时候到了。」长老便与弟子一同去了教堂，并领受了圣体圣血。


          与此同时，总主教彼得因长老违抗他而悲伤，在节庆之后给长老送去了一封信函，也同样给法兰主教、阿跋弗提，以及西奈的教父们写了信，让他们把阿跋格奥尔基带到他那里。信函如期送达目的地。于是阿跋也派了三位司祭到宗主教那里：卡帕多基亚的阿跋司提反（一位伟大的长老），之前提到过的阿跋佐西马，以及罗马人阿跋杜尔凯提。长老在信函中为自己辩解道：「至圣的主啊，绝不会有这样的事，我怎会轻蔑您的圣使者呢？愿您的至福者知晓，——他接着写道——六个月后，我们将在我们的上帝基督主的面容前相见，那时我将在那里向您敬拜。」 派出的司祭们将信函呈交给宗主教，并且说明长老已经多年未曾去过巴勒斯坦。他们也向他呈交了法兰主教的信函，信中证实长老已约七十年未曾离开过西奈圣山。于是，蒙福又仁慈的总牧者彼得请了那些在逾越节当天参与了神圣礼仪的主教们和圣职人员作证，他们证实曾见过长老，并以圣洁的吻（互祝基督复活）向他致意。此后六个月过去了，长老和宗主教确实逝世了，正如长老的预言。


          同样的达米阿那嬷嬷还给我们讲述了以下的事情：在我退隐过隐修生活之前，有一次，在星期五，我去了圣科斯马和达米阿那教堂，并在那里度过了一整夜。黄昏时分，也来了一位老年妇女，她是弗里吉亚加拉太人，开始给所有在圣殿里的人分发两枚小钱。我以前就认识她，因为她也常常给我施舍。有一次，我的表姐——也就是虔诚的毛里求斯皇帝的表姐——来到圣城朝圣，并在圣城住了一年。我带着她，我们去了圣科斯马和达米阿那教堂。在圣殿里，我对我的亲戚说：'
    - type: paragraph
      text:
        ru: – Смотри, моя дорогая, вот идет старушка, подающая каждому по две лепты. Ты не церемонься – возьми.
        cn: ——瞧，我亲爱的，一位老妇人走过来了，她正给每人两文钱。你别客气——拿去吧。
    - type: paragraph
      text:
        ru: – Что ж? Кто мне прикажет взять? – возразила она с гневом.
        cn: ——那又怎样？谁能命令我拿呢？」她怒气冲冲地反驳道。
    - type: paragraph
      text:
        ru: – А все-таки возьми, – говорю ей. – Эта женщина велика в очах Божиих. Всю неделю она проводит в посте и что ни заработает в течение недели – все раздает во храме. Она вдова и ей уже около восьмидесяти лет от роду. Возьми же у ней и потом отдашь другому. Только не отвергай милостыни старушки.
        cn: ——无论如何还是收下吧，我对她说。——这个女人在上帝眼中是伟大的。她整个星期都禁食，并且她这一周所赚的一切——全都施舍给了圣殿。她是个寡妇，年纪已经将近八十岁了。你就从她那里收下吧，之后再给别人。只是不要拒绝这位老妇人的施舍。
    - type: paragraph
      text:
        ru: 'Во время разговора подходит старушка. Проходя, она подавала каждому тихо и молчаливо. Но, подавши моей родственнице, сказала: «Возьми и съешь». Когда она ушла, мы догадались, что Бог открыл наш разговор: «Возьми и отдай нищему». Моя родственница послала слугу – купить, на две лепты бобов. Скушав их, она утверждала именем Божиим, что бобы были сладки, как мед, не мало дивилась и прославляла Бога, дарующего благодать рабам Своим.'
        cn: 谈话期间，一位老妇人走了过来。她经过时，悄无声息地、默默地递给每一个人。但是，当她递给我的一位亲戚时，她说道：「拿去吃吧。」当她离开后，我们才明白，上帝揭示了我们谈话的内容：「拿去给穷人。」我的亲戚派了一个仆人，去买了两文钱的豆子。吃了这些豆子，她奉上帝的名郑重声明，这些豆子甜如蜜，她大为惊叹，并赞美赐予祂的仆人恩典的上帝。
  - type: heading2
    initial:
      ru: '128.'
      cn: '128.'
    text:
      ru: Жизнь Аделфия, епископа Арабесского, и о св. Иоанне Златоусте.
      cn: 阿拉贝索斯主教阿德尔菲乌斯的生平，以及关于圣约翰·金口。
    children:
    - type: paragraph
      text:
        ru: В лавре св. отца нашего Саввы мы посетили авву Афанасия. Он передал нам то, что сам слышал от аввы Афиногена, епископа Петрского, сына игумении Дамианы.
        cn: 在我们的圣父萨瓦的拉夫拉，我们拜访了阿巴阿塔纳修斯。他向我们转述了他自己从阿巴阿提诺革涅斯，彼得拉斯主教，也就是女院长达米娅娜的儿子那里听到的内容。
    - type: paragraph
      text:
        ru: 'Бабка моя Ианния имела брата, по имени Аделфия, епископа Арабесского, а сестра его была настоятельницей женской обители. Однажды епископ прибыл в обитель навестить сестру. Войдя во внутренний монастырский двор, епископ увидал одну из сестер обители в припадке беснования, распростертую по земле. Призвав сестру, епископ сказал ей:'
        cn: 我的祖母伊安妮娅有一个兄弟，名叫阿德尔菲亚，他是阿拉贝斯主教，而他的姐妹是女修道院的院长。有一次，主教来到修道院探望他的姐妹。进入修道院的内院，主教看到修道院里的一位姐妹处于被鬼附的发作中，仆倒在地。主教召唤那位姐妹，对她说：
    - type: paragraph
      text:
        ru: – Или тебе нравится, что сестра подвергается таким мучениям и бесчестию от диавола? Разве не знаешь, что ты, как настоятельница, должна будешь отвечать за каждую из сестер?
        cn: – 或者你喜欢看姐妹承受魔鬼如此的折磨与羞辱吗？难道你不知道，作为修道院院长，你将要为每一个姐妹负责吗？
    - type: paragraph
      text:
        ru: – Но что ж я могу сделать против демона? – возразила сестра.
        cn: 「——但我又能做些什么来对抗恶魔呢？——」姐妹反驳道。
    - type: paragraph
      text:
        ru: – Да что ж ты тут делаешь столько лет?! – сказал епископ.
        cn: ——你到底在这里做什么这么多年了？！——主教说。
    - type: paragraph
      text:
        ru: И, сотворив молитву, исцелил сестру.
        cn: 于是，他献上祷告，医治了姊妹。
    - type: paragraph
      text:
        ru: 'Вот что еще рассказал нам авва Афанасий о епископе Аделфие, а он слышал от сестры его, игумении Ианнии. «Когда константинопольский епископИоанн Златоустбыл сослан в Кукуз, – говорила Ианния, – то он останавливался в нашем доме. Это произвело в нас великое дерзновение и любовь к Богу. Брат мой Аделфий говорил, как при вести о кончине блаженного Иоанна в ссылке им овладела невыносимая печаль, что этот муж, вселенский учитель, радовавшийЦерковьБожию речами своими, скончался, лишенный своего престола». «Я просил Бога со слезами, –  говорил брат, – чтобы Он открыл мне, в каком состоянии он находится и причислен ли к лику патриархов. Долго я молился об этом. Однажды, придя в восхищение, я увидал весьма благообразного мужа. Взяв за правую руку, он привел меня в светлое и дивное место и показал мне проповедников благочестия и учителей Церкви. Я озирался вокруг, стараясь увидеть того, кого желала душа моя, великого и возлюбленного моего Иоанна. Показав мне всех и назвав каждого по имени, он снова взял меня за руку и вывел вон. Опечаленный тем, что не видал с отцами св. Иоанна, я последовал за ним. При нашем выходе стоявший при дверях сказал мне:'
        cn: 亚瓦·阿塔纳西奥斯还告诉我们以下关于阿德尔菲奥斯主教的事情，这些是他从主教的姐妹、女隐修院院长伊安尼亚那里听来的。「当君士坦丁堡主教伊奥安尼斯·金口被流放到库库佐斯时，」伊安尼亚说，「他曾在我们家里住过。这在我们心中产生了极大的信心和对上帝的爱。我的兄弟阿德尔菲奥斯说，当他听到蒙福者伊奥安尼斯在流放中去世的消息时，他被无法忍受的悲伤所笼罩，因为这位普世的导师，曾用他的言语使上帝的教会有所喜悦的人，竟然在被剥夺了主教座的情况下离世了。」「我流着泪向上帝祈求，」兄弟说，「让他向我显明，伊奥安尼斯现在处于何种境况，以及他是否被列入宗主教的行列。我为此祈祷了很长时间。有一次，我进入了神魂超拔的状态，我看到了一位仪表堂堂的男子。他牵着我的右手，将我带到一个光明而奇妙的地方，并向我展示了那些宣扬敬虔的人和教会的导师。我环顾四周，试图看到我灵魂所渴望的那个人，我伟大的、我挚爱的伊奥安尼斯。他向我展示了所有人，并一一称呼他们的名字后，他再次牵着我的手，将我带了出去。我没有看到圣伊奥安尼斯与那些教父们在一起，为此感到悲伤，于是我跟着他。当我们走到出口时，站在门口的人对我说：
    - type: paragraph
      text:
        ru: – Кто только входит сюда, ни один не выходит с печалью.
        cn: —— 谁只要进入这里，没有一个带着忧伤离开。
    - type: paragraph
      text:
        ru: – Я печалюсь о том. – говорю я – что я не видал и числе других учителей моего возлюбленнейшего Иоанна, епископа Константинопольского.
        cn: ——我为此感到悲伤，——我说——我没有在其他教师之列见到我最亲爱的君士坦丁堡主教约翰。
    - type: paragraph
      text:
        ru: – Ты говоришь об Иоанне, проповеднике покаяния? – спросил меня мой собеседник.
        cn: 「你是在说约翰，那位宣讲悔改的吗？」我的对话者问我。
    - type: paragraph
      text:
        ru: – Да, о нем.
        cn: – 是的，关于他。
    - type: paragraph
      text:
        ru: '– Человек во плоти не может увидать его: он предстоит престолу Божию...»'
        cn: ——肉身之人无法看见他：他侍立在神的宝座前……
  - type: heading2
    initial:
      ru: '129.'
      cn: '129.'
    text:
      ru: Жизнь одного отшельника.
      cn: 一位隐士的生活。
    children:
    - type: paragraph
      text:
        ru: В другой раз рассказывал нам авва Афанасий слышанное им от аввы Афиногена, епископа Петрского.
        cn: 另一次，阿巴·阿塔纳西奥斯向我们讲述了他从阿巴·阿提诺格尼斯，彼特拉的主教那里听到的事。
    - type: paragraph
      text:
        ru: 'В той стране был столпник, и все, приходившие к нему, стоя внизу, разговаривали с ним, потому что у него не было лестницы. Если какой-нибудь брат говорил ему: «Желаю открыть тебе помысел». Он кротко отвечал: «Войди в кувуклию», – и сам сходил в другое отделение столпа. Таким образом, они могли беседовать друг с другом: столпник – сверху, а брат – снизу. И никто из стоявших тут посторонних не слышал их разговора. Со слов аввы Афиногена авва Афанасий о том же столпнике рассказал нам следующее: два пастуха, искренно любившие друг друга, много лет ходили к столпнику и всегда вместе. Однажды пришел один, тайно от другого. Долго он стучал в дверь, и старец не хотел отворить ему, так что тот, соскучившись, удалился. На обратном пути встретился ему друг его, шедший также к столпнику. Уговорил и первого вернуться с собой, чтобы вместе обоим побывать у старца. Постучались. Старец ответил, чтобы вошел только один второй. Войдя, тот начал умолять старца, чтобы дозволил войти и его приятелю. Но старец сказал, что не может принять его. На усиленные и долгие просьбы наконец ответил: «Бог отвращается от него, чадо, и я не могу принять его». Вернулись домой, и первый чрез два дня скончался.'
        cn: '在那片土地上有一位柱圣者，所有来到他那里的人都站在下面与他交谈，因为他没有梯子。如果有哪位弟兄对他说：「我愿向你敞开我的意念。」他温和地回答说：「请进入圣室。」他自己则下到柱子的另一个部分。这样一来，他们就能彼此交谈：柱圣者在上面，弟兄在下面。旁边站着的任何旁人都听不见他们的谈话。


          阿法纳西阿爸根据阿菲诺根阿爸的话，向我们讲述了关于同一位柱圣者如下事情：有两位牧人，真诚地彼此相爱，多年以来一直去拜访那位柱圣者，并且总是一起。有一天，其中一人来了，背着另一个人。他长时间敲门，长老不愿为他开门，以至于那人感到无趣，就离开了。在回来的路上，他遇到了他的朋友，他的朋友也正前往柱圣者那里去。他说服了第一个人也和他一起回去，以便两人能一起去拜访长老。他们敲了门。长老回答说只让第二个进入。进去后，那人开始恳求长老，允许他的朋友也进来。但长老说他不能接待他。在强烈而持久的请求下，长老最终回答说：「孩子，上帝已厌弃了他，我不能接待他。」他们回到了家，第一个人两天后就去世了。'
  - type: heading2
    initial:
      ru: '130.'
      cn: '130.'
    text:
      ru: Советы аввы Афанасия.
      cn: 阿瓦阿塔那修的建议。
    children:
    - type: paragraph
      text:
        ru: 'Тот же авва Афанасий говаривал: отцы наши до самой смерти наблюдали воздержание и нестяжательность, а мы только расширяем чрево и кошельки. У отцов наших первая забота была о сосредоточенности в себе самом, а нас занимают горшки и рукоделия. Однажды, –  продолжал авва Афанасий, – пришло мне на ум: что будет с теми, которые подвизаются и с теми, которые не подвизаются? Я пришел в восхищение, и некто, явившись, сказал мне: «Следуй за мною». Он привел меня в место, все озаренное светом, и поставил меня у врат. Красоты этих врат трудно описать. И мы слышали внутри врат бесконечное множество голосов, прославляющих Бога. Когда мы постучались, кто-то из бывших внутри врат, услышавший нас, спросил нас:'
        cn: '同样的阿发纳西长老曾说：我们的教父们直到临终都严守禁欲和不贪财，而我们却只顾扩张肚腹和钱袋。我们的教父们首要的关切是专注于自身（内修），而我们却被锅碗瓢盆和手工活计所缠绕。


          有一次，——阿发纳西长老继续说道，——我心里想到：那些修行者和那些不修行者将会有怎样的结局？我便神魂超拔，随即有人显现，对我说：「跟我来。」他带我到一处，那里完全被光芒照耀，并将我安置在门前。这扇门的华美难以言喻。我们听到门内传来无数赞美上帝的声音。当我们敲门时，门内的人听到了我们，便问道：'
    - type: paragraph
      text:
        ru: – Что вам нужно?
        cn: ——您需要什么？
    - type: paragraph
      text:
        ru: – Мы желаем войти, – сказал мой путеводитель.
        cn: 「我们希望进入，」我的向导说。
    - type: paragraph
      text:
        ru: – Сюда никто не войдет из тех, кто проводит жизнь нерадиво, – отвечал голос изнутри. – Но если желаете войти, идите, подвизайтесь, нисколько не заботясь о том, что в суетном мире.
        cn: – 「那些生活不敬虔的人，没有人能进入这里，」一个声音从里面回答说。「但如果你们渴望进入，去吧，竭力修持，丝毫不要顾念这虚妄世界的一切。」
  - type: heading2
    initial:
      ru: '131.'
      cn: '131.'
    text:
      ru: Жизнь аввы Закхея.
      cn: 阿爸扎克赫耶伊的生平。
    children:
    - type: paragraph
      text:
        ru: 'Схоластик Прокопий порфиреонит рассказал нам об авве Закхее: два сына мои обучались в Кесарии. Там открылась моровая язва, и я сокрушался о своих детях. Не знал совсем, как поступить. «Если послать за ними и взять их, – говорил я себе, – все равно – гнева Божия не избежишь нигде. Там их оставить? А если они умрут, и я более не увижу их?!» В таком затруднении я, наконец, решил: пойду к авве Закхею. И то он скажет, то и сделаю. Прихожу в св. Сион – его всегда там можно видеть, но и на этот раз я не нашел его там. Увидав его на паперти храма Пресвятой Богородицы, рассказываю ему о своих сыновьях. Выслушав меня, он обратился к востоку и, с распростертыми руками, устремил свой взор на небо. Прошло два часа в молчании. Наконец, обратившись ко мне, произнес: «Будь спокоен и не горюй. Дети твои не умрут от моровой язвы, и самая язва чрез два дня прекратится в Кесарии». Так и было, по слову старца. Таков рассказ схоластика Прокопия!'
        cn: 学者普罗科皮乌斯·波菲里奥尼特斯告诉我们关于亚巴·匝凯的故事：我的两个儿子在凯撒利亚学习。那里爆发了瘟疫，我为我的孩子们忧心忡忡。我完全不知道该怎么办。「如果派人去接他们回来，」我对自己说，「无论如何，在任何地方都无法逃脱上帝的震怒。把他们留在那里吗？如果他们死了，我再也见不到他们了呢？！」在这样的困境中，我终于决定：我去找亚巴·匝凯。他说什么，我就做什么。我来到圣锡安山——他总是在那里可以见到，但这一次我也没有在那里找到他。我在至圣圣母教堂的门廊上看见他，便告诉他关于我的儿子们的事情。听完我的话，他转向东方，展开双臂，将目光投向天空。两个小时在沉默中度过。最后，他转向我，说：「你放心，不要悲伤。你的孩子们不会死于瘟疫，而且瘟疫两天后就会在凯撒利亚平息。」事情果然像那位长老所说的一样。这就是学者普罗科皮乌斯的故事！
  - type: heading2
    initial:
      ru: '132.'
      cn: '132.'
    text:
      ru: «Авва Закхей получил эту милость!»
      cn: 「阿爸 扎克黑 得到了这份恩宠！」
    children:
    - type: paragraph
      text:
        ru: 'Когда мы пришли к авве Киприану, по прозванию Кукуля, монастырь которого стоит за вратами Кесарии, он рассказал нам: когда этот город был опустошаем свирепой и ужасной моровой язвой, я затворился в моей келлии и умолял милосердого Господа, чтобы Он помиловал нас и отвратил грозный гнев Свой. И я слышал голос: «Авва Закхей получил эту милость».'
        cn: 当我们来到阿巴·基普里安（外号库库利亚，他的修道院在凯撒利亚城门外）那里时，他告诉我们：当这座城市被凶猛而可怕的瘟疫所蹂躏时，我将自己关在我的小室里，并恳求慈悲的上帝，愿他怜悯我们，止息他可怖的愤怒。我听见一个声音说：「阿巴·撒该已蒙受此恩。」
  - type: heading2
    initial:
      ru: '133.'
      cn: '133.'
    text:
      ru: О св. иноке, который сделал неподвижным ловчего сарацинского на два дня.
      cn: 关于圣修士，他曾使一位萨拉森猎官两天不能动弹。
    children:
    - type: paragraph
      text:
        ru: 'В Клизме язычник сарацин рассказывал тамошним жителям, а также и нам: однажды я отправился на охоту, на гору аввы Антония. Подхожу к горе и вижу сидящего инока. В руках у него была книга, которую он читал. Иду прямо к нему, чтобы ограбить его, а, может быть, и убить. Но когда я приблизился к нему, он простер ко мне свою правую руку и сказал: «Стой!» И я простоял двое суток, будучи не в состоянии двинуться с места.'
        cn: 在克利斯马，一个异教徒撒拉逊人对当地居民也对我们讲述说：有一天，我去了亚巴·安东尼的山上打猎。我走近那座山，看见一位坐着的修士。他手里拿着一本他正在读的书。我径直朝他走去，为了抢劫他，也许，甚至杀死他。但是，当我靠近他时，他向我伸出他的右手并说：「站住！」于是我站了两天两夜，无法动弹半分。
    - type: paragraph
      text:
        ru: – Ради Бога, Которого ты чтишь, отпусти меня, – стал я просить.
        cn: ——「为了你所敬奉的上帝，放了我吧！」我开始恳求道。
    - type: paragraph
      text:
        ru: – Ступай с миром! – сказал инок. И я получил возможность уйти с того места, на котором стоял.
        cn: – 平安离去吧！– 修士说。我得以离开我站立的地方。
  - type: heading2
    initial:
      ru: '134.'
      cn: '134.'
    text:
      ru: Жизнь Феодора отшельника.
      cn: 提奥多尔隐士的生平。
    children:
    - type: paragraph
      text:
        ru: 'В окрестностях св. Иордана был отшельник, по имени Феодор. Однажды он пришел ко мне в келлию и обратился ко мне со словами:'
        cn: 在圣约旦河附近，住着一位名叫西奥多的隐士。一天，他来到我的隐修室，对我说：
    - type: paragraph
      text:
        ru: – Сделай милость, авва Иоанн, поищи мне книгу, содержащую весь Новый Завет.
        cn: ——请你帮忙，阿爸约安，帮我找一本包含整部新约的书。
    - type: paragraph
      text:
        ru: Расспросив, я узнал, что авва Петр, бывший потом епископом в Халкидоне, имеет книгу. Прихожу к нему и спрашиваю его о книге. Он показал мне Новый Завет на прекрасном пергаменте.
        cn: 经询问，我得知阿巴彼得（他后来成为了迦克墩的主教）有一本书。我去找他，并询问那本书的事。他给我看了写在精美羊皮纸上的《新约》。
    - type: paragraph
      text:
        ru: – Сколько стоит? – спрашиваю.
        cn: ——多少钱？——我问道。
    - type: paragraph
      text:
        ru: – Три номисмы, – говорит авва. – Но – ты сам, что ли желаешь купить или другой кто-нибудь?
        cn: ——三诺米斯马，——阿爸说，——但是——是你自己想买呢，还是别人想买呢？
    - type: paragraph
      text:
        ru: – Нет, отче! отшельник желает иметь ее.
        cn: – 不，教父！隐士想要拥有她。
    - type: paragraph
      text:
        ru: – Если отшельник, – говорить авва Петр, – то возьми ее даром. Возьми вот и три номисмы. Если книга понравится ему, пусть возьмет. Если же не понравится, то купи ему на эти деньги, какую он пожелает.
        cn: —— 如果他是一位隐士，——阿爸彼得说，——那就把这本书白送给他。另外再拿上三枚诺米斯玛。如果他喜欢这本书，就让他收下。如果他不喜欢，你就用这笔钱给他买一本他想要的。
    - type: paragraph
      text:
        ru: Взяв книгу, я отнес ее отшельнику, Тот получил книгу и удалился в пустыню. Прошло два месяца. И отшельник снова пришел ко мне.
        cn: 我拿着书，把它带给了隐修士。那位隐修士接过书，便隐入了旷野。两个月过去了，那隐修士又来到我这里。
    - type: paragraph
      text:
        ru: – Знаешь, авва Иоанн, меня беспокоит мысль, что я даром получил книгу.
        cn: ——你知道，阿爸·约安，一个念头令我不安，就是我白白得了这本书。
    - type: paragraph
      text:
        ru: – Не беспокойся, – говорю ему. – Авва Петр богат и добр. Он рад этому.
        cn: 我对他说：「不要担心。阿爸彼得富有又善良。他对此很高兴。」
    - type: paragraph
      text:
        ru: – Да я-то не успокоюсь, пока не заплачу.
        cn: ——可我呀，不哭出来是不会平静的。
    - type: paragraph
      text:
        ru: – Но имеешь ли ты деньги? – спрашиваю его.
        cn: – 但是你有钱吗？ – 我问他。
    - type: paragraph
      text:
        ru: – Нет, – отвечал отшельник. – Но ты дай мне надеть власяницу.
        cn: 「不，」隐修者回答，「但你给我穿上苦衣。」
    - type: paragraph
      text:
        ru: 'Отшельник был наг. Я дал ему власяницу и старый головной покров, и он, уйдя, нанялся работать при озере, которое устраивал на Синае патриарх Иерусалимский Иоанн. Получая ежедневно плату в пять фолер, он ходил в лавру Илиотскую близ меня и ел только по десяти волчьих бобов, несмотря на то, что трудился целый день. Когда из получаемой платы у него составилась сумма в три номисмы, он сказал мне: «Возьми деньги и отдай за книгу. Если же не пожелает, возврати книгу». Я пошел и рассказал авве Петру. Тот не хотел брать ни денег, ни книги. Однако я уговорил его взять деньги и не отвергать труда отшельника. Возвратившись, я снова вручил книгу отшельнику, и он с радостью удалился в пустыню.'
        cn: 隐士是赤身露体的。我给了他一件苦衣和一块旧头巾。他离开后，受雇在耶路撒冷牧首约安正在西奈山修建的湖边工作。他每天领取五弗勒的报酬，走到我附近的伊利奥特修道院，尽管他整日劳作，却只吃十颗狼豆。当他从所获得的报酬中积攒了三诺米斯玛的金额时，他对我说：「请拿走这些钱，用它来买书。如果他不愿意，就把书还回来。」我去了，并告诉了阿爸彼得。他既不愿意接受钱，也不愿意接受书。然而我劝服了他，让他收下这些钱，而不要拒绝隐士的辛劳。回来后，我再次把书交付给隐士，他便高高兴兴地隐居到旷野里去了。
  - type: heading2
    initial:
      ru: '135.'
      cn: '135.'
    text:
      ru: О пяти девах, задумавших бегство из обители.
      cn: 五位意图逃离修道院的童女。
    children:
    - type: paragraph
      text:
        ru: 'Вместе с братом моим Софронием пришли в монастырь Евнухов, что близ св. Иордана. Там пресвитер монастыря авва Николай рассказывал нам: на его родине (он был из Ликии) есть женский монастырь, в котором живут около сорока дев. Пять из них задумали бежать ночью из монастыря и избрать себе мужей. Однажды, когда все монастырки заснули, те взяли одежды и собрались бежать, но все пять вдруг подпали действию диавола. Вследствие этого им не пришлось бежать из монастыря, – напротив, вознося благодарность Богу, они исповедали свое прегрешение: «Благодарим всемилостивого Бога, наказавшего нас, чтобы не погибнуть душам нашим».'
        cn: 我和我的兄弟索弗罗尼耶来到位于圣约旦河附近的宦官修道院。在那里，修道院的长老尼古拉修士告诉我们：在他的家乡（他来自吕基亚）有一个女修道院，里面住着大约四十名贞女。她们中有五人盘算着夜里逃出修道院，为自己选择丈夫。一天，当所有修女都睡着后，她们拿上衣服，准备逃走，但这五人却突然落入了魔鬼的作为之下。因此，她们没能逃出修道院，——相反地，她们向上帝献上感谢，并忏悔了自己的过犯：「我们感谢全能仁慈的上帝，祂惩罚了我们，好使我们的灵魂不至灭亡。」
  - type: heading2
    initial:
      ru: '136.'
      cn: '136.'
    text:
      ru: О благодеянии аввы Сизинния сарацинке.
      cn: 艾瓦·西津尼对一位撒拉逊妇人的恩惠。
    children:
    - type: paragraph
      text:
        ru: 'Авва Иоанн, пресвитер монастыря Евнухов, передал нам слышанное им от отшельника аввы Сизинния: однажды ко мне в пещеру, что близ Иордана, пришла сарацинка. Я пел в это время третий час. Войдя в пещеру, она разделась донага и легла передо мною. Я, однако, не смутился, но продолжал совершать правило со всем спокойствием и со страхом Божиим. Окончив молитву, говорю ей по-сирийски:'
        cn: 阿巴·约安，阉官修道院的长老，传给我们他从隐士阿巴·西津尼亚那里听到的事：有一次，一个撒拉逊女人来到我约旦河附近的洞穴。我当时正在唱第三时辰的祷文。走进洞穴后，她脱得一丝不挂，躺在我面前。然而我心神不乱，而是带着全然的平静和对上帝的敬畏，继续履行我的规程。祷告完毕后，我用叙利亚语对她说道：
    - type: paragraph
      text:
        ru: – Встань. Я поговорю с тобою и тогда сделаю для тебя, что тебе нужно.
        cn: ——起来。我与你说话，然后我就会为你做你需要的事情。
    - type: paragraph
      text:
        ru: Она встала.
        cn: 她站起来了。
    - type: paragraph
      text:
        ru: – Христианка ты или язычница? – спрашиваю ее.
        cn: – 你是基督徒还是异教徒？– 我问她。
    - type: paragraph
      text:
        ru: – Христианка.
        cn: 女基督徒。
    - type: paragraph
      text:
        ru: – Что ж – разве ты не знаешь, что за блуд будет наказание?
        cn: ——那么，难道你不知道，淫乱是会受到惩罚的吗？
    - type: paragraph
      text:
        ru: – Да, знаю.
        cn: – 是的，我知道。
    - type: paragraph
      text:
        ru: – Зачем же ты ищешь блуда?
        cn: ——你为何寻求淫乱呢？
    - type: paragraph
      text:
        ru: – Я голодна.
        cn: ——我饿了。
    - type: paragraph
      text:
        ru: – Перестань грешить и приходи ко мне ежедневно. Я буду делиться с тобою тем, что Бог пошлет. С того дня она приходила ко мне ежедневно, и я давал ей пищу, что Бог посылал, до тех пор, пока не ушел из той местности.
        cn: 「不再犯罪，每天到我这里来。我将与你分享神所差遣的。」 从那天起，她每天都来找我，我将神所差遣的食物给她，直到我离开那片区域。
  - type: heading2
    initial:
      ru: '137.'
      cn: '137.'
    text:
      ru: Рассказ аввы Иоанна об авве Каллинике.
      cn: 阿爸约翰关于阿爸卡利尼科斯的故事。
    children:
    - type: paragraph
      text:
        ru: 'В другой раз рассказывал мне авва Иоанн: когда я был еще молод, явилось у меня сильное желание сходить к великим и славным старцам, чтобы принять от них благословение и получить духовное назидание. Я слышал об авве Каллинике, который жил в затворе в монастыре аввы Саввы. Попросив одного из приближенных, чтобы он привел меня к нему, я отправился. Брат, взявшийся представить меня, посадил меня у окна, а сам долго с ним разговаривал. Я в это время размышлял сам в себе: старец никогда не видал меня и не окажет мне благосклонного приема. Отойдя от окна, брат велел мне подойти поклониться старцу и принять от него благословение, при этом сказал старцу:'
        cn: 另一次，阿巴·约安告诉我：当我还年轻的时候，我心中生起强烈的愿望，要去拜访那些伟大而受人尊敬的长老们，以便从他们那里接受祝福，并获得灵性上的教导。我听说过阿巴·卡利尼科斯，他隐居在阿巴·萨瓦修道院的一个小室里。我请求一位亲近的人带我去见他，然后我就出发了。那位答应引荐我的弟兄，让我坐在窗边，而他自己则与长老谈了很久。我当时心里这样想：这位长老从未见过我，也肯定不会友善地接待我。从窗边走开后，弟兄叫我走过去向长老行礼，并接受他的祝福，同时他对长老说：
    - type: paragraph
      text:
        ru: – Помолись, отче, о рабе твоем сем, он в первый раз пришел сюда.
        cn: ——父啊，请为您的这位仆人祈祷，他第一次来到这里。
    - type: paragraph
      text:
        ru: '– А я все-таки знаю его, чадо мое. Двадцать дней тому назад я ходил к св. Иордану. Он встретился со мною на пути и сказал мне: «Помолись обо мне». Я спросил его: «Как тебе имя?» – Он отвечал «Иоанн». Вот с тех пор я и знаю его.'
        cn: ——然而我确实认识他，我的孩子。二十天前，我去了圣约旦。他在路上遇见了我，对我说：「请为我祷告。」我问他：「你叫什么名字？」他回答：「约翰。」就是从那时起，我认识了他。
    - type: paragraph
      text:
        ru: Услышав это, я понял, что в тот момент, когда я решился идти к нему, Бог открыл ему мое имя, и кто я.
        cn: 听到这个，我明白了就在那一刻，当我下定决心去见他时，上帝向他启示了我的名字，以及我是谁。
  - type: heading2
    initial:
      ru: '138.'
      cn: '138.'
    text:
      ru: Об авве Сергии отшельнике и об иноке язычнике.
      cn: 论阿爸塞尔吉隐士与异教徒修士。
    children:
    - type: paragraph
      text:
        ru: 'Вот еще рассказ того же старца: когда отшельник авва Сергий, покинув Синай, жил в Руве, прислал сюда в монастырь одного молодого инока, чтобы его окрестили. Когда мы спрашивали, зачем ему креститься, слуга аввы Сергия – тоже авва Сергий – сказал нам: «Он пришел к нам, чтобы жить вместе с нами в пустыне». Я, как слуга, его принял и сперва долго его уговаривал, чтобы он сперва испытал себя, способен ли он к такому образу жизни. Узнав об его твердой решимости, я на другой день привел его к старцу. Лишь только старец увидал его, прежде чем я вымолвил слово, сказал мне:'
        cn: '这还是那位长老讲的一个故事：

          当隐修士亚巴·谢尔盖离开西奈（山）住在鲁瓦的时候，他派了一个年轻的修士到这间修道院来，让他受洗。当我们问他为什么要受洗时，亚巴·谢尔盖的仆役——他自己也是一位亚巴·谢尔盖——对我们说：「他到我们这里来，是为了与我们一同在旷野生活。」我作为他的仆役，接待了他，起初我长时间地劝说他，让他先考验一下自己，看他是否适合这种生活方式。了解了他坚定的决心后，第二天我便把他带到了长老那里。长老一见到他，还没等我开口说一句话，就对我说：'
    - type: paragraph
      text:
        ru: – Чего желает этот брат?
        cn: – 这个弟兄希望什么？
    - type: paragraph
      text:
        ru: – Он просит позволения остаться с нами.
        cn: ——他请求允许与我们留下。
    - type: paragraph
      text:
        ru: '– Поверь мне, брат: он еще не крещен. Отведи его в монастырь Евнухов, чтобы его окрестили в св. Иордане.'
        cn: ——相信我，兄弟：他还没有受洗。带他去宦官修道院，好让他能在圣约旦受洗。
    - type: paragraph
      text:
        ru: Пораженный этими словами, я стал расспрашивать пришедшего брата, кто он, и откуда. Он отвечал мне, что пришел с Запада, что родители его были язычники. И он сам не знает, крещен он или нет. Тогда, огласив его, мы окрестили его в Иордане. И он остался в монастыре благодаря Бога.
        cn: 被这些话语震撼，我开始询问这位来到的弟兄，他是谁，来自何方。他回答我，他来自西方，他的父母曾是异教徒。而且他自己也不知道，他是否受过洗礼。于是，在为他施以慕道教理之后，我们在约旦河中为他施洗。于是他留在了修道院，感谢上帝。
  - type: heading2
    initial:
      ru: '139.'
      cn: '139.'
    text:
      ru: Предсказание аввы Сергия о Григории, игумене фаранской обители.
      cn: 阿爸谢尔盖关于法兰修道院院长格里高利的预言。
    children:
    - type: paragraph
      text:
        ru: 'Об этом же отшельнике авве Сергии ученик его авва Сергий армянин рассказывал нам: Авва Григорий, бывший настоятелем лавры Фаранской, много докучал мне просьбами, чтобы я привел его к старцу. Однажды я решил исполнить его просьбу. Старец в то время находился в окрестностях Мертвого моря. Увидав авву Григория, старец любовно облобызал его и, принеся воды, омыл ему ноги. Весь тот день он беседовал с гостем о пользе душевной, а на другой день отпустил его. По уходе аввы Григория я говорю старцу:'
        cn: '关于这位隐士阿巴·谢尔盖，他的门徒阿巴·谢尔盖·亚美尼亚人这样告诉我们：


          阿巴·格里戈里，曾任法兰修道院的院长，屡次恳求我，让我带他去见长老。有一天，我决定满足他的请求。长老那时正在死海附近。见到阿巴·格里戈里，长老慈爱地亲吻了他，并打来水，为他洗脚。整个那天，他与客人交谈关于灵魂的益处，第二天便让他离开了。阿巴·格里戈里离开后，我对长老说：'
    - type: paragraph
      text:
        ru: – Знаешь ли, отче? Я очень смутился. Сколько епископов, пресвитеров и многих других я приводил к тебе, и ты никогда никому не омывал ног, кроме одного аввы Григория.
        cn: —教父啊，你知道吗？我感到非常困惑。我曾带了多少主教、司祭以及许多其他人到你这里，你却从未给任何人洗过脚，除了阿爸格里高利一人。
    - type: paragraph
      text:
        ru: – Чадо! Кто такой авва Григорий, я не знаю, – отвечал старец. – Знаю только то, что я принимал в своей пещере патриарха. Я видел на нем омофор, а в руках св. Евангелие. Так и случилось. Спустя шесть лет Бог удостоил авву Григория сделаться патриархом в Феополе, как предвидел старец.
        cn: – 孩子！阿巴格里戈里是谁，我不知道，——长老回答说。——我只知道，我曾在我洞穴里接待过一位宗主教。我看见他身披俄摩福，手中拿着圣福音书。事情果然如此。六年以后，正如长老所预见，上帝使阿巴格里戈里配得在塞奥波利斯成为宗主教。
  - type: heading2
    initial:
      ru: '140.'
      cn: '140.'
    text:
      ru: Жизнь Григория, патриарха Феопольского.
      cn: 格里高利，提奥波利斯牧首的生平。
    children:
    - type: paragraph
      text:
        ru: 'Некоторые из старцев рассказывали об авве Григории, патриархе Феопольском, что он особенно отличался добродетелями: милостыни, непамятозлобия и даром слез. У него было великое сострадание к грешникам. Все это часто мы испытывали на себе самих.'
        cn: 有些长老讲述关于阿巴·格里高利，费奥波尔斯克牧首的事，说他以施舍、不记仇和流泪的恩赐这些美德而特别杰出。他对罪人有极大的怜悯。所有这一切我们都常常亲身感受到。
  - type: heading2
    initial:
      ru: '141.'
      cn: '141.'
    text:
      ru: Ответ аввы Олимпия.
      cn: 阿巴奥林匹亚的回答。
    children:
    - type: paragraph
      text:
        ru: Один брат посетил авву Олимпия в лавре аввы Герасима, что близ св. Иордана.
        cn: 一位弟兄在靠近圣约旦河的革拉西莫斯长老的拉夫拉里拜访了奥林匹亚长老。
    - type: paragraph
      text:
        ru: – Как можешь ты переносить столь сильный зной и такое множество насекомых? – спросил брат старца.
        cn: 兄弟问这位长老：「你怎么能忍受如此炙热的酷暑和如此多的昆虫呢？」
    - type: paragraph
      text:
        ru: – Я терплю насекомых (скнипы), чтобы избежать неусыпающего червя, равным образом переношу и зной, боясь огня вечного. Все это временно, а то не имеет конца.
        cn: – 我忍受蚊蚋（虱子），为要避免不眠的虫子，同样也忍受炎热，惧怕永火。这一切都是暂时的，而那却是没有尽头的。
  - type: heading2
    initial:
      ru: '142.'
      cn: '142.'
    text:
      ru: Ответ аввы Александра.
      cn: 阿巴亚历山大的回答。
    children:
    - type: paragraph
      text:
        ru: Другой брат пришел однажды в лавру аввы Герасима, к игумену авве Александру.
        cn: 另有一位兄弟曾有一次来到阿爸革拉西莫斯的拉夫拉，去见院长阿爸亚历山大。
    - type: paragraph
      text:
        ru: – Авва, – сказал гость, – я желаю удалиться из своего настоящего местопребывания, потому что очень скучаю.
        cn: ——阿爸，——客人说，——我希望离开我现在的居所，因为我非常厌倦。
    - type: paragraph
      text:
        ru: – Верный знак, – отвечал авва Александр, – что ты вовсе не думаешь ни о вечных мучениях, ни о царстве небесном. Иначе тебе не было бы скучно.
        cn: ——确凿的迹象，——亚巴西 亚历山大回答说，——就是你根本没有想到永恒的苦难，也没有想到天国。否则你就不会感到无聊了。
  - type: heading2
    initial:
      ru: '143.'
      cn: '143.'
    text:
      ru: Жизнь Давида атамана разбойников, ставшего потом иноком.
      cn: 《强盗头目达维德，后来成为修士的生平》
    children:
    - type: paragraph
      text:
        ru: 'По прибытии в Фиваиду, мы пришли в город Антиноэ к софисту Фивамону, ради пользы душевной. Он рассказал нам: в области города Гермополиса был один разбойник, по имени Давид. Он многих ограбил, совершил много убийств – словом сказать: сделал столько зла, как никто. Однажды, занимаясь разбоем, он находился на горе вместе со своей шайкой человек в тридцать. Тут он пришел в себя и стал сокрушаться о совершенных им злодеяниях. Бросив свою шайку, он пришел в монастырь и постучался в ворота. Вышел привратник.'
        cn: 抵达提拜德后，我们来到安提诺厄城，到智者菲巴蒙那里，为了灵魂的益处。他告诉我们：在赫尔摩波利斯城区域，曾有一个名叫达维德的强盗。他抢劫了许多人，犯下了许多谋杀罪——简而言之：他所做的恶事无人能及。有一天，他在进行抢劫时，和他的匪帮大约三十人一起身处一座山上。这时他清醒过来，并开始为他所犯下的恶行痛悔。抛弃了他的匪帮，他来到一座修道院，并敲了敲门。守门人出来了。
    - type: paragraph
      text:
        ru: – Что тебе нужно? – спросил он его.
        cn: ——「你需要什么？」他问他。
    - type: paragraph
      text:
        ru: – Хочу сделаться иноком, – отвечал атаман.
        cn: 「我想要成为一名修道士，」阿塔曼回答道。
    - type: paragraph
      text:
        ru: Привратник пошел и доложил авве. Авва вышел и увидал, что пред ним – старик.
        cn: 守门人去了，并向阿爸禀报。阿爸出来，看见他面前有一位老人。
    - type: paragraph
      text:
        ru: – Как ты будешь жить здесь? – спросил авва. – Здесь братия пребывают в великом труде, в великом подвиге. А ты всю жизнь прожил не так. Где ж тебе выдержать монастырское правило?
        cn: '– 你将如何在此生活？——长老问道。

          – 此处的修士们生活在极大的劳苦和极大的苦修之中。而你一生都不是这样过的。你怎能承受得了这修道院的规矩呢？'
    - type: paragraph
      text:
        ru: – Нет, я все буду исполнять, – упрашивал тот, – только прими меня.
        cn: – 不，我什么都会遵行，– 那人恳求道，– 只要你接受我。
    - type: paragraph
      text:
        ru: Но старец оставался непреклонен.
        cn: 但长老依然坚定不移。
    - type: paragraph
      text:
        ru: – Не можешь исполнить! – говорил.
        cn: – 你无法履行！– 他说道。
    - type: paragraph
      text:
        ru: – Ну, так знай! – воскликнул атаман, – что я – Давид, атаман разбойников, и пришел сюда ради того, чтобы оплакать свои прежние грехи. Если ты не примешь меня, клянусь Живущим на небесах, что я вернусь к старому промыслу, приведу сюда мою шайку, всех вас перебью и сотру с лица земли монастырь ваш!
        cn: – 那么，你听着！ – 首领喊道，– 我就是大卫，强盗的首领，我到这里来是为了哀哭我过去的罪。如果你不接纳我，我以住在天上的那一位起誓，我就会重操旧业，把我的匪帮带到这里来，把你们所有人杀光，把你们的修道院从地面上抹去！
    - type: paragraph
      text:
        ru: Услышав это, старец ввел его в монастырь, постриг и облек в иноческую одежду. И, начав подвизаться, он превзошел всех воздержанием, послушанием и смиренномудрием, а в монастыре было около семидесяти иноков. Он всех назидал своею жизнью, всем служил примером. Однажды он сидел в своей келлии, и ему предстал ангел Господень.
        cn: 听到这话，长老将他带入修道院，给他行了剪发礼，并给他穿上修道服。他开始苦修后，在节制、顺服和谦卑方面超越了所有人，而当时修道院里约有七十名修士。他以自己的生活教诲了所有人，给所有人树立了榜样。有一天，他独自坐在自己的修道室里，主的使者向他显现了。
    - type: paragraph
      text:
        ru: – Давид, Давид, Господь Бог простил тебе грехи твои – и отселе ты будешь совершать знамения.
        cn: ——大卫，大卫，主上帝赦免了你的罪，从今以后你将要施行神迹。
    - type: paragraph
      text:
        ru: – Не могу поверить, – отвечал он ангелу, что в столь короткое время я заслужил прощение моих грехов, которые многочисленнее песка морского.
        cn: 「我无法相信，」他回答天使说，「在如此短的时间内，我蒙得了我罪孽的赦免，这些罪孽多于海沙。」
    - type: paragraph
      text:
        ru: – Если я не пощадил Захарии, не поверившего мне, когда я возвестил ему о рождении сына, но связал язык его, в наказание за неверие словам моим, – пощажу ли тебя? – сказал ангел. – Отныне ты лишен будешь дара слова...
        cn: ——如果我没有饶恕撒迦利亚，当我对他说他将得一个儿子时，他不信我，反而捆绑了他的舌头，以此惩罚他对我话语的不信，——我岂会饶恕你呢？——天使说。——从今以后，你将失去说话的恩赐……
    - type: paragraph
      text:
        ru: – Как!? Когда я был в мире и совершал безбожные дела и кровопролитие, – вскричал Давид, бросившись к ногам ангела, – я мог говорить, а теперь, желая служить Богу и возносить Ему хвалу, теперь ли свяжешь мой язык!?..
        cn: 「——怎么会这样？！当我身处世俗，行不敬神之事并流血之时，」大卫扑倒在天使脚下，大声喊道，「我尚能言语；而今，我渴望侍奉上帝并颂扬祂，难道你却要在此刻捆绑我的舌头吗？！……」
    - type: paragraph
      text:
        ru: – Ты не будешь лишен дара слова во время Божественной службы, а во все остальное время будешь молчать навсегда!
        cn: – 你不会在神圣礼仪期间被剥夺言语的恩赐，而在所有其余的时间里，你将永远保持沉默！
    - type: paragraph
      text:
        ru: Так и было. И много знамений явил Бог чрез него. Он пел псалмы, но других речей – ни длинных, ни кратких – никто не слыхал от него. Тот, кто рассказал нам это, прибавил, что ему часто приходилось видеть его. И за это он прославлял Бога.
        cn: 事情确实如此。上帝也藉着他显明了许多神迹。他诵唱诗篇，但除了诗篇之外，没有人听过他说任何其他的话，无论是长是短。告诉我们这事的人补充说，他经常有机会见到他。为此，他赞美上帝。
  - type: heading2
    initial:
      ru: '144.'
      cn: '144.'
    text:
      ru: Увещания одного старца в Келлиях.
      cn: 一位长老在凯利亚的劝诫。
    children:
    - type: paragraph
      text:
        ru: 'Один брат поучал братию в Келлиях:'
        cn: 一位弟兄在凯利亚教导众弟兄：
    - type: paragraph
      text:
        ru: «Не пожелаем рабствовать египетским удовольствиям, которые делают нас рабами губителя фараона.
        cn: 我们不要渴望作埃及享乐的奴仆，因为它们使我们成为毁灭者法老的奴仆。
    - type: paragraph
      text:
        ru: О, если бы люди имели такое стремление к добру, какое имеют ко злу! О, если бы они свою любовь к театрам, к пустым празднествам, свою жадность, тщеславие и неправду переменили на любовь к благочестию! Тогда мы познали бы, как мы высоко поставлены Богом и какую силу имеем против демонов.
        cn: 哦，如果人们对良善有着如同他们对邪恶一般的渴望！哦，如果他们将自己对剧场、对空虚庆典的爱，将自己的贪婪、虚荣和不义，转变为对虔诚的爱！那时我们就会明白，我们被上帝高举到了何等境地，以及我们对邪魔拥有何等力量。
    - type: paragraph
      text:
        ru: Нет ничего выше Бога, нет ничего Ему равного, нет ничего, что сколько-нибудь приближалось бы к равенству с Ним. Что же может быть крепче, что блаженнее того, кому Бог помогает?
        cn: 没有什么高过上帝，没有什么与祂平等，没有什么能稍微接近与祂平等。那么，还有什么能比上帝所帮助的人更坚固、更蒙福呢？
    - type: paragraph
      text:
        ru: Бог вездесущ, но – ближе к благочестивым и подвизающимся, к тем, кои славны не одним исповеданием веры, но сияют делами. А где Бог, кто посмеет строить козни? Или кто будет иметь силу вредить?
        cn: 上帝无所不在，但他更亲近那些虔诚和竭力修持的人，那些不只因信仰的告白而受荣耀，更是因善行而发光的人。而上帝所在之处，谁敢设下诡计？或者谁有能力伤害？
    - type: paragraph
      text:
        ru: 'Крепость человека не в его природе: она непорочна; но в (святой) решимости с Божией помощью. Будем, чада, заботиться о душе, как заботимся о теле!'
        cn: 人的刚强不在于他的本性：这本性是无瑕的；而在于靠着神的帮助，所持有的（圣洁的）决志。孩子们，让我们顾念灵魂，如同我们顾念身体一样！
    - type: paragraph
      text:
        ru: Будем собирать целительные средства для души, то есть, благочестие, справедливость, смиренномудрие, послушание. А величайший врач душ, Христос, близок к нам и всегда готов уврачевать нас. Не будем же нерадивы ....
        cn: 让我们为灵魂收集医治良方，即：敬虔、公义、谦卑、顺服。而灵魂的至大医者基督，临近我们，时刻准备好医治我们。所以，我们不要怠惰……
    - type: paragraph
      text:
        ru: Господь наставляет нас быть воздержными, а мы, несчастные, благодаря изнеженности, все более и более стремимся к удовольствиям.
        cn: 主教导我们当节制，而我们这些不幸的人，因着娇惯，却越来越追求享乐。
    - type: paragraph
      text:
        ru: '"Предадимсебя Богу, – по слову Павла, –как ожившие из мертвых»(Римл. 6, 13). Не озираясь назад, забудем старое, будем стремиться, соответственно нашему назначению к награде вышнего звания (Фил. 3, 13, 14).'
        cn: 我们将自己献给上帝，——依照保罗的话，——像从死里复活的人一样（罗马书 6:13）。不顾后看，忘记旧事，我们要竭力追求，按照我们的蒙召，为要得神从上面召我们来得的奖赏（腓立比书 3:13，14）。
    - type: paragraph
      text:
        ru: 'Один брат спросил старца:'
        cn: 一位弟兄问长老：
    - type: paragraph
      text:
        ru: – Отчего я постоянно осуждаю братьев?
        cn: – 为何我总是论断弟兄们？
    - type: paragraph
      text:
        ru: – Потому что ты еще не познал себя самого. Кто знает себя, тот не смотрит на других.
        cn: — 因为你尚未认识你自己。凡认识自己的人，就不注目他人。
  - type: heading2
    initial:
      ru: '145.'
      cn: '145.'
    text:
      ru: Жизнь бл. Геннадия патриарха Константинопольского и о чтеце его Харисии.
      cn: 真福者格拿狄乌斯，君士坦丁堡牧首的生平，以及他的读经士哈里西乌斯。
    children:
    - type: paragraph
      text:
        ru: Мы прибыли в киновию на расстоянии девяти миль от Александрии, и нашли там двух старцев, которые сказали нам, что они были пресвитерами Константинопольской церкви. Они нам рассказывали о блаженномГеннадии, патриархе Константинопольском, что он отличался величайшею кротостью, чистотой и воздержанием.
        cn: 我们抵达了一处距离亚历山大九英里的基诺维亚，在那里找到了两位长老。他们告诉我们，他们是君士坦丁堡教会的长老。他们向我们讲述了蒙福的君士坦丁堡牧首根拿狄乌斯，说他以其极大的谦卑、纯洁和节制而著称。
    - type: paragraph
      text:
        ru: 'Многие докучали ему из-за одного клирика, весьма дурного поведения, по имени Харисия. Призвав клирика, патриарх пытался вразумлять его, но вразумления нисколько на него не действовали. Тогда приказал наказать по правилам отеческим и церковным. Но наказание не принесло ни малейшей пользы: дело доходило до волхования и убийства... Вот патриарх призывает к себе одного из апокрисиариев, посылает его к св. Елевферию (Харисий был чтецом при его храме) и поручает ему сказать: «Св. Елевферий, один из твоих воинов много грешит. Или исправь его или отлучи!» Апокрисиарий отправился в храм св. мученика Елевферия и стал пред жертвенником. Обратясь к гробнице мученика, простер руки свои и воскликнул: «Святый мучениче Христов, патриарх Геннадий объявляет тебе чрез меня, грешного: «Твой воин много грешит. Или исправь его, или отлучи!» И на другой день нечестивец был найден мертвым... Все были поражены ужасом и прославили Бога.'
        cn: '许多人为了一个品行极其败坏的教士，名叫哈里西亚的，缠扰牧首。牧首召来那位教士，试图劝诫他，但劝诫对他毫无作用。于是牧首下令按照教父和教会的规矩惩罚他。但惩罚丝毫没有益处：事情甚至发展到巫术和谋杀的地步……


          于是牧首召来他的一位宗主教代理人，派他去见圣埃莱夫塞里奥斯（哈里西亚是该圣堂的读经士），并嘱咐他去说：「圣埃莱夫塞里奥斯啊，你的一个战士犯了许多罪。要么纠正他，要么将他逐出！」


          宗主教代理人去了圣殉道者埃莱夫塞里奥斯的圣堂，站在祭坛前。他面向殉道者的陵墓，伸出双手，呼喊道：「基督的圣殉道者啊，格纳迪乌斯牧首通过我这罪人向你宣告：『你的战士犯了许多罪。要么纠正他，要么将他逐出！』」


          到了第二天，那个邪恶的人被发现死了……所有人都被这恐怖震慑住了，并颂赞了上帝。'
  - type: heading2
    initial:
      ru: '146.'
      cn: '146.'
    text:
      ru: Видение Евлогия, патриарха Константинопольского.
      cn: 尤洛吉乌斯，君士坦丁堡牧首的异象。
    children:
    - type: paragraph
      text:
        ru: 'Мы были в Еннате, в киновии «Тугара». Настоятель киновии авва Мина рассказывал нам о св. папе Евлогии: однажды ночью, совершая у себя в домовом храме епископии правило, он увидал стоявшего близ него архидиакона Юлиана. Увидав его, он изумился, что он дерзнул войти без доклада. Однако промолчал. Окончив псалмопение, папа сделал земной поклон. Сделал то же самое и явившийся ему в образе архидиакона. Поклонившись, папа встал, но тот оставался простертым на полу.'
        cn: 我们在叶纳特，图加拉共住修道院。共住修道院院长阿瓦·米纳给我们讲述了关于圣教宗尤洛吉乌斯的事情：一天夜里，他在自己的主教府小圣堂中履行修持规定时，看见身边站着总执事尤利安。看到他，他很诧异他竟敢不通报就进来。然而，他保持了沉默。结束了诵唱圣咏后，教宗行了一个俯伏大礼。那个以总执事形象显现的也做了同样的事。行完礼后，教宗站了起来，但那一位仍旧俯伏在地板上。
    - type: paragraph
      text:
        ru: – Доколе же ты будешь лежать? – сказал папа, обратившись к посетителю.
        cn: 「你还要躺到什么时候呢？」爸爸转向那位访客说。
    - type: paragraph
      text:
        ru: – Если ты не прострешь руку и сам не поднимешь меня, – отвечал он, – я не могу встать.
        cn: 他回答说：『如果你不伸出手，亲自把我扶起来，我就站不起来。』
    - type: paragraph
      text:
        ru: 'Тогда авва, протянув руку и взяв его, поднял. Потом продолжал славословие. Немного спустя оглянувшись, он уже никого не увидал. По окончании утренних молитв, он позвал своего келейника и спросил его:'
        cn: 于是，长老伸出手，扶起他。然后他继续颂赞。不久，他回头一看，已不见任何人。在早晨的祈祷结束后，他叫来他的侍者，问他：
    - type: paragraph
      text:
        ru: – Почему ты не сказал мне о приходе архидиакона, и он без доклада пришел ко мне и притом ночью?
        cn: ——你为什么没告诉我总执事的到来，而且他未经禀报就来见我，况且还是在夜里？
    - type: paragraph
      text:
        ru: 'Келейник уверял, что он никого не видал, и никто не входил. Не поверив ему, папа сказал:'
        cn: 侍僧坚称他没见到任何人，也没人进来。长老不相信他，说：
    - type: paragraph
      text:
        ru: – Поди – позови сюда привратника.
        cn: – 去——把守门人叫过来。
    - type: paragraph
      text:
        ru: 'Привратник явился. Папа спросил его:'
        cn: 守门人出现了。教宗问他：
    - type: paragraph
      text:
        ru: – Не приходил ли сюда архидиакон Юлиан?
        cn: ——辅祭长尤利安来过这里吗？
    - type: paragraph
      text:
        ru: 'Тот с клятвою утверждал, что не приходил и не уходил. И только теперь папа успокоился. Утром явился архидиакон Юлиан для благословения. Папа спросил его:'
        cn: 那人以誓言坚称，自己既未曾来过，也未曾离去。直到此刻，那位长老才平静下来。次日清晨，副主教尤利安前来求取祝福。长老问他道：
    - type: paragraph
      text:
        ru: – Зачем ты архидиакон, нарушил порядок, и сегодня ночью пришел ко мне без доклада?
        cn: 你这总执事，为何违反规矩，今晚未经通报就来找我？
    - type: paragraph
      text:
        ru: – Молитвами твоими, владыко, я не приходил сюда, да я из дому вовсе не отлучался – до настоящего часа.
        cn: ——藉着你的祷告，主教大人，我没有来过这里，而且我根本就没有离开家——直到此刻。
    - type: paragraph
      text:
        ru: Тогда великий Евлогий понял, что ему являлся мученик Юлиан, с целью побудить его воздвигнуть его храм, потому что от времени он разваливался и угрожал падением. Чтитель мученика блаженный Евлогий с большою готовностью простер руку свою и воздвиг его храм, выстроив его с основания и благолепно украсив, как подобает храму мученика.
        cn: 那时，伟大的叶夫洛吉明白显现给他的是殉道者尤利安，目的是为了促使他建造尤利安的圣殿，因为圣殿经过时间的侵蚀正在坍塌，并面临倒塌的危险。敬奉殉道者的蒙福者叶夫洛吉带着极大的乐意伸出他的手，建造了他的圣殿，从地基开始修建，并以华美的方式装饰，正如殉道者圣殿所应有的。
  - type: heading2
    initial:
      ru: '147.'
      cn: '147.'
    text:
      ru: Чудесное исправление письма блаженного папы Льва Флавиану.
      cn: 真福教宗利奥致弗拉维安信函的奇迹般修正。
    children:
    - type: paragraph
      text:
        ru: 'Вот что еще рассказал нам авва Мина, настоятель той же киновии, как слышанное от самого аввы Евлогия папы Александрийского. Когда я был в Константинополе, я пользовался приязнию архидиакона римской церкви господина Григория, мужа весьма добродетельного. Он мне рассказывал о святейшем и блаженнейшем Льве, папе Римском. В римской Церкви записано предание, что папа, написав свое послание к св. Флавиану, патриарху Константинопольскому, против нечестивых Евтихия и Нестория, положил его на гробницу верховного апостола Петра и, пребывая в молитве, посте и коленопреклонении, просил верховного ученика: «Если я, как человек, что-нибудь пропустил, ты, которому ввереныЦерковьи этот престол от Господа и Бога и Спаса нашего Иисуса Христа, сам исправь написанное мною». По прошествии сорока дней Апостол явился ему во время молитвы и сказал: «Прочитал и исправил». Взяв послание с гроба св. Петра, папа развернул его и нашел исправленным рукою Апостола.'
        cn: '这便是阿爸米纳院长，据他亲耳听闻自亚历山大宗主教阿爸欧洛基奥斯，所讲述的又一件事。


          当我在君士坦丁堡时，我享有罗马教会总执事格里高利先生的友谊，他是一位品德高尚的人。他向我讲述了关于至圣至福的罗马教宗利奥的事迹。罗马教会记载着这样一个传统，说教宗在写完他致君士坦丁堡宗主教圣弗拉维安的书信，以驳斥不敬神的欧提奇和聂斯托利之后，将书信置于至高使徒彼得的墓上，并且，在祷告、禁食和跪拜中，他恳求这位至高门徒说：「如果我，作为一个凡人，有任何遗漏之处，你，蒙我们的主、我们的神、我们的救主耶稣基督托付教会和此座位的，请亲自修正我所写的一切。」 四十天后，使徒在祷告中向他显现，并说：「我已阅读并修正。」 教宗从圣彼得的墓上取下书信，他展开了它，发现它已被使徒亲手修正。'
  - type: heading2
    initial:
      ru: '148.'
      cn: '148.'
    text:
      ru: Видение Феодора епископа Дарны Ливийской о том же блаженном Льве.
      cn: 利比亚德尔纳主教提奥多尔关于同一位圣莱夫的异象。
    children:
    - type: paragraph
      text:
        ru: 'Святейший епископ города Дарны в Ливии Феодор рассказал нам: когда я был синкеллом св. папы Евлогия, я увидел во сне благолепного и великого мужа, говорившего мне:'
        cn: 圣提奥多尔，利比亚德尔纳城的主教，告诉我们说：当我是圣教宗尤洛吉乌斯的协同主教时，我梦中看见一位庄严而伟大的男子，对我说：
    - type: paragraph
      text:
        ru: – Извести о моем приходе папу Евлогия.
        cn: ——告知优罗吉奥斯教父我的到来。
    - type: paragraph
      text:
        ru: – Кто ты, владыко, и как прикажешь известить о тебе?
        cn: – 你是谁，主教大人，你吩咐我如何宣告你的身份？
    - type: paragraph
      text:
        ru: – Я – Лев, папа Римский, – отвечал мне явившийся.
        cn: ——我就是利奥，罗马教宗，——那显现者回答我。
    - type: paragraph
      text:
        ru: 'Войдя к папе Евлогию, я возвестил ему: «Святейший и блаженнейший папа Лев, предстоятель Церкви Римской, желает поклониться вам». Папа Евлогий, лишь только услышал, немедленно встал и поспешил ему навстречу. После взаимных приветствий, сотворив молитву, они сели. Тогда воистину чудный и богоносный Лев обратился к папе Евлогию со словами:'
        cn: 我来到叶夫洛吉乌斯教宗那里，向他宣告道：「至圣至福的利奥教宗，罗马教会的首牧，希望拜会您。」叶夫洛吉乌斯教宗一听到此话，立刻站了起来，急忙迎上前去。彼此问候之后，他们做了祷告，然后就坐了。于是，这位真正奇妙且蒙受神恩的利奥对叶夫洛吉乌斯教宗说道：
    - type: paragraph
      text:
        ru: – Знаешь ли, зачем я пришел к вам?
        cn: – 你知道我为什么来找你们吗？
    - type: paragraph
      text:
        ru: – Нет, – отвечал папа Евлогий.
        cn: 不，教宗叶夫洛吉乌斯回答说。
    - type: paragraph
      text:
        ru: – Я пришел поблагодарить вас за то, что вы прекрасно и сильно вступились за мое послание, которое я написал к брату нашему Флавиану, патриарху Константинопольскому, раскрыли мою мысль и заградили уста еретиков. Знай, брат, что вы не мне только угодили своим подвигом, а верховному Апостолу Петру и прежде всего Самой, проповедуемой нами, Истине, Которая есть Христос, Бог наш.
        cn: ——我来感谢您，因您出色且强有力地维护了我写给我们弟兄、君士坦丁堡牧首弗拉维安的书信，阐明了我的思想，并堵住了异端分子的口。弟兄，您当知道，您以您的善行所取悦的，不仅是我，更是首席使徒彼得，而首要的是，我们所宣扬的真理本身，祂就是基督，我们的上帝。
    - type: paragraph
      text:
        ru: 'Видев не раз, но трижды это сновидение и убежденный троекратным видением, я рассказал о нем св. папе Евлогию. Он, выслушав меня, заплакал. Простирая руки к небу, он вознес благодарность Богу, говоря: «Благодарю Тебя, Господи Христе Боже наш, что удостоил меня, недостойного, быть проповедником Твоей истины, и ради молитв служителей Твоих Петра и Льва благость Твоя приняла малое усердие мое, как две лепты вдовицы».'
        cn: 见了这梦不只一次，而是三次，并被这三次异象所确证，我把这事告诉了圣教宗尤洛吉奥。他听完我的话，就哭了。他向天伸开双手，向上帝献上感谢，说：「感谢祢，主基督我们的上帝，祢使我这不配之人，得以成为祢真理的传讲者；又因着祢的仆人彼得和利奥的祷告，祢的恩慈接纳了我微小的热心，如同寡妇的两个小钱。」
  - type: heading2
    initial:
      ru: '149.'
      cn: '149.'
    text:
      ru: Рассказ Аммоса, патриарха Иерусалимского о св. Льве папе Римском.
      cn: 耶路撒冷牧首阿摩斯关于圣利奥罗马教宗的记述。
    children:
    - type: paragraph
      text:
        ru: 'Когда авва Аммос пришел в Иерусалим и был рукоположен в патриарха, пришли поклониться ему все настоятели монастырей. В числе их был и я со своим игуменом. И вот патриарх начал говорить отцам: «Молитесь обо мне, отцы, потому что на меня возложено великое и неудобоносимое бремя, и немало страшит меня патриаршее служение. Петру, Павлу, Моисею и подобным им под силу пасти разумные души, а я – бедный грешник. Но более всего устрашает меня трудность рукоположения. Я читал, что блаженный Лев, бывший предстоятелем Церкви Римской, в течение сорока дней пребывал при гробе Апостола Петра в непрестанной молитве и посте, прося Апостола, чтобы он предстательствовал за него пред Богом и испросил ему отпущение его прегрешений. По прошествии сорока дней, апостол Петр явился ему и сказал: «Я молился о тебе, и прощены тебе все твои грехи, кроме – рукоположения. Вот в этом только ты сам должен будешь дать отчет, правильно ли рукополагал ты поставленных тобою».'
        cn: 当阿巴·安摩斯来到耶路撒冷并被按立为牧首时，所有修道院的院长都来向他敬拜。我和我的院长也在其中。于是牧首开始对诸位教父说：「诸位教父，请为我祷告，因为有一个巨大而难以承受的重担加在我身上，牧首的职事让我非常恐惧。彼得、保罗、摩西和像他们这样的人能够牧养有理性的灵魂，而我——却是一个可怜的罪人。但最让我恐惧的是按立的艰难。我读到，曾任罗马教会首牧的蒙福者利奥，在四十天里不停地祷告和禁食，待在使徒彼得的坟墓旁，请求这位使徒为他在上帝面前代求，并为他求得他罪过的赦免。四十天过后，使徒彼得向他显现并说：『我已为你祷告，你的所有罪过都已蒙赦免，除了——按立。唯独在这一点上，你将需要亲自做出交代，关于你是否正确地按立了由你所任命的人。』」
  - type: heading2
    initial:
      ru: '150.'
      cn: '150.'
    text:
      ru: Повесть о епископе городка Ромиллы.
      cn: 罗米拉小镇主教的故事
    children:
    - type: paragraph
      text:
        ru: 'Авва Феодор рассказывал нам, что в тридцати милях от Рима находится городок Ромилла. Там был епископом великий и добродетельный муж. Однажды несколько человек из Ромиллы пришли к блаженнейшему папе Римскому Агапиту и оклеветали пред папою своего епископа в том, что он ест из освященного сосуда. Папа, пораженный этим известием, посылает двух клириков, которые пешком привели в Рим связанного епископа и ввергли в темницу. Епископ провел три дня в темнице, и настал воскресный день. На рассвете воскресного дня папа видит во сне, что кто-то говорит ему: «В это воскресенье ни ты и никто из клириков или находящихся в городе епископов не будет совершать литургии, но да совершит ее епископ, которого ты держишь заключенным в темнице. Я желаю, чтобы он совершил сегодня литургию». Папа проснулся и недоумевал относительно видения. Такое обвинение возвели на него – и он будет совершать литургию!? Но, заснув, он в видении слышит тот же голос: «Я сказал тебе, что епископ, состоящий под стражею, да совершит литургию!» И в третий раз то же видение повторилось, и тот же голос слышал недоумевавший папа. Пробудившись, он посылает в темницу за епископом и стал его расспрашивать: «Чем ты занимаешься?» На все расспросы епископ повторял только одно: «Я грешник». Не добившись ничего более от епископа, папа сказал ему: «Сегодня ты будешь совершать литургию». Епископ стоял пред св. престолом, папа стоял близ него, и диаконы окружали престол. И стал епископ совершать св. возношение... Он уже оканчивал молитву св. приношения, но, прежде чем заключить ее, начал опять снова, а потом в третий и в четвертый раз начинал святое возношение, не оканчивая его... Все были изумлены такою медлительностью... Тогда папа сказал епископу: «Что это значит, что ты вот четыре раза произнес святую молитву и все не можешь ее окончить?» Епископ отвечал: «Прости меня, св. папа, я не видел, по обыкновению, схождения Св. Духа, потому и не оканчивал молитвы. Но удали от св. престола диакона, держащего рипиду, так как я сам не смею сказать ему». Диакон удалился, по приказанию св. Агапита, немедленно епископ и папа увидели наитие Св. Духа. Покров, лежавший на св. престоле, поднялся сам собою и осенял в течение трех часов папу и епископа и всех диаконов, предстоявших св. престолу... Тогда св. Агапит понял, что этот епископ велик пред Богом, и оклеветан. И печалясь о том, что причинил ему огорчение, дал себе слово никогда более не решать чего-либо необдуманно, но осмотрительно и терпеливо.'
        cn: 阿爸费奥多尔向我们讲述，在罗马三十英里外有一个小镇叫罗米利亚。那里有一位伟大而品德高尚的主教。有一天，罗米利亚的几个人来到至福的罗马教宗阿加皮图斯那里，在教宗面前诬告他们的主教用受祝圣的器皿进食。教宗听到这个消息后感到震惊，便派了两名神职人员，他们步行将这位被捆绑的主教带到罗马，并把他投入监狱。主教在监狱里度过了三天，直到主日来临。在主日黎明时分，教宗梦见有人对他说：「这个主日，你和城里任何一位神职人员或主教都不得举行圣祭礼仪，而是要由你关押在监狱里的那位主教来举行。我希望他今天举行圣祭礼仪。」教宗醒来，对这个异象感到困惑。他被施加了这样的指控——他竟然要举行圣祭礼仪？！但是，他又睡着了，在异象中听到了同样的声音：「我已经告诉过你，那位被关押的主教，让他举行圣祭礼仪！」第三次，同样的异象再次出现，那位困惑的教宗听到了同样的声音。他醒来后，派人去监狱把主教带来，并开始询问他：「你都做了些什么？」对于所有的询问，主教只重复一句话：「我是个罪人。」教宗从主教那里没有问出更多，便对他说：「今天你将举行圣祭礼仪。」主教站在圣祭坛前，教宗站在他身旁，执事们环绕着祭坛。主教开始举行神圣的奉献……他已经快要完成圣奉献的祷文，但在结束之前，他又重新开始，然后第三次、第四次地开始神圣的奉献，却都没有结束……所有人都对这种缓慢感到惊讶……于是教宗对主教说：「这是什么意思，你已经念了四次神圣祷文，却都无法完成？」主教回答说：「请原谅我，圣教宗，我没有像往常一样看到圣灵的降临，所以才没有完成祷文。但是请把那位拿着扇的执事从圣祭坛旁移开，因为我自己不敢对他说。」执事按照圣阿加皮图斯的命令离开了，主教和教宗立刻看到了圣灵的降临。覆盖在圣祭坛上的幔子自己升起，在三个小时内遮蔽着教宗、主教以及所有在圣祭坛前侍立的执事们……那时，圣阿加皮图斯明白这位主教在上帝面前是伟大的，并且他受到了诬告。他为自己给主教带来的痛苦而感到悲伤，并立誓今后绝不再草率行事，而是要审慎而有耐心地做出决定。
  - type: heading2
    initial:
      ru: '151.'
      cn: '151.'
    text:
      ru: Рассказ аввы Иоанна персианина о божественном Григории, папе Римском.
      cn: 波斯人阿爸约翰关于神圣的罗马教宗格里高利的记述。
    children:
    - type: paragraph
      text:
        ru: Когда мы прибыли в Келлии к авве Иоанну персидскому, он рассказывал нам о блаженнейшем епископе РимскомГригории Великом.
        cn: 当我们抵达凯利，来到波斯人长老约翰那里时，他向我们讲述了关于至福的罗马主教格里高利大帝。
    - type: paragraph
      text:
        ru: 'Я ходил в Рим на поклонение гробам свв. апостолов Петра и Павла. Однажды я стоял в городе и увидал, что идет папа Григорий, и что ему придется проходить мимо меня. Я решился поклониться ему. Заметив мое намерение, каждый из его свиты, один перед другим, говорили мне: «Авва, не кланяйся!» Но я не понимал, почему это, и считал вовсе неприличным не поклониться папе. Когда папа приблизился ко мне, заметив мое намерение поклониться ему – говорю, – как перед Богом, братия! – Папа первый бросился предо мною на землю и не прежде встал, как я первый стал на ноги. И облобызав меня с великим смиренномудрием, из своих рук дал мне три номисмы и приказал дать мне еще кусуллий и все нужное. Я прославил Бога, даровавшего ему такое смирение, милосердие и любовь ко всем.'
        cn: 我曾去罗马朝拜圣使徒彼得和保罗的坟墓。有一次，我站在城里，看见教宗格里戈里走过来，并且他将从我身边经过。我决定向他鞠躬。他的随从们注意到我的意图，便一个接一个地对我说：「阿爸，不要鞠躬！」但我不明白这是为什么，并且认为不向教宗鞠躬是完全不合宜的。当教宗走近我时，他注意到我想要向他鞠躬的意图——弟兄们，我在神面前说！——教宗却首先在我面前扑倒在地，并且直到我首先站起身来，他才起身。他带着极大的谦卑亲吻了我，并亲手给了我三枚诺米斯马，又吩咐再给我一块库苏利和所有需要的东西。我赞美了上帝，因为他赐予教宗如此的谦卑、怜悯以及对所有人的爱。
  - type: heading2
    initial:
      ru: '152.'
      cn: '152.'
    text:
      ru: Жизнь аввы Маркелла скитиота, из лавры Келлий, и его наставления.
      cn: 来自凯利亚大修道院的斯基特修士阿爸马凯路士的生平与教导。
    children:
    - type: paragraph
      text:
        ru: 'Мы пришли в лавру Келлий к авве скитскому – Маркеллу. Желая беседой доставить нам пользу, старец рассказал нам следующее: когда я жил еще на родине (он был родом из Апамеи), там был наездник по имени Филерем (с греческого – пустынелюбец).  Однажды он был побежден в состязании и не получил пальмы, и люди его партии поднялись и начали кричать: «Филерем не получает пальмы в городе». После моего удаления в скит случалось, что иногда одолевал меня помысел уйти в город или в селение – я тотчас говорил себе: «Маркелл! Филерем в городе не получает пальмы». И по милости Христа, эти слова так действовали на меня, что я не выходил из скита в течение тридцати пяти лет, пока не пришли варвары, разорившие скит, а я был продан в рабство в Пентаполь.'
        cn: '我们来到凯利亚修道院，拜访隐修院的阿爸——马尔凯鲁。这位长老希望通过谈话使我们受益，便讲述了以下故事：


          当我还在故乡时（他来自阿帕梅亚），那里有一位骑手名叫斐勒楞（希腊语意为「爱荒野者」）。有一次，他在比赛中落败，未能赢得棕榈枝，他那一派的人便起来呼喊说：「斐勒楞在城中没有赢得棕榈枝！」在我退隐到隐修院之后，有时会有离开，去往城市或村庄的意念胜过我——我便立刻对自己说：「马尔凯鲁啊！斐勒楞在城中没有赢得棕榈枝！」籍着基督的恩典，这些话语如此影响着我，以至于三十五年来我都没有离开过隐修院，直到蛮族前来，摧毁了隐修院，而我则被卖到本塔波利成为奴隶。'
    - type: paragraph
      text:
        ru: 'Тот же авва Маркелл рассказал нам как бы о другом скитском старце (а это был он сам). Однажды ночью он встал для совершения правила. Начал правило – и слышит звук трубы как-бы на войне. Смущенный этим, старец размышлял: откуда этот звук? Воинов здесь нет, время мирное. Среди этих размышлений, он видит близ себя демона, который сказал ему: «Нет, теперь война! Если же не желаешь воевать и подвергаться нападениям, ступай – ложись и спи, и не потерпишь нападений». В другой раз старец говорил нам: «Поверьте мне, чада, ничто так не возмущает, не беспокоит, не раздражает, не уязвляет, не уничтожает, не оскорбляет и не вооружает против нас демонов и самого виновника зла сатану, как постоянное упражнение в псалмопении. Все священное Писание полезно и чтение его не мало причиняет неприятности демону, но ничто столь не сокрушает его, как Псалтирь. Подобно тому, как среди народа – если одна часть его прославляет царя, другая не оскорбляется этим, не вооружается против прославляющих и только, подвергшись оскорблениям, возмущается и поднимется против них, так и демоны: они не столько огорчаются и возмущаются чтением св. Писания, как пением псалмов. Упражняясь в псалмопении, мы с одной стороны возносим молитву Богу, с другой – проклинаем диавола. Так, мы молимся, произнося:«помилуй мя, Боже, по велицей милости  Твоей и по множеству щедрот Твоих очисти беззаконие мое»(Пс.50:3);  также:«не отвержи мене от лица Твоего, и Духа Твоего Святаго не отъими  отмене»(Пс.50, 13);«не отвержи мене во время старости,  внегда оскудевати крепости моей, не остави мене»(Пс.70, 9).  С другой стороны, проклинаем демонов:«да воскреснет Бог,  и расточатся врази Его, и да бежат от лица Его ненавидящии Его»(Пс.67, 2);  равным образом:«расточи языки, хотящия бранем»(Пс.67, 31).«Видех нечестиваго превозносящася и высящася, яко кедры Ливанския.  И мимоидох, и се не бе взысках, его и не обретеся место его»(Пс.36, 35–36);  еще:«меч... да внидет в сердца их»(Пс.36:15); или также:«ров изры, и ископа и,  и падет в яму, юже содела. Обратится болезнь его на главу его и у верх его  неправда его снидет»(Пс.7, 16–17).'
        cn: '同样的阿巴·马尔凯尔告诉我们，仿佛关于另一位斯基特隐修院长老（而这正是他自己）。一天夜里，他起身履行他的功课。他刚开始功课，就听到号角声，仿佛是在战场上。长老为此感到困惑，他思忖着：这声音从何而来？这里没有战士，现在是和平时期。正在他思忖之时，他看到身边有一个邪魔，对他说：「不，现在是战争！如果你不愿争战，也不愿遭受攻击，你就去躺下睡觉吧，就不会遭受攻击了。」


          另一次，长老告诉我们：「孩子们，你们相信我，没有什么能像持续的颂唱圣咏那样，如此激怒、困扰、惹恼、伤害、摧毁、侮辱，并武装魔鬼以及那邪恶的始作俑者撒旦来对抗我们。所有的圣经都是有益的，诵读圣经也让魔鬼颇为不快，但没有什么能像《诗篇》那样，如此击溃它。就像在民众当中——如果一部分人颂扬君王，另一部分人并不会因此感到被冒犯，也不会武装起来对抗颂扬者，只有当他们遭受侮辱时，才会感到激怒并奋起反抗——魔鬼也是如此：它们不那么因诵读圣经而感到悲伤和激怒，却更因颂唱圣咏而感到悲伤和激怒。操练颂唱圣咏时，我们一方面向上帝献上祷告，另一方面则诅咒魔鬼。如此，我们祷告，诵念着：『上帝啊，求祢按祢的厚恩怜悯我，照祢丰盛的慈悲涂抹我的过犯』（诗篇 50:3）；也：『不要丢弃我，使我离开祢的面，也不要从我收回祢的圣神』（诗篇 50:13）；『我年老的时候，不要丢弃我；我气力衰弱的时候，不要离弃我』（诗篇 70:9）。另一方面，我们诅咒邪魔：『愿上帝兴起，使祂的仇敌四散，使恨祂的人从祂面前逃跑』（诗篇 67:2）；同样：『求祢驱散那些好战的民族』（诗篇 67:31）。『我见过恶人，盛气凌人，高耸如黎巴嫩的香柏树。但我经过时，看哪，他已不在；我寻找他，却找不到他的踪影』（诗篇 36:35-36）；又：『刀剑……愿它刺入他们的心』（诗篇 36:15）；或者：『他挖了一个坑，又掘深了，自己反跌进他所挖的陷阱里。他的毒害必归到自己头上，他的强暴必落到自己头顶』（诗篇 7:16-17）。」'
    - type: paragraph
      text:
        ru: 'Говорил также старец:'
        cn: 长老也说：
    - type: paragraph
      text:
        ru: «Поверьте мне, чада, великая честь и хвала, если кто, отрекшись от царства, станет иноком, так как духовные блага выше чувственных, равно как, наоборот, стыд и срам иноку, отказавшемуся от своего звания – хотя бы он и приобрел царство.
        cn: 「孩子们，请相信我，如果有人舍弃了王国而成为修士，这是极大的尊荣与赞美，因为属灵的福祉超越属世的。同样地，反之，对于一位放弃了自己的职分的修士而言，则是羞耻和耻辱，即便他获得了王国。」
    - type: paragraph
      text:
        ru: Человек вначале был подобен Богу. Отпав от Бога, уподобился животным.
        cn: 人起初肖似上帝。从上帝堕落后，就肖似动物了。
    - type: paragraph
      text:
        ru: Сама природа, братия, возбуждает нас к страстям. Но усиленное подвижничество погашает их. Узнай на самом опыте добрую жизнь, и тогда не будешь бояться ее, как чего-то невозможного.
        cn: 弟兄们，我们本身的本性就激发我们的情欲。但加倍的苦修熄灭它们。通过亲身经验去认识良善的生活，那么你就不会再把它视作某种不可能之事而害怕了。
    - type: paragraph
      text:
        ru: Не удивляйся тому, что, будучи человеком, можешь сделаться равным ангелам. Тебе предстоит слава, одинаковая с ангелами, и сам Подвигоположник обещает ее подвизающимся.
        cn: 不要惊讶，你虽为人，却能变得与天使等同。与天使等同的荣耀正等待着你，并且那设立争战者亲自将其应许给那些争战者。
    - type: paragraph
      text:
        ru: Ничто так не приближает иноков к Богу, как прекрасная, святая и боголюбезная чистота сердца – она украшает нас и делает нас способными никогда не удаляться от Бога. О ней свидетельствует Всесвятый Дух устами божественного Павла (1Кор. 7, 35).
        cn: 没有什么能像美好的、神圣的、以及为上帝所喜悦的心灵纯洁那样，使隐修士更接近上帝——它妆点我们，并使我们能够永不远离上帝。至圣圣灵借着圣保罗的口（哥林多前书 7:35）为它作证。
    - type: paragraph
      text:
        ru: Чада, предоставим брак и рождение чад мирским! Но худо, если и они взирают только на землю, жаждут временных благ и не радят о грядущих, не – ищут стяжания вечных сокровищ и не могут отрешиться от временных.
        cn: 众子啊，让我们把婚姻和生儿育女的事让给世人吧！但糟糕的是，如果他们也只顾念地上的事，贪求暂时的福乐，不顾念将来的事，不寻求积攒永恒的财宝，并且不能超脱暂时的（事物）。
    - type: paragraph
      text:
        ru: Поспешим уйти от плотской жизни, подобно Израилю, бежавшему от рабства египетского.
        cn: 让我们赶紧摆脱肉体生活，如同以色列人逃离埃及的奴役。
    - type: paragraph
      text:
        ru: Братия, нам обетованы светлые и сладчайшие дары Божии взамен грубых удовольствий мира.
        cn: 弟兄们，光明而至甘甜的上帝恩赐已应许给我们，以取代世上粗鄙的享乐。
    - type: paragraph
      text:
        ru: Будем избегать матери всех зол – сребролюбия!»
        cn: 我们要避免万恶之母——贪财！
  - type: heading2
    initial:
      ru: '153.'
      cn: '153.'
    text:
      ru: Ответ инока брату мирянину.
      cn: 修士致平信徒弟兄的答复。
    children:
    - type: paragraph
      text:
        ru: 'В Константинополе были два брата – мирянина. Они были очень набожны и много постились. Один из них пришел в Раиф, отрекся от мира и стал иноком. После пришел к нему в Раиф оставшийся в миру брат – навестить брата инока. Живя у брата, мирянин увидал, что инок, брат его, принимает пищу в девятом часу, и, соблазнившись, сказал ему: «Брат, в миру ты не вкушал пищи до заката солнца». Монах отвечал ему: «Это правда, брат! Но в миру я насыщался чрез уши: пустая людская слава и похвалы не мало питали меня и облегчали труды подвижничества».'
        cn: 在君士坦丁堡，有两位平信徒兄弟。他们非常虔诚，常常禁食。其中一位来到拉伊夫，舍弃世俗，成了一名修士。后来，留在世俗的兄弟来到拉伊夫看望这位修士兄弟。在兄弟那里居住时，这位平信徒看到他的修士兄弟在第九个时辰才进食，心生困惑，便对他说：「兄弟，你在世俗中直到太阳下山才进食啊！」这位修士回答他说：「这确实是事实，兄弟！但在世俗中，我通过耳朵得到饱足：虚浮的人间荣耀和赞美，给了我不少滋养，并减轻了我苦修的劳苦。」
  - type: heading2
    initial:
      ru: '154.'
      cn: '154.'
    text:
      ru: Жизнь Феодора мирянина, человека Божия.
      cn: 神人提奥多尔平信徒的生平。
    children:
    - type: paragraph
      text:
        ru: 'Авва Иоанн воск говорил нам: трое нас отшельников пришли к авве Николаю, жившему у потока Бетасимского. Это – между св. Елпидием и монастырем, так называемым «Чужестранных». Войдя к нему в пещеру, мы увидали там одного мирянина. Началась душеспасительная беседа. Авва Николай обратился к мирянину:'
        cn: 阿爸伊奥安蜡对我们说：我们三个隐修士来到阿爸尼古拉那里，他住在贝塔西姆溪流边。这地方在圣叶尔皮季和所谓「异乡人」修道院之间。我们走进他的山洞时，看见那里有一位平信徒。一场裨益灵魂的谈话展开了。阿爸尼古拉对那位平信徒说：
    - type: paragraph
      text:
        ru: – Скажи же и ты нам что-нибудь.
        cn: – 那么，你也给我们说点什么吧。
    - type: paragraph
      text:
        ru: – Что ж я, мирской человек, могу сказать вам полезного? О, если бы я себе самому мог принести пользу! – отвечал тот.
        cn: ——我，一个平信徒，又能对你们说些什么有益的话呢？哦，但愿我自己能够受益！——那人回答说。
    - type: paragraph
      text:
        ru: – А все-таки ты можешь сказать что-нибудь, – возразил старец.
        cn: 「但毕竟，你总还能说点什么吧，」长老反驳道。
    - type: paragraph
      text:
        ru: 'Тогда мирянин рассказал нам: «Вот уже двадцать два года, как солнца никогда не видало меня за едой, кроме субботних и воскресных дней. Я живу работником в селе у одного богатого, но несправедливого и жадного человека. Прожил я у него пятнадцать лет, работая день и ночь. Он не хочет отдавать мне платы и ежегодно немало обижает меня. Но я сказал себе: «Феодор, если ты вынесешь жизнь у этого человека, он приготовит тебе царство небесное вместо платы, какую ты заслужил... Тело свое я сохранил доселе чистым от прикосновения к женщине»... Выслушав это, мы получили великую пользу для души.'
        cn: 那时，那位平信徒对我们讲述：「至今已有二十二年了，我用餐时从不见日光，除了周六和周日。我在乡下，给一个富有但却不公义又贪婪的人做工。我在他那里做了十五年，日夜劳作。他不愿付给我工钱，并且每年都对我诸多欺压。但我对我自己说：『狄奥多尔，如果你能忍受在这个人手下的生活，他将为你预备天国，作为你应得工钱的替代…我的身体至今保守贞洁，未曾与女人亲近。』」听了这话，我们的灵魂获益匪浅。
  - type: heading2
    initial:
      ru: '155.'
      cn: '155.'
    text:
      ru: Рассказ аввы Иордана о жестокости сарацин.
      cn: 阿爸约尔丹关于萨拉森人残暴的故事。
    children:
    - type: paragraph
      text:
        ru: 'Вот что еще рассказал нам авва Иордан об авве Николае. Старец рассказывал: в царствование благоверного императора Маврикия, когда сарацинский предводитель Намес производил грабежи, я проходил по близости Аннона и Эдона. Увидал трех сарацин и при них юношу замечательной красоты, лет двадцати. Это был пленник. Завидев меня, юноша стал со слезами умолять меня, чтобы я освободил его. Я принялся упрашивать сарацин, чтобы они отпустили его.'
        cn: '此外，阿巴·约尔丹还向我们讲述了关于阿巴·尼古拉的这件事。长老讲述道：


          在敬虔的皇帝莫里斯统治时期，当时撒拉逊首领纳梅斯正在大肆劫掠，我途经安农和艾顿附近。我看到三名撒拉逊人，他们身边有一名大约二十岁、异常俊美的青年。他是一名俘虏。那青年一看到我，便流着泪恳求我将他释放。我开始恳求那些撒拉逊人放了他。'
    - type: paragraph
      text:
        ru: – Не пустим! – ответил мне по-гречески один из них.
        cn: 「不让进！」他们中的一个用希腊语回答我。
    - type: paragraph
      text:
        ru: – Возьмите лучше меня, а его отпустите, – сказал я. – Ведь он не может вынести горя.
        cn: 「不如带走我，放了他吧，」我说，「毕竟他受不了这苦难。」
    - type: paragraph
      text:
        ru: – Не пустим! – сказал мне тот самый.
        cn: ——我们不放行！——就是那个人对我说道。
    - type: paragraph
      text:
        ru: – И выкупа не возьмете за него? Отдайте мне его. Я возьму его с собою и принесу вам, что пожелаете.
        cn: – 难道你们不收他的赎金吗？把他给我吧。我将把他带走，然后把你们想要的带给你们。
    - type: paragraph
      text:
        ru: '– Не можем отдать тебе его, – возразил мне сарацин, –  потому что мы обещали нашему жрецу: если найдем что-нибудь хорошее из плена, принесем ему для жертвоприношения. А ты лучше уходи, а не то снесем и тебе голову. Тогда, повергшись пред Богом, я произнес: «Спасителю наш, Господи Боже, спаси раба Твоего!» И тотчас три сарацина, объятые бешенством, обнажили мечи и изрубили друг друга. Я взял юношу к себе в пещеру, и он не пожелал уйти от меня, но отрекся от мира. Проживши иноком семь лет, скончался. Родом он был из Тира.'
        cn: 「我们不能把他给你，」撒拉逊人反驳我道，「因为我们向我们的祭司许诺过：若是我们从俘虏中找到任何好东西，就献给他作为祭品。你最好还是走吧，不然的话，我们连你的头也要砍掉。」于是，我在上帝面前俯伏下来，说道：「我们的救主，主上帝啊，拯救您的仆人吧！」而就在那时，三个撒拉逊人怒不可遏，拔出刀剑，互相砍杀起来。我把那少年带回我的洞穴，他也不愿离开我，反而弃绝了世俗。作修士七年之后，便去世了。他原籍是提尔。
  - type: heading2
    initial:
      ru: '156.'
      cn: '156.'
    text:
      ru: Ответ старца философам.
      cn: 长老对哲学家们的回应。
    children:
    - type: paragraph
      text:
        ru: Два философа пришли однажды к старцу и просили сказать им слово назидания, но старец молчал.
        cn: 两位哲学家有一次来到一位长老那里，请求他赐给他们一句训言，但长老却保持沉默。
    - type: paragraph
      text:
        ru: – Что же ты не отвечаешь нам, отче? – спросили философы.
        cn: 「父啊，你为何不回答我们呢？」哲学家们问道。
    - type: paragraph
      text:
        ru: – Что вы филологи, т.е. любословы – это я знаю, но в то же время уверяю вас, что вы вовсе не философы. Доколе будете учиться говорить – вы, никогда не знающие, как и о чем говорить? Вот вам предмет для вашей философии – размышлять непрестанно о смерти. И спасайте себя в безмолвии и тишине!
        cn: ——你们是语文学家，也就是说，是爱言者——这一点我知道，但同时我向你们保证，你们根本不是哲学家。你们要学习讲话到何时呢——你们这些从不知道该如何、又该讲些什么的人？这就是你们哲学的课题——不停地默想死亡。并且在寂静与安宁中拯救自己！
  - type: heading2
    initial:
      ru: '157.'
      cn: '157.'
    text:
      ru: Сказание о собачке, показавшей путь брату.
      cn: 小狗为兄弟指路的故事。
    children:
    - type: paragraph
      text:
        ru: 'Я и софист Софроний – пришли в лавру Каламон, что близ св. Иордана, к авве Александру. У него мы увидали двух иноков Сувивского Сирского монастыря. Они рассказали нам: за десять дней приходил сюда чужеземный старец. Зайдя в Сувив Бессов, сделал пожертвование. Потом, обратившись к настоятелю, сказал: «Сделай милость, пошли в соседний монастырь Сиров, чтобы пришли и получили пожертвование. Да пусть уж дадут знать и в монастырь Хорембский, чтобы пришли за тем же». Авва послал одного брата к игумену Сувина Сирского. Брат пришел к игумену и говорит:'
        cn: 我和辩士索弗罗尼来到了靠近圣约旦河的卡拉蒙隐修院，拜访亚历山大长老。我们在他那里见到了两位来自苏维夫叙利亚修道院的修士。他们告诉我们：十天前，有一位外来的长老来到这里。他进入苏维夫贝索夫，作了奉献。然后，他转向院长，说：「请您派人去隔壁的叙利亚人修道院，让他们过来领取这份奉献。也请派人告知霍伦布修道院，让他们也过来领取同样的奉献。」长老派了一个修士去苏维夫叙利亚修道院的院长那里。这位修士来到院长那里，对他说：
    - type: paragraph
      text:
        ru: – Ступай в монастырь Бессов, да извести и Хорембу, чтобы пришли и оттуда.
        cn: ——去别索夫修道院，并通知霍连巴，好让他们也从那里过来。
    - type: paragraph
      text:
        ru: – Прости, брат, – отвечал старец, – мне совсем некого послать. Будь столь добр, сходи, пожалуйста, и скажи им сам.
        cn: 「抱歉，弟兄，」长老回答说，「我实在无人可派。您就劳驾，请亲自去一趟告诉他们吧。」
    - type: paragraph
      text:
        ru: – Но я никогда не ходил туда и не знаю дороги, – сказал брат.
        cn: ——但我从未去过那里，也不知道路。——那个弟兄说。
    - type: paragraph
      text:
        ru: 'Тогда старец сказал собачке: «Ступай с братом в монастырь Хорембский, чтобы он дал туда известие». И собака пошла с братом и довела его до ворот монастыря. Рассказавшие это показали нам и собаку, потому что она была с ними.'
        cn: 于是长老对小狗说：「你和兄弟一起去霍列姆布斯修道院，让他把消息传到那里。」小狗就和兄弟一起走了，并把他带到了修道院门口。讲述这事的人也把小狗指给我们看，因为它当时和他们在一起。
  - type: heading2
    initial:
      ru: '158.'
      cn: '158.'
    text:
      ru: Об осле, служившем в обители Марес.
      cn: 关于一头在马雷斯修道院中服侍的驴子。
    children:
    - type: paragraph
      text:
        ru: 'В окрестностях Мертвого моря есть гора, под названием Марес. На горе живут отшельники. У них есть сад, в шести верстах, у подошвы горы, при морском заливе. Садом заведовал один из них. Всякий раз, как отшельники собирались в сад за овощами, они взнуздывали осла и говорили ему: «Ступай в сад к садовнику и принеси нам овощей». И осел, один отправлялся к садовнику. Став у двери, он ударял головою в дверь. И тотчас садовник, навьючив его овощами, отпускал. Можно видеть, как осел ежедневно ходит один и служит только старцам, не повинуясь никому другому.'
        cn: 在死海附近有一座名为马雷斯的山。山上住着隐士。他们有一个园子，在六俄里外，山脚下一个海湾旁。这个园子由他们中的一位管理。每当隐士们想去园子里取菜时，他们就给驴子套上笼头，对它说：「去园子里找园丁，给我们带些菜回来。」于是驴子就独自去找园丁。到了门前，它就用头撞门。园丁立刻给它驮上蔬菜，然后放它走。可以看到，这驴子每天独自往返，只服侍那些长老们，不听从任何其他人。
  - type: heading2
    initial:
      ru: '159.'
      cn: '159.'
    text:
      ru: Жизнь аввы Софрония воска, и увещания Мины, игумена киновии Севериана.
      cn: 索弗罗尼长老的蜡生平，以及塞维里安共住修道院院长米纳的劝勉。
    children:
    - type: paragraph
      text:
        ru: 'Авва Мина, настоятель монастыря аввы Севериана, рассказывал нам об авве Софронии, воске: он подвизался в окрестностях Мертвого моря в течение семидесяти лет. Ходил нагим, питался только растениями и не вкушал ничего другого.'
        cn: 阿巴·米纳，阿巴·塞韦里安修道院的院长，告诉我们关于阿巴·索弗罗尼乌斯（蜡像）的事情：他在死海附近苦修了七十年之久。他赤身行走，只靠植物为生，不吃任何其他东西。
    - type: paragraph
      text:
        ru: 'Передавал нам также и то, что слышал из уст самого подвижника: «Я молил Господа, чтобы демоны не приближались к моей пещере. И я видел, что они на три стадии подходили к пещере, но не могли приблизиться». Так говорил авва Софроний: сам авва Мина поучал братию в монастыре: «Чада мои, будем избегать светских разговоров. Они, как известно, приносят вред, особенно молодым. Во всяком возрасте – стар и млад – должны приносить покаяние, чтобы заслужить жизнь вечную, которая принесет великую славу и честь – молодым за то, что они в цветущем возрасте, в самом разгаре страстей, подклонили выю свою под иго целомудрия, – старцам за то, что смогли искоренить усвоенную в течение многих лет злую привычку».'
        cn: '他也向我们转述了他亲自从那位苦行者口中所听到的话：

          「我祈求上主，不要让恶魔靠近我的洞穴。我看到它们靠近洞穴三段距离，却无法靠近。」阿巴·索弗罗尼就是这样说的：阿巴·米纳本人在修道院里教导修士们说：「我的孩子们，我们要避免世俗的交谈。众所周知，它们会带来伤害，特别是对于年轻人。无论年长年幼——在任何年龄——都应该悔改，以赢得永生，这永生将带来极大的荣耀和尊贵——对于年轻人而言，是因为他们在青春盛年，在情欲最炽烈之时，俯首于贞洁的轭下，——对于年长者而言，是因为他们能够根除多年养成的邪恶习惯。」'
  - type: heading2
    initial:
      ru: '160.'
      cn: '160.'
    text:
      ru: О явлении демона одному старцу в виде отрока, как бы сарацина.
      cn: 关于魔鬼向一位长老显现，其形如一个仿佛是撒拉逊人的少年。
    children:
    - type: paragraph
      text:
        ru: 'Павел, настоятель монастыря аввы Феогния, рассказывал нам: «Вот что говорил мне один старец-подвижник: однажды я сидел в своей келлии и занимался рукоделием: плел корзины и пел псалмы, как вдруг чрез окно вошел в келлию как бы отрок-сарацин, одетый в азарий и, став передо мною, начал плясать.'
        cn: 费奥格尼阿巴修道院的院长帕维尔对我们讲述：「有一位长者苦修者曾这样对我说：有一天，我坐在我的隐修小室里，做着手工：编织着篮子，并吟唱着圣咏，突然，好像一个撒拉逊少年穿过窗户走进了小室，穿着一件阿扎里，并且站在我面前，开始跳舞。」
    - type: paragraph
      text:
        ru: – Старик, хорошо ли я пляшу? – спросил меня. Я ничего не отвечал.
        cn: ——「老人，我跳得好不好？」他问我。我什么也没回答。
    - type: paragraph
      text:
        ru: – Как тебе нравится моя пляска, старик? – снова спросил он меня. С моей стороны – полное молчание.
        cn: 「——老头，你觉得我的舞跳得怎么样？」他再次问我。我这边——一片寂静。
    - type: paragraph
      text:
        ru: – Что ж, по-твоему, негодный старик, ты, что ль великое дело делаешь? Так я тебе скажу, что ты соврал в шестьдесят пятом, в шестьдесят шестом и в шестьдесят седьмом псалмах. Тогда я встал и повергся пред Богом, и он тотчас исчез».
        cn: ——那么，在你看来，你这卑劣的老头，难道你是在做什么伟大的事吗？我告诉你，你撒谎了，在第六十五篇、第六十六篇和第六十七篇诗篇中。那时我便起身，俯伏在上帝面前，他就立刻消失了。」
  - type: heading2
    initial:
      ru: '161.'
      cn: '161.'
    text:
      ru: Жизнь аввы Исаака из Фив, и о явлении ему демона в виде юноши.
      cn: 阿巴以萨迦（底比斯人）生平，以及魔鬼以青年形貌向他显现之事。
    children:
    - type: paragraph
      text:
        ru: 'В Фиваиде есть город Ликос. От города на расстоянии шести миль – гора, на которой обитают иноки: одни – в пещерах, другие – в келлиях. Придя туда, мы явились к авве Исааку, родом из Фив. Вот что рассказал нам старец: «Тому, о чем я хочу рассказать вам, прошло пятьдесят два года. Однажды я занимался своим рукодельем, плел большую сетку от комаров. Сделав ошибку, я очень горевал, что не мог найти ее. Целый день я раздумывал и не знал, что делать, как вдруг чрез окно входит юноша и говорит мне:'
        cn: 在底拜德（Фиваиде）有一个城市名叫利科斯（Ликос）。离城六英里远有一座山，隐修士们就居住在那里：有的住在洞穴里，有的住在小室里。我们到了那里，拜访了来自提比斯（Фив）的阿爸伊萨克（Исааку）。这位长老这样告诉我们：「我将要告诉你们的这件事，已经过去了五十二年。有一天，我正在做我的手工艺品，编织一个大的蚊帐。我犯了一个错误，却找不到它，为此我非常苦恼。我整天都在思考，不知道该怎么办，突然一个年轻人从窗户进来，对我说：」
    - type: paragraph
      text:
        ru: – Ты ошибся. Дай-ка мне, я исправлю.
        cn: ——你错了。给我，我来改。
    - type: paragraph
      text:
        ru: – Ступай вон! – говорю ему. – Прочь от меня...
        cn: 「滚出去！」我对他说，「离我远点……」
    - type: paragraph
      text:
        ru: – Но, ведь, ты введешь себя в изъян, если плохо сработаешь.
        cn: – 但是，你若做得不好，岂不是会给自己带来亏损吗？
    - type: paragraph
      text:
        ru: – Это – мое дело...
        cn: ——这是我的事……
    - type: paragraph
      text:
        ru: – Но мне жаль тебя, что потеряешь даром свой труд.
        cn: – 但我为你感到可惜，你的辛劳将白费。
    - type: paragraph
      text:
        ru: – На зло принесло тебя сюда...
        cn: – 出于恶意把你带到这里...
    - type: paragraph
      text:
        ru: – Да, ведь, ты сам заставил меня прийти сюда, и ты – мой...
        cn: ——是啊，毕竟，你自己迫使我来到这里，而你——我的……
    - type: paragraph
      text:
        ru: – Почему это?
        cn: – 为什么呢？
    - type: paragraph
      text:
        ru: – Да потому, что ты три воскресенья причащаешься, тая злобу на своего соседа.
        cn: ——就是因为你三个主日领受圣餐，却对你的邻舍心怀恶意。
    - type: paragraph
      text:
        ru: – Лжешь ты...
        cn: – 你撒谎……
    - type: paragraph
      text:
        ru: – Нет, не лгу. Ты злишься на него из-за чечевицы. Не правда ли? А я – дух злопамятства, и ты отселе мой...
        cn: ——不，我没说谎。你因扁豆而生他的气。不是吗？而我——是怀恨之灵，从今以后你属于我了……
    - type: paragraph
      text:
        ru: Услыхав это, я вышел из келлии, поспешил к брату, поклонился ему в ноги, и мы примирились. Возвратившись в келлию, я нашел, что он сжег сетку и циновку, на которой я молился, злобствуя на наше примирение».
        cn: 听到这话，我便走出小室，急忙来到弟兄那里，跪拜在他脚前，我们便和好了。回到小室，我发现他烧毁了网和那张我曾用来祷告的草垫，他对我们的和好仍心怀怨恨。
  - type: heading2
    initial:
      ru: '162.'
      cn: '162.'
    text:
      ru: Ответ аввы Феодора Пентапольского относительно разрешения на вино.
      cn: 阿巴提奥多尔·五城地区关于葡萄酒许可的回答。
    children:
    - type: paragraph
      text:
        ru: 'В двадцати милях от Александрии есть лавра, называемая Каламон, лежащая в средине между Октодекатом и Мафорою. Туда мы прибыли вместе с софистом Софронием к авве Феодору и спросили его:'
        cn: 在亚历山大二十英里外，有一座被称为卡拉蒙的拉乌拉，它位于奥克托德卡顿和马福拉之间。我们与智者索福罗尼一同来到那里，拜访了长老提奥多尔，并向他请教：
    - type: paragraph
      text:
        ru: – Хорошо ли, отче, если мы придем к кому или к нам придет кто-нибудь, и мы разрешили бы на вино?
        cn: – 好不好呢，神父，如果我们去拜访某人，或有人来拜访我们，我们是否可以准许饮用葡萄酒呢？
    - type: paragraph
      text:
        ru: – Нет! – отвечал старец.
        cn: ——不！——长老回答道。
    - type: paragraph
      text:
        ru: – А как же разрешали древние отцы?
        cn: – 古代教父们又是怎么解决的呢？
    - type: paragraph
      text:
        ru: – Древние отцы были велики и сильны – они и могли разрешать и опять запрещать. А наш род, чада, не может разрешать и запрещать. Если мы разрешим, то уже не выдержим строгого подвижничества.
        cn: ——古代教父是伟大且有力量的——他们能够准许，也能够禁止。而我们这一代人，孩子们，不能准许，也不能禁止。如果我们准许了，就再也无法承受严格的苦修了。
  - type: heading2
    initial:
      ru: '163.'
      cn: '163.'
    text:
      ru: Жизнь аввы Павла из Еллады.
      cn: 来自希腊的阿巴保罗生平
    children:
    - type: paragraph
      text:
        ru: 'Авва Александр в Каламонском монастыре, что близ св. Иордана, рассказывал нам: однажды я был у аввы Павла из Еллады в его пещере, и вот кто-то, подойдя, постучался в дверь. Старец пошел и отворил ему. Потом вынес хлеб и моченые бобы, предложил пришедшему, и тот стал есть. Я подумал, что это – странник, но, выглянув в окно, вижу, что это – лев.'
        cn: 阿爸亚历山大，在圣约旦附近的卡拉蒙斯基修道院里，曾对我们说：有一次，我在厄拉达的阿爸保罗的洞穴里，这时，有人走近，敲了敲门。老人走过去给他开了门。然后，他拿出面包和泡过的豆子，递给来者，来者便开始吃起来。我以为那是一位旅人，但我从窗户往外一看，却见那是一头狮子。
    - type: paragraph
      text:
        ru: – Зачем, старче, ты кормишь его? – скажи мне.
        cn: ——你为什么要喂养他，长老？——告诉我。
    - type: paragraph
      text:
        ru: – Я заповедал ему не нападать ни на человека, ни на скота. Приходи, сказал я ему, ежедневно ко мне, и я буду давать тебе корм. И вот семь месяцев как он приходил ко мне дважды в день, и я кормлю его.
        cn: ——我命令他不得攻击任何人，也不得攻击任何牲畜。我对他说，每天都到我这里来，我就会给你喂食。于是，七个月来，他每天都来我这里两次，我喂养着他。
    - type: paragraph
      text:
        ru: Спустя немного времени я снова пришел к нему, чтобы купить сосуды для вина.
        cn: 过了一会儿，我又来到他那里，为了买酒器。
    - type: paragraph
      text:
        ru: – Ну, что, старче, как твой лев?
        cn: ——那么，长老，你的狮子怎么样了？
    - type: paragraph
      text:
        ru: – Плохо! – отвечал он.
        cn: ——糟糕！——他回答道。
    - type: paragraph
      text:
        ru: – Что ж такое случилось?
        cn: ——那到底发生了什么事？
    - type: paragraph
      text:
        ru: – Вчера приходит ко мне за пищей, и я вижу подбородок его в крови. Что это значит? – спрашиваю. Ты ослушался меня и ел мясо? Благословен Господь! Не стану больше кормить тебя пищей отцов, кровожадный! Ступай прочь! Но он не хотел уходить. Тогда, взяв веревку и свив ее втрое, три раза ударил его и прогнал.
        cn: '「昨天他来我这里取食物，我看到他的下巴带着血。」

          「这是什么意思？」我问道，「你违背了我的话，并且吃了肉吗？」

          「愿主受颂扬！我将不再给你教父的食物，你这嗜肉的！滚开！」

          但他不肯走。于是，他拿了一条绳子，将其拧成三股，打了那人三下，并将他赶走了。'
  - type: heading2
    initial:
      ru: '164.'
      cn: '164.'
    text:
      ru: Ответ аввы Виктора малодушному иноку.
      cn: 阿爸维克托对灰心修士的答复。
    children:
    - type: paragraph
      text:
        ru: 'Однажды в Елусскую лавру зашел брат к авве Виктору затворнику и сказал ему:'
        cn: 有一天，一位修士来到耶路萨大修道院，去见隐修者阿巴·维克托，并对他说：
    - type: paragraph
      text:
        ru: '– Что мне делать, отче: одолевает меня нерадение...'
        cn: – 神父，我该怎么做：懈怠胜过我了...
    - type: paragraph
      text:
        ru: '– То – болезнь души, – отвечал старец. Подобно тому, как больные глазами, при усиливающейся болезни, не могут смотреть на свет, находя его слишком ярким для себя, между тем как здоровым он вовсе не кажется ярким, так и нерадивые: от незначительного нерадения они уже приходят в беспокойство, между тем как бодрые духом скорее радуются при испытаниях.'
        cn: ——那是一种灵魂的疾病，——长老回答道。正如眼睛患病的人，随着病情的加重，无法直视光线，觉得光线对他们来说太过刺眼，然而对健康的人来说，光线却丝毫也不刺眼；不殷勤的人也是如此：由于轻微的不殷勤，他们就已经感到不安，然而精神振奋的人在考验中反而欢喜。
  - type: heading2
    initial:
      ru: '165.'
      cn: '165.'
    text:
      ru: О разбойнике Кириаке.
      cn: 论强盗基里亚科斯。
    children:
    - type: paragraph
      text:
        ru: 'Один христолюбец рассказывал нам о разбойнике, по имени Кириаке. Кириак разбойничал в окрестностях Эммауса, что теперь Никополь. Он отличался такой жестокостью и бесчеловечием, что его прозвали волком. В его шайке были не только христиане, но и иудеи и самаряне. Однажды некоторые из окрестностей Ликополя отправились в Великую Субботу во св. град для крещения детей своих. После крещения они возвращались в свое место, чтобы дома отпраздновать день Светлого Христова Воскресения. Навстречу им попались разбойники, но без атамана. Мужчины спаслись бегством. Разбойники – евреи и самаряне, побросав новокрещенных детей, захватили женщин и совершили над ними насилие. Бежавших мужей встретил атаман и, остановив, спросил: «Что вы бежите?» Те рассказали ему обо всем. Вернув их, он отправился к своей шайке и нашел детей, брошенных на земле. Узнав, кто совершил гнусное злодеяние, он отрубил негодяям головы и велел мужьям взять детей, чтобы женщины не смели касаться их, так как были осквернены. Атаман охранял их на пути до самого их местожительства. Спустя немного времени Кириак был схвачен и просидел в тюрьме десять лет, и ни один из начальников не казнил его. Впоследствии он и совсем было освобожден. «Ради спасенных детей я избежал злой смерти, – говорил он. – Они явились мне во сне и говорили: не бойся! Мы молим за тебя!» Я и авва Иоанн, пресвитер монастыря евнухов, разговаривали с ним, и он нам рассказал то же самое, и мы воздали славу Богу.'
        cn: 一位爱基督者向我们讲述了一个名叫基里亚克的强盗的故事。基里亚克曾在以马忤斯（今尼科波利斯）附近为非作歹。他以如此残忍和不人道的行为而著称，以至于人们称他为「狼」。他的匪帮里不仅有基督徒，还有犹太人和撒玛利亚人。有一天，一些来自吕科波利斯附近的人们在圣周六前往圣城，为他们的孩子施洗。施洗之后，他们正返回住处，以便在家中庆祝基督荣光复活日。强盗们迎面而来，但匪首不在。男人们逃跑得以脱身。那些强盗——犹太人和撒玛利亚人——丢弃了那些刚受洗的孩子们，掳走了妇女并对她们施暴。匪首遇到了那些逃走的丈夫们，停住他们，问道：「你们为何奔逃？」他们把一切都告诉了他。让他们返回之后，他便去寻他的匪帮，找到了被丢弃在地上的孩子们。得知是谁犯下了这可憎的恶行后，他砍下了那些恶棍的头颅，并吩咐丈夫们带走孩子，不让妇女们触碰他们，因为她们已被玷污。匪首护送他们一路直到他们的住处。不久之后，基里亚克被捕并在监狱里待了十年，没有一位长官处死他。后来他甚至完全获得了自由。他说：「我之所以能免于恶死，是因那些被救的孩子们。他们显现在我梦中，说：不要害怕！我们为你祷告！」我与太监修道院的长老阿爸约安与他交谈，他向我们讲述了同样的事，我们便将荣耀归于上帝。
  - type: heading2
    initial:
      ru: '166.'
      cn: '166.'
    text:
      ru: Жизнь разбойника, ставшего иноком и потом добровольно отдавшего себя на казнь.
      cn: 一个强盗的生平，他后来成为修士，并自愿将自己交付处决。
    children:
    - type: paragraph
      text:
        ru: 'Авва Савватий говорил нам: когда я жил в лавре аввы Фирмина, пришел разбойник к авве Зосиме киликиянину и стал просить старца: «Окажи мне милость, ради Бога! Я совершил много убийств... Сделай меня иноком, чтобы я мог отстать от злых дел». Старец, наставив его, сделал иноком и облек в ангельский чин. Спустя немного времени, старец сказал ему: «Поверь мне, чадо, тебе нельзя оставаться здесь. Если начальник узнает о тебе, возьмет тебя; точно также и враги твои постараются умертвить тебя. Послушайся меня, и я отведу тебя в другую киновию, подальше отсюда». И отвел его в киновиюаввы Дорофея, что близ Газы и Маиума. Девять лет прожил он там, изучил псалтирь и весь монашеский устав. Но вот он снова идет в монастырь аввы Фирмина к принявшему его старцу и говорит ему:'
        cn: 阿巴萨瓦蒂对我们说：当我住在阿巴菲尔明的大修道院时，一个强盗来到来自基利家的阿巴佐西马斯那里，他开始请求这位长者：「为了上帝的缘故，求你怜悯我！我犯下了许多杀人罪……请把我变为修士，好让我能离弃邪恶之事。」这位长者教导了他，让他成为修士，并为他披上天使的品级。过了不久，这位长者对他说：「孩子，相信我，你不能留在这里。如果地方官知道了你的事，会把你带走；同样，你的仇敌也会设法把你杀死。听我的话，我会把你带到另一处集体修道院，离这里远一点的地方。」于是他把他带到阿巴多萝西奥斯的集体修道院，那处修道院靠近加沙和迈乌马。他在那里住了九年，学会了《诗篇》，并通晓了所有的修道院规章。但这时，他再次前往阿巴菲尔明的修道院，找到那位接纳他的长者，对他说：
    - type: paragraph
      text:
        ru: – Честный отче, сделай милость – возврати мне мирские одежды и возьми обратно иноческие.
        cn: ——可敬的父，请你行个恩典——把俗装还给我，并且把修道衣收回去。
    - type: paragraph
      text:
        ru: – Зачем же, чадо? – спросил опечаленный старец.
        cn: – 为何呢，孩子？ – 忧伤的长老问道。
    - type: paragraph
      text:
        ru: '– Вот уже девять лет, как тебе хорошо известно, я провел в монастыре, постился, сколько было силы у меня, воздерживался и жил в послушании, в безмолвии и страхе Божием, и я хорошо знаю, что благость Божия простила мне много злодеяний... Но вот я ежедневно вижу пред очами мальчика, говорящего мне: «Зачем ты убил меня?» Я вижу его и во сне, и в церкви, и в трапезе, слышу его голос, и нет у меня ни одного часа спокойствия... Вот почему, отче, я хочу идти, чтобы умереть за мальчика... Совсем напрасно я убил его.'
        cn: 如你所知，我已经有九年时间在修道院度过，尽我所能地禁食，节制己身，活在顺服、静默和敬畏上帝之中，我深知上帝的良善已赦免了我许多恶行……但我每日眼前都看见一个男孩，他对我说：「你为什么杀了我？」我在梦中、在教堂里、在食堂里都看到他，听到他的声音，我连一刻安宁都没有……因此，神父啊，我愿意去，为那男孩而死……我杀死他，完全是徒劳的。
    - type: paragraph
      text:
        ru: Взяв свою одежду и надев ее, он ушел из лавры и прибыл в Диосполис, где был схвачен и на другой день обезглавлен.
        cn: 他拿起自己的衣服穿上后，离开了大修道院，抵达了狄奥斯波利斯，在那里他被逮捕了，并在次日被斩首。
  - type: heading2
    initial:
      ru: '167.'
      cn: '167.'
    text:
      ru: Жизнь и кончина аввы Пимена пустынника.
      cn: 隐士皮门长老的生活和安息。
    children:
    - type: paragraph
      text:
        ru: 'Агафоник, настоятель Кастеллийской киновии св. отца нашего Саввы, рассказывал нам: однажды я пришел в Руву к отшельнику авве Пимену. Найдя его, я поведал ему свои помыслы. Настал вечер, и он пустил меня в пещеру. Тогда стояла зима, и в ту ночь было особенно холодно, так что я иззяб страшно. Утром приходит ко мне старец и говорит:'
        cn: '阿加索尼克，我们圣父萨瓦·卡斯特里共住修院的院长，告诉我们：


          有一次，我来到鲁瓦，拜访隐修士亚巴·皮门。找到他后，我向他倾诉了我的思虑。傍晚来临，他让我住进了洞穴。那时正值冬季，那一夜特别寒冷，以致我冻得厉害。早上，长老来到我这里，对我说：'
    - type: paragraph
      text:
        ru: – Что с тобою, чадо?
        cn: ——孩子，你怎么了？
    - type: paragraph
      text:
        ru: – Прости, отче! Я очень плохо провел ночь от холода.
        cn: – 父啊，求你宽恕！我因寒冷，夜晚过得非常糟糕。
    - type: paragraph
      text:
        ru: – Правда?! Но я, чадо, не озяб. Я удивился этому, потому что он был наг.
        cn: ——真的吗？！但我，孩子，没有着凉。我对此感到惊讶，因为他当时是赤身裸体的。
    - type: paragraph
      text:
        ru: – Сделай милость, скажи мне, почему ты не озяб? – спросил я.
        cn: ——请你发发慈悲，告诉我，你为什么没有感到寒冷？——我问道。
    - type: paragraph
      text:
        ru: – Пришел лев, лег подле меня и согревал собою. Впрочем, я скажу тебе, брат, что я буду съеден зверями.
        cn: – 一头狮子走了过来，躺在我身边，用它的身体温暖着我。不过，兄弟，我告诉你，我将被野兽吞食。
    - type: paragraph
      text:
        ru: – За что?!
        cn: – 为何？！
    - type: paragraph
      text:
        ru: – Когда я еще находился на нашей родине (они оба были из Галатии), пас овец. Однажды проходил странник. Мои собаки бросились на него и на моих глазах растерзали. Я мог бы его спасти, но не сделал этого. Я оставил его без помощи, и мои собаки съели его. Знаю, что и мне предстоит такая же участь... И действительно чрез три года старец, по его слову, был съеден зверями.
        cn: ——当我仍在我们的故乡时（他们二人都来自加拉太），我曾牧羊。有一天，一位行路人经过。我的狗向他扑去，就在我眼前将他撕碎了。我本可以救他，但我没有这样做。我任由他得不到帮助，我的狗将他吃掉了。我知道，我也将面临同样的结局……果然，三年之后，那位长者正如他所说的，被野兽吃掉了。
  - type: heading2
    initial:
      ru: '168.'
      cn: '168.'
    text:
      ru: Наставления старца аввы Александра.
      cn: 长老阿爸亚历山大的教诲。
    children:
    - type: paragraph
      text:
        ru: 'Авва Александр, старец аввы Викентия, наставлял братию: «Отцы наши искали пустыни и скорбей, а мы стремимся в города и ищем покоя.'
        cn: 阿爸·亚历山大，阿爸·维肯提的长老，指导弟兄们说：「我们的教父们寻求旷野和苦难，而我们却奔向城市，寻求安逸。」
    - type: paragraph
      text:
        ru: 'У отцов наших процветали добродетели: нестяжательность и смирение, а теперь царствуют любостяжание и гордость.'
        cn: 在我们的教父们那里，美德——不慕私财和谦卑——曾兴盛；而如今，贪求财物和骄傲却盛行。
    - type: paragraph
      text:
        ru: Отцы наши никогда не умывали лица своего, а для нас открыты общественные бани.
        cn: 我们的教父们从不洗脸，而对我们来说，公共浴池却是开放的。
    - type: paragraph
      text:
        ru: Увы, чада, утратили мы ангельский образ жизни!»
        cn: 唉，孩子们，我们失去了天使的生活样式！
    - type: paragraph
      text:
        ru: 'Ученик старца авва Викентий сказал:'
        cn: 长老阿瓦·维肯提的弟子说：
    - type: paragraph
      text:
        ru: – Конечно, это потому, что мы немощны, отче.
        cn: — 当然，这是因为我们软弱，神父。
    - type: paragraph
      text:
        ru: – Что такое говоришь ты, Викентий? – возразил старец. –  Мы-то немощны!? Да мы, чадо, так сильны телом, что могли бы помериться с олимпийскими борцами, но душа у нас слаба...».
        cn: —— 你这是说什么呢，维肯提？——长老反驳道。—— 我们竟是软弱的吗！？但我们，孩子，身体如此强壮，以至于能与奥林匹克摔跤手一较高下，但我们的灵魂却软弱……
    - type: paragraph
      text:
        ru: 'И снова поучал старец: «Мы можем много есть, и пить, и любим хорошо одеваться, но не можем быть воздержными и смиренномудрыми.'
        cn: 长老又教导说：「我们能多吃、多喝，且喜爱穿着华丽，却不能做到节制和谦卑。」
    - type: paragraph
      text:
        ru: Горе тебе, Александр! Горе тебе! Какой позор будет для тебя, когда другие будут удостоены венцов!»
        cn: 祸哉你，亚历山大！祸哉你！当他人被配得冠冕时，对你而言将是何等羞辱！」
  - type: heading2
    initial:
      ru: '169.'
      cn: '169.'
    text:
      ru: Жизнь слепого старца в обители аввы Сисоя.
      cn: 阿巴·西索伊修道院中盲人长老的生活。
    children:
    - type: paragraph
      text:
        ru: 'В скиту, в лавре аввы Сисоя жил один слепой старец. Келлия находилась около полумили расстояния от колодца, и он не дозволял, чтобы кто-нибудь другой приносил ему воду. Он сплел себе веревку, один конец привязал у колодца, а другой у своей келлии, веревка же лежала на земле. Отправляясь за водой, он шел по веревке. Старец делал это для того, чтобы по веревке отыскать колодец. Если поднимавшийся от ветра песок засыпал веревку, старец брал ее рукою, стряхивал песок и снова клал на землю. Однажды брат просил старца, чтобы позволил ему приносить воду. Старец отвечал: «Как, брат? Я уже двадцать два года ношу себе, таким образом, воду, и ты хочешь отнять у меня мой труд?»'
        cn: 在亚巴·西索耶的隐修院和大修道院里，住着一位盲眼长老。他的隐修室距离水井大约半英里，但他不允许任何人给他打水。他给自己编了一条绳子，一端系在水井旁，另一端系在他的隐修室旁，绳子则放在地上。去打水时，他就沿着绳子走。长老这样做是为了沿着绳子找到水井。如果风吹起的沙子盖住了绳子，长老就用手拿起它，抖掉沙子，然后再放回地上。有一天，一位修士请求长老允许他去打水。长老回答说：「怎么，修士？我已经这样给自己打水二十二年了，难道你想要夺走我的劳动吗？」
  - type: heading2
    initial:
      ru: '170.'
      cn: '170.'
    text:
      ru: О св. подвижнице, скончавшейся в пустыне.
      cn: 关于在旷野中安息的圣女隐修者。
    children:
    - type: paragraph
      text:
        ru: 'От Иерусалима на расстоянии двадцати тысяч шагов есть обитель, называемая обителью Сампсона. Из этой обители двое из отцов отправились на гору Синай для молитвы. Возвратившись в монастырь, они рассказали нам: поклонившись на св. горе, мы уже возвращались обратно и заблудились в пустыне. Много дней носились мы по пескам пустыни, как по морю. Однажды мы издали заметили небольшую пещеру и направились к ней. Приблизившись к пещере, мы увидели около нее небольшой источник и близ него небольшую растительность и следы человека. «Поистине здесь живет раб Божий!» – сказали мы друг другу. Входим в пещеру, но не видим в ней никого... Только слышится чей-то стон... Тщательно осмотрев пещеру, мы нашли что-то в роде яслей, и кто-то лежал там... Подойдя к рабу Божию, мы просили его побеседовать с нами. Ответа нам не было... Мы дотронулись до него... Тело еще не остыло, но душа уже отошла к Господу... Мы поняли, что он скончался в тот момент, как мы взошли в пещеру. Взявши тело с того места, где оно лежало, мы вырыли могилу в той же пещере. Один из нас снял свой плащ, и мы стали завертывать тело старца для погребения. Тут только мы увидели, что то была женщина... И мы воздали хвалу Богу. И, воспев погребальные песни, мы похоронили ее...'
        cn: 从耶路撒冷两万步之遥，有一座修道院，名为撒普松修道院。从这座修道院，两位教父前往西奈山祈祷。回到修道院后，他们告诉我们：在圣山上敬拜后，我们正要返回，却在旷野中迷了路。许多天，我们如同在海上一般，在旷野的沙海中漂泊。有一天，我们从远处发现了一个小山洞，便朝它走去。靠近山洞时，我们看到山洞附近有一个小泉水，泉水旁有一些小植物，还有人类的足迹。「这里真住着一位上帝的仆人！」我们彼此说。我们走进山洞，却没看到任何人……只听见一声呻吟……仔细察看山洞后，我们发现了一样类似马槽的东西，有人躺在那里……走到那位上帝的仆人身旁，我们请求他与我们交谈。他没有回应我们……我们触摸了他……身体尚未冰冷，但灵魂已经归主了……我们明白，他已离世，就在我们走进山洞的那一刻。我们将被抬起身体，从它躺着的地方抬起，在那个山洞里挖了一个墓穴。我们中有一人脱下自己的斗篷，我们开始用它包裹这位老者的身体，以便安葬。就在那时我们才看到，原来那是一位女子……我们便赞美了上帝。唱完葬礼的诗歌，我们安葬了她……
  - type: heading2
    initial:
      ru: '171.'
      cn: '171.'
    text:
      ru: Жизнь двух превосходных мужей – Феодора философа и Зоила чтеца.
      cn: 两位卓越男子的生平——哲学家提奥多尔和读经士佐伊罗斯。
    children:
    - type: paragraph
      text:
        ru: 'В Александрии жили два дивных и добродетельных мужа: философ авва Феодор и чтец Зоил. С тем и другим мы имели близкое знакомство – с одним ради науки, с другим вследствие того, что мы были одной родины и одинаковых привычек. Авва Феодор философ ничего не имел, кроме плаща и нескольких книг, спал на скамье и, когда только можно было, ходил вцерковь. Потом он постригся в киновии Салама и там скончался. Чтец Зоил отличался таким же бескорыстием, и он также никогда ничего не имел, кроме плаща, притом весьма ветхого, и нескольких книг. Его занятие состояло в списывании книг. И Зоил скончался о Господе и был погребен в Лифазомене, в монастыре аввы Палладия. Некоторые из отцов, придя к господину Косме, схоластику, спрашивали его об авве Феодоре философе и чтеце Зоиле: «Кто из них проявил больше мужества и терпения в подвижничестве?» Тот отвечал: «Одинаковы были у того и другого и пища, и ложе, и одежда, и воздержание от всего лишнего. И тот и другой отличались одинаковым смирением, нестяжательностью и умеренностью. Авва философ, босой, весьма слабый глазами, изучил ветхий и новый завет. Но он имел утешение в общении с братией, в посещении друзей и находил большое развлечение, когда занимался сам и изъяснял другим. Относительно чтеца Зоила следует сказать, что не только его жизнь на чужой стороне достойна похвалы, но и его уединение, труд без конца и молчаливость... У него не было ни друзей, ни близких и ему не с кем было разговаривать... Чуждый всему мирскому, он ни в чем не видел утехи... Никогда он не желал пользоваться чужими услугами: сам готовил себе пищу, сам стирал... Даже не искал отдыха в чтении, но сам всегда готов был служить другим. Он не обращал внимания ни на холод, ни на зной, ни на болезни. Не знал ни смеха, ни печали, ни скуки, ни рассеяния... Кроме грубости одежды, он терпел от множества паразитов... Никогда не падал духом. Впрочем, и он, сравнительно с первым, имел немалую отраду в прогулках – свободно и без опасений днем и ночью ходил он всюду, хотя эту свободу уменьшала громадность его труда, делавшая его как-бы изъятым из круга житейских отношений. Каждый получит свою награду соответственно своим подвигам и по мере своего усовершенствования, чистоты ума и сердца, страха Божия и любви, по мере своего служения на пользу общую, беспрерывного славословия и молитвы, глубочайшей веры и сокрытого от людей, но явного для Бога – богоугодного совершенства».'
        cn: '在亚历山大城住着两位奇妙而有美德的男子：哲学家阿爸菲奥多尔和读经员佐伊尔。我们与他二人都有密切的相识——与前者是为学问，与后者则因我们同乡且习惯相似。哲学家阿爸菲奥多尔除了斗篷和几本书外，一无所有，他睡在长凳上，只要有可能就去教堂。后来他在萨拉马隐修院受了修士圣职，并在那里安息。读经员佐伊尔以同样的无私而著称，他也从未拥有任何东西，除了一个非常破旧的斗篷和几本书。他的营生是抄写书籍。佐伊尔在主里安息，并安葬在利法佐门，阿爸帕拉季的修道院里。


          一些教父来到学者科斯马先生那里，询问他关于哲学家阿爸菲奥多尔和读经员佐伊尔：「他们当中谁在苦修中展现了更大的勇气和忍耐？」他答道：「两者都是一样的，无论是食物、卧具、衣着，还是禁绝一切多余之物。两者都展现出同样的谦卑、不贪求财物和节制。阿爸哲学家赤脚，视力非常弱，却研习了旧约和新约。但他与修士弟兄的交流、探访朋友时都得到了慰藉，在自己研习并向他人阐释时，获得了极大的乐趣。


          至于读经员佐伊尔，可以说，不仅他在异乡的生活值得称赞，还有他的独居、无尽的劳作和沉默寡言……他没有朋友，也没有亲近之人，无人可交谈……他与一切世俗格格不入，在任何事上都找不到慰藉……他从不愿接受别人的服务：自己做饭，自己洗衣……甚至不寻求阅读来休息，而是随时准备服务他人。他丝毫不顾寒冷、酷热或疾病。他不知欢笑，也没有悲伤，没有厌倦，也没有分心……除了粗糙的衣物之外，他还要忍受许多寄生虫的困扰……他从未气馁。然而，与前者相比，他也在散步中获得了不少慰藉——他昼夜自由无惧地四处行走，尽管他繁重的劳动减少了这份自由，使他仿佛隔绝于尘世俗务之外。


          每个人都将依照自己的苦修，以及其精进的程度、心智和心灵的纯洁、敬畏上帝和爱心、其对公共利益的贡献、不间断的赞美和祷告、最深厚的信仰，以及那隐藏于人前，却彰显于上帝面前的——蒙神喜悦的完全，而获得自己的奖赏。」'
  - type: heading2
    initial:
      ru: '172.'
      cn: '172.'
    text:
      ru: Жизнь схоластика Космы.
      cn: 学士科斯马生平。
    children:
    - type: paragraph
      text:
        ru: 'О господине Косме схоластике очень многие рассказывали нам весьма много – одни одно, другие другое. Мы запишем для пользы читателей только то, чему сами были очевидцами или что тщательно расследовали и проверили. Этот муж отличался смиренномудрием, сострадательностью, воздержанием, целомудрием, молчаливостью, кротостью, обходительностью, страннолюбием и любовию к бедным. Этот удивительный муж принес нам большую пользу не потому только, что мы видели его и учились у него, но и потому, что у него было большое собрание книг, – больше, чем у кого-либо в Александрии, и он охотно предоставлял пользоваться ими каждому желающему. Впрочем, он был очень беден: во всем его доме нельзя было увидать ничего другого, кроме книг, кровати и стола. Всякий человек мог свободно прийти к нему, спросить о чем-нибудь для пользы душевной и читать. Я ежедневно приходил к нему и – скажу сущую правду – всегда заставал его или читающим или пишущим против иудеев, так как у него была большая ревность к обращению их на путь истины. Поэтому он и меня часто посылал к некоторым евреям – рассуждать с ними от Писания, потому что сам он редко выходил из дому. В одно из своих посещений – пользуясь его откровенностью со мной, я спросил его: «Сделай милость, скажи мне, сколько лет ты живешь в уединении?» Он молчал. Не дождавшись ответа, снова спрашиваю: «Ради Господа, скажи мне». Помолчав немного, он ответил: «Тридцать три года». Услышав это, я прославил Бога. В другой раз, придя к нему, я спросил: «Сделай великую милость, – зная, что я спрашиваю для пользы душевной, – скажи мне: после стольких лет уединения и воздержания чего достиг ты?» Сильно и из глубины души вздохнув, он ответил: «Чего же может достигнуть человек – мирянин, тем более сидя в своем доме?» Но я снова стал просить его: «Ради Господа, скажи мне – ведь это принесет мне пользу». Побежденный моими мольбами, он ответил: «Прости мне, – полагаю, что я успел в трех отношениях – научился не смеяться, не клясться, не говорить неправды».'
        cn: 关于尊者科斯马斯·斯霍拉斯提克，许多人向我们讲述了许多事情——有人说这，有人说那。我们为读者的益处，只记下我们亲眼所见，或经过仔细调查和核实的事情。这个人以其谦卑、怜悯、节制、贞洁、沉默寡言、温顺、平易近人、爱接待客旅和爱贫穷人的心而著称。这位奇妙的男士给我们带来了巨大的益处，不仅因为我们见过他并向他学习，而且因为他收藏了大量的书籍——比亚历山大里亚的任何人都多，并且他乐意让每个愿意的人使用这些书。然而，他非常贫穷：在他整个家中，除了书籍、一张床和一张桌子，看不到任何其他东西。任何人都可以自由地来找他，询问一些有益于灵魂的事情并阅读。我每天都去他那里——我将实话实说——总是发现他不是在阅读，就是在撰写驳斥犹太人的文章，因为他有极大的热忱，致力于引导他们归向真理之道。因此，他也经常派我去见一些犹太人——依据《圣经》与他们辩论，因为他自己很少出门。在我的一次拜访中——趁着他对我的坦诚，我问他：「请你告诉我，你独居多少年了？」他沉默不语。没有等到回答，我再次问他：「为了主，请你告诉我。」稍作沉默后，他回答说：「三十三年。」听到这话，我颂赞了上帝。另一次，我来到他那里，问他：「请你务必——因为你知道我问这些是为了灵魂的益处——告诉我：经过这么多年的独居和节制，你达到了什么？」他深深地、从心底里叹了口气，回答说：「一个人——一个平信徒，何况还坐在自己家中——又能达到什么呢？」但我再次恳求他：「为了主，请你告诉我——因为这会给我带来益处。」他被我的恳求打动了，回答说：「请原谅我——我认为我在三件事上有所成就——学会了不嘲笑，不发誓，不说谎话。」
  - type: heading2
    initial:
      ru: '173.'
      cn: '173.'
    text:
      ru: Чудо Феодора отшельника, силою молитвы усладившего воду морскую.
      cn: 隐士提奥多尔的奇迹：他藉着祈祷的力量使海水变甘甜。
    children:
    - type: paragraph
      text:
        ru: 'В местности близ св. Иордана жил отшельник, по имени Феодор, скопец. Ему необходимо было отправиться в Константинополь, и он сел на корабль. Плавание по морю замедлилось, и пресной воды не хватило. Матросы и пассажиры пришли в большое уныние и отчаяние. Тогда отшельник встал, простер руки к небу, – к Богу, избавляющему от смерти души наши. Сотворив молитву и осенив море крестным знамением, он сказал матросам: «Благословен Господь! Почерпните воды сколько нужно!» Они наполнили все сосуды приятной водой из моря, и все прославили Бога.'
        cn: 在靠近圣约旦河的地区，住着一位名叫提奥多尔的隐修士，他是一名宦官。他需要前往君士坦丁堡，于是登上了船。海上航行耽搁了，淡水不够了。水手们和乘客们都陷入极大的沮丧和绝望之中。那时，隐修士站了起来，向天伸展双手——向那从死亡中拯救我们灵魂的上帝。祈祷完毕，并向海划了十字圣号后，他对水手们说：「愿主受赞美！汲取足够的水吧！」他们把所有的容器都装满了从海里汲取的甘甜的水，所有人都颂赞了上帝。
  - type: heading2
    initial:
      ru: '174.'
      cn: '174.'
    text:
      ru: Чудо низведения дождя, по молитве благочестивого кормчего.
      cn: 雨水降下的奇迹，借着虔诚舵手的祷告。
    children:
    - type: paragraph
      text:
        ru: 'Отшельник авва Григорий рассказывал нам: уезжая из Византии, я сел на корабль. Вместе со мною на том же корабле один писец с женой отплыл на богомолье во св. Град. Хозяин корабля был человек богобоязненный и постник. Во время плавания слуги писца не жалея тратили воду. Среди моря воды не хватило, и настала для всех нас большая беда: жалкое это было зрелище! Женщины, дети, младенцы изнемогали от жажды и лежали, как мертвые. Среди такого бедствия мы пробыли три дня. Надежда на спасение исчезла... Тогда писец, не вынеся горя, извлек меч и порывался умертвить хозяина корабля и матросов. «Это они – виновники нашей гибели, так как не запаслись в достаточном количестве водою», – говорил он. Я начал его уговаривать: «Не делай этого. Будем лучше молиться Господу нашему Иисусу Христу, истинному Богу нашему, творящему великое и дивное, им же несть числа. Ты посмотри – и сам хозяин корабля уже третий день постится и молится». Писец пришел в себя и успокоился. На четвертый день, около шести часов, хозяин вдруг встал и закричал громким голосом: «Слава тебе, Христе Боже наш!» – так ,что мы вздрогнули от его крика. «Растяните кожи!» – сказал он. Лишь только положили кожи, внезапно облако явилось над кораблем, и пошел проливной дождь, пока не удовлетворена потребность в воде. При этом вот что особенно поразительно в чуде: корабль несся по ветру, и облако шло за ним, и дождь падал только на корабль.'
        cn: '隐修士阿爸格里戈里告诉我们：我离开拜占庭时，登上了船。与我一同在同一艘船上，有一位抄写员和他的妻子启航前往圣城朝圣。船主是一个敬畏上帝的且是一个禁食者。航行期间，抄写员的仆人们毫不节制地用水。在海上，水不够了，我们所有人都陷入了巨大的困境：那真是悲惨的景象啊！妇女、孩童、婴儿们因口渴而衰弱无力，躺着如同死人一般。在这样的苦难中，我们度过了三天。得救的希望消失了……


          那时抄写员无法忍受痛苦，拔出了剑，企图杀害船主和水手们。他说道：「他们是导致我们灭亡的罪魁祸首，因为他们没有储备足够的水。」我开始劝说他：「不要这样做。我们最好还是祈祷我们的主耶稣基督，我们真正的上帝，他施行着无数伟大而奇妙之事。你看，连船主本人也已经禁食祷告三天了。」抄写员恢复了理智，并平静了下来。


          第四天，大约六点钟，船主突然站了起来，大声喊道：「荣耀归于你，我们的基督上帝啊！」以至于我们被他的喊声吓得一震。他说道：「把皮囊伸展开来！」刚把皮囊放好，一片云突然出现在船上方，大雨倾盆而下，直到对水的需求得到满足为止。而这奇迹中尤其令人惊叹的是：船正顺风航行，而那云彩也跟着它移动，雨水只落在船上。'
  - type: heading2
    initial:
      ru: '175.'
      cn: '175.'
    text:
      ru: Об императоре Зеноне – и его сострадательности.
      cn: 关于芝诺皇帝——和他的怜悯心。
    children:
    - type: paragraph
      text:
        ru: 'Один из отцов рассказал нам об императоре Зеноне. Однажды он оскорбил одну женщину в лице ее дочери. Женщина часто молилась в храме Пресвятой Владычицы нашей Богородицы Марии, взывая к Ней со слезами: «Накажи императора Зенона». Долгое время она поступала таким образом – и вот Пресвятая Богоматерь, явившись ей, говорит: «Поверь мне, женщина, Я давно бы наказала его, но его десница удерживает Меня». А он был очень сострадателен.'
        cn: 一位教父向我们讲述了芝诺皇帝的故事。有一次，他因其女儿的缘故侮辱了一位妇女。这位妇女经常在我们至圣女主人、我们的诞神女马利亚的圣殿里祈祷，含泪向她呼求说：「惩罚芝诺皇帝吧。」她这样做了很长时间——看哪，至圣诞神女向她显现，对她说：「妇人，你相信我，我早就想惩罚他了，但是他的右手（德行）拦阻了我。」因为他非常富有怜悯之心。
  - type: heading2
    initial:
      ru: '176.'
      cn: '176.'
    text:
      ru: Рассказ аввы Палладия о крещении юноши еврея.
      cn: 阿爸帕拉迪乌斯记述一位犹太青年的洗礼。
    children:
    - type: paragraph
      text:
        ru: 'Вот что рассказал нам авва Палладий, а он сам слышал от одного из отцов, по имени Андрей, с которым и нам пришлось беседовать. Когда я был молод, – рассказывал Андрей, – я вел себя беспорядочно. Началась брань и беспорядки – и вот я, вместе с девятью другими, бежали в Палестину. Впрочем один из них был человек трудолюбивый, а другой – еврей. В пустыне – еврей ослаб до полного изнеможения, и все мы пали духом, не зная, как нам с ним быть. Однако мы не бросили его, но каждый по мере сил своих нес его на себе. Хотели мы донести его до города или до пристани, чтобы не дать ему умереть в пустыне. Но юноша от голода и палящей жажды, от сильнейшей лихорадки и страшного утомления близок был к смерти... У него не было сил и на то, чтобы несли его другие... Тогда, пролив над ним слезы, мы решились оставить его в пустыне... Страх напал на нас, как бы и самим не умереть от жажды. Мы со слезами положили его на песке...  Увидав, что мы собираемся уйти от него, он начал заклинать нас:'
        cn: '这是长老帕拉迪奥斯告诉我们的，而他自己是从一位教父那里听来的，名叫安德烈，我们也曾与他交谈过。


          「当我年轻的时候，」安德烈讲述道，「我行为放荡不羁。战乱和动荡开始了——于是我，同另外九个人一起，逃往巴勒斯坦。不过他们中有一个人是勤劳的，另一个人是犹太人。


          在旷野里——那个犹太人衰弱得筋疲力尽，我们都意志消沉，不知该如何是好。然而我们没有抛弃他，而是每个人尽其所能地背着他。我们想要把他带到城镇或港口，以免他死在旷野里。但是这个年轻人因饥饿和炙热的干渴，因剧烈的发烧和极度的疲惫，已濒临死亡……他甚至没有力气让别人背着他了……那时，我们为他洒下眼泪，决定把他留在旷野里……恐惧袭上我们心头，唯恐我们自己也会渴死。我们含着眼泪把他放在沙地上……看到我们准备离开他，他开始恳求我们说：'
    - type: paragraph
      text:
        ru: – Во имя Бога, грядущего судить живых и мертвых, не дайте мне умереть иудеем... Я желаю быть христианином... Сделайте милость, окрестите меня, чтобы мне христианином окончить мою жизнь и отойти ко Господу...
        cn: ——奉神之名，祂将要审判活人死人，求您不要让我作为犹太人死去……我渴望成为一名基督徒……请施恩，为我施洗，好让我能以基督徒的身份结束我的生命，并归于主……
    - type: paragraph
      text:
        ru: '– Брат, – сказали мы ему, – увы, нам этого сделать нельзя: мы – миряне, а это дело – епископов и священников. Да и воды здесь негде взять...'
        cn: – 弟兄，– 我们对他说，– 唉，我们不能这样做：我们是平信徒，而这是主教和司铎的事。再者，这里也无处取水……
    - type: paragraph
      text:
        ru: 'Но он неотступно со слезами заклинал нас:'
        cn: 但他泪流不止地恳求我们：
    - type: paragraph
      text:
        ru: – Христиане, не лишите меня этого дара...  Мы были в величайшем затруднении.
        cn: — 基督徒啊，不要剥夺我这份礼物……我们身处极大的困境之中。
    - type: paragraph
      text:
        ru: 'Тогда упомянутый выше трудолюбивый человек, как бы вдохновленный свыше, говорит нам:'
        cn: 于是，上述殷勤之人，仿佛是受从上方来的启示，对我们说：
    - type: paragraph
      text:
        ru: – Поднимите его и разденьте!
        cn: – 抬起他，剥去他的衣服！
    - type: paragraph
      text:
        ru: 'С большим трудом поставив его на ноги, мы сняли с него одежду. Трудолюбец, наполнив свои руки песком, три раза посыпал еврею на голову, говоря: «Крещается раб Божий Феодор во имя Отца, и Сына, и Св. Духа». А мы на каждое призывание святой, единосущной и поклоняемой Троицы возглашали: «Аминь!» И – клянусь Господом, братие, – Христос, Сын Бога Живого, исцелил и так укрепил немощного, что в нем не осталось ни малейшего признака слабости. Напротив, – он в добром здоровье, с воспрянувшими силами, бодро пошел впереди нас по пустыне. Придя в Аскалон, мы рассказали все, что произошло с братом на пути, епископу города блаженному Дионисию. Святой муж, выслушав рассказ, был поражен необыкновенным знамением. Однако, собрав весь свой клир, предложил дело ему на обсуждение: следует ли считать действительным крещение, совершенное чрез посыпание песком, или нет? Одни отвечали утвердительно, указывая на поразительное знамение, другие утверждали противоположное.'
        cn: 我们费了很大力气才让他站起来，随后脱去了他的衣服。那位勤勉者把沙子装满自己的双手，三次撒在那个犹太人头上，说道：「上帝的仆人费奥多尔奉父、子、圣灵之名受洗。」而我们对每一个称颂圣洁、同体、受敬拜之三位一体的呼求，都齐声呼喊：「阿们！」我向上帝起誓，弟兄们，基督，永生上帝的儿子，医治了那软弱的人，并使其如此坚强，以至于他身上丝毫没有留下软弱的迹象。相反地，他身体康健，力量恢复，精神抖擞地走在我们前面，穿过沙漠。我们来到阿斯卡隆后，把在路上发生在弟兄身上的一切都告诉了城里的主教，蒙福的迪奥尼修斯。那位圣人听了这番讲述后，对这个非凡的神迹感到惊异。然而，他召集了所有他的圣职人员，并将这件事提出来让他们讨论：这种通过撒沙子完成的洗礼是否应被视为有效？有些人给予了肯定回答，指出那个惊人的神迹，另一些人则持相反意见。
    - type: paragraph
      text:
        ru: '–Григорий Богослов, – говорили, – исчисляет все образы крещения, а именно: крещение Моисеево – в воде, а раньше – в облаке и в море, затем – крещение Иоанново, которое, впрочем, уже не было иудейским, потому что состояло не в одном погружении в воду, но сопровождалось покаянием, далее – крещение Иисуса – Духом Святым, и это совершенный образ крещения. Знаю и четвертый образ крещения – исповедничеством и кровию. Есть еще и пятый – слезами ... Какой же образ крещения был совершен над юношей, чтобы мы могли утвердить его? В особенности – вспомним слова Господа к Никодиму:«аще кто не родится водою и Духом, не может внити в Царствие Небесное»(Иоан.3, 5).'
        cn: 「格里高利·神学家，」他们说，「列举了所有的洗礼形式，即：摩西的洗礼——在水中，而更早地则是在云中和海中；然后是约翰的洗礼，然而这已不再是犹太式的了，因为它不仅仅是浸入水中，还伴随着悔改；接下来是耶稣的洗礼——借着圣灵，这是洗礼的完美形式。我也知道第四种洗礼形式——借着认信和鲜血。还有第五种——借着眼泪……那么，哪种洗礼形式被施于这个年轻人身上，以便我们能够认可他呢？尤其，让我们回想主对尼哥德慕所说的话：『人若不是从水和圣灵生的，就不能进天国。』（约翰福音 3:5）。」
    - type: paragraph
      text:
        ru: – Так что ж? – возражали другие. – Ведь, не писано об апостолах, что они крещены. Ужели они не войдут в царствие небесное?
        cn: ——那又怎样？——其他人反驳道，——经上并未记载使徒们受过洗礼。难道他们不会进入天国吗？
    - type: paragraph
      text:
        ru: '– Нет! – отвечали на это. – Апостолы крещены, как говорит об этом Климент Строматевт в пятом томе своих «Гипотипоз». Изъясняя слово апостола «Благодарю Бога, что никого из вас не крестил», он говорит: «Христос, говорят, крестил одного Петра, Петр – Андрея, Андрей – Иакова и Иоанна, а эти – остальных».'
        cn: 「不！」他们如此答道。「使徒们都受了洗，正如克莱门特·斯特罗马提欧斯在他的《提纲》第五卷中所说的。在阐释使徒的这句话——『我感谢上帝，因为我没有给你们任何人施洗』——时，他说道：『他们说，基督只给彼得施了洗，彼得又给安德烈施了洗，安德烈又给雅各和约翰施了洗，而这些人又给其余的人施了洗。』」
    - type: paragraph
      text:
        ru: Вот что и много другого было высказано. Блаженный епископ Дионисий решил – послать брата на св. Иордан и там крестить его. А того трудолюбца рукоположить во диакона.
        cn: 这些以及许多其他事情都被提及。真福的狄奥尼修斯主教决定——派这位弟兄去圣约旦河，并在那里为他施洗。而将那位勤劳者祝圣为执事。
  - type: heading2
    initial:
      ru: '177.'
      cn: '177.'
    text:
      ru: Несчастная смерть инока египетского, пожелавшего жить в келлии еретика.
      cn: 埃及修士的不幸死亡，他曾希望住在一个异端的隐修室里。
    children:
    - type: paragraph
      text:
        ru: 'Авва Иоанн киликиянин говорит нам следующее: мы жили в Александрии, в Эннате. Один египетский монах пришел и рассказал нам, что однажды из чужой страны пришел один брат в лавру Келлий, желая поселиться там. Поклонившись пресвитеру, он просил, чтобы ему позволено было жить в келлии Евагрия.'
        cn: 阿爸伊奥安·基利基亚人对我们说以下的话：我们住在亚历山大，在恩纳特。一位埃及的修士前来告诉我们，说有一次，一位弟兄从异乡来到凯利修道院的隐修群，渴望在那里定居。他向长老鞠躬致敬后，请求允许他住在厄瓦格里乌斯的僧房里。
    - type: paragraph
      text:
        ru: – Не можешь ты жить там! – сказал ему пресвитер.
        cn: ——你不能住在那里！——长老对他说。
    - type: paragraph
      text:
        ru: – А если мне не жить там, я и совсем уйду отсюда, – отвечал инок.
        cn: ——那如果我不能住在那儿，我就全然离开这里，——修士回答道。
    - type: paragraph
      text:
        ru: '– Знаешь, чадо: злой дух живет там. Он ужо совратил Евагрия и, отвратив от правой веры, внушил ему нечестивые мысли – не допускает он жить там, кому бы то ни было, – сказал пресвитер.'
        cn: 「孩子，你知道吗：邪恶的灵住在那里。它已经腐蚀了艾瓦格里乌斯，使他偏离了正信，并向他灌输了不虔敬的思想——它不允许任何人在那里居住，」长老说道。
    - type: paragraph
      text:
        ru: Но брат стоял на своем.
        cn: 但弟兄坚持己见。
    - type: paragraph
      text:
        ru: – Оставаться здесь – так не иначе, как только там!
        cn: ——留在这里——唯有在那里！
    - type: paragraph
      text:
        ru: – Что ж, – ступай, если такая твоя воля – живи там, – сказал пресвитер.
        cn: 「那么，去吧，如果这是你的意愿——就住在那里吧，」长老说。
    - type: paragraph
      text:
        ru: Уйдя, брат поселился в той келлии и прожил там неделю. Настало воскресенье – и он явился вцерковь. Увидав его, пресвитер утешился. Но в следующий воскресный день он уже не пришел вцерковь. Тогда пресвитер попросил двух братий – пойти и узнать, почему его не было в церкви. Братия пришли в келлию и нашли брата с петлей на шее повесившимся.
        cn: 离开后，那位弟兄在那间隐修室里定居下来，并在那里住了一周。到了主日，他便来到了教堂。看到他后，长老得到了安慰。但是到了下一个主日，他却再也没有来到教堂。于是长老便请了两位弟兄，前去了解他为何没有在教堂里。两位弟兄来到隐修室，发现那位弟兄脖子上套着绳索，上吊自尽了。
  - type: heading2
    initial:
      ru: '178.'
      cn: '178.'
    text:
      ru: Жизнь старца препростого.
      cn: 至为纯朴的长老生平。
    children:
    - type: paragraph
      text:
        ru: Авва Георгий, пресвитер киновии Схолариевой, поведал нам, что в келлиях жил старец – великий подвижник, он был прост в вере и без разбору причащался, где придется. Однажды явился ему ангел Божий.
        cn: 阿巴·格奥尔基，斯霍拉里耶瓦隐修院的司祭，告诉我们，隐修室里住着一位长老，他是一位伟大的苦修者，他信仰纯朴，不加分辨地随意领受圣餐。有一天，一位神的使者向他显现。
    - type: paragraph
      text:
        ru: '– Скажи мне, старец: если ты умрешь, как желаешь ты быть погребенным? Так ли, как погребают египетских иноков или – как иерусалимских?'
        cn: – 告诉我，长老：如果你去世了，你希望如何下葬？是像埋葬埃及修士那样，还是像埋葬耶路撒冷的修士那样？
    - type: paragraph
      text:
        ru: – Не знаю, – отвечал старец.
        cn: 我不知道，长老回答说。
    - type: paragraph
      text:
        ru: – Смотри, – сказал ангел, я приду к тебе чрез три недели – и ты дашь мне ответ.
        cn: – 你看， – 天使说， – 我再过三周会来找你 – 而你那时会给我一个答复。
    - type: paragraph
      text:
        ru: 'Старец отправился к другому старцу и рассказал ему то, что слышал от ангела. Старец выслушал и изумился. И долго и пристально посмотрев на него, как бы по вдохновению свыше, спросил старца:'
        cn: 长老前往另一位长老那里，并告诉他自己从天使那里听到的事。那长老听了，惊诧不已。他便良久凝视着那长老，仿佛得了上天的启示，问道：
    - type: paragraph
      text:
        ru: – Где ты причащаешься св. Таин?
        cn: – 你在哪里领受圣事？
    - type: paragraph
      text:
        ru: – Где придется...
        cn: – 在哪里都行……
    - type: paragraph
      text:
        ru: '– Смотри – не причащайся нигде вне святой кафолической и апостольской Церкви, в которой прославляются четыре святых собора: Никейский из 318 отцев, Константинопольский из 150, первый Ефесский из 200 и Халкидонский из 630. И вот – когда придет ангел, скажи ему: «Желаю быть погребенным по иерусалимскому обычаю».'
        cn: 切记——不可在神圣、至公、使徒的教会以外任何地方领受圣体，其中有四次神圣的普世大公会议受尊奉：即由三百一十八位教父组成的尼西亚会议，由一百五十位教父组成的君士坦丁堡会议，由二百位教父组成的第一次以弗所会议，以及由六百三十位教父组成的迦克墩会议。并且——当天使来临的时候，对他说：「我愿按照耶路撒冷的习俗被安葬。」
    - type: paragraph
      text:
        ru: 'По прошествии трех недель пришел ангел и спросил старца:'
        cn: 三周之后，一位天使来了，问那长老：
    - type: paragraph
      text:
        ru: – Ну, что же, старец? Надумался ли?
        cn: – 那么，长老？您想好了吗？
    - type: paragraph
      text:
        ru: – Желаю быть погребенным по-иерусалимски, – отвечал старец.
        cn: 「我希望以耶路撒冷的方式被埋葬，」长老回答说。
    - type: paragraph
      text:
        ru: – Хорошо, хорошо! – сказал ангел. И старец тотчас предал душу Богу. Все это произошло, чтобы старец не потерял своих подвигов и не был осужден с еретиками.
        cn: ——好吧，好吧！——天使说。于是那长老立刻将灵魂交托给神。这一切的发生，是为了让长老不失去他的苦修，也不至于与异端分子一同被定罪。
  - type: heading2
    initial:
      ru: '179.'
      cn: '179.'
    text:
      ru: Дивная жизнь отшельницы из св. града.
      cn: 圣城女隐士的奇妙生活。
    children:
    - type: paragraph
      text:
        ru: 'Пришли мы однажды к отшельнику авве Иоанну, по прозванию «Огненный». Вот что рассказал он нам со слов аввы Иоанна Моавитского: во св. граде была одна монахиня, отличавшаяся благочестием и великим усердием в угождении Богу. Диавол, позавидовав девственнице, внушил одному молодому человеку сатанинскую страсть к ней. Но удивительная дева, усмотрев козни диавола и сожалея о молодом человеке, взяла корзинку и, положив в нее немного моченых бобов, удалилась в пустыню. Устраняя юношу от соблазна, она заботилась о спасении души его и себе самой искала безопасности в пустыне. Прошло довольно времени. Промысел Божий устроил так, что не осталась неизвестною ее добродетельная жизнь: в пустыне св. Иордана увидал ее один отшельник.'
        cn: '我们曾有一次来到隐士阿巴·约翰那里，他被称为「火热者」。他向我们讲述了以下内容，引用自阿巴·约翰·摩押的叙述：


          在圣城里，有一位修女，以虔诚和极大的热忱事奉上帝而著称。魔鬼嫉妒这位贞女，便在一位年轻人心中激起了对她撒旦般的邪情。但这位奇妙的贞女，识破了魔鬼的诡计，并怜悯那个年轻人，就拿了一个篮子，在里面放了一些泡软的豆子，退隐到旷野。为使那青年免于诱惑，她关心着他的灵魂的得救，并为自己也在旷野寻求安稳。


          过了相当长的一段时间。上帝的旨意如此安排，使她的德行生活没有被湮没无闻：在圣约旦旷野里，一位隐士看见了她。'
    - type: paragraph
      text:
        ru: – Мать, что ты делаешь в этой пустыне? – спросил ее отшельник.
        cn: 「母亲，你在这片旷野里做什么？」隐修士问她。
    - type: paragraph
      text:
        ru: – Прости меня, – отвечала она, желая скрыть свой подвиг. – Я сбилась с пути. Сделай милость, отче, ради Господа, укажи мне дорогу.
        cn: ——请宽恕我，——她回答道，希望隐藏她的苦修。——我迷失了道路。请发慈悲，父啊，为了主，指示我道路。
    - type: paragraph
      text:
        ru: 'Но отшельник, узнав свыше об ее подвиге, сказал ей:'
        cn: 但是，这位隐修士蒙受启示，得知她的属灵功绩后，对她说道：
    - type: paragraph
      text:
        ru: '– Поверь мне, мать, ты вовсе не теряла пути, и не ищешь его. Хорошо зная, что ложь – от диавола, расскажи мне всю правду: зачем пришла ты сюда?'
        cn: – 相信我，母亲，你根本没有迷失道路，也没有在寻找它。你很清楚谎言来自魔鬼，所以请告诉我全部真相：你为何来这里？
    - type: paragraph
      text:
        ru: – Прости, отче! – отвечала дева. – Один юноша соблазнился мною, и вот почему я удалилась в эту пустыню. Я предпочла скорее умереть здесь, чем служить для кого-нибудь соблазном, по слову апостола.
        cn: 「请原谅，父亲！」童贞女答道，「有一个青年人因我而受诱惑，这就是我退隐到这片旷野的原因。我宁愿在此地死去，也不愿成为任何人的诱惑，这是遵照宗徒的话语。」
    - type: paragraph
      text:
        ru: – Сколько же времени ты прожила здесь?
        cn: — 你在这里住了多久了？
    - type: paragraph
      text:
        ru: – По благодати Христа, семнадцать лет.
        cn: — 靠着基督的恩典，十七年。
    - type: paragraph
      text:
        ru: – Но как же ты питалась?
        cn: – 但你又是如何维生的呢？
    - type: paragraph
      text:
        ru: 'Отшельница, показав корзинку с мочеными бобами, отвечала:'
        cn: 女隐修者展示了装有浸泡过的豆子的篮子，回答说：
    - type: paragraph
      text:
        ru: – Вот эта самая корзинка, которую ты видишь, вместе со мною вышла из города. В ней было немного вот этих бобов... Но Бог оказал мне, недостойной, такую милость, что вот сколько времени я питаюсь ими, и они не убавляются. И знай, отче, что Его благость так покрывала меня, что в течение этих семнадцати лет – до нынешнего дня – не видел меня ни один человек, а я видела всех. Выслушав это, отшельник прославил Бога.
        cn: '– 「这正是你看到的这个篮子，它和我一同出了城。里面只有一点点这种豆子……但上帝却对我这不配之人施予了如此恩典，以至于我用它们果腹如此之久，它们却从未减少。而且，父亲，你要知道，祂的良善如此地遮蔽着我，以至于在这十七年里——直到今天——没有一个人看见过我，而我却看见了所有人。」

          听了这话，那隐修者颂赞了上帝。'
  - type: heading2
    initial:
      ru: '180.'
      cn: '180.'
    text:
      ru: Жизнь отшельника Иоанна, обитавшего в пещере близ Соха.
      cn: 隐士约翰的生平，他住在索哈附近的一个洞穴里。
    children:
    - type: paragraph
      text:
        ru: Пресвитер и хранитель сосудов святейшей церкви Аскалонской, св. Дионисий повествовал нам об отшельнике авве Иоанне. «Поистине, –  говорил он, – это был великий пред Богом муж в наше время». Насколько он был угоден в очах Божиих, показывает следующее чудо, о котором он нам рассказал.
        cn: 最圣的阿斯卡隆教会的司祭和圣器保管员圣狄奥尼修斯，向我们讲述了隐修士阿巴·约翰的事迹。他说道：「他确实是我们时代在上帝面前的一位伟大的人。」他蒙上帝悦纳到何种程度，以下的奇迹可作证明，他曾向我们讲述过这奇迹。
    - type: paragraph
      text:
        ru: 'Старец жил в пещере в окрестностях селения Соха, на расстоянии почти двадцати миль от Иерусалима. В пещере у старца был образ Пресвятой Пречистой Владычицы нашей Богородицы и Приснодевы Марии, с Предвечным Младенцем, нашим Богом, на руках. Куда бы ни вздумал отлучиться старец, – в глубину ли пустыни, или в Иерусалим на поклонение св. кресту и св. местам, или на гору Синай для молитвы, или к мученикам, почивающим в дальних местах от Иерусалима – старец был великий почитатель мучеников, и ходил то к св. Иоанну в Ефес, то к св. Феодору в Евхаиты, то в Селевкию к св. Фекле в стране исавров, то к св. Сергию в Сафас, то к тому, то к другому святому – уходя, он ставил свечу и поджигал ее по обыкновению, потом, став на молитву и испросив у Бога, чтобы Он управил путь его, взывал, взирая на икону Владычицы: «Пресвятая Владычице Богородице, я ухожу в долгий путь, на много дней. Прими попечение о свече Твоей и сохрани ее, да не погаснет она пред Тобою до моего возвращения. Я же ухожу в надежде на помощь Твою во время путешествия». Произнеся эти слова пред иконой, он отправлялся в путь. И, совершив предположенное путешествие, продолжавшееся иногда месяц, иногда два и три, а то – так пять и шесть месяцев, он находил дома свечу горящею, как он устроил ее и оставил, отправляясь в путь, и никогда не видал ее потухшею сама собою, ни при пробуждении от сна, ни при возвращении из чужой страны или из пустыни.'
        cn: '长老住在索哈村附近的一个洞穴里，距耶路撒冷约二十英里。长老的洞穴里有一幅圣像，是我们至圣至洁的女皇、上帝之母并童贞玛利亚的圣像，手中抱着永恒的婴孩，即我们的上帝。


          无论长老打算去哪里——是去沙漠深处，还是去耶路撒冷朝拜圣十字和圣地，还是去西奈山祷告，还是去耶路撒冷以外遥远地方安息的殉道者那里——长老是殉道者的伟大敬拜者，他曾前往以弗所拜访圣约翰，又去欧凯塔斯拜访圣狄奥多尔，又去伊索利亚境内的塞琉西亚拜访圣特克拉，又去萨法斯拜访圣塞尔吉，有时去这位圣者，有时去那位圣者——临行前，他照例点燃一根蜡烛，然后，他跪下祷告，恳求上帝引导他的路程，他注视着女皇的圣像，呼求道：「至圣女皇、上帝之母啊，我将踏上漫长的旅途，为期多日。请眷顾您的蜡烛，并保守它，愿它在您面前永不熄灭，直到我归来。我此去全仰仗您在旅途中的帮助。」在圣像前说完这些话后，他便踏上了旅程。


          待他完成预定的旅程，这旅程有时持续一月，有时两三月，有时甚至五六月，他回到家中，发现蜡烛依然燃烧着，如同他出发时所点燃并留下的那样，他从未见过它自行熄灭，无论是在睡梦中醒来时，还是从异乡或沙漠归来时。'
  - type: heading2
    initial:
      ru: '181.'
      cn: '181.'
    text:
      ru: Вот что еще рассказывал нам тот же пресвитер Дионисий об этом старце.
      cn: 同一位司祭季奥尼西奥斯还告诉了我们关于这位长老的这件事。
    children:
    - type: paragraph
      text:
        ru: Однажды старец совершал прогулку в окрестностях Соха – поблизости от своей пещеры. Прохаживаясь, он увидал огромного льва, который, идя навстречу, приближался к нему. Шел он по очень тесной дороге, лежавшей между двух изгородей, которыми поселяне огораживают свои пашни, разводя колючие растения. Благодаря этим растениям, дорога была так узка, что едва мог пройти один только пеший и при том без всякой ноши. Да и такой-то беспрепятственно едва ли мог пройти. Старец и лев приблизились друг к другу. Ни старец не возвращался, чтобы дать проход льву, ни лев не мог повернуться по крайней тесноте пути. Увидав, что слуга Божий желает пройти и вовсе не намерен вернуться, лев, став на задние ноги и выпрямившись, прижался к изгороди с левой стороны от старца и, надавив ее тяжестью и силой своего тела, образовал небольшое пространство, так что праведник мог беспрепятственно пройти. И старец прошел, слегка задев спину льва. После прохода старца лев встал с плетня и пошел дальше.
        cn: 有一天，一位长老在他的洞穴附近，在索哈一带散步。散步时，他看见一头巨大的狮子，正迎面朝他走来。他走在一条非常狭窄的路上，这条路位于两道篱笆之间，乡民们用这些篱笆围住他们的农田，并种植带刺的植物。由于这些植物，道路狭窄到几乎只有一人徒步，且不带任何负重才能通过。即使是这样的人，也几乎无法畅通无阻地通过。长老和狮子互相靠近了。长老没有回头为狮子让路，狮子也因道路极其狭窄而无法转身。看到神的仆人想要通过，并且完全没有回头的打算，狮子便用后腿站立起来，直起身子，紧贴在长老左侧的篱笆上，用它身体的重量和力量压向篱笆，制造出了一小块空间，使得这位义人能够畅通无阻地通过。长老便走了过去，轻轻地擦过狮子的背部。长老通过后，狮子便从篱笆边站起来，继续前行。
    - type: paragraph
      text:
        ru: Один брат пришел к авве Иоанну и ничего не нашел у него в пещере.
        cn: 一位弟兄来到阿爸约翰那里，在他洞穴里什么也没找到。
    - type: paragraph
      text:
        ru: – Как же ты живешь здесь, отче, не имея самого необходимого?
        cn: ——神父，您在这里是如何生活的呢，连最基本的生活所需都没有？
    - type: paragraph
      text:
        ru: '– Пещера эта что лавка, чадо мое: дай – и возьмешь.'
        cn: ——这洞穴就像一家铺子，我的孩子：你给，就必得着。
  - type: heading2
    initial:
      ru: '182.'
      cn: '182.'
    text:
      ru: Жизнь аввы Александра киликийского, подвергшегося пред кончиной диавольскому нападению.
      cn: 基利家的阿爸亚历山大生平，他在临终前遭受了魔鬼的袭击。
    children:
    - type: paragraph
      text:
        ru: 'По близости св. Вифлеема есть монастырь св. Сергия, всего в двух верстах от него, называемый Ксиропотам. Там был весьма благочестивый игумен, авва Евгений, бывший впоследствии епископом Гермополя в той части Египта, которая лежит в соседстве с ближайшей Фиваидой. Мы пришли к нему в монастырь, и вот что рассказал он нам об авве Александре киликиянине: достигши преклонной старости в пещерах св. Иордана, он принял Евгения в свой монастырь. Под конец своей жизни старец не вставал уже с одра в течение трех месяцев. И вот за десять дней до своего отшествия ко Господу, старец подвергся сатанинскому нападению по зависти диавола. Тогда старец начал говорить диаволу: «К вечеру пришел-то ты, несчастный! Не много это значит... Я ведь ослаб и лежу неподвижно на одре своем. Несчастный, ты против воли обнаружил свое бессилие... Если бы ты был на самом деле могуч и силен, ты должен был бы подступить ко мне пятьдесят или шестьдесят лет тому назад. Тогда я, с помощью укрепляющего меня Христа, показал бы тебе твое бессилие, низринул бы гордыню твою и сокрушил бы непреклонную выю твою. А теперь... не моя это слабость, это – сокрушившая меня дряхлость. Впрочем, я благодарю Бога. Отходя к Нему, я скажу Ему об обиде, которой подвергся от тебя: после стольких лет подвига и злостраданий, при самой кончине, ты столь жестоко напал на меня...». Это, равно как и многое другое, повторял он каждый день, а на десятый – с полным спокойствием, в мире предал дух свой Господу Христу.'
        cn: 在圣伯利恒附近，距其仅两俄里处，有一座圣塞尔吉乌斯修道院，名为锡罗波塔姆。那里曾有一位非常虔敬的院长，阿巴·欧根尼，他后来成为赫尔莫波利斯的主教，该地位于埃及邻近提拜德的区域。我们来到他的修道院，他向我们讲述了关于基利基亚人阿巴·亚历山大的事迹：亚历山大在圣约旦的洞穴中度过了高龄后，接纳欧根尼进入他的修道院。在他生命的最后阶段，这位长老有三个月未能从卧榻上起身。在他离世归主前十天，这位长老因魔鬼的嫉妒而遭受了撒但的攻击。那时，长老开始对魔鬼说：「你这不幸的，到了晚上才来！这算不得什么……我已衰弱，一动不动地躺在我的卧榻上。你这不幸的，你不情愿地显露了你的无能……如果你真有权能和力量，你本应在五六十年前就向我逼近。那样，借着那加给我力量的基督的帮助，我就会让你看到你的无能，倾覆你的骄傲，并折断你那顽固的颈项。而现在……这不是我的软弱，而是那击垮我的衰老。然而，我感谢上帝。归向祂时，我会告诉祂我因你所遭受的伤害：在经历了多年的苦修和磨难之后，竟在临终之际，你如此残酷地攻击我……」他每天重复着这些话语，以及许多其他的话，到了第十天，他在完全的平静与平安中，将他的灵交给了主基督。
  - type: heading2
    initial:
      ru: '183.'
      cn: '183.'
    text:
      ru: Чудо египетского старца Давида.
      cn: 埃及长老达维德的奇迹。
    children:
    - type: paragraph
      text:
        ru: 'Авва Феодор киликиянин рассказывал нам: когда я еще находился в скиту, был там один старец, по имени Давид. Однажды он пошел жать вместе с другими иноками. Таков был обычай в скиту – отправляться по селениям на жатву. Пошел и старец и нанялся за поденную плату к одному земледельцу. Однажды около шести часов настал палящий зной, и старец, прекратив работу, ушел в какой-то шалаш и присел там. Пришел земледелец и, увидав его в шалаше, с гневом сказал ему:'
        cn: 阿巴·提奥多尔·基利基亚宁告诉我们：当我还在斯基特的时候，那里有一位名叫达维德的长老。有一次，他与其他修士一同出去收割。这是斯基特的习俗——前往村庄收割庄稼。这位长老也去了，并受雇按日计酬，为一位农夫工作。有一天，大约六点钟的时候，酷热来临，这位长老就停止了工作，走到一个棚屋里，并在那里坐了下来。那位农夫来了，看见他在棚屋里，便怒气冲冲地对他说：
    - type: paragraph
      text:
        ru: – Что ж ты не жнешь, старик? Или позабыл, что я плачу тебе деньги?
        cn: ——你为什么还不收割呢，老头？或者你是不是忘了，我付你工钱的？
    - type: paragraph
      text:
        ru: – Правда твоя! Но настал сильный жар, и зерна пшеницы падают из колосьев на землю. Я пережду немного, пока пройдет жар, чтобы тебе не потерпеть урону.
        cn: – 你说得对！但强烈的酷热已经降临，麦粒正从麦穗上掉到地上。我将稍等片刻，直到酷热过去，这样你就不会遭受损失了。
    - type: paragraph
      text:
        ru: – Вставай-ка жать, хоть бы и все сгорело...
        cn: ——起来吧，收割吧，即便一切都烧毁了……
    - type: paragraph
      text:
        ru: – Что ж, ты и в самом деле хочешь, чтобы все погорело? – спросил старец.
        cn: – 那么，你真的想要让所有的一切都烧毁吗？ – 老人问道。
    - type: paragraph
      text:
        ru: – Да! Я ведь сказал тебе! – ответил с гневом земледелец. Старец встал – и вот внезапно запылало поле... Тогда испуганный земледелец бросился в другую сторону, где жали другие старцы, и начал умолять их, чтобы они пришли и упросили старца, да помолится он и да угасит пламя. Те пришли и бросились к ногам старца.
        cn: 「是的！我不是已经告诉你了吗！」农夫愤怒地答道。长老站了起来——接着，突然，田地就燃烧起来了……于是，惊恐的农夫冲向另一边，那里有其他长老正在收割，他开始恳求他们，请他们过来恳求那长老，让他祈祷并熄灭火焰。那些长老过来了，扑倒在长老的脚下。
    - type: paragraph
      text:
        ru: – Да ведь он сам пожелал этого, – сказал старец.
        cn: – 但他自己就是这么希望的啊，– 长老说。
    - type: paragraph
      text:
        ru: Но другие старцы умоляли его. Он пошел и, став между горевшим и не горевшим полем, вознес молитву, и тотчас угас огонь на ниве, и все остальное уцелело. Все удивились и воздали славу Богу.
        cn: 但其他长老们恳求他。他去了，站在烧着和未烧着的田地之间，献上祷告，于是田地上的火立刻熄灭了，所有其他部分都保全了。所有人都感到惊奇，并将荣耀归给上帝。
  - type: heading2
    initial:
      ru: '184.'
      cn: '184.'
    text:
      ru: ''
      cn: ''
    children:
    - type: paragraph
      text:
        ru: I. Благостный старец.
        cn: I. 慈祥的长老
    - type: paragraph
      text:
        ru: 'В Александрии, в Эннате, мы пришли для назидания в монастырь аввы Иоанна евнуха. Здесь нашли мы дряхлого старца, прожившего около восьмидесяти лет в монастыре. Он был так милосерд не только к людям, но и к бессловесным животным, что нам еще не приходилось встречать другого, подобного ему. Что делал старец? У него не было другого дела, кроме следующего: вставши рано, он отправлялся кормить собак, живших в лавре. Потом насыпал муки малым муравьям и пшеницы большим, размачивал сухари и бросал на кровли зданий – для птиц. Проводя так жизнь в монастыре, он не оставил ни двери, ни окна, ни подоконника, ни свечи, ни блюда и, чтобы не распространяться обо всем, – не оставил ничего из земных вещей. Никогда, даже и на один час, он не владел ни книгой, ни деньгами, ни одеждой, но все раздавал нуждающимся, устремив все заботы на грядущие блага (вечной жизни). Желая изобразить его милосердие и сострадательность, рассказывали нам: однажды пришел к нему какой-то земледелец и просил у него одну номисму золотом. Старец сам не имел – у него вообще никогда не было золота в руках. Он послал его и занял в монастыре. Крестьянин, взял монету, уверял его, что через месяц возвратит долг. Но вот прошло два года, и земледелец не отдавал долга, да и сам не имел ничего. Авва Иоанн призывает его и говорит:'
        cn: '在亚历山大城恩纳特，我们为受教益来到亚巴·约翰（阉人）的修道院。在这里，我们找到一位年迈的长老，他在修道院里住了大约八十年。他不仅对人，也对无言的动物如此仁慈，以至于我们从未见过与他相似的另一位。这位长老做些什么呢？除了以下的事情，他没有别的事可做：他早早起身，去喂养住在隐修区（拉夫拉）里的狗。接着，他把面粉撒给小蚂蚁，把麦子撒给大蚂蚁，浸软干面包，然后扔到建筑的屋顶上——给鸟吃。他在修道院里过着这样的生活时，没有留下门、窗、窗台、蜡烛或盘子，并且，为了不一一详述——他没有留下任何属世之物。甚至连一个小时，他都没有拥有过书、钱或衣服，但他把一切都分给了有需要的人，将所有的关切都投向将来的福益（永生）。


          为了描绘他的仁慈和怜悯，人们告诉我们：有一天，一个农夫来到他那里，向他要一枚金币（诺米斯玛）。长老自己没有——他手中根本从未有过金子。他派人去修道院里借了钱。农夫拿到钱币后，向他保证会在一个月内归还债务。但两年过去了，农夫没有归还债务，并且他自己也一无所有。亚巴·约翰召他来，对他说：'
    - type: paragraph
      text:
        ru: – Возврати мне номисму, брат!
        cn: – 把诺米斯马还给我，弟兄！
    - type: paragraph
      text:
        ru: – Видит Бог, что мне нечем заплатить, – отвечал земледелец.
        cn: 「上帝明鉴，我一无所有可以偿还。」农夫答道。
    - type: paragraph
      text:
        ru: – А я придумал способ, как тебе заплатить мне долг...
        cn: – 而我，想到了一个办法，让你如何偿还我的债……
    - type: paragraph
      text:
        ru: '– Что прикажешь – скажи мне: я готов все исполнить, –  сказал крестьянин. Он думал, что он даст ему какую-нибудь работу.'
        cn: 「您吩咐什么——请告诉我：我已准备好遵行一切，」农民说道。他以为那人会给他一些工作。
    - type: paragraph
      text:
        ru: – В свободное от работы время, когда только тебе будет удобно, приходи сюда и клади по тридцати поклонов. Я буду давать тебе керату за каждый приход. Сверх того, старец кормил земледельца. Тот согласился на это и, когда ему было удобно, приходил и клал поклоны. Старец давал ему плату, т.е., каждый раз одну керату. Накормив самого, он наделял его еще сухарями на пять человек, по числу его домочадцев. Так составилась сумма в двадцать четыре керата, что составляет номисму. Взяв деньги, старец отпустил крестьянина, давши ему еще от себя – благословение.
        cn: ——在工作之余，只要你方便，就到这里来行三十个大拜。你每来一趟，我都会给你一个克拉图。不仅如此，这位长老还供养这位农夫。农夫同意了，并且，只要他方便，就来行大拜。长老付给他报酬，也就是说，每一次一个克拉图。在供他吃饱之后，长老还按照他家眷的人数，给他预备了可供五人食用的硬面包干。这样就累积了总共二十四个克拉图，这构成了一个诺米斯马。收到钱后，长老就让这位农夫离开了，并且还赐予他自己的一份祝福。
    - type: paragraph
      text:
        ru: II. Жизнь аввы Иоанна евнуха и – юного инока, не пившего ни воды, ни вина.
        cn: 二. 长老约翰宦官的生平，——以及一位既不饮水也不饮酒的年轻修士。
    - type: paragraph
      text:
        ru: 'Тот же авва Иоанн евнух рассказал нам: пришлось мне быть в Фиваиде, в киновии аввы Аполлона. Там я видел молодого брата, у которого был и отец по плоти, тоже инок. Этот юноша дал обет в течение всей жизни не пить ни воды, ни вина, смешанного с водою, ни какого-либо другого напитка. Он питался цикорием, бобами, вообще такими овощами, которые, служа пищей, могли бы в тоже время и утолять жажду. Послушание его состояло в том, чтобы сажать хлебы в печь. Так прошло три года – и юноша заболел. От этого недуга он и отошел ко Господу. Во время болезни с ним сделался сильный жар, к тому же он страшно страдал от жажды. Все его уговаривали, чтобы он принял хотя немного вина с водою, но брат наотрез отказался. Тогда авва киновии послал за врачом – не найдет ли тот возможности помочь страдальцу. Врач явился. Увидав брата в тяжком состоянии, врач долго убеждал его принять немного вина с водой, но – все было тщетно. Тогда врач обратился к авве со словами: «Принесите мне сюда большое корыто». Влив в него четыре ведра теплой воды, он заставил опустить в нее больного до бедер и держать его в воде в течение часа. И св. старец уверял нас – он сам был в то время, когда поднимали юношу из воды – когда врач смерил воду, в корыте оказалось воды не более одного ведра... Вот как жили великие подвижники, истощая себя ради Бога, чтобы наследовать вечное блаженство.'
        cn: 同一位修士院长（阿瓦）伊奥安尼，这位宦官，告诉我们：我曾去提拜德，在修士院长（阿瓦）阿波罗的修道院（基诺维亚）里。在那里我看到一位年轻的修士兄弟，他的生身父亲也是一名修士。这位年轻人许下誓愿，在他的一生中不喝水，不喝搀水的酒，也不喝任何其他饮品。他以菊苣、豆类为食，总之是那些既能充当食物，同时又能解渴的蔬菜。他的顺服功课是把面饼放入炉中。这样过了三年，这位年轻人病了。由于这场疾病，他便归去了主那里。患病期间他发高烧，此外还口渴得厉害。所有人劝他，哪怕只喝一点点搀水的酒，但这位修士兄弟断然拒绝了。于是修道院（基诺维亚）的修士院长（阿瓦）派人去请医生，看他是否能找到办法帮助这位受苦的人。医生来了。看到修士兄弟病重，医生长时间劝他喝点搀水的酒，但一切都白费了。于是医生对修士院长（阿瓦）说：「请给我拿一个大木盆来。」倒入四桶温水后，他让病人浸入其中直到大腿，并在水中待一个小时。而这位圣洁的长老向我们保证——他当时就在场，当把年轻人从水中抬出来的时候——当医生测量水时，木盆里的水只剩下不到一桶了……伟大的苦修者就是这样生活的，为上帝而耗尽自己，为要承受永恒的福乐。
    - type: paragraph
      text:
        ru: III. Старец-молитвенник.
        cn: III. 善祷长老。
    - type: paragraph
      text:
        ru: 'Он же рассказал еще следующее: в той же киновии я зашел в келлию одного старца. Там я видел каменную плиту, на которой молился старец. Падая на плиту руками и коленами, старец продолбил плиту в тех местах, где касались его руки и колена, на глубину четырех пальцев. Сколько же он положил поклонов?!'
        cn: 他还讲述了以下的事：在同一所共有修道院里，我走进了位长老的修士隐修室。在那里我看到一块石板，长老就在那上面祈祷。他用手和膝跪拜在那石板上，长老在双手和双膝接触到的地方磨出了坑，有四指深。他究竟行了多少次跪拜礼啊？！
  - type: heading2
    initial:
      ru: '185.'
      cn: '185.'
    text:
      ru: Верная жена, дивною мудростью обратившая к вере мужа язычника.
      cn: 忠贞的妻子，以奇妙的智慧使她的异教徒丈夫归信。
    children:
    - type: paragraph
      text:
        ru: 'В бытность нашу на острове Самос боголюбивая и нищелюбивая Мария, мать кир Павла кандидата, рассказала нам, что в городе Нисибисе жила одна христианка, муж ее был язычником. У них было пятьдесят милиарисий. Однажды муж говорит жене своей так: «Отдадим наши милиарисий в рост, чтобы получить с этого хотя бы малую прибыль – ведь, изводя один за одним, мы скоро растратим все». Жена говорит ему в ответ: «Если хочешь отдать их в рост, отдай христианскому Богу». Муж говорит ей: «А где этот христианский Бог, чтобы нам дать Ему взаймы?» Она говорит мужу: «Я тебе Его покажу, и ты не только не потеряешь деньги, но Он заплатит тебе лихву и удвоит сумму, которую получил». Муж говорит ей: «Пойдем, покажи мне Его, и дадим Ему взаймы». Она, взяв своего мужа об руку, ведет его в святуюцерковь, В нисибисской церкви пять больших дверей. И вот когда женщина привела его на паперть, где расположены эти большие двери, она показала ему на нищих, сказав: «Если ты отдашь им, то это христианский Бог возьмет деньги. Ведь все они – Его люди». Тогда муж этой женщины с радостью отдает нищим свои пятьдесят милиарисий и возвращается домой. Через три месяца, когда у них вышли деньги, муж говорит жене: «Сестра, христианский Бог не считает нужным отдать нам хоть часть своего долга, а мы в крайности». Жена говорит ему в ответ: «Ступай туда, где ты давал деньги, и Бог с превеликой готовностью вернет их тебе». Муж бегом бросился в святуюцерковь. Оказавшись в том месте, где отдал нищим свои милиарисий, и, обойдя всю церковь, он не увидел, как рассчитывал, никого, кто бы вернул ему долг, кроме нищих, опять сидевших там. И когда он раздумывал, к кому обратиться и с кого спросить, замечает, что на мраморных плитах под ногами у него лежит один большой милиарисий из числа тех, которыми он оделил нищих; человек этот наклоняется и, подняв монету, идет в дом свой. И говорит своей жене: «Вот я сходил в вашу церковь, и поверь мне, жена, не увидел христианского Бога, которого, по твоим словам, должен был увидеть, и Он мне ничего не вернул – только там, где я роздал пятьдесят милиарисий, я нашел на полу вот этот». Тогда достойная удивления женщина говорит ему: «Бог незримо вернул его тебе. Ведь незрим Бог и незримой силой своей и дланью правит миром. Но ступай, господин мой, купи чего-нибудь, чтобы мы сегодня поели, а Бог снова позаботится о тебе». Муж пошел и купил им хлеба, вина и рыбы. И, вернувшись, дает жене. Она же, взяв рыбу, начинает ее чистить и, разрезав, находит во внутренностях предивный камень, так что женщина поразилась его красоте. Она не знала, что это за камень, но все же не бросила его. Когда возвратился муж ее, и они стали есть, она показала ему камень, который нашла, говоря: «Вот какой камень я нашла в рыбе». Он же, взглянув, и сам был удивлен красотой камня, но тоже не знал его природы. После того как они поели, муж говорит: «Дай мне этот камень – я пойду и продам его, если удастся что-нибудь выручить». Ведь и муж ее, будучи, как я сказал, человеком простым, не знал, что это за камень. И вот он берет камень и отправляется к меняле. А тот был еще и серебряных дел мастером. Уже пришло время закрывать лавку (дело было вечером), и пришедший говорит среброделу: «Хочешь купить этот камушек?» Серебряных дел мастер, взглянув на него, говорит: «Сколько ты просишь?» Продающий камень говорит ему: «Дай сколько-нибудь». Тот говорит: «Хочешь пять милиарисии?» А продающий камень, решив, что меняла смеется, говорит: «Столько ты даешь за это?» Сребродел, думая, что пришедший ответил ему насмешливо, говорит: «Хочешь десять милиарисии?» Тот молчал в уверенности, что над ним опять подшучивают. Сребродел говорит ему: «Хочешь за него двадцать милиарисии?» Продающий молчал, ничего не отвечая. Когда серебряных дел мастер дошел до тридцати, а потом до пятидесяти милиарисии, клянясь, что заплатит такие деньги, пришедший, подумав, сообразил, что если бы его камень не был очень дорогим, сребродел не предлагал бы за него пятидесяти милиарисии. Меняла же, понемногу набавляя, посулил, наконец, триста больших милиарисии. Владелец камня согласился на это, и отдал камень, и в веселии возвращается к жене своей. Она, увидя его, спрашивает: «За сколько ты продал?» Она была уверена, что муж отдал камень за пять или десять фолиев. Тогда муж вынул триста милиарисии, подал ей и сказал, что продал камень за эти деньги. Она же, подивившись доброте человеколюбца Бога, говорит: «Вот, муж, сколь благ, великодушен и богат христианский Бог: видишь, Он не только вернул тебе, ссудившему его деньгами, пятьдесят милиарисии, но и лихву, спустя немного дней ушестерив то, что взял взаймы. Знай теперь – нет другого Бога, кроме Него, ни на земле, ни на небесах». Убежденный свершившимся чудом и на собственном опыте постигнув истину, человек этот тотчас принял христианство, восславил Господа и Спасителя нашего Христа с Отцом и Святым Духом и исполнился величайшей благодарности к своей разумной жене, через которую ему было дано познать истинного Бога.'
        cn: 我们住在萨摩斯岛期间，敬神爱贫的玛利亚——保罗·坎迪达基斯的母亲——告诉我们，在尼西比斯城住着一位基督徒妇女，她的丈夫是异教徒。他们有五十枚银币。一天，丈夫对妻子说：「我们把这些银币拿去放贷吧，这样至少能得到一点微薄的利润——因为如果我们一枚接一枚地花掉，很快就会把钱都用光了。」妻子回答他说：「如果你想把钱放贷，就贷给基督徒的上帝吧。」丈夫问她：「这位基督徒的上帝在哪里？我们怎么能借钱给他呢？」她对丈夫说：「我会把他指给你看，你不仅不会赔钱，他还会付给你利息，把你借给他的钱翻倍。」丈夫对她说：「走吧，指给我看，我们把钱借给他。」她挽着丈夫的手，把他带到圣教堂。尼西比斯教堂有五扇大门。当这位妇人把他带到位于这些大门前的教堂前厅时，她指着穷人们说：「如果你把钱给他们，那么基督徒的上帝就会收下这些钱。因为他们都是他的人。」于是，这位妇人的丈夫欣然把他的五十枚银币给了穷人，然后回家了。三个月后，当他们的钱用完时，丈夫对妻子说：「姊妹，基督徒的上帝似乎认为不必还给我们哪怕是一部分的债务，而我们现在正处于困境。」妻子回答他说：「你去你施舍钱的地方，上帝会非常乐意把钱还给你。」丈夫飞快地跑向圣教堂。当他来到他施舍银币给穷人的地方，并且在整个教堂里转了一圈后，他没有看到像他预期的那样有任何人会还他债务，除了那些又坐在那里的穷人。当他思索该向谁求助、该向谁索取时，他注意到脚下的大理石板上有一枚大银币，正是他分发给穷人的那些银币中的一枚；这个人弯下腰，拾起这枚硬币，然后回家了。他对妻子说：「你看，我去了你们的教堂，相信我，妻子，我没有看到你所说的那个基督徒的上帝，他也没有还给我任何东西——只是在我分发五十枚银币的地方，我在地板上发现了这枚。」这时，这位令人惊奇的妇人对他说：「上帝无形中还给了你。因为上帝是无形的，他用他无形的力量和手臂治理世界。但去吧，我的主人，买些东西，我们今天好吃饭，上帝会再次照顾你的。」丈夫去了，给他们买了面包、酒和鱼。他回来后把东西给了妻子。妻子拿起鱼，开始清理，切开后，在内脏里发现了一块非常美丽的宝石，以至于这位妇人对其美丽感到震惊。她不知道这是什么宝石，但还是没有扔掉它。当她丈夫回来，他们开始吃饭时，她把她发现的宝石给他看，说：「看，我在这条鱼里发现了这样一块宝石。」他看了，也对宝石的美丽感到惊讶，但他也不知道它的性质。他们吃完饭后，丈夫说：「把这块宝石给我——我去把它卖掉，如果能卖出点什么的话。」因为他的丈夫，正如我所说的，是个普通人，不知道这是什么宝石。于是他拿着宝石去了钱币兑换商那里。这个兑换商也是一个银匠。那时店里快要关门了（当时是晚上），来人对银匠说：「你想买这块小石头吗？」银匠看了看，说：「你想要多少钱？」卖宝石的人对他说：「随便给点钱。」那人说：「你想要五枚银币吗？」卖宝石的人以为兑换商在嘲笑他，便说：「你只给这么多钱吗？」银匠以为来人讥讽地回答他，便说：「你想要十枚银币吗？」那人沉默不语，确信自己又被取笑了。银匠对他说：「你想要二十枚银币吗？」卖方沉默不语，什么也没回答。当银匠出价到三十枚，然后到五十枚银币时，并誓言会支付这笔钱时，来人思索后明白了，如果他的宝石不是非常昂贵，银匠是不会出价五十枚银币的。兑换商则一点点地加价，最终出价三百枚大银币。宝石的主人同意了，交出了宝石，并高兴地回到妻子身边。她看到他，问道：「你卖了多少钱？」她确信丈夫把宝石卖了五枚或十枚小钱。然后丈夫拿出三百枚银币，递给她，并说他以这笔钱卖了宝石。她惊叹于这位爱世人的上帝的良善，说：「看啊，丈夫，基督徒的上帝是多么美好、慷慨和富有：你看，他不仅还给了你这五十枚银币，而且还给了利息，在几天之后，把你借给他的钱翻了六倍。现在你知道了——除了他，地上和天上再没有别的上帝了。」这个人被所发生的奇迹所说服，并亲身体验到真理，立刻皈依了基督教，赞美了我们的主和救主基督以及父和圣灵，并对他的明智妻子充满了极大的感激，正是通过她，他才认识了真神。
  - type: heading2
    initial:
      ru: '186.'
      cn: '186.'
    text:
      ru: Мосх, тирский купец.
      cn: 莫斯赫，泰尔商人。
    children:
    - type: paragraph
      text:
        ru: 'Были мы в Пещерной киновии аввы Саввы у игумена аввы Евстафия. От него мы выслушали следующий рассказ: был один сборщик пошлин при таможне, по имени Мосх. Во время пребывания нашего в Тире он рассказал нам про себя: служил я сборщиком пошлин при таможне. Однажды уже поздним вечером отправился купаться. На дороге встречаю женщину. Мрак покрывал ее... Я подошел к ней... и она согласилась идти со мною. От сатанинской радости, я забыл и о купанье и поспешил ужинать. Долго я уговаривал ее, но, несмотря на то, она решительно отказывалась съесть что-нибудь. Под конец, встали из-за стола, чтобы возлечь, но лишь только я подошел обнять ее, как она пронзительно вскрикнула, заливаясь слезами...'
        cn: 我们曾赴萨瓦长老的洞穴隐修院，在黑所长老欧斯塔提欧斯那里。我们从他那里听到了以下的故事：曾有一个海关税吏，名叫莫斯霍斯。我们在提尔城居住期间，他向我们讲述了他自己的经历：「我曾做海关税吏。有一天夜色已深，我出去沐浴。在路上，我遇到一位妇人。黑暗笼罩着她……我走近她……她同意与我同行。出于魔鬼般的狂喜，我忘了沐浴的事，匆匆回去吃晚饭。我劝了她许久，然而，尽管如此，她仍坚决不肯吃任何东西。最后，我们从桌旁起身，准备安歇，但我刚一走近想拥抱她，她就发出一声凄厉的尖叫，泪流满面……」
    - type: paragraph
      text:
        ru: – О, горе мне, несчастной!..
        cn: – 噢，祸哉我这不幸的！...
    - type: paragraph
      text:
        ru: Потрясенный до глубины души, я спросил ее о причине. Еще более залившись слезами, она рассказала мне, что ее муж был купцом, потерпел кораблекрушение и потерял не только все свое, но и чужое. И вот теперь он под стражею.
        cn: 深受震撼，我问她原因。她更是泪流满面地告诉我，她的丈夫是个商人，遭遇了海难，不仅失去了自己所有的一切，也损失了别人的财物。现在他被羁押着。
    - type: paragraph
      text:
        ru: – Не зная, на что решиться, чтобы достать для него кусок хлеба, в крайности я решилась торговать собою, к крайнему позору своему, чтобы снискать пропитание... Ведь у нас все отняли...
        cn: —— 不知该如何是好，才能为他弄到一块面包，在绝境中，我决定出卖自己，给我自己带来了极大的羞辱，只为求得生计……因为我们的一切都被夺走了……
    - type: paragraph
      text:
        ru: – А как велик долг его? – спросил я.
        cn: – 那么，他的债务有多大？– 我问道。
    - type: paragraph
      text:
        ru: – Пять фунтов золота...
        cn: – 五磅黄金...
    - type: paragraph
      text:
        ru: 'Достав золото, я отдал ей со словами:'
        cn: 取出黄金后，我递给她，说道：
    - type: paragraph
      text:
        ru: – Благодарение Богу – я не коснулся тебя. Вот золото, возьми и выкупи мужа – и помолитесь за меня.
        cn: ——感谢上帝——我没有碰你。这是金子，你拿着去赎回丈夫——并为我祷告。
    - type: paragraph
      text:
        ru: Спустя несколько времени, на меня взвели клевету пред государем, что я расточил казенные деньги. Государь послал приказ конфисковать все мое имущество, а меня самого почти нагим отвели в Константинополь и заключили в тюрьму. Долгое время я сидел в одной старой рубашке. Однажды я узнал, что царь решил предать меня смертной казни... Окончательно потеряв надежду на жизнь, я оплакивал свою участь и среди горьких дум заснул. И вот во сне я вижу как бы ту самую женщину, муж которой некогда содержался в тюрьме.
        cn: 过了不久，我被人诬陷在君王面前，说我挥霍了公款。君王下令没收我所有财产，而我本人则几近赤裸地被押解到君士坦丁堡，关进监狱。很长一段时间，我都只穿着一件破旧的衬衫。有一天，我得知君王决定将我处以死刑……对生命彻底绝望，我哀叹自己的处境，并在悲苦的思虑中入睡。就在这时，我在梦中仿佛看见了那位妇人，她的丈夫曾一度被关在监狱里。
    - type: paragraph
      text:
        ru: – Что с тобой, господин Мосх? – спрашивает она. –  Зачем ты – здесь?
        cn: '"莫斯赫先生，你怎么了？" 她问道，"你为何在此？"'
    - type: paragraph
      text:
        ru: – Я оклеветан и, думаю, скоро казнят меня, –  отвечал я.
        cn: – 我被诽谤了，而且我想，他们很快就要处决我了， – 我回答道。
    - type: paragraph
      text:
        ru: – Не хочешь ли – я скажу о тебе государю, и он освободит тебя?
        cn: ——你愿不愿意——我向君王说起你，他就会释放你吗？
    - type: paragraph
      text:
        ru: – Но разве государь знает тебя?
        cn: – 但难道国君认识你吗？
    - type: paragraph
      text:
        ru: – Да! Я пробудился и недоумевал, чтобы это значило. Но вот то же сновидение – во второй и в третий раз, и те же речи...
        cn: ——是的！我醒来了，并且困惑不解，这究竟意味着什么。然而，同样的梦境——第二次和第三次，并且是同样的话语……
    - type: paragraph
      text:
        ru: – Не бойся! Завтра освободят тебя...
        cn: ——不要害怕！明天他们会释放你……
    - type: paragraph
      text:
        ru: 'На рассвете, по повелению царя, призывают меня во дворец. Лишь только я вошел, и царь, увидев меня в моей нечистой одежде, сказал мне:'
        cn: 在黎明时分，奉国王的命令，我被召入宫殿。我一进去，国王看见我穿着不洁的衣服，就对我说：
    - type: paragraph
      text:
        ru: – Я милую тебя, – только будь исправен на будущее время.
        cn: – 我赦免你， – 只是今后务必改正。
    - type: paragraph
      text:
        ru: 'По правую сторону царя стояла та самая женщина и, ободряя, говорила мне:'
        cn: 在王的右侧，正是那位妇人站着，她鼓励着对我说：
    - type: paragraph
      text:
        ru: – Будь спокоен... Не бойся!
        cn: – 保持平静... 不要惧怕！
    - type: paragraph
      text:
        ru: Царь приказал возвратить мне мое имущество и, наградив щедро сверх того, с большими почестями восстановил меня в прежней должности. Наконец назначил и правителем этой области.
        cn: 君王命令将我的财产归还给我，并且，在此之上丰厚地赏赐了我，带着极高的荣誉使我官复原职。最后，他还任命我为该地区的总督。
    - type: paragraph
      text:
        ru: 'Между тем в следующую ночь является опять во сне та же самая женщина и говорит:'
        cn: 与此同时，在接下来的夜里，那位同样的妇人再次在梦中显现，并说道：
    - type: paragraph
      text:
        ru: – Знаешь ли ты меня? Ты ради Бога оказал мне милость и не коснулся меня... Вот и я избавила тебя от опасности. Видишь ли человеколюбие Божие? Ты оказал мне милость, а я удвоила ее, по отношению к тебе...».
        cn: ——你认识我吗？你为了上帝的缘故对我施予了怜悯，没有触碰我……看，我也使你脱离了危险。你看到上帝的仁爱了吗？你对我施予了怜悯，而我，对于你，则将其加倍了……»
  - type: heading2
    initial:
      ru: '187.'
      cn: '187.'
    text:
      ru: Учение аввы Иоанна о стяжании добродетелей.
      cn: 阿爸 约翰 关于 习得 美德 的 教导。
    children:
    - type: paragraph
      text:
        ru: 'Из св. Гефсимании мы взошли на св. гору Елеонскую. Там есть монастырь, называемый «монастырь аввы Авраамия». Его основал великий Авраамий, бывший после Евдоксия игуменом новой церкви Всехвальной Богородицы и Приснодевы Марии. Во время нашего прихода в Авраамиевом монастыре настоятелем был авва Иоанн из Кизика. Однажды мы спросили его:'
        cn: 从圣格特西马尼，我们登上了圣橄榄山。那里有一座修道院，名为「阿夫拉米长老修道院」。它由伟大的阿夫拉米创立，他曾是欧多克西亚之后的普受赞颂的上帝之母和永贞女马利亚新教堂的方丈。在我们到来的时候，阿夫拉米修道院的院长是来自基济科斯的约翰长老。有一次，我们问他：
    - type: paragraph
      text:
        ru: – Как усовершенствоваться в добродетели?
        cn: – 如何在德行上精进？
    - type: paragraph
      text:
        ru: – Кто-бы ни пожелал стяжать добродетель, – отвечал он, – если прежде не возненавидит противный ей порок, не может снискать ее. Желаешь ли получить дар слез – возненавидь сперва смех. Желаешь стать смиренным – возненавидь самопревозношение. Желаешь воздержания – возненавидь пресыщение. Желаешь ли стать целомудренным – должен возненавидеть сладострастие. Желаешь ли достигнуть бескорыстия – возненавидь все вещественное. Хочешь стать милостивым – возненавидь сребролюбие. Стремящийся к пустынножительству – разлюби города. Хочешь упражняться в молчании – возненавидь болтливость. Желающий стать чуждым (всему мирскому) – должен возненавидеть жизнь на показ. Хочешь быть воздержным в гневе – возненавидь светскую жизнь. Ищешь ли непамятозлобия – возненавидь злословие. Не желаешь рассеяния мыслей – оставайся в уединении. Хочешь ли обуздать язык – загради уши свои, чтобы не слышать многого. Желающий всегда пребывать в страхе Божием должен будет ненавидеть телесный покой, возлюбить скорбь и тесноту, – и таким образом получит возможность с чистым сердцем работать Богу.
        cn: '「凡是希望获得德行的人，」他答道，「若不先憎恨与其对立的罪恶，就不能获得它。

          你若希望得到痛哭之恩，就先憎恨嬉笑。

          你若希望变得谦卑，就憎恨自我抬高。

          你若希望节制自持，就憎恨过度满足。

          你若希望变得贞洁，就必须憎恨淫欲。

          你若希望达到无私，就憎恨一切物质之物。

          你若希望变得怜悯，就憎恨贪爱钱财。

          渴慕独修生活者，就当不再爱城市。

          你若希望操练静默，就憎恨饶舌。

          希望远离世俗者，就必须憎恨炫耀的生活。

          你若希望在怒气上有所节制，就憎恨世俗生活。

          你若寻求不记仇，就憎恨诽谤。

          你若不愿思想分散，就当保持独处。

          你若希望勒住舌头，就塞住你的耳朵，以免听见许多事情。

          凡是希望常存敬畏上帝之心者，就必须憎恨肉体的安逸，喜爱忧患与苦难，如此一来，他才能获得机会以纯洁的心事奉上帝。」'
  - type: heading2
    initial:
      ru: '188.'
      cn: '188.'
    text:
      ru: Жизнь двух братьев, сирийских серебряников.
      cn: 两位叙利亚银匠弟兄的生平。
    children:
    - type: paragraph
      text:
        ru: 'Феодор, игумен Старой лавры, рассказал нам: в Константинополе были два брата, серебряники по ремеслу, родом – сирийцы. Однажды старший брат говорит младшему:'
        cn: 斐奥多尔，老修道院院长，告诉我们：在君士坦丁堡，曾有两个兄弟，以银匠为业，籍贯是叙利亚人。有一天，哥哥对弟弟说：
    - type: paragraph
      text:
        ru: – Пойдем, побываем в Сирии и приобретем во владение нам родительский дом.
        cn: ——「走吧，我们去一趟叙利亚，把那祖屋收归我们所有。」
    - type: paragraph
      text:
        ru: – Зачем уходить обоим? Можно ли нам бросить свое дело? Или ты иди, а я останусь здесь, или я отправлюсь, а ты останешься.
        cn: – 为什么要我们俩都离开呢？我们能抛下自己的事情吗？或者你去，我留在这里；或者我去，你留下。
    - type: paragraph
      text:
        ru: 'С общего согласия они порешили, чтобы отправился младший брат. Спустя немного времени после его отъезда, оставшийся в Константинополе видит сон: благолепный старец говорит ему: «Знаешь ли, что твой брат впал в блуд с женою харчевника?» – Проснувшись, он был очень огорчен и говорил сам себе: это я виноват: зачем отпустил его одного? Спустя несколько времени снова видит во сне того же мужа, который говорит те же слова: «Знаешь ли, что твой брат впал с женою харчевника?» – И снова – великая печаль... Но вот в третий раз явившийся говорит ему: «Знаешь ли, что брат твой покинул законную жену и связался с женою харчевника?» И немедленно пишет он из Константинополя в Сирию брату: «Тотчас же бросай все и возвращайся в Византию». Получив письмо, тот, оставив все, явился к брату. Старший, увидав младшего брата, ведет его в соборнуюцерковьи начинает горько укорять:'
        cn: 经共同同意，他们决定让那年幼的弟兄动身。他离开后不久，留在君士坦丁堡的那位做了一个梦：一位容貌庄严的长老对他说：「你可知道，你兄弟与一个店主的妻子犯了奸淫吗？」他醒来后非常忧伤，并自言自语道：「这是我的错，我为何让他一个人离开呢？」过了一段时间，他又在梦中看见那个同一个人，他说了同样的话：「你可知道，你兄弟与那个店主的妻子犯了奸淫吗？」——于是，又是巨大的忧伤……然而，第三次显现的那位对他说：「你可知道，你兄弟离弃了他的合法妻子，并与店主的妻子结合了？」他立刻从君士坦丁堡写信给叙利亚的兄弟：「立刻抛下一切，返回拜占庭。」那人收到信后，便舍弃了一切，来到兄弟那里。年长的弟兄看见年幼的弟兄后，领他进入大教堂，并开始苦苦责备他：
    - type: paragraph
      text:
        ru: – Хорошо ли это, что ты впал в блуд с женою харчевника?
        cn: – 你与客栈老板娘陷入奸淫，这好吗？
    - type: paragraph
      text:
        ru: 'Тот, выслушав брата, начал клясться именем Бога Вседержителя:'
        cn: 那人听了兄弟的话，便开始奉全能者的名起誓说：
    - type: paragraph
      text:
        ru: '– Я не понимаю, что ты говоришь: я не предавался распутству, не вступал ни с кем в незаконную связь и ни кого не знал, кроме законной жены.'
        cn: – 我不明白你在说什么：我没有沉溺于放荡，没有与任何人发生非法关系，除了我的合法妻子，我没有认识过任何人。
    - type: paragraph
      text:
        ru: 'Старший брат, выслушав это, – спрашивает:'
        cn: 长兄听了这话，便问：
    - type: paragraph
      text:
        ru: – Не сотворил ли ты еще чего-либо, более тяжкого? Тот отрекался.
        cn: —— 你没有再犯下什么更深重的罪过吗？那人否认了。
    - type: paragraph
      text:
        ru: – Ничего не сделал я незаконного... Правда, я нашел в нашем селении монахов из секты Севера, и, не зная, что это худо, имел с ними общение. Но другого ничего за собой не знаю. Тогда старший сообразил, что блуд и означает измену святой кафолической Церкви... Брат впал в ересь акефала Севера, поистине корчемника, опозорил себя и унизил высоту православия.
        cn: ——我没有做任何非法的事情……确实，我在我们的村庄里遇到了一些来自塞维鲁宗派的修士，并且，不知道这是错误的，就与他们有了交往。但我不知道自己还有其他什么。那时，长老意识到，淫乱也意味着背叛神圣大公教会……这位弟兄陷入了无头者塞维鲁的异端，此人实为盗匪，他玷污了自己，并贬低了正教的崇高。
  - type: heading2
    initial:
      ru: '189.'
      cn: '189.'
    text:
      ru: Жена, сохранившая верность мужу – и неожиданная помощь.
      cn: 对丈夫保持忠贞的妻子——和意想不到的帮助。
    children:
    - type: paragraph
      text:
        ru: 'В странноприимном доме отцов, в Аскалоне, пресвитер авва Евсевий рассказал нам: один купец из нашего города, во время плавания, потерял все свое и чужое имущество, – только сам остался цел. Вернувшись домой, он был схвачен заимодавцами и брошен в тюрьму, а дом и все имущество в доме были расхищены. У него ничего не осталось, кроме одежды, которая была на нем и у его жены. Бедная жена, в сильном душевном расстройстве и в большой крайности, думала только о том, как бы прокормить мужа. Однажды она сидела в тюрьме и вкушала пищу вместе с мужем. Знатный человек посетил тюрьму, чтобы раздать милостыню узникам, и, заметив жену подле мужа, был уязвлен ее замечательной красотою и чрез стражу передал ей, чтобы она пришла к нему. Она охотно подошла к нему, надеясь получить от него помощь. Отведя ее в сторону, он сказал ей:'
        cn: 在阿斯卡隆的父老接待所，长老阿爸欧瑟比给我们讲述了：我们城里的一位商人在航海途中，失去了他自己和别人的所有财产，唯独他自己安然无恙。回到家后，他被债主们抓住并被投入监狱，他的房子和家里所有的财物都被洗劫一空。他一无所有，除了他自己和妻子身上的衣服。这位可怜的妻子，心神大乱，处境极度艰难，只想着如何养活她的丈夫。有一天，她坐在监狱里，和丈夫一起用餐。一位显赫的男子探访监狱，分发施舍给囚犯，他留意到妻子在丈夫身旁，为她出众的美貌所倾倒，并透过狱卒转告她，让她到他那里去。她欣然走向他，希望能从他那里得到帮助。他把她带到一边，对她说：
    - type: paragraph
      text:
        ru: – Что ты тут делаешь? Зачем ты здесь?
        cn: — 你在这里做什么？你为什么在这里？
    - type: paragraph
      text:
        ru: Та рассказала ему обо всем.
        cn: 她把一切都告诉了他。
    - type: paragraph
      text:
        ru: – Если я заплачу долг, согласишься ли провести со мною эту ночь?
        cn: 「如果我偿还债务，你是否同意与我共度此夜？」
    - type: paragraph
      text:
        ru: '– Я слышала, господин мой, что Апостол сказал: жена не властна над своим телом, но муж ее, – отвечала воистину прекрасная и целомудренная жена. – Позволь, сударь, спросить мужа. Что он скажет, то я и сделаю. Вернувшись к мужу, она рассказала ему обо всем. Муж и по разуму и по любви к своей жене не польстился на возможность освобождения из-под стражи.'
        cn: ——我听闻，我主，使徒说过：妻子对自己身体没有主权，乃是她的丈夫有，——那着实美丽贞洁的妻子答道。——请允许，阁下，我问问我的丈夫。他说什么，我就做什么。回到丈夫身边，她将一切都告诉了他。丈夫因着理智和对妻子的爱，并没有被脱离监禁的机会所诱惑。
    - type: paragraph
      text:
        ru: 'Тяжко вздохнув, со слезами, он ответил жене:'
        cn: 沉重地叹了口气，含着泪水，他回答妻子说：
    - type: paragraph
      text:
        ru: '– Поди, сестра, и откажи этому человеку. Возложим все упование на Бога: Он не оставит нас до конца.'
        cn: ——你去吧，姊妹，拒绝这个人。我们将所有的盼望都寄托于上帝：祂不会撇弃我们直到末了。
    - type: paragraph
      text:
        ru: 'Жена встала и отпустила того человека, со словами:'
        cn: 妻子站了起来，放走了那个人，说道：
    - type: paragraph
      text:
        ru: – Я говорила моему мужу, и он не согласился.
        cn: – 我跟我的丈夫说过，但他不同意。
    - type: paragraph
      text:
        ru: 'В это время в той же тюрьме сидел разбойник, заключенный еще раньше купца. Подслушав разговор мужа с женою, он, глубоко вздохнув, сказал сам себе: вот какое несчастье постигло этих людей, и все-таки не захотели купить свободу ценою позора... Они предпочли целомудрие всякому богатству и все презрели в этой земной жизни... А я, несчастный, забыл совсем о Боге и не потому ли стал убийцею? О, что мне теперь сделать?'
        cn: 就在这时，在同一座监狱里，坐着一个强盗，他比那个商人更早被囚禁。偷听到丈夫与妻子的谈话后，他深深地叹了口气，对自己说：「看啊，这些人遭遇了怎样的不幸，却仍然不愿以羞辱为代价换取自由……他们宁愿选择贞洁胜过一切财富，轻蔑了这世上的一切……而我，这不幸的人，完全忘记了上帝，难道不是因此才成了杀人犯吗？哦，我现在该怎么办呢？」
    - type: paragraph
      text:
        ru: 'И, подозвав мужа и жену к себе чрез оконце, к тому месту, где был заключен, говорит им:'
        cn: 于是，他透过小窗，将丈夫和妻子叫到自己被囚禁的地方，对他们说：
    - type: paragraph
      text:
        ru: – Я – разбойник, совершивший много злодеяний и убийств. Знаю, что как только придет начальник, и я буду выведен к нему – меня казнят, как убийцу... Меня поразила в самое сердце ваша добродетель... Ступайте вон к тому месту у городской стены, раскопайте его и возьмите себе все деньги, которые найдете... Заплатите ими долги и будьте счастливы... И вспомните обо мне в молитве, чтобы и мне обрести милость... Спустя немного дней, прибывший в город правитель приказал вывести разбойника из тюрьмы и обезглавить.
        cn: – 我是一个强盗，犯下了许多恶行和杀戮。我知道，一旦长官到来，我将被带到他面前，就会像一个杀人犯一样被处死……您的美德深深打动了我的心……请您去城市围墙边上的那个地方，把它挖开，把您找到的所有钱都拿走……用它们还清债务，然后幸福地生活……并在祷告中记念我，好让我也能获得怜悯……几天之后，抵达城里的统治者下令将强盗从监狱里带出来并斩首。
    - type: paragraph
      text:
        ru: 'Через день жена говорит мужу:'
        cn: 第二天，妻子对丈夫说：
    - type: paragraph
      text:
        ru: – Не прикажешь ли, господин мой, – я пойду на то место, которое указал разбойник, и посмотрю, правду ли он говорил.
        cn: 「我的主人，您是否吩咐我，去那强盗所指的地方，看看他是否说了实话？」
    - type: paragraph
      text:
        ru: – Как знаешь – так и поступи! – отвечал муж.
        cn: ——你就按你所知道的去做吧！——丈夫回答说。
    - type: paragraph
      text:
        ru: Взяв небольшой заступ, она под вечер пришла к указанному месту и, раскопав, нашла тщательно скрытый горшок с золотом. Благоразумно распоряжаясь деньгами, она выплачивала понемногу долги. Казалось, будто она занимала то у того, то у другого, пока не выплатила всего долга и наконец, не освободила мужа.
        cn: 她拿起一把小铲子，傍晚时分来到指定地点，挖开后，找到了一个藏得很严实的金罐。她精明地管理着这些钱，一点一点地偿还债务。仿佛她一会儿向这个人借，一会儿向那个人借，直到还清了所有债务，最终使她的丈夫获得了自由。
    - type: paragraph
      text:
        ru: – Вот как они соблюли заповедь Божию, и Господь и Бог наш явил им величие Своего милосердия! – заключил рассказывавший.
        cn: ——他们就是这样遵守了上帝的诫命，我们的主和上帝向他们显明了祂宏伟的慈悲！——讲述者总结道。
  - type: heading2
    initial:
      ru: '190.'
      cn: '190.'
    text:
      ru: Чудо, явленное чрез авву Вроха египетского.
      cn: 奇迹，藉着埃及的阿爸弗罗赫所显现的。
    children:
    - type: paragraph
      text:
        ru: 'В Селевкии, близ Антиохии жил авва Врох египетский. Вот что рассказал нам о нем Афанасий Антиохийский: вне города нашел он пустынное место и решился устроить себе там небольшую келлию. Келлию то устроил, но у него не было дерева, чтобы покрыть ее. Придя однажды в город, он встретил там одного из богатых граждан Селевкии Анатолия, по прозванию «Кривой». Он сидел у своего дома. Подойдя к нему, старец сказал:'
        cn: 在安提阿附近的塞琉西亚，住着一位埃及的阿爸弗罗赫。以下是安提阿的阿萨纳西奥斯向我们讲述的关于他的事迹：他在城外找到了一处荒芜之地，并决定在那里为自己建造一个小室（凯利娅）。小室建成了，但他没有木材来覆盖它。有一天，他来到城里，在那里遇到了塞琉西亚的一位富有的市民，名叫阿纳托利奥斯，绰号「跛子」。他正坐在自己家门口。长者走到他跟前说：
    - type: paragraph
      text:
        ru: – Сделай милость – дай мне небольшое дерево – покрыть мое жилище.
        cn: – 请你行个善 – 给我一棵小树 – 遮盖我的住所。
    - type: paragraph
      text:
        ru: 'Но тот с гневом ответил:'
        cn: 那人却怒气冲冲地回答说：
    - type: paragraph
      text:
        ru: – Вот дерево! Ну-ка подними, да и уходи...
        cn: – 看，这棵树！来，把它拾起来，然后就走吧……
    - type: paragraph
      text:
        ru: При этом он указал ему на огромное бревно, лежавшее перед домом. Бревно было приготовлено для грузового корабля вместимостью в пятьдесят тысяч (модий).
        cn: 与此同时，他指给他看一根躺在屋前的巨大圆木。这根圆木是为一艘容量为五万（莫迪）的货船预备的。
    - type: paragraph
      text:
        ru: – Благослови, и я подниму его, – сказал авва Врох.
        cn: ——赐福吧，我就把它举起来，——亚巴·弗罗赫说。
    - type: paragraph
      text:
        ru: – Благословен Господь! – сказал Анатолий с прежним гневным выражением.
        cn: – 愿主受赞美！– 阿纳托利带着他那先前愤怒的神情说道。
    - type: paragraph
      text:
        ru: Взявшись за бревно, старец один поднял его с земли и взвалил на плечо. Потом отправился к своей келии. Пораженный дивным чудом, Анатолий подарил старцу огромное бревно для его надобности. Старец не только покрыл свою келлию, но исправил и много других нужд в своем монастыре.
        cn: 长老独自一人抓住一根圆木，将其从地上举起并扛在肩上。然后他动身前往自己的隐修室。被这奇妙的奇迹所震惊，阿纳托利赠予长老一根巨大的圆木供他所需。长老不仅盖好了自己的隐修室，而且还解决了他在修道院里的许多其他需求。
  - type: heading2
    initial:
      ru: '191.'
      cn: '191.'
    text:
      ru: Черты из жизни св. Иоанна Златоуста.
      cn: 圣约翰·金口生平特点
    children:
    - type: paragraph
      text:
        ru: 'Нам говорили о св. Иоанне Константинопольском, справедливо получившем прозвание Златоустого за изящество и блеск его учительского красноречия: после крещения – он никогда не произносил клятвы и не побуждал никого к клятве, никогда не сказал лжи, избегал шуток и не позволял другим шутить (в своем присутствии).'
        cn: 有人告诉我们，关于圣约翰·君士坦丁堡（因其训诲性雄辩的优美与辉煌，理所当然地获得了「金口」的称号）：在受洗之后，他从不宣誓，也不劝使任何人宣誓；从不撒谎；避免说笑，也不允许他人在自己面前说笑。
  - type: heading2
    initial:
      ru: '192.'
      cn: '192.'
    text:
      ru: Рассказ об иноке обители св. папы Григория, получившем по смерти разрешение от осуждения.
      cn: 关于圣教宗格里高利修道院一位修士的故事，他死后从定罪中获得了解除。
    children:
    - type: paragraph
      text:
        ru: 'Один пресвитер, по имени Петр, придя из Рима, рассказывал нам о св. папе Григории: сделавшись папою, он основал многолюдный монастырь, и дал такой устав, чтобы никто из иноков не имел ни малейшей собственности, – даже ни одного обола. Один из братии монастыря имел брата мирянина и просил его, говоря:'
        cn: 一位名叫彼得的长老从罗马而来，给我们讲述关于圣教宗格里高利的事：在他成为教宗后，他建立了一个修士众多的修道院，并制定了这样一条规章，规定任何修士都不得拥有丝毫财产——甚至连一个奥玻勒也不可以。修道院里的一位修士有一个平信徒兄弟，并请求他，说道：
    - type: paragraph
      text:
        ru: – У меня нет исподнего платья. Сделай милость, купи мне.
        cn: 我没有衬裙。做做好事，给我买一件。
    - type: paragraph
      text:
        ru: – Вот три номисмы, – отвечал тот. – Купи себе сам, что тебе будет угодно. Монах взял три монеты, пошел и сказал о том игумену. Игумен доложил об этом его святейшеству – папе. Блаженный Григорий отлучил монаха от св. Причащения, как нарушителя монастырского устава. Спустя немного времени отлученный брат скончался, и папа не знал о том. Прошло два или три дня. Игумен отправился к папе и возвестил ему о кончине брата. Папа был очень огорчен тем, что не разрешил брата пред его кончиной от епитимии отлучения. Написав (разрешительную) молитву на листе, он поручил одному из архидиаконов идти и прочитать ее над умершим. То – была молитва, разрешающая брата от кары отлучения. Согласно повелению, архидиакон прочитал грамоту папы над умершим. И вот в ту же ночь игумен видит во сне умершего.
        cn: '——那人回答说：「这是三枚诺米斯马币。你自己去买你喜欢的东西吧。」修士拿了这三枚钱币，就去把这事告诉了修道院院长。院长将此事禀报了他的圣座——教宗。蒙福的格里高利将修士逐出圣餐礼，因为他违反了修道院规章。


          过了一小段时间，被逐出的修士去世了，而教宗对此一无所知。两三天过去了。院长前往拜见教宗，并告知他修士已离世的消息。教宗对此深感悲伤，因为他没能在修士临终前解除其被逐出教会的惩罚。他写了一份（赦免）祷文在一张纸上，吩咐一位总执事去在已故修士身上宣读这份祷文。那是一份祷文，旨在解除修士被逐出教会的惩罚。遵照吩咐，总执事在已故修士身上宣读了教宗的谕令。就在当晚，院长在梦中见到了那位已故的修士。'
    - type: paragraph
      text:
        ru: – Где ты был доселе? – спросил игумен.
        cn: —— 你此前都在哪里？—— 修道院院长问道。
    - type: paragraph
      text:
        ru: – Поистине, господин, в темнице. И до вчерашнего дня не был освобожден.
        cn: – 实在是，先生，在牢里。并且直到昨天都未被释放。
    - type: paragraph
      text:
        ru: Тогда стало известно всем, что умерший был освобожден от отлучения в тот самый час, как архидиакон прочел над его могилою разрешительную молитву, а вместе с тем душа его избавилась от осуждения.
        cn: 那时，众人都知道了，就在总执事在他的墓前诵读了赦罪祷文的同一时刻，亡者便得以脱离革除教籍，与此同时，他的灵魂也得以摆脱定罪。
  - type: heading2
    initial:
      ru: '193.'
      cn: '193.'
    text:
      ru: Дивный поступок св. Аполлинария с богатым юношей, впавшим в нищету.
      cn: 圣阿波利纳里与陷入贫困的富家青年的奇妙事迹。
    children:
    - type: paragraph
      text:
        ru: 'Вот какой рассказ слышали о папе Александрийском св. авве Аполлинарии: он был очень милостив и сострадателен. Вот пример. В Александрии был один юноша, сын знаменитых родителей. После своей смерти они оставили ему большое состояние – в кораблях и в большом количестве золота. Юноша плохо распоряжался своим состоянием, все потерял и впал в крайнюю бедность, не имея даже ничего для пропитания. Не то, чтобы он растратил на излишества, нет – кораблекрушения разорили его. И стал он из великих малым, по слову псалмопевца:«восходят до небес и нисходят до бездн»(Псал. 106, 26). Так и юноша – всех превосходил богатством, а теперь стал ниже всех по своей бедности. Узнал обо всем этом блаженный Аполлинарий. Видя юношу в таком затруднительном положении и бедности, вспомнив и его родителей, как они были богаты, пожелал оказать ему милость и подать хотя небольшую помощь для пропитания, но, недоумевал, как бы это устроить, не оскорбляя молодого человека. Всякий раз, как только видел его, папе больно было до глубины души, при виде грязной одежды и печального вида юноши – этих признаков крайней бедности. И забота о юноше не покидала папу. Однажды, как бы по вдохновению свыше, он придумал удивительное средство, вполне достойное его святости. Призвав к себе расходчика св. Церкви, он наедине сказал ему:'
        cn: '人们曾听闻关于亚历山大教宗圣阿波利纳里（Apollinarius）的这样一个故事：他非常仁慈且富有同情心。这是一个例子。


          在亚历山大有一个年轻人，是显赫家庭的后代。他的父母去世后，给他留下了一笔巨额遗产，包括船只和大量的黄金。这年轻人没有好好管理自己的财产，失去了一切，陷入了极度贫困，甚至没有任何赖以糊口的东西。并非是他挥霍浪费在奢靡之中，不——而是海难使他破产了。于是他从显赫变得卑微，正如诗篇作者所说：「他们上到诸天，下到深渊」（诗篇 106:26）。这年轻人也是如此——曾以财富超越众人，而今却因贫困而变得比所有人都低微。


          蒙福的阿波利纳里得知了这一切。看到年轻人处于如此困境和贫困之中，又回想起他的父母曾是何等富有，他希望能向他施以仁慈，并提供一些即使是微薄的食物援助，然而，他犹豫不决，不知如何安排此事才不致冒犯这个年轻人。每当他看到这年轻人，看到他肮脏的衣裳和悲伤的神情——这些极度贫困的迹象——教宗内心深处都感到痛苦。对这年轻人的关怀从未离开过教宗。一天，仿佛受到上天的启示，他想出了一个奇妙的方法，完全配得上他的圣洁。他召来圣教会的财务主管，私下对他说：'
    - type: paragraph
      text:
        ru: – Можешь ли ты сохранить одну мою тайну?
        cn: – 你能保守我的一个秘密吗？
    - type: paragraph
      text:
        ru: – Надеюсь, владыко, на Сына Божия, – отвечал тот. –  Если повелишь, не скажу никому, и никто не будет знать того, что ты доверишь рабу твоему.
        cn: 那人回答说：「主教大人，我仰望上帝之子。如果你吩咐，我不会告诉任何人，也没有人会知道你将托付给你仆人的事。」
    - type: paragraph
      text:
        ru: – Ступай, – сказал папа, – и напиши заемное письмо в пятьдесят фунтов золота, как бы от лица св. Церкви, на имя Макария, отца известного юноши. Чтобы все было в порядке – и свидетели и условия – и принеси лично ко мне.
        cn: – 去吧， – 神父说， – 写一份五十磅黄金的借据，仿佛是代表圣教会出具的，写给马卡里奥斯，就是那位知名青年的父亲。为了使一切妥当——证人和条件都齐全——然后亲自带给我。
    - type: paragraph
      text:
        ru: Получив такое повеление, расходчик немедленно изготовил заемное письмо и вручил папе. Но со смерти отца юноши прошло уже лет десять, а, может быть, и более, между тем грамота имела совсем свежий вид.
        cn: 接到这样的命令，管家立刻准备了一张借据，递交给那位父亲。然而，那少年的父亲去世已经十年了，或许更久了，但这份文书看起来却十分崭新。
    - type: paragraph
      text:
        ru: 'Папа сказал расходчику:'
        cn: 教父对管事说：
    - type: paragraph
      text:
        ru: – Ступай-ка, господин расходчик, запрячь грамоту в пшеницу или в ячмень и чрез несколько дней принеси ко мне. Тот исполнил это и в назначенное время принес грамоту папе.
        cn: ——去吧，司库先生，把这份文书藏在小麦里，或者藏在大麦里，然后几天之后把它带给我。他照办了，并在指定的时间把文书带给了教宗。
    - type: paragraph
      text:
        ru: 'Папа сказал:'
        cn: 教宗说：
    - type: paragraph
      text:
        ru: '– Ну, теперь ступай и скажи молодому человеку: сколько ты мне дашь, если я тебе доставлю один документ, который принесет тебе большую пользу? Только смотри – не бери с него больше трех номисм. И отдай ему документ.'
        cn: 「好，现在你去告诉那个年轻人：『如果我给你一份能给你带来巨大益处的文件，你愿意给我多少钱？』但记住——不要向他索取超过三诺米斯玛。然后把文件给他。」
    - type: paragraph
      text:
        ru: – Владыко, – ответил расходчик, – да я и ничего не возьму с него, если повелишь.
        cn: 「主教大人，」管家回答道，「如果您吩咐，我分文不从他那里收取。」
    - type: paragraph
      text:
        ru: – Нет, я непременно хочу, чтобы ты взял три номисмы.
        cn: – 不，我坚决要你收下三枚诺米斯马。
    - type: paragraph
      text:
        ru: Расходчик отправился к молодому человеку.
        cn: 司库前往那位年轻人那里。
    - type: paragraph
      text:
        ru: – Что ты мне дашь за одну вещь, которая облагодетельствует тебя?
        cn: ——你给我什么，来换取一件会造福你的东西呢？
    - type: paragraph
      text:
        ru: 'Тот соглашался на все, чего бы он ни пожелал. Тогда расходчик, придумав заранее, говорит юноше:'
        cn: 那人无论想要什么，他都同意了。于是，那位管事事先想好了，对年轻人说：
    - type: paragraph
      text:
        ru: – Пять или шесть дней тому назад, перебирая в доме бумаги, я нашел вот это заемное письмо и припомнил, что Макарий, отец твой, относясь ко мне с полным доверием, оставил у меня его на несколько дней, но он умер – и вот случилось так, что оно пролежало у меня до нынешнего дня. Оно совсем выпало у меня из головы, и мне не пришло на ум отдать его тебе.
        cn: ——五六天前，我在家整理文件时，发现了这张借据，便想起来你父亲马卡里，他完全信任我，把它放在我这里几天，可是他去世了——结果它就一直在我这里放到了今天。我完全把这事忘了，也没想到要把它交给你。
    - type: paragraph
      text:
        ru: – Что же ты желаешь получить за него?
        cn: ——那你想要得到什么呢？
    - type: paragraph
      text:
        ru: – Три номисмы.
        cn: – 三诺米斯马。
    - type: paragraph
      text:
        ru: – А состоятельно ли то лицо, за которым числится долг?
        cn: ——那么，那个负有债务的人是否有偿付能力呢？
    - type: paragraph
      text:
        ru: – Без сомнения! И состоятельно и милостиво, и ты без всякого затруднения можешь получить долг.
        cn: – 毫无疑问！并且（他/它）既富有又仁慈，你毫无困难地就可以得到那笔债。
    - type: paragraph
      text:
        ru: – Видит Бог, – у меня теперь ничего нет. Но если отдадут мне, я тебе дам и больше трех номисм, если пожелаешь.
        cn: ——上帝看见，——我现在一无所有。但如果他们还给我，如果你愿意，我甚至会给你超过三枚诺米斯马。
    - type: paragraph
      text:
        ru: Тогда расходчик вручил ему заемное письмо в пятьдесят фунтов золота. Получив документ, молодой человек является к св. папе. Поклонившись, он подает ему вексель. Папа взял, прочитал и сделал вид, будто смутился.
        cn: 于是司库递给他一张五十磅黄金的借据。收到这份文件后，青年人来到圣教宗面前。鞠躬后，他将汇票呈给教宗。教宗接过，读了，并且装作好像感到困窘。
    - type: paragraph
      text:
        ru: – А где ты был до сих пор? – спросил он юношу. –  Отец твой умер уже более десяти лет. Ступай-ка, сударь мой, я тебе не дам никакого ответа.
        cn: ——你到现在都在哪里？——他问那青年。——你的父亲已经去世十多年了。走吧，我的先生，我不会给你任何答复。
    - type: paragraph
      text:
        ru: '– Поверь мне, владыко, у меня его и не было. Оно хранилось у расходчика. А я и не знал. Дай Бог ему здоровья – он только что отдал его мне со словами: «Перебирая бумаги, я нашел его».'
        cn: ——主教大人，请您相信我，我根本就没有那东西。它一直由管事保管着。而我根本不知道。愿上帝赐他健康——他刚刚把它交给我，并说道：「整理文件时，我找到了它。」
    - type: paragraph
      text:
        ru: 'Папа, отослал юношу, проговорив:'
        cn: 教宗打发走了少年，说道：
    - type: paragraph
      text:
        ru: – Я подумаю. А бумагу оставил у себя. Чрез неделю молодой человек приходит к папе. Папа снова начинает укорять его.
        cn: ——我会考虑的。但他把那张纸留在了自己这里。一周后，这个年轻人来到教父那里。教父又开始责备他。
    - type: paragraph
      text:
        ru: – Зачем ты медлил представить бумагу?
        cn: 你为何延迟提交这份文件？
    - type: paragraph
      text:
        ru: По его виду можно было заметить, что он не желает отдать ему даже сколько-нибудь.
        cn: 从他的神情可以看出，他丝毫也不愿给他。
    - type: paragraph
      text:
        ru: – Владыко, – сказал молодой человек, – видит Бог – у меня нет ничего, нечем кормить даже семью. Если Бог наставит вас, сжальтесь надо мною.
        cn: ——恩主，——年轻人说，——上帝知道，我一无所有，甚至连家人都养不活。如果上帝指引您，就怜悯我吧。
    - type: paragraph
      text:
        ru: 'Делая вид, будто уступает его мольбам, св. Аполлинариии сказал ему:'
        cn: 假装顺从他的恳求，圣阿波利纳里对他说：
    - type: paragraph
      text:
        ru: – Я заплачу тебе полностью. Только прошу тебя, брат, ты уж не требуй от св. Церкви процентов.
        cn: 我会全额支付你。只是求你，弟兄，你可不要向圣教会索要利息。
    - type: paragraph
      text:
        ru: 'Молодой человек бросился ему в ноги:'
        cn: 青年人扑倒在他脚下：
    - type: paragraph
      text:
        ru: – Все, что повелишь и пожелаешь, владыко мой – все исполню. И если пожелаешь убавить и самую сумму, убавь.
        cn: ——凡是你所命令和意愿的，我的主宰——我必全部遵行。而如果你意愿减少，甚至连这笔款项本身，就减少吧。
    - type: paragraph
      text:
        ru: – Этого не сделаю. С меня довольно и того, что ты уступаешь нам проценты.
        cn: – 我不会那样做。你已经把利息让给我们了，这对我来说就足够了。
    - type: paragraph
      text:
        ru: Достав, папа вручил молодому человеку пятьдесят фунтов золота и отпустил его, все еще говоря и прося об уступке процентов. Вот каков тайный поступок Аполлинария, – вот прекраснейшее деяние, обнаруживающее его сострадательную душу. Между тем Бог так помог молодому человеку чрез милосердие св. мужа, что он поднялся из столь бедственного состояния и не только вернул все прежнее, но превзошел и родителей своих богатством и капиталами. Вместе с тем все это принесло ему и великую духовную пользу.
        cn: 教宗拿出五十磅黄金，递给那年轻人，让他离去，口中仍旧在谈论并恳求减免利息。这就是阿波利纳里乌斯隐秘的善行——这就是彰显他怜悯之心的最美善之举。与此同时，神借着这位圣人的慈悲，如此帮助了那年轻人，以至于他不仅摆脱了那般困苦的境况，恢复了昔日的一切，甚至在财富和资本上都超越了他的父母。与此同时，这一切也给他带来了极大的属灵益处。
  - type: heading2
    initial:
      ru: '194.'
      cn: '194.'
    text:
      ru: Совет старца из скита молодому иноку – не ходить по корчмам.
      cn: 来自隐修院的长老给年轻修士的建议——不要去酒馆。
    children:
    - type: paragraph
      text:
        ru: 'Старец один жил в скиту. Однажды придя в Александрию для того, чтобы продать свое рукоделие, увидал молодого монаха, вошедшего в корчму. Старец опечалился и остановился вне корчмы, чтобы дождаться выхода монаха и побеседовать с ним. Так и было. Лишь только молодой монах вышел, старец, взяв его за руку и отведя в сторону, стал говорить ему:'
        cn: 有一位长老住在隐修院里。一天，他来到亚历山大，为了出售他的手工艺品，看见一位年轻的修士走进了一家酒馆。长老感到忧伤，便在酒馆外停下，等待这位修士出来，以便与他谈话。事情果然如此。年轻的修士刚一出来，长老便抓住他的手，把他拉到一边，开始对他说：
    - type: paragraph
      text:
        ru: – Брат, разве ты позабыл, что ты облечен во святую одежду? Или не знаешь, что ты еще юн? Не испытал еще того, как много козней строит нам диавол? Не знаешь еще ты, как много вреда для иноков, проводящих время в городе, от того, что они здесь видят, слышат, от различных сцен городской жизни? Вот ты, без зазрения совести, ходишь по корчмам, слышишь и видишь там, чего бы не хотел, и встречаешься там с женщинами... Пристойно ли это тебе? Умоляю тебя, не делай этого, иди лучше в пустыню, где ты можешь получить спасение.
        cn: – 弟兄，难道你忘记了你身披圣服？或者你不知道你还年轻？你还没有经历过魔鬼给我们设下了多少诡计吗？难道你还不知道，对于在城中度日的修士们来说，他们所见、所闻，以及各种城市生活场景会带来多大的伤害吗？你看你，竟毫无廉耻地出入酒馆，在那里听见、看见你本不愿听见、看见的事物，还在那里与女子相遇……这对你得体吗？我恳求你，不要这样做，还是去旷野吧，在那里你可以获得救赎。
    - type: paragraph
      text:
        ru: – Ступай-ка себе, старче! Бог ничего не желает, кроме – чистого сердца, – отвечал молодой инок.
        cn: ——你去吧，老人家！上帝除了纯洁的心，别无所求，——年轻的修士回答说。
    - type: paragraph
      text:
        ru: – Слава Тебе, Господи! воскликнул старец, подняв руки к небу. Пятьдесят лет я прожил в скиту, а чистого сердца еще не стяжал, а ты, юный, шатаясь по харчевням, достиг чистоты сердца! Бог да сохранит тебя и меня да не посрамит в уповании моем! – сказал в заключение старец.
        cn: ——「荣耀归于您，主啊！」老者举手望向天空，喊道，「我在隐修院居住了五十年，但仍未获得一颗纯洁的心，而你，年轻人，却在酒馆里游荡时获得了纯洁的心！愿上帝保守你，也不叫我因我的指望蒙羞！」老者最后说道。
  - type: heading2
    initial:
      ru: '195.'
      cn: '195.'
    text:
      ru: Евагрий философ, обращенный к вере епископом Синезием
      cn: 艾瓦格利 哲学家，由主教辛涅修斯使其归信。
    children:
    - type: paragraph
      text:
        ru: 'Когда мы были в Александрии, пришел туда из Пентаполя Леонтий, апамейский уроженец, муж христолюбивый и благочестивый. В Кирене он прожил уже много лет. А в Александрию он пришел во времена св. папы Евлогия, патриарха Александрийского, в зависимости от которого находилась и кафедра Киринийская. Во время нашей беседы он рассказал: при блаженном папе Александриском Феофиле в Кирене был епископ Синезий философ. Прибыв в Кирену, он встретил там одного философа, по имени Евагрия, своего школьного товарища и искреннего друга. Но Евагрий как был, так и остался язычником и предан был идолопоклонству. Епископ Синезий желал и старался отвратить его от идолослужения, мало того – он поставил себе это целью и главной заботой – ради той любви, какую издавна питал к нему. Однако язычник не только не соглашался, – даже вовсе не желал и слушать его убеждений. Несмотря на это, епископ, побуждаемый любовью к нему, не падал духом и не переставал ежедневно наставлять, склонять и убеждать, чтобы Евагрий, уверовав во Христа, воспринял Его учение. Однажды философ даже прямо сказал епископу:'
        cn: 我们身在亚历山大时，莱昂蒂从彭塔波利斯来到那里，他是一个阿帕米亚人，爱基督又虔诚。他在昔兰尼已经居住了多年。他来亚历山大时，正值圣教宗尤洛吉——亚历山大牧首——在位时期，昔兰尼教座也受其管辖。在我们交谈时，他讲述道：在真福的亚历山大教宗提奥菲尔时期，昔兰尼有一位主教名叫西涅修斯，他也是一位哲学家。西涅修斯抵达昔兰尼后，在那里遇到了一位名叫厄瓦格里的哲学家，他是西涅修斯的同窗好友和真诚的朋友。然而，厄瓦格里仍旧是个异教徒，并且沉溺于偶像崇拜。西涅修斯主教希望并努力使他摆脱偶像崇拜，不仅如此，他甚至将此视为自己的目标和主要关切——出于他对厄瓦格里长久以来的爱。然而，这个异教徒不仅不肯同意，甚至根本不愿听他的劝说。尽管如此，主教受他对厄瓦格里的爱所激励，没有灰心，日复一日地教导、劝导和说服，希望厄瓦格里能信奉基督并接受祂的教导。有一天，这位哲学家甚至直接对主教说：
    - type: paragraph
      text:
        ru: '– Вот что, господин епископ! Из всего, чему учите вы, христиане, более всего возмущает меня то, что настанет конец этому миру, и по кончине мира все, от века жившие, люди восстанут в этой плоти, и эта плоть будет нетленною и бессмертною, – что затем настанет вечная жизнь, и каждый получит воздаяние, что оказывающий милостыню нищим дает взаймы Богу, и расточающий имущество на бедных и нищих собирает себе сокровище на небе, что вместе с вечной жизнью Христос сторицей воздаст ему в грядущем веке – все это, кажется мне, обман, насмешка, басня и пустые слова... С своей стороны епископ Синезий утверждал, что все учение христиан истинно, что в нем нет ничего ложного или чуждого истине, и старался подтвердить истину своих слов многими доказательствами. Долго епископ добивался своей цели, пока, наконец, не обратил философа в христианство и затем крестил с детьми и всеми домочадцами. Спустя немного времени, Евагрий вручил епископу три динария золотом в пользу бедных и при этом сказал:'
        cn: '——主教大人，是这样的！在你们基督徒所教导的一切事中，最使我感到愤怒的是，这个世界将有终结，并且在世界终结之后，曾世代生活过的一切人，都将在这肉身中复活，并且这肉身将是不朽坏的、不死的——接着，永生将要到来，每个人都将得到回报，施舍给穷人就是借贷给上帝，并且将财产耗费在贫穷和困苦之人身上，就是为自己积攒天上的财宝，并且连同永生，基督将在那未来的世代百倍地报答他——所有这一切，在我看来，都是欺骗、嘲弄、寓言和空话……


          主教西涅修斯则坚持认为，基督徒的一切教导都是真实的，其中没有任何虚假或与真理相悖之处，并且他努力用许多证据来证实自己话语的真实性。主教长时间地努力达到自己的目的，直到最终将这位哲学家皈依了基督教，随后为他以及他的孩子们和所有家人施洗。


          过了不久，埃瓦格里乌斯将三枚金第纳尔交给主教，用于帮助穷人，并且说道：'
    - type: paragraph
      text:
        ru: '– Прими от меня три динария, раздай бедным и дай мне удостоверительную грамоту, что Христос воздаст мне за это в будущей жизни. Взяв золото, епископ охотно дал ему грамоту, какую тот желал. Прожив несколько лет после крещения, Евагрий подвергся тяжкой болезни и почувствовал приближение смерти. Пред самой кончиной он говорил своим детям: «Когда будете хоронить меня, вложите вот эту грамоту в мои руки и с ней похороните меня». После его смерти дети исполнили его заповедь и зарыли его в могилу вместе с документом. На третий день после погребения он является ночью в сновидении епископу Синезию и говорит: «Пойди и в гробу, где я лежу, возьми свою грамоту. Я получил, что следует. Вполне удовлетворенный, я не имею более никакой претензии на тебя и в удостоверение тебя в этом я расписался на твоей грамоте». Епископ не знал, что философ был погребен с его грамотой. Призвав в то же утро сыновей философа, епископ сказал им:'
        cn: '——请从我这里收下三个第纳尔，分发给穷人，并给我一份证明文书，证明基督会在来世为此报答我。」 主教收下黄金，欣然给了他那份他所愿的文书。


          受洗数年之后，厄瓦格里乌斯身患重病，并感到死亡临近。在临终前，他对他的孩子们说：「当你们安葬我时，请把这份文书放在我手中，并与我一同下葬。」 他去世后，孩子们遵照他的遗命，将他连同那份文件一同葬入墓中。葬礼后的第三天，他夜里在梦中显现给主教希内修斯，并说：「你去到我躺卧的坟墓里，取回你的文书。我已领受了应得的。我已完全满足，不再对你抱有任何要求，为此作证，我已在你的文书上签名。」 主教并不知道这位哲士是与他的文书一同下葬的。就在当天早上，他召来了那位哲士的儿子们，主教对他们说：'
    - type: paragraph
      text:
        ru: – Что вы положили в гроб вместе с философом?
        cn: ——你们在棺材里和哲学家一起放了什么？
    - type: paragraph
      text:
        ru: – Ничего, владыка, кроме обычных погребальных одежд.
        cn: —— 没什么，主教大人，除了普通的安葬衣物。
    - type: paragraph
      text:
        ru: Они предположили, что епископ спрашивает о деньгах.
        cn: 他们以为主教在询问钱财。
    - type: paragraph
      text:
        ru: – Как!? – сказал епископ. Разве не положили вы с ним грамоты?
        cn: – 怎么会！？主教说。难道你们没有把文书与他一同放下吗？
    - type: paragraph
      text:
        ru: 'Тут они вспомнили – они никак не могли представить себе, что дело идет о грамоте – и отвечали:'
        cn: 于是他们回想起来——他们实在无法想象这事竟是关于书信的——便回答说：
    - type: paragraph
      text:
        ru: '– Точно так, владыка. Умирая, отец дал нам какую-то грамоту и сказал: «При погребении вложите мне в руки грамоту, так чтобы никто об этом не знал».'
        cn: ——正是如此，座主。这位神父临终时给了我们一份文书，并说：「安葬时，把这份文书放在我手中，不让任何人知道。」
    - type: paragraph
      text:
        ru: 'Тогда епископ рассказал им свой сон, который видел в ту ночь. Потом, взяв детей, духовенство, знатных жителей города и некоторых из простых граждан, пришел к могиле философа. Могилу разрыли, раскрыли гроб: философ лежал и держал в руках грамоту. Взяв грамоту из рук умершего, они развернули ее и нашли только что сделанную собственноручную подпись философа... . Вот что было написано: «Я, Евагрий философ, тебе, святейшему епископу господину Синезию, желаю радоваться. Я получил по твоей расписке, вполне удовлетворен и не имею никакой претензии на тебя из-за того золота, которое я дал тебе, а чрез тебя Христу Богу и Спасителю нашему». Все присутствовавшие были поражены этим и долго взывали: «Господи, помилуй!» Все прославляли Господа, творящего чудеса и подающего вечное воздаяние рабам Своим. Тот же господин Леонтий утверждал вместе с тем и то, что грамота с собственноручной подписью философа сохраняется доныне и находится в сокровищнице церкви Киренской. Всякий, вновь вступающий в свою должность, ризничий, вместе со священными сосудами, принимает и эту грамоту и бережно хранит ее. Сдавая другому, вместе с сосудами передает и грамоту в полной не поврежденности.'
        cn: '于是主教告诉了他们他当晚所见的梦。接着，他带着孩子们、神职人员、城中的显贵以及一些普通市民，来到了哲学家的墓前。墓被挖开，棺材被打开：哲学家躺卧其中，手中握着一份文书。他们从逝者手中取出这份文书，将其展开，发现上面有哲学家刚刚签下的亲笔签名……。


          文书上写着：「我，哲学家埃瓦格里乌斯，致你，最神圣的主教西奈修斯大人，愿你喜乐。我已按你的收据收讫，完全满意，并且关于我曾给你的那笔金子，借着你，也给了我们的神和救主基督，我对此不向你追究任何责任。」


          所有在场的人都为此感到震惊，并长久地呼喊：「主啊，怜悯我们！」众人颂赞主，祂行奇迹，并赐予祂的仆人们永恒的报偿。


          同样，莱翁提乌斯大人也证实，那份带有哲学家亲笔签名的文书至今仍被保存着，存放于基里奈教会的宝库中。每一位新上任的司库，连同圣器一起，都要接管这份文书并谨慎保管。移交给下一任时，连同圣器，也要将这份文书完好无损地一并移交。'
  - type: heading2
    initial:
      ru: '196.'
      cn: '196.'
    text:
      ru: Чудо происшедшее с детьми в Апамее, произнесшими во время игры слова св. возношения.
      cn: 在阿帕梅亚，孩童们在玩耍时念出圣奉献话语所显现的神迹。
    children:
    - type: paragraph
      text:
        ru: 'Бывший начальник африканской провинции Георгий, человек христолюбивый, чтивший иноков и нищелюбец, сорадовавшийся всему доброму и богоугодному, рассказал нам: на моей родине – он был родом из Апамеи, второй сирийской провинции, из города Торакса – есть местечко, лежащее в сорока милях от города, называемое Гонаг. В окрестностях селения, на расстоянии одной мили, дети пасли скот. Однажды дети, как это обыкновенно бывает в их возрасте, вздумали поиграть. Разыгравшись, они вдруг решили: «Давайте устроим собрание и отслужим обедню». Все тотчас согласились, поставили одного в чине священника, двух других произвели в диаконы. Нашли один гладкий камень и начали игру: на камне, как на жертвеннике, положили хлеб и в глиняном кувшине вино. Священник стал пред жертвенником, а диаконы – по сторонам. Священник произносил молитвы св. возношения, а диаконы махали поясами, будто рипидами. В священники избран был такой, который хорошо знал слова молитвы, так как в церкви вошел в употребление обычай, чтобы дети во время литургии стояли пред святилищем и первые, после духовенства, причащались св. Таин. В иных местах священники имеют обычай громко произносить молитвы св. возношения, почему, часто слыша, дети могли знать их наизусть. Когда все было устроено по церковному чину, прежде чем приступить к раздроблению хлеба – вдруг огонь ниспал с неба, пожрал все предложенное и совершенно испепелил самый камень, так что не осталось никакого следа ни от камня, ни от того, что приносилось на нем. При виде неожиданного явления дети в страхе замертво попадали на землю и не могли ни встать, ни закричать. Так как они не вернулись в обычное время домой – они без чувств все еще лежали на земле – родители отправились из селения узнать о причине их необычного отсутствия. После розысков они нашли их распростертыми на земле. Дети не узнавали своих родителей и ничего не отвечали на расспросы. Увидав их без чувств, родители взяли детей, каждый своего, и отвели домой. Все были в крайнем изумлении, видя детей в таком состоянии. Да и узнать что-либо нельзя было, вследствие бессознательного состояния детей. В течение целого дня их принимались не один раз спрашивать, но не добились никакого ответа. Весь день и ночь прошли в полной неизвестности относительно случившегося. Только на другой день дети понемногу стали приходить в сознание и рассказали, что они делали и что случилось. Тогда родители взяли детей и, пригласив важнейших жителей селения, пошли на место происшествия, где совершилось изумительное чудо. Там заметны еще были следы ниспавшего огня. Все, кто только слышал о происшествии и убедился своими глазами в достоверности его, поспешили в город и обо всем по порядку рассказали епископу. Епископ, удивляясь важности полученных сведений, отправился со всем клиром на место происшествия. Выслушав от детей еще раз рассказ обо всем, и увидав следы небесного огня, епископ назначил детей в иноки и на самом месте устроил знаменитый монастырь. Над местом, куда ниспал огонь, был устроен храм и поставлен св. жертвенник.'
        cn: 非洲行省的前总督格奥尔基，一位爱基督、敬重修士、爱护贫者、凡善事和蒙神悦纳之事莫不喜乐同庆的人，如此告诉我们：在我的家乡——他原籍是叙利亚第二行省阿帕米亚城中的托拉克斯——有一个地方，距城四十英里，名为戈纳格。在村庄附近，距村一英里处，孩子们正在牧放牲畜。有一天，孩子们，正如他们这个年纪的孩子们常有的那样，心生玩耍之念。玩着玩着，他们忽然决定：「咱们来举行聚会，并举行圣祭礼仪吧。」 所有人立刻同意了，推选一人充任司祭，另有两人被任命为辅祭。他们找到一块光滑的石头，便开始游戏：在石头上，如同在祭坛上，放上饼，又将酒盛在陶罐里。司祭站在祭坛前，辅祭则立于两侧。司祭诵念圣奉献祷文，辅祭们则挥舞着腰带，如同挥舞圣扇。被选作司祭的孩子，是因为他熟知祷文，因为在教会里，有一个习俗：孩子们在圣祭礼仪时，可以站在圣所前，并在神职人员之后，首先领受圣奥秘。在另一些地方，司祭们有大声诵念圣奉献祷文的习俗，因此，孩子们常常听闻，便能将它们背诵下来。当一切都按照教会的规矩布置妥当，还没来得及擘开饼——突然有火从天而降，吞噬了所有摆放之物，并将那块石头也彻底焚烧成灰，以至于石头和其上所献之物，都没有留下任何痕迹。孩子们见到这意想不到的景象，恐惧万分，如同死人般倒在地上，既不能站起，也不能呼喊。因为他们没有在平时回家——他们仍然不省人事地躺在地上——父母们便离开村庄，去探寻他们反常缺席的原因。经过一番寻找，他们发现孩子们都趴伏在地上。孩子们不认识自己的父母，对他们的询问也毫无回应。看到他们不省人事，父母们便各自抱起自己的孩子，带回家中。所有人见到孩子们这般状况，都极其震惊。并且也无法得知任何情况，因为孩子们仍处于无意识状态。一整天，人们不止一次地询问他们，但未能得到任何回答。整日整夜过去了，对于所发生之事，人们完全不知情。直到第二天，孩子们才渐渐恢复意识，并讲述了他们所做之事以及所发生的一切。于是父母们带着孩子们，并邀请了村里最重要的居民，前往事发地点，那里发生了这令人惊叹的神迹。那里仍然可见降下之火的痕迹。所有听闻此事之人，并亲眼证实其真实性者，便急忙赶往城中，向上谕详细讲述了整件事。主教对所获信息的重大性感到惊奇，便偕同全体神职人员前往事发地点。再次听孩子们讲述了所有经过，并亲眼看到天火的痕迹后，主教便将这些孩子任命为修士，并在原址建立了一座著名的修道院。在火焰降落的地方上方，建造了一座教堂，并安置了圣祭坛。
    - type: paragraph
      text:
        ru: Господин Георгий прибавил к своему рассказу, что в этом монастыре он видел одного из мальчиков. Вот о каком дивном и небесном знамении рассказал нам христолюбец Георгий!
        cn: 格奥尔基先生在他的讲述中补充说，他在这座修道院里见过一个男孩。这就是爱基督者格奥尔基给我们讲述的奇妙而属天的征兆！
  - type: heading2
    initial:
      ru: '197.'
      cn: '197.'
    text:
      ru: Рассказ Руфина о св. Афанасии и его сверстниках.
      cn: 鲁菲努斯关于圣阿塔那修及其同辈人的记述。
    children:
    - type: paragraph
      text:
        ru: Церковный историк Руфин записал из прежнего времени нечто подобное об игре детей. Повествуя о детстве св. Афанасия, этого великого борца и провозвестника истины, бодрого и творившего угодное пред Богом пастыря, говорит, что его предназначение епископскому сану получило свое начало свыше в некотором дивном предчувствии. Мы расскажем, что узнали от других, о ранних годах этого мужа, о том, каким он был в отрочестве, напомним и об его воспитании. Святой Александр, бывший папою в Александрии после Ахилла, по предсказанию св. архиепископа и священномученика Петра, осудившего нечестивого Ария, однажды взглянул на море, увидал на морском берегу игравших там по обычаю детей. Они представляли епископа и все, что по чину совершается во храме. Присмотревшись внимательно к игре детей, он увидал, что у них совершаются некоторые таинства. Пораженный этим зрелищем, он немедленно созывает духовенство и рассказывает о том, что видел. Потом послал взять и привести к нему всех детей. Дети явились. Папа спросил их, во что они играли и что при этом делали. Естественно, что ребятишки перепугались и чистосердечно рассказали обо всем по порядку, как, между прочим, они крестили некоторых, оглашенных Афанасием, которого дети поставили над собою епископом. Тогда епископ тщательно расспросил, кого дети окрестили – и узнал, что дети в точности исполнили все по чину Богослужения. После совещания со своим клиром, папа постановил – вторично не совершать крещения над теми, кто удостоился св. таинства. Относительно же Афанасия и тех, кто избраны были детьми в клирики, он поручил родителям воспитывать их в наставлении и наказании Господнем, в особенности – Афанасия, которого вскоре затем посвятил Богу. Так уже с юных лет обогащаясь благодатными дарами, состоя при епископе, он просиял впоследствии, взойдя сам на высшую степень... Пригласив к себе родителей Афанасия и тех детей, которые в игре представляли собою священников и диаконов, он, пред лицом Бога, посвятил их на служение Церкви, и с тех пор они содержались на церковные средства. Прошло немного времени. Афанасий окончил школу первоначального обучения и затем прошел полный курс словесных наук и литературы. Родители, как вверенный Богу залог, отдали его священнику, и, подобно Самуилу, он продолжал свое воспитание при храме Божием. Всякий раз, как престарелому Александру приходилось отправляться на соборы епископов, он брал с собою Афанасия, который и носил его священное облачение, – то, что по-еврейски называется – ефод. Подвиги и борьба Афанасия заЦерковьпротив еретиков были так велики, что к нему можно приложить слово писания«Аз бо скажу ему, елика подобает ему о имени Моем пострадати»(Деян. IX, 16). Во вражде к нему вся вселенная соединилась, подвиглись цари земные и царства, и воинства поднялись на него... Но он соблюл слово Божие:«...аще возстанет на мя брань, на Него аз уповаю»(Пс.26,3). Дела его столь славны, что их величие не позволяет ни о чем умолчать, и в то же время столь многочисленны, что заставляют предпочесть молчание... Разум теряется, отказываясь указать, что предпочесть и что опустить... Напомним о немногом, что относится к моей задаче – об остальном пусть гремит слава! Но и слава расскажет гораздо меньше самой правды – не может она ничего не прибавить к правде, ни изобрести чего-либо нового...
        cn: '教会历史学家鲁芬曾记载过古时儿童玩耍的类似事件。在叙述圣阿塔那修——这位伟大的斗士和真理的宣讲者，一位朝气蓬勃、行上帝所喜悦之事的好牧者——的童年时，鲁芬说，他被命定担任主教圣职的开端，源于某种奇妙的预感，来自上天的启示。我们将讲述从他人那里得知这位圣徒的早年，他的少年时代以及他的教养。


          圣亚历山大，他接替阿基拉斯在亚历山大任宗主教。按照圣大主教兼圣烈士彼得（他曾谴责邪恶的阿里乌）的预言，亚历山大有一天望向大海，看到海边有一群孩子照常在那里玩耍。他们正在扮演主教和按照礼仪在圣殿中举行的一切仪式。他仔细观察孩子们的游戏，发现他们正在举行一些圣事。他被这景象震惊，立即召集神职人员，讲述了他所看到的一切。随后，他派人把所有孩子带来见他。孩子们来了。宗主教问他们，他们在玩什么，以及在玩的时候做了什么。自然地，孩子们吓坏了，便真诚地按顺序讲述了一切，例如他们施洗了由阿塔那修（孩子们推选他作他们的主教）所带领的一些慕道者。于是这位宗主教仔细询问孩子们都给谁施了洗礼——并得知孩子们完全按照圣祭礼仪的规矩行事。在与他的圣职人员商议后，宗主教决定——对于那些已领受圣事者，不再二次施洗。至于阿塔那修以及那些被孩子们选为圣品人员的人，他嘱咐他们的父母要照着主的教训和管教养育他们，尤其是阿塔那修，宗主教随后不久就把他奉献给了上帝。如此，他自幼年起就蒙受恩典的恩赐日益丰盛，常随主教左右，后来他自己也升至更高的阶层，光芒四射……宗主教请来了阿塔那修的父母，以及那些在游戏中扮演神父和执事的孩子们，在上帝面前，他把他们奉献给教会服侍，从那时起，他们就由教会供养。


          不久，阿塔那修完成了初级学校的学业，随后又修完了全部的语文和文学课程。他的父母将他视为献给上帝的信物，把他交给了神父。他像撒母耳一样，在上帝的圣殿里继续接受教养。每当年迈的亚历山大要出席主教会议时，他都会带上阿塔那修，后者负责替他拿着圣袍——就是希伯来语中所称的「以弗得」。阿塔那修为教会与异端进行的斗争和功绩是如此伟大，以至于可以将经文中的话语引用在他身上：「我将指示他，为我的名他必须受多少的苦难」（使徒行传 9:16）。整个世界都联合起来与他为敌，地上的君王和国度都行动起来，军队也起来对抗他……但他遵守了上帝的话语：「……即便有争战兴起攻击我，我仍要倚靠祂」（诗篇 27:3）。他的事迹如此荣耀辉煌，其伟大之处不容许任何遗漏，但同时又如此之多，以至于令人宁愿选择沉默……理智为之迷失，不知该选择讲述什么，又该省略什么……我们只回顾与我任务相关的一小部分——至于其余的，就让荣耀去传颂吧！然而，即便荣耀所讲述的也远不及真相本身——它无法对真相添油加醋，也无法杜撰任何新奇之事……'
  - type: heading2
    initial:
      ru: '198.'
      cn: '198.'
    text:
      ru: Ответ св. Афанасия Александрийского на вопрос относительно силы крещения.
      cn: 圣亚大纳修（亚历山大的）对洗礼能力问题的回答。
    children:
    - type: paragraph
      text:
        ru: 'Однажды спросили св. Афанасия, папу Александрийского, можно ли считать, согласно вере и учению христианскому, крещенным того, кто, не веруя на самом деле и лишь притворяясь верующим, испросит себе крещение по каким – либо посторонним обстоятельствам? «Послушайте, – отвечал он, – что говорят старцы: когда была сильная смертность, многие без околичностей прибегали к св. крещению из страха смерти. Блаженному мученику Петру явился некто в виде ангела и сказал: «Доколе будете вы посылать сюда запечатанные мешки, но совершенно пустые, без всякого содержания внутри?» Поэтому, насколько можно заключить из слов ангела, носящие печать крещения, хотя бы и получили его в расчете на какое-либо благо, считаются крещенными».'
        cn: '有一次，有人问圣·亚他那修，亚历山大宗主教，根据基督教的信仰和教义，一个人如果实际上并不相信，只是假装相信，出于某种外在的原因求取洗礼，他是否可以被认为是受洗的？


          他回答说：「你们听听，长老们是怎么说的：当有大瘟疫时，许多人出于对死亡的恐惧，毫不犹豫地寻求圣洗礼。有人以天使的形象向蒙福的殉道者彼得显现，说：『你们还要多久才把那些盖了印的袋子送到这里来，里面却完全是空的，什么都没有呢？』因此，从天使的话中可以推断出，那些带有洗礼印记的人，即使他们接受洗礼是期望获得某种好处，仍然被认为是受洗的。」'
  - type: heading2
    initial:
      ru: '199.'
      cn: '199.'
    text:
      ru: Рассказ о простом старце, вразумленном людьми, а не ангелами, которых он видел.
      cn: 关于一位简朴的长老的故事，他蒙受人们而非他所见天使的教诲。
    children:
    - type: paragraph
      text:
        ru: 'Один из отцов рассказывал: был старец – святой и чистый по жизни. Когда он совершал св. литургию, то видел ангелов, стоявших по правой и по левой стороне. Усвоив у еретиков чин службы, и будучи сам не сведущ в божественных догматах, он, по простоте и не злонамеренно, во время службы говорил не то, что должно, не сознавая своей ошибки. По Промыслу Божию, к нему пришел один брат, сведущий в догматах. Старцу пришлось при нем совершать литургию. И сказал ему брат – он был в сане диакона: «Отче, то, что ты сказал во время священнодействия, несогласно с православной верой, но заимствовано у еретиков». Старец, при виде ангелов, предстоящих священнодействию, не обратил никакого внимания на слова брата. Но диакон не переставал утверждать: «Ошибаешься, старче! Не принимает этогоЦерковь...» При этих укоризнах и обличениях, которым он подвергался от диакона, старец, увидав по обычаю ангелов, спросил их:'
        cn: 其中一位教父讲述道：有一位长老，其一生圣洁纯净。当他举行圣礼仪时，他看见天使们分立左右两旁。他从异端那里习得了礼仪的规式，而他自己对神圣教义却不甚明了，他出于单纯且并非恶意，在礼仪中说了不当说的话，却不自知其错。出于上帝的安排，有一位对教义有所了解的弟兄来到他那里。长老碰巧在他面前举行了礼仪。那弟兄对他说——他是一位执事：「父亲，你在神圣礼仪中说的话不符合正教信仰，而是从异端那里借来的。」长老看到侍立在神圣礼仪前的天使们，没有理会那弟兄的话。但执事却不停地坚持说：「你错了，长老！教会不接受这个……」面对执事对他的这些指责和规劝，长老照常看到天使们，便问他们：
    - type: paragraph
      text:
        ru: – Вот что говорит мне диакон. Правда ли это?
        cn: ——执事是这样告诉我的。这是真的吗？
    - type: paragraph
      text:
        ru: '– Послушайся его: он правильно говорит, – сказали ему ангелы.'
        cn: ——听从他：他说得对，——天使们对他说。
    - type: paragraph
      text:
        ru: – Почему же вы не сказали мне этого?
        cn: ——为什么你没有告诉我这个呢？
    - type: paragraph
      text:
        ru: – Бог так устроил, чтобы люди были исправляемы людьми же, – отвечали ангелы.
        cn: – 上帝如此安排，让人由人修正， – 天使们回答说。
    - type: paragraph
      text:
        ru: С тех пор старец исправился в службе и воздал благодарность Богу и брату.
        cn: 从此以后，长老在事奉上改正过来，并向上帝和兄弟献上了感谢。
  - type: heading2
    initial:
      ru: '200.'
      cn: '200.'
    text:
      ru: Юноша, золотых дел мастер, усыновленный вельможей за усердие в вере.
      cn: 一名少年金匠，因其在信仰上的殷勤而被一位显贵收养。
    children:
    - type: paragraph
      text:
        ru: 'Один из отцов рассказал нам: молодой человек, прекрасных дарований, поступив к золотых дел мастеру, в скором времени в совершенстве изучил свое ремесло. Один из знатных людей заказал построить золотой крест с драгоценными камнями, чтобы пожертвовать вцерковь. Хозяин поручил этот заказ молодому человеку, как весьма искусному мастеру. Он и стал размышлять: вот какое богатое пожертвование приносит Христу этот человек! Почему бы и мне не уделить из моего жалованья на этот крест? Разве Христос не примет моей жертвы, подобно двум лептам вдовицы? Рассчитав, сколько следует ему получить жалованья, он делает заем и употребляет его на крест. Между тем приходит заказчик и, свесив крест, прежде чем были вставлены камни, находит его по весу гораздо тяжелее данного им количества золота. Тогда он с угрозами начинает укорять молодого человека за то, что он прибег к обману, сделав подмесь к золоту. Юноша отвечал ему:'
        cn: 一位教父告诉我们：有一个年轻人，天赋极佳，成为一名金匠学徒后，很快就精通了他的手艺。一位贵族订制了一个镶嵌着宝石的金十字架，准备捐献给教会。师傅将这个订单交给了年轻人，因为他是一位非常熟练的工匠。年轻人便思忖道：这人给基督奉献了多么丰厚的礼物啊！我何不也从我的薪水中为这个十字架奉献一些呢？难道基督不会像接受寡妇的两文钱那样接受我的奉献吗？他计算了一下自己应得的薪水，便借了一些钱，并把这些钱用在了十字架上。此时，订制者来了，他在宝石尚未镶嵌之前称量了十字架，发现它的重量远超过他所提供的黄金量。于是他带着威胁的口吻，开始指责那个年轻人，说他行了欺诈，在黄金中掺了假。少年回答他说：
    - type: paragraph
      text:
        ru: – Единый, ведый сердечные помышления, знает, что я не сделал ничего подобного. Но видя, сколь великое пожертвование ты приносишь Христу, я решился присоединить к нему из своего жалованья, чтобы и мне иметь часть с тобою – и Христос принял и мою жертву, как две лепты вдовицы.
        cn: ——独一的、洞察人心思念的那位，知道我没有做过任何类似的事情。但我看到你献给基督如此大的奉献，我决定从我的薪水中添上一笔，好叫我也可以与你一同有份——基督也悦纳了我的献上，如同寡妇的两个小钱一样。
    - type: paragraph
      text:
        ru: – Подлинно ли так ты, чадо, и рассуждал!? – сказал пораженный словами юноши заказчик.
        cn: ——孩子，你当真就是这样思考的吗？！——被那青年言语所震惊的委托人说道。
    - type: paragraph
      text:
        ru: – Подлинно так...
        cn: – 确实如此……
    - type: paragraph
      text:
        ru: – Если ты держишься таких мыслей и всю волю свою предаешь Христу, и если ты пожелал иметь часть со мною, – сказал вельможа, – вот – отныне я усыновляю тебя и оставляю своим наследником. И действительно взял его к себе и сделал своим наследником.
        cn: ——如果你秉持这样的思想，并将你所有的意志都献给基督，并且如果你渴望与我同享一份——那位贵族说道——那么从今以后，我收养你为子，并立你为我的继承人。他确实把他接过来，并立他为自己的继承人。
  - type: heading2
    initial:
      ru: '201.'
      cn: '201.'
    text:
      ru: Юноша, которого умирающий отец вверил покрову Божию.
      cn: 青年，他的临终父亲将他交托给上帝的护佑。
    children:
    - type: paragraph
      text:
        ru: 'Вот что рассказал мне один из отцов: по некоторой надобности я прибыл в Константинополь. Сижу я в церкви, – и вот входит некто из мирян, человек знатный и христолюбивый. Увидав меня, он сел рядом со мною, и у нас завязался душеспасительный разговор. Во время беседы я сказал что те, кто хорошо распоряжаются земными благами, сподобятся и небесных.'
        cn: 一位教父曾这样告诉我：因有些事务，我来到了君士坦丁堡。我正坐在教堂里——这时，一位尊贵而爱基督的平信徒走了进来。他看见我后，便坐在我身旁，我们便开始了一段有益于灵魂的交谈。在交谈中，我说道，那些善于管理地上财富的人，也必将蒙受天上的福分。
    - type: paragraph
      text:
        ru: '– Хорошо ты сказал, отче! – отвечал он. – Блажен тот, кто уповает на Бога и всецело себя предает Ему. Вот тебе пример: я – сын одного из весьма знатных в мире. Отец мой был очень милостив и щедр и много уделял бедным. Однажды он позвал меня к себе и, показав мне все деньги, спросил: «Скажи мне, чадо, что тебе более будет угодно, оставить ли тебе деньги или Самого Господа твоим попечителем?»'
        cn: 「您说得真好，父亲！」他回答说，「凡是仰望上帝并将自己完全交托于祂的人，有福了。我给你举个例子：我是一个在世上极其显赫之人的儿子。我的父亲非常仁慈慷慨，并且施舍给穷人很多。有一天，他把我叫到身边，指给我看所有的钱，问道：『告诉我，孩子，你是更愿意选择把这些钱留给你，还是选择让主亲自作你的看顾者呢？』」
    - type: paragraph
      text:
        ru: 'Я, рассудив для себя более полезным то, чего, как видно было, желал и отец отвечал ему:'
        cn: 我，为自己思量之后，认为那对我是更有益的，并且，那显然也是父亲所期望的，便回答他说：
    - type: paragraph
      text:
        ru: '– Я желаю лучше Христа. Все это проходит: сегодня тут, а завтра – где?'
        cn: – 我宁愿要基督。这一切都会过去：今天在这里，明天又在何方呢？
    - type: paragraph
      text:
        ru: И с тех пор, как отец услышал это от меня, он без сожаления раздавал все, так что по смерти своей мне почти ничего не оставил. Став бедняком, я вел себя очень скромно, всю надежду возложив на Бога, Которому он поручил меня.
        cn: 从那时起，我父亲听了我说的这话以后，他就毫无留恋地分赠了所有财产，以至于他去世时，几乎没给我留下什么。我成了穷人以后，就过着非常简朴的生活，把所有的希望都寄托在上帝身上，我的父亲曾将我托付给祂。
    - type: paragraph
      text:
        ru: 'Был один богач и притом весьма знатный. У него была жена христолюбивая и боящаяся Бога. У них была только одна дочь. Однажды жена обратилась к мужу с такой речью: «У нас всего только одна дочь, и так много благ даровал нам Господь! Чего ей недостает? Если мы будем стараться выдать ее замуж за такого же богача, как и мы, но человека порочного – она будет несчастна весь свой век. Поищем-ка лучше для нее человека скромного и богобоязненного, чтобы он любил ее в Боге и согревал своей любовью».'
        cn: 曾有一位富翁，而且地位相当显赫。他有一位敬爱基督且敬畏上帝的妻子。他们只有一个女儿。有一天，妻子对丈夫说了这样一番话：「我们只有一个女儿，而主赐予了我们如此多的恩惠！她还缺少什么呢？如果我们竭力将她嫁给一个像我们一样富有但品行不端的人——她将一生不幸。我们不如为她寻找一个谦逊且敬畏上帝的人，好让他能在上帝里爱她，并用他的爱温暖她。」
    - type: paragraph
      text:
        ru: '– Правильно ты рассудила, – отвечал муж. – Ступай вцерковь, помолись усердно и потом сядь там: кто первый войдет, тот и будет избранник, посланный Самим Богом.'
        cn: ——你判断得很对，——丈夫回答说，——去教堂，恳切地祷告，然后坐在那里：第一个进来的人，就是蒙拣选者，蒙神亲自差派而来的。
    - type: paragraph
      text:
        ru: 'Она так и сделала. Помолилась и сделала – и вот я первый вхожу... Она тотчас посылает за мною раба и начинает расспрашивать:'
        cn: 她就这样做了。祷告之后就照做了——于是我第一个走了进去……她立刻差遣仆人来叫我，并开始询问：
    - type: paragraph
      text:
        ru: – Откуда ты?
        cn: – 你从哪里来？
    - type: paragraph
      text:
        ru: – Я живу здесь же, в этом городе, и сын такого-то.
        cn: ——我就住在这个城市里，并且是某某人的儿子。
    - type: paragraph
      text:
        ru: – Того, кто был так милостив к бедным?  Женат ли ты?
        cn: – 那个对穷人如此仁慈的人吗？你结婚了吗？
    - type: paragraph
      text:
        ru: – Нет.
        cn: – 不。
    - type: paragraph
      text:
        ru: 'Потом я передал ей свой разговор с отцом. И тогда она, воздав хвалу Богу, воскликнула:'
        cn: 我随后向她转述了我与神父的谈话。于是她向上帝献上赞美，惊呼道：
    - type: paragraph
      text:
        ru: – Вот твой добрый Попечитель, Которого ты избрал себе, послал тебе жену и богатство, чтобы пользовался тем и другим в страхе Божьем. И я молю Бога, чтобы Он дал мне идти путем отца моего до конца моей жизни.
        cn: ——看啊，这就是你所拣选的良善的眷顾者，他赐予你妻子和财富，好叫你敬畏上帝地享用这两者。我祈求上帝，使他赐予我能走我父亲的道路，直到我生命的尽头。
  - type: heading2
    initial:
      ru: '202.'
      cn: '202.'
    text:
      ru: Жизнь раба Божия Авивы.
      cn: 上帝的仆人阿维瓦的生平。
    children:
    - type: paragraph
      text:
        ru: 'Один из отцов рассказал нам: у некоего мирянина был сын, отличавшийся благочестием, целомудрием и воздержанием во всем. Вина он не пил с самых ранних лет. Его душа стремилась к отшельнической жизни, между тем отец хотел его пристроить к какому-нибудь делу, Но сын не соглашался на это. Между братьями он был старшим. Так как взгляды и стремления отца и сына расходились, то отец постоянно укорял его, ставя ему в порок самое его воздержание. «Ты бы взял пример хоть с братьев своих и принялся бы за дело», – говорил отец. Сын все переносил молчаливо. Между тем все, знавшие его, любили его за благочестие и скромность. Приблизилась кончина отца. Некоторые родственники и близкие друзья, вообразив, что отец ненавидит своего старшего сына, так как часто порицал его, собрались и рассуждали между собою: «Как-бы отец не лишил наследства этого раба Божия. Пойдем, попросим за него». А старик был богат. Вот приходят к умирающему и говорят:'
        cn: 一位教父告诉我们：有一位平信徒，他的儿子在虔诚、贞洁和一切事上的节制方面都与众不同。从幼年起，他就不饮酒。他的灵魂向往独修生活，然而父亲却想让他找个营生，但儿子不同意。在兄弟中他是长子。因为父子二人的看法和志向不合，所以父亲就不断地责备他，甚至将他的节制本身当作缺点来指摘。「你应该向你的兄弟们学习，并且去干点事，」父亲说。儿子默默地忍受这一切。然而，所有认识他的人都因他的虔诚和谦逊而爱他。父亲的死期临近了。一些亲属和亲密的朋友，以为父亲憎恨他的长子，因为他经常斥责他，于是聚集起来彼此商议：「生怕父亲会剥夺这位上帝仆人的继承权。我们去替他求情吧。」而这位老人很富有。于是他们来到弥留之际的老人面前，并且说：
    - type: paragraph
      text:
        ru: – Мы имеем нечто попросить у тебя.
        cn: ——我们有件事要向你请求。
    - type: paragraph
      text:
        ru: – В чем же состоит ваша просьба? – спросил тот.
        cn: 「您的请求究竟是什么？」那人问道。
    - type: paragraph
      text:
        ru: – О господине Авиве – как-бы ты его не забыл в своем завещании, – говорят.
        cn: ——关于阿维夫先生——你可别在你的遗嘱里把他忘了——他们说。
    - type: paragraph
      text:
        ru: Старшего сына звали Авивом.
        cn: 长子名叫亚比夫。
    - type: paragraph
      text:
        ru: – Это вы за него-то простите меня?
        cn: – 难道您是为了他才原谅我吗？
    - type: paragraph
      text:
        ru: – Да...
        cn: ——嗯……
    - type: paragraph
      text:
        ru: – Позовите-ка его ко мне.
        cn: ——把他叫到我这里来。
    - type: paragraph
      text:
        ru: Все думали, что он начнет его бранить по обыкновению.
        cn: 大家都以为他会照例开始责骂他。
    - type: paragraph
      text:
        ru: 'Когда явился старший сын, отец сказал ему:'
        cn: 长子出现时，父亲对他说：
    - type: paragraph
      text:
        ru: – Подойди ко мне.
        cn: ——到我这里来。
    - type: paragraph
      text:
        ru: Когда тот подошел, отец бросился к ногам его со слезами.
        cn: 当那人走近时，父亲含着泪扑倒在他脚前。
    - type: paragraph
      text:
        ru: – Прости меня, чадо, – восклицал умирающий, – и молись за меня Богу, чтобы простил меня, если я чем-либо огорчил тебя... Ты искал Христа, а я предавался мирским заботам.
        cn: 垂死之人呼喊道：「孩子，请宽恕我，并为我向神祷告，求祂赦免我，如果我曾因任何事使你忧伤……你寻求基督，而我却沉溺于世俗的挂虑中。」
    - type: paragraph
      text:
        ru: 'Потом зовет к себе других сыновей и, указав на старшего брата, говорит:'
        cn: 然后他召集了其他的儿子到他身边，指着他们的大哥说：
    - type: paragraph
      text:
        ru: '– Вот вам господин и отец! Скажет он вам: вот ваше – и будет ваше. Скажет: нет вам ничего – и ничего не будет у вас!'
        cn: ——这位是你们的主和父！他会对你们说：『这是你们的』——它就必是你们的。他会说：『你们什么也没有』——你们就必什么也没有！
    - type: paragraph
      text:
        ru: 'Все были поражены этим. Отец тут же скончался. По кончине отца, старший брат отдал братьям каждому, что следовало из наследства. Получив свою часть, Авив все роздал бедным, не оставив себе ничего, потом приступил к устройству келлии и, окончив работу, заболел. Кончина быстро приближалась... Один из братьев навестил его. Больной сказал брату:'
        cn: 所有人都对此感到震惊。父亲随即去世了。父亲去世后，大哥把每个兄弟应得的遗产份额分给了他们。阿维夫拿到自己那一份后，便将所有的一切都分给了穷人，自己什么也没留下，然后便着手建造自己的隐修小屋，工作完成后，他病倒了。临终之时迅速临近了……他的一位兄弟探望了他。病人对兄弟说：
    - type: paragraph
      text:
        ru: – Ступай и устрой утешение своей семье – теперь великий день...
        cn: ——去吧，为你的家人带来安慰——现在是个伟大的日子……
    - type: paragraph
      text:
        ru: А был праздник св. Апостолов.
        cn: 而当时是圣使徒的节期。
    - type: paragraph
      text:
        ru: – Как же мне уйти и оставить тебя одного? – спросил брат.
        cn: ——我怎能离开，把你一个人留下呢？——兄弟问道。
    - type: paragraph
      text:
        ru: – Ступай... Придет час мой – я позову тебя, – ответил больной.
        cn: ——你去吧……我的时刻将到——我将呼唤你，病人答道。
    - type: paragraph
      text:
        ru: В самом деле, когда настал час смерти, Авив привстал и, постучав в окно, дал знать брату.
        cn: 事实上，当死亡时刻来临之际，阿维夫微微起身，并敲了敲窗户，告知了他的兄弟。
    - type: paragraph
      text:
        ru: – Приди сюда!
        cn: – 过来！
    - type: paragraph
      text:
        ru: Брат немедленно пришел, и Авив предал дух свой Господу. И все удивились и прославили Бога.
        cn: 兄弟立刻来了，阿维夫便将自己的灵交托给主。所有人都感到惊奇，并荣耀了神。
    - type: paragraph
      text:
        ru: – Вот какой кончины сподобился он, – кончины, достойной той любви, какою он возлюбил Христа! – говорили все.
        cn: ——他蒙受了这样的临终啊——一个配得上他爱基督的那份爱的临终！——众人说道。
  - type: heading2
    initial:
      ru: '203.'
      cn: '203.'
    text:
      ru: Рассказ о ювелире.
      cn: 珠宝商的故事。
    children:
    - type: paragraph
      text:
        ru: 'Вот рассказ одного из отцов: был один ювелир. У него было много драгоценных камней и жемчуга. Однажды он сел с детьми на корабль, чтобы отправиться на чужую сторону и там заниматься своим ремеслом и торговлею. По устроению Божию, на корабле он полюбил одного мальчика, который прислуживал ему, за что и получал помощь от купца питаясь от стола его. Однажды мальчик слышал, как матросы шептались между собою и уговаривались бросить ювелира в море, чтобы овладеть его камнями. Войдя по обычаю к ювелиру для услуг, мальчик не мог скрыть своей скорби.'
        cn: '这是一个圣教父的讲述：


          有一位珠宝匠。他有许多宝石和珍珠。有一次，他带着孩子们上了一艘船，为了前往异乡，并在那里从事他的手艺和贸易。按照上帝的安排，在船上他喜欢上了一个男孩，这个男孩伺候着他，因此也从这位商人那里得到帮助，靠他的供养。有一天，男孩听见水手们窃窃私语，商议着要把珠宝匠扔到海里，以夺取他的宝石。按照惯例，男孩走进珠宝匠那里为他服务时，无法掩饰他的悲伤。'
    - type: paragraph
      text:
        ru: – Что ты, молодец, сегодня так грустен? – спросил купец.
        cn: ——小伙子，你今天怎么如此忧伤？——商人问道。
    - type: paragraph
      text:
        ru: Мальчик, подавляя скорбь, молчал.
        cn: 男孩，压抑着悲伤，沉默不语。
    - type: paragraph
      text:
        ru: – В самом деле, – скажи-ка мне, что с тобой? – расспрашивал купец.
        cn: ——说真的，你告诉我，你到底怎么了？——商人询问说。
    - type: paragraph
      text:
        ru: 'Тогда мальчик, разразившись плачем, сказал:'
        cn: 于是男孩放声大哭，说道：
    - type: paragraph
      text:
        ru: – Вот так и так уговорились поступить с тобой...
        cn: – 如此这般，他们商议定了要待你...
    - type: paragraph
      text:
        ru: – И это верно? – спросил купец.
        cn: ——这确实是这样吗？——商人问道。
    - type: paragraph
      text:
        ru: – Да, так они решили между собой...
        cn: – 是的，他们就是这样在彼此之间决定的……
    - type: paragraph
      text:
        ru: 'Тогда купец зовет детей и говорит им:'
        cn: 然后商人叫孩子们，并对他们说：
    - type: paragraph
      text:
        ru: – Что бы я ни сказал вам, исполняйте немедленно и без всяких рассуждений.
        cn: – 无论我告诉你们什么，你们都要立刻遵行，并且毫无思量。
    - type: paragraph
      text:
        ru: 'Потом, развернув полотно, говорит им:'
        cn: 然后，他展开了布，对他们说：
    - type: paragraph
      text:
        ru: – Принесите мне ларцы!
        cn: – 给我拿来匣子！
    - type: paragraph
      text:
        ru: 'Те принесли. Раскрыв ларцы, начал вынимать и раскладывать камни на полотне. Вынув все, он начал говорить:'
        cn: 他们带来了。打开匣子后，他便开始取出石头，并把它们铺在布上。取出所有石头后，他便开口道：
    - type: paragraph
      text:
        ru: – Так вот от чего зависит моя жизнь? И ради этих-то камней я подвергаюсь опасностям и бурям на море и даже должен подвергнуться близкой смерти, не взяв с собой ничего из этого мира!? Бросайте все в море! – крикнул он детям.
        cn: ——那么，我的生命竟取决于此吗？竟是为了这些石头，我在海上冒着危险和风暴，甚至必须面临近在咫尺的死亡，却无法带走这世上的任何东西！？ 把所有东西都扔进海里！——他对着孩子们喊道。
    - type: paragraph
      text:
        ru: Те немедленно, по приказанию его, побросали все в море. Матросы были поражены таким поступком, – и замысел их разрушился.
        cn: 他们立即按照他的命令，把一切都扔进了海里。水手们对这样的举动感到震惊——他们的企图也破灭了。
  - type: heading2
    initial:
      ru: '204.'
      cn: '204.'
    text:
      ru: Благочестивая и богобоязненная женщина вразумляет инока.
      cn: 虔诚且敬畏上帝的女人劝诫修士。
    children:
    - type: paragraph
      text:
        ru: Рассказ одного из отцов. Один инок был укушен змеею и пришел в город лечиться. Его приняла к себе в дом благочестивая и богобоязненная женщина и стала лечить. Лишь только немного успокоилась боль у инока, диавол стал внушать ему блудные помыслы. Однажды он схватил ее за руку.
        cn: '一位教父的记述。


          一位修士被蛇咬了，来到城里求医。一位虔诚敬畏上帝的妇女将他接到家中，并开始为他治疗。修士的疼痛刚稍微平息，魔鬼就开始向他灌输淫秽的念头。有一天，他就抓住她的手。'
    - type: paragraph
      text:
        ru: – Нет, отец! – сказала женщина. – Побойся Христа! Вспомни о скорби и тяжести раскаяния, которые ты испытаешь в своей келлии, вспомни о воплях и слезах, которые предстоят тебе.
        cn: '"不，父啊！"那个女人说，"你当敬畏基督！想想你将来会在你的修道室里经历的悔恨的悲伤和沉重，想想你将要面对的哭号和眼泪。"'
    - type: paragraph
      text:
        ru: 'Вот что и многое другое говорила женщина иноку, и брань оставила его. От стыда он не мог взглянуть на женщину и хотел бежать из дому. Но женщина, почувствовав сожаление к иноку, ради Христа, сказала ему:'
        cn: 妇人对修士说了这些话，以及许多其他的话，而内心的争战也离他而去。由于羞耻，他无法直视那位妇人，并想逃离这房子。但那位妇人，为了基督的缘故，对修士心生怜悯，便对他说：
    - type: paragraph
      text:
        ru: – Не стыдись и не уходи, отец! Тебе еще надо полечиться. А то – был не помысел чистой души твоей, но козни злобного диавола.
        cn: ——不要羞愧，也不要离开，父亲！你还需要医治。要知道，那不是你纯洁灵魂的意念，而是邪恶魔鬼的诡计。
    - type: paragraph
      text:
        ru: Окончив лечение, она, без всякого соблазна, отпустила его с миром.
        cn: 结束了治疗，她不带任何诱惑地让他平安离去。
  - type: heading2
    initial:
      ru: '205.'
      cn: '205.'
    text:
      ru: Благоразумная женщина, избежавшая насилия со стороны инока.
      cn: 明智的妇人，幸免于修士的暴力。
    children:
    - type: paragraph
      text:
        ru: 'Нам рассказывали об одном брате, который, живя в киновии, был посылаем по разным ее нуждам. В одном селении жил благочестивый мирянин, который радушно принимал инока всякий раз, как тот заходил в селение. Мирянин имел единственную дочь, которая, жив с мужем один или два года, незадолго пред тем овдовела. Приходя и уходя от них, инок впал в плотскую брань... Дочь, женщина разумная, заметив это, стала остерегаться инока и избегала показываться ему на глаза. Однажды отец, по надобности, отправился в ближайший город, оставив дочь одну в доме. Как раз в это время по обычаю зашел к ним инок и, застав ее одну, спросил:'
        cn: 有人告诉我们，有一位弟兄住在一所修道院里，他常常被派去处理修道院的各种事务。在一个村庄里住着一位虔诚的平信徒，每当这位修士来到这个村庄时，他都热情地接待修士。这位平信徒有一个独生女，她与丈夫生活了一两年后，不久前成了寡妇。在往来于他们家期间，这位修士陷入了肉体的争战中……这个女儿是个明智的女子，她察觉到这一点后，便开始警惕修士，避免出现在他眼前。有一天，父亲因事前往附近的城镇，把女儿独自留在家里。正是在这个时候，修士照常来访，发现她独自一人在家，便问道：
    - type: paragraph
      text:
        ru: – А где же отец твой?
        cn: ——那么你的父亲在哪里呢？
    - type: paragraph
      text:
        ru: – Пошел в город.
        cn: ——他去了城里。
    - type: paragraph
      text:
        ru: 'Инок взволновался от плотской брани и намеревался причинить ей насилие. Но она, не потеряв присутствия духа, сказала ему:'
        cn: 修士因肉体争战而心神不安，并意欲对她施暴。但她，不失镇定，对他说：
    - type: paragraph
      text:
        ru: – Не волнуйся, не выходи из себя – отец долго еще не возвратится... Мы здесь одни... Я знаю, что вы, иноки, ничего не делаете без молитвы... Встань, помолись Богу... Что Он положит тебе на сердце, то мы и сделаем... Но инок не мог успокоиться. Страсть обуревала его...
        cn: ——不要担心，不要激动，不要失去自制——神父很久都不会回来了... 我们在这里独处... 我知道你们修士，若没有祷告，什么事也不会做... 站起来，向上帝祷告... 凡祂将感动放在你心里的，我们就照着去做... 但那修士无法平静。情欲正在吞噬他...
    - type: paragraph
      text:
        ru: – Ты, в самом деле, никогда не знал женщины? – спросила хозяйка.
        cn: ——你，真的，从来没有与女人有过亲密关系吗？——女主人问道。
    - type: paragraph
      text:
        ru: – Никогда! – отвечал инок. – И мне хочется узнать, что это такое...
        cn: ——绝不！——修士回答道。——我也想知道那是什么……
    - type: paragraph
      text:
        ru: – Потому-то ты так и взволновался, что не знаком еще с смрадом нечистых женщин... И, желая укротить страсть его, она старается внушить ему отвращение к себе.
        cn: ——就是因为如此，你才会如此激动，因为你还不曾熟悉不洁女人的恶臭……于是，为了抑制他的情欲，她努力使他对自己产生厌恶。
    - type: paragraph
      text:
        ru: – Я в периоде месячного очищения, и никто не может приблизиться ко мне без того, чтобы не обонять смрада...
        cn: ——我正值每月洁净之期，无人能靠近我而不闻到那恶臭……
    - type: paragraph
      text:
        ru: 'Такие и другие подобные речи подействовали на инока. А придя в себя, он залился слезами... Увидав, что инок успокоился, женщина говорит ему:'
        cn: 这样的言语和其他类似的话语打动了修士。当他回过神来时，他泪流满面……女人看到修士平静下来后，对他说：
    - type: paragraph
      text:
        ru: '– Вот видишь: если бы, послушавшись, я отдалась тебе, мы теперь сидели бы уже врознь, совершив грех. Какими глазами посмотрел бы ты на моего отца? Как, вернувшись в монастырь, ты мог бы слушать лик святых, воспевающих Богу? Прошу тебя – отрезвись и не стремись к тому, что может из-за минутного наслаждения погубить все твои подвиги и лишить вечных благ.'
        cn: 「你看，如果我听了你的话，把我自己交给了你，我们现在就会分开坐着，犯了罪。你将以怎样的目光看我的父亲？你回到修道院后，怎能听圣徒的歌队向上帝歌唱？我恳求你——清醒过来，不要追求那会因片刻的欢愉，毁掉你所有的苦修，并使你失去永恒的福分的事。」
    - type: paragraph
      text:
        ru: Выслушав эти речи, брат возвратился в монастырь, принес покаяние в грехе своем и воздал благодарность Богу за то, что Он чрез благоразумие и целомудрие женщины не допустил его до конечного падения. Об этом происшествии передал тому, кто рассказывал нам, сам подвергавшийся брани инок.
        cn: 听了这些话，弟兄回到修道院，为自己的罪作了忏悔，并感谢上帝，因为祂藉着这女子的明智和贞洁，没有让他最终堕落。这件事是亲自经历这场争战的修士告诉了为我们讲述故事的人的。
  - type: heading2
    initial:
      ru: '206.'
      cn: '206.'
    text:
      ru: Как знатная женщина научилась кротости.
      cn: 显赫的妇女如何学会了温柔。
    children:
    - type: paragraph
      text:
        ru: Один из отцов рассказывал нам о некоей знатной особе, из сенаторского рода. Она отправилась на поклонение св. местам. Прибыв в Кесарию, она предпочла здесь остаться и проводить жизнь в уединении.
        cn: 一位教父曾告诉我们，有一位出身元老院家族的显贵女士。她前往朝拜圣地。抵达凯撒利亚后，她选择留在此地并过隐修生活。
    - type: paragraph
      text:
        ru: – Дай мне девицу, – стала просить она епископа, – чтобы она воспитывала меня для иноческой жизни и научила страху Божию.
        cn: 「给我一个贞女吧，」她开始恳求主教，「好让她培养我过隐修生活，并教导我敬畏上帝。」
    - type: paragraph
      text:
        ru: 'Избрав одну смиренную девицу, епископ приставил к ней. Спустя немного времени, при встрече, епископ спросил:'
        cn: 主教拣选了一位谦卑的少女，对她进行了指派。不久之后，在一次会面中，主教问道：
    - type: paragraph
      text:
        ru: – Ну, что – девица, приставленная к тебе?
        cn: ——那么，怎么样——那个被指派给你的姑娘？
    - type: paragraph
      text:
        ru: – Она прекрасного поведения, – отвечала знатная женщина, –  только совершенно бесполезна для души моей, потому что представляет мне действовать по произволу. Она очень скромна, а мне нужно, чтобы бранили меня и не позволяли мне исполнять мои прихоти.
        cn: '"她品行极佳，" 那位贵妇人回答说，"只是对我灵魂毫无益处，因为她任凭我凭己意行事。她为人非常谦逊，但我需要有人责备我，并且不容许我满足我的任性。"'
    - type: paragraph
      text:
        ru: 'Тогда епископ, избрав другую, крутого нрава, приставил к ней. Та то и дело говорила ей: «Дура богатая», – или бранила ее другими подобными словами. Вскоре епископ опять спрашивал:'
        cn: 于是主教另选了一位性情严厉的女子，派去陪伴她。那位女子屡次对她说：「你这有钱的蠢货！」——或用其他类似的言语辱骂她。不久，主教又问：
    - type: paragraph
      text:
        ru: – Какова девица?
        cn: – 姑娘怎么样？
    - type: paragraph
      text:
        ru: – Вот эта воистину приносит пользу душе моей. Таким-то образом она стяжала великую кротость.
        cn: – 这确实使我的灵魂受益。就这样，她修得了极大的温柔谦卑。
  - type: heading2
    initial:
      ru: '207.'
      cn: '207.'
    text:
      ru: Девица, окрещенная ангелами.
      cn: 童贞女，由天使施洗。
    children:
    - type: paragraph
      text:
        ru: 'Авва Феона и авва Феодор рассказали нам: при патриархе Павле в Александрии осталась сиротою после смерти родителей, очень богатых людей, одна девица. Она была не крещена. Однажды вышла в сад, оставленный ей родителями. При домах знатных даже среди города есть сады. В глубине сада она увидала неизвестного человека, собравшегося удавиться. Быстро подбежав к нему, она спросила:'
        cn: 阿瓦·泰奥纳和阿瓦·泰奥多尔告诉我们：在宗主教帕维尔执政时期，亚历山大城有一位少女，她的父母是非常富有的人，在他们去世后，她成了孤儿。她没有受洗。有一天，她走到父母留给她的花园里。即使在城里，显赫人家的宅邸旁也有花园。在花园深处，她看见一个陌生人正准备上吊自杀。她迅速跑到他跟前，问道：
    - type: paragraph
      text:
        ru: – Что ты делаешь, добрый человек?
        cn: – 你在做什么，善良的人？
    - type: paragraph
      text:
        ru: – А тебе какое дело? Уйди! Я в большом горе...
        cn: ——关你什么事？走开！我身陷巨大的悲痛之中……
    - type: paragraph
      text:
        ru: – Скажи мне всю правду. Я, может быть, помогу тебе.
        cn: – 告诉我全部真相。我或许能帮助你。
    - type: paragraph
      text:
        ru: – Я много должен. Мои заимодавцы сильно теснят меня, и я предпочел скорее умереть, чем вести такую горькую жизнь.
        cn: ——我负债累累。我的债主们强力逼迫我，我宁可死去，也不愿过这种苦涩的生活。
    - type: paragraph
      text:
        ru: – Прошу тебя, вот возьми все, что у меня есть, и отдай... только не губи себя.
        cn: 「我求你，就把我所有的一切都拿走吧，都施舍出去……只是别毁了你自己。」
    - type: paragraph
      text:
        ru: 'Тот согласился на это и уплатил долги. Между тем девица оказалась в стесненном положении. И не мудрено: осталась без родителей, позаботиться о ней было некому. Придя в крайнюю бедность, она начала распутную жизнь. А те, которые знавали ее родителей, говорили: «Кто знает суды Божии, как и для чего попускается душе падать!» Молодой организм не вынес такой жизни: она заболела и – опомнилась. В сокрушении духа она просила соседей: «Ради Господа, сжальтесь над душой моей и поговорите с папою, чтобы мне стать христианкой». Но все отвернулись от нее с презрением.'
        cn: 他同意了，并偿清了债务。与此同时，这位少女陷入了困境。这不足为奇：她失去了双亲，无人照料。陷入极度贫困之后，她开始过上放荡的生活。那些认识她父母的人说：「谁能明了上帝的审判，为何以及为了什么目的，会允许一个灵魂堕落！」年轻的身体无法承受这样的生活：她生病了——然后醒悟过来。她在心灵的痛悔中恳求邻居们说：「看在主的份上，怜悯我的灵魂吧，请去和神父谈谈，好让我成为基督徒。」但所有人都轻蔑地离弃了她。
    - type: paragraph
      text:
        ru: «Кто пожелает быть восприемником такой распутной женщины?» – говорили о ней. И была она в большой скорби. Когда она совсем пала духом при таких обстоятельствах, явился ей ангел Господень в виде того человека, которому некогда оказала она милость.
        cn: 「谁会愿意让这样一个放荡的女人做代父母呢？」——他们这样谈论她。她便陷入极大的悲痛中。当她在这种境况下完全灰心丧志时，上主的天使向她显现，形貌如同她曾经施恩予他的那个人。
    - type: paragraph
      text:
        ru: – Что с тобою? – спросил ее ангел.
        cn: ——你怎么了？——天使问她。
    - type: paragraph
      text:
        ru: – Я желаю сделаться христианкой и, увы, никто не хочет сказать обо мне.
        cn: – 我渴望成为一名基督徒，唉，没有人愿意为我说话。
    - type: paragraph
      text:
        ru: – В правду ли ты желаешь?
        cn: – 你当真愿意吗？
    - type: paragraph
      text:
        ru: – Да, и прошу и тебя об этом.
        cn: ——是的，我也为此请求你。
    - type: paragraph
      text:
        ru: – Не падай духом! Я приведу кого-нибудь, и тебя примут в лоно Церкви.
        cn: ——不要灰心！我会带一个人来，你就会被接纳进入教会的怀抱。
    - type: paragraph
      text:
        ru: 'Ангел приводит еще двух ангелов, и они относят ее вцерковь. Потом, приняв вид известных сановников при особе наместника, приглашают клириков, на обязанности которых было крестить новообращенных. Клирики спрашивают сановников:'
        cn: 天使又带来两位天使，他们带着她去了教堂。之后，他们化身为摄政者身边的显赫显贵，邀请那些职责是为新皈依者施洗的教士们。教士们询问那些显贵：
    - type: paragraph
      text:
        ru: – Ручается ли ваша любовь за нее?
        cn: ——您的爱能为她担保吗？
    - type: paragraph
      text:
        ru: – Да! – отвечают они.
        cn: ——『是的！』他们回答说。
    - type: paragraph
      text:
        ru: 'Клирики совершили все, что следует по чину над готовящимися ко крещению, и окрестили ее во имя Отца и Сына и Св. Духа. Потом облекли ее в одежды новокрещенных. Ангелы перенесли ее в дом, куда она вернулась в белых одеждах. И положив ее, стали невидимы. Соседи, увидав ее в белых одеждах, спрашивали:'
        cn: 圣职人员按照规矩，为这位预备受洗者完成了所有当行的事宜，并奉父、子、圣灵之名给她施洗。然后给她穿上新受洗者的衣袍。天使把她带回了家，她身着白袍回到了那里。把她放下后，便隐去了身形。邻居们看见她穿着白袍，问道：
    - type: paragraph
      text:
        ru: – Кто окрестил тебя?
        cn: ——谁为你施洗的？
    - type: paragraph
      text:
        ru: – Кто-то пришел, – отвечала она, – отнесли меня вЦерковь, сказали клирикам, и они окрестили меня.
        cn: 「——有人来了，」她回答说，「他们把我带到了教会，告诉了神职人员，然后他们给我施了洗。」
    - type: paragraph
      text:
        ru: Да кто же именно? Какие клирики? Об этом она ничего не могла сказать. Доложили папе. Папа призвал клириков, приставленных к крещению.
        cn: 究竟是谁呢？是哪些圣职人员呢？对此她什么也说不上来。他们禀告了教宗。教宗召集了负责施洗的圣职人员。
    - type: paragraph
      text:
        ru: – Вы ли окрестили ту женщину? – спросил папа.
        cn: ——是你给那个女人施洗的吗？——爸爸问道。
    - type: paragraph
      text:
        ru: 'Те не отреклись, подтвердили и сказали, что были приглашены для того таким-то и таким-то из сановников при правителе. Епископ посылает за указанными лицами и спрашивает у них: точно ли они поручились за девицу?'
        cn: 他们没有否认，并证实说，他们是受总督手下某某、某某官员的邀请而来的。主教派人召来那些人，并问他们：他们是否真的为那位少女担保了？
    - type: paragraph
      text:
        ru: – Ничего мы не знаем, – отвечали те. – Не знаем и тех, кто сделал это.
        cn: ——我们什么都不知道，——那些人回答说，——我们甚至不知道是谁做的。
    - type: paragraph
      text:
        ru: 'Тогда епископ понял, что это – дело Божие. И пригласив новокрещенную, спросил:'
        cn: 于是主教明白了，这是上帝的作为。他邀请了新受洗的她，问道：
    - type: paragraph
      text:
        ru: – Скажи мне, дщерь моя, что сделала ты доброго?
        cn: ——告诉我，我的女儿，你做了什么善事？
    - type: paragraph
      text:
        ru: – Я блудница и бедная... Что же доброго могла я сделать?
        cn: – 我是淫妇，又贫穷…… 我又能做出什么善功呢？
    - type: paragraph
      text:
        ru: – Так-таки и не знаешь за собою ни одного доброго поступка?
        cn: ——你就竟真的不知道自己做过任何一件善行吗？
    - type: paragraph
      text:
        ru: – Нет... вот разве это... однажды я увидала неизвестного мне человека, собиравшегося удавиться. Его сильно теснили заимодавцы. И, отдав ему все мое состояние, я избавила его от беды... И, сказав это, она почила в Господе, получив отпущение своих вольных и невольных прегрешений. Епископ прославил Господа:«Праведен еси, Господи, и правы суды Твои!»(Пс. 118, 137).
        cn: ——不……或许只有这件事……有一次，我看见一个不认识的人正要上吊自尽。他被债主逼得非常紧。于是，我把我的全部财产都给了他，使他摆脱了困境……她说完这些话，就在主里安息了，得到了她有意和无意之过犯的赦免。主教颂赞主说：「主啊，你是公义的，你的判断是正直的！」（诗篇 118:137）
  - type: heading2
    initial:
      ru: '208.'
      cn: '208.'
    text:
      ru: Ответ старца брату, одержимому печалью.
      cn: 长老答复为忧愁所缠绕的弟兄。
    children:
    - type: paragraph
      text:
        ru: 'Один брат, одержимый печалью, спросил старца:'
        cn: 一个被忧伤缠扰的弟兄，问一位长老说：
    - type: paragraph
      text:
        ru: – Что мне делать!? Помыслы одолевают меня, внушая мне, что напрасно я отрекся от мира и – все равно – спасения не достигну...
        cn: – 我该怎么办！？ 念头缠绕着我，向我灌输着：我徒然弃绝了世界，并且——无论如何——也无法得救了……
    - type: paragraph
      text:
        ru: – А ты, знаешь ли, – ответил старец, – хотя бы мы и не могли достигнуть земли обетованной, нам лучше сложить кости в пустыне, чем возвратиться в Египет!?..
        cn: 长者答道，『你知道吗？即便我们无法抵达应许之地，我们宁愿把骸骨留在旷野，也不要返回埃及！？』
  - type: heading2
    initial:
      ru: '209.'
      cn: '209.'
    text:
      ru: 'Наставления св. мужа по поводу слов молитвы Господней: не введи нас во искушение.'
      cn: 圣人的训诲，关于主祷文中的话语：不叫我们遇见试探。
    children:
    - type: paragraph
      text:
        ru: 'Один из святых сказал: «Молясь Господу: «не введи нас во искушение», мы не о том просим, чтобы нам не подвергаться искушению, потому что это невозможно. Нет, – мы молимся о том, чтобы под влиянием искушения нам не возжелать деяния, неугодного Богу. Вот это и значит – не впасть в искушение. Например, святые мученики, испытываемые мучениями и не побежденные ими, не впали в искушение, подобно сражающемуся со зверями, пока он еще не съеден зверьми. Если же будет растерзан, значит – пал среди испытания. Так и при каждой страсти – пока человек не побежден ею».'
        cn: 一位圣人说：「当我们向主祷告说：『不叫我们进入试探』时，我们所求的，并非是让我们不经历试探，因为这是不可能的。不，我们祈求的是，在试探的影响下，我们不渴望做那不蒙神喜悦的事。这才是所谓的——不陷入试探。例如，圣洁的殉道者们，虽然饱受折磨却未被其征服，他们就没有陷入试探，就像与野兽搏斗的人，只要他还没有被野兽吞吃。如果他被撕裂了，这就意味着——他在试炼中跌倒了。对于每一种情欲也是如此——只要人还没有被它征服。」
  - type: heading2
    initial:
      ru: '210.'
      cn: '210.'
    text:
      ru: Епископ, одержавший победу смирением.
      cn: 主教，以谦卑得胜。
    children:
    - type: paragraph
      text:
        ru: 'Рассказ одного из отцов: два епископа, жившие недалеко один от другого, поссорились между собою. Один из них был богат, а другой был весьма смиренный человек. Богатый искал случая повредить другому. Тот узнал об этом и сказал своему клиру:'
        cn: 一位教父的讲述：有两位主教，住得不远，彼此发生了争执。其中一位很富有，而另一位则是一个非常谦卑的人。那位富有的主教寻找机会要伤害另一位。另一位得知此事后，对他的圣职人员说：
    - type: paragraph
      text:
        ru: – Мы победим его благодатию Христа. Он хорошо знал, как ему поступить.
        cn: – 我们藉着基督的恩典将战胜他。他深知该如何行事。
    - type: paragraph
      text:
        ru: – Кто же может, владыко, устоять против него? – возразил клир.
        cn: – 谁又能抵挡他呢，主教大人？ – 圣职人员反驳道。
    - type: paragraph
      text:
        ru: – Подождите и сами увидите.
        cn: – 等等，你们自己会看到的。
    - type: paragraph
      text:
        ru: 'Епископ стал выжидать благоприятного случая. И вот, когда его собрат отправлял торжество в честь св. мучеников, он, взяв свой клир, повелел:'
        cn: 主教开始等候一个有利的时机。就这样，当他的同僚主教在为纪念圣殉道者举行隆重礼仪时，他便带着他的神职人员，吩咐道：
    - type: paragraph
      text:
        ru: – Следуй за мною, и мы одержим победу.
        cn: ——跟随我，我们必得胜。
    - type: paragraph
      text:
        ru: '– Что такое он намерен сделать? – рассуждали между собою клирики. Епископ отправляется на праздник. И вот когда другой шел, совершая всенародное молебствие, он, лишь только шествие приблизилось, бросается к ногам собрата, вместе со всем своим клиром, со словами:'
        cn: 「他打算做什么？」圣职人员们彼此议论着。主教启程前往节庆。就在此时，当另一位正在行进，举行着全民众的祈祷仪式时，他，就在游行队伍一靠近，便扑倒在同僚的脚前，连同他所有的圣职人员，说着：
    - type: paragraph
      text:
        ru: – Прости нас, владыко! Мы – рабы твои...
        cn: – 赦免我们，主教大人！我们是您的奴仆……
    - type: paragraph
      text:
        ru: 'Тот, пораженный этим поступком, умилившись в душе, по действию благодати Божией, изменившей настроение сердца его, сам объемлет ноги собрата и говорит:'
        cn: 那人，被这举动所震惊，心中感动，因着上帝恩典的运行，改变了他的心境，亲自拥抱他同道兄弟的双脚，说道：
    - type: paragraph
      text:
        ru: – Ты – мой владыка и отец!
        cn: ——你是我的主宰和父亲！
    - type: paragraph
      text:
        ru: 'И с того времени установилась между ними великая любовь. И сказал смиренный епископ своему клиру:'
        cn: 从那时起，他们之间便建立了极大的爱。谦卑的主教对他的圣职人员说：
    - type: paragraph
      text:
        ru: – Не говорил ли я вам, что мы победим благодатию Христа? И вы поступайте так же, когда возымеете что-либо друг против друга, и всегда победите.
        cn: ——我不是对你们说过吗，我们必借着基督的恩典得胜？你们也照样行，当你们彼此之间有什么嫌隙时，就总会得胜。
    - type: paragraph
      text:
        ru: 'Вот другое изречение старца: «Смиренный превосходит самого царя славою, потому что царя славят только в лицо, а смиренного и в глаза и за глазами все хвалят и ублажают».'
        cn: 这是长老的另一句格言：「谦卑的人在荣耀上胜过君王本人，因为君王只在当面受人称颂，而谦卑的人，却在人前人后都受众人称赞和尊崇。」
  - type: heading2
    initial:
      ru: '211.'
      cn: '211.'
    text:
      ru: О старце, освободившем из темницы брата, унесшего у него имущество.
      cn: 关于一位长老，他从监狱中释放了那偷走他财物的弟兄。
    children:
    - type: paragraph
      text:
        ru: 'Один авва рассказывал нам: близ нашей киновии жил старец возвышенной души, а подле него жил еще один брат. Однажды, в отсутствие старца, брат, по внушению диавола, отворив келлию старца, вошел в нее и похитил книги и сосуды. Старец возвратился и, войдя в келлию, заметил пропажу сосудов, и пошел к соседу сказать ему о похищении. И вот его сосуды – среди келлии... Брат не успел еще и спрятать их. Старец не желал ни стыдить, ни обличать брата. Сделав вид, будто он внезапно почувствовал боль в желудке, он тотчас вышел как будто для естественной надобности и пробыл вне келлии достаточно времени для того, чтобы брат мог убрать сосуды. Вернувшись к нему, старец начал с ним разговор о постороннем предмете и брата не обличил. Прошло немного времени. Сосуды старца нашлись. Брата, уличенного в краже, заключили в тюрьму, а старец ничего об этом не знал. Услышав о заключении брата, он точно также не знал и о причине заключения. Вот старец приходит ко мне, рассказывал игумен. Он часто навещал нас.'
        cn: 一位阿爸长老告诉我们：在我们修道团体附近，住着一位灵魂高尚的长老，在他旁边还住着一位弟兄。有一天，长老不在的时候，那位弟兄，受魔鬼的诱惑，打开了长老的隐修室门，进去偷走了书籍和器皿。长老回来了，进了他的隐修室，发现器皿不见了，便去拜访邻居，告诉他失窃的事情。结果，他的器皿就在隐修室里……那位弟兄甚至还没来得及藏好它们。长老不愿使弟兄蒙羞，也不愿指责他。他假装胃部突然感到疼痛，立刻走出去，好像是要去方便，并在隐修室外待了足够的时间，以便那位弟兄能把器皿收好。回到他身边后，长老与他聊起一些不相关的事情，没有指责那位弟兄。过了一小段时间，长老的器皿被找回了。那位因偷窃而被定罪的弟兄，被关进了监狱，而长老对此一无所知。当他听说那位弟兄被关押时，他同样也不知道被关押的原因。那位长老来找我，方丈讲述说。他经常来探望我们。
    - type: paragraph
      text:
        ru: – Сделай милость, – говорит, – дай мне несколько яиц и пшеничного хлеба.
        cn: ——请，他说，——给我几个鸡蛋和小麦面包。
    - type: paragraph
      text:
        ru: – Наверное, у тебя сегодня гости? – спрашиваю его.
        cn: 「或许你今天有客人？」我问他。
    - type: paragraph
      text:
        ru: – Да, – ответил мне.
        cn: – 是的， – 他回答我。
    - type: paragraph
      text:
        ru: 'Взяв припасы, старец отправился в темницу навестить и утешить брата. При его появлении в темнице, брат бросился к ногам его со словами:'
        cn: 带着补给，长老去了监狱探望并安慰弟兄。当他出现在监狱时，那位弟兄扑倒在他的脚下，说道：
    - type: paragraph
      text:
        ru: – За тебя я, авва, попал сюда. Это я похитил твои сосуды, а книга твоя у такого-то, плащ – у такого-то.
        cn: — 阿瓦，我是因你才落到这里来的。是我盗走了你的器皿，你的书在某人那里，斗篷则在某人那里。
    - type: paragraph
      text:
        ru: – Да успокоится сердце твое, чадо! Я не затем пришел сюда. Я даже и не знал, что ты – здесь за меня...
        cn: ——愿你的心得以安宁，我的孩子！我来这里并非为此。我甚至不知道你在这里是为了我……
    - type: paragraph
      text:
        ru: – Услышав о твоем заключении, я опечалился и пришел к тебе с утешением. Вот тебе – хлеб и яйца. Сверх того я похлопочу о том, чтобы освободить тебя из темницы.
        cn: ——听到你被囚禁的消息，我深感忧伤，特来安慰你。这是给你的——面包和鸡蛋。除此之外，我还会尽力设法让你从牢狱中获释。
    - type: paragraph
      text:
        ru: Оставив брата, старец отправился к начальству, – он был хорошо известен по добродетельной жизни. По приказанию властей, брат был освобожден из-под стражи.
        cn: 留下兄弟，长老去见了当权者——他因其德行生活而广为人知。奉当局之命，那兄弟获释了。
  - type: heading2
    initial:
      ru: '212.'
      cn: '212.'
    text:
      ru: О великодушном поступке двух старцев с разбойниками.
      cn: 关于两位圣者对待强盗的宽宏之举。
    children:
    - type: paragraph
      text:
        ru: 'Рассказ одного старца: пришел к нам старец высокой добродетели. Мы прочитывали в книге «Рай» изречение св. отцов. А старец всегда любил читать о них. Он, казалось, весь был проникнут ими, и, коренясь в его сердце, они произращали плод добродетели. Читая, мы дошли до рассказа о старце, к которому пришли разбойники.'
        cn: '一位长老的讲述：


          一位品德高尚的长老来到我们这里。我们正在阅读《天堂》一书中的圣教父训言。而这位长老总是喜爱阅读有关他们的内容。他似乎完全被他们所浸润，这些训言在他的心中扎根，并结出了美德的果实。我们读着读着，便读到了一个关于长老的故事，有强盗来找他。'
    - type: paragraph
      text:
        ru: – Мы пришли забрать все в твоей келлии, – сказали разбойники.
        cn: 「我们来拿走你隐修室里的一切，」强盗们说。
    - type: paragraph
      text:
        ru: – Что желаете, чада, то и возьмите, – отвечал старец.
        cn: 「我的孩子们，凡你们所愿的，只管拿去吧，」长老回答说。
    - type: paragraph
      text:
        ru: 'Забрав все, разбойники ушли, но не заметили висевшего на стене мешочка. Старец, схватив мешочек, побежал за ними, громко крича:'
        cn: 拿走了一切之后，强盗们走了，但没有注意到一个挂在墙上的小袋子。老人抓起那个小袋子，跑去追他们，大声喊着：
    - type: paragraph
      text:
        ru: – Чада, захватите – вот вы не заметили у меня в келлии...
        cn: ——孩子们，带走吧——你们看，你们没注意到在我修士室里……
    - type: paragraph
      text:
        ru: 'Разбойники, тронутые незлобием старца, возвратили ему все в келлию. Раскаявшись, они говорили друг другу: «Воистину, это – человек Божий!» Когда мы прочли об этом, старец сказал нам:'
        cn: 盗贼们被老修士的不怀恶意所感动，把所有东西都归还到他的小室里。他们悔改了之后，彼此说：「这真是个属神的人！」当我们读到这件事的时候，老修士对我们说：
    - type: paragraph
      text:
        ru: – Знаешь ли, авва? Этот рассказ принес мне много пользы.
        cn: ——阿爸，你知道吗？这个故事给我带来了很多益处。
    - type: paragraph
      text:
        ru: – Каким образом, отче? – говорю я.
        cn: 「神父，以何种方式呢？」我说。
    - type: paragraph
      text:
        ru: '– Однажды я находился в стране близ Иордана. Прочитал тогда этот рассказ и, подивившись старцу, воззвал: Господи, удостоивший меня этого звания, удостой и следовать по стопам этого мужа. И вот, когда в душе горело такое желание, спустя два дня врываются ко мне разбойники. Они еще стучались в дверь, но я понял, что это – разбойники, и сказал сам себе: «Благодарение Богу! Настало время показать плод моего желания». Отворив дверь, я принял их с веселым видом, зажег светильник и начал им все показывать.'
        cn: 有一次，我身在约旦河附近的一个地方。那时我读到了这个故事，惊叹于这位长老，便呼求道：「主啊，你既已使我配得这个称谓，也求你恩准我追随这位男子的脚踪。」 于是，当心中燃烧着这样的渴望时，两天之后，强盗们闯进了我的住处。他们当时还在敲着门，但我明白那是强盗，我便自言自语道：「感谢上帝！时候到了，可以显出我愿望的果子了。」 我打开门，面带喜乐地接待了他们，点燃了灯，并开始向他们展示一切。
    - type: paragraph
      text:
        ru: – Не беспокойтесь! Верен Бог, что не скрою от вас ничего, – говорю им.
        cn: ——不要担心！上帝是信实的，我必不向你们隐瞒任何事，——我对他们说。
    - type: paragraph
      text:
        ru: – А есть у тебя золото? – спросили они.
        cn: ——那么，你有金子吗？——他们问道。
    - type: paragraph
      text:
        ru: – Да. Вот три номисмы.
        cn: ——是的。这里有三枚诺米斯马。
    - type: paragraph
      text:
        ru: И я открыл сосуд перед ними. Взявши монеты, они ушли с миром.
        cn: 和我在他们面前打开了容器。他们拿了硬币，带着平安离开了。
    - type: paragraph
      text:
        ru: – А возвратились ли они, как к тому старцу? – шутливо заметил я.
        cn: —— 那么他们有没有像回到那位长老那里一样呢？—— 我打趣地说道。
    - type: paragraph
      text:
        ru: – Нет! – быстро сказал старец. – Боже сохрани! Я и не желал, чтобы они вернулись...
        cn: ——不！长老迅速地说，——愿上帝不许！我也不希望他们回来……
  - type: heading2
    initial:
      ru: '213.'
      cn: '213.'
    text:
      ru: Для чего совершаются знамения и чудеса во св. Церкви.
      cn: 圣教会中施行神迹和奇事是为了什么？
    children:
    - type: paragraph
      text:
        ru: Один из старцев говорил нам о дивных знамениях. Они бывают и теперь в Церкви Божией по причине народившихся и разрастающихся ересей, в особенности по причине раскола Севера акефала и других гибельных учителей, для ограждения и утверждения в вере более слабых душ, равно как и для обращения самих лжеучителей, если бы захотели. Поэтому святые отцы и с первого времени христианства святые мученики ежедневно до сих пор совершают знамения в кафолической Божией Церкви.
        cn: 一位长老曾对我们谈论奇妙的神迹。它们如今仍在上帝的教会中发生，由于滋生并蔓延的异端，尤其是由于无头者塞弗勒斯（Severus Acephalus）的裂教和其他毁灭性的教师，为了护卫并使更软弱的灵魂在信仰中得以坚定，也为了使那些假教师自己能够悔改，如果他们愿意的话。因此，圣教父们以及从基督教最初时期起，圣殉道者们，直到今日仍每日在上帝的普世教会中施行神迹。
  - type: heading2
    initial:
      ru: '214.'
      cn: '214.'
    text:
      ru: Чудо в Соруде.
      cn: 索鲁达的奇迹。
    children:
    - type: paragraph
      text:
        ru: У подошвы горы, на которой возвышается город кианейцев, есть одно селение Соруда. В этом селении находится купель, источающая воду в день св. Богоявления. От выступающих капель она наполняется в течение трех часов, и после крещения также в течение трех часов вода не вдруг, но понемногу снова убывает.
        cn: 在巍然耸立着基阿内人城市的山脚下，有一个名为索鲁达的村庄。在这个村庄里，有一个浸礼池，会在主显节那天涌出水。从涌出的水滴，它会在三小时内充满，并且在施洗之后，同样在三小时内，水不会突然，而是渐渐地再次退去。
  - type: heading2
    initial:
      ru: '215.'
      cn: '215.'
    text:
      ru: Чудо в Кедребатах.
      cn: 凯德雷巴特奇迹。
    children:
    - type: paragraph
      text:
        ru: И в селении Кедребатах, у подошвы возвышенности города Эноанда, также есть купель, которая, хотя и высечена из одного цельного камня, в праздник Пасхи, в светлое Христово Воскресение, вдруг сама собою наполняется и держит воду до дня Пятидесятницы, и в день Пятидесятницы вдруг исчезает. То и другое чудо совершается в области Ликийской. Если кто сомневается в этом, – не велик труд, пройти до Ликии, чтобы удостовериться в истине.
        cn: 在凯德列巴特村，埃诺安达城高地的山脚下，也有一个泉池。这个泉池虽然是用一整块石头凿刻而成，但在逾越节，即基督荣光的复活日，它突然自行充满水，并一直蓄水直到五旬节；而在五旬节那天，水又突然消失。这两个奇迹都发生在吕基亚地区。如果有人对此心存疑虑，那么亲身前往吕基亚去确证其真实性，并非难事。
  - type: heading2
    initial:
      ru: '216.'
      cn: '216.'
    text:
      ru: 'Разумный совет: не следует делать неразумных решений, ни тем более исполнять их.'
      cn: 明智的建议：不应做出不明智的决定，更不应执行它们。
    children:
    - type: paragraph
      text:
        ru: 'Однажды пришлось мне быть во св.граде. Ко мне пришел один христолюбец и сказал: «У меня с братом произошла небольшая ссора, и он не хочет мириться со мною. Уговори его, пожалуйста». Я с радостью согласился на это и, пригласив брата, стал склонять его к любви и миру. Казалось, мои слова произвели на него впечатление. Вдруг, в конце концов, он сказал мне:'
        cn: 有一次，我有幸去到圣城。一位爱基督的人来到我这里，对我说：「我和我的兄弟之间发生了一点小争执，他不愿意与我和好。请你劝说他吧。」我欣然同意了，于是，我请来了那位兄弟，开始劝导他走向爱与和平。看起来，我的话似乎打动了他。突然，最终他对我说：
    - type: paragraph
      text:
        ru: – Не могу я помириться с ним! Я поклялся крестом...
        cn: ——我无法与他和解！我向十字架起誓过……
    - type: paragraph
      text:
        ru: 'Улыбнувшись, я сказал ему:'
        cn: 微笑着，我对他说：
    - type: paragraph
      text:
        ru: '– Твоя клятва имеет такое же значение, как если бы ты сказал: «Клянусь честным Крестом Твоим, Христе, что я не стану исполнять Твоих заповедей, но буду творить волю врага Твоего диавола... Мы не только не должны упорствовать в дурных своих решениях, но должны каяться и скорбеть о том, что мы задумываем дурного против себя самих, как говорит богоносный Василий. Если бы Ирод покаялся и не упорствовал в своей клятве, он не совершил бы великого злодеяния, обезглавив Предтечу Христова. В заключение я опять воспользовался изречением св. Василия, которое он заимствовал из Евангелия – о том, как Петр противоречил Господу, когда Он хотел омыть ноги св. Петра...'
        cn: – 你的誓言与你这样说具有相同的意义：「我凭你尊贵的十字架起誓，基督啊，我不会遵行你的诫命，反而会遵行你的仇敌魔鬼的旨意……」我们不仅不应执着于自己的恶念，而且应该为我们自己所图谋的恶事悔改并悲伤，正如蒙神者瓦西里所说。如果希律悔改，并且没有执着于他的誓言，他就不会犯下那巨大的恶行，斩首基督的先驱。最后，我再次引用了圣瓦西里的一段话，这段话是他从福音书中所引用的——关于彼得如何反驳主，当祂想要为圣彼得洗脚时……
  - type: heading2
    initial:
      ru: '217.'
      cn: '217.'
    text:
      ru: Совет старца иноку об обращении с женщинами.
      cn: 长老给修士关于与女性交往的建议。
    children:
    - type: paragraph
      text:
        ru: 'Старец говорил: «Чадца, соль из воды и, соединяясь с водою, растворяется и исчезает. Так и монах. От жены произойдя, он, приближаясь к женщине, ослабевает и обращается в ничто, т.е., перестает быть монахом».'
        cn: 长老说：「孩子们，盐来自水，与水结合后，便溶解消失了。僧侣也是如此。他从女人而出，当他靠近女人时，便软弱并归于虚无，也就是说，他就不再是僧侣了。」
  - type: heading2
    initial:
      ru: '218.'
      cn: '218.'
    text:
      ru: Авва Сергий вразумляет земледельца своею кротостию и терпением.
      cn: 阿爸谢尔盖以他的温柔和忍耐开导农夫。
    children:
    - type: paragraph
      text:
        ru: 'Авва Сергий, игумен монастыря аввы Константина, рассказывал нам: однажды мы путешествовали с одним св. старцем. Сбившись с пути, мы против желания и не зная, где пройти, попали на засеянное поле и потоптали немного всходов. На поле тогда работал земледелец. Увидав нас, он в гневе осыпал нас бранью.'
        cn: 阿巴·谢尔盖，阿巴·康斯坦丁修道院的院长，曾对我们讲述：有一次，我们与一位圣洁的老修士同行。我们迷了路，不情愿地，也不知道该往哪里走，结果走到了一片已播种的田地里，踩踏了一些幼苗。那时，田地里有一个农夫正在劳作。他看到我们，便勃然大怒地对我们破口大骂。
    - type: paragraph
      text:
        ru: – Монахи ли вы? Есть ли у вас страх Божий? Если бы вы имели пред очами страх Божий, вы бы так не поступали.
        cn: ——你们是修士吗？你们有敬畏上帝的心吗？如果你们眼前有敬畏上帝的心，你们就不会这样行事了。
    - type: paragraph
      text:
        ru: '«Ради Господа, никто ничего не говори!» – быстро сказал нам св. старец. Затем, обратившись к крестьянину, ответил:'
        cn: 「看在主的份上，谁都别开口！」圣长老迅速地对我们说。然后，他转向那位农民，回答说：
    - type: paragraph
      text:
        ru: – Правильно, чадо мое, сказал ты. Если бы мы имели страх Божий, мы не поступали бы так.
        cn: —你说得对，我的孩子。如果我们有对上帝的敬畏，我们就不会这样做。
    - type: paragraph
      text:
        ru: Но крестьянин продолжал гневно браниться.
        cn: 但农民继续愤怒地咒骂。
    - type: paragraph
      text:
        ru: – Правду говоришь ты, чадо! – снова отвечал старец, – если бы мы были истинными монахами, мы не делали бы сего. Но, ради Господа, прости нам, что мы согрешили против тебя.
        cn: 「你说的的确是实话，孩子！」长老又回答说，「如果我们是真正的修士，我们就不会这样做。但是，为主的缘故，请原谅我们，因为我们得罪了你。」
    - type: paragraph
      text:
        ru: Тронутый этими словами, крестьянин, приблизившись, бросился к ногам старца.
        cn: 被这些话语感动，农民走上前去，扑倒在长老脚下。
    - type: paragraph
      text:
        ru: – Я согрешил! – воскликнул он. – Прости меня! – И ради Господа возьмите меня с собою.
        cn: 「我犯了罪！」他喊道。「赦免我吧！为了主，请带我与你们同去吧。」
    - type: paragraph
      text:
        ru: И действительно, присовокупил блаженный Сергий, он последовал за нами и принял иноческий чин.
        cn: 确实地，蒙福者谢尔盖又说，他跟随了我们并领受了修道品级。
  - type: heading2
    initial:
      ru: '219.'
      cn: '219.'
    text:
      ru: Смирение побеждает вражду.
      cn: 谦卑战胜敌意。
    children:
    - type: paragraph
      text:
        ru: 'Вот о каком происшествии рассказал мне старец: однажды я прожил немного времени в лавре аввы Герасима. Там был у меня возлюбленный мною брат. Однажды мы сидели вместе и разговаривали о пользе душевной. Мне пришлось вспомнить слова аввы Пимена: «Каждому надлежит укорять себя во всем».'
        cn: 长老向我讲述了这样一个事件：有一次，我在阿爸·格拉西莫斯拉夫拉住了一小段时间。在那里我有一个我所挚爱的弟兄。有一天，我们坐在一起，谈论着灵魂的益处。我于是想起了阿爸·皮门的话语：「每个人都当在一切事上责备自己。」
    - type: paragraph
      text:
        ru: – Я, отец мой, – сказал брат, – на опыте узнал силу и душевную пользу от этих слов. У меня был искренний друг – диакон лавры. Не знаю, с чего он возымел подозрение в одном поступке с моей стороны, причинившем ему скорбь, и стал мрачно смотреть на меня. Видя угрюмый взор его, я просил его объяснить мне причину.
        cn: 「我，我的神父，」那位修士说，「我亲身经历过这些话语的力量和灵魂的益处。我曾有一位真诚的朋友——大修道院的执事。不知为何，他对我的一个举动起了疑心，那件事使他感到悲伤，于是他开始阴沉地看着我。看到他那阴郁的目光，我请求他向我解释原因。」
    - type: paragraph
      text:
        ru: – Вот что ты сделал! – сказал он мне. Вовсе не зная за собой такого поступка, я принялся уверять его, что не делал ничего подобного.
        cn: 「你看看你做了什么！」他对我说。全然不知道自己有此行为，我开始向他保证，自己没有做任何类似的事情。
    - type: paragraph
      text:
        ru: – Прости меня, но – я не удовлетворен твоими оправданиями, – сказал брат.
        cn: ——原谅我，但是——我并不满意你的辩解，——弟兄说。
    - type: paragraph
      text:
        ru: 'Удалившись к себе в келлию, я начал испытывать свое сердце – не сделано ли в самом деле мною чего-либо подобного – и не нашел ничего. Однажды видя, как он держал св. чашу для преподания св. Причащения, я с клятвою стал уверять его, что я не виновен в том, что он приписывает мне. Но он и тут не убедился моими словами. Обращаясь снова к себе самому, я стал припоминать изречения св. отцов и, доверившись им, обратился к своим мыслям. Диакон искренно любит меня, говорил я сам себе, и, побуждаемый любовью, прямодушно говорит мне о том, что у него на сердце, чтобы я трезвился, бодрствовал над собою и не совершил бы чего-либо подобного. Положим, бедная душа моя, ты и не совершила этого. Но – не, совершено ли тобою множество других злых дел и все ли они тебе известны? Где – то, что ты творила вчера или третьего дня, или десять дней тому назад? Помнишь ли ты об этом? Так – не совершила ли ты и того, что тебе приписывают, а потом позабыла, как и первое? И, размышляя, таким образом, я так расположил свое сердце, как бы и в самом деле я сделал это, но позабыл, как и другие свои дела. И стал я благодарить Бога и диакона, что чрез него Бог дал мне познать грех мой, и я мог раскаяться в нем. После таких размышлений я встал и пошел к диакону просить у него прощения и благодарить за то, что он помог мне познать грех. Но лишь только я постучался к нему в дверь, он, отворив, бросается мне в ноги со словами:'
        cn: '退到自己的隐修室里，我开始省察自己的心——是否真的做过类似的事情——却一无所获。有一次，当我看见他手持圣杯，准备施行圣餐时，我便起誓向他保证，他对我的指控我是无辜的。但即便如此，他也没有被我的话语说服。


          再次转回我自身，我开始回想圣教父们的言论，并信赖这些言论，转向我自己的思绪。「执事真诚地爱我，」我对自己说，「他受爱所激励，率直地对我讲出他心里所想的，好让我警醒，警惕自己，不要做出类似的事情。姑且假定，我可怜的灵魂啊，你确实没有做过这件事。但是——你难道没有做过许多其他的恶事吗？难道你全部都知道吗？你昨天、前天，或者十天前所做的事情都到哪里去了呢？你还记得这些吗？那么——你难道没有做过他们所指控你的事情，然后像那些事情一样忘记了吗？」


          于是，我如此思索着，便使我的心这样摆放：仿佛我真的做过这件事，但却忘记了，就像我其他的行为一样。我便开始感谢上帝和那位执事，因为借着他，上帝让我认识了我的罪，我因此得以悔改。


          在这样的思索之后，我便起身去见执事，请求他的宽恕，并感谢他帮助我认识了罪。但当我刚敲响他的门时，他一开门，就扑倒在我脚下，说着：'
    - type: paragraph
      text:
        ru: – Прости меня, что диавол, издеваясь надо мною, внушил мне подозрение на тебя! Воистину Сам Бог вразумил меня, что ты невинен.
        cn: 请原谅我，魔鬼戏弄我，使我对你起了疑心！诚然是上帝亲自启示了我，你清白无辜。
    - type: paragraph
      text:
        ru: И начал он говорить, что не дозволит мне принести ему извинение.
        cn: 他开始说，他不会允许我向他道歉。
    - type: paragraph
      text:
        ru: – В этом нет никакой надобности.    Получив отсюда великое назидание, я прославил Отца и Сына и Св. Духа. Тому держава и великолепие во веки веков! Аминь
        cn: ——这并没有任何必要。从中获得极大训诲后，我荣耀了圣父、圣子和圣灵。愿权能与荣光归于祂，直到永永远远！阿门。
    - type: heading4
      text:
        ru: notes
        cn: 笔记
      children: []
