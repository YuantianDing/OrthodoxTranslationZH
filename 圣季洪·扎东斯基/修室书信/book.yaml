title:
  ru: Письма келейные
  cn: 修室书信
authors:
- ru: Святитель Тихон Задонский
  cn: 圣主教季洪·扎东斯基
document:
- type: heading2
  text:
    ru: Письма 1 – 10
    cn: 书信 1 – 10
  children:
  - type: paragraph
    text:
      ru: 'В нынешний день великий, не имея с чем еще тебя поздравить, как только по поводу всемирной радости, – с нею тебя поздравляю. Какова она? – Сын Божий пришел грешников спасти. Радуйтесь, грешники! Бог и Господь наш пришел ради нас в мир, чтобы спасти нас. «Великая благочестия тайна: Бог явился во плоти» ( 1Тим 3:16 )! Царь Небесный на земле явился, и Неприступный Херувимам с людьми пожил.'
      cn: 在这伟大的日子里，除了普世的喜乐，我再没有别的可祝贺你的了——我以此祝贺你。这喜乐是什么呢？——上帝之子降世为要拯救罪人。罪人哪，欢欣吧！我们的上帝和上主为了拯救我们而降世。 「敬虔的奥秘是伟大的：上帝在肉身中显现」(1提摩马太福音 3:16)！天上的君王降临在地上，连基路伯也无法靠近的那一位竟与世人一同居住。
  - type: paragraph
    text:
      ru: О, благость и человеколюбие несказанное явившегося Господа! О, блаженство тех, ради которых их Бог и Господь пришел и явился им!
      cn: 哦，显现之主那无法言喻的慈爱与仁爱！哦，那些人蒙受何等福乐啊，为了他们，他们的上帝和主降临并向他们显现！
  - type: paragraph
    text:
      ru: Блаженны очи, видевшие Бога во плоти, и уши, слышавшие Божественные слова Его, чего многие пророки хотели «видеть, и не видели, и слышать, и не слышали» ( Мф 13:17 )! Блаженны и мы, хотя этими грешными глазами не видим Его и этими ушами не слышим пресладкого голоса Его, но веруем пришествию Его. Особенно же «блаженны невидевшие и уверовавшие» ( Ин 20:29 ). Блаженны мы, так как ради нас Бог наш к нам пришел, Бог, уподобившись людям, к людям пришел, и пришел ради людей. Он пришел грешников спасти, значит, и нас, ибо и мы в числе грешников. Он пришел взыскать погибших, значит, и нас, поскольку и мы были в числе погибших. Благословен Бог, Который пришел грешников спасти и погибших взыскать!
      cn: 福哉亲眼得见上帝在肉身中的眼睛，以及亲耳听闻祂神圣话语的耳朵，这正是许多先知切慕「看见，却没看见；听见，却没听见」（马太福音 13:17）的啊！福哉我们，尽管我们这些罪污的眼睛未能看见祂，这些耳朵未能听闻祂那甘甜无比的声音，却相信祂的降临。尤其「福哉那没有看见就信了的人」（约翰福音 20:29）！福哉我们，因为我们的上帝为我们降临我们之中，上帝祂取了人的样式，来到人间，并为世人而来。祂降临是为了拯救罪人，也就是说，也包括了我们，因为我们也在罪人之列。祂降临是为了寻找失丧者，也就是说，也包括了我们，因为我们曾是失丧者之一。受赞颂的上帝，祂降临是为了拯救罪人，并寻找失丧者！
  - type: paragraph
    text:
      ru: Открыли для нас это сокровище спасения очевидцы, которые видели Его, и слышали Его, и беседовали с Ним, и жили и общались с Ним, и осязали Его, и ели и пили с Ним, и пребывали в напасти с Ним, слышали, как Он проповедовал святое Евангелие и царствие небесное; видели, как по земле ходил, и из города в город и из селения в селение переходил, утруждался, чудодействовал, прокаженных очищал, слепых просвещал, мертвых воскрешал, и прочие вышеестественные дела творил; видели, как Он ради нашего спасения страдал, умирал, и умер, и был погребен, и воскрес из мертвых, и как вознесся на небо, видели.
      cn: 亲眼见证者为我们开启了这救恩的宝藏，他们亲眼见过祂，亲耳听过祂，和祂交谈，和祂同住并交往，亲手触摸过祂，和祂一同饮食，并和祂一同忍受苦难；他们亲耳听闻祂如何宣讲圣福音和天国；亲眼看见祂如何在地上行走，从城到城、从村到村地来往，劳苦，行神迹，洁净麻风病人，使盲者得见光明，使死者复活，并施行其他超乎自然的作为；亲眼看见祂如何为我们的救恩而受苦，受死，并已死了，且被埋葬，从死里复活，以及如何升入高天，这一切，他们都亲眼看见了。
  - type: paragraph
    text:
      ru: 'Эти очевидцы согласно нам проповедали: «О том, что было от начала, что мы слышали, что видели своими очами, что рассматривали и что осязали руки наши, о Слове жизни, – ибо жизнь явилась, и мы видели и свидетельствуем, и возвещаем вам сию вечную жизнь, которая была у Отца и явилась нам, – о том, что мы видели и слышали, возвещаем вам» , и прочее ( 1Ин 1:1–3 ). И еще: «мы возвестили вам силу и пришествие Господа нашего Иисуса Христа, не хитросплетенным басням последуя, но быв очевидцами Его величия. Ибо Он принял от Бога Отца честь и славу, когда от велелепной славы принесся к Нему такой глас: Сей есть Сын Мой возлюбленный, в Котором Мое благоволение. И этот глас, принесшийся с небес, мы слышали, будучи с Ним на святой горе» ( 2Петр 1:16–18 ; Мф 17:5 ; Мк 9:7 ).'
      cn: '这些见证人，照着我们所说的，宣讲道：「论到那从起初就有的，我们所听见的，我们亲眼所看见的，我们所详察的，和我们双手所触摸过的，论到生命的道，——因为生命已经显现了，我们也看见了，并且作见证，并把这永恒的生命传告给你们，这生命是原与父同在的，且已向我们显现了，——我们所看见和听见的，我们传告给你们。」及其他 (约翰一书 1:1-3)。

        又说：「我们把我们主耶稣基督的大能和降临传告给你们，并不是随从巧妙编造的虚言，而是亲自目睹过祂的荣耀。因为祂从上帝父领受了尊荣和荣耀，当那极大的荣耀向祂发出这样的声音时：『这是我的爱子，我所喜悦的。』这从天上发出的声音，我们听见了，当我们与祂同在那圣山上的时候。」 (彼得后书 1:16-18，马太福音 17:5，马可福音 9:7)。'
  - type: paragraph
    text:
      ru: Истину эту, очевидцы и достоверные свидетели ее, не только словом и чудесами и различными знамениями, но и кровью своей, и различным страданием и смертью своей утвердить не усомнились. «Верно и всякого принятия достойно слово» ( 1Тим 1:15 ), которое не один, не два, не три, но многие очевидцы согласно проповедали, и не только проповедали, но и знамениями и чудесами подтвердили, и крови и душ своих не пощадили. Рассуждай об этом, брат, в этом поучайся, в этом стой, мужайся, крепись, и хулителям и безбожникам, которых уже не мало является, заграждай уста, и молись, чтобы нам, не видев Бога, явившегося во плоти ради нас, возлюбить Его всем сердцем, «и доселе Его не видя, но веруя в Него» , радоваться «радостью неизреченною и преславною, достигая наконец верою» нашею «спасения душ» ( 1Петр 1:8–9 ).
      cn: 它的亲眼见证者和可靠证人，不仅以言语、神迹和各种异兆，而且以自己的鲜血，以及各种苦难和死亡，毫不犹豫地确证了这真理。「这话是可信的，是值得完全接受的」（提摩太前书 1:15），它不是一个人、两个人、三个人，而是许多亲眼见证者一致宣讲的，他们不仅宣讲，而且以异兆和神迹加以证实，并且不惜牺牲自己的鲜血和灵魂。弟兄啊，你要思考此事，在此受教，在此站立，要刚强，要坚固，并且要堵住那些亵渎者和无神论者的口，他们如今已经不少了；并要祷告，好使我们，即使未曾亲眼看见那为我们显现于肉身的上帝，也能全心爱祂，并且「如今虽不得看见祂，却因信祂」而「有说不出来、满有荣光的大喜乐，最终藉着」我们的「信心，得着灵魂的救恩」（彼得前书 1:8-9）。
  - type: paragraph
    text:
      ru: Спасайся!
      cn: 求救赎！
  - type: paragraph
    text:
      ru: 'Истинно и праведно ты отвечаешь: великое человеколюбие Божие то, что Он Сам пришел «взыскать и спасти» ( Мф 18:11 ) человека. Здесь можем праведно возгласить известное слово Псаломника: «Господи, что такое человек, что Ты открылся ему, или сын человеческий, что Ты помышляешь о нем» ( Пс 143:3 )?'
      cn: 你回答得确实而公义：上帝的宏大慈爱就在于祂亲自降临，为要「寻找并拯救」（马太福音 18:11）世人。在此我们能公义地宣告诗篇作者那句著名的话：「上主啊，人算什么，祢竟向他显现？或世人子算什么，祢竟眷顾他？」（诗篇 143:3）
  - type: paragraph
    text:
      ru: 'Дивное создание Божие – человек! Создан не так, как прочие вещи. О всех вещах написано: «сказал Бог, – и было; повелел, и – создалось» ( Пс 32:9 ). О человеке не так, но что? «Сотворим человека» . Так триипостасный Бог советовал; как бы некое великое дело намереваясь сотворить, Бог говорил: «сотворим человека» . Какого человека? «По образу Нашему и по подобию сотворим» ( Быт 1:26 ). Великой и высокой честью почтен был человек Создателем своим при создании, так что выше и быть не может. Все твари – свидетели всемогущества и премудрости Божией, но человек, кроме того, образом Божиим почтен и особенным советом Его сотворен. Познаем, брат, первобытное наше благородство, достоинство и преимущество.'
      cn: '奇妙的上帝受造物——人！

        受造的方式不像其他事物。论及所有事物，经上写道：「上帝说了，就有了；祂吩咐了，就造成了」（诗篇 32:9）。论及人却非如此，那么是什么呢？「让我们造人」。三位一体的上帝如此商议；仿佛在打算创造一件伟大的工作，上帝说：「让我们造人」。什么样的人呢？「照着我们的形象，按着我们的样式造人」（创世记 1:26）。人在受造之时，由其创造者被赋予极大且崇高的尊荣，以致再无更高的了。所有受造物都是上帝全能与全智的见证，然而人，除此以外，被上帝的形象尊荣，并且是藉着祂特别的商议所造。弟兄啊，让我们认识我们原始的崇高、尊严以及优势。'
  - type: paragraph
    text:
      ru: Когда сие дивное создание Божие из-за лукавства змеиного и своего преслушания обесчестилось и погибло, – чего оплакать не можем, – благость Божия снова явилась на нем, снова почтила его чудесно, снова превознесла его. Как? Сам Бог, Создатель его, пришел взыскать и спасти его. Не послал Ангела, или Архангела, но Сам вступил в дело сие, Сам в плоть человеческую облекся, и на земле пожил, и пострадал, и умер за человека. Видишь благость Божию, видишь и достоинство человека. Сам Бог ради него, погибшего, пришел, так что чем более обесчестился человек по хитрости змеиной, тем еще более почтен и превознесен Создателем своим.
      cn: 当上帝这奇妙的受造物，因着蛇的诡诈和自己的悖逆而受辱并丧亡——我们无法为之哀恸——上帝的良善又一次显明在他身上，又一次奇妙地尊崇了他，又一次高举了他。如何？上帝自己，他的创造主，来寻求并拯救他。他未曾差遣天使，或天使长，却亲自投身此事件，亲自披戴了属人的肉身，并在地上生活过，受苦，为人而死。你可见上帝的良善，也可见人的尊严。上帝自己，为了这丧亡之人，亲自降临，以致人因蛇的诡诈而愈加受辱，就愈加被他的创造主所尊崇和高举。
  - type: paragraph
    text:
      ru: Слава Богу, благоволившему так! Слава Богу, пришедшему спасти нас! Да будет слава Господня вовеки!
      cn: '荣耀归于上帝，祂如此恩慈地施恩！

        荣耀归于上帝，祂前来拯救我们！

        愿主的荣耀，永世长存！'
  - type: paragraph
    text:
      ru: 'Поклонимся Богу, пришедшему спасти нас грешных, и истинной верой и благодарным сердцем почтим Его: обратимся от твари к Творцу нашему и от суетного мира к Богу нашему, и возлюбим Его, и поищем Его, и послужим Ему чистым сердцем, дабы не явиться неблагодарными.'
      cn: 让我们敬拜那来拯救我们罪人的上帝，并以真实的信仰和感恩的心尊崇祂；让我们从受造物转向我们的造物主，从虚妄的世界转向我们的上帝，并且爱祂，寻求祂，以纯洁的心事奉祂，以免显为忘恩负义之人。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 得救吧！
  - type: paragraph
    text:
      ru: 'К непостижимому человеколюбию Сына Божия и к высокой чести рода человеческого еще и то надлежит, что апостол написал: «не Ангелов восприемлет Он, но восприемлет семя Авраамово» ( Евр 2:16 ). То есть Сын Божий, желая нас спасти, сотворился плоть от плоти нашей и кость от костей наших, уподобился нам во всем, кроме греха; Сын Божий стал сыном человеческим, и Бог неизменяемый человеком. Потому видим в Его святом Евангелии, что Он Себя Сыном человеческим неоднократно называл, из любви к нам и по смирению, по причине которых «не стыдится братиею называть» людей, говоря: «Возвещу имя Твое братиям Моим» ( Евр 2:11, 12 ). Поэтому и Бога, Отца Своего Небесного, соделал нашим Отцом и Отцом Его нарицать повелел, говоря: «Так молитесь: Отче наш, Иже еси на небесех» ( Мф 6:9 ). И по воскресении говорил ученикам: «Восхожу к Отцу Моему и Отцу вашему, и Богу Моему и Богу вашему» ( Ин 20:17 ).'
      cn: 论及上帝之子莫可测度之仁爱，以及人类崇高之尊荣，还有使徒所写之言，亦应纳入考量：「祂固然不扶助天使，乃扶助亚伯拉罕的后裔」（希伯来书 2:16）。也就是说，上帝之子，为救赎我们，成为了我们骨中的骨、肉中的肉，除罪之外，在凡事上与我们相似；上帝之子成为人子，不变之神成为人。因此，我们在祂的神圣福音中看到，祂屡次称自己为人子，是出于对我们的爱与谦卑，为此祂「不以为称他们为弟兄为耻」，说道：「我要将祢的名传与我的弟兄」（希伯来书 2:11，12）。因此，祂又将自己的天父上帝变为我们的父，并吩咐我们称祂为父，说：「所以，你们要这样祷告：我们在天上的父」（马太福音 6:9）。复活之后，祂对门徒说：「我升上去，到我的父，也是你们的父那里；到我的上帝，也是你们的上帝那里」（约翰福音 20:17）。
  - type: paragraph
    text:
      ru: Слава Богу, так высоко почтившему нас, недостойных! Слава Сыну Божию, уподобившемуся нам – ради нас! Почтим же и мы почтившего нас Господа, дабы и вечной от Него чести сподобиться благодатью Его.
      cn: 荣耀归于上帝，祂如此高贵地尊荣了我们这些不配之人！荣耀归于上帝之子，祂为了我们而取了我们的样式！那么，我们也当尊荣那尊荣了我们的上主，以便我们也能借着祂的恩典，从祂那里蒙受永恒的尊荣。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Видел ты, как человек Богом почтен. Знай точно, что человек, так Богом почтенный, «бесчестит Бога» , если бесстрашно закон Его святой нарушает, по свидетельству апостола: «Преступлением закона бесчестишь Бога» ( Рим 2:23 ). Слово это сказано Иудеям беззаконным, но ныне приличествует оно и христианам, которые на место Иудеев вступили, и закон Божий приняли, и познанием Бога хвалятся, но святой Его закон бесстыдно и бесстрашно нарушать не боятся. Поэтому постигнет их гнев Божий, если истинно к Богу не обратятся.'
      cn: 你曾看见，人是如何蒙上帝所尊荣的。务要确知，如此蒙上帝所尊荣的人，若是毫无畏惧地违犯祂的圣洁律法，就是「羞辱上帝」，正如使徒所见证的：「你因违犯律法而羞辱上帝」（罗马书 2:23）。这番话是向不守律法的犹太人说的，但如今也适用于那些取代了犹太人地位、接受了上帝律法、并以认识上帝夸口，却不惧怕无耻而毫无畏惧地违犯祂圣洁律法的基督徒。因此，如果他们不真正地归向上帝，上帝的忿怒必临到他们。
  - type: paragraph
    text:
      ru: О, когда бы человек рассуждал, как его Бог почтил и как он Бога, его почтившего, бесчестит, – непрестанно бы воздыхал, плакал и рыдал. Но, ослепленный, не видит этого. Отца своего по плоти оскорбит, – и сетует о том, плачет и рыдает часто, а Бога, Создателя своего, непрестанно оскорбляет и прогневляет, – и не чувствует этого. Берегись, возлюбленный, такого бесчувствия, и... обо мне молись.
      cn: 噢，如果人能思量上帝是何等尊荣了他，而他又是如何羞辱了那尊荣他的上帝，就会不住地叹息、哭泣和悲泣。但是，被蒙蔽的他却看不见这一切。他若冒犯了血肉之躯的父亲，就会为此而哀伤、哭泣、常常悲泣，而上帝，他的造物主，他却不住地冒犯并惹祂发怒，却毫无感觉。蒙爱者啊，务要警惕这样的麻木不仁，并且... 为我祈祷。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 得救吧！
  - type: paragraph
    text:
      ru: 'Желаешь ты еще узнать, как Бог человека почтил. Хвалю я твое желание и усердие и желаю, чтобы оно в сердце твоем вкоренилось. Ибо от этого родится истинная печаль ради Бога, которая для покаяния нужна, потому что, по словам апостола: «производит неизменное покаяние ко спасению» ( 2Кор 7:10 ). Потому с помощью Божией еще пространнее и яснее предложу о том же.'
      cn: 祢还想知道上帝如何尊崇了人。我赞许祢的愿望和热忱，并愿它在祢心中扎根。因为由此而生发出真正为上帝而有的忧伤，这忧伤是悔改所必需的，正如使徒所言：「生出没有后悔的悔改，以致得救」（2哥林多前书 7:10）。因此，借着上帝的帮助，我将更详尽、更清晰地阐述此事。
  - type: paragraph
    text:
      ru: Видел ты, что Бог, желая спасти человека, Сам для этого пришел, и сделал спасение Сам, а не через кого иного. Родился от чистой Девы плотью, чтобы мы, обветшавшие злобой бесовской, возродились духом. Сыном человеческим сделался, чтобы нас сынами Божиими сделать. На земле пожил и потрудился, чтобы нас, отпадших, на небо возвести. Трудился и утруждался, чтобы нам вечный покой подать. Голодал и жаждал, чтобы нас хлебом и питьем вечного утешения насытить и напоить. Поношение терпел, чтобы от нас вечное отнять поношение. Скорбь и болезнь терпел, чтобы нас вечной радости сподобить. Обесчестен и поруган был, чтобы нас вечной славой почтить. Претерпел страшные и ужасные страдания, чтобы от нас страдания вечные отнять и подать нам вечное прохлаждение во царствии Своем. Умер на Кресте, чтобы нас, умерших, оживить, и прочее.
      cn: 你看到，上帝愿拯救人类，亲自为此而来，亲自成就了救恩，而非通过他人。祂借着贞洁的童女，取了肉身而生，好使我们，这被魔鬼的恶毒所败坏、衰朽的，得以在灵里重生。祂成为人子，好使我们成为上帝之子。祂在世上生活并劳苦，好使我们这些堕落的，得以升入天堂。祂劳苦而困乏，好赐给我们永远的安息。祂忍饥受渴，好用永恒慰藉的粮与饮，使我们得饱足、得滋润。祂忍受羞辱，好除去我们永恒的羞辱。祂忍受忧伤与病痛，好使我们配得永恒的喜乐。祂受尽凌辱与嘲弄，好以永恒的荣耀尊崇我们。祂忍受了可怕而可怖的苦难，好除去我们永恒的苦难，并在祂的国度里赐予我们永远的安歇。祂死在十字架上，好使我们这些已死的，得以复活，等等。
  - type: paragraph
    text:
      ru: Видишь, как Он почтил нас. В смерти Его наша состоит жизнь. Болезни и язвы Его – наши исцеляют болезни. От бесчестия Его – наша честь и слава зависит. От рождения Его наше духовное и новое рождение последует. Скорбь Его нашу породила радость. Трудами Его мы обретаем вечный покой. Страданиями Его от вечных избавляемся страданий. Странствием Его при жизни на земле – небесное наследуем отечество. Голодом Его и жаждой вечное получаем прохлаждение. Словом, все существо блаженства, которое обретает человек, Ему одному приписываем, и приписывать должны. Если бы Он не взыскал нас, вечно бы в погибели были мы. Если бы Он не пришел к нам, всегда бы были в пленении у дьявола, который нас из рая пленил. Если бы Он не страдал за нас, в аду бы во веки страдали. Если бы Он не умер за нас, в вечной бы смерти погребены были.
      cn: 你看，祂如何尊荣了我们。在祂的死亡中，我们的生命得以存在。祂的疾病与创伤，医治了我们的疾病。从祂所受的羞辱，我们的尊荣与荣耀由此而来。从祂的降生，我们的属灵新生与再次重生随之而来。祂的忧伤，为我们带来了喜乐。借着祂的劳苦，我们获得了永恒的安息。借着祂的苦难，我们摆脱了永恒的苦难。借着祂在世间的寄居，我们继承了天上的家园。借着祂的饥渴，我们获得了永恒的畅饮。简而言之，人所获得的一切福乐的本质，我们都归于祂，也理当归于祂。若非祂寻找了我们，我们将永远处于毁灭之中。若非祂来到我们身边，我们将永远被魔鬼囚禁，这魔鬼将我们从乐园中掳走。若非祂为我们受苦，我们将在地狱中永远受苦。若非祂为我们而死，我们将被埋葬在永恒的死亡中。
  - type: paragraph
    text:
      ru: Так смерть Его стала жизнью нашей, бесчестие Его славой нашей, язвы Его исцелением нашим. Так от пришествия Его, страдания и смерти, как от источника, все наше духовное и вечное блаженство проистекает. Те, кто получает вечную жизнь, – все Его благодатью и человеколюбием получают. Читай об этом Святое Писание, учение Святых Отцов, учителей церковных, и церковные песни и стихи, – и увидишь сам. В том состоит вся наша надежда, радость, похвала, утешение, слава и все блаженство, что Христос Сын Божий, распятый и воскресший, и сидящий одесную Бога, и ходатайствующий о нас, есть наш Спаситель, Заступник и прибежище. Ибо если Он за нас, кто против нас? Из этого живого источника черпай, и во время зноя прохлаждай душу твою, и обо мне, грешном, поминай, и молись.
      cn: 如此，祂的死成了我们的生命，祂的羞辱成了我们的荣耀，祂的创伤成了我们的医治。如此，从祂的降临、受难和死亡——如同从源头——我们一切属灵和永远的福乐都由此涌流而出。那些领受永生的人，都是靠着祂的恩典和仁爱而领受的。读圣经，读圣教父和教会导师的教导，以及教会的圣歌和诗篇，你就会亲自看到。我们一切的希望、喜乐、赞美、安慰、荣耀和一切福乐都在于此：基督，上帝之子，被钉十字架又已复活，现今坐在上帝的右侧，并为我们代求，祂是我们的救主、代求者和避难所。因为祂若为我们，谁能敌挡我们呢？当从这活水源头汲取，并在炎热时使你的灵魂得享清凉，也请为我这罪人铭记和祈祷。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Надеюсь, что еще хочешь знать о том же и лучше уяснить, что убедило Сына Божия Господа нашего прийти в мир, воплотиться, пострадать и умереть за нас, – и я хочу о том поразмышлять и написать тебе, чтобы и у меня, размышляющего, и у тебя, слышащего, всегда великое сие дело обращалось перед душевными глазами. Ибо всегда должны мы о сем великом деле помнить и за это Бога нашего от сердца благодарить.
      cn: 我希望你仍愿知晓此事，并能更好地领悟，是什么促使我们的主、上帝之子降世，道成肉身，受难并为我们受死，——而我，也愿就此沉思并写信给你，好使我在沉思时，你在聆听时，这件伟大的事总能浮现在我们心灵的眼前。因为我们当常念及此伟大的事，并为此从心底里感谢我们的上帝。
  - type: paragraph
    text:
      ru: 'Известно из Святого Писания, что все люди, сколько их ни было, – и есть, и будет, – согрешили пред Богом. «Все согрешили и лишены славы Божией» ( Рим 3:23 ). Всех Писание заключило «под грехом» ( Рим 3:9 ). А «написано: проклят всякий, кто не исполняет постоянно всего, что написано в книге закона» ( Гал 3:10 ). Следовательно, все люди подверглись проклятию, как законопреступники ( Гал 3:10 ), и следовало всем, в силу проклятия, вечной казни и мучению преданным быть, ибо этого требует закон, проклинающий беззаконников.'
      cn: 圣经已知，所有的人，无论过去、现在、将来，都曾在上帝面前犯了罪。「世人都犯了罪，亏缺了上帝的荣耀」（罗马书 3:23）。圣经将所有人都圈在「罪中」（罗马书 3:9）。况且「经上记载：凡不恒守律法书上所记载的一切，去遵行不辍的，都是受咒诅的」（加拉太书 3:10）。因此，所有人都已蒙受咒诅，作为违犯律法者（加拉太书 3:10），而且，基于这咒诅，所有人都应被交于永远的刑罚和折磨，因为咒诅不法者的律法如此要求。
  - type: paragraph
    text:
      ru: 'Христос Сын Божий «от клятвы закона» искупил нас не «серебром или золотом, но драгоценною Своею Кровию» ( 1Пет 1:18 ) и смертью, как апостол написал: «Христос искупил нас от клятвы закона, сделавшись за нас клятвою, ибо написано: проклят всякий, висящий на древе» ( Гал 3:13 ). И так Христос сделался ради нас клятвой, дабы нам подать благословение, и грехи наши на Себя взял, дабы нам Свою правду верой подать, следовательно, и от вечной казни, которая клятве последует, избавил нас, и отворил вечное блаженство, которое благословению Божию последует. Так ему Святая Церковь поет: «Искупил ны еси от клятвы законныя честною Твоею Кровию, на кресте пригвоздився, и копием прободся, безсмертие источил еси человеком, Спасе наш: слава Тебе».'
      cn: 基督，上帝之子，从「律法的咒诅」中救赎了我们，不是「用金银，而是用祂宝贵的血」（彼得一书 1:18）和死亡，正如使徒所写：「基督既为我们成了咒诅，就赎出我们脱离律法的咒诅，因为经上记着：『凡挂在木头上的都是受咒诅的。』」（加拉太书 3:13）。基督如此为我们成了咒诅，为要赐予我们祝福；祂将我们的罪归于祂自己，为要藉着信将祂自己的义赐予我们。因此，祂也救我们脱离了随咒诅而来的永恒刑罚，并开启了随上帝祝福而来的永恒福乐。圣教会如此咏唱祂：「祢以祢尊贵的宝血，从律法的咒诅中救赎了我们；被钉于十字架，又被枪刺透，为世人流出了不死之源，我们的救主啊：荣耀归于祢！」
  - type: paragraph
    text:
      ru: 'Итак, видишь, что убедило Христа ради нас распяться и умереть: то есть неизреченная Его к нам любовь и крайняя наша бедность и погибель вечная, которой мы все подлежали. Читай об этом Послания апостольские, и внимай прилежно стихам и песням церковным, и яснее увидишь, и уразумеешь, и признаешь, что кроме Христа нет никому спасения. Слава спасшему нас Христу Богу, Которому себя и тебя поручаю в милость и защиту.'
      cn: 这样，你看，究竟是什么使得基督为我们被钉十字架并受死：那就是祂对我们不可言喻的爱，以及我们极度的贫乏和永恒的沉沦，这都是我们所有人所身陷其中的。关于此，请阅读使徒书信，并仔细留心教会的诗篇和圣歌，那么你将更清楚地看见，更透彻地领悟，并承认除了基督，无人能得救恩。荣耀归于拯救我们的基督上帝，我将自己和你都交托于祂，求祂施予怜悯和护佑。
  - type: paragraph
    text:
      ru: Спасайся о Христе.
      cn: 在基督里求得救恩！
  - type: paragraph
    text:
      ru: 'Видел ты, как страшна клятва (закона). Страшна клятва, страшен и грех. Клятва вечному осуждению и мучению предает, а грех клятве подвергает грешника. Потому страшно грешить и Божий закон нарушать, ибо нарушенный закон клятвой поражает грешника, клятва же вечной подвергает казни. Сладок людям грех, но горек плод его. Услышат люди согрешившие и непокаявшиеся: «Идите от Меня, проклятые, в огонь вечный, уготованный диаволу и ангелам его» ( Мф 25:41 ). Убоимся же, возлюбленные, клятвы и уклонимся от греха, дабы не подпасть снова клятве, от которой Христос искупил нас Кровью Своей. Лучше все каждый день терпеть, лучше во всякой болезни и страдании быть, лучше каждый день от биения и мучения страдать, лучше каждый день умирать, когда то возможно и нужно будет, нежели согрешать и под клятвой быть. Рассуждай об этом и берегись греха, как смертельного яда, который и душу и тело вечно умерщвляет.'
      cn: 你已看到律法的咒诅是何等可怕。咒诅可怕，罪也同样可怕。咒诅使人遭受永远的定罪与痛苦，而罪则使罪人受到咒诅。因此，犯罪和违犯上帝的律法是可怕的，因为被违犯的律法以咒诅击打罪人，而咒诅则使人遭受永远的刑罚。罪对人而言是甜美的，但其果实却是苦涩的。那些犯罪却不悔改的人将会听到：「你们这些被咒诅的人，离开我，进入那为魔鬼和他的天使所预备的永火里去罢！」(马太福音 25:41) 因此，蒙爱者啊，让我们畏惧咒诅，并远离罪恶，以免再次陷入咒诅，基督已用祂的宝血救赎我们脱离了这咒诅。宁可每日忍受一切，宁可身处各种疾病和痛苦之中，宁可每日遭受鞭打和折磨，宁可每日受死，倘若这是可能且必须的，也不要犯罪并处于咒诅之下。要思考此事，并警惕罪恶，如同致命的毒药，这毒药永远地戕害灵魂与身体。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'На вопрос твой: «Всех ли Христос Господь пришел спасти?» – отвечаю: «Все согрешили и лишены славы Божией» ( Рим 3:23 ). Все согрешили и погибли, потому всех и спасти пришел Господь. «Христос Иисус пришел в мир спасти грешников» ( 1Тим 1:15 ). Все грешники, потому всех и спасти пришел. «Христос за всех умер» ( 2Кор 5:15 ), потому и всех спасти пришел. Потому и Евангелие проповедать всей твари повелено, чтобы все услышавшие уверовали и спаслись ( Мк 16:15–16 ). И «во всю землю вышло вещание их» (апостолов), «и в концы вселенной слова их» ( Пс 18:5 ).'
      cn: 对于你的问题：「基督上主来，是要拯救所有人吗？」我回答说：「世人都犯了罪，亏缺了上帝的荣耀」（罗马书 3:23）。世人都犯了罪，并且灭亡了，因此上主来，是要拯救所有人。「基督耶稣降世，为要拯救罪人」（提摩太前书 1:15）。世人都是罪人，因此他来，是要拯救所有人。「基督替众人死了」（哥林多后书 5:15），因此他来，也是要拯救所有人。因此，也命令要将福音传给普世受造之物，好使所有听见的人都相信并得救（马可福音 16:15-16）。并且「他们的声音传遍全地」（指使徒们），「他们的言语传到地极」（诗篇 18:5）。
  - type: paragraph
    text:
      ru: 'Бог на лица человеческие не смотрит, Ему все равны, всех равно хочет спасти, никому не хочет погибели: «хочет, чтобы все люди спаслись и достигли познания истины» ( 1Тим 2:4 ). Поэтому для всех и Сына Своего в мир послал, чтобы все Его благодатью спасение получили. Следовательно, ради меня и тебя, и всякого человека пришел Христос Господь в мир, родился, пострадал и умер.'
      cn: 上帝不偏待人，在祂面前，人人平等，祂同样渴望拯救所有人，不愿任何人灭亡：「祂愿意所有的人得救，并达到真理的知识」（提摩太前书 2:4）。因此，为了所有人，祂差遣自己的圣子来到世上，好使所有人借着祂的恩典获得救赎。所以，为了你我，也为了所有的人，基督上主降临世间，祂降生、受苦并死去了。
  - type: paragraph
    text:
      ru: Слава пославшему Отцу, слава и Сыну, пришедшему грешных спасти! В этом наше утешение и радость состоит. Отсюда да почерпаем утешение, что и ради меня и тебя пришел, пострадал и умер Христос Господь. Да прохладит сей живой источник души наши грешные. Этим прохлаждайся во время зноя, утешайся, не изнемогай, стой и мужайся.
      cn: 荣耀归于差遣祂的父，荣耀也归于那来拯救罪人的子！在此包含着我们的安慰与喜乐。从此处我们当汲取安慰，即基督上主为了我，也为了你，降临、受难、并且死了。愿这活泉滋润我们罪恶的灵魂。在酷热之时，以此自我滋润，得安慰，不要气馁，要站立得稳，并要刚强壮胆。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'На вопрос твой: «Неужели все и спасаются, если ради всех Христос пришел в мир?» – отвечаю тебе кратко. Воля Божия хочет всем спасения, и Христос всех спасти пришел, как я писал тебе, но не все спасаются. Христос Господь по воскресении Своем сказал апостолам: «Идите по всему миру и проповедуйте Евангелие всей твари. Кто будет веровать и креститься, спасен будет; а кто не будет веровать, осужден будет» ( Мк 16:15–16 ). Потому, кто Его верой принимает и крестится «во имя Отца, и Сына и Святаго Духа» , тот спасается, а кто Его не принимает, тот погибает. Так не приняли Его Иудеи, будучи Его народом, как пишется: Господь Иисус «пришел к своим, и свои Его не приняли» ( Ин 1:11 ). Так не принимают Его магометане и прочие народы, и идолопоклонники, и ложные христиане, которые на языке веру имеют, но в сердце безбожие, о каковых апостол писал: «Они говорят, что знают Бога, а делами отрекаются, будучи гнусны и непокорны и не способны ни к какому доброму делу» ( Тит 1:16 ).'
      cn: 对于你的问题：「既然基督是为所有人来到世上，难道所有人都得救了吗？」我简要地回答你。上帝的旨意是愿所有人都得救，基督也为拯救所有人而来，如我曾写信告诉你的，但并非所有人都得救。主基督在祂复活之后，对使徒们说：「你们往普天下去，向一切受造物宣扬福音。凡信而受洗的，必然得救；不信的，必被定罪。」（ 马可福音 16:15-16）因此，凡以信德接受祂并奉「父、子、圣灵之名」受洗的，便得救；而不接受祂的，便灭亡。犹太人就没有接受祂，尽管他们是祂的子民，正如所记载的：主耶稣「来到自己的地方，自己的人却不接待祂」（ 约翰福音 1:11）。穆斯林以及其他民族，和偶像崇拜者，以及假冒的基督徒，他们口称有信德，但心中却无神，关于这些人，使徒曾写道：「他们自称认识上帝，却在行为上否认祂，因为他们是可憎的、悖逆的，在任何善事上都是无用的。」（ 提多书 1:16）
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'На вопрос твой: «Как Христос Господь нами принимается?» – по силе моей отвечаю тебе. Видел или, может быть, слышал ты, как граждане царя своего, в город их пришедшего, принимают: исходят из домов своих, встречают его с радостью и поклоняются ему, и всякий в дом свой желает его принять. Христос Господь Царь Небесный пришел в мир этот, как град великий, руками Его сотворенный, в котором мы живем. Выйдем же и мы к Нему навстречу, не ногами, но сердцами, и поклонимся Ему, и припадем со смирением, радостно сердцами и устами взывая к Нему: «Благословен Царь Израилев, пришедший спасти нас!»'
      cn: '对于你提出的问题：「基督上主是如何被我们接纳的？」——我尽我所能地回答你。


        你曾见过，或者或许听过，居民们是如何迎接来到他们城中的君王的：他们走出家门，欢喜地迎接他，并向他下拜，并且每个人都渴望将他接到自己的家中。基督上主，天上的君王，降临到这世界，这世界如同祂亲手所造的伟大城邑，我们就在其中居住。那么，我们也当出去迎接祂，不是用我们的双脚，而是用我们的心灵，并向祂下拜，以谦卑的心俯伏于祂面前，欢欣地，用我们的心灵和口唇向祂呼求说：「福哉以色列的君王，祂来是为了拯救我们！」'
  - type: paragraph
    text:
      ru: 'Только что пришел Он в мир, волхвы издалека пришли и поклонились Ему, и, «открыв сокровища свои, принесли Ему дары: золото, и ладан, и смирну» ( Мф 2:11 ). И так подобающей честью встретили Его как Царя. Так они показали образ нам, как Его встречать. Уподобимся же и мы этим верным рабам Его, и придем к Нему сердцами нашими (ибо Он ныне не на земле, как прежде, пребывает, но на небесах одесную Бога сидит), и примем Его как Царя нашего, и принесем Ему дары не вещественные, каковых Он не требует, но невещественные, как Богу: веру нелицемерную, благодарение сердечное и послушание из любви, как Царю своему; оставим мир с похотью своей, как дом, в котором ветхий наш человек упокоевается, и, покаянием и верою в Него очистив дома сердец наших, попросим Его со смирением, чтобы посетил нас.'
      cn: '祂刚刚降生于世，东方博士从远方前来，向祂俯伏朝拜，并且，「打开了他们的宝盒，将礼物献给祂，就是黄金、乳香和没药」（马太福音 2:11）。如此，他们以合宜的尊荣迎接祂为君王。他们就这样为我们树立了如何迎接祂的榜样。


        愿我们也效法祂这些忠心的仆人，以我们的心来到祂面前（因为祂如今不再像从前那样住在地上，而是在天上坐在上帝的右边），并接受祂为我们的君王，并且献给祂的礼物并非祂所要求的物质之礼，而是非物质的，如同献给上帝一般：真诚无伪的信仰，发自内心的感恩，以及出于爱的顺服，如同献给我们的君王一般；让我们离弃世界及其私欲，如同离弃那安歇着我们旧人的家，并且，藉着悔改和对祂的信仰，洁净我们心灵的居所，谦卑地祈求祂来探访我们。'
  - type: paragraph
    text:
      ru: Читаем во святом Его Евангелии, что Он никем не гнушался, как человеколюбец, но к зовущим Его в дома входил, и вечерял, и с самыми грешными ел и обращался и беседовал, как Пришедший грешников спасти. Не возгнушается и нами, грешными, и придет к нам, и посетит нас Своим человеколюбием, если только очистим дома наши истинным покаянием, сокрушением и сожалением о прежних грехах, и приготовим их, как Царю таковому, который в чистых сердцах обитает и упокоевается, и попросим Его со смирением и верой. Ибо если и не видим Его этими глазами, но Он неотлучно пребывает с любящими Его и невидимо посещает их.
      cn: '我们在祂的圣福音中读到，祂作为仁爱者，不厌弃任何人，反而进入那些邀请祂入家的人那里，并与他们一同晚餐，甚至与最罪恶的人一同用餐、往来、交谈，因为祂是降世拯救罪人的。

        祂也不会厌弃我们这些罪人，并会来到我们这里，以祂的仁爱拜访我们，只要我们以真实的悔改、痛悔并为往昔罪恶深感悔恨来洁净我们的家（心），并为那位君王预备好，因为祂居住并安息在洁净的心中，只要我们谦卑地、凭着信心向祂祈求。

        因为即便我们用肉眼看不见祂，但祂始终不离不弃地与爱祂的人同在，并无形地拜访他们。'
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 11 – 20
    cn: 书信 11 – 20
  children:
  - type: paragraph
    text:
      ru: 'Правильно ты спрашиваешь: «Что есть вера во Христа Иисуса?» Ибо не все веру эту имеют, которые имя Его святое исповедуют, но много между христианами есть таких, которые отрекаются от Него, хотя и зовут Его: «Господи, Господи!» Ибо Он Сам говорит таковым: «Что вы зовете Меня: Господи! Господи! – и не делаете того, что Я говорю?» ( Лк 6:46 )'
      cn: 你问得对：「何为信奉基督耶稣？」因为并非所有口称祂圣名的人都拥有此信仰，但基督徒中，有许多否认祂的人，尽管他们称祂为：「主啊，主啊！」因为祂自己就对这样的人说：「你们为何称我为：『主啊，主啊！』却不遵行我所说的呢？」 (路加福音 6:46)
  - type: paragraph
    text:
      ru: 'Я, по силе моей, с Его помощью отвечаю тебе. Ты прилежно рассуждай об этом важном деле, поскольку в нем начало и конец спасения нашего. Ибо Иисус – «Альфа и Омега» ( Откр 1:8 ), начало и конец нашего спасения: без истинной и живой в Него веры нет никому спасения, и потому в этой вере надобно христианину прилежно поучаться.'
      cn: 我尽我所能，靠祂的帮助回复你。你当殷勤思考关于这件重要的事情，因为这关乎我们救赎的开端与结局。因为耶稣是「阿拉法和俄梅戛」（启示录 1:8），是我们救赎的开端与结局：若没有真实而活泼地信靠祂的信仰，任何人便没有救赎，因此基督徒理当在这信仰中殷勤学习。
  - type: paragraph
    text:
      ru: 'Я писал тебе, что Бог, милосердный Создатель наш, будучи нелицеприятельным, ради всех нас, погибших, послал Сына Своего, чтобы спасти нас. Итак, Христос ради всех и каждого, ради меня, тебя и другого в мир пришел, родился, пострадал и умер: «один умер за всех» , – учит Павел ( 2Кор 5:14 ). Из этого можешь уразуметь, что значит истинно и сердечно веровать во Христа, а именно:'
      cn: 我曾写信告诉你，上帝，我们慈悲的创造主，祂是不偏待人的，为了我们所有已沦丧之人，差遣祂的圣子，以拯救我们。所以，基督为了所有的人，为了每一个人，为了我，为了你，也为了他人，来到世间，降生，受难，并死亡：「一人替众人死，」——保罗如此教导（哥林多后书 5:14）。由此你可以明白，真实并由衷地信仰基督，究竟意味着什么，亦即是：
  - type: paragraph
    text:
      ru: 1) Признать Его за истинного Бога, второе Лицо Святой Троицы, воплотившегося от Пресвятой Богородицы, Девы Марии.
      cn: 承认祂为真上帝，圣三一的第二位格，由至圣圣母、贞女马利亚道成肉身。
  - type: paragraph
    text:
      ru: 2) Признать Его за истинного Мессию, праотцам и отцам ветхозаветным обещанного, пророками проповеданного, в мире ожидаемого и от Бога Отца на спасение мира посланного.
      cn: 2) 承认祂为真正的弥赛亚，蒙旧约先祖与列祖应许的，蒙先知宣讲的，蒙世人期待的，并由父上帝为拯救世界而派遣的。
  - type: paragraph
    text:
      ru: '3) Признавать и иметь Его всякому верующему за Своего Искупителя и Спасителя, что он как прочих, так и его искупил от клятвы закона; как за прочих, так и за него Себя предал; как за прочих, так и за него страдал и умер, – и кроме Него иного посредника к получению вечного спасения не признавать, но в Нем едином начало и конец спасения своего полагать; любовь Его и благодеяния, всему миру оказанные, всякому верному себе присваивать. То есть: я и ты, если от сердца веруем в Него, должны от сердца говорить: Иисус Сын Божий мой Искупитель, мой Спаситель, мой Помощник, мой Заступник, моя жизнь и прочее, ради меня пришел в мир, пострадал, умер и Своей смертью меня от смерти избавил, – и почувствовать это в сердце своем, а не только устами говорить.'
      cn: 3) 凡信者都当承认并拥有祂为自己的救赎主和救世主，因祂既救赎了众人，也救赎了那信者脱离律法的咒诅；祂既为众人，也为那信者献上祂自己；祂既为众人，也为那信者受苦并受死，——并除祂以外，不承认有其他中保可得永恒的救恩，而只在祂一人身上安放自己救恩的始末；将祂所施予全世界的爱与恩惠，每一个忠信者都当归于自己。也就是说：我与你，若我们真心相信祂，就当真心说道：耶稣上帝之子是我的救赎主，我的救世主，我的帮助者，我的代求者，我的生命等等，祂为我降世，受苦、受死，并以祂的死亡使我脱离死亡——并要在自己心里感受它，而不仅仅是口头言说。
  - type: paragraph
    text:
      ru: 'Это есть свойство истинной, сердечной и живой веры – Бога своим Богом от сердца нарицать. Так апостол Павел говорит: «Живу верою в Сына Божия, возлюбившего меня и предавшего Себя за меня» ( Гал 2:20 ). Сын Божий всех возлюбил и за всех Себя предал, но Павлова верная душа себе это присваивает. Так и Фома к Нему говорит: «Господь мой и Бог мой» ( Ин 20:28 ), – хотя Он и всех Господь и Бог есть. Это свойство веры во многих местах Писания показывается, а особенно в псалмах, где Псаломник Бога своим Богом, царем, заступником, помощником, прибежищем, защитником, и прочее, называет, показывая веру свою в Него. Так Сам Бог называет Себя «Богом Авраама, Богом Исаака, Богом Иакова» ( Мф 22:32 ), ради веры их в Него, хотя Бог всех есть Бог. Так к Нему Дамаскин святой поет: «Пою тя, слухом бо, Господи, услышах и ужасохся. До мене бо идеши, мене ища заблуждшего», и прочее (Гласа 2-го песнь 4). И в другом месте: «Ты моя крепость, Господи, Ты моя и сила, Ты мой Бог, Ты мое радование», и прочее (Гласа 8-го песнь 4).'
      cn: 这是真实、由衷、活泼的信心所具有的属性——从心中称呼上帝为自己的上帝。正如使徒保罗所说：「我凭着对上帝之子的信心而活，祂爱我，为我舍弃自己」（加拉太书 2:20）。上帝之子爱了所有人，也为所有人舍弃自己，但保罗那忠信的灵魂将此归于自己。同样，多马也对祂说：「我的上主，我的上帝！」（约翰福音 20:28）——尽管祂是所有人的上主和上帝。信心这属性在圣经许多地方都有显明，尤其是在诗篇中，诗篇作者称上帝为他的上帝、君王、代求者、帮助者、避难所、保护者等等，以此显明他对上帝的信心。同样，上帝自己称呼自己为「亚伯拉罕的上帝，以撒的上帝，雅各的上帝」（马太福音 22:32），因着他们对祂的信心，尽管上帝是所有人的上帝。同样，圣大马士革的约翰向祂歌唱道：「我歌颂祢，上主，我凭着耳闻听见，便心生敬畏。祢来到我这里，寻找迷失的我。」等等（第二调第四首颂歌）。又在另一处：「祢是我的堡垒，上主，祢是我的力量，祢是我的上帝，祢是我的喜乐。」等等（第八调第四首颂歌）。
  - type: paragraph
    text:
      ru: 'Ибо и дети (одного) отца – каждый своим отца называет, один говорит: отец мой, и другой также говорит: отец мой, хотя отец (его) и всех их есть отец, потому когда вообще говорят о нем, то его называют общим своим отцом, говоря: отец наш то и то делает, или сказал нам, или приказал, и прочее. Также и верные, общую веру в Бога показывая, называют Его Богом и Отцом своим, говоря: Бог и Отец наш, – и молятся Ему: «Отче наш» , и прочее. А когда каждый свою веру особенно хочет показать, то говорит: Бог мой, Создатель мой, Заступник мой, Господь мой, Царь мой, Спаситель мой, и прочее. Ибо вера сердечная – это как малое детище, к матери своей прилепляющееся, и при ней быть всегда хотящее, и во всяких нуждах к ней руку простирающее.'
      cn: 因为即使是（同一个）父亲的孩子们——每个人都称呼自己的父亲，一个说：我的父亲，另一个也说：我的父亲，尽管父亲是他们所有人的父亲，所以当他们普遍谈论他时，就称他为他们共同的父亲，说：我们的父亲做了这个和那个，或者对我们说过，或者吩咐过，等等。同样，信徒们显明他们对上帝的共同信仰，称祂为他们的上帝和父亲，说：我们的上帝和父亲，——并向祂祈祷说：「我们的天父」，等等。而当每个人尤其想要显明自己的信仰时，就说：我的上帝，我的造物主，我的护佑者，我的主，我的君王，我的救主，等等。因为发自内心的信仰——就像一个幼小的孩子，紧贴着自己的母亲，并且总是渴望待在她身边，并在一切需要中向她伸出双手。
  - type: paragraph
    text:
      ru: 'Так и вера, все создания оставив, к Богу, от Которого произошла, всегда прилепляется, и в нуждах к Нему единому прибегает и помощи просит и защиты, и на Него – как на Бога своего, всесильного, премудрого, истинного, и потому никогда не лгущего, милосердного и благоутробного Отца, в Котором все свое блаженство полагает и от Которого отлучиться за крайнее бедствие поставляет, так же, как дитя малое при матери быть за безопасность и блаженство свое поставляет, и отлучиться от нее за бедствие свое; – так, говорю, вера на Него, Бога, Создателя и Отца своего, всю свою надежду полагает и Его крепко держится, как Защитника и Помощника своего, уповая на всесильную Его помощь, милость и неложное обещание: «Не оставлю тебя и не покину тебя» ( Евр 13:5 ).'
      cn: 同样，信心舍弃一切受造物，总是依附于它所源自的上帝，并在急难中唯独投靠祂，祈求帮助与庇佑。并视祂为自己的上帝——全能的、至智的、真实的，因此永不虚谎的，慈悲并满怀怜悯的父亲，信心在祂里面寄托自己所有的福乐，并视与祂分离为极大的灾祸；正如幼小的孩童视与母亲同在为自己的安全和福乐，视与母亲分离为自己的不幸一样——我说，信心就这样将自己全部的希望寄托于祂，这位上帝，自己的创造者和父亲，并紧紧抓住祂，视祂为自己的护佑者和帮助者，仰赖祂全能的帮助、怜悯以及无伪的应许：「我总不撇下你，也不离弃你」（希伯来书 13:5）。
  - type: paragraph
    text:
      ru: 'Ибо, что верным вообще обещается от Бога, то всякая верная душа себе присваивает в особенности, и то благодеяние, которое Богом всему миру оказано, она для себя привлекает. Павел святой обо всех верных вообще говорит: «Христос сделался для нас премудростью от Бога, праведностью и освящением и искуплением» ( 1Кор 1:30 ), – верная же душа все то себе присваивает, говоря: Христос моя премудрость, правда, освящение и избавление, ибо ведает совершенно верная душа, что без Христа нет правды, нет освящения, нет избавления, и всякая премудрость без Христа – буйство. Верой во Христа всякий умудряется, оправдывается, освящается и избавляется. Без Христа же всякий мудрец безумен, всякий праведник грешен, всякий чистый нечист, и всякий без Него погибает. Ибо во Христе как благословение, так и блаженство всякое духовное всем и всякому верному Богом обещано, и в Писании Святом написано, и верой просящим и надеющимся подается. Словом, всякому верному должно Христа со всеми Его благодеяниями, всему миру явленными, себе присваивать.'
      cn: 因为，上帝普遍应许给众信者的，每一个信实的灵魂都特别为自己据为己有，并且那由上帝施予全世界的恩惠，她也为自己吸引过来。圣保罗论及所有信者时普遍而言：「基督成了我们的智慧、公义、圣洁和救赎，都来自上帝。」（哥林多前书 1:30）——而信实的灵魂则将这一切归于自己，说道：基督是我的智慧、公义、圣洁和救赎，因为信实的灵魂深知，离了基督就没有公义，没有圣洁，没有救赎，并且一切离了基督的智慧都是愚妄。借着对基督的信心，每个人都得以有智慧，得以称义，得以成圣，并得以被救赎。而离了基督，任何智者都是愚昧的，任何义人都是有罪的，任何洁净之人都是不洁的，并且每个人离了祂都将灭亡。因为在基督里，一切属灵的福佑和福祉，都已由上帝应许给所有人，以及每一个信者，并且已写在圣经中，并借着信心赐予求告者和盼望者。总而言之，每一个信者都当将基督，连同祂向全世界显明的一切恩惠，归为己有。
  - type: paragraph
    text:
      ru: И воистину так есть. Ибо если Христос всех возлюбил и Себя за всех предал, то и меня и тебя возлюбил, и за меня и тебя Себя предал, поскольку и я и ты в числе всех. Если за всех пострадал и умер, то и за меня и тебя, поскольку и я и ты в числе всех, и прочее. Ибо Бог лицеприятия не имеет, и Христос равно за всех умер, хотя смерть Его тем только полезна, которые истинной верою Его принимают и благодарное сердце Ему являют. Если Христос всех грехи на Себя взял и за них пострадал и умер, то и за мои и твои, ибо и я и ты в числе всех, и прочее.
      cn: 确实如此。因为如果基督爱了众人，并为众人献上了自己，那么祂也爱了我与你，并为我与你献上了自己，因为我与你都在众人之列。如果祂为众人受苦并死了，那么也为我与你，因为我与你都在众人之列，以此类推。因为上帝不偏待人，并且基督平等地为众人死了，尽管祂的死只对那些以真信仰接纳祂并向祂显出感恩之心的人有益。如果基督担当了众人的罪，并为此受苦并死了，那么也为我的与你的（罪），因为我与你都在众人之列，以此类推。
  - type: paragraph
    text:
      ru: Видишь, что есть вера во Христа. Можешь отсюда видеть и то, что, кто такую веру имеет, тот не захочет грешить, но всяким грехом будет гнушаться, ведая, что Христос, Искупитель его, горькую чашу страдания пил за грехи, – и ничего ради такого Искупителя своего не пощадит в знак благодарности к Нему. И не только деньги, когда просит кто ради Христа, но и душу свою, в случае нужды, ради славы и чести Его отдаст, и ко всякому страданию и терпению готовым себя покажет ради любви Его, а не ради заслуги какой, ведая, что Христос все ему заслужил страданием и смертью Своей из любви, как ко всем, так и к нему. И воистину всякому верному должно это делать ради единой любви и благодарности к Искупителю своему, Который нас не «серебром и золотом, но честною Своею Кровию искупил» ( 1Пет 1:18 ). Ибо, что ни делаем и что ни терпим ради имени Его, должное отдаем Ему, поскольку «Он прежде возлюбил нас» ( 1Ин 4:19 ), и предал Себя за нас, так что, хотя бы мы всю жизнь нашу, каждый день страдали ради Него, то и так ничего бы не могли Ему воздать. «Что воздадим Господу» нашему «за все, что Он даровал нам?» ( Пс 115:3 )
      cn: 你看到有对基督的信仰。从此你也能看到，凡有此种信仰的人，便不会愿意犯罪，而是会憎恶一切罪恶，因为他知道，基督，他的救赎者，为罪喝了苦涩的受难之杯，并为了他这样的救赎者，会毫不吝惜地献出一切，以此表达对祂的感恩。并且，当有人为基督的缘故有所请求时，他不仅会献出金钱，甚至在必要时，为了祂的荣耀和尊贵，也会献出自己的灵魂，并且会为了祂的爱，表明自己已准备好承受一切苦难和忍耐，而不是为了某种功德，因为他知道，基督以祂的受难和死亡，为他赢得了这一切，这源于祂对众人和对他的爱。并且，每一个忠信的人，确实都当这样做，单单为了对他的救赎者的爱和感恩，祂救赎我们，不是凭着「金银，而是凭着祂宝贵的血」（彼得前书 1:18）。因为凡我们为祂的名所做所受的一切，都只是归还祂所当得的，因为「祂先爱了我们」（约翰一书 4:19），并为我们舍弃了自己，所以，即使我们一生，日日夜夜为祂受苦，也无法向祂报答分毫。「我拿什么报答上主，为祂向我所施的一切恩惠？」（诗篇 115:3）
  - type: paragraph
    text:
      ru: Словом, всегда должниками находимся пред Ним, что ни делаем ради Него, ибо ничем и никак не можем Его отблагодарить. Ибо заслуги Его, ради нас учиненные, – бесконечны, как и Сам Он бесконечен, будучи Богом, и мы – создание Его, душа и тело наше – Его, и весь состав наш – Его, и то, что живем и движемся, – Его милость, и жизнь временную и вечную нашу Ему приписать должно. Его хлебом питаемся, Его питьем прохлаждаемся, Его одеждой одеваемся, Его светом просвещаемся, Его огнем согреваемся, в Его покоях живем, и прочее, и что хотим и делаем Ему угодное, Его благодати приписать должны, ибо без Него «не можем делать ничего» ( Ин 15:5 ). Что же наше собственное? – Немощь, растление, тьма, злость, грехи... Слава Его милосердию!
      cn: 总之，我们无论为祂做什么，总是祂面前的亏欠者，因为我们无论如何都无法报答祂。因为祂为我们所行的功劳是无限的，正如祂身为上帝本身是无限的一样；我们是祂的受造物，我们的灵魂和身体都属祂，我们的一切都属祂，我们得以存活和活动，是祂的怜悯；我们的今世生命与永恒生命都应归于祂。我们以祂的饼为食，以祂的饮品清凉，以祂的衣裳为衣，蒙祂的光照耀，以祂的火为暖，居住在祂的居所里，诸如此类；我们一切所愿所行讨祂喜悦之事，都应归于祂的恩典，因为没有祂，「我们什么都不能做」（约翰福音 15:5）。那么，什么是我们自己的呢？——软弱、败坏、黑暗、恶毒、罪恶……荣耀归于祂的怜悯！
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Резонно ты и о том спрашиваешь: что есть вера живая и сердечная? Ибо без нее человеку спастись невозможно. Хотя и из предыдущего моего письма можешь познать ее, однако я тебе из Святого Писания отвечаю, дабы лучше познал и утвердился в том.'
      cn: 你问得很有道理，什么是活泼而发自内心的信心？因为没有它，人就无法得救。虽然你从我之前的信中可以认识它，然而我从圣经中回答你，以便你更好地认识并在这事上得以坚定。
  - type: paragraph
    text:
      ru: 'Иаков, святой апостол, говорит каждому из нас: «Покажи мне веру твою от дел твоих» ( Иак 2:18 ). Видишь, что живую веру от дел должно показать. Как живость естественного человека познается от действий, дыхания, движения, речей, дел, приема пищи и прочее, так живость веры, живущей в сердце человеческом, познается от добрых дел, страха Божия, любви, терпения, кротости, милосердия, воздержания, верности, истины и прочее. И как доброе дерево от добрых плодов, так христианин, веру живую и сердечную имеющий, от добрых дел познается. Ибо как дерево доброе не может творить злого плода, так и истинный христианин, пока живую веру имеет, не может злого дела творить. «Всякий, рожденный от Бога, не делает греха, потому что семя Его пребывает в нем; и он не может грешить, потому что рожден от Бога» ( 1Ин 3:9 ).'
      cn: 雅各，圣使徒，对我们每个人说：「你将你的信心从你的行为显给我看」（雅各书 2:18）。你看，活泼的信心必须从行为中显明出来。正如一个自然人的生命力，是从他的行动、呼吸、运动、言语、作为、进食等等被认识的；照样，住在人心中的信心的生命力，是从善行、敬畏上帝、爱、忍耐、温柔、慈悲、节制、忠信、真理等等被认识的。正如一棵好树从好果子被认识，照样，一个拥有活泼和发自内心信心的基督徒，是从善行被认识的。因为正如一棵好树不能结出坏果子，照样，一个真正的基督徒，只要他拥有活泼的信心，就不能行恶事。「凡从上帝所生的，就不犯罪，因为祂的种子常存在他里面；他也不能犯罪，因为他是从上帝所生的。」（约翰一书 3:9）
  - type: paragraph
    text:
      ru: 'И ты того раба за верного своего раба имеешь, который нелицемерно тебе служит и во всем повеление твое исполняет; так и христианин – тогда Богу верный раб, когда верно Ему служит и заповеди Его исполняет. Так Авраам праотец оказался верным Богу рабом от послушания: по повелению Его вознес Исаака, сына своего, на жертвенник ( Быт 22 ; Иак 2:21 ). Так и Раав, блудница, верной Богу от дел показалась, поскольку приняла соглядатаев, от Иисуса посланных осмотреть город Иерихон, и скрыла их в доме своем, и иным путем вывела их (Ис Нав 2 ; Иак 2:25 ). Так и прочие верные и святые, как Ветхого, так и Нового Завета, от дел своих добрых показали в Бога веру свою.'
      cn: 你视那仆人为你的忠仆，他真诚地服侍你，凡事都遵行你的吩咐；基督徒亦是如此——当他忠实地服侍上帝并遵行祂的诫命时，他才是上帝忠实的仆人。亚伯拉罕先祖也是如此，他因顺从而成为上帝忠实的仆人：他遵照上帝的吩咐，将自己的儿子以撒献在祭坛上（创世记 22；雅各书 2:21）。妓女喇合也是如此，她因行为而显明自己对上帝的忠实，因为她接待了约书亚派去侦察耶利哥城的探子，并将他们藏在自己家中，又从另一条路将他们送走（约书亚记 2；雅各书 2:25）。旧约和新约中其余的忠信圣徒也是如此，他们都藉着自己的善行显明了自己对上帝的信仰。
  - type: paragraph
    text:
      ru: 'Бог говорит в Писании каждому из нас: «Я Господь Бог твой» . Если же ты Его за Бога твоего признаешь, – чего живая вера требует, – и познаешь, Кто Он и чего от тебя требует, как не будешь Его почитать верою, страхом, любовью, послушанием? Ибо всего этого вера твоя в Него от тебя требует. Как не будешь со старанием по слову Его жить, когда точно познаешь, что слово, в Писании Святом содержащееся, есть Слово Божие, и как ко всем, так и к тебе говорит Он там: веруй, люби, будь милосерден, отпускай обиды, терпи, просящему дай, и прочее? Ибо само слово сие, как Слово Бога твоего, поощрит и подвигнет тебя к послушанию. Как не подвигнет, если сердечно веруешь, что Он твой Создатель, Промыслитель, Хранитель, Защитник, Питатель, высочайший Благодетель, и все твое Блаженство временное и вечное, еще же и Судия праведный и Мститель за ослушание?..'
      cn: 上帝在圣经中对我们每个人说：「我是上主，你的上帝。」如果你承认祂是你的上帝——这是活泼的信心所要求的——并认识祂是谁，以及祂对你有什么要求，你怎能不用信心、敬畏、爱和顺服来尊崇祂呢？因为你对祂的信心向你要求所有这一切。当你确切地认识到，圣经中所包含的话语是上帝的道，并且祂在那里，既对所有人说，也对你说：「要相信，要去爱，要有怜悯心，要饶恕伤害，要忍耐，要施予求助者」以及诸如此类的话语时，你怎能不努力按祂的话语生活呢？因为这话语本身，作为你上帝的道，会激励并推动你顺服。如果你真心相信，祂是你的创造主、护佑者、保守者、护卫者、供养者、至高无上的施恩者，并且是你今生和永恒的一切福乐，更是公义的审判者以及对不顺服者的报应者，怎能不推动你呢？
  - type: paragraph
    text:
      ru: Почитаешь царя своего земного, как царя, и отца по плоти, как отца, к тому же и всякого человека почтенного, – как же Бога, Небесного Царя и Отца, создавшего и искупившего тебя, и пекущегося о тебе, пред Которым «всякое колено небесных, земных и преисподних» со страхом «преклоняется» ( Флп 2:10 ), у Которого в руке ты и весь свет, – как, говорю, почитать Его не будешь? Как не будешь любить Его, Создателя и Отца твоего, как не будешь верить Ему, истинному и неложному, как не будешь бояться страшного и нелицеприятного Судии? А отсюда, как от источника, добрые дела проистекут.
      cn: 你既然敬重你属世的君王如同君王，你肉身的父亲如同父亲，并且敬重一切受人尊敬者——那么，上帝，那位天上的君王和父亲，祂创造并救赎了你，看顾着你，在祂面前「天上、地上和地底下的一切」都带着敬畏「屈膝」（腓立比书 2:10），你和整个世界都在祂手中——我说，你又怎能不敬重祂呢？你又怎能不爱祂，你的创造主和父亲呢？你又怎能不相信祂，那真实无伪者呢？你又怎能不敬畏那位可畏而不偏不倚的审判者呢？而由此，如同从源头一样，善行必将流溢而出。
  - type: paragraph
    text:
      ru: Вера учит человека и показывает ему, что как ради всех, так и ради него Бог Сына Своего не пощадил и в мир послал на спасение всех. Как же он и к пославшему Отцу и к посланному Его Сыну сердечного благодарения не будет оказывать и сего великого дела не будет почитать высшим всех сокровищ мира?
      cn: 信仰教导人并向他显示，上帝既为所有人，也为他，不顾惜自己的儿子，并将他差遣到世上，为要拯救所有人。他怎能不对那位差遣的父和对祂所差遣的儿子不献上由衷的感谢，又怎能不将这伟大的事奉为世间所有珍宝之上呢？
  - type: paragraph
    text:
      ru: Верное сердце знает, что Бог, Создатель, Искупитель и высочайший его Благодетель, всяким грехом оскорбляется, прогневляется и раздражается. Как же не будет подвизаться против всякого греха, которым Бог его раздражается? Человека, благодетеля малого, не хочешь прогневать, – Бога ли восхочешь, Благодетеля, грехом прогневать?
      cn: 忠信的心知道，上帝，即造物主、救赎主，以及他至高的施恩者，会因一切罪恶而被冒犯、被激怒、并被惹动。他怎能不努力争战，去对抗那一切使上帝被惹动的罪恶呢？一个渺小的施恩者，你尚不愿触怒，难道你竟愿以罪恶来触怒上帝这位施恩者吗？
  - type: paragraph
    text:
      ru: Вера знает, что против греха стоять, и победить его своей силой, и истинную добродетель творить не может, поэтому воздыхает и усердно молится к Богу своему, чтобы Он помог в том.
      cn: 信德知道，它不能抵挡罪恶，也不能靠自己的力量战胜它，更不能行真正的美德，因此发出叹息，并恳切地向自己的上帝祈祷，求祂在此事上帮助。
  - type: paragraph
    text:
      ru: Вера, ведая, что христианское наследие не в мире, но на небесах, где и отечество их сокровенное есть, – на него взирает, к нему стремится, и достичь старается, и потому в мире ничего не хочет, ни чести, ни славы, ни богатства, ни сладостей, чего сыны века сего ищут, и ни к чему не прилагает сердца своего, и все, пищу, питье и прочее, ради нужды и немощи плотской употребляет, и крайне опасается, чтобы небесного наследия не лишиться. Поэтому «со страхом и трепетом совершает свое спасение» ( Флп 2:12 ).
      cn: 信心知道，基督徒的产业不在世上，乃在天上，他们隐秘的家乡也在那里。信心仰望它，渴慕它，并努力争取得到它，因此在世上什么也不求，不求尊荣，不求荣耀，不求财富，不求享乐，这些都是今世之子所追求的。信心不把自己的心附着于任何事物，而一切，食物、饮水及其他，都只因肉身需要与软弱而使用，并且极其谨慎，唯恐失去天上的产业。因此，「就当恐惧战兢，作成你们得救的工夫」（腓立比书 2:12）。
  - type: paragraph
    text:
      ru: Словом, верное сердце в мире этом пребывает как путник на пути, как странник и пришелец на чужой стороне, как изгнанный от отечества и дома своего, «ибо не» имеет «здесь постоянного града, но» ищет «будущего» ( Евр 13:14 ), которого «художник и строитель Бог» ( Евр 11:10 ).
      cn: 简言之，忠信的心在这世上居留如同路上的行者，如同异乡的客旅与寄居者，如同被逐出故土家园的人，『因其在此处没有常存的城，乃是寻求那未来的城』（希伯来书 13:14），那城是『上帝所设计与建造的』（希伯来书 11:10）。
  - type: paragraph
    text:
      ru: 'Итак, видишь отчасти, что такое истинная и живая вера, то есть та, живость которой от действий и дел добрых показывается. Этой живой вере противополагается мертвая вера, о которой святой апостол Иаков написал: «Как тело без духа мертво, так и вера без дел мертва» ( Иак 2:26 ). Мертвую веру имеют те, которые христианское имя имеют, но не по-христиански живут; чают, или говорят только, что написано в Символе: «чаю воскресения мертвых», но противно вере в воскресение мертвых живут; слышат в Писании о вечной жизни и славе ее, но к мирским вещам, чести, славе, богатству, роскоши прилепились и мир этот за отечество и рай себе поставляют. Мертвую веру имеют те, которые в приданное дочерям своим многого богатства не жалеют, а ради имени Христова просящему или ничего не дают, или копейкой и мелкой монетой довольствуются. О таковых апостол Иаков говорит: «Если брат или сестра наги и не имеют дневного пропитания, а кто-нибудь из вас скажет им: идите с миром, грейтесь и питайтесь, – но не даст им потребного для тела: что пользы» , ( Иак 2:15–16 )?'
      cn: 如此，你便能从部分了解什么是真正且活泼的信仰，也就是说，其活泼性是借由行为和善行彰显出来的。与这活泼信仰相对的是死的信仰，圣使徒雅各曾论及此写道：「身体没有灵魂是死的，照样，信仰没有行为也是死的。」 (雅各书 2:26) 拥有死的信仰的人，是那些虽拥有基督徒之名，却不以基督徒方式生活的人；他们期盼，或只在信经中口说：「我期待死人复活」，但他们的生活却与对死人复活的信仰相悖；他们在圣经中听到永生及其荣耀，却依恋世俗之事，依恋尊荣、声誉、财富、奢华，并将这世界视作自己的家乡和乐园。那些拥有死的信仰的人，为给女儿置办嫁妆毫不吝惜大量财富，却为基督之名向求助者或一无所予，或仅以戈比和零钱打发。论及这类人，使徒雅各说：「若是弟兄或是姊妹，赤身露体，又缺了日用的饮食，你们中间有人对他们说：『平平安安地去吧！愿你们穿得暖，吃得饱！』却不给他们身体所需用的，这有什么益处呢？」 (雅各书 2:15-16)
  - type: paragraph
    text:
      ru: Таковые люди живут для мира и прихотей своих, ибо им угождают, а не Богу, Которому не угождают послушанием. Для Бога они мертвы, хотя и живут. Как? Рассуждай. Как мертвый не слышит и не внимает, что ему ни говорится, так и этим духовным мертвецам, что ни говорит Бог в Писании, не внимают тому. Слово Божие для них, как для глухого пение, и как бы к другим, а не к ним слово говорится.
      cn: 这样的人为世界和自己的私欲而活，因为他们取悦的是世俗和自己的私欲，而非上帝；他们并未以顺服来取悦上帝。在上帝眼中，他们是死的，尽管他们还活着。如何呢？思考吧。正如死人听不见、也不留意别人对他所说的一切话，同样，这些在灵性上已死的人，无论上帝在《圣经》中说了什么，他们都不留意。上帝的话语对他们而言，如同对聋子唱歌，仿佛这话说的是对别人，而非对他们说的。
  - type: paragraph
    text:
      ru: 'Мертвая вера тогда в человеке оживляется, когда в нем оживляется Божие Слово, и начнет человек в себе мыслить, что и ему Бог в Писании Своем говорит и повелевает, как и прочим людям, и по слову Его святому начнет нравы свои исправлять, а о прежней жизни неисправной с истинным сожалением и сокрушением сердца будет каяться. Ибо всегда истинной и живой вере предшествует истинное покаяние и обращение от греха к Богу. Без такого покаяния и обращения веры истинной не может быть. Почему и сказано Спасителем: «Покайтесь и веруйте в Евангелие» ( Мк 1:15 ).'
      cn: 死的信仰在人里面被活化，是当上帝的圣言在他里面被活化，人便会开始思考，上帝在祂的圣经中对他说话并命令，如同对其他人一样。他会按照祂的圣言开始修正自己的行为，并怀着真正的悔恨和痛悔之心，为过去不端的生活而悔改。因为真正的和活泼的信仰总是以真正的悔改和从罪转向上帝的皈依为先导。没有这样的悔改和皈依，就不可能有真正的信仰。因此救主也曾说过：「你们要悔改，并相信福音」（马可福音 1:15）。
  - type: paragraph
    text:
      ru: Видишь, что вначале полагается покаяние, а потом вера. Истинное покаяние, которое заключается в том, чтобы возненавидеть свою прежнюю греховную жизнь и истинно о ней сокрушаться и сожалеть, очищает сердце и приготавливает его к восприятию веры во Христа, в Евангелии проповедуемого, Которого кающееся сердце как своего Искупителя принимает и Его благодатью утешается.
      cn: 你看，首先是悔改，然后才是信心。真正的悔改，即憎恶自己过去的罪恶生活，并为此深切悔恨和懊悔，洁净人心，并预备人心领受对福音中所宣讲之基督的信心。悔改的心将祂视为自己的救赎主来接受，并因祂的恩典而蒙受安慰。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Хочешь ты лучшего изъяснения о покаянии и сожалении истинном. Верное и доброе желание. Ибо в истинном покаянии и сожалении вся христианская жизнь состоит. Жизнь истинного христианина, как видим из псалмов и прочих святых книг, не иное что есть, и должно быть, как всегдашнее покаяние до кончины его.
      cn: 你想要对真正的悔改和懊悔有最佳的阐明。这是正确且良善的愿望。因为基督徒的整个生命都包含在真正的悔改和懊悔之中。正如我们从诗篇以及其他圣书中看到的那样，真正的基督徒的生命，不是别的什么，也应当是，唯有恒常的悔改，直到他生命的终结。
  - type: paragraph
    text:
      ru: Видел ли ты, что делает сын, когда отца своего, родившего и воспитавшего его, ослушанием и грубыми поступками оскорбит? Ругает себя, плачет и сердцем сокрушается, и судит себя достойным наказания отца, потому только, что отца своего прогневал и оскорбил. Этот пример учит нас каяться и сожалеть, что грехами Бога прогневляем и оскорбляем. Если сын по плоти, отца своего прогневав, жалеет, тоскует и ругает себя, то тем более христианам должно жалеть, сокрушаться, тосковать и ругать себя, и достойными наказания признавать, когда прогневают Бога, Небесного Отца, Который есть едина любовь, благостыня и святость. Тяжко отца – человека, от которого мы родились, прогневать, но несравненно тяжелее Бога, Творца и Промыслителя, прогневать.
      cn: 你可曾见过，儿子以忤逆和粗鲁的举动冒犯了他那生养、抚育他的父亲时，他会怎么做？他责备自己，哭泣并心里痛悔，并且判定自己理当受父亲惩罚，只因他惹怒并冒犯了自己的父亲。这个例子教导我们悔改和懊悔，因为我们以罪恶惹怒并冒犯了上帝。倘若肉身之子，在惹怒了自己的父亲之后，都会懊悔、悲痛并责备自己，那么基督徒就更当懊悔、痛悔、悲痛并责备自己，并且承认自己理当受惩罚，当他们惹怒了上帝，那天上的父，祂是独一的爱、良善与圣洁。惹怒那生我们养我们的父亲——一个人——是件严重的事，但惹怒上帝，那创造者和护理者，则是不可比拟地更严重。
  - type: paragraph
    text:
      ru: Рассуди только, что Бог нам сделал и делает. Он нас и родителей наших создал, и создал нас не скотами, птицами и прочими животными, но разумными людьми. Не Его ли солнце, месяц и звезды, которые светят нам? Не Его ли облака, которые, как мехи, воду по всей вселенной разносят и изливают на нас и на нивы наши? Не Его ли воздух, который сохраняет дыхание и жизнь нашу? Огонь, который согревает нас и пищу нашу варит, Его есть. Вода, которая поит нас и скотов наших, хлеб, которым питаемся, одежда, которой одеваемся и согреваемся, Его есть. Дома наши, в которых живем и упокоеваемся, Его есть. Словом, в благодеяниях Божиих заключены мы так, что и минуты без них не можем пробыть.
      cn: 你只需思想，上帝为我们做了什么，以及正在做什么。祂创造了我们和我们的父母，并且创造我们不是牲畜、飞禽和其他动物，而是有理智的人。照耀我们的太阳、月亮和星辰，不都是祂的吗？那些像皮袋一样，将水遍布宇宙并倾倒在我们和我们田地上的云彩，不都是祂的吗？维系着我们的呼吸和生命的空气，不都是祂的吗？温暖我们，烹煮我们食物的火，是祂的。滋润我们和我们牲畜的水，我们赖以为生的粮食，我们用以穿着保暖的衣裳，都是祂的。我们居住和安歇的房屋，是祂的。总而言之，我们被上帝的恩惠所环抱，以至于片刻都离不开它们。
  - type: paragraph
    text:
      ru: 'Помысли сатанинскую лютость и неукротимую вражду против нас: он с нами непрестанно воюет, подкладывает сети, копает ров, и «ходит, как рыкающий лев, ища, кого поглотить» ( 1Петр 5:8 ). Бог нас хранит, не допускает ему нас погубить, и что удивительнее, человек грешит, но Бог его хранит; человек отдает себя врагу, но Бог ему не дозволяет его взять и в погибель свести; человек от Бога отступает, но Бог его еще не оставляет; человек Бога прогневляет, но Бог еще милости Своей от него не отнимает, иначе в одну минуту погиб бы человек, если бы отнял Бог Свою всемогущую руку от него, хранящую его. Ибо сатана того и ждет, чтобы человека оставленным увидеть и тогда погубить. Смотри на благость Божию, которая и врагам благотворит; смотри и на лютость дьявольскую, и берегись.'
      cn: 思量撒旦的凶残和对我们不懈的敌意：他不断地与我们争战，设下罗网，挖掘陷阱，并且「如同吼叫的狮子，遍地游行，寻找可吞吃的人」 ( 彼得前书 5:8)。上帝保守我们，不容许他毁灭我们。更令人惊奇的是，人犯罪，但上帝却保守他；人将自己交予仇敌，但上帝却不容许仇敌将他掳去，使他陷于沉沦；人离弃上帝，但上帝却仍未离弃他；人触怒上帝，但上帝却仍未收回祂的慈爱。否则，如果上帝将祂保守着人的全能之手从他身上收回，人顷刻间就会灭亡。因为撒旦正等待着这一点，即看到人被离弃，然后将其毁灭。看哪，上帝的良善，祂甚至恩待仇敌；再看那魔鬼的凶残，务要警醒防备。
  - type: paragraph
    text:
      ru: 'Если еще и то великое Его дело рассудим, что Он ради нас, падших и отступивших от Него, Единородного «Сына Своего не пощадил, но предал Его за всех нас» ( Рим 8:32 ), дабы мы спаслись, – что познаем из этого, если не горячую к нам любовь Его? – Об этом Сам Единородный Сын Его возглашает и эту Его любовь в удивление представляет нам, говоря: «Так возлюбил Бог мир, что отдал Сына Своего Единородного, дабы всякий верующий в Него, не погиб, но имел жизнь вечную» ( Ин 3:16 ).'
      cn: 如果我们再思量祂那伟大的作为，就是祂为我们这些堕落且悖逆祂之人，不惜将祂的独生子「交付出来，为我们众人舍弃」（罗马书 8:32），好使我们得救——若非祂对我们炽热的爱，我们从中还能认识到什么呢？关于这爱，祂的独生子亲自宣示，并将其呈现给我们，令我们惊叹，祂说：「上帝爱世人，甚至将祂的独生子赐给他们，叫一切信祂的人不致灭亡，反得永生」（约翰福音 3:16）。
  - type: paragraph
    text:
      ru: 'Видишь благость Божию и любовь к нам, но рассмотри и человека-грешника, который бесстрашно закон Божий нарушает, – его неблагодарность, грубость, невежество и бесстыдство. Должно было человеку непрестанно, и как сказать, чаще Бога благодарить, нежели дышать, но он неблагодарным к Нему является. Должно было человеку всегда и везде Бога поминать с любовью, но он забывает Его и благодеяния Его. Должно было с высоким и наибольшим благоговением везде и всегда Бога почитать, как вездесущего, и сохраняющего, и благодетельствующего, но он преступлением закона Его бесчестит Его, как апостол говорит грешнику: «Преступлением закона бесчестишь Бога» ( Рим 2:23 ). Бесчестит Создателя, Промыслителя, Хранителя, Благодетеля своего высочайшего, бесчестит Того (о, долготерпение Божие! о, слепота человеческая!), – Того бесчестит, Которого Ангелы и Архангелы со страхом, благоговением и любовью непрестанно почитают, воспевают и поклоняются.'
      cn: 你看见上帝的良善和祂对我们的爱，但也要思量罪人，他无惧地违犯上帝的律法——他的忘恩负义、粗鄙、无知和无耻。人本应不住地，甚至可以这样说，感谢上帝比呼吸还频繁，但他却对祂忘恩负义。人本应时时处处怀着爱纪念上帝，但他忘记了祂和祂的恩惠。人本应以至高和最大的敬畏，时时处处敬奉上帝，作为无所不在的、维系一切的和施恩赐福的，但他却以违犯上帝律法的方式羞辱祂，正如使徒对罪人所说：「你以违犯律法来羞辱上帝」（罗马书 2:23）。他羞辱着创造主，掌管万有的眷顾者，保守者，他至高的施恩者。他羞辱着那位（哦，上帝的恒忍！哦，人类的盲目！），他羞辱着那位被天使和天使长怀着敬畏、虔诚和爱不住地敬奉、歌颂和朝拜的。
  - type: paragraph
    text:
      ru: Грешник недостоин жить на земле, потому что грешник, но Бог жизнь его хранит, и не только хранит, но и благодетельствует ему. Но грешник этого не чувствует и благодетеля своего презирает. Не перестает Бог благотворить грешнику, но не перестает и грешник благотворителя раздражать. Неизреченна благость Божия, несказанно и невежество, и неистовство грешника. По отношению к Богу грешник поступает так, как тот человек, который питателя, и хранителя, и защитника своего поносит и ругает. Не видит этого грешник, ибо ослеплен грехом, но, когда откроются его очи внутренние, тогда увидит и познает это за истину.
      cn: 罪人因是罪人，故不配活在地上，但上帝保守他的生命，不仅保守，而且施恩于他。但罪人感受不到这一点，并藐视他的施恩者。上帝不断地赐福于罪人，但罪人也未曾停止触怒施恩者。上帝的良善不可言喻，罪人的无知和狂暴也难以言说。罪人对上帝的态度，就像那个人，咒骂并侮辱他的供养者、保守者和保护者。罪人看不见这一点，因为他被罪蒙蔽了，但当他的内在之眼被开启时，那时他就会看见并认识到这是真理。
  - type: paragraph
    text:
      ru: Тогда, когда в вышеописанное рассуждение войдет человек, то родится в нем истинное сокрушение, сожаление и стыд. Тогда признает себя достойным всякого наказания, тогда будет себя достойно ругать, на себя негодовать, гневаться, искать источника слез, и более всей твари себя понижать, и признает себя недостойным хлеба и малейшего Божия благодеяния. И это есть «печаль ради Бога» , которая «производит неизменное покаяние ко спасению» ( 2Кор 7:10 ). Имеющий такую печаль лучше восхочет умереть, нежели согрешить, и такую печаль как себе, так и тебе иметь от сердца желаю.
      cn: 当那时，当人进入上述之思量时，便在他里面生出真实的痛悔、懊悔和羞愧。那时他会承认自己配受一切刑罚，那时他会合理地责备自己，对自己感到愤慨、愤怒，寻求泪水的源泉，并且比一切受造物更要贬低自己，承认自己不配得面包和最小的上帝的恩泽。这就是「按上帝旨意的忧伤」，它「生出无可后悔的悔改，以致得救」（哥林多后书 7:10）。拥有这种忧伤的人，宁愿选择去死，也不愿犯罪，我衷心希望，你我都能拥有这种忧伤。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Видно, что ты не понял вполне, что грешник недостоин жить на земле. Я для тебя еще следующее изъяснение прилагаю об этом.
      cn: 显见你未能全然领会，罪人不配活在地上。为此，我再为你附上以下阐释。
  - type: paragraph
    text:
      ru: Знаешь ты, что бесчестие земного царя смертной казнью наказывается, и обесчестивший по законам предается смерти, если царь по единой своей милости его не простит. Рассуди же, что царь земной пред Божиим величеством? – Как ничто, поскольку человек смертный, как и прочие люди. Теперь возьми в рассуждение грех, которым грешник Бога оскорбляет и бесчестит. Если царю земному досадивший человек повинен смерти, насколько более достоин смерти, не только временной, но и вечной, грешник, который Богу бесконечному досаждает, и, что горше того, не перестает досаждать нераскаянной жизнью. В тот самый час достоин умереть и погибнуть грешник, в который согрешит против совести, а особенно, когда грехи ко грехам прилагает, но благость Божия еще милует его, еще не казнит его Бог человеколюбивый, не казнит достойного казни. Такая благость на покаяние грешника ведет ( Рим 2:4 ).
      cn: 你可知，侮辱地上的君王是要受死刑惩罚的，并且侮辱者依法要处以死刑，除非君王凭其独有的仁慈赦免他。那么请想一想，地上的君王在上帝的威严面前算什么呢？——微不足道，因为他是个必死的人，与其他所有人无异。现在请考虑罪，罪人借此冒犯和羞辱上帝。如果冒犯地上的君王之人该当死罪，那么冒犯那无限的上帝的罪人，岂不更该当死罪，而且不仅是暂时的死，更是永远的死呢？更甚者，他还以未曾悔改的生命不停地冒犯。罪人在他违背良心犯罪的那一刻，就该当死去并灭亡，尤其当他罪上加罪之时。但上帝的良善仍在怜悯他，施行爱人的上帝仍未刑罚他，仍未刑罚那该受刑罚之人。这样的良善引领罪人悔改（罗马书 2:4）。
  - type: paragraph
    text:
      ru: Видишь, что грешник недостоин жить, и благость Божия есть, что всякий грешник еще не погиб. Если же жизни недостоин, но смерти повинен всякий грешник, то достоин ли, чтобы на него сияло солнце, луна и звезды? Достоин ли, чтобы питался и прочими благами Божиими утешался? Воистину недостоин. Но благость Божия и недостойного удостаивает, «ибо Он повелевает солнцу Своему восходить над злыми и добрыми и посылает дождь на праведных и неправедных» . ( Мф 5:45 ). Из этого учись познавать, что «никто не благ, как только один Бог» ( Мф 19:17 ). Ибо кто из людей так добр, кроток и долготерпелив, чтобы так врагам своим благодетельствовать? Скоро человеческая кротость изменяется. Такого благого, кроткого, долготерпеливого и человеколюбивого Бога оскорбляет человек, когда согрешает и нарушает Его святой закон.
      cn: 你看，罪人本不配活着，而上帝的恩慈，乃是每一个罪人尚未灭亡。既然每一个罪人本不配活着，反而理当受死，他又岂配让太阳、月亮和星星照耀在他身上呢？他岂配享用食物，并以上帝的其他美善之物得享慰藉呢？诚然不配。然而上帝的恩慈，甚至恩待不配之人，因为祂叫日头照好人，也照歹人；降雨给义人，也给不义的人。（马太福音 5:45）从此你当学习认识到，除了上帝以外，没有一个良善的。（马太福音 19:17）因为世人中谁能如此良善、温柔且恒忍，以至于如此善待自己的仇敌呢？人的温柔很快就会改变。如此良善、温柔、恒忍且爱世人的上帝，人却在他犯罪并违犯祂的神圣律法时冒犯了祂。
  - type: paragraph
    text:
      ru: Видишь, что если бы даже муки вечной и вечной жизни не было, нам все равно должно было бы скорбеть, тосковать, негодовать, гневаться на себя, плакать и рыдать, что Бога нашего, столь благого и человеколюбивого нашего Отца, грехами нашими прогневляем. Ибо Бог Сам по Себе любви и высочайшего почитания достоин. Если доброго человека, от которого и благодеяния не видим, любим и почитаем только за то, что добр, и крайне бережемся, чтобы не оскорбить его, то насколько более Бога, нашего Создателя, Промыслителя, Хранителя, Питателя, Защитника, Помощника, и, да вкратце скажу, высочайшего Благодетеля и человеколюбивого Отца, любить и почитать должны, – насколько можем в немощной плоти, – и крайне беречься Его оскорбить, как единственно благого.
      cn: 你看，即便没有永恒的苦痛和永恒的生命，我们也仍然应当忧伤、悲痛、愤恨、对自己发怒、哭泣和哀号，因为我们用我们的罪恶触怒了我们的上帝，我们这位如此良善、爱人的父亲。因为上帝本身就配得爱和至高的敬意。如果我们爱一个良善之人，即便我们没有从他那里得到任何恩惠，仅仅因为他良善就爱他、敬重他，并且极其小心地不冒犯他，那么我们更当何等地爱和敬重上帝，我们的创造者、护理者、保守者、供养者、保护者、帮助者，简而言之，至高的施恩者和爱人的父亲——在我们这软弱的肉身中，尽我们所能地——并且极其小心地不冒犯祂，因为祂是唯一良善的。
  - type: paragraph
    text:
      ru: Поверь, возлюбленный, что лучше человек изберет умереть, нежели Бога грехом оскорбить, когда войдет в правильное о Боге рассуждение, ибо благость Его столь велика, сколь велик Он Сам, и столько Его благодеяний нам оказано, сколько тварей созданных и сколько дел Его преславных, нас ради Им сотворенных, и сколько дней, часов и минут от рождения нашего прошло. Ибо без Него и благ Его и минуты жить не можем. «Ибо мы Им живем и движемся и существуем» ( Деян 17:28 ).
      cn: 相信吧，蒙爱者，当人进入了对上帝的正确认识时，他宁愿选择死亡，也不愿以罪冒犯上帝，因为这是更好的。因为祂的良善是如此伟大，如同祂自己一样伟大。祂对我们施予的恩惠，多如受造之万物的数量，多如祂为我们所行、极其荣耀之作为的数量，也多如我们自出生以来所经过的日子、时辰和分钟的数量。因为没有祂和祂的恩泽，我们连一分钟都无法存活。「因为我们生活、动作、存留，都在乎祂。」（使徒行传 17:28）。
  - type: paragraph
    text:
      ru: Видишь, что грешник недостоин жить, а то, что живет, – благости Божией приписать должно, которая его на покаяние ведет ( Рим 2:4 ). Если жить недостоин, то тем более благодеяний Божиих недостоин. Ибо большая благость Божия – не только жить грешнику дать, но и благами его, недостойного жизни, снабжать. Как? – Рассмотри из следующего примера. Если бы царь врагу своему не только жизнь даровал, но и благодеяниями своими его награждал, не всякий ли удивился бы такому делу? Воистину все бы тому удивлялись. Так Бог творит, Который не только не казнит смертью беззаконников, достойных смерти, но и блага Свои им подает, ожидая их обращения и покаяния, как выше сказано. Отсюда познаем, сколь благ Бог наш, благости и человеколюбию Которого себя и тебя поручаю.
      cn: 你看，罪人是不配活着的，然而，他活着，这应该归因于上帝的恩慈，这恩慈引导他悔改（罗马书 2:4）。如果他不配活着，就更不配得上帝的恩惠了。因为上帝的洪恩，不仅是让罪人活着，更是以诸般美善供给那不配活着的人。如何呢？请看以下例子。如果一位君王对他的仇敌，不仅赐予生命，而且以他的恩惠赏赐他，难道没有人会为此事惊叹吗？确实，所有人都会为此惊叹。上帝如此行事，他不仅不处死那些本该受死的不法之人，反而将自己的美善赐予他们，等待他们的归正与悔改，正如上面所说。由此可知，我们的上帝是何等良善，我将我自己和你都托付于他的恩慈与仁爱。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Поскольку «печаль ради Бога производит неизменное покаяние ко спасению» ( 2Кор 7:10 ), по апостольскому учению, то в ней нужно нам всегда поучаться и иметь ее, дабы принести Господу нашему жертву живую – дух сокрушенный. Поэтому и я еще раз о том же пишу тебе, чтобы вкоренилась она в сердцах наших, что особенно от рассмотрения Божиих свойств почерпается.
      cn: 鉴于「为上帝的忧伤产生不变的悔改以致得救」（哥林多后书 7:10），按照使徒的教训，我们便当常常学习并持守它，以便将活祭——忧伤痛悔的灵——献给我们的上主。因此，我也再次就此事写信给你，为要让它在我们心中扎根，而这尤其可从思虑上帝的属性中汲取。
  - type: paragraph
    text:
      ru: 1) Из Святого Писания видим, что Бог наш так велик, что весь свет и все народы пред Ним как ничто. Если же все люди и весь свет как ничто пред Ним, то насколько более – один человек. Но эта бедная тварь, малая горсть земли, прах и пепел, такого великого Бога, когда грешит, раздражает. Кто дерзнет земного царя раздражать? Бога, царя небес и земли, непостижимого в величестве, человек смертный не боится раздражать.
      cn: 1) 从圣经中我们看到，我们的上帝如此伟大，以致整个世界和所有民族在祂面前都微不足道。既然所有的人和整个世界在祂面前都微不足道，那么一个人就更是如此了。但这个可怜的受造物，一小撮泥土，尘土和灰烬，却在犯罪时激怒了如此伟大的上帝。谁敢激怒地上的君王呢？至于上帝，祂是天地之君，其威严不可测度，凡人却不惧怕激怒祂。
  - type: paragraph
    text:
      ru: '2) Бога нашего слава так страшна, что Его все Ангелы боятся и трепещут, повеления Его с радостью и с усердием исполняют, поклоняются Ему, и трисвятую песнь поют Ему: «Свят, свят, свят Господь Саваоф, полны небеса и земля славы Его» ( Ис 6:3 ). Человек, земля и пепел, не трепещет пред славой Его, но не престает раздражать Его!'
      cn: 2) 我们上帝的荣耀如此可畏，以至于众天使都敬畏祂、战栗，以喜乐和热诚遵行祂的命令，朝拜祂，并向祂唱三圣颂：「圣哉，圣哉，圣哉，万军之主上主！祂的荣耀充满天地！」（以赛亚书 6:3）人，尘土与灰烬，在祂的荣耀面前却不战栗，反倒不停地触怒祂！
  - type: paragraph
    text:
      ru: 3) Бог наш везде и на всяком месте есть, поэтому, когда человек грешит, то пред Богом грешит, а так не воздает Ему должного почитания. Кто дерзнет пред царем земным бесчинствовать? Разве что безумный. Ибо бесчинием бесчестие и досаждение царскому лицу делается. Человек согрешающий не стыдится и не ужасается пред Божиим присутствием бесчинствовать и так бесчестие и досаждение Ему оказывает. О, когда бы показалась хотя бы немного человеку Божия слава, непременно бы пал бездыханным, как апостолы, услышавшие только Божий глас, пали ниц и сильно испугались ( Мф 17:6 ). Но ослепленный не понимает этого.
      cn: 3) 我们的上帝无处不在，无所不在，因此，当人犯罪时，乃是在上帝面前犯罪，如此便未能向祂献上应有的尊崇。谁敢在地上君王面前悖逆犯上？除非是疯子。因为悖逆犯上的行为，是对君王面目的羞辱和冒犯。犯罪之人，不羞愧，不恐惧，竟敢在上帝的临在中悖逆犯上，如此便是对祂的羞辱和冒犯。唉，若是上帝的荣耀哪怕只向人显现少许，他必定会扑倒在地，气绝身亡，就像使徒们，仅仅听见上帝的声音，就俯伏在地，极其惊恐（马太福音 17:6）。但被蒙蔽之人不明白这一点。
  - type: paragraph
    text:
      ru: 4) Бог наш истинен, так что, когда обещает что-либо, непременно будет то, и чем грозит нам, непременно то сбудется. Обещает вечную жизнь и грозит вечной мукой, но грешник этому не верит, ибо не кается истинно, без чего и муки избежать и вечную жизнь получить невозможно. Ибо только истинно кающиеся спасаются, а некающиеся погибают. Не кается же, потому что от грехов отстать не хочет.
      cn: 4) 我们的上帝是信实的，以至于，当祂应许任何事，那事就必成就，并且祂所警告我们的，也必实现。祂应许永生，并警告永恒的刑罚，但罪人对此不信，因为他没有真正地悔改，没有真正的悔改，就不可能逃脱刑罚，也不可能获得永生。因为只有真正悔改的人才能得救，而不悔改的人则灭亡。他之所以不悔改，是因为他不想离弃罪恶。
  - type: paragraph
    text:
      ru: О, если бы он истинно, действительно и живо уверился в вечной муке и вечной жизни, – в непрестанном бы сокрушении и печали был, избегая всякого греха, и всячески старался бы и воздыхал и молился Богу, дабы муки избежать и вечную жизнь получить, – что на истинно кающихся примечается. Но, к своему бедствию, не верит и так Бога истинного лживым делает. «Не верующий Богу представляет Его лживым» ( 1Ин 5:10 ).
      cn: 哦，要是他真正地、确实地、真切地确信永恒的痛苦和永恒的生命，他就会不断地处于痛悔和忧伤之中，躲避一切罪恶，并会竭力地叹息并向上帝祈祷，以免受苦并获得永恒的生命，——这正是那些真正忏悔者所显现的。然而，不幸的是，他不相信，如此便将真实的上帝视为说谎者。「不信上帝的，将祂视为说谎的。」（约翰一书 5:10）
  - type: paragraph
    text:
      ru: Также, когда слышит в Святом Писании, что Бог, будучи праведен, воздаст всем по делам их, – благо творящим добро, а зло творящим зло, – не внимает и не верит тому. Ибо, если бы верил, непременно бы уклонялся от всякого зла и старался бы творить всякое добро, надеясь от Бога обещанное добро получить и от зла избавиться. Если же человек ему что обещает, то верует тому, потому что видит то, что он обещает, и боится того, чем грозит, ибо перед глазами его предстоит. Бог обещает и грозит, но он не верит, потому что не видит того, что обещает и чем угрожает, и так хулит Бога. Поэтому неверие тяжкая есть хула на Бога и корень всякого зла.
      cn: 同样，当他在圣经中听到，上帝，作为公义者，将按各人的行为报应各人——行善的得福，作恶的受祸——他却不留意，也不相信。因为，如果他相信，就一定会远离一切的恶，并努力行一切的善，指望从上帝那里得到所应许的善，并脱离邪恶。但如果人向他应许什么，他就相信，因为他能看见人所应许的，也害怕人所威胁的，因为这些都呈现在他眼前。上帝应许并威胁，但他却不相信，因为他看不见上帝所应许的，也看不见上帝所威胁的，如此便是亵渎上帝。因此，不信是对上帝的严重亵渎，也是一切邪恶的根源。
  - type: paragraph
    text:
      ru: 5) Бог наш есть высочайший Благодетель, создал нас, питает, одевает, сохраняет нас, солнцу повелевает на нас сиять и дожди посылает, дома и покой нам и прочие блага Свои подает, – и не любим Его, а раздражаем и сильно огорчаем Его. Человека-благодетеля, который не своим, но Божиим добром благотворит нам (ибо все добро – Божие), любим и благодарим, но Бога благодетеля, Который своим добром всегда и каждую минуту снабжает нас, так что без добра Его и минуты прожить не можем, – не любим и не благодарим, но, наоборот, оскорбляем и прогневляем. Такова наша к Богу неблагодарность!
      cn: 5) 我们的上帝是至高的施恩者，祂创造了我们，喂养我们，赐衣给我们，保守我们，命令太阳为我们照耀，又降下雨水，赐予我们房屋、安宁以及祂的其他恩惠，——然而我们却不爱祂，反而激怒祂，并使祂大大忧伤。那些施恩予人的世人，并非以自己的善，而是以属上帝的善来行善（因为一切的善都属于上帝），我们爱戴并感谢他们；但那位以祂自己的善，时时刻刻供应我们，以至于没有祂的善，我们片刻都不能存活的施恩者上帝，我们却不爱戴也不感谢，反而侮辱祂，并惹祂发怒。这就是我们对上帝的忘恩负义！
  - type: paragraph
    text:
      ru: 6) Святое Писание, как благоприятное послание, через пророков и апостолов послал нам, в котором волю Свою святую открывает нам, и, как светильник, нам, во тьме неведения пребывающим, постановил, и, как врачебницу, ради исцеления немощей наших подал, и, как хлеб духовный, питающий души наши, и как источник живой, прохлаждающий нас, даровал нам, – но все это презираем, и слова Его, и Его Самого не любим, но, наоборот, раздражаем.
      cn: 6) 圣经，作为蒙恩的讯息，上帝借着先知与使徒赐予我们；在其中，祂向我们启示祂的圣洁旨意；祂将其立为明灯，照亮我们这些身处无知黑暗中的人；祂又赐予它，作为医治我们软弱的药方；并且，祂将其作为滋养我们灵魂的属灵食粮，以及使我们得着舒畅的活水泉源，都恩赐给我们——然而，我们却轻蔑这一切，不爱祂的言语，也不爱祂自己，反而触怒祂。
  - type: paragraph
    text:
      ru: 7) Единородного Сына Своего ради нас в мир послал, чтобы благодатью Его спасались, что является верхом всех благодеяний, но мы, как посланного Сына, так и пославшего Отца не любим, не благодарим Его за такое великое дело Его. Какая большая может быть неблагодарность? Поэтому само небо и земля, все святые Ангелы и избранные Его вознегодуют на нас за такую нашу неблагодарность, если не обратимся к Нему с чистым покаянием, сожалением и сокрушением сердца.
      cn: 7) 祂为我们差遣祂的独生子到世上，使我们借着祂的恩典得蒙救赎，这是诸善的顶峰。但我们既不爱这受差遣的圣子，也不爱差遣祂的圣父，更不为祂如此伟大的作为而感谢祂。还能有什么比这更大的不感恩之心呢？因此，连天地本身，以及所有的圣天使和祂的蒙选者，都会因我们如此的不感恩而向我们发怒，如果我们不带着纯洁的悔改、痛悔与破碎的心灵转向祂。
  - type: paragraph
    text:
      ru: 8) Бог весьма желает и алчет и жаждет нашего спасения, так что и «Сына Своего» Единородного ради нашего спасения «не пощадил, но предал Его за всех нас» ( Рим 8:32 ). Но мы нераскаянной нашей жизнью Его спасительной воле противимся и так весьма Его оскорбляем. Такая наша слепота, развращение, злость и такая тьма и ожесточение объяли сердца наши! Что Бог мог сделать более для нас, если и Сына Своего ради нас не пощадил? Но мы всей этой Его благодатью пренебрегаем. Так нас сатана уязвил! Так помрачил тьмой своей! Так ожесточил злобой своей!
      cn: 8) 上帝极其渴望、饥渴、切慕我们的救赎，甚至「没有爱惜自己的儿子」独生子，而是「为我们众人舍了祂」（罗马书 8:32）。但我们却以我们不悔改的生活抵挡祂救赎的旨意，如此极其地冒犯祂。何等样的盲目、败坏、恶意，何等样的黑暗与刚硬攫取了我们的心！上帝还能为我们做什么呢，既然祂连自己的儿子都为我们没有爱惜？但我们却轻忽了祂这一切的恩典。撒旦竟如此重创了我们！竟以其黑暗如此蒙蔽了我们！竟以其恶意如此刚硬了我们！
  - type: paragraph
    text:
      ru: Рассматривай эти пункты, особенно в уединении и в ночное время, и с помощью Божией породится в тебе дух печали ради Бога, сокрушения и умиления.
      cn: 思量这些事项，特别是在独处和夜间，并借着上帝的帮助，为上帝忧伤的灵、痛悔和温柔心将在你里面生出。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'В том ли ты сомневаешься, что тот христианин, который во зле живет, не верит Слову Божию? Отвечаю тебе: воистину так и есть, воистину нет надлежащей в нем веры.'
      cn: 难道你怀疑，那个生活在罪恶中的基督徒，不相信上帝的圣言吗？我回答你：确实如此，确实在他里面没有合宜的信心。
  - type: paragraph
    text:
      ru: 'Примечай и рассмотри следующее:'
      cn: 请留心并审视以下内容：
  - type: paragraph
    text:
      ru: 1) Кто дерзнет пред царем бесчинствовать, если видит его пред собой? Тем более дерзнул ли бы христианин грешить и закон Божий нарушать, когда бы точно верил, что Бог с ним есть, Который, как Слово Божие учит, на всяком месте есть и все видит, даже самое тайное помышление, начинание, намерение, а не только явное дело. Не всегда ли трепетал бы и от всякого зла уклонялся, из-за присутствия Божия, чтобы присутствующего Бога не прогневать? Но, ослепленный, не видит того, не помышляет. Пред царем земным, человеком, трепещет; пред Богом ли, Царем Небесным и страшным, Который и самим царям страшен, не будет трепетать, если верою видит Его пред собой?
      cn: 谁敢在君王面前放肆，如果他看见君王就在自己面前？更何况，一个基督徒，如果他确实相信上帝与他同在——上帝之言教导我们，祂无处不在，洞察一切，甚至是最隐秘的思虑、发端、意图，而不只是显而易见的行动——他还会胆敢犯罪并违犯上帝的律法吗？他岂不是会常常战兢，并且因着上帝的临在而远离一切邪恶，以免触怒那临在于他面前的上帝吗？然而，被蒙蔽者却看不见那一切，也不思虑。他在属世的君王，一个人面前，尚且战兢；难道在上帝，那可畏的天上君王面前——祂连君王们都敬畏——他却不战兢吗，如果他以信德看见祂就在自己面前？
  - type: paragraph
    text:
      ru: 2) Сам ты знаешь, как приготовляется человек, вызываемый на суд человеческий, где много может хитрость, красноречие, золото, серебро и предстательство, – обдумывает, как бы не посрамиться и временной казни не подпасть. К суду ли Христову, где Судья – Бог, Который всякое наше дело, слово и помышление знает, и судит по делам, а не по лицам, и никакого извинения и предстательства и даров не приемлет, не старался ли бы приготовляться покаянием, сокрушением сердца, удалением от всякого зла, воздыханием и усердной молитвой, что одно только Сего Судию умилостивляет, если бы истинно и действительно верил тому? Тем более, что Суд сей Страшный неожиданно настанет, как Слово Божие учит.
      cn: 2) 你自己深知，被召往人的审判台前的人是如何预备的，在那里，诡计、雄辩、金银和代求能大有功效，他思量着如何免于蒙羞，免于遭受暂时的刑罚。难道对于基督的审判——那里的审判者是上帝，祂知晓我们一切的作为、言语和意念，并按行为审判，不看情面，也不接受任何辩解、代求和礼物——他难道不该努力预备自己吗？这预备是借着悔改、痛悔的心、远离一切邪恶、叹息和恳切的祷告，唯独这些才能使得这位审判者得蒙悦纳，如果他真真实实地相信此的话？更何况，这可怕的审判会意外地突然来临，正如上帝的圣言所教导的。
  - type: paragraph
    text:
      ru: Боится человеческого суда, от которого и виноватые часто правыми отходят и который только временной предает казни, – не будет ли трепетать Божия суда, от которого виноватые виноватыми отходят и вечной предаются казни? Невозможно сие, если верит.
      cn: 倘若人恐惧人的审判，从这审判，即便是罪人也常常被判为无罪，并且它所施加的刑罚仅仅是暂时的，——难道就不会战栗于上帝的审判吗？从这审判，有罪之人必被判为有罪，并且承受永恒的刑罚？倘若他真有信仰，这绝不可能。
  - type: paragraph
    text:
      ru: 3) Временной казни и смерти боится человек и избегает таких дел, которые по гражданским законам смертной казни подлежат, ибо видит казнь на прочих. Вечной ли казни, муки, огня, и прочего горчайшего страдания адского, в котором грешники без конца будут мучиться, не ужасался бы, если бы точно верил Слову Божию, которое о том возвещает, и от всякого греха, который к вечному мучению приводит, не уклонялся ли, не плакал бы, не творил бы истинного покаяния, чтобы того мучения избегнуть? Временной смерти боится; вечной ли не будет бояться, если верит? Не может такого быть.
      cn: 3) 人惧怕暂时的刑罚和死亡，并躲避那些依照世俗法律当受死刑的行为，因为他看到别人受刑。难道对永远的刑罚、痛苦、烈火以及地狱里其他一切极苦的煎熬——罪人将在其中受无尽的折磨——他就不会感到恐惧吗？如果他真的相信上帝的话语，这话语是宣告这些的，难道他就不会远离一切引向永远痛苦的罪？难道他就不会哭泣？难道他就不会真心悔改，以便避免那痛苦吗？他惧怕暂时的死亡；难道他若相信，就不会惧怕永远的（死亡）吗？这是不可能的。
  - type: paragraph
    text:
      ru: '4) Христос Господь говорит: «Если вы будете прощать людям согрешения их, то простит и вам Отец ваш Небесный, а если не будете прощать людям согрешения их, то и Отец ваш не простит вам согрешений ваших» ( Мф 6:14–15 ). Если верит христианин сказавшему эти слова, Христу, как всякому христианину должно верить, то почему же на ближнего, оскорбившего его, злобится? Почему или словом, или делом мстит? Почему не прощает от сердца, чтобы и его самого простил Господь? Слово Христово истинно и не преходяще: прощающему простится, и непрощающему не простится. А если не простится, что оттуда следует? Не иное что, как только то, что за все грехи, делом, словом и помышлением соделанные, будет страдать во огне вечном и правде Божией платить.'
      cn: 4) 基督上主说：「倘若你们宽恕人的过犯，你们的天父也必宽恕你们；倘若你们不宽恕人的过犯，你们的父也必不宽恕你们的过犯。」(马太福音 6:14-15) 如果基督徒相信说了这些话语的基督，正如每一个基督徒都应当相信的，那么为何对那冒犯了他的近人怀恨呢？为何或以言语，或以行动施行报复呢？为何不发自内心宽恕，好让上主也宽恕他自己呢？基督的言语是真实而不朽的：宽恕人的，必蒙宽恕；不宽恕人的，必不蒙宽恕。那么，倘若不蒙宽恕，由此会引出什么呢？无非是：为了他以行为、言语和意念所犯的一切罪过，他将要在永火中受苦，并向上帝的公义偿付代价。
  - type: paragraph
    text:
      ru: 5) Также, если христианин верит, что подающему нищим и бедным ради имени Христова «воздастся в воскресение праведных» ( Лк 14:14 ), почему не делает милости им, особенно, когда сие Христос Себе вменяет ( Мф 25:40, 45 )?
      cn: 5) 此外，如果基督徒相信，凡因基督之名向穷人和贫乏者施舍的，「在义人复活时，必得报答」（路加福音 14:14），为何不对他们施予怜悯呢？尤其是当基督将此视为施予祂自己的时候呢？（马太福音 25:40，45）
  - type: paragraph
    text:
      ru: 6) Также, если верит христианин, что будет вечная жизнь, блаженство и слава вечная благочестиво живущим во Христе, то почему того усердно не ищет? Почему славы, чести и богатства в мире этом ищет? Почему мир этот за отечество имеет? Как люди стараются, сколько трудов полагают, чтобы богатство собрать! В какие подвиги вдаются воины, чтобы чин временный заслужить! Сколько работают и потеют земледельцы, чтобы плоды собрать! Какая тому причина? – Причина в том, что видят, ради чего трудятся, и надеются получить то, ради чего трудятся. Знание будущего и желаемого ими добра предшествует надежде, а надежда поощряет их ко всякому труду, чтобы получить то, что знают и надеются получить, хотя часто и обманывает их такая надежда. Ибо не все человек получает, чего ищет.
      cn: 6) 此外，若基督徒相信，敬虔活在基督里的人将有永生、永恒的福乐和荣耀，那为何不殷勤寻求呢？为何寻求这世上的荣耀、尊荣和财富呢？为何将这世界视作祖国呢？人们多么努力，付出多少劳力，为了积累财富啊！士兵们投入何等奋斗，为了赢得暂时的官阶啊！农夫们多么辛劳和流汗，为了收成庄稼啊！这是什么原因呢？——原因在于，他们看见自己为何劳苦，并希望获得他们所劳苦的。对未来和他们所渴望之美好事物的认知先于希望，而希望则激励他们从事一切劳苦，为了获得他们所知道并希望获得的东西，尽管这样的希望常常欺骗他们。因为人并非能得到他所寻求的一切。
  - type: paragraph
    text:
      ru: Смотри, что сыны века сего делают, примечай, как сокровищ своих желаемых ищут. Ничто им не тяжко. Всякую неудобность, беду и скорбь приключающуюся преодолевают, взирая на желаемое свое сокровище.
      cn: 你们看，世人如何行事，留意他们如何寻求他们所渴求的财宝。对他们而言，没有什么难事。一切临到的不便、祸患和忧伤，他们都一一胜过，只因他们注目于他们所渴求的财宝。
  - type: paragraph
    text:
      ru: Христианин, когда точно уверится в вечной жизни и несказанной славе небесной, не оставит ли все сокровища мира сего, всю мира сего славу, честь, богатство, плотоугодие и к тому единому сокровищу не будет ли стремиться? Не понесет ли трудов и подвигов, чтобы вечную жизнь и славу получить? Не пойдет ли тесным и прискорбным путем, чтобы вечной жизни и славы достичь, куда только тесным путем доходят и «многими скорбями» ( Мф 7:14 ; Деян 14:22 ; 2Тим 3 и на прочих местах)? Временное сокровище так усердно ищет человек, которое вскоре оставит, – ищет, потому что видит его. Вечного ли сокровища, словом несказанного и умом непостижимого, которое, если отыскать, то никогда не потеряется, – не будет ли усердно и прилежно искать, и все терпеть, чтобы того не лишиться, когда верою увидит его? Быть тому невозможно.
      cn: '基督徒，当他确信无疑永生与无法言喻的天上荣耀时，岂不弃绝这世上的一切财宝，这世上的一切荣耀、尊贵、财富、肉体享乐，而唯独寻求那唯一的宝藏？岂不忍受劳苦和修持，为要获得永生与荣耀？岂不走那狭窄而艰难的道路，为要达到永生与荣耀，那里唯有借着狭窄的道路和「许多患难」才能抵达（马太福音 7:14，使徒行传 14:22; 提摩太后书 3 以及其他经文）？


        人如此殷勤地寻求那暂时的财宝，那不久便要离弃的——寻求，因为他看得见它。难道那永恒的宝藏，言语无法形容，心智无法领会，一旦寻得，便永不失去的——当人借着信心看见它时，岂不更加殷勤而专心地寻求，并忍受一切，以免失去它吗？这绝无可能。'
  - type: paragraph
    text:
      ru: Поверь, возлюбленный, что человек весь век страдать захотел бы, если бы нужда была, только бы вечного блаженства не лишиться, если бы хоть частицу его увидел. Так оно велико, так красиво, так сладко! Оно различно от Духа Святого в Писании Святом описывается и в пользу и утешение наше представляется нам, дабы мы усердно его искали и благодатью Его получили. Итак, кто Слову Божию верит и в нем открытое то блаженство оком веры видит, тот непременно, все мирское сокровище оставив, того единого усердно ищет.
      cn: 相信，蒙爱者，如果必要，人愿意一生受苦，只要不失去永恒的福乐，哪怕只看到它的一丁点。它是如此伟大，如此美好，如此甘甜！它在圣经中由圣灵以不同方式描述，并为了我们的益处和安慰而向我们呈现，以便我们殷勤地寻求它，并借由祂的恩典而获得。因此，凡相信上帝圣言，并以信心的眼目看见其中所启示的福乐者，那人必然舍弃一切世俗的财宝，殷勤地寻求那唯一之物。
  - type: paragraph
    text:
      ru: 7) Если бы кто тебя от временного бедствия и смерти избавил, и избавил бы не чем иным, как своим бедствием и страданием добровольным, скажи, пожалуйста, как бы ты его любил, почитал, имя его, как благодетеля своего, везде с любовью и почтением поминал? Не все ли бы ты делал, что он хочет? Бесспорна эта истина. Если же веруешь, что Христос Сын Божий от бедствия и смерти, не временной, но вечной избавил, и избавил не серебром или золотом или иною какой тленной вещью, но страданием, Кровью и смертью Своей, и отворил тебе небесное вечное царствие, то как не будешь Его, столь высокого и великого Благодетеля, любить, почитать, благодарить от всего сердца и во всем Ему угождать? Как не будешь усердно и с любовью Ему послушание оказывать? Малого благодетеля – человека, которому ты чем-то временным обязан, любишь и высоко почитаешь; как же не будешь Того, Которому навечно ты обязан, любить и почитать?
      cn: 7) 如果有人将你从暂时的灾难和死亡中解救出来，并且不是藉着别的什么，而是藉着他自己自愿承受的灾难和痛苦来解救你，请告诉我，你将如何爱戴他、尊敬他，并将他的名字，作为你的施恩者，在任何地方都带着爱与敬意来记念呢？你难道不会做他所希望的一切吗？这个真理是无可辩驳的。如果你相信基督，上帝之子，将你从并非暂时的、而是永恒的灾难和死亡中解救出来，并且不是藉着金银或任何其他会朽坏之物，而是藉着祂自己的苦难、宝血和死亡来解救，并为你开启了属天的永恒天国，那么，你怎能不爱戴、尊敬、全心感谢这位如此崇高而伟大的施恩者，并在一切事上取悦于祂呢？你怎能不热切而有爱心地顺服祂呢？一位小小的施恩者——一个你欠着暂时恩惠的人，你都爱戴并高度尊敬；那么，你怎能不爱戴和尊敬那位你永远亏欠的呢？
  - type: paragraph
    text:
      ru: 'Но где любовь, где почитание, где благодарность ко Христу у грешника? Разве что на словах. Это не почитание и не любовь, но лицемерие. Многие христиане устами говорят: почитаем Тебя, Христе, поклоняемся, поем и славим, – но делами иное показывают. Устами почитают, поют и славят, но беззаконными делами бесчестят. Многие христиане не жалеют на приданное дочерям, на богатые столы, дома, коней, кареты, псовую охоту и прочую суету много средств расходовать, но ради имени Христова или ничего или копейку подают. Ради временного благодетеля-человека все творят, всякое послушание, всякое угождение оказывают люди; а ради Христа, вечного Благодетеля, и того делать не хотят, что ради человека-благодетеля делают. Где же почитание, любовь и благодарность к Благодетелю? А без почитания и любви истинной, где вера, которую апостол велит нам от дел показывать: «Покажи мне веру твою от дел твоих» ( Иак 2:18 )?'
      cn: 但罪人对基督的爱、敬重和感恩何在呢？难道仅仅是在言语上的吗？这不是敬重，也不是爱，而是虚伪。许多基督徒口里说：「基督啊，我们敬重祢，敬拜祢，歌颂和赞美祢，」——但行为上却显示出别样。他们口里敬重、歌颂和赞美，却以不法行为羞辱。许多基督徒在女儿嫁妆上、丰盛的宴席上、房屋、马匹、马车、猎犬狩猎以及其他虚浮之事上，毫不吝惜地花费许多钱财；但为了基督的名，他们要么什么也不给，要么只给一文钱。为了短暂的施恩者——人，人们凡事都做，凡事顺从，凡事讨好；而为了基督，这位永恒的施恩者，他们连为施恩者——人所做的事情也不愿去做。那么，对这位施恩者的敬重、爱和感恩何在呢？可是，如果没有真正的敬重和爱，信心何在呢？这信心是使徒吩咐我们要以行为来显明的：「将你的信心从你的行为中显给我看」（雅各书 2:18）？
  - type: paragraph
    text:
      ru: 'Из этих приведенных рассуждений видишь, что вера есть корень благочестия и источник, от которого, как ручьи, добрые дела проистекают: от веры страх Божий, презрение мира, умерщвление плоти со страстями и похотями, отречение от самого себя, то есть гнева, злобы, ненависти, похоти, сребролюбия и прочих недугов; любовь к Богу и ближнему, воздыхание и желание блаженной вечности, и прочее. А из этого разумей, что тот христианин не имеет веры, который или во зле живет, или к миру, то есть к чести, славе, богатству и плотоугодию мирскому пристрастился. Словом, не верит тот Слову Божию, который не старается по правилу Слова Божия жизнь свою исправлять.'
      cn: 从这些阐述的论述中，你看到，信仰是虔敬的根基，以及一个源头，从它那里，善功如同溪流般涌出：从信仰中生出敬畏上帝，轻看世界，克制肉体及其情欲和贪欲，舍弃自己，即：忿怒、恶意、仇恨、贪欲、贪爱钱财以及其他弊病；爱上帝和近人，叹息和对蒙福永生的渴望，等等。由此你当明白，那个基督徒没有信仰，他或生活在邪恶之中，或沉溺于世界，即：沉溺于世界的尊荣、光荣、财富和肉体享乐。总而言之，那个不相信上帝圣言的人，就是那个不努力按照上帝圣言的法则修正自己生命的人。
  - type: paragraph
    text:
      ru: Как не будешь стараться делать то, что повелевается в Писании, если точно веруешь, что Бог, Создатель и Господь твой, тебе это повелевает? Царя земного, и даже низшую власть слушаешь и исполняешь их повеления, – Бога ли, Царя Небесного, не будешь слушать и заповедей Его исполнять? Царю земному, человеку, который часто и не стоит в истине, как человек, веришь, если что обещает, и ради того служишь ему, и боишься, если чем грозит, – Богу ли, истинному и неложному, не будешь веровать, и на то ли не надеяться и не ожидать, что обещает, и не будешь ли бояться того, чем грозит, когда точно поверишь слову Его святому?
      cn: 你怎能不努力去做圣经所命令的事，如果你真确地相信，上帝，你的创造主和主宰，是祂命令你如此行？你听从并遵行地上君王甚至低阶权柄的命令，难道你反而不听从上帝，天上的君王，不遵行祂的诫命吗？地上的君王，一个常常不立于真理中的人，如果他有所应许，你却相信他，并为此而事奉他，如果他有所恐吓，你便惧怕；难道你反而不相信上帝，那真实且不虚谎的，难道你反而不盼望和不期待祂所应许的，难道你反而不惧怕祂所恐吓的吗，当你真确地相信祂的圣言时？
  - type: paragraph
    text:
      ru: Видишь, что должно прежде поверить слову без сомнения, что оно есть Божие Слово, и есть истинно и неложно; и что оно, как всякому, так тебе и мне сказано от Бога; и что повелевает, как всякому, так тебе и мне повелевает; и что обещает, как всякому, так тебе и мне обещает; и чем грозит, тем всякому, мне и тебе и другому грозит. Ибо Бог на лица не смотрит, но всякому слово Свое объявил. Рассуждай об этом.
      cn: 你看，应当首先毫不怀疑地相信这圣言，相信它是上帝的圣言，并且是真实无妄的；并且它，就像对所有人一样，也是对你和我说自上帝的；并且它所命令的，就像对所有人一样，也是对你和我的命令；并且它所应许的，就像对所有人一样，也是对你和我的应许；并且它所威胁的，也是威胁着所有人，威胁着我、你和他人。因为上帝不看人的外貌，却向每个人宣示了祂的圣言。思考这一点。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: По желанию твоему отвечаю и знаки истинного покаяния описываю, которые примечаются из Святого Писания и церковной истории, и в нынешних людях, истинно кающихся, и в книгах святых отцов и церковных учителей изъясняются. Ты примечай и рассуждай о себе, имеются ли они в сердце твоем. Ибо без истинного покаяния Евангелие и Христос, во Евангелии проповедуемый, никакой нам не дадут пользы. Пластырь к ране прилагается, и лекарь к больному, признающему немощь свою, приходит. Так и утешение евангельское сердцу сокрушенному подается.
      cn: 依你所愿，我回答并阐述真诚悔改的标记，这些标记可见于圣经与教会历史，并在如今那些真诚悔改的人身上，以及在圣教父与教会教师的著作中得到阐明。你当留意并省察自己，它们是否存留在你心中。因为没有真诚的悔改，福音以及在福音中被宣讲的基督，对我们没有任何益处。膏药敷于伤处，医者来到承认自身软弱的病人身旁。同样，福音的安慰赐予那忧伤痛悔的心。
  - type: paragraph
    text:
      ru: 1) Изменение сердца к лучшему и исправление греховной жизни. Ибо истинно кающийся как от прежних отстает грехов, и ненавидит их, и гнушается ими, так и от других бережется.
      cn: 心意向善的更新，以及罪恶生活的改正。因为真正悔改的人，既离弃先前的罪过，憎恶并厌弃它们，也提防其他的罪过。
  - type: paragraph
    text:
      ru: '2) «Плоть» распинает «со страстями и похотями» ( Гал 5:24 ), то есть славу, честь, плотоугодие мира сего за ничто имеет. Страсти свои: гнев, злопамятство, похоть, ненависть, зависть, сребролюбие, и прочее – усмиряет и укрощает.'
      cn: 2) 肉体将「连同情欲和私欲」钉死（加拉太书 5:24），也就是说，将世界的荣耀、尊荣和肉体享乐看作虚无。自己的情欲：愤怒、怀怨、私欲、仇恨、嫉妒、贪财等等——都加以克制并驯服。
  - type: paragraph
    text:
      ru: 3) Пищу, питье, одежду, и прочие вещи и средства для поддержания жизни – ради нужды употребляет, а не ради угождения плоти. То есть одежды требует только ради прикрытия и согревания, а не ради красоты; пищу и питье употребляет ради подкрепления немощи плотской, а не ради услаждения. Ему все равно, в каком доме жить, в богатом или в убогом, только чтобы покой был.
      cn: 3) 食物、饮品、衣物，以及其他维生之物与工具——他为了必需而使用，而非为了取悦肉体。也就是说，他只要求衣物为了遮蔽和保暖，而非为了美观；他使用食物和饮品是为了扶持肉身的软弱，而非为了享乐。他不在乎住在何种房屋里，无论富裕还是贫寒，只要能得安宁。
  - type: paragraph
    text:
      ru: 4) Поминая прежнее свое беззаконное житие, ужасается Божия суда, так как тем не что иное заслужил, как осуждение и ад, и усердно молится и припадает пред Богом милосердным, дабы помиловал его, но приводя на память примеры согрешивших и покаянием получивших милость у Господа, и сам тоже надеется на милость Божию, и так надеждой милости утешается. И подобный удар страха и ужаса бывает человеку в самом начале покаяния его, так что и к отчаянию его преклоняет. Поэтому таковому грешнику кающемуся нужно прочитывать и памятовать утешительные места Писания и примеры покаявшихся грешников и милость получивших, дабы не впал в пагубу всеконечного отчаяния.
      cn: 回忆起他昔日那悖逆律法的生命，他对上帝的审判感到惊恐，因为他所应得的，除了定罪和地狱，别无他物。他恳切地祈祷，俯伏在慈悲的上帝面前，求祂怜悯他。但他想起那些犯了罪又因悔改而蒙上主怜悯的例子，他自己也寄望于上帝的怜悯，如此便藉着怜悯的盼望而得到安慰。这种恐惧和惊骇的打击，在一个人悔改的开端就会临到他，甚至使他倾向于绝望。因此，这样的悔改的罪人需要反复阅读并牢记圣经中那些安慰人心的章节，以及那些悔改的罪人并蒙受怜悯的例子，以免陷入彻底绝望的毁灭中。
  - type: paragraph
    text:
      ru: 5) Рассуждая о величестве Божием и своей подлости, ибо Бога, Создателя, Искупителя и высочайшего Благодетеля своего, Которого должен любить и почитать, раздражал и прогневлял, и Того, Которого Ангелы и все святые со страхом воспевают и хвалят, он, земля и пепел, не боялся, и Того, Которому обязан тем, что живет, и движется и есть, и бытие свое, душу и тело и весь состав свой от Него имеет, и Божие есть все, чем питается, напаивается, одевается и прочими благами снабжается, – такого Благодетеля не любил, но всегда оскорблял, и к Нему неблагодарен был, и Его величеству не отдавал достойного почтения, какового Создатель от создания требует. Об этом, говорю, и прочем рассуждая, ругает себя, гневается сам на себя, укоряет самого себя, печалится и сокрушается сердцем, а часто и плачет и рыдает, и желает, чтобы того не было, что грешил, но уже, что было, того не возвратить.
      cn: 5) 思考上帝的威严和自己的卑鄙，因为他激怒并冒犯了上帝，祂是他的创造者、救赎主和至高无上的施恩者，是他本应爱戴和敬奉的。天使和所有圣徒都带着敬畏歌颂赞美祂，而他，尘土与灰烬，却不敬畏祂。他的一切生存、活动和存在都仰赖于祂，他的生命、灵魂、身体以及全部身心都是由祂所赐。他所食、所饮、所穿以及其他一切蒙受的恩惠，都来自上帝——他竟不爱这样的施恩者，反而总是冒犯祂，对祂忘恩负义，也没有向祂的威严献上造物主向受造物所要求的应有敬意。我说，思考这些及其他种种，他便咒骂自己，对自己发怒，谴责自己，心中悲伤破碎，常常哭泣流泪，他愿自己不曾犯罪，但已发生之事，已无法挽回。
  - type: paragraph
    text:
      ru: И такая печаль от любви происходит, и это есть истинная, христианская печаль – печалиться не ради пагубы своей, но ради того, что Бога, Создателя и Искупителя своего прогневал. Такую печаль имеющий будет печалиться, хотя бы и муки и царствия небесного не было. Ему вместо муки то одно есть, что он Бога, Который есть едина благость, любовь, правда, святость, милосердие и бесконечное добро, оскорбил и прогневал. Такая печаль – это жертва, Богу благоприятная. Так печалился апостол Петр, который от страха отрекся от любимого Иисуса Христа, «и выйдя вон, плакал горько» ( Мф 26:75 ). И эта печаль вселяется в кающееся сердце от размышления о Божиих благодеяниях, грешником презренных, и не скоро после обращения, но после немалого времени, но ее всем христианам должно иметь.
      cn: 这种忧伤源于爱，这是真实的、基督徒的忧伤——并非为了自己的灭亡而忧伤，而是因为触怒了上帝——自己的造物主和救赎主。拥有这种忧伤的人，即使没有苦楚和天国，也仍会忧伤。对他而言，这本身就是苦楚：他冒犯并触怒了上帝，祂是独一的良善、爱、公义、圣洁、怜悯和无限的良善。这样的忧伤是蒙上帝悦纳的祭品。使徒彼得就是这样忧伤的，他因恐惧而背弃了所爱的耶稣基督，「他就出去，痛哭一场」（马太福音 26:75）。这种忧伤是因思虑上帝的恩惠而注入悔罪之心的，这些恩惠却被罪人轻蔑。它并非在悔改之后立即注入，而是在相当长一段时间之后，但所有基督徒都应当拥有它。
  - type: paragraph
    text:
      ru: '6) Истинно кающийся сам себя уничижает как пред Богом, так и пред людьми, рассуждая, что в себе ничего не находит, кроме грехов, растления и немощи. Душу имеет, но помраченную грехами, и тело, но растленное теми же грехами, и думает о себе как о городе или доме, опустошенном и разграбленном разбойниками, или как о путнике, попавшемся «разбойникам, которые сняли с него одежду, изранили его и ушли, оставив его едва живым» ( Лк 10:30 ). Поэтому признает от сердца свое недостоинство и, подражая блудному сыну, исповедуется пред Небесным Отцом, говоря: «Отче! я согрешил против неба и пред тобою и уже недостоин называться сыном твоим; прими меня в число наемников твоих» ( Лк 15:18–19 ). И утешается милостью благоутробного Небесного Отца, которая открыта для всех кающихся, и для него, как одного из всех.'
      cn: 6) 真正悔改者在上帝和人面前自卑，他省察自己，除了罪恶、败坏和软弱，别无所有。他有灵魂，但被罪恶蒙蔽；他有身体，但被同样的罪恶败坏。他看待自己，如同被强盗洗劫一空的城邑或房屋，又如同那遭遇「强盗，剥去他的衣裳，把他打个半死就走了」的旅客（路加福音 10:30）。因此，他从心里承认自己的不配，效法浪子，在天父面前认罪，说：「父啊！我得罪了天，又得罪了祢；从今以后，我不配称为祢的儿子，求祢把我当作祢的一个雇工吧！」（路加福音 15:18-19）。他因此得享仁慈天父的怜悯，这怜悯向所有悔改者开放，也向他这位万众中的一员开放。
  - type: paragraph
    text:
      ru: 7) Рассуждая о своем недостоинстве, признает себя недостойным пищи, питья, одежды, света, и прочих благ, от Бога людям данных, ибо Подателя и Источника благ прогневлял и раздражал, и Тому, Которому должен был благодарным быть за благодеяния, неблагодарен был, и так себя недостойным сотворил, но еще и судит себя достойным всякого наказания, не только временного, но и вечного, поскольку вечного и бесконечного Бога раздражал. Однако утешается Божией благодатью, во Христе Иисусе обещанной. Это есть истинное смирение, которое Божию благодать к себе привлекает. Ибо «смиренным Бог дает благодать» ( Иак 4:6 ). И «сердце сокрушенно и смиренно Бог не уничижит» ( Пс 50:19 ).
      cn: 7) 思想自己的不配时，他承认自己不配享有食物、饮水、衣裳、光明，以及其他诸般上帝赐予人的恩惠，因为他曾惹那恩惠的赐予者和源头发怒并激怒祂；对于那位他本应为祂的善行而感恩的对象，他却是不感恩的，如此这般，他使自己变得不配。不仅如此，他还判断自己配得上一切刑罚，不但是暂时的，更是永恒的，因为他激怒了永恒无限的上帝。然而，他却因着在基督耶稣里所应许的上帝的恩典而得到安慰。这就是真实的谦卑，它将上帝的恩典吸引到自己身上。因为「上帝赐恩于谦卑的人」（雅各书 4:6）。以及「忧伤痛悔的心，上帝必不轻看」（诗篇 50:19）。
  - type: paragraph
    text:
      ru: 8) Прошедшее время, как во грехах и беззакониях прожитое, оплакивает, и желал бы возвратить его, но, что уже прошло, того не возвратить.
      cn: 8) 他哀悼过去的时间，因其仿佛是在罪恶与不法中度过一般，并且渴望能将其挽回；然而，那已然逝去的，是无法挽回的。
  - type: paragraph
    text:
      ru: 9) Обиду всякую, нанесенную себе, прощает и, видя ближнего согрешающим, не осуждает, но соболезнует ему, поминая, что и сам в таком же бедствии был.
      cn: 9) 他赦免一切加诸于己的伤害，并且，当他见到近人犯罪时，不予论断，反而同情他，念及自己也曾处于同样的困境之中。
  - type: paragraph
    text:
      ru: 10) Ум и сердце свое от времени и мирских вещей отвращает и обращает к вечности и блаженной, и неблагополучной, и усердно старается и молится, чтобы блаженную получить, а от неблагополучной избавиться, и прочее. Это знаки истинного покаяния, которого, как себе, так и тебе усердно желаю.
      cn: 10) 他将自己的心智与心灵从时间和世俗事物上转离，并转向永恒，转向其中的福乐与祸患；他殷勤地努力并祈祷，以期获得福乐，而摆脱祸患，等等。这些是真实悔改的标记，我无论对自己，还是对你，都殷勤地祝愿拥有它。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Достойно ты спрашиваешь, как отпущения грехам и исцеления язвам душевным искать, ибо надобно прежде знать источник, от которого эта целительная, животворящая и прохлаждающая нас вода проистекает, и тогда из него черпать с верой подобает, чтобы прохладить души наши, грехами и страхом суда Божия сокрушенные.
      cn: 你问得很好，如何寻求罪的赦免和灵魂创伤的医治，因为首先必须知道这医治、赐生命、使我们得清凉的水从何涌流出来，然后就当凭着信心从其中汲取，以使我们被罪和对上帝审判的恐惧所压伤的灵魂得享清凉。
  - type: paragraph
    text:
      ru: 'Я тебе на это отвечаю из святого Божия Слова. Сыны Израилевы, исшедшие из Египта и пустыню проходящие, когда угрызаемы были змеями, взирали на змею, вознесенную Моисеем по повелению Божию, и так от язв смертоносных змеиных исцелялись ( Числ 21:9 ). Так нам, угрызаемым змием адским, змием древним, дьяволом, который прародителей наших в раю уязвил, должно взирать верой на Христа Сына Божия, ради наших грехов на древо вознесенного, и у Него с умилением и сокрушением сердца просить исцеления от язв греховных. Без Него исцеления нам не бывает. Ибо Он «Агнец Божий, Который берет на Себя грех мира» ( Ин 1:29 ). И вознесение той змеи знаменует вознесение Сына Божия на Крест, как Сам Христос это истолковал: «Как Моисей вознес змию в пустыне, так должно вознесену быть Сыну Человеческому, дабы всякий, верующий в Него, не погиб, но имел жизнь вечную» ( Ин 3:14–15 ).'
      cn: 我以此出自上帝的圣言回答你。离开埃及并穿越旷野的以色列子民，当被毒蛇咬伤时，仰望摩西奉上帝之命所举起的铜蛇，于是从致命的蛇伤中痊愈。(民数记 21:9) 同样，我们这些被地狱的毒蛇、古老的蛇、魔鬼（它在乐园中刺伤了我们的始祖）所咬伤的，应当以信心仰望上帝之子基督——祂为了我们的罪被举在木架上——并在祂面前带着痛悔和破碎的心，恳求从罪的伤口中得到医治。离开祂，我们无法得到医治。因为祂是「上帝的羔羊，除去世人罪孽的！」(约翰福音 1:29) 那蛇的被举起，预表着上帝之子被举上十字架，正如基督自己所阐明的：「摩西如何在旷野举起蛇，人子也必照样被举起来，叫一切信祂的，不至灭亡，反得永生。」(约翰福音 3:14-15)
  - type: paragraph
    text:
      ru: Итак, согрешившему должно взирать на Христа распятого, и к Сидящему ныне одесную Бога очи сердечные возводить, и так язвам греховным исцеления просить с верою.
      cn: 所以，犯罪者当仰望被钉十字架的基督，并将心眼举向今坐在上帝右边的那位，如此这般，凭着信心为罪的创伤祈求医治。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Правильно ты и о том вопрошаешь, всякому ли греху отпущение бывает, когда человек, оставив грехи, с сокрушением сердца кается. Ибо одна из козней дьявольских та, что он обратившегося грешника и кающегося часто злыми помыслами отчаяния смущает, и так хочет его в отчаяние о милосердии Божием и отпущении грехов ввергнуть, представляя ему Божие правосудие и говоря в помыслах: столько и столько зла ты сделал, Бог праведен, Он всем воздает по делам, Он воздаст и тебе по делам твоим злым. Чего ж тебе более ожидать, как суда Божия и осуждения? Перестань веровать, и прочее.'
      cn: 你这样问是对的，即当人弃绝罪恶，以痛悔之心忏悔时，所有的罪孽都能得到宽恕吗？因为魔鬼的诡计之一是，他常常以绝望的恶念扰乱那些回转的罪人和忏悔者，并以此想要将他投入对上帝的怜悯和罪孽宽恕的绝望之中，向他呈现上帝的公义，并在意念中说：「你做了这么多恶事，上帝是公义的，祂按各人的行为报应各人，祂也会照你所行的恶事报应你。你除了上帝的审判和定罪之外，还能指望什么呢？别再相信了，等等。」
  - type: paragraph
    text:
      ru: 'Поэтому отвечаю тебе из Святого Писания, которое всякому греху отпущение и всякому грешнику, истинно кающемуся, прощение и милость Божию обещает. Ты внимай следующим (словам). Святой апостол Иоанн говорит: «Кровь Иисуса Христа, Сына Его, очищает нас от всякого греха» ( 1Ин 1:7 ). Примечай, что Кровь Христова очищает грешника от всякого греха. Апостол Павел говорит: «Христос Иисус пришел в мир спасти грешников» ( 1Тим 1:15 ). И Сам Христос говорит: «Я пришел призвать не праведников, но грешников к покаянию» ( Мф 9:13 ).'
      cn: 因此，我根据圣经答复你，圣经应许赦免一切罪过，并赐予每个真正悔改的罪人以赦免和上帝的怜悯。你要留意以下的话语。圣使徒约翰说：「祂儿子耶稣基督的血，洗净我们一切的罪。」(约翰一书 1:7) 你当注意，基督的宝血洗净罪人的一切罪过。使徒保罗说：「基督耶稣降世，为要拯救罪人。」(提摩太前书 1:15) 基督祂自己也说：「我来本不是召义人，乃是召罪人悔改。」(马太福音 9:13)
  - type: paragraph
    text:
      ru: 'Видишь, что нет различия между грешниками, но всех призвать на покаяние, всех спасти пришел Христос. Не сказано, что таких-то и таких грешников призвать на покаяние и спасти пришел Христос, но всяких грешников, какие бы они ни были. Еще Христос говорит: «Сын человеческий пришел взыскать и спасти погибшее» ( Лк 19:10 ). Видишь, что не сказано, что пришел того и того погибшего спасти, но всякого погибшего, кто бы он ни был. Поскольку как все согрешили, так все и погибли, и поэтому Христос пришел всех погибших взыскать и спасти, которые покаются и примут Его за своего Спасителя.'
      cn: 你看，罪人之间并无区别，基督的降临是为了召叫所有罪人悔改，拯救所有罪人。经上并未言明基督降临是为了召叫「这类或那类」罪人悔改并拯救他们，而是为了召叫所有罪人，无论他们是何种罪人。此外，基督还说：「人子来，为要寻找拯救失丧的人」（路加福音 19:10）。你看，经上并未言明祂降临是为了拯救「这个或那个」失丧的人，而是为了拯救所有失丧的人，无论他是谁。既然所有人都犯了罪，所有人都已失丧，因此，基督降临是为了寻找并拯救所有失丧的人，就是那些将要悔改并接受祂为自己救主的人。
  - type: paragraph
    text:
      ru: 'Апостол Павел говорит: «Христос за всех умер» ( 2Кор 5:15 ). Видишь, что нет различия и здесь, но за всех и всякого грешника, какой бы он ни был, умер Христос. Поэтому всякий грешник, если истинно покается, спасается смертью Христовой.'
      cn: 使徒保罗说：「基督为众人死了」（哥林多后书 5:15）。你看，在这里也没有分别，而是为众人，并为每一个无论他是怎样的罪人，基督都死了。所以，每一个罪人，如果真心悔改，就藉着基督的死而得救。
  - type: paragraph
    text:
      ru: 'Истинно то, что тяжко согрешает человек, когда, крещением святым омытый, уклоняется на путь нечестия и бесстрашно разоряет Божий закон. Ибо так он нарушает свои обеты, которые дал Богу и Создателю своему, отстает от Бога и пристает опять к сатане, от которого и дел его злых тогда отрекся; погубляет всю ту благодать, которой от Бога тогда сподобился, опять делается сыном тьмы, несмотря на то, что благодатью сделался было сыном света, и вместо наследия вечной жизни повинен бывает вечной муке. С ним «случается по верной пословице: пес возвращается на свою блевотину, и вымытая свинья идет валяться в грязи» ( 2Петр 2:22 ).'
      cn: 确实如此，人犯下重罪，当他已被圣洗涤净，却偏离不敬虔之道，且毫无畏惧地破坏上帝的律法。因为他如此违背自己的誓言，就是他向上帝和他的造物主所发的誓言，远离上帝，又重新依附撒但，当时他曾弃绝了撒但及其邪恶之行；他毁弃了所有的恩典，就是他当时从上帝所领受的，再次成为黑暗之子，尽管他曾因恩典成为光明之子，并且，他非但得不到永生为业，反而当受永罚。他的景况正应了这句真确的俗语：「狗转过来吃它所吐的，猪洗净了又回到泥里去滚」（彼得后书 2:22）。
  - type: paragraph
    text:
      ru: Но когда тот же грешник опять к Богу обращается с истинным покаянием, тогда Бог с милостью Своей к нему обращается, и принимает его, как блудного сына, и подает ему одежду оправдания, которую на крещении принял было и потерял нерадением, и делает его опять участником святой Своей семьи, то есть верных Своих. Тогда ему святое крещение снова полезно бывает, которое ему, пока в грехах жил, бесполезно было. Ибо обеты, которые он не сохранил, вновь возобновил, и, признав свою виновность, просит у Бога милости, и обещает исправно и по-христиански жить и Богу служить, потому и Бог, будучи милостивым, опять в Свою милость его принимает.
      cn: 但是，当同一个罪人带着真正的忏悔再次向上帝回转时，那时上帝便以祂的怜悯向他回转，接纳他，如同浪子一般，并赐予他称义的袍服——这袍服他曾在洗礼中领受，却因疏忽而失落了——使他再次成为祂圣洁家族的成员，也就是祂的信徒。那时，圣洗对他而言便再次变得有益，而当他活在罪中时，圣洗曾是对他无益的。因为他重新更新了他曾未能持守的誓约，并且，承认了自己的罪过，向上帝祈求怜悯，并承诺将循规蹈矩地、以基督徒的方式生活并侍奉上帝，因此上帝，因着祂的怜悯，便再次以祂的怜悯接纳他。
  - type: paragraph
    text:
      ru: 'Святой апостол Иоанн к верным и святым крещением омытым, пишет: «Если бы кто согрешил, то мы имеем ходатая пред Отцем, Иисуса Христа, праведника; Он есть умилостивление за грехи наши, и не только за наши, но и за грехи всегомира(\» Ин 2:1–2 ). Видишь, что не сказано «легко согрешил», но подразумевается «как бы кто ни согрешил», и ходатайство Христово согрешившему обещается, ради которого согрешивший от греха очищается. Ибо если Господь нам друг другу повелевает прощать согрешения каждый день, не только «до семи раз, но до седмижды семидесяти раз» ( Мф 18:22 ), нам, говорю, которые жестокосердны, немилостивы, то насколько более Сам Бог, естеством благой и милостивый, учинит сие.'
      cn: 圣使徒约翰致那些因洗礼而洁净的忠信者与圣徒，写道：「若有人犯罪，我们有一位在父面前的代求者，就是那义者耶稣基督；祂为我们的罪作了挽回祭，不单是为我们的罪，也是为普世人的罪。(约翰一书 2:1-2)」你看，这里并没有说「轻易地犯了罪」，而是指「无论犯了什么罪」，基督的代求应许给了那犯罪之人，藉着祂，犯罪之人得以从罪中洁净。因为如果上主命令我们每天彼此饶恕罪过，不仅仅是「到七次，而是到七十个七次」(马太福音 18:22)，我说，就是我们这些心硬、不仁慈的人，那么本性是美善和慈悲的上帝，岂不更会成就此事吗？
  - type: paragraph
    text:
      ru: 'Не сократились щедроты Его, и каково величество Его, такова и милость Его. Великий грех великой и милости Божией требует. «Помилуй мя, Боже, по велицей милости Твоей» , – молится Давид ( Пс 50:3 ). Многие и тяжкие грехи множества и щедрот Божиих требуют, как тот же Давид просит: «По множеству щедрот Твоих очисти беззаконие мое» . Поэтому тому, кто совершил великий грех, – к великому Божию милосердию прибегать должно; и тому, кто содеял множество грехов – ко множеству щедрот Божиих. Итак, «когда умножился грех, стала преизобиловат благодать» ( Рим 5:20 ). Ибо Бог, будучи милосердным, «хочет, чтобы все люди спаслись и достигли познания истины» ( 1Тим 2:4 ), и всех и всякого грешника призывает к покаянию, чтобы все, покаявшись, спаслись, как из всего Писания видно. Как же не примет всякого грешника, какой бы ни был, и как всякого греха не отпустит кающемуся Тот, Который всякого грешника к покаянию призывает?'
      cn: 祂的慷慨未曾减少，祂的威严如何，祂的怜悯也如何。大罪需要上帝的大怜悯。「上帝啊，求祢照祢丰盛的怜悯怜悯我。」大卫如此祈祷（诗篇 50:3）。众多而沉重的罪需要上帝的众多慷慨，正如大卫也祈求：「照祢丰盛的慷慨洁净我的不法。」因此，凡犯大罪的，就当投靠上帝的大怜悯；凡犯众多罪的，就当投靠上帝的众多慷慨。于是，「罪在哪里增多，恩典就越发丰盛了」（罗马书 5:20）。因为上帝既是怜悯的，「祂愿意所有人都得救，并达到真理的知识」（提摩太前书 2:4），并且呼召所有和每一个罪人悔改，好叫所有人都因悔改而得救，正如从全部圣经所见。呼召每一个罪人悔改的那一位，又怎会不接纳任何罪人，无论他是谁，又怎会不赦免悔改者的任何罪呢？
  - type: paragraph
    text:
      ru: Ибо Божии слова не тщетны, не праздны и не суетны, но истинны. Что обещает, то непременно будет, и чем грозит, то последует нераскаянным и ожесточенным. Ибо на то и Суд Страшный в Писании Своем объявил, чтобы люди каялись и, покаявшись, избежали страшного изречения. Для того геенну и прочие казни объявил, чтобы покаялись и не впали в геенну. Так и к покаянию всякого грешника, малого и великого, призывает, чтобы все покаялись и получили от Него милость.
      cn: 因为上帝的话语并非徒然，并非空虚，也并非虚妄，而是真实的。祂所应许的必然成就，祂所警示的必会临到那些不悔改和心硬之人。因为祂在祂的圣经中宣告严厉审判，正是为了使人们悔改，并在悔改之后避开那可怕的宣判。为此，祂宣告了地狱以及其他的刑罚，为使他们悔改，且不坠入地狱。如此，祂呼召每一个罪人，无论大小，为使所有人悔改，并从祂那里领受怜悯。
  - type: paragraph
    text:
      ru: У кого великие и многие грехи, на того, если кается, великую Свою милость и множество щедрот Своих изливает, «ибо у Господа милость, и многое у Него избавление» ( Пс 129:6 ). На это имеем много примеров. Кто был Манассия? – Великий грешник. Петр трижды отрекся от Христа. Давид тяжко согрешил прелюбодеянием и убийством, но все они, покаявшись, получили у Господа милость. Также читаем и в церковной истории, что многие блудницы, разбойники и прочие тяжкие грешники покаялись и получили у Господа милость. Кто подражал им в грехах, пусть подражает им и в покаянии, и так получит милость. Ибо на то и примеры эти написаны, чтобы подражали их покаянию и с ними помилованы были. Бог на лица не смотрит, но всех кающихся равно милует.
      cn: 谁有极大和众多的罪孽，若他悔改，上帝就向他倾泻祂伟大的慈悲和众多的恩慈，「因为上主有慈悲，在祂那里有丰盛的救赎。」（诗篇 129:6）。对此我们有许多例子。玛拿西是谁？——一个大罪人。彼得曾三次否认基督。大卫曾因奸淫和谋杀而犯下重罪，但他们都因悔改而从上主那里获得了慈悲。我们也在教会历史中读到，许多娼妓、强盗和其他重罪人悔改了，并从上主那里获得了慈悲。谁在罪孽中效法了他们，也当在悔改中效法他们，如此便能获得慈悲。因为这些例子被写下，正是为了让人效法他们的悔改，并与他们一同蒙受赦免。上帝不看人的外貌，但平等地怜悯所有悔改的人。
  - type: paragraph
    text:
      ru: Итак, не величество, ни множество грехов губит грешника, но нераскаянная жизнь. Совершивший многие, великие и тяжкие грехи спасется, если истинно покается, а кто, хотя и меньшие грехи делает, но нераскаянным пребывает – погибнет. Ибо Бог судит не согрешивших, но согрешивших и непокаявшихся, и не смотрит на то, как кто жил, но как ныне живет и кается, и какое усердие, и какое расположение сердца имеет. Не смотрит, что делал, мыслил и начинал, но смотрит, что делает, мыслит и начинает, то есть требует изменения и исправления внутреннего и обновления сердечного. И судит человека не по тому, что делал прежде, но по тому, что (ныне) делает, и в чем кончина его постигнет.
      cn: 所以，既非罪孽的深重，亦非罪行的众多毁灭罪人，而是不悔改的生命。犯下许多、重大且深重之罪的人，若真心悔改，将蒙拯救；而那哪怕只犯了较小之罪，却仍不悔改的人，必将灭亡。因为上帝审判的并非仅仅是那些犯了罪的人，而是那些犯了罪却不悔改的人；祂不看一个人过去如何生活，而是看他现在如何生活和悔改，以及他怀有怎样的热忱和怎样的心意。祂不看他过去做过什么、思想过什么以及开始过什么，而是看他现在在做什么、在思想什么以及在开始什么，也就是说，祂要求内在的改变与修正，以及心灵的更新。祂审判人，并非依据他以前所做的，而是依据他（现在）所做的，以及他将死于何种境况。
  - type: paragraph
    text:
      ru: Так и правда праведника не помянется, если совратится, и беззакония беззаконника не погубят, если беззакония оставит и чистосердечно покается. В чем кончина человека застанет, с тем и пред судом Божиим явится. Поэтому никому, ни малому, ни великому грешнику не должно отчаиваться и ожесточаться, но должно всякому чистосердечно обратиться к Богу, и просить, и несомненно ожидать от Него милости, и, переменив внутренне состояние на лучшее, от чего и внешние дела добрыми будут, стоять в том начатом добром деле, и против всякого греха подвизаться, и не попускать никакому греху над собой царствовать, чего истинное обращение и покаяние требует.
      cn: 同样，义人的公义若他偏离，便不再被记念；恶人的不法之事若他离弃不法，并真心悔改，则不致毁灭他。人的临终境况如何，他就会以何种境况在上帝的审判台前显现。因此，无论是小罪人还是大罪人，任何人都不可绝望和心硬，反而，每个人都当真心归向上帝，祈求并确信无疑地仰望祂的怜悯，并且，将内在状态改变得更好，由此外在行为也将是良善的，坚守那已开始的善行，与一切罪恶争战，不容许任何罪恶在自己身上作王，这正是真正归主与悔改所要求的。
  - type: paragraph
    text:
      ru: Рассуждай об этом, и всякое сомнение и уныние, как бесовское дело, стряхнув с себя, кайся и стой в том до конца, и спасешься, чего, как себе, так и тебе от сердца желаю.
      cn: 深思此事，并将一切疑惑与沮丧，视作邪魔的作为，从你身上抖落，悔改并坚守到底，你便能得救。我从心底里祝愿你我都能如此。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Вижу я, что тебе и то не очень понятно, что значит переменить внутреннее состояние. Поэтому я тебе, по силе моей, и это изъясню.
      cn: 我看你连改变内在状态意味着什么也不是很明白。因此，我就尽我所能，给你解释这一点。
  - type: paragraph
    text:
      ru: 'Случилось мне в одной книге читать, что некий юноша жил с блудницей, привязавшись к ней скверной любовью. Потом, желая от скверного дела отстать, удалился от нее на время и несколько в удалении промедлил. Но когда почувствовал, что любовь к ней в нем угасла, возвратился домой, и, по случаю встретившись с ней, молча мимо прошел, и когда на другой день, встретившись с ней, также ничего не говоря ей, мимо прошел, она ему сказала: «Что ты не узнал меня? Ведь я такая-то». На что он ей отвечал: «Но я не тот». Видишь перемену внутреннего состояния в юноше. Не тот сделался, которым прежде был, из прелюбодея сделался целомудренным. Надобно и всякому грешнику не таким сделаться, каким прежде был, если хочет истинно покаяться. Надобно умереть греху, если хочет жить Богу; не служить миру, если хочет служить Христу. Ибо греху и Богу жить, и миру и Христу служить невозможно.'
      cn: 我曾在某本书中读到，某个青年人与一个妓女同居，因污秽的爱恋而依附于她。后来，他想要摆脱这污秽之事，便暂时离开了她，并在独处中逗留了一段时间。但当他感到自己对她的爱恋已熄灭时，便回到了家中。偶然与她相遇，他便默默地从她身边走过。次日再与她相遇时，他同样一言不发地从她身边走过。她便对他说：「你怎么不认识我了？我就是某某啊。」他回答她说：「但我已不是那个我了。」你看，这青年内在状态的改变。他已不是从前的他了，他从一个淫乱之人变得贞洁了。每一个罪人也当变得不再是以前的他，如果他真心悔改的话。他必须向罪死去，如果他想向上帝活着的话；不服侍世界，如果他想服侍基督的话。因为既向罪活着又向上帝活着，既服侍世界又服侍基督，是不可能的。
  - type: paragraph
    text:
      ru: В человеческом сердце кроется злонравие, то есть гордость, ненависть, зависть, гнев, злоба, нечистота, сребролюбие, или любостяжание, славолюбие, честолюбие и всякое зло, от первородного греха появившееся. Все это делает человека злым и нечистым пред очами Божиими. Все это надобно человеку умерщвлять и не позволять, чтобы в действие приходило, и как разрастающиеся ветви на дереве отрезает садовник, так человек должен отсекать бесчинные и богопротивные их движения, и так с помощью Иисуса, Потребителя греха и всей силы вражьей, очищать сердце свое. А чем тщательнее от вышеперечисленных скверн очищать себя будет, тем лучше перемена внутреннего состояния будет. Чем более очищается источник, тем чище вода будет, чем более моется и отирается тело, тем белее бывает, чем более обрезается дерево от вредных отраслей, тем большие и лучшие плоды приносит, так и внутреннее состояние тем лучше бывает, чем усерднее его человек старается переменить на лучшее.
      cn: 在人的心中潜藏着邪恶，亦即骄傲、憎恨、嫉妒、忿怒、恶意、不洁、贪财（或贪婪）、贪图虚名、追求世俗尊荣，以及一切源自原罪的邪恶。所有这一切都使人在上帝眼前变得邪恶和不洁。人必须治死这一切，且不容其付诸行动；正如园丁砍掉树上疯长的枝条，人也当砍断它们那不轨和逆上帝的冲动。如此，借着耶稣——罪的歼灭者与仇敌一切力量的摧毁者——的帮助，洁净自己的心。人越是勤勉地洁净自己，摆脱上述的污秽，其内在的状态就会变得越好。泉源越是洁净，水便越清澈；身体越是洗净擦干，便越洁白；树木越是修剪掉有害的枝杈，便结出越大越好的果实。同样，人越是努力使其内在状态变得更好，这状态便越发美好。
  - type: paragraph
    text:
      ru: Но чтобы человеку переменить себя к лучшему, надобно, во-первых, познать бедное состояние сердца, подобно тому, как хотящему исцелиться от болезни надобно прежде познать болезнь. Для познания же сего нужно чтение Слова Божия и прочих христианских книг, которые показывают и открывают бедность и окаянство сердечного нашего состояния, и учат, как его исцелять и изменять. Нужно размышление о действиях и движениях, от сердца происходящих, которое само по себе не что иное, как смрадный бесчиния и злонравия запах издает. А более всего нужно внутреннее и внешнее искушение, ибо как рвотное лекарство показывает кроющиеся худые соки в желудке и извергает, так искушение показывает, что у кого кроется в сердце. И как чирей, хотя и болит и тяжек всегда, но тогда наилучше познается его болезнь и тяжесть, когда его что-то коснется или ударит, так и человек, хотя и знает, что кроется у него в сердце, но в нашедшем искушении более и лучше это узнает. Искушение все тайное и сокровенное открывает и человеку самого себя перед глазами его поставляет.
      cn: 然而，为了一个人能使自己变得更好，首先必须认识到自己心灵的贫乏状态，如同一个想要从疾病中痊愈的人，必须首先认识到疾病本身。为了认识这一点，则需要阅读上帝之道以及其他基督教书籍，它们揭示并显明我们内心的贫乏和可怜光景，并教导我们如何治愈并改变它。还需要默想那些源自内心的行为和意念，因为内心本身所散发出来的，无非是放荡和邪恶的恶臭。而最重要的是，需要内在和外在的试炼，因为正如催吐剂能显出并排出胃中隐藏的有害液体一样，试炼也同样显出一个人内心隐藏着什么。正如痈疽，虽然总是疼痛且沉重，但当它被触碰或击打时，其疼痛和沉重感才最清楚地被认识到；同样，一个人即便知道自己内心隐藏着什么，但在临到的试炼中，他会更深、更清楚地认识到这一点。试炼会揭示所有隐秘和深藏的事物，并让一个人将真正的自己呈现在自己眼前。
  - type: paragraph
    text:
      ru: Видим эту истину при случаях. Скажи, когда гнев, кроющийся в сердце нашем, познаем? Не тогда ли, когда нас обидит кто? Зависть когда показывает себя, разве не при похвале и благополучии другого? Похоть нечистая от видимой или виденной красоты лица особенно разжигается, негодование и роптание в несчастье и нашедшей беде является. Многие в счастье мужественными и великодушными себя показывают, но в беде пришедшей падают, малодушествуют и от боязни отчаиваются. Многие полагают в благополучии, что на Бога надежду имеют, но в нашедшей буре оказывается, что не на Бога, а на человека, на серебро и золото надеются, когда от них помощи ищут в печали.
      cn: 我们在这些场合看到这真理。请问，我们何时才能认识到隐藏在我们心中的怒气呢？难道不是在有人冒犯我们的时候吗？嫉妒何时显现自己呢？难道不是在他人受到称赞和享有福乐的时候吗？不洁的贪欲尤其会被所见或曾见的容颜之美所燃起，而愤懑和抱怨则在不幸和遭遇患难时显现出来。许多人在顺境中表现出勇敢和宽宏大量，但在患难来临时却跌倒、意志消沉，并因恐惧而绝望。许多人在福乐中认为自己信靠上帝，但在暴风雨来临时却发现，他们所倚靠的并非上帝，而是人、金银财宝，因为他们在悲伤中向这些寻求帮助。
  - type: paragraph
    text:
      ru: Видишь, как искушение открывает, что в сердце нашем содержится, а отсюда видно, насколько полезно искушение для познания внутреннего состояния. А познавшему немощи свои надобно их исцелять истинным покаянием, сожалением и призыванием Иисуса Христа, Врача душ и телес, подобно тому, как немощный телом не пренебрегает своей немощью, но лекаря призывает и просит от него исцеления.
      cn: 你看，试探如何显明我们心中所存的，由此可见，试探于认识内在状态何其有益。而认识到自身软弱之人，必须以真实的悔改、痛悔以及呼求灵魂与肉体之医者耶稣基督来医治它们，犹如身体软弱者不轻忽自己的软弱，却召唤医者并向他祈求医治。
  - type: paragraph
    text:
      ru: Так особенно нам, христианам, видя в себе, то есть в душах наших многоразличные недуги, которыми души наши расслабляются и к вечной смерти клонятся, не должно коснеть, медлить и нерадеть, но призывать Иисуса Сына Божия и от Него исцеления просить. Один Он эти недуги как ведает совершенно, так и исцеляет не зельем, но словом единым. Требуется же и с нашей стороны труд, усердие, подвиг и неусыпное старание. Тело немощное стараемся лечить, хотя и знаем, что в землю обратится, насколько более об исцелении души заботиться должно, которая бессмертна. Что пользы тело здоровое иметь, а душу немощную? Лучше телом гнить, а душой здравствовать, нежели телом быть здоровым, а душой немощным. Лечи или не лечи тело, однако же сгниет, а если душа здорова будет, то и тело, в воскресение общее соединившись с душой, оздоровеет, и в бессмертие облечется, и в прекрасный вид оденется.
      cn: 尤其我们基督徒，当看到自身，即我们灵魂中各种各样的病患，这些病患使我们的灵魂虚弱萎靡，并倾向于永恒的死亡时，就不当迟延、怠惰、疏忽，而当呼求耶稣，上帝之子，并向祂祈求医治。唯有祂，不仅完全知晓这些病患，而且不以药剂，而仅以一言医治。然而，也需要我们这边付出劳苦、热心、苦修和不倦的努力。我们努力医治这软弱的身体，尽管我们知道它将归于尘土；那么对于不朽的灵魂的医治，我们又该多么更加地关心啊！身体健康而灵魂软弱，有何益处？宁可身体腐朽，而灵魂健全，也不愿身体健康，而灵魂软弱。无论你医治与否，身体终将腐朽；但若灵魂健全，那么身体在普遍复活中与灵魂结合后，也会健全，并穿上不朽，披上美丽的形貌。
  - type: paragraph
    text:
      ru: Видишь, что значит изменить внутреннее состояние. К изменению внутреннего состояния надлежит и мира сего презрение, то есть не иметь в мире этом чести, славы, богатства, плотоугодия, но обратить ум и сердце свое к вечности, о том одном помышлять, как бы благодатью Божией избежать неблагополучной вечности и получить благополучную. Об этом у всякого христианина старание неусыпное должно быть. «Ибо преходит образ мира сего» ( 1Кор 7:31 ). Сегодня человек живет, а завтра умирает и оставляет мир, и с миром все оставляет, – честь, славу, богатство и всякую похоть плотскую; и богатый бывает как нищий, и славный как безродный, и благородный как худородный, и господин как раб.
      cn: 你看，这就是改变内在状态的意义。伴随内在状态的改变而来的，还有对这世间的弃绝，也就是说，不在这世上追求尊荣、荣耀、财富、肉体享乐，而是将自己的心思和内心转向永恒，唯独思考一件事：如何借着上帝的恩典，避开不幸的永恒，而获得幸福的永恒。对此，每一个基督徒都应当有不懈的努力。「因为这世界的形像正在逝去。」（哥林多前书 7:31）今日人活着，明日却死了，并离开这世界，并且与这世界的一切一同舍弃——尊荣、荣耀、财富以及各样的肉体私欲；富足的变得如同乞丐，荣耀的如同无家世的人，高贵的如同出身卑贱的人，主人如同奴仆。
  - type: paragraph
    text:
      ru: Так, когда переменится сердце, или внутреннее состояние, тогда от измененного сердца последуют начинания, дела, слова и вся жизнь подобная тому. Так от источника очищенного чистая вода течет, от доброго дерева добрые плоды рождаются, и прочее. И к этому много труда, старания и подвига требуется, так как глубоко сердце человеческое растленно и повреждено ядом первородного греха, и трудно и мало кем познается, разве что теми, которые в том поучаются и в различных искушениях бывают, ибо искушение, как выше сказано, открывает, что в сердце нашем сокровенно есть.
      cn: 那么，当心，或内在状态改变时，从这改变了的心，将随之而来的是相应的意念、行为、言语以及整个生命。就像从洁净的源泉流出洁净的水，从好树结出好果子，等等。并且为此需要大量的劳苦、努力和苦修，因为人心深处被原罪之毒腐蚀和败坏，且难以被认识，鲜少有人能认识，除非是那些在其中受教并在各种试探中之人，因为试探，如上文所说，能显露我们心中所隐藏的。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 21 – 30
    cn: 书信 21 – 30
  children:
  - type: paragraph
    text:
      ru: 'Два вопроса ты задал мне:'
      cn: 你问了我两个问题：
  - type: paragraph
    text:
      ru: 1) Что значит жить греху, и что – жить Богу?
      cn: 向罪而活意味着什么，向　上帝而活又意味着什么？
  - type: paragraph
    text:
      ru: 2) Зачем мир (надо) презреть, если он ради нас создан? – на которые я тебе по силе моей отвечаю.
      cn: 2) 既然世界是为我们而造的，为何要弃绝它呢？——对此，我尽我所能地回答你。
  - type: paragraph
    text:
      ru: 1) Знаешь ты, что мертвый человек не слышит, что бы ему ни говорилось и ни приказывалось, так и духовно мертвый не слушает и не внимает тому, что Ему Бог в слове Своем говорит, но делает только то, что похотливое сердце его хочет. Такой человек для Бога мертв, ибо живет не по Богу, но по своей злой воле, поскольку не то делает, что Бог хочет и велит, но что страстная плоть. Живет же греху, потому что грех, который в сердце живет, слушает и ему повинуется. Как и раб у того господина живет, которого слушает, и которому повинуется, и волю которого исполняет, так человек или Богу живет, когда Богу повинуется и волю Его творит, или греху живет, если греху повинуется и творит его.
      cn: 你知道，死人听不见无论对他说什么，无论命令他什么；同样，属灵上已死之人不听从，也不留意上帝在祂圣言中对他说的话，而只做他那贪恋的心所想做的。这样的人在上帝面前是死的，因为他不是按着上帝而活，而是按着自己的邪恶意愿而活，因为他所做的不是上帝所愿和所吩咐的，而是情欲的肉体所愿的。他是为罪而活，因为那活在他心中的罪，他听从并顺服它。就像奴仆为他所听从、所顺服、并遵行其旨意的主人而活，同样，人或为上帝而活，当他顺服上帝并遵行祂的旨意时；或为罪而活，如果他顺服罪并实行罪。
  - type: paragraph
    text:
      ru: 'Итак, всякий человек или Богу живет, или греху. Кто в истинном покаянии находится и заповеди Божии, в которых воля Божия изображена, исполняет, тот Богу живет, а кто в нераскаянии пребывает и грех творит, тот не Богу, но греху живет. Поэтому Богу живущий называется рабом Божиим, ибо служит Ему творением воли и заповедей Его, а живущий греху рабом греха называется, ибо делает то, что грех хочет, по Писанию: «Всякий, делающий грех, есть раб греха» ( Ин 8:34 ). А невозможно и греху и Богу жить потому бывает, что Бог запрещает то, что грех или похоть греховная хочет и советует. Бог запрещает гневаться, злиться, мстить, блудодействовать, красть, злословить, и прочее, но к тому похоть влечет. Итак, невозможно и похоть слушать и Бога, и похоти жить и Богу. «Никто не может служить двум господам» ( Мф 6:24 ).'
      cn: 那么，每个人要么为上帝而活，要么为罪而活。谁若处在真实的忏悔中，并遵守刻画着上帝旨意的诫命，那他就为上帝而活；而谁若身处不悔改中并犯罪，他就不是为上帝，而是为罪而活。因此，为上帝而活的被称为上帝的仆人，因为他借着遵行祂的旨意和诫命来事奉祂；而为罪而活的被称为罪的奴仆，因为他做罪所想做的事，正如圣经所说：「凡犯罪的，就是罪的奴仆」（约翰福音 8:34）。而无法同时为罪又为上帝而活，是因为上帝禁止罪或罪性的私欲所想做和所建议的事。上帝禁止愤怒、发怒、报复、行淫、偷窃、诽谤等等，但私欲却引人去做这些。那么，无法既听从私欲又听从上帝，也无法既为私欲而活又为上帝而活。「一个人不能事奉两个主人」（马太福音 6:24）。
  - type: paragraph
    text:
      ru: 'На второй вопрос отвечаю:'
      cn: 关于第二个问题，我回答：
  - type: paragraph
    text:
      ru: '1) Что ни есть в мире этом, или дорогое, или красивое и приятное людям, то есть богатство, золото, серебро, убор, каменья дорогие, украшение строений, домов, коней, карет, платья, лиц, честь, слава, власть, и прочее, что очам и прочим чувствам и похоти приятно, все то преходяще и отходит от нас, как и сам мир, как апостол учит: «Мир преходит, и похоть его» ( 1Ин 2:17 ). Во время смерти все оставляем, и не только то, что имеем, но и сам мир, и само тело оставляем, а отходим только душами отсюда, ничего с собой не относим. Зачем же о том стараться, что сегодня или завтра оставим?'
      cn: 凡在这世上所有的，或珍贵的，或美丽的，或悦人心的，即财富、黄金、白银、妆饰品、昂贵的宝石、建筑、房屋、骏马、马车、衣裳、容貌的妆饰、尊荣、荣耀、权势，以及其他一切凡是悦人眼目、悦其他感官和私欲的，所有这一切都是转瞬即逝的，都会离我们而去，正如这个世界本身一样，正如使徒教导的：「这世界和其上的私欲都要过去。」 (约翰一书 2:17) 死亡之时，我们舍弃一切，不仅舍弃我们所拥有的，连这个世界本身，连我们自己的身体也要舍弃，只有灵魂从此地离去，不带走任何东西。既然如此，何必为那今日或明日就要舍弃之物而努力呢？
  - type: paragraph
    text:
      ru: '2) Всякий человек, живущий на земле, есть путник. На путь жизни сей всходит, когда рождается; оканчивает же путь сей, когда умирает. Зачем же ему искать многого и обременять себя излишним попечением? А естество малым довольствуется. Естество наше пищи, одеяния, питья, дома и прочих нужных вещей требует, а не украшения и сласти. Похоть ищет богатства, украшения и сласти, а естество нужным только – пищей и одеянием довольствуется, как учит апостол: «Мы ничего не принесли в мир; явно, что ничего не можем и вынести из него. Имея пропитание и одежду, будем довольны тем» ( 1Тим 6:7–8 ).'
      cn: 2) 凡活在地上的人，都是行路之人。当他出生之时，便踏上此生之路；当他死亡之时，便结束此路。他为何要寻求许多，并因过度的忧虑而使自己负重呢？人的本性只需少许便知足了。我们的本性要求食物、衣物、饮水、居所及其他必需之物，而非装饰品和享乐。贪欲寻求财富、装饰品和享乐，而本性只以必需之物——食物和衣物为足，正如使徒所教导的：「我们没有带什么到世上来，显然，我们也不能带什么出去。只要有养生之物和遮身之衣，就当知足了」（提摩太前书 6:7-8）。
  - type: paragraph
    text:
      ru: 'Видишь, чему учит апостол: и в мир ничего не вносим, и из мира ничего не выносим. И на самом деле мы видим, что нам только пища и одеяние нужно, а их Бог подает всякому по Своей благости. Зачем же путнику себя отягощать? Зачем искать то, что с собой из мира не вынесет? Видишь, что прельщаются миром те, которые много ищут в мире; прельщение же это они осознают, когда умирают, но уже поздно.'
      cn: 你看，使徒的教导是：我们进入世界，没有带什么，从世界出去，也没有带什么。实际上我们看到，我们所需的只是食物和衣裳，而这些，上帝凭着祂的良善赐予每一个人。那么，客旅为何要使自己负重呢？为何要寻求他无法从世界带走的东西呢？你看，那些在世上寻求很多的人，被世界所迷惑；而这种迷惑，他们当死亡时才意识到，但为时已晚。
  - type: paragraph
    text:
      ru: Итак, надобно ныне всякому, пока живет, осознавать обманчивость мирских благ и ничего в мире этом за дорогое не иметь, следовательно, и не гоняться ни за чем, и не прилепляться ни к чему. Ибо все в мире этом подобно пузырю, на воде являющемуся и исчезающему, или сновидению, или тени, и прочее. Одно только твердо, постоянно, непоколебимо и никогда от нас не отступит, – это то, что вечно. Того должно тщательно и неусыпно искать, а все временное как ничто иметь. Эту истину из вышеописанного видишь и лучше познаешь, когда будешь умирать. Только от сердца желаю, чтобы ты ныне познал.
      cn: 所以，现今每个人都当趁着在世之时，认清世间福乐的虚妄，且不将世间之物视为珍宝，因此，既不追逐任何事物，也不执着于任何事物。因为世间万物，如同水面上的浮泡，一现即逝，又如梦幻、如影，诸如此类。唯有一物是坚定、永恒、不可动摇，且永不离弃我们的——这就是永恒之事。我们当勤奋不懈地寻求它，而将一切暂时之物视为虚无。这真理，从上述可知，唯有当你临终之时，方能看得更清楚，领悟得更深。我唯有衷心希望你现今就能领悟。
  - type: paragraph
    text:
      ru: '3) Из вышеописанного видишь, что мы рождаемся и святым Крещением обновляемся не ради мира сего (иначе неисходно должны были бы в мире этом пребывать), но рождаемся и обновляемся ради перехода к будущей жизни. Погрешают же и заблуждаются те, которые здесь ищут чести, богатства и славы. Ибо таким своим попечением показывают, что они мир сей за отечество имеют и как бы вовеки хотят здесь жить. Они подобны тем людям, которые, на малое некое время отъехав на чужую сторону, заводят там недвижимые вещи, например, дома, сады, пруды, и прочее, – все, что вынуждены бывают оставлять, возвращаясь в отечество свое, и без всего того в дом возвращаться. Так и мы на малое некое время в мир этот входим, как в чужую сторону, и исходим из него всякий в свое место: благочестивые в вечную жизнь, а нечестивые в вечную муку'
      cn: 3) 从以上所述，你可见我们蒙受诞生，并借着圣洗而得以更新，并非为了此世（否则，我们就必无止尽地留在此世之中），而是为了向来世过渡而蒙受诞生并得以更新。那些在此地寻求尊荣、财富和光荣之人，确实是犯错且迷失了。因为他们以这样的挂虑表明，他们将此世视为自己的家乡，并且似乎想永远在此地生活。他们如同那些人，在短暂的时间内前往异乡，并在那里置办不动产，例如房屋、花园、池塘等等，——所有这些，在他们返回自己的家乡时，都不得不留下，并且两手空空地回家。同样，我们也在短暂的时间内进入此世，如同进入异乡，并离开此世，各自前往自己的归宿：虔敬之人进入永生，而不虔敬之人进入永刑。
  - type: paragraph
    text:
      ru: '4) Адам, праотец наш, в раю был поселен Богом, и тогда был между Богом и созданием, между небом и землей. И когда по совету лукавого духа обратился к созданию и вкусил от заповеданного древа, тогда отступил от Создателя своего, и любовь, которую к Создателю своему должен был иметь, к созданию Его обратил, и так тяжко согрешил, и погиб. Так христианин, банею святого Крещения омытый и обновленный, поселен в Церкви Святой и пребывает между Богом и созданием, между небом и землей. Бог говорит всем христианам: «Не любите мира, ни того, что в мире: кто любит мир, в том нет любви Отчей» ( 1Ин 2:15 ).'
      cn: 4) 我们的始祖亚当，被上帝安置在乐园里，那时他介于上帝与受造之物之间，介于天与地之间。当他听从恶灵的建议，转向受造之物，并尝了禁果之树的果子时，他就背弃了自己的造物主，把他本应献给造物主的爱，转向了祂的受造之物，就这样犯下了重罪，并沉沦了。同样，基督徒借由圣洗之浴蒙洁净和更新后，被安置在圣教会中，安住于上帝与受造之物之间，安住于天与地之间。上帝对所有基督徒说：「不要爱世界，也不要爱世界上的事；人若爱世界，爱父的心就不在他里面了。」（约翰一书 2:15）
  - type: paragraph
    text:
      ru: 'Христианин, когда обращается к миру и земному, отвращается от Бога и неба, и когда любит создания, отступает любовью от Создателя, и так сердцем своим отступает от Бога и прилепляется к созданию, и, как Адам, всегда руку свою простирает к заповеданному древу. Ибо мир сей нам, как Адаму древо заповеданное, к искушению нашему положен, к чему мы обратим сердце наше: к Богу или к миру. Когда к Богу обратим – от мира отвратим, и когда к миру обращаемся – от Бога отвращаемся. Ибо мир и Бога любить невозможно, как выше сказано: «кто любит мир, в том нет любви Отчей» . Как Адаму не велел Бог вкушать от древа того, так и нам ныне говорит: «Не любите мира, ни того, что в мире» .'
      cn: 基督徒，当他转向世界和属地之事时，就转离上帝和天国；当他爱慕受造物时，就因爱而远离造物主；如此便以他的心远离上帝，而依附于受造物，并且，如同亚当一般，总是伸手触碰那被禁戒的树。因为这世界对我们而言，正如那对亚当而言的被禁戒的树，被置于此，为要试探我们，试探我们会将心转向何处：转向上帝还是转向世界。当我们转向上帝时，就转离世界；当我们转向世界时，就转离上帝。因为爱慕世界和爱慕上帝是不可能的，正如经上所言：「谁若爱世界，天父的爱就不在他里面了。」 正如上帝不许亚当吃那树上的果子，照样，现今也对我们说：「不要爱世界，也不要爱世界上的事。」
  - type: paragraph
    text:
      ru: 'Итак, видишь, ради чего мы должны презреть мир, то есть, чтобы Бога нашего почтить; мир не любить, чтобы Бога возлюбить, создание оставить, чтобы Бога обрести, от создания отвратиться, чтобы к Богу обратиться. Ибо как не можем и к востоку и к западу, и к небу и к земле одновременно смотреть, так и к миру и к Богу прилепляться сердцем. Когда очи наши обращаем к земле, то отвращаем от неба, и когда обращаемся к западу, отвращаемся от востока, – так точно отвращаемся от Бога сердцем, когда любим мир, и когда к Богу сердечно обращаемся, тогда от мира отвращаемся. Одно из двух надобно всякому избрать. «Никто не может служить двум господам: ибо или одного будет ненавидеть, а другого любить; или одному станет усердствовать, а о другом нерадеть» ( Мф 6:24 ).'
      cn: 如此，可见我们为何理当鄙弃世界，也就是说，为了尊荣我们的上帝；不爱世界，为了爱上帝；舍弃受造物，为了寻见上帝；转离受造物，为了归向上帝。因为正如我们不能同时向东又向西，同时向天又向地观看，同样也不能同时以心系于世界又系于上帝。当我们的眼睛转向地面时，便转离天空；当我们转向西方时，便转离东方；—— 正是如此，当我们爱世界时，心里便转离上帝；当我们诚心归向上帝时，那时便转离世界。人人都必须在两者之间作出选择。「无人能事奉二主；因为他不是恨恶一个爱另一个，就是忠于一个忽略另一个。」（马太福音 6:24）
  - type: paragraph
    text:
      ru: 5) Душа наша по образу Божию создана и, падшая, Кровью Христовой искуплена и святым Крещением обновлена!.. О, сколь велико благородство, достоинство и красота души! Кровь Христова за нее дана, и образ Божий носит в себе... Честнее неба и земли и всей твари одна душа человеческая.
      cn: 5) 我们的灵魂是照着上帝的肖像所造的，它堕落之后，便借着基督的宝血蒙受救赎，且藉圣洗而得以更新！哦，灵魂何等尊贵、何等有尊严、何等美丽啊！基督的宝血为它而舍，并且它自身带有上帝的肖像……唯有人类灵魂，比天和地以及一切受造之物更加尊贵。
  - type: paragraph
    text:
      ru: О, любезная, бессмертная и великолепная красота, благородство, честь и достоинство души! Ниже Бога, как создание Его, и выше всей твари, так как образ Божий имеет в себе.
      cn: 哦，灵魂那可爱的、不朽的、宏伟的美丽、高贵、尊荣和尊严啊！在上帝之下，作为祂的受造物；并且超越一切受造物，因为它在自身中怀有上帝的形像。
  - type: paragraph
    text:
      ru: Такую благородную и высокопочтенную душу (о, горе нам, о, бедность и слепота наша!) порабощаем бесчувственному и подлейшему созданию, когда сердцем нашим и любовью к нему обращаемся. Должно было, чтобы создание нам служило, на что и создано от Бога. Но напротив того делается. Мы созданию, низшему себе, служим, когда к нему сердцем обращаемся. Видишь, как неприлично и худо поступает человек, когда мир любит.
      cn: 如此尊贵且备受崇敬的灵魂（唉，我们有祸了！唉，我们的贫乏和盲目啊！），我们竟将其奴役于无感且最卑劣的受造物，当我们以心和爱转向它的时候。受造物本应服事我们，这正是上帝创造它的目的。但事实恰恰相反。我们却服事比我们低等的受造物，当我们以心转向它时。你看，当人爱慕世界时，他的行为是何等的不合宜与恶劣。
  - type: paragraph
    text:
      ru: '6) Человек, когда от Создателя к созданию обращается любовью, – отпадает от своего истинного блаженства и впадает в истинное окаянство и бедность. И как тот, который, оставив царя своего, любовью и дружбой к самым подлым рабам его прилепляется и делает сам себя бесчестным и бедным, так грешник в бесчестие и окаянство себя предает, если, оставив Бога, к твари прилепляется. О таковом поется, или даже с сожалением и плачем говорится: «Человек, будучи в чести, не уразумел (сего), сравнялся с несмысленными скотами и уподобился им» ( Пс 48:13 ).'
      cn: 人，当他从创造主转而以爱转向被造物时，就偏离了自己真正的福祉，并陷入真正的悲惨与贫乏之中。这就像一个人，离开了他的君王，却以爱和友谊依附于他最卑贱的仆人，使自己蒙羞、贫乏；照样，罪人若离开了上帝，依附于受造物，就是将自己置于蒙羞和悲惨之中。关于这样的人，有诗歌吟唱，甚至带着遗憾和哭泣这样说：「人，当他身处尊荣中，却没有明白，竟与无知的牲畜同等，并与它们相似。」（诗篇 48:13）
  - type: paragraph
    text:
      ru: Ибо хотя и всякое создание «хорошо» , и «весьма хорошо» ( Быт 1:31 ), однако же всякая доброта созданий от Бога, как от источника, происходит, как и сами создания; и доброта, которая во всех созданиях есть, та несравненным, лучшим и превосходным образом в Создателе имеется; к тому же, все создания, как и сам человек, ничто пред Богом. От Бога как бытие, так и силу свою, и доброту свою, как тень от дерева, имеют, и до той поры пребывают и сохраняются, пока воля Божия хочет и всемогущая Его сила сохраняет их. Поэтому, когда человек от Бога к созданию обращается, – избирает вместо совершенного добра то, что по сути ничто, и так избирает вместо совершенного блаженства совершенное окаянство и злополучие свое, и сам себя бедным и окаянным делает.
      cn: 诚然，虽然一切受造物都是「好」以及「甚好」的（创世记 1:31），然而受造物的一切良善，正如受造物本身，皆从上帝，如同源泉般，而来；而存在于一切受造物之中的良善，则以无可比拟、更美且卓越的方式存在于造物主之内。再者，一切受造物，包括人自身在内，在上帝面前都算不得什么。它们从上帝那里，如同树木的影子般，获得其存有、能力与良善，并存留并蒙保守，直至上帝的旨意愿意且祂全能的力量保守着它们。因此，当人从上帝转向受造物之时，他所选择的，不是全然的良善，而是本质上虚无之物；如此，他所选择的，不是全然的福乐，而是全然的困苦与不幸，并使自己变得贫困而困苦。
  - type: paragraph
    text:
      ru: '7) Душа человеческая есть дух. Поэтому ничем иным, как только единым Богом удовольствоваться не может, будучи создана по образу Божию (Бог же есть Дух). От Бога произошла – Богом и довольствуется. Нет такой вещи, которой бы удовольствоваться могла, кроме Бога. Всякая вещь в своем месте упокоевается: тело на земле, как от земли взятое, воздух к воздуху идет, огонь в высоту стремится, птица на дереве, рыба в воде упокоение себе имеет; душа же, будучи духом (и образом Божиим), в своем первообразе – Боге.'
      cn: 7) 人的灵魂是灵。因此，除了独一的上帝，别无他物能使其满足，因其是照着上帝的形像被造的（上帝是灵）。它源于上帝，也唯以上帝为满足。除了上帝，没有任何事物能使其满足。万物各在其位安息：身体在地上，因其取自大地；空气归于空气；火焰向上腾升；飞鸟在树上，鱼儿在水中寻得安息；而灵魂，既是灵（也是上帝的形像），便在它的本源——上帝里。
  - type: paragraph
    text:
      ru: Солнце, луна, звезды и все небо хороши и прекрасны, но тело увеселяют. Земля со всеми плодами и украшением своим хороша, но тело довольствует. Вода хороша, но тело прохлаждает. Сладко пение птиц, но для тела сладко. Приятна музыка, но телу приятна. Пища и питье хорошо, но то и другое тело насыщает и прохлаждает. Так и о прочих созданиях разумей.
      cn: 太阳、月亮、星辰与整个天空都美好且华美，然而它们愉悦身体。大地，及其一切果实与妆饰，都美好，然而它使身体满足。水美好，然而它使身体清凉。鸟儿的歌唱甜美，然而对身体而言却是甜美。音乐悦耳，然而对身体而言却是悦耳。饮食美好，然而两者使身体饱足并清凉。你当如此省察其余的受造之物。
  - type: paragraph
    text:
      ru: 'Но души никакое создание удовольствовать, насытить, прохладить, утешить и возвеселить не может. Есть иной покой, которым упокоевается, есть пища, которой питается, есть питье, которым прохлаждается, есть свет, которым просвещается, есть красота, которой увеселяется, есть центр, к которому стремится и, достигнув того, ничего более не ищет. Бог и Божественная Его благодать – для души все: покой, пища, питье, свет, слава, честь, богатство, утешение, радость, веселье и все блаженство, которым тогда удовольствуется, когда отыщет Его. И чем более ныне ищет Его, тем более желает Его, и до тех пор будет желать и желаемого искать, пока лицом к лицу не увидит. И тогда чем более будет пить от сего живого и приснотекущего Источника, тем более будет жаждать Его, без болезни и сытости, через всю вечность. Ибо Бог чем более видится, тем более желается.'
      cn: 但没有任何受造物能使灵魂满足、饱足、舒畅、安慰并欢愉。有另一种安息，灵魂得以借此安息；有一种食物，灵魂得以借此饱饫；有一种饮品，灵魂得以借此舒畅；有一种光，灵魂得以借此蒙光照；有一种美，灵魂得以借此欢欣；有一个中心，灵魂为此而奔趋，并且，当灵魂抵达此中心后，便不再寻求其他。上帝和祂神圣的恩典对灵魂而言是一切：安息、食物、饮品、光、荣耀、尊荣、财富、安慰、喜乐、欢愉，以及一切的福乐，灵魂在寻得祂时，才能以此得到满足。并且，灵魂现今越是寻求祂，就越是渴望祂，并将持续渴望并寻求所渴望的，直到与祂面对面相见。届时，灵魂越是饮用这活泼涌流的源泉，就越是渴慕祂，没有痛苦和厌足，贯穿永恒。因为上帝越是被看见，就越令人渴望。
  - type: paragraph
    text:
      ru: 'Отсюда бывает, что души, духовно печальной, ничто не может утешить, кроме Бога и святого слова Его. А из того, что миром этим душа удовольствоваться не может, можно познать, что миролюбцы чем более здесь ищут сокровищ своих, тем более желают их и насытиться не могут. Сребролюбцу недостаточно никакого богатства: чем более собирает его, тем более желает. Желающие чести чем более возвышаются, тем выше подняться хотят, так что многие, не довольствуясь высоким царским титулом, богами себя повелевали называть, как читаем в историях о царях-язычниках. Любители роскоши и сластолюбцы сколько выдумывают прихотей к удовольствию своему, сколько брашен и напитков приятных и прочего, известно всякому, но удовольствовать себя и души своей не могут. Причина этому в том, что хотят душу свою удовольствовать тем, чем она не удовольствуется. Ибо дух есть бессмертный, и потому не тленным и смертным веществом, но живым и бессмертным Божеством удовольствуется.'
      cn: 因此，灵性上忧伤的灵魂，除了上帝和祂圣洁的话语之外，没有什么能安慰它。而从灵魂不能满足于这个世界来看，可以认识到，爱世俗者在此处越是寻求自己的财宝，就越是渴望这些财宝，永不能满足。爱财者对任何财富都不满足：他收集得越多，就越是渴望。追求尊荣者越是高升，就越是想攀得更高，以至于许多人，不满足于崇高的王室头衔，竟命令人称自己为神，正如我们在异教君王的史书中所读到的。喜爱奢华和耽于享乐者为了满足自己的享乐而发明了多少新奇之物，多少美味佳肴和甜美饮品等等，这众所周知，然而，他们却无法满足自己和自己的灵魂。其原因在于，他们想用灵魂所不能满足之物来满足自己的灵魂。因为灵魂是不朽的，因此，它不能被朽坏和属世之物所满足，而是被活生生和不朽的上帝所满足。
  - type: paragraph
    text:
      ru: 'Так бедный человек, потеряв живой воды Источник, Бога, копает мутные кладези в созданиях и от них ищет для своей души прохлаждения! Но копай, копай сколько хочешь, бедная душа, кладезей этих, жажды твоей от них не утолишь, еще и еще будешь жаждать. Знаешь ли где отыскать живую воду? Слушай, вот призывает к Себе живой Источник: «Кто жаждет, иди ко Мне и пей» ( Ин 7:37 ); и еще: «Кто будет пить воду, которую Ядам ему, тот не будет жаждать вовек; но вода, которую Я дам ему, сделается в нем источником воды, текущей в жизнь вечную» ( Ин 4:14 ). От этого Источника черпает душа и прохлаждается, напаивается и увеселяется, так что «не будет жаждать вовек» .'
      cn: 就这样，这可怜的人，失去了活水之源，即上帝，却在受造物中挖掘混浊的深井，并从中为自己的灵魂寻求清凉！然而，可怜的灵魂啊，你尽管去挖掘这些深井吧，爱挖多少就挖多少，你的干渴却无法从中得到满足，反而会更加干渴，渴上加渴。你可知何处寻得活水？听啊，活水源泉正在召唤着人们归向祂，说：「谁若渴了，可以到我这里来喝。」（约翰福音 7:37）；又说：「凡喝我所赐之水的人，必永远不渴；我所赐的水，要在他里面成为泉源，直涌到永生。」（约翰福音 4:14）。灵魂从这泉源汲取，便得以清凉、饱足并欢欣，以致「必永远不渴」。
  - type: paragraph
    text:
      ru: 8) Известно то, что мир ради человека сотворен, но все вещи в мире – как следы Божии, и свидетельствуют человеку о Боге; и как ручьи, ведут человека к живому и жизни Источнику, и показывают Его, и от Него черпать и прохлаждать души наши учат. Кто же захотел бы из ручьев пить, видя сам живой источник?
      cn: 8) 众所周知，世界是为了人而被创造的，但世界上万物都是上帝的踪迹，并且向人见证上帝；它们又如同溪流，引领人到活泼的生命之源那里，并且显明祂，又教导我们从祂那里汲取，并滋润我们的灵魂。那么，谁还会愿意从溪流中饮水，而亲眼看见活泼的源头呢？
  - type: paragraph
    text:
      ru: 'Хороши создания, и хороши весьма, но несравненно лучше Создатель, Который их хорошими сотворил. Создания благость и любовь Божию к нам показывают и учат нас Бога любить, хвалить и благодарить, как Создателя и Благодетеля своего. Не себя они убеждают любить, но как бы так нам говорят: мы к пользе вашей и употреблению сотворены Создателем, Того любите, Который нас ради вас сотворил, а не нас, которые вас любить не можем, и нас к пользе своей употребляя, благодарите Того, Который нас вам подал. Он любит вас и, ради любви Своей к вам, нас ради вас создал. Любите же Возлюбившего вас и Сотворившего нас для вас. Благодетеля должно любить, а не благодеяние, и Дающего, а не дарование. Благодеяние должно помнить и, помня, благодарить Благодетеля.'
      cn: 造物是美好的，而且是极其美好的，但那使它们美好的造物主却是无可比拟地更好。造物向我们显明上帝的良善与祂对我们的爱，并教导我们爱、赞美、感谢上帝，如同爱、赞美、感谢我们的造物主与施恩者。它们并非说服我们去爱它们自己，倒像是这样对我们说：我们是造物主为你们的益处和使用而造的，你们当爱那为你们的缘故而造了我们的祂，而非爱我们——我们无法爱你们；当你们使用我们以获益时，当感谢那将我们赐予你们的祂。祂爱你们，并且因着祂对你们的爱，为你们的缘故而创造了我们。所以，当爱那爱你们的、并为你们造了我们的祂。当爱施恩者，而非其恩惠；当爱赐予者，而非其赐予。恩惠当被铭记，并当因铭记而感谢施恩者。
  - type: paragraph
    text:
      ru: '9) Человек, как выше сказано, рождается не ради мира сего, но ради перехода на тот век, и потому в мире этом – странник и путник. Поэтому все в мире этом употреблять должен по необходимости, а не для похоти, должен нужду и требование плоти исполнять, а не похоти угождать. Потому и написано: «Попечения о плоти не превращайте в похоти» ( Рим 13:14 ).'
      cn: 9) 人，如上所述，生于此世并非为此世，乃为迁入彼世，故此生之中，为客旅与路人。因此，世上一切，当按所需使用，而非为纵欲；当满足肉身之必需与要求，而非纵情私欲。故经上记着说：「对肉身之思虑不可转变为情欲。」(罗马书 13:14)。
  - type: paragraph
    text:
      ru: Пищи, одеяния, покоя или дома довольно для него, как странника и путника, а когда стремится обогатиться, почитаться, прославляться, веселиться, и наслаждаться в мире этом, – это похоти, а не нужды дело. Странствующий к отечеству и дому своему ничего в мире не любит, как выше сказано, кроме Бога, Создателя и Благодетеля своего, и ради Бога подобного себе человека, и всегда к небесному отечеству, для которого создан и позван, ум и сердце свое возводит, как путник к цели своей. Так, «где сокровище» его, «там будет и сердце» его ( Мф 6:21 ). Когда в этой мысли всегда находиться будет, непременно не пожелает ничего в мире этом, кроме Бога и вечной жизни, которая во Христе сокровенна и в Слове Божием обещана.
      cn: 食物、衣裳、安息或居所，对他而言，作为客旅和过路人，已足矣。但当他渴望在此世发财、受人尊敬、得享荣耀、寻欢作乐、享乐时，——这便是私欲，而非所需之事。那前往自己家乡和家园的客旅，如上所述，在此世不爱任何事物，唯爱上帝，祂是他的创造者和施恩者，并为着上帝的缘故爱与自己相似的人，他总是将自己的心智与心灵提升到那天上的家乡，因为他为此而被造和蒙召，如同过路人走向他的目标一样。所以，「你的财宝在哪里，你的心也在那里」（马太福音 6:21）。当他常存此念时，就必然不会在此世渴望任何事物，唯有上帝和永生，这永生是在基督里隐藏的，并在上帝的圣言中被应许。
  - type: paragraph
    text:
      ru: 10) Надобно душе, как произошла от Бога, так и возвратиться к Богу без любви мира сего. Примечай это, берегись мира и изыди от него, как Лот из Содома.
      cn: 10) 灵魂既然源于上帝，就当不带对这世俗的爱，回归上帝。当留心此点，警惕世俗，并从中出来，如同罗得离开所多玛一般。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Дивишься ты тому, что я в конце написал «изыди от мира». Это не просто надобно разуметь, но в том смысле, в каком и вышеупомянутое письмо написано. Истинные христиане непременно от мира изыдут, не ногами, но сердцами и помышлениями.
      cn: 你对我最后写下「出离世界」感到惊讶。这不单单需要理解，更是要按着上文所提及的书信所写的那种意义去领会。真正的基督徒必然会出离世界，并非身体上的，而是心灵和意念上的。
  - type: paragraph
    text:
      ru: 'Сам ты знаешь, что человек, удалившийся от отечества и дома своего, делает: на чужой стороне обращается, но сердцем и мыслями своими непрестанно в отечестве и доме своем пребывает, всегда думает, как бы в дом здоровым возвратиться. Телом и ногами ходит на чужой стороне, но сердцем и душой в доме своем, и ничего там недвижимого не заводит: ни строений богатых, ни садов, и прочего, чего с собой в отечество взять невозможно.'
      cn: 你自己知道，一个人，远离自己的故土和家园，他会怎么做：他身在异乡漂泊，但他的心和思念却不住地停留在自己的故土和家园，总是想着如何能安康地回家。他身体和双脚在异乡行走，但他的心和灵魂却在他的家中，他不在那里置办任何不动产：无论是富丽的建筑，还是花园，以及其他那些他无法带回故土的东西。
  - type: paragraph
    text:
      ru: Мы странники и пришельцы на земле, как и отцы наши. Отечество наше – небо, для которого мы созданы, и святым Крещением обновлены, и Словом Божиим позваны. Что же нам, странникам и пришельцам, остается делать, как здесь в мире этом телом жить и ногами ходить, пока Бог не позовет нас отсюда, но сердцами и помышлениями в отечестве своем пребывать; и ни о чем, кроме нужного, для жизни этой не заботиться, и не собирать сокровищ себе на чужой земле, «где моль и ржа истребляют и где воры подкапывают и крадут, но» собирать «себе сокровища на небе, где ни моль, ни ржа не истребляют и где воры не подкапывают и не крадут, ибо где сокровище» наше, «там будет и сердце» наше ( Мф 6:19–21 ). Там наше отечество, там дом, там Отец наш, там братия наша, там покой наш, там слава, там радость, там ликование, вечеря великая, и все блаженство наше там. Туда сердце наше и помышления наши и желания наши возводить должно.
      cn: 我们在地上是异乡客和寄居者，如同我们的祖先一样。我们的家乡是天国，我们为此而被创造，并借由圣洗而得以更新，又借由上帝的圣言蒙召。那么，我们这些异乡客和寄居者，还能做什么呢？不过是在这世上，以身体活着，用双脚行走，直到上帝将我们从这里召回；然而我们的心和思想，却要常留在我们的家乡。并且除了此生所必需的，不必忧虑任何事，也不要在异乡的土地上为自己积攒财宝，「那里有虫子咬，有锈蚀坏，也有盗贼挖洞偷窃，但要在天上为自己积攒财宝，那里没有虫子咬，没有锈蚀坏，也没有盗贼挖洞偷窃；因为我们的财宝在哪里，我们的心也在哪里。」(马太福音 6:19-21) 那里是我们的家乡，是我们的家，是我们的天父，是我们的弟兄，是我们的安息，是我们的荣耀，是我们的喜乐，是我们的欢庆，是盛大的晚宴，我们一切的福乐都在那里。我们的心、我们的思想和我们的愿望，都应当转向那里。
  - type: paragraph
    text:
      ru: Если об этом помышлять будем всегда, то ничего в мире этом не будем желать и искать, что люди имеют и почитают за богатство, за дорогое, красивое, приятное и веселое, но золото и серебро, как из земли добытое, ни во что будем ставить, как пыль земную; дорогие камни – бисер, алмазы, яхонты и прочие, по мнению мира сего дорогие, будем считать такими же камнями, как и те, что по дорогам валяются и попираются; честь, слава, титулы, почитание для нас будут как дым, украшение платья, домов, карет, коней, и прочее – как ничто, или как мертвечина. Словом, все, что любят и почитают сыновья века сего, нам будет ненавистно (или чуждо). За обиды и бесчестия не будем мстить, простим всякому, дабы и нас простил Господь. Всякую противность, наносимую нам, удобно и великодушно претерпим, ведая, что таков есть путь к горнему отечеству. От всякого греха, как от смертоносного яда, уклонимся. Всякую добродетель, и малейшую, более всякого сокровища мира этого почтим. Богу, а не людям, угождать во всем будем. Так изыдем от мира, хотя и будем в мире, пока не отойдем от мира.
      cn: 如果我们常常默想此事，那么我们就不会渴望和寻求这世上任何东西，那些被人们视为财富、珍贵、美丽、愉悦和欢乐的东西。反之，金银，如同从地里挖出来的，我们将视若无物，如同地上的尘土；宝石——珍珠、钻石、红蓝宝石以及其他在此世看来珍贵的，我们将它们视作与那些在路边随意散落、被人践踏的石头无异；尊荣、荣耀、头衔、敬意对我们而言将如同烟雾；衣裳、房屋、马车、骏马的装饰，以及其他诸如此类的，将如同虚无，或如同腐尸。简言之，这世上的子民所喜爱和尊崇的一切，对我们而言将是可憎的（或陌生的）。对于凌辱和羞辱，我们不会报复，我们将饶恕每一个人，好叫上主也饶恕我们。任何加诸于我们的逆境，我们都将乐意且慷慨地忍受，因深知此乃通往天上家园之路。任何罪恶，如同致命的毒药，我们都将躲避。任何美德，哪怕是最微小的，我们都将比这世上一切财宝更加尊崇。我们将凡事取悦上帝，而非取悦世人。如此我们便超脱于世，即使我们仍身处尘世，直到我们离开这世界。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Видно, что ты еще сомневаешься в том, что мир удобно презрим, когда будем твердо веровать и всегда помышлять о будущей жизни и славе и царствии вечном.
      cn: 显然，你仍然怀疑这世界是容易被轻蔑的，当我们坚定地信仰并常常默想那未来的生命、荣耀和永恒的国度时。
  - type: paragraph
    text:
      ru: 'Я тебе примером это поясняю. Если бы тебе обещана была часть земного царства и ты бы уверен был в том, хотел ли бы ты искать какой-нибудь низкой должности? Конечно, нет. Если бы кто сказал тебе, что в таком-то месте превеликое и неоцененное сокровище сокровенно лежит и ты бы точно ему поверил, не все ли бы свое имение продал, чтобы это место и землю купить и так с землей и сокровищем тем владеть? Воистину с радостью все имение бы свое отдал, чтобы только то сокровенное сокровище достать. Или если сказано было бы тебе с небес: одну неделю претерпи всякое бедствие, злоключение и злострадание, а потом семьдесят лет будешь жить во всяком благополучии, утешении, обилии и веселье, какого желает душа твоя, не с радостью ли избрал бы это? Воистину бы все претерпел за такое короткое время, чтобы потом на долгое время в великом быть утешении. Как в этом, так и в вышеописанном бесспорная истина.'
      cn: 我用一个例子向你解释这个。倘若你被应许了属世国度的一部分，并且你对此深信不疑，你还会去寻求任何低微的职位吗？当然不会。倘若有人告诉你，在某处隐藏着一份极其巨大且无价的宝藏，并且你确切地相信了他，你难道不会卖掉你所有的财产，为了买下那地方和土地，从而同时拥有那片土地和宝藏吗？诚然，你会乐意地舍弃自己所有的财产，仅仅为了得到那份隐藏的宝藏。又或者，倘若有话语自天上对你说：忍受一周的各种灾祸、不幸和苦难，之后七十年你将生活在你的灵魂所渴望的各种福乐、慰藉、丰盛和喜悦之中，你难道不会乐意选择这个吗？诚然，你会为了如此短暂的时间忍受一切，以便之后在漫长的时间里享受极大的慰藉。无论是在这个例子中，还是在上面所描述的例子中，都存在着无可争议的真理。
  - type: paragraph
    text:
      ru: Теперь рассуждай о мире и вечной жизни и сокровище ее. Бог обещал нам вечное царствие, вечные блага и сокровища, вечное утешение и веселье. Неужели всякую временную честь, всякое временное богатство не презрим, если Слову Божию поверим и им обещанное надеемся получить? Неужели все, но временно терпеть не будем, если в вечном надеемся быть прохлаждении, утешении, радости и веселье? Никак того быть не может. Ибо что все временное и земное против вечного и небесного? Как ничто. Царская честь и слава земная против вечной, как тьма против света. Богатство земное против небесного, как ничто. Утешение нынешнее против вечного блаженства, как смрадная и нечистая вода против чистой и живой воды, или, лучше сказать, ничто.
      cn: 现在，思考平安、永生及其宝藏。上帝应许我们永恒的国度，永恒的福益和宝藏，永恒的慰藉和喜乐。如果我们相信上帝的圣言，并盼望得着祂所应许的，难道我们还不轻看一切暂时的尊荣、一切暂时的财富吗？如果我们盼望在永恒中得享安息、慰藉、欢愉和喜乐，难道我们连一切（哪怕是暂时的）苦楚都不愿忍受吗？绝无可能。因为一切暂时的和属世的，与永恒的和属天的相比，算什么呢？如同虚无。属世的王室尊荣和荣耀与永恒的相比，如同黑暗相比光明。属世的财富与属天的相比，如同虚无。今世的慰藉与永恒的真福相比，如同污秽不洁之水相比清洁的活水；或者，更确切地说，是虚无。
  - type: paragraph
    text:
      ru: Ибо временное и мирское блаженство – как тень против истины. Что такое тень? Ничто, только намек на истинную вещь. Вечная жизнь со всем своим блаженством – это истина, а временная жизнь со всеми благами мира сего – это тень. Тень видна, пока дерево стоит и солнце сияет; падает древо, – падает и тень, или скрывается солнце – исчезает и тень. Так и жизнь эта. Умирает человек, отходит от него жизнь земная, а с нею и все ее блаженство, как тень, исчезает, и бывает так, как будто и человека и блаженства его не было. Рассуди сам, где ныне цари, князья, вельможи, богатые, сильные, мудрые? Где слава и блаженство их? Пали они, исчезла слава и блаженство их, как исчезает тень при падении дерева или когда спрячется солнце. Таково и все мира сего блаженство!
      cn: 因为暂时的和世俗的福乐，在真理面前，犹如影子。影子是什么？是虚无，仅仅是真实事物的一个暗示。永恒的生命及其所有的福乐，是真理；而暂时的生命及其世上一切的福乐，则是影子。影子可见，只要树木站立，太阳照耀；树木倒下，影子也随之不见；或太阳隐藏，影子也随之消失。这生命亦然。人死了，地上的生命便离开他，连同其所有的福乐，犹如影子般消失，结果便如此，仿佛那人和他的福乐都不曾存在过。你自行思量，如今君王、公侯、显贵、富翁、权势者、智者，都在哪里呢？他们的荣耀和福乐又在哪里呢？他们都已倾覆，他们的荣耀和福乐都已消失，犹如当树木倒下或当太阳隐藏时，影子便消失一般。这世上所有的福乐，亦是如此！
  - type: paragraph
    text:
      ru: Истина – это вечная жизнь, которая, однажды найденная, никогда не отходит. «Подобно царство небесное сокровищу, скрытому на поле, которое, найдя, человек утаил, и от радости о нем идет и продает все, что имеет, и покупает поле то» ( Мф 13:44 ). Поле означает здесь век будущий, в котором сокровенное царствие небесное со своим сокровищем. Там оно сокровенно, но в Святом Писании нам открыто и здесь обретается. Кто его обретает? Тот, кто истинно и живо верит Божию Слову и обещанию, и на него верою взирает, и надеждой стремится к тому. Таковой, будучи объят одним желанием обрести сие неоцененное сокровище, с радостью от всего в мире сем отрекается и все дорогое для мира за ничто имеет. Ибо небесное сокровище подобно прекрасному и бесценному жемчугу, против которого все богатство мира сего – как ничто.
      cn: 真理是永生，一旦寻得，永不离去。「天国好像宝贝藏在地里。人找到了，就把它掩藏起来，欢欢喜喜地去变卖他一切所有的，买下那块地。」（马太福音 13:44）地在此意指来世，其中隐藏着天国及其宝藏。它隐匿于彼，但在圣经中向我们显明，并在此处被寻得。谁寻得它呢？那真实而活泼地相信上帝的圣言与应许，以信心仰望它，并以盼望向其奔赴的人。这样的人，被寻得这无价宝藏的唯一愿望所占据，便欢欣地舍弃世间一切，并将世人所珍视的一切视若无物。因为天国的宝藏好像一颗美丽而无价的珍珠，对比之下，今世的一切财富均不足道。
  - type: paragraph
    text:
      ru: Отвратим же сердце наше от мира сего и поищем тот многоценный жемчуг, да с прилежанием поищем, не ленясь, ибо насколько сокровище сие дорого, настолько важно и насущно дня нас – «едино есть на потребу» ( Лк 10:42 ).
      cn: 愿我们把我们的心从这世界转离，去寻求那极其宝贵的珍珠，要殷勤地寻求，不可懈怠，因为这宝藏越是珍贵，对我们而言就越是重要和必需——『唯有一件是必要的』（路加福音 10:42）。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Спрашиваешь ты, что значит: «едино есть на потребу» . Можешь ты сам рассудить, что это говорится о вечной жизни. Говорится, что она одна только нам нужна (без чего-либо другого можем обойтись, но она одна только единственно необходима). Ради нее в мир этот рождаемся, крестимся и обновляемся, чтобы ее получить. Ради нее Слово Божие нам объявлено, чтобы из него познали Бога и Сына Божия Иисуса Христа, и познав, навечно спаслись. Ради того Христос Господь наш в мир пришел, пожил, трудился, страдал и умер, и тем отворил нам дверь к вечной жизни, которую мы заключили нашими грехами, и показал путь и способ к получению ее.'
      cn: 你问：「仅有一件是不可少的」是什么意思。你自己可以推断，这是指永生而言。经上说，唯有它才是我们所需的（没有其他任何东西我们都可以生活，但唯有它才是唯一必需的）。为了它，我们生于世上，受洗并被更新，为要获得它。为此，上帝的圣言向我们宣告，好使我们借此认识上帝和上帝之子耶稣基督，并借着认识祂，得以永远得救。为此，我们的主基督降世，生活、劳作、受苦、并受死，并借此为我们开启了通往永生之门，这门原已被我们的罪所关闭，并向我们指明了获得永生的道路和方法。
  - type: paragraph
    text:
      ru: 'Видишь, что для нас вечная жизнь совершенно необходима, как насущная потребность, без которой никак нельзя обойтись. Пока в мире этом живем, многие потребности имеем: необходим нам хлеб, пища, одеяние, дом, покой и все прочее нужное для жизни сей, но вечная жизнь есть такая потребность для человека, что без нее все другое – ничто и весь мир, если бы его можно было приобрести, ничто. «Какая польза человеку, если он приобретет весь мир, а душе своей повредит ? или какой выкуп даст человек за душу свою» ( Мф 16:26 )?'
      cn: 可知，永生对我们而言是绝对必要的，如同不可或缺的必需品，没有它便无法生存。当我们活在这世上时，有许多需求：我们需要面包、食物、衣裳、房屋、安息，以及此生一切所需。然而，永生却是人如此重要的需求，以至于没有它，其他一切都算不得什么；即使能获得整个世界，也一无是处。『人若赚得全世界，却丧失了自己的灵魂，有什么益处呢？人还能拿什么换取自己的灵魂呢？』（马太福音 16:26）
  - type: paragraph
    text:
      ru: 'Видишь, что спасение души, которое состоит в вечной жизни, дороже всего мира и потому «едино есть на потребу» . Поэтому одного только вечного спасения, «единого на потребу» , и должно искать неусыпно, а чтобы его искать и отыскать, не должно к плотоугодию и суете мира сего прилепляться. Сердце, наполненное суетой, или забудет о «едином на потребу» , или, хотя и будет его искать, но нерадиво и как бы нехотя, поэтому честь, славу, богатство и прочее мира сего сокровище должно презреть и сердцем от всего подобного отвращаться. Ибо сердце у человека одно: когда временного ищет, тогда о вечном забывает; когда же к вечности обращается и углубляется помышлениями в ней, тогда о времени забывает; и когда печется о вечной жизни, тогда не печется и не заботится о суетных мира сего вещах, – одно только из этих двух сердцем человеческим обладает. Когда в сердце входит попечение о вечной жизни, тогда попечение о суетном стяжании исходит, и когда суета входит в сердце, тогда вечность отходит.'
      cn: 你看，灵魂的救赎——即那由永生所构成者——贵于整个世界，因此「唯有一事是不可少的」。所以就当不懈怠地寻求这唯独的、不可少的永恒救赎，而为了寻求并寻得它，就不可依附于肉体的享乐和今世的虚荣。一颗充满虚荣的心，要么会忘记「唯有一事是不可少的」，要么即便寻求它，也会敷衍了事，心不甘情不愿。因此，今世的尊荣、荣耀、财富以及其他一切宝藏，都当轻蔑，并以心弃绝一切类似之物。因为人心只有一个：当它寻求短暂之物时，就会忘记永恒；而当它转向永恒，并沉浸在对永恒的思虑中时，就会忘记时间；当它挂虑永生时，就不会挂虑和担忧今世的虚妄之事——这二者之中，唯有一者能占据人心。当永生的挂虑进入心中，那么对虚妄财物的挂虑就会离去；而当虚荣进入心中，永恒就会离去。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Пишешь ты, что люди снова за свои дела принялись после того, как самозванец был пойман и страх от него исчез. Из этого примечай, что страх и бесстрашие делает. Когда этот злодей шел, и пленял, и губил людей, и приближался к нашей стороне, тогда господа – и прочие многие люди – дома, крестьян и имения свои оставляли, и хотели удалиться, а иные и удалились.
      cn: 你写道，人们又重新忙起自己的事务来，在那个冒名顶替者被捕之后，以及由他而来的恐惧消失之后。由此可留意，恐惧与无畏所能成就的。当这个恶徒来犯时，俘虏并残害人民，并逼近我方时，那时，诸位老爷——以及其他许多人——抛弃了自己的房屋、农户和财产，想要撤离，而另一些人则已经撤离了。
  - type: paragraph
    text:
      ru: Видишь, что страх человеческий делает в людях. Ради чего они оставляли все и хотели бежать, или бежали некоторые? Чтобы жизнь свою спасти. Какую жизнь? Временную. Так временную жизнь почитаем, что все оставляем ради нее, хотя и следует непременно оставить ее и храмине этой разрушиться. Страх временной и неизбежной смерти так колеблет сердца наши, как же сильно поколеблет страх вечной смерти, когда в сердце вселится? Временное и краткое мучение так смущает человека, как же смутит вечное и конца не имеющее?
      cn: 你看，人的恐惧在人们心里做着什么？他们为了什么舍弃一切想要逃跑，抑或有些人已经逃跑了呢？为了保全自己的生命。怎样的生命？暂时的生命。我们如此看重这暂时的生命，以至于为了它舍弃一切，尽管我们必将弃绝它，并且这殿宇也必朽坏。对短暂而无可避免之死亡的恐惧如此动摇我们的心，当永恒之死亡的恐惧一旦入住心中，又将如何强烈地动摇它呢？短暂而须臾的折磨尚且如此困扰人，那永恒而无止境的又将如何困扰呢？
  - type: paragraph
    text:
      ru: Ради страха временного мучения и смерти все оставляет человек, чтобы от того спастись, – чего не оставит, когда страх вечной смерти и геенны ударит душу? Непременно страх сей и печаль о спасении души убедит оставить все житейское, о чем сыны века сего пекутся; изгонит из сердца мирскую печаль – желание богатства, чести, славы и сладострастия и, как вихрь пыль, всю эту суету развеет. Не отречется таковой бесчестие, поругание, биение, темницу, ссылку и саму смерть с радостью претерпеть, только бы от вечной той беды избавиться. Истина эта явна и верна для того, кто страх вечной смерти чувствует.
      cn: 人为了惧怕暂时的苦楚与死亡，会舍弃一切，以求从中得救——那么当永恒的死亡与革赫纳的恐惧叩击灵魂时，他又有什么不会舍弃呢？这份恐惧和为灵魂得救而生的忧伤，必然会使人确信并舍弃今世之子所挂虑的一切世俗之事；它会将世俗的忧伤——对财富、尊荣、声望和情欲的渴望——逐出心房，并如同旋风吹散尘埃般，将这一切虚浮驱散。这样的人不会拒绝带着喜乐去承受耻辱、凌辱、鞭打、监禁、流放乃至死亡，只为能摆脱那永恒的灾祸。这真理是显而易见的，也是确凿无疑的，对那些感受到永恒死亡之恐惧的人而言。
  - type: paragraph
    text:
      ru: Ибо большим страхом уничтожается малый страх, и от большей печали малая печаль исчезает, и большая болезнь малую нечувствительной делает, подобно тому, как из-за великого шума слабый голос не чувствуется. Так печаль века сего и страх временной беды печалью о спасении души и страхом вечной пагубы потребляется и угашается, как свет от свечи светом солнечным. Сей страх пустыни и вертепы нестрашными сотворил в благочестивой древности, увещал жить со зверями, нежели с беззаконными людьми, травой и кореньями питаться, нежели сладкими яствами, в лесах скитаться, нежели между соблазнами обращаться, и прочее. Сей страх и самых демонов, бесплотных духов, колеблет. Ибо и демоны боятся геенны, на которую осуждены, и стараются ее участниками сделать сынов человеческих, чтобы не одним в ней мучиться. Дивно, что люди плотские от того не трепещут, от чего демоны-духи трепещут!
      cn: '因为巨大的恐惧能消除微小的恐惧，巨大的忧愁能使微小的忧愁消散，剧烈的病痛能使轻微的病痛变得不为人所觉，犹如巨大的喧嚣使微弱的声音不被察觉。同样，今世的忧愁和对短暂灾祸的恐惧，也会被那为灵魂得救而生的忧愁和对永恒沉沦的恐惧所吞噬并熄灭，如同烛光被日光所湮没。这种恐惧，在虔敬的古时，曾使旷野和洞穴变得不可怕；它劝勉人宁愿与野兽为伍，也不愿与不法之人同住；宁愿以草根为食，也不愿享用甘甜的食物；宁愿在森林中漂泊，也不愿周旋于诱惑之间，等等。


        这种恐惧甚至能使鬼魔，这些无形的灵体，也为之颤抖。因为鬼魔也惧怕地狱，他们已被判入其中，并竭力使人类的儿女成为地狱的同伴，以免独自在地狱中受苦。奇哉！属肉体的人竟不为那使鬼魔——这些灵体——战栗的事物而战栗！'
  - type: paragraph
    text:
      ru: Когда сей страх и печаль из сердца выйдет, тогда печаль века сего вселяется, и, как разбойник дом и город, так она дом душевный опустошает. Тогда люди, забыв о вечной смерти и не заботясь о спасении души, заботятся только о временном. Отсюда происходит то, что люди в мире этом стараются добиться почетной должности, сыскать себе славу, собрать богатство, угождать плоти своей и уже не думают, как угодить Богу и спастись, но как бы понравиться людям и у них быть в почтении и похвале. Отсюда произошло строение и украшение богатых домов, цветное и богатое одеяние, украшение карет и коней, нарядность и жеманство слуг, приготовление трапез, банкетов, пиршеств, угощений и взаимное угощение, и прочее, – словом, плотское, безоглядное и, по правде говоря, скотское житие.
      cn: 当这种恐惧和忧伤从心中离去时，那时，此世的忧伤便会盘踞而入，它如同强盗洗劫房屋和城市一般，如此荒芜了灵魂的居所。那时，人们忘记了永死，也不顾念灵魂的救赎，只顾念暂时的事物。因此，世上之人力求获得尊荣的职位，为自己博取名声，积聚财富，取悦自己的肉体，不再思想如何取悦上帝并得救，却只想如何取悦于人，并获得他们的尊敬与赞扬。由此而生富丽堂皇之房屋的建造与装饰，色彩斑斓且华贵的衣着，马车和骏马的装饰，仆役华丽的装束和矫揉造作，筵席、宴会、盛宴、款待以及相互款待等等的预备——总而言之，这是一种属肉体的、肆无忌惮的，坦白说，是如同禽兽般的生活。
  - type: paragraph
    text:
      ru: Когда упомянутый злодей, о котором писал ты, был пойман и отвезен в свое место, и страх из-за него от людей отошел, тогда все за прежние дела взялись и начали то ездить в гости, то принимать гостей. Вот что бесстрашие и беспечность делает!
      cn: 当那个你所提及的恶人被捕获，并被押往他的去处，人们因他而起的恐惧也随之消散时，众人便又重拾旧日事务，或往来作客，或设宴待客。看啊，这就是无所畏惧与漫不经心所造成的结果！
  - type: paragraph
    text:
      ru: 'Так, когда страх смерти и муки вечной отойдет от человека, тогда суета и любовь к миру место в сердце его имеет, как выше сказано. Тогда такие люди подобно детям малым поступают. Дети карнавальных масок и нарисованных страшилищ, самих по себе не страшных, боятся, но не боятся огня и прочего, от чего вред и пагуба бывает, смеются, когда разбойники в дом входят, и небрегут, когда дом расхищают, хотя и самим им от злодеев следует беда, плачут, когда те злодеи детские их игрушки похищают. Так поступают люди, не имеющие страха и печали о вечности. Боятся временного лишиться благополучия, но не боятся лишиться вечного. Сатана, как разбойник, дом душевный расхищает, все отнимает: блаженство и жизнь вечную, Кровью Христовой искупленную, – и не заботятся о том, не примечая, что им оттуда следует погибель. А когда отнимается у них временное что-либо, то есть честь, или богатство, или иное, что все необходимо следует при смерти оставить, – плачут неутешно, и рыдают, и печалятся о том, о чем не должно печалиться, – и не печалятся, о чем печалиться должно. Там «боятся страха, где нет страха» ( Пс 52:6 ), и там не страшатся страха, где истинный есть страх. Нарисованного огня боятся, но не боятся Самою «огня поядающего» ( Пс 52:6 ), от которого и бесы трепещут.'
      cn: 因此，当对死亡和永恒痛苦的恐惧从人心中离去时，虚妄和对世界的爱就会占据他的心，如上文所言。那时，这样的人行事如同孩童。孩子们惧怕狂欢节面具和画出来的怪物，这些东西本身并不可怕，却不惧怕火及其他会带来伤害和毁灭的事物；当强盗进入家中时，他们嘻笑玩耍，当家园被劫掠时，他们毫不在意，尽管他们自己也会因此遭受恶徒的祸害；但当那些恶徒抢走他们的玩具时，他们却放声大哭。那些对永恒没有恐惧和忧伤的人，正是如此行事。他们惧怕失去暂时的幸福，却不惧怕失去永恒的福分。撒旦如同强盗，劫掠人灵性的家宅，夺走一切：由基督宝血所赎回的福乐与永生，而人们却对此毫不关心，不曾留意由此将带来的毁灭。然而，当他们失去任何暂时的东西时，即荣誉、财富或其他所有在死亡时都必须舍弃之物时，他们便无法安慰地哭泣、哀号，并为此忧伤，而这些本是不当忧伤之事；对于那些理应忧伤之事，他们却不忧伤。他们在「没有恐惧之处，却惧怕战兢」（诗篇 52:6），而在真正恐惧之处，却不惧怕战兢。他们惧怕画出的火，却不惧怕那「吞噬之火」（诗篇 52:6），连魔鬼也为此战栗。
  - type: paragraph
    text:
      ru: Все это не от чего иного происходит, как от забвения вечности. Это забвение делает сатана, он помрачает ум человеческий и отнимает память, чтобы человек не помнил о вечности и принадлежностях ее. Ибо ведает он, что человек, когда будет помнить и рассуждать о вечности, легко мира этого суету презрит, и к одним только вечным благам будет стремиться, и так удобно может спастись. Поэтому полагает все старание, чтобы человека отвратить от вечности и запутать в попечении о временных вещах, как рыбу в сети. Берегись же этой дьявольской козни, будь в мире этом, как путник на пути. Помни, что все, что ни соберешь, здесь оставишь, и, все позади оставив, стремись к отечеству своему, «держись вечной жизни, к которой ты и призван» ( 1Тим 6:12 ). Довольствуйся тем, что Бог тебе по милости Своей подал. Пищу, и одеяние, и дом имеешь, – чего еще более хочешь, путник, странник и пришелец на земле? Наследие христианам не здесь, но на небе уготовано. Честь, слава и все блаженство там для них сокровенно. Перестань искать то, что, если и отыщешь, то вскоре оставишь, и прилежно ищи то, что, когда обретешь, не потеряется никогда, то есть вечную жизнь.
      cn: 这一切的发生，无非是由于对永恒的遗忘。这遗忘是撒旦所为，它蒙蔽人的心智，夺走人的记忆，使人不再记念永恒及其所有。因为它知道，当人记念并思量永恒时，便会轻易轻视这世间的虚妄，并只追求永恒的福祉，如此便能方便地得救。因此，它竭尽全力，为要使人偏离永恒，并像网中的鱼一样，纠缠于对暂时事物的挂虑之中。所以，要谨防这魔鬼的诡计，在这世间作路上的旅客。记住，无论你积攒什么，都会留在这里；抛下一切，努力奔向你的故乡，「持定永生，你为此蒙召」（1提摩太福音 6:12）。满足于上帝按祂的慈悲所赐予你的一切。你有食物，有衣裳，有住处——你这世上的旅客、寄居者和陌生人，还奢求什么呢？基督徒的产业并非在此，乃是在天上为他们预备。尊荣、荣耀和一切的福乐，都在那里为他们隐藏。不要再寻求那即使寻得，也很快会舍弃之物；却要殷勤寻求那一旦获得，就永不失落之物，亦即永生。
  - type: paragraph
    text:
      ru: Сам рассуди, не смеха ли достойны поступки людей, которые кошель, для денег предназначенный, хватают, и хранят, и радуются о том, а золотом и серебром пренебрегают? Или тех, которые за тени фруктов, на дереве висящих, хватаются, и теми хотят услаждаться, а о самих плодах небрегут? Так поступают те бедные христиане, которые за временным благополучием, как за пустым кошельком, или как за тенью, гоняются (ибо все временное, как пустой мешок, кажется что-то в себе имеющим, но само по себе ничто, или как тень, которая исчезает), а о вечной жизни и сокровище ее, не золотом и серебром, но бесценной Кровью Христовой искупленной, или мало, или совсем не заботятся.
      cn: '你自己思量一下，那些人的行径岂不可笑吗？他们抓住一个本是用来装钱的钱袋，紧紧守着，并为此欢喜，却轻视金子和银子？抑或那些人呢？他们抓住树上挂着的水果的影子，并想以此为乐，却对真正的果实毫不在意？


        那些可怜的基督徒就是如此行事，他们追逐着暂时的福祉，如同追逐一个空钱袋，又或是一个影子（因为一切暂时的事物，如同空麻袋，看似里面有些什么，但其本身却一无所有；又或如同那消逝的影子），而对于永恒的生命及其宝藏——这宝藏并非用金银赎回，而是用基督的无价宝血赎回的——他们却或少有留意，或全然不顾。'
  - type: paragraph
    text:
      ru: О, вечная жизнь! Как ты дорога и сладка, но мало кто любит тебя! О, мир, мир! Юдоль плачевная – мир, печали, воздыхания, трудов и бед исполненный мир! Как ты горек, и почти все любят тебя! Что бы было, если бы ты сладок был? Горек мир, но так любится! А как бы любим был, когда бы сладок был? Непременно бы все его за отечество и второй рай почитали.
      cn: 哦，永生！你何其珍贵，何其甘甜，然而却鲜有人爱慕你！哦，世界，世界！哀哭之谷——这世界，一个充满忧愁、叹息、劳苦和患难的世界！你何其苦涩，然而几乎所有人都爱慕你！倘若你曾是甘甜的，那又会是怎样呢？世界是苦涩的，却如此被人爱慕！倘若你曾是甘甜的，又将如何被人爱慕呢？所有人定会把你当作故土和第二个乐园。
  - type: paragraph
    text:
      ru: Что в мире, кроме беды, напастей, трудов, печали, скорби и воздыхания, как на море, что кроме ветров, бури и волнения? Что и сладким кажется, то с горестью смешано, и что приятным кажется – внутри гнило и смрадно.
      cn: 世间除了祸患、患难、劳苦、忧愁、悲痛和叹息，还能有什么呢？就像海面除了风、风暴和波涛，还能有什么呢？那些看似甜美的，都与苦涩混杂；那些看似宜人的，其内却腐烂发臭。
  - type: paragraph
    text:
      ru: О, беда наша! О, слепота ума! Где наш ум, где наша вера, христиане? Где Слово Божие, которое обещает нам великое и дивное, страшное и ужасное, бесчисленные блага, которых «не видел глаз, не слышало ухо, и не приходило то на сердце человеку» ( 1Кор 2:9 )? Но, все то оставив, гоняемся за тенью.
      cn: 哦，我们的祸患啊！哦，心智的盲目啊！我们的心智何在？我们的信仰何在？基督徒啊？上帝的圣言何在？它应许我们伟大而奇妙之事，可畏而可怖之事，无数的福益，是「眼睛未曾看见，耳朵未曾听见，人心也未曾想到的」（哥林多前书 2:9）？然而，我们却弃绝这一切，追逐虚影。
  - type: paragraph
    text:
      ru: 'Истинно и праведно пишется: «Человек, будучи в чести, не уразумел (сего), сравнялся с несмысленными скотами и уподобился им» ( Пс 48:13 ). Как скот любит и ищет то, что чувствует, так и бедный плотской и невозрожденный человек о том только заботится, что видит и что чувствам приятно, но о том нерадит, что Слово Божие обещает, так как не видит этого. Так перед потопом люди ели, пили, женились, выходили замуж, и только об угождении плоти и помышляли, но внезапно пришла вода и погубила всех. Так и ныне люди пьют, едят, гуляют, женятся, выходят замуж, то в гости ездят, то принимают гостей, а на дела Господни и судьбы Его не взирают, но нечаянно возгласит архангельская труба: вот грядет Христос Судия, восстаньте, мертвые, идите на суд. Из такой безоглядной и плотской жизни примечается, что «близок день Господень» (см. Мф 24 ; 2Тим 3 ; Иоил 3 и прочее).'
      cn: 诚然，经文公义地记载道：「人虽在尊位，却不省悟，竟与无知的牲畜无异，并与它们相似」（诗篇 48:13）。牲畜如何喜爱并寻求它所能感受到的，那贫穷的、属肉体的、未曾重生之人也照样只顾念他所看见的，并那取悦感官之事，却不顾念上帝圣言所应许的，因为他看不见这些。照样，洪水以前，人们吃喝嫁娶，只思念肉体的享乐，但洪水突然降临，将他们尽都毁灭。如今人们也是如此，饮酒、吃食、游乐、嫁娶，或出门做客，或在家待客，却不仰望上主的作为和祂的旨意，然则意想不到地，天使长的号筒将要吹响：「看哪，基督审判者将要降临，起来吧，死人，都来受审！」从这样一种漫不经心和属肉体的生活中可以看出，「上主的日子近了」（参阅马太福音 24；提摩太后书 3；约珥书 3 等经文）。
  - type: paragraph
    text:
      ru: Читай это, рассуждай и берегись. Блажен бодрствующий и имеющий светильник свой горящим, ибо выйдет навстречу Жениху с мудрыми девами и войдет в чертог ( Мф 25:10 ).
      cn: 阅读此言，思量并警醒。福哉警醒之人，并持守其灯常明者，因为他将与新郎相遇，同那聪明的童女们，并进入喜筵（马太福音 25:10）。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Отзываешься ты, что хотел бы от суеты отстать, но не можешь.
      cn: 你说你想要摆脱世俗烦扰，但你不能。
  - type: paragraph
    text:
      ru: 'Нет, отвечаю тебе: не не можешь, но не хочешь. При желании действительно все возможно. По водам ходить, по воздуху летать и прочее нам невозможно, а от любви мира сего отвратиться с помощью Божией возможно. Ибо Бог, Который повелевает: «Изыди от мира», – помогает тем, кто хочет и старается.'
      cn: 不，我答复你：不是不能，而是不愿。若有志愿，则确实一切皆有可能。在水上行走，在空中飞翔，以及其他类似之事，我们不能做到，但借着上帝的帮助，摆脱对这世界的爱恋，却是可能的。因为上帝，祂命令道：「从世界中出来！」——祂帮助那些有愿望并努力的人。
  - type: paragraph
    text:
      ru: Прочие люди такие же, как и ты, земные были, плоть носящие и немощные, но презрели мир, и ныне многие презирают. Им возможно было – возможно и тебе, ведь ты одного с ними естества. Заставь себя, если не хочешь.
      cn: 别的人和你一样，都是属世的，身披肉身且软弱，但他们却藐视了世界，且如今仍有许多人藐视。他们能做到——你也能做到，因为你与他们是同等本性。即使你不愿意，也要强迫自己。
  - type: paragraph
    text:
      ru: 'Размышление о наступающей беде и несомненная надежда на обещанное блаженство понудит и унылое сердце. Знаешь, что делают люди в пожарном случае или в нашествии иноплеменников: все бросают, чтобы жизнь свою спасти, хотя и жалеют о доме и имении своем. Видишь, что страх временного бедствия и смерти делает, как и выше писал я тебе. Ты им последуй в деле вечного спасения. Они ради временной беды и смерти оставляют все, а ты ради вечного бедствия и смерти оставь мир, дабы с миром не погибнуть.'
      cn: 默想临近的祸患，以及对于所应许的福乐毫无疑虑的希望，必将激励甚至沮丧的心。你知道人们在发生火灾时，或是在异族入侵时会怎么做：他们抛弃一切，为了保全自己的性命，尽管他们惋惜自己的房屋和财产。你看到暂时的灾祸和死亡的恐惧所起的作用，正如我上面给你写过的。在永恒的救恩之事上，你要效法他们。他们为了暂时的祸患和死亡抛弃一切，而你为了永恒的灾祸和死亡，要舍弃世界，免得与世界一同灭亡。
  - type: paragraph
    text:
      ru: Попадают люди в руки иноплеменников и умирают или в плен, который бывает хуже смерти, отводятся, если, не желая оставить имения, дома остаются. И часто сгорают люди, которые в дома, пламенем объятые, возвращаются, чтобы оттуда имущество вынести. И так люди, желая имущество спасти, сами погибают. Так поступают многие христиане, которые много собирают, а о душе небрегут, но так же пострадают. Имение остается чужим, а сами на тот век отходят без надежды спасения.
      cn: 人们落在异族人手中，或者死去，或者被掳走，那比死亡更糟，如果他们不愿放弃财产而留在家里。人们也常常被烧死，他们回到被火焰吞噬的房屋中，为了从那里抢救出财物。这样，人们为了抢救财物，自己却丧生了。许多基督徒也是如此行事，他们聚敛了许多财物，却不顾惜自己的灵魂，但他们也将同样受苦。他们的财产成了别人的，而他们自己则毫无得救的希望地离世，走向永恒。
  - type: paragraph
    text:
      ru: 'Знаешь также, что делают воины, как подвизаются, и в смертные случаи вдаются. Ради чего? Чтобы славу и ранг заслужить. Так поощряет их надежда удостоиться временной славы, хотя часто и обманываются. Почему же нас надежда удостоиться вечной славы не поощряет к подвигу? Поверь, друг, истину тебе пишу: если бы ты увидел будущую сынов Божиих славу, то и царскую диадему, и всю мира славу, и все сокровище его, радуясь, поверг бы, и о том одном заботился, как бы иную получить. Ничто бы тебя от того не удержало, не только прелесть мира, но и самое тяжкое мучение. «Нынешние временные страдания ничего не стоят в сравнении с тою славою, которая откроется в нас» ( Рим 8:18 ).'
      cn: 你也知道战士们如何行事，如何奋战，甚至投身于死亡之中。为了什么？为了赢得荣耀和位阶。激励他们的，是获得短暂荣耀的盼望，尽管他们常常受骗。那么为什么我们，获得永恒荣耀的盼望，却不激励我们去属灵的奋战呢？朋友，请相信我，我对你所说的是真理：如果你看到上帝之子们未来的荣耀，那么你就会欢喜地舍弃王冠、世上一切的荣耀以及它所有的财富，而只顾虑一件事，就是如何获得那更高的荣耀。没有什么能阻止你，不仅是世俗的诱惑，甚至是最沉重的苦难。「现今的短暂苦难，与那将要向我们显明的荣耀相比，是算不得什么的。」 (罗马书 8:18)
  - type: paragraph
    text:
      ru: Также, если бы тебе показал Бог адское мучение, то честь, слава, богатство и все сладости мира сего были бы для тебя, как горькая полынь, неутешно бы плакал и рыдал ты, чтобы на то место не прийти. Но в том бедность наша и слепота, что мы, чего не видим, того и не желаем, и того бедствия не ужасаемся, которого не чувствуем, а о Слове Божием не рассуждаем, или не верим тому, хотя и все для спасения нашего открыто в нем. И так всякий по своей воле погибает.
      cn: 同样地，如果上帝向你显明地狱的苦刑，那么，世间的尊荣、荣耀、财富和一切甜美对你来说就如同苦涩的艾草，你会不住地哭泣哀号，无法得到慰藉，以免来到那地方。然而，我们的贫乏和盲目就在于此：凡我们所不见的，我们就不去渴望；凡我们所不感受的灾祸，我们也不为此感到惊恐；反而，我们不思想上帝的圣言，或者不相信它，尽管其中已将我们得救的一切启示无遗。因此，各人按自己的意愿灭亡。
  - type: paragraph
    text:
      ru: Возьми в рассуждение воплощение Сына Божия и вольное Его страдание. Ради кого Он пришел в мир и пострадал? Ради человека. О, человек, человек! Дивное дело Божие, и дивный о нем Промысл Божий! Ради чего пострадал Христос? Ради человека. Не иная причина, как то, что сжалился над погибшим человеком и страданием Своим восхотел его от вечной муки избавить и в вечную жизнь ввести. О, воистину великое и непостижимое зло – вечная мука, от которой желая искупить человека и Крови Своей не пощадил Господь. О, каким великим и непостижимым должно быть блаженство вечное, если такой непостижимой ценой куплено, или, точнее, возвращено нам, поскольку мы грехами нашими потеряли его!..
      cn: 默想上帝之子的道成肉身和祂自愿承受的苦难。祂为谁降世并受苦？为的是人。哦，人啊，人啊！何其奇妙的上帝作为，以及为此所预备的奇妙上帝护理！基督为何受苦？为的是人。没有别的原因，只因祂怜悯那失丧的人，并借由祂的苦难，愿意使他脱离永恒的刑罚，进入永恒的生命。哦，永恒的刑罚真是一种巨大且不可测度的祸患！上主为了救赎人脱离它，甚至不惜流出祂自己的宝血。哦，永恒的福乐该是何等伟大且不可测度啊！倘若它是以如此不可测度的代价买回的，或者更确切地说，是归还给我们的，因为我们因着自己的罪而失去了它！
  - type: paragraph
    text:
      ru: 'Воистину, душа одного человека и спасение ее дороже для Христа, нежели весь свет, небо и земля, так как весь свет словом единым создал: «Он сказал – и стало так» ( Быт 1 ), – а ради души человеческой Сам в мир пришел, воплотился, пострадал и умер. О, человеколюбие Господне! О, достоинство души, ради которой Сам Бог во плоти явился! И не только явился во плоти, но и пострадал и умер ради души... Благослови, душа моя, Господа!'
      cn: 确实，一个人的灵魂及其救赎，在基督看来，比整个世界、天空和大地更为宝贵。因为祂只用一言便创造了整个世界：「祂说有，就有了」（创世记 1）；而为了人类的灵魂，祂亲自降世，道成肉身，受难并死去。哦，上主的人爱！哦，灵魂的尊贵，上帝为了它亲自道成肉身显现！祂不仅道成肉身显现，而且为了灵魂受难并死去……我的灵魂，颂赞上主！
  - type: paragraph
    text:
      ru: Такую ли благородную душу захотим миру нечувственному порабощать, и, возлюбленную Царем Небесным и Кровью Его святой омовенную, скверной мира любовью осквернять, и духовно прелюбодействовать, и, как драгоценный жемчуг, в грязь повергать?..
      cn: 难道我们竟愿将如此尊贵的灵魂，奴役于无情的世界，又将这蒙天上君王所爱，并以祂圣血洗涤的灵魂，以属世污秽之爱玷污，使之犯属灵的奸淫，如同宝贵的珍珠，抛入污泥之中吗？
  - type: paragraph
    text:
      ru: Пропади мир со всеми прелестями своими, пусть ищут его и любуются им не познавшие Христа. Нам же, о христиане, довлеет один Христос – красота, всех красот прекраснейшая, премудрость, содержащая все сокровища премудрости, сладость, все сладости превосходящая, слава, честь и похвала истинная. В Нем да будет для нас украшение, богатство, слава, честь, премудрость, утешение, радость, веселье и все блаженство, ныне в тайне сердца нашего сокровенное, но в день Его явиться имеющее. Тогда, то есть в откровении сынов Божиих, явится неоцененное всех христиан сокровище, которое они ныне в скудельных сосудах носят и которое злым и лукавым миром, как золото закопченное, презирается, и как жемчужина, в грязи валяющаяся, попирается, и как плод, хотя внутри сладкий и благовонный, но внешне некрасивый, отвергается.
      cn: 让世界及其一切诱惑都消逝吧，让那些不认识基督的人去寻求它，并陶醉于其中吧。然而对我们，哦，基督徒们，唯有基督就已足够——祂是美善，超乎一切美善的美善；祂是智慧，蕴含着智慧的一切宝藏；祂是甘甜，超越一切甘甜的甘甜；祂是真荣耀、真尊荣和真赞美。愿祂成为我们的妆饰、财富、荣耀、尊荣、智慧、安慰、喜乐、欢欣以及一切福乐，如今隐藏在我们心之隐秘处，却在祂显现之日将要彰显。届时，即在上帝之子们显现之时，所有基督徒那无可估量的宝藏将会显现。他们如今将这宝藏盛放在瓦器之中，且被邪恶狡诈的世界所轻蔑，如同被熏黑的黄金；又如掉落在泥中的珍珠，被践踏；又如那果实，虽内里甘甜芬芳，外表却不美观，而被弃绝。
  - type: paragraph
    text:
      ru: Веришь ли этому? Если веришь, то отвратись от того, что только кажется сокровищем, но обманчиво, от того, чем мир любителей своих прельщает, и обратись ко Христу, и сокровища истинного ищи у Него. А если ныне не веришь, то тогда уже увидишь очами твоими, но поздно, но без пользы, но с сожалением, воздыханием, сокрушением и теснотой сердца, тогда говорю, «когда праведники воссияют, как солнце, в царстве Отца их» ( Мф 13:43 ). А поскольку в отвращении сердца от мира сего почти вся сила христианского благочестия состоит, то возьмем в рассуждение некие к тому способы и их в сердце нашем сокроем и углубим, чтобы во время искушения и напасти оттуда, как из влагалища, орудия те взять и «устоять в день лютый, препоясав чресла» наши «истиною» ( Еф 6:13–14 ).
      cn: 你相信这个吗？如果你相信，就转离那看似是宝藏却具有欺骗性的事物，转离那世界借以诱惑其爱慕者的事物，并归向基督，在祂那里寻求真正的宝藏。而如果现在你不相信，那么那时你就会亲眼看见，但为时已晚，毫无益处，只会伴随着懊悔、叹息、忧伤痛悔和心神困苦。我说，那时，「义人在他们父的国里，要发光如同太阳」（马太福音 13:43）。既然基督徒的虔敬几乎全部力量都在于心转离这世界，那么我们就来思量一些达到此目的的方法，将它们藏在我们心里并使其深化，以便在受试探和患难之时，能从那里如同从剑鞘中取出那些兵器，并「在凶恶的日子站立得稳，用真理束上我们的腰」（以弗所书 6:13-14）。
  - type: paragraph
    text:
      ru: 1) Все, что ни есть в мире этом, человек при смерти оставляет, как и сам мир. Нагим входит в мир, нагим и исходит от мира. Никто не рождается богатым, благородным, почтенным, славным, но все равными, убогими и нагими рождаются, также и от мира равными отходят. Никто с собой ничего не выносит, ни богатый богатства, ни славный славы, ни почтенный чести, ни благородный благородства, но все всё здесь оставляют, и тогда всякий праведно об этих мира сего сокровищах рассуждает, но уже поздно. Зачем же за тем гоняться, что сегодня или завтра оставим? А вместо того уязвленную и трепещущую суда Божия совесть относим. Одна добродетель с нами отходит отсюда, и сопутствует нам, и клеветникам нашим заграждает уста, и приводит нас к Богу. Так рассуждай об этом ныне, как люди при смерти рассуждают, и тогда отстанешь от суеты.
      cn: 1) 世上的一切，人在临终时都会舍弃，如同世界本身。赤身来到世上，也赤身离开世界。没有人生来富足、高贵、尊荣、显赫，而是所有人都生而平等、贫乏和赤身，同样也平等地离世。没有人能带走任何东西，无论是富人的财富，还是显赫者的名声，或是尊荣者的荣耀，或是高贵者的尊贵，而是所有人都将一切留在这里，届时每个人都会公正地评判这些世上的财宝，但那时已晚。那么，为何要追逐那些我们今天或明天就要舍弃的东西呢？相反，我们却带着一颗被创伤且因上帝审判而颤栗的良心。唯有美德与我们一同离世，陪伴我们，并使诽谤我们的人哑口无言，引领我们归向上帝。故此，现在就如此思量，如同人在临终时思量一般，如此你便能远离虚妄。
  - type: paragraph
    text:
      ru: 2) Смерть за человеком ходит невидимой стезей. Кончина его там постигает, где не чает, и тогда постигает, когда не ожидает, и так постигает, как не надеялся. Будь же всегда таким, каким при кончине быть желаешь, рассуждай об этом, и внимай себе, и не захочешь в мире ни чести, ни славы, ни богатства, ни прочего угождения плоти. Думай, что сегодня или завтра скончаешься, и тогда вся суета от сердца твоего исчезнет. Ибо какая нужда в чести, в славе, богатстве и угождении плоти при кончине находящемуся? Хотя бы и царство, или золотые горы предлагали и обещали ему, – небрежет о том. Одна у него мысль, как бы блаженно скончаться. Будь же ныне таким и ты, и всякий день полагай себе последним, и ожидай, когда Господь твой позовет тебя к Себе, и ничто тебе не будет мило в мире, и когда будешь так бодрствовать и стоять, как на страже, блаженно скончаешься.
      cn: 2) 死亡以无形之路尾随人。他的死期在他未曾料想之处临到，在他未曾预料之时临到，并以他未曾期望之方式临到。那么，你当永远成为你临终时所愿望成为的样子，思量此事，并警醒自己，你就不会渴求世上的荣誉、荣耀、财富，或任何其他肉体上的满足。你当思想，你今日或明日便将离世，那时你心中一切的虚妄都将消逝。因为对于临终之人，荣誉、荣耀、财富和肉体上的满足有何需要呢？纵使有人向他献上并应许他一个王国，或是金山，他也会漠视它们。他只有一个念头，如何能蒙福地离世。那么，你今日也当如此，并且每日都视作你的最后一日，并等候你的上主何时将你召回祂身边，如此世上将无一物能让你留恋。当你如此警醒，如同守望者般站立，你将蒙福地离世。
  - type: paragraph
    text:
      ru: 3) Смертью, как вратами, всякий входит в вечность. Тут человек становится или вечно блаженным, или вечно бедным и окаянным. Тут часто, и по большей части, богатый делается вечно нищим, славный и почтенный вечно бесчестным, господин навечно уничиженным ниже последнего раба своего, а князья и вельможи хуже подданных своих, и прочие, по мнению мира великие, вечно убогими и уничиженными становятся и навеки будут. Тут от всякого отступает утеха, которой кратко, как во сне, наслаждался, и наступает лютая горечь, которую вовеки без конца будет вкушать. Тут кончится и терпение убогих, и нищий становится вечно богатым, отверженный вечно избранным, презренный и поруганный вечно славным, страждущий вечно утешенным, скорбный и печальный вечно радостным и веселым. Словом, всякий приемлет свой жребий навечно. Блаженны одни, и еще повторю, блаженны, ибо вечно будут блаженными, и окаянны другие, ибо вечно будут окаянными. Рассуждай об этом, и такая перемена для людей изменит тебя, и сделаешься иным, не таким, как прежде был. Ибо рассуждение о вечности сильно подвигнуть и переменить сердце человеческое.
      cn: 3) 每个人都通过死亡这道门户进入永恒。在那里，人要么变得永远蒙福，要么永远贫困和悲惨。在那里，常常，而且多半，富人变为永远的穷人，荣耀和受尊崇的变为永远蒙羞的，主人永远被贬低到他最末等的奴仆之下，而君王和贵族比他们的臣民更差，其他那些在世人眼中伟大的，都变为永远贫贱和被贬低的，并永远如此。在那里，每个人曾短暂地、如同在梦中享受的慰藉都将离去，而猛烈的苦涩来临，他将永远无止境地品尝。在那里，贫贱者的忍耐也将结束，穷人变成永远的富人，被弃绝的变成永远被拣选的，被轻蔑和侮辱的变成永远荣耀的，受苦的变成永远得安慰的，悲伤和忧愁的变成永远喜乐和欢愉的。总之，每个人都将永远接受自己的命运。福哉一些人，我还要再说一次，福哉他们，因为他们将永远蒙福；而另一些人是悲惨的，因为他们将永远悲惨。思量这事，人类的这种转变将改变你，使你变得与众不同，不再像从前那样。因为对永恒的思量能强烈地打动和改变人的心。
  - type: paragraph
    text:
      ru: 4) Что в мире этом делается, и какое видим благополучие или злополучие здесь, – все это как тень некая будущих благ и зла истинного. Видим, как боится человек суда человеческого и убегает от него. Как несравненно более бояться суда Божия подобает! Со стыдом и страхом идет человек на суд человеческий, – какой стыд, страх и ужас охватит человека, когда призовется он на суд Божий! Стоит человек на суде человеческом окованный железом, стыдом покрыт, страхом содержим, обличается свидетелями, слышит приговор, видит дела свои беззаконные во всеуслышание объявленные, сам объявляется законопреступником и бесчестным человеком, отлучается от числа добрых и осуждается по законам в наказание правильное. Этот суд, этот стыд, страх и бесчестие – тень некая будущего суда, стыда, страха и бесчестия.
      cn: 4) 世上所发生的一切，以及我们在此所见的一切祸福，所有这一切都不过是未来真福和真祸的某种影儿。我们看到，人如何惧怕人的审判并试图逃避。该当何等无可比拟地更加惧怕上帝的审判啊！人带着羞愧与恐惧走向人的审判，——当人被召到上帝的审判台前时，何等的羞愧、恐惧和惊骇将笼罩他啊！人站在人的审判台前，身被铁链束缚，蒙受羞辱，心怀恐惧，被证人所指控，听闻判决，亲见自己的不法行为被昭告天下，他自己被宣告为违法者和不光彩之人，被逐出良善之人行列，并根据律法被判处应得的刑罚。这审判，这羞愧、恐惧和耻辱，都不过是未来审判、羞愧、恐惧和耻辱的某种影儿。
  - type: paragraph
    text:
      ru: Там истинный стыд, так как всемирный, там истинный страх и ужас, так как Судия – Бог и суд – Божий. Там станет человек не перед человеком, но пред Богом Судией, Который и тайны сердечные знает, станет страхом, как железом, связан и грехами обременен. Увидит Судию в страшной и Божией славе, окружаемого бесчисленным множеством Ангелов и Архангелов, там откроется ему книга совести, и представятся дела ему, словом, делом и помышлением, явно и тайно им соделанные, и всему миру, Ангелам и всем людям в явление придут. Увидит Судии Бога праведный гнев, Того, Который ради него в мир пришел, желая его спасти, и за него пострадал и умер, но им неблагодарно и бесстыдно отвержен и уничижен. Тут охватит бедного грешника сокрушение, теснота, ужас и трепет, вострепещет весь, как лист от ветра, услышит приговор от Судии за неблагодарность, объявится достойным осуждения и вечного наказания, будет отвержен от лица Божия и отлучен от числа праведных навеки, причислится к духам злобным, и с ними заключится в темнице вечного мучения, и будет пить горькую чашу вечного гнева Божия.
      cn: 那里有真正的羞耻，因为是普世的；那里有真正的恐惧和惊骇，因为审判者是上帝，审判是上帝的。在那里，人不是站在人面前，而是站在审判者上帝面前，祂也知道人心中的隐秘；他会被恐惧像铁链一样捆绑，被罪孽压垮。他将看见审判者，在可畏而属上帝的荣耀中，被无数的天使和总领天使所环绕；在那里，良心之书将向他敞开，他所行的、口说、手做和意念中的事，无论公开还是隐秘完成的，都将呈现在他面前，并向全世界、众天使和所有人显明。他将看见审判者上帝公义的愤怒，那位为了拯救他而来到世间，渴望拯救他，并为他受难和死亡，却被他忘恩负义、毫无羞耻地拒绝和蔑视了。这时，悲惨的罪人将被悔恨、困苦、惊骇和颤栗所抓住；他将全身颤抖，如同风中的树叶；他将听到审判者因其忘恩负义而发出的判决，他将被宣判配受谴责和永远的刑罚，他将被逐出上帝的面，并永远与义人分离，他将被归入邪恶的灵之列，并与他们一同被囚禁在永恒痛苦的牢狱中，并将饮尽上帝永恒愤怒的苦杯。
  - type: paragraph
    text:
      ru: Понимай и представляй в уме праведный и Страшный тот Суд, и отойдет от тебя любовь суетного мира. Поверь, что память всегдашняя и размышление о будущем суде отвратит тебя от сего суетного желания, и подвигнет тебя к истинному покаянию, молитве, и к тому одному старанию, чтобы там не посрамиться. Если к суду человеческому люди так тщательно приготовляются, как сам знаешь, то как не подвигнет к тщательному приготовлению память суда Божия и верное о нем рассуждение? Ибо суду человеческому последует временное и легкое бедствие, а суду грядущему – вечное и тяжкое. Временное все, хотя и продолжительное, минуется; вечное же никогда не перестает, всегда пребывает и никогда не кончится.
      cn: 请理解并在心中观想那公义而可畏的审判，属世的虚妄之爱就会离开你。相信，对未来审判的恒久记忆和思量，将使你远离这虚妄的欲望，并促使你真心悔改，勤于祷告，且唯独为此努力，以求届时（在审判中）不致蒙羞。既然世人对人的审判都如此仔细地预备，如你所知，那么，对上帝审判的记忆和对它的真实思虑，又怎能不促使人细致预备呢？因为人的审判之后，是暂时的、轻微的灾祸；而未来的审判，则是永恒的、沉重的灾祸。凡是暂时的，即便持久，也终将过去；而永恒的则永不停止，永远长存，永无尽头。
  - type: paragraph
    text:
      ru: 'В каком тогда состоянии грешник будет, когда весь свет вострепещет и поколеблется от страха перед разгневанным Судией, и увидит пред очами своими огненную реку, в которую должен быть ввергнут, и во веки в ней гореть и не сгореть, смерть вкушать и не умирать?.. Когда «и цари земные, и вельможи, и богатые, и тысяченачальники, и сильные, и всякий раб, и всякий свободный» пожелают «скрыться в пещерах и в ущельях гор» , и воскликнут «горам и камням: падите на нас и сокройте нас от лица Сидящего на престоле и от гнева Агнца, ибо пришел великий день гнева Его, и кто может устоять» ( Откр 6:16–17 )?!.. – Что ты тогда будешь думать, ты, который здесь в мире не Богу, но мамоне служил, не заповедям Божиим внимал, но о суете одной помышлял, не Богу, но миру угождал, не Создателя своего, но себя и создание почитал, не Благодетеля своего любил, но Его создание, не чести Божией и славы, но своей части и славы искал?!..'
      cn: '那时，罪人将处于何等境地？当整个世界在忿怒的审判者面前战栗摇撼，在其眼前看到那条火河，他必将被投入其中，并且在其中永远燃烧却不焚尽，尝受死亡却不死去？当「地上的君王、臣宰、富户、千夫长、壮士和一切为奴的、自主的」，都巴不得「藏在山洞和岩石穴里」，并向山和岩石呼喊说：「倒在我们身上吧！把我们藏起来，使我们避开坐在宝座上者的面和羔羊的忿怒；因为祂们忿怒的大日到了，谁能站立得住呢？」（启示录 6:16-17）？！


        那时，你将作何感想？你，在此世中不服事上帝，却服事玛门；不留心上帝的诫命，却只思念虚妄；不取悦上帝，却取悦世界；不尊崇你的造物主，却尊崇自己和受造物；不爱你的施恩者，却爱祂的受造物；不寻求上帝的尊荣和荣耀，却寻求你自己的分和荣耀？！'
  - type: paragraph
    text:
      ru: 'Земля и пепел! Помышляй об этом и исправится сердце твое, да слышится всегда в ушах души твоей слово пророческое: «Господь вовек пребывает, приготовил Он для суда престол Свой, и Он будет судить вселенную по правде, будет судить людей по правоте» ( Пс 9:8–9 ). Готов Судия на суд, готов престол Его, готовы Ангелы вострубить и собрать на суд всех. Готово царствие небесное благословенным, готова и геенна нераскаянным грешникам, но ожидает нашего покаяния. «Не медлит Господь исполнением обетования, как некоторые почитают то медлением; но долготерпит нас, не желая, чтобы кто погиб, но чтобы все пришли к покаянию» ( 2Петр 3:9 ).'
      cn: 尘土和灰烬！思量于此，你的心就会得以改正，愿先知的话语常常在你灵魂的耳中响起：「上主永远长存，祂已为审判设立了祂的宝座，祂必按公义审判普世，按正直审判万民。」（诗篇 9:8-9）审判者已预备好施行审判，祂的宝座已预备好，众天使已预备好吹响号角，召集所有人前来受审。天国已为蒙福者预备妥当，地狱也已为不悔改的罪人预备妥当，然而祂仍在等候我们的悔改。「上主并不迟延祂的应许，如同有些人以为祂迟延一样；祂乃是宽容我们，不愿有一人沉沦，乃愿人人都悔改。」（彼得后书 3:9）
  - type: paragraph
    text:
      ru: 5) В веке этом бывает, что земледельцы, которые возделывают землю, трудятся и сеют, – с радостью плоды трудов своих собирают, а ленивые и гуляки, на них смотря и не имея чем довольствоваться, скорбят и ругают себя. Так будет и в тот день. Боголюбцы плоды веры и благочестия с радостью пожнут и получат блага, которых «не видел глаз, не слышало ухо, и не приходило то на сердце человеку» ( 1Кор 2:9 ).
      cn: 5) 在今世，耕耘土地、辛劳播种的农夫，欢欣地收取他们劳作的果实；而那些懒惰者和游手好闲之徒，看着他们，却一无所有可供满足，便悲伤并责骂自己。在那一日，亦将如此。爱上帝者将欢欣地收割信德和虔敬的果实，并获得福祉，是「眼睛未曾看见，耳朵未曾听见，人心也未曾想到的」（哥林多前书 2:9）。
  - type: paragraph
    text:
      ru: 'А миролюбцы, видя это и узнав, что лишены таковых благ и отвержены, восплачут и возрыдают и будут бесполезно себя ругать. «Что посеет человек, то и пожнет: сеющий в плоть свою от плоти пожнет тление, а сеющий в дух от духа пожнет жизнь вечную» ( Гал 6:7–8 ). И еще говорит Господь: «Вот, рабы Мои будут есть, а вы» (беззаконные) «будете голодать; рабы Мои будут пить, а вы будете томиться жаждою; рабы Мои будут веселиться, а вы будете в стыде; рабы Мои будут петь от сердечной радости, а вы будете кричать от сердечной скорби и рыдать от сокрушения духа» ( Ис 65:13–14 ).'
      cn: '而那些爱世之人，看到这一切，并得知他们被剥夺了这些福益、并被弃绝之后，必会痛哭流涕，哀号不已，并徒劳地咒骂自己。

        「人种的是什么，收的也是什么：顺着情欲撒种的，必从情欲收败坏；顺着圣灵撒种的，必从圣灵收永生。」（加拉太书 6:7-8）

        上主又说：「看哪，我的仆人必有吃的，你们（作恶者）却必饥饿；我的仆人必有喝的，你们却必干渴；我的仆人必欢乐，你们却必蒙羞；我的仆人必因心中欢畅而歌唱，你们却必因心中忧伤而哀嚎，因灵里破碎而哭泣。」（以赛亚书 65:13-14）'
  - type: paragraph
    text:
      ru: 'И сожаление, и горечь, и скорбь, и болезнь умножается, если видеть иных в благополучии, себя же в неблагополучии, видеть иных на свободе, себя же в неволе, видеть иных во славе, себя же в бесславии и бесчестии, видеть иных в радости, себя же в скорби, видеть иных в богатстве, себя же в нищете, видеть, что иные едят, пьют и веселятся, а самому испытывать голод, жажду и печаль. И так бывает в мире, и здесь я, применяясь к человеку, и по мудрованию человеческому говорю. Как несравненно умножится сожаление, и горечь, и беда и болезнь в день судный при разлучении праведных от грешных, когда грешные увидят праведных во славе, в радости и веселье, в царствии, в торжестве и в вечном и несказанном блаженстве со Христом, такой славы подвигами с помощью Божией достигших, хотя того же естества были, той же плотью и немощью обложены, как и грешники, которые себя увидят в крайнем окаянстве, бедствии, бесчестии, отверженными от Источника жизни навеки, – и тогда познают, что от сего бедствия могли избавиться и вечную жизнь и блаженство получить благодатью Христовой, но не хотели, а вместо истины за тенью гонялись. Увидят и познают сие, и тем весьма умножится их скорбь, болезнь, раскаяние и тоска, но уже не возвратят того, что нерадением потеряли. Именно об этом и Господь говорит: «Там будет плач и скрежет зубов, когда увидите Авраама, Исаака и Иакова и всех пророков в Царствии Божием, а себя изгоняемыми вон» ( Лк 13:28 ). А особенно, когда тех увидят во славе и между сынами Божиими, которых здесь презирали, злословили, ругали, злодеями называли, как подножие, попирали, и как сор вменяли, как сие их раскаяние и воздыхание запоздалое описано в книге Премудрости Соломона (Прем гл. 5).'
      cn: '懊悔、苦楚、忧伤和痛苦都会倍增，如果一个人看到别人享福，自己却身处不幸；看到别人自由，自己却受困；看到别人得荣耀，自己却蒙羞受辱；看到别人喜乐，自己却陷于忧伤；看到别人富足，自己却在贫困中；看到别人吃喝玩乐，自己却忍受饥饿、干渴和悲伤。世间常有之事，我在此亦是顺应人性，按着人的思维而言。


        在审判日，当义人与罪人分离之时，懊悔、苦楚、祸患和痛苦将会无可比拟地倍增。那时，罪人将看到义人在荣耀、喜乐和欢愉中，在国度里，在胜利之中，与基督同享永恒且无法言喻的福乐——他们凭借着上帝的帮助所行的善功，达到了如此的荣耀，尽管他们本性相同，具有同样的肉身和软弱，正如这些罪人一样。罪人将看到自己身处极度的悲惨、困境和羞辱之中，永远被生命之源所弃绝——那时他们将认识到，他们本可以摆脱这苦难，借着基督的恩典获得永生和福乐，但他们不愿，反而追逐幻影，而非真理。他们将会看到并认识到这一切，这将极大地增加他们的忧伤、痛苦、悔恨和愁苦，但他们已无法挽回因自己的疏忽而失去的一切。


        主也正是为此说道：「在那里，将有哀哭和切齿，当你们看见亚伯拉罕、以撒、雅各和所有的先知都在上帝的国度里，而自己却被赶到外面去时。」（路加福音 13:28）尤其，当他们看见那些在此世曾被他们藐视、诽谤、辱骂、称作恶人，如同脚下的踏板般践踏，并视如垃圾的人，竟在荣耀中，身列上帝的众子之间时，他们将深感悔恨与迟来的叹息，正如所罗门智慧书中所描述的一样。（智慧书 第5章）'
  - type: paragraph
    text:
      ru: 6) Умножит страдание в осужденных, и сильно отяготит, и нестерпимую тоску, страх и ужас соделает вечное отчаяние милости Божией, то есть, что от того страшного бедствия и страдания, в которое нерадением попали, никогда не освободятся, но вовеки в нем страдать будут. Здесь, в мире этом, каким бы тяжким и продолжительным ни было бы страдание, однако ж оканчивается или прежде смерти или непременно смертью; там же никогда не окончится.
      cn: 6) 会加增被定罪者的痛苦，并使其沉重难堪；使无法忍受的忧愁、恐惧和惊骇，化作对上帝恩慈的永恒绝望。也就是说，他们将永不能从那因懈怠而陷入的可怕灾难和痛苦中解脱，而将永远在其中受苦。在这世上，无论痛苦多么沉重和漫长，终究会在死前或必伴随死亡而结束；而在那里，它将永无止境。
  - type: paragraph
    text:
      ru: О, вечность злополучная, сколь горька и память твоя и страшна! Вечность – это начало без конца. Помышляй об этом и не захочешь в мире этом веселиться.
      cn: 哦，祸患的永恒啊，你的记忆何等苦涩，又何等可怖！永恒——是没有尽头的起始。默想此事，你便不会想要在这世上欢娱了。
  - type: paragraph
    text:
      ru: 7) В мире случающееся неблагополучие – это некая тень и образ будущего и вечного неблагополучия. Тяжко здесь царский гнев терпеть временно, но гораздо тяжелее будет терпеть гнев Божий вечно. Тяжко от царского лица и милости его отверженным быть и в заточение быть посланным, но гораздо тяжелее будет от лица Божия и милости Его отверженным быть и отосланным в заточение навечно. Тяжко здесь лишиться дружбы добрых людей и ими оставленным быть, но гораздо тяжелее будет лишиться пресладкой дружбы Ангелов Божиих и всех святых навечно. Тяжко здесь вмененным быть между злодеями и к злым и бесчестным людям причислиться, но гораздо тяжелее будет причтенным быть дьяволу и злым ангелам его, и с ними за одно вменяться вечно. Тяжко здесь у мучителя некоего под властью быть и от него поругание, осмеяние и всякое насилие и озлобление терпеть, но гораздо тяжелее будет у сатаны, противника Божия, быть во власти и от него поругание, посмеяние и озлобление терпеть вечно. Тяжко здесь биение, страдание, болезнь, горячку, лихорадку, зубную боль и расслабление тела терпеть, каждому это известно, кто испытал, но гораздо тяжелее будет терпеть вечно жжение огня геенского, болезнь лютую и несносную, скрежет зубов, червь неусыпающий, и душой и телом в том страдать. Тяжко здесь в темнице сидеть, лишаться света и никакого не чувствовать утешения, но гораздо тяжелее будет сидеть в адской темнице и никогда света не видеть, и всего лишиться утешения навечно. Тяжко здесь жажду терпеть и желать, но не иметь прохлаждения, но тяжелее будет вечно. Словом, тяжко всякое страдание временное, или на душе, или на теле бываемое, каждый это знает, но несравненно тяжелее вечное, поскольку оно бесконечно, и в смысле продолжительности, и по силе своей, при этом, и душой и телом будут страдать осужденные.
      cn: 7) 在世上所发生的不幸，是一种将来和永恒不幸的阴影与预兆。在此暂时忍受君王的忿怒是艰难的，但永远忍受上帝的忿怒将远为更艰难。被君王的容颜和恩慈所弃绝，并被遣送到囚禁之地是艰难的，但永远被上帝的圣容和恩慈所弃绝，并被遣送到永远的囚禁之地将远为更艰难。在此失去善良人的友谊并被他们所离弃是艰难的，但永远失去上帝众天使和所有圣者的至甜友谊将远为更艰难。在此被算作凶恶之人并被归入邪恶不名誉之人之中是艰难的，但被算作魔鬼和它邪恶的天使，并永远与他们一同被归入一类将远为更艰难。在此处于某个施暴者的权下，并忍受他的侮辱、嘲笑、以及一切的暴力和苦害是艰难的，但永远处于撒但——上帝的仇敌——的权下，并永远忍受它的侮辱、嘲弄和苦害将远为更艰难。在此忍受鞭打、痛苦、疾病、高烧、寒热病、牙痛和身体衰弱是艰难的，凡经历过的人都深知此理，但永远忍受地狱之火的焚烧，那剧烈且无法忍受的痛苦，咬牙切齿，不死的虫，并在此中灵魂和身体一同受苦，将远为更艰难。在此坐监，失去光明，感受不到任何安慰是艰难的，但坐在地狱的监牢，永不见光明，并永远失去一切安慰将远为更艰难。在此忍受干渴，渴望却得不到清凉是艰难的；但永远忍受如此的干渴，将远为更艰难。总而言之，任何暂时的痛苦，无论是发生在灵魂上还是身体上的，每个人都知道是艰难的，但永恒的痛苦是无可比拟地更艰难的，因为它无限，无论从持续时间还是从其力量来看，此外，被定罪之人将灵魂和身体一同受苦。
  - type: paragraph
    text:
      ru: Временное страдание – это тень вечного страдания, но насколько тень отличается от истины, настолько временное страдание от вечного. Тень – это ничто в сравнении с истиной, и временное страдание ничто против вечного. Всякое временное страдание не без утешения бывает, но вечное никакого утешения не имеет. Познавай же вечное страдание, сравнивая с временным, и берегись, чтобы не впасть в то. Ныне сходи умом в ад, чтобы потом душой и телом не сойти. Если горячки и лихорадки, и зубной боли, и темницы, уз, биения, и прочих временных бедствий терпеть не можешь, – как стерпишь огонь жгущий, но не сжигающий, червь грызущий, но не поедающий, скрежет зубов, тьму кромешную, гнусный вид демонов, плач, стенание и рыдание, и прочее зло как стерпишь?
      cn: 暂时的苦难是永远苦难的阴影，正如阴影有别于实体，暂时的苦难也照样有别于永远的苦难。阴影与实体相比微不足道，暂时的苦难与永远的苦难相比也微不足道。凡暂时的苦难，总不乏安慰，但永远的苦难却毫无安慰可言。那么，请你借着与暂时的苦难比较来认识永远的苦难，并务要谨慎，免得堕入其中。现在就让你的心神下到地狱，以免日后你的灵魂和身体都下到那里。若是高热与寒颤、牙痛、监禁、捆绑、鞭打，以及各种其他的暂时灾祸你都无法忍受，那你又如何能忍受得了那燃烧却不焚灭的火、啃噬却不吞食的虫、咬牙切齿、漆黑的幽暗、恶魔可憎的面貌、哭泣、哀号与痛哭，以及其他一切的邪恶呢？
  - type: paragraph
    text:
      ru: Помышляй об этом, и сравнивай временное страдание с вечным, и из гонится таким размышлением, как бичом, суета от сердца твоего. Воистину на ум не придет тебе ни честь, ни слава, ни богатство, ни сладость мира сего. Хлебом и одеянием и хижиной доволен будешь, но все старание и попечение твое будет о том, как бы от того бедствия избавиться.
      cn: 默想此事，并将暂时的苦难与永恒的苦难作比较，这样一来，虚妄就会像被鞭打一样，从你心中被驱逐出去。确实，你心中不会想起尘世的尊荣、光耀、财富或甘甜。你将以面包、衣裳和茅舍为满足，但你所有的努力和关怀都将是关于如何摆脱那苦难的。
  - type: paragraph
    text:
      ru: 'Предостерегаешь себя от болезни и другого бедствия временного, так как видишь его, – как не будешь стараться, чтобы в вечную беду не попасть, когда память и страх того в сердце твое вселится? Возьми в рассуждение Спасителево слово: «Какая польза человеку, если он приобретет весь мир, а душе своей повредит? или какой выкуп даст человек за душу свою» ( Мф 16:26 )? И сравнивай время с вечностью и мир приобретенный с погибшей душой. Нет никакой пользы там, где нет спасения души. Что тебе во всем мире, когда душа погибает?'
      cn: 你防备自己染上疾病和其他暂时的灾祸，因为你看见它——当对那永远的灾难的记忆和恐惧入住你心之时，怎能不努力避免它呢？请思想救主的话：「人若赚得全世界，却赔上自己的灵魂，有什么益处呢？人还能拿什么作自己灵魂的赎价呢？」（马太福音 16:26）并将时间与永恒相比较，将所赢得的世界与失丧的灵魂相比较。在没有灵魂救恩之处，毫无益处。当灵魂失丧之时，整个世界对你又有何益处呢？
  - type: paragraph
    text:
      ru: Итак, спасение твоей души должно быть тебе дороже более всех мира сего сокровищ, дороже неба и земли, и дороже всей славы, от всего мира во едино собранной. Ибо душа без всего того на тот век отойдет и ничего с собой не возьмет, как и в мир ничего не внесла, а относит отсюда только или спасение, или погибель.
      cn: 因此，你灵魂的救赎对你而言，应当比这世上一切的财宝更为宝贵，比天地更为宝贵，也比从全世界汇集而来的全部荣耀更为宝贵。因为灵魂在没有这一切的情况下将离世而去，且什么也带不走，正如它进入世界时什么也未曾带来；它却只从这里带走救赎，或灭亡。
  - type: paragraph
    text:
      ru: 8) Обратим ныне очи наши сердечные к вечной жизни и научимся познавать будущее вечное блаженство, как от тени истину, от мира и в нем происходящего, к чему вера наша христианская да руководствует нас. Ибо без веры ни понять, ни говорить о будущем и невидимом не можем ничего. Веры же основание твердое и непоколебимое есть Слово Божие и милостивое его обещание во Христе Иисусе Господе нашем.
      cn: 8) 如今让我们将我们心中的眼睛转向永生，并学习认识未来的永恒福乐；如同从影子中领悟真理，也从这世界和其中所发生的一切领悟永恒福乐，愿我们的基督徒信仰引导我们走向这一切。因为没有信仰，我们既无法理解，也无法谈论关于未来和那不可见的一切。而信仰坚固而不可动摇的根基，是上帝的圣言，以及祂在我们主基督耶稣里恩慈的应许。
  - type: paragraph
    text:
      ru: Знаешь сам, с каким ликованием и торжеством воины, победившие неприятеля, возвращаются в отечество свое, и всякий по заслуге своей принимает почесть от царя своего. С каким несравненно большим торжеством душа, которая здесь подвизалась против мира, плоти и дьявола, победив этих врагов, восходит в отечество свое – небо и принимает почесть там от Царя Небесного Христа! Радуется воин, победой и почестью от царя прославленный. Как несравненно более возрадуется душа, когда от Царя Небесного за подвиг и победу прославится!
      cn: 你自己知道，战胜敌人的战士们带着何等的欢欣与凯旋返回他们的故土，并且各人按其功绩从他们的君王那里领受尊荣。那在此地与世界、肉体和魔鬼争战的灵魂，在战胜了这些敌人后，带着何等无比宏大的凯旋上升到她的故土——天国，并在那里从天国君王基督那里领受尊荣！战士因其胜利和从君王所领受的尊荣而得以荣耀，为此欢欣。当灵魂因其争战和胜利从天国君王那里得以荣耀时，它将何等无比地更加欢欣雀跃！
  - type: paragraph
    text:
      ru: 'Также, когда сын к отцу своему из дальней страны возвратится, с какой радостью отцу является, и видит лицо его, и отцом встречается и принимается! С какой радостью и весельем благочестивая душа от мира сего, дальней страны и странствования и плачевной юдоли, возвратится к Небесному Отцу, и увидит святейшее лицо Его, и поклонится престолу славы Его и Его святейшими обнимется объятиями! Тогда радость будет на небесах о такой душе: возрадуются Ангелы Божии и все святые о такой душе и воспоют благодарственную песнь: «Слава в вышних Богу» ( Лк 2:14 )!'
      cn: 同样，当儿子从遥远的国度回到他父亲身边时，他怀着何等喜悦的心情出现在父亲面前，看到他的面容，并被父亲遇见和接纳！虔敬的灵魂将怀着何等的喜悦和欢乐，从这世上、这遥远的国度和飘泊之地，以及这悲苦的幽谷，回到天父那里，看到祂至圣的面容，并跪拜在祂荣耀的宝座前，被祂至圣的怀抱所拥抱！那时，在天上必为这样的灵魂欢欣喜悦：上帝的众天使和一切圣者必为这样的灵魂而欢喜，并歌唱感恩之歌：「荣耀归于至高处的上帝」（路加福音 2:14）！
  - type: paragraph
    text:
      ru: Также видим здесь, как сладко и приятно человек упокоевается после трудов, тогда забывает всю свою скорбь и болезнь, в трудах понесенную. Как сладко и мирно упокоится в вечной жизни душа святая, которая здесь трудилась, боролась и подвизалась в деле благочестия, умножала таланты Господа своего, служила Господу своему со страхом и ближнему своему с любовью! Тогда «войдет в радость Господа своего» ( Мф 25:21 ). Тогда, «войдя в покой» вечный, забудет все свои здешние труды, беспокойства, скорби, печали и болезни ( Евр 4:10 ). Поэтому вечная жизнь в Святом Писании «покоем» называется ( Откр 14:13 ). Ибо здесь, в мире этом, – место торга, в котором таланты наши мы должны трудами умножать, а там – место упокоения. Здесь путь и странствование, а там отечество и дом наш.
      cn: 我们也在此看到，人在劳苦之后得到安息是何等甜美和愉悦，那时，他便忘记了劳苦中所承受的一切忧伤和疾病。圣洁的灵魂在永恒的生命中将何等甜美而平安地安息！它在此世曾为敬虔之事而劳作、争战并苦修，增添了它主人的才干，敬畏地侍奉了它的主，并以爱心侍奉了它的近人！那时，它将「进入它主人的喜乐」（马太福音 25:21）。那时，它「进入」永恒的「安息」之后，将忘记它在此世的一切劳苦、不安、忧伤、悲痛和疾病（希伯来书 4:10）。因此，圣经中称永生为「安息」（启示录 14:13）。因为在此世，在此世界，是交易之地，在此，我们当用劳苦增添我们的才干；而彼处，则是安息之所。此世是道路与客旅，而彼处，则是我们的故乡和家园。
  - type: paragraph
    text:
      ru: Еще видим, что здесь всякий желает и ищет жить в городе хорошо устроенном, красивом, богатом и славном и в доме пребывать также богатом и красивом, а в вечной жизни будет город красивый, пребогатый и славный, – град Божий, вышний Иерусалим, «которого художник и строитель Бог» . Кто может описать красоту его? Ибо «не видел того глаз, не слышало ухо, и не приходило то на сердце человеку, что приготовил» (там) «Бог любящим Его» ( 1Кор 2:9 ). Град сей – «чистое золото, подобен чистому стеклу. Основания стены города украшены всякими драгоценными камнями. Улицы города – чистое золото, как прозрачное стекло» , и прочее ( Откр 21:18–19, 21 ). Там «дом» Небесного «Отца» , в котором «много обителей» ( Ин 14:2 ). В том городе, прекрасном и преславном, и в тех пресладких обителях водворятся избранные Божии, будут в жилищах покоя, и в храминах безопасных, и в покоях премирных.
      cn: 我们还看到，在此地上，每个人都渴望并寻求居住在一个结构良好、美丽、富裕和荣耀的城市中，并住在同样富丽堂皇的房屋里。然而在永恒的生命中，将有一个美丽、极其富裕和荣耀的城市——上帝之城，至高的耶路撒冷，「其设计者和建造者是上帝」。谁能描述它的美丽呢？因为「眼睛未曾看见，耳朵未曾听见，人心也未曾想到，上帝为爱祂之人所预备的」（哥林多前书 2:9）。这城是「纯金的，如同纯净的玻璃。城墙的根基是用各样宝石装饰的。城里的街道是纯金的，如同透明的玻璃」，等等（启示录 21:18-19，21）。在那里，有天上的「父」的「家」，其中「有许多住处」（约翰福音 14:2）。在那美好而极其荣耀的城市里，在那些极其甜美的住处中，上帝的选民将定居于此，他们将在安息的居所中，在安全的殿宇里，在超乎世界的平静中。
  - type: paragraph
    text:
      ru: Видим также здесь, как приятно людям, любовь между собой имеющим и собравшимся воедино, обедать, ужинать, есть, пить и веселиться. Видим это в мире, а там избранные Божии «возлягут с Авраамом, Исааком и Иаковом» ( Мф 8:11 ), «есть и пить будут за трапезою Христовой в царстве Его» ( Лк 22:30 ). Тогда «насытятся от тука дома Господня, и потоком сладости Его напоятся» ( Ис 65:13–14 ; Пс 35:9 ), ибо там источник жизни.
      cn: 我们在此也看见，彼此相爱并聚集一处的人们，一同午餐、晚餐、吃喝、欢愉，是何等地令人喜悦。我们在世上看见这些，而在那里，上帝的选民「必与亚伯拉罕、以撒、雅各一同坐席」（马太福音 8:11），「在祂的国里，在基督的筵席上吃喝」（路加福音 22:30）。那时，「他们必因上主殿宇的肥甘得饱足，也必饮祂乐河的水」（以赛亚书 65:13-14，诗篇 35:9），因为那里是生命的泉源。
  - type: paragraph
    text:
      ru: Видим также здесь, как любят люди одеваться в одежды красивые и светлые, а там избранные Божии «облекутся в виссон чистый и светлый, в ризу спасения и одежду правды» ( Откр 19:8 ; Ис 61:10 ). Тогда «уничиженное тело» святых «преобразится так, что будет сообразно славному телу Христову» ( Фил 3:21 ). «Тогда праведники воссияют, как солнце, в царстве Отца их» ( Мф 13:43 ).
      cn: 我们也看到，世人喜爱穿戴华美光亮的衣裳，而在那里，蒙上帝拣选的人将「穿上洁白明亮的细麻衣，披上救恩的袍，穿上公义的衣」（启示录 19:8，以赛亚书 61:10）。那时，圣徒「卑微的身体」将「改变，与祂荣耀的身体相似」（腓立比书 3:21）。「那时，义人在他们父的国里，要发光如同太阳」（马太福音 13:43）。
  - type: paragraph
    text:
      ru: Еще видим здесь, что всякий желает во дворе царском жить и слыть придворным его слугой, а там избранные Божии и святые будут жить в доме Божием, во дворе Небесного Царя. «Блаженны живущие в дому Твоем» (Господи), «во веки веков восхвалят Тебя» ( Пс 83:5 ).
      cn: 我们在此还看到，每个人都渴望住在皇家宫廷中，并被称为其宫廷仆人，而在那里，上帝的选民和圣徒将住在上帝的家中，在天国君王的宫廷里。「福哉！那些住在祢家中的人！」（上主啊），「他们将世世代代赞美祢！」（诗篇 83:5）。
  - type: paragraph
    text:
      ru: 'Еще примечается здесь, что всякий хочет слышать сладкое пение, и сколь сладко утешается им, сказать невозможно, а там услышится сладкое пение Ангелов святых и избранных. Во граде том, на каждой его улице, поют пресладкую песнь: «Аллилуия! ибо воцарился Господь Бог Вседержитель. Возрадуемся и возвеселимся и воздадим Ему славу; ибо наступил брак Агнца, и жена Его приготовила себя» ( Откр 19:6–7 ).'
      cn: 此外此处还应留意，每个人都想听到甜美的歌唱，以及他们从中得到何等甜美的慰藉，实无法言喻，而在那里，则将听到圣天使和蒙拣选者的甜美歌唱。在那座城里，在它的每条街上，他们唱着至甜美的诗歌：「哈利路亚！因为上主，全能的上帝作王了。让我们欢喜快乐，将荣耀归于祂；因为羔羊的婚筵已经来到，祂的妻子也预备好了自己」（启示录 19:6-7）。
  - type: paragraph
    text:
      ru: 'Также видим и слышим здесь, сколь приятно и радостно торжествуют люди над побежденными врагами своими, от которых много напастей и бедствий претерпели. А там избранные Божии будут во веки торжествовать над врагами своими, смертью и адом, петь победную песнь и в радости духа восклицать, «тогда сбудется слово написанное: поглощена смерть победою. Смерть! где твое жало ? ад! где твоя победа? Благодарение Богу, даровавшему нам победу Господом нашим Иисусом Христом» ( 1Кор 15:54–55, 57 )!'
      cn: 我们在此也看见并听闻，人们如何愉快而欢欣地胜过他们被击败的仇敌，这些仇敌曾使他们遭受了许多灾祸和苦难。而在那里，上帝的选民将永远得胜，胜过他们的仇敌，即死亡和阴间，唱着得胜之歌，并在灵的喜乐中呼喊：「那时，经上所写的话就应验了：死亡被胜利吞灭。死亡啊，你的毒钩在哪里？阴间啊，你的胜利在哪里？感谢上帝，祂藉着我们的主耶稣基督，把胜利赐给我们！」 (哥林多前书 15:54-55，57)
  - type: paragraph
    text:
      ru: Ничто так здесь людям не приятно, как согласие, мир и любовь между собой иметь. Бесспорна эта истина у всех, не только у христиан, но и у язычников, все того желают и ищут. Там будет между избранными Божиими совершенный мир, согласие и любовь, потому что все будут совершенно друг друга любить и все одного хотеть, чего один Отец Небесный хочет, и не хотеть, чего Он не хочет. Тогда исполнится совершенно воля Небесного Отца.
      cn: 在世上，没有什么比人们彼此拥有和睦、平安与爱更令人愉悦的了。这个真理是普世公认的，不仅是基督徒，就连异教徒也是如此，所有人都渴望并寻求它。在那里，上帝的选民之间将会有完美的平安、和睦与爱，因为所有人都将完全地彼此相爱，并且所有人都将只渴望天父所渴望的，而不渴望祂不渴望的。那时，天父的旨意将会全然成就。
  - type: paragraph
    text:
      ru: Всякий знает, как ныне радуется человек, отыскав себе друзей честных, постоянных и почтенных, а там будет избранных Божиих дружество со святыми Ангелами. Тогда будет едина церковь , едино стадо Ангелов и людей, и едиными устами и единым сердцем будут хвалить и воспевать Пресвятую Троицу, Бога и Создателя своего. О, любезное и вожделенное дружество, в котором Ангелы с людьми, и люди, как Ангелы, соединятся с Ангелами! Ибо будет незазорное, нелицемерное, истинное и святое дружество.
      cn: 众所周知，现今人找到了忠诚、恒久且可敬的朋友时，是何等欢欣喜悦；而那时，将会有上帝选民与圣天使之间的友谊。那时将有同一的教会，天使与人合为一群，他们将以同一的口、同一的心，赞美并歌颂至圣三位一体，他们的上帝和创造者。哦，多么亲爱而渴慕的友谊啊！在那友谊中，天使与人相连，而人将如同天使般，与天使联合！因为那将是无可指摘、不虚伪、真实而圣洁的友谊。
  - type: paragraph
    text:
      ru: Также, как приятно и любезно людям здесь жить в безопасности, в тишине, никакого страха не бояться, от всех наветов вражьих свободными быть. Там будет совершенная безопасность и тишина, всякий страх там места иметь не будет, потому что всякая вражда и злоба оттуда удалена. Враги и клеветники в своем месте заключены будут, и между теми и этими «утвердится великая пропасть» ( Лк 16:26 ).
      cn: 同样地，正如人们在此地生活在平安与宁静之中，不惧怕任何恐惧，脱离一切仇敌的诡计而得享自由，这是何等令人喜悦和惬意啊！在那里，将有完全的平安与宁静，任何恐惧都将不会有立足之地，因为一切仇恨与恶毒都将从那里被挪去。仇敌和诽谤者将被囚禁在他们自己的地方，在那些人和这些人之间，「必有深渊限定」（路加福音 16:26）。
  - type: paragraph
    text:
      ru: Как здесь утешается всякий славой и честью, кто любит ее, всякому известно, хотя и знает, что она, как цвет, увядает, или, как тень, исчезает, или, как сновидение, отходит, а там будет слава и честь истинная, постоянная, вечная, великолепная, тогда откроются сыновья Божии и явится слава их. «Возлюбленные! мы теперь дети Божии; но еще не открылось, что будем. Знаем только, что, когда откроется, будем подобны Ему» ( 1Ин 3:2 ). Тогда святые Божии, которые Единородному Сыну Божию здесь были сообразны в страдании, сообразны будут и во славе. Поскольку «с Ним страдаем, -» говорит апостол, – «чтобы с Ним и прославиться. Ибо думаю, что нынешние временные страдания ничего не стоят в сравнении с тою славою, которая откроется в нас. Ибо тварь с надеждою ожидает откровения сынов Божиих» ( Рим 8:17–19 ).
      cn: 凡爱慕世俗荣耀和尊贵之人，如何在此世得到慰藉，这是人人都知道的，尽管他们也知道，这荣耀和尊贵如同花朵般枯萎，如同阴影般消逝，如同梦境般逝去。然而，彼处将有真实、恒久、永恒、宏伟的荣耀与尊贵，那时，上帝之子们将显现，他们的荣耀也将显明。「亲爱的弟兄啊，我们现在是上帝的儿女，将来如何，还未显明；但我们知道，祂显现的时候，我们必要像祂。」（1约翰福音 3:2）那时，上帝的圣徒们，凡在此世与上帝的独生子在苦难中肖似祂的，也将在荣耀中肖似祂。使徒说：「我们若与祂一同受苦，也必与祂一同得荣耀。因为我深信，现在所受的苦楚，与将来要向我们显现的荣耀，是不可同日而语的。受造之物切望等候上帝众子的显现。」（罗马书 8:17-19）
  - type: paragraph
    text:
      ru: 'Сколь за великое блаженство почитает человек премудрость. «Блажен человек, который снискал мудрость, и человек, который приобрел разум» ( Притч 3:13 ). Там открываются блаженным все сокровища премудрости Божией, познают ясно Бога с Его Божественными свойствами, и в Боге увидят таинства, ныне сокровенные, ибо разум будет просвещен Божественным светом. Как ныне воздух солнцем, светло и ясно сияющим, просвещается, и чист, ясен, и светел бывает, так тогда души избранных Божиих просветятся светом вечного и незаходимого солнца – Бога, и сами «воссияют, как солнце, в царстве Отца» шс( Мф 13:43 ). Тогда исполнится совершенно пророческое слово: «Во свете Твоем» (Господи!) «узрим свет» ( Пс 35:10 ).'
      cn: 人将智慧视为多么大的福分啊！「福哉寻得智慧之人，和获得悟性之人」（箴言 3:13）。在那里，上帝智慧的一切宝藏都向蒙福之人显明。他们清晰地认识上帝及其神圣属性，并在上帝中看见如今隐匿的奥秘，因为悟性将被神圣之光光照。正如如今空气被光辉明亮地照耀着的太阳所照亮，而变得清澈、明亮、光耀，那时，蒙上帝拣选之人的灵魂将被永恒不落之日——上帝的光所照亮，他们自己「在他们天父的国里，发光如同太阳」（马太福音 13:43）。那时，先知之言将完全应验：「『在祢的光中（上主啊！）我们必得见光』」（诗篇 35:10）。
  - type: paragraph
    text:
      ru: 'За великое почитают люди здесь царю всегда предстоять и смотреть на лицо его, всеми такие ублажаются, а особенно, когда царь будет благочестивый, праведный, милостивый и мудрый. Ибо предстоящие царю и к славе царской приобщаются. Там избранные Божии предстанут Христу, Царю Небесному, и увидят Его в Божественной славе, и во веки веков будут с Ним, как Сам Спаситель о том молил Небесного Отца Своего: «Отче! которых Ты дал Мне, хочу, чтобы там, где Я, и они были со Мною, да видят славу Мою, которую Ты дал Мне» ( Ин 17:24 ). О, как возрадуются тогда люди Божии святые, когда станут пред Царем славы и сами славы Его причастниками будут, ибо «с Ним страдают, чтобы с Ним и прославиться» ( Рим 8:17 ). Того лицом к лицу в божественной Его славе увидят, в Которого ныне не сомневаются и не стыдятся веровать и исповедовать Богом своим, хотя и родился от Девы и как человек на земле пожил, пострадал и умер. И хотя здесь ради Него ныне поношение, бесчестие, гонение и страдание терпят, там ради Него и с Ним, как члены тела с главой, и как меньшая братия и сыновья Божии с Единородным Сыном, прославятся, вознесутся, возвеличатся и увенчаются!..'
      cn: 在此，人们认为常常侍立于君王面前并瞻仰他的面容，是极大的尊荣；这样的人受到所有人的景仰，尤其是当君王是虔敬的、公义的、仁慈的、智慧的时候。因为侍立于君王者，也分享了君王的荣耀。在那里，上帝的选民将侍立于基督——天国君王面前，并将见到祂在神圣的荣耀中，并永永远远与祂同在，正如救主亲自为此恳求祂的天父说：「父啊！祢所赐给我的人，我愿我在哪里，他们也与我同在，好让他们得见祢赐予我的荣耀。」 (约翰福音 17:24)。哦，那时上帝的圣徒将是何等欢欣，当他们侍立于荣耀的君王面前时，并亲身分享祂的荣耀，因为「与祂一同受苦，好与祂一同得荣耀。」 (罗马书 8:17)。他们将面对面地见到祂在祂神圣的荣耀中，祂是他们如今不怀疑也不羞于相信并承认的上帝，尽管祂由童贞女而生，并在地上如同人一样生活过、受苦过、死去。尽管如今在此为祂的缘故忍受羞辱、屈辱、逼迫和苦难，但在那里，为祂的缘故，并与祂一同，如同身体的肢体与头一同，并如同幼弟和上帝的儿子们与独生子一同，将得荣耀、被高举、被尊崇、并被加冕！
  - type: paragraph
    text:
      ru: 'Если, «и не видев, любят Его, и доселе не видя, но веруя в Него, радуются радостью неизреченною и преславною» ( 1Петр 1:8 ), – тогда «в явление славы Его» насколько более «возрадуются и восторжествуют» ( 1Петр 4:13 ). Сколь ненасытно желают люди Бога видеть, люди, сердце которых любовью Его уязвилось, которые с пророком поют Ему: «Как лань с желанием стремится к источникам водным, так желает душа моя к Тебе, Боже. Возжаждала душа моя к Богу крепкому, живому» ( Пс 41:2–3 ). Тогда люди сие святое желание свое утолят и жажду свою прохладят ненасытным лицезрением прелюбезного Божества. «Теперь мы видим» , – говорит апостол Павел, боголюбивая душа, – «как бы сквозь тусклое стекло, гадательно, тогда же лицем к лицу» ( 1Кор 13:12 ). Ныне, «водворяясь в теле, мы устранены от Господа, – ибо мы ходим верою, а не видением» ( 2Кор 5:6–7 ). Тогда увидим Его «лицем к лицу» .'
      cn: 如果，「即使未曾见过祂，却爱祂；如今虽然没有看见，却信祂，就欢喜快乐，是口舌难以形容、极其荣耀的喜乐」（彼得前书 1:8），那么在祂荣耀显现的时候，将何等地欢欣鼓舞，大大得胜（彼得前书 4:13）。人们是何等地不知餍足地渴望看见上帝，那些心被祂的爱所触动的人，他们与先知一同向祂歌唱：「鹿切慕溪水，是那样的渴望；我的心也切慕祢，我的上帝。我的心渴慕永活的上帝。」（诗篇 41:2-3）那时，人们将满足此神圣的愿望，并以不知餍足地凝视至爱的上帝本体，平息他们的渴慕。「我们如今所见的，」使徒保罗，这位敬爱上帝的灵魂，如此说，「仿佛对着模糊的镜子，模糊不清；但那时就要面对面了。」（哥林多前书 13:12）如今，「我们寄居在肉身之内，就与上主疏离——因为我们凭信心行事，而非凭眼见。」（哥林多后书 5:6-7）那时，我们将与祂「面对面」相见。
  - type: paragraph
    text:
      ru: Ныне создание Его видим и от создания Создателя познаем, но Создателя не видим, а тогда самого Создателя «лицем к лицу» увидим. Ныне благодеяниями Его пользуемся, насыщаемся и утешаемся, но Благодетеля не видим, а тогда самого Благодетеля увидим. Ныне слышим святое слово Его, пророками и апостолами Его объявленное, но Глаголавшего не видим, а тогда Самого Его увидим. Ныне дарования Его, как ручьи от источника, на нас щедро изливаются от Него, но Дарователя не видим, а тогда Его увидим и от Него Самого, как источника приснотекущего, черпать будем преизобильно, непрестанно, без сытости и без конца. Ныне посещающего нас и стучащего в двери сердец наших, наказывающего и утешающего, как Отца, опечаливающего и увеселяющего, чувствуем Его, но Его Самого не видим, а тогда само лице Его святейшее, как Отца дети, увидим, и «возрадуется сердце наше, и радости нашей никто не отнимет у нас» ( Ин 16:22 ).
      cn: 如今我们看见祂的创造，并从创造中认识造物主；然而我们看不见造物主，而那时我们必要「面对面」地看见造物主本身。如今我们享用祂的恩惠，得以饱足和慰藉；然而我们看不见施恩者，而那时我们必要看见施恩者本身。如今我们听见祂的圣言，那是由祂的先知和使徒们所宣扬的；然而我们看不见那言说者，而那时我们必要看见祂本身。如今祂的恩赐，如同泉源涌出的溪流，丰盛地从祂那里倾注于我们；然而我们看不见那赐予者，而那时我们必要看见祂，并要从祂本身，这永流的泉源，丰沛、不息、永不厌足、无尽地汲取。如今祂探访我们，叩响我们心门；祂惩戒我们，又安慰我们；如同父亲一般，祂使我们忧伤，又使我们欢喜，我们感受祂；然而我们看不见祂本身，而那时我们必要看见祂至圣的面容本身，如同儿女看见父亲一般，并且「你们的心就喜乐了，这喜乐也没有人能从你们夺去」（约翰福音 16:22）。
  - type: paragraph
    text:
      ru: 'Ныне в молитве, пении, славословии и хвалении стоим пред Ним и молимся Ему, призываем Его, поклоняемся Ему, поем Ему и хвалим Его, но Его Самого, Которому молимся, поклоняемся и поем, не видим, «ибо мы ходим верою, а не видением» ( 2Кор 5:7 ), а тогда Его Самого «лицем к лицу» увидим, и будем видеть во веки и поклоняться, будем петь и хвалить без труда, и видеть без сытости, и «увидим Его, как Он есть» ( 1Ин 3:2 ). Тогда придем и явимся «лицу Божию» ( Пс 41:3 ). Тогда «насытимся, когда явится» нам «слава Его» ( Пс 16:15 ). Тогда исполнится слово изреченное: «Как утешает кого-либо мать его, так утешу Я вас; и увидите это, и возрадуется сердце ваше» ( Ис 66:13–14 ). Тогда «будет Бог все во всем» ( 1Кор 15:28 ).'
      cn: 如今，我们借着祷告、歌颂、颂赞和赞美，站立在祂面前，并向祂祷告、呼求祂、敬拜祂、歌颂祂和赞美祂。然而，我们所祷告、敬拜和歌颂的祂自己，我们却看不见，「因为我们行事为人是凭着信心，不是凭着眼见」（哥林多后书 5:7）。而那时，我们则将「面对面」地看见祂自己，并将永远瞻仰祂、敬拜祂，毫不费力地歌颂和赞美祂，永不满足地瞻仰祂，并「要看见祂本来的样子」（约翰一书 3:2）。那时，我们将来觐「上帝的圣面」（诗篇 41:3）。那时，「当祂的荣耀显现」给我们时，我们「就得饱足」（诗篇 16:15）。那时，所说的话语将要应验：「母亲怎样安慰儿子，我也照样安慰你们；你们看见这事，心中就必快乐」（以赛亚书 66:13-14）。那时，「上帝将在万有中作万有」（哥林多前书 15:28）。
  - type: paragraph
    text:
      ru: Ублажают люди здесь того, кто имеет тело здоровое, легкое, благоцветущее, красивое и прочими естественными дарованиями украшенное, а тогда в избранных Божиих будут телеса нетленные, здоровые, благоцветущие, красивые, славные, легкие, духовные, светлые и бессмертные. Ибо «сеется в тлении, восстает в нетлении; сеется в уничижении, восстает в славе; сеется в немощи, восстает в силе; сеется тело душевное, восстает тело духовное» ( 1Кор 15:42–44 ).
      cn: 人们在此称福那些拥有健康、轻盈、容光焕发、美丽的身体，并被其他天赋恩赐所装饰的人；而那时，在上帝的选民中，身体将是不朽坏的、健康的、容光焕发、美丽的、荣耀的、轻盈的、属灵的、光明的且是不朽的。因为，『所撒下的是必朽坏的，复活的是不朽坏的；所撒下的是羞辱的，复活的是荣耀的；所撒下的是软弱的，复活的是强壮的；所撒下的是属血气的身体，复活的是属灵的身体。』（哥林多前书 15:42-44）
  - type: paragraph
    text:
      ru: О, прекрасная и вожделенная весна, которая такие прорастит цветы на земле новой! Ибо «мы, по обетованию Его, ожидаем нового неба и новой земли, на которых обитает правда» ( 2Петр 3:13 ). Не будет тогда ни старых, ни немощных, ни прокаженных, ни расслабленных, ни слепых, ни хромых, ни печальных, ни унылых, но все в благоцветущем и совершенном здравии будут, и будут во веки.
      cn: 哦，美丽而令人渴慕的春天啊，它将在新地上长出如此的花朵！因为「我们照祂的应许，盼望新天新地，有义居在其中。」（彼得后书 3:13）那时将没有年老的，没有软弱的，没有麻风病人，没有瘫痪的，没有瞎眼的，没有瘸腿的，没有悲伤的，没有沮丧的，所有人都将处于繁盛而完美的健康中，并且直到永远。
  - type: paragraph
    text:
      ru: К блаженству избранных Божиих и то присовокупится, что они так уверены будут в непрестанном и вечном своем блаженстве, как уверены будут, что Бог, с Которым будут и Которого видеть будут, есть вечный и бесконечный и царствию Его не будет конца, и сами не захотят того лишиться, что получили. Сам рассуди, какая радость, веселье и восклицание будет в сердцах их, когда в таком блаженстве будут, какого язык сказать, и ум вообразить, и сердце понять, и глаз видеть, и ухо слышать здесь не может, – и будут в том блаженстве вовеки без конца. Утешатся избранные Божии блаженством небесным, но еще и еще будут утешаться тем, что оно без конца и без конца его иметь будут. Без конца видеть Бога будут, без конца во славе будут, без конца, как солнце, в царствии Отца их сиять будут, без конца в радости и веселье несказанном и непрестанном будут.
      cn: 上帝选民的至福，还将增添此点：他们将如此确信自己永不停息、永恒的福乐，正如他们将确信，他们将与祂同在并瞻仰的上帝，是永恒无限的，祂的国度永无穷尽，而他们自己也绝不愿失去所领受的一切。你自己想想看，当他们处于那种此世的舌头无法言说，心智无法想象，心灵无法领悟，眼睛无法看见，耳朵无法听闻的福乐之中时，他们心中将是何等的欢欣、喜乐和欢呼——他们将永远无尽地处于这福乐之中。上帝的选民将因天上的福乐而得慰藉，但他们还将不断地、反复地因这福乐永无穷尽，且他们将永远无尽地拥有它而得慰藉。他们将永远无尽地瞻仰上帝，永远无尽地处于荣耀之中，永远无尽地在他们天父的国度里如同太阳般闪耀，永远无尽地处于无法言喻、永不停息的欢欣与喜乐之中。
  - type: paragraph
    text:
      ru: 'Итак, видишь тень, видишь и истину, познавай же от тени истину. Тень – временное, а истина – вечное блаженство. Оставь тень и держись за истину, дабы постигнуть истину. Помни Спасителево слово: «Много званных, но мало избранных» ( Мф 20:16 ). Мы благодатью Божией позваны к вечной жизни, постараемся же не только между званными, но и между избранными быть. Помышляй об этом прилежно и часто, и станет мерзким для тебя мир со своими прелестями и похотями.'
      cn: 那么，你看见影，也看见真理，就从影中认识真理吧。影是暂时的，而真理是永恒的福祉。舍弃影，紧持真理，以便领悟真理。要记住救主的话：「蒙召的人多，蒙拣选的人少」（马太福音 20:16）。我们藉着上帝的恩典蒙召进入永生，那么，我们当力求不仅在蒙召者之中，更在蒙拣选者之中。当勤勉而时常地思念此事，世界及其诱惑与情欲就会变得令你厌恶。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Ты пишешь: «Что же мне делать, когда дается богатство, честь и слава?» Правильный твой запрос этот. Ибо многие ищут этих мирских сокровищ, но не обретают, а многие обретают, но во зло употребляют, и так не на пользу, но на вред свой ищут и обретают. А иные не ищут, но даются им. Им нужно узнать на примере, как их употреблять. Поэтому я вкратце отвечаю тебе. И, во-первых, отсылаю тебя к письмам, написанным тебе ранее: ты учись из них, каковы сокровища эти.'
      cn: 你写道：「那么，当财富、尊荣和荣耀临到我时，我该怎么做呢？」你的这个询问是正确的。因为许多人寻求这些世俗的宝藏却未能获得；而许多人获得了，却滥用它们。因此，他们寻求和获得它们，非但无益，反而有害于自身。而另一些人并不寻求，它们却被赐予了他们。他们需要借由实例来了解如何使用它们。因此，我简要地回答你。首先，我将你引向那些先前写给你的信件：你要从中学习，这些宝藏究竟是什么。
  - type: paragraph
    text:
      ru: 'Во-вторых, рассуждай о себе и познавай, что ты есть и каково твое достоинство. Пророк святой поет, или скорее плачет, о человеке: «Человек, будучи в чести, не уразумел (сего), сравнялся с несмысленными скотами и уподобился им» ( Пс 48:13 ). Был в чести, почтен Богом человек, но не уразумел чести своей и потому уподобился «несмысленным скотам» . Недоволен был тем, что образом Божиим почтен, но захотел Богом быть, чему быть было невозможно, поэтому и то потерял, что имел, и сыскал то, чего не хотел; потерял красоту образа Божия и сделался безобразным и несмысленным, как животное. Рассуждай об этом прилежно и тогда будешь правильно рассуждать о богатстве, чести и славе подаваемой.'
      cn: 其次，你要省察自己，并认识你是何等样的人，以及你的尊严何在。圣先知为人吟唱，或者更不如说，为人悲叹：「人居尊位而不省察，竟与无知之牲畜相似，与它们毫无二致。」（诗篇 48:13）人曾居尊位，为上帝所尊荣，却不省察自己的尊荣，因此与「无知之牲畜」相似。他不满足于以上帝的肖像受尊荣，却渴望成为上帝，这本不可能成就；因此，他失去他所拥有的，并招致他所不愿的；他失去了上帝肖像的美善，变得丑陋而无知，如同动物一般。殷勤地省察这些，如此你便能正确地省察所赐予的财富、尊荣与荣耀。
  - type: paragraph
    text:
      ru: 'Чего достоин человек, если скоту уподобился, разве что того же, что и скот твой? Достоин ли богатства, чести и славы тот, который жить на земле и ломтя хлеба недостоин, как я тебе некогда писал... Что же сказать о таком, который, будучи Крещением омыт и освящен, опять испоганил себя и скотскими нравами осквернил? С таковым «случается по верной пословице: пес возвращается на свою блевотину, и вымытая свинья идет валяться в грязи» ( 2Петр 2:22 ). Рассуждай об этом и о себе и тогда увидишь, что есть богатство, честь и слава для нас.'
      cn: 人若类同牲畜，配得什么呢？难道只配得与你的牲畜相同之物吗？那不配在世上存活，连一片面包也不配得的人，又岂能配得财富、尊荣与荣耀呢？正如我曾写信告诉你的……那么，对于那些藉着圣洗礼得蒙洁净与成圣，却又再次使自己蒙受玷污，并以牲畜般的品性污秽了自己的人，该说些什么呢？这样的人，「正应验了那句真实的谚语：狗回转过来吃它所吐的，洗净的猪又回到泥里去打滚。」（彼得后书 2:22）思量此事，也思量你自己，那时你便会明白，对我们而言，何谓财富、尊荣与荣耀。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Дивишься ты тому, что я тебе написал. Поверь, друг, что все это истинно: те, которые ныне недостоинства своего не познают и не признают, тогда его познают, когда вместо богатства, чести и славы временных, которых себя достойными быть вменяли, будут в вечной нищете, бесчестии и бесславии. Тогда познают, что как недостойны всего того были, так и недостойно искали. Совесть их покажет им, каково их достоинство. Тогда откроется им величество Божие, которое они прогневляли, и собственная их подлость и ничтожество, которого не хотели познавать и признавать. Увидят, как грех человека недостойным, подлым, бедным, окаянным и уничиженным делает. Ибо всякий грех величество Божие оскорбляет. А то, что Бог подает нам блага Свои, так это потому, что благ, подает по одной Своей благости и милости, даром и без всякой нашей заслуги. А наше достоинство не иного чего достойно, как временной и вечной казни. Возьми это в правильное и верное рассуждение, и тогда увидишь истину, и от сердца признаешь.'
      cn: 你对我所写的一切感到惊奇。我的朋友，请相信，这一切都是真实的：那些现今不认识也不承认自己不配的人，那时就会认识到自己的不配，当他们不再拥有他们自以为配得的暂时的财富、尊荣和荣耀，却将身处永远的贫困、羞辱和不光彩之中。那时他们会认识到，他们当初是何等不配这一切，而他们所追求的也又是何等不配。他们的良心会向他们显明，他们真正的光景如何。那时，他们将会看到他们所触犯的上帝的威严，以及他们自己不愿认识和承认的卑劣和渺小。他们将看到，罪是如何使人变得不配、卑劣、贫乏、可悲和受贬抑的。因为一切罪过都冒犯了上帝的威严。而上帝赐予我们祂的美善，乃是因为祂是良善的，祂完全是出于祂自己的美善与慈悲，白白地赐予，丝毫不凭我们的功劳。而我们所配得的，唯有暂时的和永远的刑罚。请将此置于正确而真实的思考之中，那时你就会看到真理，并从心里承认它。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Ныне тебе по порядку на тот же вопрос отвечаю.
      cn: 如今我按顺序给你回答同一个问题。
  - type: paragraph
    text:
      ru: 'Первое. Когда подается тебе богатство, то поступай следующим образом:'
      cn: 第一。当财富赐予你时，就当如此行：
  - type: paragraph
    text:
      ru: 1) Благодари Бога, Который подает тебе, недостойному.
      cn: 感谢上帝，祂赐予你，这不配之人。
  - type: paragraph
    text:
      ru: '2) Не прилагай к нему сердца твоего, по увещанию пророка: «если богатство притекает, не прилагайте (к нему) сердца» ( Пс 61:11 ), но к Богу единому прилепляйся и люби, с пророком говоря: «Мне же прилепляться к Богу благо есть» (Посл. ко Св. Причащению). Ибо должно любить Благодетеля, а не благодеяние, и Подателя, а не дарование, и Создателя, а не создание.'
      cn: 2) 不要将你的心系于其上，依照先知的忠告：「若财宝增加，不要将心系于其上」（诗篇 61:11），却要惟独依附和爱上帝，与先知一同说：「于我，亲近上帝乃是美善」（领圣体后祷文）。因为当爱施恩者，而非其恩典，爱赐予者，而非其赐予，爱造物主，而非其所造之物。
  - type: paragraph
    text:
      ru: '2) Употребляй богатство не на прихоти мирские и плотские, не на богатые трапезы, дома, кареты, сосуды, одеяния и прочее, как обычай есть у миролюбцев и плотоугодников, но со страхом и смирением, как не свое, но Божие добро, умеренно и воздержано, на нужды, а не на угождение плоти. Помни, что за расход его ответ Богу отдашь: распорядитель ты, а не хозяин; раб, а не господин. Ибо один только Господь есть Господь имений наших, как и всего мира, пред Ним следует нам явиться и ответ за все отдать.'
      cn: 2) 使用财富，不要用于世俗和肉体的奢欲，不要用于丰盛的筵席、房屋、马车、器皿、衣裳等等，如同那些爱慕世俗与贪恋肉体之人的习惯一样；但要带着敬畏和谦卑，视其为不属于你，而是属于上帝的产业，节制并有所克制，用于需要，而非满足肉体。记住，你将为它的花费向上帝交账：你是管家，而非主人；你是仆人，而非主。因为唯有上主才是我们产业的主，也是整个世界的主；我们当在祂面前显现并为一切交账。
  - type: paragraph
    text:
      ru: 4) Снабжай нищих, убогих, храмы святые и служащих в них, училища, богадельни. Дается тебе богатство, чтобы и ты давал. Бог дает его, отдавай и ты Божие во славу Божию. Будь как рука, которая принимает и отдает. Будь строителем, а не хранителем или расточителем богатства.
      cn: 4) 供应贫穷人、困苦人、圣殿及其中的服事者、学校、济贫院。财富赐予你，好让你也能施与。上帝赐予它，你也要为着上帝的荣耀施与上帝之物。要像一只手，既接受也施与。要做一个建造者，而不是一个财富的保管者或挥霍者。
  - type: paragraph
    text:
      ru: 5) Не гордись, не возносись богатством, поскольку не твое, на время оно тебе дано, на твою и ближнего пользу, и со временем отойдет от тебя. Помни, что ты нищ и убог, как и прочие люди. Ибо все нагими рождаемся в мир, нагими и отходим от мира.
      cn: 5) 不要因财富而骄傲自满，不要因此而自高，因为它不属于你，乃是暂时赐予你的，为要使你和你的近人得益，并且随着时间它将离你而去。谨记，你与其他人一样，是贫乏而卑微的。因为我们都赤身来到这世上，也要赤身离开这世界。
  - type: paragraph
    text:
      ru: 'Второе: когда честь и сан дается тебе, внимай себе:'
      cn: 第二，当尊荣和职分赐予你时，要谨慎自守：
  - type: paragraph
    text:
      ru: '1) Сан или честь христианину есть иго наложенное, которое должно носить во славу имени Божия и пользу ближнего. Надобно разумным и мудрым быть тому, кто хочет людьми управлять, и лучшим по сравнению с другими быть, чтобы многим пример доброго жития собою представлять, ибо все это от сановитого требуется. Овца овец не пасет, но человек, разумом одаренный, и тьма тьму не просвещает, но свет, и слепец слепца не ведет, но видящий. Несмышленый и неисправный человек, принимающий начальство, подобен бесноватому, взявшему нож, которым и себя и других уязвляет и закалывает. С таким случается по истинной притче: «слепой» , когда «ведет слепого, то оба упадут в яму» ( Лк 6:39 ). Итак, надобно научиться прежде собой управлять, а потом других в управление принимать. Рассуждай об этом.'
      cn: 品级或尊荣，对基督徒而言，乃是加诸的轭，理当为着上帝圣名的荣耀和邻人的益处而肩负。凡欲管理人者，理当明智且有智慧，并需超越众人，以身作则，为众人树立良善生活之典范；因这一切皆是身负圣职者所当具备的。绵羊不牧放绵羊，唯有被赋予理智的人方能如此；黑暗不照亮黑暗，唯有光明方能如此；瞎子不引导瞎子，唯有能看见者方能如此。无知且品行不端之人，若接受权柄，如同一个手持利刃的被附者，他用此刃伤害并屠戮自己与他人。此等人，正如那真实的箴言所言：「瞎子若引导瞎子，两人都必跌入坑里。」（路加福音 6:39）。因此，理当首先学会管理自己，然后才能接受管理他人之责。思量此事。
  - type: paragraph
    text:
      ru: 2) Если тебе необходимо быть на почетной должности, то в ней ищи Божией чести, а не своей, и ближних твоих пользы, а не своей корысти. Будь слугой рабам Божиим, а не господином, ищи их пользы, а не господствуй над ними, искореняй неправду и насаждай правду. Что приказываешь им, то сам прежде исполняй.
      cn: 2) 如果你必须担任尊贵的职位，那么在其中当寻求上帝的荣耀，而非你自己的荣耀；以及你邻人的益处，而非你自己的私利。当成为上帝众仆人的仆人，而非他们的主人；寻求他们的益处，而非辖制他们；根除不义，并栽植公义。你命令他们的，你自己要先行实践。
  - type: paragraph
    text:
      ru: К наказанию, когда оно нужно, или словом, или делом приступай, как благоразумные лекари к лечению, которые или жилу секут, или член какой отсекают, или лекарство дают ради того, чтобы человека излечить, а не замучить. Наказывай и ты подчиненного, а не гнев и ярость свою совершай. Наказывая, сожалей о нем, как о подобной тебе плоти, а не гневайся на него, и Божию честь, а не свою защищай, и его пользу смотри, а не за свою обиду мсти, но притом всегда внутри себя думай и помни, что ничем ты не лучше того, которого наказываешь словом или делом. Ибо все мы люди, всяким немощам и грехам подлежим, или падаем, или спотыкаемся, и всегда будем падать, если рука Божия не удержит нас.
      cn: 当需要惩罚时，以言语或行动施行惩罚，要像明智的医生治病一样，他们或切开血管，或截去肢体，或给予药物，都是为了治愈病人，而非折磨他。你也要惩罚下属，而不是发泄自己的愤怒和狂暴。惩罚时，要怜悯他，视他为与你相似的血肉之躯，而不要对他发怒；要维护上帝的尊荣，而非你自己的；要顾及他的益处，而非报复自己的冒犯；但同时，你心里要常常思想并记住，你并不比你以言语或行动惩罚的那个人强半分。因为我们都是人，易受各种软弱和罪的侵扰，或跌倒，或失足，若非上帝之手扶持我们，我们总会跌倒。
  - type: paragraph
    text:
      ru: '3) Всегда памятуй, что тебе следует ответ дать Судии и Царю Христу о тебе самом и о подчиненных тебе, как ты сам жил и с ними поступал. Все христиане истязаны будут в день суда, но начальники особенно, ибо не только о себе, но и о подчиненных своих воздадут ответ, по Писанию: «строг суд над начальствующими, ибо меньший заслуживает помилование, а сильные» (начальники) «сильно будут истязаны» ( Прем 6:5–6 ). Рассуждай об этом и сохранишься в страхе Божием и смирении.'
      cn: 3) 时刻铭记，你必要向审判者和君王基督交账，论及你自己以及你所管辖的人，就是你如何生活，又如何对待他们。所有基督徒在审判之日都将受严厉查问，但作首领的尤其如此，因为他们不仅为自己，也要为他们所管辖的人交账。依照圣经所言：「严厉的审判临到作首领的，因为卑微的人配得怜悯，而有权势的」（首领）「必被严厉查问」（智慧篇 6:5-6）。思想这些，你就能保守自己在敬畏上帝和谦卑之中。
  - type: paragraph
    text:
      ru: 4) Честь твоя пускай смиряет тебя более, а не возвышает, как со многими случается, так как ты такой же человек, как и подчиненные твои, а может быть, что многие и лучше тебя, как и бывает, но тебя рука Вышнего поставила над ними. Сходи часто умом ко гробам умерших, и они научат тебя, что ты такой же человек, как и подчиненные твои. Там увидишь, что все люди, начальники и подчиненные, равны, и где лежит раб, где господин его, где властелин, и где подвластный, узнать невозможно. Все в равном нетлении. А если там равны, то и здесь на земле живущие все равны. Те же люди, без душ, там лежат, которые по земли ходили. Помни об этом и смирен будешь, и благодать Божия поможет тебе. Ибо «смиренным дается благодать» ( 1Петр 5:5 ).
      cn: 你的尊荣更应使你谦卑，而非高举你，如同许多人身上所发生的那样。因为你和你的下属一样，都不过是人，甚至可能许多人比你更优秀，这乃是常事；只是至高者的手将你安置在他们之上。你的心思当常到死者的墓地去，他们会教导你：你和你的下属一样，都不过是人。在那里你会看到，所有的人，无论是首领还是下属，都是平等的；无从分辨仆人安卧何处，其主又卧何处；统治者安卧何处，被统治者又卧何处。一切都同样在朽坏之中。若是那里都平等，那么在此地上活着的人也都平等。那些曾在地上行走的人，如今灵魂已逝，安卧于彼。记住这一点，你就会谦卑，上帝的恩典也会帮助你。因为「上帝赐恩给谦卑的人」（1伯多禄 5:5）。
  - type: paragraph
    text:
      ru: 5) Когда так на почетной должности будешь поступать, то честь твоя большую на небесах исходатайствует честь.
      cn: 5) 当你在尊贵的职分上如此行事为人时，则你的尊荣将在天上为你求得更大的尊荣。
  - type: paragraph
    text:
      ru: 'Третье: Когда тебя люди славят и хвалят, то делай следующее:'
      cn: 第三：当人们荣耀你并赞美你时，则做以下事情：
  - type: paragraph
    text:
      ru: 1) Помышляй, что ты того недостоин, будучи грешником. «Никто не благ, как только один Бог» ( Мф 19:17 ), по словам Спасителя нашего, Который один всякой похвалы и славы достоин.
      cn: 要默想你对此不配，因你是罪人。「无人是良善的，除了独一的上帝」（马太福音 19:17），按我们救主的话说，唯独祂配得一切的赞美与荣耀。
  - type: paragraph
    text:
      ru: 2) Вменяй славу и похвалу как ветер, который приходит и отходит, ибо люди часто того, которого ныне хвалят и славят, после хулят и ругают. Видишь, что людская слава суетна и, как дым, исчезает. Будь же подобен мертвому, который ни хулению, ни хвалению не внимает; подобен дереву, которое плоды подает, но молчит; подобен кладезю, который источает воду, и от хуления не оскудевает, и от похвалы не изобилует.
      cn: 2) 将荣耀与赞美视作来去之风，因为人们常常会诋毁和咒骂他们现在所赞美和颂扬的人。可见人的荣耀是虚妄的，如同烟雾般消散。那么就当像死人，对毁谤和赞美都不为所动；当像一棵树，它结出果实，却默不作声；当像一口泉，不断涌出泉水，它不因毁谤而枯竭，也不因赞美而满溢。
  - type: paragraph
    text:
      ru: '3) Что похвальное делаешь, то все приписывай Богу единому, Который «производит в» нас «и хотение и действие» доброе ( Флп 2:13 ), потому что «без Него не можем делать ничего» ( Ин 15:5 ). Тому одному пусть будет похвала и слава, от Которого все доброе происходит. Пусть будет всегда в памяти и устах наших слово Псаломника: «Не нам, Господи, не нам, но имени Твоему дай славу, по милости Твоей и истине Твоей» ( Пс 113:9 ).'
      cn: 3) 凡你所行值得称赞的，都要归功于独一的上帝，是那「在我们里面运行，使我们又愿意又实行」善事的（腓立比书 2:13），因为「离了祂，我们什么都不能做」（约翰福音 15:5）。唯愿赞美和荣耀归于那一位，诸善皆源于祂。愿诗篇作者的话常存我们心间口中：「上主啊，不要归于我们，不要归于我们，乃要归于祢的名，因祢的慈爱和祢的真实」（诗篇 113:9）。
  - type: paragraph
    text:
      ru: 4) Ищи славы на небесах, которую обещал Бог любящим Его. Та слава – истинная, и однажды найденная, никогда не отходит.
      cn: 4) 寻求在天上上帝所应许爱祂之人的荣耀。那荣耀是真实的，一旦寻得，永不离去。
  - type: paragraph
    text:
      ru: Вот тебе мой ответ о богатстве, чести и славе, подаваемой человеку. Ты рассуждай об этом и не сообразуйся сынам века сего, которые о том все тщание полагают, чтобы здесь обогатиться и прославиться. У таковых ни малейшей искры христианства нет, хотя и христианами называются. У истинных христиан все замыслы, усердие, начинания и попечения о вечной жизни. Они там себе наследия, богатства, чести и славы ожидают, как путники, странники и пришельцы в мире этом. Ибо там их и отечество, о котором воздыхают, и ум и сердце и желание свое к нему возводят.
      cn: 这是我给你关于赐予人的财富、尊荣和荣耀的答复。你要对此加以思量，不要效法这世代之子，他们倾尽所有心力，只为在此地致富并得荣耀。这样的人丝毫没有基督信仰的火花，尽管他们自称是基督徒。真正的基督徒，他们所有的意念、热忱、所行之事和关怀，都关乎永恒的生命。他们在那里为自己期盼产业、财富、尊荣和荣耀，如同这世上的行路人、异乡人和寄居者。因为那里也是他们的家乡，他们为此而向往，并将自己的心智、心和愿望都归向它。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Вкратце прими, что выше пространнее написал я.
      cn: 简而言之，请领受我以上详尽所写的。
  - type: paragraph
    text:
      ru: '1) Всякий человек пребывает между Богом и между миром, между временем и вечностью, как между небом и землей. Когда к миру обращается и любит мир, то от Бога отвращается и не любит Его. Ибо написал апостол: «Кто любит мир, в том нет любви Отчей» ( 1Ин 2:15 ). Когда о времени помышляет, то о вечности забывает, и когда о временном печется, то о вечном нерадит, подобно тому, как когда к земле лицо и очи обращает, то от неба отвращает.'
      cn: 每个人都处于上帝与世界之间，时间与永恒之间，如同在天与地之间。当他转向世界并爱世界时，他就转离上帝，不爱祂。因为使徒写道：「人若爱世界，爱父的心就不在他里面了」（约翰一书 2:15）。当他思念时间时，他就遗忘永恒；当他为属世之事忧虑时，他就忽略永恒之事。这如同他将脸和眼睛转向大地时，就转离了天。
  - type: paragraph
    text:
      ru: 2) Всякий человек, в мире этом живущий – путник, странник и пришелец. Ибо в мир этот не ради мира сего рождается, не ради чести, славы, богатства и прочего угождения плоти – иначе бы всегда в мире этом пребывать должен был бы – но в мир этот входит, как на путь восходит, по которому идет на тот век. Путь этот начинает в рождении и кончает в смерти.
      cn: 2) 凡活在这世上的人，都是行路人、寄居者和客旅。因为人降生于世，并非为着这世界，并非为着尊荣、荣耀、财富，以及其他一切肉体的享乐——否则，人就当永远留在这世上——而是进入这世界，仿佛踏上了一条道路，沿着它走向来世。这条道路始于出生，终于死亡。
  - type: paragraph
    text:
      ru: 3) Все люди, живущие по лицу всей земли, идут к вечности и, окончив путь жизни этой, вселяются в вечность, но одни только благочестивые христиане, не любящие мира и крестным путем идущие, как учит Евангелие, достигают блаженной вечности.
      cn: 3) 所有活在世上的人，都走向永恒，并在结束今生之路后，都迁入永恒；但唯有虔诚的基督徒，不爱世俗，并走十字架道路，正如福音所教导的，才能达到蒙福的永恒。
  - type: paragraph
    text:
      ru: 'Христос Господь наш говорит: «Какая польза человеку, если он приобретет весь мир, а душе своей повредит» ( Мф 16:26 )? Если мир весь ничто по сравнению со спасением души, то тем более некое богатство, некая честь, и некая слава, ведь и временную жизнь мы почитаем более всего мира. Ибо кто, разве что безумный, восхочет над всем миром царствовать один день, а на другой день жизни лишиться? Всякий избирает лучше жить, нежели все сокровища мира получить и тотчас умереть. Какая польза и от сокровища без жизни? Итак, если временную жизнь почитаем более всего мира, насколько более вечную жизнь почитать должно, которая, однажды обретенная, никогда не потеряется и, однажды потерянная, никогда не отыщется.'
      cn: 我们的主基督说：「人若赚得全世界，却赔上自己的灵魂，有什么益处呢？」(马太福音 16:26) 如果整个世界与灵魂的救赎相比，都算不得什么，那么某种财富、某种尊荣和某种荣耀，就更不必说了，因为我们甚至看重暂时的生命胜过整个世界。因为除了疯子，谁会愿意在全世界作王一日，而在次日就丧失生命呢？人人都宁愿活着，也不愿获得世上所有财宝而立刻死去。没有生命的财宝，又有何益处呢？所以，既然我们看重暂时的生命胜过整个世界，那么更应该看重永恒的生命，因为这生命一旦获得，就永不失去；一旦失去，就永不再寻得。
  - type: paragraph
    text:
      ru: О, вечная жизнь, как ты дорога, и мало кто ищет тебя! Как сладка, и мало кто любит тебя! Мир, как горек, и почти все любят его! Что бы было, если бы был сладок?.. Непременно бы в нем, как в раю, все вовеки пожелали жить.
      cn: '哦，永生，祢是何等宝贵，却鲜有人寻求祢！

        祢是何等甘甜，却鲜有人爱慕祢！

        世界，它是何等苦涩，却几乎所有人都爱它！

        如果它是甘甜的呢？那么，世人必定会永远渴望居住其中，如同在乐园中一般。'
  - type: paragraph
    text:
      ru: 'Но человек ради небесного, а не ради земного отечества создан Создателем своим, как образ и подобие Божие, и из-за греха его лишился, и в мир этот, на землю, как в ссылку, послан. Христовой же благодатью опять к отечеству небесному призывается, и возрождается, и обновляется. Однако же Спаситель наш объявляет нам: «Много званных, мало же избранных» .'
      cn: 然而人，作为上帝的肖像与样式，是由他的造物主所创造，是为着天上的家乡，而非为着地上的家乡；他却因着罪而失去了它，并被遣送到这世界，被发配到地上，如同流放一般。然而借着基督的恩典，他又被召回到天上的家乡，并蒙受重生，并得以更新。然而我们的救主向我们宣告说：「蒙召者众，被选者寡。」
  - type: paragraph
    text:
      ru: Почти всякий видимым утешается, или даже прельщается. Чувства отводят ум и сердце от невидимого и влекут к видимому, так помрачают ум и угашают веру, которая есть око души, невидимое видящее и желание невидимых благ в душе воспламеняющее. Постараемся, любезный, благодатью Божией не только между званными, но и между избранными быть.
      cn: 几乎每个人都为可见之物所慰藉，甚至为之迷惑。感官引开人的心智和心灵，使其远离不可见之物，并将其牵引向可见之物，如此蒙蔽心智，熄灭信心。这信心是灵魂的眼睛，能看见不可见之物，并在灵魂中点燃对不可见之善的渴望。亲爱的，让我们努力，借着上帝的恩典，不仅成为蒙召者，而且成为被拣选者。
  - type: paragraph
    text:
      ru: 5) Душе человеческой, как произошла от Бога, так и возвратиться к Богу должно нагой и неоскверненной любовью мира сего. Рассуждай об этом.
      cn: 5) 人的灵魂，正如它源于上帝，也当赤裸、未受这世俗之爱玷污地回到上帝那里。思量此理。
  - type: paragraph
    text:
      ru: 6) Если ныне не хочешь мира оставить, то тогда ли мир оставлять думаешь, когда Бог тебя от мира позовет на ответ и на суд к Себе, когда и нехотя принужден будешь оставить его? Лучше же заранее оставить его, чтобы свободным от него отойти и с надеждой доброй, тогда вместо временного богатства – вечное от Бога воспримешь, вместо временной славы – вечную, вместо временной чести – вечную, вместо временной – вечную сладость и радость.
      cn: 6) 如果你现在不愿舍弃世界，那你打算何时舍弃呢？难道要等到上帝从世界召叫你到祂那里去接受答辩和审判时，那时你即便不愿也必被迫舍弃它吗？最好是预先舍弃它，好能自由地摆脱它而去，并怀着美好的希望。届时你将从上帝那里领受永恒的财富，而非短暂的；永恒的荣耀，而非短暂的；永恒的尊荣，而非短暂的；以及永恒的甘甜和喜乐，而非短暂的。
  - type: paragraph
    text:
      ru: '7) Думай и помни, что сегодня или завтра умрешь, как и бывает с людьми, и на суд Божий призовешься, и от суда Божия следует всякому идти или в муку вечную или в жизнь вечную, как учит Слово Божие: «И пойдут сии» (грешники) «в муку вечную, а праведники в жизнь вечную» ( Мф 25:46 ). Тогда воистину не захочешь ни чести, ни славы, ни богатства, ни угождения плоти в мире искать. Ибо какая польза тебе от них, если или сегодня, или завтра оставишь их и нехотя?'
      cn: 7) 思想并谨记，你今日或明日将会死去，正如人所必经的，并将被召至上帝的审判台前。且按照上帝的审判，每个人都将走向或永恒的苦痛，或永恒的生命，正如上帝的圣言所教导的：「这些人」（罪人）「要往永刑里去，那些义人要往永生里去」（马太福音 25:46）。届时，你必将真切地不想在世上寻求尊荣、浮名、财富，以及肉体的享乐。因为它们对你有什么益处呢？倘若你今日或明日就将不情愿地撇弃它们？
  - type: paragraph
    text:
      ru: 'Кто при смерти желает обогащаться, в чести быть и славиться? Спроси у больных, находящихся при смерти: что они думают? Тогда они правильно обо всех мирских вещах рассуждают, признают от сердца, что все – суета. Ты теперь делай это, признавай истину сию, и как за дымом не гоняешься, так и не будешь гоняться за суетой. Тогда, истину говорю, мерзким станет все это для тебя: всякое почитание, слава, похвала, украшение домов, карет, коней, одеяний, банкеты, пиршества, трапезы, разлияние вин. На золото, серебро, камни дорогие – будешь смотреть как и на пыль земную, и подлинно: они из земли взяты и потому то же, что земля. Одно только на уме твоем будет, как бы тебе неготовым на тот век не отойти, как бы греховное бремя здесь сложить и чистым отсюда отойти. Тогда у тебя родится истинное покаяние, воздыхание, усердие, молитва и изменение всего внутреннего состояния. Ибо страх будущего суда, как огонь смрад, всякую нечистоту сердечную очищает и приготовляет к восприятию истинного евангельского утешения.'
      cn: 谁在临终之际还渴望致富、享有尊荣、并得荣耀呢？你去问问那些濒死之人：他们在想些什么？那时他们便能正确地看待世上万物，由衷地承认一切都是虚空。你现在就去这样做，承认这真理，就如同你不追逐烟雾一样，你也不会追逐虚空。那时，我实实在在地告诉你，这一切在你看来都将变得可憎：一切的尊敬、荣耀、赞美、房屋的装饰、马车、马匹、衣裳、宴会、筵席、膳食、倾倒的美酒。对于黄金、白银、珍贵的宝石，你会视之如同地上的尘土，确实如此：它们取自大地，所以与泥土无异。你心中唯一所想的将是，如何才能不至尚未预备就进入来世，如何才能在此处卸下罪孽的重担，并洁净地离开此地。那时你心中将生出真正的忏悔、叹息、热忱、祷告以及整个内在状态的转变。因为对未来审判的恐惧，如同烈火焚去恶秽，洁净了心中一切的不洁，并预备人心领受真正的福音慰藉。
  - type: paragraph
    text:
      ru: 8) Крепко держи в уме твоем, что когда по Слову Божию не ищешь здесь временного богатства, чести, славы, угождения плоти, но только вечного сокровища желаешь и ищешь, то оно тебе на небесах, по обещанию Его, отверзнется, и тогда отойдет от тебя любовь и желание временного. Желай и ищи истинно вечных благ – и временных не пожелаешь. Ибо кто, видя, что ему обещана высокая царская честь, ищет низкого и сомнительного тепленького местечка? Кто будет просить медной монеты, видя, что ему предлагают сокровище из золота и серебра? Кто гоняется за славой и похвалой низкой черни, надеясь быть прославленным и похваленным самодержцем? Кто хватается за тень, видя саму истину? Так, кто будет искать временных сокровищ, которые, как тень, исчезают, видя вечные сокровища, уготованные для ищущих их?
      cn: 8) 牢记于心，当你依照上帝的圣言，在此不寻求属世的财富、尊荣、荣耀、肉体的满足，却只愿望并寻求永恒的宝藏时，它就必照祂的应许，在天上向你敞开，那时，你对属世之物的爱慕和渴望就会离开你。愿望并寻求真正永恒的福祉——你便不会再愿望属世之物。因为，谁会看见自己已蒙应许得享至高的王室尊荣，还会去寻求卑微而可疑的安逸小职位呢？谁会去乞求铜币，当他看见有人向他提供金银财宝时？谁会追逐卑贱平民的荣耀和赞许，当他有望蒙受君王的颂扬和称赞时？谁会抓住影子，当他看见真理本身时？如此，谁会寻求属世的宝藏，它们如影消逝，当他看见为寻求它们之人所预备的永恒宝藏时？
  - type: paragraph
    text:
      ru: 9) Велики и непостижимы сокровища вечные, которые Сам «Бог приготовил. -» Кому? – «Любящим Его» ( 1Кор 2:9 ). Временные блага подает всем – любящим и ненавидящим Его, но вечные подает только любящим Его. Велики и умом непостижимы блага те, которых мы, потеряв из-за грехов, ничем иным, как Кровью Сына Божия, получить не могли. Ибо дорогая вещь дорогой ценой покупается. Итак, правильно заключается, что и вечная жизнь с благами своими есть бесценное сокровище, потому что бесценной Кровью Сына Божия к нам возвратилась, но она дается, как и уготована, любящим Бога, а не мир. Примечай это, брат.
      cn: 9) 永恒的宝藏是如此伟大且不可测度，是「上帝亲自预备的」——为谁？——为「爱祂的人」（哥林多前书 2:9）。世暂的福祉，祂赐予所有人——爱祂的与憎恨祂的，但永恒的福祉，祂只赐予爱祂的人。那些福祉是如此伟大且不可为心思度量，我们因罪恶而失落了它们，若非凭借上帝之子的宝血，便无法再次获得。因为珍贵之物，必以昂贵代价购得。因此，可以正确地总结说，永恒的生命及其福祉，乃是无价之宝，因为它们是借由上帝之子无价的宝血归还于我们，但它们被赐予，也如同其被预备一样，是为着爱上帝而非爱世界的人。我的弟兄，请留意此点。
  - type: paragraph
    text:
      ru: '10) Богатство редко правдой собирается, но и праведное многих портит и губит, ибо у богатых почти всегда бывает или скупость, или роскошь и гордость житейская. Посему сказано Спасителем: «Трудно богатому войти в царство небесное» ( Мф 19:23 ). У находящихся в чести или сане – или великие добродетели, или великие грехи бывают. Кто на высоком месте сидит, на того все смотрят, и принимают или назидание или соблазн, и вообще всеми признается, что честь изменяет нравы, но редко к лучшему, – что на деле видишь. У сидящего на почетной должности много ласкателей, которые, хваля, что непохвально, в грехе его утверждают. За честью также следует роскошь и гордость, что все есть христианского сердца язва. Слава и похвала человеческая даже тех, кто не ищет ее, приводит к надменности, самомнению и высокоумию, что есть «мерзость пред Богом» ( Лк 16:15 ). А чего не сделает с тем, кто ищет ее? Рассуждай об этом и не ищи того, что вредит. Безопаснейший путь – это путь нищих и простых. Лучше в мире нищим быть, но в Бога богатеть, лучше простым быть, но истинным христианином, лучше для мира презренным быть, но на небе славу получить. Этот путь низкий, но в высокое отечество – небо ведет.'
      cn: 10) 财富鲜少通过正直获得，但即使是公义获得的财富，也败坏并毁灭许多人，因为富人几乎总是会有贪婪，或奢华与世俗的骄傲。因此，救主说：「富人进入天国是困难的」（马太福音 19:23）。那些身居尊位或拥有圣职的人，要么拥有伟大的美德，要么犯下巨大的罪行。凡是身居高位的人，众人皆瞩目于他，并因此或得造就，或陷于诱惑与跌倒，并且普遍公认，尊位会改变品行，但鲜少变得更好——这在实践中可见一斑。凡居尊位者，有许多谄媚者，他们称赞不值得称赞之事，从而使他陷于罪中。尊位也常伴随着奢华与骄傲，这皆是基督徒心灵的创伤。人的荣耀与赞美，即使是那些不寻求它们的人，也会使他们陷入傲慢、自负和狂妄，这在上帝看来是「可憎恶的」（路加福音 16:15）。那么，对于那些寻求它们的人，它们又会造成何等的影响呢？思考这些，不要寻求那有害之物。最安全的道路，是贫穷和简朴之人的道路。宁可在世上贫穷，却在上帝里富足；宁可简朴，却成为真正的基督徒；宁可被世人轻视，却在天上得享荣耀。这条道路是卑微的，却引向崇高的家乡——天国。
  - type: paragraph
    text:
      ru: 11) Правильное употребление всех мирских вещей бывает ради нужды, а не ради угождения похоти плотской. «Имея пропитание и одежду, будем довольны тем» ( 1Тим 6:8 ).
      cn: 11) 所有世俗之物的正确使用，是为了需要，而不是为了满足肉体的情欲。「有了衣食，就当知足。」 (提摩太前书 6:8)
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 31 – 40
    cn: 书信 31 – 40
  children:
  - type: paragraph
    text:
      ru: 'Вопрошаешь ты у меня: какие знаки истинного познания Божия?'
      cn: 你向我询问：何为真实认识上帝的标记？
  - type: paragraph
    text:
      ru: 'И правильно то делаешь. Ибо в этом состоит спасение наше и жизнь вечная, по учению Спасителя нашего: «Сия же есть жизнь вечная, да знают Тебя, единого истинного Бога, и посланного Тобою Иисуса Христа» ( Ин 17:3 ). Но я тебе в ответ апостольское слово предлагаю: «Что мы познали Его, -» говорит он, – «узнаем из того, что соблюдаем Его заповеди» ( 1Ин 2:3 ). Видишь из апостольского слова, что тот познал Бога, кто заповеди Его соблюдает. Знак познания Божия, в сердце его пребывающего, – это соблюдение Божиих заповедей. И напротив, не знает тот Бога, кто заповедей Его не соблюдает, как той же апостол учит: «Кто говорит: «я познал Его», но заповедей Его не соблюдает, тот лжец, и нет в нем истины» ( 1Ин 2:4 ). Чем кто более познает Бога, тем более Его боится и любит, а чем более боится и любит, тем усерднее волю Его исполняет, а чем усерднее волю Его исполняет, тем тщательнее и осторожнее заповеди Его соблюдает. В этом истинное богопочитание и все христианство состоит.'
      cn: 你这样做是对的。因为我们的救赎和永生就在于此，正如我们救主所教导的：「认识祢——独一的真上帝，并认识祢所差遣的耶稣基督，这就是永生。」（约翰福音 17:3）。但我在此向你回应使徒的话：「我们若遵守他的诫命，」他说，「就知道我们已经认识他了。」（约翰一书 2:3）。你从使徒的话中看出，遵守上帝诫命的人，才是认识上帝的人。上帝的认识若常在他心中，其标志便是他遵守上帝的诫命。反之，不遵守他诫命的人，便是不认识上帝的人，正如同一位使徒教导说：「人若说『我认识他』，却不遵守他的诫命，便是说谎话的，真理就不在他心里了。」（约翰一书 2:4）。人越是认识上帝，就越是敬畏和爱慕祂；越是敬畏和爱慕祂，就越是殷勤地遵行祂的旨意；越是殷勤地遵行祂的旨意，就越是谨慎细致地遵守祂的诫命。真正的敬拜上帝与基督信仰的全部，皆在于此。
  - type: paragraph
    text:
      ru: Вот тебе краткий ответ, но всю христианскую должность заключает. Рассуждай об этом и не прельщайся нынешних христиан богопознанием и почитанием, у которых на языке исповедание Божие, но в сердце безбожие; показывай богопознание и богопочитание от дел твоих, а не от одних только слов.
      cn: 这是给你的简短答复，却包含着基督徒的全部职责。省察此言，不要被现今基督徒的对上帝的认识和敬奉所迷惑，他们口头上承认上帝，心中却无上帝；要从你的行为中显出你对上帝的认识和敬奉，而不仅仅是凭着言语。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Правильно спрашиваешь: как Бог познается и как может человек в истинное богопознание прийти? – и я тебе, по разуму и возможности моей, с помощью Божией отвечаю вкратце.'
      cn: 你问得好：上帝是如何被认知的，以及人如何能达到真正的对上帝的认知？——我将按我的领悟和能力，并借着上帝的帮助，简要地回答你。
  - type: paragraph
    text:
      ru: '1) Сделанная вещь показывает делателя, и мастерство мастера, и строение архитектора, и благодеяние благодетеля; и чем лучше и мудрее дело, тем лучшего и мудрейшего делателя показывает, и большее благодеяние большего и высочайшего благодетеля представляет. Разум эту истину доказывает, и каждый день это перед нашими глазами является. Ибо, увидев какое дело, тотчас вопрошаем: кто это сделал? И так от дела приходим в познание делателя, и изрядно и мудро сделанное дело хвалим, и разуму делателя удивляемся. Так, вся тварь, небо и земля, и все, что наполняет их, показывает Творца своего, и будучи великим, создание Его представляет нам Его Великим, и будучи мудро сотворенным – Мудрым, и будучи из ничего сотворенным – Всемогущим. Об этом Псаломник святой воспел: «Небеса проповедуют славу Божию» ( Пс 18:2 ). Рассматривая со вниманием сие великое, и изрядное, и прекрасное, и мудрое творение рук'
      cn: 所造之物显明其创造者，匠人之技艺，建筑师之构思，以及施惠者之恩泽；且一件工作越是美好和智慧，就越显明其创造者之美好和智慧，并呈现出那更伟大、更崇高之施惠者更大的恩泽。理智证明此一真理，且此理每日皆呈现在我们眼前。因为，当我们看见某件作品时，便立刻发问：「这是谁造的？」如此，我们便从作品认识其创造者，称赞那造得精妙而智慧的作品，并惊叹于创造者的智慧。照样，一切受造之物，诸天与大地，以及其间充满的一切，均显明其创造主；且因其伟大，祂的创造向我们呈现出祂的伟大；因其智慧的创造，向我们呈现出祂的智慧；因其从虚无中创造，向我们呈现出祂的全能。圣诗篇作者曾为此歌颂：「诸天述说上帝的荣耀」（诗篇 18:2）。细心审视这伟大、精妙、美丽而智慧的手工创造
  - type: paragraph
    text:
      ru: 'Создателя нашего, не можем тому не удивляться, и с Псаломником не восклицать к Создателю: «Как величественны дела Твои, Господи, все премудро Ты сотворил» ( Пс 103:24 ).'
      cn: 对于我们的创造者，我们不能不为此惊叹，并与圣咏作者一同向创造者高呼：『上主啊，祢的作为何等宏伟！祢所造的一切都满有智慧。』 ( 诗篇 103:24)
  - type: paragraph
    text:
      ru: 2) Прилежное чтение и рассмотрение Святого Писания и учения Святых Отцов и учителей церковных приводит нас в познание Божие. Ибо Святое Писание открывает Божии свойства, и волю Его святую, и преславные дела Его. Отцы Святые и учителя все это изъясняют писаниями и поучениями своими и так руководствуют нас к познанию Божию и почитанию. Ибо познание Божие включает в себя не только познание имени Божия, но и свойств и воли Его. Надобно знать не только то, что Бог есть, но и то, Кто Он, Каков и чего нам, и от нас, создания Своего, хочет и требует. Это все от Святого Писания и толкователей его черпаем и познанием Его просвещаемся.
      cn: 2) 勤勉地阅读并深思圣经，以及圣教父和教会导师的教导，引我们进入对上帝的认识。因为圣经启示上帝的属性、祂神圣的旨意，以及祂荣耀的作为。圣教父和导师们以他们的著作和教诲解释这一切，如此引导我们认识上帝并敬拜祂。因为对上帝的认识不仅包括对上帝之名的认识，也包括祂的属性和旨意。我们不仅需要知道上帝是何许存在，也需要知道祂是谁，祂是怎样的一位，以及祂对我们——祂的受造物——有何期盼和要求。这一切我们都从圣经及其诠释者那里汲取，并借着对祂的认识而蒙受光照。
  - type: paragraph
    text:
      ru: '3) Христос Спаситель наш учит: «Никто не знает Сына, кроме Отца; и Отца не знает никто, кроме Сына, и кому Сын хочет открыть» ( Мф 11:27 ). И Петру святому говорит: «Не плоть и кровь открыли тебе это, но Отец Мой, Сущий на небесах» ( Мф 16:17 ). Отсюда видим, что к познанию Божию нужно откровение. Слово Божие проповедует Бога, но Бога без Бога познать не можем. Слеп и темен разум наш, потому требует просвещения от Самого Того, который из тьмы производит свет. Надобно светильнику Божия Слова внимать, но просвещения от Самого Бога просить, надобно прогнать тьму вышеестественным светом. Святое Писание есть светильник для нас, но необходимо внутреннему оку открыться, чтобы возмогло видеть светильник сияющий. Ибо света слепой не видит, – надобно открытые очи иметь. Поэтому пророк молится: «Открой очи мои, и уразумею чудеса от закона Твоего» ( Пс 118:18 ).'
      cn: 3) 我们的救主基督教导说：「除了父，没有人知道子；除了子，没有人知道父，只有子愿意向他启示的。」（马太福音 11:27）他又对圣彼得说：「不是血肉之躯启示了你这事，乃是我在天上的父。」（马太福音 16:17）由此可见，对上帝的认识需要启示。上帝的圣言宣扬上帝，但没有上帝，我们无法认识上帝。我们的理智是盲目而昏暗的，因此需要从那使光从黑暗中而出的祂自身获得光照。我们必须留心上帝圣言的明灯，但也要祈求从上帝自身而来的光照，必须以超性之光驱散黑暗。圣经是我们的明灯，但内在的眼睛必须被开启，才能看见那闪耀的明灯。因为盲人看不见光——眼睛必须是开启的。因此先知祈祷说：「求祢开我的眼睛，使我看出祢律法中的奇妙。」（诗篇 118:18）
  - type: paragraph
    text:
      ru: 4) Если хотим, чтобы сердце наше истинным богопознанием просветилось, надо, чтобы мир вышел из сердца. Ибо мир не иное что, как «похоть плоти, похоть очей и гордость житейская» ( 1Ин 2:16 ), которые в сердце имеются. Надо все это выгнать вон из сердца, чтобы оно просветилось. Ибо мир и просвещение это две вещи противоположные, потому надо одной выступить вон, чтобы другая поместилась, и чем более будет выходить мир, тем более будет просвещаться сердце. Отсюда бывает, что отрекшиеся от мира, хотя и азбуки не знают, но, Божиим светом просвещаемы, мудрее бывают, чем те, которые все Писание знают, но ищут в мире этом прославления.
      cn: 4) 如果我们希望我们的心被真确的上帝之认知所光照，那么世俗就必须从心中出去。因为世俗无非是「肉体的私欲，眼目的私欲，并今生的骄傲」（约翰一书 2:16），这些都在心中存有。必须把这一切都从心中驱逐出去，好让它得以光照。因为世俗与光照是两件相互对立的事物，所以必须让其一出去，好让另一得以进驻；世俗出去得越多，心就越能被光照。由此可见，那些弃绝世俗的人，尽管不识字，但被上帝之光所光照，却比那些知晓全部圣经但在这世俗中寻求荣耀的人更为智慧。
  - type: paragraph
    text:
      ru: Писание Святое дано нам от Бога ради спасения нашего и прославления имени Божия, – ради этого и должно его читать, поучаться и внимать ему. А если для своего прославления читаем и стараемся его знать, то оно не только не на пользу, но и во вред нам будет, поскольку от дарования Божия ищем своей, а не Божией славы, и привлекаем и присваиваем себе то, что единому Богу приличествует. Итак, надобно тщеславие и прочую суету из сердца выбросить, если хотим Словом Божиим и светом Его просветиться. Ибо Бог глубину сердца человеческого видит, для чего и какой цели человек к чтению слова Его святого приступает, ради славы ли Божией, пользы своей и ближнего, или по своему тщеславию, – соответственно ему и чтение его обращается на пользу или во вред.
      cn: 圣经是上帝赐予我们，为了我们的得救和荣耀上帝之名，因此也应当阅读、学习并留心领受它。若是为了荣耀自己而阅读并竭力认识它，那么它不仅无益，反而有害于我们，因为我们从上帝的恩赐中寻求自己的荣耀，而非上帝的荣耀，并攫取、占有那唯独属于上帝的事物。因此，如果我们想被上帝的圣言和祂的光所光照，就必须将虚荣和诸般虚妄从心中摒弃。因为上帝洞悉人心的深处，知道人是为何以及出于何种目的而阅读祂的圣言：是为了上帝的荣耀，为了自己和邻人的益处，还是出于自己的虚荣——因此，他的阅读也相应地转变为有益或有害。
  - type: paragraph
    text:
      ru: Если чтением и поучением в Слове Божием и проповедованием славы Божией (проповедник) ищет и своей и ближнего пользы, на что оно и дано, тогда им просвещается и достигает цели его, то есть спасения души своей и ближних своих; когда же ищет того, чтобы мудрым показаться и среди людей учителем называться, то в букве его, а не в силе искусен будет, при этом даже если и другим будет пользу доставлять, для себя никакой пользы не будет иметь. Ибо всякое дарование Божие во вред нам обращается, если от него не Божией, но своей славы ищем. Одному только Подателю подобает славиться от дарования, а принимающим довольно пользу иметь для себя и других посредством дарования. Итак, читай Святое Писание и молись, чтобы им просветиться, но читай ради спасения, а не ради изощрения ума, языка и словопрения, иначе хотя и красноречив будешь, но не мудр.
      cn: 如果（传道者）借由诵读和教导上帝之道，并宣讲上帝的荣耀，寻求自身和近人的益处——这也是其被赋予的目的——那么他就会受其启迪，并达成其目的，即拯救自身和近人的灵魂；然而，如果他寻求的是显得有智慧，并被世人称为导师，那么他将在其字句上而非其能力上精通，即使他会给他人带来益处，他自己也一无所获。因为上帝的每一样恩赐，如果我们不是寻求上帝的荣耀，而是寻求自己的荣耀，那么它都会转向对我们有害。唯独那施予者配因恩赐而受荣耀，而领受者只要通过恩赐为自己和他人带来益处就足够了。因此，阅读圣经并祷告，以便借此得蒙光照，但要为着救恩而阅读，而非为着磨砺心智、口才和辩论，否则，你虽能言善辩，却并非有智慧。
  - type: paragraph
    text:
      ru: '5) Надо, наконец, желающему просветиться богопознанием признать свое невежество, слепоту и тьму Ибо Бог умудряет невежд, а не тех, кто думает о себе, что мудр; и просвещает слепых, а не тех, кто думает о себе, что видит. Гордость же надменная и высокоумие не вмещает просвещения, более того, не допускает, но всегда в своей пребывает тьме. Кто мнит о себе, что разумен и мудр, от того отходит свет Божий и оставляет его в своем разуме и мудрости, и потому хотя много о Боге говорит, но Бога не знает таковой. Помни, что выше сказано: Бога без Бога познать не можем, и чем более кто-либо Бога познает, тем более смиряется, боится и любит Его. О чем ниже лучше увидишь.'
      cn: 5) 最终，凡愿蒙受神知之光照者，当承认自己的无知、盲目与黑暗。因为上帝使无知者有智慧，而非那些自以为有智慧的人；祂光照盲人，而非那些自以为能看见的人。狂妄的骄傲与自高自大的心智不容纳光照，更不容许光照，反而永远停留在自己的黑暗中。凡自以为明智和有智慧者，上帝之光便离开他，将他留在自己的明智和智慧中；因此，这样的人即使谈论上帝很多，却不认识上帝。请记住上面所说的：没有上帝，我们无法认识上帝；并且，人越认识上帝，就越谦卑、敬畏并爱祂。关于此点，你将在下文中更清楚地看到。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Познание Божие зависит от познания Божественных Его свойств, и чем более свойства Божии познаются, тем более Сам Бог познается. Это видим и в созданных вещах: чем яснее познаются качества и свойства какой-либо вещи, тем яснее сама вещь познается. Например, что есть человек, или скот какой, или дерево, или трава, или иное что? Надо прежде свойства познать тех вещей и так от свойств к познанию самих вещей доходить. Так и Создателя нашего от свойств Его Божественных, сколько ум наш может, познаем.'
      cn: 对上帝的认识，取决于对祂神圣属性的认识；祂的神圣属性认识得越多，上帝本身就认识得越多。在受造之物中，我们也能看到这一点：一件东西的性质和属性认识得越清楚，那东西本身就认识得越清楚。例如，什么是人，什么是牲畜，什么是树木，什么是草，或任何其他事物？必须先认识这些事物的属性，然后才能从属性进到对事物本身的认识。同样，我们认识我们的造物主，是透过祂的神圣属性，就我们心智所能及的程度。
  - type: paragraph
    text:
      ru: Эти свойства хотя и от создания познаются, однако яснее представляет их нам святое Его слово. Я их по разуму, мне данному, предложу. Ты рассуждай, внимай и поучайся в них, и от этого поучения созидай душу в познании Его и почитании. Чем более будем познавать и размышлять о свойствах Его, тем более будем исправлять себя в истинном благочестии при помощи Его Самого. Истину эту ниже увидишь.
      cn: 这些属性，尽管从受造物中便可认识，然而祂的圣言却更清晰地向我们呈现它们。我将按照所赐予我的理智来陈述这些属性。你当省察，留心，并从中受教，借着这教诲，在对祂的认识和敬拜中建造你的灵魂。我们越是认识并默想祂的属性，就越能借着祂自己的帮助，在真正的虔敬中修正自己。这真理你将在下文看到。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Нет сомнения у христиан, что есть Бог и есть един существом, но троичен в Лицах, Отец, Сын и Святой Дух; и Он есть верховнейший властелин, и владеет и управляет всем миром, небом и землей, всем видимым и невидимым, и есть Царь царей и Господь господствующих, и все, что ни есть, Его всемогущая рука из ничего произвела. Ибо Он «сказал, – и стало так» ( Быт 1:20 ). И как все вещи, так меня и тебя создал, о чем говорим и поем Ему со Псаломником: «Руки Твои сотворили меня и создали меня» ( Пс 118:73 ). И обо всех Он, как Создатель и Отец, промышляет. «Все ожидают от Тебя» (Господи) «пищи, чтобы Ты дал им благовременно» ( Пс 103:27 ). И далее: «Очи всех на Тебя уповают, и Ты даешь им пищу благовременно: отверзаешь Ты руку Твою и насыщаешь все живущее по благоволению (Твоему)» ( Пс 144:15–16 ). И Он есть «упование всех концов земли, и сущих в море далече» ( Пс 64:6 ).'
      cn: 基督徒毫无疑问，有一位上帝，且在本质上是独一的，但在位格上是三位的：父、子和圣灵；祂是至高无上的主宰者，掌管并治理着整个世界，天上和地下，一切可见的和不可见的；祂是万王之王，万主之主；凡存在的一切，都是祂全能之手从无中创造出来的。因为祂「说了，事就成了」（创世记 1:20）。祂创造了万物，也同样创造了我和祢，我们与圣咏作者一同向祂如此言说并歌唱：「祢的双手造了我，也塑造了我」（诗篇 118:73）。祂作为造物主和父亲，眷顾着所有人。「所有生灵都等候着祢」（上主）「按时赐给它们食物」（诗篇 103:27）。还有：「所有生灵的眼睛都仰望祢，祢按时赐给它们食物；祢张开祢的手，按祢的恩慈使一切有生命的饱足」（诗篇 144:15-16）。祂是「全地之极和远海居民的盼望」（诗篇 64:6）。
  - type: paragraph
    text:
      ru: 'Отсюда следует:'
      cn: 由此可见：
  - type: paragraph
    text:
      ru: 1) Его единого, как Бога и Создателя и Промыслителя своего, должно нам, мне и тебе, признавать и исповедовать, и сердцем веровать в Него.
      cn: 唯独祂，作为我们唯一的上帝、创造者和护理者，我们，你我都应当承认和宣认祂，并全心相信祂。
  - type: paragraph
    text:
      ru: 2) Его, как Создателя и Бога и Господа своего, верховнейшим почитанием почитать.
      cn: 2) 祂，作为自己的创造主、上帝和主，应当以至高的崇敬来敬奉。
  - type: paragraph
    text:
      ru: 3) Ему, как Господу и Властелину и Царю нашему, я и ты должны дух свой покорять, повиноваться, послушание оказывать и волю свою покорять. Ибо если царю земному, и всякой власти, и родителям повинуемся, то тем более Богу, Который и царями, и властями, и родителями владеет. И властям земным ради Бога повиноваться должно, так как Бог их установил и повелел повиноваться им, насколько более должно Богу Самому покоряться и повиноваться, как верховнейшему Властелину, ради Которого и властям земным повинуемся.
      cn: 3) 我与你都应当向祂——我们的主、主宰和君王——顺服我们的心灵，顺从、听命，并降服我们的意志。因为如果我们顺从地上的君王、一切掌权者和父母，那么就更当顺从上帝，祂掌管着君王、掌权者和父母。并且，我们为了上帝当顺从地上的掌权者，因为上帝设立了他们，并命令我们顺从他们。何况我们更应当顺服和顺从上帝自己，祂是至高的主宰，我们也是为了祂的缘故才顺从地上的掌权者。
  - type: paragraph
    text:
      ru: 4) От сердца Ему благодарение приносить, как Создателю и Промыслителю, и потому верховнейшему Благодетелю, от Которого всякие щедроты и благодеяния на нас изливаются каждый день, а особенно через воплощение Единородного Сына Его.
      cn: 4) 由心向祂献上感恩，作为创造主和普照者，因而也是至高无上的施恩者，祂每日将各样恩典和恩惠倾注于我们，尤其是借着祂独生子的道成肉身。
  - type: paragraph
    text:
      ru: 5) Без покорения духа и послушания, почитание и благодарение Его не может быть (истинным). Ибо и земные власти и родители, если им подчиненные не оказывают должного послушания, почитают это непочтением и неблагодарностью, тем более невозможно без послушания почитать верховного Властелина, Бога, Который все дела и помышления человеческие знает.
      cn: 5) 若无灵的降服与顺服，对祂的尊崇与感恩便不可能是（真实的）。因为，即便是地上的权柄和父母，若属他们的人不尽当尽的顺服，便视此为不敬与不知恩，更何况，若无顺服，又怎能尊崇那至高的主宰、上帝呢？祂知道人类一切的作为与心思意念。
  - type: paragraph
    text:
      ru: 6) Люди такие, которые бесстрашно закон Божий нарушают и повиновения Ему не оказывают, и так Его не почитают, тяжко согрешают, ибо и сама совесть, естественный закон, Бога убеждает почитать, и за непочитание человека обличает, и казнью грозит. Все таковые, хотя и «говорят, что знают Бога» , но «делами отрекаются» от Него ( Тит 1:16 ). И естественный разум видит противоречие в том, чтобы Бога от сердца признавать и в то же время Его не бояться. Ибо само имя Его, если вспомнит о нем человек, хоть немного знающий и понимающий, что есть Бог, способно привести его в страх и трепет.
      cn: 6) 这样的人，他们无所畏惧地违背上帝的律法，并且不顺从祂，如此不敬畏祂，犯下了严重的罪，因为良知本身，这自然的法则，劝导人敬畏上帝，并因人不敬畏而谴责他，且以惩罚相威胁。所有这样的人，尽管「他们自称认识上帝」，却「在行为上否认祂」（提多书 1:16）。并且自然的理性也看出其中的矛盾：从内心承认上帝，却同时不敬畏祂。因为祂的名本身，若有人回想起祂的名，哪怕只是一点点认识并理解何为上帝的人，也能使他陷入恐惧和战栗之中。
  - type: paragraph
    text:
      ru: 7) Ты думай и веруй так неизменно, что Он твой Бог, Творец, Господь, Царь и Промыслитель, хотя и всех Он есть Бог, и хотя всем одинаково повелевает уклоняться от зла и творить благое, (ты так живи) как будто повеление это тебя одного касалось. Тогда с помощью Его родится в тебе новое движение и новый дух. И чем чаще в этом размышлении и поучении упражняться будешь, день ото дня большее усердие к богопочитанию и благочестию внутри себя почувствуешь. Но везде нужна молитва. Ибо мы без Бога и размышлять о Боге не можем, как надлежит.
      cn: 7) 祢要如此坚定不移地思想和相信，祂是祢的上帝、创造者、上主、君王和护理者；尽管祂是所有人的上帝，尽管祂同样命令所有人远离邪恶，行良善之事，但祢要如此生活，仿佛这命令单单关乎祢一人。那时，藉着祂的帮助，在祢里面会诞生一种新的感动和新的精神。祢越常操练这种默想和教诲，便会日复一日地在自身内感受到对敬拜上帝和虔敬更深的热忱。然而，处处都需要祷告。因为我们若没有上帝，甚至连正确地默想上帝都不能。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Не должен христианин и в том сомневаться, что Бог наш безначальный, бесконечный, и потому вечный и присносущный. Он один существенно живет, не может не быть, существо Его и естество есть сама жизнь. Все созданные вещи имеют начало, так как Он привел их из небытия в бытие, и их может опять не быть, если бы так Ему изводилось, но Создатель как был всегда и прежде мира, так и ныне Тот же есть, и без конца Тот же будет неизменно, и как прежде не мог не быть, так и (всегда) не может не быть. Поэтому мы не только называем Его Вечный, но и Вечность, не только Живой, но и Жизнь, не только Присносущный, но и Присносущие, не только Пребывающий, но и Бытие; называем Сый (Сущий), что означает: и был, и есть, и будет. И в Писании Святом говорит Он о Себе: «Я есмь Альфа и Омега, начало и конец, – говорит Господь, Который есть и был и грядет, Вседержитель» ( Откр 1:8 ). И в других местах прекрасно изображается Его присносущие и приснобытие. Читай сам и рассуждай.'
      cn: 基督徒也不应怀疑，我们的上帝是无始的、无限的，因此是永恒的、常存的。唯有祂本质性地活着，不能不存在，祂的存有与本性就是生命本身。一切被造之物都有起始，因为祂将它们从虚无带入存在，若祂愿意，它们也能再次归于虚无；但创造者，祂从前和在世界之先如何常存，如今仍是如此，并将永无止尽地保持不变，祂从前如何不能不存在，如今也（永远）不能不存在。因此，我们不仅称祂为永恒者，也称祂为永恒；不仅称祂为活者，也称祂为生命；不仅称祂为常存者，也称祂为常存；不仅称祂为住留者，也称祂为存有；我们称祂为「自有者」（Сущий），意即：昔在、今在、永在。在圣经中，祂论到自己说：「我是阿拉法，我是俄梅戛，是始，是终，——那位昔在、今在、今后永在的全能上主说。」（启示录 1:8）在其他地方，祂的常存与永在也得到了美妙的描绘。请你自己阅读并深思。
  - type: paragraph
    text:
      ru: 'Отсюда следует:'
      cn: 由此可见：
  - type: paragraph
    text:
      ru: 1) Наше бытие и жизнь от Него, как приносущной Жизни и Источника жизни, зависит.
      cn: 我们的存在和生命，依赖于祂，祂乃是本原生命和生命之泉源。
  - type: paragraph
    text:
      ru: Он не может не быть, а мы можем быть и не быть. Бытие и жизнь наша, как тень от дерева, от Него происходит.
      cn: 祂必然存在，而我们却可以存在，也可以不存在。我们的存有与生命，如同树的影子，都源自于祂。
  - type: paragraph
    text:
      ru: 2) Отсюда учись смирение и ничтожество свое познавать. Я и ты, и даже весь свет, в бытии своем как ничто перед Ним. Как были прежде ничто, так и можем быть ничто, но Он всегда неотменно и непременно пребывает. «Ты Тот же, и лета Твои не оскудеют» ( Пс 101:28 ), – поет Ему пророк.
      cn: 2) 从此，你要学会认识自己的谦卑和虚无。我和你，甚至整个世界，在祂面前，其存在如同虚无。我们先前如何是虚无，同样也可能成为虚无；但祂永远不变，坚定不移地长存。「祢永不改变，祢的年岁永不穷尽」（诗篇 101:28），先知如此歌颂祂。
  - type: paragraph
    text:
      ru: 3) Отсюда учись, что при Нем быть неотлучно – это вечная жизнь, и отлучиться от Него – вечная смерть. Как пребывающий при свете должен просвещаться, а от света удалившийся должен помрачиться, так и с жизнью пребывающий должен жить, и от жизни удалившийся должен умереть.
      cn: 3) 由此当学：与祂寸步不离地同在乃是永生，而与祂分离乃是永死。如同与光同在者必受光照，而远离光者必陷于黑暗；照样，与生命同在者必得生，而远离生命者必死亡。
  - type: paragraph
    text:
      ru: 4) Удаляется же человек от Бога – Жизни путем греха. Берегись же греха, чтобы не удалиться от Бога – Жизни и Животворящего и чтобы вовеки в смерти не пребыть.
      cn: 人却藉着罪而远离上帝——生命。所以，务要警惕罪，以免远离上帝——生命和赐予生命的，且以免永远处于死亡之中。
  - type: paragraph
    text:
      ru: '5) Благодари Бога и люби Его, как жизнь твою, которой оживляешься. Ибо нет для человека ничего дороже жизни, жизнь человек более всего почитает. Жизнь твоя от Него зависит, прилепляйся же к Нему, как жизни твоей, с пророком говоря: «Для меня прилепляться к Богу благо есть» (Посл. ко св. Причащению)'
      cn: 5) 感谢上帝并爱祂，如同你赖祂而得以活泼的生命。因为对人而言，没有什么比生命更宝贵，人最珍重生命。你的生命依赖于祂，那么就依附于祂罢，如同依附你的生命，并如先知所言：「对我而言，亲近上帝乃是福祉。」 (致圣餐书)
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Всемогущество Божие познаем от создания, правления мира и чудес Его, в мире сотворенных и творимых. Не было ничего, но Бог такие великие, преславные и различные сотворил дела, небо и землю, и все, что наполняет их, и сотворил из ничего, без труда, словом единым: «Он сказал, – и было; повелел, – и они создались» ( Пс 32:9 ). Все это всемогущей силе приписываем. Та же всемогущая сила хранит в целости и управляет созданным миром. Небо и земля со всем, что наполняет ее, стоит и пребывает, какой была создана Создателем, и будет стоять, пока всемогущей воле Его угодно будет. «Поставил их вовек, и в век века: повеление дал, и не прейдет» ( Пс 148:6 ).'
      cn: 上帝的全能，我们从世界的创造、治理以及祂在世上已行和正在行的奇迹中得以认知。起初一无所有，但上帝却创造了如此伟大、荣耀而多样的作为，就是天地和充满其中一切，并且祂是从无中创造，不费力气，仅凭一言：「祂说有，就有；祂命立，就立」（诗篇 32:9）。这一切，我们都归因于全能的力量。同样全能的力量完整地保守着并治理着被创造的世界。天地和充满其中一切，正如造物主所创造的那样，屹立不移，存留不变，并将继续屹立，直到祂全能的旨意所悦纳为止。「祂将它们立定，直到永永远远；祂颁布命令，它们就不能越过」（诗篇 148:6）。
  - type: paragraph
    text:
      ru: Всякая стихия на своем месте пребывает и пребывать будет, всесильным словом утверждена. Небо, воздух и земноводный круг неподвижно на своих местах пребывают. Бог так повелел им, и всесильное слово Его содержит и сохраняет их так. Земля дает плоды, и животные плодятся, хлеб питает скот и людей и всякое животное. Все это происходит по всемогущему слову Его и повелению. Облака, премножеством вод исполненные, по тончайшей стихии – воздуху ходят, и с места на место переходят, и не падают на землю, но только дождь из себя испускают. Все это всемогущей силе Его относим, и прочее.
      cn: 万物各在其位上存留并将存留，借着全能之言被坚立。天空、空气和大地稳固地在其位上存留。上帝如此命令了它们，祂全能之言也如此维系并保守着它们。大地出产果实，动物滋生繁衍；粮食滋养牲畜、人类和各种动物。所有这一切都凭着祂全能之言和命令而成就。云彩，满载着丰沛之水，在最精微的元素——空气之中运行，从一处到另一处飘移，却并不坠落到地上，而仅从自身降下雨水。所有这一切，以及诸如此类的事，我们都将其归于祂全能之力。
  - type: paragraph
    text:
      ru: Как хозяин дом свой хранит, содержит и управляет, так Бог, как Господь, весь мир во всемогущей руке Своей содержит, хранит и управляет. «В руке Его все концы земли» .
      cn: 如同主人看守、维系并治理自己的家园，照样，上帝，作为上主，在其全能之手中维系、看守并治理整个世界。「地极尽在其手中。」
  - type: paragraph
    text:
      ru: Всемогущей власти и силе его приписать должно и то, что Он повелевает морю – и оно разделяется, и расступается; повелевает реке – и она останавливается; повелевает огню – и он не опаляет; повелевает камню – и он источает воду; повелевает земле – и она разверзает уста свои и пожирает беззаконных; а также то, что словом и изволением Его в один миг расслабленный делается целым, слепой – видящим, прокаженный – чистым, больной – здоровым; и то, что малыми хлебами многие тысячи питаются и насыщаются. Свойство всемогущества Его таково, что все Ему возможно, что хочет, – хочет же, что добро и праведно. Об этом свойстве во многих местах Святого Писания говорится.
      cn: 祂的全能权柄与能力，也应当归因于：祂命令海，海就分开，并向两旁退去；祂命令河，河就停止；祂命令火，火就不焚烧；祂命令石头，石头就流出水来；祂命令地，地就张开它的口，吞噬不法之人；还有，祂藉着祂的圣言与旨意，在一瞬间，瘫痪之人得痊愈，瞎子得看见，麻风病人得洁净，病人得健康；以及祂以少量饼食喂饱了数千人，使他们得以饱足。祂全能的属性乃是如此，凡祂所愿的，一切对祂都是可能的——而祂所愿的，乃是良善且公义的。关于这属性，圣经在许多地方都有记载。
  - type: paragraph
    text:
      ru: 'От размышления о всемогуществе Божием учиться должно:'
      cn: 从默想上帝的全能，应当学习：
  - type: paragraph
    text:
      ru: 1) Страху Божию, ибо бояться и трепетать подобает Того, Кто всесилен и всемогущ, и как из ничего все творит, так и в ничто может обратить.
      cn: 敬畏上帝，因为理当畏惧并战兢那位全能全权的祂。祂正如能从无中创造万有，也同样能将万有化为乌有。
  - type: paragraph
    text:
      ru: 2) Смирению, чтобы «смириться под крепкую руку Божию» ( 1Петр 5:6 ).
      cn: 2) 谦卑，为要「在上帝大能的手下谦卑自己」 （彼得前书 5:6）。
  - type: paragraph
    text:
      ru: 3) Вере, ибо, чего ум наш не понимает, то всемогущая сила Его сделать может. Например, непонятно уму нашему воскресение мертвых, но Богу, Который и из ничего все создал, возможно.
      cn: 3) 对信德，因为我们心智所不理解的，祂的全能都能成就。例如，死者的复活对我们的心智来说是不可理解的，但对于那位甚至从虚无中创造万有的上帝而言，却是可能的。
  - type: paragraph
    text:
      ru: 4) Надежде в подвиге против плоти, дьявола и мира, и прочем, так как, чего сами не можем, то силой Его сотворим, и то искушение, которое сами не можем победить, о Нем победим. В Боге обретем силу, и Он уничижит притесняющих нас. «Бог нам прибежище и сила, помощник в тяжких скорбях, постигших нас» ( Пс 45:2 ). Так апостолы, мученики и все святые Его всемогущей силой победили мир. Из этого учимся и мы не на свою, но на Его силу надеяться во всем. Ибо «без Него не можем делать ничего» ( Ин 15:5 ). Требуется от нас труд и подвиг, но всякий труд и подвиг без Него тщетен.
      cn: 4) 在对抗肉体、魔鬼和世界，以及其他方面的争战中，要怀抱盼望，因为我们自己所不能成就的，要靠着祂的力量去成就；我们自己无法战胜的试探，要靠着祂去战胜。我们在上帝里面会获得力量，祂也会制服那些压迫我们的人。「上帝是我们的避难所和力量，是我们临到深重苦难时的帮助者」（诗篇 45:2）。因此，使徒、殉道者和祂所有的圣徒都靠着祂全能的力量战胜了世界。从中我们也学习到，在一切事上不依靠我们自己的力量，而是依靠祂的力量来仰赖。因为「离了祂，我们就什么都不能做」（约翰福音 15:5）。我们被要求付出劳作和争战，但所有没有祂的劳作和争战都是徒然的。
  - type: paragraph
    text:
      ru: 5) Потому, следовательно, должно молиться и просить у Него, как всесильного, помощи. Да воображаем часто в уме нашем всемогущество Божие, «ибо мы Им живем и движемся и существуем» ( Деян 17:28 ). И будем осторожно поступать в словах, делах и помышлениях. Будем Его трепетать, и препадать пред Ним со смирением, и за ничто себя вменим. Не будем ни в чем сомневаться, ибо все Ему возможно. Будем на Него, а не на себя надеяться, и усердно для слабости и немощи нашей от Него помощи искать.
      cn: 5) 因此，我们当向祂，这位全能者，祈祷并寻求帮助。我们当常在心中默想上帝的全能，因为「我们生活、动作、存留，都在乎祂」（使徒行传 17:28）。我们也要谨慎行事，在言语、行为和意念上。我们当敬畏祂，并在祂面前以谦卑俯伏，将自己视为无有。我们不要在任何事上怀疑，因为在祂凡事都能。我们当仰望祂，而非仰赖自己，并因我们的软弱与无能，恳切地向祂寻求帮助。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Ныне тебе о вездесущии Божием по силе и разуму моему пишу, и как пред своими, так и пред твоими умными очами представляю. О, если бы мы всегда это свойство Божие действительно чувствовали в сердцах наших, слышали в ушах душ наших, и умными очами на него смотрели, и видели Господа нашего пред нами всегда, как пророк о себе воспел: «Всегда я видел Господа пред собою» ( Пс 15:8 ), то с гораздо большим опасением жили бы, и поступали в словах, делах, начинаниях и помышлениях наших! Ибо если пред царем земным, который такой же человек, как и мы, и даже пред низшею властью, осторожно поступаем, то тем более пред величеством Божиим осторожно и со страхом поступали бы, если бы помышляли, что Бог с нами и мы пред очами Его ходим, делаем и беседуем.'
      cn: 如今，我按我的力量和悟性，为你写下关于上帝的无所不在，并将其呈现在我自己的明悟之眼，以及你明悟之眼前。哦，但愿我们总是真实地在我们心中感受上帝的这一属性，在我们灵魂的耳中听闻，并且用明悟之眼瞻望祂，总是看见我们的主在我们面前，正如先知论及自身所歌颂的：「我常将上主摆在我面前」（诗篇 15:8），那么，我们就会怀着更大的敬畏度日，并且在我们的言语、行为、起始和意念上谨慎行事！因为，如果我们甚至在一位地上的君王面前——他也和我们一样只是一个人——甚至在较低的权柄面前，都谨慎行事，那么，如果我们思忖上帝与我们同在，并且我们行止、做事、交谈都在祂的眼前，我们就会更怀着谨慎与敬畏行事！
  - type: paragraph
    text:
      ru: 'Вездесущие нам представляет Его святое слово: «Бог наш на небесах и на земле» . И далее говорит пророк: «Куда пойду от Духа Твоего и от лица Твоего куда убегу? Взойду ли на небо, Ты там; сойду ли во ад, Ты там; если подниму крылья мои поутру» (по иному переводу: «зари), и поселюсь на краю моря, то и там рука Твоя наставит меня, и удержит меня десница Твоя» ( Пс 138:7–10 ). То есть нет такого места, где бы Бог не присутствовал, но на всяком месте Он есть. Он не заключен в каком-либо месте и не ограничен каким-либо местом, но со мной есть, и с тобой есть, и со всяким человеком, хотя Его и не видим, как Духа невидимого, но чувствуем, как Он часто присутствует с нами в скорбях, помогает нам в искушениях наших, и в печалях утешает, и воздыхания, желания, движения и помышления духовные и святые возбуждает, в совести нашей грехи наши открывает, и опечаливает нас на пользу нашу, и кающихся и сожалеющих утешает. Итак, пред Ним делает человек все, что ни делает, пред Ним говорит все, что ни говорит, пред Ним помышляет все, что ни помышляет, или добро, или зло.'
      cn: '上帝的无所不在向我们展现祂的圣言：「我们的上帝在天上也在地上。」先知又说：「我往何处去躲避祢的灵？我往何处去逃避祢的面？我若升到天上，祢在那里；我若下到阴间，祢也在那里；我若展开清晨的翅膀，居住在海的极处，就是在那里，祢的手必引导我，祢的右手也必扶持我。」 (诗篇 138:7-10)


        这也就是说，没有一个地方是上帝不临在的，祂在任何地方都存在。祂不被囚禁于任何地方，也不受任何地方的限制，但祂与我同在，与你同在，也与每一个人同在，虽然我们看不见祂，如同看不见的圣灵，但我们能感受到，祂时常在苦难中与我们同在，在我们的试探中帮助我们，在悲伤中安慰我们，并激发属灵和圣洁的叹息、愿望、行动和思想，在我们的良心中显明我们的罪过，为了我们的益处使我们忧伤，并安慰悔改和懊悔之人。


        因此，人在祂面前做一切所做的事，在祂面前说一切所说的话，在祂面前思想一切所思想的事，无论是善是恶。'
  - type: paragraph
    text:
      ru: 'Рассуждение и размышление об этом свойстве Божием учит нас:'
      cn: 对于上帝这一属性的思量与默想教导我们：
  - type: paragraph
    text:
      ru: 1) Воздавать величеству Его достойную честь в словах, делах и помыслах. Если пред земной властью и пред отцами нашими плотскими благоговейно поступаем, то тем более пред очами Божиими благоговейно и со страхом поступать должно.
      cn: 1) 在言语、行为和思想上，向祂的威严献上配得的尊荣。如果我们在世俗权柄面前，以及在我们肉身的父亲面前恭敬行事，那么在上帝面前，就更当怀着恭敬与敬畏行事。
  - type: paragraph
    text:
      ru: 2) От греха всякого беречься, чтобы не опечалить Его, и на себя праведный Его гнев не подвигнуть, ибо всяким грехом Он опечаливается. Бережемся бесчинствовать пред царем земным, а тем более пред Богом, Небесным Царем (должно беречься). Тяжко христиане согрешают, когда Ему, как присутствующему, не воздают достойной чести и благоговения, закон Его святой пред очами Его нарушают. Рассуждай об этом и увидишь сам.
      cn: 2) 远避一切罪恶，以免使祂忧伤，也不要将祂公义的愤怒招致自身，因为一切罪恶都使祂忧伤。我们在世俗君王面前尚且谨防行为不端，何况在上帝，天上的君王面前（更应如此谨防）。基督徒犯下重罪，当他们不向祂——仿佛祂就在场般——献上应有的尊荣与敬畏，并在祂的眼目下违犯祂的圣洁律法之时。默想此事，你便会亲身明了。
  - type: paragraph
    text:
      ru: '3) Надеяться на Него везде и на всяком месте, так как Он везде с нами есть, и с пророком дерзать и говорить: «Если и пойду посреди тени смертной, не убоюсь зла, ибо Ты со мною» ( Пс 22:4 ).'
      cn: 3) 无论何处何地都倚靠祂，因为祂无处不在与我们同在，并与先知一同壮胆说：「即便我行过死荫的幽谷，我也不惧怕邪恶，因为祢与我同在。」（诗篇 22:4）
  - type: paragraph
    text:
      ru: 4) Везде и на всяком месте Ему молиться, призывать Его, петь и хвалить Его. «Близок Господь ко всем призывающим Его, ко всем призывающим Его во истине» ( Пс 144:18 ).
      cn: 4) 无时无处，向祂祷告，呼求祂，歌颂并赞美祂。«上主亲近凡呼求祂的，亲近凡以真理呼求祂的»（诗篇 144:18）。
  - type: paragraph
    text:
      ru: '5) Также учит страху, так как бояться и трепетать Его убеждаемся. Ибо кто не убоится Его, рассуждая о Его величестве и присутствии: «Кто не убоится Тебя, о Царь народов?» ( Иер 10:7 ), – говорит пророк. Рассуждай чаще об этом, брат, и всегда будешь чувствовать новое доброе движение внутри тебя. Это тебя в страхованиях бесовских ободрит и укрепит, в напастях увеселит, от греха отвратит, и в подвиге против него укрепит, и за содеянные грехи усердно и с сожалением каяться подвигнет, и истинную в тебе молитву возбудит.'
      cn: 5) 也教导敬畏，因为我们蒙劝要敬畏祂并战兢祂。谁不敬畏祂呢，思忖祂的威严与临在呢？「列国的君王啊，谁不敬畏祢呢？」（耶利米书 10:7），先知说。弟兄啊，你当多多思忖此事，你里面总会感到有新的善念萌动。这会使你在魔鬼的恐吓中得到慰藉和坚固，在患难中使你喜乐，使你转离罪恶，并坚固你对抗罪恶的属灵争战，并激励你为所犯的罪真诚而悔恨地忏悔，并在你里面激发起真诚的祷告。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Еще тебе о том же напоминаю, напоминая же и благости Божией и долготерпению удивляясь, и тебя к тому побуждаю. Воистину дивная и непостижимая к нам благость Божия и долготерпение!
      cn: 我再次就此事提醒你，在提醒的同时，也惊叹于上帝的恩慈和恒忍，并以此激励你。上帝对我们所施的恩慈和恒忍，确实奇妙而不可测度！
  - type: paragraph
    text:
      ru: Бог везде есть и со всяким человеком; человек пред очами Его грешит и закон Его святой и вечный разоряет. Какой царь стерпит, видя, что пред глазами его закон его нарушается, и не казнит законопреступника? Не слышно того. Бог наш не таков. Он видит, как человек закон Его разоряет, и терпит, и не казнит его. И не только терпит и не казнит, но не перестает ему и благотворить, подавая ему пищу и одежду, и блага Свои, защищает и сохраняет его от губителя дьявола, который все пути и следы грешника наблюдает, чтобы его погубить и душу его восхитить, и в ад низринуть, но Бог ему не дозволяет. Человек прогневляет Бога, но Бог милости Своей от него не отнимает. Человек от Бога отступает, но Бог еще его не оставляет. Человек во след дьявола идет и себя ему предает, но Бог запрещает дьяволу взять его и в погибель свести. Видишь благость Божию и долготерпение! Знай же, что эта «благость Божия ведет» грешника «к покаянию» ( Рим 2:4 ).
      cn: 上帝无所不在，并与每一个人同在；人在祂眼前犯罪，并败坏祂圣洁而永恒的律法。有哪个君王能容忍，眼见其律法在眼前被违犯，而不惩治犯法者呢？这从未闻见。我们的上帝并非如此。祂眼见人败坏祂的律法，却忍耐，并不惩治他。祂不仅忍耐且不惩治，反倒不停止地恩待他，赐予他食物、衣物和祂的恩泽，并保护和保守他脱离那毁灭者魔鬼，魔鬼监视着罪人的一切行径与踪迹，为要毁灭他，夺取他的灵魂，并把他投入地狱，但上帝不容许它如此。人触怒上帝，但上帝却不收回祂对人的怜悯。人背离上帝，但上帝仍未离弃他。人跟随魔鬼的踪迹，将自己交予它，但上帝禁止魔鬼带走他并将他引向灭亡。你可见上帝的慈良与恒忍！须知，这「上帝的慈良引领」罪人「悔改」（罗马书 2:4）。
  - type: paragraph
    text:
      ru: 'Из этого учимся:'
      cn: 从中我们学习：
  - type: paragraph
    text:
      ru: 1) Истинному покаянию и сожалению, что мы величеству Его достойной не воздавали чести и благоговения.
      cn: 1) 真实的悔改和懊悔，因我们未能向祂的威严献上合宜的尊崇和敬畏。
  - type: paragraph
    text:
      ru: 2) Впредь беречься закон Его святой нарушать.
      cn: 2) 今后务要提防触犯祂的圣律。
  - type: paragraph
    text:
      ru: 3) Благодарить Его от сердца, что Он нас не погубил в беззакониях.
      cn: 3) 衷心感谢祂，因祂没有在我们的罪孽中毁灭我们。
  - type: paragraph
    text:
      ru: Рассуждай об этом, и зародится в тебе дух истинного сожаления и печали ради Бога.
      cn: 默想此事，你心中便会生出为上帝的真实痛悔与忧伤之灵。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Всеведение Божие тебе по возможности моей представляю. Бог Сам да поможет и мне в моем деле, и тебе в твоем чтении и рассуждении, и да напишет на моем и твоем сердце, как это, так и прочие Свои свойства, во славу Его и нашу пользу.
      cn: 我尽我所能地向你呈现上帝的全知。愿上帝亲自帮助我完成我的事工，也帮助你在你的阅读与思辨中，并愿祂将祂的这个属性，以及其他属性，铭刻在我与你的心上，为着祂的荣耀，并为着我们的益处。
  - type: paragraph
    text:
      ru: 'Бог все знает, не только настоящее, но и будущее. «Нет твари, сокровенной от Него, но все обнажено и открыто перед очами Его» ( Евр 4:13 ). «С небес посмотрел Господь, увидел всех сынов человеческих: из уготованного жилища Своего посмотрел на всех живущих на земле Тот, Кто создал особо сердца их и вникает во все дела их» ( Пс 32:13–15 ). «Ты узнал, когда я сажусь и встаю. Ты уразумел помышления мои издали. Путь мой и жизнь мою Ты исследовал, и все на пути моем Ты предвидел» ( Пс 138:1–3 ). И далее: «Ибо тьма не будет темна от Тебя и ночь будет светла, как день» . И далее: «Неоконченное мое видели очи Твои, и в книге Твоей все будут записаны» .'
      cn: 上帝知道一切，不仅是现在，而且是未来。「在祂面前没有一样受造之物是隐藏的，反倒一切都在祂的眼前赤露敞开。」（希伯来书 4:13）「上主从天上垂看，祂看见世上所有的人类之子；从祂预备的居所俯视所有住在地上的人，祂特别塑造了他们的心，并且洞察他们一切的作为。」（诗篇 32:13-15）「我坐下，我起来，祢都晓得；祢从远处明了我的一切意念。我行路，我躺卧，祢都细察，我一切所行的，祢都预先知道。」（诗篇 138:1-3）又说：「因为黑暗在祢面前并非黑暗，夜间也必亮如白昼。」又说：「我未成形的身体，祢的眼睛早已看见了；它们都要在祢的册子上记下。」
  - type: paragraph
    text:
      ru: 'Из этого святого учения познаем:'
      cn: 从这神圣教导中，我们认识到：
  - type: paragraph
    text:
      ru: 1) Бог все созданные вещи знает и проницает их.
      cn: 上帝知道并洞察一切受造之物。
  - type: paragraph
    text:
      ru: 2) Смотрит на все дела и помышления и слышит слова наши. Бог не имеет очей и ушей, так как бестелесен и дух есть, но в силу Его всесовершенного разумения и знания (можно сказать, что Он) весь око и весь ухо. Видит и слышит все Тот, Который создал око, чтобы видеть, и ухо, чтобы слышать. «Устроивший ухо не услышит ли? и Создавший глаз не увидит ли» ( Пс 93:9 )?
      cn: 2) 祂鉴察我们一切的作为和意念，也垂听我们的话语。上帝本无眼耳，因祂乃是无形之体，又是灵；然凭着祂那全备的悟性和知识，（可以说）祂是全然的眼目，全然的耳朵。那创造眼睛使人能看，创造耳朵使人能听的，祂便看见一切，听见一切。「那栽植耳朵的，岂不听见吗？那塑造眼睛的，岂不察看吗？」 ( 诗篇 93:9)
  - type: paragraph
    text:
      ru: '3) Нет пред Ним сокровенного и темного места, но все Ему явно. Нет тьмы и ночи, но всегда ясный день: и ночь пред Ним как день, и тьма как свет. У нас ночь и день, тьма и свет, но у Бога всегда день и свет, равно видит, как ночью, так и днем, и как во тьме, так и во свете творимое. Если помышление видит, то тем более дело. Ибо большее (чудо) видеть помышление, нежели дело, во тьме творимое.'
      cn: 3) 在祂面前没有隐藏和幽暗之处，但一切都向祂显明。没有黑暗和黑夜，但总有明亮的白昼：在祂面前黑夜如同白昼，黑暗如同光明。我们有黑夜和白昼，黑暗和光明，但在上帝那里总有白昼和光明，祂同样看到，无论在黑夜还是白昼，无论在黑暗还是光明中所行的一切。如果祂看到意念，那就更不用说行为了。因为看到意念是更大的（奇迹），胜过看到在黑暗中进行的行为。
  - type: paragraph
    text:
      ru: 4) Сколько на свете ни есть людей, Он каждого из них слово, дело и помышление знает, и смотрит, и примечает. Причем, всякого человека слово, дело и помышление, днем или ночью творимое, так явно Ему и известно, как бы только на него одного смотрел и внимал ему, все прочие создания оставив, чтобы только за ним одним наблюдать. Рассуждай об этом.
      cn: 凡世间所有的人，上帝都知晓他们每个人的言语、行为和意念，祂都察看并留意着。而且，每个人的言语、行为和意念，无论是在白天还是黑夜所行的，在上帝面前都是如此清晰显明，如此被祂知晓，仿佛祂只注视着这一个人，只专注着他，将所有其他受造物都置于一旁，只为观察他一人。思考这一点。
  - type: paragraph
    text:
      ru: 5) Что человек делает, мыслит и говорит, доброе или злое, все это в книге Своей записывает и воздает всякому по делам его. Внимай этому.
      cn: 5) 人所做的、所思想的、所说的，无论是善是恶，这一切都在祂的书上记录着，并照各人的行为报应各人。当留意这话。
  - type: paragraph
    text:
      ru: 6) Не только настоящее слово, дело и помышление наше знает и проницает, но и то, что будем делать, говорить, думать и замышлять, и начинать, и в какое время, час и день, все совершенно знает от самой вечности.
      cn: 6) 不仅知晓并洞察我们现今的言语、行为和意念，更是知晓我们将来要做、要说、要思想、要筹划、要开始的一切，以及这些事情将在何时、何小时、何日发生，所有这一切，都从永恒开始便完全知晓。
  - type: paragraph
    text:
      ru: 'Если о таком всеведении Божием будет размышлять человек и чувствовать в сердце, непременно последует в нем:'
      cn: 如果人默想上帝这种全知，并在心中感受，他心中必会随之而起：
  - type: paragraph
    text:
      ru: 1) Страх и трепет, и от этого осторожное в словах, делах, начинаниях, намерениях и помышлениях жительство и обращение.
      cn: 敬畏战兢，由此在言语、行为、肇始之事、意图和思虑上，当持谨慎之生活和行止。
  - type: paragraph
    text:
      ru: 2) Истинное покаяние и сокрушение о прежних грехах, и усердие впредь беречься от греха.
      cn: 2) 真实的悔改和为旧日罪恶的痛悔，以及在未来努力远避罪恶。
  - type: paragraph
    text:
      ru: 3) Умная и сердечная молитва, внутри творимая, и воздыхание, так как Бог и сердечные помышления видит.
      cn: 3) 心意祷告，在内在进行的，以及叹息，因为上帝连心中的意念都看见。
  - type: paragraph
    text:
      ru: 4) Удаление от лицемерия, которое внешне показывает святость, но внутри злобу питает.
      cn: 4) 远离那外表显出圣洁，内心却滋养恶毒的伪善。
  - type: paragraph
    text:
      ru: 5) Когда у человека нет благочестия внутри, то и внешне нет, каким бы себя ни показывал. Нет истинного страха Божия – нет и благочестия истинного. Ибо Бог не только на внешние дела, но еще более на сердце смотрит, и судит по тому.
      cn: 5) 当一个人内心没有虔敬时，那么外在也没有，无论他如何表现自己。没有真正的敬畏上帝之心，就没有真正的虔敬。因为上帝不仅看外在的作为，而且更看重内心，并以此来审判。
  - type: paragraph
    text:
      ru: '6) Отсюда видно, что беззаконное и бесстрашное житие – это знак безбожия, внутри сердца кроющегося. Таковой говорит в сердце своем: «"Нет Бога"» ( Пс 13:1 ), и потому таковые «говорят, что знают Бога, а делами отрекаются от Него» ( Тит 1:16 ).'
      cn: 6) 从此可见，不法且毫无敬畏的生活，是内心深处隐藏着不信上帝的标志。这样的人在心里说：「没有上帝」（诗篇 13:1），因此他们「声称认识上帝，却在行为上否认祂」（提多书 1:16）。
  - type: paragraph
    text:
      ru: 7) Надо человеку, который хочет благочестиво жить, исправить внутреннее состояние, и как бы вновь родиться и обновиться. Ибо Богу ничто внешнее без внутреннего не приятно.
      cn: 7) 凡欲虔敬生活之人，应当修正其内在景况，并仿佛得以重生与更新。因为在上帝看来，一切外在之事，若无内在，皆不蒙悦纳。
  - type: paragraph
    text:
      ru: Бог к душе и сердцу человеческому говорит и потому от души и сердца требует исправления и послушания. Если и не убивает человек руками человека, но сердцем злобится на человека, то он убийца пред Богом. Если и не согрешает телом с чужой женой, но сердцем пожелает чужую жену, то он прелюбодей пред очами Божиими. Не крадет руками, но хочет и желает похитить чужое добро, – хищник пред Богом. Ибо как внешнее дело и человек видит, так Бог и внутреннее равно видит, как и внешнее. Итак, надо человеку внутреннее состояние исправить, если хочет угождать Богу, ибо Бог на сердце смотрит, – и тогда по исправлении сердца и внешние исправные дела последуют. Итак, учись от размышления о всеведении Божием сердце свое исправлять, чтобы и внешние дела твои правыми были. Иначе человек будет как яблоко, снаружи красивое, но внутри гнилое и червивое, или как гроб покрашенный, внешне красивый, но внутри смрадный.
      cn: 上帝对人的灵魂和心灵说话，因此也要求灵魂和心灵的悔改与顺服。即使人不用手杀害人，但心里对人怀恨，那么他在上帝面前就是个杀人犯。即使人没有用身体与他人的妻子犯淫，但心里贪恋他人的妻子，那么他在上帝眼中就是个淫乱者。不用手偷窃，但却想要并渴望夺取他人的财物，——他在上帝面前就是个强盗。因为人如何能看见外在的行为，同样，上帝也同样能看见内在的，如同看见外在的。因此，人必须改正内在的状态，如果他想要取悦上帝，因为上帝察看人心，——那么在心灵得到改正之后，外在的正直行为也将随之而来。因此，要从默想上帝的无所不知中学习改正自己的心，好让你外在的行为也正直。否则，人就会像一个苹果，外面好看，里面却腐烂生虫，或者像一个上了漆的坟墓，外面好看，里面却充满腐臭。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Желая (полнее) изобразить всеведение Божие как в твоем, так и в своем разуме, поскольку сие весьма нужно для истинного богопочитания и для нашей пользы, еще о том тебе (рассуждение) предлагаю, дабы глубже вкоренилось в сердцах наших.
      cn: 为了（更充分地）在你的心智和我的心智中展现上帝的全知，鉴于这对于真正的敬拜上帝以及对我们的益处都至关重要，我再向你提出一番思虑，以使其更深地扎根于我们心中。
  - type: paragraph
    text:
      ru: 'Ты, как только хочешь что-либо начинать и делать, то вспомни, что Бог с тобой есть, и уже знает твою мысль, и так рассуди, согласно ли воле и закону Божию начинание твое, или противно. Если согласно, то в помощь Его призови и молись, говоря: «Господи, благослови и помоги», – и начинай, и делай. Когда явно видишь, что это противно Ему, то удержись от того и также молись Ему, говоря: «Господи, помоги мне». Бог же, видя твое хотение и желание добра, и отвращение от зла, и старание, подаст руку помощи Своей.'
      cn: 每当你想要开始做某事时，就要记住，上帝与你同在，并且已经知道你的心思。如此，你要审察，你的开端是符合上帝的旨意和律法，还是与之相悖。如果符合，就呼求祂的帮助，并祷告说：「主啊，求祢赐福并帮助我」，然后开始做。当你清楚地看到这与祂相悖时，就要克制自己，不要去做，也要向祂祷告说：「主啊，求祢帮助我」。上帝呢，祂看到你渴望并愿意行善，并厌恶邪恶，以及你的努力，就会伸出祂的援助之手。
  - type: paragraph
    text:
      ru: 'Люди, желая беззаконие сделать, ищут сокровенных мест. Блудники и воры ночь и тьму любят. Лихоимцы и мздоимцы тайно берут мзду. Лукавцы, хитрецы, льстецы, лицемеры и злобники внутри себя скрывают зло свое, и все дела темные во тьме делают, как сыновья тьмы. «Ибо всякий, делающий злое, ненавидит свет и не идет к свету, чтобы не обличилис дела его, потому что они злы» ( Ин 3:20 ). Все таковые стараются укрыться, но обманываются бедные, ибо они от людей скрываются, но от Бога, Который есть свет, светлее всякого света, и свидетель их злодеяний, укрыться не могут нигде и никак, так как Он везде с ними, и всякое их злодеяние видит, и в книге Своей записывает, и воздаст им по делам их. Пророк Божий вопиет к таковым: «Горе тем, которые думают скрыться в глубину, чтобы замысл свой утаить от Господа, которые делают дела свои во мраке и говорят: «Кто увидит нас ? и кто узнает нас?"» ( Ис 29:15 ). «Может ли человек скрыться в тайное место, где Я не видел бы его ? – говорит Господь. Не наполняю ли Я небо и землю? – говорит Господь» ( Иер 23:24 ).'
      cn: 人们若想行不法之事，便寻求隐秘之处。淫乱者与盗贼喜好黑夜与幽暗。贪利者与受贿者暗中收受贿赂。狡诈者、诡计者、谄媚者、伪善者和恶毒者，将他们的邪恶藏于内心，在黑暗中行一切黑暗之事，如同黑暗之子。「凡作恶的便恨恶光，并不来就光，恐怕他的行为受责备，因为他们是邪恶的。」 （约翰福音 3:20）所有这些人试图隐藏自己，然而这些可怜之人却自欺欺人，因为他们能躲开世人，却无法在任何地方、以任何方式躲避上帝——祂是光，比一切光更明亮，是他们恶行的见证者。因祂与他们同在各处，祂看见他们一切的恶行，并记录在祂的书中，且将按他们所行的报应他们。上帝的先知向这些人呼喊：「祸哉那些深藏密谋，要向上主隐瞒他们的计谋，在黑暗中行事，并说：『谁看见我们？谁认识我们？』的人！」 （以赛亚书 29:15）「人岂能藏匿于隐秘之处，使我看不见他吗？——上主说。我岂不充满天地吗？——上主说。」 （耶利米书 23:24）
  - type: paragraph
    text:
      ru: 'Ты держи в уме всегда вышеприведенное слово: «Куда пойду отДуха Твоего» , и прочее, – и то, что от Бога не только в доме, во тьме, в ночи, в земле и под землей, в глубине и в аду, но и в тайне сердца скрыться невозможно, ибо «все обнажено и открыто перед очами Его» ( Евр 4:13 ).'
      cn: 你当常常牢记以上所引的话语：「我往何处去躲避祢的灵？」（诗篇 139:7）等等，并且，在上帝面前，不仅在屋中，在黑暗里，在夜间，在地上和地底下，在深渊和地狱里，即使在隐秘的心灵深处，也无法隐藏，因为「万物在祂眼前都是赤露敞开的」（希伯来书 4:13）。
  - type: paragraph
    text:
      ru: Также, когда захочешь что-либо сделать, вспомни, что Бог знает, ради чего ты хочешь это делать и для чего. Если уклоняешься от зла и творишь добро, то подумай еще, что и какая цель тебя к тому побуждает, а именно, Божия воля и честь, или своя польза, и людская похвала, и тщеславие; страх Божий, или страх человеческий, – все это Бог знает. Знай точно, что все то Богу неугодно, что не ради Бога делается. Потому и от зла уклоняться, и добро творить должно ради Бога, потому что Он одно запретил, а другое повелел, одного не хочет, а другого хочет, одним оскорбляется, а другим благоугождается. И человеку, как видим, неприятно то, что не ради него делается, а тем более Богу, Который тонко и совершенно проницает дела наши и начинания.
      cn: 此外，当你想要做任何事的时候，记着，上帝知道你想要做这事的目的是什么，以及为了什么。如果你规避邪恶，并行善，那么还要思考，是什么目的促使你如此行，亦即，是上帝的旨意和荣耀，抑或自己的益处、人的称赞和虚荣；是敬畏上帝，抑或惧怕世人——所有这些，上帝都知晓。你当确切地知道，凡不是为了上帝而做的，都不能令上帝喜悦。因此，无论是规避邪恶，还是行善，都应当为了上帝而做，因为祂禁止了这事，却命令了那事，祂不愿这事，却愿那事，祂因这事而受冒犯，却因那事而蒙悦纳。正如我们所见，人也对不是为他而做的事感到不悦，更何况是上帝呢，祂精微而完全地洞察我们的行为和意图。
  - type: paragraph
    text:
      ru: Итак, надо исправить сердце и учить его, чтобы воле Божией покорялось и волю Божию любило, и ей следовало, а не своему мудрованию и похотению. Рассуждай об этом, и что творишь и начинаешь творить, то все к этому правилу прикладывай.
      cn: 所以，需要修正心灵并教导它，使其顺服于上帝的旨意，爱慕上帝的旨意，并遵循它，而非自己的智虑和私欲。思量此事，凡你所行及将要开始行作的一切，都要以此为准则。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 41 – 50
    cn: 书信 41 – 50
  children:
  - type: paragraph
    text:
      ru: Ныне хочу немного тебе написать о премудрости Божией, или точнее, подивиться о ней. Да будет мне в том предводителем сама ипостасная Божия премудрость – Иисус Христос, «Который сделался для нас премудростью от Бога» ( 1Кор 1:30 ).
      cn: 如今，我想稍微给你写一点关于上帝的圣智，或者更准确地说，是惊叹于她。愿那具位格的上帝圣智——耶稣基督，「祂为我们成了上帝的智慧」（哥林多前书 1:30）——成为我在这事上的向导。
  - type: paragraph
    text:
      ru: 'Премудрость Божию познаем из создания и устроения мира и дивного о нем Промысла; видим и в святом Его слове, где различно она нам представляется. Пророк поет Ему: «Все премудростью Ты сотворил» ( Пс 103:24 ). «Господь премудростью основал землю, небеса утвердил разумом» ( Притч 3:19 ).'
      cn: 我们从世界的创造与安排、以及祂对世界的奇妙护理中认识上帝的智慧；我们也在祂的圣言中看到，祂在其中以不同的方式向我们显现。先知歌颂祂说：「祢以智慧创造了这一切」（诗篇 103:24）。「上主以智慧奠立了大地，以悟性坚立了诸天」（箴言 3:19）。
  - type: paragraph
    text:
      ru: 'Дивное смотрение ее видим в твари: нет ничего из сотворенного, что бы не было устроено к надлежащей цели и пользе нашей и славе Самого Творца. Для солнца устроил Творец непрестанное течение, и приближение к нам, и удаление от нас: «солнце познает запад свой» ( Пс 103:19 ), – чтобы оно то ночь, то день, то утро, то вечер делало. Заходит солнце – и оставляет ночь для упокоения нам и скотам нашим. Восходит солнце – и пробуждает нас к деланию. «Выходит человек на дело свое, и на делание свое до вечера» ( Пс 103:23 ).'
      cn: 我们看到，祂奇妙的护理体现在受造物中：没有一样受造之物不是被精心安排，以达到其应有的目的，造福我们，并归荣耀于创造主自身。创造主为太阳安排了不停息的运行，它或靠近我们，或远离我们：『太阳知道自己的西沉之处』（诗篇 103:19），好使它带来黑夜、白昼、清晨和黄昏。太阳西沉——并留下黑夜，供我们和我们的牲畜安歇。太阳升起——并唤醒我们投入劳作。『人出去做他的工，劳碌直到晚上』（诗篇 103:23）。
  - type: paragraph
    text:
      ru: Отходит от нас солнце на юг – и оставляет нам осень и зиму, и делается свободный путь через реки, озера и болота, морозом стянутые, и остается земля и земледельцы в покое. Земля снегом, как одеянием, покрытая почивает, и готовит себя к произведению плодов своих, а земледельцы собирают в покое новые силы и ждут наступающей весны. Приближается к нам солнце – и делает весну и лето. Земля почившая, и напоенная влагой снежной, и лучами солнца согретая, производит плоды свои, одевается благоцветущими травами и подает нам, как мать сосцы свои чадам, вкушать благости и щедрот Божиих, которыми обогатил ее Творец всех.
      cn: 太阳向南远去，离开我们，留下秋与冬。冰霜冻结，使得通过河流、湖泊和沼泽的道路畅通无阻，大地与农夫得以安息。大地被白雪如同衣袍般覆盖，安歇着，预备着结出自己的果实。而农夫们则在安息中积蓄新的力量，等待着即将到来的春天。太阳靠近我们，带来春与夏。安歇过的大地，被雪水滋润，又被阳光温暖，生长出它的果实，穿上繁茂花草的衣裳，并如同母亲将乳房给孩子一样，将它赐给我们，好叫我们品尝上帝的良善与慷慨，这些都是万物的创造者所赐予，使大地丰盛富足的。
  - type: paragraph
    text:
      ru: 'Так устроила дивная премудрость Божия, чтобы все дивным Его созданием и устроением пользовались. Солнце высоко постановил Творец, чтобы всю поднебесную просвещало. Тончайший воздух сотворил, чтобы солнце сквозь него на землю лучи свои испускало и птицы удобно по нему летали. Без воздуха невозможно животным жить, плодам расти, поэтому воздух к оживлению всего дивная премудрость Божия устроила, а без воздуха все бы исчезло. Луну сотворил для различения и познания времен: «Он сотворил луну для (указания) времен» ( Пс 103:19 ). Звезды сотворил для сияния в ночи и прочих причин, астрономам известных. Земля создана плотной, толстой и твердой, чтобы была обиталищем людей и скотов; плодовитой, чтобы, как мать, питала плодами своими людей и скотов. Деревья насадил на земле, чтобы мы имели чем созидать дома наши и согревать их; леса и дубравы, чтобы были жилищем для зверей. Озера, реки и источники создал, чтобы напаивали нас и скотов наших. Травы насадил, чтобы служили для врачевания немощей наших и для насыщения скотов наших. Огонь подал нам для устроения хлеба, варения пищи и согревания покоев наших. Так и прочие твари устроил премудрый и благой Создатель наш для доброй цели; и нет такой вещи, которая не была бы создана для нашей пользы. Самая последняя вещь, если возьмешь ее в рассуждение, подаст тебе повод весьма удивляться премудрости и благости Божией, так что с пророком убедишься исповедаться Ему: «Все премудростью Ты сотворил» ( Откр 4:11 ).'
      cn: 上帝奇妙的智慧如此安排，为使万物享用祂奇妙的创造和安排。造物主将太阳高高设立，为要普照整个穹苍。祂创造了至为精微的空气，为要使太阳借它将光芒射向大地，并使飞鸟在其间自由翱翔。没有空气，动物便无法生存，果实也无法生长；因此，上帝奇妙的智慧安排空气以滋养万物生机，而没有空气，万物都将消逝。祂创造月亮，为要辨别和认识时节：「祂造月亮为定节令」（诗篇 103:19）。祂创造众星，为在夜间发光，以及天文学家所知的其他原因。大地被造得密实、厚重而坚固，为要成为人类和牲畜的居所；又被造得丰饶多产，为要像母亲一般，以其果实滋养人类和牲畜。祂在大地栽种树木，为使我们有材料建造房屋并为之取暖；祂创造森林和橡树林，为要成为野兽的居所。祂创造湖泊、河流和泉水，为要滋润我们和我们的牲畜。祂栽种草药，为要治疗我们的疾病，并为喂饱我们的牲畜。祂赐予我们火，为制作面包，烹煮食物，并取暖我们的居室。照样，我们智慧又良善的造物主安排了其他受造物，为着良善的目的；没有任何一样事物不是为我们的益处而被造的。即便是最微小的事物，若你加以思量，都会让你有理由无比惊叹于上帝的智慧和良善，从而你会与先知一同，确信不疑地向祂颂扬：「祢用智慧创造了这一切」（启示录 4:11）。
  - type: paragraph
    text:
      ru: Но Тот же премудрый и преблагой Создатель как премудро сотворил мир, так премудро и промышляет о сотворенном мире, и все дивно к надлежащим целям направляет. Возьмем здесь в рассуждение историю о святом Иосифе и удивимся дивному о нас Божию смотрению и Промыслу, о котором в книге Бытия и псалме 104 поминается.
      cn: 但这位全智且至善的创造主，祂如何以智慧创造世界，就如何以智慧护理所创造的世界，且奇妙地将万物导向合宜的目的。在此我们思考圣约瑟的故事，并惊叹上帝对我们奇妙的眷顾和护理，这在《创世记》和《诗篇》104篇中有所提及。
  - type: paragraph
    text:
      ru: Позавидовали ему братья его, так как он весьма был любим отцом по причине своего добронравия. Ибо зависть всегда благополучию другого завидует и тогда исчезает, когда проходит благополучие его. Продали святую и непорочную душу в Египет. Сделался рабом в доме Пентефрия египтянина. Оклеветан неповинный похотливой женщиной, и ввергнут в темницу, и сидел в узах праведный. В то время увидел сны дивные Фараон, и не нашлось никого, кто бы их царю рассудил и истолковал. Тогда поведали ему об Иосифе, искусном в таком деле, но заключенном в темнице. Извели из темницы Иосифа по повелению цареву, истолковал сны царю и предвозвестил прежде урожай, а потом голод. Познал и признал царь истинным толкование его, как и было оно истинным, уразумел, что в Иосифе Дух Божий живет и что он способен к управлению царством его, и поставил его господином всего Египта. И собрал Иосиф довольно и преизобильно хлеба во время урожая, и пропитал во время голода не только Египет, но и дом отца своего.
      cn: 他的兄弟们嫉妒他，因为他因着自己正直善良的品德，非常蒙父亲所爱。因为嫉妒总是嫉妒他人的福祉，并且在那人的福祉消逝时便随之消失。他们将这圣洁无瑕的灵魂卖到埃及。他在埃及人波提乏的家中成了奴隶。这无辜者被一个淫荡的女人诬陷，被投入监狱，这义人身陷囹圄。那时，法老做了奇特的梦，却找不到任何人能为王解梦和阐释。于是有人告诉他关于约瑟的事，他精通此事，但却被囚禁在监狱里。约瑟遵照王的命令从监狱里被带出来，为王解梦，并预言先有丰收，后有饥荒。王认识并承认他的解释是真实的，正如它确实是真实的；他明白圣灵住在约瑟里面，并且约瑟有能力管理自己的国家，于是立他为全埃及的主宰。约瑟在丰收时积蓄了足够并极其丰盛的粮食，并在饥荒时，不仅供养了埃及，也供养了他父亲的家。
  - type: paragraph
    text:
      ru: 'Об этом в Псалме 104-м так написано: «И Он призвал голод на землю: всякий стебель хлебный истребил. Послал пред ними (праотцами) человека: в рабы продан был Иосиф. Стеснили оковами ноги его, в железо вошла душа его, пока не пришло (во исполнение) слово его, слово Господне воспламенило его. Послал (за ним) царь, и разрешил его; владетель народов, и освободил его. Поставил его господином над домом своим и правителем над всем владением своим, чтобы он наставлял вельмож его, как себя, и старейшин его учил мудрости» .'
      cn: '关于此事，在诗篇一百零四篇中如此写道：


        「上主又使饥荒临到那地：祂毁灭了一切粮食。在他们（列祖）之前，祂差遣了一人：约瑟被卖为奴。人用脚镣伤了他的脚，他的魂进入铁中，直到他的话语得以应验，上主的话语试炼了他。王差遣人解救了他，列邦的统治者释放了他。立他为自己家中的主宰，治理他一切的产业，使他能随己意教导他的大臣，又将智慧教导他的长老们。」'
  - type: paragraph
    text:
      ru: 'Видим здесь премудрый и дивный Промысл Божий о рабе Своем и о людях Своих. Братья его умышляли против него зло, но Бог это обратил ему в добро, и всем людям в добро, как сам же Иосиф признал это. «И сказал» (братьям) «Иосиф: не бойтесь, ибо я боюсь Бога; вот, вы умышляли против меня зло; но Бог обратил это в добро, чтобы сделать то, что теперь есть: сохранить жизнь великому числу людей» ( Быт 50:19–20 ).'
      cn: 我们在此见证上帝对他仆人以及祂子民的至智而奇妙的眷顾。他的兄弟们蓄意对他行恶，但上帝却将此转变为他的善，并为所有的人转变为善，正如约瑟夫本人所承认的。 «约瑟夫对（他的兄弟们）说：「你们不要害怕，因为我敬畏上帝。你们原是蓄意对我行恶，但上帝却将它转为善，为要成就今日之事：保存了许多人的性命。」（创世记 50:19-20）
  - type: paragraph
    text:
      ru: 'При рассуждении о премудрости Божией учимся:'
      cn: 在思索上帝的智慧时，我们学习：
  - type: paragraph
    text:
      ru: 1) Предавать себя Промыслу Его и не волноваться умом туда и сюда, но ждать конца в напастях наших.
      cn: 将自己交托于祂的摄理，不让心思随处飘摇，而要在我们的患难中静候结局。
  - type: paragraph
    text:
      ru: 2) Учимся терпению в злострадании и носить крест, на нас от Него возложенный.
      cn: 2) 我们学习在苦难中忍耐，并背负祂加诸在我们身上的十字架。
  - type: paragraph
    text:
      ru: 3) Учимся надеяться не на себя, и князей века, и прочие создания, но на Него, ибо Он один может нам помочь.
      cn: 3) 学习不仰赖自己、今世的君王以及其他受造物，乃是仰赖祂，因为唯独祂能帮助我们。
  - type: paragraph
    text:
      ru: 4) Учимся и сами дела наши с помощью Его направлять к доброй цели, то есть к славе имени Его святого.
      cn: 4) 我们学习借由祂的帮助，将我们自己的作为导向良善的目标，即是导向祂圣名的荣耀。
  - type: paragraph
    text:
      ru: 5) Учатся власти подвластных, господа рабов, родители чад наказывать для доброй цели, то есть для исправления и созидания их, тело и плоть их свирепеющую сокрушать, но душу исправлять.
      cn: 5) 掌权者学习管教属下，主人学习管教奴仆，父母学习管教儿女，为着良善的目的，亦即为了修正和造就他们，摧毁他们凶猛的肉体与血肉，但要修正他们的灵魂。
  - type: paragraph
    text:
      ru: '6) Все христиане должны внимать апостолу: «Итак, смотрите, поступайте осторожно, не как неразумные, но как мудрые, дорожа временем, потому что дни лукавы» ( Еф 5:15–16 ).'
      cn: 6) 所有的基督徒都应当聆听使徒的话：「所以，你们要谨慎行事，不要像愚昧人，却要像智慧人，爱惜光阴，因为时日邪恶。」（以弗所书 5:15-16）
  - type: paragraph
    text:
      ru: Рассуждай об этом и поучайся в том. Премудрый и преблагой Иисус да умудрит нас во спасение наше.
      cn: 默想此事并从中受教。愿至智至善的耶稣，赐予我们得救的智慧。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Ты спрашиваешь, в чем состоит мудрость христианская?
      cn: 你问，基督教智慧何在？
  - type: paragraph
    text:
      ru: 'Ответ:'
      cn: 回答：
  - type: paragraph
    text:
      ru: 1) Знать Бога и почитать Его.
      cn: 1) 认识上帝并尊崇祂。
  - type: paragraph
    text:
      ru: 2) Держать внутри себя, что Он как твой, так и мой Бог, хотя и всех есть Бог.
      cn: 在心中持守祂既是你的，也是我的上帝，尽管祂也是所有人的上帝。
  - type: paragraph
    text:
      ru: '3) Что как мне, так и тебе Он повелевает: уклоняйся от зла и твори благое, хотя и всем то же повелевает.'
      cn: 3) 祂命令我和你：远离邪恶，行善；尽管祂也同样命令众人。
  - type: paragraph
    text:
      ru: 4) Слушать Его как Господа и Царя своего и волю Его исполнять.
      cn: 4) 听从祂，视祂为自己的主和君王，并遵行祂的旨意。
  - type: paragraph
    text:
      ru: 5) Ходить пред Ним с осторожностью, ибо Он все видит, и на всех смотрит, и испытывает сердца и утробы, испытывает праведного и нечестивого. Ходить, говорю, пред Ним так, как ходят ученики пред учителем, дети пред родителями, рабы пред господами, подвластные пред властью.
      cn: 5) 在祂面前行走，要谨慎小心，因为祂洞察一切，审视每一个人，并察验人心和肺腑，祂察验义人与恶人。我说，要在祂面前如此行走，如同门徒在师长面前行走，儿女在父母面前行走，奴仆在主人面前行走，臣服者在权柄面前行走。
  - type: paragraph
    text:
      ru: 6) Жить в мире этом и обращаться так, как странник, пришелец и путник.
      cn: 6) 生活在这世上，举止如同客旅、寄居者和行路人。
  - type: paragraph
    text:
      ru: 7) Опасаться всего, как птица сидит и опасается, туда и сюда посматривая, дабы не поймали, или не подстрелили. Ибо многие враги окружают нас и хотят уловить в сеть свою.
      cn: 7) 警惕一切，如同雀鸟栖息，常怀戒惧，左顾右盼，以免被捕获，或被射中。因为众多的仇敌环伺着我们，并欲将我们诱入他们的网罗。
  - type: paragraph
    text:
      ru: 8) Ни к чему в мире сердца своего не прилагать, ни к богатству, ни к чести, ни к славе, ни к роскоши, тем более не искать того.
      cn: 8) 不将己心系于世间万物，不系于财富，不系于尊荣，不系于荣耀，不系于奢华，更不可寻求这些。
  - type: paragraph
    text:
      ru: 9) Довольствоваться тем, что Бог подает, и благодарить Его за то. «Имея пропитание и одежду, будем довольны тем» ( 1Тим 6:8 ).
      cn: 9) 知足于上帝所赐予的，并为此感谢祂。「有了吃穿，就当知足。」（提摩太前书 6:8）
  - type: paragraph
    text:
      ru: 10) Доколе время имеем, делать всем добро ( Гал 6:10 ).
      cn: 10) 趁着还有机会，向众人行善。（加拉太书 6:10）
  - type: paragraph
    text:
      ru: 11) Говорить, что должно и нужно, и когда должно; и молчать о том, что говорить не должно, и когда не должно.
      cn: 11) 说话，说那些该说且必要之事，并在该说之时说；对于那些不该说的，以及在不该说之时，则要保持沉默。
  - type: paragraph
    text:
      ru: 12) В мире жить телом, но умом отлучаться к вечности. Часто поминать смерть, суд Христов, вечную смерь и вечную жизнь.
      cn: 12) 肉身居于尘世，但意念当归向永恒。常常思念死亡、基督的审判、永恒的死亡与永恒的生命。
  - type: paragraph
    text:
      ru: 13) Не быть никогда в праздности, но делать что-нибудь полезное, а только упраздняться от злых дел, слов и помыслов. Ибо только эта одна праздность нам полезна.
      cn: 13) 绝不虚度光阴，却要有所裨益，而唯独要远离邪恶的行为、言语和意念。因为唯独这种「虚度光阴」于我们有益。
  - type: paragraph
    text:
      ru: 14) Крайне беречься, чтобы не подать соблазна ближнему.
      cn: 务必格外谨慎，以免使近人跌倒。
  - type: paragraph
    text:
      ru: Это есть христианская и истинная мудрость. «Начало» же «премудрости страх Господень» ( Сир 1:15 ).
      cn: 这正是基督徒的真实智慧。「智慧的开端诚然是敬畏上主」（德训篇 1:15）。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Желая тебе предложить (рассуждение) о правде Божией, вспоминаю и суд Божий праведный, который будет в последний день, и потому пишу дрожащей рукой. Ибо как благость Его утешает и ободряет, так правда Его в страх и трепет приводит не только нас, грешных, но и святых Его.
      cn: 想要向你献上关于上帝公义的论述，我也忆起那将在末日降临的、上帝公义的审判，因此我执笔颤抖。因为正如祂的良善安慰并鼓舞着，祂的公义也使人惧怕战兢，不仅是我们这些罪人，甚至祂的圣徒亦然。
  - type: paragraph
    text:
      ru: Правда Его в том состоит, что Он всем воздает по делам их. Правда Божия познается из наказаний своевольных и беззаконных людей, и защиты благочестивых и богобоящихся людей. Об этом во многих местах Святого Писания, особенно Ветхого Завета, читаем и видим. Наиболее же явно откроется и познается (правда Божия) в день Страшного Суда Христова. Ибо не все своевольные здесь наказание принимают, но иные соблюдаются (для наказания) на тот день. Тогда всякому воздастся по делам его. Хотя ныне и свирепеют ненаказанные люди, и мечтают, что с них того не взыщется, однако же не избегнут тогда суда Божия, который будет для них тем страшнее, чем дольше ожидала их покаяния благость Божия. Ибо таковые сами «себе» собирают «гнев на день гнева и откровения праведного суда от Бога» ( Рим 2:5 ), по апостольскому учению.
      cn: 祂的公义在于，祂按照各人的行为报应各人。上帝的公义，从祂对恣意妄为和不法之人的惩罚，以及对虔敬和敬畏上帝之人的保护中得以认识。关于这一点，我们在圣经的许多地方，尤其是在旧约中，读到并看到。然而，上帝的公义最清楚地显明并得以认识，是在基督的末日审判之日。因为并非所有恣意妄为的人在此世都受到惩罚，但有些人则被保留（以受惩罚）到那一天。那时，各人必将按照自己的行为得到报应。尽管如今那些未受惩罚的人依然作恶多端，并且妄想那一切不会向他们追讨，然而，那时他们绝不能逃脱上帝的审判；这审判对他们来说，将因上帝的慈爱等候他们悔改的时间越长而越发可怖。因为这样的人，依照使徒的教导，自己『为自己』积蓄『忿怒，直到那震怒之日和上帝公义审判显明之时』（罗马书 2:5）。
  - type: paragraph
    text:
      ru: 'Познание и чувствование правды Божией приводит человека:'
      cn: 认识并体悟上帝的真理，使人：
  - type: paragraph
    text:
      ru: 1) В страх, так что будет трепетать суда Божия.
      cn: 1) 在敬畏中，以致将要战兢于上帝的审判。
  - type: paragraph
    text:
      ru: 2) В покаяние и познание грехов и сокрушение. Ибо если за слово праздное воздадут люди ответ в день суда ( Мф 12:36 ), то тем более за прочие тяжкие грехи.
      cn: 2) 进入悔改，认识罪以及痛悔。因为，如果人要为一句闲话在审判日交账（马太福音 12:36），那么，更何况是为了其他沉重的罪呢？
  - type: paragraph
    text:
      ru: '3) Возбуждает воздыхание сердечное и молитву, так что с пророком будет вопить ко Господу: «Не входи в суд с рабом Твоим, ибо не оправдается пред Тобою никто из живых» ( Пс 142:2 ).'
      cn: 3) 引动心灵的叹息与祷告，以至于与先知一同向上主呼求说：「不要与祢的仆人进入审判，因为在祢面前，凡活着的，没有一人能称义。」（诗篇 142:2）
  - type: paragraph
    text:
      ru: '4) Приводит к терпению, так как человек, когда здесь наказывается как-нибудь, признавать будет, что достойно наказывается, говоря с Псаломником: «Праведен Ты, Господи, и праведны суды Твои» ( Пс 118:137 ). Итак, признавая свою виновность и Божие праведное наказание, покроет молчанием уста свои. Ибо Бог никого не обидит, но, что ни делает, праведно делает.'
      cn: 4) 引致忍耐，因为人在此世受到某种惩罚时，会承认自己是受罚得当的，正如圣咏作者所言：「祢是公义的，上主，祢的审判也是公义的」（诗篇 118:137）。因此，当人承认自己的罪过以及上帝公义的惩罚时，就会缄默其口。因为上帝不会冤枉任何人，祂所行的一切都是公义的。
  - type: paragraph
    text:
      ru: 5) Рассуждая о Божией правде и своей виновности, не только будет терпеть приключающееся зло, но и будет желать и просить, чтобы здесь наказан был, дабы с миром не осудиться. Ибо лучше здесь кратко и легко наказанным быть, нежели там вечно и жестоко. Рассуждай же о правде Божией и будешь неподвижен ко всякому бесчинному деянию, страхом, как гвоздями, пригвожден. Рассуждай о правде Божией, и будешь с усердием каяться за прежние грехи, будешь воздыхать и молиться усердно об отпущении грехов, будешь терпеть всякое приключившееся бедствие.
      cn: 5) 默想上帝的公义和自己的罪愆，他不仅会忍受临到自身的祸患，而且会渴望并祈求在此世受罚，以免在彼世与世人一同被定罪。因为在此世短暂且轻微地受罚，远胜于在彼世永远且严酷地受罚。默想上帝的公义吧，你就会对一切放肆的行径坚定不移，被恐惧如同被钉子一般牢牢钉住。默想上帝的公义吧，你就会为过去的罪过热切忏悔，就会为罪得赦免而热切叹息和祈祷，就会忍受一切临到自身的灾祸。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: За что, спрашиваешь, люди благочестивые наказываются и страдают здесь, как видим и в Писании читаем?
      cn: 你问道，为什么虔诚的人们在这里受惩罚并受苦，如同我们所见的，并在圣经中所读到的呢？
  - type: paragraph
    text:
      ru: Ответ.
      cn: 答。
  - type: paragraph
    text:
      ru: '1) И благочестивые люди не без греха, а грех без наказания не бывает, поэтому и благочестивые здесь наказываются Богом, чтобы там не быть наказанными. Об этом апостол говорит: «Будучи же судимы, наказываемся от Господа, чтобы не быть осужденными с миром» ( 1Кор 11:32 ).'
      cn: 1) 甚至虔敬之人也并非无罪，而罪恶不会没有惩罚，因此，虔敬之人在世间受上帝惩罚，是为了不至在那边受罚。关于此，使徒说：「我们受审判的时候，是受上主的管教，免得我们和世人一同定罪。」 (1哥林多前书 11:32)
  - type: paragraph
    text:
      ru: '2) Благочестивым Бог посылает наказание из любви, а не от гнева. Как отец наказывает чад своих: наказывает их, но не умерщвляет, бьет, но не убивает. Об этом наказании говорит апостол: «Господь, кого любит, того наказывает; бьет же всякого сына, которого принимает. Если вы терпите наказание, то Бог поступает с вами, как с сынами. Ибо есть ли какой сын, которого бы не наказывал отец» ( Евр 12:6–7 )? И здесь правда Божия показывается, которая и малых грехов не оставляет без наказания, хотя с милостью и человеколюбием соединена.'
      cn: 2) 上帝施予虔敬之人管教，乃是出于爱，而非出于愤怒。如同父亲管教自己的子女：他管教他们，却不致他们于死地；他鞭打他们，却不杀害。关于这管教，使徒说：「上主爱谁，就管教谁；凡祂所收纳的儿子，祂都鞭打。你们若忍受管教，上帝待你们如同儿子。因为哪有儿子不受父亲管教的呢？」(希伯来书 12:6-7) 在此也彰显了上帝的公义，祂甚至连微小的罪过也不放过，使其不受管教，尽管这公义与怜悯和爱人如己之心结合在一起。
  - type: paragraph
    text:
      ru: 3) На нечестивых изливает гнев ярости Своей, и «истребит память их на земле» , и, лишая временной жизни, лишает и вечной. Такое наказание постигло содомлян, при Ное живших, Фараона и прочих.
      cn: 3) 向不敬虔者倾泻祂的烈怒，并「剪除他们在地上的记念」，并且剥夺了他们暂时的生命，也剥夺了他们永恒的生命。这样的惩罚临到了索多玛人，在挪亚时代生活的人，法老以及其他人。
  - type: paragraph
    text:
      ru: Рассуждай об этом и берегись греха, который и временное и вечное наказание за собой влечет.
      cn: 思量此事，并谨防罪恶，其招致暂时的和永远的惩罚。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Ты спрашивал, что значат слова апостола: «Который» (Христос) «предан за грехи наши» ( Рим 4:25 )?'
      cn: 你问过使徒的这些话是什么意思吗：「祂」（基督）「为我们的罪被交出」（罗马书 4:25）？
  - type: paragraph
    text:
      ru: 'Ответ: и здесь правда Божия нам открылась. Мы все согрешили и достойны были вечного наказания, но Христос Сын Божий волей Своей и благоволением Небесного Своего Отца взял грехи наши на Себя и наказание за грехи и потому «изъязвлен был за грехи наши и мучим за беззакония наши» ( Ис 53:5 ). Христос неповинен был: «Он не сделал никакого греха, и не было лести в устах Его» ( 1Петр 2:22 ). Наказан же Христос Спаситель наш за наши грехи, чтобы мы, верующие в Него, навечно не были наказаны. Здесь видим правду Божию, Христовым страданием восполненную, а к нам, согрешившим, неизреченную Божию благость и человеколюбие. Слава щедротам Его безмерным, которым себя и тебя поручаю.'
      cn: 答：就在这里，上帝的公义向我们显明了。我们都犯了罪，理当承受永恒的惩罚，但上帝之子基督出于祂自己的意愿和祂天父的恩慈，将我们的罪孽和罪所当受的惩罚都担在了自己身上，因此「祂为我们的过犯受害，为我们的罪孽压伤」（以赛亚书 53:5）。基督是无辜的：「祂没有犯过罪，口里也没有诡诈」（彼得前书 2:22）。我们的救主基督受罚，正是为了我们的罪孽，好使我们这些信靠祂的人，不至永远受罚。在这里，我们看到了上帝的公义，借着基督的受难得以成全；而对于我们这些罪人，则彰显了上帝不可言喻的恩慈与爱人如己的仁慈。荣耀归于祂无限的慷慨怜悯，我将我自己和你都托付于此。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: В страдании Христовом видим и премудрость Божию, которая там изобрела путь ко спасению нашему, где, казалось, не было пути. Бог праведен и благ. Поскольку Он благ, то хотел спасти погибший род человеческий, а поскольку праведен, то нужно было Ему не оставить грех человеческий без наказания. Ибо несходно было бы с правдой Его – грех оставить без казни. Здесь премудрость Божия изобрела и устроила так, что и грех без наказания не остался, ибо Сын Божий за грех пострадал, и род человеческий спасение получает, и так страдание Христово и правду Божию и благость Божию утвердило. За это благодарим и поклоняемся человеколюбивому и премудрому Богу нашему, и хвалим святое имя Его, да сподобит и нас, грешных, Своего человеколюбия, которому как себя, так и тебя, и всех, имя Его нарицающих, поручаю.
      cn: 在基督的苦难中，我们也看到上帝的智慧，祂在那里为我们的救赎开辟了道路，在那看似无路可寻之处。上帝公义且良善。既然祂是良善的，祂就愿意拯救失丧的人类；而既然祂是公义的，祂就不能不惩罚人类的罪过。因为任凭罪不加刑罚，便与祂的公义不符。在此，上帝的智慧构思并安排，使罪过不致不受惩罚，因为上帝之子为罪受苦，而人类也因此获得了救赎。如此，基督的苦难印证了上帝的公义与良善。为此，我们感谢并敬拜我们仁爱且智慧的上帝，并颂扬祂的圣名，愿祂也使我们这些罪人蒙受祂的仁爱。我将自己、你，以及所有求告祂圣名的人，都托付给祂。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Да подаст нам благой и человеколюбивый Бог ныне «вкусить и увидеть, сколь благ Господь» . Благость Божию почти все Святое Писание нам проповедует, и почти нет такой главы, в которой бы о ней не упоминалось. Ибо знает сердцеведец Бог слабость сердец наших, и удобное к отчаянию поползновение, и хитрость лукавых духов, поэтому везде о благости Своей и человеколюбии к нам напоминает.
      cn: 愿良善且仁爱的上帝今时赐予我们，『尝尝看，便知道上主是何等美善。』（诗篇 34:8）上帝的美善，几乎整部圣经都向我们宣讲，几乎没有一章不提及它。因为鉴察人心的上帝深知我们内心的软弱，以及我们易于陷入绝望的倾向，并邪恶之灵的狡诈，因此在各处都提醒我们祂对我们的美善与仁爱。
  - type: paragraph
    text:
      ru: Благость Божия показывается от дел Его.
      cn: 上帝的良善从祂的作为中显示出来。
  - type: paragraph
    text:
      ru: 1) Что Он «повелевает солнцу Своему восходить над злыми и добрыми и посылает дождь на праведных и неправедных» ( Мф 5:45 ).
      cn: 祂「使祂的日头照恶人，也照善人；并降雨给义人，也给不义的人」（马太福音 5:45）。
  - type: paragraph
    text:
      ru: '2) Что он грешника не тотчас казнит, но ожидает его покаяния, как говорит апостол: «Благость Божия ведет тебя к покаянию» ( Рим 2:4 ).'
      cn: 2) 祂不立刻降罚于罪人，但等候他的悔改，正如使徒所言：「上帝的良善引领你走向悔改」（罗马书 2:4）。
  - type: paragraph
    text:
      ru: 3) Что кающегося благоприятно принимает и отпускает грехи ему ( Лк 15:4 ).
      cn: 3) 上帝欣然接纳悔改者并赦免他的罪 (路加福音 15:4)。
  - type: paragraph
    text:
      ru: 4) Что согрешившего наказывает, но милостиво и человеколюбиво.
      cn: 4) 祂惩罚犯罪者，但慈悲且仁爱。
  - type: paragraph
    text:
      ru: 5) Что не гнушается молитвой нашей и пением и хвалением Тот, Которого со страхом воспевают и хвалят Ангелы, но даже призывает и велит молиться и просить у Него всего, что воле его угодно.
      cn: 5) 天使都怀着敬畏之心歌颂赞美的那一位，并不轻看我们的祷告、歌唱和赞美，反倒召唤并命我们向祂祷告、祈求一切合乎祂旨意的事物。
  - type: paragraph
    text:
      ru: 6) Что Сам удивительно и любезно в слове Своем святом с нами беседует. Читай Писание и увидишь, какой царь с подданными своими так поступает, как Бог наш с нами? Нет и не было такого еще на свете! «Вкусите и увидите, сколь благ Господь» ( Пс 33:9 ).
      cn: 6) 祂自己如此奇妙而慈爱地在祂的圣言中与我们交谈。阅读圣经你就会看到，有哪位君王对他的臣民如此行事，如同我们的上帝对我们所行的吗？世上没有，也从未有过这样的！«你们要尝尝看，上主何等良善» ( 诗篇 33:9)。
  - type: paragraph
    text:
      ru: '7) Более всего открылась благость Божия к нам в воплощении Единородного Сына Божия. Здесь все сокровища благости Его открылись, чего и постигнуть не можем. Об этом Спаситель наш Сам проповедует: «Так возлюбил Бог мир, что отдал Сына Своего Единородного, дабы всякий верующий в Него, не погиб, но имел жизнь вечную» ( Ин 3:16 ). Это есть Евангелие, это есть радостная весть, это есть надежда наша и жизнь вечная. Об этом дерзаем и хвалиться, этим заграждаем уста клеветникам нашим: Сын Божий Единородный ради нас в мир пришел, пострадал, и умер. «Если Бог за нас, кто против нас» ( Рим 8:31 )? Слава благоволившему Отцу и пострадавшему Сыну и Святому утешителю Духу. Да будет слава Господня во веки.'
      cn: 7) 上帝对我们最大的良善，彰显在独生上帝之子的道成肉身之中。在此，祂良善的一切宝藏都已彰显，其深广非我们所能领悟。关于这事，我们的救主亲自宣讲：「上帝爱世人，甚至将祂的独生子赐给他们，叫一切信祂的，不致灭亡，反得永生。」 (约翰福音 3:16) 这是福音，这是喜讯，这是我们的希望，也是永生。关于这事，我们也敢于夸口，以此堵住我们诽谤者的口：独生上帝之子为了我们降世，受难，并受死。「上帝若帮助我们，谁能敌挡我们呢？」 (罗马书 8:31) 荣耀归于施恩的父，受难的子，以及圣安慰者圣灵。愿上主的荣耀，直到永远。
  - type: paragraph
    text:
      ru: '8) Хотя здесь вкушаем и видим благость Божию, но преизобильно вкушать и видеть и наслаждаться будем в вечной жизни, по неложному Его обещанию: «Не видел того глаз, не слышало ухо, и не приходило то на сердце человеку, что приготовил Бог любящим Его (» 1Кор 2:9 ).'
      cn: 8) 尽管我们在此品尝并看见上帝的良善，但我们将在永生中极其丰盛地品尝、看见并享受祂的良善，这乃是按照祂那真实无伪的应许：「眼睛未曾看见，耳朵未曾听见，人心也未曾想到的，就是上帝为爱祂之人所预备的。」(哥林多前书 2:9)
  - type: paragraph
    text:
      ru: Рассуждение и вкушение благости Божией.
      cn: 明辨与品尝上帝的恩慈。
  - type: paragraph
    text:
      ru: 1) Воспламеняет любовь к Богу в сердце нашем. Ибо сама совесть убеждает любить Того, Кто нас любит и благотворит.
      cn: 燃起我们心中对上帝的爱。因为良心本身劝说我们去爱那爱我们并施恩于我们者。
  - type: paragraph
    text:
      ru: 2) Производит в сердце истинное благодарение Благодетелю.
      cn: 2) 在心中生发对恩主真实的感恩。
  - type: paragraph
    text:
      ru: 3) Производит неизреченную духовную радость и восклицание.
      cn: 3) 产生不可言喻的属灵喜乐和欢呼。
  - type: paragraph
    text:
      ru: 4) Производит истинную печаль ради Бога и на себя самого негодование в грешнике кающемся, потому что Бог грешнику благотворил, но он Благотворителя оскорблял и прогневлял, и благость Его безумно презирал. Об этом рассуждая, уязвится, как стрелой, печалью ради Бога, Благодетеля своего, им презренного.
      cn: 4) 在忏悔的罪人心中产生为上帝而生的真切忧伤，以及对自己的愤慨，因为上帝曾善待那罪人，但他却冒犯、惹怒了这位施恩者，并疯狂地蔑视了祂的良善。思量及此，他将如同被箭矢刺穿一般，因那被他所蔑视的施恩者——上帝——而生发的忧伤所重创。
  - type: paragraph
    text:
      ru: '5) Оттуда последует стыд за неблагодарность, который в покаянии нужен, как пророк исповедуется: «У Тебя, Господи, правда, а у нас на лицах стыд» ( Дан 9:7 ). Воистину стыд и срам нам подобает за то, что мы, будучи тварью, землею и пеплом, оскорбляем Творца своего, и по ничтожной своей подлости не осознаем величества Его, и к тому же, благодеяниями Его всегда насыщаемые, Благодетеля своего не благодарим. Бог нам благотворит, но мы не любим Его. Стыд и срам человеку, который человека – благодетеля своего не почитает и не любит. Насколько более стыдиться подобает нам, что мы Бога, Создателя, Промыслителя и Отца своего не любим и не почитаем. Вся тварь обличает нас в том, ибо со всяким усердием служит Ему как Творцу своему. Поэтому «у Тебя, Господи, правда, а у нас на лицах стыд» ( Дан 9:7 ).'
      cn: 5) 由此而生出因不感恩而有的羞愧，这种羞愧在悔改中是必需的，正如先知所忏悔的：「上主啊，公义在祢，我们脸带羞愧」（但以理书 9:7）。我们确实理当羞耻与羞辱，因为我们作为受造物、尘土与灰烬，竟亵渎我们的造物主，又因我们卑劣的微渺，未能明晓祂的威严；此外，我们常被祂的恩泽所饱足，却不感恩于我们的施恩者。上帝施恩予我们，但我们却不爱祂。不敬重亦不爱其施恩者之人，实当羞耻与羞辱。我们更当何等羞耻，因为我们不爱也不敬重我们的上帝、造物主、眷顾者和父。一切受造物都在此上指责我们，因为它们都以一切的勤恳侍奉祂，如同侍奉它们的造物主。所以，「上主啊，公义在祢，我们脸带羞愧」（但以理书 9:7）。
  - type: paragraph
    text:
      ru: 6) Последует терпение в наказании, так как признавать будет человек, что он достойно страждет наказание, как неблагодарный. Рассуждая о том, сколько благости Божией на него излито, и о своей к Богу неблагодарности, признает себя достойным всякого наказания.
      cn: 6) 随之而来的是对惩罚的忍耐，因为人会承认，他作为一个不知感恩者，所遭受的惩罚是理所应得的。思量着上帝的良善何等丰厚地倾注在他身上，以及他对上帝的不知感恩，他会承认自己配得一切的惩罚。
  - type: paragraph
    text:
      ru: 7) Последует уничижение самого себя и смирение, ибо признает себя недостойным никаких благодеяний Божиих, хотя и все это признавать должны. Ибо Бог даром блага Свои всем подает.
      cn: 7) 随之而来的将是贬抑自身和谦卑，因为他承认自己不配领受上帝的任何恩惠，尽管所有人都理当承认这一点。因为上帝白白地将祂的恩福赐予所有人。
  - type: paragraph
    text:
      ru: 8) Рассуждением о благости Божией утверждаемся в надежде, когда сатаной искушаемся и побуждаемся к отчаянию. Прилежное рассуждение о благости Божией не позволит отчаяться, ибо Бог, будучи благим, хочет всем спасения и не хочет смерти грешника.
      cn: 8) 当我们受撒旦试探并被引向绝望时，我们藉着对上帝良善的思虑，在希望中得以坚固。勤勉地思虑上帝的良善，将不允许我们绝望，因为上帝本是良善的，祂愿所有人得救，并不愿罪人死亡。
  - type: paragraph
    text:
      ru: 9) Кто ощущает на себе благость Божию, тот к ближним своим благ бывает. От благ Божиих, ему данных, уделяет братии своей, голодных питает, нагих одевает, и прочее, ибо знает, что все добро – Божие. Получая от Бога отпущение грехов и познавая на себе Его милосердие, сам милосердным к согрешившим бывает и прощает им согрешения. Воистину, если человек в рассуждение войдет, сколь великого милосердия он от Бога каждый день сподобляется, то не сможет немилосердным быть к ближнему, а особенно в прощении грехов.
      cn: 凡亲身感受上帝恩惠的人，也会善待他的近人。他将上帝所赐的恩惠，分给他的弟兄，喂饱饥饿者，穿上赤身者，等等，因为他知道一切美善都来自上帝。当他从上帝那里获得罪的赦免，并在自身体验到祂的怜悯时，他自己也对那些犯罪之人施予怜悯，并赦免他们的过犯。诚然，如果一个人深思熟虑，他每天从上帝那里蒙受多么大的怜悯，那么他就不能不对近人施予怜悯，尤其是在赦免罪过方面。
  - type: paragraph
    text:
      ru: Рассуждай же и вкушай благость Божию, но при том и вездесущие и всеведение, и правда Его да обращается пред душевными очами твоими.
      cn: 默想并品尝上帝的恩慈，然而与此同时，祢的无所不在、无所不知以及祢的公义，也当常在你心灵的眼目中。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Еще тебе о благости Божией напоминаю. Ничто так благость Его не показывает к нам, как долготерпение Его к грешникам.
      cn: 我再次提醒你上帝的恩慈。没有任何事物能像祂对罪人的恒忍那样，向我们彰显祂的恩慈。
  - type: paragraph
    text:
      ru: 'Сколько на свете есть идолопоклонников, которые славу Его отдают твари! Сколько хулителей, которые страшное и святое имя Его скверным языком бесчестят! Сколько разбойников, убийц, грабителей, насильников, прелюбодеев и прочих беззаконных, которые пред святыми Его очами закон Его святой бесстрашно разоряют!.. Но благость Божия долготерпит их, не казнит их, не воздает им по делам их, но ожидает их покаяния, как апостол написал: «Благость Божия ведет тебя к покаянию» ( Рим 2:4 ). И еще: «Долготерпит нас, не желая, чтобы кто погиб, но чтобы все пришли к покаянию» ( 2Петр 3:9 ). И не только долготерпит, но и благотворить не перестает. Подает пищу, одежду, и прочие блага.'
      cn: 世上有多少拜偶像者，将祂的荣耀归于受造之物！有多少亵渎者，竟以可畏而圣洁的祂之名，以污秽之口玷污！有多少强盗、杀人犯、掠夺者、施暴者、奸淫者以及其他不法之徒，在祂圣洁的眼目面前，竟毫无畏惧地败坏祂的圣法！……然而，上帝的良善却恒久忍耐他们，不惩罚他们，不照他们的行为报应他们，反而等候他们悔改，正如使徒所写：「上帝的良善引领你悔改」（罗马书 2:4）。又说：「祂恒久忍耐我们，不愿有一人沉沦，乃愿人人都来悔改」（彼得后书 3:9）。祂不仅恒久忍耐，而且施恩不辍。赐予食物、衣物以及其他诸般美善。
  - type: paragraph
    text:
      ru: Удивляйся благости Божией, и сам познавая на себе благость Божию, будь к братии твоей благ, кроток и человеколюбив. Благость Божия да подвигнет нас к тому, дабы не познать на себе правды Божией. А если кто злоупотребляет благостью Божией и не исправляет себя, тот правды Божией действие на себе познает. Благ Господь, воистину благ, но и праведен.
      cn: 惊叹上帝的良善，并且当你自己亲身体验到上帝的良善时，就要对你的弟兄们良善、温柔且充满仁爱。愿上帝的良善激励我们，使我们不至于亲身体验到上帝的公义。但若有人滥用上帝的良善，且不改正自己，那人就将亲身体验到上帝公义的作为。上主是良善的，确实是良善的，但祂也是公义的。
  - type: paragraph
    text:
      ru: Рассуждай об этом и, познавая на себе благость Божию, и правды Его не забывай.
      cn: 沉思此事，并亲身体认上帝的良善，也不要忘记祂的真理。
  - type: paragraph
    text:
      ru: Спасайся и о мне грешном молись.
      cn: 追求救恩，并为我这罪人祈祷。
  - type: paragraph
    text:
      ru: Пишешь, что видим мы и знаем, что без Промысла Божия ничего не бывает. Откуда же беды и напасти в мире?
      cn: 您写道，我们看到也知道，若无上帝的摄理，则一无所成。那么，世上的祸患和灾祸从何而来呢？
  - type: paragraph
    text:
      ru: 'Ответ: от Бога посылаются беды и напасти на нас, но и в этом удивительная благость показывается:'
      cn: 答：患难与灾祸从上帝降临在我们身上，但即使在这之中，奇妙的恩慈也显明出来：
  - type: paragraph
    text:
      ru: '1) Бог через слово Свое всех призывает к покаянию, как о том во многих местах Святого Писания читаем и в церквях слышим, но, когда люди не обращаются и не творят покаяния, Он посылает на них напасти, чтобы ими подвиглись к покаянию и взыскали Его. Видишь и здесь благость Божию. Бог, не желая нашей погибели, посылает на нас напасти: наказывает нас здесь, но не умерщвляет, исправляет, чтобы спаслись, а не погубляет. Бог и геенной в Писании Своем грозит нам, чтобы не впали в геенну. Видишь, какова цель посылаемых на нас напастей. Так делают и благочестивые власти, которые подданных своих не мучают, но наказывают, чтобы добрыми стали. Ибо многие напастями исправляются и спасаются, как читаем в книгах.'
      cn: 1) 上帝藉着祂的圣言呼召所有人悔改，正如我们在《圣经》多处所读，并在教会中所听闻的。然而，当人们不回转，不实行悔改时，祂便将灾祸降于他们，借此使他们被感动而悔改，并寻求祂。在此，你亦可见上帝的良善。上帝不愿我们灭亡，便将灾祸降于我们：祂在此惩罚我们，却不致我们于死；祂矫正我们，好使我们得救，而非毁灭我们。上帝甚至在祂的《圣经》中以地狱恐吓我们，为使我们不坠入地狱。你看，降于我们的灾祸，其目的何在。虔诚的当权者亦是如此行事：他们不折磨其臣民，而是惩罚他们，好使他们成为良善之人。因为许多人借着灾祸得以矫正并得救，正如我们在书籍中所读。
  - type: paragraph
    text:
      ru: 2) Те, которые напастями не исправляются, уже в злобе своей погибают. Так Фараон неоднократно был наказан, но не исправился, а ожесточился и погиб.
      cn: 2) 那些不蒙患难修正的，就已在他们的恶毒中灭亡了。就如法老，屡次受惩罚，却不蒙修正，反而心志刚硬，并灭亡了。
  - type: paragraph
    text:
      ru: '3) Добрые и благочестивые принимают наказания, чтобы в благочестии утвердиться, ибо в благополучии человек, поскольку слаб, удобно с пути доброго совращается. Поэтому и они наказываются, чтобы лучшими стать. Ибо как дерево, чем более очищается, тем более плодов приносит, так добрый христианин, чем более наказывается, тем лучшие плоды добродетелей творит. Об этом говорит Господь: «Всякую у Меня ветвь, приносящую плод, очищает» (Отец), «чтобы более принесла плода» ( Ин 15:2 ). Так благочестивые люди учатся прекрасным добродетелям: смирению, терпению, кротости и любви, и ими Господу своему последовать и сообразоваться.'
      cn: 3) 善良而虔敬的人接受管教，以期在虔敬中得以坚固；因为在顺境中，人因其软弱，轻易偏离善道。因此他们也受管教，为要变得更好。因为正如树木越是得到修剪，就越是多结果子；照样，一个善心的基督徒越是受管教，就越是结出更美好的美德之果。关于此，上主说：「凡在我里面结果子的枝子，祂就修剪。」 (父) 「好叫它结更多的果子。」 (约翰福音 15:2) 如此，虔敬的人们学习美好的美德：谦卑、忍耐、温柔与爱，并借此效法自己的上主，并与祂同化。
  - type: paragraph
    text:
      ru: 4) Благочестивые души горести в мире вкушают, чтобы не забыть отечества своего небесного и чтобы не почитать мир за отечество свое, но туда мысли свои возводить и стремиться, где нет напастей, бед, болезни и воздыхания.
      cn: 4) 虔敬的灵魂在世上经历苦难，为的是不忘记他们的天国故乡，也不把世界当作自己的故乡；而是将自己的思虑提升至彼处并向往之，在那里没有灾祸、患难、病痛和叹息。
  - type: paragraph
    text:
      ru: Рассуждай об этом и в напастях лобызай, прославляй и величай благость Божию.
      cn: 默想此事，并在患难中亲吻、荣耀和颂扬上帝的良善。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Ныне в истине Божией поучимся. Бог истинен, и слово Его – истина. Что Бог открывает, то точно так есть, как открывает, и что обещает и что предсказывает, то непременно в свое время сбудется. «Слова Божии не прейдут» ( Мф 24:35 ).
      cn: 如今，让我们在上帝的真理中受教。上帝是真实的，祂的圣言是真理。凡上帝所启示的，就确实如祂所启示的那样；凡祂所应许的和所预言的，就必在祂自己的时候应验。「上帝的圣言永不废去。」（马太福音 24:35）
  - type: paragraph
    text:
      ru: 'Истину Божию познаем из того, что сбываются слова Его. Предсказал Бог прародителям в раю, что, вкусив от заповеданного дерева, смертью умрут, – и, вкусив, умерли. Объявил, что потоп будет, – и был потоп. Сказал праотцу Аврааму, что потомки его придут в Египет, и озлоблены будут там, и избавятся, – и сделалось так. Обещал им дать землю Ханаанскую в наследие – и дал. Обещал послать Мессию в мир и так спасти мир, – и сделалось так: пришел Мессия, и спасаются верующие в Него.'
      cn: 我们从祂的话语得以应验而认识上帝的真理。上帝在乐园里向始祖预言，倘若吃了禁树的果子，就必死无疑，——而他们吃了之后，便死了。祂宣告将有洪水降临，——洪水便降临了。祂告诉先祖亚伯拉罕，他的后裔将进入埃及，并在那里受苦，后得以解救，——事情果然如此。祂应许赐予他们迦南地作为产业，——祂便赐予了。祂应许将默西亚差遣到世上，并以此拯救世界，——事情果然如此：默西亚降临了，凡信祂者，皆得拯救。
  - type: paragraph
    text:
      ru: По прошедшим событиям заключаем и о будущих. Объявил в Писании, что будет воскресение мертвых, будет суд Христов, будет мука вечная и вечная жизнь, – и непременно будет так. Так это истинно, как истинно то, что вчерашний и прочие прошедшие дни были и нынешний есть. Поэтому слово Его святое, в Библии написанное, за основание и утверждение веры нашей и всего нашего благочестия имеем, так как слово Его истинно, неложно и достоверно, как и Сам Бог. Ему так должно верить, как если бы Сам Бог непосредственно к нам говорил. «Свидетельство Господне верно» . Ему более должно верить, нежели всему миру. Ибо все люди солгать могут, но Божие Слово солгать никак не может.
      cn: 借由已发生之事，我们推断未来之事。圣经中已宣告，死者将复活，基督将审判，必有永恒的刑罚与永恒的生命——这必将如此。这正如昨日与所有过去的日子确实存在，而今日确实存在一样真实。因此，我们视祂记载于圣经中的圣言，为我们信仰及所有虔敬的基础和确证，因为祂的圣言是真实、无谬误、可信赖的，正如上帝本身一样。我们当如此信赖祂，如同上帝亲身直接对我们说话一般。「上主的见证是真实的」。我们当信祂胜过信靠全世界。因为所有世人皆可说谎，但上帝的圣言绝不可能说谎。
  - type: paragraph
    text:
      ru: 'От познания истины Божией последует:'
      cn: 从认识上帝的真理，将随之而来：
  - type: paragraph
    text:
      ru: 1) Ни в чем не будем сомневаться, что Бог ни открыл, или обещал, или предсказал в Святом Писании.
      cn: 1) 我们对上帝在圣经中所启示的、或应许的、或预言的任何事，都绝不应有所怀疑。
  - type: paragraph
    text:
      ru: 2) О свойствах Божиих, в Писании Святом нам открытых, твердо уверяемся.
      cn: 2) 对于在圣经中向我们启示的上帝的属性，我们得以坚固确信。
  - type: paragraph
    text:
      ru: 3) Познаем волю Его, чего она от нас хочет и чего нам хочет, то есть хочет нас спасти и блаженными сотворить, а от нас требует почитания, благодарности, и прочего.
      cn: 3) 让我们认识祂的旨意，即它对我们有何要求；它愿为我们成就何事，也就是说，祂愿意拯救我们，并使我们蒙福；而它对我们的要求则是：敬奉、感恩，以及其他。
  - type: paragraph
    text:
      ru: 4) Уверяемся в предсказаниях о будущем, то есть о воскресении мертвых, о суде Христовом, о вечной муке и жизни вечной, так как все это в Писании Своем открыл нам Бог.
      cn: 4) 我们确信关于未来的预言，也就是说，关于死人的复活，关于基督的审判，关于永远的刑罚以及永远的生命，因为所有这一切，上帝在祂的圣经中向我们启示了。
  - type: paragraph
    text:
      ru: 5) И так познание истины Божией возбуждает в нас веру, надежду, страх, любовь к Богу и ближнему.
      cn: 5) 如此，对上帝真理的认识，在我们心中激发起信心、希望、敬畏，以及爱上帝和爱邻人。
  - type: paragraph
    text:
      ru: 6) Последует верность к ближнему и уничтожается ложь, лесть, обман, лицемерие. Бог истинно и верно с нами поступает, и нам должно верно с ближними поступать.
      cn: 6) 对近人的忠实将随之而来，谎言、谄媚、欺骗、伪善也将得以根除。上帝真实而信实地对待我们，因此，我们也理当信实地对待近人。
  - type: paragraph
    text:
      ru: Рассуждай об истине Божией, и читай святое Его слово, и утвердишься в истине. Точно веруй, что подобает всему написанному исполниться. «Слово» Божие «есть истина» ( Ин 17:17 ). Истина Божия научит тебя веровать всем заповедям Его, веровать в Евангелие Его, бояться суда Божия и последующей казни, желать и усердно искать вечной жизни, презирать мир и все, что в мире, каяться усердно и молиться, и призывать имя Его.
      cn: 默想上帝的真理，阅读祂神圣的圣言，你就会在真理中得坚固。确实相信凡所记载的必要成就。「上帝的圣言就是真理」（约翰福音 17:17）。上帝的真理将教导你信服祂一切的诫命，信服祂的福音，敬畏上帝的审判以及随之而来的刑罚，渴慕并殷勤寻求永生，轻看世界及世上的一切，殷勤悔改并祷告，以及呼求祂的名。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 51 – 60
    cn: 书信 五十一 – 六十
  children:
  - type: paragraph
    text:
      ru: Ныне святость Божию представим сердечным очам нашим, и в размышлении о ней поучимся на пользу нашу. Бог, святой и милостивый, да поможет нам.
      cn: 如今，我们将上帝的圣洁呈现在我们心眼面前，并在对其的默想中学习，以使我们受益。愿圣洁而慈悲的上帝帮助我们。
  - type: paragraph
    text:
      ru: 'Апостол Его святой представляет нам святость Его и учит нас так: «Бог есть свет, и нет в Нем никакой тьмы» ( 1Ин 1:5 ). Как свет непричастен тьме, так Бог непричастен никакому пороку и греху Воля Его святая хочет того, что добро, и делает то, что добро, и не хочет никакого зла и не делает никакого зла. Бог есть свет, свет без тьмы, правда и святость без всякой неправды, неповинность без всякого порока, истина без лжи, премудрость и разум без всякого неведения.'
      cn: 祂的圣使徒向我们展现祂的圣洁，并这样教导我们：「上帝是光，在祂毫无黑暗」（约翰一书 1:5）。正如光与黑暗无份，上帝也与任何瑕疵和罪恶无份。祂的圣洁旨意意欲良善之事，并行良善之事，不意欲任何邪恶，也不行任何邪恶。上帝是光，是没有黑暗的光；是公义和圣洁，没有丝毫的不义；是纯全无瑕，没有丝毫的过犯；是真理，没有虚谎；是智慧和明悟，没有丝毫的无知。
  - type: paragraph
    text:
      ru: 'От рассуждения и познания святости Божией учимся:'
      cn: 我们从对上帝圣洁的思索与认识中学习到：
  - type: paragraph
    text:
      ru: 1) Свято и непорочно жить, если хотим с Ним общение иметь. «Если мы говорим, что имеем общение с Ним, а ходим во тьме, то мы лжем и не поступаем по истине» , и прочее ( 1Ин 1:6 ).
      cn: 1) 如果我们想与祂相交，就当圣洁而无瑕地生活。「如果我们说我们与祂相交，却在黑暗里行，我们就是说谎的，也没有按真理行事。」等等（约翰一书 1:6）。
  - type: paragraph
    text:
      ru: 2) Заблуждаются те христиане и от Бога удаляются, которые темные дела творят, то есть грешат. «Что общего у света с тьмою» ( 2Кор 6:14 )?
      cn: 2) 那些行黑暗之事，即是犯罪的基督徒，他们就误入歧途并远离上帝。 «光与黑暗有什么相通呢？» (哥林多后书 6:14)
  - type: paragraph
    text:
      ru: '3) Хотящим приступить к Богу и общение с Ним иметь должно очистить себя истинным покаянием, и омыть себя Кровью Сына Божия, и в новой жизни ходить, облечься в оружие света. «Ночь прошла, а день приблизился: итак отвергнем дела тьмы и облечемся в оружия света. Как днем, будем вести себя благочинно, не предаваясь ни пированиям и пьянству, ни сладострастию и распутству, ни ссорам и зависти; но облекитесь в Господа нашего Иисуса Христа» , – апостол увещевает нас ( Рим 13:12–14 ). Послушаем же, возлюбленные, апостола и, отложив дела темные, облечемся в оружие света, дабы с Богом святым общение возыметь здесь и там во веки иметь. Ибо, кто здесь не имеет общения с Ним, тот и там не будет иметь, и так удалившись от света и жизни, которая есть Бог, будет в вечной тьме и смерти. Бог обещал в христианах жить и души их как бы храмами Себе иметь: «Вселюсь в них и буду ходить в них; и буду их Богом, и они будут Моим народом» ( 2Кор 6:16 ). «Имея такие обетования, очистим себя от всякой скверны плоти и духа, совершая святыню в страхе Божием» ( 2Кор 7:1 ).'
      cn: 3) 凡愿亲近上帝并与祂相交之人，应当以真实的悔改洁净自己，并以上帝之子的宝血洗净自己，且行于新生命中，穿上光明的兵器。「黑夜已深，白昼将近；所以我们当弃绝黑暗的作为，穿上光明的兵器。白昼行事为人当端正，不可荒宴醉酒，不可好色邪荡，不可争竞嫉妒；总要披戴我们的主耶稣基督。」——使徒如此劝勉我们（罗马书 13:12-14）。那么，蒙爱者啊，让我们听从使徒的话，弃绝黑暗的作为，穿上光明的兵器，以便在此世与彼世永远与圣洁的上帝相交。因为，在此世不与祂相交的人，在彼世也不会与祂相交；如此，远离那作为上帝的光和生命，便会处在永恒的黑暗与死亡之中。上帝应许住在基督徒里面，并使他们的灵魂成为祂自己的殿，说：「我要在他们中间居住，在他们中间来往；我要作他们的上帝，他们要作我的子民。」（哥林多后书 6:16）。「我们既有这等应许，就当洁净自己，除去肉体和灵魂一切的污秽，在敬畏上帝中成全圣洁。」（哥林多后书 7:1）。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: При этом упомянем о Свете, Который явился на земле. Свет Отец, Свет Сын, Свет и Дух Святой, Свет вечный и незаходимый. Свет Сын Божий, Свет от Света, Бог истинный от Бога истинного, явился на земле и просветил во тьме и тени смертной сидящих.
      cn: '此刻，我们来提及那降临于世的圣光。

        父是光，子是光，圣灵亦是光；这光是永恒的，是不落的。

        这光是上帝之子，是出自光的光，是出自真神的真神，祂降临于世，光照了那些坐在黑暗与死亡幽影中的人。'
  - type: paragraph
    text:
      ru: 'Об этом Свете написано: «Народ, сидящий во тьме, увидел Свет великий, и сидящим в стране и тени смертной воссиял Свет» ( Мф 4:16 ). Этот Свет «был Свет истинный, Который просвещает всякого человека, приходящего в мир» ( Ин 1:9 ). Этот Свет блеснул лучами Своими на горе Фаворе, когда «просияло лице Его, как солнце, одежды же Его сделались белыми, как свет» ( Мф 17:2 ). Увидев этот Свет, Петр святой так обрадовался, что и с горы святой не хотел сходить, но жить там хотел: «Господи, -» говорит, – «хорошо нам здесь быть» , и прочее ( Мф 17:4 ).'
      cn: 关于这光，经上记着说：「那坐在黑暗里的百姓看见了大光；坐在死荫之地的人，有光发现照着他们。」（马太福音 4:16）这光「是真光，照亮一切来到世界的人」（约翰福音 1:9）。这光在塔博尔山上，以祂的光芒闪耀，当时「祂的面容发光如同太阳，衣裳洁白如光」（马太福音 17:2）。圣彼得看见这光后，如此喜乐，以至于他不想从圣山下来，反而想住在那里，他说道：「上主啊，我们在这里真好。」等等（马太福音 17:4）。
  - type: paragraph
    text:
      ru: 'Он говорит о Себе: «Я свет миру; кто последует за Мною, тот не будет ходить во тьме, но будет иметь свет жизни» ( Ин 8:12 ). И еще: «Я Свет пришел в мир, чтобы всякий верующий в Меня не оставался во тьме» ( Ин 12:46 ). И еще: «Суд же состоит в том, что Свет пришел в мир; но люди более возлюбили тьму, нежели Свет, потому что дела их были злы» , и прочее ( Ин 3:19 ). К этому Свету приступили апостолы и в след Его пошли, пошли святители, мученики, преподобные и все святые, и просветились, и ныне сияют, как светила во царствии Его.'
      cn: 祂论及自己说：「我是世界的光；跟从我的，就不在黑暗里行，反要得着生命的光」（约翰福音 8:12）。又说：「我是光，来到世上，叫一切信我的，不住在黑暗里」（约翰福音 12:46）。又说：「审判就是：光来到世上，世人爱黑暗过于爱光，因为他们的行为是恶的」（略）（约翰福音 3:19）。众使徒来到这光面前，并跟从祂的脚踪；圣主教们、殉道者们、苦修圣者们以及所有圣者也都跟从了，他们都蒙光照，并且如今，在祂的国度里如同明光照耀。
  - type: paragraph
    text:
      ru: «Приступим» и мы «к Нему, и просветимся, и лица» наши «не постыдятся» ( Пс 33:6 ). Любовь к миру и грех есть тьма, – отвратимся от тьмы и обратимся к Свету этому, и возлюбим его, и прилепимся ему, и пойдем в след его, и не будем ходить во тьме, но будем иметь Свет жизненный. Всякий, удаляющийся от света, во тьме ходит, а приходящий к свету во тьме не пребудет. Свет есть Христос, и ходящий в след Христа не будет ходить во тьме; а не ходящий во след Его непременно во тьме будет и будет заблуждаться.
      cn: 「我们也要『就近祂，就必蒙光照，我们的脸必不蒙羞。』」（诗篇 33:6）爱世和罪恶就是黑暗——我们要背离黑暗，归向这光，爱慕祂，亲近祂，追随祂，就不在黑暗里行走，反要得着生命的光。凡是远离光的人，是在黑暗里行走；而来到光的人，必不留在黑暗里。光就是基督，追随基督的人，必不在黑暗里行走；而不追随祂的人，则必在黑暗里，并且会迷失。
  - type: paragraph
    text:
      ru: Рассуждай об этом.
      cn: 讨论这个。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Спрашиваешь ты: что значит в след Христа ходить? Христос ныне одесную Бога Отца сидит, – как же можем в след Его ходить?'
      cn: 你问道：追随基督的足迹意味着什么？基督如今坐在父上帝的右边，——我们又怎能追随祂呢？
  - type: paragraph
    text:
      ru: 'Ответ:'
      cn: 回答：
  - type: paragraph
    text:
      ru: 1) Непременно все христиане должны в след Христа идти, как овцы в след Пастыря своего, как рабы в след Господа своего, как ученики в след Учителя своего, как воины в след Вождя и Царя своего, как члены духовные в след Главы своей. Надо им здесь соединенными быть со Христом, дабы и в будущем веке с Ним вместе быть сподобились. Кто здесь отлучится от Христа, тот и там не будет с Ним.
      cn: 1) 所有的基督徒都必须跟随基督，如同羊群跟随自己的牧者，如同奴仆跟随自己的主，如同门徒跟随自己的导师，如同士兵跟随自己的统帅和君王，如同属灵肢体跟随自己的元首。他们在此世就当与基督联合，为使他们在来世也能与祂同在，得以蒙受恩典。凡在此世与基督分离者，在彼世也必不与祂同在。
  - type: paragraph
    text:
      ru: '2) В след Христа ходить не ногами, но сердцем должно, то есть идти путем тесным и крестным, ибо это есть путь Христов. Он этим путем шел и нам пример показал, как апостол его учит: «Христос пострадал за нас, оставив нам пример, дабы мы шли по следам Его» ( 1Петр 2:21 ). Христос поучает нас словом и житием Своим смирению, терпению, кротости, любви и прочим прекрасным добродетелям. Будем же последовать Христу, то есть от Него будем учиться – смиряться, терпеть, кроткими быть, любить и прочее добро делать. Так последовали Христу все святые, и привел их в небесное отечество. Этим путем смирения и нам идти должно, если хотим в ту страну прийти, чего как себе, так и тебе от сердца желаю.'
      cn: 2) 跟随基督不当用脚，乃当用心，也就是说，当行走窄路和十字架之路，因为这是基督之路。他走过这条路，并向我们树立了榜样，正如他的使徒教导说：「基督也为我们受了苦，给我们留下榜样，叫我们跟随他的脚踪行。」 (彼得前书 2:21)。基督借着他的言语和他的生命教导我们谦卑、忍耐、温柔、爱以及其他美好的美德。那么，让我们跟随基督，也就是说，从他那里学习——谦卑、忍耐、温柔、爱以及行其他善事。所有的圣徒都这样跟随了基督，他也把他们带到了天上的家乡。这条谦卑之路，我们若想去到那个国度，也当行走，我衷心地祝愿自己和你也如此。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Напоследок представляю тебе, что Бог наш есть бестелесный и невещественный, и потому Он есть Дух наичистейший.
      cn: 最后，我向你呈现，我们的上帝是无形的且非物质的，因此祂是至纯之灵。
  - type: paragraph
    text:
      ru: 'Так о Нем свидетельствует Писание Святое: «Бог есть Дух» ( Ин 4:24 ). Что Святое Писание говорит о Нем как об имеющем телесные члены, то не собственно Ему приписывает, но по снисхождению к немощи и слабости понятия нашего (так говорит), поскольку мы иначе не можем понять действий Его, силою Его совершаемых. Так руки, Ему приписываемые, означают всемогущую силу Его, очи – всеведение Его, уши – всего слышание, так как от Него ни слово, ни дело, ни помышление наше сердечное не утаится. И как про всех людей, так и про всякого человека, что делал, говорил, мыслил, и для чего делал то, и что делает, говорит и мыслит, и для чего, и что будет делать, говорить, мыслить, и для чего, – все Ему совершенно явно. Он не имеет рук, но все единым хотением и повелением делает, что хочет; не имеет очей, но все и в сокровенных местах, и в глубине сердца делаемое наблюдает и видит; не имеет ушей, но всякое слово, глас, пение худое и доброе слышит. Рассуждай об этом и берегись делать, говорить и мыслить того, что Ему противно.'
      cn: 圣经如此为祂作证：「上帝是灵」（约翰福音 4:24）。圣经所言及祂拥有身体的肢体，并非就其本身归属于祂，乃是因着顾念我们悟性的软弱和迟钝（所以如此说），因为我们若非如此，便无法理解祂借着祂的能力所行的作为。故此，归于祂的「手」意指祂的全能之力，「眼」意指祂的全知，「耳」意指祂的无所不闻，因为无论我们的言语、行为，抑或心中的意念，无一能向祂隐藏。并且，正如对所有人而言，对于每一个人，他所行、所言、所思，以及为何如此行；他现今所行、所言、所思，以及为何如此行；他将要行、将要言、将要思，以及为何如此行——这一切都在祂面前全然显明。祂没有手，却仅凭一己之愿和命令，成就祂所愿的一切；祂没有眼，却能洞察并看见一切在隐秘之处和心之深处所行的事；祂没有耳，却能听见一切好坏的言语、声音和歌唱。默想此事，并且要谨慎，切勿行、言、思任何违逆祂的事。
  - type: paragraph
    text:
      ru: От познания духовной сущности Бога последует то, что человек будет Его почитать не веществом, не золотом, не серебром, и не другими материалами, не разбором пищи и одеяния, и не одними только видимыми церемониями, но духом, то есть страхом, любовью, смирением, терпением, покорением воли своей воле Его, и прочими делами, Им заповеданными. «Ибо таковые жертвы благоугодны Богу» (Ев 13:16).
      cn: 认识了上帝的属灵本质，其结果是人会敬拜祂，不是用物质，不是用金子，不是用银子，也不是用其他材料，不是凭食物和衣着的分别，也不仅凭可见的礼仪，而是凭着灵，也就是说，凭着敬畏、爱、谦卑、忍耐、将自己的意志顺服于祂的意志，以及其他祂所吩咐的作为。「因为这样的献祭是蒙上帝悦纳的」（希伯来书 13:16）。
  - type: paragraph
    text:
      ru: 'Дух духом почитается. Богу всякая наружность и вещество неприятно без внутреннего духа, поэтому говорит Господь: «Истинные поклонники будут поклоняться Отцу в духе и истине, ибо таких поклонников Отец ищет Себе. Бог есть дух, и поклоняющиеся Ему должны поклоняться в духе и истине» ( Ин 4:23–24 ). Почтим же Бога как Духа духом, сотворим волю Его и заповеди Его, за грехи наши – дух сокрушенный, сердце сокрушенное и смиренное принесем. «Жертва Богу дух сокрушен: сердце сокрушенно и смиренно Бог не уничижит» ( Пс 50:19 ).'
      cn: 灵由灵敬奉。没有内在的灵，一切外在的形式和物质对上帝都是不悦的，因此上主说：「真正敬拜的，将要以灵和真理敬拜父，因为父寻求这样的敬拜者。上帝是灵，所以敬拜祂的，必须以灵和真理敬拜。」（约翰福音 4:23-24）那么，就让我们以灵敬奉上帝，如同敬奉那灵，并遵行祂的旨意和祂的诫命。为了我们的罪，让我们献上一个忧伤的灵，一颗破碎而谦卑的心。「上帝所要的祭，就是忧伤的灵；忧伤痛悔的心，上帝必不轻看。」（诗篇 50:19）
  - type: paragraph
    text:
      ru: Все старание христианину надобно в том полагать, чтобы душу свою исправить. Ибо Бог к душе нашей говорит, а не к телу. Тело – это орудие души, через которое она действует. Язык говорит, очи смотрят, руки делают, что душа замышляет и хочет. Если душа исправной будет, то и дела внешние будут исправными. Без душевного изволения члены телесные не действуют. Исправим же душу нашу, как дух, в покорение и послушание Богу, тогда и внешние дела наши исправными будут, и так будем Бога нашего духом и истиной почитать.
      cn: 所有基督徒都当倾尽心力，使自己的灵魂归正。因为上帝对我们说话，是对我们的灵魂，而非对我们的身体。身体是灵魂的器皿，灵魂借此行事。舌头说话，眼睛观看，双手劳作，都是灵魂所筹谋和意愿的。如果灵魂归正，那么外在的行为也必归正。没有灵魂的意愿，身体肢体便无法运作。所以，让我们将自己的灵魂作为灵来归正，使其顺服并听从上帝，如此，我们外在的行为也将归正，我们便得以用灵和真理敬拜我们的上帝。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Вкратце предложил тебе, по разуму моему, о свойствах Божиих и о том, что следует от их познания. Видишь, что значит познать Бога! Познание свойств Божиих, насколько можем их познать, приводят нас в познание Его, но приводят с помощью Его и просвещением, как и свойства Его познаем и ими просвещаемся только с помощью света Его.
      cn: 我已简要地向你呈献了，依我所思，关于上帝的属性，以及认识这些属性所带来的。你看，认识上帝意味着什么！对上帝属性的认识，尽我们所能认识的范围，将我们引向上帝的认识；但这必须借着祂的帮助和光照。正如我们认识祂的属性，并借此被光照，也唯独是借着祂的光。
  - type: paragraph
    text:
      ru: 'Все христиане хвалятся знанием Бога, но, по апостольскому учению, мало кто знает Его, – только тот, кто заповеди Его соблюдает: «А что мы познали Его, узнаем из того, что соблюдаем Его заповеди. Кто говорит: я познал Его, но заповедей Его не соблюдает, тот лжец, и нет в нем истины» ( 1Ин 2:3–4 ). Многие и проповедуют Бога, и учат о Боге, но нравами и житием иное показывают. Божие истинное познание вводит с собой непременно исправление внутреннего состояния и от того внешнее непорочное житие.'
      cn: 所有的基督徒都夸耀自己认识上帝，然而，按着使徒的教导，很少有人认识祂——唯有那些遵守祂诫命的人才认识祂：「我们若遵守祂的诫命，就此知道我们认识祂。人若说『我认识祂』，却不遵守祂的诫命，他便是说谎的，真理就不在他心里了」（约翰一书 2:3-4）。许多人既传讲上帝，又教导上帝的道理，但在品行和生活上却显出不同的光景。对上帝真正的认识必然会带来内在状态的修正，并由此带来外在无瑕的生活。
  - type: paragraph
    text:
      ru: Кто, ощутив сердцем Божие всемогущество, которое все из ничего творит, не убоится Его и не смирится пред Ним? Кто, познав Божие вездесущие, не воздаст Ему, как вездесущему, достойного почтения и дерзнет пред Ним грешить? Пред царем – человеком не дерзает бесчинствовать; пред Богом ли, Царем всемогущим и страшным, дерзнет? Никогда. Будет трепетать непременно, и, как гвоздями пригвожден, будет недвижим ко всякому злу. Кто всеведение Его и правду Его зная, не убоится суда Его праведного и не подвигнется к истинному покаянию?
      cn: 谁，心中感受到了上帝的全能，祂使万物从无中生有，会不敬畏祂，不谦卑俯伏于祂面前呢？谁，认识了上帝的无所不在，会不向作为无所不在的祂献上应有的尊崇，而竟敢在祂面前犯罪呢？在人间的君王面前，尚无人敢放肆无礼；难道在上帝面前，这位全能可畏的君王面前，他竟敢如此吗？绝不。他必将战兢不已，并且，如同被钉子牢牢钉住一般，对一切邪恶都将纹丝不动。谁，认识了祂的全知和公义，会不敬畏祂公义的审判，而不被感召而真心悔改呢？
  - type: paragraph
    text:
      ru: Возьми и прочие Его свойства в рассуждение и увидишь, что от их познания последует истинное покаяние, благочестие и богопочитание. Невозможно, Бога познав, не почитать Его. Бога знать и не почитать Его от сердца – противоречие включает. Это так истинно и достоверно, как и то истинно, что, познав высочайшее добро, невозможно его не любить. Ибо все от природы стремятся к добру, и желают и любят добро, и хотя многие любят зло, но под видом добра любят. Зло как зло любимо быть не может, но всякий от него убегает.
      cn: 将祂的其它属性纳入思考，你会看到由此生发真正的悔改、虔敬和敬奉上帝。认识上帝之后，不可能不敬奉祂。认识上帝却不由衷地敬奉祂——这包含矛盾。这如此真实而确凿，正如认识了至善之后，不可能不爱它一样真实。因为万物生来就向往良善，并渴望和爱慕良善；即便许多人爱恶，但他们是以良善的面貌去爱的。恶本身不可能被爱，但人人都会逃避它。
  - type: paragraph
    text:
      ru: Потому чем больше человек Бога познает, тем больше почитает Его; и тем больше познает, чем больше рассуждает о Божественных Его свойствах и в святом слове Его поучается. Однако же всегда должно в уме держать и помнить, что Бога без Бога познать не можем. Поэтому надо Ему молиться, чтобы Сам нас просветил своим познанием, чего и себе и тебе усердно желаю.
      cn: 人越是认识上帝，就越敬奉祂；祂就越是认识，越是默想祂神圣的属性，越是在祂的圣言中受教。然而，务要常常牢记并谨记，我们离了上帝便无法认识上帝。因此，我们当向祂祷告，祈求祂亲自以对祂的认识来光照我们，这̷也是我为你和自己所切切盼望的。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Ныне поклонимся Царю Небесному, Который ради нас на земле явился, и подивимся благости Божией, которую на нас преизобильно излил, и послал к нам Единородного Сына Своего благословить нас и благовестить святое Свое Евангелие. Ты о чем слышишь или от Святого Писания, или от церковных песней, предлагай мне, а я с помощью Божией, как научился от Святого Писания, и Святой Церкви, и учителей церковных, буду тебе отвечать. Только предлагай то, что не выше силы моей, но что и моей и твоей душе созидание принесет, и от чего можем утешение в нужном случае получить.
      cn: 今让我们朝拜天上的君王，祂为我们降临人间，并赞叹于上帝的良善，祂丰盛地浇灌在我们身上，并差遣祂的独生子来到我们这里，来祝福我们，并宣讲祂神圣的福音。凡你所听到的，无论是来自圣经，还是来自教会诗歌的，都可以向我建议，而我，藉着上帝的帮助，按照我从圣经、圣教会以及教会导师那里所学到的，将会回答你。只是，请建议那些不超出我能力范围的，而是能给我的灵魂和你的灵魂都带来造就的，并且在需要时，我们能从中获得安慰的。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Вопрошаешь про Евангелие, что слово сие значит?
      cn: 祢问到福音，这个词是什么意思？
  - type: paragraph
    text:
      ru: 'Ответ. Евангелие – это слово греческое, и означает весть добрую, благоприятную и утешительную. Евангелие Иисуса Христа открывает нам, что Он от Отца Небесного в мир этот послан грешников спасти, и взыскать и спасти погибшее, как Он Сам в Своем Евангелии учит: «Сын Человеческий пришел взыскать и спасти погибшее» ( Лк 19:10 ). То же и апостол Его благовествует нам: «Верно и всякого принятия достойно слово, что Христос Иисус пришел в мир спасти грешников» ( 1Тим 1:15 ). Слава пославшему Отцу, слава и Сыну, пришедшему спасти грешников.'
      cn: 答：福音是一个希腊词，意为佳音，喜讯，并慰藉人心的消息。耶稣基督的福音向我们启示，祂由天父被差遣到这世上，为要拯救罪人，并寻找和拯救失丧之人，正如祂自己在祂的福音中教导的：「人子来，为要寻找和拯救失丧之人。」（路加福音 19:10）祂的使徒也同样向我们传报这佳音：「这话说的是可信的，是理当完全接受的言语，就是基督耶稣降世，为要拯救罪人。」（提摩太前书 1:15）荣耀归于差遣祂的父，荣耀也归于降世拯救罪人的子。
  - type: paragraph
    text:
      ru: Поклонимся же радостным и благодарным духом Пришедшему спасти нас и Благоволившему послать Его. Благословен Бог, «Который хочет, чтобы все люди спаслись и достигли познания истины» ( 1Тим 2:4 )! Примем же сию всерадостную весть в сердца наши и дадим славу Богу, благоволившему о нас.
      cn: 就让我们怀着喜乐与感恩的灵，敬拜那降世拯救我们的，以及乐意差遣祂的那一位吧！愿上帝受赞颂，「祂愿意所有人都得救，并达到真理的认识」（提摩太前书 2:4）！就让我们将这普世欢欣的喜讯领受在我们的心中，并把荣耀归于那对我们施予恩慈的上帝吧！
  - type: paragraph
    text:
      ru: Спасайся о Христе.
      cn: 在基督里求得救恩！
  - type: paragraph
    text:
      ru: 'Требуешь ты об этом лучшего изъяснения. Прими же, по силе моей предлагаю его тебе. Род человеческий погиб из-за лукавства и обманчивого совета змеиного. Бог преблагой над ним умилосердился и не восхотел его оставить в погибели. Послал Единородного Сына своего в мир, чтобы спасти мир. Об этом Сам Единородный Сын Божий благовествует и уверяет нас: «Так возлюбил Бог мир, что отдал Сына Своего Единородного, дабы всякий верующий в Него, не погиб, но имел жизнь вечную. Ибо не послал Бог Сына Своего в мир, чтобы судить мир, но чтобы мир спасен был чрез Него» ( Ин 3:16–17 ). Видишь здесь всю святого Евангелия Христова силу вкратце: Бог возлюбил мир, которым прогневан был и огорчен; послал Сына Своего в мир, но не судить мир, прогневавший и огорчивший Бога Создателя своего, а спасти мир. Вот каково Евангелие!..'
      cn: 你要求对此有更清晰的阐释。请领受吧，我愿尽我所能向你阐明。人类因着蛇的狡诈和欺骗性的建议而堕落。至善至慈的上帝怜悯了他，不愿任凭他沉沦灭亡。祂差遣祂的独生子降世，为要拯救世界。关于这一点，上帝的独生子亲自宣扬并向我们保证说：「上帝如此爱世人，甚至将祂的独生子赐予他们，使凡信祂的，不致灭亡，反得永生。因为上帝差遣祂的儿子到世上来，不是要审判世人，乃是要使世人藉着祂得救。」（约翰福音 3:16-17）。在此你可见基督圣福音的全部要旨简言之：上帝爱这世界，尽管祂曾被这世界所激怒和忧伤；祂差遣祂的独生子降世，却不是要审判这激怒并忧伤了祂的创造者上帝的世界，而是要拯救这世界。这就是福音的真谛！
  - type: paragraph
    text:
      ru: 1) Бог нас, врагов Своих, вечной казни достойных, не казнил.
      cn: 1) 上帝未曾处决我们，我们这些祂的仇敌，本该受永刑的。
  - type: paragraph
    text:
      ru: 2) Не только не казнил, но и в милость Свою принял.
      cn: 2) 不只没有施以刑罚，还在祂的恩慈中接纳了他。
  - type: paragraph
    text:
      ru: 3) Чтобы спасти нас, послал не Ангела, и не иного кого, но Единородного Сына Своего послал спасти нас и привести нас, отпадших, к Нему. Сына Своего ради нас не пощадил ( Рим 8:32 ).
      cn: 为了拯救我们，祂所派遣的不是天使，也不是其他任何人，而是祂的独生子，来拯救我们，并将我们这些堕落的引回祂身边。为我们的缘故，祂没有顾惜祂的儿子（罗马书 8:32）。
  - type: paragraph
    text:
      ru: «Благословен Господь Бог Израилев, что посетил народ Свой и сотворил избавление ему, и воздвиг рог спасения нам в дому Давида, отрока Своего, как возвестил устами бывших от века святых пророков Своих» ( Лк 1:68–70 ). Удивляйся и поклоняйся благости Божией!.. «Вкуси и увидишь, сколь благ Господь» ( Пс 33:9 )!..
      cn: 「福哉上主以色列的神，因祂眷顾祂的百姓，并为他们成就了救赎；又在祂的仆人大卫家中，为我们兴起了拯救的角，正如祂藉着自古以来圣先知的口所宣告的。」 (路加福音 1:68-70)。当惊奇并敬拜上帝的良善！「你们要尝尝，便知道上主是美善的！」 (诗篇 33:9)。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Спрашиваешь, прежде пришествия Христова в мир было ли извещение о пришествии Его?
      cn: 你问，在基督降世以前，有没有关于祂降临的预告呢？
  - type: paragraph
    text:
      ru: 'Ответ: было многократно. От самого начала мира многократно и различно о том возвещено было от Бога. Как царь мира сего, желая в какой город прийти, посылает вперед вестников туда, дабы там известили всех о скором пришествии его, так Царь Небесный, намереваясь прийти в мир, предвозвестил Свое пришествие через Своих пророков, как пророк Захария, отец Предтечи, воспел: «возвестил, -» говорит, – «устами бывших от века святых пророков Своих» ( Лк 1:70 ). Они все согласно проповедали: грядет, грядет Господь, Царь Небесный. Поэтому все и ожидали Его пришествия, и желали видеть Его: «многие пророки и праведники желали видеть» Его ( Мф 13:17 ), – и молились Ему: «Приди спасти нас» ( Пс 79:3 ).'
      cn: 答：是多次的。从世界之初，上帝就多次多样地宣告了此事。正如这世界的君王，欲进某城时，必先派遣使者前往，好在那里知会众人他的即将到来；同样，天上的君王，在预备降临世界之时，也藉着祂的先知们预先宣告了祂的降临，正如施洗约翰之父，先知撒迦利亚所歌唱的：「他曾藉着从创世以来祂圣先知的口发言」（路加福音 1:70）。他们都一致宣讲道：主，天上的君王，将要降临，将要降临。因此，所有人都期待祂的降临，并渴望见到祂：「有许多先知和义人，都渴望看见祂」（马太福音 13:17），并且向祂祷告说：「求祢降临，拯救我们！」（诗篇 79:3）。
  - type: paragraph
    text:
      ru: 'Но когда пришел в мир, и устроил спасение нам, и на небо, откуда и пришел, вознесся, проповедали об этом апостолы Его всей вселенной, Им Самим посланные, и Духом Его Святым умудренные, просвещенные и укрепленные. Они все согласно, как богогласные трубы, во всех концах земли возгремели: Господь наш пришел. «Христос Иисус пришел в мир спасти грешников» ( 1Тим 1:15 ). «О том, что было от начала, что мы слышали, что видели своими очами, что рассматривали и что осязали руки наши, о Слове жизни, – ибо жизнь явилась, и мы видели и свидетельствуем, и возвещаем вам сию вечную жизнь, которая была у Отца и явилась нам, – о том, что мы видели и слышали, возвещаем вам(» 1Ин 1:1–3 ), и прочее.'
      cn: 但当祂降世，并为我们安排了救赎，又升入祂所来自的天上时，祂的使徒们将此事传遍了整个宇宙，他们由祂亲自差遣，并蒙祂的圣灵赐予智慧、光照和坚固。他们都一致地，如同发上帝之声的号角，在地的四极轰鸣道：我们的上主降临了。「基督耶稣降世，为要拯救罪人」（提摩太前书 1:15）。「论到从起初原有的，我们所听见、所亲眼看见、所详察过、我们手所摸过的，论到生命之道——因为这生命已经显现，我们也看见了，现在作见证，并将这原与父同在、又向我们显现的永远的生命，传给你们——论到我们所看见、所听见的，我们传给你们」（约翰一书 1:1-3），等等。
  - type: paragraph
    text:
      ru: 'Они Сына Божия сами видели, сами слышали, как проповедовал Он Евангелие Свое, и своими руками Его осязали, и за Ним, по земле ходящим, следовали, и с Ним ели и пили, и о Нем Самом всему миру проповедали: «по всей земле прошел голос их, и до пределов вселенной слова их» ( Рим 10:18 ). Они не только Его видели, но и свидетельство о Нем от Бога Отца Небесного с небес слышали, и это свидетельство миру объявили, и в посланиях своих написали нам в достовернейшее наше уверение: «Мы возвестили вам силу и пришествие Господа нашего Иисуса Христа, не хитросплетенным басням последуя, но быв очевидцами Его величия. Ибо Он принял от Бога Отца честь и славу, когда от велелепной славы принесся к Нему такой глас: Сей есть Сын Мой возлюбленный, в Котором Мое благоволение. И этот глас, принесшийся с небес, мы слышали, будучи с Ним на святой горе» ( 2Петр 1:16–18 ). И вся Святая Церковь верует, исповедует, хвалит, благодарит, прославляет, и поклоняется Ему, и благодатью Его спасается, и от мира этого переселяется к Нему, чтобы видеть Его, одесную Отца сидящего.'
      cn: 他们亲自见过上帝之子，亲自听过祂传讲祂的福音，亲手摸过祂，追随祂行走于大地之上，与祂一同吃喝，并向全世界传扬了祂自己：「他们的声音传遍全地，他们的言语达到地极」（罗马书 10:18）。他们不仅见过祂，更从天上听见了天父上帝关于祂的见证，并向世人宣告了这见证，还在他们的书信中写给我们，作为我们最确凿的保证：「我们把我们主耶稣基督的大能和降临告诉你们，并不是随从虚构的谎言，乃是亲眼见过祂的威荣。祂从父上帝那里得着尊荣和荣耀的时候，从极大的荣光中有声音发出来，向祂说：『这是我的爱子，我所喜悦的。』我们同祂在圣山的时候，亲自听见这从天上发出来的声音」（彼得后书 1:16-18）。并且整个圣教会都信仰祂、告白祂、赞美祂、感谢祂、荣耀祂、并敬拜祂，因祂的恩典而得救，且从这世界迁徙至祂那里，为要得见祂，就是那坐在父的右边者。
  - type: paragraph
    text:
      ru: 'Вот каково Евангелие! Воистину добрая и благоприятная весть! Бог явился на земле, и с людьми пожил, и Сам устроил спасение; и благодатью Его спасаются грешники, те, которые чистым сердцем веруют в Него, и отверженные от Бога в милость Его принимаются, и земные жители небесными делаются, и погибшие наследуют вечную жизнь. Познаем, брат, великое сие Божие дело. Как «велика благочестия тайна: Бог явился» на земле!'
      cn: 这正是福音！确实是美好而蒙福的喜讯！上帝显现于世，与人同住，并亲自成就了救恩；借着祂的恩典，罪人得以得救，就是那些以清洁之心信靠祂的人；被上帝所弃绝的人得蒙祂的怜悯，地上居民变为属天之人，失丧之人得享永生。弟兄啊，让我们认识这项上帝的伟大作为。何等「敬虔的奥秘何等伟大：上帝显现于世」！
  - type: paragraph
    text:
      ru: Велико и удивления достойно было бы, если бы царь земной сам лично пришел к пленным рабам своим, чтобы искупить их. Бог, Слово Божие, Сын Божий, Царь Небесный пришел Сам к нам, плененным, чтобы искупить нас через Себя Самого. Цари земные по большей части искупают пленных ради своей корысти; Царю Небесному никакой корысти в нас не было. Он блажен без нас, и от нас никакого не требует услужения, и предстоят Ему тысячи тысячей Ангелов, и служат день и нощь непрестанно, но однако же Сам пришел на землю взыскать нас, и за корысть Себе то только поставил, чтобы нас спасенными видеть. Вот какова истинная и горячая любовь, которая «не ищет своего» ( 1Кор 13:5 )!
      cn: 地上的君王若亲自来到他被掳的奴仆那里，为要赎回他们，那将是何等伟大且值得惊叹的事。上帝，上帝之道，上帝之子，天上的君王，亲自来到我们这些被掳之人这里，为要借由祂自己来赎回我们。地上的君王们多半赎回被掳之人是为了自己的私利；而天上的君王在我们身上毫无私利可图。祂离了我们也是蒙福的，也不需要我们任何的服侍；千千万万的天使侍立在祂面前，昼夜不息地事奉祂，然而祂却亲自降世寻回我们，而祂为自己所求的私利，仅是能看见我们得救。这就是真实而炽热的爱，是「不求自己的益处」（哥林多前书 13:5）的爱！
  - type: paragraph
    text:
      ru: Поверим тому, что Бог на землю ради нас пришел, чтобы нас на небо возвести, и напишем великое сие дело на сердцах наших. Тогда непрестанно будем о сем удивляться, «поя и воспевая в сердцах» наших «Господу» ( Еф 5:19 ). Тогда истинно возлюбим явление Его и отвратимся от суеты мира сего. Тогда не только имений наших, но и себя самих не пожалеем ради имени Его. Он лицеприятия не имеет, но как ради всех, так ради тебя и меня, непотребного, пришел. Слава щедротам Его!
      cn: 让我们相信上帝为我们降临人间，为要将我们提升至天上，并将此伟大之事铭刻在我们心上。如此，我们将为此事不住地惊叹，在心中「歌颂赞美上主」（以弗所书 5:19）。如此，我们必真心爱慕祂的显现，并厌弃此世的虚妄。如此，我们不仅不吝惜自己的财物，更不吝惜我们自己，为祂的名。祂不偏待人，祂既是为众人而来，亦是为你我这不配之人而来。荣耀归于祂的慷慨！
  - type: paragraph
    text:
      ru: 'Рассуждай об этом, и тем себя к любви Его поощряй, и в нужном случае, когда помыслы говорят: «Нет спасения» тебе «в Боге» твоем, – утешай. Чего и себе и тебе от сердца желаю.'
      cn: 默想此事，并以此激励自己爱祂；在必要时，当意念对你说：「在你的上帝里，你没有救恩」时，要安慰自己。这正是我发自内心为你也为自己所愿的。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Однако же не думай того, что будто бы Бог оставил Свое небо, когда явился на земле. Бог с места на место не переходит, так как везде и на всяком месте есть, как я тебе прежде писал о том. Но когда говорится, что Бог пришел на землю, это говорится применительно к понятию нашему, так как мы иначе понять не можем, как и того не можем понять, что Он и здесь, и на другом месте, и на небесах есть. Он и тогда на небесах был, и славим был с Отцом и Духом Святым, и Ангелами на небесах поклоняем и воспеваем был, когда по земле ходил и между людьми обращался. Так святое Его Слово учит нас, и Святая наша Церковь исповедует. Так веруй и ты, и исповедуй, «чрез меру трудного для тебя не ищи и что свыше сил твоих, того не испытывай» ( Сир 3:21 ).
      cn: 然而你切莫以为，上帝在显现于地上之时，会离弃祂的天国。上帝不从一地迁往另一地，因为祂无处不在，遍及一切之地，正如我之前就此曾写信告诉你。但当说到上帝降临地上时，这是按照我们的理解而言，因为我们无法以其他方式理解，正如我们无法理解祂既在此处，又在别处，且在诸天之上一样。当祂行走于地上，并与世人相处之时，祂那时也在诸天之上，并与圣父和圣灵同受荣耀，且在诸天之上蒙受天使的敬拜和颂赞。圣洁的上帝之言如此教导我们，我们的圣教会如此宣认。你也当如此相信和宣认：「于你过于艰难的，你不要寻求，过于你力量的，你不要探究」（德训篇 3:21）。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 61 – 70
    cn: 书信 61 – 70
  children:
  - type: paragraph
    text:
      ru: Ты вопрошаешь, где и в которой стране Бог, Божие Слово, явился на земле?
      cn: 你问，上帝，上帝圣言，在哪里和在哪个国家降临于世？
  - type: paragraph
    text:
      ru: 'Ответ. Прежде пришествия Его только Иудейская и Израильская земля знала и почитала Бога, а все прочие страны в идолопоклонство были погружены и не знали Бога истинного. Поэтому только Иудейская страна ожидала пришествия Христа Мессии, как и обещано оно было им. Потому в той стране и явился Христос, к людям Своим, его ожидавшим. Но и о том, в которой стране и в какое время явится Христос Бог, и каким образом придет, и что будет делать, и как Его примут люди, ожидавшие Его, – обо всем том пророками различным образом предсказано, – и что предсказано, то все в пришествие Его исполнилось, как видим во святом Его Евангелии. Но как прежде пришествия Его в одном только Израиле знание и почитание Бога заключалось, как пишется: «Ведом во Иудее Бог, во Израиле велико имя Его» ( Пс 75:2 ), – так по пришествии уже во все концы земли свет богопознания и богопочитания разлился и распространился.'
      cn: 答：在祂降临之前，唯有犹大和以色列之地认识并敬拜上帝，而所有其他国家都沉浸在偶像崇拜之中，不认识真上帝。因此，唯有犹大之地期待着基督弥赛亚的降临，正如祂曾应许他们那样。因此，基督就显现在那片土地上，向祂的百姓，那些期待着祂的人。然而，关于基督上帝将在哪个国家、何时显现，以及祂将以何种方式降临，祂将做什么，以及那些期待祂的人将如何接纳祂——所有这一切都已由先知们以各种方式预言过——而所预言的一切，都在祂降临时得以应验，正如我们在祂的神圣福音书中所见。但是，正如在祂降临之前，对上帝的认识和敬拜仅限于以色列，正如经上所写：「在犹大，上帝是人所认识的；在以色列，祂的名是大的。」（诗篇 75:2）——照样，在祂降临之后，对上帝的认识和敬拜之光已传遍并扩散到地的四极。
  - type: paragraph
    text:
      ru: Благодарим Бога, что и в наш угол блеснул, и прогнал тьму идолопоклонства, которой праотцы наши помрачены были. Только надо опасаться, чтобы вновь не сокрылся из-за презрения слова Его. Ибо видим, что час от часу умножается безбожное житие и слово Божие в крайнее презрение приходит.
      cn: 我们感谢上帝，祂的光照进了我们的角落，驱散了偶像崇拜的黑暗，我们的列祖曾被这黑暗所蒙蔽。只是我们必须警惕，免得祂再次隐匿，因为我们蔑视祂的圣言。因为我们看到，不敬虔的生活日益增多，上帝的圣言也受到极度的蔑视。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Спрашиваешь: как Бог, невидимый и неосязаемый, поскольку Он Дух есть, явился на земле?'
      cn: 你问：上帝如何，那不可见的、不可触及的，因为祂是灵，显现于地上？
  - type: paragraph
    text:
      ru: Ответ. Христиане должны это знать, и тебе не должно было об этом вопрошать, ибо это каждый день в церкви проповедуется, однако послушай вкратце об этом, ради лучшего утверждения.
      cn: 答。 基督徒理当知晓此事，而你本不该就此事发问，因这在教会中每日宣讲，然而，你且简要听我说明此事，为求更臻坚定。
  - type: paragraph
    text:
      ru: 'Бог невидимый, желая явиться на земле, с людьми пожить и спасение нам устроить, благоволил воплотиться от Пресвятой и Пренепорочной Девы Марии; плоть одушевленную, подобострастную нам, принял благоволением Небесного Отца и содействием Святого Духа, и стал человеком, как я и ты, кроме греха; и был Иисус Христос и Сыном Божиим, и Сыном Девы Богородицы, – не в двух лицах, но един в двух естествах, неслитно познаваемый. Поэтому православно Его исповедуем совершенным Богом и совершенным человеком: Он, как прежде воплощения Богом был, так и по воплощении Богом пребывает, совершенный Бог и совершенный человек Иисус Христос, в Нем двойное естество, но единая Ипостась. Так верует и исповедует Его Святая Церковь и поет: «Царь Небесный за человеколюбие на земли явися, и с человеки поживе: от Девы бо чистыя плоть приемый, и из Нея прошедый с восприятием, един есть Сын, сугуб естеством, но не Ипостасию. Темже совершенна того Бога и совершенна человека воистину проповедающе, исповедуем Христа Бога нашего», и прочее (Стих. Богор. гл. 8 воскрес, на вечерни).'
      cn: 不可见的上帝，为要显现于世，与人同住，并为我们成就救恩，便乐意由至圣至洁童贞女马利亚道成肉身；祂蒙天父的喜悦，并借圣灵的协同作用，取了带着灵魂、与我们同性情的肉身，成为人，像你我一样，唯独没有罪；于是，耶稣基督既是上帝之子，也是诞神女之子——并非二位格，乃是一体，具有二性，毫不混淆地被认识。因此，我们正统地宣认祂是完全的上帝和完全的人：祂在道成肉身之前是上帝，道成肉身之后也依然是上帝，是完全的上帝和完全的人耶稣基督，在祂里面有双重本性，但位格是唯一的。圣教会如此相信并宣认祂，并歌颂道：「天上的君王，因其仁爱，降临于世，与人同住；因祂从贞洁的童贞女领受肉身，并由她而出，带着所取之人性，乃独一之子，具双重本性，而非双重位格。故我等实实宣扬其为完全之神、完全之人，而宣认基督乃我等之神。」等等 (颂诞神女升阶颂，第八调，复活日晚课)。
  - type: paragraph
    text:
      ru: Видим, как на земле явился Бог. В плоть нашу облекся и так явился. Так Невидимый стал видимым, так Неосязаемый стал осязаемым, так Неприступный Херувимам и Серафимам сделался доступным для грешников, так Безначальный начало принял, так «Ветхий днями» ( Дан 7 ) младенцем стал, так Содержащего все концы земли материнские руки держали и носили, так Питающий всякую плоть материнским молоком питался, так «возрастал» летами и «укреплялся духом» ( Лк 2:40 ) Неизменяемый, Вечный и Совершенный, так ходил по земле Бог,
      cn: 我们看见上帝如何在地上显现。祂披戴了我们的肉身，并如此显现。如此，那不可见的变得可见了；如此，那不可触及的变得可触及了；如此，连革鲁宾和撒拉弗都无法接近的，变得对罪人而言可接近了；如此，那无始的有了开端；如此，那「亘古常在者」（但 7）成了婴孩；如此，那托住地极的，被母亲的双手托住并怀抱着；如此，那供养一切血肉之躯的，靠母亲的乳汁哺育；如此，那永不改变、永恒且完全的，年岁「增长」并「心灵强健」（路加福音 2:40）；如此，上帝行走于地上。
  - type: paragraph
    text:
      ru: Царь Небесный, и между людьми обращался, и людьми виден был, и с людьми беседовал Сын Божий и Слово Отчее. Так Его видели апостолы Его, и осязали, и слышали из уст Его слова жизни, и беседовали с Ним, и ходили с Ним, и в след Его, и прочее, и нам проповедали.
      cn: 天上的君王，上帝之子，圣父之道，在世人中行走，被世人所见，并与世人交谈。祂的使徒们就是这样看见了祂，也触摸了祂，也从祂口中听到了生命的话语，也与祂交谈，也与祂同行，也追随祂的脚步，诸如此类，并将这一切传扬给了我们。
  - type: paragraph
    text:
      ru: О, «блаженно чрево, носившее Бога воплощенного, и сосцы, Его питавшие» ( Лк 11:27 )!
      cn: 哦， «福哉孕育道成肉身之上帝的腹胎，以及哺育了祂的乳房» ( 路加福音 11:27)！
  - type: paragraph
    text:
      ru: Блаженны руки, осязавшие Слово жизни!
      cn: 福哉亲手触摸生命之道的手！
  - type: paragraph
    text:
      ru: Блаженны очи, видевшие невидимого Бога, во плоти явившегося!
      cn: 福哉，得见显现于肉身的不可见之上帝的眼睛！
  - type: paragraph
    text:
      ru: Блаженны уши, слышавшие Слово Божие ипостасное!
      cn: 福哉，听闻上帝位格之圣言的耳朵！
  - type: paragraph
    text:
      ru: Блаженно то время, в которое Бог явился на земле!
      cn: 福哉那时代，上帝显现于地上！
  - type: paragraph
    text:
      ru: Блаженна та земля, по которой Царь Небесный ходил!
      cn: 福哉那大地，天上的君王曾行走其上！
  - type: paragraph
    text:
      ru: Блаженны те ризы, которыми одевался Бог, «одевающийся светом, как ризою» ( Пс 103:2 )!
      cn: 福哉那些袍服，上帝曾以之披戴，『祂以光为衣，如同袍服』（诗篇 103:2）！
  - type: paragraph
    text:
      ru: Поклонимся, возлюбленный, воплотившемуся Богу. Поклонимся на месте, «где стояли ноги Его» ( Пс 131:7 ). Он ради нас, ради тебя и меня и ради всякого явился на земле.
      cn: 让我们敬拜，蒙爱者啊，那道成肉身的上帝。让我们在他「脚站立的地方」敬拜（诗篇 131:7）。他为了我们，为了你和我，也为了每一个人，显现于地上。
  - type: paragraph
    text:
      ru: Пришел Свет наш к нам просветить тьму нашу.
      cn: 我们的光临到我们，光照我们的黑暗。
  - type: paragraph
    text:
      ru: Пришел Бог наш к нам и уподобился нам.
      cn: 我们的上帝来到我们这里，并与我们相似。
  - type: paragraph
    text:
      ru: Пришел Господь наш к нам и в рабском облике восхотел послужить рабам Своим.
      cn: 我们的上主降临我们中间，并以奴仆的形像，甘愿服侍祂的仆人。
  - type: paragraph
    text:
      ru: Пришел Царь Небесный к поданным Своим на землю не судить их, согрешивших, но взыскать и спасти погибших.
      cn: 天上的君王降临到祂地上的臣民那里，并非为审判那些犯了罪的他们，而是为了寻找并拯救那些失丧之人。
  - type: paragraph
    text:
      ru: Пришел Создатель наш к нам, созданию Своему, возобновить и воссоздать растленное Свое создание.
      cn: 我们的造物主来到我们这里，来到祂的受造物面前，为要更新并重造祂那败坏的受造物。
  - type: paragraph
    text:
      ru: Пришел Пастырь добрый взыскать заблудших Своих овец.
      cn: 善牧来到，寻找祂迷失的羊。
  - type: paragraph
    text:
      ru: 'О, новое чудо! О, дивное дело Бога нашего! «Бог – Господь, и явился нам» ( Пс 117:27 ). Царствующий во веки Господь Сил пришел: да благоговеет пред лицом Его вся земля.'
      cn: '哦，新的奇迹！哦，我们上帝奇妙的作为！

        «上帝是主，并向我们显现» (诗篇 117:27)。

        永远为王的万军之主已经降临：愿普世大地都在祂面前敬畏。'
  - type: paragraph
    text:
      ru: Уразумеем, брат, силу этого великого таинства. Ради нас Он пришел. Постараемся благоговейно встретить Его и поклониться Ему, и возлюбить явление Его, и сердце благодарное принести Ему вместо дара, и благоугодить Ему, да сподобимся благоугождать пред Ним в стране живых, и видеть Его одесную Бога сидящим во славе Отчей. Напишем, брат, великое сие дело на сердцах наших и день и ночь в том будем поучаться (См. Пс 1:2 ). Ибо нет ничего полезнее этого.
      cn: 弟兄，让我们领悟这伟大奥秘的力量。祂为我们降临。让我们努力以虔敬之心迎接祂，并敬拜祂，爱慕祂的显现，以感恩之心献予祂，以此代替献礼，并取悦于祂，好使我们配得在活人之地蒙祂喜悦，并得见祂坐在上帝右边，在父的荣耀中。弟兄，让我们将这伟大的事工铭刻于心，并日夜默想此事（诗篇 1:2）。因为再没有比这更有益的了。
  - type: paragraph
    text:
      ru: Поминай Господа Иисуса, пришедшего спасти нас, и оттуда или утвердишься в благочестии, или возбудишься к благочестию. Ибо сие есть корень и начало веры и благочестия.
      cn: 铭记降世拯救我们的主耶稣，由此你或在虔敬中得以坚固，或被激发而归于虔敬。因为这乃是信德和虔敬的根基和开端。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Просишь ты, чтобы я тебе написал прежде всего другого: что было при плотском рождении Сына Божия. Я тебе из Евангелия Его святого о том предлагаю, так как и все житие и дела Его преславные оно нам повествует. Итак, слушай:'
      cn: 你请求我，要我首先为你讲述上帝之子在肉身中诞生时所发生的事。我为此从祂的圣福音中向你讲述，因为福音也向我们叙述了祂全部的生平及其极荣耀的事迹。那么，请听：
  - type: paragraph
    text:
      ru: '1) Родился Христос Бог наш в вертепе и в яслях положен был Пресвятой Матерью Своей, как говорит Писание, «потому что не было им места в гостинице» ( Лк 2:7 ). Примечай здесь, любезный: не было места в гостинице Тому, Которому принадлежит вся вселенная и все, что наполняет ее; и в вертепе родился, и в яслях возлег Тот, Чей «престол – небо, а земля – подножие ног» ( Мф 5:34 ) Его. В самом рождении показывает чудный Младенец, что Он «не от мира сего» , странник и пришелец в мире этом, и «будучи богат, обнищал ради» нас, «дабы» мы «обогатились Его нищетою» ( 2Кор 8:9 ).'
      cn: 我们的上帝基督诞生在洞穴里，由祂至圣之母安放在饲槽中，正如圣经所言：「因为客店里没有地方给他们。」（路加福音 2:7）亲爱的，请在此留意：客店里没有地方给那拥有整个宇宙及其间一切所有的上帝；那在洞穴中诞生、躺卧在饲槽中的，祂的「宝座是天，地是祂的脚凳」（马太福音 5:34）。这奇妙的婴孩在祂的诞生中表明，祂「不属于这世界」，是这世界里的异乡人和寄居者，并且「祂本富足，却为」我们「成了贫穷，叫」我们「因祂的贫穷，可以成为富足」（哥林多后书 8:9）。
  - type: paragraph
    text:
      ru: 'От этого мы учимся богатство и славу мира сего презирать, и как странники и пришельцы в мире этом быть, и не иметь «здесь постоянного града, но» искать «будущего» ( Евр 13:14 ): не строить себе богатых домов, но довольствоваться такими, какие могут нас упокоить и от воздушной бури и дождя защитить. Видим, где родился и возлег Царь Небесный: вертеп вместо дома, и ясли скотские вместо одра были Ему. Да постыдится гордость человеческая, видя Царя Небесного в таком смирении и нищете.'
      cn: 从此我们学会鄙视这世上的财富与荣耀，并且在这世上作客旅和寄居的，不「在此有常存的城，乃是寻求那将来的」（希伯来书 13:14）；不为自己建造奢华的房屋，而是满足于那些能使我们安息并遮蔽我们免受风暴和雨水侵袭的居所。我们看到天国的君王在哪里诞生并安卧：洞穴取代房屋，牲畜的食槽取代床榻成了祂的所在。愿人的骄傲因此感到羞愧，当看到天国的君王如此谦卑和贫困时。
  - type: paragraph
    text:
      ru: '2) Только что родился чудный сей Младенец, воспели хвалу и славу Божию Ангелы Божии: «Слава в вышних Богу, и на земли мир, во человецех благоволение» ( Лк 2:14 ). Воспели благость Божию, ибо помиловал нас, и нашему сорадовались спасению, «ибо ныне родился» нам «в городе Давидовом Спаситель, Который есть Христос Господь» ( Лк 2:11 ). От этого мы учимся радоваться не о золоте, серебре, чести, славе и о прочем сокровище мира сего, о чем сыны века сего радуются, но радоваться о Боге, Спасе нашем, как Пресвятая Матерь Божия о Себе сказала: «Возрадовался дух Мой о Боге, Спасителе Моем» ( Лк 1:47 ), – и в радости духа благодарить и воспевать Бога нашего за великое Его дело и прочие благодеяния, да будет согласная музыка между земной и небесной, воинствующей и торжествующей Церковью. Так будет и от небесных и от земных жителей Бог славиться.'
      cn: 2) 这位奇妙的婴孩刚刚诞生，上帝的众天使便歌颂赞美上帝的荣耀：「在至高之处荣耀归于上帝，在地上平安归于人中有善意者。」 (路加福音 2:14)。他们歌颂上帝的恩慈，因祂怜悯了我们，并为我们的救恩同享喜乐，因为「今天在大卫的城里，为我们生了救主，就是主基督。」 (路加福音 2:11)。由此我们学习，不要为金银、尊荣、世俗的荣耀和世上其他的财宝而欢喜，因为这些是今世之子所欢喜的；而是要为上帝，我们的救主而欢喜，正如至圣上帝之母论及自身所言：「我灵以上帝我的救主为乐。」 (路加福音 1:47)，并以心灵的喜乐感谢歌颂我们的上帝，因祂的伟大作为和其余的恩惠，为使地上和天上的、争战中和凯旋中的教会之间，能有和谐的乐章。如此，上帝便会蒙天上和地上的居民所荣耀。
  - type: paragraph
    text:
      ru: '3) Явилась чудная звезда на востоке, которая там подвигла волхвов и привела во Иерусалим, и оттуда в Вифлеем, где Христос Господь родился, и став вверху над тем местом, где был рожденный Младенец, показала им Того, Которому они, припав со смирением и благоговением, поклонились, и дары свои – золото, ладан и смирну – поднесли. Смотри, каково величество Младенца рожденного: никто не рождается царем, но об этом Младенце вопрошали волхвы, пришедшие во Иерусалим: «Где родившийся царь Иудейский» ( Мф 2:2 )? И хотя в убогом мете и нищете увидели Его, однако, как великого царя, благоговейным поклонением и дарами, царской чести достойными, почтили. Поклонимся и мы Ему, следуя тем благочестивым мужам. Поклонимся не в пеленах лежащему, но одесную Бога, во славе Отчей царствующему, и принесем дары: веру, смирение, любовь и благодарение, каковых даров Он от нас требует, как Царь и Господь наш.'
      cn: 3) 奇妙的星辰在东方显现，它在那里感动了东方博士，并将他们引到耶路撒冷，又从那里引到伯利恒，基督上主在那里诞生。这星辰停留在圣婴诞生之处的上方，向他们指示了那一位，他们便俯伏在地，以谦卑和敬畏的心向祂朝拜，并献上他们的礼物——黄金、乳香和没药。看哪，那诞生的圣婴何等威严！没有人是生而为王，然而，关于这位圣婴，来到耶路撒冷的东方博士们却问道：「那生下来作犹太人之王的在哪里？」（马太福音 2:2）。尽管他们在简陋之地和贫困之中见到了祂，却仍以敬虔的朝拜和配得上君王尊荣的礼物，向祂致敬。愿我们也效法那些虔敬的贤士们，向祂朝拜。我们当朝拜的，不是卧于襁褓之中的那位，而是坐于上帝右边，在父的荣耀中为王的。并献上我们的礼物：信心、谦卑、爱和感恩，因为我们的君王和上主向我们要求的就是这些礼物。
  - type: paragraph
    text:
      ru: 4) Потом, в восьмой день по рождении Своем, был обрезан по закону Моисееву. Ибо Иудеям было повелено от Бога обрезать младенцев в восьмой день по рождении. Этот закон исполняя, Христос в восьмой день был обрезан, вместо чего нам установлено Им святое Крещение. Примечай, возлюбленный, закону не подлежащий Господь и закона Творец – закон исполнил и обрезание претерпел безгрешный Младенец, чтобы нас от клятвы законной искупить. Обрежем и мы сердца наши от негодных похотей и страстей, дабы так закон Божий исполнить.
      cn: 4) 接着，在祂诞生后的第八天，祂按照摩西律法受了割礼。因为上帝曾命令犹太人，在婴儿诞生后的第八天为他们行割礼。基督遵行此律法，在第八天受了割礼，以此取代，祂为我们设立了圣洗。亲爱的，请留意，不受律法约束的、律法的创造者——上主——这位无罪的婴孩，却遵守了律法，忍受了割礼，为要将我们从律法的咒诅中救赎出来。我们也当割除我们心中不洁的贪欲和情欲，好能如此遵行上帝的律法。
  - type: paragraph
    text:
      ru: '5) При этом наречено имя Ему Иисус, которое еще прежде рождения Его дано было Ему Ангелом. Иисус – имя еврейское, и значит – Спаситель. Поэтому при наречении имени и сказано Ангелом: «Ибо Он спасет людей Своих от грехов их» ( Мф 1:21 ). Смотри здесь: нарекся именем Тот, имя Которого чудно, – «Господь имя Ему» ( Пс 67:5 ). Ради нас нарекся так человеколюбивый Бог и самим именем показывает, что Он Спаситель наш, что Он пришел в мир спасти грешников. Сладко нам, грешным, имя это – Иисус. Напишем имя это на сердцах наших, и всегда его с любовью будем поминать, и им, как щитом крепким, будем ополчаться против врагов душ наших, и защищать себя и прогонять их от себя. Ибо трепещет от имени сего все их темное полчище. Узнали они, что значит – Иисус.'
      cn: 5) 与此同时，祂被命名为耶稣，这名字在祂出生之前，就由天使赐给了祂。耶稣是希伯来语的名字，意思是——救主。因此，在祂命名之时，天使曾说：「因为祂要将自己的百姓从他们的罪恶中拯救出来」（马太福音 1:21）。看哪：被命名的是那位名字奇妙的，——「上主是祂的名」（诗篇 67:5）。为了我们，那慈爱世人的上帝被这样命名，并且祂以这名字本身表明祂是我们的救主，祂来到世上是为了拯救罪人。对于我们这些罪人来说，这名字——耶稣——是何等甘甜。让我们将这名字铭刻在我们的心上，并永远怀着爱默念祂，并以祂作为坚固的盾牌，抵御我们灵魂的仇敌，保护自己，并将其从我们身边赶走。因为祂的名令它们那所有的黑暗军团都战栗。它们深知——耶稣——意味着什么。
  - type: paragraph
    text:
      ru: О, Иисусе, надежда и хвала Израилева, помоги нам и спаси нас! Да будет имя сие благословенно во веки!
      cn: 哦，耶稣，以色列的盼望与荣耀，帮助我们并拯救我们！愿这名直到永远蒙福！
  - type: paragraph
    text:
      ru: '6) Как сорок дней исполнилось по рождении, принесен был Матерью Своей святой во храм Господень, также по закону Господнему, как о том написано во Евангелии. Тут Его встретил и на руки свои принял, благоговейно и радостно, святой и престарелый муж Симеон, которому «было предсказано Духом Святым, что он не увидит смерти, доколе не увидит Христа Господня» . Увидев же Его, узнал, что Сей есть Христос Господь, и на руки взяв, воскликнул к Нему с радостью: «Ныне отпускаешь раба Твоего, Владыко, по слову Твоему, с миром» , и прочее ( Лк 2:26, 29 ).'
      cn: 6) 祂生后四十天届满时，由祂的圣母带着被带到上主的圣殿，也是按照上主的律法，正如福音书中所记载的。在那里，圣洁而年迈的西缅老人迎接了祂，并恭敬而喜乐地将祂抱在怀里，圣灵曾向他预告，「他必不死，直到看见上主的基督为止」。他看见了祂，便认出这正是基督上主，并将祂抱在怀中，喜乐地向祂呼喊说：「主宰啊，如今祢照祢的话，释放祢的仆人平安离去吧！」等等（路加福音 2:26，29）。
  - type: paragraph
    text:
      ru: 'Примечай здесь, возлюбленный брат, каковы величество и власть Младенца Того. Видит и на руках держит богодухновеный старец Младенца, но у Него, как у Господа своего, просит, чтобы отпустил его к иной жизни, как Церковь поет и в лице Христовом глаголет: «Не старец держит Мене, но Аз держу его.'
      cn: 蒙爱的弟兄，请注意这里，那婴孩何等的威严和权柄！被圣灵感动的长者看见并手中抱着婴孩，却向祂，如同向自己的主，祈求祂允他安然离世，正如教会所咏唱的，并以基督的口吻说：「并非长者抱着我，而是我抱着他。」
  - type: paragraph
    text:
      ru: Той бо от Мене отпущения просит» (Стихира на празднование Сретения Господня). Ибо если и Младенца видел, но познал Бога и Господа своего, во плоти явившегося и ставшего младенцем.
      cn: 「因他向我求离去（安息）。」（献主节庆典赞词）。因他即使看见的是一位婴孩，却认出他道成肉身显现并成为婴孩的上帝和上主。
  - type: paragraph
    text:
      ru: О, блаженны те руки, которые Бога воплотившегося объяли и осязали! Какая тогда была радость в сердце старца, когда Бога, все держащего, в объятиях своих держал!
      cn: 噢，福哉，那些拥抱并亲手触摸了道成肉身的上帝的双手！长老心中是何等的喜乐啊，当他怀抱着执掌万有的上帝之时！
  - type: paragraph
    text:
      ru: 'Очистим и мы, возлюбленный, сердца наши от всякой скверны плоти и духа, дабы принять в них Христа Господня, ибо Он хочет прийти и посетить нас и стучит в двери: «Се, стою у двери и стучу: если кто услышит голос Мой и отворит дверь, войду к нему, и буду вечерять с ним, и он со Мною» ( Откр 3:20 ).'
      cn: 蒙爱者，我们也要洁净我们的心，脱离一切身体与灵魂的污秽，为要领受在其中上主基督，因为祂愿意来到并探望我们，并敲门说：「看哪，我站在门外敲门；若有听见我声音就开门的，我要进到他那里去，我与他，他与我一同坐席。」（启示录 3:20）
  - type: paragraph
    text:
      ru: О, благость Иисуса, Который обходит, и ищет, и хочет в дома сердец наших войти!
      cn: 哦，耶稣的良善，祂巡行，寻找，并渴望进入我们心中的家园！
  - type: paragraph
    text:
      ru: Как блаженно то сердце, которое сего сладчайшего Гостя принять удостоится! Удостоится такой вечери и таких благ, которых «око не видело, и ухо не слышало, и не приходило то на сердце человеку» ( 1Кор 2:9 ).
      cn: 福哉那颗有幸得以接纳这位至甘美贵客的心！它必有幸得以领受这等宴席和这等福祉，是「眼睛未曾看见，耳朵未曾听见，人心也未曾想到的」（哥林多前书 2:9）。
  - type: paragraph
    text:
      ru: Упокоим же и мы, о возлюбленный, сего сладкого и великого Гостя в домах наших, дабы и нам подал Он покой в вечном Своем царствии. Примем Его здесь, дабы и Он нас там принял. Постараемся принять драгоценнейший сей залог вечной жизни ныне, дабы с радостью и доброй надеждой отойти на тот век, когда Он от сего многобедного жития нас позовет.
      cn: 哦，亲爱的，让我们也在我们家中安顿这位甜蜜而伟大的客人吧，为的是祂也能在祂永恒的国度里赐给我们安息。我们在这里接纳祂，为的是祂也能在那里接纳我们。让我们努力在现今接纳这最宝贵的永生凭据吧，为的是当祂将我们从这多苦的人生中召走时，我们能带着喜乐和美好的希望进入永恒。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'При этом помянем, что апостол святой написал: «Не Ангелов восприемлет Он, но восприемлет семя Авраамово» ( Евр 2:16 ). Что сие значит? Значит горячую и неизреченную любовь Сына Божия к роду человеческому: так Он возлюбил род человеческий, что не ангельское естество, которое выше человеческого, но человеческое Себе принять в соединение благоизволил, чем неизреченно почтил наше естество; сделался плоть от плоти нашей, и кость от костей наших. Потому и не стыдится братией нарицать нас, говоря: «Возвещу имя Твое братиям Моим, посреди церкви воспою Тебя» ( Евр 2:12 ), и в других местах. Какая большая может быть честь людям? Ум постигнуть не может как любви Сына Божия к людям, так и чести их от того. Поэтому говорит: «Тем, которые приняли Его» (Иисуса), «верующим во имя Его, дал власть быть чадами Божиими» ( Ин 1:12 ). И воистину, чем более обесчестилось человеческое естество падением, тем более почтилось и превознеслось воплощением Сына Божия. Слава Богу, благоволившему так!'
      cn: 在此，我们谨记圣使徒写道：「祂固然不取天使，乃取亚伯拉罕的后裔」（希伯来书 2:16）。此何意哉？此意谓上帝之子对人类炽热且莫可言喻的爱：祂如此爱惜人类，以致乐意将人性体与自身联合，而非那比人性体更高的天使性体，借此莫可言喻地尊荣了我们的性体；祂成了我们骨中的骨，肉中的肉。因此祂不以为耻地称我们为弟兄，说：「我要将祢的名传与我的弟兄，在教会中我要歌颂祢」（希伯来书 2:12），以及在其他经文中。人还能得着何等更大的尊荣呢？人的心智无法测度上帝之子对人的爱，以及人因此所获得的尊荣。因此经文说：「凡接受祂（耶稣）的，就是信祂之名的人，祂就赐他们权柄成为上帝的子女」（约翰福音 1:12）。诚然，人性体因堕落而愈受羞辱，就愈发藉着上帝之子的道成肉身而受尊荣并高举。荣耀归于如此美意之上帝！
  - type: paragraph
    text:
      ru: 'Отсюда мы учимся:'
      cn: 从中我们学习到：
  - type: paragraph
    text:
      ru: 1) Познавать любовь Божию к нам.
      cn: 认识上帝对我们的爱。
  - type: paragraph
    text:
      ru: 2) Любить Возлюбившего нас.
      cn: 2) 爱那位爱我们的。
  - type: paragraph
    text:
      ru: 3) От сердца Его за это благодарить.
      cn: 3) 衷心为此感谢祂。
  - type: paragraph
    text:
      ru: 4) Из любви и благодарности оказывать Ему святое послушание.
      cn: 4) 出于爱和感恩，向祂献上圣洁的顺服。
  - type: paragraph
    text:
      ru: 5) Братию свою, прочих людей, любить и почитать.
      cn: 5) 当爱和敬重自己的弟兄，以及其余的人。
  - type: paragraph
    text:
      ru: 6) Учатся господа со слугами своими как с братией своей поступать и не стыдиться нарицать их братией своей. Ибо если Господь, Царь царей, не стыдится нас братией называть, то тем более люди людей должны братией своей называть. Рассуждай об этом и увидишь, как худо делают люди, которые гнушаются подлой (простой) братией. Ибо все люди единого естества, благородные и худородные – все люди, один другого не лучше. Помни это, и сломится рог гордости и презрения.
      cn: 6) 主人当学会对待他们的仆人如兄弟，并且不以为耻称呼他们为自己的兄弟。因为如果上主，万王之王，尚不以为耻称我们为兄弟，那么人们更应当称呼彼此为自己的兄弟。思想此事，你将看见那些鄙视卑微（普通）的弟兄的人做得多么不好。因为所有人都是同一本性，无论出身高贵还是出身卑微——所有人，彼此之间并无优劣。记住此事，骄傲与轻蔑的角就会折断。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: что далее последовало по рождении Сына Божия?'
      cn: 你发问：在上帝之子降生之后，其后发生了什么？
  - type: paragraph
    text:
      ru: Ответ. Повествует святое Его Евангелие, что царь Ирод хотел Его убить, и потому Пресвятая Матерь Божия и святой Иосиф, Ее обручник, со Христом бежали в Египет, по извещению ангельскому, и там некоторое время жили, скрываясь от убийцы.
      cn: 答：祂的圣福音记述道，希律王想要杀害祂，因此至圣圣母和她的未婚夫圣约瑟，带着基督按照天使的指示逃往埃及，并在那里住了一段时间，躲避那个杀手。
  - type: paragraph
    text:
      ru: 'Примечай здесь:'
      cn: 请注意：
  - type: paragraph
    text:
      ru: 1) Мир, во зле лежащий, благочестия истинного не любит и гонит. Христос, само благочестие и неповинность, только что в мире показался и, как младенец незлобивый, никому зла не мог сотворить, хотя и никогда зла не сотворил, но гонение начал терпеть, и от града во град, и от страны в страну бегал.
      cn: 1) 躺卧在邪恶之中的世界，不爱并迫害真正的虔敬。基督，祂本身即是虔敬与无罪，才刚在世上显现，并且，像一个天真无邪的婴孩，对任何人都不可能作恶，尽管祂从未作恶，却开始遭受迫害，并且从一座城到另一座城，从一个国家到另一个国家逃亡。
  - type: paragraph
    text:
      ru: Отсюда следует, что в ком зачнется духовно Христос – истина, за тем следует гонение, как за истиной – тень. «И все, желающие жить благочестиво во Христе Иисусе, будут гонимы» ( 2Тим 3:12 ), по слову апостольскому. Поэтому, если тебе гонение приключается и ненависть от мира, не смущайся о том. Ибо для мира истинное богопочитание и благочестие есть камень преткновения и камень соблазна. Мир ненавидит то, что противно ему и глаза колет, поэтому отвергает от себя и гонит противного себе, но блаженны гонимые миром, потому что Бог их принимает. Этим утешайся, когда от мира гонение терпишь за благочестие.
      cn: 由此可见，凡在灵里怀有基督——真理者，迫害必随之而来，如同真理亦有其影相随。正如使徒所言：「凡立志在基督耶稣里敬虔度日者，都必遭受迫害」（提摩太后书 3:12）。因此，若你遭受来自世界的迫害与仇恨，切勿为此烦恼。因为对世界而言，真正的敬拜上帝和敬虔，是绊脚石和引人跌倒的石头。世界憎恨一切与它相悖、扎眼的事物，因此它排斥并迫害那些与它相悖之人，但福哉那些被世界迫害的人，因为上帝悦纳他们。当你因敬虔而遭受来自世界的迫害时，你当以此为安慰。
  - type: paragraph
    text:
      ru: 2) Отсюда учимся не вдаваться в явную напасть дерзновенно, но уклоняться от напасти. Христос мог сохранить жизнь свою и в том месте, где был (ибо все возможно Ему, как Богу, хотя и был по плоти младенцем), но уклонился от убийцы, подавая нам пример уклоняться от находящего зла.
      cn: 2) 从此我们学习不要鲁莽地陷入明显的祸患，而是躲避祸患。基督本可以在他所在之处保全自己的生命（因为万事在祂皆有可能，祂既是上帝，尽管按肉身祂还是个婴孩），但祂却躲避了那个杀人者，为我们树立榜样，叫我们躲避临近的邪恶。
  - type: paragraph
    text:
      ru: 3) Учимся терпеть обижающих нас, не противиться им, но уступать им и «давать место гневу Божию» ( Рим 12:19 ). Ибо истинное благочестие и истинная христианская победа – побеждать зло творящих кротостью и незлобием, чему нас Спаситель наш Своим примером научил.
      cn: 3) 我们学习忍受那些冒犯我们的人，不反抗他们，而是顺从他们，并「给上帝的忿怒留地步」（罗马书 12:19）。因为真正的虔诚和真正的基督徒的胜利，是以温柔和不抱恶意战胜那些作恶的人，这是我们的救主以祂的榜样教导我们的。
  - type: paragraph
    text:
      ru: 4) Видим, что от самых пелен начал Спаситель наш крест носить ради нас, ибо как ради нас в мир родился, так ради нас и гонение терпел. Последуем и мы Ему, взяв крест свой, последуем ему, дабы и по смерти с Ним быть во царствии Его.
      cn: 4) 我们看到，我们的救主从襁褓之时起，就为了我们开始背负十字架，因为祂既是为了我们降生于世，也同样是为了我们忍受迫害。我们也当背负我们自己的十字架，追随祂，好使我们甚至在死后也能与祂同在祂的国度里。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Вопрошаешь, что подвигло беззаконного царя желать убиения Христа-младенца?
      cn: 你发问，什么驱使不法的君王企图杀害圣婴基督？
  - type: paragraph
    text:
      ru: Ответ. Читаем в Евангелии святом, что он слышал от волхвов, что Младенец рожденный есть Царь Иудейский, поэтому он, как властолюбивый, боялся, чтобы не лишиться царства, замыслил убить новорожденного Царя и, не имея возможности Его отыскать, устремился убийством на неповинных младенцев Вифлеемских ( Мф 2:16 ), чтобы так и Христа между ними убить смог.
      cn: 回答。我们在圣福音中读到，他从东方贤士那里听到那新生的婴孩是犹太人的君王，因此他，作为一名权力欲望强烈的人，害怕失去王位，便图谋杀害这位新生的君王。由于无法找到祂，便转而屠杀伯利恒的无辜婴孩（马太福音 2:16），好让基督也一同被杀害。
  - type: paragraph
    text:
      ru: 'Отсюда видим:'
      cn: 由此可见：
  - type: paragraph
    text:
      ru: 1) Что беззаконные люди на любое зло дерзают, только чтобы прихотей своих не лишиться. А особенно сильные и властные, но беззаконные, страшное зло в обществе делают, ибо им не страшно на всякое зло дерзать, когда видят какое препятствие своим прихотям.
      cn: 1) 不法之人，胆敢行一切恶事，只为不致失去他们自己的私欲。尤其是那些强有力、有权势但不法之人，他们在社会中施行可怕的恶行，因为每当他们的私欲遇到任何阻碍时，他们便毫无畏惧地胆敢行一切恶事。
  - type: paragraph
    text:
      ru: 2) Властолюбие – великое зло в человеке и всякому злу начало. Оно не устрашается и царей касаться, и с престолов свергать, или убивать. Видим здесь, что беззаконному Ироду не страшно было столько тысяч неповинных младенцев убить, чтобы только не лишиться царской власти.
      cn: 2) 权力欲是人里面巨大的邪恶，并且是一切邪恶的开端。它不畏惧触犯君王，将他们从宝座上废黜，或加以杀害。在此我们看到，那不法之人希律不以为惧杀害数以千计的无辜婴孩，仅仅是为了不丧失王权。
  - type: paragraph
    text:
      ru: О, какое великое зло – властолюбие! Бедный человек хочет другими владеть, но сам собой не может владеть. Избегай же этого зла, чтобы и себя и других не погубить. Надо прежде научиться собой владеть и тогда над другими власть принимать. Рассуждай об этом и берегись зла.
      cn: 哦，贪恋权势是何等大的罪恶啊！可怜的人想要辖制他人，自己却不能掌控自己。务要避开这种邪恶，免得败坏自己也败坏他人。必须首先学会掌控自己，然后才能领受治理他人的权柄。当对此深思，并警惕邪恶。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Ты хочешь знать, какое потом гонение терпящему Сыну Божию приключилось?
      cn: 你想知道，后来何等的逼迫临到了那受苦的上帝之子吗？
  - type: paragraph
    text:
      ru: 'Ответ. Евангелие святое говорит нам, что Он, несколько во Египте пожив, возвратился со своей святой Матерью и с Иосифом в землю Израилеву, по извещению Ангела, и это возвращение случилось после смерти Ирода, как Ангел Божий сказал Иосифу святому: «Умерли искавшие души Младенца» . Но когда в землю Израилеву пришли, услышал Иосиф, «что Архелай царствует в Иудее вместо Ирода, отца своего, убоялся туда идти; но, получив во сне откровение, пошел в пределы Галилейские и, придя, поселился в городе, называемом Назарет» , где прочее время жил и «где был воспитан» Христос ( Мф 2:20–23 ; Лк 4:16 ), потому и называется Назорей ( Мф 2:23 ).'
      cn: 答。圣福音告诉我们，祂在埃及居住了一段时间后，便与祂的圣母和约瑟一同返回以色列地，依照天使的通告。这次返回发生在希律死后，正如上帝的天使对圣约瑟说：「那寻索婴孩性命的人已经死了。」然而，当他们来到以色列地时，约瑟听说「亚基老接续他父亲希律作了犹太的王，就害怕往那里去；却在梦中得了启示，就往加利利境内去了，到了那里，就住在一座名叫拿撒勒的城里。」基督在那里度过了余下的时光，并且「在那里长大成人」(马太福音 2:20-23，路加福音 4:16)，因此被称为拿撒勒人(马太福音 2:23)。
  - type: paragraph
    text:
      ru: 'Смотри, возлюбленный:'
      cn: 看啊，蒙爱者：
  - type: paragraph
    text:
      ru: '1) Еле-еле нашлось безопасное место дня воспитания Сына Божия, странствующего на земле, и Тот, Которому принадлежит земля и все, что наполняет ее, из страны в страну бегая, в малом и всеми презираемом городке Назарете стал жить. Так и истинные христиане, рабы Его, пребывают в мире этом странниками и пришельцами: «не» имеют «здесь постоянного града, но» ищут «будущего» ( Евр 13:14 ). На чужой стороне живя, всего опасаются, мир и дьявол непрестанно гонят их и стараются их погубить или повредить, «потому что они не от мира» ( Ин 17:16 ), как и сам Христос, Начальник их.'
      cn: 好不容易才找到一个安全的地方，来养育那在地上漂泊的上帝之子，而祂，大地和其中一切的丰盛都属于祂，却从一国逃到另一国，最终开始居住在卑微且被众人藐视的拿撒勒小镇。真基督徒，祂的奴仆，亦是如此，在这世上作客旅和寄居者：「我们在这里并没有常存的城，却寻求那将来的城」（希伯来书 13:14）。居住在异乡，他们对一切都警惕戒备，世界和魔鬼不停地逼迫他们，试图毁灭或伤害他们，「因为他们不属于世界」（约翰福音 17:16），正如他们的元首基督一样。
  - type: paragraph
    text:
      ru: Пристанем и мы к странникам этим, дабы с ними в небесное отечество прийти. Напишем на сердцах наших, что мы в мир этот входим не ради мира, но ради перехода на тот век, тогда подлинно и мы странниками в мире этом будем. Тогда не будем искать здесь ни богатства, ни чести, ни славы, не будем строить богатых домов, и прочее, зная, что все это оставим в этой стороне, но будем «искать будущего града, которого художник и строитель Бог» ( Евр 11:10 ).
      cn: 愿我们也附随这些客旅，以便和他们一同进入天上的本乡。愿我们将此铭刻在我们心上：我们进入这世间，不是为了世界本身，而是为了过渡到那永世，那时，我们也才真是这世间的客旅。那时，我们将不在这里寻求财富、尊荣，亦不寻求荣耀，也不建造豪华的房屋，以及诸如此类的一切；因为我们知道，这一切都将留在这片土地上，而是要「寻求那将来的城，那城的建筑师和建造者乃是上帝」（希伯来书 11:10）。
  - type: paragraph
    text:
      ru: 2) Ирод боялся лишиться царства и потому такое кровопролитие учинить не убоялся, однако же не только царства, но и жизни лишился. Так смерть всему конец полагает и всех равными делает.
      cn: 2) 希律惧怕失去王权，因此不惧行此杀戮，然而他不但失去了王权，更失去了生命。如此，死亡终结万物，使众生平等。
  - type: paragraph
    text:
      ru: 3) Видим, что люди «там боятся, где нет страха» , но там не боятся, где истинный страх. Боятся лишиться чести, славы, богатства, что все следует необходимо оставить всякому, но не боятся беззаконничать и навечно погибнуть. Это ослепление ума человеческого.
      cn: 我们看到，人们『在那里惧怕，其实并无惧怕之处』，却在真正可惧之处不感到惧怕。他们惧怕失去尊荣、荣耀、财富，而这些都是每个人都必将舍弃的，却不怕行不法之事并永远灭亡。这是人心的蒙蔽。
  - type: paragraph
    text:
      ru: '4) Злодеев и душегубцев казнь Божия постигает. Они думают долго жить и беззакониями свирепеть, но невидимо им ров копается, и нечаянно впадают в него. Так Ирод хотел погубить Христа, и столько младенцев погубил, и хотел долго царствовать, но не удалось: «умерли искавшие души Младенца» . Так Авессалом хотел отца своего Давида умертвить, но нечаянно повис между небом и землей ( 2Цар 18:9 ). Так Фараон, притеснявший Израиль, но Божиим неоднократным наказанием убежденный, отпустил было его от себя, но опять, раскаявшись на свою беду, погнался в след за ним, желая себе поработить его и вместо раба иметь, но нечаянно, где надеялся найти корысть, там погибель себе и всему своему воинству отыскал, потонув, словно олово, в воде. Так судьбы Божии постигают своевольных и неисправных беззаконников.'
      cn: 恶人和杀人者必遭上帝的刑罚。他们以为能长寿并横行不法，然而，暗地里有坑为他们挖好，他们不期然地坠入其中。正如希律想要杀害基督，并杀害了如此多的婴孩，也想长久作王，然而未能如愿：「那些寻求婴孩性命的人已经死了。」同样，押沙龙想要杀死他的父亲大卫，却不期然地悬挂在天地之间（撒母耳记下 18:9）。同样，压迫以色列的法老，屡次被上帝的刑罚所折服，本已将他们放走，却又为自己的祸患而悔恨不已，追赶在他们之后，妄图使他们为自己为奴，并成为自己的仆役，却不期然地，在他原以为能获得利益之处，为自己和他的全军找到了毁灭，如同铅一般沉入水中。如此，上帝的定数临到那些刚愎自用且不思悔改的不法者身上。
  - type: paragraph
    text:
      ru: 5) Не будем же ревновать «лукавым» и не будем завидовать «делающим беззаконие, ибо они, как трава, скоро засохнут, и как зеленый злак, скоро отпадут» , по увещанию Псаломника ( Пс 36:2 ). Но гонение и озлобление, нам от них бываемое, предадим Богу, судящему праведно, и «терпением» нашим будем «спасать души наши» .
      cn: 5) 我们不要嫉妒那些「恶人」，也不要嫉妒那些「行不义的，因为他们必如草快快枯干，又如绿草快快凋谢」，这乃是按照圣咏作者的劝诫（诗篇 36:2）。但我们从他们那里所受的逼迫和恶意，要交托给公义审判的上帝，并以我们的「忍耐」来「拯救我们的灵魂」。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Просишь, чтобы я написал тебе еще о Спасителе нашем. Хорошо, и мне это полезно. Предлагаю тебе о том (рассуждение).
      cn: 你求我再给你写一些关于我们救主的事。好，这对我也很有益。我向你呈上关于此的（一篇论述）。
  - type: paragraph
    text:
      ru: 'Читаем в Евангелии, что когда Сын Божий «был двенадцати лет» и когда «по обычаю» Матерь Его святая с Ним и с Иосифом пришла «в Иерусалим на праздник Пасхи» и, «по окончании дней праздника» , возвращалась в свой дом, то на пути заметила, что возлюбленного Сына Ее не было с ними, и, поискав Его «между родственниками и знакомыми и не найдя Его» , возвратилась в Иерусалим взыскать Его. Где же Его нашли? Слушай, что говорит евангелист: «Через три дня нашли Его в храме, сидящего посреди учителей, слушающего их и спрашивающего их; все слушавшие Его дивились разуму и ответам Его» ( Лк 2:46–47 ).'
      cn: 我们在福音书中读到，当上帝之子「十二岁的时候」，祂的圣母「按着惯例」与祂和约瑟一同「上耶路撒冷去守逾越节的筵席」，并在「守满了节期的日子」之后，回自己的家时，在路上发觉祂所爱的儿子不在他们中间，于是「在亲族和熟识的人中找祂，却找不着」，就回到耶路撒冷去寻找祂。祂在哪里被找到的呢？听听福音书作者怎么说：「过了三天，他们发现祂在殿里，坐在教师中间，一面听，一面问；凡听见祂的，都惊奇祂的悟性和祂的回答。」（路加福音 2:46-47）
  - type: paragraph
    text:
      ru: 'Примечай здесь, брат:'
      cn: 请注意此处，兄弟：
  - type: paragraph
    text:
      ru: '1) Где Спаситель наш Господь обретен святой Матерью Своей? Не на торжище, ни на ином подобном месте, но в церкви, где закон Божий толковался. Там Его отыскала, «сидящего посреди учителей, и слушающего их, и спрашивающего их» . Так и ныне в тех сердцах Он обретается, которые «в законе Господнем день и ночь поучаются» . В них Он звание Свое учительское совершает; слушает их, сердечно молящихся Ему, и отвечает им в сердцах их; просвещает их светом Своим, вразумляет, умудряет, открывает тайны Свои и в удивление приводит; возбуждает в них истинную и живую веру, возжигает любовь и учит смирению и кротости. А удаляется от тех, которые суету, ложь и беззакония замышляют и в тех поучаются. Рассуждай об этом и поучайся в законе Господнем. «Блажен муж, который не пошел на совет нечестивых, и на путь грешных не встал, и на седалище губителей не сел: но в законе Господне воля его, и в законе Его поучится день и ночь» ( Пс 1:1–2 ).'
      cn: 我们的救主上主何处被祂的圣母寻获？不在市集，也不在其他类似之处，而是在教堂里，在那里，上帝的律法被诠释。在那里，她寻见祂，«坐在教师们中间，一面听，一面问»。现今亦然，祂在那些心中被寻获，那些«日夜默想上主律法»之人。在他们之中，祂履行自己的教师职分；聆听他们衷心的祷告，并在他们心中回应他们；以祂的光照亮他们，赐予悟性，赋予智慧，启示祂的奥秘，并使其惊叹；在他们心中激发真实而活泼的信仰，点燃爱火，并教导谦卑与温柔。而祂却远离那些图谋虚妄、谎言和不法之事，并在其中沉迷学习的人。当思考此事，并默想上主的律法。«福哉！不从恶人的计谋，不站罪人的道路，不坐亵慢人的座位；他的喜乐在于上主的律法，他昼夜思想上主的律法。» (诗篇 1:1-2)。
  - type: paragraph
    text:
      ru: 2) Премудрость, и разум, и ответы Его, для отроческого возраста необычные, показывали, что Он есть ипостасное Слово Божие, Отчая премудрость и сила, во плоти явившаяся и между людьми живущая. «Все слушавшие Его дивились разуму и ответам Его» .
      cn: 2) 祂的智慧、悟性与回答，对于祂的孩童时期而言是异乎寻常的，表明祂是位格性的上帝圣言，是父的智慧与能力，在肉身中显现，并居住在人间。「所有听祂说话的人，都惊叹于祂的悟性和回答」。
  - type: paragraph
    text:
      ru: 3) Сын Божий, ипостасная Божия премудрость, не гнушался слушать людей – законоучителей, тем более нам, хотя считаем себя мудрыми, должно слушать всякого – и презираемого, и простого, и неученого, – когда полезное что говорит; смотреть не на лицо, но на слово, и рассуждать не о том, кто говорит, но о том, что говорит. Ибо часто простой и азбуки не знающий лучше скажет, нежели мудрец. Рассуждай об этом.
      cn: 3) 上帝之子，位格化的上帝智慧，不鄙弃聆听人的话——律法教师的话。何况我们，即使我们自以为是智慧的，都应当聆听每个人——无论是受人轻视的、简单的，还是不学无术的——当他说出有益之言时；不看人的外表，而看他所说的话，并且不要思考是谁说的，而要思考他说的是什么。因为常常，简单之人，甚至不识字的人，比智者说得更好。思考此事。
  - type: paragraph
    text:
      ru: 4) Христос Сын Божий, Отрок, в церкви обретенный и сидящий посреди учителей, учит нас Своим примером, что от юности должно нам учиться закону Божию и в церковь Божию ходить на молитву и слушание Божия Слова. Блажен тот, кто лета юности своей в том проводит. Как семя, посеянное в свежей земле, лучше растет, нежели на другой, так и семя Слова Божия лучше и удобнее прозябает в юном сердце, нежели в застарелом и мирской любовью упоенном. Поскольку юное сердце еще свежее и суетами мирскими не наполнено, оно удобнее принимает Слово Божие, нежели сердце, оскверненное мирской суетой.
      cn: 4) 基督上帝之子，那在圣殿中被寻见并坐在教师们中间的孩童，以祂的榜样教导我们：从孩提时代起，我们就当学习上帝的律法，并去上帝的圣殿祷告和聆听上帝的圣言。福哉，凡在其中度过自己青年岁月的人。正如播撒在新鲜土壤里的种子比在其他土壤中生长得更好，照样，上帝圣言的种子更容易、更适宜地在年轻的心中发芽，而非在陈旧且沉醉于世俗之爱的心中。因为年轻的心尚且新鲜，未被世俗的虚妄充满，它更容易接受上帝的圣言，胜过那被世俗虚妄玷污的心。
  - type: paragraph
    text:
      ru: В пустой сосуд все удобно вливаем, а наполненный сосуд надо прежде освободить и потом уже, что потребно, вливать. Поэтому детей своих прежде всего учи закону Божию и прочему христианскому благочестию. Не следуй тем родителям, которые детей малых иностранным языкам, красноречию и танцам научить стремятся, а закон Божий оставляют. Ни малейшей искры христианства не имеют таковые родители и детей своих в тот же ров влекут, как слепые. Они детей своих на временную жизнь рождают, но своим нерадением и примером вечную жизнь отнимают у них. Старайся же на юном сердце сеять доброе семя, чтобы в совершенном возрасте принесло добрый плод. От доброго семени доброго и плода ожидаем, как от злого злой плод рождается.
      cn: 往空器皿里，我们可轻易倾入一切；而盛满的器皿，则必须先腾空，然后再倾入所需之物。因此，你们首先要教导子女上帝之律法，以及其他基督徒的虔敬。不要效法那些父母，他们只热衷于教导年幼子女外语、修辞学和舞蹈，却把上帝之律法置之不顾。此类父母毫无基督教之微末火花，如瞎子一般，将子女拖入同一深坑。他们将子女生养至此世短暂之生命，但因自己的不尽心和榜样，却剥夺了他们永恒的生命。因此，你们当尽力在幼小的心田里播下良善的种子，好使在成年之时结出佳果。我们期望良善的种子结出良善的果实，正如恶劣的种子结出恶劣的果实。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Что далее последовало? Куда Сын Божий со святой Матерью и Иосифом обратился?
      cn: 接下来发生了什么？上帝之子与圣母和约瑟转向何处？
  - type: paragraph
    text:
      ru: Ответ. Евангелист святой повествует, что «Он пошел с ними и пришел в Назарет» (в город, где был воспитан); «и был в повиновении у них» ( Лк 2:51 ).
      cn: 答。圣福音使徒叙述说：「祂与他们同行，来到拿撒勒」（在祂蒙抚养长大的城）；「并且顺从他们」（路加福音 2:51）。
  - type: paragraph
    text:
      ru: 'Примечай, возлюбленный:'
      cn: 请注意，蒙爱的：
  - type: paragraph
    text:
      ru: '1) Царь царей и Господь сил, Бог во плоти, не только Отцу Своему Небесному во всем был послушен, но и людям повиновался. «И был в повиновении у них» . Кто? Господь. У кого? У людей, рабов Своих. Почему? Чтобы наше преслушание и непокорность, которое нас обличало пред Богом, загладить. Нас ради, тебя ради и меня ради, не только в мир пришел Господь наш, но и повиновался людям: «и был в повиновении у них» . У кого? У Матери Своей Пресвятой и Иосифа. Видишь любовь к нам, видишь и смирение ради нас Сына Божия. Благодарим Тебя за это и поклоняемся Тебе, Господи!'
      cn: 众王之王、万军之主、道成肉身的上帝，祂不仅在凡事上顺从祂的天父，也听命于世人。「祂听命于他们。」 谁？主。听命于谁？听命于世人，祂的仆人。为何？为要涂抹我们那在上帝面前指证我们的悖逆和不顺从。为了我们，为了你和我，我们的主不仅降世，而且听命于世人：「祂听命于他们。」 听命于谁？听命于祂至圣的母亲和约瑟。你看见了祂对我们的爱，也看见了上帝之子为我们所受的谦卑。我们为此感谢祢，并敬拜祢，上主啊！
  - type: paragraph
    text:
      ru: '2) Так Своим смирением учит нас Христос смирению, и потому говорит: «Научитесь от Меня, ибо Я кроток и смирен сердцем» ( Мф 11:29 ). Смиримся же ради Того, Который ради нас так смирился. Преклоним голову нашу не только пред Богом, но и пред людьми. «В» нас «должны, быть те же чувствования, какие и во Христе Иисусе» ( Флп 2:5 ).'
      cn: 2) 基督就是这样以祂的谦卑教导我们谦卑，因此祂说：「你们当学我的样式，因为我心里柔和谦卑」（马太福音 11:29）。让我们为了那一位为我们如此谦卑的，也谦卑自己吧。让我们不仅在上帝面前，也在世人面前低头。「你们当以基督耶稣的心为心」（腓立比书 2:5）。
  - type: paragraph
    text:
      ru: 3) Отсюда учатся дети родителям, рабы господам, подчиненные властям, люди пастырям, ученики учителям, юные старым повиноваться и почитать их. Если Христос, будучи Богом, людям повиновался, то есть Высший низшим, насколько более люди людям и низшие высшим повиноваться должны.
      cn: 3) 由此，孩童学习顺从父母，仆人顺从主人，下属顺从掌权者，平信徒学习顺从牧者，门徒学习顺从教师，青年学习顺从长者，并敬重他们。如果基督身为上帝，尚且顺从于人，即至高者顺从卑微者，何况人更当顺从于人，卑微者更当顺从尊长者呢？
  - type: paragraph
    text:
      ru: Да посрамится же человеческая гордость и непокорность пред Сыном Божиим, так смирившимся. Он велик был и тогда, но, величество Свое скрывая, показывался как смиренный человек, и Господь всех в образе рабском обращался.
      cn: 但愿人的骄傲与悖逆，在如此谦卑的上帝之子面前蒙羞。祂那时也本是伟大的，然而，祂隐藏了自己的威严，显现为一位谦卑的人，而万有的主则以奴仆的形象来往。
  - type: paragraph
    text:
      ru: Запечатлеем же, возлюбленный, сей живой образ смирения в мыслях наших и постараемся подражать Ему в том, дабы Сам Он нас возвысил. «Ибо всякий унижающий себя возвысится» ( Лк 14:11 ).
      cn: 就让我们铭刻吧，蒙爱者啊，这活生生的谦卑形象在我们的思想中，并努力效法祂，好让祂亲自高举我们。「因为凡贬抑自己的人必被高举。」（路加福音 14:11）
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Ныне посмотрим, как велико то дело, ради которого пришел на землю Господь наш Иисус Христос. Сам Он да поможет нам, и мой ум да просветит, и руку мою да направит писать, и твое сердце да отверзет принять написанное. Почерпнем же все из Евангелия Его и прочего Писания Его Святого, как источника живого, для пользы и утешения нашего.
      cn: 如今我们且看，我们的主耶稣基督为之降世的那事工何等伟大。愿祂自己帮助我们，光照我的心智，指引我的手来书写，并开启你的心扉，领受所写下的。愿我们一切都从祂的福音以及祂其他圣洁的经文汲取，如同活水泉源，为着我们的益处与慰藉。
  - type: paragraph
    text:
      ru: 'Перед тем, как должен был явиться Сын Божий миру и проповедать Евангелие царствия Божия, пред Ним послан был от Бога Иоанн святой, как утренняя звезда перед восходящим солнцем, как о том через пророка прежде объявил Бог: «Се, Я посылаю Ангела Моего пред лицем Твоим, который приготовит путь Твой пред Тобою» ( Мал 3:1 ; Мф 11:10 ), – и это пророчество Сам Сын Божий к Предтече Своему прилагает и Ему приписывает.'
      cn: 在上帝之子即将降世世人，宣讲上帝之国福音之前，圣约翰受上帝派遣，走在祂前面，如同旭日东升前的晨星一般，正如上帝曾藉着先知宣告说：「看哪，我要差遣我的使者在祢面前，他要在祢前面预备祢的道路」（玛拉基书 3:1，马太福音 11:10），—— 这预言上帝之子亲自将它应用于自己的前驱，并归于他。
  - type: paragraph
    text:
      ru: 'Великий Предтеча родился от престарелых и неплодных родителей, Захарии и Елисаветы, и родился по обещанию Божию ( Лк 1 ). Потом Сама Истина – Иисус Сын Божий засвидетельствовал, что он «больше пророка» и что «из рожденных женами не восставал больший Иоанна Крестителя» ( Мф 11:9, 11 ). И сами иудеи настолько высоко почитали его ради святости его, что надеялись и помышляли в сердцах своих, «не Христос ли он» ( Лк 3:15 ). И жил он в пустыне, как Ангел Божий, от сопребывания и молвы человеческой удаленный, и пищей питался, и одеждой одевался самой простой, как проповедник покаяния, которое и словом и житием своим проповедовал. Этот великий муж перед самым явлением Христовым, по повелению Божию, вышел из пустыни, и пришел в страну Иорданскую, и проповедовал людям, приходящим к нему, говоря: «Покайтесь, ибо приблизилось царство небесное» ( Мф 3:2 ). «Идет Сильнейший меня, у Которого я недостоин развязать ремень обуви; Он будет крестить вас Духом Святым и огнем» , и прочее ( Лк 3:16 ). Это он о Христе Спасителе нашем говорил людям. И другие его святые проповеди во Евангелии написаны.'
      cn: '伟大的前驱由年迈且不能生育的父母——撒迦利亚和伊利莎白——所生，是按上帝的应许而生（路加福音 1）。随后，真理本身——上帝之子耶稣亲自见证说，他「比先知大」，并且「凡妇人所生的，没有一个兴起来大过施洗者约翰的」（马太福音 11:9，11）。就连犹太人自己也因其圣洁而极其尊崇他，以至于在他们心中盼望并思量，「他莫非是基督吗？」（路加福音 3:15）。他像上帝的天使一样，住在旷野，远离人群的陪伴和喧嚣，食用最简单的食物，穿着最朴素的衣服，作为悔改的宣讲者，他不仅以言语，更以其生活宣讲悔改。


        这位伟大的圣者在基督显现之前，奉上帝之命，走出旷野，来到约旦河地区，并向来到他那里的人宣讲，说：「你们要悔改，因为天国近了」（马太福音 3:2）。「那比我更有能力的要来，我就是给他解鞋带也不配；他要用圣灵与火给你们施洗」（等等）（路加福音 3:16）。这是他向人们讲论我们的救主基督。他的其他圣洁的宣讲都记载在福音书中。'
  - type: paragraph
    text:
      ru: 'Примечай здесь:'
      cn: 在此注意：
  - type: paragraph
    text:
      ru: '1) Как велик Тот, о Котором он людям говорил: «Идущий за мною» . Сам как Ангел был бесплотный, и всеми высоко почитаемый, но себя почитал ничтожным в сравнении с Ним, так что признал себя недостойным и последнейшее рабское служение Ему оказывать, то есть развязать ремень Его обуви. Ибо знал, что сам он – создание Божие, но Его познал как Создателя, хотя и носившего образ человеческий.'
      cn: 祂何等伟大，他向世人谈论的那位：「那在我以后来的」。他自己如同天使，是无形体的，且为众人所高度敬重的，但与祂相比，他却视自己为微不足道，以至于承认自己不配为祂做最末等的奴仆服侍，亦即，解开祂鞋上的带子。因他深知，他自己是上帝的受造物，但他却认知祂为造物主，尽管祂取了人形。
  - type: paragraph
    text:
      ru: '2) Проповедь его святая направлена была на то, чтобы люди очистили себя покаянием и приготовились к принятию Мессии, уже явившегося на земле и настолько великого, что он и служить Ему был недостоин: «Идет Сильнейший меня, у Которого я недостоин развязать ремень обуви» .'
      cn: 2) 他的神圣宣讲旨在让人们通过悔改洁净自己，并预备好迎接已然降临于世的默西亚；默西亚是如此的伟大，以至于他连事奉祂都配不上：「比我更强有力的那位将要到来，我连给祂解鞋带都不配。」
  - type: paragraph
    text:
      ru: 'Когда царь земной приближается к городу какому, где граждане уже долго его ожидали, пред ним вестник в тот город приходит и говорит гражданам: вот, царь уже приходит к вам, постарайтесь приготовиться к встрече его и с подобающей честью примите его. Так, когда Царь Небесный, Иисус Христос, пророками проповеданный и в мире ожидаемый, на земле явился и пришло время Ему явиться миру, чтобы узнали о Нем, предшествовал перед Ним, как вестник благоприятный, святой Иоанн великий, пророков всех печать, и людям, ожидающим Его, возвестил: вот, пришел уже Мессия, законом и пророками проповеданный и вами ожидаемый, приготовьтесь принять Его, как должно. «Приготовьте путь Господу, прямыми сделайте стези Ему» ( Мф 3:3 ).'
      cn: 当地上的君王临近某座城池时，那里的公民早已久候多时，必有使者先行进入那城，对公民们说：瞧，君王就要临到你们这里了，务请预备好迎见他，并以应有的尊荣来迎接他。照样，当天上的君王——耶稣基督，由众先知所宣讲，并为世人所期盼的——降临地上，且到了祂显现于世，使世人得以认识祂的时候，在祂之前，作为蒙福的使者，有伟大的圣约翰（施洗者约翰）先行；他乃是众先知之印记，并向等候祂的人宣告说：瞧，弥赛亚已然降临，祂是律法与众先知所宣讲，并为你们所期盼的；你们当预备好，以应有的方式迎接祂。「为上主预备道路，修直祂的途径」（马太福音 3:3）。
  - type: paragraph
    text:
      ru: 3) Видишь здесь, что, кто хочет Христа принять в сердце свое, тот должен себя очистить истинным покаянием; от закона познать грехи свои и их покаянием, сожалением и сокрушением сердца очистить, или точнее, их очищения у Бога просить, и тогда придет к нему Христос Сын Божий со Своим Евангелием, и подаст ему утешение не мира сего, но такое, какого мир не может принять.
      cn: 3) 你在这里看到，凡愿将基督接到自己心中者，就当以真诚的悔改洁净自己；从律法中认识自己的罪恶，并以悔改、忧伤和心灵的痛悔洁净这些罪恶，或者更确切地说，向 上帝祈求这些罪的洁净，这样，上帝之子基督就会带着祂的福音来到他那里，赐给他安慰，这安慰并非来自这世界，而是世界所不能领受的安慰。
  - type: paragraph
    text:
      ru: '4) Видишь, как угодники Божии смиряются пред Богом: Иоанн великий недостойным себя признает у Христа Бога ремень обуви Его развязать. Так Авраам святой недостойным себя признавал беседовать с Богом и говорил: «Вот, я решился говорить Владыке, я, прах и пепел» ( Быт 18:27 ). Ибо понимают они величество Божие и свое ничтожество пред Ним. Так Петр, от ловли рыбы, которой множество уловили повелением Христовым, познав, как велик Христос, Который повелением Своим так много рыбы в невод их послал, припал к коленям Иисуса, говоря: «Выйди от меня, Господи! потому что я человек грешный. Ибо ужас объял его и всех, бывших с ним, от этого лова рыб, ими пойманных» ( Лк 5:8–9 ). Но чем недостойнее они себя признают, тем более удостаивает их Бог, ибо благ и милосерден.'
      cn: 4) 你看，上帝的圣徒如何在上帝面前谦卑自己：大圣约翰承认自己不配在基督上帝面前解开祂鞋上的带子。同样，圣亚伯拉罕承认自己不配与上帝交谈，并且说：「看哪，我虽然是尘土和炉灰，还敢对上主说话。」（创世记 18:27）因为他们明白上帝的威严，以及自己在祂面前的渺小。同样，彼得因着凭基督的吩咐捕获了大量的鱼，认识到基督是何等伟大，祂竟以自己的命令将如此多的鱼送入他们的网中，就俯伏在耶稣膝前，说：「主啊，请祢离开我！因为我是个罪人。」因为那次捕获的鱼，使他和所有与他同在的人都感到惊恐。（路加福音 5:8-9）然而，他们越是承认自己不配，上帝就越是恩待他们，因为祂是良善和慈悲的。
  - type: paragraph
    text:
      ru: Покаемся же и мы, признаем себя недостойными ничего, и Христос Бог, как человеколюбец, удостоит нас милости Своей. Ибо Он на смиренных взор Свой обращает и подает им благодать Свою.
      cn: 让我们也悔改吧，承认我们一无所配，而基督上帝，作为爱人的，必使我们蒙受祂的怜悯。因为祂注视谦卑的人，并赐予他们祂的恩典。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 71 – 80
    cn: 书信 71 – 80
  children:
  - type: paragraph
    text:
      ru: 'Послушаем теперь, возлюбленный, что о Царе Небесном ангел Его, плотью обложенный, свидетельствовал. Святой Иоанн евангелист говорит: «На другой день видит Иоанн идущего к нему Иисуса и говорит: вот Агнец Божий, Который берет на Себя грех мира» , и прочее ( Ин 1:29 ).'
      cn: 现在让我们来听听，亲爱的，祂那披戴肉身的使者关于天国君王所作的见证。圣福音书作者约翰说：「第二天，约翰看见耶稣走向他，便说：看哪，上帝的羔羊，除去世人罪孽的。」等语（约翰福音 1:29）。
  - type: paragraph
    text:
      ru: 'Видишь:'
      cn: 你看：
  - type: paragraph
    text:
      ru: '1) Называет его не Судией, судящим мир, хотя Он и есть Судия, но Агнцем Божиим, берущим на Себя грехи мира, то есть свидетельствует людям, что Он пришел в мир не судить грешников за грехи, но взять их грехи, как и Сам о Себе сказал Сын Божий: «Не послал Бог Сына Своего в мир, чтобы судить мир, но чтобы мир спасен был чрез Него» ( Ин 3:17 ). Согласно этому и апостол Его написал: «Христос Иисус пришел в мир спасти грешников» ( 1Тим 1:15 ).'
      cn: 称祂不是审判世界的审判者，尽管祂确是审判者，而是上帝的羔羊，担当世人罪孽的。也就是说，祂向世人作证，祂来到世上不是为罪审判罪人，而是要担当他们的罪，正如上帝之子论及祂自己所言：「上帝差祂的儿子到世上来，不是要定世人的罪，乃是要叫世人藉着祂得救。」（约翰福音 3:17）照此，祂的使徒也写道：「基督耶稣降世，为要拯救罪人。」（提摩太前书 1:15）
  - type: paragraph
    text:
      ru: 'Отсюда почерпнем утешение себе, грешники, что Царь Небесный пришел к нам на землю, как Агнец, взять грехи наши, а не как Судия, судить нас за грехи. Благодарим Его за человеколюбие Его. Да последуем и мы Ему, как Агнцу кроткому, и да будем к ближним нашим незлобивыми: будем молчать пред хулящими нас и обижающими нас, как агнцы пред стригущими их безгласны. Тогда возьмет Он нас на плечи Свои, как Пастырь, и принесет к Отцу Своему.'
      cn: 我们罪人从中汲取慰藉，因为天国君王降临地上，如同羔羊，为要除去我们的罪，而非作为审判者，来审判我们的罪。我们感谢祂的仁爱。愿我们也跟随祂，如同那柔和的羔羊，并且对我们的近人不含恶意：在那些毁谤我们和伤害我们的人面前，我们要保持沉默，如同羔羊在剪毛的人面前无声。那时，祂将如同牧者，把我们放在祂的肩上，并带到祂的父那里。
  - type: paragraph
    text:
      ru: 2) Видим, что один Он берет на Себя грехи всего мира, но берет грехи тех, которые каются истинно, и перестают грехи ко грехам прилагать, и к Нему с верой прибегают, и просят отпущения грехов, – тем Он отпускает грехи. Покаемся же и мы, перестанем грехи собирать и ими, как долгами, себя обременять, и приступим к Агнцу Сему, чтобы и наше бремя Он взял и облегчил нас, дабы, освободившись от бремени грехов, удобно благодатью Его вошли мы в отечество небесное.
      cn: 2) 我们看到，唯有祂承担了全世界的罪孽，但祂只承担那些真正悔改之人、停止罪上加罪之人、并怀着信心投奔祂、恳求祂赦免罪孽之人的罪孽——祂便赦免了他们的罪孽。那么，我们也当悔改，停止积聚罪孽，并且不再让罪孽像债务一样重压我们，来到这位羔羊面前，好让祂也挪去我们的重担，使我们得以轻松，这样，当我们从罪孽的重担中解脱出来，便能轻易地凭借祂的恩典进入那天上的家园。
  - type: paragraph
    text:
      ru: '3) Надо нам помнить и другое слово Предтечи, которое он о Христе сказал: «Лопата Его в руке Его, и Он очистит гумно Свое и соберет пшеницу в житницу Свою, а солому сожжет огнем неугасимым» ( Лк 3:17 ). И еще: «Всякое дерево, не приносящее доброго плода, срубают и бросают в огонь» ( Мф 3:10 ). В первом пришествии, как Агнец, пришел Христос взять грехи, но во втором придет, как Судия, судить за грехи непокаявшихся. Тогда Он покажет правду Свою, как Судия праведный, и, как лопатой пшеница от плевел разделяется, так судом Своим разделит праведных от грешных, и праведных, как пшеницу в житницу, в небесное царствие соберет, и прочее ( Мф 25:34 ), а грешных, как плевелы негодные, сожжет огнем неугасающим, и прочее ( Мф 25:41; 13:42 ).'
      cn: 3) 我们还需要记住前驱的另一句话，他论及基督时所说的：「祂的簸箕在祂手里，祂必扬净祂的禾场，将麦子收在祂的仓里，糠秕却要用不灭的火烧尽」（路加福音 3:17）。还有：「凡不结好果子的树，就砍下来丢在火里」（马太福音 3:10）。在第一次降临中，基督作为羔羊而来，为要担当世人的罪；但在第二次降临中，祂将作为审判者而来，审判那些未曾悔改之人的罪。那时，祂将显明祂的公义，如同公义的审判者，并如同麦子被簸箕从稗子中分出一样，祂也必用祂的审判将义人从罪人中分别出来。祂将义人如同麦子收在仓里一样，收进天国，等等（马太福音 25:34）；而罪人，则如同无用的稗子，要用不灭的火烧尽，等等（马太福音 25:41，13:42）。
  - type: paragraph
    text:
      ru: 4) Итак, запечатлеем и углубим в памяти нашей, возлюбленный брат, что Иисус ныне к грешникам, обращающимся к Нему, и кающимся с сокрушенной мыслью, и просящим у Него прощения, есть как Агнец незлобивый, отъемлющий грехи их, но тогда, то есть в день суда, будет как Судия, воздающий всем по делам их. Ныне, как Агнец Божий, заглаживает Кровью Своей грехи кающимся, но тогда Он же будет как Судия и мститель для грешников непокаявшихся.
      cn: 4) 所以，亲爱的弟兄，让我们铭记并深植于我们的记忆中，耶稣现今对于那些转向祂、以忧伤痛悔之心悔改并向祂祈求赦免的罪人，是如同无玷的羔羊，除去他们罪愆的；但那时，亦即在审判之日，祂将是审判者，照各人的行为报应各人的。现今，祂作为上帝的羔羊，以祂的宝血涤除悔改者的罪愆；但那时，祂却将是审判者和施行报应者，对于不悔改的罪人而言。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Просишь ты изъяснения слова – покайтесь. Я тебе некогда по силе моей писал о том, однако еще ныне о том же вкратце повторяю.
      cn: 你寻求对「悔改」一词的解释。我曾尽我所能就此写给你，然而现今我仍就此简要重述。
  - type: paragraph
    text:
      ru: 'Знаешь, что люди говорят, когда узнают, что плохое что-нибудь сделали или сказали? Ведь они так говорят, узнав погрешность свою: ах, как я плохо то и то сделал, или плохо то и то сказал!.. Видишь, что они жалеют о содеянном зле, или сказанном плохом слове, а если жалеют, то впредь и берегутся того делать или говорить.'
      cn: 你知道吗，当人们得知自己做了或说了什么不好的事时，他们会说什么？他们确实是这样说的，在得知自己的过失后：唉，我怎么把那个和那个做得那么糟，或者说得那么糟！你看，他们为自己所行的恶事或所说的坏话感到后悔，而如果他们后悔，那么他们将来就会避免再做或再说那样的事。
  - type: paragraph
    text:
      ru: 'То же и в христианском покаянии примечается. Истинно кающиеся, узнав грех, жалеют, что его творили, и берегутся от него впредь, подобно тому, как кто-либо, поранившись от чего-то или испытав вред какой, уже впредь бережется от этого. Ибо и согрешающие христиане получают рану, но не на теле, а на душе, и кто истинно сей вред от греха узнает, тот уже уязвляется печалью, и жалеет, что эту рану получил, и впредь от того греха бережется, от которого уязвился душой. И таковой также себя осуждает и укоряет: напрасно, мол, то и то я делал. Ибо грех, узнанный в совести, делает в человеке страх, стыд, печаль и болезнь, что его впредь и не допускает до греха.'
      cn: 基督徒的忏悔亦是如此。真正忏悔之人，认清罪恶后，会为自己所犯的罪恶感到懊悔，并从今往后防备它，如同有人因某事受伤或遭受损害后，便会从今往后防备那事物一样。因为，即使是犯罪的基督徒也会受创，但并非在身体上，而是在灵魂上；凡是真正认清罪恶所致之损害的人，其灵魂便会被忧伤所刺痛，并会为自己遭受此创伤而懊悔，从今往后防备那曾刺痛其灵魂的罪恶。这样的人也会谴责和责备自己说：「我所做的一切都是徒劳的。」因为，良心所认清的罪恶会在人心中产生恐惧、羞愧、忧伤和病痛，从而使他从今往后再也不会陷入罪恶。
  - type: paragraph
    text:
      ru: 'Видишь, что покаяние делает. Человек познает грех, а познанию греха последует: страх суда Божия, стыд, что бесстыдно пред Богом поступал и закон Его святой нарушал, печаль и болезнь, что благого Бога, Которого должен был любить и бояться, прогневлял бесстрашием. Так человек, узнав грех, узнает и про язву на душе, а узнав про язву, печалью уязвляется за грех, и так язвой печали исцеляется от язвы греховной. Берегись же греха, как змия, чтобы не уязвил тебя. Лучше на теле, нежели на душе рану получить.'
      cn: 你看悔改所成就的。人认识罪，而认识罪之后随之而来的便是：对上帝审判的恐惧；羞愧，因他在上帝面前行事放肆无礼，并违犯了祂的圣洁律法；忧伤和痛苦，因他本该爱戴和敬畏那良善的上帝，却因大胆妄为而触怒了祂。这样，人认识了罪，也就认识了灵魂上的创伤；既知此创伤，便因罪而忧伤受创，如此，便借着忧伤之创治愈了罪恶之创。务要提防罪，如同提防毒蛇，免得它刺伤你。宁可身体受伤，不可灵魂受创。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: от чего грех узнается?'
      cn: 你问道：罪从何得知？
  - type: paragraph
    text:
      ru: 'Ответ: от закона и рассмотрения совести. Закон говорит: не убивай, не прелюбодействуй, не кради, не злословь, не клевещи, не гневайся, и прочее. Но когда человек это слышит или читает, то в совесть смотрит, и рассуждает, и рассматривает, не делал ли или не делает ли того, что закон запрещает, – и так узнает грех. Ибо совесть согласна закону Божию. Что обличает закон, то и совесть, и когда совесть в чем-либо не обличает человека, то и закон его в том не обличает. Итак, поставь совесть твою против закона, как ставишь лицо против зеркала, и так рассуждай о законе и совесть рассматривай.'
      cn: 回答：来自律法和良心的省察。律法说：不可杀人，不可奸淫，不可偷盗，不可诽谤，不可诬告，不可发怒，等等。但当人听到或读到这些时，他就察看自己的良心，并思量、省察，自己是否做过或正在做律法所禁止的事，——如此便认识了罪。因为良心是符合上帝的律法的。律法所指责的，良心也指责；而当良心在某事上不指责人时，律法在某事上也不指责他。所以，将你的良心与律法对照，如同你将面容对着镜子，如此思量律法并省察良心。
  - type: paragraph
    text:
      ru: 'Например, закон говорит: не обижай ближнего, – видишь, что закон тебе повелевает. На это запрещение смотря, посмотри в совесть твою, не делал ли, или не делаешь ли ты того, что запрещает закон, и когда видишь это в совести, то и узнаешь, что ты согрешил против Божия закона. Так от закона и рассмотрения совести узнаешь грех, так и о прочих грехах разумей. Ибо совесть солгать не может, она то свидетельствует, что в ней есть. Нарушенный закон, грешником слышанный или читаемый, ударяет в совесть согрешившего, а совесть, преступлением закона раздраженная, обличает человека за грех, и так закон и совесть в познание греха приводит согрешившего. В совести каждый грех записывается, как в книге, и даже если бы человек хотел скрыть грех, от совести скрыть не может.'
      cn: 例如，律法说：不可亏负你的邻人，——你看，律法是如何命令你的。审视此禁令，审察你的良心，你是否曾做过或正在做律法所禁止之事，当你在良心中看见此点时，你便知道你已违犯了上帝的律法。如此，借由律法与省察良心，你便能知罪；至于其他罪，亦当如此理解。因良心不能说谎，它只见证其内所存之物。被违犯的律法，被罪人听闻或诵读之时，便击打在罪人的良心上，而良心，因律法的逾越而受激，便为着罪而斥责那人，如此，律法与良心便将那犯罪之人引向对罪的认知。在良心中，每个罪都如被记录在书卷上一般，即便人想隐藏罪，也无法向良心隐藏。
  - type: paragraph
    text:
      ru: Прочитай заповеди Божии, и смотри в совесть, и увидишь, в чем ты согрешил, и так в познание грехов будешь приходить. А от познания грехов последует покаяние, а оттуда последует страх суда, ибо закон нарушенный грешнику гнев Божий возвещает. Последует стыд, так что сам себя стыдиться будет за то, что он, земля и пепел, Бога, Царя и Господа не слушал. Последует печаль и болезнь сердца, что своего Создателя и Благодетеля, Которого более всего должен почитать, непослушанием и своевольством не почитал.
      cn: 诵读上帝的诫命，并省察你的良心，你就会看见自己曾在何事上犯了罪，如此你便能渐渐认识到自己的罪。从认识到罪恶中，会继之以悔改；从悔改中，会继之以对审判的敬畏，因为被违犯的律法，会向罪人宣告上帝的忿怒。会继之以羞愧，以至于他，这尘土与灰烬，竟不听从上帝、君王与上主的话语，为此他将感到羞耻。会继之以忧伤与心痛，因为他自己的造物主与施恩者，本是他最当敬重的，却因着悖逆与任性而不敬重了。
  - type: paragraph
    text:
      ru: Все это последует от рассуждения о законе, грехом разоренном, и от рассмотрения совести, грехом раздраженной. Если, согрешив против земного царя и узнав грех, боимся суда его, стыдимся и печалимся, что так худо сделали и величество его оскорбили, то тем более последует то, когда узнаем грех наш, против Царя Небесного совершенный. Ибо всякий царь земной, хотя и высок и велик честью, однако пред Богом как ничто, ибо такой же человек, как и мы.
      cn: 所有这一切，都将源于对那因罪而遭损毁之律法的省思，以及对那因罪而受刺激之良心的审视。若是我们得罪了地上的君王，并认清了这罪，就畏惧他的审判，羞愧并忧伤，因我们行事如此拙劣，冒犯了他的威严，那么，当我们认清我们所犯的、针对天上的君王之罪时，这些情感就更会随之而来。因为任何一位地上的君王，纵然位高权重，尊荣显赫，然而在上帝面前却如同虚无，因为他与我们一样，不过是人而已。
  - type: paragraph
    text:
      ru: Всякий же грех бывает против Бога, ибо всяким грехом закон Его святой нарушается, – бывает же или непосредственно, или посредственно. Непосредственно, когда против Него Самого грешим, то есть или не верим Ему, или имени Его не почитаем, и прочее. Посредственно, когда против ближнего грешим, или словом, или делом, ибо Бог и это запретил.
      cn: 凡一切罪都是逆着上帝的，因为凡一切罪都违背了祂的神圣律法，——这罪或直接，或间接地发生。直接地，是指当我们逆着祂本身犯罪时，也就是，或不相信祂，或不敬奉祂的名，等等。间接地，是指当我们逆着近人犯罪时，或言语上，或行为上，因为上帝也禁止了这些。
  - type: paragraph
    text:
      ru: Итак, видишь, от чего грех познается. Познаем же грехи наши. Ибо в этом начало покаяния.
      cn: 那么，你看，罪是从何被认识的。让我们认识我们的罪吧。因为这其中是悔改的开始。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Ты требуешь изъяснения: как язва греховная язвой печали за грех исцеляется?'
      cn: 你要求解释：罪恶之疮如何藉着为罪忧伤之疮而得医治？
  - type: paragraph
    text:
      ru: Ответ. Бог, по Своей благости и человеколюбию, обещал подать милость и оставление грехов тем грешникам, которые, познав грехи свои и их признав, пред Богом со смирением истинно каются, сокрушаются, и жалеют, и просят у Него отпущения. Грешник, обратившийся и кающийся, сие милостивое Божие обещание взяв в рассуждение и зная, что Бог милосердный лицеприятия не имеет и как ко всем кающимся был и есть милостив и отпущение грехов им подает, так и ему то же сотворит, – таковым рассуждением утешается, от печали за грех отраду принимает, и, как жаждущий водой, прохлаждается, и такой отрадой и утешением язва греховная, которая душу его уязвила, исцеляется, как живительным пластырем язва, на теле принятая.
      cn: 答：上帝因其美善与爱世人之心，应许赐予恩典与罪之赦免，给那些认识到自己的罪并承认其罪，在上帝面前以谦卑之心真正地忏悔、痛悔、哀伤，并向祂祈求赦免的罪人。一个回转并忏悔的罪人，将这慈悲的上帝应许铭记于心，并深知慈悲的上帝不偏待人，祂对所有忏悔者过去是、现在也是慈悲的，并赐予他们罪的赦免，对他也将如此行——他因此而获得安慰，从因罪而生的悲伤中获得慰藉，如同干渴者得水般清凉。这般慰藉与安慰，使那创伤其灵魂的罪之创伤得以医治，如同活化生命的膏药医治身体上的创伤一般。
  - type: paragraph
    text:
      ru: Отсюда видишь, что в истинном покаянии закон и Евангелие сходятся. От закона познает грешник свой грех, как душевную язву, и из-за этого уязвляется печалью. От Евангелия же отраду и утешение печали своей принимает, как жаждущий от живого источника прохлаждение. Ибо на Евангелии основаны все милостивые Божии обещания, между которыми обещание об отпущении грехов занимает непоследнее место.
      cn: 由此可见，在真实的悔改中，律法和福音是合一的。罪人通过律法认识到自己的罪，如同认识到灵魂的创伤，并因此被忧伤刺透。而从福音中，他自己的忧伤得到慰藉与安慰，如同口渴之人从活水泉源中获得清凉与舒畅。因为上帝所有慈悲的应许都建立在福音之上，其中赦罪的应许占据着极其重要的地位。
  - type: paragraph
    text:
      ru: Из этого видишь, как нужно нам знать закон Божий и Евангелие Его святое и в них поучаться, дабы от закона познать грехи свои и о них каяться сокрушенным сердцем, а от святого Евангелия живое и действительное почерпать утешение. Потому, если хочешь истинное покаяние творить, держись закона и прочитывай его; он и учит нас, что мы должны делать, и в чем грешим, обличает, как зеркало пороки на лице. Сокрушаясь же о грехах, к Евангелию, как жаждущий к холодной воде, обращайся. Закон научит тебя, что ты должен, будучи христианином, делать, и обличит, в чем оступился и оступаешься, но Евангелие не попустит тебе отчаяться, и падающего удержит, и изнемогающего укрепит. Слава Богу за все!
      cn: 从此可见，我们多么需要认识上帝的律法和祂的神圣福音，并在其中受教，以便从律法中认识自己的罪并以痛悔的心为之忏悔，而从神圣福音中汲取活泼而真实的安慰。因此，如果你愿行出真实的忏悔，就当持守律法并研读它；它既教导我们当做什么，又指责我们在何事上犯罪，如同镜子显露脸上的瑕疵。而当为罪痛悔时，就当转向福音，如同口渴之人转向凉水。律法会教导你，作为基督徒，你当做什么，并指责你在何事上失足和正在失足，但福音不会让你绝望，它会扶持跌倒之人，并加固那疲乏之人。为这一切，荣耀归于上帝！
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Как явился Спаситель наш Сын Божий миру?
      cn: 我们的救主，上帝之子是如何降临世间的？
  - type: paragraph
    text:
      ru: 'Ответ. Евангелие святое повествует нам, что когда люди приходили ко святому Предтече креститься от него, пришел и Христос Сын Божий креститься от него, и хотя Креститель отказывался крестить Его, познав Его как Господа и Бога своего, явившегося во плоти, но повинуясь повелению Его, как Господа своего, крестил Его. Тогда над крестившимся Христом явился Дух Святой телесным образом, как голубь, и глас с небес услышался: «Сей есть Сын Мой возлюбленный, в Котором Мое благоволение» ( Мф 3:17 ).'
      cn: 回答。圣福音告诉我们，当人们来到圣先驱那里接受他的洗礼时，基督，上帝之子，也来到他那里接受洗礼，尽管施洗者拒绝为祂施洗，因他认出祂是他的主和上帝，道成肉身显现的，但顺从祂的命令，作为祂的上主，为祂施了洗。那时，在受洗的基督身上，圣灵以肉身形像显现，如同鸽子，并且有声音从天上发出说：「这是我的爱子，我所喜悦的。」（马太福音 3:17）
  - type: paragraph
    text:
      ru: 'Здесь видим:'
      cn: 在此我们看到：
  - type: paragraph
    text:
      ru: '1) Бог Триипостасный явился миру: Сын Божий во плоти крестился, Дух Святой в виде голубя на Него сходил, Отец с небес гласом Своим свидетельствовал.'
      cn: 三位一体的上帝向世人显现：上帝之子以肉身受洗，圣灵以鸽子的形像降在祂身上，父从天上以自己的声音作证。
  - type: paragraph
    text:
      ru: 2) Видим, что все три Лица, Отец, и Сын, и Святой Дух, о нашем спасении промышляют. Тот же Бог, Который создал нас по образу Своему, нас, падших, и спасает.
      cn: 2) 可见，所有三个位格，圣父、圣子和圣灵，都眷顾我们的救赎。是同一位上帝，祂照着自己的肖像创造了我们，也拯救了我们这些堕落的人。
  - type: paragraph
    text:
      ru: '3) Видим, возлюбленный, как Бог милосердный печется о нашем спасении. Сын благоволил во плоти явиться благоволением Отца и содействием Святого Духа: Отец свидетельствовал о Нем, и Дух Святой это утверждал.'
      cn: 3) 亲爱的，我们看到慈悲的上帝如何关怀我们的救恩。圣子乐意凭着父的悦纳，并借着圣灵的协同，以肉身显现：父为祂作证，而圣灵则证实了这一点。
  - type: paragraph
    text:
      ru: Слава Отцу, и Сыну, и Святому Духу, помиловавшему нас! Не будем же нерадеть о сей великой Его благодати, дабы потом бесполезно не каяться.
      cn: 荣耀归于父、子、圣灵，祂怜悯了我们！我们不要怠慢祂这伟大的恩典，以免日后白费地悔改。
  - type: paragraph
    text:
      ru: '4) Отец Небесный, с небес свидетельствуя о Сыне Своем, увещает нас, чтобы мы Его во всем слушали, чему ни учит нас, если хотим спастись, и потому на Фаворе, те же слова говоря, добавил: «Его слушайте» ( Мф 17:5 ). Как бы так нам говорил: «Погибли вы из-за своего непослушания, – Я к вам, погибшим, послал Единородного Сына Моего, чтобы спасти вас. Примите же Его, как должно, и слушайтесь Его во всем, чему Он вас будет учить, – и тогда спасетесь». Будем же, брат, познавать Посланника и Святителя исповедания нашего Иисуса Христа, и будем слушаться Его, и в Нем говорившего Отца, дабы спастись.'
      cn: 4) 天父从天上见证祂的圣子，劝诫我们，要我们在祂所教导的一切事上听从祂，如果我们渴望得救；因此在塔博尔山上，说了同样的话，又加上说：「你们要听从祂」（马太福音 17:5）。祂仿佛这样对我们说：「你们因着自己的不顺从而灭亡了，——我将我的独生圣子差遣到你们这些灭亡之人这里，为要拯救你们。因此，你们当按着理当的方式接受祂，并在祂所教导的一切事上听从祂，——如此你们就必得救了。」所以，弟兄啊，让我们认识我们所宣认的使者和大祭司耶稣基督，并听从祂，以及在祂里面说话的天父，好使我们得救。
  - type: paragraph
    text:
      ru: 5) С такими свидетельствами, гласом Небесного Отца, и явлением Святого Духа, и проповедью великого пророка Иоанна, явился миру Господь Иисус, и вышел на проповедь святого Евангелия.
      cn: 5) 伴随着这样的见证，天父的声音，以及圣灵的显现，还有伟大先知约翰的宣讲，主耶稣向世人显现，并出来宣讲圣福音。
  - type: paragraph
    text:
      ru: 6) Примечай здесь, что Крещение святое нас освящает, как грешных. Но во Христе не было чего омывать и освящать, ибо Он был безгрешен, однако, прикосновением святой плоти Своей, Он наше Крещение освятил.
      cn: 6) 请注意此处，圣洗礼将我们这些罪人圣化。但在基督里没有什么需要洗涤和圣化的，因为祂是无罪的；然而，藉着祂神圣肉身的触碰，祂圣化了我们的洗礼。
  - type: paragraph
    text:
      ru: '7) Смотри, возлюбленный, на смирение Господа нашего Иисуса. Много грешников шли на крещение к Иоанну; Он же, «един свят» ( Откр 15:4 ) и безгрешен, более того, Тот, «Который берет на Себя грех мира» ( Ин 1:29 ), – между ними, как один из грешников, шел к Крестителю, просил крещения; Господь, Который освящает крещение, просил у раба, потому и Иоанн возбранял Ему: «Мне надобно креститься от Тебя, и Ты ли приходишь ко мне» ( Мф 3:14 )? Смотри, как смирился ради нас Господь наш, как не погнушался к грешникам примешаться, между грешниками идти, рабу Своему главу подклонить, от него Крещения просить, и креститься, и водой, которую создал, омываться, не имея скверны и порока. Слава смирившемуся ради нас Сыну Божию! Будем же подражать и мы такому смирению, дабы вознестись.'
      cn: 7) 看哪，蒙爱者，看我们的主耶稣的谦卑。许多罪人到约翰那里受洗；祂却──「唯独祢是圣的」（启示录 15:4）且无罪，更甚者，是「除去世人罪孽的」（约翰福音 1:29）──在他们中间，犹如一个罪人，走向施洗者，请求施洗；圣化洗礼的主，却向仆人请求，因此约翰阻止祂说：「我当受祢的洗，祢反倒上我这里来吗？」（马太福音 3:14）看哪，我们的主是何等为我们降卑，如何不厌弃与罪人混杂，在罪人中间行走，向祂的仆人低头，从他那里请求施洗，并受洗，且被祂所创造的水洁净，而祂自身毫无污秽与瑕疵。荣耀归于为我们降卑的上帝之子！愿我们也效法这样的谦卑，以便得以升高。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Смотри, любезный, и примечай, как человек согрешил в раю, изгнан из рая, – и заключился рай, заключились и небеса. Смотри, что делает грех! Но как Сын Божий явился на земле, то и двери небесные отворились, и глас Небесного Отца услышал человек, который из рая изгнан был, и услышали люди: «Покайтесь, ибо приблизилось царство небесное» . Из всего этого видно, что вновь отворился вход в царство небесное людям. Как Бог на землю пришел, то и люди начали на небо восходить, и теперь земные жители получают гражданство небесное, и люди с Ангелами пребывают. Слава Богу, благоволившему так!'
      cn: 看啊，亲爱的，并请留意，人是如何在乐园中犯罪，被逐出乐园——于是乐园关闭了，天国也关闭了。看啊，罪恶所为何事！然而，当上帝之子降临地上时，天国的门就此敞开，曾被逐出乐园的人听见了天父的声音，世人也听见了：「你们要悔改，因为天国近了。」由此可见，进入天国的门户再次为世人敞开。当上帝降临地上时，世人便开始升入天国，如今，世上的居民获得了天国的公民权，世人与天使一同居住。荣耀归于上帝，祂如此施恩！
  - type: paragraph
    text:
      ru: Спасайся и радуйся о сем.
      cn: 蒙受救恩罢，并为此喜乐。
  - type: paragraph
    text:
      ru: 'Видел ли ты, что делает смирение? Иоанн святой признавал себя недостойным развязать ремень обуви у Христа: «Я недостоин развязать ремень у обуви Его, -» то есть почитал себя недостойным даже прикоснуться к обуви Христовой, но удостоился руку свою на главу Его возложить. Так Петр говорил ко Христу: «Выйди от меня, Господи! потому что я человек грешный» ( Лк 5:8 ). Но услышал от Господа: «Не бойся; отныне будешь ловить человеков» ( Лк 5:10 ). Видишь, куда смирение возводит. Чем более человек смиряет себя, тем более Бог его возвышает, «ибо унижающий себя возвысится» ( Лк 14:11 ), по слову Господнему.'
      cn: 你可曾见过谦卑成就了什么？圣约翰承认自己不配给基督解鞋带：「我就是给他解鞋带也不配，——」也就是说，他认为自己甚至不配触碰基督的鞋，但他却蒙福得以将手按在祂的头上。彼得也曾这样对基督说：「主啊，请祢离开我，因为我是一个罪人。」(路加福音 5:8)。但他却从主那里听见：「不要怕，从今以后，你要得人了。」(路加福音 5:10)。你看，谦卑能将人提升到何等的高度。人越是谦卑自己，上帝就越是高举他，正如上主所言：「因为凡自卑的，必被升高。」(路加福音 14:11)。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь ты: во сколько лет Сын Божий крестился?'
      cn: 你问：上帝之子是在多少岁受洗的？
  - type: paragraph
    text:
      ru: 'Ответ. Евангелист святой говорит: «Иисус, начиная Свое служение, был лет тридцати» ( Лк 3:23 ). Видишь, что Ему было тогда около тридцати лет. Упомянув о годах и возрасте Спасителя нашего, подивимся и благости Божией.'
      cn: 答。圣福音使者说：「耶稣开始尽祂的职分时，年纪约三十岁。」(路加福音 3:23)。你看，那时祂约三十岁。提及我们救主的年岁，让我们感叹上帝的恩德吧。
  - type: paragraph
    text:
      ru: 1) Возрастал и взрослел с годами Тот, пред очами Которого «тысяча лет, как день вчерашний» ( Пс 89:5 ), Творец времен и веков, неизменный, вечный, безначальный и бесконечный. В святейшей утробе неискусобрачной Девы зачался и носим был, родился и младенцем был; потом отроком, потом юношей был; далее и «в мужа совершенного, в меру полного возраста» ( Еф 4:13 ) пришел, как все люди, ибо, будучи Богом, восхотел уподобиться нам ради нас во всем, кроме греха.
      cn: 那位在祂眼中「千年如昨日」（诗篇 89:5）的，时日与世代的造物主，不变的、永恒的、无始无终的祂，却也渐次成长，日渐成熟。在不经嫁娶的童贞女至圣的胎中受孕并怀胎，降生为婴孩；后为孩童，再为少年；进而如同所有世人一般，「长大成人，达到基督丰满身量的程度」（以弗所书 4:13）。因祂本为神，却甘愿为了我们，在凡事上与我们相似，唯独没有罪。
  - type: paragraph
    text:
      ru: 'Запечатлеем, возлюбленный, великое дело сие в памяти нашей, дабы не быть в числе тех, на которых жалуется Псаломник: «И забыли они благодеяния Его, и чудеса Его, которые Он показал им» ( Пс 102:2 ). Нет большего благодеяния и чуда, как воплощение Сына Божия. Это благодеяние и чудо Божие все древние чудеса и благодеяния Его превосходит. Благодеяние и чудо это уму нашему непостижимо. Об этом восклицает богоглаголивый Павел: «Велика благочестия тайна: Бог явился во плоти» ( 1Тим 3:16 ). Хочешь ли каждый день видеть чудо, – помышляй о воплощении и жизни Христовой каждый день и будешь иметь, чему удивляться.'
      cn: '亲爱的，让我们将这件伟大的事工铭刻在我们的记忆中，以免我们成为那些被圣咏者所抱怨的人，他说：「他们忘记了祂的恩惠，和祂向他们所显明的奇迹。」（诗篇 102:2）


        没有比上帝之子的道成肉身更大的恩惠和奇迹了。这上帝的恩惠与奇迹超越了祂所有古老的奇迹和恩惠。这恩惠与奇迹是我们的心智无法测度的。为此，宣讲上帝圣言的保罗感叹道：「敬虔的奥秘何等伟大：上帝显现于肉身。」（提摩太前书 3:16）你若想每天看见奇迹，——就每天默想基督的道成肉身和祂的生命，你就会有值得惊叹之处。'
  - type: paragraph
    text:
      ru: 2) Как зачатие, рождество, так и взросление с годами и различный возраст Господу приписывается по человечеству, а не по Божеству. Ибо Божество как начаться, так и родиться и расти не может, поскольку безначально, неизменно и вечно, и никакой перемене не подлежит, всегда равно в своем совершенстве и вечности пребывает.
      cn: 2) 主的受孕、降生以及随着岁月年华的成长和年龄的增长，都是按其人性而言，而非按其神性而言。因为神性既不能有开始，也不能降生或成长，祂是无始、不变且永恒的，不受任何改变，始终在其完美和永恒中保持同等不变。
  - type: paragraph
    text:
      ru: 3) Иисус Христос Господь наш, будучи ипостасной премудростью Отчей, до совершенных лет человеческого возраста не выходил на великое Свое дело, но явился миру, когда было ему около тридцати лет, тогда вышел на проповедь Евангелия Своего. Отсюда мы, слепые и неразумные, учимся не вдаваться в публичное звание, а особенно в пастырское дело, но ждать совершенного возраста тридцатилетнего. Ибо в этом возрасте познается как разум, так и нрав человеческий, постоянный и непостоянный, добрый и злой, полезный или вредный обществу.
      cn: 3) 我们的主耶稣基督，祂是父的本体性智慧，在达到人性的完全年龄之前，并没有从事祂的伟大工作，而是大约在三十岁时才向世人显现，那时祂才出来宣讲祂的福音。由此，我们这些盲目而无知之人，学到不应投身于公共职业，尤其不应投身于牧灵工作，而应等待三十岁的完全年龄。因为在这个年龄，人的理智和品德才能被认识，无论是恒定不变的还是反复无常的，无论是良善的还是邪恶的，无论是对社会有益的还是有害的。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Спрашиваешь: что было после Крещения Господня?'
      cn: 你问：主的洗礼之后发生了什么？
  - type: paragraph
    text:
      ru: Ответ. Читаем в Евангелии, что Он тотчас возведен был Духом в пустыню и там искушался сатаной. «Немедленно после того Дух ведет Его в пустыню. И был Он там в пустыне сорок дней, искушаемый сатаною» ( Мк 1:12–13 ).
      cn: 回答。我们在福音书中读到，祂立刻被圣灵引到旷野里，并在那里受撒旦试探。「紧接着，圣灵就把祂引到旷野里。祂在旷野里四十天，受撒旦试探。」（马可福音 1:12-13）
  - type: paragraph
    text:
      ru: 'Примечай здесь, возлюбленный:'
      cn: 请留意这里，蒙爱者：
  - type: paragraph
    text:
      ru: '1) Ради нас пришедший в мир Сын Божий Господь Наш все ради нас творил. Попустил духу лукавому и злому приступить и искушать Себя. Сначала «сказал Ему диавол: Если Ты Сын Божий, скажи, чтобы камни сии сделались хлебами» , – затем «повел Его в Иерусалим, и поставил Его на крыле храма, и сказал Ему: если Ты Сын Божий, бросься отсюда вниз» , – и не это только говорил, но еще, «возведя Его на высокую гору» и показав Ему «все царствия мира и славу их» , сказал Ему: «Все это дам Тебе, если, пав, поклонишься мне» ( Мф 4:9 ). Видишь бесстыдство и злость пронырливого духа. Приступил к Тому, о Котором свидетельствовал Отец с небес: «Сей есть Сын Мой возлюбленный, в Котором Мое благоволение» ( Мф 3:17 ), – и к Нему дерзнул с кознями своими приблизиться. Видишь и смирение Господне: одним мановением мог его отогнать, но однако попустил. Нас ради так смирил Себя Господь наш. Рассуждай об этом.'
      cn: 为我们降世的我们的主上帝之子，一切都是为我们而成就的。祂容许诡诈且邪恶的灵靠近并试探祂。首先，「魔鬼对祂说：倘若祢是上帝之子，就吩咐这些石头变成面包」；然后，「魔鬼又带祂到耶路撒冷，把祂置于圣殿的殿顶上，对祂说：倘若祢是上帝之子，就从这里跳下去」；它不仅说了这些，还「带祂上了一座极高的山」，将「世上万国及其荣华」都指给祂看，对祂说：「这一切我都要赐给祢，只要祢俯伏拜我」（马太福音 4:9）。祢看这奸猾之灵的无耻与邪恶。它竟敢靠近那一位——就是天父曾从天上为祂作证说：「这是我的爱子，我所喜悦的」（马太福音 3:17）——它竟敢带着它的诡计靠近祂。祢也看到主宰的谦卑：祂本可以仅仅一个示意就将它赶走，但祂却容许了。我们的主为了我们如此谦卑自己。深思此事吧。
  - type: paragraph
    text:
      ru: 2) Господь наш по Крещении искушался сатаной. Отсюда видим, что всякому возрожденному водой и Духом следует искушение от дьявола. Если главу, Христа Господа искушал, как оставит без искушения члены Его, христиан?
      cn: 2) 我们的主在受洗之后被撒旦试探。由此可见，凡是借着水和圣灵而重生者，必然会受到来自魔鬼的试探。如果（魔鬼）连作为元首的基督主都试探了，又怎会不试探祂的肢体，即基督徒呢？
  - type: paragraph
    text:
      ru: 3) Видишь, что тот, кто искушается и борется с дьяволом, находится в милости и благодати Божией. Разбойник на голого не нападает. Так и этот враг не касается того, кого видит нищим, но нападает на того, кого видит в благополучии духовном, и завидует Ему. Так напал на Адама в раю, видя Его в благополучии; напал на Иова и хотел обнажить его.
      cn: 3) 你看，那受试探并与邪魔争战之人，正处于上帝的恩慈和恩典之中。强盗不攻击赤身裸体之人。这仇敌亦是如此，不触碰那些在祂眼中贫乏之人，却攻击那些在祂眼中处于属灵福祐中的人，并嫉妒那人。祂当年就是在乐园中，因见亚当身享福祐而攻击了亚当；又攻击了约伯，并意欲使他一无所有。
  - type: paragraph
    text:
      ru: 4) В пустыне и в уединении живущим как большее усердие о благочестии, так и большее искушение от искусителя бывает, и чем кто более старается Богу угождать, тем больше искушений тому искуситель наносит. Достаточно об этом нас уверяет церковная история, и те сами на себе узнают, которые против сего врага подвизаются и пекутся о своем спасении.
      cn: 4) 那些生活在旷野和独居中的人，既有更大的虔诚热忱，也有来自那试探者的更大试探；一个人越是努力取悦上帝，那试探者就给他施加越多的试探。教会历史已充分向我们证实了这一点；而那些与这仇敌争战并关注自己救赎的人，他们自己也会亲身了解到这一点。
  - type: paragraph
    text:
      ru: 5) Искушение от дьявола попущением Божиим бывает для доброй цели.
      cn: 5) 魔鬼的试探，乃是藉着上帝的允许，为了良善的目的。
  - type: paragraph
    text:
      ru: Первое. Чтобы так смирился человек искушающийся.
      cn: 首先。使受试探的人如此谦卑自己。
  - type: paragraph
    text:
      ru: Второе. Чтобы познали веру нашу. Искушение подобно огню, который золото, серебро и медь показывает и от прочих металлов отличает. В искушении показывается, кто золото, кто серебро, и кто олово, кто сено и дрова. Золото и серебро целым остается в огне, и чище делается. Железо ржавчину отлагает и целым остается. Олово скоро растапливается, а сено и дрова совсем сгорают. Так в искушении познается, кто истинно отстал от сатаны и злых дел его, и прилепился Богу, кто истинно работает Богу и кто лицемерно. Искушением познаются истинные и верные рабы Божии и лицемеры. Искушение все явно творит.
      cn: '第二。为使人认识我们的信仰。

        试探犹如火炉，它显明金、银、铜，并使它们与其他金属区分开来。在试探中显明谁是金子，谁是银子，谁是锡，谁是干草和木柴。金子和银子在火中依然完整，并且变得更纯净。铁炼去锈迹，且依然完整。锡很快熔化，而干草和木柴则完全烧尽。如此，在试探中得以认识谁真正脱离了撒旦及其邪恶的作为，并依附于上帝；谁是真正侍奉上帝的，谁是假冒为善的。借着试探得以认识上帝真实忠信的仆人以及假冒为善的人。试探使一切都显明出来。'
  - type: paragraph
    text:
      ru: Третье. Чтобы познали любовь, кого мы более любим, себя ли и мир, или Бога, кому угождаем, себе ли и миру, или Богу, чью волю более почитаем, свою ли, или Божию, и прочее. Все это открывает искушение.
      cn: 第三。为了认清爱，我们更爱谁？是爱自己和世界，还是爱上帝？我们更取悦于谁？是取悦自己和世界，还是取悦上帝？我们更尊崇谁的旨意？是自己的，还是上帝的？等等。这一切都借由试探显明出来。
  - type: paragraph
    text:
      ru: Четвертое. Чтобы познали врагов наших и научились против них подвизаться. Ибо битва обучает воина для подвига и крепчайшим делает, а без битвы воин ослабевает и портится.
      cn: 第四。为要认识我们的仇敌，并学习与他们争战。因为争战训练战士为其争战，并使之更强健，而没有争战，战士则会衰弱并败坏。
  - type: paragraph
    text:
      ru: Пятое. Чтобы познали немощь нашу, опасность, и, познав, к Богу с молитвой прибегали. Как малое дитя к матери бежит и у нее ищет защиты, видя свою беду, так верная душа к Богу простирает руки в бедствии своем.
      cn: 第五。为了使我们认识到自身的软弱和危险，并且，在认识到之后，便藉着祷告向上帝投奔。如同小孩子看见自己的困境，便跑向母亲，在她那里寻求庇护；同样，忠信的灵魂在自己的患难中，向上帝伸出双手。
  - type: paragraph
    text:
      ru: 'Шестое. Чтобы искуситель посрамился, а претерпевший искушение венец принял от Подвигоположника: «Блажен человек, который переносит искушение, потому что, быв испытан, он получит венец жизни, который обещал Господь любящим Его» ( Иак 1:12 ). Не знает искуситель, что искушению его последует: он искушает на зло, но когда искушение его обращается претерпевающему на добро, то искуситель посрамляется и как бы своей стрелой уязвляется.'
      cn: 第六。为了使试探者蒙羞，而经受住试探者则从善工的颁奖者那里领受冠冕：「福哉忍受试探的人，因为他既经受了考验，就必得生命的冠冕，这是上主应许给爱他之人的」（雅各书 1:12）。试探者不知道他的试探之后会有何结果：他试探人是为了作恶，但当他的试探转为对忍受者有益处时，试探者便蒙羞，并且仿佛被自己的箭所伤。
  - type: paragraph
    text:
      ru: '6) Видим, что он различные искушения нам наносит: когда одним не удается ему искусить, то другое и третье, и более покушается нанести.'
      cn: 我们看到，他向我们施加各种诱惑：当他未能以一种诱惑得逞时，便会试图施加第二种、第三种，乃至更多的诱惑。
  - type: paragraph
    text:
      ru: 7) Еще видим, что хотя на время и отступает от нас, однако всегда надо его ожидать. Из-за него всегда нам должно быть осторожными. Рассуждай об этом и берегись, и обо мне, недостойном, поминай.
      cn: 7) 我们还看到，尽管它会暂时从我们身边退去，然而我们总要预备它的再来。因为它，我们总要保持警惕。要思量此事并当心，并为我这不配之人代祷。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Чем окончилось искушение?
      cn: 试探是如何告终的？
  - type: paragraph
    text:
      ru: 'Ответ. Не удалось ничего по желанию искусителю: как пришел, так и ушел ни с чем, более того, со стыдом. Познал непобедимого Иисуса, но Сын ли Божий, чего хотел знать, говоря: «если Ты Сын Божий, -» не узнал. Искушал первого Адама в раю – и низложил его, и пленил, а ко второму приступил было – и ничего не успел, и оказался немощным.'
      cn: '回答。

        试探者未能遂其所愿：他一无所获地来，一无所获地去，更何况，满面羞愧。他认识了不可战胜的耶稣，但至于耶稣是否是上帝之子——他曾说：「祢若是上帝之子，——」（马太福音 4:3），想要借此探知——他却未能知晓。他曾在乐园中试探第一个亚当——并将其击败，掳获；但他靠近第二个亚当时——却一无所成，并显出自己的软弱无力。'
  - type: paragraph
    text:
      ru: 'Слава Победителю! Для нас победил врага нашего, которого мы победить не могли, и научил нас, как побеждать его, побежденного Им. Как полководец искусный обучает воинов для битвы, так Царь наш и Вождь наш Иисус научил нас подвизаться против врага нашего – князя тьмы, и его, уже побежденного Им, побеждать. Он подал нам оружие и силу Свою. Он ободряет нас силой Своей, «и обучает руки наши битве, и персты наши сражению» ( Пс 143:1 ), говоря: «Мужайтесь: Я победил мир» ( Ин 16:33 ). Подал нам «и меч духовный, который есть Слово Божие» ( Еф 6:17 ).'
      cn: 荣耀归于得胜者！祂为我们击败了我们无法战胜的仇敌，并教导我们如何战胜这已被祂击败的仇敌。正如一位技艺高超的将领训练士兵上战场，我们的君王和元帅耶稣也照样教导我们，如何与我们的仇敌——黑暗之君奋战，并战胜这已被祂击败的仇敌。祂赐给我们祂的兵器和力量。祂以祂的力量激励我们，「祂教导我的手争战，教导我的指头打仗」（诗篇 143:1），说：「你们要壮胆：我已胜过了世界」（约翰福音 16:33）。祂还赐给我们「圣灵的宝剑，就是上帝的圣言」（以弗所书 6:17）。
  - type: paragraph
    text:
      ru: 'Видим, что Он врага нашего отражал Словом Божиим и, как мечом духовным, козни его пресекал, говоря: «написано, сказано» . Так и нам должно тем же орудием препоясаться и против врага нашего стоять, подвизаться и его побеждать. Сколько раз нападает на нас и пускает на нас стрелы свои, столько раз будем отражать их духовным мечом Слова Божия. Если к любви мира сего старается привести нас, то будем отвечать ему: «Сказано в Писании: «не любите мира"» , и прочее ( 1Ин 2:15 ). Если к воровству подговаривает, то будем отражать его словом: «Сказано в Писании: «не кради"» , и прочее. Но притом всегда будем призывать нам на помощь всесильного Господа Иисуса, и Он победит через нас врага нашего. Ибо без Него победы в такой трудной битве не будет. «Сия есть победа, победившая мир, вера наша. Кто побеждает мир, как не тот, кто верует, что Иисус есть Сын Божий» ( 1Ин 5:4–5 )? О сем Победителе будем дерзать. «Тот, Кто в» нас, «больше того, кто в мире» ( 1Ин 4:4 ). «Благодарение Богу, даровавшему нам победу Господом нашим Иисусом Христом» ( 1Кор 15:57 )!'
      cn: 我们看到祂借着上帝的圣言抵挡我们的仇敌，并如同属灵的宝剑，斩断它的诡计，说：「经上记着，经上说了。」照样，我们也当用这同一兵器束腰，站立抵挡我们的仇敌，竭力争战并战胜它。每当它攻击我们，并向我们射出它的火箭时，我们就当多少次借着上帝圣言的属灵宝剑来抵挡它们。如果它试图引诱我们爱慕这世界，我们就当回答它：「经上说了：『不要爱世界』」，等等（约翰一书 2:15）。如果它怂恿我们偷窃，我们就当用圣言抵挡它：「经上说了：『不可偷盗』」，等等。但与此同时，我们总要呼求全能的主耶稣来帮助我们，祂必借着我们战胜我们的仇敌。因为没有祂，在如此艰难的争战中，就没有胜利。「胜过世界的，就是我们的信心。谁能胜过世界呢？不是那信耶稣是上帝之子的人吗？」（约翰一书 5:4-5）。关于这位胜利者，我们当刚强壮胆。「那在我们里面的，比那在世界上的更大」（约翰一书 4:4）。「感谢上帝，祂借着我们的主耶稣基督赐给我们胜利！」（哥林多前书 15:57）！
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 81 – 90
    cn: 书信 81 – 90
  children:
  - type: paragraph
    text:
      ru: Что ожидало Христа после того, как Он претерпел искушение и победил лукавого духа?
      cn: 基督在经受了试探并战胜了邪灵之后，有什么在等待着祂呢？
  - type: paragraph
    text:
      ru: 'Ответ. Евангелист святой говорит: «Тогда оставил Его диавол, и се, Ангелы приступили и служили Ему» ( Мф 4:11 ). А Лука святой говорит: «И, окончив все искушение, диавол отошел от Него до времени» ( Лк 4:13 ). Христос Господь все нам на пользу устроил, и Себя в пример нам подал. Примечай здесь:'
      cn: 答。圣福音书作者说：「那时，魔鬼就离开了祂，看哪，有天使前来服事祂」（马太福音 4:11）。而圣路加说：「魔鬼用各样试探完了，就暂时离开祂了」（路加福音 4:13）。基督上主为我们安排了一切有益之事，并将自己作为榜样赐予我们。请在此注意：
  - type: paragraph
    text:
      ru: 1) Когда Он искушение от дьявола терпел и его козни отражал, Ангелы святые смотрели на это, смотрел и Отец Небесный, а когда победил врага, Ангелы приступили и служили Ему. Так бывает и с верными Его рабами. При подвиге их присутствуют Ангелы святые, «и ополчаются вокруг них» ( Пс 33:8 ), и смотрят на подвиг их и помогают им, смотрит и Подвигоположник Иисус. И когда благополучно окончат подвиг свой, радуются о них, и повелением Божиим души принимают, и переносят в вечную жизнь. Так Лазарь, по совершении подвига терпения нищеты и болезни, перенесен был Ангелами на лоно Авраамово ( Лк 16:22 ).
      cn: 当祂忍受魔鬼的试探并击退其诡计之时，圣天使们注视着这一切，天父也注视着。当祂战胜仇敌之后，天使们便上前服事祂。祂忠实的仆人也是如此。圣天使们临在于他们的属灵争战中，「在他们四周安营」（诗篇 33:8），注视着他们的争战并帮助他们；苦修竞赛的设立者耶稣也注视着。当他们圆满完成他们的属灵争战时，天使们就为他们欢欣，并奉上帝的命令接引他们的灵魂，将他们迁入永生。正如拉撒路，在完成其忍受贫穷和疾病的苦修功德后，便被天使们迁入了亚伯拉罕的怀里（路加福音 16:22）。
  - type: paragraph
    text:
      ru: 2) После того, как любящий Христа претерпит искушения и скорби из любви к Нему, бывает печальному утешение. Ибо не оставляет Подвигоположник Иисус Своих без утешения, которым они, как водой жаждущие, прохлаждаются и новую силу к подвигу воспринимают.
      cn: 2) 在爱基督者因着对祂的爱而忍受试探和苦难之后，悲伤者便会得到安慰。因为善功创始者耶稣不会让属祂的人得不到安慰；他们藉着这安慰，如同干渴者得水一般，得到清凉，并领受新的力量去进行善功。
  - type: paragraph
    text:
      ru: 3) Видишь, что сатана от Иисуса отошел до времени. Не удалось ему тогда ничего, так после напал на Него через своих служителей, книжников и фарисеев и прочих князей жидовских. Так поступает он и с рабами Христовыми. Когда не удается ему через злые помыслы и прочие беды низложить их, то насылает на них злых людей, и через них гонит, озлобляет и мучает их.
      cn: 3) 你看，撒旦暂时从耶稣那里退去了。当时他一无所获，于是后来就通过他的仆役，就是经师、法利赛人以及犹太人的诸首领来攻击祂。他对基督的仆人也是如此行。当他未能借着恶念和诸般苦难使他们跌倒时，他就差遣恶人来攻击他们，并借着这些人逼迫、恼害并折磨他们。
  - type: paragraph
    text:
      ru: 4) Отсюда видишь, как тесен в веке сем христианский путь. Непрестанная им належит брань, скорбь и печаль. Христиане в мире этом не на пир и веселье, но на всегдашний подвиг позваны. Будет им вечеря и покой, но в будущем веке.
      cn: 由此，你看到今世基督徒的道路何等狭窄。不间断的争战、忧伤与悲苦临到他们。基督徒在此世间并非被召赴宴作乐，而是被召去承受永远的功行。他们将得享筵席与安息，但那是在未来的世代。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'По Крещении и искушении вышел Спаситель наш на проповедь слова Божия: «Иисус начал проповедовать и говорить: Покайтесь, ибо приблизилось царство небесное» ( Мф 4:17 ). То же начало проповеди Своей положил Господь, какое и Предтеча Его: и Он и Иоанн Креститель с самого начала говорили: «Покайтесь» .'
      cn: 在受洗和受试探之后，我们的救主便出来宣讲上帝的圣言：「耶稣就开始传道，说：『你们要悔改，因为天国近了。』」 (马太福音 4:17) 上主也以祂的开路先锋所用的同样开端，开始了祂的宣讲：祂和施洗者约翰从一开始就说：「你们要悔改。」
  - type: paragraph
    text:
      ru: 'Видишь, как согласно слово пророка со словом Господа его, видишь, как нужно нам покаяние. В начале оно нам предлагается, как дверь, через которую приходим ко Христу и веруем в Него. Надо прежде переменить нрав, переменить внутреннее состояние и исправить жизнь, и так утешаться святым Его Евангелием, которым нам царство небесное возвещается. И святой Предтеча, и Господь наш благовествует нам, что приблизилось царство небесное, но в начале оба полагают покаяние, говоря: «Покайтесь» . Ибо истинное покаяние приготовляет сердце к восприятию Евангелия, или радостной вести.'
      cn: 你看哪，先知的话语与他的上主的话语何等一致，你看哪，我们何等需要悔改。起初它被提供给我们，作为一扇门，我们借此来到基督那里，并信靠祂。我们必须首先改变品格，改变内在状态，并修正生命，如此才能从祂的圣福音中得到慰藉，这福音向我们宣告了天国。圣先驱者和我们的上主都向我们宣报喜讯，天国已经临近了，然而，他们二者起初都把悔改摆在首位，说：「你们要悔改！」因为真正的悔改预备人心去领受福音，或说喜乐的佳音。
  - type: paragraph
    text:
      ru: Ибо слово «Евангелие» означает радостную весть, которая провозглашает отпущение грехов, благодать, жизнь вечную и приближение царства небесного, которое было недоступно людям из-за греха. Благ же этих никто не может сподобиться без истинного покаяния. Надо прежде переменить и сокрушить сердце печалью о грехах, и тогда в нем будет место евангельскому утешению. Ибо Евангелие также по смыслу своего имени означает – утешение. Как же им будет утешаться сердце, которое не сокрушилось печалью? Ибо утешение – это радостная весть для печального, а веселящемуся утешение излишне.
      cn: 因为「福音」一词意为喜讯，这喜讯宣告罪得赦免、恩典、永生，以及天国的临近，而这天国曾因人的罪而无法为世人所触及。然而，若无真正的悔改，无人能蒙受这些福惠。必须首先以悔罪的忧伤改变并破碎人心，如此，福音的安慰才能在其中心占有一席之地。因为「福音」之名在其意义上也意指——安慰。若心未曾因忧伤而破碎，它又怎能因此获得安慰呢？因为安慰是为忧伤者而设的喜讯，而对于欢愉者，安慰则是多余的。
  - type: paragraph
    text:
      ru: Итак, покаемся, дабы и в нас Евангельское утешение возымело место. Переменим себя во благое, дабы благ, возвещаемых нам, причаститься. Сокрушим сердца наши за грехи, дабы Евангелие, как пластырь живительный, воспринять. От закона и познания греха сердце печалью, как молотом, сокрушается, но утешением, которое от Евангелия проистекает, исцеляется. Познаем же от закона грехи, и сокрушится сердце наше, а к сокрушенному сердцу приблизится и Евангелие, благовествующее мир, благовествующее благое.
      cn: 那么，我们悔改吧，以便福音的安慰也能在我们里面得以实现。改变我们自己归向良善，以便我们能有份于那些向我们宣报的良善。我们为罪破碎我们的心，以便将福音当作活泼的药膏来领受。由于律法和对罪的认识，心被忧伤如同锤子般破碎，但却被那从福音而来的安慰所医治。那么，让我们从律法中认识罪，我们的心就会破碎；而宣报平安、宣报良善的福音，也会靠近那破碎的心。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Ты вопрошаешь: всем ли возвещается приблизившееся царство небесное?'
      cn: 你问道：临近的天国是否向所有人宣扬呢？
  - type: paragraph
    text:
      ru: 'Ответ: непременно всем. Но видел ты, что в начале покаяние, как преддверие к тому, всем предлагается. Ибо как хотящему войти в палату надо прежде в преддверие войти, так хотящему войти в царство небесное надо покаяние сотворить, переменить сердце свое, мысль свою, и сокрушить сердце свое за содеянные грехи, и так благодатью Христовой войти в царство небесное. Греческое слово «метанойя» (в переводе: покаяние), по смыслу самого имени своего означает – перемену мыслей и сердца. Мы раскаиваемся в том, что грешили, (и потому отвращаемся от худого), как и прежде писал тебе.'
      cn: 回答：必然是所有人。但你看到，起初，悔改作为其前厅，是向所有人提出的。因为正如想进入宫殿的人必须首先进入前厅，同样，想进入天国的人必须实行悔改，改变他的心和思想，并为所犯的罪孽而破碎他的心，如此，借着基督的恩典进入天国。希腊语词 «метанойя»（译为：悔改），根据其名称本身的含义，意味着——思想和心的改变。我们为所犯的罪孽而懊悔（因此我们弃绝邪恶），正如我先前给你写过的。
  - type: paragraph
    text:
      ru: 'Итак, всем возвещается приблизившееся царство небесное, но всем в начале и покаяние предлагается и говорится: «Покайтесь» . В царство небесное ничто скверное не войдет, поэтому надо прежде очиститься от скверны и убелить ризы свои в Крови Агнца Божия, закланного за спасение всего мира, и так войти в царство несесное. К царю земному в палату его не дозволяется никому войти в рубищах; тем более в дом Царя Небесного и святого дозволяется входить только тем, кто совлек с себя рубища, то есть скверны греховные, и омылся Кровью Сына Божия, и оделся одеждой правды Его. Поэтому говорится христианам: «Облекитесь в Господа нашего Иисуса Христа, и попечения о плоти не превращайте в похоти» ( Рим 13:14 ). Надо всякому, кто хочет в царство небесное войти, знамение иметь на душе своей, что он есть Христов. Без этого нет никому в то место входа.'
      cn: 所以，临近的天国向众人宣告，但起初也向众人提供了悔改，并说：「你们当悔改。」凡污秽之物都不得进入天国，因此，必须先洁净污秽，并用为拯救全世界而被宰杀的上帝羔羊的血洗白自己的衣袍，如此才能进入天国。地上的君王，没有人被允许穿着破烂衣服进入他的宫殿；更何况天上的圣洁君王的殿，只允许那些脱去破烂衣服，也就是脱去罪恶的污秽，并用上帝之子的血洗净自己，穿上祂公义的衣裳的人进入。因此对基督徒说：「当披戴我们的主耶稣基督，也不要为肉体安排，去放纵私欲」（罗马书 13:14）。凡欲进入天国者，必须在自己的灵魂上拥有一个记号，表明他属于基督。没有这个记号，无人能进入那个地方。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Знаю я, что ты у меня спросишь: какое знамение на душе того человека, который Христов есть.'
      cn: 我知道你将问我：那个属基督之人的灵魂上有什么记号呢？
  - type: paragraph
    text:
      ru: 'Я тебе апостольское учение в ответ представляю. Он нам ясно объявляет знамение истинных христиан: «Те, которые Христовы, распяли плоть со страстями и похотями» ( Гал 5:24 ). А в другом месте говорит: «Если же кто Духа Христова не имеет, тот и не Его» ( Рим 8:9 ). Вот тебе знамение человека Христова, которое в первом высказывании дается, а во втором видишь и знамение того, кто не Христов. Рассуждай об этих двух признаках и себя искушай, распинаешь ли плоть свою со страстями и похотями, или последуешь прихотям плоти своей; дух ли Христов имеешь, или дух мира сего, мудрствующий о земном.'
      cn: 我向你呈献使徒的教导作为回应。他向我们清楚宣告了真基督徒的标记：「凡属基督耶稣的人，是已经把肉体连肉体的邪情私欲同钉在十字架上了」（加拉太书 5:24）。又在另一处说：「人若没有基督的灵，就不是属基督的了」（罗马书 8:9）。这是属基督之人的标记，在第一个论述中给出；而在第二个论述中，你看到的是不属基督之人的标记。默想这两个标记并省察自己：你是否正把肉体连同其邪情私欲同钉在十字架上，还是随从肉体的私欲；你是否拥有基督的灵，还是拥有这世界的灵，只思念属地之事。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Желаешь ты, чтобы я продолжить писать о Спасителе нашем. Хорошо, и мне это рассуждение полезно, потому и тебе для пользы твоей из святого Евангелия представляю. Слушай же и внимай. Как только вышел Господь наш Иисус на проповедь святого Евангелия Своего, которое от Небесного Своего Отца принес, и начал его проповедовать, видим, что:'
      cn: 祢希望我继续写关于我们的救主。好的，这番论述对我也有益处，因此也为着祢的益处，我将它从圣福音中呈现出来。那么，请听并请留心。我们的主耶稣一走出，去宣讲祂的圣福音——这福音是祂从祂的天父那里带来的——并开始宣讲这福音，我们就看到：
  - type: paragraph
    text:
      ru: 1) Собрал Себе двенадцать учеников из самого низшего сословия, простых и неграмотных людей, которых апостолами назвал.
      cn: 祂为自己召集了十二门徒，他们出身最卑微的阶层，是朴实无文、不识字的人，祂称他们为使徒。
  - type: paragraph
    text:
      ru: '2) Собрал не нуждой, не принуждал никого из них идти за Собой, не повелевал им, хотя и мог, как Господь, но призывал их, говоря каждому из них: «Иди за Мною, -» и шли охотно за Ним, и ходили за Ним как ногами, так и сердцами. Зовет и нас ныне идти за Собой и последовать Ему верой, смирением, любовью и терпением. Последуем же Господу нашему, ради нас на земле явившемуся и по земле ходившему. Оставим все мирское миру, и последуем Ему, и будем как словом, так и делом христианами, то есть Его учениками. Ибо христианин – это Христов ученик.'
      cn: 祂召集（门徒）并非因己需，不强迫他们中的任何人跟随祂，不命令他们，尽管祂作为上主可以如此行；而是呼召他们，对他们每个人说：「来跟从我，—」他们就甘心乐意地跟随祂，既用脚也用心灵跟随祂。祂如今也呼召我们去跟随祂，凭着信心、谦卑、爱和忍耐跟随祂。那么，让我们跟随我们的上主吧，那位为我们降生于世，并在世间行走过的上主。我们将一切世俗之物留给世界，并跟随祂，既在言语上，也在行为上作基督徒，即祂的门徒。因为基督徒就是基督的门徒。
  - type: paragraph
    text:
      ru: '3) С этими Своими святыми учениками с места на место, из города в город, и из селения в селение переходил, трудился, проповедовал Евангелие царствия, сеял спасительное семя Слова Божия, насаждал веру в сердцах человеческих и творил преславные чудеса: прокаженных очищал, слепых просвещал, мертвых воскрешал, и прочие предивные дела творил, как видим во святом Его Евангелии. Так разрушал царство сатаны и из его темной власти восхищал людей Своих, которыми он лукавством своим завладел было. Блаженны видевшие, как Бог, под плотью сокровенный, ходил по земле, и с места на места переходил, и трудился ради убогих наших душ. Ангелы на это с небес смотрели, и удивлялись тому, и прославляли благость Его. Будем же и мы, возлюбленный, всегда душевными очами взирать на время то, в которое Бог стопами Своими по земле ходил и Всемогущий утруждался нас ради, грешных.'
      cn: 3) 祂和祂的这些圣门徒们，从一处到另一处，从一个城到另一个城，从一个村庄到另一个村庄，往来周行，劳苦作工，宣讲天国的福音，播撒上帝之道的救恩种子，在人心中培植信仰，并行了极其荣耀的神迹：洁净麻风病人，光照盲人，使死人复活，并行了其他奇妙的作为，正如我们在祂的圣福音中所见。如此，祂摧毁了撒旦的国度，并从它那黑暗的权势中抢救出祂的人民，这些人曾被撒旦以其诡诈所霸占。福哉那些曾看见的，上帝隐于肉身之中，行走于大地之上，并从一处到另一处周行，且为我们贫乏的灵魂劳苦。众天使从天上观看这一切，并对此惊叹不已，且颂扬祂的良善。那么，亲爱的，愿我们也永远以心灵的眼睛凝视那段时光，在那段时光中，上帝用祂的脚步踏遍大地，而全能者为我们这些罪人而劳苦。
  - type: paragraph
    text:
      ru: О, как блаженно то время, в которое Солнце правды на земле обращалось и лучи Свои распространяло на сидящих во тьме! «Народ, сидящий во тьме, увидел свет великий, и сидящим в стране и тени смертной воссиял свет» ( Мф 4:16 ). Сколь блаженны очи, видевшие Свет сей, видевшие Царя Небесного, ходившего по земле, и уши, слышавшие слова из уст Божиих! Тело человеческое показывало человека, но слова и дела показывали Бога, во плоти таившегося. «Никогда человек не говорил так, как Этот Человек» , как Иисус ( Ин 7:46 ). «Никогда не бывало такого явления в Израиле» ( Мф 9:33 ), поскольку никогда прежде того времени не было Царя Небесного на земле.
      cn: 哦，那时光是何等有福，那时公义的太阳在地上行走，并将祂的光芒散布在坐在黑暗中的人身上！「坐在黑暗中的百姓，看见了大光；住在死荫之地的人，有光向他们照耀。」（马太福音 4:16）何等有福的眼睛啊，看见了这光，看见了在地上行走的上天君王；以及何等有福的耳朵啊，听见了出自上帝之口的言语！人的身体显出人，但言语和作为却显出隐匿于肉身之中的上帝。「从未有人像这个人这样说话」，就像耶稣（约翰福音 7:46）。「在以色列中，从未有过这样的显现」（马太福音 9:33），因为在那之前，从未有过上天君王降临在地上。
  - type: paragraph
    text:
      ru: Не видим мы Его на земле, но видим святое Его Евангелие и в нем святое Его житие и божественные нравы Его. Видим святой образ Его, постараемся же, возлюбленный, видеть Его и на небесах, сидящим одесную Отца Своего. Запечатлеем, брат, в памяти нашей, что Царь Небесный благоволил пожить на земле и трудиться ради нас, дабы не вышло никогда житие Иисусово из нашей памяти, тогда и мы последуем за Ним, не ногами, но сердцами.
      cn: 我们在地上看不见祂，但我们看见祂神圣的福音，并在其中看见祂神圣的生平与祂神圣的品德。我们看见祂的神圣圣像，那么，我们亲爱的弟兄，就当努力在天堂上看见祂，坐在祂天父的右边。弟兄，让我们将这铭记于心：天上的君王乐意降世为人，并为我们辛劳，以使耶稣的生平永不从我们的记忆中消失；如此，我们也将跟随祂，不是用双脚，而是用心灵。
  - type: paragraph
    text:
      ru: '4) Народ, видя преславные Его чудеса и слыша небесное и сладкое его учение, весьма удивлялся и великими толпами за Ним ходил, иные, чтобы исцеление от Него получить, иные, желая святое учение Его послушать. Познали овцы Пастыря своего, ибо, хотя и думали о Нем как о человеке, но из дел и слов Его видели, что Он Выше человека. Хотя и сокрыл величество Свое под смиренной плотью, но делами и учением приоткрывал Божество, подобно тому, как солнце, хотя бы и спряталось, но через лучи себя показывает. Потому и говорил неверующим жидам: «Если Я не творю дел Отца Моего, не верьте Мне; а если творю, то, когда не верите Мне, верьте делам Моим, чтобы узнать и поверить, что Отец во Мне и Я в Нем» ( Ин 10:37–38 ).'
      cn: 百姓看见祂荣显的奇迹，又听见祂属天而甘美的教诲，就极其惊奇，成群结队地跟随祂；有的为要从祂得医治，有的则为聆听祂神圣的教诲。羊群认出了它们的牧者，因为，虽然他们视祂为人，但从祂的言行中，他们看见祂超越了人。祂虽将自己的威严隐藏于谦卑的肉身之下，却藉着其作为和教诲，逐渐显露其神性，正如太阳，即使被遮蔽，仍藉着光线显明自身。因此，祂对不信的犹太人说：「如果我所行的不是我父的作为，你们就不必信我；但如果我所行的正是，那么即便你们不信我，也当信我的作为，好让你们认识并相信父在我里面，我也在父里面。」（约翰福音 10:37-38）
  - type: paragraph
    text:
      ru: 'Познаем, возлюбленный, и мы Пастыря нашего, посетившего нас, и послушаемся святого гласа Его, дабы быть и нам овцами Его, то есть смиренными и кроткими, так как в этом свойство овец Его, – дабы и Он признал нас за Своих овец, и был Пастырем нашим, и жизнь вечную подал нам, как говорит: «Овцы Мои слушаются голоса Моего, и Я знаю их; и они идут за Мною. И Я даю им жизнь вечную, и не погибнут вовек; и никто не похитит их из руки Моей» ( Ин 10:27–28 ). Видишь, какие знаки овец Христовых: «слушаются голоса Его и идут за» Ним. Послушаемся же и мы гласа Его и за Ним пойдем, чтобы быть овцами Его.'
      cn: 亲爱的，愿我们也认识我们那曾眷顾我们的牧者，并听从祂圣洁的声音，好使我们也成为祂的羊——亦即谦卑和温柔的，因为这正是祂羊群的特质——好使祂也认我们为祂的羊，并成为我们的牧者，赐予我们永生，正如祂所说：「我的羊听我的声音，我也认识它们，它们也跟随我。我赐给它们永生，它们永不灭亡，也没有人能从我手里把它们夺去。」 (约翰福音 10:27-28) 你看，基督的羊群有何等样的标记：「听祂的声音，并跟随」祂。那么，愿我们也听从祂的声音，并跟随祂，好成为祂的羊。
  - type: paragraph
    text:
      ru: '5) Апостолы святые, как неотступные Его последователи, все Его божественные дела, святое Его житие и непорочные нравы видели, и все Его небесное учение слышали, и так сделались очевидцами и Его свидетелями, и свидетельствовали о Нем потом по всей вселенной, по слову Его: «И будете Мне свидетелями в Иерусалиме и во всей Иудее и Самарии и даже до края земли» ( Деян 1:8 ). «А они пошли и проповедывали везде, при Господнем содействии и подкреплении слова последующими знамениями. Аминь» ( Мк 16:20 ).'
      cn: 5) 众圣使徒，作为祂忠贞不渝的追随者，亲眼目睹了祂一切神圣的作为、祂圣洁的生平以及祂无瑕的品德，并亲耳听闻了祂一切属天的教导，因此成为了祂的亲眼见证者和祂的证人，后来根据祂的话语，在普世作了祂的见证人： 「但你们要在耶路撒冷、在全犹太和撒马利亚，直到地极，作我的见证。」 （使徒行传 1:8）。 「他们就出去，到处宣讲福音，上主与他们同工，并用随之而来的神迹奇事证实所传的道。阿们。」 （马可福音 16:20）。
  - type: paragraph
    text:
      ru: 'Слава Богу, что и до нас, недостойных, дошло свидетельство тех очевидцев. Поверим, возлюбленный, свидетельству тех очевидцев, которые сами Бога во плоти видели, слышали и руками осязали, и что видели и слышали, то проповедали нам, чтобы и мы общение имели с ними ( 1Ин 1:3 ). Бог свидетельствовал с небес: «Сей есть Сын Мой возлюбленный, в Котором Мое благоволение» ( Мф 3:17 ). То же и посланники Его святые свидетельствовали.'
      cn: 荣耀归于上帝，甚至连不配的我们，也得到了那些目击者的见证。蒙爱者啊，让我们相信那些目击者的见证吧！他们亲眼见过成了肉身的上帝，亲耳听过，亲手触摸过；他们所见所闻的，便向我们宣讲了，为要使我们也能与他们相通（约翰一书 1:3）。上帝从天上作证说：「这是我的爱子，我所喜悦的」（马太福音 3:17）。祂的圣使们也同样作了见证。
  - type: paragraph
    text:
      ru: Отворим уши душ наших, и примем свидетельство в сердца наши, и углубим его, и всегда в том поучимся, что Бог ради нас, создания Своего убогого, и Царь Небесный ради непотребных рабов Своих, явился на земле, и пожил, и потрудился, чтобы нас на небо возвести. Великое и удивления достойное было бы дело, когда бы царь земной ради плененного раба Своего пришел сам освободить его. Сколь несравненно большее дело, что Сам Бог в посольство вступил ради меня и тебя, убогих и негодных рабов Своих, и пришел к нам в мир этот избавить нас.
      cn: 让我们敞开我们灵魂的耳朵，并将这见证领受进入我们心中，且常常从中受教训，即上帝为了我们，祂卑微的受造物，以及天国君王为了祂无用的仆役，降临地上，亲身居住，且亲身劳苦，为要将我们提升至天上。这将是一件伟大且令人惊叹的事，倘若一位地上君王为了他被俘的仆役，亲自前来将他解救。然而，何等无法比拟之伟大的事，竟是上帝亲自为了你我，卑微且无用的祂的仆役，亲自承担使命，且降临我们在这世上，为要救拔我们。
  - type: paragraph
    text:
      ru: О, дивное чудо, которому и Ангелы достойно удивляются! Да обращается всегда чудо сие пред душевными нашими очами, и тогда подлинно обновимся, и от сердца послушаемся Божественных слов Его, и будем «новой тварью во Христе» ( 2Кор 5:17 ).
      cn: 哦，奇妙的奥迹，连天使都理当惊叹！愿这奥迹常在我们的心眼前流转，如此我们方能真正更新，并衷心顺从祂的神圣话语，成为「在基督里的新造的人」（哥林多后书 5:17）。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Ты вопрошаешь: как в сердце углубить великое смотрения Христова таинство?'
      cn: 你问：如何在心中深化伟大的基督的眷顾奥秘？
  - type: paragraph
    text:
      ru: 'Ответ. О чем часто помышляем и поучаемся, то глубже в памяти и сердце нашем вкореняется. Помышляй часто и об этом великом и дивном деле, и молись, и вкоренится в сердце твоем. Видишь образ Его в церкви и дома: помышляй, что это образ Сына Божия, и Небесного Царя, и Бога твоего, Который ради тебя на земле явился, и пожил, и трудился. Видишь образ Богородицы: помяни тут, что это образ Той Пресвятой Девы, Которая плотью родила Господа твоего, и на руках носила, и млеком материнским питала. Видишь образы апостолов: думай тут, что это изображение очевидцев и боговидцев, которые своими очами Бога явившегося видели, и слова жизни из уст Его слышали, и на чудеса, Им творимые, смотрели, и с Ним обращались и жили, и с места на место ходили, и потом нам Его проповедали. Видишь образ Крестителя: помышляй тут, что это подобие того великого пророка, который удостоился крестить Господа твоего в водах Иорданских и указывал на Него рукой своей: «Вот Агнец Божий, Который берет на Себя грех мира» ( Ин 1:29 ).'
      cn: 回答。我们常常默想并从中受教的，就更深地扎根在我们的记忆和心中。常常默想这件伟大而奇妙的事，并且祈祷，它就将扎根在你的心中。你在教堂和家中看到祂的圣像时，默想这是上帝之子、天国的君王、你的上帝的圣像，祂为了你降临地上，生活并劳作。你看到圣母的圣像时，在这里记念，这是那至圣童贞女的圣像，祂以肉身生下你的主，并用双手怀抱过，用母乳喂养过。你看到使徒们的圣像时，在这里思量，这是那些亲眼目击者和见神者的圣像，他们用自己的眼睛看到了显现的上帝，并从祂的口中听到了生命的话语，看到了祂所行的奇迹，与祂交往并共同生活，从一个地方到另一个地方行走，之后再向我们宣讲了祂。你看到施洗者的圣像时，在这里默想，这是那位伟大先知的圣像，他蒙受殊荣在约旦河水中为你的主施洗，并用自己的手指向祂说：「看哪，上帝的羔羊，祂除去世人的罪孽！」（约翰福音 1:29）。
  - type: paragraph
    text:
      ru: Так, когда будем часто о Нем и действиях Его рассуждать, то углубится память о Нем в сердцах наших, что великую душам нашим подаст пользу.
      cn: 如此，当我们常常默想祂和祂的作为时，对祂的忆念就会在我们心中深化，这将给我们的灵魂带来莫大的益处。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Что означают слова Христа Господа: «Лисицы имеют норы и птицы небесные – гнезда, а Сын Человеческий не имеет, где приклонить голову» ( Мф 8:20 )?'
      cn: 基督上主的话语：『狐狸有洞穴，天空的飞鸟有窝巢，但人子却没有安枕之处』（马太福音 8:20），这意味着什么？
  - type: paragraph
    text:
      ru: 'Ответ:'
      cn: 回答：
  - type: paragraph
    text:
      ru: 1) Христос Господь наш этими словами представляет нам крайнюю Свою нищету, ибо настолько он беден был, что и дома собственного Своего не имел, где бы голову Свою мог приклонить. «Лисицы имеют норы и птицы небесные – гнезда» , а Он и дома Своего не имел.
      cn: 1) 基督我主籍着这些话语，向我们揭示了祂极致的贫乏，因为祂是如此贫穷，以至于甚至没有祂自己的家，可以安放祂的头。祂说：「狐狸有洞穴，天上的飞鸟有窝，」 (马太福音 8:20) 然而祂却连自己的家也没有。
  - type: paragraph
    text:
      ru: '2) Смотри, как ради нас обнищал Тот, Которому принадлежит вся земля и все, что наполняет ее, – не имел даже, где голову приклонить. О, чудо! Тот, у Которого в руке все концы земли, и небо престол, и земля подножие, так обнищал, что не имел, где голову приклонить. Эту нищету представляет нам Его апостол: «Вы знаете благодать Господа нашего Иисуса Христа, что Он, будучи богат, обнищал ради вас, дабы вы обогатились Его нищетою» ( 2Кор 8:9 ). Своей нищетой милостивый наш Иисус нас, нищих, обогащает.'
      cn: 2) 看哪，为了我们，拥有全地及其一切丰盛的那位，如何变得贫穷，甚至没有枕首之地。哦，奇迹！那位手握地极，以天为宝座、地为脚凳的，竟然贫穷至此，以致无枕首之处。祂的使徒向我们阐明了这份贫穷：「你们知道我们主耶稣基督的恩典：祂本是富足的，却为你们的缘故成了贫穷，好叫你们因祂的贫穷成为富足。」（哥林多后书 8:9）借着祂的贫穷，我们仁慈的耶稣使我们这些贫穷的人得以富足。
  - type: paragraph
    text:
      ru: '3) Мы все хотим в мире этом быть богатыми, в богатых домах и в славе жить, не помышляя о том, что мы здесь – странники и пришельцы, как и отцы наши, и все на этой чужой земле оставим, но Господь наш, хотя и все мог иметь, как Господь всего, однако же от всего отрекся. Он ради нас обнищал, а мы хотим обогащаться, и не хотим самовольной Его святой нищете подражать, даже ради себя. И тем самым показываем, что далеко от пути Его отстоим.Чему Его нищета учит нас, разве не тому, чтобы все богатство и славу мира сего презирать? – Чему Он и словом учил: «Не собирайте себе сокровищ на земле, где моль и ржа истребляют и где воры подкапывают и крадут» ( Мф 6:19 ). Ибо что есть жизнь наша, если не путь и странствование? И отечество наше не здесь, но в будущем веке. Там и наследие, и богатство, и слава от Него уготована нам. Оставим же, возлюбленный, земле земное, и миру мирское, и последуем Господу нашему, нищете Его подражая, дабы обогатил нас небесными и нетленными благами.'
      cn: 3) 我们都想在这世上富裕，住豪华的房屋，享尽荣耀，却不思量我们在这里是客旅和寄居者，如同我们的列祖一样，并且会把一切都留在这异乡的土地上。然而我们的上主，虽然作为万有的主宰，本可以拥有一切，却舍弃了所有。祂为我们而贫乏，而我们却想致富，甚至为了我们自己，也不愿效法祂那甘愿的圣洁贫乏。如此一来，我们表明我们远离了祂的道路。祂的贫乏教导我们什么？难道不是教导我们轻看这世上一切的财富和荣耀吗？—— 祂也曾以言语教导说：「不要为自己在地上积攒财宝，地上有虫子咬，能锈坏，也有盗贼挖洞来偷」（马太福音 6:19）。因为我们的生命若不是道路和客旅生涯，又能是什么呢？我们的家乡不在这里，而是在那未来的世代。在那里，祂为我们预备了产业、财富和荣耀。那么，亲爱的，让我们把属于地上的归给地土，把属于世界的归给世界，并跟随我们的上主，效法祂的贫乏，以便祂用属天的和不朽的福益使我们富足。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Просишь ты, чтобы я тебе в письмах напоминал о смерти и о том, что в связи с кончиной обычно вспоминается: о суде Христовом, царствии небесном и муке вечной. Хорошо, и мне это полезно, потому непременно буду тебе об этом напоминать. Ибо нет ничего для нас полезнее, как об этом всегда помнить. Это отводит нас от греха, это учит усердно каяться, подвигает к усердной молитве, отводит от суеты мира сего, угашает любовь к чести, славе и богатству мира сего, увещевает нас осторожно в мире этом обращаться, показывает, что мы странники и пришельцы в мире этом, и отлучает нас от времени и временного, и привязывает к вечности, к которой все идем. Ты о том и размышляй, о чем я тебе напомню, дабы углубилось в сердце твоем. Ибо и пришествие в мир Христа Господа нашего ради вечности было, дабы от злополучной вечности нас избавить, и блаженную нам подать.'
      cn: 你请求我在信中提醒你关于死亡，以及关于那通常与逝世相关而被记起的事：关于基督的审判、天国和永恒的痛苦。好的，这对我也有益处，所以我必会不断地提醒你这些。因为对我们而言，没有什么比永远记住这些更有益的了。这使我们远离罪恶，教导我们殷勤悔改，推动我们殷勤祷告，使我们远离这世间的虚浮，熄灭我们对这世间的尊荣、荣耀和财富的爱，劝诫我们在这世上谨慎行事，显明我们在这世上是客旅和寄居者，并使我们与时间及其短暂之事分离，与永恒联结，我们都走向永恒。你要思想我所提醒你的事，好使它在你心中深化。因为我们主基督降世，也是为了永恒，为要将我们从那不幸的永恒中拯救出来，并赐给我们那蒙福的永恒。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: как мы нищетой Христовой обогащаемся?'
      cn: 你发问说：我们如何因基督的贫穷而得以富足？
  - type: paragraph
    text:
      ru: Ответ. Мы Создателем нашим созданы по образу Его и подобию, и созданы для вечных благ, но сатана лукавством своим лишил нас всего этого и сделал нас нищими; и хотя многие изобилуют видимым богатством мира сего, однако же все пред Богом – нищие, как грешники. Ибо грех соделовает истинную духовную нищету. В такую нищету враг лукавый ввергнул праотца нашего Адама, а с ним и нас – его потомство. Богач, который много золота, серебра, и прочего тленного богатства имеет, но в грехах живет, – непременно нищий, ибо не имеет надежды на небесные блага.
      cn: 回答。我们被我们的创造者照着祂的形象和样式所创造，并且是为了永恒的福益而被创造的，但撒旦凭着自己的诡诈使我们失去了这一切，并使我们变得贫穷；并且虽然许多人拥有这世上看得见的财富丰盛有余，然而在上帝面前，所有人都是贫穷的，如同罪人。因为罪恶造成了真实的属灵贫乏。诡诈的仇敌将我们的始祖亚当投入了这样的贫乏之中，并且连同他，也把我们——他的后裔——投入了其中。一个拥有许多金银和其余一切会朽坏的财富的富人，但却活在罪恶之中，——必然是贫穷的，因为他没有对天上福益的盼望。
  - type: paragraph
    text:
      ru: Видишь нищету в которой все мы, бедные, находимся. Христос Господь наш пришел к нам и, будучи богат, обнищал, чтобы нас обогатить; на земле странствовал, дабы нам отечество небесное возвратить; образ раба воспринял, будучи Господом, дабы в нас образ Божий возобновить; не имел, где голову приклонить, дабы нам дом Небесного Своего Отца открыть; нищим был на земле, дабы открыть нам небесные сокровища; грехи наши на Себя взял, чтобы подать нам правду Свою. Так Он отнимает от нас нищету нашу и подает богатство Свое.
      cn: 你可见我们这些贫困之人所处的贫乏。我们的主基督降临我们，祂本是富足的，却变为贫乏，为要使我们富足；在世上作客旅，为要将天上的家乡归还我们；祂本是主，却取了奴仆的形像，为要使我们里面上帝的形象得以更新；没有枕首之地，为要为我们开启祂天父的家；在世上为贫困之人，为要向我们开启天上的宝藏；将我们的罪孽担负在祂自己身上，为要赐给我们祂自己的义。如此，祂就从我们身上除去我们的贫乏，而赐予我们祂自己的富足。
  - type: paragraph
    text:
      ru: Постараемся, возлюбленный, богатство, Им подаваемое, отыскать, перестанем земное искать и поищем небесного богатства. Все земное на земле остается и отходит от нас вскоре, но небесное вовеки пребывает с нами неотлучно. Смерть земного лишает, но к вечному сокровищу нас отсылает. При смерти грехолюбивый богач вечно нищим делается, а боголюбивый, хотя и нищ, вечно богатым благодатью Божией бывает ( 1Кор 1:5 ). Ибо любящим Бога уготованы вечные блага. Итак, поминай смерть, которая нас всего земного лишает и делает человека или вечно нищим, или вечно богатым, – и не захочешь на земле обогащаться. Смерть за нами невидимо ходит, и чем более живем, тем более приближается к нам.
      cn: 蒙爱者啊，让我们努力寻求祂所赐的财富，停止寻求属世之物，转而寻求属天之财。一切属世之物都留在地上，且很快便离我们而去；但属天之物永远与我们同在，永不分离。死亡使人失去属世之物，却将我们遣往永恒的宝藏。临死之时，爱罪的富人变得永远贫穷；而爱上帝之人，即便贫穷，却因着上帝的恩典而永远富足（哥林多前书 1:5）。因为爱上帝之人，已预备了永恒的福益。所以，谨记死亡，它使我们失去一切属世之物，并使人或永远贫穷，或永远富足——如此你便不会想在地上积财致富。死亡在我们身后无形地行走，我们活得越久，它便越靠近我们。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Господь сказал: «Сын Человеческий не для того пришел, чтобы Ему служили, но чтобы послужить и отдать душу Свою для искупления многих» ( Мф 20:28 ), – что это значит?'
      cn: 主说：「人子来，不是要受人的服侍，而是要服侍人，并且舍弃自己的生命，为要赎许多人的罪。」（马太福音 20:28）——这意味着什么？
  - type: paragraph
    text:
      ru: Ответ.
      cn: 答。
  - type: paragraph
    text:
      ru: 1) Сын Божий здесь называет Себя Сыном человеческим как из любви к роду человеческому, так и от смирения. Как уподобиться нам из любви, так и называться подобным нам благоволил. И как читаем в Евангелии Его, более называл Себя Сыном человеческим, нежели Сыном Божиим. Смотри, каково смирение и любовь Сына Божия к нам! Слава Возлюбившему нас и Смирившемуся ради нас.
      cn: 上帝之子在此称自己为人子，既出于对人类的爱，也出于谦卑。祂既出于爱而与我们相似，也乐意被称为与我们相似。正如我们在祂的福音书中读到，祂称自己为人子远多于称自己为上帝之子。看啊，上帝之子对我们是何等的谦卑与爱！荣耀归于那爱我们并为我们谦卑的！
  - type: paragraph
    text:
      ru: '2) Видим здесь, что Он как в человеческом и рабском образе пришел, так и служить людям не отрекался, и говорил ученикам Своим: «Аз посреди вас, как служащий» ( Лк 22:27 ). Потому и ноги умыть у них не постыдился ( Ин 13:5 ). Примечай, возлюбленный, как Господь наш ради нашего спасения смирился. Тот, у Которого ремень обуви развязать недостойным себя почитал великий Иоанн, Которому Ангелы со страхом и раболепно служат, – служить людям, рабам Своим, и им ноги умыть благоволил.'
      cn: 我们在此看到，祂既以人性和仆役的形象降临，祂也不拒绝服事世人，并对祂的门徒们说：「我乃在你们中间，如同服事人的」（路加福音 22:27）。因此，祂也不羞于为他们洗脚（约翰福音 13:5）。爱子啊，请留意，我们的主为了我们的救赎，何等谦卑。那位连伟大的约翰都认为自己不配解祂鞋带的，那位天使们都敬畏地、恭顺地服侍的——竟乐意服事世人，服事祂的仆人们，并为他们洗脚。
  - type: paragraph
    text:
      ru: О, чудо! О, зерцало смирения! Смотрел на это Отец Небесный с небес и благоволил о том. Смотрели Ангелы Его и удивлялись тому. Видим и мы ныне верою и поклоняемся смирению Его.
      cn: '啊，奇迹！啊，谦卑的典范！

        天父从天上瞻望这一切，并甚为悦纳。

        祂的众天使也瞻望此事，并为此惊奇不已。

        现今，我们亦凭着信心看见，并敬拜祂的谦卑。'
  - type: paragraph
    text:
      ru: '3) Таким смирением Своим учит нас Господь наш смирению и говорит: «Научитесь от Меня, ибо Я кроток и смирен сердцем» ( Мф 11:29 ). И еще: «Знаете ли, что Я сделал вам? Вы называете Меня Учителем и Господом, и правильно говорите, ибо Я точно то. Итак, если Я, Господь и Учитель, умыл ноги вам, то и вы должны умывать ноги друг другу. Ибо Я дал вам пример, чтобы и вы делали то же, что Я сделал вам» ( Ин 13:12–15 ).'
      cn: 3) 我们的主借由祂这样的谦卑，教导我们谦卑，并说：「你们当学我的样式，因为我心里柔和谦卑」（马太福音 11:29）。又说：「你们知道我向你们所做的吗？你们称我为夫子，称我为主，你们说的对，我正是。那么，我，你们的主和夫子，既然给你们洗了脚，你们也应当彼此洗脚。因为我给你们作了榜样，叫你们也照着我向你们所做的去做。」（约翰福音 13:12-15）。
  - type: paragraph
    text:
      ru: Воззрим на этот живой образ смирения и последуем Ему. Посмотрим в это зеркало и очистим себя от гордости нашей. Не постыдимся таким же людям, таким же рабам, таким же грешникам, как и мы сами, послужить и покориться, видя, как Господь рабам Своим служить не постыдился.
      cn: 让我们注视这活生生的谦卑榜样，并效法祂。让我们照一照这面镜子，并洁净自己脱离我们的骄傲。让我们不要羞于服事并顺服那些和我们自己一样的人、仆人和罪人，因我们看见上主并不羞于服事祂的仆人。
  - type: paragraph
    text:
      ru: Запечатлеем, возлюбленный, этот образ на сердцах наших, чтобы изгнать из них бесовскую гордость. Нет ничего выше смирения, и нет ничего подлее гордыни. Смирение возносит, а гордость смиряет. Смирением люди возносятся, а гордостью смиряются. Смирением из грешников праведниками делаются, а гордостью из праведников грешниками. Смирение и Богу благоприятно, и людям любезно. Научимся же смирению, дабы Бог призрел на нас и оправдал нас. О, Иисусе! Подай нам смирение.
      cn: 蒙爱者啊，让我们将这形象铭刻在我们的心中，为要从中驱逐魔鬼般的骄傲。没有什么比谦卑更崇高，没有什么比骄傲更卑劣。谦卑使人升高，而骄傲使人降卑。人因谦卑而升高，而因骄傲而降卑。借着谦卑，罪人得以成为义人；而借着骄傲，义人却变为罪人。谦卑既蒙上帝悦纳，也为众人所爱。那么，让我们学习谦卑吧，为要使上帝垂顾我们并称我们为义。哦，耶稣！求祢赐予我们谦卑。
  - type: paragraph
    text:
      ru: 4) Помни, брат, что Тот, Который так смирился ради человека, придет еще раз, но уже не в смирении, не в рабском облике, а в славе Отчей, и не служить людям, но судить людей. Близок же день тот, и уже ближе сегодня, нежели вчера был, и так приближаясь, явится нежданно. Приготовим же себя, дабы неготовыми не постигнул нас день тот.
      cn: 4) 记住，弟兄，那位为世人如此谦卑的，必将再次降临，但已不再是谦卑，不再是奴仆的形像，乃是带着父的荣耀，也不再是服侍世人，而是审判世人。且那日子已近，并且今日比昨日更近了，如此逼近着，必将不期而至。那么，让我们预备自己吧，免得那日子在我们尚未预备好时就临到我们。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 91 – 100
    cn: 书信 91 – 100
  children:
  - type: paragraph
    text:
      ru: Поскольку важно знать, что для нас смирение Иисусово есть зеркало, смотря в которое, должны мы смиряться, то я еще о том тебе повторяю.
      cn: 鉴于了解以下这点至关重要：对我们而言，耶稣的谦卑是一面镜子，我们应当借此观照并谦卑自己，所以我再次向你重申此事。
  - type: paragraph
    text:
      ru: Если бы случилось тебе видеть, что царь земной, склонившись, умывает рабам своим ноги, то ты бы непременно тому удивился. И невозможно тому не удивляться. И на весь свет прославилось бы то дело, ибо умывать ноги – это служение рабское, и из рабских – последнейшее. Потому и дивно бы было, если бы царь, несмотря на величество сана своего, такое служение совершал. Но царь земной, хотя и велик по сану своему, однако же человек, такой же, как и рабы его. Представь себе ныне то время, в которое Царь Небесный на Себе образ сей смирения и служения показывал, и ту горницу, в которой Царь царствующих и Господь господствующих «встал с вечери, снял с Себя верхнюю одежду и, взяв полотенце, препоясался, потом влил воды в умывальницу» и, встав на колени, «начал умывать ноги ученикам и отирать полотенцем, которым был препоясан» ( Ин 13:4–5 ).
      cn: 假如你看到地上的君王俯身为他的奴仆洗脚，你一定会对此感到惊讶。对此，不可能不感到惊讶。这件事也会传遍天下，为人所称颂，因为洗脚是奴仆的工作，而且是奴仆中最卑微的工作。因此，如果君王尽管其身分尊贵威严，却做如此的服事，这才会令人称奇。但地上的君王，尽管身分高贵，却仍是人，与他的奴仆无异。如今，请你想象那个时候，天上的君王亲自展现这谦卑与服事的榜样，以及那间客房——万王之王、万主之主在其中「从席上起来，脱下外衣，拿起一条手巾束腰，随后把水倒在盆里，」并跪下，「开始洗门徒的脚，并用他所束的手巾擦干。」 (约翰福音 13:4-5)。
  - type: paragraph
    text:
      ru: 'О, прекрасное зрелище! Дивное для Ангелов и людей! Не смотрел на Свое величество, но служение рабское и самое унизительное совершил: «встал с» трапезы, «снял с Себя верхнюю одежду и, взяв полотенце, препоясался» , и «влил воды в умывальницу» и, склонялся, встав на колени, и принимался руками Своими омывать ноги рабов своих, и отирал их.'
      cn: 哦，何等美好的景象！令天使和世人惊叹不已！祂不顾自己的尊荣，却履行了奴仆般的、最卑微的事奉：「从筵席上起来，脱了外衣，拿一条手巾束腰」，又「把水倒在盆里」，并且跪下身来，亲自用自己的手洗祂的仆人们的脚，并擦干了。
  - type: paragraph
    text:
      ru: Петр, помышляя, что дело сие есть последнейшее, и устыдившись чести Лица Учителя и Господа своего, Который таким рабским делом не погнушался, пришел в великое удивление и некоторое негодование, и потому каких только слов не произносил и каких отговорок не делал, как ни старался, чтобы ему ноги не умывал Господь его и Учитель! «Господи! Тебе ли умывать ноги мои? Не умоешь ног моих вовек» . Но что бы было, если бы увидел тогда то величество, то высочество и ту славу, которая внутри Умывавшего скрывалась? На Фаворе частицу славы Иисусовой увидев, апостолы пали ниц и сильно испугались ( Мф 17:6 ). При умовении ли ног их не ужаснулись бы и не пришли бы во исступление ума?
      cn: 彼得，思忖着这事是何等卑微，且羞于他自己夫子与主宰的尊荣面容——祂竟不屑于此等仆役之举——遂感到极大的惊诧与某种程度的愤慨。因此他曾说过多少话语，作过多少推诿，无论他如何竭力，都不愿让他的主宰与夫子为他洗脚！他说：「主啊！祢岂能为我洗脚？祢绝不能洗我的脚，直到永远。」然而，他若那时看到了那威严、那崇高以及那荣耀，那隐藏在为他洗脚的这位内部的，又会如何？在塔博尔山，使徒们看见了耶稣荣耀的一小部分，就俯伏在地，大大惧怕（马太福音 17:6）。当祂洗他们的脚时，他们岂不更加惊骇，心神出神吗？
  - type: paragraph
    text:
      ru: Мы же Того, Которого видели таким смирившимся на земле, уже видим верою превознесенным на небеса, и Того, Который умывал апостолам ноги и служил им, с радостью видим сидящим одесную Бога во славе Отчей и царствующим над всей тварью, видимой и невидимой. И в нас, возлюбленный, «должны быть те же чувствования, какие и во Христе Иисусе» ( Флп 2:5 ). Последуем же и мы за Иисусом и пойдем низким путем смирения, дабы прийти к Нему и увидеть Его лицом к лицу, царствующим во славе Своей, и с Ним быть вовеки. Низок путь смирения, но в высокое отечество – небо ведет.
      cn: 我们借着信德，已经看见那位在地上如此自卑的，在天上被高举；并且，我们欣然看见那位给使徒洗脚并服侍他们的，坐在上帝的右边，在父的荣耀中，并统治着一切可见和不可见的受造物。并且，亲爱的，在我们里面，「当以基督耶稣的心为心」（腓立比书 2:5）。那么，我们也当跟随耶稣，走那自卑的卑微道路，以便来到祂面前，与祂面对面，看见祂在祂的荣耀中为王，并与祂永远同在。自卑的道路是低微的，但它却引向高尚的家乡——天国。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Почему Господь говорит прокаженному, которого исцелил: «Смотри, никому не сказывай» ( Мф 8:4 ), – что это означает?'
      cn: 为何上主对祂所治愈的麻风病人说：「切记不可告诉任何人」（马太福音 8:4），这作何解？
  - type: paragraph
    text:
      ru: Ответ.
      cn: 答。
  - type: paragraph
    text:
      ru: '1) И здесь смирение Иисусово представляется нам. Исцелял немощных силой Своей, но славы человеческой избегал, как говорит: «Не принимаю славы от человеков» ( Ин 5:41 ). Избегал славы Тот, Которому единому слава подобает, делал благодеяние, но хвалить Себя запрещал. Ибо не пришел на землю, чтобы хвалиться и прославляться, но чтобы смириться и спасти нас. Славу всю воздавал Небесному Своему Отцу, хотя и Сам был и есть Единородный и единосущный Сын Его, но под смиренной плотью был тогда сокровен. Он хотел не человеческими языками прославиться, но Крестом. Одного того искал, чтобы люди веровали в Него как пришедшего Мессию и так бы спаслись. У Него то желание и старание было, дабы через Него познался и прославлялся людьми Отец Его Небесный. Да будет слава Ему о сем со Отцом и Святым Его Духом и от нас, грешных.'
      cn: 在此，耶稣的谦卑展现在我们面前。祂以自己的能力医治病弱者，却避开人的荣耀，正如祂所说：「我不接受从人来的荣耀」（约翰福音 5:41）。那唯独配得荣耀者，却避开荣耀；祂行善事，却禁止人赞扬祂。因为祂来到世间，并非为了受夸耀和被荣耀，而是为了谦卑自己并拯救我们。祂将一切荣耀归于祂的天父，尽管祂自己过去是、现在也是天父的独生子、与父同本体的儿子，但在那时，祂是隐藏在谦卑的肉身之中。祂不愿藉着人的口舌得荣耀，而是愿藉着十字架。祂所寻求的，唯独是人们能信祂是那到来的默西亚，并因此得救。祂的愿望和努力是，借着祂，祂的天父能被人们认识并荣耀。愿荣耀因此归于祂，与父和祂的圣灵同在，也由我们罪人所献上。
  - type: paragraph
    text:
      ru: 2) Так учил нас добро творить, но славы от людей не искать, а славу всю Богу воздавать. Мы хотя и чужое добро имеем, и чужое уделяем ближнему (ибо ничего своего человек не имеет, кроме немощи и грехов), однако же хотим хвалиться и прославляться среди людей, как бы за свое добро. В этом немощь наша и слепота. Так сатана и от добрых наших дел оброки себе берет и в тщеславие нас ввергает, дабы своей, а не Божией славы искали, и так не воздавали Богу того, что Ему единому приличествует и подобает. Это грех премерзкий, духовное, сердечное от Бога отступление. Поэтому Христос Господь наш Своим примером учит нас славы мира сего не любить и тщеславия избегать, но все доброе единому Богу приписывать и от Него искать славы на небесах. Постараемся же добрые дела творить, но во славу Божию, а не нашу, дабы так истинную славу получить там, где вечная слава есть. Здесь посеем, дабы там, а не здесь, трудов наших плоды пожинать.
      cn: 2) 祂如此教导我们行善，但不寻求人的荣耀，而是将一切荣耀归于上帝。我们虽然拥有并非己有的良善，且将并非己有的分给近人（因为人除了软弱和罪恶，一无所有），然而却想在人前夸耀和受人称颂，仿佛那是我们自己的良善。这就是我们的软弱和盲目。撒殚因此也从我们的善行中为自己攫取贡物，并将我们投入虚荣之中，以便我们寻求自己的荣耀而非上帝的荣耀，从而不将那唯独属于祂、并与祂相称的荣耀归于上帝。这是极其可憎的罪，是属灵的、发自内心的背离上帝。因此，我们的主基督以祂自己的榜样教导我们不要喜爱这世上的荣耀，并要避免虚荣，而是将一切善事都归于独一的上帝，并从祂那里寻求天上的荣耀。那么，让我们努力行善，但要为着上帝的荣耀，而非我们自己的，以便在那里——有永恒荣耀之处——获得真正的荣耀。我们在这里播种，以便在那里，而非在这里，收割我们劳苦的果实。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь ты: почему то, что человек ищет славы от добрых дел, есть духовное отступление от Бога?'
      cn: 你问道：为什么人寻求从善行而来的荣耀，是灵性上背离上帝的行为？
  - type: paragraph
    text:
      ru: Ответ.
      cn: 答。
  - type: paragraph
    text:
      ru: 1) Бог не на внешние дела смотрит, но на сердце человеческое, с каким сердцем и для какой цели дела творятся, и так по тому и судит.
      cn: 1) 上帝不看外在的行为，而看人的心，看人以何等之心、为着何等目的施行这些行为，并因此而审判。
  - type: paragraph
    text:
      ru: 2) Бог начало и источник всякого добра, и потому Ему единому подобает слава и хвала за добро. Когда же человек за добро славы и похвалы себе желает и ищет, то себя, как идола, поставляет на том месте, где подобало бы Богу быть, и хочет, чтобы его, как идола, хвалили и прославляли, вместо Бога. Поэтому отступает от Бога сердцем своим и себя боготворит, хотя того и не замечает. Ибо чем человеку хвалиться, который кроме грехов и немощи ничего не имеет? Разве что грехами? Но какая это похвала?! Это не похвала, а поношение.
      cn: 2) 上帝是一切良善的肇始和泉源，因此，唯祂理当因着良善而得荣耀和赞美。然而，当人因着良善而为自己寻求和渴望荣耀和赞美时，他便将自己如偶像般置于那本该是上帝所在之处的位置上，并且想要人将他，如偶像般赞美和荣耀，以取代上帝。因此，他的心便背离上帝，并将自己神化，尽管他自己并未察觉。因为人有什么可夸耀的呢？除了罪和软弱，他一无所有？难道是罪过吗？但那算什么赞美呢？！这不是赞美，而是羞辱。
  - type: paragraph
    text:
      ru: Видишь, какой яд сатанинский в тщеславии скрывается. Все, какие ни творит дела человек, тщеславие в одну мерзость и запустение обращает, подобно тому, как море все втекающие в него реки в сплошную соленость обращает. Это скверна духовная, которая нас пред Богом мерзкими творит. И настолько скрыт этот порок, насколько мерзок. От чувственных идолов и от прочих грехов удобно можем беречься, так как видим их, но от сего идола, который в сердце нашем гнездится, с великой неудобностью оберегается человек. Так сокровенно имеется он в сердце человеческом.
      cn: 你看，在虚荣中隐藏着何等撒旦的毒药。人所行的一切事工，虚荣都将其化为一片可憎的荒芜，如同大海将所有注入它的江河化为一片咸涩。这是一种属灵的污秽，使我们在上帝面前成为可憎的。这罪恶既是如此隐秘，又是如此可憎。我们能轻易地防备感官的偶像和其他罪恶，因为我们看得见它们；但是对于这盘踞在我们心中的偶像，人却难以防备。它如此深藏不露地存在于人的心中。
  - type: paragraph
    text:
      ru: Постараемся осматривать себя и в добрых делах наших, дабы не были они негодными пред Богом, и мы бы с ними непотребными не явились. Все, что ни творим, да будет во славу Божию и пользу ближнего нашего. Доброе дело от цели познается, а не от самого дела. Если цель добрая у доброго дела, то и дело доброе, а если цель злая, то и дело порочится, хотя бы и добрым казалось. Но надо сердце прежде исправить, чтобы о славе Божией, а не о своей замышляло, и о пользе ближнего; и тогда от правого сердца, как от доброго дерева добрые плоды, добрые дела происходить будут. Иисус, зерцало всех добродетелей и Помощник всем воздыхающим к Нему, да поможет нам.
      cn: 我们要努力省察自己，甚至在我们所行的善工中，以免它们在上帝面前不蒙悦纳，且我们也不因它们而被显为无益。我们所做的一切，都当为着上帝的荣耀，并为着我们邻人的益处。善工是凭着其目的而被认识的，而非凭着工作本身。如果一个善工的目的是良善的，那么这工作也是良善的；但如果目的是邪恶的，那么这工作就被玷污了，尽管它看起来是良善的。但我们首先要改正我们的心，使它所谋划的是为了上帝的荣耀，而非自己的荣耀，并为了邻人的益处；那么，从一颗正直的心，就像从一棵好树结出好果子一样，善工就会由此而生。耶稣，一切美德的镜鉴，也是一切向祂叹息之人的帮助者，愿祂帮助我们。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: как может человек сердце свое исправить?'
      cn: 你问道：人如何能修治自己的心？
  - type: paragraph
    text:
      ru: 'Ответ. Если хотим лицо наше исправным иметь, посматриваем в зеркало, исправно ли оно, и там усмотрев что-либо достойное порицания на лице, отираем или омываем. Так, когда хотим сердце наше исправить, чтобы правое было и правое замышляло, то должно нам в чистое зерцало жития Христова часто посматривать, и глядя в него, усматривать неправоту сердца нашего и исправлять ее. Правое же сердце то, которое всем отдает должное: Богу и Господу своему – послушание, и честь, и славу; ближнему же своему ищет и делает пользу, как себе. Да обращается же всегда перед душевными нашими глазами зерцало жития Христова: как Он обращался, живя на земле, и какие нравы показывал, более же всего смирение Его, которое настолько глубоко, насколько высоко величество Его. Это не попустит нам гордиться и славы и похвалы от людей искать.'
      cn: 回答。如果我们想让我们的面容端正，就照照镜子，看看它是否端正。若在脸上看到任何值得指摘之处，就擦掉或洗净。同样，当我们想修正我们的心，使它正直，并思量正直的事时，我们就当常常察看基督生平这面洁净的明镜，并藉着它，察觉我们心的不正之处，并加以修正。正直的心，就是将当得的都归于一切：向上帝和祂的主献上顺服、尊荣和荣耀；并为自己的近人寻求并成就益处，如同为自己一样。愿基督生平这面明镜，常在我们的灵魂之眼前回旋：祂如何在地上行事为人，祂展示了何种品德，尤其祂的谦卑，其深广程度，恰如祂的威严之崇高。这就不容许我们骄傲，也不容许我们寻求人的荣耀和赞美。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Хочешь знать, каковы признаки смирения?
      cn: 你想知道谦卑的特征是什么吗？
  - type: paragraph
    text:
      ru: Ответ. Я тебе некие признаки его, по силе моей, покажу, ты же испытывай сердце свое, поскольку смирение, как и всякая добродетель, должно быть в сердце.
      cn: 答。我将尽我所能，向你显示它的一些迹象，你当省察你的心，因为谦卑，如同一切美德一样，必须在心中。
  - type: paragraph
    text:
      ru: 'Свойство смирения в том, что человек считает себя недостойным всего: пищи, одеяния, света солнечного, покоя богатого, служения от людей и прочего благодеяния, зная, что он грешник; напротив того, судит себя быть достойным всякого бедствия, поношения и наказания. Это признак истинного смирения, которое в сердце есть. Почему? Потому что такой человек видит, что своими грехами прогневал благодетеля Своего, Бога, Которого должен был бояться, любить и почитать; и об этом рассуждая, видит свое недостоинство во всем и считает себя достойным всего наказания.'
      cn: 谦卑的特质在于，人认为自己不配得一切：食物、衣裳、阳光、丰裕的安息、他人的服事以及其他任何恩惠，因为他知道自己是罪人；相反地，他认为自己配得一切患难、羞辱和惩罚。这是心中真正谦卑的标志。为何如此？因为这样的人看到，他用自己的罪惹恼了他的施恩者上帝，这位上帝是他本应敬畏、爱慕和尊崇的；他思量着这一切，便看到自己在一切事上都不配，并且认为自己配得一切惩罚。
  - type: paragraph
    text:
      ru: Смирение подобно тому, что испытывает человек, который человека – благодетеля своего обесчестил и прогневал, но осознав свое согрешение и грубость к нему, судит себя быть недостойным благодеяния его, и хотя все еще получает от него благодеяние, однако же, памятуя свой грех, которым пред ним согрешил, признает себя недостойным благодеяния его. Так всякая душа, памятуя свои грехи пред Богом, почитает себя недостойной благодеяний Его, однако же не отчаивается в милости Его, благого и милосердного Отца, веруя несомненно милостивому Его обещанию. И отсюда видишь, какую силу имеет память о грехах и рассуждение о своем недостоинстве, чтобы обуздать гордость и поощрить к смирению. И воистину, чего человек, будучи грешником, сам по себе достоин, как только казни?
      cn: 谦卑犹如一个人所经历的，他羞辱并激怒了自己的恩主——他的施恩者，然而当他意识到自己对恩主的冒犯和粗暴后，便认为自己不配领受恩主的恩惠，即使他仍然从恩主那里领受恩惠，然而，他铭记自己在恩主面前所犯的罪，仍然承认自己不配领受恩主的恩惠。如此，每个灵魂铭记自己在上帝面前的罪，便认为自己不配领受祂的恩惠，然而，却不绝望于祂的怜悯，这位良善而慈悲的父，毫无疑问地相信祂怜悯的应许。由此可见，铭记罪过和思量自己的不配拥有何等力量，以克制骄傲并激励人走向谦卑。诚然，人作为罪人，本身除了刑罚，还能配得上什么呢？
  - type: paragraph
    text:
      ru: 'Все, что ни получает от Бога человек, пищу, одеяние, и прочие блага – даром, не по достоинству своему, но по одной только милости Его получает. Потому должен человек терпеть, когда Бог не подает Ему благ Своих, поскольку Бог не обидит Его. Подает ли нам Бог блага – Свои подает, даром; отнимает ли блага от нас – Свои отнимает, и отнимает праведно, и для нашей пользы, чтобы мы познали блага Его и Благодетеля от благ Его. Ибо тогда познаем блага, когда лишаемся благ: сколь великое добро хлеб, во время голода видим, сколь хорошо отменное здоровье, видим во время болезни. Пришедшая беда открывает нам глаза, и тогда познаем цену благополучия. И отсюда видим, сколь великий свет делает в душах наших крест и терпение бед, напастей и искушений. Истину эту признают те, которые это испытали на себе.'
      cn: 凡人所从上帝领受的一切，无论是食物、衣裳，以及其他恩惠，都是白白地，并非出于其自身的配得，而单单是凭着祂的慈悲领受的。因此人理当忍耐，当上帝不赐予其恩惠之时，因为上帝不会亏待他。上帝若赐予我们恩惠，是赐予祂自己的，白白的；若从我们收取恩惠，是收取祂自己的，并且是公义地收取，也是为了我们的益处，好使我们认识到祂的恩惠，并通过这些恩惠认识到施恩者。因为我们唯有在失去恩惠之时，才能认识到恩惠：饥荒之时，我们才能明白粮食是何等大的益处；疾病之时，我们才能明白卓绝的健康是何等美好。临到的祸患开启我们的双眼，于是我们才能认识到福祉的价值。从此我们看到，十字架以及忍耐苦难、灾祸与试探，在我们的灵魂中带来了何等大的光明。那些亲身经历过此事的人，才会承认这个真理。
  - type: paragraph
    text:
      ru: 'Видишь, возлюбленный, свойство смирения: оно всего недостойным себя судит быть. Если такое недостоинство в себе признаешь, то не захочешь славы, чести, богатства и похвалы в мире искать, не захочешь богатых домов, карет, коней заводить, богатых трапез устраивать, и богатыми одеждами одеваться, много слуг иметь, и прочее. Малого недостойным себя признает человек, так многого ли достойным признает?'
      cn: 你看，蒙爱者，这就是谦卑的特质：它认为自己不配得一切。如果你承认自己如此不配，那么你就不会想要在世上寻求荣耀、尊荣、财富和赞扬，不会想要置办豪华的房屋、马车、马匹，不会想要举办丰盛的筵席，穿戴华丽的衣裳，拥有许多仆人，等等。人若认为自己不配得最小的事物，那他会认为自己配得许多吗？
  - type: paragraph
    text:
      ru: Гордыня житейская всему подобному убранству учит людей, и те, которые и куска хлеба недостойными себя достойно признать должны, ищут, как бы в мире прославиться. И если признают себя достойными всего, то поистине ничего недостойны, и если ныне не узнают и не признают своего недостоинства, то тогда узнают, когда и жизни, и всех благ временных лишившись, будут вкушать смерть вечную и горести ее. Ибо сюда приводит гордость и нераскаянный нрав тех, которые благами Божиими обильно насыщаются, но Бога, благ Дателя, почитать не хотят. Рассуждай об этом и смирению, как пристанищу спасения, прилепляйся.
      cn: 俗世的骄傲教导人们追求一切类似的华丽装饰，而那些理应承认自己连一块面包也不配的人，却寻求如何在世上得荣耀。倘若他们自认为配得一切，那他们实在不配得任何东西；倘若他们如今不明白也不承认自己的不配，那么他们将在失去生命和一切暂时之福时，尝到永恒的死亡和它的苦楚。因为骄傲和那些不肯悔改的性情，使他们走向此处：这些人饱享上帝之恩福，却不愿尊崇上帝——那赐福者。思量此事，并紧紧依附谦卑，视其为救恩的避风港。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Что означают слова Спасителя нашего: «Иерусалим, Иерусалим, избивающий пророков и камнями побивающий посланных к тебе! сколько раз хотел Я собрать детей твоих, как птица собирает птенцов своих под крылья, и вы не захотели!» ( Мф 23:37 )?'
      cn: 我们的救主的话语意味着什么：「耶路撒冷，耶路撒冷，你杀害先知，又用石头打死奉差遣到你那里去的人！我多少次愿意聚集你的儿女，如同母鸡把小鸡聚集在翅膀底下，只是你们不愿意！」（马太福音 23:37）
  - type: paragraph
    text:
      ru: Ответ.
      cn: 答。
  - type: paragraph
    text:
      ru: '1) Повторение слова: «Иерусалим, Иерусалим» , означает великую любовь и сожаление Спасителя к городу сему, который Он хотел и старался всяким образом обратить к Богу, но который не восхотел того и все старание Его отринул. Поэтому плачевный глас, от любви сильной происходящий, обращает к нему и говорит: «Иерусалим, Иерусалим» , и прочее.'
      cn: 1) 圣言「耶路撒冷，耶路撒冷」的重复，意指救主对这城深切的爱与惋惜，他曾想尽一切办法使之归向上帝，但这城却不愿如此，并拒绝了他一切的努力。因此，这源自深沉之爱的哀痛之声，便转向这城并说：「耶路撒冷，耶路撒冷！」等等。
  - type: paragraph
    text:
      ru: 2) Из этого видим, какую и насколько горячую любовь имеет Бог к роду человеческому, как хочет и как бы алчет и жаждет спасения его. Господь уподобляет здесь Себя птице. Всякому известно, как птица малых своих птенцов любит, как хранит их, как печется, чтобы хищные птицы не похитили их, как кричит, когда видит находящую на них напасть, как во время бури и стужи собирает их под крылья свои и согревает их, как старается напитать их. Сама бедствует и страждет, только чтобы детей своих сохранить.
      cn: 2) 从中我们看到，上帝对人类所拥有的爱是何等炽热，祂是何等渴望，甚至饥渴于他们的救恩。主在此将自己比作一只鸟。众所周知，鸟儿是何等爱惜自己的雏鸟，何等守护它们，何等担忧它们被猛禽掠走，何等在发现它们遭遇患难时鸣叫，何等在暴风雨和严寒时将它们聚集在自己的翅膀下并温暖它们，何等努力地喂养它们。它自己忍受困苦与磨难，只为保全自己的幼雏。
  - type: paragraph
    text:
      ru: Так Бог милосердный и благой печется о нашем спасении. Создал нас из любви по образу и по подобию Своему, но мы погибли. Тогда подал нам Святое слово Свое и через него нас призывает к Себе; устрашает примерами казнь пострадавших, и геенной; привлекает милостивыми Своими обещаниями, чтобы обратились и пришли к Нему. Послал к нам пророков Своих, после и Сам пришел взыскать и спасти нас, погибших. И апостолов послал к нам и повелел им увещать и молить нас, чтобы мы обратились и примирились с Ним. Возбуждает учителей и пастырей к наставлению, просвещению и исправлению нашему. Подает пищу, питье, одежду и утешение; повелевает солнцу Своему сиять для нас и дожди нам посылает. Наказывает нас, чтобы, как бы от сна, от греха пробудившись, покаялись, и так спаслись; и прочие бесчисленные для спасения нашего изобретает средства. Так хочет нас, как птица, под крылья благости Своей собрать и вознести в вечные кровы отечества небесного.
      cn: 慈悲又良善的上帝如此眷顾我们的救赎。祂出于爱，按照祂的形象和样式创造了我们，但我们却灭亡了。于是，祂将祂的圣言赐予我们，并借着圣言召唤我们归向祂；以受刑罚之人的事例和欣嫩谷来警示我们；又以祂仁慈的应许吸引我们，好叫我们回转归向祂。祂差遣祂的先知来到我们这里，之后又亲自降临，来寻找和拯救我们这些失丧的人。祂也差遣使徒来到我们这里，并吩咐他们劝诫并恳求我们，好叫我们回转并与祂和好。祂兴起教师和牧者，以教导、光照和改正我们。祂赐予我们食物、饮水、衣裳和安慰；吩咐祂的太阳为我们照耀，并降雨给我们。祂惩戒我们，好叫我们仿佛从沉睡中，从罪恶中醒来，悔改，从而得救；又为我们的救赎发明了无数其他的方法。祂如此希望将我们如同母鸡聚集小鸡在翅膀下一般，聚集在祂恩慈的翅膀下，并将我们提升到天国永恒的居所。
  - type: paragraph
    text:
      ru: О, горячая любовь! О, огонь, который никогда не угасает, но всегда горит и согревает нас! «Иерусалим, Иерусалим, избивающий пророков и камнями побивающий посланных к тебе! сколько раз хотел Я собрать детей твоих, как птица собирает птенцов своих под крылья, и вы не захотели!»
      cn: 哦，炽热的爱！哦，永不熄灭的火焰，它总是燃烧着并温暖着我们！「耶路撒冷啊，耶路撒冷，你杀害先知，又用石头打死那奉差遣到你这里来的人！我多少次愿意聚集你的儿女，好像母鸡把小鸡聚集在翅膀底下，只是你们不愿意！」（马太福音 23:37）
  - type: paragraph
    text:
      ru: 'Дал им закон Свой, и не хотели хранить его. Явил им имя Свое знаменьями и чудесами различными: извел из Египта, из дома рабства, и провел пустыней; поразил пред ними народы многие и избил царей крепких; изгнал народы из земли обетованной и поселил их. И так в познание Себя и милости и благоволения Своего о них проводил их. Но не хотели Бога отцов своих познать, а обратились к идолам – делу рук человеческих. И тогда не оставил их Бог: послал пророков к ним, и избили их; и опять послал, и опять избили. Что еще было делать человеколюбцу Богу? Сам подвигнулся, Сам пришел, пророков избиенных Господь. Сам увещевал, Сам трудился и старался обратить их, но не восхотели.'
      cn: 祂赐给他们祂的律法，但他们不愿遵守。祂以各样异迹和奇事向他们彰显祂的名：将他们从埃及，从为奴之地领出，并领他们经过旷野；在他们面前击败了许多民族，并击杀了强盛的君王；将各民族从应许之地驱逐出去，并使他们住在那里。于是，祂引导他们，为要让他们认识祂自己，以及祂对他们的怜悯和恩惠。但他们不愿认识他们列祖的上帝，反而转向偶像——人手所造之物。即使那时，上帝也没有离弃他们：祂差派先知到他们那里，但他们击杀了先知们；祂又差派，他们又击杀了。爱好人类的上帝还能做什么呢？祂亲自感动，亲自降临，祂就是那位被击杀之先知的上主。祂亲自劝诫，亲自劳苦并竭力劝他们悔改，但他们仍不愿。
  - type: paragraph
    text:
      ru: Видишь, сколько средств ко спасению нашему изобретает Господь. Воистину дивна Божия благость! Поэтому скоро принимает обращающихся, и прощает, и милости Своей сподобляет.
      cn: 你看，主为我们的救赎发明了多少方法！诚然，上帝的良善何其奇妙！因此，祂迅速接纳悔改之人，并赦免他们，使他们配得祂的怜悯。
  - type: paragraph
    text:
      ru: '3) Видишь, каким дорогим почитает спасение наше Господь, как печется о нас Господь наш: Сам пришел собрать нас под крылья благости Своей. Горе нам, если мы не хотим и не печемся о себе, и не спешим прибегнуть и сокрыться под кровом крыльев Его, как Иудеи не хотели.'
      cn: 3) 你看，上主是何等珍视我们的救恩，我们的上主是何等眷顾我们：祂亲自降临，要将我们聚集在祂恩慈的羽翼之下。祸哉！我们，若我们不愿意、不顾惜自己，也不急于奔赴并藏身于祂羽翼的庇护之下，如同犹太人所不愿的。
  - type: paragraph
    text:
      ru: 4) Видишь, как любит Господь наш спасение наше и печется о нем. Должно и нам любить славу и честь имени Его, и искать ее во всяких делах наших, и наблюдать в деле, слове и помышлении. Он спасения нашего ищет и вечной славы для нас, – поищем и мы славы и чести имени Господа нашего! Он хочет Себе присвоить нас, – пожелаем и мы Его единого, и кроме Него ничего, ни на земле, ни на небесах! Да будет Он един уделом нашим вовеки!
      cn: 4) 你看，我们的主何等爱我们的救恩，并为之眷顾。我们也当爱祂名的荣耀和尊崇，并在我们一切的行事中寻求它，在行为、言语和意念中谨守它。祂寻求我们的救恩和为我们预备的永恒荣耀——我们也当寻求我们主之名的荣耀和尊崇！祂愿意将我们归为己有——我们也当唯独愿望祂，除了祂别无他物，无论在地上，还是在天上！愿祂唯独成为我们直到永远的份！
  - type: paragraph
    text:
      ru: '5) Печется Господь наш о нас, – попечемся и мы друг о друге и поищем друг другу спасения: иной советом, иной наставлением, иной молитвой, иной иным, да будем истинными членами тела Его духовного, ибо члены телесные друг о друге пекутся и друг друга берегут. Сатана и бесы его, все согласно вооружаются на нас и хотят нас погубить, ибо это их дело и тщание. Воспротивимся же и мы им единодушно и станем друг за друга, чтобы быть крепче и одолеть их. «Господь Сил с нами, заступник наш Бог Иакова» .'
      cn: 5) 我们的上主顾念我们，我们也当彼此顾念，并且彼此寻求救恩：或以建议，或以教诲，或以祷告，或以其他方式，以便我们成为祂属灵身体的真正肢体，因为身体的肢体彼此顾念，也彼此看护。撒但和他的邪魔，都一致地起来攻击我们，并且企图毁灭我们，因为这是他们的作为和企图。那么，我们也要同心合意地抵挡他们，并且彼此扶持，以便我们更坚强，并战胜他们。「万军之主与我们同在，雅各的上帝是我们的庇护。」
  - type: paragraph
    text:
      ru: 6) Такое Господа нашего попечение о нас да подвигнет пастырей, и поощрит к бдению о стаде Христовом, чтобы от волков тех хранить его. Ибо на то и поставляются пастыри, – чтобы пасти. Господь, пастырей Начальник, да поможет им.
      cn: 6) 我们上主如此对我们的看顾，愿能激励牧者们，并促使他们警醒看顾基督的羊群，以防备那些豺狼。因为牧者之所以被设立，正是为了牧养。上主，众牧者的首领，愿祢帮助他们。
  - type: paragraph
    text:
      ru: '7) Послушаем, что далее, после жалостных тех слов, говорит иудеям Господь: «Се, оставляется вам дом ваш пуст» ( Мф 23:38 ). Хотел их собрать под крылья защиты Своей и спасения премилосердный Иисус, но не хотели. Потому и остались в запустении и заблуждении и погибели, как и были. Без Иисуса нет никому спасения; всякий подлежит вечному осуждению, кого Иисус не защитит. Ибо «гнев Божий пребывает на нем» ( Ин 3:36 ).'
      cn: 7) 让我们听听，在说了那些悲悯之言后，主接下来对犹太人说了什么：「看哪，你们的家将要被撇下荒凉了」（马太福音 23:38）。极其仁慈的耶稣本想把他们聚集在祂护庇和救恩的翅膀下，但他们却不愿。因此他们就继续处于荒芜、迷失和灭亡之中，正如他们素来所是的。没有耶稣，没有人能得救；凡耶稣不加护佑的，都将遭受永恒的定罪。因为「上帝的愤怒常在他身上」（约翰福音 3:36）。
  - type: paragraph
    text:
      ru: 'Прибегнем, возлюбленный, верой ко Иисусу, дабы покрыл нас кровом крыльев Своих от грядущего гнева. Прибегнем, пока зовет и обещает нам милость Свою, дабы и нам не сказал Он: «Се, оставляется вам дом ваш пуст» . Тот же Иисус, Который ныне зовет к Себе всех, в день суда отошлет от Себя тех, кто не захотел к Нему прийти: «Идите от Меня, проклятые, в огонь вечный, уготованный диаволу и ангелам его» ( Мф 25:41 ). Страшно слово сие: «идите от Меня, -» страшно и идти в огонь вечный. О, Иисусе! Не допусти нас до того.'
      cn: 蒙爱者啊，让我们借着信心投靠耶稣，好使祂以其翅膀之荫庇覆盖我们，免受那将临的忿怒。让我们投奔祂，趁着祂呼唤我们并应许祂的怜悯，好使祂不至于对我们说：「看哪，你们的家将要荒凉。」同是一位耶稣，那如今呼唤众人归向祂的，在审判之日，会将那些不愿归向祂的人从祂面前打发走，说：「你们这些被咒诅的人，离开我，进入那为魔鬼和它的使者所预备的永火里去。」（马太福音 25:41）这话语何等可畏：「离开我——」，进入永火也何等可畏。哦，耶稣！求祢不要让我们遭遇那事。
  - type: paragraph
    text:
      ru: Поминай это слово, возлюбленный, и обо мне молись.
      cn: 挚爱的，谨记这句话，并为我祈祷。
  - type: paragraph
    text:
      ru: Спасайся благодатью Иисуса.
      cn: 藉着耶稣的恩典得救吧。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: как приняли иудеи Мессию, Господа нашего?'
      cn: 你问道：犹太人是如何接纳我们的主弥赛亚的呢？
  - type: paragraph
    text:
      ru: 'Ответ. Это всем христианам знать должно, потому и тебе не должно было об этом вопрошать. Однако я тебе в ответ слово святого евангелиста представляю. Он с удивлением, или даже с сожалением, всему миру говорит: «Пришел к своим, и свои Его не приняли» ( Ин 1:11 ).'
      cn: '回答。


        这是所有基督徒都当知晓的，所以你本不该问及此事。然而，我给你作答时，呈现圣福音传扬者的话语。他带着惊奇，甚至带着遗憾，对全世界说：「祂来到自己的地方，自己的人却不接纳祂。」（约翰福音 1:11）'
  - type: paragraph
    text:
      ru: 'Примечай здесь, возлюбленный, кто и Кого не приняли. Подданные Царя своего, рабы Господа своего, люди Бога своего, во плоти к ним пришедшего, создание Создателя своего, пришедшего спасти их, не приняли, говоря: «Не хотим, чтобы он царствовал над нами» ( Лк 19:14 ). Дивно и странно было бы, когда бы царя земного граждане его не приняли. Но то особенно достойно удивления, что Царя Небесного не приняли те, которые Его ожидали, которым Он пророками проповедан был, которые видели, как Он мертвых воскрешал, прокаженных очищал и прочие преславные чудеса творил. «Израильтянам принадлежат усыновление и слава, и заветы, и законоположение, и богослужение, и обетования; их и отцы, и от них Христос по плоти, сущий над всем Бог, благословенный во веки, аминь, -» пишет святой Павел ( Рим 9:4–5 ). К ним, к своим пришел, «и свои Его не приняли» .'
      cn: 在此请留意，我亲爱的，是谁没有接纳上帝，又是谁不接纳祂。他们的君王的臣民，他们的上主的仆人，他们的上帝的百姓，他们的造物主的受造物——那位以肉身降临于他们中间、前来拯救他们的——竟然没有接纳祂，反而说：「我们不愿这个人作我们的王！」（路加福音 19:14）。如果一位地上的君王不被他的公民所接纳，这都已是令人惊奇且奇怪的事了。但更尤其值得惊奇的是，天上的君王竟不被那些等候祂的人所接纳——祂曾被先知们传扬给他们，他们也曾亲眼看见祂使死人复活，洁净麻风病人，并施行其他诸多荣耀的奇迹。「属乎以色列人的有儿子的名分、和荣耀、和诸约、和律法、和礼仪、和应许。他们的祖宗也是他们的；按肉身说，基督也是从他们出来的。祂是万有之上永远受颂赞的上帝，阿们。」——圣保罗写道（罗马书 9:4-5）。祂来到自己的人那里，「自己的人却不接纳祂。」
  - type: paragraph
    text:
      ru: 'Примем мы Его, возлюбленный, поскольку и мы свои Ему: Он наш Создатель, мы создание Его; Он наш Бог, мы люди Его; Он наш Господь, мы рабы Его; Он наш Царь, мы подданные Его; Он наш питатель, мы питомцы Его; Он наш Благодетель, мы благодетельствуемые от Него; Он наш Пастырь, мы заблудшие овцы Его; Он наш Искупитель, мы искупление Его; Он наш Стяжатель, мы стяжание Его. Познаем Его, как Создателя, Бога, Господа, Царя, Благодетеля, Искупителя, Стяжателя и Пастыря нашего. Познаем, «что Он есть Бог наш, Он сотворил нас, а не мы. Мы же народ Его и овцы паствы Его» ( Пс 99:3 ). Он к нам и ради нас пришел, и ныне посещает и приходит к нам, и говорит: «Се, стою у двери и стучу: если кто услышит голос Мой и отворит дверь, войду к нему, и буду вечерять с ним, и он со Мною» ( Откр 3:20 ).'
      cn: 亲爱的，我们要接纳祂，因为我们也属于祂：祂是我们的创造主，我们是祂的受造物；祂是我们的上帝，我们是祂的子民；祂是我们的主，我们是祂的仆人；祂是我们的君王，我们是祂的臣民；祂是我们的供养者，我们是祂的受供养者；祂是我们的施恩者，我们是祂的受恩者；祂是我们的牧者，我们是祂迷失的羊；祂是我们的救赎主，我们是祂所救赎的；祂是我们的拥有者，我们是祂的产业。让我们认识祂是我们的创造主、上帝、主、君王、施恩者、救赎主、拥有者和牧者。让我们认识，「祂是我们的上帝，是祂造了我们，而不是我们自己。我们是祂的子民，也是祂牧场的羊」（诗篇 99:3）。祂来到我们中间，也是为了我们，现在仍然探访并来到我们这里，祂说：「看哪，我站在门外叩门：若有人听见我的声音就开门，我将进到他那里，我与他一同坐席，他也与我一同」（启示录 3:20）。
  - type: paragraph
    text:
      ru: Примем сего превожделейного Гостя, пророками проповеданного и во всем мире ожидаемого. Примем Того, Которого «цари, пророки и праведники желали видеть, и не видели, и слышать, и не слышали» ( Мф 13:17 ; Лк 10:24 ). Примем Пришедшего к нам и ради нас в мир, и послужим Ему, как Царю нашему, с радостью, да услышим от Него слова вечной жизни, и будут для нас слова Его, как вечеря пресладкая. И тогда «вкусим, сколь благ Господь» ( Пс 33:9 ), и сколь сладки слова Его. Поклонимся и припадем к Нему, и отдадим себя Ему, и присвоимся Ему, да будем Его и по имени и по сути. И тогда Он будет нашим Заступником, Помощником, Учителем и Пастырем, и никто нас от руки Его не восхитит, потому что крепка рука Его. Поминай Господа Иисуса, пришедшего в мир спасти нас, – тебя и меня, и всякого.
      cn: 让我们接纳这位至为可慕的客人，祂是众先知所宣讲、并为全世界所期盼的。让我们接纳那一位，「君王、先知和义人曾切望看见却没有看见，切望听见却没有听见」（马太福音 13:17，路加福音 10:24）。让我们接纳这位为我们、且为我们的缘故降临世间的祂，并要带着喜乐服事祂，如同服事我们的君王，好使我们能从祂那里听闻永生之道，祂的话语将为我们如同极其甘美的晚筵。那时，我们将「尝尝上主何等美善」（诗篇 33:9），并尝到祂的话语何等甘甜。让我们敬拜并俯伏在祂面前，并将我们自己献给祂，且与祂相属，好使我们无论在名分上或本质上都属祂。那时祂将是我们的护慰者、帮助者、教师和牧者，也没有人能将我们从祂手中夺去，因为祂的手是刚强的。当记念降世为要拯救我们的主耶稣——你和我，以及每一个人。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Ты пишешь: «Ведь все христиане приняли Христа, потому и христианами называются, как же Его принимать еще?».'
      cn: 「毕竟，所有基督徒都已接受了基督，所以才被称为基督徒，那么，又当如何继续接受祂呢？」
  - type: paragraph
    text:
      ru: 'Ответ. Так почти все христиане нынешнего века думают и льстят себе, что достаточно им исповедовать Христа, и потому в прочем, что ни делают, не смотрят ни на что и не рассуждают. Все принимают и исповедуют Христа, но мало кто слушается Христа. Теперь видишь, как принимают Христа! Так все «имеют вид благочестия, силы же Его отрекаются» ( 2Тим 3:5 ); «говорят, что знают Бога, а делами отрекаются» от Него ( Тит 1:16 ). Так с иудеями, хотя не устами, но делами и непослушанием отвергают Христа: «Не хотим, чтобы он царствовал над нами» ( Лк 19:14 ).'
      cn: 答。现今几乎所有基督徒都如此思想，并自欺说，他们只要承认基督就足够了，所以在其余所做的一切事上，毫不在意，也毫不省察。所有人都接受并承认基督，但很少有人听从基督。现在你看到他们是如何接受基督的了！如此，所有人都「有敬虔的外貌，却背弃了敬虔的实意」（2提摩太书 3:5）；「他们宣称认识上帝，却在行为上背弃祂」（提多书 1:16）。如此，他们与犹太人一样，虽非口头，却以行为和不顺从弃绝基督，说：「我们不要这个人作我们的王！」（路加福音 19:14）。
  - type: paragraph
    text:
      ru: 'Ибо, кто не слушает царя и закона его не хранит, тот отвергает царя. Какой это раб, если не повинуется господину своему? Раба верного показывает не звание учтивое: «Господи, Господи! -» но повиновение и послушание, не имя и титул один, но дело и исполнение воли господина. Потому и говорит Господь таковым христианам: «Что вы зовете Меня: Господи! Господи! – и не делаете того, что Я говорю» ( Лк 6:46 )? То же и другое слово Господне значит: «Кто не со Мною, тот против Меня» ( Лк 11:23 ). Как ни толкуй и ни превращай, оно колет глаза нынешних христиан: оно, как зеркало представляет им неправду их, показывает им, что они, хотя и исповедуют Христа, но жизнью своей противятся Христу.'
      cn: 因为，凡不听从君王且不遵守其律法者，就是弃绝君王。这是何等样的奴仆，若不顺从其主人？忠心的奴仆所彰显的，并非客气的称呼：「主啊，主啊！」而是顺从与听命，并非单单是名号与称谓，而是行为和对主人旨意的遵行。因此上主对这样的基督徒说：「你们为什么称呼我：主啊！主啊！却不遵行我所说的呢？」( 路加福音 6:46) 上主另一个相同意思的话语是：「凡不与我同在的，就是反对我的。」( 路加福音 11:23) 无论怎样解释或曲解，这话语都刺痛了现今基督徒的眼睛：它如同一面镜子，向他们呈现他们的不义，向他们显明，他们虽然承认基督，却在自己的生活中抵挡基督。
  - type: paragraph
    text:
      ru: 'Противник Христов не только тот, кто учением слову Его противится, но и тот, кто жизнью слову Его сопротивляется. У многих христиан то только на уме, о том только мысль, попечение и старание, как бы богатство собрать, в честь прийти, славу получить, врагу отомстить, дни в веселостях провождать, ближнего обмануть, и прочее. А как бы Христу, пришедшему спасти их, угодить и последовать святому житию Его, о том и мысли нет. Но Павел святой говорит: «В вас должны быть те же чувствования, какие и во Христе Иисусе» ( Флп 2:5 ). Это христианам говорится, а не иудеям и язычникам, которые и устами отвергают Христа.'
      cn: 基督的反对者，不仅是那些在教义上抵挡祂话语的人，也是那些在生活中抵制祂话语的人。许多基督徒心中所思、所虑、所尽心竭力追求的，无非是如何积聚财富、获得尊荣、赢得名声、向仇敌复仇、在欢愉中度日、欺骗近人，等等。至于如何取悦前来拯救他们的基督，并追随祂的圣善生活，他们却丝毫未曾思及。然而圣徒保罗说：「你们当以基督耶稣的心为心。」（腓立比书 2:5）。这话是对基督徒说的，而不是对犹太人和外邦人说的，他们甚至口头也拒绝基督。
  - type: paragraph
    text:
      ru: 'Малое стадо составляют истинно принимающие Христа. К ним говорит Христос: «Не бойся, малое стадо! ибо Отец ваш благоволил дать вам Царство» ( Лк 12:32 ). К прочим говорит: «Что вы зовете Меня: Господи! Господи! – и не делаете того, что Я говорю» ( Лк 6:46 )? И в последний день отвечает им: «Я никогда не знал вас; отойдите от Меня, делающие беззаконие» ( Мф 7:23 ). Поэтому апостол всякому христианину говорит: «Да отступит от неправды всякий, исповедующий имя Господа» ( 2Тим 2:19 ).'
      cn: 真正接受基督的，乃是小群羊。基督对他们说：「不要惧怕，小群羊啊！因为你们的父乐意把国赐给你们」（路加福音 12:32）。对其余的人，祂说：「你们为什么称呼我：主啊！主啊！却不遵行我所说的呢？」（路加福音 6:46）。又在末日，祂回答他们：「我从来不认识你们；你们这些作恶的，离开我吧！」（马太福音 7:23）。所以，使徒对每个基督徒说：「凡称呼主名的，总要离开不义」（提摩太后书 2:19）。
  - type: paragraph
    text:
      ru: 'Принять Христа и не любить Христа есть противоречие, это то же самое, что и не принять. Пришел Он не ради Себя в мир, но ради нас. Рассуждай об этом и отсюда увидишь, как высоко Он почтил нас. Ради нас пришел Господь наш. Мы рабы Его непотребные, но Он не презрел нас. Видишь, что есть Христос для нас: наш Господь и Спаситель. Потому требуется от нас к Нему любовь, чтобы возлюбить явление Его и с любовью принять Его, как Господа и Благодетеля великого, а от этого последует и послушание к Нему.'
      cn: 接受基督却不爱基督，这是一个矛盾，这与不接受祂并无二致。祂降世，并非为祂自己，而是为了我们。思量于此，你就会由此看出祂是如何地尊崇我们。我们的主是为了我们而降世的。我们是祂不配的仆人，但祂并未藐视我们。你看，基督对我们而言是什么：是我们的主和救主。因此，要求我们对祂有爱，以爱祂的降临，并以爱心接受祂，视祂为伟大的主和恩主，由此便将随之而来对祂的顺服。
  - type: paragraph
    text:
      ru: Он, наш Царь, пришел к нам, – с честью, смирением и любовью примем Его. Он, наш Господь, пришел к нам, – со страхом и любовью послужим Ему. Он, наш Пастырь, пришел к нам, – послушаемся гласа Его. Он, наш Учитель и Наставник, пришел к нам, – да будем повиноваться святому слову Его и наставлению. Он, нас Любящий и Благодетель, пришел к нам, – да будем благодарны Ему и заповеди Его святые с любовью сохраним.
      cn: 祂，我们的君王，临到我们——当怀着尊崇、谦卑和爱来迎接祂。祂，我们的主，临到我们——当怀着敬畏和爱来事奉祂。祂，我们的牧者，临到我们——当听从祂的声音。祂，我们的教师和导师，临到我们——当顺从祂的圣言和训诲。祂，爱我们的和施恩者，临到我们——当感谢祂，并怀着爱心持守祂的圣诫。
  - type: paragraph
    text:
      ru: 'Примем же Его не только устами, но и сердцами, да вообразится в нас, то есть в душах наших, прекрасный образ Его. Он всегда стучит в двери сердец наших, да отверзем Ему, чтобы, войдя, почил в душах наших, и да омоем и отрем святые ноги Его, ради нас по земле ходившие, – и обитель в нас сотворит. Да не услышим никогда от Него: «Алкал Я, и вы не дали Мне есть; жаждал, и вы не напоили Меня; был странником, и не приняли Меня» ( Мф 25:42–43 ). Нигде, как только в душе человеческой Он упокоевается: в душах наших обретает и дом, и покой, и пищу, и питье. Поэтому всегда стучит, чтобы прийти к нам. Примем же Его и впустим внутрь нас. Ибо и нам нет покоя, кроме Него. Он наша пища, питье, одежда, покой, утешение и вечная наша жизнь. Кроме и без Него душа мертва и нага, и никакого пристанища не имеет. Украсим же дома душ наших, чтобы принять Царя Небесного, явившегося на земле и пожившего на ней ради нас. Стыдно отказать и не пустить в дом честного человека, а тем более Царя, и Царя Небесного, стучащегося в двери наши. Друг другу своему открывает дом и с радостью принимает его: Он же вернейший друг наш, возлюбивший нас – врагов Своих и душу Свою за нас положивший, и хочет нас ввести в небесный кров Свой. Слава Его милосердию, что Он не гнушается нами! Поминай сие милосердие Его.'
      cn: 我们这就接纳祂吧，不仅用我们的口，也用我们的心，好让祂那美好的形象在我们里面，也就是在我们的灵魂中成形。祂总是在叩击我们心扉的门，愿我们向祂敞开，好让祂进入，安歇在我们的灵魂中，愿我们洗涤并擦干祂那圣洁的脚——这双脚曾为我们行走于地上——并在我们里面建造居所。愿我们永远不要从祂那里听到：「我饿了，你们没有给我吃；我渴了，你们没有给我喝；我作客旅，你们没有收留我。」(马太福音 25:42-43) 除了在人的灵魂中，祂无处安息：在我们的灵魂中，祂找到了家、安息、食物和饮水。因此，祂总是在叩击，为要来到我们这里。我们这就接纳祂，并让祂进入我们里面吧。因为除了祂，我们也没有安息。祂是我们的食物、饮水、衣裳、安息、慰藉，以及我们永恒的生命。离了祂，没有祂，灵魂就是死的、赤裸的，并且没有任何栖身之所。我们这就装饰我们灵魂的殿宇吧，好迎接那位从天而降的君王，祂曾为我们显现于地上，并居于其上。拒绝一个正直的人，不让他进家门，是可耻的；更何况是一位君王，一位天上的君王，正叩击我们的门呢。朋友向朋友敞开家门，并欣然接纳他；而祂却是我们最忠实的朋友，爱了我们——祂的仇敌，并为我们舍弃了自己的灵魂，而且希望将我们引入祂天上的居所。赞美祂的慈悲，因为祂不厌弃我们！要记念祂的这慈悲。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Как поступили иудеи с Иисусом, не приняв Господа нашего, пришедшего спасти их?
      cn: 犹太人是如何对待耶稣的，他们没有接受来拯救他们的我们的上主？
  - type: paragraph
    text:
      ru: 'Ответ. Господь, поскольку пришел в мир грешников спасти, то и не гнушался грешниками, но с ними человеколюбиво и милостиво обращался, и их принимал, и с мытарями и прочими грешниками ел, желая их призвать к покаянию, как и Сам Он сказал: «Я пришел призвать не праведников, но грешников к покаянию» ( Мф 9:13 ). Книжники и фарисеи, которые особенно противились Ему, роптали и укоряли Господа, говоря: «Он принимает грешников и ест с ними» ( Лк 15:2 ). И еще: «Он зашел к грешному человеку» ( Лк 19:7 ). И еще «сказали ученикам Его: для чего Учитель ваш ест и пьет с мытарями и грешниками? -» и прочее. Но Господь им кротко ответствовал: «Не здоровые имеют нужду во враче, но больные, пойдите, научитесь, что значит: милости хочу, а не жертвы ? Ибо Я пришел призвать не праведников, но грешников к покаянию» ( Мф 9:11–13 ).'
      cn: 答。主，因为降世为要拯救罪人，所以不厌弃罪人，反倒以仁爱和怜悯待他们，并接纳他们，也与税吏和其余的罪人一同吃饭，愿召他们悔改，正如祂自己所说：「我来不是召义人，乃是召罪人悔改。」（马太福音 9:13）文士和法利赛人，他们尤其与祂作对，就抱怨并指责主，说：「这个人接待罪人，又与他们一同吃饭。」（路加福音 15:2）又说：「祂竟然进到罪人家里去住。」（路加福音 19:7）又对祂的门徒说：「你们的老师为什么和税吏并罪人一同吃喝呢？」等等。但主温和地回答他们说：「康健的人用不着医生，有病的人才用得着。你们去考察『我喜爱怜悯，不喜爱祭祀』是什么意思。因为我来不是召义人，乃是召罪人悔改。」（马太福音 9:11-13）
  - type: paragraph
    text:
      ru: 'Видим мы здесь:'
      cn: 我们在这里看到：
  - type: paragraph
    text:
      ru: 1) Как ради нас пришел в мир Господь наш, так ради нас роптание и укорение претерпел от врагов Своих. Нас совесть наша и враги наши демоны как преступников закона Божия укоряли, а Христос Господь наш претерпел укорение неправедное, чтобы нас избавить от того укорения. Слава милосердию Его и долготерпению!
      cn: 我们的主如何为我们降世，祂也同样为我们忍受了仇敌的抱怨和指责。我们的良心和我们的仇敌——邪魔——指责我们是上帝律法的犯者，然而我们的主基督忍受了不义的指责，以便将我们从那指责中解脱出来。荣耀归于祂的怜悯和恒忍！
  - type: paragraph
    text:
      ru: 2) Истинные пастыри, которые, следуя Христу, Начальнику пастырей, не гнушаются явными грешниками, но с ними обходятся человеколюбиво и стараются их обратить к покаянию, подлежат укорению и поношению злых людей. Ибо на них наиболее восставляет сатана гонение и злобных людей научает бесчестить их, так как они словом Божиим разрушают мрачное царство его, о чем многие истории свидетельствуют. Ты берегись худое что говорить о пастырях и слуха злого о них не приемли, чтобы с фарисеями не осудиться.
      cn: 2) 真正的牧者，他们效法基督，就是牧者之首，不嫌弃那些公然的罪人，反而以仁爱之心对待他们，并努力使他们悔改。然而，他们却要遭受恶人的责备和毁谤。因为撒但最要煽动对他们的迫害，并教唆恶人羞辱他们，只因他们借着上帝的圣言摧毁了它黑暗的国度。对此，许多史料都作证。你当提防对牧者说任何恶言，也不要接受任何关于他们的恶语流言，免得你与法利赛人一同被定罪。
  - type: paragraph
    text:
      ru: 3) Господь наш укоряем был, но Сам не укорял. Этим Он учит нас кротко и терпеливо с врагами нашими обходиться, укоряющих не укорять и злословящих не злословить, но или молчать, или без гнева и с кротостью праведно отвечать. Если Господь наш, будучи безгрешным, в ответ на укорение не укорял, то тем более мы, рабы Его и грешники, так поступать и Господу нашему подражать должны.
      cn: 3) 我们的主被指责，但祂自己却不指责人。借此祂教导我们，当谦和忍耐地对待我们的仇敌，不指责那指责我们的人，也不咒骂那咒骂我们的人；而要保持沉默，或不带怒气并谦和地正直回应。如果我们的主，祂本是无罪的，在回应指责时尚且不指责人，那么我们这些祂的仆役和罪人，更当如此行事并效法我们的主。
  - type: paragraph
    text:
      ru: '4) Видим, как благосклонен был Господь наш к грешникам: будучи «един свят» и праведен, обращался между грешниками и видел совесть каждого, что у кого в сердце было и какие грехи каждый имел: «И не имел нужды, чтобы кто засвидетельствовал о человеке, ибо Сам знал, что в человеке» ( Ин 2:25 ). Однако никого не посрамил, и не обличил, и не осудил. Мы, хотя и сами грешные и всяким грехам подлежим, однако же часто укоряем, и обличаем, и судим: «ты такой и сякой», – говорим. Господь так не поступал, хотя и безгрешен был. Ибо пришел не судить и обличать, но спасти нас, и даже на явную грешницу, «взятую в прелюбодеянии» и приведенную к Нему обличителями, не хотел суда произнести, но сказал только ей: «И Я не осуждаю тебя; иди и впредь не греши» ( Ин 8:11 ).'
      cn: 4) 我们可以看到我们的主对罪人是多么仁慈：祂本是「唯一圣洁」而公义的，却行走在罪人中间，洞察每个人的良心，知道每个人心中有什么，犯了什么罪：「祂不需要任何人为人作见证，因为祂自己知道人心里所存的。」 （约翰福音 2:25） 然而，祂却从未使任何人蒙羞，也未责备，也未定罪。我们自己虽然也是罪人，并容易犯各种罪，然而却常常指责，和责骂，和论断：我们说：「你这个人这样又那样。」 主却不是这样行事，尽管祂是无罪的。因为祂来不是为了审判和责备，而是为了拯救我们，甚至对于一个显而易见的罪妇，「在行淫时被抓的」，并被那些指控者带到祂面前的，祂也不愿作出审判，只是对她说：「我也不定你的罪；你去吧，从今以后不要再犯罪了。」 （约翰福音 8:11）
  - type: paragraph
    text:
      ru: '5) От словес Христовых: «Не здоровые имеют нужду во враче, но больные, -» видим, кого Христос Господь врачует, то есть болящего. Все люди болеют душой, но не все признают болезнь свою, не ищут исцеления, потому и не исцеляются. Таковы были книжники и фарисеи, которые себя здоровыми считали и называли, хотя более прочих немощными были, поэтому и остались в своей прежней болезни, и даже в горшей. Ибо болезнь неисцеленная, чем более продолжается, тем горше и страшнее бывает. Поэтому, если хотим исцелить нашу душу, надо нам узнать и признать болезнь ее, и у Христа-врача просить исцеления. Тело исцеляют и лекари – люди, но души никто не может исцелить, кроме Христа. Он один может исцелить и исцеляет души. Поэтому должно к Нему одному прибегать, и Ему объявлять болезнь, и просить у Него исцеления. Нет же такой болезни, которой бы не мог и не хотел исцелить Он, Который и мертвых воскрешает, и прокаженных очищает, и от природы слепым очи подает. Ибо на то и пришел в мир, чтобы души наши исцелить.'
      cn: 5) 从基督的言语：「康健的不用医生，有病的才用得着，——」我们看到基督上主医治的是谁，即患病之人。所有人的灵魂都患病，但并非所有人都承认自己的病症，不寻求医治，所以也得不到医治。文士和法利赛人就是如此，他们自以为是健康的，也如此称呼自己，尽管他们比其他人更加软弱，因此他们留在了自己原先的病症中，甚至变得更糟。因为未得医治的病症，持续得越久，就越发糟糕和可怕。因此，如果我们想要医治我们的灵魂，我们需要认识并承认它的病症，并向基督这位医师恳求医治。肉身可以由医师——人——来医治，但除了基督，没有人能够医治灵魂。唯有祂能医治并医治灵魂。因此，我们当只投靠祂，向祂申明病症，并向祂恳求医治。没有任何病症是祂不能医治或不愿医治的，祂使死人复活，洁净麻风病人，并赐给生来瞎眼之人光明。因为祂来到世上，正是为了医治我们的灵魂。
  - type: paragraph
    text:
      ru: '6) Из приведенного слова Божия: «Милости хочу, а не жертвы, -» видим, что Богу наиболее приятно, а именно, – милость, оказываемая нами ближнему. Не отвергает Бог и жертвы, но всякой жертве предпочитает милость, ближнему творимую, так как Сам милостив. Поэтому, кто творит милость ближнему, тот подражает Ему и так приносит Ему жертву, которая лучше всякой другой жертвы. Ибо ничто так Богу не приятно, как подражание Ему (милосердием). Поэтому Христос говорит: «Будьте милосерды, как и Отец ваш милосерд» ( Лк 6:36 ). И апостол увещевает нас: «Не забывайте также благотворения и общительности» (т. е. подаяния, милостыни), «ибо таковые жертвы благоугодны Богу» ( Евр 13:16 ).'
      cn: 6) 从所引的上帝之话语：「我喜爱怜悯，不喜爱祭祀，—」中，我们看到，对上帝而言最为愉悦的，即是我们向邻人所施的怜悯。上帝并不拒绝献祭，但祂看重向邻人所施行的怜悯，胜过任何祭祀，因为祂自己就是怜悯的。因此，凡向邻人施行怜悯者，就是效法祂，并因此向祂献上胜过任何其他献祭的祭物。因为没有什么比借着怜悯效法祂更令上帝愉悦的了。因此，基督说：「你们要怜悯，像你们的父怜悯一样」（路加福音 6:36）。使徒也劝勉我们：「不可忘记行善和分享（即，施予、施舍），因为这样的献祭是蒙上帝悦纳的」（希伯来书 13:16）。
  - type: paragraph
    text:
      ru: 'Богу приятнее услышать и принять милостыню, ближнему творимую, нежели молитву, песнь и хвалу, Ему приносимую. Да и что может молитва без милостыни? Она подобна голосу без силы. Милостыня сама собой молится более, нежели все люди. Без милости нашей к ближнему все наши дела негодны, как дерево без плодов. Нет же большей милости, как грешника увещать и обратить на путь покаяния. Поэтому Христос, Господь наш, ради нас и в мир пришел, и обращался с грешниками, чтобы их обратить на путь истинный, и нас примером Своим учит, что и все христиане, и особенно пастыри, которые на то и избираются, должны делать, чтобы быть едиными духом и мыслью со Христом: В них «должны быть те же чувствования, какие и во Христе Иисусе» ( Флп 2:5 ).'
      cn: 上帝更喜悦听闻并接受施予邻人的怜恤，甚于献给祂的祷告、诗歌与颂赞。况且没有怜恤，祷告又能如何呢？它如同没有力量的声音。怜恤本身更能祈祷，胜过所有人的祈祷。若我们对邻人没有怜悯，我们所有的作为都是不中用的，如同没有果子的树。没有比劝戒罪人并使他归向悔改之路更大的怜悯了。因此，我们的主基督为我们来到世上，并与罪人往来，为要使他们归向真道，又以祂的榜样教导我们：所有基督徒，尤其是牧者——他们正是为此被拣选的——都当如此行，好使他们与基督在精神和思想上合一：在他们里面「应当有与基督耶稣相同的意念」（腓立比书 2:5）。
  - type: paragraph
    text:
      ru: Рассуждай об этом, возлюбленный, и старайся таким (милостивым) быть по отношению к ближнему твоему, каким ты Бога по отношению к себе (видишь) и хочешь иметь. Иными словами, будь милостив к брату твоему, если хочешь, чтобы Бог был к тебе милостив. Прощай ему все грехи его, если хочешь от Бога прощение грехов твоих получить. Заботься о спасении его так, как о своем заботишься. Это есть дух христианский. Это есть истинного христианина знамение – делать ближнему своему то, чего себе хочешь. Этому закон, пророки и апостолы, и Сам закона, пророков и апостолов Господь учит.
      cn: 亲爱的，默想这事，并努力以你所愿的、上帝待你那样的慈悲，去待你的近人。换言之，如果你希望上帝慈悲对待你，就要慈悲对待你的弟兄。宽恕他所有的罪过，如果你希望从上帝那里获得你罪过的赦免。顾念他的救恩，如同顾念你自己的救恩一样。这就是基督精神。这就是真基督徒的标记——对你的近人行你所愿人待你的事。律法、先知和使徒们，以及律法、先知和使徒们的主——祂自己，都教导这事。
  - type: paragraph
    text:
      ru: '7) Из слов Господних: «Я пришел призвать не праведников, но грешников к покаянию, -» видим, какова цель пришествия Христова в мир, а именно, – призвать нас к покаянию. Все мы заблудились от пути истины. Пленил нас враг наш сатана, и отвел нас от Бога истинного, и в беспутье ввергнул, и уязвил нас, как разбойник, и лежали на пути еле живые, и не мог нас ни закон, ни левиты, ни пророки исцелить. Все мы, как один человек, от востока до запада, лежали уязвленными врагом тем, и ни от кого исцеления получить не могли, ни от закона, ни от священников, ни от левитов. Все они, видя нашу язву неисцельную, – все мимо прошли, и оставили нас, и ни в чем не помогли нам. Сам же пророков и закона и левитов Господь, Сын Божий, Царь и Царев Сын, возлюбленный Иисус, не от Самарии, но от Марии Девы происшедший, пришел к нам и, видев нас, милосердовал о нас, и предложил нам врачевство – покаяние, говоря: «"Покайтесь» . Я вас «пришел взыскать и спасти» . Оставьте прежнюю вашу жизнь, обратитесь, перемените себя, и врачевство у Меня вам готово: «Омойтесь, очиститесь; удалите злые деяния ваши от очей Моих; перестаньте делать зло; научитесь делать добро» , и прочее. «Если будут грехи ваши, как багряное, – как снег убелю; если будут красны, как пурпур, – как волну убелю"» ( Ис 1:16–18 ).'
      cn: 7) 从上主的话语中——「我来不是召义人，乃是召罪人悔改，」——我们看到基督降世的目的，即是召我们悔改。我们都偏离了真理之道。我们的仇敌撒旦掳掠了我们，并使我们偏离了真上帝，又将我们投入歧途，并像强盗一样伤害了我们，我们躺在路上，奄奄一息，无论是律法、利未人还是先知，都无法医治我们。我们所有的人，如同一个人，从东方到西方，都被那仇敌所伤，并且无法从任何人那里得到医治，无论是从律法、祭司还是利未人那里。他们所有的人，看到我们这无法医治的创伤，都从我们身边经过，舍弃了我们，丝毫无助于我们。然而，那先知、律法和利未人的上主本身，上帝之子，君王和君王之子，被爱的耶稣，不是从撒玛利亚，而是从贞女马利亚所生，祂来到我们这里，看见我们，就怜悯我们，并向我们提供了良药——悔改，祂说：「你们当悔改！」我来是要「寻找并拯救」你们。舍弃你们从前的生活，回转过来，改变你们自己，我为你们预备的良药就在这里：「你们要洗涤，要洁净；从我眼前除掉你们的恶行；停止作恶；学习行善。」等等。「你们的罪虽像朱红，必变成雪白；虽像丹颜，必变为羊毛。」（以赛亚书 1:16-18）
  - type: paragraph
    text:
      ru: 'Видишь, ради чего Христос пришел: призвать нас к покаянию и кающихся исцелить, а некающиеся как бы противятся этому. Отсюда видим, что вся христианская жизнь на земле должна быть не чем иным, как покаянием, которое и достойные покаяния дела включает.'
      cn: 你看，基督降世，所为何事：为召我等悔改，并医治悔改者；而那不悔改者，则仿佛抗拒此事。由此可见，世上一切的基督徒生活，莫不应是悔改；此悔改亦包含配得悔改之善工。
  - type: paragraph
    text:
      ru: 'Христос «пришел призвать нас к покаянию» . Обрати особое внимание на слова: «пришел призвать к покаянию» . Не веселье, не трапезы, не гуляния, не пиршества, не ликование, и прочее, но покаяние, плач, слезы, рыдание и крест предлагает нам, во юдоли плачевной живущим, Господь наш. Теперь видишь, что значит христианская жизнь в мире, который «лежит во зле» . Читай Евангелие Христово и (яснее) увидишь.'
      cn: '基督「召叫我们悔改」。请特别留意这些话语：「召叫（我们）悔改」。


        我们的主，向居住在这悲苦幽谷中的我们，所赐予的，并非欢乐、并非筵席、并非游乐、并非盛筵、并非狂喜，以及诸如此类；而是悔改、哀哭、眼泪、恸哭和十字架。


        现在你明白，在这「卧于邪恶」的世上，基督徒的生活意味着什么了吧。阅读基督的圣福音，你便会（更清楚地）明白。'
  - type: paragraph
    text:
      ru: Имеют и христиане здесь веселье, но духовное. Они радуются не о золоте, серебре, пище, питье, чести и славе, но «о Боге Спасе своем» , о благости и милости Его к ним, о надежде вечной жизни, и прочее.
      cn: 基督徒在此世亦有喜乐，但那是属灵的。他们所喜乐的并非金银、饮食、尊荣和荣耀，而是「以上帝，他们之救主为乐」，以祂对他们的良善与怜悯为乐，以永生之盼望为乐，等等。
  - type: paragraph
    text:
      ru: 'Отсюда видишь, что заблуждаются те христиане, которые в веселостях мира сего дни свои проводят, любят проезжаться в каретах, в гости ездить и гостей принимать, банкеты, танцы и прочие веселья устраивать, оставляя долг богопочитания и должность к отечеству. Нет в них покаяния и потому напрасно зовут ко Христу: «Господи, Господи! -» ибо не делают, что Христос говорит: «Покайтесь» . Рассуждай об этом и бегай от таких дел, как от Содома и Гоморры, чтобы с ними не погибнуть.'
      cn: 由此可见，那些基督徒是受迷惑的，他们在今世的享乐中度日，喜爱乘坐马车游乐，往来宴客，举办宴席、舞会及其他各种享乐活动，弃绝了敬拜上帝的本分以及对祖国的义务。他们里面没有悔改，所以他们徒然地呼求基督：「主啊，主啊！」(马太福音 7:21)；因为他们不遵行基督所说的：「你们要悔改。」(马太福音 4:17) 你当思考此事，并远离此类行径，如同远离所多玛和蛾摩拉一样，免得与他们一同灭亡。
  - type: paragraph
    text:
      ru: Христос Господь всех зовет к покаянию, но если кто не кается и не творит дел покаяния, то это значит, что он Христа не послушал и, к покаянию Им позванный, не повиновался Ему, потому и Христос и Евангелие такому никакой пользы подать не могут. Не находится в покаянии тот, кто греховной жизни не оставляет, не обновляется умом и сердцем, но в ветхой и плотской жизни пребывает, не умерщвляет плоти со страстями и похотями, ищет в мире этом, как отечестве своем, чести, славы и богатства, а не как странник и пришелец живет, и не старается о том, как бы не лишиться вечной жизни. Таков всякий некающийся, и таковы отличительные признаки некающегося человека. Ибо истинное покаяние обновляет человека, и от мира отводит, и поощряет к подвигу против греха, и ум и сердце его к вечности привязывает. Помни и рассуждай об этом.
      cn: '基督上主召唤所有人悔改，但若有人不悔改，也不行悔改之工，那就意味着他没有听从基督；并且，尽管被祂召至悔改，却不顺从祂。因此，基督和福音都不能带给这样的人任何益处。


        那没有处于悔改之中的人，是不离弃罪恶生活、心意不更新的，却仍停留在陈旧肉体生活中的，不治死肉体及其情欲和贪欲的，在这世上寻求，如同在自己的家园一般，名誉、荣耀和财富，而不是作为寄居者和客旅而生活，也不努力避免失去永生。每一个不悔改的人都是如此，这些就是不悔改之人的显著特征。因为真正的悔改更新人，使人脱离世界，鼓励人投身于对抗罪恶的属灵争战，并将他的心意系于永恒。请记住并思量此事。'
  - type: paragraph
    text:
      ru: '8) Поминай Господа Иисуса. Христос, Который языками человеческими укоряем был, явится во славе Своей в последний день, и Тот, Который к грешникам пришел, придет со всеми чистыми Ангелами Своими, и Тот, Который с грешниками ел и пил, сядет на престоле славы Своей, и Тот, Который призвал грешников к покаянию, призовет на суд всех грешников. Близок же день тот, и уже ближе сегодня, нежели вчера был: «Господь вовек пребывает. Приготовил Он для суда престол Свой» ( Пс 9:8 ).'
      cn: 8) 思念主耶稣。基督，祂曾受人言语的辱骂，在末日将以祂的荣耀显现，而那位曾来到罪人中间的，将与祂一切纯洁的天使同来，而那位曾与罪人一同饮食的，将要坐在祂荣耀的宝座上，而那位曾召呼罪人悔改的，将召呼一切罪人受审判。那日子是近了，并且今日比昨日更近了：「上主永远常存。祂为审判预备了祂的宝座」（诗篇 9:8）。
  - type: paragraph
    text:
      ru: '9) От слов: «Я пришел призвать не праведников, но грешников к покаянию, -» грешникам кающимся утешение проистекает. Христос не ради праведников, но ради грешников пришел – призвать их к покаянию. Когда в грехах каемся и на пути покаяния находимся, то будем помнить и то, что апостол утешительно написал: «Верно и всякого принятия достойно слово, что Христос Иисус пришел в мир спасти грешников» ( 1Тим 1:15 ). И Сам Сын Божий сказал: «Сын Человеческий пришел взыскать и спасти погибшее» ( Лк 19:10 ). Итак, стой, крепись, мужайся, и да крепится сердце твое, так как и тебя Он пришел призвать на покаяние, пришел взыскать и спасти, потому что и ты один из погибших и грешников, которых Он пришел взыскать и спасти. И Он лицеприятия не имеет, Он всех кающихся милует и спасает, ибо на то и пришел.'
      cn: 9) 从「我来不是召义人，乃是召罪人悔改，——」这些话语中，悔改的罪人得着安慰。基督来不是为了义人，而是为了罪人——为要召他们悔改。当我们在罪中悔改，并身在悔改的道路上时，就当记住使徒安慰性地写下的话语：「这话是可信的，是十分可接纳的，就是基督耶稣降世，为要拯救罪人」（1提摩太书 1:15）。上帝之子自己也曾说过：「人子来，为要寻找和拯救失丧的人」（路加福音 19:10）。因此，要站立，要刚强，要勇敢，愿你的心也刚强，因为祂来也是要召你悔改，也是来寻找和拯救你，因为你也是祂来要寻找和拯救的那些失丧之人与罪人中的一员。而且祂不偏待人，祂怜悯并拯救所有悔改的人，因为祂来就是为此。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Дивлюсь я, что ты не знаешь немощей и болезней души. Разве ты не чувствуешь их? Почему же вопрошаешь: какие бывают болезни души? Малая ли болезнь слепота, которая лежит на душевных очах и не дает человеку видеть Бога, суды и чудеса Его, и своего бедствия и окаянства не познавать? Малая ли болезнь – глухота, из-за которой душа не слышит гласа Божия? Сколько душу не призывает глас Слова Божия, но она не слышит того. Малая ли немощь – гнев, который, как лихорадка тело, душу сокрушает? Посмотри на человека, который гневается: как он весь трясется. Когда то на теле видится, то что же в душе делается? Зависть, ненависть и злоба, как чахотка тело, душу снедают, так что и тело бледнеет и истаивает от злых тех болезней.'
      cn: 我诧异你竟不知道灵魂的诸般软弱和疾病。难道你感觉不到它们吗？那么你为什么提问：灵魂会有哪些疾病呢？瞎眼难道是小病吗？这瞎眼落在灵魂的眼目上，不让人看见上帝，不让人看见祂的审判和奇迹，也不让人认识自己的困苦和悲惨。耳聋难道是小病吗？因其灵魂听不见上帝的声音。无论上帝圣言的声音怎样呼唤灵魂，它都听不见。愤怒难道是小软弱吗？它如同热病摧残身体那样，摧残灵魂。看看那发怒的人：他全身是怎样地颤抖。当那显现在身体上时，那么灵魂里又发生了什么呢？嫉妒、仇恨和恶意，如同肺痨病摧残身体那样，吞噬灵魂，以至于身体也因着那些邪恶的疾病变得苍白，消瘦枯槁。
  - type: paragraph
    text:
      ru: 'Словом, столько немощей и болезней в душе, сколько греховных и вредных страстей. Что у тела члены, то у души мысли. Немощно и болезненно тело, когда немоществуют и болезнуют члены его; немоществует и душа, когда у нее плохие мысли. Так уязвил душу сатана, ослепил очи ее, что не видит света Божия! Поэтому молится Псаломник: «Открой очи мои, и уразумею чудеса от закона Твоего» ( Пс 118:18 ). Заткнул уши ее, и не слышит Слова Божия, и прочие многоразличные болезни причинил ей, и оставил бедного человека еле живым, на пути мира сего лежащим. Поэтому пришел милостивый Иисус, чтобы возвратить душе здравие. Слава милосердию Его со Отцом и Духом Святым!'
      cn: 简言之，灵魂中有多少罪恶和有害的情欲，就有多少软弱和疾病。身体有肢体，灵魂有思想。当身体的肢体软弱和有病时，身体是软弱和有病的；当灵魂有不好的思想时，灵魂也是软弱的。撒旦如此伤害了灵魂，蒙蔽了它的眼睛，以致它看不见上帝的光！因此，圣咏作者祈祷说：「求祢开我的眼睛，使我看出祢律法中的奇妙！」（诗篇 118:18）。它塞住了它的耳朵，以致它听不见上帝的圣言，并给它造成了其他各种疾病，留下这可怜的人奄奄一息，躺在这世上的路上。因此，仁慈的耶稣来了，为了使灵魂恢复健康。愿荣耀归于祂的仁慈，与圣父和圣灵同在！
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 101 – 110
    cn: 书信 101 – 110
  children:
  - type: paragraph
    text:
      ru: 'Вопрошаешь: какие мысли у души худые и какие добрые?'
      cn: 你问道：灵魂中有哪些思想是邪恶的，又有哪些是良善的？
  - type: paragraph
    text:
      ru: 'Ответ:'
      cn: 回答：
  - type: paragraph
    text:
      ru: '1) Господь говорит: «Извнутрь, из сердца человеческого, исходят злые помыслы, прелюбодеяния, любодеяния, убийства, кражи, лихоимство, злоба, коварство, непотребство, завистливое око, богохульство, гордость, безумство» ( Мк 7:21–22 ).'
      cn: 主说：「因为从人心里发出恶念、奸淫、邪淫、凶杀、偷盗、贪婪、恶毒、诡诈、放荡、嫉妒、亵渎、骄傲、狂妄。」 (马可福音 7:21-22)
  - type: paragraph
    text:
      ru: 2) Также плохими и злыми являются мысли, в душе рождающиеся, об искании в мире этом богатства, чести и славы ( 1Ин 2:15–16 ), и прочих утех.
      cn: 同样，那些在灵魂中滋生，寻求世上的财富、尊荣和荣耀（约翰一书 2:15-16）以及其他享乐的思想，也是邪恶的。
  - type: paragraph
    text:
      ru: 3) Словом, все те мысли в душе плохие, которые запрещены словом Божиим.
      cn: 3) 简言之，所有那些在灵魂中不好的念头，都被上帝的圣言所禁止。
  - type: paragraph
    text:
      ru: 4) Когда душа таким мыслям соизволяет, то они ее оскверняют и делают мерзкой пред Богом, хотя внешне эти мысли через телесные члены и не выходят; если же и внешне проявляются и делом совершаются, то еще более нечистой ее делают. «Все это зло извнутр исходит и оскверняет человека, -» говорит Господь ( Мк 7:23 ).
      cn: 4) 当灵魂顺从这些思想时，它们就玷污她，并使她在上帝面前变得可憎，尽管这些思想并未通过身体的肢体显露出来；如果它们甚至在外表上显现并付诸行动，就会使她变得更加不洁。「这一切的恶都是从里面发出，并玷污人，」主说 (马可福音 7:23)。
  - type: paragraph
    text:
      ru: '5) Видишь, что бедная душа, благородное создание, по образу и по подобию Божию созданное, связана этими вредными страстями, как человек в темнице сидящий узами, и не может свободно делать и даже приступить к тому, что ей свойственно, как образу Божию, ибо не позволяют ей эти злые стражи и враги. От такой беды и окаянства пришел избавить ее Иисус, Избавитель наш, Который говорит нам: «Если Сын освободит вас, то истинно свободны будете» ( Ин 8:36 ). Ибо без Него душа от того бедствия освободиться не может.'
      cn: 5) 你看，可怜的灵魂，这高贵的受造物，照着上帝的形像和样式被造的，被这些有害的情欲束缚着，就像被锁链捆绑、坐在监牢里的人一样，无法自由地行动，甚至无法接近那作为上帝形像所固有的，因为这些邪恶的看守和仇敌不容许它这样做。我们的救主耶稣降临，为要将它从这般的苦难和悲惨中解救出来，祂对我们说：「如果上帝之子使你们自由，你们就真自由了。」（约翰福音 8:36）因为没有祂，灵魂无法从那苦难中获得自由。
  - type: paragraph
    text:
      ru: 6) Если кто против тех мыслей стоит, борется и подвизается, отвергая их и не соизволяя им, и призывает на помощь Избавителя своего Иисуса, и просит у Него избавления – от Него же единого и бывает избавление, – тот мало-помалу от них избавляется, и душа, как тело от болезней, исцеляется от немощи своей, и здравие получает. Как тело немощное чем более освобождается от вредных влияний, тем здоровее бывает, так и душа немощная, чем более освобождается от злых помышлений, тем большее здравие получает.
      cn: 6) 倘若有人抵挡、搏斗并苦修，拒绝且不顺从那些思想，并呼求他的救主耶稣的帮助，向祂祈求救赎——因为救赎唯独从祂而来——那人便会渐渐地从那些思想中被解救，灵魂如同身体脱离疾病一般，从自身的软弱中得医治，并获得健康。正如软弱的身体越是脱离有害影响，便越健康，同样，软弱的灵魂越是脱离邪恶意念，便获得更大的健康。
  - type: paragraph
    text:
      ru: 7) Из этого видишь, какие мысли в душе добрые, то есть когда рассуждает она о себе, о своем окаянстве и бедствии, когда упражняется в богомыслии, и к нему прилепляется мыслями своими, отлучает их от суеты мира сего, и обходит ими небесное отечество, и помышляет, как бы угодить Богу, и слово Его святое исполнить, и с ближним своим обходится так, как сама с собой, и желает ближнему и делает то, чего себе желает и делает, и прочее.
      cn: 7) 从此可见，灵魂里有哪些良善的意念：即是当她反省自身，思考自己的悲苦与困境时；当她操练于神思，并以自己的意念依附于此，使它们脱离今世的虚妄，并借此遍览天上的家园时；当她思虑如何蒙上帝悦纳，并遵行祂的圣言时；以及当她待她的近人如同待己，并向近人愿望并实践她为自己所愿望并实践的，等等。
  - type: paragraph
    text:
      ru: 8) Когда такие мысли душа имеет, то и внешние ее дела и слова добрыми бывают подобно тому, как от источника чистого чистые ручьи текут, как от доброго дерева добрые плоды рождаются, как от сосуда благовонного благовоние происходит. Так, от доброй души добрые дела и слова являются.
      cn: 8) 当灵魂拥有这样的思想时，那么其外在的作为和言语也会是良善的，正如洁净的泉源流出洁净的溪水，又如好树结出好果子，又如芳香的器皿发出馨香。如此，良善的灵魂便显出良善的作为和言语。
  - type: paragraph
    text:
      ru: 9) Когда такое состояние в душе имеется, то это знак того, что Иисус, Избавитель пленных наших душ и Врач немощей наших, ее милостью и человеколюбием Своим посещает, и врачует ее немощи, и возвращает первое ее здравие. Призовем и мы в помощь Иисуса и дадим Ему действовать в нас Своим врачевством, как хочет, так как Он исцеляет души наши.
      cn: 9) 当灵魂中有这样的状态时，这就标志着耶稣，我们被囚灵魂的救赎者和我们软弱的医治者，以祂的慈悲和仁爱眷顾她，医治她的软弱，并使她恢复起初的健康。我们也当呼求耶稣来帮助，并任凭祂以祂的医治之道在我们里面作工，照祂所愿的，因为祂医治我们的灵魂。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Поскольку важно знать об этом для нашего спасения, то я еще о том же пишу тебе, ты же внимай и рассуждай.
      cn: 因为知道此事对于我们的救恩至关重要，所以我还要就此写信给你，你则要留心并省思。
  - type: paragraph
    text:
      ru: 'Надо:'
      cn: 需要：
  - type: paragraph
    text:
      ru: '1) Стараться и просить Иисуса, чтобы откр ыл очи душевные, которые сатана ослепил. Ибо в том начало спасения, чтобы познать себя, бедность, окаянство свое, суету мира и истину. Ибо человек, ослепленный врагом тем, как слепой блуждает и не знает сам, что делает. Ищет чести, славы и богатства в мире и не знает, для кого ищет и собирает. В этом слепота душевная. Ибо все человек оставит в мире этом, чего бы ни искал, и потому напрасно ищет то, что вскоре оставит. Таковой подобен тому безумцу, который решетом черпает воду и хочет сосуд наполнить. Так и человек миролюбивый: «собирает и не знает, кому достанется то» ( Пс 38:7 ). Суетны его начинания, труды и старания. Надо человеку познать, что все это суета, тень и обман, – одно то только истинно, что от нас никогда не отступает, но всегда с нами пребывает, то есть вечная жизнь и блаженство ее.'
      cn: 努力并祈求耶稣，为要开启撒旦所蒙蔽的灵魂之眼。因为救赎的开端在于认识自己、自身的贫乏与悲惨、世界的虚妄和真理。因为人被那仇敌蒙蔽，如同瞎子般盲目摸索，也不知道自己正在做什么。他在世上寻求尊荣、光荣和财富，却不知为谁而寻求和积攒。这就是灵魂的盲目。因为人无论在世上寻求什么，终将撇下一切；因此，他徒劳地寻求那些他很快就会撇下之物。这样的人如同那愚人，他用筛子舀水，却想盛满器皿。爱世之人亦然：「积攒财宝，却不知将来有谁收取」（诗篇 38:7）。他的谋划、劳苦和努力都是虚妄的。人必须认识到这一切都是虚妄、阴影和欺骗，唯独那永不离开我们，却常与我们同在的才是真实的，那就是永生及其福乐。
  - type: paragraph
    text:
      ru: 'Когда этот луч спасительный блеснет в сердце, тогда заблудший человек вздохнет, и возведет очи ко Господу своему, и скажет с сожалением: «Ах, как я худо поступал! Искал того и заботился о том, что не мое, и не искал того, в чем истинное мое добро. Гонялся за тем, что ложно, и оставлял то, в чем истинное блаженство».'
      cn: '当这救恩之光在心中闪耀时，那时，迷失之人会叹息，并举目望向上主，带着悔恨地说：

        「啊，我行事何等不当！我寻求并关心那些不属于我的事物，却未曾寻求那真正属于我的益处。我追逐虚妄之物，却舍弃了那真正的福乐。」'
  - type: paragraph
    text:
      ru: 'Ибо все временное ложно, только одно вечное истинно. Временное подобно яблоку заповеданному, которое прельщает нас и умерщвляет: вкусишь его, и оно погубит тебя. Надо это яблоко отвергнуть и обратиться к древу жизни, посреди рая церковного насажденному, Иисусу Христу. Только это древо оживляет нас и подает вечную жизнь с вечным утешением.'
      cn: 因为一切属暂时的都是虚假的，唯有那永恒的才是真实的。暂时的事物犹如那被禁的果子，它诱惑我们并置我们于死地：你一尝它，它就会毁灭你。我们应当舍弃这果子，并转向那栽种在教会乐园中央的生命树——耶稣基督。唯有这棵树能使我们活过来，并赐予我们永生和永恒的慰藉。
  - type: paragraph
    text:
      ru: Должно нам сравнивать время с вечностью и настоящее с будущим, и так может просветиться сердце с помощью Иисусовой. Странники и пришельцы мы на земле чужой. Зачем же нам гоняться за тем, что не наше и что оставим на земле чужой? Рассуждай об этом и моли милостивого Иисуса, дабы отверзлись очи твои, как слепые молили Его и прозревали.
      cn: 我们应当将时间与永恒、现世与来世作比较，如此，心灵才能借着耶稣的帮助得蒙光照。我们是这陌生大地上的客旅和寄居者。我们又何必追逐那不属于我们、且将要留在这陌生大地上的事物呢？思量此事，并恳求仁慈的耶稣，使你的眼睛得以开启，正如瞎子们曾恳求祂并得见光明一样。
  - type: paragraph
    text:
      ru: '2) Просить Его, чтобы уши душевные отворил, которые сатана заткнул. Примечай, что Господь говорит во Евангелии: «Кто имеет уши слышать, да слышит!» Видишь, что надо не только уши иметь, но еще и «уши» , чтобы «слышать» .'
      cn: 2) 祈求祂开启灵魂的耳朵，那被撒旦堵塞的。请注意，上主在福音书中所说：「凡有耳可听的，就应当听！」你看，这不只是要有耳朵，还需要有「耳朵」才能「听见」。
  - type: paragraph
    text:
      ru: Все люди имеют уши, но не все имеют «уши» , чтобы «слышать» . Видишь, что есть другие уши, которыми слышим Слово Божие, то есть уши души. Кода эти уши заткнутыми имеем, то нам никакой пользы Слово Божие не подаст, как глухим. Ибо хотя оно и воспринимается внешним слухом, но поскольку внутреннего слуха не имеет человек, то и не доходит слово до души, как не доходит всякий глас до глухого человека.
      cn: 所有人都有耳朵，但并非所有人都有「耳朵」能「听见」。你可见，还有另一些耳朵，我们借此听闻上帝之道，即是灵魂的耳朵。当我们拥有这些被堵塞的耳朵时，上帝之道就无法给我们任何益处，如同对聋子一样。因为，虽然它能被外在的听觉所感知，但由于人没有内在的听觉，话语也就无法抵达灵魂，如同任何声音都无法抵达聋人一样。
  - type: paragraph
    text:
      ru: Отсюда бывает, что слышит человек проповедь Слова Божия, и часто хвалит, но тем словом не обновляется, не подвигается и не возбуждается к покаянию и его плодам, и так бесплодно бывает для него слово. Ибо какая глухому польза от слова? Никакой. Когда слышит, что царь земной, или господин его, или отец ему приказывает или обещает что, то с радостью и надеждой делает и надеется на то. Почему? Потому что внешними глазами видит их и ушами слышит, и обещанное видит. Бога ли, Царя Небесного, великого и страшного, не будет слушать и обещанию Его неложному не будет веровать, если душевными очами видит Его и уши души отверстыми имеет?
      cn: 于是便会发生，人听了上帝圣言的讲道，常常称赞，却没有被那圣言所更新，没有被感动，也没有被激发去悔改和结出悔改的果实，因此那圣言对他而言便是毫无果效的。因为聋子从话语中能得到什么益处呢？毫无益处。当他听到地上的君王，或是他的主人，或是父亲命令他，或是应许他什么事时，他便带着喜悦和盼望去遵行，并寄希望于此事。为何如此呢？因为他用肉眼看见他们，用耳朵听见他们，并且看到所应许的事。难道他会不听从上帝——这位伟大可畏的、天上的君王，不相信祂那真实无伪的应许吗？如果他能以灵魂的眼睛看见祂，并拥有敞开的灵魂之耳呢？
  - type: paragraph
    text:
      ru: Итак, знак неведения Божия в душе и глухоты ее в том, что человек Слова Божия не слушает и заповедей Его не исполняет. В таком человеке, хотя бы он и премудрым был, и око и ухо души закрыты тьмой и мглой, как покрывалом. Помышляй и помни, что Бог, слово Которого в святых книгах содержится, тебе говорит, душе твоей, а не телу твоему, и подлинно так, душе твоей повелевает, запрещает, обещает, грозит, открывает, зовет к себе, отводит от гибели, и призывает к вечному блаженству, велит мир презирать и вечной жизни искать, – и молись Иисусу, Который «глухому и косноязычному слух отверз и разрешил узы его языка» ( Мк 7:32–35 ), – и тогда услышишь Слово Божие не только внешними ушами, но и внутри тебя.
      cn: 所以，灵魂中对上帝的无知和灵魂的失聪的标志，在于人听不进上帝的话语，也不遵行祂的诫命。在这样的人里面，即使他极有智慧，灵魂的眼睛和耳朵也被黑暗和迷雾如同帷幕般遮蔽。思量并谨记，上帝——祂的话语记载在圣书中——是对你说话，是对你的灵魂说话，而不是对你的身体说话。并且确实如此，祂对你的灵魂发令、禁止、许诺、警戒、启示，召唤你归向祂，使你远离毁灭，并召唤你进入永恒的福乐，吩咐你轻看世界并寻求永生。并向耶稣祷告，祂「开通了聋子的耳朵，解开了他舌头的束缚」（马可福音 7:32-35）。如此，你将不仅用外在的耳朵，更是从你里面听见上帝的话语。
  - type: paragraph
    text:
      ru: 'Тогда душа твоя обновляться и переменяться будет, тогда сам себе удивляться будешь, так как иначе все будешь слышать, чем прежде слышал. Тогда с Давидом будешь говорить: «Сколь сладки для гортани моей слова Твои, Боже» ( Пс 118:103 ). И еще: «Закон уст Твоих лучше для меня, чем множество золота и серебра» ( Пс 118:72 ). Если царя земного слова и речь с радостью и сладостью слушает человек, то Бога ли не послушает? Ибо Божие Слово сладкое, любезное, животворящее, увеселяющее, будучи словом уст Божиих. Хотя бы и через людей нам говорил Бог, но от уст Его святых произошло слово то. Тогда, слыша Евангелие читаемое, услышишь как бы Самого Христа говорящего, ибо те же слова читаются там, которые говорил Христос, когда по земле ходил.'
      cn: 那时你的灵魂将会更新与改变，那时你将对自己感到惊奇，因为你所听到的一切都将与你从前所听到的不同。那时你将与大卫一同说：「祢的话语对我的喉咙而言何等甘甜，上帝啊！」 (诗篇 118:103) 还有：「祢口中的律法，对我而言胜过千万金银。」 (诗篇 118:72) 如果人尚且怀着喜乐与甘甜聆听地上君王的话语和言论，那么，他难道不愿聆听上帝吗？因为上帝的圣言是甘甜的、可爱的、赋予生命的、令人愉悦的，因它出自上帝的口。纵然上帝借着人对我们说话，但那话语确是从祂圣洁的口中发出。那时，当你聆听宣读福音时，你会仿佛听到基督亲自在说话，因为那里所读的正是基督在地上行走时所说过的同样的话语。
  - type: paragraph
    text:
      ru: Всему этому начало – прозрение души и отверстый слух ее. Ибо эти чувства, зрение и слух, как внешние на теле, так и внутренние в душе являются главнейшими. И как тело без них слепо, глухо и бедно, так без того и душа слепа и глуха, и потому в великом бедствии находится.
      cn: 这一切的肇始，乃是灵魂的明见与敞开之耳。因为这些感官，即视觉和听觉，无论是身体外部的，还是灵魂内部的，都是最重要的。正如身体若没有它们，便是盲的、聋的、贫乏的；照样，灵魂若没有它，也是盲的、聋的，因此处于极大的患难之中。
  - type: paragraph
    text:
      ru: 3) Имеет душа обоняние, вкус и осязание свое. Когда тело немощно, то иногда человек теряет обоняние, никакого запаха не чувствует, также и вкушать не может, бывает, что и осязания не чувствует. То же видим и в душе. Хотя и всегда с нами Бог есть, поскольку Он на всяком месте есть, однако душа, будучи немощной, не обоняет благовония, и не услаждается благостью Его присутствия, и осязания Его не чувствует. Почему? Потому что чувств тех не имеет. Сатана отнял их у нее и сделал ее расслабленной и недвижимой.
      cn: 3) 灵魂拥有它自己的嗅觉、味觉和触觉。当身体软弱时，人有时会失去嗅觉，闻不到任何气味，也无法尝到味道，甚至感受不到触觉。我们在灵魂中也看到同样的情况。尽管上帝常与我们同在，因为祂无处不在，然而当灵魂软弱时，就闻不到祂的芬芳，也无法享受祂同在的福祉，更感受不到祂的触碰。为何如此？因为它没有那些感官。撒但夺走了这些感官，使它变得松弛无力、静止不动。
  - type: paragraph
    text:
      ru: 'О, если бы душа чувствовала Божие присутствие, тогда бы в великом страхе, смирении, и любви, и радости была! Ибо чувствование сие без того не бывает. Когда чувствует величество и страшную славу Его, то трепещет, смиряется и припадает пред Ним, как пред страшным Царем своим, на Которого и Ангелы смотреть не могут. Когда вкушает благость Его, как пророк говорит: «Вкусите и увидите, как благ Господь» ( Пс 33:9 ), – тогда неизреченно услаждается гортань ее, и радуется, веселится и играет, как человек, вином напоенный. Так в ней действует чувствование Божия присутствия.'
      cn: 哦，倘若灵魂能感受上帝的临在，那时它就会在大大的敬畏、谦卑、爱和喜乐之中！因为这感受是不会没有这些（特质）的。当它感受祂的威严和可畏的荣耀时，它就战兢，谦卑自己，并俯伏在祂面前，如同在它可畏的君王面前，连天使都不能直视祂。当它品尝祂的良善时，正如先知所说：「你们要尝尝，便知道上主是美善的」（诗篇 33:9），那时它的喉咙便无法言喻地甜美愉悦，并且欢喜、快乐、跳跃，像被酒灌醉的人一样。上帝临在的感受就是这样在她里面发挥作用的。
  - type: paragraph
    text:
      ru: Если чувствование царева присутствия, который есть человек, как и мы, делает в нас перемену, и то страх, то смирение, то радость в нас возбуждает, то тем более это будет, когда почувствуем Божие присутствие. Ибо что царь земной пред Богом? Как ничто. Не дерзнет тогда человек не только что-либо делать, говорить и думать непристойное, но и слово без нужды сказать. При царе земном не смеет ничего говорить. При Боге ли, Небесном Царе, Которого величество и слава непостижима, дерзнет? Поверь, возлюбленный, что всегда бы душа в удивлении и исступлении была. Отсюда видишь, что те люди, которые грешат и бесчинствуют, душевных чувств не имеют, и не чувствуют, и не знают Бога. Слепы таковые люди и бесчувственны и, по правде говоря, не имеют в душе никакой жизни.
      cn: 如果我们感受到君王的临在，他也是人，和我们一样，就能在我们里面带来改变，时而激发出恐惧，时而激发出谦卑，时而激发出喜乐，那么，当我们感受到上帝的临在时，这种情形就更会如此了。因为地上的君王在上帝面前算什么呢？简直是虚无。那时，人就不敢，不仅不敢做、说、想任何不合宜的事，甚至连一句不必要的话也不敢说。在地上的君王面前，人不敢说什么。在上帝这位天上的君王面前，祂的威严与荣耀不可测度，人又岂敢放肆呢？相信我，亲爱的，那时灵魂会一直处于惊奇和出神的状态。由此可见，那些犯罪和胡作非为的人，没有灵魂的感受，他们感受不到，也不知道上帝。这样的人是盲目的，没有感觉的，并且，说实话，他们的灵魂中没有任何生命。
  - type: paragraph
    text:
      ru: Итак, видишь чувства души, видишь и немощи ее. Помолимся Иисусу, милостивому Врачу, дабы исцелил немощи душ наших. Ибо для того Он и пришел. Если исцелял телеса смертные, то тем более исцелит души бессмертные. О, Иисусе! Исцели нас, Господи, и исцелимся.
      cn: 如此，你看见灵魂的感受，也看见它的软弱。让我们向耶稣，这位仁慈的医者祷告，好使祂医治我们灵魂的软弱。因为祂正是为此而来。如果祂医治了必死的肉身，那么祂就更会医治不朽的灵魂。哦，耶稣！主啊，医治我们吧，我们必得医治。
  - type: paragraph
    text:
      ru: Помышляй об этом и внимай.
      cn: 默想此事并留心。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: в чем еще проявилась злоба иудеев ко Христу, пришедшему спасти их?'
      cn: 你问：犹太人对前来拯救他们的基督所怀的恶意，又在何处显现出来呢？
  - type: paragraph
    text:
      ru: 'Ответ. Называли Его человеком, который любит есть и пить вино, другом мытарям и грешникам: «Вот человек, который любит есть и пить вино, друг мытарям и грешникам» ( Мф 11:19 ). Но Господь кротко все это терпел.'
      cn: 答：他们称祂为一个贪食好酒的人，一个税吏和罪人的朋友：「看哪，一个贪食好酒的人，一个税吏和罪人的朋友！」（马太福音 11:19）。但上主谦卑地忍受了这一切。
  - type: paragraph
    text:
      ru: 'Видишь здесь:'
      cn: 你看到这里：
  - type: paragraph
    text:
      ru: '1) Как ради нас в мир пришел Господь наш, и человеком стал, так ради нас и терпел язвительные слова. Терпел Тот, Который, будучи Богом, не имел нужды есть и пить, но возымел нужду есть и пить, став человеком. Тот, Который сказал им через пророка: «Если бы Я взалкал, не сказал бы тебе. Ибо Моя есть вселенная и все, что наполняет ее. Уже ли Я ем мясо волов или пью кровь козлов» ( Пс 49:12–13 )? – Сей, став человеком, и немощи человеческие на Себя воспринял, алкал и жаждал, и потому имел нужду есть и пить, но слышал от неблагодарных людей: «Вот человек, который любит есть и пить вино» .'
      cn: 正如我们的上主为我们降世，成为人，祂也同样为我们忍受了尖刻的言语。祂忍受着，那位，身为上帝，本无需饮食，但祂成为人后，却有了饮食的需要。那位通过先知对他们说：「我若饥饿，必不告诉你。因为世界和其中所充满的一切都是我的。难道我吃公牛的肉，或喝山羊的血吗？」（诗篇 49:12-13）然而，这位，成为人后，担当了人的软弱，饥饿且干渴，因此有了饮食的需要，却听到那些忘恩负义的人说：「看哪，这个人爱吃喝葡萄酒！」
  - type: paragraph
    text:
      ru: '2) Слышал о Себе: «Друг мытарям и грешникам» , Тот, Кто один только Праведен, Который пришел в мир грешников призвать на покаяние и спасти, обращался с ними, желая их оправдать, и взяв на плечи Свои, как Пастырь заблудших овец Своих, принести к Отцу Своему и в ограде небесных селений затворить, – Сей слышал от злоречивых уст: «Друг мытарям и грешникам» . Он благотворил и спасения искал грешникам, но от людей злословие терпел. Нас ради, меня и тебя ради, терпел неповинный и милостивый Господь наш. Мы – люди, которые любят есть и пить вино, мытари и грешники, но Спаситель наш за нас укорение терпел. Слава милосердию Его!'
      cn: 2) 祂听闻人论及祂：「税吏和罪人的朋友」——这位独一的义者，祂来到世上召罪人悔改并拯救他们，祂与他们来往，渴望称他们为义，并像牧者背负祂迷失的羊群一样，将他们背在肩上，带到祂的父那里，关入天国居所的羊圈中——这位却从恶言恶语的口中听闻：「税吏和罪人的朋友」（马太福音 11:19）。祂行善并为罪人寻求救恩，却从世人那里忍受了诽谤。为了我们，为了你我的缘故，我们无辜而仁慈的上帝忍受了一切。我们是贪食好酒的人，是税吏和罪人，但我们的救主为了我们忍受了指责。荣耀归于祂的慈悲！
  - type: paragraph
    text:
      ru: 3) Видим отсюда, что пастыри, заботящиеся о спасении душ человеческих, подлежат злоречию и гонению от злых людей. Сатане неприятно дело их, и потому изощряет на них языки злых людей, как меч, и гонит их. Берегись верить злоречию на пастырей и затыкай уши от злоречивых уст. Это дьявольские орудия.
      cn: 由此可见，那些关心人类灵魂得救的牧者，必然会遭受恶人的诽谤和逼迫。撒但憎恶他们的事工，因此使恶人的舌头锋利如剑，以攻击他们，并逼迫他们。务要提防相信针对牧者的诽谤，并塞住耳朵，不听诽谤之语。这是魔鬼的工具。
  - type: paragraph
    text:
      ru: '4) Видим еще отсюда, чего только зависть и злоба ни делает. Ничем ей благочестивая душа угодить не может, все ей неприятно, что ни делает. Там изобретает порок, где порока нет. То порочит и хулит, что похвалы достойно. Так, Господь сказал о злобных Иудеях: «Пришел Иоанн» (Креститель), «ни ест, ни пьет; и говорят: в нем бес. Пришел Сын Человеческий, ест и пьет; и говорят: вот человек, который любит есть и пить вино, друг мытарям и грешникам» ( Мф 11:18–19 ).'
      cn: 4) 又由此可见，嫉妒和恶意能做出何等事来。虔敬的灵魂绝无可能取悦它分毫，无论做什么，一切都令其不悦。它在没有罪恶之处捏造罪恶。凡是值得称赞的，它却诋毁和亵渎。于是，上主论及恶毒的犹太人说：「约翰（施洗者）来了，不吃也不喝，他们却说：他里面有鬼魔。人子来了，又吃又喝，他们却说：『看哪，这个人贪吃好酒，是税吏和罪人的朋友！』」（马太福音 11:18-19）。
  - type: paragraph
    text:
      ru: 'Видишь, что злобным и Предтеча, ангел плотью обложенный, и Сам Христос, Господь его, свет без всякой тьмы и сама неповинность, угодить не могли, но в обоих отыскали, что порочить. Когда в свете, в котором тьмы нет ни единой, и в светильнике Его отыскала злоба, что осуждать, то чего уже не отыщет в прочих благочестивых душах, которые не без немощи? Видим то же и ныне злобы действие: что ни делает человек, все пересуживает, все винит. Берегись же зависти и злобы – это великий яд души, и как червь дерево внутри, так и он душу грызет и снедает, и как только восстает в сердце, умерщвляй этого червя пагубного, дабы возросши не умертвил душу твою.'
      cn: 你看，连施洗者，那肉身被覆的天使，甚至基督本人，施洗者的主，那毫无黑暗之光，那纯然无辜者，都未能取悦那些恶者，反倒在两者身上都找到了可以非议之处。若是在那丝毫没有黑暗之光中，甚至在他（施洗者）的明灯里，恶念尚能找到可谴责之处，那么在其他并非没有软弱的虔敬灵魂中，它还能找不到什么呢？如今我们仍能看到恶念的同样作为：无论人做什么，它都横加评论，一味指责。因此，当谨防嫉妒和恶念——这是灵魂的剧毒，它就像蛀虫啃噬树木内部一样，蚕食着灵魂；只要它在心中生起，就要将这害人的蛀虫杀死，免得它长大后，便会杀死你的灵魂。
  - type: paragraph
    text:
      ru: 5) Видим, как душа наша повреждена ядом змия древнего, как сатана завистлив и злобен, как тем же ядом и душу человеческую напоил, так что о чем человеку должно радоваться, о том он завистью и злобой снедается. Видим такого зла достаточно на свете.
      cn: 5) 我们看见，我们的灵魂如何被古蛇的毒液所败坏，撒旦如何充满嫉妒和恶毒，如何用同样的毒液灌满了人的灵魂，以至于人本来应该欢喜的事，他却被嫉妒和恶毒所吞噬。我们看见，世上这样的邪恶比比皆是。
  - type: paragraph
    text:
      ru: 6) Далее отсюда примечаем, что за благочестием, как за телом тень, гонение следует. Поэтому благочестивой душе не веселья, но скорби в мире этом ожидать должно.
      cn: 6) 由此我们进一步留意到，迫害如同影子随形于身体一般，紧随着虔诚而来。因此，虔诚的灵魂在这世上不应期待喜乐，而应期待忧伤。
  - type: paragraph
    text:
      ru: 7) Христос Иисус Спаситель наш своею кротостью и терпением учит нас быть кроткими и терпеливыми, и злобу людей побеждать благостыней, или, по крайней мере, молчанием.
      cn: 7) 我们的救主基督耶稣借着祂的温良和忍耐，教导我们当是温良和忍耐的，并且要以仁慈战胜人的恶毒，或，至少，以沉默。
  - type: paragraph
    text:
      ru: 8) Зависть и злоба – великие в душе человеческой язвы, как видели мы. От зависти гнев, от гнева злоба, от злобы убийство последует, как видим на Каине. Поэтому трудиться и молиться Иисусу до тех пор должно нам, пока язвы эти на душах не исцелит. Хочет Он исцелить их, но хочет, чтобы мы и немощи наши объявляли ему, и просили, и искали того у Него. Постараемся же заботиться об исцелении душ наших и помолимся прилежно и неотступно Врачу душ – Иисусу, чтобы исцелил немощи наши.
      cn: 8) 正如我们所见，嫉妒与恶意是人类灵魂中极大的疮痍。由嫉妒生出忿怒，由忿怒生出恶意，由恶意生出杀戮，正如我们在该隐身上所见。因此，我们当劳苦并向耶稣祷告，直到祂医治这些在我们灵魂上的疮痍。祂愿意医治它们，但祂也希望我们将我们的软弱向祂宣告，并向祂祈求，向祂寻求。那么，就让我们努力关照我们灵魂的医治吧，并向灵魂的医者——耶稣，殷勤不倦地祷告，好让祂医治我们的软弱。
  - type: paragraph
    text:
      ru: '9) Поминай, возлюбленный, то время, в которое Господь наш ради нас по земле ходил, и между грешниками обращался, и слышал от языков человеческих: «Вот человек, который любит есть и пить вино, друг мытарям и грешникам» . Тот же Господь еще раз придет и позовет нас на суд. Близок же день тот, и нежданно явится. День ото дня ожидаем Его: ближе ныне, нежели вчера и позавчера был. А хотя и не дождемся его, живя на земле, так смерть день ото дня к нам приближается, и введет нас в вечность, или блаженную, или злополучную. И с чем она застанет нас, с тем и на суде грядущем поставит. Блажен бодрствующий и помышляющий о часе том. «Блажен раб тот, которого» Господь «его, придя, найдет бодрствующим» ( Лк 12:37, 43 ). Постараемся и мы блаженства того участниками быть.'
      cn: 9) 当思想，蒙爱者啊，我们的上主为我们行走于世，并周旋于罪人之中，且听见世人口中说出：「看哪，这个人又爱吃又爱喝酒，是税吏和罪人的朋友。」 同一位上主将再次降临，并召我们受审判。那日近了，且将不期而至。我们日复一日地等候祂：祂今日比昨日和前日更近了。即便我们在世时未能等候到那日，死亡也正日复一日地临近我们，并将我们带入永恒，或为蒙福的，或为不幸的。死亡以何种境况捕捉我们，就以何种境况将我们呈献于未来的审判台前。福哉那警醒的，并思想那时刻的。「福哉那仆人，他的上主来时，发现他警醒。」(路加福音 12:37，43) 我们也当努力成为那福分的分享者。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Посмотрим далее, как фарисейская зависть и злоба злословила Христа Господа, Который пришел спасти их. Когда Господь изгонял бесов из людей и «народ, удивляясь, говорил: никогда не бывало такого явления в Израиле, – фарисеи говорили: Он изгоняет бесов силою князя бесовского» ( Мф 9:33–34 ), и еще: «Он изгоняет бесов не иначе, как силою веельзевула, князя бесовского» ( Мф 12:24 ).'
      cn: 接下来，让我们看看法利赛人的嫉妒和恶意是如何诽谤基督上主的，祂来是为了拯救他们。当上主从人身上赶出鬼魔时，并且「众人稀奇说：在以色列中，从来没有见过这样的事！」——法利赛人却说：「祂赶鬼是靠着鬼王！」（马太福音 9:33-34），又说：「祂赶鬼无非是靠着别西卜，鬼王。」（马太福音 12:24）。
  - type: paragraph
    text:
      ru: Видишь, какую страшную хулу зависть и злоба извергает! Кто может беса изгнать, кроме Бога, Которого трепещет род сей? И как может сатана сатану изгнать, которые равную силу имеют? Надо крепчайшую силу иметь тому, кто хочет связать его и изгнать, и как они друг друга изгонять будут, которые всегда согласны на вред и погибель человеческую?
      cn: 你看，嫉妒与恶毒吐出了何等可怕的亵渎！除了这个族类所战栗的上帝，谁能驱逐邪魔呢？并且，撒旦怎能驱逐撒旦，他们拥有同等的力量呢？凡是想要捆绑他并驱逐他的人，必须拥有最强大的力量。并且，他们怎能彼此驱逐呢，他们总是同谋加害并毁灭人类的？
  - type: paragraph
    text:
      ru: 'Видим здесь:'
      cn: 我们在此看到：
  - type: paragraph
    text:
      ru: '1) Зависть и злоба в ослепление человека приводит, что здесь на фарисеях видим. Приписывают то сатане, что единому Богу приличествует. Сами могут видеть, что изгнать беса есть дело силы Божией, но изрыгают хулу: «Он изгоняет бесов силою князя бесовского» . Так зависть к злобе, а злоба к ослеплению приводит, ослепленный же не знает сам, что делает. О, сколь страшна язва душевная – зависть!'
      cn: 嫉妒与恶意使人陷入蒙蔽，正如我们在此法利赛人身上所见的。他们将那理应归于独一的上帝的，归于撒旦。他们自己能够看到，驱逐邪魔乃是上帝之力的作为，却口出亵渎之言：「他靠着鬼王赶鬼。」如此，嫉妒导致恶意，而恶意又导致蒙蔽，被蒙蔽之人却不知自己所为。哦，这灵魂的创伤——嫉妒，何其可怕！
  - type: paragraph
    text:
      ru: '2) Видим здесь, возлюбленный, чего только не претерпел Иисус, Избавитель наш! Желая нас избавить от власти сатанинской, слышал: «Он изгоняет бесов силою князя бесовского» . И это слышал Тот, во имя Которого и бесы повинуются рабам Его, Тот, от Которого и бесы трепещут, Тот, Который дает власть рабам Своим наступать на змею и скорпиона, и на всю силу вражью, – Его божественные уши слышали хулу: «Он изгоняет бесов силою князя бесовского!.» . Ради нас терпел сие Избавитель наш Господь. Слава милосердию Его!'
      cn: 2) 我们在此看见，蒙爱者啊，我们的救赎者耶稣，忍受了何等多的苦楚！祂切愿将我们从撒旦的权势中解救出来，却听见人说：「祂是靠着鬼王的能力赶鬼。」而那听见此言的，是那连恶鬼也因祂的名而服从祂仆人的，是那连恶鬼也为之战栗的，是那赋予祂仆人权柄去践踏蛇和蝎子，并胜过仇敌一切势力的——祂那神圣的耳朵竟听见了这亵渎之言：「祂是靠着鬼王的能力赶鬼！」为了我们，我们的救赎者上主忍受了这一切。愿祂的慈悲得着荣耀！
  - type: paragraph
    text:
      ru: 3) Христианам истинным надлежит гонение и поношение в мире этом. «Если хозяина дома назвали веелъзевулом, не тем ли более домашних его ?-» утешает Господь христиан ( Мф 10:25 ). Если Господина, Учителя, Главу изгнали, то тем более рабов, учеников и члены духовные Его изгонят. Надо непременно страдать рабам с Господином, ученикам с Учителем, и членам тела с Главою. Христос Господь наш терпел хулы, – надо и нам рабам Его терпеть. Если хотим среди домашних сего великого Господина быть, надо с Ним и терпеть.
      cn: 3) 真基督徒在这世上理应遭受迫害和羞辱。「倘若家主都被称为别西卜，那些他家里的人，岂不更要受辱吗？」主如此安慰基督徒（马太福音 10:25）。倘若主人、导师、头都被驱逐，那么祂的仆人、门徒和属灵的肢体岂不更要被驱逐吗？仆人务必与主人一同受苦，门徒务必与导师一同受苦，身体的肢体务必与头一同受苦。基督，我们的主，忍受了毁谤——我们这些祂的仆人也必须忍受。如果我们想成为这位伟大主人的家属，就必须与祂一同忍受。
  - type: paragraph
    text:
      ru: '4) Поминай, возлюбленный, то время, в которое слышал Господь наш за нас хулы страшные: «Он изгоняет бесов силою князя бесовского, -» и ожидай, что Он скоро с Ангелами Своими придет вновь, уже не терпеть, но «прославиться во святых Своих и явиться дивным в день оный во всех веровавших» ( 2Фес 1:10 ), и предать грешников «в огонь вечный, уготованный диаволу и ангелам его» ( Мф 25:41 ). Близок день тот, и нежданно, как тать в ночи, придет. День ото дня ожидаем его, со дня на день приближается к нам. Будем же готовы, ибо в тот самый час, когда не ожидаем, Сын Божий придет и вострубят трубы, и возбудятся мертвые от начала мира, и престол постав ится, и Судия сядет, окружаемый множеством Ангелов, и предстанут пред Ним все племена земные и народы, и воздаст всем по делам их, и пойдут одни в муку вечную, а другие в жизнь вечную. Поминай день тот.'
      cn: 4) 蒙爱者啊，铭记我们的上主为我们听见了可怖的亵渎之时：「他赶鬼是靠着鬼王的能力，」并期待着，祂将很快与祂的天使们一同再临，不再是忍受苦难，而是「在那日，在祂的圣徒身上得荣耀，又在一切信的人身上显为奇妙」（帖撒罗尼迦后书 1:10），并将罪人「投入那为魔鬼和他的天使们所预备的永火里去」（马太福音 25:41）。那日子近了，且要出其不意地，如同夜间的盗贼一般来临。日复一日，我们期待着它；日复一日，它向我们临近。那么，让我们预备好，因为就在我们意想不到的时刻，上帝之子将来临。号筒将吹响，从创世以来所有已逝者都将复活，宝座将被设立，审判者将坐下，为众多天使所环绕。地上所有的民族和万邦都将站在祂面前，祂将照各人的行为报应各人，有些人将进入永恒的刑罚，另一些人则进入永恒的生命。铭记那日子。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: что Христос Господь отвечал хулящим Его фарисеям?'
      cn: 你问：主基督是如何回答那些毁谤祂的法利赛人的？
  - type: paragraph
    text:
      ru: Ответ. Кротко отвечал им и доказывал, что Он силой Духа Божия, а не веельзевула изгоняет бесов, поскольку сатана сатану изгонять не может, так как все бесы согласны между собой в том, что стараются погубить, а не исцелить человека; кроме того, Тот, кто изгоняет беса, должен быть значительно сильнее его, и прочее. Читай сам, что у евангелиста Матфея написано ( Мф 12:24–37 ).
      cn: 答。祂温和地回答他们并论证，祂是靠着圣灵的能力，而不是靠着别西卜驱逐魔鬼的，因为撒但不能驱逐撒但，所有魔鬼在致力于毁灭而非治愈人这一点上是彼此一致的；此外，那驱逐魔鬼的，必然远比它更强，等等。你自己去读福音书作者马太所记载的（马太福音 12:24-37）。
  - type: paragraph
    text:
      ru: 'Видим здесь:'
      cn: 我们在此看到：
  - type: paragraph
    text:
      ru: 1) Как кротко Господь отвечал хулителям Своим, не укорял их в ответ, но с любовью обличал их и устрашал судом Божиим, чтобы покаялись, как видно из святого Его доказательства и учения. Отсюда учимся мы врагам нашим, которые хулят нас, кротко отвечать или молчать, а не хулить хулящих нас. Если Он, Господь наш и Бог наш, так кротко поступал с хулящими Его, то тем более мы должны делать то же. Мы, говорю, которые достойны всякой хулы, будучи грешниками. Если безгрешный Господь от грешников кротко хулу терпел, то тем более мы, грешники, от грешников терпеть кротко должны. Грехи наши заслужили это, а заслуженное должно с кротостью принимать. Лучше здесь временно от людей терпеть хулу, нежели вечно от дьявола поруганными быть; и хотя хуление по действию бесовскому бывает, но нам по попущению Божию как наказание бывает, и потому должно сие терпеть и Бога благодарить.
      cn: 上主是何等地温和，回应那些亵渎祂的人，不以责骂回击他们，而是以爱心责备他们，并以上帝的审判警示他们，好让他们悔改，正如祂神圣的证据和教导所表明的。从此我们学习到，对于那些亵渎我们的仇敌，要温和地回应或保持沉默，而不是反过来亵渎那些亵渎我们的人。如果祂，我们的上主和我们的上帝，都如此温和地对待那些亵渎祂的人，那么我们更应该如此行。我说，我们这些身为罪人、理应受到一切亵渎的人。如果无罪的上主都能温和地忍受罪人对祂的亵渎，那么我们这些罪人，就更应该温和地忍受罪人。我们的罪恶应得此报，而应得之报应，理当温和地接受。宁可在此世暂时忍受人的亵渎，也比永远被魔鬼凌辱要好。并且尽管亵渎行为是出于魔鬼的作为，但对于我们而言，却是出于上帝的允许，作为一种惩罚，因此，我们应当忍受这一切并感谢上帝。
  - type: paragraph
    text:
      ru: '2) Христос Господь говорит фарисеям: «Если Я силою веельзевула изгоняю бесов, то сыновья ваши чьею силою изгоняют» ( Мф 12:27 )? Апостолы изгоняли бесов, и Иисус Христос изгонял бесов, – едино дело было у учеников и у Учителя и Господа их Иисуса Христа, но они не слышали того от фарисеев, что слышал Господь наш: «Он изгоняет бесов не иначе, как силою веельзевула, князя бесовского» ( Мф 12:24 ). Одно дело делали, но они не слышали, а Господь слышал хулы от злоречивых уст. Что это значит? Нашу совесть, возлюбленный, уязвляет слово хуления, на Господа нашего изрыгаемое. Грехи наши Он взял на Себя, поэтому и казнь на Него за них возложена, и поношения поносящих напали на Него. Преславные делал дела, и удивления достойные: «Никогда не бывало такого явления в Израиле» ( Мф 9:33 ), – и благодеяния, каких более быть не может, показывал, но за все это хулим был. Мы в том виновны: наши грехи и хуления хулили Господа нашего, мы согрешили пред Богом нашим и похулили Его, желая Божией чести с Адамом, праотцем нашим, и достойны были вечного мучения и поношения дьявольского, поэтому Иисус Господь наш за нас вступился, и казнь нашу взял на Себя, и платил за нас правде Божией, и «чего не отнимал, то должен был отдать» ( Пс 68:5 ).'
      cn: 2) 基督主对法利赛人说：「我若靠着别西卜赶鬼，你们的儿子们又靠着谁赶呢？」 (马太福音 12:27) 使徒们赶鬼，耶稣基督也赶鬼，——门徒与他们的教师、主耶稣基督所做的是同一件事，但他们没有从法利赛人那里听到我们主所听到的：「这个人赶鬼，无非是靠着鬼王别西卜啊。」 (马太福音 12:24) 他们所做的是同一件事，但他们没有听到，而主却听到了那恶毒之口的亵渎。这是什么意思呢？蒙爱者啊，那向我们主所发出的亵渎之言，刺痛了我们的良心。祂将我们的罪愆担当在自己身上，因此为这些罪愆的惩罚也加在祂身上，而那些侮辱之人的凌辱也降临在祂身上。祂行了荣耀的作为，值得惊奇的作为：「在以色列中，从未见过这样的事。」 (马太福音 9:33)——并且显出了无人能及的恩惠，但因这一切，祂却受到了亵渎。我们对此有罪：是我们的罪愆和亵渎亵渎了我们的主；我们得罪了我们的上帝，并亵渎了祂，我们与我们的始祖亚当一同渴望上帝的荣耀，因此我们理应遭受永远的苦痛和魔鬼的凌辱。所以我们的主耶稣为我们介入，担当了我们的惩罚，为我们向上帝的公义偿付，而且「我没有抢夺的，却要赔还。」 (诗篇 68:5)。
  - type: paragraph
    text:
      ru: Слава милосердию Его! Помни возлюбленный, что Господь наш за нас, рабов Своих, хулим был, чтобы мы вечную славу получили.
      cn: 荣耀归于祂的怜悯！谨记，蒙爱者啊，我们的主为我们——祂的仆人——受凌辱，好叫我们得以领受永恒的荣耀。
  - type: paragraph
    text:
      ru: 3) Хула, которую фарисеи на Христа Господа изрыгали, в лице Христовом касалась Бога, так как Христос есть Бог, Слово Божие ипостасное, единосущное Отцу и Духу. Рассуди же, как эта хула уязвляла пресвятую душу Его! «Уязвляет всякого человека хула, но царя, или какого высокого человека, более уязвляет, потому что сан и честь высокая в нем хулится. Так и во Христе Господе, та хула, которую Он терпел, чести Божией касалась, и в нас хулился Бог чудодействующий. По виду был как человек, но Бог был истинный, плотью человеческой обложенный. Поэтому, поскольку Бог в нем хулим был, это весьма уязвляло пренепорочную душу Его, потому и показывал хулителям, что они тяжко грешат. Ибо, хотя бы и не верили, что Он Бог был, но дела, которые Он делал, Божиими были, ибо беса изгнать только один Бог может, Которому все повинуются. Помни же, что и прежде страстей Своих страдал ради нас Христос Господь наш. Хотя тела Его и не уязвляли враги Его, но уязвляли божественную душу Его. Да будет имя Его благословенно!
      cn: 3) 法利赛人对主基督所发出的亵渎，在基督的位格中触及了上帝，因为基督是上帝，是上帝本有之圣言，与父和圣灵同质同体。试想，这亵渎如何刺痛了祂至圣的灵魂！「亵渎刺伤每一个人，但对君王或任何尊贵之人，则伤得更深，因为在他身上，其职分和崇高尊荣受到亵渎。同样，在主基督里，祂所忍受的亵渎触及了上帝的尊荣，而那在我们里面行神迹的上帝也因此受到了亵渎。按其外貌，祂是人，但祂是真上帝，取了人的血肉之躯。因此，既然上帝在祂里面受到了亵渎，这便极大地刺痛了祂至洁无瑕的灵魂，所以祂才向那些亵渎者指出，他们犯下了严重的罪。因为，即使他们不相信祂是上帝，但祂所行的事却是上帝的事，因为只有上帝才能驱逐邪魔，万物都顺服于祂。务请记住，我们的主基督，即使在祂受难之前，也为我们受苦。尽管祂的仇敌并未刺伤祂的肉身，但却刺伤了祂神圣的灵魂。愿祂的名受称颂！」
  - type: paragraph
    text:
      ru: '4) Что произошло со Христом Сыном Божиим, то и с рабами Его случается. Христос делал добро, но языками человеческими гоним был. Видим то же и на духовных членах тела Его, видим, как добрые их дела хулят и порочат злые языки. Молитву, воздержание, терпение, кротость, милостыню, смирение и молчание лицемерием и лукавством называют. И что удивительно: то же самое в иных хвалят или молчанием обходят, но в богобоязненном человеке хулят! Оттуда произошли негодные слова, или скорее укоризны: богомол, святоша, пустосвят, и прочие. Так мир нечестивый не любит благочестия, и злой ненавидит добра. Благочестие истинное в сердце пребывает и сокровенно есть, как же можно знать, что у человека в сердце кроется: истина или лицемерие? Но злой язык хулит и порочит то, чего не знает. Берегись хулить всякого человека, ибо не знаешь, что есть в человеке. Человек на внешнее смотрит, но Бог – на внутреннее.'
      cn: 4) 上帝之子基督所经历的，祂的仆人亦会遭遇。基督行善，却被世人的口舌所逼迫。我们在祂身体的属灵肢体上，也看到同样的情形，看到他们美好的善行被恶毒的口舌所诽谤和诋毁。祷告、节制、忍耐、谦和、施舍、谦卑和静默，却被称作虚伪和诡诈。更令人惊讶的是：同样的事情，在其他人身上却受到称赞，或被默然不提，唯独在敬畏上帝之人身上却被诽谤！由此便产生了那些恶劣的称呼，或者更确切地说，是讥讽的言辞：假冒为善者、伪圣徒、空头圣徒等诸如此类。因此，不敬虔的世俗不爱敬虔，邪恶憎恨良善。真正的敬虔寓于内心且是隐秘的，人怎能知道一个人心中隐藏着什么：是真诚还是虚伪呢？然而，恶毒的口舌却诽谤和诋毁它所不了解的。当心诽谤任何人，因为你不知道人的内心究竟如何。人看重外在，但上帝却察看内心。
  - type: paragraph
    text:
      ru: '5) Господь бесноватых исцелял. Помолимся и мы Ему, чтобы и наши души беснующиеся исцелил. Лютые бесы в душе – нечистота, гнев, ярость, злоба, ненависть, зависть и гордыня, и более мучают бедную душу, нежели духи лукавые тело, и не к чему иному, как к вечной смерти ведут. Христос Господь один этих лютых бесов изгнать может. Помолимся же и мы с женою хананейскою: «"Господи» , душа «моя жестоко беснуется: помоги мне» ( Мф 15:22 ); исцели меня, Господи, и исцелюсь». Но всегда помни, что Господь, претерпевший хулу ради нас, придет судить нас, и не только за беззакония, но и за праздное слово воздадим Ему ответ. Он Сам сказал: «Говорю же вам, что за всякое праздное слово, какое скажут люди, дадут они ответ в день суда» ( Мф 12:36 ).'
      cn: 上主医治了被鬼附的人。我们也向祂祈祷，好叫祂也能医治我们被邪灵困扰的灵魂。灵魂中的凶恶邪灵——不洁、愤怒、暴怒、恶毒、仇恨、嫉妒和骄傲——它们折磨贫苦的灵魂，远甚于恶灵折磨身体，它们引向的，唯有永恒的死亡。唯有基督上主能驱逐这些凶恶的邪灵。那么，我们也要和迦南妇人一同祈祷：「「上主啊，」我的灵魂「被邪灵严重困扰：求祢帮助我」（马太福音 15:22）；上主啊，求祢医治我，我便得医治。」但要常记住，上主为了我们忍受了亵渎，祂将要来审判我们，我们不仅要为罪孽，也要为一切空闲的话语向祂交账。祂亲自说过：「我实在告诉你们，凡人所说的每一句空闲的话，在审判之日都必为此交账」（马太福音 12:36）。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Однако примечай и хорошо внимай, возлюбленный:'
      cn: 然而，留意并仔细聆听，蒙爱的：
  - type: paragraph
    text:
      ru: 1) Когда злые языки хулят нас самих, то мы или молчать, или кротко отвечать им должны, так как имя наше и слава ничто есть. Ибо мы земля и пепел, и рабы негодные, и всякого хуления поистине достойны. Человек, сам по себе, ничего, кроме немощи, растления, грехов и окаянства, не имеет, и если что доброе имеет, или делает, то Божие есть, а не его. «Никто не благ, как только один Бог» ( Мф 19:17 ). Если только один Бог благ, то, следовательно, всякий человек сам по себе зол, а злой разве может добро иметь или творить? «Не может дерево худое приносить плоды добрые» ( Мф 7:18 ). Поэтому и похвалы недостоин, но единому Богу похвалу подобает воздавать, как единому благому. Человеку же подобает жалеть и стыдиться, что он злой и негодный раб, ибо у негодного раба и дела негодные. Рассуждение об этом да подвигнет нас к кротости и терпению.
      cn: 1) 当恶语中伤我们时，我们理当保持沉默，或谦恭地回应他们，因为我们的名声和荣耀都算不得什么。因为我们是尘土和灰烬，是不中用的仆役，确实配得一切毁谤。人本身，除了软弱、败坏、罪恶和可悲可叹的光景之外，一无所有；若他有任何美善之处或行出任何善事，那乃是上帝的，而非他自己的。「除了独一的上帝以外，没有人是良善的」（马太福音 19:17）。既然唯有上帝是良善的，那么，每个人就其自身而言都是邪恶的；邪恶之人怎能拥有或行出美善呢？「坏树不能结好果子」（马太福音 7:18）。因此，人不配受称赞，理当将赞美归于独一的上帝，作为独一良善者。人则理当哀叹并羞愧，因他是一个邪恶且不中用的仆役，因为不中用的仆役，其作为亦不中用。对此的反省，愿能激励我们迈向谦恭和忍耐。
  - type: paragraph
    text:
      ru: 2) Когда злой язык имя Божие хулит и честь Его терзает, то тогда должны мы не молчать, но стоять за честь имени Его, и хулителя злоречивые уста заграждать, хотя бы и до излияния крови и лишения жизни нашей следовало дело, что Спаситель наш и в приведенном ответе, и в других случаях показал, и Своим примером нас научил. Ибо любить Бога мы должны более себя самих.
      cn: 2) 当恶毒的舌头亵渎上帝的圣名，并玷辱祂的尊荣时，我们不应保持沉默，而应维护祂圣名的尊荣，并且制止那亵渎者恶毒的口舌，即使为此流血，甚至失去我们的性命，亦在所不惜。这是我们的救主在所引用的回答中，以及在其他场合所显明的，并且以祂自己的榜样教导我们的。因为我们应当爱上帝胜过爱我们自己。
  - type: paragraph
    text:
      ru: '3) Поэтому плохо делают те, которые за свою честь ревнуют, но о Божией чести, когда она хулится, небрегут. Это знак того, что таковые не знают, что есть Бог, что Он Создатель, Промыслитель, Любитель, Благодетель, Господь и Отец всех, и их. Ибо кто за честь господина, отца и благодетеля своего не постоит? Тем более за Божию честь всякому верному рабу Его стоять должно. Ты таковым людям не подражай, но как свою честь ни во что вменяй, так за Божию честь до последней капли крови стой. Помни, что Сам Бог говорит: «Я прославлю» только «прославляющих Меня, а бесславящие Меня будут посрамлены» ( 1Цар 2:30 ).'
      cn: 3) 因此，那些只为自己的尊荣热心，却对上帝的尊荣受亵渎而不屑一顾的人，行事不当。这表明此类人并不知道上帝是何许存在，祂是造物主、护佑者、爱者、施恩者、上主，以及他们和所有人的父。因为谁会不为自己的主、父和施恩者挺身而出呢？更何况，祂的每一个忠仆都应当为上帝的尊荣挺身而出。你不要效法此类人，但你当将自己的尊荣视若无物，却要为上帝的尊荣，直到流尽最后一滴血也要坚守。要记住，上帝亲自说：「我必只荣耀那荣耀我的人，藐视我的，必被轻贱。」 (撒母耳记上 2:30)
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: что значит уничижать Бога?'
      cn: 你问道：羞辱上帝是什么意思？
  - type: paragraph
    text:
      ru: 'Ответ. Уничижает раб господина, когда его поносит и хулит, или слышит, как имя его хулится, но не защищает, или должного ему послушания не показывает, и прочее. Такой раб, хотя и именуется рабом господина своего, но делом показывает, что его господином своим не признает. Так унижает Бога:'
      cn: 答。奴仆贬低主人，当他毁谤和辱骂主人时，或者听见主人的名受辱骂却不维护，或者不表现出对他应有的顺服，等等。这样的奴仆，尽管被称为他主人的奴仆，却以行为表明他不承认他为自己的主人。照样贬低上帝：
  - type: paragraph
    text:
      ru: 1) Тот, кто имя Его явно хулит.
      cn: 凡公然亵渎祂名者。
  - type: paragraph
    text:
      ru: 2) Тот, кто о своей славе старается, а о Божией нерадит.
      cn: 2) 那人致力于自己的荣耀，却不顾及上帝的荣耀。
  - type: paragraph
    text:
      ru: 3) Тот, кто заповеди Его святые презирает и не старается должного послушания Ему оказывать.
      cn: 那藐视祂神圣诫命，且不力求向祂尽上当尽顺从的人。
  - type: paragraph
    text:
      ru: Кто так делает, тот унижает Бога. Рассуждай об этих пунктах, и сам признаешь.
      cn: 凡如此行者，便是贬低上帝。省思这些要点，你自会承认。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Разве не страшно Бога великого и страшного уничижать?
      cn: 难道贬抑伟大而可畏的上帝不可怕吗？
  - type: paragraph
    text:
      ru: Ответ. Подлинно страшно, но и бесстыдно.
      cn: 答。确实可怕，但也无耻。
  - type: paragraph
    text:
      ru: 'Страшно, потому что унижающим Страшный Божий Суд и страшная мука следует. «Мы знаем Того, Кто сказал: у Меня отмщение, Я воздам, говорит Господь. И еще: Господь будет судить народ Свой. Страшно впасть в руки Бога живаго» ( Евр 10:30–31 )!'
      cn: 可怕啊，因为那些轻慢上帝之可怕审判的人，可怕的苦难随之而来。 «我们知道那说这话的：『伸冤在我，我必报应，』上主说。又说：『上主要审判祂的百姓。』落在永生上帝的手里，真是可怕的！」（希伯来书 10:30-31）
  - type: paragraph
    text:
      ru: Бесстыдно, потому что люди уничижают Того, Который их по образу Своему создал, и питает, одевает, и солнцу Своему на них сиять повелевает. Об этом должно людям плакать и рыдать, об том ужасаться и трепетать. Мы же да не будем «ревновать лукавым, ибо они, как трава скоро иссохнут, и как зеленый злак, скоро отпадут» ( Пс 36:1–2 ). Но Господа нашего, Который нас, недостойных, почтил, почтим как Создателя нашего, Искупителя и Благодетеля, страхом, любовью и послушанием. Воздадим Ему, что должно нам, к чему и вера наша, и исповедание наше, и слово Его святое обязывает. «Не Богу ли будет повиноваться душа» наша «?Ибо от Него спасение» наше. «Ибо Он Бог» наш «и Спаситель» наш, «Заступник» наш ( Пс 61:2–3 ). «Знайте, что Господь есть Бог наш. Он сотвори нас, а не мы; мы же народ Его, и овцы паствы Его» ( Пс 99:3 ).
      cn: 这乃是无耻的，因为人们竟贬损那位照祂自己的形像创造了他们、供养他们、赐给他们衣裳、并命令祂的太阳照耀在他们身上的上帝。对此，人们应当哭泣和哀号，为此惊骇和战栗。我们却不可「嫉妒作恶的人，因为他们如同草很快枯干，并像青草很快衰败」（诗篇 36:1-2）。但我们当以敬畏、爱和顺服尊荣我们的上主，祂尊荣了我们这些不配的人，祂是我们的创造主、救赎主和施恩者。我们当献上那当献给祂的，这也是我们的信仰、我们的认信和祂的圣言所要求我们的。「我们的灵魂难道不当顺服上帝吗？因为我们的救恩来自祂。因为祂是我们的上帝和我们的救主，我们的维护者」（诗篇 61:2-3）。「你们当知道，上主是我们的上帝。是祂创造了我们，并非我们自己；我们是祂的子民，也是祂草场上的羊」（诗篇 99:3）。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Спрашиваешь: что значит «не ревновать лукавым?»'
      cn: 你问：『不嫉妒恶人』是什么意思？
  - type: paragraph
    text:
      ru: 'Ответ:'
      cn: 回答：
  - type: paragraph
    text:
      ru: '1) Те люди лукавые, которые Христово имя на себе носят и христианами называются, но внутри ни искры христианства не имеют; Христа исповедуют, но Христа не хотят слушаться. К таким говорит Христос: «Что вы зовете Меня: Господи! Господи! – и не делаете того, что Я говорю» ( Лк 6:46 )? Вкратце таковые христиане называются лицемерами. Таковые под видом христианского имени языческие нравы имеют.'
      cn: 那些奸诈的人，他们身负基督之名，自称为基督徒，但其内心却无一丝基督信仰的火花；他们认信基督，却不愿听从基督。基督对这样的人说：「你们为什么称呼我：『上主啊！上主啊！』却不遵行我所说的话呢？」 (路加福音 6:46) 简而言之，这样的基督徒被称为伪善者。这样的人披着基督徒之名，却行异教之习。
  - type: paragraph
    text:
      ru: 2) Не ревновать им – значит не подражать им, но все делать и жить так, как Божие слово учит и христианская должность требует. Нам Христос, Господь наш, подал житие Свое для подражания, – на Него и будем обращать часто очи наши и подражать его житию, которое видим в святом Его Евангелии.
      cn: 2) 不效法他们——意即不模仿他们，而是凡事照着上帝圣言的教导和基督徒的本分所要求的去行去生活。基督，我们的主，为我们赐下祂的生平作为效法的榜样——我们当常常将目光转向祂，并效法祂的生平，就是我们在祂神圣的福音中所见的生平。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Представляет нам святое Его Евангелие иные многие хулы и поношения, языками фарисейскими и иудейскими на Господа нашего произнесенные, как-то: «Он богохульствует» , ( Мф 9:3 ); «не правду ли мы говорим, что Ты Самарянин и что бес в Тебе?(Нн» 8:48); «Он одержим бесом и безумствует» ( Ин 10:20 ), и прочее.'
      cn: '祂的神圣福音向我们呈现其他许多法利赛人和犹太人用言语向我们的上主说出的亵渎和辱骂，诸如：

        「祂在说亵渎的话」， (马太福音 9:3)；

        「我们说祢是撒马利亚人，并且祢里面有鬼魔，难道不是实情吗？」(约翰福音 8:48)；

        「祂是被鬼魔附着，并且发狂了」， (约翰福音 10:20)，等等。'
  - type: paragraph
    text:
      ru: Читай сам святое Евангелие и увидишь, что спасения ради нашего претерпел Господь наш и Владыка, увидишь, как «пришел» (Господь) «к своим, и свои Его не приняли» ( Ин 1:11 ). Если бы царь к своим рабам пришел избавить их от великого бедствия, и те не только бы не приняли его, но и всякими поносными словами обесчестили и обругали его, – воистину, удивления великого достойно было бы то. Тяжко слышать хуление от равного, тяжелее от низшего и еще тяжелее от подчиненного, что же сказать, если царю (благочестивому) придется хуление слышать от своих подданных, о которых он печется, промышляет и которых хочет блаженными сделать? Воистину велико было бы неистовство таковых людей, которые бы такую неблагодарность царю своему оказали, и как была бы удивительна любовь, милость и терпение царево (если бы незлобиво претерпел сие).
      cn: 请你亲自阅读圣福音，你便会看到，我们的主宰和主为了我们的救恩而忍受了什么，你也会看到，主「来到自己的地方，自己的人却不接待他」（约翰福音 1:11）。倘若一位君王，为了拯救自己的仆役脱离巨大的灾祸而前来，而那些仆役不仅不接纳他，反而用各种侮辱之言羞辱他、谩骂他，——这，确实是极令人惊奇之事。听闻同等之人对己的亵渎已是痛苦，听闻低于自己之人对己的亵渎更甚，而听闻属下之人对己的亵渎则尤为甚。更何况，倘若一位（虔敬的）君王，竟要从他所关怀、眷顾并愿使之得享福乐的子民那里，听闻亵渎之言呢？确实，那些对自己的君王表现出如此忘恩负义之人，他们的狂妄何其之大；而君王的爱、怜悯与忍耐（倘若他能不怀恶意地忍受这一切）又将是何等令人惊叹啊！
  - type: paragraph
    text:
      ru: 'Иисус Господь «пришел к своим, и свои Его не приняли» , и не только не приняли, но и всякими поносными и хульными словами обругали. Не приняли Царя своего, пришедшего спасти их. Обесчестили Почтившего их прошествием Своим, похулили Господа своего, Господа славы похулили; Небесного Царя земные подданные Его обругали, Того обругали, Которого непрестанно хвалят Ангелы, Того обругали, Который хотел собрать их, как птица собирает птенцов своих под крылья свои. Слышал от них Царь их Небесный: «Вот человек, который любит есть и пить вино, друг мытарям и грешникам» ( Мф 11:19 ; Лк 7:34 ); «Он изгоняет бесов силою веельзевула, князя бесовского» ( Лк 11:15 ); «не правду ли мы говорим, что Ты Самарянин и что бес в Тебе?» ( Ин 8:48 ); «Он одержим бесом и безумствует» ( Ин 10:20 ), и прочее. Вот чем воздали Господу, Царю и благодетелю Своему, люди Его.'
      cn: 主耶稣「来到自己的地方，自己的人却不接待祂」（约翰福音 1:11），他们不仅不接待祂，反而用各种羞辱和亵渎的言语辱骂祂。他们不接受那位来拯救他们的君王。他们侮辱了那位以祂的降临尊荣他们者，亵渎了他们的上主，亵渎了荣耀的上主；祂地上的子民竟辱骂了这位天上的君王，辱骂了那位天使们不住赞颂的，辱骂了那位想要聚集他们，如同母鸡把小鸡聚集在翅膀底下一样（马太福音 23:37）的。他们的天上君王从他们那里听到了：「看哪，这个人贪食好酒，是税吏和罪人的朋友」（马太福音 11:19，路加福音 7:34）；「他赶鬼是靠着鬼王别西卜」（路加福音 11:15）；「我们说你是撒马利亚人，并且你被鬼附着，这话难道不是真的吗？」（约翰福音 8:48）；「他被鬼附着，而且发疯了」（约翰福音 10:20），等等。这就是祂的子民报答他们的上主、君王和恩主的方式。
  - type: paragraph
    text:
      ru: Да постыдится человек, не терпящий слышать укоризненного слова, когда Бог такие хулы терпел! Поминай, возлюбленный, время то, в которое Бог во плоти хулы от людей своих терпел. О, темное и мрачное и лютое время, в которое Бог языками человеческими хулим был! О, неистовые языки, которые Благословенного хулили!
      cn: 愿那不能忍受逆耳之言的人蒙羞吧，当上帝忍受了如此多的亵渎时！默想吧，蒙爱者，那段上帝在肉身中忍受了祂子民的亵渎的时光。哦，黑暗、阴沉而残酷的时光，在那段时光里，上帝被人的舌头所亵渎！哦，狂暴的舌头，亵渎了那蒙福者！
  - type: paragraph
    text:
      ru: Так Бог воплотившийся нам благословение исходатайствовал! Так Агнец Божий Иисус взял на Себя грехи наши, и Его бесчестие нам славу исходатайствовало, и претерпленное Им хуление исходатайствовало нам благословение от Отца Небесного.
      cn: 如此，道成肉身的上帝为我们求得了祝福！如此，上帝的羔羊耶稣担当了我们的罪，而祂的羞辱为我们求得了荣耀，而祂所承受的毁谤为我们求得了来自天父的祝福。
  - type: paragraph
    text:
      ru: Благословен Христос Бог, благоволивший так! Да будет имя Его благословенно со Отцом и Святым Духом вовеки, аминь.
      cn: 愿基督上帝受赞颂，祂乐意如此！愿祂的名与父及圣灵一同，世世无穷地受赞颂，阿们。
  - type: paragraph
    text:
      ru: Помни, брат, что Господь, Которого хулили, придет в страшной славе Своей и будет судить людей. За грехи людей хулим был, но за грехи и судить будет людей. Станут пред Ним и цари, и вельможи, и князи, свободные и рабы, и хулители, и уничижители, и грешные, и праведные, и я, и ты, и всякий человек, и никто от суда Его не убежит, хотя и скрыться пожелает.
      cn: 谨记，弟兄，那曾被亵渎的主，将带着祂可畏的荣耀降临，并将审判世人。祂因世人的罪而被亵渎，但祂也将因这些罪而审判世人。众人都将立于祂面前，无论君王、显贵、或公侯，自由人或奴仆，亵渎者或轻蔑者，罪人或义人，无论是我、是你，还是世上每一个人，没有任何人能逃脱祂的审判，即使他渴望隐藏。
  - type: paragraph
    text:
      ru: О, страшный день тот, в который разгневанный Бог, праведный Судия явится! Насколько смиренным и кротким было первое пришествие Его, настолько славным и страшным будет второе. Уже близко оно, ближе, нежели вчера было, и нежданно, как молния, явится. Будем же бодрствовать и молиться, потому что не знаем дня и часа, в который Сын Божий явится.
      cn: 哦，那可怖之日，震怒的上帝，公义的审判者将要显现！祂的第一次降临何等谦卑柔和，祂的第二次降临就将何等荣耀可怖。那日已经临近了，比昨日更近，并且不期而至，如同闪电般显现。那么，我们当警醒祷告，因为我们不知那日子和时辰，上帝之子何时显现。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
- type: heading2
  text:
    ru: Письма 111 – 123
    cn: 书信 111 – 123
  children:
  - type: paragraph
    text:
      ru: Как Иисус Сын Божий, Спаситель наш, претерпел все укорения, поношения, досаждения, порицания и хуления, от иудеев наносимые Ему, видел ты несколько, однако я тебе еще о том представляю, чтобы ты познал, каковы были кротость, терпение, благость, человеколюбие и смирение Иисуса Искупителя нашего, и чтобы у меня, пишущего, и у тебя, слышащего, вообразился в уме прекрасный образ добра. О, когда бы и в душе нашей изобразился сей образ божественный!
      cn: 我们的救主耶稣，上帝之子，经受了犹太人加诸于祂的一切责备、侮辱、恼害、谴责和亵渎，你已有所见，但我仍向你阐明此事，好使你认识到，我们的救赎主耶稣的温柔、忍耐、良善、慈爱世人与谦卑是何等伟大，并使在我这执笔者，以及在你这听闻者心中，浮现出一个美好的良善形像。啊，但愿在我们灵魂深处，也能刻画出这神圣的形像！
  - type: paragraph
    text:
      ru: '1) Нигде не видим, чтобы Он врагов Своих, укоряющих и хулящих Его, укорял: «Будучи укоряем, Он не укорял взаимно» ( 1Петр 2:23 ), – говорит о Нем апостол Его. Мы, хотя и злые, и грешные, и подлинно достойные укорения, когда нас укорит кто, или похулит, тотчас отражаем укорение укорением, как стрелу стрелой: «сам такой», или: «ты лжешь»; или устремляемся на него руками нашими, или на суд влечем его, или злобой снедаемся на него и хотим сторицей отомстить ему. Такой гнев кроется в сердце нашем. Христос, Господь наш, не так поступал: никогда не сотворил того врагам Своим. Все с великой кротостью претерпел. Из этого видим, сколь дивная кротость в божественном сердце Его была.'
      cn: 我们未曾在任何地方见到祂斥责那些斥责和辱骂祂的仇敌。祂的使徒论到祂说：「祂受辱骂的时候，并不还口辱骂」（彼得前书 2:23）。我们，尽管邪恶、有罪，且确确实实配受斥责，当有人斥责我们或辱骂我们时，便立刻以斥责反击斥责，如以箭反箭一般：「你自己也是那样！」或「你撒谎！」；或对他拳脚相加，或将他告上法庭，或被对他的恶毒吞噬，并欲以百倍报复他。如此的愤怒潜藏在我们心中。然而基督，我们的上主，不这样行；祂从未对祂的仇敌做过那样的事。祂一切都以极大的温柔忍受了。由此我们可见，祂神圣的心中是何等奇妙的温柔。
  - type: paragraph
    text:
      ru: '2) Не только не укорял и не мстил никому, хотя мог и словом и жестом всякого поразить, но еще и сожалел о погибели врагов Своих. Потому и плакал о врагах Своих нераскаянных и ожесточенных: «Смотря на него» (Иерусалим, враждебный Ему), «заплакал о нем и сказал: о, если бы и ты хотя в сей твой день узнал, что служит к миру твоему! Но это сокрыто ныне от глаз твоих, ибо придут на тебя дни, когда враги твои обложат тебя окопами и окружат тебя, и стеснят тебя отовсюду, и разорят тебя, и побьют детей твоих в тебе, и не оставят в тебе камня на камне за то, что ты не узнал времени посещения твоего» ( Лк 19:41–44 ).'
      cn: 2) 祂不仅不责备、不报复任何人，即便祂能以言语或姿态击败任何人，祂反而还痛惜祂敌人的沉沦。为此，祂也为祂那些不悔改和刚硬的敌人哀哭：「祂望着城（耶路撒冷，那敌对祂的），就为它哀哭，说：巴不得你在这日子，能知晓那关乎你平安的事！但这事如今已向你眼目隐藏。因为日子将到，你的仇敌必筑起土垒，环绕你，四面困住你，并要扫灭你和你城中的孩童，连一块石头也不留在石头上，因你没有认得你蒙眷顾的时候。」（路加福音 19:41-44）
  - type: paragraph
    text:
      ru: О, сердце, любовью ко врагам горящее!
      cn: 哦，心，因着对仇敌的爱而炽热！
  - type: paragraph
    text:
      ru: О, слезы, текущие из-за погибели врагов!
      cn: 噢，因仇敌覆灭而流淌的泪水！
  - type: paragraph
    text:
      ru: О, плач над врагами погибающими!
      cn: 哦，为灭亡的仇敌哀哭吧！
  - type: paragraph
    text:
      ru: О, Иисусе, вечная любовь! Дай нам сердце такое, сердце, болезнующее о погибели врагов и радующееся о блаженстве их.
      cn: 哦，耶稣，永恒的爱！求祢赐予我们这样一颗心，一颗为仇敌的沉沦而忧伤，又为他们的福祉而喜乐的心。
  - type: paragraph
    text:
      ru: 'Многие из христиан, видя, что враги их впали в беду какую, или сами их по желанию своему уязвив, радуются и говорят: теперь дух мой успокоился. Почему успокоился дух? Вот, мол, враг мой страждет!.. Успокоился дух, но это дух неприязни, который о погибели нашей радуется и о блаженстве сетует. Не так поступал Христос, не так: Он о погибели врагов Своих слезы проливает. Поэтому таковые христиане не Христовы, хотя и христианами называются, потому что духа Христова не имеют. «Если же кто Духа Христова не имеет, тот и не Его» ( Рим 8:9 ). Ибо Дух Христов и над врагами умилостивляется.'
      cn: 许多基督徒，看见他们的仇敌遭遇患难，或者自己随己意伤害了他们，就欢喜地说：现在我的心神安宁了。为何心神会安宁呢？看哪，我的仇敌正在受苦！心神是安宁了，但这乃是仇恨之灵，它为我们的灭亡而欢喜，为我们的福祉而悲叹。基督并非如此行事，绝非如此：他为祂仇敌的灭亡而流泪。因此，这样的基督徒并非属于基督的，尽管他们自称为基督徒，因为他们没有基督的灵。「人若没有基督的灵，就不是属祂的。」（罗马书 8:9）因为基督的灵甚至也怜悯仇敌。
  - type: paragraph
    text:
      ru: 3) Так терпя, n кротко поступая со врагами Своими, и жалея о погибели их, человеколюбец Иисус не о чести Своей, ими пренебрегаемой, беспокоился, но о спасении их усердно старался. Поэтому различно их к покаянию приводил, представляя им Божие милосердие, столько крат им явленное и ими всегда пренебрегаемое, и устрашая их Божиим судом, неминуемым для непокаявшихся.
      cn: 3) 如此忍受，n温柔对待祂的仇敌，并且怜悯他们的灭亡，热爱世人的耶稣并非担忧祂自己那被他们所轻蔑的尊荣，而是为着他们的救恩而殷勤努力。因此，祂便以各种方式引导他们悔改，向他们陈明上帝的慈悲——这慈悲曾如此多次向他们显现，却又总是被他们所轻蔑；并且以那上帝的审判威慑他们，这审判对于不悔改之人来说是不可避免的。
  - type: paragraph
    text:
      ru: '4) Видим благость, человеколюбие, терпение и кротость Иисуса! Видим, что Он делом показал то, что словом сказал о Себе: «Сын Человеческий пришел взыскать и спасти погибшее» ( Лк 19:10 ). «Сын Человеческий пришел не губить души человеческие, а спасать» ( Лк 9:56 ). Отсюда мы все учимся последовать Христу, если хотим Христовыми быть: пастыри с людьми своими поступать, как пастыри, а не как мучители, врагов своих к покаянию приводить, а не мстить, о неисправлении их жалеть, а не радоваться; люди прочие – друг другу с кротостью терпеть, а не укорять и не мстить, о исправлении врагов своих и спасении их стараться, а не об озлоблении их. Ибо так заповедал нам, о христиане, Христос наш: «Я дал вам пример, чтобы и вы делали то же, что Я сделал вам» (вам, людям, Господь и Учитель ваш). «Ибо в вас должны быть те же чувствования, какие и во Христе Иисусе» ( Ин 13:15 ; Флп 2:5 ).'
      cn: 4) 我们看到耶稣的良善、仁爱、忍耐和温良！我们看到，祂以行动显明了祂口中所论及自己之事：「人子来，为要寻找拯救失丧的人」（路加福音 19:10）。「人子来，不是要灭人的性命，乃是要救人的性命」（路加福音 9:56）。由此，我们都学习效法基督，如果我们想要属基督：牧者对待自己的羊群当像牧者，而非像施暴者；将自己的仇敌引领至悔改，而非报复；为他们的未改而哀怜，而非欢喜；其余的人——彼此之间以温良忍耐，而非指摘和报复；努力追求自己仇敌的改善和他们的得救，而非其恶化。因为我们的基督这样吩咐了我们，哦，基督徒们：「我给你们作了榜样，叫你们照着我向你们所做的去做」（你们，世人，你们的主和教师）。「因为你们当以基督耶稣的心为心」（约翰福音 13:15，腓立比书 2:5）。
  - type: paragraph
    text:
      ru: Изменим себя, возлюбленный, и исправим стопы наши, и да последуем стопам смиренного, кроткого и человеколюбивого Иисуса. Пристанем к воинам Его, которые под знаменем Креста Его воинствуют, и последуют Ему верою, кротостью, смирением и терпением, да и нас к Отцу Своему Небесному приведет в страну, в которой жилище веселящихся. Ибо Иисус ведет и приводит туда последующих Ему, а не непоследующих. Рассуждай об этом и внимай.
      cn: 亲爱的，让我们改变我们自己，纠正我们的脚步，让我们跟随谦卑、温柔和仁慈的耶稣的脚步。让我们紧紧抓住祂的士兵，他们在祂十字架的旗帜下作战，并以信心、温柔、谦卑和耐心跟随祂，使祂也能把我们带到祂在天上的父那里，进入那些喜乐之人的土地。因为耶稣带领和带领那些跟随他的人，而不是那些不跟随他的人。想一想并注意它。
  - type: paragraph
    text:
      ru: Спасайся
      cn: 得救吧！
  - type: paragraph
    text:
      ru: 'Вопрошаешь: какие еще неправды делали иудеи Христу, Которого не приняли?'
      cn: 你问道：犹太人对他们所不接受的基督还行过哪些不义之事？
  - type: paragraph
    text:
      ru: 'Ответ. Советовались между собой, как погубить Его, и пытались не раз то убийство учинить: и камнями хотели побить, и возводили на верх горы, чтобы оттуда свергнуть Его. Об этом в святом Евангелии во многих местах повествуется.'
      cn: 回答：他们彼此商议如何消灭他，不止一次地试图杀害他：他们想用石头打死他，并把他带到山顶，从那里推翻他。这是圣福音在许多地方告诉我们的。
  - type: paragraph
    text:
      ru: 'Видишь здесь:'
      cn: 你看到这里：
  - type: paragraph
    text:
      ru: '1) Что зависть делает: к злобе ведет, а злоба не только хулить и злословить, но и к убийству возбуждает.'
      cn: 1 ）嫉妒会做什么：它会导致愤怒，愤怒不仅会导致亵渎和诽谤，还会导致谋杀。
  - type: paragraph
    text:
      ru: О, лютое зло – зависть, и дщерь ее злоба! Так Каин в начале завидовал Авелю, потом озлобился, а в конце концов и убил брата своего. Так сыновья Иакова, позавидовав брату своему Иосифу, возымели злобу на него и хотели убить, и убили бы, если бы Бог, Который был с ним, не сохранил его от убийства. Однако же злобою Иосиф был продан в рабство в Египет.
      cn: 啊，凶恶的罪恶——嫉妒，及其恶毒之女！正如该隐起初嫉妒亚伯，继而心生怨毒，最终杀害了他的兄弟。同样，雅各的儿子们，因嫉妒他们的兄弟约瑟，对他心怀恶毒，并意欲杀害他；若非与他同在的上帝保全他免遭杀害，他们也必将杀害他了。然而，由于这恶毒，约瑟被卖到埃及为奴。
  - type: paragraph
    text:
      ru: Так иудеи вначале позавидовали Иисусу Господу нашему, потом озлобились и от злобы злословили и хулили Его, а потом и убить хотели Его. К такому концу зависть и злоба приводит. Берегись же зависти и злобы, как смертоносных язв душевных, и в начале, как только восстают в сердце, пресекай их мечом глагола Божия и помощью Иисуса. Ибо если не пресечешь, то укрепятся и поразят тебя, и ввергнут душу твою в беднейшее состояние.
      cn: 所以犹太人起初嫉妒我们的主耶稣，然后他们生气，咒诅，恶意亵渎他，然后他们想杀了他。嫉妒和愤怒会导致这样的结局。要小心嫉妒和恶意，就像灵魂的致命伤一样，一开始，一旦它们在心中升起，就用神的话语之剑和耶稣的帮助来压制它们。因为如果你不阻止它，他们会加强并击败你，把你的灵魂投入最贫穷的状态。
  - type: paragraph
    text:
      ru: '2) Видишь здесь, Кого хотели убить злобные: Того, Который пришел спасти их, Который хотел и стремился их собрать, как птица собирает птенцов своих под крылья свои, Который мертвых воскресил, прокаженных очистил, слепых просветил, и прочие бесчисленные благодеяния показал им, – не устыдились замышлять об убиении Такого Благодетеля своего, и не ужаснулись злобные сердца!..'
      cn: 2) 你在此处看见，那些邪恶之人想要杀害的，是谁呢？正是祂——祂降世为要拯救他们；祂曾愿意并力图将他们聚集起来，如同飞鸟将它的雏鸟聚集在翅膀之下；祂使死人复活，洁净麻风病人，开启瞎子的眼，并向他们显明了无数其他的恩惠——他们竟不感到羞耻，密谋杀害他们这样一位恩主，邪恶的心竟不为之颤栗！
  - type: paragraph
    text:
      ru: Видишь, что злоба и зависть делает. Злобные и завистливые и благодетелям не прощают, и против них советуются, как бы повредить и погубить их. Не смотрят на то, кто и каковы те, на кого они дышат злобой. Не рассуждают и не познают добра в них и благодеяния их к себе, но одно только думают, как бы в действие произвести злой умысел свой. Так зависть и злоба ослепляет бедного человека.
      cn: 你看，恶毒和嫉妒会做出什么。恶毒和嫉妒之人甚至不宽恕恩人，并密谋如何伤害并毁灭他们。他们不顾及那些他们所怀恨之人是谁，有何品性。他们不思考，也不辨别出他们身上的良善，以及他们对自己的恩惠；他们只一心想着如何将自己的恶意企图付诸行动。如此，嫉妒和恶毒蒙蔽了可怜的人。
  - type: paragraph
    text:
      ru: О, зависть и злоба, исчадия злобного духа – дьявола! Видишь, как заразил этот родитель злобы сердце человеческое! Видим этого зла довольно на свете, многочисленные примеры обретаются, как злобные и благодетелям своим зла творить не стыдятся и не ужасаются. Всячески старайся храниться от зависти и злобы, чтобы не обладала сердцем твоим. Многие воздерживаются от пищи и питья, и не едят мяса и рыбы, но от зависти и злобы нисколько воздержаться не хотят. И какая из того польза, что тело не употребляет того, что не запрещено, а душа снедается тем, что под страхом смертной казни запрещено? «Всякий, ненавидящий брата своего, есть человекоубийца; а вы знаете, что никакой человекоубийца не имеет жизни вечной, в нем пребывающей, -» говорит апостол ( 1Ин 3:15 ).
      cn: 哦，嫉妒与怨恨，邪恶之灵——魔鬼的孽种！你看，这恶毒之父是何等污染了人心啊！我们看到世上有足够的邪恶，无数的例子表明，那些恶毒之人甚至不羞愧、不恐惧地对他们的恩人行恶。务要竭力保守自己免受嫉妒与怨恨侵蚀，以免它占据你的心。许多人禁食禁饮，不食肉和鱼，却丝毫不想戒绝嫉妒与怨恨。那么，有什么益处呢？身体不摄取未受禁止之物，而灵魂却被那受死亡刑罚威胁而禁止之物所吞噬？「凡恨他弟兄的，就是杀人的；你们知道，凡杀人的，没有永生存在他里面，」使徒说（约翰一书 3:15）。
  - type: paragraph
    text:
      ru: 3) Видим, что искушение и гонение вначале бывает малым, а далее больше восстает. Растет благочестие, растет на него и искушение, и гонение. Что произошло со Спасителем нашим, то случается и с рабами Его верными. Его вначале фарисеи, книжники и иудеи языками гнали, а потом и убить искали. Так Иов святой сначала пострадал от дьявола отнятие имения и детей, а потом и здравия своего отнятие, и умножение внешних и внутренних болезней. То же читаем и о святых мучениках и о прочих святых. Ибо чем человек более противится и борется против дьявола, тем более напастей ему наводит враг. Станем же и мы, возлюбленный, станем крепко против сего врага, и за имя Иисуса Спаса нашего подвигнемся, и на всякое искушение и гонение терпением да укрепимся. Он нам Сам Помощник в подвиге нашем, и Сам подвизался за нас даже до смерти, смерти же крестной.
      cn: 3) 我们看到，诱惑和迫害起初是微小的，之后便会更猛烈地兴起。虔敬越是增长，诱惑与迫害也就越是加剧。我们的救主所经历的，同样也会临到祂忠实的仆人。起初，祂被法利赛人、文士和犹太人以言语迫害，之后甚至寻求杀害祂。同样，圣义人约伯起初受魔鬼所害，失去了他的财产和儿女，之后又失去了他的健康，并增添了外在和内在的疾病。我们在圣殉道者和所有其他圣人身上也读到同样的事。因为人越是抵挡并与魔鬼争战，仇敌就越是给他带来更多的苦难。那么，我亲爱的弟兄，让我们也坚定地对抗这个仇敌，并为我们救主耶稣之名而奋争，并在一切诱惑和迫害中以忍耐得以坚固。祂亲自是我们在这场奋争中的帮助者，并且祂亲自为我们而奋斗，甚至至于死，就是死在十字架上。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: что Господь делал с пытавшимися Его убить?'
      cn: 你问道：主对那些试图杀害祂的人做了什么？
  - type: paragraph
    text:
      ru: Ответ. Читаем в Евангелии, что уклонялся от убийц Своих, так как еще не пришло время вольного Его страдания и смерти, которую должен был вкусить за наше спасение.
      cn: 回答。我们在福音书上读到，祂躲避那些要杀害祂的人，因为祂自愿受苦与受死的时辰尚未到来，这苦难与死亡是祂本应为我们的救赎而尝受的。
  - type: paragraph
    text:
      ru: 'Ты здесь примечай:'
      cn: 你在此处注意：
  - type: paragraph
    text:
      ru: 1) Уклонялся от злобных убийц Тот, Который имеет власть над жизнью и смертью, Который мог или устрашить их, или удержать от злого их дела, или поразить врагов Своих словом и жестом единым, но не делал того, не являл всесильной власти Своей, а поступал так, как немощный и смиренный человек, хотя и был Богом и Господом всех. Так изволилось Ему ради нас смириться и терпеть, чтобы избавить нас от убийцы и врага нашего дьявола, который нас ядом своим умертвил. Мы, ядом того врага зараженные, против восстающих на нас восстаем и руки свои на них подымаем, а Христос сего не сотворил, но благоволил уклоняться от злобы, убийством дышащей, хотя и мог праведно поразить убийц Своих. Слава смирению, кротости и терпению Его!
      cn: 那一位拥有掌管生死之权柄者，却避开了恶毒的杀人者；祂本可恐吓他们，或阻止他们行恶，或仅凭一言一举便击败祂的仇敌，但祂却没有如此行，没有彰显祂的全能权柄，而是像一个软弱谦卑的人一样行事，尽管祂是众人的上帝与上主。祂为了我们，甘愿如此谦卑忍耐，好将我们从杀人者和我们的仇敌魔鬼手中解救出来，那魔鬼曾用它的毒致我们于死地。我们，被那仇敌的毒所感染，起来攻击那些起来攻击我们的人，并举手攻击他们；但基督却没有如此行，却乐意避开那充满杀戮之气的恶意，尽管祂本可公义地击败那些企图杀害祂的人。荣耀归于祂的谦卑、温柔与忍耐！
  - type: paragraph
    text:
      ru: 2) Не хотел человеколюбец Господь наш врагов Своих погубить, но уклонялся от них. Что это, как не благость Его, которая ожидала их покаяния? Что, как не любовь Его, которая и над врагами умилостивляется?
      cn: 2) 我们仁爱的主不愿毁灭祂的仇敌，却避开了他们。这又是什么呢，不正是祂等候他们悔改的良善吗？这又是什么呢，不正是祂甚至对仇敌也施予怜悯的爱吗？
  - type: paragraph
    text:
      ru: 'Видишь сердце Иисусово, и о врагах своих милосердствующее! Видишь любовь Его, и врагов объятиями своими обымающую! Поэтому, когда не приняли Его самаряне, и ученики говорили Ему: «Господи! хочешь ли, мы скажем, чтобы огонь сошел с неба и истребил их, как и Илия сделал ? Но Он, обратившись к ним, запретил им и сказал: не знаете, какого вы духа; ибо Сын Человеческий пришел не губить души человеческие, а спасать» ( Лк 9:54–56 ).'
      cn: 你看到了耶稣的心，对你的敌人充满怜悯！你看到他的爱，你的敌人拥抱他们的敌人！因此，当撒玛利亚人没有接待他，门徒对他说： 「主啊，你要我们吩咐火从天上降下来，烧灭他们，像以利亚一样吗？耶稣转过身来斥责他们，说：「你们不晓得自己是怎样的灵，因为人子来，不是要灭人的性命，乃是要救人的性命」（路加福音 9:54-56）。
  - type: paragraph
    text:
      ru: О, милосердный и кроткий дух! О, утешительные слова Божия Слова! «Сын Человеческий пришел не губить души человеческие, а спасать» .
      cn: 哦，仁慈而温柔的灵！哦，出自上帝圣言的慰藉话语！«人子来不是要毁灭人的灵魂，而是要拯救。»
  - type: paragraph
    text:
      ru: Мы злом за зло и досаждением за досаждение воздаем, хотя и достойны всякого зла и досаждения, потому что грешные, но Иисус, высший всякой чести, не хотел судить досадивших Ему. Видишь благость и человеколюбие Иисусово! Будем же приступать с покаянием ко Иисусу, такому милосердному Господу нашему, Который и желавших Его убиения не хотел погубить. Кающихся ли и ищущих у Него милости погубит? Никак, ибо это противно благости Его. Слава благости Его и милосердию!
      cn: 我们以恶报恶，以恼恨报恼恨，虽然我们配受一切的恶和恼恨，因为我们是罪人，然而耶稣，超乎一切尊荣之上者，不愿审判那些冒犯祂的人。你看耶稣的良善与仁爱！让我们带着悔改的心来到耶稣面前，祂是如此慈悲的我们的主，甚至不愿毁灭那些想要杀害祂的人。祂会毁灭那些悔改并向祂寻求怜悯的人吗？绝不，因为这与祂的良善相悖。荣耀归于祂的良善与慈悲！
  - type: paragraph
    text:
      ru: 3) Господь тем, что уклонялся от губительных рук, хотя и мог Себя иначе сохранить, подал нам пример уклоняться от враждующих на нас, уступать им, хотя бы и могли противиться им. Хочет Христос, чтобы христиане в сем деле безоружными были, хочет, чтобы они врагов своих не оружием, а смирением и кротостью побеждали. Христиане должны быть, как овцы смиренные и кроткие, которые всем и малейшим скотам уступают и в одном пастыре своем убежище находят. Для них пришел Пастырь их Иисус, Который врагов Своих кротостью и терпением побеждал. Им должно вооружаться на одного только общего врага-дьявола, который смирением, а не гордостью, терпением, а не гневом побеждается.
      cn: 3 ）主藉着躲避那些毁灭性的手，虽然祂本可以保全自己，却给了我们一个榜样，来躲避那些敌视我们的人，向他们屈服，即使他们可以抵挡他们。基督希望基督徒在这件事上手无寸铁，希望他们不是用武器，而是用谦卑和温柔来打败他们的敌人。基督徒应该像谦卑温顺的羊，屈服于所有最小的动物，在一个牧羊人身上找到避难所。他们的牧羊人已经为他们而来耶稣，他以温柔和耐心战胜了他的敌人。他们应该武装自己，只对抗一个共同的敌人，魔鬼，魔鬼以谦卑，而不是骄傲，耐心，而不是愤怒被击败。
  - type: paragraph
    text:
      ru: 4) Отсюда учимся не вдаваться безрассудно в напасть, но уклоняться от нее. Ибо если Господь, Который всесильной Своей властью все мог делать, уклонялся до времени от напасти, то тем более нам, немощным, надо это делать. Мужественному и великодушному сердцу свойственно не вдаваться в напасть, но пришедшую напасть терпеть, и не унывать в ней, и не ослабевать.
      cn: 4 ）从这里，我们学会不要鲁莽地进入攻击，而是要逃避攻击。因为如果主凭着祂无所不能的力量能够做一切，暂时逃避逆境，那么我们这些软弱的人就更必须这样做。勇敢和慷慨的心通常不会发动攻击，而是忍受已经发生的攻击，而不是在其中失去信心，而不是削弱。
  - type: paragraph
    text:
      ru: '5) От примера благого и человеколюбивого Иисуса Господа нашего учимся благими быть ко врагам нашим и злобу их нашей любовью побеждать. Ибо от этого познается христианское сердце. Об этом поучает нас Христос Господь наш: «Любите врагов ваших» ( Мф 5:44 ), и прочее. «Если вы будете любить любящих вас, какая вам награда?Не то же ли делают и мытари» ( Мф 5:44, 46 )? Любящих любить и благотворящим благотворить свойственно человеку, но ненавидящих любить и творящим зло благотворить – свойственно человеку-христианину, который дух Христов в себе имеет. Надо же всякому христианину дух Христов иметь. «Если же кто Духа Христова не имеет, тот и не Его» ( Рим 8:9 ).'
      cn: 5 ）从善良和爱我们的主耶稣的榜样，我们学会善待我们的敌人，并用我们的爱克服他们的愤怒。因为基督徒的心是众所周知的。这就是我们主基督所教导我们的：「要爱你们的仇敌」（马太福音 5:44） ，以此类推。「如果你爱那些爱你的人，你会得到什么奖励？税吏不是也这样做吗？」 （马太福音 5:44，46）爱爱善行善的人是人，恨爱恶的人是人行善是基督徒所特有的，他里面有基督的灵。每个基督徒都应该有基督的灵。「若有人没有基督的灵，他也必没有」 （罗马书 8:9）。
  - type: paragraph
    text:
      ru: 'Да поминаем же, возлюбленный, то время, в которое Всесильный от злобы человеческой уклонялся и скрывался. Нас ради, грешных, творил это Господь наш, Который пришел в мир спасти нас. Он же придет вновь, но уже судить мир придет, придет и не замедлит. Он Сам говорит нам: «Бодрствуйте, потому что не знаете, в который час Господь ваш приидет» ( Мф 24:42 ). Приближается то время, день и час, ближе сегодня, нежели вчера было, и неожиданно услышится вопль: «Вот, жених идет, выходите навстречу ему» ( Мф 25:6 )! Помышляй о том времени и внимай себе.'
      cn: 那么，蒙爱者啊，愿我们记念那段全能者因着人的邪恶而退避隐藏的时光。我们的主，为了我们这些罪人，成就了此事，祂来到世上为要拯救我们。祂必将再次降临，但这一次，祂降临为要审判世界，祂将降临，且不迟延。祂亲自对我们说：「你们要警醒，因为你们不知道你们的主将在哪个时辰来临」（马太福音 24:42）。那日期，那日子，那时辰正在临近，今日比昨日更近了，并且忽然间将听到呼喊声：「看哪，新郎来了，你们出来迎接祂吧！」（马太福音 25:6）！默想那时刻，并省察自己。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Просишь ты, чтобы я далее сообщил тебе о спасительных действиях Сына Божия – Господа нашего. Я тебе, как прежде, так и ныне из святого Его Евангелия их привожу. Слушай же и рассуждай. Господь наш, зная, что Ему непременно следует от книжников, фарисеев и архиереев иудейских пострадать, неоднократно о том предсказывал ученикам Своим, говоря, «что Сыну Человеческому должно много пострадать, и быть отвержену старейшинами, первосвященниками и книжниками, и быть убиту, и в третий день воскреснуть» ( Лк 9 и в других местах).
      cn: 您要求我进一步告知您神的儿子，我们的主的救赎行动。我以前和现在都从祂的神圣福音中把它们带给你们。倾听和理智。我们的主知道他必定受犹太人的文士、法利赛人和大祭司的苦难，反复向他的门徒预言这一点，说： 「人子必须受许多苦，被长老、大祭司和文士弃绝，被杀，第三次复活的日子」（路加福音9章和其他地方）。
  - type: paragraph
    text:
      ru: 'Учимся здесь:'
      cn: 在此了解详情：
  - type: paragraph
    text:
      ru: '1) Господь, предсказывая страдания и смерть Свою апостолам, показывал им, и через них нам, что Он волею Своею желает испить чашу страдания и смерти, об этом и прямо говорил: Потому любит Меня Отец, что Я отдаю жизнь Мою, чтобы опять принять ее. Никто не отнимает ее у Меня, но Я Сам отдаю ее. Имею власть отдать ее и власть имею опять принять ее ( Ин 10:17–18 ). Отец благоволил, чтобы чашу сию испил Сын за спасение наше, и Сын соизволил чашу ту испить, и так спасение совершить, и был послушным даже до смерти, и смерти крестной ( Флп 2:8 ).'
      cn: 1 ）主向使徒预言苦难和祂的死，向他们并通过他们向我们表明，祂要凭着祂的旨意喝那苦难和死亡的杯，并直接说：因为父爱我，所以我牺牲我的生命来再次接受它。没有人把它从我身上拿走，但我自己把它给了别人。我有能力放下它，我有能力再次拿起它（约翰福音 10:17-18）。父亲很高兴儿子为了我们的救赎而喝这杯，儿子屈尊喝它，所以救赎甚至服从到死，到十字架的死（腓立比书 2:8）。
  - type: paragraph
    text:
      ru: 'Видишь любовь Отца Небесного к нам: Сына Своего не пощадил, но предал Его за всех нас ( Рим 8:32 ). Видишь также и любовь Сына к нам: волею за нас предал Себя на смерть, душу Свою за нас положил, чтобы наши погибшие души обрести. Слава благоволившему Отцу, слава Сыну соизволившему, и Святому Духу животворящему и обновляющему нас!'
      cn: 你看到天父对我们的爱：祂不顾惜祂自己的儿子，却为我们众人舍了祂（罗马书 8:32）。你也看到上帝之子对我们的爱：祂甘愿为我们受死，为我们舍弃自己的灵魂，为要寻回我们失丧的灵魂。荣耀归于那乐意如此行的父，荣耀归于那甘愿如此行的子，以及那使我们活过来并更新我们的圣灵！
  - type: paragraph
    text:
      ru: 2) Прежде страдания, страдание терпел Иисус Господь наш. Ибо видел, сколь великие и ужасные должен будет терпеть страдания, да еще от Своих людей, от тех, к которым послан был и от которых по плоти произошел. Видел, что один из Его учеников за малую цену предаст Его в руки беззаконных. Видел, что оплюют, уязвят, поругаются, осудят и пригвоздят Его ко кресту. Все это видел, и тем Божественная Его душа уязвлялась, и прежде страсти еще страдала. Ибо известно, что предвидение и неизбежность ожидаемой напасти не менее душу смущает и опечаливает, чем сама пришедшая напасть. Но однако любовь к Небесному Своему Отцу и милосердие к погибшему человеку превозмогало. Изводилось Ему лучше все терпеть, нежели видеть, как Бог человеческим грехом раздражен и разгневан, и оставить бедного человека во власти дьявольской и погибели.
      cn: 2) 在受难之前，我们的主耶稣就已忍受了苦难。因为祂预见到将要忍受何等巨大和可怕的苦难，而且这些苦难竟是来自祂自己的人民，来自祂被差遣去的人，以及按肉身而言是祂的族人。祂预见到祂的一位门徒将以微薄的价钱，把祂出卖给那些不法之徒。祂预见到祂将要被唾弃、被凌辱、被嘲弄、被定罪，并被钉在十字架上。祂预见到这一切，因此祂神圣的灵魂受到刺痛，甚至在受难之前就已经在受苦了。因为众所周知，对预期的灾祸的预见及其不可避免性，对灵魂的困扰和悲伤，丝毫不亚于灾祸真正降临时的感受。然而，祂对祂天父的爱以及对失丧之人的怜悯却超越了这一切。祂宁愿忍受一切，也不愿眼见上帝因人类的罪恶而被激怒和震怒，从而将可怜的人类遗弃在魔鬼的权势和永恒的沉沦之中。
  - type: paragraph
    text:
      ru: Видишь, что Иисус ради нашего спасения Себя презрел, и хотя не телом, но святой душой Своей во все время жития на земле страдал. Слава любви и милосердию Его к нам, недостойным! Воздадим и мы Ему любовь за любовь и заповеди Его святые из любви исполним.
      cn: 你看，耶稣为我们的救赎虚己，虽然不是以肉身，却是以祂圣洁的灵魂在世为人的所有时日里受苦。荣耀归于祂对我们这些不配之人的爱和怜悯！我们也当以爱还爱祂，并因爱祂而遵守祂圣洁的诫命。
  - type: paragraph
    text:
      ru: '3) Заранее предсказывал Господь ученикам Своим о страданиях Своих, дабы не усомнились и не соблазнились ими, когда на самом деле увидят страждущим Того, Которого видели чудеса творящим, Господа своего, не поколебались бы сердцами своими о Нем, но познали, что Тот, Который страдания Свои предсказывал, волей Своей их претерпевает. Ибо предвиденная и потом пришедшая беда не так смущает человека, как неожиданно пришедшая, и, приготовившись, ожидаемую напасть встречаем великодушнее, нежели нечаянно впав в нее. Поэтому Господь объявил ученикам Своим и о Своих страданиях, и об их, и о прочих гонениях верных, и скорбях, в мире с ними случающихся: «В мире будете иметь скорбь» ( Ин 16:33 ).'
      cn: 3 ）主提前向门徒预言祂的苦难，使他们不会怀疑和被试探，而实际上他们会看到唯一的苦难，他们看到了施行奇迹的人，他们的主，他们的心不会因为祂而动摇，但他们会知道，预言祂苦难的人是按照祂的旨意受苦的。因为预见到然后发生的灾难并没有像意外发生的灾难那样让人尴尬，而且，在做好准备后，我们遇到了预期的攻击比不小心掉进去更慷慨。因此，主向祂的门徒宣讲祂的苦难，以及这些苦难，还有对信徒的其他迫害，以及世上发生在他们身上的苦难： 「在世上你们必有苦难」 （约翰福音 16:33）。
  - type: paragraph
    text:
      ru: 'Помышляй об этом слове: «В мире будете иметь скорбь» . Слово это не только апостолам, но и всем верным сказано. Не банкеты и веселье, но скорби, гонения и кресты предлагаются нам в мире. Приготовим же себя к скорби, да находящую великодушно претерпим. Господь наш за нас показал Себя готовым на всякую скорбь и страдание, – покажем и мы себя за имя Его на все готовыми.'
      cn: 思想这句圣言：「在世上你们有苦难」（约翰福音 16:33）。这句圣言不仅是说给使徒们的，也是说给所有忠信者的。在世上呈现在我们面前的，不是宴席和欢乐，而是苦难、迫害和十字架。那么，让我们预备好自己去面对苦难，好让我们能够慷慨地忍受所遭遇的一切。我们的上主为我们自己显明祂已预备好承受一切苦难和痛苦——那么，我们也当为祂的名显明自己已预备好面对一切。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: что значит показать себя готовым на все?'
      cn: 你问及：显示自己已做好万全准备，这意味着什么？
  - type: paragraph
    text:
      ru: Ответ. Что ни случится с нами скорбное, все безропотно и благодарно терпеть. Укорят ли нас люди и похулят, не укорим и не похулим в ответ. Отнимут у нас имение наше, оставим им. Уязвят нас, мстить им да не будем. В темницу нас заключат, да не ропщем, но претерпим. В изгнание пошлют, веселыми ногами пойдем. На смерть осудят и предадут, не отречемся. Это и значит готовыми быть на все.
      cn: 回答：无论我们在哀悼中发生什么，都要温顺和感恩地忍受。人们是否责备和诅咒我们，不要责备和诅咒作为回应。他们会从我们这里拿走我们的财产，我们会把它留给他们。他们会杀了我们，让我们不要报复他们。他们会把我们关进监狱，让我们不要低声抱怨，而是要忍受。他们将被流放，我们将以快乐的脚步前进。他们将被定罪并背叛至死，我们不会否认这一点。这就是做好一切准备的意思。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Что значит: быть ненавидимым за имя Христово?'
      cn: 为基督的名被憎恨是什么意思？
  - type: paragraph
    text:
      ru: 'Ответ. Если живем по правилу слова Христова, если миру не сообразуемся, если не сообщаемся злым делам злых людей, если Христа любим, почитаем и заповеди Его соблюдаем, не делаем то, что миру угодно, но то, что Христу угодно, и гонение за это страждем, – тогда за имя Его страждем. Словом, когда страждем не как убийцы, или воры, или злодеи, или иные грешники, но как христиане, тогда за имя Христово страждем. Ибо мир Христа и благочестие не любит, потому не любит и истинных христиан. Так бывает и у сынов века сего. Кто не любит отца, тот не любит и детей его. Кто ненавидит господина, тот ненавидит и рабов его верных. Кто гонит хозяина, тот гонит и домашних его. Кто злобится на человека, злобится и на верных его друзей и приятелей. Видишь эту истину? Примечай, не так ли бывает? Так злой мир, ненавидя Христа Господа, ненавидит и верных его рабов. Об этом Христос предсказал: «Будете ненавидимы всеми за имя Мое» ( Мф 10:22 ).'
      cn: 答。如果我们按照基督话语的法则生活，如果我们不效法这世界，如果我们不与恶人的恶行交通，如果我们爱慕基督，尊崇祂，并遵守祂的诫命，不做这世界所喜悦的事，而是做基督所喜悦的事，并为此受苦受难，——那么我们就是为祂的名受苦受难。简而言之，当我们受苦受难，不是因为我们是杀人犯、盗贼、作恶者或其他的罪人，而是因为我们是基督徒时，那么我们就是为基督的名受苦受难。因为世界不爱基督和虔敬，因此也不爱真正的基督徒。这在今世之子身上也是如此。谁不爱父亲，谁就不爱他的孩子。谁憎恨主人，谁就憎恨他忠实的仆人。谁迫害主人家，谁就迫害他的家人。谁对一个人心怀恶意，谁也对他的忠实朋友和伙伴心怀恶意。你看到这个真理了吗？留意一下，难道不是这样吗？同样，这邪恶的世界，憎恨主基督，也憎恨祂忠实的仆人。关于这一点，基督曾预言说：「你们将为我的名被众人憎恨」（马太福音 10:22）。
  - type: paragraph
    text:
      ru: Примечай и то, что пока человек в согласии с миром этим живет и угождает миру, то, что ни делает (плохого), мир как бы не видит того, – все его дела скрыты, потому что миру любезным чадом является. Но когда презрит мир и Христу угождать начнет, тогда – откуда что возьмется? Откуда сплетни и пересуды? И что бы он ни делал, все переиначивают и для его поношения и озлобления перетолковывают. Так, когда оставляет человек мир – оставляет и его мир, гонит. Иными словами, если любит правду и благочестие человек, – гонит и озлобляет его мир. Приходит ко Христу, – и мир изгоняет его как непотребного, и, как море мертвое тело, его извергает от себя.
      cn: 也要留意，只要人与这世界相合而活并取悦于世界，无论他做了什么（坏事），世界仿佛都看不见，他的一切行为都被掩藏起来，因为他是世界所钟爱的孩子。但当他轻视世界并开始取悦于基督，那时——一切缘何而起？诽谤与议论从何而来？无论他做什么，都被颠倒曲解，并被解释为是为了羞辱和激怒他。如此，当人离弃世界，世界也离弃他，并驱逐他。换言之，如果人热爱真理和虔敬，世界就会驱逐他并激怒他。他归向基督，世界便将他当作无用之人驱逐出去，并且，如同大海吐出死尸一般，将他从自己里面吐出来。
  - type: paragraph
    text:
      ru: 'Видишь, что за имя Христово ненавидимы рабы Христовы, или теми, кто не исповедует имени Христова, или лжебратией и лицемерными христианами. Видишь, каково состояние христиан в мире этом! Как Господа их гнал мир, так и рабов Его гонит. Неложно слово Господне: «Если хозяина дома назвали веелъзевулом, не тем ли более домашних его» ( Мф 10:25 )? «В мире будете иметь скорбь» ( Ин 16:33 ). Но «претерпевший до конца спасется» ( Мф 10:22 ).'
      cn: 你可见，基督的仆役们，或被不承认基督之名的人，或被假弟兄和虚伪的基督徒，都因基督之名而受憎恨。你可见，基督徒在这世上的境况如何！世界如何逼迫他们的上主，也照样逼迫祂的仆役。上主的话语并非虚假：「人既称家主为别西卜，何况是他的家人呢？」(马太福音 10:25) 「在世上你们有苦难。」(约翰福音 16:33) 但「惟有忍耐到底的，必然得救。」(马太福音 10:22)
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Пишешь, что тяжко человеку все терпеть?
      cn: 你是否写道，一个人很难忍受一切？
  - type: paragraph
    text:
      ru: 'Ответ. Тяжелее будет от Христа слышать: «"Не знаю вас, откуда вы» ( Лк 13:27 ). Вы не знали Меня во смирении Моем, и Я вас не знаю ныне в гордости вашей. Не последовали вы Моему смирению и терпению, не войдете ныне и в славу Мою. Не последовали вы стопам Моим, как рабам должно, и Я ныне за рабов Моих вас не признаю. Слышу от вас: «Господи, Господи, -» но не вижу в вас знамения рабов Моих. Не слушали вы Меня тогда, когда Я звал вас в царство Мое, не слушаю и Я вас ныне, зовущих. «Отойдите от Меня все делатели неправды"» ( Лк 13:27 ).'
      cn: 回答：很难听到基督说：「我不知道你从哪里来」（路加福音 13:27）。你们在我的谦卑中不认识我，我现在在你们的骄傲中不认识你们。你没有跟随我的谦卑和耐心；你今天不会进入我的荣耀。你没有像仆人那样跟随我的脚步，现在我不承认你是我的仆人。我听见你说：「主啊，主啊」，但在你身上看不见我的仆人的迹象。我呼召你们进入我的国度时，你们不听从我，我今天也不听从你们。呼叫者。「你们这些作孽的人，离开我去吧」 （路加福音 13:27）。
  - type: paragraph
    text:
      ru: Видишь, как тяжко будет слышать в последний день от Христа такие слова тем, которым тяжко было здесь терпеть и последовать стопам Христовым. Он не признает за раба Своего того, кто не последует Ему, Господину своему. «Кто не берет креста своего и следует за Мною, тот не достоин Меня» ( Мф 10:38 ). Если Христа недостоин, то кого достоин, как не противника Его? Тяжко было и Христу Господу нашему крест нести, нашими грехами отягощенный, но с радостью понес, чтобы нас видеть спасенными. Нам ли рабам, достойным всякой казни и мучения, стыдиться и отказываться терпеть все ради имени Его и своей великой пользы? Крест и страдание христианское для мира есть безумие, но для христиан – премудрость и слава. Плоть и кровь этого стыдится и ужасается, но дух радуется о том. Да уступит же плоть и покорится духу, а дух да торжествует. Христианская добродетель состоит в победе над самим собой, над плотью и над миром.
      cn: 你看到，对于那些在这里难以忍受和跟随基督脚步的人来说，在最后一天听到基督的这些话是多么困难。他不承认不跟随他的主就是他的仆人。「凡不背起自己的十字架来跟从我的，就不配作我的门徒」 （马太福音 10:38）。如果他不配得基督，如果不是他的对手，他配得谁呢？我们的主基督也很难背负十字架，背负着我们的罪，但他很高兴看到我们得救；难道我们要感到羞耻，拒绝为了他的名和我们自己的大利益忍受一切吗？奴隶们值得每一场瘟疫和折磨吗？十字架和基督徒对世界的痛苦是疯狂的，但对基督徒来说，这是智慧和荣耀。血肉之躯感到羞愧和恐惧，但灵魂却为此而欢欣鼓舞。让肉体屈服，顺服于灵，让灵得胜。基督徒的美德在于战胜自己，战胜肉体，战胜世界。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Какая радость может быть о кресте?
      cn: 十字架能带来什么喜乐？
  - type: paragraph
    text:
      ru: 'Ответ:'
      cn: 回答：
  - type: paragraph
    text:
      ru: '1) Разве ты не слышишь, что апостол говорит: «Господь, кого любит, того наказывает; бьет же всякого сына, которого принимает» ( Евр 12:6 ). Какая большая радость и утешение может быть, как быть любимым Богом и в отеческую Его милость быть принятым? Крест и страдание – это знак отеческой Божией любви к нам.'
      cn: 1 ）你没有听见使徒说： 「上主管教他所爱的人，管教他所收纳的每一个儿子」 （希伯来书 12:6）。会有多么大的喜乐和安慰，一个人如何能被神所爱，并因祂父性的怜悯而被接纳？十字架和苦难是神对我们父爱的标志。
  - type: paragraph
    text:
      ru: 2) Сколь радостно люди ходят за царем земным, и куда идет, последуют ему – сам ты это видел, или слышал, или, может быть, и случилось тебе самому. Сколь несравненно радостнее христианам идти за Христом, Царем Небесным, и последовать стопам Его, и сообщаться Христовым страстям, поношение Христово носить, со Христом страдать и терпеть, и сообразоваться Ему! Все это для мира есть безумие, но для христиан – премудрость, честь, похвала и слава. Не в том состоит честь и похвала воина, чтобы ему только воином слыть, но в том, чтобы храбро против врагов подвизаться. И христианина, воина Христова, слава и похвала в подвиге состоит, не в имени, но в самом делании, когда он не только имя Христово носит на себе, показывая, что он христианин есть, но когда он последует Царю своему, когда сообразуется Ему, когда делает то, что делал Царь его и Господь. На такого воина и подвиг его Царь Небесный с небес смотрит, хвалит его и радуется о нем. Какая большая радость, какое большее утешение может быть духу христианина, как сообразоваться Царю своему Небесному и угодное Ему пред очами Его делать?
      cn: 2) 人们何等喜乐地追随地上的君王，无论他往何处去，他们都跟随他——你自己曾见过，或听过，或许也曾亲身经历过。对于基督徒而言，追随基督，天上的君王，并追随祂的脚踪，分受基督的苦难，忍受基督的凌辱，与基督一同受苦并忍耐，又效法祂，是何等无可比拟地更喜乐啊！所有这一切在世人看来是愚拙，但对基督徒而言，却是智慧、尊荣、颂赞与荣耀。战士的尊荣和颂赞，不在于他仅仅被称作战士，而在于他勇敢地与敌人争战。基督徒，这基督的战士，其荣耀和颂赞在于其功业，不在于名，而在于实际的行动中；当他不仅将基督的名带在自己身上，表明他是基督徒，而且当他追随他的君王，当他效法祂，当他行他君王和上主所行的事。天上的君王从天上垂顾这样的战士和他的功业，称赞他，并为他欢喜。对于基督徒的心灵而言，还有什么更大的喜乐，什么更大的慰藉，能比得上效法他天上的君王，并在祂的眼前行祂所喜悦的事呢？
  - type: paragraph
    text:
      ru: '3) Смотри и рассуждай, что Господь крестоносцам и страдальцам говорит: «Блаженны вы, когда будут поносить вас и гнать и всячески неправедно злословить за Меня» ( Мф 5:11 ). Видишь, кого ублажает Христос, Истина, никогда не лгущая: не богатых, не славных, не в роскоши живущих, не сластями питающихся, – не тех, которых мир несмысленный ублажает, хвалит, славит и величает, – мир, говорю, слепой, который, что видит, то или ублажает, или ругает, а чего не видит, того и не знает, и ни желать, ни отвращаться не помышляет. Но кого ублажает Господь, «праведный во» всех «словах Своих» ( Рим 3:4 )? – Тех, которых мир ругает и изгоняет, как непотребных, и всякие злые речи и хулы на них вымышляет, не ради чего иного, как потому только, что они Христовы, что Христа любят, почитают и Христу любовью последуют, по стопам Его ходят, под знамением Его подвизаются, и каждый свой крест несет.'
      cn: 3 ）上主对十字军和殉道者说： 「你们有福了，因为他们为我的缘故辱骂你们，逼迫你们，在各方面不公平地辱骂你们」 （马太福音 5:11）。你看到基督所喜悦的人，从不说谎的真理：不是富有的人，不是荣耀的人，不是活人的奢侈品，不是那些吃东西的人的糖果，不是那些无意义的世界所喜悦、赞美、赞美和荣耀的人--我说，世界，盲人，他所看到的，他所喜悦或斥责的，他所看不到的，他不知道，他既没有想到许愿，也没有想到要转身离开。但主在祂所有的「言语」中都「公义」 （罗马书 3:4） ，赞美谁呢？ –那些被世人斥责和驱逐为猥亵的人，为了别的原因而编造各种邪恶的言论和亵渎，除了他们是基督的，他们爱基督，以爱来尊敬和跟随基督，跟随他的脚步，在他的标志下战斗，每个人都背着自己的十字架。
  - type: paragraph
    text:
      ru: Ибо не тот блажен, кого хвалит ложный язык, не знающий истины, но кого истинный и праведный Судия похвалит. Видимое блаженство, как пузырь на воде, является и исчезает, а невидимое – твердо, постоянно и вечно. Первое мнимо и ложно, а второе истинно. Каково блаженство того, который вчера был богат, славен, честен, веселился, но сегодня так же, как и нищий, подлый и бесчестный, во гробе лежит? И если бы при этом душа, исшедшая из тела, не затворена была в темнице ада! Вот какое блаженство хвалит и ищет мир!
      cn: 因为，并非被不认识真理之虚谎舌头所称赞的人是蒙福的，而是被真实、公义的审判者所称赞的人才蒙福。看得见的福乐如同水上的泡沫，出现又消失；而那看不见的福乐却是坚固、恒久且永恒的。前者是虚妄且虚假的，而后者是真实的。那昨日曾是富足、荣耀、受人尊敬、尽情欢乐，今日却如同贫穷、卑贱、不名誉之人般躺卧在坟墓中的人，他有什么福乐呢？更何况，那离开了身体的灵魂，竟被囚禁在阴间的牢狱中！这就是世人所赞扬和追求的福乐啊！
  - type: paragraph
    text:
      ru: Невидимое же блаженство ныне начинается верою и надеждою, а там совершается получением обетования. Ибо надежда утвержденная как веселит и ободряет, так и блаженным делает человека. Надежда на человека и на всякое создание обманывает, потому что на гнилом основании утверждается, но надежда на Бога не солжет, только бы тверда была. Что Бог обещал, то так истинно и верно есть, что как бы уже самим делом исполнилось. Ибо Бог истинен и Свое слово твердо сохраняет, хотя часто и искушает нашу надежду.
      cn: 但无形的幸福现在始于信心和希望，并通过接受应许来实现。希望证实了欢呼和鼓励，并使人幸福。人与万物中的盼望是欺骗的，因为它是在腐朽的基础上主张的，但对神的盼望不会说谎，只有在它坚定的情况下。神的应许是如此真实和真实，它已经通过行为本身实现了。因为神是真实的，祂的话语坚定不移，尽管祂常常试探我们的盼望。
  - type: paragraph
    text:
      ru: '4) Далее прибавляет Господь: «Радуйтесь и веселитесь, ибо велика ваша награда на небесах» ( Мф 5:12 ). Видишь, что радоваться и веселиться о кресте и страдании велит Господь. Почему? «Ибо велика ваша награда» . Где? Не на земле, где все отходит: и печаль, и веселье, и наказание, и награда, и блаженство, и страдание – вскоре проходит; но где? На небесах. Там все постоянно, и твердо, и вечно. Там, где Сам Бог похвалит и увенчает, прославит и ублажит, обогатит и увеселит, упокоит и утешит, и Божественное Свое лицо, светлое, милостивое, увеселительное, рабам Своим явит.'
      cn: 4 ）然后主又说： 「你们要欢喜快乐，因为你们在天上的赏赐是大的」 （马太福音 5:12）。你看到主命令你为十字架和苦难而欢喜快乐。为什么？ 「因为你的报酬是丰厚的。」哪里？不是在地球上，一切都离开的地方：悲伤，乐趣，惩罚，奖励，幸福和痛苦–很快就会过去；但是在哪里？在天堂。在那里，一切都是恒定的，坚定的，永恒的。在那里，神自己将赞美和冠冕，荣耀和喜悦，丰富和娱乐，他将休息和安慰，神圣的面容，明亮、仁慈、有趣，将向他的仆人显现。
  - type: paragraph
    text:
      ru: 'Там награда велика, где уготованы блага любящим Бога, которых «не видел глаз, не слышало ухо, и не приходило то на сердце человеку» ( 1Кор 2:9 ), где «увидят Бога лицем к лицу» ( 1Кор 13:12 ), где будут «подобны Ему, и увидят Его, как Он есть» ( 1Ин 3:2 ), где «праведники воссияют, как солнце» ( Мф 13:43 ). Там, где уготовано царство от сложения мира благословенным Отца Небесного ( Мф 25:36 ), где «праведники живут во веки; награда их – в Господе, и попечение о них – у Вышнего; где получат царство славы и венец красоты от руки Господа» ( Прем 5:15–16 ), где «не будут уже ни алкать, ни жаждать, и не будет палить их солнце и никакой зной: ибо Агнец, Который среди престола, будет пасти их и водить их на живые источники вод; и отрет Бог всякую слезу с очей их» ( Откр 7:16–17 ), где приготовлена вечеря великая, где будут рабы Господа есть, пить и веселиться ( Ис 65:13–14 ), где слава Господня явится ( Пс 16:15 ), где будут торжествовать над смертью и адом и восклицать: «Смерть! где твое жало? ад! где твоя победа» ( 1Кор 15:55 )? Где, наконец, не будет ни скорби, ни вопля, ни жалобы, ни печали, ни воздыхания, ни сетования, ни плача, ни нищеты, ни голода, ни жажды, ни холода, ни жары, никакого неблагополучия и бедствия, – но будет радость, веселье, восклицание, утешение, прохлаждение, покой, богатство, слава, царство, мир, как бы река текущая, и всякое блаженство, которого ни ум понять, ни слово сказать, ни перо описать не может.'
      cn: 有一个伟大的奖赏，就是为那些爱神的人预备好美好的事物，他们「眼睛未曾看见，耳朵未曾听见，也未曾进入人心」 （哥林多前书 2:9） ，在那里「他们将面对面地看见神」 （哥林多前书 13:12） ，在那里他们将「像他一样，看见他本来的样子」 （约翰一书 3:2） ，在那里「义人将像太阳一样发光」 （马太福音 13:43）。那里有一个国度，从世界的根基到天父的祝福（马太福音 25:36） ，在那里「义人永远活着；他们的赏赐在主里，他们的看顾在在那里，他们将得到荣耀的国度和上主手中的美丽冠冕」（智慧篇 5:15-16） ，在那里「他们不再饥，不再渴，太阳也不再烧他们，也不再热：因为宝座中的羔羊必牧养他们，领他们到活水的泉源；神必擦去他们眼中的一切眼泪」（启示录 7:16-17） ，在那里预备了丰盛的晚餐，在那里上主的仆人要吃喝快乐（以赛亚书 65:13-14） ，在那里上主的荣耀必显现（诗篇 16:15） ，在那里他们必得胜死亡和地狱，大声说： 「死亡，你的毒钩在哪里？地狱，你的胜利在哪里？」 （哥林多前书 15:55）最后，没有悲伤，没有哭泣，没有抱怨，没有悲伤，没有叹息，没有哀悼，没有哭泣，没有贫穷，没有饥饿，没有口渴，没有寒冷，没有热量，没有麻烦和灾难，但会有喜悦，喜悦，感叹，安慰，茶点，和平，财富，荣耀，王国，和平，仿佛河水在流淌，所有的幸福都是心灵无法理解，言语无法表达，笔也无法描述的。
  - type: paragraph
    text:
      ru: 'Тогда тленное переменится в нетленное, смертное в бессмертное, гнилое в неувядающее, временное в вечное, страдание в радость, печаль в веселье, клятва в благословение, нищета в богатство, немощь в вечное здравие, уничижение в небесную славу, поношение в честь. Тогда исполнится слово Господне: «Се, творю все новое» ( Откр 21:5 ).'
      cn: 那时，朽坏的将变为不朽坏的，必死的将变为不死的，腐朽的将变为不衰残的，暂时的将变为永恒的，苦难将变为喜乐，忧伤将变为欢欣，咒诅将变为祝福，贫乏将变为富足，软弱将变为永远的康健，卑微将变为天上的荣光，凌辱将变为尊荣。那时，上主的话将应验说：「看哪，我将一切都更新了」（启示录 21:5）。
  - type: paragraph
    text:
      ru: Видишь, где и какая награда будет крест носящим и Христу последующим. Так они «со Христом страдают, чтобы с Ним и прославиться» ( Рим 8:17 ). Он «уничиженное тело» их «преобразит так, что оно будет сообразно славному телу Его» ( Флп 3:21 ). Те, которые сообразуются страданию Христову, сообразны будут и в славе Ему. Это их посреди скорби веселит, в страдании укрепляет и в подвиге поддерживает. Надежды без утешения не бывает, она же и самое тяжкое мучение умягчает и преодолевает.
      cn: 你看，承受者和基督的十字架将在何处以及获得什么样的奖赏。因此，他们「与基督一同受苦，使他们也能与基督一同得荣耀」 （罗马书 8:17）。祂将「改造他们卑微的身体，使之与祂荣耀的身体相称」 （腓立比书 3:21）。凡顺从基督苦难的人，也必顺从祂的荣耀。它在悲伤中为他们欢呼，在他们的痛苦中加强他们，并在他们的行为中支持他们。没有安慰就没有希望，它也会软化并克服最严重的折磨。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Вопрошаешь: как апостолы приняли предсказание о страдании Христовом?'
      cn: 你问：使徒们是如何接受基督受苦的预言的？
  - type: paragraph
    text:
      ru: 'Ответ. Евангелист святой говорит, что «они весьма опечалились» ( Мф 17:23 ). Но Господь сказал, что и им самим, и прочим, которые хотят Его учениками быть и с Ним участие иметь во царствии Его, надо крест свой взять и за Ним идти. «Ко всем же сказал: если кто хочет идти за Мною, отвергнись себя, и возьми крест свой, и следуй за Мною. Ибо кто хочет душу свою сберечь, тот потеряет ее; а кто потеряет душу свою ради Меня, тот сбережет ее. Ибо что пользы человеку приобрести весь мир, а себя самого погубить или повредить себе? Ибо кто постыдится Меня и Моих слов, того Сын Человеческий постыдится, когда приидет во славе Своей и Отца и святых Ангелов» ( Лк 9:23–26 ); «и кто не берет креста своего и следует за Мною, тот не достоин Меня» ( Мф 10:38 ).'
      cn: 回答：神圣的传福音者说「他们极其悲伤」 （马太福音 17:23）。但主说，他们和其他人都想成为祂的门徒，并在祂的国度里与祂分享，就应该背起他们的十字架，跟随祂。「他对众人说： '凡要跟从我的，就当舍己，背起他的十字架来跟从我。'因为凡要救自己生命的，必丧失生命；凡为我的缘故丧失生命的，必救自己生命。一个人获得整体有什么好处和平，摧毁或伤害自己？因为凡以我和我的话为耻的，人子在他的荣耀和父并圣天使中来的时候，也必以他为耻」（路加福音 9:23-26） ；「凡不背起他的十字架来跟从我的，就不配得我」（马太福音 10:38）。
  - type: paragraph
    text:
      ru: 'Вот что Господь апостолам и всем христианам предлагает: не только, мол, Мне идти следует на крест, но и вам и прочим принимающим слово Мое, надо последовать за Мной и готовыми быть ко всякому злостраданию. Я господь ваш, вы рабы, – последуйте же Господу своему. Я учитель ваш, вы ученики, – последуйте же Учителю своему. Я вождь к небесному царствию, вы путники, – последуйте же Мне, Вождю своему, если хотите туда дойти.'
      cn: 这就是主给使徒和所有基督徒的：他们不仅说我应该去十字架，还说你和其他接受我话语的人，你们必须跟随我，为任何苦难做好准备。我是你们的主，你们是奴仆，故你们应当顺从你们的主。我是你的老师，你是你的弟子，所以跟随你的师父。我是天国的领袖，你们这些旅行者，所以如果你们想去那里，请跟随我，你们的领袖。
  - type: paragraph
    text:
      ru: Но рассмотрим эти слова Господа по порядку и вложим их в сердце наше.
      cn: 但是，让我们仔细考虑上主的这些话，并把它们放在我们心中。
  - type: paragraph
    text:
      ru: '1) Учениками Христовыми называются не только апостолы, но и все христиане. Почему? Потому что учение Его принимают и тому последуют. Ведь ученик называется учеником, потому что учится у учителя. В силу этого и читаем в Деяниях Апостольских, что и в то время все христиане назывались учениками. Посему надо христианам, как ученикам Христовым, от слова Его и от примера жизни Его учиться добрым нравам и им последовать. Ибо ученикам должно быть подражателями и слову учения и примеру жизни учителя. Иначе и учениками быть и называться истинно не могут. Поэтому говорит Господь: «Научитесь от Меня» ( Мф 11:29 ). И еще: «Я дал вам пример, чтобы и вы делали то же, что Я сделал вам» ( Ин 13:15 ). Если же слово Христово принимаешь как истину, – оно и воистину есть истина, – и видишь во Евангелии божественные нравы Его, то учишься ли, как ученик от учителя, и исправляешь ли нравы твои по тому правилу, рассуждай. Ведь непременно должен учиться от Христа тот, кто хочет христианином быть. Ибо христианин – это ученик Христов.'
      cn: 1 ）基督的门徒不仅被称为使徒，也被称为所有的基督徒。为什么？因为他的教导被接受并遵循。毕竟，学生之所以被称为学生，是因为他向老师学习。正因为如此，我们在使徒行传中读到，当时所有的基督徒都被称为门徒。因此，基督徒作为基督的门徒，有必要从祂的话语和生活的榜样中学习和遵循良好的道德。因为门徒必须是教导话语的模仿者，教师生活的例子，否则他们就不能真正成为和被称为学生。因此，主说： 「向我学习」 （马太福音 11:29）。再者， 「我给你们作了榜样，叫你们也照着我向你们所作的去做」 （约翰福音 13:15）。如果你接受基督的话语为真理，并且你在福音中看到祂的神圣举止，你是否像老师的门徒一样学习，你是否按照那条规则、理由来纠正你的举止。毕竟，你必须向基督学习一个想成为基督徒的人。因为基督徒是基督的门徒。
  - type: paragraph
    text:
      ru: 2) Что значит отречься от себя?
      cn: 2 ）放弃自己是什么意思？
  - type: paragraph
    text:
      ru: Ответ. Знаешь ли, что делают люди, когда видят, как иных, которых не любят, бьют и уязвляют, или другое какое зло им причиняют? Нерадят и небрегут о них, и не имеют к ним никакого сожаления. Это к себе приложи и поступай с собой, как со врагом, которого не любишь, отсеки волю твою и не делай того, что ей угодно. Презри и возненавидь себя для блага же твоего, и не люби во зло. Что в естество вошло после создания (Адама), то все, как непотребное, отсекай, делайся иным, чем прежде был, – лучшим. Пусть будет цело то, что Бог создал, но от того, что потом вошло, – отвращайся. Каждый человек сам себе первейший враг, враждуй же на себя, а не на других. Никто тебя не обидит, если сам себя не обидишь. Не гневайся же на других, а гневайся на себя. Когда хвалят тебя, не утешайся тем, а когда гонят и поносят, не скорби. Человек после падения ветхим человеком сделался, в похоти тлеющим. Отрекись же от ветхого человека, отрекись от всякой похоти, которая враждует на душу, созданную по образу Божию. Отрекись от стыда и страха, который не полезен ей, и не стыдись и не ужасайся там, где слово Божие не велит.
      cn: 回答：当人们看到其他人不喜欢、殴打、伤害或以其他方式受到伤害时，你知道他们会怎么做吗？他们忽视和忽视他们，对他们毫不怜悯。把这个应用到自己身上，把自己当作一个你不爱的敌人，切断你的意志，不要做她想做的事。为了自己的利益而蔑视和憎恨自己，不要为邪恶而爱。在创造（亚当）之后进入大自然的东西，然后所有不合适的东西，都被切断了，变得不同于我以前是–我更好。让上帝创造的东西成为完整的，但要远离后来的东西。每个人都是他自己的主要敌人，所以要对自己怀有敌意，而不是对他人怀有敌意。如果你不伤害自己，没有人会伤害你。不要对别人生气，要对自己生气。当他们赞美你的时候，不要被他们安慰，但是当他们迫害和虐待你的时候，不要悲伤。摔倒后，一个男人变成了一个老人，闷闷不乐。所以放弃老人，放弃所有的欲望对按照上帝的形象制造的灵魂的敌意。否认对她无益的羞耻和恐惧，不要在神的话语没有命令的地方感到羞愧或沮丧。
  - type: paragraph
    text:
      ru: Скажешь, что трудно это человеку делать? И я знаю что трудно, но нужно. Трудность и неудобство нужда должна победить. Тем, кто трудится и понуждает себя и просит, Бог всемогущий помогает. Добродетель истинная с великой неудобностью совершается, и там добродетель, где победа над страстной плотью. Младенца не называем целомудренным, так как против похоти не борется; и глухого не называем терпеливым и кротким, если поносят его, и не гневается, потому что не слышит; и больного и не имеющего хлеба постником (не называем), так как один не имеет, чего есть, а другой не может. Себя же самого победить – добродетельно, и похвально, и славно. В этом весь подвиг христианский состоит.
  - type: paragraph
    text:
      ru: 3) Что значит взять крест свой?
  - type: paragraph
    text:
      ru: Ответ. Готовым быть на все противное, что ни приключится, то есть на всякое злострадание, даже и до самой смерти, если это нужно будет ради чести имени Божия.
  - type: paragraph
    text:
      ru: Что значит нести крест свой?
  - type: paragraph
    text:
      ru: Ответ. Терпеть всякое злострадание безропотно и великодушно, хотя бы сердце и весьма уязвлялось.
  - type: paragraph
    text:
      ru: '4) Что значит последовать Христу, как говорит Господь: «Возьми крест свой и следуй за Мною ?»'
  - type: paragraph
    text:
      ru: Ответ. Злодеи страждут и несут крест свой, но не последуют Христу, поскольку по делам своим страждут. А что значит следовать Христу? – Быть в истинном покаянии, и плоды покаяния творить, и терпеть всякое злострадание, какое ни приключится, ради любви Божией, взирая на Самого Христа, так пострадавшего; потому что Христос все праведно творил и греха не сотворил, и добру учил, но всякое злострадание терпел ради нас, творя волю Небесного Своего Отца и совершая дело Его ( Ин 4:34 ), «быв послушным даже до смерти, и смерти крестной» ( Флп 2:8 ).
  - type: paragraph
    text:
      ru: 'Таким образом, Он научил нас примером Своим, как нам подобает угождать Богу, то есть: добро творить и злоключение терпеть, чтобы и тем, и другим волю Божию исполнить. Ибо Богу угождать значит то же, что и волю Его творить, ибо без этого невозможно угодить Богу. Воля же Божия хочет, чтобы мы добро творили и все противное, что ни приключится, великодушно сносили и безропотным терпением преодолевали. «Христос пострадал за нас, оставив нам пример, дабы мы шли по следам Его. Он не сделал никакого греха, и не было лести в устах Его. Будучи злословим, Он не злословил взаимно; страдая, не угрожал, но предавал то Судии Праведному» ( 1Петр 2:21–23 ). И это есть учение апостольское. «Ибо то угодно Богу, если кто, помышляя о Боге, переносит скорби, страдая несправедливо. Ибо что за похвала, если вы терпите, когда вас бьют за проступки? Но если, делая добро и страдая, терпите, это угодно Богу. Ибо вы к тому призваны» ( 1Петр 2:19–21 ).'
  - type: paragraph
    text:
      ru: '5) Что значит: «кто хочет душу свою сберечь, тот потеряет ее» , и прочее?'
      cn: 5) 这是什么意思：「谁若想保全自己的性命，必要丧失它」，等等？
  - type: paragraph
    text:
      ru: Ответ. Под словом «душа» здесь понимается жизнь. В случае гонения, когда нужно будет или умереть, или от Христа отречься, то должно отречься от жизни своей и умереть, но не отрекаться от Христа. Кто умрет так (не отрекшись от Христа), «не умрет, но жив будет» ( Пс 117:17 ) и, временную жизнь потеряв, обретет вечную жизнь. А кто в подобном искушении восхочет сохранить жизнь свою «(душу свою сберечь» ), тот лишится вечной жизни ( потеряет ее)» . Ибо человеку-христианину не только от имения, чести, родителей и сродников, но и от самой жизни своей отречься должно за честь имени Христова. Христа, возлюбившего нас и предавшего Себя за нас, должно любить не только больше родителей наших, отца и матери, и прочего в мире этом находящегося, но и больше жизни нашей.
      cn: 答：这里「灵魂」一词指的是生命。在受迫害的情况下，当面临或死、或否认基督的选择时，就应当舍弃自己的生命并死去，但绝不可否认基督。凡如此死去（没有否认基督）的人，「不致死亡，反得存活」（诗篇 117:17），失去暂时的生命，却将获得永恒的生命。而凡在此类诱惑中想要保全自己的生命（「保全自己的灵魂」）的人，就必失去永恒的生命（失去这生命）。因为对于基督徒而言，不仅要为基督圣名的尊荣舍弃自己的财产、尊荣、父母和亲属，甚至连自己的生命也当舍弃。对那爱我们并为我们舍己的基督，我们爱祂不仅要胜过我们的父母、父亲和母亲，以及这世上的一切所有，更要胜过我们的生命。
  - type: paragraph
    text:
      ru: 'Видишь отсюда, что никакой любви ко Христу не имеют те, которые сродников своих преизобильно награждают, а просящим ради имени Христова отказывают или мало что дают. Таковые плоть и кровь свою любят, а не Христа, ради Которого не только имения, но и жизни своей щадить не должно христианину. И имение наше – это Его имение, от Него нам данное, и жизнь наша – Ему принадлежит, ибо Им нам дана. Ибо и мы и имение наше – это Его создание. Поэтому, когда отнимается от нас имение или жизнь наша, то не наше отнимается, но то, что Бог нам подал. Потому с Иовом должно всякому признавать: «Господь дал, Господь и взял; как угодно было Господу, так и сделалось; да будет имя Господне благословенно!» ( Иов 1:21 ). Бог дает нам и имение и жизнь – может от нас и отнять, но хочет, чтобы мы по воле своей, ради любви к Нему оставили все, когда нужно будет. Так, оставив все, кроме Бога, Самого Бога приобретем, Который и богатством и жизнью нашей будет, но вечной и несравненно лучшей. В Нем и честь, и слава, и имение, и жизнь и блаженство обретается совершенное. Без Бога не может быть никакого истинного блаженства.'
  - type: paragraph
    text:
      ru: 6) «Что пользы человеку приобрести весь мир» , и прочее, – что это значит?
  - type: paragraph
    text:
      ru: Ответ. Если бы кто давал тебе превеликое богатство и царство земное, но притом бы сказал тебе, что, получив это, тотчас умрешь, то какая бы тебе польза была из того (богатства)? Нужно ли мертвому богатство, слава, честь и все сокровища мира сего? Мертвый как не чувствует, так и не требует ничего; все здесь с миром оставляет и ничего с собой не берет. В смерти все, богатые и нищие, благородные и безродные равными делаются. Если же временная жизнь нам дороже всего, что всякий познает при случае смертном, то насколько более предпочитать должно всем сокровищам мира и самой жизни временной – вечную жизнь, которая, однажды найденная, никогда не потеряется, и однажды потерянная, никогда не отыщется. Временную жизнь, как ни береги и ни защищай, надо оставить, и с ней все, а вечная жизнь и ее блаженство вовеки, без конца пребывает, потому и все богатство, славу и честь, и саму жизнь эту ради вечной жизни должно оставить, когда нужно будет.
  - type: paragraph
    text:
      ru: 'Оставим худое, земное, тленное, обманчивое, но приобретем лучшее, небесное, нетленное, истинное. В этом вера укрепляет нас, и надежда поощряет. Бог обещал нам, слово Его истинно есть: что обещал, то подаст без сомнения верующим. «Будь верен до смерти, и дам тебе венец жизни» ( Откр 2:10 ). Он в слове Своем верен пребывает, пребудем и мы верны, и получим. Будем говорить не только языком, но и сердцем: «Чаю воскресения мертвых, и жизни будущаго века».'
  - type: paragraph
    text:
      ru: '7) Что значит: «кто постыдится Меня и Моих слов» , и прочее?'
      cn: 7) 此是何意：「凡羞于我与我的话语者」，等等？
  - type: paragraph
    text:
      ru: Ответ. Многие хотят со Христом прославленными быть, но со смиренным и страждущим мало кто хочет. Но сие невозможно. Надо ученикам, рабам и членам тела в смирении и страдании быть со своим Учителем, Господом и Главою. Страждет глава, страждут и прочие члены тела. Поносится господин, поносятся и рабы его. Терпит учитель, терпят и ученики его. Христиане – телесные члены, рабы и ученики Христовы, потому надо и им последовать Христу как Главе, Господу и Учителю своему. Да не постыдится терпеть ученик, и раб, и член телесный то, что терпел Учитель, Господь и Глава. «Ученик не выше учителя, и слуга не выше господина своего» ( Мф 10:24 ).
  - type: paragraph
    text:
      ru: 'Видим христиане, что Христос Господь наш всякое бесчестие и злострадание претерпел за нас, потому праведный долг наш – не стыдиться претерпеть, что ни приключится нам. Если же кто убегает и стыдится терпеть поношение и озлобление, того и самого постыдится Господь, когда придет не в смирении, но во славе, и «скажет: «Говорю вам: не знаю вас, откуда вы» ( Лк 13:27 ). Не признаю за рабов тех, которые не работали ради Меня, не принимаю как учеников тех, которые не последовали стопам Моим. Стыдились вы Меня в смирении Моем, и Я вас ныне стыжусь в славе Моей. Недостойными вы себя судили крест носить и последовать Мне, недостойными Меня и Я вас сужу. «Кто не берет креста своего и следует за Мною, тот не достоин Меня"» ( Мф 10:38 ).'
  - type: paragraph
    text:
      ru: Если Христа недостоин, то достоин того, гордости которого последует. Ибо, кто Христу не следует и со Христом не пребывает, тот необходимо должен противнику Его последовать и с ним участие иметь, – к какой-либо стороне надо пристать и той держаться. Кто чью волю творит, тот тому и последует. Жизнь в мире этом – непрестанная брань, в которой две стороны сражаются не оружием видимым, но духовным и невидимым, как и брань эта – невидимая и духовная. Христос, Царь мира, Церковью Своей управляет, и защищает ее, и вооружает против дьявола, врага христиан, но дьявол против них восстает, и вооружается со своим полчищем, и хочет не города их отнять, а души пленить. Потому непременно всякий или со Христом и рабами Его под крестом Его воинствует против того врага, или в противной стороне находится.
      cn: 若不配与基督相称，就配得上随从其骄傲者。因为，谁不跟随基督，也不与基督同住，就必然要跟随祂的对头，并与他有份——人必得依附某一方，并坚守不渝。谁遵行谁的旨意，就跟随谁。在这世上的生命，是一场不息的争战，其中两方交战，不是用可见的武器，而是用属灵的和不可见的，正如这场争战本身是不可见的和属灵的。基督，世界的君王，治理祂的教会，保卫她，并武装她抵挡魔鬼，即基督徒的仇敌；但魔鬼却起来攻击他们，并与他的党羽一同武装起来，他不想夺取他们的城池，而是要掳掠他们的灵魂。因此，每一个人都必然要么与基督和祂的仆人在祂的十字架下争战，抵挡那仇敌；要么就站在对立的一方。
  - type: paragraph
    text:
      ru: «Кто не со Мною, тот против Меня, -» говорит Господь ( Мф 12:30 ). Кто противится воле Христовой и не последует Ему, уже пристал к противной стороне, от полка Христова отстал, изменил Христу и возвратился к темному сатанинскому полчищу, от которого на Крещении отрекся было. Ибо не имя христианское, но жизнь делает христианина, как и воина не имя, но брань и подвиг показывает. Ибо всякое имя без соответствующего делания есть пустой звук. Не пустая ли формальность – называться рабом господина и в то же время не работать на этого господина? Называться воином и дома лежать? Называться чьим-то учеником и не учиться у этого учителя? Называться христианином, но не последовать воле Христовой? Каждый христианин от Христа именование свое имеет, потому что, отстав от дьявола, ко Христу пристал и обещался Ему последовать, что слова, произносимые при Крещении показывают.
  - type: paragraph
    text:
      ru: '8) Всякий христианин вновь возрожден, новым человеком называется, отложив ветхость Адамову. Как ветхому Адаму последовали мы в злобе и грехах, так новому Адаму, Который есть Господь с небес, должны последовать в благости и добродетелях. Поскольку имя от Христа приняли и новыми людьми, то есть людьми обновления называемся, то должны новыми и делаться и быть, и не ветхому злому, но новому благому Адаму последовать: «И как мы носили образ перстного, будем носить и образ небесного» ( 1Кор 15:49 ).'
      cn: 8) 每一个基督徒都再次重生，被称为新人，脱去了亚当的旧性。我们如何在邪恶和罪中随从了旧亚当，就当在新亚当——祂是自天而降的上主——的良善和美德中随从祂。既然我们从基督领受了名，又被称为新人，即更新之人，就当成为新造的人，而非随从那邪恶的旧亚当，乃是随从那良善的新亚当：「我们既有属土的形状，将来也必有属天的形状。」 (哥林多前书 15:49)
  - type: paragraph
    text:
      ru: 9) Как израильтянам, желавшим выйти из Египта, надо было последовать Моисею вождю, и желавшим войти в землю обетованную – должно было последовать Иисусу Навину, так желающим от работы дьявольской и бедствия его освободиться, и в небесное отечество войти, надо последовать за Иисусом Христом. «Кто Мне служит, Мне да последует; и где Я, там и слуга Мой будет, -» говорит Господь ( Ин 12:26 ). Христу не ногами, но сердцами последуем.
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Говоришь: невозможно терпеть?'
  - type: paragraph
    text:
      ru: Ответ. По водам ходить и по воздуху летать и прочее тому подобное невозможно, но терпеть возможно. Когда болезнь тело мучает, терпишь, когда лекарь жестоким и противным лекарством лечит, терпишь, когда отец или кто властью облеченный бьет тебя, терпишь, когда в темницу посадят тебя, терпишь, и прочее все терпишь, хотя и не хочешь. Видишь, что можно терпеть. Лучше же признаться, что не хочешь, а не отговариваться, что не можешь. Отложи же нехотение, и будет возможно. Хотящему все возможно, особенно с помощью Иисуса, все претерпевшего ради нас.
      cn: '答：


        在水上行走，在空中飞翔，以及诸如此类的事，是不可能的，但忍耐是可能的。当疾病折磨身体时，你忍耐着；当医生用严酷和令人不适的药物治疗时，你忍耐着；当父亲或任何掌权者殴打你时，你忍耐着；当他们将你投入牢狱时，你忍耐着；以及所有其他一切你都忍耐着，尽管你不情愿。你看到，忍耐是可能的。最好是承认自己不情愿，而不是推诿说自己不能。放下你的不情愿，就会是可能的。对于愿意的人，一切都是可能的，特别是藉着为了我们忍受了一切的耶稣的帮助。'
  - type: paragraph
    text:
      ru: 'Лучше во всем, что ни приключится противное, отдаваться на волю Божию, без которой ничего не бывает, и все терпеть без негодования, роптания и с охотой, ибо это будет делом послушания, покорения и добродетели; а если будешь без охоты и с негодованием (противное воспринимать), то это будет делом непослушания, непокорности и порока. Первое свойственно Духу, покоряющемуся воле Господа своего, а другое – духу противящемуся. Верному рабу Божию свойственно полагать в себе и говорить так: что хочет Бог мой, хочу и я. Хочет мне в болезни быть, хочу и я. Хочет мне в нищете быть, хочу и я. Хочет мне бесславие терпеть, хочу и я. Хочет мне в темнице или в заточении быть, или умереть, хочу и я. Приключилось мне то, претерплю, да будет воля Господня. Он мне эту чашу дал, испью ее, данную от Него.'
  - type: paragraph
    text:
      ru: 'Но притом знай, что хотя и хотения твоего не будет, и роптать будешь, однако будешь пить, но с большей горестью и без всякой твоей пользы. Бог, Который налагает крест, Тот и помогает нам носить крест. Но помогает соизволяющим и хотящим и повинующимся, а от ропщущих отходит, и так сугубая им бывает тягость. Будем же и мы, возлюбленный, говорить и петь в заключение сказанного то, что пел пророк святой: «Готово сердце мое, Боже, готово сердце мое» ( Пс 107:2 ). Ибо это есть знамение истинного Израильтянина и чада Авраамова по духу, а не по плоти: быть готовым на все, что Бог ни повелит.'
      cn: 然而，你要知道，纵然你的意愿不肯顺服，且你会抱怨，然而你仍要饮下，却带着更大的愁苦，且毫无益处于你。上帝，祂加诸我们十字架，也必帮助我们背负十字架。但祂帮助那些甘心乐意者，且愿顺从者，且顺服者；而祂则远离那些抱怨者，因此，他们的重担将加倍沉重。那么，我们蒙爱之人啊，也当为所言之事作结，说并歌唱那圣先知所歌唱的：「我的心已预备妥当，上帝啊，我的心已预备妥当！」（ 诗篇 107:2）因为这是标志一个真正以色列人的，以及一个属灵而非属肉体的亚伯拉罕子孙的：即，对上帝所吩咐的一切都预备妥当。
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Спрашиваешь: разве Бог налагает крест, ведь люди делают нам зло, подстрекаемые дьяволом?'
  - type: paragraph
    text:
      ru: 'Ответ. Дьявол и злые люди враждуют на нас и делают зло, но без попущения Божия ничего не могут. У Иова святого люди отняли имение, но он исповедовал и говорил: «Господь дал, Господь и взял; как угодно было Господу, так и сделалось» ( Иов 1:21 ). И Спаситель наш Иисус Христос от злых людей страдал и терпел, но сказал Петру: «Неужели Мне не пить чаши, которую дал Мне Отец» ( Ин 18:11 )? Чашей здесь страдание и смерть Свою называет Господь. Чашу эту и благочестивым людям пить подает Бог, когда их наказывает, и послабляет и попускает дьяволу и злым его служителям против них восставать, гнать, озлоблять и мучить их, и так они сообразными делаются Господу своему Иисусу, как члены телесные Главе сообразуются в страдании, чтобы и во славе сообразными Ему быть: «с Ним» страждут, «чтобы с Ним и прославиться» ( Рим 8:17 ).'
      cn: 答：恶魔和恶人与我们为敌，并施行恶事，但若无上帝的许可，他们就一无所能。圣约伯的财产被人夺去，但他却宣认并说：「上主赐予，上主收回；上主所喜悦的，都成就了」（约伯记 1:21）。我们的救主耶稣基督也曾从恶人手中受苦并忍耐，但他对彼得说：「我父所给我的杯，我岂可不喝呢？」（约翰福音 18:11）在这里，主称祂的苦难和死亡为「杯」。上帝也将这杯递给虔敬的人喝，当祂惩戒他们时，并允许并许可恶魔及其邪恶的仆役起来反对他们、逼迫他们、加害他们、折磨他们，如此他们便与他们的主耶稣相符，如同身体的肢体在苦难中与元首相符，以便在荣耀中也与祂相符：「与祂一同受苦，以便与祂一同得荣耀」（罗马书 8:17）。
  - type: paragraph
    text:
      ru: Примем же, возлюбленный, чашу сию от руки Господней, когда ее подает нам, и испьем ее с послушанием. Вкусим со Христом уксуса, с желчью смешанного ( Мф 27:34 ), дабы сподобиться на трапезе Его небесной радости сладкое вино пить ( Ис 65:14 ).
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: Просишь ты, чтобы я тебе еще предлагал о спасительных действиях Спасителя нашего Иисуса. Хорошо, благо нам в том поучаться. Ибо это «едино есть на потребу» ( Лк 10:42 ). В этом лучше упражняться, нежели в таких делах, которые присущи веку сему. Путники мы, и отечество наше не на земле. Землю, как путь, переходим, и все земное на земле оставляем, и едиными душами отсюда отходим. Поэтому о том будем помышлять и заботиться, что душе нашей полезно и от нее неотлучно, с ней отсюда отходит, и с ней в отечество входит.
      cn: 你请求我再向你讲述我们救主耶稣那拯救性的作为。好的，我们从中学习是蒙福的。因为这「是不可少的」（路加福音 10:42）。操练这方面，胜过操练那些属于今世的事务。我们是客旅，我们的家乡不在地上。我们以大地为道途，经过它，将一切属地之物留在地上，并唯独以我们的灵魂离开此处。因此，我们将思考并关切那对我们灵魂有益、与它不可分离、随它一同离开此处、并随它一同进入家乡的事物。
  - type: paragraph
    text:
      ru: 'Спаситель наш, сказав апостолам, что Ему следует во Иерусалиме пострадать и умереть за спасение наше, за несколько времени прежде страдания взял с Собой трех апостолов: Петра, Иакова и Иоанна – и возвел их на гору высокую, где пред ними преобразился. И просветилось лицо Его, как солнце, ризы же Его были белы, как свет. Тут явились им в славе два пророка: Моисей и Илия, с Господом беседующие. Потом услышали глас из светлого облака, который осенил их: «Сей есть Сын Мой Возлюбленный, в Котором Мое благоволение; Его слушайте» ( Мф 17:5 ). Апостолы, услышав глас сей, пали ниц и сильно испугались, и прочее.'
  - type: paragraph
    text:
      ru: 'Этим спасительным действием показал Господь апостолам:'
  - type: paragraph
    text:
      ru: '1) Что Он есть Отчее сияние, Бог и Господь и Царь славы, хотя и сокрылся под смиренным образом человечества: внешне является как человек, подобный прочим, но внутри Бог есть. Апостолы прежде видели славу Его от дел чудесных, но здесь увидели славу Его уже очами своими, когда показалось им лицо Его как солнце и ризы как свет, как свидетельствуют: «И мы видели славу Его, славу, как Единородного от Отца» ( Ин 1:14 ). Показывалась слава Христова от дел Его, которых никто, кроме Бога, не может творить. Но здесь явилась слава Его божественная образом видимым, когда просветилось лицо Его божественное, как солнце, и ризы блистали, как свет, и глас Отчий свидетельствовал о Нем.'
      cn: 1) 祂是圣父的荣光，是上帝、主宰和荣耀的君王，尽管祂隐藏在谦卑的人性形象之下：外表显现为与常人无异，但内里却是上帝。使徒们起初透过祂所行的神迹奇事，看见祂的荣耀，但在此处，他们已亲眼看见祂的荣耀，当祂的面容如同太阳，衣袍如同光芒一般显现给他们时，正如他们所见证的：「我们也见过祂的荣光，正是父独生子的荣光。」 (约翰福音 1:14)。基督的荣耀透过祂的作为显明出来，这些作为，除了上帝，无人能行。但在此处，祂的圣神荣耀以可见的方式显现，当祂神圣的面容如太阳般照亮，祂的衣袍如光芒般闪耀，圣父的声音也为祂作证。
  - type: paragraph
    text:
      ru: 2) Этим показал, что Он волею идет на страдание, о котором предсказывал. Ибо познавшему, что Он есть Бог, Которому все возможно, удобно можно познать, что и страдание Его есть вольное. Ибо что может принудить Бога к страданию, – Бога, Который над всеми есть, и слову и повелению Которого все повинуется? Только одна любовь и милосердие Его к нам, бедным, подвигли Его к тому
  - type: paragraph
    text:
      ru: Таким образом, этим спасительным действием Бог увещевал апостолов, чтобы они, увидев Господа и Учителя своего страждущим, не соблазнились, и не убоялись, и не отстали от Него, зная, что Он волею будет страдать, что ни будет страдать. Мог бы Он все злобное действие врагов Своих остановить, но не захотел; напротив, восхотел все терпеть и страдать, чтобы от этого человек погибший спасение получил.
  - type: paragraph
    text:
      ru: 3) Апостолы как Спасителя увидели во славе, так и явившихся пророков причастниками той славы видели. Отсюда видим, что в вечной жизни слава святых будет подобна славе Христовой, «будут подобны Ему, и» увидят «Его, как Он есть» ( 1Ин 3:2 ). Здесь просветилось лицо Христово, как солнце, а «тогда праведники воссияют, как солнце, в царстве Отца их» ( Мф 13:43 ), «Который уничиженное тело наше преобразит так, что оно будет сообразно славному телу Его» ( Флп 3:21 ).
  - type: paragraph
    text:
      ru: 'Видим еще, какая радость и сладость там будет. Петр такую радость и сладость почувствовал в себе, увидев славу Божию, что и с горы сходить не хотел, но хотел там и пребывать: «при сем Петр сказал Иисусу: Господи! хорошо нам здесь быть» , и прочее ( Мф 17:4 ). Часть некую славы Божией, и сколько могли видеть, видели, но в такую радость и сладость пришли. Какая же там радость и веселье будет, где вся явится слава Божия, где узрят Бога «лицем к лицу» ( 1Кор 13:12 )!..'
  - type: paragraph
    text:
      ru: Но кто хочет радости и славы той участником быть, тому надо скорби и поношению Христову здесь сообщаться. С «ним» (Христом) «страдаем, чтобы с Ним и прославиться» ( Рим 8:17 ). «Многими скорбями надлежит нам войти в царствие Божие» ( Деян 14:22 ). Видишь, что не только скорбями, но и многими скорбями войти туда подобает.
      cn: 凡渴望成为那份喜乐与荣耀的分享者，就必须在此世分受基督的苦难与凌辱。我们与祂（基督）「同受苦难，好能与祂同享荣耀」（罗马书 8:17）。「我们必须经历许多苦难才得以进入上帝的国度」（使徒行传 14:22）。你看，进入那里，不仅是借着苦难，更是借着许多苦难才得以进入。
  - type: paragraph
    text:
      ru: '4) Глас Отчий: «Сей есть Сын Мой Возлюбленный, в Котором Мое благоволение; Его слушайте, -» не только апостолов, но и нас всех касается. Апостолом тогда возглашал Бог из облака, но через них и к нам глас Его дошел, и к нам говорит Бог: «Сей есть Сын Мой Возлюбленный, в Котором Мое благоволение; Его слушайте» . Сколько раз читаем, или слышим Евангелие Его святое, столько раз мы слышим глас Сына Божия, говорящий к нам, который не иному чему учит нас, как спасительному пути, по которому до славы Божией, на горе святой отчасти показанной, должно всякому идти, кто хочет получить ее.'
      cn: 4) 父的声音：「这是我的爱子，我所喜悦的；你们要听他，」（马太福音 17:5）——这不仅关乎使徒，也同样关乎我们所有人。当时，上帝从云中向使徒们发声，但祂的声音也藉着他们传达给我们；上帝也对我们说：「这是我的爱子，我所喜悦的；你们要听他。」每当我们诵读或聆听祂的圣福音，我们就听到上帝之子对我们说话的声音，这声音所教导我们的，无非是救赎之路；凡愿得享上帝荣耀之人，都当循此路而行，这荣耀在圣山上已部分彰显。
  - type: paragraph
    text:
      ru: Послушаем же Сына Божия, как увещевает нас Небесный Отец, и, мирские прихоти оставив, возьмем каждый крест свой, какой от Него наложен будет, и пойдем за Ним, да приведет нас к Небесному Своему Отцу. Так будем бежать, «чтобы получить» , пострадаем с Ним, дабы с Ним и прославиться, не постыдимся поношение Его носить, дабы и Он не постыдился нас, когда придет во славе Своей. Да помянет нас Господь во царствии Своем.
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: 'Когда пришло то время, в которое надо было Иисусу Сыну Божию чашу страдания и смерти за спасение наше испить, Он, сев на осла, поехал во Иерусалим. «Множество народа, пришедшего на праздник, услышав, что Иисус идет в Иерусалим, взяли пальмовые ветви, вышли навстречу Ему и восклицали: Осанна! Благословен грядущий во имя Господне, Царь Израилев» ( Ин 12:12–13 )!'
      cn: 当那时刻来临，上帝之子耶稣为了我们的救赎，必须饮尽苦难与死亡之杯时，他骑着驴，前往耶路撒冷。 「许多来过节的人，听说耶稣将要进入耶路撒冷，就拿着棕榈枝，出来迎接他，并且喊着说：和散那！奉上主名而来的，是蒙福的，以色列的君王！」 (约翰福音 12:12-13)
  - type: paragraph
    text:
      ru: 'Примечай здесь, возлюбленный:'
      cn: 请留意这里，蒙爱者：
  - type: paragraph
    text:
      ru: 1) Сидящий на престоле славы Своей, и покланяемый и прославляемый всеми небесными Силами, не возгнушался сесть и ехать на бессловесном скоте. Нашего ради спасения сделал это Сын Божий, как и воплотился. От сего да постыдится человеческая гордость, которая любит цугом 1 и в позлащенных каретах проезжаться.
  - type: paragraph
    text:
      ru: 2) Когда в мир вошел и родился Сын Божий, то в убогом вертепе и яслях, как один из нищих, возлег, но когда от мира должен был отойти и пострадать и умереть за нас, то с торжеством шел, слыша и спереди и сзади восклицания со всех сторон окружавшего Его народа.
  - type: paragraph
    text:
      ru: Спасайся.
      cn: 要得救。
  - type: paragraph
    text:
      ru: В XVIII веке использовался особо торжественный вид упряжи, при котором лошади впрягались одна за другой по одной или по паре в ряду.
