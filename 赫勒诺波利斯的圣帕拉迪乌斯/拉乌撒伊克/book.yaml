    cn: 鲁芬如此转述圣马卡里的话：「我未见她有任何兽性；你们所谈论的，并不在她肉身，而是在注视她之人的眼中。这是恶魔的诱惑，而非事物的真相。」（鲁芬。《沙漠教父传》。第28章）。
