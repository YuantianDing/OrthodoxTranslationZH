title:
  ru: Лавсаик, или повествование о жизни святых и блаженных отцов
  cn: 劳撒传，或圣徒与真福教父生平记述
authors:
- ru: преподобный Палладий Еленопольский
  cn: 赫勒诺波利斯的圣帕拉迪乌斯
languages:
- ru
- cn
