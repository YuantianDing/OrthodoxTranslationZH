  children: []
- type: heading1
  text:
    ru: Лавсаик, или повествование о жизни  святых и блаженных отцов
    cn: 《劳萨依卡史，或圣徒与蒙福教父生平记述》
  children: []
- type: heading1
  text:
    ru: Часть 1
    cn: 第一部分
  children:
  - type: heading2
    text:
      ru: Предуведомление к изданию на русском языке
      cn: 俄文版出版说明
    children:
    - type: paragraph
      text:
        ru: Писатель этой книги Палладий, родом галатянин, сперва путешествовал несколько лет по разным странам Египта, потом отправился в Палестину, откуда прибыл в Вифинию, где рукоположен был в епископа Еленопольского и имел близкое общение со святымИоанном Златоустом. Но, защищая святителя от нападений врагов его, он сам принужден был скрываться одиннадцать месяцев в уединенной келии. После того был он в Риме. Все означенные путешествия Палладия, как можно видеть из содержания книги, относятся ко времени с 388 до 404 года по Рождестве Христовом.
        cn: 这本书的作者帕拉狄乌斯，是加拉太人。他起初在埃及各地游历了几年，然后前往巴勒斯坦，从那里抵达比提尼亚。在那里，他被祝圣为埃莱诺波利斯主教，并与圣约翰·金口有密切的交往。然而，为了保护这位圣主教免受其敌人的攻击，他自己被迫在一间隐居的独居室里躲藏了十一个月。在那之后，他又到了罗马。正如可以从本书内容中看到，帕拉狄乌斯的所有这些旅程，都发生于公元388年至404年之间。
    - type: paragraph
      text:
        ru: В продолжение сих путешествий Палладий с большим усердием собирал сведения о жизни святых и блаженных отцов и некоторых жен и собранные сведения предложил в этой книге, как сам говорит в Предисловии, «для возбуждения ревности к подражанию в мужах, желающих вести жизнь небесную… и в пример любви к Богу для жен, хотящих украситься венцом воздержания и чистоты».
        cn: 在这些旅程中，帕拉迪乌斯以极大的勤勉收集了有关圣徒与蒙福的教父们以及一些女子生平的资料，并将这些资料汇集成此书。正如他自己在前言中所说，是为了「激发那些渴望过属天生活的男子效法的热忱……并作为爱上帝的榜样，赐予那些渴望以节制与纯洁的冠冕来装饰自己的女子。」
    - type: paragraph
      text:
        ru: Эта книга написана по желанию и убеждению (как видно из Предисловия) одного знаменитого мужа, занимавшего при императорском византийском дворе весьма важную должность[1], по имени Лавса, поэтому и книга посвящена сочинителем ему же и от имени его получила наименование «Лавсаик».
        cn: 这本书是根据一位名叫拉夫萨的著名人士的意愿和确信（如序言所示）撰写的，此人曾在拜占庭帝国宫廷担任一个非常重要的职位[1]。因此，该书的作者也将它献给了他本人，并以他的名字命名为《拉夫萨依克》。
    - type: paragraph
      text:
        ru: 'Cократ в четвертой книге своей «Церковной истории», сказавши кратко о египетских отцах, желающим более знать о них указывает на книгу, написанную Палладием, и говорит так: «Кто хочет знать, как они (отцы египетских пустынь) жили, что делали, что говорили на пользу слушающих, как им повиновались и звери, – есть особая книга, составленная монахом Палладием, учеником Евагрия. В этой книге он предложил подробные сведения о них, упоминает и о женах, по своей жизни подобных тем мужам, о коих выше сказано».'
        cn: '苏格拉底在其第四卷《教会史》中，简要提及了埃及教父们之后，对于那些希望了解更多的人，指出了一本由帕拉狄乌斯所著的书，并这样说道：


          「谁若想知道他们（埃及沙漠的教父们）是如何生活的，他们做了什么，他们说了什么以造福听者，连野兽都如何顺服他们——就有一本特别的书，由修士帕拉狄乌斯，瓦格里乌斯的门徒撰写。在这本书中，他详细介绍了他们，也提到了那些妇女，她们的生活与上述男子们类似。」'
    - type: paragraph
      text:
        ru: ПравославнаяЦерковьдает свое свидетельство о важности сей книги для чад ее тем, что издревле постановила правилом на утрени Великого поста из числа четырех положенных чтений заимствовать два чтения из «Лавсаика» во все дни Святой Четыредесятницы, кроме суббот и воскресений.
        cn: 东正教为她的儿女们作证了这本书的重要性，因为她自古以来就立下规条：在大斋期晨祷中，除了星期六和星期日之外，在大斋期的所有日子里，从四篇规定的读经中，取两篇读经自《劳萨克史》。
  - type: heading2
    text:
      ru: Предисловие
      cn: 序言
    children:
    - type: paragraph
      text:
        ru: В этой книге описаны добродетельное подвижничество и чудный образ жизни блаженных и святых отцов-монахов и отшельников пустынных для возбуждения ревности к подражанию в мужах, желающих вести жизнь небесную; также описаны воспоминания о женах-старицах и богоугодных матерях, с мужественною ревностию подъявших труды добродетельного подвижничества, в пример любви к Богу для жен, хотящих украситься венцом воздержания и чистоты, – описаны по желанию одного достопочтеннейшего мужа, и по уму многосведущего, и по нраву тихого, и по сердцу благочестивого, и к нуждающимся в необходимом щедрого, и за честность нравов возведенного на самый верх достоинств, предпочтительно пред многими отличными мужами, и несомненно хранимого силою Духа Божия. Он поручил нам, а лучше, если сказать правду, медлительный на созерцание лучшего ум наш возбудил к соревнованию и подражанию подвижническим добродетелям преподобных и бессмертных духовных наших отцов, поживших в угождении Богу и в великом изнурении тела, – поручил, чтобы мы, описав жизнь непобедимых подвижников, послали это описание к нему с изображением строгих добродетелей каждого из сих великих мужей. Любитель этого богоугодного и духовного желания есть отличнейший муж Лавс, по воле Божией поставленный хранителем богопросвещенного и благочестивого царства.
        cn: 在这本书中，描述了至福的圣父修士们和荒漠隐士们圣善的苦修与奇妙的生活方式，为要激发那些渴望过属天生活的男士们效法之热忱；也描述了关于女长老们和蒙神喜悦的母亲们的记述，她们以刚毅的热忱承受了圣善苦修的劳苦，作为那些希望以节制和纯洁的冠冕来妆饰自己的女士们爱神的榜样——这些描述是应一位最可敬的男士之愿而作的，他心思渊博，性情温和，内心虔诚，对有需要之人慷慨施予，因其品德正直而被擢升至最高位，远超许多杰出男士，并无疑地蒙受圣灵大能的保守。他委托了我们，或者，如果实事求是地讲，他激发了我们那迟钝于思索美善的心，使其竞相效法我们可敬、不朽的属灵父辈们的苦修美德，他们一生蒙神喜悦，并使身体经历巨大的克制——他委托我们，在描述了这些不屈的苦修者的一生后，将这份描述连同这些伟大男士各自严谨美德的描绘一并寄给他。这蒙神喜悦和属灵愿望的倡导者，便是卓越的男士劳斯，他蒙神旨意被立为这蒙神光照和虔敬的国度的守护者。
    - type: paragraph
      text:
        ru: Я, и необразованный языком, и слегка только вкусивший духовного знания, и недостойный описывать духовную жизнь святых отцов, убоявшись важности поручения, превышающего мои силы, не хотел было принять его, так как оно требует и внешней мудрости, и духовного ведения, но, уважив, во-первых, добродетельную ревность побудившего нас к сему труду, приняв также во внимание и пользу читателей и боясь подвергнуться опасности даже за благовидное непослушание, я приписал наперед это важное поручение Промыслу Божию и, употребив со своей стороны великое тщание, окрыляемый предстательством святых отцов, вступил в подвиги сего поприща. Однако ж описал, как бы в сокращении, только самые высокие дела и знамения доблестных подвижников и великих мужей, и не только знаменитых мужей, проводивших отличную жизнь, но и блаженных и честных жен, подвизавшихся в высоком житии. Священнолепные лица некоторых из них удостоился я видеть сам лично, а небесную жизнь других, уже совершившихся на поприще благочестия, узнал от богоносных подвижников Христовых. Для благочестивой цели с великим усердием обошел я пешком многие города и весьма многие села, также пещеры и все пустынные кущи иноков. И после того, как иное сам я увидел и описал, а другое услышал от святых отцов, изобразив в этой книге подвиги великих мужей и упованием на Христа победивших природу жен, посылаю сие описание к любящему слово Божие слуху твоему, украшение наилучших и боголюбезных мужей и слава вернейшего и боголюбезного царства, искренний и христолюбивый раб Божий Лавс!
        cn: '我，一个在言语上不通达、只略微尝过属灵知识滋味、并且不配描绘圣教父们属灵生命的人，因畏惧这超越我能力之委派的重要性，本不愿接受它，因为它既需要外在的智慧，也需要属灵的洞见。然而，首先考虑到那激励我们从事此工作之人良善的热心，同时又考虑到读者的益处，并害怕即使是看似合理的违逆也可能招致危险，我便预先将这项重要委派归于上帝的护理，并尽我所能，竭尽全力，蒙圣教父们代祷之助，深受鼓舞，踏上了这苦修的征途。


          然而，我只是简要地描述了那些勇毅的苦修者和伟大人物最崇高的事迹和彰显，不仅包括那些度过卓越生命的著名男子，也包括那些在崇高生活中奋斗的蒙福而可敬的女子。他们中一些人的神圣面容，我有幸亲睹；而其他那些已在虔敬征途上完成其生命之人属天的生命，我是从秉承神恩的基督苦修者那里得知的。


          为了这虔敬的目的，我怀着极大的热心，徒步走遍了许多城市和极多的村庄，以及洞穴和所有隐修士的旷野茅棚。在我亲眼见过并描述了其中一部分，而另一些则从圣教父那里听闻之后，我在这本书中描绘了伟大人物的苦修事迹和那些藉着对基督的盼望胜过本性的女子。特将此记述呈献给您爱慕上帝圣言的耳边，您是诸般最优秀且蒙神所爱之男子的荣光，也是最忠信、蒙神所爱之国度的荣耀。上帝真诚且爱基督的仆人劳斯敬上！'
    - type: paragraph
      text:
        ru: Со свойственною мне краткостию начертал я знаменитое имя каждого из подвижников Христовых – мужей и жен, потом из многих и весьма великих подвигов каждого рассказал только о немногих и весьма кратко, а у большей части из них означил и происхождение, и город (отечественный), и место жительства. Упомянул я и о тех мужах и женах, которые, достигши до самой высокой добродетели, по высокомерию и тщеславию низверглись в самую глубокую бездну, на дно адово, и приобретенные долговременными и многими трудами достолюбезные и великих усилий стоившие совершенства подвижнические от гордости и надмения потеряли в одно мгновение, но благодатию Спасителя нашего, и попечительностию святых отцов, и состраданием духовной любви исхищены из сетей диавола и по молитвам святых возвратились к прежней добродетельной жизни.
        cn: 我以惯有的简洁勾勒了基督每一位苦修者——男性和女性——的显赫之名，然后，从每一位（苦修者）众多而伟大的苦修功绩中，我只简要地讲述了其中几项。而对于他们中的大多数，我还记载了他们的出身、故乡城市和居住地。我也提到了那些男性和女性，他们曾达到了至高的美德，却因傲慢和虚荣而坠入最深的深渊，直坠地狱之底；并且，他们通过长久而许多劳苦所获得的、可爱的、值得付出巨大努力的苦修完美境界，却因着骄傲和狂妄在顷刻间丧失殆尽。但借着我们救主的恩典、圣教父们的关怀和属灵之爱的怜悯，他们被从魔鬼的罗网中解救出来，并借着圣徒们的祷告回到了他们从前的美德生活。
  - type: heading2
    text:
      ru: Письмо, писанное епископом Палладием правителю Лавсу
      cn: 主教帕拉狄俄斯致执政官劳苏斯的书信
    children:
    - type: paragraph
      text:
        ru: Хвалю твое желание; ты достоин, чтобы начать письмо к тебе похвалою, потому что, когда все заняты суетными вещами, от которых не получат они пользы, ты собираешь книги и хочешь учиться. В учении не нуждается один только Бог всяческих, ибо Он самобытен и другого не было прежде Его, а все прочее имеет нужду в учении, потому что сотворено и создано. Первые чины ангельские имеют своим наставником Всевышнюю Троицу, вторые – поучаются от первых, а третьи – от вторых и так далее по порядку, до последних. Совершеннейшие в знании и добродетели учат несовершенных в познании.
        cn: 我赞许你的愿望；你值得我以赞美开始这封信，因为当所有人都忙于那些不能带给他们益处的虚妄之事时，你却在收集书籍并渴望学习。唯有万有之主不需要学习，因为祂是自有永有的，在祂以前没有别的；而所有其他事物都需要学习，因为它们都是被造和被创造的。天使的首要阶层以至高无上的三位一体为他们的导师，第二阶层受教于第一阶层，第三阶层受教于第二阶层，依此顺序，直至最末阶层。在知识和美德上最完善的，教导在认识上不完善的。
    - type: paragraph
      text:
        ru: Итак, думающие о себе, что не имеют нужды в наставниках, недугуют невежеством, которое есть мать гордости, поэтому они не покоряются тем, кои с любовию учат их. Таким людям предшествуют на пути к погибели за этот же недуг изринутые из небесного жительства демоны, так как и они отвергли небесных наставников.
        cn: 那么，那些自认为不需要导师的人，患上了无知，这无知是骄傲之母，因此他们不顺从那些以爱心教导他们的人。这样的人，在通往灭亡的道路上，有因同样病症而被逐出天上居所的魔鬼先于他们，因为它们也拒绝了天上的导师。
    - type: paragraph
      text:
        ru: 'Но предмет учения должны составлять не слова и склады – такое учение бывает иногда и у самых худых людей, – а добрые качества нрава: беспечалие, безбоязненность, негневливость и дерзновение во всем, которое и слова делает пламенем огненным. Если бы не так было, Великий Учитель не сказал бы Своим ученикам:«научитеся отМене, яко кроток есмь и смирен сердцем»(Мф. 11, 29). Так, Он учил апостолов не красноглаголанием, а благим нравом и никого не огорчал, кроме ненавидевших учение и учителей.'
        cn: 但教导的 विषय 不应是言语和字句——因为这样的教导有时甚至在最坏的人那里也能看到——而是品格的良善品质：无忧、无惧、不轻易发怒，以及在一切事上的坦然无惧，这使言语也成为烈火。如果不是这样，伟大的导师就不会对祂的门徒说：「你们当学我的样式，因为我心里柔和谦卑。」 (马太福音 11:29)。因此，祂教导使徒并非藉着华丽的言辞，而是藉着良善的品格，并且除了那些憎恨教导和教师的人，祂没有使任何人忧伤。
    - type: paragraph
      text:
        ru: Итак, душа, которая подвизается о Христе, должна или сама верно изучить то, чего она не знает, или других ясно учить тому, что узнала. Если она не делает ни того ни другого, то болит неразумием. Начало отпадения – пресыщение наставлением и отвращение от учения, которого всегда алчет душа боголюбивого. Прощай и будь здоров, а что всего больше – да дарует тебе Бог познание Христово.
        cn: 那么，致力于基督的灵魂，就应当要么自己忠实地学习她所不知道的，要么清楚地教导他人她所学到的。如果她既不这样做也不那样做，她就因无知而受苦。堕落的开始是对教导感到厌腻，以及对敬爱上帝者的灵魂总是饥渴的教诲的厌弃。再见，祝你身体健康。而最重要的是，愿上帝赐予你对基督的认识。
  - type: heading2
    text:
      ru: Об Исидоре-странноприимце
      cn: 关于接待客旅者伊西多尔
    children:
    - type: paragraph
      text:
        ru: Сначала пришел я в город Александрию, во второе консульство великого царя Феодосия (ныне за свою правую веру во Христа пребывающего со Ангелами), и в этом городе встретил мужа дивного по жизни, украшенного всеми совершенствами – и словом, и нравом, и ведением. То был пресвитер Исидор, странноприимец Александрийской Церкви. Первые годы юности, говорят, провел он в пустыне в трудах подвижничества. Видел я и келию его в горе Нитрийской. Ему было лет семьдесят, когда я пришел к нему. Проживши еще пятнадцать лет, он скончался в мире.
        cn: 我首先来到了亚历山大城，在伟大的皇帝狄奥多西（他因着对基督的纯正信仰，如今已与众天使同在）第二次担任执政官时期。在这座城里，我遇到了一位生活令人称奇的男子，他具备一切美德——言语、品格和学识皆臻完美。那是长老伊西多尔，亚历山大教会的款待员。据说，他青年时期的最初几年是在旷野度过的，从事苦修。我也见过他在尼特里亚山上的修行室。当我来到他那里时，他约七十岁。他又活了十五年，便安然离世了。
    - type: paragraph
      text:
        ru: 'Сей святой муж до самой кончины своей не носил льняной одежды, кроме покрова на голове, не ходил в баню, не касался мяса, никогда не вкушал пищи до сытости. А между тем, по милости Божией, тело его было так полно, что все, кто не знал жития его, думали, что он живет весьма роскошно. Если б стал я рассказывать подробно о каждой добродетели, то у меня недостало бы времени для рассказа. Он был так кроток, человеколюбив и миролюбив, что самые враги его, которых он имел по причине своей правой веры во Христа, уважали, можно сказать, тень сего мужа за чрезвычайную его доброту. А духовную благодать святой муж сей имел столь великую и такое ведение Священного Писания и разумения божественных догматов, что даже во время трапезы, в часы, когда с братиею, по обыкновению, принимал пищу, ум его приходил в восторг и уединял его. Когда его просили рассказать, что было во время этого восторга, он говорил: «Я странствовал мыслию, быв восхищен таким-то созерцанием». Я и сам часто видел, как он плакал во время трапезы. На вопрос мой о причине слез он отвечал: «Стыдно мне, разумному созданию, питаться бессловесною пищею; мне бы следовало быть в раю сладости и там насыщаться нетленною снедию, по данной нам от Христа власти».'
        cn: 这位圣人直到他离世，除了头上所戴的头巾，从不穿麻布衣服，从不沐浴，从不食肉，也从不饱食。然而，蒙受神的恩典，他的身体却如此丰腴，以至于所有不了解他生平的人，都以为他生活极其奢华。如果我详细讲述他每一样美德，那我将没有足够的时间来讲述。他是如此的谦和、仁爱与和平，以至于他的仇敌——那些因他纯正的基督信仰而成为他仇敌的人——也可以说，都敬重这位圣人的身影，因为他非凡的良善。而这位圣人拥有如此丰盛的属灵恩典，以及对圣经的透彻了解和对神圣教义的深刻理解，以至于即使在用餐时，在他与弟兄们按惯例一同进食的时刻，他的心神也会进入狂喜并使他抽离于周遭。当人们请他讲述这种狂喜中发生了什么时，他说：「我的心神遨游了，被某种默观所摄住。」 我也常常看到他在用餐时哭泣。当我问他哭泣的原因时，他回答说：「我感到羞愧，我作为一个有理性的受造物，竟然以无言的食物为食；我本应在甘甜的乐园中，在那里以不朽的食粮为饱，按照基督赐予我们的权柄。」
    - type: paragraph
      text:
        ru: 'В Риме он был известен всему сенату и женам вельмож с того времени, как приходил туда, сперва сАфанасием Великим, а потом со святым Димитрием епископом. Он хотя имел большое богатство и изобилие в потребностях житейских, но пред смертию не написал завещания. И сестрам своим, девицам, не оставил ни денег, ни вещей, а поручил их Христу сими словами: «Бог, сотворивший вас, дарует вам и потребное для жизни, как и мне даровал». С сестрами жили в одной обители семьдесят дев.'
        cn: 在罗马，自从他去到那里之时起，起初是和大圣亚大纳修，之后是和圣德米特里主教，他便闻名于整个元老院和贵胄的妻子们。他虽然拥有巨额财富和丰裕的生活所需，但在临终前没有立下遗嘱。也没有给他的姊妹们——那些贞女们留下任何金钱或物品，而是将她们托付给了基督，说了这些话：「那创造了你们的上帝，也会赐予你们生活所需，如同他赐予了我一样。」有七十位贞女和那些姊妹们一起住在同一间修道院里。
  - type: heading2
    text:
      ru: О Дорофее
      cn: 关于多罗泰
    children:
    - type: paragraph
      text:
        ru: 'Когда еще в молодости пришел я к нему (Исидору) и просил преподать мне первоначальное наставление в монашеской жизни, – между тем как мне по пылкости возраста нужны были не слова, а труды телесные и изнурение плоти, – он, как искусный укротитель молодых коней, выведши меня в так называемые пустынные келии верст за пять от города, поручает Дорофею, одному подвижнику Фивейскому, жившему около шестидесяти лет в пещере, и приказывает мне пробыть при нем три года для укрощения страстей моих (он знал, что старец сей ведет самую суровую жизнь), а по истечении трех лет опять возвратиться к нему для дальнейшего духовного наставления. Но я не мог прожить у него трех лет: сильная болезнь заставила меня оставить его раньше определенного срока.'
        cn: 当我尚在青年时期，来到他（伊西多尔）那里，请求他给我初步的修道生活指导时——而当时我因着年轻气盛，需要的不是言语，而是身体的劳作和肉体的克制——他，就像驯服烈马的能手，将我带到城外约五俄里（远）那些所谓的荒漠隐修室，把我托付给多罗斐——一位底比斯的苦修者，他在洞穴中生活了大约六十年——并命令我与他同住三年，以克制我的情欲（他知道这位长老过着最严酷的生活），而在三年期满后，再次回到他那里，接受进一步的灵性教诲。但我无法在他那里住满三年：一场重病迫使我早于原定时间离开了他。
    - type: paragraph
      text:
        ru: 'Жизнь его была самая суровая, многотрудная и строгая. Целый день, и в самый зной полуденный, собирая камни в пустыне приморской, он постоянно строил из них келии и потом отдавал их тем, которые сами не могли строить, и таким образом каждый год строил по келии. Однажды я сказал сему святому мужу: «Что ты делаешь, отец, в такой старости убивая свое тело на жару такими трудами?». Он отвечал мне: «Оно убивает меня, а я буду убивать его». Съедал он унций[2]шесть хлеба в день и связочку овощей да выпивал воды несколько. Бог свидетель, не видывал я, чтобы он протянул ноги или лег спать на рогоже или на постели – всю ночь, бывало, сидит и вьет веревки из финиковых ветвей, из которых плел корзины на покупку хлеба себе. Думал я, что, может быть, он при мне только начал вести такую строгую подвижническую жизнь, и тщательно стал расспрашивать у многих учеников его, всю ли жизнь он так подвизается (из них иные жили отдельно друг от друга и сами уже славились добродетелию). Они сказывали мне, что он с юности жил так, никогда не ложился спать, а только разве во время работы или за столом смыкал на несколько минут глаза, так что от дремоты и кусок иногда выпадал у него изо рта. Однажды я понуждал сего святого мужа прилечь немного на рогожу; он огорчился и сказал мне: «Уговори сперва Ангелов, чтобы они уснули когда-нибудь, тогда уговоришь и ревностного подвижника».'
        cn: 他的生活最为严酷、多劳苦且严谨。他整日，甚至在正午最炎热的时候，在海边荒漠收集石头，不断地用这些石头建造小室，然后把它们分给那些无法自行建造的人，如此，他每年建造一间小室。有一次，我对这位圣洁的弟兄说：「父亲，你这是在做什么？在这般年纪，竟在酷热中以这等劳苦折磨你的身体？」他回答我：「它在折磨我，而我将折磨它。」他每天吃六盎司[2]面包，一小束蔬菜，再喝一点水。神是我的见证，我从未见过他伸直双腿，或躺在草垫上或床上睡觉——他整夜都坐着，用椰枣枝编绳索，用这些绳索编织篮子，好为自己购买面包。我曾以为，或许他只是在我面前才开始过上这般严谨的苦修生活，于是我仔细地询问了他许多门徒，他是否一生都如此苦修（他们中有些彼此分开居住，且自己也已因德行而闻名）。他们告诉我，他自幼便是如此生活，从不躺下睡觉，只是在工作时或餐桌旁小憩几分钟，以至于有时因打瞌睡，食物会从他嘴里掉出来。有一次，我劝这位圣洁的弟兄稍稍躺在草垫上休息；他感到不悦，并对我说：「你先劝天使们去睡觉吧，好让他们何时能睡一会儿，之后你才能劝服一位热忱的苦修者。」
    - type: paragraph
      text:
        ru: 'Однажды он послал меня часу в девятом на свой колодезь налить кадку, из которой все брали воду. Было уже время обеда. Пришедши к колодцу, увидел я на дне его аспида[3]и, в испуге не начерпавши воды, побежал к нему с криком: «Погибли мы, авва: на дне колодца я видел аспида!». Он усмехнулся скромно, потому что был ко мне весьма внимателен, и, покачивая головою, сказал: «Если бы диаволу вздумалось набросать аспидов, или змей, или других ядовитых гадов во все колодцы и источники водные, ты не стал бы вовсе пить?». Потом, вышедши из келии, он сам налил кадку и первый тотчас испил воды, сотворивши крестное знамение над нею и сказавши: «Где крест, там ничего не может злоба сатаны».'
        cn: 有一次，大约九点钟，他差遣我到他的水井边去灌满一个水桶，所有人都从那里取水。已经是午饭时间了。来到井边，我看见井底有一条毒蛇[3]，于是，我因惊恐而没有打水，跑到他那里，喊道：「我们完了，阿爸！我在井底看到了一条毒蛇！」他谦逊地笑了笑，因为他对我非常体贴，然后，他摇了摇头，说道：「如果魔鬼心血来潮，往所有的水井和水源里丢满毒蛇、或蛇、或其他有毒的爬行动物，你就完全不喝水了吗？」之后，他走出修士房，亲自灌满了水桶，并首先立刻喝了水，他在水上划了十字圣号，并且说道：「有十字架之处，撒旦的恶意就一无所能。」
  - type: heading2
    text:
      ru: О Потамиене
      cn: 论波塔米娜
    children:
    - type: paragraph
      text:
        ru: 'Блаженный Исидор-странноприимец рассказывал мне, что он, быв у святого и блаженного Антония, слышал от него нечто такое, что стоит записать. Именно: одна прекрасная лицом девица, Потамиена, во время Максимина-гонителя была рабою у какого-то сластолюбца. Господин долго старался обольстить ее различными обещаниями, но не мог. Наконец, пришедши в ярость, он представил ее тогдашнему александрийскому префекту как христианку, которая хулит настоящее правительство и царей за гонения, и обещал ему довольно денег за наказание ее. «Ежели ты, – говорил он, – убедишь ее согласиться на мое желание, то не предавай ее истязанию, а, когда она по-прежнему будет оставаться непреклонною, умори ее в мучениях». «Пусть же, – говорил он, – живая не смеется над моею страстию».'
        cn: 至圣款待者伊西多尔曾告诉我，他在圣洁蒙福的安东尼那里时，听到了一些值得记录的事情。确切地说：一位面容美丽的少女，波塔米娜，在迫害者马克西米努斯时期，是某个好色之徒的奴隶。她的主人长期以来试图用各种许诺引诱她，但未能成功。最终，他勃然大怒，便向当时的亚历山大省总督告发她是基督徒，说她诽谤现任政府和君王进行迫害，并承诺给他不少钱来惩罚她。「如果你，」他说，「能说服她顺从我的意愿，就不要对她施加酷刑；而如果她仍然不屈服，就让她在折磨中死去。」「别让她，」他说，「活着嘲笑我的情欲。」
    - type: paragraph
      text:
        ru: 'Привели мужественную девицу пред судилище и начали терзать тело ее разными орудиями казни, в то же время и уговаривали ее различными словами, но она оставалась непоколебимою в своей душе, как стена. Тогда судия избирает из числа орудий казни самое страшное и мучительное: он приказывает наполнить большой медный котел смолою и поджечь его сильнейшим огнем. Когда смола стала клокотать и кипеть, безжалостный судия обращается к блаженной девице и говорит: «Или ступай покорись воле твоего господина, или знай – я прикажу бросить тебя в этот котел». Потамиена отвечала: «Можно ли быть таким несправедливым судиею, чтобы приказывать мне повиноваться сладострастию?». Разъяренный судия повелевает раздеть ее и ввергнуть в котел. Тогда она вскрикнула и сказала: «Заклинаю тебя жизнью императора, которого ты боишься, – прикажи по крайней мере не раздевать меня, если ты уже присудил мне такую казнь, а вели понемногу опускать в смолу, и ты увидишь, какое терпение даровал мне Христос, Которого ты не знаешь». Таким образом, ее понемногу опускали в котел в продолжение часов почти трех, пока она не испустила дух, как скоро смола уже захватила у нее горло.'
        cn: 他们将一位勇敢的少女带到审判台前，开始用各种刑具折磨她的身体，同时，也用各种言语劝说她，但她的灵魂依然坚定不移，如同城墙。那时，审判官从刑具中选出最可怕、最痛苦的一种：他下令将一个巨大的铜锅装满沥青，并用最猛烈的火焰点燃。当沥青开始沸腾翻滚时，那无情的审判官转向这位蒙福的少女，说：「你要么去顺从你主人的意愿，要么你就知道——我将下令把你扔进这个锅里。」波塔米埃娜回答：「怎能有如此不公的审判官，命令我顺从淫欲？」被激怒的审判官下令剥光她的衣服，将她投入锅中。那时她呼喊道：「我以你所畏惧的皇帝的性命恳求你——如果你已经判我受此酷刑，至少请下令不要剥光我的衣服，而是吩咐将我慢慢地放入沥青中，你就会看到基督——你所不认识的那一位——赐予我的忍耐是何等之大。」就这样，她被一点点地放入锅中，将近三个小时，直到沥青淹没她的喉咙，她便立刻断了气。
  - type: heading2
    text:
      ru: О слепце Дидиме
      cn: 关于盲人狄迪默
    children:
    - type: paragraph
      text:
        ru: 'В Церкви Александрийской тогда было много святых мужей и жен, усовершившихся в добродетели и достойных наследовать «землю кротких». В числе их подвизался и блаженный писатель Дидим, совсем слепой. Я сам видел его раза четыре, когда назад тому лет десять ходил к нему. Он скончался восьмидесяти пяти лет. Слепцом сделался он, как сам мне рассказывал, еще по четвертому году, грамоте не учился и никаких учителей не знал: свой природный ум был для него верным наставником. Он украсился такою благодатию духовного ведения, что на нем самым делом исполнилось сказанное:«Господь умудряет слепцы»(Пс. 145, 8). Книги Ветхого и Нового Завета знал он все до слова, а догматы изучал так тщательно и учение, в них содержащееся, излагал так тонко и основательно, что ведением превзошел всех древних.'
        cn: 当时的亚历山大教会中，有许多圣洁的男士和女士，他们在美德上臻于完善，配得承受「谦和之人的地土」。在他们当中，蒙福的作家迪迪姆斯也在刻苦修行，他完全失明。我本人曾在他去世前大约十年，去看望过他大约四次。他去世时年寿八十五岁。正如他自己告诉我的，他在四岁的时候就失明了，没有学习文字，也没有受过任何老师的教导：他与生俱来的悟性是他忠实的导师。他被如此的属灵洞见恩典所妆饰，以至于在他身上真实地应验了那句经文：「上主使盲人有智慧」（诗篇 145:8）。旧约和新约的各卷书他都能一字不差地通晓；至于教义，他研究得如此详尽，并且其中所包含的教导，他阐述得如此精微而透彻，以至于在学识上他超越了所有古人。
    - type: paragraph
      text:
        ru: 'Однажды он заставлял меня сотворить молитву в своем доме, и как я не хотел, то он рассказал мне вот что: «В эту келию три раза входил блаженный Антоний посетить меня, и, когда я предлагал ему сотворить молитву, он тотчас преклонял колена в сей самой келии, не дожидаясь, чтобы я повторил приглашение, – так он научил меня послушанию самым делом. И ты, если последуешь его житию, как монах и пришелец ради добродетели, брось всякое упрямство».'
        cn: '有一次，他坚持要我在他家里做祷告。虽然我不愿意，但他还是对我说了下面这段话：


          「蒙福者安东尼曾三次进入这间小室拜访我。每当我请他祈祷时，他立刻就在这间小室里屈膝跪下，没等我再次邀请——他就是这样以身作则地教导我顺服。而你，如果你作为修士，作为为美德而来的客旅，效法他的生活，就该抛弃一切固执。」'
    - type: paragraph
      text:
        ru: 'Он же рассказывал мне еще следующее: «В один день я размышлял о жизни гонителя, несчастного царя Юлиана. Мне так было грустно от этих мыслей, что я ничего не вкушал до позднего вечера. И вот, сидя на скамье, заснул я и вижу в видении: мимо меня скачут на белых конях всадники и кричат: “Скажите Дидиму – сего дня, в седьмом часу, Юлиан скончался; встань и ешь и пошли весть епископу Афанасию на дом, чтобы и он узнал об этом”». «Я заметил, – сказал Дидим, – час и день, неделю и месяц – так и оказалось».'
        cn: 他接着又给我讲了下面这些事：「有一天，我正在思索迫害者的生平，那不幸的皇帝尤利安。这些念头让我如此悲伤，以至于我直到深夜都未曾进食。就这样，我坐在长凳上睡着了，并在异象中看到：有骑手骑着白马从我身边驰过，并呼喊道：『告诉迪迪莫斯——今日，在第七个小时，尤利安已死；起来吃饭，并派人把这消息送到主教阿塔纳修斯家里，好让他也得知此事。』」迪迪莫斯说：「我记下了小时和日子，星期和月份——结果正是如此。」
  - type: heading2
    text:
      ru: Об Александре
      cn: 关于亚历山大
    children:
    - type: paragraph
      text:
        ru: Рассказывал мне этот писатель Дидим об одной служанке, по имени Александра. Оставив город, она заключилась в гробнице и получала что нужно через отверстие, а сама не показывалась на глаза ни мужчинам, ни женщинам лет около десяти. В десятое лето почив, сия блаженная, говорят, сама себя приготовила к погребению. Женщина, которая к ней ходила, пришедши по обыкновению, не получила ответа и сказала нам об этом. Мы отправились, открыли вход в пещеру гроба, вошли туда и увидели, что она почила.
        cn: 这位作家季季莫斯向我讲述了一个名叫亚历山德拉的女仆。她离开城市后，将自己关在墓穴里，通过一个开口获得所需之物，自己大约十年间不向男人也不向女人露面。据说，在这第十年她安息后，这位蒙福的女子自己为安葬做好了准备。那个常去看望她的女人，照常前来后没有得到回应，就把这事告诉了我们。我们就去了，打开了墓穴的入口，走了进去，然后看到她已经安息了。
    - type: paragraph
      text:
        ru: 'Говорила нам о ней и приближенная Мелания Римляныня, о которой в свое время и в своем месте расскажу. «Не могла я, – говорит она, – видеть сию блаженную в лице, но, ставши у отверстия, просила ее открыть причину, по которой оставила она город и заключила себя во гробе. Она отвечала мне через отверстие: “Один человек сходил с ума по мне. Чтобы не огорчать и не бесчестить его, я лучше решилась заключить себя живою в этой гробнице, нежели соблазнить душу, созданную по образу Божию”. Когда я сказала ей: “Как же ты, раба Христова, выносишь это, что совсем никого не видишь, а одна ратуешь против скорби и помыслов?” – она отвечала: “С самого утра, часа до девятого, я молюсь и с час пряду лен, в остальные часы припоминаю себе сказания о вере святых отцов и патриархов, о подвигах блаженных апостолов, пророков и мучеников. Когда наступает вечер, я, принесши славословие Господу моему, ем свою долю хлеба, а ночь всю провожу в молитве, ожидая конца своего, когда разрешусь отселе с благою надеждою и явлюсь лицу Христову”».'
        cn: '罗马的梅拉尼亚，她的亲近者，也曾向我们讲述了她，我会在适当的时候和地方讲述她。「我无法，」她说，「亲眼见到这位蒙福的姊妹，但我站在墓穴的开口处，请她告知她离开城市并将自己幽禁在墓穴中的原因。」


          她透过开口回答我：「有一个男人为我痴迷。为了不使他忧伤，不让他蒙羞，我宁愿将自己活活地囚禁在这座坟墓里，也不愿使一个按照上帝形象所造的灵魂跌倒。」当我问她：「基督的仆人啊，你如何忍受这一切，完全不见任何人，独自一人与忧愁和思虑争战呢？」她回答说：「从清晨直到九点，我都在祷告，然后花一个小时纺麻线，剩下的时间里，我回忆圣教父和族长们的信仰故事，以及蒙福的使徒、先知和殉道者们的功迹。当夜晚降临，我向我的主献上赞美之后，便吃我那份面包，整夜都在祷告中度过，等待自己的终结，届时我将带着美好的盼望脱离此地，出现在基督的面前。」'
    - type: paragraph
      text:
        ru: Расскажу теперь и о тех, которые, имея вид благочестия, жили в небрежении о душе своей, – расскажу к похвале усовершившихся в добродетели и для предостережения читателей.
        cn: 我现在也要讲述那些有着虔敬形貌，却疏于照料自己灵魂的人——我讲述此事，是为了赞美那些在美德上臻于完善者，并为了警诫读者。
  - type: heading2
    text:
      ru: О сребролюбивой девственнице
      cn: 论贪财的贞女
    children:
    - type: paragraph
      text:
        ru: 'В Александрии была одна девственница – впрочем, по имени только, ибо хотя имела наружность смиренную, но в душе была скупа, сварлива и до крайности пристрастна к деньгам, больше златолюбивая, нежели христолюбивая: из своего имущества никогда не подавала она ни одного овола[4]ни страннику, ни бедному, ни монаху, ни девственнице, ни несчастному, ни в церковь. Несмотря на многие увещания святых отцов, она не свергала с себя тяжести богатства. Были у нее и родные, и она взяла к себе на воспитание дочь сестры своей. Ей-то день и ночь обещала она свое имущество, отвергшись сама небесной любви. А и это есть одно из обольщений диавола, что он порождает в человеке недуг любостяжания под предлогом родственной любви.'
        cn: 亚历山大城有一位贞女——然而，她仅仅是名义上的贞女；因为她虽外表谦卑，但内心却吝啬、好争吵，并且对金钱极度贪恋，与其说是爱基督，不如说是爱黄金。她从未从自己的财产中施舍哪怕一个奥波勒斯[4]给陌生人、穷人、修士、贞女、不幸之人，或教会。尽管圣教父们多次劝诫，她仍未能摆脱财富的重负。她有亲戚，并收养了她姐妹的女儿。她日夜向她许诺自己的财产，从而舍弃了天上的爱。而这正是魔鬼的一种诱惑，即以亲情之爱为借口，在人心中滋生贪婪的恶疾。
    - type: paragraph
      text:
        ru: 'О родстве у него совсем нет заботы – это видно из того, что он научил братоубийству, матере-убийству и отцеубийству, как известно из Священного Писания. Иногда кажется, он побуждает пещись о родных, но делает сие не по благорасположению к ним, а для того, чтобы увлечь душу к неправедному делу, верно зная сказанное –«неправедницы Царствия Божия не наследят»(1Кор. 6, 9). Кто водится духовным разумением и Божественною любовию, тот может, и не оставляя попечения о своей душе, помогать родным в нуждах и доставлять им различные пособия, но, кто всю душу свою поработил заботе о родных, тот подлежит суду закона за то, что мало ценил свою душу. И священный псалмопевец Давид так поет о тех, которые пекутся о душе в страхе Божием:«кто взыдет на гору Господню»(вместо того, чтобы сказать: редкий),«или кто станет на месте святем Его? Неповинен рукама и чист сердцем, иже не прият всуе душу свою»(Пс. 23, 3–4). А приемлют всуе душу свою те, кои думают, будто она разрушается вместе с этою плотию, и не радят о добродетелях духовных.'
        cn: 他对亲属关系毫不在意——这从他教唆兄弟相残、弑母和弑父一事中可见一斑，圣经对此早有记载。有时，他似乎促使人关怀亲属，但他这样做并非出于对亲属的善意，而是为了引诱灵魂走向不义之事，他深知经文所言——「不义的人必不能承受神的国」（哥林多前书 6:9）。凡受属灵领悟和神圣之爱引导的人，即使不放弃对自身灵魂的看顾，也能在亲属有需要时帮助他们，并提供各种援助；然而，凡将自己全部灵魂奴役于对亲属的关怀者，则因轻视自己的灵魂而要受律法的审判。圣哉的诗篇作者大卫如此歌咏那些在敬畏上帝中看顾自己灵魂的人：「谁能登上主的山？」（意即：稀少之人），「谁能站在他的圣所？就是手洁心清，不虚付自己灵魂的人。」（诗篇 23:3-4）。而那些虚付自己灵魂的人，就是认为灵魂会与这肉体一同消亡，并且不看重属灵美德的人。
    - type: paragraph
      text:
        ru: 'Сию девственницу, носившую только это имя, а нравом чуждую подвижничества, захотел излечить от недуга любостяжания святейший Макарий, пресвитер и надзиратель богадельни для увечных, и придумал следующее средство. Надобно заметить, что в молодости своей он обделывал камни. Вот он, пришедши к ней, говорит: «Попались мне дорогие камни – изумруды и яхонты; краденые они или купленные, не умею сказать, только эти камни бесценные. Хозяин продает их за пять сотен червонцев. Если тебе угодно купить их, дай мне эти деньги. Камни ты можешь употребить на наряды для своей племянницы». Девственница, всею душою привязанная к племяннице, обрадовавшись случаю нарядить ее, падает в ноги Макарию и говорит: «Сделай милость, не отдавай их никому!». Святой муж приглашает ее к себе. «Дойди, – говорит, – до моего дома и посмотри камни». Но она не захотела этого и тут же отдала ему пять сотен червонцев, говоря: «Прошу тебя, достань их, как хочешь: мне не хочется видеться с человеком, который продает их». Святой Макарий, взяв от нее пять сотен червонцев, употребил их на нужды богадельни.'
        cn: 这位贞女徒有其名，品性上却与苦修精神格格不入，圣马卡里乌斯，这位伤残者济贫院的长老兼监督，想要医治她贪婪之疾，于是想出了以下方法。值得一提的是，他年轻时曾是石匠。于是他来到她面前说：「我弄到了一些昂贵的宝石——祖母绿和红蓝宝石；它们是偷来的还是买来的，我无法说清，只知这些宝石是无价之宝。主人以五百金币出售它们。如果你愿意买下它们，就把钱给我。你可用这些宝石来装饰你的侄女。」这位贞女全心全意地依恋着她的侄女，一听说有机会打扮她，就欢喜雀跃，她跪倒在马卡里乌斯脚下说：「求你开恩，千万不要把它们给任何人！」这位圣人邀请她到他那里去。「你到我家来，」他说，「看看这些宝石。」但她不愿意，于是当场给了他五百金币，说：「我求你，无论如何都要弄到它们；我不想见到出售它们的人。」圣马卡里乌斯从她那里拿走五百金币，将其用于济贫院的需要。
    - type: paragraph
      text:
        ru: 'Прошло много времени, а девственница стыдилась напомнить ему о камнях, потому что этот муж пользовался в Александрии большим уважением, как старец весьма благочестивый и милостивый (он жил около ста лет, и я еще застал его в живых). Наконец, нашедши его в церкви, говорит ему: «Что ж те камни, за которые мы дали пять сотен червонцев?». Он отвечал ей: «В тот же самый день, как ты дала мне деньги, я и заплатил их за камни, и, если хочешь увидеть их, пойди в мой странноприимный дом – там лежат эти камни. Посмотри, понравятся ли они тебе; в противном случае возьми свои деньги назад». Девственница пошла с радостию.'
        cn: 过了许久，但那贞女羞于向他提起那些石头，因为这人在亚历山大城深受尊敬，被视为一位非常虔诚且慈悲的长老（他活了将近一百岁，我甚至还见过他健在）。终于，她在教堂里找到了他，对他说：「我们为之付了五百金币的那些石头怎么样了？」他回答她说：「就在你给我钱的同一天，我就已经为那些石头付了款，而且，如果你想看到它们，就去我的接待所——那些石头就放在那里。看看你是否喜欢它们；否则，就把你的钱拿回去。」那贞女欣然前往。
    - type: paragraph
      text:
        ru: 'Странноприимный дом имел два отделения: в верхнем помещались женщины, а в нижнем – мужчины. Когда она пришла к дому, святой вводит ее в ворота и говорит: «Что угодно тебе сперва видеть – яхонты или изумруды?». «Что хочешь», – отвечает она. Макарий повел ее наверх и, указывая на женщин увечных, слепых, сказал ей: «Это вот яхонты!». Потом свел ее вниз и, указывая на таких же мужчин, сказал: «А это изумруды! И я полагаю, что драгоценнее этих нигде не найти! Если они не нравятся тебе, возьми свои деньги назад». Пристыженная, девственница вышла и, пришедши домой, занемогла от великой печали, потому что сделала доброе дело не по любви к Богу, а против воли. После, когда девица, о коей заботилась она, по выходе замуж умерла бездетною и когда она уже сама стала употреблять свое имущество как должно, она благодарила старца.'
        cn: 这接待院有两个区：上层住着女性，下层住着男性。当她来到这接待院时，圣人将她带进大门，说道：「你希望先看什么——是红宝石还是祖母绿？」「随您心意，」她回答说。马卡里奥斯带她上楼，指着那些残疾失明的妇女，对她说：「这些就是红宝石！」随后他带她下楼，指着同样状况的男人，说道：「而这些就是祖母绿！我认为，比这些更珍贵的在任何地方都找不到！如果他们不合你心意，你就把你的钱拿回去。」羞愧之下，这位童贞女走了出去，回到家后，因极大的悲伤而病倒了，因为她所做的这件善事并非出于对上帝的爱，而是违背了自己的意愿。后来，当她所关照的那个少女嫁人后无子而死，而她自己也开始以合宜的方式使用自己的财产时，她感谢了这位长老。
  - type: heading2
    text:
      ru: О нитрийских подвижниках
      cn: 关于尼特里亚的苦修者
    children:
    - type: paragraph
      text:
        ru: Посетив многих святых и прожив года три в монастырях около Александрии, где видел до двух тысяч великих весьма ревностных и доблестных мужей, украшенных всякою добродетелию, я оттуда пошел в Нитрийскую гору. Между этою горою и Александриею находится озеро, называемое Мариа́. Оно простирается миль на семьдесят. Переплыв его, через полтора дня пришел я к горе со стороны полуденной; к сей горе прилежит большая пустыня, простирающаяся даже до Ефиопии, Мазиков и Мавритании. По горе живет до пяти тысяч мужей, которые ведут различный образ жизни – кто как может и хочет, так что можно там жить по одному, и по двое, и многим вместе. У них семь пекарен, в которых готовят хлебы и для себя, и для отшельников, удалившихся в большую пустыню, числом до шестисот. Прожив в сей горе целый год и получив великую пользу от блаженных и преподобных отцов, каковы Арсисий Великий, Путуваст, Агион, Хроний и Серапион, я, возбужденный многими их рассказами о древнейших духовных отцах, пошел в самую глубину пустыни.
        cn: 拜访了许多圣徒，并在亚历山大附近的修道院里住了大约三年，在那里我看到了多达两千名极其热忱、勇敢的修士，他们以各种美德为装饰，之后我便从那里去了尼特里亚山。这座山与亚历山大之间有一个湖，名叫玛利亚湖，它绵延约七十英里。渡过这个湖后，我花了一天半时间从南面来到了这座山；这座山毗邻一片广阔的沙漠，一直延伸到埃塞俄比亚、马齐科斯和毛里塔尼亚。山上有多达五千名修士居住，他们过着各种不同的生活——每个人都按照自己的能力和意愿，因此在那里可以独居，也可以两人同住，或者多人共居。他们有七家面包房，为自己以及那些退隐到大沙漠里的多达六百名隐修者制作面包。在这座山里住了一整年，并从蒙福的、受尊敬的教父们那里受益匪浅，例如阿尔西修斯大修士、普图瓦斯特、阿吉翁、赫罗尼乌斯和塞拉皮翁，我受到他们关于古时灵修教父的许多叙述的激励，便进入了沙漠的最深处。
    - type: paragraph
      text:
        ru: В этой горе Нитрийской только одна церковь, весьма обширная. Подле церкви находится странноприимный дом, в котором содержат странника во все время пребывания его в горе, хотя бы оно продолжалось два или три года, пока он не захочет оставить гору. Ему дозволяют жить без дела только одну неделю, а в следующие дни ему дают дело или в саду, или в пекарне, или на поварне. Если же странник – человек знатный, то ему дают читать книги, но беседовать ни с кем не дозволяют до шестого часа дня. В этой горе живут и врачи и аптекари. Употребляют здесь и вино и продают его. Платье себе делают все сами, своими руками, так что в этом отношении они не знают нужды. По наступлении вечера можно стать и слышать в каждой келии хвалебные песни и псалмы, воспеваемые Христу, и молитвы, воссылаемые на небеса, – иной подумал бы, что он восхищен и перенесся в рай сладости. В церковь собираются только по субботам и по воскресным дням. При этой церкви восемь пресвитеров, но, доколе жив первый пресвитер, прочие не служат, не судят и не говорят поучений, а только совосседают с ним в безмолвии.
        cn: '在尼特里亚山，只有一座极其宽敞的教堂。教堂旁有一所招待所，供养来访的旅人，只要他们居留在此山，无论是两三年，直到他们想离开为止。旅人只被允许无事居留一周，接下来的日子里，他们会给旅人安排工作，或在花园里，或在面包房里，或在厨房里。如果这位旅人是位尊贵之人，那么他们会给他书阅读，但不许他在正午之前与任何人交谈。


          在这座山里住着医生和药剂师。这里既饮用也出售葡萄酒。他们的衣物都由自己亲手制作，因此在这方面他们不致匮乏。夜幕降临后，你可以驻足倾听，在每间小室里，都有赞美基督的颂歌和圣咏，以及向上天呈奉的祷告——旁人可能会以为自己被提升并被带到了甜蜜的乐园。


          他们只在周六和周日聚集在教堂。这座教堂有八位长老，但只要首席长老在世，其他长老就不举行圣事，不施行判断，也不讲道，而只是与他一同静默地坐着。'
    - type: paragraph
      text:
        ru: Великий Арсисий и с ним многие другие святые старцы, которых мы видели, были современниками блаженному Антонию. Из них Великий Арсисий сам мне рассказывал, что он знал и Аммуна Нитрийского, душу которого видел Великий Антоний, когда ее приняли Ангелы и возносили на небо. Говорил он еще, что знал и Пахомия Тавеннского, имевшего дар пророческий и бывшего архимандритом трех тысяч мужей. О его добродетелях расскажу после.
        cn: 大阿锡修斯以及与他同在的许多其他我们曾见过的圣洁的长老们，都是蒙福的安东尼的同时代人。他们当中，大阿锡修斯曾亲自告诉我，他认识尼特里亚的阿蒙，大安东尼曾看见他的灵魂，当天使们接引并将其升上天堂时。他还说，他也认识塔本尼西的帕科缪，他有预言的恩赐，并且曾是三千名修士的院长。关于他的美德，我之后会讲述。
  - type: heading2
    text:
      ru: Об Аммуне
      cn: 论阿蒙
    children:
    - type: paragraph
      text:
        ru: 'Арсисий Великий сказывал мне, как жил Аммун. Оставшись после родителей сиротою, он на двадцать втором году от роду принужден был своим дядею вступить в супружество. Не могши противиться настоятельному требованию дяди, он решился обвенчаться, сидеть при брачном торжестве и выполнить все брачные обряды. Но, как скоро вышли все провожавшие их в брачный покой, блаженный Аммун запирает дверь и, севши, начинает беседовать с блаженною своею супругою и говорит ей: «Приди сюда, госпожа и сестра моя, я поговорю с тобою. В браке нашем особенно хорошего ничего нет. Так, хорошо мы сделаем, ежели с нынешнего же дня станем спать порознь. Сохраняя таким образом девство свое неприкосновенным, мы угодим и Христу». Вынув потом из-за пазухи Библию, он как бы от лица апостолов и Самого Спасителя начал читать ее юной девице, незнакомой с Писанием, изъясняя ей большую часть прочитанных мест своим богопросвещенным умом, и наставлял ее в девственной и непорочной жизни, так что она, исполнившись благодатию Христовою, сказала: «И я, господин мой, решилась с радостию проводить святую жизнь и буду делать все, что повелишь мне». «Я повелеваю и прошу, – отвечал он, – чтобы каждый из нас отселе жил особо». Но это еще было тяжело для нее, и она сказала: «Останемся в одном доме, только ложе у нас будет раздельное». Так жил он с нею в одном доме лет восемнадцать.'
        cn: 伟大的阿尔西西斯告诉我安蒙如何生活。他父母双亡后成为孤儿，二十二岁时被他的叔父强迫步入婚姻。无法反抗叔父的强烈要求，他决定接受婚配礼，参加婚宴，并完成所有的婚俗仪式。然而，当所有送他们入洞房的人都离开后，蒙福的安蒙锁上门，坐下后，开始与他蒙福的妻子交谈，对她说：「到这里来，我的主妇和姐妹，我要与你谈谈。我们的婚姻并没有什么特别好的。因此，如果从今天起我们分床而睡，那将是件好事。这样，我们就能保持童贞的纯洁不受侵犯，我们也能取悦基督。」随后，他从怀中取出《圣经》，仿佛代表着使徒和救主本人，开始向这位不熟悉圣经的年轻女子诵读圣经，用他蒙神光照的智慧向她解释所读经文的大部分内容，并教导她过贞洁和无瑕的生活，以至于她，充满基督的恩典，说道：「我的主人，我也欣然决定过圣洁的生活，并会遵行您所吩咐的一切。」「我命令并请求，」他回答道，「从今以后我们各自独居。」但这对于她来说仍然很困难，她说道：「我们仍然住在同一个家里，只是我们的卧榻要分开。」他就这样与她在同一个家里住了约十八年。
    - type: paragraph
      text:
        ru: 'День весь работал в саду и в бальзамовой роще (он занимался добыванием бальзама). Бальзамовый куст растет так же, как виноград, и, для того чтобы его возделывать и ходить за ним, требуется много трудов. Повечеру, пришедши домой и помолившись, он вместе с супругою вкушал пищу, потом возносил ночные молитвы и совершал молитвословия, а весьма рано поутру уходил в свой сад. Когда таким образом оба они достигли бесстрастия – молитвы святого Аммуна воздействовали, – наконец блаженная и говорит ему: «Я имею нечто сказать тебе, господин мой; если ты меня послушаешь, я удостоверюсь, что ты меня истинно по Богу любишь». Он сказал ей: «Говори, что ты хочешь сказать». Она продолжала: «Ты муж благочестивый и подвизаешься в правде, и я ревную житию твоему; точно, нам лучше жить особо; многие получат от сего пользу. А теперь, когда ты непорочно живешь со мною о Господе, столь великое твое совершенство любомудрия от всех сокрыто из-за меня; это неблагоразумно». Поблагодарив ее и воздав хвалу Богу, Аммун говорит ей: «Хорошо ты вздумала, госпожа и сестра моя; если тебе угодно, оставайся ты в этом доме, а я пойду построю себе другое жилище».'
        cn: 他整天在园子里和香膏林里劳作（他从事香膏的提取）。香膏灌木的生长方式与葡萄相似，为了培植和照料它，需要付出大量辛劳。傍晚时分，他回到家并祷告后，与妻子一同用餐，随后献上夜祷并举行祈祷礼，而在清晨极早时分便前往他的园子。当他们两人以这种方式达到无情欲状态时——圣阿穆恩的祷告发挥了作用——最终，这位蒙福的女人对他说：「我有些话要对你说，我的主；如果你听从我，我就会确信你真是按着上帝爱我。」他回应她说：「说吧，你想说什么。」她继续说：「你是一位虔诚的丈夫，在公义中苦修，我也羡慕你的生活；确实，我们最好分开居住；许多人将因此而受益。但现在，当你因着主与我无瑕地生活时，你如此伟大的智慧之圆满因我而向所有人隐藏；这是不明智的。」阿穆恩感谢她并赞美上帝，对她说：「你这想法很好，我的主母和姊妹；如果你愿意，你就留在这个家里，我就去为自己另建一个居所。」
    - type: paragraph
      text:
        ru: Разлучившись с нею, он пошел внутрь Нитрийской горы – на ней в то время не было так много монастырей, – построил себе двухэтажную келию, и, прожив еще двадцать два года в пустыне и достигши до высоты подвижнической добродетели, святой Аммун скончался или, лучше, почил в монашеской жизни шестидесяти двух лет от роду. Со своею супругою виделся он в год два раза.
        cn: 与她分离后，他进入尼特利亚山——当时山上没有那么多修道院——为自己建造了一间两层的隐修室，并在沙漠中又居住了二十二年，达到了苦修德行的巅峰，圣安蒙便去世了，或者更确切地说，是在修道生活中安息了，享年六十二岁。他与他的妻子一年相见两次。
    - type: paragraph
      text:
        ru: 'Когда он жил уже один в Нитрийской горе, рассказывают, принесли к нему скованного цепями отрока, находившегося в бешенстве, которое открылось в нем от укушения бешеною собакою. От несносной боли отрок всего себя искусал до крови. Святой Аммун, видя родителей его, пришедших просить о сыне, сказал им: «Что вы меня утруждаете, требуя того, что превышает мои силы? У вас в руках готова помощь! Вознаградите вдовицу, у которой вы тайно закололи вола, и отрок ваш будет здоров». Пораженные уликою, они с радостию исполнили, что было велено. И по молитве Аммуна отрок стал здоров.'
        cn: 当他独自居住在尼特里亚山上时，据说人们给他带来一个被锁链束缚的少年，他正处于狂怒之中，这种狂怒是因被疯狗咬伤而发作的。因无法忍受的剧痛，这少年把自己全身都咬得鲜血淋漓。圣阿蒙看到他的父母前来为他们的儿子祈求，就对他们说：「你们为何劳烦我，要求超出我能力范围的事情？你们手中帮助已经备好！赔偿那个寡妇，你们曾秘密宰杀了她的牛，你们的儿子就会康复了。」他们被这指控震惊，就欣然照办了所吩咐的。于是，通过阿蒙的祷告，那少年就康复了。
    - type: paragraph
      text:
        ru: 'Однажды несколько человек пришли к нему чтобы его видеть. Святой муж, испытывая их, сказал: «Привезите мне одну бочку воды, чтобы у меня ее довольно было для принятия приходящих». Они обещали привезти бочку. Но, вышедши из келии, один из них стал жалеть, что дал обещание, и говорит другому: «Не хочу губить своего верблюда: он падет, если везти на нем бочку». Услышав это, другой запряг своих ослов и с большим трудом ввез бочку в гору. Аммун шел навстречу и спрашивает его: «Отчего это пал верблюд твоего товарища в то самое время, как ты шел сюда?». Тот, возвратившись, действительно увидел, что верблюда растерзали гиены.'
        cn: 有一次，几个人来到他那里，为要见他。圣人考验他们说：「你们给我运一桶水来，让我有足够的水用来接待来访者。」他们答应了运那桶水。但走出小室后，其中一人开始后悔自己所做的承诺，并对另一个人说：「我不想毁了我的骆驼：如果用它来运那桶水的话，它会累垮的。」听到这话，另一个人套上他的驴子，并费了很大的劲把那桶水运上了山。阿姆蒙迎上前去问他：「为什么你同伴的骆驼，就在你来这里的路上倒下了呢？」那人回去后，果然看到骆驼被鬣狗撕碎了。
    - type: paragraph
      text:
        ru: 'Много и других чудес совершил муж сей. О следующем чуде его рассказывает блаженныйАфанасий Александрийскийв описании жития Антониева. Однажды ему нужно было перейти чрез реку Ликон с Феодором, учеником своим, а раздеться он стыдился, чтобы не увидеть своей наготы. Находясь в таком раздумье, он вдруг явился на той стороне реки, как бы в исступлении перенесенный Ангелами. Братия же переплыли реку. Когда он пришел к Антонию, то Антоний первый ему стал говорить: «Бог открыл мне многое о тебе и о твоем преставлении возвестил мне. Потому я и приглашал тебя к себе так настоятельно, чтобы, видя друг друга, мы могли взаимно помочь один другому». Он указал ему жилище в одном самом уединенном месте и просил не уходить отсюда до преставления. И когда Аммун скончался в своем уединении, блаженный Антоний видел, как Ангелы возносили душу его на небо. Таковы жизнь и кончина Аммуна. Та река Ликон есть не что иное, как глубокий рукав огромного Нила, и мне даже в лодке страшно было переправляться чрез нее.'
        cn: '这位圣徒还行了许多其他神迹。蒙福者亚他那修·亚历山德里亚在他的《安东尼生平》中讲述了他的下一个神迹。


          有一次，他需要和他的门徒提奥多尔渡过利孔河，但他羞于脱衣，以免显露自己的赤身。当他正陷于这样的沉思中时，他突然出现在河的对岸，仿佛被天使在神魂超拔中带了过去。而弟兄们则游过了河。当他来到安东尼那里时，安东尼首先对他说道：「上帝向我启示了许多关于你的事，并向我预告了你的离世。因此我才如此恳切地邀请你来我这里，以便我们彼此相见，就能相互帮助。」安东尼给他指了一个在最僻静之处的住处，并请求他在此地住下，直到他离世。当阿姆蒙在他隐修之处去世时，蒙福者安东尼看见天使将他的灵魂升上天堂。这就是阿姆蒙的生平与逝世。


          那条利孔河，不是别的，正是浩瀚尼罗河的一条深邃的支流，甚至我坐船渡过它也感到害怕。'
  - type: heading2
    text:
      ru: Об Оре
      cn: 关于奥尔
    children:
    - type: paragraph
      text:
        ru: 'В сей же горе Нитрийской был чудный подвижник по имени Ор. В его монастырях было до тысячи братий. Вид имел он ангельский. Ему было девяносто лет от роду, но тело его ничего не потеряло: лицо у него было светлое и бодрое и с первого взгляда оно внушало почтение к себе. Сначала долгое время подвизался он в дальней пустыне, но впоследствии основал монастыри в ближней и на месте болота развел деревья, тогда как тут их совсем не было, так что в пустыне разросся густой лес. Жившие с ним отцы сказывали нам, что там даже и куста не было, когда этот муж пришел сюда из пустыни. Развел он этот лес для того, чтобы братиям, собиравшимся к нему, не было нужды ходить по сторонам за необходимыми припасами; о них он прилагал всякое попечение, молился Богу и сам трудился ради их спасения, дабы у них не было недостатка ни в чем необходимом и чтобы никакого предлога не имели они к нерадению.'
        cn: 在这尼特里山上，有一位名叫奥尔的奇妙修道者。在他的修道院里，有多达一千名修士。他有着天使般的外貌。他已有九十岁高龄，但他的身体丝毫未曾衰退：他的脸庞明亮而有活力，且一眼便能让人心生敬意。最初，他在遥远的旷野里修行了很长时间，但后来在近处的旷野建立了修道院，并在沼泽地种植了树木，而当时那里根本没有树木，以致于旷野中长成了一片茂密的森林。与他同住的教父们告诉我们，当这位修士从旷野来到这里时，那里甚至连一棵灌木都没有。他种植这片森林是为了让聚集到他身边的修士们不必四处奔走寻找必需的补给；他对他们倾注了所有的关怀，向上帝祈祷，并且他自己也为了他们的救赎而辛劳，以免他们缺少任何必需之物，并且以免他们有任何怠惰的借口。
    - type: paragraph
      text:
        ru: 'Сначала, живя в пустыне, он питался травами и сладкими кореньями, воду пил, когда находил, и все время проводил в молитвах и пении. Когда же достиг глубокой старости, явился ему в пустыне Ангел во сне и сказал: «Ты будешь в язык великий, и великое множество людей будет вверено руководству твоему. Спасется чрез тебя десять тысяч, и все, сколько ты приобретешь здесь, будут повиноваться тебе в будущем веке. Оставь всякое сомнение, – продолжал Ангел, – в необходимых потребностях не будет у тебя недостатка до самой смерти твоей, когда только ни призовешь Бога». Выслушав слова сии, он пошел в ближнюю пустыню и, выстроив себе небольшую хижинку, жил в ней сначала один, довольствовался одними овощами, да и тех вкушал в неделю часто только по однажды.'
        cn: 起初，他在旷野生活时，以野草和甜根为食，找到水时才饮用，所有时间都用于祈祷和歌颂。当他年迈之际，一位天使在梦中向他显现，并说：「你将成为一个大族群，众多的人将交由你引导。将有万人藉你得救，凡你在此所获得的，在来世都将顺从你。抛开一切疑虑，」天使继续说，「你在必要的需求上将永不缺乏，直到你离世，只要你呼求神。」听了这些话，他便去了附近的旷野，盖了一间小茅屋，起初独自住在其中，仅靠蔬菜度日，而且常常每周只吃一次。
    - type: paragraph
      text:
        ru: 'Он был совсем неученый, но по выходе из пустыни в населенное место ему дана была от Бога такая благодать, что он наизусть знал Священное Писание. Когда братия подавали ему Библию, он тотчас начинал читать, как грамотный. Получил он и другую благодать: именно власть изгонять бесов, так что многие из одержимых ими громко проповедовали о его житии, хотя он и не хотел того. Совершил он много и других исцелений. Поэтому стеклись к нему три тысячи монахов. Видев их, он радостно приветствовал и лобызал их. Сам, своими руками умывал им ноги и потом предлагал поучение.'
        cn: 他是一个完全没有学识的人，但当他从旷野出来到了有人居住的地方时，他从上帝那里得到了这样一份恩典，以至于他能背诵圣经。当弟兄们把《圣经》递给他时，他立刻开始诵读，就像一个有文化的人一样。他还得到了另一份恩典：就是驱赶邪灵的权柄，以至于许多被邪灵附身的人大声宣讲他的生平，尽管他并不希望如此。他还施行了许多其他的医治。因此，有三千名修士聚集到他身边。见到他们，他喜悦地迎接并亲吻了他们。他亲自用双手为他们洗脚，然后给他们提供了教诲。
    - type: paragraph
      text:
        ru: В Писании он был весьма сведущ, так как получил сию благодать от Бога. Изъяснив многие главы из Священного Писания и преподав православное учение о вере, он приглашал их к молитвословию, ибо великим мужам обычно не прежде приступать к плотской трапезе, как уже напитав свои души духовною пищею – эта пища есть принятие Тела Христова. По приобщении и по принесении Богу славословия Ор приглашал братий к трапезе, а сам во время стола предлагал добрые и полезные наставления и беседовал с ними о спасении.
        cn: 他对圣经非常精通，因为他从上帝那里领受了这份恩典。他阐明了圣经中的许多篇章，并传授了关于信仰的东正教教义后，便邀请他们去祷告，因为对伟人而言，通常是先用属灵的食物——这食物就是领受基督的圣体——喂养了他们的灵魂，然后才开始享用肉体的膳食。领受圣体并向上帝献上赞美后，奥尔邀请弟兄们用餐，他自己则在席间提供良好而有益的教导，并与他们谈论救赎。
    - type: paragraph
      text:
        ru: Он славился и своею распорядительностию. Так, множеству монахов, которые собирались к нему, он в один день выстраивал келии. Для этого он созывал всю наличную братию, и один готовил у него глину, другой – кирпичи, иной черпал воду. Когда келии были готовы, приходящие получали от него все нужные вещи. Пришел к нему один лжебрат со своим собственным платьем, которое было у него спрятано, и Ор пред всеми обличил его. Оттого никто не смел лгать пред ним, ибо все знали, какую благодать приобрел он себе своею святою жизнию. Сонм монахов, когда они были с ним в церкви, подобился ликам Ангелов, хвалящих Бога.
        cn: 他也以其组织才能而闻名。例如，对于聚集到他那里的众多修士，他可以在一天之内为他们建造好小室。为此，他召集所有在场的弟兄们，一个人在他那里准备黏土，另一个人准备砖块，还有一个人汲水。当小室准备就绪时，来的人们便从他那里得到一切必需品。有一个假弟兄来到他那里，带着他藏起来的自己的衣物，奥尔当着众人斥责了他。因此，没有人敢在他面前说谎，因为所有人都知道他借着自己的圣洁生活为自己赢得了何等的恩典。当修士群与他在教堂里时，他们就像赞美上帝的天使队伍。
    - type: paragraph
      text:
        ru: Вся братия свидетельствует о его великих добродетелях, а особенно раба Божия Мелания, прежде меня приходившая в сию Гору. Сам я не застал его в живых. Рассказывая о великих совершенствах сего мужа, она говорила, что он не лгал и не божился, никого не злословил и без нужды никогда не говорил.
        cn: 所有的弟兄们都见证了他的伟大美德，尤其是上帝的仆女墨拉妮娅，她比我更早来到这座山。我本人未曾亲见他仍在世。她在讲述这位弟兄的伟大完满时说，他从不说谎，也不以神的名起誓，从不诽谤任何人，并且从不无故讲话。
  - type: heading2
    text:
      ru: О Памво
      cn: 关于帕姆沃
    children:
    - type: paragraph
      text:
        ru: 'В Нитрийской же горе жил блаженный Памво, учитель епископа Диоскора,Аммонияи братьев Евсевия и Евфимия, такжеОригена, племянника Драконтия, славного и дивного мужа. Множеством великих совершенств и доблестей украшался этот Памво. Но венцом великих совершенств его было такое презрение к золоту и серебру, какого требует слово Господне. Блаженная Мелания рассказывала мне, что она вскоре по прибытии из Рима в Александрию, услышав от блаженного пресвитера Исидора-странноприимца о добродетельном житии Памво, в сопутствии самого Исидора отправилась к нему в пустыню. «Принесла я с собой, – говорила она, – ящичек с тремястами литр[5]серебра и просила его принять это приношение от моих стяжаний. Он сидел и плел ветви и, не оставляя своей работы, дал мне только словесное благословение, сказав: “Бог наградит тебя”. Потом сказал эконому Оригену: “Возьми это и употреби на нужды братии, живущей в Ливии и по островам: сии монастыри скуднее прочих”. а  из живущих в Египте братий никому не велел давать из этих денег, потому что страна сия, говорил он, плодороднее других».'
        cn: 在尼特利亚山，住着蒙福者潘波，他是主教迪奥斯科鲁斯、阿莫尼乌斯以及欧西比乌斯和欧提米乌斯兄弟的老师，也是德拉孔提乌斯的侄子奥利金的老师，奥利金是一位卓越而令人惊叹的人。潘波以其众多的伟大完满和美德而受人景仰。然而，他伟大完满的顶峰，却是他对金银的轻蔑，正如主的话语所要求的那样。蒙福者墨拉妮娅曾告诉我，她从罗马抵达亚历山大港后不久，从蒙福的款待者伊西多尔长老那里听说了潘波的德行生活，便在伊西多尔本人陪伴下前往沙漠找他。「我随身带来了一个小箱子，」她说道，「里面装着三百利特拉[5]银子，并请求他接受这份来自我个人所得的奉献。他当时正坐着编织树枝，并没有放下手中的活计，只是口头祝福了我，说道：「愿上帝奖赏你。」随后他对管家奥利金说：「收下这些，用以供养住在利比亚和岛屿上的弟兄们的需要：这些修道院比其他地方的更为贫困。」至于住在埃及的弟兄，他却吩咐不要给他们任何这笔钱，因为他说，这片土地比其他地方更为肥沃。」
    - type: paragraph
      text:
        ru: '«Я стояла, – говорит Мелания, – и ждала, что он почтит меня благословением или хотя слово скажет в похвалу за такое приношение, но, ничего не слыша от него, сама сказала ему: “Господин мой, да будет тебе известно, что серебра здесь триста литр”. Он и при этом не показал никакого внимания и отвечал мне, даже не взглянув на ящичек: “Дочь моя! Кому ты принесла это, Тому не нужно сказывать, сколько тут весу: Он взвесил горы и холмы поставил весом, тем паче знает вес твоего серебра. Если бы ты отдала его мне, то хорошо было бы сказать и о его количестве, но если ты принесла его Богу, Который не отвергнул и двух лепт[6], но еще оценил их дороже всех других приношений, то молчи и будь спокойна”».'
        cn: 「我站着，」墨拉尼亚说，「等着他能赐我一个祝福，或者至少为这奉献说一句赞扬的话，但什么也没听到，便自己对他说：「我的主啊，请你知晓，这里有三百磅银子。」即使如此，他也没有表现出任何关注，甚至没有看一眼那个小盒子，便回答我说：「我的女儿啊！你将这奉献给谁，就不需要告诉祂这里有多少重量：祂衡量了群山，也用天平量了丘陵，更何况祂知道你银子的重量。如果你把它给了我，那么说出它的数量是好的；但如果你把它献给了上帝，祂连两文钱[6]也没有拒绝，反而认为它们比所有其他奉献都更有价值，那么就请安静，心平气和吧。」」
    - type: paragraph
      text:
        ru: '«Так домостроительствовала благодать Господня, – говорила блаженная, – когда пришла я в Гору! По малом времени раб Божий почил без болезни и без всякого страдания телесного. Он плел корзину и послал за мною. Когда вплетен был уже последний прут, он сказал мне: “Возьми эту корзину из моих рук на память обо мне – другого ничего не могу оставить тебе”. Он отошел, предав дух свой Господу, без болезни семидесяти лет от роду. Обвив тело святого тонким полотном и положив его во гроб, я оставила пустыню, а корзину ту буду беречь у себя до самой смерти».'
        cn: 「主的恩典如此安排啊，」那蒙福的她说道，「当我来到圣山的时候！不久之后，主的仆人便安息了，没有疾病，也没有任何身体上的痛苦。他正在编织一个篮子，并差人叫我。当最后一根柳条已经编好时，他对我说：『请从我手中接过这个篮子，作为对我的纪念 – 我再没有别的可以留给你了。』他离去了，将自己的灵魂交托给主，享寿七十岁，没有疾病。用薄麻布包裹了圣者的遗体，并把他安放在坟墓里之后，我离开了旷野，至于那个篮子，我将把它珍藏在身边，直到我离世。」
    - type: paragraph
      text:
        ru: 'Говорят также, что Памво пред своею смертию, в самый час преставления, сказал стоявшим при одре его пресвитеру и эконому, Оригену и Аммонию, мужам известным по жизни: «С того времени, как, пришедши в эту пустыню, построил я себе келию и стал жить в ней, не провел я ни одного дня без рукоделия; не помню, чтобы когда-нибудь съел кусок хлеба, данный кем-нибудь даром; до сего часа не раскаиваюсь ни в одном слове, которое сказал я; и теперь отхожу к Богу так, как бы еще не начинал служить Ему». Рабы Христовы Ориген и Аммоний точно подтверждали это и сказывали нам еще, что, когда спрашивали Памво о чем-либо из Писания или касательно жизни, он никогда не отвечал на вопрос тотчас, но говорил, что еще не нашел ответа. Часто проходило месяца три, а он не давал ответа, говоря, что еще не знает, что отвечать. Памво из страха Божия был весьма осмотрителен в своих ответах, так что их принимали с благоговением, как бы изречения Самого Бога. Этою добродетелию, то есть осмотрительностию в слове, говорят, он превосходил дажеАнтония Великогои всех святых.'
        cn: '人们也说，潘博在临终前，就在他离世的时刻，对着站在他床榻旁的长老和管家，俄利根和阿摩尼乌斯——两位以其生命闻名的人士——说：


          「自从我来到这片旷野，为自己建造了隐修室并住在其中以来，我没有一天不做手工；我不记得曾吃过任何人白白给予的一块面包；直到此刻，我对我说过的任何一句话都没有后悔；而现在我正回到上帝那里，就像我从未开始侍奉祂一样。」


          基督的仆人俄利根和阿摩尼乌斯确切地证实了这一点，并还告诉我们，当人们向潘博询问一些关于《圣经》或生活的事情时，他从不立即回答问题，而是说他还没有找到答案。常常是三个月过去了，他仍未给出答案，说他还不清楚该如何回答。潘博出于对上帝的敬畏，在回答时极其谨慎，以至于人们恭敬地接受他的回答，如同来自上帝本人的话语。人们说，凭借着这种美德，即言语上的谨慎，他甚至超越了大安东尼和所有圣徒。'
  - type: heading2
    text:
      ru: О Пиоре
      cn: 关于皮奥尔
    children:
    - type: paragraph
      text:
        ru: 'Между прочими деяниями святого Памво рассказывают еще следующее. Однажды блаженный Пиор, подвижник, пришел в его келию со своим хлебом. Когда Памво упрекнул его, для чего он так сделал, Пиор отвечал ему: «Для того, чтобы тебе не быть в тягость». Памво молча отпустил его. Спустя несколько времени приходит Великий Памво в келию Пиора также со своим хлебом, который был уже и размочен у него. На вопрос Пиора, зачем он принес хлеб размоченный, Памво отвечал: «Чтобы и мне не быть тебе в тягость, я сам размочил хлеб».'
        cn: '在圣帕姆沃的其他事迹中，还记载了以下这件事。


          有一次，蒙福的苦修者皮奥尔带着他自己的饼来到他的小室。当帕姆沃责备他为何这样做时，皮奥尔回答他说：「为了不成为你的重担。」帕姆沃默默地让他离开了。过了些时候，伟大的帕姆沃来到皮奥尔的小室，也带着他自己的饼，这饼在他那里已经被泡软了。当皮奥尔问他为何带来泡软的饼时，帕姆沃回答说：「为了我也不会成为你的重担，我自己泡软了饼。」'
  - type: heading2
    text:
      ru: Об Аммонии
      cn: 关于安莫尼
    children:
    - type: paragraph
      text:
        ru: 'Аммоний, бывший учеником Великого Памво, вместе с тремя другими братиями и двумя сестрами, достигши самой высокой степени боголюбия, поселились в пустыне и построили два особых монастыря: братья – мужской, а сестры – женский, на довольном расстоянии один от другого. Между тем Аммония в одном городе пожелали иметь епископом, ибо великий сей муж обладал ученостию необыкновенною. Посланные от города пришли к блаженному епископу Тимофею и просили его рукоположить им Аммония во епископа. «Приведите его ко мне, – отвечал епископ, – и я рукоположу вам его». Взяв с собою довольно людей, они пошли за ним. Но Аммоний бежал. Видя наконец, что его догоняют, он остановился и стал их упрашивать. Когда же те не слушали, он поклялся им, что не примет сана и не может оставить пустыню. Когда и это не подействовало, он при всех взял ножницы и совсем отрезал у себя левое ухо до корня, сказав: «Теперь вы должны увериться, что мне нельзя принять сана, к которому меня принуждаете, ибо закон повелевает не допускать того к священству, у кого отрезано ухо». После сего они, оставив его, ушли и, пришедши к епископу, рассказали об этом. Тот им говорит: «Закон этот пусть наблюдают иудеи, а ко мне ежели приведете хотя и безносого, только достойного по жизни, я рукоположу его». Граждане пошли опять упрашивать Аммония. Когда святой муж стал отказываться, они хотели было вести его насильно. Но он поклялся отрезать и язык у себя, если станут принуждать его. После этого его отпустили и ушли.'
        cn: 阿摩尼乌斯，曾是伟大的潘波的门徒，与三位弟兄和两位姊妹一同，达到最高程度的爱神之心，在旷野中定居，并建造了两座特别的修道院：弟兄们一座男修道院，姊妹们一座女修道院，彼此相距甚远。与此同时，某个城市希望阿摩尼乌斯担任主教，因为这位伟人拥有非凡的学识。奉城中派遣的人来到蒙福的主教提摩太那里，请求他为他们祝圣阿摩尼乌斯为主教。「把他带到我这里来，」主教回答说，「我就会为你们祝圣他。」他们带着足够的人手，去追赶他。但阿摩尼乌斯逃跑了。他最终看到他们追上了他，便停下来，开始恳求他们。当那些人不听从时，他向他们起誓，他不会接受圣职，也不能离开旷野。当这也无效时，他便在众人面前拿起剪刀，完全剪掉了自己的左耳，直到耳根，说道：「现在你们必须确信，我不能接受你们强迫我接受的圣职，因为律法规定，凡耳朵被割掉的人，不得担任圣职。」此后，他们离开了他，走了，来到主教那里，将此事告诉了他。他对他们说：「这条律法让犹太人去遵守吧，但你们若带一个即便没有鼻子，但生活品格配得上的人来给我，我也会祝圣他。」市民们又去恳求阿摩尼乌斯。当这位圣洁的人开始拒绝时，他们本想强行带走他。但他发誓，如果他们继续强迫他，他就会割掉自己的舌头。此后，他们便放了他，离开了。
    - type: paragraph
      text:
        ru: 'Пищу Аммония с молодых лет до самой кончины составляли сырые овощи: он не ел ничего готовленного на огне, кроме хлеба. Знал он все книги Ветхого и Нового Завета наизусть и многократно перечитал писания знаменитых мужей – Оригена, Дидима, Пиерия и Стефана. Об этом свидетельствуют и великие отцы пустыни. Рассказывают и о его пророчествах. Назидательнее его никто другой не был для братий, живших в пустыне. Блаженный Евагрий, муж духоносный и строгий в суждении, так отзывался о нем: «Не видывал я человека бесстрастнее его». Во время отбытия Великого Аммония в Константинополь по нуждам пустынножителей сей блаженный (Евагрий) по убеждению святых епископов, пришедших из разных областей, и здешних пустынников восприял от купели Святого Крещения Руфина, тогдашнего преторианского префекта, который сам много раз просил его об этом. Крещение совершено было в присутствии сих епископов в той церкви, которую построил сам Руфин для положения в ней святых, на самых гробницах. Во всем послушный преподобному Аммонию, Руфин почтил Евагрия достойно его святой жизни. Аммоний спустя немного времени почил и положен в храме, называемом Руфиновым. Его гробница, говорят, исцеляет от простуды.'
        cn: 安摩尼从年轻时直到离世，食物都是生蔬菜；除了面包，他不吃任何经火烹制的东西。他熟知旧约和新约的所有书卷，并多次重读了著名教父——奥利振、迪迪默、皮埃里奥和斯特凡——的著作。这一点也得到伟大沙漠教父们的见证。人们也讲述他的预言。没有人比他更能造就住在沙漠中的弟兄们。蒙福者厄瓦格里，一位充满圣灵、判断严谨的人，这样评价他：「我从未见过比他更无情欲的人。」当伟大的安摩尼为沙漠隐修者的需求前往君士坦丁堡时，这位蒙福者（厄瓦格里）经由来自各地区的圣主教们和本地隐修者的劝说，为当时的禁卫军长官卢菲诺施洗；卢菲诺自己也多次为此请求厄瓦格里。施洗礼是在这些主教们的见证下，在卢菲诺自己建造的、用于安放圣徒遗骸、就在那些墓穴上的教堂里进行的。在所有事上都顺从可敬的安摩尼，卢菲诺以配得上厄瓦格里圣洁生活的方式尊敬他。不久之后，安摩尼离世了，并被安葬在被称为卢菲诺殿的教堂里。据说，他的墓穴能医治感冒。
  - type: heading2
    text:
      ru: О Вениамине
      cn: 关于韦尼亚明
    children:
    - type: paragraph
      text:
        ru: 'В той же горе Нитрийской был один чудный муж, по имени Вениамин. Его добродетельная жизнь продолжалась восемьдесят лет. За высокие подвиги в добродетели он удостоился дара исцелений, так что только возлагал на болящего руки или давал ему елея, им благословенного, и тот выздоравливал совершенно. И, несмотря на такой дар, за восемь месяцев до успения своего он сделался болен водянкою. Тело его так распухло, что по страданиям он был другим Иовом в наши времена. Епископ Диоскор, бывший тогда пресвитером горы Нитрийской, взявши нас, меня и блаженного Евагрия, сказал нам: «Подите посмотрите на нового Иова, который при такой болезни неисцельной сохраняет необыкновенное благодушие». Пришедши, мы взглянули на его тело – оно так опухло, что кистями обеих рук нельзя было охватить его мизинца. Не в силах будучи смотреть на такую страшную болезнь, мы отвратили от него глаза свои. Тогда блаженный Вениамин сказал нам: «Помолитесь, чада, чтобы не сделался болен мой внутренний человек. А от тела этого и когда был я здоров, не видел пользы, и, когда болен, не вижу вреда». В те восемь месяцев он постоянно сидел в стуле огромной широты, потому что лечь в постель не мог. И в таком неисцелимом недуге он еще врачевал других от различных болезней.'
        cn: 在同一座尼特里亚山，有一位名叫本雅明的奇妙男子。他那充满美德的生活持续了八十年。因着他在美德上的崇高苦修，他蒙受了医治的恩赐，以至于他只要把手按在病人身上，或者给他由他所祝圣的油，那人就完全痊愈了。然而，尽管有这样的恩赐，在他安息前八个月，他患上了水肿病。他的身体肿胀得如此厉害，以至于在受苦方面，他成了我们这个时代的另一个约伯。迪奥斯科鲁斯主教，他当时是尼特里亚山的长老，带着我们，就是我和蒙福的埃瓦格里乌斯，对我们说：「去看看这位新的约伯吧，他在如此不治之症中，仍保持着非凡的平静心。」我们去了，看了一眼他的身体——它肿胀得如此厉害，以至于用两只手都无法握住他的一根小指头。由于无法忍受看到如此可怕的病症，我们把视线从他身上移开了。这时，蒙福的本雅明对我们说：「孩子们，请你们祈祷，愿我内在的人（灵性生命）不要生病。至于这身体，当我健康的时候，我也没见过它有什么益处，当我生病的时候，我也不觉得它有什么害处。」在那八个月里，他一直坐在一个非常宽大的椅子上，因为他无法躺在床上。即使在这种不治之症中，他仍然医治着他人，使他们摆脱各种疾病。
    - type: paragraph
      text:
        ru: Я нарочно рассказал о болезни сего святого, чтобы нам не казалось странным, если видим, что и праведных мужей постигает иногда бедствие. Когда сей великий муж скончался, то вынули порог и косяки у дверей, чтобы можно было вынести тело из келии – так опухло тело блаженного и досточтимого отца Вениамина.
        cn: 我是特意讲述了这位圣徒的病况，以免我们觉得奇怪，如果看到义人有时也会遭遇灾祸。当这位伟人去世时，就拆掉了门槛和门框，以便能把他的身体从隐修室里抬出来——因为蒙福且可敬的韦尼亚明神父的身体就是那样肿胀。
  - type: heading2
    text:
      ru: Об Аполлонии
      cn: 关于阿波罗尼乌斯
    children:
    - type: paragraph
      text:
        ru: 'Некто именем Аполлоний, из купцов, отрекшись мира, поселился в горе Нитрийской. Так как по преклонности лет он уже не мог выучиться ни ремеслу, ни чтению, то в продолжение двадцатипятилетнего пребывания в горе подвизался таким образом: покупая в Александрии на свои деньги, приобретенные собственными трудами, всякие врачебные и келейные потребности, он снабжал ими всю братию во время болезни. Бывало, с раннего утра до девятого часа дня ходит около обителей и монастырей по всем кущам, отворяет двери и смотрит, не лежит ли кто. С собою он носил изюм, гранатовые яблоки, яйца, пшеничный хлеб – все, что бывает нужно больному. Такой полезный образ жизни вел раб Христов до глубокой старости. Перед смертию он передал все свои вещи другому, подобному себе, упросив его проходить это служение. Так как в горе той живет до пяти тысяч монахов, то подобный присмотр и нужен в такой пустыне.'
        cn: 有一位名叫阿波罗尼奥斯的人，原为商人，他弃绝世俗，住在尼特里亚山。因他年事已高，无法学习技艺或阅读，故在他于山中居住的二十五年间，他以如下方式修行：他用自己劳作所得的钱财，在亚历山大购买各种医药和修士个人生活所需物品，在弟兄们生病时，他便以此供给他们。他常从清晨一直到白天第九时（约下午三点），走遍所有的茅舍，探访隐修院和修道院，敲门察看，看是否有生病卧床的人。他随身携带着葡萄干、石榴、鸡蛋和麦饼——凡是病人所需要的一切。基督的这位仆人一直过着这样有益的生活，直到他年迈体衰。他在临终前，将自己所有的物品传给了另一位与他相似的人，请求他继续这侍奉。因为在那座山里居住着多达五千名修士，这样的照护在那样的旷野中是必需的。
  - type: heading2
    text:
      ru: О Паисии и Исаии
      cn: 论帕伊西奥斯和以赛亚
    children:
    - type: paragraph
      text:
        ru: 'Были два брата, по имени Паисий и Исаия. Отец у них был испанский купец. Разделив по смерти своего родителя оставшееся движимое имущество, которое заключалось в деньгах (пяти тысячах золотых монет), в одеждах и рабах, они стали рассуждать между собою и советоваться, какую избрать им жизнь. «Если станем продолжать торговлю, – говорили они, – которую вел отец наш, то и наши труды после нас останутся другим, не говоря уже об опасностях, которые можем встретить: нападут разбойники, поднимется на море буря. Пойдем лучше в монахи – тогда мы и от отцовского имения получим пользу, и душ своих не погубим». Намерение идти в монахи обоим понравилось, но в исполнении его они поступили неодинаково. Они разделили деньги и все прочее имущество – оба с тем намерением, чтобы угодить Богу, но различным образом жизни. Один все раздал на монастыри, церкви и темницы и, выучившись ремеслу для своего пропитания, посвятил себя подвижничеству и молитве, а другой, не истратив ничего на это, построил себе монастырь для небольшого числа братий, принимал странных, лечил больных, покоил престарелых, всякому бедному подавал милостыню, а по субботам и воскресеньям устроял три или четыре трапезы и угощал неимущих – вот на что иждивал он свое имущество!'
        cn: 曾有两兄弟，名叫帕伊西奥斯和伊萨亚。他们的父亲是一位西班牙商人。在他们的父母去世后，他们分得了遗留下来的动产，其中包括金钱（五千枚金币）、衣物和奴隶，随后他们开始彼此商议，思考应当选择怎样的生活。他们说：「如果我们继续我们父亲所经营的贸易，那么我们的一切劳苦在我们身后仍将归于他人；更不用说我们可能遭遇的危险：强盗会来袭击，海上会掀起风暴。不如我们去作修士吧——那样我们既能从父亲的产业中获益，又不会使自己的灵魂沉沦。」去作修士的意图两人都赞同，但在实施上，他们却采取了不同的做法。他们分了金钱和所有其余的财产——两人都怀着取悦上帝的意图，但生活方式却各不相同。其中一位将所有一切分发给了修道院、教堂和监狱，并学会了一门手艺以谋生，将自己奉献于苦修和祷告；而另一位则没有在这方面花费分毫，他为少数弟兄建造了一座修道院，接待陌生人，医治病人，安顿年迈者，施舍财物给每一个贫困之人，并且在周六和周日会安排三到四次筵席来款待穷人——他就是这样耗尽了自己的财产！
    - type: paragraph
      text:
        ru: Когда они оба скончались, братия, похваляя их житие, пришли в разногласие между собою, так как оба они были совершенны в добродетели. По мнению одних, выше была жизнь Паисия, который с самого начала отвергся всего, а по мнению других, – жизнь Исаии, который благотворил нуждающимся. Когда между братиями произошел спор о различии образа жизни сих блаженных, и особенно о том, кто больше достоин похвалы, они пошли к блаженному и святому Памво и, предложив ему на суд спор свой, просили сказать, чье житие совершеннее.
        cn: 当他们二人离世后，弟兄们称赞他们的生活方式，却彼此之间产生了分歧，因为他们二人在德行上都达到了完美。有些人认为派西阿的生活方式更高尚，他从一开始就弃绝了一切；而另一些人则认为以赛亚的生活方式更高尚，他施恩于有需要的人。当弟兄们之间就这两位蒙福者的生活方式之不同，特别是在谁更值得称赞的问题上发生争论时，他们就去见了蒙福的圣潘波，将他们的争论呈给他评判，请求他说出，谁的生活方式更为完美。
    - type: paragraph
      text:
        ru: 'Памво говорит им: «Пред Господом оба равно совершенны: тот, который принимал всякого и покоил, совершал дело Авраама, а другой, для благоугождения Богу, возлюбил непреклонную ревность пророка Илии». Тогда одни стали говорить ему: «Припадаем к стопам твоим, скажи нам, как можно им быть равным?». Одни выше ставили подвижника и говорили, что он, продав все и раздав нищим, исполнил заповедь евангельскую и непрестанно подвизался в молитвах: всякий день, час и ночь нес крест, последуя Спасителю. А другие, напротив, говорили в пользу другого: «Помилуй, он показал столько милосердой любви ко всем нуждающимся – ходил по улицам и по дорогам, чтобы искать бедных, собирал их и всем довольствовал; таким образом, врачуя больных и помогая им, он успокоил не одну свою душу, но и души многих других». Блаженный Памво отвечал: «Опять скажу вам: оба равны пред Господом и обе стороны должны согласиться со мною. Паисий без столь высокого подвижничества не заслужил бы того, чтобы сравнивать его с благим Спасителем нашим. Исаия, который успокаивал странников и служил бедным, тоже по возможности уподобился Господу, Который говорит:«…не приидох, да послужатМи,но послужити»(Мф. 20, 28). Исаия также служил, и хотя труды по видимому отягощали его, но вместе давали ему и успокоение. Подождите немного, чтобы мне получить откровение о них от Бога; придете после и узнаете».'
        cn: '帕姆沃对他们说：「在主面前，二者皆同等完全：那位接纳并安歇众人者，践行了亚伯拉罕的行径；而另一位，为要蒙神喜悦，则爱慕了先知以利亚那坚定不移的热忱。」


          于是有些人对他说：「我们俯伏在您的脚前，请告诉我们，他们怎能同等呢？」 有些人更看重苦修者，说他变卖了一切，分给穷人，从而遵行了福音的诫命，并不住地在祷告中修持：每日每时每夜背负十字架，跟随救主。而另一些人则为另一位辩护说：「您瞧，他向所有有需要的人展现了如此多的怜悯之爱——他走遍街巷和田间，寻找穷人，把他们聚集起来，满足他们的一切所需；如此，医治病人并帮助他们，他不仅安歇了自己的灵魂，也安歇了许多人的灵魂。」


          蒙福的帕姆沃回答说：「我再告诉你们：二者在主面前是同等的，双方都应该同意我的看法。帕伊西若没有如此崇高的苦修，他就不配将他与我们善良的救主相提并论。以赛亚，那位安歇了陌生人并服侍穷人者，也尽其所能地效法了主，主说：『……我来不是要受人的服侍，乃是要服侍人』（马太福音 20:28）。以赛亚也服侍了，尽管劳苦在表面上使他感到沉重，但同时却也带给他安歇。请稍候片刻，好让我从神那里获得关于他们的启示；之后你们再来，就会明白。」'
    - type: paragraph
      text:
        ru: По прошествии нескольких дней они опять пришли к великому отцу спросить о них. Блаженный сказал им в ответ, что видел их обоих стоящими вместе пред Богом в раю.
        cn: 几天过后，他们又来到伟大的教父面前，询问他们的事。真福者回答他们说，他看见他们俩一同站在上帝面前，在乐园里。
  - type: heading2
    text:
      ru: О Макарии, совершившем невольное убийство
      cn: 论马卡里，他犯了无意杀人
    children:
    - type: paragraph
      text:
        ru: 'Один юноша, по имени Макарий, лет восемнадцати от роду, пас скот близ озера, называемого Мариа, и, играя здесь со своими сверстниками, одного их них неумышленно убил. Не сказав никому ни слова, он ушел в пустыню и жил здесь три года в таком страхе к Богу и людям, что оставался все это время без всякого крова и как бы не чувствовал этого, – а земля та сухая, как всем известно, кто там бывал по какому-либо случаю или жил. Наконец Макарий построил себе келию и, живши в ней еще двадцать пять лет, удостоился такой благодати, что находил услаждение в уединении и побеждал демонов. Долго с ним живя, я спросил у него, как он думает о грехе совершенного им убийства. Он сказал: «Неумышленное убийство послужило для меня поводом к обращению на путь спасения. Так иногда и случайные обстоятельства ведут к добродетели, когда не хотят приступить к добру по свободному расположению: одни из добродетелей зависят от свободного избрания, а другие – от обстоятельств».'
        cn: 一个名叫马卡里的年轻人，年约十八岁，在名叫马里亚湖附近牧放牲畜，在那里与他的同龄人玩耍时，无意中杀死了其中一人。他没有对任何人说一句话，就去了旷野，在那里生活了三年，他对上帝和世人怀着如此的敬畏，以至于他在此期间一直没有遮蔽之处，仿佛没有感觉到——而那片土地是干旱的，凡曾因故到过那里或居住过的人都深知这一点。马卡里最终为自己建造了一间隐修室，在其中又生活了二十五年，蒙受了如此的恩典，以至于他在独居中寻得愉悦并战胜了魔鬼。我与他一起生活了许久，我问他，他如何看待他所犯下谋杀罪的罪愆。他说：「那次无意的杀戮，对我而言，是转向救赎之路的契机。如此一来，有时偶然的境遇也能导向德行，当人们不愿凭着自由的意愿去行善时：有些德行取决于自由的选择，而另一些则取决于境遇。」
  - type: heading2
    text:
      ru: О Нафанаиле
      cn: 论拿但业
    children:
    - type: paragraph
      text:
        ru: 'Между древними святыми был один доблестный подвижник Христов, по имени Нафанаил. Я не застал его в живых: он почил за пятнадцать лет до прихода моего в гору. Но, встретившись с современниками и сподвижниками сего святого, я охотно расспрашивал их о подвигах сего мужа. Они указали мне и келию его, в которой никто уже не живет по причине близости к населенной стороне. Блаженный тогда еще построил ее, когда отшельники здесь были редки. Вот что рассказывали мне о его подвижничестве.'
        cn: 在古代圣徒中，有一位英勇的基督苦修者，名叫拿但业。我未曾亲见他；在我来到这山上十五年前，他已经安息了。然而，当我遇到这位圣徒的同代人及其同修时，我热切地向他们打听关于这位圣者的苦修事迹。他们也指给我看他的小室，里面已经没有人居住了，因为它靠近有人居住的地方。当时这里的隐士还很稀少，那位蒙福者就在那时建造了它。以下就是他们告诉我的关于他的苦修生活。
    - type: paragraph
      text:
        ru: 'Он положил себе постоянно пребывать в келии и никогда не отступал от этого правила. Диавол, который всех обольщает и соблазняет, обольстил вначале и его – навел на него тоску и заставил выйти из келии. Святому показалось скучно в прежней келии, он оставил ее и построил себе другую, ближе к селению. Когда окончил ее и прожил в ней три или четыре месяца, является ночью диавол в виде палача с ременным бичом, во вретище и делает шум бичом. Блаженный Нафанаил, разгневавшись на него, сказал ему: «Кто ты и как осмеливаешься делать это в моем пристанище?». Диавол отвечал: «Я тот, который заставил тебя выйти из прежней келии; теперь я пришел выгнать тебя и из этой». Блаженный Нафанаил, узнав, что был прельщен, тотчас возвратился под прежний кров и в продолжение тридцати семи лет ни разу не выходил за порог, противясь диаволу, который столько ему делал, чтобы заставить его выйти из келии, что невозможно и рассказать о том. Между прочим, ненавистник добра употребил и следующую хитрость, чтобы заставить подвижника отступить от принятого правила.'
        cn: 他立志常住在隐修室里，从未违背过这个规矩。魔鬼，就是那迷惑和引诱众人的，起初也迷惑了他——使他心生愁苦，并迫使他离开了隐修室。圣者觉得原先的隐修室很沉闷，便放弃了那间，给自己另建了一间，离村庄更近。当他建好这间，并在其中住了三四个月之后，夜里魔鬼便现身，像一个身穿麻衣、手持皮鞭的刽子手，用鞭子制造出声响。蒙福的纳撒尼尔（Nathanael）对他发怒，对他说：「你是谁？怎敢在我的居所做出这种事？」魔鬼回答说：「我就是那个迫使你离开原先隐修室的；现在我来把你从这间也赶出去。」蒙福的纳撒尼尔，得知自己受了诱惑，便立刻回到了原先的居所，并且在三十七年间从未踏出过门槛一步，对抗着魔鬼。魔鬼为迫使他离开隐修室，对他施加了无数手段，其程度简直无法言喻。此外，那仇恨美善者还使用了以下诡计，企图迫使这位苦行者违背他所立下的规矩。
    - type: paragraph
      text:
        ru: 'Семь святых епископов посетили однажды святого Нафанаила, и он едва не нарушил своего обета. Когда епископы после посещения помолились и по молитве вышли, подвижник не проводил их ни шагу, чтобы не уступить ненавистнику добра. Тогда диаконы епископов сказали святому: «Ты, авва, гордо поступаешь, что не проводишь епископов». Он сказал им: «Я уважаю владык моих – епископов – и почитаю весь клир; я грешник, отребие всех людей. Но, по своему обету, я умер для всего этого и для всей жизни. У меня есть сокровенная цель, почему я и не проводил епископов; ее знает Господь, ведающий тайны сердца моего».'
        cn: 七位圣主教有一次拜访了圣纳撒尼尔，他差点就违背了自己的誓言。当主教们拜访后祷告了，祷告后离开了，那位苦修者一步也没有送他们，以免向那憎恨良善者屈服。于是主教们的执事们对圣者说：「阿爸，你行事傲慢，竟不送主教们。」他对他们说：「我尊敬我的主们——主教们——我敬重所有的教士；我是个罪人，众人中的渣滓。但是，按照我的誓言，我已为这一切和所有生命而死了。我有一个隐藏的目的，我为何不送主教们；主知道它，祂洞察我心的隐秘。」
    - type: paragraph
      text:
        ru: 'Диавол, таким образом не достигнув своей цели, принял снова другой вид. За девять месяцев до кончины подвижника он является в образе десятилетнего отрока и будто погоняет осла, который везет корзину с хлебами. В глубокий вечер близ келии подвижника осел упал, и отрок закричал: «Авва Нафанаил, помилуй меня и подай мне руку!». Авва, услышав голос отрока, отворил дверь и, стоя внутри келии, сказал: «Кто ты и чего хочешь от меня?». Диавол отвечал: «Я прислужник такого-то монаха и везу хлебы; у известного тебе такого-то брата вечеря любви, и завтра, в наутрие субботы, нужны будут просфоры. Молю тебя, не оставь меня, чтобы не съели меня гиены». (В тех местах водится много гиен.)'
        cn: 魔鬼这样一来没有达到他的目的，又变成了另一种模样。在这位苦行僧去世前九个月，他显现为一个十岁男孩的形象，仿佛在赶着一头载着一篮面包的驴。深夜时分，在那位苦行僧的隐修小室附近，驴子摔倒了，那个男孩喊道：「阿爸拿但业，可怜我，拉我一把！」阿爸听到男孩的声音，打开了门，并且，站在隐修小室里面说道：「你是谁，想从我这里得到什么？」魔鬼回答说：「我是某位修士的仆役，并且运送面包；在你认识的某位修士那里有爱筵，并且明天，也就是安息日的早晨，需要圣饼。我求你，不要丢下我，以免我被鬣狗吃掉。」（在那些地方有许多鬣狗。）
    - type: paragraph
      text:
        ru: 'Блаженный Нафанаил стал в нерешимости; чувство сострадания сильно возбудилось в нем, сердце его возмутилось, и, рассуждая, как поступить ему, он говорил себе: «Я должен или преступить заповедь (о вспоможении ближним), или отступить от своего правила (не выходить из келии)». Наконец, размыслив с благоговением, он сказал сам себе: «Лучше мне не нарушать моего правила, которое я исполняю столько лет, чтобы посрамить и победить диавола». Потом, помолившись Господу, подвижник сказал говорившему отроку: «Послушай, отрок или кто бы ты ни был, я верую и служу Тому, Кто владычествует над всяким дыханием. Если ты действительно имеешь нужду в помощи, то мой Бог тебе пошлет ее и ни гиены, ни другое что не повредит тебе, а если ты – искушение, то и это откроет мне мой Бог из того, что будет с тобою». И, затворив дверь, подвижник отошел в глубину келии. А диавол, посрамленный и сим поражением своим, обратился в вихрь и исчез с шумом, подобным тому, какой производят дикие ослы, когда бегут. Такова победа блаженного Нафанаила, таковы и подвижнические добродетели и неодолимая брань его с противником, таковы его житие и конец его славной жизни.'
        cn: '圣纳撒尼尔陷入犹豫不决；他心中油然而生强烈的怜悯之情，心绪骚动不安。他权衡着如何行事，便自言自语道：「我必须要么违背诫命（即帮助近人），要么违背我自己的规矩（不出离修道室）。」最终，他怀着敬畏之心深思熟虑之后，自言自语道：「我最好不要违反我已遵守多年的规矩，以此羞辱并战胜魔鬼。」


          之后，苦修者向主祷告，然后对那说话的孩童说：「听着，孩童啊，无论你是谁，我信奉并侍奉那位掌管一切有气息的受造物。如果你确实需要帮助，那么我的上帝会赐予你帮助，豺狼或其他任何东西都不能伤害你；如果你是个试探，那么我的上帝也会从你身上所发生的事中向我启示这一点。」说完，他关上门，苦修者便退入修道室深处。


          而魔鬼，因这次失败而蒙羞，便化作一股旋风，伴随着喧嚣声消失了，就像野驴奔跑时发出的声音。这就是圣纳撒尼尔的胜利，这就是他的苦修美德，以及他与仇敌那不可战胜的争战，这就是他的生平，以及他荣耀一生的结局。'
  - type: heading2
    text:
      ru: О Макарии Египетском
      cn: 关于埃及的马卡里
    children:
    - type: paragraph
      text:
        ru: Опасаюсь повествовать и писать о тех многих великих и для неверующего почти невероятных подвигах, которыми наполнена добродетельная жизнь святых и бессмертных отцов –Макария ЕгипетскогоиМакария Александрийского, мужей доблестных и подвижников непобедимых. Опасаюсь, чтобы не почли меня лжецом, а изречение Духа Святаго ясно показывает, что Господь погубит всех,«говорящих ложь»(Пс. 5, 7).
        cn: 我不敢叙述和撰写关于那些众多伟大、且对不信者而言几乎不可思议的苦修功绩，它们充满着圣洁不朽的教父们——埃及的马卡里和亚历山大的马卡里——的圣善生活，他们是英勇的男子和不败的苦修者。我担心他们会认为我是说谎者，而圣灵的话语清楚地表明，主将毁灭所有「说谎言的人」（诗篇 5:7）。
    - type: paragraph
      text:
        ru: Но я, по благодати Господней, не лгу, и ты, вернейший Лавс, не сомневайся в подвигах святых отцов – напротив, прославляй сих достославных и истинно блаженных мужей, которые и имена получили соответствующие святым трудам их в подвижничестве.
        cn: 但我靠着主的恩典不撒谎，你这最忠信的拉乌斯，不要怀疑圣教父们的苦修功绩——反而要颂扬这些可称颂的、真正蒙福的男子，他们甚至名字也配得上他们在苦修中的圣洁劳苦。
    - type: paragraph
      text:
        ru: Первый подвижник Христов, по имени Макарий, был родом египтянин, а второй по времени, но первый по доблестям монашеским, называвшийся Макарием, был александрийский гражданин и продавал закуски.
        cn: 基督的第一位苦修者，名叫马卡里奥斯，原籍是埃及人；而第二位（按时间顺序），但在修道功德上却是第一位的那位名叫马卡里奥斯的，则是一位亚历山大城的公民，并且售卖小吃。
    - type: paragraph
      text:
        ru: 'Прежде расскажу о добродетелях Макария Египетского, который жил девяносто лет и из них шестьдесят провел в пустыне. Пришедши в нее тридцати лет от роду, он, хотя по возрасту был моложе других, в продолжение десяти лет так мужественно переносил труды подвижнические, что удостоился особенного отличия: его называли отроком-старцем, потому что он свыше возраста преуспевал в добродетелях. Сорока лет от роду он получил власть над духами, дар целить болезни и дух пророчества, удостоился также и досточтимого священства. Во внутренней пустыне, называемой Скитом, жили с ним два ученика: один из них был у него слугою и всегда находился при нем для приходивших врачеваться, а другой жил в отдельной келии.'
        cn: 首先，我将讲述埃及的马卡里的美德，他活了九十年，其中六十年是在旷野度过的。他三十岁来到旷野，尽管他年龄比其他人小，却在这十年里如此英勇地承受苦修的劳苦，以至于他获得了特殊的荣誉：人们称他为「童叟」，因为他在美德上的成就超越了他的年龄。四十岁时，他获得了驾驭灵的权柄、医治疾病的恩赐和预言的灵，也被授予了可敬的司祭职分。在被称为斯基特的内陆旷野里，有两个门徒与他同住：其中一个作他的侍从，并且为了那些前来求医治的人，他总是待在他身边；而另一个则住在单独的隐修室里。
    - type: paragraph
      text:
        ru: 'По истечении долгого времени, прозрев в будущее своим проницательным оком, святой говорит служившему при нем ученику именем Иоанн, впоследствии бывшему пресвитером на месте святого Макария (ибо Великий Макарий был удостоен пресвитерства): «Послушай меня, брат Иоанн, и прими благодушно мое увещание: оно будет полезно тебе. Ты – в искушении, тебя искушает дух сребролюбия. Это открыто мне. Я знаю также, что если ты благодушно примешь мое вразумление, то будешь совершен в деле Божием на месте сем и прославишься и зло не приближится к келии твоей; если же не послушаешь меня, с тобою будет то же, что с Гиезием (4Цар. 5:20–27), недугом которого заражен ты». Случилось, что Иоанн, по успении бессмертного Макария, преслушал слова его, а послушал того, кто сребролюбием довел до удавления Иуду. Когда прошло еще пятнадцать или двадцать лет, Иоанн, удерживавший у себя достояние бедных, был поражен такою проказою, что на теле его не было здорового места, на котором бы можно было положить палец. Вот пророчество святого Макария!'
        cn: '在漫长的时间过去后，圣者以其敏锐的洞察力预见了未来，对在他身边服侍的门徒，名叫约翰的说——这约翰后来在圣马卡里乌斯的所在地担任了司祭（因为大马卡里乌斯曾被授任司祭职）——说：「听我说，弟兄约翰，并欣然接受我的劝诫：这对你将有益处。你正处于试探中，贪财之灵正在引诱你。这已向我显明。我也知道，如果你欣然接受我的训诫，那么你在此地将能成全上帝的圣工，并得着荣耀，且邪恶不会临近你的修道室；但如果你不听我的话，那么你将遭遇与基哈西（列王纪下 5:20-27）一样的事，你已感染了他的疾患。」


          结果，在不朽的马卡里乌斯安息后，约翰违背了他的话，却听从了那个以贪财引诱犹大以致他自缢的人。又过了十五到二十年，约翰，因私自占有穷人的财产，感染了一种大麻风病，他的身体上没有一处健康的地方可以容纳一指。这就是圣马卡里乌斯的预言！'
    - type: paragraph
      text:
        ru: Излишне будет и говорить о том, какие блаженный употреблял пищу и питие. Тогда не только между тамошними монахами, но и между беспечнейшими из живущих по другим местам нельзя было найти предававшихся пресыщению; причина этого, с одной стороны, недостаток в необходимом, с другой – ревность по Боге живших там, из коих каждый старался превзойти другого различными подвигами.
        cn: 无需赘言这位蒙福者所食所饮。那时，不仅在那里的修士中，甚至在其他地方最不注重节制的人中间，也找不到沉溺于贪食的人；其原因，一方面是必需品的匮乏，另一方面是居住在那里的人对上帝的炽热渴慕，他们每个人都努力以各种苦修功课超越他人。
    - type: paragraph
      text:
        ru: Расскажу и о других подвигах сего небесного мужа Макария. Говорят об этом святом, что он непрестанно приходил в восторг и гораздо больше времени проводил в беседе с Богом, нежели в земных занятиях. Рассказывают также и о различных чудесах его.
        cn: 我将讲述这位天人马卡里的其他苦修功德。人们谈及这位圣人说，他不住地进入狂喜，并且与上帝晤谈的时间远远多于他从事属世事务的时间。人们也讲述了他的各种奇迹。
    - type: paragraph
      text:
        ru: 'Один распутный египтянин предался любви к благородной женщине, которая была замужем. Не успев обольстить ее, потому что она была верна своему мужу, за которого вышла девою, бесстыдный прибег к чародею и говорил ему: «Или заставь ее любить меня, или сделай своим искусством то, чтобы муж бросил ее». Чародей, получив от него хорошую плату, употребил свои чары и заклинания. Но, не могши возбудить любви в ее сердце, он сделал, что всем, кто только смотрел на нее, она казалась лошадью. Муж ее, пришедши домой, увидел жену свою в образе лошади. Позвав пресвитеров селения, он ввел их в свой дом и показал им ее, но и они не поняли постигшего ее несчастия. Наконец, к прославлению Бога и к явлению добродетели святого Макария, пришло на мысль мужу отвести ее в пустыню к преподобному.'
        cn: 一个放荡的埃及人迷恋上了一位已经嫁为人妇的出身高贵的妇人。他未能引诱她，因为她以贞洁之身嫁给了丈夫并忠于他，这无耻之人便求助于一个巫师，并对他说：「要么让她爱上我，要么用你的法术让她丈夫抛弃她。」巫师从他那里得到丰厚报酬后，便施展了他的魔法和咒语。但他未能唤起她心中的爱意，他就让所有看到她的人都觉得她变成了一匹马。她的丈夫回到家，看见他的妻子竟然是一匹马的模样。他召集了村里的长老们，领他们进了自己的家，并让他们看她，但他们也未能明白她所遭遇的不幸。最终，为了荣耀上帝并彰显圣者马卡里奥斯的德行，丈夫心中萌生了一个念头：把她带到旷野，去见那位可敬者。
    - type: paragraph
      text:
        ru: 'Когда они пришли, братия стояли у келии святого Макария и, не допуская мужа этой женщины, говорили ему: «Зачем ты привел сюда эту лошадь?». Муж отвечал им: «Чтобы помогли ей молитвы праведного». Они сказали ему: «Что с ней случилось худого?». Он отвечал: «Эта лошадь, которую вы видите, была несчастная жена моя, и я не знаю, как она обратилась в лошадь. Ныне вот уже три дня, как она ничего не ела». Братия, услышав сие, сказали об этом рабу Христову Макарию, который молился уже об этой женщине в своей келии, ибо, когда они еще шли к нему, ему было уже откровение от Бога. Он молился, чтобы ему открыта была причина случившегося, и во время молитвы узнал он все, как что было. Когда же братия объявили святому Макарию, что кто-то привел сюда лошадь, он сказал им: «Вы смотрите не своими глазами: это женщина, какою и создана, она не превратилась  (в лошадь), а только глазам обольщенных кажется такою»[7]. Когда привели к нему ее, он благословил воду и, облив женщину с головы, помолился над ее головою и тотчас сделал, что все смотревшие на нее увидели в ней женщину. Приказав принести ей пищу, он дал ей есть и, таким образом исцелив ее, отпустил с мужем; и они благодарили Бога. А человек Христов дал ей следующее наставление: «Никогда не оставляй посещать церковь, никогда не уклоняйся от приобщения Христовых Таин; несчастие случилось с тобою оттого, что ты уже пять недель не приступала к пречистым Таинам Спасителя нашего».'
        cn: '当他们来到时，修士们站在圣马卡里乌斯的隐修室外，不让这女人的丈夫靠近，对他说：「你为何把这匹马带到这里？」丈夫回答他们说：「是为了让义人的祷告帮助她。」他们对他说：「她出了什么事？」他回答：「你们看到的这匹马是我那不幸的妻子，我不知道她是如何变成马的。如今她已经三天没有吃东西了。」


          修士们听到这些话后，便把这事告诉了基督的仆人马卡里乌斯，他当时已在他的隐修室里为这女人祷告，因为当他们还在路上走向他的时候，他就已经从上帝那里得到了启示。他祷告，祈求能向他显明所发生之事的原因，并在祷告中知晓了一切的经过。当修士们向圣马卡里乌斯宣布有人带了一匹马到这里时，他对他们说：「你们不是用自己的眼睛在看：这是个女人，她被造之时就是女人，她并没有变成（马），而只是在被迷惑之人的眼中才显得如此。」[7]


          当他们把她带到他面前时，他祝圣了水，从头浇到女人身上，并在她头上祷告，随即让所有看到她的人都认出她是个女人。他吩咐给她拿食物，他给她吃，如此医治了她，然后让她和丈夫一同离去；他们向上帝献上感谢。基督的仆人给了她以下训诲：「你绝不可停止去教堂，绝不可远离领受基督的圣事；这不幸之所以临到你，是因为你已经五个星期没有领受我们救主的纯洁圣事了。」'
    - type: paragraph
      text:
        ru: Вот другое деяние великого его подвижничества. Долгое время жизни своей он делал подземный проход, простиравшийся от его келии на полстадии[8], и на конце сего прохода устроил большую пещеру. Когда очень многие беспокоили его, он тайно уходил из своей келии в пещеру, и уже никто не находил его. Один из ревностных учеников Макария рассказывал нам, что святой, пока шел подземным ходом до пещеры, совершал двадцать четыре молитвы и столько же на возвратном пути.
        cn: 这是他伟大苦修的另一个行迹。他一生中的很长一段时间，开凿了一条从他的隐修室延伸了半斯塔迪[8]的地下通道，并在通道的尽头建造了一个大洞穴。当许多人打扰他时，他就秘密地从他的隐修室前往洞穴，这样就再没有人能找到他了。马卡里奥斯的一位热心的门徒告诉我们，这位圣徒在穿过地下通道前往洞穴时，会做二十四次祷告，而在返回的路上也会做同样多的祷告。
    - type: paragraph
      text:
        ru: О нем прошел слух, что он воскресил даже мертвого для убеждения одного еретика, отвергавшего воскресение тел[9](об этом чуде подробно рассказывает Руфин). Этот слух был очень силен в пустыне.
        cn: 关于他传出了一个流言，说他甚至复活了一个死人，为的是说服一个否认身体复活的异端[9]（关于这个神迹，鲁芬有详细记载）。这个流言在旷野中非常盛行。
    - type: paragraph
      text:
        ru: 'Однажды к сему святому мужу был приведен бесноватый юноша. Привела его мать, которая горько рыдала о нем. Его с двух сторон держали двое других юношей. Демон (обитавший в нем) имел такую силу, что, съевши три меры хлеба и выпивши киликийское ведро воды, то и другое извергал и обращал в пар. Съеденное и выпитое им было истребляемо как огнем. (Действительно, есть особый разряд демонов, называемый огненным. Между демонами, как и между людьми, есть различия, зависящие, впрочем, от разности не в существе, а в воле.) Упомянутый юноша, когда не получал достаточного количества пищи от матери, часто ел свое извержение и пил свою мочу. Как мать с плачем и стенаниями о чрезвычайном несчастии своего сына долго просила и молила святого помочь ему, то непобедимый подвижник Христов Макарий, взяв к себе юношу, усердно помолился о нем Богу, и чрез день или два демон перестал мучить его. Тогда святой Макарий сказал матери юноши: «Сколько хочешь, чтобы ел сын твой?». Она отвечала: «Молю тебя, вели ему есть по десяти фунтов[10]хлеба». Святой, сильно упрекнув ее за то, что она назначила много, сказал: «Что ты это сказала, женщина!». Помолившись о юноше семь дней с постом и изгнавши из него лютого демона многоядения, святой определил ему меру пищи до трех фунтов хлеба, которые он должен был употреблять, делая свое дело. Таким образом, разрушитель всякого демонского действия – подвижник Христов Макарий, по благодати Божией и богоугодному своему житию исцелив юношу, отдал его матери.'
        cn: '有一次，一个被附身的少年被带到这位圣洁的男子面前。是他的母亲带来的，她为他痛苦地哭泣。另有两名少年从两侧扶着他。附在他体内的那个魔鬼有如此大的力量，以至于他在吃下三份面包和喝下一基利家桶水之后，又将所食所饮尽数呕吐出来，并化作蒸汽消散。他所吃所喝的，都被如同火焰一般吞噬殆尽。（确实，有一种特殊类别的魔鬼，被称为火性魔鬼。魔鬼之间，如同人类之间，存在差异，然而这种差异并非源于本质的不同，而是源于意志的相异。）这位少年，当他从母亲那里得不到足够食物时，常常吃自己的呕吐物，喝自己的尿液。


          母亲为儿子的极端不幸而哭泣哀号，恳切而持久地祈求圣徒帮助他；于是，基督那不可战胜的苦修者马卡里，将少年带到自己身边，为他恳切地向上帝祷告。一两天之后，魔鬼便停止了折磨他。于是，圣马卡里对少年的母亲说：「你希望你的儿子吃多少？」她回答说：「我恳求你，吩咐他吃十磅[10]面包。」圣徒严厉地责备了她，因为她指定了如此大的分量，他说：「女人，你这话是什么意思！」圣徒为少年禁食祷告了七天，驱逐了他体内那凶猛的饕餮魔鬼，并规定他每天的食量为三磅面包，他应在劳作时进食。如此，那摧毁一切魔鬼行径的基督苦修者马卡里，藉着上帝的恩典和他那蒙上帝悦纳的圣洁生活，治愈了这名少年，并将他交还给他的母亲。'
    - type: paragraph
      text:
        ru: Такие-то славные чудеса совершил Бог чрез верного угодника Своего Макария, которого бессмертная душа пребывает теперь с Ангелами. Я не видел сего святого, ибо за год до моего прихода в пустыню почил этот победитель безумных страстей.
        cn: 神借着祂忠信的仆人马卡里乌斯行了如此荣耀的奇迹，他的不朽灵魂如今与众天使同在。我没有见过这位圣徒，因为在我来到旷野前一年，这位战胜了狂妄情欲的得胜者便安息了。
  - type: heading2
    text:
      ru: О Макарии Александрийском
      cn: 论亚历山大的马卡里奥斯
    children:
    - type: paragraph
      text:
        ru: Сподвижник сего Макария Египетского в делах веры, носивший то же достоуважаемое имя, Макарий Александрийский был пресвитером в так называемых Келлиях, когда я пришел к нему. Прожив в сих Келлиях девять лет и из них три года вместе с блаженным Макарием хранив безмолвие, я частию сам видел дела и знамения доблестного жития его, частию узнал от тех, которые жили с ним вместе, а частию слышал еще от многих других.
        cn: 亚历山大的马卡里乌斯，这位在信仰的道路上与埃及的马卡里乌斯并肩的同伴，拥有着同样尊贵的名字。我来到他那里时，他正在所谓的凯利亚隐修地担任长老。我在这些凯利亚隐修地居住了九年，其中有三年是与蒙福的马卡里乌斯一同持守静默，我部分是亲眼看到了他那英勇生活中的事迹和征象，部分是从那些与他一同生活的人那里了解到的，还有部分是从许多其他人那里听说的。
    - type: paragraph
      text:
        ru: 'Однажды святой Макарий, увидев у Великого отца Антония отборные финиковые ветви (он сам плел из них корзины), попросил у него одну связку этих ветвей. Антоний отвечал ему: «Писано:«Не пожелай… елика суть ближнего твоего»(Исх. 20, 17)» – и, едва выговорил это, как вдруг все ветви засохли как бы от огня. Увидев сие, Антоний сказал Макарию: «Вот на тебе почил Дух, и ты впоследствии будешь наследником моих добродетелей».'
        cn: 有一次，圣马卡里乌斯看见伟大的教父安东尼那里有精选的棕榈枝（他自己用它们编织篮子），便向他要了一捆这样的枝条。安东尼回答他：「经上记着说：『不可贪恋……凡你邻舍所有的』(出埃及记 20:17)」——他刚说完这话，忽然所有的枝条都枯萎了，仿佛被火烧过一般。安东尼看见这事，便对马卡里乌斯说：「看哪，圣灵已降在你身上，你将来必继承我的美德。」
    - type: paragraph
      text:
        ru: 'Там же, опять в пустыне, диавол, встретив Макария, весьма утомленного, говорит ему: «Вот ты получил благодать Антония – что не пользуешься своим преимуществом и не просишь у Бога пищи и силы для путешествия?». Макарий отвечал ему: ««Крепость моя и пение мое Господь»(Пс. 117, 14), а ты не искусишь раба Божия». И вот диавол представляет ему призрак: верблюд блуждает по пустыне со вьюком, в котором были всякие съестные припасы. Увидев Макария, верблюд остановился пред ним. Святой, подумав, что это призрак (как и действительно было), стал молиться – и верблюд тотчас пожран был землею.'
        cn: 在那里，又在旷野里，魔鬼遇见了非常疲惫的马卡里，对他说：「看哪，你已领受了安东尼的恩典——为何不利用你的优势，不向神祈求食物和旅途的力量呢？」马卡里回答他说：「「上主是我的力量，是我的诗歌」(诗篇 117:14)，你绝不能试探神的仆人。」于是魔鬼向他显现了一个幻象：一头骆驼在旷野里游荡，背上驮着一个包裹，里面装着各种食物。骆驼看见马卡里后，便停在他面前。这位圣徒心想这必是幻象（事实也确实如此），便开始祷告——于是骆驼立刻被大地吞噬了。
    - type: paragraph
      text:
        ru: 'Этот же Макарий сошелся однажды с Великим Макарием Египетским, и как нужно было им переправиться чрез Нил, то случилось им взойти на большой плот, на который также взошли какие-то трибуны[11]с великою пышностию: у них была колесница вся обита медью, кони в вызолоченных уздах; с ними было несколько воинов-телохранителей и отроков, украшенных ожерельями и золотыми поясами. Когда сии трибуны увидели в углу монахов, одетых в ветхие рубища, стали восхвалять их убожество и один из них сказал им: «Блаженны вы, что презрели мир!». Городской[12]Макарий отвечал им: «Так! Мы презрели мир, а вас мир презирает. Знай, что ты сказал это не сам по себе, но пророчески: действительно мы оба называемся Макариями – блаженными». Пораженный сими словами, трибун по возвращении домой скинул мирские одежды и, посвятив себя монашеству, совершил много дел милосердия.'
        cn: 这个马卡里乌斯有一次遇见了伟大的埃及马卡里乌斯。当他们需要渡过尼罗河时，碰巧他们登上了（或「上」）一个大木筏，几个排场盛大的护民官[11]也上了这个木筏：他们有一辆通体包铜的战车，骏马套着镀金的缰绳；随行还有几名卫兵和几名佩戴项链与黄金腰带的侍从。当这些护民官看到角落里穿着破旧粗布衣的修士时，开始称赞他们的贫乏，其中一人对他们说：「你们有福了，因为你们轻视了世界！」城市修士[12]马卡里乌斯回答他们：「是的！我们轻视了世界，而世界却轻视你们。须知，你说的这话并非出于你自己，而是出于预言：确实，我们俩都名叫马卡里乌斯——意为蒙福者。」这位护民官被这些话语触动，回家后脱去了世俗的衣服，并献身于修道生活，做了许多慈善之事。
    - type: paragraph
      text:
        ru: Когда-то прислали Макарию кисть свежего винограда – а тогда ему очень хотелось есть. Чтобы показать свое воздержание, он отослал эту кисть одному брату, которому также хотелось винограда. С великою радостию получив виноград, брат сей, в намерении скрыть свое воздержание, послал его к другому брату, как будто ему самому не хотелось этой снеди. Но и этот брат, получив виноград, поступил с ним так же, хотя ему и самому очень хотелось съесть его. Таким образом виноград перебывал у многих братий, и ни один не хотел есть его. Наконец, последний брат, получив его, отослал опять к Макарию как дорогой подарок. Макарий, узнавши виноград и разведав, как все было, удивился и благодарил Бога за такое воздержание братий, да и сам не захотел есть его. Таково было подвижничество Великого Макария, которому и я вместе со многими другими поучался у него!
        cn: 有一次，马卡里被送来一串新鲜的葡萄——那时他正饥饿难耐。为了显示自己的节制，他将这串葡萄送给了一个同样想吃葡萄的修士。这位修士非常喜乐地收到葡萄后，为了隐藏自己的节制，便把它送给了另一位修士，仿佛他自己对这食物毫无食欲。但这位修士收到葡萄后，也同样处理了它，尽管他自己也极其想吃。就这样，这串葡萄辗转于许多修士手中，却没有一个人想吃它。最后，最后一位修士收到后，又把它作为一份珍贵的礼物送回马卡里那里。马卡里认出这串葡萄，并了解了事情的始末后，便惊奇不已，并感谢上帝赐予修士们如此的节制，他自己也就不想吃它了。这便是伟大的马卡里的苦修精神，我与其他许多人一样，也从他那里受到了教导！
    - type: paragraph
      text:
        ru: 'Ежели когда он слышал, что кто-нибудь совершил особенный подвиг, то и сам непременно то же делал с жаром. Так, услышав от кого-то, что тавеннские иноки во всю Четыредесятницу употребляют пищу невареную, святой положил семь лет не вкушать ничего приготовленного на огне, а питаться одними сырыми овощами или, когда случится, мочеными бобами. Другого ничего не вкушал он в эти семь лет. Исполнив сей обет, он, однако же, оставил такой образ жизни. Узнав, что один инок вкушал по одной литре (12 унций) хлеба, сей совершеннейший монах решился подражать и ему: переломав все свои сухари и опустив их в кувшин, он положил правилом съедать не больше того, сколько достает рука. Велико было и это изнурение тела. Весело рассказывал он нам об этом вот что: «Захвачу, бывало, побольше кусков, а узкое горло не дает мне вынуть их – мой кувшин совсем не давал мне есть». Целых три года подвизался он в таком воздержании: вкушая хлеба унции по четыре или по пяти и выпивая соответственное тому количество воды, а масла во весь год употреблял в пищу только шестую часть конги[13].'
        cn: 每当他听说有人完成了特别的苦修，他自己也必然热切地照做。例如，他从某人那里听说塔文尼斯的修士们在整个大斋期都食用未经烹煮的食物，这位圣人便立誓七年内不吃任何用火烹制的东西，而只吃生蔬菜，或者偶然吃些泡过的豆子。在这七年里，他不再吃别的任何东西。完成了这个誓言后，他却放弃了这种生活方式。得知一位修士每天吃一里特尔（十二盎司）面包后，这位最完美的修士也决定效仿他：他把自己的所有干面包掰碎，放入一个陶罐中，并立下规矩，一次只吃手能从罐中取出那么多。这也是一项巨大的身体苦修。他曾高兴地向我们讲述了这件事：「我以前常常会抓取很多块，但是狭窄的瓶颈不让我把它们取出来——我的陶罐根本不让我吃东西。」他在这样的禁食中苦修了整整三年：每天吃四到五盎司的面包，并喝相应数量的水，而一年中他只食用六分之一孔吉[13]的油。
    - type: paragraph
      text:
        ru: 'Вот еще подвиг сего ратоборца. Замыслил этот адамант преодолеть сон. И вот что он рассказал: «Целых двадцать суток не входил я под кровлю, чтобы таким образом победить сон. Днем палил меня зной, а ночью знобил холод, и как я не хотел войти в хижину и подкрепить себя сном, то мозг у меня так высох, что я наконец приходил в исступление. По крайней мере, сколько зависело от меня, я одолевал сон, но уступил ему, как требованию самой природы».'
        cn: 这是这位斗士的又一壮举。这位坚如磐石的人决心克服睡眠。他如此讲述道：「我整整二十昼夜没有进入屋顶之下，以此方式战胜睡眠。白天酷热灼烧着我，夜晚寒冷使我颤抖，而由于我不想进入小屋并通过睡眠来恢复体力，我的大脑因此干枯了，以至于我最终陷入狂乱。至少，就我所能而言，我战胜了睡眠，但我屈服于它，如同大自然自身的要求一般。」
    - type: paragraph
      text:
        ru: Однажды святой Макарий на рассвете сидел в своей келии; на ногу ему сел комар и впился в нее. Дав ему напиться крови, Макарий, когда почувствовал боль, раздавил его. Но после стал раскаиваться, что отомстил за самого себя, и за такой грех осудил себя сидеть нагим шесть месяцев при скитском болоте, которое находилось в глухой пустыне. Комары здесь величиною равняются осам и прокусывают кожу даже у кабанов. Ими он так был весь искусан и изъеден, что некоторые думали, не в проказе ли он. Когда чрез шесть месяцев он возвратился в свою келию, то по голосу только узнали, что это сам господин Макарий.
        cn: 有一次，圣马卡里拂晓时分坐在自己的小室里；一只蚊子落在他的腿上，叮咬了他的腿。任凭它吸饱了血，马卡里感到疼痛时，便把它碾死了。但后来他开始悔改，因为他为自己报复了，并为了这样的罪，判罚自己赤身裸体地在隐修处的沼泽旁坐六个月，那沼泽位于一片荒无人烟的旷野中。这里的蚊子大小如同黄蜂，甚至能叮穿野猪的皮肤。他被它们叮咬啃噬得体无完肤，以至于有些人以为他是不是患了麻风病。六个月后，当他回到自己的小室时，人们只能凭声音认出，这就是马卡里长老本人。
    - type: paragraph
      text:
        ru: Захотелось ему однажды, как он сам рассказывал нам, сходить на могилу Ианния и Иамврия – волхвов, живших при фараоне, чтобы посмотреть на нее или даже встретиться с жившими там демонами, а это место Ианний и Иамврий силою своих волхвований населили множеством демонов, и притом самых лютых. Гробницу воздвигли сами Ианний и Иамврий, которые в то время занимали по фараоне первое место, как всех превосходившие волшебным искусством. Пользуясь при жизни своей великою властию в Египте, они соорудили это здание из четвероугольных камней, воздвигли здесь себе гробницу и положили тут много золота, насадили всяких деревьев и вырыли преглубокий колодезь на этом сыром месте. Все это сделали они в той надежде, что после смерти будут наслаждаться утехами в сем прекрасном саду.
        cn: 正如他自己告诉我们的，他曾有一次想要去伊安尼和伊阿姆弗里——法老时期的术士们——的墓地，瞻仰它，甚至与居住在那里的邪魔相遇；而伊安尼和伊阿姆弗里曾凭着他们的魔法，使这个地方充满了无数邪魔，而且是最凶恶的。这座墓地是由伊安尼和伊阿姆弗里亲自建造的，他们当时在法老面前位居首位，因为他们的魔法技艺超越众人。他们活着的时候，在埃及拥有巨大的权力，他们用四方形的石头建造了这座建筑，在这里为自己修建了墓地，并在此处放置了许多黄金，种植了各种树木，还在这个潮湿的地方挖了一口极深的井。他们做这一切是怀着这样的希望：希望死后能在这美丽的园子里享受安乐。
    - type: paragraph
      text:
        ru: Поскольку раб Божий Макарий не знал дороги к этому месту, то и соображал свой путь с течением звезд, как делают мореходцы. Так прошел святой муж всю пустыню. Нашедши здесь несколько тростнику, он чрез каждое поприще[14]ставил по одной тростинке, чтобы по ним знать, как воротиться назад. В девять дней он прошел всю эту пустыню и был уже недалеко от того сада, как с наступлением ночи несколько заснул. Злобный демон, всегда враждующий против подвижников Христовых, в то время, как Макарий спал не далее версты от гробницы, собрал все тростинки и, положив их у самой головы его, удалился. Проснувшись, Макарий находит, что все тростинки, которые он ставил по дороге для приметы, собраны в одно место. Может быть, Бог попустил это, призывая Макария к большим трудам, дабы он полагался не на указания тростинок, а на благодать Бога, Который сорок лет вел Израиль по страшной пустыне посредством столпа облачного.
        cn: 由于上主的仆人玛卡里不知道去这个地方的路，他就向海员们那样，通过观察星辰的轨迹来辨别方向。圣者就这样走过了整个旷野。他在这里找到了一些芦苇，于是每走一里程[14]就插一根芦苇，为的是可以凭此知道如何返回。他用了九天走完了这整个旷野，并且已经离那个园子不远了，当夜幕降临的时候，他稍微睡着了。那个邪恶的魔鬼，总是与基督的修道者为敌，当玛卡里睡在离墓地不到一俄里远的地方时，它把所有的芦苇都收集起来，然后把它们放在他头边，就离开了。玛卡里醒来后发现，他为作标记而沿路放置的所有芦苇都被收集到了一起。也许是上帝允许了此事，呼召玛卡里去承担更大的劳苦，以便他不再依靠芦苇的指引，而是依靠上帝的恩典——那位曾用云柱带领以色列人走过可怕旷野四十年的上帝。
    - type: paragraph
      text:
        ru: '«Когда я стал подходить к гробнице, – говорил святой, – из нее вышли навстречу мне до семидесяти демонов в разных видах; одни из них кричали, другие скакали, иные яростно скрежетали на меня зубами, а другие, как крылатые враны, бросались мне в лицо и говорили: “Что тебе надобно, Макарий? Зачем ты пришел к нам? Ты, вместе с подобными себе, завладел нашею пустынею, вы и оттуда выгнали родственных нам демонов. У нас с тобою ничего нет общего. Зачем идешь в наши места? Как отшельник, довольствуйся пустынею. Устроившие сие место отдали его нам, а ты не можешь быть здесь. Зачем хочешь ты войти в это владение, куда ни один живой человек не входил с тех пор, как мы похоронили здесь братьев, основавших оное?”. И много еще шумели и жалобно вопили демоны, но я, – говорит Макарий, – сказал им: “Пойду только и посмотрю, а потом уйду отсюда”. Демоны сказали: “Обещай нам это по совести”». Раб Божий отвечал: «Обещаю», – и демоны исчезли. «Вошедши в сад, – говорит он, – я осмотрел все и между прочим увидел медную бадью, повешенную на железной цепи над колодезем (бадья от времени покрылась ржавчиною), также яблоки, внутри совсем пустые, ибо они высохли от солнца». Затем, спокойно вышедши из сего места, святой через двадцать дней воротился в свою келию.'
        cn: 「当我开始靠近那墓穴时，」圣者说，「有将近七十个以各种形态出现的魔鬼从里面出来迎接我；有的在尖叫，有的在跳跃，有的凶猛地对我咬牙切齿，还有的，像长翅膀的乌鸦，朝我脸上扑来，并对我说：『你想要什么，玛卡里乌斯？你为何来到我们这里？你和你的同类已经占据了我们的旷野，你们还从那里驱逐了与我们亲近的魔鬼。我们与你毫无共同之处。你为何要去我们的地方？作为隐修士，你应该满足于旷野。建造这地方的人把它给了我们，你不能待在这里。你为何想进入这片领地，自从我们把那些创建此地的弟兄埋葬在这里之后，就没有一个活人进来过？』魔鬼们还大声喧哗并悲惨地哀嚎了很久，但我，」玛卡里乌斯说，「我对它们说：『我只是进去看看，然后就离开这里。』魔鬼们说：『凭良心向我们保证。』」上帝的仆人回答说：「我保证。」——于是魔鬼们就消失了。「进入花园后，」他说，「我查看了所有的一切，其中看到了一个铜制的水桶，用铁链悬挂在水井上方（那水桶因年久而布满铁锈），还看到了一些苹果，里面已经完全空了，因为它们被太阳晒干了。」随后，圣者平静地离开了这个地方，并在二十天后回到了自己的隐修室。
    - type: paragraph
      text:
        ru: 'Только с ним случилось немалое несчастие: у него недостало хлеба и воды, которую он носил с собою; так, он почти ничего не ел во все те дни странствования по пустыне. Может быть, чрез это он искушаем был в терпении, как и оказалось на деле. Когда уже он был близок к изнеможению, показался ему кто-то, как сам он рассказывал, в образе девицы, одетой в чистую льняную ткань и державшей кувшин, из которого капала вода. По словам Макария, она была от него не дальше, как на стадию. Три дня шел он и все видел, как будто она стоит с кувшином и зовет его, но он никак не мог настигнуть ее. Впрочем, в надежде утолить жажду свою святой три дня мужественно переносил усталость. После сего явилось множество буйволиц, и одна из них, с буйволенком, остановилась прямо против старца (здесь водятся они во множестве); по словам Макария, из сосцов ее текло молоко. «Подошедши к ней, – говорил он, – я досыта напился молока. Но, чтобы еще более показать мне милости, Господь, вразумляя малодушие, повелел буйволице идти за мною до самой келии. Послушная его велению, она шла за мной, кормя меня молоком и не давая сосать своему буйволенку».'
        cn: 只是他遭遇了一个不小的不幸：他所携带的饼和水都用尽了；这样，他在沙漠中跋涉的那些日子里几乎什么也没吃。也许借此他的忍耐受到了考验，事实也证明了这一点。当他已经接近筋疲力尽之时，据他自己讲述，有人向他显现，是一位少女的形象，身穿洁白的细麻布衣，手持一个从中滴水的瓦罐。按照马卡里乌斯的说法，她离他不过一斯塔迪昂之遥。他走了三天，一直看见她仿佛就站在那里，手持瓦罐，召唤着他，但他怎么也无法追上她。尽管如此，怀着解渴的希望，这位圣者勇敢地忍受了三天的疲惫。此后，出现了许多雌水牛，其中一头，带着一头小水牛，停在了这位长老的正对面（这里它们数量众多）；据马卡里乌斯所言，她的乳头流出牛奶。「我走上前去，」他说，「喝饱了牛奶。但是，为了向我更多地显示恩典，主，为了训诫我的小信，命令那头雌水牛跟着我一直走到小室。顺从祂的命令，她跟着我，用牛奶喂养我，并且不让它的小水牛吃奶。」
    - type: paragraph
      text:
        ru: 'Еще в другое время сей доблестный муж, копая колодезь для пользы монахов (а подле колодца лежали всякие листья и хворост), был ужален аспидом. Святой взял аспида руками за обе челюсти и растерзал его, сказав: «Как ты осмелился приблизиться ко мне, когда не посылал тебя Господь мой?».'
        cn: 又在另一次，这位英勇的人为了修道士们的益处而挖掘水井（水井旁边堆放着各种树叶和枯枝），被一条眼镜蛇咬伤了。这位圣人亲手抓住那条眼镜蛇的两颚，将其撕碎，说道：「我的主并没有差遣你，你竟敢靠近我？」
    - type: paragraph
      text:
        ru: 'Тот же Великий Макарий, услышав о дивном житии тавеннских монахов, переменил свое одеяние и в мирском платье поселянина пошел в Фиваиду. Пятнадцать дней шел он пустынею. Пришедши в монастырь Тавеннский, святой стал искать архимандрита по имени Пахомий, мужа весьма знаменитого, обладавшего даром пророческим. Тогда сему святому не было открыто о намерении Великого Макария. Сошедшись с ним, Макарий сказал: «Молю тебя, господин мой, прими меня в свою обитель, чтобы мне быть монахом». Великий Пахомий сказал ему: «В таких престарелых летах как можешь ты подвизаться? Здесь братия подвизаются с самой юности и переносят изнурительные труды потому, что привыкли к ним, а ты в таком возрасте не можешь перенести испытаний подвижнических – ты станешь роптать, а потом уйдешь из обители и начнешь злословить нас». Так он не принял его, то же и во второй день, даже до семи дней. А старец Макарий твердо стоял в своем намерении и все время проводил в посте. Наконец он говорит Пахомию: «Авва, прими меня. И если я не стану поститься, как они, и не буду делать, что они делают, то вели выгнать меня из обители». Великий Пахомий убеждает братию принять его (а братии в одной этой обители и доныне находится тысяча четыреста человек). Так Великий Макарий вступил в эту обитель.'
        cn: '大马卡里乌斯听闻塔奔尼斯修士们奇妙的修道生活后，换下了自己的衣袍，穿着农民的世俗服装，去了提拜德。他在旷野里行走十五天。


          来到塔奔尼斯修道院后，这位圣人开始寻找一位名叫帕霍米乌斯的院长，此人声名显赫，并拥有预言的恩赐。那时，这位圣人（帕霍米乌斯）尚未获知关于大马卡里乌斯的意图。


          马卡里乌斯见到他后说道：「我恳求您，我的尊长，接纳我进入您的修道院，好让我成为一名修士。」


          大帕霍米乌斯对他说：「在这般年迈的岁数，你怎能苦修呢？这里的弟兄们从少年时代起就苦修，并且忍受着耗竭精力的劳作，因为他们已经习惯了这些。而你在这个年纪无法忍受苦修的试炼——你会发怨言，然后你会离开修道院，并开始诋毁我们。」


          于是他没有接纳马卡里乌斯，第二天也是如此，甚至直到七天。而长老马卡里乌斯坚定地坚持着自己的决心，并且一直都禁食。


          最后他对帕霍米乌斯说：「阿爸，接纳我吧。如果我不能像他们那样禁食，并且不能做他们所做的事，那就下令把我从修道院里赶出去。」


          大帕霍米乌斯劝服众弟兄接纳了他（而且，至今，仅这一所修道院里的弟兄们就有一千四百人）。于是，大马卡里乌斯进入了这所修道院。'
    - type: paragraph
      text:
        ru: 'Спустя немного времени наступила Четыредесятница; старец видит, что каждый монах возлагает на себя различный подвиг: один принимает пищу вечером, другой – чрез пять дней, иной всю ночь стоит на молитве, а днем сидит за рукоделием. А он, Макарий, наломавши большое количество пальмовых ветвей, стал в углу и в продолжение всей Четыредесятницы, до самой Пасхи, не принимал хлеба, не касался воды, не преклонял колена, не садился, не ложился и ничего не вкушал, кроме нескольких листьев сырой капусты, да и их ел только по воскресеньям, и то для того, чтобы видели, что он ест, и чтобы самому ему не впасть в самомнение. А ежели когда выходил он из келии для какой-либо нужды, то как можно скорее опять возвращался и принимался за дело. Не открывая уст и не говоря ни слова, он стоял в безмолвии; все занятие его состояло в молитве сердечной и в плетении ветвей, которые были у него в руках. Увидев это, подвижники той обители стали роптать на своего настоятеля и говорить: «Откуда ты привел к нам сего бесплотного человека на осуждение наше? Или его изгони отсюда, или все мы, да будет тебе известно, сегодня же оставим тебя».'
        cn: 不久，大斋期来临了；老者看见每位修士都为自己承担着不同的苦修：有的晚上才进食，有的每隔五天才进食，还有的整夜站着祈祷，白天则从事手艺活。而他，马卡里，折下大量棕榈枝后，便立于一角，在大斋期的整个期间，直到复活节，不进食面包，不沾水，不屈膝，不坐下，不躺卧，除了一些生甘蓝菜叶外，什么也不吃，而且只在星期天食用，那也是为了让别人看见他在吃东西，免得他自己陷入自负。倘若他因任何需要走出他的小室，就会尽快地返回并投入到他的工作中。他不开口，一言不发，静默地站立着；他所有的专注都倾注在心祷和编织手中的枝条上。看到这一切，那修道院的苦修者们便开始抱怨他们的院长并说：「你从哪里给我们带来了这个无形体之人来定我们的罪呢？你要么把他从这里赶走，要么我们所有人，你可要知道，今天就离开你。」
    - type: paragraph
      text:
        ru: 'Услышав это от братии, великий Пахомий начал расспрашивать о Макарии и, узнав, как он живет, просил Бога открыть ему, кто это такой. И ему было открыто, что это монах Макарий. Тогда Великий Пахомий берет его за руку, выводит вон и, приведши в молитвенный дом, там, где стоял у них жертвенник, облобызал его и сказал ему: «Подойди сюда, честный старче! Ты Макарий и скрывал это от меня! Много уже лет желал я видеть тебя, потому что слышал о делах твоих. Благодарю тебя: ты смирил чад моих – пусть они не превозносятся своими подвигами. Теперь прошу тебя: удались в свое место, ты уже довольно научил нас, молись о нас». Таким образом, по желанию Пахомия и по просьбе всей братии Макарий удалился.'
        cn: 众修士听闻此事后，伟大的帕科缪便开始询问关于马卡里奥斯的事，并得知他的生活方式后，便恳求上帝向他启示此人究竟是谁。上帝向他启示说，这就是修士马卡里奥斯。于是，伟大的帕科缪拉着他的手，将他带出去，并把他带到祈祷室，在他们那里放置祭坛的地方，亲吻了他，并对他说：「到这里来，可敬的长者！你就是马卡里奥斯，你一直瞒着我！我多年来一直渴望见到你，因为我听闻了你的作为。我感谢你：你使我的孩子们谦卑下来——愿他们不再因自己的苦修而自高自大。现在我恳求你：回到你的地方去吧，你已经足够教导我们了，请为我们祷告。」就这样，按照帕科缪的愿望，并应全体修士的请求，马卡里奥斯便离开了。
    - type: paragraph
      text:
        ru: 'Сказывал нам сей бесстрастный муж еще следующее: «Когда прошел я все подвижническое житие, которое избрал, родилось у меня другое духовное желание: я захотел сделать то, чтобы ум мой в продолжение только пяти дней не отвлекался от Бога и ни о чем другом не мыслил, но к Нему одному обращен был. Решившись на это, запер я свою келию и сени перед нею, чтобы не отвечать никому, кто бы ни пришел. Начал я это с другого же дня, дав уму своему такое приказание: “Смотри, не сходи с небес: там ты с Ангелами, Архангелами, со всеми горними Силами – Херувимами, Серафимами и с Самим Богом, Творцом всяческих; там будь, не сходи с неба и не впадай в чувственные помыслы”. Проведши так два дня и две ночи, я до того раздражил демона, что он сделался пламенем огненным и сожег все, что было у меня в келии; самая рогожа, на которой я стоял, объята была огнем, и мне представлялось, что я весь горю. Наконец, пораженный страхом, я на третий день оставил свое намерение, не могши сохранить ум свой неразвлеченным, и низшел к созерцанию сего мира, дабы то не вменилось мне в гордость».'
        cn: '这位不被情欲捆绑的圣者又告诉我们以下的话：


          「当我完成了我所选择的全部苦修生活后，我心中又生出了另一个属灵的愿望：我渴望我的心思意念在仅仅五天之内，不偏离神，不想念任何别的事物，唯独归向祂。我下定决心后，便将我的独修室和其前厅锁上，以便不回应任何来访者。我在第二天就开始了，并向我的心思意念下达了这样的命令：『看哪，不要离开天上：在那里你与天使、大天使、与诸天上的权能——基路伯、撒拉弗、并与万物的创造者——神自己同在；要待在那里，不要离开天上，也不要陷入感官的意念中。』


          这样度过了两天两夜，我如此激怒了魔鬼，以至于它变成了一团火焰，烧毁了我独修室里的一切；连我站立的草垫也被火焰吞噬了，在我看来，我全身都在燃烧。最终，被恐惧所击打，我在第三天放弃了我的意图，因为我无法保持我的心思意念不分散，并降到对这世界的默想中，以免那不被算作我的骄傲。」'
    - type: paragraph
      text:
        ru: 'Однажды я пришел к сему духовному монаху, Великому Макарию, и нашел, что какой-то пресвитер из селения лежал вне его келии. Голова у него так была изъедена болезнию, называемою раком, что самая кость в темени видна была вся. Он пришел к Макарию, чтобы получить исцеление, но сей и на глаза не хотел принять его. Я стал упрашивать Макария и говорил ему: «Молю тебя, умилосердись над сим страдальцем, дай ему по крайней мере какой-нибудь ответ». Святой отвечал мне: «Он недостоин исцеления. Господь послал ему такую болезнь для его вразумления. Если хочешь, чтобы он исцелился, так посоветуй ему с сего времени отказаться от совершения Таинств». Я сказал ему: «Молю тебя, скажи, почему так?». Он отвечал мне: «Сей пресвитер совершал литургию в грехе блудодеяния и за это теперь наказывается. Если он по страху прекратит то, что дерзал делать по небрежности, Бог исцелит его». Когда я пересказал это страждущему, он обещался с клятвою не священнодействовать более. Тогда Макарий принял его и сказал ему: «Веришь ли ты, что есть Бог, от Которого ничто не сокрыто?». Он отвечал: «Верю». Потом Макарий сказал ему: «Ты не должен был посмеваться над Богом». Он отвечал: «Не должен был, господин мой». Великий Макарий сказал: «Ежели ты сознаешь грех свой и наказание Божие, которому подвергся за этот грех, то исправься на будущее время». Пресвитер исповедал грех свой и обещался более не грешить и не служить при алтаре, но стать в ряду мирян. Затем святой возложил на него свои руки, и он в несколько дней выздоровел, оброс волосами и возвратился домой здоровым, прославляя Бога и благодаря Великого Макария.'
        cn: '我曾拜访这位灵修修士，大马卡里乌斯，发现有位来自乡村的长老年迈地躺在他的隐修室外。他的头部被一种名为癌症的疾病侵蚀得厉害，头顶的骨头都完全显露出来。他来到马卡里乌斯这里，希望能获得医治，但圣者甚至不愿看他一眼。


          我开始恳求马卡里乌斯，并对他说：「我恳请您，怜悯这位受苦之人，至少给他一个答复吧。」 圣者回答我：「他不配得医治。主差遣他受此病痛是为了管教他。如果你希望他痊愈，就建议他从今以后停止施行圣事。」 我对他说：「我恳求你，告诉我为何如此？」 他回答我：「这位长老在奸淫罪中举行事奉圣礼，因此现在正受惩罚。如果他因惧怕而停止他因疏忽所胆敢做的事，上帝就会医治他。」


          当我将这话转述给那受苦者时，他郑重起誓不再司祭。那时，马卡里乌斯接纳了他，并对他说：「你相信有上帝，在祂面前无所隐藏吗？」 他答道：「我相信。」 随后马卡里乌斯对他说：「你不应该嘲弄上帝。」 他答道：「我不应该，我的主人。」 大马卡里乌斯说：「如果你承认自己的罪，并承认因这罪而受到的上帝的惩罚，那么今后就改过自新吧。」


          这位长老告白了他的罪，并承诺不再犯罪，不再在祭台前事奉，而是成为平信徒。随后，圣者将手按在他身上，几天之内他就痊愈了，头发重新长出，健康地回到家中，赞美上帝并感谢大马卡里乌斯。'
    - type: paragraph
      text:
        ru: 'Сей святой имел разные келии в пустыне, в которых совершал подвиги добродетели: одну в скиту, в самой глубокой пустыне, одну в Ливии, в так называемых Келлиях, и одну в горе Нитрийской. Некоторые из них были без окон – в них, говорят, Макарий проводил Четыредесятницу в темноте. Одна келия была так тесна, что в ней нельзя было и ног протянуть; и еще келия была просторнее других – в ней он принимал посетителей.'
        cn: 这位圣人拥有旷野中不同的隐修室，在其中他实行德行苦修：一间在斯基特，位于最深的旷野中；一间在利比亚，位于所谓的凯利亚；还有一间在尼特里亚山。其中一些隐修室没有窗户——据说马卡里乌斯在其中于黑暗中度过大斋期。有一间隐修室非常狭窄，甚至无法伸直双腿；还有一间隐修室比其他的更宽敞——他便在其中接待访客。
    - type: paragraph
      text:
        ru: Сей боголюбивый муж исцелил такое множество бесноватых, что трудно их и перечислить. При нас принесли к сему преподобному одну благородную и богатую девицу из Фессалоник, что в Ахаии, – она много лет страдала параличом. Принесшие повергли ее близ келии Макария. Святой, сжалившись над нею и помолившись, собственноручно помазал ее святым елеем, непрестанно и более мысленно молился о ней и чрез двадцать дней отпустил ее в свой город здоровою. Пришедши домой на своих ногах, она прислала богатые дары святым.
        cn: 这位爱神的圣者医治了如此众多的被鬼附之人，以至于难以计数。在我们这里，有人将一位出身高贵且富有的少女带到这位可敬者面前，她来自位于亚该亚的帖撒罗尼迦，已瘫痪多年。带来她的人们将她放在马卡里奥斯隐修室附近。这位圣者怜悯她，并祷告后，亲手用圣油膏抹她，不住地为她祷告，并且更多是在默想中祷告，并在二十天后让她康复地回到自己的城市。她用自己的双脚回到家中，并送来丰厚的礼物给圣者们。
    - type: paragraph
      text:
        ru: Также при моих глазах к святому Макарию, духовному врачу всяких безумных страстей, привели отрока, одержимого злым духом. Положив правую руку ему на голову, а левую – на сердце, святой до тех пор молился о нем, пока он не повис на воздухе. Отрок раздулся, как мех, всем телом своим, сделался по весу весьма тяжел и вдруг, вскричавши, стал всеми чувствами извергать из себя воду. Но, когда это кончилось, он опять пришел в прежнюю свою меру. Затем, помазав его святым елеем и окропив освященною водою, Макарий отдал его отцу и приказал, чтобы больной до сорока дней не касался ни мяса, ни вина, и, таким образом, отпустил его исцеленным.
        cn: 同样在我眼前，人们带来了一个被恶灵附身的少年，到圣马卡里那里，他是一位灵性医生，能医治各种癫狂的情欲。他将右手放在少年头上，左手放在心上，这位圣人一直为他祷告，直到少年悬浮在空中。少年全身膨胀，如同一个皮囊，重量变得极其沉重，突然间，他大声喊叫，从全身孔窍排出水来。然而，当这一切结束后，他又恢复了原状。接着，马卡里用圣油膏抹他，并用圣水洒他，然后将他交还给他的父亲，并吩咐病人在这四十天内不可碰触肉类和酒，就这样，他治愈了病人并让他离开。
    - type: paragraph
      text:
        ru: 'Однажды начали беспокоитьМакария Великоготщеславные помыслы, пытаясь вызвать его из келии и внушая ему отправиться в Рим для пользы других, именно для оказания помощи тамошним больным, ибо в нем благодать Господня сильно действовала на духов нечистых. Долго беспокоили его эти помыслы, но он не слушал их. Тогда они, вооружившись на него сильнее, стали гнать его вон. И вот святой упал на пороге своей келии; протянув ноги, выпустил их наружу и говорил демонам тщеславия: «Тащите меня, демоны, если можете: своими ногами я не пойду в другое место; если же можете так унести меня, пойду, куда вы зовете». Он с клятвою говорил им: «Буду лежать так до вечера; если не сдвинете меня, не послушаю вас». Лежав долгое время неподвижно, он встал наконец, когда был уже глубокий вечер. Но с наступлением ночи демоны опять начали беспокоить его. Святой встал, взял корзину, насыпал в нее меры две песку и, положив ее себе на плечи, ходил с нею по пустыне. Здесь с ним встретился Феосевий, строитель, уроженец Антиохии, и сказал ему: «Что ты несешь, авва? Отдай мне свою ношу и не изнуряй себя». Но Макарий отвечал ему: «Я изнуряю того, кто меня изнуряет; не любя трудиться, он внушает мне охоту к странствованию». Долго ходил он так и возвратился в свою келию, изнурив тело.'
        cn: 有一次，虚荣的念头开始困扰马卡里乌斯大圣，试图把他从隐修室引出来，并唆使他前往罗马去造福他人，具体而言，是去帮助那里的病人，因为上主的恩典在他身上大力作用，能制伏不洁之灵。这些念头长期困扰着他，但他不听从它们。于是它们，以更强大的力量武装起来，开始把他往外赶。这位圣者倒在他的隐修室门槛上；他伸出双腿，让它们露在门外，并对虚荣的魔鬼说：「魔鬼啊，你们若能，就拖走我吧：我不会用自己的双脚走到别处去；如果你们能这样把我带走，我就去你们呼唤的地方。」他向它们发誓说：「我会这样躺到晚上；如果你们无法把我挪动，我就不听从你们。」他长时间一动不动地躺着，终于在夜幕已深时站了起来。但随着夜晚的降临，魔鬼们又开始困扰他。这位圣者站了起来，拿起一个篮子，往里面倒了两量度的沙子，然后把它放在自己肩上，带着它在沙漠中行走。在这里，一位名叫忒奥塞比奥斯的营造者与他相遇，此人是安提阿本地人，他对他说：「阿爸，你背着什么呀？把你的重担给我吧，不要再劳累自己了。」但马卡里乌斯回答他说：「我正在劳累那劳累我之人；它不爱劳作，却怂恿我生出漫游的念头。」他这样走了很长时间，然后回到了他的隐修室，身体已经疲惫不堪。
    - type: paragraph
      text:
        ru: 'Еще рассказывал нам раб Христов Пафнутий, ученик сего доблестного подвижника. В один день, когда блаженный и бессмертный Макарий сидел в сенях келии своей и беседовал с Богом, гиена принесла к нему своего детеныша – слепого. Толкнув головою в дверь сеней, она вошла к Макарию, который в это время еще сидел тут, и бросила детеныша к ногам его. Святой Макарий взял его и, плюнув ему в глаза, сотворил молитву, и он тотчас стал видеть, а мать накормила его и ушла с ним. На следующий день гиена принесла святому и блаженному Макарию кожу большой овцы. Увидев сию кожу, святой сказал гиене: «Ты растерзала у кого-нибудь овцу – иначе откуда тебе взять кожу? Я не возьму от тебя того, что добыто несправедливостию». Гиена, опустив голову к земле, стала на колени у ног святого и подавала ему кожу. Но он говорит ей: «Я сказал, что не возьму, ежели не дашь клятвы, что не станешь больше есть овец у бедных». При этом она опять опустила голову, как будто соглашаясь на слова святого. Кожу эту раб Христов отказал святому и блаженному Афанасию Великому. И блаженная раба Христова Мелания сказывала мне, что она брала сию кожу у святого и дивного мужа Макария под именем дара гиены. И что удивительного, если людям, распявшимся миру, и гиена, ими облагодетельствованная, приносит дары во славу Бога и в честь рабов Его?! Тот, Кто пред Даниилом пророком укротил львов, дал смысл и этой гиене.'
        cn: '基督的仆人帕夫努提，这位英勇苦行者的门徒，又向我们讲述：


          有一天，当蒙福且不朽的马卡里坐在他的隐修室门廊里与上帝交谈时，一只鬣狗带着它的幼崽——一只瞎眼的幼崽——来到他跟前。它用头顶开门廊的门，走到马卡里面前，而马卡里那时仍坐在那里，将幼崽扔到他的脚边。圣马卡里抱起它，朝它眼睛吐了一口唾沫，做了祷告，它就立刻看得见了。而它的母亲喂了它，就带着它离开了。


          第二天，鬣狗给圣者且蒙福的马卡里带来一张大羊皮。圣者见到这张皮，对鬣狗说：「你撕裂了某个人的羊——否则你从哪里弄来这张皮？我不会接受你通过不义所得之物。」鬣狗将头垂到地上，跪在圣者的脚边，并将皮递给他。但他对它说：「我说过我不会拿，除非你发誓以后不再吃穷人的羊了。」于是它再次垂下头，仿佛是同意了圣者的话。


          基督的仆人将这张皮献给了圣者且蒙福的亚他那修大帝。蒙福的基督的仆人梅拉尼娅也告诉我，她从圣者和奇妙的马卡里那里得到了这张皮，作为鬣狗的礼物。


          这有什么可惊讶的呢？如果连那些向世界钉死自己的人，以及受他们恩惠的鬣狗，都为了上帝的荣耀并尊崇祂的仆人而献上礼物？！那在先知但以理面前驯服狮子的主，也赋予了这只鬣狗以明悟。'
    - type: paragraph
      text:
        ru: Говорят еще о святом Макарии, что он с того времени, как крестился, никогда не плевал на землю, а теперь уже шестьдесят лет минуло, как он принял Крещение. Крестился же верный раб Христов и бессмертный Макарий на сороковом году своей жизни.
        cn: 人们还说起圣马卡里，他从受洗以来，从未向地上吐过唾沫；而今，他接受洗礼已经六十年了。基督的忠仆，那不朽的马卡里，是在他生命的第四十年受洗的。
    - type: paragraph
      text:
        ru: 'Видом сей непобедимый подвижник Христов был таков (я должен и об этом сказать тебе, раб Христов: быв его современником, я, недостойный, хорошо знал его): он был согбен и сухощав. Волосы росли только на губе, да еще на конце подбородка было их немного – от чрезмерных трудов подвижнических даже борода не росла у него.'
        cn: 这位基督的不可战胜的苦修者，他的外表是这样的（我必须把这件事也告诉你，基督的仆人啊：我这个不配的人，是他的同时代人，对他很了解）：他佝偻着身子，瘦骨嶙峋。他的毛发只长在嘴唇上，下巴尖上也只有一点点——因着他过度的苦修劳作，甚至连胡子都没有长出来。
    - type: paragraph
      text:
        ru: 'Однажды впал я в великую тоску и, пришедши к сему святому, сказал ему: «Авва Макарий! Что мне делать? Смущают меня помыслы, говоря мне: “Ты ничего не делаешь здесь, ступай отселе”». Святой отец отвечал мне: «Скажи твоим помыслам: “Для Христа я стерегу стены”».'
        cn: 有一次，我陷入极大的愁苦中，于是来到这位圣者面前，对他说：「阿爸马卡里！我该怎么办？有各种意念搅扰我，对我说：『你在这里什么也没做，离开这里吧。』」圣父回答我：「你要对你的意念说：『为了基督，我在此看守着这些墙垣。』」
    - type: paragraph
      text:
        ru: Из множества великих чудес и подвигов славного и доблестного Макария только сии описал я тебе, христолюбивый и любознательный раб Божий!
        cn: 从荣耀且英勇的玛卡里乌斯诸多伟大的神迹和功绩中，我只为你描述了这些，热爱基督且求知若渴的上帝之仆！
    - type: paragraph
      text:
        ru: 'Дивный муж сей рассказывал нам еще вот какое чудо: во время преподания Таин Христовых (он был пресвитер), я никогда сам не подавал приношения Марку-подвижнику, но замечал, что с жертвенника брал оное Ангел и подавал ему – впрочем, я видел только кисть руки, подающей ему Причастие.'
        cn: 这位奇人还给我们讲了这样一个神迹：在施行基督圣奥秘（他是一位司祭）的时候，我从未亲自把供奉递给马尔库斯苦修者，但我注意到有天使从祭坛上取下供奉递给他——然而，我只看到一只手腕在递给他圣体。
  - type: heading2
    text:
      ru: О Марке
      cn: 关于马克
    children:
    - type: paragraph
      text:
        ru: 'Марк сей, о котором упомянуто в конце предыдущего сказания, еще в юности знал наизусть писание Ветхого и Нового Завета; он был чрезвычайно кроток и скромен, как едва ли кто другой. В один день на досуге пошел я к нему (он был уже в глубокой старости) и, севши у дверей его келии (как новоначальный, я считал его выше человека, и он действительно был таков), стал прислушиваться, что он говорит или что делает. Совершенно один внутри келии, почти столетний старец, у которого уже и зубов не было, он все еще боролся с самим собою и с диаволом и говорил: «Чего еще ты хочешь, старик? И вино ты пил, и масло употреблял – чего же еще от меня требуешь? Седой обжора, чревоугодник, ты себя позоришь». Потом, обращаясь к диаволу, говорил: «Отойди же наконец от меня, диавол, ты состарился со мною в нерадении. Под предлогом телесной немощи заставил ты меня употреблять вино и масло и сделал сластолюбцем. Ужели и теперь еще я чем-нибудь тебе должен? Нечего более тебе у меня похитить, отойди же от меня, человеконенавистник». Потом, как бы шутя, говорил самому себе: «Ну же, болтун, седой обжора, жадный старик, долго ли быть мне с тобою?».'
        cn: 这个马尔克，在上一则记述的末尾提到过他，他还在青年时期就熟记旧约和新约的圣经；他极其谦和又谦逊，几乎无人能及。有一天我闲暇时去看望他（他已是耄耋之年），坐到他隐修小室的门边（作为一个初学者，我视他高于常人，而他确实如此），开始聆听他在说什么或做什么。他完全独自一人待在隐修小室里，这位将近百岁的老者，牙齿都已掉光，他仍在与自己和魔鬼搏斗，并说道：「你还想要什么，老头子？你酒也喝了，油也用了——还想从我这里要求什么？你这白发的饕餮之徒，贪食者，你正在自取其辱。」接着，他转向魔鬼说道：「你这魔鬼，最终还是从我这里滚开吧，你已与我一同在怠惰中变老。你以身体软弱为借口，强迫我饮酒用油，使我成为一个爱享乐之人。难道我现在还欠你什么吗？你已没有什么可以从我这里偷走了，从我这里滚开吧，你这憎恨人类的！」然后，他像是开玩笑似地对自己说：「够了，你这饶舌的，白发的饕餮之徒，贪婪的老头子，我还要和你一起待多久？」
  - type: heading2
    text:
      ru: О Моисее Ефиоплянине
      cn: 关于摩西埃塞俄比亚人
    children:
    - type: paragraph
      text:
        ru: Некто по имени Моисей, родом ефиоплянин, лицом черный, был рабом у одного сановника. Господин прогнал его от себя за великий разврат и разбой. Говорят, он доходил и до смертоубийства – нахожу нужным упоминать о худых делах его, чтобы показать, какова была после добродетель его покаяния. Некоторые говорят, что он был даже начальником весьма многочисленной шайки разбойников. Из разбойнических дел его, между прочим, известно следующее. Питал он злобу на одного пастуха, который с собаками своего стада помешал ему в каком-то ночном предприятии. Задумав убить его, он обошел кругом то место, где обыкновенно паслись его овцы. Но ему дали знать, что пастух находится по ту сторону Нила, и как река в это время разлилась на широту одного поприща, то он взял меч в зубы, а платье, в которое был одет, положил себе на голову и переплыл реку. Между тем, пока он плыл, пастух имел возможность скрыться в тайном месте. Таким образом, предприятие не удалось Моисею, и он, зарезав четырех отборных баранов и связав их веревкою, переплыл через Нил назад. Зашедши на пути в небольшую хижину, он снял здесь с баранов кожу, лучшее мясо съел, а кожи выменял на вино и, выпив его до восемнадцати италийских мер, пошел в сборное место шайки, до которого оставалось еще пятьдесят поприщ.
        cn: 有一位名叫摩西的人，出身埃塞俄比亚，面容黝黑，是一个显贵家中的奴隶。他的主人因其极度放荡和劫掠而将他逐出家门。据说，他甚至还犯下过杀人罪——我认为有必要提及他过往的恶行，以此来显示他日后悔改所结出的美德是何等伟大。有些人说，他甚至还是一个规模庞大的强盗团伙的头目。在他所犯的劫掠罪行中，尤以以下一事广为人知。他曾对一个牧羊人怀恨在心，因为那个牧羊人曾用他的牧羊犬妨碍了他某个夜间行动。于是他心生杀意，绕着牧羊人通常放牧羊群的地方走了一圈。但有人告诉他，牧羊人身在尼罗河对岸；又因当时河水泛滥，宽达一个波普利希之遥，于是他口衔宝剑，将身上所穿的衣物顶在头上，渡过了那条河。就在他泅渡之时，牧羊人得以藏身于隐秘之处。于是，摩西的行动未能得逞；他便宰杀了四只精挑细选的绵羊，并用绳索将它们捆绑起来，又渡河回到了尼罗河对岸。途经一间小茅屋时，他便在那里剥下了绵羊的皮，吃掉了上好的羊肉，而将羊皮换成了酒，喝了多达十八「意大利量」的酒后，便前往团伙的集结地点，距离那里还有五十个波普利希。
    - type: paragraph
      text:
        ru: И этот страшный атаман, впоследствии времени пораженный каким-то несчастным случаем, удалился в монастырь и показал такое покаяние, что самого сообщника своего, диавола, который от юности подущал его на злое и участвовал во всех делах его, заставил против воли исповедать Христа.
        cn: 而这位可怕的阿塔曼，后来因某种不幸事件而遭受打击，隐退到修道院，并展现出如此的忏悔，以至于他自己的同谋，那从青年时代起就唆使他作恶并参与了他所有行径的魔鬼，竟被迫违背意愿地宣认基督。
    - type: paragraph
      text:
        ru: 'Между прочим рассказывают, что однажды напали на него в келии четыре разбойника, не зная, что он был Моисей. Блаженный всех их перевязал и, подняв на плечи, как мешок с соломой, принес в собрание братий и говорит: «Я никого не могу обижать, но они пришли меня обидеть – что повелите сделать с ними?». Так взятые святым Моисеем разбойники исповедали грех свой пред Богом, а когда узнали, что это Моисей, некогда знаменитый и всюду известный начальник разбойников, то прославили за него Христа и, тронутые его обращением, сами отреклись от мира и сделались добрыми монахами. Они рассудили так: «Если этот сильный человек и столько прославившийся разбойничьим ремеслом так сильно убоялся Бога, то зачем нам отлагать спасение душ своих?».'
        cn: '顺带一提，人们讲述说，有一次，四个强盗闯入了他的隐修室攻击他，却不知道他就是莫伊塞。那位蒙福者把他们所有人都捆绑起来，然后像一袋稻草一样扛在肩上，带到了弟兄们的集会中，说道：「我不会伤害任何人，但他们却来伤害我——你们吩咐我如何处置他们？」


          于是，被圣莫伊塞擒获的强盗们在上帝面前认了他们的罪。当他们得知这就是莫伊塞，那个曾是声名显赫、四处闻名的强盗首领时，就为他颂赞基督。他们被他的转变所感动，自己也弃绝了世界，成为了虔诚的修士。他们如此思量道：「如果这个强壮的人，并且曾因强盗行当而如此声名远播的人，竟然如此深切地敬畏上帝，那么我们为何还要拖延我们灵魂的救赎呢？」'
    - type: paragraph
      text:
        ru: 'На сего блаженного Моисея (так уже должно называть его) восстали демоны невоздержания, увлекая его к прежней распутной и блудной жизни. Он так был ими искушаем, что, как сам сказывал, едва не оставил своего намерения жить в монашестве. И вот он пошел к Великому Исидору, жившему в скиту, и рассказал ему о своей борьбе с блудными помыслами. Святой сказал ему: «Не унывай, это только сначала. Они потому так сильно напали на тебя, что хотят возвратить тебя к прежним привычкам. Если ты пребудешь тверд в подвиге воздержания,«умертвивсвоиуды.., яже на земли»(Кол. 3, 5), и заградишь вход чревоугодию, которое есть мать любострастия, то демон блуда, не находя более пищи, которая бы разжигала его, с досадою отступит от тебя». С этого времени раб Христов Моисей удалился в уединение и, заключившись в своей келии, с величайшим терпением стал подвизаться более всего в воздержании от пищи и, кроме двенадцати унций сухого хлеба, не вкушал другой снеди. Работал он весьма много и каждодневно совершал по пятидесяти молитв.'
        cn: 不节制的恶魔向这位蒙福者摩西（此时当已如此称呼他了）发起攻击，引诱他回到从前放荡、淫乱的生活。他被它们试探得如此强烈，以至于正如他自己所说，他几乎要放弃修道生活的意愿了。于是他去见了住在隐修区的大伊西多尔，并向他倾诉自己与淫乱意念的挣扎。这位圣人对他说：「不要沮丧，这只是刚开始。它们之所以如此猛烈地攻击你，是因为它们想要让你回到从前的习性中去。如果你在节制的苦修中坚定不移，『治死你们在地上的肢体』（歌罗西书 3:5），并杜绝暴食的入口——暴食是情欲之母，那么淫乱的恶魔因不再找到能煽动它的食粮，就会恼恨地离开你。」从那时起，基督的仆人摩西退隐独居，将自己关在他的隐修室里，以极大的忍耐开始苦修，尤其在节制饮食方面。除了十二盎司的干粮外，他不再食用其他的食物。他辛勤劳作，并每日 совер五十次祷告。
    - type: paragraph
      text:
        ru: 'Но, как ни смирял он свое тело, все еще иногда был тревожим похотию, особенно во сне. Тогда он пошел к одному монаху, опытнейшему между святыми, и говорит ему: «Что мне делать, авва? Сновидения омрачают ум мой, потому что душа по прежней привычке услаждается ими». Святой отвечал ему: «Ты еще не отвлек своего ума от сонных мечтаний, потому и подвержен этой нечистой похоти. Сделай же, что я тебе скажу: проведи несколько времени в бодрствовании, молись усердно и скоро освободишься от сих мечтаний». Доблестный Моисей, выслушав это наставление, как от опытного наставника, и возвратившись в келию, дал себе слово не спать всю ночь и не преклонять колен даже для молитвы, дабы избежать власти сна. И прожил он шесть лет в келии, по целым ночам стоя посреди келии, непрестанно молясь Богу и не смежая очей.'
        cn: 然而，无论他如何苦修肉身，依然时常受到情欲的侵扰，尤其是在梦中。于是，他去拜访了一位修士，这位修士在众圣者中经验最为丰富，他对他说：「阿爸，我该怎么办？梦境使我的心神蒙蔽，因为灵魂因着先前的习惯而从中获得愉悦。」圣者回答他说：「你还未能将你的心智从睡梦的幻想中抽离，因此才受这种不洁情欲的侵扰。照我所说的去做：保持一段时间的警醒，殷勤祈祷，你很快就能从这些幻象中解脱。」刚毅的摩西听闻了这番训诫，深知其出自一位富有经验的导师，回到自己的小室后，便下定决心整夜不睡，甚至不为祈祷而屈膝，以免落入睡眠的权势之下。他在小室里居住了六年，整夜站立在小室中央，不间断地向上帝祈祷，并且不曾合眼。
    - type: paragraph
      text:
        ru: Но и такими подвигами он не мог победить необузданной похоти. Подлинно необузданная похоть! Ибо, как ни измождал он себя трудами, не мог, однако ж, покорить сей постыдной страсти.
        cn: '然而，即便凭着这样的苦修，他仍无法战胜无法抑制的淫欲。

          当真是无法抑制的淫欲啊！

          因为，无论他如何劳苦折磨自己，他仍无法制服这可耻的情欲。'
    - type: paragraph
      text:
        ru: 'После всего этого он положил изнурять себя другим еще способом. Выходя по ночам, сей противоборник сатаны (различно он ратовал против него) обходил келии тех монахов, которые, состарившись в трудах подвижничества, уже не в силах были носить воду для себя, брал их водоносы и наполнял водою, так что они этого и не знали. А воду в тех местах берут далеко: одни – за две версты, другие – за пять, иные – за полверсты. Демон, не могши выносить терпение ратоборца, подстерегал его и в одну из таких ночей, когда Моисей занимался этим делом, лишь только он наклонился в колодезь, чтобы наполнить водонос одного монаха, так ударил его по бедрам палицею, что он упал тут замертво, совершенно не понимая, что такое с ним случилось и кем это сделано. На другой день один монах, пришедший сюда за водою, увидев, что он лежит там и едва дышит, пошел и сказал об этом Великому Исидору, пресвитеру скитскому, который, отправившись на то место с несколькими из братий, взял его и принес в монастырь. Целый год Моисей был болен, так что едва наконец укрепился телом и душою. Тогда Исидор, великий иерей Христов, стал говорить ему: «Перестань наконец бороться с демонами, брат мой, и не наступай на них, ибо в подвижничестве есть мера и подвигам против демонов». Непобедимый же раб Христов говорит Великому: «Не перестану сражаться с ними, пока не оставят меня сонные мечтания». Тогда пресвитер Исидор сказал ему: «Во имя Господа нашего Иисуса Христа отныне с тобою не будет нечистых сновидений. Теперь с упованием приобщись Святых Таин. Чтобы тебе не тщеславиться, будто собственными подвигами победил ты похоть, диавол и поразил тебя так сильно для твоей же пользы, чтобы ты не пал от надмения».'
        cn: 在这一切之后，他决心再以另一种方式苦修己身。夜间外出时，这位撒旦的对抗者（他曾以各种方式与撒旦争战）会巡视那些因苦修劳作而年迈、已无力为自己打水的修士的修道室，取走他们的水罐并将其装满水，以至于他们对此毫不知情。而在那些地方，打水路途遥远：有的修士要走两俄里，有的要走五俄里，还有的要走半俄里。恶魔无法忍受这位争战者的忍耐，于是伏击了他。在其中的一个夜晚，当摩西正在做这事时，他刚俯身到井里，准备为一位修士装满水罐，恶魔就用棍棒猛击他的臀部，使得他当场倒下，昏死过去，完全不明白发生了什么，也不知道是谁做的。第二天，一位前来此处打水的修士，发现他躺在那里，气息奄奄，就去将此事告诉了伟大的伊西多尔，这位斯基特（修道群落）的长老。伊西多尔便与几位修士一同前往该地，把他带回了修道院。摩西病了一整年，以至于他直到最后才身心勉强康复。那时，伊西多尔，这位基督伟大的司祭，开始对他说：「我的兄弟，你终于可以停止与恶魔争战了，不要再攻击他们了，因为在苦修和对抗恶魔的争战中，都是有其限度的。」然而，基督这位不屈不挠的仆人对伟大的伊西多尔说：「我不会停止与他们争战，直到梦中的妄想不再困扰我为止。」于是，长老伊西多尔对他说：「奉我们的主耶稣基督之名，从今以后，你将不再有不洁的梦境了。现在，怀着信望领受圣奥秘（圣体）吧。魔鬼之所以如此重击你，是为了你的益处，免得你因以为凭着自己的苦修战胜了情欲而心生骄傲，以致跌入狂妄之中。」
    - type: paragraph
      text:
        ru: 'Выслушав это, Моисей возвратился в свою келию и уже спокойно проводил жизнь в умеренном подвижничестве. Когда через два или три месяца блаженный пресвитер Исидор спросил подвижника, не беспокоил ли его тот дух, он отвечал: «С того самого часа, как ты помолился о мне, раб Божий, со мной не случилось ничего подобного».'
        cn: 听到这话，摩西回到自己的隐修室，并从此平静地过着适度苦修的生活。两三个月后，蒙福的长老伊西多尔问这位苦修者，那个灵是否还在搅扰他时，他回答说：「自从你为我祷告的那一刻起，神的仆人，我再没有遇到过类似的事情。」
    - type: paragraph
      text:
        ru: Сему святому дарована была великая благодать на демонов. Как мы зимой не боимся мух, так точно, и еще больше, презирал демонов этот великий ратоборец Моисей. Таково было святое житие непобедимого подвижника Моисея, по происхождению ефиоплянина, а по душе украшенного Божественною благодатию. По доблестям своим он причислен к лику великих отцов, скончался в скиту семидесяти пяти лет от рождения в сане пресвитера и оставил по себе семьдесят учеников.
        cn: 这位圣者被赐予了抵制魔鬼的莫大恩典。就像我们冬天不惧怕苍蝇一样，这位伟大的勇士摩西，同样甚至更甚地蔑视魔鬼。这就是这位不可战胜的苦修者摩西圣洁的生平——他按出身是埃塞俄比亚人，而在灵魂上则被神圣的恩典所妆饰。凭着他的功德，他被列入伟大的教父之列，在隐修地以长老的身份离世，享年七十五岁，并留下了七十名门徒。
  - type: heading2
    text:
      ru: О Павле Фермейском
      cn: 关于帕维尔·费尔梅斯基
    children:
    - type: paragraph
      text:
        ru: 'Есть в Египте гора, чрез которую идет путь в пустынный скит; она называется Фермою. На сей горе живет около пятисот подвижников. В числе их был некто по имени Павел, доблестный монах, который постоянно вел следующий образ жизни: ни за работу и ни за какое мирское дело никогда не принимался, ни от кого ничего не брал, исключая насущной пищи. Дело подвижничества его состояло в непрестанной молитве. Так как у него положено было совершать триста молитв в сутки, то он, набрав такое же число камешков, держал их в пазухе и, как скоро оканчивал одну молитву, выбрасывал из пазухи один камешек.'
        cn: 埃及有一座山，通往一处沙漠隐修院，它名叫费尔穆。在这座山上居住着大约五百名苦修者。在他们中间，有一位名叫保罗的英勇修士，他始终如一地过着以下的生活方式：从不从事任何工作或世俗事务，除了仅够维持生命的食物外，从不向任何人索取任何东西。他的苦修实践在于不住的祷告。由于他规定自己每天要做三百次祷告，于是他捡了相同数量的小石子，把它们揣在怀里，每当他完成一次祷告，就从怀里扔掉一块小石子。
    - type: paragraph
      text:
        ru: 'Однажды сей благочестивый муж, пришедши к святому Макарию, так называемому Городскому, для свидания и духовного назидания, сказал ему: «Авва Макарий! Я нахожусь в великой скорби». Раб Христов заставил его сказать причину скорби, и тот говорит ему:'
        cn: 有一天，这位虔诚的人来到被称为「城市者」的圣马卡里奥斯那里，为了拜访和寻求属灵的教导，他对圣马卡里奥斯说：「阿爸马卡里奥斯！我正处于极大的忧伤之中。」基督的仆人让他说出忧伤的原因，那人便对他说：
    - type: paragraph
      text:
        ru: '«В одном селении живет девственница, которая подвизается уже тридцатый год. Многие сказывали мне, что она, кроме субботы и воскресенья, не вкушает пищи ни в какой день, что, всегда проводя так седмицы, вкушает через пять дней и совершает каждый день по семисот молитв. Я укорил себя, когда узнал об этом, рассуждая, что я, будучи мужчиной и превосходя ее крепостию сил телесных, не мог совершать более трехсот молитв». Святой Макарий отвечал: «Я вот уже шестидесятый год совершаю только по сто положенных молитв, зарабатываю нужное для пропитания своими руками, подолгу не отказываю братиям в свидании, и, однако ж, ум не укоряет меня в нерадении. Если же ты, совершая и по триста молитв, осуждаешься совестию, то явно, что ты или с нечистым сердцем молишься, или можешь больше молиться и, однако ж, не молишься».'
        cn: '「在一个村庄里住着一位贞女，她已苦修三十年。许多人告诉我，她除了周六和周日，任何一天都不进食，她总是这样度过周，每五天进食一次，并且每天完成七百次祷告。我得知此事后，便自责起来，心想，我身为男子，在体力上胜过她，却不能完成超过三百次的祷告。」


          圣马卡里回答说：「我这六十年来，只进行一百次规定的祷告，用双手赚取所需的生活费用，长时间不拒绝弟兄们的拜访，然而，我的心智却没有因为懈怠而责备我。如果你即使进行三百次祷告，仍被良心谴责，那么显然，你要么心不洁净地祷告，要么能够进行更多的祷告，却仍然没有这样做。」'
  - type: heading2
    text:
      ru: О Евлогии и увечном
      cn: 关于叶夫洛吉与残疾者
    children:
    - type: paragraph
      text:
        ru: 'Кроний, пресвитер Нитрийский, рассказывал мне о себе следующее: «В ранней юности я по малодушию убежал из обители своего архимандрита и, блуждая, дошел до горы святого Антония. А сей блаженный жил между Вавилоном и Ираклеею, в обширной пустыне, простирающейся до Чермного моря, поприщ на тридцать от реки Нила. Пришедши в его монастырь (он находился близ этой реки, на месте, называемом Писпир), где жили ученики его Макарий и Аматас, которые и похоронили его, когда он почил, я пять дней ждал случая увидеть святого Антония. Мне сказывали, что он посещает монастырь иногда через десять дней, иногда через двадцать, иногда через пять – как Бог положит ему на сердце идти туда для пользы приходящих в монастырь. На этот раз собралось нас много по разным нуждам. В том числе был один александрийский монах – Евлогий и с ним еще какой-то увечный. Пришли они по следующей причине.'
        cn: '克洛尼，尼特里亚的长老，这样对我讲述了他自己的故事：


          「在我早年的时候，我因为胆怯，逃离了我掌院的修道院，并且，一路游荡，来到了圣安东尼山。而这位蒙福者居住在巴比伦和赫拉克勒斯之间，在一片广阔的沙漠里，延伸至红海，距离尼罗河三十波普里。我来到他的修道院（它位于那条河附近，一个名叫皮斯皮尔的地方），他的门徒马卡里乌斯和阿马塔斯在那里居住，他们在他安息时将他安葬了。我等了五天，希望能见到圣安东尼。人们告诉我，他会拜访修道院，有时十天一次，有时二十天一次，有时五天一次——全凭上帝感动他的心去那里，为了那些来到修道院的人的益处。这一次，我们许多人因各种需要聚集在那里。其中有一位来自亚历山大的修士——叶夫洛吉乌斯，还有一个残疾人与他同行。他们来的原因如下。」'
    - type: paragraph
      text:
        ru: 'Этот Евлогий знал преподаваемые в школах науки, но, подвигнутый любовию к Богу и возжелав бессмертия, он отрекся от шума мирского и, раздав все свое имение нищим, оставил себе малую часть денег, потому что не мог работать. Будучи в нерешимости сам с собою оттого, что и в общежитие не хотел вступить, и не считал себя способным к уединению, он нашел на торжище одного увечного, у которого не было ни рук, ни ног, а остался в целости один язык, чтобы умолять проходящих. Евлогий, остановившись, посмотрел на него, помолился Богу и дал Богу такой обет: «Господи! Во имя Твое я возьму этого увечного и буду покоить его до самой смерти его, чтобы ради него спастись и мне. Даруй же мне, Христе, терпения послужить ему». Потом, подошедши к увечному, сказал: «Хочешь ли, друг мой, я возьму тебя в дом и буду покоить?». «О, если бы ты удостоил меня! – отвечал увечный. – Но я не заслуживаю этого». «Так я пойду, – сказал Евлогий, – приведу осла и возьму тебя отсюда». Увечный согласился на это с великою радостию. Евлогий привел осла, посадил на него увечного, привез в свое жилище и стал заботиться о нем, удовлетворяя всем его нуждам.'
        cn: 这个叶夫洛吉乌斯懂得学校里教授的学问，但他受爱神的感动，并渴慕不朽，便舍弃了世俗的喧嚣，将自己所有的财产分给穷人，只给自己留下一小部分钱财，因为他不能劳作。他内心踌躇不定，因为他不愿进入修道团体，也不认为自己有能力独居。他在市集上发现了一个残疾人，他没有手，也没有脚，只剩下一条完好无损的舌头，用来乞求路人。叶夫洛吉乌斯停下脚步，看着他，向上帝祷告，并向上帝许下这样的誓愿：「主啊！奉你的名，我将带走这位残疾人，并服侍他直到他去世，好叫我因他得救。基督啊，求你赐予我耐心服侍他。」之后，他走到残疾人身边，说：「我的朋友，你愿意我把你带回家，服侍你吗？」「哦，但愿您能施恩于我！」残疾人答道，「但我配不上这个。」「那么我去了，」叶夫洛吉乌斯说，「我去牵一头驴来，把你从这里带走。」残疾人带着极大的喜悦同意了。叶夫洛吉乌斯牵来驴，将残疾人扶上驴，带回自己的住处，并开始照料他，满足他所有的需求。
    - type: paragraph
      text:
        ru: 'Увечный пятнадцать лет жил во всем довольстве, потому что Евлогий пекся о нем, как об отце, с любовию омывал его, мазал маслом, угождал ему во всем, носил его своими руками, берег больше, чем он заслуживал, и покоил, как только требовала болезнь. Но по прошествии пятнадцати лет демон вошел в увечного, желая, конечно, и Евлогия отклонить от его обета, и увечного лишить покоя и благодарности к Богу. Увечный восстал на Евлогия, начал поносить его и осыпать ругательствами, говоря ему: «Негодный беглец! Ты, видно, похитил чужие деньги; ты, может быть бывши рабом, обокрал своего господина и за мною хочешь укрыться, как будто принял меня в свое жилище под предлогом благотворительности, и из-за меня хочешь спастись?». Евлогий упрашивал и успокаивал его, говоря: «Нет, друг мой. Не говори этого, а скажи лучше, чем я огорчил тебя, и я исправлюсь». Но увечный с дерзостию говорил: «Не хочу я этих ласк твоих; отнеси меня и брось на торжище, где прежде мне было так спокойно». «Сделай милость, друг мой, – говорил ему Евлогий, – успокойся, что тебя огорчает?». Но увечный, ожесточаясь от гнева, говорил ему: «Не могу выносить твоей коварной и лицемерной ласки. Противна мне эта скудная и голодная жизнь – я хочу есть мясо!». Великодушный Евлогий принес ему и мяса. Увидев его, строптивый увечный опять закричал: «Скучно мне жить с тобою одним – хочу видеть много людей». Евлогий отвечал: «Я сейчас приведу к тебе множество братий». Но тот опять с негодованием говорит: «О, я несчастный! На тебя не могу смотреть, а ты хочешь привести ко мне подобных тебе тунеядцев». И, терзая самого себя, закричал неистовым голосом: «Не хочу, не хочу – хочу на торжище! Брось меня там, где взял». Словом, если бы он имел руки, то не преминул бы лишить себя жизни – в такую ярость привел его демон!'
        cn: '残疾者十五年来生活得称心如意，因为叶夫洛基像照顾父亲一样悉心照料他，慈爱地为他沐浴，为他涂抹油膏，在一切事上满足他，用自己的双手抱他，爱护他甚至超过他所应得的，并按照他的病情所需，使他得到安歇。然而，十五年过去后，魔鬼进入了残疾者的身体，显然是想让叶夫洛基偏离他的誓言，并使残疾者失去平安和对上帝的感恩。


          残疾者反抗叶夫洛基，开始辱骂他，并对他破口大骂，对他说：「你这卑鄙的逃犯！你显然是偷了别人的钱；你或许曾是个奴隶，偷了你主人的东西，并想借我藏身，好像是打着慈善的幌子把我接到你住处，并想借着我得救？」叶夫洛基恳求并安慰他，说：「不，我的朋友。别这么说，你最好告诉我，我哪里让你不高兴了，我就会改正。」但残疾者却蛮横地说道：「我不要你这些恩待；把我抬到市集上扔掉，那里以前我生活得多么平静。」「求你了，我的朋友，」叶夫洛基对他说，「平静下来，什么事让你不高兴了？」但残疾者因怒气而变得刚硬，对他说：「我无法忍受你狡诈虚伪的恩待。我厌恶这种贫乏饥饿的生活——我要吃肉！」慷慨的叶夫洛基也给他带来了肉。看到肉后，那执拗的残疾者又喊叫起来：「我一个人和你住在一起太无聊了——我想见很多人。」叶夫洛基回答道：「我立刻带许多弟兄来见你。」但他又愤慨地说：「哦，我这不幸的人啊！我无法看着你，而你却想带和你一样的懒汉来我这里。」他折磨着自己，用狂暴的声音喊叫道：「不要，不要——我要去市集！把我扔回你捡到我的地方。」简而言之，如果他有手，他一定会毫不犹豫地了结自己的生命——魔鬼竟使他陷入如此狂怒之中！'
    - type: paragraph
      text:
        ru: 'Евлогий после сего пошел к жившим в соседстве подвижникам и спросил их: «Что мне делать? Бросить его? Но я дал обет Богу и боюсь нарушить его. Не бросать? Так он не дает мне покоя ни днем ни ночью. Не знаю, что мне с ним делать». Те отвечают: «Великий (так они называли святого Антония) еще жив – поди к нему. Увечного посади в лодку и, перенесши его в монастырь, там дождись, пока Великий выйдет из пещеры, и предай дело на его суд. Что он тебе скажет, то и сделай: чрез него Бог будет говорить тебе».'
        cn: 此后，叶夫洛吉去了住在附近的苦修者们那里，问他们说：「我该怎么办？抛弃他吗？可是我向神许过愿，害怕违背。不抛弃他吗？他日夜不让我得安宁。我不知道该拿他怎么办。」他们回答说：「伟大的那位（他们如此称呼圣安东尼）还在世——去找他吧。把那个残疾人安置在船上，把他带到修道院，在那里等着，等到伟大的那位从洞穴出来，把这件事交由他裁决。他告诉你什么，就照着做：神会借着他与你说话。」
    - type: paragraph
      text:
        ru: 'Евлогий послушался совета подвижников: обласкал увечного, положил его в пастушью лодку и, отправившись из города ночью, прибыл с ним в монастырь Великого Антония. Случилось же, что Великий пришел в свой монастырь, как рассказывал Кроний, поздно вечером на другой день, одетый кожаною хламидою. Он имел обыкновение призывать к себе Макария и спрашивать его: «Брат Макарий! Не пришли ли сюда какие братия?». Макарий отвечал: «Пришли». «Египтяне или иерусалимляне?» – спрашивал далее Великий. (Надобно знать, что Великий Антоний наперед внушил Макарию: «Когда увидишь, что пришли в монастырь люди не совсем усердные, то говори: “Египтяне”. А когда придут довольно благочестивые и умные, говори: “Иерусалимляне”».) Итак, Великий, по обыкновению, спросил ученика своего, Макария: «Египтяне сии братия или иерусалимляне?». Макарий отвечал: «Смесь». Когда Макарий говорил, что пришли египтяне, то Великий приказывал ему изготовить для них сочиво, накормить их и потом, сотворив о них одну молитву, отпускал их. А когда Макарий говорил: «Иерусалимляне», – святой проводил с ними всю ночь в беседе о спасении души.'
        cn: 欧洛吉乌斯听从了苦修者们的建议：他温柔地对待了伤残者，将他放入牧羊人的船中，夜间从城里出发，与他一同抵达了伟大安东尼的修道院。而碰巧，正如克罗尼乌斯所说，伟大安东尼第二天深夜回到了自己的修道院，身披一件皮制的宽袍。他素来有这个习惯，召见马卡里乌斯并问他：「马卡里乌斯弟兄！可有什幺弟兄们来到这里吗？」马卡里乌斯回答说：「来了。」「是埃及人还是耶路撒冷人？」——伟大的（安东尼）接着问道。（需要知道的是，伟大的安东尼曾预先向马卡里乌斯指示说：「当你看到来到修道院的人并非全然热心时，就说：『埃及人』。而当有相当虔诚和明智的人来时，就说：『耶路撒冷人』。」）因此，伟大的（安东尼）照例问他的门徒马卡里乌斯：「这些弟兄是埃及人还是耶路撒冷人？」马卡里乌斯回答说：「是混合的。」当马卡里乌斯说来的是埃及人时，伟大的（安东尼）就吩咐他为他们准备豆汤，喂饱他们，然后，为他们做一次祷告后，便让他们离开了。而当马卡里乌斯说：「耶路撒冷人」时，这位圣人就会与他们彻夜长谈，论及灵魂的得救。
    - type: paragraph
      text:
        ru: 'В этот вечер, говорит Кроний, Великий сел и пригласил к себе всех. Уже было очень поздно, когда он стал звать: «Евлогий, Евлогий, Евлогий!», хотя ему никто не сказывал, как зовут этого ученого. Три раза произнес он это имя. Но Евлогий не отвечал, думая, что так зовут еще другого кого-нибудь. Антоний в другой раз говорит ему: «Тебе говорю, Евлогий, который пришел из Александрии». Тогда Евлогий сказал: «Что тебе угодно?». Великий говорит ему: «Зачем ты пришел сюда?». Евлогий отвечал: «Тот, Кто открыл тебе мое имя, откроет и дело, по которому я пришел». «Знаю, зачем ты пришел, – говорит ему святой Антоний, – но расскажи при всей братии, чтобы и они услышали».'
        cn: 克罗尼乌斯说，在这个晚上，大圣坐下并邀请所有人到他身边。已经很晚了，他开始呼唤：「欧洛基乌斯，欧洛基乌斯，欧洛基乌斯！」尽管没有人告诉他这位学者叫什么名字。他三次念出这个名字。但欧洛基乌斯没有回应，以为这是在叫别人。安东尼再次对他说：「我对你说的，欧洛基乌斯，就是那位从亚历山大来的。」于是欧洛基乌斯说：「你有什么吩咐？」大圣对他说：「你为何来此？」欧洛基乌斯回答说：「那位向你启示我名字的，也会启示我来此的目的。」「我知道你为何而来，」圣安东尼对他说，「但请在所有的弟兄面前讲述，好让他们也能听见。」
    - type: paragraph
      text:
        ru: 'Повинуясь приказанию Великого, раб Божий Евлогий сказал при всех: «Этого увечного я нашел на торжище, он лежал там без всякого призрения. Сжалившись над ним, я помолился Богу, чтобы Он даровал мне благодать терпения в служении увечному, и взял его к себе, дав обет Христу ходить за ним, чтобы и мне спастись его ради, и ему иметь от меня покой. Вот уже пятнадцать лет, как мы живем вместе, – твоей святости, конечно, все открыто. Но теперь, после стольких лет, не знаю, за какую вину с моей стороны он до крайности оскорбляет меня, и я решился бросить его, потому что он сам принуждает меня к тому. Вот за тем я и пришел к твоей святости, чтобы дал ты мне совет, как я должен поступить, и помолился о мне, ибо он тяжко оскорбляет меня».'
        cn: '顺从伟大的命令，上帝的仆人欧洛基在众人面前说：


          「这个残疾人是我在市集上找到的，他躺在那里，无人看顾。我怜悯他，便向上帝祷告，愿祂赐予我忍耐的恩典来服事这个残疾人，并将他带到我身边，向基督许下诺言要照料他，好让我因他而得救，也让他从我这里得到安宁。至今已有十五年了，我们一直住在一起——对您的圣洁，一切当然都是显明的。但现在，在这么多年之后，我不知道是我有什么过错，他竟然极度地侮辱我，我决定放弃他，因为他自己强迫我这样做。我因此来到您的圣洁面前，希望您给我建议，我该如何行事，并为我祷告，因为他严重地侮辱我。」'
    - type: paragraph
      text:
        ru: 'Великий Антоний самым строгим и суровым голосом говорит ему: «Евлогий! Ты хочешь бросить его? Но Сотворивший его не бросит его. Ты бросишь его, а Бог воздвигнет лучшего, нежели ты, и поднимет его». Замолчал Евлогий и устрашился, услышав это. А Великий Антоний, оставив Евлогия, начинает наказывать словами увечного и громко говорит ему: «Ты, увечный, грязный, не достойный ни земли, ни неба, перестанешь ли восставать на Бога и раздражать брата? Разве не знаешь, что тебе служит Христос? Как дерзаешь говорить так против Христа? Не Христа ли ради он отдал себя в услужение тебе?». Смирив и увечного сими обличениями, Антоний оставил их и занялся беседою со всеми братиями о нуждах каждого из них, потом опять обратился к Евлогию и увечному и сказал им: «Перестаньте враждовать, дети, но пойдите с миром; не разлучайтесь друг с другом, бросьте все огорчения, которые демон посеял между вами, и с чистою любовию возвратитесь в келию, в которой жили вы столько времени. Бог уже посылает за вами. Это искушение наведено на вас сатаною: он знает, что вы оба уже при конце поприща и скоро удостоитесь венцов от Христа – он за тебя, а ты за него. Итак, ни о чем другом не думайте; если Ангел, пришедши за вами, не найдет обоих вас на одном и том же месте, вы лишитесь венцов».'
        cn: '大安东尼以最严厉和严峻的声音对他说：「欧洛基！你想抛弃他吗？但创造他（的）那位不会抛弃他。你会抛弃他，但上帝会兴起一个比你更好的人，并举扬他。」欧洛基沉默了，听到这话便心生惧怕。


          大安东尼于是离开欧洛基，开始用言语训斥那个残疾人，并大声对他说：「你这残疾的、污秽的、不配得天地的人，你难道不再反抗上帝、激怒弟兄了吗？难道你不知道基督服侍你吗？你怎敢如此顶撞基督？他难道不是为了基督才把自己献身来服侍你吗？」


          安东尼用这些责备使残疾人也谦卑下来后，便离开了他们，与众弟兄谈论他们各人的需要。然后又转向欧洛基和残疾人，对他们说：「孩子们，停止彼此为敌吧，而是要平安地同行；不要彼此分离，抛弃所有魔鬼播撒在你们中间的怨恨，并带着纯洁的爱，回到你们已居住了许久的隐修室里。上帝已经差派人来接你们了。这试探是撒旦加诸于你们身上的：他知道你们二人都已临近此世旅程的终点，很快就会从基督那里获得冠冕——他为你，你为他。所以，不要再想别的事情了；如果天使来接你们时，没有在同一个地方找到你们二人，你们就会失去冠冕。」'
    - type: paragraph
      text:
        ru: И вот они поспешно отправились в путь и возвратились в свою келию в совершенной любви. Не прошло и сорока дней, как блаженный Евлогий скончался и отошел ко Господу, а через три дня после него скончался и увечный телом, но крепкий уже душою, предав дух свой в руки Божии.
        cn: 他们就这样急忙动身出发，并在全然的爱中返回自己的修道室。还没有过四十天，那蒙福的欧洛基乌斯就安息并归返主怀了。在他之后三天，那身体残疾但灵魂已坚强的人也安息了，将自己的灵交托在上帝手中。
    - type: paragraph
      text:
        ru: 'Кроний, пробывши несколько времени в Фиваиде, пошел в монастыри александрийские. Случилось, что в это время братия уже совершили по блаженном Евлогии сороковой день, а по увечном третины. Узнав о сем, Кроний изумился и, взявши Евангелие для удостоверения слушавших его, положил оное среди братии и, рассказав, как Великий Антоний наперед узнал о них и о всем случившемся, присовокупил с клятвою: «Я сам был переводчиком при их разговоре, ибо блаженный Антоний не знал по-гречески, а я знаю оба языка (греческий и египетский), потому и переводил блаженным уже по благодати Христовой, Евлогию и увечному, по-гречески слова Великого, а святому, блаженному и Великому Антонию, – по-египетски слова того и другого».'
        cn: 克罗尼奥斯在提拜德待了一段时间后，去了亚历山大的修道院。碰巧那时，弟兄们已经为蒙福的欧洛吉奥斯举行了追思四十日，并为残疾者举行了追思三日。克罗尼奥斯得知此事后感到惊奇，便取过福音书，为了使听他的人确信，把它放在弟兄们中间，并讲述了伟大的安东尼如何预先知道他们和所发生的一切事，然后郑重发誓说：「我亲自是他们交谈时的翻译，因为蒙福的安东尼不懂希腊语，而我懂两种语言（希腊语和埃及语）。因此，我凭着基督的恩典，将伟大的安东尼的话译成希腊语给蒙福的欧洛吉奥斯和残疾者听，并将欧洛吉奥斯和残疾者的话译成埃及语给圣洁、蒙福而伟大的安东尼听。」
  - type: heading2
    text:
      ru: Сказание блаженного Антония
      cn: 至福者安东尼记
    children:
    - type: paragraph
      text:
        ru: 'Кроний рассказывал: «Антоний Великий в ту ночь, как отпустил блаженного Евлогия по примирении с увечным, рассказал нам следующее: “Целый год молился я, чтобы мне показано было место праведных и грешных. И вот увидел я огромного черного великана, который поднимался до облаков и досягал руками до неба; под ним было озеро величиною с море. Потом увидел я души человеческие; они летали как птицы и, которые перелетали через руки и голову великана, все охраняемы были Ангелами, а которых он ударял своими руками, те падали в озеро. И пришел ко мне голос: те, которых видишь ты перелетающими через голову и руки великана, – это души праведников, Ангелы охраняют их в раю, а те, которых черный великан ударяет руками, погружаются в ад, потому что увлеклись пожеланиями плоти и предались памятозлобию”».'
        cn: '克罗尼讲述说：「安东尼大帝在那个夜晚，当他与那个残疾人达成和解并送走蒙福的欧洛基乌斯之后，对我们讲述了以下事情：

          『我整整一年都在祈祷，希望能够向我显明义人与罪人的所在之地。于是，我看见一个巨大的黑色巨人，他高耸入云，双手可达天际；在他下方，有一个大如海洋的湖泊。之后，我看见人类的灵魂；它们像鸟一样飞翔，凡是飞过巨人手臂和头部的，都被天使守护着；而那些被他用双手击打的，就都坠入了湖中。于是有声音对我说：你所看见的那些飞过巨人头部和手臂的，是义人的灵魂，天使在乐园里守护着他们；而那些被黑色巨人用双手击打的，则沉入地狱，因为他们沉溺于肉体的欲望，并屈服于怀恨之心。』」'
  - type: heading2
    text:
      ru: О Павле Простом
      cn: 关于简朴者保罗
    children:
    - type: paragraph
      text:
        ru: 'Расскажу теперь, что я слышал от святого раба Христова Иеракса, также от Крония и многих других братий. Некто Павел, сельский земледелец, чрезвычайно незлобивый и простой нравом, сочетался браком с женою весьма красивою, но бесчестного поведения. Она уже давно грешила, только муж не знал этого. Однажды, пришедши с поля домой внезапно, он открыл ее связь с человеком посторонним. Промысл обратил сей случай во благо для Павла. Он оставляет ту жену, потом, никому не сказав ни слова, обходит восемь монастырей и, пришедши к блаженному Антонию, стучится в двери. Антоний, вышедши, спрашивает его: «Что тебе нужно?». Павел отвечает ему: «Хочу быть монахом». «Не можешь, – сказал Антоний, – тебе уже шестьдесят лет; ступай лучше опять в свое селение, работай и живи в трудах, благодаря Бога: ты не можешь перенести скорбей пустыни». Старец опять отвечал: «Я все буду делать, чему ты научишь меня». «Я сказал тебе, – продолжал Антоний, – что ты стар и не можешь быть монахом – ступай отсюда. Если же тебе хочется быть монахом, то поди в общежительный монастырь, где много братий, которые могут снисходить к немощам твоим. А я здесь живу один, ем чрез пять дней, и то не досыта».'
        cn: '我现在就讲我从基督的圣仆耶拉克斯、克罗尼厄斯以及许多其他弟兄们那里听到的事。


          有一位名叫保罗的乡村农夫，性情极其不怀恶意且纯朴，他娶了一位非常美丽的妻子，但她行为不检。她早已犯了罪，只是丈夫并不知道。有一天，他突然从田里回到家中，发现了她与一个外人的私情。神的护理使这一事件成了保罗的益处。他离开了那个妻子，之后，一句话也没对任何人说，走了八座修道院，最终来到蒙福者安东尼那里，敲门。安东尼出来，问他：「你需要什么？」保罗回答他：「我想成为一名修士。」「你不能，」安东尼说，「你已经六十岁了；你最好回到你的村庄，劳作，并在辛劳中生活，感谢神：你无法承受旷野的苦难。」这位老人又回答说：「你教我什么，我都会做。」「我已经告诉你了，」安东尼继续说，「你年纪大了，不能成为修士——离开这里吧。如果你真的想成为修士，那么就去一座集体修道院，那里有许多弟兄们，他们可以容忍你的软弱。而我这里独自居住，五天才吃一次饭，而且也吃不饱。」'
    - type: paragraph
      text:
        ru: 'Сими и подобными словами Антоний отгонял от себя Павла и, чтобы не пустить его к себе, запер дверь и три дня не выходил из-за него даже для своих нужд. А старец все стоял и не отходил. На четвертый день Антоний, по необходимости отворив дверь, вышел и, увидев опять Павла, сказал ему: «Отойди отсюда, старец. Чего ты от меня домогаешься? Нельзя тебе здесь остаться». «Невозможно мне умереть в другом месте, как здесь», – отвечал Павел. Посмотрев на него и видя, что с ним ничего нет съестного: ни хлеба, ни воды и ничего другого – и что он уже четвертый день остается совсем без пищи, Великий Антоний подумал: «Как бы он, не привыкши поститься, не умер и не положил пятна на душу мою» – и после этого принял Павла к себе, сказав ему: «Можешь спастись, если будешь послушен и станешь делать все, что услышишь от меня». «Все буду делать, что ни прикажешь», – отвечал Павел.'
        cn: 借着这些以及类似的话语，安东尼将保罗从自己身边赶走，并且为了不让他进来，锁上了门，三天之内都没有因他而外出，甚至是为了自己的需要。然而这位长者一直站着，并且没有离开。第四天，安东尼因需要而打开门，走了出来，并且再次看见保罗时，对他说：「离开这里，长者。你到底想从我这里得到什么？你不能留在这里。」「我不可能在别处死去，除非在这里。」——保罗回答说。看着他，并且看到他没有任何可吃的——无论是面包、水，还是其他任何东西——而且他已经第四天完全没有食物了，大安东尼心想：「他若是不习惯禁食，万一死了，岂不玷污了我的灵魂？」在这之后，他就接纳了保罗，对他说：「如果你顺服，并且照我所说的去做，你就能得救。」「凡你所吩咐的，我都会做。」——保罗回答说。
    - type: paragraph
      text:
        ru: 'И начал Антоний в следующие дни вести такую суровую жизнь, какой не вел и в ранней юности. Искушая Павла, он сказал ему: «Стой здесь и молись до тех пор, пока я не приду и не принесу тебе работу». Потом, ушедши в пещеру, смотрел на него в окно и видел, как он, палимый зноем, простоял на том месте целую неделю неподвижно. Затем, намочив пальмовых ветвей, сказал ему: «Возьми и плети веревку вот так, как я». Старец плел до девятого часа и с великим трудом сплел веревку в пятнадцать локтей длиною. Посмотрев на плетенье, Великий Антоний был недоволен им и сказал Павлу: «Дурно сплел, расплети и начни снова». Между тем Павел уже четыре дня ничего не ел – в таких преклонных летах! Антоний изнурял так Павла для того, чтобы этот старец, вышедши из терпения, убежал от него и бросил монашество. Но тот расплел веревку и начал плести ее снова из тех же самых ветвей, хотя это было уже труднее прежнего, потому что ветви крутились от первого плетения.'
        cn: 安东尼便在接下来的日子里，过着他年轻时从未有过的、如此严峻的生活。为了考验保罗，他对保罗说：「你站在这里祈祷，直到我来给你带来活儿。」随后，他回到洞穴，从窗口望着他，看见他被酷暑炙烤，在那个地方一动不动地站了一整周。接着，他浸湿了一些棕榈枝，对保罗说：「拿去，像我这样编绳子。」这位长老编织到第九个时辰，历尽艰辛才编了一条十五腕尺长的绳子。看了看编好的绳子，伟大的安东尼不满意，便对保罗说：「你编得不好，拆了重新开始。」与此同时，保罗已经四天没吃东西了——何况他已是如此高龄！安东尼如此折磨保罗，是为了让这位长老失去耐心，逃离他，放弃修道生活。但保罗拆开了绳子，并用同样的枝条重新开始编织，尽管这比之前更困难了，因为枝条在第一次编织后已经卷曲。
    - type: paragraph
      text:
        ru: 'Антоний Великий, видя, что старец и не пороптал, и не помалодушествовал, и нисколько не оскорбился, даже вовсе не изменился в лице, сжалился над ним и при захождении солнца сказал ему: «Не съесть ли нам, отец, кусок хлеба?». «Как тебе угодно, авва», – отвечал Павел. Это еще боле тронуло Антония, что он не побежал тотчас же, как услышал о пище, но отдал на его волю. «Так поставь стол», – сказал Антоний старцу. Он сделал это. Антоний принес и положил на стол четыре сухих хлебца, унций по шесть каждый, и размочил для себя один, а для него три; потом начал петь псалом, какой знал, и, пропев его двенадцать раз, столько же раз молился, чтобы и в этом испытать Павла.'
        cn: 圣安东尼，看到这位长老既没有抱怨，也未曾气馁，丝毫没有感到被冒犯，甚至脸色一点都没有变，便怜悯他，并在日落时对他说：「父亲，我们吃点面包好吗？」保罗回答说：「随您所愿，阿爸。」这更让安东尼感动，他一听到食物就立刻跑过去，而是听凭他的意愿。安东尼对长老说：「那么，摆好桌子。」他照办了。安东尼拿来并放到桌上四块干面包，每块六盎司，并为自己泡软了一块，而为他泡软了三块；接着开始唱他所知道的诗篇，唱了十二遍之后，又同样地祈祷了十二次，为的是在这件事上也考验保罗。
    - type: paragraph
      text:
        ru: 'Вместе с Великим молился и старец, и еще усерднее его. После двенадцати молитв Антоний сказал ему: «Пойди ешь». Но, как только он сел за стол и стал брать хлеб, Антоний сказал ему: «Сиди и не ешь до вечера, а только смотри на хлеб». Наступил вечер, а Павел все не ел. Тогда Антоний сказал ему: «Вставай, помолись и ложись спать». Павел так и сделал. В полночь Антоний разбудил его на молитву и продолжал молитвы до девятого часа дня. Приготовив потом трапезу, он опять пригласил к ней Павла, и они сели есть уже поздно вечером. Антоний Великий, съевши один хлебец, другого не брал, а старец, евши медленнее, не успел еще съесть и начатого им хлебца. Дождавшись, пока он кончит, Антоний сказал ему: «Возьми и другой хлебец». «Если ты будешь есть, то и я, – отвечал Павел, – а если ты не будешь, то и я не буду». «Для меня довольно, – сказал ему Антоний, – я монах». «И для меня довольно, – отвечал Павел Великому, – и я хочу быть монахом». Тогда они встали, и Антоний прочитал двенадцать молитв и пропел двенадцать псалмов. После молитв они уснули немного первым сном, потом опять встали и пели псалмы от полуночи до самого дня. Затем Антоний послал Павла обойти пустыню, сказав ему: «Через три дня приходи сюда». Сделав это и застав у Антония несколько братий, Павел спросил его, что прикажет ему делать? Антоний отвечал: «Ни слова не говоря, служи братиям и ничего не вкушай, пока братия не отправятся в путь». И так целых три недели Павел не вкушал ничего. Братия спросили его: «Почему ты молчишь?». Павел ничего не отвечал. Тогда Антоний сказал ему: «Что ты молчишь? Поговори с братиями». И он стал говорить.'
        cn: 老修士与大安东尼一同祷告，而且比他更为虔诚。在十二次祷告之后，安东尼对他说：「你去吃吧。」然而，他刚一坐到桌边，正要拿面包时，安东尼便对他说：「坐着，直到晚上都不要吃，只管看着面包。」夜幕降临，而保罗始终没有进食。于是安东尼对他说：「起来，祷告，然后去睡觉。」保罗照做了。半夜时分，安东尼叫醒他去祷告，并继续祷告直到白天的第九个小时。之后，他准备了餐食，再次邀请保罗一同进餐，于是他们很晚才坐下来吃晚饭。大安东尼吃完一个面包后，便没有再拿第二个；而老修士吃得慢些，甚至还没有吃完他已经开始的那个面包。等待他吃完后，安东尼对他说：「再拿一个面包吧。」保罗回答说：「如果你吃，我也吃；如果你不吃，我也不吃。」「对我来说，已经够了，」安东尼对他说，「我是一名修士。」「对我来说，也已经够了，」保罗回答大安东尼说，「我也想成为一名修士。」于是他们站起身，安东尼念了十二篇祷告词，并唱颂了十二篇诗篇。祷告之后，他们小睡了一会儿，作了头一次睡眠，然后又起来，从半夜一直唱颂诗篇直到天明。随后安东尼派保罗去巡视沙漠，对他说：「三天后到这里来。」照此做完之后，保罗发现有几位弟兄在安东尼那里，他便问安东尼吩咐他做什么。安东尼回答说：「一句话也不说，服侍弟兄们，什么都不要吃，直到弟兄们上路。」于是保罗整整三周没有进食任何东西。弟兄们问他：「你为什么不说话？」保罗什么也没有回答。于是安东尼对他说：「你为什么沉默不语？和弟兄们说说话吧。」他便开始说话了。
    - type: paragraph
      text:
        ru: 'Однажды Павлу принесли сосуд меду, и Антоний сказал ему: «Разбей сосуд, пусть мед весь вытечет». Он так и сделал. «Собери опять мед», – сказал Антоний. И это было сделано. Потом Антоний говорит ему: «Собери мед в другой раз в раковину – так, чтобы не было в нем никакого сору». Еще велел ему Антоний целый день черпать воду. В другой раз раздрал у него одежду и приказал сшить ее, и тот сшил снова.'
        cn: 有一次，有人给保罗拿来一罐蜂蜜，安东尼对他说：「把罐子打碎，让所有的蜂蜜都流出来。」他照做了。安东尼说：「再把蜂蜜收集起来。」这也做到了。然后安东尼对他说：「再把蜂蜜收集到贝壳里，这样里面就不会有任何杂质了。」安东尼还命令他整天打水。另一次，安东尼撕破了他的衣服，并吩咐他缝好，他就重新缝好了。
    - type: paragraph
      text:
        ru: 'Сей муж стяжал такое послушание, что ему дана была от Бога власть изгонять бесов. Великий Антоний, видя, что старец ревностно подражает ему во всяком роде подвижничества, сказал ему: «Смотри, брат! Если ты можешь ежедневно так подвизаться, то оставайся со мною». Павел отвечал: «Может быть, ты покажешь мне со временем и больше что-нибудь – не знаю, но, что доселе ты делал при мне, все то и я делаю легко». На другой день после сего Антоний сказал Павлу: «Во имя Господа, ты уже стал монахом». Уверившись наконец вполне, что раб Христов Павел, хотя весьма прост и не учен, но совершен душою, блаженный и Великий Антоний спустя несколько месяцев, при содействии благодати Божией, устроил ему особую келию поприща за три или за четыре от своей и сказал: «Вот ты, при помощи Христовой, стал уже монахом; живи теперь один, чтобы испытать искушение и от демонов».'
        cn: '这位男子获得了如此的顺服，以至于他被神赐予了驱逐邪魔的权柄。大安东尼看到这位长老在各种禁欲苦修中热切地效法他，便对他说：「听着，兄弟！如果你每天都能如此苦修，就和我住在一起吧。」保罗回答说：「或许你过一段时间会向我展示更多东西——我不知道，但凡是到目前为止你在我面前所做的，那些我也都轻易地做到了。」


          此事发生后的第二天，安东尼对保罗说：「奉主的名，你已经成为了一名修士。」蒙福的大安东尼终于完全确信，基督的仆人保罗尽管非常朴素且没有学识，但灵魂是完美的；几个月后，在神的恩典的协助下，他为保罗建造了一个独立的修士小室，距离自己的小室三或四个波普里夏（поприща），并说：「瞧，你借着基督的帮助，已经成为了一名修士；现在独自居住吧，以便经历来自邪魔的试探。」'
    - type: paragraph
      text:
        ru: 'Прожив год в уединении, Павел Простый за высокое совершенство в добродетели подвижнической удостоился дара изгонять демонов и целить всякие болезни. Однажды привели к блаженному Антонию в крайней степени бесноватого юношу: в него вселился главный, лютейший демон, который даже изрыгал хулы на небо. Антоний Великий, посмотрев на юношу, сказал приведшим его: «Это не мое дело: я не получил еще власти над сим главным чином демонов. Этот дар имеет Павел Простый». Сказав сие, блаженный Антоний вместе с ними пошел к доблестному Павлу и, пришедши к нему, сказал: «Авва Павел! Изгони демона из этого человека, дабы он здравым возвратился в дом свой и славил Господа». Павел спросил его: «А ты что?». «Мне некогда, – отвечал Антоний, – у меня есть другое дело», – и, оставив у него отрока, ушел в свою келию. Незлобивый старец встал, совершил усердную молитву и, призвав бесноватого, говорит: «Авва Антоний повелевает тебе выйти из сего человека, чтобы он, выздоровев, славил Господа». Диавол с ругательством вскричал: «Не выйду!». Павел, взяв свою милоть[15], стал бить ею бесноватого по спине, говоря: «Выдь, авва Антоний повелевает». Но демон стал еще сильнее поносить Павла вместе с Антонием: «Старые вы тунеядцы, сонливые, ненасытные, никогда не довольные своим! Что общего у нас с вами? Что вы мучите нас?». Наконец Павел сказал: «Выдь, или я пойду и скажу Христу; если ты не выйдешь, клянусь Иисусом, я тотчас пойду скажу Ему, и тогда горе тебе!». Лютый демон начал поносить и Иисуса, продолжая кричать: «Не выйду!».'
        cn: '在独居一年后，帕维尔·普罗斯特因其在苦修美德上的高度完善，蒙赐驱逐魔鬼和治愈各种疾病的恩典。


          一天，有人将一个被魔鬼附体极其严重的年轻人带到蒙福的安东尼那里：一个主要的、最凶猛的魔鬼附在他身上，它甚至口出亵渎上帝的话语。大安东尼看着这个年轻人，对带他来的人说：「这不是我的事：我还没有获得制伏这种主要魔鬼的权柄。帕维尔·普罗斯特拥有这份恩典。」说完这话，蒙福的安东尼和他们一起走到勇敢的帕维尔那里，来到他那里后，说道：「阿爸帕维尔！请将魔鬼从这个人身上驱逐出去，好让他健康地回到家中，并颂扬主。」帕维尔问他：「那你呢？」「我没空，」安东尼回答说，「我另有要事。」说完，就把那个孩子留在他那里，回到了自己的隐修室。


          这位无恶意的长老站起身来，虔诚地祈祷，然后唤来那个被魔鬼附体的人，说：「阿爸安东尼命令你从这个人身上出来，好让他康复后颂扬主。」魔鬼咒骂着大喊：「我不会出去！」帕维尔拿起他的兽皮大氅[15]，开始用它鞭打被魔鬼附体之人的背部，说道：「出来！阿爸安东尼命令你！」但魔鬼更加猛烈地咒骂帕维尔和安东尼：「你们这些老而无用的懒虫，昏昏欲睡，贪得无厌，永不满足！我们与你们有什么相干？你们为何折磨我们？」最后，帕维尔说：「出来！否则我就去告诉基督；如果你不出来，我凭着耶稣起誓，我立刻就去告诉祂，那时你有祸了！」那凶猛的魔鬼开始咒骂耶稣，继续大喊：「我不会出去！」'
    - type: paragraph
      text:
        ru: 'Разгневавшись на демона, святой Павел вышел из своей келии в самый полдень. (В это время, особенно в этих местах, бывает у египтян такой жар, как будто в пещи вавилонской.) И стал он на горе, как неподвижный столп под открытым небом, и молился так: «Иисусе Христе, распятый при Понтийском Пилате! Ты видишь, что я не сойду с камня, не буду ни есть, ни пить до смерти, если Ты не услышишь меня теперь, и не изгонишь беса из сего человека, и не освободишь его от духа нечистого». Еще взывал простой и смиренномудрый Павел к Иисусу, еще не окончились слова чистых уст его, как бес вскричал внизу у келии: «Выйду, меня насильно изгоняют; оставляю этого человека и больше не приду к нему; смирение и простота Павла изгоняют меня, и я не знаю, куда идти». Тотчас бес вышел и, превратившись в огромного дракона[16]локтей[17]в семьдесят, ушел в Чермное море.'
        cn: 圣保罗对魔鬼发怒，正午时分走出他的隐修室。(在这时间，尤其是在这些地方，埃及人会感到酷热，如同巴比伦的火窑一般。)他站在山上，如同露天之下的一根不动的柱子，如此祷告说：「耶稣基督，你在本丢彼拉多手下被钉十字架！你看见，我不会离开这块石头，直到我死，都不会吃喝，除非你现在听允我，并且把这人身上的鬼驱逐出去，并使他脱离污秽之灵。」纯朴而谦卑的保罗还在向耶稣呼求，他圣洁的口中的话语尚未说完，那鬼就在隐修室下面喊叫起来：「我要出去，我被人强行赶走；我离开这人，不再来找他了；保罗的谦卑和纯朴把我赶走，我不知道该去哪里。」恶魔立刻就出去了，并且，变成一条巨大的龙[16]七十肘[17]，去了红海。
    - type: paragraph
      text:
        ru: Так исполнилось сказанное Духом Святым:«Явленную веру возвещает праведный»(Притч. 12, 17); и в другом месте:«На кого воззрю, – глаголет Господь, –токмо на кроткого и молчаливого и трепещущого словес Моих»(Ис. 66, 2). (Обыкновенно низшие демоны изгоняются мужами высокими в вере, а начальные демоны прогоняются смиренными.) Вот чудеса простого и смиренномудрого Павла! Весьма много совершил он и других, еще больших чудес. Братия все звали его ПрОстым.
        cn: 这样就应验了圣灵所说的话：「义人宣告显明的信实」（箴言 12:17）；又在另一处说：「我所看顾的，——上主说，——唯独是那谦和安静，并因我的话语而战兢的人。」（以赛亚书 66:2）。（通常，较低级的鬼魔是被信心高深的男子赶出的，而那些掌权的鬼魔则被谦卑的人赶走。）这就是质朴而谦卑的保罗所行的奇迹！他还行了许多其他更大奇迹。弟兄们都称他为朴素者。
  - type: heading2
    text:
      ru: О Пахоне
      cn: 关于帕霍姆
    children:
    - type: paragraph
      text:
        ru: 'Жил в скиту некто по имени Пахон; ему было уже около семидесяти лет от роду. Случилось, что, по навождению демонскому, мучила меня блудная похоть, так что я не в силах был бороться с помыслами и ночными видениями. Сильно гонимый страстию, я от этого искушения уже готов был уйти из пустыни; между тем не сказывал об этом соседним отцам, ни даже учителю своему Евагрию, но тайно отправился в самую глубину пустыни и там пятнадцать дней провел в беседе с отцами скита, состарившимися в пустынножительстве. Между ними встретил я и Пахона. Заметив в нем более искренности и духовной опытности, я осмелился открыть ему свое сердце. И вот что сказал мне этот святой:'
        cn: 在隐修院里住着一个人，名叫帕洪；他当时大约七十岁。有一次，受魔鬼引诱，我被淫欲所困扰，以至于我无力对抗那些意念和夜间的幻象。我强烈地被这情欲所折磨，几乎就要因这诱惑而离开旷野了。然而我没有把这事告诉邻近的教父们，甚至也没有告诉我的老师厄瓦格里，而是秘密地前往旷野的最深处，在那里与那些在隐修生活中白发苍苍的隐修院教父们交谈了十五天。在他们当中，我遇到了帕洪。注意到他身上更多的真诚和属灵经验，我敢于向他敞开我的心。这位圣者对我这样说：
    - type: paragraph
      text:
        ru: '«Не смущайся от сего искушения. Это терпишь ты не от беспечности. В пользу твою говорят место, скудость в необходимых потребностях и невозможность видеть здесь женщин. Напротив, это навел на тебя враг за твою ревность к добродетели. Брань блудная – троякого рода: иногда нападает на нас плоть, преданная неге; иногда страсти возникают в нас от помыслов, а иногда сам диавол восстает на нас из зависти. Я узнал это из многих наблюдений. Вот я, как видишь, старый человек: сорок лет живу в этой келии и пекусь о своем спасении, но, несмотря на мои лета, доселе еще подвергаюсь искушениям». И здесь он с клятвою присовокупил: «В продолжение двенадцати лет, после того как я достиг пятидесятилетнего возраста, ни дня ни ночи не проходило, чтобы враг не нападал на меня. Подумав, что Бог отступил от меня и потому демон так мучит меня, я решился лучше умереть безрассудно, нежели постыдным образом предаться сладострастию плоти, и, вышедши из своей келии, пошел по пустыне и нашел пещеру гиены. Целый день лежал я в ней нагой, чтобы звери при выходе из пещеры пожрали меня. И вот, как настал вечер и, по писаному,«солнце позна запад свой. Положил еси тму, и бысть нощь, внейжепройдут вси зверие дубравнии, скимни рыкающии восхитити и взыскати от Бога пищу себе»(Пс. 103, 19–21), самец и самка, выходя в это время из пещеры, с ног до головы обнюхивали меня и облизывали. Я уже думал, что буду съеден, но они оставили меня. Итак, пролежав целую ночь и не быв съеден, я уверился, что, конечно, помиловал меня Бог, и тотчас возвратился в свою келию.'
        cn: 「不要为此试探而困扰。你承受这些并非由于疏忽。有利于你的情况有此地、生活必需品的匮乏以及在此地无法见到女性。相反，这乃是仇敌因你对美德的热忱而加诸于你的。淫乱的争战分为三种：有时是耽于逸乐的肉体攻击我们；有时是情欲因思想而由内而生，有时是魔鬼本身出于嫉妒而与我们作对。我从许多观察中得知了这一点。你看，我是一个老人了：在这间隐修室里住了四十年，并为自己的得救而操劳，然而，尽管我年事已高，至今仍旧遭受试探。」他在此处又起誓补充说：「在我达到五十岁之后，连续十二年，没有一天一夜不是仇敌在攻击我。我心想，上帝已经离弃了我，所以魔鬼才这样折磨我，我决定宁愿鲁莽地死去，也不愿以可耻的方式屈服于肉体的淫欲，于是我走出隐修室，沿着旷野行走，找到了一处鬣狗的洞穴。我赤身裸体地躺在里面一整天，好让野兽出洞时把我吞食。你看，当夜晚降临，正如经上所记：「太阳知道它的西沉之处。你安置了黑暗，就成了夜晚，林中所有的野兽都在其中游荡，少壮狮子咆哮着抓取猎物，并向上帝寻求食物。」(诗篇 103:19-21)，一对雄性和雌性鬣狗，此时正从洞穴中出来，从头到脚地嗅我、舔我。我原以为自己会被吃掉，但它们却离开了。于是，我躺了一整夜而未被吞食，便确信上帝果然怜悯了我，随即回到了我的隐修室。
    - type: paragraph
      text:
        ru: 'Демон же, переждав несколько дней, опять восстал на меня еще сильнее прежнего, так что я едва не произнес хулы на Бога. Он принял вид ефиопской девицы, которую я видел в молодости своей, когда она летом собирала солому. Мне представилось, что она сидит у меня, и демон до того довел меня, что я думал, будто уже согрешил с нею. В исступлении я дал ей пощечину – и она исчезла. Поверь мне, два года не мог я истребить нестерпимого зловония от руки своей. Я стал поэтому унывать еще более и наконец в отчаянии пошел скитаться по пустыне. Нашедши небольшого аспида, я взял его и стал подносить к своему телу, чтобы, как он ужалит меня, умереть мне. Но, сколько я ни подносил его, он не ужалил меня, промышлением благодати. После сего услышал я говоривший моему сердцу голос: “Иди Пахон, подвизайся. Я для того попустил демону такую власть над тобою, чтобы ты не возмечтал, будто можешь победить демона сам, но, чтобы, познав свою немощь, ты никогда не уповал на свое житие, а всегда прибегал к помощи Божией”. Успокоенный сим гласом, я возвратился в свою келию. С того времени ощутил я в себе бодрость и, не тревожимый более сею бранию, провожу, после борьбы, остальные дни свои в мире. Постыжденный демон, увидя мое презрение к нему, уже не приближался ко мне». Сими словами святой Пахон укрепил меня на борьбу с сатаною, сделал более бодрым на подвиги, научил легко выдерживать брань с демоном блуда и, отпуская, велел мне всегда хранить мужество.'
        cn: 魔鬼则等待了几天之后，再次攻击我，比以前更加猛烈，以至于我差点就亵渎了上帝。它化作了一个埃塞俄比亚的少女，我年轻时见过她，那时她在夏天收集秸秆。我似乎看到她坐在我身旁，魔鬼甚至把我引诱到那种地步，以至于我以为自己已经和她犯了罪。在狂乱中我给了她一巴掌——她就消失了。相信我，两年时间里我都无法消除我手上那令人难以忍受的恶臭。因此我更加沮丧，最终在绝望中走到沙漠中流浪。找到一条小毒蛇，我抓起它并开始将它凑近我的身体，好让它咬我之后，我就能死去。但是，无论我怎么凑近它，它都没有咬我，这是借着恩典的护佑。此后，我听到一个声音对我的心说：「去吧，帕洪，去修行吧。我之所以允许魔鬼对你拥有如此的权势，是为了让你不要幻想自己能够独自战胜魔鬼，而是为了让你认识到自己的软弱，从而永远不要信赖自己的修行，而要总是寻求上帝的帮助。」这个声音让我平静下来，我回到了自己的隐修室。从那时起，我感到自己内心充满活力，并且不再被这场争战所困扰，在这场斗争之后，我安宁地度过了余生。那受辱的魔鬼，看到我藐视它，就不再靠近我了。」圣帕洪用这些话坚定了我与撒旦斗争的决心，使我在修行中更加振奋，教导我如何轻松地抵御淫欲魔鬼的攻击，并在送我离开时，嘱咐我务必常常保持勇气。
  - type: heading2
    text:
      ru: О Стефане
      cn: 论司提反
    children:
    - type: paragraph
      text:
        ru: 'Некто Стефан, родом из Ливии, около шестидесяти лет жил между Мармарикою и Мареотом. Достигши высокого совершенства в подвижничестве и в познании сердца человеческого, он удостоился такой благодати, что всякий, у кого была какая-нибудь печаль, побеседовав с ним, отходил от него без печали. Он был известен и блаженному Антонию и жил еще в мое время, но я не видел его по дальности пути. Видели же его ученики святого Аммония и Евагрия и рассказывали мне о нем следующее: «Пришли мы к нему в такое время, когда у него открылась в самом опасном месте ужасная болезнь – рак. При нас и лечил его какой-то врач. Предоставив в его распоряжение больные части тела, святой муж работал руками, плел корзины и разговаривал с нами. При отсечении зараженных частей он оставался неподвижен и показывал такое терпение, как будто резали чье-нибудь чужое тело или как будто у него отсекли не члены, а волосы: казалось, он совсем не чувствовал боли. Так укрепляла его помощь Божия! Когда же мы об этом скорбели и недоумевали, как муж такой жизни впал в такую болезнь и подвергся таким врачебным мерам, блаженный Стефан, уразумев наши помыслы, сказал нам: “Не соблазняйтесь этим, дети; Бог ничего не делает ко вреду, но все для полезной цели. Видно, Господь нашел сии члены достойными наказания, а в таком случае лучше им здесь пострадать, нежели по отшествии из сей жизни”. Так вразумив нас и этими словами укрепив в терпении, он научил нас мужественно переносить скорби». Я с намерением рассказал это для того, чтобы мы не почитали странным, когда видим, что некоторые святые подвергались столь тяжким недугам.'
        cn: '某位名叫司提反的修士，籍贯利比亚，在马尔马里卡和马雷奥蒂斯之间居住了约六十年。他在苦修和对人心的洞察上达致高度的完善，蒙受了如此恩典，以至于任何怀有忧愁的人，与他交谈后，便离他而去，心中再无忧愁。他甚至为蒙福的安东尼所知，在我所处的时代依然在世，但我因路途遥远而未曾见到他。然而，圣安蒙和厄瓦格里乌斯的门徒们曾见到他，并向我讲述了关于他的以下事情：


          「我们去见他时，正是他身上最危险之处生出可怕疾病——癌症之时。在我们面前，一位医生正在为他治疗。圣者将他身体患病的部分交由医生处理，同时他本人则用双手劳作，编织着篮子，并与我们交谈。当受感染的部分被切除时，他纹丝不动，并展现出这样的耐心，仿佛被切割的是别人的身体，又仿佛从他身上切掉的不是肢体，而是毛发：他似乎完全没有感到疼痛。神的帮助如此坚固了他！当我们为此感到悲伤，并疑惑不解为何这样一位圣者会罹患如此疾病并遭受如此医治手段时，蒙福的司提反洞察了我们的心思，对我们说：『孩子们，不要因此跌倒；上帝所做的一切绝非为了伤害，而是为了有益的目的。很明显，主认为这些肢体值得惩罚，在这种情况下，它们在此受苦，总比离开此生后受苦更好。』他如此教诲我们，并用这些话语坚固了我们的忍耐，教导我们勇敢地忍受苦难。」


          我特意讲述了这件事，是为了让我们在看到一些圣人遭受如此重疾时，不会觉得奇怪。'
  - type: heading2
    text:
      ru: О Валенте
      cn: 关于瓦连特
    children:
    - type: paragraph
      text:
        ru: Был некто Валент, родом из Палестины, по духу гордый, как коринфянин (коринфян и блаженный апостол Павел в Послании своем укорял за порок гордости:«И вы разгордесте»(1Кор. 5, 2)). Этот Валент долго жил с нами в пустыне, много изнурял плоть свою и по жизни был великим подвижником, но потом, обольщенный духом самомнения и гордости, впал в крайнее высокомерие, так что сделался игралищем бесов. Надмившись пагубною страстию самомнения, он стал мечтать наконец в самообольщении, что с ним беседуют Ангелы и при всяком деле служат ему.
        cn: 有一个名叫瓦伦特的人，来自巴勒斯坦，他心中骄傲，如同哥林多人一样（蒙福的使徒保罗在他的书信中曾责备哥林多人犯了骄傲的罪：「你们竟然自高自大！」（哥林多前书 5:2））。这位瓦伦特曾与我们一同在旷野生活了很久，极大地苦待自己的肉体，并且在他的一生中曾是一位伟大的苦修者。但后来，他被自负和骄傲之灵所迷惑，陷入了极度的傲慢，以至于成了魔鬼的玩物。因那有害的自负情欲而自高自大，他最终在自我欺骗中开始幻想，认为有天使与他交谈，并在凡事上都服侍他。
    - type: paragraph
      text:
        ru: 'Вот что рассказывали о нем люди, хорошо его знавшие. Однажды в глубокий вечер, когда уже было темно, он плел корзины и уронил шило на пол. Долго он не находил его, как вдруг, по навождению бесовскому, явился в келии зажженый светильник, с ним нашел он потерянное шило. Это дало новую пищу его надмению; в упоении гордости подвижник еще более возмечтал о себе, так что стал наконец презирать и самые Таины Христовы. Однажды какие-то странники принесли в церковь для братии плодов; блаженный Макарий, пресвитер наш, разослал их по келиям, по горсти каждому брату, в том числе и этому Валенту. Получив плоды, Валент обругал и избил принесшего и сказал ему: «Ступай скажи Макарию: “Я не хуже тебя, что ты посылаешь мне благословение”». Узнав из сего, что Валент находится в обольщении, Макарий через день пошел увещевать его и сказал ему: «Брат Валент! Ты в обольщении. Перестань и помолись Богу». Но Валент не внимал увещаниям отца Макария. А как тот не послушал убеждений его, то он и ушел в сильной скорби о падении Валента. Диавол же, уверившись, что Валент совершенно предался обману его, принимает на себя вид Спасителя и ночью приходит к нему окруженный сонмом демонов во образе Ангелов с зажженными светильниками. И вот является огненный круг, и в средине его Валент видит как бы Спасителя. Один из демонов, в образе Ангела, подходит к нему и говорит: «Ты благоугодил Христу своими подвигами и свободою жизни, и Он пришел видеть тебя. Итак, ничего другого не делай, а только, ставши вдали и увидев Его, стоящего среди всего сонма, пади и поклонись Ему, потом иди в свою келию». Валент вышел и, увидев множество духов со светильниками на расстоянии около стадии, пал и поклонился антихристу. Обольщенный до того простер свое безумие, что, пришедши на другой день в церковь, сказал при всей братии: «Я не имею нужды в приобщении: сегодня я видел Христа».'
        cn: '认识他的人是这样讲述他的。一天深夜，天色已暗，他正在编织篮子，不慎将锥子掉落在地。他久寻不着，突然，在魔鬼的引诱下，他的小室里出现了一盏点燃的灯，他借此找到了丢失的锥子。这给他的傲慢提供了新的养料；在骄傲的陶醉中，这位修道者更加自命不凡，以至于最终开始轻视基督的圣奥迹本身。一天，有些陌生人给教会的弟兄们带来了水果；我们敬爱的长老马卡里奥斯将这些水果分发到各小室，每个弟兄一捧，也包括这个瓦连特。瓦连特收到水果后，辱骂并殴打了送水果的人，对他说：「你去告诉马卡里奥斯：『我不比你差，你竟给我送什么祝福？』」马卡里奥斯从这事得知瓦连特正处于迷惑之中，便隔天去劝诫他，对他说：「瓦连特弟兄！你正受迷惑。停止吧，去向上帝祷告。」但瓦连特不听从马卡里奥斯神父的劝诫。由于瓦连特不听他的劝说，马卡里奥斯便怀着对瓦连特堕落的极大悲伤离开了。


          魔鬼则确信瓦连特已完全受其欺骗，于是变作救主的模样，夜晚来到他身边，被一群伪装成天使的魔鬼簇拥着，手持点燃的灯。接着，一个火圈出现了，瓦连特在火圈中央看见了一个仿佛是救主的身影。一个伪装成天使的魔鬼走近他，说：「你以你的苦修和自由的生活取悦了基督，他便前来见你。所以，你什么都不要做，只需远远站着，看见他立在所有灵体之中后，便俯伏敬拜他，然后回到你的小室去。」瓦连特出去后，看见许多手持灯的灵体，约有一斯塔狄昂远，便俯伏敬拜了敌基督。这被迷惑之人竟将自己的狂妄推至如此地步，以至于第二天来到教会时，在所有弟兄面前说：「我不需要领受圣餐：我今天已经见过基督了。」'
    - type: paragraph
      text:
        ru: Тогда святые отцы, связали его цепями и в течение года вылечили, истребив гордость его молитвами, разнообразным унижением и суровою жизнию, как говорится, врачуя противное противным.
        cn: 于是，圣教父们用锁链捆绑了他，并在一年之内治愈了他，借着祷告、各式各样的羞辱以及严峻的苦修根除了他的骄傲，俗话说，以反治反。
    - type: paragraph
      text:
        ru: Нужно поместить в этой книжице и жития подвергшихся обольщению для предостережения читателей (так как и в раю, вместе с добрыми произрастениями, росло древо познания добра и зла), чтобы они, если и совершат какой подвиг, не думали много о своей добродетели, ибо нередко и добродетели служат поводом к падению, когда мы совершаем их не с духовною мудростию и не ради благочестия, как и написано:«…есть праведный погибаяй во своей правде... И сие суета»(Еккл. 7, 16, 8:10).
        cn: 在这本小册子里，也应该收录那些受迷惑之人的生平事迹，以警诫读者（因为即使在伊甸园里，除了美好的植物之外，也生长着善恶知识树），以便他们，即使完成了某些善功，也不要过多思量自己的美德，因为往往美德本身也会成为堕落的缘由，当我们行它们时，若不是出于属灵的智慧，也不是为了虔敬，正如经上所写：「……有义人，在自己的义中灭亡……这也是虚空」（传道书 7:16，8:10）。
  - type: heading2
    text:
      ru: Об Эроне
      cn: 关于埃龙
    children:
    - type: paragraph
      text:
        ru: 'У меня был сосед Эрон, родом из Александрии, благовоспитанный юноша с прекрасными умственными дарованиями и неукоризненной жизни. И он также после великих трудов, доблестных подвигов и весьма добродетельной жизни, поднявшись на мечтательную высоту безумного надмения, низвергся оттуда жалким для всех падением и погубил себя. Движимый суетным кичением, он возгордился пред святыми отцами и стал поносить всех, в том числе и блаженного Евагрия, говоря: «Последующие твоему учению заблуждаются, потому что не должно следовать другим учителям, кроме одного Христа». Злоупотреблял еще и свидетельством слова Божия с превратною целию подкрепить свое безумие и говорил, что Сам Спаситель сказал:«…не нарицайте учителей»на земли (Мф. 23, 8). Наконец, суетное кичение совершенно омрачило его разум, и он до того упал, что его связали цепями, так как, по гордости, он не хотел приступать и к самым Таинам.'
        cn: 我有一个邻居埃隆，来自亚历山大，是一个品行端正、拥有卓越才智且生活无可指摘的年轻人。他也同样，在经历了巨大的劳苦、英勇的功绩和极其美德的生活之后，升到疯狂傲慢的幻想高度，却又从那里以令所有人可悲的堕落而跌落，并毁了自己。受虚妄的自负驱使，他在圣父们面前骄傲起来，并开始诋毁所有人，包括蒙福的叶瓦格里，他说：「追随你教导的人都走错了路，因为除了独一的基督，不应该追随别的老师。」他甚至滥用神的道的见证，带着扭曲的目的来支持自己的疯狂，并且说救主亲自说了：「……在地上不要称人为师」（马太福音 23:8）。最终，虚妄的自负彻底蒙蔽了他的理智，他堕落到如此地步，以至于人们用链子把他捆绑起来，因为出于骄傲，他甚至不愿领受圣事。
    - type: paragraph
      text:
        ru: 'Надобно сказать правду: жизнь его, по рассказам людей, живших с Эроном, была необыкновенно строгая и точно подвижническая. Некоторые говорят, что часто он принимал пищу через три месяца, довольствуясь одним приобщением Таин, и разве еще где попадался ему дикий овощ. Опыт его постничества я и сам видел вместе с блаженным Альбином на пути в скит. До скита нам было сорок поприщ. В продолжение пути мы дважды ели и трижды пили воду. А он совсем ничего не ел и, идя пешком, прочитал наизусть пятнадцать псалмов, потом великий псалом, потом Послание к Евреям, потом Исаию и часть Иеремии пророка, затем Луку евангелиста и Притчи. И при этом он шел так, что мы не могли поспевать за ним. Лукавый демон наконец так возобладал им, что он не мог жить в своей келии, как будто самый сильный пламень гнал его. Эрон отправился в Александрию, конечно по смотрению Промысла Божия и по изречению: «клин клином выбил». Там он стал посещать зрелища и конские бега и проводить время в корчемницах. Предаваясь, таким образом, чревоугодию и пьянству, он впал и в нечистую похоть любострастия. От нечистой жизни открылась у него злокачественная болезнь, которая страшно мучила его полгода. Когда сделалось ему легче, он пришел в доброе чувство, вспомнил о небесной жизни, исповедал все, что было с ним, пред святыми отцами, но, ничего не успев сделать, чрез несколько дней скончался.'
        cn: 应当说实话：根据那些与埃龙共同生活过的人的讲述，他的生活异常严谨，并且确实是苦修的。有些人说，他常常三个月才进食一次，仅满足于一次圣事领受，此外，也许偶尔能遇到野生的蔬菜。我自己也亲眼见过他苦修禁食的经验，那是与蒙福的阿尔宾一起，在前往隐修院的路上。离隐修院我们还有四十俄里。在路途中，我们吃了两次，并且喝了三次水。而他则什么都没吃，并且步行时背诵了十五篇诗篇，然后是大诗篇，然后是《希伯来书》，然后是《以赛亚书》以及先知《耶利米书》的一部分，接着是《路加福音》和《箴言》。而与此同时，他走得如此之快，以至于我们跟不上他。狡诈的邪魔最终如此完全地控制了他，以至于他无法住在自己的修道室里，好像最猛烈的火焰在驱赶他一样。埃龙去了亚历山大港，当然是按照上帝神圣的旨意，并且是根据「以楔拔楔」这句格言。在那里他开始去观看表演和赛马，并且在小酒馆里消磨时间。如此一来，他沉溺于饕餮和酗酒，他也堕入了不洁的淫欲之中。由于不洁的生活，他患上了一种恶性疾病，这种疾病可怕地折磨了他半年。当他病情好转时，他恢复了清醒的意识，想起了天上的生活，在圣父们面前忏悔了他所经历的一切，但是，什么也没来得及做，几天后就去世了。
  - type: heading2
    text:
      ru: О Птоломее
      cn: 关于托勒密
    children:
    - type: paragraph
      text:
        ru: 'Был еще другой подвижник, по имени Птоломей. Его добродетели были столь велики, что о них трудно или, лучше, невозможно рассказать. Сначала он жил за скитом, на так называемой лестнице. В этом месте ни один монах не мог жить, оттого что колодезь с водою был за восемнадцать поприщ. Сюда ходил Птоломей с большими глиняными сосудами и брал себе воду. А в декабре и январе месяце он довольствовался росою, которую собирал с камней в свои кувшины (там в эти месяцы падает сильная роса). Так жил он здесь пятнадцать лет и во все это время почти ни с кем не встречался. Но, лишенный духовного наставления и беседы с преподобными мужами и назидания святых отцов, а также постоянного общения Таин Христовых, он совратился с правого пути и дошел до такого безумия, что, подобно некоторым нечестивцам, и этот несчастный стал признавать господство случая, потому что им управлял демон заблуждения. Этот враг внушил ему говорить вот какую новость: будто дела не имеют никакого значения, а просто все в мире происходит случайно. Затем враг жизни человеческой, совершенно овладев его душою, стал внушать ему вот что: «Если это правда, то зачем ты так изнуряешь себя понапрасну? Что будет тебе, Птоломей, пользы, если нет воздаяния? Да если бы и был Воздаятель, чем Он мог бы наградить тебя достойно за такие подвиги? И что это за суд, которым угрожает Писание, когда все происходит без Промысла?».'
        cn: '还有另一位名叫普托洛梅的苦修者。他的美德如此之大，难以言表，或者更确切地说，根本无法述说。起初他住在隐修院外，在一个叫做「梯子」的地方。在这个地方，没有一个修士能够居住，因为水井在十八俄里之外。普托洛梅会到这里，带着大陶罐给自己取水。而在十二月和一月，他则满足于露水，他将这些露水从石头上收集到他的水罐里（在这些月份，那里的露水很浓重）。他就这样在这里生活了十五年，在这段时间里，他几乎没有与任何人见面。


          然而，由于缺乏属灵的指导、与可敬修道士的交谈以及圣教父的训诲，加之未能持续领受基督的圣奥秘，他偏离了正道，并达到了如此的疯狂，以至于，就像一些不虔敬的人一样，这个不幸的人也开始承认偶然性的主宰，因为他被一个迷惑的恶魔所掌控。这个仇敌唆使他散布这样一种新奇的说法：好像（实际上）事情本身没有任何意义，而世上的一切都只是偶然发生的。接着，人类生命的仇敌，完全掌控了他的灵魂，开始这样对他进行灌输：「如果这是真的，那你又何必白白地这样折磨自己呢？普托洛梅啊，如果没有报偿，你又会有什么益处呢？即使真有报偿者，他又怎能用什么来公正地奖赏你这些苦修呢？那么，当一切都是在没有神圣旨意的情况下发生时，圣经所警告的审判又算是什么呢？」'
    - type: paragraph
      text:
        ru: 'Эти сатанинские внушения сокрушили несчастного Птоломея, так что он совсем потерял ум и, говорят, доселе скитается по Египту, предаваясь чревоугодию и пьянству, ни с кем не говорит, но молча бродит по площадям, представляя из себя глазам христиан жалкое и плачевное зрелище и служа игрушкою и посмешищем для тех, которые не имеют понятия о нашей жизни. И это неисцельное бедствие постигло несчастного Птоломея за его безумную гордость: обольщенный лукавым, он думал, будто имеет ведение выше всех святых отцов. Надмившись этим, он – враг самому себе – погрузился в эту бездну погибели потому, что никогда не беседовал со святыми отцами, сими мудрыми кормчими, и не внимал их духовному наставлению; за то, не имея кормчего и постигнутый мрачною бурею, низринулся в крайнюю пучину смерти. Или его можно уподобить прекрасному дереву, которое, быв покрыто листьями и плодами, в одну минуту лишилось всего и засохло. Так было и с ним, по слову Писания:«Имже несть управления, падают аки листвие»(Притч. 11, 14).'
        cn: 这些撒但的蛊惑摧毁了不幸的普托洛梅，以至于他完全丧失了心智，据说至今仍在埃及游荡，沉溺于贪食和醉酒，不与任何人交谈，却默默地游荡于广场，在基督徒眼中呈现出可悲可叹的景象，并成为那些不了解我们生活之人眼中被玩弄的玩物和笑柄。而这无法治愈的灾祸降临到不幸的普托洛梅身上，皆因他那狂妄的骄傲：他被那恶者所迷惑，竟以为自己拥有超越所有圣教父的洞见。因此而骄傲自满，他——自己的仇敌——沉沦于这毁灭的深渊，因为他从未与圣教父们交谈，这些智慧的舵手，也未曾听从他们的属灵教导；因此，在没有舵手的情况下，又被黑暗的暴风雨所席卷，他坠入了死亡的极度深渊。或者可以将他比作一棵美丽的树，这棵树曾枝繁叶茂，果实累累，却在一瞬间失去了一切，枯萎凋零。他亦是如此，正如经上所说：「若无治理，人便如落叶般坠落」（箴言 11:14）。
  - type: heading2
    text:
      ru: О девственнице иерусалимской
      cn: 论耶路撒冷的贞女
    children:
    - type: paragraph
      text:
        ru: Еще знал я в Иерусалиме одну девственницу, которая шесть лет носила власяницу и, заключившись в своей келии, отреклась от всех удовольствий и между женщинами вела жизнь самую воздержную. Но потом, быв оставлена Божией помощию за чрезмерную гордость – эту питательницу всякого зла, – она впала в блуд. Это случилось с нею потому, что она подвизалась не по духовному расположению и не по любви к Богу, но напоказ людям, ради суетной славы, которой ищет растленная воля. Демон тщеславия, отвлекши ее от благочестивых помыслов, возбудил в ней желание осуждать других. Когда же она пришла в опьянение от демона гордости и еще соуслаждалась ему, тогда святой Ангел, страж целомудрия, отступил от нее.
        cn: 我还在耶路撒冷认识一位童贞女，她曾连续六年身穿苦衣，并把自己禁闭在她的隐修小室里，弃绝了所有的享乐，在妇女中过着最节制的生活。但后来，她因着过度骄傲——这滋生万恶的根源——被神的帮助所离弃，便陷入了淫乱。这事发生在她身上，是因为她修持苦行并非出于灵性上的倾向，也非出于对神的爱，而是为了显给人看，为了那堕落的意志所追求的空虚荣耀。虚荣的魔鬼将她从虔敬的思想中引开，在她心中激起了论断他人的欲望。当她被骄傲的魔鬼灌醉，且仍以此为乐时，圣洁的天使，即贞洁的守护者，便离开了她。
    - type: paragraph
      text:
        ru: Я описал тебе, благочестивейший муж, жития как тех, которые до конца пребыли в добродетели, так и тех, которые с высоты подвижничества после многих трудов по нерадению увлечены были диаволом в разнообразные сети его для того, чтобы каждый в своей жизни мог распознавать тайные козни ненавистника добра и избегать сетей его. Много было великих мужей и жен, которые сначала ревностно подвизались в добродетели, но наконец были низложены врагом человеческого рода. Из множества их упоминая только о немногих, я о большей части из них умолчу, потому что, разглагольствуя о них много, и их не исправил бы, и себе не принес бы пользы, притом оказал бы невнимание к избранным подвижникам Христовым, если бы прекратил дальнейшее повествование о доблестях благочестивого подвижничества их.
        cn: 我已向你描述，至为虔敬的弟兄，那些持守美德到底之人的生平，以及那些在经历许多劳苦后，因着懈怠，从苦修的高峰被魔鬼引诱，落入其各种罗网之人的生平；为的是让每个人在自己的生命中都能辨明那憎恶良善者（魔鬼）的隐秘诡计，并避开它的罗网。曾有许多伟大的男子和女子，他们起初热心操练美德，但最终却被人类的仇敌击败了。从他们众多的人中，我只提及少数人，将对他们中的大多数保持沉默，因为若对他们多加论述，我既不能使他们归正，也不能给自己带来益处；况且，如果我停止继续叙述基督所拣选的苦修者们虔敬苦修的英勇事迹，那将是对他们的不敬。
  - type: heading2
    text:
      ru: О девственнице Пиамун
      cn: 关于贞女皮阿蒙
    children:
    - type: paragraph
      text:
        ru: 'Была девственница по имени Пиамун, которая всю жизнь свою прожила со своею матерью и с нею наедине принимала пищу только вечером, а днем пряла лен. Она удостоилась дара пророческого. Однажды, во время разлития Нила, одна деревня напала на другую, ибо между деревнями бывают ссоры из-за раздела воды, напояющей участки земли, от чего зависит ее плодородие, причем нередко доходит до кровопролития и смертоубийства. Итак, сильнейшая деревня напала на деревню, в которой жила Пиамун. Множество народа шло туда с кольями и дубинами, чтобы совсем разорить деревню ее. Но блаженной деве явился Ангел Божий и открыл ей о предстоящем нападении. Она, призвавши старейшин своей деревни, сказала им: «На вас идут из такой-то деревни; ступайте к ним навстречу и упросите их оставить свой замысел против вас, иначе все мы, жители этой деревни, погибнем вдруг». Устрашенные старейшины пали ей в ноги и начали просить ее и умолять, говоря ей: «Мы не смеем идти к ним навстречу, ибо знаем их ярость и неистовство, но сделай милость нам, и всему селению, и своему дому – выйди сама к ним навстречу и укроти их, чтобы они воротились назад». Святая не согласилась на это, но, взошедши в свою келию, всю ночь стояла на молитве, умоляла Бога и говорила: «Господи, Судия вселенной, Ты, Которому не угодна всякая неправда! Когда приидет к Тебе молитва сия, пусть святая сила остановит их на том месте, где постигнет их». Так и случилось по молитве святой девы.'
        cn: '有一位名叫皮阿蒙的贞女，她一生与母亲相伴，只在晚上与母亲独食，白天则纺麻。她蒙受了预言的恩赐。


          一次，在尼罗河泛滥期间，一个村庄袭击了另一个村庄，因为村庄之间常因分水而争吵，这水浇灌土地，土地的肥沃度也依赖于此，而且常常演变为流血和杀戮。于是，最强大的村庄袭击了皮阿蒙所居住的村庄。许多人带着木桩和棍棒朝那里走去，企图彻底摧毁她的村庄。


          但一位上帝的使者显现给这位蒙福的贞女，并向她揭示了即将发生的袭击。她召集了村里的长老们，对他们说：「某个村庄的人正朝你们而来；你们去迎见他们，恳求他们放弃对你们的图谋，否则，我们所有这个村庄的居民都会突然灭亡。」


          惊恐的长老们跪倒在她脚下，开始恳求她，央求她，说：「我们不敢去迎见他们，因为我们知道他们的狂怒和暴行，但请你施恩于我们，施恩于整个村庄和你的家——你自己去迎见他们，安抚他们，让他们折返回去。」


          这位圣女没有同意，但她走进自己的小室，整夜站着祷告，恳求上帝，说：「主啊，宇宙的审判者，你是不喜悦任何不义的！当这祷告达到你面前时，愿圣洁的力量在他们所达之处阻止他们。」事情就这样发生了，按照这位圣洁贞女的祷告。'
    - type: paragraph
      text:
        ru: 'Часу в первом дня враги находились за три поприща от деревни и на этом самом месте остановились, как просила святая, и никак не могли тронуться с места. И самим этим врагам открыто было, что это случилось с ними по предстательству рабы Христовой Пиамун. Посему они послали в ее селение просить мира и сказать жителям: «Благодарите Бога и праведную Пиамун: ее святые молитвы и вас спасли, и нас не допустили до великого греха».'
        cn: 约在当日第一小时，仇敌已在离村庄三里格之处，就在那地方停了下来，正如圣人所求，并且无论如何都无法挪动。甚至这些仇敌自己也明白，这事之所以发生在他们身上，是因为基督的仆人皮阿蒙的代祷。因此，他们派人到她的村庄，请求和睦，并告诉居民们说：「感谢上帝和义人皮阿蒙：她的圣洁祷告不仅拯救了你们，也阻止了我们犯下大罪。」
  - type: heading2
    text:
      ru: О Пахомии и живших с ним
      cn: 论帕霍米及与他同住者
    children:
    - type: paragraph
      text:
        ru: 'В Фиваиде есть место, называемое Тавенна; там был монах Пахомий, один из великих подвижников, удостоившийся дара пророческого и видений ангельских. Он был весьма нищелюбив и человеколюбив. Однажды, когда он сидел в своей пещере, явился ему Ангел Господень и сказал: «Пахомий! Ты сделал свое дело, посему теперь не должно тебе оставаться в этой пещере. Пойди собери всех молодых монахов, живи с ними и управляй ими по уставу, какой дам тебе». Потом он дал ему медную доску, на которой написано было следующее:'
        cn: '在提拜德有一个地方，名叫塔本纳；那里有一位修士，名叫帕霍米，他是伟大的苦修者之一，蒙受了先知恩赐和天使显现。他极其爱护穷人，且慈爱待人。


          有一天，当他正坐在自己的洞穴里时，主的使者向他显现，并说：「帕霍米！你已经完成了你的事工，所以现在你不应该再留在这个洞穴里了。去召集所有年轻的修士们，与他们同住，并按照我将要赐予你的章程来管理他们。」随后，他给了他一块铜板，上面写着以下内容：'
    - type: paragraph
      text:
        ru: '«Позволяй каждому есть и пить по потребности; назначай им труды, соразмерные с силами каждого; не возбраняй ни поститься, ни есть; труды тяжелые возлагай на тех, которые крепче силами и больше едят, а малые и легкие назначай слабым, которые не привыкли к подвижничеству. Келии устрой отдельные в одном здании, и в каждой келии пусть живут по три. Пища пусть предлагается для всех в одном месте. Спать не должны они лежа, но пусть устроят себе седалища с отлогими задниками и спят на них сидя, постлавши постель свою. На ночь они должны оставаться в льняных хитонах и препоясанные. У каждого должна быть белая козья милоть (мантия); без нее не должны они ни есть ни спать. Но к принятию Таин Христовых по субботам и воскресеньям да приступают только с наглавником, развязав пояс и снявши милоть». А наглавники Ангел назначил им без подвязок, как у детей, и на них приказал положить изображение пурпурового креста. Братию он повелел разделить на двадцать четыре чина: по числу двадцати четырех букв – так, чтобы каждый чин означался греческими буквами от"альфы"и"беты"по порядку до"омеги", чтобы, когда архимандриту нужно будет спросить или узнать о ком-либо из столь многих братий, он спрашивал у своего помощника, в каком состоянии находится чинальфыαили чинбетыβ, либо же просил отнести благословение чинуроρ… Наименование каждой буквы уже само собою указывало бы на означаемый ею чин. «Инокам, более других простым и незлобивым, – продолжал Ангел, – дай имяиотыι, а непокорных и крутых нравом отметь буквоюксиξ, выражая таким образом самою формою буквы свойство наклонностей, нрава и жизни каждого чина. Знаки сии будут понятны только духовным». На доске написано было еще, что, ежели придет странник из другого монастыря, где живут по другому уставу, он не должен ни есть, ни пить вместе с ними, даже не входить в монастырь, исключая того случая, когда он будет найден на дороге. А однажды вошедший должен остаться с ними навсегда. «К высшим подвигам прежде трех лет не допускай его – только после трех лет, когда совершит он тяжкие работы, пусть вступит на это поприще. За трапезою головы у всех должны быть покрыты наглавником, чтобы один брат не видел, как ест другой. Не должно также разговаривать во время трапезы, ни смотреть по сторонам, а только на стол или в блюдо». Ангел положил совершать монахам в продолжение всякого дня двенадцать молитв, также вечером двенадцать, ночью двенадцать и три в девятом часу. Когда братии рассудится прийти за трапезу в большом числе, то каждый чин пред совершением молитвы должен петь псалом. Когда жеПахомий великийна это сказал, что молитв мало, Ангел говорит ему: «Я положил столько для того, чтобы и слабые удобно, без отягощения, могли выполнять правило; совершенные же не имеют нужды в уставе, ибо, пребывая наедине в келии, они всю жизнь свою проводят в созерцании Бога. Устав дал я тем, у которых ум еще не зрел, чтобы они, хотя как непокорные рабы, по страху к господину выполняя общее правило жизни, достигали свободы духа».'
        cn: '「允许每个人按其需要饮食；给他们分配与各人能力相称的工作；不可禁止禁食或进食；将繁重的工作交给那些体力更强、食量更大的人，而将少量轻省的工作分配给那些体弱且不习惯苦修者。小室应在同一建筑中独立设置，每室住三人。食物应在同一处供应给所有人。他们不应躺卧睡觉，而应为自己准备带有斜靠背的座位，坐着睡在上面，铺好他们的床铺。夜间他们应穿着亚麻长袍并束着腰带。每个人都应有一件白山羊皮曼蒂亚；没有它，他们既不可进食也不可安睡。但在安息日和主日领受基督圣奥秘时，只可戴着头罩前来，并解开腰带，脱下曼蒂亚。」天使还指定他们的头罩不系带，像孩童那样，并命令在上面放上紫色十字架的图像。


          他命令将修士们分为二十四个品级：按二十四个字母的数目——这样每个品级都以希腊字母从「阿尔法」（α）和「贝塔」（β）按顺序直到「欧米伽」（omega）来表示，以便大院长需要询问或了解这许多修士中的某人时，他可以询问他的助手：「阿尔法」（α）品级或「贝塔」（β）品级的情况如何？或者，他可以请人将祝福带给「罗」（ρ）品级……每个字母的名称本身就能指明它所代表的品级。「对于那些比其他人更单纯、无恶意的修士，」天使继续说，「给予他们『约塔』（ι）这个名称，而那些不顺从、性情刚硬者，则用『克西』（ξ）字母来标记，以此方式通过字母本身的形状来表达每个品级的倾向、性情和生命特质。这些标记只有属灵之人才能理解。」


          石板上还写着，如果一个来自奉行不同规章制度的修道院的客僧到来，他既不应与他们一同饮食，甚至不应进入修道院，除非他在路上被发现。而一旦进入者，必须永远与他们同住。「三年之内不可允许他从事更高的苦修——只有在三年之后，当他完成了繁重的工作，才可进入这个领域。用餐时所有人的头部都必须用头罩遮盖，以免一个修士看到另一个修士如何进食。用餐时也不应交谈，不应东张西望，而只应注视餐桌或盘子。」


          天使规定修士们每天进行十二次祷告，傍晚十二次，夜间十二次，以及第九时辰（下午三点）三次祷告。当众多修士前来用餐时，每个品级在祷告前都应唱一首诗篇。当伟大的帕霍米对此说祷告次数太少时，天使对他说：「我规定这么多，是为了就连体弱者也能方便、毫无负担地遵守规矩；而那些达到完全境界的人则无需规章制度，因为他们独自居于小室中，将一生都用于默观上帝。我给出规章制度，是为了那些心智尚未成熟的人，好让他们，即使像不顺从的仆人一样，出于对主人的畏惧而履行共同的生活规矩，也能达到灵魂的自由。」'
    - type: paragraph
      text:
        ru: Дав сей устав и тем исполнив свое служение, Ангел удалился от Великого Пахомия. Правило это приняли весьма многие монастыри, в которых число братий простирается до семи тысяч человек. Первый и великий монастырь, в котором жил сам блаженный Пахомий и который был рассадником других монастырей, имеет братии около тысячи трехсот человек.
        cn: 天使颁布了这会规，从而完成了他的事奉，然后离开了大帕霍米乌斯。这会规被非常多的修道院采纳，其中修士的人数多达七千人。蒙福的帕霍米乌斯本人居住的第一个也是最伟大的修道院，并且是其他修道院的发源地，有大约一千三百名修士。
  - type: heading2
    text:
      ru: Об авве Аффонии
      cn: 关于阿爸阿弗多尼奥斯
    children:
    - type: paragraph
      text:
        ru: 'Между монахами Пахомиева монастыря есть раб Божий именем Аффоний, занимающий теперь второе место в монастыре, мой искренний друг. Его, как уже недоступного соблазнам, обыкновенно посылают в Александрию по монастырским нуждам, как-то: для продажи рукоделия и для покупки припасов. Есть и другие монастыри, в которых живут по двести и по триста человек. Так, например, в Панопольском монастыре братии состоит триста человек. В этом монастыре видел я пятнадцать портных, семь кузнецов, четыре плотника, двенадцать верблюжьих погонщиков, пятнадцать сукноваляльщиков. Здесь занимаются всяким ремеслом и остатки от вырученного употребляют на содержание женских монастырей и на подаяния в темницы. Вставши рано утром, все принимаются за свои ежедневные работы: одни трудятся на поварне, другие готовят трапезу. Там они заняты до третьего часа дня – ставят столы, раскладывают по столам хлеб, разного рода овощи, оливы, сыр и сушеные плоды. Собираются в трапезу не все в одно время. Еще не привыкшие к строгой жизни приходят за стол в шестом часу (это около полудня), немощные – в седьмом, иные – в восьмом, другие – в девятом, а иные – в десятом или поздно вечером; одни через два дня, другие через три и даже через пять дней – словом, каждый разряд знает свой час. Занятия их вот в чем состоят: один возделывает землю, другой работает в саду, кто – на кузнице, на мельнице, в кожевне, иные идут в мастерскую плотничать, иные валяют сукна, другие плетут разного рода и величины корзины и за работою читают наизусть Писание.'
        cn: 在帕霍米耶夫修道院的修士们中间，有一位名叫阿弗尼的上帝仆人，如今在修道院中位居第二，他是我真诚的朋友。由于他已经不受诱惑影响，人们通常派他去亚历山大港办理修道院事务，例如：出售手工艺品和采购物资。还有其他修道院，里面住着两三百人。比如，在帕诺波利斯修道院，修士共有三百人。在这个修道院我看到了十五名裁缝、七名铁匠、四名木匠、十二名骆驼夫、十五名漂洗工。这里从事各种手艺，并将所得盈余用于供养女修道院和施舍给狱中之人。清晨起床后，所有人便开始各自的日常工作：有的在厨房劳作，有的准备膳食。他们在那里忙碌直到白天的第三个时辰——摆放桌子，在桌上摆放面包、各种蔬菜、橄榄、奶酪和干果。聚集用餐并非所有人都在同一时间。尚未习惯严格生活的人在第六个时辰（大约中午）前来用餐，虚弱者在第七个时辰，另一些在第八个时辰，其他人在第九个时辰，还有一些在第十个时辰或深夜；有些人隔两天，有些人隔三天甚至五天——总之，每个类别都有自己的用餐时间。他们的工作内容如下：有的耕作土地，有的在花园里劳作，有的在铁匠铺、磨坊、皮革作坊，另一些去木匠铺做木工，另一些漂洗布料，其他人则编织各种形状和大小的篮子，并在工作时背诵经文。
    - type: paragraph
      text:
        ru: К Пахомиевым же монастырям принадлежит женский монастырь, имеющий около четырехсот инокинь; в нем содержат такой же устав и образ жизни, только не носят милоти. Инокини живут на одном берегу Нила, а монахи – против них на другом. Если скончается девственница, другие девственницы, приготовив ее к погребению, выносят и полагают ее на берегу реки. Иноки же, переплывши реку, переносят умершую на свой берег с пальмовыми и оливковыми ветвями и псалмопением и погребают в своих гробницах. Кроме пресвитера и диакона, никто не входит в женский монастырь, да и они – только по воскресеньям, для богослужения.
        cn: 属于帕霍米乌斯修道院体系的，还有一个女子修道院，里面大约有四百名女修士；她们遵守着同样的规章和生活方式，只是不穿羊皮披风。女修士们住在尼罗河的一岸，而男修士们则住在对岸。如果有贞女去世，其他贞女们会把她预备妥当，以便安葬，然后将她抬出并安放在河岸上。男修士们则渡过河去，伴随着棕榈枝、橄榄枝和诵唱圣咏，将逝者抬到他们的那一岸，并安葬在他们的墓穴中。除了长老和执事，没有人进入女子修道院，即便他们也只在主日进入，为举行事奉圣礼。
  - type: heading2
    text:
      ru: Об оклеветанной девственнице
      cn: 关于被诽谤的贞女
    children:
    - type: paragraph
      text:
        ru: 'В этом женском монастыре случилось вот что. Портной, мирянин, переплыв реку, по неведению, искал себе работы. Одна из младших девственниц, вышедши по какой-то надобности из монастыря, случайно встретилась с ним (место было пустынное) и сказала ему: «У нас есть свои портные». Встречу эту видела другая сестра и, чрез несколько времени поссорившись с тою сестрою, в жару злобного гнева, по наущению диавольскому, оклеветала ее пред сестрами по поводу той встречи. К клеветнице присоединились некоторые и не желавшие зла сестре. Эта, не могши перенести позора, что подверглась такой клевете, когда грех и на мысль не приходил ей, с печали тайно бросилась в реку и утопилась. Не перенесла этого и клеветница. Одумавшись, она увидела, что по злобе оклеветала и погубила ее, и сама удавилась. Когда пришел в монастырь пресвитер и сестры рассказали ему о случившемся, то он воспретил совершать поминовение по преступницам, а других, которые знали дело и не уговорили клеветницу, но еще поверили словам ее, отлучил на семь лет от причащения.'
        cn: 在这座女修道院里发生了这样一件事。一个裁缝，一个平信徒，渡过河，因着无知，正在寻找工作。一位年轻的修女，因着某种需要出了修道院，偶然与他相遇（那地方是荒凉的），并对他说：「我们有自己的裁缝。」这次相遇被另一位修女看到了，不久之后，她与那位修女发生了争吵，在恶毒怒火的冲动下，受了魔鬼的唆使，她因那次相遇而在众修女面前诽谤了她。诽谤者得到了某些人的附和，甚至是一些本不希望那位修女受害的人。她无法忍受羞辱，因她遭受了如此诽谤，而罪念甚至从未出现在她脑海中，她悲痛地偷偷跳入河中，淹死了。诽谤者也无法忍受此事。她醒悟过来，意识到她因恶意诽谤并毁了她，便也上吊自杀了。当一位司祭来到修道院时，修女们向他讲述了所发生的一切，他便禁止为这些犯了罪的修女举行追思礼，而对于那些知道此事却没有劝说诽谤者，却还相信她话语的人，他将他们开除圣餐七年。
  - type: heading2
    text:
      ru: О юродивой девственнице
      cn: 论愚蒙贞女
    children:
    - type: paragraph
      text:
        ru: В том же монастыре была одна девственница, именем Исидора. Христа ради она показывала себя юродивою и безумною, избрав сей род подвижничества по своему редкому смирению и самоуничижению. Другие до того презирали ее, что даже не ели с нею, а она принимала это с радостию. Служа в поварне, она исполняла всякое послушание для всех сестер, как покорная рабыня, готовая на всякую службу. Сия блаженная была, как говорится, отребьем монастыря и самым делом исполняла написанное в Святом Евангелии:«Иже хощет в вас вящший быти, да будет всем раб и всем слуга»(Мф. 20, 26;Мк. 10, 43); также:«Аще кто мнится мудр быти в вас в веце сем, буй да бывает, яко да премудр будет»(1Кор. 3, 18). Другие девственницы, как уже постриженные, носили на голове куколи, а у нее голова всегда была покрыта ветхою повязкою. Из четырехсот сестер ни одна не видывала, когда она ела. За трапезу она никогда не садилась, никогда не брала себе и ломтя хлеба, а довольна была крошками, собираемыми после стола, и остатками в сосудах, которые обмывала. Обуви также она никогда не носила и, несмотря на все поношения, брань и презрение, какие многие оказывали ей, никого не обижала и ни полсловом не показывала ропота.
        cn: 在同一个修道院里，有一位名叫伊西多拉的童贞女。她为了基督的缘故，装作愚拙和疯狂，选择这种苦修方式，是出于她罕见的谦卑和自我贬抑。其他人对她鄙夷至极，甚至不与她一同进食，而她却欣然接受。在厨房里服侍时，她为所有修女履行一切服从的义务，像一个顺服的婢女，随时准备好做任何差事。这位蒙福者，可以说，是修道院的弃物，她以实际行动履行了圣福音中所写的：「你们中间谁愿为大，就必作你们的仆人；谁愿为首，就必作众人的奴仆」（马太福音 20:26，马可福音 10:43）；以及：「你们中间若有人，在这世界自以为有智慧，倒不如变作愚拙，好成为有智慧的」（哥林多前书 3:18）。其他已受剪发礼的童贞女头戴库库尔帽，而她的头总是用一条旧头巾遮盖着。在四百名修女中，没有一个人见过她吃饭的时候。她从不坐在餐桌旁，从未给自己拿过一片面包，而是满足于餐后收集的碎屑和她洗涤器皿时留下的残羹。她也从不穿鞋，尽管许多人对她百般侮辱、辱骂和轻蔑，她从未伤害任何人，也从未抱怨半句。
  - type: heading2
    text:
      ru: О Питириме
      cn: 关于皮蒂里姆
    children:
    - type: paragraph
      text:
        ru: 'Святому отшельнику Питириму, жившему в Порфирите, мужу, знаменитому подвигами, предстал Ангел и сказал о преподобной Исидоре: «Для чего ты превозносишься своими подвигами, как благочестивый и живущий в таком месте? Хочешь ли видеть женщину более тебя благочестивую? Ступай в женский Тавеннский монастырь и найдешь там одну, которая носит на голове повязку, – она лучше тебя, ибо она борется с таким многолюдством, всем служит различным образом и, хотя все презирают ее, сердцем никогда не отступает от Бога. А ты, сидя здесь и никогда не живши в мире, блуждаешь мыслию по городам».'
        cn: '天使向住在波菲里特、以其苦修而闻名的圣隐士皮提里姆显现，并论及可敬的伊西多拉说：


          「你为何因自己的苦修而自傲，仿佛你就是那虔诚的、住在此地的人呢？你想看看一位比你更虔诚的女子吗？往塔文涅斯女修道院去，你会在那里找到一位头戴头巾的——她比你更好，因为她在那众多的人群中争战，以各种方式服侍所有人，尽管所有人都轻视她，心中却从未偏离上帝。而你，坐在这里，却从未在世俗中生活过，思想却在各城中游荡。」'
    - type: paragraph
      text:
        ru: 'Поднявшись со своего места, Великий Питирим пошел в Тавеннский монастырь и просил тамошних учителей проводить его в женский монастырь. Переправившись через реку, они с радостию ввели его туда, как мужа, знаменитого между отцами и состарившегося в подвижничестве. Когда помолились они, Великий изъявил желание видеть лично всех насельниц. Собрались все – не пришла одна Исидора. Святой Питирим сказал: «Приведите мне всех». И когда ему отвечали: «Мы все здесь», он сказал: «Здесь нет одной, которую показал мне Ангел». Тогда они сказали: «Есть у нас одна безумная – она в поварне». «Приведите и ее, – говорит Великий, – дайте мне посмотреть на нее». И они пошли позвать ее. Но Исидора, понявши дело, не послушалась; может быть, ей было и откровение. Ее ведут насильно, говоря: «Святой Питирим желает видеть тебя». А имя его было славно. Когда же привели ее и Великий увидел лицо ее и на голове у нее ветхую повязку, пал ей в ноги и сказал: «Благослови меня, мать». И она, также упавши ему в ноги, сказала: «Ты благослови меня, господин мой!». Увидя это, все изумились и стали говорить: «Авва! Не срами себя: она безумная!». «Вы безумные, – отвечал святой старец, – а она лучше вас и меня – она мать наша, и я молюсь, чтобы оказаться равным ей в день Суда».'
        cn: 从他所在之处起身，伟大的皮提里姆前往塔文尼修道院，并请求那里的导师们带领他前往女修道院。渡过河流后，他们欣喜地将他领入那里，视他为在教父们中间享有盛名、并在苦修中白发苍苍的修士。当他们祷告后，伟大的长老表达了愿望，要亲自会见所有的女修士。所有人都聚集起来了——唯独伊西多拉没有来。圣皮提里姆说道：「把所有人都带来见我。」当他们回答说：「我们都在这里了，」他说：「这里少了一个，就是天使指示给我的那一位。」于是他们说：「我们这儿有一个疯疯癫癫的，她在厨房里。」「把她也带来，」伟大的长老说，「让我看看她。」于是他们去叫她。但伊西多拉，明白了这件事，不肯顺从；也许她也得到了启示。他们强行带她来，边走边说：「圣皮提里姆想见你。」他的名字是显赫的。当他们把她带来，伟大的长老看到她的脸，看到她头上缠着一块破旧的头巾时，便拜倒在她脚前，说道：「请您赐福于我，母亲。」她也同样拜倒在他脚前，说道：「请您赐福于我，我的主！」众人见此情景，都大为惊异，便开始说：「阿爸！请您不要自取羞辱：她是个疯子！」「你们才是疯子，」圣洁的长老回答道，「而她比你们和我都要好——她是我们的母亲，我祈祷自己在审判之日能与她等同。」
    - type: paragraph
      text:
        ru: 'Услышав это, все с плачем пали ему в ноги, исповедуя, как много огорчали они эту святую. Одна говорила: «Я всегда смеялась над нею». Другая: «Я издевалась над ее смиренным видом». Иная говорила: «Я оскорбляла ее, тогда как она молчала». А та: «Я часто выливала на нее помои». Одна говорила: «Я била ее». Другая: «Я ударяла ее кулаком». Словом, все признавались в каких-нибудь нанесенных ей оскорблениях. Принявши их раскаяние, святой Питирим помолился о них вместе с нею и, много утешив честную рабу Христову, удалился из обители.'
        cn: 听到这话，众人哭泣着俯伏在他脚下，承认他们曾多么地让这位圣女悲伤。有人说：「我总是嘲笑她。」另一个人说：「我嘲弄她谦卑的样子。」又有人说：「我侮辱她，而她却保持沉默。」还有人说：「我经常把脏水泼到她身上。」有人说：「我打她。」另一个人说：「我用拳头打她。」简而言之，所有人都承认曾以某种方式伤害或侮辱过她。圣皮提林（Питирим）接受了他们的忏悔，与圣女一同为他们祷告，并在大大地安慰了基督那可敬的仆人之后，离开了修道院。
    - type: paragraph
      text:
        ru: Спустя несколько дней эта блаженная, не терпя славы, чести, услуг, которые стали оказывать ей все сестры, и тяготясь извинениями, тайно удалилась из монастыря. Куда ушла она, где скрылась и где скончалась, никто не знает доныне. Так подвизалась доблестная, смиренномудрая и блаженная сия девственница.
        cn: 若干天后，这位蒙福者不耐姐妹们向她奉献的荣耀、尊荣与服侍，又厌烦那些致歉，便悄然离开了修道院。她去了哪里，藏身何处，又在哪里逝世，至今无人知晓。这位英勇、谦卑、蒙福的贞女，便是如此修行的。
  - type: heading2
    text:
      ru: Об Иоанне Ликопольском
      cn: 关于约翰·利科波利斯
    children:
    - type: paragraph
      text:
        ru: В Ликополе жил некто по имени Иоанн. Из детства выучился он плотничать, а брат его был красильщик. Достигши двадцатипятилетнего возраста, Иоанн отрекся мира и после пяти лет, проведенных в различных монастырях, один удалился в гору Лико. На самой вершине горы он построил себе келию, состоящую из трех комнат, и в них оставался безвыходно. В одной комнате молился, в другой работал и принимал пищу, третья была назначена для телесных потребностей. Проведши в этом заключении тридцать лет, в течение которых все нужное принимал от прислужника через окно, он удостоился дара пророчества и этим дарованием стал известен всем по самым событиям. Между прочим, он посылал и благочестивому царю Феодосию различные предсказания. Так, например, открыл наперед возмущение мятежников, предсказал и скорую погибель их, предсказал о тиране[18]Максиме, что царь возвратится, одержав над ним победу в Галлии, также о тиране Евгении, что Феодосий победит и его, а сам окончит там дни свои и оставит царство сыну своему. О святости сего мужа везде пронеслась великая слава, и поэтому император Феодосий чтил его как пророка.
        cn: 在利科波利斯住着一位名叫约翰的人。他从小就学会了木工手艺，而他的兄弟是一名染匠。约翰到了二十五岁，就舍弃了尘世，在不同的修道院度过了五年之后，他独自隐退到利科山。在山顶上，他为自己建了一间由三间房间组成的小室，并闭门不出地住在里面。在一间房间里祷告，在另一间工作和进食，第三间则用于生理需要。他在这种幽居中度过了三十年，在此期间，他通过窗户从侍者那里接受一切所需物品，并蒙受了预言的恩赐，凭借此恩赐，他通过实际发生的事件而闻名于世。此外，他也向虔诚的皇帝狄奥多西送去了各种预言。例如，他预先揭示了叛乱者的骚乱，并预言了他们的迅速灭亡；他预言了关于僭主[18]马克西姆，皇帝将在高卢战胜他并凯旋归来；也预言了关于僭主尤金，狄奥多西也将击败他，而皇帝本人将在那里结束自己的生命，并将王位留给他的儿子。这位圣洁之人的盛名传遍各地，因此皇帝狄奥多西尊他为先知。
    - type: paragraph
      text:
        ru: 'Один военачальник приходил к нему узнать, победит ли он ефиопов, которые вторглись в то время в Сиену, что в Верхней Фиваиде, и опустошали ее окрестности. Святой отец сказал ему: «Если пойдешь на врагов, то овладеешь ими, укротишь и покоришь их и будешь в чести у государей». Так и случилось, события подтвердили пророчество. Он сказал также, что благочестивый император Феодосий скончается своею смертию. Вообще он обладал пророческим даром в необыкновенной мере, как об этом слышали мы от живших с ним отцов, которых честность известна была всем тамошним братиям. Они ничего пристрастно не говорили о сем муже, а разве только сообщали в меньшем виде.'
        cn: 一位将领来到他那里询问，他是否能战胜当时入侵上提拜德地区西恩纳，并蹂躏其周边地区的埃塞俄比亚人。圣父对他说：「如果你去攻打敌人，你将制服他们，驯服并征服他们，并会受到君主的尊崇。」事情果真如此发生，事态证实了这预言。他也说过，虔敬的皇帝提奥多西将寿终正寝。总之，他拥有非凡的预言恩赐，正如我们从与他同住的教父们那里听说的，他们的诚实为人所知，受到当地所有修士的认可。他们对这位圣者并未偏袒地说什么，而或许只是有所保留地提及。
    - type: paragraph
      text:
        ru: 'Один трибун просил у аввы позволения привести к нему жену свою, которая давно уже страдала болезнию и теперь, собираясь идти в Сиену, желала видеть святого, чтобы он прежде помолился о ней и с благословением отпустил ее. Но святой не соглашался видеть женщину, так как он, девяностолетний старец, сорок лет безвыходно проживший в келии, никогда не принимал к себе на глаза женщин, даже и из мужчин никто никогда не входил к нему, а только через окно он благословлял и приветствовал приходящих, беседуя с каждым о нуждах его. Сколько трибун ни просил авву, чтобы он позволил прийти к нему жене (авва жил в пустыне на горе, в расстоянии от города на пять стадий), но святой не согласился, говоря: «Невозможно», – и отпустил его со скорбию. Между тем жена день и ночь докучала мужу и с клятвою говорила, что не выйдет никогда из города, если не увидит пророка. Когда муж пересказал блаженному Иоанну о клятве своей жены, святой, видя веру ее, сказал трибуну: «Я в эту ночь явлюсь ей во сне – только чтобы она не искала более видеть лицо мое во плоти». Муж пересказал жене своей слова аввы. И действительно, жена увидела во сне пророка; он пришел к ней и сказал: «Что тебе до меня, жена? Зачем желала ты видеть лицо мое? Разве я пророк или праведник? Я человек грешный и подобострастный вам. Впрочем, я помолился о тебе и о доме мужа твоего, чтобы все было вам по вере вашей. Теперь идите с миром». Сказав это, он удалился. Пробудившись от сна, жена пересказала мужу слова пророка, описала вид его и послала мужа благодарить его. Увидя его, блаженный Иоанн предварил его и сказал: «Вот я исполнил твое прошение: видевши жену твою, я убедил ее, чтобы она уже не искала видеть меня, но сказал ей: “Идите с миром”».'
        cn: 一位护民官请求长老准许把他的妻子带到他那里。他的妻子患病已久，现在正准备前往锡耶纳，渴望见到这位圣者，好让他先为她祷告，并带着祝福送她离开。但这位圣者不同意见这名女子，因为他，一位九十岁的老人，四十年来一直足不出户地住在小室里，从未接见女性；甚至连男性也无人能进入他的房间，而只是通过窗户祝福并问候来访者，与每个人谈论他们的需求。无论护民官如何恳求长老让他准许他的妻子前来（长老住在山上的旷野里，距城五斯塔迪），但圣者没有同意，说：「不可能。」于是悲伤地打发他走了。与此同时，妻子日夜缠磨着丈夫，并发誓说，如果见不到那位先知，她绝不会离开这座城市。当丈夫将妻子的誓言转告给蒙福的约翰时，圣者看到她的信心，便对护民官说：「今夜我将在梦中向她显现——只是为了让她不再寻求亲眼见到我的面容。」丈夫将长老的话转告给妻子。果真，妻子在梦中见到了那位先知；他来到她面前说：「妇人，我与你何干？你为何想见我的面容？难道我是先知或义人吗？我是一个罪人，与你们一样有情感。话虽如此，我已为你和你的夫家祷告，愿你们一切都照着你们的信心成就。如今你们平安地去吧。」说完这些，他便离开了。从梦中醒来后，妻子将先知的话转告给丈夫，描述了他的样貌，并打发丈夫去感谢他。蒙福的约翰见到他时，抢先对他说：「看，我已应允了你的请求：我已见到你的妻子，并说服她，让她不再寻求见到我，而是对她说：『你们平安地去吧。』」
    - type: paragraph
      text:
        ru: 'Жене другого сановника пришло время родить в его отсутствие. В тот самый день, как она, разрешившись, от скорби опасно занемогла, муж ее был у аввы Иоанна. Святой сообщает ему радостную весть, говоря: «Если бы ты знал дар Божий – то, что сегодня родился тебе сын, ты прославил бы Бога. Только мать его была в опасности. Когда ты придешь домой, младенцу исполнится семь дней. Дай ему имя Иоанн и, рачительно воспитав его до семилетнего возраста, отошли к монахам в пустыню».'
        cn: 另一位高官的妻子到了分娩的时候，而他不在场。就在她分娩后，因悲伤而病重垂危的那一天，她的丈夫正在阿爸约安那里。圣者告诉他这个好消息，说：「若你了解神的恩赐——就是今天你得了一个儿子，你就会颂赞神。只是他的母亲曾处在危险之中。当你回家时，婴儿将满七天。给他取名约安，并悉心将他抚养到七岁，然后将他送到旷野中的修士们那里。」
    - type: paragraph
      text:
        ru: Такие чудеса творил Иоанн для приходивших из чужих стран, а согражданам, которые постоянно приходили к нему по своим нуждам, он предрекал и будущее, и обнаруживал тайные дела каждого, предсказывал и о разлитии Нила, и о том, плодотворно ли оно будет. Подобным образом наперед возвещал и об угрожавшем им каком-либо наказании Божием и обличал виновных. Сам блаженный Иоанн явно не совершал исцелений, но давал елей, которым исцелялись весьма многие из страждущих. Так, жена одного сенатора, лишившись зрения от бельма, просила своего мужа отвести ее к Иоанну. Тот уверял ее, что Иоанн никогда не принимает женщин, но жена требовала, чтобы он один сходил к авве и попросил молитв о ней. Когда святой сделал это и послал елея, больная, мазавши им глаза три раза в день, через три дня прозрела и пред всеми возблагодарила Бога.
        cn: 约翰为那些从异乡而来的人行了这些神迹，而对那些因自己的需要而常来找他的同乡，他则预言未来，揭示每个人的隐秘行为，预言尼罗河的泛滥以及它是否会带来丰收。同样，他预先宣告降临在他们身上任何来自神的惩罚，并责备有罪之人。蒙福的约翰本人并没有明显地施行医治，而是赐予圣油，许多受苦之人借此得以痊愈。例如，一位元老院议员的妻子，因白内障失明，请求她的丈夫带她去见约翰。她的丈夫向她保证，约翰从不接见女性，但妻子坚持让他独自去见阿爸，并为她祈求祷告。当这位圣徒这样做并送去圣油时，病人每天用圣油涂抹眼睛三次，三天后便重见光明，并在众人面前感谢上帝。
    - type: paragraph
      text:
        ru: 'Нас было семь братий (все пришельцы) в Нитрийской пустыне: я, блаженный Евагрий, Альбин, Аммоний и другие. Мы старались узнать в точности, какова добродетель Иоанна. И вот Евагрий говорит: «Мне хотелось бы узнать о достоинстве сего мужа от человека, умеющего судить об уме и словах. Если узнаю, то побываю у него; если же не узнаю, как он живет, то не пойду к нему в гору». Услышав это и не сказав никому ни слова, я помедлил один день, а на другой запер свою келию и, поручив себя Богу, отправился в Фиваиду. Иногда я шел пешком, иногда плыл водою и кончил свое путешествие в восемнадцать дней. (Это было во время полноводия, когда бывает много больных; занемог и я.) Пришедши к Иоанну, я нашел у него сени запертыми (впоследствии братия построили перед келией святого пространные сени, в которых могло помещаться человек сто). Эти сени они запирали ключом на целую неделю и отворяли их только по субботам и воскресеньям. Итак, узнав, почему сени заперты, я дождался субботы и тогда во втором часу дня пришел к праведному мужу. Я нашел его сидящим у окна, через которое он, кажется, всегда беседовал с посетителями. Сделав мне приветствие, он спросил через переводчика: «Откуда ты и зачем пришел сюда? Кажется, ты из Евагриева братства?».'
        cn: 我们有七位兄弟（都是客居者）在尼特里亚旷野：我，蒙福的叶瓦格里，阿尔宾，阿莫尼和其他人。我们力求精确地了解约翰的德行如何。于是叶瓦格里说：「我希望能从善于判断心智和言语的人那里了解这位修士的德性。如果我了解了，我就会去拜访他；如果我不知道他如何生活，我就不会上山找他。」听到这话，我一言不发，耽搁了一天，第二天就锁上自己的小室，将自己交托给上帝，前往提拜德。我有时步行，有时乘船水路，十八天后结束了我的旅程。（当时正值洪水期，许多人患病；我也病了。）抵达约翰那里时，我发现他的门廊是锁着的（后来，修士们在圣人的小室前建造了宽敞的门廊，能够容纳约一百人）。这些门廊他们用钥匙锁着整整一周，只在周六和周日开放。于是，了解了门廊上锁的原因后，我等到周六，然后在那天白天的第二小时来拜访这位义人。我发现他正坐在窗边，他似乎总是通过这扇窗与访客交谈。他向我致意后，通过一位译者问道：「你从何处来，为何到此？看来，你是叶瓦格里弟兄会的吗？」
    - type: paragraph
      text:
        ru: 'Между тем как мы разговаривали, вошел правитель той области по имени Алипий. При его приближении Великий прекратил беседу со мною, а потому я отошел немного в сторону, чтобы не мешать им. Но так как разговор их был продолжителен, то мне скучно стало, и я начал роптать на старца, что меня он презрел, а того почтил. В таком расположении духа я уже решился было удалиться с презрением к старцу. Но раб Христов подозвал к себе переводчика именем Феодор, и сказал ему: «Поди скажи брату тому: “Не малодушествуй; сейчас отпущу правителя и буду говорить с ним”». Тогда я уверился, что он человек духовный и все знает наперед. Ободрившись этим, я подождал.'
        cn: 正当我们交谈的时候，那地方的执政官走了进来，名叫阿利比。他走近时，圣者便停止了与我的交谈，于是我便稍微走到一旁，以免打扰他们。但由于他们的谈话很长，我感到无聊起来，便开始对那位长老心生抱怨，觉得他轻视了我，却看重那个人。在这样的心情下，我已下定决心要带着对那位长老的蔑视离开。但基督的仆人招手叫来了一位名叫忒俄多尔的翻译，对他说：「你去告诉那个弟兄：『不要气馁；我现在就让执政官离开，然后会和他说话。』」于是我便确信他是一位属灵的人，并且预知一切。受到这番话的鼓舞，我便等候着。
    - type: paragraph
      text:
        ru: 'Когда правитель вышел, святой подзывает меня к себе и говорит: «Зачем ты огорчился на меня? Чем я оскорбил тебя, что ты возымел такие мысли, которые и мне несвойственны, и тебе неприличны? Разве не знаешь сказанного в Писании:«…не требуют здравии врача, но болящии»(Мф. 9, 12)? Тебя я всегда могу найти, когда захочу, равно и ты меня. Если я и не дам тебе наставления, так дадут другие братия, другие отцы. А этот человек, по причине мирских дел бывший во власти диавола, едва улучил свободный час, как раб, избавившийся от жестокого господина, и пришел ко мне, чтобы получить пользу, поэтому странно было бы, если бы я, оставив его, занялся тобою – таким человеком, который непрестанно печется о спасении души своей».'
        cn: 当官长出去后，圣者把我叫到他身边，说：「你为何因我而忧伤？我何处冒犯了你，以至于你产生了那些既不符合我的心意，也对你而言是不相称的想法？难道你不知道圣经上说的话吗？『康健的人用不着医生，有病的人才用得着。』（马太福音 9:12）我何时想见你，总能找到你；你也一样能找到我。即使我没有给你教诲，其他弟兄、其他教父也会给你。而这个人，因为世俗的事务曾受魔鬼的辖制，刚刚才觅得空闲时间，就像一个摆脱了残酷主人的奴仆，来到我这里寻求益处，所以，如果我撇下他而顾及你——这样一个持续不断地关心自己灵魂得救的人，那将是奇怪的。」
    - type: paragraph
      text:
        ru: 'Я просил его помолиться о мне и совершенно удостоверился, что он точно муж духовный. Приняв ласковый вид и легко ударяя меня правою рукою по левой щеке, он сказал: «Тебя ожидает множество скорбей; ты много уже боролся с помыслом выйти из пустыни, много страхов испытал и победил, но демон еще возмущает тебя, представляя тебе благочестивые и благовидные предлоги; он соблазняет тебя желанием повидаться с отцом и уговорить брата и сестру к монашеству. Вот скажу тебе добрую весть: оба они спасены, потому что отреклись от мира, а отец твой проживет еще семь лет. Итак, оставайся в своей пустыне и не возвращайся для них на родину, ибо писано:«…никтоже возложь руку свою на рало и зря вспять, управлен есть в Царствии Божии»(Лк. 9, 62)». Получив от слов богодухновенного мужа достаточное назидание и обличение, я возблагодарил Бога, что предлоги, побуждавшие меня оставить пустыню, устранены предвидением святого мужа.'
        cn: 我请他为我祷告，并且完全确信他确实是一位属灵的人。他面带慈祥，轻轻地用右手拍了拍我的左脸颊，说道：「你将面临许多苦难；你已为离开旷野的念头挣扎许久，经历并战胜了许多恐惧，但魔鬼仍在搅扰你，向你呈现虔诚而冠冕堂皇的借口；它引诱你渴望与父亲相见，并劝说兄弟姐妹修道。我现在告诉你一个好消息：他们二人都已得救，因为他们已弃绝世界，而你的父亲还会活七年。所以，你留在你的旷野里，不要为了他们而回到故乡，因为经上记着说：『……凡手扶着犁向后看的，不配进神的国』（路加福音 9:62）。」我从这位蒙神启示的人的话语中得到了充分的教导和责备，便感谢上帝，感谢那些促使我离开旷野的借口，已被这位圣徒的预见所消除。
    - type: paragraph
      text:
        ru: 'Потом он опять с ласковым видом сказал мне: «Хочешь быть епископом?». Я отвечал, что я уже епископ. «Какого города?» – спросил святой. Говорю ему: «Я надзираю за яствами, столами и глиняными чашами; если вино кисло, ставлю его в сторону, если хорошо, пью; надзираю и за горшками и, если в них мало соли или какой приправы, тотчас подбавляю и потом ем. Вот мое епископство! А поставило меня чревоугодие». Блаженный, улыбнувшись, сказал: «Оставь шутки! Ты будешь рукоположен во епископа и много испытаешь трудов и скорбей. Если хочешь избежать их, не выходи из пустыни: в пустыне никто не может рукоположить тебя во епископа».'
        cn: 之后，他又带着慈祥的神情对我说：「你想当主教吗？」我回答说，我已经是主教了。「哪个城市的主教？」圣者问道。我对他说：「我监管食物、餐桌和陶碗；如果酒是酸的，我就把它放在一边，如果好的，我就喝；我也监管锅具，如果里面盐少了或调料不够，我就立刻添加，然后吃。这就是我的主教职分！而让我担任此职的，是贪食。」蒙福者微笑着说：「别开玩笑了！你将被按立为主教，并会经历许多辛劳和苦楚。如果你想避免这些，就不要走出旷野：在旷野里没有人能按立你为主教。」
    - type: paragraph
      text:
        ru: Оставив его, я возвратился в свою любезную пустыню и все это рассказал святым отцам о блаженном и духоносном Иоанне. Спустя два месяца они по реке отправились к святому мужу и беседовали с ним. А я, несчастный, забыл слова его. По прошествии трех лет занемог я от расстройства в печени и желудке, и братия отправили меня из пустыни в Александрию, потому что болезнь моя грозила превратиться в водяную. Из Александрии врачи присоветовали мне отправиться в Палестину для перемены воздуха, потому что там воздух легче, нежели в наших странах. Из Палестины я прибыл в Вифинию, и здесь – не знаю, как сказать, по человеческому ли расположению или по воле Вышнего (один Бог знает), – я удостоился рукоположения, которое выше меня. Приняв участие в деле блаженного Иоанна (Златоустого, архиепископа Константинопольского), я принужден был одиннадцать месяцев скрываться в мрачной келии и здесь вспомнил, что блаженный и чудный тот муж, то есть Иоанн Ликопольский, предрек мне случившееся теперь.
        cn: '离开他之后，我回到了我心爱的旷野，并将这一切都告诉了圣教父们，关于那位蒙福且充满灵性的约安。两个月后，他们沿着河流前往那位圣洁的人那里，并与他交谈。而我，不幸之人，却忘记了他的话。


          三年过后，我因肝脏和胃部不适而生病，弟兄们将我从旷野送到了亚历山大，因为我的病情有转为水肿的危险。从亚历山大，医生们建议我前往巴勒斯坦以改变空气，因为那里的空气比我们这里更轻盈。从巴勒斯坦我抵达了比提尼亚，在这里——我不知该如何说，是出于人的安排，还是出于至高者的旨意（唯有上帝知晓）——我被授予了高于我本人的圣职。在参与了蒙福的约安（金口，君士坦丁堡大主教）的事工后，我被迫在阴暗的独修室中隐藏了十一个月，在此我回忆起，那位蒙福而奇妙的人，即利科普利斯基的约安，曾预言了我现在所发生的一切。'
    - type: paragraph
      text:
        ru: Сей великий подвижник Христов еще рассказывал мне (и этим рассказом, конечно, хотел внушить мне решимость никогда не оставлять пустыни), что он уже сорок восьмой год живет в своей келии и во все это время ни разу не видел ни женщины, ни монеты, также и его никто не видел, как он ел или пил.
        cn: 这位基督的伟大苦修者还告诉我（当然，他想通过这个故事，坚定我永不离开旷野的决心），说他已经在他自己的隐修小室里居住了第四十八个年头，而且在这整个期间，他从未见过女人，也未见过钱币，也没有人见过他吃饭或喝水的情形。
    - type: paragraph
      text:
        ru: 'Я говорил уже, что спустя два месяца после меня ходили к сему святому отцы из нашей пустыни. Они рассказывали о своем свидании с ним следующее: «Когда мы пришли, блаженный приветствовал нас, обращаясь к каждому с веселым лицом, а мы прежде всего просили его помолиться о нас (такой обычай у всех египетских отцов). Потом он спросил, нет ли кого с нами из клириков? Когда мы отвечали, что нет, он, осмотревши всех, узнал, что между нами есть клирик, но скрывается. (С нами действительно был один диакон, но об этом никто не знал, кроме его брата, которому он, по смирению, запретил сказывать о сем, почитая себя в сравнении с такими святыми едва достойным и имени христианина, не только этого сана.) Указав на него рукою, преподобный сказал всем: “Вот диакон”. Когда он, желая скрыть свое звание, продолжал отрицаться, святой, взяв его за руку, облобызал его из окна и, вразумляя, сказал: “Чадо! Не отметай благодати Божией и не лги, отрицаясь от дара Христова; ложь чужда Христу и христианам, по малому или по важному делу будет она сказана. Если даже для доброй цели говорят ложь, и это не похвально, ибо ложь, по слову Спасителя, от диавола есть (Ин. 8, 44)”. Обличенный молчал и принял кроткое обличение старца. Когда же мы совершили молитву, один из наших спутников, уже три дня страдавший сильною горячкою, стал просить у аввы исцеления. Авва сказал, что болезнь сия послужит к его же пользе и постигла его за маловерие, но в то же время дал ему елея и приказал мазаться. Когда он сделал это, последовало извержение чрез уста всего, что было внутри, и горячка прошла совсем, так что он на своих ногах пошел в гостиницу».'
        cn: 我之前说过，在我之后过了两个月，我们旷野中的父亲们去拜访了这位圣者。他们是这样讲述与他会面的：「我们到来时，这位蒙福者欢迎我们，对每一个人都面带喜色，而我们首先请求他为我们祷告（这是所有埃及教父们的习俗）。之后他问道，我们当中有没有圣职人员？当我们回答说没有时，他审视了所有人，发现我们当中有一位圣职人员，但他正隐藏着。（我们当中确实有一位执事，但除了他的兄弟，没有人知道这件事，他出于谦卑，禁止他的兄弟说出这件事，因为他认为自己与这些圣者相比，甚至连基督徒的名字都不配，更不用说这个圣职了。）他用手指着那人，这位可敬者对所有人说：『这位是执事。』当他仍旧否认，想要隐藏自己的身份时，这位圣者握住他的手，从窗户亲吻了他，并劝诫说：『孩子！不要否认上帝的恩典，也不要撒谎，否认基督的恩赐；谎言与基督和基督徒是格格不入的，无论它是在小事上还是在大事上被说出。即使为了好的目的说谎，这也不值得称赞，因为谎言，按照救主的话，是出自魔鬼的（约翰福音 8:44）。』被斥责的人沉默了，并接受了长老温柔的斥责。当我们结束祷告后，我们的一位同伴，已经三天高烧不退，开始向阿爸请求医治。阿爸说，这疾病将对他有益，并且是因为他的小信临到他身上，但与此同时，给了他油并吩咐他涂抹。当他照做之后，他口中吐出了体内所有的东西，并且高烧完全退去，以至于他能够自己步行回到客栈。」
    - type: paragraph
      text:
        ru: 'Святой Иоанн имел уже девяносто лет от роду, и тело его так иссохло от подвижничества, что и волосы не росли на бороде его. Пищу его составляли одни плоды, да и их вкушал он уже по захождении солнца. В столь глубокой старости после такой многотрудной жизни он не ел ни хлеба и ничего другого, приготовляемого на огне. Когда он приказал нам сесть, мы возблагодарили Бога за свидание с сим мужем. Он принял нас, как родных, и с веселым видом спросил: «Откуда вы, дети? Из какой страны пришли к человеку грешному?». Как скоро объявили мы о нашем отечестве и сказали, что пришли к нему ради пользы душевной из Иерусалима, дабы глазами увидеть, что слышали (ушам можно верить менее, нежели глазам: слышанное часто забывается, а память виденного не изглаждается, и событие как бы впечатлевается в душе), блаженный отвечал нам: «Зачем шли вы так далеко и изнуряли себя, возлюбленные дети? Что вы увидите здесь замечательного? Захотели вы видеть смиренных и ничтожных людей, на которых не стоит и смотреть и в которых ничего нет особенного. Достойные удивления и похвалы есть везде, где только в церквах читаются Божии пророки и апостолы – им-то должно подражать. А я очень удивляюсь вам и вашему усердию. Как вы, презревши столько опасностей, пришли, ради назидания, к нам, тогда как мы, по лености, не хотим выйти из своей пещеры. Но и теперь, хотя ваше дело и заслуживает похвалы, не думайте, что, сделав это доброе дело, вы все сделали, а подражайте добродетелям ваших отцов. Если вы и приобрели все их добродетели (что редко бывает), и тогда не должны полагаться на себя. Многие от такой самоуверенности падали в то время, когда были уже на самой высоте добродетелей.'
        cn: 圣约安那时已九十岁高龄，他的身体因着苦修而枯槁，以至于他的胡须上也不长毛发了。他的食物只有果子，并且他只有在日落之后才食用。在如此高龄之下，经历如此劳苦的一生之后，他既不吃面包，也不吃任何经火烹制的东西。当他吩咐我们坐下时，我们为能与这位长者会面而感谢上帝。他待我们如亲人一般，并以愉快的表情问道：「孩子们，你们从哪里来？你们从哪个国家来探望一个罪人呢？」当我们立即表明我们的祖国，并说我们从耶路撒冷来探望他，为的是灵魂的益处，好能亲眼看到我们所听闻的（因为耳朵所信的少于眼睛所信的：听到的常常被遗忘，而所见之事的记忆却不会磨灭，仿佛事件被铭刻在灵魂中一样），那位蒙福者回答我们说：「你们为何走了这么远的路，并使自己疲惫不堪，亲爱的孩子们？你们在这里能看到什么特别之处呢？你们是想看到谦卑而微不足道、不值得一看、并且身上也无任何特别之处的人吗？值得惊奇和赞扬的人随处可见，只要在教堂里宣读上帝的先知和使徒的教导——正是他们才应受效法。而我却非常惊奇于你们和你们的热忱。你们怎能藐视如此多的危险，为着教益来到我们这里，而我们却因着懒惰，不愿走出自己的洞穴呢？但是现在，虽然你们的行动值得称赞，也不要以为，做了这件善事，你们就已做完了一切，而是要效法你们父辈们的德行。即使你们获得了他们所有的德行（这很少发生），那时也不应自恃。许多人正是因为这种自恃而跌倒，在他们已达德行巅峰之时。
    - type: paragraph
      text:
        ru: Смотрите, хорошо ли молитесь, не омрачается ли чистота вашей мысли, не развлекается ли ум ваш во время молитвы другими заботами, какой-нибудь другой помысл, вошедши в душу, не обращает ли вашего внимания на посторонние предметы. Не возмущает ли вашу душу память о каких-либо нечистых пожеланиях. Смотрите, искренно ли ваше отречение от мира, не затем ли вы пришли сюда, чтобы воспользоваться нашею свободою, не ищете ли в добродетелях суетной славы, дабы только явиться пред людьми подражателями нашим делам. Смотрите, чтобы вас не возмущали какая страсть, честь, слава и похвала людская или притворное благочестие и самолюбие. Не почитайте себя праведными, не хвалитесь праведностью. Во время молитвы не развлекайтесь ни воспоминанием о сродниках, ни чувством сострадания, ни мыслию о другой какой-нибудь вещи или о всем мире, иначе суетно будет дело ваше, когда во время собеседования с Господом вы будете уноситься долу влекущими в противную сторону помыслами. Такое падение ума случается со всяким, кто не всецело отрекся мира, но еще старается угождать ему. Душу его развлекают множеством замыслов различные плотские и земные попечения, и ум, борясь со страстями, уже не может видеть Бога. Да и не должен он ревностно стараться о самом познании Бога, чтобы ему, будучи недостойным такого приобретения, удостоившись и малой части оного, не подумать о себе, будто постигнул все, и не подвергнуться совершенной погибели.
        cn: 察看，你们祷告得好不好，你们思想的纯洁是否受到蒙蔽，你们的心思在祷告时是否被其他世务所分心，是否有别的意念进入灵魂，将你们的注意力转向外物。不洁净的欲念的记忆是否搅扰了你们的灵魂。察看，你们是否真诚地弃绝了世界，你们来这里是否仅仅是为了利用我们的自由，你们是否在美德中寻求虚浮的荣耀，以便仅仅在人前显现为我们行为的模仿者。察看，不要让你们被任何情欲、人的尊荣、荣耀和称赞，或虚伪的虔敬和自爱所搅扰。不要自以为义，不要夸耀自己的义。在祷告时，不要被无论是对亲属的回忆、怜悯之心，还是对任何其他事物或对整个世界的思念所分心，否则你们的努力将是虚妄的，因为当你们与主交谈时，却被那些将你们拉向下方的、引向相反方向的念头所带走。这种心思的坠落会发生在每一个不全然弃绝世界，却仍试图取悦于世界的人身上。他的灵魂被许多思虑、各种肉体和属世的忧虑所分扰，而心思与情欲搏斗，已无法看见上帝。他也不应热切追求对上帝本身的认识，以免他，在不配获得如此恩赐的情况下，即便有幸获得其中一小部分，却自以为领悟了一切，从而陷入完全的灭亡。
    - type: paragraph
      text:
        ru: 'К Богу надобно приближаться со страхом и постепенно, соразмерно тому, сколько каждый может умом идти вперед и сколько это вообще доступно человеку. Кто ищет Бога, у того сердце должно быть свободно от всего постороннего, по Писанию:«Упразднитеся и разумейте, яко Аз есмь Бог»(Пс. 45, 11). Когда же он удостоится познать Бога отчасти (совершенно познать Его никто не может), то вместе с сим получает познание и о всех прочих предметах: видит тайны, потому что Бог показует ему, провидит будущее, созерцает откровения наравне со святыми, творит чудеса, становится другом Божиим и получает от Бога все просимое».'
        cn: 应当怀着敬畏之心，循序渐进地亲近上帝，这要与每个人心智所能进步的程度相称，并依循其对人整体而言的可及程度。凡寻求上帝的人，他的心就必须摆脱一切外在事物，正如《圣经》所言：「你们当安静，要知道我是上帝」（诗篇 45:11）。当他蒙准部分地认识上帝时（因为没有人能够完全认识祂），他也会由此获得对所有其他事物的认识：他看见奥秘，因为上帝会向他显明；他预见未来，与圣徒们一样默观启示，行神迹，成为上帝的朋友，并从上帝那里获得他所祈求的一切。
    - type: paragraph
      text:
        ru: Много еще говорил Иоанн и о подвижничестве, и о том, что смерти должно ожидать как перехода к лучшей жизни и что не должно слишком заботиться о немощах плоти и наполнять чрево чем ни случится, ибо у пресыщенного рождаются такие же вожделения, как и у сластолюбца. Но должно стараться, говорил он, трудами подвижническими приобрести свободу от страстных пожеланий. Никто не должен искать удобств житейских и покоя, но надобно терпеть ныне тесноту и скорби, чтобы наследовать широту Царствия Божия.«Яко многими скорбьми, – говорит Писание, –подобает нам внити во Царствие Божие»(Деян. 14, 22); и еще:«что узкая врата, и тесный путь вводяй в живот, и мало их есть, иже обретают его. …Яко пространная врата и широкий путь вводяй в пагубу, и мнози суть входящии им»(Мф. 7, 14, 13). Как имеющие отойти после краткой жизни на вечный покой, мы не должны заботиться много о мирском. Не должно также, говорил он, превозноситься своими подвигами, но всегда надобно смиряться и удаляться в глубочайшие пустыни, как скоро кто приметит в себе движение гордости. Жизнь вблизи селений вредила часто и совершенным мужам. По сему и Давид, испытавший подобное искушение, говорит в псалме:«Се, удалихся бегая и водворихся в пустыни. Чаях Бога спасающего мя от малодушия и от бури»(Пс. 54, 8–9). Многие из наших братий подверглись этому же искушению и по тщеславию уклонились от цели.
        cn: 约翰还讲了很多关于苦修的事，以及人应当将死亡视为通往更美好生命的过渡，不应过于忧虑肉体的软弱，也不应随意填饱肚腹，因为过度饱食者会生发出与好色之徒同样的贪欲。但他说道，人应当努力，借着苦修的劳作，获得脱离情欲的自由。无人应寻求世俗的便利与安逸，但现今必须忍受狭窄和苦难，以便承受上帝国度的宽广。正如经上说：「我们必须经历许多患难才能进入上帝的国。」（使徒行传 14:22）；又说：「引到永生的门是窄的，路是小的，找到的人也很少。……引到灭亡的门是宽的，路是大的，进去的人也多。」（马太福音 7:14，13）作为短暂生命之后即将进入永恒安息的人，我们不应过多地关注世俗之事。他还说，也不应因自己的苦修而自高自大，但永远必须谦卑，并退隐到最深的旷野之中，一旦有人察觉到内心生出骄傲之念。居住在村庄附近常常也损害了那些完美的圣徒。因此，经历过类似诱惑的大卫在诗篇中说：「看哪，我逃离并居于旷野。我等待上帝，祂将我从怯懦和暴风中拯救。」（诗篇 55:8-9）我们许多弟兄也曾遭受同样的诱惑，并因虚荣而偏离了目标。
  - type: heading2
    text:
      ru: Сказание аввы Иоанна о брате покаявшемся
      cn: 阿巴约翰关于悔改弟兄的记述
    children:
    - type: paragraph
      text:
        ru: 'В одном городе, сказывал авва Иоанн, был юноша, весьма много делавший худого и тяжко грешивший, который, однако, по милости Божией пришел в сокрушение о своих многих грехах. Он поселился в пещере при гробах и оплакивал прежнюю жизнь свою. Повергаясь лицом на землю, не осмеливался он выговорить молитвенное слово, ни произносить имя Божие, но прежде смерти заключился в гробницах и, почитая себя недостойным жизни и отрекшись ее, только стенал из глубины сердца. Когда так провел он седмицу, ночью восстают на него демоны, виновники его прежней худой жизни, с криком и воплями: «Где тот нечестивец, пресыщенный любострастием? Он, теперь негодный для нас, явился целомудренным и добрым и хочет быть благонравным христианином, когда уже не может! Исполненный нашим злом, какого добра ты ожидаешь себе? Ужели не скоро отсюда пойдешь за нами на обычные дела свои? Тебя ждут блудницы и корчемники – ужели не пойдешь наслаждаться утехами сладострастия, когда для тебя потеряна всякая другая надежда? Скоро, конечно, постигнет тебя суд, когда ты так губишь себя. Что же спешишь на мучение, несчастный? Что усиливаешься ускорить свою казнь?». И много другого говорили они ему, например: «Ты наш, с нами соединился, делавши всякое беззаконие; ты нам во всем был покорен и теперь осмеливаешься оставить нас? Что же не отвечаешь? Не пойдешь с нами?». Но он среди непрерывных стенаний не слушал их и не отвечал им ни слова, сколько ни нападали на него демоны. Когда же, многократно повторяя это, они ничего не успели, то схватили его и начали тяжко бить и терзать все тело его и, жестоко измучив, оставили полумертвым. Лежа неподвижно там, где оставили его демоны, он, однако ж, тотчас начал свои стенания, как скоро пришел в себя. Между тем искавшие его сродники, нашедши его и узнав, кем он так был изъязвлен, хотели отвести его домой, но он не согласился, несмотря на многократные их убеждения.'
        cn: '阿瓦·约安讲述了一个故事：在一个城市里，有个年轻人曾做了许多坏事，犯下了重罪。然而，因着上帝的恩典，他为自己的众多罪孽感到懊悔。他住进了墓旁的洞穴里，哀悼自己过去的生命。他俯伏在地，不敢说出一句祷告的话，也不敢说出上帝的名字，而是在死前将自己关在坟墓里，认为自己不配活着，并且拒绝了生命，只是从心底深处呻吟。


          当他这样度过一周后，夜里，那些引发他先前罪恶生活的恶魔们向他发起袭击，他们喊叫着、哭嚎着：「那个沉溺于肉欲的邪恶之人去哪了？他，现在对我们来说毫无用处，竟然变得贞洁善良，想成为一个有德行的基督徒，而他已经不可能了！你充满着我们的邪恶，还期待自己有什么好处呢？难道你不会很快就离开这里，跟着我们去干你那些老勾当吗？妓女和酒店老板在等你——难道你不会去享受那些肉欲的欢愉吗，当所有其他希望都为你失去的时候？当然，审判很快就会降临在你身上，当你这样自取灭亡时。你为什么要急着受苦呢，可怜人？你为什么要加速你的处决呢？」他们还对他说了很多其他的话，比如：「你是我们的，你与我们结合，做了所有不法之事；你凡事都顺从我们，现在却敢离开我们？你为什么不回答？你不跟我们走吗？」但他在一连串的呻吟中没有听他们的话，也没有回答他们一个字，无论恶魔们如何攻击他。


          当他们多次重复这些话却一无所获时，他们就抓住他，开始狠狠地殴打和折磨他的全身，残酷地折磨他后，将他丢下，半死不活。他一动不动地躺在恶魔们丢下他的地方，然而，一旦他恢复了知觉，他立刻又开始呻吟起来。与此同时，他的亲戚们在寻找他，找到他后，得知他是被谁伤害的，想带他回家，但他不同意，尽管他们多次劝说。'
    - type: paragraph
      text:
        ru: 'В следующую ночь демоны нападают на него еще с большею лютостию, чем в прошедшую. Но и теперь сродники не могли уговорить его, чтобы оставил это место. Лучше, говорил он, умереть, нежели жить в греховных нечистотах. В третью ночь демоны так жестоко избили его, что едва совсем не лишили жизни. Но, не успевши и теперь победить его и оставив его бездыханным, они ушли и, уходя, кричали: «Ты победил, победил!». После этого он уже не испытывал таких страшных искушений – напротив, до самой кончины безбоязненно жил в пещере при гробах, подвизаясь в чистой добродетели, и так был прославлен от Бога знамениями и чудесами, что во многих возбудил удивление и ревность к добру. Даже весьма многие и из предавшихся отчаянию стали совершать добрые дела и подвиги, и сбылось над ними слово Писания:«всяк... смиряяй себе вознесется»(Лк. 18, 14). Итак, чада, особенно будем подвизаться в смиренномудрии: оно – основание всех добродетелей. Весьма полезна нам для сего подвижничества и пустыня, более удаленная от селений.'
        cn: 在接下来的夜晚，魔鬼比前一晚更凶猛地袭击了他。但即使这次，他的亲属也未能说服他离开这个地方。他说，宁可死去，也不愿活在罪恶的不洁之中。在第三晚，魔鬼如此 жесто地殴打他，以至于几乎完全夺去了他的性命。然而，即使是这次，他们也未能战胜他，便将他丢下，气息全无，他们离开了，离开时，他们喊道：「你赢了，你赢了！」此后，他不再经历如此可怕的诱惑——相反地，直到他去世为止，他毫无畏惧地住在坟墓旁的洞穴里，在纯洁的德行中苦修，并因此被上帝以神迹和奇事所荣耀，以至于在许多人心中激发起惊叹和对良善的热忱。甚至许多陷入绝望的人也开始行善和苦修，于是圣经上的话语应验在他们身上：「凡自卑的，必升为高」（路加福音 18:14）。所以，孩子们，我们尤其要在谦卑中苦修：它是所有德行的根基。对于这种苦修，那远离人烟的旷野对我们也非常有益。
  - type: heading2
    text:
      ru: Другое сказание аввы Иоанна о падшем и покаявшемся
      cn: 阿爸约翰的另一则关于堕落并悔改者的记述
    children:
    - type: paragraph
      text:
        ru: 'Был еще и другой монах, живший в дальней пустыне и много лет подвизавшийся в добродетели. Наконец уже в старости подвергся он искушению от демонов. Подвижник любил безмолвие и, проводя дни в молитвах, песнопениях и созерцании, имел несколько божественных видений и в бодрственном состоянии, и во сне. Он почти уже достиг бестелесной жизни: не возделывал земли, не заботился о пропитании, не искал в растениях и травах пищи для тела, не ловил ни птиц, ни других каких животных, но, исполненный упования на Бога, с тех пор как из мира перешел в пустыню, нисколько не думал о том, как напитать свое тело. Забыв все добровольно, он все желание свое устремлял к Богу в ожидании часа, когда воззван будет из сего мира; питался же более всего сладостию видений и надежд. Между тем и тело у него не слабело от напряжения, и душа не теряла бодрости – такой твердый навык приобрел он в благочестии!'
        cn: 还有另一位修士，住在一个遥远的旷野里，多年在美德中操练自己。最终在他年迈之时，他遭受了魔鬼的试探。这位修行者喜爱静默，日复一日地祷告、唱诗和默观，无论是在醒着的时候，还是在睡梦中，都有过数次神圣的异象。他几乎已经达到了脱离肉身的生活：他不耕种土地，不忧虑食物，不在植物和草药中寻找身体的食物，不捕捉鸟类或任何其他动物，但他充满着对上帝的信赖，自从他从尘世转向旷野后，丝毫没有考虑如何滋养自己的身体。他自愿地忘却了一切，将自己所有的渴望都倾注于上帝，等待着被召离世的时刻；他主要以异象和希望的甘甜为食。与此同时，他的身体没有因劳苦而衰弱，他的灵魂也没有失去振奋——他在虔诚上获得了如此坚实的操练！
    - type: paragraph
      text:
        ru: Впрочем, Бог, милуя его, в определенное время посылал ему на трапезу хлеб на два или на три дня, которым он и питался. Всякий раз, как, ощутив в себе потребность пищи, входил он в свою пещеру, находил там пищу. По принесении Богу молитвы подкреплял он себя пищею и потом услаждался песнопениями. Молитва и созерцание были постоянным его занятием. Так он с каждым днем совершенствовался и, подвизаясь в настоящем, постоянно ближе становился к ожидаемому будущему и почти уверен был в лучшем жребии своем, как бы уже имея его в руках, что и было причиною того, что он едва не пал от постигшего его затем искушения.
        cn: 然而，上主怜悯他，在特定的时刻给他送来够两三天吃的面包作为餐食，他便以此为生。每当他感到需要食物，进入自己的洞穴时，就会在那里找到食物。在向主献上祷告之后，他便借食物补充体力，之后沉浸于圣歌之中。祷告与默观是他恒常的操练。如此，他日渐完善，在今世中克己修持，不断靠近所期盼的未来，几乎确信自己将得享更美好的福分，仿佛那福分已然握于他手；而这正是导致他险些在随后而来的试探中跌倒的原因。
    - type: paragraph
      text:
        ru: Когда он дошел до такой уверенности, в сердце его неприметно вкралась мысль, что он выше других и что он знает и имеет больше прочих людей. В таких мыслях он стал уже полагаться на себя, а отсюда скоро рождается в нем беспечность, сначала небольшая, потом она растет все больше и становится заметною. Уже он не с такою бодростию встает от сна для песнопений, ленивее стал к молитве и пение его не так было продолжительно; душа захотела покоиться, ум пал долу, и помыслы стали блуждать; беспечность втайне была уже любима, и только прежний навык, как оплот, несколько останавливал подвижника в этом стремлении и охранял его до времени. Еще, входя по вечерам после обычных молитв в пещеру, он иногда находил на трапезе хлеб, посылаемый ему от Бога, и питался им, но не изгонял из ума негодных тех мыслей, не думал, что невнимательность губит труды, и не старался об уврачевании зла. Небольшое уклонение от обязанностей ему казалось маловажным. И вот похоть страстная, овладев его мыслями, влекла его в мир. Но он пока еще удержался, следующий день провел в обычных подвигах и после молитвы и песнопений, вошедши в пещеру, по-прежнему нашел приготовленный ему хлеб – впрочем, не так тщательно приготовленный и чистый, как прежде, но с сором. Он удивился и несколько опечалился, однако съел его и укрепил себя. Настала третья ночь, и зло утроилось.
        cn: 当他达到这种确信时，一个念头不知不觉地潜入他的心中，即他凌驾于他人之上，并且比其他人知道和拥有更多。在这些思想中，他已经开始依赖自己，由此，他心中很快产生了懈怠，先是微不足道，然后逐渐增长，变得显而易见。他起床吟唱圣歌时不再那么精神抖擞，对祷告变得懒惰，他的歌唱也不再那么持久；灵魂渴望安息，思想沉沦，意念开始游荡；懈怠在暗中已被喜爱，只有他先前的习惯，如同屏障，暂时阻止了这位苦行者的这种倾向并保护了他。此外，每晚在惯常的祷告后进入洞穴时，他有时会在餐桌上发现上帝赐予他的面包，并以此为食，但他没有将那些邪恶的念头从心中驱逐出去，没有想到不专心会毁掉他的努力，也没有努力去医治那邪恶。些微的失职在他看来无关紧要。于是，情欲占据了他的思想，将他引向世俗。但他暂时还 удержи住了自己，接下来的日子他仍照常进行修行，在祷告和吟唱圣歌后，他进入洞穴，仍然发现了为他准备好的面包——不过，不像以前那样精心准备和洁净，而是带着杂质。他感到惊讶并有些忧伤，然而他吃掉了它，并使自己得到力量。第三夜降临了，邪恶也增至三倍。
    - type: paragraph
      text:
        ru: Ум его еще скорее предался любострастным помыслам, и воображение представляло ему нечистые мечты так живо, как бы они сбывались на самом деле. Несмотря на то, еще и на третий день он продолжал свои подвиги – молился и пел псалмы, но уже не с чистым расположением и часто оборачивался и смотрел по сторонам. Доброе дело его прерывали разные мысли. Вечером, почувствовав потребность в пище, взошел он в пещеру и, хотя нашел хлеб на трапезе, но как бы изъеденный мышами или собаками, а вне пещеры – сухие остатки. Тогда начинает он стенать и плакать, но не столько, сколько нужно было для укрощения нечистой похоти. Однако ж, вкусивши хоть и не столько, сколько ему хотелось, он расположился успокоиться. Тут помыслы во множестве нападают на него, побеждают его ум и пленника тотчас влекут в мир. Он оставил свою пустыню и ночью пошел в селение. Настал день, а до селения было еще далеко. Инок, палимый зноем, изнемог и начал смотреть вокруг себя, нет ли где монастыря, в котором бы ему можно было отдохнуть. Вблизи действительно был монастырь.
        cn: 他的心思更是迅速地沉溺于淫荡的念头，他的想象向他呈现出不洁的幻象，栩栩如生，仿佛它们真正在发生一般。尽管如此，到了第三天，他仍然继续着他的苦修——祈祷并唱诵诗篇，但已不再怀着纯净的心思，并时常转头四顾。他的善行被各种思虑打断。傍晚时分，感到需要进食，他进入了山洞，并且，虽然他在膳桌上找到了面包，但那面包仿佛已被老鼠或狗啃食过，而在山洞外，只有干枯的残骸。于是他开始呻吟哭泣，但哭泣的程度不足以平息不洁的贪欲。然而，尽管所食用的分量不如他所愿，他还是决定安静下来。此时，众多的念头向他袭来，战胜了他的心思，并立时将这位俘虏拖入世俗。他离开了他的旷野，并在夜里前往村庄。天亮了，而离村庄尚远。修士酷热难耐，精疲力尽，并开始环顾四周，看是否有修道院，他可以在那里休息。附近确实有一座修道院。
    - type: paragraph
      text:
        ru: 'Благочестивые и верные братия приняли его, как родного отца, омыли ему лицо и ноги и по молитве предложили трапезу, прося его принять с любовию, что случилось. После трапезы братия молили его преподать им слово спасения, как избегать сетей диавола и как побеждать нечистые помыслы. Беседуя с ними, как отец с детьми, он поучал их быть мужественными в трудах и уверял, что они скоро обратятся для них в великое наслаждение. Много и еще говорил им старец весьма назидательного о подвижничестве. По окончании наставления он невольно подумал о себе самом и стал рассуждать, как он, вразумляя других, сам оставался невразумленным. Тогда увидел он свое поражение и немедленно возвратился в пустыню оплакивать свое падение. ««Аще не Господь помогл бы ми, – говорил он, –вмале вселилася бы во ад душа моя»(Пс. 93, 17); совсем было погряз я во зле«и вмале не скончаша мене на земли»(Пс. 118, 87)». И сбылось над ним Писание:«Брат от брата помогаем, яко град тверд»(Притч. 18, 19) и как стена неподвижная. С того времени он во всю жизнь плакал и, не получая более пищи от Бога, своими трудами доставал себе пропитание. Заключившись в пещере и постлав на полу вретище, он дотоле не вставал с земли и не прекращал своего плача, пока не услышал голоса Ангела, говорившего ему во сне: «Бог принял твое покаяние и помиловал тебя; только смотри не обольщайся. Придут посетить тебя братия, которых наставлял ты, и принесут тебе на благословение хлебы – раздели их вместе с ними и всегда благодари Бога».'
        cn: 虔诚忠信的弟兄们接待他如同亲生父亲，为他洗净脸和脚，并在祷告后设摆宴席，恳求他以爱心接受，他也照办了。饭后，弟兄们恳求他教导他们得救之道，如何避开魔鬼的罗网，以及如何战胜不洁的意念。他像父亲对子女一样与他们交谈，教导他们在苦修中要刚毅，并向他们保证，这些苦修很快就会成为他们极大的喜乐。这位长老还向他们讲了很多极具造就性的关于苦修的事。训导结束后，他不由自主地想到自己，并开始思考，他如何在训诲他人时，自己却仍未得到训诲。那时他看到了自己的失败，便立刻回到旷野哀恸自己的堕落。他说：「「若不是上主帮助我，我的灵魂几乎就要堕入阴间了」（诗篇 93:17）；我几乎完全沉沦于邪恶之中，「他们几乎把我从地上灭绝了」（诗篇 118:87）。」于是圣经在他身上应验了：「弟兄由弟兄帮助，如同坚固之城」（箴言 18:19），且如同不可动摇的墙。从那时起，他终生哭泣，并且不再从上帝那里得到食物，而是靠自己的劳作获取给养。他幽居于洞穴中，并在地上铺上麻布，一直没有从地上起来，也没有停止他的哭泣，直到他听见天使的声音在梦中对他说：「上帝已接受你的悔改并怜悯了你；只是要留意，不要被迷惑。你曾训诲的弟兄们将会前来探望你，并为你带来蒙福的饼——要与他们一同分享这些饼，并永远感谢上帝。」
    - type: paragraph
      text:
        ru: 'Это рассказал я вам, дети, для того, чтобы вы более всего упражнялись в смиренномудрии, хотя бы подвиги ваши казались вам уже великими. Оно есть первая заповедь Спасителя, Который говорит:«Блажени нищии духом, яко тех есть Царствие Небесное»(Мф. 5, 3). Блюдите, чтобы вас не обольстили демоны какими-либо мечтаниями. Когда приходит к вам кто-нибудь – брат, или друг, или жена, или отец, или мать, или учитель, или сын, или слуга, – прежде всего прострите руки ваши на молитву, и, как скоро все это призрак, он исчезнет. Если так же будут обольщать вас демоны или люди ласкательством и похвалами, то не внимайте им и не надмевайтесь мыслию. И меня часто обольщали демоны призраками, так что иногда всю ночь не давали мне ни молиться, ни отдыхать, а поутру кланялись мне и говорили с насмешкою: «Прости нас, авва, что мы всю ночь утруждали тебя». Но я отвечал им: ««Отступити отМене, вси делающии беззаконие»(Пс. 6, 9), не искусите раба Господня». Так и вы, посвятив себя созерцанию, всегда храните безмолвие, дабы во время молитвы к Богу иметь вам чистый ум. Хорош и тот подвижник, который, живя в мире, всегда творит добрые дела, оказывает братолюбие, страннолюбие, подает милостыни, благодетельствует приходящим к нему, помогает больным и блюдет себя от соблазнов. Это добрый, истинно добрый подвижник: он на деле исполняет заповеди, хотя не чужд и земных попечений. Совершеннее и выше его тот, кто, посвятив себя созерцательной жизни, от житейских дел востек к созерцанию и, предоставив заботиться о них другим, сам, отвергшись и забыв себя, занимается небесным, – кто, отрешившись от всего, предстоит Богу и никакою другою заботою не отвлекается назад. Таковой с Богом соединяется и с Богом живет, всегда восхваляя Его непрерывными песнями.'
        cn: '我对你们说这些，孩子们，是为了让你们首要地操练谦卑，即使你们的苦修在你们看来已很伟大。它是救主的第一条诫命，他说：「虚心的人有福了，因为天国是他们的。」 (马太福音 5:3)。你们要警醒，以免恶魔用任何幻象诱惑你们。当有人来到你们面前——无论是兄弟、朋友、妻子、父亲、母亲、老师、儿子，还是仆人——首先要举起双手祷告，这样，如果那一切是个幻影，它就会立刻消失。如果恶魔或人也同样用奉承和赞美诱惑你们，你们就不要听从他们，也不要心中傲慢。恶魔也常常用幻影诱惑我，以至于有时整夜不让我祷告，也不让我休息，到了早上，他们就向我鞠躬，嘲弄地说：「阿爸，请原谅我们，我们整夜让你疲惫不堪。」但我回答他们说：「你们这些作恶的人，离开我吧！」 (诗篇 6:9)，你们不要试探主的仆人。


          同样，你们这些献身于默观生活的人，要常常保持静默，以便在向神祷告时能保持纯洁的心智。还有这样一种苦修者，他也是好的，他活在世上，总是行善，实践弟兄友爱，爱护客旅，施舍钱财，善待那些来到他面前的人，帮助病人，并保守自己不受诱惑。这是一位善良的，真正善良的苦修者：他在行动上遵行诫命，尽管他也不免地上的挂虑。比他更完全、更高超的，是那些献身于默观生活的人，他从世俗事务上升到默观，将这些事务的照管交给他人，自己则舍弃并忘记自己，专注于属天之事——他超脱一切，侍立神前，不被任何其他忧虑所牵引。这样的人与神联合，并与神同活，常常用不间断的赞美诗歌颂祂。'
    - type: paragraph
      text:
        ru: 'Такие и многие другие наставления давая нам в продолжение трех дней, до девятого часа каждый день, блаженный Иоанн врачевал наши души. Потом, преподав нам благословение, велел идти в мире и сказал еще пророчество, что сегодня пришла в Александрию весть о победе благочестивого царя Феодосия и поражении мятежника Евгения, также что император умрет своею смертию. Точно так и случилось. Когда же мы посетили многих других отцов, пришли к нам братия с вестию, что блаженный Иоанн скончался чудным некоторым образом: он заповедал, чтобы три дня никому не позволяли входить к нему, и, преклонив колена на молитву, скончался и отошел к Богу, Которому слава вовеки. Аминь.'
        cn: 蒙福的约翰连续三天，每日直到第九时辰，赐予我们诸如此类以及许多其他的教导，医治了我们的灵魂。之后，他赐予我们祝福，吩咐我们平安离去，并又说了预言，说今日有消息传到亚历山大，关于虔敬的皇帝狄奥多西的胜利以及反叛者欧革尼的失败，也说皇帝将寿终正寝。事情果然如此。当我们拜访了许多其他教父之后，弟兄们带着消息来到我们这里，说蒙福的约翰以某种奇妙的方式安息了：他曾吩咐，在三天之内不许任何人进入他那里，然后，他跪下祈祷，便安息了，归到上帝那里，愿荣耀归于祂，直到永远。阿们。
  - type: heading2
    text:
      ru: О Пимении
      cn: 关于皮门
    children:
    - type: paragraph
      text:
        ru: Он же (Иоанн) и рабе Христовой Пимении, которая приходила к нему для свидания, не показался в лице, однако ж открыл нечто сокровенное. Он приказал ей на возвратном пути из Фиваиды не плыть в Александрию, иначе впадет в искушение. Но Пимения или пренебрегла, или забыла предсказание Великого и поплыла в Александрию – может быть, из любопытства, чтобы посмотреть город. На пути, близ Никиополя, суда ее пристали к берегу для отдыха. Слуги, вышедши на берег, из-за какой-то ссоры произвели драку с местными жителями, людьми буйными, которые у одного евнуха отрубили палец, другого убили, а святого епископа Дионисия даже бросили в реку, впрочем по неведению, да и ее саму осыпали ругательствами и напугали угрозами, а прочих слуг всех переранили.
        cn: 他（约翰）对曾前来拜访的基督的女仆皮梅尼亚并没有现身，却揭示了一些隐秘之事。他命令她在从底比斯返回的路上不要航行去亚历山大，否则将陷入试探。但皮梅尼亚要么是轻忽了，要么是忘记了那位伟大的预言，于是航行去了亚历山大——也许是出于好奇，想看看这座城市。在路上，她的船只在尼基奥波利斯附近靠岸停泊以供休息。仆人们上岸后，因为某种争执，与当地居民——那些凶暴之人打了起来。他们砍掉了一个宦官的手指，杀死了另一个人，甚至把圣主教狄奥尼修斯扔进了河里——不过是出于无知；又用辱骂和威胁恐吓了她本人，而其余所有的仆人都被打伤了。
  - type: heading2
    text:
      ru: Об авве Аммоне
      cn: 关于阿蒙长老
    children:
    - type: paragraph
      text:
        ru: Видели мы в Фиваиде и другого мужа, по имени Аммона. Он был отцом около трех тысяч монахов, коих называли тавеннисиотами. Они соблюдали великий устав (Пахомиев), носили милоти, пищу принимали с лицом покрытым, опустив глаза вниз, чтобы не видеть, как ест близ сидящий брат, и все хранили такое строгое молчание, что, казалось, находишься в пустыне, потому что каждый исполнял свое правило втайне. За трапезу они садились только для виду, чтобы скрыть друг от друга свое постничество. Одни из них раз или два подносили к устам руку, взявши хлеба, или маслин, или чего-нибудь другого, что было предложено на трапезе, и, вкусив от каждой яствы по одному разу, тем и были довольны. Другие, съевши немного хлеба, ни до чего больше не дотрагивались. А иные довольствовались только ложками тремя кашицы. Всему этому справедливо подивившись, я не преминул и для себя извлечь отсюда пользу.
        cn: 我们在底拜也曾见到另一位修士，名叫阿蒙。他是大约三千名修士的灵性之父，这些修士被称为塔本尼西奥派。他们遵循着大修道规（帕霍米乌斯规），穿着山羊皮衣，进食时遮住脸，垂下眼睛，为的是不看到身旁弟兄进食的情景，并且都保持着如此严格的静默，仿佛置身荒漠之中，因为每人都秘密地履行着自己的规例。他们坐到餐桌旁只是做做样子，为的是彼此遮掩各自的禁食。他们当中有些人一两次把手伸向嘴边，取了些面包，或橄榄，或餐桌上摆放的其他食物，并且每样食物都只尝了一口，便以此为满足了。另一些人吃了少许面包后，就不再碰任何其他食物了。还有一些人只满足于三勺粥。对所有这些，我由衷地感到惊奇，我也毫不犹豫地从中为自己汲取了益处。
  - type: heading2
    text:
      ru: Об авве Вине
      cn: 关于阿爸维纳
    children:
    - type: paragraph
      text:
        ru: 'Видели мы и другого старца, который своею кротостию превосходил всех людей, – авву Вина. Братия, жившие с ним, уверяли, что он никогда не божился, не лгал, ни на кого не гневался и никогда никого не оскорбил даже словом. Жизнь его была самая тихая, он был нрава кроткого и ангельского свойства. Велики были и смирение его, и самоуничижение. Долго мы упрашивали его сказать нам что-нибудь в назидание, и он едва согласился предложить несколько слов о кротости. Когда в одно время бегемот производил в соседней стране опустошение, этот святой, быв упрошен земледельцами, стал у реки и, увидевши зверя огромной величины, кротким голосом сказал ему: «Именем Иисуса Христа повелеваю тебе не опустошать более этой страны». Зверь, как будто прогнанный Ангелом, совсем скрылся. Точно так в другой раз прогнал он и крокодила.'
        cn: 我们也看到另一位长老，他以自己的温柔超越了所有人——阿巴·维纳。与他同住的修士们确认，他从不以神之名起誓，从不说谎，从不向任何人发怒，甚至从未以言语冒犯过任何人。他的生活极其宁静，性情温和，拥有天使般的品格。他的谦卑和自我贬抑也同样伟大。我们恳求了他许久，希望他能给我们一些教诲，他才勉强同意谈谈关于温柔的几句话。有一次，当一头河马在邻近的国家肆虐时，这位圣人应农夫们的恳求，站在河边，看到那头巨兽后，用温和的声音对它说：「我奉耶稣基督之名，命令你不得再摧毁这片土地。」那野兽，仿佛被天使驱赶一般，彻底消失了。同样地，他也在另一次驱逐了一只鳄鱼。
  - type: heading2
    text:
      ru: Об авве Феоне
      cn: 论阿爸提翁
    children:
    - type: paragraph
      text:
        ru: В пустыне, недалеко от города Александрии, видели мы и другого святого мужа, по имени Феона. Он заключился в тесной келии один и в продолжение тридцати лет упражнялся в молчании. Чудеса его были так многочисленны, что жители Александрии называли его пророком. Ежедневно приходило к нему множество больных, и он через отверстие возлагал на них руки и отпускал их здоровыми. Лицо у него было как у Ангела, взгляд веселый и весьма ласковый.
        cn: 在旷野里，离亚历山大城不远，我们曾见到另一位圣人，名叫提奥纳。他独自一人隐修在一间狭窄的隐修室里，并在三十年间操练静默。他的神迹如此众多，以至于亚历山大城的居民称他为先知。每天有许多病人来到他那里，他就通过一个孔洞为他们按手，并让他们痊愈离去。他的面容如同天使，目光充满喜乐，并且非常温柔慈爱。
    - type: paragraph
      text:
        ru: 'Однажды (это было не так давно) в глубокую ночь напали на него разбойники, с тем чтобы убить его, надеясь найти у него золото. Святой помолился, и они до утра остались недвижимы у дверей его. Когда же стал собираться к нему народ и хотел сжечь их, святой, вынужденный крайностию, сказал народу только следующие слова: «Отпустите их невредимыми, а если не отпустите, от меня отступит благодать исцелений». Народ послушался, ибо никто не дерзал прекословить ему, а разбойники тотчас пошли в соседние монастыри к монахам и, раскаявшись в прежних делах, переменили жизнь свою.'
        cn: 有一次（那也不是很久以前的事），在深夜，有强盗袭击了他，为了杀他，希望在他那里找到金子。圣人做了祷告，于是他们就一动不动地待在他的门口，直到天亮。当人们开始聚集到他那里，并想把他们烧死时，圣人，出于无奈，只对人们说了以下的话：「放他们无损地离开，如果你们不放，治愈的恩典就会离开我。」人们顺从了，因为没有人敢于违抗他，而强盗们立刻去了附近的修道院，找到了修士们，并且，为他们以往的作为感到忏悔，改变了他们的生活。
    - type: paragraph
      text:
        ru: 'Авва Феона свободно читал на трех языках: римском, греческом и египетском, – как это узнали мы от многих и от него самого. Когда он известился, что мы чужеземцы, то сотворил о нас благодарную молитву к Богу, написав ее на дощечке. Ел он только невареные семена. Сказывают, что по ночам он выходил из своей келии и поил собиравшихся к нему диких зверей водою, какая была у него. Точно, около его келии видны были следы буйволов, диких ослов и коз, которыми он всегда утешался.'
        cn: 阿爸提奥纳斯能流利地阅读三种语言：罗马语、希腊语和埃及语，正如我们从许多人那里以及从他本人那里所了解到的。当他得知我们是异乡人时，便为我们向上帝献上感恩的祷告，将其写在一块木板上。他只吃未煮熟的种子。人们说，夜里他走出自己的修道室，用他所有的水给聚集到他那里的野兽饮水。确实，在他的修道室附近可以看到水牛、野驴和山羊的足迹，他总是从中得到安慰。
  - type: heading2
    text:
      ru: Об авве Илии
      cn: 论阿爸以利亚
    children:
    - type: paragraph
      text:
        ru: В пустыне близ Антинои, главного города Фиваиды, видели мы и другого старца, ста десяти лет от роду, по имени Илия. На нем, говорили, почил дух пророка Илии. Он знаменит был тем, что прожил семьдесят лет в этой пустыне, столь страшной и дикой, что невозможно изобразить ее словами, как должно. Здесь-то, на горе, жил Илия, никогда не сходя в обитаемые места. На узкой тропинке, которая вела к нему, там и здесь выдавались острые камни и едва позволяли ступать по ней. Пещера, в которой старец жил, находилась под скалою, так что и видеть его было страшно. Он весь дрожал от старости, каждый день совершал много знамений и не переставал исцелять больных. Отцы говорили, что никто не помнит, когда он взошел на гору. В старости ел он по три унции хлеба повечеру и по три маслины, а в молодости ел всегда однажды в неделю.
        cn: 在安提诺伊附近的一片旷野里，那里是提拜德斯的省会，我们还见到了另一位长老，年届一百一十岁高龄，名叫伊利亚。人们都说，先知伊利亚的灵曾安歇在他身上。他之所以闻名遐迩，是因为他在这片旷野里居住了七十年，这片旷野是如此可怖而荒凉，实在无法用言语尽述其状。伊利亚就住在这里的一座山上，从未下山去往有人居住之地。通往他住处的那条狭窄小径上，到处都有尖锐的岩石突出，几乎无法行走。长老所住的那个山洞坐落在悬崖之下，以至于光是见到他都令人心生敬畏。他因年迈而全身颤抖，每天都行许多神迹，不断地医治病人。教父们说，谁也不记得他何时登上了那座山。在他年迈时，每天傍晚只吃三盎司面包和三颗橄榄；而在他年轻时，他每周只吃一次。
- type: heading1
  text:
    ru: Часть 2
    cn: 第二部分
  children:
  - type: heading2
    text:
      ru: Об авве Аполлосе
      cn: 关于长老亚波罗
    children:
    - type: paragraph
      text:
        ru: Видели мы и другого святого мужа, по имени Аполлос, в Фиваиде, в пределах Ермиполя. В этот город приходил Спаситель с Девою Мариею и праведным Иосифом, исполняя пророчество Исаии, который говорит:«Се, Господь седит на облаце легце и приидет во Египет, и потрясутся рукотворенная египетская от лица Егои падут на землю» (Ис. 19, 1). Видели мы там и капище, в котором все идолы пали лицом на землю, когда Спаситель вошел в город.
        cn: 我们也见过另一位名叫阿波罗斯的圣人，在底比斯，赫尔米波利斯境内。救主曾与贞女马利亚和义人约瑟来到这座城，应验了以赛亚的预言。以赛亚说：「看哪，主驾着轻云，降临埃及，埃及人手所造的偶像必在他面前战兢，仆倒在地。」（以赛亚书 19:1）我们还在那里见过一座异教神庙，当救主进入那城时，其中所有的偶像都面伏于地。
    - type: paragraph
      text:
        ru: 'Так сего-то мужа видели мы в пустыне, где под горою он имел монастырь и был отцом около пятисот монахов. Он приобрел славу в Фиваиде. Дела его были велики, и Господь творил чрез него великие чудеса, совершал весьма много знамений. Еще с детства являл он великие подвиги и уже в старости получил такую благодать. Будучи восьмидесяти лет, он устроил у себя великий монастырь из пятисот мужей совершенных, которые почти все могли творить чудеса. В пятнадцатилетнем возрасте удалившись от мира и сорок лет проведши в пустыне, он тщательно подвизался во всякой добродетели и наконец, говорят, слышал глас Божий, говоривший к нему: «Аполлос! Аполлос! Чрез тебя низложу Я мудрость египтян и разум разумных язычников. Вместе с ними ты погубишь и мудрецов вавилонских и истребишь всякое служение бесовское. Теперь же иди в мир. Ты породишь Мне люди избранны, ревнители добрым делом (1Пет. 3, 13). И опять был к нему голос: «Ступай, потому что все, чего ты ни попросишь у Бога, получишь». Услышав это, он тотчас пошел в мир (это было в царствование Юлиана) и чрез несколько времени пришел в ближнюю пустыню. Заняв одну небольшую пещеру под горою, он стал в ней жить.'
        cn: 因此，我们见到了这位男子在旷野里，他在山下有一座修道院，是大约五百名修士的属灵父亲。他在提拜德地区享誉盛名。他的作为是伟大的，主藉着他行了许多大奇迹，成就了极多的神迹。他从小时候起就显出了伟大的属灵功绩，而到了老年才获得如此恩典。他八十岁时，在他那里建立了一座大修道院，由五百名已达完全境地的修士组成，他们几乎都能行奇迹。他在十五岁时就脱离了俗世，并在旷野里度过了四十年，他认真地在各种美德上刻苦操练，最后，据说他听到了上帝的声音，向他说道：「阿波罗！阿波罗！我将藉着你推翻埃及人的智慧，以及有理智的异教徒的理性。你将和他们一同毁灭巴比伦的智者，并消除一切事奉鬼魔的行为。现在，你当进入世界。你将为我生出选民，就是热心行善的人（彼得前书 3:13）。」又有声音向他说道：「去吧，因为你向神所求的一切，都将得到。」听了这话，他立刻进入了世界（这事发生在尤利安皇帝统治时期），过了不久，他来到了附近的一片旷野。他在山下占据了一个小洞穴，并住在里面。
    - type: paragraph
      text:
        ru: Все его занятие состояло в том, что, стоя на коленах, постоянно возносил он молитвы к Богу – сто ночью и столько же днем. Пища его тогда, как и прежде, чудным образом была посылаема Богом – ее приносил ему в пустыню Ангел. Одежду его составлял левитон[19], который иные называют коловием, и еще небольшой плат на голове. И это одеяние у него в пустыне не ветшало. В этой пустыне, которая была недалеко от страны заселенной, силою Духа совершал он чудеса и исцеления дивные, которые все, по их чрезвычайной чудесности, невозможно и пересказать, как слышали мы от старцев, которые жили вместе с ним и сами были совершенны и управляли многими братиями.
        cn: 他所做的全部，就是跪着，不住地向神献上祷告——夜间一百次，白天也一百次。他那时的食物，如同先前一样，是神神奇妙地差遣而来——天使将食物带到沙漠中给他。他的衣裳是利维顿[19]，另有些人称之为科洛维姆，头上还戴着一块小头巾。并且这件衣裳在沙漠中他身上穿着的，并未破旧。在这片沙漠中，距离人烟稠密之地不远，他借着圣灵的能力，行了奇迹和奇妙的医治，所有这些，因其极其奇妙，实在无法一一复述，正如我们从那些与他一同生活、自己也已达致完全、并管理着许多弟兄们的长老们那里听到的。
    - type: paragraph
      text:
        ru: Таким образом сей муж скоро сделался славным, как бы новый пророк и апостол, явившийся в наше время. Как скоро распространилась о нем великая молва, все монахи, жившие в окружности по разным местам, стали непрестанно приходить к нему и предавали ему свои души, как родному отцу. Иных он призывал к созерцанию, других убеждал совершать деятельную добродетель и сперва сам на деле показывал то, к чему склонял других словом. Часто, показывая им пример подвижничества, он вкушал с ними пищу только по воскресным дням, и притом питался одними овощами, которые сами собою вырастали из земли, и не употребляя ни хлеба, ни бобов, ни даже плодов древесных и ничего вареного.
        cn: 因此，此人很快就声名远播，仿佛一位出现在我们这个时代的新先知和使徒。他的盛名一传开，所有住在周围各地的修士们都不断地来到他这里，并将他们的灵魂托付给他，就像托付给亲生父亲一样。他召唤一些人走向默观，劝勉另一些人去实行积极的德行，并且首先自己以行动示范他所口头劝导别人的事。他常常向他们展示苦修的榜样，只在主日与他们一同进食，并且只以那些自行从土地中长出的蔬菜为食，不食用面包、豆类，甚至也不食用树上的果实和任何煮熟的食物。
    - type: paragraph
      text:
        ru: Однажды (это было в правление Юлиана) услышав, что брат, взятый в воинскую службу, сидит связанный в темнице, Аполлос пришел к нему с братиею посоветовать и внушить ему, чтобы он мужественно переносил труды и презирал угрожающие ему опасности; говорил, что теперь ему время подвигов и что сими искушениями испытывается душа его. Когда же этими словами он укреплял душу брата, тысяченачальник, уведомленный кем-то о братиях, в порыве злобы прибежал туда, наложив замки на двери темницы, запер там Аполлоса и бывших с ним монахов, как способных к воинской службе, и, приставив к ним довольно стражей, ушел домой, а просьб их и слушать не хотел. В самую полночь явился стражам светоносный Ангел и озарил светом всех бывших в темнице, так что стражи сделались безгласны от ужаса. Пришедши в себя, они отворили двери и просили, чтобы все братия вышли – лучше, говорили, умереть за них, нежели оскорбить свободу, свыше дарованную заключенным безвинно. Потом вот и тысяченачальник с другими начальниками, пришедши утром к темнице, усердно просил этих мужей, чтобы они вышли даже из города, потому что, говорил он, от землетрясения упал дом его и задавил лучших из слуг его. Услышав об этом, они, воспевая благодарственные песни Богу, возвратились в пустыню и пребывали потом все вместе, имея, по апостольскому слову,«одно сердце и одну душу»(Деян. 4, 32).
        cn: '有一次（那是在尤利安执政期间），阿波罗斯听说有一位弟兄被征入伍，如今身陷囹圄，便与众弟兄一同前去探望。他们向这位弟兄提出建议并加以启发，劝他要勇敢地忍受劳苦，轻视威胁他的危险；阿波罗斯说，现在是他进行灵修争战的时刻，这些试炼正在考验他的灵魂。当他用这些话语坚固这位弟兄的灵魂时，有某个千夫长被人告知了弟兄们的情况，便盛怒之下跑到那里，给监牢的门上了锁，将阿波罗斯和与他同在的修士们一同关在里面，因为他们都适合作兵役，然后，他又给他们派了足够多的守卫，就回家去了，根本不愿听取他们的请求。


          到了半夜，一位光明天使向守卫们显现，光照了所有在监牢里的人，以至于守卫们都吓得说不出话来。他们回过神来，便打开了门，并请求所有的弟兄们出去——他们说，宁可为他们而死，也不愿冒犯那自上而下所赐予无辜被囚之人的自由。随后，那位千夫长和其他官长们，也在早晨来到监牢，恳切地请求这些人们甚至离开这座城，因为他（千夫长）说，他的房屋因地震而倒塌，压死了他最好的仆人。听到这些，他们向神歌唱感恩的诗歌，返回了旷野，此后他们都一同居住，正如使徒所说，拥有「一心一意」（使徒行传 4:32）。'
    - type: paragraph
      text:
        ru: Аполлос учил их, чтобы они ежедневно украшались добродетелями и коварные действия диавола на помыслы отражали тотчас при самом их начале. «Когда у змия, – говорил он, – сокрушена глава, то и все тело его мертво, и Господь заповедует нам сокрушать главу змия. Это обязывает нас к тому, чтобы мы не только исторгали из ума своего постыдные мечтания, но и вначале не допускали в душу свою худых и нечистых помыслов». Он учил также, чтобы братия старались превзойти друг друга в добродетелях, дабы никто не казался ниже другого по совершенствам. «Свидетельством успеха вашего в добродетелях, – говорил он, – да будет приобретение бесстрастия и воздержания от пищи, потому что это есть начало даров Божиих. А когда кто получит от Бога силу творить чудеса, не гордись, как бы уже имеющий всего довольно, не надмевайся мыслию, будто ты выше других, и не показывай всем, что получил такую благодать, – в противном случае ты обольщаешь себя и, уловленный помыслами, лишаешься благодати».
        cn: 阿波罗教导他们，要每天以美德自我装饰，并且要在魔鬼在心思意念上的狡诈行径萌芽之初就立即抵挡。「当蛇的头被击碎时，」他说，「它的全身也就死了，主命令我们击碎蛇的头。这要求我们，不仅要将可耻的幻想从我们心中根除，而且从一开始就不要让邪恶和不洁的思想进入我们的灵魂。」他也教导，弟兄们要在美德上努力超越彼此，以免任何人在完善上显得低于他人。「你们在美德上成功的证据，」他说，「将是获得无情欲和禁食，因为这是上帝恩赐的开端。而当有人从上帝那里获得行神迹的能力时，不要骄傲，仿佛已拥有一切所需，不要思想狂妄自大，仿佛你高于他人，也不要向所有人炫耀你获得了这样的恩典——否则你就是欺骗自己，并且，被思想所诱惑，就失去了恩典。」
    - type: paragraph
      text:
        ru: Такое высокое учение было в его беседах! Впоследствии и мы часто от него слышали то же. Но в делах он совершал еще более, ибо все просимое тотчас было ему даруемо Богом. Он имел и некоторые откровения, например видел своего старшего брата, который с ним долгое время жил в пустыне, по жизни был совершеннее, нежели сам он, и в пустыне же скончался. Во сне представилось ему, будто брат его пребывает в лике апостолов, оставил ему в наследство свои добродетели и молится за него Богу, прося скорее преставить его от земли и с ним упокоить на небесах. Но Спаситель сказал ему, что Аполлосу надобно еще несколько пребыть на земле для достижения совершенства, пока много будет ревнителей его жизни, ибо ему будет вверено великое множество монахов и некое воинство благочестивое, дабы он получил от Всеблагого славу, достойную своих трудов.
        cn: 他的谈话中充满如此高深的教诲！后来，我们也常常从他那里听到同样的话。但在行动上，他所成就的更多，因为他所求的一切立刻蒙神恩赐。他也有一些启示，例如他看见了自己的哥哥，他的哥哥曾与他一同在旷野生活了很长时间，在圣洁的生活上比他自己更完全，并且在旷野去世了。在梦中，他看到他的哥哥仿佛置身使徒之列，将自己的美德留给他作为遗产，并为他向上帝祷告，祈求上帝快些将他从地上接走，使他能与哥哥一同在天上安息。但救主对他说道，阿波罗还需要在地上多留一段时间，以达至完全，直到有许多人效法他的生活；因为将有大批修士和一支虔诚的队伍交托给他，好让他从至善者那里获得配得上他劳苦的荣耀。
    - type: paragraph
      text:
        ru: Что видел он, то и случилось. По слуху о нем, стеклись к нему отовсюду многие монахи и, по его учению и беседам, весьма многие совершенно отрекались мира. Таким образом, у него в горе составилось общество до пятисот братий, имевших общежитие и одну трапезу. Казалось, это был стройный полк ангелов, облеченных во все доспехи, и исполнились на них слова Писания:«Возвеселисяпустыня жаждущая»(Ис. 35, 1). «Расторгни ивозопий неболевшая, яко многа чада пустые паче, нежели имущие мужа»(Ис. 54, 1). Хотя сие пророческое слово исполнилось и на Церкви из язычников, однако ж оно сбылось и на египетской пустыне, которая представила Богу больше чад, нежели страны заселенные, – где в городах такое множество спасающихся монахов, сколько их предстоит Богу в пустыне египетской? Сколько здесь (в городах) народа, столько там, в пустынях, монахов. И мне кажется, что и над ними исполняется апостольское слово:«Идеже умножися грех, тампреизбыточествова благодать»(Рим. 5, 20).
        cn: 他所见的都应验了。因着他的声誉，许多修士从四面八方聚集到他那里，并且因着他的教诲和交谈，许多人完全弃绝了世界。如此，在他所在的这山上，形成了一个多达五百位弟兄的团体，他们过着团体的生活，共用一处食堂。这看起来像是一队训练有素的天使，全副武装，经上的话语在他们身上应验了：「旷野和干旱之地必然欢喜；沙漠也必快乐，又像玫瑰开花」（以赛亚书 35:1）。「你这不怀孕、不生养的，要歌唱！你这未曾经过产难的，要发声歌唱，扬声欢呼！因为没有丈夫的，儿女比有丈夫的更多。」（以赛亚书 54:1）。尽管这句预言性的话语也应验在由外邦人组成的教会身上，但它同样应验在了埃及的旷野中，因为埃及旷野向神献上的儿女比那些有人居住的地区更多——在城市里，哪里有如此众多的得救的修士，如同在埃及旷野中侍立在神面前的修士一样多呢？这里（在城市中）有多少民众，那里（在旷野中）就有多少修士。我想，在他们身上也应验了使徒的话语：「律法本是为叫过犯显多，只是罪在哪里显多，恩典就更显多了。」（罗马书 5:20）。
    - type: paragraph
      text:
        ru: 'Приумножилось некогда в Египте, больше, нежели в других странах, многоразличное и нечестивое идолослужение: почитали собак, обезьян и некоторых других животных; обожали и чеснок, и лук, и многие ничтожные растения. Об этом сам святой Аполлос рассказывал мне и объяснял причину прежнего многобожия. «Жившие прежде у нас язычники, – говорил он, – обоготворяли вола за то, что, при помощи его обрабатывая землю, доставали хлеб, а воды Нила – за то, что они напаяли все поля. Да и самую землю свою обожали они за то, что она была плодоноснее всех других стран. Наконец, и прочее: собак, обезьян и других негодных животных и растения чтили они за то, будто занятие ими было для людей причиною спасения во время фараона, когда он, гонясь за Израилем, был потоплен. Всякий, чем был занят и не пошел с фараоном, то и обоготворил, говоря: «Это сегодня стало для меня богом, потому что из-за этого я не погиб с фараоном”». Вот что говорил святой Аполлос. Но преимущественно пред словами надобно описать, что приобрел он в делах.'
        cn: 曾经，埃及的偶像崇拜比其他国家更盛行，而且种类繁多，不敬虔：他们敬奉狗、猴子和一些其他动物；也崇拜大蒜、洋葱和许多微不足道的植物。关于这件事，圣阿波罗亲自对我讲述，并解释了过去多神崇拜的原因。「我们以前的异教徒，」他说道，「将牛奉为神祇，因为藉着它的帮助耕种土地，获得了粮食；也将尼罗河的水奉为神祇，因为它们滋润了所有的田地。他们甚至也崇拜自己的土地，因为它比所有其他国家都更肥沃。最后，对于狗、猴子以及其他无用的动物和植物，他们也予以敬奉，因为他们认为，在法老追赶以色列并被淹死的时候，从事这些（事物）是人们得救的原因。凡是忙于某事而没有跟着法老去的人，就将那事奉为神，说道：『这今日成了我的神，因为藉着它我没有与法老一同灭亡。』」这就是圣阿波罗所说的。但相较于言语，更主要的是需要描述他在行事上所取得的成就。
    - type: paragraph
      text:
        ru: Неподалеку от него прежде жили язычники по всем местам; в ближайших селениях почитали демонов. В одном из них было огромное капище и в нем – знаменитейший идол. Он был деревянный. Нечестивые жрецы торжественно носили его по селениям, неистовствуя вместе с народом. Праздник этот совершается так же, как и в честь нильской воды. Случилось в это время проходить там святому Аполлосу с несколькими братиями. Как скоро он увидел народ, неистово бесновавшийся в той стране, то, преклонив колена пред Спасителем, вдруг сделал язычников неподвижными. Так как они не могли сойти с места, сколько ни толкали друг друга, то целый день палимы были зноем, не понимая, отчего это случилось с ними. Тогда жрецы их сказали, что это сделал с ними один христианин, живущий в пустыне, в их пределах, именно Аполлос, и стали просить его, чтобы избавил их от беды.
        cn: '距离他不远的地方，从前各地都住着异教徒；在邻近的村庄里，人们崇拜魔鬼。其中一个村庄里，有一个巨大的异教神庙，里面供奉着一个最著名的偶像。它是木制的。邪恶的祭司们隆重地抬着它游行于各村庄，与民众一同狂热不已。此节庆的举行方式与尊崇尼罗河水的节庆无异。


          就在这时，圣阿波罗士与几位修士正巧路过那里。他一看见那片土地上狂热癫狂的民众，便跪在救主面前，突然使那些异教徒动弹不得。由于他们无法移动，无论他们如何互相推搡，一整天都被酷热所煎熬，不明白这为何发生在他们身上。于是他们的祭司说，这是住在他们境内沙漠中的某位基督徒，就是阿波罗士，对他们做的，并开始恳求他将他们从这场灾祸中解救出来。'
    - type: paragraph
      text:
        ru: 'Между тем жившие далее оттуда, услышав их крик и плачевный вопль, пришли к ним и спрашивали: «Что такое случилось с вами и каким образом?». Одни отвечали, что не знают, а только подозревают одного мужа, и говорили, что его надобно просить о помиловании; другие уверяли, будто они видели, что он проходил мимо них, и просили пришедших подать им скорее помощь. Сии привели волов и покушались сдвинуть идола, но он вместе с самими жрецами оставался неподвижным. Наконец, не находя никакого другого средства к избавлению, они послали соседей своих просить Аполлоса, с тем что, если он избавит их, они оставят свое заблуждение. Когда сказали об этом Аполлосу, человек Божий как мог скорее пошел к ним и, помолившись, всех освободил от тех уз. После сего они все единодушно устремились к нему, уверовали в Спасителя всех и чудодействующего Бога, а идола предали огню. Огласив их всех, он присоединил их к Церкви. Многие из них еще и доныне живут в монастырях. Таким образом, везде пронеслась о нем слава и многие уверовали в Господа, так что уже не было и имени язычников в пределах около него (Аполлоса).'
        cn: 与此同时，住在离那里更远的人听见他们的尖叫和悲恸的哭嚎，来到他们那里，问道：「你们身上发生了什么事？是怎么回事？」有些人回答说他们不知道，只是怀疑一个人，并且说需要恳求他宽恕；另一些人则确信他们曾看见那人从他们身边经过，并请求来的人尽快给予他们帮助。这些人牵来了牛，试图移动偶像，但它连同那些祭司们本身都纹丝不动。最终，他们找不到任何其他解救办法，便派他们的邻居去请求阿波罗斯，并承诺如果他解救他们，他们就放弃自己的迷途。当人们把这件事告诉阿波罗斯时，这位神人尽快地走向他们，并且，祷告之后，解除了所有人的束缚。此后，他们所有人都同心合意地归向他，相信了万人的救主和行神迹的上帝，而偶像则付之一炬。对他们所有人施以慕道训诲后，他将他们纳入教会。他们中的许多人至今仍住在修道院里。这样一来，他的声名传遍各处，许多人信奉了主，以至于在他（阿波罗斯）周围的地区，异教徒之名已不复存在。
    - type: paragraph
      text:
        ru: 'Спустя немного времени два селения заспорили между собою из-за пахотной земли и подняли войну междоусобную. Как скоро дошло об этом известие до святого мужа, он тотчас пошел к ним, чтобы склонить их к миру. Одна противная сторона не соглашалась и противоречила ему, надеясь на некоего начальника разбойнической шайки, человека очень храброго на войне. Аполлос, увидев, что он противоречит, сказал ему: «Если ты, друг, послушаешься меня, то я умолю моего Владыку простить тебе грехи». Тот, выслушав сие, немедленно бросил оружие и, пав к ногам его, примирил обе стороны и убедил своих идти домой. Когда они, примирившись, ушли, тогда знаменитый защитник их последовал за святым мужем, требуя у него исполнения обещания. Блаженный Аполлос взял его с собою и в ближайшей пустыне убеждал и просил его потерпеть, говоря, что Бог может даровать ему прощение.'
        cn: 不久之后，两个村庄为了耕地彼此争执，并发动了内战。当这个消息传到这位圣人耳中时，他立刻前去他们那里，劝他们和睦。其中一方不肯同意，并反驳他，因为他们依仗着一个盗匪团伙的头目，那人在战争中非常勇敢。阿波罗见他反驳，便对他说：「朋友，如果你听从我的话，我就会恳求我的主赦免你的罪。」那人听了这话，立刻放下武器，俯伏在他脚前，使双方和解，并劝他的人回家。当他们和解并离开后，他们那位著名的捍卫者便跟随那位圣人，要求他履行诺言。至福的阿波罗将他带在身边，在附近的旷野里劝说并请求他忍耐，说上帝能赐予他赦免。
    - type: paragraph
      text:
        ru: 'Настала ночь, и во сне оба они видели, будто стоят на небе пред престолом Христовым и смотрят, как Ангелы вместе с праведниками поклонялись Богу. Когда же и они, падши вместе, поклонились Спасителю, к ним был глас от Бога: ««Кое общение свету ко тме? ...или кая часть верну с неверным?»(2Кор. 6, 14, 15). Для чего и сей человекоубийца, недостойный такого видения, стоит вместе с праведником? Впрочем, иди ты; человек, так поздно обратившийся, дарован тебе». Увидев и услышав весьма много и других чудес, коих не дерзает ни слово изречь, ни ухо выслушать, они пробудились и рассказали о том бывшим с ними. Всех до крайности удивлял рассказ обоих об одинаковом видении. И прежде бывший человекоубийца с сих пор стал жить вместе с подвижниками и, до самой смерти занимаясь исправлением своей жизни, из волка сделался незлобивым агнцем. И на нем исполнилось предречение Исаии пророка:«…пастися будут вкупе волк со агнцем… и лев аки вол ясти будет плевы»(Ис. 11, 6, 7). Точно, там можно было видеть, что и ефиопы подвизаются вместе с монахами и многих превосходят в добродетелях; и над ними исполнилось слово Писания:«Ефиопиа предварит руку свою к Богу»(Пс. 67, 32).'
        cn: '夜幕降临，两人在梦中都看到，自己仿佛站在天上基督的宝座前，看着天使与义人一同敬拜上帝。当他们也一同俯伏，敬拜救主时，有上帝的声音对他们说：「光明与黑暗有何相通？……信的与不信的有什么相干？」（哥林多后书 6:14，15）。「为何这杀人犯，不配得此异象之人，竟与义人一同站立？然而，你去吧；你，这如此迟才悔改的人，已蒙赐予。」他们看到了许多其他奇迹，那些言语不敢表达，耳朵不敢倾听的，然后他们醒来，把这事告诉了与他们在一起的人。两人对这相同异象的讲述，使所有人都极其惊讶。


          从此，那原是杀人犯的人开始与苦修者一同生活，并在临死前一直致力于改过自新，从一只狼变成了温顺的羔羊。以赛亚先知的预言在他身上应验了：「……豺狼必与绵羊羔同居……狮子必吃草，与牛一样」（以赛亚书 11:6，7）。的确，在那里可以看到，埃塞俄比亚人也与修士们一同苦修，并且在美德上超越了许多人；上帝的话语也在他们身上应验了：「埃塞俄比亚要急忙伸出双手归向主」（诗篇 67:32）。'
    - type: paragraph
      text:
        ru: 'Однажды язычники спорили с христианскими поселянами о своих границах. С обеих сторон явилось множество вооруженных. Аполлос пришел к ним, чтобы примирить их. Но предводитель язычников, человек жестокий и свирепый, воспротивился ему и с упорством говорил: «Не помирюсь до смерти». Аполлос сказал ему: «Да будет с тобою то, что ты избрал себе: никто другой, кроме тебя, не погибнет, и, когда ты умрешь, земля не будет твоим гробом, но чрева зверей и коршунов наполнятся тобою». Это слово тотчас и сбылось: ни с той ни с другой стороны никто, кроме этого предводителя, не погиб; его зарыли в песок и поутру нашли, что коршуны и гиены растерзали его на куски. Язычники, увидев такое чудо и исполнение сказанного, все уверовали в Спасителя, Аполлоса же провозглашали пророком.'
        cn: 有一次，异教徒与基督徒农人为了各自的边界争论不休。双方都出现了许多武装人员。阿波罗斯来到他们那里，是为了使他们和解。但是异教徒的首领，一个残忍而凶猛的人，对抗了他，并顽固地说道：「我至死都不会和解。」阿波罗斯对他说：「你所选择的，就必临到你：除了你之外，没有人会丧命；并且当你死去时，大地不会是你的坟墓，但野兽和秃鹫的肚腹将因你而饱足。」这话立刻就应验了：双方除了这位首领之外，没有人丧命；他们把他埋在沙子里，但到了早上，他们发现秃鹫和鬣狗把他撕成了碎片。异教徒们看到这样的奇迹和所说之话的应验，都相信了救主，而阿波罗斯则被他们宣称为先知。
    - type: paragraph
      text:
        ru: 'Еще прежде сего святой Аполлос жил в пещере горы с пятью братиями, которые были первыми учениками его, когда он только что вышел из пустыни. Настал праздник Пасхи, и они, совершив в пещере служение Богу, хотели вкусить, что найдется. А было у них только немного сухих хлебов и несколько овощей. Аполлос сказал им: «Дети! Если мы верные и истинные чада Христовы, то попросите каждый у Бога пищи, какой кому угодно». Но они все предоставили ему, считая себя недостойными такой благодати. Когда же он сам с радостным лицом совершил молитву и все рекли: «аминь», – тотчас явились у пещеры какие-то неизвестные мужи, сказавшиеся пришельцами издалека, и принесли с собою всего, о чем братия даже и не слыхали и что не родится в Египте, именно: всякого рода плодов садовых – винограда, гранатовых яблок, смокв и орехов – всего такого, чему поспеть тогда было еще не время, и медовых сотов, и сосуд свежего молока, и десять больших чистых и теплых хлебов – все такое, что родится в чужой стране. Мужи, принесшие это, только что отдали как присланное от какого-то знатного и богатого человека и тотчас поспешно удалились. Приняв съестное, братия продовольствовались сим до Пятидесятницы, и сами дивились и говорили, что поистине это послано им от Бога. Один из монахов просил авву тут же помолиться за него, чтобы ему сподобиться какого-нибудь благодатного дара. Когда сей помолился, ему дан был благодатный дар смиренномудрия и кротости, так что все дивились, как он стяжал великую кротость. Об этих чудесах Аполлоса рассказали нам отцы, жившие с ним, засвидетельствовали также и многие братия.'
        cn: 在此之前，圣阿波罗与五位弟兄一同住在一个山洞里，他们是他刚从旷野出来时的首批门徒。逾越节到了，他们在山洞里事奉了神之后，想要享用能找到的食物。然而，他们只有一点干饼和一些蔬菜。阿波罗对他们说：「孩子们！如果我们是基督忠诚而真正的儿女，那么你们每个人就向上帝祈求自己想要的食物吧。」但他们都将一切交托给他，认为自己不配得这样的恩典。当他自己满面喜悦地做了祷告，所有人都齐声说：「阿门」时，立刻就有一些陌生人在洞口出现，自称是远方来客，并且带来了弟兄们甚至闻所未闻、埃及所不产的一切东西，即：各种园林水果——葡萄、石榴、无花果和坚果——所有这些那时还未到成熟季节的，还有蜂巢蜜，一罐新鲜牛奶，以及十个又大又洁净又温暖的饼——所有这些异乡所产的食物。带来这些的那些人，只是说这是某位显赫富裕之人派人送来的，然后便立刻匆匆离去。收到这些食物后，弟兄们靠这些食物维生，直到五旬节，他们自己也感到惊奇，并说这确实是上帝赐予他们的。其中一位修士请求长老立即为他祷告，好让他能得到某种属恩的恩赐。当长老祷告后，那位修士便获得了谦卑和温柔的恩赐，以至于所有人都惊奇于他是如何获得如此大的温柔。关于阿波罗的这些神迹，与他同住的教父们告诉了我们，许多弟兄们也为此作证。
    - type: paragraph
      text:
        ru: 'Незадолго пред тем сделался голод во всей Фиваиде. Жители городов, зная по слуху, что жившие с Аполлосом монахи неоднократно уже получали пищу чудесным образом, все пошли к нему с женами и детьми просить благословения и пищи. Нимало не опасаясь, что недостанет пищи, он давал всем приходящим по стольку, чтобы каждому доставало на день. Когда же остались только три большие корзины с хлебом, а между тем голод усиливался, он велел принести и эти корзины, из которых монахи в тот самый день хотели взять для себя хлеба, и в слух всех братий и народа громко сказал: «Уже ли рука Господня не может наполнить эти корзины? Вот что говорит Дух Святой: “Не оскудеет хлеб в сих корзинах, доколе все не вкусят нового хлеба”». Ходившие туда в самом деле утверждали, что всем доставало хлеба в продолжение четырех месяцев.'
        cn: 不久之前，整个提拜德地区发生了饥荒。城市居民听说与阿波罗斯一同居住的修士们已多次以奇迹般的方式获得食物，于是都带着妻子儿女来到他那里，请求祝福和食物。他丝毫没有担心食物会不够，给所有来的人足够每人一天所需的量。当只剩下三大篮面包时，此时饥荒却愈发严重，他命人把这些篮子也拿来——当天修士们原本想从里面取些面包给自己吃的——并在所有弟兄和民众面前大声说：「难道主的手不能装满这些篮子吗？圣灵如此说：『这些篮子里的面包不会匮乏，直到所有人都尝到新面包为止。』」那些去过那里的人确实证实，所有人都持续有足够的面包，长达四个月之久。
    - type: paragraph
      text:
        ru: 'То же сделал он над елеем и пшеницею, так что сатана предстал ему и сказал: «Разве ты Илия или другой кто из пророков и апостолов, что делаешь это?». Он отвечал ему: «А разве не люди были святые пророки и апостолы, которые предали нам сие делать? Или тогда был Бог, а ныне нет Его? Бог всегда может делать это: для Него нет ничего невозможного. Если же Бог благ, то зачем ты зол? И разве не должно нам говорить, что мы видели, то есть что подающие хлеб приносили братиям на трапезу полные корзины и опять брали их назад полными по насыщении пятисот братий?».'
        cn: 他也照样在橄榄油和麦子上做了，以至于撒但站在他面前，对他说：「难道你是以利亚，或是其他哪位先知或使徒，以至于做这事吗？」他回答说：「难道圣先知和使徒们不都是人吗，他们将这事传给我们做？还是说那时有上帝，而现在没有祂了？上帝总能做这事；对祂而言，没有什么是不可能的。既然上帝是美善的，那你为何是邪恶的呢？难道我们不应该说我们所看见的，也就是说，那些分发面包的人曾为弟兄们带到筵席上满筐的面包，然后在五百位弟兄吃饱之后，又把满筐的面包带回去了吗？」
    - type: paragraph
      text:
        ru: 'Надобно еще сказать, как изумились мы, увидев и другое чудо. Трое нас, братий, пошли к нему. Его братия узнали нас, увидев еще издали, потому что еще прежде слышали от Аполлоса о нашем приходе к нему. Пришедши поспешно, они встретили нас с пением (таков был у них обычай в отношении ко всем монахам), поклонившись лицом до земли, облобызали нас и, указывая на нас друг другу, говорили: «Вот и пришли те братия, о которых отец за три дня предсказал нам, что чрез три дня придут к нам трое братий из Иерусалима». И одни шли впереди нас, другие – за нами, и все пели, доколе мы не пришли к самому Аполлосу. Авва Аполлос, услышав пение, вышел к нам навстречу, как он обыкновенно делал это в отношении ко всем братиям. Увидев нас, он первый поклонился нам до земли и, востав, облобызал нас, потом ввел к себе, помолился и, собственными руками умыв нам ноги, просил отдохнуть. Так поступал он со всеми приходящими к нему братиями.'
        cn: '我还需要说，我们看到另一个奇迹时是何等惊奇。


          我们三位弟兄去了他那里。他的弟兄们还在很远的地方就认出了我们，因为他们之前已经从阿波罗斯那里听说我们要来找他。他们急忙前来，带着歌声迎接我们（这是他们接待所有修士的习俗），俯伏于地亲吻了我们，并彼此指着我们说：「看哪，父亲三天前预言说，三天后会有三位来自耶路撒冷的弟兄到我们这里来，他们果然来了。」有些走在我们前面，有些走在我们后面，所有人都唱着歌，直到我们来到阿波罗斯那里。阿爸阿波罗斯听到歌声，出来迎接我们，正如他对待所有弟兄的惯常做法。看到我们，他首先俯伏于地向我们敬拜，然后起身亲吻了我们，接着把我们带进屋里，做了祷告，并亲手为我们洗脚，请我们休息。他就是这样对待所有到访的弟兄们的。'
    - type: paragraph
      text:
        ru: Жившие с ним братия принимали пищу не прежде, как приобщившись Евхаристии Христовой. Это делали они в девятом часу дня. По принятии пищи они садились слушать его, и он поучал их всем заповедям до сумерек. После того одни из них удалялись в пустыню и там читали наизусть Священное Писание целую ночь, другие оставались там, непрестанно восхваляя Бога песнопениями до наступления дня. Я сам своими глазами видел, как они начинали с вечера свое песнопение и не переставали петь даже до утра. А многие из них только в девятом часу сходили с горы и, приняв Евхаристию, опять восходили на гору и довольствовались одною духовною пищею до другого девятого часа. Так поступали многие из них в течение многих дней. При всем том они, как можно было видеть, радовались, живя в пустыне, – никто не укажет здесь, на земле, подобной радости и веселия телесного. Между ними никого не было скучного и печального. Если бы кто и показался когда печальным, авва Аполлос тотчас спрашивал его о причине скорби и открывал, что было у каждого в тайне сердца. «Не должно, – говорил он, – на пути спасения скорбеть тем, которые имеют наследовать Царство Небесное; пусть стенают язычники, плачут иудеи, скорбят грешники, а праведники должны радоваться. И если помышляющие о земном в земном находят радость, как же нам, удостоенным толикой надежды, не радоваться непрестанно, когда и апостол побуждает нас«всегда радоваться, непрестанно молиться, о всем благодарить»(1Сол. 5, 16–18)»?
        cn: 与他同住的修士们，只有在领受了基督的圣体圣血之后才用餐。他们通常在白天的第九小时这样做。用餐之后，他们坐下来聆听他，他便教导他们所有诫命，直到黄昏。之后，他们中的一些人退到旷野，并在那里整夜背诵圣经；另一些人则留在原地，不停地以圣诗颂赞上帝，直到天亮。我亲眼目睹，他们如何从傍晚开始他们的圣诗吟唱，并且不停地歌唱，甚至直到清晨。而他们中的许多人，只是在第九小时才从山上下来，领受了圣体圣血后，又再次登上山，并只以属灵的食物为满足，直到下一个第九小时。他们中的许多人如此行事，一连许多天。尽管如此，正如所见，他们住在旷野中喜乐着——在这地上，无人能指出类似的喜乐和身体的欢愉。他们中间没有一个无聊和忧愁的人。即使有人何时显得忧愁，阿波洛斯修士长立刻询问他忧愁的原因，并揭示了每个人心中隐藏的秘密。「在救恩的道路上，那些将要承受天国的人不应当忧愁，」他说道，「让外邦人哀叹，犹太人哭泣，罪人悲伤，而义人则应当喜乐。倘若思想属世事物的人在属世的事物中找到喜乐，我们这些蒙受如此巨大希望的人，怎能不持续不断地喜乐呢，当使徒也劝勉我们『常常喜乐，不住地祷告，凡事谢恩』（帖撒罗尼迦前书 5:16-18）？」
    - type: paragraph
      text:
        ru: 'Впрочем, кто может изобразить сладость бесед аввы Аполлоса и прочие его добродетели, о которых мы умолчали по причине их чрезвычайной чудесности, хотя и слышали от него самого и от других?! Часто, наедине беседуя с нами о подвижничестве, он говорил и о том, как принимать братию, то есть что должно кланяться приходящим братиям, ибо, говорил он, «ты кланяешься не им, а Богу; видя брата твоего, ты видишь Господа Бога твоего, и это приняли мы от Авраама». Еще говорил он, что должно братию усильно приглашать к успокоению – этому научились мы у Лота, который«принуди"Ангелов (Быт. 19, 3). Еще: что монахи должны, если могут, приобщаться каждодневно Святых Таин, потому что, кто удаляется от Святых Таин, тот удаляется от Бога. Например, кто постоянно приобщается, тот всегда принимает в себя Спасителя, ибо Сам Спаситель говорит:«Ядый Мою Плоть и пияй Мою Кровь во Мне пребывает, и Аз в нем»(Ин. 6, 56). Итак, полезно монахам постоянно воспоминать спасительное страдание и ежедневно быть готовыми удостоиться принятия Святых и Небесных Таин, ибо таким образом мы удостаиваемся отпущения грехов. «Также непозволительно, – говорил он, – нарушать без всякой нужды всеобщие посты, ибо в среду Спаситель предан, а в пяток распят. Посему, кто нарушает пост, тот вместе с врагами предает и распинает Спасителя. Если в пост придет к тебе брат, имеющий нужду в успокоении, предложи трапезу ему одному; если ж ему не угодно, не принуждай, ибо все мы имеем общее предание о посте».'
        cn: 尽管如此，谁又能描绘阿爸·阿波罗（Аполлос）谈话的甘甜以及他其他的德行呢？那些我们因其极其奇妙而未曾提及的德行，尽管我们从他本人和他人那里都听说了！他常常私下与我们谈论修道生活时，也谈到如何接待弟兄，也就是说，应当向到访的弟兄们鞠躬。因为，他说，「你所鞠躬的不是他们，而是上帝；看见你的弟兄，你就是看见你的主上帝，我们从亚伯拉罕那里领受了这一点。」他还说，应当殷切地邀请弟兄们安歇——这是我们从罗得那里学到的，他「勉强」了天使（创世记 19:3）。另外，修士们如果能够，就应当每日领受圣奥秘，因为谁远离圣奥秘，谁就远离上帝。例如，谁经常领受圣奥秘，谁就总是将救主领入自己里面，因为救主亲自说：「吃我肉喝我血的人常在我里面，我也常在他里面」（约翰福音 6:56）。因此，修士们常常追忆救赎的苦难，并每日准备好领受神圣和属天的奥秘是有益的，因为借此我们得蒙罪过赦免。「同样，在没有任何必要的情况下，打破普世禁食是不允许的，」他说，「因为在周三，救主被出卖；而在周五，他被钉十字架。因此，谁违背禁食，谁就与仇敌一同出卖和钉死救主。如果在禁食期间，有需要安歇的弟兄到你这里来，只给他一人提供膳食；如果他不乐意，不要强迫，因为我们所有人都有关于禁食的共同传统。」
    - type: paragraph
      text:
        ru: Много порицал он тех, которые носят оружие и отращивают волосы, ибо такие люди, по его словам, тщеславятся и стараются нравиться людям. Им должно бы постом изнурять свое тело и делать добро втайне, а они, напротив, выставляют себя пред всеми. Впрочем, что говорить много? Все наставления его точно соответствовали его жизни и достойным образом ни пересказать, ни описать их невозможно.
        cn: 他常常责备那些携带武器和留长头发的人，因为照他的话来说，这样的人心存虚荣，并力求讨好世人。他们本该借着禁食苦待己身，并在暗中行善，但他们却恰恰相反，在众人面前炫耀自己。话又说回来，何必多言呢？他所有的教诲都与他的生活完全吻合，并且无法以相称的方式复述或描绘出来。
    - type: paragraph
      text:
        ru: 'Таким образом побеседовав с нами о многом несколько раз в продолжение целой недели, он, отпуская нас, сказал: «Мир имейте между собою и на пути не отлучайтесь друг от друга». Когда же сказал он бывшим при нем братиям, не угодно ли кому из них проводить нас до других отцов, и когда почти все они изъявили свою готовность, святой Аполлос избрал из них трех мужей, сильных в слове и в жизни и знавших языки – греческий, римский и египетский, и, отпуская нас с ними, велел им не оставлять нас дотоле, пока мы не увидим всех отцов (только кто пожелал бы увидеть их всех, тот не успел бы сделать сего во всю жизнь). Наконец, он благословил нас и отпустил с сими словами: Да«благословитвасГосподь от Сиона, и узрите благая Иерусалима вовсядни живота»вашего (Пс. 127, 6).'
        cn: '这样，在整整一周的时间里，他与我们进行了数次谈话，内容丰富。在打发我们离开时，他说道：「你们要彼此和睦，在路上不要彼此分离。」


          当他问他身边的弟兄们，是否有人愿意送我们到其他教父那里时，几乎所有人都表示愿意。于是，圣阿波罗从中选出三位在言语和生命上都大有能力的弟兄，他们通晓希腊语、拉丁语和埃及语。在打发我们与他们同去时，他吩咐他们不要离开我们，直到我们见到所有教父（只是，若有人想见到所有教父，他一生也无法做到这一点）。最后，他祝福我们，并用这些话语打发我们离开：「愿上主从锡安赐福于你，愿你一生一世看见耶路撒冷的福乐。」 (诗篇 127:6)'
    - type: paragraph
      text:
        ru: 'Когда мы шли по пустыне в полдень, вдруг видим: дракон огромный, как бревно, ползет по песку. Увидев его, мы сильно испугались. Но провожавшие нас братия убеждали нас не бояться, а быть спокойными и держаться следа дракона. «Увидите, – говорили они, – веру нашу». Они надеялись убить его своими руками. «Мы уже убивали руками много и драконов, и аспидов, и керастов», – говорили они. Над ними исполнилось Писание:«Се, даю вам власть наступати на змию и на скорпию и на всю силу вражию»(Лк. 10, 19). Но мы, по неверию, а еще более по страху, просили их идти не по следу дракона, а по прямой дороге. Тогда один брат из числа их, оставив нас на месте, с великою отважностию устремился в пустыню по следам зверя. Нашедши недалеко его логовище, он громко кричал нам, что дракон в пещере, и звал к себе посмотреть, что будет, между тем как другие братия убеждали нас не пугаться. Когда мы с великим страхом пошли посмотреть зверя, нечаянно встретился с нами один брат и, ухватясь за нас руками, влек в свой монастырь и говорил, что мы не можем снести ярости того зверя. Тем больше, что никогда не видали его. А о себе говорил, что он часто видал это животное, что оно чрезвычайно велико и имеет больше пятнадцати локтей. Приказав нам остановиться, сам он пошел к тому брату и просил его оставить пещеру, ибо тот не хотел оставлять этого места, пока не убьет дракона. Однако ж он упросил его и привел к нам, а тот укорял нас в маловерии. Отдохнув у сего брата, которого монастырь отстоял на одну милю от того места, мы довольно укрепились в силах.'
        cn: 当我们在正午时分行走在旷野中时，突然，我们看到一条巨龙，粗如圆木，在沙地上爬行。看到它，我们大为惊恐。但陪伴我们的弟兄们劝我们不要害怕，而是要保持平静，并跟着龙的踪迹走。「你们会看到，」他们说，「我们的信心。」他们希望用自己的手杀死它。「我们已经用手杀死过许多龙、蝮蛇和角蝰了，」他们说。在他们身上应验了圣经的话语：「看哪，我赐给你们权柄，可以践踏蛇和蝎子，又胜过仇敌一切的能力」（路加福音 10:19）。但是我们，由于缺乏信心，并且更多是由于恐惧，请求他们不要跟着龙的踪迹走，而是走直路。于是，他们中间的一位弟兄，将我们留在原地，带着极大的勇气，冲进了旷野，循着那野兽的踪迹。他不久便找到了它的巢穴，便大声向我们喊道那龙在洞穴里，并叫我们过去看会发生什么，与此同时，其他的弟兄们劝我们不要害怕。当我们带着极大的恐惧去查看那野兽时，不期然遇到一位弟兄，他用手抓住我们，把我们拉到他的修道院去，并说我们无法承受那野兽的凶猛。更何况我们从未见过它。至于他自己，他说他经常见过这种动物，它极其巨大，并且有十五腕尺多长。他吩咐我们停下，自己走向那位弟兄，并请求他离开洞穴，因为那弟兄不愿离开那个地方，直到杀死那条龙。然而，他还是说服了他，并把他带到我们这里，而那位弟兄则责备我们信心不足。在这位弟兄那里休息后，他的修道院距离那个地方有一英里远，我们的体力得到了相当的恢复。
  - type: heading2
    text:
      ru: Об авве Аммуне
      cn: 论亚巴·阿蒙
    children:
    - type: paragraph
      text:
        ru: 'Этот брат рассказывал нам, что в том месте, где он жил, был один святой муж, у которого он учился, по имени Аммун, совершивший в том месте весьма много чудес. К нему часто приходили разбойники и брали его хлебы и пищу. Но в один день он пошел в пустыню, привел с собою оттуда двух больших драконов и велел им стоять на страже у своей двери. Разбойники пришли, по обыкновению, и, увидевши чудо, онемели от ужаса и пали ниц. Аммун, вышедши, увидел, что они немы и почти полумертвы, поднял их и стал укорять так: «Посмотрите, сколько вы свирепее зверей; вот они ради Бога повинуются нашей воле, а вы и Бога не боитесь, и христианского благочестия не уважаете». Потом, введши их в самую келию, предложил им трапезу и увещевал переменить жизнь. Оставив прежнюю жизнь, они оказались лучшими многих, а чрез несколько времени и сами стали совершать такие же знамения.'
        cn: 这位弟兄告诉我们，在他所住的地方，有一位圣人，他曾向其学习，名叫阿蒙，在那地方行了许多奇迹。强盗们常到他那里，拿走他的饼和食物。但有一天，他去了旷野，从那里带来了两条大龙，并吩咐它们守在他的门前。强盗们照常来了，看见了这奇迹，惊恐得说不出话来，并且俯伏在地。阿蒙出来，看见他们说不出话，几乎半死，就扶起他们，并责备他们说：「看哪，你们比野兽何等凶残；它们为着上帝顺服我们的意愿，而你们既不敬畏上帝，也不尊重基督徒的虔敬。」之后，他把他们领进自己的修道室，为他们准备膳食，并劝勉他们改变生活。他们抛弃了过去的生活，证明自己比许多人更优秀，过了不久，他们自己也开始行同样的奇迹。
    - type: paragraph
      text:
        ru: 'В одно время, рассказывал тот же брат, большой дракон опустошал соседнюю страну и истреблял множество животных. Тогда жившие близ пустыни все вместе пришли к авве и просили истребить в их стране этого зверя. Но он, будто не могши ничего сделать для них, отпустил их в печали, а сам, вставши наутро, пошел по следам зверя. Когда авва трижды преклонил колена для молитвы, зверь пришел к нему с сильным свистом, испуская страшное дыхание, надуваясь, шипя и издавая зловонный запах. Авва нимало не убоялся и, обратясь к дракону, сказал: «Да поразит тебя Христос, Сын Бога Живого, имеющий сокрушить великого зверя». Как только он сказал это, дракон тотчас расселся, изблевав изо рта весь яд вместе с кровью. Пришедши на другой день и увидевши это великое чудо, поселяне никак не могли стерпеть запаха от дракона и засыпали зверя кучею песка. Тут же с ними находился и авва, ибо они одни не смели приближаться к дракону, хотя он был уже мертв.'
        cn: 有一次，同一位修士讲道，一条巨龙正在蹂躏邻近的国土，并残杀了许多动物。于是，居住在荒漠附近的人们都一同来到阿爸那里，请求他消灭他们国家里的这只野兽。但他，好像无法为他们做任何事，便让他们忧愁地离开了，而他自己，第二天早上起来后，便沿着野兽的踪迹而去。当阿爸三次屈膝祈祷时，那野兽便带着强烈的嘶叫声向他而来，喷吐着可怕的气息，膨胀着，嘶嘶作响，并散发出恶臭。阿爸丝毫没有畏惧，转过身对那巨龙说：「愿基督，永生上帝之子，那将要击碎巨兽的，击败你！」他刚说完此话，那巨龙立刻裂开，口中吐出了全部毒液和血液。第二天来到并看到这个伟大的奇迹后，村民们丝毫无法忍受巨龙发出的气味，便用一堆沙子将这野兽掩埋。阿爸当时也和他们在一起，因为他们独自不敢靠近那巨龙，尽管它已经死了。
    - type: paragraph
      text:
        ru: А прежде, продолжал брат, когда дракон был еще жив, вдруг увидел его один отрок, пасший стадо. Испугавшись, он упал замертво и целый день лежал бездыханный на поле близ пустыни. К вечеру родственники нашли его и, заметив, что он еще несколько дышит, только весь распух от удара, приносят его к авве, а между тем не знали, отчего это случилось. Когда авва помолился и помазал отрока елеем, он встал и рассказал виденное им. Это особенно и побудило сего мужа решиться на истребление дракона.
        cn: 而在此之前，弟兄接着说，当那条龙仍然活着时，一个牧羊的少年突然看见了它。他吓坏了，倒地昏死过去，一整天了无生气地躺在靠近旷野的田野中。到了傍晚，他的亲属找到了他，发现他还有微弱的气息，只是全身因撞击而肿胀，便把他带到阿爸那里，然而他们并不知道这事是如何发生的。当阿爸祈祷并用圣油给少年傅油后，他便站了起来，并讲述了他所目睹的一切。这尤其促使这位（圣）人决心要铲除这条龙。
  - type: heading2
    text:
      ru: Об авве Коприи пресвитере
      cn: 关于亚巴·科普里斯司祭
    children:
    - type: paragraph
      text:
        ru: 'Один пресвитер, по имени Коприй, имел неподалеку оттуда монастырь в пустыне. Это был муж святой, почти девяноста лет, настоятель пятидесяти братий. Он делал также весьма много чудес: врачевал болезни, совершал много исцелений, изгонял демонов, творил много знамений, и некоторые в наших глазах. Увидев и помолившись о нас, он умыл нам ноги и спрашивал нас, что делаетcя в мире. Но мы просили, чтобы он лучше рассказал нам о добродетелях своей жизни и о том, как Бог ниспослал ему дары и каким образом он получил сию благодать. Он без всякой гордости стал нам рассказывать о жизни своей и своих предшественников, великих мужей, из коих многие превосходили его и которых жизни подражал он. «Дети, – говорил он, – нет ничего удивительного в моих делах в сравнении с подвигами отцов наших».'
        cn: 一位名叫科普里的长老，在不远处拥有一座沙漠修道院。他是一位圣人，将近九十岁，是五十位修士的院长。他也行了许多奇迹：医治疾病，行了许多医治，驱逐恶魔，行了许多神迹，其中一些是在我们眼前发生的。他看见我们，并为我们祷告后，他为我们洗脚，并问我们世上有什么事。但我们请求他不如向我们讲述他生活中所行的美德，以及神如何赐予他恩赐，以及他如何获得这份恩典。他毫无骄傲地开始向我们讲述他自己的生平，以及他的前辈，那些伟人，其中许多人超越了他，而他则效法他们的生活。「孩子们，」他说道，「我的作为与我们的教父们所行的苦修相比，没有什么可惊奇的。」
    - type: paragraph
      text:
        ru: 'Между тем как пресвитер Коприй еще рассказывал об этом, один из наших братий, не веривший его словам, задремал и видит, что в руках у того мужа находится дивная книга, исписанная золотыми буквами, и что какой-то седой муж подошел и грозно сказал ему: «Что же ты не внимаешь чтению и дремлешь?». Устрашенный брат тотчас по латыни рассказал нам слышанное и виденное им. Еще он говорил нам об этом, как пришел один поселянин с корзиной, наполненной песком, и, приблизившись, ожидал, пока брат кончит свой рассказ. Мы спросили пресвитера, чего хочет этот поселянин с песком. Авва сказал нам в ответ: «Дети, не надлежало бы нам хвалиться перед вами и рассказывать о славных делах отцов, дабы, возгордившись умом, мы не лишились награды. Но поскольку вы пришли к нам из столь отдаленной страны, то за такую ревность и искание пользы я не лишу вас назидания, но в присутствии братий расскажу, что Бог устроил чрез нас.'
        cn: 当时，长老科普里还在讲述这件事，我们中的一位不相信他话语的弟兄打了个盹，他看见那人手中有一本奇妙的书，是用金字写成的；并且有一位白发男子走过来，严厉地对他说：「你为何不专心聆听，反而打盹呢？」吓坏了的弟兄立刻用拉丁语把所听见和所看见的告诉了我们。他还在告诉我们这件事的时候，有一位乡下人提着一篮沙子走了过来，他走近后等着那位弟兄讲完他的故事。我们问长老，那个提着沙子的乡下人想做什么。亚巴回答我们说：「孩子们，我们不应当在你们面前夸耀，也不应当讲述先父们荣耀的事迹，免得我们因心生骄傲而失去了赏赐。但既然你们从如此遥远的地方来到我们这里，那么为了这份热心和寻求益处的心，我不会使你们得不到教诲，而是在弟兄们面前，讲述上帝藉着我们所成就的事。」
    - type: paragraph
      text:
        ru: 'Соседняя нам страна была бесплодна, и владевшие ею поселяне, посеяв хлеб, едва собирали его вдвое против посеянного, ибо червь, зарождаясь в колосе, повреждал всю жатву. Земледельцы, оглашенные нами и сделавшиеся христианами, просили нас помолиться о жатве. Я сказал им: “Если вы имеете веру в Бога, то и этот пустынный песок будет приносить вам плод”. Они немедленно набрали в пазуху вот этого песка, по которому мы ходим, и принесли к нам, прося нашего благословения. Когда я помолился, чтобы было по вере их, они посеяли его на полях вместе с хлебом, и вдруг земля их стала плодоноснее всякой земли в Египте. Таким образом, привыкши это делать, они ежегодно приходят к нам с прежнею просьбою».'
        cn: 与我们相邻的国家贫瘠荒芜，拥有这片土地的农民们在播种粮食后，勉强只能收获所播种量的两倍，因为虫子在麦穗中滋生，毁坏了全部庄稼。那些受我们开导并归信的农民们，请求我们为他们的收成祷告。我对他们说：「如果你们对上帝有信心，那么即便是这荒凉的沙土，也会给你们带来果实。」他们立刻捧了一把我们脚下所走的这沙土在怀中，带到我们这里，请求我们的祝福。当我祷告，愿照着他们的信心成就时，他们将这沙土与粮食一同播撒在田地里，忽然之间，他们的土地变得比埃及任何土地都更肥沃丰饶。就这样，习惯了这样做之后，他们每年都带着同样的请求来到我们这里。」
    - type: paragraph
      text:
        ru: '«Еще одно великое чудо, – продолжал авва, – Бог сподобил меня совершить в присутствии многих. Однажды пришел я в город и встретил одного манихея[20], который обольщал народ. Как не мог я убедить его при народе, то, обратясь к толпе, сказал: “Зажгите на площади большой костер; мы оба войдем в огонь, и, кто из нас останется невредим от него, того и вера хороша”. Это было исполнено: народ поспешно зажег костер и потащил манихея вместе со мною в огонь. Но манихей сказал: “Пусть каждый из нас порознь войдет в огонь, и первый должен вступить ты сам, приказавший это сделать”. Когда же я, знаменовав себя именем Христовым, взошел на костер, то пламень расступился на две стороны и нимало не повредил мне, хотя я пробыл в нем полчаса. Народ, увидев чудо, поднял крик и заставлял манихея войти в огонь, но он устрашился и не хотел этого сделать. Тогда народ схватил его и втолкнул в средину огня. Он весь был охвачен пламенем и тотчас с бесчестием выгнан был из города при крике народа: “Сожгите обманщика заживо!”. А меня народ взял под руки и, прославляя Бога, проводил до церкви.'
        cn: 「另一个伟大的神迹——长老继续说道——上帝使我得以在许多人面前成就。有一天我来到城里，遇到一个摩尼教徒[20]，他迷惑着众人。因为我无法在众人面前说服他，于是我转向人群说：『在广场上点燃一个大火堆；我们俩都走进火里，我们当中谁能安然无恙地从火中出来，谁的信仰就是好的。』这事就照着做了：众人急忙点燃了火堆，并把我与摩尼教徒一同拉进了火里。但是摩尼教徒说：『让我们各自单独走进火里，而且你，这个吩咐的人，必须第一个进去。』当我以基督之名划圣号，登上火堆时，火焰就向两边分开，丝毫没有伤害我，尽管我在里面待了半个小时。众人看到这神迹后，便大声呼喊，并强迫摩尼教徒走进火里，但他却惧怕了，不愿进去。于是众人抓住他，把他推入火中。他全身被火焰吞噬，并立即被羞辱地赶出城去，在众人喊着『活活烧死这骗子！』的声音中。而众人则扶着我，并赞美着上帝，把我送到了教堂。」
    - type: paragraph
      text:
        ru: 'В другое время, когда я проходил чрез одно капище, несколько язычников приносили жертву своим идолам. Я сказал им: “Для чего вы, существа разумные, приносите жертвы неразумным? Чрез это вы становитесь не разумнее, чем они”. И так как мои слова были верны, то они тотчас последовали мне и уверовали в Спасителя.'
        cn: 另一次，当我经过一个异教神庙时，有几个异教徒正在给他们的偶像献祭。我对他们说：「你们这些有理智的生灵，为何要给那些无理智的献祭？藉着这，你们就变得不比它们更有理智了。」并且因为我的话语是真实的，他们就立刻跟随了我，并相信了救主。
    - type: paragraph
      text:
        ru: 'Некогда был у меня недалеко в поле сад для приходивших к нам братий, и один бедный человек обрабатывал его. Однажды пришел туда какой-то язычник украсть овощей. Когда он украл и пришел домой, то три дня не мог сварить их: они оставались в котле такими же, какими были взяты, ибо вода вовсе не нагревалась. Тогда этот человек, пришедши в себя, взял овощи и принес их к нам, умоляя простить ему грех и сделать его христианином, что и было исполнено. В это самое время пришли к нам странники-братия, и для них особенно ко времени принесены были к нам овощи. Вкусивши их, мы возблагодарили Бога за получение двойной радости, то есть за то, что и человек спасен, и братия укрепились».'
        cn: '曾有一次，我在田野不远处有一个菜园，是为前来我们这里的修士兄弟们预备的，有一个穷人在打理它。


          有一天，一个异教徒来到那里偷蔬菜。当他偷了蔬菜回家后，竟然三天都煮不熟它们：它们在锅里仍旧像刚拿来时一样，因为水根本烧不热。


          于是这个人醒悟过来，拿上蔬菜并把它们带到我们这里，恳求我们赦免他的罪并使他成为基督徒，而他的请求也得到了满足。


          就在这时，有漂泊的修士兄弟们来到我们这里，这些蔬菜的到来，对他们来说尤其及时。


          尝过这些蔬菜后，我们感谢了上帝，因为我们得到了双重的喜乐，也就是因为这人得到了救赎，并且修士兄弟们也得了坚固。'
  - type: heading2
    text:
      ru: Об авве Сурусе
      cn: 关于阿爸苏鲁斯
    children:
    - type: paragraph
      text:
        ru: 'Однажды авва Сурус,авва Исаияи авва Павел, мужи благочестивые и подвижники, сошлись вместе, чтобы посетить великого исповедника – авву Анувия. Он жил от них на расстоянии трех дней пути. И говорят они друг другу: «Пусть каждый из нас покажет свой образ жизни и как он почтен от Бога здесь, на земле». Авва Сурус сказал им: «Прошу у Бога дара, чтобы силою Духа достигнуть нам того места без утомления». И только лишь он помолился, тотчас явились готовое судно и благоприятный ветер, и в одно мгновение они очутились на месте, хотя плыли против течения.'
        cn: 有一次，亚巴苏鲁斯、亚巴以赛亚和亚巴保罗，这几位虔诚的修士和苦行者，聚在一起拜访伟大的承教者——亚巴阿努比亚。他住在离他们三天路程的地方。他们彼此说：「愿我们每个人都展现自己的生活方式，以及他如何在此世蒙上帝的尊荣。」亚巴苏鲁斯对他们说：「我向上帝祈求一份恩赐，使我们借着圣神的能力，不觉疲惫地到达那个地方。」他一祈祷完，立刻就有一艘准备好的船和一股顺风出现，他们瞬间就到达了目的地，尽管他们是逆流而行。
  - type: heading2
    text:
      ru: Об авве Исаии
      cn: 关于阿爸伊撒意亚
    children:
    - type: paragraph
      text:
        ru: 'Исаия говорит им: «Что удивительного, друзья, если встретит нас муж, который перескажет нам жизнь каждого из нас?».'
        cn: 以赛亚对他们说：「朋友们，如果有一个男子遇见我们，他会把我们每个人的生平都讲述给我们，这有什么可惊奇的呢？」
  - type: heading2
    text:
      ru: Об авве Павле
      cn: 论阿爸保罗
    children:
    - type: paragraph
      text:
        ru: 'Павел же говорит им: «А если и нам Бог открыл, что чрез три дня Он возьмет Анувия к себе?». Когда пошли они вперед, к месту жительства Анувия, сей муж, вышедши к ним навстречу, приветствовал их. Павел сказал ему: «Расскажи нам свои дела, ибо послезавтра ты отойдешь к Богу».'
        cn: 保罗却对他们说：「倘若上帝也向我们启示了，祂将在三天后将阿努维接到祂身边呢？」当他们继续前行，往阿努维的住处去时，那位男士出来迎接他们，并问候了他们。保罗对他说：「请告诉我们你的行事，因为后天你将归向上帝。」
  - type: heading2
    text:
      ru: Об авве Анувии
      cn: 论阿爸阿努布
    children:
    - type: paragraph
      text:
        ru: 'Авва Анувий сказал им: «Благословен Бог, известивший и меня об этом, так же как и о вашем прибытии и подвижничестве». Сказавши о подвигах каждого из них, далее он стал рассказывать и о своих подвигах следующим образом: «С того времени как я исповедал на земле имя Спасителя, не исходила ложь из уст моих. Я не питался земною пищею, ибо Ангел ежедневно питает меня пищею небесною[21]. В сердце мое не входило желание ничего иного, кроме Бога. Бог не скрыл от меня, что делается на земле. Свет не заходил от глаз моих: я и днем не спал, и ночью не отдыхал, ища Бога, и Ангел всегда был при мне, показывая силы мира. Свет ума моего не погасал. Все, чего просил я у Бога, скоро получал. Многократно видал я тьмы Ангелов, предстоящих Богу; видел лики праведников; видел сонмы мучеников; видел, как все они восхваляют Бога; видел сатану, предаваемого огню; видел аггелов его, терпящих наказание; видел праведников, вечно веселящихся». Рассказав это и многое другое в продолжение трех дней, авва предал душу. Ее тотчас приняли Ангелы и лики мучеников и понесли на небеса, а братия видели это и слышали их песнопения.'
        cn: '阿巴·阿努维对他们说：「愿上帝受颂扬，他将此事也告知了我，正如他告知了我你们的到来和苦修一样。」他述说了他们每个人的苦修事迹后，接着他便如此讲述了自己的苦修事迹：


          「自从我在地上承认了救主的名以来，我口中就没有说出谎言。我不以世俗的食物为食，因为天使每日以天上的食物喂养我[21]。我的心中从未生出对除了上帝以外的任何事物的渴望。上帝没有向我隐藏地上所发生的一切。光明从未从我的眼中消失：我白日不睡，夜晚不息，寻求上帝，天使也常在我身边，向我展示世间的权能。我心智的光芒从未熄灭。我向上帝所求的一切，都速速得着。我多次看见无数天使侍立在上帝面前；看见义人的面容；看见殉道者的群体；看见他们所有人都赞美上帝；看见撒但被投入火中；看见他的使者们遭受惩罚；看见义人永远欢喜快乐。」连续三天讲述了这些以及许多其他事情后，阿巴便将灵魂交付了出去。天使和殉道者的众面容立刻接纳了它，并将其带往天堂，而弟兄们看见了这一切，也听见了他们的歌声。'
  - type: heading2
    text:
      ru: Об авве Эллине
      cn: 关于阿爸埃林
    children:
    - type: paragraph
      text:
        ru: 'Другой авва, по имени Эллин, с детства подвизавшийся в добродетели, приносил часто к братиям, жившим в соседстве с ним, огонь за пазухой, возбуждая и в них желание показывать знамения. Он говорил им: «Если вы поистине подвизаетесь, то покажите знамения добродетели».'
        cn: 另一位名叫埃林的阿爸，从小就在德行上操练，常常把火藏在怀里，带给住在附近与他为邻的弟兄们，也在他们里面激发了显出神迹的愿望。他对他们说：「如果你们真地在操练，那么就显出德行的记号来。」
    - type: paragraph
      text:
        ru: 'Однажды, когда он был один в пустыне, ему захотелось меду. Скоро нашел он под камнем соты и сказал: «Удались от меня необузданное похотение, ибо писано:«духом ходите и похоти плотские не совершайте»(Гал. 5, 16)» – и, оставив соты, удалился.'
        cn: 有一次，当他独自在旷野里时，他渴望得到蜂蜜。很快，他找到了一块石头下的蜂巢，便说：「这放纵的私欲，离开我吧！因为经上记着说：『当靠圣灵行事，就不放纵肉体的私欲了』（加拉太书 5:16）。」于是，他留下蜂巢，离开了。
    - type: paragraph
      text:
        ru: 'Еще: постившись в пустыне три недели, он нашел разбросанные плоды и сказал: «Не буду есть и не прикоснусь к ним, да не соблазню брата моего, то есть душу мою, ибо писано:«не о хлебе единем жив будет человек»(Мф. 4, 4)». Постившись и еще неделю, он наконец заснул. Ангел явился ему во сне и сказал: «Встань и ешь, что найдешь». Он встал и, осмотревшись вокруг, видит источник, около которого выросли роскошные растения. Он принял питие и пищу из растений и утверждал, что ничего приятнее в жизни не вкушал. Нашедши на том месте небольшую пещеру, он пробыл там несколько дней без пищи. Наконец, когда почувствовал нужду в пище, он, преклонив колена, стал молиться – и тотчас ему предложены были всякие яства, теплые хлебы, оливки и различные плоды.'
        cn: 此外：他在旷野禁食了三周后，找到了一些散落的果实，便说：「我不吃，也不碰它们，免得我诱惑了我的弟兄，也就是我的灵魂，因为经上记着说：『人活着不是单靠食物』（马太福音 4:4）。」他又禁食了一周，终于睡着了。天使在梦中向他显现，并说：「起来，吃你所找到的。」他起来，环顾四周，看见一个泉水，泉水旁长着丰盛的植物。他从这些植物中取了饮品和食物，并声称他一生中从未尝过如此美味的东西。在那个地方找到一个小山洞后，他在那里住了几天，没有进食。最终，当他感到需要食物时，他跪下祷告——随即有各式各样的美食、温暖的面包、橄榄和各种水果呈现在他面前。
    - type: paragraph
      text:
        ru: 'Некогда он посетил своих братий и, преподав им много наставлений, поспешно удалился в пустыню, взяв с собою некоторые нужные вещи. Увидев на пастбище несколько диких ослиц, он сказал к ним: «Во имя Христово, пусть одна из вас придет ко мне и возьмет на себя мою ношу». И тотчас одна прибежала к нему. Положив на нее свои вещи, он сел на нее и в один день прибыл к пещере.'
        cn: 有一次，他探访了他的弟兄们，给了他们许多教诲，便带着一些必需之物匆匆隐退到旷野。他在草场上看见了几头野母驴，便对它们说：「奉基督圣名，愿你们中有一头来到我这里，驮上我的重物。」于是立刻有一头跑了过来。他把自己的东西放在驴背上，骑了上去，并在一天之内抵达了那洞穴。
    - type: paragraph
      text:
        ru: Однажды, когда он разложил на солнце хлебы и плоды, подошли к ним звери, обыкновенно приходившие на источник, и, лишь только коснулись хлебов, тотчас умерли.
        cn: 有一次，当他把面包和水果摊开在阳光下时，那些平时会来到泉水边的兽类走近了它们，它们刚一触碰到面包，就立刻死去了。
    - type: paragraph
      text:
        ru: 'В один воскресный день он пришел к некоторым монахам и сказал им: «Что вы ныне не собирались к богослужению?». Когда они отвечали, что не пришел пресвитер (живший на противоположном берегу), он сказал им: «Пойду призову его». Они сказали, что нельзя перейти поток по причине глубины его. Притом же, говорили они, в этом месте живет огромный зверь – крокодил, истребивший много людей. Он немедленно встал и пошел к потоку, и вдруг зверь, взяв его на свою спину, перенес на другой берег. Нашедши пресвитера в поле, он просил его не оставлять братии. Сей, видя, что он одет в рубище, сшитое из многих лоскутов, спросил у него, где он взял рубище, и прибавил: «Брат, одеяние души твоей – прекрасное!». И, подивившись его смиренномудрию и убожеству, последовал за ним к реке. Но тут они не нашли лодки, и авва Эллин громким голосом стал звать крокодила. Крокодил тотчас явился по его зову и подставил спину. Авва Эллин приглашал и пресвитера сесть с собою, но сей, увидев зверя, испугался и отступил назад. Он и братия, жившие на том берегу, с ужасом смотрели, как авва переплывал поток на звере. Вышедши на сушу, он привел с собою и зверя и сказал, что ему лучше умереть и понести наказание за погубленные им души. Зверь тотчас упал и умер.'
        cn: 在一个主日，他来到几位修士那里，对他们说：「你们今天为什么没有聚集起来做礼拜呢？」当他们回答说司祭没有来（他住在对岸）时，他便对他们说：「我去把他叫来。」他们说无法渡过那条溪流，因为它水深。此外，他们说，在这个地方住着一只巨大的野兽——一只鳄鱼，它吞噬了许多人。他立刻起身走向溪流，忽然那只野兽将他驮在背上，渡到对岸。在田野里找到司祭后，他恳求他不要撇下弟兄们。这位司祭，看见他身穿一件由许多碎布缝制而成的破旧衣服，便问他是在哪里得到这件破旧衣服的，并补充说：「弟兄，你灵魂的衣裳是多么美丽啊！」并感到惊奇于他的谦卑智慧和贫乏，便跟着他来到河边。但他们没有找到船，于是阿瓦·埃林大声呼唤鳄鱼。鳄鱼立刻按照他的呼唤出现，并将背部伸给他。阿瓦·埃林也邀请司祭与他一同坐下，但这位司祭一看见这只野兽，便害怕地后退了。他连同住在对岸的弟兄们，都惊恐地看着阿瓦如何骑在野兽背上渡过溪流。上岸后，他将那只野兽也带了过来，并对它说，它最好死去，并承受惩罚，为了它所毁灭的那些灵魂。那只野兽立刻倒下，死了。
    - type: paragraph
      text:
        ru: Пробыв у братий три дня, авва все это время учил их заповедям и открыл им сокровенные намерения каждого. Тот, говорил он, терпит беспокойство от помыслов блудных, другой – от тщеславия, третий – от сластолюбия, а иной – от гнева; одного называл кротким, другого – миролюбивым; в одном обличал пороки, в другом хвалил добродетели. Слыша это, они удивлялись и говорили, что это правда.
        cn: 阿爸在弟兄们那里住了三天，在这整个时间里教导他们诫命，并向他们揭示了每个人隐藏的心思。他说，这个人正饱受淫乱思想的困扰，另一个人则受虚荣的困扰，第三个则受纵欲的困扰，还有一个人则受愤怒的困扰；他称一个人为谦和的，称另一个人为爱好和平的；在一个人身上他谴责其恶习，在另一个人身上他赞扬其美德。听了这些话，他们感到惊奇，并说这是真的。
    - type: paragraph
      text:
        ru: 'Затем он сказал им: «Приготовьте нам овощей, ибо ныне придет к нам много братий». Действительно, братия пришли еще во время приготовления и облобызали друг друга.'
        cn: 接着他对他们说：「给我们准备些蔬菜，因为今天会有许多弟兄来我们这里。」果然，弟兄们还在准备的时候就来了，并且彼此亲吻。
    - type: paragraph
      text:
        ru: Один из сих братий, желая жить с аввою в пустыне, просил его об этом. Когда же авва говорил, что ему не перенести искушений демонских, тот с настойчивостью стал утверждать, что все перенесет. Авва Эллин принял его и велел ему жить в другой пещере. Демоны сперва много смущали его срамными помыслами, потом, явившись ночью, начали душить его. Он бежал из пещеры и рассказал авве Эллину о случившемся. Авва, очертив то место, велел ему впредь пребывать на нем без боязни.
        cn: 这些修士中的一位，渴望与一位长老在旷野生活，便向他提出请求。当这位长老说他无法承受魔鬼的试探时，那人却坚持声称他会承受一切。长老埃林接纳了他，并吩咐他住在另一个洞穴里。魔鬼起初用许多污秽的思想搅扰他，后来，夜间显现，开始勒死他。他逃出洞穴，并把发生的事情告诉了长老埃林。长老在那个地方划了记号，吩咐他今后毫无畏惧地留在那里。
    - type: paragraph
      text:
        ru: 'Однажды, когда у них в пещере недостало хлебов, Ангел пришел в образе брата и принес им пищу. В другое время десять братий искали его по пустыне и семь дней оставались без пищи. Наконец авва встретил их и велел им отдохнуть в пещере. Когда они напомнили ему о пище, он, не имея ничего предложить им, сказал: «Бог силен уготовать трапезу в пустыне», – и тотчас явился благообразный юноша и постучал в двери в то время, как они молились. Они отворили дверь и увидели юношу с большою корзиною, наполненною хлебами и оливками. Приняв это, они вкусили пищи и возблагодарили Господа, а отрок тотчас стал невидим.'
        cn: '有一次，当他们在山洞里缺少饼时，一位天使化作弟兄的形象，给他们带来了食物。


          另一次，有十位弟兄在旷野里寻找他，七天未进饮食。最后，阿爸遇见了他们，并吩咐他们去山洞休息。当他们向他提及食物时，他因为没有什么可以招待他们的，就说：「上帝有能力在旷野预备筵席。」随即，一位容貌端庄的少年出现了，在他们祷告的时候敲响了门。他们打开门，看见少年带着一个大篮子，里面装满了饼和橄榄。他们领受了这些，就享用了食物，并向上主献上感恩，而那位少年随即隐去了。'
    - type: paragraph
      text:
        ru: Авва Коприй, рассказав нам это и много другого удивительного и обласкавши нас, привел в свой сад и показал нам пальмы и другие плодовитые деревья. Он сам насадил их в пустыне, возбужденный верою поселян, которым он сказал, что и пустыня может приносить плоды тем, кто имеет веру в Бога. «ибо, когда я увидел, что они засеяли песок и поле их стало плодоносно, – говорил он, – то и сам сделал то же и получил успех».
        cn: 阿爸科普里，在给我们讲了这些以及许多其他令人惊奇的事，并亲切地招待我们之后，带领我们到他的园子，给我们看了棕榈树和其他结果实的树木。他自己亲手把它们栽种在沙漠里，受那些乡村居民的信心的激励，因为他曾对他们说，凡是对上帝有信心的人，即使是沙漠也能结出果实。「因为，当我看到他们播种在沙地上，他们的田地变得肥沃时，」——他说道——「我自己也做了同样的事，并且获得了成功。」
  - type: heading2
    text:
      ru: Об авве Апеллесе пресвитере
      cn: 论阿爸阿佩勒斯长老
    children:
    - type: paragraph
      text:
        ru: Видели мы и другого пресвитера, в Верхней стране, – мужа праведного по имени Апеллес. Он сперва занимался ремеслом медника, а потом обратился к подвижничеству. Однажды, когда к нему пришел диавол в образе женщины, он, в то время делая медные вещи для монахов, нарочно схватил рукою раскаленное железо и обжег женщине все лицо и тело. И братия слышали, как она кричала в келии. С того времени этот муж всегда берет рукою раскаленное железо без всякого вреда. Он принял нас дружелюбно и вот что рассказывал о живших с ним богоугодных мужах, которые живы еще и ныне.
        cn: 我们还见过另一位长老，在上埃及，一位名叫阿佩勒斯的义人。他起初是铜匠，后来转向了苦修生活。有一次，当魔鬼以女人的形象来到他那里时，他当时正在为修士们制作铜器，就故意用手抓起烧红的铁块，烧伤了那个女人的整个脸部和身体。弟兄们听到她在修道室里尖叫。从那时起，这位修士总是用手拿起烧红的铁块，毫发无损。他友好地接待了我们，并讲述了以下关于那些与他一同生活的蒙神喜悦的修士们的故事，他们如今仍然活着。
  - type: heading2
    text:
      ru: Об авве Иоанне
      cn: 关于阿爸约翰
    children:
    - type: paragraph
      text:
        ru: Есть в этой пустыне, говорил он, брат наш Иоанн, не нашего, впрочем, века человек, ибо он превосходит добродетелями нынешних монахов. Найти же его скоро никто не может, потому что он всегда ходит по пустыне с места на место.
        cn: 他说，在这片旷野里有我们的弟兄约翰，然则他不是我们这个时代的人，因为他在德行上超越了现在的修士们。然而没有人能迅速找到他，因为他总是在旷野中从一个地方走到另一个地方。
    - type: paragraph
      text:
        ru: Он сперва три года стоял под одной скалой, проводя все это время в непрестанной молитве, никогда не садился и не ложился спать и только стоя имел несколько сна. Только в воскресные дни принимал Евхаристию, которую приносил ему пресвитер, и более ничего не ел.
        cn: 他起初在某块岩石下站立了三年，这段时期他恒久不断地祈祷，从不坐下或躺下睡觉，仅在站立时小憩片刻。唯有在主日领受圣体圣血，由一位长老送来，除此以外别无进食。
    - type: paragraph
      text:
        ru: 'В один день сатана, приняв на себя образ пресвитера, поспешно приходит к нему и показывает вид, будто хочет преподать ему Причастие. Но блаженный Иоанн, узнав его, сказал ему: «Отец всякого обмана и всякого лукавства, враг всякой правды! Ты не только непрестанно обольщаешь души христиан, но и дерзаешь ругаться над самыми Святыми Таинствами». Диавол отвечал ему: «Едва не удалось мне уловить тебя. Этим способом я обольстил одного из твоих братий и, лишив его рассудка, довел до сумасшествия. Многие праведники много молились за него и едва возмогли привести его в разум». Сказав сие, демон удалился от него.'
        cn: 有一天，撒但伪装成一位神父，匆忙地来到蒙福者约翰那里，并且装作要给他施领圣餐的样子。但蒙福者约翰认出了他，对他说：「一切欺骗和一切诡诈之父，一切真理之敌！你不仅不断地诱惑基督徒的灵魂，竟然还敢亵渎神圣的奥秘。」魔鬼回答他说：「我差点就抓住你了。用这种方法，我诱惑了你的一个弟兄，使他失去理智，陷入疯狂。许多义人曾为他恳切祈祷，费了九牛二虎之力才使他恢复清醒。」说完这些，邪魔就离开了。
    - type: paragraph
      text:
        ru: 'Когда же от продолжительного стояния у него растрескались ноги и стали гноиться, тогда явился Ангел и, коснувшись уст его, сказал: «Господь будет для тебя истинною пищею, и Дух Святый – истинным питием, но теперь пока достаточно для тебя духовного пития и пищи, чтобы иначе, от пресыщения, ты не изверг их», – и, исцелив его, свел с места. После того он стал странствовать по пустыне и питаться растениями. В воскресный же день являлся на прежнее место для принятия Причастия.'
        cn: 当时，因长时间站立，他的双腿开裂并开始流脓，那时，一位天使显现，触摸了他的嘴唇，说道：「主将成为你真实的食物，圣灵将成为你真实的饮品。但现在你所拥有的属灵饮品和食物已经足够了，以免你因过饱而将它们吐出。」天使医治了他，并将他从那里带了下来。之后，他便开始在旷野中流浪，以植物为食。然而在主日，他会回到原来的地方，为了领受圣体圣血。
    - type: paragraph
      text:
        ru: Выпросив у пресвитера несколько пальмовых ветвей, он делал из них поясы для животных. Когда один хромой решился отправиться к нему для исцеления, то едва только сел он на осла и ноги его едва только коснулись пояса, сделанного святым мужем, он тотчас исцелился.
        cn: 他向长老讨要了几根棕榈枝，并用它们为牲畜制作腰带。当一位瘸子决定去找他求医治时，他刚一坐上驴子，双脚刚一碰到圣者所制的腰带，他立刻就得了医治。
    - type: paragraph
      text:
        ru: Иногда авва посылал больным благословение, и они тотчас освобождались от болезни. Однажды он получил откровение о своих монастырях, что некоторые из братий ведут недобрую жизнь. Тогда написал он чрез пресвитера ко всем им послание, в котором было сказано, что такие-то из них не радят, а другие ревнуют о добродетели. Открылось, что это было так. Написал он и к отцам, что некоторые из них не радят о спасении братий, а другие довольно наставляют их, притом объявил, каких наказаний и почестей достойны те и другие. Еще, призывая иных к высшему совершенству, он внушал им, чтобы, удаляясь от чувственного, они восходили к духовному, так как уже время вести такую жизнь. «Мы, – говорил он, – не должны навсегда оставаться детьми и младенцами, но должны восходить к совершеннейшему разумению, достигать мужеского возраста и возвышаться до самых великих добродетелей».
        cn: 有时阿爸会差遣祝福给病人，他们便立刻从疾病中得释放。有一次，他得到一个关于他的修道院的启示，说有些修士过着不好的生活。于是他藉着一位司祭给他们所有人写了一封书信，其中说道，他们中某些人不尽心，而另一些人则热心追求美德。事实显明确实如此。他也写信给众父老，说他们中有些人不尽心于修士们的救赎，而另一些人则充分地教导他们；此外他还宣布了他们各自当得何种惩罚和尊荣。此外，在召唤另一些人迈向更高的完全时，他敦促他们，要远离属世的，升华到属灵的境界，因为已经是过这种生活的时候了。「我们，」他说道，「不应该永远停留在孩童和婴孩阶段，而应该提升到最完全的悟性，达到成年人的身量，并提升到最伟大的美德。」
    - type: paragraph
      text:
        ru: Это и еще многое рассказывал нам отец об авве Иоанне, но мы всего того по причине чрезвычайной чудесности не написали – не потому, чтобы оно не было истинно, а по причине неверия некоторых. Сами мы совершенно убеждены в истине сего, ибо нам одно и то же рассказывали многие и великие мужи, видевшие все это своими глазами.
        cn: 父亲向我们讲述了这以及许多其他关于阿爸约翰的事情，但我们由于其非凡的奇妙性，没有将所有这些记录下来——并非因为它不真实，而是因为某些人的不信。我们自己则完全确信这件事的真实性，因为许多亲眼目睹了这一切的伟大人物都向我们讲述了同样的事情。
  - type: heading2
    text:
      ru: Об авве Пафнутии
      cn: 关于帕夫努提阿爸
    children:
    - type: paragraph
      text:
        ru: Видели мы и другое место, где жил Пафнутий-отшельник, муж великий и добродетельный, который недавно скончался в окрестности Ираклеи Фиваидской. О нем многие рассказывали многое.
        cn: 我们还看到了另一个地方，那里住着隐士帕夫努提，他是一位伟大且有美德的男子，不久前在底比斯区的赫拉克莱奥波利斯附近去世了。关于他，许多人讲述了许多事情。
    - type: paragraph
      text:
        ru: 'После продолжительного подвижничества Пафнутий молил Бога открыть ему, кому бы из совершенных по святости он был подобен. Ангел явился ему и сказал: «Ты подобен такому-то флейщику[22], который живет в городе». Поспешно отправился Пафнутий к тому флейщику и расспрашивал его об образе жизни и делах. Флейщик сказал ему, что он (как и в самом деле было) человек грешный, нетрезвой и развратной жизни и что он недавно перестал разбойничать и сделался флейщиком. Когда же Пафнутий стал выпытывать у него, что доброго сделал он когда-либо, флейщик отвечал, что не знает за собой ничего доброго, кроме того, что однажды, будучи еще разбойником, ночью избавил он от разбойников одну христианскую деву, которую они хотели обесчестить, и проводил ее до селения.'
        cn: 在长期的苦修之后，帕夫努提恳求上帝向他启示，他与哪位在圣洁上达到完全的人相仿。一位天使向他显现并说：「你与某位住在城里的吹笛人[22]相似。」 帕夫努提急忙前往那位吹笛人那里，询问他的生活方式和所作所为。吹笛人告诉他，他（正如他真实情况一样）是一个罪人，过着不节制且放荡的生活，并且他最近才停止当强盗，转行做了吹笛人。当帕夫努提开始向他追问他曾做过什么好事时，吹笛人回答说，他不记得自己做过任何好事，除了有一次，他还是强盗的时候，在夜里他从一群强盗手中救出了一位他们企图凌辱的基督徒少女，并把她护送到村庄。
    - type: paragraph
      text:
        ru: «В другой раз, – продолжал флейщик, – я встретил красивую женщину, блуждавшую по пустыне. Она бежала от служителей градоначальника и от судей из-за того, что муж ее был должен казне, и оплакивала свое странствование. Я спросил ее о причине ее слез. “Не спрашивай меня ни о чем, господин, – сказала она, – и не любопытствуй о несчастной, но возьми меня и отведи, куда хочешь, как рабу свою, ибо после того, как мужа моего много раз били в продолжение двух лет за то, что он должен казне триста златниц, и заключили в темницу, а трех моих любезнейших сыновей продали, я спасаюсь бегством, перехожу с места на место и, так как меня часто ловили и каждый раз били без пощады, брожу теперь по пустыне и вот уже третий день остаюсь без пищи”. Я сжалился над нею и привел ее в пещеру, дал ей триста златниц и проводил до города. Так я освободил ее с детьми и с мужем».
        cn: 「另一次，」吹笛者继续说道，「我遇见一位美丽的女子，在旷野中游荡。她为了丈夫欠国库的债，正躲避着市长的差役和法官，并为自己的漂泊而悲叹。我问她哭泣的原因。『先生，什么都不要问我，』她说，『也不要打听一个不幸的人，只管把我带走，带到你想去的任何地方，像对待你的奴仆一样。因为我的丈夫因为欠国库三百金币，在两年内多次被殴打，并被关进监狱，我三个最亲爱的儿子也被卖了。所以我逃亡，从一个地方到另一个地方，而且因为我经常被抓，每次都被无情地殴打，现在我在旷野里流浪，至今已经三天没有食物了。』我怜悯她，把她带到一个洞穴里，给了她三百金币，并护送她到城里。就这样，我让她和她的孩子们以及丈夫都获得了自由。」
    - type: paragraph
      text:
        ru: 'Пафнутий сказал ему: «Хотя я не знаю за собою, чтобы сделал что-нибудь подобное, но ты, без сомнения, слыхал, что я славен подвижничеством, ибо не в беспечности провел жизнь свою. И вот Бог открыл мне о тебе, что ты нисколько не ниже меня по добрым делам. Посему, когда Бог так печется о тебе, брат, ты не оставляй души своей в пренебрежении, на волю случая».'
        cn: 帕夫努提对他说：「虽然我不知道自己曾做过任何类似的事，但你无疑听过，我因苦修而闻名，因为我并非在懈怠中度过一生。看哪，上帝向我启示了你，你在善行方面丝毫不逊于我。因此，既然上帝如此眷顾你，兄弟，你就不该将自己的灵魂置于疏忽之中，任由偶然摆布。」
    - type: paragraph
      text:
        ru: Флейщик тотчас же бросил из рук флейты и, променяв благозвучие музыкальной песни на духовное сладкопение, последовал за сим мужем в пустыню. В продолжение трех годов подвизался он, сколько мог, проводя жизнь свою в пении псалмов и в молитвах; наконец прешел на небо и почил, сопричисленный к ликам святых и чинам праведных.
        cn: 吹笛人立刻放下手中的笛子，以音乐歌曲的悦耳之声交换属灵的甜美歌咏，跟随那人进入旷野。在三年期间，他尽其所能地苦修，将他的生命用于吟唱圣咏和祷告；最终升入天堂，安息了，被列入圣者的行列和义人的品级之中。
    - type: paragraph
      text:
        ru: 'Проводивши к Богу сего усердного подвижника добродетели, Пафнутий стал вести жизнь более совершенную в сравнении с прежнею и опять молил Бога открыть ему, кому из святых он подобен. Опять был к нему глас Божий: «Ты подобен старшине ближайшего селения». Пафнутий немедленно отправился к нему. Когда он постучался к нему в дверь, тот, по обычаю, вышел и принял гостя. Омыв ему ноги и предложив трапезу, он просил его вкусить пищи. Но Пафнутий стал у него расспрашивать о его делах и говорил: «Расскажи мне свой образ жизни, ибо ты превзошел многих монахов, как открыл мне Бог». Тот отвечал ему, что он человек грешный и недостойный даже имени монахов. Однако Пафнутий стал настоятельно расспрашивать его, и он отвечал так: «Я не имел нужды рассказывать о своих делах, но поскольку ты говоришь, что пришел по повелению Божию, то расскажу тебе о себе.'
        cn: 在将这位勤勉的德行修道士引导到神面前之后，帕夫努提亚开始过上比以往更完美的生活，并再次祈求上帝向他启示，他与哪位圣徒相似。又有上帝的声音临到他，说：「你与最近村庄的村长相似。」帕夫努提亚立刻前往他那里。当他敲开那人的门时，那人便按惯例出来接待客人。那人洗净帕夫努提亚的双脚，摆上餐食，并请他用餐。但帕夫努提亚开始询问他的事情，并说：「请告诉我你的生活方式，因为你已超越了许多修士，正如上帝向我启示的。」那人回答他说，他是个罪人，甚至不配拥有修士之名。然而帕夫努提亚仍旧坚持不懈地询问他，那人便这样回答：「我本没有必要讲述我的事情，但既然你说你是奉上帝的命令而来，那我就告诉你我的情况。」
    - type: paragraph
      text:
        ru: Вот уже тридцатый год, как я разлучился со своею женою, прожив с нею только три года и прижив от нее трех сыновей, которые служат мне по моим делам. Я до сих пор не оставлял страннолюбия. Никто из поселян не похвалится, чтобы он принял странника прежде меня. Бедный или странник не выходил из моего дома с пустыми руками, не получив прежде нужного для пути. Не пропускал я бедного, удрученного несчастиями без того, чтобы не подать ему достаточного утешения. Не был я лицеприятен к своему сыну на суде. Чужие плоды не входили в дом мой. Не было вражды, которой бы я не примирял. Никто не обвинял моих сыновей в неприличных поступках. Стада мои не дотрагивались до чужих плодов. Не засевал я первый своих полей, но, предоставляя их всем, сам пользовался только тем, что оставалось. Не допускал я, чтобы богатый притеснял бедного. Во всю жизнь мою никого не огорчал, никого никогда не осуждал. Вот что, как помню, сделал я по воле Божией».
        cn: 至今已是第三十年，我与妻子分离，与她共同生活了仅仅三年，并从她那里得了三个儿子，他们现在我的事务上服侍我。我至今未曾停止款待客旅。没有一个乡民能夸耀他在我之前接待了客旅。穷人或客旅从我的家中出来时，从未空手，总会先得到旅途所需之物。我从未忽略被不幸所困扰的穷人，总会给予他们足够的安慰。在审判中，我从未偏袒我的儿子。别人的收成从未进入我的家。没有我不曾调解的仇恨。没有人指责我的儿子们有不端行为。我的牲畜群未曾触碰别人的收成。我从未第一个播种自己的田地，而是将它们留给众人，我自己只享用所剩下的。我从未允许富人欺压穷人。在我一生中，从未使任何人忧伤，也从未论断过任何人。这些就是，据我所记得的，我按着上帝的旨意所行的。
    - type: paragraph
      text:
        ru: 'Услышав о добродетелях сего мужа, Пафнутий облобызал его голову и сказал: «Да«благословит тя Господь от Сиона, и узриши благая Иерусалима»(Пс. 127, 5). Тебе недостает еще главной из добродетелей – многомудрого познания о Боге, которое не можешь ты приобрести, если не отвергнешься мира, не возьмешь креста и не последуешь за Спасителем». Услышав сие, тот немедленно, не сделав даже никаких распоряжений касательно своего имущества, последовал за этим мужем в гору. Когда же они пришли к реке и не нашли тут никакой лодки, Пафнутий велел ему идти через реку, которой никто никогда в этом месте не переходил по причине глубины ее. Они перешли так, что вода была им только по пояс. Тогда Пафнутий оставил его в одном месте, а сам, разлучившись с ним, молил Бога, чтобы ему быть лучше подобных людей. Немного времени спустя Пафнутий видел, что душу сего мужа взяли Ангелы, славя Бога и говоря:«Блажен,егожеизбрал еси и приял, вселится во дворех Твоих»(Пс. 64, 5). Святые же ответствовали им и восклицали:«Мир мног любящим закон Твой»(Пс. 118, 165). Тогда узнал Пафнутий, что муж сей скончался.'
        cn: 听到这人德行的事，帕夫努提亲吻了他的头，并说：「『愿上主从锡安赐福于你，愿你得见耶路撒冷的美善。』（诗篇 128:5）你还缺少最主要的德行——即对上帝多智的认识，这认识你无法获得，如果你不弃绝世界、不背负十字架，也不跟随救主。」听到这话，他立刻，甚至没有为自己的财物做任何安排，就跟随这人进了山。当他们来到一条河边，却没有找到任何船只，帕夫努提便吩咐他过河，这条河因其水深，从来没有人在此处渡过。他们渡过了河，水只及他们的腰部。于是帕夫努提把他留在一个地方，自己则与他分开，向上主祈求，愿他能胜过这类人。不久之后，帕夫努提看见有天使将这人的灵魂带走，赞美着上帝并说道：「『你所拣选、所接纳的，是有福的，他要住在你的庭院中。』（诗篇 65:4）」众圣者则回应他们并高呼：「『爱慕你律法的人，大有平安。』（诗篇 119:165）」于是帕夫努提便得知这人已经去世了。
    - type: paragraph
      text:
        ru: 'Продолжая неусыпно молиться Богу и еще более подвизаясь в посте, Пафнутий опять молил Бога открыть ему, кому он подобен. И опять сказал глас Божий: «Ты подобен купцу, ищущему хороших жемчужин. Встань же и не медли: с тобою встретится муж, которому ты подобен». Он пошел и увидел одного купца александрийского. Сей был муж благочестивый и христолюбивый, торговал на двадцать тысяч златниц, имея сто кораблей, и теперь возвращался из Верхней Фиваиды. Он все свое имущество и все прибытки от торговли раздавал бедным и монахам, и в этот раз, с сыновьями своими, нес Пафнутию десять мешков овощей. «Что это, любезный?» – сказал ему Пафнутий. Тот отвечал ему: «Это плоды торговли, приносимые Богу для подкрепления праведных». «Что же, – сказал ему Пафнутий, – и ты не примешь нашего имени?». Когда тот признался, что очень желает сего, Пафнутий сказал ему: «Доколе ты будешь заниматься земною торговлею и не примешься за небесную куплю? Предоставь это другим, а сам, пока время так благоприятно, последуй за Спасителем, к Которому немного после и придешь ты». Купец, нисколько не отлагая, приказал своим сыновьям разделить между бедными все, что у него оставалось, а сам отправился в гору, заключился в том месте, где до него подвизались двое, и постоянно молился Богу. Прошло немного времени, и он, оставив тело, соделался небожителем.'
        cn: 帕夫努提持续不懈地向神祷告，并且在禁食中更加刻苦操练，再次恳求神向他启示，他像谁。神的声音再次响起：「你就像一个寻找上好珍珠的商人。起来，不要迟延：有一个人会遇见你，那人与你相似。」他就去了，看见一个亚历山大港的商人。这人是个虔诚且爱基督的人，他用两万金币做生意，拥有一百艘船，此时正从上埃及底比斯返回。他把他所有的财产和所有的贸易利润都分发给了穷人和修士，而这一次，他带着自己的儿子们，给帕夫努提带来了十袋蔬菜。「亲爱的，这是什么？」帕夫努提对他说。那人回答他说：「这是我贸易的成果，献给神，为要供养义人。」「那么，」帕夫努提对他说，「你难道不接受我们的名号吗？」当那人承认他非常渴望时，帕夫努提对他说：「你要从事地上的贸易到几时，而不去从事天上的买卖呢？把这事交给别人吧，而你，趁着时机如此有利，跟随救主吧，不久你也将来到他那里。」那商人毫不迟延，命令他的儿子们将他剩余的一切分给穷人，而他自己则上山去了，隐居在之前有两位修士修行的地方，持续不断地向神祷告。没过多久，他就舍弃肉身，成了天上的居民。
    - type: paragraph
      text:
        ru: 'Пафнутий, предпослав и сего мужа на небо, наконец и сам, не имея сил продолжать подвижничество, стал отходить. Тогда явился ему Ангел и сказал: «Наконец пойди и ты, блаженный, в вечные селения. Пророки пришли принять тебя в свой сонм. Это прежде не было тебе открыто, чтобы ты, возгордившись, не лишился своих заслуг». Прожив еще один день и рассказав все пресвитерам, пришедшим к нему по откровению, он предал дух. Пресвитеры ясно видели, как он принят был ликами праведных и Ангелов, восхвалявших Бога.'
        cn: 帕夫努提在将这人送上天堂之后，自己也终于因无力继续苦修而开始离世。那时，一位天使向他显现并说：「蒙福者啊，你终于也要进入永恒的居所了。众先知已前来，要将你接到他们自己的行列中。这事先前没有向你启示，免得你心生骄傲，从而丧失了你的功绩。」他又活了一天，并将一切都告诉了因启示而前来见他的长老们，之后他便交托了灵魂。长老们清楚地看见，他被赞美上帝的义人行列和天使们所接纳。
  - type: heading2
    text:
      ru: О мучениках Аполлонии и Филимоне
      cn: 论殉道者阿波罗尼奥斯和腓利门
    children:
    - type: paragraph
      text:
        ru: Был в Фиваиде монах по имени Аполлоний. Он показал много чудесных опытов своей святости и удостоен был диаконства. Успев во всех добродетелях мужей, какие прославились во время гонения, он ободрял исповедников Христовых и сделал многих мучениками, а наконец и сам был взят и содержался в тюрьме. Туда приходили к нему самые негодные язычники и говорили ему оскорбительные и богохульные речи.
        cn: 在提拜德有一位名叫阿波罗尼奥斯的修士。他展现了许多圣洁的奇妙印证，并蒙准执事职分。他在所有那些在迫害时期闻名的圣者们所具备的美德上都卓有成就，他鼓励基督的认信者，并使许多人成为殉道者，而最后他自己也被抓捕并关押在监狱里。最卑劣的异教徒来到他那里，并对他说了侮辱性和亵渎上帝的言语。
    - type: paragraph
      text:
        ru: 'Между ними был один музыкант, человек известный по своим злодеяниям. Он пришел и стал поносить Аполлония, называя нечестивцем, наветником, обманщиком; говорил, что все его ненавидят и что надо бы ему поскорее умереть. Аполлоний сказал ему: «Да помилует тебя Господь и да не поставит тебе в грех того, что ты сказал». Услышав сие, музыкант (которого звали Филимоном), поражен был до глубины души словами Аполлония. Тотчас он отправился в судилище, предстал пред судиею и сказал ему при народе: «Несправедливо поступаешь ты, судия, наказывая благочестивых и невинных мужей. Христиане ничего худого не делают и не говорят – они даже благословляют врагов своих». Слушая его, судия сначала подумал, что он притворяется и шутит, но, видя, что он не перестает то же говорить, сказал ему: «Ты, верно, лишился ума». «Несправедливый судия! – отвечал тот. – Я не безумный, я – христианин». Тогда судия вместе с народом старался склонить его на свою сторону различными ласками, но, видя его непреклонным, подверг всякого рода мучениям.'
        cn: 他们中间有一位乐师，一个以其恶行而闻名的人。他前来开始辱骂阿波罗尼亚，称他为不敬虔者、诽谤者、欺骗者；他说所有人都恨他，并且他应该尽快死去。阿波罗尼亚对他说：「愿主怜悯你，并且不将你所说的话归咎于你的罪。」听到这话，那乐师（名叫菲利蒙）的灵魂深处被阿波罗尼亚的话深深打动了。他立刻前往法庭，站在法官面前，并且在众人面前对他说：「法官啊，你行事不公，惩罚虔敬和无辜的人。基督徒不作恶，也不说恶言——他们甚至祝福他们的仇敌。」听着他的话，法官起初以为他在假装和开玩笑，但看到他不停地重复同样的话，便对他说：「你肯定疯了。」「不公的法官！」那人回答道，「我没有疯，我是一个基督徒。」于是法官和众人试图用各种甜言蜜语来劝服他，但看到他毫不动摇，便对他施以各种折磨。
    - type: paragraph
      text:
        ru: 'Судия, велевший схватить и всячески поносивший Аполлония, мучил его, как обманщика. Но Аполлоний сказал ему: «Я желал бы, чтобы ты, судия, и все присутствующие здесь последовали мне в моем заблуждении». Как скоро он сказал это, судия велел его и Филимона бросить в огонь в глазах всего народа. Когда оба они были в огне и судия еще оставался на месте, блаженный Аполлоний воззвал к Богу в слух всего народа и судии: ««Не предаждь, Господи, зверем души, исповедующияся Тебе»(Пс. 73, 19), но явно покажи нам Себя». И вот сошло облако, подобное росе, и светлое, покрыло сих мужей и угасило огонь. Удивленные судия и народ воскликнули: «Один Бог, христианский!». Но какой-то злонамеренный человек уведомил об этом градоначальника александрийского. Этот, выбрав грубых и жестоких чиновников и стражей, послал их привести связанными судию и Филимона. С ними повели и Аполлония и некоторых других исповедников. Во время пути снизошла на Аполлония благодать, и он начал учить воинов. Когда и эти, умилившись, уверовали в Спасителя, то все они вместе явились в судилище узниками. Градоначальник, посмотрев на них и видя их непоколебимость в вере, велел бросить всех их в глубину морскую. Это было для них символом крещения. Родственники, нашедши их тела, выброшенные на берег, устроили для всех них одну гробницу, где от них много совершается чудес. Такова была благодать в Аполлонии, что, о чем бы он ни помолился, скоро бывал услышан – так почтил его Спаситель! И мы видели его и других мучившихся с ним и молились во время их мучения, а после, поклонившись Богу, облобызали и тела их в Фиваиде.'
        cn: '审判官下令逮捕阿波罗尼，并竭力诽谤他，视他为骗子而拷打他。但阿波罗尼对他说：「我希望你，审判官，以及所有在场的人，都能跟随我，进入我的『谬误』。」他刚说完这话，审判官便下令将他和菲利蒙在众人面前投入火中。当他们两人身处火焰之中时，审判官仍留在原处，蒙福的阿波罗尼在众人和审判官的耳边向上帝呼求：「『上主啊，不要将那承认你的灵魂交给野兽』（诗篇 73:19），却要清楚地向我们显现你自己。」于是，一片如同露水般明亮的云彩降下，遮盖了这些男子，并熄灭了火焰。惊奇的审判官和民众大声喊道：「只有一位上帝，是基督徒的上帝！」。


          但某个心怀恶意的人将此事告知了亚历山大城的总督。这位总督选派了粗暴残忍的官员和卫兵，派遣他们将审判官和菲利蒙捆绑带来。与他们一起被带走的还有阿波罗尼以及其他几位宣信者。在路上，恩典降临到阿波罗尼身上，他便开始教导士兵们。当这些士兵也心被感动，相信了救主时，他们所有人都一同以囚犯的身份出现在审判庭上。总督看向他们，并且看到他们信仰的坚定不移，便下令将他们所有人都投入海的深处。这对他们来说是洗礼的象征。亲属们找到了他们被冲上岸的遗体，为他们所有人建造了一座墓，在那里藉着他们行了许多神迹。


          阿波罗尼身上的恩典是如此，以至于他无论祈求什么，都很快蒙垂听——救主就是这样尊荣了他！我们曾见过他以及其他与他一同受苦的人，并在他们受苦时为他们祈祷；之后，我们敬拜了上帝，也在提拜德亲吻了他们的遗体。'
  - type: heading2
    text:
      ru: Об авве Диоскоре пресвитере
      cn: 关于阿爸迪奥斯科尔长老
    children:
    - type: paragraph
      text:
        ru: 'Видели мы и другого пресвитера в Фиваиде, по имени Диоскор, отца ста монахов. Когда они располагались приступить к Божественным Таинам, он говорил им: «Смотрите, чтобы никто из вас, имевших ночью нечистые сновидения, не дерзал приступить к Святым Таинам и чтобы никто не засыпал с нечистыми мечтами. Что бывает без мечтаний, то бывает не по произволу каждого, а зависит от природы, от избытка вещества, и потому не вменяется в грех. А мечты зависят от произвола и свидетельствуют о нечистоте души. Итак, монаху должно побеждать и закон природы и не предаваться никакой плотской нечистоте, но надобно измождать плоть и не допускать, чтоб она тучнела. Старайтесь истощить тело продолжительными постами, иначе оно будет возбуждать нас к нечистым пожеланиям, а монаху никак не должно допускать себя до них, ибо чем же он будет отличаться от мирян? Мы часто видим, что и миряне воздерживаются от удовольствий для здоровья тела или по другим каким причинам – не должно ли тем более монаху заботиться о душе и о здравии ума и духа?»'
        cn: 我们也见到提拜德的另一位长老，名叫迪奥斯科尔，他是一百位修士的父亲。当他们准备领受神圣圣礼时，他对他们说：「你们要当心，你们当中夜间有不洁之梦的人，都不可胆敢领受圣奥秘；也没有人带着不洁的幻想入睡。没有幻想发生的事情，并非出于各人自己的意愿，而是取决于本性，取决于物质的盈余，因此不被算作罪。而幻想则取决于意愿，并证明灵魂的不洁。因此，修士应该战胜天性法则，不屈服于任何肉体的不洁，反而要使肉体消瘦，并且不允许它肥胖。你们要努力通过长时间的禁食来消耗身体，否则它就会激发我们产生不洁的欲望，而修士绝不应该让自己陷入这些欲望中，因为他还有什么能与平信徒区分开来呢？我们常常见到，就连平信徒也会为了身体的健康，或出于其他一些原因而禁戒享乐——难道修士不更应该关照灵魂以及心智和灵性的健康吗？」
  - type: heading2
    text:
      ru: О нитрийских монахах[23]
      cn: 关于尼特里亚的修士们[23]
    children:
    - type: paragraph
      text:
        ru: Пришли мы и в Нитрию, где видели многих и великих отшельников. Из них одни – туземцы, другие – пришельцы; одни других превосходят в добродетелях и, с ревностию упражняясь в подвижничестве и показывая всякую добродетель, друг друга превышают в образе жизни. Одни из них занимались созерцанием, другие вели деятельную жизнь. Некоторые из них, видя, что мы издалека шли через пустыню, вышли навстречу нам с водою, другие мыли нам ноги, третьи чистили наше платье, иные приглашали нас к трапезе, иные внушали учиться добродетелям, другие – заниматься созерцанием и познанием Бога. Чем кто мог, тем и старался нам услужить. И как пересказать все их добродетели, когда нельзя и говорить о них достойным образом? Они живут в пустыне, и келии их одни от других в таком расстоянии, что издали не могут они ни узнать, ни скоро увидеть друг друга, ни расслышать, что говорит другой; все они живут особо – в затворе. Только в субботу и воскресенье они собираются в церквах и принимают друг друга. Многие из них часто по четыре дня не выходят из келии, так что видят друг друга только в церковных собраниях. Некоторые из них приходят в сии собрания за три или за четыре верcты[24]– так далеко живут они друг от друга! У них такая любовь друг к другу и к прочей братии, что, если кто изъявляет желание спасаться вместе с ними, каждый из них спешит отдать ему свою келию для упокоения.
        cn: '我们也来到了尼特里亚，在那里我们见到了许多伟大的隐修士。他们当中，有些是本地人，有些是外来者；他们都在美德上彼此超越，并且热心地操练苦修，显扬各种美德，在生活方式上互相超越。他们中有些人专注于默观，另一些人则过着积极的生活。他们中有些人，看到我们从遥远的荒漠中走来，便带着水出来迎接我们；另一些人给我们洗脚；还有一些人替我们清理衣服；有的邀请我们用餐；有的劝导我们学习美德；另一些人则劝导我们专注于默观和认识上帝。凡他们所能做的，都尽力为我们效劳。又怎能尽述他们所有的美德呢？甚至无法以配得的方式来谈论它们。


          他们生活在荒漠中，他们的隐修室彼此相距甚远，以至于他们无法从远处辨认出对方，也不能迅速看到彼此，更听不清对方在说什么；他们都独自生活——在隐闭中。只有在安息日和主日，他们才聚集在教堂里，并且彼此接待。他们中许多人常常四天不离开隐修室，以至于只在教会聚会时才能见到彼此。他们中有些人需要走三到四俄里[24]才能来参加这些聚会——他们彼此相距竟是如此遥远！他们彼此之间，以及对其他弟兄，怀有如此深厚的爱，以至于，如果有人表达了与他们一同得救的愿望，他们每个人都急忙把自己的隐修室让给他安歇。'
  - type: heading2
    text:
      ru: Об авве Аммонии
      cn: 论阿爸阿摩尼
    children:
    - type: paragraph
      text:
        ru: Видели мы там одного отца, по имени Аммоний. У него были прекрасные келии, двор, колодезь и прочие необходимые принадлежности. Когда приходил к нему какой-либо брат, желавший спасаться, и говорил ему, чтобы он нашел ему келию для жительства, Аммоний тотчас выходил, приказав ему дотоле не выходить из своей келии, пока он не найдет для него удобного жилища, и, оставив ему свою келию со всем, что в ней было, сам уходил далеко и заключался в какой-нибудь малой келии. Если же приходило много желавших спасаться, он собирал всю братию. Тогда один приносил камни, другой – воду, и келии выстраивались в один день. Тех, которые должны были жить в сих келиях, братия приглашали к общественной трапезе для утешения, и, пока они еще были утешаемы, каждый из братий, взявши из своей келии милоть или корзину хлебов и других нужных вещей, относил их в новые келии – так, чтобы никому не было известно приношение каждого. К вечеру приходя, будущие обитатели келий, вдруг находили в них все нужное. Многие из сих братий не вкушали ни хлеба, ни плодов, а только зелие. Некоторые не спали всю ночь, но сидя или стоя проводили время в молитве до самого утра.
        cn: 我们见到那里有一位长老，名叫安莫尼。他拥有优美的修行小室、庭院、水井，以及其他必需的物件。当有任何一位寻求救赎的弟兄来到他那里，请他为自己寻找一间修行小室作为居所时，安莫尼便立刻出去，吩咐那弟兄在此之前不要离开自己的修行小室，直到他为他找到一处合适的居所。安莫尼会将自己的修行小室连同其中所有的一切都留给那弟兄，而自己则远行，隐居到一个简陋的修行小室里。如果有许多渴望得救的人前来，他便召集所有的弟兄们。于是，有的弟兄带来石头，另一些带来水，那些修行小室便在一天之内建成。那些将要住在这些修行小室里的人，弟兄们便邀请他们一同享用公共膳食，以示安慰。当他们还在受安慰的时候，每一位弟兄都会从自己的修行小室里拿出毛皮衣或一篮子面包以及其他必需品，将它们搬到新的修行小室里——这样，没有人知道每个人所作的奉献。到了晚上，那些未来的修行小室居住者，突然发现修行小室里已备好了一切所需。这些弟兄中有许多人，不吃面包，也不吃果实，而只吃青菜。有些人则整夜不眠，而是或坐或站地，将时间用于祷告，直到天明。
  - type: heading2
    text:
      ru: Об авве Исидоре
      cn: 关于亚巴·伊西多尔
    children:
    - type: paragraph
      text:
        ru: Видели мы в Фиваиде и монастырь некоего Исидора, огражденный большою каменною стеною и имевший в себе тысячу монахов. В нем были и колодцы, и сады, и все, что только нужно, ибо никто из монахов никогда оттуда не выходит. Привратником у них был пресвитер, который никого не выпускал и не впускал, разве только кто объявит желание безвыходно жить там до своей смерти. Тех, которые приходили к воротам, он принимал и угощал в небольшой гостинице, а поутру, преподав благословение, отпускал в мире. Два только пресвитера, которые заведовали делами братий, выходили и приносили им все нужное. Стоявший при воротах пресвитер говорил нам, что живущие в монастыре так святы, что все могут совершать знамения и что никто из них не бывал болен до смерти. Когда же приходило время преставления которого-нибудь из них, он, предварительно возвестив об этом всем, ложился и умирал.
        cn: 我们在底比斯还见到某个伊西多尔的修道院，它被一道巨大的石墙环绕，里面住着一千名修士。院内有井、花园，以及所有必需品，因为没有一个修士曾从那里出去过。他们的看门人是一位长老，他不让任何人出入，除非有人声明愿望，要终其一生都留在那里，直到死亡。那些来到门前的人，他会在一间小客栈里接待并款待他们，而到了早上，他会给予祝福，然后让他们平安地离开。只有两位负责修士们事务的长老，会出外为他们带回一切所需之物。站在门前的长老告诉我们，住在修道院里的修士们是如此的圣洁，以至于他们都能行神迹，并且他们中没有人会在临终前生病。当他们中任何一个人的离世时刻到来时，他会预先向众人宣告此事，然后躺下，便去世了。
  - type: heading2
    text:
      ru: Об Аммоне[25]
      cn: 关于亚扪[25]
    children:
    - type: paragraph
      text:
        ru: Есть и другая пустыня в Египте, на берегу моря, но пристать к ней весьма трудно. В ней живут многие и великие отшельники. Она лежит недалеко от города Диолка. Там видели мы пресвитера, святого отца, весьма смиренного и многократно видевшего видения, по имени Аммон. Однажды, во время службы Божией, он видел Ангела, который, стоя по правую сторону жертвенника, отмечал братий, приступавших к Евхаристии, записывал их имена в книгу и изглаждал имена тех, которые не пришли в церковь. Сии чрез три дня умерли. Его часто мучили демоны и доводили до такой слабости, что он не мог стоять пред жертвенником и приносить дары. Но являвшийся Ангел, взяв его за руку, тотчас возвращал ему силы и становил его здоровым пред жертвенником. Братия, видя его страдания, изумлялись.
        cn: 埃及还有另一片靠海的旷野，但靠岸非常困难。许多伟大的隐修士在那里居住。它位于离迪奥尔卡城不远的地方。我们在那里见到了一位名叫阿蒙的司祭，他是一位圣父，非常谦卑，并多次蒙受异象。有一次，在神圣礼仪期间，他看见一位天使站在祭坛的右边，标记那些前来领受圣体圣血的修士们，将他们的名字记入书册，并抹去那些没有来到教会的人的名字。这些人三天后便去世了。邪魔经常折磨他，并使他虚弱到无法站在祭坛前献上圣礼。但显现的天使握住他的手，立刻恢复了他的力量，使他健康地站在祭坛前。众修士们看到他的痛苦，都感到惊奇。
  - type: heading2
    text:
      ru: Об авве Иоанне
      cn: 关于阿爸约翰
    children:
    - type: paragraph
      text:
        ru: Видели мы в Диолке и другого авву, Иоанна, настоятеля монастырей. Он имел вид Авраама, а браду Аарона, совершал чудеса и исцеления и возвратил здоровье многим расслабленным и страдавшим подагрою.
        cn: 我们在迪奥尔科斯还看到了另一位阿巴，约安，众修道院的院长。他有亚伯拉罕的样貌，亚伦的胡须，行了神迹和医治，使许多瘫痪者和患痛风者恢复了健康。
  - type: heading2
    text:
      ru: Об авве Питирионе
      cn: 关于阿爸皮蒂里翁
    children:
    - type: paragraph
      text:
        ru: Видели мы в Фиваиде высокую гору, лежащую при реке, весьма страшную и утесистую. Там в пещерах жили монахи. У них был настоятелем некто по имени Питирион, один из учеников Антония, третий из бывших на этом месте. Он успешно изгонял бесов, часто совершал и другие знамения, ибо, наследовав место Антония и ученика его Аммона, достойно наследовал от них и дары благодатные. Он много беседовал с нами и с особенною силою рассуждал о различении духов, говоря, что некоторые бесы наблюдают за нашими страстями и часто обращают оные ко злу. «Итак, чада, – говорил он нам, – кто хочет изгонять бесов, тот должен сперва поработить страсти, ибо, какую страсть кто победит, такого и беса изгонит. Мало-помалу должно вам поработить страсти, чтобы изгнать демонов этих страстей. Например, бес действует посредством чревоугодия. Если вы преодолеете чревоугодие, то изгоните и демона его». Этот муж ел два раза в неделю, в воскресенье и четверток, мучную похлебку и, привыкши к ней, не мог принимать никакой другой пищи.
        cn: 我们看到在底拜有一座高山，位于河边，极其险峻且多岩石。修士们住在山上的洞穴里。他们有一位名叫皮提里翁的修道院院长，他是安东尼的门徒之一，也是这个地方的第三任。他成功地驱逐了邪魔，也常常行其他神迹；因为他继承了安东尼及其门徒阿蒙的地位，也配得地继承了他们的恩赐。他与我们交谈甚多，并特别有力地论述了辨别诸灵，他说某些邪魔监视着我们的情欲，并常常把它们引向邪恶。「所以，孩子们，」他对我们说，「凡想驱逐邪魔的，就必须首先制伏情欲；因为，人制伏了哪种情欲，就能驱逐那种邪魔。你们应当逐渐地制伏情欲，以驱逐这些情欲的邪魔。例如，邪魔借着贪食而作祟。如果你们克服了贪食，你们就能驱逐那与贪食相关的邪魔了。」这位修士每周吃两次，在星期日和星期四，食用面糊，并且习惯了它，就不能再接受任何其他食物了。
  - type: heading2
    text:
      ru: Об авве Евлогии пресвитере
      cn: 关于阿爸欧罗基奥斯司祭
    children:
    - type: paragraph
      text:
        ru: 'Видели мы и другого пресвитера, по имени Евлогий, который во время принесения Богу даров получал такую благодать ведения, что узнавал мысли каждого из приходивших монахов. Часто, бывало, заметив, что какие-нибудь монахи хотят подойти к жертвеннику, он удерживал их и говорил: «Как вы осмеливаетесь приступать к Святым Таинам с худыми мыслями? Вот, в эту ночь имел ты нечистую, блудную мысль». Иной, говорил он, размышлял в уме своем, что нет никакого различия в том, грешником или праведником приступит кто к Святым Дарам. Другой имел сомнение касательно самых Даров и думал: «Освятят ли они меня, когда я приступлю к ним?». «Итак, удалитесь на некоторое время от Святых Таинств и покайтесь от души, чтобы получить отпущение грехов и сделаться достойными общения со Христом. Если же не очистите сперва мыслей, то не можете приступить к благодати Христовой».'
        cn: 我们还见到另一位名叫欧洛吉欧斯的司祭，他在奉献圣礼之时，领受了如此洞悉的恩典，以至于他能知晓前来修士们每个人的思想。常常，当他注意到有些修士想要走向祭台时，他便拦住他们，说道：「你们怎敢怀着邪恶的思想领受圣奥秘？瞧，就在昨夜，你曾有过不洁的淫荡之念。」 他说，另一个人心里曾这样思忖，罪人或义人领受圣礼并无任何区别。另一个人则对这圣礼本身心存疑虑，心想：「当我领受它们时，它们能圣化我吗？」 「所以，你们暂时远离圣奥秘，并真心悔改，以便获得罪的赦免，并变得配得上与基督相通。若不先洁净你们的思想，就不能领受基督的恩典。」
  - type: heading2
    text:
      ru: Об авве Серапионе пресвитере
      cn: 关于阿爸塞拉皮翁司祭
    children:
    - type: paragraph
      text:
        ru: 'Видели мы в пределах арсинойских пресвитера по имени Серапион, настоятеля многих монастырей и игумена многого братства, числом до десяти тысяч. Он чрез братию собирал множество хозяйственных припасов, ибо во время жатвы все они сносили к нему свои плоды, которые получали вместо платы за уборку полей, – каждый ежегодно по двенадцати артаб[26]хлеба, что равняется сорока нашим мерам. И все это употреблял авва на вспомоществование бедным, так что никто не терпел нужды в окрестности. Хлеб отсылаем был бедным даже в Александрию. Впрочем, и вышеупомянутые отцы, жившие по всему Египту, не пренебрегают такою же распорядительностию: от трудов братии они посылают бедным в Александрию корабли, наполненные хлебом и одеждою, потому что у них редко кто терпит нужду.'
        cn: 我们曾在阿西诺厄的境内见到一位名叫塞拉皮翁的长老，他是许多修道院的院长，也是一个拥有多达一万人的弟兄会的主持修士。他通过弟兄们收集了大量的日常用品和农产品，因为在收割时节，弟兄们都会将他们作为清理田地报酬所得的收成——每人每年十二阿塔布[26]的谷物，这相当于我们四十份的量——运给他。这位阿巴将所有这些都用于救济穷人，以至于在附近区域没有人忍受贫困。谷物甚至被送到亚历山大港给穷人。此外，居住在埃及全境的上述那些教父们，也同样不忽视这样的管理工作：他们通过弟兄们的劳作，将装满谷物和衣物的船只送到亚历山大港给穷人，因为在他们那里，很少有人忍受贫困。
  - type: heading2
    text:
      ru: О Посидонии
      cn: 论波西多尼
    children:
    - type: paragraph
      text:
        ru: 'Дела Посидония Фивянина, мужа весьма опытного в жизни и терпеливого, так многочисленны, что нельзя и пересказать. Он был так кроток, такой строгий подвижник и столько имел незлобия, что не знаю, встречал ли я такого когда-нибудь. В Вифлееме, когда он имел пребывание свое по ту сторону Пимения, я жил вместе с ним один год и видел многие его добродетели. В один день он мне рассказывал из своей жизни следующее: «Живши один год в месте, называемом Порфирит, я во весь этот год не встречал ни одного человека, не слыхал человеческого голоса и не вкушал хлеба, а питался или небольшими финиками, или дикими травами, если где-нибудь находил их. Однажды, когда у меня не стало пищи, вышел я из пещеры с намерением идти в места населенные. Прошедши целый день, я едва отошел от пещеры на две мили и когда оглянулся кругом, то увидел всадника в воинской одежде с шлемом в виде венца на голове. Предполагая, что это воин, я возвратился опять к пещере и, вошедши в нее, нашел корзину с виноградом и недавно сорванными фигами. Я с радостию взял их и прожил в пещере два месяца, питаясь сею приятною пищею».'
        cn: 波西多尼乌斯，那位提班人，他一生经验丰富且富有耐心，其行迹如此之多，以至于无法尽述。他如此谦和，如此严谨的修士，并且他毫无怨恨，以至于我不知是否曾遇见过这样的人。在伯利恒，当他住在彼梅尼亚河那边的时候，我与他同住了一年，并且看到了他许多的美德。有一天他向我讲述了他生命中的以下事情：「在一个名叫波菲里特的地方住了一年，我在那一年里没有遇见任何人，没有听见人的声音，也没有吃面包，而是靠小小的椰枣或野草维生，如果我能在某个地方找到它们的话。有一次，当我没有食物时，我走出了洞穴，打算前往有人居住的地方。走了一整天，我才勉强走出洞穴两英里，当我环顾四周时，我看见一个身穿军服的骑兵，头上戴着一顶冠冕状的头盔。以为那是一名战士，我又回到了洞穴，进去之后，我发现了一个装有葡萄和新摘无花果的篮子。我欣喜地拿了它们，并在洞穴里住了两个月，靠着这些美味的食物维生。」
    - type: paragraph
      text:
        ru: 'А в Вифлееме досточудный Посидоний совершил вот какое чудо. Одна беременная женщина была одержима нечистым духом, и, когда ей пришло время родить, она страдала, испытывая мучение и от духа. В то время как жена бесновалась, муж ее пришел к святому Посидонию и просил его прийти к нему. Он пришел и стал на молитву. Вместе с ним пришли и мы помолиться. После второго коленопреклонения он изгнал духа и потом, вставши, сказал нам: «Помолитесь вы теперь, прошу вас; когда выйдет нечистый дух, должно быть какое-нибудь знамение, дабы мы убедились, что он в самом деле вышел». И вот бес, вдруг вышедши, обрушил всю стену дома от основания. Женщина эта не говорила шесть лет, а по изгнании беса, родила и стала говорить.'
        cn: 在伯利恒，可称颂的波西多尼行了这样一件神迹。一位怀孕的妇人被一个污秽的灵附身，并且，当她临产的时候，她饱受痛苦，也因那灵而受折磨。当这妇人正受魔鬼辖制的时候，她的丈夫来到圣波西多尼那里，并请求他去他家。他去了，并开始祈祷。与他一同，我们也来了，要一同祷告。第二次跪拜之后，他驱逐了那灵，之后，他站了起来，对我们说：「你们现在祷告吧，我请求你们；当污秽的灵出来的时候，必会有一些记号，以便我们确信它真的出去了。」果然，那鬼突然出来，使整个房屋的一面墙从根基处坍塌了。这妇人六年不能说话，但在鬼被驱逐之后，她分娩了，并开始说话。
    - type: paragraph
      text:
        ru: 'Я узнал и пророчество этого мужа, то есть славного Посидония. Жил в тех местах один пресвитер, Иероним, который был украшен великими сведениями в римской словесности и отличными талантами, но имел такую зависть, что она помрачала все достоинство его учености. Проживши с ним много дней, святой Посидоний сказал мне на ухо следующее: «Хотя благородная Павла, которая печется о нем, умрет, как я думаю, не пострадав от его зависти, однако ради этого человека ни один святой муж не будет жить в сих местах. Зависть его коснется даже собственного его брата». Так и случилось. Он выгнал оттуда и блаженного Оксиперенния, италийца, и другого, некоего египтянина, также Петра и Симеона, мужей чудных, о которых я уже говорил. Это мне рассказывал Посидоний, самый строгий подвижник добродетели, сорок лет не вкушавший хлеба и не помнивший никогда зла даже и до полдня. Такие-то подвиги и знамения совершал славный подвижник Христов Посидоний, обладавший предведением – даром превосходнейшим из всех. И среди таковых подвигов настал славный конец жизни блаженного.'
        cn: '我也得知了这位神圣之人，即那位荣耀的波西多尼乌斯的预言。在那些地方住着一位长老，希耶罗尼姆斯。他在罗马文学方面博学多闻，才华出众，为人称颂；但他心怀嫉妒，以至于他的嫉妒蒙蔽了他学识的一切价值。


          圣波西多尼乌斯与他同住了许多日子后，在我耳边如此说道：「虽然那位高贵的保拉，关心着他的人，我想，她虽会去世，却不会遭受他嫉妒的伤害；然而，为了这个人，将没有一位圣洁的修士能住在此地。他的嫉妒甚至会触及他自己的兄弟。」 事情果然如此。他将福哉的奥克西佩伦尼乌斯（一位意大利人），以及另一位某埃及人，还有彼得和西缅，这些我已提及过的奇妙修士，都从那里赶了出去。


          这些是波西多尼乌斯告诉我的，他是一位对美德极其严谨的苦行修士，四十年来不曾尝过面包，甚至从未记恨他人超过半天。这样非凡的苦行和神迹，是由那位荣耀的基督苦行修士波西多尼乌斯所行的，他拥有预知的能力——这是所有恩赐中最卓越的。在这些苦行之中，这位蒙福者的生命迎来了荣耀的结局。'
  - type: heading2
    text:
      ru: О Серапионе
      cn: 论塞拉皮翁
    children:
    - type: paragraph
      text:
        ru: 'Был некто по имени Серапион, родом египтянин, прозванный Синдонитом, потому что никогда не носил ничего, кроме синдона[27]. Он очень много упражнялся в нестяжательности, за что и назывался бесстрастным. Хорошо выучившись грамоте, он наизусть читал все Божественное Писание. По своей нестяжательности и ревности к слову Божию он не мог оставаться в келии, чтобы не увлечься земным, но с любовию проводил жизнь апостольскую и, путешествуя по населенным местам, так усовершился в подвиге нестяжательности, что приобрел совершенное бесстрастие. С таким расположением он родился (ибо у людей различны бывают расположения, а не самая природа). Отцы рассказывали, что, взяв к себе в подвижники одного из сверстников своих, он в одном городе продал себя за двадцать монет комедиантам-язычникам и, запечатавши эти монеты, хранил их при себе. До тех пор он оставался у них, не вкушая ничего, кроме хлеба и воды, и непрестанно проповедуя устами слово Божие, пока не сделал комедиантов христианами и не убедил их оставить театр. Пробыв, таким образом, у них долгое время, блаженный сперва обратил самого комедианта, потом – жену его и, наконец, все семейство их. Говорили, что, пока его не знали, он обоим им умывал ноги. Приняв же крещение, оба они отстали от театра, начали жить честно и благочестиво и, весьма почитая Серапиона, говорили ему: «Теперь, брат, мы отпустим тебя на волю, потому что ты сам освободил нас от постыдного рабства». Тогда Великий Серапион отвечал им: «Поелику Бог мой устроил, а вы содействовали, чтобы ваши души были чрез меня спасены, то я скажу вам всю тайну этого дела. Сжалившись над вашими душами, которые были в великом заблуждении, я, свободный подвижник, родом египтянин, ради вашего спасения продался вам, чтобы вы освободились от великих грехов. И теперь я радуюсь, что Бог совершил сие чрез мое смирение. Возьмите же свое золото; я оставляю вас и пойду помогать другим». Они настоятельно просили его остаться и говорили: «Мы будем всегда почитать тебя отцом и владыкою душ наших, только останься с нами». Но, не могши убедить его, сказали: «Отдай бедным это золото – оно было залогом нашего спасения». Серапион отвечал им: «Отдайте его вы, ибо оно ваше, а я не раздаю нищим чужих денег». После того они просили, чтобы он, по крайней мере чрез год, навестил их.'
        cn: '有一个人名叫塞拉皮翁，是埃及人，人称「辛多尼特」，因为他除了细麻布衣[27]之外，从不穿戴任何其他衣物。他在不贪财方面勤加操练，因此被称为「无情欲者」。他学识渊博，能背诵全部圣经。由于他的不贪财以及对上帝话语的热忱，他无法只待在修道室里而不被世俗所牵引，而是满怀爱心地过着使徒般的生活。他在有人居住的地方旅行布道，并在不贪财的修行中达到了如此完美的境地，以至于获得了完美的无情欲状态。他生来就具备这样的倾向（因为人的倾向各有不同，而非本性如此）。


          教父们讲述说，他带上了一位与他同岁的修士作伴，在一个城市里以二十枚钱币把自己卖给了异教喜剧演员，并且把这些钱币封存起来，随身携带。他一直留在他们那里，除了面包和水，什么都不吃，并用口不住地宣讲上帝的话语，直到他使那些喜剧演员成为基督徒，并劝服他们放弃戏剧表演。


          这样，在那儿待了很长时间后，这位蒙福者首先使那位喜剧演员归主，接着是他的妻子，最后是他们全家。人们说，在他们不知道他（的身份）的时候，他为他们两人洗脚。而在他们领受洗礼后，他们两人都离开了剧院，开始正直虔诚地生活，并且，他们非常敬重塞拉皮翁，对他说：「现在，弟兄，我们放你自由，因为你亲自使我们从可耻的奴役中解脱出来。」


          于是，伟大的塞拉皮翁回答他们说：「既然我的上帝安排了，而你们也配合了，让你们的灵魂藉着我得救，那么我就把这件事的全部奥秘告诉你们。怜悯你们的灵魂，因为它们曾深陷于巨大的迷误之中，我，一个自由的修士，一个埃及人，为了拯救你们而将自己卖给你们，好让你们从巨大的罪恶中解脱出来。现在我很高兴，上帝藉着我的谦卑成就了此事。请把你们的金子拿回去吧；我要离开你们去帮助其他人了。」


          他们恳切地请求他留下，并说：「我们将永远尊你为我们灵魂的父和主，只求你与我们同住。」但他们无法说服他，便说：「请把这些金子分给穷人吧——它们是我们得救的抵押。」塞拉皮翁回答他们说：「你们自己去分吧，因为那是你们的钱，我不分发穷人他人的钱财。」之后他们请求他至少在一年后拜访他们。'
    - type: paragraph
      text:
        ru: 'Сей святой раб Христов, постоянно путешествуя, прибыл однажды в Грецию, и в продолжение трех дней, которые он пробыл в Афинах, никто не подал ему хлеба, а он не имел денег. У него, бедного, не было ни милоти, ни жезла и совершенно ничего такого, кроме одного синдона, которым одет был. Наступил уже четвертый день, и он, не евши ничего в эти дни, сильно взалкал. Став на одном холме города, куда собирались чиновные особы, он начал кричать и сильно рыдать, с рукоплесканием говоря: «Афиняне, помогите!». Все носившие плащи и виры[28]подбежали к нему и спрашивали: «Что с тобой? откуда ты? чем страдаешь?». Он отвечал им: «Родом я египтянин, по образу жизни монах. Удалившись из своего отечества, я впал в руки трех заимодавцев. Из них двое оставили меня, потому что получили долг и не имели причины обвинять меня, но третий не отстает, и мне нечем удовлетворить его». Окружавшие Серапиона люди, любопытствуя о заимодавцах с намерением удовлетворить их, спрашивали его: «Где же эти люди, которые тебя беспокоят, и кто они? Покажи нам их, чтобы могли мы тебе помочь». Тогда он сказал им: «От юности моей мучили меня сребролюбие, плотское вожделение и чревоугодие. От двух я освободился – от сребролюбия и вожделения, ибо у меня нет ни золота, ни другого какого-либо имущества. Я не наслаждаюсь и удовольствиями, которые поддерживают этот недуг. Посему эти страсти уже не беспокоят меня. Но от чревоугодия я никак не могу освободиться. Вот теперь уже четвертый день остаюсь без пищи, и жестокий заимодавец – чрево непрестанно мучит меня, требуя обычного долга и не позволяя мне жить, если я не заплачу ему». Тогда некоторые из философов подумали, что весь этот рассказ намеренно придуман, однако дали ему одну златницу. Серапион снес ее в хлебную лавку и, взяв один хлеб, тотчас удалился из города и более в него не возвращался. Тут узнали философы, что этот человек ведет истинно добродетельную жизнь, и, заплатив, чего стоил хлеб, взяли назад златницу.'
        cn: '这位基督的圣仆，不断旅行，有一次抵达希腊，他在雅典停留了三天，期间没有任何人给他面包，而他身无分文。这可怜人，没有皮袍，也没有手杖，身上除了裹着的一件细麻布衣外，什么都没有。第四天已经到来，他这几天什么都没吃，饥饿难耐。他站在城中一个官员们聚集的小山上，开始呼喊并大声哭泣，边拍手边说：「雅典人啊，帮帮我！」所有身披斗篷和维拉[28]的人都跑向他，问道：「你怎么了？你从哪里来？你受什么苦？」他回答他们说：「我本是埃及人，生活方式上是修道士。离开我的祖国后，我落入了三个债主的手中。他们中有两个已经放过了我，因为他们已经收到了债务，并且没有理由指责我，但第三个却不肯罢休，我也无力偿还他。」围绕着塞拉皮翁的人们，好奇地想知道这些债主是谁，并打算替他还债，于是问他：「那些困扰你的人在哪里？他们是谁？指给我们看，以便我们能帮助你。」于是他对他们说：「从我的青年时代起，就折磨着我的是贪财、肉欲的渴求和暴食。我已经摆脱了其中两个——贪财和肉欲的渴求，因为我既没有金子，也没有任何其他财产。我也不享受滋养这种疾病的享乐。因此这些情欲已不再困扰我。但我却无论如何也无法摆脱暴食。看哪，现在我已经四天没有进食，那个残酷的债主——我的肚腹，却不断地折磨我，索要它惯常的债，如果我不偿还它，它就不让我活下去。」


          于是，一些哲学家认为整个这番话是故意编造的，然而，他们还是给了他一枚金币。塞拉皮翁拿着金币去了面包店，拿了一个面包，立刻离开了城市，并且再也没有回到那里。这时，哲学家们才明白这个人过着真正道德的生活，于是，他们付了面包的钱，将金币收回。'
  - type: heading2
    text:
      ru: О некоем манихее
      cn: 关于一个摩尼教徒
    children:
    - type: paragraph
      text:
        ru: 'Удалившись оттуда в окрестности Лакедемона, блаженный Серапион услышал, что один из первых людей города, муж, впрочем, добродетельный, по вере, со всем своим домом, был манихей. Сей наилучший из монахов, так же как и прежде, продал себя этому человеку и в два года успел отклонить от ереси его самого и его жену со всем домом его и присоединить их к Церкви. Они полюбили его не как раба, но более, чем родного брата и отца; содержали его в великой чести и вместе с ним прославляли Бога. Преподав им многие наставления, Серапион, сей духовный адамант, чрез несколько времени удалился от них, отдав и этим своим хозяевам деньги, за которые продал себя, и, не имея с собою решительно ничего, сел на корабль, как будто ему следовало плыть в Рим. Корабельщики, смотря на Серапиона, полагали, что он свои пожитки уже перенес на корабль или что станет тратить золото на издержки, и потому без расспросов приняли его, каждый думая, что другой взял его пожитки. По отплытии, быв уже стадий на пятьсот от Александрии, они около захождения солнца наперед пообедали сами, потом стали есть и прочие бывшие на корабле. Видя, что Серапион не ест в первый день, они предполагали, что сей путешественник получил отвращение от пищи вследствие плавания; то же было и во второй, то же – и в третий, и в четвертый день. Но в пятый, во время общего обеда, видя, что он опять сидит спокойно, они сказали ему: «Ты что не ешь, любезный?». «Мне нечего есть», – отвечал он им. Услышав это, корабельщики стали спрашивать друг у друга, кто взял его запасы на корабль. Когда же узнали, что никто не брал (ибо ничего у него не было), то начали бранить его и говорили: «Как ты вошел сюда без всяких запасов? Чем будешь кормиться в продолжение плавания?». И еще: «Чем заплатишь нам за перевоз?». Он равнодушно отвечал: «У меня ничего нет. Отвезите меня и бросьте там, где взяли». Корабельщики говорят ему: «Что ты сердишься? При настоящем, благодаря Богу, попутном ветре мы не согласимся сделать это, хотя бы ты дал нам и сто золотых. Мы пойдем к своему месту и совершим предлежащий путь». Таким образом, Серапион пробыл без забот на корабле и корабельщики кормили его до самого Рима. Пришедши в Рим, подвижник Христов осведомился, кто в этом городе лучший подвижник или подвижница.'
        cn: '蒙福的塞拉皮翁从那里离开，抵达拉刻代蒙附近时，听说城中一位首要人物，此人品德高尚，然而就信仰而言，他与全家都是摩尼教徒。这位最优秀的修士，如同往常一样，将自己卖给了这个人，并在两年内成功使他本人、他的妻子和全家都脱离了异端，并将他们归入教会。他们爱他，不把他当作奴仆，而是胜过亲兄弟和父亲；极其尊敬他，并与他一同赞美上帝。在给予他们许多训诲之后，塞拉皮翁，这位属灵的金刚石，过了一段时间便离开了他们，并将他把自己卖身的钱也还给了这些主人。他身上一无所有，登上了一艘船，仿佛他要去罗马。


          船员们看着塞拉皮翁，认为他已经把自己的行李搬上了船，或者他会花钱支付费用，因此没有询问就接纳了他，各自以为是另一个人拿了他的行李。启航之后，当他们已航行到离亚历山大五百斯塔迪远时，他们在日落时分，先自己吃了晚餐，然后船上其他人也开始吃饭。看到塞拉皮翁第一天没有吃东西，他们以为这位旅客是因为航行而厌食了；第二天、第三天和第四天也是如此。但到了第五天，在大家一起用餐的时候，看到他仍然平静地坐着，他们对他说：「亲爱的，你为什么不吃东西？」他回答他们：「我没什么可吃的。」船员们听了这话，便互相询问是谁把他的补给品带上船的。当他们得知没有人拿（因为他一无所有）时，便开始责骂他，说：「你怎能没有任何补给品就上船？在航行中你要靠什么维生？」又问：「你拿什么付我们船费？」他淡然地回答：「我什么都没有。你们把我送到你们接我上船的地方，然后把我扔在那里吧。」船员们对他说：「你为何生气？既然现在蒙上帝恩典，顺风而行，即使你给我们一百金币，我们也不会同意那么做。我们会前往目的地，完成这趟旅程。」


          塞拉皮翁就这样无忧无虑地待在船上，船员们一直供养他直到罗马。抵达罗马后，基督的苦行者打听这座城里最优秀的男苦行者或女苦行者是谁。'
  - type: heading2
    text:
      ru: О Домнине
      cn: 关于多姆宁
    children:
    - type: paragraph
      text:
        ru: 'Между прочим, он встретился с одним доблестным в подвижничестве мужем, учеником Оригена Домнином, который совершил великие подвиги. О нем ходила молва, что он сделал много чудес. Говорили, что, по смерти его, даже постель его исцеляла болезни. Встретившись с ним и получив от него наставления (ибо сей муж отличался и нравом, и познаниями, и словом, и жизнию), Серапион спросил его: «Какой еще есть там подвижник или подвижница?» – и узнал от него об одной деве, пребывающей в безмолвии, которая двадцать пять лет жила, заключившись в своей келии, и ни с кем никогда не виделась.'
        cn: '顺便说一句，他遇到了一位在苦修中大有功德的男子，他是俄利根的门徒多姆宁，曾完成了伟大的苦修功绩。关于他有传闻说他行了许多奇迹。人们说，在他去世后，甚至他的床也能治愈疾病。


          遇见他并从他那里得到了教导（因为这位男子无论在品格、学识、言语还是生活中都出类拔萃）后，塞拉皮翁问他：「那里还有哪些苦修者，无论是男是女？」——他从多姆宁那里得知有一位居住在静默中的童贞女，她把自己关在她的隐修小室里住了二十五年，从未与任何人相见。'
  - type: heading2
    text:
      ru: О римской девице
      cn: 关于罗马贞女
    children:
    - type: paragraph
      text:
        ru: 'Итак, сей славный муж, узнав дом, пошел туда и сказал прислуживавшей ей старице: «Скажи девице, что один монах непременно желает с нею видеться». Старица отвечала ему, что эта затворница много лет никого не видит. Но он повторил: «Поди скажи, что я должен с нею видеться, ибо меня послал к ней Бог». Однако ж она и тут не послушалась. Пробыв три дня, Серапион наконец увидел ее и сказал: «Что ты сидишь здесь?». «Я не сижу, – отвечала она, – а иду». «Куда же ты идешь?» – спросил ее Серапион. «К Богу моему», – отвечала девица. «Жива ты или умерла?» – говорит ей раб Божий. «Верую Богу моему, что умерла для мира, – отвечает она, – ибо, кто живет по плоти, тот не пойдет к Богу». Услышав сие, блаженный Серапион сказал: «Дабы уверить меня в том, что ты умерла для мира, сделай то, что я делаю». Она отвечала ему: «Приказывай, но только возможное, и я сделаю». «Для мертвого, подобного тебе, все возможно, кроме нечестия, – отвечал он и потом сказал ей: – Сойди вниз и пройдись». «Я не выхожу двадцать пять лет, – отвечала она ему, – как же теперь пойду?». «Вот, – сказал Серапион, – не говорила ли ты: “Я умерла для сего мира”? Очевидно поэтому, что и мир для тебя не существует. А если так, то мертвый ничего не чувствует и для тебя должно быть совершенно равно – выйти или не выйти».'
        cn: 因此，这位尊贵的男子得知其住所后，便去了那里，对服侍她的老妇人说：「请告诉那位少女，有位修士一定要见她。」老妇人回答他，说这位隐修女多年来不见任何人。但他重复道：「你去告诉她，我必须见她，因为是上帝派我来见她的。」然而她这次也没有听从。停留了三天后，塞拉皮翁终于见到了她，并问道：「你为何坐在这里？」「我不是坐着，」她回答说，「而是行走着。」「那你往哪里去呢？」塞拉皮翁问她。「往我的上帝那里去，」少女回答说。「你是活着的还是死去的？」上帝的仆人对她说。「我深信我的上帝，我已向世界死去，」她回答说，「因为凡是按肉体而活的，都不能去到上帝那里。」听闻此言，蒙福的塞拉皮翁说：「为了让我相信你已经向世界死去，你就做我所做的事吧。」她回答他：「尽管吩咐，只要是可能的事，我都会去做。」「对于一个像你一样死去的人，除了不敬虔之事，一切都是可能的，」他回答说，然后又对她说：「下到下面去走一走吧。」「我已有二十五年没有出去过，」她回答他，「现在我怎么能出去呢？」「看啊，」塞拉皮翁说，「你不是说过：『我已向这世界死去』吗？因此很明显，世界对你来说也不复存在了。既然如此，一个死者是感受不到任何东西的，所以对你而言，出去与不出去应该完全一样。」
    - type: paragraph
      text:
        ru: 'Девица, услышав это, пошла. Когда она вышла вон и дошла до одной церкви, блаженный, вошедши в церковь, сказал ей там: «Если хочешь уверить меня в том, что ты умерла и уже не живешь для людей, чтобы угождать им, сделай то, что я могу сделать, и тогда убедишь меня, что ты действительно умерла для сего мира». «Что же должна я сделать?» – спросила девица. «Сними с себя все платье, как вот я, – сказал он, – положи его на плечи и ступай по городу, а я без стыда пойду вперед тебя в таком же виде». «Но если, – отвечала она, – я сделаю это, то многих соблазню таким бесстыдством и кто-нибудь скажет, что это сумасшедшая или беснующаяся». «А тебе что за дело, если это скажут, – отвечал блаженный Серапион. – Ведь ты говоришь, что умерла для людей, а мертвецу нет никакой нужды до того, бранит ли кто его или смеется над ним, потому что он нечувствителен ко всему». Тогда говорит ему эта девица: «Прошу тебя, прикажи мне сделать другой какой угодно подвиг, и я сделаю; теперь я не дошла еще, а только молюсь о том, чтобы дойти до такой степени». После этого раб Божий, бесстрастный Серапион, сказал ей: «Смотри же, сестра, не величайся, будто ты святее всех, и не хвались, что умерла для сего мира. Ты вот узнала, что жива еще и угождаешь людям. Я могу быть более мертвым, нежели ты, и что я умер для мира, могу доказать делом – именно тем, что равнодушно взираю на него, ибо, не стыдясь и не соблазняясь, могу сделать то, что приказывал тебе». Сими словами научив ее смиренномудрию и сокрушив ее гордость, блаженный оставил ее совершенною и удалился от нее.'
        cn: 贞女听到这话，就去了。当她出去走到一座教堂时，这位蒙福者走进教堂，在那里对她说：「如果你想让我相信你已经死了，不再为了取悦人而活着，那么就去做我能做的事，这样你就能让我相信你确实已经死于这个世界了。」「那我该做什么呢？」贞女问道。「像我这样，脱下你所有的衣服，」他说，「把它放在你的肩上，走遍全城，而我将同样赤身露体，毫无羞耻地走在你前面。」「但是，」她回答说，「如果我这样做，我就会用这样的无耻来诱惑（或使人跌倒）许多人，而且会有人说，这是一个疯子或者被鬼附的人。」「如果他们那样说，那与你何干呢？」蒙福者塞拉皮翁回答说，「毕竟你说你已经死于世人了，而一个死人对于别人咒骂他或嘲笑他，都毫不在意，因为他已对一切都无所感觉了。」于是这贞女对他说：「我恳求你，吩咐我做任何其他的苦修功课，我都会去做的；我现在还没有达到那种程度，我只是为此祷告，希望能达到那样的境界。」此后，神的仆人，无情欲的塞拉皮翁对她说：「看哪，姊妹，不要自高自大，仿佛你比所有人都圣洁，也不要夸口说你已经死于这个世界了。你看，你已经知道自己还活着，并且还在取悦于人。我可以比你更像一个死人，我已死于世人，这一点我可以用行动来证明——那就是，我能漠然地看待它，因为我可以毫不羞耻、毫无困扰地去做我吩咐你做的事。」借着这些话，他教导她谦卑，并粉碎了她的骄傲，这位蒙福者使她变得完全，然后离开了她。
    - type: paragraph
      text:
        ru: Такова жизнь Серапиона, мужа бесстрастного и в высшей степени нестяжательного. Много славных и удивительных дел, относящихся к бесстрастию, совершил добродетельный мудрец Христов, но мы из многого описали немногое и показали чистоту его жизни. Сей бессмертный муж умер на шестидесятом году жизни и погребен в самой пустыне.
        cn: 这就是塞拉皮翁的生平，他是一位不动情欲且极度不重物欲的人。基督的这位贤德智者行了许多关乎不动情欲的荣耀而奇妙的作为，但我们从众多事迹中只记述了极少部分，并借此展示了他生命的纯洁。这位不朽之士在他六十岁那年去世，并被安葬在旷野深处。
  - type: heading2
    text:
      ru: О Евагрии, знаменитом диаконе
      cn: 关于著名的执事埃瓦格里
    children:
    - type: paragraph
      text:
        ru: Находя несправедливым умолчать о делах Евагрия, знаменитого диакона Христова, мужа жизни апостольской, – напротив, признав за справедливое предать оные писанию для назидания читателей и прославления благости Спасителя нашего, я предложу сначала, как поступил он в монашество и как, потрудившись достойно своего обета, скончался в пустыне пятидесяти четырех лет, по словам Писания:«Скончався вмале исполни лета долга, угодна бо бе Господеви душа его»(Прем. 4, 13–14).
        cn: 认为对厄瓦格里（这位）基督的著名执事、过着使徒生活的人（的）事迹保持缄默是不义的，相反地，认为将其载于笔端是公义的，为要使读者得蒙教益，并荣耀我们救主的良善，我将首先叙述他是如何进入隐修生活，以及他如何在配得上其誓愿的辛劳之后，于五十四岁之龄在旷野中离世，正如经上所记：「他虽早逝，却享寿有年，因他的灵魂蒙主悦纳」（智慧篇 4:13-14）。
    - type: paragraph
      text:
        ru: Родом был он понтиец, из города иберийского, сын пресвитера, и святым Василием, архиепископом Кесарийским, поставлен в чтеца к Церкви Аргосской. По преставлении же святого архиепископа Василия, святой Григорий, епископ Нисский, брат архиепископа Василия, стяжавшего славу апостольскую, мудрейший, бесстрастнейший и весьма знаменитый ученостию, обратив внимание на способности Евагрия, рукоположил его во диакона. Пришедши оттуда на Великий Собор Константинопольский, святой епископ Григорий оставил его у блаженного епископа Нектария, как искуснейшего в опровержении всех ересей. И стал он славиться в великом городе, мужественно побеждая словами всякую ересь. Случилось, что этот муж, которого во всем городе уважали за отличную честность нравов, был уязвлен страстною любовию к женщине, как он сам рассказывал нам после, когда уже освободился от сего искушения. Женщина взаимно полюбила его, а она была из знатного дома. Евагрий, боясь Бога, стыдясь своей совести, представляя себе скверну порока и злорадование еретиков, усердно молил Бога воспрепятствовать намерению женщины, которая, быв распалена страстию, усиливалась вовлечь его в грех. Он хотел удалиться от нее, но не мог, удерживаемый узами ее одолжений.
        cn: 他原是本都人，来自伊比利亚城，是一位长老的儿子，并被凯撒利亚大主教圣瓦西里任命为阿尔戈斯教会的读经员。在圣瓦西里大主教安息之后，圣格里戈里，尼撒主教，瓦西里大主教的兄弟，这位享有使徒般声望、最睿智、最无私欲、学识渊博之人，留意到厄瓦格里的才能，遂将他按立为执事。圣格里戈里主教从那里来到君士坦丁堡大公会议，便将他留在蒙福的涅克塔里主教那里，因为他最擅长驳斥一切异端。他便在这大城里声名鹊起，以言语勇敢地战胜各种异端。不料，这位因品行正直而在全城受人尊敬的男子，却被对一个女人的炽热情欲所困，正如他自己后来从这诱惑中解脱出来时告诉我们的那样。那女人也爱上了他，而且她出身名门。厄瓦格里因敬畏上帝，并因良心感到羞耻，想到罪恶的污秽和异端者的幸灾乐祸，恳切地祈求上帝阻止那女人的意图，她被情欲点燃，竭力要引诱他犯罪。他想远离她，却不能，被她情意的羁绊所束缚。
    - type: paragraph
      text:
        ru: 'Немного спустя после молитвы, которою предотвратил он совершение греха, предстал ему в видении Ангел в одежде воина эпархова[29]и, взяв его, повел будто в судилище, бросил в темницу, обложил шею его железными узами и связал руки железными цепями. Между тем приходившие к нему не говорили ему о причине заключения. Сам же он, мучимый совестию, думал, что подвергся сему за то дело, и полагал, что муж женщины донес о нем судие. Он находился в чрезвычайном смущении, когда производился суд над другими и когда пытали других касательно подобного же преступления. После столь великой боязни и безмерного мучения Ангел, так устрашивший его в видении, принял образ искреннего друга его и пришел будто навестить его. Казалось, он чрезвычайно был поражен и опечален тем, что друг его терпит поносные узы и сидит в заключении между сорока преступниками, и сказал ему: «Господин диакон! За что так бесчестно держат тебя с преступниками?». «Поистине не знаю, – отвечал он. – Впрочем, у меня есть подозрение, что на меня донес такой-то эпарх по безумной ревности, и я опасаюсь, не подкуплен ли им градоначальник и не подвергнут ли меня самому тяжкому наказанию». Тогда представший ему в виде друга сказал: «Хочешь ли послушаться друга своего? Я советую тебе не оставаться в этом городе». Евагрий отвечал ему: «Если Бог освободит меня от этой беды и ты потом увидишь меня в Константинополе, знай, что я по справедливости подвергаюсь такому наказанию и достоин еще большего». Друг сказал ему: «Когда так, я принесу Евангелие, а ты поклянись мне на нем, что удалишься из сего города и позаботишься о душе своей, и я избавлю тебя от этой беды». Евагрий сказал: «Прошу тебя, поклянусь тебе, как хочешь, только избавь меня от этой мрачной тучи». После сего тот принес Евангелие и требовал клятвы. Евагрий поклялся на Евангелии не оставаться здесь, кроме одного дня, и то для того только, чтобы перенести на корабль свою одежду. По произнесении клятвы, встревоженный, он вышел из того состояния, в котором был ночью. Вставши, он размышлял: «Пусть клятва сделана в исступлении, но все же я поклялся». Итак, перенесши все, что имел, на корабль, он отплыл в Иерусалим и там принят был блаженною Меланиею Римлянкою.'
        cn: 祷告过后不久，他借此祷告阻止了罪的发生，一个天使在异象中向他显现，身穿省总督[29]士兵的服装，抓住他，仿佛将他带到一个法庭，将他投入监狱，用铁枷锁住他的脖子，并用铁链捆绑他的双手。与此同时，那些来看他的人没有告诉他被囚禁的原因。而他自己，受良心折磨，以为他遭受这事是由于那件事，并认为那个女人的丈夫向法官告发了他。当别人受审，当别人因类似罪行被拷问时，他处于极度的困惑中。经过如此巨大的恐惧和无尽的痛苦之后，那个在异象中如此惊吓他的天使，变成了他一个真诚朋友的模样，仿佛前来探望他。他似乎对朋友承受可耻的枷锁并与四十个罪犯一同被囚禁感到极其震惊和悲伤，对他说：「执事先生！你为何如此不体面地与罪犯们关在一起？」「我实在不知道，」他回答说，「不过，我怀疑某个省总督因疯狂的嫉妒告发了我，我担心市长是否被他收买了，我会不会被判处最严厉的惩罚。」于是，以朋友形象出现的那位说：「你愿意听从你朋友的话吗？我建议你不要留在这个城市。」叶瓦格里乌斯回答他：「如果上帝将我从这场灾难中解救出来，而你之后在君士坦丁堡看见我，你就知道我理所当然地遭受这样的惩罚，并且配得上更重的惩罚。」朋友对他说：「既然如此，我会带来福音书，你就在上面向我起誓，你将离开这个城市并照顾你的灵魂，我就会将你从这场灾难中解救出来。」叶瓦格里乌斯说：「我求你，我愿按你所愿向你起誓，只求你将我从这片黑暗的乌云中解救出来。」此后，那人带来了福音书并要求他起誓。叶瓦格里乌斯在福音书上起誓，除了再留一天，不留在这里，而且那一天也只是为了将他的衣物搬到船上。起誓之后，他感到不安地从夜间所处的状态中脱离出来。醒来后，他沉思道：「即使誓言是在恍惚中许下的，但我毕竟还是起誓了。」于是，他将他所有的一切都搬到船上，启程前往耶路撒冷，并在那里被蒙福的罗马人梅拉尼娅接待。
    - type: paragraph
      text:
        ru: 'Потом диавол опять ожесточил его сердце, как сердце фараона, и он, будто пылкий юноша, опять впал в сомнение и колебался душою, ни с кем не говоря ни слова, а там опять переменил одежду и ум его обуяло ораторское тщеславие. Но Бог, удерживающий всех нас от погибели, поверг его здесь в другую беду – послал на него горячку и тяжкою болезнию в продолжение шести месяцев измождил плоть его, которая препятствовала ему быть добродетельным. Когда врачи уже сомневались в нем и не находили способа вылечить его, блаженная Мелания сказала: «Не нравится мне, сын мой, долгая болезнь твоя. Скажи мне, что у тебя на душе, ибо не эта настоящая твоя болезнь». Он признался ей во всем, что случилось с ним в Константинополе. Блаженная сказала ему: «Дай мне пред Богом слово, что ты решишься вести монашескую жизнь, и я хотя грешница, но помолюсь Господу, чтобы дано было тебе время обращения и продолжение жизни». Он согласился. Когда она помолилась, он в несколько дней выздоровел. По выздоровлении, получив от нее самой иноческое одеяние, Евагрий отправился в Нитрийскую гору, что в Египте, где прожил два года, а на третий удалился в пустыню.'
        cn: 之后，魔鬼再次使他的心刚硬，如同法老的心一样，他，仿佛一个热情的少年，再次陷入疑惑，内心动摇不定，一言不发，之后他又换了衣服，雄辩的虚荣心占据了他的思想。然而，神，那位将我们所有人从灭亡中拯救出来的主，在此使他陷入另一种困境——降下热病在他身上，并用重病折磨他的肉体长达六个月之久，这肉体阻碍他行善。当医生们已经对他失去信心，束手无策之时，蒙福的墨拉尼娅说道：「我的孩子，我不喜欢你这长久的病痛。告诉我你内心有什么隐情，因为这并不是你真正的病。」他向她坦白了在君士坦丁堡所发生的一切。蒙福的她对他说：「请你在神面前向我立誓，你将决心过修道生活，那么，我虽然是个罪人，但会向主祈祷，使你得到悔改的时间和生命的延续。」他同意了。当她祈祷之后，他几天内就康复了。康复之后，他从她本人那里领受了修士的袍服，厄瓦格里乌斯前往埃及的尼特利亚山，在那里住了两年，第三年便隐居到旷野去了。
    - type: paragraph
      text:
        ru: 'Четырнадцать лет он прожил в так называемых Келлиях и ел в день по литре хлеба, а в три месяца употреблял секстарий[30]елея – так постился этот человек, воспитанный в неге и роскоши! Он сочинил сто молитв и записывал, на сколько каждогодно употребил пищи (он прекрасно писал скорописным почерком). В продолжение пятнадцати лет, очистив ум, он удостоился дара ведения, и мудрости, и различения духов. Он составил три книги под заглавиями «Священная», «О монашестве», «Об опровержении» и изложил в них средства против демонов. На него иногда сильно восставал демон блуда, как он сам говорил нам, и тогда целую ночь сидел он нагой в колодце во время зимы, так что тело его цепенело. В другое время досаждал ему дух хулы – и тогда он сорок дней не входил под кровлю, так что тело его, как у диких зверей, покрывалось множеством насекомых. Однажды явились ему днем три демона в одежде клириков для состязания с ним о вере: один называл себя арианином[31], другой – евномианином[32], третий – аполлинаристом[33]. Но он скоро победил их духовною мудростию. В другой день, когда пропал ключ от церкви, Евагрий, осенив замок знамением креста и призвав имя Христово, толкнул дверь рукой и отворил ее. Он столько раз был бит демонами и столько претерпел искушений от различных бесов, что трудно их и перечислить. Одному из учеников своих он предсказал все, что случится с ним чрез восемнадцать лет, и предсказал подробно.'
        cn: 他在被称为凯里亚的地方住了十四年，每天吃一升面包，每三个月才用一塞克斯塔里[30]油——这个在安逸与奢华中长大的人竟如此守斋！他撰写了一百篇祷文，并记录他每年所食用的食物总量（他写得一手漂亮的草书）。在十五年间，他洁净了心智，蒙受了洞察力、智慧和辨别诸灵的恩赐。他著述了三本书，题名为《神圣论》、《论修道生活》和《驳斥论》，并在其中阐述了对抗邪魔的方法。正如他亲口告诉我们的，有时淫欲的邪魔会猛烈侵扰他，那时他便在冬夜里赤身裸体地坐在井中整夜，直至身体冻僵。另有时，亵渎的灵困扰着他——那时他便四十天不进屋舍，以至于他的身体就像野兽一样，被无数昆虫覆盖。一天，三个邪魔白天向他显现，穿着神职人员的服装，为要与他辩论信仰：一个自称是阿里乌派信徒[31]，另一个自称是尤诺米乌派信徒[32]，第三个自称是阿波利纳里斯派信徒[33]。但他很快就以属灵的智慧战胜了他们。另有一天，当教堂的钥匙丢失后，艾瓦格里在锁上划十字圣号，呼求基督之名，用手推开门，门就开了。他被邪魔击打的次数和忍受来自各种恶魔试探的次数是如此之多，以至于难以一一列举。他向他的一位门徒预言了十八年之后将要发生在他身上的一切，并且预言得十分详尽。
    - type: paragraph
      text:
        ru: 'Сей блаженный муж говорил: «С тех пор как я пришел в пустыню, не ел я ни салата, ни зелени, никаких свежих растений, ни плодов древесных, ни винограда, не омывал тела, не ел ни мяса, ни хлеба, ни вина и вообще ничего, что приготовляется на огне, кроме некоторых сырых овощей и небольшого количества воды».'
        cn: 这位蒙福的圣人说：「自从我来到旷野，我既未吃沙拉，也未吃任何绿叶蔬菜，也未吃任何新鲜植物，也未吃树上的果实，也未吃葡萄，我未曾沐浴身体，既未吃肉，也未吃面包，也未饮葡萄酒，并且总体上未曾吃任何用火烹制的东西，除了吃一些生蔬菜和少量的水。」
    - type: paragraph
      text:
        ru: 'Наконец, после того как он прожил таким образом шестнадцать лет, не принимая вареной пищи, и когда тело его ослабело и желудок расстроился, он почувствовал нужду в пище, приготовляемой на огне, и стал вкушать хлеб. Но и последние два года не ел вареных овощей, разве только кашицу или бобы. Так блаженный умерщвлял тело и оживотворял свою душу Святым Духом, причащаясь в церкви в праздник Богоявления. Этот доблестный подвижник Христов говорил нам перед смертию: «Вот уже три года не тревожила меня плотская похоть». Если после такой добродетельной жизни, после таких подвижнических, неутомимых трудов и непрестанного бодрствования в молитве ненавистник добра и погибельный демон так нападал на этого праведника, то сколько могут терпеть от нечистого демона или от собственного нерадения люди беспечные?!'
        cn: 最终，在他这样生活了十六年，不吃煮熟的食物之后，当他的身体变得虚弱，肠胃也失调了，他感到需要用火烹制的食物，便开始吃面包。但在最后的两年里，他也不吃煮熟的蔬菜，除非是稀粥或豆子。就这样，这位蒙福之人治死肉体，并借着圣灵使他的灵魂活过来，在主显节时在教堂领受圣餐。这位基督的英勇苦修者在他临终前告诉我们：「看哪，已经三年了，肉体的邪情私欲没有再搅扰我。」如果在这样一种德性的生活之后，在如此苦修的、不知疲倦的劳作以及不间断的警醒祷告之后，恨恶良善者和那毁灭性的魔鬼仍然如此攻击这位义人，那么那些漫不经心的人，将要从污秽的魔鬼或自身的怠惰中遭受多少苦难呢？！
    - type: paragraph
      text:
        ru: 'Когда этому святому возвестили о смерти его отца, он сказал возвестившему: «Перестань говорить хулу – мой Отец бессмертен!».'
        cn: 当这位圣人被告知他的父亲去世时，他对报信的人说：「停止说亵渎的话——我的父是不朽的！」
    - type: paragraph
      text:
        ru: Доселе – высокая жизнь славного Евагрия, исполненная добродетельных подвигов.
        cn: 迄今为止，荣耀的厄瓦格里乌斯崇高的生活，充满了德行善功。
  - type: heading2
    text:
      ru: Об авве Пиоре
      cn: 关于阿爸皮奥尔
    children:
    - type: paragraph
      text:
        ru: 'Некто по имени Пиор, родом египтянин, в юных летах отрекшись мира, удалился из дома отеческого и от избытка духовной любви дал обет Богу не видеть более никого из родных. Спустя пятьдесят лет сестра его, уже состарившаяся, узнала от кого-то, что брат ее жив, и решилась во что бы то ни стало увидеть его. Не имея возможности идти в пустыню, она просила местного епископа написать к пустынникам, чтобы они послали Пиора для свидания с нею. После многого принуждения послушаться отцов он решился идти, взяв с собою еще одного, и дал знать дому сестры, что пришел брат ее Пиор и стоит за дверьми. Угадывая по скрипу двери, что сестра идет встретить его, Пиор зажмурил глаза и громко говорил ей: «Сестра, это я – Пиор, брат твой; вот смотри на меня, сколько хочешь». Получив желаемое, она прославила Бога и, хотя много настаивала, однако ж не убедила его войти в дом. Он же, сотворив молитву на пороге, возвратился опять в свою родную пустыню и там усовершался в подвижнической добродетели.'
        cn: '有一位名叫皮奥尔的人，埃及人，在年轻时弃绝了世界，离开了父家，并且出于充溢的属灵之爱，向上帝许诺不再见到任何一位亲属。


          五十年后，他的姐姐，那时已经年迈，从某人那里得知她的兄弟还活着，并且决心无论如何都要见到他。由于无法前往旷野，她请求当地的主教写信给隐修士们，请他们派皮奥尔来与她相见。经过多番劝说他顺从了教父们，他决定前往，带着另一个人一同前往，并告知姐姐的家，她的兄弟皮奥尔已经来了，正站在门外。从门的吱呀声中猜到姐姐正出来迎接他，皮奥尔紧闭双眼，并大声对她说：「姐姐，是我——皮奥尔，你的兄弟；你想看多久就看多久吧。」


          得到所愿的后，她赞美了上帝，并且，尽管她极力坚持，却未能说服他进屋。而他，在门槛上做了祷告后，又回到了他自己的旷野，并在那里在苦修的德行上得以完善。'
    - type: paragraph
      text:
        ru: О сем святом муже рассказывают вот какой чудный опыт его терпения. На месте своего жития выкопал он колодезь и нашел воду самую горькую, но, несмотря на это, оставался там до самой смерти и употреблял одну эту горькую воду, в чем и открылось терпение этого мужественного воина Христова. Многие из монахов, мужи опытнейшие, по смерти сего бессмертного наперерыв усиливались остаться в его келии, но не могли прожить и одного года, ибо там и вода чрезвычайно горька, и место очень страшно и лишено всяких удобств жизни.
        cn: 关于这位圣者，人们讲述了他这样奇妙的忍耐经历。在他居住之处，他挖了一口井，并找到了极苦的水。然而，尽管如此，他仍然在那里一直居住直到离世，只饮用这口苦水。在此，这位基督的勇武战士的忍耐便显明出来。许多修士，那些经验最为丰富的修士们，在这位不朽者去世后，争相试图留在他的隐修室里，但甚至连一年都无法住满，因为那里的水极苦，并且那个地方非常可怕，没有任何生活的便利。
  - type: heading2
    text:
      ru: О Моисее Ливийском
      cn: 关于利比亚的摩西
    children:
    - type: paragraph
      text:
        ru: 'Моисей Ливийский был муж весьма кроткий и любвеобильный. Он удостоился дара исцелений. Сам он рассказывал мне: «В монастырь я поступил очень молодым и стал копать большой колодезь, шириною в двадцать футов. Его три дня рыли мы, восемьдесят человек, и прокопали уже на локоть обыкновенную жилу, как можно было видеть, а воды не нашли. Весьма опечалившись, мы думали уже оставить работу. В то самое время, как мы рассуждали об этом, пришел к нам из глубокой пустыни, в самый (шестой) час зноя, блаженный Пиор, старец, одетый милотию, и, приветствовав нас, сказал нам после приветствия: “Что вы упали духом, маловерные? Я видел, что вы малодушествуете со вчерашнего дня”. Сказав это, он спустил лестницу в отверстие колодезя и сотворил с нами молитву, потом взял заступ и, ударив в землю троекратно, сказал: “Боже святых патриархов! Не остави всуе рабов Твоих, но пошли им воду на пользу”. И тотчас побежала вода так, что обрызгала всех нас. Вслед за сим, сотворив опять молитву, он пошел прочь. Сколько ни принуждали мы его обедать у нас, он не согласился, сказав: “Зачем я послан был, то сделал, а за этим не был послан”. Таковы дивные чудеса Пиора, крепкого столпа терпения, и таков конец добродетели его. За горькую воду он теперь с великою духовною радостию вкушает из вечного потока сладости».'
        cn: 摩西·利维斯基（Моисей Ливийский）是一位非常温和谦卑且充满慈爱的人。他蒙受了医治的恩赐。他亲自对我讲述道：「我进入修道院时还非常年轻，就开始挖一口大水井，宽约二十英尺。我们八十个人挖了三天，已经挖到了一肘深的地层，清楚可见，却没有找到水。我们非常忧伤，心想已经要放弃这项工作了。就在我们议论此事的时候，在最炎热的（第六）个时辰，蒙福的长老皮奥尔（Пиор）身披僧袍，从幽深的旷野来到我们这里，问候我们之后说：『你们为何灰心丧志，小信的人哪？我看见你们从昨天就开始气馁了。』说完这话，他把梯子放进井口，和我们一起做了祷告，然后拿起铲子，向地上敲击了三次，说：『圣祖之神啊！不要让祢的仆人徒然无功，却要为他们的益处赐予他们水。』水立刻涌了出来，甚至溅湿了我们所有人。紧接着，他又做了一次祷告，便离开了。无论我们怎样强留他与我们一同进餐，他都不同意，说：『我被差遣来做的事情，我已经做了；至于此事，我并未受差遣。』这些就是皮奥尔那令人惊叹的奇迹，他是忍耐的坚固支柱，这也是他美德的结局。他如今因那苦水，正以极大的属灵喜乐，从永恒的甘甜之流中品尝滋味。」
  - type: heading2
    text:
      ru: Об авве Хронии
      cn: 关于阿爸赫罗尼奥斯
    children:
    - type: paragraph
      text:
        ru: Некто по имени Хроний, родом из деревни, называемой Финик, отмерял от своей деревни, бывшей близ пустыни, пять тысяч шагов, считая правою ногою; потом, помолившись, выкопал там колодезь и нашел очень хорошую воду, которая держалась в глубине семи локтей. Он построил там для себя малую хижину и с того дня, как водворился в этом уединенном убежище, молился Богу, чтобы ему не возвращаться в страну обитаемую. По прошествии немногих лет он удостоен был пресвитерства, и около него собралось братии до двадцати человек. Говорят о добродетели его подвижничества, что он шестьдесят лет предстоял у жертвенника, священнодействуя, и во все это время не выходил из пустыни и вкушал хлеб только от труда рук своих.
        cn: 某位名叫赫罗尼的人，来自一个名叫菲尼克的村庄，从他靠近旷野的村庄量出了五千步，以右脚计数；然后，祷告后，在那里挖了一口井，并且找到了非常好的水，水位在七肘深处。他在那里为自己建了一间小茅屋，从他住进这个隐居的居所那天起，他向神祷告，求他不再回到有人居住的土地。几年之后，他被授予长老职，大约有二十位弟兄聚集在他身边。人们提到他苦修的德行，说他在祭坛前服事了六十年，施行圣事，并且在这所有的时间里，他没有离开旷野，只靠双手劳作的成果为食。
  - type: heading2
    text:
      ru: Об авве Иакове
      cn: 关于阿爸雅各
    children:
    - type: paragraph
      text:
        ru: Вместе с ним жил некто Иаков, из его соседей, прозванный Хромым, муж многозначительный. Оба они были известны блаженному Антонию.
        cn: 与他同住的，有一位名叫雅各布的人，是他的邻居之一，绰号跛子，是一位很有分量的人。他们两个都为蒙福的安东尼所认识。
  - type: heading2
    text:
      ru: Об авве Пафнутии
      cn: 关于帕夫努提阿爸
    children:
    - type: paragraph
      text:
        ru: В один день пришел туда и Пафнутий, называемый Кефала, муж чудный. Он имел дар знания Божественного Писания Ветхого и Нового Завета и изъяснял все Писание, не читавши Писания. Впрочем, так был скромен, что скрывал в себе этот дар пророческий. Рассказывают в похвалу его добродетели, что в продолжение восьмидесяти лет он не имел вместе двух срачиц[34]. Встретившись с сими отцами, я и блаженные диаконы Евагрий и Альбин расспрашивали их о причинах падений или уклонения братий от доброй жизни.
        cn: 有一天，人称刻法拉的帕夫努提也来到了那里，他是一位奇妙的人。他拥有洞悉神圣《旧约》和《新约》圣经的恩赐，并且无需阅读圣经就能阐释所有的圣经。然而，他如此谦逊，以至于将这先知性的恩赐隐藏在自己里面。人们为了称颂他的美德而述说，他在八十年中从未同时拥有两件衬衣[34]。在遇见这些教父后，我与蒙福的执事叶瓦格里和阿尔宾向他们询问，关于弟兄们堕落或偏离良善生活的原因。
  - type: heading2
    text:
      ru: О Херемоне
      cn: 论 赫雷蒙
    children:
    - type: paragraph
      text:
        ru: Случилось, что в те дни подвижник Херемон скончался сидя и найден был мертвым на стуле с работою в руках. Случилось, что и другой брат, копая колодезь, засыпан был землею, а еще третий брат, идучи из скита, умер от жажды.
        cn: 那时候，苦行者赫雷蒙坐着去世了，人们发现他死在椅子上，手里还拿着活计。还有另一位弟兄在挖井时被土掩埋了，而第三位弟兄在从隐修院出来时渴死了。
  - type: heading2
    text:
      ru: О падшем Стефане
      cn: 关于堕落的司提反
    children:
    - type: paragraph
      text:
        ru: 'Вспомнили мы и о Стефане, впадшем в постыдное распутство, и об Евкарпии и Ироне Александрийском, также о Валенте Палестинском и скитском Птоломее египтянине. Когда мы спрашивали, отчего при такой добродетельной жизни в пустыне одни обольщаются помыслами, другие уловляются чревоугодием, иные впадают в распутство, святые отцы и вместе с ними многоопытный Пафнутий дали нам такой ответ. Все, что ни случается, бывает двояко: или по благоволению Божию, или по Божию попущению. Когда делают добрые дела для славы Божией, это бывает по благоволению Божию, а что сопряжено со вредом, с опасностию и с бедствием, то делается по Божию попущению. Попущение бывает в отношении к тем, которых Бог оставляет за их неразумие и неверие, ибо невозможно, чтобы правомыслящий и благочестиво живущий был оставлен и пал постыдным образом или обольщен был демонами. Но подвергаются падению и те, которые совершают добродетель или с нечистою целию, или из человекоугодия и по гордости ума. Таких людей Бог оставляет ради их же обращения, чтобы они чрез оставление, почувствовав перемену в своем состоянии, исправили или свое намерение, или дело, ибо иногда погрешают намерением, иногда – самым делом, когда имеют в виду порочную цель либо (сознательно) делают не так, как должно. Случается, например, что развратный человек с худым намерением подает милостыню молодым женщинам для постыдной цели. Между тем дело доброе – давать пособие, например, сироте, монахине, подвижнице. Случается также, что и с добрым намерением дают милостыню больным, старым или лишившимся богатства, но дают скупо и с ропотом. В этом случае цель добрая, но само дело недостойно цели, ибо милостыню должно давать с веселием и без скупости.'
        cn: '我们也想起了斯特凡，他曾堕入可耻的放荡；还有亚历山大里亚的欧卡尔皮和伊龙，以及巴勒斯坦的瓦伦特和埃及的斯基特修士托勒密。


          当我们询问，为何在旷野中过着如此德行生活的人，有的被意念所迷惑，有的被贪食所辖制，还有的堕入放荡时，圣教父们和经验丰富的帕夫努提一同给我们这样的答复。凡发生的一切，都以两种方式呈现：或是出于上帝的恩允，或是出于上帝的许可。当人们为上帝的荣耀而行善时，这是出于上帝的恩允；而凡伴随着损害、危险和灾祸的事情，则是出于上帝的许可。许可的发生，是针对那些上帝因其不明智和不信而离弃的人，因为一个思维正直且虔诚生活的人，不可能被离弃并以可耻的方式跌倒，或被邪魔所诱惑。然而，那些实行美德却怀着不洁的目的，或出于取悦于人以及心智的骄傲的人，也会遭受跌倒。上帝离弃这些人是为了让他们归正，使他们借着被离弃，感觉到自身状态的变化，从而纠正他们的意图或行为。因为有时他们在意图上犯错，有时则在行为本身上犯错，例如心怀败坏的目的，或者（故意地）没有按应有的方式行事。例如，有时一个放荡之人怀着邪恶的意图，施舍给年轻女性，为的是可耻的目的。然而，帮助他人本身是一件善举，例如帮助孤儿、修女或苦修女。也可能发生这样的情况，有人怀着良好的意图施舍给病患、老人或失去财富的人，但却吝啬地且带着抱怨地施舍。在这种情况下，目的虽好，但行为本身却不配这个目的，因为施舍应当带着喜乐且不吝啬。'
    - type: paragraph
      text:
        ru: 'Говорили еще святые, что во многих душах есть особенные предрасположения: в иных – естественная доброта души, в других – склонность к подвижничеству. Но, когда и действование по естественной склонности, и доброта не бывают направлены ни к добру, ни к богоугодной цели, когда обладающие особенным даром учения не воздают благодарности подателю благ Богу, но относят это к собственному произволению, благорасположению и способности, – тогда они оставляются Промыслом и впадают в постыдные дела или в постыдные страсти и позор. И вот, оставленные Промыслом, они, из-за постигшего их бесчестия и унижения, мало-помалу отлагают надмение мнимою своею добродетелию и перестают уже доверять себе, а воздают благодарность дарующему все Богу. Когда гордый, надмевающийся превосходством своего ума, самые дарования душевные и способы к приобретению знания приписывает не Богу, а своим усилиям или природе, тогда Бог отъемлет у него Ангела, которому назначено Промыслом блюсти сей дар. Как скоро Ангел отступает, этим человеком, который надмевается своим умом, овладевает противник, и он впадает в распутство, чтобы это скотоподобное или псоподобное распутство изгнало из человека демонское надмение, то есть превозношение, чтобы по удалении свидетеля целомудрия слова таких людей не заслуживали вероятия, поколику благочестивые бегают исходящего из таких уст учения, как источника, наполненного пиявицами, и исполняется на них сказанное в Писании:«Грешнику же рече Бог: вскую ты поведаеши оправдания Моя и восприемлеши завет Мой усты твоими»(Пс. 49, 16).'
        cn: '圣人们还说过，许多灵魂中存在着特殊的倾向：在一些人中，是灵魂天生的善良；在另一些人中，是倾向于苦修。然而，当天生的倾向所产生的行动和善良既不指向善，也不指向蒙神悦纳的目标时；当那些拥有特殊教导恩赐的人，不向上帝这位美善的赐予者献上感谢，反而将其归因于自己的自由意志、善意和能力时——那时，他们就会被天意所离弃，陷入可耻的行为，或可耻的激情与羞辱之中。


          于是，被天意所离弃的他们，因所降临的羞耻和屈辱，渐渐地放下对虚假美德的傲慢，并且不再信赖自己，而是向上帝这位万物的赐予者献上感谢。当那骄傲的、因自己心智的卓越而自大的人，将灵魂的恩赐和获取知识的方法归因于自己的努力或天性，而不是上帝时，那时，上帝就会从他那里取走那位被天意指定守护此恩赐的天使。天使一离开，那因自己心智而自大的人就会被仇敌占据，并且他会陷入放荡，为的是让这种兽性般的或犬类般的放荡，将人里面的魔鬼般的傲慢，也就是自高自大，驱逐出去；为的是在贞洁的见证者被移除之后，这样的人所说的话不再值得相信，因为虔诚的人会避开从这样口中出来的教导，如同避开充满水蛭的泉源一样。圣经中所说的就应验在他们身上：「上帝对恶人说：你为何传讲我的律例，口中提及我的约呢？」（诗篇 50:16）。'
    - type: paragraph
      text:
        ru: 'И в самом деле, души, зараженные страстями, подобны различным источникам: души чревоугодников и винопийц подобны источникам грязным; души сребролюбцев и любостяжателей – источникам, наполненным жабами; души гордых и завистливых, имеющие способность к познаниям, подобны источникам, в которых живут змеи, ибо разум у них всегда застаивается, как гнилая вода в болоте, потому что никому не хочется почерпать оттуда по причине горечи нрава и зловония нечистых дел. Посему Давид и молит Бога даровать ему три дара: благость, учение и знание[35], ибо без благости знание бесполезно. Но если такой человек исправится, удалив от себя причину, за которую Бог оставляет его, то есть надмение, и восприимет смиренномудрие, познает свою ограниченность и не станет превозноситься над другими, но будет благодарить Бога, то ему дается опять твердое знание, ибо слова духовные, не сопровождаемые честною и целомудренною жизнию, подобны колосьям, поврежденным от ветра, которые хотя имеют вид колосьев, но лишены питательных зерен. Итак, всякое падение – бывает ли оно посредством языка, или зрения, или обоняния, или действования, или посредством всего тела – по мере надменности или самомнения происходит вследствие оставления Богом, Который и этим щадит оставляемых, ибо, если бы, и несмотря на порочную жизнь таких людей, Бог стал свидетельствовать о высоте их ума Своим содействием их учению, они, превозносясь надмением, при всей своей порочности сделались бы демонами.'
        cn: 确实，感染了情欲的灵魂类似于各种泉源：贪食者和酗酒者的灵魂类似于污秽的泉源；贪爱钱财者和贪婪者的灵魂类似于充满了蟾蜍的泉源；骄傲和嫉妒的灵魂，有认知能力的，类似于有蛇居住的泉源，因为他们的理智总是停滞不前，就像沼泽里的腐烂水，因为没有人愿意从那里汲取，原因在于其性情之苦涩和不洁之行径的恶臭。因此大卫向上帝祈求赐予他三样恩赐：良善、教导和知识[35]，因为没有良善，知识是无用的。但如果这样的人得到改正，除去导致上帝离弃他的原因，也就是傲慢，并接受谦卑，认识到自己的局限性，并且不再高抬自己凌驾于他人之上，而是感谢上帝，那么他会再次获得坚实的知识，因为属灵的话语，若不伴随着诚实和贞洁的生活，类似于被风损坏的谷穗，它们虽有谷穗的外形，却缺乏营养的谷粒。因此，每一次堕落——无论是通过舌头、视觉、嗅觉、行为，还是通过整个身体——都随着傲慢或自负的程度而发生，这是因为上帝的离弃，上帝也以此怜恤被离弃的人，因为，假如，即便不顾这样的人败坏的生活，上帝仍然通过协助他们的教导来见证他们心智的崇高，他们就会在所有败坏中，因傲慢而自高自大，成为魔鬼。
    - type: paragraph
      text:
        ru: 'И вот что еще говорили нам эти лучшие из отцов, преподобные мужи: «Когда увидите кого-нибудь по жизни развратного, а по словам увлекательного, вспомните о демоне, который беседовал, как сказано в Евангелии, с Господом, и о свидетельстве Писания, которое говорит:«Змий же бе мудрейший всех зверей сущих на земли»(Быт. 3, 1). Эта мудрость послужила ему более во вред, потому что не была сопутствуема добродетелию». Итак, верному и доброму мужу должно иметь в мыслях только то, что внушает Бог, должно говорить, что мыслит, и делать, что говорит, ибо если истине слова не сопутствует добродетельная жизнь и еще благородный добрый нрав, то это, по слову блаженного Иова, хлеб без соли[36]. Его никак не станут есть, а если кто и съест, то подвергнется большому расстройству в здоровье. «Если, – сказали они, – и станет кто есть хлеб без соли, если и есть вкус в словах пустых, то разве для тех, которые не имеют у себя свидетельства добрых дел».'
        cn: '这些最优秀的教父们，这些敬虔的人们，还曾对我们说：

          「当你们看见有人生活放荡不羁，言语却引人入胜时，你们就当想起那恶魔，如福音书所言，曾与主对话；并想起圣经的见证，它说：『蛇比地上一切的活物更狡猾』（创世记 3:1）。这智慧反而对他造成了更大的伤害，因为它并非伴随着美德。」


          因此，一个忠信良善的人，思想中只应有上帝所启示的，应当言其所思，行其所言；因为如果言语的真理不伴随道德高尚的生活，以及高贵的良善品格，那么，用蒙福的约伯的话来说，这就是无盐之饼[36]。人绝不会吃它；而如果有人吃了，就会对健康造成很大的损害。


          「如果，」他们说，「有人会吃无盐之饼，如果空洞的言语有其滋味，那也只是对那些没有良善行为的见证之人而言了。」'
    - type: paragraph
      text:
        ru: Бог оставляет людей по различным причинам. Иногда сие бывает для того, чтобы обнаружилась сокровенная добродетель, какова, например, добродетель великого подвижника Иова, с которым Бог беседовал и говорил:«Не отвергай суда Моего; мниши ли Мя инако тебе сотворша, разве да явишися правдив?»(Иов 40, 3). «Ты известен Мне от начала, Мне, Который видит сокровенное и проникает во глубину помыслов человеческих. Но поскольку сии добродетели твои были неизвестны людям и злонамеренные подозревали, что ты угождаешь Мне из-за богатства, то Я и навел на тебя такое бедствие – отнял у тебя богатство, чтобы показать им твое благодарное любомудрие». Иногда Бог оставляет человека для того, чтобы отвратить его от гордости и удалить от самомнения или кичливости. Это можно видеть на блаженном апостоле Павле. И он подвергался бедствиям, заушениям и различным лишениям, потому и говорил:«…дадеся ми пакостник плоти, ангел сатанин, да ми пакости деет, да не превозношуся»(2Кор. 12, 7), то есть чтобы состояние безмятежное и благополучное и почесть за толикие чудеса не повергли его в диавольскую гордость, если бы он безопасно покоился. Оставлен был за свои грехи и расслабленный, которому Иисус Христос сказал:«…се здрав еси; ктому не согрешай, да не горше ти что будет»(Ин. 5, 14). Оставлен был и Иуда, который предпочел сребро Слову Жизни, почему и удавился (Деян. 1, 18). Оставлен был и Исав, потому и впал в невоздержность и предпочел грубую пищу благословению отца (Быт. 25, 30–34). Познав все сие Духом Святым, блаженный апостол Павел сказал об оставляемых таким образом:«якоже не искусиша имети Бога в разуме, сего ради предаде их Бог в неискусен ум, творити неподобная»(Рим. 1, 28). А о других, которые думали о себе, что имеют познание о Боге при развращенном сердце и тщеславии, сказал:«Занеже разумевше Бога, не яко Бога прославиша или благодариша, но осуетишася помышлении своими, и омрачися неразумное их сердце; глаголющеся быти мудри, объюродеша», пораженные демоном самомнения и неразумия,«темже и предаде их Бог»в страсти бесчестия,«во еже сквернитися телесем их»(Рим. 1, 21–22, 24). Отсюда должны мы знать, что невозможно впасть в невоздержность тому, кто не оставлен Промыслом Божиим, а оставляются люди Богом и предаются таким бедам за свое собственное нерадение и беспечность.
        cn: 上帝任凭人们，有各种各样的原因。有时，这是为了显明隐藏的美德，例如伟大的苦行者约伯的美德。上帝曾与他对话，并说：「你岂可废弃我的审判？你岂可定我有罪，好显自己为义吗？」（约伯记 40:3）。「你从起初就为我所知，我洞察隐秘，参透人心的深处。但由于你的这些美德不为人知，而心怀恶意的人怀疑你取悦我是为了财富，所以我才使你遭受这样的灾难——夺去你的财富，好向他们显明你感恩的虔诚智慧。」有时，上帝任凭一个人，是为了使他远离骄傲，并消除自负或傲慢。这可以从蒙福的使徒保罗身上看到。他也遭受患难、鞭打和各种匮乏，因此他说：「……有一根刺加在我肉体上，就是撒但的差役，要攻击我，免得我过于自高」（哥林多后书 12:7），也就是说，为免他若安逸无忧，平静和顺遂的境况以及因如此多的神迹所获的尊荣，会使他陷入魔鬼般的骄傲。那瘫痪的人也因自己的罪被任凭，耶稣基督曾对他说：「……你已经痊愈了，不要再犯罪，恐怕你遭遇的更加厉害」（约翰福音 5:14）。犹大也被任凭，他宁愿选择银钱而非生命之道，因此上吊自杀（使徒行传 1:18）。以扫也被任凭，因此他陷入放纵，宁愿选择粗劣的食物而非父亲的祝福（创世记 25:30-34）。蒙圣灵洞悉这一切后，蒙福的使徒保罗论及那些以这种方式被任凭的人说：「他们既然故意不认识神，神就任凭他们存邪僻的心，行那些不合理的事」（罗马书 1:28）。至于另一些人，他们自以为对上帝有所认识，却心怀败坏和虚荣，保罗说：「因为他们虽然知道神，却不当作神荣耀他，也不感谢他。他们的思念变为虚妄，无知的心就昏暗了。自称为聪明，反成了愚拙」，他们被自负和愚昧的邪灵所击打，「所以神任凭他们」陷入羞耻的情欲中，「以致身体彼此玷辱」（罗马书 1:21-22，24）。由此我们应当知道，一个人若非被上帝的护理所任凭，就不可能陷入放纵，而人被上帝任凭，并被交付于这样的困境，是由于他们自己的疏忽和漫不经心。
  - type: heading2
    text:
      ru: О Соломоне
      cn: 关于所罗门
    children:
    - type: paragraph
      text:
        ru: Четыре года прожил я в фиваидском городе Антиное и в это время узнал о всех тамошних монастырях. Около города живет до двадцати тысяч мужей, которые питаются трудами рук своих и весьма ревностно подвизаются в добродетели. Между ними есть и отшельники, заключившие себя в горных пещерах. В числе их есть отшельник Соломон, муж весьма кроткий и воздержный, обладающий даром терпения. Он говорил о себе, что уже пятидесятый год живет в пещере, питаясь трудами рук своих, и изучил все Священное Писание.
        cn: 我在提拜得的安提诺埃城住过四年，在这期间，我了解了那里所有的修道院。城里住着多达两万名修士，他们靠自己双手劳作维生，并且极其热切地修习美德。他们当中也有隐士，把自己封闭在山洞里。其中有一位隐士名叫所罗门，他为人极其温和且有节制，拥有忍耐的恩赐。他提到自己，已经在山洞里居住了五十年，靠自己双手劳作维生，并且研习了全部《圣经》。
  - type: heading2
    text:
      ru: О Дорофее
      cn: 关于多罗泰
    children:
    - type: paragraph
      text:
        ru: 'В другой пещере живет пресвитер Дорофей, муж добрейший. За неукоризненную жизнь он удостоился пресвитерства и священнодействует для братий, живущих в пещерах. Однажды младшая Мелания, внучка Мелании старшей (о которой скажу после), прислала этому бессребренику пятьсот златниц и просила его раздать их тамошним братиям. Но он, взяв три златницы, остальные переслал отшельнику Диоклу, мужу многознательному, сказав: «Брат Диокл умнее меня и с пользою может распорядиться ими, потому что лучше меня знает, кому действительно нужно оказать помощь, а мне довольно и этих».'
        cn: 在另一个洞穴里住着长老多罗菲，为人至善。因其无可指摘的生活，他蒙受了长老职分，并为那些住在洞穴里的弟兄们主持圣事。有一次，小梅拉尼娅，即老梅拉尼娅的孙女（关于她我稍后会提），给这位不爱钱财的人寄去了五百金币，并请求他把它们分发给那里的弟兄们。但是他，只取了三枚金币，把其余的转寄给了隐士迪奥克洛，一位博学多识的人，说：「弟兄迪奥克洛比我更明智，并且能有益地支配这些钱，因为他比我更清楚谁是真正需要帮助的，而这些（三枚金币）对我来说已经足够了。」
  - type: heading2
    text:
      ru: О Диокле
      cn: 关于迪奥克勒斯
    children:
    - type: paragraph
      text:
        ru: 'Этот Диокл начал свое образование грамматикою, потом посвятил себя философии, и наконец благодать привлекла его к любомудрию небесному. На двадцать восьмом году жизни, оставив мирские науки, он предался небесному учению Христову и вот уже тридцать пятый год живет в пещерах. Он говорил нам: «Ум, переставши созерцать Бога мыслию, становится или демоном, или скотом». Когда мы стали расспрашивать, как это бывает, он сказал: «Ум человека, как скоро удаляется от созерцания Бога, по необходимости впадает во власть или демона похоти, который увлекает его к распутству, или злого духа раздражительности, от которого рождаются безумные порывы». Сладострастное вожделение называл он свойством скотским, а порыв раздражительности – демонским. Я возразил ему: «Как возможно, чтобы ум человека непрестанно был с Богом?». «В каждой мысли и в каждом деле, – отвечал он, – участвует душа, но с Богом бывает она только тогда, когда благочестиво и благоговейно размышляет о Нем».'
        cn: 这位迪奥克莱斯起初接受语法学教育，之后投身哲学，最终，恩典将他吸引至属天的智慧。在他生命的第二十八年，他舍弃了世俗学问，投身于基督属天的教导，如今已是他在洞穴中生活的第三十五个年头。他对我们说：「心智，一旦停止以思想默观上帝，就会变成魔鬼，或禽兽。」当我们开始追问这种情况是如何发生时，他说：「人的心智，一旦偏离了对上帝的默观，就必然会落入或情欲的魔鬼——这魔鬼引诱他走向放荡；或愤怒的恶灵——由此产生疯狂的冲动。」他称肉欲的贪恋为禽兽的本性，而愤怒的冲动则为魔鬼的特性。我反驳他道：「人的心智怎可能持续不断地与上帝同在呢？」他回答道：「在每个思想和每件事上，灵魂都参与其中，但它唯有在虔敬而恭敬地思念上帝时，才与上帝同在。」
  - type: heading2
    text:
      ru: О Капитоне
      cn: 关于卡皮同
    children:
    - type: paragraph
      text:
        ru: Недалеко от этого доблестнейшего подвижника жил некто Капитон, из разбойников сделавшийся опытнейшим монахом. Он пятьдесят лет прожил в пещерах за четыре мили от города Антинои и не выходил из своей пещеры даже к реке Нилу, говоря, что еще не может встречаться с людьми, потому что доныне противодействует ему противник.
        cn: 不远处，住着这位最英勇的苦修者。他名叫卡皮同，曾是强盗，后来成为了一位经验最丰富的修士。他在安提诺伊城四英里外的洞穴中住了五十年，甚至不走出他的洞穴前往尼罗河，他说他仍然不能与人见面，因为至今仍有仇敌与他作对。
  - type: heading2
    text:
      ru: О тщеславном отшельнике
      cn: 关于虚荣的隐修士
    children:
    - type: paragraph
      text:
        ru: Близ этих мужей видели мы и другого отшельника, жившего также в пещерах. В сновидениях будучи обольщаем мечтами тщеславия, он и сам обольщал тех, которые приходили к нему и обманывались, и стал, по Писанию,«муж неразумив, емляйся за стень и гоняй ветры, и емляй веру сном»(Сир. 34, 2). Хотя по телу сохранил он целомудрие, конечно и по причине старости и времени, а может быть, и по тщеславию, но мудрость добродетели погубил, развратившись постыдным тщеславием и отпав чрез оное от благочестивой жизни.
        cn: 我们在这些修士附近，曾看见另一位隐士，他也住在洞穴里。在梦中被虚荣的幻想所迷惑，他自己也迷惑那些来找他并受骗的人，并按照圣经所说，成了「不明事理的人，抓住影子，追逐风，并相信梦境」（德训篇 34:2）。尽管他在身体上保持了贞洁，这当然也因为年迈和时光流逝，也许还是出于虚荣，但他却失去了美德的智慧，被可耻的虚荣败坏，并因此脱离了虔敬的生活。
  - type: heading2
    text:
      ru: О Ефреме
      cn: 关于以法莲
    children:
    - type: paragraph
      text:
        ru: Ты, конечно, слыхал о делах Ефрема, диакона Эдесской Церкви. Он достоин, чтобы помнили о нем благочестивые рабы Христовы. Достойно совершив путь Святаго Духа и нисколько не уклонившись от стези правой, он удостоился дара естественного знания, за которым следует богословие и, наконец, блаженство. Постоянно вел он жизнь весьма уединенную и довольно много лет назидал приходивших к нему, а наконец вышел из келии по следующей причине.
        cn: 你一定听过埃德萨教会的执事埃弗拉姆的事迹。他配得虔诚的基督仆人纪念。他配得地走完了圣灵的道路，丝毫没有偏离正道，因此蒙受了自然知识的恩赐，其后是神学，最后则是福乐。他一直过着极其隐居的生活，并在相当多年间教导那些来找他的人，最终因为以下原因离开了他的修道室。
    - type: paragraph
      text:
        ru: 'Когда настал сильный голод в городе Эдессе, этот божественный муж, сжалившись над поселянами, погибавшими от голода, пошел к богатым гражданам и сказал им: «Отчего вы не имеете сострадания к погибающим людям и гноите свое богатство к осуждению душ ваших?». Они, придумавши будто благовидную отговорку, сказали святому: «У нас некому поверить раздачу хлеба голодным, потому что все занимаются торговлею». Добродетельный Ефрем говорит им: «Как вы думаете обо мне? За кого меня почитаете?». «Мы считаем тебя человеком Божиим. (Это действительная правда; все не притворно, а истинно питали к нему великое уважение.) «Если вы так думаете обо мне, – сказал им раб Христов, – вверьте мне попечение об алчущих». Тщеславные богачи сказали ему: «О, если бы ты удостоил!». Ефрем, избранник Божий, отвечал им: «Вот, отныне поставляюсь я вами в попечителя о бедных» – и, взяв у них сребро, устроил домы с разными отделениями, поставил в них до трехсот кроватей, заботился о больных и кормил голодных, умиравших погребал, а в которых была еще надежда на жизнь, за теми ухаживал и питал их. Одним словом, всем, которые прибегали к нему от голода, он каждодневно давал пристанище и продовольствие из того, что ему доставляли.'
        cn: 当严重的饥荒降临埃德萨城时，这位神圣的男子怜悯那些因饥饿而濒死的农民，走到富有的市民面前对他们说：「你们为何对这些濒死的人们没有怜悯之心，却让你们的财富腐朽，以致你们的灵魂受审判呢？」 他们想出了一个看似合理的借口，对圣人说：「我们没有人可以信任来分发面包给饥饿的人，因为所有人都忙于经商。」 道德高尚的厄弗冷对他们说：「你们对我有什么看法？你们认为我是谁？」 「我们认为你是属神的人。(这是确实的真理；所有人并非假装，而是真诚地对他怀有极大的尊敬。) 「如果你们这样看待我，」——基督的仆人对他们说——「请把照顾饥饿者的事托付给我吧。」 虚荣的富人对他说：「啊，要是你肯屈尊就好了！」 厄弗冷，上帝的拣选者，回答他们说：「看哪，从今以后，我被你们设立为穷人的照管者」——并从他们那里拿了银子，建造了有不同隔间的房屋，在其中安置了多达三百张床，照料病人，喂养饥饿的人，埋葬那些死去的人，而对那些仍有生存希望的人，则照顾并喂养他们。简而言之，对于所有因饥饿而投奔他的人，他每天都从人们供给他的物资中，提供住所和食物。
    - type: paragraph
      text:
        ru: По прошествии года, когда последовало плодородие и все пошли по своим домам, этот достославный муж, не имея уже дела для себя, опять возвратился в свою келию и через месяц умер, наследовав блаженную землю кротких. Сверх других его подвигов Бог напоследок доставил ему и это служение для получения славнейших венцов за кротость нрава. Сей знаменитейший муж оставил после себя и сочинения, из которых очень многие достойны изучения и свидетельствуют о великой его добродетели.
        cn: 一年过后，待丰产之后，众人都回家了，这位尊贵的男子，自身已无事可做，便再次回到自己的隐修室，一个月后便安息了，继承了温柔者所承受的福地。除了他其他的苦修功绩外，上帝最终也赐予了他这项事奉，为他性情的温柔而获得至为荣耀的冠冕。这位最著名的男子也留下了著述，其中有许多都值得研读，并见证了他伟大的美德。
  - type: heading2
    text:
      ru: О Юлиане
      cn: 关于尤利安
    children:
    - type: paragraph
      text:
        ru: Слышал я о некоем Юлиане, жившем в стране Эдесской, величайшем подвижнике. Он до крайности измождал плоть свою, носил только кости и кожу и в последние дни жизни удостоился дара целений.
        cn: 我听说有一位名叫尤利安的人，他住在厄德萨地区，是一位极大的苦行者。他将自己的肉身消磨至极，瘦得只剩下骨头和皮，并且在他生命的最后时日，蒙受了医治的恩赐。
  - type: heading2
    text:
      ru: Об Иннокентии
      cn: 关于因诺肯蒂
    children:
    - type: paragraph
      text:
        ru: О делах блаженного Иннокентия, пресвитера Елеонского, ты, верно, слышал от многих великих мужей, тем не менее, однако, узнаешь и от нас, смиренных, живших с ним три года, ибо добродетели этого мужа, сокрытые от тех, известны стали нам. Впрочем, о добродетелях его нелегко рассказать одному или двоим и даже десяти человекам. Сей отличнейший подвижник был до чрезвычайности прост, принадлежал к числу славных мужей при дворе царя Константина, отрекся от мира и оставил брачную жизнь, хотя имел уже и сына по имени Павел, служившего в войске царских телохранителей.
        cn: 关于蒙福的因诺肯提，这位橄榄山司祭的生平事迹，你 想必从许多伟大的人物那里听说过。然而，我们这些卑微之人，曾与他共同生活了三年，你仍将从我们这里了解一些，因为此人的美德，对那些人而言是隐藏的，却为我们所知。然而，他的美德并非仅凭一两个人，甚至十个人就能轻易述说。这位卓越的苦修者极其简朴，曾是君士坦丁皇帝宫廷中显赫人物之一，他舍弃了世俗，并放弃了婚姻生活，尽管他已经有一个儿子名叫保罗，在皇帝的禁卫军中服役。
    - type: paragraph
      text:
        ru: Будучи чрезвычайно незлобивого и простого нрава, он удостоился дара изгонять бесов. Так, однажды привели к нему при нас юношу, одержимого духом и расслабленного. Когда я увидел его, то никак не думал, чтобы можно было исцелить его, и хотел уже удалить оттуда мать бесноватого вместе с теми, которыми он был приведен. Случилось, что старец подошел к бесноватому в то время, как мы смотрели на его несносное мучение. Увидев бесноватого и с ним мать его, которая плакала и рыдала о невыразимом несчастии сына своего, добрый старец прослезился и, сжалившись над ними, взял юношу и вошел в свою молитвенницу, им самим построенную, в которой хранились части мощей святого Иоанна Крестителя. Помолившись над юношею от третьего часа до девятого, он изгнал из него демона, исцелил его от расслабления и отдал матери здоровым. Расслабление мальчика было таково, что, когда он плевал, слюна падала на его спину – до того был он искривлен! И этот несчастный молитвою праведника так скоро получил исцеление!
        cn: 他因其极其不怀恶意和纯朴的性情，蒙受了驱逐魔鬼的恩赐。于是，有一次，有人当着我们的面把一个被鬼附身且瘫痪的少年带到他那里。当我看到他时，我丝毫没有想过他能被治愈，并且已想要将那被鬼附者的母亲连同那些带来他的人一起遣离那里。恰巧，当我们看着他难以忍受的折磨时，这位长者走近了那被鬼附的人。看到那被鬼附的少年以及他身边的母亲，她正为儿子的无法言喻的不幸哭泣哀号，这位慈祥的长者流下了眼泪，并怜悯他们，他带着少年进入了自己建造的祷告室，那里存放着施洗者约翰的圣髑碎片。从第三时辰到第九时辰，他为这少年祷告，将魔鬼从他身上驱逐出去，治愈了他的瘫痪，并将健康的少年交还给他的母亲。这男孩的瘫痪程度如此严重，以至于当他吐口水时，唾沫会落到他的背上——他身体弯曲到了这个程度！而这个不幸的人竟借着义人的祷告如此迅速地得到了治愈！
    - type: paragraph
      text:
        ru: 'Одна старуха в окрестностях Лазария пасла овец и потеряла одну из них: ее похитили тамошние юноши. В слезах пришла старуха к этому Божию человеку. «Покажи мне, – сказал он ей, – место, где ты потеряла ее». Она пошла к Лазарию. Великий последовал за нею. Пришедши на место, он стал молиться. Между тем укравшие овцу убили ее и мясо спрятали в винограднике. В то время как преподобный совершал молитву, а из виновных никто не сознавался, по действию благодати откуда-то прилетел ворон и, сев над покражею, схватил один кусок мяса и улетел опять. Приметив это, блаженный подошел к тому месту и нашел мясо и воров. Тогда похитившие овцу юноши припали к ногам его, сознались в своей вине и заплатили за овцу, чего она стоила. Таким образом они были вразумлены вперед не делать того же.'
        cn: 一个老妇人在拉扎里亚附近牧羊，丢失了其中一只羊：它被那里的年轻人偷走了。老妇人流着泪来到这位属神的人面前。「指给我看你丢羊的地方，」他对她说。她去了拉扎里亚。那位伟人跟着她。到了地方，他开始祈祷。与此同时，偷羊的人已经杀了它，并把肉藏在葡萄园里。当这位可敬者正在祈祷，而那些有罪的人无人承认之时，在恩典的作为下，不知从哪里飞来一只乌鸦，落在赃物上方，抓住一块肉又飞走了。留意到这一点后，这位蒙福者走到那地方，找到了肉和那些小偷。于是，偷羊的年轻人俯伏在他脚下，承认了自己的过错，并按照羊的价值赔偿了钱。如此一来，他们得到了警示，以后不再做同样的事。
  - type: heading2
    text:
      ru: Об Адолии
      cn: 关于阿多利奥斯
    children:
    - type: paragraph
      text:
        ru: 'Узнал я в Иерусалиме еще одного мужа, именем Адолий, родом тарсянина. Прибыв в Иерусалим, он пошел путем добродетели непроложенным – не тем, по которому шли мы, люди обыкновенные, но каким-то странным и новым, который сам он проложил себе и на котором подвизался выше сил человеческих, так что и самые злые демоны трепетали строгости его превосходной жизни и не смели приближаться к нему. По чрезмерному воздержанию и бодрствованию он казался как бы призраком, потому что во всю Четыредесятницу ел через пять дней, и то умеренно, а в прочее время – в третий день. Особенно велико и удивительно в его добродетели следующее: с вечера даже до утреннего часа, когда братия опять собирались в молитвенных храмах, этот постник и подвижник стоял на Елеоне, на холме Вознесения, откуда вознесся Иисус, – стоял, пел псалмы и молился. И это делал он во всякое время; снег ли шел, или дождь, или град, он оставался неподвижным. Выполнивши обычное молитвенное правило, он будильным молотком стучал по всем келиям и созывал братию в молитвенные дома на утреннее славословие, в каждой келии пел вместе с ними по одному или по два антифона и, помолившись таким образом, отходил в свою келию пред рассветом. Я сам верно знаю, что часто, когда братия раздевали его во время зноя и выжимали одежды его, пот с них тек, как будто они были мыты в воде; потом надевали на него другую одежду, пока та просохнет. Отдохнув до третьего часа, остальные часы до самого вечера он проводил опять в псалмопении и молитвах. Такова добродетель высокого терпения Адолия, твердого камня, который родом был тарсянин. Усовершившись до конца подвигами терпения, он почил вечным сном и погребен в Иерусалиме.'
        cn: 我还在耶路撒冷认识了另一位名叫阿多利的人，他是一个塔尔苏斯人。抵达耶路撒冷后，他走上了一条未曾有人走过的美德之路——不是我们这些普通人所走的路，而是一条奇特而崭新的路，是他自己为自己开辟的，他在这条路上苦修，超乎人力的极限，以至于最邪恶的魔鬼也因他卓越生活的严谨而颤抖，不敢靠近他。由于过度的节制和警醒，他仿佛一个幽灵，因为在整个四旬期，他每五天才进食一次，而且也只是适量，而在其余时间，则是每三天进食一次。他美德中尤其伟大和令人惊叹之处如下：从傍晚直到清晨，当弟兄们再次聚集在祷告堂时，这位禁食者和苦修者就站在橄榄山上，也就是耶稣升天的升天山上——他站在那里，唱着诗篇并祷告。他无论何时都如此行；无论是下雪、下雨还是下冰雹，他都纹丝不动。完成常规祷告规程后，他会用唤醒槌敲遍所有修士居室，召集弟兄们到祷告堂参加晨颂，他在每个修士居室都与他们一起唱一到两首对唱圣歌，然后如此祷告完毕后，在黎明前回到自己的修士居室。我本人确切地知道，常常在酷热之时，当弟兄们帮他脱下衣服并拧干时，汗水从衣服上淌下，仿佛它们是用清水洗过的一般；然后他们会给他换上另一件衣服，直到那件湿衣服晾干。休息直到第三时辰后，他将剩余的时间直到傍晚再次用于唱诗和祷告。这就是阿多利——那位出身塔尔苏斯人的坚固磐石——崇高忍耐的美德。他以忍耐的苦修臻至圆满，安息于永恒的沉睡，并被安葬在耶路撒冷。
  - type: heading2
    text:
      ru: Об Авраамии
      cn: 关于亚伯拉罕
    children:
    - type: paragraph
      text:
        ru: 'Некто Авраамий, родом египтянин, рачительный монах, вел в пустыне жизнь весьма суровую и строгую, но ум его поражен был крайним самомнением. Пришедши в церковь, он вступил в спор с пресвитерами и говорил: «Я сам рукоположен в нынешнюю ночь в пресвитера Самим Иисусом Христом, и вы должны принять меня как пресвитера, готового священнодействовать». Святые отцы вывели его из пустыни и, заставив вести иную, более простую жизнь, исцелили его от гордости. Приведши Авраамия в сознание собственной немощи, они доказали, что сей пустынник обольщен был демоном гордости, и святыми своими молитвами восстановили его в прежнюю добродетельную жизнь.'
        cn: 某位埃及裔的亚伯拉米是一位勤勉的修士，他在旷野中过着极其严峻而刻苦的生活，但他的心智却被极度的自负所侵袭。当他来到教会时，他与众长老争辩起来，并说：「我本人在今夜由耶稣基督亲自按立为长老，你们必须接纳我，将我视为一位随时准备好施行圣礼的长老。」 圣教父们将他带出旷野，并让他过上另一种更简朴的生活，从而治愈了他的骄傲。在使亚伯拉米意识到自己的软弱后，他们证明这位隐士是被骄傲的魔鬼所诱惑的，并以他们神圣的祈祷使他恢复了以往的德行生活。
  - type: heading2
    text:
      ru: Об Элпидии
      cn: 关于埃尔皮迪娅
    children:
    - type: paragraph
      text:
        ru: 'Знал я и другого достопамятного мужа в пещерах Иерихонских, еще древле высеченных аморреями[37], которые бежали и укрылись в них (именно в горе Лука) от Иисуса Навина, осадившего город. Этот муж, именем Элпидий, родом каппадокиец, впоследствии удостоился пресвитерства в тамошней обители и был рукоположен от Каппадокийского хорепископа[38]Тимофея, мужа достойнейшего. Пришедши, он поселился в одной из пещер и показал такие подвиги воздержания, что превзошел всех. В продолжение двадцати пяти лет он принимал пищу только по субботам и воскресеньям, а ночи все стоял и пел. Как матка пчелиная, он жил среди братии и эту гору населил, как город. У каждого там можно было видеть различные роды подвижничества. Этого Элпидия – надежного, который действительно услаждался надеждою и ради Христа терпел скорби, во время ночного псалмопения, когда вместе с ним пели и мы, ужалил скорпион. Толкнув его ногою, он даже и не переменил своего положения и сим терпением подавил боль, причиненную скорпионом. Еще: однажды некий брат держал в руках ветвь винограда. Блаженный, сидя тогда на краю горы, взял ее и воткнул в землю, как бы сажая, хотя это было и не вовремя. Ветвь принялась, и вырос такой виноград, что закрывал всю церковь.'
        cn: 我也认识另一位可敬的男子，他在耶利哥的洞穴里。那些洞穴是古时亚摩利人[37]凿出来的，他们从围攻该城的约书亚（Иисус Навин）手下逃脱，躲藏在这些洞穴里（确切地说，是在路加山）。这位名叫厄尔皮迪乌斯（Элпидий）的男子，籍贯卡帕多基亚人，后来在该修道院被授予司铎职，并由卡帕多基亚的地区主教[38]提摩太（Тимофея）——一位极其可敬的男子——祝圣。他来了之后，就住在一个洞穴里，并且展示了如此的苦修，以至于超越了所有人。在二十五年里，他只在周六和周日进食，而所有的夜晚都站着歌唱。他像蜂王一样，生活在弟兄们中间，并使这座山如同城市一般，住满了人。在那里，每个人身上都能看到各种形式的苦修。这位可靠的厄尔皮迪乌斯——他确实因盼望而喜乐，并为基督忍受患难——在夜晚的圣咏吟唱时，当时我们也和他一起歌唱，被一只蝎子蜇了。他用脚踢了它一下，甚至都没有改变自己的姿势，并且以这种忍耐抑制了蝎子造成的疼痛。还有一次：一位弟兄手里拿着一根葡萄枝。当时这位蒙福的人坐在山边，拿起它，像栽种一样插进了土里，尽管当时并不是合适的季节。那枝条生根了，并且长出了一棵葡萄树，枝叶茂盛到遮蔽了整座教堂。
  - type: heading2
    text:
      ru: Об Энезии
      cn: 关于埃涅齐
    children:
    - type: paragraph
      text:
        ru: Вместе с сим святым подвижником Христовым подвизался и знаменитый раб Божий Энезий, муж достохвальный, изумлявший своими подвигами.
        cn: 与这位基督的圣洁苦修者一同修行的，还有著名的上帝的仆人埃涅西奥斯，他是一位值得称赞的人，其苦修的功绩令人惊叹。
  - type: heading2
    text:
      ru: О Евстафии
      cn: 论欧大西亚
    children:
    - type: paragraph
      text:
        ru: И равночестный ему брат его Евстафий усердно проходил скорбную жизнь во Христе. А блаженный Элпидий, измождая тело, достиг такого бесстрастия, что весь состав костей его был виден. Ревностные ученики его, между рассказами о его добродетелях, передают и то, что он во все двадцать пять лет никогда не обращался на запад и, хотя дверь его пещеры была на высоте горы, после шестого часа никогда не видал солнца, которое тогда было над его головою и склонялось к западу; никогда также во все двадцать пять лет не видал он и звезд, которые восходили на западе. Сей великий подвижник терпения с того времени, как вошел в пещеру, не сходил с горы до самой смерти. Вот необыкновенные деяния венчанного и непобедимого борца Элпидия, теперь обитающего в раю с подобными ему.
        cn: 他那同样受人敬重的兄弟欧斯塔菲奥斯，在基督里恳切地度过着劳苦的人生。而蒙福的埃尔庇狄奥斯，通过刻苦己身，达到了如此的无情欲境地，以至于他全身的骨架都清晰可见。他热心的门徒们，在讲述他的美德时，也转述说，他在整整二十五年里从未面向西方；而且，尽管他洞穴的门位于高山之上，在第六时辰之后，他从未见过太阳，那时太阳正在他头顶并渐渐西斜；同样，在这二十五年里，他也从未见过那些从西方升起的星星。这位伟大的忍耐苦修者，自从他进入洞穴以来，直到他去世，都未曾下山。这些就是被加冕且不可战胜的斗士埃尔庇狄奥斯的非凡事迹，他如今正与像他一样的人一同居住在天堂里。
  - type: heading2
    text:
      ru: О Сисинии
      cn: 关于西西尼乌斯
    children:
    - type: paragraph
      text:
        ru: У сего бессмертного Элпидия был ученик по имени Сисиний, происходивший из рабского состояния, но свободный по вере, родом каппадокиянин. (Надобно означать род святых во славу облагораживающего нас Христа и приводящего нас к блаженному и истинному благородству – к Царствию Небесному.) Пламенно любя добродетели подвижнические, Сисиний пробыл у блаженного Элпидия годов шесть или семь и, изучив добродетели сего мужа и твердость в трудах подвижнических, напоследок заключился в гробнице. Три года стоял он в гробнице, проводя время в молитвах; ни днем ни ночью не садился, не прилегал, не выходил вон. Он удостоился дара изгонять демонов, а теперь, возвратившись в отечество, удостоен пресвитерства, после того как составил братство из мужей и жен, причем дал свидетельство бесстрастия устроением целомудренной жизни, ибо и собственную мужескую похоть изгнал, и женское вожделение укротил воздержанием, так что исполнилось Писание:«…во Христе Иисусе ...несть мужеский пол, ни женский»(Гал. 3, 28). В обличение скупых богачей он был чрезвычайно странноприимен, хотя и не имел собственности.
        cn: 这位不朽的埃尔皮迪乌斯有一位名叫西西尼乌斯的门徒，他出身于奴隶阶层，但在信仰上是自由的，籍贯卡帕多基亚。(有必要指出圣徒的出身，为要荣耀那使我们高贵的基督，并引导我们进入蒙福且真实的尊贵——进入天国。) 西西尼乌斯热切地爱慕苦修的德行，他在蒙福的埃尔皮迪乌斯那里待了六七年，并学习了这位圣者的德行以及在苦修劳作中的坚定，最终将自己关进了一座坟墓里。他在坟墓里站立了三年，将时间用于祷告；不论昼夜都不曾坐下，不曾躺卧，不曾走出。他蒙受了驱逐邪魔的恩赐，而现在，回到故乡后，他被授予了长老职分，在此之前他建立了一个由男女组成的兄弟会，并且通过过贞洁的生活证明了其无情欲的状态，因为他不仅驱逐了自身的男性肉欲，也通过节制驯服了女性的欲望，以至于应验了圣经的话语：「……在基督耶稣里……没有男性，也没有女性。」(加拉太书 3:28) 为了谴责吝啬的富人，他非常乐于接待客旅，尽管他一无所有。
  - type: heading2
    text:
      ru: О Гаддане
      cn: 关于加丹
    children:
    - type: paragraph
      text:
        ru: 'Знал я одного палестинского старца, именем Гаддан. Он жил в окрестностях Иордана и всю жизнь свою провел без кровли. Иудеи, жившие около Мертвого моря, позавидовав сему блаженному пустыннику, однажды напали на него с обнаженным мечом. Но тут случилось чудо: когда иудеи подняли меч и хотели убить Гаддана, рука державшего меч иссохла, и меч нечувствительно выпал у него. Такая-то помощь Божия содействовала святому Гаддану, и такова была добродетель блаженного мужа до самой его смерти.'
        cn: 我认识一位巴勒斯坦长老，名叫加丹。他住在约旦河附近，终身露宿。住在死海附近的犹太人，嫉妒这位蒙福的隐修士，有一天手持出鞘的剑袭击了他。但这时发生了一个奇迹：当犹太人举起剑想要杀害加丹时，持剑者的手枯萎了，剑不知不觉地从他手中掉了下来。上帝这种帮助佑助了圣徒加丹，这位蒙福者的美德也一直延续到他离世。
  - type: heading2
    text:
      ru: Об Илии
      cn: 关于以利亚
    children:
    - type: paragraph
      text:
        ru: 'Еще был весьма знаменитый монах, именем Илия, который жил в тех же местах в пещере, вел жизнь весьма добродетельную и благочестивую, постоянно упражнялся в воздержании и молитве и радушно принимал у себя всех приходящих. Когда в один день пришло к нему много братий (им надлежало проходить мимо него), у него недостало хлебов, и он с клятвою уверял нас: «Едва не потерял я духа от недостатка пищи, и вот, вошедши в келию в сильной печали о том, как исполнить долг любви к пришедшим ко мне, я нашел три больших свежих хлеба, которые взяв, я с радостию предложил им. Двадцать мужей ели досыта, и еще остался один хлеб; этот хлеб взял я и употреблял в течение двадцати пяти дней». Такая благодать была со странноприимным Илиею, которому уготованы награды за труды у человеколюбивого Владыки!'
        cn: 另外还有一位非常著名的修士，名叫伊利亚，他住在同一个地方的山洞里，过着非常美德且虔敬的生活，持续地操练节制和祷告，并热情地接待所有来访者。有一天，许多弟兄来到他那里（他们本应从他那里经过），他没有足够的面包，他便起誓向我们保证：「我几乎因食物不足而丧失了勇气，看哪，当我带着极大的忧伤进入我的小室，想着如何履行我对来访者之爱的义务时，我找到了三个又大又新鲜的面包，拿起它们，我便欣喜地呈献给他们。二十个人吃得饱足，并且还剩下一个面包；我拿起这个面包，吃了二十五天。」这样大的恩典临到了好客的伊利亚，为他的劳苦预备了奖赏，在爱人的主那里！
  - type: heading2
    text:
      ru: О Савватии
      cn: 关于萨瓦提
    children:
    - type: paragraph
      text:
        ru: Мирянин по имени Савватий, родом из Иерихона, имевший жену, по страху Божию столько любил монахов, что по ночам обходил келии и всю пустыню и у каждой обители тайно полагал по одной мере фиников и достаточное количество овощей, потому что подвижники иорданские хлеба не ели. Однажды, когда сей любитель монахов, приготовлявший трапезы для воздержников, нес святым потребное для их подвижнической жизни, с ним встретился лев. Лукавый враг монахов из зависти возбудил неукротимого зверя против их служителя, чтобы первых лишить продовольствия, а последнего не допустить до его цели. Зверь, выскочив на него из-за памятника, поставленного над одним из монахов, ударил его лапою и поверг на землю. Но Научивший при Данииле поститься львов и сему льву, хотя он и сильно алкал, воспретил пожрать любителя заповедей. Итак, лев схватил осла старцева и удалился. Тот, Кто даровал Савватию жизнь, вместе утолил и голод зверя.
        cn: '一位名叫萨瓦提的平信徒，来自耶利哥，有妻子。他因敬畏上帝，如此深爱修士们，以至于他夜间巡行小室和整个旷野，并在每个修院旁秘密地放下了一份枣子和足够数量的蔬菜，因为约旦的苦行者是不吃面包的。


          有一次，当这位爱修士的人，为禁食者预备食物，给圣人们带去他们苦行生活所需之物时，一只狮子与他相遇了。狡猾的修士之敌出于嫉妒，煽动了这头凶猛的野兽来攻击他们的仆人，以便使前者（修士们）失去补给，而使后者（仆人）无法达到其目的。这野兽从一个为某位修士所立的纪念碑后面跳出来攻击他，用爪子击打他，并把他打倒在地。然而，那位在但以理面前教导狮子禁食的（上帝），也禁止这头狮子吞噬这位爱诫命的人，尽管它非常饥饿。于是，狮子抓住了这位长者的驴子，并离开了。那位赐予萨瓦提生命的主，同时也平息了野兽的饥饿。'
  - type: heading2
    text:
      ru: О Филороме[39]
      cn: 关于 菲洛罗莫斯[39]
    children:
    - type: paragraph
      text:
        ru: В Галатии мы встретились и долгое время жили с боголюбезнейшим пресвитером Филоромом, величайшим и терпеливейшим подвижником. Он родился от матери-рабы и отца свободного. В своей жизни христианской он показал такое совершенство добродетели, что и самые непобедимые в своем роде подвижники уважали его равноангельскую жизнь и добродетельное подвижничество. Сей доблестный подвижник Христов Филором отрекся от мира во дни нечестивого царя Юлиана и дерзновенно говорил с этим нечестивцем. Юлиан приказал своим прислужникам обрить его и жестоко бить. Он великодушно вытерпел это мучение и даже поблагодарил царя, как сам рассказал нам. Вначале сей доблестный муж, по его словам, испытал нападение от блуда и чревоугодия, но он изгнал эти мучительные страсти. Как бы сильный пожар многою водою, погасил он страсти строгим воздержанием, ношением вериг, затворничеством, воздержанием от пищи и пшеничного хлеба и вообще от всего вареного. Так подвизался он восемнадцать лет. Победив беспорядочные страсти, он воспел победную песнь Христу:«Вознесу Тя, Господи, яко подъял мя еси и не возвеселил еси врагов моих о мне»(Пс. 29, 2). Подвергаясь различным нападениям злых духов, он пробыл в одном монастыре сорок лет.
        cn: 在加拉太，我们遇到并长期与蒙神最爱戴的长老菲洛罗姆一同生活，他是一位最伟大的、最富忍耐的苦行者。他出生时母亲是奴隶，父亲是自由人。在他的基督徒生活中，他展现了如此完美的德行，以至于连同类中最坚韧不拔的苦行者都尊敬他那如同天使般的生活和有德行的苦修。这位基督英勇的苦行者菲洛罗姆，在邪恶的皇帝尤利安执政时期弃绝了世界，并勇敢地向这位邪恶之人进言。尤利安命令他的侍从剃光他的头发并残酷地鞭打他。他慷慨地忍受了这苦难，甚至感谢了皇帝，正如他自己告诉我们的那样。起初，这位英勇的人，据他所说，遭受了淫欲和贪食的攻击，但他驱逐了这些折磨人的情欲。如同以大量的水扑灭熊熊大火，他通过严格的节制、穿戴锁链、隐修、禁食和禁绝麦饼，以及完全禁绝一切煮熟的食物，熄灭了情欲。他如此苦修了十八年。战胜了无序的情欲后，他向基督唱起了得胜之歌：「上主啊，我要尊崇祢，因为祢曾提拔我，不让我的仇敌向我夸耀。」(诗篇 29:2)。遭受着邪恶之灵的各种攻击，他在一座修道院里度过了四十年。
    - type: paragraph
      text:
        ru: 'Филором сказывал, что в тридцать два года он не съел ни одного плода. «А когда, – говорит он, – одолела меня однажды чрезмерная робость, так что даже и днем мне стало страшно, я, чтобы избавиться от этого страха, заключился на шесть лет в гробницу». Таким образом он освободился от страха и терпеливо выдержал брань с духом, причинявшим ему такую робость. Об этом славном муже имел особенное попечение блаженный архиепископ Василий, который с утешением смотрел на строгость его жизни, постоянство и трудолюбие. Филором даже и теперь, когда ему уже восемьдесят лет, не оставляет трости и писчей бумаги. Этот блаженный сказывал, что с тех пор, как он был просвещен и возрожден водою и Духом, до сего дня ни у кого не ел даром чужого хлеба, но питался от своих трудов, и пред Богом говорил нам, что двести пятьдесят златниц, выработанных трудами, раздал он увечным и никогда никого не обижал. Он ходил и в Рим, чтобы помолиться в священном храме блаженных и святых апостолов Христовых Петра и Павла; ходил и в Александрию помолиться в храме честного подвижника Марка. «Я удостоился, – говорил он, – по обету, дважды сходить пешком на поклонение святым местам в Иерусалим, и сам приобретал себе на расходы». Говорил нам еще для нашей пользы: «Не помню, чтобы когда умом моим отступал я от Бога моего». Таковы подвиги блаженного Филорома и такова его непобедимая победа! В награду за блаженные труды наконец воздан ему неувядаемый венец славы.'
        cn: 菲洛罗姆讲述，他三十二年没有吃过一个果子。「有一次，」他说，「当极度的怯懦将我压倒，甚至白昼我也感到恐惧时，为了摆脱这种恐惧，我将自己幽禁在墓穴中六年。」这样，他摆脱了恐惧，并耐心忍受了与那个使他如此怯懦的灵的争战。蒙福的大主教瓦西里特别关怀这位光荣的人，他欣慰地看着他生活的严谨、坚韧和勤劳。菲洛罗姆甚至现在，当他已经八十岁时，仍不放下他的手杖和书写纸。这位蒙福者讲述，自从他被水和圣灵光照和重生以来，直到今日，他从未白吃别人的面包，而是靠自己的劳作维生；并且他在上帝面前告诉我们，他将劳作所得的两百五十个金币分给了残疾人，并且从未冒犯过任何人。他曾去罗马，在蒙福的基督圣使徒彼得和保罗的神圣殿宇中祈祷；他也曾去亚历山大，在可敬的苦修者马尔克的殿宇中祈祷。「我曾蒙允，」他说，「按着誓愿，两次步行去耶路撒冷朝拜圣地，并且我自行筹措了旅费。」他还为了我们的益处告诉我们：「我不记得我的心智何时曾背离我的上帝。」这就是蒙福者菲洛罗姆的苦修功绩，这就是他不可战胜的胜利！作为他蒙福劳作的奖赏，他最终被赐予了永不朽坏的荣耀冠冕。
  - type: heading2
    text:
      ru: О Севериане
      cn: 关于塞维里安
    children:
    - type: paragraph
      text:
        ru: 'В Анкире Галатийской, в самом городе, я встретился с одним знатным сановником, Северианом, и женою его Воспориею и коротко познакомился с ними. Они были столько исполнены добрых надежд, что, точно видя будущее, и о детях не заботились. Доходы с поместий они тратили на бедных, несмотря на то что у них было четыре сына и две дочери, которым они не дали никакого имущества, исключая тех, кои вступили в замужество. Остальным своим детям они говорили: «После смерти нашей все будет ваше, а пока мы живы, будем собирать плоды своих стяжаний и делиться ими с церквами, монастырями, странноприимницами и со всеми нуждающимися; их молитвы и вам, дети, и нам доставят, вместо сей временной и многотрудной, вечную жизнь». И вот еще какая была в них добродетель. Когда настал сильный голод и все люди страдали от него своими утробами, тогда они всех тамошних еретиков обратили к православию тем, что во многих поместьях своих отворили житницы и отдали запасы свои на пропитание бедным. Такое необыкновенное их человеколюбие привело еретиков в согласие с правою верою, и они прославили Бога за простоту веры и чрезмерную благотворительность сих супругов.'
        cn: '在加拉太的安基拉城中，我遇到了一位显赫的达官贵人，塞韦里安，以及他的妻子沃斯波里亚，并与他们略作相识。他们内心充满如此美好的盼望，以至于，仿佛能预见未来一般，竟不为自己的儿女担忧。他们把庄园的收入都用在穷人身上，尽管他们有四个儿子和两个女儿，他们却没有给这些孩子留下任何财产，除了那些已经结婚的孩子。他们对其余的孩子说：「我们死后，一切都将是你们的，但只要我们还活着，我们就会把我们所得的果实收集起来，并与教会、修道院、招待所和所有有需要的人分享；他们的祷告将为你们，我的孩子们，也为我们带来永生，取代这短暂而劳苦的尘世生命。」


          他们还有这样一种美德。当大饥荒来临时，所有人都为饥饿所困时，他们却让当地所有的异端转信了正教，方法是他们在自己的许多庄园里打开了粮仓，并把存粮分发给穷人作口粮。他们这种非凡的仁爱使异端们认同了正统信仰，他们因此颂赞上帝，为了这对夫妇朴实的信仰和慷慨的慈善。'
    - type: paragraph
      text:
        ru: 'Другой удивительный их подвиг состоял в том, что их образ жизни был скромный: одежды их были чрезвычайно простые и самые дешевые; в издержках они были весьма бережливы; употребляли пищу простую и столько, сколько нужно было для поддержания жизни; строго соблюдали пред Богом целомудрие; большую часть времени проводили в полях; особенно любили оставаться в безмолвии; всегда удалялись городов (и рождающихся там пороков), чтобы чрез участие в веселии народном не увлечься городским шумом и не уклониться от воли Божией. За все такие дела добродетельной жизни сии блаженные умными очами уже видят вечные блага, уготованные им славою Божиею.'
        cn: 他们的另一个令人惊叹的苦修在于，他们的生活方式是简朴的：他们的衣着是极其朴素和最廉价的；在花费上，他们非常节俭；他们所用的食物是简单的，并且只取维持生命所需的分量；他们在上帝面前严格遵守贞洁；大部分时间在田野中度过；尤其喜爱留在静默中；总是远离城市（以及那里滋生的恶习），以免因参与民间的欢庆而被城市的喧嚣所诱惑，从而偏离上帝的旨意。为了所有这些有德行的生活行为，这些有福的人已经以智慧之眼看见了由上帝的荣耀为他们所预备的永恒福祉。
  - type: heading2
    text:
      ru: Об Элеимоне монахе
      cn: 论修道者埃莱伊蒙
    children:
    - type: paragraph
      text:
        ru: В этом же городе мы встретили еще монаха, который отказался принять рукоположение в пресвитера. В монашество поступил он, пробыв прежде несколько времени в воинской службе. Двадцатый год ведет он подвижническую жизнь, оставаясь при епископе города, муже отличной святости. Он столько человеколюбив и милостив, что ходит по городам с тем, чтобы помогать нуждающимся; не оставляет без попечения ни стражи, ни больниц, ни странноприимниц, ни богатого, ни бедного, но всем подает помощь; жестокосердным и немилостивым богачам преподает наставления о благосердии милости; заботится о каждом из бедных, чтобы у него было необходимое; враждующих примиряет, нагим доставляет одежду, больным – средства к врачеванию.
        cn: 在同一个城市，我们又遇见了一位修士，他拒绝接受按立为司祭。他在军中服役一段时间后，便进入了修道生活。他已过着苦修生活二十年，一直待在该城的主教身边，这位主教是一位圣德卓著的人。他是如此地仁爱和怜悯，以至于他行走于各城之间，为要帮助有需要的人；他不遗漏任何需要照料的人或地方，无论是狱卒、医院、款待所，还是富人、穷人，他都向所有人施予帮助；他向心硬不仁、毫无怜悯的富人教导有关仁慈和怜悯的训诲；他关心着每一个穷人，确保他们拥有必需品；使彼此敌对的人和解，给赤身露体的人提供衣服，给病人提供医疗用品。
    - type: paragraph
      text:
        ru: 'Что обыкновенно бывает во всех больших городах, то есть и здесь. В преддверии храма лежат множество увечных, просящих себе насущной пищи, частию женатых, частию неженатых. Случилось однажды ночью жене одного из них родить в преддверии, и притом во время зимы. Когда она кричала и мучилась от этой невыносимой болезни, блаженный, молившийся тогда в церкви, услышав ее вопль, прекратил обычные свои молитвы, вышел посмотреть и, не нашедши никого, кто бы помог ей в этой нужде, сам занял место повивальной бабки и не погнушался нечистотою, какая обыкновенно бывает у рождающих жен, потому что глубокое его милосердие сделало его нечувствительным. Одежда этого христолюбца, которую он носит, не стоит даже овола. Пища его не уступает одежде. Заниматься книгами ему нет времени, потому что дела человеколюбия отвлекают его от чтения. Если кто из братий подарит ему книгу, он тотчас продает и вырученные деньги раздает бедным. Когда же у него спрашивают: «Для чего бы продавать это?» – он отвечает: «Как могу уверить моего Учителя, что я тщательно изучил Его правила, если не буду по примеру Его Самого исполнять их?».'
        cn: 凡是通常出现在所有大城市里的事，在这里也是如此。在圣殿的门廊里，躺着许多残疾人，乞求着每日的口粮，其中有些已婚，有些未婚。曾有一次，在夜间，他们中的一个人的妻子在门廊里分娩，而且是在冬天的时候。当她因这种难以忍受的痛苦而呼喊挣扎时，那位当时正在教堂里祈祷的蒙福者，听到她的哀号，停止了他惯常的祈祷，出来查看，却没找到任何能在这困境中帮助她的人，于是他亲自担当了接生婆的角色，并且不嫌恶产妇通常会有的污秽，因为他深厚的怜悯之心使他对此毫无感觉。这位爱基督者所穿的衣服，甚至不值一奥波尔。他的食物也与他的衣服同样简陋。他没有时间研读书籍，因为行爱人之事占用了他阅读的时间。如果有任何一位弟兄们赠送他一本书，他会立刻卖掉，并将所得的钱分发给穷人。当人们问他：「为什么要卖掉它呢？」——他回答说：「如果我不效法我的导师亲身实践祂的教诲，我怎能让我的导师确信我已仔细研习了祂的教诲呢？」
    - type: paragraph
      text:
        ru: 'Этот бессмертный, проводивший жизнь в таких делах, даже до сих пор во всей окрестной стране по себе сохраняет всегда живую память, а сам наслаждается вечною радостию в Царствии Небесном, за свои праведные труды восприемля достойную награду: питав здесь алчущих и одевав нагих, вкушает теперь всякие утехи у Того, Кто награждает за добрые дела.'
        cn: 这位不朽者，一生行此善举，至今在整个周边地区，人们对他仍存留着永远鲜活的记忆，他自己则在天国中享受着永恒的喜乐，因其公义的劳苦而领受当得的奖赏：在此地曾喂饱饥饿者，穿上赤身露体者，如今则在奖赏善行者那里尝尽了各种慰藉。
  - type: heading2
    text:
      ru: О Виссарионе
      cn: 关于维萨里翁
    children:
    - type: paragraph
      text:
        ru: 'Был один старец, не имевший собственности и милостивый, по имени Виссарион. Пришедши в одно селение, он увидел на рынке мертвого нищего без всякой одежды, а на нем самом была только одна срачица, по заповеди евангельской, да еще на плечах небольшая епанча[40]. Кроме сего необходимого одеяния, он ничего не имел. Под мышкою у себя всегда носил он Евангелие для испытания ли себя в постоянном послушании слову Божию или для того, чтобы иметь при себе учение, которое он исполнял самым делом. Этот муж вел такую чудную и неукоризненную жизнь, что, будто земной ангел, свято шел путем небесным. Итак, когда увидел он мертвое тело, тотчас же снял с себя епанчу и покрыл ею мертвеца. Отошедши немного, он встретился с нищим, совершенно нагим, остановился и стал размышлять: «Зачем я, отрекшись от мира, одеваюсь в одежду, тогда как брат мой мерзнет от стужи? Если я попущу ему умереть, то, конечно, буду причиною смерти ближнего. Что ж? Разорвать ли мне свою одежду и разделить на части или всю ее отдать тому, который сотворен по образу Божию? Но что же будет за польза и мне и ему, если я разорву ее по частям?». Рассудив таким образом, он сказал: «Неужели я потерплю какой вред, когда сделаю более, нежели что повелено?». И вот сей добрый подвижник, усердно и скоро позвав бедного в сени одного дома, надел на него свою срачицу и отпустил его, а сам, оставшись нагим, закрылся руками и присел на колена; только под мышкою у него оставалось слово Божие, которое делает людей богатыми.'
        cn: '有一个名叫维萨里翁的长老，他一无所有，并且仁慈。他来到一个村庄，在市场上看见一个死去的乞丐，一丝不挂。他自己身上只有一件衬衣，是按照福音的诫命，肩膀上还有一件小斗篷[40]。除了这件必需的衣裳，他别无他物。他腋下总是带着福音书，也许是为了在持续顺服上帝的道上考验自己，也许是为了随身携带他亲身实践的教导。这位男子过着如此奇妙而无可指责的生活，仿佛地上的天使，圣洁地行在天路上。


          于是，当他看到那具尸体时，立刻脱下自己的斗篷，盖在死者身上。他走开一小段路后，遇见一个完全赤裸的乞丐，便停下来思索：「我既然弃绝了世界，为何还要穿着衣裳，而我的弟兄却因寒冷而受冻？如果我任凭他死去，那么我无疑是造成邻人死亡的原因。那么该怎么办？我是撕裂我的衣裳并分作几份，还是将它全部给予那按照上帝形象所造的人？但是，如果我将它撕成几片，对我或他又有何益处呢？」他这样思量后说：「难道我行了超过所吩咐的，就会遭受什么损害吗？」于是这位善良的修道者，热切而迅速地将那个穷人叫到一间房子的阴凉处，给他穿上自己的衬衣，然后让他走了。他自己则赤身裸体，用双手遮住自己，跪坐在地上；只有腋下还留着那使人富足的上帝的道。'
    - type: paragraph
      text:
        ru: 'В это время, по воле Промысла, проходил тут один блюститель порядка; он узнал старца и сказал своему товарищу: «Посмотри, не авва ли Виссарион этот старец?». Тот отвечал: «В самом деле он». Тогда первый сошел с коня и спросил святого: «Кто раздел тебя?». Авва протянул руку с Евангелием и сказал: «Вот оно меня раздело!». Блюститель порядка немедленно снял с себя одежду и сказал: «Вот тебе, совершенный воин!». Святой взял ее и тотчас удалился тайно из мира, неся с собою как бы малую монашескую одежду. Он постарался избежать похвалы от человека, который узнал его добродетель, и втайне ожидал славы сокровенной. Исполнив в точности евангельское правило и не имея в душе уже ничего мирского, он показал еще опыт совершеннейшего соблюдения Божественной заповеди.'
        cn: 此时，按照神恩旨意，一名秩序维护者在这里经过；他认出了这位长老，便对他的同伴说：「你看，这位长老莫非就是阿爸·维萨里昂吗？」那人回答说：「确实是他。」于是第一人下了马，问这位圣人：「谁剥去了你的衣服？」阿爸伸出手，手里拿着福音书，说：「看哪，是它剥去了我的衣服！」秩序维护者立刻脱下自己的衣服，说：「这给你，完全的战士！」圣人接过衣服，便立刻秘密地离开了世间，带着一件仿佛简朴僧袍般的衣物。他努力避免来自认出了他的美德之人的赞扬，并在暗中期待那隐藏的荣耀。他精确地遵行了福音的规矩，并且心中不再存留任何世俗之物，从而再次展示了对神圣诫命最完善遵行的范例。
    - type: paragraph
      text:
        ru: 'На дороге увидел он бедного и тотчас побежал на рынок, где был недавно, и продал Евангелие. Через несколько дней ученик сего аввы по имени Дула спросил старца: «Где же, авва, твоя малая книжка?». Старец спокойно и умно отвечал ему: «Не печалься, брат! Чтобы показать, что имею веру и покорность слову Божию, я продал само это слово, которое всегда говорило мне:«Продаждь имение твое и даждь нищим»(Мф. 19, 21)». Много и других подвигов добродетели совершил сей великий авва. Да удостоимся и мы иметь с ним часть, по благодати Христовой. Аминь.'
        cn: 在路上，他看见一个穷人，立刻跑到他不久前去过的市场，卖掉了福音书。几天后，这位阿爸的门徒名叫杜拉的，问这位长老：「阿爸，你的那本小书在哪里呢？」老人平静而智慧地回答他：「不要忧伤，弟兄！为了表明我拥有对上帝话语的信心和顺服，我卖掉了这本身就是话语的福音书，因为它总是对我说：『变卖你所有的，分给穷人』（马太福音 19:21）。」这位伟大的阿爸还成就了许多其他的美德功业。愿我们也能因基督的恩典，配与他同享这福份。阿门。
  - type: heading2
    text:
      ru: О Мелании
      cn: 关于梅拉尼娅
    children:
    - type: paragraph
      text:
        ru: Почел я за нужное упомянуть в этой книге и о женах доблестных и благочестивых, которым Бог наравне с мужами, пожившими для Него добродетельно, дал в награду венец, чтобы женщины беспечные не изнеживались и не ссылались на то, что они слишком слабы для подвигов добродетели и жизни благочестивой. Видел я много между ними благочестивых и встречал много дев и вдовиц таких, которые мужественно подвизались в добродетели.
        cn: 我认为有必要在这本书中也提及那些刚毅而虔敬的妇女们，上帝赐予她们冠冕作为奖赏，与那些为了祂而以德行度日的男子们同样地，以免那些懈怠的妇女们变得娇弱，也不再托词说她们过于柔弱，无法从事德行苦修和虔敬的生活。我曾见过许多她们当中的虔敬者，也遇到过许多这样的贞女和寡妇，她们勇敢地在德行上奋斗。
    - type: paragraph
      text:
        ru: 'Блаженнейшая Мелания была родом испанка или римлянка, дочь проконсула Марцеллина, жена одного знатного сановника, которого имени хорошо не помню. На двадцать втором году она овдовела и по смерти мужа, воспламенившись Божественною любовию, обручила себя Вечному Жениху, возлюбила Его до конца и никому ничего о сем не говорила, ибо само время представляло ей препятствие. Упросив царствовавшего тогда Валента, чтобы он наименовался опекуном сына ее, сама взяла все свое имение и, нагрузивши корабль, поспешно отправилась с несколькими слугами и служанками в Александрию. Прибыв туда, она продала там имение и, разменяв на деньги, отправилась в гору Нитрийскую, где и нашла святых отцов: блаженного Памво, раба Христова Арсисия, Великого Серапиона, святого Пафнутия, славного Исидора-исповедника, епископа Ермипольского и праведного Диоскора. Пробыв у них около полугода, обошла она пустыню и увиделась со всеми мужами. После сего, когда префект александрийский изгнал в Кесарию Палестинскую святых отцов Исидора, Писимия, Аделфия, Пафнутия, Памво, Аммония и некоторых других – всех двенадцать епископов и пресвитеров и, сверх того, клириков и отшельников, так что вместе с двенадцатью епископами и пресвитерами их было числом сто двадцать шесть человек, – тогда с ними вместе пошла и сия блаженная и помогала им своим имуществом. Но поскольку запрещено было оказывать им услуги, как мне говорили святые Писимий, Исидор, Пафнутий и Аммоний, с которыми я виделся, то эта доблестная жена надела платье слуги и вечером приносила им все потребное.'
        cn: 至福的麦拉尼娅（Melania）出身西班牙或罗马，是总督马尔切利努斯（Marcellinus）的女儿，一位显赫显贵的妻子，其名我已记不清了。她在二十二岁时成了寡妇，丈夫死后，她被神圣的爱所点燃，将自己许配给永恒的新郎，至死不渝地爱祂，并且对此事只字未提，因为当时的情势本身就对她造成了阻碍。她恳求当时在位的瓦伦斯（Valens）作为她儿子的监护人，自己带上全部财产，装满了一艘船，匆忙地与几个男仆和女仆一起前往亚历山大。抵达那里后，她变卖了财产，兑换成钱款，前往尼特里亚山，在那里她找到了众圣父：蒙福的潘沃（Pamvo），基督的仆人阿西西乌斯（Arsisius），伟大的塞拉皮翁（Serapion），圣帕夫努提（Paphnutius），荣耀的伊西多尔（Isidore）认信者——赫米波利斯（Hermopolis）主教，和义人迪奥斯科鲁斯（Dioscorus）。她在他们那里住了大约半年后，巡游了沙漠，并与所有修士都见了面。此后，当亚历山大的总督将圣父伊西多尔、皮西米乌斯（Pisimius）、阿德尔菲乌斯（Adelphius）、帕夫努提、潘沃、安蒙尼乌斯（Ammonius）以及其他一些人——总共有十二位主教和长老，以及神职人员和隐修士——驱逐到巴勒斯坦凯撒利亚时，因此，连同十二位主教和长老，他们总共有一百二十六人，那时，这位蒙福者也与他们一同前往，并用她的财产帮助他们。但由于当时禁止向他们提供帮助，正如我曾见过的圣皮西米乌斯、伊西多尔、帕夫努提和安蒙尼乌斯所告诉我的那样，这位英勇的女子便穿上仆役的衣服，并在晚上将一切所需之物带给他们。
    - type: paragraph
      text:
        ru: 'Проконсул[41]палестинский узнал об этом и, желая получить от нее корысть, вздумал напугать ее: схватил и заключил в темницу, ибо не знал, что она благородного происхождения. Находясь в заключении боголюбивая сказала проконсулу: «Я дочь такого-то, была замужем за таким-то знатным сановником, а теперь раба Христова; не считай же меня низкою, судя по моей бедной одежде. Если захочу, я могу показать свое достоинство и отомстить за себя, а ты не можешь ни устрашить меня, ни взять что-нибудь из моего имущества. Итак, чтобы ты, по неведению, сам не подпал обвинению, вот я объяснилась с тобою, ибо с бесчувственными должно, говорят, обращаться гордо, как с собакою или коршуном, и смело наступать на них в случае их дерзости». Судья, услышав это, опомнился, извинился, просил у нее прощения и позволил ей иметь беспрепятственное сообщение со святыми мужами.'
        cn: 巴勒斯坦行省总督[41]得知此事后，想从她身上谋取私利，便企图恐吓她：将她逮捕并投入监狱，因为他不知道她出身高贵。身陷囹圄时，那敬爱上帝的女子对行省总督说：「我乃某某之女，曾与某位显赫的官员成婚，而今我是基督的婢女；不要以我简陋的衣着而将我视为卑贱。若我愿意，我能彰显我的尊严并为自己伸冤，而你既不能恐吓我，也不能夺取我的任何财物。所以，为免你因无知而自招罪责，我便向你说明清楚，因为据说，对待麻木不仁之人，当如对待犬只或鸢鹰般傲慢，并在他们胆敢无礼时，要大胆地予以回击。」审判官听了这话后，猛然醒悟，表达歉意，请求她的宽恕，并允许她与圣洁的男士们进行无碍的交通。
    - type: paragraph
      text:
        ru: После того как святые те мужи были вызваны опять в Александрию, Мелания построила в Иерусалиме монастырь, в котором жила двадцать семь лет и собрала пятьдесят девственниц.
        cn: 在那些圣洁的男士们再次被召往亚历山大之后，默拉尼娅在耶路撒冷建造了一座修道院，她在那里居住了二十七年，并召集了五十名贞女。
  - type: heading2
    text:
      ru: О Руфине
      cn: 关于鲁菲努斯
    children:
    - type: paragraph
      text:
        ru: С нею жил и благороднейший, подобный ей по образу жизни, доблестнейший Руфин, урожденец италийский, из города Аквилеи, впоследствии удостоенный пресвитерства. Ученее и скромнее его не было между братиями. Оба они с Меланиею в продолжение двадцати семи лет принимали приходивших в Иерусалим для поклонения – епископов и монахов, девственниц и замужних, знатных и простых – и всех нуждавшихся в их помощи общими силами успокаивали и на свой счет содержали. Они от раскола Павла Самосатского[42]около четырехсот монашествующих присоединили к православию и всякого, впавшего в ересь духоборцев, убеждали и приводили к Церкви, а местному клиру усердствовали дарами и способами содержания. В таких-то делах провели они благочестивую жизнь, не повредив никому, но доставив пользу почти всему миру.
        cn: 与她同住的还有最崇高的、生活方式与她相似的最英勇的鲁菲努斯，他是意大利本地人，来自阿奎莱亚城，后来被授予长老职分。在弟兄们当中，没有人比他更有学问、更谦逊。他们两人和梅拉妮亚在二十七年间，接待了所有来到耶路撒冷朝拜的人——主教和修士，童贞女和已婚妇女，贵族和普通人——他们共同努力，安抚所有需要帮助的人，并自费供养他们。他们使大约四百名曾属于萨莫萨塔的保罗[42]分裂派的修士归入正教，并劝服所有陷入「灵战派」异端的人，使他们回到教会；他们还慷慨地向当地神职人员提供馈赠和生活资助。他们就是这样度过了敬虔的生活，没有伤害任何人，却几乎造福了全世界。
  - type: heading2
    text:
      ru: О Мелании
      cn: 关于梅拉尼娅
    children:
    - type: paragraph
      text:
        ru: О чудной святой Мелании я уже прежде кратко упомянул, а теперь и остальное или, правильнее, то, что удержалось у меня в памяти о ее добродетелях, вплету в узорчатую ткань слова и расскажу о несказанных благодеяниях боголюбивейшей этой жены. Из них она собственными трудами соткала для себя блаженную одежду нетления, из своего имущества прекрасно выработала, для честной главы своей, неувядаемый венец славы и, украсившись им, с великим дерзновением прешла ко Господу. Впрочем, если б я начал пересказывать все, что только знаю о подвигах сей блаженной, у меня недостало бы и времени. Какое богатство употребила она на бедных, движимая небесною ревностию! Думаю, если бы пламя огня попало в такое огромное количество имения, и оно не могло бы истребить его. Впрочем, рассказывать об этом – не мое только дело, но и живущих в Персии, Британии и на всех островах, потому что благодеяний и даров этой бессмертной жены не были лишены ни запад, ни восток, ни север, ни юг. Тридцать семь лет живши в чужой стране, она снабжала из собственного имущества и церкви, и монастыри, и странноприимные дома, и темницы. Вообще никто из приходивших не отходил от нее без пособия, потому что ее родственники, сам сын и поверенные каждодневно доставляли ей деньги, как бы подливая елей в чистый светильник, который, горя ясным пламенем милосердия, освещал всех доброхотным даянием. Когда же она столь щедро и постоянно раздавала милостыню, у нее самой наконец не осталось ни одной пяди земли.
        cn: 关于奇妙的圣女梅拉尼娅，我先前已简要提及；现在，我将余下的一切，或者更准确地说，我记忆中所保留的关于她美德的部分，编织进华丽的文字之锦，讲述这位极爱神的妇人难以言喻的善行。籍由这些，她借着自己的劳苦，为自己织就了不朽的蒙福衣裳；从她的财产中精心地为她尊贵的头颅铸就了永不衰残的荣耀冠冕，并佩戴着这冠冕，带着极大的胆量归于主了。然而，若我开始叙述所有我所知的这位蒙福者的苦修事迹，我将无暇顾及。她将何等巨大的财富施舍给穷人，被属天的热忱所感动！我想，即便火焰烧到如此巨量的财产，也无法将其全部烧毁。然而，讲述此事并非我一人之责，居住在波斯、不列颠以及所有岛屿上的人们也应如此，因为这位不朽妇人的善行和恩赐，无论西方、东方、北方还是南方，都未曾被剥夺。她在异国居住了三十七年，从自己的财产中供养教会、修道院、接待所和监狱。总而言之，所有前来求助的人，没有一个空手而归，因为她的亲戚、她儿子本人和受托人每天都给她送钱，如同往一个纯净的灯盏中添油，这灯盏燃着明亮的仁慈之火，以乐善好施的光芒照亮了所有人。当她如此慷慨且持续不断地施舍时，她自己最终竟没有剩下寸土之地。
    - type: paragraph
      text:
        ru: Расположением к сыну она не была отвлечена от стремления к пустыне; любовь к единственному сыну своему не удалила ее от любви ко Христу – напротив, по ее святым молитвам и этот юноша достиг высокого успеха в науках и чистоты нрава; вступил в брак, по мирским понятиям блистательный, получил светские отличия и имел двух детей. Спустя долгое время, когда эта достохвальная жена услышала о своей внучке, что она вышла замуж и намеревается отречься от мира, убоявшись, чтобы как-нибудь не вовлекли ее в неправое учение, или ересь, или в порочную жизнь, села на корабль и, отплыв из Кесарии, чрез двадцать дней прибыла в Рим. Тогда ей было уже шестьдесят лет. Во время своего здесь пребывания она наставила в вере и сделала христианином блаженного, достопочтенного и знаменитого мужа Апрониана, который был язычником; убедила его жить с женою, ее племянницею, блаженною Авитою, целомудренно; в том же утвердила и свою внучку, младшую Меланию, с мужем ее Пинианом. Наставив свою невестку, жену своего сына Альбину, и убедив всех их продать имение, она вывела их из Рима и ввела в благое и спокойное пристанище жизни.
        cn: 对儿子的感情并未使她偏离对沙漠的向往；对独生子的爱也未让她远离对基督的爱——相反，通过她圣洁的祷告，这个青年在学问上取得了卓越的成就，并保持了品行的纯洁；他按照世俗的观念结了一桩显赫的婚姻，获得了世俗的殊荣，并育有两子。过了许久，当这位值得称颂的妇人听说她的孙女已婚并打算弃绝世俗时，她唯恐孙女被卷入不义的教导、或异端、或堕落的生活中，便登船，从凯撒利亚启程，二十天后抵达罗马。那时她已经六十岁了。在她逗留期间，她教导并使那曾是异教徒的、蒙福的、可敬的、著名的男子阿普罗尼安归信了基督；她劝说他与他的妻子——她的侄女、蒙福的阿维塔——过贞洁的生活；她也同样坚固了她的孙女，小梅拉尼娅，与她的丈夫皮尼安。她教导了她的儿媳，即她儿子阿尔宾娜的妻子，并劝说他们所有人卖掉家产，然后把他们带出罗马，引导他们进入一个美好而宁静的生命港湾。
    - type: paragraph
      text:
        ru: 'Вот как она победила всех знатных сановников римских и их жен, препятствовавших ей отречься и от остального своего имущества. Раба Христова говорила им: «Дети! За четыреста лет написано, что уже«..последняя година есть»(1Ин. 2, 18). Для чего же вы предаетесь суетной жизни? Смотрите, чтобы не застигли вас дни антихриста – тогда уже нельзя будет вам наслаждаться своим богатством и стяжаниями ваших предков!». Такими словами отвлекши всех их от мира, она привела их к жизни монашеской. Публиколу, младшего сына своего, наставив в вере, увела она в Сицилию, потом продала все остальное свое имущество и, взяв деньги, отправилась опять в Иерусалим, раздала имущество в течение сорока дней и весьма тихо почила в доброй старости, оставив по себе славную память, украсившись милосердием и обогатившись плодами добрых дел. В Иерусалиме она оставила после себя монастырь и средства на содержание его.'
        cn: 她就是这样胜过了所有罗马的显赫官员和他们的妻子，他们曾阻碍她舍弃她其余的财产。基督的仆女对他们说：「孩子们！四百年前就已写明，『……如今正是末时了』（约翰一书 2:18）。你们为何还要沉溺于虚妄的生活呢？当心，免得敌基督的日子突然降临于你们——那时你们就不能再享受你们的财富和你们祖先的遗产了！」借着这样的话，她使他们所有人都脱离了世俗，并引领他们走向修道生活。她在信仰上教导了她最小的儿子普布利科拉之后，把他带到了西西里，接着卖掉了她所有其余的财产，并带着钱，再次前往耶路撒冷，在四十天内分发了财产，并在安详的晚年中极为宁静地安息了，给后世留下了光荣的纪念，以仁慈为装饰，并因善行的果实而丰盛。在耶路撒冷，她留下一座修道院和维持其运作的资金。
    - type: paragraph
      text:
        ru: Когда же все блаженною Меланиею наставленные в вере удалились из Рима, буря варварского нашествия, задолго предсказанная в пророчествах, устремилась на Рим и не оставила даже медных статуй на форуме, но все разрушила с варварскою жестокостию и предала погибели, так что процветавший тысячу двести лет Рим, по слову Сивиллы, сделался деревнею. Тогда наставленные (Меланиею) радовались, что не подпали ужасам опустошения, и за благоприятную перемену своих обстоятельств и славное свое спасение прославляли Бога, Который самыми делами показал неверным, что, при всеобщем порабощении, спаслись только семейства, по старанию славной и бессмертной Мелании принесшие себя всецело в жертву Господу, между тем как противившиеся спасению раскаивались, но уже поздно и бесполезно.
        cn: 当所有在信仰上蒙受蒙福的墨拉尼娅教导的人们都离开了罗马之后，那在预言中早已预示的野蛮入侵风暴便猛扑向罗马，甚至没有留下广场上的青铜雕像，却用野蛮的残暴摧毁了一切，并将其付诸毁灭，以至于繁荣了一千二百年的罗马，按西比尔的话说，变成了一个村庄。那时，蒙受（墨拉尼娅）教导的人们欢喜，因为他们没有遭受毁灭的恐怖，并因他们处境的有利转变和他们荣耀的得救而赞美上帝。祂以事实向不信者表明，在普遍受奴役的情况下，只有那些因着荣耀而不朽的墨拉尼娅的努力，将自己完全献给主作为祭品的人家才得以幸免，而那些抵制救恩的人则悔改了，但为时已晚，毫无益处。
  - type: heading2
    text:
      ru: О Мелании младшей
      cn: 关于小默拉尼亚
    children:
    - type: paragraph
      text:
        ru: 'Так как выше обещали мы рассказать о младшей Мелании, то надобно нам теперь исполнить обещание. Да и несправедливо было бы с нашей стороны, по неуважению к ее молодости телесной, умолчать о такой добродетели, которая, может быть, ставит ее гораздо выше многих разумных и ревностных стариц. Ее, летами еще юную, но уже старицу ведением благочестия, родители насильно заставили вступить в брак и выдали за вельможу римского, тогда как она, напитанная словами своей бабки, так была ими проникнута, что не могла иметь привязанности к брачной жизни. Когда же родившиеся у нее два сына оба умерли, она почувствовала такое отвращение к браку, что сказала мужу своему Пиниану, сыну градоначальника Севера: «Если ты согласен жить со мною целомудренно, я буду почитать тебя своим господином и признавать властелином моей жизни; если же тебе, по молодости, покажется это тяжким, возьми все мое имение, только оставь мое тело в покое, чтобы я могла исполнить свое богоугодное желание и сделаться наследницею богоугодных добродетелей моей бабки, которой имя я ношу. Если бы Богу угодно было, чтобы мы жили в этом мире и наслаждались его благами, Он так рано не взял бы рожденных мною детей». Долго они разногласили между собою. Наконец Бог, умилосердившись над юным мужем, вложил и ему желание богоугодной жизни, и он отказался от всех мирских благ, так что исполнилось слово апостола:«Что веси, жено,ащемужа спасеши? Или что веси, мужу,ащежену спасеши?»(1Кор. 7, 16).'
        cn: 既然前面我们已经答应要讲述关于小梅拉尼亚的事，那么我们现在就必须履行诺言了。而且，若因为对她肉身年轻的轻视而对她如此的德行保持缄默，那对我们来说也是不公正的，要知道，这份德行或许让她远远超越了许多明智而热忱的老妇人。她年纪尚轻，但因虔敬的知识已如老者，她的父母强迫她结婚，并把她嫁给一位罗马贵族；然而，她浸润于祖母的话语之中，被它们深深渗透，以至于她无法对婚姻生活产生依恋。当她所生的两个儿子都去世后，她对婚姻产生了极大的厌恶，以至于她对她的丈夫皮尼安，也就是总督塞维鲁的儿子说：「如果你同意与我贞洁地生活，我将尊你为我的主，并承认你是我的生命之主宰；但如果你因为年轻，觉得这很难做到，那么就拿走我所有的财产，只求你让我的身体得以平静，好让我能够实现我蒙神悦纳的愿望，并成为我祖母，也就是我所承袭其名的那位，蒙神悦纳之美德的继承人。如果上帝愿意我们活在这个世上并享受它的福分，祂就不会那么早地将我所生的孩子取走了。」他们之间争执了很久。最终，上帝怜悯了这位年轻的丈夫，也将蒙神悦纳的生活的愿望放在了他心中，于是他放弃了所有的世俗财富，以至于使徒的话语得以应验：「你这作妻子的，怎么知道不能拯救你的丈夫呢？你这作丈夫的，怎么知道不能拯救你的妻子呢？」 (哥林多前书 7:16)。
    - type: paragraph
      text:
        ru: Таким образом, вышедши замуж тринадцати лет и семь проживши с мужем, Мелания отреклась от мира на двадцатом году и сперва все шелковые свои покрывала раздала по церквам (как сделала и достопочтенная Олимпиада), другие же шелковые одежды разрезала по частям и сделала из них различные церковные утвари; серебро и золото поручила одному пресвитеру – Павлу, монаху далматскому, отправить морем на восток; десять тысяч златниц – в Египет и Фиваиду; десять тысяч – в Антиохию и ее округи; пятнадцать тысяч – в Палестину; десять тысяч – в церкви, находящиеся на островах, и в пользу изгнанных, а церквам западным, монастырям, станноприимцам и всем нуждающимся своими руками раздала и раздает вчетверо более. Так она, по милости Божией, силою своей веры исхитила свое стяжание из уст льва – Аларика[43]. Рабов, которые пожелали, отпустила на волю. Впрочем, большая часть из них пожелали служить ее брату, которому она и уступила их. Все имение, какое у нее было в Италии, Аквитании, Террацине и Галлии, она распродала, а деньги раздала, не оставив у себя и трех златниц. Но то, которое было в Сицилии, в Кампании и Африке, оставила при себе на вспомоществование монастырям и всем нуждающимся.
        cn: 如此，墨拉尼亚十三岁结婚，与丈夫共同生活七年，在二十岁时弃绝尘世，首先将她所有的丝质盖头分发给各教会（正如可敬的奥林匹娅达所做的那样），而其他丝质衣物则剪成碎片，用它们制作了各种教会器皿；她将白银和黄金委托给一位长老——达尔马提亚修士保罗——海运至东方；一万金币——送往埃及和提拜德；一万金币——送往安提阿及其周边地区；一万五千金币——送往巴勒斯坦；一万金币——送往群岛上的教会以及为流亡者谋利；而对于西方的教会、修道院、接待所和所有有需要的人，她亲手分发了，且正在分发多出四倍的财物。如此，她凭着神的恩典，藉着她信心的力量，从狮子——阿拉里克[43]的口中夺回了她的财物。她释放了那些愿意获得自由的奴隶。然而，他们中的大部分人却愿意服侍她的兄弟，于是她便将他们让给了她的兄弟。她在意大利、阿基坦、特拉奇纳和高卢的所有财产，她都变卖了，并将所得款项分发出去，甚至没有为自己留下三个金币。但她在西西里、坎帕尼亚和非洲的财产，则留了下来，用以资助修道院和所有有需要的人。
    - type: paragraph
      text:
        ru: 'Такова мудрость боголюбезнейшей Мелании младшей, показавшей богопросвещенный, старческий ум при распоряжении великим богатством. Подвижничество ее таково: вкушает она пищу через день, а прежде и через пять дней; сама прислуживает своим рабыням, которых сделала своими сподвижницами; во многих из своих родственников возбудила ревность по Боге, так что и они стали вести, подобно ей, богоугодную жизнь. Такова жизнь младшей Мелании о Господе нашем Иисусе Христе.'
        cn: 这就是蒙神所最喜悦的年少的墨拉尼娅的智慧，她在管理巨额财富时，展现了蒙神启迪的、长老式的智慧。她的苦修功德如下：她隔一天进食一次，而从前甚至隔五天进食一次；她亲自服侍她的婢女们，并使她们成为她的同修；她在她的许多亲戚中激发起对神的热忱，以至于他们也像她一样，过上蒙神喜悦的生活。这就是年少的墨拉尼娅在我们主耶稣基督里的生平。
  - type: heading2
    text:
      ru: Об Альбине
      cn: 关于阿尔比娜
    children:
    - type: paragraph
      text:
        ru: С нею находится и мать ее Альбина, так же как и она, подвизавшаяся и добровольно раздавшая свое имение. Они живут в своих владениях то в Сицилии, то в Кампании с девами и рабынями.
        cn: 和她在一起的还有她的母亲阿尔宾娜，她也像她一样，勤修苦行，并自愿散尽家财。她们与贞女们和女奴们一起，居住在她们的领地里，有时在西西里，有时在坎帕尼亚。
  - type: heading2
    text:
      ru: О Пиниане
      cn: 关于皮尼安
    children:
    - type: paragraph
      text:
        ru: Также и Пиниан, некогда муж ее (младшей Мелании), а теперь, по воле Христа, единодушный сподвижник в добродетели, подвизается с тридцатью монахами, читает Божественное Писание и занимается возделыванием сада и собеседованием.
        cn: 彼尼安亦然，她（小梅拉尼亚）昔日的丈夫，而今，按基督的旨意，是她在美德上的同心同德的同道者，与三十位修士一同修行，诵读神圣经文，并从事园艺和交谈。
    - type: paragraph
      text:
        ru: Они немало почтили нас, когда мы в большом числе пришли в Рим ради блаженного епископа Иоанна, успокоили нас в гостинице и снабдили обильно дорожным запасом.
        cn: 当我们大批地为蒙福的主教约翰来到罗马时，他们给予我们极大的敬意，在旅店里安顿了我们，并丰盛地供应了我们旅途所需的给养。
    - type: paragraph
      text:
        ru: Так они с великою радостию приобретают вечную жизнь богодарованными делами совершенной жизни.
        cn: 这样，他们怀着极大的喜乐，借着神所赐的、完美生活的行为，获得了永生。
  - type: heading2
    text:
      ru: О Паммахии
      cn: 关于帕马修
    children:
    - type: paragraph
      text:
        ru: Сродник их Паммахий, бывший проконсулом, точно так же отказавшись от мира, вел благочестивую жизнь. Он отошел ко Господу, частию раздав имение свое при жизни, частию при смерти отказав на бедных.
        cn: 他们的亲属帕马希，曾任总督，同样地弃绝世俗，过着敬虔的生活。他归回主怀，一部分是在生前散尽家产，另一部分是在临终时遗赠给穷人。
  - type: heading2
    text:
      ru: О Макарии и Константине
      cn: 关于马卡里和君士坦丁
    children:
    - type: paragraph
      text:
        ru: Подобным образом и некто по имени Макарий из Викарии и Константин, бывший товарищем италийских префектов, мужи знаменитые и весьма ученые, достигли высокого благочестия. Они, думаю, живы еще и доселе и, подвизаясь в высоком благочестии, ожидают жизни блаженной и нетленной.
        cn: 同样地，一名名叫马卡里、来自维卡里的人，以及康斯坦丁（他曾是意大利省长们的同僚），这两位著名且学识渊博的男子，都达到了高尚的虔敬。我想，他们至今仍然健在，并且在高尚的虔敬中操练，等待着蒙福且不朽的生命。
  - type: heading2
    text:
      ru: О Евстохии
      cn: 关于欧斯托希娅
    children:
    - type: paragraph
      text:
        ru: Дочь блаженной Павлы Евстохия и ныне подвизается в Вифлееме. Я не видел ее, но она, говорят, жена целомудреннейшая и имеет общежитие из пятидесяти дев.
        cn: 蒙福的保拉的女儿欧斯托西娅至今仍在伯利恒修行。我没有见过她，但他们说，她是一位贞洁无比的女子，并且拥有一处由五十名贞女组成的修道团体。
  - type: heading2
    text:
      ru: О Венерии
      cn: 关于维纳斯
    children:
    - type: paragraph
      text:
        ru: Знал я и Венерию, дочь сановника Каллодина, которая прекрасно разбросала ношу верблюжью и избавилась от язв, причиняемых богатством.
        cn: 我亦认识维涅利亚，显贵卡洛丁的女儿，她奇妙地卸下了骆驼的重负，并摆脱了财富所带来的疮痍。
  - type: heading2
    text:
      ru: О Феодоре
      cn: 关于提奥多尔
    children:
    - type: paragraph
      text:
        ru: Знал я также и блаженную Феодору, дочь трибуна, которая дошла до такой нищеты, что сама принимала милостыню и так скончалась.
        cn: 我也认识蒙福的提奥多拉，她是位护民官的女儿，她变得如此贫困，以至于她自己也接受施舍，就这样安息了。
  - type: heading2
    text:
      ru: Об Усии
      cn: 关于乌西亚
    children:
    - type: paragraph
      text:
        ru: В приморском монастыре Исихия знал я и Усию, женщину во всех отношениях почтеннейшую.
        cn: 在滨海修道院，我还认识伊西希亚，以及乌西娅，一个在各方面都最可敬的女人。
  - type: heading2
    text:
      ru: Об Адолии
      cn: 关于阿多利奥斯
    children:
    - type: paragraph
      text:
        ru: Знал я и сестру ее Адолию, которая также была добродетельна, и хотя не столько, как та, но соответственно силам своим показала ревность по Боге.
        cn: 我也认识她的姐妹阿多利娅，她也很有德行，尽管不及那一位，但她照着自己的力量，向着上帝显出了热忱。
  - type: heading2
    text:
      ru: О Вазианилле
      cn: 关于瓦奇阿尼
    children:
    - type: paragraph
      text:
        ru: Знал я и Вазианиллу, дочь военачальника Кандиана. Она усердно и благоговейно упражнялась в добродетели и доныне еще мужественно подвизается.
        cn: 我也认识瓦齐阿尼拉，将领坎迪安的女儿。她殷勤而虔敬地操练美德，并且至今仍在勇敢地努力奋斗。
  - type: heading2
    text:
      ru: О Фотине
      cn: 关于弗蒂娜
    children:
    - type: paragraph
      text:
        ru: Знал я также и Фотину, деву целомудреннейшую, дочь лаодикийского пресвитера Феоктиста.
        cn: 我也认识弗提娜，一个最贞洁的少女，她是老底嘉长老狄奥克提斯特的女儿。
  - type: heading2
    text:
      ru: Об Азелле
      cn: 关于阿泽勒
    children:
    - type: paragraph
      text:
        ru: А в Риме видел я добрую Азеллу, девственницу Христову, непорочно состарившуюся в монастыре, женщину весьма кроткую, у которой были христианские собрания. И в них видел я новообращенных мужчин и женщин.
        cn: 我在罗马看到了善良的阿泽拉，她是基督的贞女，在修道院里纯洁地老去。她是一位非常温柔谦逊的女性，那里有基督徒聚会。在这些聚会中，我看到了新皈依的男人和女人。
  - type: heading2
    text:
      ru: Об Авите
      cn: 关于阿维特
    children:
    - type: paragraph
      text:
        ru: Видел я и блаженную, достойную Бога Авиту, с мужем ее Априкианом и их дочерью Евномиею, во всем угождавших Богу. Они легко и скоро обратились от жизни рассеянной и роскошной к жизни добродетельной и воздержанной, за что удостоились христианской кончины и совершенно освободились от всякого греха. Знаемые при жизни, они и по смерти оставили о себе добрую память.
        cn: 我也见到了蒙福的、配得神荣耀的阿维塔，以及她的丈夫阿普里基安和他们的女儿欧诺米亚，他们在一切事上都蒙神喜悦。他们轻松而迅速地从放荡奢华的生活，回转向良善和节制的生活，因此他们配得了基督徒的善终，并完全脱离了所有的罪。他们活着的时候为人所知，死后也留下了美好的名声。
  - type: heading2
    text:
      ru: О Магне
      cn: 论马格尼斯
    children:
    - type: paragraph
      text:
        ru: В городе Анкире много и других дев – около двух тысяч или более. Все они подвизаются в святой, добродетельной жизни, хранят воздержание и живут весьма смиренно, как прилично кротким. Есть также знаменитые и отличные жены, с великою ревностию совершающие богоугодный подвиг.
        cn: 在安基拉城，还有许多其他的贞女——大约两千或更多。她们所有人都奋进于圣洁、有德行的生活中，守持节制，并且生活得极其谦卑，正如温柔之人所应有的。还有著名且杰出的妇女，怀着极大的热忱，践行着蒙神悦纳的修行。
    - type: paragraph
      text:
        ru: Между ними отличается благочестием Магна, жена почтеннейшая и опытнейшая в жизни. Не знаю, называть ли ее девою или вдовою, потому что она, вышедши замуж по принуждению матери, отклоняла от себя мужа под различными предлогами, делала вид, будто имеет телесные болезни, и, таким образом, пребыла неприкосновенною и непорочною, как говорят ее родственники. Когда же в скором времени муж ее скончался и она осталась единственною после него наследницею, тогда, променяв блага временные на вечные, она всю себя посвятила Богу, более всего заботилась о вечной жизни, управляла своими рабами кротко и вела жизнь самую строгую и целомудренную. В обращении она была так совершенна, что один вид ее, исполненный благочестия, возбуждал к ней уважение в знаменитых епископах. Огнем нестяжательности сожгла она великое и излишнее богатство, а что затем оставалось на ее нужды, и то назначила на монастыри, на бедных, на странноприимные дома и церкви, на нищих, странников, епископов, сирот и вдов – и вообще с любовию подавала пособие всем нуждающимся, творя дела благочестия втайне как лично, так и чрез своих верных рабов. Она не отходила от церкви, особенно по ночам, и совершала всякую подвижническую добродетель в надежде жизни вечной.
        cn: 在她们中间，玛格娜以虔诚著称，她是一位最受尊敬、生活经验最丰富的妇女。不知该称她为贞女还是寡妇，因为她，虽然是受母亲所迫而嫁人，却以各种借口拒绝丈夫，假装自己有身体上的疾病，如此，她便保持了贞洁无瑕的状态，正如她的亲戚们所说。当不久之后她的丈夫去世，她成为他唯一的继承人时，她便将暂时的财富换取了永恒的福分，将自己完全奉献给上帝，最关心的便是永恒的生命，待她的奴仆宽厚温和，并过着最严谨、最贞洁的生活。她的言行举止是如此完美，以至于她那充满虔诚的仪态，就能激发著名主教们对她的尊敬。她以弃绝钱财的烈火烧尽了巨大而多余的财富；而之后她自己所需的剩余部分，也都拨给了修道院、穷人、招待所和教会、乞丐、旅客、主教、孤儿和寡妇——总之，她充满爱心地帮助所有需要的人，无论是亲自还是通过她忠实的奴仆，都在暗中行着虔诚之事。她从不远离教会，尤其是在夜间，并因着对永恒生命的盼望，践行着一切修道性的美德。
  - type: heading2
    text:
      ru: О девственнице, укрывшей блаженного Афанасия
      cn: 关于庇护了真福阿塔纳修的贞女
    children:
    - type: paragraph
      text:
        ru: 'Знаю я одну девственницу в Александрии, которой было около семидесяти лет, когда я с нею встретился. О ней весь клир свидетельствовал, что в молодости, когда ей было лет около двадцати и когда она была очень красива собою, от ее красоты убегали мужи добродетельные, чтобы не подвергнуться какому-нибудь нареканию по подозрению. Но случилось, что ариане, строя ковы[44]против блаженного Афанасия, епископа Александрийского, посредством Евсевия, бывшего тогда начальником при императоре Констанции, оклеветали его в тяжких преступлениях. Убегая от неправого суда, блаженный Афанасий не решился ввериться ни сроднику, ни другу, ни клирику, ни другому кому из знакомых. Когда посланные градоначальником нечаянно пришли в дом епископа и стали искать его, он, взявши свой стихарь и фелонь, в полночь прибежал к упомянутой девственнице. Та изумлена была странностию сего поступка и пришла в некоторый страх. Но епископ стал говорить ей: «Меня ищут ариане, оклеветавшие меня в тяжких преступлениях. Но, чтобы и самому мне не подвергнуться безумному приговору, и не ввести в грех желающих моего осуждения, решился я убежать; и вот Бог открыл мне в эту ночь, что я ни у кого другого не могу спастись, как только у тебя». От великой радости девственница, бросив всякое сомнение, совершенно предалась Господу и с усердием укрывала святого епископа около шести лет, пока жив был император Констанций: сама умывала его ноги, исправляла все его нужды, добывала и доставляла ему книги. Во всей Александрии никто не знал, где живет блаженный епископ Афанасий. Когда же объявлено было о смерти императора Констанция и слух о том дошел до Афанасия, он облекся в светлые одежды и ночью опять явился в церкви. Увидев его, все пришли в изумление и думали, что он воскрес из мертвых. Друзья между тем жаловались, что, по незнанию, они не могли найти его убежища. Блаженный в оправдание свое говорил искренним своим друзьям и знакомым: «Я для того не укрылся у вас, чтобы вы могли справедливо поклясться, что не знаете моего местопребывания, а, с другой стороны, я опасался обысков, а у нее укрылся потому, что никто не мог подозревать меня в этом по причине ее красоты и молодости. Таким образом я соблюл две выгоды: послужил и ее спасению и сохранил собственную честь и безопасность».'
        cn: 我认识一位在亚历山大的贞女，我见到她时，她约有七十岁。整个教士阶层都为她作证，说她年轻时，大约二十岁，且相貌极美，她的美貌使那些有德行的男子避之不及，免得因猜疑而招致任何非议。但有一次，亚略派[44]设计陷害亚历山大主教蒙福的阿塔那修，借着当时在君士坦提乌斯皇帝手下担任首长的优西比乌，诬告他犯有严重罪行。为了躲避不公的审判，蒙福的阿塔那修不愿信任无论是亲戚、朋友、教士，还是其他任何熟人。当城主派来的人意外地来到主教家中并开始搜寻他时，他拿起自己的斯蒂卡尔和费隆，在午夜时分跑到了那位贞女那里。她对这一举动的奇特感到惊讶，并感到有些害怕。但主教对她说：「亚略派正在搜寻我，他们诬告我犯有严重罪行。然而，为了不让自己遭受荒谬的判决，也不让那些希望我被定罪的人陷入罪中，我决定逃走；就在今夜，上帝向我启示，除了你之外，我无法在任何其他人那里得到庇护。」贞女因极大的喜悦，抛弃了一切疑虑，完全将自己奉献给主，并殷勤地藏匿这位圣主教约六年之久，直到君士坦提乌斯皇帝在世：她亲自为他洗脚，料理他的一切所需，并为他获取和送达书籍。整个亚历山大城，没有人知道蒙福的阿塔那修主教住在何处。当君士坦提乌斯皇帝去世的消息公布，且传到阿塔那修耳中时，他穿上明亮的衣裳，并于夜间再次出现在教会中。众人见到他，都大为惊异，以为他从死里复活了。他的朋友们则抱怨，因不知情而未能找到他的藏身之处。蒙福者为自己辩解，对他的真心朋友和熟人说：「我没有藏身于你们那里，是为了让你们可以凭着良心起誓说你们不知道我的住处；另一方面，我也担心被搜查。而我藏匿在她那里，是因为没有人会因此怀疑我，鉴于她的美貌和年轻。这样，我获得了两重益处：既成就了她的救赎，也保全了我自己的名誉和安全。」
  - type: heading2
    text:
      ru: Об Аматалиде
      cn: 关于阿玛塔丽达
    children:
    - type: paragraph
      text:
        ru: В городе Антинои есть двенадцать женских монастырей, где ведут жизнь богоугодную. Там видел я рабу Божию по имени Аматалида, старицу, восемьдесят лет пребывавшую в подвижничестве, как сказывала она сама и другие, с нею жившие. С нею жили шестьдесят отроковиц, которые под руководством сей доброй старицы свято проходили поприще подвижничества. Все они весьма любили ее, безвыходно удерживаемы были в монастыре безмерною любовию к ней и святыми ее наставлениями постепенно усовершались в целомудрии. Старица достигла такой степени бесстрастия, что, когда пришел я к ней и сел, она, пришедши, села подле меня и, по избытку дерзновения во Христе, возложила на мои плечи свои руки.
        cn: 在安提诺伊城里有十二座女修道院，她们在那里过着蒙神悦纳的生活。我在那里见到一位名叫阿马塔利达的神的仆人，一位老修女，正如她自己和与她同住的人所说，她投身苦修达八十年之久。与她同住的有六十名少女，她们在这位仁慈老修女的指导下，圣洁地度过苦修的历程。她们都非常爱她，因着对她无限的爱和她神圣的教导，她们寸步不离地留在修道院里，并逐渐在贞洁中日臻完美。这位老修女达到了如此的无情欲境界，以至于当我来到她身边坐下时，她走过来，坐在我旁边，并因着她在基督里丰盛的坦然无惧，将她的手搭在我的双肩上。
  - type: heading2
    text:
      ru: О девственнице Таоре
      cn: 论贞女塔奥拉
    children:
    - type: paragraph
      text:
        ru: 'В том же монастыре тридцать уже лет жила девственница, именем Таора, ученица той старицы. Она никогда не хотела взять ни новой одежды, ни нарамника[45], ни обуви, говоря: «Я в этом не нуждаюсь, иначе принуждена буду выйти». И в самом деле, когда прочие сестры по господским праздникам собирались в церковь для причащения, она в рубище безвыходно сидела в келии за своим делом. Лицо ее было так благообразно, что даже самый твердый человек, находясь близ нее, мог бы соблазниться ее красотою, если бы она не имела превосходного страха в целомудрии и своею скромностию не приводила в стыд и страх даже самое бесстыдное око.'
        cn: 在同一个修道院里，一位名叫陶拉的贞女，也是那位老修女的门徒，已经住了三十年。她从不愿接受新衣服、肩衣[45]或鞋子，常说：「我不需要这些，不然我就被迫离开了。」事实上，当其他修女们在主的大节日里聚集在教堂里领圣餐时，她就穿着破烂的衣服，足不出户地坐在小室里忙着自己的事。她的面容如此端庄，以至于即便最坚定的人在她身边时，也可能被她的美貌所诱惑，如果她不具备在贞洁中那卓越的敬畏之心，并且不以她的谦逊使人感到羞愧和敬畏，甚至使最不知廉耻的目光也如此。
  - type: heading2
    text:
      ru: Об одной девственнице и Коллуфе
      cn: 关于一位贞女和科卢夫
    children:
    - type: paragraph
      text:
        ru: 'Была и другая истинная девственница, бдительно исполнявшая дело подвижничества. Она жила не в дальнем расстоянии от меня, но я не видел ее в лицо, ибо, как говорили знавшие ее, она никогда не выходила из келии – с тех пор, как отреклась от мира, – и шестьдесят лет провела в подвижничестве вместе со своею матерью. Когда же наконец пришло время перейти ей из сей жизни в жизнь нетленную, явился ей прославившийся мужеством в том месте святой мученик Коллуф и сказал: «Сегодня ты пойдешь к своему Господу и узришь всех святых. Итак, приди разделить вместе с нами трапезу в монастыре». Блаженная, вставши рано поутру, оделась, положила в свою корзину хлеба, оливок и немного овощей и после столь многолетнего своего затворничества отправилась в храм мученика. Здесь она помолилась, села и целый день выжидала удобного времени для вкушения. В девятом часу, когда уже пришло время вкусить пищу и в храме никого не было, она выложила снеди и обратилась к мученику со следующею молитвою: «Благослови, святой Коллуф, снеди мои, и да сопутствуют мне молитвы твои». После сего, севши, вкусила, потом, еще помолившись, пришла домой около захождения солнца и вручила своей матери толкование строматописца Климента[46]на пророка Амоса со следующими словами: «Передай это епископу, посланному в заточение, и скажи ему, чтобы он молился обо мне, ибо я отхожу ко Господу». В ту же ночь она скончалась. Не страдавши ни горячкою, ни головною болью, она сама себя приготовила к погребению и предала дух в руки Божии.'
        cn: 还有另一位真正的童贞女，她警醒地履行着修道事业。她离我住处不远，但我未曾亲见她的面容，因为，据认识她的人说，自从她弃绝世界以来，她从未走出斗室，连同她的母亲一同过了六十年的苦修生活。当她最终从此生过渡到不朽之生的时候来到，因在那地之勇气而闻名的圣殉道者科卢夫显现给她，并说：「今日你将归于你的主，并得见众圣。那么，请来与我们一同在修道院里用膳吧。」这位蒙福者清晨早起，穿上衣服，将面包、橄榄和少许蔬菜放进自己的篮子里，在她如此多年的隐修生活之后，前往殉道者的圣堂。在此她作了祷告，坐下，整日等候用膳的合适时机。在第九时辰，当已到用膳之时，圣堂里已空无一人，她拿出食物，并向殉道者发出了以下祷告：「圣科卢夫啊，请祝福我的食物，愿你的祷告伴随我。」此后，她坐下，享用了食物；然后，再次祷告后，在日落时分回到家中，并将斯托罗马特作家革利免[46]对先知阿摩司书的注释交给她的母亲，并说以下的话：「请把这个交给被发配流放的主教，并请他为我祷告，因为我将归于主了。」就在当夜，她安息了。她既未患热病，也无头痛，她自己为安葬作了准备，并将灵魂交托在上帝手中。
  - type: heading2
    text:
      ru: Об оклеветавшей одного чтеца
      cn: 论诽谤了一位读经士的女人
    children:
    - type: paragraph
      text:
        ru: 'Дочь одного пресвитера в Кесарии Палестинской, девица, пала и научена была соблазнителем своим оклеветать чтеца сего города и на него сложить вину своего срама. Сделавшись беременною, она на расспросы отца своего наименовала чтеца. Услышав это и пришедши в смущение, пресвитер донес епископу, а епископ немедленно созвал церковный совет. Призвали чтеца и стали расспрашивать его, как было дело. Чтец, будучи допрашиваем епископом, не сознавался. И мог ли он сознаться в том, чего не сделал? Разгневанный епископ строжайшим голосом сказал ему: «Так ты не признаешься в преступлении и не раскаиваешься, несчастный и исполненный нечистоты?». «Клянусь тебе, – отвечал чтец, – я сказал сущую правду, что не имею участия в этом деле; я не виновен даже и в помысле о ней. Если же вам хочется, чтобы я сказал то, чего на самом деле не было, то – виноват». Когда он сказал это, епископ отрешил его от должности чтеца. После сего чтец бросился к ногам епископа и стал умолять его: «Если за то только, что я сказал: “Да, я пал с нею”, ты, владыко, рассудил лишить меня почетной степени и признал недостойным должности клирика при твоей святости, то повели, чтобы отныне она выдана была в жену мне, ибо и я теперь уже не клирик, и она не девица». Выслушав сие, епископ и пресвитер, отец этой девицы, согласились отдать ее за чтеца в той мысли, что юноша крепко привязан к ней и уже не может оставить связи своей. Юноша, приняв ее в руки от епископа и отца ее, уговорил ее следовать за ним в женский монастырь и упросил настоятельницу оного держать ее до разрешения от бремени.'
        cn: 在巴勒斯坦凯撒利亚，一位长老的女儿，一个处女，堕落了，并被她的诱惑者教唆去诽谤这个城市的读经员，将自己的耻辱归咎于他。怀孕后，她在父亲的盘问下说出了读经员的名字。长老听到这话，感到困惑不安，便禀告了主教，主教随即召集了教会会议。他们召来了读经员，并开始询问他事情的经过。读经员被主教盘问时，没有承认。他怎能承认自己未曾做过的事呢？愤怒的主教以极其严厉的语气对他说：「你竟然不承认罪行，也不悔改，你这可怜又充满不洁的人？」读经员回答说：「我向你发誓，我说的是彻头彻尾的真话，我与这件事毫无瓜葛；甚至连关于她的念头我都没有罪。但如果你们希望我说出那件实际上并未发生的事，那么——我有罪。」他说完这话，主教就解除了他的读经员职务。此后，读经员扑倒在主教脚下，开始恳求他：「主教大人，如果仅仅因为我说『是的，我与她堕落了』，您就判断剥夺我的尊贵圣职，并认为我在您的圣洁之下配不上神职人员的职位，那么，就请您命令从今以后将她许配给我为妻，因为我如今已不再是神职人员，她也已不是处女了。」听完这话，主教和那位长老，也就是这少女的父亲，同意将她嫁给读经员，他们心想，这年轻人对她情深意切，已经无法割舍他们的关系了。这年轻人从主教和她父亲手中接过她后，说服她跟随他去一座女修道院，并恳求那里的女院长收留她直到分娩。
    - type: paragraph
      text:
        ru: Оставивши девицу в монастыре, сам чтец заключился в нечистую келию и стал вести жизнь крайне суровую, припадая ко Христу с сокрушенным сердцем, со многими слезами и стенаниями. «Ты знаешь, Господи, мои дела, – говорил он, – потому что Ты знаешь все и от Тебя ничто не сокрыто. Нет ни одного тайного места, в котором бы можно было укрыться от Твоей всепроницающей силы. Ты знаешь все, прежде нежели что случится. Ты один зришь глубины помышлений и всякое движение мысли видишь ясно. Ты строгий испытатель всего, что таится в душе, и Судия Праведный. Ты помощник обидимых. Ты Сам защитник оклеветаемых, недоступный никакому обману, ибо всякая неправда Тебе не угодна и весы правды Твоей всегда склоняются на сторону справедливости. Тебе всегда присущ свет неприступный, и всякое дело человека совершается в очах Твоих! Итак, Твоему праведному и неизменяемому суду предлежит открыть и мою правду».
        cn: 留下那位少女在修道院里，那位诵经士自己幽居在一间不洁的隐修室里，开始过着极其严苛的生活，向基督俯伏恳求，带着一颗忧伤痛悔的心，许多眼泪和哀叹。「主啊，祢知道我的行为，」他说道，「因为祢知道一切，在祢面前无所隐藏。没有一个隐秘之处可以躲避祢无所不透察的能力。在事情发生以先，祢就知道一切。唯有祢洞察思想的深处，并且清晰地看到每个意念的波动。祢是严厉的考验者，考验灵魂中隐藏的一切，也是公义的审判者。祢是受欺压者的帮助。祢是受毁谤者的亲自捍卫者，任何欺骗都不能蒙蔽祢，因为一切不义都不蒙祢喜悦，并且祢公义的天平总是倾向于公正。不可接近的光常与祢同在，并且人的每一件事都在祢眼中成就！因此，祢公义而不改变的审判将揭示我的公义。」
    - type: paragraph
      text:
        ru: 'Между тем как юноша прилежно молился и с терпением пребывал в посте, уже приближалось для девицы время родов, а когда настало это время, начал открываться и праведный суд Божий, который подверг клеветницу жестокому и нестерпимому страданию. Безмерное множество стенаний, несказанные муки рождения, страшные видения адских мук сильно терзали несчастную: младенец не выходил из чрева. Прошел день, другой – муки становились несноснее; настал третий, четвертый – мучение в тысячу крат стало тяжелее; затем следовал день пятый, шестой и самый тяжкий седьмой, и несчастная от сильного мучения была при дверях смерти. Во все дни она и пищи совсем не принимала, и сна нисколько не имела. Но вслед за болезнями рождения, беспрестанно возраставшими с новою силою, по молитвам юноши преклонилось наконец сердце грешницы и лжесвидетельницы, доселе не преклоненное неимоверными страданиями. Она призналась, и признание ее сопровождалось жалобными воплями. «Увы мне несчастной! – вопияла она. – Мне предстоит опасность погибнуть – мне, отягченной двумя грехами: клеветою и блудом; погубила я свое девство и отдалась на позор; меня осквернил другой, а я обвинила чтеца». Услышав сие, девственницы монастыря обо всем объявили отцу ее. Отец, опасаясь, чтобы не признали его участником в клевете, не поверил сказанному и умолчал обо всем. Но праведный суд Божий, все открывающий, продолжал поражать несчастную непрестающими скорбями. Когда она уже не в силах была переносить борьбу между жизнию и смертию, а между тем не переставала мучиться, настает восьмой день, потом девятый, которые покрыли несчастную глубочайшею тьмою неутихающих мук.'
        cn: '当那少年虔诚祈祷并耐心守斋之时，那少女的产期已然临近。当此时刻到来，上帝公义的审判也开始显明，使那诬告者承受了残酷且无法忍受的痛苦。无数呻吟、难以言喻的生产之苦、地狱般可怖的景象强烈地折磨着这不幸的女子：胎儿无法从母腹中降生。一天过去，两天过去——痛苦变得愈发难以忍受；第三天，第四天到来——折磨沉重了千百倍；接着是第五天，第六天，以及最煎熬的第七天，这不幸的女子因剧烈的折磨已濒临死亡。在这些日子里，她滴食未进，也丝毫未能入睡。


          然而，伴随着生产之痛不断以新的力量加剧，凭着那少年的祷告，这罪人兼假见证者的心终于被软化了，此前，即便难以置信的苦难也未能使其屈服。她坦白了，她的坦白伴随着悲切的哭嚎。「我这不幸之人啊，哀哉！」她哭喊着说，「我正面临灭亡的危险——我这身负两重罪孽之人：诬告与淫乱！我玷污了自己的贞洁，将自己置于羞耻之中；他人玷污了我，而我却指控了诵经员。」众修女闻此言，便将一切告知了她的父亲。父亲害怕自己被视为诬告的同谋，不相信她所说的，并对此事保持沉默。


          然而，上帝公义且揭示一切的审判，继续以不止息的痛苦击打这不幸的女子。当她已无力承受生与死的挣扎，却仍在不停地受苦时，第八天，然后第九天降临了，将这不幸的女子笼罩在永不止息的苦难最深沉的黑暗之中。'
    - type: paragraph
      text:
        ru: Сильные вопли ее стали наконец невыносимы для окружавших ее, и они поспешно дали знать епископу, что вот уже теперь девятый день, как такая-то признается, что она напрасно обвинила чтеца и потому не может родить, что оклеветала его. Епископ, выслушав девственниц, послал к чтецу двух диаконов объявить ему о всем и сказать, чтобы он помолился об избавлении несчастной жены от мучения. Но твердый юноша не дал им ответа и даже не отворил дверей. Со времени удаления в келию он постоянно выполнял обычное правило поста и молился Богу. Наконец отец сжалился над своею дочерью и, пришедши к епископу, неотступно просил его принести о ней молитвы в церкви. Но, когда и всеми совершена была молитва ко Господу, и тогда несчастная не избавилась от мучения, ибо молитвы оклеветанного о его оправдании, преклоняя Господа, препятствовали услышанию молитв церкви.
        cn: 她强烈的哭喊声最终让周围的人无法忍受，他们赶紧通知了主教，说如今已经是第九天了，某某人承认她诬告了诵经士，因此无法生产，因为她诽谤了他。主教听了童贞女们的话后，派了两位执事到诵经士那里，把一切都告诉他，并请他为那不幸的妇人脱离苦难而祈祷。但这位坚定的年轻人没有给他们任何答复，甚至连门都没有打开。自从他隐退到小室后，他就一直遵守着惯常的斋戒规条，并向上帝祈祷。最后，那父亲怜悯自己的女儿，来到主教那里，恳切地请求他在教会中为她献上祷告。然而，即使所有人都向主献上了祷告，那不幸的妇人仍未脱离苦难，因为那被诽谤者为自己得到昭雪的祷告，感动着主，阻碍了教会祷告的蒙听。
    - type: paragraph
      text:
        ru: 'При таких обстоятельствах епископ решился сам идти в келию, в которой находился чтец, и, когда он стал стучаться в дверь, чтец не хотел ему отпереть. Епископ, долго простояв за дверью, тогда как тот находился внутри, приказал наконец снять двери. Нашли юношу в усердной молитве, простертым на земле, и епископ, после долгих увещаний, поднял его и сказал: «Брат, чтец Евстафий! По смотрению Божию, клевета открыта, молитвы твои услышаны; сжалься же над согрешившею пред тобою, которая измучилась от тяжких страданий; прости ей грехи, ибо по твоим молитвам она терпит сие; скажи ко Господу, да разрешит ее от бремени». Когда же достопочтенный чтец усердно помолился вместе с епископом, нечастная тотчас освободилась от мучения, родила дитя и стала просить всех, чтобы простили ей беззаконие ради молитв праведника, которого за мужество с сих пор все ставили в чине мучеников, ибо, сложив с себя все заботы, он восшел на такую высоту добродетели, что удостоился дара духовного.'
        cn: 在这种情况下，主教决定亲自前往读经士所在的小室。当他开始敲门时，读经士不愿给他开门。主教在门外等了许久，而那人仍在里面，他终于下令把门拆下来。他们发现这年轻人正俯伏在地，恳切祷告。主教经过长时间的劝诫，将他扶起并说：「弟兄，读经士欧斯塔菲！按照上帝的旨意，诬告已被揭露，你的祷告已被垂听；怜悯这在你面前犯了罪的人吧，她已因沉重的苦难而受尽折磨；赦免她的罪过，因为她因你的祷告而承受这一切；向主呼求，愿祂解除她的重担。」当这位可敬的读经士与主教一同恳切祷告时，这不幸的女人立刻从痛苦中解脱出来，生下了孩子，并开始请求所有人赦免她的罪孽，因为这位义人的祷告。从那时起，所有人都因他的英勇而将他视为殉道者，因为他卸下了一切世俗的挂虑，达到了如此崇高的美德，以至于蒙受了圣灵的恩赐。
    - type: paragraph
      text:
        ru: Сие написал я, чтобы за клевету никто не попал в сети врага и не подвергся несносным страданиям в сей жизни, как случилось с упомянутою лжесвидетельницею, а по отрешении от плоти чтобы не был предан мукам вечным и нескончаемым, ибо клеветник прогневляет Бога. А кто, будучи оклеветан, терпит благодушно и молитвою достигает обнаружения клеветы в ожидании праведного суда Божия, тот, подобно оному чтецу, увенчанному Христом, и здесь, сколько можно, прославится и удостоится вечных венцов. Итак, познаем верно непобедимую силу молитвы, которая утверждает верующих, милует грешников, помогает упражняющимся в добродетели, преодолевает всякое создание, преклоняет Создателя всех, доставляет венцы провождающим благочестивую жизнь, обличает клеветников и дарует Царствие Небесное тем, которые с твердостию терпят клевету.
        cn: 我写下这些，以免有人因诽谤落入仇敌的网罗，并且在此生遭受难以忍受的痛苦，正如那位被提及的假见证者所遭遇的；而在肉身脱离之后，不致被交付永恒和无尽的折磨，因为诽谤者触怒了上帝。而那些被诽谤，却心平气和地忍受，并藉着祷告使诽谤得以显明，等候上帝公义审判的人，就像那位被基督加冕的读者一样，在此世，尽可能地得以荣耀，并配得永恒的冠冕。因此，我们确实要认识祷告那不可战胜的力量，这力量坚固信徒，怜悯罪人，帮助在美德中操练的人，胜过一切受造之物，使万物的创造者屈服，赐予过敬虔生活的人冠冕，揭露诽谤者，并将天国赐给那些坚定忍受诽谤的人。
  - type: heading2
    text:
      ru: О Сальвии
      cn: 关于萨尔维
    children:
    - type: paragraph
      text:
        ru: 'В это время случилось, что нас, несколько братий, отправилось из Элии в Египет, чтобы проводить блаженную деву Сальвию, сестру эпарха Руфина. С нами был Ювин, тогда еще диакон, а теперь уже епископ Церкви Аскалонской, – муж благочестивый и ученый. Когда мы пришли в Пелузию, стало чрезвычайно жарко, и Ювин, взяв рукомойник, вымыл себе холодною водою руки и ноги, потом разостлал на земле кожу и прилег отдохнуть. Заметив это, блаженная Сальвия, как умная мать, заботящаяся о родном сыне, стала упрекать его, что он нежит свое тело, и сказала: «Зачем в таких летах, когда еще кипит в тебе кровь, ты нежишь свое тело, как будто не знаешь, какой может быть от этого тебе вред? Поверь сын, продолжала она, вот теперь мне уже шестьдесят лет, а я, кроме оконечностей пальцев, и то когда только готовилась к причащению, не умывала ни лица, ни ног, ни другой какой части тела. Когда мне случалось страдать от различных недугов и врачи принуждали меня пользоваться банею, я не решалась отдать долг плоти, не ложилась спать на постель, не позволяла в дороге носить себя на носилках».'
        cn: '此时恰逢，我们几位弟兄从埃利亚前往埃及，去送别蒙福的童贞女萨尔维娅——鲁菲努斯省督的妹妹。与我们同行的有尤温，当时他还是执事，而现在已经是阿斯卡隆教会的主教了，他是一位虔诚博学的人。当我们抵达佩卢西翁时，天气变得异常炎热，尤温拿起盥洗器，用冷水洗了手脚，接着在地上铺开一张皮子，躺下休息。


          蒙福的萨尔维娅注意到这一点，她像一位关心亲生儿子的明智母亲，开始责备他，说他过分娇养自己的身体，并说道：「你年纪轻轻，血气方刚之时，何以如此娇养身体，难道你不知道这会给你带来何种害处吗？孩子，你相信我，」她继续说，「我如今已六十岁，而我除了手指末端——并且也只在预备领受圣餐时才洗——从未洗过脸、洗过脚，也未洗过身体其他任何部位。每当我患上各种疾病，医生强迫我沐浴时，我都不敢『偿还肉体的债务』，从未在床上睡觉，在路上也从未允许自己被担架抬着。」'
    - type: paragraph
      text:
        ru: Сальвия была весьма учена, любила божественные книги, ночи обращала в дни, употребляя на освещение множество масла, и перечитывала все сочинения древних толковников, в числе которых – три миллиона объяснительных стихов Оригена, двести пятьдесят тысяч – Григория, Пиерия, Стефана, Василия и других ученых. Она не пробегала их только, как случилось, но с большим вниманием прочитывала каждую книгу раз семь или восемь. Чрез это, освободившись от лжеименного знания, она сперва окрылилась благодатию Божиею, потом силою духовных слов и благих надежд. Таким образом, сделав себя духовною птицею и пролетев сквозь мрак этой жизни, она воспарила ко Христу, чтобы принять от Него бесконечные награды.
        cn: 萨尔维娅博学多才，热爱属神之书，她将夜晚变为白昼，耗费大量灯油照明，反复研读所有古代解经家的著作，其中包括奥利金的三百万行解释性诗文，以及格里戈里、皮耶里亚、斯特凡、瓦西里及其他学者的二十五万行。她并非只是随便浏览，而是极其专注地将每本书阅读七八遍。借此，她脱离了那伪称的知识，首先蒙受了上帝的恩典而得以展翅，接着被属灵的话语和美好的盼望的力量所充盈。如此一来，她将自己化为一只属灵的飞鸟，飞越了此生的黑暗，向基督高飞，以便从祂那里领受无限的奖赏。
  - type: heading2
    text:
      ru: Об Олимпиаде
      cn: 关于奥林匹亚
    children:
    - type: paragraph
      text:
        ru: 'По стопам ее шла и всем добродетелям святой духовной жизни ее подражала достохвальная Олимпиада, которая с великою ревностию восходила по пути, ведущему на небо, и во всем последовала правилам Божественного Писания. По плоти была она дочерью проконсула Селевка, а по духу – истинным чадом Божиим, внучкою эпарха Авлавия и несколько дней невестою Невридия, эпарха константинопольского, в самом же деле ни за кого не вышла замуж. Говорят, что до самой смерти она пребыла непорочною девою, сожительницею Божественного слова, союзницею истинного смиренномудрия, щедрою помощницею всех нуждающихся. Она раздала все свое чрезвычайно большое богатство и помогала просто всем без различия. Ни город, ни деревня, ни пустыня, ни остров, ни отдаленные страны не были лишены щедрот этой славной девы. Она давала и церквам на священные потребы, помогала монастырям, общежительным обителям, богадельням, темницам, находящимся в изгнании, и вообще рассылала милостыни по всей вселенной. Блаженная дошла до последней степени смирения, далее которого нельзя было достигнуть: жизнь без тщеславия, открытая наружность, нрав искренний, лицо без всяких прикрас, изможденное тело, скромный ум, чуждый гордости рассудок, безмятежное сердце, неусыпное бодрствование, непытливый дух, безмерная любовь, необъятная благотворительность, бедная одежда, чрезмерное воздержание, устремленная к Богу мысль, вечные надежды, неизобразимые дела милосердия – вот ее украшение!'
        cn: 值得称颂的奥林匹娅效法其足迹，并效法她圣洁属灵生命的一切美德，她以极大的热忱攀登通往天国之路，在一切事上都遵循了神圣经文的准则。按肉身而言，她是执政官塞琉古之女；而按灵而言，她是真正属于神的儿女，是大区长官阿布拉维乌斯之孙女，也曾是君士坦丁堡大区长官涅夫里狄乌斯数日之未婚妻，但实际上她从未与任何人成婚。据说，她至死仍是贞洁的童贞女，是神圣圣言的伴侣，是真正谦卑智慧的盟友，是慷慨帮助所有有需要之人。她散尽了自己极其巨大的财富，并且毫无区别地帮助了所有人。无论是城市、乡村、旷野、海岛，还是遥远的国度，都未曾缺少这位荣耀童贞女的慷慨恩惠。她向教会捐赠圣事所需，帮助修道院、共住修道院、贫民收容所、监狱中的人，以及流放者，总之，她将施舍分发到普世各地。这位蒙福者达到了谦卑的极致，无人能超越的程度：毫无虚荣的生命，坦率的神态，真诚的品格，不施粉黛的面容，憔悴的身体，谦逊的心智，不存骄傲的理智，平静的心，不倦的警醒，不妄求的灵，无量的爱，广博的仁爱，朴素的衣着，极度的节制，思想全然归向神，永恒的盼望，难以形容的慈悲善举——这就是她的装饰！
    - type: paragraph
      text:
        ru: Она претерпела много искушений от действия того, кто по своей воле зол и чужд всякого добра; немало подвизалась в брани за божественную истину; дни и ночи проводила в безмерных слезах; повиновалась«всякому созданию человечу Господа ради»(1Пет. 2, 13); со всяким благочестием покорялась своим епископам, почитала священство, уважала клир, благоговела пред подвижничеством, принимала дев, помогала вдовам, питала сирот, охраняла старцев, посещала больных, плакала с грешниками, возвращала на путь заблудших, о всех соболезновала, бедным обильно благодетельствовала, многих жен, бывших за язычниками, наставляла в вере, давала им средство к пропитанию и всею жизнию оставила по себе вечно незабвенное имя благодетельницы. Выкупив из рабства на волю бесчисленное множество рабов, она сделала их равночестными своему благородству, а, вернее сказать, по одежде они казались благороднее этой святой, ибо едва ли можно найти одежду беднее той, какую она носила. Одежда сей святой девственницы даже одетым в изодранное рубище показалась бы ничего не стоящею. Кротость ее была такова, что превосходила простоту самых детей. Никто из близких к ней никогда не замечал, чтобы эта христоносица порицала кого-нибудь. Вся тягостная жизнь ее прошла в сокрушении сердечном и в обильном излиянии слез; скорее можно было видеть во время зноя источник без воды, нежели ее поникшие, всегда созерцавшие Христа очи без слез.
        cn: 她承受了许多试探，这些试探来自那自愿为恶、与一切良善为敌者的作为；她为着神圣的真理奋斗良多；昼夜浸润在无量的泪水中；她「为主的缘故，要顺服人的一切制度」（彼得前书 2:13）；以一切敬虔顺从她的主教们，敬重神品，尊敬圣职人员，崇敬苦修生活，接纳童贞女，帮助寡妇，供养孤儿，守护长者，探望病人，与罪人同哭，使迷途者归正，对所有人都心怀怜悯，慷慨施惠于贫困者，教导许多嫁给异教徒的妇女归信真道，为她们提供生计，终其一生，她为自己留下了一个永世难忘的恩主之名。她将无数奴隶从奴役中赎回，使他们获得自由，并使他们与自己的高贵地位同样尊贵，或者更确切地说，从衣着上看，他们比这位圣女显得更为高贵，因为几乎找不到比她所穿衣物更简陋的了。这位圣洁童贞女的衣着，甚至对那些身穿破烂衣衫的人来说，也会显得一文不值。她的温柔谦和如此，甚至超越了孩童的纯真。任何亲近她的人，从未注意到这位怀有基督者曾责备过任何人。她所有困苦的人生，在心灵的痛悔和丰沛的泪水倾泻中度过；宁可看到酷热中干涸的泉源，也不能看到她那垂下、始终凝视基督的双眼没有泪水。
    - type: paragraph
      text:
        ru: И что я говорю? Чем более останавливаюсь мыслию на рассказе о подвигах и добродетелях этой твердой, как камень, души, тем далее слова мои остаются позади дел ее. И да не подумает кто-нибудь, что я приукрашенно говорю о бесстрастии достохвальной Олимпиады, которая вся была многоценным сосудом Святаго Духа. Я своими глазами видел жизнь и ангельский нрав сей блаженной девы, как духовный и искренний ее друг и ближайший родственник, так что она поручала мне раздавать свое богатство. При всем своем богатстве она нисколько не заботилась о плоти своей, слушалась начальства, повиновалась властям, покорялась епископам, чтила пресвитеров, уважала весь клир и удостоилась исповедничества в борьбе за истину, подвергшись многим бурям тяжких обвинений. Все благочестивые жители Константинополя считают ее по жизни между исповедницами. В подвигах, подъятых для Бога, она нашла себе смерть и, скончавшись в них, стяжала блаженную славу, увенчана и торжествует в бесконечном веке вместе с богоугодными, подобными ей душами, навеки водворилась в нетленных обителях и за благие дела от Господа Бога восприемлет награды.
        cn: 我还能说什么呢？我越是思想这颗坚如磐石的灵魂所行诸善工与德行，我的言语就越是无法企及她的事迹。愿无人以为我是在夸饰言说论及值得赞美的奥林匹娅德的无情欲境，她整个人都是圣灵的宝贵器皿。我亲眼目睹了这位蒙福贞女的生平与天使般的品格，作为她属灵上真诚的朋友和最亲近的亲属，以至于她曾托付我分施她的财富。尽管她拥有巨额财富，她对自己的肉身却丝毫不挂念；她听从首长，顺服权柄，服从主教，尊敬长老，敬重所有圣职人员，并因在真理的斗争中作出了信仰见证而蒙受了尊荣，遭受了许多严峻指控的风暴。君士坦丁堡所有虔敬的居民都将她列为一生中的信仰见证者之一。在为上帝所承受的善工中，她找到了自己的死亡，并在此中安息，获得了蒙福的荣耀，她戴上冠冕，在永恒的世代中与那些讨上帝喜悦的、与她相似的灵魂一同欢庆胜利，永远居于不朽的居所中，并因善行而从主上帝那里领受奖赏。
  - type: heading2
    text:
      ru: О Кандиде
      cn: 关于坎迪达
    children:
    - type: paragraph
      text:
        ru: По следам Олимпиады так же достойно Господа проводила жизнь блаженная Кандида, дочь военачальника Трояна. Она достигла высокой чистоты, прилично украшала церкви, из благоговения к Христовым Таинствам чтила епископов, уважала, как следует, весь клир Христов и, наставив в вере свою дочь, причислила ее к лику дев, как дар Христу из своих недр. Напоследок и сама она целомудрием, чистотою и раздаянием богатства последовала за своею дочерью. Я видел, что эта доблестная жена для измождения плоти трудилась по целым ночам, молола муку своими руками и пекла просфоры. «Так как один пост еще недостаточен, – говорила она, – то я присоединяю к нему изнурительное бдение, чтобы сокрушить похотливость Исава». Она вовсе не употребляла в пищу мяса животных, но ела только рыбу, масло и овощи, а и это лишь по праздникам; во всякое же другое время довольствовалась водою, смешанною с уксусом и сухим хлебом. Проведши такую суровую жизнь, сия достославная жена почила блаженным успокоением и теперь наслаждается вечными благами, уготованными для возлюбивших жизнь добродетельную.
        cn: 效法奥林匹亚，蒙福的坎迪达，将军特洛扬的女儿，同样以配得主的方式度过一生。她达到了崇高的洁净，合宜地装饰教会，出于对基督圣奥秘的虔敬而尊崇主教们，照例尊敬基督的全体圣职人员；并且，在信仰上教导了她的女儿，将她列入贞女之列，作为她从自身献给基督的礼物。最终，她自己也以贞洁、洁净和施舍财物的方式，跟随了她的女儿。我曾亲见这位贞德的妇人，为了磨练肉体而整夜劳作，亲手磨面粉，烘烤圣饼。她说道：「因为单单禁食还不足够，故我再加上艰苦的守夜，以便击碎以扫的情欲。」她根本不吃动物的肉，而只吃鱼、油和蔬菜，并且这些也只在节日时才吃；而在所有其他时间，则以醋水和干面包为满足。度过了如此严峻的生活后，这位可敬的妇人安息于蒙福的安宁之中，现在享受着永恒的福祉，那为那些爱慕德性生活的人所预备的。
  - type: heading2
    text:
      ru: О Геласии
      cn: 论盖拉西奥斯
    children:
    - type: paragraph
      text:
        ru: Подобно сей добродетельной жене, с ревностию проходила путь бессмертия и благочестно несла иго девства славная Геласия, дочь одного трибуна. Сей отличной жене приписывают ту добродетель, что солнце никогда не заходило во гневе ее на раба, или на служанку, или на кого другого. Избежав пути памятозлобия, ведущего к вечной смерти, блаженная прошла путем, который приводит в жизнь вечную.
        cn: '像这位有德行的妇人一样，荣耀的革拉西亚——一位保民官的女儿——也以热诚踏上不朽之路，并虔诚地担负着童贞的轭。

          这位杰出的妇人被归功于一项美德，那就是太阳从不因她对仆人、婢女或任何他人的怒气而西沉。

          这位蒙福者避开了导向永死的怀恨之路，走上了通往永生之路。'
  - type: heading2
    text:
      ru: О Юлиании
      cn: 关于尤利安妮
    children:
    - type: paragraph
      text:
        ru: Одна девица, именем Юлиания, в Кесарии Каппадокийской считалась ученейшею и усерднейшею в вере. Она приняла к себе Оригена, писателя, когда он бежал от гонений язычников, и на собственном иждивении тайно укрывала его у себя два года, питая его от своих трудов. Я нашел это в древней книге, написанной стихами рукою Оригена. Книгу эту отыскал я в Кесарии у девицы Юлиании, когда сам скрывался у нее. Она говорила, что получила ее от Симмаха, толковника иудейского.
        cn: 一位名叫尤利安妮娅的贞女，在卡帕多基亚的凯撒利亚，被认为是最博学且在信仰上最热心的。当著作家奥利振为躲避异教徒的迫害而逃亡时，她收留了他，并自费秘密地将他藏匿在家中两年，靠自己的劳作供养他。我在奥利振亲手用诗歌形式写成的一本古老的书里找到了这个。这本书是我本人藏匿在贞女尤利安妮娅那里的时候，在凯撒利亚从她那里找到的。她说这本书是她从犹太人解经家辛马库斯那里得到的。
    - type: paragraph
      text:
        ru: Я изложил добродетели этих славных жен не без цели, но чтобы знали мы, что из разных случаев, если захотим, можно извлекать многоразличную пользу.
        cn: 我陈述这些光荣女性的美德并非没有目的，而是为了让我们知道，如果我们愿意，可以从各种情况中汲取多方面的益处。
  - type: heading2
    text:
      ru: Рассказ Ипполита, друга апостольского
      cn: 使徒的朋友希坡吕托斯的记述
    children:
    - type: paragraph
      text:
        ru: 'В другой книге, надписанной именем Ипполита, друга апостольского, я нашел следующий рассказ. В Коринфе была одна благороднейшая и прекраснейшая дева, подвизавшаяся в жизни добродетельной. Во времена гонителей ее оклеветали пред тогдашним судиею-язычником, будто она худо отзывалась о тогдашних временах, о царях и идолах. Торгующие развратом сверх того выставили на вид женолюбивому и нечестивому судие ее красоту, и он скотскими ушами и похотливыми помыслами охотно принял обвинение. Когда же дева была приведена к этому злодею, он еще более вознеистовствовал похотию. Нечестивец обратил против нее все свои ухищрения, но, не могши склонить рабу Божию, подверг ее различным мучениям. Встретив и здесь неудачу и не имея сил отклонить ее от исповедания Христа, пылавший страстию к ней варвар предал ее такому поруганию: он отослал целомудренную деву в бесчестный дом и велел сказать его содержателю: «Прими ее и ежедневно доставляй мне за нее три златницы». Содержатель, добывавший золото постыдным делом, стал предлагать ее в своем непотребном доме кому угодно. Узнав об этом, люди распутные, подобно коршунам, бросились в непотребный дом, отдавали деньги за сквернодейство и хотели склонить ее к растлению. Но целомудренная дева отклоняла обольстительные их речи и усильно упрашивала их оставить свои намерения, называя себя больною. Они верили ее словам, и блаженная удалила от себя на несколько времени неистовых, а сама обратилась к Богу с усердными молитвами и сокрушенною мольбою преклонила Его к милосердию. Бог сердцеведец видел, как от всего сердца целомудренная дева берегла свою непорочность и, как Хранитель спасения всех людей, устроил в сии дни следующее.'
        cn: 在另一本署名为使徒之友伊波利特的书中，我找到了以下记载。在科林斯，有一位极其尊贵且美丽贞洁的处女，致力于过着德行的生活。在迫害者当政时期，她遭到诬告，在当时的异教法官面前，说她对当时的时代、君王和偶像出言不逊。那些从事败德勾当的人，除此之外，还特意向那位好色不虔的法官展示了她的美貌，他便用禽兽般的耳朵和淫邪的意念，欣然接受了这指控。当这贞洁的处女被带到这个恶人面前时，他的淫欲更加狂乱。这不虔敬之人对她施展了所有诡计，但无法使这位神的仆人屈从，于是将她 подвер以各种酷刑。在此也遭遇失败，且无力使她放弃对基督的信仰，那对她充满淫欲的野蛮人，便使她蒙受了这样的羞辱：他将这贞洁的处女送到一个下流的场所，并命人告知其主事者：「收下她，并且每天为她向我交付三枚金币。」那主事者，靠着可耻的勾当赚钱，便在他那污秽的场所里，随意地将她推介给任何人。获悉此事后，那些放荡之人，如同秃鹫一般，蜂拥至那污秽的场所，支付金钱以行不洁之事，并意图诱惑她堕落。但这贞洁的处女拒绝了他们诱惑的言语，竭力恳求他们放弃其意图，声称自己生病了。他们相信了她的话，这蒙福之人便暂时将那些狂暴之徒驱离，而她自己则向神献上热切的祷告，以痛悔的恳求打动了祂的怜悯。洞察人心的神看见了这贞洁的处女如何全心守护她的纯洁，并且作为全人类救恩的守护者，在这些日子里安排了以下之事。
  - type: heading2
    text:
      ru: О Магистриане
      cn: 关于玛吉斯特里安娜
    children:
    - type: paragraph
      text:
        ru: 'Один юноша, именем Магистриан, прекрасный по наружности, благочестивый по душе, воспламененный от Бога духовною ревностию до презрения смерти, под предлогом распутства в глубокий вечер вошел к содержателю дома и, давши ему пять златниц, сказал: «Позволь мне пробыть ночь с сею девою». Вошед с нею в особую комнату, он сказал ей: «Встань, спасайся, – и, сняв с нее одежду, надел на нее свое платье, тунику, плащ и все мужское и сказал ей: – Закройся полою плаща и выйди». Она так и сделала и, всю себя оградив знамением креста, вышла из сего места нерастленною, неоскверненною и совершенно спасена была благодатию Христовою и старанием юноши, который собственною кровию освободил ее от бесчестного растления. На следующий день дело было узнано и Магистриан приведен к жестокому судие. Нечестивый подверг допросу славного мученика Христова и, узнавши все, приказал бросить его зверям, чтобы и в этом посрамлен был диавол, ненавистник всякого добра, ибо, думая подвергнуть мужественного юношу постыдному наказанию, он сделал его вдвойне мучеником Христовым. Магистриан и за свою бессмертную душу мужественно подвизался, и за славную и блаженную деву доблестно перенес страдания, потому и удостоился двоякой чести от Христа и славных блаженных венцов от Его человеколюбия.'
        cn: 有一个名叫马吉斯特里安的少年，外貌俊美，内心虔诚，被上帝点燃了属灵的热忱，以至于轻看死亡。他假借放荡之名，在深夜进入一位院主的家中，交给他五枚金币，说：「请允许我与这位少女共度一夜。」他与她一同进入一个单独的房间，对她说：「起来，得救吧！」然后，他脱下她的衣服，给她穿上自己的衣裳、束腰外衣、斗篷以及所有男装，对她说：「用斗篷遮盖自己，然后出去。」她照做了，并且全身划上十字圣号，贞洁无损、未被玷污地离开了此地，完全借由基督的恩典和这少年的努力得救了。这少年以自己的鲜血使她脱离了可耻的败坏。次日，此事被发现，马吉斯特里安被带到一位残暴的审判官面前。那邪恶的审判官审问了基督这位光荣的殉道者，了解了一切后，下令将他投入野兽之中，好让魔鬼，那一切良善的仇敌，也因此事蒙羞受辱。因为，魔鬼本以为能使这位勇敢的少年遭受可耻的惩罚，结果却让他成了基督的双重殉道者。马吉斯特里安不仅为了自己的不朽灵魂英勇争战，也为了那位光荣且蒙福的少女勇敢承受了苦难，因此蒙基督赐予双重的荣耀，并从祂的仁慈那里获得了光荣且蒙福的冠冕。
  - type: heading2
    text:
      ru: О жене одного сановника
      cn: 关于一位显贵的妻子
    children:
    - type: paragraph
      text:
        ru: 'Помню я еще одну историю, которую полезно пересказать. Говорят, что гонитель Магнентин, имея преступные связи со многими язычницами, старался завести такие же с христианками. Но последние желали лучше умереть, чем продать свое целомудрие. Когда Магнентин прибыл в один город, ему понравилась жена одного советника при градоначальнике. Устрашенный муж ее сказал Магнентину: «Пошли, возьми ее». За нею присланы были солдаты, но она сказала им: «Погодите немного, пока я займусь обычными своими нарядами». Она пошла в спальню, взяла меч и пронзила им свое чрево. Слушайте и устыдитесь, девы, признающие себя невестами Христовыми и изменяющие Ему своими нечистыми вожделениями. Да дарует Господь каждому из нас хранить целомудрие и восклицать с Псалмопевцем:«Пригвозди страху Твоему плоти моя, от судеб Твоих убояхся»(Пс. 118, 120) – и с апостолом:«Живу же не ктому аз, но живет во мне Христос»(Гал. 2, 20). Да будет дано и вам говорить с целомудрием:«Аз брату моему и брат мой мне»(Песн. 6, 2).'
        cn: '我记得还有一个故事，讲出来很有益处。据说，迫害者马格宁丁（Magnentius），与许多异教妇女有不法关系，也试图与基督徒妇女建立同样的关系。但后者宁愿死，也不愿出卖她们的贞洁。当马格宁丁抵达一个城市时，他看上了一位城市行政官手下的一个顾问的妻子。她那惊恐的丈夫对马格宁丁说：「去吧，把她带走。」士兵们被派去带她，但她对他们说：「等一下，等我整理好我平常的装束。」她走进卧室，拿起剑，刺穿了自己的腹部。


          听着，你们这些自称是基督新娘的贞女们，因着你们不洁的欲望而背叛祂的，要感到羞愧！愿主赐予我们每个人保守贞洁，并与诗篇作者一同呼喊：「求你使我因惧怕你而毛骨悚然，我惧怕你的判决」（诗篇 118:120），并与使徒一同说：「现在活着的不再是我，乃是基督在我里面活着」（加拉太书 2:20）。愿你们也能贞洁地宣告说：「我属我的良人，我的良人也属我」（雅歌 6:2）。'
    - type: paragraph
      text:
        ru: Видели мы и других отцов и монахов по всему Египту, которые совершали много знамений и чудес. О них мы не упомянули по причине многочисленности их, но сказали малое вместо многого. Ибо что сказать о Верхней Фиваиде, в которой есть мужи досточудные, есть бесчисленное множество монахов, которых житию иной и не поверит – так оно превосходит обыкновенный образ людской жизни? Они даже и теперь воскрешают мертвых и ходят по водам, подобно Петру. Все, что сделал Спаситель чрез святых апостолов, они совершают и в настоящее время. Но мы не решились видеться с сими святыми мужами по той причине, что если бы перешли за Ликон, то нам предстояла бы большая опасность со стороны разбойников. Даже и тех отцов, о которых сказано, мы видели не без опасности; не без труда также видели и святых жен, но наперед должны были много вытерпеть и даже подвергали опасности жизнь, чтобы видеть их.
        cn: 我们也曾见过遍布埃及各地的其他教父和修士，他们行了许多神迹和奇事。关于他们，我们没有提及，因为他们为数众多，而是只言片语，以少代多。因为，对于上底拜（Верхняя Фиваида），我们又能说什么呢？那里有可敬的圣徒，有无数的修士，他们的生活，旁人甚至不会相信——因为那生活超越了人类寻常的生命模式？他们甚至到现在还能使死人复活，也能行走在水面上，就像彼得（Петр）一样。救主藉着圣使徒所做的一切，他们现在也能做到。但我们没有勇气去见这些圣徒，原因在于如果我们越过利孔（Ликон），就会面临来自强盗的巨大危险。甚至那些已经提及的教父，我们也是冒着危险才见到的；圣洁的修女们，我们也是历尽艰辛才见到的，但首先，我们必须忍受许多，甚至冒着生命的危险，才能见到他们。
    - type: paragraph
      text:
        ru: 'Семь раз мы едва не лишились жизни, а в восьмой один только Бог сохранил нас от смерти, ибо однажды пять суток ходили мы по пустыне и едва не умерли от голода и жажды. В другой раз мы попали в гнилые болота, наполненные острыми каменьями, и изранили себе ноги так, что боль была несносная, и едва не погибли от холода. В третий раз мы увязли в грязи по самые чресла[47], и некому было нас вытащить. Тогда мы воскликнули с блаженным Давидом:«Спаси мя, Боже, яко внидоша воды до души моея. Углебох в тимении глубины, и нестьпостояния... Спаси мя да не углебну»(Пс. 68, 2–3, 15). В четвертый раз мы четыре дня ходили по воде, когда она в большом количестве стояла при разлитии Нила, так что при устье его совсем было потонули. Тогда мы воскликнули:«Да не потопит мене буря водная, ниже да пожрет мене глубина»(Пс. 68, 16). В пятый раз попались мы разбойникам на морском берегу, когда шли в Диолк. Они хотели нас поймать и гнались за нами до тех пор, пока наконец мы едва могли переводить дух, ибо они гнались за нами десять тысяч шагов. В шестой раз, во время плавания по Нилу, мы едва не потонули. В седьмой раз, когда мы были на озере Мареотидском, на берегах которого родится хлопчатая бумага, нас выбросило на один небольшой безлюдный остров – тут мы пробыли трое суток под открытым небом и много терпели от стужи и дождя, так как это было пред самым Богоявлением. О восьмом бедствии излишне было бы пересказывать, хотя и не бесполезно. Когда мы шли в Нитрийскую гору, в этой стороне была большая яма, в которой осталось много крокодилов после того, как вода ушла с полей. Подошедши к этой яме, мы на краю ее увидели трех крокодилов и подумали, что они мертвые. Но крокодилы вдруг бросились на нас. Мы громко возопили: «Христе! Помоги нам!». И тотчас, как будто Ангел остановил зверей, и они бросились в воду, а мы быстро побежали в Нитрийскую гору и припомнили слова Иова:«Седмижды от бед измет тя, в осмем же не коснеттися зло»(Иов 5, 19). Благодарим Господа, Который избавил нас от стольких опасностей и сподобил видеть много великого.'
        cn: 我们七次险些丧命，而在第八次，唯有上帝保守我们免于死亡，因为有一次我们在旷野行走五天五夜，险些因饥渴而死。另一次，我们陷入腐烂的沼泽，里面满是锋利的石块，划伤了我们的双脚，疼痛难忍，险些冻死。第三次，我们陷在泥浆中直到腰部[47]，且无人能将我们拉出。那时我们像蒙福的大卫一样呼求说：「上帝啊，求你拯救我，因为水已淹没我的灵魂。我陷在深渊的淤泥中，无处立足……求你拯救我，使我不再下沉。」（诗篇 68:2-3，15）第四次，当尼罗河泛滥，河水大量滞留之时，我们在水上行走了四天，以至于在它的河口，我们几乎被完全淹没。那时我们呼求说：「愿洪涛不漫过我，愿深渊不吞灭我。」（诗篇 68:16）第五次，当我们前往迪奥尔克时，我们在海边遭遇强盗。他们想抓住我们，并且追赶我们，直到我们几乎无法喘息为止，因为他们追赶了我们一万步。第六次，在尼罗河航行时，我们险些溺水。第七次，当我们在马雷奥蒂斯湖上时，它的岸边盛产棉花，我们被抛上一个无人居住的小岛——我们在那里露宿了三天三夜，并且饱受寒冷和雨水的侵袭，因为那正是主显节前夕。关于第八次灾难，再叙述或许是多余的，尽管并非无益。当我们前往尼特里亚山时，在这一带有一个大坑，在田野的水退去之后，里面残留着许多鳄鱼。走近这个坑，我们在坑边看到三只鳄鱼，以为它们已经死了。但鳄鱼突然向我们扑来。我们大声呼喊：「基督啊！帮助我们！」就在那时，仿佛有天使阻止了这些野兽，它们便跳入水中，而我们则迅速跑向尼特里亚山，并回想起约伯的话语：「祂必七次救你脱离患难，在第八次，邪恶也必不临到你。」（约伯记 5:19）我们感谢主，祂将我们从如此多的危险中解救出来，并使我们配得看见许多伟大的事。
  - type: heading2
    text:
      ru: О некоем жившем со мною брате
      cn: 关于某位曾与我同住的弟兄
    children:
    - type: paragraph
      text:
        ru: 'Скажу несколько слов о брате, который жил со мною от юности и живет до сих пор, и потом окончу свою речь. Узнал я, что он с давнего времени проводил самую добродетельную жизнь с ревностию и обуздывал страсти. Знаю верно, что он и ел не с жадностию, да и постился не чрезмерно, победил, мне кажется, страсть к сребролюбию, весьма далек был от тщеславия, довольствовался всегда тем, что есть, не украшался одеждами, благодарил, когда ему оказывали презрение или неуважение, подвергался опасностям за искренних друзей, терпел искушения от тысячи и более демонов. Однажды встретился с ним демон и сказал ему: «Дай мне слово согрешить хотя однажды и только назови какую-нибудь богатую и благородную жену – я тотчас приведу ее к тебе». В другой раз демон хульный, нападавший на него в продолжение четырнадцати суток, как он сам мне сказывал, ночью потащил его за ногу и мужским голосом сказал: «Не кланяйся Христу, и я не стану приступать к тебе». А он отвечал: «По тому самому и буду кланяться Ему и славить Его, что ты Его ненавидишь; всегда буду просить Его и, пока во мне дух, не престану молиться Ему, потому что для тебя ненавистно служение Богу».'
        cn: 我要说几句关于一位弟兄的话，他自幼与我同住，并且至今仍与我同住，然后我将结束我的话语。我了解到，他自很久以前就以热切的心过着最有德行的生活，并克制情欲。我确切地知道他吃东西不贪婪，禁食也不过度；我想，他已经战胜了贪爱钱财的情欲，并且远离虚荣；他总是满足于所拥有的一切，不用华服装饰自己；当他受到轻视或不敬时，他反而感恩；他为了真诚的朋友冒生命危险，并忍受了来自一千多个魔鬼的试探。有一次，一个魔鬼遇见了他，并对他说：「你给我一个犯罪的机会，哪怕只有一次，只要你告诉我任何一位富有而高贵的妇人——我立刻会把她带到你身边。」另一次，正如他亲自告诉我，一个亵渎的魔鬼连续十四天攻击他，夜里拽着他的腿，并用男人的声音说：「不要敬拜基督，我就不会再来找你。」而他回答说：「正因为你憎恨祂，我才更要敬拜祂，赞美祂；我将永远向祂祈求，并且，只要我一息尚存，我就永不停止向祂祷告，因为事奉上帝对你来说是可憎的。」
    - type: paragraph
      text:
        ru: 'Обошедши сто шесть городов и во многих пробыв долгое время, он, по милости Христовой, не испытал искушения от жены, даже и во сне, кроме того, что боролся с демоном блуда. Мне известно, что он три раза, имея нужду в пище, получал ее из рук святых Ангелов. Находясь однажды в самой дальней пустыне и не имея с собою совершенно никакой пищи, нашел он три теплых хлеба в милоти, в другой раз – ячменные хлебы, а в третий – вино и хлебы. Известно мне также, что, когда у него не было продовольствия, он услышал голос Ангела: «Поди возьми у такого-то человека масла и хлеба». И он, нисколько не усомнившись, пошел, к кому был послан. А этот человек, увидев его, сказал: «Ты не такой-то ли монах?». «Да, я тот самый», – отвечал он. После сего тот объявил, что хозяин дома приказал дать ему тридцать мер пшеницы и двенадцать секстариев[48]масла. Таким человеком, каков был этот и каким я знал его, могу похвалиться. Знаю, что он плакал о людях, от бедности находившихся в нужде и в недостатке, и отдавал им все, что имел, кроме разве своего тела. Знаю, что он плакал и о грешниках и своими слезами приводил их к покаянию. Он мне сказывал однажды: «Я просил Бога, чтобы Он не наказывал никого, особенно злых богачей, ради того, что они дали мне нечто нужное для пропитания».'
        cn: 走遍了一百零六座城市，并在其中许多地方居住了很长时间之后，他蒙基督的恩典，甚至在梦中也没有经历过来自女性的诱惑，除了与淫欲的魔鬼争战之外。我知道，他曾三次在需要食物的时候，从圣天使手中得到食物。有一次，他在最偏远的旷野里，身边没有任何食物，却在羊皮袍里找到了三个热面包；另一次是大麦面包；第三次是葡萄酒和面包。我也知道，当他没有食物的时候，他听到了天使的声音说：「去向某某人取油和面包。」于是他丝毫没有疑惑，就去了被派往的那个人那里。而那个人看见他，说：「你不是某某修道士吗？」「是的，我就是那个人，」他回答道。此后那人声明，家主吩咐给他三十量小麦和十二塞克斯塔里乌斯[48]的油。我可以以这样一个人，以我所认识的他，来引以为荣。我知道他为那些因贫困而处于匮乏和缺乏之中的人哭泣，并将他所有的一切都给了他们，除了他的身体。我知道他也为罪人哭泣，并用他的眼泪带领他们悔改。他有一次告诉我：「我曾向上帝祈求，不要惩罚任何人，尤其是那些邪恶的富人，因为他们给了我一些生活所需。」
  - type: heading2
    text:
      ru: Заключение
      cn: 结论
    children:
    - type: paragraph
      text:
        ru: Довольно с меня, что я удостоился, по милости Божией, все это упомнить и передать письменно, ибо, думаю, не без воли Божией ты возымел благую мысль приказать моей немощи написать эту книгу и передать письменами жизнь святых и блаженных отцов. А ты, вернейший раб Христов, почтенный Лавс, более всех любезная и близкая мне глава, усердно читая эту книгу, чрез познание добродетельного жития знаменитых подвижников, их деяний, трудов, терпения и такой строгой жизни, доставишь немалую пользу бессмертной душе своей в день воскресения праведных. Следуй им ревностно, питаясь благим и нетленным упованием и смотря всегда на будущие дни как на кратчайшие в сравнении с прошедшими; молись и за меня, сохраняя себя безукоризненным и честным, каковым я тебя знаю, каковым ты был для меня со времени консульства Тациана до сего дня, когда я нашел тебя еще лучшим, почему и сделали тебя начальником (постельничим. –Ред.) при ложе благочестивейшего царя. В ком и такое почетное место, и такое богатство, и власть не ослабили страха Божия, тот вполне принадлежит Христу, Которому сказал диавол:«…сия вся Тебе дам,ащепад поклонишимися». Но его посрамил Господь, сказав:«…иди за Мною»(Мф. 4, 9–10). Подражая Ему, и ты отверг льющееся на тебя богатство и преходящую славу настоящей жизни и возжелал небесной бессмертной жизни и вечного царства, постоянной славы и неизреченных благ,«ихже око не виде, и ухо не слыша, и на сердце человеку не взыдоша»(1Кор. 2, 9), которых наследниками да соделает Господь и нас со всеми святыми патриархами, пророками, апостолами, мучениками и святыми мужами, упомянутыми в этой книге, по благодати Самого Спасителя нашего – Христа, с Которым слава Отцу и Святому Духу во веки веков. Аминь.
        cn: '对我而言，蒙受上帝的恩典，能回忆并笔录下这一切，已然足够；因为我想，你萌生善念，命我这微弱之人撰写此书，以文字记载圣洁蒙福教父们的生平，并非没有上帝的旨意。而你，基督最忠实的仆人，受人尊敬的劳斯，我最亲爱、最贴近的首领啊，恳切研读此书，借由认识著名苦修者的德行生平、他们的行迹、劳苦、忍耐和如此严谨的生活，必在义人复活之日，为你那不朽的灵魂带来莫大益处。


          热切地效法他们，以良善和不朽的盼望为滋养，并始终将未来的日子视作与过往相比最为短暂的；也请为我祷告，保守你自己无瑕且正直，如同我所认识的你，如同你在塔提安执政官时期至今为我所展现的，今日我发现你甚至更臻完善，这也是为何你被任命为那位至虔敬君王寝宫的司寝官（主管寝宫事务的官员。–编者注）。一个人若身居如此尊位，拥有如此财富与权力，而对上帝的敬畏之心仍未减弱，那他便完全属于基督，魔鬼曾对基督说：「……这一切我都要赐给你，如果你俯伏敬拜我。」但主斥责了他，说：「……跟从我」(马太福音 4:9-10)。


          你效法祂，弃绝了涌向你的财富和今生转瞬即逝的荣耀，而渴慕天上的不朽生命、永恒的国度、持续的荣耀和无法言喻的美善，「是眼睛未曾看见，耳朵未曾听见，人心也未曾想到的」（哥林多前书 2:9）。愿主使我们与所有圣洁的列祖、先知、使徒、殉道者以及此书中提及的圣洁之士，都成为这些美善的继承者，借着我们救主基督自身的恩典。愿荣耀归于祂，与父和圣灵，直到永永远远。阿门。'
footnotes:
