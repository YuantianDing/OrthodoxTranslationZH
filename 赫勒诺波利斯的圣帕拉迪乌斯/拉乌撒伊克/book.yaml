  '[23]':
    ru: 'Созомен замечает о Нитрии: «Эту страну называют Нитриею – селитряною, потому что ей сопредельно место, в котором добывают селитру. Там было немалое число монашествующих, но около пятидесяти монастырей, смежных между собою. В иных было общежитие, а в других жили порознь»Созомен. Церковная история. Кн. 6. Гл. 3).'
    cn: '索佐门论及尼特里亚说：

      「这个地方被称为尼特里亚，意为『硝石之地』，因为与它毗邻之处出产硝石。那里有为数不少的修士，且有大约五十座修道院彼此相连。有些修道院实行共住制，而另一些则分居独修。」

      (索佐门. 《教会史》. 卷六. 章三)'
