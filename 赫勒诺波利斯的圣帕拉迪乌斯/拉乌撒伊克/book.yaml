  '[21]':
    ru: 'Руфин так передает слова Анувия: «С того времени как я в гонении   исповедал имя Спасителя нашего, наблюдал я, чтобы после исповедания истины   ложь не выходила из уст моих и чтобы, возлюбив небесное, ничего не любить   мне земного, и благодать Господа в этом мне помогала, ибо при Его содействии   не имел я нужды ни в чем земном и всякую пищу, какой желал я, Он доставлял   мне служением Ангелов» (Там же. Гл.10).'
    cn: 鲁芬如此转述阿努维俄斯的话：「自从我在受迫害中宣认了我们救主的名，我便留意，不让谎言在我宣认真理之后从我口中发出，并且，既已爱慕属天的事物，我便不爱慕任何属地的事物，而主的恩典在此事上帮助了我，因为靠着祂的襄助，我没有任何属世所需，凡我所愿的食物，祂都借着天使的服事赐给了我。」（同上。第10章）
