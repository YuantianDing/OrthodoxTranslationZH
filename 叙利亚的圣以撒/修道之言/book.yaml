  '[35]':
    ru: Этот перевод был издан еще раньше, в 1812 г., Нямецким Молдавским монастырем, но не имел распространения, так как был запрещен тогдашней цензурой. Интересную историю этого перевода см. «Странник», 1906 г., т. 1, ч. 2, 734 и 899 с.
  '[36]':
    ru: Славянские списки с сочинений святого Исаака появились впервые не позже XIV в., к которым принадлежат, например, рукописи со славянским переводом «постнических слов» святого Исаака, принадлежащие Троицкой Сергиевой лавре и Московской духовной академии, также лавре святого Саввы Освященного в Палестине, если судить по надписанию на дошедшем до нас изображении святого Исаака.
  '[37]':
