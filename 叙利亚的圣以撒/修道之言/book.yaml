    ru: Брань сзади, или внешняя борьба, есть смятение, которое производится в душе занятиями, рассеивающими ее внешними вещами, что препятствует ей вести брань спереди, или внутреннюю борьбу против себя самой, с нераздельным вниманием.
  '[450]':
    ru: 'В сирийском тексте это место читается так: «те, которые одержали победу в борьбе внешней, удалили также и внутренний страх; и никакое (вражеское) принуждение не может уже их насильственно увести в плен, терзая их бранью спереди и сзади. Внешней борьбой называю я ту, которую человек возбуждает безрассудно против своей собственной души посредством чувств, именно посредством взятия и давания, слушания и видения, говорения и чревоугодия, и посредством того, что он непрестанно налагает на душу свою много настоятельных дел, так что она, ослепленная смятением, теснящим ее извне, не в состоянии ясно видеть в скрытой, возбужденной против нее брани – и спокойствием побеждать смущения, возникающие внутри ее.'
  '[451]':
