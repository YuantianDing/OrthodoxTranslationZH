  '[691]':
    ru: '«Если же ты еще немощен», т. е. немощен душою, и если, подавая руку помощи тому, кто распущен в жизни своей, можешь впасть в те же страсти, каким подвержен он, то ты должен отвращаться даже и от оказания такой помощи, чтобы, желая уврачевать другого, самому тебе не впасть в болезнь еще худшую. – А что значат слова «дай ему конец жезла твоего» и кому принадлежат они, неизвестно. (Из примечанияНикифора Феотокиса). – Нам думается, что последние слова представляют собою начало пословицы или изречения, смысл которого, вероятно такой: «дай ему конец жезла твоего, и он увлечет тебя к себе вместе с ним», т. е. смысл тот же, что в нашей пхловице: «коготок увяз – всей птичке пропасть»; иначе говоря: «только начни делать что-нибудь дурное, а там уже не остановишься».'
