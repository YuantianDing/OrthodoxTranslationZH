  '[31]':
    ru: 'Любопытен еще отзыв о греческом переводе сочинений святого Исаака, принадлежащийФиларету, митрополиту Московскому: «Вероятно, переводчик не был из ученых, т. е. не знал грамматических правил, и потому мешал слова и вместо должного выражения ставил неправильные и темные слова, да и от переписчиков, быть может, вкрались ошибки и невероятности». См. статью архимандрита Никодима в «Жизнеописаниях отечественных подвижников благочестия XVIII и XIX вв. Сентябрь». М. 1909 г. 487 с.'
  '[32]':
    ru: Он, по всей вероятности, сделан с греческого, потому что он еще темнее последнего. См. примечание на 365 с. 2-го изд. русского перевода.
