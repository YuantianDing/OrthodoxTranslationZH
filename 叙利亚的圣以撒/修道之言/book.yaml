    ru: 'В сирийском тексте все это место (после слов «движется в вещественном») читается так: «Это его материальное направление есть страстное состояние, или отпечатление внешней деятельности. Ибо ум невольно представляет себе также те вещи, посредством которых он совершает добродетели, и ими в немалой степени побуждается к волнению и к собиранию мыслей. Ибо, даже если цель направлена к добру, ум может еще, вследствие недостатка упражнения, быть деятельным в направлении к телесному, хотя не страстным образом и до тех пор, пока ему тайное воздействие мысленных образов не готовит скорби по причине более сильного пламенения благодаря Богу, которое обыкновенно отсекает суетные воспоминания».'
