    ru: 'В греческом тексте стоит здесь слово «безумие»; соответствующее слово стоит и в сирийском тексте. Но в переводах латинском, древнем славянском, сербском и у преп. Паисия поставлено слово «утешение», которое сохранено и в нашем переводе из прежнего издания. В сирийском же тексте сказано так: «...и не ощущает оно (сердце) того безумия, за которое был порицаем апостол, когда говорили, что многие книги сделали его безумным». Тут, очевидно, разумеются слова Деяний апостольских –Деян.26:24: когда он (апостол Павел)«так защищался, Фест громким голосом сказал: «безумствуешь ты, Павел! большая ученость доводит тебя до сумасшествия»». Которое чтение есть истинное, не беремся решать.'
