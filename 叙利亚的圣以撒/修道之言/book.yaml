  '[18]':
    ru: Святой Исаак, часто приводя чужие мысли и слова, иногда указывает имена цитируемых им авторов, но при этом только славных, великих отцов Вселенской Церкви, в других же случаях только указывает, что такую-то мысль сказал «некто из святых», или «некто из любящих Бога», или"один из мужей Богоносных» и тому подобное. Вероятно, среди этих-то безымянных авторов естьи сирийские аскеты-писатели, предшественники святого Исаака.
