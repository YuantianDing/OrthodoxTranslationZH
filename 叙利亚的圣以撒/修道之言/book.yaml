  '[276]':
    ru: Евхитами (греч.), или мессалианами (евр.), в переводе – молящимися, назывались еретики IV в., отрицавшие троичность лиц в Божестве и свою молитву почитавшие единственным средством к спасению. Возникла эта ересь в некоторых монашеских общинах Сирии и Малой Азии. Монахи евхиты утверждали, что, добившись молитвою вселения в них Святаго Духа, они навсегда освобождаются от страстей и наклонности ко злу и не нуждаются ни в подвигах для обуздания тела, ни в чтении Священного Писания, ни в таинствах, ни вообще в каком-либо законе. Они проводили время в праздности, избегая всякого рода труда, как унижающего духовную жизнь, и питаясь только милостыней; в то же время, ощущая в себе мнимое присутствие Святаго Духа, они предавались созерцаниям и, в пылу расстроенного воображения, грезили, что они телесными очами созерцают Божество.
