  '[629]':
    ru: 'В сирийском тексте: «Когда умы святых достигнут созерцания своего естества, исчезает дебелость тела, и потому созерцание делается духовным».'
  '[630]':
    ru: 'Душа без тела имеет свою собственную субстанцию; точно так же и тело без души. Но одно без другого не составляет человека, а лишь соединение их обоих образует одну субстанцию человека. Поэтому соединение души с телом называется субстанциональным (вещественным). Под «вещественным созерцанием» св. отец разумеет созерцание души, находящейся в теле. Поэтому они прибавляет, что если устранить это вещественное созерцание и дебелость тела (т. е. вещество тела), то созерцание делается уже духовным: ибо, по удалении души из тела, прекращается созерцание вещественное (т. е. созерцание в теле), и начинается духовное (т. е. созерцание души, обнаженной от тела). Это бывает после смерти, как утверждает ниже св. отец, говоря: «Это есть высокое состояние, какое дается в свободе бессмертной жизни». – Под словами «тварь первого естества», вероятно, разумеется самое создание человеческой природы, которое было первым не по порядку творения, но по достоинству и милости Божией: именно, во время самого создания душа, соединившись с телом вещественно, начала мыслить и созерцать. (Из примечанияк греческому текстуНикифора Феотокиса.)'
