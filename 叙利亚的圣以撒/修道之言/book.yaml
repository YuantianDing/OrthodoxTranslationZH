  '[687]':
    ru: На первый взгляд может показаться странной мысль, что в правосудии есть часть злобы; но эта мысль верная; надо только понять ее правильно. Возьмем такой случай. Человек занимался убийством, разбоем, кражей в течение многих лет и потом впал в какое-нибудь несчастье. Тот, кто не пожалеет этого преступника, а подвергнет его надлежащей каре, будет справедливым, но не будет милосердным. Таким образом, желающий быть справедливым не может быть милосердным. Поэтому преподобный Исаак и говорит, что милосердие противоположно правосудию. А если правосудие противоположно милосердию, то, значит, в нем есть немилосердие, т. е. злоба. Это не значит, конечно, что правосудие есть порок; оно есть добродетель и одно из свойств Божиих; но это значит только, что оно ниже милосердия, потому что, как говорит апостол Иаков:«милость превозносится над судом»(Иак.2:13). (Из примечанияНикифора Феотокиса).
