  '[9]':
    ru: 'У Ассемана рассказывается, что вскоре же после посвящения святого Исаака во епископы пришли к нему на суд двое тяжущихся. Один из них требовал от другого немедленной отдачи долга, другой же просил себе отсрочки. Святой Исаак стал уговаривать заимодавца подождать долг, согласиться на отсрочку, ибо святое Евангелие учит, чтобы совсем не требовать того, что взято другим. Значит, тем более нужно подождать, пока должник не справится со своим долгом. Но заимодавец на это грубо заметил: «Ну, оставь ты это об Евангелии!» – «Если они и Евангелию не повинуются, то что пришел я сюда делать?» – с грустью сказал святой Исаак.'
