  - type: paragraph
    text:
      ru: Сведения о преподобном Исааке Сирине и его писаниях
  - type: paragraph
    text:
      ru: Сведения о преподобномИсааке Сиринеи его писаниях
  - type: paragraph
    text:
      ru: Целую тысячу лет по смерти преподобногоИсаака Сирина(память 28 января / 10 февраля), именно – с начала VIII в. до начала XVIII в., в Европе ничего не знали о нем, кроме его имени и сочинений. Ученые строили догадки о личности его. Они принимали нашего автора за одно лицо с Исааком, пресвитером Антиохийским, известным полемистом и стихотворцем V в.; другие ученые считали его за одно лицо с Исааком, спасавшимся в Италии около города Сполеты, о котором говорит святительГригорий Двоесловв третьей книге своих «Диалогов»[6]. Греческие же и славянские рукописи с сочинениями преподобного Исаака сообщали, что он был «епископом Ниневийским и отшельником».
  - type: paragraph
    text:
      ru: Так дело обстояло до 1719 года.
  - type: paragraph
    text:
      ru: В 1719 году в Риме вышел в свет первый том «Bibliothecae orientalis clementino-vaticanaë de scriptoribus syris orthodoxis», los. S. Assemani Suri Maronitae.
  - type: paragraph
    text:
      ru: Здесь, на страницах 444–445, помещено составленное анонимным автором, переведенное с арабского языка жизнеописание преподобного Исаака. Это жизнеописание, не говоря точно ни о времени жизни и смерти преподобного, ни о месте его рождения и кончины, дает, однако, довольно много интересных сведений о его жизни.
  - type: paragraph
    text:
      ru: По этому жизнеописанию, преподобный Исаак вместе со своим родным братом поступил в монастырь Map-Матфея[7]. Когда братья стали выдаваться из среды других своей ученостью и подвижничеством, брату Исаака было предоставлено начальствование над монастырем и управление монахами. А Исаак «по исполнении монашеского порядка», т. е. пройдя вполне искус общежития, удалился в отшельническую келлию, находившуюся неподалеку от монастыря, где всецело отдался безмолвию и уединению, отлучивши себя от человеческого общества. И хотя брат настаивал в частых письмах к нему, чтобы он вернулся в монастырь, однако преподобный оставался непоколебим в своем намерении[8]. Когда же слава о его учености и святости жизни распространилась повсюду, он был возведен на епископский престол великого города Ниневии. Но, увидев грубые нравы жителей этого города и чувствуя себя не в силах исправить их[9], и в то же время тоскуя по тишине и миру отшельнической келлии, он отказался от епископства и удалился «в святую скитскую пустыню», где и жил до самой смерти, достигнув высочайшего совершенства в богоугодной жизни. Жил этот святой в начале седьмой тысячи лет от сотворения мира.
  - type: paragraph
    text:
      ru: Вот что узнала о святом Исааке Европа в 1719 г., и только это она и знала о нем до 1886 г., когда французский ученый сириолог аббат Chabot открыл и опубликовал творения сирийского историка VIII века Иезудены, епископа Басры[10].
  - type: paragraph
    text:
      ru: В сочинении Иезудены «de castitate» (de la Chastete), куда автор, по словам сирийского писателя Ebed-lesu, «собрал истории всех святых и основателей (монастырей)», говорится между прочим и о святом «Map-Исааке, епископе Ниневии, который отказался от епископства и написал книги о монашеской жизни».
  - type: paragraph
    text:
      ru: 'Вот что Иезудена рассказывает об этом Исааке:'
  - type: paragraph
    text:
      ru: '«Он был поставлен в епископы Ниневии патриархом Георгом в монастыре Беф-Абэ. После управления своего в течение пяти месяцев Ниневийским диоцезом, в качестве преемника епископа Моисея, он отказался (от епископства) по причинам, Бог знает каким, и удалился жить на гору... Мату (Matout), которая окружает местность Беф-Гузайя (Beit-Houzaye), и жил в уединении вместе с отшельниками, находившимися там. Потом он ушел в монастырь Раббан-Шабур. Он весьма прилежно изучал священные книги, до такой степени, что потерял зрение вследствие пылкости в чтении и своего поста[11]. Исаак был достаточно сведущ в знании Божественных тайн: он составил труды о духовной жизни монахов.'
  - type: paragraph
    text:
      ru: Исаак покинул свою временную жизнь в глубокой старости и сложил свое тело в монастыре Шабур. Он был из Беф-Катарайя (Beit-Kataraye)».
  - type: paragraph
    text:
      ru: Без сомнения, Иезудена говорит о том же святомИсааке Сирине, о котором говорит и анонимный автор у Ассемана, потому что странно было бы думать, что могли быть два Исаака, оба – епископы Ниневии, которые по кратком времени отказались от престола и т.д. Но в то же время эти свидетельства о преподобном Исааке противоречат друг другу в некоторых своих пунктах, и даже весьма резко. Сделаем сравнение их.
  - type: paragraph
    text:
      ru: Иезудена дополняет ассемановский рассказ указанием родины и времени жизни святого Исаака. «Он был, – говорит Иезудена, – из Беф-Катарайя, который, по словам Bedjan'a, находится на берегу Персидского залива, «по сю сторону Индии»[12]. Далее Иезудена говорит, что святой Исаак был поставлен в епископы Ниневии патриархом Георгом в преемники Моисею, а патриарх Георг и епископ Ниневии Моисей жили во второй половине VII в.[13]. Значит, и святой Исаак жил во второй половине VII в., а умер, вероятнее всего, в первой половине VIII-го.
  - type: paragraph
    text:
      ru: О монастыре Map-Матфея Иезудена ничего не говорит.
  - type: paragraph
    text:
      ru: О епископстве и отказе от него оба автора говорят одинаково, но, по Ассеману, святой Исаак удалился после сего в «святую скитскую пустыню», под которой естественнее всего разуметь Египетскую, известную под таким названием, а Иезудена говорит, что святой Исаак удалился жить на гору Мату, окружающую местность Беф-Гузайя (современный Хузистан), которая лежит выше северного берега Персидского залива.
  - type: paragraph
    text:
      ru: Где находился монастырь Раббан-Шабур, куда, по словам Иезудены, удалился под конец жизни святой Исаак, неизвестно. В «studia syriaca» Rahmani есть свидетельство, что святой «Исаак был монахом и учителем на своей родине»[14]. Но трудно решить, относится ли это свидетельство ко времени жизни преподобногодоего епископства или ко времени его жизнипослеепископства[15].
  - type: paragraph
    text:
      ru: Вот все, что можно сказать о святом Исааке. Может быть, в недалеком будущем ученые, усердно занимающиеся теперь открытием и изучением сирийской христианской литературы, и откроют что-нибудь, что дополнит или поправит сказание Иезудены, но пока ничего больше о святом Исааке мы не знаем. В VI-VII вв. в Сирии заметно было «значительное увлечение аскетическим идеалом жизни древней Церкви» или начального монашества[16]. Это увлечение отразилось и в сирийской литературе; поэтому в Сирии появилось за это время довольно много аскетических сочинений[17]. Первое место среди них принадлежит, бесспорно, сочинениям святого Исаака. И теперь даже, когда прошло целых 12 веков со времени их написания, эти сочинения полны свежего интереса, замечательно оригинальны и глубоко поучительны. Святой Исаак – великий психолог и философ, что видно, например, хотя бы из одного его учения о ведении и вере. Он – удивительный знаток Священного Писания Нового и Ветхого Завета и обширной аскетической литературы, греческой и, по всей вероятности, своей родной, сирийской[18]. Он, наконец, мудрый и опытный наставник и руководитель в христианской духовной жизни. «Долгое время искушаемый в десных и шуих, – пишет сам святой Исаак, – многократно изведав себя сими двумя способами[19], прияв на себя бесчисленные удары противника и сподобившись втайне великих вспоможений, в продолжение многих лет снискал я опытность и по благодати Божией опытно дознал следующее»[20], что и предлагает «для возбуждения и просвещения душ» своих читателей[21].
  - type: paragraph
    text:
      ru: 'Святой Исаак был, по-видимому, одним из плодовитейших писателей. По свидетельству сирийского писателя начала XIV в. Ebed-lesu, «святойИсаак Ниневийскийсоставил семь томов о водительстве духа, о Божественных тайнах, о судах и о благочинии (politia)»[22]. Даниил Тубанита, епископ Беф-Гармэ, по свидетельству того же Ebed-lesu, «написал разрешение вопросов божественного пятого тома святогоИсаака Ниневийского»[23]. Что это за «тома», о которых говорит Ebed-lesu, неизвестно, и, по-видимому, они не все до нас дошли. В 1909 году в первый раз вышел в свет печатный сирийский текст святого Исаака под заглавием: «Mar Isaacus Ninivita de perfection religiosa, quam edidit P. Bedjan». Здесь, судя по заглавию, помещено 107 слов, или глав, но издатель говорит, что это только «первая часть сочинения святого Исаака[24], что он мог бы издать и 2-ой и 3-ий тома этого сочинения, если бы только мог сверить имеющиеся у него манускрипты с другими, параллельными[25]. И издатель очень жалеет, что не может этого сделать и издать эти новые тома, жалеет потому, что там «много прекрасных страниц».'
  - type: paragraph
    text:
      ru: В арабском переводе до нас дошли 4 книги сочинений святого Исаака, и в первой книге находится 28 слов, во второй – 45 слов, в третьей – 44 слова, в четвертой – 5[26], всего, значит, 122 слова. В греческом переводе до нас дошло только 86 слов и 4 послания, а в латинском и того менее.
  - type: paragraph
    text:
      ru: Известный нам греческий перевод сочинений святого Исаака издан в 1770 г. в Лейпциге иеромонахомНикифором Феотокисом, впоследствии – епископом Астраханским, по поручению Иерусалимского патриарха Ефрема.
  - type: paragraph
    text:
      ru: 'Перевод этот был сделан первоначально иноками лавры святого Саввы, Аврамием и Патрикеем, вероятно, в IX в.[27], и сделан не во всем удовлетворительно. Кроме того, что он не полон – так как в нем недостает по сравнению с арабским переводом 41 слова[28], а по сравнению с сирийским подлинником и еще больше[29], – он имеет и другие недостатки. Chabot сравнивает его с сирийскими манускриптами и вот что говорит о нем[30]:'
  - type: paragraph
    text:
      ru: '«Первая особенность греческого перевода – это опускание трудных мест, а так какИсаак Сирин– один из труднейших сирийских писателей, то таких опусканий много; вторая особенность – та, что перевод часто не следует смыслу автора, хотя перевод и старается быть буквальным, по словам Chabot, но искажение смысла происходит частью от неумелого выбора значений сирийских слов, частью от самой буквальности: сирийский язык, как и другие восточные языки, весьма отличаясь по своей конструкции от европейских языков, не поддается буквальному переводу на них[31].'
  - type: paragraph
    text:
      ru: Латинский перевод сочинений святого Исаака[32], «de contemptu mundi», помещенный у Mignéя в его патрологии[33], совсем не полон, 53 главы его равняются только 23 словам греческого[34]. Язык перевода, по отзыву Chabot, темнее греческого, и переводчик нередко путает фразы.
  - type: paragraph
    text:
      ru: Печатный славянский перевод принадлежит преподобномуПаисию Величковскомуи издан с примечаниями к нему Оптиной Пустынью в 1854 году[35]. Он – почти точная копия с греческого издания, только некоторые дополнения и порядок слов взяты из одной греческой рукописи и более древних славянских переводов[36].
  - type: paragraph
    text:
      ru: Русский перевод сочинений святого Исаака появился сначала в «Христианском Чтении» за двадцатые годы девятнадцатого столетия. Он делался с греческого изданияНикифора Феотокиса, но было переведено только 30 слов. В 1854 году вышел в свет полный русский перевод с греческого же языка, сделанный Московской духовной академией[37]. Перевод 30 слов в «Христианском Чтении» довольно удачен и олитературен, но зато иногда волен; перевод Московской духовной академии буквальнее, но зато темнее.
  - type: paragraph
    text:
      ru: 'Творения преподобного Исаака всегда пользовались и продолжают пользоваться громадным уважением среди православных подвижников веры и благочестия. ПреподобныйПетр Дамаскин, писатель XII в., обильно пользуется в своих творениях писаниями святогоИсаака Сиринаи постоянно ссылается на него[38]. Преподобный Никифор Уединенник, спасавшийся в XIV в. на Афоне, в своем сочинении «О трезвении и хранении сердца» делает выдержку из творений преподобногоИсаака Сирина[39]. Известный русский святой – преподобныйНил Сорский– в своем «Уставе о жительстве скитском» постоянно приводит мысли святого Исаака по разным вопросам духовно-православной жизни[40]. СвятительФеофан, затворник Вышенский, составил даже молитву преподобномуИсааку Сирину. Вот она:'
  - type: paragraph
    text:
      ru: «Преподобне отче Исаакие! Моли Бога о нас и молитвою твоею озари ум наш разумети высокия созерцания, коими преисполнены словеса твои, и паче возведи или введи в тайники молитвы, которой производство, степени и силу так изображают поучения твои, да ею окриляемые возможем свободно тещи путем заповедей Господних неуклонно, минуя препятствия, встречаемыя на пути, и преодолевая врагов, вооружающихся на нас»[41].
  - type: paragraph
    text:
      ru: 'Настоящее издание перевода слов святогоИсаака Сиринаявляется значительно измененным в сравнении с прежними. Перевод был сверен с переводом преподобного старцаПаисия Величковского, и во множестве мест, где оказывались между ними разногласия по смыслу, или вообще, где русский перевод внушал подозрения, он был сличен с греческим текстом по изданиюНикифора Феотокиса(1770 г.), а в нескольких местах еще и с греческими рукописями Московской Синодальной библиотеки. Но так как и греческий текст представляет собой также перевод, хотя и древний, с сирийского языка, на котором святой Исаак писал, то мы сочли полезным обращаться иногда и к новейшим переводам прямо с сирийского, которые имеются в западно-европейской литературе. К сожалению, с сирийского переведено всего лишь несколько слов, а именно: слова 1, 2, 3, 4, 5, 6, 56, 57, 58, 74, 84 переведены не немецкий язык в издании «Bibliothek der Kirchenvater», выпуск 204–205 (Kempten, 1876); слова 19, 82, 83, 85 и отрывки из других переведены на латинский язык в книге lohannes Baptists Chabot, De S. Isaaci Ninivitae vita, scrip-tis et doctrina (Lovanii, 1892). На эти переводы и делаем мы указания ради краткости просто словами «в сирийском тексте». При просмотре прежнего перевода мы нашли нужным во многих местах изменить его по разным причинам: оказались и важные опечатки, искажавшие смысл, и неверное, по нашему мнению, понимание подлинника, и неловкие или слишком устаревшие русские выражения.'
  - type: paragraph
    text:
      ru: Во многих случаях, ввиду трудности для понимания высоких мыслей святого Исаака, мы сочли необходимым сделать пояснительные примечания к тексту перевода, частью (очень немногие) наши собственные, а большей частью заимствованные нами из примечаний к переводу Паисия в печатном издании 1854 года и из примечаний в греческом изданииНикифора Феотокиса.
  - type: paragraph
    text:
      ru: Кроме того, для настоящего издания вновь составлены сведения о жизни святого Исаака, прибавлены два указателя – мест Священного Писания, упоминаемых в словах, и предметов, о которых говорит святой отец.
  - type: paragraph
    text:
      ru: 'Считаем своим долгом выразить глубокую признательность всем лицам, потрудившимся для этого издания, а именно: М. А. Новоселову и о. Симеону, бывшему ректору Тамбовской семинарии, которые сличали прежний перевод с переводом Паисия, причем первый, кроме того, держал корректуру и составил указатель предметов, а второй составил указатель мест Священного Писания; а также священнику о. И.Н. Четверухину, который написал сведения о жизни святого Исаака, просмотренные потом преосвященным ректором, епископом Феодором.'
  - type: paragraph
    text:
      ru: Несомненно, и в настоящем издании найдется немало недочетов; но читатели, знакомые с греческим текстом, надеемся, простят нам недосмотры и ошибки, зная, как неясен этот текст, смысл которого приходится иногда скорее угадывать, чем переводить.
  - type: paragraph
    text:
      ru: Профессор Московской духовной академии Сергий Соболевский
