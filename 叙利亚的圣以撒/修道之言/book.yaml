    ru: Преподобный Исаак различает здесь вид знания сущих по естеству и вид знания сущих чрез естество. Первый же противен чистоте, а второй должен быть забыт для достижения чистоты. Вид знания сущих чрез естество есть знание вещей не просто по естеству, но с примешением мыслей, происшедших от употребления вещей не по естеству, а по страсти. Так, представление в мыслях золота как создания Божия есть знание сущего по естеству; а представление золота с корыстным вожделением есть знание сущего чрез естество.
