  '[11]':
    ru: Есть предание, что святой Исаак, ослепнув, не прекратил своих литературных занятий, но прибег к помощи писцов-монахов, коим и диктовал свои сочинения. О посте святого Исаака предание говорит, что святой питался только тремя небольшими хлебцами в неделю с малым количеством травы, к вареной же пище и не касался. См. «avant-propos» к изд. «Mar-lsaacus Ninivita de perfectione religiosa», P-Bedjan. Paris. 1909 r. IV с.
