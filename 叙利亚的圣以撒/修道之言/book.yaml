  '[700]':
    ru: 'См.3Цар.21:27–29. Преподобный Исаак хочет этим сказать, что покаяние Ахава выразилось только внешним образом: он «разодрал одежды свои и возложил на тело свое вретище, и постился, и спал во вретище, и ходил печально». Так сказано в еврейском тексте этого места книги Царств, которым, по-видимому, пользовался преподобный Исаак; но в греческом тексте есть слова, которых нет в еврейском и из которых видно, что покаяние Ахава было не только внешним, а именно: сказано, что он «умилился пред Господом, ходил и плакал».'
