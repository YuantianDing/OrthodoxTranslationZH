  '[29]':
    ru: По сравнению арабского перевода с сирийским списком сочинений святого Исаака у Chabot (Opcit. 36–53 pp.), в арабском недостает 19, 21, 24, 37, 57, 59, 71, 74, (85–87, 89) слов по спискуChabot.
