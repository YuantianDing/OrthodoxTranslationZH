title:
  ru: Толкование на Евангелие от Луки
  cn: 路加福音注释
authors:
- ru: блаженный Феофилакт Болгарский
  cn: 保加利亚的福音神学家费奥菲拉克特
document:
- type: heading4
  text:
    ru: Введение
    cn: 导言
  children:
  - type: paragraph
    text:
      ru: Предисловие
      cn: 序言
  - type: paragraph
    text:
      ru: Нам неизвестно в точности, кем был по происхождению святой апостол и евангелист Лука.
      cn: 我们并不知道，圣使徒及传福音者路加的出身究竟如何。
  - type: paragraph
    text:
      ru: Он родился в Антиохии, и потому принято считать, что св. Лука был, по своему происхождению, язычник, принявший иудейство.
      cn: 他生于安提阿，因此人们普遍认为，圣路加就其出身而言，是一位皈依了犹太教的异教徒。
  - type: paragraph
    text:
      ru: По роду своих занятий он был врачом, церковное предание присовокупляет к этому, что он был также живописцем.
      cn: 按其职业而言，他是一名医生；教会传统加之说明，他也是一名画家。
  - type: paragraph
    text:
      ru: Св. Лука принадлежит к числу семидесяти учеников Христовых. Древнее предание свидетельствует, что ему вместе с Клеопой явился воскресший Господь (Лк. 24, 13–33). Из книги Деяний апостольских видно, что, начиная со второго путешествия св. апостола Павла, Лука делается его постоянным сотрудником и почти неразлучным спутником, не покидая его даже в узах.
      cn: 圣路加属于基督七十门徒之列。古老的传统证明，复活的主曾与革流巴一同向他显现（路加福音 24:13-33）。从《使徒行传》中可见，从圣使徒保罗的第二次旅程开始，路加就成了他恒常的同工和几乎形影不离的伴侣，甚至在他身处枷锁之中时也未曾离弃他。
  - type: paragraph
    text:
      ru: Есть сведения, что после смерти апостола Павла св. Лука проповедовал и умер мученической смертью в Ахаии.
      cn: 有史料记载，使徒保罗殉道后，圣路加曾在亚该亚传道，并死于殉道。
  - type: paragraph
    text:
      ru: Свое Евангелие св. Лука написал по просьбе некоего знатного мужа, «достопочтенного Феофила», жившего в Антиохии, для которого он написал затем и книгу Деяний апостольских. Евангелие, по мнению ряда исследователей, написано в Риме не позже 62 года по Р.X. Св. Лука пользовался не только повествованиями очевидцев служения Господа, но и некоторыми, уже существовавшими тогда письменными записями о жизни и учении Господа. По его собственным словам, это повествование и письменные записи были подвергнуты им самому тщательному исследованию, а потому и Евангелие его отличается особой точностью и в определении времени и места событий и строгой хронологической последовательностью.
      cn: 圣路加是应一位居住在安提阿（Antioch）的「可敬的提奥菲洛斯」（достопочтенного Феофила）这一显贵男士的请求而撰写了他的福音书，之后他又为这位男士撰写了《使徒行传》一书。一些研究者认为，这部福音书不迟于公元后 62 年写于罗马。圣路加不仅使用了主事奉活动的目击者的叙述，也使用了当时业已存在的某些关于主生平与教导的书面记录。用他自己的话来说，他已对这些叙述和书面记录进行了最细致的考察，因此他的福音书在确定事件的时间与地点方面具有特殊的精确性，并在时间顺序上保持着严格的连续性。
  - type: paragraph
    text:
      ru: С древних времен сохранилось утверждение, что Евангелие от Луки было одобрено святым апостолом Павлом.
      cn: 自古以来，一直留存着这一论断：路加福音得到了圣使徒保罗的认可。
- type: heading1
  text:
    ru: Феофилакт БолгарскийТолкование на Евангелие от Луки
    cn: 提奥菲拉克特·保加利亚《路加福音注释》
  children: []
- type: heading1
  text:
    ru: Глава первая
    cn: 第一章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 1:1. '
      cn: （路加福音 1:1）
    text:
      ru: Как уже многие начали составлять повествования
      cn: 〇盖有多人、以我等中所明知之事、已起而传述、
  - type: paragraph
    text:
      ru: Кто были эти многие, которые начали? Лжеапостолы. Ибо точно многие составляли евангелия, каково, например, евангелие от египтян и евангелие с надписью «от двенадцати». Они только начали, а не окончили. Поскольку они начали без благодати Божией, потому и не окончили. Итак, Лука хорошо сказал:«многие начали». Подлинно немногие, именно Матфей и Марк, не начали только, но и окончили, ибо они имели Духа, творящего совершенное.
      cn: '这些开始（着手）的「许多人」是谁？假使徒。


        因为确实有许多人编纂（*составляли*）了福音书，例如《埃及人福音》（*евангелие от египтян*）和题名「十二使徒」的福音书（*евангелие с надписью «от двенадцати»*）。他们仅仅是开始（着手），但并未完成（*не окончили*）。既然他们是在没有上帝恩典的情况下开始的，因此他们也未能完成。


        所以，路加说：「许多人开始（着手）了」，是说得好的。真正为数不多的人，即马太和马可，他们不仅是开始，更是完成了，因为他们拥有那使之圆满的圣灵。'
  - type: paragraph
    text:
      ru: о совершенно известных между нами событиях,
      cn: 关乎在我们中间完全知晓的诸事件，
  - type: paragraph
    text:
      ru: Ибо относящееся к Христу не просто известно по голословному преданию, но истинно, совершенно верно и вполне доказательно. Как же, скажи, Лука, это доказательно?
      cn: 因为关乎基督之事，并非仅仅借由口头传述（голословному преданию）为人所知，而是真实的、完全正确的、并且极富论证性的（вполне доказательно）。卢卡（Лука）啊，请告诉我，此事又如何具备论证性呢？
  - type: paragraph
    initial:
      ru: 'Лк 1:2. '
      cn: （路加福音 1:2）
    text:
      ru: как передали нам то́ бывшие с самого начала очевидцами и служителями Слова,
      cn: 乃自始亲见而事奉言者授于我等、
  - type: paragraph
    text:
      ru: Из этого видно, что Лука был учеником не с начала, но впоследствии времени. Ибо иные были учениками Слова с самого начала, например Петр и сыны Зеведеевы (Мф. 4, 18–22). Они-то и передали Луке то, чего он сам не видел, не слышал.
      cn: 从这可见，路加并非从一开始就是门徒，而是在其后的时间里才成为门徒。因为，另有一些人从一开始就是圣言的门徒，例如彼得和西庇太的儿子们（马太福音 4:18-22）。正是他们将路加自己未曾亲见、未曾听闻的事传授给了他。
  - type: paragraph
    initial:
      ru: 'Лк 1:3. '
      cn: （路加福音 1:3）
    text:
      ru: то рассудилось и мне, по тщательном исследовании всего сначала, по порядку описать тебе, достопочтенный Феофил,
      cn: 我亦以为在凡事、推原详考、次第书之、达尔尊贵斐鄂肥泐、
  - type: paragraph
    initial:
      ru: 'Лк 1:4. '
      cn: （路加福音 1:4）
    text:
      ru: чтобы ты узнал твердое основание того учения, в котором был наставлен.
      cn: 为尔知悉于尔所学诸言之确然也、
  - type: paragraph
    text:
      ru: 'Я понимаю это двояким образом, во-первых, так: прежде я наставлял тебя, Феофил, без писания, а теперь, передавая тебе Евангелие в писании, утверждаю твой ум, чтобы он не забыл преданное без писания; во-вторых, так: мы, люди, часто имеем обычай, когда кто-нибудь говорит нам без писания, подозревать его, что, может быть, он и ложь говорит, но когда он пишет свои слова, мы верим, что он и не написал бы, если бы не был смело уверен в истине своих слов. Так и евангелист говорит: для того я написал тебе Евангелие, чтобы ты с большей уверенностью содержал то, в чем наставлен был без писания, имея более ко мне доверия теперь, когда я настолько уверен в преданном без писания, что изложил оное и в писании. Не сказал: чтобы ты «знал», но«узнал», то есть, чтобы получил вдвое большее познание и вместе смелую уверенность, что я не лгу.'
      cn: 我理解这有两种方式：首先，是这样：此前我未以书写指导你，提奥菲卢斯，而现在，通过书写将福音书传递于你，我坚固你的心智，以免他忘记了未以书写传授之物；其次，是这样：我们人类常常有这样的习性，当某人未以书写告知我们时，我们会怀疑他，或许他言辞有虚，但当他将他的言语书写下来时，我们便相信，若非他对自己的言辞之真实性有着大胆的自信，他便不会将其书写。因此，这位福音撰述者说：为此我将福音书写给你，让你能以更大的确信持守那些你未以书写所受教导的事物，在你心中对我产生更多的信任，因为我对未以书写传授之物如此确信，以至于我也将其以书写方式阐述出来。他没有说「知悉」，而是说「知悉于」，亦即，让你获得双倍的知识，并同时拥有我未说谎的大胆自信。
  - type: paragraph
    initial:
      ru: 'Лк 1:5. '
      cn: （路加福音 1:5）
    text:
      ru: Во дни Ирода, царя Иудейского,
      cn: 当犹太王希律的日子，
  - type: paragraph
    text:
      ru: 'Упомянул о царствовании Ирода, с одной стороны, из желания повествовать по примеру пророков, ибо они начинают так: во дни Ахаза и Езекии и такого-то совершилось следующее (Ис. 1,1;Ос. 1,1;Ам. 1,1)), а с другой стороны, поскольку намерен говорить о Христе, для того упомянул об Ироде, чтобы показать, что при Ироде Христос воистину пришел. Так как Ирод сей был тогда, когда, по пророчеству Иакова (Быт. 49, 10), не стало князей из иудеев, то отсюда и доказывается, что Христос пришел. Достигает и некоторой другой цели: говоря о времени, показывает истинность Евангелия, ибо желающим дает возможность радовать и от времени узнать истинность Евангелия.'
      cn: 他提及伊罗德的王权，一方面是出于渴望效仿众先知的方式来叙述。因为他们即是如此开始的：在亚哈斯和希西家，以及某某人的日子里，发生了以下的事情（以赛亚书 1:1，何西阿书 1:1，阿摩司书 1:1）。而另一方面，由于他打算谈论基督，故而提及了伊罗德，以展示在伊罗德当权之时，基督确然已来。正因这位伊罗德是在何时当权的呢？是在根据亚适乌的预言（创世记 49:10），犹太人中不再有君王之时。因此，由此亦可证明基督确然降临。他也达成了另一个目的：通过谈及时间，他展示了福音书的真实性，因为他使那些渴慕之人有机会，可以欢欣，并从时间中知晓福音书的真实性。
  - type: paragraph
    text:
      ru: был священник из Авиевой чреды, именем Захария,
      cn: 出自阿比亚班的司祭，名为匝哈利亚，
  - type: paragraph
    text:
      ru: 'Начинать от Захарии и рождения Иоаннова прилично. Поскольку он намерен говорить о Рождестве Христовом, а Иоанн – Предтеча Христов, то поэтому прежде Рождества Христова прилично повествует о рождении Иоанновом, которое и само не без чуда. Поскольку Дева имела родить, то благодать предустроила, чтобы старица родила не по закону природы, хотя и с мужем. Что же значат слова:«из Авиевой чреды»? Некоторые понимают так, что было два священника, преемственно совершавших богослужение, один по имени Авия, а другой – Захария, и так как Авия отправил богослужение, после его чреды служил Захария. Но дело кажется не так. Ибо Соломон, окончив храм, установил и дневные чреды, то есть седмицы: в одну, например, седмицу постановил сынов Кореевых, в другую – Асафа, в следующую – Авию, в иную – другого (2Пар. 8, 14;1Пар. 24). Поэтому, когда говорит, что Захария был «из Авиевой чреды», нужно понимать так, что он был в седмицу Авии, а не так, что он принял служение после седмицы Авииной; ибо тогда сказал бы: после чреды Авиевой; а теперь, когда сказал:«из Авиевой чреды», представляет, что он был из чреды и седмицы Авии.'
      cn: 从匝哈利亚和若翰的诞生开始，是合宜的。既然他打算论述基督的圣诞，而若翰是基督的先驱，因此在基督圣诞之前，合宜地叙述了若翰的诞生，其诞生本身也并非没有神迹。既然童贞女将要生育，恩典就预先安排，使一位年老的妇人得以生育，这并非依照自然法则，尽管她有丈夫。那么，「属阿微亚班」这些话是什么意思？有些人是这样理解的：有两个司祭，他们相继执行神圣的礼仪（богослужение），一个名叫阿微亚，另一个名叫匝哈利亚，既然阿微亚执行了神圣的礼仪，在他的班次之后，匝哈利亚就供职了。但此事似乎并非如此。因为所罗门在建成圣殿之后，也设立了白日的班次，即是说：周（седмицы）：例如，他规定在一个周次中是科雷的儿子们，在另一个周次中是亚撒弗，在下一个周次中是阿微亚，在另一个周次中是别的人（历代志下 8:14；历代志上 24）。因此，当他说匝哈利亚「属阿微亚班」时，应当理解为他在阿微亚的周次中，而不是他是在阿微亚的周次之后接受职事；因为若果是那样，他就会说：在阿微亚班次之后；而现在，当他说「属阿微亚班」时，呈现出他是在阿微亚的班次和周次中。
  - type: paragraph
    text:
      ru: и жена его из рода Ааронова, имя ей Елисавета.
      cn: 及其妻出自阿隆宗族，其名耶梨萨韦他。
  - type: paragraph
    text:
      ru: А желая показать, что Иоанн по той и другой стороне (по отцу и по матери) законно был из рода священнического, говорит:«и жена его из рода Ааронова», ибо не позволено было брать жену из чужого колена, но из того же самого (Чис. 36, 6–9). Елисавета, по толкованию, – значит «покой Божий», а Захария – «память Господня».
      cn: 而想要表明约翰从父系和母系两方面都是合法地出于祭司的族系，[文本]说：「他的妻子也是亚伦族系的」，因为（以色列人）不允许娶外支派的女子为妻，但必须娶自同一支派（民数记 36:6-9）。伊丽莎白，照其诠释，意为「上帝的安息」；而撒迦利亚，意为「主的记念」。
  - type: paragraph
    initial:
      ru: 'Лк 1:6. '
      cn: （路加福音 1:6）
    text:
      ru: Оба они были праведны пред Богом, поступая по всем заповедям и уставам Господним беспорочно.
      cn: 二人在上帝前、义者也、遵主一切诫命礼仪行而无玷、
  - type: paragraph
    text:
      ru: 'Часто некоторые бывают праведны, но не пред Богом, а по видимости и пред людьми. Захария же и Елисавета«были праведны пред Богом». Заповеди суть, например:«Не прелюбодействуй»,«Не кради»(Исх. 20, 14–15),  а уставы («оправдания») суть, например:«Кто злословит отца своего, или свою матерь, того должно предать смерти»(Исх.21,17): ибо это праведно. Но знай, что и заповедь может называться оправданием, так как она делает человека праведным и еще более есть оправдание Божие. Ибо в день оный Бог будет судить нас, имея заповеди как бы некоторым письменным оправданием,«Если бы Я не пришел и не говорил им, то не имели бы греха»(Ин. 15:22), и опять:«слово, которое Я говорил, оно будет судить его в последний день»(Ин. 12, 48). Для чего к словам«поступая по всем заповедям»прибавлено«беспорочно»? Выслушай. Часто некоторые поступают по Закону Божию, но все делают для того, чтобы показаться людям (Мф. 23, 5). Таковые не беспорочны. А Захария и заповеди соблюдал, и соблюдал беспорочно, а не для того, чтобы чрез исполнение их понравиться людям.'
      cn: "某些人常常是公义的，但并非在上帝面前公义，而只是在外表上、在人面前公义。然而，匝哈利亚和伊利莎白「在上帝面前是公义的」。\n\n    诫命（заповеди）例如是：「不可奸淫」、「不可偷盗」（出埃及记 20:14-15）；而礼仪（「义」（оправдания）或作「规条」）例如是：「咒骂父母的，必被治死」（出埃及记 21:17）：因为这是公义的。\n\n    但要知道，诫命也可以称为义（оправдание），因为它使人公义，并且更是上帝的义。因为在那日，上帝将以诫命作为某种书面上的义（оправдание）来审判我们，「我若没有来教训他们，他们就没有罪」（约翰福音 15:22），又说：「我所讲的道，在末日要审判他」（约翰福音 12:48）。\n\n    为何在「遵行一切诫命」这句话后又加上了「无玷」呢？请听我说。许多人常常遵行上帝的律法，但他们所做的一切都是为了要显给人看（马太福音 23:5）。这样的人并非无玷。然而，匝哈利亚既遵守了诫命，又以无玷的方式遵守了，并非通过遵行诫命来取悦于人。"
  - type: paragraph
    initial:
      ru: 'Лк 1:7. '
      cn: （路加福音 1:7）
    text:
      ru: У них не было детей, ибо Елисавета была неплодна, и оба были уже в летах преклонных.
      cn: 彼等无子、因耶梨萨韦他荒胎、且二人年已老、
  - type: paragraph
    text:
      ru: Жены праведников и сами праведные часто были бездетны, чтобы ты познал, что Закон требует многочадия не плотского, а духовного.«Оба были уже в летах преклонных»и по телу, и по духу, ибо по душе они состарились, то есть сделали большой успех, полагая«восхождения в сердце» (Пс. 83, 6) и имея жизнь как день, а не ночь (Рим. 13, 12–13), поступая благоприлично  как во свете.
      cn: 义人的妻子们以及义人自身，常常是无子的，好让你明白，律法所要求的不是肉体的多产，而是属灵的多产。「二人的年纪都已经老迈了」，无论在身体上还是在灵性上（都是如此），因为在灵魂上他们已经「老了」（即取得了巨大的进步），他们将「升入之心」（诗篇 83:6）放置在心中，并拥有光明如昼、而非黑夜般的生活（罗马书 13:12-13），如同在光明中一样，行事合乎体统。
  - type: paragraph
    initial:
      ru: 'Лк 1:8. '
      cn: （路加福音 1:8）
    text:
      ru: Однажды, когда он в порядке своей чреды служил пред Богом,
      cn: 时依其班次、于上帝前、事奉
  - type: paragraph
    text:
      ru: Пред Богом священнодействуют одни чистые, а от нечистых Бог отвращает лицо Свое.
      cn: 在上帝面前，唯独那些纯净的人才行圣事（*священнодействуют*），而上帝对那些不洁净的人则转过祂的面容。
  - type: paragraph
    initial:
      ru: 'Лк 1:9. '
      cn: （路加福音 1:9）
    text:
      ru: по жребию, как обыкновенно было у священников, досталось ему войти в храм Господень для каждения,
      cn: 依司祭值例、伊入主殿焚香、
  - type: paragraph
    initial:
      ru: 'Лк 1:10. '
      cn: （路加福音 1:10）
    text:
      ru: а всё множество народа молилось вне во время каждения, –
      cn: 在焚香之时、诸民皆在外祈祷、
  - type: paragraph
    text:
      ru: Когда же пришла ему чреда покадить? Без сомнения, в день очищения, когда один первосвященник входил во Святая Святых, чтобы мы научились, что как этот первосвященник, войдя во Святая Святых, получил плод, так и Господь Иисус, единый и великий поистине Архиерей, войдя во Святая Святых, то есть с плотью на небо, получил плод Своего явления во плоти – наше усыновление Богу и спасение.
      cn: 轮到他献香，是在什么时候呢？毫无疑问，是在赎罪日，那时唯有大祭司一人进入至圣所，为要教导我们，正如这位大祭司进入至圣所，获得了果实，照样，主耶稣，这位独一且真正伟大的大祭司，进入至圣所，即带着肉身升入天堂，获得了祂道成肉身的果实——即我们被神收纳为嗣子和我们的救赎。
  - type: paragraph
    initial:
      ru: 'Лк 1:11. '
      cn: （路加福音 1:11）
    text:
      ru: тогда явился ему Ангел Господень, стоя по правую сторону жертвенника кадильного.
      cn: 主之天神显现之、立于香台之右、
  - type: paragraph
    text:
      ru: Ангел является не всем, а чистым сердцем, каков был Захария. Жертвенник (по церковно-славянски – алтарь) назван кадильным потому, что был и другой алтарь – всесожжений.
      cn: 天使并非向所有人显现，而是向心洁者，如匝哈利亚一样。祭台（依照教会斯拉夫语，称为 *алтарь*）被称为香台，乃是由于当时亦有另一祭台——即献全燔祭的祭台。
  - type: paragraph
    initial:
      ru: 'Лк 1:12. '
      cn: （路加福音 1:12）
    text:
      ru: Захария, увидев его, смутился, и страх напал на него.
      cn: 咂哈利亚见之惶惧而惊其身、
  - type: paragraph
    initial:
      ru: 'Лк 1:13. '
      cn: （路加福音 1:13）
    text:
      ru: 'Ангел же сказал ему: не бойся, Захария, ибо услышана молитва твоя, и жена твоя Елисавета родит тебе сына, и наречешь ему имя: Иоанн;'
      cn: 天神语之曰、咂利哈亚勿惧、盖尔之祈祷已得闻矣、尔妻耶梨萨韦他将予尔生子、可名之为伊鄂昂、
  - type: paragraph
    initial:
      ru: 'Лк 1:14. '
      cn: （路加福音 1:14）
    text:
      ru: и будет тебе радость и веселие, и многие о рождении его возрадуются,
      cn: 与尔有喜且乐、多人亦因其生而欢喜、
  - type: paragraph
    text:
      ru: 'Захария смущается; ибо необычайное видение возмущает и святых. Но Ангел останавливает возмущение. Ибо везде по сему узнаются видения Божественные и бесовские: если помысл сначала смутится, но потом, с рассеянием страха, вскоре совершенно успокоится, то видение поистине от Бога; если же страх и возмущение более усиливаются, то видение – от бесов. Для чего Ангел сказал:«услышана молитва твоя, и жена твоя Елисавета родит тебе сына», ибо Захария молился не о сыне, а о грехах народа? Одни говорят: так как Захария молился о грехах народа, а имел родить сына взывающего:«Вот Агнец Божий, Который беретна Себягрех мира»(Ин. 1, 29), то Ангел прилично говорит ему: услышана молитва твоя об отпущении грехов народа, ибо ты родишь сына, чрез которого будет отпущение грехов. Другие же понимают так: Захария! Молитва твоя услышана, и Бог простил народу грехи. Потом как бы он сказал: откуда это видно? Ангел говорит: вот я тебе даю знамение:«Елисавета родит тебе сына»; а из того, что Елисавета родит, ты должен удостовериться и в отпущении грехов народу.'
      cn: 扎哈里亚感到困惑；因为非同寻常的异象甚至能扰乱圣者。但是天使制止了这种不安。因为凭此在各处皆可辨识出神圣的异象与魔鬼的异象：如果意念最初感到困惑，但随后，随着恐惧的消散，很快就完全平静下来，那么异象就确实来自上帝；但如果恐惧与不安更加加剧，那么异象就是来自魔鬼的。天使为何说：「你的祷告已被垂听，你的妻子伊利莎白将给你生一个儿子」呢？因为扎哈里亚祷告的不是儿子，而是关于百姓的罪恶？有人说：既然扎哈里亚是为百姓的罪恶祷告，而他将要生的儿子是那个呼喊：「看哪，神的羔羊，除去世人罪孽的」（伊鄂昂福音 1:29）的人，所以天使适当地对他说：你关于赦免百姓罪恶的祷告已被垂听，因为你将生一个儿子，藉着他，罪恶将获得赦免。而另一些人则这样理解：扎哈里亚！你的祷告已被垂听，上帝赦免了百姓的罪恶。随后仿佛扎哈里亚问道：这从何可见？天使回答说：看哪，我给你一个兆头：「伊利莎白将给你生一个儿子」；而从伊利莎白将要生子这件事，你就当确信百姓的罪恶也获得了赦免。
  - type: paragraph
    initial:
      ru: 'Лк 1:15. '
      cn: （路加福音 1:15）
    text:
      ru: ибо он будет велик пред Господом;
      cn: 盖彼在主前将为大、清酒诸醪绝不饮、自其母胎中被圣神充满矣、
  - type: paragraph
    text:
      ru: Ангел возвещает, что Иоанн будет«велик», но«пред Господом», ибо многие называются великими пред людьми, но не таковы пред Богом, например лицемеры. А Иоанн велик по душе, как и всякий соблазняющийся мал по душе. Ибо ни один великий не соблазняется, но малые и малодушные, как и Господь говорит:«кто соблазнит одного из малых сих»(Мф. 18, 6). Как родители Иоанна были праведны«пред Богом», так и сын их велик«пред Господом».
      cn: 天使宣示，约安将是「伟大」的，但却是「在主前」，因为许多人在人前被称为伟大的，但在神前却并非如此，例如伪善者。而约安在灵魂上是伟大的，正如所有被冒犯的人在灵魂上是渺小的一样。因为没有一个伟大的人会被冒犯，只有渺小和胆怯的人，正如主所说：「凡使这信我的一个小子跌倒的」（马太福音 18:6）。正如约安的父母「在神前」是公义的，他们的儿子也同样「在主前」是伟大的。
  - type: paragraph
    text:
      ru: не будет пить вина и сикера,
      cn: 他绝不会饮酒或烈性饮料，
  - type: paragraph
    text:
      ru: «Сикерою» называется все, что, будучи не из винограда, может произвести опьянение.
      cn: 「西克拉」（Сикерою）指的是所有那些非由葡萄酿制，却能致人醉酒之物。
  - type: paragraph
    text:
      ru: и Духа Святаго исполнится еще от чрева матери своей;
      cn: 并且从他母亲的腹中就开始被圣神充满。
  - type: paragraph
    text:
      ru: Исполнен он был«Духа Святаго»тогда, как был еще в утробе матери. Когда пришла к Елисавете Матерь Господа, то младенец, радуясь пришествию Господа,«взыграл»(Лк. 1, 41).
      cn: 他被「圣神」所充满，那时他尚在其母的腹中。当主的母亲来到伊莉莎白那里时，这个婴孩，因主的降临而欢喜，便「跳动起来」（路加福音 1:41）。
  - type: paragraph
    initial:
      ru: 'Лк 1:16. '
      cn: （路加福音 1:16）
    text:
      ru: и многих из сынов Израилевых обратит к Господу Богу их;
      cn: 使伊斯拉伊泐诸子中多人转而归其主上帝也、
  - type: paragraph
    initial:
      ru: 'Лк 1:17. '
      cn: （路加福音 1:17）
    text:
      ru: и предыдет пред Ним в духе и силе Илии, чтобы возвратить сердца отцов детям,
      cn: 彼将以伊利亚之神灵能力为主之前驱、使父心转向子、背逆者向义人之智慧、以预备完全之民予主、
  - type: paragraph
    text:
      ru: '«Возвратить сердца отцов детям», то есть обратить евреев к апостолам, ибо иудеи были отцы, а апостолы – дети их. Обратил сердца иудеев к апостолам учением и свидетельством о Христе; а свидетельствующий о Христе делает и учеников Его вполне достоверными. Иоанн не всех обратил, но«многих»; а Господь просветил всех. Пришел он«в духе... Илии», потому что как в Илии действовала благодать, так и в Иоанне, и как Илия – предтеча второго пришествия, так Иоанн – первого. И в«силе Илии», потому что пришествие обоих, Илии и Иоанна, имеет одну и ту же силу, именно: приводит ко Христу. И в другом смысле Иоанн пришел в силе и духе Илии, потому что и он был пустынник, воздержник и обличитель, как Илия.'
      cn: 「使父心转向子」，也就是说，使犹太人归向使徒们，因为犹太人是父，而使徒们是他们的子。他借着教诲以及为基督所作的见证，使犹太人的心转向了使徒们；那为基督作见证的人，也使祂的门徒完全值得信赖。伊鄂昂并没有使所有人都归正，而是使「许多人」归正；而主光照了所有人。他「带着……以利亚的灵」而来，因为恩典既在以利亚身上运作，也在伊鄂昂身上运作；正如以利亚是第二次降临的先驱，伊鄂昂是第一次降临的先驱。他也是「带着以利亚的能力」而来，因为以利亚和伊鄂昂两者的到来，具有完全相同的能力，即：引领人归向基督。在另一个层面上，伊鄂昂是带着以利亚的能力和灵而来的，因为他像以利亚一样，也是一个旷野隐修者、一个禁食者和一个斥责者。
  - type: paragraph
    text:
      ru: и непокоривым образ мыслей праведников,
      cn: 「并使不顺服者归向义人的思想模式，」
  - type: paragraph
    text:
      ru: то есть учение апостолов; мудрость же апостолов – благодать Духа в них, которой они были управляемы.
      cn: 亦即使徒的教义；而使徒的智慧则是那在他们之中的圣灵恩典，他们借此恩典而被引导。
  - type: paragraph
    text:
      ru: дабы представить Господу
      cn: 以便献给主。
  - type: paragraph
    text:
      ru: то есть Христу,
      cn: 也就是基督，
  - type: paragraph
    text:
      ru: народ приготовленный.
      cn: 预备好的百姓。
  - type: paragraph
    text:
      ru: то есть людей, способных к принятию проповеди. Скажу некоторое подобие. Когда приходил какой-нибудь пророк с проповедью, то не все веровали, но способные, то есть предуготовившие себя к тому, ибо как если кто-нибудь придет в дом ночью, то не все его принимают, но бодрствующие и ожидающие его и приготовившиеся к принятию, так и Иоанн приготовил Господу людей, но не непокорных, а способных, то есть предуготовившихся к принятию Христа.
      cn: 换言之，即是那些能够接受宣讲的人。我来说一个类比。当任何一位先知带着宣讲来临时，并非所有人都相信，而只是那些有能力的人，也就是说，那些预先为自己准备好接受的人。因为，正如如果有人在夜间来到家中，并非所有人都接待他，而是那些警醒着、期待着他、并预备好迎接他的人。同样地，伊鄂昂也为主预备了人，但不是那些不顺服的人，而是那些有能力的人，换言之，就是那些预先预备自己去接受基督的人。
  - type: paragraph
    initial:
      ru: 'Лк 1:18. '
      cn: （路加福音 1:18）
    text:
      ru: 'И сказал Захария Ангелу: по чему я узна́ю это? ибо я стар, и жена моя в летах преклонных.'
      cn: 咂哈利亚向天神曰、何以知之乎、我已老而我妻日已年迈、
  - type: paragraph
    text:
      ru: Хотя Захария был праведен и свят, однако же, принимая во внимание необычайность рождения сына, не легко поверил.
      cn: 虽然匝哈利亚是公义且圣洁的，然而，考虑到生子一事的非同寻常，他却不轻易相信。
  - type: paragraph
    initial:
      ru: 'Лк 1:19. '
      cn: （路加福音 1:19）
    text:
      ru: 'Ангел сказал ему в ответ: я Гавриил, предстоящий пред Богом, и послан говорить с тобою и благовестить тебе сие;'
      cn: 天神答之曰、我乃戛乌利伊泐立于上帝前者、奉遣吿尔、而传此福音于尔、
  - type: paragraph
    text:
      ru: Почему Ангел и сказывает ему о своем достоинстве:«я Гавриил», предстоящий Богу, не бес обольститель, а Божий Ангел.
      cn: 天使为何要告诉他自己的尊严：「我乃戛乌利伊泐」，是侍立在上帝面前的，不是迷惑人的鬼魔，而是上帝的天使。
  - type: paragraph
    initial:
      ru: 'Лк 1:20. '
      cn: （路加福音 1:20）
    text:
      ru: и вот, ты будешь молчать и не будешь иметь возможности говорить до того дня, как это сбудется, за то́, что ты не поверил словам моим, которые сбудутся в свое время.
      cn: 顾尔将喑哑不能言、直至成此之日、以尔不信我言、届其时此必应也、
  - type: paragraph
    text:
      ru: Итак, за то, что не веруешь, будешь глух и неспособен говорить. Справедливо подвергается тому и другому – глухоте и немоте, ибо как преслушник наказывается глухотой, а как противоречащий – молчанием. Кроме того, он предызображал и случившееся с иудеями. Ибо как он, старый и бесплодный, и неповеривший, родил сына, большего пророков, так ицерковьиудейская и иерархия, хотя застарела и была бесплодна и неверна, и преслушна, однако же, родила во плоти Слово Божие, Владыку пророков, с рождением Которого бывшие прежде непокорными перешли к вере и исповеданию.
      cn: 因此，因你不相信，你将变聋，无法言语。他公正地承受了这两者——失聪和失语，因为作为不听从者，他受到失聪的惩罚；而作为反对者，他受到缄默的惩罚。此外，他也预先描绘了发生在犹太人身上的事。因为，就像他，年迈且不生育，并且不相信，却生出了一个比众先知更伟大的儿子；同样地，教会和犹太人等级制度，虽然老旧、不生育、不忠诚、不听从，然而，却在肉身中生出了上帝的「道」（逻各斯），即众先知的主宰，随着祂的降生，那些先前不顺服的人转入了信仰和认信。
  - type: paragraph
    initial:
      ru: 'Лк 1:21. '
      cn: （路加福音 1:21）
    text:
      ru: Между тем народ ожидал Захарию и дивился, что он медлит в храме.
      cn: 众民等候咂哈利亚而奇其久于殿内、
  - type: paragraph
    text:
      ru: Видишь ли, как иудеи дожидались и оставались, пока вышел первосвященник? А мы, христиане, лишь вошли в храм, как и думаем уже, что с нами дурно случится, если мы не выйдем.
      cn: 你看到了吗，犹太人是如何一直等待并逗留，直到大祭司出来？而我们基督徒，只是刚走进圣殿，就心想如果我们不出来，就会有坏事发生在我们身上。
  - type: paragraph
    initial:
      ru: 'Лк 1:22. '
      cn: （路加福音 1:22）
    text:
      ru: Он же, выйдя, не мог говорить к ним; и они поняли, что он видел видение в храме; и он объяснялся с ними знаками, и оставался нем.
      cn: 及出、彼不能语之言、众知其在殿必见异象、彼以首示意而喑哑居之矣、
  - type: paragraph
    text:
      ru: Захария делал знаки народу, вероятно, вопрошавшему о причине молчания; но как он не мог говорить, то и объяснял ее знаками.
      cn: 匝哈利亚向民众打着手势，他们可能正在询问他保持缄默的原因；但因为他不能言语，他就用手势来解释。
  - type: paragraph
    initial:
      ru: 'Лк 1:23. '
      cn: （路加福音 1:23）
    text:
      ru: А когда окончились дни службы его, возвратился в дом свой.
      cn: 其职事之日满、乃归其家、
  - type: paragraph
    text:
      ru: Приметь и то, что Захария не пошел в свой дом, пока не окончились дни его служения, но оставался в храме. Ибо нагорная страна действительно далеко отстояла от Иерусалима. Да священнику, если он имел дом и в самом Иерусалиме, не позволено было уходить во время его чреды из двора храма. А мы, увы, как пренебрегаем божественными службами! Что Захария не мог говорить, а употреблял знаки, это указывает на неразумную жизнь иудеев. Ибо, умертвив Слово, они не могут дать отчета ни в делах, ни в речах своих. Если даже спросить у них о чем-нибудь пророческом, то они не отверзают уст и не могут дать тебе ни слова, ни ответа.
      cn: '也要注意这一点：匝哈利亚直到他供职之日满，才回到自己的家，而是留在圣殿里。 ибо山地与耶路撒冷确然相距遥远。即使一位祭司在耶路撒冷城内有家，在他供职轮次期间，也不被允许离开圣殿院子。哎呀，我们竟然如此轻忽神圣的供职！


        匝哈利亚不能说话，只能使用记号，这暗示了犹太人那不理性的生活。 ибо他们既已杀死「圣言」（Word），便无法对自己的所作所为和所言所语作出解释。如果即使有人向他们询问任何关于预言之事，他们也闭口不言，不能给你一言一语，也不能给出任何答复。'
  - type: paragraph
    initial:
      ru: 'Лк 1:24. '
      cn: （路加福音 1:24）
    text:
      ru: 'После сих дней зачала Елисавета, жена его, и таилась пять месяцев и говорила:'
      cn: 〇此日之后、其妻耶利萨韦他怀孕、隐瞒五月云、
  - type: paragraph
    initial:
      ru: 'Лк 1:25. '
      cn: （路加福音 1:25）
    text:
      ru: так сотворил мне Господь во дни сии, в которые призрел на меня, чтобы снять с меня поношение между людьми.
      cn: 主如此行予我、在此眷顾我之日、以除我耻辱于人间、
  - type: paragraph
    text:
      ru: Елисавета, будучи целомудренна, стыдилась и, зачав в старости,«таилась пять месяцев», пока зачала и Мария. Когда же и сия (Мария) зачала, и младенец«взыграл... во чреве ее»(Елисаветы), она уже более не таилась и даже держала себя смело, как мать такого сына, который и прежде рождения своего почтен был достоинством пророка.
      cn: 伊丽莎白，由于品德贞洁，感到羞涩，并在年老时怀孕，因此她「躲藏了五个月」，直到玛利亚也怀孕了。当这另一位（玛利亚）也怀孕了，且那婴孩「在她（伊丽莎白）的腹中跳动」时，她就不再躲藏了，甚至表现得十分大胆，如同她是一位这样的儿子的母亲——这个儿子，甚至在他出生之前，就已因先知的尊荣而被敬重。
  - type: paragraph
    initial:
      ru: 'Лк 1:26. '
      cn: （路加福音 1:26）
    text:
      ru: В шестой же месяц послан был Ангел Гавриил от Бога в город Галилейский, называемый Назарет,
      cn: 至第六月、天神戛乌利伊泐奉上帝遣往戛利列亚、邑名那作列特者、
  - type: paragraph
    text:
      ru: В месяц«шестой», считая от времени зачатия Иоанна.
      cn: 「第六」个月，是自伊鄂昂受孕时起算的。
  - type: paragraph
    initial:
      ru: 'Лк 1:27. '
      cn: （路加福音 1:27）
    text:
      ru: 'к Деве, обрученной мужу, именем Иосифу, из дома Давидова; имя же Деве: Мария.'
      cn: 就童女被达微德家之人名伊鄂锡福所聘者、童女名玛利亚、
  - type: paragraph
    text:
      ru: Говорит, что Дева обручена была мужу«из дома Давидова», чтобы показать, что и она происходила из Давидова же рода; ибо был закон, чтобы обе половины (в браке) были из одного и того же рода и из одного и того же колена (Чис. 36, 6–9).
      cn: 此处说，童女被许配给了一位「达微德家之人」作丈夫，目的是要显明她本人也出自达微德的家系；因为律法规定，婚配中的双方（指夫妻）必须出自同一个家系和同一个支派（民数记 36:6-9）。
  - type: paragraph
    initial:
      ru: 'Лк 1:28. '
      cn: （路加福音 1:28）
    text:
      ru: 'Ангел, войдя к Ней, сказал: радуйся, Благодатная! Господь с Тобою; благословенна Ты между женами.'
      cn: 天神入向之曰、庆哉、满被恩宠者、主与尔偕焉、女中尔系被福言者、
  - type: paragraph
    text:
      ru: Поскольку Господь сказал Еве:«В болезни будешь рождать детей»(Быт. 3, 16), теперь эту болезнь разрешает та радость, какую приносит Деве Ангел, говоря:«радуйся, Благодатная!»Поскольку Ева была проклята, Мария теперь слышит:«благословенна Ты».
      cn: 既然主曾对夏娃说：「你必在痛苦中生产儿女」（创世记 3:16），现在，天使带给童贞女的这喜乐就解除了那痛苦，天使说：「庆哉，满被恩宠者！」既然夏娃曾被诅咒，现在马利亚就听到了：「你是被祝福的。」
  - type: paragraph
    initial:
      ru: 'Лк 1:29. '
      cn: （路加福音 1:29）
    text:
      ru: Она же, увидев его, смутилась от слов его и размышляла, что бы это было за приветствие.
      cn: 伊见之惊慌其言、思此致候何也、
  - type: paragraph
    text:
      ru: 'Мария размышляла о приветствии, каково оно: не гнусное ли и порочное, каково обращение мужчины к девице, или божественное, так как в приветствии упомянуто и о Боге:«Господь с Тобою»?'
      cn: 马利亚思忖着这个致候，它是何种性质的：它是卑劣而邪恶的吗？如同一个男子对一位少女的搭讪；或者，它是神圣的吗？因为在致候中也提到了上帝：「主与你同在」？
  - type: paragraph
    initial:
      ru: 'Лк 1:30. '
      cn: （路加福音 1:30）
    text:
      ru: 'И сказал Ей Ангел: не бойся, Мария, ибо Ты обрела благодать у Бога;'
      cn: 而天神向之曰、玛利亚勿惧、尔于上帝前得恩宠、
  - type: paragraph
    text:
      ru: Ангел, во-первых, успокаивает сердце Ее от страха, чтобы Она приняла божественный ответ в невозмутимом положении; ибо в состоянии смущения она не могла бы должным образом выслушать имеющее сбыться, – потом, как бы в изъяснение вышесказанного слова«Благодатная», говорит:«Ты обрела благодать у Бога». Ибо быть облагодатствованным – значит получить благодать у Бога, то есть угодить Богу. Но это счастье общее, ибо и другие многие получили благодать у Бога, а приносимое Марии приветствие не идет еще ни к кому.
      cn: 天神首先安抚她的心，使其免于恐惧，以便她能在一种不受干扰的状态中接受神圣的答复；因为在困惑不安的状态下，她将无法适当地听取那即将实现之事——随后，他仿佛是在解释那先前所言的「蒙恩的」（「Благодатная」）一词，说道：「你于上帝前得恩宠。」因为蒙受恩惠（быть облагодатствованным）就意味着于上帝前获得恩宠，亦即取悦上帝。然而，这种幸福是普遍的，因为其他许多人也于上帝前获得了恩宠，但带给玛利亚的问候却尚未施予任何其他人。
  - type: paragraph
    initial:
      ru: 'Лк 1:31. '
      cn: （路加福音 1:31）
    text:
      ru: 'И вот, зачнешь во чреве, и родишь Сына, и наречешь Ему имя: Иисус.'
      cn: 且顾尔将怀孕而生子、命之、名伊伊稣斯、
  - type: paragraph
    text:
      ru: «И вот, зачнешь»– этого преимущества не удостоилась еще никакая другая дева. Сказал:«во чреве»; этим показывается, что Господь существенно воплотился из самых ложесн Девы. Пришедший для спасения нашего рода справедливо назван «Иисусом», ибо имя сие в переводе на греческий язык означает «спасение от Бога». Иисус, по толкованию, – значит Спаситель, потому что и спасение называется «иаo».
      cn: 「看哪，你将怀孕」——没有任何其他的处女曾被授予此项特权。祂说：「在你的腹中」；此言表明，主乃是从童贞女的子宫里，本质上道成肉身。为拯救我等民族而降临的祂被公正地称为「耶稣」，因为此名翻译成希腊语意为「来自上帝的拯救」。根据释义，耶稣意指救主，因为拯救也被称为「iao」。
  - type: paragraph
    initial:
      ru: 'Лк 1:32. '
      cn: （路加福音 1:32）
    text:
      ru: Он будет велик и наречется Сыном Всевышнего, и даст Ему Господь Бог престол Давида, отца Его;
      cn: 此将为大、称为至上者之子、主上帝以其祖达微德之宝座赐之、
  - type: paragraph
    text:
      ru: 'Велик был и Иоанн, но еще не был и сыном Всевышнего, а Спаситель – велик по Своему учению и –«Сын Всевышнего»тоже по учению, ибо Он учил как Имеющий власть, и по совершению дивных чудес. Называется«Сыном Всевышнего»видимый Человек: ибо так как Лицо было одно, то поистине был Сыном Всевышнего Человек, Сын Девы. Слово было Сыном Всевышнего и прежде веков, но не называлось так и не было известно; когда же воплотилось и явилось во плоти, тогда и назван Сыном Всевышнего Видимый и Творящий чудеса. Слыша о«престолеДавида», не подумай о царстве чувственном, но разумей о Божественном, которым Он воцарился над всеми народами Божественной проповедью.'
      cn: 「伊鄂昂」也曾是伟大的，但他尚未成为「至上者之子」，而「救主」因其教义而伟大，并且因其教义也是「至上者之子」，因为祂的教导犹如一位具有权柄者，并因祂施行了奇妙的[神]迹。这位可见的「人」被称为「至上者之子」：因为既然位格是同一的，那么那位「人」、那位「童贞女之子」就确然是「至上者之子」。「道」在万古之先就是「至上者之子」了，但并未如此被称呼，也未被知晓；然而，当祂「道成肉身」，并在肉身中显现时，这位「可见的」且「施行奇迹的」就被称作「至上者之子」。当你听到「达味德之宝座」时，不要联想到属肉体的王国，而应理解为「神圣的」[王国]，祂籍着「神圣的宣讲」凭此在万民之上作王。
  - type: paragraph
    initial:
      ru: 'Лк 1:33. '
      cn: （路加福音 1:33）
    text:
      ru: и будет царствовать над домом Иакова вовеки, и Царству Его не будет конца.
      cn: 永为亚适乌家之王、其国将无终、
  - type: paragraph
    text:
      ru: «Дом Иакова»суть уверовавшие как из евреев, так точно и из других народов, ибо таковые собственно суть Иаков и Израиль. Как же говорится, что Он воссел на престоле Давидовом? Слушай. Давид был меньший между братьями своими; и Господь был в презрении и поношении как любящий есть и пить вино, и Сын плотника, и в бесчестии даже у Своих братьев, сыновей Иосифовых.«Ибо и братья Его, – сказано, –не веровали в Него»(Ин. 7,5). Давид, несмотря на благотворительность, был гоним; и на Господа, творящего чудеса, клеветали и бросали камни. Давид победил и воцарился кротостью; и Господь воцарился, приняв крест по кротости. Итак, видишь ли, в каком смысле говорится, что Он воссел на престоле Давидовом? Как Давид принял чувственное царство, так Господь принял духовное царствование, которому«не будет конца». Ибо царствованию Христову, то есть богопознанию и христианству, не будет конца. Ибо мы и в гонении сияем благодатью Христовой.
      cn: 「亚适乌家」是指那从犹太人中，以及从其他民族中信靠了的人，因为这些人本身才是亚适乌和以色列。那么，祂如何被称为登上了大卫的宝座呢？请听。大卫在兄弟中是最小的；而主也曾受到轻蔑和侮辱，被视为一个贪吃贪喝葡萄酒的人，是一个木匠的儿子，甚至受到祂自己的兄弟，即约瑟之子的羞辱。「因为祂的兄弟们，——经上说，——也不信祂」（伊鄂昂福音 7:5）。大卫，尽管行善，仍被追逐；而主，行着神迹，却被人诽谤和投掷石头。大卫以温柔得胜并为王；而主也因着温柔接受十字架，从而为王。那么，你明白了吗，在何种意义上说祂登上了大卫的宝座？如同大卫接受了属世的国度，主则接受了属灵的统治，这个统治「将无终」。因为基督的统治，即对神的认识和基督教，将没有终结。因为即使在受迫害中，我们也因基督的恩典而闪耀。
  - type: paragraph
    initial:
      ru: 'Лк 1:34. '
      cn: （路加福音 1:34）
    text:
      ru: 'Мария же сказала Ангелу: ка́к будет это, когда Я мужа не знаю?'
      cn: 玛利亚对天神曰、我未适人、何以有此、
  - type: paragraph
    text:
      ru: 'Дева сказала:«как будет это?»не потому, что она как бы не поверила, но потому, что она, как мудрая и разумная, желала узнать образ настоящего события, ибо ничего подобного не было прежде сего и ни после сего не будет. Поэтому и Ангел прощает Ей и не осуждает как Захарию, но еще объясняет образ события. Захария справедливо осуждается: он имел много примеров, так как многие неплодные рождали, а Дева не имела ни одного примера.'
      cn: 童贞女说：「这事怎能成就？」并非因为她好像不相信，而是因为她，作为一个明智且理性的个体，希望了解这一当前事件的实现方式，因为在此之前从未有过类似之事，在此之后亦不会再有。因此，天使宽恕她，并未像谴责匝加利亚那样谴责她，反而进一步解释了事件的方式。匝加利亚被谴责是公正的：他拥有许多先例，因为许多不生育的妇人曾生育过，而童贞女则没有任何先例。
  - type: paragraph
    initial:
      ru: 'Лк 1:35. '
      cn: （路加福音 1:35）
    text:
      ru: 'Ангел сказал Ей в ответ: Дух Святый найдет на Тебя, и сила Всевышнего осенит Тебя; посему и рождаемое Святое наречется Сыном Божиим.'
      cn: 天神答之曰、圣神将临至尔、而至上者之能力将庇荫尔、是以所生者系圣、得称为上帝子、
  - type: paragraph
    text:
      ru: '«Дух Святый, – говорит, –найдет на Тебя», устрояя утробу Твою плодоносной и созидая плоть для единосущного Слова.«И сила Всевышнего, – Сын Божий, ибо Христос есть сила Божия (1Кор. 1, 24), –осенит Тебя», то есть покроет Тебя, окружит Тебя со всех сторон. Ибо как птица осеняет совершенно своих птенцов, накрывая своими крыльями, так сила Божия объяла Деву совершенно; сие и значит «осенить». Быть может, иной скажет: как живописец сначала набрасывает тень, потом раскрашивает окончательно, так и Господь, созидая Сам Себе плоть и составляя образ человека, сначала оттенил плоть во утробе Матери, смесив ее из кровей Приснодевы, а потом образовал ее. Но это сомнительно. Ибо одни говорят, что вместе с тем, как Господь осенил утробу Девы, тотчас же стал совершенный младенец, а другие не принимают сего. Выслушай же, что говорит:«посему и рождаемое Святое», то есть растущее в утробе твоей постепенно, а не вдруг явившееся в совершенном виде. Отсюда и уста Нестория заграждаются. Ибо он говорил, что не Сын Божий, обитавший в утробе Девы, воплотился, но простой человек, родившийся от Марии, стал иметь впоследствии Бога своим сопутником. Пусть же слышит, что рождаемое в утробе, именно оно, было Сын Божий, не иной был носимый во чреве и иной Сын Божий, но один и тот же был Сын Девы и Сын Божий. Смотри, как указал и на Святую Троицу, поименовав Духа Святаго, силу – Сына, Всевышнего – Отца.'
      cn: 「圣神将临至尔」，祂说，[祂]将使尔的子宫结出果实，并为那与圣言（道）同质者创造肉体。「而至上者之能力将庇荫尔」，即上帝之子，因为基督即是上帝的能力（哥林多前书 1:24），——将笼罩尔，意思是将从四面包围尔。因为如同鸟儿完全庇荫它的雏鸟，用翅膀覆盖它们一样，上帝的能力也完全拥抱了童贞女；「庇荫」即是此意。或许有人会说：如同画家先打阴影，然后才最终着色一样，主在为自己创造肉体、塑造人的形像时，首先在母亲的子宫里为肉体打了底色，将肉体由永贞女的血液混合而成，然后才将其塑形。但这值得怀疑。因为一些人说，就在主庇荫童贞女的子宫的同时，一个完美的婴儿立刻形成了，而另一些人则不接受此说。那么请听祂怎么说：「是以所生者系圣」，即在你子宫里逐渐成长者，而非突然以完美形象显现者。由此，聂斯脱里（涅斯托里乌斯）的口就被堵住了。因为他曾说，居于童贞女腹中的并非是上帝之子道成肉身，而是一个从马利亚所生的凡人，后来才有了上帝作为他的伴侣。就让他听吧，那在子宫里所生者，正是祂，乃是上帝之子，被怀于腹中的并非是另一位，上帝之子亦非另一位，而是同一位，既是童贞女之子，也是上帝之子。看，祂是如何指明了圣三位一体，提及了圣神（Духа Святаго），能力——即圣子，至上者——即圣父。
  - type: paragraph
    initial:
      ru: 'Лк 1:36. '
      cn: （路加福音 1:36）
    text:
      ru: Вот и Елисавета, родственница Твоя, называемая неплодною, и она зачала сына в старости своей, и ей уже шестой месяц,
      cn: 顾尔亲戚耶梨萨韦他在其年老亦怀孕得子、其称为荒胎者、今已六月矣、
  - type: paragraph
    initial:
      ru: 'Лк 1:37. '
      cn: （路加福音 1:37）
    text:
      ru: ибо у Бога не останется бессильным никакое слово.
      cn: 凡在上帝所言者无所不能、
  - type: paragraph
    text:
      ru: 'Быть может, иной недоумевает, как Елисавета была сродницей Деве, когда Дева была из колена Иудина, а Елисавета – из дочерей Аароновых, ибо Закон требовал, чтобы браки были из одного и того же колена, а потому и родство находилось между происходившими из одного и того же колена. На это можно сказать и то, что со времени плена роды смешались, а лучше – следующее: Аарон имел женой Елисавету, дочь Аминадава, а сей был из колена Иудина. Видишь ли, что Богоматерь была сродницей Елисаветы с самого начала, от Аарона. Поскольку жена Аарона происходила из колена Иудина, из которого была и Богоматерь, а Елисавета была из дщерей Аароновых, следовательно, Елисавета – сродница Богоматери. Ибо праматерь ее, жена Аарона, была из колена Иудина. Смотри и на преемство родства: жена Аарона – Елисавета, и жена Захарии – Елисавета, как от нее происходящая. Но посмотрим, что говорит Дева.'
      cn: 或许，有人会困惑不解，当童贞女（马利亚）出自犹大支派，而伊利莎白出自亚伦的女儿们（利未支派）时，伊利莎白怎么会是童贞女的亲属呢？因为律法要求婚姻必须出自同一个支派，因此亲属关系也存在于出自同一支派的人们之间。对此，我们可以说，自被掳以来，家族（宗族）就已经混杂了；但更好的解释是如下所述：亚伦的妻子是亚米拿达的女儿伊利莎白，而亚米拿达是出自犹大支派的。你看到了吗？从一开始，从亚伦那里，上帝之母就与伊利莎白是亲属。既然亚伦的妻子出自犹大支派（上帝之母也出自此支派），而伊利莎白是亚伦的众女儿之一，那么伊利莎白就是上帝之母的亲属。因为她的曾祖母（或祖先之母），即亚伦的妻子，是出自犹大支派的。再看亲属关系的继承：亚伦的妻子是伊利莎白，匝哈利亚的妻子也是伊利莎白，如同她（匝哈利亚的妻子）出自她（亚伦的妻子）。但我们来看看童贞女（马利亚）说了些什么。
  - type: paragraph
    initial:
      ru: 'Лк 1:38. '
      cn: （路加福音 1:38）
    text:
      ru: 'Тогда Мария сказала: се, Раба Господня; да будет  Мне по слову твоему.'
      cn: 玛利亚曰、顾我乃主之婢、愿如尔言成于我哉、天神遂离之而往、
  - type: paragraph
    text:
      ru: Я – доска живописца; пусть пишет живописец, что он хочет; пусть творит Господь, что Ему угодно. Очевидно, прежде сказанное:«как будет это»было выражением не неверия, а желания узнать образ; ибо если б не верила, не сказала бы:«Се, Раба Господня, да будет Мне по слову твоему».
      cn: 我乃画师之板；画师愿画何物，只管下笔；愿上主行何事，皆由祂意。显然，她先前所言：「如何会有此事」（路加福音 1:34），并非不信之表露，而是 желания узнать образ（探知方式）之愿望；因为倘若她不信，她便不会说：「顾我乃主之婢，愿如尔言成于我哉」（路加福音 1:38）。
  - type: paragraph
    text:
      ru: И отошел от Нее Ангел.
      cn: '【圣奥赫里德的狄奥菲拉克】


        天神遂离她而去。'
  - type: paragraph
    text:
      ru: 'Знай и то, что Гавриил – значит человек Божий, Мария – госпожа, а Назарет – освящение. Поэтому, когда Бог имел соделаться человеком, прилично посылается Гавриил, который означает: человек Божий; да и приветствие совершается в святом месте, то есть в Назарете, ибо где Бог, там нет ничего нечистого.'
      cn: 须知：加百列——意即「上帝之人」；玛利亚——意即「女主人」；而拿撒勒——意即「成圣」。因此，当上帝即将成为人的时候，加百列，那位意即「上帝之人」的天使，被恰当地派遣；并且，问安是在圣洁之处，即在拿撒勒，得以完成，因为凡有上帝之处，就没有任何不洁之物。
  - type: paragraph
    initial:
      ru: 'Лк 1:39. '
      cn: （路加福音 1:39）
    text:
      ru: Встав же Мария во дни сии, с поспешностью пошла в нагорную страну, в город Иудин,
      cn: 〇其日玛利亚起、亟往山地、至伊屋达之邑、
  - type: paragraph
    text:
      ru: Дева, услышав от Ангела, что Елисавета зачала, поспешила к ней, частью радуясь благополучию сродницы, а частью, как весьма благоразумная, желая окончательно увериться в том, истину ли сказал явившийся ей, чтобы по справедливости сказанного о Елисавете не сомневаться и в касающемся Ее самой. Ибо хотя Она и надеялась, но все же боялась, чтобы как-нибудь не обмануться, и это – не по неверию, но по желанию точнее узнать дело. Захария жил в нагорной стране; поэтому Дева туда и спешит.
      cn: 童贞女从天使那里听说伊利莎白怀了孕，便急忙去到她那里。部分是为了她亲戚的喜事而欢欣，部分是，作为一位极其审慎的人，她希望最终能确认向她显现的那位所言是否属实，以便凭借那关于伊利莎白所言的公允性，对于关乎她自身之事也能毫不疑惑。因为尽管她怀有盼望，但她仍然害怕，担心自己可能会以某种方式被欺骗——但这并非出于不信，而是出于渴望更精确地知晓此事。匝哈利亚住在山地；因此童贞女便急忙赶往那里。
  - type: paragraph
    initial:
      ru: 'Лк 1:40. '
      cn: （路加福音 1:40）
    text:
      ru: и вошла в дом Захарии, и приветствовала Елисавету.
      cn: 入咂哈利亚之家、致候于耶梨萨韦他、
  - type: paragraph
    initial:
      ru: 'Лк 1:41. '
      cn: （路加福音 1:41）
    text:
      ru: Когда Елисавета услышала приветствие Марии, взыграл младенец во чреве ее; и Елисавета исполнилась Святаго Духа,
      cn: 而耶梨萨韦他闻玛利亚致候之时、胎孕之子于其腹内动跃、耶梨萨韦他满被圣神、
  - type: paragraph
    text:
      ru: 'А Иоанн, получив некоторое особенное дарование пред прочими людьми, играет в утробе матери, почему он и«больше пророков» (Мф. 11, 9), ибо они пророчествовали после своего рождения, а он удостоился такого дарования будучи еще в утробе матери. Смотри: Дева«приветствовала Елисавету», то есть начала речь с ней.'
      cn: 伊鄂昂，领受了某种在其他人面前特有的恩赐，在母腹中欢跃。正因如此，他「比众先知大得多」（马太福音 11:9），因为那些先知们是在他们出生之后才开始宣讲预言的，而他却在仍在母腹之中时就配得了此等恩赐。请看：童贞女「问候了伊丽莎白」，也就是说，她开始与伊丽莎白交谈。
  - type: paragraph
    initial:
      ru: 'Лк 1:42. '
      cn: （路加福音 1:42）
    text:
      ru: 'и воскликнула громким голосом, и сказала: благословенна Ты между женами, и благословен плод чрева Твоего!'
      cn: 大声呼曰、女中尔系被福言者、尔胎之果亦被福言者、
  - type: paragraph
    text:
      ru: 'Итак, голос Девы был голос воплощающегося в Ней Бога, а потому Он и Предтечу удостоил благодати еще во чреве и соделал пророком, ибо пророчественные слова Елисаветы к Марии были слова не Елисаветы, а младенца; а уста Елисаветы только послужили ему, подобно как и уста Марии послужили Сущему в утробе Ее – Сыну Божию. Ибо Елисавета тогда исполнилась Духом, когда младенец взыграл во чреве; если бы младенец не взыграл, она не пророчествовала бы. Как о пророках говорят, что они прежде приходили в вышеестественное состояние и вдохновлялись, а потом пророчествовали, так, может быть, и Иоанн, как бы вдохновившись, прежде взыграл, потом устами матери пророчествовал. Что же пророчествовал?«Благословенна Ты между женами». Потом, поскольку многие святые жены рождали недостойных детей, например Ревекка Исава, говорит:«и благословен плод чрева Твоего». Можно разуметь и иначе:«Благословенна Ты между женами». Потом, как бы кто спрашивал: почему? – высказывает причину: ибо«благословен плод чрева Твоего», то есть ибо«плод чрева Твоего»– Бог, так как один Бог благословен, как и Давид говорит:«Благословен грядущий»(Пс. 117, 26). Ибо в Писании обычно употребление союза «и» вместо союза «ибо»; например:«Дaждь нам пoмощь от скoрби: и сyетно спасeние человеческое»(Пс. 59, 13) вместо «ибо суетно спасение человеческое»; и опять:«се, Ты разгневался еси, и мы согрешихом»(Ис. 64, 5) вместо «ибо мы согрешихом».'
      cn: '因此，童贞女的声音就是道成肉身于她之中的上帝的声音，所以他尚在母腹中就使前驱者蒙受恩典，并使他成为先知。因为伊利莎白对马利亚所说的预言性话语并非是伊利莎白的话语，而是那婴孩的话语；伊利莎白的口舌只是为他服务，就像马利亚的口舌为她腹中的那位——上帝之子——服务一样。


        因为伊利莎白是在那婴孩于腹中跳动时才被圣灵充满的；如果那婴孩没有跳动，她就不会说预言。正如人们谈论先知时说，他们首先进入超自然状态并获得默感，然后才说预言，或许伊鄂昂也是如此，他仿佛获得了默感，首先跳动，然后借着他母亲的口舌说了预言。


        他预言了什么呢？「在妇女中你是蒙福的。」


        然后，由于许多圣洁的妇女也生出了不配的儿女，例如利百加生了以扫，（经文）接着说：「你胎中的果子也是蒙福的。」


        也可以从另一个角度来理解：「在妇女中你是蒙福的。」然后，仿佛有人在问：为什么？——（经文）说出了原因：因为「你胎中的果子也是蒙福的」，也就是说，因为「你胎中的果子」是上帝，正如唯独上帝是蒙福的，大卫也说：「奉主名来的，是蒙福的」（诗篇 117:26）。


        因为在圣经中，通常将连词「和」用于替代连词「因为」；例如：「求你帮助我们脱离患难：和人的拯救是徒然的」（诗篇 59:13），此处替代了「因为人的拯救是徒然的」；又例如：「看哪，你发了怒，和我们犯了罪」（以赛亚书 64:5），此处替代了「因为我们犯了罪」。'
  - type: paragraph
    text:
      ru: Называет Господа«плодомчрева»Богоматери, потому что зачатие было без мужа. Прочие младенцы суть рождения отцов, а Христос плод одной утробы Богоматери, ибо Она одна понесла Его.
      cn: 称呼主为圣母的「腹中之果」，因为祂的受孕乃是无夫所致。其他的婴孩皆是父亲的所生，而基督却是圣母单单一个子腹之果，因为唯有她独自怀了他。
  - type: paragraph
    initial:
      ru: 'Лк 1:43. '
      cn: （路加福音 1:43）
    text:
      ru: И откуда это мне, что пришла Матерь Господа моего ко мне?
      cn: 由何而得此耶、乃我主之母来就我也、
  - type: paragraph
    initial:
      ru: 'Лк 1:44. '
      cn: （路加福音 1:44）
    text:
      ru: Ибо когда голос приветствия Твоего дошел до слуха моего, взыграл младенец радостно во чреве моем.
      cn: 顾迨尔致候之声一入我之耳、我胎之子喜跃于我腹内、
  - type: paragraph
    initial:
      ru: 'Лк 1:45. '
      cn: （路加福音 1:45）
    text:
      ru: И блаженна Уверовавшая, потому что совершится сказанное Ей от Господа.
      cn: 信者有福矣、盖被主向其所言者、必将成就也、
  - type: paragraph
    text:
      ru: Как впоследствии, когда Христос пришел креститься, Иоанн возбранял Ему из благоговения, говоря:«я не достоин»(Мф. 3, 14, 11), так и теперь вещает чрез свою мать:«откуда это мне, что пришла Матерь Господа моего ко мне», именуя чревоносящую Матерью, прежде чем Она родила Господа. Прочих жен, прежде чем они родят, не принято называть матерями, из опасения неблагополучных родов, то есть извержения; а относительно Девы такого подозрения никак не было. Мария! И прежде, чем Ты родила, Ты – Мать, и блаженна, потому что поверила, что будет исполнение сказанного Тебе Господом.
      cn: 正如后来，当基督前来受洗时，伊鄂昂出于敬畏而阻止祂，说：「我不敢当」（马太福音 3:14，11），现在他亦通过自己的母亲传达信息：「我主的母亲到我这里来，这是从哪里得的呢？」他称这位怀孕的女子为母亲，甚至在祂生下主之前。对于其他妇女，在她们生产之前，人们不习惯称她们为母亲，这是出于对难产（即流产）的担忧；但对于这位童女，则完全没有这种疑虑。马利亚！甚至在你生产之前，你就是母亲，并且你是有福的，因为你相信主向你所说的话必将成就。
  - type: paragraph
    initial:
      ru: 'Лк 1:46. '
      cn: （路加福音 1:46）
    text:
      ru: 'И сказала Мария: величит душа Моя Господа,'
      cn: 而玛利亚曰、我灵惟感颂主、
  - type: paragraph
    initial:
      ru: 'Лк 1:47. '
      cn: （路加福音 1:47）
    text:
      ru: и возрадовался дух Мой о Боге, Спасителе Моем,
      cn: 我神惟悦上帝救我者、
  - type: paragraph
    initial:
      ru: 'Лк 1:48. '
      cn: （路加福音 1:48）
    text:
      ru: что призрел Он на смирение Рабы Своей, ибо отныне будут ублажать Меня все роды;
      cn: 因其埀顾婢之卑微、今后诸代必将称我为福、
  - type: paragraph
    initial:
      ru: 'Лк 1:49. '
      cn: （路加福音 1:49）
    text:
      ru: что сотворил Мне величие Сильный, и свято имя Его;
      cn: 以全能者、为我成威严、其名乃圣、
  - type: paragraph
    initial:
      ru: 'Лк 1:50. '
      cn: （路加福音 1:50）
    text:
      ru: и милость Его в роды родов к боящимся Его;
      cn: 其矜恤施及世世敬畏之人、
  - type: paragraph
    text:
      ru: Дева, будучи совершенно уверена в истине предсказанного Ей, славословит Бога, приписывая чудо не Себе, а Ему; ибо Он, – говорит, – призрел на Меня смиренную, а не Я воззрела на Него; Он явил Мне милость, а не Я Его взыскала. И«отныне будут ублажать Меня все роды», не одна Елисавета, но и роды верующих. За что же ублажать? Ужели за Мою добродетель? Нет! Но за то, что Бог явил надо Мною величие.
      cn: 童贞女，完全确信预言给她的真实性，颂赞上帝，将这神迹归于祂而非归于她自己；因为祂，她说道，眷顾了卑微的我，而不是我仰望了祂；祂向我施予了恩惠，而不是我寻求了祂。且「从今以后，万代必称我有福」，不只是以利沙伯一人，也包括了信徒的世代。那么，为何称她有福呢？难道是因着我的美德吗？不！而是因着上帝在我身上彰显了威严。
  - type: paragraph
    text:
      ru: 'Наименовала Его«Сильным», чтобы всякий верил словам Ее, принимая во внимание, что Господь силен сделать это.«Имя Его»назвала «святым», чтобы показать, что Чистейший, зачинаясь в утробе жены, нисколько не оскверняется, но пребывает Свят. Не ко Мне одной«милость Его», но и ко всем боящимся Его; ибо не боящиеся Его, но совершенно недостойные не получают милостей. Сказав, что милость Божия«в роды родов», указала на то, что боящиеся Бога милость получают и в нынешнем роде, то есть в нынешнем веке, и в будущем роде, то есть в бесконечном веке; ибо и здесь«получают во сто крат», а там еще более (Мф. 19, 29). Внимай: прежде душа величает Господа, потом дух радуется. Или что то же: величает Бога тот, кто ходит достойно Бога. Ты называешься христианином, – не умаляй же достоинства и имени Христова чрез недостойные дела, но величай оное чрез совершение великих и небесных деяний, тогда и дух твой возрадуется, то есть духовное дарование, полученное тобой чрез великие дела, взыграет и благоуспеет, а не сократится и, так сказать, умертвится. Знай и то, что Писание, по-видимому, просто называет духом и душой одно и то же, но собственно оно различает. Ибо оно называет душевным человеком того, кто живет по естеству и руководится человеческими помыслами, например, в случае голода ест, врага ненавидит и вообще ни в чем не представляется возвышающимся над естеством; а духовным называет того, кто побеждает законы природы и не мудрствует ни о чем человеческом. Таково в Писании различие между душой и духом (1Кор. 2, 14–15;Гал. 6, 8). Быть может, врачи различают их иначе, но нам нужно внимать Писанию, а врачи пусть заблуждают.'
      cn: '她称祂为「大能的」，好叫所有人都相信她的话语，同时考虑到主有能力成就此事。她称「祂的圣名」为「圣」，以表明至洁者在妻子的子宫内受孕时，丝毫不受玷污，反而保持着圣洁。


        「祂的怜悯」并非仅施及于我一人，而是施及于一切敬畏祂的人；因为不敬畏祂，完全不配的人，是不会得到怜悯的。


        她说上帝的怜悯「世世代代」，表明敬畏上帝的人在今世，即今生今世，以及在未来的世代，即在无穷的世代中，都能领受怜悯；因为他们在此处「领受百倍」，而在彼处领受的则更多（马太福音 19:29）。


        注意：首先是灵魂颂赞主，然后是圣灵欢喜。或者说，情形是一样的：凡行事为人与上帝相称者，就是颂赞上帝的人。你被称为基督徒，就不要借着不配的作为来贬损基督的尊严和名号，而当借着成就伟大而属天的行动来颂赞它，如此你的圣灵就会欢喜，也就是说，你借着伟大的作为所领受的属灵恩赐将会跳跃和顺利兴旺，而不是衰减，或者说，被「置于死地」。


        你也要知道：圣经表面上将圣灵与灵魂简单地称为同一事物，但实际上它是有所区分的。因为圣经称那按着本性生活、受人性的意念引导的人为属血气的人——例如，饥饿时就吃，憎恨仇敌，总而言之，在任何方面都不显得超乎本性之上；而称那战胜自然法则、不思虑任何属人事物的人为属灵的人。这就是圣经中灵魂与圣灵之间的区别（哥林多前书 2:14-15，加拉太书 6:8）。或许医生们会以另一种方式来区分它们，但我们需当留心圣经，至于医生们就让他们去谬误吧。'
  - type: paragraph
    initial:
      ru: 'Лк 1:51. '
      cn: （路加福音 1:51）
    text:
      ru: явил силу мышцы Своей; рассеял надменных помышлениями се́рдца их;
      cn: 于其臂成权力、散弃傲者以其心之意、
  - type: paragraph
    text:
      ru: 'Мышца Отца – Сын; итак, Бог и Отец в Сыне Своем явил власть и силу над природой, ибо при воплощении Сына природа побеждена: Дева родила, Бог соделался человеком, а человек – Богом. Господь«рассеял надменных»бесов, изгнав их из душ человеческих и послав одних в бездну, а других – в свиней. Можно разуметь и об иудеях, которых рассеял по всякой стране и которые и поныне в рассеянии.'
      cn: 父的「臂膀」（Мышца）即是子。因此，上帝与父在其子中，彰显了对自然（природа）的权柄与能力（власть и силу），因为在子道成肉身（воплощение Сына）时，自然被征服了：童贞女（Дева）生育了，上帝成为了人（человек），而人成为了上帝。主「 рассеял надменных」（驱散了傲慢者）——指魔鬼（бесов），将它们从人类的灵魂中（душ человеческих）驱逐出去，将一些送入深渊（бездну），另一些送入猪群（свиней）。也可以理解为那些犹太人（иудеев），祂将他们驱散到各个国家（по всякой стране），直到如今他们仍处于离散状态（в рассеянии）。
  - type: paragraph
    initial:
      ru: 'Лк 1:52. '
      cn: （路加福音 1:52）
    text:
      ru: низложил сильных с престолов,
      cn: 黜权者由其宝位、谦卑者举之上、
  - type: paragraph
    text:
      ru: то есть бесов, которые господствовали над людьми и в душах человеческих имели престолы, покоясь в них. Но и фарисеи суть сильные как похитители принадлежащего бедным и как учители, имеют престолы, с коих они низложены.
      cn: 也就是说，那些统治着人类、并在人类的灵魂中拥有宝座、在其中安歇的邪灵（бесов）。但是，法利赛人（фарисеи）也算是有权势者，他们既是掠夺穷人财物的人，又是教师（учители），拥有宝座，但他们已从这些宝座上被废黜。
  - type: paragraph
    text:
      ru: и вознес смиренных;
      cn: 和升高了谦卑的人；
  - type: paragraph
    text:
      ru: людей или язычников, коих грех смирил; вознес их, даровав им сыноположение.
      cn: 人或外邦人，其罪原已将他们贬抑；祂却高举他们，赐予他们儿女的名分（сыноположение）。
  - type: paragraph
    initial:
      ru: 'Лк 1:53. '
      cn: （路加福音 1:53）
    text:
      ru: алчущих исполнил благ, и богатящихся отпустил ни с чем;
      cn: 饱饥者以善、富者使空返、
  - type: paragraph
    text:
      ru: Подобно как и«алчущих», тех же самых, то есть язычников (ибо они не имели писаний, закона или заповедей),«исполнил благами» от Писаний, а иудеев,«богатящихся»законом и заповедями, выслал вне Иерусалима, горнего и дольнего, лишенными всякого блага. Ибо иудеи ныне не имеют ничего, хотя и кажутся имеющими.
      cn: 如同那「饥饿的人」，即异教徒（因为他们没有经文、律法或诫命），他「以良善充满」，这良善来自于经文；而犹太人，那些「在律法和诫命中富足」的人，他将他们遣送至上下耶路撒冷之外，使其丧失一切的良善。因为犹太人如今一无所有，尽管他们看似拥有。
  - type: paragraph
    initial:
      ru: 'Лк 1:54. '
      cn: （路加福音 1:54）
    text:
      ru: воспринял Израиля, отрока Своего, воспомянув милость,
      cn: 収纳其仆伊斯拉伊泐、
  - type: paragraph
    initial:
      ru: 'Лк 1:55. '
      cn: （路加福音 1:55）
    text:
      ru: ка́к говорил отцам нашим, к Аврааму и семени его до века.
      cn: 记忆慈怜如告我列祖予阿乌拉阿木及其裔至于世世、
  - type: paragraph
    text:
      ru: '«Воспринял Израиля, отрока Своего». Говорится или о чувственных израильтянах, ибо многие десятки тысяч и из них уверовали, и исполнилось обетование Бога Аврааму, сказавшего ему:«и благословятся в тебе все племена земные»(Быт. 12, 3); или говорится об Израиле духовном, ибо всяк видящий Бога называется Израилем, так как имя сие означает: видящий Бога; итак, воспринял сих видящих Бога, возведя в небесное наследие.'
      cn: 「祂扶助了祂的仆人以色列。」这里所谈论的，要么是关乎肉身的以色列人，因为他们中有数以万计的人归信了，从而成就了上帝对阿乌拉阿阿木的应许，上帝曾对他说：「地上的万族都必因你得福」（创世记 12:3）；要么是关乎属灵的以色列，因为凡是看见上帝的人都被称为以色列，正如这个名字的意思是：看见上帝的人；因此，祂扶助了这些看见上帝的人，将他们提升至天上的产业。
  - type: paragraph
    initial:
      ru: 'Лк 1:56. '
      cn: （路加福音 1:56）
    text:
      ru: Пребыла же Мария с нею около трех месяцев, и возвратилась в дом свой.
      cn: 玛利亚偕之同居约三月、遂归其家、
  - type: paragraph
    text:
      ru: Мария«пребыла сЕлисаветойоколо трех месяцев», потом возвратилась. Поскольку Елисавета имела родить, то Дева удаляется ради множества имеющих собраться к рождению, ибо Деве неприлично находиться при таких обстоятельствах. А из того, что Дева возвратилась при наступлении для Елисаветы времени родить, видно, что Ангел пришел к Марии в шестой месяц от зачатия Предтечи; да Мария пребыла с Елисаветой около трех месяцев; вот почти и девять месяцев.
      cn: 玛利亚「偕之同居约三月」，遂归其家。由于叶利萨维塔即将分娩，故童贞女离开了，以免众多前来祝贺分娩的人聚集。因为童贞女处于此种境况下是不合宜的。而从童贞女在叶利萨维塔临近分娩时返回一事中，可见天使是在施洗者（Предтечи）受孕后的第六个月来到玛利亚面前的；是的，玛利亚与叶利萨维塔同居约三月；这加起来差不多就是九个月。
  - type: paragraph
    text:
      ru: Дева пребыла с Елисаветой около трех месяцев, быть может, потому что поражена была чудом и нуждалась в некотором утешении, какое могла находить в пребывании с Елисаветой; но когда приблизилось рождение, она удалилась.
      cn: 童贞女与伊丽莎白同居约三月，或许是由于她被这神迹所震惊，并需要某种安慰，而这种安慰她可在与伊丽莎白同居中寻得；但是当分娩临近之时，她便离开了。
  - type: paragraph
    initial:
      ru: 'Лк 1:57. '
      cn: （路加福音 1:57）
    text:
      ru: Елисавете же настало время родить, и она родила сына.
      cn: 耶梨萨韦他产期已满即生子、
  - type: paragraph
    text:
      ru: Нужно заметить, что о грешниках не говорится –«исполнилосьвремя родить», но только там это говорится, где рождающийся праведен. Ибо роды грешников обыкновенно несовершенны и неполны, и лучше бы для них, если б они не рождались.
      cn: 需要注意，论及罪人时，经文没有说——「产期已满（或译：满了生子的时间）」，唯独在降生者为义人的情况下，才如此论述。因为罪人的降生通常是不完全且不圆满的，对于他们来说，最好是不要降生。
  - type: paragraph
    initial:
      ru: 'Лк 1:58. '
      cn: （路加福音 1:58）
    text:
      ru: И услышали соседи и родственники ее, что возвеличил Господь милость Свою над нею, и радовались с нею.
      cn: 其邻里亲戚闻主与之充大其慈怜、亦偕之喜、
  - type: paragraph
    initial:
      ru: 'Лк 1:59. '
      cn: （路加福音 1:59）
    text:
      ru: В восьмой день пришли обрезать младенца и хотели назвать его, по имени отца его, Захариею.
      cn: 第八日来为子行割礼、名以其父咂哈利亚之名、
  - type: paragraph
    text:
      ru: 'Почему имя давалось после обрезания? Потому, что прежде нужно получить печать от Бога, а потом уже и человеческое имя. Иначе: обрезание означает отвержение плотских свойств, ибо никто не достоин именоваться воином Божиим и быть вписанным по имени в книге небесной, прежде чем отвергнет и отсечет плотские свойства.'
      cn: 为什么名字要在割礼之后才赐予呢？ 因为首先人需要从上帝那里获得印记（pechat』），然后才是人的名字。换言之：割礼意味着否定肉体的属性（svoystv），因为在否弃并切断肉体的属性之前，无人配得上被冠以「上帝的战士」之名，并按名被载入天上的书卷中。
  - type: paragraph
    initial:
      ru: 'Лк 1:60. '
      cn: （路加福音 1:60）
    text:
      ru: 'На это мать его сказала: нет, а назвать его Иоанном.'
      cn: 其母答之曰、否、乃可名之伊鄂昂、
  - type: paragraph
    text:
      ru: Елисавета говорила о имени, что имя его Иоанн, как пророчица. А может быть, Иоанн и сам назначил себе имя; ибо он сообщил матери пророчественный дар.
      cn: 伊丽莎白所说的关于名字，即他的名字是伊鄂昂，是作为一位女先知说的。又或许，伊鄂昂是自己指定了名字；因为他将预言的天赋传授给了母亲。
  - type: paragraph
    initial:
      ru: 'Лк 1:61. '
      cn: （路加福音 1:61）
    text:
      ru: 'И сказали ей: никого нет в родстве твоем, кто назывался бы сим именем.'
      cn: 众曰、尔亲属中无一人名此名者、
  - type: paragraph
    initial:
      ru: 'Лк 1:62. '
      cn: （路加福音 1:62）
    text:
      ru: И спрашивали знаками у отца его, ка́к бы он хотел назвать его.
      cn: 以首示意其父、其愿以何名之、
  - type: paragraph
    initial:
      ru: 'Лк 1:63. '
      cn: （路加福音 1:63）
    text:
      ru: 'Он потребовал дощечку и написал: Иоанн имя ему. И все удивились.'
      cn: 彼请简、书之曰、其名伊鄂昂、众皆奇之、
  - type: paragraph
    initial:
      ru: 'Лк 1:64. '
      cn: （路加福音 1:64）
    text:
      ru: И тотчас разрешились уста его и язык его, и он стал говорить, благословляя Бога.
      cn: 其口舌即启、而言福言上帝
  - type: paragraph
    text:
      ru: Захария, не будучи в силах объявить им знаками, просит дощечку; и когда он относительно имени дитяти оказался совершенно согласен с женой,«все удивились», ибо не было сего имени в родстве их, и никто не мог сказать, что оба они уговорились об этом еще прежде времени. Иоанн – значит благодать Божия; поэтому и отец тотчас получил благодать и пророчествует прежде о Христе, а потом и о сыне.
      cn: 匝哈利亚，因无力用手势向他们宣告，故求取一块写字板；而当他在孩子的名字上与妻子完全一致时，「众人都诧异了」，因为此名并不在他们的亲族之中，且没有人能说他们二人在更早之前就已经对此事达成一致。伊鄂昂（Иоанн）意为「上帝的恩典」；因此，他的父亲立刻获得了恩典，并开始预言，首先是关于基督，然后是关于他的儿子。
  - type: paragraph
    initial:
      ru: 'Лк 1:65. '
      cn: （路加福音 1:65）
    text:
      ru: И был страх на всех живущих вокруг них; и рассказывали обо всем этом по всей нагорной стране Иудейской.
      cn: 于其众邻里惊惶、此诸言语被遍扬于伊屋叠亚之山地、
  - type: paragraph
    initial:
      ru: 'Лк 1:66. '
      cn: （路加福音 1:66）
    text:
      ru: 'Все слышавшие положили это на сердце своем и говорили:  что́ будет младенец сей? И рука Господня была с ним.'
      cn: 凡闻者置于其心曰、此子将若何、主手偕之、
  - type: paragraph
    initial:
      ru: 'Лк 1:67. '
      cn: （路加福音 1:67）
    text:
      ru: 'И Захария, отец его, исполнился Святаго Духа и пророчествовал, говоря:'
      cn: 其父咂哈利亚满被圣神预言曰、
  - type: paragraph
    initial:
      ru: 'Лк 1:68. '
      cn: （路加福音 1:68）
    text:
      ru: благословен Господь Бог Израилев, что посетил народ Свой и сотворил избавление ему,
      cn: 主伊斯拉伊泐之上帝、系被福言者哉、因眷顾其民而救赎之、
  - type: paragraph
    text:
      ru: При чудесном проглаголании Захарии на всех напал страх; ибо как при наложении на него молчания народ пришел в изумление, так и теперь, когда он начал снова говорить, изумляются, так что по этим двум чудесам все могли уразуметь, что родившийся выше многих. Все это было по особенному смотрению, чтобы имеющий свидетельствовать о Христе был принят с полным доверием и чтобы все убедились из самого рождения Иоаннова, что он выше многих. Захария благословляет Бога, призревшего на израильтян. Он действительно пришел к погибшим овцам дома израилева, но очень многие из них не захотели принять благодати, почему Он и призрел на истинных израильтян, то есть на тех, кои уверовали.
      cn: 当匝哈利亚奇妙地开口说话时，所有人都心生惧怕；因为正如他被施加静默时，百姓感到惊异一样，如今当他再次开始说话时，他们也感到惊异，因此通过这两个神迹，所有人都能够明白，这位降生者凌驾于许多人之上。所有这一切都是出于特殊的照管，好叫那位将要为基督作见证的人能被完全信赖地接纳，并且叫所有人都能从伊鄂昂的降生本身确信，他凌驾于许多人之上。匝哈利亚在称颂上帝，称颂他已眷顾了以色列人。他确实来到以色列家迷失的羊群那里，但是他们中的绝大多数人却不愿接受恩典，因此，他便眷顾了那些真实的以色列人，也就是说，那些已经相信的人。
  - type: paragraph
    initial:
      ru: 'Лк 1:69. '
      cn: （路加福音 1:69）
    text:
      ru: и воздвиг рог спасения нам в дому Давида, отрока Своего,
      cn: 为我等兴起拯救之角、于其仆达微德之家、
  - type: paragraph
    initial:
      ru: 'Лк 1:70. '
      cn: （路加福音 1:70）
    text:
      ru: ка́к возвестил устами бывших от века святых пророков Своих,
      cn: 如藉古时其圣先知之口所言、
  - type: paragraph
    initial:
      ru: 'Лк 1:71. '
      cn: （路加福音 1:71）
    text:
      ru: что спасет нас от врагов наших и от руки всех ненавидящих нас;
      cn: 即拯救脱我雠敌及诸恶我者之手、
  - type: paragraph
    text:
      ru: «Воздвиг рог спасения», то есть силу и царство спасительное. Ибо «рог» означает или силу, так как рогатые животные имеют силу в рогах, или царство, ибо цари помазывались из рога. Христос есть Сила и Царство Отца; итак, для нас восстал«рог спасения»– Христос. Ибо Он, по-видимому, почивал, когда не обращал внимания на многие грехи и долготерпел идолобесие; но когда Он воплотился в последние времена, Он восстал и сокрушил всех ненавидящих нас бесов, и не продолжает уже покоиться и долготерпеть. Воздвиг«в дому Давида», то есть в Вифлееме; ибо там Он родился. Вифлеем, разумеется, город Давидов, как говорили пророки. Ибо все они говорили о воплощении, а Михей упомянул и о доме Давидовом, то есть Вифлееме, говоря:«и ты, Вифлеем... ничем не меньше воеводств Иудиных, ибо из тебя произойдет Вождь»(Мих.5:2, цит. поМф. 2:6).
      cn: 「兴起了救恩之角」（Воздвиг рог спасения），即拯救性的力量与王权。因为「角」（рог）一词，要么指力量（因有角的动物力量在于它们的角上），要么指王权（因君王是以角器所盛的膏油来膏立的）。基督是父的力量与王权；因此，为我们兴起的「救恩之角」便是基督。因为祂似乎曾沉睡，当时祂对众多的罪恶不加理会，并长期容忍了偶像的迷惑（идолобесие）；但当祂在末后的时期道成肉身时，祂就复兴了（восстал），粉碎了所有憎恨我们的恶魔，并且不再继续安息和容忍了。兴起了「在大卫家中」（в дому Давида），即在伯利恒；因为祂在那里诞生。伯利恒无疑是大卫的城，正如先知们所说。因为他们所有人都谈论了道成肉身之事，而弥迦甚至提到了大卫的家，即伯利恒，说：「你，伯利恒……在犹大的诸位领袖中绝非最小的，因为将有一位领袖从你而出」（弥迦书 5:2，引自马太福音 2:6）。
  - type: paragraph
    initial:
      ru: 'Лк 1:72. '
      cn: （路加福音 1:72）
    text:
      ru: сотворит милость с отцами нашими и помянет святой завет Свой,
      cn: 与我列祖行慈怜、而记忆其圣约、
  - type: paragraph
    text:
      ru: '«Сотворилмилость»не только с живыми, но и«с отцами нашими», ибо благодать Христова простерлась и на них, хотя они уже умерли. Именно: нам живым Он даровал надежду воскресения, и мы воскреснем; но не мы только удостоимся этого благодеяния, а и те, кои прежде скончались. Ибо вся природа получила это благо.'
      cn: 「祂施慈怜（*Сотворил милость*）」不单是对活人，更是「与我列祖行」，因为基督的恩典也延伸到了他们身上，尽管他们已经离世了。具体来说：祂赐予我们这些活人复活的盼望，我们将会复活；但并非只有我们配得这福益，那些早已逝去的人也将配得。因为所有受造的本性都领受了这恩惠。
  - type: paragraph
    text:
      ru: И иначе:«сотворилмилость с отцами»в том, что исполнил ожидания их, ибо чего они надеялись, то увидели на Христе исполнившимся. Да и детей своих видя в блаженстве от толиких благ, отцы радуются и, участвуя в радости, принимают милость, как бы для них самих сделанную.
      cn: '或以其他方式：


        「与列祖行了慈怜」在于祂成就了他们的期望，因为他们所期盼的，都看见在基督身上得以实现。况且，他们的孩子因着如此多的福祉而得享福乐，列祖也为此欢欣，藉着分享这份喜乐，他们领受了慈怜，就仿佛这慈怜是为他们自己所施行的。'
  - type: paragraph
    initial:
      ru: 'Лк 1:73. '
      cn: （路加福音 1:73）
    text:
      ru: клятву, которою клялся Он Аврааму, отцу нашему, дать нам,
      cn: 即与我祖阿乌拉阿木所矢之誓赐我等、
  - type: paragraph
    text:
      ru: О каком упомянул завете и о какой клятве, данной Аврааму? Без сомнения, о сей:«благословляя благословлю тебя и умножая умножу семя твое»(Быт. 22, 17). Авраам действительно умножился теперь, когда все народы чрез веру сделались его сынами; ибо как он уверовал, так и они чрез веру сделались ему сынами.
      cn: 他提到了什么盟约和什么赐给阿乌拉阿阿木的誓言？毫无疑问，是这个：「我必多多赐福给你，我也必多多使你的后裔繁多」（创世记 22:17）。阿乌拉阿阿木现在确实增多了，因为万民借着信仰成为了他的儿子；因为他如何信了，他们也如何借着信仰成为了他的儿子。
  - type: paragraph
    initial:
      ru: 'Лк 1:74. '
      cn: （路加福音 1:74）
    text:
      ru: небоязненно[*], по избавлении от руки врагов наших,
      cn: 救我脱于雠敌手之后、无惊惧、
  - type: paragraph
    text:
      ru: Часто иные избавляются, но со страхом и многими трудами, и борьбой; а Христос распялся за нас без всякого с нашей стороны труда и избавил наконец без страха, то есть без опасности.
      cn: 常常另一些人被解救，但是带着畏惧、许多劳苦和争战；然而基督为我们被钉十字架，没有任何从我们这方面来的劳苦，并最终在毫无畏惧之下解救了我们，也就是说，没有危险。
  - type: paragraph
    initial:
      ru: 'Лк 1:75. '
      cn: （路加福音 1:75）
    text:
      ru: служить Ему в святости и правде пред Ним, во все дни жизни нашей.
      cn: 以肖以义在彼面前于我众生命之诸日、事奉之、
  - type: paragraph
    text:
      ru: Для чего же Он избавил нас? Не для того ли, чтобы мы жили в удовольствиях? Нет, но для того, чтобы мы служили Ему, и не день, не два, но всякий день, и служили не плотским только поклонением и служением, но«в святости и правде»(«преподобием и правдою»). Преподобие есть праведность в отношении к Богу, а правда – справедливость в отношении к людям. Например, кто держит себя в удалении от священных предметов и не прикасается нечестиво к вещам божественным, но сохраняет совершенное уважение к тому, что досточтимо, тот преподобен; равно преподобен и тот, кто почитает родителей, ибо и они суть домашние боги. А кто ни любостяжателен, ни хищник, ни вор, ни прелюбодей, ни блудник, тот – праведен. Таким образом должно служить Богу«преподобием», то есть благоговением к божественным предметам, и«правдою», то есть похвальным образом жизни в отношениях человеческих, служить пред Ним, а не пред людьми, как человекоугодники и лицемеры.
      cn: 祂救赎我们是为了什么呢？难道是为了让我们生活在享乐之中吗？不，而是为了让我们事奉祂，并且不是一日两日，而是日日如此。我们所做的服事，也不仅仅是肉体的敬拜和服事，而是要「以圣洁与公义」（「敬虔[prepodobie]与公义[pravda]」）来事奉。敬虔（Prepodobie）是对待上帝的公义，而公义（pravda）是对待他人的公正。例如，一个人若使自己远离神圣之物，不以不敬虔的态度接触属神之事，而是对那些值得尊敬的事物保持完全的尊重，那么他就是敬虔的；同样，尊敬父母的人也是敬虔的，因为父母也是家中的神祇。而一个人若既不贪婪，也不强取，也不偷窃，也不奸淫，也不淫乱，那么他就是公义的。因此，我们必须「以敬虔」来事奉上帝，也就是说，对属神的事物心存敬畏，并且「以公义」，也就是说，在人际关系中保持值得称赞的生活方式，在祂面前事奉，而不是像讨好人者和伪君子那样在人前事奉。
  - type: paragraph
    initial:
      ru: 'Лк 1:76. '
      cn: （路加福音 1:76）
    text:
      ru: И ты, младенец, наречешься пророком Всевышнего, ибо предыдешь пред лицем Господа приготовить пути Ему,
      cn: 尔子欤、将称为至上者之先知、盖在主面前先行为备其道、
  - type: paragraph
    text:
      ru: Кажется странным, что Захария говорит такие слова дитяти, ибо с младенцем, ничего еще не понимающим, не свойственно беседовать. Можно на это сказать, что дитя сие как рождение имело необычайное, – ибо в пришествие Марии оно играло и пророчествовало в утробе, – так ничего нет невероятного, если оно и после рождения понимало слова отца.«Предыдешь, – говорит, –пред лицем Господа»,  оставив меня вскоре. Ибо Захария знал, что немного спустя он лишится Иоанна, так как сей имеет удалиться в пустыню. Зачем же «предыдеть»? Затем, чтобы«приготовить пути Ему». А пути суть души, к коим Господь приходит. Итак, Предтеча приготовил души к тому, чтобы в них ходить Господу. Как же он приготовил их? Чрез сообщение людям познания о спасении.
      cn: '似乎很奇怪，匝哈利亚对一个婴孩说这样的话，因为与一个尚不理解任何事情的婴儿交谈，是不合乎常理的。对此可以回答说，这个孩子既然有不寻常的降生——因为在马利亚来临时，它曾在母腹中欢跃并说预言——那么，若它在出生后也理解父亲的话语，就没有什么不可思议的了。


        「你将『行在主面前』，」他说，「很快就要离开我了。」因为匝哈利亚知道，不久之后他就会失去伊鄂昂，因为伊鄂昂将要隐居到旷野去。


        为何要「行在主面前」呢？是为了「预备祂的道路」。道路就是主所要来到之处的灵魂。因此，先驱者（Predtecha，即施洗伊鄂昂）预备了灵魂，好让主能在其中行走。


        他又是如何预备他们的呢？是通过向人们传达关于救赎的知识。'
  - type: paragraph
    initial:
      ru: 'Лк 1:77. '
      cn: （路加福音 1:77）
    text:
      ru: дать уразуметь народу Его спасение в прощении грехов их,
      cn: 予其民拯救之识、在其罪赦、
  - type: paragraph
    text:
      ru: Спасение есть Господь Иисус. Итак, Иоанном преподано людям познание о спасении, то есть о Христе, ибо Иоанн свидетельствовал об Иисусе. Познание заключалось в отпущении грехов, ибо Господь иначе не был бы и признан Богом, если б не отпускал грехов народу. Ибо отпускать грехи свойственно Богу.
      cn: 拯救即是主耶稣。因此，藉着伊鄂昂，关于拯救的认知、即关于基督的认知，被传授给了人们，因为伊鄂昂曾为耶稣作见证。这认知蕴含于罪孽的赦免之中，因为若非赦免百姓的罪孽，主就不会被承认为上帝。因为赦免罪孽乃是上帝的本性（所固有者）。
  - type: paragraph
    initial:
      ru: 'Лк 1:78. '
      cn: （路加福音 1:78）
    text:
      ru: по благоутробному милосердию Бога нашего, которым посетил нас Восток свыше,
      cn: 因我上帝慈怜怜悯之故、即东自上临我等、
  - type: paragraph
    text:
      ru: 'А Он простил нам грехи по благоутробию милости, а не за наши дела; ибо мы не сделали ничего доброго, а Он, называемый Восток, призрел на нас свыше. Ибо Он есть Солнце правды и воссиял нам, бывшим во тьме, то есть в грехе. Два зла господствовали над природой человеческой: незнание о Боге, в котором находились язычники, и грех, который имели евреи, хотя и знали Бога.'
      cn: 祂因怜悯的慈怀而赦免了我们的罪愆，而非因我们的作为；因为我们未曾行出任何良善之事，而祂，被称为「东」的，却从上鉴察了我们。因为祂是公义的日头，祂照耀了我们，我们原是在黑暗中，亦即在罪恶之中。两种邪恶统治着人类的本性：一是关于上帝的无知，即异教徒所处的境况，二是罪恶，即犹太人所拥有的，尽管他们认识上帝。
  - type: paragraph
    initial:
      ru: 'Лк 1:79. '
      cn: （路加福音 1:79）
    text:
      ru: просветить сидящих во тьме и тени смертной, направить ноги наши на путь мира.
      cn: 为照坐于幽暗及死荫者、又引我之足向安和之道、
  - type: paragraph
    text:
      ru: Итак, Он явился природе человеческой, чтобы просветить и«сидящих во тьме», то есть в неведении и безбожии, и сидящих в«тени смертной», то есть в грехе. А грех есть тень смерти в том, думаю, смысле, что как тень следует за телом, так где смерть, там и грех. Например, из того, что Адам умер, ясно, что был и грех. Равно и смерть Христову найдешь не без греха, ибо Христос умер, но за наши грехи. Поэтому грех, всегда сопровождаемый смертью, справедливо называется тенью смерти. Можно и другое сказать на это, и, думаю, мы сказали при изъяснении Евангелия Матфея. Но достаточно ли только воссиять омраченным? Нет; нужно еще направить ноги наши на путь мира, то есть праведности. Ибо как грех есть вражда с Богом, так праведность – мир. Итак, путь мира есть праведный образ жизни, к которому направил стопы наших душ воссиявший свыше Христос.
      cn: 因此，他显现于人性，旨在光照「坐于幽暗者」，即坐于无知和无神者，以及坐于「死荫」者，即坐于罪中者。而罪是死亡的阴影，我认为其意义在于：正如阴影随从身体，死亡所在之处，罪亦随之。例如，从亚当的死亡一事，便清楚可知，罪亦存在。同样，你也会发现基督的死亡并非与罪无关，因为基督虽然死了，却是为了我们的罪。因此，罪始终伴随着死亡，故而被公正地称为死亡的阴影。对此亦可有其他言说，且我认为我们曾在阐释（马太福音）时论述过。但仅仅光照这些被幽暗笼罩的人是否足够呢？不够；还需要将我们的脚引向和平之道，即公义之道。因为正如罪是对上帝的仇视，公义则是和平。因此，和平之道便是公义的生活方式，由自高处光照我们的基督，将我们灵魂的脚步导向了此道。
  - type: paragraph
    initial:
      ru: 'Лк 1:80. '
      cn: （路加福音 1:80）
    text:
      ru: Младенец же возрастал и укреплялся духом,
      cn: 子渐长、强健于神灵、而在旷野、直至其显现于伊斯拉伊泐之日、
  - type: paragraph
    text:
      ru: Отроча«возрастало" телом и«укреплялосьдухом», ибо с телом возрастало и духовное дарование; и чем более росло дитя, тем более обнаруживались и силы духа, так как орудие (тело) было способно вмещать их.
      cn: 该「孩童」（施洗伊鄂昂）身体上「渐长」，精神上「强健」，因为随着身体的增长，属灵的恩赐也在增长；并且，孩子越是成长，精神的力量就越是显明，因为工具（身体）能够容纳它们。
  - type: paragraph
    text:
      ru: и был в пустынях до дня явления своего Израилю.
      cn: 他居于旷野，直至其向伊斯拉伊泐显现之日。
  - type: paragraph
    text:
      ru: Для чего Иоанн был в пустынях? Для того чтобы ему жить вне злобы многих и, не стыдясь (ложно) никого, обличать с дерзновением, – ибо если б он был в мире, то, быть может, от сожительства и общения с людьми утратил бы чистоту; – а вместе и для того, чтобы, когда будет проповедовать о Христе, пользоваться полным доверием, как пустыннику и превосходящему других жизнью. В пустынях скрывался он дотоле, когда Бог благоволил явить его народу израильскому.
      cn: 伊鄂昂在旷野之中是为着什么呢？是为着让他能活在许多人的恶意之外，并且不（虚假地）羞愧于任何人，而带着勇气去指责——因为如果他身在世间，那么，或许会由于与人共同生活和交往而丧失纯洁；——同时也为着，当他要传讲基督的时候，能享受到全然的信任，因他乃是一名旷野隐士，并且其生活超越他人。他一直隐居在旷野之中，直到上帝乐意将他显现给以色列民众的日子。
- type: heading1
  text:
    ru: Глава вторая
    cn: 第二章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 2:1. '
      cn: （路加福音 2:1）
    text:
      ru: В те дни вышло от кесаря Августа повеление сделать перепись по всей земле.
      cn: 〇当其日、阿乌固斯特碣萨儿下诏、命普天下之人登籍、
  - type: paragraph
    initial:
      ru: 'Лк 2:2. '
      cn: （路加福音 2:2）
    text:
      ru: Эта перепись была первая в правление Квириния Сириею.
      cn: 此籍第一、行于乞利尼亚管理西利亚之时、
  - type: paragraph
    initial:
      ru: 'Лк 2:3. '
      cn: （路加福音 2:3）
    text:
      ru: И пошли все записываться, каждый в свой город.
      cn: 众为登籍、各往于其邑、
  - type: paragraph
    initial:
      ru: 'Лк 2:4. '
      cn: （路加福音 2:4）
    text:
      ru: Пошел также и Иосиф из Галилеи, из города Назарета, в Иудею, в город Давидов, называемый Вифлеем, потому что он был из дома и рода Давидова,
      cn: 伊鄂锡福亦从戛利列亚由那咂列特之邑上伊屋叠亚、至达微德之邑、名微福列耶木者、因彼系达微德家之族故也、
  - type: paragraph
    initial:
      ru: 'Лк 2:5. '
      cn: （路加福音 2:5）
    text:
      ru: записаться с Мариею, обрученною ему женою, которая была беременна.
      cn: 为与其所聘妻已孕之玛利亚登籍、
  - type: paragraph
    text:
      ru: Перепись происходит для того, чтобы, когда всякий пойдет в свое отечество, и Дева пришла в Вифлеем, свое отечество, и таким образом Господь родился в Вифлееме, и исполнилось пророчество. Когда единый Бог, имея прекратить многобожие, прилично было и державствовать одному царю – кесарю. Вместе со всеми записывается и Христос. Господу и следовало записываться со вселенной, чтобы освятить записывающихся и упразднить рабство; ибо как, претерпев обрезание, Он упразднил обрезание, так, записавшись как раб, упразднил рабство нашей природы. Ибо работающие Господу уже не суть рабы людей, как говорит апостол:«не делайтесь рабами человеков»(1Кор. 7, 23), но если по телу и рабы, то по духу свободны, не увлекаясь нечестием господ.
      cn: 人口普查的发生，是为了让每个人都去往自己的祖国，童贞女也来到她的祖国伯利恒，如此，主便诞生于伯利恒，预言得以应验。既然独一的上帝要终结多神崇拜，那么由一位君王——恺撒（即凯撒）来统治也是适宜的。基督与众人一同登记在册。主也理当与普世之人一同登记，以圣化那些登记在册的人，并废除奴役；因为祂既然经受了割礼，便废除了割礼，同样，祂既然以奴仆的身份登记在册，便废除了我们本性的奴役。因为那些服事主的人，不再是人的奴隶，正如使徒所说：「不要作人的奴仆」（哥林多前书 7:23），纵使他们身体上是奴仆，但在灵性上是自由的，不会被主人家的不虔不敬所诱惑。
  - type: paragraph
    initial:
      ru: 'Лк 2:6. '
      cn: （路加福音 2:6）
    text:
      ru: Когда же они были там, наступило время родить Ей;
      cn: 伊等居彼之时、其产期已届、
  - type: paragraph
    initial:
      ru: 'Лк 2:7. '
      cn: （路加福音 2:7）
    text:
      ru: и родила Сына своего Первенца, и спеленала Его,
      cn: 乃生其冡子、裹之而至于槽枥、因彼等于客舍无隙处之故、
  - type: paragraph
    text:
      ru: Господа справедливо назвал Сыном Девы,«Первенцем», хотя никакого другого она не родила, ибо рожденный первым называется первородным, хотя бы после него и не рождался другой.
      cn: 阁下公正地称童贞女的圣子为「长子」，尽管她没有生过其他儿子。因为最先出生的就被称为初生的（первородным，即「首生的」），即使在他之后没有其他人出生。
  - type: paragraph
    text:
      ru: и положила Его в ясли, потому что не было им места в гостинице.
      cn: 将他安放于槽枥内，因为客舍之内没有他们可容身之处。
  - type: paragraph
    text:
      ru: Полагается в яслях, быть может, для того, чтобы от начала научить нас смирению, а быть может, и для того, чтобы символически показать, что Он явился в мир сей – место, обитаемое нами, уподобившимися неразумным скотам (Пс.48, 13, 21). Ибо как ясли принадлежат скотам, так и мир сей – нам. Итак, мир – ясли, а мы – неразумные животные; а чтобы искупить нас от неразумия, для этого Он и явился здесь.
      cn: 他被安置在马槽中，或许是为了从一开始就教导我们谦卑，或许也是为了象征性地表明：他降世于这个世界——这个我们，即那些效仿了无理牲畜之人（诗篇 48:13，21）所居住的地方。因为正如马槽属于牲畜，这个世界也属于我们。因此，世界是马槽，而我们是无理的动物；他降临于此正是为了将我们从无理之中救赎出来。
  - type: paragraph
    initial:
      ru: 'Лк 2:8. '
      cn: （路加福音 2:8）
    text:
      ru: В той стране были на поле пастухи, которые содержали ночную стражу у стада своего.
      cn: 有牧者居野、夜间守更于其群羊、
  - type: paragraph
    initial:
      ru: 'Лк 2:9. '
      cn: （路加福音 2:9）
    text:
      ru: Вдруг предстал им Ангел Господень, и слава Господня осияла их; и убоялись страхом великим.
      cn: 顾、主之天神立彼等前、有主之荣光环照之、大惊而惧、
  - type: paragraph
    text:
      ru: Ангел является пастухам за простоту их нрава и незлобие, так как они видимо подражают образу жизни праведных, ибо и древние патриархи, Иаков, Моисей и Давид, были пастырями. Ангел не явился в Иерусалим фарисеям или книжникам, ибо они были вместилищем всякой злобы; а те, не будучи коварны, удостоились божественных видений. Господь показал этим, что Он с самого начала избрал и сделал проповедниками тех, которые простосердечнее других, ибо они пошли и стали проповедовать обо всем этом.
      cn: 天使向牧羊人显现，是因他们的性情质朴且不怀恶意，因为他们显然是效法义人的生活方式，古时的列祖，亚适乌、摩西和大卫，也都是牧羊人。天使没有向耶路撒冷的法利赛人或文士显现，因为他们是各种恶意的容器；而那些牧羊人，因着他们不怀诡诈，便被授予神圣的景象。主籍此表明，祂从一开始就拣选并使那些比其他人更单纯的人成为传道者，因为他们去了，并开始传讲所有这一切。
  - type: paragraph
    initial:
      ru: 'Лк 2:10. '
      cn: （路加福音 2:10）
    text:
      ru: И сказал им Ангел; не бойтесь; я возвещаю вам великую радость, которая будет всем людям:...
      cn: 天神语之曰、勿惧、顾、盖我报尔等大喜之音、乃将在众民者、
  - type: paragraph
    initial:
      ru: 'Лк 2:11. '
      cn: （路加福音 2:11）
    text:
      ru: ибо ныне родился вам в городе Давидовом Спаситель, Который есть Христос Господь;
      cn: 因今日于达微德之邑为尔等生拯救者矣、乃主合唎斯托斯、
  - type: paragraph
    initial:
      ru: 'Лк 2:12. '
      cn: （路加福音 2:12）
    text:
      ru: 'и вот вам знак: вы найдете Младенца в пеленах, лежащего в яслях.'
      cn: 此为尔等征、尔等遇婴儿裹之卧槽枥者是也、
  - type: paragraph
    text:
      ru: Ангел благовестил«великую радость», которая, – сказал, – будет для всех людей; собственно для людей Божиих. Ибо не все иудеи – народ Божий. Но воплощение Бога было радостью и для всего рода человеческого.
      cn: 天使报导了「大喜讯」，他宣称这喜讯将为所有人带来，准确地说，是为属神的人带来。因为并非所有的犹太人都是属神的百姓。但上帝的道成肉身对全人类而言，也是一份喜乐。
  - type: paragraph
    initial:
      ru: 'Лк 2:13. '
      cn: （路加福音 2:13）
    text:
      ru: 'И внезапно явилось с Ангелом многочисленное воинство небесное, славящее Бога и взывающее:'
      cn: 忽有多天军偕天神赞美上帝而曰、
  - type: paragraph
    initial:
      ru: 'Лк 2:14. '
      cn: （路加福音 2:14）
    text:
      ru: слава в вышних Богу, и на земле мир, в человеках благоволение!
      cn: 荣光予上帝在上、平安于地、恩宠于人间、
  - type: paragraph
    text:
      ru: Что означает песнь Ангелов? Без сомнения, благодарность горних чинов и радость тому, что мы, живущие на земле, облагодетельствованы. Ибо говорят:«слава... Богу,... на землетеперь насталмир». Прежде природа человеческая была во вражде с Богом, а теперь так примирилась, что стала в союзе с Богом и соединилась с Ним в воплощении. Итак, видишь ли мир Бога с человеком? Можно разуметь и иначе. Сам Сын Божий есть мир, как и говорит о Себе (Ин. 14:27, 16:33). Итак, самый мир, Сын Божий, явился на земле. И«в человеках благоволение», то есть упокоение Божие; ибо теперь Бог упокоился и обрел богоугождение в людях, тогда как прежде не благоволил и не находил в людях угождения Себе.
      cn: '天使的歌颂意味着什么？毫无疑问，这体现了高天品级的感谢与喜悦，因为我们这些地上生活的人类已蒙受恩惠。因为他们说：「荣光归于上帝……现在地上有了平安」。以前，人类的本性与上帝处于敌对之中，而现在，它已和解到与上帝结盟，并在道成肉身中与祂结合的地步。如此看来，你是否看见了上帝与人的和平（平安）？


        我们也可以作另一种理解。上帝之子本身就是平安（和平），正如祂论及自己时所说（伊鄂昂福音 14:27，16:33）。因此，平安本身，即上帝之子，已显现于地上。


        而「恩宠于人间」，意思就是上帝的安息；因为现在上帝安息了，并在人类身上找到了合乎神意的悦纳，而在此之前，祂并不悦纳，也未曾在人类身上找到使祂自己得蒙悦纳的事物。'
  - type: paragraph
    initial:
      ru: 'Лк 2:15. '
      cn: （路加福音 2:15）
    text:
      ru: 'Когда Ангелы отошли от них на небо, пастухи сказали друг другу: пойдем в Вифлеем и посмотрим, что́ там случилось, о чем возвестил нам Господь.'
      cn: 诸天神离之升天之时、牧者相告曰、往微福列耶木试观主所示我等之此言、
  - type: paragraph
    initial:
      ru: 'Лк 2:16. '
      cn: （路加福音 2:16）
    text:
      ru: И, поспешив, пришли и нашли Марию и Иосифа, и Младенца, лежащего в яслях.
      cn: 急来至、遇玛利亚及伊鄂锡福与卧于槽枥之婴儿、
  - type: paragraph
    initial:
      ru: 'Лк 2:17. '
      cn: （路加福音 2:17）
    text:
      ru: Увидев же, рассказали о том, что́ было возвещено им о Младенце Сем.
      cn: 见之、为此婴儿述所吿伊等之言语、
  - type: paragraph
    initial:
      ru: 'Лк 2:18. '
      cn: （路加福音 2:18）
    text:
      ru: И все слышавшие дивились тому, что́ рассказывали им пастухи.
      cn: 凡闻牧人所传述伊等者、皆奇之、
  - type: paragraph
    text:
      ru: Пастыри сии суть образ духовных пастырей – архиереев. Итак, архиереям должно хранить свое стадо и играть, то есть петь нечто духовное и учить народ, и тогда они удостоятся божественных видений и слышаний. Вифлеем – значит дом хлеба. Какой же это иной дом хлеба, как не церковь, в которой отложен оный хлеб? Итак, дело словесных пастырей – искать небесный хлеб, и, когда увидят сей хлеб, долг их проповедовать и другим, подобно как пастыри, увидев Младенца, передавали о Нем и другим.
      cn: 这些牧人是属灵牧人的榜样——即主教们（Архиереев）。因此，主教们理当看顾他们的羊群，并奏乐（играть），也就是说，唱诵一些属灵之物，教导民众。这样，他们就将蒙受神圣的异象与听闻。伯利恒——意为「粮食之家」。除了教会，哪个是这「粮食之家」呢？在这教会中，那粮食被妥善保管。因此，有理性的牧人（словесных пастырей）的职责是寻求天上的粮食，而当他们看到这粮食时，他们的义务是向他人宣讲，正如牧人们看到那婴孩后，也将祂的事告诉了其他人一样。
  - type: paragraph
    initial:
      ru: 'Лк 2:19. '
      cn: （路加福音 2:19）
    text:
      ru: А Мария сохраняла все слова сии, слагая в сердце Своем.
      cn: 玛利亚将此言悉藏于其心、守之、
  - type: paragraph
    text:
      ru: 'Какие слова«сохраняла»Дева? Иные говорят, что те, кои сказал Ей Ангел, и те, кои сказали Ей пастыри. Она соблюдала их и«слагалав сердце Своем», то есть обсуждала и во всех находила одну согласную мысль, что Сын Ее есть Бог. А мне кажется, что здесь словами называются события; говорится как бы так: Мария«сохраняла все слова», то есть те события, о которых я теперь говорю, и чрез то делаю их словами. Ибо событие, когда о нем скажут, становится словом.'
      cn: '童贞女「所谨守」的，是哪些话语呢？有人说，是天使对她所说的，以及牧羊人对她所说的。她谨守着这些话语，并且「藏在心里」，也就是说，她深思熟虑，并在所有这些话语中，找到了一个共同的想法，即她的圣子是上帝。


        而我则认为，在此处，话语（слова）指的是事件（события）；好比说：玛利亚「谨守所有的话语」，也就是指我现在所说的这些事件，并通过这样做，将它们转化成了话语。因为一件事件，当它被说出来时，就成了话语。'
  - type: paragraph
    initial:
      ru: 'Лк 2:20. '
      cn: （路加福音 2:20）
    text:
      ru: И возвратились пастухи, славя и хваля Бога за всё то́, что слышали и видели, ка́к им сказано было.
      cn: 〇牧者返、荣光赞美上帝为一切所闻所见如与伊等所吿者、
  - type: paragraph
    text:
      ru: Пастыри возвратились с благодарностью Богу за все; ибо они не были завистливы как иудеи.
      cn: 牧者们返回，向上帝为一切献上感谢；因为他们不像犹太人那样心怀嫉妒。
  - type: paragraph
    initial:
      ru: 'Лк 2:21. '
      cn: （路加福音 2:21）
    text:
      ru: По прошествии восьми дней, когда надлежало обрезатьМладенца,дали Ему имя Иисус, нареченное Ангелом прежде зачатия Его во чреве.
      cn: 八日已满、为彼行割礼、命之名伊伊稣斯、即未孕之先天神所称者、
  - type: paragraph
    text:
      ru: 'Когда Закон дал заповеди, тогда нарушители оных подвергались проклятию. Итак, Господь обрезуется, чтобы, и в этом исполнив Закон и не опустив ничего из заповеданного оным, искупить нас от проклятия. Да пристыдятся отселе те, кои говорят, что воплотился призрачно, ибо как обрезан, если воплотился призрачно? Исследовать же, где находится обрезанная часть, бесполезно. Ибо не должно изыскивать того, о чем Писание умолчало. Да это и совершенно бесполезно. Можно сказать, что она по отрезании пала на землю и освятила оную, подобно как кровь и вода, истекшие из ребер Его. А Он известным Ему образом сохранил частицу эту неврежденной и по Воскресении снова восприял оную, чтобы и в сем отношении не оказаться с недостатком; подобно как и мы в воскресении получим тело наше в целости. Примечай, что Господь зачался не тотчас, как Ангел сказал:«и вот, зачнешь»(Лк.1:31), но после сего, когда восхотел. Ибо смотри, что здесь говорит:«нареченное Ангелом прежде зачатия Его во чреве». Это видно и из самого изречения, ибо не сказал: «зачинаешь», но«зачнешь». Из сего можно заключить, что Господь зачался в то время, но не в ту самую минуту, когда говорил Ангел, а может быть, когда окончил речь. Впрочем, мы говорим это не утвердительно.'
      cn: 当律法给出诫命时，违反律法的人就会遭受诅咒。因此，主受割礼，为的是在这方面也成就律法，不遗漏律法所命令的任何事，从而将我们从诅咒中赎买出来。那些声称（主）虚幻地道成肉身的人，从此应当感到羞愧，因为如果祂是虚幻地道成肉身，祂又如何受割礼呢？至于探究那被割下的部分位于何处，这是毫无益处的。因为对于圣经所缄默的事情，我们不应当去寻根究底。而且这完全是徒劳无益的。我们可以说，它被割下后落在了地上，并圣化了大地，就像从祂肋旁流出的血和水一样。而祂以祂所知的方式，将这微小部分完整无损地保存了下来，并在复活后再次收回了它，为的是在这方面也不会显得有缺失；正如我们在复活中将完整地领受我们的身体一样。请注意，主并非在天使说：「看哪，你将怀孕」（路加福音 1:31）时就立即受孕，而是在此之后，当祂愿意时才受孕。因为请看，这里说了什么：「在祂在母腹中受孕之前，天使所命名的」。这从措辞本身就能看出来，因为（天使）没有说：「你正在怀孕」，而是说：「你将怀孕」。由此可以推断，主是在那个时候受孕的，但不是在天使说话的那一刻，而可能是在天使结束讲话之时。然而，我们并非以肯定的方式断言此事。
  - type: paragraph
    initial:
      ru: 'Лк 2:22. '
      cn: （路加福音 2:22）
    text:
      ru: А когда исполнились дни очищения их по закону Моисееву,
      cn: 其洁日已满、依摩伊些乙法律、 〇抱婴儿上耶鲁萨利木、为供献之于主前、
  - type: paragraph
    text:
      ru: Хорошо сказал:«по закону Моисееву», ибо поистине Дева не имела необходимости ожидать дней очищения, которых, в случае рождения мужеского пола, было сорок. В Законе сказано:«женщина зачнёт и родит младенца мужеского пола»(Лев. 12, 2); а Дева зачала не от семени[**], но родила от Духа Святого. Поэтому она не имела необходимости, а пришла во храм по желанию исполнить закон. Почему же в случае рождения мужеского пола дней очищения – семь, а женского – вдвое?«Если женщина, – сказано, –зачнет и родитмладенцамужеского пола, то она нечиста будет семь дней... Если же она родитмладенцаженского пола, то во время очищения своего она будет нечиста две недели»(Лев. 12, 2, 5)? Потому что родившая мужеский пол вводит в мир другого Адама, а родившая женский пол рождает другую Еву – сосуд слабый и малосильный, сосуд глиняный, разбитый, трость обмана, наставницу преслушания.
      cn: 讲得好：「依摩伊些乙法律」，因为这位童贞女实际上没有必要去等待洁净的日子——如果她生的是男性，这个日子是四十天。在律法中说：「妇人若怀孕、生男孩、」（利未记 12:2）；但是这位童贞女并非因着精液[]而怀孕，乃是藉着圣灵而生育。因此，她没有必要，但她来到圣殿是出于愿望要履行律法。为什么在生下男性时，洁净的日子是七天，而生下女性时，却是双倍？经上说：「妇人若怀孕、生男孩、就不洁净七天……她若生女孩、就在洁净之中、不洁净两星期、」（利未记 12:2，5）？这是因为生育男性者是带另一个亚当进入世界，而生育女性者是生下另一个夏娃——一个软弱无力的器皿，一个瓦器，被打碎的，欺骗的芦苇，不顺服的教导者。
  - type: paragraph
    text:
      ru: принесли Его в Иерусалим, чтобы представить пред Господа,
      cn: 将祂带到耶路撒冷，为要将祂呈献于主前，
  - type: paragraph
    initial:
      ru: 'Лк 2:23. '
      cn: （路加福音 2:23）
    text:
      ru: как предписано в законе Господнем, чтобы всякий младенец мужеского пола, разверзающий ложесна, был посвящен Господу,
      cn: 如主法律所载云、凡初胎男孩必称圣于主、
  - type: paragraph
    text:
      ru: Слова Закона:«чтобы всякий младенец мужеского пола, разверзающий ложесна, был посвящен Господу»(Исх.13:2, 12, 34:19) сбылись собственно на одном Христе; ибо Он Сам разверз ложесна Девы, тогда как у прочих матерей ложесна разверзает муж.
      cn: 律法的话语：「叫一切头生的男子、就是打开母胎的、都分别为圣归给主」（出埃及记 13:2，12，34:19），实际只在一位基督身上得以应验；因为是祂自己打开了童贞女的母胎，然而对于其他的母亲，母胎是由丈夫打开的。
  - type: paragraph
    initial:
      ru: 'Лк 2:24. '
      cn: （路加福音 2:24）
    text:
      ru: и чтобы принести в жертву, по реченному в законе Господнем, две горлицы или двух птенцов голубиных.
      cn: 且依主之法律所言者、献祭祀以双斑鸠、或二雏鸽献祭、
  - type: paragraph
    text:
      ru: Закон (Лев.12:6–8) повелевал приносить пару горлиц в показание того, что деторождение – от чистого супружества. Ибо о горлице говорят, что она целомудренная птица, так что, лишившись своего самца, с другим не совокупляется. Если же родители не имели горлиц, то приносили двух птенцов голубиных, чтобы жизнь сего дитяти послужила к многочадию; ибо голубь – птица многоплодная.
      cn: 律法（利未记 12:6-8）规定要献祭一对斑鸠，以此表明生育乃源于纯洁的婚姻。因为人们论及斑鸠时说，它是一种贞洁的鸟，以至于一旦失去了它的雄性伴侣，便不再与其他雄性交合。如果父母没有斑鸠，则献祭两只雏鸽，以便这孩子的生命能够促成多子多嗣；因为鸽子是一种多产的鸟。
  - type: paragraph
    initial:
      ru: 'Лк 2:25. '
      cn: （路加福音 2:25）
    text:
      ru: Тогда был в Иерусалиме человек, именем Симеон. Он был муж праведный и благочестивый, чающий утешения Израилева; и Дух Святый был на нем.
      cn: 〇顾在耶鲁萨利木有一人名锡咩翁、此人乃义且虔、仰望伊斯拉伊泐之抚恤、而圣神在之、
  - type: paragraph
    initial:
      ru: 'Лк 2:26. '
      cn: （路加福音 2:26）
    text:
      ru: Ему было предсказано Духом Святым, что он не увидит смерти, доколе не увидит Христа Господня.
      cn: 被圣神曾允许之、未见主合唎斯托斯先不见死、
  - type: paragraph
    text:
      ru: Симеон не был священник, но был человеком боголюбивым; он ожидал, что придет Христос, утешитель евреев и освободитель от рабства греховного, а может быть, и от рабства римлян и Иродова. Ибо кто уверовал во Христа, тот поистине свободен и в чести у царей и всех людей. Посмотри на апостолов. Не были ли они рабами римлян? А теперь цари римские почитают их и поклоняются им. Итак, для них, израильтян, Христос стал утешением.
      cn: 西梅翁并非司祭，却是一位爱神之人；他期盼着基督的到来，祂是以色列人的安慰者，是罪之奴役的解救者，或许也是对罗马人和希律王的奴役的解脱者。因为凡信入基督的人，他在真理上是自由的，并且受到君王和所有人的尊崇。你且看使徒们。他们难道不是罗马人的奴仆吗？而如今，罗马的君王们却敬重他们，并向他们叩拜。因此，对于他们以色列人而言，基督已成为安慰。
  - type: paragraph
    initial:
      ru: 'Лк 2:27. '
      cn: （路加福音 2:27）
    text:
      ru: И пришел он по вдохновению в храм. И, когда родители принесли Младенца Иисуса, чтобы совершить над Ним законный обряд,
      cn: 感于神来至殿、适父母抱婴孩伊伊稣斯入、欲为之循法律而行、
  - type: paragraph
    initial:
      ru: 'Лк 2:28. '
      cn: （路加福音 2:28）
    text:
      ru: 'он взял Его на руки, благословил Бога и сказал:'
      cn: 彼以其手接之、而福言上帝曰、
  - type: paragraph
    initial:
      ru: 'Лк 2:29. '
      cn: （路加福音 2:29）
    text:
      ru: Ныне отпускаешь раба Твоего, Владыко, по слову Твоему, с миром,
      cn: 君宰欤、今释尔仆依尔言于安和、
  - type: paragraph
    text:
      ru: 'Сей Симеон, движимый Духом Святым, взошел в храм, когда Матерь принесла Господа, и, приняв Его на руки, исповедует Богом. Ибо сказать:«Ныне отпускаешь раба Твоего, Владыко»мог исповедующий, что Он есть Господь жизни и смерти. Смотри, как святые тело считают узами. Потому и говорит:«Ныне отпускаешь», разрешаешь как бы от уз.«По слову Твоему»: говорит о полученном им предсказании, что он не умрет, пока не увидит Христа.«С миром»вместо: в спокойствии. Ибо человек, покуда живет,«мятется», как Давид говорит (Пс. 38, 7); умерший же находится в мире.«С миром»– можно разуметь и иначе, именно: с получением ожидаемого. Прежде, чем я увидел Господа, я, – говорит, – не был спокоен помыслами, но ожидал Его и всегда помышлял с заботой, когда Он придет: а теперь, когда я увидел Его, я успокоился и перестал думать, я разрешаюсь.'
      cn: '这位西缅，被圣灵感动，进入了圣殿，那时圣母正将主带来。他将主抱在怀里，并宣认祂是上帝。因为，只有宣认祂是生命和死亡之主的人，才能够说：「主宰啊，如今祢释放祢的仆人了。」


        看哪，圣徒们是怎样将身体视为束缚的。因此他才说：「如今释放了」，意即如同从束缚中解脱。「照祢的话」：这是指他所得到的预言，即他不会死，直到他亲眼看见基督。「于安和」，意即：在平静中。因为一个人，只要还活着，「就纷乱」（如同大卫所说 (诗篇 38:7)）；而死去的人则处于安和之中。「于安和」——也可以作另一种理解，即：得到了他所期盼之物。他说：「在我见到主以前，我的意念没有平静，而是一直期待祂，并总是带着忧虑思考祂何时会来；但现在，当我见到祂之后，我就平静下来，停止了思虑，我就此得蒙释放了。」'
  - type: paragraph
    initial:
      ru: 'Лк 2:30. '
      cn: （路加福音 2:30）
    text:
      ru: ибо видели очи мои спасение Твое,
      cn: 因我目已见尔之拯救、
  - type: paragraph
    initial:
      ru: 'Лк 2:31. '
      cn: （路加福音 2:31）
    text:
      ru: которое Ты уготовал пред лицем всех народов,
      cn: 乃尔所备于众民之面前、
  - type: paragraph
    text:
      ru: «Спасением» назвал воплощение Единородного, которое Бог уготовал прежде всех веков.«Уготовал...это спасениепред лицом всехлюдей». Ибо для того Он воплотился, чтобы спасти мир и чтобы воплощение Его явлено было всем.
      cn: 他称独生子的道成肉身为「救恩」，此（救恩）是上帝在万世之先就已预备了的。「（你）所预备于众民之面前，乃尔所备于众民之面前、这救恩」。因为他道成肉身，是为了拯救世界，也是为了让他的道成肉身向所有人显明。
  - type: paragraph
    initial:
      ru: 'Лк 2:32. '
      cn: （路加福音 2:32）
    text:
      ru: свет к просвещению язычников, и славу народа Твоего Израиля.
      cn: 即为照异邦人之光、亦为尔伊斯拉伊泐民之荣、
  - type: paragraph
    text:
      ru: Спасение это есть«свет к просвещению язычников», то есть для просвещения омраченных язычников,«ивславу... Израиля», ибо Христос есть поистине слава израильского народа, потому что от него Он воссиял и поистине благоразумные находят для себя величие в этом. Так говорит Симеон. А мне кажется, что сему Симеону приличествуют и слова Давида:«долготою дней насыщу его, и явлю ему спасение Мое»(Пс. 90, 16).
      cn: 这段救恩就是「光照异邦人之光」，意即为了光照那些身处晦暗之中的异邦人，「并为以色列……之荣耀」，因为基督确实是以色列民族的荣耀，祂从这民族中光照四方，并且那些真正明智的人都能在这光照中找到自身的伟大。西缅如此说道。而在我看来，大卫的话也同样适用于这位西缅：「我要使他足享长寿，并将我的救恩显明给他」（诗篇 90:16）。
  - type: paragraph
    initial:
      ru: 'Лк 2:33. '
      cn: （路加福音 2:33）
    text:
      ru: Иосиф же и Матерь Его дивились сказанному о Нем.
      cn: 伊鄂锡福及其母以所言者为奇、
  - type: paragraph
    initial:
      ru: 'Лк 2:34. '
      cn: （路加福音 2:34）
    text:
      ru: 'И благословил их Симеон и сказал Марии, Матери Его: се, лежит Сей на падение и на восстание многих в Израиле'
      cn: 而锡咩翁福言彼等、谓其母玛利亚曰、顾、此被置、为堕落及兴起在乎伊斯拉伊泐多人、而且受辩駮之号、
  - type: paragraph
    text:
      ru: 'Симеон благословил обоих, а речь обратил к истинной Матери, оставив мнимого отца.«Се,– говорит, –лежит Сей на падение и на восстание многих в Израиле»;«на падение»неверующим, а верующим –«на восстание». Или иначе: Господь лежит«на падение»зла, гнездящегося в душах наших, и«на восстание»добра; падает блуд, восстает целомудрие. Можно разуметь и еще иначе: Христос«лежит... на падение»вместо: Сам имеет пострадать и подвергнуться смерти, а через Его падение многие имеют восстать. Итак, после слов:«на падение»поставь точку, потом начинай:«И на восстание многих».'
      cn: 西缅祝福了他们二人，但他将言语转向了这位真实的母亲，撇下了这位假定的父亲。「看哪，」他说，「此被置，为堕落及兴起在乎伊斯拉伊泐多人」；「为堕落」是针对不信者，而「为兴起」是针对信者。或者可以换种方式理解：主被置「为堕落」我们灵魂中盘踞的邪恶，并「为兴起」良善；淫乱跌倒，贞洁兴起。还可以从另一种角度理解：基督「被置……为堕落」意指：祂自己将要受难并经历死亡，而通过祂的堕落（受死），许多人将要兴起。因此，在「为堕落」之后，加一个句号，然后开始：「和为许多人的兴起」。
  - type: paragraph
    text:
      ru: и в знамение пререкаемо, –
      cn: 和被辩驳的记号，——
  - type: paragraph
    text:
      ru: «Знамение»есть крест, который доселе находит противоречие себе, то есть не принимается неверными. Называется и воплощение Господа знамением, и знамением чудным, поскольку Бог стал человеком, а Дева – Матерью. И этому знамению, то есть воплощению Христа, противоречат. Ибо одни говорят, что тело – с неба, другие, – что оно призрачно, а иные пустословят еще иное.
      cn: 「记号」（Знамение）就是十字架，它直到现在仍遭遇到对自身的抵触（противоречие），也就是说，不被不信者所接纳。主的道成肉身也被称为「记号」（знамением），被称为奇妙的记号（знамением чудным），因为上帝成了人，而童贞女成了母亲。对这个记号，也就是对基督的道成肉身，人们予以抵触（противоречат）。因为一些人说身体是从天上来的，另一些人说身体是虚幻的，还有一些人空谈着另外的东西。
  - type: paragraph
    initial:
      ru: 'Лк 2:35. '
      cn: （路加福音 2:35）
    text:
      ru: и Тебе Самой:(Деве)оружие пройдет душу, –
      cn: 以剑将自贯尔灵、俾多人心之意念显露、
  - type: paragraph
    text:
      ru: Оружием называет, может быть, скорбь, бывшую при страдании, а может быть, и соблазн, который приразился к Ней, при виде Господа распятым. Ибо Она, быть может, помышляла, как был распят, умерщвлен и оплеван Тот, Кто родился бессеменно, творил чудеса, воскрешал мертвых.
      cn: 他称之为「兵器」，或许是指在受难时所发生的忧伤，或许是指当她看见主被钉十字架时，侵袭她的那诱惑。因为她或许曾思忖，那位无种而生、施行奇迹、叫死人复活者，竟是如何被钉十字架、被处死、又被唾弃的。
  - type: paragraph
    text:
      ru: да откроются помышления многих сердец.
      cn: 「俾多人心之意念显露。」
  - type: paragraph
    text:
      ru: 'Сие означает то, что«откроютсяи обнаружатсяпомышления многих»соблазняющихся, и обличенные они найдут скорое уврачевание. Например, и Ты, Дева, откроешься и обнаружишься в своем мудровании о Христе, потом утвердишься в вере в Него. Подобно и Петр оказался отвергшимся; но явилась сила Бога, снова принявшего его чрез покаяние. И иначе: открылись«помышления многих сердец», когда обнаружился предатель и обнаружились любящие Его, каковы, например, были Иосиф, пришедший к Пилату, и жены, стоявшие у Креста.'
      cn: 此意即是，那些「绊跌者」的「心意将敞开并显露」，而他们被揭示后将寻得迅速的治愈。例如，你，童贞女，你对基督的心意也将敞开并显露，此后你将在对祂的信仰中得坚立。同样，彼得显明自己是弃绝者；然而上帝的权能显现了，藉着悔改再次接纳了他。另有一种解释：「许多人心的意念」敞开了，那时显明了那叛徒，也显明了爱祂的人，例如来到彼拉多那里的约瑟，以及站在十字架旁的那些妇女。
  - type: paragraph
    initial:
      ru: 'Лк 2:36. '
      cn: （路加福音 2:36）
    text:
      ru: Тут была также Анна пророчица, дочь Фануилова, от колена Асирова, достигшая глубокой старости, прожив с мужем от девства своего семь лет,
      cn: 有女先知名昂那、乃发弩伊泐之女、阿锡儿之支派、年已老迈、自处女偕夫居七载之后为嫠、
  - type: paragraph
    initial:
      ru: 'Лк 2:37. '
      cn: （路加福音 2:37）
    text:
      ru: вдова лет восьмидесяти четырех, которая не отходила от храма, постом и молитвою служа Богу день и ночь.
      cn: 约八十四年不离殿、以持斋祈祷昼夜事奉、
  - type: paragraph
    initial:
      ru: 'Лк 2:38. '
      cn: （路加福音 2:38）
    text:
      ru: И она в то время, подойдя, славила Господа и говорила о Нем всем, ожидавшим избавления в Иерусалиме.
      cn: 斯时、趋前称赞主、为之述吿凡在耶鲁萨利木望救赎者、
  - type: paragraph
    text:
      ru: Евангелист останавливается на повествовании об Анне, перечисляет ее отца и колено, чтобы мы знали, что он говорит истину, так как он приглашает как бы многих свидетелей, знающих отца и колено. Она вместе с другими«славила Господа», то есть благодарила Его, и всем передавала о Господе, что Он есть Спаситель и утешение нас, ожидающих искупления.
      cn: 福音传道者在论述安娜的故事时停了下来，列举了她的父亲和支派，以便我们知道他所言是真，因为他仿佛是在邀请许多知晓她父亲和支派的见证人。她与其他人一道「称赞主」，即感谢祂，并向所有的人传达关于主的信息，即祂是我们这些期待救赎者之人的救主和安慰。
  - type: paragraph
    initial:
      ru: 'Лк 2:39. '
      cn: （路加福音 2:39）
    text:
      ru: И когда они совершили всё по закону Господню, возвратились в Галилею, в город свой Назарет.
      cn: 彼等遵主法律皆已毕、归戛利列亚、至本邑那咂列特、
  - type: paragraph
    text:
      ru: По исполнении всего, они возвратились в Галилею, в город свой Назарет, Вифлеем был также их город, но как отчизна, а Назарет как место жительства.
      cn: 在一切都完成之后，他们回到了加利利，回到他们自己的城拿撒勒。伯利恒也是他们的城，但那是作为故土，而拿撒勒则是作为居住之地。
  - type: paragraph
    initial:
      ru: 'Лк 2:40. '
      cn: （路加福音 2:40）
    text:
      ru: Младенец же возрастал и укреплялся духом, исполняясь премудрости, и благодать Божия была на Нем.
      cn: 子渐长、强健于神灵、智慧充满、且上帝之恩宠偕之、
  - type: paragraph
    text:
      ru: Иисус«возрастал»по телу. Хотя Он мог бы от самой утробы достигнуть в меру мужеского возраста, но тогда мог бы показаться призраком; поэтому Он растет мало-помалу. С возрастом проявлялась премудрость Бога Слова. Ибо Он был мудр не по успеху в учении; прочь такая мысль! Поскольку же Он прирожденную премудрость открывал мало-помалу, то говорится, что Он успевал и«укреплялся духом»сообразно с возрастом телесным. Ибо если б Он явил всю мудрость в самом первом Своем возрасте, то показался бы чудовищным. А теперь, обнаруживая Самого Себя, сколь можно, в соответствии с возрастом, Он исполнял домостроительство, не приемля мудрости. Ибо, что было бы совершеннее совершенного из начала? Однако ж Он присущую мудрость обнаруживает мало-помалу.
      cn: 耶稣「渐长」是就身体而言。尽管祂本可在母胎中即达成年男子之身量，但那样祂可能被视为幽灵；因此，祂一点一点地成长。随着年龄的增长，上帝圣言的至高智慧也逐渐显明。因为祂的智慧并非源于学习上的精进；摒弃这种想法！然而，因为祂是将其固有的至高智慧一点一点地揭示出来，故而说祂「强健于神灵」（直译：成功于精神）并「渐长」，以与祂的身体年龄相称。因为倘若祂在最初的年龄就显露出全部智慧，祂就会显得怪异。但现在，祂在可能范围内，根据年龄显明祂自己，成就了救赎的「经济」（домостроительство），而不是接受智慧。因为，那从一开始就已是至臻完善的（完全的），何以还能更臻完善？然而，祂将祂所固有的智慧一点一点地显露出来。
  - type: paragraph
    initial:
      ru: 'Лк 2:41. '
      cn: （路加福音 2:41）
    text:
      ru: Каждый год родители Его ходили в Иерусалим на праздник Пасхи.
      cn: 每岁葩斯哈、其父母往耶鲁萨利木、
  - type: paragraph
    initial:
      ru: 'Лк 2:42. '
      cn: （路加福音 2:42）
    text:
      ru: И когда Он был двенадцати лет, пришли они также по обычаю в Иерусалим на праздник.
      cn: 彼年十二岁之时、彼等遵节期之例、上耶鲁萨利木、
  - type: paragraph
    initial:
      ru: 'Лк 2:43. '
      cn: （路加福音 2:43）
    text:
      ru: Когда же, по окончании днейпраздника,возвращались, остался Отрок Иисус в Иерусалиме; и не заметили того Иосиф и Матерь Его,
      cn: 日卒期彼等归之时、童子伊伊稣斯留于耶鲁萨利木、伊鄂锡福及其母不知之、
  - type: paragraph
    initial:
      ru: 'Лк 2:44. '
      cn: （路加福音 2:44）
    text:
      ru: но думали, что Он идет с другими. Пройдя же дневной путь, стали искать Его между родственниками и знакомыми
      cn: 意其在同行中、行一日程、始寻访于亲戚相识之间、
  - type: paragraph
    text:
      ru: Иисус вместе с родителями ходит в Иерусалим, чтобы во всем показать, что Он ни Богу не противится, ни требованиям Закона не сопротивляется. Когда они исполнили дни, то есть семь дней Пасхи, Он«остался... в Иерусалиме».
      cn: 耶稣同父母前往耶路撒冷，为要全然显明，祂既不悖逆上帝，也不抵制律法的要求。当他们「满了日子」（即逾越节的七天）之后，祂「仍留在耶路撒冷」。
  - type: paragraph
    initial:
      ru: 'Лк 2:45. '
      cn: （路加福音 2:45）
    text:
      ru: и, не найдя Его, возвратились в Иерусалим, ища Его.
      cn: 未遇之、乃反耶鲁萨利木寻之、
  - type: paragraph
    initial:
      ru: 'Лк 2:46. '
      cn: （路加福音 2:46）
    text:
      ru: Через три дня нашли Его в храме, сидящего посреди учителей, слушающего их и спрашивающего их;
      cn: 三日后、遇之于殿、坐于教师中、且听且问之、
  - type: paragraph
    initial:
      ru: 'Лк 2:47. '
      cn: （路加福音 2:47）
    text:
      ru: все слушавшие Его дивились разуму и ответам Его.
      cn: 闻之者奇异其智慧及应对、
  - type: paragraph
    text:
      ru: Рассуждал с книжниками, давая им вопросы от Закона. И все«дивились». Видишь ли, как Он успевал в мудрости, так что для многих был предметом любознательности и удивления? Ибо обнаружение мудрости Его есть самый успех Его.
      cn: 他与经师们辩论，向他们提出源于律法的疑问。而所有人都「奇异」（路加福音 2:47）。你可曾见到，祂是如何在智慧中长进而有所成就的，以至于对于许多人来说，祂是好奇心和惊异之情的主题？因为祂的智慧的显明就是祂最真实的成就。
  - type: paragraph
    initial:
      ru: 'Лк 2:48. '
      cn: （路加福音 2:48）
    text:
      ru: 'И, увидев Его, удивились; и Матерь Его сказала Ему: Чадо! что́ Ты сделал с нами? Вот, отец Твой и Я с великою скорбью искали Тебя.'
      cn: 见之亦奇异、其母语之曰、儿欤、何如此行于我等、顾尔父及我忧心寻尔、
  - type: paragraph
    text:
      ru: 'Богоматерь называет Иосифа отцом, хотя и знала, что он не есть отец. Без сомнения, она именует Иосифа отцом Его ради иудеев, чтобы они не возымели какой-либо нечистой мысли касательно Его рождения. Иначе: так как Иосиф прилагал отеческую заботу и служение в воспитании, то прилично назвала его самим отцом, как бы Дух Святой почтил его наименованием отца.'
      cn: 圣母称呼约瑟为父，尽管她知道他并非父亲。毫无疑问，她称约瑟为祂的父，是为了犹太人的缘故，以免他们对祂的诞生怀有任何不洁的思想。再者：鉴于约瑟在抚育过程中尽了为父的关切与服侍，所以她称呼他为真正的父亲是合宜的，就好像圣灵以「父亲」的称谓尊荣了他一样。
  - type: paragraph
    initial:
      ru: 'Лк 2:49. '
      cn: （路加福音 2:49）
    text:
      ru: 'Он сказал им: зачем было вам искать Меня? или вы не знали, что Мне должно быть в том, что́ принадлежит Отцу Моему?'
      cn: 彼向伊等曰、何为寻我耶、岂不知我当在属我父者乎、
  - type: paragraph
    text:
      ru: 'Почему же они искали Его? Ужели предполагали, что Он, как дитя, потерялся или заблудился? Прочь такая мысль! Ибо она не могла прийти ни премудрой Марии, получившей бесчисленные о Нем откровения, ни Иосифу, которому и самому было открыто, что Он от Духа Святого. Но они искали Его затем, чтобы Он как-нибудь не отстал от них, чтобы как-нибудь не оставил их. А когда нашли Его, смотри, как Он отвечает им! Так как Дева назвала Иосифа отцом Его, то Он говорит: не он, Иосиф, Мой истинный отец, хотя Я был в его доме; но Бог – Мой Отец, и потому Я в Его доме, то есть в храме Его.'
      cn: '为什么他们要寻找他呢？难道他们以为他像个孩子那样迷路或走失了吗？这种想法当立刻摒弃！因为它不可能出现在智慧的马利亚心中——她获得了关于他的无数启示；也不可能出现在约瑟心中——他本人也被启示，知道他是来自圣灵的。


        但是，他们寻找他，是为了让他无论如何不要落后于他们，无论如何不要离开他们。


        当他们找到他时，看他如何回答他们！因为童贞女（马利亚）称约瑟为他的父亲，所以他说：约瑟不是我真正的父亲，尽管我曾在他的家中；但上帝是我的父亲，因此我在他的家中，也就是说，在他的圣殿里。'
  - type: paragraph
    initial:
      ru: 'Лк 2:50. '
      cn: （路加福音 2:50）
    text:
      ru: Но они не поняли сказанных Им слов.
      cn: 而彼等不悟其所吿之言语、
  - type: paragraph
    text:
      ru: '«Но они не поняли», что Он сказал им: ибо это была тайна.'
      cn: 「而彼等不悟」，其所言之言语：盖此乃一奥秘。
  - type: paragraph
    initial:
      ru: 'Лк 2:51. '
      cn: （路加福音 2:51）
    text:
      ru: И Он пошел с ними и пришел в Назарет; и был в повиновении у них.
      cn: 偕之下、来至那咂列特而承顺之、其母藏此诸言于其心、
  - type: paragraph
    text:
      ru: Иисус повиновался родителям, давая и нам образец, чтобы мы повиновались своим родителям.
      cn: 耶稣顺服了父母，也为我们树立了一个榜样，好叫我们顺服自己的父母。
  - type: paragraph
    text:
      ru: И Матерь Его сохраняла все слова сии в сердце Своем.
      cn: 而其母将所有此诸言语，皆保存于其心内。
  - type: paragraph
    text:
      ru: Дева соблюдала все это; ибо дела и слова Отрока были божественны и являли в Нем не двенадцатилетнего отрока, но человека совершенно зрелого.
      cn: 贞女遵守了这一切；因为这孩童的作为与言语乃是神圣的，并在祂身上所昭示的，不是一个十二岁的孩童，而是一个全然成熟的人。
  - type: paragraph
    initial:
      ru: 'Лк 2:52. '
      cn: （路加福音 2:52）
    text:
      ru: Иисус же преуспевал в премудрости и возрасте
      cn: 伊伊稣斯进益以智慧年纪及恩宠在上帝在人间、
  - type: paragraph
    text:
      ru: Для объяснения того, что значит«преуспеватьв премудрости», евангелист присовокупляет:«и возрасте», ибо преуспевание«в возрасте»называет успехом«в премудрости».
      cn: 解释「在智慧里进益」的含义，福音书作者附加说：「也在年纪里」；因为他称在「年纪」里的进益为在「智慧」里的成功。
  - type: paragraph
    text:
      ru: и в любви у Бога и человеков.
      cn: 和 在上帝与世人间的爱中。
  - type: paragraph
    text:
      ru: то есть творил угодное Богу и достохвальное от людей; но прежде был приятен пред Богом, а потом пред людьми; ибо прежде должно угождать Богу, а потом людям.
      cn: 也就是说，祂所行的事是蒙上帝悦纳的，并值得世人赞美的；但祂首先是蒙上帝喜悦的，然后才蒙世人喜悦的；因为我们必须首先取悦上帝，然后才取悦世人。
- type: heading1
  text:
    ru: Глава третья
    cn: 第三章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 3:1. '
      cn: （路加福音 3:1）
    text:
      ru: В пятнадцатый же год правления Тиверия кесаря, когда Понтий Пилат начальствовал в Иудее, Ирод был четвертовластником в Галилее, Филипп, брат его, четвертовластником в Итурее и Трахонитской области, а Лисаний четвертовластником в Авилинее,
      cn: 〇碣萨儿提韦利乙在位十五年、彭提乙批剌特管理伊屋叠亚方伯、伊罗德分封于戛利列亚、其兄弟肥利普分封伊突列亚及特拉霍尼特之地、而梨萨尼乙分封阿韦梨涅亚、
  - type: paragraph
    text:
      ru: Справедливо упомянуто о времени и о властителях, чтобы показать, что при Христе прекратилось преемство начальников иудейских; поскольку игемоном был Пилат, человек из другого народа, четвертовластники – сыновья Ирода аскалонитянина, и чтобы потому за верное было принято, что пришел Христос, по пророчеству Иаковлеву (Быт. 49, 10).
      cn: 提及时间与掌权者是正当的，旨在表明：在基督降临之时，犹太人首领的继承序列已告终止；因为当时的总督是彼拉多，一个外族之人；而分封的王们则是亚斯卡隆人希律的儿子们。这样，就应当确信基督已经降临，正如亚适乌的预言（创世记 49:10）所示。
  - type: paragraph
    initial:
      ru: 'Лк 3:2. '
      cn: （路加福音 3:2）
    text:
      ru: при первосвященниках Анне и Каиафе, был глагол Божий к Иоанну, сыну Захарии, в пустыне.
      cn: 昂那及喀伊阿发为司祭首时、上帝之言予咂哈利亚之子、伊鄂昂在旷野、
  - type: paragraph
    text:
      ru: «Был, – сказано, –глагол Божий к Иоанну», чтобы ты знал, что он пришел свидетельствовать о Христе не как самозванец, но потому, что был движим Духом Божиим. Под «глаголом» разумей или Духа Святого, или повеление Божие. Слово Божие к Иоанну было«в пустыне». Поскольку дети оставленной церкви[***], то есть церкви из язычников, были многочисленнее детей«имеющей мужа»(Ис.54:1), то есть церкви иудейской, то слово и повеление Божие прилично было к Иоанну, когда он находился в пустыне.
      cn: 「如经上所言，『上帝之言予伊鄂昂。』」目的是让你知道，他前来为基督作证，并非是冒名顶替者，而是因为他受上帝之灵所感动。「言语」（глаголом）一词，你可以理解为圣灵，或者理解为上帝的命令。上帝对伊鄂昂所言的道是在「旷野」。鉴于「被离弃之教会」[*]（即从外邦人而来的教会）的子女多于「有丈夫的」（以赛亚书 54:1）教会（即犹太教会）的子女，故此，上帝的言语和命令，在伊鄂昂身处旷野之时临到他，是恰当的。
  - type: paragraph
    initial:
      ru: 'Лк 3:3. '
      cn: （路加福音 3:3）
    text:
      ru: И он проходил по всей окрестной стране Иорданской, проповедуя крещение покаяния для прощения грехов,
      cn: 彼来至伊鄂儿当之遍地、传改悔之洗礼、以得罪赦、
  - type: paragraph
    text:
      ru: Он проповедовал людям«крещение покаяния», то есть исповеди. А это крещение содействовало им к оставлению грехов, даруемому через крещение Христово. Ибо крещение Иоанново не имело оставления грехов, но вело к оставлению, то есть приготовляло людей к принятию Христова крещения, имеющего оставление грехов.
      cn: 他向民众宣讲「悔改之洗礼」，亦即忏悔。而此洗礼有助于他们获得罪愆的赦免，此赦免是通过基督的洗礼所赐予的。因为伊鄂昂的洗礼不具备罪愆的赦免，但它导向赦免，亦即，它预备民众去接受具有罪愆赦免的基督的洗礼。
  - type: paragraph
    initial:
      ru: 'Лк 3:4. '
      cn: （路加福音 3:4）
    text:
      ru: 'Как написано в книге слов пророка Исаии, который говорит(Ис.40:3–5): глас вопиющего в пустыне: приготовьте путь Господу, прямыми сделайте стези Ему;'
      cn: 如载先知伊萨伊亚书之言云、在旷野有声呼、预备主道修直其径哉、
  - type: paragraph
    initial:
      ru: 'Лк 3:5. '
      cn: （路加福音 3:5）
    text:
      ru: всякий дол да наполнится, и всякая гора и холм да понизятся, кривизны выпрямятся и неровные пути сделаются гладкими;
      cn: 凡谷宜填、凡山而岗宜卑、屈曲者使直、崎岖使平、
  - type: paragraph
    text:
      ru: '«Путь», который повелевает уготовить, есть образ жизни по учению Христову; ибо Господь вскоре имел проповедовать.«Стези»суть заповеди Закона, как бы уже истертые. Повелевается делать их«прямыми», потому что фарисеи развращали заповеди. Под «путем» можно разуметь и душу, а под «стезями» – помыслы и дела. Итак, нам должно уготовлять душу и делать правыми дела и помышления наши. Потом как бы кто-либо спросил: как же мы совершим это? Ибо добродетель нелегка для исполнения и встречает много козней и препятствий и от лукавых сил, и от живущих в нас страстей? Отвечает, что ничто не будет трудно, но все удобно. Ибо долины«наполнятся», то есть естественные наши силы, ослабевшие для добра и пришедшие в низкое состояние, восполнятся;«всякая гора и холм», то есть противные силы и пожелания, кажущиеся нам вложенными с природой, поистине ослабели: и все сделалось ровным, и кривое переменилось на прямое. Ибо Христос упразднил противные силы, которые здесь называются горами и холмами, и оживил природные наши побуждения к добру, которые евангелист назвал наполняемыми долинами. Ибо Он для того и воплотился, чтобы восставить нашу природу в собственный ее вид.'
      cn: 祂所吩咐要「预备」的「道路」，乃是按照基督的教导而生活的方式；因为主很快就要传道了。「路径」则是律法的诫命，仿佛已被磨损。吩咐要使它们「直的」，因为法利赛人败坏了这些诫命。在「道路」之下，也可以理解为灵魂，而在「路径」之下，则可以理解为意念和行为。因此，我们应当预备我们的灵魂，并使我们的行为和意念正直。然后，仿佛有人会问：我们如何成就此事呢？因为德行并非易于实行，且会遭遇许多来自邪恶势力以及居住在我们内在的激情（情欲）的阴谋诡计和障碍？（经文）回答说，没有什么会是困难的，一切都将是便利的。因为「山谷应填满」，即我们天然的力量，那些为着良善而衰弱并沦于低下的状态的，将会被补满；「凡山而岗」，即那些敌对的势力和私欲，在我们看来仿佛是与生俱来的，它们实在已衰弱了：一切都变得平坦，弯曲的变为了正直的。因为基督废除了敌对的势力（在此处它们被称为山和岗），并使我们天然向善的驱动力得以复苏，福音书作者将这些驱动力称为被填满的山谷。因为祂道成肉身正是为了将我们的本性恢复到其原本的形态。
  - type: paragraph
    initial:
      ru: 'Лк 3:6. '
      cn: （路加福音 3:6）
    text:
      ru: и узрит всякая плоть спасение Божие.
      cn: 凡肉体将见上帝之拯救、
  - type: paragraph
    text:
      ru: «Узрит всякая плоть, – сказано, –спасение Божие», – не иудеи только и пришельцы, но«всякая плоть», ибо Евангелие пронесено по всей земле. Можно было бы сказать и многое другое, но по большей ясности пусть будет сказано это.
      cn: 「凡肉体将见上帝之拯救，」——经文如此说道——「凡肉体将见上帝之拯救，」——不只是犹太人与寄居者（пришельцы），而是「凡肉体」，因为福音已传遍全地。本可以再说许多别的话语，但为求更大的清晰度，就让这些话语被说出吧。
  - type: paragraph
    initial:
      ru: 'Лк 3:7. '
      cn: （路加福音 3:7）
    text:
      ru: 'Иоаннприходившему креститься от него народу говорил: порождения ехиднины! кто внушил вам бежать от будущего гнева?'
      cn: 彼与民来受由之领洗者、如此曰、毒蛇之类乎、谁属尔逃避将来之怒、
  - type: paragraph
    text:
      ru: Иудеев называет«порождениямиехидниными», потому что они оскорбляли своих отцов и матерей; ибо это животное, – говорят, – проедает утробу матери и таким образом рождается. Притом они убивали пророков и учителей. «Будущим гневом» называет вечное наказание.
      cn: 他称呼犹太人为「毒蛇之类」（порождениями ехидниными），因为他们侮辱了他们的父母；因为——他们说——这动物会咬穿其母亲的子宫，并以这种方式出生。此外，他们还杀害了先知和教师。他称「将来之怒」（будущим гневом）为永恒的惩罚。
  - type: paragraph
    initial:
      ru: 'Лк 3:8. '
      cn: （路加福音 3:8）
    text:
      ru: 'Сотворите же достойные плоды покаяния и не думайте говорить в себе: отец у нас Авраам, ибо говорю вам, что Бог может из камней сих воздвигнуть детей Аврааму.'
      cn: 故当结改悔之果哉、勿自意谓我侪有父系阿乌拉阿木也、盖语尔等曰、然上帝能从此石予阿乌拉阿木亦造出子、
  - type: paragraph
    text:
      ru: «Достойные плоды покаяния»составляет не только удаление от зла, но и упражнение в добре; ибо совершение добра есть поистине плод и порождение покаяния. Не начинайте говорить в себе, что вы хорошего рода, и, надеясь на отцов, не оставляйте добродетели. Бог сможет и от«камней сих...датьдетей»патриарху; ибо почти подобное этому Он и прежде сотворил. Утроба Сарры хотя была тверже камней, однако ж она получила благодать деторождения (Быт. 17, 17).
      cn: 「改悔之当结之果」不仅在于远避邪恶，亦在于勤行良善；盖因行善确实乃是改悔之果实与所生之物。勿开始在心中言说，你们出自良善的族系，也勿要因仰仗先祖而抛却德行。上帝也能从「此石……给先祖造出子」；盖因祂此前就已成就了几乎与之相仿之事。撒拉的母腹，虽比石头更坚硬，然而她却蒙得了生育之恩典（创世记 17:17）。
  - type: paragraph
    initial:
      ru: 'Лк 3:9. '
      cn: （路加福音 3:9）
    text:
      ru: 'Уже и секира при корне дерев лежит: всякое дерево, не приносящее доброго плода, срубают и бросают в огонь.'
      cn: 盖今斧已置于树根矣、凡树不结善果者、斫之投于火、
  - type: paragraph
    text:
      ru: «Секира»есть божественный суд, исторгающий недостойных из среды живых. Если, – говорит, – не покаетесь, будете лишены жизни. Секира лежит«при корневашихдерев». Под «корнем» разумеется жизнь, как мы сказали. Но под «корнем» можно разуметь и родство с Авраамом. От этого родства с Авраамом, по апостолу (Рим. 11:21–22), отсекаются те, кои недостойны быть его ветвями. Наказание – двоякое, ибо грешный и бесплодный не только отсекается от сродства с праведными, но и в огонь ввергается.
      cn: 「斧子」是神圣的审断，它将不配的人从活人当中拔除。他说，你们若不悔改，就将被剥夺生命。斧子置于「树木的根上」。「根」指的正是生命，如我们所言。然而，「根」也可以理解为与阿乌拉阿阿木的亲缘关系。从这与阿乌拉阿阿木的亲缘关系中，根据使徒的说法（罗马书 11:21-22），那些不配作其枝条的人将被砍下。刑罚是双重的，因为那有罪又贫瘠的，不仅从与义人的血缘关系中被砍下，而且被投入火中。
  - type: paragraph
    initial:
      ru: 'Лк 3:10. '
      cn: （路加福音 3:10）
    text:
      ru: 'И спрашивал его народ: что же нам делать?'
      cn: 诸民又问之曰、我侪何为、
  - type: paragraph
    initial:
      ru: 'Лк 3:11. '
      cn: （路加福音 3:11）
    text:
      ru: 'Он сказал им в ответ: у кого две одежды, тот дай неимущему, и у кого есть пища, делай то же.'
      cn: 彼答之曰、有二衣者、可施予无有者、有食者行亦然、
  - type: paragraph
    initial:
      ru: 'Лк 3:12. '
      cn: （路加福音 3:12）
    text:
      ru: 'Пришли и мытари креститься, и сказали ему: учитель! что нам делать?'
      cn: 税吏等亦来由之领洗、而谓彼曰、师欤、我侪何为、
  - type: paragraph
    initial:
      ru: 'Лк 3:13. '
      cn: （路加福音 3:13）
    text:
      ru: 'Он отвечал им: ничего не требуйте более определенного вам.'
      cn: 彼语之曰、勿索过逾定额者
  - type: paragraph
    initial:
      ru: 'Лк 3:14. '
      cn: （路加福音 3:14）
    text:
      ru: 'Спрашивали его также и воины: а нам что делать? И сказал им: никого не обижайте, не клевещите, и довольствуйтесь своим жалованьем.'
      cn: 兵卒亦问之曰、我侪何为、彼又问之曰、勿强索人、勿诬诈人、以尔等之粮饷为足、
  - type: paragraph
    text:
      ru: 'Иоанн вразумляет три разряда пришедших к нему: простой класс народа, мытарей и воинов. Простой класс народа он убеждает прилежать к милостыне, повелевая, чтобы имеющий«две одежды»уделял неимущему; мытарей убеждает не взыскивать, то есть не требовать ничего лишнего; воинов убеждает не похищать, но довольствоваться оброками, то есть жалованьем, какое обыкновенно дается от царя. Смотри, как Иоанн простой класс народа, как незлобивых, убеждает делать нечто доброе, то есть уделять другим, а мытарей и воинов – удерживаться от зла. Ибо сии не были еще способны, не могли совершать что-нибудь доброе, а им достаточно было – не делать зла. Некоторые повеление – имеющему«две одежды»делиться с неимеющим – понимают в нравственном смысле. Именно говорят: две одежды означают Дух Писания и букву; имеющего то и другое Иоанн побуждает сообщать совершенно ничего не имеющему; например, если кто разумеет Писание в обоих отношениях, по букве и по духу, тот пусть передает неимеющему, пусть научит незнающего и даст ему по крайней мере, букву.'
      cn: 施洗者伊鄂昂开导前来寻他的三种人：普通阶层的人民、税吏与兵卒。他劝服普通阶层的人民要致力于施舍，吩咐那拥有「两件衣裳」的人，要分给没有的人；他劝服税吏不要强索，即是说不要索取任何额外的钱财；他劝服兵卒不要抢夺，但要满足于他们的粮饷，即是说，满足于通常由君王所发的薪俸。看哪，伊鄂昂如何劝服普通阶层的人民（因他们是纯良的）行善，即是分给他人；而劝服税吏与兵卒则要遏制自己不行恶。因为后者（税吏与兵卒）尚不具备能力，不能行出什么善事，对他们来说，足够的就是——不行恶。有些人从道德意义上理解「拥有『两件衣裳』者要分给没有者」的吩咐。他们明确地说：两件衣裳指经文的精义与字面意义；伊鄂昂敦促拥有这两者的人，要传授给那完全不具备的人；例如，若有人在字面意义和精义两方面都理解经文，那么他就应将此传授给不具备的人，教导那无知的人，至少也要传授给他字面意义。
  - type: paragraph
    initial:
      ru: 'Лк 3:15. '
      cn: （路加福音 3:15）
    text:
      ru: Когда же народ был в ожидании, и все помышляли в сердцах своих об Иоанне, не Христос ли он, –
      cn: 适民冀望而于其心中意谓伊鄂昂彼系合唎斯托斯否、
  - type: paragraph
    initial:
      ru: 'Лк 3:16. '
      cn: （路加福音 3:16）
    text:
      ru: 'Иоанн всем отвечал: я крещу вас водою, но идёт Сильнейший меня, у Которого я недостоин развязать ремень обуви; Он будет крестить вас Духом Святым и огнем.'
      cn: 伊鄂昂答众曰、夫我授洗尔等以水、有来者胜于我、不堪为之解其履之革带、彼将以圣神及火授洗尔等、
  - type: paragraph
    text:
      ru: 'Добродетель Иоанна была столь высока, что все помышляли о нем, не он ли самый Христос? Отвращая таковое мнение, он говорит: различие между мной и Христом, во-первых, то, что«я крещу... водой", а«Он... – Духом... и огнем», а другое – то, что«я недостоиндажеразвязать ремень обуви»Его. Что значат слова:«крестить вас Духом Святым и огнем», совершенно ясно; ибо Он послал апостолам Духа, и над ними явились разделенные огненные языки (Деян. 2, 3–4). А слова:«недостоин развязать ремень обуви», очевидно, означают то, что я недостоин поставить себя даже и в последние рабы Его. В более сокровенном смысле обувь обоих ног Господа суть – явление Его с неба на землю и сошествие с земли во ад. Способа этих двух явлений никто не может разрешить, хотя бы подобен был даже Иоанну. Ибо кто может сказать, как воплотился Господь или как сошел во ад?'
      cn: '伊鄂昂的德行如此崇高，以至于所有人都揣测他莫非就是基督本人？为了驳斥这种观点，他说：我与基督之间的区别，首先是，「我施洗……用水」，而「祂……则施洗……用圣神和火」，其次是，「我甚至不配解开祂鞋子的革带」。


        「以圣神和火施洗尔等」这些话的含义是完全清晰的；因为祂将圣神送给了使徒们，并且有如火焰般分开的舌头显现在他们身上（使徒行传 2:3-4）。而「不配解开鞋子的革带」这些话，显然意味着我不配将自己置于祂最末等的奴仆之列。


        在更隐秘的意义上，吾主双脚的鞋子是——祂从天降至地上以及从地降至阴间的显现。对于这两种显现的方式，没有人能够解开（或解决），即便他像伊鄂昂一样伟大。因为有谁能说出吾主是如何取得肉身的，或者祂是如何降至阴间的呢？'
  - type: paragraph
    initial:
      ru: 'Лк 3:17. '
      cn: （路加福音 3:17）
    text:
      ru: Лопата Его в руке Его, и Он очистит гумно Свое и соберет пшеницу в житницу Свою, а солому сожжет огнем неугасимым.
      cn: 其锨在其手、彼将净其禾场、敛麦入仓、而焚糠以不灭之火、
  - type: paragraph
    text:
      ru: Слова:«Лопата Его в руке Его»означают то, что хотя Он и крестит вас, вы не думайте, что вы уже безнаказанны; но если вы в последующей за этим жизни не сохраните себя беспорочными, то Он «пожжетвасогнем неугасимым». Плевел есть тот, кто имеет бесплодный ум и прилагает большую заботу только о предметах житейских.
      cn: 词语：「其锨在其手」 意指，尽管祂已为你们施洗，你们也不要以为自己已经可以不受惩罚；但是如果你们在接下来的生活中不能保持自己毫无瑕疵，那么祂就将「以不灭之火焚烧你们」。 稗子（plevel）指的是那些心智贫瘠、且只对俗世之事怀有巨大忧虑的人。
  - type: paragraph
    initial:
      ru: 'Лк 3:18. '
      cn: （路加福音 3:18）
    text:
      ru: Многое и другое благовествовал он народу, поучая его.
      cn: 以他多端劝慰传福音于民、
  - type: paragraph
    text:
      ru: Ибо доброе учение есть поистине утешение и справедливо называется благовестием (Евангелием).
      cn: 因为优良的教义实在就是安慰，并且公允地被称为喜讯（福音）。
  - type: paragraph
    initial:
      ru: 'Лк 3:19. '
      cn: （路加福音 3:19）
    text:
      ru: Ирод же четвертовластник, обличаемый от него за Иродиаду, жену брата своего, и за всё, что сделал Ирод худого,
      cn: 〇分封之伊罗德被其见责、因其弟妻伊罗底阿达及伊罗德所行诸恶之故、
  - type: paragraph
    initial:
      ru: 'Лк 3:20. '
      cn: （路加福音 3:20）
    text:
      ru: прибавил ко всему прочему и то́, что заключил Иоанна в темницу.
      cn: 于此一切益增即囚伊鄂昂于狱、
  - type: paragraph
    initial:
      ru: 'Лк 3:21. '
      cn: （路加福音 3:21）
    text:
      ru: 'Когда же крестился весь народ, и Иисус, крестившись, молился:'
      cn: 适诸民领洗、伊伊稣斯亦领洗、而祈祷之时、天开、
  - type: paragraph
    text:
      ru: 'Евангелист к месту вставил здесь слово об Ироде. Он как бы так говорит: хотя народ весьма высоко думал об Иоанне, но Ирод,«обличаемый от него», ко всем злодеяниям своим«прибавил... и то, что заключилегов темницу». Повествует как бы с глубокой скорбью и сильной жалостью о том, что Ирод так неправо поступил с Иоанном, тогда как народ имел о нем высокое понятие.'
      cn: 福音撰述者在此处适时地插入了关于希律的词语。他仿佛这样说道：尽管民众对伊鄂昂评价甚高，但希律，「被他所斥责」（oblichaemyy ot nego），在他所有的恶行之上「又添上了……将他下在监里」（zaklyuchil ego v temnitsu）的这一桩事。他叙述时仿佛带着深深的忧伤和强烈的怜悯，为希律如此不义地对待伊鄂昂感到痛惜，而当时民众对伊鄂昂却怀有如此崇高的看法。
  - type: paragraph
    text:
      ru: отверзлось небо,
      cn: 天开、
  - type: paragraph
    text:
      ru: для того, чтобы нам показать, что крещение всем отворяет небо, запертое Адамом.
      cn: 为要向我们表明，洗礼向所有人敞开了那被亚当封闭的天国。
  - type: paragraph
    initial:
      ru: 'Лк 3:22. '
      cn: （路加福音 3:22）
    text:
      ru: и Дух Святый нисшел на Него
      cn: 圣神以形体如鸽降临其上、又自天有声云、尔乃我之爱子、我所喜悦者、
  - type: paragraph
    text:
      ru: «Дух Святый нисшел на»Иисуса, чтобы мы познали из сего, что и на нас, когда крещаемся, приходит Дух. Ибо Господь не имел нужды в Духе, но все творит ради нас и Сам бывает первенцем во всем (Кол. 1, 18), что мы имели принять впоследствии, чтобы быть первородным во многих братиях.
      cn: 「圣神降临于」耶稣，是为了让我们由此得知，当我们受洗时，圣神也会降临于我们。因为主并不需要圣神，但祂所做的一切都是为了我们，并且祂自己在凡事上都成为头生的（歌罗西书 1:18），以便我们这些后来承受的人，能在许多弟兄中成为长子。
  - type: paragraph
    text:
      ru: в телесном виде, как голубь,
      cn: 在体相上，如同鸽子，
  - type: paragraph
    text:
      ru: чтобы мы научились, что нам нужно быть кроткими и чистыми. И как при Ное голубь изображал успокоение гнева Божия (Быт. 8, 8–11), так и здесь Дух Святый, потопив грех, примирил нас с Богом.
      cn: 为了使我们学习到，我们必须是温和（或：柔和）且纯洁的。正如在挪亚时代，鸽子象征着平息了上帝的愤怒（创世记 8:8-11），因此，在这里，圣灵在淹没罪恶之后，也使我们与上帝和好了。
  - type: paragraph
    text:
      ru: 'и был глас с небес, глаголющий: Ты Сын Мой Возлюбленный;'
      cn: 遂有声音自天，讲话者谓：你是我之爱子。
  - type: paragraph
    text:
      ru: И Сын слышит глас, от Отца произнесенный, чтобы показать, что и нам крещаемым Он даровал сыноположение.
      cn: 圣子听见了由父所发出的声音，为要表明甚至对我们这些受洗者，祂也已授予了嗣子地位。
  - type: paragraph
    text:
      ru: в Тебе Мое благоволение!
      cn: 在你的里面，是我的嘉许！
  - type: paragraph
    text:
      ru: – в Тебе Я успокоился.
      cn: ——在我里面，我找到了安息/满足。
  - type: paragraph
    initial:
      ru: 'Лк 3:23. '
      cn: （路加福音 3:23）
    text:
      ru: –38.Иисус, начинаяСвоё служение,был лет тридцати, и был, как думали, Сын Иосифов, Илиев, Матфатов, Левиин, Мелхиев, Ианнаев, Иосифов, Маттафиев, Амосов, Наумов, Еслимов, Наггеев, Маафов, Маттафиев, Семеиев, Иосифов, Иудин, Иоаннанов, Рисаев, Зоровавелев, Салафиилев, Нириев, Мелхиев, Аддиев, Косамов, Елмодамов, Иров, Иосиев, Елиезеров, Иоримов, Матфатов, Левиин, Симеонов, Иудин, Иосифов, Ионанов, Елиакимов, Мелеаев, Маинанов, Маттафаев, Нафанов, Давидов, Иессеев, Овидов, Воозов, Салмонов, Наассонов, Аминадавов, Арамов, Есромов, Фаресов, Иудин, Иаковлев, Исааков, Авраамов, Фаррин, Нахоров, Серухов, Рагавов, Фалеков, Еверов, Салин, Каинанов, Арфаксадов, Симов, Ноев, Ламехов, Мафусалов, Енохов, Иаредов, Малелеилов, Каинанов, Еносов, Сифов, Адамов, Божий.
      cn: 〇其始务之时年约三十、人意之为伊鄂锡福之子、又系伊利乙者、
  - type: paragraph
    text:
      ru: 'Господь крестился, имея тридцать лет, потому что этот возраст есть совершеннейший, и в нем человек оказывается почтенным или негодным. Лука представляет родословие Господа в порядке обратном, сравнительно с евангелистом Матфеем (Мф.1, 1–16), чтобы показать, что родившийся ныне по плоти есть от Бога, – ибо смотри, как родословие восходит до Бога, – и вместе, чтобы мы знали, что Он воплотился для того, чтобы всех посредствующих отцов возвести к Богу и сделать сынами. Могу сказать и иначе: рождение Господа, как бессеменное, встречало неверие. Поэтому евангелист, желая показать, что и в другое время человек был без семени, от низших восходит до Адама и Бога. Он говорит как бы так: если ты не веруешь, как второй Адам родился без семени, то, прошу, обратись умом к первому Адаму, и ты найдешь, что он сотворен Богом без семени, и после сего не будь неверен. Некоторые спрашивают: как Матфей называет Иосифа сыном Иаковлевым, а Лука – Илиевым? Ибо невозможно, – говорят, – одному и тому же быть сыном двух отцов. На это отвечают, что Иаков и Илий были единоутробные братья, но от разных отцов, что, по смерти Илия, жену его взял Иаков, чтобы восставить от нее детей, и что поэтому Иосиф называется сыном Иаковлевым по природе, а Илиевым – по Закону. Ибо Иаков действительно родил его по природе, и он был родной сын его, а сыном Илиевым он был только по Закону. Ибо Закон повелевал, чтобы жена умершего бездетным сочетавалась с его братом и чтобы родившееся от сего союза считалось дитятею умершего (Втор. 25, 5–6), хотя по природе оно было от живого. Поэтому евангелисты говорят верно, и не противоречат друг другу. Матфей записал природного отца Иосифа, а Лука – причитающегося ему отцом по Закону, то есть Илия; а оба показывают, что Господь родился для того, чтобы освятить природу и Закон.'
      cn: '主在三十岁时受洗，因为此年龄是最为圆满的，人在其中或被证明为可敬的，或为不合格的。


        与传福音者马太（马太福音 1:1-16）相比，路加以相反的顺序呈现了主的家谱，以表明那现今按肉身而生者是源自于神的——因为请看，家谱是如何追溯至神的——同时也为了让我们知道，祂降生是为要把所有居于中间的父辈都引向神，并使他们成为神的儿子。


        我也可以另作他论：主的诞生，因其无籽（无种）性，遭遇了不信。因此，传福音者意欲表明，在其他时候人也是无籽的，便从较低的辈分追溯至亚当和神。他好像是这样说：如果你不信第二个亚当是如何无籽而生的，那么，我请求你，在思想上转向第一个亚当，你就会发现他是神无籽而造的，此后就不要再不信了。


        有些人问道：马太称约瑟是亚适乌的儿子，而路加又称他是以利的儿子，这是怎么回事？因为他们说，不可能同一个人是两位父亲的儿子。


        对此的回答是，亚适乌和以利是同母异父的兄弟，而以利死后，亚适乌娶了他的妻子，以便为他兴起后裔，因此约瑟按本性而言被称为亚适乌的儿子，而按《律法》而言则被称为以利的儿子。因为亚适乌确实按本性生了他，他是亚适乌的亲生儿子，而他只是按《律法》而言成为以利的儿子。因为《律法》命令，死时无子嗣者的妻子应与他的兄弟结合，而从这次结合所生的孩子应被视为已死之人的孩子（申命记 25:5-6），尽管按本性而言，他是活人的孩子。


        因此，传福音者们言之凿凿，彼此之间并无矛盾。马太记载了约瑟按本性的父亲，而路加记载了按《律法》应被算作其父的，即以利；而两者都表明，主的降生是为了圣化本性和《律法》。'
- type: heading1
  text:
    ru: Глава четвертая
    cn: 第四章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 4:1. '
      cn: （路加福音 4:1）
    text:
      ru: Иисус, исполненный Духа Святаго, возвратился  от Иордана и поведен был Духом в пустыню.
      cn: 〇伊伊稣斯被圣神充满自伊鄂儿当而归、被圣神引至旷野、
  - type: paragraph
    text:
      ru: Господь крестился для того, чтобы освятить воды для нас, имеющих вкусить благодати. После Крещения«поведен был Духом в пустыню», ибо Дух Святой вводил Его в борьбу против диавола. Уходит«в пустыню»затем, чтобы дать диаволу повод к нападению на Себя, ибо он приступает к нам особенно тогда, когда мы уединились.
      cn: 主受洗是为了给我们这些将要尝受恩典的人祝圣水。受洗之后，「被圣神引至旷野」，因为圣神将祂引入了对抗魔鬼的争战中。祂「进入旷野」是为了给魔鬼一个攻击祂的理由，因为魔鬼特别是在我们独处时才会向我们发起侵袭。
  - type: paragraph
    initial:
      ru: 'Лк 4:2. '
      cn: （路加福音 4:2）
    text:
      ru: Там сорок дней Он был искушаем от диавола и ничего не ел в эти дни,
      cn: 四十日以为魔试、于其日毫不食、其毕、终而觉饥、
  - type: paragraph
    text:
      ru: Постится«сорок дней»и не превышает меры поста Моисеева и Илиина, чтобы тем не подать сатане мысль, что Он больше их, но чтобы он приступил к Нему, думая, что и Он – человек, а вместе и для того, чтобы не показаться воплотившимся только призрачно. «Искушается» после Крещения, чтобы нам показать, что после крещения нас встретят искушения. Постится потому, что пост есть великое оружие в искушениях, и потому, что после крещения нам должно предаваться не чувственным наслаждениям, а посту.
      cn: 「禁食『四十日』」，并且未曾超过摩西和以利亚禁食的尺度，以免由此向撒但传达祂比他们更伟大的想法，而是为了让撒但前来接近祂，以为祂也是一个人；同时也是为了不显得祂仅是虚幻地道成肉身。「受试探」是在受洗之后，是为了向我们表明，在受洗之后，我们将遭遇试探。祂禁食是因为禁食是应对试探的伟大武器，同时也是因为在受洗之后，我们不应沉溺于肉体的享乐，而应当致力于禁食。
  - type: paragraph
    text:
      ru: а по прошествии их напоследок взалкал.
      cn: 「其毕、终而觉饥。」
  - type: paragraph
    initial:
      ru: 'Лк 4:3. '
      cn: （路加福音 4:3）
    text:
      ru: 'И сказал Ему диавол: если Ты Сын Божий, то вели этому камню сделаться хлебом.'
      cn: 魔鬼语之曰、尔若系上帝子吩咐此石为饼、
  - type: paragraph
    initial:
      ru: 'Лк 4:4. '
      cn: （路加福音 4:4）
    text:
      ru: 'Иисус сказал ему в ответ: написано(Втор.8:3), что не хлебом одним будет жить человек, но всяким словом Божиим.'
      cn: 伊伊稣斯答之曰、记载云、非独倚饼人可生、乃倚上帝所出之言耳、
  - type: paragraph
    initial:
      ru: 'Лк 4:5. '
      cn: （路加福音 4:5）
    text:
      ru: И, возведя Его на высокую гору, диавол показал Ему все царства вселенной во мгновение времени,
      cn: 魔鬼又携之于高山、以天下万国于霎时之间示之、
  - type: paragraph
    initial:
      ru: 'Лк 4:6. '
      cn: （路加福音 4:6）
    text:
      ru: 'и сказал Ему диавол: Тебе дам власть над всеми симицарствамии славу их, ибо она предана мне, и я, кому хочу, даю ее;'
      cn: 魔鬼告之曰、我将以此诸权柄及其荣光予尔、因其归于我、随我所欲者而予之、
  - type: paragraph
    initial:
      ru: 'Лк 4:7. '
      cn: （路加福音 4:7）
    text:
      ru: итак, если Ты поклонишься мне, то всё будет Твое.
      cn: 尔若叩拜我、悉将属尔、
  - type: paragraph
    initial:
      ru: 'Лк 4:8. '
      cn: （路加福音 4:8）
    text:
      ru: 'Иисус сказал ему в ответ: отойди от Меня, сатана; написано: Господу Богу твоему поклоняйся, и Ему одному служи.'
      cn: 伊伊稣斯答之曰、萨他那、退我后哉、纪载云、叩拜主尔之上帝、且事奉惟其一也、
  - type: paragraph
    text:
      ru: Враг нападает на Него сначала пресыщением, как и на Адама (Быт. 3), потом – любостяжанием,«показавЕму все царства». Как показал? Некоторые говорят, что представил Ему их в мысли. Но я думаю, что не в мысли, а чувственно показал Ему их, подставив пред очи в призраке, а не в воображении Господа.
      cn: 敌人首先以饱食（暴食）攻击祂，正如攻击亚当一样（创世记 3），然后以贪婪攻击，「将万国都指给祂看」。如何指给祂看？有些人说，是在思想中将它们呈现在祂面前。但我认为，并非是在思想中，而是以感官的方式指给祂看，以幻象而非在主的想象中，将它们置于祂眼前。
  - type: paragraph
    initial:
      ru: 'Лк 4:9. '
      cn: （路加福音 4:9）
    text:
      ru: 'И повел Его в Иерусалим, и поставил Его на крыле храма, и сказал Ему: если Ты Сын Божий, бросься отсюда вниз,'
      cn: 彼又引之至耶鲁萨利木、而立之于殿顶、曰、尔若系上帝子、可自此投下、
  - type: paragraph
    initial:
      ru: 'Лк 4:10. '
      cn: （路加福音 4:10）
    text:
      ru: 'ибо написано(Пс.90:11–12): Ангелам Своим заповедает о Тебе сохранить Тебя;'
      cn: 盖纪载云、为尔命其天神护守尔、
  - type: paragraph
    initial:
      ru: 'Лк 4:11. '
      cn: （路加福音 4:11）
    text:
      ru: и на руках понесут Тебя, да не преткнешься о камень ногою Твоею.
      cn: 而伊等于手捧持尔、免尔足触于石、
  - type: paragraph
    text:
      ru: Далее, нападает на Него тщеславием, ибо говорит:«если Ты Сын Божий, бросься... вниз». Пустословил это, лаская Его, чтобы Он, обманувшись лестью и желая показать Себя Сыном Божиим, бросился вниз и таким образом открылся пред ним, кто Он. Но смотри, как Господь поражает его Писанием.
      cn: 接下来，他以虚荣（тщеславием）攻击祂，因为他说：「你若是上帝的儿子，就跳下去吧……。」他空口说了这话，是谄媚祂，好让祂被奉承所欺骗，为想显明自己是上帝的儿子，而跳下去，从而在他面前暴露自己是谁。但是你看，主是如何用经文击败他的。
  - type: paragraph
    initial:
      ru: 'Лк 4:12. '
      cn: （路加福音 4:12）
    text:
      ru: 'Иисус сказал ему в ответ: сказано: не искушай Господа Бога твоего.'
      cn: 伊伊稣斯答之曰、又有云、勿试探主尔之上帝也、
  - type: paragraph
    text:
      ru: ибо никто не должен подвергать себя очевидной опасности в самообольщении, что Бог ему поможет. Заметь и то, что знать Писания весьма полезно; ибо и Господь поразил сатану Писаниями.«Не хлебом однимбудет житьчеловек», это – Моисеево изречение о манне (Втор. 8, 3); ибо хотя манна была не хлеб, однако ж, питала народ. Равным образом Моисеевы изречения и сии:«Господу Богу твоему поклоняйся»и«не искушай»(Втор.6:13, 16).
      cn: 因为没有人应该在「上帝会帮助他」的自我欺骗中，将自己置于明显的危险之下。请留意，了解《圣经》是极其有益的；因为我们的主也是以《圣经》击败了撒旦。「人活着，不是单靠食物」，这是摩西关于吗哪的言论（申命记 8:3）；因为虽然吗哪不是面包，但它仍然滋养了百姓。同样，摩西的言论还有：「当拜主你的上帝」和「不可试探」（申命记 6:13，16）。
  - type: paragraph
    initial:
      ru: 'Лк 4:13. '
      cn: （路加福音 4:13）
    text:
      ru: И, окончив всё искушение,
      cn: 魔鬼诸试探既穷、乃暂离之、
  - type: paragraph
    text:
      ru: 'Хотя Господь искушаем был тремя искушениями, однако Лука говорит, что Он окончил всё искушение, потому что основания всех искушений суть три сии: пресыщение, любостяжание, тщеславие. Искушение пресыщения Господь отразил словами:«не хлебом одним будет жить человек». Прежде других искушений навел это искушение на Него, как и на Адама. Ибо Адама он не мог запнуть ни любостяжанием, так как Адам, будучи один, не имел против кого бы желать более; ни гневом, ибо не на кого было ему гневаться; ни завистью; а запнул его чревоугодием. Искушение любостяжания Господь отразил тем, что не пал, не поклонился перед ним. Ибо, когда он чувственно показал все царства в призраке, Господь не покорился ему. Некоторые разумели это о царствах не чувственных, но мыслимых, что он, например, показал Ему царство невоздержания, царство зависти и вообще всех грехов и говорил Ему как бы так: если Ты хочешь царствовать над всеми страстями и на то пришел, чтобы пленить одержимых мной, то пади и поклонись мне, и получи всех, над которыми я царствую. Господь хочет царствовать и на то пришел, но царствовать не с грехом, не без борьбы, но после подвига и победы. Так разумели некоторые. Кому угодно, пусть так и понимают. Отразил Господь и искушение тщеславия словами Писания. Господи, избавь нас от сих трех глав змия!'
      cn: 尽管主受了三次试探，然而路加却说他完成了所有的试探，因为所有试探的根基皆是这三项：饱食、贪婪、虚荣。主以「人活着不是单靠食物」这句话击退了饱食的试探。他（魔鬼）将此试探加诸于主，正如他加诸于亚当，使其先于其他的试探。因为他（魔鬼）不能以贪婪绊倒亚当，因为亚当孤身一人，没有对象可去渴望更多；也不能以愤怒绊倒他，因为他没有对象可去发怒；也不能以嫉妒绊倒他；而是以饕餮绊倒了他。主以「不仆倒、不向他敬拜」击退了贪婪的试探。因为，当他以幻象在感官上展示所有的国度时，主并未顺服他。有些人认为这指的是非感官的国度，而是可思的国度，即他（魔鬼）向主展示了不节制的国度、嫉妒的国度，以及所有罪恶的总体，并仿佛如此对他说：如果你想统御所有的情欲，如果你来此是为了俘虏被我辖制的人，那么就仆倒并敬拜我吧，你就能得到所有被我统治的人。主愿意统御，也为此而来，但不是带着罪恶、不是不经争战地统治，而是在奋战与得胜之后。有些人是如此理解的。谁若愿意，就让他如此理解吧。主也以经文的话语击退了虚荣的试探。主啊，求你救我们脱离那蛇的这三个头目！
  - type: paragraph
    text:
      ru: диавол отошел от Него до времени.
      cn: 魔鬼暂离他而去。
  - type: paragraph
    initial:
      ru: 'Лк 4:14. '
      cn: （路加福音 4:14）
    text:
      ru: И возвратился Иисус в силе духа в Галилею; и разнеслась молва о Нем по всей окрестной стране.
      cn: 伊伊稣斯于神之力归戛利列亚、其声名遍扬四方、
  - type: paragraph
    initial:
      ru: 'Лк 4:15. '
      cn: （路加福音 4:15）
    text:
      ru: Он учил в синагогах их, и от всех был прославляем.
      cn: 彼在其诸会堂教诲人、被众荣光之、
  - type: paragraph
    text:
      ru: «Возвратился Иисус в силе духа». Мне кажется, что Иисус возвратился в состоянии вдохновения, ибо это значит«в силе духа». Глубоко внимай Писанию, потому что тогда написано:«в силе духа», когда Он победил искусителя и явил силу Свою.
      cn: 「耶稣以圣神的大能返归。」在我看来，耶稣是带着灵感的状态返归的，因为这意指「以圣神的大能」。你当深度留意《圣经》，因为此处写着「以圣神的大能」，正是祂击败了试探者并彰显了祂的大能之时。
  - type: paragraph
    text:
      ru: 'Слова:«отошел от Него до времени»имеют такой смысл: диавол нападает на Господа двумя чувствованиями, – удовольствием и скорбью; удовольствием он напал на Господа, например, на горе; а отступил«от Него до времени», то есть до времени Креста, ибо тогда намеревался напасть на Него скорбью.'
      cn: 那些话语：「离开了祂，直到某个时刻」[这一短语]具有如下的涵义：魔鬼以两种情感——即享乐和忧伤——来攻击主；它曾以享乐攻击主，例如在山上（的试探）；而它「离开了祂，直到某个时刻」，也就是说，直到十字架的时刻，因为那时它意图以忧伤来攻击祂。
  - type: paragraph
    initial:
      ru: 'Лк 4:16. '
      cn: （路加福音 4:16）
    text:
      ru: И пришел в Назарет, где был воспитан, и вошел, по обыкновению Своему, в день субботний в синагогу, и встал читать.
      cn: 〇又来至那咂列特、即养育之处、于安息日依其常俗入会堂、起而欲读、
  - type: paragraph
    text:
      ru: Господь пожелал явить Себя израильтянам, потому что и помазан был от Бога и Отца на то, чтобы спасти живущих в поднебесной. Чудно устрояет Он это. Прежде иных Он является жителям Назарета, с которыми был воспитан, чтобы и нас научить, что нужно благотворить прежде своим и научить их, а потом изливать человеколюбие и на прочих.
      cn: 主愿向以色列人显现自身，因为祂被上帝和父所膏立，正是为了拯救居住在苍穹之下的人们。祂奇妙地安排了此事。祂首先向拿撒勒的居民显现，祂曾与他们一同长大，好教导我们也当首先善待并教导我们自己的人（「自己的」指亲属、本乡之人），然后才将仁爱倾注于其余之人。
  - type: paragraph
    initial:
      ru: 'Лк 4:17. '
      cn: （路加福音 4:17）
    text:
      ru: 'Ему подали книгу пророка Исаии; и Он, раскрыв книгу, нашел место, где было написано:'
      cn: 有以先知伊萨伊亚之书予之、彼展书翻阅所载之处云、
  - type: paragraph
    text:
      ru: Когда подали Ему книгу, Он ее разгнул и нашел не то, что случайно попалось, но чего Сам желал. Ибо не думай, будто Он открыл книгу и случайно нашлось то место, в котором написано о Нем; это случилось по Его желанию. Что же было написано?
      cn: 当他们将书呈递给他时，他将书展开，所找到的并非碰巧遇到的，而是他自己所愿望的。因为不要以为他打开书时，偶然找到了那处记载着关于他之事的地方；此事是按照他的愿望发生的。那么，所记载的又是什么呢？
  - type: paragraph
    initial:
      ru: 'Лк 4:18. '
      cn: （路加福音 4:18）
    text:
      ru: (Ис.61:1)Дух Господень на Мне; ибо Он помазал Меня благовествовать нищим, и послал Меня исцелять сокрушенных сердцем, проповедовать пленным освобождение, слепым прозрение, отпустить измученных на свободу,
      cn: 主之神在我、因此彼傅油予我、为我传福音于贫者、遣我疗愈伤心者、传被掳者得释放、瞽者得明、解困苦者于爽快、
  - type: paragraph
    text:
      ru: «Дух Господень... помазал Меня», то есть посвятил Меня, поставил Меня на благовествование«нищим», то есть язычникам, которые, не имея ни закона, ни пророков, действительно были в большой нищете.«Сокрушенныесердцем»были, быть может, израильтяне, у которых сердце сначала было велико и высоко и было домом Божиим, а впоследствии, когда они стали служить идолам и грешить разным образом, сердце их сокрушилось и расстроилось, став вместо дома Божия вертепом разбойников. Итак, Господь пришел, чтобы и их исцелить, и дать«пленным освобождение»и«слепым прозрение», язычникам и израильтянам. Ибо обе сии части были и пленными у сатаны, и слепыми. Можно разуметь это и о мертвых. Ибо и они, быв пленными, и сокрушенными, через Воскресение освободились из-под власти ада.
      cn: '«主之神...傅油予我»，即是奉献了我，立我为向「贫者」传福音，即是向异教徒传福音。他们既没有律法，也没有先知，确实处于极大的贫困之中。


        「伤心者」或许是以色列人，他们的心最初是伟大的、高贵的，曾是神的殿。但后来，当他们开始事奉偶像并以各种方式犯罪时，他们的心就破碎了、崩溃了，从神的殿变成了强盗的巢穴。


        因此，主降临，是为了治愈他们，并给予「被掳者得释放」与「瞽者得明」，无论是异教徒还是以色列人。因为这两部分人都是撒但的俘虏，也是瞎眼的。


        我们也可以将此理解为关于死者。因为他们也是俘虏和破碎者，借由复活，从阴间的权势下得到了释放。'
  - type: paragraph
    initial:
      ru: 'Лк 4:19. '
      cn: （路加福音 4:19）
    text:
      ru: (Ис.61:2)проповедовать лето Господне благоприятное.
      cn: 传主之禧年也、
  - type: paragraph
    text:
      ru: Проповедал«лето Господне благоприятное». Что же это за лето благоприятное? Быть может, и будущий век, о котором Господь проповедал, говоря:«и в тот день вы не спросите Меня ни о чем»(Ин. 16, 23), и опять:«наступает время... когда мертвые... оживут»(Ин. 5, 25). Но приятное лето есть и время пришествия Господа во плоти. О нем Павел говорит:«теперь время благоприятное... теперь день спасения»(2Кор. 6, 2).
      cn: '他宣讲了「传主之禧年也」。那么，这禧年（лето благоприятное）究竟是什么？


        也许是未来的世代，主曾宣讲过它，说：「到那日，你们什么也必不问我」（伊鄂昂福音 16:23）；又说：「时候将到……死人……将要活过来」（伊鄂昂福音 5:25）。


        但是，这「愉悦的年份」（приятное лето），亦是主道成肉身降临的时期。保罗论及它时说：「现在正是悦纳的时候，现在正是拯救的日子」（哥林多后书 6:2）。'
  - type: paragraph
    initial:
      ru: 'Лк 4:20. '
      cn: （路加福音 4:20）
    text:
      ru: И, закрыв книгу и отдав служителю, сел; и глаза всех в синагоге были устремлены на Него.
      cn: 掩书付予执事者而坐、在会堂众目注之、
  - type: paragraph
    initial:
      ru: 'Лк 4:21. '
      cn: （路加福音 4:21）
    text:
      ru: 'И Он начал говорить им: ныне исполнилось писание сие, слышанное вами.'
      cn: 彼始语之曰、今尔等所闻之经已应矣、
  - type: paragraph
    text:
      ru: Прочитав это, Он сказал:«Ныне исполнилось писание сие, слышанное вами», очевидно, указывая в Себе слушателям Того, о Котором это писано.
      cn: 「读完这个（经文），祂说道：『你们所听见的这经文，今日应验了。』 显然，祂是在向听者们指明，祂自己就是那被写在经文中的对象。」
  - type: paragraph
    initial:
      ru: 'Лк 4:22. '
      cn: （路加福音 4:22）
    text:
      ru: 'И все засвидетельствовали Ему это, и дивились словам благодати, исходившим из уст Его, и говорили: не Иосифов ли это сын?'
      cn: 众皆对证之、 〇奇其口所出恩宠之言、而曰、此非伊鄂锡福之子乎、
  - type: paragraph
    text:
      ru: 'Народ, слушая речь Христову, удивлялся«словам благодати»; удивляясь же, насмехался над Ним, говоря: не это ли сын плотника? Между тем, что препятствовало быть Ему достойным удивления и поклонения? Не видишь ли, какие творит Он дела? Не слышишь ли, какие Он говорит речи? Несмотря на то, ты осмеиваешь отца Его? О них-то, как нельзя более справедливо, можно сказать:«народ глупый и неразумный, у которого есть глаза, а не видит, у которого есть уши, а не слышит»(Иер. 5, 21). Что же говорит им Господь?'
      cn: '民众在听基督的讲话时，惊异于「恩宠之言」；而他们惊异之时，却又嘲笑祂，说：「这不是那木匠的儿子吗？」


        然而，有什么阻碍着祂成为值得惊异和崇拜的呢？你难道没有看到祂所行的事工吗？你难道没有听到祂所言的言辞吗？尽管如此，你却嘲笑祂的父亲？对于他们，再没有比这更公正的说法了：「愚昧而无知的百姓，他们有眼却不看，有耳却不听」（耶利米书 5:21）。


        那么，主对他们说了什么呢？'
  - type: paragraph
    initial:
      ru: 'Лк 4:23. '
      cn: （路加福音 4:23）
    text:
      ru: 'Он сказал им: конечно, вы скажете Мне присловие: врач! исцели Самого Себя; сделай и здесь, в Твоем отечестве, то́, что́, мы слышали, было в Капернауме.'
      cn: 彼向之曰、尔等自然引此谚语与我云、医士当自医、我闻尔所行于喀撇儿那屋木者、亦当行于此故邑、
  - type: paragraph
    text:
      ru: «Конечно, вы скажете Мне:... сделай и... в отечестве»Своем те же чудеса, какие и в Капернауме сделал. Ибо это значит:«врач! исцели Самого Себя». Это была общая у иудеев поговорка, которую они обращали к больным врачам.
      cn: 「自然，你们会对我说：……也在自己的家乡行出……在迦百农所行的同样的奇迹。因为这正是说：『医生！医治你自己吧。』这是犹太人普遍的一句谚语，他们将其用来指代生病的医生。」
  - type: paragraph
    initial:
      ru: 'Лк 4:24. '
      cn: （路加福音 4:24）
    text:
      ru: 'И сказал: истинно говорю вам: никакой пророк не принимается в своем отечестве.'
      cn: 我诚告尔等、未有先知见悦于故里者、
  - type: paragraph
    text:
      ru: Но Я говорю вам, что Я сделал бы много знамений и у вас, Моих соотечественников, но знаю общую и со всеми случающуюся страсть – презирать и самые отличные дела, коль скоро они перестают быть редкими, а становятся общими и обыкновенными, и когда все могут свободно наслаждаться ими. Ибо люди всегда имеют обычай заботиться о редком и странном и ему дивиться, а общее и обычное – презирать. Поэтому ни один пророк не ценится в своем отечестве, но если он придет из какой-нибудь другой страны, ему удивляются.
      cn: 「然而，我对你们说，我本可以在你们当中，我的同胞们当中，行许多神迹，但我深知一种普遍的、发生在所有人身上的习性——即便是最杰出的作为，一旦它们不再稀罕，而变得普遍和寻常，并且当所有人都可以自由享受它们时，人们就会轻视它们。因为人总是有习惯去关心和惊叹于稀有和奇特的事物，而对普遍和寻常的事物则加以鄙视。因此，没有先知在他的故土受到珍视，但如果他来自某个其他国度，人们就会对他感到惊奇。」
  - type: paragraph
    initial:
      ru: 'Лк 4:25. '
      cn: （路加福音 4:25）
    text:
      ru: 'Поистине говорю вам: много вдов было в Израиле во дни Илии, когда заключено было небо три года и шесть месяцев, так что сделался большой голод по всей земле,'
      cn: 我诚告尔等、当伊利亚之时天闭塞三年有六月、致遍地大饥、伊斯拉伊泐中有多嫠妇、
  - type: paragraph
    initial:
      ru: 'Лк 4:26. '
      cn: （路加福音 4:26）
    text:
      ru: и ни к одной из них не был послан Илия, а только ко вдове в Сарепту Сидонскую;
      cn: 而伊利亚未尝奉遣往就其一、惟往就锡东萨列普他之嫠妇、
  - type: paragraph
    text:
      ru: Так и Илию вдовы иудейские не приняли, а сарептяныня приняла (3Цар. 17, 9–16).
      cn: 同样地，犹太的寡妇们没有接纳以利亚，但撒勒法妇人接纳了他（列王纪上 17:9-16）。
  - type: paragraph
    initial:
      ru: 'Лк 4:27. '
      cn: （路加福音 4:27）
    text:
      ru: много также было прокаженных в Израиле при пророке Елисее, и ни один из них не очистился, кроме Неемана Сириянина.
      cn: 又当先知耶梨些乙之时、在伊斯拉伊泐中有多患癞者、而无一人得洁、惟锡利亚人涅耶芒耳、
  - type: paragraph
    text:
      ru: И Елисей очистил от проказы иноземца, потому что сей явил веру к нему (4Цар. 5, 8–14), тогда как знакомые соотечественники его не верили ему, и потому не очищались. Подобным образом и вы, соотечественники Мои, считаете Меня достойным не удивления, а презрения, а потому и Я знамений не творю. Жители же Капернаума считают Меня достойным удивления, и Я знамения творю, и принят ими.
      cn: 伊利塞（Elisha）使一个异邦人洁净脱离麻风病，因为这人向他显出了信心（列王纪下 5:8-14），然而他所熟悉的同胞们却不相信他，因此没有得到洁净。同样，你们，我的同胞们，认为我不配受人惊奇，反而配受人蔑视，因此我也不行神迹。而迦百农（Capernaum）的居民则认为我配受人惊奇，因此我行神迹，并被他们接纳了。
  - type: paragraph
    initial:
      ru: 'Лк 4:28. '
      cn: （路加福音 4:28）
    text:
      ru: Услышав это, все в синагоге исполнились ярости
      cn: 在会堂闻此言者皆大怒、
  - type: paragraph
    initial:
      ru: 'Лк 4:29. '
      cn: （路加福音 4:29）
    text:
      ru: и, встав, выгнали Его вон из города и повели на вершину горы, на которой город их был построен, чтобы свергнуть Его;
      cn: 起而逐之城外、拽彼至其建城之山崖、欲推之下、
  - type: paragraph
    initial:
      ru: 'Лк 4:30. '
      cn: （路加福音 4:30）
    text:
      ru: но Он, пройдя посреди них, удалился.
      cn: 彼经行于众、中而去、
  - type: paragraph
    text:
      ru: Слышащие это в синагоге наполнялись яростью, что достойно удивления, и думали бросить Его с утеса.«Но Он, пройдя посреди их», ушел, не потому, впрочем, будто Он бегал от страданий, но потому, что ждал определенного времени. Ибо Он пришел пострадать за нас; а теперь, когда еще начиналась Его проповедь, Ему не должно было предавать Себя на смерть, но тогда скончаться, когда уже научит достаточно. Из сего ясно, что когда Он был распят, не против Его воли был распят, но добровольно предал Себя на смерть.
      cn: 那些在会堂中听见此话的人充满了怒火，这着实令人惊奇，他们甚至想将祂从悬崖上扔下去。「但祂经行于众、中而去，」离开了，但这并非因为祂逃避苦难，而是因为祂在等待特定的时机。因为祂降临是为了替我们受难；而现在，祂的宣讲才刚刚开始，祂不应该将自己交付于死，而应该等到教导得足够充分时，才了结一生。由此可知，当祂被钉上十字架时，并非违背祂的意愿，而是祂自愿将自己交付于死。
  - type: paragraph
    text:
      ru: Знай, что отечество пророков – синагога иудейская, у которой они в бесчестии. Ею пророки не приняты, а мы чужеродные приняли их. Ибо вдовица, то есть церковь из язычников, приняла Илию, то есть пророческое слово, когда в Иудее был голод духовный, то есть голод«слышания слова» Божия (Ам. 8, 11). О сей-то вдовице говорит пророк:«у оставленной гораздо более детей, нежели у имеющей мужа»(Ис. 54, 1), и в другом месте:«даже бесплодная рождает семь раз, а многочадная изнемогает»(1Цар. 2, 5).
      cn: 你当知晓，众先知的故土——是犹太人的会堂，他们在那里遭受羞辱。先知们未曾被它接纳，而我们这些异邦人却接纳了他们。因为寡妇，即来自外邦人的教会，接纳了以利亚，即先知性的言语，当时在犹太地正有属灵的饥荒，即「听闻」上帝之「话语」的饥荒（阿摩司书 8:11）。先知所言说的，正是关于这位寡妇：「被弃的，儿女比有夫的更多」（以赛亚书 54:1），并在另一处说：「不生产的，倒生了七个；儿女多的，反倒衰微」（撒母耳记上 2:5）。
  - type: paragraph
    initial:
      ru: 'Лк 4:31. '
      cn: （路加福音 4:31）
    text:
      ru: И пришел в Капернаум, город Галилейский, и учил их в дни субботние.
      cn: 〇来至戛利列亚之城喀撇儿那屋木、每安息日教训之、
  - type: paragraph
    initial:
      ru: 'Лк 4:32. '
      cn: （路加福音 4:32）
    text:
      ru: И дивились учению Его, ибо слово Его было со властью.
      cn: 众奇其教训、因其言有权、
  - type: paragraph
    initial:
      ru: 'Лк 4:33. '
      cn: （路加福音 4:33）
    text:
      ru: 'Был в синагоге человек, имевший нечистого духа бесовского, и он закричал громким голосом:'
      cn: 在会堂中一人有邪魔之神大声呼曰、
  - type: paragraph
    initial:
      ru: 'Лк 4:34. '
      cn: （路加福音 4:34）
    text:
      ru: оставь; что́ Тебе до нас, Иисус Назарянин? Ты пришел погубить нас; знаю Тебя, кто Ты, Святый Божий.
      cn: 唉那咂列特之伊伊稣斯欤、尔与我等何干、尔来灭我等乎、我知尔为谁、上帝之圣者、
  - type: paragraph
    initial:
      ru: 'Лк 4:35. '
      cn: （路加福音 4:35）
    text:
      ru: 'Иисус запретил ему, сказав: замолчи и выйди из него. И бес, повергнув его посредисинагоги, вышел из него, нимало не повредив ему.'
      cn: 伊伊稣斯禁斥之曰、宜缄默、魔鬼仆于中间、由之而出、毫未伤损之、
  - type: paragraph
    initial:
      ru: 'Лк 4:36. '
      cn: （路加福音 4:36）
    text:
      ru: 'И напал на всех ужас, и рассуждали между собою: что это значит, что Он со властью и силою повелевает нечистым духам, и они выходят?'
      cn: 惊骇遍于众身、相告曰、此为何、盖彼以权柄能力命邪神、彼等即出、
  - type: paragraph
    initial:
      ru: 'Лк 4:37. '
      cn: （路加福音 4:37）
    text:
      ru: И разнесся слух о Нем по всем окрестным местам.
      cn: 〇其声名遍扬于四方、
  - type: paragraph
    text:
      ru: 'Поскольку ни разум, ни учение не привлекают неверных к вере, то Господь присоединяет чудотворения, как самое действительное средство. Итак, творит чудеса в Капернауме, ибо жители сего города были самые неверные и для веры нуждались во многих чудесах. Итак, когда Он достаточно научил, и притом как имеющий власть (ибо Он не говорил:«Это говорит Господь», но:«Я говорю вам», потому что Он был не из числа пророков, но истинный Сын Божий), после этого присоединяет и чудо, именно: исцеляет мучимого бесом. Бес сначала обнаруживает вражду, чтобы свидетельство его было достовернее, потом приводит свидетельство:«знаю Тебя, кто Ты, Святый Божий». Сначала упрекает Его: зачем Ты пришел сюда погубить нас? Потом ласкает Его, думая, что Господь, увлеченный лаской, оставит его. Но Господь, научая не пользоваться свидетельством и представлением от беса, говорит:«замолчи и выйди из него». Впрочем, позволяет бесу повергнуть человека, чтобы присутствующие узнали, что он подлинно имеет беса, которому и слова принадлежали, хотя орудием был язык человека. И все говорили друг другу, удивляясь случившемуся и говоря: что это за слово, то есть что это за повеление, которым Он повелевает: выйди из него и замолчи?'
      cn: 既然理性或教义都无法吸引不信者归向信仰，主便加上神迹奇事，以此作为最有效的手段。因此，祂在迦百农行神迹，因为该城的居民是最不信的，并且需要许多神迹才能相信。所以，当祂充分教导了他们，并且是以带着权柄的方式（因为祂没有说：「主如此说」，而是说：「我告诉你们」，因为祂不属于先知之列，而是真神之子），在这之后，祂也加上了神迹，即治愈了那被鬼所折磨的人。鬼魔首先表现出敌意，是为了让它的见证更可靠，然后它才提出见证：「我知道你是谁，你是神的圣者。」它先是责备祂：你为何来到这里要毁灭我们？然后又奉承祂，以为主会被奉承所引诱而放过它。但主，为了教导我们不要利用鬼魔的见证和呈现，祂说：「住口，从他身上出来。」然而，祂允许鬼魔将那人摔倒，好让在场的人得知，他确实被鬼附着，那些话语也确实是鬼魔所发，尽管发声的工具是那人的舌头。所有人都彼此议论，对所发生的事感到惊奇，并说：「这是什么样的言语，也就是说，这是什么样的命令，祂竟然用它来命令：从他身上出来，住口？」
  - type: paragraph
    text:
      ru: 'Знай же, что и ныне многие имеют бесов, именно те, кои исполняют пожелания бесов; например, кто гневлив, тот имеет беса гнева. Но когда придет Иисус в синагогу, то есть когда ум будет сосредоточен, а не рассеян, тогда скажет бесу гнева, доселе неукротимому:«замолчи»; и он тотчас выйдет из человека, повергнув его на средину. Что же значит бросить на средину, знай: человек должен быть ни совершенно гневлив и раздражителен, ибо это свойственно зверям, ни совершенно безгневен, ибо это свойственно бесчувственному, но идти средним путем и иметь гнев против злобы. Итак, когда дух лукавый бросит кого-нибудь на средину, то уходит от него.'
      cn: 当知，即便如今，亦有许多人拥有邪魔，即那些满足邪魔之私欲者；例如，那易怒之人，就拥有愤怒之魔。但当耶稣进入会堂时，即当心神集中而非分散时，祂便会向这此前未受抑制的愤怒之魔说：「住口」；那魔鬼便立刻从人中出去，将他摔倒在中间。至于「摔倒在中间」是什么意思，请知晓：人不当全然易怒和暴躁，因这乃是野兽的特征；亦不当全然无怒，因这乃是麻木不仁者的特征。而当行于中道，并对邪恶怀抱愤怒。因此，当那邪恶之灵将某人摔倒在中间时，它便会离开他。
  - type: paragraph
    initial:
      ru: 'Лк 4:38. '
      cn: （路加福音 4:38）
    text:
      ru: Выйдя из синагоги, Он вошел в дом Симона; тёща же Симонова была одержима сильною горячкою; и просили Его о ней.
      cn: 彼出会堂而入锡孟之家、锡孟之妻母病患热甚、而众为之求、
  - type: paragraph
    initial:
      ru: 'Лк 4:39. '
      cn: （路加福音 4:39）
    text:
      ru: Подойдя к ней, Он запретил горячке; и оставила ее. Она тотчас встала и служила им.
      cn: 彼立其旁斥热、热乃退、遂起供事之焉、
  - type: paragraph
    text:
      ru: Господь всех питался гостеприимством учеников, подобно как и теперь Он принят Петром и исцеляет тещу его, чтобы и тебя научить не отказываться от благорасположения бедных. Не просто исцеляет ее от болезни, но придает ей крепкое здоровье и силу для служения. Если и мы примем Его, Он угасит нашу горячку, горячку гнева и похотения, и восставит нас так, что мы в состоянии будем служить Ему, то есть делать угодное Ему.
      cn: 万物之主因门徒们的款待而得到供养，就像如今祂被彼得接纳并治愈了彼得的岳母一样，这也是为了教导你，不要拒绝贫穷人的好意。祂治愈她并非仅仅是让她脱离疾病，而是赋予了她强健的身体和服侍的力量。如果我们也接纳祂，祂将熄灭我们的热病，即愤怒与贪欲的热病，并使我们重新站立起来，使我们有能力服侍祂，也就是说，行祂所喜悦之事。
  - type: paragraph
    initial:
      ru: 'Лк 4:40. '
      cn: （路加福音 4:40）
    text:
      ru: При захождении же солнца все, имевшие больных различными болезнями, приводили их к Нему и Он, возлагая на каждого из них руки, исцелял их.
      cn: 日入时、众有杂症者均携之就彼、彼一一按双手其上而愈之、
  - type: paragraph
    text:
      ru: Посмотри, прошу тебя, и на веру народа, как он и«при захождении... солнца»приносил больных и не удерживался временем.
      cn: 请看，我请求你（也看看），平信徒的信心，如同他们「当太阳……沉落时」也带了病人来，并且未被时间限制所羁留。
  - type: paragraph
    initial:
      ru: 'Лк 4:41. '
      cn: （路加福音 4:41）
    text:
      ru: 'Выходили также и бесы из многих с криком и говорили: Ты Христос, Сын Божий. А Он запрещал им сказывать, что они знают, что Он Христос.'
      cn: 有魔鬼自多人出、呼曰、尔系合唎斯托斯上帝之子也、而彼禁止之不许言彼等知其为本合唎斯托斯、
  - type: paragraph
    text:
      ru: Не позволяет бесам говорить так потому, что не нуждается в похвале от нечистых, ибо«неприятна похвала в устах грешника»(Сир. 15, 9), так и потому, что не желает возжечь в евреях зависть при похвале Ему от всех.
      cn: 他不容许鬼魔如此说话，是因为他不需要来自不洁者的赞扬，又因为「罪人嘴中的赞扬令人不悦」（西拉书 15:9），并且还因为他不愿在众人赞扬他的时候，在犹太人心中燃起嫉妒。
  - type: paragraph
    initial:
      ru: 'Лк 4:42. '
      cn: （路加福音 4:42）
    text:
      ru: Когда же настал день, Он, выйдяиз дома, пошел в пустынное место, и народ искал Его и, придя к Нему, удерживал Его, чтобы не уходил от них.
      cn: 平旦彼出、往旷野、众民寻访来就之、且阻留之、勿离彼等、
  - type: paragraph
    initial:
      ru: 'Лк 4:43. '
      cn: （路加福音 4:43）
    text:
      ru: 'Но Он сказал им: и другим городам благовествовать Я должен Царствие Божие, ибо на то Я послан.'
      cn: 彼向之曰、我于他城亦当传上帝国福音、盖我为此而被遣、
  - type: paragraph
    initial:
      ru: 'Лк 4:44. '
      cn: （路加福音 4:44）
    text:
      ru: И проповедовал в синагогах Галилейских.
      cn: 遂在戛利列亚诸会堂传教矣、
  - type: paragraph
    text:
      ru: Народ ищет Его, хотя Он ушел в пустое место, и удерживает Его. Но Он не ограничивается одним местом, а говорит, что Мне должно благовестить«Царство Божие... и другим городам». Поэтому и нам не должно быть ленивыми, не довольствоваться одним местом заключения, но всюду обходить, чтобы кому-нибудь принести пользу.
      cn: 百姓寻找他，尽管他已往一空旷之地，并留住他。但他并未局限于一处地方，而是说我应当向「上帝的国……并传给其他的城邑」传扬福音。因此，我们也不应懒惰，不应满足于一处幽禁之地，而应周游四方，以便能为任何人带来益处。
- type: heading1
  text:
    ru: Глава пятая
    cn: 第五章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 5:1. '
      cn: （路加福音 5:1）
    text:
      ru: Однажды, когда народ теснился к Нему, чтобы слышать слово Божие, а Он стоял у озера Геннисаретского,
      cn: 〇当时、民拥挤之、欲听上帝之言、而彼立于艮尼萨列特之湖滨、
  - type: paragraph
    initial:
      ru: 'Лк 5:2. '
      cn: （路加福音 5:2）
    text:
      ru: увидел Он две лодки, стоящие на озере; а рыболовы, выйдя из них, вымывали сети.
      cn: 见二舟在湖滨、渔人离之洗网、
  - type: paragraph
    initial:
      ru: 'Лк 5:3. '
      cn: （路加福音 5:3）
    text:
      ru: Войдя в одну лодку, которая была Симонова, Он просил его отплыть несколько от берега и, сев, учил народ из лодки.
      cn: 彼登一舟属锡孟者、而请之稍离岸地、坐而由舟教训诸民、
  - type: paragraph
    text:
      ru: Господь убегает от славы, а она тем более преследует Его. Когда народ теснился около Него, Он всходит на корабль, чтобы с корабля учить стоящих на берегу моря, так что все находились пред лицом Его, и никто не ушел за спину.
      cn: 主逃避荣耀，但荣耀却更加追逐祂。当众民拥挤在祂身边时，祂登上了船，好能从船上教导那些站在海边的人们，以至于所有人都在祂面前，没有人走到祂的背后。
  - type: paragraph
    initial:
      ru: 'Лк 5:4. '
      cn: （路加福音 5:4）
    text:
      ru: 'Когда же перестал учить, сказал Симону: отплыви на глубину и закиньте сети свои для лова.'
      cn: 言毕、向锡孟曰、移至深处、下尔等之网以渔、
  - type: paragraph
    initial:
      ru: 'Лк 5:5. '
      cn: （路加福音 5:5）
    text:
      ru: Симон сказал Ему в ответ; Наставник! мы трудились всю ночь и ничего не поймали, но по слову Твоему закину сеть.
      cn: 锡孟答之曰、师欤、我侪终夜劳苦、而毫无所得、遵尔言、我则下网、
  - type: paragraph
    initial:
      ru: 'Лк 5:6. '
      cn: （路加福音 5:6）
    text:
      ru: Сделав это, они поймали великое множество рыбы, и даже сеть у них прорывалась.
      cn: 彼等即行此、围鱼甚多、网渐裂矣、
  - type: paragraph
    text:
      ru: 'А за то, что Он учил с корабля, Он не оставил владетеля его без награды. Он даже вдвойне его облагодетельствовал: одарил его множеством рыб и сделал Своим учеником. Подивись смотрению Господа, как Он каждого привлекает через свойственное и сродное ему средство, например: волхвов – посредством звезды, а рыбарей – посредством рыб. Заметь и кротость Христа, как Он умоляет Петра отплыть от земли, ибо«просил», разумей, вместо «умолял»[****], и то, как благопокорен был Петр: Человека, Которого не видал, он принял на свой корабль и во всем ему повинуется. Когда Сей сказал ему, чтобы он отплыл на глубину, тот не отяготился, не сказал: всю ночь я трудился и ничего не приобрел, и Тебя ли теперь послушаю, и вдамся в новые труды? Ничего такого он не сказал, но напротив:«по слову Твоему закину сеть». Так Петр был тепл в вере и прежде веры!'
      cn: '那至于祂从船上施教一事，祂并没有让船主得不到奖赏。祂甚至双重地恩待了他：以大量的鱼恩赐了他，并使他成为祂的门徒。请惊叹于主之眷顾，祂如何通过每个人特有的、与其相宜的工具来吸引他们，例如：通过星辰吸引了术士，又通过鱼吸引了渔夫。


        请注意基督的柔和，祂如何恳求彼得把船驶离陆地，因为「请求」（просил）应当理解为「恳求」（умолял）[]；也要注意彼得是何等顺服：他让一个素未谋面的人登上自己的船，并且在一切事上都服从祂。当这位说了让他驶向水深之处时，他没有感到麻烦，没有说：我整夜劳苦，一无所获，难道我现在还要听你的话，投身于新的劳作中吗？他没有说出任何此类的话，而是恰恰相反：「但依从你的话，我就撒网」。由此可见，彼得在信仰之前，在信心中也已是热忱的了！'
  - type: paragraph
    initial:
      ru: 'Лк 5:7. '
      cn: （路加福音 5:7）
    text:
      ru: И дали знак товарищам, находившимся на другой лодке, чтобы пришли помочь им; и пришли, и наполнили обе лодки, так что они начинали тонуть.
      cn: 乃招他舟之侣来助、及来、盈满二舟、以致将沉下、
  - type: paragraph
    text:
      ru: За то и поймал он столько рыб, что не мог один вытащить их, а знаками пригласил и соучастников, то есть общников, бывших на другом корабле. Знаками пригласил их потому, что пораженный необычайной ловлей не мог говорить.
      cn: 正因如此，他捕获了如此多的鱼，以至于他一人无法将它们拉上来，而是用手势邀请了共襄者，也就是另一艘船上的伙伴。他用手势邀请他们，是因为他对这非同寻常的渔获感到震惊，以至于无法言语。
  - type: paragraph
    initial:
      ru: 'Лк 5:8. '
      cn: （路加福音 5:8）
    text:
      ru: 'Увидев это, Симон Петр припал к коленям Иисуса и сказал: выйди от меня, Господи! потому что я человек грешный.'
      cn: 锡孟撇特儿见之、伏伊伊稣斯之膝下曰、主欤、退离我、因我乃罪人也、
  - type: paragraph
    text:
      ru: Далее, Петр в глубоком благоговении просит Иисуса сойти с корабля, говоря о себе, что он грешник и недостоин быть вместе с Ним.
      cn: 接着，伯多禄在深深的敬畏之中请求耶稣从船上离开，论及自己说他是个罪人，不配与祂同在。
  - type: paragraph
    initial:
      ru: 'Лк 5:9. '
      cn: （路加福音 5:9）
    text:
      ru: Ибо ужас объял его и всех, бывших с ним, от этого лова рыб, ими пойманных;
      cn: 伊与众偕在者皆遍体惊异、因彼等所得鱼多之故也、
  - type: paragraph
    initial:
      ru: 'Лк 5:10. '
      cn: （路加福音 5:10）
    text:
      ru: 'также и Иакова и Иоанна, сыновей Зеведеевых, бывших товарищами Симону. И сказал Симону Иисус: не бойся; отныне будешь ловить человеков.'
      cn: 又有锡孟之侣、即碣韦叠乙子亚适乌伊鄂昂、伊伊稣斯向锡孟曰、勿惧、自今后尔将渔人、
  - type: paragraph
    initial:
      ru: 'Лк 5:11. '
      cn: （路加福音 5:11）
    text:
      ru: И, вытащив обе лодки на берег, оставили всё и последовали за Ним.
      cn: 众拽诸舟于岸、舍一切从之、
  - type: paragraph
    text:
      ru: Если хочешь, понимай это и в переносном смысле. Корабль есть синагога иудейская. Петр представляет образ учителей Закона. Учители, бывшие до Христа, всю ночь трудились (ибо время до пришествия Христова – ночь) и ничего не достигли. А когда пришел Христос и настал день (Рим. 13, 12), то апостолы, поставленные на место законоучителей,«по слову», то есть по заповеди Его, закидывают сеть Евангелия и уловляют множество людей. Но апостолы одни не могут вытащить сеть с рыбами, а приглашают и соучастников своих, и сообщников, и влекут вместе с ними. Это суть пастыри и учители церквей всех времен; они, преподавая и объясняя учение апостольское, помогают апостолам ловить человеков. Обрати внимание и на выражение:«закинулисеть». Ибо Евангелие есть сеть, имеющая изложение речи смиренное, простое и приближенное к простоте слушателей; поэтому и говорится, что оно закинуто. Если же кто скажет, что через закидывание сети означается глубина мыслей, то и с этим можно согласиться. Итак, исполнилось слово пророка, сказавшего:«Вот, Я пошлю множество рыболовов, говорит Господь, и будут ловить их; а потом пошлю множество охотников, и они погонят их со всякой горы, и со всякого холма, и из ущелий скал»(Иер. 16, 16). Рыбарями назвал он святых апостолов, а ловцами – правителей и учителей церкви последующих времен.
      cn: '如果你愿意，也可以从转喻的意义上来理解这段经文。船只即是犹太人的会堂。彼得代表着律法教师的形象。在基督降世以前的教师们整夜劳苦（因为基督降临以前的时代是黑夜），但一无所获。然而，当基督降临，白昼来临之时（罗马书 13:12），被安置在律法教师位置上的使徒们，「按着祂的话」，即按着祂的诫命，撒下福音的网，捕获了大量的世人。但使徒们单独无法将装满鱼的网拉上来，而是邀请了他们的同工和伙伴，与他们一起拖拉。他们就是历代教会的牧者和教师；他们通过传授和阐释使徒的教导，帮助使徒们捕获世人。


        同时，请注意「撒下网」这个表达。因为福音就是一张网，它以一种谦卑、朴素，并且贴近听众淳朴本性的方式来阐述教义；因此，才说它是「被撒下的」。如果有人说，撒网意味着思想的深邃，这也是可以接受的。


        因此，先知的话语已经成就了，他说：「看哪，我要从多处招聚许多打鱼的，他们必打他们；后来我要从多处招聚许多猎户，他们必从各山上、各冈上、各磐石穴中追赶他们。」（耶利米书 16:16）。他将圣使徒称为「打鱼的」，将随后时代教会的治理者和教师称为「猎户」。'
  - type: paragraph
    initial:
      ru: 'Лк 5:12. '
      cn: （路加福音 5:12）
    text:
      ru: 'Когда Иисус был в одном городе, пришел человек весь в проказе и, увидев Иисуса, пал ниц, умоляя Его и говоря: Господи! если хочешь, можешь меня очистить.'
      cn: 〇当时彼在一城、而顾、有一人遍身患癞、见伊伊稣斯俯伏求之曰、主欤、尔若许、即能洁我、
  - type: paragraph
    text:
      ru: Прокаженный сей достоин удивления, потому что имеет о Господе мысль, достойную Бога, и говорит:«если хочешь, можешь меня очистить». Это показывает, что он помышляет о Христе как о Боге. Ибо он пришел не как ко врачу (так как проказа неизлечима руками врачей), но как к Богу; ибо Ему Одному возможно исцелять от такого рода болезней.
      cn: 这个麻风病人值得惊叹，因为他对主怀有配得上上帝的思想，他说：「你若许，即能洁我。」（路加福音 5:12）。这表明他思想基督如同上帝。因为他来，并非是来找医生（因为麻风病是医生的双手无法治愈的），而是来找上帝；因为唯有祂才可能治愈此类疾病。
  - type: paragraph
    initial:
      ru: 'Лк 5:13. '
      cn: （路加福音 5:13）
    text:
      ru: 'Он простер руку, прикоснулся к нему и сказал: хочу, очистись. И тотчас проказа сошла с него.'
      cn: 彼伸手按之曰、我许尔洁矣、其癞病即退除之、
  - type: paragraph
    text:
      ru: Господь «прикасается» к нему не без причины. Но поскольку, по Закону, прикасающийся к прокаженному считался нечистым, то, желая показать, что Он не имеет нужды соблюдать подобные мелкие предписания Закона, но Сам есть Господь Закона, и что чистый нисколько не оскверняется от кажущегося нечистым, но что проказа душевная, именно она, оскверняет, – для сей цели прикасается, а вместе и для того, чтобы показать, что святая Плоть Его имеет Божественную силу – очищать и животворить, как истинная Плоть Бога Слова.
      cn: 主「触摸」（прикасается）麻风病人并非没有原因。但是，鉴于根据律法，触摸麻风病人的人会被视为不洁净（нечистым），所以，祂是希望表明：祂没有遵守律法中这类微小诫命（мелкие предписания）的必要，因为祂自己就是律法之主（Сам есть Господь Закона）；并且表明：那洁净的人丝毫不会被那看似不洁净的人所玷污（оскверняется），反倒是灵魂的麻风（проказа душевная），确切地说，正是它在玷污人。——为了这个目的，祂才触摸他；同时也是为了表明：祂那神圣的肉体拥有神圣的能力，能够洁净和赐予生命（животворить），因祂是真神道成肉身的肉体（истинная Плоть Бога Слова）。
  - type: paragraph
    initial:
      ru: 'Лк 5:14. '
      cn: （路加福音 5:14）
    text:
      ru: И Он повелел ему никому не сказывать, а пойти показаться священнику и принестижертвуза очищение свое, ка́к повелел Моисей, во свидетельство им.
      cn: 彼戒命之勿告人、乃往示己于司祭、为尔洁净献依摩伊些乙所命者、以为作证于彼等、
  - type: paragraph
    text:
      ru: 'Заповедует прокаженному не сказывать никому о Нем для того, чтобы нас научить не искать похвалы от тех, кому благотворим; но говорит: пойди, покажись священнику и принеси дар во свидетельство им. Ибо Закон был такой, чтобы священник осматривал прокаженных и определял, очистились ли они, и если прокаженный очистился в семь дней, он оставался внутри города, если же нет, был изгоняем (Лев. 13). Поэтому-то Господь сказал: ступай, покажись священнику и принеси дар. Какой же был дар? Две птицы (Лев. 14). Что значит:«во свидетельство им»? Значит – в обличение их и осуждение; чтобы, если будут обвинять Меня, как преступника Закона, убедились, что Я не преступаю его, убедились из повеления тебе принести дар, заповеданный Моисеем. Кстати, можно сказать и о том, как эти две птицы приносились Богу. Одну птицу закалали, и кровь ее брали в новый глиняный сосуд; потом оба крыла другой птицы обмакивали в крови и таким образом отпускали птицу живой. Сим изображалось то, что имело сбыться на Христе. Два крыла суть две природы Христа, Божеская и человеческая, из коих одна была заклана, то есть человеческая, а другая осталась живой. Ибо природа Божественная пребыла бесстрастной, помазавшись кровью природы пострадавшей и страдание восприняв на себя. Кровь Господа принял новый глиняный сосуд, то есть новый народ из язычников, способный к принятию Нового Завета. Смотри: когда кто уже очистится от проказы, тогда достоин приносить этот дар, то есть закалать Христа и священнодействовать. Ибо прокаженный и нечистый по душе не может быть удостоен приносить такие дары, то есть приносить Тело и Кровь Господа, соединенные с Божеской природой. Внимай и тому, какое несказанное преимущество имеет Господь над Моисеем. Моисей, когда сестра его поражена была проказой, не мог уврачевать ее, хотя много молился (Чис.12,10–15),  а Господь очистил прокаженного одним словом.'
      cn: '他命令那个患麻风病的人不要告诉任何人关于祂的事情，目的是教导我们不要寻求我们所施恩惠之人的赞美；但祂又说：「去，将自己给祭司看，并献上礼物，作为对他们的作证。」


        因为律法是这样的：祭司要检查麻风病人，并确定他们是否已被洁净。如果麻风病人七日内洁净了，他就可以留在城内；如果还没有，他就会被驱逐（利未记 13）。因此，主才说：「去，将自己给祭司看，并献上礼物。」那么，礼物是什么呢？是两只鸟（利未记 14）。


        「作为对他们的作证」是什么意思？它的意思是——作为对他们的指责和定罪；这样，如果他们要控告我是一个触犯律法的人，他们就会因我命令你献上摩西所吩咐的礼物而确信我并未触犯律法。


        顺便说一句，我们也可以谈谈这两只鸟是如何献给上帝的。人们宰杀其中一只鸟，将它的血倒入一个新的瓦器中；然后将另一只鸟的两只翅膀蘸入血中，再将这只鸟放生。


        这象征着将在基督身上发生的事情。两只翅膀是基督的两种本性：神性和人性。其中一种本性被宰杀，即人性；而另一种本性则存活。因为神性本性保持了不朽（不受苦），祂被那受苦本性的血所涂抹，并把苦难承担在自己身上。


        接受了主的血的是一个新的瓦器，即来自外邦人的新民族，他们有能力接受《新约》。看啊：当一个人从麻风病中洁净之后，他才配献上这份礼物，即宰杀基督并施行圣礼。因为心灵上患有麻风病和不洁的人，不配献上这样的礼物，即献上与神性本性结合的主的身体和宝血。


        你也要留意主拥有超越摩西的无法言喻的优势。当摩西的姊姊遭受麻风病时，尽管摩西多次祷告，但他无法治愈她（民数记 12:10-15）；而主却仅凭一句话就洁净了麻风病人。'
  - type: paragraph
    initial:
      ru: 'Лк 5:15. '
      cn: （路加福音 5:15）
    text:
      ru: Но тем более распространялась молва о Нём, и великое множество народа стекалось к Нему слушать и врачеваться у Него от болезней своих.
      cn: 然其名声愈播扬、多民常聚集以听之、且由之得医诸疾病、
  - type: paragraph
    initial:
      ru: 'Лк 5:16. '
      cn: （路加福音 5:16）
    text:
      ru: Но Он уходил в пустынные места и молился.
      cn: 彼退往旷野祈祷、
  - type: paragraph
    text:
      ru: Заметь и смирение Господа, как Он, когда народ желал прикасаться к Нему, с особенной охотой проводил время в пустынях и молился. Так Он во всем подавал нам образец – молиться наедине и уклоняться от славы.
      cn: 请注意主（上主）的谦卑，因为当民众渴望接近祂时，祂却怀着特别的意愿，将时间花在旷野中并进行祈祷。因此，祂在凡事上都为我们提供了榜样——要在独处时祈祷并避开荣耀。
  - type: paragraph
    initial:
      ru: 'Лк 5:17. '
      cn: （路加福音 5:17）
    text:
      ru: В один день, когда Он учил, и сидели тут фарисеи и законоучители, пришедшие из всех мест Галилеи и Иудеи и из Иерусалима, и сила Господня являлась в исцелениибольных, –
      cn: 〇一日彼又教训、有发利些乙及教授师等自戛利列亚诸鄕、伊屋叠亚及耶鲁萨利木来者、坐于彼、主之能力显见于医治、
  - type: paragraph
    initial:
      ru: 'Лк 5:18. '
      cn: （路加福音 5:18）
    text:
      ru: вот, принесли некоторые на постели человека, который был расслаблен, и старались внести егов доми положить перед Иисусом;
      cn: 顾有人以床舁瘫痪者寻入、以置之于彼前、
  - type: paragraph
    initial:
      ru: 'Лк 5:19. '
      cn: （路加福音 5:19）
    text:
      ru: и, не найдя, где пронести его за многолюдством, влезли на верх дома и сквозь кровлю спустили его с постелью на средину пред Иисуса.
      cn: 因多民所未得入、登屋上、由瓦间置之与其床于中、在伊伊稣斯面前、
  - type: paragraph
    initial:
      ru: 'Лк 5:20. '
      cn: （路加福音 5:20）
    text:
      ru: 'И Он, видя веру их, сказал человеку тому: прощаются тебе грехи твои'
      cn: 彼见其信、语之曰、尔罪赦免矣、
  - type: paragraph
    text:
      ru: 'Перед собранием врагов Господу нужно было совершить какое-нибудь новейшее знамение. Поэтому Он исцеляет человека, болящего неизлечимой болезнью, чтобы через уврачевание такой болезни уврачевать и неисцельное безумие фарисеев. Сначала Он врачует болезни души, сказав: оставляются тебе грехи твои, – чтобы мы знали, что многие болезни рождаются от грехов; потом исцеляет и немощь тела, видя веру принесших. Ибо Он часто по вере одних спасает других.'
      cn: 在仇敌的会众面前，主需要施行一些最新的神迹。因此，祂医治了一个患有不治之症的人，以便通过治愈这种病症，来治愈法利赛人那不可医治的愚妄。祂首先医治了灵魂的疾病，祂说：你的罪赦免了，——以便我们知道许多疾病源自罪孽；然后，祂也治愈了身体的软弱，因为祂看到了那些带他来的人的信心。因为祂常常因着某些人的信心而拯救另一些人。
  - type: paragraph
    initial:
      ru: 'Лк 5:21. '
      cn: （路加福音 5:21）
    text:
      ru: 'Книжники и фарисеи начали рассуждать, говоря: кто это, Который богохульствует? кто может прощать грехи, кроме одного Бога?'
      cn: 而学士及发利些乙等议起曰、此亵凟者为谁、除独一上帝之外、谁能赦免罪、
  - type: paragraph
    text:
      ru: 'А фарисеи говорят: что Он произносит хулы?«Кто можетотпускатьгрехи, кроме одного Бога?»Говорят они это, осуждая Его на смерть. Ибо Закон повелевал наказывать смертью того, кто скажет хулу на Бога (Лев. 24, 16).'
      cn: 而法利赛人说：「祂所说的是何种亵渎？」「除了独一的上帝之外，谁能赦免罪孽呢？」他们说这话，是要判祂死罪。因为律法曾命令，凡是说亵渎上帝之话的人，当处以死刑（利未记 24:16）。
  - type: paragraph
    initial:
      ru: 'Лк 5:22. '
      cn: （路加福音 5:22）
    text:
      ru: 'Иисус, уразумев помышления их, сказал им в ответ: что́ вы помышляете в сердцах ваших?'
      cn: 伊伊稣斯知其意、答之曰、尔等于尔心中何为议乎、
  - type: paragraph
    text:
      ru: Господь, чтобы показать им, что Он есть истинный Бог и не выдает Себя за Бога по тщеславию, убеждает их другим знамением. Он Сам узнает, о чем они помышляли в себе. Отсюда совершенно явно, что Он Бог, ибо знать сердца свойственно Богу (1Пар. 28, 9;2Пар. 6, 30).
      cn: 主，为了向他们显明祂是真正的神，而非出于虚荣而自命为神，祂以另一个神迹说服了他们。祂亲自知晓他们心中所默想的。由此完全显明，祂是神，因为知晓人心是神所固有的（历代志上 28:9，历代志下 6:30）。
  - type: paragraph
    initial:
      ru: 'Лк 5:23. '
      cn: （路加福音 5:23）
    text:
      ru: 'Что́ легче сказать: прощаются тебе грехи твои, или сказать: встань и ходи?'
      cn: 何较易、言尔罪赦免、或言起而行、
  - type: paragraph
    initial:
      ru: 'Лк 5:24. '
      cn: （路加福音 5:24）
    text:
      ru: 'Но чтобы вы знали, что Сын Человеческий имеет власть на земле прощать грехи, – сказал Он расслабленному: тебе говорю: встань, возьми постель твою и иди в дом твой.'
      cn: 然使尔等知人子在地有权赦免罪、即语瘫痪者曰、我告尔、起哉、取尔床而归尔家、
  - type: paragraph
    initial:
      ru: 'Лк 5:25. '
      cn: （路加福音 5:25）
    text:
      ru: И он тотчас встал перед ними, взял, на чём лежал, и пошел в дом свой, славя Бога.
      cn: 而在彼等前即起、取其所卧者归己家、荣光上帝、
  - type: paragraph
    initial:
      ru: 'Лк 5:26. '
      cn: （路加福音 5:26）
    text:
      ru: 'И ужас объял всех, и славили Бога и, быв исполнены страха, говорили: чу́дные дела видели мы ныне.'
      cn: 众遍体惊惘、亦荣光上帝、满惊畏、曰、今我曹得见意外之事
  - type: paragraph
    text:
      ru: 'Итак, Он говорит: что вам кажется удобнее – грехи отпустить или телу дать здоровье? Конечно, по вашему мнению, отпущение грехов кажется удобнее, как дело невидимое и необличимое, хотя оно труднее, – а выздоровление тела кажется труднее, как дело видимое, хотя в сущности оно удобнее. Однако ж Я сделаю и то, и другое, и через исцеление тела, что для вас кажется труднейшим, удостоверю и в уврачевании души, которое хотя и трудно, но, как невидимое, вам кажется удобным. Смотри: грехи оставляются на земле. Ибо пока мы находимся на земле, мы можем загладить наши грехи, а после того, как переселимся с земли, мы уже не можем сами загладить наших грехов исповедью: ибо дверь заперта. Но об этом предмете мы сказали обширнее в объяснении других евангелистов (см. Mф. 9, Mк. 2).'
      cn: 祂如此说：在你们看来，哪一样更便利——是赦免罪孽，还是使身体获得健康？当然，在你们看来，赦免罪孽似乎更便利，因为它是一件看不见且无法被察觉的事，尽管它实际上更艰难；而身体的痊愈则似乎更艰难，因为它是一件看得见的事，尽管就其本质而言它更便利。然而，我要两者都成就，并藉着身体的治愈，这在你们看来是最艰难的事，来证实灵魂的医治，尽管灵魂的医治很难，但由于它是不可见的，你们便觉得它很便利。请看：罪孽被留在地上。因为只要我们仍身处地上，我们就能赎清我们的罪孽；而当我们从地上迁居之后，我们就不能再藉着告白来自己赎清我们的罪孽了：因为门已经关闭。但关于这个主题，我们在解释其他福音撰述者（参 马太福音 9:1，马可福音 2:1）时已进行了更广泛的阐述。
  - type: paragraph
    initial:
      ru: 'Лк 5:27. '
      cn: （路加福音 5:27）
    text:
      ru: 'После сегоИисусвышел и увидел мытаря, именем Левия, сидящего у сбора пошлин, и говорит ему: следуй за Мною.'
      cn: 〇厥、后彼出见税吏名列微乙坐于税关者、乃语之曰、从我、
  - type: paragraph
    text:
      ru: Матфей не прикрывает, но прямо объявляет свое имя, говоря:«Иисус увидел человека, сидящего у сбора пошлин, по имени Матфея» (Мф. 9, 9). Но Лука и Марк, из уважения к евангелисту, выставляют другое имя его, именно Левий.
      cn: 马太没有遮掩，而是直言不讳地宣告了自己的名字，他说：「耶稣看见一个坐在税关上的人，名叫马太」（马太福音 9:9）。但路加和马可，出于对这位传福音者的敬意，提出了他的另一个名字，即利未。
  - type: paragraph
    initial:
      ru: 'Лк 5:28. '
      cn: （路加福音 5:28）
    text:
      ru: И он, оставив всё, встал и последовал за Ним.
      cn: 遂舍一切起而从之、
  - type: paragraph
    text:
      ru: Подивись человеколюбию Божию, как Он похищает сосуды лукавого. Ибо мытарь – сосуд лукавого и зверь лукавый. Испытавшие жестокости сборщиков знают это. Ибо мытари суть те, кои откупают народные подати, чтобы через то приобрести выгоду и уплатить повинности за собственные души.
      cn: 请看上帝的仁爱，祂如何劫掠了那恶者的器皿。因为税吏是那恶者的器皿，是那恶毒的野兽。经历过收税者之残暴的人们知晓此事。因为税吏正是那些包揽百姓赋税的人，好借此牟利并为他们自己的灵魂偿付义务。
  - type: paragraph
    initial:
      ru: 'Лк 5:29. '
      cn: （路加福音 5:29）
    text:
      ru: И сделал для Него Левий в доме своем большое угощение; и там было множество мытарей и других, которые возлежали с ними.
      cn: 列微乙于其家为彼设盛筵、有税吏者及他众多民皆与彼共席、
  - type: paragraph
    text:
      ru: Господь не только Матфея приобрел, но старался приобрести и других мытарей, с которыми Он обедал. Ибо Он затем и благоволил есть с ними, чтобы привлечь и их.
      cn: 主不仅赢得了马太，而且努力争取与祂一同进餐的其他税吏。因为祂正是因此乐意与他们一同进食，好将他们也吸引过来。
  - type: paragraph
    initial:
      ru: 'Лк 5:30. '
      cn: （路加福音 5:30）
    text:
      ru: 'Книжники же и фарисеи роптали и говорили ученикам Его: зачем вы едите и пьете с мытарями и грешниками?'
      cn: 学士及发利些乙等怨言彼等及其门徒曰、尔曹何为与税吏及罪人同饮食乎、
  - type: paragraph
    initial:
      ru: 'Лк 5:31. '
      cn: （路加福音 5:31）
    text:
      ru: 'Иисус же сказал им в ответ: не здоровые имеют нужду во враче, но больные;'
      cn: 伊伊稣斯答之曰、需医士者、非康健者、乃负病者也、
  - type: paragraph
    initial:
      ru: 'Лк 5:32. '
      cn: （路加福音 5:32）
    text:
      ru: Я пришел призвать не праведников, а грешников к покаянию.
      cn: 我来非召义人、乃召罪人为改悔也、
  - type: paragraph
    text:
      ru: 'Смотри же, что слышат фарисеи, обвинявшие Его. Я, – говорит, – не пришел призвать праведников, то есть вас, которые сами себя делаете праведниками, а«пришел призвать... грешников», не для того, впрочем, чтоб они оставались во грехе, но чтобы покаялись. И иначе: Я не пришел праведных призвать, потому что не нахожу их, так как все согрешили (Пс. 13:1–3); если бы можно найти было праведных, Я не пришел бы. Мытарь же есть и всякий, кто работает миродержителю и взносит подать плоти. Чревоугодник платит подать плоти яствами, блудник – нечистыми связями, иной – иным. Когда же Господь, то есть Евангельское Слово, увидит его«сидящего у сбора пошлин», то есть не преуспевающим, не идущим вперед и не подвизающимся на большее зло, но как бы бездеятельным, то восставит его от зла, и он последует за Иисусом и примет Господа в дом души своей. А фарисеи, надменные и отсеченные бесы (ибо фарисей означает отсеченный от других), ропщут на то, что Он ест с грешниками.'
      cn: '你看，那些控告祂的法利赛人听到了什么。祂说：「我来非召义人，即是说你们这些自诩为义人的人，而是『来召……罪人』，」不过，并非为叫他们停留在罪中，而是为叫他们悔改。或者说，换一种方式：我来非召义人，因为我找不到他们，既然人人都犯了罪（诗篇 13:1-3）；如果能够找到义人，我就不会来了。


        税吏也是每一个服事这世界统治者并向肉体纳税的人。贪食者以食物向肉体纳税，淫乱者以不洁的联系纳税，另有人以别的方式纳税。当主，即福音之「圣言」（Word），看到他「坐在税关上」，即没有成功精进，没有向前迈进，也没有为更大的恶行而努力，而是如同无所事事（бездеятельным）时，祂就将他从邪恶中扶起，他就追随了耶稣，并把主接入了他灵魂的家。


        而那些傲慢的、被切断的邪魔，即法利赛人（因为「法利赛人」的意思是从他人中「被切断的」），就因祂与罪人同食而抱怨不平。'
  - type: paragraph
    initial:
      ru: 'Лк 5:33. '
      cn: （路加福音 5:33）
    text:
      ru: 'Они же сказали Ему: почему ученики Иоанновы постятся часто и молитвы творят, также и фарисейские, а Твои едят и пьют?'
      cn: 〇伊等告之曰、伊鄂昂之门徒、常禁食且祈祷、发利些乙等亦然、而尔者且饮且食、何也、
  - type: paragraph
    initial:
      ru: 'Лк 5:34. '
      cn: （路加福音 5:34）
    text:
      ru: 'Он сказал им: можете ли заставить сынов чертога брачного поститься, когда с ними жених?'
      cn: 彼告之曰、新郎尚在、安能使婚筵之客禁食乎、
  - type: paragraph
    initial:
      ru: 'Лк 5:35. '
      cn: （路加福音 5:35）
    text:
      ru: Но придут дни, когда отнимется у них жених, и тогда будут поститься в те дни.
      cn: 有日将至、新郎由彼等被夺取、彼时则禁食也、
  - type: paragraph
    text:
      ru: Об этом мы сказали в объяснении на Евангелие от Матфея(см.гл. 9) скажем кратко, что сынами брака называет апостолов. Пришествие Господа уподобляется браку, потому что Он принял Церковь в Невесту Себе. Поэтому апостолам теперь не нужно поститься. Ученики Иоанновы должны поститься, так как учитель их совершал добродетель с трудом и болезнью. Ибо сказано:«пришел Иоанн, ни ест, ни пьет»(Мф. 11, 18). А Мои ученики, как пребывающие со Мною – Богом Словом, теперь не нуждаются в пользе поста, потому что они от сего самого (пребывания со Мною) облагодетельствованы и Мною сохраняются. Когда же Я буду взят, а они будут посланы на проповедь, тогда они будут и поститься, и молиться, как приготовившиеся к великим подвигам.
      cn: '关于此事，我们在解释《马太福音》（参看第9章）时已论及，在此我们简要地说，他称使徒们为「婚宴之子」（сынами брака）。主的降临被比作婚宴，因为祂接纳了教会作祂的新妇。因此，使徒们现在不需要禁食。


        伊鄂昂的门徒应该禁食，因为他们的老师是带着艰辛和痛苦来实行德行的。因为经上说：「伊鄂昂来了，不吃，也不喝」（马太福音 11:18）。


        而我的门徒们，作为与我——即圣言之神（Бог Слово）——同在的人，现在不需要从禁食中得益，因为他们单单从（与我同在）这一事实中就得到了恩惠，并蒙我保守。


        但是，当我将被取去，他们将被差遣去传道时，那时他们就会禁食和祷告，如同为伟大的操练（подвиги）做好了准备。'
  - type: paragraph
    initial:
      ru: 'Лк 5:36. '
      cn: （路加福音 5:36）
    text:
      ru: 'При сем сказал им притчу: никто не приставляет заплаты к ветхой одежде, отодрав от новой одежды; а иначе и новую раздерет, и к старой не подойдет заплата от новой.'
      cn: 又与之言譬喻、未有用新衣之补丁补旧衣者、若然、反累新者、而新者之布与旧者不合、
  - type: paragraph
    initial:
      ru: 'Лк 5:37. '
      cn: （路加福音 5:37）
    text:
      ru: И никто не вливает молодого вина в мехи ветхие; а иначе молодое вино прорвет мехи, и само вытечет, и мехи пропадут;
      cn: 未有盛新酒于旧革囊者、若然、新酒败、囊自露、而囊坏、
  - type: paragraph
    initial:
      ru: 'Лк 5:38. '
      cn: （路加福音 5:38）
    text:
      ru: но молодое вино должно вливать в мехи новые; тогда сбережется и то́, и другое.
      cn: 惟新酒必盛于新囊、而二者得存、
  - type: paragraph
    initial:
      ru: 'Лк 5:39. '
      cn: （路加福音 5:39）
    text:
      ru: 'И никто, пив староевино,не захочет тотчас молодого, ибо говорит: старое лучше.'
      cn: 未有饮陈者、而即愿新者、盖言陈者、尤善也、
  - type: paragraph
    text:
      ru: 'И иначе: теперь, будучи слабы и еще не обновлены Духом, они подобны старым мехам и старой одежде. Поэтому их не должно обременять каким-нибудь очень трудным образом жизни, подобно как и к обветшалой одежде не пришивают новой заплаты. Итак, можешь принять, что старым мехам уподоблены апостолы как еще слабые, а можешь разуметь, что им уподоблены и фарисеи.'
      cn: 此外：如今，他们既然软弱，且尚未被圣灵更新，他们就如同旧皮袋和旧衣服。因此，不应以某种非常艰难的生活方式去加重他们的负担，就像不对旧的衣服缝上新的补丁一样。所以，你可以接受（这个解释）：使徒们被比作旧皮袋，因为他们那时仍是软弱的；你也可以理解为：法利赛人也被比作旧皮袋。
- type: heading1
  text:
    ru: Глава шестая
    cn: 第六章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 6:1. '
      cn: （路加福音 6:1）
    text:
      ru: В субботу, первую по втором дне Пасхи, случилось Ему проходить засеянными полями, и ученики Его срывали колосья и ели, растирая руками.
      cn: 〇适葩斯哈首日后第二日、彼经过禾田、其门徒摘穗以手搓之、而食、
  - type: paragraph
    text:
      ru: Иудеи всякий праздник называли субботой, ибо суббота – значит покой. Часто праздник встречался в пятницу, а эту пятницу, ради праздника, называли субботой. Потом собственно субботу называли второпервой, как вторую после предшествовавшего иного праздника и субботы. Подобное случилось и тогда, и суббота сия названа«второпервой".
      cn: 犹太人称呼每一个节日为安息日，因为安息日——意味着安歇（或：平静）。节日常常在星期五碰上，而这个星期五，为了节日的缘故，他们就称之为安息日。后来，他们称真正的安息日为「第二头等的」（второпервой），因为它是在先前另一个节日和安息日之后的第二个。类似的事情当时也发生了，而这个安息日被称为「第二头等的」（второпервой）。
  - type: paragraph
    initial:
      ru: 'Лк 6:2. '
      cn: （路加福音 6:2）
    text:
      ru: 'Некоторые же из фарисеев сказали им: зачем вы делаете то, чего не должно делать в субботы?'
      cn: 发利些乙中有人见之、与彼等曰、安息日所不当行者、尔曹何行之、
  - type: paragraph
    initial:
      ru: 'Лк 6:3. '
      cn: （路加福音 6:3）
    text:
      ru: 'Иисус сказал им в ответ: разве вы не читали, что сделал Давид, когда взалкал сам и бывшие с ним?'
      cn: 伊伊稣斯答之曰、尔等岂未读达微德自与从者觉饥时、如何所行者乎、
  - type: paragraph
    initial:
      ru: 'Лк 6:4. '
      cn: （路加福音 6:4）
    text:
      ru: Ка́к он вошел в дом Божий, взял хлебы предложения, которых не должно было есть никому, кроме одних священников, и ел, и дал бывшим с ним?
      cn: 何以彼入上帝殿而取供荐之饼食、且赐之与偕彼在者、除司祭外此所不当食也、
  - type: paragraph
    text:
      ru: Фарисеям, обвиняющим учеников за то, что они в субботу ели,«срывая», то есть сощипывая, колосья и кроша, то есть«растирая руками», Господь указывает на Давида, взалкавшего и евшего«хлебы предложения». Ибо он, бегая от Саула, прибыл к первосвященнику Авиафару и обманул его, сказав, что царь послал его на одно нужное дело, и в алчбе взял от священника хлебы предложения, которых каждый день предлагалось на священной трапезе по двенадцати, по шести с правой и по шести с левой руки (Лев. 24, 5–6). Получил он также и меч Голиафа (1Цар 21, 1–9). Господь, напоминая им эту историю, поступком Давидовым пристыжает их. Если вы, – говорит, – Давида почитаете, то как же осуждаете Моих учеников?
      cn: 对于法利赛人，他们指控门徒在安息日吃东西，方式是「摘取」，即「掐下」谷穗，并「碾碎」，即「用手揉搓」，主向他们指出了大卫，他因饥饿而吃了「陈设饼」。因为他，在躲避扫罗时，来到了大祭司亚比亚他（Авиафар）那里，并欺骗了他，说王派他去办一件急需之事。他因饥饿从祭司那里取走了陈设饼。这些饼每日在圣桌上摆放十二个，右边六个，左边六个（利未记 24:5-6）。他还得到了歌利亚的刀（撒母耳记上 21:1-9）。主向他们提及这段历史，用大卫的行为使他们感到羞耻。祂说：「如果你们尊敬大卫，那么你们怎能谴责我的门徒呢？」
  - type: paragraph
    initial:
      ru: 'Лк 6:5. '
      cn: （路加福音 6:5）
    text:
      ru: 'И сказал им: Сын Человеческий есть господин и субботы.'
      cn: 又语之曰、人子亦系安息日之主、
  - type: paragraph
    text:
      ru: И иначе:«Сын Человеческий..., то есть Я,господин субботы», и как Создатель и Творец, и Владыка, и Законоположник, имею власть разрушить субботу. «Сыном Человеческим» мог быть назван не иной кто, как Христос, который будучи Сыном Божиим, ради человеков пречудно соизволил быть и именоваться Сыном Человеческим. Ибо нет ничего нового в том, что меня и тебя называют сыном человеческим, а то замечательно, что Он, пречудно вочеловечившийся, называется Сыном Человеческим.
      cn: 另作解释：「人子……，即是我，安息日之主」，且我作为创造主（Создатель）和创作者（Творец），以及主宰者（Владыка）和立法者（Законоположник），拥有废除安息日的权柄。能被称为「人子」的，非基督莫属，祂本是上帝之子，却为着世人，奇妙地乐意成为并被称为人子。因为称你我为人子（即人的儿子），并无新奇之处；而令人惊叹的是，祂，奇妙地道成肉身，却被称为人子。
  - type: paragraph
    initial:
      ru: 'Лк 6:6. '
      cn: （路加福音 6:6）
    text:
      ru: Случилось же и в другую субботу войти Ему в синагогу и учить. Там был человек, у которого правая рука была сухая.
      cn: 适一安息日、彼入会堂以教训、在彼有一右手枯者、
  - type: paragraph
    initial:
      ru: 'Лк 6:7. '
      cn: （路加福音 6:7）
    text:
      ru: Книжники же и фарисеи наблюдали за Ним, не исцелит ли в субботу, чтобы найти обвинение против Него.
      cn: 学士及发利些乙等伺窥彼于安息日施医否、为寻求讼之、
  - type: paragraph
    initial:
      ru: 'Лк 6:8. '
      cn: （路加福音 6:8）
    text:
      ru: 'Но Он, зная помышления их, сказал человеку, имеющему сухую руку: встань и выступи на средину. И он встал и выступил.'
      cn: 彼知其意、向手枯者曰、起立于中、伊遂起立之、
  - type: paragraph
    initial:
      ru: 'Лк 6:9. '
      cn: （路加福音 6:9）
    text:
      ru: 'Тогда сказал им Иисус: спрошу Я вас: что́ должно делать в субботу? добро, или зло? спасти душу, или погубить? Они молчали.'
      cn: 伊伊稣斯向彼等曰、我问尔等、安息日行善行恶、救命害命、孰宜、彼等默然、
  - type: paragraph
    initial:
      ru: 'Лк 6:10. '
      cn: （路加福音 6:10）
    text:
      ru: 'И, посмотрев на всех их, сказал тому человеку: протяни руку твою. Он так и сделал; и стала рука его здорова, как другая.'
      cn: 彼环视众人谓其人曰、伸尔手、即若是行之、其手即健愈如他然、
  - type: paragraph
    initial:
      ru: 'Лк 6:11. '
      cn: （路加福音 6:11）
    text:
      ru: Они же пришли в бешенство и говорили между собою, что́ бы им сделать с Иисусом.
      cn: 等然盈满狂怒、互相议何以处于伊伊稣斯、
  - type: paragraph
    text:
      ru: Что мы сказали в объяснении на Евангелие от Матфея, то известно (см.гл. 12). А теперь скажем,  что сухую имеет руку тот, кто не совершает никаких дел благочестия. Ибо рука есть орудие деятельности, а у кого она иссохла, тот, без сомнения, празден. Итак, кто желает вылечить свою руку, уврачует ее в субботу. Поясним. Не может тот совершать дела благочестия, кто прежде не успокоится от злобы.Уклонись прежде от зла, и тогда сотвори благое(Пс. 36, 27). Итак, когда будешь субботствовать, то есть покоиться от злых дел, тогда прострешь руку твою на дела благочестия, и она у тебя восстановится. Прилично сказать:«стала рука его здорова». Ибо было время, когда человеческая природа имела деятельность добрую и руку, то есть деятельную силу, здоровую; потом утратила ее и по благодати Христовой снова приобрела ее, и возвратилась к прежнему добру.
      cn: 我们在解释（马太福音 12:47）时所说的，是已然知晓的。（参见第十二章）。现在我们要说，那不完成任何虔诚之事的人，他拥有干枯的手。因为手是作为活动的工具，而谁的手干枯了，谁就无疑是闲懒的。因此，谁若渴望治愈他的手，就当在安息日治愈它。让我们解释一下。若非先歇止于恶行，那人就不能完成虔诚之事。先要离开恶行，然后行善（诗篇 36:27）。因此，当你守安息日，也就是从恶行中歇止时，你就会将你的手伸向虔诚之事，而你的手就会在你那里得以恢复。说「他的手就恢复了健康」是恰当的。因为曾几何时，人类的本性拥有美好的活动，以及一只手——即健康的活动能力；后来失去了它，又借着基督的恩典重新获得了它，并回归到先前的美好之中。
  - type: paragraph
    initial:
      ru: 'Лк 6:12. '
      cn: （路加福音 6:12）
    text:
      ru: В те дни взошел Он на гору помолиться и пробыл всю ночь в молитве к Богу.
      cn: 〇当日、适彼出、往山为祈祷、乃终夜祈祷上帝、
  - type: paragraph
    text:
      ru: Господь все творит в наше научение, чтобы и мы также делали, как Он. Вот, например, Он намерен молиться. Он восходит на гору. Ибо молиться должно, успокоившись от дел и не пред лицом многих, и молиться через всю ночь, а не так, чтоб стать на молитву и сейчас же перестать.
      cn: 主在我们所有的教训中创造万物，以便我们也要像祂一样行事。例如，祂打算祷告。祂登上山。因为祷告应当是脱离了诸事、获得了安宁之后进行，而非当着众人的面；并且要彻夜祷告，而不是一站立祷告就立刻停止。
  - type: paragraph
    initial:
      ru: 'Лк 6:13. '
      cn: （路加福音 6:13）
    text:
      ru: 'Когда же настал день, призвал учеников Своих и избрал из них двенадцать, которых и наименовал Апостолами:'
      cn: 平旦、召诸门徒由其中选十二者称之为宗徒、
  - type: paragraph
    initial:
      ru: 'Лк 6:14. '
      cn: （路加福音 6:14）
    text:
      ru: Симона, которого и назвал Петром, и Андрея, брата его, Иакова и Иоанна, Филиппа и Варфоломея,
      cn: 即锡孟、又名撇特儿、与其兄昂德列乙、亚适乌及伊鄂昂、肥利普、瓦儿缚罗梅乙、
  - type: paragraph
    initial:
      ru: 'Лк 6:15. '
      cn: （路加福音 6:15）
    text:
      ru: Матфея и Фому, Иакова Алфеева и Симона, прозываемого Зилотом,
      cn: 玛特斐、缚玛、阿泐斐乙之亚适乌、锡孟称济罗特者、
  - type: paragraph
    initial:
      ru: 'Лк 6:16. '
      cn: （路加福音 6:16）
    text:
      ru: Иуду Иаковлева и Иуду Искариота, который потом сделался предателем.
      cn: 亚适乌之伊屋达、又伊斯喀利鄂特人伊屋达、即卖之者、
  - type: paragraph
    text:
      ru: Избирает учеников после молитвы, желая научить, чтобы и мы, когда нам приведется поставить кого-нибудь на духовное служение, брались за это дело с молитвой, искали руководства от Бога и Его просили показать нам достойного.
      cn: 他在祷告之后拣选门徒，是想要教导，好让我们，当我们有机会指派某人担任属灵职事时，也应当带着祷告从事此项事务，寻求来自上帝的指引，并祈求祂向我们显明那配得之人。
  - type: paragraph
    initial:
      ru: 'Лк 6:17. '
      cn: （路加福音 6:17）
    text:
      ru: И, сойдя с ними, стал Он на ровном месте, и множество учеников Его, и много народа из всей Иудеи и Иерусалима и приморских мест Тирских и Сидонских,
      cn: 〇彼偕伊等出、下立于平地、又有其诸门徒及多民自遍伊屋叠亚、耶鲁萨利木、与提儿及西东之海滨、
  - type: paragraph
    initial:
      ru: 'Лк 6:18. '
      cn: （路加福音 6:18）
    text:
      ru: которые пришли послушать Его и исцелиться от болезней своих, также и страждущие от нечистых духов; и исцелялись.
      cn: 其来为听之、且得医其诸疾病、亦有被邪神所患者而得愈矣、
  - type: paragraph
    text:
      ru: 'Избрав двенадцать, сходит с горы, чтобы исцелить пришедших из городов и облагодетельствовать вдвойне, именно: по душе и по телу. Ибо слушай:«пришли послушать Его»– это врачевание душ;«и исцелиться от болезней своих»– это врачевание тел.'
      cn: 选取了十二门徒后，祂下了山，以治愈那些从城中来的人，并加倍地施恩于他们，即：在灵魂和在身体上。因为请听：「他们来是为听祂的」（路加福音 6:18）——这是对灵魂的医治；「并且要从他们的疾病中得痊愈」（路加福音 6:18）——这是对身体的医治。
  - type: paragraph
    initial:
      ru: 'Лк 6:19. '
      cn: （路加福音 6:19）
    text:
      ru: И весь народ искал прикасаться к Нему, потому что от Него исходила сила и исцеляла всех.
      cn: 众民寻求扪之、因有能力由之出、而疗愈一切
  - type: paragraph
    text:
      ru: Пророки и другие святые не имели силы, исходящей от них, ибо они не были сами источниками сил. А Господь имел силу, исходящую от Него, ибо Он Сам был источник силы, тогда как пророки и святые получали особенную силу свыше.
      cn: 先知与其他圣者不具有能力自他们而出，因为他们自身并非能力之源泉。而主则具有能力自他而出，因为他自身即是能力之源泉，相较而言，先知和圣者则是领受来自上方的特殊能力。
  - type: paragraph
    initial:
      ru: 'Лк 6:20. '
      cn: （路加福音 6:20）
    text:
      ru: 'И Он, возведя очи Свои на учеников Своих, говорил: Блаженны нищие духом, ибо ваше есть Царствие Божие.'
      cn: 彼举其目视其门徒曰、福哉、虚心者、因上帝之国属尔等、
  - type: paragraph
    initial:
      ru: 'Лк 6:21. '
      cn: （路加福音 6:21）
    text:
      ru: Блаженны алчущие ныне, ибо насытитесь. Блаженны плачущие ныне, ибо воссмеетесь.
      cn: 福哉今受饥者、因尔等将获饱饫、福哉、今哀恸者、因尔等将得欣乐、
  - type: paragraph
    initial:
      ru: 'Лк 6:22. '
      cn: （路加福音 6:22）
    text:
      ru: Блаженны вы, когда возненавидят вас люди и когда отлучат вас, и будут поносить, и пронесут имя ваше, как бесчестное, за Сына Человеческого.
      cn: 福哉、尔等有时人将憎撼尔、绝裂尔、诅詈尔、以尔名为恶而弃之、因人子之故、
  - type: paragraph
    initial:
      ru: 'Лк 6:23. '
      cn: （路加福音 6:23）
    text:
      ru: Возрадуйтесь в тот день и возвеселитесь, ибо велика вам награда на небесах. Так поступали с пророками отцы их
      cn: 其日欢喜而踊跃哉、顾、因尔等之赏赐于天乃大、盖其祖父待诸先知亦如是、
  - type: paragraph
    text:
      ru: Господь, рукоположив учеников, через блаженства и учение приводит их в более духовное состояние. Ибо Он ведет речь с обращением к ним. И, во-первых, ублажает бедных; хочешь, разумей под ними смиренномудрых, хочешь – ведущих жизнь несребролюбивую. Вообще же все блаженства научают нас умеренности, смирению, уничижению, перенесению поношений.
      cn: 主，在授予门徒圣职后，藉着真福和教导将他们引入一种更为属灵的状态。因为他正以转向他们的方式在讲话。并且，他首先称赞了贫穷者；你若愿意，可以理解为谦卑心志者，你若愿意，也可理解为过着不贪爱金钱生活者。总而言之，所有的真福都教导我们适度、谦卑、自抑和忍受责骂。
  - type: paragraph
    initial:
      ru: 'Лк 6:24. '
      cn: （路加福音 6:24）
    text:
      ru: Напротив, горе вам, богатые! ибо вы уже получили свое утешение.
      cn: 〇祸哉、惟尔等富者、因尔等已离安慰、
  - type: paragraph
    initial:
      ru: 'Лк 6:25. '
      cn: （路加福音 6:25）
    text:
      ru: Горе вам, пресыщенные ныне! ибо взалчете. Горе вам, смеющиеся ныне! ибо восплачете и возрыдаете.
      cn: 祸哉、今获饱饫者、因尔等将受饥、祸哉、今笑乐者、因尔等将哀且哭、
  - type: paragraph
    initial:
      ru: 'Лк 6:26. '
      cn: （路加福音 6:26）
    text:
      ru: Горе вам, когда все люди будут говорить о вас хорошо! ибо так поступали с лжепророками отцы их.
      cn: 祸哉、尔等有时人皆言尔等为善、因其祖待伪先知亦如是、
  - type: paragraph
    text:
      ru: Подобно как«горе»назначается в удел тем, кои богаты в нынешнем веке (о коих говорит, что они получают утешение, то есть здесь, в настоящем веке, вкушают радости, веселятся, наслаждаются удовольствиями и получают похвалы). Устрашимся, братие, поскольку горе тем, кои имеют похвалу от людей. Ибо должно заслужить похвалу и от людей, но прежде от Бога.
      cn: 如同「祸哉」（「горе」）被指定给那些在今世富足的人（祂论及这些人时说，他们已获得安慰，也就是说，他们在此，在现世中，尝尽喜乐、欢庆、享受逸乐并获得赞美）。弟兄们，我们当警惕，因为祸哉是给那些受人称赞之人。因为理当赢得人的称赞，但在此之前，更当赢得神的称赞。
  - type: paragraph
    initial:
      ru: 'Лк 6:27. '
      cn: （路加福音 6:27）
    text:
      ru: 'Но вам, слушающим, говорю: люби́те врагов ваших, благотворите ненавидящим вас,'
      cn: 惟我告尔等听者、爱尔等之仇哉、善待憾尔等者、
  - type: paragraph
    initial:
      ru: 'Лк 6:28. '
      cn: （路加福音 6:28）
    text:
      ru: благословляйте проклинающих вас и молитесь за обижающих вас.
      cn: 福言咒尔等者、而祈祷为凌虐尔等者、
  - type: paragraph
    initial:
      ru: 'Лк 6:29. '
      cn: （路加福音 6:29）
    text:
      ru: Ударившему тебя по щеке подставь и другую, и отнимающему у тебя верхнюю одежду не препятствуй взять и рубашку.
      cn: 有击尔颊者、则转他予之、有夺尔外衣者、毋拒取里衣、
  - type: paragraph
    initial:
      ru: 'Лк 6:30. '
      cn: （路加福音 6:30）
    text:
      ru: Всякому, просящему у тебя, давай, и от взявшего твое не требуй назад.
      cn: 凡求尔者予之、由取尔者勿复索、
  - type: paragraph
    text:
      ru: Апостолы имели быть посланы на проповедь и потому ожидали себе многих гонителей и наветников. Итак, если б апостолы, тяготясь гонением, потом желая отомстить оскорбителям, умолкли и перестали бы учить, то солнце Евангелия погасло бы. Поэтому-то Господь предварительно убеждает апостолов не приступать к мщению врагам, но все случающееся переносить мужественно, будет ли кто обижать их, или неправедно злоумышлять против них. Так и Сам Он поступил на Кресте, говоря:«Отче! прости им, ибо не знают, что делают»(Лк. 23, 34).
      cn: 使徒们将要被差遣去宣讲，因此他们预料自己会遇到许多迫害者和诽谤者（наветников）。既然如此，若是使徒们因逼迫而感到沉重，之后又渴望报复凌辱他们的人，就会沉默并停止教导，那么福音的太阳就会熄灭。正因如此，主事先劝勉（убеждает）使徒们不要着手报复仇敌，而要勇敢地忍受一切发生的事情，无论是有人欺凌他们，还是有人不公正地恶意图谋反对他们。祂自己也是这样在十字架上行事，祂说：「父啊！赦免他们；因为他们所做的，他们不晓得」（路加福音 23:34）。
  - type: paragraph
    initial:
      ru: 'Лк 6:31. '
      cn: （路加福音 6:31）
    text:
      ru: И ка́к хотите, чтобы с вами поступали люди, та́к и вы поступайте с ними.
      cn: 〇尔等愿人如何施诸己、亦如是施诸人、
  - type: paragraph
    text:
      ru: 'Потом, чтобы апостолы не сказали, что такая заповедь – любить врагов – невозможна, Он говорит: чего желаешь ты себе самому, то делай и другим, и будь в отношении к другим таков, каковыми желаешь иметь в отношении к тебе самому других. Если желаешь, чтобы враги твои были для тебя суровы, несострадательны и гневливы, то будь и ты таков. Если же, напротив, желаешь, чтобы они были добры и сострадательны, и непамятозлобивы, то не считай невозможным делом – и самому быть таковым.'
      cn: 随后，为使众使徒不至于说诸如「爱仇敌」这样的诫命是不可行的，他言道：你希冀自身获享何事，亦当以何事施诸他人；你欲求他人如何待你自身，你便当如此待人。倘若你希冀你的仇敌对你而言是严酷的、不施怜悯的、且充满怒气的，那么你亦当如此待人。而若相反，你希冀他们是良善的、富于怜悯的、且不怀记恶意的，那么你便不应认为自身亦如此行是一件不可能之事。
  - type: paragraph
    initial:
      ru: 'Лк 6:32. '
      cn: （路加福音 6:32）
    text:
      ru: И если любите любящих вас, какая вам за то благодарность? ибо и грешники любящих их любят.
      cn: 若尔等爱爱尔者、与尔等有何赏耶、盖罪人等亦爱其所爱者、
  - type: paragraph
    initial:
      ru: 'Лк 6:33. '
      cn: （路加福音 6:33）
    text:
      ru: И если делаете добро тем, которые вам делают добро, какая вам за то благодарность? ибо и грешники то́ же делают.
      cn: 若尔等善待善待尔者、与尔等有何恩耶、盖罪人等亦如是行、
  - type: paragraph
    initial:
      ru: 'Лк 6:34. '
      cn: （路加福音 6:34）
    text:
      ru: И если взаймы даёте тем, от которых надеетесь получить обратно, какая вам за то благодарность? ибо и грешники дают взаймы грешникам, чтобы получить обратно столько же.
      cn: 尔等若借予人即望収还、何惠之有、因罪人亦借予罪人、为如数収还、
  - type: paragraph
    initial:
      ru: 'Лк 6:35. '
      cn: （路加福音 6:35）
    text:
      ru: Но вы люби́те врагов ваших, и благотворите, и взаймы давайте, не ожидая ничего; и будет вам награда великая, и будете сынами Всевышнего; ибо Он благ и к неблагодарным и злым.
      cn: 然尔等宜爱尔等之仇、善待且借予之、毫无望之、则尔等之赏乃大、并将为至上者之子、盖彼施仁于负恩及恶者、
  - type: paragraph
    initial:
      ru: 'Лк 6:36. '
      cn: （路加福音 6:36）
    text:
      ru: Итак, будьте милосерды, как и Отец ваш милосерд.
      cn: 故尔等宜怜悯如尔等之父怜悯然、
  - type: paragraph
    text:
      ru: 'Видишь ли врожденный закон, в сердцах наших написанный? Так и Господь сказал:«вложу закон Мой во внутренность их и на сердцах их напишу его»(Иер. 31, 33). Потом предлагает им и другое побуждение, именно:«есливылюбите любящих вас», то вы подобны грешникам и язычникам; если же вы любите злобствующих на вас, то вы подобны Богу, который«благ... к неблагодарным и злым». Итак, чего вы желаете: грешникам ли быть подобными, или Богу? Видишь ли Божественное учение? Сначала Он убеждал тебя законом естественным: чего желаешь себе, то делай и другим; потом убеждает и кончиной, и наградой, ибо в награду вам обещает то, что вы будете подобны Богу.'
      cn: '你是否看到了写在我们心中的那与生俱来的律法？正如主所说的：「我要将我的律法放在他们里面，写在他们心上」（耶利米书 31:33）。


        然后，他向他们提出了另一种激励，即：「如果你们爱那爱你们的人」，那么你们就与罪人和外邦人相似；但如果你们爱那恶意对待你们的人，那么你们就与上帝相似，因为他「恩待那忘恩的和恶人」。


        因此，你们渴望什么：是渴望与罪人相似，还是与上帝相似？你是否看到了这神圣的教导？起初他以自然律来劝服你：你希望别人怎样待你，你就怎样待人；然后，他又以结局和奖赏来劝服你，因为他应许你们得到的奖赏是与上帝相似。'
  - type: paragraph
    initial:
      ru: 'Лк 6:37. '
      cn: （路加福音 6:37）
    text:
      ru: Не суди́те, и не будете судимы; не осуждайте, и не будете осуждены; прощайте, и прощены будете;
      cn: 〇勿议人、为不见议、勿罪人、为不见罪、尔等赦免人、则尔等亦得赦免、
  - type: paragraph
    text:
      ru: Господь отсекает от наших душ самую трудную болезнь, разумею, корень высокомерия. Ибо кто не надзирает за самим собой, а только за ближним подсматривает и желает его опорочить, тот, очевидно, плененный высокомерием, забыл самого себя. Он всеконечно думает о себе, что он не грешит, и поэтому осуждает других, когда они грешат. Итак, если не желаешь быть осужденным, не осуждай других. Ибо скажи, пожалуй, почему ты другого осуждаешь, как преступника Божественных Законов во всем? А ты сам разве не преступаешь Божественного Закона (не говорю о других грехах) тем самым, что других осуждаешь? Ибо Закон Божий решительно повелевает тебе не осуждать брата. Значит, и ты преступаешь Закон. А будучи сам преступником, ты не должен осуждать другого как преступника; ибо Судия должен быть выше природы, впадающей в грех.
      cn: '主将我们灵魂中最困难的疾病，我指的是傲慢的根源，从我们身上切除。因为谁若不看顾（надзирает）自己，而只窥视邻人并意图诋毁（опорочить）他，那人显然是被傲慢所掳获，忘记了自己。他绝对认为自己不犯罪，因此当他人犯罪时，他就定罪他人。


        因此，如果你不希望被定罪，就不要定罪别人。因为，请你说说看，你为何将别人定罪，仿佛他在一切事上都是干犯了神圣律法的罪犯？而你自己，难道不是正因你定罪别人这一行为（我不说别的罪），而干犯了神圣律法吗？因为上帝的律法坚决地命令你不可定罪你的弟兄。这就意味着，你也干犯了律法。而你自己既然是干犯者，就不应当定罪另一个人为干犯者；因为审判者必须超越堕入罪中的本性。'
  - type: paragraph
    initial:
      ru: 'Лк 6:38. '
      cn: （路加福音 6:38）
    text:
      ru: 'давайте, и дастся вам: мерою доброю, утрясенною, нагнетенною и переполненною отсыплют вам в лоно ваше; ибо, какою мерою мерите, такою же отмерится и вам.'
      cn: 予人亦将予尔等、在尔等以嘉量、摇之使落实、充满外溢、纳于尔等怀中、盖尔等以何量量于人、尔等受量亦如是、
  - type: paragraph
    text:
      ru: 'Итак, отпускай, и тебе отпущено будет; давай, и тебе дано будет. Ибо меру хорошую, надавленную, натрясенную и преисполненную дадут в недра ваши. Ибо Господь будет возмерять не скупо, а богато. Как ты, намереваясь отмерять какой-нибудь муки, если желаешь отмерять без скупости, надавливаешь ее, натрясываешь и накладываешь с избытком, так и Господь даст тебе меру большую и преисполненную. Быть может, иной остроумный спросит: как Он говорит, что дадут в недра ваши меру преисполненную, когда сказал, что возмерится вам той же мерой, какой вы мерите, ибо если переливается через верх, то не та же самая? Отвечаем, Господь не сказал: возмерится вам «тою же» мерой, но«такою же». Если бы Он сказал: «тою же мерою», тогда речь представляла бы затруднение и противоречие; а теперь, сказав:«такою же», Он разрешает противоречие, ибо можно мерить и одной мерой, но не одинаково. Господь то и говорит: если ты будешь благотворить, и тебе будут благотворить. Это – такая же мера. Преисполненной названа она потому, что за одно твое благодеяние тебе заплатят бесчисленными.'
      cn: 因此，要饶恕人，你们也必蒙饶恕；要施予人，你们也必蒙施予。因为善美的、压实的、摇匀的、满溢的量器，必倾入你们的怀中。因为主不会吝啬地，而是丰厚地量给你们。正如你们打算量取某些面粉时，如果希望量取时不吝啬，便会将其压实、摇匀，并盛得溢满，同样地，主也会赐予你们更大、满溢的量器。或许，某个机敏的人会问：祂怎么说满溢的量器会倾入你们的怀中，既然祂又说过，你们用什么量器量给人，也必用同样的量器量给你们？因为如果量器溢出，那就不再是「同一」量器了。我们回答：主没有说「用同一」量器量给你们，而是说「用同样」的量器。如果祂说的是「用同一量器」，那么这话就会带来困难与矛盾；然而，现在祂说的是「用同样量器」，祂就化解了矛盾，因为可以用一个量器来量，但量的方式可以不同。主所说的正是：如果你施予恩惠，人也会施予恩惠给你。这就是同样的量器。称之为「满溢的」，是因为你一次的善行，将获得无数次回报。
  - type: paragraph
    initial:
      ru: 'Лк 6:39. '
      cn: （路加福音 6:39）
    text:
      ru: 'Сказал также им притчу: может ли слепой водить слепого? не оба ли упадут в яму?'
      cn: 又以譬喻语彼等曰、瞽者能导引瞽乎、二者岂不陷于坑乎、
  - type: paragraph
    text:
      ru: 'То же самое и об осуждении. Ибо осуждающий получает той же самой мерой, когда его впоследствии осуждают; поскольку же он осуждается более, как осудивший ближнего, то мера сия преисполнена. Господь, сказав это и запретив нам осуждать, представляет нам и притчу, то есть пример. Он говорит: осуждающий другого и сам те же грехи делающий! скажи, пожалуй, не подобен ли ты слепцу, руководящему слепца? Ибо если ты осуждаешь другого, а сам впадаешь в те же грехи, то вы оба слепы. Хотя ты и думаешь, что через осуждение руководишь его на добро, но ты не руководишь. Ибо как он будет наставлен тобой на добро, когда ты и сам падаешь?'
      cn: 关于定罪，亦是如此。因为那定罪的人，当他随后被定罪时，也以同一尺度来领受；既然他因着定罪了邻人而受到更重的定罪，则此尺度就盈满了。主在说了此番话并禁止我们定罪之后，也向我们展示了一个譬喻，亦即一个例子。他说：定罪他人而自己却行着相同罪恶的人哪！请你告诉我，你不就像一个引导瞎子的瞎子吗？因为如果你定罪他人，而自己也陷入相同的罪中，那么你们二者都是瞎子。尽管你以为通过定罪能引导他向善，但你并未引导。因为当你自己也在跌倒时，他又如何能被你教导向善呢？
  - type: paragraph
    initial:
      ru: 'Лк 6:40. '
      cn: （路加福音 6:40）
    text:
      ru: Ученик не бывает выше своего учителя; но, и усовершенствовавшись, будет всякий, как учитель его.
      cn: 未有门徒不逾其师、凡学全备者将如其师、
  - type: paragraph
    text:
      ru: «Ученик не бывает выше... учителя». Если, поэтому, ты, мнимый учитель и руководитель, падаешь, то, без сомнения, падает и руководимый тобой ученик. Ибо и приготовленный ученик, то есть совершенный, будет таков, каков его учитель. Сказав сие о том, что нам не должно осуждать слабейших нас и, по-видимому, грешных, Он присовокупляет и нечто другое на тот же предмет.
      cn: 「学生不能高过……老师」。所以，如果你，这位虚假的教师和引导者，跌倒了，那么，你所引导的学生也毫无疑问地会跌倒。因为那预备好的学生，也就是那完善的学生，将如同他的老师一样。说完这段关于我们不应该论断那些比我们软弱、表面上看来有罪之人后，祂又为此主题增添了另一番话。
  - type: paragraph
    initial:
      ru: 'Лк 6:41. '
      cn: （路加福音 6:41）
    text:
      ru: Что ты смотришь на сучок в глазе брата твоего, а бревна в твоем глазе не чувствуешь?
      cn: 何以见草芥在尔弟兄之目、而不觉梁木在尔之目耶、
  - type: paragraph
    initial:
      ru: 'Лк 6:42. '
      cn: （路加福音 6:42）
    text:
      ru: 'Или, как можешь сказать брату твоему: брат! дай, я выну сучок из глаза твоего, когда сам не видишь бревна в твоем глазе? Лицемер! вынь прежде бревно из твоего глаза, и тогда увидишь, как вынуть сучок из глаза брата твоего.'
      cn: 或者、何能告尔弟兄、弟兄乎、容我去尔目中之草芥、而在尔目中之梁木自不知乎、伪善者欤、先去尔目中之梁木哉、然后尔见、以去尔弟兄目中之草芥也、
  - type: paragraph
    text:
      ru: Что, – говорит, – видишь«сучок», то есть малый грех своего брата, и не замечаешь«бревна»– великого своего греха? Это может относиться и ко всем, а особенно к учителям и начальникам, которые и малые погрешности своих подчиненных наказывают, а свои, как бы ни были они велики, оставляют безнаказанными. Потому-то Господь и называет их лицемерами, что они иными кажутся (ибо, наказывая погрешности других, они кажутся праведными), и иное – на деле, ибо и сами грешат, да еще хуже. Потом подтверждает речь Свою и примером.
      cn: 「你看见」什么——他说——「你弟兄眼中的草芥」，亦即他微小的罪，却不「察觉你眼中的梁木」，即你自身巨大的罪吗？这可以适用于所有人，特别是那些教师和管理者，他们惩罚其下属微小的过失，而他们自己的过失，无论多么巨大，却任其逍遥法外。因此，主才称他们为伪善者，因为他们表现出的是一回事（因为惩罚他人的过失时，他们看似是公义的），而实际做的却是另一回事，因为他们自己也犯罪，而且更甚。随后，祂用一个例子来印证祂的言论。
  - type: paragraph
    initial:
      ru: 'Лк 6:43. '
      cn: （路加福音 6:43）
    text:
      ru: Нет доброго дерева, которое приносило бы худой плод; и нет худого дерева, которое приносило бы плод добрый,
      cn: 盖未有善树结恶果者、未有恶树结善果者、
  - type: paragraph
    initial:
      ru: 'Лк 6:44. '
      cn: （路加福音 6:44）
    text:
      ru: ибо всякое дерево познаётся по плоду своему, потому что не собирают смокв с терновника и не снимают винограда с кустарника.
      cn: 盖凡树凭其果即识之、未有于荆棘中摘无花果者、未有于蒺藜丛中获葡萄者、
  - type: paragraph
    initial:
      ru: 'Лк 6:45. '
      cn: （路加福音 6:45）
    text:
      ru: Добрый человек из доброго сокровища сердца своего выносит доброе, а злой человек из злого сокровища сердца своего выносит злое, ибо от избытка сердца говорят уста его.
      cn: 善人由其心所积之善而著善、恶人由其心所积之恶而著恶、盖由充诸心者、乃言诸口也、
  - type: paragraph
    text:
      ru: 'Как хорошее дерево, – говорит, – не приносит плода гнилого, а дерево гнилое не приносит хорошего плода, так и тот, кто намеревается уцеломудрить других, исправить и привести в лучшее состояние, сам не должен быть зол; если же сам будет зол, то других не сделает лучшими. Ибо сердце каждого есть сокровищница. Если она вмещает добро, то и человек добр, и говорит доброе; если же сердце полно зла, то и человек зол, и говорит злое. Всю эту речь можешь разуметь и о фарисеях. Ибо Он, обращаясь к ним, сказал: выбрось прежде бревно из своего глаза, и тогда уже сучок из глаза брата своего, подобно как и в другом месте сказал:«оцеживающие комара, а верблюда поглощающие»(Мф. 23, 24). Как же, – говорит, – вы, фарисеи, будучи гнилыми деревьями, можете принести добрые плоды. Ибо как учение ваше гнило, так и жизнь, так как вы говорите от избытка сердца. Как же вы будете исправлять других и наказывать преступления других, когда сами грешите больше?'
      cn: 他说，如同好树不结腐烂的果子，而腐烂的树不结好果子一样，照样，那意图使他人纯全、改正并使其达到更好境况的人，自身不应是邪恶的；若他自身是邪恶的，则不能使他人更好。因为每个人的心都是一个宝库。若它容纳良善，则此人也是良善的，并说出良善的话；若心充满邪恶，则此人也是邪恶的，并说出邪恶的话。你也可以将所有这番言论理解为关于法利赛人的。因为祂曾对他们说：你先去掉自己眼中的梁木，然后才能去掉你弟兄眼中的刺，如同祂在另一处所说：「你们这些滤出蠓虫，却吞下骆驼的人」（马太福音 23:24）。祂说，法利赛人啊，你们既然是腐烂的树，又怎能结出好果子呢？因为既然你们的教导是腐烂的，你们的生活也是如此，因为你们所言皆出于心之所盈溢。当你们自己犯下更大的罪时，又怎能改正他人并惩罚他人的罪行呢？
  - type: paragraph
    initial:
      ru: 'Лк 6:46. '
      cn: （路加福音 6:46）
    text:
      ru: 'Что́ вы зовете Меня: Господи! Господи! – и не делаете того, что́ Я говорю?'
      cn: 〇尔等何称我曰、主欤、主欤、而不行我所言乎、
  - type: paragraph
    initial:
      ru: 'Лк 6:47. '
      cn: （路加福音 6:47）
    text:
      ru: Всякий, приходящий ко Мне и слушающий слова Мои и исполняющий их, скажу вам, кому подобен.
      cn: 凡来就我、听我言而行之者、我示尔等、将何以譬之、
  - type: paragraph
    initial:
      ru: 'Лк 6:48. '
      cn: （路加福音 6:48）
    text:
      ru: Он подобен человеку, строящему дом, который копал, углубился и положил основание на камне; почему, когда случилось наводнение и вода напёрла на этот дом, то не могла поколебать его, потому что он основан был на камне.
      cn: 譬建室掘而深之、置基于盘石上、洪水至时、横流其室、而不能摇动、因被建基于磐石上、
  - type: paragraph
    text:
      ru: Это необходимо относится к нам, которые устами исповедуем Его Господом,«а делами отрекаемся»от Него (Тит. 1, 16). Если, – говорит, – Я – Господь, то вы во всем должны поступать как рабы. А долг рабов – делать то, что Господь повелевает. Потом говорит нам, какая польза тому, кто слушает Его и не только слушает, но и на деле исполняет. Таковый«подобен человеку, строящему дом», построившему оный«на камне».«Камень же..., – как свидетельствует апостол (1Кор. 10, 4), –Христос.»
      cn: 这必然关乎我们，就是那些口头上宣认祂是主，但「在行为上却否认」祂的人（提多书 1:16）。祂说：「如果我既是主，那么你们就应当在一切事上都像仆人一样行事。而仆人的职责，就是去做主所吩咐的事情。」接着，祂告诉我们，对于听从祂，并且不仅听从，还付诸实践的人，有什么益处。这样的人「好比一个人建造房屋」，把房子建「在磐石上」。「这磐石……，——正如使徒所见证的（哥林多前书 10:4），——就是基督。」
  - type: paragraph
    initial:
      ru: 'Лк 6:49. '
      cn: （路加福音 6:49）
    text:
      ru: А слушающий и неисполняющий подобен человеку, построившему дом на земле без основания, который, когда напёрла на него вода, тотчас обрушился; и разрушение дома сего было великое.
      cn: 听而不行者、似人未有基、即建室于土上、横流冲至时、即颓倒、而其室之颓坏者、大矣、
  - type: paragraph
    text:
      ru: Копает и углубляет тот, кто принимает слова Писания не поверхностно, а изыскивает глубины их духом. Таковый основывает на камне; потом, когда случится наводнение, то есть гонение или искушение, река подступит к этому дому, то есть искуситель, бес ли то, или человек, и, однако ж, не может поколебать его. Искушающий человек очень справедливо может быть сравнен с наводнением реки. Ибо как наводнение речное производит вода, сверху падающая, так и человека искусителя возращает сатана, спадший с неба. Дом тех, кои не соблюдают слов Господа, падает, и разрушение сего дома бывает большое. Ибо падения слушающих, но не творящих, велики, потому что не слышавший и не сделавший погрешает легче, а слышавший и, однако ж, не исполняющий согрешает тяжелее.
      cn: 挖掘并深化经文的人，乃是那些并非肤浅地领受圣经话语，而是借着灵来探求其深奥之人。此人将根基立在磐石之上；其后，当洪水（即迫害或诱惑）降临时，河水便逼近此房（即试探者，无论是鬼魔还是人），然而，它却不能摇动此房。试探人的可以非常恰当地被比作河水泛滥。因为正如河水泛滥是由从上方降下的水所造成的，试探人的也由从天上坠落的撒旦所滋养。那些不遵守主话语的人的房屋会倒塌，而且此房屋的毁坏是巨大的。因为听道而不行道者的跌倒（过犯）是巨大的，那未曾听见却未曾遵行的人，其过错较轻；而那听见了却不遵行的人，其罪过则较重。
- type: heading1
  text:
    ru: Глава седьмая
    cn: 第七章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 7:1. '
      cn: （路加福音 7:1）
    text:
      ru: Когда Он окончил все слова Свои к слушавшему народу, то вошел в Капернаум.
      cn: 彼充满其诸言于民耳之时、
  - type: paragraph
    initial:
      ru: 'Лк 7:2. '
      cn: （路加福音 7:2）
    text:
      ru: У одного сотника слуга, которым он дорожил, был болен при смерти.
      cn: 〇乃入喀撇儿那屋木、有一百夫长所爱之仆病亟将死、
  - type: paragraph
    initial:
      ru: 'Лк 7:3. '
      cn: （路加福音 7:3）
    text:
      ru: Услышав об Иисусе, он послал к Нему Иудейских старейшин просить Его, чтобы пришел исцелить слугу его.
      cn: 闻伊伊稣斯、遣伊屋叠亚之长老等就之、求之来、为救其仆、
  - type: paragraph
    initial:
      ru: 'Лк 7:4. '
      cn: （路加福音 7:4）
    text:
      ru: 'И они, придя к Иисусу, просили Его убедительно, говоря: он достоин, чтобы Ты сделал для него это,'
      cn: 伊等来就伊伊稣斯、切求之曰、彼堪尔为之行此、
  - type: paragraph
    initial:
      ru: 'Лк 7:5. '
      cn: （路加福音 7:5）
    text:
      ru: ибо он любит народ наш и построил нам синагогу.
      cn: 盖伊爱我民、并为我等建立会堂、
  - type: paragraph
    initial:
      ru: 'Лк 7:6. '
      cn: （路加福音 7:6）
    text:
      ru: 'Иисус пошел с ними. И когда Он недалеко уже был от дома, сотник прислал к Нему друзей сказать Ему: не трудись, Господи! ибо я недостоин, чтобы Ты вошел под кров мой;'
      cn: 伊伊稣斯偕之往、彼既离其家不远、又百夫长遣友就之曰、主欤、勿劳、我不堪使尔临于舍下、
  - type: paragraph
    initial:
      ru: 'Лк 7:7. '
      cn: （路加福音 7:7）
    text:
      ru: потому и себя самого не почел я достойным придти к Тебе; но скажи слово, и выздоровеет слуга мой.
      cn: 故我自视不堪亲就尔、第发一言我仆即愈、
  - type: paragraph
    initial:
      ru: 'Лк 7:8. '
      cn: （路加福音 7:8）
    text:
      ru: 'Ибо я и подвластный человек, но, имея у себя в подчинении воинов, говорю одному: пойди, и идет; и другому: приди, и приходит; и слуге моему: сделай то́, и делает.'
      cn: 盖因我属人辖、亦有兵属我辖、命此去则去、命彼来则来、命我仆行此即行此、
  - type: paragraph
    initial:
      ru: 'Лк 7:9. '
      cn: （路加福音 7:9）
    text:
      ru: 'Услышав сие, Иисус удивился ему и, обратившись, сказал идущему за Ним народу: сказываю вам, что и в Израиле не нашел Я такой веры.'
      cn: 伊伊稣斯闻此而奇之、转顾从之之民曰、我告尔等、于伊斯拉伊泐中未见如是之信也、
  - type: paragraph
    initial:
      ru: 'Лк 7:10. '
      cn: （路加福音 7:10）
    text:
      ru: Посланные, возвратившись в дом, нашли больного слугу выздоровевшим.
      cn: 被遣者归家、见负病仆已愈、
  - type: paragraph
    text:
      ru: 'Сотник сей есть один и тот же с упоминаемым у евангелиста Матфея (Мф. 8, 5–10). Хотя Матфей и не говорит, что сотник посылал иудеев просить и молить Иисуса, но что из того? Ибо очень вероятно, что он сначала послал иудеев, а потом и сам пошел. Итак, что опустил Матфей, то говорит Лука. Может быть и то, что иудеи, снедаемые завистью, не допустили бы сотника прийти к ногам Иисусовым, ибо это доставило бы славу Иисусу, если б он, вынуждаемый крайностью, и сам пришел к Иисусу. Но, может быть, опять кто-нибудь спросит: как же Матфей говорит, что сотник через посланных просил Иисуса не приходить? На сие можно сказать, что нет ничего особенного в том, других ли послать, или самому прийти сказать это, то есть попросить не приходить. Но вера мужа, назвавшего себя недостойным посещения Иисусова, достойна удивления. Поэтому и Господь говорит: Я и в израильском народе«не нашел... такой веры». Ибо сотник был язычник, быть может, из римских отрядов.'
      cn: 这位百夫长与福音书作者马太所提及的那位（马太福音 8:5-10）是同一人。虽然马太没有说这位百夫长派了犹太人去请求和恳求耶稣，但那又如何呢？因为极有可能他先是派了犹太人去，然后自己也去了。因此，马太所省略的，路加说了。也可能是因为那些被嫉妒吞噬的犹太人，不愿让百夫长来到耶稣的脚前，因为假如他被困境所迫，自己来到耶稣面前，这就会给耶稣带来荣耀。但是，也许又有人会问：马太是如何说这位百夫长通过被差遣的人请求耶稣不要前来的呢？对此可以回答：派别人去，或者自己亲自来传达这件事，即请求不要前来，这两者之间并没有什么特别的不同。但这位自称不配受耶稣拜访的人的信心，值得惊叹。因此，主也说：「我就是在以色列民中，也没有遇见...这么大的信心」。因为这位百夫长是外邦人，也许来自罗马的军队。
  - type: paragraph
    text:
      ru: Сотник же есть и всякий ум, который, имея много дел в жизни, берет верх над многим злом, но имеет больного раба – неразумную часть души, разумею гнев и похотение; ибо сии поставлены быть рабами. Он призывает Иисуса, послав к Нему посредниками иудеев, то есть помыслы и слова исповедания; ибо Иуда – значит исповедание. Ибо не исповедание ли и смирение выражают слова:«я недостоинтого,чтоб Ты вошел под кров мой»и прочее? Итак, когда он уверует в Иисуса, то скоро он уврачует раба своего, то есть гнев и похотение.
      cn: '圣奥赫里德的狄奥菲拉克


        百夫长也是每一个具有许多尘世事务、战胜了许多邪恶的理智，但它拥有一个患病的仆人——即灵魂中那不理性的部分，我指的是怒气与贪欲；因为它们被设定为仆人。他召唤耶稣，差派犹太人作为中介到祂那里，也就是指认信的意念与言语；因为「犹大」（Иуда）意即「认信」。因为「我不配你进入我的屋檐下」等等的话语，不正表达了认信与谦卑吗？因此，当他信靠耶稣时，他将很快治愈他的仆人，也就是治愈怒气与贪欲。'
  - type: paragraph
    initial:
      ru: 'Лк 7:11. '
      cn: （路加福音 7:11）
    text:
      ru: После сего Иисус пошел в город, называемый Наин; и с Ним шли многие из учеников Его и множество народа.
      cn: 〇厥后、伊伊稣斯适一城名那英、门徒多人及众民偕之行、
  - type: paragraph
    initial:
      ru: 'Лк 7:12. '
      cn: （路加福音 7:12）
    text:
      ru: Когда же Он приблизился к городским воротам, тут выносили умершего, единственного сына у матери, а она была вдова; и много народа шло с нею из города.
      cn: 比及城门、顾、有舁死者出、即其母之独生子、且是嫠妇、城内之民随之多也、
  - type: paragraph
    initial:
      ru: 'Лк 7:13. '
      cn: （路加福音 7:13）
    text:
      ru: 'Увидев ее, Господь сжалился над нею и сказал ей: не плачь.'
      cn: 主见之、则怜悯、向之曰、勿哭、
  - type: paragraph
    initial:
      ru: 'Лк 7:14. '
      cn: （路加福音 7:14）
    text:
      ru: 'И, подойдя, прикоснулся к одру; несшие остановились, и Он сказал: юноша! тебе говорю, встань.'
      cn: 进前按其榇、舁者止、彼曰、少者欤、谓尔起、
  - type: paragraph
    initial:
      ru: 'Лк 7:15. '
      cn: （路加福音 7:15）
    text:
      ru: Мертвый, поднявшись, сел и стал говорить; и отдал егоИисусматери его.
      cn: 死者坐起且言、彼以之付其母、
  - type: paragraph
    initial:
      ru: 'Лк 7:16. '
      cn: （路加福音 7:16）
    text:
      ru: 'И всех объял страх, и славили Бога, говоря: великий пророк восстал между нами, и Бог посетил народ Свой.'
      cn: 众遍体惊骇、荣光上帝曰、大先知兴于我等中、上帝眷顾其民、
  - type: paragraph
    text:
      ru: 'Возвратив здоровье сотникову рабу даже заочно, Господь совершает еще новое чудо. Чтобы кто-нибудь не сказал: что же Он сделал нового над рабом; быть может, раб и не умер бы? – для этого Господь воскрешает мертвого, которого уже выносили. Не словом только Господь совершает чудо, но и одра касается, – чтобы мы познали, что Тело Его есть Тело жизни. Поскольку Плоть Его была собственной Плотью Слова, животворящего все, поэтому и сама животворит и разрушает смерть и тление.«Мертвый, поднявшись, сел и стал говорить», чтобы кто-нибудь не подумал, что он воскрешен призрачно. А то, что он сел и начал говорить, было признаком истинного воскресения. Ибо тело без души не может ни сидеть, ни говорить.'
      cn: '即便主甚至在缺席的情况下恢复了百夫长奴仆的健康，祂又行了另一个新奇迹。为了避免有人说：祂在奴仆身上行了什么新事呢？也许那奴仆本来就不会死？——为此，主使一个已经被抬出去的死人复活了。主并非单单用言语行神迹，祂也触摸了卧榻，——好叫我们知道祂的身体是生命的身体。因为祂的肉身是圣言自身的肉身，是赋予万物生命的，因此它自身也赋予生命、摧毁死亡与朽坏。


        「死者站起来，坐下并开始说话，」为的是避免有人认为他被虚幻地复活了。而他坐下并开始说话，是真实复活的征兆。因为没有灵魂的身体既不能坐，也不能说话。'
  - type: paragraph
    text:
      ru: Под вдовой можешь разуметь и душу, лишившуюся своего мужа, то есть Слова Божия, всеявшего добрые семена. Сын ее – ум, умерший и выносимый вне города, вышнего Иерусалима, который есть страна живых. Потом Господь, умилосердившись, касается одра. Одр ума – тело. Ибо тело есть поистине одр, гроб. Господь, коснувшись тела, воскрешает ум, делая его юным и отважным. Юноша, то есть ум этот, садится и, воскрешенный из гроба греха, начинает говорить, то есть учить других, потому что, доколе он одержим бывает грехом, он не может учить и говорить. Ибо кто ему поверит?
      cn: '你可以理解，这寡妇也指那丧失了她的丈夫，即丧失了那播撒了良善种子的上帝之道的灵魂。她的儿子就是悟性（ум），悟性死了，被抬到城外，即抬到高处的耶路撒冷之外——那高处的耶路撒冷才是活人之地。


        随后，主怜悯了她，祂触摸了棺柩（одр）。悟性的棺柩就是身体。因为身体确实是棺柩，是坟墓。主触摸了身体，就使悟性复活，使它变得年轻而勇敢（отважным）。这青年，即这悟性，坐了起来，从罪恶的坟墓中复活后，就开始说话，即开始教导他人。因为只要它仍被罪恶所辖制，它就不能教导，也不能说话。因为谁会相信它呢？'
  - type: paragraph
    initial:
      ru: 'Лк 7:17. '
      cn: （路加福音 7:17）
    text:
      ru: Такое мнение о Нём распространилось по всей Иудее и по всей окрестности.
      cn: 〇此言为之扬出遍于伊屋叠亚及各四方、
  - type: paragraph
    initial:
      ru: 'Лк 7:18. '
      cn: （路加福音 7:18）
    text:
      ru: И возвестили Иоанну ученики его о всём том.
      cn: 伊鄂昂之门徒以诸此传述之、
  - type: paragraph
    initial:
      ru: 'Лк 7:19. '
      cn: （路加福音 7:19）
    text:
      ru: 'Иоанн, призвав двоих из учеников своих, послал к Иисусу спросить: Ты ли Тот, Который должен прийти, или ожидать нам другого?'
      cn: 伊鄂昂召其门徒中之二、遣就伊伊稣斯曰、降来者系尔乎、我侪抑望他人耶、
  - type: paragraph
    text:
      ru: 'Слух о чуде, совершенном в Наине, разнесся по всей Иудее и окрестной стране. Дошел он и до учеников Иоанновых. При похвалах Господу они, как еще несовершенные, досадовали. Поэтому Иоанн, желая показать им величие Христа и то, насколько он (Иоанн) отстоит от Него (Христа), устрояет следующее: не делает ученикам никакого отзыва об Иисусе, а, представляясь незнающим, посылает их, чтобы они, увидев чудеса, из самых дел уверовали, что весьма велико расстояние между Господом – Иисусом и рабом – Иоанном. Ибо не думай, будто Иоанн действительно не знал о Христе и потому послал учеников своих с вопросом. Он еще прежде рождения, в утробе матери, взыграл, как познавший Его и на Иордане свидетельствовал о Нем, как о Сыне Божием.'
      cn: 关于在拿因所行的神迹的传闻，传遍了整个犹太地和周围的地区。这个传闻也传到了伊鄂昂的门徒耳中。当人们赞美主时，他们因为仍不完全，所以感到恼怒。因此，伊鄂昂渴望向他们展示基督的伟大，以及他（伊鄂昂）与祂（基督）之间的差距有多大，于是安排了以下的事情：他没有对门徒发表任何关于伊稣斯的评论，而是假装自己毫不知情，派遣他们前去，好让他们通过亲眼目睹神迹，从这些作为本身中确信，主——伊稣斯与仆人——伊鄂昂之间的距离是何其遥远。因为，你切莫以为伊鄂昂是真的不认识基督，所以才派遣他的门徒带着疑问前去。他早在出生之前，在他母亲的子宫里就已经欢腾雀跃，如同认识祂一般，并且在约旦河边也为祂作见证，称祂为神的儿子。
  - type: paragraph
    initial:
      ru: 'Лк 7:20. '
      cn: （路加福音 7:20）
    text:
      ru: 'Они, придя кИисусу,сказали: Иоанн Креститель послал нас к Тебе спросить: Ты ли Тот, Которому должно придти, или другого ожидать нам?'
      cn: 来就之者告曰、授洗者伊鄂昂遣我等就尔云、降来者系尔乎、我侪抑望他人耶、
  - type: paragraph
    text:
      ru: 'Итак, он посылает учеников, повелевая им спросить Иисуса:«Ты ли Тот, Которому должно придти?». Видишь ли, как глубоко Иоанн ведет учеников к вере, что Иисус есть Бог? Ибо пророки называются«посланными», и сам Иоанн, как говорит евангелист, был человек«посланный»от Бога (Ин. 1, 6). А Господь – Грядущий, ибо Он пришел с властью, а не против воли. И так говорит: Ты ли Тот, Чьего пришествия в мир ожидают?'
      cn: 因此，他差遣门徒，命令他们去问耶稣：「你就是那位当来者吗？」你看到了吗，伊鄂昂是如何深刻地引导门徒们相信耶稣就是上帝？因为众先知被称为「被差遣者」，而伊鄂昂本人，正如福音书作者所言，是「由上帝所差遣」的人（伊鄂昂福音 1:6）。而主则是那「将要来临者」（Gospod』 – Griadushchiy），因为他带着权柄而非违背意志而来。因此，他是说：你就是那位，世人期待他降临的那位吗？
  - type: paragraph
    initial:
      ru: 'Лк 7:21. '
      cn: （路加福音 7:21）
    text:
      ru: А в это время Он многих исцелил от болезней и недугов и от злых духов, и многим слепым даровал зрение.
      cn: 于其时、彼医多人、脱诸疾病伤痕及恶神者、且赐多瞽者得明、
  - type: paragraph
    initial:
      ru: 'Лк 7:22. '
      cn: （路加福音 7:22）
    text:
      ru: 'И сказал им Иисус в ответ: пойдите, скажите Иоанну, что́ вы видели и слышали: слепые прозревают, хромые ходят, прокаженные очищаются, глухие слышат, мертвые воскресают, нищие благовествуют;'
      cn: 伊伊稣斯答之曰、往告伊鄂昂、以尔所见所闻者、即瞽者明、跛者行、癞者洁、聋者听、死者起、贫者福音、
  - type: paragraph
    text:
      ru: 'Иные под словами:«Которому должно придти»разумеют сошествие в ад, как бы так было сказано: Ты ли имеешь придти и в ад? Что же Господь? Зная, с каким намерением Иоанн послал учеников, именно: чтоб они увидели дела Его и от них пришли к вере, Он говорит посланным: возвестите, что видите. Потом перечисляет чудесные действия, о которых и пророками предвозвещено. Ибо слова:«Тогда откроются глаза слепых, и уши глухих отверзутся. Тогда хромой вскочит, как олень, и язык немого будет петь»есть и у Исаии (Ис. 35, 5–6).'
      cn: '另一些人认为，「那位将要来者」这句话指的是降入阴间，仿佛是在说：「你难道也要降入阴间吗？」


        主（耶稣）是如何回应的呢？祂深知约安派遣门徒的用意，即是要他们亲眼目睹祂的作为，并借此而达到信的境地。祂就对被派遣来的门徒说：把你们所看见的都回去禀告。接着，祂历数了那些奇妙的作为，而这些作为早已由众先知所预言。因为「那时，瞎子的眼睛必睁开；聋子的耳朵必开通。那时，瘸子必跳跃像鹿；哑巴的舌头必欢呼歌唱」这些话语在伊萨伊亚书（伊萨伊亚书 35:5–6）中也曾出现。'
  - type: paragraph
    initial:
      ru: 'Лк 7:23. '
      cn: （路加福音 7:23）
    text:
      ru: и блажен, кто не соблазнится о Мне!
      cn: 凡人不疑惑我者、福矣、
  - type: paragraph
    text:
      ru: 'Потом говорит:«и блажен, кто не соблазнится о Мне», как бы так говоря им: и вы блаженны, если не соблазнитесь о Мне.'
      cn: 随后，祂说：「凡人不疑惑我者、福矣。」（路加福音 7:23），祂仿佛是对他们如此说道：你们若不因我而跌倒（或疑惑），你们也就蒙福了。
  - type: paragraph
    initial:
      ru: 'Лк 7:24. '
      cn: （路加福音 7:24）
    text:
      ru: 'По отшествии же посланных Иоанном, начал говорить к народу об Иоанне: что́ смотреть ходили вы в пустыню? трость ли, ветром колеблемую?'
      cn: 伊鄂昂之门徒去后、彼向民为伊鄂昂言起曰、尔等常出旷野欲何观耶、为风所动之苇乎、
  - type: paragraph
    text:
      ru: 'Поскольку многие легко могли соблазниться об Иоанне, как он прежде столь много свидетельствовал о Христе, а теперь послал с вопросом:«Ты ли Тот, Которому должно придти?»– поэтому Христос говорит народу: ничего подобного не подозревайте об Иоанне. Он – не трость, чтобы склоняться то на ту сторону, то на другую, и чтобы в одно время свидетельствовать обо Мне, а в другое – не знать Меня. Ибо если б он был таков, тогда для чего бы вышли вы в пустыню смотреть его?'
      cn: '由于许多人很容易对伊鄂昂产生疑虑（鉴于他先前曾如此多地为基督作见证，而现在却派人来问：「你就是那位将要来的人吗？」），因此基督对民众说：你们不要对伊鄂昂抱有任何类似的猜疑。


        他不是一根芦苇，会一会儿倾向这边，一会儿倾向那边；以致于一时为我作见证，而另一时却不认识我。因为如果他真是那样的人，那么你们当初为何要出到旷野去观看他呢？'
  - type: paragraph
    initial:
      ru: 'Лк 7:25. '
      cn: （路加福音 7:25）
    text:
      ru: Что́ же смотреть ходили вы? человека ли, одетого в мягкие одежды? Но одевающиеся пышно и роскошно живущие находятся при дворах царских.
      cn: 乃常出欲何观乎、服绵软衣者乎、夫美衣奢华在王宫也、
  - type: paragraph
    text:
      ru: Он отнюдь не растлил ума своего чувственными наслаждениями, ибо одежда его показывает, что он выше всякого наслаждения; притом он жил бы в палатах, если бы любил удовольствия.
      cn: 他绝没有被感官的愉悦败坏他的心智，因为他的衣着表明他超越了一切享乐；况且，如果他喜爱欢愉，他就会住在宫殿里。
  - type: paragraph
    initial:
      ru: 'Лк 7:26. '
      cn: （路加福音 7:26）
    text:
      ru: Что́ же смотреть ходили вы? пророка ли? Да, говорю вам, и больше пророка.
      cn: 然则常出欲何观耶、先知乎、诚哉、我告尔等、彼较先知超绝也、
  - type: paragraph
    initial:
      ru: 'Лк 7:27. '
      cn: （路加福音 7:27）
    text:
      ru: 'Сей есть, о котором написано: вот, Я посылаю Ангела Моего пред лицем Твоим, который приготовит путь Твой пред Тобою.'
      cn: 盖此即为伊载者云、顾我遣我之天神在尔面前、于尔前修尔路、
  - type: paragraph
    text:
      ru: Но вы сами почитаете его за пророка? Истинно«говорю вам,что они больше пророка». Ибо другие пророки только предсказывали о Христе, а он видел Его и указал, говоря:«вот Агнец Божий»(Ин. 1, 29, 36); притом другие пророки пророчествовали после того, как уже вышли из утробы своих матерей, а он узнал Господа и взыграл еще прежде, чем вышел из утробы. Потом приводит свидетельство:«вот, Я посылаю Ангела Моего»(Мал. 3, 1). Иоанн назван«Ангелом», быть может и потому, что жизнь его почти бесплотная и ангельская, а быть может и потому, что он возвестил пришествие Спасителя.
      cn: 但你们自己是否尊他为先知呢？我实在「告诉你们，他比先知大多了」。因为其他的先知仅仅是预言基督，而他（伊鄂昂）却看见了祂，并指明说：「看哪，神的羔羊」（伊鄂昂福音 1:29, 36）。此外，其他的先知是在离开了母腹之后才开始说预言，而他（伊鄂昂）甚至在出母腹之前就认出了主并欢跃了。接着，（基督）引用了见证：「看哪，我差遣我的使者」（玛拉基书 3:1）。伊鄂昂被称为「使者」（Ангел，即天使），或许是因为他的生活几乎是无肉体（非肉身）的、天使般的；又或许是因为他宣告了救主的降临。
  - type: paragraph
    initial:
      ru: 'Лк 7:28. '
      cn: （路加福音 7:28）
    text:
      ru: 'Ибо говорю вам: из рожденных женами нет ни одного пророка больше Иоанна Крестителя; но меньший в Царствии Божием больше его.'
      cn: 盖我告尔等、在妇所生者中、未有大于授洗伊鄂昂者、然在上帝之国至小者较彼为大、
  - type: paragraph
    initial:
      ru: 'Лк 7:29. '
      cn: （路加福音 7:29）
    text:
      ru: И весь народ, слушавшийЕго,и мытари воздали славу Богу, крестившись крещением Иоанновым;
      cn: 凡听之民及税吏彰义上帝、受伊鄂昂之洗、
  - type: paragraph
    initial:
      ru: 'Лк 7:30. '
      cn: （路加福音 7:30）
    text:
      ru: а фарисеи и законники отвергли волю Божию о себе, не крестившись от него.
      cn: 惟发利些乙人及教授师等于已拒绝上帝之旨、而未由之受洗、
  - type: paragraph
    text:
      ru: '«Говорю вам: из рожденных женами нет ни одного пророка больше Иоанна». Предтечу поставляет выше всех других. Потом как бы кто сказал: «И Тебя Самого, Христос, Иоанн больше»? прибавляет: а Я, меньший его, больше в Царстве Небесном; ибо хотя Меня считают меньшим его и по благородству, и по возрасту, и по славе, однако ж, в Царстве Небесном, то есть во всем Божественном и духовном, Я больше его. Итак, все люди, которые послушали Иоанна, оправдали Бога, то есть почтили Бога тем, что приняли Его пророка. А фарисеи не почтили Бога, поскольку не приняли Иоанна.'
      cn: 「我告诉你们：凡妇人所生的，没有一个先知大过施洗伊鄂昂的。」 他将前驱置于所有其他人之上。然后，仿佛有人说：「基督，甚至你本人，伊鄂昂也比你大吗？」 他补充说：而我，比他卑微的，在天国里却更大；因为虽然人们认为我比他小/卑微，无论是论出身、论年龄还是论名声，然而，在天国里，也就是说在一切神圣和属灵的事上，我比他更大。因此，所有听从伊鄂昂的人，都称上帝为义，也就是说，他们因着接纳了祂的先知而尊崇了上帝。而发利些乙人则没有尊崇上帝，因为他们没有接纳伊鄂昂。
  - type: paragraph
    text:
      ru: 'Некоторые иначе понимали слова:«из рожденных женами»; именно: хорошо сказал Господь:«из рожденных женами», исключая таким образом Себя. Ибо Он родился от Девы, а не от жены, то есть не от замужней женщины.'
      cn: 一些人对「在妇人所生的中间」这句话有不同的理解；确切地说：主说得好：「在妇人所生的中间」，以此将自己排除在外。因为祂是由童女所生，而非由妇人所生，也就是说，不是由已婚妇人所生。
  - type: paragraph
    text:
      ru: 'Иначе понимали и выражение«меньший в Царствии Божием»; именно: меньший в жизни христианской есть больше праведного по Закону. Например, Иоанн непорочен по праведности законной. Но если кто крещен и не сделал еще ничего ни доброго, ни злого, то он хотя весьма мал в Царстве Небесном, то есть в проповеди христианской, больше, однако ж, некрещеного, хотя бы праведного по Закону. И иначе: поскольку Иоанн, хотя почти бесплотен и невеществен, однако ж, находится еще во плоти, то самый малый в воскресении, которое называет Царством Небесным, больше его. Ибо тогда, получив совершенное нетление, мы не будем уже поступать по-плотскому, и малый тогда – больше праведного теперь, но еще носящего плоть.'
      cn: '还有一种对「天国中的最小者」的理解；确切地说：在基督教生活中最小的人，也比按律法称义的人更大。


        例如，伊鄂昂在律法的义上是无可指摘的。但是，如果有人受了洗，却还没有做任何或善或恶的事，那么他虽然在天国，即在基督教的宣讲中，是微不足道的，但仍比未受洗者，即便是按律法称义的人，要大。


        还有另一种理解：既然伊鄂昂，虽然他几乎是无形质和非物质的，但仍处于肉体之中，那么在复活中，即他称之为天国的，最小的那位也比他更大。因为届时，我们获得了全然的不朽坏，我们将不再按照肉体的方式行事，那时最小的人，也比现在称义但仍带着肉体的人更大。'
  - type: paragraph
    initial:
      ru: 'Лк 7:31. '
      cn: （路加福音 7:31）
    text:
      ru: 'Тогда Господь сказал: с кем сравню людей рода сего? и кому они подобны?'
      cn: 〇主曰、我以谁譬斯世、彼等似谁乎、
  - type: paragraph
    initial:
      ru: 'Лк 7:32. '
      cn: （路加福音 7:32）
    text:
      ru: 'Они подобны детям, которые сидят на улице, кличут друг друга и говорят: мы играли вам на свирели, и вы не плясали; мы пели вам плачевные песни, и вы не плакали.'
      cn: 譬如童子坐于街市、互相呼曰、我侪常予尔等吹籥、而尔等不跃、我侪常予尔等唱悲歌、而尔等不哭、
  - type: paragraph
    text:
      ru: 'У иудеев был род некоторой игры такой: большое число детей разделялось на две части, и, как бы в насмешку над жизнью, одни на одной стороне плакали, а другие на другой играли на свирели, и ни играющие не соглашались с плачущими, ни плачущие – с играющими.'
      cn: 在犹太人那里，曾有一种类似于这样的游戏：许多孩童分成两部分，仿佛是在嘲弄生活（life）一样，一侧的孩童哭泣，而另一侧的孩童则吹奏笛子。玩乐的孩童不与哭泣的孩童保持一致，哭泣的孩童也不与玩乐的孩童保持一致。
  - type: paragraph
    initial:
      ru: 'Лк 7:33. '
      cn: （路加福音 7:33）
    text:
      ru: 'Ибо пришел Иоанн Креститель: ни хлеба не ест, ни вина не пьет; и говорите: в нем бес.'
      cn: 盖授洗者伊鄂昂至、不食饼不饮酒、尔等曰、其被魔所附、
  - type: paragraph
    initial:
      ru: 'Лк 7:34. '
      cn: （路加福音 7:34）
    text:
      ru: 'Пришел Сын Человеческий: ест и пьет; и говорите: вот человек, который любит есть и пить вино, друг мытарям и грешникам.'
      cn: 人子至食且饮、尔等曰、顾此人嗜食饮酒、为税吏及罪人之友、
  - type: paragraph
    initial:
      ru: 'Лк 7:35. '
      cn: （路加福音 7:35）
    text:
      ru: И оправдана премудрость всеми чадами ее.
      cn: 睿智被其童子以为义、
  - type: paragraph
    text:
      ru: Господь и фарисеев представляет делающими нечто подобное. Ибо ни с Иоанном, ведущим плачевную жизнь и вводящим покаяние, не скорбели и не подражали ему, ни Иисусу, показывающему приятную жизнь, не повиновались и не соглашались с Ним, но от обоих отстранили себя, не оказав сочувствия ни Иоанну плачущему, ни Иисусу играющему и отпускающему. И наконец мудрость Божия оправдалась, то есть почтена не фарисеями, но ее чадами, то есть принявшими учение Иоанново и Иисусово.
      cn: 主亦展示出法利赛人行了某种类似之事。因为他们既不曾与引领忧戚生活并引入悔改的伊鄂昂一同哀恸或效仿他，也不曾顺服并同意展示愉悦生活的耶稣，而是将自己与两者皆隔绝开来，既未对哀哭的伊鄂昂表达同情，也未对嬉戏并释放罪孽的耶稣表达同情。最终，上帝的智慧被称义了，即，它并非被法利赛人所敬重，而是被它的童子所敬重，也就是说，被接受了伊鄂昂和耶稣教导的人所敬重。
  - type: paragraph
    initial:
      ru: 'Лк 7:36. '
      cn: （路加福音 7:36）
    text:
      ru: Некто из фарисеев просил Его вкусить с ним пищи; и Он, войдя в дом фарисея, возлег.
      cn: 〇有发利些乙人请彼共食、彼入发利些乙之家席坐、
  - type: paragraph
    text:
      ru: Этот фарисей, позвавший Господа, кажется, был неправых мыслей, но хитрый и полный лицемерия. Говорит:«если бы Он был пророк»(Лк. 7, 39); очевидно, он не веровал, когда так говорил. Господь хотя и знает его непрямоту, однако ж, идет к нему и обедает с ним, конечно, нас через это научая вести себя просто и прямо даже с теми, кои по отношению к нам коварны.
      cn: 这位邀请主的法利赛人，看起来思想不正，为人狡猾且充满虚伪。他说道：「若是祂是先知」（路加福音 7:39）；显然，当他如此说话时，他并不相信。主虽然知晓他的不正直，却依然去了他那里，并与他一同进食。当然，祂籍此教导我们，即使是对于那些对待我们心怀诡诈的人，我们也要行为简单而正直。
  - type: paragraph
    initial:
      ru: 'Лк 7:37. '
      cn: （路加福音 7:37）
    text:
      ru: И вот, женщина того города, которая была грешница, узнав, что Он возлежит в доме фарисея, принесла алавастровый сосуд с миром
      cn: 而顾城内一妇、其是罪人知彼席坐于发利些乙之家、携玉瓶盛香膏、
  - type: paragraph
    initial:
      ru: 'Лк 7:38. '
      cn: （路加福音 7:38）
    text:
      ru: и, став позади у ног Его и плача, начала обливать ноги Его слезами и отирать волосами головы своей, и целовала ноги Его, и мазала миром.
      cn: 立后于其足下、而哭、以泪濡其足、以其首之发拭之、且口亲其足、傅以香膏、
  - type: paragraph
    text:
      ru: 'Многих занимает вопрос: сколько было жен, помазавших Господа миром? Одни говорят, что их было две: одна – упоминаемая в Евангелии от Иоанна, сестра Лазаря (Ин. 12, 3), и другая – та, о которой упоминают евангелисты Матфей (Мф. 26, 6–7) и Марк (Мк. 14, 3), и в настоящем месте Лука. Но я верю тем, кои говорят, что их (жен, помазавших Господа миром) было три: одна – сестра Лазаря, упоминаемая у Иоанна, помазавшая Господа за шесть дней до Пасхи, другая, – упоминаемая у Матфея и Марка, помазавшая за два дня до Пасхи, и третья – сия, упоминаемая теперь Лукой, помазавшая Господа в средине евангельской проповеди. И ничего нет странного, что она сделала это еще прежде, чем настало время страдания, а те сделали то же самое близ времени страдания, из подражания ей или по другому побуждению.'
      cn: 许多人被这个问题困扰：究竟有多少位用香膏膏抹主（基督）的妇人？有些人说她们有两位：一位是《伊鄂昂福音》中提及的拉撒路的姊妹（伊鄂昂福音 12:3），另一位是福音书作者马太（马太福音 26:6-7）、马可（马可福音 14:3）以及在此处提到的路加所提及的那位。但我相信那些说她们（用香膏膏抹主的妇人）有三位的人：一位是伊鄂昂福音中提及的拉撒路的姊妹，她在逾越节前六日膏抹了主；另一位是马太和马可福音中提及的，她在逾越节前两日膏抹了主；第三位就是路加现在所提及的这位，她在福音宣讲的中期膏抹了主。她甚至在受难的时刻到来之前就做了这件事，而那两位则在临近受难之时做了同样的事情——这或出于对她的效仿，或出于其他动因——这并无任何怪异之处。
  - type: paragraph
    initial:
      ru: 'Лк 7:39. '
      cn: （路加福音 7:39）
    text:
      ru: 'Видя это, фарисей, пригласивший Его, сказал сам в себе: если бы Он был пророк, то знал бы, кто и какая женщина прикасается к Нему, ибо она грешница.'
      cn: 延彼之发利些乙见此、于其内自曰、此若为先知、必知扪之者为谁、为何如之妇、盖其乃罪人也、
  - type: paragraph
    text:
      ru: Если упоминаемый у Матфея фарисей, позвавший Господа, назван Симоном, как и у Луки, то что удивительного в совпадении имен? Поскольку тот, о котором говорит Матфей, был прокаженный, а сей (у Луки) – нет; тот по исцелении от проказы пригласил Господа в знак благодарности, а сей не был прокаженным и не высказывал благодарности; тот ничего не говорит, а сей ропщет и осуждает в одно время Иисуса и жену сию как грешницу, а Того как человеколюбца. О, безумие! Человек поистине фарисей.
      cn: 倘若马太福音中提及的、邀请了主的法利赛人也被称作西门，正如路加福音中那样，那么名字上的巧合又有何可惊奇的呢？因为马太福音中所说的那个西门是麻风病人，而这个（路加福音中的）西门则不是；那个西门在麻风病得以治愈后，为表感恩而邀请了主，而这个西门则未曾患麻风病，也未曾表达感谢；那个西门什么都没说，而这个西门却同时埋怨、论断了耶稣和这位妇人——认为妇人是罪人，而耶稣是爱罪人的（人）。哦，何等愚昧！此人确确实实是个法利赛人。
  - type: paragraph
    initial:
      ru: 'Лк 7:40. '
      cn: （路加福音 7:40）
    text:
      ru: 'Обратившись к нему, Иисус сказал: Симон! Я имею нечто сказать тебе. Он говорит: скажи, Учитель.'
      cn: 伊伊稣斯答之曰、锡孟欤、我有一言问尔、伊答、师欤、言哉、
  - type: paragraph
    initial:
      ru: 'Лк 7:41. '
      cn: （路加福音 7:41）
    text:
      ru: 'Иисус сказал: у одного заимодавца было два должника: один должен был пятьсот динариев, а другой пятьдесят,'
      cn: 伊伊稣斯曰、某债主有二负债者、一欠银五百底拿利乙、其他欠五十底拿利乙、
  - type: paragraph
    initial:
      ru: 'Лк 7:42. '
      cn: （路加福音 7:42）
    text:
      ru: но как они не имели чем заплатить, он простил обоим. Скажи же, который из них более возлюбит его?
      cn: 因其无所偿、彼免二人、言哉、二人中爱之、谁甚、
  - type: paragraph
    initial:
      ru: 'Лк 7:43. '
      cn: （路加福音 7:43）
    text:
      ru: 'Симон отвечал: думаю, тот, которому более простил. Он сказал ему: правильно ты рассудил.'
      cn: 锡孟对曰、我想免多者、彼向之曰、尔议正也、
  - type: paragraph
    text:
      ru: Но Господь, спрашивая его притчами и выводя на средину двоих должников, незаметным образом высказывает, что и он есть должник, хотя и считающий себя меньше должным, но все-таки должник. Итак, ни ты, должный меньшим, не можешь отдать долг (ибо, одержимый гордостью, ты не имеешь исповедания), ни жена не может. Поэтому обоим будет отпущено. И кто возлюбит более? Без сомнения, тот, кому много отпущено. Сказав это, Он заграждает уста гордеца.
      cn: 但是主，用比喻问他，并把两个债务人引到当中，以不易察觉的方式表明，他（指西门）也是个债务人，尽管自认为负债较少，但终究还是个债务人。故此，负债较少的你，既不能偿还债务（因为你被骄傲所掌控，就没有认信），那妇人也不能（偿还）。因此，两人都会得蒙赦免。谁会爱得更多呢？毫无疑问，就是那个得蒙多赦免的人。说了这话，祂就封住了那骄傲者的口。
  - type: paragraph
    initial:
      ru: 'Лк 7:44. '
      cn: （路加福音 7:44）
    text:
      ru: 'И, обратившись к женщине, сказал Симону: видишь ли ты эту женщину? Я пришел в дом твой, и ты воды Мне на ноги не дал, а она слезами облила Мне ноги и волосами головы своей отёрла;'
      cn: 彼转顾其妇、向锡孟曰、尔见此妇乎、我入尔家、尔未曾以水洗我足、然彼以泪濡我足、以其首之发拭之、
  - type: paragraph
    initial:
      ru: 'Лк 7:45. '
      cn: （路加福音 7:45）
    text:
      ru: ты целования Мне не дал, а она, с тех пор как Я пришел, не перестает целовать у Меня ноги;
      cn: 尔未曾与我亲口、然彼自我入之时、口亲我足不止、
  - type: paragraph
    initial:
      ru: 'Лк 7:46. '
      cn: （路加福音 7:46）
    text:
      ru: ты головы Мне маслом не помазал, а она миром помазала Мне ноги.
      cn: 尔未曾以油傅我首、然彼曾以香膏傅我足、
  - type: paragraph
    initial:
      ru: 'Лк 7:47. '
      cn: （路加福音 7:47）
    text:
      ru: 'А потому сказываю тебе: прощаются грехи её многие за то, что она возлюбила много, а кому мало прощается, тот мало любит.'
      cn: 缘此我告尔等、其罪赦免之多、因其爱多也、见赦少者、其爱亦少也、
  - type: paragraph
    text:
      ru: 'Господь обнаруживает в Симоне гордеца и безумца: гордеца, потому что он, сам будучи человеком, осудил человека за грехи; – безумца, поскольку не уразумел, что жену, которая явила такие знаки веры и любви, нужно было принять, а не отвергнуть. Поэтому Господь и обличает его в том, что он напрасно осудил жену, которая сделала столько, сколько сам он не сделал, не сделал даже гораздо низшего в сравнении с ней. Ты, например, не дал и воды на ноги, что самое обыкновенное дело, а она слезами омыла их; ты не облобызал Меня и в лицо, а она облобызала Мои ноги; ты не вылил и елея, а она возлила миро. Поскольку ты сказал, что Я – не пророк, так как Я не различил, что она – грешница, то вот Я обличаю помышления твоего сердца, чтобы ты знал, что Я знаю как сокрытое в тебе, так еще более знаю относящееся до нее, что знают и многие другие. Итак, отпущаются грехи ее, потому что«она.. много... возлюбила», то есть обнаружила великую веру.'
      cn: 主揭示出西门乃是傲慢者与愚昧者：称其为傲慢者，乃因他自己同为人，却论断了另一个因罪而犯错的人；称其为愚昧者，乃因他未曾明白，这位展现出如此信仰与爱之标记的妇人，本应被接纳，而非被摒弃。因此，主斥责了他，因他枉然地论断了这位做了如此多事、甚至他自己都未曾做到之人，他甚至没有做到与她相比低得多之事。例如，你没有为我的脚提供水，这本是最平常之事，而她却用泪水洗涤了它们；你甚至没有亲吻我的脸，而她却亲吻了我的脚；你甚至没有倒油（为我抹脚），而她却倾倒了没药。既然你说我不是先知，因为我没有分辨出她是个罪人，那么现在我就要斥责你心中的意念，好叫你知道我知晓你内里所隐藏的，更知晓与她相关之事，许多其他人也知晓这些。因此，她的罪孽得以赦免，因为「她……多……爱了」，也就是说，她展现出了伟大的信心。
  - type: paragraph
    initial:
      ru: 'Лк 7:48. '
      cn: （路加福音 7:48）
    text:
      ru: 'Ей же сказал: прощаются тебе грехи.'
      cn: 乃向彼曰、尔罪赦矣、
  - type: paragraph
    initial:
      ru: 'Лк 7:49. '
      cn: （路加福音 7:49）
    text:
      ru: 'И возлежавшие с Ним начали говорить про себя: кто это, что и грехи прощает?'
      cn: 偕彼共席者于其内自曰、此何人亦赦罪乎、
  - type: paragraph
    initial:
      ru: 'Лк 7:50. '
      cn: （路加福音 7:50）
    text:
      ru: 'Он же сказал женщине: вера твоя спасла тебя, иди с миром.'
      cn: 彼向妇曰、尔信救尔矣、于安和宜往、
  - type: paragraph
    text:
      ru: '«Возлежащие с Ним»,и притом ропотники, не сообразили, что сказанное Им к Симону очень прилично идет и к ним. Господь, усмиряя ропот их и желая показать им, что всякого спасает вера его, не сказал: жена, Я тебя спасаю, – чтобы они не воскипели большей завистью, но:«вера твоя». Это сказал Он, как я уже заметил, частью для того, чтобы успокоить зависть их, а частью для того, чтобы ввести их в веру, дав им знать, что вера, именно она, спасает.«Иди с миром», то есть в праведности. Ибо праведность есть мир с Богом, подобно как грех – вражда на Бога. Смотри: отпустив ей грехи, Господь не оставил ее только с отпущением грехов, но придал и производительную силу добра. Ибо слова:«иди с миром»ты должен разуметь так: ступай, делай то, что возвратит тебе мир с Богом.'
      cn: 《与祂同席者》，并且他们是发怨言的人，没有领悟到祂对西门所说的话也非常恰当地适用于他们。主平息他们的怨言，并想向他们表明，是各人的信心拯救了他，祂没有说：妇人，是我拯救了你，——以免他们燃起更大的嫉妒，而是说：「你的信」。正如我已经指出的，祂说此话，部分是为了平息他们的嫉妒，部分是为了引导他们进入信仰，让他们知道，正是信仰，它自己，施行拯救。「于安和宜往」（路加福音 7:50），即在公义之中。因为公义是与神同享的平安，正如罪恶是与神为敌的仇恨。看哪：在赦免了她的罪之后，主没有仅仅让她带着罪得赦免，而是还赋予了她生发良善的力量。因为「于安和宜往」这句话，你应当这样理解：去吧，去做那能使你与神恢复平安的事情。
- type: heading1
  text:
    ru: Глава восьмая.
    cn: 第八章。
  children:
  - type: paragraph
    initial:
      ru: 'Лк 8:1. '
      cn: （路加福音 8:1）
    text:
      ru: После сего Он проходил по городам и селениям, проповедуя и благовествуя Царствие Божие, и с Ним двенадцать,
      cn: 〇厥后、彼周行各城各村、传上帝国福音、十二者亦偕之、
  - type: paragraph
    text:
      ru: Сойдя с неба за тем, чтобы во всем представить нам Собой образец и предначертание, Господь научает нас не лениться в обучении, но обходить по всем местам и проповедовать; ибо, что Он ни делал, делал для наставления нашего. Он проходил по всем городам и селениям и водил с Собой двенадцать учеников, которые не учили, не проповедовали, но сами от Него учились и назидались делами Его и словами Его.
      cn: 主从天而降，旨在于一切事上以祂自己向我们呈现出榜样与预定（prednacheraniye），祂教导我们在学习上不要懈怠，而要遍行各处并宣讲；因为，凡祂所行的，都是为了训诲我们。祂周行各城各村，并带着十二位门徒，他们并没有教导，也没有宣讲，而是自己从祂那里学习，并藉着祂的作为和祂的言语受教益。
  - type: paragraph
    text:
      ru: Господь проповедовал не о земных благах, но о Царстве Небесном. Ибо кому иному было приличнее проповедовать о небесном, как не Приходящему с неба? Поэтому-то ни один из пророков не проповедовал о Царстве Небесном. Ибо как бы они стали проповедовать о том, чего не видали? Поэтому-то и Предтеча говорил:«сущий от земли... и говорит, как сущий от земли», а«Приходящий с небес,... что... видел,... о том и свидетельствует»(Ин. 3, 31, 32).
      cn: 主传讲的并非地上的福佑，而是关于天国。因为，对于一位从天而降者，还有谁更适宜传讲天上的事呢？因此之故，先知中没有一人传讲过天国。因为他们怎能传讲自己未曾见过的东西呢？因此之故，连先驱者（施洗伊鄂昂）也说：「属乎地的……也讲论属乎地的事」，而「从天上来的是……他所看见的……就作见证」（约翰福音 3:31，32）。
  - type: paragraph
    initial:
      ru: 'Лк 8:2. '
      cn: （路加福音 8:2）
    text:
      ru: 'и некоторые женщины, которых Он исцелил от злых духов и болезней: Мария, называемая Магдалиною, из которой вышли семь бесов,'
      cn: 亦有数妇曾得愈脱离恶神及疾病者、称玛格达剌之玛利亚、由此曾出七魔鬼、
  - type: paragraph
    initial:
      ru: 'Лк 8:3. '
      cn: （路加福音 8:3）
    text:
      ru: и Иоанна, жена Хузы, домоправителя Иродова, и Сусанна, и многие другие, которые служили Ему имением своим.
      cn: 又有伊罗德家宰胡咂之妻伊鄂昂那、及苏桑那与他多者、皆以己产业事奉之、
  - type: paragraph
    text:
      ru: За Господом следовали и жены, чтобы мы знали, что и женскому полу слабость не препятствует последовать Христу. Смотри и на то, как они, будучи богатыми, презрели, однако же все и избрали нищету ради Христа и со Христом. А что они были богаты, познай из того, что они служили Господу имением«своим»а не чужим или несправедливо приобретенным достоянием, как многие делают.
      cn: '主后面跟着一些妇女，为要让我们知道，软弱的女性之属（женскому полу слабость）也不能阻止她们跟随基督。


        也要留意，她们虽然富有，却轻蔑（презрели）了一切，为基督的缘故、并与基督一同选择了贫乏（нищету）。


        至于她们是富有的，从以下事实就可得知：她们是用「自己的」财产侍奉主，而不是用别人的，也不是用像许多人那样以不义手段获得的家产（достоянием）。'
  - type: paragraph
    text:
      ru: 'В словах:«из которой вышли семь бесов»некоторые число«семь»принимают неопределенно, вместо: «много», ибо в Писании число семь часто принимается вместо: «много». Иной, быть может, скажет: как семь есть духов добродетели, так, напротив, семь же и духов злобы, например: есть дух страха Божия, есть, с противной стороны, дух бесстрашия Божия; есть дух разумения, есть, с противной стороны, дух неразумия, и так далее. Если эти семь духов злобы не будут прогнаны от души, никто не может последовать Христу. Ибо прежде должно сатану изгнать, а потом Христа вселить.'
      cn: 在「从她身上曾有七个鬼魔出来」这句话中，有人将「七」这个数字视为不确定的，意即「很多」，因为在圣经中，数字「七」经常用来指代「多」。或许有人会说：正如存在着七种美德之灵一样，在反面，也存在着七种邪恶之灵，例如：有敬畏上帝之灵，在对立面，则有不敬畏上帝之灵；有理智之灵，在对立面，则有愚昧之灵，等等。如果这七种邪恶之灵不被从灵魂中驱逐出去，没有人能够跟随基督。因为首先必须驱逐撒但，然后才能让基督居于其中。
  - type: paragraph
    initial:
      ru: 'Лк 8:4. '
      cn: （路加福音 8:4）
    text:
      ru: 'Когда же собралось множество народа, и из всех городов жители сходились к Нему, Он начал говорить притчею:'
      cn: 多民由各城集就之时、彼设譬喻曰、
  - type: paragraph
    text:
      ru: 'Ныне сбылось то, что давно сказал Давид от лица Христова.«Открою», – сказал он, –«уста мои в притче»(Пс. 77, 2). Господь притчами говорил по многим целям, именно: чтобы слушателей сделать более внимательными и возбудить ум их к исследованию того, о чем говорится (ибо мы, люди, обыкновенно более занимаемся прикровенными речами, и на ясные мало обращаем внимания), и чтобы недостойные не поняли того, что говорится таинственно; и по многим другим побуждениям говорит Он притчами.'
      cn: 现今，那大卫许久以前以基督之名所说的话应验了。「我要开口」，他说，「用比喻」（诗篇 77:2）。主说比喻是出于许多目的，即：为了使听者更加专注，并激发他们的心智去考察所谈论之事（因为我们人类通常更专注于隐秘的言语，而对清晰的言语却很少关注），也是为了让不配之人不理解那以奥秘方式所说之事；祂还出于许多其他缘由说比喻。
  - type: paragraph
    initial:
      ru: 'Лк 8:5. '
      cn: （路加福音 8:5）
    text:
      ru: вышел сеятель сеять семя свое, и когда он сеял, иное упало при дороге и было потоптано, и птицы небесные поклевали его;
      cn: 〇有播种者出而播种、播时有落于道旁、乃被践蹋、有天空之鸟啄之、
  - type: paragraph
    initial:
      ru: 'Лк 8:6. '
      cn: （路加福音 8:6）
    text:
      ru: а иное упало на камень и, взойдя, засохло, потому что не имело влаги;
      cn: 有落于硗地生出即槁、因无润泽之故、
  - type: paragraph
    initial:
      ru: 'Лк 8:7. '
      cn: （路加福音 8:7）
    text:
      ru: а иное упало между тернием, и выросло терние и заглушило его;
      cn: 有落于荆棘中者、荆棘起而蔽之、
  - type: paragraph
    initial:
      ru: 'Лк 8:8. '
      cn: （路加福音 8:8）
    text:
      ru: 'а иное упало на добрую землю и, взойдя, принесло плод сторичный. Сказав сие, возгласил: кто имеет уши слышать, да слышит!'
      cn: 有落于沃壤者、生出而结实百倍、言之而呼曰、有耳得听者、宜听焉、
  - type: paragraph
    text:
      ru: '«Вышел сеятель», то есть Сын Божий.«Вышел»из недр Отца и из Своей сокровенности и сделался видимым. Кто же вышел? Тот, Кто всегда сеет. Ибо Сын Божий не перестает всегда сеять в наших душах: Он сеет в наших душах добрые семена не только тогда, когда учит, но и через мир сей, и через те явления, которые совершаются с нами и около нас. Он вышел не затем, чтобы погубить земледельцев или выжечь страну, но затем только, чтобы сеять. Ибо земледелец часто выходит не затем только, чтобы сеять, но и за другим.'
      cn: 「撒种者出去了」（Вышел сеятель），亦即是上帝之子（Сын Божий）。祂「出去了」（Вышел），离开了父的内室（недр Отца）和祂自己的隐秘性（сокровенность），而变得可见了（сделался видимым）。那么，谁出去了呢？那位时常撒种者。因为上帝之子从不停止在我们的灵魂中时常撒种：祂不仅在教导（учит）之时，而且透过此世（мир сей），以及透过那些在我们身上和我们周围所成就的现象（явления），在我们的灵魂中撒下良善的种子（добрые семена）。祂出去了，并非是为了毁灭农夫（земледельцев）或焚烧田地（выжечь страну），而单单是为了撒种。因为农夫时常出去，并非单单是为了撒种，也为了其他事情。
  - type: paragraph
    text:
      ru: 'Он«вышел... сеять семя свое». Ибо слово учения у Него было собственное, а не чужое. Пророки, например, что ни говорили, говорили не от себя, но от Духа; почему и говорили они: «это говорит Господь». А Христос имел семя Свое; почему, когда и учил, Он не говорил: «это говорит Господь», но:«Я говорю вам».'
      cn: 他「出来……撒他的种子」。因为祂教导的话语是祂自己的，而非别人的。例如，先知们所说的任何内容，都不是出于他们自己，而是出于圣灵；因此他们会说：「上主如此说」。而基督拥有祂自己的种子；因此，当祂教导时，祂不说：「上主如此说」，而是说：「我告诉你们」。
  - type: paragraph
    text:
      ru: '«Когда Он сеял», то есть учил,«иноесемяупало при дороге». Не сказал Он: сеятель бросил, но: оно«упало»; потому что сеятель сеет и учит, а слово падает в сердца слушателей. Они-то и оказываются или дорогой, или камнем, или тернием, или землей доброй.'
      cn: «当祂播种时，» 也就是说，教导时， «有些种子落在路旁。» 祂没有说：播种者丢撒了，而是说：它 «落在了»；因为播种者播种和教导，而道则落在听者的心中。听者本身就是被证明是路、或是石头、或是荆棘、或是良善的土地。
  - type: paragraph
    initial:
      ru: 'Лк 8:9. '
      cn: （路加福音 8:9）
    text:
      ru: 'Ученики же Его спросили у Него: что бы значила притча сия?'
      cn: 门徒问之曰、此譬喻何意、
  - type: paragraph
    initial:
      ru: 'Лк 8:10. '
      cn: （路加福音 8:10）
    text:
      ru: 'Он сказал: вам дано знать тайны Царствия Божия, а прочим в притчах, так что они видя не видят и слыша не разумеют.'
      cn: 彼答曰、上帝国之机密赐尔等知之、惟在他人则用譬喻、使彼等视而不见、听而不悟、
  - type: paragraph
    text:
      ru: Когда ученики спросили о притче, Господь сказал им:«вам дано знать тайны Царствия Божия», то есть вам, желающим научиться; ибо всякий просящий получает.«А прочим», недостойным таинств, они сообщаются прикровенно, и таковые кажутся видящими, но«не видят», и слышащими, но«не разумеют», и это для их же блага. Ибо Христос для того сокрыл сие от них, чтобы они, познав таинства и презрев их, не подпали большему осуждению, так как знающий и пренебрегающий достоин тягчайшего наказания.
      cn: "当门徒询问这个譬喻时，主对他们说：「上帝之国的奥秘/机密赐予你们知晓」，也就是说，赐予你们这些渴望学习的人；因为凡求的，就得着了。\n\n    「而对于其余的人」，即不配得这奥秘的人，这些奥秘是隐蔽地传达给他们的，这样的人看似「视而不见」，听似「听而不悟」，而这正是为了他们自己的益处。因为基督之所以对他们隐瞒此事，是为了避免他们知晓了这奥秘，却又藐视它们，从而遭受更大的定罪，因为知晓却又忽略的人，理当受到更严厉的惩罚。"
  - type: paragraph
    initial:
      ru: 'Лк 8:11. '
      cn: （路加福音 8:11）
    text:
      ru: 'Вот что значит притча сия: семя есть слово Божие;'
      cn: 此譬喻之意即此、种、即上帝之言也、
  - type: paragraph
    initial:
      ru: 'Лк 8:12. '
      cn: （路加福音 8:12）
    text:
      ru: а упавшее при пути, это суть слушающие, к которым пото́м приходит диавол и уносит слово из сердца их, чтобы они не уверовали и не спаслись;
      cn: 于道旁者、是听者随后魔鬼至、由其心夺言、恐其信而得救、
  - type: paragraph
    text:
      ru: Три разряда людей, кои не спасаются по этой притче. К первому относятся те, кои подобны семени, упавшему при пути, то есть совершенно не приняли учения, ибо как дорога утоптанная и избитая, не принимает семени, потому что она жестка, так и жестокосердые совершенно не принимают учения, потому что хотя они и слушают, но без внимания.
      cn: 该寓言中，有三类无法得救的人。第一类人，类似于落在路边的种子，意思是他们完全没有接受教导。因为正如被踩踏、被碾压过的道路，因其坚硬而不接受种子一样，那些心肠刚硬的人也完全不接受教导，因为他们虽然听，却是心不在焉。
  - type: paragraph
    initial:
      ru: 'Лк 8:13. '
      cn: （路加福音 8:13）
    text:
      ru: а упавшее на камень, это те, которые, когда услышат слово, с радостью принимают, но которые не имеют корня, и временем веруют, а во время искушения отпадают;
      cn: 于硗地者、是听时则喜受言、乃无根、则暂信耳、遇诱惑即背之、
  - type: paragraph
    text:
      ru: К другому относятся те, кои подобны семени, упавшему на камень, то есть те, кои хотя и приняли учение, но потом, по немощи человеческой, оказались бессильными перед искушениями.
      cn: 这段话是针对那些如同落在石头上的种子的人而言的，也就是说，那些人虽然接受了教导，但后来却因人类的软弱，在诱惑面前显得无能为力。
  - type: paragraph
    initial:
      ru: 'Лк 8:14. '
      cn: （路加福音 8:14）
    text:
      ru: а упавшее в терние, это те, которые слушают слово, но, отходя, заботами, богатством и наслаждениями житейскими подавляются и не приносят плода;
      cn: 于荆棘中者、是听者居于忧虑货财宴乐中、被蔽而不结实、
  - type: paragraph
    text:
      ru: 'Третий же разряд, – это те, кои знают учение и, однако ж, подавляются заботами житейскими. Итак, три части погибающих, а одна – спасающихся. Таким образом, спасающихся мало, а погибающих – очень много. Смотри, как Он говорит относительно подавляемых заботами житейскими: не сказал Он, что они подавляются богатством, но заботами о богатстве. Ибо не богатство вредит, а заботы о нем. Потому что многие получили пользу от богатства, раздав его на утоление голода бедных.'
      cn: 第三种类型，是那些知晓教义却被尘世的忧虑所压制的人。因此，有三部分人沉沦，而只有一部分人得救。如此说来，得救的人少，沉沦的人却非常多。看他如何论及那些被尘世忧虑所压制的人：他没有说他们是被财富所压制，而是被对财富的忧虑所压制。因为有害的不是财富，而是对财富的忧虑。因为有许多人因着施舍财富以济贫困者的饥馑，反而从财富中得益。
  - type: paragraph
    initial:
      ru: 'Лк 8:15. '
      cn: （路加福音 8:15）
    text:
      ru: 'а упавшее на добрую землю, это те, которые, услышав слово, хранят его в добром и чистом сердце и приносят плод в терпении. Сказав это, Он возгласил: кто имеет уши слышать, да слышит!'
      cn: 于沃壤者、此是听言者于良心守之、而于忍耐中结实、言之呼曰、有耳得听者、宜听焉、
  - type: paragraph
    text:
      ru: Приметь, пожалуй, и точность евангелиста, как он сказал о спасающихся:«услышав слово, хранят его». Это сказал он ради тех, кои«при пути»; ибо сии не содержат учение, но диавол уносит его у них.«И приносят плод»– это сказал Он ради тех, кои «подавляются заботами житейскими» и не выдерживают до конца, ибо таковые, то есть не носящие до конца, не приносят плода.«В терпении»– сказал ради тех, которые«на камени»; они и принимают учение, но, не устояв против нашедшего искушения, оказываются негодными. Видишь ли, как Он сказал о спасающихся:«хранят... и приносят плод в терпении»и через эти три свойства отличил их – от не содержащих, каковы те, которые«при пути», от не приносящих плода, каковы те, которые«в терниях», и от не переносящих нападшего на них искушения, каковы те, которые«на камени".
      cn: '请注意，福音派作者所述关于得救者之言语的精确性，正如他所说的：「听见道，就持守它」。他说这话是为了针对那些「在路旁」的人；因为这些人不持守教义，但魔鬼却将教义从他们那里夺去。


        「并且结果实」——他说这话是为了针对那些「被今生的忧虑所压制」而不能坚持到底的人，因为这样的人，即那些不能坚持到底的人，是不能结果实的。


        「在忍耐中」——他说这话是为了针对那些「在磐石上」的人；他们也接受教义，但未能抵御临到他们的试探，因而被证明是无用的。


        你看见了吗？他是如何论及得救者：「持守……并在忍耐中结果实」的？他通过这三种特性，将他们区别开来——区别于那些不持守的人（如同那些「在路旁」的人），区别于那些不结果实的人（如同那些「在荆棘中」的人），以及区别于那些不能忍受临到他们的试探的人（如同那些「在磐石上」的人）。'
  - type: paragraph
    initial:
      ru: 'Лк 8:16. '
      cn: （路加福音 8:16）
    text:
      ru: Никто, зажегши свечу, не покрывает ее сосудом, или не ставит под кровать, а ставит на подсвечник, чтобы входящие видели свет.
      cn: 〇未有人燃灯覆之以器、或置之床下、乃置于灯台上、为入者见其光、
  - type: paragraph
    initial:
      ru: 'Лк 8:17. '
      cn: （路加福音 8:17）
    text:
      ru: Ибо нет ничего тайного, что́ не сделалось бы явным, ни сокровенного, что́ не сделалось бы известным и не обнаружилось бы.
      cn: 盖未有隐者而不见显、未有藏者而不见露、
  - type: paragraph
    initial:
      ru: 'Лк 8:18. '
      cn: （路加福音 8:18）
    text:
      ru: 'Итак, наблюдайте, как вы слушаете: ибо, кто имеет, тому дано будет, а кто не имеет, у того отнимется и то́, что́ он думает иметь.'
      cn: 故尔等宜慎如何听、盖凡有者将予之、无有者幷其自以为有、亦将夺之、
  - type: paragraph
    text:
      ru: Здесь начало другого учения. Ибо Он обращается к ученикам и говорит это с целью наставить их быть тщательными в жизни и непрестанными подвижниками, так как все на них будут обращать взоры. Ибо на учителя и проповедника все смотрят, все наблюдают за ним, хорош ли он, или наоборот, и ничего своего он не укроет. Итак, если вы, ученики, будете внимательны и тщательны, то Бог дарует вам большую благодать; а кто не будет иметь тщательности и внимательности, тот своей небрежностью угасит и погубит тот дар от Бога, какой, по-видимому, он имеет.
      cn: 这是另一个教义的开始。因为他正在对门徒讲话，目的是教导他们要对生活保持审慎和警觉（*тщательными в жизни*），并作不懈的苦行者（*непрестанными подвижниками*），因为所有人都将注视他们。因为所有人都关注着教师和传道者，所有人都在观察他，无论他是好是坏，他都无法隐藏自己的任何事物。因此，你们这些门徒，如果你们保持警觉和审慎，那么上帝就会赐予你们更大的恩典；而那些没有警觉和审慎的人，则会因自己的疏忽而熄灭和毁坏他们看似拥有的、来自上帝的恩赐。
  - type: paragraph
    initial:
      ru: 'Лк 8:19. '
      cn: （路加福音 8:19）
    text:
      ru: И пришли к Нему Матерь и братья Его, и не могли подойти к Нему по причине народа.
      cn: 其母及兄来就之、因民之故不得近、
  - type: paragraph
    text:
      ru: Отсюда оказывается, что Христос был не вместе со Своими сродниками по плоти, но они пришли к Нему, ибо Он, оставив их, занимается духовным учительством. Так и всякий, кому вверено служение Божие, не должен ничего предпочитать ему; а должно и родителей оставлять, если они без пользы и напрасно будут препятствовать нам в деле Божием, подобно как и Господь теперь поступает.
      cn: '出自圣奥赫里德的狄奥菲拉克：


        由此可见，基督并非与祂肉身之亲属同在，而是他们来到祂跟前，因为祂撇下他们，正忙于属灵的教导之事。同样地，凡受托司奉上帝者，不应将任何事物置于其上；倘若父母徒然且无益地妨碍我们在上帝之事工中，就应当撇下他们，如同主此刻所行的一样。'
  - type: paragraph
    initial:
      ru: 'Лк 8:20. '
      cn: （路加福音 8:20）
    text:
      ru: 'И дали знать Ему: Матерь и братья Твои стоят вне, желая видеть Тебя.'
      cn: 或告彼曰、尔母及尔兄立外欲见尔、
  - type: paragraph
    initial:
      ru: 'Лк 8:21. '
      cn: （路加福音 8:21）
    text:
      ru: 'Он сказал им в ответ: матерь Моя и братья Мои суть слушающие слово Божие и исполняющие его.'
      cn: 彼答之曰、我母及我兄是听上帝之言而行者之也、
  - type: paragraph
    text:
      ru: Когда некоторые сказали Ему о Его сродниках, Он не заключает братства в числе немногих и сынам Иосифовым не придает той чести, будто бы они только одни Его братья. Но поскольку Он пришел спасти весь мир и всех сделать братьями, то говорит:«мать Моя и братья Мои сутьте, коислушаютслово Божие; потом, поскольку одно слушание никого не спасает, а разве только осуждает, Он говорит:«и исполняют». Ибо должно слушать и вместе исполнять. Словом Божиим называет Свое учение, ибо, что Он ни говорил, все принадлежало Отцу Его, так как Он не был противником Богу, чтобы слова Его не были Божиими.
      cn: 当一些人向祂提及祂的亲族时，祂并未将手足关系局限于少数人之中，也并未赋予约瑟的儿子们那样的尊荣，仿佛唯有他们是祂的兄弟。然而，因为祂来是为了拯救整个世界，并使所有人都成为弟兄，所以祂说：「我的母亲和我的弟兄，是那些听上帝之道的人。」 接着，由于单单听闻并不能拯救任何人，反而只会定罪，祂便说：「并且遵行的人。」 因为人必须既听闻，又同时遵行。祂称祂的教导为上帝之道，因为祂所说的一切都属于祂的父，正如祂并非上帝的反对者，故而祂的话语就是上帝的。
  - type: paragraph
    text:
      ru: 'Некоторые место это понимают так: поскольку Христос учил и был в славе за Свое учение, то некоторые, возбуждаемые завистью, как бы в насмешку над Ним, говорили:«вот Мать Твоя и братья Твои стоят вне, желая видеть Тебя». Так как Мать Его была бедна и братья Его не славны, как дети плотника, то они, чтоб опозорить Его, как неблагородного, и указывали Ему на Мать Его и на братьев. Но Он, зная мысль их, сказал: бедность родственников нисколько не вредит Мне; напротив, если кто даже и беден, но слушает Слово Божие, того Я делаю сродником Своим.'
      cn: 一些人对这段经文的理解如下：既然基督教导人，并因着祂的教导而处于荣耀之中，一些被嫉妒所煽动的人，就如同在嘲弄祂一般，说道：「看哪，你的母亲和你的弟兄站在外面，想要见你。」由于祂的母亲是贫困的，祂的弟兄作为木匠的儿子并不光荣，所以他们为了羞辱祂是个不具高贵出身之人，就向祂指着祂的母亲和弟兄。但祂深知他们的意图，便说：亲属的贫困丝毫不损害我；相反，倘若有人即使贫困，但却听从上帝的圣言，我就使那人成为我的亲属。
  - type: paragraph
    initial:
      ru: 'Лк 8:22. '
      cn: （路加福音 8:22）
    text:
      ru: 'В один день Он вошел с учениками Своими в лодку и сказал им: переправимся на ту сторону озера. И отправились.'
      cn: 〇一日、适彼偕其门徒登舟、而语曰、我侪济湖彼岸而行、
  - type: paragraph
    initial:
      ru: 'Лк 8:23. '
      cn: （路加福音 8:23）
    text:
      ru: Во время плавания их Он заснул. На озере поднялся бурный ветер, и заливало ихволнами,и они были в опасности.
      cn: 行时彼寝矣、湖中飓风吹下、涌满而危险、
  - type: paragraph
    initial:
      ru: 'Лк 8:24. '
      cn: （路加福音 8:24）
    text:
      ru: 'И, подойдя, разбудили Его и сказали: Наставник! Наставник! погибаем.'
      cn: 就而醒之曰、师欤、师欤、我侪亡矣、彼起禁斥风及水浪、即止而平稳矣、
  - type: paragraph
    text:
      ru: 'Господь засыпает с особенным намерением, именно: чтобы доставить упражнение ученикам и испытать, какова их вера, останутся ли они без смущения от искушений. Оказывается, что они слабы. Они обнаруживают веру не совершенную, но смешанную с неверием. Ибо веруют, что Он может спасти, но как маловерные говорят: спаси!«погибаем». А если бы они имели совершенную веру, то были бы вполне убеждены, что для них даже невозможно погибнуть тогда, когда с ними находится Всемогущий.'
      cn: 主带着一个特殊的意图睡着，即：为了给门徒们提供练习，并考验他们的信心如何，他们是否能在试探中保持不受搅扰。结果表明，他们是软弱的。他们所展示的信心并不完全，而是混杂着不信。因为他们相信祂能够拯救，但他们作为小信的人说：「救我们！『我们灭亡了』。」而如果他们拥有完全的信心，他们就会完全确信，当全能者与他们同在时，他们甚至不可能灭亡。
  - type: paragraph
    text:
      ru: Но Он, встав, запретил ветру и волнению воды; и перестали, и сделалась тишина.
      cn: 然而，祂站起身，叱责了风和水的汹涌；它们便停止了，且成了一片平静。
  - type: paragraph
    text:
      ru: Чтобы сила Его была очевиднее, Он допустил их смутиться. Ибо мы, люди, обыкновенно более помним того избавителя, который спас нас от большой опасности. Поэтому Он восстал и спас их не в начале, но когда они были на краю опасности.
      cn: 为了让祂的能力更加明显，祂允许他们陷入困惑（扰乱）。因为我们人类通常对那位将我们从巨大危险中拯救出来之救世主的记忆更加深刻。因此，祂站起来拯救他们，不是在（危险）的伊始，而是在他们处于危险的边缘时。
  - type: paragraph
    text:
      ru: Можешь усматривать и переносный смысл. Настоящее событие есть образ того, что случилось с учениками впоследствии. Озеро есть Иудея, на которую нашла сильная буря неистовства против Христа, каким неистовствовали иудеи при распятии Господа. Смутились и ученики, ибо все оставили Его и бежали. Но Господь встал от сна, то есть воскрес, и – ученики опять успокоились. Ибо, представ пред ними, Он сказал:«мир вам»(Ин. 20, 19). Таков переносный смысл сего места.
      cn: 你也可以看到一个转义的意义。这个真实的事件，是后来发生在门徒身上的事情的象征。湖泊就是犹太，强烈的反对基督的暴怒之风暴席卷了它，犹太人在钉死主时就是以这种方式暴怒的。门徒们也惊慌失措了，因为他们都离弃了祂并逃跑了。但是主从睡梦中站起来了，也就是说祂复活了，而——门徒们又再次平静下来了。因为，祂出现在他们面前时，祂说：「愿你们平安」（伊鄂昂福音 20:19）。这就是此处的转义意义。
  - type: paragraph
    initial:
      ru: 'Лк 8:25. '
      cn: （路加福音 8:25）
    text:
      ru: 'Тогда Он сказал им: где вера ваша? Они же в страхе и удивлении говорили друг другу: кто же это, что и ветрам повелевает и воде, и повинуются Ему?'
      cn: 谓彼等曰、尔等之信安在、众惊骇且奇异之、互相曰、此何人也、彼命风与水、亦顺之、
  - type: paragraph
    text:
      ru: '«Кто же это?»они говорят это не в смысле сомнения, но в чувстве удивления. Они как бы так сказали: «Кто сей», то есть какой Он великий и дивный, и какой властью и силой творит это?!'
      cn: 「谁是这个人呢？」他们说出此言，并非出于疑虑，而是出于惊奇之感。他们仿佛如此说道：「这位是谁？」也就是说，他是何等伟大而奇妙，又是凭着何等的权柄与能力施行此事的呢？！
  - type: paragraph
    initial:
      ru: 'Лк 8:26. '
      cn: （路加福音 8:26）
    text:
      ru: И приплыли в страну Гадаринскую, лежащую против Галилеи.
      cn: 〇来至戛达拉之境、与戛利列亚相对、
  - type: paragraph
    initial:
      ru: 'Лк 8:27. '
      cn: （路加福音 8:27）
    text:
      ru: Когда же вышел Он на берег, встретил Его один человек из города, одержимый бесами с давнего времени, и в одежду не одевавшийся, и живший не в доме, а в гробах.
      cn: 彼豋岸时、有人自城出迎之、其有魔鬼经历多时、不著衣、不居室、乃在墓中、
  - type: paragraph
    initial:
      ru: 'Лк 8:28. '
      cn: （路加福音 8:28）
    text:
      ru: 'Он, увидев Иисуса, вскричал, пал пред Ним и громким голосом сказал: что́ Тебе до меня, Иисус, Сын Бога Всевышнего? умоляю Тебя, не мучь меня.'
      cn: 见伊伊稣斯、呼号俯伏其前、大声呼曰、至上上帝之子伊伊稣斯欤、尔与我何干、我祷尔勿苦我、
  - type: paragraph
    text:
      ru: 'Смотри: бес одержим двумя страстями злобы: дерзостью и страхом. Ибо слова:«что Тебе до меня»свойственны дерзкому и бесстыдному рабу, а«умоляю Тебя»– боязливому. Живет он в«гробах», с намерением вложить людям лукавую мысль, что души умерших становятся бесами.'
      cn: 留心：鬼被两种邪恶的激情所主宰：傲慢与恐惧。因为「尔与我何干」这些话语，是一个傲慢且无耻的奴仆所特有的，而「我祷尔」则是胆怯者所特有的。它住在「坟墓」之中，意图在人们心中植入一个狡猾的念头，即死去之人的灵魂会变成鬼。
  - type: paragraph
    initial:
      ru: 'Лк 8:29. '
      cn: （路加福音 8:29）
    text:
      ru: ИбоИисусповелел нечистому духу выйти из сего человека, потому что он долгое время мучил его, так что его связывали цепями и узами, сберегая его; но он разрывал узы и был гоним бесом в пустыни.
      cn: 因伊伊稣斯命邪神出离此人、其历多时强拘之、人以铁索及桎梏系看守之、彼断索练而被魔鬼逐于旷野、
  - type: paragraph
    initial:
      ru: 'Лк 8:30. '
      cn: （路加福音 8:30）
    text:
      ru: 'Иисус спросил его: как тебе имя? Он сказал: легион, – потому что много бесов вошло в него.'
      cn: 伊伊稣斯问之曰、尔何名、答曰、列碣翁盖多魔鬼入之、
  - type: paragraph
    initial:
      ru: 'Лк 8:31. '
      cn: （路加福音 8:31）
    text:
      ru: И они просили Иисуса, чтобы не повелел им идти в бездну.
      cn: 乃求伊伊稣斯勿令之入渊、
  - type: paragraph
    initial:
      ru: 'Лк 8:32. '
      cn: （路加福音 8:32）
    text:
      ru: Тут же на горе паслось большое стадо свиней; ибесыпросили Его, чтобы позволил им войти в них. Он позволил им.
      cn: 在彼有大猪群适牧于山、遂求彼许之入其中、彼许之、
  - type: paragraph
    initial:
      ru: 'Лк 8:33. '
      cn: （路加福音 8:33）
    text:
      ru: Бесы, выйдя из человека, вошли в свиней, и бросилось стадо с крутизны в озеро и потонуло.
      cn: 魔鬼由人出入于猪、其群突逸下山坡、投湖而淹溺、
  - type: paragraph
    text:
      ru: Бесы просят о том, чтоб им не повелено было«идти в бездну», но позволено еще пожить на земле. Господь позволяет им быть на земле, чтобы они, нападая на людей, делали их более славными. Ибо если бы не было противоборствующих, не было бы и подвигов, а если бы не было подвигов, не было бы и венцов.
      cn: 恶魔请求不要命令它们「进入深渊」，而是允许它们在地上再多逗留一会儿。主允许它们在地上，这样它们便能攻击人类，使人类更加荣耀。因为若没有对立者，便不会有功绩，而若没有功绩，便不会有冠冕。
  - type: paragraph
    text:
      ru: Знай и более переносный смысл. Кто имеет в себе бесов, то есть бесовские дела, тот не надевает на себя одежды, то есть не имеет одежды крещения и не живет в дому, то есть в церкви, ибо недостоин входить в церковь, но живет«в гробах», то есть в местах мертвых дел, например, в домах непотребных, в мытницах (таможнях). Ибо такие дома суть вместилища злобы.
      cn: '更当知，其喻义。


        凡身怀魔鬼，亦即怀有魔鬼之作为者，必不披戴衣裳，亦即不拥有洗礼之衣，且不居于家中，亦即不居于教会之内。因其不配进入教会，乃「居于坟墓」之中，亦即居于那等死寂之事的所在，例如：居于不贞之屋，居于税关（海关）。盖因，此类房屋乃是邪恶之巢穴。'
  - type: paragraph
    initial:
      ru: 'Лк 8:34. '
      cn: （路加福音 8:34）
    text:
      ru: Пастухи, видя происшедшее, побежали и рассказали в городе и в селениях.
      cn: 众牧者见所遇者、奔告于城村、
  - type: paragraph
    initial:
      ru: 'Лк 8:35. '
      cn: （路加福音 8:35）
    text:
      ru: И вышли видеть происшедшее; и, придя к Иисусу, нашли человека, из которого вышли бесы, сидящего у ног Иисуса, одетого и в здравом уме; и ужаснулись.
      cn: 众出见所遇者而来就伊伊稣斯、见其人魔鬼由之出、著衣自若、坐近伊伊稣斯之足下、皆惊骇之、
  - type: paragraph
    initial:
      ru: 'Лк 8:36. '
      cn: （路加福音 8:36）
    text:
      ru: Видевшие же рассказали им, как исцелился бесновавшийся.
      cn: 见者告之、如何负魔者得救、
  - type: paragraph
    initial:
      ru: 'Лк 8:37. '
      cn: （路加福音 8:37）
    text:
      ru: И просил Его весь народ Гадаринской окрестности удалиться от них, потому что они объяты были великим страхом. Он вошел в лодку и возвратился.
      cn: 戛达拉境中人求彼离之、因众身大惊之故也、彼豋舟而返、
  - type: paragraph
    initial:
      ru: 'Лк 8:38. '
      cn: （路加福音 8:38）
    text:
      ru: 'Человек же, из которого вышли бесы, просил Его, чтобы быть с Ним. Но Иисус отпустил его, сказав:'
      cn: 其人魔鬼由之出者、祷彼为偕之、伊伊稣斯放之曰、
  - type: paragraph
    initial:
      ru: 'Лк 8:39. '
      cn: （路加福音 8:39）
    text:
      ru: возвратись в дом твой и расскажи, что́ сотворил тебе Бог. Он пошел и проповедовал по всему городу, что сотворил ему Иисус.
      cn: 归尔家、为上帝于尔所行告之、其往、以伊伊稣斯为之所行者传于遍城、
  - type: paragraph
    text:
      ru: Бегство пастухов было для гадаринцев поводом к спасению; но они не уразумели. Им должно было удивиться силе Спасителя и уверовать в Него, а они, сказано, просили, то есть умоляли Иисуса отойти от них. Ибо они боялись, чтобы еще не потерпеть какого-нибудь другого убытка, подобно тому, как они лишились свиней. Но получивший исцеление представляет непререкаемое доказательство исцеления. Он стал настолько здоров умом, что познал Иисуса и просил Его, чтобы быть с Ним. Вероятно, он боялся, чтобы, по удалении от Иисуса, ему снова не попасть во власть бесов. Но Господь, показывая ему, что он и не будучи с Иисусом, но покрываемый Его благодатью, может быть выше бесовских сетей, говорит ему:«возвратись в дом твой и расскажи, что сотворил тебе Бог». Не сказал:«что Я сотворил тебе», чтобы нам подать образец смиренномудрия и чтобы мы всякое счастливо совершенное дело относили к Богу. Но исцеленный был настолько благоразумен, что рассказывал о том, что сделал ему«Иисус». Хотя Господь заповедал ему рассказывать о том, что сотворил ему«Бог», а он рассказывает, что сделал ему«Иисус». Итак, и нам, когда сделаем кому-нибудь добро, не должно желать проповедания об оном; а тот, кому сделано добро, должен возвещать о нем, хотя бы мы и не желали сего.
      cn: 牧羊人的逃走是给迦大拉人的一个得救的机缘；但他们却不曾明白。他们本该惊奇于救主的德能并信入祂，可经文说，他们却求，也就是说，他们恳求耶稣离开他们。因为他们害怕，唯恐再遭受某种其他的损失，就像他们失去猪群那样。但那获得痊愈的人则展示了无可辩驳的痊愈的明证。他的心智变得如此健康，以致他认出了耶稣，并求祂，希望与祂同在。他或许是害怕，在离开耶稣之后，自己会再次落入邪魔的权势之下。但主，向他显示，即便他不与耶稣同在，而是被祂的恩典所遮蔽，他也能够超越邪魔的罗网，故而对他说：「归尔家、为上帝于尔所行告之」（路加福音 8:39）。祂未曾说：「我为你所行的」，是为了给我们树立谦卑心智的榜样，也是为了让我们将所有幸福圆满完成的事务归于上帝。但那被治愈的人是如此明智，以致他讲述的是「耶稣」为他所做的。尽管主吩咐他讲述「上帝」为他所做的，而他却讲述「耶稣」为他所做的。因此，我们，在对某人行了善事时，不应当渴望对此进行宣扬；而那被施以善事的人，则应当去宣告此事，即便我们不希望如此。
  - type: paragraph
    initial:
      ru: 'Лк 8:40. '
      cn: （路加福音 8:40）
    text:
      ru: Когда же возвратился Иисус, народ принял Его, потому что все ожидали Его.
      cn: 〇伊伊稣斯归时、民接之、盖皆伫望之、
  - type: paragraph
    text:
      ru: Иисус лишь возвратился из страны Гадаринской, а народ уже ждал Его частью ради учения, а частью ради чудес.
      cn: 耶稣刚刚从格达拉人的地区返回，民众就已经在等待他了，一部分是为了听他的教诲，一部分是为了见他的神迹。
  - type: paragraph
    initial:
      ru: 'Лк 8:41. '
      cn: （路加福音 8:41）
    text:
      ru: И вот, пришел человек, именем Иаир, который был начальником синагоги; и, пав к ногам Иисуса, просил Его войти к нему в дом,
      cn: 顾有一人名伊阿伊儿乃会堂之宰、俯伏于伊伊稣斯之足前、求之入其家、
  - type: paragraph
    initial:
      ru: 'Лк 8:42. '
      cn: （路加福音 8:42）
    text:
      ru: потому что у него была одна дочь, лет двенадцати, и та была при смерти.
      cn: 盖有其独生女、年约十二岁、将死矣、彼往时、众民拥挤之、
  - type: paragraph
    text:
      ru: Пришел и один начальник синагоги, ни бедный, ни отверженный, но из первых. Евангелист присовокупляет и имя его, чтобы тем очевиднее было, что чудо истинно. По настоянию нужды он припадает к ногам Иисусовым. Хотя бы он и без настоятельной нужды должен был пасть пред Иисусом и исповедать Его Сущим Богом, однако ж бывает, что и скорбь побуждает людей к избранию лучшего. Почему и Давид сказал:«Не будьте как конь, как лошак несмысленный, которых челюсти нужно обуздывать уздою и удилами, чтобы они покорялись тебе»(Пс. 31, 9).
      cn: 来了一位会堂的官长，他既非贫穷，也非被弃绝者，而是属于首位之人。这位传福音者还加上了他的名字，为的是叫这神迹显得更加真实无伪。因着急迫的需要，他俯伏在耶稣的脚前。虽然即使他没有急迫的需要，也本应俯伏在耶稣面前，承认祂是真实的上帝，然而，痛苦有时也会促使人们去选择那更好的。因此大卫也说：「不可像无知的马和骡，非用嚼环辔头勒住，就不能驯服」（诗篇 31:9）。
  - type: paragraph
    text:
      ru: Когда же Он шел, народ теснил Его.
      cn: 当祂行走时，民众拥挤着祂。
  - type: paragraph
    initial:
      ru: 'Лк 8:43. '
      cn: （路加福音 8:43）
    text:
      ru: И женщина, страдавшая кровотечением двенадцать лет, которая, издержав на врачей всё имение, ни одним не могла быть вылечена,
      cn: 一妇患血漏十二年、其为延医耗尽生资、而不能由一人得效、
  - type: paragraph
    initial:
      ru: 'Лк 8:44. '
      cn: （路加福音 8:44）
    text:
      ru: подойдя сзади, коснулась края одежды Его; и тотчас течение крови у ней остановилось.
      cn: 乃就之后、扪其衣裾、其血漏即止、
  - type: paragraph
    text:
      ru: Во время пути Господа приступает жена, руководимая весьма сильной верой.«Подойдя,онакоснулась края одежды»Господа в той уверенности, что как только прикоснется, тотчас и исцелится.«И тотчас течение крови у ней остановилось». Как если кто-нибудь обратит глаз к сияющему свету или поднесет хворост к огню, они (свет и огонь) тотчас оказывают свое действие, так и жена, принесшая веру Могущему исцелить, тотчас получила исцеление. Ибо она ни о чем не думала, ни о долговременности болезни, ни об отчаянии врачей, ни о другом чем, но только веровала, и – спаслась. И как кажется, она прикоснулась к Иисусу прежде мыслью, а потом телом.
      cn: 在主行路期间，一位被极其强烈的信心所引导的妇人走近前来。「她走上前去，摸了摸主的外衣的衣裾，」她怀着这样的确信，即她只要一接触，就立刻会被治愈。「她的血漏就立刻停止了。」正如若有人将目光转向璀璨的光芒，或将枯枝靠近火焰，它们（光芒与火焰）会立刻发挥其作用一样，这位带来信心给那有能力治愈之者的妇人，也立刻得到了治愈。因为她没有思虑任何事，既没有思虑疾病的漫长，也没有思虑医生的绝望，亦没有思虑其他任何事物，她唯独相信，于是——她就得救了。而且，似乎是她首先以思想接触了耶稣，然后才以身体接触。
  - type: paragraph
    initial:
      ru: 'Лк 8:45. '
      cn: （路加福音 8:45）
    text:
      ru: 'И сказал Иисус: кто прикоснулся ко Мне? Когда же все отрицались, Петр сказал и бывшие с Ним: Наставник! народ окружает Тебя и теснит, – и Ты говоришь: кто прикоснулся ко Мне?'
      cn: 伊伊稣斯曰、扪我者谁乎、众不承认、而撇特儿及偕在者曰、师欤、诸民围绕拥挤尔、乃曰、谁扪我乎、
  - type: paragraph
    text:
      ru: 'Господь, желая показать всем веру жены, чтобы подражали ей, и подать Иаиру добрую надежду о его дочери, обнаруживает то, что было сделано тайно. Именно: Он спрашивает о том, кто прикоснулся к Нему, но Петр как смелый, упрекая Его за такой вопрос, говорит: столько народа стесняет Тебя,«и Ты говоришь: кто прикоснулся ко Мне?»А сам не понимал, о чем спрашивал Господь. Ибо Иисус спрашивал:«кто прикоснулся ко Мне»с верой, а не просто так. Ибо как всякий имеет уши, чтобы слышать, и однако ж иной, имея уши, не слышит, так и в сем случае иной прикасается с верой, а иной хотя и приближается, но сердце его отстоит далеко. Итак Господь, хотя и знал жену, спрашивает, однако ж, для того, чтобы, как я сказал, и веру ее прославить, и начальника синагоги более обнадежить, спрашивает и таким образом жену выводит на средину.'
      cn: '主，意欲向所有人展示该妇人的信心，使众人效法她，并给予睚鲁（Yāilǔ）关于他女儿的美好盼望，祂揭示了那隐秘完成之事。


        具体而言：祂询问是谁触摸了祂，但彼得（Petr）作为大胆直言者，为此种问题责备祂，说道：如此多的民众拥挤着祢，「祢却说：谁触摸了我？」而他自己不明白主所问的为何。因为耶稣所问的「谁触摸了我」，是带着信心触摸，而非仅仅是如此。因为正如所有人都有耳朵可以听闻，然而有些人虽有耳朵却不听闻，故而在此时，有些人是带着信心触摸，而另一些人虽然靠近，但他的心却离得遥远。因此，主虽然知道那妇人是谁，但仍旧发问，正如我所说，是为了宣扬她的信心，并使会堂的管会更加充满盼望，祂借由发问，就如此将那妇人引到了众人面前。'
  - type: paragraph
    initial:
      ru: 'Лк 8:46. '
      cn: （路加福音 8:46）
    text:
      ru: 'Но Иисус сказал: прикоснулся ко Мне некто, ибо Я чувствовал силу, исшедшую из Меня.'
      cn: 伊伊稣斯曰、有扪我者、盖我觉异能由我出、
  - type: paragraph
    initial:
      ru: 'Лк 8:47. '
      cn: （路加福音 8:47）
    text:
      ru: Женщина, видя, что она не утаилась, с трепетом подошла и, пав пред Ним, объявила Ему перед всем народом, по какой причине прикоснулась к Нему и как тотчас исцелилась.
      cn: 妇见不得自瞒、战栗来俯伏于其前、当众民面前、以扪之之故及如何立愈告于彼、
  - type: paragraph
    initial:
      ru: 'Лк 8:48. '
      cn: （路加福音 8:48）
    text:
      ru: 'Он сказал ей: дерзай, дщерь! вера твоя спасла тебя; иди с миром.'
      cn: 彼语之曰、女欤、放胆哉、尔信救尔矣、于安和而往、
  - type: paragraph
    text:
      ru: '«Я чувствовал силу, исшедшую из Меня». Справедливо говорит. Ибо пророки не имели сил, от них исходящих: они совершали чудеса благодатью Божией. А Иисус, будучи Источником всякого блага и всякой силы, имеет и силы, от Него исходящие. Христос вдвойне врачует жену: во-первых, исцелил болезнь ее, а потом и страх души усмирил, сказав:«дерзай, дщерь!».'
      cn: 「我感觉到有能力从我出来。」他说得有理。因为众先知并没有能力从他们身上发出：他们是借着上帝的恩典行神迹。而耶稣，作为一切良善和一切能力之源头，也有能力从他身上发出。基督双重地医治了这妇人：首先，他治愈了她的疾病；其次，他又通过说：「放胆哉，女儿！」平息了她灵魂的恐惧。
  - type: paragraph
    initial:
      ru: 'Лк 8:49. '
      cn: （路加福音 8:49）
    text:
      ru: 'Когда Он еще говорил это, приходит некто из дома начальника синагоги и говорит ему: дочь твоя умерла; не утруждай Учителя.'
      cn: 彼尚言有时、自宰会堂者之家来曰、尔女已死、勿劳师焉、
  - type: paragraph
    initial:
      ru: 'Лк 8:50. '
      cn: （路加福音 8:50）
    text:
      ru: 'Но Иисус, услышав это, сказал ему: не бойся, только веруй, и спасена будет.'
      cn: 伊伊稣斯闻而答之曰、勿惧、惟信哉、其得必救、
  - type: paragraph
    text:
      ru: 'Иисус, услышав, что некто сказал начальнику синагоги: не беспокой Учителя, то есть«не утруждай», не проси пойти, не позволил начальнику синагоги сказать что-нибудь Себе, но упредил его, чтобы начальник синагоги не сказал: я не имею в Тебе нужды; несчастье уже совершилось; та, которую, мы надеялись, Ты исцелишь, умерла. Итак, чтобы он не сказал ничего такого (ибо он был неверующий иудей), Христос упредил его и сказал:«не бойся, только веруй»; смотри, – говорит, – на кровоточивую; подражай ей, и ты не обманешься.'
      cn: 耶稣，听见有人对会堂的管理者说：不要再麻烦这位导师了，也就是说，「不要使祂操劳」，不要请求祂去了，不让会堂的管理者有机会对祂说任何话，而是抢先了他，以免会堂的管理者说：我不需要祢了；不幸已经发生；我们曾希望祢能医治的那人，已经死了。因此，为了不让他说出任何这样的话（因为他是一个不信的犹太人），基督抢先了他，并说：「不要害怕，只要相信」；看哪，——祂说，——看看那患血漏的妇人；效仿她，你也不会受骗。
  - type: paragraph
    initial:
      ru: 'Лк 8:51. '
      cn: （路加福音 8:51）
    text:
      ru: Придя же в дом, не позволил войти никому, кроме Петра, Иоанна и Иакова, и отца девицы, и матери.
      cn: 彼入其家、除撇特儿伊鄂昂亚适乌及小女之父母外、不许一人入之、
  - type: paragraph
    text:
      ru: 'Господь позволяет войти с Собой только Петру, Иоанну и Иакову, как избраннейшим из учеников и как могущим умолчать о чуде, ибо Он не желал, чтобы оно прежде времени было открыто многим. Он скрывал большую часть Своих дел, быть может, по причине зависти иудеев, чтобы, возжигаемые завистью, они не были повинны осуждению. Подобным образом должны поступать и мы: если кто завидует нам, мы не должны обнаруживать пред ним наши совершенства, чтобы, поражая его оными, не возбудить в нем большей зависти и не ввести в грех, но должны, сколь возможно, стараться скрывать их от него.'
      cn: 主只允许彼得、伊鄂昂和亚适乌布同祂进入，因为他们是门徒中最蒙拣选的，并且能够对这奇迹保持缄默，因为祂不希望它过早地向许多人显明。祂隐藏了祂的大部分作为，或许是出于犹太人嫉妒的缘故，以免他们被嫉妒所煽动，以致负上受谴责的罪责。我们亦当如此行：若有人嫉妒我们，我们不应在他面前显露我们的圆满（完善）之处，以免用这些去触动他，激起他更大的嫉妒，并使他陷入罪中，而我们应当竭尽所能地努力向他隐藏它们。
  - type: paragraph
    initial:
      ru: 'Лк 8:52. '
      cn: （路加福音 8:52）
    text:
      ru: 'Все плакали и рыдали о ней. Но Он сказал: не плачьте; она не умерла, но спит.'
      cn: 众为之哭而哀、彼曰、勿哭、其非死、乃寝耳、
  - type: paragraph
    initial:
      ru: 'Лк 8:53. '
      cn: （路加福音 8:53）
    text:
      ru: И смеялись над Ним, зная, что она умерла.
      cn: 人人知其已死、皆哂之、
  - type: paragraph
    text:
      ru: Когда Господь сказал, что девица«не умерла, но спит», и смерть назвал сном (поскольку имел воскресить умершую, как бы от сна возбудить), то слышавшие сие засмеялись над Ним, что допустил Он затем, чтобы чудо было больше чудом, – чтобы впоследствии не могли сказать, что девица не умирала, но спала, для сего Он устроил так, что прежде осмеяли Его за слова:«не умерла, но спит», чтобы заградить уста желающих клеветать. Ибо смерть девицы так была явна, что засмеялись над Ним, когда Он сказал, что она не умерла.
      cn: 当主说，那女孩「没有死，而是睡着了」，并且称死亡为睡眠时（因为他将要使那死者复活，如同将她从睡梦中唤醒），那些听见这话的人便讥笑他。他容许此事发生，是为了使神迹成为更大的神迹——为了使他们日后不能说，那女孩没有死，而是睡着了。为此，他安排了此事：先是因他的话「没有死，而是睡着了」而遭到讥笑，以便堵住那些想要诽谤之人的口。因为那女孩的死亡是如此明显，以至于当他说她没有死时，他们都讥笑他。
  - type: paragraph
    initial:
      ru: 'Лк 8:54. '
      cn: （路加福音 8:54）
    text:
      ru: 'Он же, выслав всех вон и взяв ее за руку, возгласил: девица! встань.'
      cn: 彼遣众外出、执其手呼曰、小女起哉、
  - type: paragraph
    text:
      ru: Господь всех выслал вон, быть может, с тем, чтобы нас научить не любить славы и ничего не делать напоказ, а может быть, и с тем, чтобы внушить, что имеющий совершить чудо не должен быть в среде многих, но должен находиться в уединении и быть свободным от всяких беспокойств со стороны других.
      cn: 主把所有人都打发了出去，也许是为了教导我们不要爱慕虚荣，不要做任何虚浮表面的事，也许还是为了暗示，即将行神迹的人不应在众人之中，而应处于隐退之中，并免于来自他人的一切干扰。
  - type: paragraph
    initial:
      ru: 'Лк 8:55. '
      cn: （路加福音 8:55）
    text:
      ru: И возвратился дух ее; она тотчас встала, и Он велел дать ей есть.
      cn: 其神返即苏起、彼又命予之食、
  - type: paragraph
    text:
      ru: «И возвратился дух»отроковицы. Ибо Господь не новую внес душу, но повелел возвратиться той самой, которая отлетела от тела. Приказал подать ей поесть – для большего уверения и доказательства того, что она действительно воскресла.
      cn: 「其神返即苏起」（路加福音 8:55）——指这女童的灵魂（дух）。因为主并非给她注入了一个新的灵魂，而是命令那个从身体中飞离的灵魂返回。他命令「予之食」——是为了带来更大的确信，并证明她的确已经复活了。
  - type: paragraph
    initial:
      ru: 'Лк 8:56. '
      cn: （路加福音 8:56）
    text:
      ru: И удивились родители ее. Он же повелел им не сказывать никому о происшедшем.
      cn: 其父母骇异之、彼命伊等勿将所遇者告人、
  - type: paragraph
    text:
      ru: Можно это и так понимать. Кровоточивая есть всякая душа, в которой кипит и как бы ключом бьет кровавый и убийственный грех. Ибо всякий грех есть убийца и закалатель души. Если душа коснется одежд Иисусовых, то есть воплощения Его, и уверует, что Сын Божий воплотился, то получит здравие. Если кто будет и начальник синагоги, то есть ум, возвышающийся над богатством, собранным от любостяжания, но дочь его, то есть помысл, заболит, то пусть призовет только Иисуса и уверует в Него, и – будет спасен.
      cn: 还可以如此理解。流血的妇人是每一个灵魂，在其中，血腥而杀戮的罪恶翻腾，仿佛汩汩涌出。因为每一个罪恶都是灵魂的杀手和屠夫。如果灵魂能接触到耶稣的衣裳，也就是祂的道成肉身，并相信上帝之子已道成肉身，它便能获得健全。倘若有人是会堂的管理者，亦即那超越了由贪婪所聚敛的财富的理智（um），但他的女儿，亦即他的意念（помысл），却生病了，那么，只须他呼求耶稣并相信祂，他就必得拯救。
- type: heading1
  text:
    ru: Глава девятая
    cn: 第九章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 9:1. '
      cn: （路加福音 9:1）
    text:
      ru: Созвав же двенадцать, дал силу и власть над всеми бесами и врачевать от болезней,
      cn: 〇彼召十二者、赐之能力及权柄、以制魔鬼及医诸疾病、
  - type: paragraph
    text:
      ru: И отсюда открывается превосходство Божества Иисусова. Ибо Он не только Сам творил чудеса, но ту же силу давал и ученикам. А сообщать своим друзьям такие дары, без всякого сомнения, возможно не человеку, а только Богу.
      cn: 由此，耶稣的神性之超越性便显明了。因为祂不仅亲身行神迹（奇迹），还将同样的能力赐予了门徒。毫无疑问，将这样的恩赐传授给自己的朋友，这绝非人类所能做到，而唯独是上帝才可能做到。
  - type: paragraph
    initial:
      ru: 'Лк 9:2. '
      cn: （路加福音 9:2）
    text:
      ru: и послал их проповедовать Царствие Божие и исцелять больных.
      cn: 又遣伊等宣传上帝国、亦医负病者、
  - type: paragraph
    text:
      ru: Дав ученикам власть над злыми духами, Господь не ограничил их употреблением только сей власти, но повелел им и Евангелие проповедовать. Тот, кому вручено учительство, должен и проповедовать, и совершать чудеса. В таком случае проповедь подтверждается чудесами, а чудеса – проповедью. Ибо многие часто совершали чудеса силой бесовской, но проповедь их не была истинная; а поэтому и чудеса их не от Бога.
      cn: 上主赐予门徒管辖邪灵的权柄之后，并未将他们的职责仅限于运用此种权柄，而是亦吩咐他们去宣讲福音。那被授予教导之职的人，必须既宣讲（福音），又行奇迹。在此情形下，宣讲得蒙奇迹的证实，而奇迹则得蒙宣讲的证实。盖因许多人时常借着鬼魔之力行奇迹，但他们的宣讲并非真实的；因此，他们的奇迹也并非来自上帝。
  - type: paragraph
    initial:
      ru: 'Лк 9:3. '
      cn: （路加福音 9:3）
    text:
      ru: 'И сказал им: ничего не берите на дорогу: ни посоха, ни сумы́, ни хлеба, ни серебра, и не имейте по две одежды;'
      cn: 谓之曰、尔等于路上、毫无所携、勿杖、勿囊、勿粮、勿银、勿著二衣、
  - type: paragraph
    text:
      ru: Господь, посылая учеников, заповедует им такую умеренность, что не повелевает им брать ни хлеба, ни чего-нибудь другого такого, чего многие из нас набирают себе.
      cn: 主、在差遣门徒时，命他们保持此种节制，即不命他们带上粮食，也不带任何其他诸如我们许多人给自己积聚之物。
  - type: paragraph
    initial:
      ru: 'Лк 9:4. '
      cn: （路加福音 9:4）
    text:
      ru: и в какой дом войдете, там оставайтесь и оттуда отправляйтесьв путь.
      cn: 尔等入何人之家、则居于彼、亦由彼而去、
  - type: paragraph
    text:
      ru: Заповедует им и то, чтоб они не перебегали от одного к другому, но в какой дом войдут, в том и оставались бы, чтобы не показаться какими-то непостоянными и очень переменчивыми.
      cn: 他（主）也命令他们不要从一家跑到另一家，而应在他们所进入的那一家中停留，以免显得是某种轻浮善变之人。
  - type: paragraph
    initial:
      ru: 'Лк 9:5. '
      cn: （路加福音 9:5）
    text:
      ru: А если где не примут вас, то, выходя из того города, отрясите и прах от ног ваших во свидетельство на них.
      cn: 若有不接尔等者、出其城之时、拂去尔足之尘以为作证于彼等、
  - type: paragraph
    text:
      ru: Отрясайте, – говорит, – пыль на тех, которые не примут вас,«во свидетельство на них», то есть на обличение и осуждение их, показывая им, что, хотя ради их и много пути совершили, не получили, однако ж, от них никакой прибыли.
      cn: 「拂去，」他说，「那些不接纳你们之人的尘土，『为作证于他们』，」也就是，为着责备和定罪他们。这是向他们表明：虽然为了他们走了很长的路程，但却没有从他们那里得到任何益处。
  - type: paragraph
    initial:
      ru: 'Лк 9:6. '
      cn: （路加福音 9:6）
    text:
      ru: Они пошли и проходили по селениям, благовествуя и исцеляя повсюду.
      cn: 彼等出、遍经诸鄕村、处处传福音施医、
  - type: paragraph
    text:
      ru: 'Некоторые заповеди апостолам – не носить ни сумы, ни посоха, не иметь по две одежды, понимают так: не собирайте сокровищ, – ибо сума, вмещая многое, означает собирание; не носите посоха, то есть не будьте гневливы и драчливы; не имейте по две одежды, то есть не будьте переменчивы в нравах и двоедушны в мыслях.'
      cn: '某些对使徒们的诫命——即不带褡裢（сума），不带手杖（посоха），不拥有两件外衣（по две одежды）——人们如此理解：


        不要聚敛财宝，——因为褡裢，能容纳许多东西，意指聚敛；


        不要携带手杖，也就是说，不要易怒和好斗（гневливы и драчливы）；


        不要拥有两件外衣，也就是说，不要性情变幻无常（переменчивы в нравах）和思想二心（двоедушны в мыслях）。'
  - type: paragraph
    initial:
      ru: 'Лк 9:7. '
      cn: （路加福音 9:7）
    text:
      ru: 'Услышал Ирод четвертовластник о всём, что делалИисус,и недоумевал: ибо одни говорили, что это Иоанн восстал из мертвых;'
      cn: 〇分封之王伊罗德闻其凡所成者、则踌躇、因有人言是伊鄂昂由死中复活矣、
  - type: paragraph
    initial:
      ru: 'Лк 9:8. '
      cn: （路加福音 9:8）
    text:
      ru: другие, что Илия явился, а иные, что один из древних пророков воскрес.
      cn: 亦有人言是伊利亚现出、又他者言是古先知中之一复活矣、
  - type: paragraph
    text:
      ru: Ирод сей был малый, сын великого Ирода, избившего младенцев. Тот был царь, а этот –«четвертовластник». Он«недоумевал», кто бы такой был Иисус.
      cn: 这个希律是小希律，他是那个屠杀婴孩的大希律的儿子。那个希律曾是君王，而这个希律则是「四分封地君王」。他「困惑不解」，不知道耶稣到底是谁。
  - type: paragraph
    initial:
      ru: 'Лк 9:9. '
      cn: （路加福音 9:9）
    text:
      ru: 'И сказал Ирод: Иоанна я обезглавил; кто же Этот, о Котором я слышу такое? И искал увидеть Его.'
      cn: 伊罗德曰、伊鄂昂我已斩其首、今我闻斯人之如此、果为谁耶、乃寻求见之、
  - type: paragraph
    text:
      ru: 'Впрочем,«Иоанна, – говорит, –я обезглавил», и потому если он воскрес из мертвых, то я, увидев его, узнаю;«и искалслучаяувидеть»Иисуса. Смотри: евреи полагают воскресение мертвых в жизни плотской, в яствах и питиях. Ошибочно они думают, ибо воскресение не в пище и питии или в жизни плотской, но воскресшие живут так, как Ангелы Божии.'
      cn: 然而，「『约安，』他（指希律）说，『我已经斩了他的首』，因此如果他从死者中复活，那么我，若见了他，就会认出；『他就寻求机会看见』耶稣。」看哪：犹太人把死者的复活安置在肉身的生活中，在食物和饮品之中。他们思虑有误，因为复活不在食物和饮品中，亦不在肉身的生活中，但凡复活者，其生活如同上帝的安格洛斯一般。
  - type: paragraph
    initial:
      ru: 'Лк 9:10. '
      cn: （路加福音 9:10）
    text:
      ru: Апостолы, возвратившись, рассказали Ему, что́ они сделали; и Он, взяв их с Собою, удалился особо в пустое место, близ города, называемого Вифсаидою.
      cn: 诸宗徒返、以所行者报之、彼率之潜往、附近韦福斯伊达城之野地、
  - type: paragraph
    text:
      ru: Иисус, имея намерение совершить чудо над хлебами, уходит в пустое место, чтобы кто-нибудь не вздумал сказать, что хлебы принесены были из города, вблизи находящегося.
      cn: 耶稣，意图在饼上施行奇迹，就前往一个空旷之地，以免有人会想说，这些饼是从附近的城市带来的。
  - type: paragraph
    initial:
      ru: 'Лк 9:11. '
      cn: （路加福音 9:11）
    text:
      ru: Но народ, узнав, пошел за Ним; и Он, приняв их, беседовал с ними о Царствии Божием и требовавших исцеления исцелял.
      cn: 诸民知而随之、彼接之、与伊等告上帝国、需医者医之、
  - type: paragraph
    text:
      ru: Приняв народ, Он учил и исцелял, чтобы ты познал, что целомудрие наше разделяется на слово и дело и что как не должно говорить того, что неудобоисполнимо, так не должно делать того, о чем нелепо говорить.
      cn: 接纳了百姓后，祂便教导他们并医治他们，为的是让你知晓，我们的贞洁（целомудрие）被划分为言语与行为；并且，正如不应该说出那些难以实现（неудобоисполнимо）的事，同样也不应该做那些荒谬可言（нелепо говорить）之事。
  - type: paragraph
    initial:
      ru: 'Лк 9:12. '
      cn: （路加福音 9:12）
    text:
      ru: 'День же начал склоняться к вечеру. И, приступив к Нему, двенадцать говорили Ему: отпусти народ, чтобы они пошли в окрестные селения и деревни ночевать и достали пищи; потому что мы здесь в пустом месте.'
      cn: 日甫昃、 〇十二者来就告之曰、放民、使伊等往鄕村四周、投宿觅食、因我等在此乃野地、
  - type: paragraph
    text:
      ru: Когда день склонялся к вечеру, ученики, начавшие уже отличаться человеколюбивыми и пастырскими расположениями, сжалились о народе и сказали:«отпусти»их, то есть скорей уврачуй их болезни, исполни их прошения.
      cn: 当日甫向黄昏之际，门徒们——他们已开始展露出仁爱与牧者般的情怀——怜悯民众，便说：「释放」他们，即是说，尽快医治他们的疾患，成全他们的所求。
  - type: paragraph
    initial:
      ru: 'Лк 9:13. '
      cn: （路加福音 9:13）
    text:
      ru: 'Но Он сказал им: вы дайте им есть. Они сказали: у нас нет более пяти хлебов и двух рыб; разве нам пойти купить пищи для всех сих людей?'
      cn: 彼语之曰、尔等予之食、彼等曰、若我侪为此诸民不往市食、则我等除五饼二鱼无余耳、
  - type: paragraph
    text:
      ru: А Господь говорит ученикам:«вы дайте им есть». Говорит Он так не потому, будто не знал о скудости, но потому, что желал заставить учеников самих высказать, сколько они имеют хлебов, и таким образом чрез исповедание их, чрез объявление количества хлебов, явить все величие чуда.
      cn: 主对门徒们说：「你们给他们吃吧。」祂如此说，并非因祂不晓得他们的贫乏，而是因为祂期望使门徒们亲自说出他们有多少饼，如此，借着他们的陈述，借着对饼的数量的宣告，来彰显神迹的全部伟力。
  - type: paragraph
    initial:
      ru: 'Лк 9:14. '
      cn: （路加福音 9:14）
    text:
      ru: 'Ибо их было около пяти тысяч человек. Но Он сказал ученикам Своим: рассадите их рядами по пятидесяти.'
      cn: 盖约五千人、彼向其门徒曰、使伊等依五十列坐、
  - type: paragraph
    initial:
      ru: 'Лк 9:15. '
      cn: （路加福音 9:15）
    text:
      ru: И сделали так, и рассадили всех.
      cn: 即已如是行、使众皆坐、
  - type: paragraph
    text:
      ru: Повелевая ученикам рассадить народ рядами по пятидесяти, показывает, что и нам, когда принимаем какого-нибудь странника, должно успокоить его и прилагать всякое попечение о нем.
      cn: 教导门徒让民众分行而坐，每行五十人，他展示出，即便我们接待了任何异乡客，也应当使其得享安宁，并尽其所能施加一切关切照料。
  - type: paragraph
    initial:
      ru: 'Лк 9:16. '
      cn: （路加福音 9:16）
    text:
      ru: Он же, взяв пять хлебов и две рыбы и воззрев на небо, благословил их, преломил и дал ученикам, чтобы раздать народу.
      cn: 彼取五饼二鱼仰天福言擘之、而予门徒等使陈之于民前、
  - type: paragraph
    text:
      ru: Взирает на небо, чтобы показать, что и мы, намереваясь вкушать пищи, должны воссылать благодарение Богу. Дает Сам ученикам, а они потом уже и народу; это для того, чтобы не забывали о чуде, но вспоминали бы о нем при мысли, что они брали хлебы в свои руки.
      cn: 仰望天空，是为了表明：我们这些意图享用食物的人，也必须向上帝献上感恩。他亲自将食物递给门徒，然后门徒才递给民众；这是为了使他们不要忘记这神迹，而是每当想到他们曾亲手接过这些饼时，就会回忆起它。
  - type: paragraph
    initial:
      ru: 'Лк 9:17. '
      cn: （路加福音 9:17）
    text:
      ru: И ели, и насытились все; и оставшихся у них кусков набрано двенадцать коробов.
      cn: 皆食而饱、且拾其余屑十二筐、
  - type: paragraph
    text:
      ru: Остатков было двенадцать коробов, чтобы мы знали, какую силу имеет странноприимство и как умножается наше достояние, когда мы помогаем бедным.
      cn: 剩下的有十二个筐，好使我们明白「接待客旅」（странноприимство）拥有何等的力量，以及当我们帮助穷人时，我们的财产是如何增多的。
  - type: paragraph
    text:
      ru: Впрочем, об этом пространнее сказано в объяснении на Евангелие от Матфея(см.гл. 14
      cn: 此外，关于此事，在对《马太福音》的解释中已更详尽地论述了（参见第14章）。
  - type: paragraph
    initial:
      ru: 'Лк 9:18. '
      cn: （路加福音 9:18）
    text:
      ru: 'В одно время, когда Он молился в уединенном месте, и ученики были с Ним, Он спросил их: за кого почитает Меня народ?'
      cn: 〇适彼独处祈祷、门徒偕之在、彼问之曰、民言我为谁、
  - type: paragraph
    initial:
      ru: 'Лк 9:19. '
      cn: （路加福音 9:19）
    text:
      ru: 'Они сказали в ответ: за Иоанна Крестителя, а иные за Илию; другие жеговорят,что один из древних пророков воскрес.'
      cn: 对曰、为授洗者伊鄂昂、他者为伊利亚、余者为自古先知之一复活者、
  - type: paragraph
    initial:
      ru: 'Лк 9:20. '
      cn: （路加福音 9:20）
    text:
      ru: 'Он же спросил их: а вы за кого почитаете Меня? Отвечал Петр: за Христа Божия.'
      cn: 彼曰、然尔等言我为谁、而撇特儿答之曰、为上帝之合利斯托斯也、
  - type: paragraph
    initial:
      ru: 'Лк 9:21. '
      cn: （路加福音 9:21）
    text:
      ru: Но Он строго приказал им никому не говорить о сем,
      cn: 彼严戒伊等、勿以此告人、
  - type: paragraph
    initial:
      ru: 'Лк 9:22. '
      cn: （路加福音 9:22）
    text:
      ru: сказав, что Сыну Человеческому должно много пострадать, и быть отвержену старейшинами, первосвященниками и книжниками, и быть убиту, и в третий день воскреснуть.
      cn: 又曰人子当多受苦难、幷被长老司祭首学士等所弃且见杀、于第三日复活、
  - type: paragraph
    text:
      ru: Господь, вопрошая учеников, не спрашивает прямо, что они сами говорят, но прежде спрашивает о мнении народном, а потом о мнении уже их самих. Так поступает Он для того, чтобы показать несправедливость народной о Нем молвы и привести учеников к истинному понятию, что и было сделано. Ибо когда ученики сказали, что одни называют Тебя Иоанном, другие Илиею, Он«а вы», то есть вы отличные от всех, вы избранные, вы отделенные, кем Меня называете? Тогда Петр предваряет прочих и, сделавшись устами всех, исповедует Его Тем Христом Божиим, о Котором издавна проповедуется. Не просто Христом Божиим назвал Его, но Тем Христом Божиим, который есть собственно Христос Божий. Ибо многие были помазаны, но Тот Христос (Помазанник) Божий есть Единый и Единственный.
      cn: 主，在询问门徒时，并未直接问他们自己说了什么，而是首先询问了民众的意见，然后才询问了他们自己的意见。祂这样做，是为了表明民众关于祂的流言蜚语是不公允的，并引导门徒们认识真实的观念，而这一点也确实实现了。因为当门徒们说，有些人称祢为伊鄂昂，有些人称祢为以利亚时，祂说：「你们呢？」也就是说，你们与所有人不同，你们是蒙拣选的，你们是被分别出来的，你们称我为什么？于是彼得抢在其他人之前，成为了所有人的代言人，宣认祂是古时就被宣讲的、那基督上帝。他没有简单地称祂为基督上帝，而是称祂为那基督上帝（Тем Христом Божиим），这位基督上帝（Christos Bozhiy）才是真正的基督上帝。因为有许多人曾受膏抹（Помазаны），但那基督（受膏者）上帝是独一无二的。
  - type: paragraph
    initial:
      ru: 'Лк 9:23. '
      cn: （路加福音 9:23）
    text:
      ru: 'Ко всем же сказал: если кто хочет идти за Мною, отвергнись себя, и возьми крест свой, и следуй за Мною.'
      cn: 〇彼向众曰、人若愿从我、当舍己负己十字架而从我、
  - type: paragraph
    text:
      ru: 'Поскольку Христос сказал о Себе, что Сыну Человеческому надлежит«много пострадать», то присовокупляет нечто общее и вселенское, именно: не Я один претерплю смерть, но и все желающие последовать Мне должны отречься от самих себя, не иметь никакого общения с плотью, но презирать самих себя.'
      cn: 鉴于基督论及自己时曾说，人子「必多受苦」，祂便附带了某种普遍且普世性的东西，即：并非只有我独自承受死亡，而是所有愿意跟随我的人，都必须否认他们自己，不与肉体有任何交往，而是藐视他们自己。
  - type: paragraph
    text:
      ru: «Крестом» называет здесь смерть самую поносную; ибо не было иной так бесславной смерти, как смерть на кресте. Итак, Он объявляет, что тот, кто желает быть учеником Его, должен умереть смертью не славной, но поносной, будет убит как осужденный. Поскольку же многих убивают поносно как разбойников и злодеев, поэтому Он присовокупил:«и следуй за Мною», то есть упражняйся во всякой добродетели.
      cn: 此处祂称「十字架」为最羞辱的死；因为没有别的死，能像死在十字架上那样不光彩。所以，祂宣告说，那愿意作祂门徒的人，必须死于一种不光荣而是羞辱的死，并将如同被定罪者一般被杀害。又因有许多人作为强盗和作恶者，同样是以羞辱的方式被杀害，故此祂又附加说：「并跟从我」，也就是说，要在一切美德中操练自己。
  - type: paragraph
    initial:
      ru: 'Лк 9:24. '
      cn: （路加福音 9:24）
    text:
      ru: Ибо кто хочет душу свою сберечь, тот потеряет ее; а кто потеряет душу свою ради Меня, тот сбережет ее.
      cn: 盖凡愿拯救其生命者、将丧之、若为我而丧其生命者、反拯救之、
  - type: paragraph
    text:
      ru: «Кто хочет душу свою сберечь, тот потеряет ее», то есть если кто захочет жить по-мирскому, тот умрет душой.
      cn: 「谁愿意保全他的生命，就必丧失生命」，亦即，如果谁愿意按照世俗的方式生活，那么他的灵魂就会死亡。
  - type: paragraph
    initial:
      ru: 'Лк 9:25. '
      cn: （路加福音 9:25）
    text:
      ru: Ибо что пользы человеку приобрести весь мир, а себя самого погубить или повредить себе?
      cn: 人若获普世而自丧或害、何益之有、
  - type: paragraph
    initial:
      ru: 'Лк 9:26. '
      cn: （路加福音 9:26）
    text:
      ru: Ибо кто постыдится Меня и Моих слов, того Сын Человеческий постыдится, когда приидет во славе Своей и Отца и святых Ангелов.
      cn: 盖凡羞辱我及我之言者、迨人子于己与父及诸圣天神之荣光临时、亦羞辱之、
  - type: paragraph
    text:
      ru: 'Христа стыдится тот, кто говорит: как я буду веровать в распятого и поруганного Бога? А тот стыдится и слов Его, кто глумится над простотой Евангелия. Господь постыдится такового«во славе Своей», то есть во второе пришествие. Он говорит как бы так: как домовладыка, имея лукавого раба, стыдится звать его своим рабом, так и Я постыжусь наименовать Своим рабом того, кто отрекся от Меня.'
      cn: 羞辱基督的，是那说：「我怎能信一位被钉十字架且受侮辱的上帝？」的人。而嘲笑福音之淳朴的人，也羞辱了祂的话语。主必「在祂的荣耀里」羞辱这样的人，也就是说，在祂第二次降临时。祂仿佛是这样说的：就像一家之主，拥有一个邪恶的奴仆，却羞于称他为自己的奴仆；照样，我也羞于称那否认我的人为我的奴仆。
  - type: paragraph
    initial:
      ru: 'Лк 9:27. '
      cn: （路加福音 9:27）
    text:
      ru: 'Говорю же вам истинно: есть некоторые из стоящих здесь, которые не вкусят смерти, как уже увидят Царствие Божие.'
      cn: 我诚告尔、立于此者中有数人、未尝死、迨至得见上帝之国矣、
  - type: paragraph
    text:
      ru: Поскольку Он выше сказал:«Кто потеряет душу свою ради Меня, тот сбережет ее», то теперь, желая показать, каких благ удостоятся таковые, говорит:«есть некоторые из стоящих здесь, которые не вкусят смерти, как уже увидят Царствие Божие», то есть ту славу, в какой имеют быть праведные. Сказал Он это о Своем Преображении. Ибо Преображение было образом будущей небесной славы, и как Иисус в Преображении чудно возблистал как молния, так и тогда праведники просияют подобным же образом (Мф. 13, 43). Есть, – говорит, – несколько таких (Иоанн, Петр и Иаков), которые не умрут прежде, чем увидят, в какой славе будут Мои исповедники. А увидят они это во время Преображения.
      cn: 既然祂先前说过：「凡为我丧失自己性命的，必保全性命」（或译：谁为我失掉自己的灵魂，谁就必保全它），那么现在，祂意欲展现那些人将蒙受何等福祉，便说：「站在此处的数人中，有几位，未尝死，迨至已得见上帝之国矣」，即指义人将要拥有的那种荣耀。祂说此话是关于祂的变容。因为变容是未来天国荣耀的景象，正如耶稣在变容中奇妙地闪耀如电光，届时义人也将以同样的方式发光（马太福音 13:43）。祂说，有数人（伊鄂昂、彼得和亚适乌）不会死去，直到他们亲眼得见我的宣信者将在何等荣耀之中。而他们将在变容期间得见此景。
  - type: paragraph
    initial:
      ru: 'Лк 9:28. '
      cn: （路加福音 9:28）
    text:
      ru: После сих слов, дней через восемь,
      cn: 〇言此语之后、约越八日、伊伊稣斯遂携撇特儿、伊鄂昂及亚适乌、豋山为祈祷、
  - type: paragraph
    text:
      ru: Евангелист Матфей говорит, что Иисус взошел на гору тогда, как после этих слов прошло шесть дней (Мф. 17, 1), а Лука говорит, что прошло восемь дней. Ибо Матфей говорит об одних только промежуточных днях, а Лука – не о промежуточных только, но разумеет и тот день, в который эти слова были сказаны, и тот, в который совершилось Преображение.
      cn: 传福音者马太说，耶稣是在这些话语过去六天之后才登上那座山的（马太福音 17:1），而路加则说过去了八天。因为马太所说的只是中间间隔的日子，而路加所说的却不仅是中间间隔的日子，他还算上了说出这些话语的那一天，以及施行变容的那一天。
  - type: paragraph
    text:
      ru: взяв Петра, Иоанна и Иакова,
      cn: 「携撇特儿、伊鄂昂及亚适乌、」
  - type: paragraph
    text:
      ru: 'Иисус взял с Собой только троих: Петра как любящего, Иоанна как любимого и Иакова как пламенеющего ревностью по Нем, или как способных сокрыть событие, удержать в молчании и никому не сказывать.'
      cn: 伊伊稣斯仅带了三个人与他同去：撇特儿（彼得），是因着他爱主；伊鄂昂（伊鄂昂），是因着他为主所爱；以及亚适乌（亚适乌），是因着他为着主而满怀热切的嫉妒（或作：热情），又或者，（伊伊稣斯带他们）是因着他们能够隐藏此事件，能够守住沉默，不向任何人诉说。
  - type: paragraph
    text:
      ru: взошел Он на гору помолиться.
      cn: 祂登上山去祈祷。
  - type: paragraph
    text:
      ru: Чтобы помолиться, Иисус восходит на гору; ибо мы должны молиться в уединении, с восхождением, не преклоняясь ни к чему земному.
      cn: 为了祈祷，伊伊稣斯遂登上山；盖我等应当在于隐居中、带着上升来祈祷，不偏向任何尘世之物。
  - type: paragraph
    initial:
      ru: 'Лк 9:29. '
      cn: （路加福音 9:29）
    text:
      ru: И когда молился, вид лица Его изменился, и одежда Его сделалась белою, блистающею.
      cn: 彼祈祷之时、其容貌异常、其衣皎白光亮、
  - type: paragraph
    text:
      ru: Вид Его стал другой, не так, впрочем, будто бы Сам Он стал иной по существу, ибо Он оставался Тем же, Кем был, но вид лица Его явился гораздо светлейшим, чем прежде. Подобное произошло и с Его одеждой. Ибо только вид ее блистал молнией; существо одежды не переменялось, а только наружность.
      cn: 祂的容貌变了样，然而，并非说祂在本质上变得不同了，因为祂依然是祂本来的样式，但祂面容的容貌比先前显得更加光亮。祂的衣裳也发生了类似的变化。因为仅仅是衣裳的容貌闪耀着光芒；衣裳的本质没有改变，改变的只是外表。
  - type: paragraph
    initial:
      ru: 'Лк 9:30. '
      cn: （路加福音 9:30）
    text:
      ru: И вот, два мужа беседовали с Ним, которые были Моисей и Илия;
      cn: 顾有二人与之言、乃摩伊些乙、伊利亚、
  - type: paragraph
    text:
      ru: Когда Он молился, Ему предстояли Моисей и Илия, чтобы показать, что Он не был противник Закона и пророков. Ибо если б Он был противник, то Моисей, давший Закон, и Илия, ревностнейший из пророков, не дозволили бы себе служить Ему (наподобие телохранителей), ни даже быть с Ним.
      cn: 当他祷告时，摩伊些乙和伊利亚侍立在他面前，以显示他并非律法和先知们的敌对者。因为如果他是敌对者，那么颁布了律法的摩伊些乙，以及先知中最热心（*ревностнейший*）的伊利亚，就不会允许自己服侍他（犹如护卫），甚至不会与他同在。
  - type: paragraph
    initial:
      ru: 'Лк 9:31. '
      cn: （路加福音 9:31）
    text:
      ru: явившись во славе, они говорили об исходе Его, который Ему надлежало совершить в Иерусалиме.
      cn: 二人显于荣光中、言其终场之事将成于耶鲁萨利木、
  - type: paragraph
    text:
      ru: Они говорили о исходе, который Ему надлежало совершить в Иерусалиме, то есть о смерти Его.
      cn: 他们谈论祂将要在耶路撒冷成就的「出离」（исходе），也就是祂的死亡。
  - type: paragraph
    initial:
      ru: 'Лк 9:32. '
      cn: （路加福音 9:32）
    text:
      ru: Петр же и бывшие с ним отягчены были сном; но, пробудившись, увидели славу Его и двух мужей, стоявших с Ним.
      cn: 撇特儿与同在者、倦且假寐、既醒、见其荣光、及二人偕彼站立、
  - type: paragraph
    initial:
      ru: 'Лк 9:33. '
      cn: （路加福音 9:33）
    text:
      ru: 'И когда они отходили от Него, сказал Петр Иисусу: Наставник! хорошо нам здесь быть; сделаем три кущи: одну Тебе, одну Моисею и одну Илии, – не зная, что́ говорил.'
      cn: 迨二人离彼之时、撇特儿向伊伊稣斯曰、师欤、我侪在此善矣、我侪欲结三庐、一为尔、一为摩伊些乙、一为伊利亚、自不知其所言、
  - type: paragraph
    text:
      ru: 'В то время как Христос пребывал в молитве, Петр«отягченбыл сном», ибо он был слаб и, служа сну, отдавал должное человеческой природе. Когда же Петр пробудился, то увидел славу Христову и двух мужей. Находя такое пребывание здесь приятным по причине света и созерцания пророков, Петр говорит:«хорошо нам здесь быть»! Он думал, что теперь настала кончина мира и царство Иисусово. Но он не знал, что говорил. Ибо тогда еще не была кончина, еще не наступил день царства и наслаждения теми благами, коими будут обладать святые. Петр сказал это (хорошо нам здесь быть) вместе и потому, что опасался, что Христос будет распят. Он слышал от Христа, что Ему должно быть убитым и в третий день воскреснуть; поэтому и сказал это, выражаясь как бы так: не будем сходить с горы, будем здесь оставаться, чтобы избежать Креста и страдания; если придут на нас иудеи, то мы имеем помощником Илию, который свел с неба огонь и истребил пятьдесятоначальников; имеем Моисея, который поразил столько и таких народов. Сказал он это, не зная, что говорит. Ибо он думал, что крест есть зло, и притом мучительное, а поэтому, желая избежать его, и сказал это. Между тем Господь жаждал быть распятым, поскольку иначе не могло совершиться спасение людей.'
      cn: '当时，基督正在祷告，彼得「为睡所沉重」，因为他软弱，顺从睡眠，将应得的归于人性的本然。当彼得醒来时，他看见了基督的荣耀和那两位男子。由于此处的停留因着光亮和对先知们的瞻仰而令人愉悦，彼得说道：「我们在这里善矣」！他以为世界的末日和耶稣的国度已经来临了。但他并不知道他所说的是什么。因为那时末日尚未到来，国度之日和享用圣徒们将要拥有的那些美善尚未降临。


        彼得说出这句话（我们在这里善矣），部分原因是他害怕基督会被钉十字架。他曾听基督说过，祂必须被杀，并在第三日复活；因此，他这样表达，仿佛在说：我们不要下山，我们留在这里，以避开十字架和苦难；即使犹太人前来攻击我们，我们也有以利亚作为帮助者，他曾从天上降下火来，灭绝了五十夫长；我们有摩伊些乙，他曾击杀如此众多而强大的民族。


        他说了这话，却不知道他所说的是什么。因为他以为十字架是恶事，并且是令人痛苦的，因此，他希望避开它，故说了此话。然而，主切望被钉十字架，因为若非如此，人类的救恩就无法得以成就。'
  - type: paragraph
    initial:
      ru: 'Лк 9:34. '
      cn: （路加福音 9:34）
    text:
      ru: Когда же он говорил это, явилось облако и осенило их; и устрашились, когда вошли в облако.
      cn: 言此之际、有云覆之、彼等入于云中时甚惊惧、
  - type: paragraph
    text:
      ru: Тогда, как Петр говорил еще:«сделаем три кущи», Господь внезапно творит сень нерукотворенную и входит в нее с пророками, чтобы показать, что Он ничем не меньше Отца. Ибо как в Ветхом Завете Господь являлся в облаке, и Моисей входил в оное, и таким образом получил Закон (Исх. 19:9, 20:20–21), так и ныне облако обняло Христа, и облако не мрачное (ибо прошла тень Закона и мрак неведения), но облако светлое. Ибо истина пришла, и благодать Господня воссияла, и потому ныне ничего нет темного.
      cn: 正当彼得还在说：「我们做三座帐棚吧」时，主突然降下了一个非人手所造的荫庇（senn'），并同众先知一起进入其中，以表明他丝毫不亚于父。因为，正如在旧约中，主显现于云中，摩西进入其中，并因此领受了律法（出埃及记 19:9，20:20-21），同样地，如今这云也环抱了基督，而这云并非幽暗的（因为律法的阴影和无知的幽暗已经过去了），而是光明的云。因为真理已经降临，主的恩典已经照耀，故此如今再无任何黑暗。
  - type: paragraph
    initial:
      ru: 'Лк 9:35. '
      cn: （路加福音 9:35）
    text:
      ru: 'И был из облака глас, глаголющий: Сей есть Сын Мой Возлюбленный, Его слушайте.'
      cn: 自云有声云、此我之至爱子、尔等听从之、
  - type: paragraph
    text:
      ru: И исшел из облака глас, подобно как в Ветхом Завете слышан был из облака глас Божий.
      cn: 「有声音从云中出来，如同在《旧约》中，上帝的声音曾从云中被听见一样。」
  - type: paragraph
    initial:
      ru: 'Лк 9:36. '
      cn: （路加福音 9:36）
    text:
      ru: Когда был глас сей, остался Иисус один.
      cn: 发声时、见伊伊稣斯独在、彼等缄默有数日、不以所见告人、
  - type: paragraph
    text:
      ru: Иисус же остался один, чтобы кто не подумал, что слова:«Сей есть Сын Мой Возлюбленный»сказаны были о Моисее или об Илии. Впрочем, сим, быть может, означается и то, что Закон и пророки были до некоторого только времени, как и здесь видимы были Моисей и Илия, а потом, когда прошло их время, остался один Иисус. Ибо ныне господствует Евангелие, тогда как многое законное миновало.
      cn: 耶稣独自一人留下，是为了防止有人误以为：「这是我的爱子」这句话是论及摩西或以利亚而说的。然而，此情景或许也意指着律法和先知只持续到某一特定时期，就像在此处所见的摩西和以利亚一样，随后，当他们的时期过去，就只剩下耶稣一人。因为如今是福音掌权，而许多律法性的事物已然消逝。
  - type: paragraph
    text:
      ru: И они умолчали, и никому не говорили в те дни о том, что видели.
      cn: 他们缄默了，且在那些日子里，不向任何人述说他们所见之事。
  - type: paragraph
    text:
      ru: Апостолы умолчали и ничего не говорили о том, что видели. Прежде Креста и не следовало говорить об Иисусе что-нибудь богоприличное. Ибо какое о Нем составили бы мнение те, кои слышали это, а потом увидели Его распинаемым? Не сочли ли бы они Его обманщиком и мечтателем? Поэтому-то апостолы прежде Креста не проповедуют ни об одном чудесном и богоприличном деле Иисуса.
      cn: 使徒们保持沉默，对他们所见的一切只字不提。在十字架之前，谈论任何关于耶稣神性相称的事情都是不合适的。因为，那些听闻此事、随后又看到他被钉十字架的人，会对祂形成何种看法呢？难道他们不会认为祂是骗子和空想家吗？正因如此，使徒们在十字架之前，没有宣扬任何一桩耶稣所行的神迹和神性相称之事。
  - type: paragraph
    text:
      ru: Впрочем, об этом предмете достаточно сказано нами в объяснении на Евангелие от Матфея(см.гл. 17)
      cn: 然而，关于这个主题，我们已在《马太福音》的解释中说得够多了（见第 17 章）。
  - type: paragraph
    initial:
      ru: 'Лк 9:37. '
      cn: （路加福音 9:37）
    text:
      ru: В следующий же день, когда они сошли с горы, встретило Его много народа.
      cn: 〇翌日、彼等下山之时、庶民迎之、
  - type: paragraph
    initial:
      ru: 'Лк 9:38. '
      cn: （路加福音 9:38）
    text:
      ru: 'Вдруг некто из народа воскликнул: Учитель! умоляю Тебя взглянуть на сына моего, он один у меня:'
      cn: 顾民中一人呼曰、师欤、我求尔眷顾我子、彼乃我独生者、
  - type: paragraph
    initial:
      ru: 'Лк 9:39. '
      cn: （路加福音 9:39）
    text:
      ru: его схватывает дух, и он внезапно вскрикивает, и терзает его, так что он испускает пену; и насилу отступает от него, измучив его
      cn: 顾为邪神附之、倏而呼、拘挛之、使之喷沫、伤害之、强离而害之、
  - type: paragraph
    initial:
      ru: 'Лк 9:40. '
      cn: （路加福音 9:40）
    text:
      ru: Я просил учеников Твоих изгнать его, и они не могли.
      cn: 我曾求尔门徒为逐出之、而彼等不能也、
  - type: paragraph
    text:
      ru: Человек сей (о котором речь) был весьма неверующий. Поэтому и бес не выходил из сына его. Ибо неверие превозмогало силу апостолов. Неверие и дерзость его видны из того, что он пришел пред всеми обвинять учеников.
      cn: 此人（此处所指）极其不信。因此，恶魔才没有从他的儿子体内出去。因为不信压倒了使徒们的力量。他的不信和傲慢体现在他竟然来到众人面前指责门徒。
  - type: paragraph
    initial:
      ru: 'Лк 9:41. '
      cn: （路加福音 9:41）
    text:
      ru: 'Иисус же, отвечая, сказал: о, род неверный и развращенный! доколе буду с вами и буду терпеть вас?'
      cn: 伊伊稣斯答曰、噫嘻、不信且悖逆之世代、我偕尔等忍尔等、至几时乎、携尔子至此、
  - type: paragraph
    text:
      ru: Но Господь объявляет, что сын его не исцелен по причине его неверия, и пред всеми порицает его, и не одного его, но и прочих всех вообще. Ибо сказав:«о, род неверный»разумеет под этим всех иудеев, а словом«развращенный»показывает, что злоба их не от начала и не от природы. По природе они были добры (ибо они были святым потомством Авраама и Исаака), но развратились по своей злобе. Слова:«доколе буду с вами и буду терпеть вас»означают то, что Он желает восприять смерть и хочет скорее избавиться от них. Ибо, доколе, – говорит, – буду терпеть ваше неверие?
      cn: 主宣称，这孩子的儿子没有得蒙治愈，是由于他的不信，并且在众人面前斥责了他，所斥责的不只是他一人，而是普遍的所有其他人。因为，他说了：「嗐，不信的世代」，借此他所指的是所有犹太人，而以「悖逆的」一词表明他们的邪恶并非自始而有，也并非源于本性。按本性而言，他们曾是良善的（因为他们是阿乌拉阿阿木和以撒的圣洁后裔），但却因着自己的邪恶而败坏了。 「我偕尔等忍尔等，至几时乎」这句话的意思是：他渴望承受死亡，并想更快地摆脱他们。因为，他问：「我还要忍受你们的不信，直到何时呢？」
  - type: paragraph
    text:
      ru: приведи сюда сына твоего.
      cn: 请将你的儿子带到这里来。
  - type: paragraph
    initial:
      ru: 'Лк 9:42. '
      cn: （路加福音 9:42）
    text:
      ru: Когда же тот еще шел, бес поверг его и стал бить; но Иисус запретил нечистому духу, и исцелил отрока, и отдал его отцу его.
      cn: 彼行、来之时、魔鬼使之倾跌、而拘挛之、伊伊稣斯禁斥邪神、疗愈童子、以付其父、
  - type: paragraph
    text:
      ru: Господь, чтобы показать, что Он имеет силу, побеждающую неверие иудеев, говорит:«приведи сюда сына твоего»и, исцелив его,«отдал отцу его». Бесноватый прежде принадлежал не отцу своему, но злому духу, одержавшему его; а теперь Господь отдал его отцу, потерявшему его, а потом нашедшему.
      cn: 主，为了表明祂拥有战胜犹太人不信的权能，说：「把你的儿子带到这里来」，并且，在治愈了他之后，「把他交还给他的父亲」。那被鬼附者，先前不属于他自己的父亲，却属于那辖制他的恶灵；而如今，主把他交还给了那失去了他、而随后又寻回了他的父亲。
  - type: paragraph
    initial:
      ru: 'Лк 9:43. '
      cn: （路加福音 9:43）
    text:
      ru: 'И все удивлялись величию Божию. Когда же все дивились всему, что творил Иисус, Он сказал ученикам Своим:'
      cn: 皆奇异上帝之威严、 〇众又奇异凡伊伊稣斯所行者、时彼向其门徒曰、
  - type: paragraph
    initial:
      ru: 'Лк 9:44. '
      cn: （路加福音 9:44）
    text:
      ru: 'вложите вы себе в уши слова сии: Сын Человеческий будет предан в руки человеческие.'
      cn: 尔等以此言藏于己耳、即人子将被付于人手、
  - type: paragraph
    text:
      ru: 'Прочие«все дивились всему, что творил Иисус», а не одному только этому чуду. Но Иисус, оставив прочих, беседует с учениками, и говорит: все это, чудеса и слова о чудесах,«вложите вы себе в уши». Для чего? Так как Я имею быть предан и распят, то для того, чтобы вы, когда увидите Меня распятым, не подумали, что Я претерпел это по Своему бессилию. Ибо кто творит такие чудеса, тот мог бы и не быть распят.'
      cn: 至于「所有其余的人都对耶稣所做的一切感到惊奇」，他们惊奇的不是单单这一个神迹，而是「他所做的一切」。但耶稣撇下其余的人，却与门徒交谈，并说：「你们要把这一切，即神迹以及关于神迹的话语，『藏在你们耳中』。」为什么呢？因为我将要被出卖和钉十字架，这样，当你们看见我被钉十字架时，就不会认为我经历这些是出于我的无能。因为能行出这样神迹的人，本可以不被钉十字架。
  - type: paragraph
    initial:
      ru: 'Лк 9:45. '
      cn: （路加福音 9:45）
    text:
      ru: Но они не поняли сло́ва сего, и оно было закрыто от них,
      cn: 彼等不明此言、为彼等隐瞒、致不能达之、又不敢以此言问之、
  - type: paragraph
    text:
      ru: Для чего же это было? Для того чтоб они прежде времени не вдались в печаль и не смущались от страха. Итак, Бог, снисходя их слабости и руководя их как бы детей каких, попустил им не понять того, что говорилось о Кресте.
      cn: 这到底是为了什么？这是为了让他们不至于过早地陷入忧伤，不至于因恐惧而困惑不安。因此，上帝体恤他们的软弱，引导他们如同引导孩童一般，允许他们不明白所说的有关十字架的事。
  - type: paragraph
    text:
      ru: так что они не постигли его, а спросить Его о сем слове боялись.
      cn: 他们不明白他的意思，又不敢问他关于这个话语的事。
  - type: paragraph
    text:
      ru: Приметь и благоговение учеников, по которому они не дерзали, даже более боялись спросить Господа. Ибо страх усиливает благоговение, равно как и благоговение есть страх, растворенный любовью.
      cn: 请注意观察门徒的恭敬与敬畏，他们正是因为这种敬畏才不敢，甚至更害怕询问主。因为恐惧会强化恭敬，正如恭敬也是溶于爱中的恐惧一般。
  - type: paragraph
    initial:
      ru: 'Лк 9:46. '
      cn: （路加福音 9:46）
    text:
      ru: 'Пришла же им мысль: кто бы из них был больше?'
      cn: 于彼等衷起臆度、是彼等中谁为至大者也、
  - type: paragraph
    text:
      ru: Апостолов постигла страсть к пустой славе. Кажется, страсть эта возбудилась в них от того, что они не исцелили бесноватого. Вероятно, по сему случаю они заспорили, утверждая каждый со своей стороны, что отрок не был исцелен не по моему бессилию, но по бессилию такого-то, а отсюда загорелась распря и о том, кто бы из них был больше.
      cn: 使徒们被空虚的荣耀之情所侵袭。似乎是由于他们没有治愈那被鬼附的人，这种情欲在他们之中被激起。或许，正是在这个情况下，他们开始争论，每个人都从自己的一方声称：那少年人未被治愈，并非是由于我的无能，而是由于某某人的无能；由此，一场关于他们中谁是至大者的争执便燃烧起来了。
  - type: paragraph
    initial:
      ru: 'Лк 9:47. '
      cn: （路加福音 9:47）
    text:
      ru: Иисус же, видя помышление сердца их, взяв дитя, поставил его пред Собою
      cn: 伊伊稣斯见其心之臆度、取一童子立之于己前、
  - type: paragraph
    text:
      ru: Но Господь, зная сердце каждого, предваряет и, прежде чем страсть сия возросла, старается пресечь ее в самом корне. Ибо страсти в начале удобно преодолеть, а когда они возрастут, тогда уже весьма трудно бывает исторгать их. Как же Господь пресекает зло?«Взяв, сказано,дитя», показывает его ученикам, давая чрез сие знать им, что мы должны привести свой ум в такое состояние, в каком бывает он в детском возрасте; ибо дети бывают неопытны во зле, весьма просты и не волнуются помыслами ни славолюбия, ни желанием первенства пред другими.
      cn: 然而，主深知每个人的心，便预先阻止，并在这种情欲滋长之前，努力将其从根源处切断。因为情欲在开始时易于克服，而当它们滋长之后，再要将它们拔除就变得极其困难了。主是如何制止这恶的呢？经文说，「取了一孩童」，并将其展示给门徒，借此让他们明白，我们应当使自己的心智达到孩童时期所处的状态；因为孩童对恶事毫无经验，非常单纯，并且不受任何虚荣心（славолюбия）的念头或想要在他人面前居于首位的欲望所困扰。
  - type: paragraph
    initial:
      ru: 'Лк 9:48. '
      cn: （路加福音 9:48）
    text:
      ru: 'и сказал им: кто примет сие дитя во имя Мое, тот Меня принимает; а кто примет Меня, тот принимает Пославшего Меня; ибо кто из вас меньше всех, тот будет велик.'
      cn: 为彼等曰、凡因我之名、接此童子者、即接我、凡接我者、即接遣我者、盖于尔等中为至小者、此乃大也、
  - type: paragraph
    text:
      ru: '«Кто, – говорит, –примет сие дитя во имя Мое, тот Меня принимает». Слова сии такой имеют смысл: хотя вы думаете, что вы понравитесь многим и что вы очень многими будете приняты в таком случае, если будете казаться гордыми и славолюбивыми, но Я вам говорю, что Мне особенно приятна простота и что она служит отличительным признаком Моих учеников, так что, кто препростого и незлобивого мужа примет как Моего ученика (ибо это означает выражение«во имя Мое»), тот примет Меня. Ибо кто принимает гордого, тот не принимает ни ученика Моего, ни Меня.'
      cn: 「谁，——他说，——以我的名义接纳这孩童，就是接纳我。」这些话具有如下含义：虽然你们以为，如果你们显得骄傲而爱慕虚荣，你们就会取悦许多人，并会被许多人接纳；但我告诉你们，简单朴素对我而言尤其令人喜悦，并且它是我门徒的独特标志。因此，谁若接纳一个最简单朴素、毫不邪恶的人，将他视为我的门徒（因为「以我的名义」这个表达就是这个意思），谁就是接纳了我。因为谁接纳骄傲的人，谁就没有接纳我的门徒，也没有接纳我。
  - type: paragraph
    initial:
      ru: 'Лк 9:49. '
      cn: （路加福音 9:49）
    text:
      ru: 'При сем Иоанн сказал: Наставник! мы видели человека, именем Твоим изгоняющего бесов, и запретили ему, потому что он не ходит с нами.'
      cn: 〇伊鄂昂答曰、师欤、我侪见一人、因尔之名逐出魔鬼、我侪禁之、因其不从我等之故、
  - type: paragraph
    text:
      ru: Иоанн же, вступая в разговор, сказал:«Наставник! Мы видели человека, именем Твоим изгоняющего бесов, и запретили ему». Какая последовательность между словами Иоанна и словами Господа? Очень близкая. Поскольку Господь сказал, что«кто из вас меньше всех, тот будет велик», то Иоанн начал бояться, не худо ли они поступили, когда властно и гордо запретили тому человеку. Ибо запрещение кому-нибудь чего-нибудь обнаруживает в запрещающем не меньшего, но думающего о себе несколько более чем о том, кому он запрещает. Итак, Иоанн побоялся того, не гордо ли он поступил, запретив тому человеку.
      cn: 伊鄂昂则在加入对话时说：「导师！我们看见一个人，因你的名逐出魔鬼，而我们禁止了他。」伊鄂昂的话语与主的话语之间有何关联？非常紧密。因为主曾说：「你们中间最小的，他将为大」，所以伊鄂昂开始担心，他们专断又骄傲地禁止那个人，是否做得不对。因为禁止任何人做某事，都会在禁止者身上显明，他不是一个更小的人，而是自视比他所禁止的人稍微高傲。因此，伊鄂昂担心他禁止那人一事，是否是出于骄傲。
  - type: paragraph
    text:
      ru: Почему же ученики запретили этому человеку? Не по зависти, но потому, что считали его недостойным творить чудеса, так как он не получал вместе с ними благодати чудотворения, не был, как они, послан на то от Господа и вовсе не следовал за Иисусом. Что же Господь?
      cn: 门徒禁止此人，是何缘故？并非出于嫉妒，而是因为他们认为他不配行神迹，原因是他并未与他们一同领受行神迹的恩典，也未像他们一样受主差遣去做此事，并且全然没有跟随耶稣。那么，主又是如何回应的呢？
  - type: paragraph
    initial:
      ru: 'Лк 9:50. '
      cn: （路加福音 9:50）
    text:
      ru: 'Иисус сказал ему: не запрещайте, ибо кто не против вас, тот за вас.'
      cn: 伊伊稣斯向之曰、勿禁之、盖不攻尔等、即向尔等也、
  - type: paragraph
    text:
      ru: Оставьте, – говорит, – его делать это; ибо и он сокрушает силу сатаны. Поскольку же он не препятствует вам в деле проповеди, не действует заодно с диаволом – значит он за вас. Ибо кто не против Бога, тот за Бога, подобно как тот – с диаволом, кто не собирает с Богом.
      cn: 「放手，——」祂说，「让他做这事；因为他也正在粉碎撒旦的力量。既然他不阻碍你们的宣讲工作，不同魔鬼合力行事——那就说明他是支持你们的。因为凡不反对上帝的，就是支持上帝的，正如那不与上帝一同收聚的，就是与魔鬼在一起的。」
  - type: paragraph
    text:
      ru: Подивись, пожалуй, и силе имени Христова, как действовала благодать при одном произношении оного, хотя бы произносящие были и недостойны и не были учениками Христовыми. Таким же образом и чрез священников, хотя бы они были и недостойны, благодать действует, и все освящаются, хотя бы священник был и не чист.
      cn: 请看，也请你留意基督之名的力量，即使宣念这名的人不配，也不是基督的门徒，恩典也因着仅仅对这名的宣念而运行。同样地，即使司祭不配，恩典也借着司祭运行，众人皆得以被圣化，即使司祭不洁净。
  - type: paragraph
    initial:
      ru: 'Лк 9:51. '
      cn: （路加福音 9:51）
    text:
      ru: Когда же приближались дни взятия Егоот мира,Он восхотел идти в Иерусалим;
      cn: 〇彼被拘之日期将至、彼定其面向往耶鲁萨利木、
  - type: paragraph
    text:
      ru: Что означают слова:«Когда же приближались дни взятия Его»? То означают, что настало время, в которое нужно было уже Ему претерпеть за нас спасительное страдание и потом вознестись на небо и совосcесть с Богом и Отцом.
      cn: 「当祂被接的日子将到」这句经文是什么意思呢？它的意思就是，时候已经到了，祂就必须要为我们忍受那救赎性的苦难，然后升天，并与上帝和父一同坐席。
  - type: paragraph
    text:
      ru: Когда наступило время страдания Его и взятия от мира, Он рассудил не ходить уже то туда, то сюда, но взойти в Иерусалим. Выражение:«восхотел идти»(по церковно-славянски –«утверди лице Свое») то и означает, что Он определил, решил, положил твердое намерение идти в Иерусалим.
      cn: 当祂受难和离世的时候临近时，祂定意不再四处游走，而是上耶路撒冷去。 「切定其面向往」（教会斯拉夫语为：「坚其面」）这一表达所指的正是，祂判定、祂决定、祂定下坚固的意图，要前往耶路撒冷。
  - type: paragraph
    initial:
      ru: 'Лк 9:52. '
      cn: （路加福音 9:52）
    text:
      ru: и послал вестников пред лицем Своим; и они пошли и вошли в селение Самарянское; чтобы приготовить для Него;
      cn: 先遣数使在其面前、其出而入萨玛利亚之村、为彼预备、
  - type: paragraph
    initial:
      ru: 'Лк 9:53. '
      cn: （路加福音 9:53）
    text:
      ru: нотамне приняли Его, потому что Он имел вид путешествующего в Иерусалим.
      cn: 人不接之、因其面向、欲往耶鲁萨利木之故、
  - type: paragraph
    initial:
      ru: 'Лк 9:54. '
      cn: （路加福音 9:54）
    text:
      ru: 'Видя то́, ученики Его, Иаков и Иоанн, сказали: Господи! хочешь ли, мы скажем, чтобы огонь сошел с неба и истребил их, как и Илия сделал?'
      cn: 其门徒亚适乌及伊鄂昂见此曰、主欤、愿我侪告以天火降而灭之、如伊利亚所行者乎、
  - type: paragraph
    initial:
      ru: 'Лк 9:55. '
      cn: （路加福音 9:55）
    text:
      ru: 'Но Он, обратившись к ним, запретил им и сказал: не знаете, какого вы духа;'
      cn: 伊伊稣斯顾而责之曰、尔等不知属何如之神、
  - type: paragraph
    initial:
      ru: 'Лк 9:56. '
      cn: （路加福音 9:56）
    text:
      ru: ибо Сын Человеческий пришел не губить души человеческие, а спасать. И пошли в другое селение.
      cn: 盖人子来非为灭人命、乃为救之、遂往他村、
  - type: paragraph
    text:
      ru: 'Посылает«вестников пред лицом Своим», чтобы они приготовили какой-нибудь прием для Него. Хотя Он знал, что самаряне не примут Его, однако ж, послал вестников, чтобы отнять у самарян всякое извинение, чтобы впоследствии они не могли сказать, что мы приняли бы Его, если б Он послал кого-нибудь перед Собой. Поступил Он так вместе и для пользы учеников Своих, а именно: чтобы они, когда увидят Его на Кресте в оскорблении, не соблазнились, но из настоящего случая научились, что как теперь Он незлобиво перенес презрение от самарян и даже самим ученикам воспретил возбуждать в Нем гнев на обидчиков, так и тогда терпит распятие не потому, будто бы Он бессилен, но потому, что долготерпелив. Полезно это для учеников и в том отношении, что Господь собственным примером научает их быть незлобивыми. Ибо они, взирая на Илию, дважды истребившего огнем по пятидесяти человек с их начальниками, и будучи еще несовершенны, возбуждали Господа на мщение обидевшим Его. Но Господь, показывая им, что Его Закон выше жизни Илииной, запрещает им и отводит их от такого образа мыслей, а напротив, научил их переносить обиды с кротостью.'
      cn: 他「差派使者走在祂前头」，好让他们为祂预备一些接待之处。虽然祂知道撒马利亚人不会接纳祂，然而，祂还是差派了使者，以便剥夺撒马利亚人一切的借口，使他们日后不能说，倘若祂在祂之前差派了某人，我们就会接纳祂了。祂这样做同时也是为了祂的门徒的益处，即：使他们在看到祂带着羞辱被钉在十字架上时，不至于因此跌倒，而是从眼前此事中学到教训：正如祂现在不怀恶意地忍受了撒马利亚人的蔑视，甚至禁止门徒在祂身上激起对冒犯者的怒气，同样，祂那时忍受被钉十字架，也不是因为祂软弱无力，而是因为祂恒久忍耐。这对门徒而言也是有益的，因为主以自己的榜样教导他们要做到不怀恶意。因为门徒仰望以利亚，他曾两次用火烧灭了五十人及其首领，而门徒们尚不完全，故而他们怂恿主对冒犯祂的人施行报复。但主向他们表明，祂的律法高于以利亚的生命，禁止他们并使他们远离这种思维模式，相反地，教导他们要以温和忍受冒犯。
  - type: paragraph
    text:
      ru: 'Что означают слова:«но там не приняли Его, потому что Он имел вид путешествующего в Иерусалим»? Не то ли ими говорится, что не приняли Его потому, что Он вознамерился пойти в Иерусалим? И если так будем понимать, что самаряне не приняли Господа потому, что Он вознамерился пойти в Иерусалим, то непринявшие Его не оказываются ли невиновными? Можно сказать, что евангелист говорит так: не приняли Его, и Он не вошел в Самарию; потом как бы кто спросил: почему же не приняли Его против воли и Он не вошел; неужели потому, что Он был бессилен или не мог войти, хотя бы они и не желали? В разрешение сего евангелист и говорит: не потому не вошел Господь, будто бы для Него не было это возможно, но потому, что Он Сам не желал войти туда, но вознамерился идти прямо в Иерусалим. Ибо если б не было у Господа такого намерения, то Он вошел бы в селение самарян и в том случае, когда они не желали бы сего.'
      cn: '这些话：「但那里的人不接待他，因为他面向着耶路撒冷去。」是什么意思呢？它们所说的难道不是，他们之所以不接待祂，是因为祂打算前往耶路撒冷吗？如果我们将此理解为，撒马利亚人不接待主，是因为祂打算前往耶路撒冷，那么那些不接待祂的人，难道就不是无辜的了吗？


        可以这样说，这位传福音者是这样表述的：他们不接待祂，而祂也没有进入撒马利亚；接着，仿佛有人会问：他们为什么违背祂的意愿不接待祂，而祂却没进去呢？难道是因为祂无能，或者尽管他们不愿意，祂也无法进入吗？


        为了解决这个问题，这位传福音者说：主之所以没有进去，并不是因为这对祂来说不可能，而是因为祂自己不愿进去那里，而是打算直接前往耶路撒冷。因为如果主没有这个打算，那么即使撒马利亚人不愿意，祂也会进入那个村庄。'
  - type: paragraph
    initial:
      ru: 'Лк 9:57. '
      cn: （路加福音 9:57）
    text:
      ru: 'Случилось, что, когда они были в пути, некто сказал Ему: Господи! я пойду за Тобою, куда бы Ты ни пошел.'
      cn: 〇伊等行路时、有人向之曰、主欤、无论尔何往我欲从尔、
  - type: paragraph
    initial:
      ru: 'Лк 9:58. '
      cn: （路加福音 9:58）
    text:
      ru: 'Иисус сказал ему: лисицы имеют норы, и птицы небесные – гнезда; а Сын Человеческий не имеет, где приклонить голову.'
      cn: 伊伊稣斯语之曰、狐狸有穴、天空之鸟有巢、惟人子无枕首之处、
  - type: paragraph
    text:
      ru: 'Сей, пришедший к Иисусу и просивший позволения пойти за Ним, пришел с лукавой мыслью. Видя, что за Господом следует много народа, он подумал, что Господь собирает с них деньги, и сам пришел к мысли, что он составит себе имение, если последует за Иисусом. Поэтому Господь отверг его, говоря ему как бы так: ты думаешь чрез последование за Мной составить себе имение, полагая, что такова Моя жизнь, но на деле не так; Я учу и проповедую такую бедность, что не имею и дома Своего, тогда как прочие животные имеют норы. И таким образом отверг его.'
      cn: 这位来到耶稣跟前，请求允许跟随祂的人，是带着狡诈的心思来的。他看见许多人跟随主，便认为主正在向他们收敛钱财，他自己也产生了一个念头：如果他跟随耶稣，他就能为自己积攒一份家产。因此，主拒绝了他，仿佛是这样对他说：你以为通过跟随我，你可以为自己积攒一份家产，你以为我的生活就是这样的，但事实并非如此；我教导并宣扬一种贫乏，以至于我连自己的家都没有，而其他的动物却有它们的巢穴。主就这样拒绝了他。
  - type: paragraph
    initial:
      ru: 'Лк 9:59. '
      cn: （路加福音 9:59）
    text:
      ru: 'А другому сказал: следуй за Мною. Тот сказал: Господи! позволь мне прежде пойти и похоронить отца моего.'
      cn: 又向他人曰、尔可从我、其对曰、主欤、容我先往葬我父、
  - type: paragraph
    initial:
      ru: 'Лк 9:60. '
      cn: （路加福音 9:60）
    text:
      ru: 'Но Иисус сказал ему: предоставь мертвым погребать своих мертвецов, а ты иди, благовествуй Царствие Божие.'
      cn: 伊伊稣斯谓之曰、任死者、葬其死者、而尔往传上帝之国耳、
  - type: paragraph
    text:
      ru: 'А другому, который и не просил, позволяет следовать. Когда же сей спросил позволения сходить и«похоронить отца»своего, Господь не позволил, но сказал: оставь мертвым хоронить своих мертвых. Сим намекается, что отец его был неверующий и потому недостойный пропитываться в старости от сына своего, который уверовал. Предоставь, – говорит, – родственникам«мертвым», то есть неверующим, питать в старости и до гроба неверующего отца твоего. Ибо похоронить здесь означает иметь попечение до самого гроба, – поскольку и в обыкновенной беседе мы говорим: такой-то сын похоронил своего отца, и через сие разумеем не то, что он похоронил его и не сделал ему никакого другого добра, но то, что имел попечение о нем до самой смерти и погребения. Итак, пусть эти мертвые, то есть неверующие, похоронят своего мертвеца, то есть твоего отца. А поскольку ты уверовал, то, как Мой ученик, проповедуй Евангелие Божие. Господь, сказав это, не запрещает нам питать родителей, но научает нас богопочтение предпочитать неверующим родителям и не иметь никакого препятствия к добродетели, но презирать и самую природу.'
      cn: 然而对另一个人，他甚至没有请求，就允许他跟随。当那人询问可否允许他去「埋葬他的父亲」时，主没有允许，而是说：任死者，葬其死者。此处暗示，他的父亲是不信者，因此不配从他已信主的儿子那里获得晚年供养。他说：「将你的不信的父亲，在晚年和直到坟墓，留给『死者』，即不信的亲属去供养吧。」因为在此处「埋葬」意味着直到坟墓前的照料——因为在日常谈话中，我们也说：某某儿子埋葬了他的父亲，借此我们所理解的并非是他埋葬了他而没有为他做任何其他善事，而是说他照料他直到死亡和下葬。因此，让这些死者，即不信者，去埋葬他们的死人，即你的父亲吧。而既然你已信主，那么作为我的门徒，就去传扬上帝的福音吧。主说这话，并非禁止我们供养父母，而是教导我们，应将对上帝的敬畏置于不信的父母之上，不要让任何事物阻碍美德，甚至要轻视人性本身。
  - type: paragraph
    initial:
      ru: 'Лк 9:61. '
      cn: （路加福音 9:61）
    text:
      ru: 'Еще другой сказал: я пойду за Тобою, Господи! но прежде позволь мне проститься с домашними моими.'
      cn: 又一人曰、主欤、我欲从尔、但容先辞别我家人、
  - type: paragraph
    initial:
      ru: 'Лк 9:62. '
      cn: （路加福音 9:62）
    text:
      ru: 'Но Иисус сказал ему: никто, возложивший руку свою на плуг и озирающийся назад, не благонадежен для Царствия Божия.'
      cn: 伊伊稣斯乃向之曰、凡人举手扶犁、而顾后者、在上帝国无妥当也、
  - type: paragraph
    text:
      ru: Так человеку, который просил позволения следовать за Ним, но прежде отдать должное домашним своим, Он не позволил сего, то есть сходить в дом свой и отдать должное или, скажу проще, проститься. Ибо такой человек обнаруживает в себе привязанность к миру и отсутствие апостольского расположения; ибо апостолы, как услышали призвание от Господа, тотчас последовали за Ним, ничем иным уже не занимались, а оставили даже и прощание с родными. И часто случается, что в то время как человек прощается со своими родственниками, между ними оказываются такие, кои удерживают его от богоподобной жизни, Поэтому хорошо, имея расположение к добру, тотчас же и совершать оное, нимало не медля. Ибо никто, взявшийся за плуг духовный и снова оглядывающийся на мир, не способен к Царству Небесному.
      cn: 对于那个请求准许跟随祂、但此前要向家中亲属尽职尽责的人，祂不准许他这样做，即不准许他回到家中并尽职尽责，或者，我直白地说，不准许他告别。因为这样的人显露出他对世界的依恋，并缺乏使徒性的性情；因为使徒们一听到主的呼召，就立刻跟随了祂，不再忙于任何别的事情，甚至放弃了与亲属告别。并且，人向他的亲戚告别时，经常会发生这样的情况：在他的亲戚中，会有一些人挽留他，使他偏离那敬神的生活。因此，心怀向善的性情时，最好是立刻就去完成它，丝毫不要耽延。因为凡是手扶属灵的犁、又回望世界的人，都不适宜于天国。
  - type: paragraph
    text:
      ru: 'Под«лисицами»разумей лукавых бесов; они же называются и птицами небесными, то есть воздушными; ибо сказано:«по воле князя, господствующего в воздухе»(Еф. 2, 2). Итак, Господь говорит упомянутому человеку: поскольку бесы имеют в тебе норы, то Я, Сын Человеческий, не имею, где главу приклонить, то есть в сердце твоем, полном бесов, Я не вижу места для веры в Меня. Ибо глава Христа есть вера в Него. Кто уверует, что Христос есть Бог, тот получает главу Христову. А грешник мертв; он и погребает своих мертвецов, то есть лукавые помыслы, тем, что не исповедует их. Итак, Господь намеревающемуся быть Его последователем запрещает погребать лукавый помысл и скрывать оный, но повелевает обнаруживать его через исповедь.'
      cn: 「狐狸」（лисицами）之下，你要理解为狡猾的魔鬼（бесов）；它们也被称作天上的飞鸟（птицами небесными），即空中（воздушными）的飞禽；因为经文说：「顺从那掌管空中权柄的首领」 （以弗所书 2:2）。因此，主对所提到的那人说：既然魔鬼在你心中有洞穴（норы），那么我，人子，就没有可枕首之处（главу приклонить），也就是说，在你这充满魔鬼的心中，我看不见能让我产生信仰的空间。因为基督的首（глава）就是对祂的信仰。谁若确信基督是上帝，谁就获得了基督的首。而罪人是死的；他正在埋葬他的死者（мертвецов），也就是说，他通过不告解（исповедует）这些恶念（лукавые помыслы）来埋葬它们。因此，主禁止那个打算成为祂追随者的人去埋葬恶念并隐藏它，反而命令他通过告解将其显露出来。
- type: heading1
  text:
    ru: Глава десятая
    cn: 第十章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 10:1. '
      cn: （路加福音 10:1）
    text:
      ru: После сего избрал Господь и других семьдесятучеников,и послал их по два пред лицем Своим во всякий город и место, куда Сам хотел идти,
      cn: 〇厥后、主又选立他七十者、乃各依二人遣彼等、于其面前往各城各处、即其自所欲往者、
  - type: paragraph
    text:
      ru: 'В книге Исхода написано:«И пришли в Елим; тамбылодвенадцать источников воды и семьдесят финиковых дерев»(Исх. 15, 27). Что случилось тогда исторически и образно, то ныне сбылось в действительности. Елим – значит восхождение. Этим не другое что означается, как то, что мы, восходя в совершеннейшее разумение и в духовный возраст и не останавливаясь, как евреи, на Законе, но востекая в христианство, найдем двенадцать источников, то есть двенадцать верховных апостолов, которые суть источники всякого сладчайшего учения. Найдем и семьдесят финиковых стеблей, то есть (семьдесят) апостолов. Они не называются источниками, но финиками, как воспитываемые и руководимые от апостолов (верховных). Ибо хотя и сих семьдесят апостолов Христос же избрал, но они были ниже двенадцати, и впоследствии были их учениками и спутниками. Итак, сии финики напитались от источников, то есть от апостолов, и нам доставили плод сладкий и вместе умеренно кислый. Учение святых действительно таково: оно не совсем услаждает и ласкает и не совсем стесняет и поражает, но совмещает то и другое свойство, и поистине приправлено солью и соединено с благодатью, как и апостол Павел взывает:«Слово вашеда будетвсегда с благодатию, приправлено солью»(Кол. 4, 6). Господь избирает«семьдесят»учеников по причине множества нуждающихся в учении. Ибо как поля с хорошим урожаем требуют много жнецов, так и для верующих, поскольку их имело быть бесчисленное множество, настояла нужда во многих учителях.'
      cn: 在《出埃及记》中记述道：「他们来到了以琳，在那里有十二股水泉，和七十棵棕榈树」（出埃及记 15:27）。昔日历史性与象征性所发生之事，如今在现实中已然实现。以琳（Elim）意指「上升」（восхождение）。这所指的，不是别的，正是我们：我们上升至最完美的理解与属灵的年岁，不像犹太人那般止步于律法，而是上升至基督教，便能寻得十二股水泉，即十二位居于至高地位的宗徒（верховных апостолов），他们是所有最甘甜教义的源泉。我们也能寻得七十根棕榈树的茎干，即七十位宗徒（апостолов）。他们不被称为水泉，而是棕榈树，因他们是由（居于至高地位的）宗徒所培育和引导的。因为，尽管这七十位宗徒也是基督所选立的，但他们地位低于十二宗徒，并且在后来成为了十二宗徒的门徒和同伴。因此，这些棕榈树从水泉中汲取养分，即从宗徒那里汲取养分，并为我们提供了既甘甜又适度微酸的果实。圣者的教义确实如此：它并非全然甜蜜和谄媚，也并非全然束缚和打击，而是兼具这两种特质，并且确确实实以盐调味并与恩典结合在一起，正如宗徒保罗呼求道：「你们的言语总要带着恩典，用盐调和」（歌罗西书 4:6）。主选立「七十位」门徒，是因有大量需要教诲的人。因为正如丰收的田地需要许多收割者，对于信徒而言，由于他们注定会是数不胜数的一群，因此迫切需要许多教师。
  - type: paragraph
    initial:
      ru: 'Лк 10:2. '
      cn: （路加福音 10:2）
    text:
      ru: 'и сказал им: жатвы много, а делателей мало; итак, молите Господина жатвы, чтобы выслал делателей на жатву Свою.'
      cn: 向伊等曰、穑乃多、而工者少、故求穑主为遣工者至其穑也、
  - type: paragraph
    text:
      ru: Господь посылает их«по два»для того, чтобы они были безопаснее и друг другу содействовали. Они ходили пред лицом Его, то есть подобно Иоанну учили:«приготовьте путь Господу»(Мф. 3, 3). Примечай, как Он прежде сказал:«молите Господина жатвы, чтобы выслал делателей», а потом Сам Своей властью посылает их. Ибо Он, как истинный Бог, есть поистине Господин жатвы, то есть верующих.
      cn: 主差遣他们「两个两个地」，是为了让他们更安全，并且彼此相互协助。他们走在祂的面容之前，也就是说，他们像约安一样教导：「预备主的道路」（马太福音 3:3）。请注意，祂先前如何说：「你们要祈求穑主，为遣工者」，然后祂又亲自凭自己的权柄差遣他们。因为祂，作为真实的上帝，确实是穑主，即信者之主。
  - type: paragraph
    initial:
      ru: 'Лк 10:3. '
      cn: （路加福音 10:3）
    text:
      ru: Идите! Я посылаю вас, как агнцев среди волков.
      cn: 往哉、我遣使尔等、如羊羔在群狼之中、
  - type: paragraph
    text:
      ru: Наперед говорит им о гонениях и о том, что они будут как агнцы среди волков, для того чтобы сии, напав на них неожиданно, не смутили их внезапностью.
      cn: 首先，他预先向他们讲述了关于逼迫的事，讲述了他们将如同群狼中的羔羊，这样做是为了使那些突如其来的攻击不会因其意外性而使他们感到困惑不安。
  - type: paragraph
    initial:
      ru: 'Лк 10:4. '
      cn: （路加福音 10:4）
    text:
      ru: Не берите ни мешка, ни сумы́, ни обуви,
      cn: 勿袋、勿囊、勿履、途中勿问人安、
  - type: paragraph
    text:
      ru: 'Поскольку Господь намерен послать учеников с проповедью Евангелия, то говорит им:«не берите ни мешка», ни того, ни сего; ибо для вас достаточно быть заботливыми о слове. А если вы будете носить мешок, очевидно, вы будете им заняты, а о слове начнете нерадеть. Иначе: поскольку вас будут питать те, коих вы будете учить, то какая вам нужда в мешке или суме, или в сапогах? Ибо наставляемые вами удовлетворят всякой вашей нужде в них.'
      cn: 因为主意欲差遣门徒去宣讲福音，所以祂对他们说：「不要携带袋子」，任何别的物件也不要携带；因为对你们而言，专心于圣道就已足够。而如果你们携带袋子，显然你们会为之忙碌，从而开始疏忽圣道。换言之：既然你们所教导的人会供养你们，那么你们何须袋子、钱囊，或靴子呢？因为受你们教诲的人，必会满足你们对这些物件的一切需求。
  - type: paragraph
    text:
      ru: и никого на дороге не приветствуйте.
      cn: 并且在路上不要向任何人问安。
  - type: paragraph
    text:
      ru: Так заповедует им для того, чтобы они не занимались людскими приветствиями и ласками и чрез то не полагали бы препятствия делу проповеди. Ибо, вероятно, получивший приветствие ответил бы и сам приветствием, а может быть, вступил бы в продолжительный разговор, как обыкновенно делают спутники, а потом, как бы уже подружившись, заговорился бы о чем-нибудь еще более, и таким образом апостол ниспал бы в обычные людские отношения, а о слове вознерадел бы. По указанной причине Господь и запрещает ученикам приветствовать кого-нибудь на дороге.
      cn: 这样，祂命令他们，为的是叫他们不致忙于人间的问候与爱抚，并且借此不给宣讲之事设置障碍。因为，那接受问候的人，很有可能自己也会以问候作答；又或许他会陷入一场冗长的交谈，如同旅伴们通常所做的那样；接着，仿佛已经结为朋友了，他会再多谈论一些别的什么，而使徒便会因此而跌入到通常的人际关系之中，并会对圣言变得疏忽。由于上述原因，主才禁止门徒在路上问候任何人。
  - type: paragraph
    initial:
      ru: 'Лк 10:5. '
      cn: （路加福音 10:5）
    text:
      ru: 'В какой дом войдете, сперва говорите: мир дому сему;'
      cn: 无论入何家、先曰、安和予此家、
  - type: paragraph
    initial:
      ru: 'Лк 10:6. '
      cn: （路加福音 10:6）
    text:
      ru: и если будет там сын мира, то почиет на нём мир ваш, а если нет, то к вам возвратится.
      cn: 如在此有安和之子、尔等之安和安止之、不然、则仍归尔、
  - type: paragraph
    text:
      ru: '«В какой, – говорит, –дом войдете, сперва говорите: мир дому сему», то есть приветствуйте находящихся в доме; потом показывая, что это не простое только приветствие, а вместе и благословение, говорит: если домохозяин будет достоин, то он будет благословен, а если он обидчик и неспособен к принятию мира, если он враг и противник вашего слова и учения, то благословение не придет к нему, но«к вам возвратится».'
      cn: 「他说，『无论进入哪一家，首先要说：愿这家里平安，』即是说，要向屋内之人致以问候；」接着，他指出这不仅是一个简单的问候，更是一同而来的祝福，他说：「如果那家主是配得的，他就会蒙受祝福；但如果他是施暴者，是不适合领受平安的，如果他是你们的言语和教导的仇敌和反对者，那么祝福就不会降临于他，而是『归于你们』。」
  - type: paragraph
    initial:
      ru: 'Лк 10:7. '
      cn: （路加福音 10:7）
    text:
      ru: В доме же том оставайтесь, ешьте и пейте, что у них есть, ибо трудящийся достоин награды за труды свои; не переходите из дома в дом.
      cn: 居其家、在彼食饮、随其所有、盖工得其值、宜也、尔等勿自此家移彼家、
  - type: paragraph
    initial:
      ru: 'Лк 10:8. '
      cn: （路加福音 10:8）
    text:
      ru: И если придёте в какой город и примут вас, ешьте, что вам предложат,
      cn: 无论入何城、而人接尔等者、则食于尔等所陈者、
  - type: paragraph
    text:
      ru: Заповедует не переходить из дома в дом, чтобы апостолы не показались чревоугодниками, не подали бы многим повода к соблазну и не оскорбили бы тех, кои приняли их в начале.«Ешьте, – говорит, –и пейте, что у них есть», то есть что предложат вам, и хотя бы то было мало и небогато, большего не требуйте. Пищу принимайте вместо награды, то есть не ищите того, чтобы вам получать пищу и плату особо, но самую пищу принимайте за награду. Смотри, как Он учеников Своих делает твердыми против бедности.
      cn: 他命令（他们）不要从一家到另一家去，以免使徒们显得像是贪食者（chrevougodnikami），以免他们给许多人提供跌倒的缘由，也以免他们冒犯那些起初接待他们的人。「吃，」他说，「也喝他们那儿有的东西」，即，凡他们将要摆在你面前的，即便那很少且不富裕，也不要索求更多。你们接受食物作为报酬，即，你们不要寻求同时获得食物和报酬，而是把食物本身当作报酬来接受。你看，祂如何使祂的门徒们在贫困面前变得刚强。
  - type: paragraph
    initial:
      ru: 'Лк 10:9. '
      cn: （路加福音 10:9）
    text:
      ru: 'и исцеляйте находящихся в нём больных, и говорите им: приблизилось к вам Царствие Божие.'
      cn: 疗愈其中负病者、且告之曰、上帝之国近尔等矣、
  - type: paragraph
    text:
      ru: 'Заповедует исцелять больных, находящихся в городах, для того, чтобы апостолы своими чудотворениями могли привлечь людей к проповеди. Ибо смотри, что говорит:«и говорите им: приблизилось к вам Царствие Божие». Ибо если вы прежде исцелите, а потом станете учить, проповедь ваша будет благоуспешна, и люди уверуют, что до них достигло Царствие Божие. Ибо они не были бы исцелены, если б не совершила сего некоторая Божественная сила. Да и к больным тогда приблизилось Царство Божие, когда они по душе исцелены. Ибо оно далеко от больного, над которым еще царствует грех.'
      cn: '（来自圣奥赫里德的狄奥菲拉克）


        他命令（使徒）们去疗愈城中的病患，好让使徒们能以其神迹奇事吸引人们来听宣讲。因为请看，他说些什么：「且告之曰：上帝之国近尔等矣」。因为若你们先施予疗愈，然后再开始教导，你们的宣讲就会顺利成功，人们也会相信上帝之国已临近他们。因为若非某种神圣力量成就此事，他们本无法被疗愈。此外，上帝之国那时也已临近病患，即当他们灵魂获得疗愈之时。因为对于那仍受罪恶所辖制的病患，上帝之国对他而言是遥远的。'
  - type: paragraph
    initial:
      ru: 'Лк 10:10. '
      cn: （路加福音 10:10）
    text:
      ru: 'Если же придете в какой город и не примут вас, то, выйдя на улицу, скажите:'
      cn: 无论入何城、而人不接尔等者、则出、于其衢曰、
  - type: paragraph
    initial:
      ru: 'Лк 10:11. '
      cn: （路加福音 10:11）
    text:
      ru: и прах, прилипший к нам от вашего города, отрясаем вам;
      cn: 由尔城所沾之尘、对尔拂去、然仍当知此、上帝之国近尔等矣、
  - type: paragraph
    text:
      ru: «Если..., – говорит, –не примут вас, то, выйдя на улицу, скажите»им, что у нас ничего нет общего с вами, мы ничего не имеем от вашего города, даже и пыль, прилипшую к нам, мы сметаем, то есть отрясаем, очищаем и бросаем на вас;
      cn: 「如果，」他说，「他们不接待你们，你们就走到街上告诉他们，我们与你们毫无共同之处，我们没有从你们的城里得到任何东西，甚至连粘在我们身上的尘土，我们也要扫掉，即抖落，洁净并抛洒在你们身上；
  - type: paragraph
    text:
      ru: однако же знайте, что приблизилось к вам Царствие Божие.
      cn: 然而，你们仍当知晓，上帝的国已近于你们。
  - type: paragraph
    text:
      ru: 'Здесь спросит иной: как Господь говорит, что Царствие Божие приблизилось и к тем, кои принимают апостолов, и к тем, кои не принимают их? Нужно сказать, что Он нисколько не противоречит Себе. Ибо к тем, кои принимают апостолов, Царствие приближается с благодеяниями, а к тем, кои не принимают, с осуждением. Ибо, прошу тебя, представь себе, что на каком-нибудь зрелище находится много одних осужденных, а других неосужденных, например, сенаторов, полководцев и вельмож, потом какой-нибудь глашатай всем вместе, осужденным и почетным, возвещает: царь приблизился к вам! Не то ли он говорит, что к одним из них царь приблизился для наказания, а к другим, чтобы оказать им честь и благоволение? Таким же образом и здесь понимай.'
      cn: '此处有人会问：主如何说上帝之国已临近那些接受使徒之人，也临近那些不接受使徒之人呢？


        必须说，祂丝毫不自相矛盾。因为对于那些接受使徒之人，上帝之国是带着恩惠临近的；而对于那些不接受使徒之人，则是带着定罪临近的。


        因为，我恳请你设想一下，在某个景观之中，有许多人，其中一些是被定罪的，另一些是未被定罪的，例如，元老、统帅和显贵。接着，某个传令官向所有这些人，无论是被定罪的还是受敬重的，一同宣告：「君王临近你们了！」他所说的，难道不是指君王临近他们之中的一些人是为了惩罚，而临近另一些人是为了向他们施予荣耀和恩宠吗？


        以同样的方式来理解此处即可。'
  - type: paragraph
    initial:
      ru: 'Лк 10:12. '
      cn: （路加福音 10:12）
    text:
      ru: Сказываю вам, что Содому в день оный будет отраднее, нежели городу тому.
      cn: 我告尔等、于彼日、莎多木人较此城犹易忍受、
  - type: paragraph
    text:
      ru: «Отраднее, – говорит, – будетСодому,... нежели городу тому», который не принял вас. Почему? Потому, что в Содом не были посланы апостолы, и поэтому непринявшие апостолов – хуже содомлян. Заметь и то, что город, не принимающий апостолов, имеет широкие улицы; а широкий путь приводит к погибели. Итак, кто ходит широкими дорогами, ведущими к погибели, тот не принимает апостольского и Божественного учения.
      cn: '「他（主）说，『对于所多玛来说，日子会更轻松，... 比起那个没有接纳你们的城市来』。」为什么这么说？因为使徒们没有被派往所多玛，因此，不接纳使徒的人比所多玛人更差。


        也请注意，不接纳使徒的城市拥有宽阔的街道；而宽阔的道路引向灭亡。因此，凡是行走于引向灭亡的宽阔道路的人，他就不接纳使徒的与神圣的教导。'
  - type: paragraph
    initial:
      ru: 'Лк 10:13. '
      cn: （路加福音 10:13）
    text:
      ru: Горе тебе, Хоразин! горе тебе, Вифсаида! ибо если бы в Тире и Сидоне явлены были силы, явленные в вас, то давно бы они, сидя во вретище и пепле, покаялись;
      cn: 祸哉、尔等霍拉精、祸哉、尔微福萨伊达、盖在尔等中所施之异能、若行于提儿及西东、则彼等早衣麻蒙灰、坐而改悔矣、
  - type: paragraph
    initial:
      ru: 'Лк 10:14. '
      cn: （路加福音 10:14）
    text:
      ru: но и Тиру и Сидону отраднее будет на суде, нежели вам.
      cn: 然提儿及西东于审判、较尔等犹易忍受、
  - type: paragraph
    initial:
      ru: 'Лк 10:15. '
      cn: （路加福音 10:15）
    text:
      ru: И ты, Капернаум, до неба вознесшийся, до ада низвергнешься.
      cn: 喀撇儿那屋木乎、尔曾举升至天、而将堕落于地狱、
  - type: paragraph
    text:
      ru: Тир и Сидон были города языческие, а Вифсаида и Хоразин – иудейские. Итак, Он говорит, что на суде язычникам будет отраднее, нежели вам, видевшим чудеса и неуверовавшим; ибо если бы они видели, они уверовали бы. Да и ты, Капернаум, вознесшийся до небес, как прославленный многими чудесами, совершившимися в тебе, низвергнешься до ада; ты будешь осужден за то самое, что и после стольких чудес не веруешь.
      cn: 推罗和西顿是异教城市，而伯赛大和哥拉汛是犹太城市。既然如此，他说，在审判中，对异教徒而言将是更可忍受的，相比于你们这些见过神迹却不信的人；因为倘若他们曾见过，他们就必会相信。还有你，迦百农啊，你曾被高举至天，正如同你因在你里面成就的许多神迹而被荣耀，你将必被贬入阴间；你将要被定罪，正是为了那同一件事，即便是经过了如此多的神迹你仍不相信。
  - type: paragraph
    initial:
      ru: 'Лк 10:16. '
      cn: （路加福音 10:16）
    text:
      ru: Слушающий вас Меня слушает, и отвергающийся вас Меня отвергается; а отвергающийся Меня отвергается Пославшего Меня.
      cn: 〇听尔等者听我、拒尔等者拒我、拒我者亦拒遣我者也、
  - type: paragraph
    text:
      ru: 'Потом, чтобы посылаемые на проповедь не сказали, зачем же посылаешь нас, если некоторые города не примут нас, говорит: не печальтесь; отвергающийся вас, отвергается Меня и Отца Моего; поэтому обида не останавливается на вас, но восходит до Бога. Итак, пусть будет для вас утешением то, что оскорбление наносится (не вам, а) Богу. Равным образом, с другой стороны, не хвалитесь и не превозноситесь тем, что некоторые слушают вас; ибо это не ваше дело, но Моей благодати.'
      cn: 然后，为了不让那些被差派去传道的人说：「如果有些城邑不接纳我们，你为何还要差派我们呢？」祂说：「不要忧伤；拒绝你们的人，就是拒绝我和我的父；因此，这侮辱不会止于你们，而是上达于上帝。所以，让这一点成为你们的安慰：这冒犯是加诸于（不是你们，而是）上帝身上的。同样地，从另一方面来说，也不要因有些人听从你们而自夸或自高；因为这不是你们的作为，而是我的恩典。」
  - type: paragraph
    initial:
      ru: 'Лк 10:17. '
      cn: （路加福音 10:17）
    text:
      ru: 'Семьдесятучениковвозвратились с радостью и говорили: Господи! и бесы повинуются нам о имени Твоем.'
      cn: 七十者欢喜而归、曰、主欤、因尔之名诸魔鬼降服我等矣、
  - type: paragraph
    text:
      ru: Прежде сказал евангелист, что Господь послал семьдесят учеников, а теперь говорит, что они«возвратились с радостью»о том, что они не только от других каких болезней исцеляли, но избавляли еще от большего зла – от демонов. Смотри, как они далеки от высокомудрия; ибо они говорят Господу:«о имени Твоем»повинуются нам бесы, по Твоей благодати, а не по нашей силе.
      cn: 传福音者此前曾说，主派遣了七十位门徒，而现在，经文说他们「欢喜而归」（«возвратились с радостью»），是因为他们不仅治愈了其他各种疾病，而且还救赎了他们脱离更大的恶——就是那些邪魔（демонов）。请看，他们与高傲的智慧（высокомудрия）相距多么遥远；因为他们对主说：「因尔之名」（о имени Твоем），邪魔们才顺服我们，这是因着您的恩典，而非我们自己的力量。
  - type: paragraph
    initial:
      ru: 'Лк 10:18. '
      cn: （路加福音 10:18）
    text:
      ru: 'Он же сказал им: Я видел сатану, спадшего с неба, как молнию;'
      cn: 彼语之曰、我见萨他那自天陨落如电、
  - type: paragraph
    text:
      ru: 'А Господь сказал им: не дивитесь тому, что бесы вам повинуются, ибо начальник их давно низвержен и не имеет никакой силы. Хотя для людей это и не было видно, но для Меня, созерцающего и невидимое, это было видно.«Как молния» спал с неба сатана потому, что он был светом, архангелом и денницею, хотя теперь и стал тьмой. Если же он спал с неба, то рабы его, разумею бесов, чего не потерпят? Некоторые слова«с неба»разумеют так: от славы. Так как семьдесят сказали Господу, что им«бесы повинуются», то Он говорит: это и Я знал, ибо Я видел, как сатана спал с неба, то есть лишился славы, которую он имел, и чести. До пришествия Христова его чтили как Бога, а теперь он спал с неба, то есть перестали его почитать за Бога и думать, что он живет на небе.'
      cn: '主说他们不要惊异于鬼魔顺服你们，因为鬼魔的头目早已被贬抑，不具有任何能力。虽然这对于世人而言并非可见，但对于我这默观那不可见之物者而言，这却是可见的。撒但「如闪电」从天陨落，是因为他曾是光、是天使长、是晨星（dennice），尽管如今他已成了黑暗。既然他从天陨落了，那么他的奴仆，我指的是鬼魔，又有什么不会遭受的呢？


        有些人对「从天」一词的理解是：从荣耀之中。既然七十徒对主说「鬼魔顺服」他们，主便说：这连我也知道，因为我看见撒但从天陨落，即是说，他丧失了他曾拥有的荣耀与尊荣。在基督降临以前，世人曾敬拜他如上帝，而现在他从天陨落了，即是说，世人不再尊他为上帝，也不再认为他居于天上。'
  - type: paragraph
    initial:
      ru: 'Лк 10:19. '
      cn: （路加福音 10:19）
    text:
      ru: се, даю вам власть наступать на змей и скорпионов и на всю силу вражью, и ничто не повредит вам;
      cn: 〇顾我赐尔等权柄以践蹋蛇蝎、抵敌之诸力、毫不伤尔等、
  - type: paragraph
    text:
      ru: «Се, даю вам власть»попирать силы его. Ибо«змеи и скорпионы» суть полки бесов, пресмыкающиеся долу, и те из них, кои язвят более видимым образом, суть«змеи», а те, кои более скрытым образом поражают, суть«скорпионы». Например, бес блуда и убийства есть змей, ибо он побуждает на видимые злодеяния; а тот бес, который под предлогом болезни, например, преклоняет человека пользоваться банями, благовонными мазями и другими негами, может быть назван скорпионом, так как он имеет скрытое жало и тайно старается ужалить плоть, чтобы послушавшего его ввести в большее преступление. Но благодарение Господу, давшему власть наступать на них!
      cn: 「看哪，我赐予你们权柄」，以践踏它的诸力。因为「蛇和蝎子」是群魔的军旅，它们伏地爬行；其中那些以更可见方式刺伤人的，是「蛇」；而那些以更隐蔽方式侵扰人的，是「蝎子」。例如，淫乱之魔与谋杀之魔是蛇，因为它煽动可见的恶行；而那个以疾病为借口，例如，使人倾向于使用澡堂、香膏和其他安逸之物（nega, 意为舒适享受或柔弱之物）的鬼魔，则可被称为蝎子，因为它具有隐蔽的毒刺，秘密地试图刺伤肉体，以便将听从它的人引入更大的罪过之中。然而，感谢主，他赐予了我们践踏它们的权柄！
  - type: paragraph
    initial:
      ru: 'Лк 10:20. '
      cn: （路加福音 10:20）
    text:
      ru: однако ж тому не радуйтесь, что духи вам повинуются, но радуйтесь тому, что имена ваши написаны на небесах.
      cn: 然尔等勿欢喜为此、即魔鬼降服尔等、乃欢喜为尔等之名得被纪录于天、
  - type: paragraph
    text:
      ru: Впрочем, научая учеников не высокомудрствовать, Господь говорит:«однако же не... тому... радуйтесь, чтобесывам повинуются»(ибо от сего получают благодеяние другие, именно получающие исцеление),«ноболеерадуйтесь тому, что имена ваши... на небесах... написаны»не чернилами, но Божией памятью и благодатью. Диавол спадает с неба, а люди, на земле живущие, написываются на небесах. Итак, истинная радость в том,«что имена ваши написаны на небесах»и не забываются Богом.
      cn: 诚如是，主在教导门徒不要心高气傲之时说：「然而你们不要为此欢喜，即魔鬼降服你们」（因为由此受惠的是其他人，即那些得到医治的人），「却要更多地欢喜，因为你们的名字被写在天上」，不是用墨水，而是藉着上帝的记忆与恩典。魔鬼从天堕落，而在地上居住的人却被书写在天上。因此，真正的喜乐在于，「你们的名字被写在天上」，且不被上帝遗忘。
  - type: paragraph
    initial:
      ru: 'Лк 10:21. '
      cn: （路加福音 10:21）
    text:
      ru: 'В тот час возрадовался духом Иисус и сказал: славлю Тебя, Отче, Господи неба и земли, что Ты утаил сие от мудрых и разумных'
      cn: 当其时、伊伊稣斯快兴曰、父欤、天地之主乎、我称赞尔、因尔隐此于智者达者、而显之于赤子矣、诚哉、父欤、于尔之甘愿如是也、
  - type: paragraph
    text:
      ru: Как добрый отец, увидев детей, успевших в чем-нибудь достойном похвалы, радуется, так и Спаситель возрадовался тому, что апостолы удостоились таких благ. Поэтому Он благодарит Отца за то, что такие таинства утаены«от мудрых», то есть фарисеев и книжников, истолковывавших Закон, и от«разумных», то есть учеников этих же книжников. Ибо кто учит, тот мудр, а кто учится и понимает уроки, тот разумен; например, Гамалиил – мудр, а Павел – разумен, ибо первый – учитель, а второй – разумеет то, чем наставляет первый.
      cn: 正如一位慈父，看见孩子们在值得称赞的某事上有所成就时，会感到喜悦；同样，救主也为使徒们配得上如此的福祉而欢欣鼓舞。因此，祂感谢父，因为此类奥秘被隐瞒了「不叫智者知道」，也就是那些解释律法的法利赛人和文士，以及被隐瞒了「不叫通达人知道」，即这些文士的门徒。因为教导的人是智者，而学习并领悟功课的人是通达人；例如，迦玛列是智者，而保罗是通达人，因为前者是教师，而后者是领悟前者所教导的。
  - type: paragraph
    text:
      ru: и открыл младенцам.
      cn: 而显之于赤子矣。
  - type: paragraph
    text:
      ru: Господь называет учеников Своих«младенцами», потому что они были не из искусных в Законе, а были избраны большей частью из простого класса народа и из рыбарей. Впрочем, они могли быть названы младенцами и по их незлобию. А те (фарисеи и книжники) не были настоящими мудрецами и разумными, а только казались. Итак, сии таинства утаены«от мудрых и разумных», которые казались таковыми, а на самом деле не были. Ибо, если бы они были таковыми, то таинства были бы открыты им.
      cn: 主称呼祂的门徒为「赤子」，是因为他们并非精通律法的人，而大部分是从百姓的平信徒阶层和渔夫中被拣选出来的。此外，他们也可能因着他们的无邪（不作恶）而被称作赤子。而那些人（法利赛人和文士）并非真正的智者和明达者，而只是看似如此。因此，这些奥秘被隐「于智者达者」，即那些看似如此而实非如此的人。因为，如果他们果真是如此，那么这些奥秘早就向他们显明了。
  - type: paragraph
    text:
      ru: Ей, Отче! Ибо таково было Твое благоволение.
      cn: 阿们，父啊！因为这是你的美意（旨意）。
  - type: paragraph
    text:
      ru: «Ей, Отче», благодарю Тебя,«ибо таково было Твое благоволение», то есть, что такое у Тебя было благоволение и хотение и так было угодно Тебе.
      cn: 「是的，父啊，」我感谢祢，「因为在祢看来是这样美好的旨意」，也就是说，祢有这样的美意和心愿，并且这样令祢喜悦。
  - type: paragraph
    initial:
      ru: 'Лк 10:22. '
      cn: （路加福音 10:22）
    text:
      ru: 'И, обратившись к ученикам, сказал: всё предано Мне Отцем Моим;'
      cn: 〇彼向门徒曰、万物由父所授于我、父之外无识子者、子及子所欲示者之外、无识父者
  - type: paragraph
    text:
      ru: 'Отец все передает Сыну, потому что все имеет покориться Сыну. Бог царствует над всеми двояким образом: во-первых, над теми, кои не желают Его Царствия, и, во-вторых, над теми, кои желают. Для примера скажу: Бог есть Владыка мой, хотя бы я и не хотел, потому что Он – Творец мой; и опять, Бог есть Владыка мой, когда я, как благоразумный раб, исполняю волю Его чрез соблюдение заповедей. Природа человеческая и прежде была в рабстве и в руках Бога, хотя и не хотела того, хотя и сатане служила. Но когда Христос выдержал борьбу за нас и, освободив нас из-под власти диавола, сделал нас Своими слугами и исполнителями заповедей, с того времени мы стали благоразумными рабами и по природе, и по изволению; ибо первое рабство было только по природе, а второе, кроме того, и по нашему изволению. Итак, Господь говорит теперь то:«всё предано Мне Отцем Моим», то есть все имеет покориться Мне и подпасть под Мое владычество. Это подобно другому изречению:«дана Мне всякая власть на небе и на земле»(Мф. 28, 18). А так говорит Он потому, что Он примирил все (Кол. 1, 20), что есть на небе и на земле, И иначе: Отец все предает Сыну, все дела домостроительства нашего спасения. Поэтому ради нас не воплотился ни Отец, ни Дух, или пострадал, или воскрес, но все это совершил Сын, и Он сделался вождем нашего спасения; поэтому Он и говорит, что все Ему предано. Он сказал как бы так: Отец Мой все Мне вверил: воплотиться, пострадать, воскреснуть, спасти отторгшуюся природу.'
      cn: '父亲将一切都交付给子，因为万物都要顺服于子。上帝以双重方式统治万物：第一，统治那些不愿祂国度的人；第二，统治那些愿意的人。


        我举个例子：即使我不愿意，上帝也是我的主宰，因为祂是我的造物主；同样，当我作为一个明理的仆人，通过遵守诫命来执行祂的旨意时，上帝也是我的主宰。


        人性以前也处于奴役之中，并掌握在上帝手中，即使它不愿意这样，即使它曾侍奉撒但。但当基督为我们承受了争战，将我们从魔鬼的权势下解放出来，使我们成为祂的仆人并诫命的执行者时，从那时起，我们便成了明理的仆人——既出于本性，也出于意愿；因为最初的奴役只是出于本性，而第二次的奴役，除此之外，还是出于我们的意愿。


        因此，主现在所说的话「一切都交付给我父」，意即万物都要顺服于我，并受制于我的统治。这类似于另一句格言：「天上地下所有的权柄都赐给我了」（马太福音 28:18）。祂之所以这样说，是因为祂使天上地上的一切都和好了（歌罗西书 1:20）。


        另有一解：父亲将一切都交付给子，即我们救赎的经济安排中的所有工作。因此，无论是父，还是灵，都没有为我们道成肉身，没有受难，也没有复活；所有这些都由子来完成，祂也成了我们救赎的元帅；因此祂说一切都已交付于祂。祂所说的大概是：我的父将一切都委托给了我：道成肉身、受难、复活、拯救那堕落的本性。'
  - type: paragraph
    text:
      ru: и кто есть Сын, не знает никто, кроме Отца, и кто есть Отец, незнает никто,кроме Сына, и кому Сын хочет открыть.
      cn: 「子是谁，除了父之外，无人知晓；父是谁，除了子，以及子所愿意启示的人之外，无人知晓。」
  - type: paragraph
    text:
      ru: 'Поскольку Он сказал, что все Мне предано, то теперь как бы разрешает некоторое недоумение. Чтобы кому-нибудь не пришла мысль: почему ж Он предал все Тебе, а не другому, хотя бы Ангелу или Архангелу.'
      cn: 既然祂说万物皆已托付于我，那么现在祂仿佛正在消解某种困惑。以免有人心生此念：为何祂将一切尽都托付于祢，而不托付予他人，哪怕是天使或天使长呢？
  - type: paragraph
    text:
      ru: 'Он говорит: Мне Он предал потому, что Я одной с Ним Природы и Сущности. И как Его никто не знает, так и Меня никто же, кроме одного Отца. Поэтому Он справедливо предал все Мне, как Единосущному с Ним и превышающему всякое познание, подобно как и Он выше всякого познания. Ибо Отца, – говорит, – знает только один Сын и тот, кому Сын восхочет открыть. Смотри: Сын знает Отца не чрез откровение, а твари – чрез откровение, ибо они получают познание по благодати; следовательно, Сын не сотворен.'
      cn: 他说道：祂将万物授予我，是因为我与祂是同一的性质与本体。正如没有人认识祂，除了独一的父之外，也没有人认识我。因此，祂公义地将万物都授予我，如同授予那与祂同本质且超越一切认知的，正如祂也超越一切认知一般。因为，祂说，只有独一的子认识父，以及子所愿意向其启示的人。看：子认识父不是借由启示，而受造物则是借由启示，因为他们是按着恩典获得认知；因此，子是非受造的。
  - type: paragraph
    initial:
      ru: 'Лк 10:23. '
      cn: （路加福音 10:23）
    text:
      ru: 'И, обратившись к ученикам, сказал им особо: блаженны очи, видящие то, что вы видите!'
      cn: 又转向门徒而特语之曰、福哉其目、见尔等所见者、
  - type: paragraph
    initial:
      ru: 'Лк 10:24. '
      cn: （路加福音 10:24）
    text:
      ru: ибо сказываю вам, что многие пророки и цари желали видеть, что́ вы видите, и не видели, и слышать, что́ вы слышите, и не слышали.
      cn: 因我告尔等、因多先知及列王欲见尔等所见、而不得见、欲闻尔等所闻、而不得闻、
  - type: paragraph
    text:
      ru: 'Обратясь к ученикам, Господь ублажает их и вообще всех, кои с верой взирают на Него, ходящего во плоти и творящего чудеса. Ибо древние пророки и цари хотя и сильно желали увидеть Господа во плоти и послушать Его, однако ж, не удостоились этого. И иначе: поскольку Он выше сказал, что тот знает Отца, кому откроет Сын, то теперь ублажает учеников, как получивших уже это откровение. Ибо Собой Он открыл им Отца, так как видящий Его видел Отца (Ин. 14, 9). А этого блага не достиг никто из тех святых, кои жили до явления и действования Сына Божия во плоти. Поскольку же они не видели во плоти Господа, чрез Которого познавался Отец, то, значит, они и Отца не видели так, как видели апостолы.'
      cn: 主转向门徒，称赞他们以及所有怀着信心瞻仰在肉身中行走并施行奇迹之主的人。因为古代的先知和君王们，尽管极度渴望亲眼看见肉身中的主并聆听祂，但却未能获此殊荣。换言之：由于祂先前说过，只有子所启示的人才认识父，所以祂现在称赞门徒，因为他们已经领受了这一启示。因为祂藉着自己向他们启示了父，正如同看见祂的就看见了父（伊鄂昂福音 14:9）。而这一福祉，那些在神的儿子于肉身中显现和行动之前生活的圣徒们，无一人得着。既然他们没有看见肉身中的主，而父是借着主而被认识的，那么，他们也就没有像使徒们那样看见父。
  - type: paragraph
    initial:
      ru: 'Лк 10:25. '
      cn: （路加福音 10:25）
    text:
      ru: 'И вот, один законник встал и, искушая Его, сказал: Учитель! что́ мне делать, чтобы наследовать жизнь вечную?'
      cn: 〇顾有一法律师起、试探之曰、师欤、我当何为、以嗣永生、
  - type: paragraph
    text:
      ru: Законник этот был человек хвастливый, очень высокомерный, как оказывается из нижеследующего, и сверх того коварный. Поэтому он приступает к Господу, искушая Его, вероятно, он думал, что уловит Господа в Его ответах. Но Господь указывает ему на тот самый Закон, коим он очень надмевался.
      cn: 这位法律师是个好夸口之人，从下文看来，他非常傲慢，而且诡计多端。因此，他走向主，试探祂，他可能以为可以在主的回答中抓住祂的把柄。但主却向他指出了他引以为傲的那律法本身。
  - type: paragraph
    initial:
      ru: 'Лк 10:26. '
      cn: （路加福音 10:26）
    text:
      ru: 'Он же сказал ему: в законе что́ написано? ка́к читаешь?'
      cn: 伊伊稣斯谓之曰、法律中所载者、为何、
  - type: paragraph
    initial:
      ru: 'Лк 10:27. '
      cn: （路加福音 10:27）
    text:
      ru: 'Он сказал в ответ: возлюби Господа Бога твоего всем сердцем твоим, и всею душою твоею, и всею крепостию твоею, и всем разумением твоим,'
      cn: 伊答之曰、宜尽尔心、尽尔神、尽尔力、尽尔意、爱主尔上帝、且爱亲邻者如自己、
  - type: paragraph
    text:
      ru: 'Смотри, с какой точностью Закон заповедует любить Господа. Человек есть совершеннейшее из всех творений. Хотя он имеет и нечто общее со всеми ими, но имеет и нечто преимущественное. Например, человек имеет общее с камнем, ибо он имеет волосы, ногти, кои бесчувственны, как камень. Имеет общее с растением, потому что он растет и питается, и рождает подобное себе, как и растение. Имеет общее с животными бессловесными, потому что имеет чувства, гневается и похотствует. Но, что возвышает человека над всеми прочими животными, он имеет общее и с Богом, именно: разумную душу. Поэтому Закон, желая показать, что человек всецело во всем должен предать себя Богу и все душевные силы пленить в любовь Божию, словами«всем сердцем»указал на силу более грубую и свойственную растениям, словами«всею душою»– на силу более тонкую и приличную существам, одаренным чувствами, словами«всем разумением»обозначил отличительную силу человека – разумную душу. Слова«всею крепостию»мы должны применить ко всему этому. Ибо мы должны подчинить любви Христовой и растительную силу души. Но как? – сильно, а не слабо: и чувственную, и ее сильно; наконец, и разумную, и ее также«всею крепостию», так что мы всецело должны предать себя Богу и подчинить любви Божией нашу силу питательную, чувствующую и разумную.'
      cn: 看看，律法是何等精确地命令我们要爱主。人在所有受造物中是至为完美的。尽管他与所有受造物都有共通之处，但他也有某种优越之处。例如，人与石头有共通之处，因为他有毛发、指甲，它们像石头一样是无知觉的。人与植物有共通之处，因为他生长、进食，并繁衍与己类似的后代，如同植物一般。人与无理性的动物有共通之处，因为他有感觉、会发怒、会情欲冲动。但是，那使人超越所有其他动物之处，是他与上帝也有共通之处，即：理性的灵魂。因此，律法意欲表明，人在凡事上都应将自己完全奉献予上帝，并将其所有灵魂力量俘获于对上帝的爱中，故以「尽尔心」一词指明了那较为粗糙、且为植物所特有的力量；以「尽尔神」一词指明了那较为精微、且适宜于具有感觉的受造物的力量；以「尽尔意」一词则标明了人特有的力量——理性的灵魂。我们应将「尽尔力」一词应用于这一切之上。因为我们必须使灵魂的营养（生长）力量臣服于基督的爱。但如何臣服呢？——是强有力地，而非软弱地：对于感觉力量亦然，也当强有力地；最后，对于理性力量亦然，也同样当「尽尔力」，如此，我们便须将自己完全奉献予上帝，并使我们营养、感觉和理性的力量臣服于上帝的爱中。
  - type: paragraph
    text:
      ru: и ближнего твоего, как самого себя.
      cn: 且爱亲邻者如自己。
  - type: paragraph
    text:
      ru: 'Закон, по причине младенчества слушателей не могший еще преподать совершеннейшего учения, заповедует любить ближнего,«как самого себя». Но Христос научил любить ближнего больше, чем и самого себя. Ибо Он говорит: никто не может оказать«больше той любви, как если кто... душу свою... положит... за друзей своих»(Ин. 15, 13).'
      cn: 律法，因听者处于蒙昧状态，尚不能传授更完备的教义，便命定要爱邻人，「如同自己」。但基督却教导我们要爱邻人胜过爱自己。因为祂说：无人能显出「比这更大的爱，就是人...为朋友舍弃自己的性命」（伊鄂昂福音 15:13）。
  - type: paragraph
    initial:
      ru: 'Лк 10:28. '
      cn: （路加福音 10:28）
    text:
      ru: 'Иисуссказал ему: правильно ты отвечал; так поступай, и будешь жить.'
      cn: 彼语之曰、尔所答诚是也、行此则将生、
  - type: paragraph
    text:
      ru: Итак, законнику говорит:«правильно ты отвечал». Поскольку ты, – говорит, – подлежишь еще Закону, то ты правильно отвечаешь; ибо по Закону ты верно рассуждаешь.
      cn: 因此，他对律法师说：「你回答得正确。」 他说：「既然你仍旧隶属于律法，那么你回答得就是正确；因为你是在按着律法进行着正确的论述。」
  - type: paragraph
    initial:
      ru: 'Лк 10:29. '
      cn: （路加福音 10:29）
    text:
      ru: 'Но он, желая оправдать себя, сказал Иисусу: а кто мой ближний?'
      cn: 其欲自表为义、向伊伊稣斯曰、谁系我之亲邻者、
  - type: paragraph
    text:
      ru: 'Законник, получив похвалу от Спасителя, выказал высокомерие. Он сказал:«а кто... ближний... мой»? Он думал, что он праведен и не имеет подобного себе и близкого по добродетели; ибо полагал, что праведнику ближний есть только праведный же. Итак, желая оправдать себя и возвыситься пред всеми людьми, он с гордостью говорит: а кто ближний мой?'
      cn: 这位律法师，在得到救主的赞扬后，显露出了傲慢。他说：「『谁系我之亲邻者？』」他认为自己是公义的，并且没有与自己相似、在美德上亲近的人；因为他断定，对于一个公义者来说，他的亲邻就只能是同样公义的人。因此，他渴望自我表白为义，并在所有人面前抬高自己，便傲慢地说道：「谁系我之亲邻者？」
  - type: paragraph
    initial:
      ru: 'Лк 10:30. '
      cn: （路加福音 10:30）
    text:
      ru: 'На это сказал Иисус: некоторый человек шел из Иерусалима в Иерихон и попался разбойникам, которые сняли с него одежду, изранили его и ушли, оставив его едва живым.'
      cn: 伊伊稣斯答曰、有人由耶鲁萨利木下耶利鸿、陷于盗贼、褫裸且伤之、置之几死而去、
  - type: paragraph
    text:
      ru: 'Но Спаситель, поскольку Он Творец и во всех видит одно создание, определяет ближнего не делами, не достоинствами, но природой. Не думай, – говорит, – что поскольку ты праведен, то и нет тебе никого подобного. Ибо все имеющие одну и ту же природу суть ближние твои. Итак, и ты сам будь ближним их не по месту, но по расположению к ним и заботливости о них. Для того и привожу Я тебе в пример самарянина, чтобы тебе показать, что хотя он различался по жизни, однако ж, стал ближним для нуждавшегося в милости. Так и ты проявляй себя ближним чрез сострадание и поспешай на помощь по собственному признанию. Итак, этой притчей мы научаемся быть готовыми к милосердию и стараться быть ближними для тех, кои нуждаются в нашей помощи. Познаем и благость Божию в отношении к человеку. Природа человеческая шла«из Иерусалима», то есть из безмятежной и мирной жизни, ибо Иерусалим означает«видение мира». Куда же шла?«В Иерихон», пустой, низкий и удушливый от жара, то есть в жизнь, полную страстей. Смотри: не сказал Он«сошел», но«шел». Ибо природа человеческая всегда склонялась к земному, не однажды, но постоянно увлекаясь страстной жизнью.«И попался разбойникам», то есть попался бесам. Кто не сойдет с высоты ума, тот не попадется бесам. Они, разоблачив человека и сняв с него одежды добродетели, нанесли ему греховные раны. Ибо они сначала обнажают нас от всякого доброго помысла и покрова Божия, а потом и наносят раны грехами. Природу человеческую они оставили«едва живым»или потому, что душа бессмертна, а тело смертно, и таким образом подчинена смерти половина человека, – или потому, что природа человеческая не совсем была отвержена, а надеялась получить спасение во Христе, и таким образом была не совершенно мертвой. Но как чрез преступление Адама смерть вошла в мир, так чрез оправдание во Христе смерть имела быть упраздненной (Рим. 5, 16–17).'
      cn: '然而，救主，既然祂是造物主，并在万物中看到同一的受造物，祂是通过本性，而非通过行为或美德，来界定邻舍的。祂说：「不要以为你既然是公义的，就没有人与你相似。因为所有拥有同一本性的人，都是你的邻舍。因此，你自己也要成为他们的邻舍，不是凭着地域，而是凭着对他们的心意和对他们的关怀。正因如此，我才给你引述撒玛利亚人的例子，以便向你展示，尽管他在生活上有所不同，但他却成了那需要怜悯之人的邻舍。因此，你也要藉着同情心展现自己是邻舍，并要凭着你自己的承认而赶快施予援手。因此，藉着这个比喻，我们学习到要随时准备好施予怜悯，并努力成为那些需要我们帮助之人的邻舍。我们也当认识到上帝对人类的恩慈。


        人性「从耶路撒冷」而去，即从一种宁静而平和的生活中而去，因为耶路撒冷意指「对和平的远见」（或「和平的景象」）。它去往何处呢？「去往耶利哥」，一个空虚、低洼、因炎热而令人窒息的地方，即去往一个充满情欲的生活。请看：祂没有说「下来」，而是说「去」。因为人性总是倾向于属世的事物，并非偶尔一次，而是持续不断地被情欲的生活所吸引。「陷于盗贼」，即陷于恶魔。那不从心智的高度降下来的人，就不会陷入恶魔之手。他们剥光了人，夺走了他美德的衣裳，并用罪恶给他造成了伤口。因为他们首先使我们赤裸，剥去了一切良善的思想和上帝的遮盖，然后才用罪恶给我们造成创伤。他们将人性遗弃为「几近死去」，要么是因为灵魂是不朽的，而身体是会死的，如此，人的一半就屈服于死亡了；要么是因为人性并未完全被弃绝，而是盼望在基督里获得拯救，因此并非完全死亡。然而，正如藉着亚当的过犯死亡进入了世界，同样地，藉着在基督里的称义，死亡将要被废除（罗马书 5:16-17）。'
  - type: paragraph
    initial:
      ru: 'Лк 10:31. '
      cn: （路加福音 10:31）
    text:
      ru: По случаю один священник шел тою дорогою и, увидев его, прошел мимо.
      cn: 适有一司祭由此路而下、见之而过、
  - type: paragraph
    initial:
      ru: 'Лк 10:32. '
      cn: （路加福音 10:32）
    text:
      ru: Также и левит, быв на том месте, подошел, посмотрел и прошел мимо.
      cn: 亦又列微特人至彼处、进前见之而过、
  - type: paragraph
    text:
      ru: 'Под священником и левитом разумей, пожалуй, Закон и пророков. Ибо они желали оправдать человека, но не могли.«Невозможно,– говорит апостол Павел, –чтобы кровь тельцов и козлов уничтожала грехи»(Евр. 10, 4). Они сжалились над человеком и размышляли: как бы исцелить его, но, побежденные силой ран, опять удалились назад. Ибо это значит (пройти мимо). Закон пришел и остановился над лежащим, но потом, не имея силы уврачевать, отступил. Это и означает«прошел мимо».'
      cn: 也许，祭司和利未人指的是律法和先知。因为他们渴望称人为义，但不能做到。「公牛和山羊的血，断不能除罪，」使徒保罗说（希伯来书 10:4）。他们怜悯那人，思量着如何医治他，但被伤势的力量所胜，又退了回去。因为这就是（从旁边走过）的意思。律法来了，停在那躺卧之人上方，但随后，因没有力量治愈，就退了回去。这也就是「从旁边走过」的意思。
  - type: paragraph
    initial:
      ru: 'Лк 10:33. '
      cn: （路加福音 10:33）
    text:
      ru: Самарянин же некто, проезжая, нашел на него и, увидев его, сжалился
      cn: 惟有萨玛利亚人经行至此、见之则怜悯、
  - type: paragraph
    text:
      ru: 'Смотри: слово«по случаю»имеет некоторый смысл. Ибо Закон, действительно, дан не по особой какой-то причине, но по причине слабости человеческой (Гал. 3, 19), не могшей сначала принять Христова таинства. Поэтому и говорится, что священник, то есть Закон, пришел уврачевать человека не нарочито, но«по случаю», что мы обыкновенно называем случайностью. Но Господь и Бог наш, ставший«за нас клятвою»(Гал. 3, 13) и названный Самарянином (Ин. 8, 48), пришел к нам, совершая путь, то есть предлогом к пути и целью поставив то самое, чтобы исцелить нас, а не проходом только, и посетил нас не случайно (между прочим), но жил с нами и беседовал не призрачно.'
      cn: 看啊： 「偶然」 这个词具有某种意义。因为律法，确实，并非是因着某种特别的原因而赐下的，而是因着人性的软弱（加拉太书 3:19），最初不能领受基督的奥秘。因此，经文说，祭司，也就是律法，前来医治这人，并非是特意的，而是 「偶然」 的，这正是我们通常所说的机缘巧合。但我们的主和上帝，那位 「替我们成了咒诅」（加拉太书 3:13）并被称为撒马利亚人（伊鄂昂福音 8:48）的，来到我们这里，是藉着完成一段旅途，也就是说，他将医治我们这件事设立为旅途的借口和目的，而不仅仅是路过，他看顾我们并非是偶然的（顺便的），而是与我们同住，并与我们交谈，并非虚假不实的。
  - type: paragraph
    initial:
      ru: 'Лк 10:34. '
      cn: （路加福音 10:34）
    text:
      ru: и, подойдя, перевязал ему раны,
      cn: 进前以油与酒沃其伤而裹之、乘其牲畜、引至旅馆、顾赡之、
  - type: paragraph
    text:
      ru: Тотчас«перевязал... раны», не попустив болезни усилиться, но связав ее.
      cn: 立刻「包扎了…创伤」，不任凭疾病加强，而是捆绑了它。
  - type: paragraph
    text:
      ru: возливая масло и вино;
      cn: 浇灌油与酒；
  - type: paragraph
    text:
      ru: '«Возлилмасло и вино»: масло есть слово учения, предуготовляющее к добродетели обещанием благ, а вино – слово учения, приводящее к добродетели страхом. Итак, когда слышишь слово Господа:«Приидите ко Мне, и Я успокою вас»(Мф. 11, 28) – это масло, ибо показывает милость и успокоение. Таковы же слова:«приидите,... наследуйте Царство, уготованное вам»(Мф. 25, 34). Но когда Господь говорит: идите во тьму (Мф. 25, 41) – это вино, учение строгое. Можешь разуметь и иначе. Масло означает жизнь по человечеству, а вино – по Божеству. Ибо Господь иное совершал как человек, а иное как Бог. Например, есть, пить, проводить жизнь не без приятностей и не обнаруживать суровости во всем, как Иоанн, – это масло; а чудный пост, хождение по морю и прочие проявления Божеской силы – это вино. Вину можно уподобить Божество в том отношении, что Божества в Самом Себе (без соединения) никто не мог бы стерпеть, если б не было и масла сего, то есть жизни по человечеству. Поскольку же Господь спас нас чрез то и другое, то есть Божество и человечество, то поэтому и говорится, что Он возлил масло и вино. И ежедневно те, кои бывают крещаемы, исцеляются от ран душевных, будучи помазуемы миром, тотчас же приобщаясь к Церкви и причащаясь Божественной Крови.'
      cn: '圣奥赫里德的狄奥菲拉克


        「进前以油与酒沃其伤」：油是教导之言，借由应许福份来预备人进入美德；而酒是教导之言，借由恐惧来引领人进入美德。因此，当你听见主的话说：「凡劳苦担重担的人，可以到我这里来，我就使你们得安息」（马太福音 11:28）——这是油，因为它显明了怜悯与安息。同样的话还有：「你们这蒙我父赐福的，可来承受那为你们所预备的国」（马太福音 25:34）。但当主说：「你们这被咒诅的人，离开我，进入永火里去」（马太福音 25:41）——这是酒，是严厉的教导。


        你也可以有另一种理解。油象征按人性而活的生命，而酒象征按神性而活的生命。因为主所行的，有些是作为人而行的，有些是作为神而行的。例如，吃喝、享受生活中的愉悦、不像伊鄂昂那样在凡事上显出严厉——这是油；而那奇妙的禁食、在海上行走以及其他神性大能的彰显——这是酒。可以将酒比作神性，原因在于：若没有这油，即没有按人性而活的生命，则没有人能忍受神本身（不经结合）的神性。既然主借由这两者，即神性与人性，拯救了我们，所以经文才说他沃以油和酒。并且，每日受洗之人，借由涂抹圣膏油，并立即加入教会、领受神圣的宝血，其灵魂的创伤便得以治愈。'
  - type: paragraph
    text:
      ru: и, посадив его на своего осла,
      cn: 并，让他坐上他自己的驴子，
  - type: paragraph
    text:
      ru: 'Господь посадил нашу израненную природу на Своего подъяремника, то есть на Свое Тело. Ибо, сделал нас Своими членами и причастниками Своего Тела: нас, долу находящихся, возвел на такое достоинство, что мы одно с Ним Тело!'
      cn: 主使我们受伤的本性坐上了祂的驮畜，也就是坐上了祂的身体。盖因祂使我们成为了祂的肢体以及祂身体的有份者：我们将居于卑下之境的我们，提升到如此尊荣的地步，使我们与祂成为同一个身体！
  - type: paragraph
    text:
      ru: привез его в гостиницу и позаботился о нем;
      cn: 引至旅馆、顾赡之；
  - type: paragraph
    text:
      ru: 'Гостиница есть Церковь, всех принимающая. Закон не всех принимал. Ибо сказано:«Аммонитянин и Моавитянин не может войти в общество Господне»(Втор. 23, 3).«Но во всяком народе боящийся Его... приятен Ему»(Деян. 10, 35), если желает уверовать и сделаться членом Церкви. Ибо Она всех принимает: и грешников, и мытарей.'
      cn: 旅馆就是教会，接纳所有人。律法并不接纳所有的人。因为经上说：「亚扪人和摩押人不可入上主的会」（申命记 23:3）。但「在各国民中，那敬畏主……的人都为他所悦纳」（使徒行传 10:35），如果他愿意信奉并成为教会的一员。因为教会接纳所有人：无论是罪人，还是税吏。
  - type: paragraph
    initial:
      ru: 'Лк 10:35. '
      cn: （路加福音 10:35）
    text:
      ru: 'а на другой день, отъезжая, вынул два динария, дал содержателю гостиницы и сказал ему: позаботься о нем; и если издержишь что более, я, когда возвращусь, отдам тебе.'
      cn: 次日将行、取二（底那利乙）予馆人曰、顾赡之、若所费加多、我返之时、将偿尔、
  - type: paragraph
    initial:
      ru: 'Лк 10:36. '
      cn: （路加福音 10:36）
    text:
      ru: Кто из этих троих, думаешь ты, был ближний попавшемуся разбойникам?
      cn: 此三者中尔意、谁为陷盗之亲邻乎、
  - type: paragraph
    initial:
      ru: 'Лк 10:37. '
      cn: （路加福音 10:37）
    text:
      ru: 'Он сказал: оказавший ему милость. Тогда Иисус сказал ему: иди, и ты поступай так же.'
      cn: 彼曰、是与之行慈怜者、伊伊稣斯语之曰、尔往亦如是行乎、
  - type: paragraph
    text:
      ru: 'Примечай точность, с какой сказано, что привез его в гостиницу и возымел о нем попечение. Прежде чем привез в нее, он только перевязал раны. Что это значит? То, что когда составилась Церковь и открылась гостиница, то есть, когда вера возросла почти у всех народов, тогда открылись и дары Святого Духа, и благодать Божия распространилась. Это узнаешь из Деяний Апостольских. Образ гостиника носит в себе всякий апостол и учитель, и пастырь, им Господь дал«два динария», то есть два Завета: Ветхий и Новый. Ибо тот и другой Завет, как изречения одного и того же Бога, имеют на себе изображение одного Царя. Сии-то динарии Господь, восходя на небеса, оставил апостолам и последующих времен епископам и учителям.'
      cn: "要精确地注意，经文所言，他把伤者带到客店，并照顾他，此言辞的精确性。在他将伤者带进客店之前，他只是包扎了他的伤口。这代表着什么？代表着当教会成立、客店开放之时——即，当信仰在几乎所有民族中都增长之时——圣灵的恩赐也随之开启，并且上帝的恩典也广为传播。这一点你可以从（使徒行传 1:1）中得知。\n\n    客店老板的形象，是所有使徒、教师和牧者的写照，主赐予他们「两个代纳里」，即两个圣约：旧约和新约。因为这两个圣约，作为同一位上帝的言语，都带有同一位君王的肖像。正是这些代纳里，主在升天时留给了使徒以及后世的主教和教师们。"
  - type: paragraph
    text:
      ru: 'Сказал:«если чтоиз своегоиздержишь,... я... отдам тебе». Апостолы, действительно, издерживали и свое, много трудившись и повсюду рассеивая учение. Да и учители последующих времен, изъясняя Ветхий и Новый завет, много издержали своего. За это они получат награду, когда Господь возвратится, то есть во второе Его пришествие. Тогда каждый из них скажет Ему: Господи! Ты дал мне два динария, вот я приобрел другие два. И Он так скажет таковому:«хорошо, добрый раб!»(Лк. 19, 17).'
      cn: 他说道：「若你从自己的囊中再支付些什么，我⋯⋯将偿还给你。」宗徒们，确实，是支付了自己的财物，他们付出了许多劳作，并四处播撒教义。并且，后世的导师们，在阐释旧约与新约时，也付出了许多他们自己的东西。为此，当主再返回时，也就是在他第二次降临时，他们将获得赏赐。那时，他们中的每个人都将对祂说：主啊！你给了我两个迪纳里，看，我又挣得了另外两个。而祂将对这样的人说：「好，你这善良的仆人！」（路加福音 19:17）。
  - type: paragraph
    initial:
      ru: 'Лк 10:38. '
      cn: （路加福音 10:38）
    text:
      ru: В продолжение пути их пришел Он в одно селение; здесь женщина, именем Марфа, приняла Его в дом свой;
      cn: 〇伊等行时、彼入一村、有妇名玛儿发迎接之于其家、
  - type: paragraph
    initial:
      ru: 'Лк 10:39. '
      cn: （路加福音 10:39）
    text:
      ru: у неё была сестра, именем Мария, которая села у ног Иисуса и слушала слово Его.
      cn: 其妹名玛利亚坐伊伊稣斯足下而听其言、
  - type: paragraph
    initial:
      ru: 'Лк 10:40. '
      cn: （路加福音 10:40）
    text:
      ru: 'Марфа же заботилась о большом угощении и, подойдя, сказала: Господи! или Тебе нужды нет, что сестра моя одну меня оставила служить? скажи ей, чтобы помогла мне.'
      cn: 玛儿发张罗大供事、就之曰、主欤、尔不顾我妹遗我一人供事尔乎、故尔告之以助我、
  - type: paragraph
    initial:
      ru: 'Лк 10:41. '
      cn: （路加福音 10:41）
    text:
      ru: 'Иисус же сказал ей в ответ: Марфа! Марфа! ты заботишься и суетишься о многом,'
      cn: 伊伊稣斯答之曰、玛儿发欤、玛儿发欤、尔顾虑忙乱殊多、
  - type: paragraph
    initial:
      ru: 'Лк 10:42. '
      cn: （路加福音 10:42）
    text:
      ru: а одно только нужно; Мария же избрала благую часть, которая не отнимется у неё.
      cn: 然所需者惟一、至玛利亚已择善分、即由之所不可夺者也、
  - type: paragraph
    text:
      ru: Велико благо и от гостеприимства, как показала Марфа, и не нужно пренебрегать им; но еще большее благо – внимать духовным беседам. Ибо тем питается тело, а сими оживляется душа. Не для того, – говорит, – существуем мы, Марфа, чтобы наполнять тело разными яствами, но для того, чтобы творить полезное душам. Примечай и благоразумие Господа. Он ничего не сказал Марфе прежде, чем от нее получил повод к упреку. Когда же она покусилась отвлечь свою сестру от слушания, тогда Господь, воспользовавшись поводом, упрекает ее. Ибо гостеприимство дотоле похвально, доколе оно не отвлекает и не отводит нас от того, что более нужно; когда же оно нам начнет препятствовать в важнейших предметах, тогда довольно предпочесть ему слушание о божественных предметах. Притом, если сказать точнее, Господь возбраняет не гостеприимство, но разнообразие и суетность, то есть развлечение и смущение. Для чего, – говорит, –«Марфа, ты заботишься и...печешьсяо многом», то есть развлекаешься, беспокоишься? Мы имеем нужду в том только, чтоб сколько-нибудь поесть, а не в разнообразии яств.
      cn: '好客之道也有巨大的益处，正如马大所展现的，我们不应轻忽它；但更大的益处是聆听属灵的谈话。因为身体靠前者得喂养，而灵魂靠后者得活化。他说：「马大，我们存在的目的，并非是为了用各种佳肴填满身体，而是为了为灵魂行有益之事。」


        也要留意主的深思熟虑。祂在从马大那里获得责备的缘由之前，没有对她多说什么。当她试图引开她的妹妹（玛利亚）不听道时，主便抓住这个时机，责备了她。因为好客之道只有在它没有引开或使我们偏离那更需要的事物时，才是值得称赞的；而当它开始妨碍我们在更重大的事务上时，那时就应该选择聆听关于神圣事务的教导来取代它。


        此外，更精确地说，主所禁止的并非好客之道，而是多样性和虚妄，也就是说，是分心和困扰。祂说：「马大，你为何『忧虑、『为许多事』烦扰（多心）呢？」我们只需要进食一些食物，而不需要各种各样的佳肴。'
  - type: paragraph
    text:
      ru: Иные слова«одно только нужно»разумели не о пище, но о внимании к учению. Итак, сими словами Господь научает апостолов, чтобы, когда они войдут в чей-либо дом, не требовали ничего роскошного, но довольствовались простым, не заботясь более ни о чем, как о внимании к учению.
      cn: 另一些人理解「唯独一件事是必需的」这句话，并非指食物，而是指对教诲的专注。因此，主借着这些话教导使徒们，当他们进入任何人的家时，不应索要任何奢华之物，而应以简朴为满足，不再关心任何别的事物，只关心对教诲的专注。
  - type: paragraph
    text:
      ru: Пожалуй, разумей под Марфой деятельную добродетель, а под Марией – созерцание. Деятельная добродетель имеет развлечения и беспокойства, а созерцание, став господином над страстями (ибо Мария – значит госпожа), упражняется в одном рассмотрении божественных изречений и судеб.
      cn: 或许，你当理解，马大代表的是实践的德行，而马利亚代表的是沉思。实践的德行伴随着分心和烦扰，而沉思，则在成为诸激情的主宰之后（因为马利亚的意思是「主妇」），单单致力于默观神圣的言语和旨意。
  - type: paragraph
    text:
      ru: Обрати внимание и на слова:«села у ног Иисуса и слушала слово Его». Под ногами можно разуметь деятельную добродетель, ибо они означают движение и хождение. А сидение есть знак неподвижности. Итак, кто сядет при ногах Иисусовых, то есть, кто утвердится в деятельной добродетели и чрез подражание хождению и жизни Иисуса укрепится в ней, тот после сего доходит до слышания божественных речений или до созерцания. Поскольку и Мария прежде села, а потом слушала слова.
      cn: 请留意这些话语：「坐在耶稣的脚前，听祂的道。」在「脚」之下，我们可以理解为实践性德行，因为它们象征着移动与行走。而「坐下」则是象征着不动性。因此，凡是坐在耶稣脚前的人，亦即在实践性德行中得以确立，并透过效法耶稣的行走与生活而在这德行中得以坚固的人，在此之后，便可达到聆听神圣的训言，或是达到默观。因为玛利亚也是首先坐下，然后才聆听道语的。
  - type: paragraph
    text:
      ru: Итак, если ты можешь, восходи на степень Марии чрез господство над страстями и стремление к созерцанию. Если ж это невозможно для тебя, будь Марфой, прилежи деятельной стороне и чрез то принимай Христа.
      cn: 因此，若你能够，当藉着对情欲的主宰和对默观的渴求，登上玛利亚的境界。但若这对于你而言不可能，就做马大吧，勤勉于行动的一面，并借此接纳基督。
  - type: paragraph
    text:
      ru: Приметь сие:«которая не отнимется у неё». Подвизающийся в делах имеет нечто такое, что отнимается у него, то есть заботы и развлечение. Ибо, достигши до созерцания, он освобождается от развлечения и суетности, и таким образом у него нечто отнимается. А подвизающийся в созерцании никогда не лишается сей благой части, то есть созерцания. Ибо в чем больше он будет успевать, когда достиг самого высшего, разумею, созерцания Бога, что равно обожению? Ибо кто удостоился зреть Бога, тот становится богом, так как подобное объемлется подобным.
      cn: 请注意此句：「即由之所不可夺者也」。在行诸德者，有一样东西会从他身上被夺去，即忧虑和分心。因为，当他达到默观时，他就摆脱了分心和虚妄，因此，他身上的一些东西就被夺走了。而在默观中奋进者，绝不会被剥夺这善分，即默观。因为，当他达到至高之境时——我的意思是默观上帝，这等同于成神——他还能在哪方面取得更大的进展呢？因为，凡是蒙受资格瞻望上帝的人，他就成为了神，正如相似之物为相似之物所包容一样。
- type: heading1
  text:
    ru: Глава одиннадцатая
    cn: 第十一章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 11:1. '
      cn: （路加福音 11:1）
    text:
      ru: 'Случилось, что когда Он в одном месте молился, и перестал, один из учеников Его сказал Ему: Господи! научи нас молиться, как и Иоанн научил учеников своих.'
      cn: 〇适彼在一处祈祷、既毕、其门徒中一人语之曰、主欤、教我等祈祷、如伊鄂昂教其门徒然、
  - type: paragraph
    text:
      ru: Ученик Христов ревнует к ученикам Иоанновым и потому желает научиться, как молиться. Спаситель не отверг желания учеников, но научает.
      cn: 基督的门徒嫉妒伊鄂昂的门徒，故而渴望学习如何祈祷。救主并未拒绝门徒的愿望，而是教导他们。
  - type: paragraph
    initial:
      ru: 'Лк 11:2. '
      cn: （路加福音 11:2）
    text:
      ru: 'Он сказал им: когда мо́литесь, говорите: Отче наш, сущий на небесах!'
      cn: 彼告之曰、尔等祈祷时、当言、在天我等父、我等愿尔名显圣、尔国临格、尔旨成行于地如于天、
  - type: paragraph
    text:
      ru: «Отче наш,– говорит, –сущий на небесах». Примечай силу молитвы. Она тотчас возводит тебя к горнему и, поскольку ты именуешь Бога Отцом, убеждает тебя всячески не терять подобия Отцу, но стараться уподобляться Ему. Не сказал «Отче мой», но«Отче наш», возбуждая тебя к братолюбию и побуждая любить всех, как братьев вообще. Сказав:«на небесах», не ограничивает ими Бога, но слушателя возводит к небесам и отводит от земного.
      cn: 「我们在天上的父，」他说。「注意这段祷文的力量。它即刻将你引向高天，既然你称上帝为父，它便劝说你务必不要失去与父的相似性（pódopei），而要努力效法祂。祂没有说『我的父』，而是说『我们的父』，以此激发起你的弟兄之爱（bratolúbie），并促使你爱所有的人，如同爱普世的弟兄。说了『在天上』，并非以此限制上帝，而是将听者提升至天上，使其远离世俗。」
  - type: paragraph
    text:
      ru: да святится имя Твое;
      cn: 愿祢的名被尊为圣；
  - type: paragraph
    text:
      ru: «Да святится имя Твое», вместо«да прославится», то есть устрой нашу жизнь так, чтоб она была во славу Твою. Ибо как злыми хулится имя Божие, так ведущими добрую жизнь прославляется.
      cn: 「愿你的名成圣」（Да святится имя Твое），而非「愿你得荣耀」（да прославится），也就是说，安排我们的生活，使它能归于你的荣耀。因为，正如恶人会亵渎上帝之名一样，度良善生活之人会荣耀祂。
  - type: paragraph
    text:
      ru: да приидет Царствие Твое;
      cn: 愿祢的国降临；
  - type: paragraph
    text:
      ru: Грешник не молится о Царствии Божием, ибо не желает его пришествия по причине ожидающих его там наказаний. Напротив, праведник молит, чтоб оно пришло скорее, чтобы ему освободиться от здешних искушений и успокоиться.
      cn: 罪人并不为上帝的国祷告，因为他并不期盼它的来临，这是出于他预料到在那里等待着他的刑罚。相反地，义人则祷告让它快些降临，好使他能从现世的诱惑中得释放，并获得安息。
  - type: paragraph
    text:
      ru: да будет воля Твоя и на земле, как на небе;
      cn: 愿祢的旨意行在地上，如同在天上；
  - type: paragraph
    text:
      ru: «Да будет воля Твоя..., как на небе»– у Ангелов, так и у нас людей«на земле». Ибо Ангелы все и во всем действуют по воле Божией.
      cn: 「愿您的旨意成就……，如同在天上」——意指在天使那里，亦在地上，在我们人类这里。因为天使们凡事、并在一切事上，皆按照上帝的旨意行事。
  - type: paragraph
    initial:
      ru: 'Лк 11:3. '
      cn: （路加福音 11:3）
    text:
      ru: хлеб наш насущный подавай нам на каждый день;
      cn: 求今赐我等日用之粮、
  - type: paragraph
    text:
      ru: Научает просить«хлеба" только«насущного», то есть полезного для нашего существования и для поддержания жизни, отнюдь не лишнего, но необходимого.
      cn: 教导我们只求「日用的」（насущного）「食粮」（хлеба），也就是说，只求对我们的生存和维持生命有益的、绝非多余的、而是必需之物。
  - type: paragraph
    initial:
      ru: 'Лк 11:4. '
      cn: （路加福音 11:4）
    text:
      ru: и прости нам грехи наши, ибо и мы прощаем всякому должнику нашему; и не введи нас в искушение,
      cn: 而免我等罪、如我亦免负我等债者、又不导我侪于诱感、乃救我侪于凶恶、
  - type: paragraph
    text:
      ru: Не входить«в искушение»– значит не порываться на искушения. Ибо нам должно молить Бога не о том, чтобы Он наслал на нас искушение, но о том, чтобы отвратил оное; а если постигнет, должно с мужеством переносить оное. Нужно сказать, что искушений два вида. Одни – произвольные, например, пьянство, убийство, прелюбодеяние и прочие страсти; ибо сим искушениям мы сами подпадаем произвольно. Другие искушения – невольные, коим подвергают нас владыки и сильные. От произвольных-то искушений, то есть от страстей, нам должно убегать, молиться об избавлении от них и говорить«не введи нас», то есть не попусти нам впасть«в искушение», то есть в произвольную страсть.
      cn: 「不进入『诱惑』」意味着不冲向诱惑。因为我们应当祈求上帝的，不是他把诱惑降在我们身上，而是他使之远离；而如果诱惑临到，我们应当勇敢地承受它。需要说明的是，诱惑有两种。一种是出于自愿的，例如：醉酒、谋杀、通奸以及其他各种情欲；因为我们是自愿地落入这些诱惑之中的。另一种诱惑是非自愿的，是那些掌权者和有权势之人施加给我们的。我们应当逃避那些自愿的诱惑，也就是逃避情欲，祈求从中得救，并说「不导我侪于诱感」，即不要任凭我们「陷入诱惑」，也就是陷入自愿的情欲之中。
  - type: paragraph
    text:
      ru: но избавь нас от лукавого.
      cn: 而救我侪于凶恶。
  - type: paragraph
    text:
      ru: Ибо он наводит невольные и вольные искушения. Поэтому, когда ты невольно терпишь искушение от человека, не человека этого считай виновником твоего искушения, но лукавого. Ибо он наущает человека яриться на тебя и неистовствовать.
      cn: 因为他带来不情愿的以及情愿的试探。所以，当你不情愿地承受来自人的试探时，不要将那个人视为你试探的祸首，而要视为那恶者。因为他教唆那个人对你发怒并狂暴。
  - type: paragraph
    initial:
      ru: 'Лк 11:5. '
      cn: （路加福音 11:5）
    text:
      ru: 'И сказал им:положим, чтокто-нибудь из вас, имея друга, придёт к нему в полночь и скажет ему: друг! дай мне взаймы три хлеба,'
      cn: 又语彼等曰、尔等中谁有朋友、夜半往救之曰、朋友乎、请借我三饼、
  - type: paragraph
    initial:
      ru: 'Лк 11:6. '
      cn: （路加福音 11:6）
    text:
      ru: ибо друг мой с дороги зашел ко мне, и мне нечего предложить ему;
      cn: 盖我朋友自路途中来就我、我无以供之、
  - type: paragraph
    text:
      ru: Господь, научая нас молиться неленостно, сказывает притчу и пример. Что же означает притча?«Полночью»называет последние дни жизни, которых когда достигнут люди, начинают сочувствовать добру и устремляются к Богу. Ибо Он есть друг, любящий всех и всем желающий спасения (1Тим. 2, 4). Итак, многие«в полночь», то есть в конце жизни, приходят к Богу как другу и говорят:«дай три хлеба», то есть веру в Троицу; ибо«зашел... друг», то есть Ангел, вземлющий душу. Впрочем, и всякий Ангел есть друг, как и Господь говорит, что радость бывает на небе о спасении человека (Лк. 15, 10).
      cn: '主，为教导我们以不懈怠的方式祈祷，讲述了一个比喻与例子。这个比喻意味着什么呢？


        他称「半夜」为生命的末日，当人们到达这些日子时，他们开始同情良善（对良善产生共鸣）并奔向上帝。因为祂是朋友，爱所有人，并希望所有人得救（提摩太前书 2:4）。


        因此，许多人在「半夜」，也就是在生命尽头，来到上帝面前，如同来到朋友面前，并说：「给我三个饼」，即对三位一体的信仰；因为「朋友...来就我了」，这个朋友就是取走灵魂的天使。然而，每一个天使都是朋友，正如主所说，有一个人得救时，天上就会有欢喜（路加福音 15:10）。'
  - type: paragraph
    initial:
      ru: 'Лк 11:7. '
      cn: （路加福音 11:7）
    text:
      ru: 'а тот изнутри скажет ему в ответ: не беспокой меня, двери уже заперты, и дети мои со мною на постели; не могу встать и дать тебе.'
      cn: 彼在内答之曰、勿劳动我、门已闭、我儿曹偕我偃卧于床、我不能起以予尔、
  - type: paragraph
    text:
      ru: «Дети», покоящиеся«на постели», суть люди, обратившиеся и потому сделавшиеся чадами Господа и удостоившиеся покоиться вместе с Ним.
      cn: 「儿女」（Дети），「在床」（на постели）上安歇的，就是那些已经归化（обратившиеся）的人，他们因此成为了主的孩童（чадами Господа），并被认为配得与祂一同安歇（покоиться）。
  - type: paragraph
    initial:
      ru: 'Лк 11:8. '
      cn: （路加福音 11:8）
    text:
      ru: Если, говорю вам, он не встанет и не даст ему по дружбе с ним, то по неотступности его, встав, даст ему, сколько просит.
      cn: 我告尔、纵不以朋友之故起予之、乃以其迫切必起予之、如其所需、
  - type: paragraph
    text:
      ru: «Неотступностью» называет усиленную и продолжительную молитву с терпением.
      cn: 「「迫切」指的是怀着忍耐，加强且持久的祷告。」
  - type: paragraph
    text:
      ru: 'Разумей и иначе, именно: под«полночью» разумей силу и средину искушений. Ибо всякое искушение есть ночь, а средина искушений, без сомнения, – полночь. Итак, когда кто находится в средине искушений, тот приходит к любящему нас Богу и говорит:«дай мне взаймы три хлеба», то есть спасение тела, души и духа. Ибо искушения угрожают опасностью сим трем. Кто же«друг», зашедший с дороги? Без всякого сомнения, Господь, испытывающий нас в искушениях и желающий вкусить наше спасение. Впадший в искушения, не в силах будучи сам по себе противостать им и оказать прием Господу, не имеет, что предложить Ему.'
      cn: 你当以另一种方式理解，即：在「午夜」之下，你当理解为试探的强度和其中央。因为所有的试探都是黑夜，而试探的中央，毫无疑问，就是午夜。因此，当一个人处于试探的中央时，他来到爱我们的上帝面前并说：「借给我三个饼」，这就是说，身体、灵魂和精神的救赎。因为试探威胁着这三者的安危。那么，从路上前来的「朋友」是谁呢？毫无疑问，是主，祂在试探中考验我们，并期望品尝我们的救赎。陷入试探的人，凭着他自己无力抵抗它们并接待主，故而没有什么可以提供给祂。
  - type: paragraph
    text:
      ru: «Запертыедвери»означают то, что мы должны быть готовы прежде искушений, а когда впадем, тогда дверь к приготовлению уже заперта, и мы, оказавшись неготовыми, потерпим опасность, если Бог не поможет.«Дети»суть (поскольку прежде обратились) те, кои чрез добродетель сделались сынами Божиими, возлежат и почивают в Боге.
      cn: 「关闭的门」意指，我们必须在试探临到之先就预备妥当，而当我们陷落之时，通往预备的门业已关闭，而我们，因缺乏预备，便会遭受危险，除非上帝施以援手。「孩子们」是（由于他们已先行悔改）那些借由德行成为上帝的儿子的人，他们与上帝一同安歇、休憩。
  - type: paragraph
    initial:
      ru: 'Лк 11:9. '
      cn: （路加福音 11:9）
    text:
      ru: 'И Я скажу вам: проси́те, и дано будет вам; ищите, и найдете; стучите, и отворят вам,'
      cn: 〇我告尔等、尔等当求、则将予尔等、尔等当寻、则遇之、叩门者、则为尔等启之、
  - type: paragraph
    text:
      ru: Смотри, какая точность в словах. Не сказал Господь:«попросите», и дастся вам, но«проси́те», то есть непрерывно ищите.
      cn: 看，词语是何等精确。主没有说：「你们去求吧，」就给你们，而是说：「你们当求，」亦即，持续不断地寻求。
  - type: paragraph
    initial:
      ru: 'Лк 11:10. '
      cn: （路加福音 11:10）
    text:
      ru: ибо всякий просящий получает, и ищущий находит, и стучащему отворят.
      cn: 盖凡求者必得、寻者必遇、叩门者必启、
  - type: paragraph
    text:
      ru: «Всякий просящий получает». Неужели получает тот, кто просит бесполезного? Нет. Ибо, во-первых, прошение о бесполезном не может быть и названо прошением пред Богом. Ибо кто молится Богу, тот должен просить того, что Он дает. А если кто просит бесполезного, тот творит прошение не к Богу, ибо Он не дает неполезного.
      cn: 「凡求者必得」。难道求无益之事者也能得吗？不能。因为，首先，求无益之事不能被称为向着上帝的「祈求」。因为向着上帝祷告者，必须祈求祂所赐予之物。而如果有人祈求无益之事，他所行的祈求就不是向着上帝，因为祂不赐予无益之物。
  - type: paragraph
    initial:
      ru: 'Лк 11:11. '
      cn: （路加福音 11:11）
    text:
      ru: Какой из вас отец,когдасын попросит у него хлеба, подаст ему камень? или,когда попроситрыбы, подаст ему змею вместо рыбы?
      cn: 尔等中为父者、谁有子求饼于其父、即予之石、或求鱼而予之蛇、以代鱼乎、
  - type: paragraph
    initial:
      ru: 'Лк 11:12. '
      cn: （路加福音 11:12）
    text:
      ru: Или, если попросит яйца, подаст ему скорпиона?
      cn: 或求卵而予之蝎、
  - type: paragraph
    initial:
      ru: 'Лк 11:13. '
      cn: （路加福音 11:13）
    text:
      ru: Итак, если вы, будучи злы, умеете даяния благие давать детям вашим, тем более Отец Небесный даст Духа Святаго просящим у Него.
      cn: 尔曹既为恶者尚知以善予尔子、何况在天之父更不以圣神予求之者乎、
  - type: paragraph
    text:
      ru: 'Потом слушай, как и Сам Господь научает нас просить того, чего должно просить. Он говорит: сын просит«хлеба»и«рыбы», и«яйца». Поэтому как эти предметы составляют пищу человека, так и наши прошения должны быть полезны нам и служить в помощь. Под просящим«хлеба»разумей, пожалуй, всякого, кто просит, чтобы открыты ему были вера в Троицу и правильность догматов. Ибо они, как утверждающие сердце, суть хлеб. А«рыбы»просит тот, кто, находясь в море жизни сей, просит у Бога помощи, чтобы ему, как рыбе, сохраниться живым и непогруженным среди искушений. А тот просит«яйца», кто желает, чтоб ему даны были порождения добродетельных душ, каковые души, как взявшие крылья, вознесшиеся духом и пролетевшие землю, по справедливости, могут быть уподоблены птицам.'
      cn: '接着，请听主自己是如何教导我们祈求那应当祈求之事的。祂说：儿子求「饼」、「鱼」和「鸡蛋」。因此，正如这些物品构成了人的食物，我们的祈求也必须对我们有益，并能提供帮助。


        对于那求「饼」的人，你或许可以理解为所有祈求能向他敞开对三位一体之信仰和教义之正确性的人。因为它们是坚固人心之物，是饼。


        而求「鱼」的人，是那些身处于此生命之海中，祈求上帝帮助他们的人，以便他们能像鱼一样，在试探之中仍能保全性命、不被淹没。


        而那求「鸡蛋」的人，是那些渴望获得善德之灵所结出的产物的人，这样的灵魂因生出了翅膀，其精神得以高升，飞离了大地，所以理应可以被比作飞鸟。'
  - type: paragraph
    initial:
      ru: 'Лк 11:14. '
      cn: （路加福音 11:14）
    text:
      ru: Однажды изгнал Он беса, который был нем; и когда бес вышел, немой стал говорить; и народ удивился.
      cn: 〇一日彼逐出喑哑魔鬼、适魔鬼出、喑哑者发言、庶民奇之、
  - type: paragraph
    text:
      ru: '«Немым» часто называется тот, кто не говорит; но называется также и тот, кто не слышит, а вернее тот, кто не слышит и не говорит. Кои отроду не слышат, те и не говорят. Это с ними бывает по необходимости. Ибо мы говорим то, чему научаемся чрез слышание. Когда кто не слышит, тот по всей вероятности и не говорит. Разве у кого слух повредился впоследствии, от болезни, тому ничто не препятствует говорить. Приведенный ко Христу был в обоих отношениях нем: и на язык, и на ухо. Он есть образ человеческой природы, которая, будучи одержима от бесов, не способна была ни к слышанию слов Божиих, ни тем более к пересказыванию. Но Господь, придя и изгнав бесов, то есть страстные и бесовские дела, сделал то, чтобы мы не только говорили, но и проповедовали истину. Ибо слова Божии должно не только слушать, но и другим пересказывать. Итак, будем слушать мы, имеющие в себе дела бесовские, думающие других учить и позволяющие называться от людей учителями. Ибо когда выйдет бес, тогда бывает истинная говорливость и учение, а доколе внутри нас находятся произведения демонов (страсти), дотоле не говорим, хотя и кажемся говорящими.'
      cn: '「喑哑」一词常用来称呼不说话的人；但也可用来称呼不听（不聋）的人，更准确地说，是指既不听也不说话的人。那些生来就不听（不聋）的人，他们也就不说话。这对于他们而言是必然的。因为我们说话，是通过听觉学会的。当一个人不听（不聋）时，他极可能也就不说话。除非某人的听力是在此后因病受损，否则没有什么能阻碍他说话。


        被领到基督面前的这个人，在两个方面都是喑哑的：无论是舌头上，还是耳朵上。他是人类本性的写照，这种本性被恶魔所辖制，既不能听闻上帝的话语，更不能复述（转述）。但主来，驱逐了恶魔，即驱逐了那属情欲和属鬼魔的行事，使我们不仅能够说话，还能传讲真理。因为上帝的话语不仅应当聆听，还应当转述给他人。


        因此，让我们聆听吧，我们这些身怀魔鬼行事之人，我们以为自己能够教导他人，并允许自己被人称为教师。因为当恶魔出去时，才会有真实的健谈和教导，而只要恶魔的产物（情欲）仍在我们里面，我们就不会说话，即使我们看似在说话。'
  - type: paragraph
    initial:
      ru: 'Лк 11:15. '
      cn: （路加福音 11:15）
    text:
      ru: 'Некоторые же из них говорили: Он изгоняет бесов силою веельзевула, князя бесовского.'
      cn: 其中有数人曰、彼藉魔鬼之魁韦野泐碣乌泐逐出魔鬼耳、
  - type: paragraph
    initial:
      ru: 'Лк 11:16. '
      cn: （路加福音 11:16）
    text:
      ru: А другие, искушая, требовали от Него знамения с неба.
      cn: 又有他者、试探寻求之、自天之奇征、
  - type: paragraph
    text:
      ru: 'Фарисеи клевещут на чудо и Господа поносят как обманщика. Они говорят: Он дружен с князем бесовским и при его содействии«изгоняет бесов».'
      cn: 法利赛人诽谤奇迹，并辱骂主为欺骗者。他们说：祂与鬼王交好，并借助于鬼王的协助「驱逐鬼魔」。
  - type: paragraph
    initial:
      ru: 'Лк 11:17. '
      cn: （路加福音 11:17）
    text:
      ru: 'Но Он, зная помышления их, сказал им: всякое царство, разделившееся само в себе, опустеет, и дом,разделившийсясам в себе, падет;'
      cn: 彼知其意、谓之曰、凡国自相分争将墟、家攻家倾败、
  - type: paragraph
    initial:
      ru: 'Лк 11:18. '
      cn: （路加福音 11:18）
    text:
      ru: если же и сатана разделится сам в себе, то ка́к устоит царство его? а вы говорите, что Я силою веельзевула изгоняю бесов;
      cn: 若萨他那自相分争、其国何以立乎、尔等言我藉韦野泐碣乌泐逐出魔鬼、
  - type: paragraph
    text:
      ru: 'Господь говорит им: как возможно, чтобы бес изгонял другого беса? Это было бы уже разрушением его царства. Ибо если они царство и упокоение поставляют в том, чтобы жить в людях, а их же князь изгоняет их, то явно, что он сам себя разрушает. Ибо и«всякое царство, разделившееся»и возмутившееся, расстроивается, и«дом, разделившийся..., падет». Под «домом» будешь ли разуметь здание? Хорошо. Ибо и здание стоит дотоле, доколе оно сохраняет соединенность, а когда стены отстанут одна от другой, оно падает. Будешь ли разуметь под «домом» живущих в дому? И они, доколе соблюдают мир, стоят, а если восстанут друг на друга, то падают.'
      cn: 主对他们说：一个鬼魔怎能驱逐另一个鬼魔？这岂不是在毁坏他的国度吗？因为如果他们将国度和安息寄托在活在人里面，而他们的君主却驱逐他们，那就显然是他自己在毁坏自己了。因为「凡国自相分争」且煽动叛乱的，必然瓦解；而且「家自相分争者必倾覆」。你是否将「家」理解为建筑物？很好。因为一座建筑物，只要它保持连接性，它就能矗立，而当墙壁彼此分离时，它就倒塌了。你是否将「家」理解为居住在房屋中的人？他们只要保持和平，就能站立；而如果他们彼此反叛，他们就会跌倒。
  - type: paragraph
    initial:
      ru: 'Лк 11:19. '
      cn: （路加福音 11:19）
    text:
      ru: и если Я силою веельзевула изгоняю бесов, то сыновья ваши чьею силою изгоняют их? Посему они будут вам судьями.
      cn: 若我藉韦野泐碣乌泐逐出魔鬼、尔等之诸子藉谁以逐之乎、缘此彼等将为尔等之审判者、
  - type: paragraph
    text:
      ru: Пусть будет и так, что«Я изгоняю бесов... силойвеельзевула»; но«сынываши», то есть апостолы,«чьейсилойизгоняют»? Не очевидно ли, что Моим именем? Как же вы обо Мне говорите, что Я изгоняю чрез веельзевула, нуждаясь в силе его, когда сыны ваши, именно апостолы, изгоняют именем Моим? Подлинно, они будут вас судить. Ибо если они изгоняют именем Моим, то Я Сам, очевидно, не имею нужды в силе другого.
      cn: 即使如此，假设「我藉韦野泐碣乌泐之力驱逐魔鬼」；然而，「尔等之诸子」，即众使徒，「藉何能力而驱逐」？难道不显然是藉着我的名吗？既然尔等之诸子，即众使徒，是藉着我的名驱逐（魔鬼），你们又怎能谈论我，说我藉着韦野泐碣乌泐驱逐，需要它的能力呢？确实，他们将要审判你们。因为如果他们是藉着我的名驱逐（魔鬼），那么我本人，显然就不需要他者的能力了。
  - type: paragraph
    initial:
      ru: 'Лк 11:20. '
      cn: （路加福音 11:20）
    text:
      ru: Если же Я перстом Божиим изгоняю бесов, то, конечно, достигло до вас Царствие Божие.
      cn: 若我藉上帝之指逐出魔鬼、则上帝之国果临尔等矣、
  - type: paragraph
    text:
      ru: Я изгоняю«перстом Божиим», то есть Духом Святым, а не духом лукавым. Духа называет«перстом»для того, чтобы ты знал, что как перст одного существа с целым телом, так и Дух Святой единосущен со Отцом и Сыном. А быть может, и не потому ли так называет, что Сын именуется десницей Божией, а на Нем почили семь сил Духа, и не как на орудии Духа, но как на единосущном с Ним; одно же из дарований и действий Духа есть сила врачевать. Говорит, что Я изгоняю бесов«перстом Божиим», то есть дарованием Духа. Ибо как перст есть часть руки, так и дух исцелений был частью тех духов, то есть сил Духа, которые имел Иисус.
      cn: 我藉着「上帝之指」，即圣灵，而不是邪恶的灵来驱逐（魔鬼）。他称圣灵为「指」，是为了让你知晓，正如手指与整个身体同属一体（*единосущен*），圣灵也与父和子同体（*единосущен*）。或许，是不是因为圣子被称为上帝的右手，而七种圣灵的力量安歇在他身上，不是作为圣灵的工具，而是作为与祂同体（*единосущном*）的那一位；而圣灵的恩赐和作为之一就是医治的能力。他说，我藉着「上帝之指」，即圣灵的恩赐来驱逐鬼魔。因为正如手指是手的一部分，医治之灵也是那些灵（即耶稣所拥有的圣灵的能力）的一部分。
  - type: paragraph
    text:
      ru: 'Если, – говорит, –«Я... изгоняю бесов»силой Божией, то подлинно дошло«до вас Царствие Божие». А это имеет такой смысл: разрушается наконец царство диавола, и воцаряется Бог, изгоняющий бесов. Ибо слушай, что говорит далее.'
      cn: 如果，——祂说，——「我藉上帝之力逐出魔鬼」，那么「上帝之国果临尔等矣」。这具有如下的意义：魔鬼的王国终被摧毁，而逐出魔鬼的上帝则开始作王。因为请听祂接下来所说的话。
  - type: paragraph
    initial:
      ru: 'Лк 11:21. '
      cn: （路加福音 11:21）
    text:
      ru: Когда сильный с оружием охраняет свой дом, тогда в безопасности его имение;
      cn: 强者备械而守其家之时、其所有者安全、
  - type: paragraph
    initial:
      ru: 'Лк 11:22. '
      cn: （路加福音 11:22）
    text:
      ru: когда же сильнейший его нападет на него и победит его, тогда возьмет всё оружие его, на которое он надеялся, и разделит похищенное у него.
      cn: 若有更强者来至而胜之时、夺取其所恃之械、而分其所掠者、
  - type: paragraph
    text:
      ru: Прежде Моего пришествия, – говорит, – сатана был силен и«охранялсвой дом», то есть господствовал над естеством человеческим твердо и безопасно. Но когда пришел Я,«сильнейший его», тогда Я победил мир и все«его... оружие..., на которое он надеялся», то есть все виды греха. Ибо грех есть оружие диавола, и им-то он смело преодолевал людей. Это все оружие его Я сокрушил, потому что во Мне не нашлось никакого греха (1Пет. 2, 22); с тех пор он ослабел. И«похищенное у него», то есть людей, которые были как бы добычей его, Я исторг у него и поручаю каждого особому Ангелу, верному хранителю, чтобы вместо беса, у которого он был во власти, управлял им Ангел.
      cn: 「在我的降临之前，」他说，「撒旦是强壮的，并且『守卫着自己的家』，也就是说，他坚定而安全地统治着人性。但是当『比他更强壮的』我来了之时，我便战胜了世界和所有『他所...倚仗...的兵械』，即所有种类的罪。因为罪恶是魔鬼的兵械，他正是凭藉着它大胆地胜过了众人。我摧毁了他所有这些兵械，因为在我里面没有找到任何罪（彼得前书 2:22）；从那时起，他便衰弱了。而『从他那里夺取的』，即那些曾是他的猎物的人们，我将他们从他那里解救出来，并将每一个人托付给一位特别的、忠实的守护天使，好叫取代那曾掌管他的邪魔的，是一位天使来管理他。」
  - type: paragraph
    initial:
      ru: 'Лк 11:23. '
      cn: （路加福音 11:23）
    text:
      ru: Кто не со Мною, тот против Меня; и кто не собирает со Мною, тот расточает.
      cn: 〇夫不与我偕者则敌我、其不与我収敛者、则失散也、
  - type: paragraph
    initial:
      ru: 'Лк 11:24. '
      cn: （路加福音 11:24）
    text:
      ru: 'Когда нечистый дух выйдет из человека, то ходит по безводным местам, ища покоя, и, не находя, говорит: возвращусь в дом мой, откуда вышел;'
      cn: 时邪神由人出、经行旱地、求安息而不得、曰、我将归我所出之家
  - type: paragraph
    initial:
      ru: 'Лк 11:25. '
      cn: （路加福音 11:25）
    text:
      ru: и, придя, находит его выметенным и убранным;
      cn: 及至、则见空虚、扫除修饰、
  - type: paragraph
    initial:
      ru: 'Лк 11:26. '
      cn: （路加福音 11:26）
    text:
      ru: тогда идет и берет с собою семь других духов, злейших себя, и, войдя, живут там, – и бывает для человека того последнее хуже первого.
      cn: 遂往、又携他七神尤恶于己者、入彼处而居之、其人之后患、较前尤甚、
  - type: paragraph
    text:
      ru: И иначе. Какое общение между Мной и веельзевулом? Мое дело – собирать рассеянных чад Божиих; а его дело состоит в том, что он расточает собранных. Как же вы заключаете обо Мне, что Я имею общение с сатаной? Поистине, такое помышление явилось у вас от того, что вы ныне в большем общении с бесами. Нечистый дух жил в вас и прежде, когда вы служили идолам и убивали пророков. Потом, по-видимому, он вышел из вас. А ныне опять возвратился«в дом свой», то есть в ваши души, с«семьюдухами», то есть многими (ибо число«семь»в Писании часто употребляется в значении «много»), и сделал для вас«последнее хуже первого». Ибо тогда, когда вы служили идолам, вы убивали пророков, но еще не наносили явного оскорбления Сыну Божию, ради вас явившемуся во плоти. А ныне какая надежда на спасение, когда вы остаетесь при той же неблагодарности и дерзости и после того, как Сын воплотился и ради вас совершает чудеса?
      cn: 此外。我与彼列西卜之间有什么相通之处？我的事工是聚集上帝分散的儿女；而他的事工则在于他驱散已被聚集的人。你们怎能对我下结论说，我与撒旦相通？事实上，你们生出这种想法，是由于你们如今与鬼魔有更大的相通。那污秽的灵以前就住在你们里面，那时你们事奉偶像、杀害先知。后来，它表面上是离开了你们。但如今它又返回到「自己的家」，即你们的灵魂里，带着「七个灵」，即许多（因为数字「七」在圣经中经常用于表示「许多」的含义），并使你们「末后的景况比先前更差了」。因为那时候，当你们事奉偶像时，你们杀害了先知，但尚未对为了你们以肉身显现的上帝之子造成公然的冒犯。而如今，在圣子已经道成肉身并为了你们施行了神迹之后，你们仍然存留着同样的忘恩负义和胆大妄为，你们得救的希望何在呢？
  - type: paragraph
    text:
      ru: «Места безводные» суть души тех, кои не имеют никакой мягкости, (души) черствые и озабоченные собой. Поскольку же лукавый не имеет никакого места к обитанию в таких душах, то он возвращается к иудеям, и последнее для них становится хуже первого. Так, ныне у них нет уже ни пророков, ибо они убили Слово, ни помазания, ибо они распяли Христа (помазанника). Прежде, хотя они и служили идолам, у них видимы были пророки и помазание; а ныне они всего лишились, потому что согрешили против Сына Божия.
      cn: 「无水之地」乃指那些毫无柔和之性（的灵魂），（指）那些心硬且只顾自身的（灵魂）。既然那恶者在这些灵魂中找不到任何可居留之处，他就回到犹太人那里，而对他们来说，后者的情况比前者更为恶劣。因此，他们如今既没有先知，因为他们杀了「圣言」（Word），也没有膏抹之恩，因为他们钉死了基督（受膏者）。先前，虽然他们也曾侍奉偶像，但先知和膏抹之恩仍可在他们中间可见；但如今，他们却失去了一切，因为他们得罪了上帝之子。
  - type: paragraph
    initial:
      ru: 'Лк 11:27. '
      cn: （路加福音 11:27）
    text:
      ru: 'Когда же Он говорил это, одна женщина, возвысив голос из народа, сказала Ему: блаженно чрево, носившее Тебя, и сосцы, Тебя питавшие!'
      cn: 彼言此之时、民中一妇扬声、语之曰、福哉、怀孕尔之腹、及哺尔之乳房、
  - type: paragraph
    text:
      ru: Тогда как фарисеи и книжники порочат чудеса Господа, жена, лицо бесхитростное и простое, прославляет Его. Где те, кои говорят, что Господь явился призрачно? Ибо вот свидетельство, что Он и сосцами питался!
      cn: 那时，当法利赛人与文士诽谤主的奇迹时，一个女人——一个无城府且单纯的人——却在赞美祂。那些说主是以幻影显现的人，在哪里呢？因为你看，有证据证明祂曾受乳房哺乳！
  - type: paragraph
    initial:
      ru: 'Лк 11:28. '
      cn: （路加福音 11:28）
    text:
      ru: 'А Он сказал: блаженны слышащие слово Божие и соблюдающие его.'
      cn: 彼曰、听上帝之言而守之者、亦福哉、
  - type: paragraph
    text:
      ru: А Он ублажает тех, кои соблюдают слово Божие, впрочем, отнюдь не с тем, чтобы Мать Свою лишить ублажения, но с тем, чтобы показать, что и Она не получила бы никакой пользы от того, что родила Его и питала сосцами, если бы не имела всех прочих добродетелей. Говорит это вместе и потому, что идет ко времени. Поскольку завидующие Ему и неслушающие слов Его поносили слушающих, то Он вопреки им особенно ублажает слушающих. Может быть, Он говорит это и ради исцеленного глухого, чтобы и он, выслушав слово, соблюдал оное, чтобы (дарованная ему) способность слышать не послужила ему в осуждение.
      cn: '但他称颂那些遵守上帝之言的人，此外，绝非意在剥夺他母亲的称颂，而是要表明，即便她生下他，并用乳房喂养他，倘若她没有其他所有的美德，她也得不到任何益处。


        他如此说，同时也是因为这正合时宜。既然那些嫉妒他且不听他话语的人污蔑那些听他话语的人，那么他便反驳他们，尤其称颂那些听他话语的人。


        也许，他如此说也是为了那个被治愈的聋子，好让他，在听了这言之后，遵守这言，以免（赐予他的）听觉能力反倒成为他的罪证。'
  - type: paragraph
    initial:
      ru: 'Лк 11:29. '
      cn: （路加福音 11:29）
    text:
      ru: 'Когда же народ стал сходиться во множестве, Он начал говорить: род сей лукав, он ищет знамения, и знамение не дастся ему, кроме знамения Ионы пророка;'
      cn: 〇民聚集时、彼言起曰、此乃恶世代而寻求奇征、除先知伊鄂那之奇征外、而奇征不予之、
  - type: paragraph
    text:
      ru: '«Когда... народ стал сходиться во множестве», Господь начал обличать неразумных. Между ними было несколько таких, кои желали, чтобы Иисус совершил знамение с неба; ибо говорили: знамения, какие Он творит, суть от земли, и Он творит их силой веельзевула, князя мира, имеющего власть над землей; а знамения с неба Он не может сотворить, потому что Он не есть Сын Отца Небесного. Поскольку некоторые так говорили, то Господь обличает их и говорит: дастся вам знамение, которое докажет, что Я – истинный Сын Небесного Отца. Какое же?«Знамение Ионы», то есть знамение Воскресения (Ион. 2, 1).'
      cn: 「当……民众开始聚集成群时」，主开始斥责那些不理智的人。在他们当中有几位，他们渴望耶稣行一个来自天上的神迹；因为他们说：祂所行的神迹，是从地上来的，祂是藉着别西卜——世界之王，那对大地拥有权柄者——的能力而行神迹；而来自天上的神迹祂不能行，因为祂不是天父的儿子。鉴于有些人如此言说，主就斥责他们并说道：必将给你们一个神迹，它将证明我——是天父真实的儿子。那是什么神迹呢？「伊鄂那的神迹」，即是复活的神迹（约拿书 2:1）。
  - type: paragraph
    initial:
      ru: 'Лк 11:30. '
      cn: （路加福音 11:30）
    text:
      ru: ибо ка́к Иона был знамением для Ниневитян, та́к будет и Сын Человеческий для рода сего.
      cn: 盖如先知伊鄂那为尼涅微亚人已成为奇征、人子亦将为此世代成为奇征、
  - type: paragraph
    text:
      ru: Ибо как он провел три дня во чреве китовом, так и Я пробуду три дня во чреве кита, великого животного, то есть ада, и воскресну. Когда Иона, выброшенный китом и как бы снова оживший, начал проповедовать, то ниневитяне послушались (Ион. 3, 3–6); а Мне и после Воскресения Моего род сей не поверит. Поэтому они будут осуждены за то, что не подражали ниневитянам, хотя здесь больше Ионы. Ибо Мое достоинство и способ проповеди представляют большое различие. Я – Владыка, он – раб. Я проповедую Царство Небесное, он – спасение от угрожающей погибели, Я совершаю чудеса, он не сотворил никакого чуда.
      cn: 「盖如他于鲸腹中度三日，故我亦将停留三日于鲸鱼、此巨兽、即地狱之腹中，并复活。当约拿被鲸鱼吐出，如同再次苏醒时，他开始宣讲，尼尼微人便顺从了（约拿书 3:3-6）；而我之复活后，此世代却不相信我。因此，他们将受定罪，因他们未效法尼尼微人，纵然这里有比约拿更大的。盖我的尊贵与宣讲之方式存有巨大差异。我是主宰，他是仆役。我宣讲天国，他宣讲脱离迫近之灭亡而得救，我施行神迹，他未曾创造任何神迹。」
  - type: paragraph
    initial:
      ru: 'Лк 11:31. '
      cn: （路加福音 11:31）
    text:
      ru: Царица южная восстанет на суд с людьми рода сего и осудит их, ибо она приходила от пределов земли послушать мудрости Соломоновой; и вот, здесь больше Соломона.
      cn: 南方女王当审判时、偕此世代将共起而罪之、因彼自地极来、为听莎罗孟之智慧、且顾、在此尤有大于莎罗孟者、
  - type: paragraph
    initial:
      ru: 'Лк 11:32. '
      cn: （路加福音 11:32）
    text:
      ru: Ниневитяне восстанут на суд с родом сим и осудят его, ибо они покаялись от проповеди Иониной, и вот, здесь больше Ионы.
      cn: 尼涅韦亚人于审判时、偕此世代共起而罪之、因彼等藉伊鄂那之传教痛悔矣、且顾、在此尤有大于伊鄂那者、
  - type: paragraph
    text:
      ru: Равным образом и«царица южная... осудит»род сей, ибо она приходила с конца земли слушать премудрости Соломона.
      cn: 同样地，「南方女王……将要定罪」这世代，因为她曾从地极而来听取所罗门的智慧。
  - type: paragraph
    text:
      ru: Под «царицей южной» разумей, пожалуй, и всякую душу, сильную и постоянную в добре. Объяснюсь. Север, когда служит символом местопребывания противника, Писанием не одобряется, потому что он холодит и наводит омертвение и оцепенение; а юг (как противоположный северу) одобряется, потому что южный ветер приносит теплоту, оживление, отогревает и оцепеневшие части. Поэтому и в Песни песней невеста, прогоняя север, говорит:«Поднимись... с севера и принесись с юга»(Песн. 4, 16), и пророк опять говорит:«И пришедшего от севера удалю от вас», то есть сатану (Иоил. 2, 20). Итак, душа, царствующая на юге, то есть в благодатной стране духовной жизни, и окрепшая чрез упражнение в деятельности, приходит слушать премудрость, то есть восходит к созерцанию. Ибо премудрость Соломона, мирного царя, есть созерцание Господа и Бога нашего, которого никто не достигнет иначе, если чрез упражнение в деятельности не сделается царем и владыкой в добродетельной жизни.
      cn: 「南方女王」这个说法，或许也可以理解为任何一种在美善上刚强而坚毅的灵魂。我来解释一下。北方，当它被用来象征敌对者居所时，在《圣经》中是不被认可的，因为它会使人寒冷，引致死寂和麻木；而南方（作为北方的对立面）则是被认可的，因为南风带来温暖、生机，并能使麻木的部分得以回暖。因此，在《雅歌》中，新娘驱走北方时说：「北风啊，兴起！南风啊，吹来！」（雅歌 4:16）。先知又说：「那从北方来的，我要使他远离你们，」这指的就是撒旦（约珥书 2:20）。因此，在南方，亦即在属灵生活的恩典之境中为王的灵魂，并通过操练活动而变得刚健有力，它就会前来聆听智慧，亦即上升到默观的境界。因为所罗门这位和平之王的智慧，就是对我们的主和上帝的默观，除非一个人通过操练活动在德性的生活中成为君王和主宰，否则他将无法达到这一境界。
  - type: paragraph
    initial:
      ru: 'Лк 11:33. '
      cn: （路加福音 11:33）
    text:
      ru: Никто, зажегши свечу, не ставит ее в сокровенном месте, ни под сосудом, но на подсвечнике, чтобы входящие видели свет.
      cn: 未有人燃灯置于隐僻中及斗下者、乃置于灯台上、为入者见其光、
  - type: paragraph
    text:
      ru: 'Поскольку завистливые иудеи, смотря на чудеса, по злобе ума превратно толковали их, то Господь и говорит следующее: люди, получившие«светильник»от Бога, то есть дар ума, которым мы смотрим, как бы светом нам данным, сокрыли рассудительность и, омрачив себя завистью, не видят чудес и благодеяний, хотя мы для того получили ум, чтобы поставлять на подсвечник, чтобы и другие«видели свет». По моему мнению, Он говорит так: фарисей! ты имеешь знание – это светильник. Тебе следовало воспользоваться сим знанием к тому, чтобы самому признать чудеса и другим объявить и объяснить, что они суть дела Сына Божия, а не веельзевула. Таким образом и«входящие», то есть вновь вводимые и начинающие, увидели бы свет. Ибо кто мудр, тот уже вошел; а кто еще учится, тот лишь входит.'
      cn: 鉴于那些心怀嫉妒的犹太人，在看到神迹时，却因心智之恶毒而对它们进行曲解，故此主说出以下一番话：那些从上帝那里领受了「灯」（светильник），即心智之天赋（dar uma）的人——我们借此天赋，如同借着赐予我们的光来看事物一般——却隐藏了理性（рассудительность），并因嫉妒而使自己阴暗，不看神迹与恩惠。尽管我们领受心智，乃是为了将其置于灯台上，好让其他人也能「看见光」。依我之见，祂是在如此说：法利赛人！你拥有知识——这就是灯。你本应利用这知识，亲自承认这些神迹，并向他人宣告和解释，它们是上帝之子，而非彼耳西布（веельзевула）所行的作为。如此一来，那些「进入者」（входящие），即那些新近被引入和开始学习的人，也会看见光。因为那有智慧的人，已然进入；而那仍在学习的人，则仅仅是正在进入。
  - type: paragraph
    initial:
      ru: 'Лк 11:34. '
      cn: （路加福音 11:34）
    text:
      ru: Светильник тела есть око; итак, если око твое будет чисто, то и всё тело твое будет светло; а если оно будет худо, то и тело твое будет темно.
      cn: 〇身体之灯目也、夫尔目若净、则尔全身明、若恶、则尔全身暗、
  - type: paragraph
    initial:
      ru: 'Лк 11:35. '
      cn: （路加福音 11:35）
    text:
      ru: 'Итак, смотри: свет, который в тебе, не есть ли тьма?'
      cn: 故慎哉、勿使尔内之光为暗、
  - type: paragraph
    initial:
      ru: 'Лк 11:36. '
      cn: （路加福音 11:36）
    text:
      ru: Если же тело твое всё светло и не имеет ни одной темной части, то будет светло всё та́к, как бы светильник освещал тебя сиянием.
      cn: 若尔全身明、无一毫之暗、则全明如灯、如其光照尔之时、
  - type: paragraph
    text:
      ru: Но вы, фарисеи, не захотели сделать сего, а око души, то есть ум, доселе прямой, искривили и затемнили. Ибо как око тела, каково само, таковым делает и тело, например, если оно чисто, то и тело светло, а если оно темно, то и тело мрачно, так же точно и душа располагается по состоянию ума. Если око и свет, полученные ей от Бога, начинают омрачаться завистью или любостяжанием, вообще сказать, любовью к вещественному, то и она омрачается.
      cn: 但是你们法利赛人，不愿意做这事，反而将灵魂的眼睛，即迄今为止仍是正直的悟性（ум），使其弯曲且黑暗了。因为正如身体的眼睛，其自身如何，也会使身体如何，例如，如果它是纯洁的，那么身体也是光明的；如果它是黑暗的，那么身体也是阴郁的。同样，灵魂也完全取决于悟性的状态。如果灵魂从上帝那里得到的这眼睛和光芒，开始被嫉妒或贪爱钱财，总而言之，被对物质的热爱所蒙蔽，那么灵魂也随之变得黑暗。
  - type: paragraph
    initial:
      ru: 'Лк 11:37. '
      cn: （路加福音 11:37）
    text:
      ru: Когда Он говорил это, один фарисей просил Его к себе обедать. Он пришел и возлег.
      cn: 彼言之时、有发利些乙人请彼共食、彼入而席坐、
  - type: paragraph
    text:
      ru: Хотя Господь знает недоброжелательство фарисеев, однако ж, обедает с ними потому, что они были лукавы и нуждались в исправлении. Ибо для того Он обедает с ними, чтобы иметь повод к улучшению нравов их.
      cn: 尽管主知晓法利赛人的恶意，但他仍旧与他们一同用膳，因为他们是奸诈的，且需要被改正。他与他们一同用膳，正是为了获得改善其习性的由头。
  - type: paragraph
    initial:
      ru: 'Лк 11:38. '
      cn: （路加福音 11:38）
    text:
      ru: Фарисей же удивился, увидев, что Он не умылрукперед обедом.
      cn: 发利些乙人见彼饭前、不先洗则奇之、
  - type: paragraph
    text:
      ru: Например, и теперь, смотря на неразумный их обычай – умываться пред вкушением пищи, научает, что душа должна быть очищена добрыми делами, так как полоскание водой очищает не душу, а тело. Они, безрассудные, думали, что чрез погружение в воде и омытие тела вместе с телом очищается и душа их. Поэтому Господь воспользовался прекрасным примером чаши.
      cn: 例如，就在此刻，祂看着他们不合情理的习俗——在享用食物前洗手——教导说：灵魂必须借由善行洁净，正如用水冲洗所洁净的并非灵魂，而是身体。那些无理之人曾认为，借由在水中浸洗和沐浴身体，他们的灵魂也同身体一起被洁净了。因此，主利用了茶杯这个绝妙的例子。
  - type: paragraph
    initial:
      ru: 'Лк 11:39. '
      cn: （路加福音 11:39）
    text:
      ru: 'Но Господь сказал ему: ныне вы, фарисеи, внешность чаши и блюда очищаете, а внутренность ваша исполнена хищения и лукавства.'
      cn: 主乃语之曰、今尔发利些乙等洁净杯盘之外、惟尔等内充满劫夺及诸恶、
  - type: paragraph
    text:
      ru: 'И как время было стола, Он упоминает о чаше и блюде и, заимствуя свидетельство от того, что лежало пред глазами, убеждает фарисея, что как нет никакой пользы, если чаша снаружи чиста, а внутри наполнена всякой грязью, так нет никакой пользы и в том случае, если, при омывании тела, душа исполнена всякой нечистоты, например,«хищения и лукавства». Господь сделал намек на две господствующие страсти иудеев: словом«хищение»– на любостяжание, словом«лукавство»– на зависть и следствия зависти. Итак, никакой нет пользы, если душа находится в таком состоянии.'
      cn: 当用膳之时，他提到杯和盘，并且借用眼前之物作为佐证，以说服法利赛人：正如杯子若外表洁净，而内里充满各种污秽，是毫无益处的；同样，若在洗净身体时，灵魂却充满了各种不洁，例如「劫夺和诸恶」（或译「劫夺和不义」），也是毫无益处的。主在此暗指犹太人普遍存在的两种主要情欲：以「劫夺」（хищение）一词指代贪婪，以「诸恶」（лукавство，此处译为「诸恶」或「不义」）一词指代嫉妒及嫉妒的后果。因此，如果灵魂处于如此状态，是毫无益处的。
  - type: paragraph
    initial:
      ru: 'Лк 11:40. '
      cn: （路加福音 11:40）
    text:
      ru: Неразумные! не Тот же ли, Кто сотворил внешнее, сотворил и внутреннее?
      cn: 愚者乎、造外者亦非造内者乎、
  - type: paragraph
    text:
      ru: Безрассудные! Не Тот же ли сотворил и душу, Кто сотворил тело, на котором вы так много останавливаетесь? Поэтому вы должны и душу очищать.
      cn: 无理智的人们！难道创造灵魂的，不是与创造身体（你们如此多地关注于身体）的是同一位吗？因此，你们必须也要洁净灵魂。
  - type: paragraph
    initial:
      ru: 'Лк 11:41. '
      cn: （路加福音 11:41）
    text:
      ru: Подавайте лучше милостыню из того, что́ у вас есть, тогда всё будет у вас чисто.
      cn: 惟尔等自所有者中施哀矜、顾、尔等则为全洁矣、
  - type: paragraph
    text:
      ru: 'Потом научает их, как очищается внутренность, именно: указывает на«милостыню». Смотри, пожалуй, как Он, указав на милостыню, врачует обе страсти их, разумею зависть и хищения. Ибо кто истинно милостив, тот не будет ни похищать у того, кому он творит милостыню, ни завидовать ему. Итак, поскольку Он порицал в них две страсти, то изгоняет их одним лекарством, именно милостыней, которая есть первая дверь боготворящей любви. А где любовь, там какое любостяжание и зависть?«Из того, что́ у вас есть», то есть от имения вашего. Хорошо сказал:«из того, что́ у вас есть», а не просто: «из того, что есть», потому что имение находится в сердце любостяжательного и господствует в нем. Почему и Давид заповедует«не прилагать...сердца»к богатству (Пс. 61, 11), то есть не пригвождать его и не привязывать.'
      cn: 随后，祂教导他们内心（vnutrennost）如何得以洁净，确切地说：祂指向了「施舍」（milostynyu）。请看，祂是如何通过指向施舍，来医治他们两种情欲的，我指的是嫉妒和劫掠。因为真正施舍的人，既不会去劫掠他施舍的对象，也不会去嫉妒他。因此，既然祂批评他们身怀两种情欲，祂便用一种药物将它们驱逐，那便是施舍，施舍是那敬爱上帝之爱（bogotvoryashchey lyubvi）的首要门户。哪里有爱，哪里又会有何种贪婪和嫉妒呢？「自所有者中」（Iz togo, chto u vas est），即是说，自你们的财物中。祂说「自所有者中」，而非仅说「自所有中」，说得极好，因为财物停留于贪婪者的心中，并在其中占据主导地位。因此大卫也吩咐人勿将「心」附着于财富（诗篇 61:11），即是说，不要将心钉住，也不要将心束缚。
  - type: paragraph
    initial:
      ru: 'Лк 11:42. '
      cn: （路加福音 11:42）
    text:
      ru: 'Но горе вам, фарисеям, что даете десятину с мяты, руты и всяких овощей, и нерадите о суде и любви Божией: сие надлежало делать, и того не оставлять.'
      cn: 〇祸哉、尔等发利些乙人乎、因尔等由薄荷、茴香、及诸菜蔬而彻、反轻视上帝之审判及爱慕、此当行彼亦不可遗之、
  - type: paragraph
    text:
      ru: 'Фарисеи именно для того, чтобы не преступить Закона, давали десятину и с самых незначительных предметов, и если кто упрекал их в мелочности, они ссылались на Закон, который повелевал приносить священникам десятину со всего (Втор. 14, 22–23). Поэтому Господь и говорит: как сим вы не пренебрегаете, так надлежало вам творить суд и любовь Божию. Поскольку фарисеи были неправосудны, притесняли вдовиц и сирот, то Господь говорит: должно вам иметь «суд», то есть правосудие. Поскольку же они были презрительны и к Богу, без рассуждения простирая руку к священным делам, то Господь заповедует им иметь «любовь Божию». Ибо кто любит Бога, тот к делам Его не приступает с пренебрежением. А мне кажется, поскольку два вида любви: любовь к Богу и любовь к ближнему, то, быть может, Господь делает намек на два эти вида: словом «суд» обозначает любовь к ближнему, так как правосудие и непритеснение ближнего происходят от любви к нему, а словом «любовь Божия», без сомнения, обозначает всецелое расположение к Богу. И когда кто любит ближнего не по какому-нибудь мирскому или постыдному расположению, но ради Бога, тогда и эта любовь может быть названа любовью Божией, так как она заповедана Богом и благоугодна Ему.'
      cn: 法利赛人正是为了不违犯律法，才连最微不足道的物品也要缴纳十分之一，倘若有人责备他们细琐小气，他们便援引律法，因律法命人要从一切出产中向祭司献纳十分之一（申命记 14:22-23）。因此，主说：你们既不忽略这些，就更应当行审判和上帝的爱慕。因为法利赛人不公义，欺压寡妇和孤儿，所以主说：你们应当拥有「审判」，即是公义（правосудие）。又因为他们对上帝也是轻蔑的，不加思索地伸手去触摸神圣之事，所以主命令他们要有「上帝的爱慕」。因为爱上帝的人，就不会以轻蔑的态度行祂的事。在我看来，既然爱有两种：爱上帝和爱邻人，那么主或许是在暗示这两种爱：祂用「审判」一词来指代爱邻人，因为公义和不欺压邻人是出于爱邻人，而用「上帝的爱慕」一词，无疑是指对上帝全心全意的倾向。并且，当一个人爱邻人，不是出于某种世俗的或可耻的倾向，而是为了上帝的缘故时，那么这种爱也可以被称为上帝的爱慕，因为它是由上帝所命令的，并为祂所喜悦的。
  - type: paragraph
    initial:
      ru: 'Лк 11:43. '
      cn: （路加福音 11:43）
    text:
      ru: Горе вам, фарисеям, что любите председания в синагогах и приветствия в народных собраниях.
      cn: 祸哉、尔等发利些乙乎、好在会堂首位、及于市厂上问安、
  - type: paragraph
    text:
      ru: Они (фарисеи) любили, чтобы всякий человек отдавал им честь и чтобы«в народных собраниях»называли их титулом:«учитель»(Мф. 23, 7); это означают слова:«приветствие",«председание".
      cn: 他们（法利赛人）喜爱每个人都向他们致敬，也喜爱「在民间的聚会中」人们称呼他们以「教师」的头衔（马太福音 23:7）；这正是「问安」与「首位」这些词语的意义所在。
  - type: paragraph
    initial:
      ru: 'Лк 11:44. '
      cn: （路加福音 11:44）
    text:
      ru: Горе вам, книжники и фарисеи, лицемеры, что вы – как гробы скрытые, над которыми люди ходят и не знают того.
      cn: 祸哉、尔等伪善之学士及发利些乙等、因尔等如隐没之墓、人人行其上不知焉、
  - type: paragraph
    text:
      ru: 'Господь же говорит: вы подобны гробам, которые полны всякой гнилости, а снаружи блещут мрамором; люди по наружности их не узнают, какими правилами они руководствуются в жизни (по чему они ходят), а если бы знали, то отвратились бы по причине внутренней скверности.'
      cn: 主则言曰：尔等如同坟墓，内中尽是腐烂之物，外表却以大理石光耀闪烁；世人仅凭其外貌，不知其生活中遵循何种准则（不知其行走何途），而若知晓，则必因其内在之污秽而厌弃。
  - type: paragraph
    initial:
      ru: 'Лк 11:45. '
      cn: （路加福音 11:45）
    text:
      ru: 'На это некто из законников сказал Ему: Учитель! говоря это, Ты и нас обижаешь.'
      cn: 有法律师中一人答之曰、师欤、尔言此、亦耻辱我等矣、
  - type: paragraph
    text:
      ru: Законник безрассудно сам себя подвергает обличению. Законники были иное, чем фарисеи. Фарисеи считались подвижниками и отсеченными от прочих, а законники были книжники и учителя и для желающих разрешали вопросы из Закона.
      cn: 律师（法学家）毫无理智地使自己遭受了指责。律师与法利赛人是不同的。法利赛人被视为苦修者和与众人分离出来的人，而律师则是经师和教师，为那些愿意的人解答律法上的问题。
  - type: paragraph
    initial:
      ru: 'Лк 11:46. '
      cn: （路加福音 11:46）
    text:
      ru: 'Но Он сказал: и вам, законникам, горе, что налагаете на людей бремена неудобоносимые, а сами и одним перстом своим не дотрагиваетесь до них.'
      cn: 彼曰、尔等法律师乎、亦祸哉、因尔等将难负之任委置于人、而己则一指亦不着任、
  - type: paragraph
    text:
      ru: Они (законники) налагали на людей«бременатяжелые инеудобоносимые»; а сами не дотрагивались до этих бремен«и... перстом своим», то есть сами ничего не соблюдали из того, что заповедовали прочим. Ибо когда учитель сам делает то, чему учит, тогда он облегчает бремена, подавая в самом себе пример и ободряя учеников. Когда же он ничего не делает из того, чему учит, тогда бремена кажутся ученикам истинно тяжелыми, так как и учитель не может выполнить их.
      cn: 他们（法律师们）将「难负之任与重轭」施加于人；而他们自己则「一指亦不着」这些重任，也就是说，他们自己并未遵守他们命令他人遵守的任何事情。因为当一位教师自己践行他所教导的，他便减轻了重任，在他自己身上提供了榜样，并鼓励了学生。然而，当他自己不践行他所教导的任何事情时，这些重任对于学生来说就显得真正沉重了，因为连这位教师也无法完成它们。
  - type: paragraph
    initial:
      ru: 'Лк 11:47. '
      cn: （路加福音 11:47）
    text:
      ru: 'Горе вам, что строите гробницы пророкам, которых избили отцы ваши:'
      cn: 〇祸哉、尔等因建先知之墓、乃尔等之祖所杀者、
  - type: paragraph
    initial:
      ru: 'Лк 11:48. '
      cn: （路加福音 11:48）
    text:
      ru: сим вы свидетельствуете о делах отцов ваших и соглашаетесь с ними, ибо они избили пророков, а вы строите им гробницы.
      cn: 且证且喜尔等祖父所为者、因伊等杀之、而尔等建其墓、
  - type: paragraph
    initial:
      ru: 'Лк 11:49. '
      cn: （路加福音 11:49）
    text:
      ru: 'Потому и премудрость Божия сказала: пошлю к ним пророков и Апостолов, и из них одних убьют, а других изгонят,'
      cn: 是以上帝之睿智曾言曰、我将遣先知及宗徒等就彼等、其中有杀者、逐者、
  - type: paragraph
    initial:
      ru: 'Лк 11:50. '
      cn: （路加福音 11:50）
    text:
      ru: да взыщется от рода сего кровь всех пророков, пролитая от создания мира,
      cn: 以至由此世代追索诸先知之血、乃自创世以来所流者、
  - type: paragraph
    initial:
      ru: 'Лк 11:51. '
      cn: （路加福音 11:51）
    text:
      ru: от крови Авеля до крови Захарии, убитого между жертвенником и храмом. Ей, говорю вам, взыщется от рода сего.
      cn: 即自阿韦泐之血、至被害于祭台祭殿间咂哈利亚之血、诚哉、我告尔等、将由此世代追索也、
  - type: paragraph
    text:
      ru: 'Господь обнаруживает также, что иудеи – потомки Каина и наследники его злобы, когда говорит, что вся«кровь, пролитая... от Авеля до... Захарии,... взыщется от рода сего». Вы, – говорит, – убивали пророков, братьев ваших, как и он – Авеля. Почему не без основания некоторые принимали Каина за образ людей, побивавших пророков, за что отмщено им в семь раз, то есть наказанием легчайшим, а Ламеха – за образ людей, убивших Христа, за что отмщено им в семьдесят раз седмижды (Быт. 4, 24), именно: рассеянием в плен безвозвратный.'
      cn: 上主也揭示出，当祂说所有「流的血……从阿贝尔直到……匝哈里亚，……将要向这一世代追索」时，犹太人便是该隐的后裔和其恶行的继承者。祂说：「你们杀害了你们的兄弟，即先知们，正如他（该隐）杀害了阿贝尔一样。」因此，有些人并非毫无根据地认为该隐是那些击杀先知之人的预表，为此他们得到了七倍的报复，即最轻的惩罚；而认为拉麦是那些杀害基督之人的预表，为此他们得到了七十七倍的报复（创世记 4:24），具体而言，便是被驱散到无法归还的流亡之中。
  - type: paragraph
    text:
      ru: Кто же был Захария, которого убили между храмом и алтарем? Одни говорят, что это давнишний Захария, сын Иодаев, которого побили камнями, как известно из книги Царств (2Пар. 24, 20–21). Другие же говорят, что это отец Предтечи. Он не исключил из ряда дев Богородицу после того, как она родила Христа, и поставил ее на том же месте, где и они стояли; а это место было между храмом и внешним медным алтарем. За это и убили его. Так как некоторые ожидали во Христе будущего царя своего, а другие между тем не желали быть под властью царя, то поэтому убили этого святого и за то, что он утверждал, что родила Дева и что родился Христос, будущий Царь их, что было им противно, ибо они желали быть без царя.
      cn: 那么，那位被杀于圣殿与祭台之间的人，匝哈利亚，他是谁呢？有人说，他是那位古代的匝哈利亚，即约雅达（Iodaev）的儿子，他如王纪所载（历代志下 24:20-21）被石头砸死。另一些人则说，他是前驱者（Предтечи）的父亲。在圣母诞下基督之后，他没有将她排除在贞女之列，而是让她站在了她们所站立的同一个地方；而这个地方正是在圣殿与外部的铜祭台之间。他因此被杀。由于有些人期待基督是他们未来的君王，而另一些人同时不愿受制于君王的权柄，因此，他们也杀害了这位圣人，原因是他坚称童贞女已经生产，并且坚称基督这位他们未来的君王已经诞生，这对他们来说是抵触的，因为他们渴望不受君王管辖。
  - type: paragraph
    initial:
      ru: 'Лк 11:52. '
      cn: （路加福音 11:52）
    text:
      ru: 'Горе вам, законникам, что вы взяли ключ разумения: сами не вошли, и входящим воспрепятствовали.'
      cn: 祸哉、尔等法律师乎、因尔等取智识之钥、尔自不进、有欲进者、而反阻之、
  - type: paragraph
    text:
      ru: «Ключомразумения»Господь назвал учение и руководство посредством Закона, могущего приводить ко Христу. Ибо Закон, без сомнения, служит руководителем ко Христу (Гал. 3, 24). Итак, законники по-видимому объясняли Закон, а между тем злонамеренно удерживали«ключ разумения»и не отворяли дверей Закона, чрез которые могли бы сами они и народ прийти ко Христу. Закон служит дверью ко Христу. Но эта дверь остается заключенной, если кто-нибудь не объяснит премрачной стороны Закона и таким образом не отворит двери. Ибо и Господь сказал:«если бы вы верили Моисею, то поверили бы и Мне»(Ин. 5,46). И опять:«Исследуйте Писания,... они свидетельствуют о Мне. Но вы не хотите придти ко Мне»(Ин. 5, 39–40). Для примера укажу на одно.
      cn: 「智慧之钥」（Ключом разумения）乃是主所称的、借由律法进行的教导和指引，它能够引人归向基督。因为，律法无疑是引人归向基督的导师（加拉太书 3:24）。因此，律法师表面上解释律法，然而却恶意地扣留着「智慧之钥」，不开启律法之门，而他们本可通过此门，自己和民众都能来到基督面前。律法是通向基督的门。但是，若无人解释律法中那晦暗幽深的一面，从而开启此门，这门便仍将是紧闭的。因为主也曾说过：「你们若是信摩西，也会信我」（伊鄂昂福音 5:46）。又说：「你们探究圣经，……它们是为我作证的。可是你们不愿到我这里来」（伊鄂昂福音 5:39–40）。举例而言，我将指出一点。
  - type: paragraph
    text:
      ru: У иудеев, как известно, закалаем был агнец, помазываемы были пороги, вкушали они эти мяса, и это у них было победой над губителем (Исх. 12, 1–13). Всем этим предызображалось Таинство Христово.
      cn: 众所周知，在犹太人中，羔羊被宰杀，门楣被涂抹，他们食用了这些肉，这对他们来说是战胜毁灭者（出埃及记 12:1-13）的胜利。所有这一切都预示了基督的奥秘。
  - type: paragraph
    text:
      ru: Когда Христос заклался как Непорочный и Пречистый Агнец, тогда помазаны и наши пороги, то есть сердце и воля, и наддверие их, то есть ум, и мы вкусили плоти Сына Человеческого и победили губителя душевных наших сил. И очень многие установления Закона указывали на Христа.
      cn: 当基督被宰杀，作为无瑕疵、至洁净的羔羊时，我们的门槛，即我们的心和意志，以及它们上方的门楣，即我们的心智，都被膏抹了；并且我们尝到了人子（子）的肉，击败了我们灵魂力量的毁灭者。而且律法中非常多的规定都指向基督。
  - type: paragraph
    text:
      ru: Хотя Закон был как бы прикрыт и заперт темнотой буквы, как бы дверью какой, но если кому-нибудь вверяемо было учение, тот имел ключ разумения; и если бы таковой пожелал, то мог бы отворить его, и сам вошел бы, и других бы ввел. Но законники не сделали этого, а«ключ разумения... взяли», то есть сокрыли, спрятали из виду; когда же взят был от среды (скрыт) этот ключ, то есть истолкование Закона, то запертой осталась и дверь его.
      cn: 虽然律法似乎被字句的黑暗所遮蔽和锁住，好像被一道门锁住一样，但如果教义被托付给任何一个人，那人就拥有了理智的钥匙（钥匙是理智，即正确的解读能力）；这样的人如果愿意，他就能打开它，自己进入，并且引领他人进入。但是，这些法学家却没有这样做，反倒「取了智识之钥」（路加福音 11:52），也就是说，他们将其隐藏了，藏到看不见的地方。当这把钥匙，也就是对律法的解释，被从他们当中取走（隐藏）时，律法之门也就依然紧锁了。
  - type: paragraph
    text:
      ru: 'Под «ключом разумения» можешь понимать и веру. Ибо познание истины происходит чрез веру, как и пророк Исаия говорит: Если не уверуете, не уразумеете (Ис. 6, 10). Итак, законники«ключ разумения», то есть веру, взяли от среды и скрыли. Ибо они не допускали некоторых веровать во Христа, Спасителя всех. Он творил чудеса, и народ, веруя ради этих чудес, признал бы Его Богом, но они (законники) говорили, что Он совершает эти чудеса силой веельзевула. Видишь ли, как они взяли ключ разумения, не допуская верить тому, что самих привело бы к знанию? Он (Христос) в синагогах учил воле Божией, а они (законники) говорили: беса имеет и беснуется, зачем Его слушаете?'
      cn: '你可以将「智识之钥」（ключом разумения）理解为信仰。因为真理的认知是借由信仰而发生的，正如先知以赛亚所言：你们若不信，就不得而立（以赛亚书 6:10）。


        因此，法律师们取走了「智识之钥」，也就是信仰，并将它藏匿起来。因为他们不容许某些人相信基督，即众人的救主。他行了神迹，百姓本会因着这些神迹而相信，承认他是上帝，但那些（法律师们）却说他借着别西卜的力量行这些神迹。你明白了吗？他们是如何取走智识之钥的？他们不容许相信本可以引导他们自己认识真理的事物。


        他（基督）在会堂里教导上帝的旨意，但那些（法律师们）却说：他被鬼附着，且是癫狂的，你们为何听他呢？'
  - type: paragraph
    text:
      ru: Итак, они (то есть фарисеи и книжники), поистине, взяли ключ разумения, но сами не вошли и других не впустили, и притом«входящих», то есть способных уже к богопознанию.
      cn: 因此，他们（即法利赛人和文士）确实拿走了理解的钥匙，但他们自己没有进去，也没有让其他人进去，而且是那些「正在进去的」，即那些已经有能力进行认识上帝的人。
  - type: paragraph
    initial:
      ru: 'Лк 11:53. '
      cn: （路加福音 11:53）
    text:
      ru: Когда Он говорил им это, книжники и фарисеи начали сильно приступать к Нему, вынуждая у Него ответы на многое,
      cn: 彼言此之时、学士及发利些乙等强迫之、以甚多者诘之、
  - type: paragraph
    initial:
      ru: 'Лк 11:54. '
      cn: （路加福音 11:54）
    text:
      ru: подыскиваясь под Него и стараясь уловить что-нибудь из уст Его, чтобы обвинить Его.
      cn: 窥伺捕有出其口者、为罪之、
  - type: paragraph
    text:
      ru: '«Когда Онещеговорил»сие, они вместо того, чтобы признаться в своем бессилии, как бы в опровержение Его слов объявили себя именно мудрейшими Его и начали заграждать Ему уста, то есть непрерывно спрашивать Его и приводить в недоумение. Ибо обыкновенно происходит затруднение в речах, когда одного человека очень многие вдруг спрашивают, и притом о разных предметах. Тогда человек этот, не имея возможности всем отвечать, неразумным дает повод считать себя побежденным. То же злоумышляли против Христа и эти проклятые. Они многие, вопрошая одного, думали сбить Его в речах и привести в затруднение, как немогущего им отвечать: что было и вероятно. Ибо как может один вдруг отвечать многим на разные вопросы? То можно принимать и в таком значении:«уловить Его... из уст»и обличить. Ибо когда кого уловят в собственных его словах, то он, кажется, сам замыкает себе уста, то есть обличается своими устами и осуждается. Это значение видно и из последующего. Ибо сказано:«стараясь уловить что-нибудь из уст Его». Что немного прежде названо, то теперь заменяется словами –«уловить из уст Его».'
      cn: "「当祂说了」这话时，他们非但没有承认自己的无能，反而仿佛是为了驳斥祂的话，宣称自己正是比祂更智慧的，并开始堵住祂的口，也就是说，不停地问祂问题，使祂陷入困惑。因为通常来说，当许多人同时向一个人提问，并且提问的内容又各不相同时，言语上就会产生困窘。那时，这个人因为无法回答所有人，就给不理智的人提供了机会，让他们认为自己被击败了。这些被咒诅之人对基督也图谋了同样的恶事。他们许多人质问一个人，以为能在言辞上击败祂，使祂陷入困窘，如同祂无法回答他们一样：这似乎也是有可能的。因为一个人怎么能同时回答许多人的各种问题呢？\n\n    这也可以理解为具有另一层含义：「从祂口中」抓住祂并定祂的罪。因为当一个人被自己的话语所抓住时，他看起来就像是用自己的嘴堵住了自己，也就是说，他被自己的口所定罪和谴责。这个含义可以从下文中看出。因为经上说：「想要从祂口中抓住一些把柄」。这与稍早前所称的，现在被「从祂口中抓住」这些词语所取代。"
  - type: paragraph
    text:
      ru: Вопросы Ему предлагали то относительно Закона (Моисеева), чтобы обличить Его как богохульника, который хулит Моисея (ибо они подозревали Его в этом), то касательно кесаря, чтобы объявить Его возмутителем и домогающимся власти, и обо всем таком, что могли придумать души лукавые и исполненные всякой злобы.
      cn: 他们向祂提出的问题，或是关于（摩西）律法的，目的是要指控祂为亵渎者，亵渎摩西（因为他们怀疑祂有此意）；或是关于凯撒的，目的是要宣称祂是煽动者和谋求权力者；以及所有一切，那些邪恶的、充满各种恶意之魂所能想出的事情。
- type: heading1
  text:
    ru: Глава двенадцатая
    cn: 第十二章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 12:1. '
      cn: （路加福音 12:1）
    text:
      ru: Между тем, когда собрались тысячи народа, так что теснили друг друга,
      cn: 时数万民会集、致互相蹂践、彼先与其门徒言起曰、尔等为己谨防发利些乙之酵、即伪善也、
  - type: paragraph
    text:
      ru: 'Фарисеи пытались уловить Господа на слове, чтобы отклонить от Него народ, а сталось напротив. Народа сходилось ещё больше: собирались многие«тысячи», и каждый так стремился приблизиться к Нему, что«друг друга... теснили».Так истина сильна, а ложь везде бессильна!'
      cn: 法利赛人曾试图在言辞上抓住主（上帝的尊称），以便使民众远离他，但结果却恰恰相反。汇集的人民更多了：许多「数千」聚集在一起，每个人都如此渴望接近他，以至于他们「彼此……互相拥挤」。真相就是如此有力，而谎言在任何地方都软弱无力！
  - type: paragraph
    text:
      ru: 'Он начал говорить сперва ученикам Своим: берегитесь закваски фарисейской, которая есть лицемерие.'
      cn: 他便开始先对他的门徒说话：你们当谨防法利赛人之酵，即伪善也。
  - type: paragraph
    text:
      ru: Иисус, зная коварство фарисеев, видя, что они только представляются вопрошающими, а на деле подыскиваются под Ним, заговорил ученикам Своим о лицемерии фарисеев, без сомнения, для того, чтобы обличить их и обнаружить полные лицемерия сердца их. Господь называет лицемерие«закваской», потому что оно терпко, полно древней злобы, изменяет и растлевает собой образ мыслей тех людей, к коим оно приразится. Ибо ничто так не изменяет нравов, как лицемерие. Поэтому ученикам Христовым должно бегать лицемерия. Ибо Христос, будучи Истиной (Ин. 14, 6), очевидно противоположен лжи. А всякое лицемерие, иным представляясь на вид и иным будучи на деле, исполнено лжи.
      cn: 耶稣知道法利赛人的诡诈，看见他们不过是假装提问，而实际上却是在祂底下伺机图谋不轨，便对祂的门徒谈及法利赛人的伪善。毫无疑问，这是为了要斥责他们，并揭露他们那充满伪善的心。主称伪善为「酵」，因为它酸涩，充满了古老的邪恶，它会改变并败坏那些受其感染之人的思想方式。因为没有什么能比伪善更改变人的品行了。因此，基督的门徒应当逃避伪善。因为基督既是真理（伊鄂昂福音 14:6），祂显然与谎言是截然对立的。而一切伪善，表面上表现出一种样子，实际上却又是另一种样子，它是充满了谎言的。
  - type: paragraph
    initial:
      ru: 'Лк 12:2. '
      cn: （路加福音 12:2）
    text:
      ru: Нет ничего сокровенного, что не открылось бы, и тайного, чего не узнали бы.
      cn: 〇盖未有覆而不露者、隐而不知者、
  - type: paragraph
    initial:
      ru: 'Лк 12:3. '
      cn: （路加福音 12:3）
    text:
      ru: Посему, что́ вы сказали в темноте, то́ услышится во свете; и что́ говорили на ухо внутри дома, то́ будет провозглашено на кровлях.
      cn: 是以凡尔等言于暗中者、将声于光中、附耳于密室者、将宣于屋上、
  - type: paragraph
    text:
      ru: Хотя фарисеи, – говорит, – думают прикрыться лицемерием, подделывая себе благонравие, однако ж,«нет ничего сокровенного, чтобыне открылось. Ибо все и слова, и помышления на последнем суде представятся во всей наготе (1Кор. 4, 5). Да и в настоящей жизни обыкновенно обнаруживается много тайного. Поэтому,«что вы сказали в темноте»и«чтовыговорили... внутри дома»и тайно,«то будет провозглашено»во свете и с кровель.
      cn: 「虽然法利赛人，——他说道——，以为能用伪善遮盖自己，假装拥有美德，然而，『没有什么隐秘的事是不会被揭示的。』 因为所有的言语和思想都将在末日审判中，以全然赤裸的方式被呈现（哥林多前书 4:5）。在今世生活中，许多秘密通常也会被揭露。因此，『你们在黑暗中说的』以及『你们在屋内说的』和秘密说的，『都将被宣扬』于光明之中和屋顶之上。」
  - type: paragraph
    text:
      ru: 'По-видимому, Он говорит это ученикам, а между тем направляет против фарисеев, намекая на их ковы, и хотя говорит, по-видимому, ученикам, но фарисеям выражает как бы так: фарисеи! Что вы замышляли в темноте, в ваших темных сердцах, желая уловить Меня, то будет услышано и узнано во свете, ибо«Я свет"(Ин. 8, 12), и вы не можете укрыться от Меня, но во Мне – Свете – распознается все, что замышляет ваша темнота. И то, что вы порешили между собой на ухо, стало для Меня так известно, как бы провозглашаемо было с высоких кровель.'
      cn: 表面上看，祂是对门徒说的，但其实却是针对法利赛人，暗指他们的阴谋诡计。祂表面上是对门徒说话，但却像是对法利赛人表达了以下意思：法利赛人啊！你们在黑暗中，在你们阴暗的心中密谋着，企图诱捕我，这（一切）都将在光明中被听见和知晓，因为「我是世上的光」（伊鄂昂福音 8:12），你们无法向我隐藏，而是在我——这光——之中，你们黑暗所密谋的一切都将被辨识出来。并且，你们彼此附耳商议决定的事，对我而言，如同在高高的屋顶上被宣告出来一般清晰可知。
  - type: paragraph
    text:
      ru: А это можешь понимать и так, что свет есть Евангелие, а высокие кровли – высокие души апостолов. То, что фарисеи замышляли, впоследствии было провозглашено и слышимо во свете Евангелия, когда на высоких душах апостолов стоял великий Проповедник – Дух Святый.
      cn: 你也可以如此理解：光即是福音，而高高的屋顶，即是使徒们崇高的灵魂。法利赛人所密谋的，随后就在福音的光中被宣告并听闻，当时那伟大的宣讲者——圣灵——站立在使徒们崇高的灵魂之上。
  - type: paragraph
    text:
      ru: После того как Господь обличил лицемерие фарисеев, отвратил от него учеников Своих и между тем снова поразил фарисеев словами:«что́ вы сказали в темноте, то́ услышится во свете», теперь обращается к друзьям Своим с речью о более совершенном. Исторгнув уже терны, сеет доброе семя.
      cn: 在主斥责了法利赛人的虚伪，使祂的门徒远离它，同时又用「你们在暗中说了什么，那将在光中被听见」[路加福音 12:3]的话语再次打击了法利赛人之后，祂现在转向祂的朋友们，发表一篇关于更完美之事（更臻善境）的言论。在已拔除荆棘之后，祂播撒下良善的种子。
  - type: paragraph
    initial:
      ru: 'Лк 12:4. '
      cn: （路加福音 12:4）
    text:
      ru: 'Говорю же вам, друзьям Моим:'
      cn: 然我告尔等、我友、勿惧杀尔身后别无所能为者、
  - type: paragraph
    text:
      ru: То, что прежде говорилось, относилось не к ним, но к фарисеям. Итак, Я говорю вам, друзьям Моим. Ибо слово сие идет не ко всем, но к тем, которые всей душой возлюбили Его и могут сказать:«Кто отлучит нас от любви Божией?»(Рим. 8, 35). Таковым прилично это убеждение.
      cn: 在先前所说之事，所关涉的不是他们，而是法利赛人。因此，我告诉你们，我的朋友们。因为此话语并非对所有人都适用，而是对那些全心全意爱祂，且能说出：「谁能使我们与神的爱隔绝呢？」（罗马书 8:35）的人适用。这种劝信（或「这种说服」）对这些人而言是适切的。
  - type: paragraph
    text:
      ru: не бойтесь убивающих тело и потом не могущих ничего более сделать;
      cn: 不当惧怕那杀害身体，此后不能再作任何事的人；
  - type: paragraph
    initial:
      ru: 'Лк 12:5. '
      cn: （路加福音 12:5）
    text:
      ru: 'но скажу вам, кого бояться: бойтесь того, кто, по убиении, может ввергнуть в геенну: ей, говорю вам, того бойтесь.'
      cn: 我示尔等惧谁、惧有权者、乃杀后投于碣恩那地狱、诚哉、我告尔等、此当惧也、
  - type: paragraph
    text:
      ru: '«Не бойтесь, – говорит, –убивающих тело»и ничем более не могущих вредить. Ибо вред от тех, кои вредят телу, состоит не во многом. Тело потерпит свойственное ему и в том случае, если они не будут вредить. Но должно бояться того, кто наказывает не только тело, но и душу, существо бессмертное подвергает бесконечным мучениям, и притом в огне. Таким образом Христос обучает друзей Своих мужеству духовному, делает их свидетелями и отгоняет от них страх человеческий. Люди, – говорит, – простирают злобу свою только на тело тленное, и конец их козней против нас – смерть плотская. Но когда Бог казнит, тогда не останавливается на одной только плоти, но и самая душа несчастная подвергается мучениям. Примечай отсюда, что смерть приводит грешников к казни: они и здесь наказываются, будучи убиваемы, и там ввергаются в геенну.'
      cn: 「他说，『不要惧怕那杀身体的』，他们不能再加害于任何事物。因为那些加害于身体者所造成的损害并不多。即便他们不加害，身体也会承受其本性所固有的事物。但我们应当惧怕那不仅惩罚身体，而且也惩罚灵魂的，是将那不朽的存有置于无限的苦楚之中，并且是在火中。基督就这样教导祂的朋友们拥有属灵的勇气，使他们成为见证者，并驱散他们的人间惧怕。祂说，人，只会将他们的恶意伸展到这必朽的身体上，而他们针对我们的诡计的终点是肉身的死亡。但是当上帝刑罚时，祂不会仅仅止步于肉体，而是连最不幸的灵魂也要遭受苦楚。由此，请注意，死亡将罪人引向刑罚：他们既在此地被杀而受罚，又在那里被投入到格恩那地狱之中。」
  - type: paragraph
    text:
      ru: 'Разбирая это изречение, уразумеешь и нечто другое. Смотри, Господь не сказал: бойтесь того,«кто...по убиении»«ввергает» в геенну, но:«кто... может ввергнуть». Ибо умирающие грешники не непременно ввергаются в геенну, но во власти Божией состоит то, чтобы и прощать, например, ради тех приношений и подаяний, которые бывают по умершим и которые приносят немалую пользу даже тем, кои умирают в тяжких грехах. Итак, Бог не безусловно по убиении ввергает в геенну, но имеет власть ввергнуть. Будем же и мы непрестанно прилежать к милостыням и молитвам и умилостивлять ими Того, Кто имеет власть ввергнуть, но не пользуется этой властью непременно, а может и прощать.'
      cn: 在解读这句格言时，你还会领悟到别的事物。看哪，主没有说：你们当惧怕那「有权柄在杀了以后」「投入」革恩那地狱的，而是说：「有权柄在杀了以后，能投入」。因为那些死去的罪人并非必然被投入革恩那地狱，乃是在于上帝的权柄，祂可以赦免，例如，为了那些在他们死后献上的祭品和施予，这些对那些在重罪中死去的人也有不少益处。因此，上帝并非在杀了以后就无条件地投入革恩那地狱，而是有权柄投入。那么，我们也当恒切地致力于施舍和祈祷，并藉着它们来取悦那有权柄投入，却不必然使用此权柄，反而能赦免的那一位。
  - type: paragraph
    initial:
      ru: 'Лк 12:6. '
      cn: （路加福音 12:6）
    text:
      ru: Не пять ли малых птиц продаются за два ассария? и ни одна из них не забыта у Бога.
      cn: 五雀非二（阿萨利亚）可售乎、然在上帝前其中之一亦不忘也、
  - type: paragraph
    text:
      ru: Многие, – говорит, – думают, что умирающие за истину оставляются Богом; но вы не думайте так. Вы будете умирать не потому, будто бы Мной будете оставлены. Ибо если не забыт у Бога ни один из воробьев, которые продаются дешево, тем более не должна быть забыта ваша смерть, други Мои, как будто бы Я не пекусь о вас.
      cn: 「许多人，——祂说，——认为那些为真理而死的人被上帝离弃了；但你们不要这么想。你们将要死去，并非是因为你们被我离弃了。因为，既然在上帝那里，没有一只廉价出售的麻雀被遗忘，那么，我的朋友们，你们的死亡就更不应该被遗忘了，仿佛我并不关心你们一样。」
  - type: paragraph
    initial:
      ru: 'Лк 12:7. '
      cn: （路加福音 12:7）
    text:
      ru: 'А у вас и волосы на голове все сочтены. Итак, не бойтесь: вы дороже многих малых птиц.'
      cn: 尔首之发亦皆见数、故尔等勿惧、因较多雀尤贵耶、
  - type: paragraph
    text:
      ru: Напротив, Я имею такое попечение о вас, что до тонкости знаю все ваше; например, у Меня«сочтены... и волосы»ваши. Итак, если Я попущу вам впасть в искушение; то, без сомнения, дам и силу к перенесению (1Кор. 10, 13). А часто, когда увижу кого слабым, Я и не попущу ему впасть в искушение. Ибо, будучи попечителен и зная все, – и имея на счету самые мелочные вещи, Я устрою каждому приличное и полезное. Если наблюдаешь, то найдешь, что в Писании считается все мужское, достигшее в меру возраста и вообще достойное божественного счисления (Исх. 18, 21;Чис. 26, 62).
      cn: 反之，我对你们有如此的眷顾，甚至连你们的一切都细致入微地知晓；例如，你们的「头发……也被数算」在内。因此，如果我容许你们陷入试探，那么，毫无疑问，我也会赐下忍受的力量（哥林多前书 10:13）。而且，当我看到某人软弱时，我常常根本不容许他陷入试探。因为，我既是眷顾你们的，又知晓一切——甚至将最细微的事物都计入在内，我就会为每个人安排适当且有益之事。若你仔细观察，就会发现，在圣经中，所有已达到成年尺度的男性，以及通常配得上被神圣数算的人，都被数算在内（出埃及记 18:21，民数记 26:62）。
  - type: paragraph
    text:
      ru: Под «головою» должно разуметь христоугодную жизнь каждого из верующих, а под «волосами» ее частнейшие деяния, коими умерщвляется тело, кои у Бога исчисляются и принимаются в рассуждение. Ибо таковые ваши дела удостаиваются воззрения Божия. Под «пятью» воробьями некоторые разумеют пять чувств, которые, будучи искупаемы двумя ассариями, то есть ценой Ветхого и Нового Заветов, не забыты у Бога. Ибо кто свои чувства умеряет и подчиняет разуму, так что они бывают небесполезны для духовного питания, тот не забыт у Бога.
      cn: 在「头」之下，应当理解为每一位信靠之人那蒙基督喜悦的生活；而在「头发」之下，则应当理解为这生活的极细微的诸般行径，借此身体得以治死（被杀死），这些行径都在上帝那里被数算和纳入考量。因为，你们诸如此类的行事配得上帝的眷顾。对于「五只」麻雀，有些人理解为五种感官，这五种感官被两个阿萨里翁所赎买——也就是被旧约和新约的代价所赎买，在上帝那里未曾被遗忘。因为，那节制并使自己的感官顺服于理性之人，以致它们对属灵的滋养并非无益，这人就没有被上帝所遗忘。
  - type: paragraph
    initial:
      ru: 'Лк 12:8. '
      cn: （路加福音 12:8）
    text:
      ru: 'Сказываю же вам: всякого, кто исповедает Меня пред человеками, и Сын Человеческий исповедает пред Ангелами Божиими;'
      cn: 〇我告尔等、凡承认我于人前、人子亦承认彼在上帝之众天神面前、
  - type: paragraph
    initial:
      ru: 'Лк 12:9. '
      cn: （路加福音 12:9）
    text:
      ru: а кто отвергается Меня пред человеками, тот отвержен будет пред Ангелами Божиими.
      cn: 避讳我于人前者、彼亦将被避讳于上帝之众天神面前、
  - type: paragraph
    text:
      ru: 'Теперь предлагает награду за исповедание веры. Так как Он сказал:«не бойтесь убивающих тело»и прибавил, что и«волосывашисочтены», то чтобы кто-нибудь не сказал: дай же мне и награду какую-нибудь, ибо что мне будет из того, что Ты счел мои волосы.'
      cn: 现在，他提供（为）信仰告白而设的奖赏。既然他说了：「不要惧怕那杀害身体的」（此处引用格式为 C1），并补充说，连「你们的头发也被数算了」（此处引用格式为 C1），那么，为了不让任何人说：请也给我一些奖赏吧，因为你数算我的头发，对我又有什么益处呢？
  - type: paragraph
    text:
      ru: 'Он говорит (таковому): ты желаешь и награды? Слушай. Кто исповедает (веру) во Мне, тот Мной будет признан пред Богом. Сказал: исповедает «во Мне», то есть при Моем содействии и Моей силой, и Я исповедую его «в нем», то есть при его содействии. Ибо как мы предварительно нуждаемся в Боге, так как без Него не можем ничего сделать (Ин. 15,5), так и Бог нуждается в нас. Ибо если Он не найдет в нас дел достойных, Он и не принимает нас; а иначе Он был бы лицеприятен. Итак, мы исповедуем в «Нем», то есть при Его содействии, а Он «в нас», то есть при нашем содействии. Ибо если мы не дадим Ему повода, Он и не будет свидетельствовать за нас. А отвергающийся отвергается не силой Божией, почему Он и не присовокупил: «Мною», но сказал: кто отвергается«Меня».'
      cn: 他（向那样的人）说：你渴望报赏吗？请听。凡在我的里面承认（信仰）者，他将被我认于上帝面前。他说：在「我的里面」承认，即是在我的协助和我的力量之下，而我将在「他的里面」承认他，即是在他的协助之下。因为正如我们预先需要上帝，因为没有他我们什么也做不了（伊鄂昂福音 15:5），同样，上帝也需要我们。因为如果他没有在我们里面发现配得上的作为，他也不会接纳我们；否则他就是看人情面了。因此，我们是在「他」的里面承认，即是在他的协助之下，而他是在「我们」的里面承认，即是在我们的协助之下。因为如果我们不给他机会，他也不会为我们作见证。而那否认者，并非借由上帝的力量否认，所以他没有加上：「借由我」，但他说了：凡否认「我」者。
  - type: paragraph
    text:
      ru: 'Так как всякий святой пребывает во Христе, а Христос в нем (Ин. 15,5), то, может быть, и не поэтому ли сказал так: кто (Меня) исповедует «во Мне», то есть пребывая, того исповедую и Я, в нем пребывая.'
      cn: 既然每一位圣徒都常存（或「常在」）于基督里，而基督也常存于他里面（约翰福音 15:5），或许祂说这话，岂不正是因此吗：谁在「我里面」（「我里面」的意思是：常存于此）承认我，那么我也承认他，因我常存于他里面。
  - type: paragraph
    initial:
      ru: 'Лк 12:10. '
      cn: （路加福音 12:10）
    text:
      ru: И всякому, кто скажет слово на Сына Человеческого, прощено будет;
      cn: 凡发言攻人子者可赦、惟毁谤攻圣神者不可赦、
  - type: paragraph
    text:
      ru: 'Это значит: кто скажет хулу на Меня, по виду своему простого сына человеческого, едящего, пьющего, обращающегося с мытарями и блудницами, тот, покается ли, или не покается в своей хуле, прощен будет. Ибо таковому человеку неверие его в грех не вменяется. Ибо что он видел располагающего к вере? Напротив, чего он не видел достойного хулы? Он видел человека, обращающегося с блудницами, и говорит хулу на него, а поэтому грех не вменяется ему. Ибо естественно он мог подумать, что же за Сын Божий тот, кто обращается с блудницами? Поэтому того, кто так поступает, а между тем выдает себя за Сына Божия, он может поносить и назвать обманщиком.'
      cn: 这意思是：那人子，就外表而言，只是一个吃喝、与税吏和娼妓来往的普通人子，若有人出言亵渎我（指他），他不论是否悔改自己的亵渎，都将蒙受赦免。因为那样的不信，对那人来说，不被算为罪。因为他看到了什么足以引人归信的事呢？相反地，他又看到了什么不足以招致亵渎的事呢？他看见一个人与娼妓来往，便出言亵渎他（这个人），因此罪不被算在他身上。因为他很自然地会想：那与娼妓来往的人，又怎会是上帝的儿子呢？所以，对于这样行事、却又自称是上帝儿子的人，他可以去辱骂，并称其为骗子。
  - type: paragraph
    text:
      ru: а кто скажет хулу на Святаго Духа, тому не простится.
      cn: 「但凡是说话亵渎圣灵者，其罪将不可得赦。」
  - type: paragraph
    text:
      ru: Слова эти имеют такое значение. Кто, видя Божественные знамения и великие и необычайные дела, не верует и поносит действия Святого Духа, приписывая веельзевулу, тот, изрыгая«хулу на Святого Духа»и говоря, что знамения сии совершаются духом лукавым, а не Божиим, если не раскается, не будет извинен и прощен. Говорящему хулу на Сына Человеческого не вменяется грех, а поэтому он прощается и без покаяния, а видящему дела Духа Божия и хулящему без покаяния не будет прощено, но вменится в величайший грех.
      cn: '这些话语有如下的意义：


        那人，若看见了神圣的记号以及伟大而超常的作为，却不信，并诽谤圣灵的作为，将其归于别西卜，他便是出言「亵渎圣灵」，声称这些记号是由邪恶的灵而非上帝的灵所完成的。若他不悔改，他将不被开脱，不被赦免。


        那对人子说出亵渎之言的人，其罪不被计入，故而他甚至可以不经悔改而得赦免。但那看见上帝之灵的作为而行亵渎之人，若不悔改，则不被赦免，反而被计入极大的罪孽。'
  - type: paragraph
    initial:
      ru: 'Лк 12:11. '
      cn: （路加福音 12:11）
    text:
      ru: Когда же приведут вас в синагоги, к начальствам и властям, не заботьтесь, ка́к или что́ отвечать, или что́ говорить,
      cn: 人扭拽尔等至会堂、及至执政秉权者前、勿虑或何以申诉、或何以言、
  - type: paragraph
    text:
      ru: 'Слабость наша двоякого рода: мы убегаем от исповедания веры или по страху наказаний, или по простоте и неспособности дать ответ в нашей вере. Страх наказаний Господь уврачевал словами:«не бойтесь убивающих тело». Теперь Он врачует страх, происходящий от простоты. Поскольку немного«мудрых по плоти»(1Кор. 1, 26) уверовало, а большая часть простых, то Он говорит: не бойся, необразованный и простец, и не заботься, как или что отвечать при допросе от властителя или что говорить при другом случае, – у тебя будет иной образ речи.'
      cn: '我们的软弱有双重类型（*dvoyakogo roda*）：我们要么因畏惧惩罚，要么因单纯及不擅为我们的信仰给出答复，而逃避信仰的表白（*ispovedaniya very*）。


        主借由「不要惧怕那些杀害身体的」（马太福音 10:28）这些话，治愈了对惩罚的畏惧。现在，祂正在医治源于单纯的畏惧。鉴于只有少数「按着肉体有智慧的」（哥林多前书 1:26）人信了，而大部分是单纯的人，所以祂说：你，未受教育者（*neobrazovannyy*）和平信徒（*prostets*），不要惧怕，也不要担忧在被当权者审问时如何或回答什么，或在其他场合说什么——你将会有另一种说话的方式。'
  - type: paragraph
    initial:
      ru: 'Лк 12:12. '
      cn: （路加福音 12:12）
    text:
      ru: ибо Святый Дух научит вас в тот час, что́ должно говорить.
      cn: 盖其时圣神教尔等以所当言、
  - type: paragraph
    text:
      ru: Поэтому какая нужда заботиться, если ты в тот час научен будешь Духом Святым? Итак, с той и другой стороны укрепляет нас на подвиг исповедания, врачуя страх как телесной немощи, так и страх простоты и неведения.
      cn: 因此，有什么需要去担忧的呢，如果你会在那一刻被圣神教导？所以，祂从两个方面加强我们去进行信仰告白的苦修，同时医治了对身体软弱的恐惧，以及对朴实和无知的恐惧。
  - type: paragraph
    initial:
      ru: 'Лк 12:13. '
      cn: （路加福音 12:13）
    text:
      ru: 'Некто из народа сказал Ему: Учитель! скажи брату моему, чтобы он разделил со мною наследство.'
      cn: 〇民中一人谓之曰、师欤、示我兄与我分产业、
  - type: paragraph
    initial:
      ru: 'Лк 12:14. '
      cn: （路加福音 12:14）
    text:
      ru: 'Он же сказал человеку тому: кто поставил Меня судить или делить вас?'
      cn: 彼语之曰、人乎、谁立我于尔曹中为判官或分析者、
  - type: paragraph
    text:
      ru: Чтобы научить нас, как мало должно радеть о житейском и заниматься земным, Господь отсылает от Себя того, кто просил Его распоряжения о разделе отцовского наследства, и потому говорит:«кто поставил Меня судить или делить вас?». Поскольку человек этот не стал просить того, что полезно и нужно для спасения, а просил Его быть делителем земного и временного имения, то Господь отсылает его как беспокойного и нежелающего научиться ничему нужному; впрочем, делает это кротко, а не грозно. Но поступком этим, без сомнения, всех, как тогдашних, так и нынешних, слушателей Своих Он научает не заботиться ни о чем земном и временном, не спорить из-за него с братьями, и даже уступать им, если они желают быть и любостяжательными (ибо говорит:«от взявшего твое не требуй назад»(Лк. 6, 30) ), и искать того, что полезно и необходимо для спасения души.
      cn: '为教导我们应当多么少地挂念世俗之事并从事于属地之事，主打发走那个请求祂处理分割父亲遗产的人，并因此说：「谁立我于尔曹中为判官或分析者？」（路加福音 12:14）。


        因为这个人没有请求那些对救赎有益且必需的事物，而是请求祂作属地且暂时的财产的分割者，所以主将他打发走，视他为一个不安分且不愿学习任何必需之物的人；然而，祂是温和地而非威严地这样做的。


        但是，毫无疑问，借着这一举动，祂教导了祂所有的听者——无论是当时的还是现今的——不要为任何属地和暂时的事物担忧，不要为此与兄弟争辩，甚至如果他们渴望变得贪婪（因为祂说：「有人夺去你的，不必向他索回」（路加福音 6:30）），也要让步给他们，并寻求那些对灵魂的救赎有益且必需的事物。'
  - type: paragraph
    initial:
      ru: 'Лк 12:15. '
      cn: （路加福音 12:15）
    text:
      ru: 'При этом сказал им: смотрите, берегитесь любостяжания,'
      cn: 且向彼等曰、慎哉、尔等慎贪婪、因在丰裕者、人之生命不在其产业也、
  - type: paragraph
    text:
      ru: Поэтому и присовокупил сии слова:«смотрите, берегитесь любостяжания», убеждал нас избегать любостяжания как бы какой-нибудь диавольской ямы. Кому же сказал Он это:«смотрите, берегитесь любостяжания»? Этим двум братьям. Так как у них был спор о наследстве и, вероятно, из них двоих один другого обидел, то Он и обращает к ним речь о любостяжании. Ибо оно – великое зло. Поэтому апостол Павел называет его«идолослужением»(Кол. 3, 5), быть может потому, что оно прилично одним тем, кои не знают Бога, или, что и справедливее, потому, что идолы язычников –«серебро и золото»(Пс. 113, 12). Почитающий серебро и золото подобен идолопоклонникам, потому что тот и другие поклоняются и воздают почитание одному веществу.
      cn: '因此，祂也加上了这些话：「看哪，你们要当心，提防贪婪（любостяжания）」，祂劝勉我们要避开贪婪，如同避开某种魔鬼的陷阱。


        祂对谁说了这句话：「看哪，你们要当心，提防贪婪」？对着那两个弟兄。因为他们正在为继承权争执，而且很可能他们俩中有一个人得罪了另一个人，因此祂便把关于贪婪的话转向他们。


        因为贪婪是巨大的邪恶。因此使徒保罗称它为「拜偶像」（歌罗西书 3:5），或许是因为它只适合那些不认识神的人，或者，更确切地说，是因为异教徒的偶像就是「金银」（诗篇 113:12）。敬重金银的人就如同拜偶像的人，因为无论是敬重者还是拜偶像者，都向同一种物质顶礼膜拜，并致以敬意。'
  - type: paragraph
    text:
      ru: ибо жизнь человека не зависит от изобилия его имения.
      cn: 「因在丰裕者、人之生命不在其产业也。」
  - type: paragraph
    text:
      ru: 'Итак, избытка должно бегать. Почему? Потому что«жизнь человека не зависит от изобилия его имения», то есть мера сей жизни не соразмеряется с изобилием имения. Ибо если кто имеет многое, то не значит еще, что он уже и проживет долго. Долголетие не зависит от множества богатства. Господь говорит это в опровержение мыслей любителей богатства. Любители богатства, по-видимому, заботятся о богатстве потому, что желают жить, и собирают отовсюду потому, что намереваются долго жить. Поэтому Господь говорит: несчастный и бедный! неужели от многого имения прибавится тебе и долголетие?'
      cn: 因此，应当避开盈余（或：过剩/多余之物）。为何如此？因为「人之生命不在其产业之丰裕」，也就是说，生命的尺度（或：衡量）并非与财产的丰裕相称量。因为如果一个人拥有许多，并不意味着他就一定会长寿。长寿并不取决于财富的众多。主说此话，是为了驳斥那些爱财者的思想。爱财者表面上关注财富，是因为他们渴望活下去；他们从各处搜集财产，是因为他们企图活得长久。因此，主说：不幸而贫乏的人啊！难道由于你拥有许多财产，你的寿命就会因此增加吗？
  - type: paragraph
    text:
      ru: Зачем же ты ясно страдаешь из-за неизвестного успокоения? Ибо не известно еще, достигнешь ли ты старости, для которой собираешь; а то очевидно, что ныне ты тратишь (свою жизнь) на приобретение имения.
      cn: 你为何要因着一份未知的平静而遭受明显的痛苦呢？因为你所积攒的这些产业，你是否能活到为它们所预备的年老之时，尚且未知；而你如今正将（你的生命）耗费在获取这份财产上，这一点却是显而易见的。
  - type: paragraph
    initial:
      ru: 'Лк 12:16. '
      cn: （路加福音 12:16）
    text:
      ru: 'И сказал им притчу: у одного богатого человека был хороший урожай в поле;'
      cn: 〇彼向伊等以譬喻曰、有一富人其田亩丰善、
  - type: paragraph
    text:
      ru: Сказав, что жизнь человека не становится продолжительнее от изобилия имения, (Господь) приводит и притчу в подтверждение Своих слов. И смотри, как Он изображает нам ненасытимые помыслы безумного богача. Бог творил Свое намерение и явил особенное благоутробие. Ибо не в одном местечке, но во всем«полебогачабыл хороший урожай»; а он был так бесплоден в милосердии, что, прежде чем получил, удерживал уже за собой.
      cn: 说了人的生命不会因财产的丰裕而更长久，（主）也引述了一个比喻来证实祂的话语。你看，祂是如何为我们描绘那愚妄富人永不满足的思虑的。上帝实现了祂的意图，并彰显了特别的仁慈。因为这不仅是在一个地方，而是在「富人的田亩」全部「有好的收成」；而他在怜悯上却是如此地毫无益处，以至于他甚至在尚未获得之前，就已经为自己据为己有。
  - type: paragraph
    initial:
      ru: 'Лк 12:17. '
      cn: （路加福音 12:17）
    text:
      ru: 'и он рассуждал сам с собою: что мне делать? некуда мне собрать плодов моих'
      cn: 于己计议曰、我何为、致我无处収藏我物实、
  - type: paragraph
    text:
      ru: 'Посмотри и на удовольствия богача.«Что мне делать?»Не эти ли самые слова произносит и бедняк? Что мне делать? мне нечего есть, нечем одеться. Вникни, пожалуй, и в слова богача:«что мне делать? мне... некуда... собрать плодов»многих. Хорошо же спокойствие! И бедняк говорит: что мне делать? я не имею... И богач говорит: что мне делать? я не имею... Что же мы получаем от того, что очень много собираем? Спокойствием мы не пользуемся, и очевидно, от забот; разве только собираем себе множество грехов.'
      cn: '也要看一看那富人所拥有的欢愉。「我该做什么？」

        难道贫穷人不是也说出完全相同的话语吗？我该做什么？我没有什么可吃的，没有什么可穿的。

        请深入理解一下那富人的话语：「我该做什么？我……没有地方……来收存我许多的果实。」

        这种宁静真是美好啊！贫穷人说：我该做什么？我没有……富人也说：我该做什么？我没有……

        那么，我们从大量积聚中得到了什么呢？我们没有享受到宁静，很明显，我们得到的是忧虑；难道我们不是仅仅给自己积攒了大量的罪过吗？'
  - type: paragraph
    initial:
      ru: 'Лк 12:18. '
      cn: （路加福音 12:18）
    text:
      ru: 'И сказал: вот что сделаю: сломаю житницы мои и построю бо́льшие,'
      cn: 又曰、我将如此、毁我仓而别建更大者、即将我之生产及我之美善、悉収藏于彼、
  - type: paragraph
    text:
      ru: А если на будущее лето урожай в поле будет еще более, ты опять сломаешь и опять построишь? И какая нужда ломать и строить? Утробы нищих – вот тебе житницы. Они могут и вместить многое, они и неразрушимы и нетленны, ибо небесны и божественны, так как питающий бедного – питает Бога.
      cn: 若将来年之夏，田地所产更多，你岂将再次拆毁并再次建造？拆毁与建造，又有何必要？贫者之腹，乃汝之粮仓。彼等既能容纳诸多，亦不可摧毁、不可朽坏，因其属天且神圣，盖因供养贫者即是供养上帝。
  - type: paragraph
    text:
      ru: и соберу туда весь хлеб мой и всё добро мое,
      cn: 并将我所有的出产和一切美善都收藏在那里，
  - type: paragraph
    text:
      ru: Вот и еще безумие богача.«Хлеб мой и всё добро мое». Он не считает их даром от Бога, ибо, в противном случае, располагался бы относительно их как приставник Божий, а считает их плодом собственных трудов. Поэтому, присвояя их себе, и говорит:«хлеб мой и... добро мое». Я, – говорит, – не имею никакого сообщника, не буду ни с кем делиться. Все это добро – не Божие, а мое, поэтому я один буду и наслаждаться им, а Бога не приму участником в наслаждении им. Это явно безумно. Посмотрим еще далее.
      cn: 这又是富翁的另一番痴狂。「我的粮食和我的全部财物。」他不认为这些是来自上帝的恩赐，因为，若是如此，他就会将它们视作上帝的管家（*pristavnik*）所托管之物来处置；相反，他认为它们是自身劳动的果实。因此，在将这些财物据为己有时，他说道：「我的粮食和……我的财物。」 他说，我没有任何同伙（*soobshchnik*），我也不会与任何人分享。所有这些财物都不是上帝的，而是我的，因此，我将独自享用它们，而不会让上帝参与到这份享乐之中。这显然是疯狂的。让我们再往下看。
  - type: paragraph
    initial:
      ru: 'Лк 12:19. '
      cn: （路加福音 12:19）
    text:
      ru: 'и скажу душе моей: душа! много добра лежит у тебя на многие годы:'
      cn: 将向我灵曰、灵欤、尔有多美善、为多年所置备者、安息、食饮、欢乐哉、
  - type: paragraph
    text:
      ru: Сам назначает себе долголетнюю жизнь, как будто и долголетие он получил от возделываемой им земли. Неужели и это – произведение твое? Неужели и это – добро твое?
      cn: 他自己给自己指定了长久年日，仿佛这长寿也是他从自己耕种的土地中得来的。难道这（长寿）也是你的出产吗？难道这也是你的良善吗？
  - type: paragraph
    text:
      ru: покойся, ешь, пей, веселись.
      cn: 安息、食、饮、欢乐。
  - type: paragraph
    text:
      ru: Прекрасные же блага души! Есть и пить есть благо души неразумной. Впрочем, поскольку ты и сам имеешь такую душу, то справедливо предлагаешь ей такие блага. Но благо души разумной состоит в том, чтобы уразумевать, рассуждать, увеселяться Законом Божиим и благими размышлениями. Для тебя недостает, безумный, есть и пить, ты предлагаешь душе своей и следующее затем постыдное и скаредное удовольствие? Ибо очевидно, что Господь словом«веселись»обозначил страсть распутства, которая обыкновенно следует за пресыщением яствами и питиями (Флп. 3, 19;Еф. 5, 18).
      cn: 灵魂的「美善」啊！吃喝乃是不具理性的灵魂的益处。然而，既然你自身也拥有这样的灵魂，那么你向她提供这样的益处，便是合乎情理的。但是，具理性的灵魂的益处在于领悟、辨析、以上帝的律法和良善的思虑为乐。你这愚妄人，吃喝对你而言还不足够吗？你还要向你的灵魂提供随之而来的可耻且卑劣的享乐吗？因为显然，主用「欢乐哉」（或「享乐」一词）所指的是淫荡的激情，这激情通常伴随着饮食的过饱而来（腓立比书 3:19，以弗所书 5:18）。
  - type: paragraph
    initial:
      ru: 'Лк 12:20. '
      cn: （路加福音 12:20）
    text:
      ru: 'Но Бог сказал ему: безумный! в сию ночь душу твою возьмут у тебя; кому же достанется то, что ты заготовил?'
      cn: 然上帝向之曰、愚者乎、斯夜将索尔灵、而所备者、将归谁耶、
  - type: paragraph
    text:
      ru: Сказано так:«Но Бог сказал ему»не потому, будто бы Бог беседовал с богачом, а слова эти имеют такой смысл, что когда богач так гордо помышлял в себе, тогда«Бог сказал ему»(ибо это подразумевает притча). Бог называет богача безумным, потому что он в душе своей полагал советы самые безумные, как мы показали. Ибо всякий человек безумен и суетен, как и Давид говорит:«суетится»человек, и причина этому та, что«собирает и не знает, кому достанется то»(Пс. 38, 7). Ибо как не безумен тот, кто не знает, что мера жизни в руках одного Бога и что никто сам себе не может определить жизни?
      cn: '（来自圣奥赫里德的狄奥菲拉克）


        经文如此说道：「然上帝向之曰，」这并不是说上帝真的与那财主交谈了，而是这些话语具有这样的意义：当那财主如此傲慢地心中思量时，「上帝向之曰」（因为这正是这比喻所蕴含的）。上帝称这财主为愚昧之人，因为他在自己心中所设定的建议乃是最愚昧的，正如我们所表明的。因为所有的人都是愚昧而虚妄的，正如大卫所说：人「徒然奔波」，而其原因在于他「积蓄财宝，却不知将来谁要收取」（诗篇 38:7）。那人既不知生命的尺度单单掌握在上帝手中，且无人能为自己限定生命，他怎能不算愚昧呢？'
  - type: paragraph
    text:
      ru: 'Обрати внимание и на слово:«возьмут». Страшные Ангелы, как бы жестокие сборщики податей,«возьмут у тебя... душу твою»против воли твоей, поскольку ты из любви пожить присваивал себе здешние блага. У праведника не отнимают душу, но он предает ее Богу и Отцу духов с радостью и весельем и не чувствует неприятности при отложении тела, ибо он тело имеет как бы легкую тяжесть. Но грешник, оплотянив душу, сделав ее телом и землей, чрезвычайно затрудняет отделение оной. Поэтому и говорится, что душу«возьмут»у него, как бы у какого упорного должника, преданного в руки жестоких сборщиков. Приметь и сие. Не сказал Господь: Я возьму душу у тебя, но«возьмут». Ибо«души праведных в руке Божией»(Прем. 3, 1). И поистине от такового«ночью»возьмут душу, ибо он не имеет озаряющего света богопознания, но находится в ночи богатстволюбия и омраченный ей захватывается смертью.'
      cn: '请注意「将索尔」这个词。可怖的天使，如同残酷的税吏一般，「将索尔……你的灵」，是违背你意愿的，因为你出于对生活的爱而将此处的财富据为己有。


        正直之人的灵不会被夺去，而是他怀着喜乐和欢欣将其交付给上帝和诸灵之父，并且他在身体被搁置时不会感到不适，因为他将身体视为一种轻微的重负。但罪人，使灵肉质化、使其成为身体和泥土，极大地阻碍了灵的分离。因此才说，灵「将索尔」他，如同从某个执拗的债务人手中，被交付给了残酷的税吏之手。


        也要注意到这一点。主并未说：我将索尔你的灵，而是「将索尔」。因为「义人的灵魂在上帝手中」（智慧篇 3:1）。而这样的人的灵确实是在「夜间」被索取的，因为他不具备启迪人的、对上帝的认知之光，而是处于贪恋财富的黑夜之中，被这黑夜所蒙蔽，被死亡所掳获。'
  - type: paragraph
    initial:
      ru: 'Лк 12:21. '
      cn: （路加福音 12:21）
    text:
      ru: Такбывает с тем,кто собирает сокровища для себя, а не в Бога богатеет.
      cn: 如是凡积财于己者、而不富于上帝也、
  - type: paragraph
    text:
      ru: 'Так,«кто собирает сокровища для себя», тот по справедливости называется безумным и не успевает привести в исполнение свои намерения, но в самое время составления планов решительно исторгается из среды живых. Но если бы он собирал для бедных и для Бога, с ним не было бы так поступлено. Поэтому будем стараться«богатеть в Бога», то есть на Него уповать, Его считать нашим богатством и хранилищем богатства. Не будем говорить: блага «мои», но блага Божии. Если же блага Божии, то не будем отчуждать Бога от Его благ. Богатеть в Бога – значит веровать, что если я и все (свое) отдам и истощу, то и тогда ни в чем необходимом у меня не будет недостатка. Ибо сокровищница моих благ есть Бог: я отворяю и беру, что нужно.'
      cn: 「积攒财宝归于自己」的人，理所当然地被称为愚妄，并且未能及时实现他的意图，而是在制定计划的同一时刻，就决然地从活人之中被连根拔除。但如果他是为穷人和为上帝积攒，他就不会遭遇如此对待。因此，我们要努力「在上帝里富足」，也就是要信靠他，视他为我们的财富和财富的库藏。我们不要说：「我的」财物，而要说上帝的财物。既然是上帝的财物，我们就不要让上帝与他的财物相隔绝。在上帝里富足——意味着相信即使我将所有（自己的）都施舍并耗尽，我在任何必需品上也不会有所匮乏。因为我财物的宝库就是上帝：我一打开，就可以取走所需之物。
  - type: paragraph
    initial:
      ru: 'Лк 12:22. '
      cn: （路加福音 12:22）
    text:
      ru: 'И сказал ученикам Своим: посему говорю вам,'
      cn: 彼向其门徒曰、缘此我告尔等、勿为尔生命思虑何以食、勿再为尔身体何以衣、
  - type: paragraph
    text:
      ru: Мало-помалу Господь восходит к учению о высшем совершенстве. Заметь же порядок. Он научил беречься любостяжания и присовокупил притчу о богатом в доказательство того, что желающий очень многого – безумен. Простирая учение далее, Он не позволяет нам заботиться и о необходимом. Как диавол, начиная с малых грехов, ввергает нас и в большие, почему и назван он у Иова (Иов. 4, 11)«могучий лев», так, напротив, Господь, разрушая дела его, научает прежде бегать великих грехов, а потом указывает и начала их. Заповедав нам беречься любостяжания, доходит и до корня его, то есть заботы, чтобы и корень пресечь, и говорит:«посему говорю вам».
      cn: 主循序渐进地提升至论述更高之圆满的教义。请注意其间的次第。祂教导我们要提防贪婪（любостяжания），并附带了一个关于富人的比喻，用以证明那极度渴求过多之物的人是愚昧的。祂将教义推展得更深，甚至不容许我们为必需之物操心。正如魔鬼从微小的罪开始，将我们推入更大的罪中，因此在约伯记中（约伯记 4:11）它被称为「壮狮」；反之，主则在破坏魔鬼作为时，先教导我们避开大罪，然后再指出大罪的起源。在吩咐我们提防贪婪之后，祂进而触及其根源，即忧虑（заботы），为要将此根源也一并截断，于是说：「因此我告尔等」。
  - type: paragraph
    text:
      ru: '– не заботьтесь для души вашей, что вам есть, ни для тела, во что одеться:'
      cn: 「——不要为你们的生命忧虑吃什么，也不要为你们的身体忧虑穿什么：」
  - type: paragraph
    text:
      ru: 'Поскольку, – говорит, – безумен тот, кто назначает сам себе продолжительную жизнь и, обольщаясь этим, желает большего, каков был помянутый богач, потому Я вам говорю:«не заботьтесь для души вашей, что вам есть». Сказал так не потому, будто бы разумная душа ест, но потому, что душа, по-видимому, удерживается в связи с телом только под тем условием, если мы употребляем пищу. И иначе: тело, будучи и мертво, одевается, но уже не питается. Поскольку же питаться свойственно телу одушевленному, то справедливо употребление пищи Он отнес к душе. Или: не называется ли душой питательная сила? Итак, питательной частью неразумной души не заботьтесь, что вам есть, ни телом, во что одеться. За сим представляет основание.'
      cn: 「既然，」祂说，「那自己预定长久寿命，并因此受骗而渴求更多的人（正如先前所提的那个财主）是愚昧的，所以我对你们说：『勿为尔生命思虑何以食』。」祂这样说，并非是认为理性的灵魂会进食，而是因为灵魂，从表面上看，只有在我们摄入食物的条件下，才被维系在与身体的联结之中。或者换个角度：身体，即使是死的，也能被穿上衣物，但已不再被滋养。既然滋养是属于有灵魂的身体的特质，那么祂将食物的摄入归于灵魂是公允的。或者：滋养的能力难道不被称为灵魂（psyche）吗？因此，不要为非理性灵魂中那司管滋养的部分思虑何以食，也不要为身体思虑何以衣。紧接着，祂提出了依据。
  - type: paragraph
    initial:
      ru: 'Лк 12:23. '
      cn: （路加福音 12:23）
    text:
      ru: душа больше пищи, и тело – одежды.
      cn: 生命大于食物、身体与衣亦然、
  - type: paragraph
    text:
      ru: Тот, Кто дал большее, именно душу, не даст ли и пищу? Тот, Кто дал тело, не даст ли и одежду? Потом доказывает примером воронов.
      cn: 既然祂赐予了更大的，即灵魂，难道祂不会也赐予食物吗？既然祂赐予了身体，难道祂不会也赐予衣裳吗？接着，祂用乌鸦的例子来论证。
  - type: paragraph
    initial:
      ru: 'Лк 12:24. '
      cn: （路加福音 12:24）
    text:
      ru: 'Посмотрите на воронов: они не сеют, не жнут; нет у них ни хранилищ, ни житниц, и Бог питает их; сколько же вы лучше птиц?'
      cn: 试思乌鸦不稼、不穑、无库、无仓、而上帝养之、尔等较禽鸟贵几何乎、
  - type: paragraph
    text:
      ru: 'На птиц указывает для того, чтобы более усовестить нас. Мог бы Он привести в пример святых пророков, как-то: Илию и Моисея, но для большего посрамления указывает на птиц. Потом представляет еще и другое основание.'
      cn: 祂指出禽鸟，是为了能更有效地使我们感到羞愧（*усовестить*）。祂本可以引述圣先知们，例如伊利亚和莫伊塞，作为榜样，但为了更大的羞辱（*посрамления*），祂指出禽鸟。随后祂又提出了另一个依据。
  - type: paragraph
    initial:
      ru: 'Лк 12:25. '
      cn: （路加福音 12:25）
    text:
      ru: Да и кто из вас, заботясь, может прибавить себе роста хотя на один локоть?
      cn: 尔等中孰能以思虑延长身一肘耶、
  - type: paragraph
    initial:
      ru: 'Лк 12:26. '
      cn: （路加福音 12:26）
    text:
      ru: Итак, если и малейшего сделать не можете, что́ заботитесь о прочем?
      cn: 至微者、尔等尚不能、何虑为余者乎、
  - type: paragraph
    text:
      ru: Скажи, пожалуй, какая тебе прибыль от забот? Прибавляешь ли ты своему росту хотя малейшую часть? Нет, напротив, ты даже истощаешь свое тело, ибо забота сушит. Если же и малейшего не можешь прибавить, что заботишься о прочем? Очевидно, что как росту Бог придает, так и прочее подаст.
      cn: 请告诉我，你的忧虑给你带来了什么益处？你是否能给你的身量增加哪怕是最小的部分？不，恰恰相反，你甚至损耗你的身体，因为忧虑使人枯槁。既然你连最小的都不能增加，你又何必为其余的忧虑呢？显而易见，正如上帝给身量有所增添，祂也会赐予其余的一切。
  - type: paragraph
    initial:
      ru: 'Лк 12:27. '
      cn: （路加福音 12:27）
    text:
      ru: 'Посмотрите на лилии, как они растут: не трудятся, не прядут; но говорю вам, что и Соломон во всей славе своей не одевался так, как всякая из них.'
      cn: 试观百合花如何而长、不劳不纺、然我告尔等、莎罗孟于其极荣华时、其服式不及此之一、
  - type: paragraph
    initial:
      ru: 'Лк 12:28. '
      cn: （路加福音 12:28）
    text:
      ru: Если же траву на поле, которая сегодня есть, а завтра будет брошена в печь, Бог так одевает, то кольми паче вас, маловеры!
      cn: 夫田间之草、今日乃尚存、明日投炉、上帝衣被之如此、何况尔等小信者乎、
  - type: paragraph
    text:
      ru: И пример лилий Господь выставил для большего нашего вразумления. Ибо если Бог лилии одевает так, что слава Соломонова не могла никогда сравниться ни с одной из них, и притом тогда, как для лилий красота не необходима, не тем ли более Он оденет нас – честнейшее Свое создание, когда притом для тела нашего одеяние необходимо?
      cn: 主举出百合花的例子，是为了让我们得到更大的明智训诲。因为如果上帝装扮百合花的方式，连所罗门的荣华都无法与其中任何一朵相比，况且百合花的美丽对它们而言并非必需；那么，祂岂不是更会为我们——祂最尊贵的受造物——穿上衣裳吗？况且对于我们的身体而言，衣裳是必需的。
  - type: paragraph
    text:
      ru: 'Что же, – скажут, – повелеваешь нам не возделывать земли? Я не сказал: не возделывайте землю, но не заботьтесь. Делать Я не возбраняю, а запрещаю беспокоиться, то есть иметь надежду на самих себя. А кто делает и уповает на Бога, тот живет беззаботно. Явно, что Он искореняет заботу, потому что она удаляет от Бога.'
      cn: 「那么，」他们会说，「你是命令我们不要耕作土地吗？」我没有说：不要耕作土地，而是说：不要忧虑（或：不要挂虑/关心，取决于上下文中的「заботиться」）。我并不禁止劳作，但我禁止担忧，也就是说，禁止将希望寄托在自己身上。而那既劳作又信靠上帝的人，他生活得无忧无虑。显然，祂是要根除忧虑，因为它使人远离上帝。
  - type: paragraph
    initial:
      ru: 'Лк 12:29. '
      cn: （路加福音 12:29）
    text:
      ru: Итак, не ищите, что́ вам есть, или что́ пить, и не беспокойтесь,
      cn: 尔等勿寻求何以食、或何以饮、亦勿烦虑、
  - type: paragraph
    initial:
      ru: 'Лк 12:30. '
      cn: （路加福音 12:30）
    text:
      ru: потому что всего этого ищут люди мира сего;
      cn: 盖此皆世之异邦人所求、而尔等之父、知尔等需此、
  - type: paragraph
    text:
      ru: Далее говорит:«не ищите, что́ вам есть, или что́ пить, и не беспокойтесь». Беспокойством (по-церковнославянски – возношением) называет, без сомнения, не иное что, как развлечение и непостоянное направление разума, помышляющего то о том, то о другом, перескакивающего от одного на другое и всегда мечтающего о чем-то более высоком. Не значит ли это гоняться за метеорами? Такую-то заботу, как удаляющую нас от Бога, или легкомыслие запрещает Господь, сказав, что«всего этого ищут люди мира сего». Ибо забота не останавливается на необходимом, но, как я сказал, всегда ищет более высокого, почему и называется возношением вверх. Например, мы не имеем хлеба. Мы сначала заботимся, откуда бы получить его, но на этом не останавливаемся, а желаем получить хлеб из отличной пшеницы; потом желаем и вина, и притом цветистоблаговонного; затем желаем и жареного, и притом из рябчиков или фазанов. Видишь ли, какова забота и легкомыслие? Поэтому Господь решительно пресекает оную, ибо этого ищут язычники.
      cn: 接下来，他继续说：「不要寻求，你们要吃什么，或喝什么，也不要忧虑（беспокойтесь）」。他所称的忧虑（在教会斯拉夫语中是 возношением，即「向上抬举」）无疑就是指心灵的分散和理智的不稳定方向——理智一会儿思虑这个，一会儿思虑那个，从一件事跳到另一件事，并且总是幻想某些更高尚的事物。这难道不是追逐流星吗？主禁止的正是这种使我们远离上帝的忧虑或轻浮，他说：「所有这一切都是世人所寻求的。」因为忧虑并不会止于必需之物，而是，正如我所说的，总是寻求更高尚的东西，因此它才被称为「向上抬举」（возношением вверх）。例如，我们没有面包。我们首先忧虑的是从哪里获得面包，但我们不会就此止步，而是渴望获得由上等小麦制成的面包；然后我们渴望获得葡萄酒，并且是那种带有花香芬芳的；接着我们渴望获得烤肉，而且是松鸡或野鸡的烤肉。你看到这忧虑和轻浮是何等模样了吗？因此，主果断地断绝了它，因为寻求这些的是异教徒。
  - type: paragraph
    text:
      ru: ваш же Отец знает, что вы имеете нужду в том;
      cn: 你们的父知道你们有此需要。
  - type: paragraph
    text:
      ru: 'Потом представляет и другое основание, именно: что Отец наш знает, в чем мы имеем нужду, и представляет не одно, а много оснований. Говорит: Он есть«Отец», а если Отец, то как не даст? Притом Он«знает», ибо не не знает. Да и вы«имеете нужду», ибо это не лишнее, а необходимое. Итак, если Он Отец и вы имеете нужду, и Он знает, то как же не даст?'
      cn: 接着，祂提出了另一个基础（根据），即：我们的父知道我们有何缺乏，并且祂提出的基础并非一个，而是许多。祂说：祂是「父」，既然是父，又怎会不赐予呢？此外，祂「知道」，因为祂并非一无所知。况且，你们「有缺乏」，因为这些并非多余的，而是必需的。所以，如果祂是父，而你们有缺乏，并且祂又知道，那么祂又怎会不赐予呢？
  - type: paragraph
    initial:
      ru: 'Лк 12:31. '
      cn: （路加福音 12:31）
    text:
      ru: наипаче ищите Царствия Божия, и это всё приложится вам.
      cn: 况尔等寻求上帝之国、并此一切将加于尔等、
  - type: paragraph
    text:
      ru: 'Поэтому прежде всего«ищите Царствия Божия», а заботу о житейском, как удаляющую вас от Него, отвергните, и тогда все сие придастся вам. Видишь ли, каков Бог? Если ты ищешь малого, ты делаешь неугодное Ему, ибо оскорбляешь Его великодаровитость; если ищешь великого, то и его получишь, и малое придается тебе. Ибо если Он увидит, что ты занят исканием Царства Его, то Он, всеконечно, будет промышлять о тебе в твоих нуждах. Даже и мы в своих делах не так ли поступаем? И мы заботимся более о тех, кои всецело предали себя нашему попечению, и бываем к ним так предусмотрительны, как будто бы они сами и не смотрят за собой? Не тем ли паче (так сотворит) Господь? Итак, Господь пресекает заботу о житейском для того, чтобы убедить нас искать Царствия Его: ибо при заботах о житейском это невозможно.'
      cn: 因此，你们首先要「寻求上帝之国」，至于对世俗生活的忧虑，因为它使你们远离上帝之国，你们就应当抛弃，如此，这一切都会加给你们。你明白吗，上帝是怎样的？如果你寻求微小之物，你行了祂所不喜悦之事，因为你冒犯了祂的宏大施予；如果你寻求宏大之物，你不仅会得到它，而且微小之物也会加给你。因为如果祂看到你正忙于寻求祂的国度，那么祂，理所当然地，必会在你的需要上眷顾你。甚至我们自己在处理事务时，不也是这样行事吗？我们更多地关心那些完全把自己交付给我们照料的人，我们对他们是如此地周到预备，仿佛他们自己完全没有照看自己一般？何况（如此行事）的是主呢？因此，主制止了对世俗生活的忧虑，目的是为了说服我们去寻求祂的国度：因为在对世俗生活的忧虑中，这是不可能的。
  - type: paragraph
    initial:
      ru: 'Лк 12:32. '
      cn: （路加福音 12:32）
    text:
      ru: Не бойся, малое стадо!
      cn: 〇小群乎、勿惧哉、尔等之父、甘愿以国赐予尔等、
  - type: paragraph
    text:
      ru: Господь желающих быть учениками Его называет«малым стадом»или потому, что в мире сем святых весьма мало по причине требуемой произвольной нищеты и нестяжательности, или потому, что их меньше, чем Ангелов, которых сонмы не имеют числа и несравненно превышают число нас. А что Ангелов гораздо больше, это видно из притчи, в которой Господь сказал, что пастырь об одном заблудшем и снова найденном радуется более, нежели о девяносто девяти незаблудших (Лк. 15, 7). Ибо отсюда видно, что как единица относится к девяносто девяти, так и род человеческий к миру ангельскому.
      cn: '主称那些渴望成为祂门徒的人为「小群」，原因可能是：在这世上，因着所要求的自愿的贫乏和不贪恋世物（нестяжательность），圣徒实在非常稀少；或者，是因为他们比天使少，天使的众队数目不可胜数，其数量远远超过我们。


        至于天使数量远超我们，这一点从比喻中可见。主在比喻中说，牧人因一个迷失而又被寻回的，所发出的喜乐，超过为那九十九个未曾迷失的（路加福音 15:7）。因为由此可见，人族与天使界的关系，正如同「一」与「九十九」的关系。'
  - type: paragraph
    text:
      ru: ибо Отец ваш благоволил дать вам Царство.
      cn: 因为你们的父，乐意将国赐予你们。
  - type: paragraph
    text:
      ru: «Не бойся,– говорит, –малое стадо», то есть не сомневайся, что Бог будет промышлять о тебе, хотя бы ты сам и не заботился о себе. Почему? Потому что«Отец... благоволил дать вам Царство». Если Он дает Царство, то тем более подаст предметы земные.
      cn: 「小群乎，勿惧哉，」——祂说道——也就是说，不要怀疑神将眷顾你，即便你自身不挂念自己。缘何？因为「父... 甘愿以国赐予尔等。」倘若祂赐予国度，那么祂就更会施予地上的物件。
  - type: paragraph
    initial:
      ru: 'Лк 12:33. '
      cn: （路加福音 12:33）
    text:
      ru: Продавайте имения ваши и давайте милостыню.
      cn: 售卖尔等所有者以施济、尔等为己做囊、乃不旧者、财宝在天为无匮乏者、在彼盗贼不近、蠹不损坏、
  - type: paragraph
    text:
      ru: Итак, не думай, что если не усвоишь себе нищету, то не будет Промыслителя о тебе, но продавай имение, давай милостыню и сделай сокровище неистощимым.
      cn: 是故，不要以为你若不使自己习得贫困，便不会有为你照料的普罗米斯特勒（Промыслитель），而当售卖家业，施予施济，并使财宝不致枯竭。
  - type: paragraph
    text:
      ru: Приготовляйте себе влагалища не ветшающие, сокровище неоскудевающее на небесах, куда вор не приближается и где моль не съедает,
      cn: 「你们为自己准备那些不旧的囊袋，就是那在天上的、永不匮乏的财宝，在那里，盗贼不能近前，蠹虫也不能蛀蚀，」
  - type: paragraph
    text:
      ru: Потом убеждает нас и непререкаемыми умозаключениями. Здесь, – говорит, – моль съедает, а на небе – нет. Итак, не безумно ли слагать сокровище в таком месте, в котором оно повреждается? Потом, поскольку моль не съедает золота, Он присовокупил:«куда вор не приближается». Ибо если моль не съедает золота, то вор похищает его.
      cn: 接着，他用无可辩驳的推论来说服我们。他说，在这里，蛀虫（蛾）会吃掉（宝物），但在天上却不会。那么，在一个宝物会被损毁的地方积攒宝物，难道不是愚蠢的吗？接着，因为蛀虫（蛾）不吃金子，他补充道：「盗贼不近之处」。因为如果蛀虫（蛾）不吃金子，盗贼也会窃取它。
  - type: paragraph
    initial:
      ru: 'Лк 12:34. '
      cn: （路加福音 12:34）
    text:
      ru: ибо где сокровище ваше, там и сердце ваше будет.
      cn: 盖尔等之财所在、尔等之心亦在焉、
  - type: paragraph
    text:
      ru: Потом, поскольку не всех же обкрадывают, Он присовокупляет еще большее и совершенно неопровержимое основание.«Ибо где сокровище ваше, там и сердце ваше будет». Пусть, – говорит, – будет и так, что и моль не съест, и вор не подойдет, но самое порабощение сердца закопанному в землю сокровищу и повержение в землю богоподобного существа души какого достойно наказания? Не тем ли больше наказание предлежит тому, кто имеет ум? Где сокровище ваше, там и сердце ваше. Если сокровище в земле, то и сердце в ней; если сокровище на небе, то и сердце – горе́. Кто же не изберет лучше быть горе́, чем под землей, быть Ангелом, чем кротом, живущим в подземных норах?
      cn: 随后，既然并非所有人都被偷盗，祂就又附加了一个更大、完全无可辩驳的根据：「盖尔等之财所在、尔等之心亦在焉、（路加福音 12:34）」祂说，姑且如此：即便没有蠹虫蛀蚀，盗贼也未靠近，但单单是心被奴役于埋藏在地下的财宝，以及将灵魂这神似之本体抛掷于泥土之中，这本身应得何种惩罚？对于拥有理性者而言，岂非有更大的惩罚临在？你们的财宝在哪里，你们的心就在那里。如果财宝在地上，心就在地上；如果财宝在天上，心就在高处。谁不会宁愿选择在高处，而不愿在地下，宁愿成为天使，而不愿成为生活在地下洞穴中的鼹鼠呢？
  - type: paragraph
    initial:
      ru: 'Лк 12:35. '
      cn: （路加福音 12:35）
    text:
      ru: Да будут чресла ваши препоясаны и светильники горящи.
      cn: 愿尔等之腰有以被束、而灯有以燃着、
  - type: paragraph
    text:
      ru: Господь, сделав ученика Своего свободным от лишнего, упразднив от всякой житейской заботы и надмения и таким образом сделав его легким, делает его уже и слугой. Ибо кто желает служить, тот должен быть легким и расторопным. Поэтому говорит:«Да будут чресла ваши препоясаны», то есть вы всегда являйтесь готовыми на дела своего владыки, и«светильники горящи», то есть не живите во тьме и без рассуждения, но свет разума пусть указывает вам все, что должно и что не должно делать. Итак, мир сей есть ночь. Препоясанные по чреслам суть ведущие деятельную жизнь. Ибо таково одеяние рабочих. Им нужны еще и светильники горящие. Ибо при деятельной жизни нужно и дарование рассуждения, то есть, чтобы деятель мог распознавать не только то, что должно делать, но и то, как должно делать. Ибо многие делали доброе, но делали не хорошо. Таковые хотя и были препоясаны по чреслам, поскольку они действовали, но светильников горящих не имели, то есть не имели разумного рассуждения, а впадали или в гордость, или в другую пропасть безумия. Приметь и то, что прежде препоясываются чресла наши, потом светильники зажигаются. Ибо прежде бывает деятельность, потом созерцание, которое есть озарение ума нашего. Ибо светильник, ум наш, тогда называется горящим, когда сияет в нем свет Божий. Итак, будем тщательно упражняться в добродетели, чтобы нам иметь горящими оба светильника наши, то есть слово внутреннее и слово произносимое, внутреннее – все озаряющим в душе, а произносимое – блистающим на языке. Ибо внутренний светильник нас просвещает, а слово учительское и произносимое светит прочим.
      cn: '主，使祂的门徒摆脱了多余之物，废除了世俗的一切忧虑和傲慢，以此使他变得轻省，并且使他成为仆人。因为凡是想要服事的人，必须是轻省和敏捷的。因此，祂说：「愿尔等之腰有以被束」，即是说，你们当常为尔等之主人的作为而准备好；又说「而灯有以燃着」，即是说，你们不要活在黑暗中，也不要毫无理性判断，而要让理智之光指示你们一切该做和不该做之事。


        因此，这个世界是夜。腰被束上的人，是那些过着行动生活的人。因为那是工人的衣着。他们也需要燃着的灯。因为在行动生活中，需要有分辨的恩赐，也就是说，行动者不仅能够辨别他当做什么，还能辨别他当如何做。因为许多人行了善事，但却做得不好。这样的人，虽然他们的腰被束上了——因为他们采取了行动——但他们没有燃着的灯，也就是说，他们没有理性的分辨力，反而陷入了骄傲或另一种愚昧的深渊。


        也要留意，首先是我们的腰被束上，然后才是灯被点燃。因为先有行动，后有默观，默观就是我们心智的光照。因为，我们的心智，即那盏灯，被称为燃着，是当上帝之光在其中闪耀之时。


        因此，我们要殷勤地在美德中操练，好使我们有两盏灯都燃着，即内在之言和发出之言；内在之言照亮灵魂中的一切，而发出之言则在舌头上闪耀。因为内在之灯光照我们，而教导性的、发出的言语则照亮其他人。'
  - type: paragraph
    initial:
      ru: 'Лк 12:36. '
      cn: （路加福音 12:36）
    text:
      ru: И вы будьте подобны людям, ожидающим возвращения господина своего с брака, дабы, когда придёт и постучит, тотчас отворить ему.
      cn: 且愿尔等如人俟其主自婚筵归、彼来而叩门时、即为之启、
  - type: paragraph
    text:
      ru: И мы должны быть«подобны людям, ожидающим возвращения своего... господина... с брака». Кто ж иной Этот Господин, как не Христос Иисус? Он, восприняв человеческую природу как бы невесту и соединив с Собой, сотворил брак, прилепившись к ней в плоть едину. Да и не один брак творит Он, а многие, ибо на небе каждодневно уневещивает Себе души святых, которые Павел или подобный Павлу представляет ему чистыми девами (2Кор. 11, 2). Возвращается Он с небесного брака, может быть, открыто пред всеми, при кончине вселенной, когда придет с неба во славе Отца, а может быть, невидимо и неожиданно являясь во всякую пору, при кончине каждого в частности. Итак, блажен тот, кого Он найдет препоясанным по чреслам, то есть готовым служить Богу деятельной частью христианского любомудрия, и имеющим горящий светильник слова и рассуждения, не только творящим доброе, но творящим оное хорошо и сверх того принявшим созерцание как бы некоторый светильник. Ибо чрез препоясание по чреслам у нас становится горящим и светильник созерцания, и даже два светильника, внутренний и износимый вовне.
      cn: '我们应当「像人等候着他们的...主人...从婚筵回来」。这位主人还能是谁，不就是基督耶稣吗？祂，接受了人性如同新娘一般，并将之与自身结合，创造了婚筵，藉着与她合为一体的肉身而依附于她。并且，祂所创造的不只是一场婚筵，而是许多场，因为在天上祂每日都为自己迎娶圣徒的灵魂作为新娘，保罗或像保罗那样的人将这些灵魂当作贞洁的童女献给祂（哥林多后书 11:2）。


        祂从天上的婚筵归来，或许是公开地在所有人面前，在世界末期，当祂带着天父的荣耀从天上降临时；或许是不可见地、出乎意料地显现于每一个时刻，在每个个体生命结束之时。因此，那人是有福的，主发现他腰间束着带子，也就是说，他预备好用基督教爱智学（Christian *philosophia*）的践行部分来事奉上帝，并拥有着话语和思辨的燃烧着的灯，他不只是行善，而且是行善得好，并且除此之外，他还接纳了默观如同某些灯。因为通过腰间束带，我们便拥有了燃烧着的默观之灯，甚至是两盏灯，一盏是内在的，一盏是外显的。'
  - type: paragraph
    initial:
      ru: 'Лк 12:37. '
      cn: （路加福音 12:37）
    text:
      ru: Блаженны рабы те, которых господин, придя, найдёт бодрствующими; истинно говорю вам, он препояшется и посадит их, и, подходя, станет служить им.
      cn: 惟福哉其仆、其主来至、见彼等警醒者、我诚告尔等、彼自束使彼等席坐、而前来供事之、
  - type: paragraph
    text:
      ru: Для такого слуги сам Господь становится слугой. Ибо сказано:«и посадит их, и, подходя, станет служить им». Бог препоясывается, потому что не всю полноту благ источает нам, но сдерживает оную. Ибо кто может вместить Бога, каков Он есть? Это видно и на Серафимах, которые покрываются от превосходства Божественного света (Ис. 6, 2). Добрых рабов Он полагает на ложе, то есть всех во всем успокаивает. Ибо как лежавший на ложе все тело успокаивает, так и в будущее пришествие все святые будут успокоены во всех отношениях. Здесь они не находят отдохновения для тела, а там вместе с душами и тела их, духовные и божественные, наследовав нетление, будут наслаждаться совершенным покоем, и Бог будет все во всех их (1Кор. 15, 28). Господь«станет служить»достойным (рабам), воздавая им равное. Как они служили Ему, так и Он послужит им, предлагая им изобильную трапезу и подавая наслаждение духовными дарованиями.
      cn: 对于这样的仆人，主自己成为了仆役。因为经文说：「他使他们坐席，自己束上，前来服事他们。」上帝束上自己，是因为祂并非将所有的丰盛之福祉都倾注于我们，而是加以节制。因为谁能容纳上帝本来的样子呢？这在撒拉弗身上也清晰可见，他们因神圣之光过于卓越而遮蔽自己（以赛亚书 6:2）。祂使那些良善的仆人躺卧于床榻之上，意即使他们全然在万事中得到安息。因为如同躺在床榻上的人全身得到安息一般，在未来的降临中，所有的圣徒将在各个方面得到安息。在此地，他们的身体找不到歇息之处，但在那里，他们的身体，连同他们的灵魂，将是属灵且神圣的，继承了不朽坏，享受完全的安息，且上帝将是他们万有中的万有（哥林多前书 15:28）。主「将服事」那些配得的（仆人），报偿他们以同等的待遇。正如他们服事了祂，祂也将服事他们，向他们摆上丰盛的筵席，并赐予他们对属灵恩赐的享乐。
  - type: paragraph
    initial:
      ru: 'Лк 12:38. '
      cn: （路加福音 12:38）
    text:
      ru: И если придет во вторую стражу, и в третью стражу придет, и найдет их так, то блаженны рабы те.
      cn: 若彼于二更来、又三更来、而见如是、福哉、其诸仆也、
  - type: paragraph
    text:
      ru: 'Под «второй и третьей стражей» можешь разуметь разные времена нашей жизни. Объясню примером. Как не спящий«во вторую и... третью стражу»считается самым неусыпным, ибо эти часы ночи в особенности доставляют людям сон, и сон первый: так разумей, пожалуй, что и при различных состояниях нашей жизни есть времена, которые, если мы окажемся в оные бодрствующими, делают нас блаженными. Похитил ли кто у тебя имение? Дети ли у тебя умерли? Оклеветал ли кто тебя? Если ты в таких обстоятельствах оказался бдящим пред Богом и Владыкой и не допустил себе ничего сделать вопреки Его заповедям, то Он поистине нашел тебя бдящим«во вторую и... третью стражу», то есть во время тяжелое, в которое нерадивые души падают и засыпают сном смертным.'
      cn: 在「二更和三更」下，你可以理解我们生命中不同的时期。我将用一个例子来解释。正如不睡于「二更和...三更」的人被认为是最警醒不眠的，因为夜晚的这些时辰尤其容易让人入睡，并且是初时的睡意；同理，你亦可以理解，在我们生命的不同状态下，存在着一些时期，如果我们被发现在这些时期内保持警醒，就会使我们成为有福的。是否有人夺走了你的财产？你的孩子是否死了？是否有人诽谤你？如果你在这样的境况下，在上帝和主宰面前被发现保持警醒，并且没有允许自己做出任何违背祂诫命的事情，那么祂就确实发现你在「二更和...三更」时警醒着，也就是说，在艰难的时刻警醒着——在这些时刻，疏忽的灵魂会跌倒，并陷入死亡的沉睡。
  - type: paragraph
    initial:
      ru: 'Лк 12:39. '
      cn: （路加福音 12:39）
    text:
      ru: Вы знаете, что если бы ведал хозяин дома, в который час придет вор, то бодрствовал бы и не допустил бы подкопать дом свой.
      cn: 尔等当晓此若家主知盗贼于何时至、则必警醒、不容穿窬其室、
  - type: paragraph
    text:
      ru: Итак, необходимо бодрствовать. Ибо мы подобны хозяину дома. Если он не спит, то вор не может похитить ничего из его имения; если же он сонлив, то вор все заберет и уйдет. Некоторые разумеют здесь под вором диавола, под домом – душу, а под хозяином дома – человека. Однако ж такое разумение, кажется, не подходит к связи речи. Здесь вору уподобляется пришествие Господа, по его неожиданности, как и один из апостолов говорит:«день Господень, как тать ночью»(2Пет. 3, 10).
      cn: 因此，有必要保持警醒。因为我们就像房子的主人。如果他没有睡觉，那么盗贼就不能从他的财产中偷走任何东西；但如果他昏昏欲睡，那么盗贼就会把一切都拿走并离开。有些人在此处将盗贼理解为魔鬼（диавола），将房子理解为灵魂（душу），将房子的主人理解为人（человека）。然而，这种理解似乎与语境的连贯性不符。此处，主（Господа）的降临被比作盗贼，因为它的出乎意料，正如其中一位使徒所说：「主的日子要像夜间的贼一样来到」（彼得后书 3:10）。
  - type: paragraph
    initial:
      ru: 'Лк 12:40. '
      cn: （路加福音 12:40）
    text:
      ru: Будьте же и вы готовы, ибо, в который час не думаете, приидет Сын Человеческий.
      cn: 故愿尔等预备、盖尔等不意何时人子来矣、
  - type: paragraph
    text:
      ru: И здесь же, смотри, как Господь объясняет, кто такой вор.«Будьте же, – говорит, –и вы готовы, ибо, в который час не думаете, приидет Сын Человеческий».
      cn: 在此处，且看主如何解释，谁是「贼」。祂说：「你们也当预备好，因为在你们想不到的时辰，人子就来了。」
  - type: paragraph
    text:
      ru: 'Некоторые же говорят, что под бдящими в первую стражу разумеются те, кои внимательнее прочих, под бдящими во вторую стражу – те, кои уступают им, а под бдящими в третью стражу – те, кои стоят ниже и сих. А другие изъясняли стражи о различных возрастах: первую – о юности, вторую – о мужестве, а третью – о старости. Итак, блажен тот, кто в каком бы то ни случилось возрасте найден будет бдящим, а не беспечным относительно добродетели.'
      cn: 然而，有些人说，在「第一更次警醒者」之下所意指的，是那些比其余的人更警醒（更专注）的人；在「第二更次警醒者」之下所意指的，是那些不如他们的人；而在「第三更次警醒者」之下所意指的，是那些甚至比这些人更低下的人。还有一些人则用「更次」来解释各种不同的年龄段：第一更次指青年时期，第二更次指壮年时期，而第三更次指老年时期。所以，无论在哪一个年龄段，那被发现警醒而非对美德毫不关心的人，都是蒙福的。
  - type: paragraph
    initial:
      ru: 'Лк 12:41. '
      cn: （路加福音 12:41）
    text:
      ru: 'Тогда сказал Ему Петр: Господи! к нам ли притчу сию говоришь, или и ко всем?'
      cn: 撇特儿语之曰、主欤、言此譬喻是向我侪乎、抑向众人乎、主曰、
  - type: paragraph
    text:
      ru: Петр, как обо всех заботящийся и по братолюбию ревнующий о пользе слушателей и как получивший уже Церковь в свое доверие, спросил (Господа):«ко всем»ли Он говорит эту притчу. Господь ясно не отвечает ему на вопрос, а прикровенно показывает, что хотя сказанная притча обща и простирается на всех верующих, кто бы они ни были, но относится и к вам – апостолам и вообще удостоенным учительства или предстоятельства. Слушай.
      cn: 彼得，由于他关心所有人，并出于弟兄之爱而热心于听众的益处，又由于他已经获得了教会的信赖，故他询问（主）：祂是否是「向所有人」讲这比喻。主没有明确地回答他的问题，而是隐晦地指出，尽管所说的比喻是普遍的，并延伸到所有的信徒，无论他们是谁，但它也关系到你们——使徒，以及所有通常被认为配得教导职分或首席地位的人。请听。
  - type: paragraph
    initial:
      ru: 'Лк 12:42. '
      cn: （路加福音 12:42）
    text:
      ru: 'Господь же сказал: кто́ верный и благоразумный домоправитель,'
      cn: 〇谁是忠且智之家宰、其主立之于诸仆之上、为随时以粮饷量予之、
  - type: paragraph
    text:
      ru: 'Вышесказанная притча, – говорит, – многим прилична, а теперь говорит о тех, которые удостоены предстоятельства: недоумеваю, кто окажется имеющим то и другое, то есть верность и благоразумие. Ибо таковые редки, и трудно находить их. Как в управлении обыкновенным имением, если кто верен своему господину, но неблагоразумен, тот расточает имение господина, ибо не умеет распоряжаться им как должно, когда нужно давать, не дает, а гораздо больше теряет, и равным образом, если кто благоразумен и находчив, но неверен, тот может быть вором, и тем менее уловимым, чем более он благоразумен, – так и в божественных предметах нужны вместе верность и благоразумие. Ибо я знаю многих, которые, по-видимому, и усердны к добродетели, и богобоязливы, и имеют веру, но, поскольку не могли благоразумно распоряжаться церковными делами, повредили не только имению, но и душам. Например, если кто впадет в духовное преступление, но предстоятель не будет благоразумен, а будет иметь только веру, то есть добродетель бессознательную, то падший может потерпеть вред или от непомерной строгости, или от неуместной кротости его, и не уврачуется, но сокрушится.'
      cn: '「所说在前的这比喻，」他说，「适用于许多人，而现在他所说的，是指那些被授予领导职权的人：我怀疑，谁能被发现同时具备两者，即信实（верность）和审慎（благоразумие）。因为这样的人是罕见的，很难找到。正如在管理普通财产时，如果有人忠于他的主人，却不审慎，他就会挥霍主人的财产，因为他不懂得如何妥善处理；该给予时，他不给予，反而损失更多。同理，如果有人审慎且机警，却不信实，他可能成为窃贼，而且他越是审慎，就越难被捕获。


        因此，在神圣的事物中，信实和审慎也需要同时具备。因为我知道许多人，他们表面上对美德热心、敬畏上帝、并拥有信心，但因为他们不能审慎地处理教会事务，他们不仅损害了财产，也损害了灵魂。例如，如果有人陷入属灵的罪过，但领导者不审慎，而只拥有信心，即一种无意识的美德，那么这个跌倒之人可能会因他的过度严苛或不合时宜的温和而遭受损害，得不到医治，反而会被破碎。」'
  - type: paragraph
    text:
      ru: которого господин поставил над слугами своими раздавать им в своё время меру хлеба?
      cn: 其主立之于诸仆之上，为随时以粮饷量予之？
  - type: paragraph
    text:
      ru: Итак, кто будет найден верным и благоразумным, тот поставлен будет«над слугами»Господа, то есть над всеми рабами Его, чтобы каждому«в свое время... раздавать...определеннуюмеру хлеба», то есть или догматическое учение, которым питаются души, или образец деятельности и начертание, как должно жить.
      cn: 因此，那将被发现为忠且智的，将被立于主之「诸仆之上」，即在其所有的奴仆之上，为要「在自己的时间……分发……定量的粮饷」给每一个人，这「粮饷」或是指教义性教诲（用以滋养灵魂），或是指活动典范以及当如何生活的纲要。
  - type: paragraph
    initial:
      ru: 'Лк 12:43. '
      cn: （路加福音 12:43）
    text:
      ru: Блажен раб тот, которого господин его, придя, найдет поступающим так.
      cn: 福哉、其仆、其主来至、见其所行者、如是、
  - type: paragraph
    initial:
      ru: 'Лк 12:44. '
      cn: （路加福音 12:44）
    text:
      ru: Истинно говорю вам, что над всем имением своим поставит его.
      cn: 我诚告尔等、彼将立之于其所有者之上、
  - type: paragraph
    text:
      ru: 'Если он будет найден поступающим так, то блажен, и Господь«поставит его... над всем имением своим», не только над рабами, но и над всем поставит его, удостоив его высшей степени, так что ему будет покоряться земное и небесное, каковы были, например, Иисус Навин и Илия. Один из них повелевал солнцу, а другой – облакам небесным (Нав. 10, 12;3Цар. 17, 1). Да и все вообще святые как друзья Божии, пользуются достоянием своего Друга. И у друзей обыкновенно все бывает общее (Деян. 4, 32). И всякий, кто при безмятежной жизни упражняется в деятельной добродетели и подчиняет себе рабские страсти – гнев и похотение, давая каждой из них в свое время определенную меру пищи, гневу, например, ненависть к ненавидящим Господа и раздражение против врагов Его (Пс. 138, 21), похотению – заботу только о необходимом для плоти, а всецелое устремление – к Богу, всякий таковой блажен: он достигнет и созерцания, и будет поставлен над всем имением (сущим у) Господа он удостоится созерцательным умом зреть и наблюдать все, не только существующее не само по себе, но и то, что в собственном смысле существует, то есть вечно.'
      cn: 如果他被发现如此行事，那么他是有福的，主「将立之于其所有所有者之上」，不仅是立于众仆之上，而是立于所有的一切之上，使他配得最高的等级，以至于地上和天上的事物都将顺服于他。例如，像约书亚和以利亚便是如此。他们其中一位曾命令太阳，另一位曾命令天上的云（约书亚记 10:12，列王纪上 17:1）。况且，所有圣徒，作为上帝的朋友，都享用他们朋友的产业。在朋友之间，所有的一切通常都是共有的（使徒行传 4:32）。凡是在平静的生活中操练能动美德，并使奴役性的情欲——愤怒和贪欲——臣服于己的人，在适当的时候给予它们各自确定的食物分量，例如，给予愤怒以对那些仇恨主之人（诗篇 138:21）的憎恨，以及对祂仇敌的愤慨；给予贪欲以仅对肉体必需之物的关切，而将全然的奔向导向于上帝；凡是这样的人都是有福的：他将达到沉思，并被立于主的所有产业之上。他将被赋予沉思的心智，去察看和观察一切，不仅是那些非自身而存在的，而且还有那些就其自身而言是存在的，即永恒之物。
  - type: paragraph
    initial:
      ru: 'Лк 12:45. '
      cn: （路加福音 12:45）
    text:
      ru: 'Если же раб тот скажет в сердце своем: не скоро придет господин мой, и начнет бить слуг и служанок, есть и пить и напиваться, –'
      cn: 若其仆心中云、我主来必迟、扑起诸仆诸婢、食饮且醉、
  - type: paragraph
    text:
      ru: Горе таким рабам, которые, получив дарование духовного настоятельства, губят вверенное им домостроительство, пьют и упиваются, будешь ли понимать сие о чувственном пьянстве (ибо и это случается с худыми настоятелями церквей, расточающими имение бедных), или будешь разуметь под пьянством развращение ума в учении и распоряжении имением. Такие предстоятели бьют слуг и служанок, то есть, соблазняя слабейших членов церкви, убивают их совесть. Ибо слабый и малодушный, увидев, что я – архиерей – веду худую жизнь, соблазняется сим и убивается совестью, принимает удары в сердце и делается еще слабейшим. А все это случается с лукавым рабом от того, что он в сердце своем сказал:«не скоро придет господин мой». Ибо такого рода поведение происходит от беспечности и неразмышления о часе кончины. Если же бы мы содержали в мысли, что Господь идет, что при дверях кончина мира и конец нашей жизни, то мы грешили бы менее.
      cn: '祸哉那些仆人，他们获得了属灵的监督职分（дарование духовного настоятельства），却糟蹋了那托付给他们的管家职份（домостроительство），他们又吃又醉。你可以将其理解为感官上的醉酒（因为这种事也发生在那些糟蹋穷人财产的邪恶教会监督身上），你也可以将醉酒理解为在教义和财产管理方面的心智败坏。


        这类主事者殴打仆人和婢女，也就是说，他们通过诱惑教会中较为软弱的成员，杀害了他们的良知（совесть）。因为那软弱又胆怯的人，看到我这个大主教过着邪恶的生活，便会因此被诱惑，良知因此被杀害，心中遭受打击，变得更加软弱。


        所有这一切发生在那个邪恶的仆人身上，是因为他在心里说：「我的主人不会很快来到。」（路加福音 12:45）因为这种行为源于懈怠（беспечности）和对临终时刻的不加思量（неразмышления）。如果我们将「主正在来临」以及「世界的终结和我们生命的终结近在门前」铭记于心，那么我们犯罪就会少一些。'
  - type: paragraph
    initial:
      ru: 'Лк 12:46. '
      cn: （路加福音 12:46）
    text:
      ru: то придет господин раба того в день, в который он не ожидает, и в час, в который не думает, и рассечет его,
      cn: 乃在不待之日、不知之时、其仆之主来至、劈之、即处之与不信者同分、
  - type: paragraph
    text:
      ru: 'Примечай и наказание.«Рассечет, – говорит, –его», то есть лишит дарования учительства. Чтобы кто-нибудь не подумал, что дарование это поможет ему избавиться от сильного наказания, Он говорит: как поможет ему дарование, когда он в то время не будет иметь его? Ибо быть рассеченным пополам–значит быть лишенным благодати. Таковой, будучи плотью, а не духом, окажется тогда достойным сожаления, поскольку, по апостолу, мы тогда живем по духу, когда Дух Божий живет в нас (Рим. 8,9).'
      cn: '留意这惩罚。


        祂说：「必劈开他」，也就是说，剥夺他的教诲之恩赐。为免有人以为这恩赐能帮助他摆脱严厉的惩罚，祂说：当那时他将不再拥有这恩赐时，这恩赐又如何能帮助他呢？因为被一分为二（从中断开）——就意味着被剥夺了恩典（或：圣宠）。


        这样的人，既然是属肉的，而不是属灵的，那时他就会显得可怜，因为，根据使徒的说法，当神的圣灵住在我们里面时，我们就是活在灵里（罗马书 8:9）。'
  - type: paragraph
    text:
      ru: и подвергнет его одной участи с неверными.
      cn: 且将他置于与不信者相同的命运。
  - type: paragraph
    text:
      ru: А кто найден будет ходившим не по духу, но по плоти и непричастным духовной жизни, тот поставится в ряду с неверным, поскольку осудится с миром неверным, как не получивший никакой пользы от мнимой веры. Ибо истинной веры в нем не было. Если бы в нем была истинная вера, он был бы верным домостроителем. А теперь, поскольку он пил и упивался, и расточал принадлежащее господину, очевидно, что не имел истинной верности, какая требуется от домоправителей. Поэтому справедливо часть его полагается с неверными. Ибо, лишенный дарования и разоблаченный, он оказывается поврежденным, а не совсем целым.
      cn: 凡被发现不顺从圣灵而行，而顺从肉体，且未分享到属灵生命的人，那人将被置于不信者之列，因为他将与不信的世界一同被定罪，就像一个未从徒有其名的信仰中获得任何益处的人一样。因为他里面没有真实的信仰。假如他拥有真实的信仰，他就会是一个忠实的管家。而如今，鉴于他酗酒并沉醉，且挥霍了属于主人的财产，这明显表明他未拥有 домо管家所要求具备的真实忠诚。因此，将他的份与不信者一同放置是公义的。因为他被剥夺了恩赐，并被揭露出来，他显露为是受损的，而非完全整全的。
  - type: paragraph
    initial:
      ru: 'Лк 12:47. '
      cn: （路加福音 12:47）
    text:
      ru: Раб же тот, который знал волю господина своего, и не был готов, и не делал по воле его, бит будет много;
      cn: 其仆知其主之旨、而不设备、且不顺其旨而行、见扑必多、
  - type: paragraph
    text:
      ru: Здесь Господь представляет нам нечто более важное и ужасное. Таковый, – говорит, – не только дарования лишится и не найдет в оном пособия к освобождению от наказания, но величие достоинства сделает его повинным еще бoльшему осуждению. Ибо чем более знает согрешающий, тем больше он заслуживает себе наказания.
      cn: 在这里，主向我们呈现了某种更重要且可怕的事。「这样的人，」他说，「不仅将丧失恩赐，并且在其中找不到脱离惩罚的帮助，反而，这尊严的伟大之处将使他承担更大的谴责。」因为犯罪者知道得越多，他就越给自己招致惩罚。
  - type: paragraph
    initial:
      ru: 'Лк 12:48. '
      cn: （路加福音 12:48）
    text:
      ru: а который не знал, и сделал достойное наказания, бит будет меньше. И от всякого, кому дано много, много и потребуется, и кому много вверено, с того больше взыщут.
      cn: 惟不知而行者、当责之、见扑必少、 〇凡予之多者、由之寻索亦多、托付之多者、由之追求亦多、
  - type: paragraph
    text:
      ru: 'В дальнейшей речи раскрывает это еще яснее.«Кому,– говорит, –дано много»,от того«много и потребуется, и кому много вверили,с того больше взыщут».Через это Господь показывает, что наказание, заслуженное учителями, будет большее. Учителям дается и вверяется: «дается», например, дарование творить чудеса, врачевать болезни, а «вверяется» им дарование слова и учительства. Господь сказал:«больше взыщут»,не при слове «дается», но при слове «вверяется». Ибо при даровании слова поистине нужно делание, и с учителя взыскивается больше. Он не должен оставаться беспечным, но должен приумножать талант слова. Итак, слова«и от всякого, кому дано»ты должен разуметь так: кому много отдали в рост. Ибо предметом, отдаваемым под сохранение, здесь Он назвал рост.'
      cn: 在进一步的言论中，祂将此揭示得更加清晰。祂说：「凡予之多者，」由之「多亦被要求，而凡托付之多者，由之更多被追索。」主借此表明，教师所应受的惩罚将更大。恩赐被给予和托付给教师们：「被给予」的，例如，行奇迹、医治疾病的恩赐，而「被托付」给他们的，是话语和教导的恩赐。主说：「更多被追索」，并非紧随「被给予」一词，而是紧随「被托付」一词。因为在话语的恩赐上，行事是真正需要的，且教师将被追索更多。祂不应保持懈怠，而应使话语的才干增多。因此，对于「和凡托付给他的」这些话，你应当这样理解：凡多被用于生息者。因为在此，祂将那被置于保管之下之物称为生息。
  - type: paragraph
    text:
      ru: 'Иные спрашивают: пусть так, что справедливо наказывается знавший волю господина и не делающий по ней; но почему наказывается тот, кто не знал? Потому что и он мог узнать, однако ж, не захотел, а по беспечности сам сделался виновным в незнании. Итак, он достоин наказания за то, что добровольно не узнал. Устрашимся, братие! Ибо если тот, кто совершенно не знал, достоин наказания, то какое извинение оправдает согрешающих при знании, особенно, если они были учителями? Подлинно, осуждение их очень тяжело.'
      cn: 有些人问道：姑且承认，知道主人意愿却不遵行的人受到惩罚是公正的；但为什么不知道的人也要受到惩罚呢？因为他本可以知晓，然而却不愿知晓，反倒因着疏忽大意而自陷于无知之罪。因此，他因着自愿不肯去了解而配受惩罚。弟兄们，让我们心存敬畏吧！因为如果那全然不知之人尚且配受惩罚，那么对于那些明知故犯之人，尤其当他们是教师时，又有何种借口能为他们开脱呢？诚然，他们的定罪是非常沉重的。
  - type: paragraph
    initial:
      ru: 'Лк 12:49. '
      cn: （路加福音 12:49）
    text:
      ru: Огонь пришел Я низвести на землю,
      cn: 我来以火投地、我何愿、为已燃着矣、
  - type: paragraph
    text:
      ru: Ибо слово есть огонь, поедающий всякое вещественное и нечистое помышление и истребляющий идолов, из какого бы ни были они вещества. Разумеется и ревность по добру, возгорающаяся в каждом из нас. А может быть, и ревность, порождаемая Словом Божиим, не разнится от первой. Господь желает, чтобы сим-то огнем возгорелись сердца наши. Ибо мы должны иметь пламенную ревность по добру.
      cn: 因为，道（Word）就是火，吞噬一切属物质的和不洁的思虑，并焚毁偶像，无论它们是由何种物质制成。它所指的也可以理解为，在我们每个人心中燃烧起来的对良善的热忱。或许，由上帝的道（Word）所生的热忱，与第一种热忱并无差异。主渴望我们的心能被此火点燃。因为，我们应当对良善怀有炽热的（或：火热的、燃烧的）热忱。
  - type: paragraph
    text:
      ru: и как желал бы, чтобы он уже возгорелся!
      cn: '我来以火投地、我何愿、为已燃着矣、


        圣奥赫里德的狄奥菲拉克


        并且我是多么地渴望它已经燃烧起来了啊！'
  - type: paragraph
    text:
      ru: '«И как желал бы»иначе: и сколь сильно желаю,«чтобы он уже возгорелся!». Ускоряет возжжение огня сего, подобно как и Павел говорит:«духом пламенейте»(Рим. 12, 11), и в другом месте:«ревную о вас ревностью Божиею»(2Кор. 11, 2).'
      cn: 「我何等愿望」，或者说：我何其热切地愿望，「它已经燃着了！」祂催促着这火的燃起，正如保罗所说：「殷勤不可懒惰，要心里火热」（罗马书 12:11），又在另一处说：「我为你们起的愤恨，原是神那样的愤恨」（哥林多后书 11:2）。
  - type: paragraph
    initial:
      ru: 'Лк 12:50. '
      cn: （路加福音 12:50）
    text:
      ru: Крещением должен Я креститься; и как Я томлюсь, пока сие совершится!
      cn: 我当以洗礼领洗、如何急迫、直至成就之、
  - type: paragraph
    text:
      ru: «Крещением»называет смерть Свою. Так как огонь этот имел возгореться не иначе, как после смерти Его, ибо оттуда возросла проповедь и ревность, то присовокупляет речь о смерти, называя ее крещением. Сильно желая ее, говорит:«и как томлюсь»,то есть, сколько Я забочусь и«томлюсь, пока сие совершится!»Ибо Я жажду смерти за спасение всех.
      cn: '「洗礼」（Крещением）指的是祂的死亡。因为这火非待祂死后便不能点燃——因为自那里兴起了宣讲与热忱（ревность）——所以祂附带地提到了死亡，称之为洗礼。


        祂强烈渴望着祂的死亡，因此祂说：「我何等焦急」（и как томлюсь），意思是说，我付出了多少关切（забочусь），并「焦急，直到这事成就」（томлюсь, пока сие совершится！）！因为我渴望为了所有人的救赎而死。'
  - type: paragraph
    text:
      ru: Господь пришел низвести огонь не только на землю, на которой распространились Его учение и вера, но и на душу каждого, которая (сама по себе) есть терновная и бесплодная земля, но Словом Божиим возжигается как бы огнем и становится способной к принятию Божественных семян и духовноплодоносной. Ибо когда благодать Божия невидимо коснется чьей-нибудь души, то, кажется, она горит такой любовью к Богу, что нельзя и сказать. Так точно и Клеопа с его спутником, воспламеняемые невидимо огнем Божией благодати, говорили:«не горело ли в нас сердце наше»(Лк. 24, 32). Кто испытал такое состояние, тот поймет слова наши. А многие и часто испытывают оное при чтении Божественного Писания или житий святых отцев, то при убеждении и поучении от кого-нибудь, воспламеняясь душами к деланию добра, и одни пылают до конца, а другие тотчас же охладевают.
      cn: '主降下火来，不仅是降在传播了祂的教导和信仰的大地上，更是降在每一个人的灵魂上。这灵魂（其本身）是多荆棘且不结果实的土地，但却藉着上帝的圣言，如同被火点燃一般，变得能够接受神圣的种子，并具有属灵的结实能力。因为当上帝的恩典无形地触及某人的灵魂时，灵魂似乎会燃烧起对上帝那无法言喻的爱。


        正如革流巴和他的同伴，被上帝恩典的火无形地点燃时，曾说：「我们的心岂不是在我们里面火热吗？」（路加福音 24:32）。体会过这种状态的人，就能理解我们的话语。许多人也经常在阅读《神圣圣经》或圣教父的生平事迹时，或在接受某人的劝勉和教诲时，体验到这种状态。他们的灵魂被激发起来行善，有些人至始至终都保持着这种炽热，而另一些人则会立刻冷却下来。'
  - type: paragraph
    initial:
      ru: 'Лк 12:51. '
      cn: （路加福音 12:51）
    text:
      ru: Думаете ли вы, что Я пришел дать мир земле? Нет, говорю вам, но разделение;
      cn: 尔等以为我来赐安和于地乎、我告尔等、非也、乃分争耳、
  - type: paragraph
    text:
      ru: 'Христос«есть мир наш»(Еф. 2, 14), однако ж говорит: «непришел дать мир». Значит, слова Его загадочны. Итак, мы говорим, что не всякий мир беспорочен и добр, но часто бывает опасен и удаляет от Божественной любви, например, когда мы заключаем мир и согласие на опровержение истины. Христос не пришел дать такого мира, а, напротив, желает, чтобы мы из-за добра разделились друг против друга, что и случилось во время гонений. Ибо в одном дому отец язычник разделялся против верующего сына, и мать против дочери, и наоборот.'
      cn: 基督「是我们的和平」（以弗所书 2:14），然而祂却说：「我来不是叫地上太平。」那么，祂的话语是隐晦难解的。因此，我们说，并非所有的和平都是无可指责且良善的，它却常常是危险的，并且使人远离神圣的爱，例如，当我们为了驳斥真理而缔结和平与和睦时。基督来不是要赐予这样的和平，相反，祂希望我们为了良善之事而彼此分裂，这在逼迫时期就已经发生了。因为在一个家庭中，信奉异教的父亲会与信仰基督的儿子分裂，母亲会与女儿分裂，反之亦然。
  - type: paragraph
    initial:
      ru: 'Лк 12:52. '
      cn: （路加福音 12:52）
    text:
      ru: 'ибо отныне пятеро в одном доме станут разделяться, трое против двух, и двое против трех:'
      cn: 盖自今于一家中、将有五人分争、三人攻二人、二人攻三人、
  - type: paragraph
    initial:
      ru: 'Лк 12:53. '
      cn: （路加福音 12:53）
    text:
      ru: отец будет против сына, и сын против отца; мать против дочери, и дочь против матери; свекровь против невестки своей, и невестка против свекрови своей.
      cn: 父攻子、子亦攻父、母攻女、女亦攻母、姑攻其媳、媳亦攻其姑、
  - type: paragraph
    text:
      ru: 'Как Он сказал, что«пятеро в одном доме станут разделяться»,а при исчислении помянул «шесть» лиц? Отвечаем: одно лицо взято дважды, именно: дочь и невестка одно и тоже лицо. По отношению к матери названа дочерью, а по отношению к свекрови – невесткой. Итак,«трое"– отец, мать и свекровь – станут разделяться «против двоих» – сына и дочери. Ибо дочь, как мы сказали, будучи одно лицо, но, принимая двоякое отношение, именно: в приложении к матери и к свекрови, представляется поэтому двумя лицами.'
      cn: 他如何说「五个在一家里将要分裂」，但在计算时又提到了「六」个人呢？我们回答说：有一个人被提到了两次，那就是：女儿和儿媳是同一个人。就其母亲而言，她被称为女儿；就其婆婆而言，她被称为儿媳。因此，「三个人」——父亲、母亲和婆婆——将要分裂「反对两个人」——儿子和女儿。因为如我们所言，女儿是同一个人，但她接受了双重关系，即：在应用于母亲时，以及在应用于婆婆时，她因此呈现为两个人。
  - type: paragraph
    text:
      ru: Под отцом и матерью, и свекровью разумей, пожалуй, и просто все ветхое, а под сыном и дочерью – все новое. В таком случае Господь желает, чтобы Его новые Божественные заповеди и учение побороли все наше ветхое – греховные нравы и учение.
      cn: 就父亲和母亲，以及婆婆而言，你可以理解为，它们很可能泛指一切旧有的事物；而就儿子和女儿而言，它们则指一切新的事物。在这种情况下，主希望祂新的神圣诫命和教导能够战胜我们所有旧有的事物——罪恶的习俗和教义。
  - type: paragraph
    text:
      ru: Разумей и так. Отец есть ум, а сын – рассудок. Между ними в едином доме, то есть в человеке, происходило разделение. Скажу яснее. УмДионисия Ареопагитабыл озарен и принял проповедь. Но уму его, без доказательств принявшему веру, противился языческий рассудок, пытающийся доказать и заставляющий следовать диалектическим приемам. Видишь ли разделение между отцом и сыном, враждующих друг против друга ради Христа и проповеди? Матерью и свекровью можешь назвать мысль, а дочерью и невесткой – чувство. И между ними бывает борьба ради Христа. У мысли бывает вражда против чувства, когда мысль убеждает почитать непреходящее выше преходящего, невидимое выше видимого, и имеет на то многие сильные доказательства. Бывает, что и со стороны чувства направляется борьба против мысли. Ибо чувство, руководимое в вере чудесами и видимыми знамениями, не убеждается доводами мысли, не хочет следовать и языческим доказательствам, которые внимающих им побуждают не веровать, что Бог сделался человеком или что Дева – родила. Так безумны умозаключения язычников, боготворящих природу. Между тем чувство посредством видимых чудес приводит к богопознанию лучше всякого доказательства. Итак, не всякий мир и согласие – добро, но бывает, что вражда и разделение кажутся некоторым божественным делом. Поэтому никто да не пребывает в дружбе с лукавыми, но хотя бы отец и мать оказались противниками Закона Христова, и с ними, как врагами истины, должно враждовать.
      cn: '你还当这样理解。父即是心智（ум），子即是理性（рассудок）。在同一居所，亦即在人之中，他们之间发生了分裂。我解释得更清楚些。丢尼修·阿雷奥帕吉塔的心智（ум）被光照并接受了布道。但他的心智在没有证据的情况下接受了信仰，却遭到了其企图证明一切并强迫遵循辩证法之规的异教理性（рассудок）的反对。你可看见了父与子之间的分裂，他们为基督和布道彼此相争吗？


        你可以称思想（мысль）为母亲和婆婆，称情感（чувство）为女儿和儿媳。在他们之间，也因基督的缘故而产生了争战。思想有时会与情感为敌，此时思想会劝说人们看重那不朽坏的，胜过那朽坏的；看重那不可见的，胜过那可见的，并且对此有许多强有力的证明。


        有时争战也会从情感一方指向思想。因为情感在信仰中受奇迹和可见的征兆所引导，它不被思想的论证所说服，也不愿跟随那些异教的证明，这些证明催使那些听从它们的人，不相信上帝成了人，或不相信童贞女——生了子。那些把自然奉为神明的异教徒，他们的推论就是如此愚蠢。与此同时，情感通过可见的奇迹，比一切证明都更能引人认识上帝。


        因此，并非一切和平与和谐都是善，但有时，仇恨和分裂在某些人看来，却是某种神圣的作为。所以，任何人都不应与邪恶之人保持友谊，即便是父亲和母亲，如果他们成了基督律法的反对者，那么也应当将他们视为真理的敌人，与他们为敌。'
  - type: paragraph
    initial:
      ru: 'Лк 12:54. '
      cn: （路加福音 12:54）
    text:
      ru: 'Сказал же и народу: когда вы видите облако, поднимающееся с запада, тотчас говорите: дождь будет, и бывает так;'
      cn: 彼向民曰、时见云西起、尔等即言将雨、果有之、
  - type: paragraph
    initial:
      ru: 'Лк 12:55. '
      cn: （路加福音 12:55）
    text:
      ru: 'и когда дует южный ветер, говорите: зной будет, и бывает.'
      cn: 时见风南吹、尔等则言将暑、亦有之、
  - type: paragraph
    initial:
      ru: 'Лк 12:56. '
      cn: （路加福音 12:56）
    text:
      ru: Лицемеры! лице земли и неба распознавать умеете, как же времени сего не узнаете?
      cn: 伪善者欤、尔等别识天地之面、何不能别此时乎、
  - type: paragraph
    initial:
      ru: 'Лк 12:57. '
      cn: （路加福音 12:57）
    text:
      ru: Зачем же вы и по самим себе не судите, чему быть должно?
      cn: 且尔等何不依己判断所宜者乎、
  - type: paragraph
    text:
      ru: Поскольку Господь вел речь о проповеди и наименовал ее огнем и мечом, то очень вероятно, что слушатели, не понимая значения слов Его, смутились. Поэтому Он говорит; как перемены в воздухе вы распознаете по некоторым признакам, так и Мое пришествие вам должно было признать из того, что Я говорю и что делаю. Мои слова, подобно как и дела, показывают во Мне противника вашего. Ибо вы – мытари и похитители, а Я не имею,«где... голову... приклонить»(Лк. 9, 58). Поэтому как по туче вы предвозвещаете дождь и по южному ветру – жаркий день, так следовало вам распознать и время Моего пришествия и догадаться, что Я пришел не мир дать, но дождь и смущение. Ибо Я и Сам есмь облако, и иду с запада, то есть человеческой природы, которая прежде унизилась и была в густом мраке от греха. Пришел Я и огонь низвести, и сделал жаркий день. Ибо Я есмь юг – теплый ветер и противоположен холодности севера. Поэтому и явился Я из Вифлеема, который лежит к югу.
      cn: 既然主耶稣所讲的是关于传道的事，并且将它称作火和刀剑，那么听者很可能因为不理解祂话语的含义而感到困惑不安。因此，祂说：你们如何根据某些迹象来辨认空气中的变化，同样，你们也本应根据我所说、所做之事来认出我的来临。我的言语，正如我的作为一样，显明我是你们的反对者。因为你们是税吏和掠夺者，而我却无，「可以枕头的地方」（路加福音 9:58）。因此，正如你们凭借乌云预报降雨，凭借南风预报炎热之日，你们也本该认出我来临的时日，并猜测到我来，不是要赐下和平，而是要降下雨水和骚动。因为我本身就是云，并且我来自西方，即来自人性，这人性先前曾被贬抑，并因罪而处于浓厚的黑暗之中。我来，也是要降下火，并造就炎热之日。因为我就是南方——温暖的风，与北方的寒冷相对立。因此，我也显现于伯利恒，伯利恒正是位于南方。
  - type: paragraph
    initial:
      ru: 'Лк 12:58. '
      cn: （路加福音 12:58）
    text:
      ru: Когда ты идешь с соперником своим к начальству, то на дороге постарайся освободиться от него,
      cn: 尔偕讼尔者往就有司时、在途间当勉力求释、恐拽尔就判官、判官将付尔于隶、隶下尔于牢狱、
  - type: paragraph
    text:
      ru: 'Сказав это, Господь преподает им учение и о достохвальном мире. Указав похвальное разделение, показывает и мир беспорочный. Именно говорит: когда соперник повлечет тебя в судилище, то еще на дороге всячески постарайся разделаться с ним. Или иначе:«постарайся освободиться»разумеется в таком смысле, что хотя бы ты и ничего не имел, но возьми взаймы под проценты и«постарайся освободиться», чтобы тебе разделаться с ним.'
      cn: 主说了这话，也向他们传授关于那值得称颂的平安的教义。祂指明了值得称赞的分别（或：分别心），也指出了无瑕疵的平安。祂明确地说：当你的对头将你拖入法庭时，那么还在路上时，你就要竭尽全力地与他了结。或者以另一种方式理解：「设法挣脱」（此处的理解是），即使你一无所有，也要以计息的方式借贷，并「设法挣脱」，好使你与他对头了结。
  - type: paragraph
    text:
      ru: чтобы он не привел тебя к судье, а судья не отдал тебя истязателю, а истязатель не вверг тебя в темницу.
      cn: 「恐怕他把你带到判官那里，判官又把你交给拷问者，拷问者又把你投入监牢。」
  - type: paragraph
    initial:
      ru: 'Лк 12:59. '
      cn: （路加福音 12:59）
    text:
      ru: 'Сказываю тебе: не выйдешь оттуда, пока не отдашь и последней полушки.'
      cn: 我告尔、毫厘未偿、断不得出于彼也、
  - type: paragraph
    text:
      ru: Господь говорит это с тем, чтобы оплотяневших привести в страх и побудить к миру. Он знает, что страх убытка и наказаний всего более смиряет оземленевших, поэтому и говорит это.
      cn: 主讲这番话，是为了使属肉体之人心生畏惧，并促使他们和睦（或「趋向和平」）。祂深知，损失与惩罚的恐惧，对沉溺于世俗之人最具约束力，因此祂才如此言说。
  - type: paragraph
    text:
      ru: Разумеют эту речь и о диаволе. Ибо он есть соперник наш. Поэтому мы, будучи еще«на дороге»,то есть в этой жизни, должны постараться, через упражнение в добродетели,«освободиться от него»и ничего не иметь с ним общего, чтобы на будущем суде он не предал нас Судии. Ибо самые дела его, которые мы здесь совершали, предадут нас суду, а Судия отдаст нас истязателю, то есть какой-нибудь мучительной и злотворной силе, и будет наказывать нас до тех пор, пока не получим должное и за последние грехи и не исполним меру наказания. А так как мера наказания никогда не исполнится, то мы будем вечно мучиться. Ибо если будем в темнице до тех пор, пока не заплатим и последней полушки, а заплатить ее мы никогда не будем иметь возможности, то очевидно, что казнь будет вечная.
      cn: 人们亦将此言理解为关乎魔鬼。因其乃我等之仇敌。是以，我等尚在「路上」，亦即尚在这现世生命之中时，就当努力，通过在德行中的操练，以期「摆脱他」，并与他毫无瓜葛，以免在未来的审判中，他将我等交于审判者。因为我等在此世所行的、他（魔鬼）的那些作为，会把我等交付审判，而审判者会将我等交给追讨者，亦即某种苦痛且作恶的力量，并会惩罚我等，直至我等为最细微的罪孽受了应得之罚，并受尽刑罚的尺度。又因刑罚的尺度永不会被圆满（受尽），故我等将永受苦难。因为倘若我等滞留狱中，直至付清了最后半文钱，而我等又将永无能力付清它，那么显然，刑罚将是永恒的。
- type: heading1
  text:
    ru: Глава тринадцатая
    cn: 第十三章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 13:1. '
      cn: （路加福音 13:1）
    text:
      ru: В это время пришли некоторые и рассказали Ему о Галилеянах, которых кровь Пилат смешал с жертвами их.
      cn: 〇维时、有数人来至告彼、谓戛利列亚人、被批剌特以其血搀合于其祭物、
  - type: paragraph
    text:
      ru: Иуда галилеянин, о котором тот же самый евангелист упоминает и в Деяниях (Деян. 5, 37), будучи сам сведущ в Законе, убедил многих и иных галилеян пристать к своему учению. Учил же он тому, что никого из людей, ни даже самого царя, не позволительно именовать господом ни в буквальном смысле, ни в смысле почтения и благоволения. Отсюда многие из них за то, что не называли кесаря господом, жестоко были наказываемы. Они учили еще, что не должно быть приносимо никаких жертв, кроме заповеданных Моисеем; почему они возбраняли жертвоприношения за кесаря и за римский народ. Вероятно, в негодовании на это, Пилат приказал заколоть сих галилеян при тех самых жертвоприношениях за римский народ, которые были ими воспрещаемы. Поэтому кровь их смешалась с кровью жертв. Об этом, как происшедшем из-за благочестия, некоторые доложили Спасителю, желая узнать Его мнение об этом предмете. Ибо некоторые думали, что они пострадали весьма справедливо как грешники, так как они были виновниками возмущения и возбудили в Пилате ненависть к иудеям, ибо их сопротивление называть кесаря господом было простираемо на весь народ иудейский.
      cn: '（路加福音 13:1：〇维时、有数人来至告彼、谓戛利列亚人、被批剌特以其血搀合于其祭物、）


        那位同一位传福音者在《使徒行传》（使徒行传 5:37）中也提及的加利利人犹大，自己精通律法，说服了许多其他的加利利人依附于他的教义。他教导说，不容许称呼任何人为「主」，甚至包括国王本身，不论是在字面意义上，还是在敬意和善意的意义上。因此，他们中的许多人因为不称呼凯撒为「主」而受到了严厉的惩罚。他们还教导说，除了摩西所命令的献祭之外，不应该献上任何祭物；因此，他们禁止为凯撒和罗马民族献祭。可能正是出于对此的愤慨，彼拉多命令在他们所禁止的、为罗马民族献祭的那些祭祀场合中，将这些加利利人宰杀。因此，他们的血与祭物的血混在了一起。有些人将此事作为因虔诚而发生的事情报告给救主，希望了解祂对此事的看法。因为有些人认为他们受苦是罪有应得，因为他们是煽动叛乱的罪魁祸首，并激起了彼拉多对犹太人的仇恨，因为他们抵抗称凯撒为「主」的行为被延伸到了整个犹太民族。'
  - type: paragraph
    initial:
      ru: 'Лк 13:2. '
      cn: （路加福音 13:2）
    text:
      ru: 'Иисус сказал им на это: думаете ли вы, что эти Галилеяне были грешнее всех Галилеян, что так пострадали?'
      cn: 伊伊稣斯对之曰、尔等以为此戛利列亚人较众戛利列亚人更有罪者、故受此害乎、
  - type: paragraph
    initial:
      ru: 'Лк 13:3. '
      cn: （路加福音 13:3）
    text:
      ru: Нет, говорю вам, но, если не покаетесь, все та́к же погибнете.
      cn: 非也、我告尔等、若尔曹不悔改、亦必如是灭亡、
  - type: paragraph
    text:
      ru: Спаситель не отрицает того, что они грешны, но не говорит и того, что они пострадали так потому, что грешнее прочих, непострадавших. Но если и вы не покаетесь, если не перестанете возмущать и возжигать внутренние междоусобия и не поспешите умилостивить Бога делами, то подвергнетесь еще худшей участи. Ибо не следует под предлогом благочестия снискивать себе славу, и между тем возбуждать внутренние мятежи.
      cn: 救主并不否认他们是有罪的，但他也没有说，他们遭受如此痛苦，是因为他们比那些未受苦的人更加罪孽深重。然而，如果你们也不悔改，如果不停止煽动和点燃内部的纷争（内讧），不急速用行为去取悦（讨好）上帝，那么你们将遭受更糟糕的境遇。因为不应该假借虔敬之名去为自己博取名声，同时却去煽动内部的叛乱。
  - type: paragraph
    initial:
      ru: 'Лк 13:4. '
      cn: （路加福音 13:4）
    text:
      ru: Или думаете ли, что те восемнадцать человек, на которых упала башня Силоамская и побила их, виновнее были всех, живущих в Иерусалиме?
      cn: 昔锡罗阿木楼倾覆、压毙十八人、尔等以为斯人较诸居于耶鲁萨利木者、更为有负债乎、
  - type: paragraph
    initial:
      ru: 'Лк 13:5. '
      cn: （路加福音 13:5）
    text:
      ru: Нет, говорю вам, но, если не покаетесь, все та́к же погибнете.
      cn: 非也、我告尔等、若尔曹不悔改、亦将如是灭亡、
  - type: paragraph
    text:
      ru: Башня, упавшая в Силоаме, была предуказанием на то, что имело впоследствии случиться с этим народом. Примером немногих, тогда погибших, она вразумляла многих, что и они потерпят большое зло. Ибо башня служила предызображением целого города, а те погибшие восемнадцать человек – целого народа. Действительно, когда город пал от Тита, тогда вместе с ним погиб и весь народ, упорный в неверии. Это должно быть для нас уроком при всех ежедневных случаях. Если некоторые падают, тогда как мы остаемся без искушений, то сие не должно служить для нас поводом к совершенной беззаботливости, будто бы мы остаемся без искушений потому, что праведны, а напротив, мы должны более вразумляться, потому они наказываются, чтобы мы улучшились; если ж мы не исправимся, то горе наше будет больше.
      cn: 西罗亚（Силоам）倒塌的塔楼，乃是事先指明了后来将要发生在这个民族身上的事情。它藉着当时少数几个死者的事例，来警戒许多人，他们也将遭受大祸。因为那座塔楼预先描绘着整个城市，而那十八个死者则预示着整个民族。确实，当这座城被提图斯（Тит）攻陷时，整个执迷于不信的民族也随之灭亡了。这应当成为我们在所有日常事件中的一个教训。如果有些人跌倒了，而我们却仍未遭遇试探，那么这不应当成为我们完全漠不关心的理由，仿佛我们未遭遇试探是因为我们是义人；恰恰相反，我们应当更加受警戒，因为惩罚他们是为了让我们得以改善；若是我们不改正，那么我们的苦难将会更大。
  - type: paragraph
    initial:
      ru: 'Лк 13:6. '
      cn: （路加福音 13:6）
    text:
      ru: 'И сказал сию притчу: некто имел в винограднике своем посаженную смоковницу, и пришел искать плода на ней, и не нашел;'
      cn: 彼又言譬喻曰、一人有无花果树、植于其葡萄园、来由其上求果而不得、
  - type: paragraph
    text:
      ru: Согласно с ходом речи приводит притчу сию. Перед этим Он сказал:«есливыне покаетесь...топогибнете». Теперь, кстати присовокупляет притчу сию. Смоковница есть народ иудейский, производящий одни только горькие листья, а плодов не приносящий. Стоял он в винограднике Божием, то есть в церкви иудейской. Домовладыка – Христос – приходил и искал (в иудеях) плода веры и добрых дел, но не нашел.
      cn: '按照这番言辞的进展，他提出了这个比喻。在这之前他曾说过：「如果你们不悔改……你们都将灭亡」。现在，他很恰当地附加了这个比喻。


        无花果树就是犹太民族，它只长出苦涩的叶子，却不结果子。它矗立在上帝的葡萄园里，也就是在犹太教会中。


        家主——基督——前来并在（犹太人中）寻找信德与善行的果实，但他没有找到。'
  - type: paragraph
    initial:
      ru: 'Лк 13:7. '
      cn: （路加福音 13:7）
    text:
      ru: 'и сказал виноградарю: вот, я третий год прихожу искать плода на этой смоковнице и не нахожу; сруби ее: на что она и землю занимает?'
      cn: 语园丁曰、顾、我三年来由此无花果树求果、亦不得、伐之、何为任其占此土乎、
  - type: paragraph
    text:
      ru: 'Приходил Он по три срока: раз – через Моисея, в другой – через пророков, а в третий – Сам лично.'
      cn: 祂降临了三次：第一次——借着摩西；第二次——借着先知们；而第三次——祂亲自。
  - type: paragraph
    initial:
      ru: 'Лк 13:8. '
      cn: （路加福音 13:8）
    text:
      ru: 'Но он сказал ему в ответ: господин! оставь ее и на этот год, пока я окопаю ее и обложу навозом, –'
      cn: 彼答之曰、主欤、今岁姑容之、待我周掘培粪
  - type: paragraph
    initial:
      ru: 'Лк 13:9. '
      cn: （路加福音 13:9）
    text:
      ru: не принесет ли плода; если же нет, то в следующийгодсрубишь ее.
      cn: 或其可结果、否、则明年伐之、
  - type: paragraph
    text:
      ru: Наконец, поскольку, несмотря на все это, иудеи не покаялись, Христос отсек их от любви Божией. Ибо они уже не называются народом Господним и людьми святыми, но вместо их введены язычники, могущие приносить плод (Мф. 21, 43).
      cn: 最后，鉴于所有这一切，犹太人仍未悔改，基督就将他们从上帝的爱中斩断（离弃）。因为他们不再被称为主的百姓和圣洁的人民，取而代之，那些能够结果子的外邦人已被引介进来（马太福音 21:43）。
  - type: paragraph
    text:
      ru: 'Под смоковницей можно разуметь и все человечество: под домовладыкой – Бога Отца; под виноградарем – Сына Божия, явившегося во плоти для того, чтоб приложить попечение и очистить наш виноградник. Христос не позволяет срубить эту смоковницу как бесплодную, говоря Отцу:«оставь ее и на этот год». Если (люди) не улучшились чрез Закон и пророков и не принесли плода покаяния, то Я еще напою их Своим учением и страданиями, и, может быть, они принесут плод благопокорности. Если ж смоковница не принесет плода, то после срубишь ее, отвергнув их от участи праведных. По три раза Бог искал плода в роде нашем (человеческом), и (трижды) он не дал: в первый раз, когда мы преступили заповедь в раю (Быт. 3, 12–13); в другой, когда во время законодательства слили тельца (Исх. 32, 2–4) и славу Бога променяли«на изображение вола, ядущего траву»(Пс. 105, 20); в третий, когда испрашивали (на распятие) Спасителя и Господа, говоря:«нет у нас царя, кроме кесаря»(Ин. 19, 15).'
      cn: 在无花果树之下，我们可以理解为整个人类：在家主之下——是父神；在葡萄园丁之下——是上帝之子，祂道成肉身显现，为要照料和洁净我们的葡萄园。基督不允许砍伐这棵不结果子的无花果树，祂对父说：「留它在这一年。」如果（人们）没有通过律法和先知而改善，没有结出悔改的果子，那么我将用我的教导和苦难再次浇灌他们，或许他们会结出顺服（благопокорности）的果子。如果这棵无花果树仍不结果子，那么之后你将砍伐它，将他们从义人的份中摒弃。上帝三次在我们的族类（人类）中寻找果子，而（三次）它都没有结出：第一次，当我们违背了在乐园中的诫命（创世记 3:12-13）；第二次，当我们在立法时期铸造了牛犊（出埃及记 32:2-4），并将上帝的荣耀换成了「吃草之牛的像」（诗篇 105:20）；第三次，当我们求取（将之钉上十字架）救主和主，说：「除了凯撒，我们没有王」（伊鄂昂福音 19:15）。
  - type: paragraph
    text:
      ru: 'И каждый из нас в частности есть смоковница, посаженная в винограднике Божием, то есть в Церкви или, просто сказать, в здешнем мире. Бог приходит искать плода, и если находит тебя бесплодным, повелевает тебя исторгнуть из здешней жизни. Но виноградарь может пощадить. Кто же этот виноградарь? Или Ангел хранитель каждого, или и сам человек. Ибо каждый сам для себя есть виноградарь. Часто, подвергшись смертной болезни или иным опасностям, мы говорим: Господи! Оставь и на этот год, и мы покаемся. Ибо это означает окопать и обложить навозом. Душа окапывается, когда она оттрясает с себя пыль житейских забот и делается легкой. Она облагается навозом, то есть теплотой жизни бесславной и всеми презираемой. Ибо когда кто для спасения души оставляет славу и решается на жизнь бесславную, тогда это называется обложить душу навозом, чтобы она принесла плод. Если принесем плод, то хорошо; а если нет, то Господь не оставит уже нас в Своем винограднике, но исторгает из здешнего мира, чтобы мы не занимали напрасно места. И кто видит грешника долго живущим, тот сам портится и делается хуже, и таким образом оказывается, что грешник сам не приносит плода, да препятствует другому, который мог бы принести плод. Если же он будет исторгнут из здешней жизни, то видевшие посечение его, может быть, придут в чувство, переменятся и плод принесут.'
      cn: 我们每一个人，具体而言，都是一棵被栽种在上帝葡萄园里的无花果树，也就是说，在教会里，或者，简单地说，在这个现世的世界里。上帝来寻找果子，倘若发现你没有结果子，他便命令将你从这个现世的生命中拔除。但是，葡萄园的工人可能会宽恕。那么，这位葡萄园的工人是谁呢？他或是每个人的护守天使，或是人他自己。因为每个人都是自己的葡萄园工人。我们经常在遭遇致命疾病或其它危险时说：主啊！请把我也留到今年，我们会悔改的。因为这正是「周围掘土、并施上粪」的意思。灵魂被周围掘土，是指当它抖落了世俗忧虑的尘埃，变得轻盈。它被施上粪，也就是说，被施以没有荣耀、并被所有人鄙视的生活的热度。因为当一个人为了灵魂的救恩而放弃荣耀，决定过一种没有荣耀的生活时，这就被称为给灵魂施上粪，以便它能结果子。如果我们能结果子，那很好；但如果没有，主将不再把我们留在他的葡萄园里，而是将我们从这个现世的世界中拔除，以免我们白白地占据地方。那些看见罪人活得长久的人，他自己也会败坏，变得更坏，这样就表明，罪人自己不结果子，还妨碍了本可以结果子的另一个人。然而，如果他被从这个现世的生命中拔除，那些看到他被砍伐的人，也许会醒悟过来，改变自己，并结出果子。
  - type: paragraph
    text:
      ru: 'Говорится, что домохозяин приходил к смоковнице по три года, может быть, потому, что нам даны три Закона, через кои Господь к нам приходит, именно: естественный, Моисеев и духовный. Нам следовало приносить плод и при руководстве естественного закона, ибо природа сама по себе научает должному. Но поскольку Господь нашел естественный закон бездейственным в нас, то в помощь естественному Он дал Моисеев Закон. Когда же и сей оказался бесполезным по нашему нерадению, Он дал Закон духовный. Итак, чьей души не улучшат эти три закона, кто не может улучшиться, несмотря на долголетие и человеколюбие, тот уже не оставляется на дальнейшее время, поскольку Бог не может обманываться отсрочками.'
      cn: 据说，家主三年来到无花果树那里，或许是因为有三部律法赐予了我们，主借此来到我们这里，即：自然律、摩西律和属灵律。在自然律的指引下，我们也应该结出果实，因为本性本身就教导了我们该当之事。但因为主发现自然律在我们里面是无效的，所以他为了帮助自然律，赐下了摩西律。而当此律因我们的疏忽而证明也无益时，他又赐下了属灵律。因此，这三部律法都未能改善其灵魂的人，即便有长寿和神对人的仁爱（human-loving kindness），也无法得到改善的人，就不再被留待更长的时间了，因为上帝不能被延期所欺哄。
  - type: paragraph
    text:
      ru: 'Разумей, пожалуй, под тремя годами и три состояния возрастов: отрочество, или юность, которая считается до восемнадцати лет, мужество и состояние тех, кои начинают уже седеть. Поэтому, если мы и на старости, в этот третий год, не принесем плодов и если нам еще попущено будет жить, чтобы обложить себя навозом, чрез восприятие бесславной жизни ради Христа, а мы и опять солжем, тогда Господь уже не пощадит нас, но срубит, чтобы мы не занимали землю напрасно и притом с вредом для других. И это изъяснение мне кажется более близким к предлежащей цели.'
      cn: 理解，请将那三年视为三种年龄状态：幼年期，或青少年期（被算作到十八岁为止），成年期，以及那些开始变白发的人的状态。因此，即使我们年迈，在这第三年，仍未结出果实，并且即使我们被容许继续活着，借着为了基督而接受那无荣耀的生活，以「将自己覆盖在粪肥之下」，而我们又一次食言，那么主就不会再宽恕我们，而会砍伐我们，以免我们白白地占用土地，并且对他人造成损害。而这种解释对我而言，似乎更贴近所设定的目标。
  - type: paragraph
    initial:
      ru: 'Лк 13:10. '
      cn: （路加福音 13:10）
    text:
      ru: В одной из синагог учил Он в субботу.
      cn: 〇于安息日、彼在一会堂教训、
  - type: paragraph
    initial:
      ru: 'Лк 13:11. '
      cn: （路加福音 13:11）
    text:
      ru: Там была женщина, восемнадцать лет имевшая духа немощи; она была скорчена и не могла выпрямиться.
      cn: 顾一妇有病魔十八年、伛偻绝不能伸、
  - type: paragraph
    text:
      ru: Недуг этот с упоминаемой женщиной случился по насилию диавольскому, как и Господь говорит:«которую связал сатана вот уже восемнадцать лет»(Лк. 13, 16). Быть может, сатана мучил ее потому, что она оставлена была Богом за какие-нибудь преступления, ибо он, когда попущается ему свыше от Бога, причиняет всевозможные неприятности телам людей (Иов. 2, 6–7). Он и в начале был виновником того, что мы лишились нетления, в котором были созданы (Прем. 2, 23), и что мы соединены теперь с телом болезненным и способным к недугам. Ибо мы это разумеем под кожаными ризами (Быт. 3, 21).
      cn: 这一疾病发生在被提及的妇人身上，是由于魔鬼的强暴所致，正如主所说：「撒但捆绑了她这十八年」（路加福音 13:16）。撒但折磨她，或许是因为她因某些过犯而被上帝离弃了，因为当魔鬼被允准自上方、从上帝那里得许时，它会给人的身体带来各种各样的不适（约伯记 2:6-7）。起初，它也是导致我们失去那被造时的不朽坏（智慧篇 2:23），以及我们现今与这多病、易患不适的身体结合在一起的罪魁祸首。因为我们正是将此理解为「皮子衣服」（创世记 3:21）。
  - type: paragraph
    initial:
      ru: 'Лк 13:12. '
      cn: （路加福音 13:12）
    text:
      ru: 'Иисус, увидев ее, подозвал и сказал ей: женщина! ты освобождаешься от недуга твоего.'
      cn: 伊伊稣斯见之呼曰、妇欤、尔脱释尔之病矣、
  - type: paragraph
    initial:
      ru: 'Лк 13:13. '
      cn: （路加福音 13:13）
    text:
      ru: И возложил на нее руки, и она тотчас выпрямилась и стала славить Бога.
      cn: 遂以手按之、即伸、伊荣光上帝、
  - type: paragraph
    text:
      ru: Господь самым богоприличным и полновластным повелением прогоняет болезнь этой женщины и возлагает на нее руки, чтобы мы познали, что силу и действие Слова носила эта святая плоть. Ибо она была собственная Его плоть, а не другого кого, существующего отдельно от Него и собственнолично, как представляется нечестивому Несторию. Такова благость Господа, и так Он помиловал создание Свое!
      cn: 主以最合乎神性和全权威严的命令驱逐了这妇人的病症，并按手在她身上，好让我们认识到，圣言的力量和功用是由这圣洁的肉身所承载的。因为这肉身是祂自己的肉身，而非属于那与祂分离且拥有自身位格的某位（如那不虔敬的聂斯脱利所设想的那样）。主的良善即是如此，祂就是这样怜悯了祂的受造物！
  - type: paragraph
    initial:
      ru: 'Лк 13:14. '
      cn: （路加福音 13:14）
    text:
      ru: 'При этом начальник синагоги, негодуя, что Иисус исцелил в субботу, сказал народу: есть шесть дней, в которые должно делать; в те и приходи́те исцеляться, а не в день субботний.'
      cn: 宰会堂者愠之、因伊伊稣斯于安息日医之、对民曰、有六日在其间乃当工作、故于此可来受医、然非于安息日也、
  - type: paragraph
    initial:
      ru: 'Лк 13:15. '
      cn: （路加福音 13:15）
    text:
      ru: 'Господь сказал ему в ответ: лицемер! не отвязывает ли каждый из вас вола своего или осла от яслей в субботу и не ведет ли поить?'
      cn: 主答之曰、伪善者欤、尔曹于安息日孰不解牛或驴于槽、而牵以饮之乎、
  - type: paragraph
    text:
      ru: А сатана, сначала связавший женщину, в досаде на ее освобождение, так как он еще более зла желал причинить ей, связывает завистью начальника синагоги и его устами хулит чудо. Так он везде противится добру! Сей негодует на то, что исцеление совершено в субботу, но Господь обличает его прекрасным примером неразумных животных.
      cn: 然而，撒但，起初捆绑了这妇人，因她得蒙释放而恼怒，因为他本想加诸她更多恶事，于是又以嫉妒捆绑了会堂的监督，并借他的口亵渎了这神迹。他是如此处处抵挡善行！此人愤慨于医治是在安息日完成的，但主用一个关于不理性动物的美好例子来责备了他。
  - type: paragraph
    initial:
      ru: 'Лк 13:16. '
      cn: （路加福音 13:16）
    text:
      ru: сию же дочь Авраамову, которую связал сатана вот уже восемнадцать лет, не надлежало ли освободить от уз сих в день субботний?
      cn: 况此阿乌拉阿木之女、萨他那系之已十八年、不当于安息日解其此结乎、
  - type: paragraph
    initial:
      ru: 'Лк 13:17. '
      cn: （路加福音 13:17）
    text:
      ru: И когда говорил Он это, все противившиеся Ему стыдились; и весь народ радовался о всех славных делах Его.
      cn: 彼言此时、诸敌之者皆羞愧、众民为彼所行荣光之事而喜乐、
  - type: paragraph
    text:
      ru: Поэтому не только он, но и все прочие,«противившиесяИисусу,стыдились»при таких словах Его. Ибо очень неразумно было возбранять исцеление человека в субботу потому, что будто бы в субботу предписано хранить бездействие. Итак, противившиеся Иисусу стыдились этих слов Его, а«народ радовался о... делах Его». Тогда как те не радовались о делах, но растаивали завистью при чудесах Христовых, народ, получая пользу от знамений, пользуясь исцелениями, радовался.
      cn: '因此，不单单是他，所有其他「反对耶稣的人，都因祂的这些话而羞愧」。因为，仅凭着在安息日被命令须持守无所作为（保持静止）这一点，就去禁止一个人在安息日得到医治，是非常不合情理的。


        因此，那些反对耶稣的人，因祂的这些话而感到羞愧，而「民众则为...祂的作为而欢喜」。正当那些人不对祂的作为感到欢喜，反而在基督的神迹面前因着嫉妒而消融时，民众却从这些异兆中得益，因着享受了这些医治而欢喜。'
  - type: paragraph
    text:
      ru: 'Понимай, пожалуй, чудеса эти и относительно внутреннего человека. Ибо душа бывает скорчена, когда она склоняется к заботам только о житейском и не помышляет ни о чем небесном или божественном. Почему и говорится, что она болеет восемнадцать лет. Ибо кто погрешает в соблюдении заповедей Закона Божия, которых «десять», и слаб в уповании на «восьмой» век (книга 2, глава 1) скорчен восемнадцать лет. Ужели не скорчен тот, кто, будучи привязан к земле и постоянно согрешая, нарушает заповеди и не принимает будущего века? Но Господь исцеляет такую душу в субботу и в синагоге. Ибо когда кто соберет в себе помыслы исповедания (ибо Иуда означает исповедание) и будет хранить (субботу), то есть бездействие во зле, тогда Иисус исцеляет его не словом только, говоря ему: освобожден ты от недуга своего, но и возложением рук.'
      cn: '请领会（此等）奇迹亦是相对于内在之人而言。因为灵魂在仅倾向于对世俗事务的担忧、而从未思及任何属天或神圣之事时，便会蜷曲。因此，经文亦言，她患病十八年。因为凡在遵守上帝律法（该律法有「十」条诫命）时犯错之人，且在对「第八」个世代（书 2，章 1）的盼望上软弱之人，便蜷曲了十八年。那被束缚于尘土、持续犯罪、违背诫命、且不接受未来世代之人，难道不是蜷曲的吗？


        但主在安息日和会堂里医治了这样的灵魂。因为当有人在自己里面汇集了认罪（因犹大意为认罪）的思念，且遵守（安息日），即在邪恶中处于不作为状态时，耶稣便医治了他，不仅是用言语，对他说：你脱离了你的疾病，而且也是藉着按手。'
  - type: paragraph
    initial:
      ru: 'Лк 13:18. '
      cn: （路加福音 13:18）
    text:
      ru: 'Он же сказал: чему подобно Царствие Божие? и чему уподоблю его?'
      cn: 〇彼曰、上帝之国何所似、我将何以譬喻之
  - type: paragraph
    initial:
      ru: 'Лк 13:19. '
      cn: （路加福音 13:19）
    text:
      ru: Оно подобно зерну горчичному, которое, взяв, человек посадил в саду своем; и выросло, и стало большим деревом, и птицы небесные укрывались в ветвях его.
      cn: 有如一粒芥种、人取之而种于园、长而成为大树、天空之飞鸟栖于其枝、
  - type: paragraph
    text:
      ru: «Зерну горчичному»уподобляется Царствие Божие. А Царствие Божие есть учение и проповедь, ибо через проповедь воцарилось оно в душах человеческих. Как горчица на вид мала, а силы имеет много, так и учение евангельское многие презирают и считают глупостью, но если человек примет оное и посадит«в саду своем», то есть в своей душе, то оно дает большое и ветвистое дерево, и«птицы небесные», то есть люди, желающие парить к горнему,«укрываются в ветвях его». Ибо возвышающиеся над земным успокаиваются в ветвях проповеди, то есть в пространных помыслах. Например, Павел принял зерно, небольшое оглашение от Анании, но, посадив это зерно в удобренном своем саду, произвел ветви, то есть обильное и доброе учение (Деян. 9, 17–22) и послания, в коих укрывались высокие по уму и мудрости не в тогдашнее только время, каковы – коринфяне, Дионисий, Иерофей и очень многие другие, но и жившие во все времена.
      cn: 「芥菜种」被比拟作上帝之国。而上帝之国就是教义和宣讲，因为它借由宣讲而在人类的灵魂中为王。正如芥菜在外表上微小，却拥有很大的力量，同样，福音的教义许多人也予以鄙视并视作愚蠢。但如果一个人接受了它，并将它种在「自己的园子」里，亦即在他的灵魂里，它就会结出大而枝桠繁茂的树，「天空之飞鸟」，即那些渴望向至高之处高飞的人们，「栖于其枝」。因为那些超乎属世之物的人，在宣讲的枝桠中，亦即在广阔的思想中，获得安息。例如，保罗接受了那芥种，即来自亚拿尼亚的简短的宣讲（оглашение），但他将这芥种种在他那受过施肥的园子中，便生出了枝桠，亦即丰盛而美好的教义（使徒行传 9:17-22）和书信，在这些书信中，那些心智与智慧高超的人们，不仅在当时（比如哥林多人、丢尼修、希罗瑟乌斯以及许多其他的人），而且是所有时代的人们，都得以栖身。
  - type: paragraph
    text:
      ru: Под зерном горчичным можно разуметь и Самого Господа. По-видимому, Он как Сын плотника и весьма бедный был не велик. Но когда Он упал в сердце земли, чрез смерть и погребение во гробе (Ин. 12, 24), тогда Он произрастил прекрасные ветви – апостолов, под коими успокаиваются все те, кои прежде колебались всяким ветром заблуждения, например, язычники, подобные птицам по причине удобопреклонности их ума в какую ни есть сторону, способности к обольщению и по причине большого легкомыслия. Ибо все таковые заблуждающиеся подобны птицам небесным, то есть воздушным.
      cn: 「芥菜种」可以理解为指代主耶稣基督本人。从表面上看，作为木匠的儿子，祂非常贫穷，算不得伟大。但当祂藉着死亡和安葬于坟墓（伊鄂昂福音 12:24）而「落在」地的心中时，祂就生长出了美好的枝条——使徒们。在这些枝条之下，那些先前被各种谬误之风所动摇的人们，得以休憩，例如：外邦人。他们因心志易于偏向任何一方，易受诱惑，且因其极大的轻浮，而如同飞鸟。因为所有此类迷失者都类似于天上的飞鸟，也就是空中的飞鸟。
  - type: paragraph
    initial:
      ru: 'Лк 13:20. '
      cn: （路加福音 13:20）
    text:
      ru: 'Ещё сказал: чему уподоблю Царствие Божие?'
      cn: 又曰、我将何以譬上帝之国、
  - type: paragraph
    initial:
      ru: 'Лк 13:21. '
      cn: （路加福音 13:21）
    text:
      ru: Оно подобно закваске, которую женщина, взяв, положила в три меры муки, доколе не вскисло всё.
      cn: 有如酵、妇人取而纳于三斗面中、以致均起发焉、
  - type: paragraph
    text:
      ru: Божественное учение«подобноещезакваске, которую, взяв,... женщина», то есть человеческая природа,«положила в три меры муки», то есть в тело, душу и дух, так что все освятилось, как говорит блаженный Павел (1Тим. 4, 5), и стало одним тестом чрез общение с Духом Святым.
      cn: 神圣教导（Божественное учение）「有如酵、妇人取而纳于（подобное еще закваске, которую, взяв,... женщина）」——即人性（человеческая природа）——「三斗面中（положила в три меры муки）」，即身体（тело）、魂（душу）和灵（дух）之中，以致一切都被圣化了，正如蒙福的保罗所言（提摩太前书 4:5），并藉着与圣灵的共融，成为了一个面团（одним тестом）。
  - type: paragraph
    text:
      ru: 'Под женщиной можешь разуметь душу, под тремя мерами – три ее силы: разум, сердце и волю. Кто в эти силы сокроет слово Божие, тот сделает оные совершенно духовными, так что ни разум не будет сомневаться в учении, ни сердце и воля не будут стремиться к неразумному, но вскиснут и уподобятся Слову Божию.'
      cn: '在妇人之下，你可以领会（即理解）为灵魂；在三斗面之下，则可领会为灵魂的三种能力：理性（разум）、心灵（сердце）和意志（волю）。


        谁将上帝的圣言珍藏于这些能力之中，谁就能使它们彻底地属灵化。如此一来，理性就不会对教导有所怀疑，心灵和意志也不会倾向于不理性的事物，而是会被发酵，并与上帝的圣言相似。'
  - type: paragraph
    initial:
      ru: 'Лк 13:22. '
      cn: （路加福音 13:22）
    text:
      ru: И проходил по городам и селениям, уча и направляя путь к Иерусалиму.
      cn: 彼经行诸城诸村教训、向耶鲁萨利木而行、
  - type: paragraph
    text:
      ru: Иисус«проходилс учениемпо городам и селениям». Не ходил Он по одним малым селениям, с нерадением о городах, как делают желающие обольщать простейших, не ходил по одним городам, с нерадением о малых селениях, как поступают желающие показать себя и достигнуть славы, но обходил повсюду, как общий Владыка или, лучше, как Отец, промышляющий обо всех. Не ходил ли Он по одним внешним городам, где было не столько искусных в Законе, а Иерусалима избегал, как бы опасаясь обличений со стороны законников или страшась смерти от них? Нельзя сего сказать.«И направляя путь, – сказано, –к Иерусалиму». Ибо где более больных, там более должен находиться и врач (Мф. 9, 12).
      cn: 耶稣「带着教导穿行诸城诸村」。祂并非只在不顾念城市的情况下，穿行于一些小村庄，如同那些意欲欺骗最朴实者的人所行；祂也并非只在不顾念小村庄的情况下，穿行于一些城市，如同那些意欲展现自己并求取荣耀的人所为。而是作为普世的统治者，或者更确切地说，作为眷顾着众人的父亲，祂遍访各处。难道祂只在那些不那么精通律法的外部城市行走，而避开耶路撒冷，仿佛是害怕来自律法师的指责，或是惧怕被他们致死吗？不能这样说。「祂却定意向耶路撒冷走去，」经文如此记载。因为哪里病人更多，医生就更应该待在那里（马太福音 9:12）。
  - type: paragraph
    initial:
      ru: 'Лк 13:23. '
      cn: （路加福音 13:23）
    text:
      ru: 'Некто сказал Ему: Господи! неужели мало спасающихся? Он же сказал им:'
      cn: 有一人语之曰、主欤、得救者、岂寡乎、向彼等曰、
  - type: paragraph
    initial:
      ru: 'Лк 13:24. '
      cn: （路加福音 13:24）
    text:
      ru: подвизайтесь войти сквозь тесные врата, ибо, сказываю вам, многие поищут войти, и не возмогут.
      cn: 尔等竭力进窄门、我告尔等、将有多人求进而不得以至、
  - type: paragraph
    text:
      ru: Спасающихся мало, потому что узкие врата не могут вместить многих.
      cn: 得救者稀少，因为窄门不能容纳许多人。
  - type: paragraph
    initial:
      ru: 'Лк 13:25. '
      cn: （路加福音 13:25）
    text:
      ru: 'Когда хозяин дома встанет и затворит двери, тогда вы, стоя вне, станете стучать в двери и говорить: Господи! Господи! отвори нам; но Он скажет вам в ответ: не знаю вас, откуда вы.'
      cn: 家主起而闭门、尔曹立于外叩门曰、主欤、主欤、为我等启之、彼将应曰、我不识尔等奚自、
  - type: paragraph
    text:
      ru: «Хозяин дома»есть Господь. Он всех людей созывает к насыщению и наслаждению неистощимыми благами. Те, кои рачительны, стараются войти прежде часа самого обеда. А для ленивых и приходящих после часа обеда двери затворяются. Час же обеда что иное, как не жизнь настоящая? Она есть поистине время самое отличное для приготовления к духовному насыщению. Когда Хозяин дома«встанет», то есть воскреснет на суде, и«затворит двери», то есть путь добродетели, по которому нельзя идти по отходе из здешней жизни (ибо путем добродетели мы можем ходить только в здешней жизни), то хотя жившие здесь нерадиво станут«стучатьсяв двери», ибо тогда только с бесполезным покаянием поищут они пути добродетели, призывая оную голыми словами, без дела, как бы какими ударами и стуком; но Хозяин дома, по праву заперев двери, примет вид, что и не знает, откуда они. Справедливо так поступит Он. Потому что они от диавола, а Господь знает Своих (2Тим. 2, 19).
      cn: '「家主」即是主。他召集所有的人来享受永不枯竭的福乐，使其饱足。那些殷勤的人，力求在筵席时间到来之前进入。而对于那些懒惰的、在筵席时间之后才来的人，门就关上了。


        筵席的时间，又是什么呢？不正是今生吗？它确实是为属灵的饱足作准备的最适宜的时间。当家主「站起来」，即在审判中复活，并「关上门」，即关上德行之路——这条路在离开此生之后就不能再走了（因为我们只能在此生行于德行之路）——那时，那些在此世生活懒散的人虽然会「叩门」，因为那时他们只会带着徒劳的懊悔去寻求德行之路，以空洞的言语，而非行动，呼唤它，如同以某种撞击和叩击一般；但家主有权锁上门，并装作不知他们来自何方。他如此行是公义的。因为他们是属于魔鬼的，而主认识属他的人（提摩太后书 2:19）。'
  - type: paragraph
    initial:
      ru: 'Лк 13:26. '
      cn: （路加福音 13:26）
    text:
      ru: 'Тогда станете говорить: мы ели и пили пред Тобою, и на улицах наших учил Ты.'
      cn: 其时尔曹言起曰、我侪曾在尔前饮食、曾在我之街衢教训、
  - type: paragraph
    text:
      ru: Это вообще говорится к израильтянам. Ибо Христос от них по плоти (Рим. 9, 5), и с ними ел и пил.
      cn: 这一般是对以色列人说的。因为基督按着肉身是出自他们（罗马书 9:5），并且与他们一同吃喝。
  - type: paragraph
    text:
      ru: 'Впрочем слова:«мы ели и пили пред Тобою»можно разуметь и в высшем смысле. Совершая законное богослужение и принося Богу кровавые жертвы, (израильтяне) ели и веселились: слушали они в синагогах и чтение книг Божественных. И чрез пророков, без сомнения, Господь же учил. Ибо пророки не свое учение предлагали, но возвещали слово Божие, почему и говорили они:«так говорит Господь»(Ис. 56, 1;Иер. 2, 1, 5;Иез. 3, 27). Итак, иудеям, если они не принимали веры, оправдывающей нечестивого (Рим. 4,5), кровавого богослужения недостаточно было для оправдания. А по моему мнению, это может относиться и к христианам по имени, но нерадивым к жизни. И мы не едим ли Божественное Тело? И не пьем ли Кровь Божию пред Ним, ежедневно приступая к Божественной Трапезе? И не учит ли Господь на улицах – в душах наших? Но (нам не будет) никакой пользы, если мы будем (только) слушателями Божественного Закона, а не исполнителями (Рим. 2, 13). Напротив, слушание послужит для нас причиной больших мук, подобно как и причастие Божественных Тайн поставится в осуждение. Примечай же, что отвержены те на улицах, коих учит Господь. Но если будем иметь Его Учителем не в широких, но в тесных, сокрушенных и истерзанных скорбью сердцах, то не будем отвержены.'
      cn: '然而， 「我们曾在你面前吃喝」这句话，也可以理解为一种更高的意义。在举行合乎律法的敬拜并向神献上血祭时，（以色列人）吃喝并欢欣：他们在会堂里也听取了对神圣书卷的诵读。毫无疑问，上主也通过先知进行教训。因为先知们并非提出自己的教义，而是宣告上帝的圣言，因此他们说：「上主如此说」（以赛亚书 56:1，耶利米书 2:1，5，以西结书 3:27）。因此，如果犹太人没有接受那称不虔敬之人为义的信心（罗马书 4:5），那么流血的敬拜对他们来说，并不足以使他们称义。


        在我看来，这也可以指那些徒有基督徒之名，但对生活却疏忽大意的人。我们岂不是吃了那神圣的身体吗？我们岂不是在他面前喝了那上帝的宝血吗？我们每日亲近那神圣的筵席。上主岂不是在我们的大街上——在我们的灵魂中教训我们吗？但是，如果我们（仅仅）是神圣律法的听者，而不是遵行者（罗马书 2:13），那就毫无益处。相反，聆听将成为我们遭受更大苦楚的原因，正如领受神圣奥秘也会被判定为定罪一样。


        请注意，那些被上主在大街上教训的人，遭到了拒绝。但如果我们拥有他作为教师，不是在宽阔的，而是在狭窄的、破碎的、被悲伤折磨的心中，那么我们就不会被拒绝。'
  - type: paragraph
    initial:
      ru: 'Лк 13:27. '
      cn: （路加福音 13:27）
    text:
      ru: 'Но Он скажет: говорю вам: не знаю вас, откуда вы; отойдите от Меня все делатели неправды.'
      cn: 彼对曰、我告尔等、我不识尔等奚自、尔等凡行不义者皆离我哉、
  - type: paragraph
    initial:
      ru: 'Лк 13:28. '
      cn: （路加福音 13:28）
    text:
      ru: Там будет плач и скрежет зубов, когда увидите Авраама, Исаака и Иакова
      cn: 在彼将哀恸切齿、时、尔等见阿乌拉阿木、伊萨阿克、亚适乌及诸先知、于上帝国中、惟将尔等逐于外、
  - type: paragraph
    text:
      ru: Слова сии приличны как иудеям, к которым Господь говорил оные, так и неверующим последних времен.
      cn: 这些话语既适用于主向其言说的犹太人，也适用于末后的不信者。
  - type: paragraph
    text:
      ru: и всех пророков в Царствии Божием, а себя изгоняемыми вон.
      cn: 以及所有先知在上帝国中，而自己被逐于外。
  - type: paragraph
    initial:
      ru: 'Лк 13:29. '
      cn: （路加福音 13:29）
    text:
      ru: И придут от востока и запада, и севера и юга, и возлягут в Царствии Божием.
      cn: 有自东、自西、自北、自南来、席坐于上帝之国、
  - type: paragraph
    text:
      ru: Ибо иудеям особенно неприятно было слышать, что иные, из язычников, будут покоиться с Авраамом и (другими) предками (их), а они будут изгнаны вон.
      cn: 盖因犹太人听闻，某些出自异邦者的人，将与阿乌拉阿阿木以及（他们的）其他先祖同得安息，而他们将被驱逐在外，这令他们尤其不悦。
  - type: paragraph
    initial:
      ru: 'Лк 13:30. '
      cn: （路加福音 13:30）
    text:
      ru: И вот, есть последние, которые будут первыми, и есть первые, которые будут последними.
      cn: 而顾、有先者将为后、后者将为先也、
  - type: paragraph
    text:
      ru: Идут слова сии к нам, когда мы делаем несообразное с верой. Ибо и мы хвалимся Законом Христовым, но потом попираем его, когда преступаем оный, а потому хотя мы кажемся«первыми», как принявшие Христа и Его учение с самых пеленок, но будем«последними», потому что язычники, уверовавшие при конце своей жизни и богоугодно пожившие в остальное время, будут поставлены выше.
      cn: 这些话语临到我们，当我们所做的与信仰不合时。因为我们夸耀基督的律法，但随后当我们违犯它时，却又践踏它。因此，虽然我们看似是「在前的」（作为自襁褓时期就接受基督及其教导的人），但我们将成为「在后的」。因为那些在生命末期才相信、并在余下的时间里按敬虔的方式度日的外邦人，将被置于更高的地位。
  - type: paragraph
    initial:
      ru: 'Лк 13:31. '
      cn: （路加福音 13:31）
    text:
      ru: 'В тот день пришли некоторые из фарисеев и говорили Ему: выйди и удались отсюда, ибо Ирод хочет убить Тебя.'
      cn: 〇当日自发利些乙中有数人来告之曰、尔出离此、盖伊罗德欲杀尔矣、
  - type: paragraph
    text:
      ru: Проклятые фарисеи, снедаемые завистью, пытаются устрашить Господа и угрожают Ему Иродом. Они не желали видеть Его творящим чудеса, чтобы Он множеством знамений не привлек к Себе народ и силой учения не обратил его к Себе (Ин. 11, 47–48). Они выставляют в предлог Ирода и принимают вид заботливости о Спасителе.
      cn: 被咒诅的法利赛人，为嫉妒所吞噬，企图恐吓主，并以希律威吓祂。他们不愿意见祂行奇迹，为的是不叫祂以众多的神迹将百姓吸引归于祂自己，又不叫祂以教诲之力将他们转向归于祂自己（伊鄂昂福音 11:47–48）。他们以希律为借口，装作关心救主的模样。
  - type: paragraph
    initial:
      ru: 'Лк 13:32. '
      cn: （路加福音 13:32）
    text:
      ru: 'И сказал им: пойдите, скажите этой лисице:'
      cn: 彼对曰、尔等往告彼狐狸、顾今日、明日、我逐出魔鬼且施医、至第三日我将完成、
  - type: paragraph
    text:
      ru: 'Но Он, зная сердца их, по обычаю Своему, отвечает им кротко, прикровенно, и говорит:«скажите этой лисице». По-видимому, Он называет лисицей Ирода, но если тщательнее вникнуть, то, кажется, скорее Он называет так фарисеев. Ибо Он не сказал: лисице «той», но«этой», употребляя некоторое среднее выражение и с особенной мыслью. Сказав в единственном числе«лисице», дал им разуметь Ирода, а сказав указательно«этой», намекнул на коварство их самих. Ибо фарисеи поистине выказывали (в своих нравах) хитрость и беспечность лисицы.'
      cn: 然而，祂深知他们的心，按照祂的惯例，温和而隐晦地回答他们，并且说：「你们去告诉这只狐狸。」表面上看，祂称呼希律为狐狸，但若更仔细地深究，似乎祂称呼法利赛人才是如此。因为祂没有说：「那」只狐狸，而是说：「这」只狐狸，祂使用了某种中性的表达，并带有特殊的用意。祂用单数形式说了「狐狸」，让他们明白了是指希律；而用指示性的「这」字，则暗示了他们自身的奸诈。因为法利赛人确实（在他们的品性中）展现出了狐狸的狡猾与轻率。
  - type: paragraph
    text:
      ru: се, изгоняю бесов и совершаю исцеления сегодня и завтра, и в третийденькончу;
      cn: 看哪，今日、明日，我逐出魔鬼且施行医治，至第三日我将完成。
  - type: paragraph
    text:
      ru: 'Смотри, пожалуй, как Он отвечает на их злобу. Поскольку они наводили на Него страх со стороны Ирода по зависти своей к совершаемым от Него исцелениям, то Он, зная, что приводило их в печаль, говорит следующее: вот Я«совершаю исцеления»и«изгоняю бесов». Ибо, как прежде было сказано, из-за того преследовали Его, чтобы Он, пользуясь обнаружением чудес, не уловил многих в веру в Себя. Слова«сегодня и завтра»означают большое число дней. Как мы в обычной беседе обыкновенно говорим: сегодня и завтра будет то-то, однако ж, вовсе не ограничиваем сего дела таким расстоянием, а выражаем только, что оно будет скоро, так и Христос словами:«сегодня и завтра... совершаю исцеления,... и в третий день кончу», – совсем не то выразил, будто в третий день Он непременно скончается, а то выражает, что смерть Его будет скоро.'
      cn: '请看，祂如何回应他们的恶毒。既然他们出于嫉妒祂所施行的医治，而借希律之名向祂施加恐吓，那么，祂深知让他们感到忧伤的原因，便说出以下的话：看哪，我«施行医治»且«逐出魔鬼»。因为，正如之前所说，他们迫害祂正是因为这个原因，以防祂利用展现神迹来吸引许多人归信祂自己。


        «今日和明日»这些词语意指许多日子。正如我们在日常谈话中通常会说：某事将在「今日和明日」发生，然而，我们绝非将此事限定在如此的期限之内，而只是表达它将很快发生，基督也是如此，祂用«今日、明日……我施行医治……至第三日我将完成»这些话语，绝非表达祂必将在第三日死去，而是表达祂的死亡将会很快来临。'
  - type: paragraph
    initial:
      ru: 'Лк 13:33. '
      cn: （路加福音 13:33）
    text:
      ru: а впрочем, Мне должно ходить сегодня, завтра и в последующий день,
      cn: 然今日、明日、后日、我当行矣、盖未有先知、被害于耶鲁萨利木之外者、
  - type: paragraph
    text:
      ru: '«Впрочем, Мне должно... сегодня и завтра», то есть некоторое время, пробыть здесь и совершать чудеса, а«в последующий день»пойти в Иерусалим, ибо Я определил Себе там пострадать. Поскольку они (фарисеи) говорили Ему:«выйди..., ибо Ирод хочет убить Тебя», – и говорили это в Галилее, которой управлял Ирод, то Он объявляет им, что и при сильном желании Ирода нельзя ему убить Его, ибо Ему определено пострадать не в Галилее, но в Иерусалиме. Чтобы мне яснее представить тебе изречение Евангелия, скажу: ты не так понимай, что сегодня и завтра должно Мне идти, но на словах«сегодня»и«завтра»остановись, а потом читай:«и в последующий день»идти. При отчислении времени мы часто имеем обычай говорить: в воскресенье, на другой день и на третий я выйду, не потому, что я намерен выйти в воскресенье и на другой день, но потому, чтобы, отчисляя только два сии дня, указать на третий. Подобно и Господь здесь, как бы отсчитывая, говорит: должно Мне сегодня и завтра, потом на третий день идти в Иерусалим, ибо там определена Мне кончина. Поскольку же мы выше сказали, что Господь говорит это не потому, чтобы заключал жизнь Свою в три дня, но обозначает большое число дней, если не некоторое не очень продолжительное время, то Он завидующим Ему говорит как бы так: что вы заботитесь о Моей смерти? Вот, немного спустя, настанет она.'
      cn: 「我当行矣，然今日、明日、后日（*Впрочем, Мне должно... сегодня и завтра*），」即是说，我要在此地逗留一段时间，并施行神迹；而「在接续之日（*в последующий день*）」则前往耶路撒冷，因为我已定意在那里受难。由于他们（法利赛人）对祂说：「出来吧，因为希律想要杀你，」并且他们是在由希律所管辖的加利利说这些话的，因此祂向他们宣告：即便希律有强烈的意愿，也不能杀害祂，因为祂被定意受难并非在加利利，而是在耶路撒冷。为了让我更清晰地向你呈现福音书的这一说辞，我要说：你不要理解为今日和明日我必须动身前去，而是要在「今日」和「明日」这两词上稍作停顿，然后才读：「又在接续之日」动身前去。在计算时间时，我们常常有这样的习惯说法：在主日、次日和第三日我将外出，并非因为我打算在主日和次日外出，而是为了通过仅计算这前两个日子，来指示第三个日子。主在此处也以类似的方式，仿佛在数算着说：我必须今日和明日，然后在第三日动身前往耶路撒冷，因为我的终局已在那里定下。既然我们上面说过，主说这话并非意味着将祂的生命局限于三天之内，而是表示一个庞大的日子数量，如果不是某个不太长久的时间的话，那么祂就仿佛如此对那些嫉妒祂的人说：你们为何担忧我的死？看哪，它很快就会来临了。
  - type: paragraph
    text:
      ru: потому что не бывает, чтобы пророк погиб вне Иерусалима.
      cn: 因为没有先知，是被害于耶路撒冷之外的。
  - type: paragraph
    text:
      ru: Когда слышишь, что пророку невозможно погибнуть кроме Иерусалима, то из этих слов не заключай, что иудеям делается как бы насилие и принуждение к совершению сего, но так говорится сообразно с их смертоубийственным намерением. Как если бы кто, при виде убийцы – разбойника в засаде при дороге, сказал, что невозможно быть чистой от крови дороге сей, при которой разбойник подсиживает странников, то сказал бы совершенно согласно с делами разбойника, так и в том случае, когда в Иерусалиме заседали разбойники – фарисеи и книжники, невозможно было Владыке пророков погибнуть в ином месте, как не в месте сих разбойников. Ибо они, привыкнув проливать кровь рабов, убьют и Господа.
      cn: 当你听到，先知不可能在耶路撒冷之外被害，你不要从这些话中得出结论，认为这仿佛是对犹太人施加了暴力和强迫，促使他们去行此事；而是这番话是根据他们那杀气腾腾的意图而言的。就好像有人，当看到一个杀人犯——强盗在路边设伏时，说这条路不可能没有鲜血玷污，因为强盗在这条路上埋伏着旅人，他这话就完全是与强盗的行为相一致的；同理，在这种情形下，当强盗——法利赛人和文士在耶路撒冷盘踞时，众先知的「主宰」就不可能在别的地方被害，只能在这些强盗盘踞之地。因为他们，习惯了流仆人的血，他们也必将杀死主。
  - type: paragraph
    initial:
      ru: 'Лк 13:34. '
      cn: （路加福音 13:34）
    text:
      ru: Иерусалим! Иерусалим! избивающий пророков и камнями побивающий посланных к тебе!
      cn: 耶鲁萨利木乎、耶鲁萨利木乎、尝杀先知石击奉遣就尔者欤、我屡次愿集尔之诸子、如母鸡集其雏于翼下、而尔等不愿耶、
  - type: paragraph
    text:
      ru: Повторением имени Господь показывает, какую Он сильную любовь имеет к ним. Ибо Он также воззывает прелюбодейную синагогу, как бы какой возлюбленный, презираемый своей возлюбленной.
      cn: 重复称呼主名，表明了祂对他们拥有何等强烈的爱。因为祂也呼唤着行淫的会堂（синагога），如同一个被其所爱之人鄙视的爱慕者（возлюбленный）一样。
  - type: paragraph
    text:
      ru: сколько раз хотел Я собрать чад твоих, как птица птенцов своих под крылья, и вы не захотели!
      cn: 「我屡次愿集尔之诸子、如母鸡集其雏于翼下、而尔等不愿耶！」
  - type: paragraph
    text:
      ru: Объявляет Господь и о человеколюбии Своем, говоря, что Он много раз«хотел... собрать»их; обозначает и безумие их, сказав:«и вы не захотели».
      cn: 主宣示了祂的神人爱，言说祂曾多次「愿...聚集」他们；祂亦指出他们的愚昧，说道：「而尔等不愿耶」。
  - type: paragraph
    initial:
      ru: 'Лк 13:35. '
      cn: （路加福音 13:35）
    text:
      ru: Се, оставляется вам дом ваш пуст.
      cn: 顾尔等家自遗尔等为墟、我告尔等、不复见我、待时至、尔等云、被福言者、系因主名而来者、
  - type: paragraph
    text:
      ru: Наконец Я оставляю вас. Ибо Я столь возненавидел ваше лукавство, что и храм не называю Моим домом, но домом вашим. Ибо доколе между вами жила добродетель, тогда храм был Мой. А когда вы и его осквернили, сделали его местом торговли и пещерой разбойников, занимаясь в нем многообразной торговлей и убивая друг друга из любостяжания (ибо это дело разбоя – подсиживать брата и отнимать его собственность; так делают разбойники! они нападают на путника и потом отнимают, что у него есть); – итак, когда вы сделали храм пещерой разбойников чрез разные торговые сделки, которые вы производили в нем – доме молитвы, – то он уже не Мой дом, но ваш.
      cn: 最终，我撇弃你们。因为我极其憎恶你们的奸恶，以至于不再称圣殿为我的家，而是你们的家。因为只要美德仍活在你们中间时，圣殿是我的。但当你们也玷污了它，将它变为贸易场所和强盗的巢穴，在其中进行各种各样的交易，并因贪婪而彼此杀害（因为这是强盗的行为——埋伏等待兄弟，夺取他的财产；强盗正是这样做的！他们袭击行路人，然后夺走他所拥有的一切）；——因此，当你们藉着在其中所进行的各种贸易买卖，将这祷告的殿堂变成了强盗的巢穴时，它就不再是我的家，而是你们的家了。
  - type: paragraph
    text:
      ru: 'Под«домом»можешь разуметь не только храм, но и весь род иудейский. Ибо Писание иногда и род называет домом, например:«Дом Левиин! благословите Господа»(Пс. 134, 20). Поскольку и здесь можно разуметь так:«дом», то есть род ваш, оставляется Мной. Подобно как и в другом месте говорит чрез пророка: оставил Я дом Мой, оставил наследие Мое. Здесь домом называются израильтяне. Господь показывает, что и прежде сего Он же хранил их и избавлял от врагов.'
      cn: 你所说的「家」（дом）不仅可以理解为圣殿，还可以理解为整个犹太民族。因为《圣经》有时也将民族称为家，例如：「利未家啊，你们要称颂上主」（诗篇 134:20）。既然此处也可以如此理解，那么「家」（дом），即你们的民族，就被我撇弃了。如同祂在另一处藉着先知所言：「我撇弃了我的家，离弃了我的产业。」在此，「家」指的就是以色列人。主表明，早在此之前，祂就一直看守着他们，并把他们从敌人手中解救出来。
  - type: paragraph
    text:
      ru: 'Сказываю же вам, что вы не увидите Меня, пока не придет время, когда скажете: благословенГрядыйво имя Господне!'
      cn: 我说我不再见你们，直到时候来到，你们会说：奉主名而来的，是蒙福的！
  - type: paragraph
    text:
      ru: 'Слова указывают на второе пришествие. Ибо тогда и против воли исповедают Его Спасителем и Господом. Только не будет им никакой пользы. Что ж? Неужели они не видели Его с того времени, как Он сказал это? Точно так. Когда Он говорит, что«не увидите Меня»отныне, то не тотчас обозначает, но время после креста. Он как бы так сказал: с того времени, как вы распнете Меня, вы уже не увидите Меня, пока не приду во второй раз.'
      cn: '这些话语指示第二次降临。因为那时，他们即便违背意愿，也将宣认祂为救主与主宰。只是对他们不会有丝毫益处。


        那么呢？难道自从祂说了这话以来，他们就没有见过祂了吗？确实如此。当祂说「不复见我」时，祂所指的并非是即刻，而是十字架之后的时间。


        祂仿佛这样说：自从你们将我钉上十字架的那时起，你们就不会再见到我了，直到我第二次来临。'
- type: heading1
  text:
    ru: Глава четырнадцатая
    cn: 第十四章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 14:1. '
      cn: （路加福音 14:1）
    text:
      ru: Случилось Ему в субботу придти в дом одного из начальников фарисейских вкусить хлеба, и они наблюдали за Ним.
      cn: 〇适一安息日、彼入一发利些乙宰官之家餐饼、而伊等窥伺之、
  - type: paragraph
    text:
      ru: Господь хотя знал развращение фарисеев, однако ж, входил в дом их; входил потому, что заботился о пользе их душ. Ибо они, если желали, могли бы получить себе пользу то от слов Его и учения, то от проявления знамений.
      cn: 主，虽然知道法利赛人的堕落，却仍然进入他们的家中；他进入，是因为他关心他们的灵魂益处。因为他们若愿意，本可以从祂的言语和教导中，或者从神迹的显现中，得到益处。
  - type: paragraph
    initial:
      ru: 'Лк 14:2. '
      cn: （路加福音 14:2）
    text:
      ru: И вот, предстал пред Него человек, страждущий водяною болезнью.
      cn: 顾、有一人乃患水肿病者立于其前、
  - type: paragraph
    text:
      ru: Поэтому, когда предстал на средину«страждущий водяною болезнью», Господь смотрел не на то, чтоб не соблазнить их, но на то, чтобы оказать благодеяние нуждающемуся в исцелении. Ибо там, где предстоит очень много пользы, нам не должно заботиться о тех, кои безумно соблазняются.
      cn: 因此，当「患水肿病者」出现在（他们）中间时，主所关注的并非是不使他们跌倒，而是要施恩惠予那需要医治之人。因为在有极大益处临到之处，我们不应当去顾虑那些愚昧地跌倒之人。
  - type: paragraph
    initial:
      ru: 'Лк 14:3. '
      cn: （路加福音 14:3）
    text:
      ru: 'По сему случаю Иисус спросил законников и фарисеев: позволительно ли врачевать в субботу?'
      cn: 伊伊稣斯对法律师及发利些乙等曰、安息日施医、宜乎、
  - type: paragraph
    text:
      ru: Господь обличает неразумие тех, кои намеревались упрекнуть Его; поэтому и спрашивает, позволительно ли лечить в субботу, или нет. Не явно ли Он позорит их как безумных? Ибо тогда, как Сам Бог благословил субботу, они возбраняют делать добро в оную и таким образом делают ее проклятой. Ибо не благословен тот день, в который не совершают никакого доброго дела.
      cn: 主斥责那些意图责备祂之人的不智；因此祂发问：在安息日施医，是否容许。祂岂非明显地斥其为愚昧人？因为当上帝亲自祝福安息日时，他们却禁止人在该日行善，从而使安息日受到诅咒。因为那不行任何善工的日子，便不是蒙福的日子。
  - type: paragraph
    initial:
      ru: 'Лк 14:4. '
      cn: （路加福音 14:4）
    text:
      ru: Они молчали. И, прикоснувшись, исцелил его и отпустил.
      cn: 伊等默然、彼按之疗愈、而放之去、
  - type: paragraph
    text:
      ru: Но они, поняв, к чему клонится вопрос, умолчали. Тогда Иисус творит Свое дело и чрез прикосновение исцеляет больного человека.
      cn: 然而他们，明白了问题所趋向的，就缄默不言了。那时，耶稣完成了祂的工作，并借着触摸治愈了这患病之人。
  - type: paragraph
    initial:
      ru: 'Лк 14:5. '
      cn: （路加福音 14:5）
    text:
      ru: 'При сем сказал им: если у кого из вас осёл или вол упадет в колодезь, не тотчас ли вытащит его и в субботу?'
      cn: 彼又向之曰、尔等中谁有驴或牛陷于阱中、亦于安息日不即援之出乎、
  - type: paragraph
    initial:
      ru: 'Лк 14:6. '
      cn: （路加福音 14:6）
    text:
      ru: И не могли отвечать Ему на это.
      cn: 伊等无能以词对、
  - type: paragraph
    text:
      ru: 'Потом этим поступком пристыжает и фарисеев, говоря им как бы так: если Закон воспретил миловать в субботу, то неужели ты не попечешься о сыне, подвергшемся бедствию в субботу? И что говорю о сыне? Неужели ты оставишь вола без помощи, если увидишь его в беде? Как же не безумно подстерегать за исцелением в субботу человека, страждущего водянкой?'
      cn: 随后，他用这行为令法利赛人感到羞愧，仿佛对他们这样说：如果律法禁止在安息日施怜悯，难道你不会顾念你的儿子在安息日遭遇了不幸吗？我何必说你的儿子呢？难道你在见到你的牛处于困境中时，会不施以援手，任凭它自生自灭吗？既然如此，在安息日窥伺一位患有水臌病的人得到医治，难道不是疯狂之举吗？
  - type: paragraph
    text:
      ru: Водянкой страждет и всякий, кто от распутной и беспечной жизни страшно заболел душой и нуждается во Христе. Таковый будет исцелен, если предстанет пред Христом. Ибо кто постоянно содержит в мысли, что он пред Богом и Бог видит его, тот будет грешить сколь можно меньше.
      cn: 患水肿者亦是那一切因放荡不羁、疏忽大意之生活而灵魂病入膏肓、需要基督的人。若这样的人来到基督面前，他必得痊愈。因为那恒常在思想中持守「他是在上帝面前，且上帝正看着他」的人，他犯罪会尽可能地少。
  - type: paragraph
    initial:
      ru: 'Лк 14:7. '
      cn: （路加福音 14:7）
    text:
      ru: 'Замечая же, как званые выбирали первые места, сказал им притчу:'
      cn: 彼觉所请之客如何择首位、设譬喻语之曰、
  - type: paragraph
    text:
      ru: 'Видишь ли, каковы вечери (ужины) Христовы, как они обращаются на пользу душ, а не на пресыщение чрева? Ибо, смотри, уврачевал Он страждущего водянкой, научил фарисеев тому, что творить добро в субботу есть благое дело. Потом, когда увидел, что они делают шум из-за сидения в передних местах, врачует и эту страсть, происходящую не от малой причины, но от великой и неудобоизбежной, то есть от тщеславия. И никто не считай учение о сем маловажным и недостойным величия Божия. Ибо ты отнюдь не можешь назвать человеколюбивым врачом того, кто лечить подагру и какую ни есть важную болезнь обещается, а ушиба пальца или зубной боли лечить не берется. Потом, как считать маловажной страсть тщеславия, когда она во всех отношениях беспокоит любящих садиться на передних местах? Итак, нужно было Учителю, Начальнику и Совершителю смирения, – Христу, нужно было пересечь всякую ветвь этого злого корня – тщеславия. Прими, пожалуй, во внимание и то. Если бы теперь не время стола было и Господь заговорил бы о сем, оставив речь о прочем, то могли бы Его упрекнуть: а теперь, когда время было ужина и когда страсть к первенству мучила несчастных в глазах Спасителя, Его увещание весьма благовременно.'
      cn: 你看到了吗，基督的晚宴（晚餐）是何等的样式，它们转向益于灵魂，而非使肚腹饱足？因为，看哪，祂治愈了患水肿病的人，教导法利赛人说，在安息日行善是美善之事。然后，当祂看到他们因抢占前排座位而制造喧嚷时，祂也医治了这种情欲，这种情欲并非源自微小之因，而是源自巨大且难以避免之因，即虚荣。无人应视关于此的教导为微不足道且不配于神之伟大。因为，你绝不能称那应允医治痛风或任何重大疾病，却不承担医治手指碰伤或牙痛的人为仁爱医者。那么，当虚荣之情欲在各个方面困扰着那些喜爱坐在前排座位的人时，又怎能将其视为微不足道呢？因此，这位谦卑的导师、元首和成全者——基督，祂有必要截断虚荣这个邪恶根源的每一条枝杈。请你也留意这一点。如果现在不是开宴之时，而主撇下对其他事物的谈论而讲论此事，那么祂可能会受到指责：但是现在，正值晚宴之时，并且在救主看来，对首位的渴望正折磨着这些不幸之人，祂的劝诫就来得十分合时宜了。
  - type: paragraph
    initial:
      ru: 'Лк 14:8. '
      cn: （路加福音 14:8）
    text:
      ru: когда ты будешь позван кем на брак, не садись на первое место, чтобы не случился кто из званых им почетнее тебя,
      cn: 迨尔为人所请赴婚筵时、勿坐首位、恐被请者中有尊于尔者、
  - type: paragraph
    initial:
      ru: 'Лк 14:9. '
      cn: （路加福音 14:9）
    text:
      ru: 'и звавший тебя и его, подойдя, не сказал бы тебе: уступи ему место; и тогда со стыдом должен будешь занять последнее место.'
      cn: 则请尔与彼者、来向尔曰、让座位于此人、其时、尔将羞起、而占末位、
  - type: paragraph
    text:
      ru: Смотри с другой стороны и на то, от какого посмеяния освобождает Он человека и как научает его благоприличию. Ибо сколько стыда в том случае, если ты займешь место, тебе неприличное, а потом придет кто-нибудь почетнее тебя, и звавший тебя скажет:«уступи ему место!» А это (может случиться) часто. И ты сам должен будешь уступить, а те сядут выше.
      cn: 亦请从另一方面审视，祂将人从何种讥笑中解放出来，以及祂如何教导人以得体。因为，倘若你占据了一个对你而言不合宜的座位，那将是何等的羞耻；随后又来了一位比你更尊贵的人，而邀请你的人便会说：「让座给他！」而此事（可能会）时常发生。且你自身必须让座，而他们则坐于高位。
  - type: paragraph
    initial:
      ru: 'Лк 14:10. '
      cn: （路加福音 14:10）
    text:
      ru: 'Но когда зван будешь, придя, садись на последнее место, чтобы звавший тебя, подойдя, сказал: друг! пересядь выше; тогда будет тебе честь пред сидящими с тобою,'
      cn: 然尔在被请之时、往坐末位、俾请尔者来之时、语尔曰、朋友乎、上坐、其时尔在同席者前、有尊荣矣
  - type: paragraph
    text:
      ru: Напротив, сколь похвально то, когда достойный первого места в начале сядет ниже других, а потом окажется председательствующим, так что все уступают ему первенство. Ужели же тебе кажется маловажным такое убеждение Господа, которое предписывает высочайшую из добродетелей – смирение, поселяет оное в душах слушателей и покорного ему приводит к благоприличию? Тому же учил впоследствии и ученик Христов Павел:«все, – говорит, –должно быть благопристойно и чинно»(1Кор. 14, 40). Как же это будет?«Не о себетолькокаждый заботься, но каждый и о других»(Флп. 2, 4). Видишь ли, ученик проповедует то же, что и Учитель?
      cn: '恰恰相反，当一个配得上首位的人，一开始却坐在别人之下，随后被发现是主席，以致所有人都要向他让出首位时，这是何等值得称赞啊。难道在你看来，主的这种劝说微不足道吗？它规定了最高尚的美德——谦卑，将其植入听者的灵魂之中，并带领顺服它的人达到合宜得体（благоприличию）。


        基督的门徒保罗后来也教导了同样的事情：「凡事，」他说，「都当按着规矩（чинно）和次序行」（哥林多前书 14:40）。这又将如何实现呢？「各人不要单顾自己的事，也要顾别人的事」（腓立比书 2:4）。你看到没有，门徒所宣扬的，正是导师所宣扬的？'
  - type: paragraph
    initial:
      ru: 'Лк 14:11. '
      cn: （路加福音 14:11）
    text:
      ru: ибо всякий возвышающий сам себя унижен будет, а унижающий себя возвысится.
      cn: 因凡自高者将降为卑、自卑将升为高、
  - type: paragraph
    text:
      ru: Как разуметь слова:«всякий возвышающий сам себя унижен будет»? Ибо многие, сами себя возвышающие в жизни сей, наслаждаются честью.«Будет... унижен»означает то, что кто в мире сем пользуется большой честью, тот жалок и низок пред Богом. Притом таковой бывает в чести не до конца и не у всех, но сколько одни уважают его, столько же другие поносят, может быть и из тех самых, кои уважают его. Итак, это изречение истины справедливо. И всякий недостойный высокого места, но присвояющий оное себе, будет унижен и пред Богом во время последнего суда, хотя бы в сей жизни был и выше всех.
      cn: 如何理解「凡自高者将降为卑」这句话？因为许多在这世上自高的人，享尽了尊荣。「将降为卑」的意思是，凡在这世上享有莫大尊荣的人，在上帝面前却是悲惨和卑微的。此外，这样的人所享有的尊荣并非长久，也并非被所有人所拥有，而是有多少人尊敬他，就有多少人诽谤他，甚至可能是那些尊敬他的人中的一部分。因此，这真理的训言是公正的。并且，凡是不配享有高位却将其占为己有的人，即便他在今生高于所有人，在末日审判之时也必将在上帝面前降为卑。
  - type: paragraph
    text:
      ru: По природе же всякий человек недостоин возвышения. Поэтому пусть никто не возвышает себя, чтобы не быть униженным до крайности.
      cn: 按自然本性而言，每一个人都不配得升高（ возвышения）。因此，不要让任何人自抬身价（ возвышает себя），以免被降到至极的卑微（ униженным до крайности）。
  - type: paragraph
    initial:
      ru: 'Лк 14:12. '
      cn: （路加福音 14:12）
    text:
      ru: 'Сказал же и позвавшему Его: когда делаешь обед или ужин, не зови друзей твоих, ни братьев твоих, ни родственников твоих, ни соседей богатых, чтобы и они тебя когда не позвали, и не получил ты воздаяния.'
      cn: 〇彼又向请之者曰、尔设午餐、或晚餐之时、勿请尔朋友、或尔弟兄、或尔亲戚、或尔富邻、恐彼等亦请尔、尔将受报、
  - type: paragraph
    initial:
      ru: 'Лк 14:13. '
      cn: （路加福音 14:13）
    text:
      ru: Но, когда делаешь пир, зови нищих, увечных, хромых, слепых,
      cn: 乃尔设筵时、请诸贫乏、残废、跛者、瞽者、
  - type: paragraph
    initial:
      ru: 'Лк 14:14. '
      cn: （路加福音 14:14）
    text:
      ru: и блажен будешь, что они не могут воздать тебе, ибо воздастся тебе в воскресение праведных.
      cn: 则尔福哉、因彼等不能报尔、而至义人复活时、尔必得报也、
  - type: paragraph
    text:
      ru: На ужине было два разряда возлежащих – звавшие и званые. Господь прежде обратился с увещанием к званым, научил их спасительному смиренномудрию и предложил им пищу неизысканную, а потом воздает почесть позвавшему Его и отплачивает за угощение увещанием, чтобы он не делал угощений из-за какого-нибудь людского благоволения и ожидал тотчас воздаяния. Ибо малодушные, приглашая друзей или родных, делают это в видах скорой благодарности, и если не получают оной, то приходят в досаду. А великодушные, терпя до будущей жизни, получают вознаграждение от Того, Кто поистине богат (Еф. 2, 4, 7).
      cn: 在晚宴上，有两种类型的同席者——邀请者和被邀请者。主首先转向被邀请者进行劝诫，教导他们救赎性的谦卑（смиренномудрию），并为他们提供了不奢华的食物，然后祂向邀请祂的人致以敬意，并以劝诫来回报他的款待，要求他不应出于任何人的恩惠（людского благоволения）而设宴款待，也不应立即期望得到报偿。因为心胸狭隘（малодушные）的人，在邀请朋友或亲戚时，这样做是为了获得快速的感谢，如果他们没有得到感谢，就会感到恼火。而心胸宽广（великодушные）的人，忍耐直至未来的生命，从那真正富足者那里获得报偿（以弗所书 2:4，7）。
  - type: paragraph
    initial:
      ru: 'Лк 14:15. '
      cn: （路加福音 14:15）
    text:
      ru: 'Услышав это, некто из возлежащих с Ним сказал Ему: блажен, кто вкусит хлеба в Царствии Божием!'
      cn: 同席之人闻此、向彼曰、福哉在上帝之国食饼者也、
  - type: paragraph
    text:
      ru: 'Господь, говоря сие, отклоняет нас торговать дружелюбием. А некто, услышав сие и подумав, что Бог почтит и угостит праведников чувственными яствами, сказал:«блажен, кто вкусит хлеба в Царствии Божием». Вероятно, он не был духовен, чтоб понять, то есть водился человеческими размышлениями. Ибо душевный человек таков, что ничему сверхъестественному не верит, ибо обо всем судит по законам природы. Бывают три состояния в человеке: плотское, душевное и духовное. «Плотское» – когда кто желает наслаждаться удовольствиями и радоваться, хотя бы это сопряжено было с причинением зла другим. Таковы все любостяжательные. «Душевное» состояние – когда кто не желает ни вредить, ни вреда получить. Такова жизнь по закону природы. Ибо это внушает нам и сама природа. А «духовное» состояние – когда кто ради добра согласен даже потерпеть вред и оскорбление. Первое состояние близко к природе, среднее – сообразно с природой, а третье – выше природы. Всякий, кто мыслит о человеческом и не может понять ничего сверхъестественного, называется душевным (1Кор. 2, 14), так как он водится душой и духом. Но когда кто водится духом и не живет уже сам, но живет в нем Христос (Гал. 2, 20), тот духовен, тот возвысился над природой. Итак, подумавший, что воздаяние святым будет чувственное, был душевен, так как не мог понять ничего сверхъестественного.'
      cn: "主说这话，是劝阻我们不要拿友爱去交易。然而，有一个人，听了这话，心里想，上帝会用感官的佳肴来尊荣和款待义人，便说：「在上帝的国里吃饼的人，有福了。」他可能不是属灵的，因此未能理解，也就是说，他被人的思考所引导。因为属魂的人就是这样，不相信任何超自然的事物，因为他凡事都按照自然法则来评断。人有三种状态：属肉体的，属魂的，和属灵的。\n\n    「属肉体的」——是指某人渴望享受快乐和欢愉，即使这涉及对他人造成伤害。所有贪爱钱财的人都是如此。\n\n    「属魂的」状态——是指某人既不愿伤害别人，也不愿受到伤害。这是依照自然法则而活的生活。因为自然本身就向我们灌输这一点。\n\n    而「属灵的」状态——是指某人为了良善，甚至愿意忍受伤害和侮辱。\n\n    第一种状态接近自然，中间的状态与自然相符，而第三种状态超越自然。\n\n    凡是思考人性的事物，不能理解任何超自然事物的人，被称为属魂的（哥林多前书 2:14），因为他被魂和灵所引导。但是，当某人被灵所引导，不再是自己活着，而是基督在他里面活着（加拉太书 2:20）时，那人就是属灵的，那人就超越了自然。\n\n    因此，认为圣徒的报偿将是属感官的人，是属魂的，因为他不能理解任何超自然的事物。"
  - type: paragraph
    initial:
      ru: 'Лк 14:16. '
      cn: （路加福音 14:16）
    text:
      ru: 'Он же сказал ему: один человек сделал большой ужин и звал многих,'
      cn: 〇彼语之曰、某人设大晚餐、所请甚多、
  - type: paragraph
    text:
      ru: Так как возлежавший с Господом сказал:«блажен, кто вкусит хлеба в Царствии Божием», то Господь довольно пространно научает его, как мы должны разуметь угощение Божие, и произносит настоящую притчу, называя человеком Своего человеколюбивого Отца. Ибо в Писании, когда делается намек на силу Божию наказующую, Бог именуется львом и медведицей (по церковно-славянски – пантерой, барсом) (Ос. 13, 7–8); а когда имеется в виду обозначить какое-либо действие человеколюбия Его, тогда Бог представляется в лице человека (Лк. 15, 11–24), подобно как и в настоящем месте.
      cn: 既然与主一同坐席的人曾说：「在上帝的国里吃饼的人是有福的」（路加福音 14:15），故主相当详细地教导他，我们当如何理解上帝的筵席，并说出眼前的比喻，将祂那热爱人类的父称为「某人」。因为在圣经中，当暗指上帝惩罚的力量时，上帝就被称为狮子和母熊（根据教会斯拉夫语——豹、雪豹）（何西阿书 13:7-8）；而当意图表明祂的任何热爱人类的行为时，上帝则以一个人的身份呈现（路加福音 15:11-24），正如在眼前这个地方一样。
  - type: paragraph
    text:
      ru: Поскольку притча говорит о человеколюбивейшем домостроительстве, которое Бог совершил в нас, сделав нас причастниками Плоти Сына Своего, то и назван Он человеком. Это домостроительство названо«большимужином".«Ужином» названо потому, что Господь пришел в последние времена и как бы при«ужине» века, а «великим ужином» – потому, что тайна спасения нашего беспрекословно велика (1Тим. 3, 16).
      cn: 既然此比喻所述及的是上帝在我们身上所成就的、那极爱人的经纶，祂使我们得以分享其独生子的圣体，故此祂便被称为人。此经纶被称作「大晚餐」。称之为「晚餐」，是因为主降临于末后的时代，恰如在世代的「晚餐」之时；称之为「大晚餐」，则是因为我们拯救的奥秘，毫无疑问地是伟大的（提摩太前书 3:16）。
  - type: paragraph
    initial:
      ru: 'Лк 14:17. '
      cn: （路加福音 14:17）
    text:
      ru: и когда наступило время ужина, послал раба своего
      cn: 既餐时、遣其仆告被请者曰、来、盖一切已备、
  - type: paragraph
    text:
      ru: Кто этот раб? Сын Божий, который принял образ раба, соделавшись Человеком (Флп. 2, 7), и о Котором как Человеке, говорится, что Он послан. Обрати внимание на то, что не просто сказано«раба», но «того» раба, который в собственном смысле благоугодил Богу по человечеству и хорошо послужил. Ибо не только как о Сыне и Боге, благоугодном Отцу, но и как о Человеке, который Один только Сам безгрешно покорился всем определениям и заповедям Отца и«исполнилвсякую правду»(Мф. 3, 15), говорится о Нем, что Он послужил Богу и Отцу. Почему рабом Божиим в собственном смысле Он только Один и может быть назван.
      cn: '这位仆人是谁？


        是圣子上帝，祂取了仆人的形象，成了人（腓立比书 2:7），并且，就祂是人而言，圣经论及祂是被差遣的。请注意，圣经并非简单地称之为「仆人」，而是称之为「那位」仆人，祂在自身意义上，以人性取悦了上帝并圆满地侍奉了上帝。因为，圣经不仅论及祂作为取悦了父的圣子和上帝，也论及祂作为人，是唯一一位无罪地顺服了父的所有定命与诫命，并「成就各样义」的人（马太福音 3:15），经文论及祂服事了上帝和父。因此，在自身的意义上，唯独祂才配得上被称为上帝的仆人。'
  - type: paragraph
    text:
      ru: Послан Он«когда наступило время ужина», то есть в определенное и благоприличное время. Ибо для спасения нашего не другое какое время было благоприличнейшим, как время царствования Августа кесаря, когда злоба взошла на самый верх и ей нужно было пасть. Как врачи оставляют гнойную и дурную болезнь дотоле, пока она выточит всю дурную влагу, а потом уже прикладывают и лекарства, так нужно было, чтоб и грех обнаружил все свойственные ему виды, а потом, чтоб великий Врач положил лекарство. Поэтому-то Господь допустил диаволу исполнить меру злобы и потом, воплотившись, уврачевал всякий вид злобы совершенно святой Своей жизнью. Он послал«в год», то есть в настоящее и приличное время, как и Давид говорит:«Препояшь по бедру мечом Твоим и красотою Твоею»(Пс. 44, 4). Меч, без сомнения, есть Слово Божие. Бедром означается рождение во плоти, которое совершилось при зрелости плода, то есть в надлежащее время.
      cn: 他被派遣来「当晚餐时间到来时」，也就是说，在一个特定的、合宜的时间。因为对于我们的救赎而言，没有哪个时间比奥古斯都·凯撒（Август кесаря）统治的时期更为合宜，当时，邪恶已达顶峰，亟需衰落。正如医生们会任由脓性的、恶劣的疾病发展，直到它排出所有恶劣的湿气，然后才敷上药物；同样地，罪恶也需要显露出其所有的固有形态，然后，这位伟大的医者才能施加良药。正因如此，主容许魔鬼做尽其邪恶的勾当，然后，借由道成肉身，祂以祂全然圣洁的生命治愈了每一种邪恶的形态。祂派遣来「在适当的年份」，也就是说，在当前和合宜的时间，正如大卫所说：「用你的剑佩在腰间，带着你的荣美」（诗篇 44:4）。毫无疑问，剑就是上帝的道（Слово Божие）。腰间象征着肉身的诞生，这诞生发生在果实成熟之时，也就是在合宜的时间。
  - type: paragraph
    text:
      ru: 'сказать званым:'
      cn: 说与被召者：
  - type: paragraph
    text:
      ru: Послан был«сказать званым». Кто сии званые? Может быть, и все люди, так как Бог всех призывал к познанию Себя то чрез благоустройство видимых вещей, то чрез закон естественный, а может быть, по преимуществу израильтяне, которые были призваны чрез Закон и пророков. К ним, к овцам дома Израилева, по преимуществу послан был Господь (Мф. 15, 24).
      cn: 「仆人被差遣」「去告诉被召者」。这些被召者是谁呢？或许是所有人，因为上帝曾通过可见事物的良好安排，也曾通过自然律来呼召所有人认识祂；或许是那些优越的以色列人，他们曾通过律法和先知被呼召。主受差遣，优先是去到他们那里，去到以色列家迷失的羊那里（马太福音 15:24）。
  - type: paragraph
    text:
      ru: идите, ибо уже всё готово.
      cn: 去，因为一切都已备妥。
  - type: paragraph
    text:
      ru: 'Он говорит:«идите, ибо уже все готово». Ибо Господь всем благовествовал: близко Царствие Небесное (Мф. 4, 17), и оно внутри вас (Лк. 17, 21).'
      cn: 他说：「去吧，因为一切都已备妥。」因为主向所有人宣讲了福音：天国近了（马太福音 4:17），并且它就在你们心里（路加福音 17:21）。
  - type: paragraph
    initial:
      ru: 'Лк 14:18. '
      cn: （路加福音 14:18）
    text:
      ru: 'И начали все, как бы сговорившись, извиняться. Первый сказал ему: я купил землю и мне нужно пойти посмотреть ее; прошу тебя, извини меня.'
      cn: 众一齐辞退、第一者曰、我置买田地、我须往视之、祈尔算我辞退、
  - type: paragraph
    initial:
      ru: 'Лк 14:19. '
      cn: （路加福音 14:19）
    text:
      ru: 'Другой сказал: я купил пять пар волов и иду испытать их; прошу тебя, извини меня.'
      cn: 他者曰、我购买牛五对、欲往以试之、祈尔算我辞退、
  - type: paragraph
    initial:
      ru: 'Лк 14:20. '
      cn: （路加福音 14:20）
    text:
      ru: 'Третий сказал: я женился и потому не могу придти.'
      cn: 又一人曰、我娶妻故不得来、
  - type: paragraph
    text:
      ru: А они«начали все... извиняться», то есть как бы сговорясь за одно. Ибо все начальники иудейские отказались иметь Иисуса Царем, и потому не удостоились (вкусить) вечери, кто по любви к богатству, кто по любви к удовольствиям. Ибо под теми, из которых один купил землю, а другой – пять пар волов, можно разуметь пристрастных к богатству, а под женившимся – сластолюбца. Если хочешь, пожалуй, разумей под купившим землю того, кто по мудрости мирской не принимает таинства (спасения). Ибо поле есть мир сей и вообще природа, а кто смотрит только на природу, тот не принимает сверхъестественного. Итак, фарисей, быть может, заглядевшись на землю, то есть наблюдая только законы природы, не принял того, что Дева родила Бога, так как это выше природы. Да и все хвалящиеся внешней мудростью из-за сей земли, то есть из привязанности к природе, не признали Иисуса, обновившего природу. Под купившим пять пар волов и испытывающим их можно разуметь и человека, привязанного к веществу, который пять чувств душевных совокупил с телесными и душу сделал плотью. Поэтому, как занятый земным, он не хочет участвовать в духовной вечери. Ибо и премудрый говорит:«Как может сделаться мудрым тот, кто правит плугом»(Сир. 38, 25). А под отпадающим из-за жены можно разуметь пристрастного к удовольствиям, который, пристав к плоти, союзнице души, и будучи с ней одно, как совокупившийся с ней, не может угодить Богу. Можешь все это разуметь и буквально; ибо мы отпадаем от Бога как из-за пары волов, так и из-за женитьбы, когда привязываемся к ним, на них исстрачиваем всю жизнь, из-за них трудимся даже до крови, а Божественного ничего, ни мысли, ни изречения, не помыслим, не исследуем.
      cn: 他们「都开始...推辞」，也就是说，他们好像事先串通好了一样。因为所有犹太人的首领都拒绝拥立耶稣为王，因此他们不配（享用）这筵席，有的人是出于对财富的热爱，有的人是出于对享乐的热爱。因为，在那些人中，一个是买了田地，另一个是买了五对牛，我们可以理解为他们是贪恋财富的人；而在那娶了妻的人身上，我们可以理解为他是贪图享乐的人。如果你愿意，不妨理解为买了田地的人是那个凭藉世俗的智慧而不接受（救赎）奥秘的人。因为田地就是这个世界，也泛指本性（自然），而只关注本性的人，是不会接受超自然之事物的。因此，法利赛人，或许是因专注于土地，即只观察自然的法则，故不接受童贞女诞下上帝之事，因为这超越了自然。况且所有夸耀外在智慧的人，都因为这土地，即因为对本性的执着，不承认这位更新了本性的耶稣。对于那个买了五对牛并试用它们的人，也可以理解为是一个执着于物质的人，他将灵魂的五种感官与身体的感官结合在一起，使灵魂变成了肉体。因此，他作为一个被俗世事务缠身的人，不愿意参与属灵的筵席。因为那有智慧的人也说：「那掌管犁头的人，怎能成为有智慧的人呢」（德训篇 38:25）。而对于那个因妻子而推辞的人，可以理解为一个贪图享乐的人，他依附于肉体，即灵魂的盟友，并与肉体成为一体，正如他与她结合在一起一样，故不能取悦上帝。你可以把这一切都按字面意义理解；因为我们离弃上帝，既可能是因为一对牛，也可能是因为婚姻，当我们依恋它们，把一生都消耗在它们身上，甚至为它们劳碌至流血，却从未思想、从未探究任何关于神圣的事情，无论是思想还是言论。
  - type: paragraph
    initial:
      ru: 'Лк 14:21. '
      cn: （路加福音 14:21）
    text:
      ru: 'И, возвратившись, раб тот донес о сем господину своему. Тогда, разгневавшись, хозяин дома сказал рабу своему: пойди скорее по улицам и переулкам города и приведи сюда нищих, увечных, хромых и слепых.'
      cn: 其仆归、以此告其主人、其时主人发怒、命其仆曰、速往通衢城巷、引诸贫乏、残废、跛者、瞽者至、
  - type: paragraph
    text:
      ru: Начальники иудейские были отвергнуты, и никто из них не уверовал во Христа, как и сами они хвалились своей злобой. Когда, – говорили они, –«уверовал ли в Него кто из начальников»(Ин. 7, 48)? Итак, эти законники и книжники, как сказал пророк,объюродевше отпадоша благодати,[*****]а простодушные из иудеев, которые уподобляются хромым и слепым, и увеченным,«незнатное мира и уничиженное»(1Кор. 1, 27–28), были призваны. Ибо народ«дивилсясловам благодати, исходившим из уст»Иисусовых (Лк. 4, 22), и радовался о учении Его.
      cn: 犹太人的首领们被弃绝了，他们当中没有人相信基督，正如他们自己以他们的恶行夸口一样。因为他们曾说：「难道有官长或法利赛人信了祂吗？」（伊鄂昂福音 7:48）因此，如先知所说，这些律法师和文士，因[*]他们「行了愚妄」而「从恩典中堕落」；而那些犹太人中的单纯之人，他们可比拟为瘸腿的、瞎眼的、和残废的，即「世上卑贱的，被人厌恶的，以及那无有的」（哥林多前书 1:27-28），却被呼召了。因为民众「都希奇祂口中所出的恩言」（路加福音 4:22），并因祂的教导而欢喜。
  - type: paragraph
    text:
      ru: 'Но после того как вошли израильтяне, то есть избранные из них, которых Бог предназначил к славе Своей (Рим. 8, 29–30), каковы были: Петр, сыны Зеведеевы и прочее множество уверовавших, – после того благодать Божия излилась и на язычников. Ибо в находящихся на «дорогах» и «переулках» можно разуметь язычников. Израильтяне были внутри города, так как они приняли законоположение и наследовали городской образ жизни. А язычники, будучи чужды заветов и отчуждены законоположения Христова, и не будучи согражданами святых (Кол. 1, 21, 12;Еф. 2, 12, 3.) проводили жизнь не на одной дороге, но на многих «дорогах» беззакония и невежества, и в «изгородях», то есть в грехах; ибо грех есть большая изгородь и средостение, отделяющее нас от Бога (Ис. 59, 2). Словом «на дорогах» намекается на скотоподобную и разделенную на многие мнения жизнь язычников, а словом «в переулках» указывается на жизнь их во грехах.'
      cn: '然而，在以色列人——即他们中被上帝预定（预指）领受他荣耀的那些蒙拣选者（罗马书 8:29-30）——进入之后，这群人诸如彼得、西庇太的儿子们以及其他众多已相信者，神的恩典随后也倾注到了外邦人身上。


        因为，在那些身处「大路」（「道路」）和「小巷」（「巷」）中的人，可以理解为外邦人。以色列人在城内，因为他们接受了律法制订并承袭了城邦式的生活方式。而外邦人，他们对盟约是陌生的，并与基督的律法制订相疏远，且不是圣徒的同国之民（歌罗西书 1:21，12，以弗所书 2:12，3），他们所过的生活并非仅在一条道路上，而是在许多无律法和无知之「大路」上，并在「篱笆」（「矮墙」）内，即在罪恶中；因为罪恶是一堵巨大的篱笆和中隔的墙，将我们与上帝隔开（以赛亚书 59:2）。


        「在大路」一词暗示了外邦人那种畜牲般且分裂为众多意见的生活；而「在小巷」一词则指明了他们生活于罪恶之中。'
  - type: paragraph
    text:
      ru: 'Не просто повелевает позвать сих (находящихся по дорогам и по изгородям), но понудить, хотя вера есть дело произвола каждого. Для того сказал он: понуди, чтобы мы познали, что уверование язычников, находившихся в глубоком неведении, есть знамение великой силы Божией. Ибо если бы немного было силы у Проповедуемого и невелика была истина учения, то как люди, служащие идолам и совершающие постыдные дела, могли бы убедиться, вдруг познать истинного Бога и совершать духовную жизнь? Желая указать на чудность сего обращения, и назвал оное понуждением. Как бы кто сказал: язычники и не желали оставить идолов и чувственных наслаждений, однако ж, истиной проповеди принуждены были оставить их. Или иначе: сила знамений составляла великое побуждение обратиться к вере во Христа.'
      cn: 他并非只是吩咐人去召唤这些人（即那些在道路上和篱笆边的人），而是要迫使他们，尽管信仰是个人自由抉择之事。他之所以说：「迫使（他们）」，是为了让我们认识到，那些处于深沉无知中的外邦人的信从，乃是神伟大能力的标志。因为，如果被传扬的那位只有微弱的能力，教义的真理也并非伟大，那么，那些事奉偶像、行可耻之事的人们，如何能被说服，突然间认识真神并度属灵生活呢？他希望借此指明这种皈依的奇妙性，故而将其称之为「迫使」。就好比有人说：外邦人本不愿离弃偶像和感官上的享乐，然而，他们却因着宣讲的真理而被迫离弃了它们。或可作另一种解释：神迹的力量构成了皈依基督信仰的巨大驱动力。
  - type: paragraph
    initial:
      ru: 'Лк 14:22. '
      cn: （路加福音 14:22）
    text:
      ru: 'И сказал раб: господин! исполнено, как приказал ты, и еще есть место.'
      cn: 此仆曰、主欤、如尔命已行、尚有余座位、
  - type: paragraph
    initial:
      ru: 'Лк 14:23. '
      cn: （路加福音 14:23）
    text:
      ru: 'Господин сказал рабу: пойди по дорогам и изгородям и убеди придти, чтобы наполнился дом мой.'
      cn: 主向其仆曰、出往大路及籓篱间、勉强之以入、俾充满我室、
  - type: paragraph
    initial:
      ru: 'Лк 14:24. '
      cn: （路加福音 14:24）
    text:
      ru: Ибо сказываю вам, что никто из тех званых не вкусит моего ужина, ибо много званых, но мало избранных.
      cn: 故我告伊等、其诸被请者中、无一人得尝我之晚䬸、盖被选者多、而见选者少也、
  - type: paragraph
    text:
      ru: Вечеря сия приготовляется ежедневно, и все мы призываемся в Царство, которое Бог уготовал людям еще прежде создания мира (Мф. 25, 34). Но мы не удостаиваемся оного, одни по любопытству мудрости, другие по любви к вещественному, иные по любви к плоти. А человеколюбие Божие дарует сие Царство другим грешникам, которые слепы разумными очами, не понимают, что есть воля Божия, или и понимают, но хромы и неподвижны к исполнению оной, и нищи, как лишившиеся небесной славы, и увечные, как не обнаруживающие в себе непорочной жизни. К сим-то грешникам, блуждающим по широким и пространным путям греха, Отец Небесный посылает с приглашением на вечерю Сына Своего, который стал рабом по плоти, пришел позвать не праведников, но грешников (Мф. 9, 13), и обильно угощает их вместо тех разумных и богатых, и угождающих плоти. На многих Он посылает болезни и бедствия, и через то невольно заставляет отказаться от такой жизни, по судьбам, по каким Сам знает, и приводит их на Свою вечерю, обращая в побуждение для них наведение бедствий. Примеров сему много.
      cn: 这晚宴每日都预备好了，我们所有人都被召入天国，就是上帝在创世以前就为人们预备好的（马太福音 25:34）。但我们不被配享此福，一部分人是出于对智慧的好奇（好学），另一些人是出于对物质的贪爱，还有一些人是出于对肉体的嗜好。而上帝的仁爱将此天国赐予其他的罪人，他们以理性的眼目而言是盲目的，不明白何为上帝的旨意，或者即便明白了，但对履行它而言却是瘸腿且不能动的；他们是贫穷的，如同失去了天上的荣耀；他们是残疾的（或「肢体不健全的」），如同未能彰显自身无瑕疵的生活。天父将祂的儿子——即那位按肉体成为仆人的——差派出去邀请这些在罪恶的宽阔广大的道路上徘徊的罪人来赴晚宴。祂来，不是召义人，乃是召罪人（马太福音 9:13），并丰盛地款待他们，以取代那些理智的、富有的和取悦肉体的人。祂将疾病和灾难降于许多人身上，并借此，按照祂自己知道的旨意，非自愿地迫使他们拒绝那样的生活，将降临的灾难转变为他们的激励因素，引他们来到祂的晚宴上。这方面的例子有很多。
  - type: paragraph
    text:
      ru: 'В более простом смысле, притча научает нас подавать лучше нищим и увечным, чем богатым. К чему Господь убеждал несколько выше, к тому самому, кажется, сказал и притчу сию, уверяя оною еще более, что угощать должно нищих. Научаемся (сей притчей) еще и другому, именно: что мы должны быть так усердны и щедры на принятие братьев (меньших), что должны убеждать их к участию в наших благах и тогда, когда они не желают. В этом для учителей сильное внушение, чтобы они наставляли учеников своих должному и тогда, когда сии не желают.'
      cn: '在一个更简易的意义上，该比喻教导我们要将好施予给贫者和残者，而非富人。主在稍早之处所力劝之事，看来祂正是为这同一件事说了这个比喻，并借此比喻来进一步确证，款待的对象应当是贫者。


        我们（通过此比喻）还被教导了另一件事，即：我们必须如此热切而慷慨地接纳（较小的）弟兄们，以至于当他们不情愿时，我们也应当说服他们来分享我们的福分。对于教师们而言，这是一个强有力的暗示，那就是他们应当在自己的学生不情愿时，也教导他们应行之事。'
  - type: paragraph
    initial:
      ru: 'Лк 14:25. '
      cn: （路加福音 14:25）
    text:
      ru: 'С Ним шло множество народа; и Он, обратившись, сказал им:'
      cn: 〇有多民与彼同行、而彼顾之曰、
  - type: paragraph
    initial:
      ru: 'Лк 14:26. '
      cn: （路加福音 14:26）
    text:
      ru: если кто приходит ко Мне и не возненавидит отца своего и матери, и жены и детей, и братьев и сестер, а притом и самой жизни своей, тот не может быть Моим учеником;
      cn: 若人来就我、而不厌恶其父母、妻子、兄弟、姊妹、及己之生命者、不得为我门徒、
  - type: paragraph
    initial:
      ru: 'Лк 14:27. '
      cn: （路加福音 14:27）
    text:
      ru: и кто не несет креста своего и идёт за Мною, не может быть Моим учеником.
      cn: 不负己之十字架而从我者、亦不得为我门徒、
  - type: paragraph
    text:
      ru: Поскольку из ходящих за Иисусом многие следовали не со всем усердием и самоотвержением, но имели очень холодное расположение, то Он, научая, каков должен быть ученик Его, высказывает Свои мысли о сем, как бы изображает и живописует его, утверждая, что он должен ненавидеть не только близких ему совне, но и«душу свою». Смотри же, в простоте своей и неопытности не соблазнись сим изречением. Ибо Человеколюбец не бесчеловечию учит, не самоубийство внушает, но хочет, чтобы искренний Его ученик ненавидел своих родных тогда, когда они препятствуют ему в деле богопочитания и когда он при отношениях к ним находит затруднения в совершении добра. Напротив, когда они не препятствуют сему, Он учит даже почитать их до последнего издыхания. И как учит? Самым лучшим учением, то есть собственными делами. Ибо Он повиновался Иосифу (Лк. 2, 51), несмотря на то, что сей не был отцом Его в собственном смысле, но мнимым. И о Матери Своей Он всегда имел большое попечение, так что и вися на кресте, Он не забыл Ее, но поручил возлюбленному ученику Своему (Ин. 19, 26–27). Как же Он, одному уча на деле иное будет внушать на словах? Нет, как я сказал. Он заповедует нам ненавидеть родителей тогда, когда они угрожают опасностью богопочтению. Ибо тогда они уже не родители, не родные, когда противодействуют нам в столь полезном деле. Утверждаемое нами видно и из того, что заповедуется ненавидеть«душу свою». Ибо этой заповедью, без сомнения, повелевается не убивать себя, но оставлять душевные пожелания, отлучающие нас от Бога, и не заботиться о душе (жизни), если предстоять будет мучение, лишь бы предлежало вечное приобретение. А что Господь сему научает, а не самоубийству, это Сам же Он показывает, во-первых, тем, что, когда диавол, искушая Его, предлагал Ему броситься вниз с кровли церковной, Он отверг искушение (Мф. 4, 5–7), и, во-вторых, тем, что Он не предавал Себя иудеям (каждый раз), но удалялся и, проходя посреди их, укрывался от убийц (Лк. 4, 30). Итак, кому родные вредят в деле богопочтения, и он, однако ж, с удовольствием продолжает расположение к ним, ставит оное выше благоугождения Богу, а иногда из любви к жизни, в случае угрозы мучения, склоняется к отречению от веры, – тот не может быть учеником Христовым.
      cn: 既然跟随耶稣的人中，许多人并非全然热心和自我牺牲地跟从，而是抱持着非常冷淡的态度，因此祂在教导祂的门徒应该如何时，便阐述了祂对此事的想法，仿佛是在描绘和刻画他的形象，断言他不仅应当「憎恶」他身外亲近的人，而且还应当憎恶「自己的灵魂」。请看，在你朴实和缺乏经验时，不要被这句经文所绊倒。因为那爱世人的主（Человеколюбец）教导的并非是不人道，也不是在暗示自杀，而是希望祂真诚的门徒憎恶他们的亲属，是在他们妨碍他敬拜上帝之事时，以及在他与他们相处时，发现行善有困难时。相反，当他们不阻碍此事时，祂甚至教导我们要敬重他们，直到最后一口气。祂是如何教导的呢？是用最好的教导，即用自己的行为。因为祂顺服约瑟（路加福音 2:51），尽管约瑟并非祂严格意义上的父亲，而只是名义上的。并且祂对自己的母亲始终抱有极大的关切，以至于祂在十字架上悬挂时，也没有忘记她，而是将她托付给了祂所爱的门徒（约翰福音 19:26-27）。既然祂在行为上教导此事，又怎会在言语上暗示别的事呢？绝不会，正如我所说。祂命令我们憎恶父母，是在他们危及我们对上帝的敬拜之时。因为那时，当他们在如此有益之事上与我们作对时，他们便不再是父母，不再是亲人了。我们所断言之事，从「憎恶自己的灵魂」的命令中也可看出。因为此命令无疑并非在吩咐我们自杀，而是要我们放弃那些将我们与上帝隔绝的属世欲望，并且在面临苦难时，若能获得永恒的益处，就不必顾惜灵魂（生命）。至于主是在教导此事，而非自杀，祂自己也表明了：首先，当魔鬼试探祂，怂恿祂从圣殿屋顶上跳下去时，祂拒绝了试探（马太福音 4:5-7）；其次，祂并非（每一次）都将自己交给犹太人，而是退去，穿过他们中间，躲避了那些杀害者（路加福音 4:30）。因此，如果亲属在敬拜上帝之事上损害了一个人，而他却仍乐于维持对他们的情谊，将其置于取悦上帝之上；又或者有时出于对生命的热爱，在面临苦难威胁时，倾向于背弃信仰——这样的人就不能成为基督的门徒。
  - type: paragraph
    initial:
      ru: 'Лк 14:28. '
      cn: （路加福音 14:28）
    text:
      ru: Ибо кто из вас, желая построить башню, не сядет прежде и не вычислит издержек, имеет ли он, что нужно для совершения ее,
      cn: 盖尔等中孰有欲建楼、不先坐、估计其费、果足、以竣事乎、
  - type: paragraph
    initial:
      ru: 'Лк 14:29. '
      cn: （路加福音 14:29）
    text:
      ru: дабы, когда положит основание и не возможет совершить, все видящие не стали смеяться над ним,
      cn: 恐置其基而不能成、见者皆哂之
  - type: paragraph
    initial:
      ru: 'Лк 14:30. '
      cn: （路加福音 14:30）
    text:
      ru: 'говоря: этот человек начал строить и не мог окончить?'
      cn: 曰此人作于始、乃不能成于终、
  - type: paragraph
    text:
      ru: 'Притчей о башне Господь научает нас, чтобы мы, однажды решившись следовать за Ним, сохранили сие самое намерение и не полагали одного только«основания», то есть следовать начали бы, а до конца не последовали, как неимеющие достаточного приготовления и усердия. Таковы были те, о коих евангелист Иоанн говорит:«многие из учеников Его отошли от Него»(Ин. 6, 66). И всякий человек, решившийся творить добродетель, но недостигший до Божественного знания, поскольку начал добродетель несовершенно и неразумно, строит несовершенно, так как не может достигнуть башни высокого знания. Почему и бывает посмешищем смотрящих на него людей и бесов. И иначе: под основанием можешь разуметь слово учительское. Ибо слово учителя, рассуждающее, например, о воздержании, брошенное на душу ученика, подобно основанию. На этом слове, как на основании, нужно и «построение», то есть совершение дел, чтобы «башня», то есть добродетель, которую мы вознамерились творить, была окончена у нас, и притом была крепка пред лицом неприятеля. А что слово есть основание, а дело – построение, сему довольно научает нас апостол, когда говорит:«Я... положил основание», Иисуса Христа,«а другой строит»(1Кор. 3, 10), и далее перечисляет различные построения (1Кор. 3, 12–15), то есть совершение дел или добрых, или злых. Итак, будем бояться, чтобы не стали над нами бесы смеяться, о которых пророк говорит:«дети(славянское –«ругателие»)будут господствовать над ними»(Ис. 3, 4), то есть отверженными от Бога.'
      cn: 主藉着关于塔的比喻教导我们：我们既已决心跟随祂，就应当持守这同一意图，不要只放下「根基」，也就是说，开始跟随却未曾跟随到底，如同那些没有充足准备和热忱的人。那些人正是传福音者伊鄂昂所说的：「祂的门徒中，有许多人退去了，不再与祂同行」（伊鄂昂福音 6:66）。凡决心行美德之人，若未达至神圣的知识，因他开始行美德是不完全且不理智的，他所建造的便是不完全的，因为他无法达到高深知识的塔。因此，他成了观看他的人和魔鬼的笑柄。另作他解：你可以将根基理解为教师的言语。因为教师的言语，例如，论述关于节制，投射在门徒的灵魂上，就如同根基。在这言语上，作为根基，还需要「建造」，即行为的完成，好使「塔」，亦即我们决心要行的美德，在我们身上得以完结，并且在仇敌面前是坚固的。至于言语是根基，行为是建造，使徒已充分教导我们，当他说道：「我……立了根基」，即耶稣基督，「另有人在上面建造」（哥林多前书 3:10），随后他列举了各种建造（哥林多前书 3:12-15），即行为的完成，或善或恶。因此，我们要警惧，免得魔鬼嘲笑我们，先知论及它们说：「儿童（斯拉夫语——「嘲弄者」）将要管辖他们」（以赛亚书 3:4），即那些被上帝弃绝的人。
  - type: paragraph
    initial:
      ru: 'Лк 14:31. '
      cn: （路加福音 14:31）
    text:
      ru: Или какой царь, идя на войну против другого царя, не сядет и не посоветуется прежде, силен ли он с десятью тысячами противостать идущему на него с двадцатью тысячами?
      cn: 或有王出、与他王会战、岂不先坐而运筹、率以一万卒、迎敌二万卒来攻者乎、
  - type: paragraph
    initial:
      ru: 'Лк 14:32. '
      cn: （路加福音 14:32）
    text:
      ru: Иначе, пока тот еще далеко, он пошлет к нему посольство просить о мире.
      cn: 不然、则彼尚远、遣老成使者求和、
  - type: paragraph
    text:
      ru: И эта притча научает нас не раздвояться душой, не пригвождаться к плоти и прилепляться к Богу, но, если имеем намерение вести войну против лукавых сил, наступать на них как на врагов и самым делом противоборствовать им.
      cn: 这一寓言也教导我们不可心怀二志，不可被钉附于肉体，而是要依恋于上帝。但是，如果我们有意愿对邪恶的势力开战，就当把它们视作仇敌，并以实际行动与之对抗。
  - type: paragraph
    text:
      ru: 'Царем бывает и грех, царствующий в смертном нашем теле (Рим. 6, 12), когда мы допускаем его. Царем же создан и ум наш. Поэтому, если он намерен восстать против греха, должен воевать против него всей душой, ибо воины его сильны и страшны, и кажутся больше и многочисленнее нас; поскольку воины греха суть бесы, которые против наших десяти тысяч направляют, по-видимому, двадцатитысячное число. Они же, будучи бестелесны и состязаясь с нами, живущими в теле, имеют, по-видимому, большую силу. Однако ж мы можем бороться против них, хотя они кажутся и сильнее нас. Ибо сказано:«С Богом мы окажем силу»(Пс. 59, 14) и«Господь – свет мой и спасение мое: кого мне бояться?... Если ополчится против меня полк, не убоится сердце мое»(Пс. 26, 1, 3). Притом же Бог, воплотившийся ради нас, дал нам«власть наступать... на всю силу вражью»(Лк. 10, 19). Поэтому мы, хотя и во плоти, однако ж, имеем оружие не плотское (2Кор. 10, 3–4). Хотя по причине телесности мы составляем, по-видимому, десять тысяч против их двадцати тысяч, по причине бестелесной их природы, однако ж мы должны говорить:«Господь Бог – сила моя»(Авв. 3, 19)!'
      cn: 罪恶也会成为君王，在我们的必死之身中掌权（罗马书 6:12），当我们容许它的时候。而我们的心智（ум）也被造为君王。因此，如果它打算起来反抗罪恶，就必须全心投入与罪恶的战争，因为罪恶的士兵强大且可怖，它们看起来比我们更大、数量更多；因为罪恶的士兵是魔鬼，它们针对我们的（一）万（人）似乎指向两万（人）的数量。它们既是无形体（бестелесны）的，又与生活在身体中的我们竞争，因此，它们表面上拥有更大的力量。然而，我们仍能与它们争战，尽管它们看似比我们更强大。因为经文说：「靠着神我们必得能力」（诗篇 59:14），又说：「上主是我的亮光，是我的拯救；我还怕谁呢？... 虽有军兵安营攻击我，我的心也不害怕」（诗篇 26:1，3）。此外，为我们道成肉身的神赐予了我们「制伏... 仇敌一切能力的权柄」（路加福音 10:19）。因此，我们虽然身在肉体之中，然而我们所用的兵器却不是属肉体的（哥林多后书 10:3-4）。虽然由于肉身性，我们表面上是（一）万（人）对阵它们两万（人）——由于它们无形体的本性，然而我们必须说：「主上主是我的力量」（哈巴谷书 3:19）！
  - type: paragraph
    initial:
      ru: 'Лк 14:33. '
      cn: （路加福音 14:33）
    text:
      ru: Так всякий из вас, кто не отрешится от всего, что имеет, не может быть Моим учеником.
      cn: 如是尔等中凡不舍其所有者、不得为我门徒、
  - type: paragraph
    text:
      ru: И никогда не должны примиряться с грехом, то есть порабощаться страстям, но с особенной силой противостоять им и должны возыметь непримиримую ненависть к ним, не желая ничего страстного в мире, но оставляя все. Ибо тот не может быть Христовым учеником, кто оставляет не все, но имеет расположение к чему-нибудь в мире душевредному.
      cn: 他们也绝不应与罪和解，即是说，不应受制于情欲，而当以特殊的力度抵挡情欲，并且应对情欲心怀不妥协的憎恶，不愿世间任何带有情欲的事物，而是离弃一切。因为，那没有离弃一切，却对世上任何损害灵魂的事物存有倾向的人，便不能成为基督的门徒。
  - type: paragraph
    initial:
      ru: 'Лк 14:34. '
      cn: （路加福音 14:34）
    text:
      ru: Соль – добрая вещь; но если соль потеряет силу, чем исправить ее?
      cn: 夫盐美矣、若失其味、以何为咸耶、
  - type: paragraph
    initial:
      ru: 'Лк 14:35. '
      cn: （路加福音 14:35）
    text:
      ru: ни в землю, ни в навоз не годится; вон выбрасывают ее. Кто имеет уши слышать, да слышит!
      cn: 不宜于田、不宜于粪、惟弃之于外、有耳得听者、宜听焉、
  - type: paragraph
    text:
      ru: 'Ученик Христов должен быть «солью», то есть должен быть не только сам в себе добр и непричастен злобе, но и другим сообщать доброту. Ибо такова соль. Она, сама оставаясь неповрежденной и свободной от гниения, предохраняет от гниения и другое, чему передает это свойство. Но если соль потеряет свою природную силу, она не бывает ни на что полезна,«не годится... ни в землю, ни в навоз». Слова сии имеют такой смысл: Я желаю, чтоб всякий христианин был полезен и силен назидать, не только тот, кому вверено дарование учительства, каковы были апостолы, учители и пастыри, но Я требую, чтоб и сами миряне были плодоносны и полезны для ближних. Если же имеющий служить на пользу другим сам будет негоден и выйдет из состояния, приличного христианину, то он не в состоянии будет ни принести пользы, ни получить пользы.«Ни в землю,– сказано, –ни в навоз не годится». Словом «земля» делается намек на получение пользы, а словом «навоз» («гной») – на доставление пользы. Поэтому, как не служащий на пользу, не получающий пользы, он должен быть отвергнут и выброшен вон.'
      cn: 基督的门徒应该成为「盐」，也就是说，他不仅自身应当是良善的，不卷入邪恶，而且也应该将良善传达给他人。因为盐就是如此。它自身保持完好无损，免于腐败，同时也保护其他被赋予此种特性的事物免于腐败。但是，如果盐失去了其天然的力量，它就一无是处，「不宜于田、不宜于粪」。这些话的含义是：我希望每一位基督徒都能有所裨益，有能力造就人，不仅是那些被托付了教导恩赐的人，比如使徒、教师和牧者，我也要求平信徒自己也能多结果子，对邻人有所裨益。然而，如果本该服务于他人利益的人自己变得毫无用处，脱离了基督徒应有的状态，那么他就既不能带来益处，也不能获得益处。「不宜于田，——经上说，——不宜于粪」。「田」这个词暗示着获取益处，而「粪」（「秽物」）这个词则暗示着提供益处。因此，既然他既不能服务于益处，也不能获得益处，他就应该被拒绝并被扔到外面。
  - type: paragraph
    text:
      ru: Поскольку же речь была темна и приточна, то Господь, возбуждая слушателей, чтоб они сказанное Им не приняли просто о соли, сказал:«кто имеет уши слышать, да слышит», то есть имеющий ум да разумеет. Ибо под «ушами» здесь должно разуметь чувственную силу души и способность к разумению. Итак, всякий из нас верующих есть соль, получивший сие свойство от Божественных слов и от благодати свыше. А что благодать есть соль, слушай (апостола) Павла:«Слово вашеда будетвсегда с благодатию, приправлено солью»(Кол. 4, 6), так что слово, когда оно без благодати, может быть названо бессолым. Итак, если мы будем пренебрегать сим свойством Божественных слов и не будем принимать оного в себя, и не освоимся с ним, тогда мы будем глупы и неразумны, и соль наша поистине потеряла силу, как неимеющая свойства небесной благодати.
      cn: 既然这番话语既隐晦又带有比喻性，主为激励听者，使他们不至于把祂所说的仅理解为盐，便说：「有耳得听者，宜听焉」，即是说，拥有心智的人，应当去理解。因为在此，「耳朵」应当被理解为灵魂的感知能力与理解力。因此，我们每一位信徒都是盐，从神圣的话语和来自上天的恩典中获得了这种性质。至于恩典是盐这一点，请听（使徒）保罗所言：「你们的言语总要带着恩典，用盐调和」（歌罗西书 4:6），因此，没有恩典的话语，可被称为是无盐的。因此，如果我们轻忽神圣话语的这一性质，不将之纳入自身，不熟悉之，那么我们就会变得愚拙和不智，而我们的盐就确实失去了效力，因为它不具备上天恩典的性质。
- type: heading1
  text:
    ru: Глава пятнадцатая
    cn: 第十五章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 15:1. '
      cn: （路加福音 15:1）
    text:
      ru: Приближались к Нему все мытари и грешники слушать Его.
      cn: 〇诸税吏及罪人近就彼、以听之、
  - type: paragraph
    initial:
      ru: 'Лк 15:2. '
      cn: （路加福音 15:2）
    text:
      ru: 'Фарисеи же и книжники роптали, говоря: Он принимает грешников и ест с ними.'
      cn: 而发利些乙及学士等怨之曰、彼纳罪人与之共食焉、
  - type: paragraph
    text:
      ru: Господь, допуская к Себе мытарей и грешников, как врач больных, делал то, для чего Он и воплотился. Но фарисеи, поистине грешники, на такое человеколюбие отвечали ропотом. Ибо они считали мытарей отвратительными, хотя сами поедали домы вдовиц и сирот.
      cn: 主，接纳税吏和罪人来到他身边，如同医生对待病人一样，他所行的正是他道成肉身的目的。但法利赛人，他们实为罪人，却以怨言回应这种仁爱。因为他们认为税吏是可憎的，尽管他们自己侵吞寡妇和孤儿的家产。
  - type: paragraph
    initial:
      ru: 'Лк 15:3. '
      cn: （路加福音 15:3）
    text:
      ru: 'Но Он сказал им следующую притчу:'
      cn: 彼向伊等设此譬喻曰、
  - type: paragraph
    initial:
      ru: 'Лк 15:4. '
      cn: （路加福音 15:4）
    text:
      ru: кто из вас, имея сто овец и потеряв одну из них, не оставит девяноста девяти в пустыне и не пойдет за пропавшею, пока не найдет ее?
      cn: 尔等中何人有百羊而亡其一、岂不舍九十九只于旷野、而往追其亡者、以至获之、
  - type: paragraph
    initial:
      ru: 'Лк 15:5. '
      cn: （路加福音 15:5）
    text:
      ru: А найдя, возьмет ее на плечи свои с радостью
      cn: 获之则喜、负于其肩、
  - type: paragraph
    initial:
      ru: 'Лк 15:6. '
      cn: （路加福音 15:6）
    text:
      ru: 'и, придя домой, созовет друзей и соседей и скажет им: порадуйтесь со мною: я нашел мою пропавшую овцу.'
      cn: 归家会集其友与邻、谓之曰、偕我同喜、因我将亡羊已获矣、
  - type: paragraph
    initial:
      ru: 'Лк 15:7. '
      cn: （路加福音 15:7）
    text:
      ru: Сказываю вам, что так на небесах более радости будет об одном грешнике кающемся, нежели о девяноста девяти праведниках, не имеющих нужды в покаянии.
      cn: 我告尔等、如是在天为一罪人悔改者、较为九十九不需改悔之义人、喜尤大也、
  - type: paragraph
    text:
      ru: Что же Господь? Он был человеколюбив как до мытарей, так и до тех самых, которые поносили Его человеколюбие. Он не отвращается и от сих, как от неисцелимых и ропотников, но с кротостью врачует их, сказывая им притчу об овцах, и от действительного и наглядного убеждая их и обуздывая не досадовать на такое излитие благости. Ибо если об одной овце, неразумной и несозданной по образу Божию, когда ее найдут после потери, бывает столько радости, то сколько же более должно быть радости о человеке разумном, сотворенном по образу Божию? Притча, очевидно, под девяносто девятью овцами разумеет праведников, а под одной овцой – падшего грешника. Некоторые же под сотней овец разумеют все разумные твари, а под одной овцой – человека разумной природы, которую, когда она заблудилась, взыскал добрый пастырь, оставив девяносто девять в пустыне, то есть в вышнем, небесном месте. Ибо небо, отдаленное от мирского треволнения и исполненное всякого мира и тишины, есть пустыня. Господь, найдя эту погибшую овцу, положил ее на Свои плечи. Ибо«Он... понес наши болезни»и грехи (Ис. 53, 4), и не тяготясь взял на Себя все наши бремена; Он уплатил все, чем мы должны были, и удобно и без труда спас нас (и довел) до самого дома, то есть до неба. И«созовет друзей и соседей», может быть, Ангелов, которых мы разумели и под овцами, в двояком отношении. Так как, с одной стороны, всякое созданное существо по отношению к Богу есть как бы бессловесное, поэтому Небесные силы могут быть названы овцами. Поскольку же, с другой стороны, они словесны, то есть разумны, и кажутся к Богу ближайшими прочих тварей, поэтому лики ангельских Сил можно разуметь под друзьями и соседями.
      cn: '那么主（Господь）呢？祂对税吏仁慈，对那些污蔑祂仁爱的人也同样仁慈。祂没有厌弃这些人，视他们为不可救药的、爱抱怨的，而是以温柔来医治他们，给他们讲述关于羊的比喻，借由实际和直观的事物来使他们信服，约束他们不要因这种恩惠的倾注而感到不悦。因为，若仅仅为了一只羊——一只不具备理性、并非按上帝的形象被造的羊——在失而复得时，就有如此大的喜乐，那么，为了一个具有理性、按上帝的形象被造的人，该有多少更大的喜乐呢？


        显然，这个比喻中的九十九只羊指的是义人，而那一只羊指的是堕落的罪人。不过，有些人认为一百只羊指的是所有有理性的受造物，而那一只羊指的是拥有理性本性的人类。当人类迷失时，那位好牧人就去寻找她，将九十九只羊撇在了旷野，也就是在至高之处、在天上的地方。因为，远离尘世纷扰、充满一切平安与静谧的天堂，就是旷野。


        主找到了这只失丧的羊，将她放在了自己的肩上。因为「祂……担当了我们的疾苦」和罪孽（以赛亚书 53:4），并且毫不费力地担起了我们所有的重担；祂偿清了我们所有的亏欠，并且轻易而毫不费力地拯救了我们，直到把我们带回家，也就是带到天上。


        祂「要召集朋友和邻居」，或许是天使们，我们在双重意义上将天使们也理解为羊。因为，从一方面来说，任何受造物相对于上帝而言，都是如同无言的（бессловесное），因此，天上的众能力可以被称为羊。而从另一方面来说，他们是有言语的（словесны），即具有理性的，并且看似比其他受造物更靠近上帝，因此，我们可以将天使众能力的队列理解为朋友和邻居。'
  - type: paragraph
    initial:
      ru: 'Лк 15:8. '
      cn: （路加福音 15:8）
    text:
      ru: Или какая женщина, имея десять драхм, если потеряет одну драхму, не зажжет свечи́ и не станет мести комнату и искать тщательно, пока не найдет,
      cn: 或何妇有十枚钱、失一枚、岂不燃灯扫室、切寻求以至获乎、
  - type: paragraph
    initial:
      ru: 'Лк 15:9. '
      cn: （路加福音 15:9）
    text:
      ru: 'а найдя, созовет подруг и соседок и скажет: порадуйтесь со мною: я нашла потерянную драхму.'
      cn: 获之则会己友与邻、谓之曰、偕我同喜、因我将所失之金钱已获矣、
  - type: paragraph
    initial:
      ru: 'Лк 15:10. '
      cn: （路加福音 15:10）
    text:
      ru: Так, говорю вам, бывает радость у Ангелов Божиих и об одном грешнике кающемся.
      cn: 我告尔等、在上帝之天神面前、为一悔改之罪人、有喜亦如是也、
  - type: paragraph
    text:
      ru: 'И под «женщиной» разумей премудрость и силу Бога и Отца, Его Сына, который потерял одну драхму из словесных и по образу Его созданных тварей, то есть человека, и засвечивает светильник – Свою плоть. Ибо как светильник, будучи от земли, светом, который он принимает, освещает покрытое тьмой; так и плоть Господа, земная и подобная нашей, осияла светом Божества которым она воспринята. И «дом выметен», то есть весь мир очистился от греха; ибо Христос взял грех мира на Себя. И «драхма», то есть царское изображение, «нашлась», и настала радость как для Самого Христа, нашедшего ее, так и для Горних Сил, которые суть подруги Его и соседки: «подруги», поскольку творят Его волю; «соседки», поскольку бестелесны. А я спрошу, не суть ли подруги Его – все Горние Силы, а соседки – ближайшие из них, как-то: престолы, херувимы и серафимы? Ибо обрати внимание на выражение:«созываетподруг и соседок». Оно, очевидно, указывает на два предмета, хотя это и может представиться не особенно нужным.'
      cn: 而「女人」这一称谓，你们当理解为上帝与父的智慧和能力，即祂的圣子。祂在口赋理性且照着祂的形象被造的受造物中，失去了一枚德拉克马，亦即人类，并点亮了灯——祂的肉身。因为，正如灯，虽属乎地，却以其所接受的光照亮了被黑暗遮蔽之处；同样，主的肉身，属乎地并与我们的肉身相似，却被祂所接受的神性的光所照耀。「房屋被打扫干净了」，即整个世界都已从罪恶中得到洁净；因为基督亲自背负了世人的罪恶。而「德拉克马」，即王室的形象，「被找到了」，因此带来了欢喜，不仅是对于找到它的基督自己，也对于天上的众能力——祂的「女友」和「邻舍」：「女友」，因为它们遵行祂的旨意；「邻舍」，因为它们是无形无体的。而我要问，难道祂的「女友」不就是所有的天上的能力，而「邻舍」不是它们之中最亲近的那些，比如：宝座、基路伯和撒拉弗吗？因为请留意这个表达：「她召集女友和邻舍」。这显然指向两个对象，尽管这可能看起来并不是特别必要的。
  - type: paragraph
    initial:
      ru: 'Лк 15:11. '
      cn: （路加福音 15:11）
    text:
      ru: 'Еще сказал: у некоторого человека было два сына;'
      cn: 〇彼曰、某人有二子、
  - type: paragraph
    text:
      ru: И эта притча подобна предыдущим. И она под образом человека выводит Бога воистину человеколюбивого; под двумя сыновьями – два разряда людей, то есть праведников и грешников.
      cn: 此比喻与之前的比喻相仿。它以「人」的形象引出了一位真正热爱人类的上帝；而以「两个儿子」引出了两类人，即义人与罪人。
  - type: paragraph
    initial:
      ru: 'Лк 15:12. '
      cn: （路加福音 15:12）
    text:
      ru: 'и сказал младший из них отцу: отче! дай мне следующуюмнечасть имения. Иотецразделил им имение.'
      cn: 其次子谓父曰、父欤、请以属我产业之分予我、彼遂以产业分伊等、
  - type: paragraph
    text:
      ru: 'Праведность есть древний удел человеческой природы, поэтому старший сын не вырывается из отеческой власти. А грех есть зло, впоследствии родившееся; поэтому и вырывается из-под родительской власти«младший»сын, который вырос с грехом, прившедшим впоследствии. И иначе: грешник называется «младшим» сыном, как нововводитель, отступник и возмутитель против отеческой воли.«Отче! дай мне следующуюмнечасть имения».«Имение»есть разумность, которой подчиняется и свобода. Ибо всякое разумное существо свободно. Господь дает нам разум, чтобы пользовались им свободно, как истинным нашим имением, и дает всем равно, ибо все равно разумны, самовластны. Но одни из нас пользуются сим достоинством согласно с назначением, а другие дарование Божие делают бесполезным.'
      cn: 公义是人类本性古老的份地，因此长子未曾脱离父权。而罪恶是后来才产生的邪恶；因此那与后来才引入的罪恶一同成长的「次子」，就脱离了父母的权柄。又以别的方式而言：罪人被称为「次子」，是因他是个创新者、叛教者，以及反抗父之旨意的煽动者。「父啊，请将属于我的一份家产分给我。」「家产」（Имение）即是理性（разумность），而自由也臣服于理性。因为凡是有理性的存在者都是自由的。主赐予我们理性，好叫我们自由地使用它，将其作为我们真实的家产；祂平等地赐予所有人理性，因为所有人都是同样有理性的、自主的。但我们中有一部分人依照其本意使用这尊荣，而另一部分人却使这神圣的恩赐变得毫无用处。
  - type: paragraph
    initial:
      ru: 'Лк 15:13. '
      cn: （路加福音 15:13）
    text:
      ru: По прошествии немногих дней младший сын, собрав всё, пошел в дальнюю сторону и там расточил имение свое, живя распутно.
      cn: 不久次子尽收所有、旅往远方、放荡度生、浪费其产业、
  - type: paragraph
    text:
      ru: 'Под «имением» нашим можно разуметь и все вообще, что Господь дал нам, именно: небо, землю, всякую вообще тварь, Закон, пророков. Но младший сын увидел небо, – и обоготворил оное; увидел землю, – и почтил ее, а в Законе Его не хотел ходить и пророкам делал зло. Старший же сын всем этим воспользовался во славу Божию. Господь Бог, дав (все) это в равной мере, позволил (каждому) ходить (жить) по своему произволению, и никого не желающего служить Ему не принуждает. Ибо, если бы хотел принуждать, то не сотворил бы нас разумными и свободными. Младший сын все это в совокупности«расточил». И что было причиной? То, что он«пошел в дальнюю сторону». Ибо когда человек отступит от Бога и удалит от себя страх Божий, тогда он расточает все Божественные дары. Будучи близки к Богу, мы ничего не делаем такого, что достойно погибели, по сказанному:«Всегда видел я пред собою Господа, ибо Онодеснуюменя; не поколеблюсь»(Пс. 15, 8). А удалившись и отступив от Бога, мы делаем и терпим всевозможное зло, по словам:«вот, удаляющие себя от Тебя гибнут»(Пс. 72, 27). Итак, неудивительно, что он расточил имение. Ибо добродетель имеет один предел и есть нечто единое, а злоба многочастна и производит много соблазна. Например, для мужества один предел, именно: когда, как и на кого должно употреблять гнев, а злобы два вида – страх и дерзость. Видишь ли, расточается разум и единство добродетели погибает?'
      cn: '我们借着「产业」（имением）可以理解到，凡是主赐予我们的一切，确切地说：天空、大地、以及一切受造之物、律法、先知。但是，次子看到了天空，——便将其神化；看到了大地，——便对其尊崇；然而他却不愿行在祂的律法中，并对先知们行恶。而长子却利用这一切来荣耀上帝。主上帝平等地赐予了（所有）这一切，并允许（每一个人）按着自己的意愿去行（生活），而且祂绝不强迫任何不愿事奉祂的人。因为，倘若祂想要强迫，祂就不会将我们创造成有理性和自由意志的。


        次子把所有这一切「挥霍」（расточил）殆尽。原因何在？原因是他「去了远方」（пошел в дальнюю сторону）。因为当一个人背离上帝并挪去对上帝的敬畏时，他就会挥霍所有来自神圣的恩赐。当我们亲近上帝时，我们绝不会做任何配得灭亡之事，正如所说的：「我常常将上主摆在我面前；因祂在我右边，我必不摇动。」（诗篇 15:8）。而当我们疏远并背离上帝时，我们就会行出并忍受一切可能的恶事，正如经文所言：「看哪，远离你的，必致灭亡」（诗篇 72:27）。


        因此，他挥霍了产业，这不足为奇。因为德行有一个界限，且是单一的，而邪恶却是多方面的，并产生许多的绊脚石。例如，对于「勇气」（мужества）而言，有一个界限，即：何时、如何以及对谁应当运用愤怒；然而「邪恶」却有两种形式——恐惧和鲁莽。你看到了吗，理性被挥霍了，德行的单一性也随之消亡了？'
  - type: paragraph
    initial:
      ru: 'Лк 15:14. '
      cn: （路加福音 15:14）
    text:
      ru: Когда же он прожил всё, настал великий голод в той стране, и он начал нуждаться;
      cn: 耗尽其一切、适在其地、起大饥馑、彼始觉窘困、
  - type: paragraph
    text:
      ru: Когда это имение расточено и человек не живет ни по разуму, то есть по естественному закону, не последует Закону писанному и пророков не слушает, тогда наступает (для него) сильный голод, не голод хлеба, но голод слышания слова Господня (Ам. 8, 11). И он начинает«нуждаться», поскольку не боится Господа, но далеко отстоит от Него, тогда как боящимся Господа«нет скудости»(Пс. 33, 10). Почему же нет скудости боящимся Господа? Так как боящийся Господа крепко любит заповеди Его, поэтому слава и богатство в доме его, и он скорее по своей воле расточает и дает убогим (Пс. 111:1, 3, 9). Так он далек от скудости! А кто далеко ушел от Бога и не имеет пред своими очами грозного Его лица, тот, неудивительно, будет испытывать нужду, поскольку в нем не действует никакое Божественное слово.
      cn: 当这产业被耗尽，人既不按照理性（即自然律法）生活，又不遵守成文的律法，且不听从先知的时候，强烈的饥荒（对他而言）就随之而来了，这不是面包的饥荒，而是听闻主话语的饥荒（阿摩司书 8:11）。他开始「觉窘困」，因为他不敬畏主，反而远离祂。而那敬畏主的人，「一无所缺」（诗篇 33:10）。为什么敬畏主的人不会有匮乏？因为敬畏主的人坚定地喜爱祂的诫命，因此荣耀和财富在他家中，他宁愿甘心乐意地耗散并施予穷乏人（诗篇 111:1，3，9）。他是何等地远离匮乏啊！而那远离上帝且眼中没有祂那可畏之面容的人，经历窘困就不足为奇了，因为在他里面没有任何神圣的言语起作用。
  - type: paragraph
    initial:
      ru: 'Лк 15:15. '
      cn: （路加福音 15:15）
    text:
      ru: и пошел,
      cn: 他便去了，
  - type: paragraph
    text:
      ru: То есть далеко зашел и укрепился в злобе,
      cn: 也就是说，他已深入，并在邪恶中巩固了自己，
  - type: paragraph
    text:
      ru: пристал к одному из жителей страны той,
      cn: 附着于那地方的一位居民，
  - type: paragraph
    text:
      ru: «Соединяющийся с Господом есть один дух с Господом», а«совокупляющийся с блудницею», то есть с природой бесов,«становится одно тело с нею»(1Кор. 6:17, 16), всецело делаясь плотью и не имея в себе места для Духа, подобно жившим во дни потопа (Быт. 6, 3). «Жители той страны», отдаленной от Бога, без сомнения, суть бесы.
      cn: 「与主联合的，便是与主成为一灵了」；而「与娼妓联合的」，亦即与诸魔的性情联合的，「便与她成为一体了」（哥林多前书 6:17，16）。这人完全化为肉体，在自己里面没有空间容纳圣灵，如同生活在大洪水时期的人们一样（创世记 6:3）。「那地的一民家」（指那远离上帝之地）的居民，无疑是诸魔。
  - type: paragraph
    text:
      ru: а тот послал его на поля свои пасти свиней;
      cn: 「那人就打发他往自己的田地里去牧放猪群；」
  - type: paragraph
    text:
      ru: 'Успев и сделавшись сильным в злобе, он «пасет свиней», то есть и других учит злобе и грязной жизни. Ибо все находящие удовольствие в тине бесчестных дел и вещественных страстей суть свиньи. Глаза свиные никогда не могут смотреть вверх, имея такое странное устройство. Почему и пасущие свиней, если, поймав свинью, долго не могут укротить ее визг, загибают ей голову назад и таким образом умеряют ее визг. Как человек, пришедший на такое зрелище, какого он никогда не видал, когда поднимает глаза (на сцену), бывает поражен и молчит, так глаза тех, кои воспитаны во зле, никогда не видят горнего. Сих-то пасет превосходящий многих во злобе, каковы: содержатели блудниц, начальники разбойников, мытарей. Ибо о всех такого рода людях можно сказать, что они пасут свиней.'
      cn: 成功并且在邪恶中变得强大之后，他「牧放着猪」，也就是说，他也教导其他人邪恶和肮脏的生活。因为所有那些在不光彩之事的淤泥和物质的激情中寻找乐趣的人，都是猪。猪的眼睛由于其奇特的构造，永远不能向上看。因此，牧放猪的人，如果抓住一只猪，长时间不能制止它的尖叫，就会把它的头向后弯曲，并以此来平息它的尖叫。就像一个人来到他从未见过的景象前，当他抬眼（看向舞台）时，会感到震惊并保持沉默一样，那些在邪恶中被教养之人，他们的眼睛也永远看不到天上的事物。邪恶超越许多人的人，牧放着这些人，例如：妓女的供养者、强盗的首领、税吏。因为对所有这类人，都可以说他们是在牧放猪。
  - type: paragraph
    initial:
      ru: 'Лк 15:16. '
      cn: （路加福音 15:16）
    text:
      ru: и он рад был наполнить чрево свое рожка́ми, которые ели свиньи, но никто не давал ему.
      cn: 欲以猪所食之豆荚充腹、而无人予之、
  - type: paragraph
    text:
      ru: 'Несчастный сей«желаетнасытиться» грехом, но никто не дает ему сего насыщения. Ибо привыкший к злу не находит насыщения в нем. Удовольствие непостоянно, но как приходит, с тем вместе и отходит, и несчастный сей опять остается с пустотой (на душе). Ибо грех подобен «рожкам», имея сладость и горечь: на время он услаждает, но мучит навеки. Никто не даст насытиться злом тому, кто услаждается им. Да и кто даст ему насыщение и покой? Бог? Но при нем нет Его; ибо питающийся злом уходит далеко от Бога. Бесы? Но как они дадут, когда они о том особенно и стараются, чтоб никогда не было покоя и насыщения от зла?'
      cn: 这不幸者「欲求」以罪恶为饱足，但无人予他此种饱足。盖因习于邪恶者，无法从中觅得饱足。欢愉乃变幻无常，其来也迅，其去亦疾，而这不幸者再次心存空虚（于灵魂中）。盖因罪恶如同「豆荚」，兼具甘甜与苦涩：其暂时令人愉悦，却永远折磨人心。无人会予那以邪恶为乐者饱足。到底谁会予他饱足与安宁呢？是上帝（上帝）吗？但上帝（上帝）并不在他身边；盖因以邪恶为食者，已远离上帝（上帝）。是魔鬼吗？但魔鬼如何能予他饱足与安宁？它们偏偏极力阻止人从邪恶中获得安宁与饱足。
  - type: paragraph
    initial:
      ru: 'Лк 15:17. '
      cn: （路加福音 15:17）
    text:
      ru: Придя же в себя,
      cn: 及至他省悟过来，
  - type: paragraph
    text:
      ru: 'Со временем распутный пришел в себя. Ибо доколе он жил развратно, он был вне себя. Говорится, что он расточил имение, и справедливо: поэтому он вне себя. Ибо кто не управляется разумом, но живет как неразумный и других доводит до неразумия, тот вне себя, и не останется при своем имении, то есть при разуме. Когда же кто сообразит, в какое он впал бедствие, тогда он приходит в себя чрез размышление и обращение от блуждания вовне к покаянию.'
      cn: 随着时间，那放荡者醒悟过来。因为当他活得淫荡时，他是在自己之外。经文说他挥霍了财产，这是公正的：因此他是在自己之外。因为那不受理性管辖，却像不具理性者一样生活，并将其他人带入不具理性状态的人，就是在自己之外，且不能保全他自己的财产，亦即他的理性。而当一个人省察他所陷入的灾祸时，他便借由思想，并从外在的迷失转向悔改，从而醒悟过来。
  - type: paragraph
    text:
      ru: 'сказал: сколько наемников у отца моего избыточествуют хлебом, а я умираю от голода;'
      cn: 曰：「我父如许佣工，其粮有余，而我却饥饿至死。」
  - type: paragraph
    text:
      ru: Под «наемниками», вероятно, разумеет оглашенных, которые, как еще непросвещенные, не успели еще сделаться сынами. А оглашенные, без сомнения, удовольствуются духовным хлебом с избытком каждодневно слушая чтения. И чтобы тебе знать различие между наемником и сыном, слушай. Три разряда спасающихся. Одни, как рабы, делают добро из страха суда. На это намекает Давид, когда говорит:«Трепещет от страха Твоего плоть моя, и судов Твоих я боюсь»(Пс. 118, 120). Другие – наемники; это, кажется, те, кои стараются благоугождать Богу из желания получить благо, как тот же Давид говорит:«Я приклонил сердце мое к исполнению уставов Твоих навек, до конца»(Пс. 118, 112). А третьи – сыны, то есть те, кои соблюдают заповеди Божии из любви к Богу, о чем опять тот же Давид свидетельствует:«Как люблю я закон Твой! весь день размышляю о нем»(Пс. 118, 97). И опять:«руки мои буду простирать к заповедям Твоим, которые возлюбил»(Пс. 118, 48), а не «которых убоялся». И еще:«Дивны откровения Твои», и поскольку дивны,«потому хранит их душа моя»(Пс. 118, 129). Итак, когда тот, кто находился в разряде сынов, но потом чрез грех лишился сыновства, увидит, что другие наслаждаются Божественными дарованиями, причащаются Божественных Тайн и Божественного хлеба (а под названием наемников можно разуметь не только оглашенных, но и вообще членов церкви, находящихся не в первом чине); тогда он должен сказать сам себе сии слова сожаления:«сколько наемников у отца моего избыточествуют хлебом, а я умираю от голода».
      cn: 在「佣人」之下，或许指的是那些慕道者，他们因为尚未蒙受启迪，还未成为儿子。而慕道者，毫无疑问，将因每日聆听经文诵读而满足于充裕的精神之粮。为了让你知晓佣人与儿子之间的区别，请听。得救者有三个类别。第一类，如同奴仆，出于对审判的惧怕而行善。大卫在说：「我的肉体因惧怕你而颤抖，我畏惧你的审判」（诗篇 118:120）时，即暗示了此意。第二类是佣人；这似乎是指那些出于渴望获得福祉而努力取悦上帝的人，正如同一位大卫所说：「我已倾心遵守你的律例，直到永远，到底」（诗篇 118:112）。而第三类是儿子，即那些出于对上帝的爱而遵守上帝诫命的人，对此，同一位大卫再次见证说：「我何等爱慕你的律法！我终日思想」（诗篇 118:97）。又说：「我要向我所爱慕的你的诫命伸手」（诗篇 118:48），而不是「我所惧怕的诫命」。再有：「你的启示是奇妙的」，正因为是奇妙的，「所以我的灵魂遵守」（诗篇 118:129）。因此，当那个曾处于儿子之列、但随后因犯罪而丧失子嗣身份的人，看到其他人正在享用神圣的恩赐，领受神圣的奥秘和神圣的饼（并且在佣人之名下，不仅可以理解为慕道者，也可以理解为通常的教会成员，他们并非处于首要的等级）；那时，他应该对自己说出这些哀叹之词：「我父如许佣人、其粮有余、而我饿死乎」（路加福音 15:17）。
  - type: paragraph
    initial:
      ru: 'Лк 15:18. '
      cn: （路加福音 15:18）
    text:
      ru: встану,
      cn: 我将起身，
  - type: paragraph
    text:
      ru: То есть от падения греховного.
      cn: 也就是说，是自罪恶的堕落（中起来）。
  - type: paragraph
    text:
      ru: 'пойду к отцу моему и скажу ему: отче! я согрешил против неба и пред тобою'
      cn: 我起而往就我父、向之曰、父欤、我获罪于天、及尔面前、
  - type: paragraph
    text:
      ru: Оставив небесное, я согрешил против оного, предпочтя ему презренное удовольствие, и вместо неба, своего отечества, выбрав лучше страну голодную. Ибо как тот, можно сказать, грешит против золота, кто предпочитает ему свинец, так тот грешит против неба, кто предпочитает ему земное. Ибо он, без сомнения, удаляется от пути, ведущего на небо. И заметь, что когда он грешил, тогда делал грех как бы не пред Богом, а когда раскаивается, тогда чувствует себя согрешившим пред Богом.
      cn: 我撇弃了天上的事物，我冒犯了它，宁可选择那被鄙视的享乐，并且取代了我的家乡——天国，而选择了饥荒之地。因为，就好比可以说，那宁愿选择铅而非黄金的人，是冒犯了黄金；同样，那宁可选择地上事物而非天上事物的人，是冒犯了天国。因为他无疑是偏离了通往天国的道路。并且请注意：当他犯罪时，他好像不是在上帝面前行罪；而当他悔改时，他才感觉到自己是在上帝面前犯了罪。
  - type: paragraph
    initial:
      ru: 'Лк 15:19. '
      cn: （路加福音 15:19）
    text:
      ru: и уже недостоин называться сыном твоим; прими меня в число наемников твоих.
      cn: 我已不堪称为尔子、作我如尔佣人之一、
  - type: paragraph
    initial:
      ru: 'Лк 15:20. '
      cn: （路加福音 15:20）
    text:
      ru: Встал и пошел к отцу своему.
      cn: 乃起而就其父、尚在远之时、其父见而怜悯之、趋抱其颈口亲之、
  - type: paragraph
    text:
      ru: Ибо нам должно не только желать того, что угодно Богу, но и самым делом исполнять.
      cn: 诚如狄奥菲拉克之言，我们不仅应该意愿那蒙上帝悦纳之事，更当以实际行动去履行。
  - type: paragraph
    text:
      ru: И когда он был еще далеко, увидел его отец его и сжалился; и, побежав, пал ему на шею и целовал его.
      cn: '圣奥赫里德的狄奥菲拉克


        当他还在远处的时候，他父亲看见了他，就动了怜悯之心；于是跑上前去，伏在他的颈项上，连连亲吻他。'
  - type: paragraph
    initial:
      ru: 'Лк 15:21. '
      cn: （路加福音 15:21）
    text:
      ru: 'Сын же сказал ему: отче! я согрешил против неба и пред тобою и уже недостоин называться сыном твоим.'
      cn: 子向之曰、父欤、我获罪于天、及尔面前、我已不堪称为尔子、
  - type: paragraph
    text:
      ru: Ты видел теперь теплое покаяние, посмотри же и на милосердие отца, Он не дожидается, пока сын дойдет до него, но сам спешит навстречу и обнимает его. Ибо, будучи по природе Отцом, Бог есть Отец и по благости. Он весь всего обнимает сына, чтобы со всех сторон соединить его с Собой, как сказано:«и слава Господня будет сопровождать тебя»(Ис. 58, 8). Прежде, когда сын сам удалялся, время было и отцу удалиться от объятия. А когда сын приблизился чрез молитву и обращение, тогда благовременно стало и обнять его. Отец«пал... на шею»сыну, показывая, что она, непокорная прежде, стала ныне покорной, и«целовал его», обозначая примирение и освящая уста прежде осквернившегося, как бы некое преддверие, и чрез них ниспосылая освящение и вовнутрь.
      cn: 你现在看到了热切的忏悔，那就再看看父亲的慈悲吧。他没有等着儿子走到他面前，而是自己快步迎上前去，拥抱了他。因为，上帝既然在本质上是父，祂也是按着良善成为父的。祂以全然的自己拥抱了儿子，好将他从四面八方与祂自身联合起来，正如经上所说：（以赛亚书 58:8）：「上主的荣光必作你的后盾。」从前，当儿子自己远离时，父亲也到了该收回拥抱的时候。而当儿子藉着祷告和回转而靠近时，那时拥抱他也就合乎时宜了。父亲「抱在……颈项上」，表明颈项先前虽然不顺服，如今却变得顺服了，并且「亲吻了他」，意指和解，并圣化了那先前受到玷污的口唇，如同某一个前厅，并藉着它们将圣化也传送到内部。
  - type: paragraph
    initial:
      ru: 'Лк 15:22. '
      cn: （路加福音 15:22）
    text:
      ru: 'А отец сказал рабам своим: принесите лучшую одежду и оденьте его,'
      cn: 父命其诸仆曰、取至美之服衣之、施戒指于其手、而履其双足、
  - type: paragraph
    text:
      ru: Под «рабами» можешь разуметь Ангелов, так как они суть служебные духи, посылаемые на служение для достойных спасения (Евр. 1, 14), Ибо они обращающегося от злобы одевают в«лучшую одежду», то есть или в прежнюю, которую мы носили прежде греха, одежду нетления, или в одежду лучшую всех прочих, какова одежда крещения. Ибо она первая надевается на меня, и чрез нее я снимаю с себя одежду неприличия, Под «рабами» можешь разуметь Ангелов и потому, что они служат при всем том, что совершается ради нас, и что мы освящаемся при посредстве их. Под «рабами» можешь разуметь и священников, так как они обращающегося одевают чрез крещение и учительское слово и надевают на него первую одежду, то есть Самого Христа. Ибо все мы, крестившиеся во Христа, облеклись во Христа (Гал. 3, 27).
      cn: '你可以理解「诸仆」（раб，复数作「奴仆」/「仆人」解）是指天使们，因为他们是受差遣，为那配得救恩的人服务的灵（希伯来书 1:14）。


        因为他们使那从恶行中回转的人穿上「至美的服」（лучшую одежду，直译作「更好的服」/「上好的服」）。这「至美的服」或是指我们在犯罪之前所穿的，不朽坏的服饰，或是指一件比所有其他服饰都更优良的服饰，例如施洗的服饰。因为这施洗的服饰是首先穿在我身上的，并且借着它，我脱去了不体面的服饰（одежду неприличия，直译作「不得体的服饰」）。


        你也可以理解「诸仆」是指天使们，因为他们在凡为我们成就的事上服侍，并且我们是借着他们的中介而得以成圣的。


        你也可以理解「诸仆」是指祭司们（священников），因为他们借着施洗和教导的圣言（учительское слово，直译作「教师的言语」）使那回转的人穿衣，并使他穿上第一件服饰（первую одежду），也就是基督自己。因为我们所有受洗归入基督的人，都已穿上了基督（加拉太书 3:27）。'
  - type: paragraph
    text:
      ru: и дайте перстень на руку его
      cn: 取戒指（戴）在其手上
  - type: paragraph
    text:
      ru: 'И дает«перстень на руку», то есть печать христианства, которую мы получаем чрез дела. Ибо рука есть знак деятельности, а перстень – печати. Итак, крестившийся и вообще обращающийся от злобы, должен иметь на руке, то есть на всей деятельной силе, печать и признак христианина, чтобы мог показать, как обновился по образу создавшего его. Или иначе: под «перстнем» можешь разуметь залог Духа. Скажу так: Бог даст совершеннейшие блага тогда, когда наступит их время, а ныне, для уверения, как бы в виде залога будущих благ, дает нам такого рода дарования: одним – дар чудотворения, другим – дар учительства, иным – другой какой-нибудь дар. Принимая сии дары, мы с твердостью уповаем и на получение совершеннейших.'
      cn: '并戴上「戒指在手上」（перстень на руку），即基督教的印记（печать христианства），我们是藉着行为（чрез дела）获得的。因为手是活动的标志，而戒指是印记。因此，受洗（крестившийся）的和总的来说从邪恶中转回（обращающийся от злобы）的人，必须在手上，即在整个活动力量（всей деятельной силе）上，拥有基督徒的印记和记号，以便他能展示他如何按照创造他者（создавшего его）的形象更新了。


        或者，从另一角度说：你可以在「戒指」（перстень）之下理解为圣灵的定金（залог Духа）。我可以这样说：当其时机来临时，上帝将会赐予那最完全的福益，而现在，为了使我们确信，祂如同未来福益的定金一般，赐予了我们此类恩赐：对某些人——施行神迹的恩赐，对另一些人——教诲的恩赐，对再一些人——其他任何一种恩赐。我们接受了这些恩赐，便能坚实地仰望获得那最完全的福益。'
  - type: paragraph
    text:
      ru: и обувь на ноги;
      cn: 而履其双足、
  - type: paragraph
    text:
      ru: 'Дается«обувь на ноги», чтобы они сохранились как от скорпионов, то есть от погрешностей, по-видимому, малых и тайных, как говорит Давид (Пс. 18, 13), однако ж, и тех смертоносных, так и от змей, считаемых видимо вредными, то есть от грехов. И иначе: удостоенному первой одежды дается обувь в знак того, что Бог делает его готовым благовествовать и служить на пользу другим. Ибо отличительное свойство христианина быть полезным для других.'
      cn: '赐予「鞋履于双足」，为的是使他们能免受蝎子的侵害，即是免受那些表面上微小而隐秘的过失的侵害，正如大卫所言（诗篇 18:13），然而，这些过失却是致命的；同样也免受那些被视为明显有害的蛇的侵害，即是免受罪孽的侵害。


        此外，另一种解释是：对那些蒙配得穿上第一件袍服的人，赐予鞋履，是为着一个记号，即是上帝使其准备好去宣扬福音并为益于他人而服务。因为基督徒的独特品性便是对他人有益。'
  - type: paragraph
    initial:
      ru: 'Лк 15:23. '
      cn: （路加福音 15:23）
    text:
      ru: и приведите откормленного теленка, и заколите; станем есть и веселиться!
      cn: 牵肥犊宰之、我侪食而欢喜、
  - type: paragraph
    text:
      ru: Кто есть«упитанный... телец», закалаемый и едомый, это не трудно понять. Он есть, без сомнения, истинный Сын Божий. Поскольку Он Человек и принял на Себя плоть, по природе неразумную и скотоподобную, хотя и наполнил ее собственными совершенствами, поэтому назван Тельцом. Телец Сей не испытал ярма закона греховного, но есть Телец «откормленный», поскольку определен на сие Таинство«прежде создания мира»(1Пет. 1, 20). Быть может, покажется изысканным то, что еще имеет быть сказано, однако ж, пусть будет сказано. Хлеб, который мы ломим, по виду своему состоит из пшеницы, поэтому может быть назван откормленным пшеницей, а по духовной стороне есть Плоть, поэтому может быть назван Тельцом, и таким образом Один и Тот же есть Телец и упитанный.
      cn: 谁是「养肥了的……牛犊」，被宰杀和吃掉，这不难理解。他毫无疑问就是上帝的真儿子。既然他是人，并且取了肉身——这肉身本质上是不理性的、像牲畜一样的，尽管他用他自己的美善将其充满——因此他被称为牛犊。这牛犊没有经历罪恶律法的轭，但他却是「养肥了的」牛犊，因为他在「创世以前」（彼得前书 1:20）就被定规用于此项奥秘。或许，接下来要说的内容会显得有些精巧，但还是说出来吧。我们所擘开的饼，从其表相来看，是由小麦组成的，因此可被称为由小麦养肥了的；而从属灵的层面来看，它就是（主的）身体，因此可被称为牛犊；这样一来，同一位既是牛犊，也是养肥了的。
  - type: paragraph
    initial:
      ru: 'Лк 15:24. '
      cn: （路加福音 15:24）
    text:
      ru: ибо этот сын мой был мертв и ожил, пропадал и нашелся. И начали веселиться.
      cn: 因我此子死而复苏、失而又得矣、众渐欢喜、
  - type: paragraph
    text:
      ru: Итак, всякий кающийся и делающийся сыном Божиим, особенно же восставленный и вообще от греха очищаемый, причащается Сего упитанного Тельца и бывает причиной веселья для Отца и рабов Его, Ангелов и священников:«Ибо был мертв и ожил, пропадал и нашелся». В том отношении, что он пребывает во зле, он«был мертв», то есть безнадежен, а по отношению к тому, что природа человеческая удобопреклонна и от злобы может обратиться к добродетели, он называется «пропадавшим». Ибо слово «потерявшийся» умереннее, чем «мертвый».
      cn: '所以，每一个悔改并成为上帝之子的人，尤其是那被扶起、并通常从罪中被洁净的人，分享着这头肥壮的牛犊，并成为了祂的父和祂的仆人们——天使们和祭司们——喜乐的原因：「因他曾是死的，而今活了；曾是失丧的，而今被找到了。」


        就他留于邪恶之中而言，他「曾是死的」，即毫无希望的；而就人性的本质易于倾斜且能从恶毒转向美德而言，他被称为「失丧的」。因为「失丧的」一词比「死的」一词更温和。'
  - type: paragraph
    initial:
      ru: 'Лк 15:25. '
      cn: （路加福音 15:25）
    text:
      ru: Старший же сын его был на поле; и возвращаясь, когда приблизился к дому, услышал пение и ликование;
      cn: 其长子在田、归近家、则闻乐舞、
  - type: paragraph
    initial:
      ru: 'Лк 15:26. '
      cn: （路加福音 15:26）
    text:
      ru: 'и, призвав одного из слуг, спросил: что это такое?'
      cn: 召一仆问曰、斯乃何事、
  - type: paragraph
    initial:
      ru: 'Лк 15:27. '
      cn: （路加福音 15:27）
    text:
      ru: 'Он сказал ему: брат твой пришел, и отец твой заколол откормленного теленка, потому что принял его здоровым.'
      cn: 仆曰、尔弟归、尔父已宰肥犊、因得之无恙、
  - type: paragraph
    initial:
      ru: 'Лк 15:28. '
      cn: （路加福音 15:28）
    text:
      ru: Он осердился и не хотел войти. Отец же его, выйдя, звал его.
      cn: 乃发怒、而不欲入、其父出劝之、
  - type: paragraph
    initial:
      ru: 'Лк 15:29. '
      cn: （路加福音 15:29）
    text:
      ru: 'Но он сказал в ответ отцу: вот, я столько лет служу тебе и никогда не преступал приказания твоего, но ты никогда не дал мне и козлёнка, чтобы мне повеселиться с друзьями моими;'
      cn: 彼对其父曰、顾、我事尔多年、未尝违尔命、尔未以山羊羔赐我、俾我与友共乐、
  - type: paragraph
    initial:
      ru: 'Лк 15:30. '
      cn: （路加福音 15:30）
    text:
      ru: а когда этот сын твой, расточивший имение своё с блудницами, пришел, ты заколол для него откормленного теленка.
      cn: 此子乃挟妓、耗尽尔产业者、来时、则尔为之宰肥犊也、
  - type: paragraph
    initial:
      ru: 'Лк 15:31. '
      cn: （路加福音 15:31）
    text:
      ru: 'Он же сказал ему: сын мой! ты всегда со мною, и всё мое твое,'
      cn: 彼对之曰、子尔常偕我、我所有者皆属尔、
  - type: paragraph
    initial:
      ru: 'Лк 15:32. '
      cn: （路加福音 15:32）
    text:
      ru: а о том надобно было радоваться и веселиться, что брат твой сей был мертв и ожил, пропадал и нашелся.
      cn: 当欣喜快乐、因尔此弟死而复苏、失而又得矣、
  - type: paragraph
    text:
      ru: 'Здесь дают пресловутый вопрос: как оказывается завистливым сын, который в прочих отношениях жил и служил отцу благоугодно? Но он решится, коль скоро сообразят, почему была сказана сия притча. Притча эта вместе с предыдущими сказана была, без сомнения, потому, что фарисеи, считавшие себя чистыми и праведными, роптали на Господа за то, что Он принимал блудниц и мытарей. Если же она сказана потому, что роптали фарисеи, которые, по-видимому, были праведнее мытарей, то смотри, что лицо сына, по-видимому, ропщущего, относится ко всем, кои соблазняются внезапным благополучием и спасением грешников. А это не есть зависть, но излитие человеколюбия Божия, непонятное для нас, а потому рождающее ропот. И Давид не выводит ли лица соблазняющихся миром грешников (Пс. 72, 3), подобно так и Иеремия, когда говорит:«почему путь нечестивых благоуспешен»?«Ты насадил их, и они укоренились»? (Иер. 12, 1–2). Все это свойственно слабому и бедному уму человеческому, который возмущается и приходит в недоумение при виде недостоинства, именно: благополучия людей порочных. Поэтому Господь настоящей притчей как бы так говорит фарисеям: пусть так, что вы, подобно этому сыну, праведны и благоугодны пред Отцом; но Я прошу вас, праведных и чистых, не роптать на то, что мы устрояем веселие за спасение грешника, ибо и он сын же. Итак, отсюда не зависть обнаруживается, но сей притчей Господь вразумляет фарисеев, чтобы они не досадовали на принятие грешников, хотя бы сами и были праведны и соблюдали всякую заповедь Божию. И нимало не удивительно, если мы огорчаемся принятием тех, кои кажутся недостойными. Человеколюбие Божие так велико и так обильно подает нам свои блага, что отсюда и ропот может родиться. Так мы говорим и в обычной беседе. Часто оказав кому-нибудь благодеяние, потом не получив благодарности от него, мы говорим: все порицают меня за то, что я так много облагодетельствовал тебя. Хотя, может быть, и никто не порицал нас, но, желая показать величие благодеяния, мы выдумываем это.'
      cn: "此处提出了那个为人熟知的问题：那个在其他方面生活且服事父神都合宜悦纳的儿子，怎么会表现出妒忌呢？然而，一旦人们联想到为何讲说这个比喻，这个问题就迎刃而解了。\n\n    这个比喻与前述的比喻无疑都是因为以下原因而被讲说的：那些自视清净公义的法利赛人，对主接纳娼妓和税吏的行为发出了怨言。\n\n    既然这个比喻是因为法利赛人（他们表面上比税吏更公义）的怨言而讲说的，那么请看：那个表面上发怨言的儿子的角色，所指代的是所有那些因罪人突然获得的福乐与拯救而感到困惑的人。而这并非妒忌，而是神的人爱世人（humanity）的流露，这对于我们而言是不可理解的，因此产生了怨言。\n\n    大卫（Ps. 72, 3）不也是引出了那些因罪人的安逸而感到困惑的人的角色吗？耶利米（以弗所书 12:1-2）亦是如此，他说道：「恶人的道路为何亨通呢？」「你栽植了他们，他们便扎根了。」所有这一切都属于人类那软弱而贫乏的心智，当它看到不配（undeservingness）——即那些邪恶之人的福乐——时，便感到愤慨和困惑。\n\n    因此，主用这个现前的比喻，似乎是这样对法利赛人说的：姑且认为你们如同这个儿子一样，在父面前是公义且蒙悦纳的；但我恳求你们这些公义而清净的人，不要为我们因罪人得救而设宴欢乐之事发怨言，因为他也是个儿子。因此，由此揭示的并非妒忌，而是主借此比喻告诫法利赛人，即使他们自己是公义的，且遵守了神的每一条诫命，他们也不应为接纳罪人而感到恼怒。\n\n    倘若我们对那些看似不配之人被接纳感到不悦，这丝毫不足为奇。神对人爱世人之心是如此之大，如此丰盛地赐予我们他的福祉，以至于由此也可能产生怨言。\n\n    我们在日常交谈中也是这样说的。我们常常在施恩予某人之后，却没有得到他的感谢，于是我们会说：「所有人都指责我，说我不该如此厚待你。」虽然可能根本没有人指责我们，但为了彰显恩惠的重大，我们编造出这种说法。"
  - type: paragraph
    text:
      ru: 'Рассмотрим же эту притчу по частям и как бы в кратком извлечении.«Старший... сын былна поле», то есть в мире сем, возделывал свою землю, то есть плоть, чтобы она изобиловала хлебами, и сеял со слезами, чтобы пожать с весельем (Пс. 125, 5). Узнав о случившемся, он не хотел войти в общую радость. Но человеколюбивый Отец выходит, зовет его и сообщает ему, что причиной веселья является оживление мертвого, чего тот не знал, как человек соблазняющийся и обвиняющий Отца за то, что Он«не далемуи козленка», а для распутного заколол откормленного теленка. Что обозначается «козленком»? Можешь узнать из того, что всякий козленок причисляется к стороне левой и стороне грешников (Мф. 25:33, 41). Итак, добронравный говорит Отцу: я проводил жизнь во всяком труде, терпел гонения, неприятности, оскорбления от грешников, и Ты никогда не заколол для меня и не убил козленка, то есть оскорбляющего меня грешника, чтобы я мог найти малую приятность. Например, Ахав был козел по отношению к Илии. Он гнал пророка, но Господь не предал тотчас сего козла на заклание, чтобы немного обрадовать Илию и успокоить с друзьями его пророками. Поэтому (Илия) и говорит Богу:«разрушили жертвенники Твои и пророков Твоих убили»(3Цар. 19, 14). По отношению к Давиду козлом был Саул и все клевещущие на него, которым Господь позволял искушать его, но которых не убивал для удовольствия Давида. Поэтому сей и говорит:«Доколе, Господи, нечестивые, доколе нечестивые торжествовать будут?»(Пс. 93, 3). Так и сей, представляемый в Евангелии, сын говорит: который постоянно в трудах, того ты не удостоил никакого утешения, ни даже не предал на заклание никого из оскорбляющих меня, а теперь так, без труда, спасаешь распутного! Итак, вся цель притчи сей, сказанной по поводу ропота фарисеев на Господа за принятие им грешников, состоит в том, чтобы научить нас не отвергать грешников и не роптать, когда Бог принимает их, хотя бы мы были и праведны. Младший сын – блудницы и мытари; старший сын – фарисеи и книжники, предположительно принимаемые за праведных. Бог как бы так говорит: пусть вы, действительно, праведны и не преступали никакого повеления, но неужели же не должно принимать тех, кои обращаются от зла? Подобных ропотников вразумляет Господь настоящей притчей.'
      cn: 让我们来分段、并以简短摘要的方式考察这个比喻。「长子……在田里」，即在今世中，耕耘着他的土地，即他的肉身，好让它盛产五谷，流泪撒种，好能欢呼收割（诗篇 125:5）。得知发生的事后，他不想进去分享这份共同的喜乐。但仁慈的父亲出来了，呼唤他，并告诉他：欢庆的原因是死而复生，这是他所不知道的，因为他是一个感到愤慨并指责父亲的人，指责祂「不给[他]一只山羊羔」，却为这个放荡之子宰杀了那只肥牛犊。「山羊羔」指的是什么？你可以从以下事实得知：所有的山羊羔都被归入左边，归入罪人的那一边（马太福音 25:33，41）。因此，这位品行优良的儿子对父亲说：我一生都在劳苦中度过，忍受了罪人的逼迫、不悦和侮辱，而您却从未为我宰杀或杀死一只山羊羔，即侮辱我的罪人，好让我能找到一丝愉悦。例如，亚哈对于以利亚而言就是一只山羊。他逼迫了这位先知，但主并没有立刻将这只山羊交付宰杀，好稍微取悦以利亚，并让他与他的先知朋友们一起安息。因此（以利亚）对上帝说：「他们拆毁了你的坛，用刀杀了你的众先知」（列王纪上 19:14）。对于大卫而言，扫罗和所有诽谤他的人都是山羊，主允许他们试探他，但却没有为了大卫的快乐而杀死他们。因此，他说：「上主啊，恶人夸胜要到几时呢？要到几时呢？」（诗篇 93:3）。同样，这位在福音书中被描绘的儿子说：对于那个持续劳苦的人，您不曾施予任何安慰，甚至没有将侮辱我的任何一人交付宰杀，但现在，您却如此不费力地拯救了这个放荡之子！因此，这个比喻的全部目的——该比喻是因着法利赛人对主接纳罪人而发的怨言所说的——在于教导我们，即便我们是义人，也不应拒绝罪人，也不应在上帝接纳他们时发怨言。小儿子是娼妓和税吏；大儿子是法利赛人和文士，他们被假定为义人。上帝仿佛这样说：即便你们确实是义人，并未违背任何诫命，但难道就不该接纳那些回头弃恶的人吗？主正是以这个比喻来开导那些类似的抱怨者。
  - type: paragraph
    text:
      ru: 'Небезызвестно мне, что некоторые под старшим сыном разумели Ангелов, а под младшим – природу человеческую, возмутившуюся и не покорившуюся данной заповеди. Другие разумели под старшим израильтян, а под младшим – язычников. Но истинно то, что мы сейчас сказали, именно: что старший сын представляет собой лицо праведных, а младший – грешников и раскаивающихся, и все построение притчи составилось из-за фарисеев, которым Господь внушает, что они, хотя бы сами были и праведны, не должны огорчаться принятием грешников. Итак, никто да не оскорбляется судьбами Божиими, но да терпит и в том случае, когда делаются счастливыми и спасаются, по-видимому, грешники. Ибо почему знаешь? Может быть, тот, кого ты считаешь грешником, принес покаяние, и за то принят. А также быть может, что он имеет тайные добродетели, и ради их благоприятен в очах Божиих.'
      cn: '我深知（Небезызвестно мне）有些人认为（разумнели）长子（старшим сыном）指的是天使（Ангелов），而幼子（младшим）指的是人类本性（природу человеческую），后者叛逆（возмутившуюся）且不顺服所颁布的诫命（данной заповеди）。另一些人（Другие）认为长子指的是以色列人（израильтян），而幼子指的是外邦人（язычников）。


        但我们刚才所说的才是真理（истинно то, что мы сейчас сказали），即：长子代表（представляет собой лицо）义人（праведных）的位格（лицо），而幼子代表罪人（грешников）和悔改者（раскаивающихся），并且整个比喻的结构（все построение притчи）是为了法利赛人（фарисеев）而构成的（составилось из-за）。主（Господь）向他们教导（внушает），他们即便自己是义人（хотя бы сами были и праведны），也不应为接受罪人而悲伤（не должны огорчаться принятием грешников）。


        因此，无人（никто）应当被上帝的判决（судьбами Божиими）所冒犯（да не оскорбляется），而应当忍耐（да терпит），甚至在罪人看似（по-видимому）变得幸福并得救时（когда делаются счастливыми и спасаются）也是如此。因为你怎么知道呢（Ибо почему знаешь）？也许那个你认为是罪人的人已经悔改了（принес покаяние），因此才被接纳（за то принят）。此外，也许他拥有隐秘的美德（тайные добродетели），并因此在上帝眼中是蒙悦纳的（ради их благоприятен в очах Божиих）。'
- type: heading1
  text:
    ru: Глава шестнадцатая
    cn: 第十六章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 16:1. '
      cn: （路加福音 16:1）
    text:
      ru: 'Сказал же и к ученикам Своим: один человек был богат и имел управителя, на которого донесено было ему, что расточает имение его;'
      cn: 〇彼又谓其门徒曰、某富人有管家、乃被人诉告之、以其耗费其产业、
  - type: paragraph
    initial:
      ru: 'Лк 16:2. '
      cn: （路加福音 16:2）
    text:
      ru: 'и, призвав его, сказал ему: что это я слышу о тебе? дай отчет в управлении твоем, ибо ты не можешь более управлять.'
      cn: 乃呼之曰、我所闻尔等、何也、可回复尔管家之言、盖尔不得仍为管家、
  - type: paragraph
    initial:
      ru: 'Лк 16:3. '
      cn: （路加福音 16:3）
    text:
      ru: 'Тогда управитель сказал сам в себе: что мне делать? господин мой отнимает у меня управление домом; копать не могу, просить стыжусь;'
      cn: 管家心内云、我主夺我管家、我将何为、锄则无能、乞则可耻、
  - type: paragraph
    initial:
      ru: 'Лк 16:4. '
      cn: （路加福音 16:4）
    text:
      ru: знаю, что сделать, чтобы приняли меня в домы свои, когда отставлен буду от управления домом.
      cn: 我知所为、待我被辞于管家时、人必接我于其家、
  - type: paragraph
    initial:
      ru: 'Лк 16:5. '
      cn: （路加福音 16:5）
    text:
      ru: 'И, призвав должников господина своего, каждого порознь, сказал первому: сколько ты должен господину моему?'
      cn: 凡负主人债者、一一呼之来、谓第一者曰、尔负我主几何、
  - type: paragraph
    initial:
      ru: 'Лк 16:6. '
      cn: （路加福音 16:6）
    text:
      ru: 'Он сказал: сто мер масла. И сказал ему: возьми твою расписку и садись скорее, напиши: пятьдесят.'
      cn: 其对曰、油一百篓、告之曰、取尔之券、亟坐、书五十、
  - type: paragraph
    initial:
      ru: 'Лк 16:7. '
      cn: （路加福音 16:7）
    text:
      ru: 'Потом другому сказал: а ты сколько должен? Он отвечал: сто мер пшеницы. И сказал ему: возьми твою расписку и напиши: восемьдесят.'
      cn: 又向别者曰、尔负几何、曰、麦百斛、告之曰、取尔之券、书八十、
  - type: paragraph
    initial:
      ru: 'Лк 16:8. '
      cn: （路加福音 16:8）
    text:
      ru: И похвалил господин управителя неверного, что догадливо поступил; ибо сыны века сего догадливее сынов света в своем роде.
      cn: 主人夸誉不义之管家、因其所行之巧也、盖此世之子、于此类人、较光明之子尤巧也、
  - type: paragraph
    initial:
      ru: 'Лк 16:9. '
      cn: （路加福音 16:9）
    text:
      ru: 'И Я говорю вам: приобретайте себе друзей богатством неправедным, чтобы они, когда обнищаете, приняли вас в вечные обители.'
      cn: 我告尔等、以不义之财为己作结友、至尔等匮乏时、为彼等接尔等于永远之宅矣、
  - type: paragraph
    text:
      ru: Всякая притча прикровенно и образно объясняет сущность какого-нибудь предмета, но она не во всем подобна тому предмету, для объяснения которого берется. Поэтому не должно все части притчи изъяснять до тонкости, но, воспользовавшись предметом, насколько прилично, прочие части нужно опускать без внимания, как прибавленные для целости притчи, а с предметом не имеющие никакого соответствия. Так нужно поступить и с предложенной притчей. Ибо если мы возьмемся до тонкой подробности объяснять все, кто домоправитель, кто приставил его к управлению, кто донес на него, кто должники, почему один должен маслом, а другой – пшеницей, почему говорится, что они должны были по сто, и если все прочее вообще будем исследовать с излишним любопытством, то мы сделаем речь темной, причем, вынужденные затруднениями, может быть, дойдем и до смешных объяснений. Поэтому настоящей притчей должно воспользоваться столько, сколько можно.
      cn: 每一则寓言都以隐秘且形象的方式，解释着某一事物的本质，但它并非在所有方面都与被用来解释的事物相似。因此，不应将寓言的所有部分都精微细致地阐释出来，而应当适度地利用（与主题相关的）事物，其余部分则需置而不顾，因其乃为寓言的完整性而添加，与该事物并无任何对应之处。对于眼前这则寓言，亦应如此处理。因为，如果我们执意精微地解释所有细节：谁是管家，谁派他去管理，谁告发了他，谁是债务人，为何一个欠油，另一个欠麦子，为何说他们都欠了一百，以及所有其他部分，如果我们总地以过度的好奇心去探究，那么我们就会使言语变得晦暗不明，并且在被困难所迫时，或许会陷入荒谬的解释。因此，对于这则寓言，我们应当仅利用其可用之处。
  - type: paragraph
    text:
      ru: Поясню несколько. Господь желает здесь научить нас хорошо распоряжаться вверенным нам богатством. И, во-первых, мы научаемся тому, что мы не господа имения, ибо ничего собственного не имеем, но что мы управители чужого, вверенного нам Владыкой с тем, чтобы мы располагали имением хорошо и так, как Он повелевает.
      cn: 让我再解释几句。此处，主渴望教导我们如何妥善地管理托付给我们的财富。首先，我们学到我们并非产业的主人，因为我们没有任何私产，而我们是受托管理他人产业的管家，这产业是受托于我们的主宰（Vladyka），以便我们能妥善地、并按照祂的命令来处置这份产业。
  - type: paragraph
    text:
      ru: Потом научаемся тому, что если мы поступаем в управлении богатством не по мысли Владыки, но вверенное нам расточаем на свои прихоти, то мы такие управители, на которых сделан донос. Ибо воля Владыки такова, чтобы вверенное нам мы употребляли на нужды сослужителей, а не на собственные удовольствия. Когда же на нас доносят и мы имеем быть отставленными от управления имением, то есть исторгнутыми из здешней жизни, когда именно мы будем давать отчет в управлении после преставления отселе, тогда мы поздно примечаем, что нужно делать, и«приобретаемсебе друзей богатством неправедным».«Неправедным»называется то«богатство», которое Господь вручил нам для употребления на нужды братьев и сослужителей, а мы удерживаем оное для самих себя. Но поздно мы ощутим, куда нам обратиться, и что в этот день мы не можем ни трудиться, ибо тогда не время делать, ни милостыни просить, ибо неблагоприлично, так как девы просившие (милостыни) названы глупыми (Мф. 25, 8). Что же остается делать? Разделить с братьями это имение, чтобы, когда перейдем отселе, то есть переселимся из здешней жизни, бедные«принялинасв вечные обители». Ибо нищим во Христе назначены в удел вечные обители, в которые они могут принять явивших им любовь здесь чрез раздачу богатства, хотя оное, как принадлежащее Владыке, сначала нужно было раздать бедным. Они суть должники по сказанному:«он всякий день милует и взаймы дает»(Пс. 36, 26), и в другом месте:«Благотворящий бедному дает взаймы Господу»(Притч. 19, 17). Итак, предварительно нужно было все раздать этим добрым должникам, которые уплачивают во сто крат. Впрочем, когда мы оказываемся управителями неверными, несправедливо удерживая за собой то, что назначено для других, нам не должно навсегда оставаться в этом бесчеловечии, но должно раздавать бедным, чтобы они приняли нас в вечные обители.
      cn: 随后我们得知，如果我们在财富管理上，不是依循主宰的意念行事，而是将托付给我们的（财富）挥霍在自己的私欲之上，那么我们就是被举报的那种管家。因为主宰的旨意是，我们应将托付给我们的用于同僚的需要，而非我们自己的享乐。当有人举报我们，并且我们即将被解除对财产的管理，也就是说，即将被拔离（脱离）此世的生命，正当我们在此地逝世之后，即将对我们的管理交账时，那时我们才迟迟注意到需要做什么，并「以不义之财为己作结友」。之所以称其为「不义的」「财富」，是因为主原本将其交给我们，是为了用于弟兄和同僚的需要，而我们却将其为自己所保留。但是，我们会迟迟才感到我们该转向何方，并且在那一天我们既不能劳作，因为那时已非行事之时；也不能乞求施舍，因为那是不合宜的，正如那些乞求施舍的童女被称作愚拙（马太福音 25:8）。那么，还剩下什么可做的呢？（那就是）与弟兄分享这份家业，好使我们从彼处离世之时，亦即从今世的生命迁徙之时，穷人「接我们在永恒之宅矣」。因为永恒的居所是指定给基督里的穷人作为基业的，在那里他们可以接纳那些在此地藉着分发财富而向他们显明爱心的人，尽管这财富，作为属于主宰之物，起初就应该分发给穷人。他们是债权人，正如经上所说：「他终日怜悯、借给人」（诗篇 36:26），在另一处：「怜悯贫穷的、就是借给上主」（箴言 19:17）。因此，起初就应该将一切都分发给这些善良的债权人，他们会偿还百倍。然而，当我们显为不忠实的管家，不公正地为自己保留本应指定给他人之物时，我们不应永远滞留于这种不人道的行为中，而应当分发给穷人，好使他们接纳我们在永恒的居所里。
  - type: paragraph
    text:
      ru: Когда мы так будем изъяснять эту притчу, то в объяснении не встретится ничего ни лишнего, ни изысканного, ни сногадательного. Впрочем, выражение«сыны века сего догадливее»и далее, кажется, означает нечто другое, и не неудобопонятное или странное. «Сынами века» сего называет тех, кои придумывают все, что на земле полезно для них, а «сынами света» тех, кои из любви к Богу, должны преподавать другим духовное богатство. Итак, здесь говорится, что люди, поставляемые в управители человеческим имением, всячески стараются о том, чтобы после отставки от управления иметь утешение, а сыны света, поставляемые, то есть получающие в доверие управление духовным имением, нисколько не думают о том, чтобы после сего получить себе пользу. Итак,«сыны века сего»суть те, коим вверено управление человеческими делами и кои«в своем роде», то есть в жизни сей, умно ведут свои дела, а сыны света те, кои приняли имение с тем, чтобы управлять им боголюбезно.
      cn: 当我们这样阐释这则比喻时，在解释中将不会遇到任何多余的、做作的或臆测性的内容。不过，「今世之子更加精明」以及其后的表达，似乎意指某些不同的东西，而非难以理解或怪异。他称「今世之子」为那些策划一切对他们有益之事的人，而称「光明之子」为那些出于对上帝的爱，理应向他人传授属灵财富的人。因此，这里所说的是：被任命管理人类财产的人，想方设法努力，以便在卸任管理之后能够得到慰藉；而那些被任命（即被委托管理属灵财富）的「光明之子」，则丝毫不考虑在此之后给自己获取益处。因此，「今世之子」就是那些受托管理属世事务，并且「在自己的世代中」，即在今生中，精明地处理自身事务的人；而「光明之子」则是那些接受了财富，以便以蒙神喜悦的方式来管理它的人。
  - type: paragraph
    text:
      ru: Оказывается, что, управляя человеческим имением, мы умно ведем свои дела и стараемся, чтобы иметь какое-нибудь убежище жизни и тогда, когда будем отставлены от сего управления. А когда управляем имением, коим должно распоряжаться по воле Божией, мы, кажется, не заботимся о том, чтобы нам по преставлении из здешней жизни не подпасть ответственности за управление и не остаться без всякого утешения. Потому мы и называемся неразумными, что не думаем о том, что будет полезно для нас после сего. Но будем приобретать себе друзей в нищих, употребляя на них неправедное богатство, данное нам от Бога в оружие правды, но нами удержанное в свою пользу и потому превратившееся в неправду. Если же богатство, праведным путем доставшееся, когда им управляют нехорошо и не раздают нищим, вменяется в неправду и в маммону, то тем более богатство неправедное. Будем же сим последним приобретать себе друзей, чтобы, когда умрем и переселимся из здешней жизни или и в другом случае будем малодушествовать от осуждения,«они... принялинас тамв вечные обители».
      cn: 原来，我们在管理人的产业时，是明智地经营自己的事务，并努力争取在被撤销管理权之后，仍然能有一个生命的避难所。然而，当我们管理那本应按照上帝的旨意来处置的产业时，我们似乎并不关心在离开此世生活之后，会不会因管理失职而受到责罚，也不会一无慰藉。因此，我们被称为不智者，因为我们不考虑这对我们此后会有何益处。但是，我们将用那不义的钱财为自己在穷人中赢得朋友；这不义之财是上帝赐予我们的，本是作为公义的武器，却被我们据为己用，因此转变为不义。既然通过正当途径获得的财富，若管理不善、不分发给穷人，也被算作不义和「玛门」，那么不义之财就更是如此了。那么，我们就用这后者为自己赢得朋友，以便当我们死亡并迁离此世生活时，或者在另一种情况下，当我们因定罪而气馁时，「他们……在那里接我们到永远的居所」。
  - type: paragraph
    initial:
      ru: 'Лк 16:10. '
      cn: （路加福音 16:10）
    text:
      ru: Верный в малом и во многом верен, а неверный в малом неверен и во многом.
      cn: 〇于小者忠、于大者亦忠、于小者不义、于大亦不义、
  - type: paragraph
    text:
      ru: 'Господь еще учит о том, что богатством нужно управлять по воле Божией.«Верный в малом», то есть хорошо распоряжавшийся вверенным ему имением в мире сем, верен«и во многом», то есть и в будущем веке достоин истинного богатства. «Малым» называет земное богатство, так как оно поистине мало, даже ничтожно, поскольку скоропреходящее, а «многим» – богатство Небесное, так как оно всегда пребывает и прибывает. Поэтому, кто оказался неверным в сем земном богатстве и данное на общую пользу братьев присвоил себе, тот не будет достоин и того многого, но будет отвергнут как неверный. Поясняя сказанное, прибавляет:'
      cn: 主仍在教导，关于财富必须按照上帝的旨意来管理。「在小者忠」（Верный в малом），即在此世将所托付给他的产业妥善处理的人，在「多者」（и во многом）中也忠实，也就是说，在未来的世代，他配得真正的财富。「小者」（Малым）指的是世上的财富，因为它确实微小，甚至虚无，因为它转瞬即逝；而「多者」（многим）指的是天上的财富，因为它恒常存留，并不断增加。因此，那些在这世俗财富中显得不忠实，将本该用于弟兄们共同利益的财富据为己有的人，就不配得那「多者」，反将作为不忠者而被拒绝。为解释上述言论，祂补充说：
  - type: paragraph
    initial:
      ru: 'Лк 16:11. '
      cn: （路加福音 16:11）
    text:
      ru: Итак, если вы в неправедном богатстве не были верны, кто поверит вам истинное?
      cn: 若尔等以不义之财为不忠、谁以真者托尔等耶、
  - type: paragraph
    text:
      ru: «Неправедным»богатством назвал богатство, которое остается при нас; ибо если б оно не было неправедно, оно и не было бы у нас. А теперь, поскольку оно у нас, то очевидно, что неправедно, так как оно задержано нами и не роздано бедным. Ибо похищение чужого имения и принадлежащего нищим есть несправедливость. Итак, кто нехорошо и неверно управляет сим имением, как тому доверять«истинное»богатство?
      cn: 「不义」的财富，祂称之为停留在我们身边的财富；因为如果它不是不义的，它也就不会在我们这里。而现在，既然它在我们这里，那么它显然是不义的，因为它被我们扣留，没有分发给穷人。因为盗取他人财产和属于穷人的财物，就是不义。那么，谁若不好好地、不忠实地管理这财物，怎能将「真实」的财富托付给他呢？
  - type: paragraph
    initial:
      ru: 'Лк 16:12. '
      cn: （路加福音 16:12）
    text:
      ru: И если в чужом не были верны, кто даст вам ваше?
      cn: 若尔等于属人者为不忠、谁以属尔等者予尔耶、
  - type: paragraph
    text:
      ru: И нам кто даст «наше», когда мы неверно распоряжаемся «чужим», то есть имением? А оно «чужое», так как оно назначено для бедных, а с другой стороны, так как мы ничего не принесли в мир, но родились нагими. А наш удел – богатство Небесное и Божественное, ибо там жилище наше (Флп. 3,20). Имение и приобретение чужды для человека, сотворенного по образу Божию, ибо из них ничто не похоже на него. А наслаждение Божественными благами и общение с Богом – это сродно нам.
      cn: 又有谁会把「我们的」赐给我们呢？倘若我们不忠实地管理着「不属于我们的」，也就是指产业。而产业之所以是「不属于我们的」，一则因为它被指定用于穷人，二则是因为我们不曾带任何东西进入这世界，而是赤裸地出生。而「我们的」那一份——是属天和属神的财富，因为我们的家园在那里（腓立比书 3:20）。产业与所得之物对于按照上帝形象所造的人来说是陌生的，因为它们中没有一样与人相似。而享用属神的恩惠以及与上帝的共融——这才是与我们相亲的。
  - type: paragraph
    initial:
      ru: 'Лк 16:13. '
      cn: （路加福音 16:13）
    text:
      ru: Никакой слуга не может служить двум господам, ибо или одного будет ненавидеть, а другого любить, или одному станет усердствовать, а о другом нерадеть. Не можете служить Богу и маммоне.
      cn: 未有一仆能事二主、盖或恶此而爱彼、或重此而轻彼、尔等不能事上帝及玛摩那、
  - type: paragraph
    text:
      ru: Доселе Господь учил нас, как должно верно управлять богатством. Ибо оно чужое, а не наше; мы управители, а не господа и владыки. Поскольку же управление богатством по воле Божией совершается не иначе, как при твердом бесстрастии к нему, то Господь прибавил к учению своему и сие:«Не можете служить Богу и маммоне», то есть невозможно тому быть слугой Божиим, кто привязался к богатству и по пристрастию к нему нечто удерживает за собой. Поэтому, если ты намерен верно распоряжаться богатством, то не порабощайся ему, то есть не имей привязанности к нему, и ты истинно послужишь Богу. Ибо сребролюбие, то есть страстная наклонность к богатству, повсюду порицается (1Тим. 6, 10).
      cn: 迄今为止，主一直在教导我们当如何忠实地管理财富。因为财富是别人的，不是我们自己的；我们是管理者，而非主人或主宰。既然按照上帝的旨意管理财富，唯有对它保持坚定的无情欲（*бесстрастии*）方能实现，因此主在他的教导中又补充了这一点：「未有一仆能事二主、盖或恶此而爱彼、或重此而轻彼、尔等不能事上帝及玛摩那」（路加福音 16:13），即，对于那些依恋财富，并因对其的偏爱而为自己保留某些东西的人来说，他们不可能成为上帝的仆人。因此，如果你打算忠实地支配财富，就不要被它奴役，也就是说，不要对它怀有依恋，如此你便能真正地侍奉上帝。因为贪爱银钱，即对财富的激情性倾向（*страстная наклонность*），在各处都受到谴责（1提摩太前书 6:10）。
  - type: paragraph
    initial:
      ru: 'Лк 16:14. '
      cn: （路加福音 16:14）
    text:
      ru: Слышали всё это и фарисеи, которые были сребролюбивы, и они смеялись над Ним.
      cn: 发利些乙之好利者闻此一切而哂之、
  - type: paragraph
    text:
      ru: Фарисеи, в досаде на слова Господа, смеялись над Ним. Ибо им, как сребролюбцам, неприятно было слушать о нестяжательности. Так и сказано:«мерзость... грешнику богочестие», (Сир. 1, 25) и«обличение...нечестивому раны»(Притч. 9, 7).
      cn: 那些法利赛人，因着对主的话语感到恼怒，便嗤笑祂。因为，作为爱财之人（сребролюбцам），听闻不贪婪（нестяжательности）之事，令他们不快。正如（西拉书 1:25）所言：「敬虔为罪人所憎恶」，又如（箴言 9:7）所言：「责备那邪恶的人，必给他带来创伤。」
  - type: paragraph
    initial:
      ru: 'Лк 16:15. '
      cn: （路加福音 16:15）
    text:
      ru: 'Он сказал им: вы выказываете себя праведниками пред людьми, но Бог знает сердца́ ваши, ибо, что высоко у людей, то́ мерзость пред Богом.'
      cn: 彼向伊等曰、 〇尔等在人前自称为义、但上帝知尔之心、盖于人前为崇高、在上帝前为厌恶也
  - type: paragraph
    text:
      ru: 'Господь, обнаруживая скрытое лукавство фарисеев и показывая, что они, хотя и принимают вид праведности, мерзки, однако ж, пред Богом по своему самомнению, говорит: вы представляете себя праведниками пред людьми и думаете, будто вам одним дано разуметь то, что нужно, и учить; поэтому вы и смеетесь над Моими словами как неразумными, желая почитаться у черни учителями истины. Но не так на деле. Потому что«Бог знает сердца ваши»и считает вас мерзкими за ваше высокомудрие и пристрастие к людской славе.«Ибо что высоко у людей, то мерзость пред Богом».«Мерзость пред Господом всякий надменный сердцем»(Притч. 16, 5). Поэтому вам, фарисеи, нужно было жить не для людского мнения,«ибо рассыплет Бог кости ополчающихся против тебя»(Пс. 52,6), но лучше соделовать себя праведными пред Богом.'
      cn: 主，在揭示法利赛人隐藏的奸诈并指出他们虽然装出公义的样子，但在上帝面前因其自负而令人厌恶时，说：你们在人前将自己表现为义人，并且认为唯独你们被赋予了理解必需之物和教导的能力；因此，你们嘲笑我的话语，视之为愚拙，渴望被平信徒尊为真理的教师。但事实并非如此。因为「上帝知道你们的心」，并且由于你们的自负和对世人荣耀的依恋，祂认为你们是可憎的。「盖于人前为崇高，在上帝前为厌恶也。」「凡心骄气傲的人，都是上主所憎恶的」（箴言 16:5）。因此，你们法利赛人本不该为世人的意见而活，「因为上帝必将那与你争战之人的骨头散开」（诗篇 52:6），而应该更好地使自己在上帝面前成为义人。
  - type: paragraph
    initial:
      ru: 'Лк 16:16. '
      cn: （路加福音 16:16）
    text:
      ru: Закон и пророки до Иоанна; с сего времени Царствие Божие благовествуется, и всякий усилием входит в него.
      cn: 法律及诸先知至伊鄂昂为止、从此乃宣传上帝之国、凡勉力者入之、
  - type: paragraph
    text:
      ru: 'По-видимому, это отдельная речь, не имеющая ничего общего с вышесказанным, но для внимательного она не покажется непоследовательной, а напротив очень связанной с предыдущим. Господь вышесказанными словами учил нестяжательности и богатство назвал неправедным имением, а Закон (Лев. 26, 3–9) поставлял благословения и в богатстве (между прочим), и пророки (Ис. 19) обещали в награду блага земные. Чтобы кто-нибудь подобно фарисеям не сказал Ему с насмешкой: что Ты говоришь? Ты противоречишь Закону: он благословляет богатством, а Ты учишь нестяжательности? – поэтому Господь говорит:«Закон и пророкиимели времядо Иоанна»и хорошо так учили, потому что слушатели были тогда в юном возрасте. Но с того времени, как явился Иоанн, почти бесплотный по нестяжательности и нестяжательный почти по бесплотности, и проповедал Царствие Небесное, блага земные уже не имеют времени, а проповедуется Царствие Небесное. Поэтому желающие небес должны на земле усвоить себе нестяжательность. Поскольку пророки и Закон не упоминали о Царстве Небесном, то справедливо обещали блага земные людям, еще далеко несовершенным и неспособным представить себе ничего великого и мужеского. Поэтому, фарисеи, Я справедливо учу нестяжательности, когда несовершенные заповеди Закона не имеют уже времени.'
      cn: 显然，这是一段独立的论述，与上文所说的一切毫无共同之处，但对于细心的人来说，它不会显得不连贯，反倒与前文紧密相联。主用上文的言语教导不贪财，并将财富称作不义的财物，而《律法》（利未记 26:3-9）也（在其他方面）将祝福置于财富之中，先知们（以赛亚书 19:1）也曾应许以地上的福乐作为报偿。为了避免有人像法利赛人那样嘲讽祂说：「祢说什么？祢在自相矛盾：《律法》祝福人有财富，而祢却教导不贪财？」——因此，主说：「律法和先知直到伊鄂昂才有时间。」并且他们教导得很好，因为当时的听众尚处于年幼的阶段。但自从伊鄂昂显现以来，他因不贪财而几乎是无肉体的，因无肉体而几乎是不贪财的，他宣讲了天国，地上的福乐就不再有时间了，而是宣讲天国。因此，渴望天国的人必须在地上习得不贪财。因为先知和《律法》没有提及天国，所以他们向那些远未完善、且无法想象任何伟大和勇敢之事物的人们应许地上的福乐是合理的。因此，法利赛人，当《律法》的不完全的诫命不再有时间时，我教导不贪财是公义的。
  - type: paragraph
    initial:
      ru: 'Лк 16:17. '
      cn: （路加福音 16:17）
    text:
      ru: Но скорее небо и земля прейдут, нежели одна черта из закона пропадет.
      cn: 天地之逝较法律中一画之废尤易、
  - type: paragraph
    text:
      ru: 'Потом, чтобы не сказали, что, наконец, все законное отвергнуто как суетное и совершенно пустое, Господь говорит: Нет! напротив, ныне еще более исполняется и совершается. Ибо что Закон начертал в тени, говоря образно о Христе или о заповедях, то ныне исполняется, и ни одна черта из того не пропадет. Что там в виде тени указано о Христе, то ныне совершится яснейшим образом. И заповеди Закона, данные тогда приспособительно и сообразно с разумением несовершенных, ныне будут иметь смысл высший и совершеннейший.'
      cn: 然后，为了不让人说，最终所有合乎法律（*законное*）的事物都被弃绝为徒然和完全空虚，主（*Господь*）说：「不！恰恰相反，如今它被更进一步地填充（*исполняется*）和完成（*совершается*）。」因为律法（*Закон*）在影子里所勾勒的，无论是象征性地论及基督，还是论及诫命，如今都正在被实现，其中的任何一笔（*черта*）都不会消逝。那里以影子的形式所指出的关于基督的事物，如今将以最清晰的方式成就。而当时为适应和符合那些不完全之人的理解力而赐予的律法的诫命，如今将具有更高和更完满的意义。
  - type: paragraph
    initial:
      ru: 'Лк 16:18. '
      cn: （路加福音 16:18）
    text:
      ru: Всякий, разводящийся с женою своею и женящийся на другой, прелюбодействует, и всякий, женящийся на разведенной с мужем, прелюбодействует.
      cn: 凡休本妻而他娶者、为行淫、凡娶被夫所休者、亦为行淫、
  - type: paragraph
    text:
      ru: 'А что Закон несовершенным говорил несовершенно, видно из следующего. Например, Закон по жестокосердию евреев дал приговор о расторжении брака, именно: муж, если возненавидит жену свою, имел право развестись с ней, чтобы не случилось чего-нибудь худшего. Ибо склонные к убийству и кровожадные евреи не щадили ближайших родных, так что закалали в жертву бесам своих сыновей и дочерей. Но это недостаток и несовершенство Закона. Тогда было время такого законоположения, а ныне нужно другое учение, совершеннейшее. Поэтому Я и говорю: всякий, кто разведется с женой своей не за прелюбодеяние и женится на другой, тот прелюбодействует. Поэтому нет ничего удивительного, если Я учу о нестяжательности, хотя Закон ничего о ней ясно не говорит. Вот, Закон равнодушно дал заповедь о брачном разводе, для предотвращения смертоубийства в иудеях; а Я, приучая слушателей к высшему совершенству, запрещаю развод без благословной причины и повелеваю так не вопреки Закону, но с тем, чтобы не было убийств между мужьями и женами. И Я подтверждаю это, когда учу, чтоб супруги заботились друг о друге и берегли друг друга как собственные члены. И Закон желал этого, но поскольку слушатели были несовершенны, то Он определил расторгать брак, чтобы, по крайней мере, при таком условии муж и жена щадили друг друга и не ярились один на другого.'
      cn: 至于律法向不完美之人所说的不完美之言，从以下几点便可看出。例如，律法鉴于犹太人的心硬，颁布了关于解除婚约的判例，即：丈夫若憎恨自己的妻子，有权与她离婚，以防发生更糟的事情。因为那些倾向于杀戮和嗜血成性的犹太人，不惜惜身边的至亲，甚至将他们的儿女献祭给鬼魔。但这正是律法的不足和不完美之处。那时是颁布此类律法的时候，而如今需要另一种教导，一种更完美的教导。因此，我也说：凡休妻，除非是因着淫乱的缘故，而另娶的，就是犯奸淫了。因此，我教导不恋财的道理，尽管律法对此没有明确的论述，这也没什么好奇怪的。看哪，律法默许了关于婚姻解除的诫命，是为了防止犹太人之间的杀戮；而我，则教导听众追求更高的完美，禁止没有正当理由的离婚，我如此吩咐并非是违背律法，而是为了让夫妻之间不再发生谋杀事件。我教导夫妻应当彼此关照、彼此保护，如同自己的肢体一样，从而印证了这一教导。律法也希望如此，但由于听众不完美，它才规定可以解除婚约，以便至少在这种条件下，丈夫和妻子能彼此宽容，不相互发怒。
  - type: paragraph
    text:
      ru: Итак, Христос все требования Закона подтвердил; а поэтому и хорошо сказал, что невозможно пропасть ни одной черте из Закона. Ибо как бы она погибла, когда Христос исправил его (Закон) в лучшем виде?
      cn: 因此，基督确认了律法所有的要求；所以祂说得很好，律法中的哪怕一笔一划也不可能废去。因为既然基督以更佳的形式修正了它（律法），它又怎会消亡呢？
  - type: paragraph
    initial:
      ru: 'Лк 16:19. '
      cn: （路加福音 16:19）
    text:
      ru: Некоторый человек был богат, одевался в порфиру и виссон и каждый день пиршествовал блистательно.
      cn: 〇有一富人衣紫袍及枲布、日日奢华宴乐、
  - type: paragraph
    text:
      ru: Эта речь стоит в связи с предыдущей. Поскольку выше Господь учил хорошо управлять богатством, то справедливо присовокупляет и сию притчу, которая примером случившегося с богачом указывает на ту же самую мысль. Речь эта есть именно притча, а не действительное событие, как некоторые думали без основания. Ибо не настало еще время ни праведным наследовать блага, ни грешным – противное. А Господь придал речи образность, чтобы как немилосердных вразумить, что им предлежит в будущем, так и злостраждущих научить, что они будут благополучны за то, что переносят здесь. Богача в притчу Господь взял без имени, поскольку он недостоин и именоваться пред Богом, как и чрез Пророка сказано:«не помяну имен их устами моими»(Пс. 15, 4).
      cn: 这段讲论与前文有所关联。因为主在上面教导了如何善加管理财富，所以祂合宜地附加上了这则比喻，这比喻以发生在富人身上的事例，指明了与前文相同的思想。这段讲论确切地说是一个比喻，而不是像某些人无根据地认为的那样，是一个真实的事件。因为义人尚未到继承福佑的时候，罪人也尚未到承受相反结局的时候。但是主赐予了这段讲论以形象性，以便既能警示那些不仁慈的人，让他们知道将来有什么在等待着他们；又能教导那些受苦难的人，让他们明白他们会因着在这里所忍受的一切而得到福乐。主在比喻中引用这位富人时没有提及他的名字，是因为他不配在上帝面前被称呼名字，正如藉着先知所说的：（诗篇 15:4）「我嘴唇也不提他们的名号」。
  - type: paragraph
    initial:
      ru: 'Лк 16:20. '
      cn: （路加福音 16:20）
    text:
      ru: Был также некоторый нищий, именем Лазарь, который лежал у ворот его в струпьях
      cn: 亦有一贫人名剌咂儿遍生疮者、卧于其门、
  - type: paragraph
    text:
      ru: А о нищем упоминает по имени, ибо имена праведных записываются в книге жизни. Говорят же, по преданию евреев, что в то время был в Иерусалиме некто Лазарь, находившийся в крайней бедности и болезни, и что Господь о нем упомянул, взяв его в притчу как явного и известного.
      cn: 至于这贫穷人，（主）提及他的名字，因为义人的名字被记录在生命册上。人们说，根据犹太人的传承，在当时，耶路撒冷确有一名叫拉撒路的人，他处于极端的贫困与疾病之中；主提及他，是将他作为一位显而易见且为人所知的人物，用在了比喻之中。
  - type: paragraph
    text:
      ru: Богач был во всех отношениях благополучен. Он одевался в порфиру и виссон и не только одевался, но и всяким другим удовольствием наслаждался.«Пиршествовал блистательно», сказано, и не то, чтоб ныне – да, а завтра – нет, но«каждый день», и не то, чтобы умеренно, но«блистательно», то есть роскошно и расточительно. А Лазарь был нищий и больной, и притом«в струпьях», как сказано. Ибо можно болеть и, однако ж, не быть в ранах, а от сих увеличивается зло. И повержен был он у ворот богатого.
      cn: 富人[的处境]在所有方面都是顺遂的。他身着紫色袍和细麻布，而且他不仅是穿着这些，还享受着其他各种快乐。经文说：「他日日奢华宴乐。」这并不是说今天有、明天没有，而是「每天」如此；这也不是说适度宴乐，而是「奢华」，也就是说，奢侈而浪费。而拉撒路是一个乞丐和病人，并且如经文所说，他「遍生疮者」。因为人可以生病，但未必有创伤，但这些创伤会加重苦难。他被弃置于富人的门前。
  - type: paragraph
    initial:
      ru: 'Лк 16:21. '
      cn: （路加福音 16:21）
    text:
      ru: и желал напитаться крошками, падающими со стола богача, и псы, приходя, лизали струпья его.
      cn: 欲饱富人棹下之遗屑、但犬来舐其疮、
  - type: paragraph
    text:
      ru: 'Новая скорбь видеть, что другие с избытком наслаждаются, а он томится голодом. Ибо он желал насытиться не роскошными яствами, но крошками от них такими, которыми питались псы. Никто не заботился и об излечении Лазаря: ибо псы облизывали раны его, так как никто не отгонял их.'
      cn: 新的苦楚乃是看到，其他人享受着丰裕，而他却饱受饥饿的折磨。因为他渴望饱足的不是那些奢华的食物，而是从它们上面掉下来的碎屑——那些喂养狗的碎屑。没有人关心拉撒路的医治：因为狗舔舐着他的伤口，正如没有人把它们赶走一样。
  - type: paragraph
    initial:
      ru: 'Лк 16:22. '
      cn: （路加福音 16:22）
    text:
      ru: Умер нищий и отнесен был Ангелами на лоно Авраамово.
      cn: 适贫者死、天神等则送之于阿乌拉阿木之怀、而富人亦死、则葬埋之、
  - type: paragraph
    text:
      ru: Что же? Лазарь, находясь в таком бедственном положении, хулил Бога, поносил роскошную жизнь богача? Осуждал бесчеловечие? Роптал на Промысл? Нет, ничего такого он не помышлял, но переносил все с великим любомудрием. Откуда это видно? Из того, что, когда умер, его приняли Ангелы. Ибо если бы он был ропотник и богохульник, он не удостоился бы такой чести – сопровождения и несения Ангелами.
      cn: '狄奥菲拉克（Theophylact）


        那么呢？处于如此悲惨境地的拉撒路，他是否亵渎上帝，谩骂那富人的奢华生活呢？他谴责那不人道（ бесчеловечие）的行为吗？他是否抱怨那神圣的照管（Промысл）呢？没有，他丝毫没有想过这类事，而是以极大的爱智（любомудрием）忍受了一切。从何处可见此点？从他死时，天使们接纳了他。因为如果他是一个抱怨者和亵渎上帝之人，他就不会被授予这样的荣耀——由天使们护送和背负。'
  - type: paragraph
    text:
      ru: Умер и богач, и похоронили его.
      cn: 富人也死了，并且被埋葬了。
  - type: paragraph
    text:
      ru: Еще при жизни богача душа его была поистине зарыта, она носила плоть как бы гроб. Поэтому и по смерти его он не Ангелами возводится, но низводится в ад. Ибо не помышлявший никогда ни о чем высоком и небесном достоин самого низшего места. Словами«похоронили его»Господь намекнул на то, что душа его получила в удел преисподнее и мрачное место.
      cn: 富人尚在人世之时，他的灵魂实际上已被埋葬，它承载着肉体，如同坟墓一般。因此，他死后，并非被天使接引升上，而是被降到阴间。因为一个从未思虑过任何高尚与属天之事的人，只配得最卑下之处。主以「葬埋了他」这些话语，暗示他的灵魂所得的归宿是地狱般的、阴暗的场所。
  - type: paragraph
    initial:
      ru: 'Лк 16:23. '
      cn: （路加福音 16:23）
    text:
      ru: И в аде, будучи в муках, он поднял глаза свои, увидел вдали Авраама и Лазаря на лоне его
      cn: 在地狱痛苦之间、举目遥见阿乌拉阿木、与剌咂儿在其怀中、
  - type: paragraph
    text:
      ru: Как Адама, изгнав из рая, Господь поселил перед раем (Быт. 3, 24), чтобы страдание, повторяющееся при постоянном виде рая, давало Адаму яснее чувствовать лишение блаженства, так и сего богача осудил пред лицом Лазаря, чтобы видя, в каком состоянии находится теперь Лазарь, богатый чувствовал, чего он лишился чрез бесчеловечие. Почему же богатый увидел Лазаря не у другого кого из праведных, но на лоне Авраама? Поскольку Авраам был гостеприимен, а богатого нужно было обличить в нелюбви к гостеприимству, поэтому богатый и видит Лазаря с Авраамом. Сей и мимо проходящих приглашал в дом свой, а тот презирал и лежащего внутри дома.
      cn: '就像主将亚当逐出乐园后，安置在乐园之前（创世记 3:24），以便那因不断目睹乐园而重复出现的苦楚，能使亚当更清晰地感受失去福乐的境况；同样地，祂也定罪这位财主，使其置于拉撒路面前，好让财主借着看到拉撒路现今所处的状态，感受到他因不人道而失去了什么。


        为何财主看见拉撒路，不是在别的某位义人那里，而是在阿乌拉阿木的怀中呢？因为阿乌拉阿木（阿乌拉阿阿木）是好客的，而财主需要因着不喜爱款待客旅而被揭发，因此财主才看见拉撒路与阿乌拉阿木在一起。这位（阿乌拉阿木）甚至邀请路过之人进入他的家中，而那位（财主）却轻视那躺在屋内的（拉撒路）。'
  - type: paragraph
    initial:
      ru: 'Лк 16:24. '
      cn: （路加福音 16:24）
    text:
      ru: 'и, возопив, сказал: отче Аврааме! умилосердись надо мною и пошли Лазаря, чтобы омочил конец перста своего в воде и прохладил язык мой, ибо я мучаюсь в пламени сем.'
      cn: 而呼曰、我父阿乌拉阿木乎、矜怜我、遣剌咂儿使其指尖蘸水凉润我舌、因我在此火熖中受苦、
  - type: paragraph
    text:
      ru: Почему богатый обращает просьбу свою не к Лазарю, а к Аврааму? Может быть, он стыдился, а может быть, думал, что Лазарь помнит его зло, и по своим делам заключал и о Лазаре. Если я (мог он думать), наслаждаясь таким счастьем, презирал его, угнетаемого таким несчастьем, и не уделял ему даже крошек, то тем более он, презренный мной, вспомнит зло и не согласится оказать мне милость. Поэтому-то он обращается со своими словами к Аврааму, думая, вероятно, что патриарх не знает, как было дело. Что же Авраам?
      cn: 财主为何不向拉撒路，而向阿乌拉阿阿木提出请求？或许是他感到羞耻，又或许他认为拉撒路记着他曾行的恶，因此就以自己的行事来推断拉撒路。他（财主可能会想）：如果我，在享受这等福乐时，尚且藐视那被这等不幸所压迫之人，甚至不分给他一点碎屑，那么他，曾被我所藐视之人，就更会记起我的恶，而不愿施予我怜悯了。正因如此，他便将自己的话转向阿乌拉阿阿木，很可能是认为这位列祖并不知道事情的始末。那么，阿乌拉阿阿木作何回应呢？
  - type: paragraph
    initial:
      ru: 'Лк 16:25. '
      cn: （路加福音 16:25）
    text:
      ru: 'Но Авраам сказал: чадо!'
      cn: 但是亚伯拉罕说：孩子！
  - type: paragraph
    text:
      ru: 'Он не сказал богачу: бесчеловечный и жестокий, не стыдно ли тебе? теперь ты вспомнил о человеколюбии. Но как?«Чадо»! Смотри на сострадательную и святую душу. Мудрец какой-то говорит: смиренную душу не возмущай. Поэтому и Авраам говорит:«чадо», давая чрез сие знать ему, что именовать его так милостиво даже теперь в его власти, но и только, а что более сего он ничего не властен сделать для него. Что могу, то уделю тебе, то есть голос сострадания. Но чтобы перейти отсюда туда, это не в нашей воле, ибо все заключено.'
      cn: 他没有对那个财主说：不人道、残酷的人，你不觉得羞耻吗？现在你才想起了人道主义。但他说了什么呢？「孩子」（路加福音 16:25）！看看这富有同情心且圣洁的灵魂吧。某位智者说：不要激怒谦卑的灵魂。因此，阿乌拉阿阿木也说：「孩子」，借此让他明白，即使是在现在，以如此慈悲的方式称呼他仍在阿乌拉阿阿木的权柄之内，但也仅此而已；除此之外，阿乌拉阿阿木无权为他做更多的事情。我能给予你的，我就分给你，那就是同情的声音。但要从此处越过彼处，这不在我们的意愿之中，因为一切都已被封闭了。
  - type: paragraph
    text:
      ru: вспомни, что ты получил уже доброе твое в жизни твоей, а Лазарь – злое; ныне же он здесь утешается, а ты страдаешь;
      cn: 「当记起，你在你此生中已然领受了你的美善（доброе），而拉匝禄（Лазарь）领受了恶（злое）；然而如今他在此处得到慰藉（утешается），而你受苦（страдаешь）。」
  - type: paragraph
    text:
      ru: 'Почему Авраам не сказал богачу: ты приял, но«получил»? Слово «получить обратно» мы обыкновенно употребляем о тех, кои получают то, чем им должны были. Чему же мы научаемся? Тому, что хотя некоторые осквернили себя злодеяниями, хотя дошли до крайней степени злобы, но когда-нибудь сделали же они одно или два добрых дела. Поэтому и богач имел какие-нибудь добрые дела, и так как он в благоденствии здешней жизни получил воздаяние, то и говорится, что он«получил доброе»свое.«А Лазарь – злое». Может быть, и он совершил одно или два злых дела и в скорби, которую здесь претерпел, получил за них должное воздаяние. Поэтому он утешается, а ты страждешь.'
      cn: 为何阿乌拉阿阿木没有对那财主说：你「得到了」，而是说：「收回了」？「收回」（получить обратно）这个词我们通常用于那些收回了他们本应得之物的人。那么，我们学到了什么呢？就是：尽管有些人以恶行玷污了自己，尽管他们达到了极度的恶毒，但他们总归还是做过一件或两件善行。因此，那财主也曾有过一些善行，而既然他在今生的福乐中已获得了报偿，所以经文就说他「收回了他好的（事物）」。「而拉撒路——恶的（事物）」。也许他也曾做过一件或两件恶行，并在他在此处所遭受的苦难中，为那些恶行得到了应得的报偿。因此，他得到安慰，而你遭受痛苦。
  - type: paragraph
    initial:
      ru: 'Лк 16:26. '
      cn: （路加福音 16:26）
    text:
      ru: и сверх всего того между нами и вами утверждена великая пропасть, так что хотящие перейти отсюда к вам не могут, также и оттуда к нам не переходят.
      cn: 除此一切外、尔我间、限以巨渊、故凡欲由此过尔等不能、由彼至我等亦不得济、
  - type: paragraph
    text:
      ru: «Пропасть»означает расстояние и различие между праведными и грешниками. Ибо как произволения их были различны, так и обители их имеют большую разность, когда каждый получает воздаяние соответственно произволению и жизни. Приметь здесь и возражение против оригенистов. Они говорят, что придет время, когда муки окончатся и грешники соединятся с праведниками и с Богом, и таким образом Бог будет все во всех. Но вот, мы слышим, Авраам говорит, что«хотящие перейти отсюда к вам... или оттуда к нам... не могут»сего сделать. Поэтому как из участи праведников невозможно кому-нибудь перейти в место грешников, так невозможно, учит нас Авраам, перейти из места мучения в место праведников. И Авраам, без сомнения, более достоин веры, чемОриген.
      cn: 「巨渊」意指义人与罪人之间的距离和差异。因为他们的意愿选择（或：自由意志）既有差异，他们的居所也就有极大的区别，彼时各人会按其意愿选择和生活得到相应的报偿。在此也请留意对奥利热努斯派的反对。他们说，惩罚终结之时会到来，届时罪人将与义人及上帝联合，如此，上帝将是万有中的万有（все во всех）。然而，看哪，我们听见阿乌拉阿阿木说，「虽然想从这里到你们那里去……或从那里到我们这里来……他们不能」这样做。因此，正如义人的境遇中不可能有人转到罪人的地方，阿乌拉阿阿木教导我们，同样不可能从受苦之地转到义人的地方。而阿乌拉阿阿木无疑比奥利热努斯更值得相信。
  - type: paragraph
    text:
      ru: Что такое «ад»? Одни говорят, что ад есть подземное мрачное место, а другие называли адом переход души из наглядного в невидимое и безвидное состояние. Ибо доколе душа находится в теле, она обнаруживается собственными действиями, а по разлучении с телом она становится невидимой. Это-то и называли адом.
      cn: 「阴间」（ад）是什么？有人说，阴间是一个地下的幽暗之处，而另一些人则称，阴间是灵魂从可见状态过渡到不可见且无形状态的过程。因为只要灵魂仍居于身体之中，它就会通过自身的行动显现出来，而当它与身体分离后，它就变得不可见了。这就是他们所称的阴间。
  - type: paragraph
    text:
      ru: «Лоном Авраамовым» называют совокупность тех благ, какие предлежат праведникам по входе их от бури в небесные пристани; поскольку и в море заливами (лоном) мы обыкновенно называем места удобные для пристани и успокоения.
      cn: 「阿乌拉阿阿木的怀抱」指称的是那些在前方的、为义人预备好的诸般福佑的集合体，发生在他们从风暴中进入天上的避风港之后；因为在海上，我们通常也将那些方便停泊和歇息之处称作海湾（怀抱）。
  - type: paragraph
    text:
      ru: Обрати внимание и на то, что в день тот обидчик увидит, в какой славе будет обиженный им, а сей в свою очередь увидит, в каком осуждении будет обидчик, подобно как здесь богатый увидел Лазаря, а сей – опять богатого.
      cn: 请注意，在审判之日，施害者将看到被他侵害的人身处何等的荣耀之中；而反过来，受害者也将看到施害者身处何等的定罪（受审判）之中。这正如同此处（在世时）财主看见了拉撒路，而拉撒路又反过来看见了那财主一样。
  - type: paragraph
    initial:
      ru: 'Лк 16:27. '
      cn: （路加福音 16:27）
    text:
      ru: 'Тогда сказал он: так прошу тебя, отче, пошли его в дом отца моего,'
      cn: 彼又曰、于是、尔父、速遣之于我父家、
  - type: paragraph
    initial:
      ru: 'Лк 16:28. '
      cn: （路加福音 16:28）
    text:
      ru: ибо у меня пять братьев; пусть он засвидетельствует им, чтобы и они не пришли в это место мучения.
      cn: 盖我有兄弟五人、使彼于其前为证、免彼等亦来此痛苦之处、
  - type: paragraph
    text:
      ru: Несчастный богач, не получив облегчения своей участи, прилагает просьбу о других. Смотри, как он чрез наказание пришел к сочувствию другим, и тогда как прежде презирал Лазаря, у ног его лежащего, теперь заботится о других, кои не находятся при нем, и умоляет послать в дом отца своего Лазаря из мертвых, не просто кого-нибудь из мертвых, но Лазаря, чтобы видевшие его прежде больным и бесчестным увидели теперь увенчанным славой и здоровым, и бывшие свидетелями его убожества сами сделались созерцателями его славы. Ибо очевидно, он имел бы явиться им во славе, если бы нужно было быть ему проповедником, достойным вероятия. Что же сказал Авраам?
      cn: 这位不幸的富人，在自己没有得到处境上的缓解时，转而为他人提出请求。你看，他是如何通过惩罚而对他人产生了同情，并且，虽然他以前蔑视躺在他脚边的拉撒路，现在却关心起那些不在他身边的人，并恳求差遣拉撒路从死里到他父的家里去。不是简单地差遣任何一个从死里复活的人，而是拉撒路，好让那些以前见过他患病、蒙羞的人，现在能见到他被荣耀所冠冕、且健壮，并且那些曾见证他贫困的人，自己也能成为他荣耀的瞻仰者。因为很明显，如果他需要成为一个值得信赖的宣讲者，他就必须以荣耀的姿态向他们显现。那么阿乌拉阿阿木说了什么呢？
  - type: paragraph
    initial:
      ru: 'Лк 16:29. '
      cn: （路加福音 16:29）
    text:
      ru: Авраам сказал ему; у них есть Моисей и пророки; пусть слушают их.
      cn: 阿乌拉阿木语之曰、彼等有摩伊些乙及诸先知、可听之、
  - type: paragraph
    text:
      ru: Ты, – говорит, – не так печешься о братьях, как Бог, Творец их. Он приставил к ним бесчисленных наставников.
      cn: 「你——他说——对弟兄们的挂虑，不如上帝、他们的创造者那般深切。祂给他们安置了无数的导师。」
  - type: paragraph
    initial:
      ru: 'Лк 16:30. '
      cn: （路加福音 16:30）
    text:
      ru: 'Он же сказал: нет, отче Аврааме, но если кто из мертвых придет к ним, покаются.'
      cn: 彼曰、我父阿乌拉阿木乎、非也、若有由死复活之人就之、彼等将悔改矣、
  - type: paragraph
    text:
      ru: А богач говорит:«нет, отче»! Ибо как сам, слыша Писания, не верил и слова их считал баснями, так предполагал и о братьях своих и, судя по себе, говорит, что они Писаний не послушают, как и сам он, но если кто воскреснет из мертвых, поверят.
      cn: 于是财主说：「不，父啊！」盖因他自己，听闻经文（Писания），尚且不信，并且视其言语为荒诞之言（баснями）；因此，他也如此推断他的弟兄们。他以己度人，说他的弟兄们将不会听从经文（Писаний），就如同他自己一样，但若有人从死人中复活去见他们，他们就会相信。
  - type: paragraph
    initial:
      ru: 'Лк 16:31. '
      cn: （路加福音 16:31）
    text:
      ru: 'ТогдаАвраамсказал ему: если Моисея и пророков не слушают, то если бы кто и из мертвых воскрес, не поверят.'
      cn: 其时、彼对曰、若不听摩伊些乙及诸先知、纵由死复活者、彼等亦不信也、
  - type: paragraph
    text:
      ru: 'Есть и ныне подобные люди, кои говорят: кто видел, что делается в аде? Кто пришел оттуда и возвестил нам? Пусть же они послушают Авраама, который говорит, что если мы не слушаем Писаний, то не поверим и тем, кто пришел бы к нам из ада. Это очевидно из примера иудеев. Они, так как не слушали Писаний, не поверили и тогда, когда видели мертвых воскресшими, даже помышляли и убить Лазаря (Ин. 12, 10). Равным образом и после того, как при Распятии Господа воскресли многие усопшие (Мф. 27, 52), иудеи дышали на апостолов еще большим убийством. Притом, если б это воскрешение мертвых было полезно для нашей веры, Господь творил бы оное часто. Но ныне ничто так не полезно, как тщательное исследование Писаний (Ин. 5, 39). Воскрешать мертвых (хотя) призрачно умудрился бы и диавол, и поэтому ввел бы неразумных в заблуждение, всеяв между ними учение об аде, достойное своей злобы. А при здравом нашем исследовании Писаний, диавол не может ничего такого выдумать. Ибо они (Писания) суть светильник и свет (2Пет. 1, 19), при сиянии которого вор обнаруживается и открывается. Итак, нужно Писаниям веровать, а не требовать воскрешения мертвых.'
      cn: 如今也有类似的人，他们会说：谁见过地狱里发生的事情？谁从那里回来并向我们宣告了？让他们听一听阿乌拉阿阿木所说的话吧，阿乌拉阿阿木说，如果我们不听从经文，那么我们也不会相信那些从地狱来到我们这里的人。这从犹太人的例子中显而易见。他们因为不听从经文，所以甚至在看到死人复活时也不相信，他们甚至盘算着要杀害拉撒路（伊鄂昂福音 12:10）。同样地，在主被钉十字架时，有许多已故之人复活之后（马太福音 27:52），犹太人仍以更大的杀机针对使徒。此外，如果这死人复活对于我们的信仰有益，主就会经常行此事。但如今，没有什么比仔细查考经文更有益的了（伊鄂昂福音 5:39）。（尽管）魔鬼也能巧妙地假性地（призрачно）使死人复活，并因此引入不理智的人进入迷途，在他们当中播撒与他邪恶相称的关于地狱的教义。但是，在我们健全地查考经文时，魔鬼就无法虚构出任何此类事情。因为它们（经文）是灯台和光亮（彼得后书 1:19），在这光辉之下，盗贼被揭露并显明出来。因此，需要相信经文，而不是要求死人复活。
  - type: paragraph
    text:
      ru: Можно понимать притчу сию и в переносном смысле, например, так, что лицом богача обозначается народ еврейский. Он прежде был именно богат, обогащен всяким знанием и мудростью, и речениями Божиими, которые честнее злата и камений многоценных (Притч. 3, 14–15). Он одевался в порфиру и виссон, имея царство и священство и сам будучи царским священством Богу (Исх. 19, 6). Порфира намекает на царство, а виссон на священство. Ибо левиты при священнодействиях употребляли облачения из виссона. Он и веселился на все дни блистательно, ибо всякий день утром и вечером приносил жертвы, которые носили и название бесконечности, то есть непрерывности.
      cn: 可以以一种转喻的方式理解这个比喻，例如，那富人所代表的乃是犹太民族。他此前确是富足的，被各样的知识与智慧、以及神的言语所充实，这些言语比金子和贵重的宝石更加珍贵（箴言 3:14-15）。他身着紫色袍与细麻布衣，拥有王国与祭司职任，并且他自己就是神的皇家祭司团（出埃及记 19:6）。紫色袍暗示着王国，而细麻布衣则暗示着祭司职任。因为利未人在行圣事时所穿着的圣袍就是用细麻布制成的。他终日亦是过着奢华宴乐的生活，因为他每天早晨和晚上都献上祭物，这些祭物也带有着永恒性（即连续性）的名称。
  - type: paragraph
    text:
      ru: Лазарем были язычники, народ, бедный Божественными дарованиями и мудростью и лежавший у ворот. Ибо язычникам не позволено было входить в дом Божий; вход их туда считался осквернением, как видно из книги Деяний. Асийские иудеи с возмущением кричали на Павла, что ввел язычников во храм и осквернил сие святое место (Деян. 21, 27–28). Язычники изранены были зловонными грехами и своими ранами питали бесстыдных псов, бесов; ибо язвы наши (духовные) для них удовольствие. Язычники желали питаться крошками, падающими от стола богача; ибо они не имели никакого участия в хлебе, укрепляющем сердце (Пс. 103, 15), и нуждались в пище тончайшей, немногой и разумной, как жена хананейская, будучи язычницей, желает напитаться крошками (Мф. 15, 22, 26–27). Что же далее? Народ еврейский умер для Бога, и кости его омертвели, так как он не делал никакого движения к добру. И Лазарь, что есть народ языческий, умер для греха. Иудеи, умершие в грехах своих, сожигаются пламенем зависти, ревнуя, как говорит апостол, о том, что язычники приняты в веру (Рим. 11, 11). А язычники, прежде бедный и бесславный народ, по справедливости живут в недрах Авраама, отца язычников. Авраам, быв язычником, уверовал в Бога и от служения идолам перешел к богопознанию. Поэтому и те, кои стали участниками в его обращении и вере, справедливо покоятся в его недрах, наследовав такую же, как и он, участь, обители и восприятие благ. Иудейский народ желает хотя одной капли от прежних законных окроплений и очищений, чтобы язык его прохладился и мог смело что-нибудь сказать против нас в пользу силы Закона, но не получает. Ибо Закон только до Иоанна (Мф. 11, 13).«Жертвы, – сказано, –и приношения Ты не восхотел»и далее (Пс. 39, 7). И Даниил предвозвестил:«запечатаны были видение и пророк, и помазан был Святый святых»(Дан. 9, 24), то есть прекратились и заключились.
      cn: 拉撒路（Lazarus）是外邦人，是缺乏神圣恩赐与智慧的民族，躺卧在门前。因为外邦人不被允许进入神的殿；他们进入殿中被视为玷污，如《使徒行传》中所见。亚细亚（Asiatic）的犹太人愤怒地向保罗（Paul）喊叫，说他把外邦人带进了圣殿，并玷污了这圣地（使徒行传 21:27-28）。外邦人被恶臭的罪恶所创伤，他们的伤口滋养着那些无耻的狗——魔鬼；因为我们（灵性上的）创伤对它们而言是一种欢愉。外邦人渴望以从财主桌上掉下来的碎屑为食；因为他们不曾参与于那能坚固人心的饼（诗篇 103:15），他们需要最细微、最少的、以及理性的食物，正如迦南的妇人（一个外邦人）渴望以碎屑为饱足（马太福音 15:22，26-27）。那么接下来如何呢？犹太民族对神而言已死，他们的骨头已僵硬，因为他们对良善毫无作为。而拉撒路，即外邦民族，对罪而言已死。在自己的罪中死去的犹太人，正被嫉妒的火焰所焚烧，他们嫉妒外邦人被接纳进入信仰，正如使徒所言（罗马书 11:11）。而外邦人，这个先前贫穷且无荣耀的民族，正义地居住在外邦人之父阿乌拉阿阿木（Abraham）的怀中。阿乌拉阿阿木本为外邦人，但他信靠了神，并从侍奉偶像转向上帝的认知。因此，那些参与了其转变和信仰的人，正义地安息在他的怀中，继承了与他相同的命运、居所和对福祉的领受。犹太民族渴望得到哪怕一滴来自先前律法上的洒水和洁净，以便他们的舌头得以清凉，能大胆地说出些什么来反对我们，以支持律法的力量，但他们得不到。因为律法只到伊鄂昂为止（马太福音 11:13）。「祭祀和供献，」经上说，「你都不愿，」以及下文（诗篇 39:7）。但以理（Daniel）也预先宣告：「异象和先知被封印，至圣者被膏抹」（但以理书 9:24），即指这些都停止并终结了。
  - type: paragraph
    text:
      ru: 'Можешь ты и нравственно понимать эту притчу. Именно: будучи богат злом, не оставляй ума твоего терпеть голод и, когда он создан для стремления к небу, не повергай его долу и не заставляй лежать при воротах, но вводи его вовнутрь, и не стой вне, не блуждай, не лежи, но действуй. Это послужит тебе началом для разумной деятельности, а не наслаждения только плотского. И прочие части притчи удобно понимать в пользу нравственности.'
      cn: 你也可以从道德层面理解这个比喻。确切地说：既然你恶贯满盈（富于罪恶），就不要任由你的理性（心智）忍受饥饿，当它被造是为了渴慕天国时，就不要将它倾覆在地（向下倾倒），不要迫使它躺卧在门边，而是要将它引入内里，不要站在外面，不要徘徊游荡，不要躺卧，而要行动起来。这会成为你进行理智活动（而非仅仅是肉体享乐）的开端。比喻中的其他部分也适于为道德教益而理解。
- type: heading1
  text:
    ru: Глава семнадцатая
    cn: 第十七章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 17:1. '
      cn: （路加福音 17:1）
    text:
      ru: 'Сказал такжеИисусученикам: невозможно не придти соблазнам, но горе тому, через кого они приходят;'
      cn: 彼向其门徒曰、祸哉、引诱不能不来惟由之而来者、
  - type: paragraph
    text:
      ru: 'Поскольку любостяжательные фарисеи роптали на Господа за то, что Он говорил о нестяжательности, то Он сначала сказал притчу о богатом и Лазаре, показывая им чрез нее, какое постигнет их наказание за привязанность к богатству; а потом обращает речь свою к ученикам о самих фарисеях, что они производят соблазн и удерживают других от Божественного пути и что за сие в удел их предлежит им«горе». Посмотрим же, что Он говорит.«Невозможно не придти соблазнам, но горе тому, через кого они приходят», то есть невозможно не прийти соблазнам или препятствиям в доброй и боголюбезной жизни. Ибо при многой злобе людей необходимо оказаться и множеству препятствий проповеди и истине. Но горе только«тому, чрез кого они приходят», то есть виновнику их, каковы фарисеи, соблазняющие и препятствующие проповеди. Многие с недоумением спрашивают: если необходимо прийти соблазнам и невозможно проповеди не встретить препятствий, то за что же, Господи, ты осуждаешь и называешь несчастными виновников соблазнов? Они стали такими по необходимости, а все, что делается по необходимости, достойно прощения.'
      cn: 鉴于贪婪的法利赛人因主谈论不贪财而抱怨，祂首先讲了富人与拉撒路的寓言，借此向他们展示，他们因依恋财富将遭受何种惩罚；随后，祂将言语转向门徒，谈论这些法利赛人本身，即他们制造了诱惑（或「绊脚石」，соблазн），阻碍了他人走上神圣的道路，并且因此，「祸」将是他们所要承受的命运。让我们看看祂说了什么：「祸哉、引诱不能不来惟由之而来者」（路加福音 17:1），即诱惑（соблазнам，或「绊脚石」）或妨碍正直且为神所爱的生活是不可避免的。因为在人们的诸多邪恶之中，必然会出现众多阻碍福音宣讲（проповеди）和真理的障碍。然而，「祸」只降临在「通过他们而来者」，即那些诱惑的始作俑者，例如那些使人诱惑并阻碍福音宣讲的法利赛人。许多人困惑地问道：如果诱惑是必然会来的，如果福音宣讲不可避免地会遇到障碍，那么，主啊，你为何要定罪并称那些制造诱惑的始作俑者为不幸的人呢？他们是出于必然性才变成那样的，而一切出于必然性所做之事，都应得到宽恕。
  - type: paragraph
    text:
      ru: 'Знай же, что самая необходимость эта имеет начало в свободном произволении. Скажу яснее: Господь, видя злобу тогдашних людей, видя, как они прилежат злу и не избирают ничего доброго, сказал, что, судя по следствию из того, что теперь пред глазами, необходимо прийти соблазнам. Итак, злоба, которой люди услаждались, – дело произвола, а произведение соблазнов необходимо следовало от злобы; поэтому-то виновники соблазнов и достойны наказания. Можно пояснить это примером. Врач, видя, что такой-то ведет дурной образ жизни и предается неумеренности, может сказать, что он необходимо заболеет. Ужели эта болезнь необходима? Да, как следствие дурного образа жизни, необходима. Поэтому, горе препятствующим проповеди за то, что они дошли до такой злобы, что необходимо стало прийти соблазнам.'
      cn: 须知，这最大的必要性，其开端则在于自由的意愿。我将说得更清楚些：主，目睹当时之人的邪恶，看到他们如何沉溺于恶，不选择任何良善之事，便说，从眼下所见之结果来看，引诱（诱惑）必会到来。因此，人所沉溺的邪恶，是自由意愿的作为；而引诱的产生，则是邪恶的必然结果。正因如此，引诱的肇事者（作祟者）才应受惩罚。这可以用一个例子来阐明。医生，看到某人过着不好的生活方式，沉溺于放纵，可能会说他必然会生病。难道这疾病是必然的吗？是的，作为不良生活方式的结果，它是必然的。因此，那些阻碍传道者，有祸了，因为他们已达到如此邪恶的程度，以致引诱的到来已成为必然。
  - type: paragraph
    initial:
      ru: 'Лк 17:2. '
      cn: （路加福音 17:2）
    text:
      ru: лучше было бы ему, если бы мельничный жернов повесили ему на шею и бросили его в море, нежели чтобы он соблазнил одного из малых сих.
      cn: 与其引诱此小子中之一、寗以磨石悬其颈投于海、
  - type: paragraph
    initial:
      ru: 'Лк 17:3. '
      cn: （路加福音 17:3）
    text:
      ru: Наблюдайте за собою.
      cn: 〇自慎、若尔弟兄得罪尔、则戒之、若悔改则恕之、
  - type: paragraph
    text:
      ru: И подлинно, человеку, производящему соблазны и препятствия, лучше, чтоб«ему... повесили... жернов... мельничный... и бросили его в море», нежели чтоб соблазнить и совратить«одного из малых», то есть верных. Поэтому Господь предостерегает учеников:«Наблюдайте за собою». Вот, – говорит, – Я прежде вам сказываю, что придет зло, не будьте в ответе. Ибо злу необходимо прийти, но нет необходимости вам погибнуть, если будете осторожны и вооружитесь. Необходимо прийти волку, но если пастух бодрствует, нет необходимости овцам погибнуть, а волк должен уйти с пустым зевом. Господь сказал это о соблазнителях и тех, кои вредят проповеди, то есть препятствуют. Поскольку между ними есть большое различие, ибо одни неисцелимы как фарисеи, а другие излечимы как братья Господа по отношению к Самому Господу, ибо и они не веровали в Него (Ин. 7, 5).
      cn: 诚然，对于一个制造了诽谤与障碍的人而言，他最好是「被...挂上...一块磨石...投入海中」，也好过他去诽谤和引诱「那些小子中的一个」，也就是那些信徒。因此，主耶稣预先警告门徒：「你们要谨慎！」祂说：「看哪，我事先告诉你们，邪恶（或：恶事）必要来，但你们不要因此担责。因为邪恶必然会来临，但如果你们谨慎并武装自己，便没有必要灭亡。豺狼必然会来临，但如果牧人警醒，羊群便没有必要灭亡，而豺狼必然会空着口离开。」主耶稣谈论这些是针对那些诽谤者和那些损害传道工作的人，即制造障碍的人。因为他们之间存在着巨大的差异，因为有些人像法利赛人那样无可救药，而另一些人则可以被治愈，就像主的弟兄们对待主自己一样，因为他们也曾不信祂（伊鄂昂福音 7:5）。
  - type: paragraph
    text:
      ru: Если же согрешит против тебя брат твой, выговори ему; и если покается, прости ему;
      cn: 如果你的弟兄得罪了你，你要责备他；如果他悔改，就饶恕他；
  - type: paragraph
    text:
      ru: Итак, поскольку большое различие между препятствующими проповеди, ибо между ними могли быть некоторые и единоверные, то Господь говорит:«если... брат твой... согрешит против тебя», ты«выговори ему»наедине, и«если послушает тебя, ты... приобрел»его,«если же не послушает, возьми с собой еще одного или двух», и прочая, что евангелист Матфей (Мф. 18, 15–17) изобразил пространнее, а евангелист Лука прошел молчанием, как сказанное уже евангелистом Матфеем. Кто послушает выговор, тот достоин прощения; а кто не послушает, тот«да будет... тебе как язычник и мытарь», то есть мерзок и недостоин называться братом.
      cn: 因此，鉴于在阻碍传道者之间存在巨大的差异（因为他们当中可能有一些是同信仰者），主说道：「若……你弟兄……得罪你」，你私下「责备他」，若「听从你，你便……得了」他，「若不听从，就带一两个同去」，以及其他，福音传道者马太（马太福音 18:15-17）描绘得更为详尽，而福音传道者路加则保持缄默，因其已被福音传道者马太言说过。听从责备的人，配得饶恕；而不听从的人，「就……看他像外邦人和税吏一样」，也就是看作可憎的、不配被称为弟兄的。
  - type: paragraph
    initial:
      ru: 'Лк 17:4. '
      cn: （路加福音 17:4）
    text:
      ru: 'и если семь раз в день согрешит против тебя и семь раз в день обратится, и скажет: каюсь, – прости ему.'
      cn: 若一日七次得罪尔、又一日七次自省反向尔曰、我悔矣、而当恕之、
  - type: paragraph
    text:
      ru: 'Потом, как бы кто сказал: пусть так, Господи! Ты хорошо это различил; но что делать с тем, кто много раз получил прощение и снова вредит? Господь говорит: если он снова покается, прости ему. И еще:«если... и семь раз в день обратится,... прости ему». А слово«семь раз в день»поставлено здесь вместо слова «многократно», подобно как в выражении:«даже бесплодная рождает семь раз»(1Цар. 2, 5). Итак, сколько раз он покается, столько раз должно прощать ему. И не подумай, будто Господь полагает число, сколько раз прощать, но, как я прежде сказал,«семь раз в день»понимай вместо «многократно» и бесчисленно. Мы говорим же в обычной беседе: в таком-то городе тьма (десять тысяч) жителей, но говорим не потому, что в нем в самом деле десять тысяч жителей, ибо их может быть и больше в нем, а вместо того, чтоб назвать город очень многолюдным, мы говорим, что в нем десять тысяч жителей. А что«семь раз в день»употреблено в том значении, это видно из Евангелия от Матфея (Мф. 18, 21–22). Ибо там, когда Петр сказал: Господи, должен ли я прощать ему (брату моему) до семи раз? Господь сказал; не«до семи, но до седмижды семидесяти раз», обозначая чрез сие бесчисленное множество раз.'
      cn: 接着，似乎有人会说：主啊，就这么办吧！你很好地分辨了这一点；但对于那个多次获得赦免却又再次加害的人，我们该怎么办呢？主说：如果他再次悔改，你就赦免他。还有：「如果……并且一天七次转向（悔改），……赦免他。」而「一天七次」这个词语在此处是用来代替「多次」这个词语的，如同在「甚至不孕的妇人也生育七次」（撒母耳记上 2:5）这个表达中一样。因此，他悔改多少次，就应当赦免他多少次。你不要以为主是在设定一个赦免的次数，而是，正如我先前所说，「一天七次」应当理解为「多次」和无数次。我们在日常谈话中也说：在某某城市里有一「万」（一万）居民，但我们这么说不是因为那个城市真的有一万居民，因为其中的居民可能比这更多，我们只是用这个说法来表示那个城市人口非常众多，我们说它有一万居民。而「一天七次」是用于此种意义的，这一点从（马太福音 18:21-22）可见。因为在那段经文中，当彼得说：主啊，我应当赦免他（我的弟兄）直到七次吗？主说：「不是直到七次，而是直到七十个七次」，以此来表示无数次的次数。
  - type: paragraph
    initial:
      ru: 'Лк 17:5. '
      cn: （路加福音 17:5）
    text:
      ru: 'И сказали Апостолы Господу: умножь в нас веру.'
      cn: 宗徒谓主曰、使我侪之信益加、
  - type: paragraph
    text:
      ru: Апостолы веровали в Господа, однако же, придя в сознание своей слабости, поняв, что Господь сказал о чем-то великом, и, услышав об опасности от соблазнов, просят, чтобы умножилась в них сила веры, чтобы чрез нее они могли исполнить то, что Он сказал, то есть относительно нестяжательности. Ибо ничто так не укрепляет в нестяжательности, как вера в Бога и твердое на Него упование, равно как ничто так не располагает к собиранию сокровищ, как неверие, что Бог есть великий сокровищехранитель (казначей), а благость Его – неистощимая сокровищница; притом с верой они могут противостоять соблазнам. Поэтому апостолы приступают к Господу и говорят:«умножь в нас веру», то есть яви нас совершеннейшими и твердейшими в вере.
      cn: 宗徒们（使徒们）相信主，然而，当他们意识到自身的软弱，明白主所言是关于某件伟大的事，并且听闻了关于诱惑（senses）的危险之后，他们请求，愿信德的力量在他们之内倍增，好让他们能借此力量去履行祂所说的话，也就是关于不贪恋财物（不占有财产）的教导。因为，没有什么能比对上帝的信仰和对祂的坚定信靠更能在不贪恋财物方面给人以力量；同样地，没有什么能比不相信上帝是一位伟大的宝藏守护者（或作：财务主管），而祂的良善是一座取之不尽的宝库，更能使人倾向于积聚财宝。况且，藉着信德，他们能够抵御诱惑。因此，宗徒们来到主跟前说：「增加我们的信德吧」，也就是：让我们在信德中显得更加完美、更加坚定。
  - type: paragraph
    initial:
      ru: 'Лк 17:6. '
      cn: （路加福音 17:6）
    text:
      ru: 'Господь сказал: если бы вы имели веру с зерно горчичное и сказали смоковнице сей: исторгнись и пересадись в море, то она послушалась бы вас.'
      cn: 主曰、若尔等有信如芥种、即命此桑拔根而植于海、伊必听尔、
  - type: paragraph
    text:
      ru: 'Господь, показывая им, что просьба их хороша и что им нужно твердо содержать ту мысль, что вера имеет великую силу, говорит: если бы вы имели веру, вы пересадили бы и эту смоковницу. Здесь две великие вещи, именно: что укоренилось в земле, то, во-первых, передвинулось бы со своего места, а во-вторых, пересадилось бы в море. А что может быть посажено в воде? Очевидно, сими словами Господь показывает силу веры. Быть может, кто-нибудь в переносном смысле под«смоковницей»будет разуметь диавола, так как он изобрел для нас вечного червя и питает его насаждаемыми им помыслами; ибо смоковничными листьями питаются черви, от которых бывают шелковые нити. Так и сию смоковницу вера может искоренить из сердца человеческого и бросить в море, то есть низвергнуть в бездну.'
      cn: 主、向他们展示他们的请求是好的，以及他们需要坚定地持守那个想法，即信心具有巨大的力量，他说：如果你们有信心，你们就能移植这棵桑树。这里有两件伟大的事情：第一，那在地上扎根的，会从其原位移动；第二，它会被移植到海里。有什么能被栽种在水里呢？显然，主以这些话展示了信心的力量。也许有人会在比喻的意义上，将「桑树」理解为魔鬼，因为他为我们发明了永恒的虫，并以他所栽种的意念来喂养它；因为虫是以桑树叶为食的，蚕丝就出自它们。同样，信心能将这桑树从人心之中根除，并将其抛入海里，即将其投入深渊。
  - type: paragraph
    initial:
      ru: 'Лк 17:7. '
      cn: （路加福音 17:7）
    text:
      ru: 'Кто из вас, имея раба па́шущего или пасущего, по возвращении его с поля, скажет ему: пойди скорее, садись за стол?'
      cn: 尔等中谁有仆、或耕或牧、彼自其田而归后、遂命之曰速席坐乎、
  - type: paragraph
    initial:
      ru: 'Лк 17:8. '
      cn: （路加福音 17:8）
    text:
      ru: 'Напротив, не скажет ли ему: приготовь мне поужинать и, подпоясавшись, служи мне, пока буду есть и пить, и потом ешь и пей сам?'
      cn: 然岂不曰、备我晚飧、束带事我、待我饮食毕后、尔可饮食乎、
  - type: paragraph
    initial:
      ru: 'Лк 17:9. '
      cn: （路加福音 17:9）
    text:
      ru: Станет ли он благодарить раба сего за то, что он исполнил приказание? Не думаю.
      cn: 因其遵所命者、岂谢其仆乎、我意不然、
  - type: paragraph
    initial:
      ru: 'Лк 17:10. '
      cn: （路加福音 17:10）
    text:
      ru: 'Так и вы, когда исполните всё повеленное вам, говорите: мы рабы ничего не стоящие, потому что сделали, что́ должны были сделать.'
      cn: 如此尔曹尽行所命尔者、亦当曰、我等乃无益之仆、行所当行者耳、
  - type: paragraph
    text:
      ru: Сказав это о вере, Господь присовокупляет и другое очень нужное учение. Какое же? Учение о том, что не должно гордиться совершенствами. Поскольку вера совершает многое и содержащего ее соделывает исполнителем заповедей, украшая его при сем и чудотворениями, а от сего человек легко может впасть в высокомерие; поэтому Господь предостерегает апостолов не превозноситься совершенствами, представляя прекрасный пример.«Кто, – говорит, –из вас имея раба»и прочее. Этой притчей объявляется, что не должно величаться никаким совершенством, ни даже исполнением всех заповедей. Ибо на рабе лежит необходимая обязанность исполнять приказания господина, однако же исполнение их не должно вменяться ему в совершенство. Ибо, если раб не будет делать, он достоин ран; а когда сделал, пусть довольствуется тем, что избежал ран, а не должен за это необходимо требовать платы. Ибо заплатить ему, особенно же подарить что-нибудь, зависит от великодушия господина. Так и Богу работающий не должен превозноситься, если исполнит заповеди, ибо он не сделал ничего великого. Напротив, если бы он не исполнил, ему было бы горе, как говорил апостол:«горе мне, если не благовествую!»(1Кор. 9, 16). Равным образом, если он получил дарования, он не должен ими величаться, ибо дарования даны ему по милости Божией, а не потому, будто бы Владыка был ему должен. Ибо особенный долг раба, по отношению к его господину, исполнять все его приказания. Если же мы не должны думать о себе ничего великого и тогда, когда соблюдем все заповеди, то, что мы такое бываем, когда не исполняем и малой части заповедей Божиих, да еще гордимся? Обрати внимание и на то выражение притчи, что прежде поставлено«пaшущего», а потом присовокуплено«пасущего». Ибо, кому бы то ни было, прежде нужно землю возделывать, а потом уже принимать в руки и пастырскую должность. Кто хорошо возделал свою плоть, как бы какую землю, тот достоин быть и для других пастырем. Ибо кто не умеет собственным домом управлять, как следует, тот как будет пещись о Церкви (1Тим. 3, 5)? Итак, прежде возделай самого себя, и тогда уже других паси, как и пророк Иеремия сказал:«распашите себе новые нивы»(Иер. 4, 3), а потом просветите себе свет разума, чем обозначается важнейшая часть пастырской должности.
      cn: '主在说了关于信德的这些之后，又附加了另一个非常必要的教导。是什么呢？就是关于不应该以自身的完美而骄傲的教导。因为信德成就许多，并使拥有它的人成为诫命的实行者，同时还用行神迹奇事来装饰他，由此人很容易陷入傲慢自大；因此，主告诫使徒们，不要因自身的完美而自高自大，祂提出了一个绝妙的例子。「你们中间谁有仆人，」祂说，「等等。」


        这比喻宣告了：任何人不应该因任何完美而自负，甚至不应该因完成了所有的诫命而自负。因为奴仆有执行主人命令的必要义务，然而，执行这些命令本身不应被视作他的完美。因为，如果奴仆不去做，他就该受鞭打；而当他做了之后，他就该知足于避免了鞭打，而不是为此而必然地要求工钱。因为支付他报酬，尤其是赠与他什么东西，取决于主人的慷慨大度。


        同样地，服侍上帝的人，如果他遵守了诫命，也不应该因此而自高自大，因为他并没有做任何伟大的事。相反地，如果他不执行，他就有祸了，正如使徒所说：「我若不传福音，我便有祸了！」（哥林多前书 9:16）。


        同理，如果他领受了恩赐，他也不应为此而自负，因为恩赐是按着上帝的恩典赐予他的，而不是因为主人欠了他什么。因为奴仆对于他的主人，其特有的责任就是要执行他所有的命令。


        既然我们即使在遵守了所有诫命的时候，也不应该自视甚高，那么，当我们没有执行哪怕是上帝诫命中极小的一部分，却又骄傲自大时，我们又算得了什么呢？


        请留意比喻中的措辞，即首先提及了「耕种的」（пaшущего），然后才加上了「放牧的」（пасущего）。因为，无论是谁，首先需要耕耘土地，然后才能担起牧者的职位。一个很好地耕耘了自己的肉体，如同耕耘某种土地的人，才配成为别人的牧者。因为一个不知道如何好好管理自己家的人，又怎会照管教会呢（提摩太前书 3:5）？因此，首先耕耘你自己，然后才能牧养别人，正如先知耶利米所说：「要为自己开垦新田」（耶利米书 4:3），然后才要为自己点亮理性的光芒，这标志着牧者职责中最为重要的部分。'
  - type: paragraph
    initial:
      ru: 'Лк 17:11. '
      cn: （路加福音 17:11）
    text:
      ru: Идя в Иерусалим, Он проходил между Самариею и Галилеею.
      cn: 适彼往耶鲁萨利乙、必经萨玛利亚及戛利列亚之间、
  - type: paragraph
    initial:
      ru: 'Лк 17:12. '
      cn: （路加福音 17:12）
    text:
      ru: И когда входил Он в одно селение, встретили Его десять человек прокаженных, которые остановились вдали
      cn: 〇彼入一村之时、有十患癞者、迎遇之远立
  - type: paragraph
    initial:
      ru: 'Лк 17:13. '
      cn: （路加福音 17:13）
    text:
      ru: 'и громким голосом говорили: Иисус Наставник! помилуй нас.'
      cn: 扬声曰、伊伊稣斯师欤、矜怜我等、
  - type: paragraph
    text:
      ru: И отсюда всякий может познать, что никому ничто не препятствует богоугождать Богу, хотя бы он был из проклятого рода, но лишь только бы имел доброе произволение. Вот«десять человек прокаженных»встретили Иисуса, когда Он имел войти в один город. Встретили они Его вне города, ибо им, так как они считались нечистыми, не позволялось жить внутри города (Лев. 13, 46). Они остановились«вдали», как бы стыдясь мнимой своей нечистоты и не смея приблизиться в той мысли, что и Иисус возгнушается ими, как прочие то делали, возвышают голос и просят милости. По месту они стояли вдали, но по молитве стали вблизи. Ибо Господь близок ко всем призывающим Его в истине (Пс. 144, 18). Они просят милости не как от простого человека, но как от такого, который выше человека. Ибо они называют Иисуса Наставником, то есть Господином, Попечителем, Надзирателем, что очень близко к наименованию его Богом.
      cn: '从这里，任何人都可以认识到，没有任何事物会妨碍任何人取悦上帝，即使他出自被诅咒的家族，只要他拥有良善的自由意志（доброе произволение）。


        看哪，「十个麻风病人」遇见了耶稣，当时他正要进入一座城。他们在城外遇见了他，因为他们被视为不洁净的，不被允许居住在城内（利未记 13:46）。他们「远远地」站着，仿佛是为他们假定的不洁净而感到羞耻，不敢靠近，心想耶稣也会像其他人那样厌弃他们。他们扬声，祈求怜悯。


        按地方而言，他们站立在远处；但按祷告而言，他们靠近了。因为主亲近所有以真理求告他的人（诗篇 144:18）。


        他们祈求怜悯，不是将他视作一个普通人，而是视作一个超越人的人。因为他们称耶稣为教师（Наставником），也就是说，主宰（Господином）、照护者（Попечителем）、监督者（Надзирателем），这与称他为上帝非常接近。'
  - type: paragraph
    initial:
      ru: 'Лк 17:14. '
      cn: （路加福音 17:14）
    text:
      ru: 'Увидевих,Он сказал им: пойдите, покажитесь священникам. И когда они шли, очистились.'
      cn: 彼视之曰、往哉、示己于列司祭、适彼等往、行时则洁矣、
  - type: paragraph
    text:
      ru: Он (Иисус) повелевает им (прокаженным) показаться священникам. Ибо священники осматривали таковых, и от них сии принимали решение, чисты ли они от проказы, или нет (Лев. 13). Священники имели признаки, по коим они отмечали неизлечимую проказу. Да и тогда, когда кто заболел проказой, потом выздоровел, священники осматривали, и им приносили дар, какой повелено в Законе. Здесь же, когда прокаженные были непререкаемо таковы, какая была им нужда показаться священникам, если они не имели быть очищенными совершенно? Повеление им пойти к священникам указывало не на другое что, как на то, что они сделаются чистыми. Поэтому и сказано, что они, идя дорогой, очистились.
      cn: '他（耶稣）命令他们（那些患麻风病的人）去向司祭们示己。因为司祭们检查过这类人，并且由他们来决定这些人是否已从麻风病中洁净，抑或尚未洁净（利未记 13）。司祭们拥有用以判定不可治愈的麻风病的标记。再者，即使某人患了麻风病，后来康复了，司祭们也会进行检查，并且人们要向他们献上律法中所规定的礼物。


        然而在此，当这些患麻风病的人无可争议地是如此的时候，如果他们不是要被完全洁净，他们有什么必要去向司祭们示己呢？命令他们去见司祭们，指示的并非别的事，正是他们将变得洁净。因此经文也说，他们在行路途中，就得以洁净了。'
  - type: paragraph
    initial:
      ru: 'Лк 17:15. '
      cn: （路加福音 17:15）
    text:
      ru: Один же из них, видя, что исцелен, возвратился, громким голосом прославляя Бога,
      cn: 其中一人见己已愈、即反以大声荣光上帝、
  - type: paragraph
    initial:
      ru: 'Лк 17:16. '
      cn: （路加福音 17:16）
    text:
      ru: и пал ниц к ногам Его, благодаря Его; и это был Самарянин.
      cn: 俯伏于其足下称谢之、其乃萨玛利亚人也、
  - type: paragraph
    text:
      ru: Но смотри, как мы и сначала говорили, из десяти человек девять, хотя они были и израильтяне, остались неблагодарными. А самарянин, хотя был и чуждого рода, возвратился и высказал свою признательность (а самаряне были ассирияне), чтобы никто из язычников не отчаивался, и никто из происходящих от святых предков сим не хвалился.
      cn: 但是你看，正如我们一开始所说的，十个人中有九个，尽管他们是以色列人，却仍然不知感恩。而那个撒玛利亚人，尽管是外邦血统，却返回并表达了他的感激（撒玛利亚人是亚述人），为的是让外邦人中没有人灰心绝望，也让那些源自神圣祖先的人不要以此夸耀。
  - type: paragraph
    initial:
      ru: 'Лк 17:17. '
      cn: （路加福音 17:17）
    text:
      ru: 'Тогда Иисус сказал: не десять ли очистились? где же девять?'
      cn: 伊伊稣斯对之曰、洁者非十人乎、其九者安在、
  - type: paragraph
    initial:
      ru: 'Лк 17:18. '
      cn: （路加福音 17:18）
    text:
      ru: как они не возвратились воздать славу Богу, кроме сего иноплеменника?
      cn: 此异族人外、未见一人反而归荣光上帝者乎、
  - type: paragraph
    initial:
      ru: 'Лк 17:19. '
      cn: （路加福音 17:19）
    text:
      ru: 'И сказал ему: встань, иди; вера твоя спасла тебя.'
      cn: 遂语之曰、起、往哉、尔之信拯救尔矣、
  - type: paragraph
    text:
      ru: Чудо сие намекает и на общее спасение, бывшее для всего рода человеческого. Десять прокаженных обозначают всю природу человеческую, прокаженную злобой, носящую на себе безобразие греха, живущую за нечистоту свою вне города небесного и отстоящую далеко от Бога. Это самое отстояние вдали от Бога ходатайствовало о милости. Ибо для человеколюбивого и желающего всех спасти и облагодетельствовать Бога самое сильное побуждение к милости – видеть, что никто не участвует в благости. По этому-то самому Он преклонился уврачевать находящихся в таком положении. И хотя Он уврачевал всю прокаженную природу, воплотившись и вкусив смерть за всякого человека, однако иудеи, несмотря на то, что со стороны Господа очищены от всех нечистот прокаженного греха, оказались неблагодарными и не обратились от суетного своего пути, чтобы дать славу Спасителю Богу, то есть поверить Ему, что Он, истинный Бог, благоволил претерпеть самые тяжкие страдания. Ибо Плоть и Крест суть слава Божия. Итак, они Воплощенного и Распятого не признали Господом славы. А язычники, народ чуждый, признали очистившего их и прославили Его верой, что Бог столько человеколюбив и силен, что ради нас принял на Себя крайнее бесчестие, что составляет дело человеколюбия, и, приняв оное, никакого вреда не потерпел в Своем естестве, что составляет дело могущества.
      cn: 这个神迹也暗示了为整个人类所成就的普遍救赎。这十个麻风病人象征着整个人性，它因邪恶而得了麻风病，带着罪的丑陋，因着它的不洁而生活在属天城邑之外，并且远离上帝。正是这种远离上帝的状况促成了恩典。因为对于慈爱、渴望拯救并恩泽所有人的上帝而言，看到没有人分享良善，就是促使祂施予恩典的最强大的动力。正是因此，祂屈身医治了处于这种境况中的人。虽然祂藉着道成肉身并为每一个人尝了死味，医治了所有患麻风病的人性，然而，犹太人，尽管他们已从主那边被洁净，脱离了麻风病般的罪的所有不洁，却表现出忘恩负义，没有从他们虚妄的道路上回转，去将荣耀归给救主上帝，即，相信祂是真上帝，乐意忍受最沉重的苦难。因为肉身与十字架就是上帝的荣耀。因此，他们没有承认道成肉身、被钉十字架的那位是荣耀之主。然而，异教徒，这个陌生的民族，却承认了洁净他们的那一位，并以信心荣耀了祂，相信上帝是如此地慈爱和全能，以至于祂为了我们承担了极度的羞辱，这是出于人慈的工作；并且，接受了它之后，祂的本性没有遭受任何伤害，这是出于权能的工作。
  - type: paragraph
    initial:
      ru: 'Лк 17:20. '
      cn: （路加福音 17:20）
    text:
      ru: Быв же спрошен фарисеями, когда придет Царствие Божие,
      cn: 〇发利些乙人有所问者、何时上帝之国临格、彼答之曰、上帝之国不显然而临格、
  - type: paragraph
    text:
      ru: 'Господь часто в Своем учении упоминал о Царствии Божием. Но фарисеи, при слухе об оном, смеялись над Господом и поэтому приступили с вопросом, когда оно придет, в виде насмешки над Ним, как над чудаком, проповедующим о необычайном и странном предмете. Ибо никто из прежде бывших учителей и пророков не упоминал о нем (Царствии Божием). Или, быть может, имея в уме намерение свое по немногом времени убить Его, приступают к Нему с вопросом, чтоб им укольнуть Его и осмеять, как бы так говоря: Ты ведешь речи о Царствии, когда же настанет это Царствие Твое? Ибо на утро Ты предан будешь нами на смерть, воздет будешь на крест и много иного бесчестия примешь. Что же Христос?'
      cn: 主在祂的教训中常提及上帝之国。然而，法利赛人一听到这个名词，便嘲笑主，因此他们前来提问：它何时临到？这是以一种嘲弄祂的方式，将祂视为一个宣讲非凡且古怪事物的怪人。因为在祂之前，没有任何教师或先知提及过（上帝之国）。或许，他们心中盘算着不久之后就要杀死祂，所以才前来提问，目的是要刺痛祂、嘲笑祂，仿佛在说：你谈论着国度，你的这个国度何时才会到来？因为到了明天，你就要被我们交付受死，被高举于十字架上，并要承受许多其他的羞辱。那么，基督又如何回应呢？
  - type: paragraph
    text:
      ru: 'отвечал им: не придет Царствие Божие приметным образом,'
      cn: 他回答他们说：上帝之国不会以显而可见的方式来临，
  - type: paragraph
    initial:
      ru: 'Лк 17:21. '
      cn: （路加福音 17:21）
    text:
      ru: 'и не скажут: вот, оно здесь, или: вот, там. Ибо вот, Царствие Божие внутрь вас есть.'
      cn: 并无人谓、顾、其在此、或顾、在彼、因上帝之国即在尔等衷、
  - type: paragraph
    text:
      ru: Он не отвечает безумным по их безрассудной мысли и безумию (Притч. 26, 4), но оставляет их блуждать относительно подобно-именности Царствия, и не открывает им ни того, о каком Он Царствии говорит (ибо они и не приняли бы), ни того, что Царствие сие не похоже на царство мирское, но есть Царствие премирное (Ин. 18, 36). Умолчав о сем, так как они по произвольной своей глухоте недостойны были слышать о сем, Господь о времени пришествия Царствия говорит, что оно неизвестно и не подлежит наблюдению; поскольку Царствие Божие не имеет определенного времени, но для желающего присуще во всякую пору. Ибо Царствие Божие, без сомнения, составляет жизнь и устроение себя по образу Ангелов. Тогда, говорится, поистине Бог царствует, когда в душах наших не находится ничего мирского, но когда мы во всем ведем себя выше мира. А такой образ жизни мы имеем внутри себя, то есть, когда захотим. Ибо для веры не нужно ни продолжительного времени, ни путешествий, но вера, и в след за верой – жизнь богоугодная, близки к нам. О сем самом апостол сказал:«Близко к тебе слово, в устах твоих и в сердце твоем, то есть слово веры, которое проповедуем»(Рим. 10, 8). Ибо, чтобы уверовать и, уверовав, ходить достойно звания, это внутри нас. Итак, фарисеи глумились над Господом за то, что Он проповедует Царствие, о котором никто не проповедовал. Но Господь объявляет, что они не понимают такого предмета, который находится внутри их и которого желающему очень удобно достигнуть. Ныне, когда Я нахожусь среди вас, вы, несомненно, можете получить Царствие Божие, если уверуете в Меня и решитесь жить по Моим заповедям.
      cn: 他没有回答那些愚昧的人，没有回答他们那愚蠢的思想和愚妄（箴言 26:4），而是任凭他们就「国度」（Царствия，直译「王国」）的同名性问题继续迷惘漂泊，既没有向他们启示他所说的究竟是哪一种国度（因为他们也不会接受），也没有启示他们这个国度不像世俗的国度，而是一个超世的国度（伊鄂昂福音 18:36）。主对这些保持缄默，因为他们由于自身故意的耳聋而不配听闻此事。至于国度降临的时间，主说它不为人知，也不受观察；因为上帝的国度没有特定的时间，而是对于渴望它的人在任何时候都存在。因为上帝的国度，毫无疑问，在于按照天使的样式来生活和安排自己。经文说，那时，上帝才真正地施行王权，即当我们的灵魂中没有任何世俗之物，而是当我们在一切事上都行事高于世界之时。而这种生活方式，即当我们愿意之时，就存在于我们内心之中。因为信仰既不需要长久的时间，也不需要旅行，而是信仰，以及随信仰而来的合乎上帝心意的生活，都与我们相近。使徒正是就此说了：「这话却很近你，在你的口中，在你的心里，就是我们所传信主的道」（罗马书 10:8）。因为，相信并信而行事配得上那召，这都在我们之内。因此，法利赛人讥笑主，因为他所宣讲的国度是此前无人宣讲过的。但是主宣称，他们不明白这样一个对象，它就在他们内部，并且对于渴望它的人来说是很容易达成的。如今，当我位于你们中间时，如果你们相信我并决定按照我的诫命生活，你们无疑可以得到上帝的国度。
  - type: paragraph
    initial:
      ru: 'Лк 17:22. '
      cn: （路加福音 17:22）
    text:
      ru: 'Сказал также ученикам: придут дни, когда пожелаете видеть хотя один из дней Сына Человеческого, и не увидите;'
      cn: 又谓门徒曰、有日将至、尔等欲见人子之一日、而不得见也、
  - type: paragraph
    text:
      ru: То есть, и вам присуще Царствие Божие, доколе Я нахожусь с вами. Присуще оно вам не потому только, что вы уверовали в Меня и последовали Мне, но и потому, что вы живете теперь с совершенной беззаботливостью, так как Я пекусь и помышляю о вас. Но когда Я не буду с вами, придут такие дни, что вы преданы будете опасностям, ведены будете к владыкам и царям. Тогда вы, как Царствия Божия, пожелаете теперешней безопасной жизни, какую ведете при Мне, и многократно пожелаете получить хотя бы один из Моих дней, то есть дней Моего пребывания с вами, как дней безопаснейших. Хотя они (ученики Господа) и в то время как с Ним были, вели жизнь не без трудов и опасностей, а терпели бегство с бегущим и оскорбление с оскорбляемым, но если прежние их приключения сравнить с будущими опасностями, то окажется, что они тогда были очень безопасны. Поэтому и при таком образе жизни, то есть при небольших опасностях и трудах, Царствие Божие было внутри апостолов; между тем как после Воскресения они были как бы пленники и изгнанники. Сими словами Господь приготовляет сердца апостолов к трудам и терпению и прежде сказывает им, чтоб они не соблазнялись (Ин. 16, 1).
      cn: 也就是说，上帝的国也临在于你们，只要我与你们同在。它临在于你们，不仅因为你们信了我、跟随了我，也因为你们现在过着完全无忧无虑的生活，因为我为你们操心并思虑着你们。但是，当我不再与你们同在之时，这样的日子将要来临，你们会被交付给危险，被带到掌权者和君王面前。那时，你们，作为上帝之国的子民，将会渴望现在这种在我身边所过的平安生活，并会多次渴望能得到哪怕我的一日，即我与你们同在的日子，将其视作最平安的日子。虽然他们（主的门徒）在与他同在之时，所过的生活也并非没有辛劳和危险，他们也忍受着与逃亡者一同逃亡，与受辱者一同受辱，但是，如果将他们以前的遭遇与未来的危险相比，就会发现他们那时是非常平安的。因此，即便在这种生活方式下，即在轻微的危险和辛劳中，上帝的国也在使徒们之内；而复活之后，他们却仿佛是俘虏和被放逐者。主用这些话语预备使徒们的心，使他们能够承受辛劳和忍耐，并预先告诉他们，叫他们不至于跌倒（伊鄂昂福音 16:1）。
  - type: paragraph
    initial:
      ru: 'Лк 17:23. '
      cn: （路加福音 17:23）
    text:
      ru: 'и скажут вам: вот, здесь, или: вот, там, – не ходите и не гоняйтесь,'
      cn: 人将告尔等、顾、在此、或顾、在彼、勿往、勿从、
  - type: paragraph
    text:
      ru: Не слушайте – говорит, – ничьих убеждений, будто Я пришел здесь или там.
      cn: 「莫要听信，」他说，「任何人的确信之言，说我已降临在此处或彼处。」
  - type: paragraph
    initial:
      ru: 'Лк 17:24. '
      cn: （路加福音 17:24）
    text:
      ru: ибо, как молния, сверкнувшая от одного края неба, блистает до другого края неба, так будет Сын Человеческий в день Свой.
      cn: 盖如电闪、在天此涯、而光在天彼涯、而人子在其日、亦如是然、
  - type: paragraph
    text:
      ru: 'Ибо второе Мое пришествие, блистательнейшее и славнейшее, не ограничится каким-нибудь местом, а как молния не скрывается, но является с одного края земли на другом краю, так светло и явно будет и второе Мое пришествие и ни для кого не будет сокрыто. Итак, не сдавайтесь на соблазны лжехристов. Прежде Я явился в яслях и тридцать лет был в уничижении, но тогда будет не так: Я приду во всей славе, в сопровождении ангельских воинств и в одно мгновение.'
      cn: 因为我第二次的降临，它将是无比辉煌而荣耀的，不会局限于任何地点。如同闪电不会隐藏，而是从大地的一端显现到另一端那样，我第二次的降临也将是同样光明而清晰的，不会对任何人隐藏。因此，不要屈服于假基督的诱惑。此前，我降临在马槽中，并在屈辱中度过了三十年，但那时将不再如此：我将带着全部的荣耀，在天使军团的陪伴下，在转瞬之间降临。
  - type: paragraph
    initial:
      ru: 'Лк 17:25. '
      cn: （路加福音 17:25）
    text:
      ru: Но прежде надлежит Ему много пострадать и быть отвержену родом сим.
      cn: 彼当先受多苦、为此世所弃、
  - type: paragraph
    text:
      ru: Потом, поскольку предсказал им страшные бедствия, утешая их и убеждая переносить оные мужественно, выставляет им Себя в пример. Не дивитесь, – говорит, – если случатся с вами такие трудности, что заставят вас пожелать возвращения теперешнего Моего пребывания с вами. Ибо и Я Сам, имеющий явиться как молния, прежде должен много пострадать и быть отверженным, и потом прийти в этой славе. Пусть же это будет для вас убеждением к добродетели и ободрением к терпению, то есть смотрите на Меня и уповайте, что и вам за перенесение опасностей и за отвержение достанется в удел слава, подобно как и Мне.
      cn: 随后，因为他预言了他们将遭遇的可怕的灾祸，为了安慰他们并说服他们勇敢地承受这些灾祸，他以自己作为他们的榜样。他说：「你们不要感到惊奇，如果你们遭遇的困难如此巨大，以至于让你们希望我此刻与你们同在的这种状态能够返回。因为连我本人，将要像闪电一样显现的我，也必当先受多苦，为此世所弃，然后才能带着这种荣耀降临。愿这成为你们对美德的信服，以及对忍耐的鼓舞，也就是说，你们要仰望我并抱持盼望，因为你们为了承受危险和为了被弃绝，也将分得荣耀为业，如同我一样。」
  - type: paragraph
    initial:
      ru: 'Лк 17:26. '
      cn: （路加福音 17:26）
    text:
      ru: 'И как было во дни Ноя, так будет и во дни Сына Человеческого:'
      cn: 〇如在诺乙之日、在人子之日亦将如是也、
  - type: paragraph
    initial:
      ru: 'Лк 17:27. '
      cn: （路加福音 17:27）
    text:
      ru: ели, пили, женились, выходили замуж, до того дня, как вошел Ной в ковчег, и пришел потоп и погубил всех.
      cn: 人皆饮食嫁娶、至诺乙入方舟之日、洪水至、灭亡一切、
  - type: paragraph
    initial:
      ru: 'Лк 17:28. '
      cn: （路加福音 17:28）
    text:
      ru: 'Та́к же, ка́к было и во дни Лота: ели, пили, покупали, продавали, садили, строили;'
      cn: 又如在罗特之日亦同、人皆饮食、买卖、栽种、建造、
  - type: paragraph
    initial:
      ru: 'Лк 17:29. '
      cn: （路加福音 17:29）
    text:
      ru: но в день, в который Лот вышел из Содома, пролился с неба дождь огненный и серный и истребил всех;
      cn: 至罗特出莎多木之日、自天投硫磺及火而灭亡一切、
  - type: paragraph
    initial:
      ru: 'Лк 17:30. '
      cn: （路加福音 17:30）
    text:
      ru: так будет и в тот день, когда Сын Человеческий явится.
      cn: 人子显日、亦如是日、
  - type: paragraph
    text:
      ru: И здесь Господь указывает на внезапность и неожиданность Своего пришествия. Ибо как при Ное внезапно пришел потоп и погубил всех, так будет и пришествие Его. Примерами этими, то есть примером людей предпотопных и содомлян (пред пожаром), намекается и на то, что в пришествие антихриста между людьми умножатся все неприличные удовольствия, что люди будут распутны и преданы преступным удовольствиям, как и апостол сказал, что«в последние дни... люди будут... более сластолюбивы, нежели боголюбивы»(2Тим. 3, 1–2, 4). И неудивительно, что при царстве обольстителя процветет зло. Ибо он есть пристанище злобы всякого греха. Что же иное постарается он вселить в жалкое поколение тогдашних людей, как не свои свойства? Ибо от нечистого, что может сделаться чистым? Итак, люди погрязнут тогда во всяком чувственном наслаждении, подобно как при Ное, и не будут ожидать никакой неприятности, даже не поверят, если кто-нибудь заговорит им о приключении какой-либо беды, подобно людям, жившим в дни Ноевы и во дни Лотовы.
      cn: 在此，主指出祂的降临是突如其来且出乎意料的。因为如同在挪亚的日子，洪水突然降临并毁灭了所有人一样，祂的降临也将是如此。通过这些例子，即：那些洪水前的人们和所多玛人（在火灾前）的例子，也暗示了在敌基督降临之时，各种不合宜的快乐将在人间增多，人们将变得放荡，沉溺于罪恶的享乐，正如使徒所言：「在末后的日子……人必……爱宴乐，不爱神」（提摩太后书 3:1-2，4）。在那欺骗者掌权之时，邪恶盛行并不足为奇。因为他是一切罪恶之恶毒的庇护所。除了他自身的特质，他又会努力将什么灌输给那时可怜的一代人呢？因为从不洁净者，怎能生出洁净之物？因此，那时的人们将像在挪亚的日子一样，沉溺于一切感官的享乐之中，不会预料到任何不快之事，甚至即便有人向他们谈论任何灾祸的发生，他们也不会相信，正如那些生活在挪亚的日子和罗得的日子里的人们一样。
  - type: paragraph
    initial:
      ru: 'Лк 17:31. '
      cn: （路加福音 17:31）
    text:
      ru: В тот день, кто будет на кровле, а вещи его в доме, тот не сходи взять их;
      cn: 当日、凡在屋上者、而器具在室、勿下取之、凡在田者、勿退归、亦如是、
  - type: paragraph
    text:
      ru: В тот день пришествия антихристова«кто будетна кровле», то есть на высоте добродетели, тот не сходи с оной, не спускайся за каким ни есть житейским предметом. Ибо все житейские предметы называются сосудами для человека, служащими иному к добродетели, а иному к злодеяниям. Итак, стоящий на высоте добродетели, не сходи ни за чем житейским и не спадай со своей высоты, но противься злобе и не ослабевай.
      cn: 在那敌基督降临之日，「谁在屋顶上」，即是在美德的高度上，那人不要从其上下来，不要为任何世俗的物品而降落。因为所有世俗的物品都被称为人的器皿，服事某些人趋向美德，服事某些人趋向恶行。因此，站立在美德高度上的人，不要为任何世俗的事物而下来，不要从自己的高度上跌落，而要抵抗邪恶，不可松懈。
  - type: paragraph
    text:
      ru: и кто будет на поле, также не обращайся назад.
      cn: 「在田里的人，也同样不要退回去。」
  - type: paragraph
    text:
      ru: Подобно и тот,«кто будет на поле», да не обращается назад. Ибо находящемуся в поле, то есть в мире сем возделывающему добродетель не должно обращаться назад, но должно простираться вперед, как и в другом месте сказано:«никто, возложивший руку свою на плуг и озирающийся назад, не благонадежен для Царствия Божия»(Лк. 9, 62).
      cn: 同理，那「在田里的人」，也不要回头。因为在田里，即在这世上耕耘美德的人，不应该回头，而应该向前迈进，正如在另一处经文中所说：「手扶着犁向后看的，不配进神的国」（路加福音 9:62）。
  - type: paragraph
    initial:
      ru: 'Лк 17:32. '
      cn: （路加福音 17:32）
    text:
      ru: Вспоминайте жену Лотову.
      cn: 宜记忆罗特之妻、
  - type: paragraph
    text:
      ru: Господь представляет в пример жену Лотову. Она, обратившись назад, стала соляным столпом (Быт. 19, 26), то есть, не удалившись от злобы, осталась при ее солености, сделавшись совершенно злой, и, погрязнув и оставшись во зле, составляет памятник поражения, которое она потерпела.
      cn: 主在例子中引介了罗特的妻子。她回头看，就成了一根盐柱（创世记 19:26），也就是说，她没有远离邪恶，反而残留于邪恶的咸涩之中，彻底变得邪恶了；并且，她沉湎于邪恶、留滞于邪恶之中，构成了一个她所遭受的败亡的纪念碑。
  - type: paragraph
    initial:
      ru: 'Лк 17:33. '
      cn: （路加福音 17:33）
    text:
      ru: Кто станет сберегать душу свою, тот погубит ее; а кто погубит ее, тот оживит ее.
      cn: 凡求拯救其生命者、反丧之、而丧之者、反生存之、
  - type: paragraph
    text:
      ru: 'Потом Господь присовокупляет относящееся также к вышесказанному:«Кто станет сберегать душу свою, тот погубит ее». Никто, – говорит, – в гонение антихриста не старайся сберегать свою душу, ибо таковой погубит ее. А кто предаст себя на смерть и вообще на бедствия, тот спасется, не преклоняясь пред мучителем из любви к жизни. Выше Господь сказал, что стоящий на высоте добродетели не должен сходить с оной за житейскими предметами, не должен увлекаться ни приобретением, ни имуществом и из-за них ослабевать в борьбе. Подобно и теперь, простираясь далее, говорит: и что Я говорю, не сходи за сосудами? Нет, не оставляй добродетели и из-за внешних благ, ни даже из-за самого сбережения души не решайся преклониться пред обольстителем и гонителем.'
      cn: 随后，主又补充了同样与上文相关的内容：「凡求拯救其生命者、反丧之」。主说，在敌基督的迫害中，没有人应当试图保全自己的生命（灵魂），因为这样的人必将丧失它。而那些将自己交付给死亡和普遍的苦难的人，则会得救，因为他们没有出于对生命的眷恋而屈服于施暴者。主先前说过，立于美德高峰的人，不应当为了尘世之物而从其上坠落；不应被物质的获取或财产所诱惑，也不应因它们而在争战中懈怠。同样，现在主更进一步地说：我说什么？不要为了器皿而下来？不。你不可为了外在的福益而离弃美德，甚至不可为了保全自己的灵魂本身，就决定屈服于那欺哄者和迫害者。
  - type: paragraph
    text:
      ru: 'Евангелист Матфей (Мф. 24) говорит, что все это Господь сказал о пленении Иерусалима, намекая на осаду от неприятелей и на то, что при нашествии римлян должно бежать от них без оглядки: находящимся на кровле не нужно сходить в дом, чтобы взять что-нибудь из житейского, но должно тотчас бежать, ибо тут не время спокойствия, чтобы собирать сосуды; равным образом, находящимся в поле не нужно возвращаться домой, а даже и тому, кто будет дома, нужно бежать. Ничего впрочем нет удивительного, если это сбылось при взятии Иерусалима и опять сбудется в пришествие антихриста, особенно же, если пред самым временем кончины (мира) имеет быть невыносимо тяжелая скорбь.'
      cn: 传福音者马太（马太福音 24）说，主所说的这一切是关于耶路撒冷被俘虏之事，暗示了来自敌人的围攻，以及当罗马人入侵时，人应当毫不回头地逃离他们：在屋顶上的人不必下到屋内，去取任何生活必需品，而应当立刻逃跑，因为那时并非平静之时，无暇收集器皿；同样，在田间的人不必返回家中，甚至在家的人也需要逃跑。然而，如果这事在耶路撒冷被攻占时应验了，并且在敌基督降临时会再次应验，特别是如果就在世界末期之前将会有难以承受的重压之苦，那也没有什么值得惊奇的了。
  - type: paragraph
    initial:
      ru: 'Лк 17:34. '
      cn: （路加福音 17:34）
    text:
      ru: 'Сказываю вам: в ту ночь будут двое на одной постели: один возьмется, а другой оставится;'
      cn: 我告尔等、其夜二人同在一榻、一见取、一见遗、
  - type: paragraph
    text:
      ru: И отсюда мы научаемся тому, что пришествие Господа воспоследует неожиданно и внезапно. Ибо сказание, что«двое... будут... на одной постели», показывает беззаботность людей. Равно и молотье обозначает неожиданность пришествия. Научаемся еще и тому, что пришествие последует ночью. Итак, Господь говорит, что и из богатых, покоящихся на постели, одни спасутся, а другие нет. Некогда Господь говорил, что богатые с трудом спасаются (Мф. 19, 23–24). Теперь Он показывает, что не все богатые погибают, не все бедные спасаются, но и из богатых один возьмется и будет восхищен«в сретение Господу»(1Сол. 4, 17), как легкий духом и небесный, а другой оставится внизу, как осужденный.
      cn: 我们从这里学到，主的降临将是出乎意料和突然的。因为「二人同在一榻」的记载，显示了人们的无忧无虑。磨面（ молотье）同样也表示了降临的意外性。我们也学到降临将在夜间发生。因此，主说，即使是躺卧在床上的富人，一些人将得救，而另一些人则不然。主曾在某时说过，富人得救是困难的（马太福音 19:23-24）。现在祂表明，并非所有富人都会灭亡，也并非所有穷人都会得救，而是：在富人之中，一人将被取走，并被提到「在空中与主相会」（帖撒罗尼迦前书 4:17），如同那心灵轻盈而属天的人；而另一人则将被留在下面，如同被定罪的人。
  - type: paragraph
    initial:
      ru: 'Лк 17:35. '
      cn: （路加福音 17:35）
    text:
      ru: 'две будут молоть вместе: одна возьмется, а другая оставится;'
      cn: 二妇同磨一见取、一见遗、
  - type: paragraph
    initial:
      ru: 'Лк 17:36. '
      cn: （路加福音 17:36）
    text:
      ru: 'двое будут на поле: один возьмется, а другой оставится.'
      cn: 二人在田、一见取、一见遗、
  - type: paragraph
    text:
      ru: 'Подобным образом и из бедных, которые означены мелющими, один спасется, а другой нет. Ибо не все бедные праведны: иные из них бывают воры и подрезывают кошельки. Молотьем указывается на многотрудность жизни бедных.'
      cn: 类似地，在以磨坊工人（мелющими）为标记的穷人中，一个会得救，而另一个则不会。因为并非所有穷人都是公义的：他们中有些是小偷，是剪开钱袋的人（подрезывают кошельки）。磨坊工作（Молотьем）象征着穷人生活中多劳苦（многотрудность）的一面。
  - type: paragraph
    initial:
      ru: 'Лк 17:37. '
      cn: （路加福音 17:37）
    text:
      ru: 'На это сказали Ему: где, Господи? Он же сказал им: где труп, там соберутся и орлы.'
      cn: 彼等对之曰、主欤、何在、彼语之曰、尸之所在、雕鹰聚集在焉、
  - type: paragraph
    text:
      ru: Когда ученики спросили Господа, куда взяты будут сии, Он отвечал:«где труп, там... и орлы»; то есть, где Сын Человеческий, там все святые, легкие и высоколетающие, тогда как грешники тяжелы и потому остаются нанизу. Как тогда, когда лежит мертвое тело, все плотоядные птицы слетаются к нему, так и тогда, когда явится с небес Сын Человеческий, умерший за нас и вмененный в труп, соберутся все святые и самые Ангелы. Ибо с ними придет Он в славе Отца и в несказанном блистании. Хотя Он наименовал это время ночью, но Он назвал его так потому, что оно неожиданно и что грешников тогда обнимет тьма. Но праведникам свет воссияет, да и сами они просветятся, как солнце (Мф. 13, 43).
      cn: 当门徒问及主，那些人会被带往何处时，祂回答说：「哪里有尸体，那里……就有雕鹰」；这就是说，哪里有人子，那里就有所有圣徒，他们轻盈且高飞，而罪人却是沉重的，因此停留在下方。正如那时，当一具尸体躺卧时，所有食肉的鸟类都会聚集而来，同样，当人子从天而降时——祂为我们而死并被视作尸体——所有的圣徒乃至天使都会聚集。因为祂将带着父的荣耀和难以言喻的光辉与他们同来。虽然祂将这段时间称作黑夜，但祂之所以如此称呼，是因为它出乎意料，并且那时黑暗将笼罩罪人。然而，光明将为义人照耀，他们自己也将如同太阳般发光（马太福音 13:43）。
- type: heading1
  text:
    ru: Глава восемнадцатая
    cn: 第十八章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 18:1. '
      cn: （路加福音 18:1）
    text:
      ru: Сказал также им притчу о том, что должно всегда молиться и не унывать,
      cn: 彼设如何当恒祈祷而不倦之譬喻、语之曰、
  - type: paragraph
    text:
      ru: Поскольку Господь упомянул о скорбях и опасностях, то предлагает и врачевство от них. Врачевство это есть молитва, и не просто молитва, но молитва постоянная и усиленная.
      cn: 鉴于主提及了苦难和危险，故而祂也提出了对治它们的良药。这良药便是祷告，并且它不单是祷告，而是持续且加力的祷告。
  - type: paragraph
    initial:
      ru: 'Лк 18:2. '
      cn: （路加福音 18:2）
    text:
      ru: 'говоря: в одном городе был судья, который Бога не боялся и людей не стыдился.'
      cn: 〇某城有一判官、不畏上帝、不耻于人、
  - type: paragraph
    initial:
      ru: 'Лк 18:3. '
      cn: （路加福音 18:3）
    text:
      ru: 'В том же городе была одна вдова, и она, приходя к нему, говорила: защити меня от соперника моего.'
      cn: 其城有一孀妇、屡就之曰、判官、判我与我争讼者、
  - type: paragraph
    initial:
      ru: 'Лк 18:4. '
      cn: （路加福音 18:4）
    text:
      ru: 'Но он долгое время не хотел. А после сказал сам в себе: хотя я и Бога не боюсь и людей не стыжусь,'
      cn: 彼久不肯、后自思曰、我虽不畏上帝、不耻于人、
  - type: paragraph
    initial:
      ru: 'Лк 18:5. '
      cn: （路加福音 18:5）
    text:
      ru: но, как эта вдова не дает мне покоя, защищу ее, чтобы она не приходила больше докучать мне.
      cn: 因此孀妇屡烦扰我、可判断之、免其恒至聒我、
  - type: paragraph
    text:
      ru: 'Все это, – говорит, – имеет случиться с людьми того времени, но против этого великую помощь подает молитва, которую мы должны постоянно и с терпением творить, представляя себе то, как докучливость вдовы преклонила неправедного судью. Ибо если его, полного всякой злобы и не стыдившегося ни Бога, ни людей, постоянная просьба смягчила, то тем более не преклоним ли мы на милость Отца щедрот Бога, хотя Он в настоящее время и медлит? Смотри, не стыдиться людей – признак большой злобы. Ибо многие Бога не боятся, а разве только людей стыдятся, и потому менее грешат. Но кто перестал и людей стыдиться, в том уже верх злобы. Поэтому и Господь после поставил:«и людей не стыдился», говоря как бы так: судья и Бога не боялся, и что говорю, Бога не боялся? – он обнаруживал еще большую злобу, потому что и людей не стыдился.'
      cn: 「这一切，」狄奥菲拉克说，「都必在那时的人身上发生，但抵御这一切，祷告将带来极大的助益。我们必须恒常且忍耐地进行祷告，想象寡妇那烦扰人的行径是如何使那不义的审判官屈服的。因为如果连他——那个充满一切恶意、既不羞于上帝，也不羞于世人的人——都被持续的请求所软化，那么我们岂不更能使那施怜悯的父上帝俯就施恩吗？纵然祂现今迟延不发。你看，不羞于世人，这是大恶的标志。因为许多人不畏惧上帝，但或许他们会羞于世人，因此犯罪较少。但是，连羞于世人也停止的人，其恶已达顶点。因此，主随后才加上了：『也不羞于世人』，祂仿佛是在说：这个审判官连上帝都不畏惧，我何必说不畏惧上帝呢？他显露出更大的恶，因为他连世人都不羞耻。」
  - type: paragraph
    initial:
      ru: 'Лк 18:6. '
      cn: （路加福音 18:6）
    text:
      ru: 'И сказал Господь: слышите, что говорит судья неправедный?'
      cn: 主又曰、尔等听此不义之判官所言、
  - type: paragraph
    initial:
      ru: 'Лк 18:7. '
      cn: （路加福音 18:7）
    text:
      ru: Бог ли не защитит избранных Своих, вопиющих к Нему день и ночь, хотя и медлит защищать их?
      cn: 上帝虽容忍、岂不为其所选者而昼夜吁之者伸冤乎、速伸其冤必矣、
  - type: paragraph
    initial:
      ru: 'Лк 18:8. '
      cn: （路加福音 18:8）
    text:
      ru: сказываю вам, что подаст им защиту вскоре.
      cn: 我告尔、然人子来至、岂见信于地乎、
  - type: paragraph
    text:
      ru: 'Притча сия научает нас, как мы много раз говорили, тому, чтобы мы не унывали в молитвах, подобно как и в другом месте сказано: кто из вас, имея друга, отошлет его, если он придет и постучится ночью? Ибо если не по чему другому, то по неотступности его отворит ему (Лк. 11, 5, 8). И еще:«Есть ли между вами такой человек, который, когда сын его попросит у него хлеба»и прочее? (Мф. 7,9). Всем этим Господь внушает нам постоянное упражнение в молитвах.'
      cn: 此寓言教导我们，正如我们多次说过，在祷告中不要气馁，正如在另一处也说过：你们中间谁拥有一个朋友，如果他夜间前来叩门，会把他打发走呢？因为即使不是出于别的缘故，也会因着他的坚韧不懈而给他开门（路加福音 11:5，8）。又如：「你们中间有这样的人吗？当他的儿子向他求饼时」（马太福音 7:9）以及其他经文。借由所有这一切，主向我们启示了在祷告中要持续操练。
  - type: paragraph
    text:
      ru: Некоторые пытались как можно обстоятельнее изложить эту притчу и осмеливались прилагать ее к действительности. Вдова, – говорили они, – есть душа, отвергшая прежнего своего мужа, то есть диавола, который поэтому стал соперником, постоянно нападающим на нее. Она приходит к Богу, Судии неправды, который, то есть, осуждает неправду. Сей Судия Бога не боится, ибо Он един только Бог, и не имеет другого, которого мог бы бояться, и людей не стыдится, потому что«Бог не взирает на лице человека»(Гал. 2, 6). Над этой вдовой, над душой, постоянно просящей у Бога защиты от соперника ее – диавола, Бог умилостивляется, так как докучливость ее побеждает Его.
      cn: 有些人曾试图尽可能详尽地阐述这个比喻，并大胆地将其应用于现实。他们说，寡妇是灵魂，她拒绝了她以前的丈夫，即魔鬼，魔鬼因此成了对手，不断地攻击她。她来到上帝这里，这位不义的审判官，也就是说，他谴责不义。这位审判官不惧怕上帝，因为他是独一的上帝，没有其他的神可以让他惧怕；他也不羞耻于人，因为「上帝不看人的外貌」（加拉太书 2:6）。这位寡妇，这个不断向上帝祈求保护以对抗她的对手——魔鬼的灵魂，上帝对她发了慈悲，因为她的烦扰（恳求的纠缠）胜过了他。
  - type: paragraph
    text:
      ru: 'Такое разумение, кому угодно, пусть принимает. Оно передается для того только, чтоб не осталось безызвестным. Только Господь научает нас этим необходимости молиться и показывает, что если сей судия, беззаконный и полный всякой злобы, сжалился по причине беспрестанной просьбы, тем более Бог, начальник всякой правды, вскоре подаст защиту, хотя Он долготерпит и, по-видимому, не слушает просящих Его день и ночь. Научив нас этому и показав нам, что во время кончины мира нужно пользоваться молитвой против имеющих тогда случиться опасностей, Господь присовокупляет:'
      cn: 无论何人，若对此理解感到满意，皆可接纳。传递此理解仅是为了不使其湮没无闻。唯有主借此教导我们祷告的必要性，并表明：既然那法官，虽是邪恶且充满一切恶毒，却因那不间断的请求而生出怜悯，那么何况是上帝，一切公义的创始者，他必速速赐予护佑。尽管他恒久忍耐，且表面上似乎不听那些昼夜呼求他的人。在教导了我们这些，并向我们展示了在世界末期，需要利用祷告来对抗届时将发生的危险之后，主又加上了：
  - type: paragraph
    text:
      ru: Но Сын Человеческий, придя, найдет ли веру на земле?
      cn: 但人子来至时，岂能在地上找到信（德）吗？
  - type: paragraph
    text:
      ru: 'вопросительной речью показывая, что мало найдется тогда верующих. Ибо сын беззакония будет иметь тогда такую силу, что прельстил бы и избранных, если б можно было (Мф. 24, 24). О том, что встречается редко, Господь обыкновенно употребляет вопросительный образ речи. Например:«кто верный и благоразумный домоправитель»(Лк. 12, 42). И здесь, обозначая то же самое, именно: что сохраняющих веру в Бога и доверие друг к другу тогда будет очень малое число, Господь употребил помянутый вопрос.'
      cn: 祂以反问的言语，表明那时能找到的信徒很少。因为那时「不法之子」将拥有如此巨大的权势，以至于若是可能，他甚至会引诱选民（马太福音 24:24）。对于罕见之事，主通常使用反问的言语形式。例如：「谁是那忠心又聪明的管家？」（路加福音 12:42）。在此处，祂所指的也是同一件事，即：那时能保持对上帝的信仰和彼此信任的人数，将会非常稀少，因此主使用了所提及的反问句。
  - type: paragraph
    text:
      ru: Убеждая к молитве, Господь справедливо присовокупил слово о вере, поскольку вера составляет начало и основание всякой молитвы. Ибо напрасно будет человек молиться, если он не верует, что получит просимое на пользу (Иак. 1, 6–7). Поэтому Господь, научая молиться, упомянул и о вере, прикровенно давая знать, что немногим тогда можно будет молиться, поскольку и вера тогда найдется не во многих. Итак, Господь, придя на облаках, не найдет веры на земле, исключая разве немногих. Но Он произведет тогда веру. Ибо, хотя невольно, все исповедуют, что«Господь Иисус... в славу Бога Отца»(Флп. 2, 11), и если нужно назвать это верой, а не необходимостью, из неверных не останется никого, кто бы не поверил, что Спаситель один только тот, кого он прежде злохулил.
      cn: 主在劝勉人去祷告时，公正地附加了关于信的言语，因为信构成了所有祷告的肇始与根基。因为人若不相信他将得蒙所求，且所求于他有益（亚适乌书 1:6–7），那么他祷告便是徒劳。因此，主在教导人祷告时，亦提及了信，隐晦地让人知晓，那时能祷告的人将为数不多，因为信那时也难在多人身上被寻得。所以，主驾着云彩来临时，在地上将寻不到信，除非是极少数人。但那时祂会生出信来。因为，所有人都将不情愿地承认，「主耶稣基督，荣耀归与父神」（腓立比书 2:11）。倘若有必要将此称作信，而非称作必然性的话，那么那些不信之人中，将无一人不信：这位救主就是他此前所亵渎的那一位，且祂是唯一的救主。
  - type: paragraph
    initial:
      ru: 'Лк 18:9. '
      cn: （路加福音 18:9）
    text:
      ru: 'Сказал также к некоторым, которые уверены были о себе, что они праведны, и уничижали других, следующую притчу:'
      cn: 又为自恃为义而藐视他人者、设喻谓之曰、
  - type: paragraph
    initial:
      ru: 'Лк 18:10. '
      cn: （路加福音 18:10）
    text:
      ru: 'два человека вошли в храм помолиться: один фарисей, а другой мытарь.'
      cn: 〇二人豋殿以为祈祷、一系发利些乙、一系税吏、
  - type: paragraph
    text:
      ru: 'Господь не перестает истреблять страсть высокомерия сильнейшими доводами. Поскольку она более всех страстей смущает умы людей, постольку Господь и учит о ней часто и много. Так и теперь Он врачует худший вид ее. Ибо много отраслей самолюбия. От него рождаются: самомнение, хвастовство, тщеславие и пагубнейшее всех высокомерие. Высокомерие есть отвержение Бога. Ибо когда кто совершенства приписывает не Богу, а себе, тот что иное делает, как не отрицает Бога и восстает против Него? Сию-то богопротивную страсть, против которой Господь вооружается, как неприятель против неприятеля, Господь обещает уврачевать настоящей притчей. Ибо Он говорит ее к тем, кои уверены были о себе и не приписывали всего Богу, а поэтому и других уничижали, и показывает, что праведность, хотя бы она заслуживала удивления в прочих отношениях и приближала человека к Самому Богу, но если допустит до себя высокомерие, низвергает человека на самую низшую степень и уподобляет его бесу, иногда принимающему на себя вид равного Богу.'
      cn: 主不歇地以最强有力的论据，来殄灭傲慢之情。由于此情比诸般情欲更扰乱人心，故主为此情频施教导，且教导甚多。如此刻，祂正医治此情最恶劣的种类。因为自爱（самолюбия）有诸多分枝。由此而生者有：自负（самомнение）、夸耀（хвастовство）、虚荣（тщеславие）以及最为致祸的傲慢（высокомерие）。傲慢即是对神的弃绝。因为当人将自身的完全不归功于神，而归功于自己时，除了否定神并起来反叛祂之外，他还能做什么呢？主应许以当前的此比喻，医治此种敌对神的悖逆之情——主对付它，犹如仇敌对付仇敌一般。因为祂是向那些对自己满有把握、不将一切归于神、并因此而轻蔑他人的人讲说此比喻的。祂表明，正直（праведность）——即便在其他方面值得钦羡，并使人亲近神本身——若容许傲慢侵入自身，就会将人贬到最低下的境地，并使其与那有时自视与神齐等的魔鬼相似。
  - type: paragraph
    initial:
      ru: 'Лк 18:11. '
      cn: （路加福音 18:11）
    text:
      ru: 'Фарисей, став, молился сам в себе так: Боже! благодарю Тебя, что я не таков, как прочие люди, грабители, обидчики, прелюбодеи, или как этот мытарь:'
      cn: 发利些乙立、而默祷、如此曰、上帝欤、我感谢尔、我不似他人贪酷、不义、奸淫、亦不似此税吏、
  - type: paragraph
    initial:
      ru: 'Лк 18:12. '
      cn: （路加福音 18:12）
    text:
      ru: пощусь два раза в неделю, даю десятую часть из всего, что́ приобретаю.
      cn: 于星期守斋二次、以凡所得者、十输其一、
  - type: paragraph
    text:
      ru: 'Начальные слова фарисея похожи на слова человека признательного; ибо он говорит: благодарю Тебя, Боже! Но последующая его речь исполнена решительного безумия. Ибо он не сказал: благодарю Тебя, что Ты удалил меня от неправды, от грабительства, но как? – что я не таков «есть». Совершенство приписал себе и собственной своей силе. А осуждать других, как это свойственно человеку, знающему, что все, что ни есть, он имеет от Бога? Ибо если бы он был уверен, что он по благодати имеет чужие блага, то без сомнения не стал бы уничижать других, представляя себе в уме, что и он, по отношению к собственной его силе, равно наг, а по милости облечен даром. Поэтому фарисей, как приписывающий совершенные дела собственной силе, высокомерен, а отсюда дошел и до осуждения других. Господь обозначает высокомерие и отсутствие смиренномудрия в фарисее и словом:«став». Ибо у смиренномудрого и вид смиренномудрый, а фарисей и во внешнем поведении обнаруживал тщеславие. Правда, и о мытаре сказано:«стоя», но смотри, что далее прибавлено:«не смел даже поднять глаз на небо». Поэтому стояние его было вместе и преклонением, а у фарисея и глаза, и сердце поднимались к небу.'
      cn: '法利赛人起初的话语，像是一个心怀感激之人的话语；因为他说：神啊，我感谢你！但其后续的言语却充满了彻底的疯狂。因为他没有说：我感谢你，使你使我远离了不义、远离了强夺，但他是怎么说的呢？——是我「不是」那样的人。他将完全归功于自己和自己的力量。至于论断他人，这难道是一个深知自己所有的一切都来自神的人所应有的行为吗？因为如果他确信自己是靠恩典才拥有不属于自己的美德，那么毫无疑问，他将不会贬低他人，他会在心中设想，就他自身的力量而言，他也同样是赤裸的，只是蒙了怜悯才披上了恩赐。因此，法利赛人将完全的德行归功于自己的力量，故此他心高气傲，并由此走上了论断他人的道路。


        主用「站着」这个词，指明了法利赛人身上的傲慢和缺乏谦卑心。因为谦卑之人，其外表亦是谦卑的，但法利赛人甚至在其外在行为中也显露出虚荣心。诚然，对于税吏，经文也说他「站着」，但请看随后补充了什么：「连举目望天也不敢」。因此，他的「站立」同时也是一种屈膝，而法利赛人的眼睛和心都高举向天。'
  - type: paragraph
    text:
      ru: 'Посмотри и на порядок, какой представляется в молитве фарисея. Сначала он сказал, каков он не есть, а потом перечислил и то, каков он есть. Сказав,«я не таков-то,как прочие люди», он выставляет и разные добродетели:«пощусь два раза в неделю, даю десятую частьотвсего, что приобретаю». Ибо должно не только уклоняться от зла, но и творить добро (Пс. 33, 15). И прежде должно удалиться от зла, а потом приступить к добродетели, подобно тому, как желая из мутного источника почерпнуть чистой воды, ты должен прежде вычистить грязь, а потом уже можешь черпать чистую воду. Приметь и то, что фарисей не сказал в единственном числе: я не грабитель, не прелюбодей, как прочие. Он не позволил даже просто на словах приложить поносное имя единственно к своему лицу, но употребил сии названия во множественном числе, о прочих. Сказав, я не таков как прочие, он противопоставил сему:«пощусь два раза в неделю», то есть два дня в неделю. Речь фарисея могла иметь глубокий смысл. Вопреки страсти прелюбодеяния он хвалится постом. Ибо похоть рождается от чувственного пресыщения. Так он, удручая тело постом, был очень далек от подобных страстей. А фарисеи подлинно постились во второй день недели и в пятый. Названию грабителей и обидчиков фарисей противопоставил то, что он дает десятую часть от всего, что приобретает. Грабительство, – говорит он, – и нанесение обид столько мне противны, что я отдаю даже мое собственное. По мнению некоторых, Закон заповедует вообще и навсегда десятину, а те, кои глубже исследуют его, находят, что он предписывает троякого рода десятину. Об этом подробно узнаешь из Второзакония (Втор. 12,Втор. 14), если приложишь внимание. Так вел себя фарисей.'
      cn: '你当留意法利赛人祷告中所呈现的次序。他首先说明了他不是怎样的人，然后又列举了他是怎样的人。他说了「我不是像其余的人那样」，接着他陈列了各种美德：「我一周禁食两次，将所得的一切拿出十分之一。」 因为，人不仅应当规避邪恶，而且也应当行善（诗篇 33:15）。并且，人理当首先远离邪恶，然后才能接近美德，正如你若想从污浊的泉源中汲取清水，你必须先清除污泥，然后才能汲取清水一样。


        你也要注意，法利赛人没有用单数形式说：我不是一个抢夺者，不是一个奸淫者，如同其余的人。他甚至没有在言语上允许将这可耻的名字单单应用在他自己身上，而是将其用在了复数形式上，用在其余的人身上。说了「我不是像其余的人那样」之后，他对此对立地提到了：「我一周禁食两次」，即一周禁食两天。法利赛人的话语可能具有深远的意义。他夸耀禁食，以对抗奸淫的淫欲之情。因为，情欲源于感官上的饱足。因此，他借由禁食来折磨身体，就远离了此类情欲。法利赛人确实在一周中的第二天和第五天禁食。


        对于「抢夺者和不义者」之称，法利赛人对立地提到了他将所得的一切拿出十分之一。他说道：抢夺和施加不义对我来说是如此厌恶，以至于我甚至献出我自己的所有。根据一些人的看法，律法一般性地并永久地吩咐缴纳什一税，而那些更深入研究它的人则发现，它规定了三种类型的什一税。如果你留心，你将能从《申命记》中详细了解此事（申命记 12, 申命记 14）。法利赛人就是这样行事的。'
  - type: paragraph
    initial:
      ru: 'Лк 18:13. '
      cn: （路加福音 18:13）
    text:
      ru: 'Мытарь же, стоя вдали, не смел даже поднять глаз на небо; но, ударяя себя в грудь, говорил: Боже! будь милостив ко мне грешнику!'
      cn: 税吏远立、不敢举其目仰天、乃拊其胸曰、上帝欤、矜怜我罪人、
  - type: paragraph
    text:
      ru: А мытарь вел себя совершенно наоборот. Он стал вдали и очень был далек от фарисея не только по расстоянию места, но и по одежде, по словам и по сокрушению сердца. Он стыдился поднять глаза свои к небу, считая их недостойными созерцания горних предметов, так как они любили смотреть на блага земные и пользоваться оными. Он«ударялсебя в грудь», как бы поражая сердце за лукавые советы и пробуждая оное от сна к сознанию, и ничего другого не говорил, кроме сего:«Боже! будь милостив ко мне грешнику». За все это мытарь«пошел... более... оправданным», чем фарисей. Ибо нечист пред Господом всякий высокосердый, и«Господь гордым противится, а смиренным... дает благодать»(Притч. 3,34).
      cn: 而税吏的行为则全然相反。他站得远远的，不仅在空间距离上，而且在服饰、言语和心灵的破碎上，都与法利赛人相去甚远。他羞于举目望天，认为自己的眼睛不配凝视天上的事物，因为它们曾喜爱观看并享用地上的财物。他「捶打自己的胸膛」，仿佛是在惩罚那给出邪恶建议的心脏，并唤醒它从沉睡中觉醒，回归意识。他除了这句话之外，别无他言：「神啊！开恩可怜我这个罪人。」由于这一切，税吏「回家去比那人倒算为是称义了」。因为凡心高气傲的，在主面前都是不洁净的，并且「上主抵挡骄傲的人，赐恩给谦卑的人」（箴言 3:34）。
  - type: paragraph
    initial:
      ru: 'Лк 18:14. '
      cn: （路加福音 18:14）
    text:
      ru: 'Сказываю вам, что сей пошел оправданным в дом свой более, нежели тот: ибо всякий, возвышающий сам себя, унижен будет, а унижающий себя возвысится.'
      cn: 我告尔等、得称为义而归其家者、此也、非彼也、盖自高者将为卑、自卑者将为高也、
  - type: paragraph
    text:
      ru: Иной, быть может, удивится, почему фарисей, хотя немного слов сказал с высокомудрием, однако ж осужден, а Иов и очень много высказал о себе великого (Иов. 29, 7–25), однако ж получил венец? Это потому, что фарисей стал пустословить на похвалу себе, тогда как никто не заставлял его, и осуждал других, когда не побуждала к этому никакая польза. А Иов вынужден был исчислять свои совершенства тем, что его стесняли друзья, налегали на него тяжелее самого несчастья, говорили, что он страдает за грехи, и исчислял свои добрые дела для славы Божией и для того, чтобы люди не ослабевали по пути добродетели. Ибо если б люди дошли до убеждения, что дела, которые творил Иов, были дела грешные и он страдает за них, то они стали бы удаляться от совершения этих самых дел и таким образом вместо страннолюбивых сделались бы негостеприимными, вместо милостивых и правдивых – немилосердыми и обидчиками. Ибо таковы были дела Иова. Итак, Иов исчисляет свои добрые дела для того, чтобы многие не потерпели вреда. Таковы были причины для Иова. Не говорим уже о том, что в самых словах его, по-видимому, велеречивых, просвечивает совершенное смиренномудрие. Ибо«если бы я был, – говорит, –как в прежние месяцы, как в те дни, когда Бог хранил меня»(Иов. 29, 2). Видишь ли, он все возлагает на Бога и не осуждает других, но скорее сам терпит осуждение от друзей. А на фарисея, который все к себе, а не к Богу, и без нужды осуждает других, справедливо наводится осуждение. Ибо всяк«возвышающий сам себя»унизится, будучи осужден Богом,«а унижающий себячрез осуждениевозвысится», будучи оправдан Богом. Так и сказано:«припомни Мне; станем судиться; говори ты, чтоб оправдаться»(Ис. 43, 26).
      cn: 也许有人会惊奇，为何法利赛人仅以高傲说了几句话，却被定罪；而约伯说了许多关于自己的伟大之事（约伯记 29:7-25），却获得了冠冕？这是因为法利赛人开始自我吹嘘，空发言语，当时没有人强迫他这样做，并且毫无益处地去论断他人。而约伯则是在朋友的逼迫下，不得不列举自己的美德，他的朋友们比不幸本身更严厉地压迫他，说他因罪孽而受苦。约伯列举他的善行是为了归荣耀于上帝，也为了让人不致在美德的道路上软弱。因为如果人们确信约伯所行的事是罪恶之事，且他因之受苦，那么他们就会开始远离行这些事。如此一来，他们就会从好客之人（страннолюбивых）变为不好客之人（негостеприимными），从慈悲公义之人变为不怜悯和欺凌之人。因为约伯所行的正是这些事。因此，约伯列举自己的善行是为了使许多人不受损害。这些就是约伯的原因。我们更不用说，在他那些看似夸大的言语中，闪耀着完全的谦卑。因为他说：「巴不得我如前几月，如上帝保守我的日子」（约伯记 29:2）。你看到了吗？他将一切归于上帝，且不论断他人，反而是自己忍受着朋友的论断。而法利赛人，将一切归于自己而非归于上帝，且无谓地论断他人，被定罪是公正的。因为凡「高举自己」的，必将因被上帝定罪而降为卑；「那因论断而贬抑自己」的，必将因被上帝称义而升高。正如经上所说：「你要使我想起；我们可以辩论；你要说话，好让自己得称为义」（以赛亚书 43:26）。
  - type: paragraph
    initial:
      ru: 'Лк 18:15. '
      cn: （路加福音 18:15）
    text:
      ru: Приносили к Нему и младенцев, чтобы Он прикоснулся к ним; ученики же, видя то, возбраняли им.
      cn: 〇有人携孩提就之、为彼按之、门徒见而责之、
  - type: paragraph
    text:
      ru: Пример детей также ведет к смиренномудрию. Господь сим научает быть смиренными, принимать всех и никого не презирать. Ученики считали недостойным Такого Учителя – приносить к Нему детей. А Он показывает им, что нужно быть так смиренными, чтобы не гнушаться и самыми малыми.
      cn: 孩童的例子也引向谦卑心智。主借此教导我们要谦卑，接纳所有人，不轻视任何一个。门徒认为，将孩童带到这样一位教师面前，是不配的。而他则向他们展示，人必须如此谦卑，以至于不应厌弃那最幼小的。
  - type: paragraph
    initial:
      ru: 'Лк 18:16. '
      cn: （路加福音 18:16）
    text:
      ru: 'Но Иисус, подозвав их, сказал: пустите детей приходить ко Мне и не возбраняйте им, ибо таковых есть Царствие Божие.'
      cn: 伊伊稣斯呼之曰、容孩提来就我、且勿禁之、盖上帝国乃属如是者、
  - type: paragraph
    text:
      ru: Таким образом, не отвергнув младенцев, но с удовольствием приняв их, Господь «делом» учит смиренномудрию. Учит Он и «словом», говоря, что«таковых есть ЦарствиеНебесное», кои имеют расположение детское.
      cn: 因此，主非但没有拒绝孩童，反而乐意接纳他们，祂便「以行」教导谦卑心。祂也「以言」教导，称「天国乃是属如此者」，即拥有赤子之心的人。
  - type: paragraph
    initial:
      ru: 'Лк 18:17. '
      cn: （路加福音 18:17）
    text:
      ru: 'Истинно говорю вам: кто не примет Царствия Божия, как дитя, тот не войдет в него.'
      cn: 我诚告尔等、凡欲承受上帝国、不似孩提者、不得入也、
  - type: paragraph
    text:
      ru: 'Дитя не превозносится, никого не унижает, незлобиво, бесхитростно, ни в счастье не надмевается, ни в скорби не уничижается, но всегда совершенно просто. Поэтому, кто живет смиренно и незлобиво, и кто принимает Царствие Божие как дитя, то есть без коварства и любопытства, но с верой, тот приятен пред Богом. Ибо кто излишне любопытствует и всегда спрашивает: как это? – тот погибнет со своим неверием и не войдет в Царствие, которого не хотел принять в простоте, без любопытства и со смирением. Поэтому все апостолы и все в простоте сердца уверовавшие во Христа могут быть названы детьми, как и Сам Господь назвал апостолов:«дети! есть ли у вас какая пища?»(Ин. 21, 5). А мудрецы языческие, доискивающиеся премудрости в таком таинстве, каково Царствие Божие, и не хотящие принять оное без рассуждения, по справедливости отторгнуты от этого Царствия. Господь не сказал: «этих» есть Царствие, но«таковых», то есть кои добровольно приобрели себе незлобие и смиренномудрие, которое дети имеют по природе. Итак, все церковное, что составляет Царствие Божие, будем принимать без любопытства, с верой и смирением. Ибо любопытство свойственно самомнению и самомудрованию.'
      cn: 孩童不会自傲，不贬低任何人，他们不怀恶意，单纯质朴，既不会在幸福时傲慢自大，也不会在忧伤时自我贬抑，而总是全然的单纯。因此，那些生活谦卑、不怀恶意，并像孩童一样接受上帝之国的人，即毫无奸诈和好奇之心，而是带着信心接受的人，是蒙上帝喜悦的。因为那过度好奇、总是追问：「这是如何发生的？」的人，将因其不信而灭亡，不得进入那他不愿意以单纯、不带好奇、带着谦卑而接受的国度。因此，所有的使徒和所有以单纯的心相信基督的人，都可以被称为孩童，正如主自己称呼使徒们：「孩子们！你们有什么吃的没有？」（伊鄂昂福音 21:5）。而那些异教的智者，在一个如上帝之国这样的奥秘中寻求智慧，不愿未经思辨就接受它的人，理应被摒弃于这国度之外。主没有说：「这些」人的国度，而是说「这样的人」，即那些自愿为自己获得孩童本性所具备的不怀恶意和谦卑心的人。因此，所有构成上帝之国的教会事务，我们都应以信心和谦卑之心接受，不带好奇。因为好奇心是自大和自作聪明的特质。
  - type: paragraph
    initial:
      ru: 'Лк 18:18. '
      cn: （路加福音 18:18）
    text:
      ru: 'И спросил Его некто из начальствующих: Учитель благий! что мне делать, чтобы наследовать жизнь вечную?'
      cn: 〇某宰问之曰、善哉、师也、我当何为以嗣永远之生命、
  - type: paragraph
    text:
      ru: Человек сей, по мнению некоторых, был какой-нибудь злой хитрец и искал, как бы уловить Иисуса в словах. Но вероятнее то, что он был сребролюбец, поскольку и Христос обличил его именно таковым. Да и евангелист Марк говорит, что некто, подбежав и пав на колена, спросил Иисуса, и,«взглянув на него,... Иисус... полюбил его»(Мк. 10, 17, 21). Итак, человек сей был любостяжателен. К Иисусу приходит он с желанием узнать о вечной жизни. Быть может, и в сем случае он руководился страстью к приобретению. Ибо никто так не желает долгой жизни, как человек любостяжательный. Итак, он думал, что Иисус укажет ему способ, по которому он будет вечно жить, владеть имуществом и таким образом наслаждаться. Но когда Господь сказал, что средство к достижению жизни вечной есть нестяжательность, то он, как бы упрекая себя за вопрос и Иисуса за ответ, отошел. Ибо он нуждался в вечной жизни, потому что имел богатства на много лет. А когда он должен отказаться от имения и жить, по-видимому, в бедности, то что ему за нужда в вечной жизни?
      cn: 按某些人的看法，这个人是个恶毒的阴谋家，他想方设法要在言语上抓住耶稣的把柄。但更可能的是，他是个贪爱钱财的人，因为基督正是如此揭露他的。再者，福音书作者马可也说，有一个人跑来，跪下问耶稣，耶稣「看着他，...就爱他」（马可福音 10:17，21）。因此，这个人是贪婪的。他来到耶稣面前，渴望了解永生之事。也许在这种情况下，他也是受获取（财物）的激情所驱使。因为没有谁比贪婪的人更渴望长久生命了。所以，他认为耶稣会给他指明一种方法，让他可以永远活着，拥有财产，并由此享受（快乐）。但当主说达到永生生命的途径是「不拥有财物」（нестяжательность）时，他仿佛是在为自己的提问而自责，也为耶稣的回答而自责，便离开了。因为他需要永生，是因为他拥有足够多年享用的财富。而当他不得不放弃财产，显然要在贫困中生活时，那么他还要永生有什么用呢？
  - type: paragraph
    initial:
      ru: 'Лк 18:19. '
      cn: （路加福音 18:19）
    text:
      ru: 'Иисус сказал ему: что ты называешь Меня благим? никто не благ, как только один Бог;'
      cn: 伊伊稣斯对曰、何称我以善、除上帝而外、无一为善者、
  - type: paragraph
    text:
      ru: 'Приходит он к Господу, как просто к человеку и учителю. Поэтому Господь, чтобы показать, что к Нему не должно приходить как просто к человеку, сказал:«никто не благ, как только один Бог». Ты, – говорит, – назвал Меня«благим», к чему же еще прибавил:«учитель»? Кажется, ты принимаешь Меня за одного из многих. Если же так, то Я не благ: ибо из людей собственно никто не благ; благ только один Бог. Поэтому, если хочешь называть Меня благим, называй Меня благим как Бога, а не приходи ко Мне, как просто к человеку. Если же ты считаешь Меня одним из обыкновенных людей, то не называй Меня благим. Ибо один только Бог поистине благ, есть источник благости и начало самоблагостыни. А мы люди, если и бываем добры, то не сами по себе, но по участию в Его благости, имеем доброту смешанную и способную преклоняться на зло.'
      cn: 他来到主跟前，如同仅仅来到一个人和一位教师跟前。因此，主为了显示人们不应当仅仅来到祂跟前如同来到一个人跟前，就说道：「除了上帝以外，没有一个良善的。」祂说，你称呼我为「良善的」，为何还要加上：「教师」呢？看来，你把我当成了众多人中的一个。若果真如此，那么我便不善：因为在人之中，严格来说没有人是良善的；唯独一位上帝是良善的。因此，如果你想称呼我为良善的，就要以我是上帝的身份来称呼我为良善的，而不是仅仅如同来到一个人跟前那样来就我。如果你认为我只是一个普通人中的一个，那就不要称我为良善的。因为唯独上帝是真正良善的，是良善的源头和自身良善（self-goodness）的本原。而我们人，即使我们是善良的，也不是凭着我们自己，而是凭着对祂良善的分享，我们所拥有的良善是混杂的，且倾向于屈服于邪恶。
  - type: paragraph
    initial:
      ru: 'Лк 18:20. '
      cn: （路加福音 18:20）
    text:
      ru: 'знаешь заповеди: не прелюбодействуй, не убивай, не кради, не лжесвидетельствуй, почитай отца твоего и матерь твою.'
      cn: 尔知诫命云、勿行邪淫、勿杀人、勿偷盗、勿妄证、孝敬尔父母、
  - type: paragraph
    text:
      ru: 'Закон запрещает прежде то, во что мы удобнее впадаем, потом уже и то, во что впадают немногие и нечасто: например, прелюбодейство, поскольку оно есть огонь с внешней и внутренней стороны, убийство, поскольку гнев есть великий зверь; а воровство менее важно, и во лжесвидетельство можно нечасто впадать. Поэтому первые преступления запрещаются прежде, так как мы легко впадаем в оные, хотя в других отношениях они и более тяжки. А сии, то есть воровство и лжесвидетельство, Закон поставляет на втором месте, так как оные совершаются не часто и менее важны. Вслед за сими преступлениями Закон поставил грех против родителей. Ибо хотя грех этот и тяжек, но не часто случается, так как не часто и не много, но редко и мало оказывается таких зверообразных людей, чтоб решились оскорблять родителей.'
      cn: '律法首先禁止那些我们更容易陷入的罪，然后才禁止那些少数人且不常陷入的罪：例如，奸淫，因为它里里外外都是火；谋杀，因为愤怒是一头巨兽；而盗窃则不那么重要，并且很少有人会陷入作假见证的罪。因此，首先禁止的是第一类罪行，因为我们很容易陷入其中，尽管在其他方面它们更为严重。而这些，即盗窃和作假见证，律法将其置于第二位，因为它们不常发生，且不那么重要。


        在这些罪行之后，律法设置了悖逆父母的罪。因为尽管此罪严重，但并不常发生，因为很少、很少，且罕见、极少有这样兽性的人，敢于冒犯父母。'
  - type: paragraph
    initial:
      ru: 'Лк 18:21. '
      cn: （路加福音 18:21）
    text:
      ru: 'Он же сказал: всё это сохранил я от юности моей.'
      cn: 伊曰、此我自幼皆守之矣、
  - type: paragraph
    initial:
      ru: 'Лк 18:22. '
      cn: （路加福音 18:22）
    text:
      ru: 'Услышав это, Иисус сказал ему: еще одного недостает тебе: всё, что имеешь, продай и раздай нищим, и будешь иметь сокровище на небесах, и приходи, следуй за Мною.'
      cn: 伊伊稣斯闻之曰、尔犹阙一、即将尔所有者卖之、而施予贫者、则必有财于天、且来从我、
  - type: paragraph
    text:
      ru: Когда юноша сказал, что он сохранил все это от юности, то Господь предлагает ему верх всего, нестяжательность. Смотри, Законы предписывают истинно христианский образ жизни.«Все,– говорит, –что имеешь, продай». Ибо, если что-нибудь останется, ты, значит, раб того. И«раздай»не родственникам богатым, а«нищим». По моему мнению, и слово«раздай»выражает ту мысль, что расточать имение нужно с рассуждением, а не как попало. Поскольку же при нестяжательности человек должен иметь и все прочие добродетели, постольку Господь сказал:«и следуй за Мною», то есть и во всех прочих отношениях будь Моим учеником, всегда следуй за Мной, а не так, чтобы сегодня следовать, а завтра нет.
      cn: 当那少年说他自幼年就遵守了这一切时，主就向他提出了凌驾于这一切之上的——不贪财（нестяжательность）。看哪，律法所规定的是真正基督徒的生活方式。祂说：「将你所有者，尽都卖了。」因为，如果剩下任何东西，你就是那物的奴隶。并且，「分给」的不是富有的亲戚，而是「穷人」。依我之见，「分给」（раздай）一词表达了这样的思想：施散家财需要有判断力（с рассуждением），而不能随随便便（как попало）。既然有了不贪财（нестяжательность），人就必须具备所有其他的德行，所以主说：「且来从我」，也就是说，在所有其他方面也要做我的门徒，永远跟随我，而不是今天跟随，明天就不跟了。
  - type: paragraph
    initial:
      ru: 'Лк 18:23. '
      cn: （路加福音 18:23）
    text:
      ru: Он же, услышав сие, опечалился, потому что был очень богат.
      cn: 其闻此忧甚、因巨富之故也、
  - type: paragraph
    text:
      ru: Как любостяжательному начальнику Господь обещал сокровище на небесах, однако ж, он не внял, ибо был рабом своих сокровищ, поэтому и«опечалился», услышав, что Господь внушает ему лишение имущества, тогда как он для того и вечной жизни желал, чтоб при большом обилии богатства ему и жить вечно. Скорбь начальника показывает, что он был человек благонамеренный, а не злой хитрец. Ибо из фарисеев никто никогда не печалился, а скорее они ожесточались. Не безызвестно мне, что великий светильник вселенной Златоуст принимал, что юноша сей желал истинной вечной жизни и любил оную, но одержим был сильной страстью, сребролюбием, однако ж не неуместна и предложенная теперь мысль, что он желал вечной жизни, как человек любостяжательный.
      cn: 主应许了那贪婪的首领要在天上有财宝，然而他并未听从，因为他是自己财宝的奴仆，所以，当他听见主向他启示要舍弃财产时，他就「忧伤了」，而他渴望永生的目的恰恰是为了在他拥有大量财富的同时也能永远活下去。这首领的忧伤表明他是一个心存善意的人，而非一个恶毒的诡诈之徒。因为法利赛人中从未有人忧伤，他们毋宁是心肠刚硬。我并非不知晓，那位伟大的普世之光——金口若望——曾接受这样的观点：这年轻人渴望真实的永生并爱慕永生，但他被强烈的激情，即贪财所掌控；然而，我们现在提出的这个观点也并非不合时宜，那就是他渴望永生，是作为一个贪婪的人（而渴望永生）的。
  - type: paragraph
    initial:
      ru: 'Лк 18:24. '
      cn: （路加福音 18:24）
    text:
      ru: 'Иисус, видя, что он опечалился, сказал: как трудно имеющим богатство войти в Царствие Божие!'
      cn: 伊伊稣斯见其忧甚曰、有财者入上帝国何其难哉、
  - type: paragraph
    text:
      ru: После того, как богач, услышав об отречении от богатства, опечалился, Господь чудесным подобием объясняет,«как трудно имеющим богатство войти в Царствие Божие». Не сказал Он, что им (богатым) невозможно войти, но«трудно». Ибо таковым не невозможно спастись. Раздав богатство, они могут получить небесные блага. Но сделать первое нелегко, потому что богатство связывает крепче клея, и тому, кем оно возобладало, трудно отказаться от него. Ниже Господь объясняет, как это бывает невозможно.
      cn: 在富人听闻弃绝财富一事后，变得忧伤，主便以奇妙的比喻解释，「有财富者进入上帝的国度是何等艰难」。他没有说他们（富人）不可能进入，而是说「艰难」。因为对于这样的人来说，得救并非不可能。散尽财富，他们便能获得天上的福祉。但做到前者并不容易，因为财富捆绑人比胶水更牢固，并且对于被财富所掌控的人来说，很难弃绝它。主在下文解释了，这如何会变得不可能。
  - type: paragraph
    initial:
      ru: 'Лк 18:25. '
      cn: （路加福音 18:25）
    text:
      ru: ибо удобнее верблюду пройти сквозь игольные уши, нежели богатому войти в Царствие Божие.
      cn: 骆驼穿针孔、较富者入上帝国尤易也、
  - type: paragraph
    text:
      ru: 'Верблюду пройти сквозь игольные уши решительно невозможно, будешь ли разуметь под верблюдом самое животное, или какой-то корабельный толстый канат. Если же удобнее верблюду поместиться в игольные уши, нежели богатому спастись, а первое невозможно, то тем более невозможно спастись богатому. Что же нужно сказать? Прежде всего то, что богатому действительно невозможно спастись. Не говори мне, пожалуй, что такой-то, будучи богат, раздал, что у него было, и спасся. Ибо он спасся не в богатстве, но когда сделался бедным, или спасся как домоправитель, но не как богатый. А иное дело домоправитель, иное богач. Богач сберегает богатство для себя, а домоправителю вверено богатство для других. Поэтому и тот, на которого указываешь, если спасся, то спасся не с богатством, но, как мы сказали, или тем, что отказался от всего, что он имел, или хорошо распоряжался имением, как домоправитель. Потом заметь и то, что богатому невозможно спастись, а имеющему богатство трудно. Господь как бы так говорит: кто одержим богатством, кто находится у него в рабстве и подданстве, тот не спасется; но кто имеет богатство и держит его в своей власти, а не сам у него находится под властью, тому трудно спастись по немощи человеческой. Ибо невозможно не злоупотребить тем, что мы имеем. Поскольку, доколе мы имеем богатство, диавол старается уловить нас, чтоб мы употребляли оное вопреки правилам и закону домоправления, – и трудно бывает избегнуть его сетей. Поэтому бедность доброе дело, и она почти неискусима.'
      cn: '骆驼穿过针眼是绝对不可能的，无论你理解的「骆驼」是这种动物本身，还是某种厚重的船用缆绳。如果说骆驼穿过针眼比富人得救更为便利，而前者是不可能的，那么富人得救就更不可能了。那么，我们需要说什么呢？


        首先要说的是，富人得救确实是不可能的。请不要对我说，某某人虽然富有，但他散尽了所有，因此得救了。因为他得救不是在财富之中，而是在变得贫穷之后，或者他得救是作为一位管家，而不是作为富人。管家是一回事，富翁是另一回事。富翁为自己积蓄财富，而管家则是受托为他人管理财富。因此，你所指的那个人，如果得救了，他得救不是带着财富，而是如我们所说，或者是因为他舍弃了他所拥有的一切，或者是因为他像管家一样妥善地处理了产业。


        然后，请注意以下一点：富人得救是不可能的，而拥有财富的人得救是困难的。主似乎在说：谁被财富所掌控，谁成为财富的奴隶和臣仆，他就不能得救；但是谁拥有财富，并将财富置于自己的掌控之下，而不是自己处于财富的掌控之下，那么他要得救是困难的，这是由于人类的软弱。因为我们不可能不滥用我们所拥有的东西。只要我们拥有财富，魔鬼就会试图诱捕我们，让我们以违背管家规则和律法的方式使用它——而要避开它的网罗是困难的。因此，贫穷是一件好事，它几乎不会受到试探。'
  - type: paragraph
    initial:
      ru: 'Лк 18:26. '
      cn: （路加福音 18:26）
    text:
      ru: 'Слышавшие сие сказали: кто же может спастись?'
      cn: 闻之者曰、然则谁能得救乎、
  - type: paragraph
    initial:
      ru: 'Лк 18:27. '
      cn: （路加福音 18:27）
    text:
      ru: 'Но Он сказал: невозможное человекам возможно Богу.'
      cn: 彼曰、在人所不能者、然在上帝皆所能者也、
  - type: paragraph
    text:
      ru: 'Кто имеет человеческий образ мыслей, то есть увлекается дольним и пристрастен к земному, тому, как сказано, спастись невозможно, а для Бога это возможно; то есть, когда кто будет иметь советником своим Бога и в учители себе возьмет оправдания Божии и заповеди о нищете, и будет призывать Его в помощь, тому возможно будет спастись. Ибо наше дело желать добра, а совершать оное дело Божие. И иначе: если мы, возвысившись над всяким человеческим малодушием относительно богатства, пожелаем даже друзей приобрести себе неправедным богатством, то мы спасемся и провождены будем ими в вечные обители. Ибо лучше, если мы откажемся от всего или, если не откажемся от всего, по крайней мере сделаем бедных соучастниками, и тогда невозможное сделается возможным. Хотя не отказавшись от всего нельзя спастись, но по человеколюбию Божию возможно бывает спастись и в том случае, если несколько частей уделить на действительную пользу.'
      cn: 谁拥有人的思维模式，即被世俗之事所吸引且对地上之物心存偏爱，对他而言，如经文所言，得救是不可能的，但对于上帝而言，这是可能的；也就是说，当一个人以神为他的建议者，并以神的称义、以及关于贫穷的诫命作为自己的教师，并呼求祂的帮助时，他便有可能得救。因为我们所当做的乃是渴望良善，而成就良善乃是上帝的工作。另有一种解释：如果我们超脱于一切人对财富的懦弱，甚至希望用不义的财富为自己赢得朋友，那么我们便会得救，并被他们引向永恒的居所。因为最好的是，我们要么放弃一切，要么即便没有放弃一切，至少也要让穷人成为（财富的）同享者，如此一来，不可能之事便会成为可能。虽然没有放弃一切就不能得救，但因着上帝的仁爱，即便是在那种情况下——如果将几部分施予实际的益处——得救也是可能的。
  - type: paragraph
    initial:
      ru: 'Лк 18:28. '
      cn: （路加福音 18:28）
    text:
      ru: Петр же сказал; вот, мы оставили всё и последовали за Тобою.
      cn: 撇特儿曰、顾、我侪已舍一切而从尔、
  - type: paragraph
    initial:
      ru: 'Лк 18:29. '
      cn: （路加福音 18:29）
    text:
      ru: 'Он сказал им: истинно говорю вам: нет никого, кто оставил бы дом, или родителей, или братьев, или сестер, или жену, или детей для Царствия Божия,'
      cn: 彼语之曰、我诚告尔等、凡人为上帝国舍家、或父母、或弟兄、或姊妹、或妻、或子者、
  - type: paragraph
    initial:
      ru: 'Лк 18:30. '
      cn: （路加福音 18:30）
    text:
      ru: и не получил бы гораздо более в сие время, и в век будущий жизни вечной.
      cn: 未有在今世不受多倍、来世不得永远生命者也、
  - type: paragraph
    text:
      ru: При этом Петр спрашивает:«вот, мы оставили все»и спрашивает не для себя только, но для утешения всех бедных. Чтобы не одни богатые имели благие надежды получить много, как отказавшиеся от многого, а бедные не имели надежды, как отказавшиеся от малого и посему малую награду заслужившие, для сего Петр спрашивает и слышит в ответ, что и в нынешнем, и будущем веке получит воздаяния всякий, кто бы ни презрел ради Бога свое имение, хотя бы оно было и мало. Ты не на то смотри, что оно мало, но что это малое заключало в себе все средства человека к жизни, и что, как ты надеялся на многое и великое, так он этим немногим и малым надеялся поддержать свою жизнь. Не говорю уже о том, что имеющий малое имеет большую к нему привязанность. Это видно на отцах. Имея одно дитя, они обнаруживают к нему большую привязанность, нежели тогда, когда у них детей бывает больше. Так и бедный, имея один дом и одно поле, сильнее их любит, нежели ты – многие. Если и не так, а у обоих равномерна привязанность, то равно достойно и отречение. Поэтому и в настоящем веке они получают во много раз большее воздаяние, подобно как сии самые апостолы. Ибо каждый из них, оставив хижину, ныне имеет блистательные храмы, поля, приходы, много жен, привязанных к ним горячностью и верой, и вообще все прочее. Да и в будущем веке получат они не множество подобных полей и телесных наград, но вечную жизнь.
      cn: 与此同时，彼得问说：「看哪，我们已经撇下了一切，」他发问并非只为了自己，而是为了安慰所有贫穷之人。这并非是说，只有富人，因着舍弃了许多，才拥有得着许多的良好希望；而穷人，因着舍弃了微少，便没有希望，因此只配得微薄的奖赏。正是为此，彼得发问了，并听到了这样的回答：无论何人，只要是为着上帝而轻视了自己的产业，即使它微不足道，也必在今生和来世得着报偿。你不要只看它微少，而要看这微小之物已包含了此人生存所需的一切资源；并且，正如你曾寄望于许多和伟大的事物，他也曾靠着这微小而稀少之物来维系他的生命。我且不说，拥有微小之物的人对它有更大的依恋。这在父亲们身上是显而易见的。他们只有一个孩子时，对他的爱慕之情要比他们拥有更多孩子时更大。同样，穷人只有一栋房屋和一块田地时，他对它们的爱也比你对许多事物的爱更强烈。就算情况并非如此，而是二者的依恋程度相同，那么他们的舍弃也同样是值得的。因此，他们也在今世得到多倍的报偿，正如这些使徒们一样。因为他们每一个人都撇下了一间茅屋，如今却拥有辉煌的殿宇、田地、教区，以及许多因着热忱与信心而依附于他们的妻子们，总之，还有所有其他一切。并且，在未来的世代中，他们将得到的并非是无数相似的田地和肉身的奖赏，而是永远的生命。
  - type: paragraph
    initial:
      ru: 'Лк 18:31. '
      cn: （路加福音 18:31）
    text:
      ru: 'Отозвав же двенадцать учеников Своих, сказал им: вот, мы восходим в Иерусалим, и совершится всё, написанное через пророков о Сыне Человеческом,'
      cn: 〇彼召十二门徒、向之曰、顾、我侪将上耶鲁萨利木、成就众先知为人子所载者、
  - type: paragraph
    initial:
      ru: 'Лк 18:32. '
      cn: （路加福音 18:32）
    text:
      ru: ибо предадут Его язычникам, и поругаются над Ним, и оскорбят Его, и оплюют Его,
      cn: 盖人将付之于异邦人、戏玩之、凌辱之、吐唾之、
  - type: paragraph
    initial:
      ru: 'Лк 18:33. '
      cn: （路加福音 18:33）
    text:
      ru: 'и будут бить и убьют Его: и в третий день воскреснет.'
      cn: 鞭扑而杀之、于第三日复活也、
  - type: paragraph
    text:
      ru: Господь предсказывает ученикам о страданиях Своих для двух целей. Во-первых, чтобы показать, что Он будет распят не против воли и не как простой человек, не знающий своей смерти, но что Он знает о ней прежде и претерпит ее добровольно. Поскольку, если бы Он не желал пострадать, то, как предвидящий, уклонился бы от этого. Ибо против воли попадаться в чужие руки свойственно незнающим о том вперед. Во-вторых, чтобы убедить их легко переносить будущие обстоятельства, как известные им предварительно и случившиеся с ними не внезапно. Если же, Господи, на Тебе имеет совершиться давно предсказанное пророками, то зачем Ты восходишь в Иерусалим? За тем самым, чтобы Мне совершить спасение. Итак, Он идет добровольно.
      cn: '主预先告知门徒祂的受难，乃是为了两个目的。


        首先，是为了表明祂被钉十字架并非违背意愿，也并非像一个不晓得自己死亡的普通人那样，而是祂早已知晓此事，并将自愿承受。因为，倘若祂不愿受难，那么作为一位预知者，祂本会避开此事。因为，违背意愿而落入他人之手，乃是那些事先不知情之人的特征。


        其次，是为了使他们（门徒）相信，他们应轻快地承受未来的情境，因这些事是他们事先知晓的，并非突然临到他们。


        「主啊，若是早先被先知们所预言之事必要在你身上成就，那么你为何还要上耶路撒冷去呢？」


        「正因如此，好使我成就救赎。」


        因此，祂是自愿前去的。'
  - type: paragraph
    initial:
      ru: 'Лк 18:34. '
      cn: （路加福音 18:34）
    text:
      ru: Но они ничего из этого не поняли; слова сии были для них сокровенны, и они не разумели сказанного.
      cn: 然彼等毫无所悟、此言为彼等隐密、亦不知所言何也、
  - type: paragraph
    text:
      ru: 'Впрочем для сего Он говорил, а ученики не понимали тогда ничего. Ибо«слова сии были для них сокровенны», особенно слова о Воскресении. И прочих слов они не разумели, например, о том, что предадут Его язычникам; но слов о воскресении решительно не разумели, потому что они не были в употреблении. Да и не все иудействующие веровали даже и во всеобщее воскресение, как это видно на саддукеях (Мф. 22, 23). Быть может, ты скажешь: если ученики не разумели, то зачем же, наконец, Господь говорил им о сем вперед? Какая польза для их утешения во время крестных страданий, когда они не разумели сказанного? За то немалая польза была тогда, когда они впоследствии вспоминали, что сбылось именно то, чего они не поняли, когда предсказывал им Господь. Это видно из многого, особенно же из слов Иоанна:«Ученики Его сперва не поняли этого; но когда прославился Иисус, тогда вспомнили, что та́к было о Нем написано»(Ин. 12, 16) И Утешитель, напомнив им все, вложил им достовернейшее свидетельство о Христе. А о том, как погребение было тридневное, довольно сказано в толковании на прочих евангелистов (см.гл. 12).'
      cn: 不过，祂为此缘故才说了这话，而门徒们当时什么也不明白。「因为这话对于他们是隐密的」，尤其是关于复活的话语。他们不理解其他的话，例如，关于祂将被交给外邦人的话；但他们对于关于复活的话，则根本不理解，因为这些话并未被使用。甚至，并非所有犹太化的人都相信普世的复活，从撒都该人身上就可以看出这一点（马太福音 22:23）。或许你会说：如果门徒们不明白，那么主最后为什么要事先对他们说这些呢？当他们不理解所说的话时，这对他们在十字架苦难期间获得安慰有什么益处呢？然而，在他们后来回想时，却有不小的益处，他们想起主预言他们所不理解的事，但这些事却应验了。这从很多地方可以看出来，尤其是从伊鄂昂的话中：「门徒们起初不明白这事；但当耶稣得荣耀之后，他们才回想起，原来经上是这样论及祂的」（伊鄂昂福音 12:16）。而保惠师，在提醒了他们一切之后，将关于基督的最可靠的见证放在了他们心中。至于三日安葬的细节，在解释其他福音书时已经说得够多了（见 第12章）。
  - type: paragraph
    initial:
      ru: 'Лк 18:35. '
      cn: （路加福音 18:35）
    text:
      ru: Когда же подходил Он к Иерихону, один слепой сидел у дороги, прося милостыни,
      cn: 〇彼及耶利鸿、有一瞽者、坐乞道旁、
  - type: paragraph
    initial:
      ru: 'Лк 18:36. '
      cn: （路加福音 18:36）
    text:
      ru: 'и, услышав, что мимо него проходит народ, спросил: что это такое?'
      cn: 闻民经过、问曰、此何也、
  - type: paragraph
    initial:
      ru: 'Лк 18:37. '
      cn: （路加福音 18:37）
    text:
      ru: Ему сказали, что Иисус Назорей идет.
      cn: 人告之是那作列特伊伊稣斯经过、
  - type: paragraph
    initial:
      ru: 'Лк 18:38. '
      cn: （路加福音 18:38）
    text:
      ru: 'Тогда он закричал: Иисус, Сын Давидов! помилуй меня.'
      cn: 其呼曰、伊伊稣斯达微德之子欤、矜怜我、
  - type: paragraph
    text:
      ru: Во время пути Господь совершает чудо над слепым, чтобы и прохождение Его не было учением бесполезным для нас и для учеников Христовых, чтобы мы во всем, всегда и везде приносили пользу, а праздного у нас не было бы ничего. Слепец веровал, что Он (Иисус) есть ожидаемый Христос (ибо, вероятно, как воспитанный между иудеями, он знал, что Христос от семени Давидова), и кричал громким голосом:«Сын Давидов! помилуй меня». И словами«помилуй меня»выражал, что он имеет о Нем какое-то божественное понятие, а не считает просто человеком.
      cn: 在路途上，主对一个瞎子行了神迹，使得祂的经过对于我们以及对于基督的门徒而言，并非是无益的教导，为的是让我们在一切事上、任何时候、任何地方都能带来益处，而不应有任何闲置之物。这个瞎子相信祂（耶稣）就是受人期待的基督（因为，或许是作为一个在犹太人中间被养育长大的人，他知道基督出自大卫的后裔），并大声喊叫说：「大卫之子啊！怜悯我。」 他用「怜悯我」这些话表达了他对祂怀有一种神圣的观念，而非仅将祂视作一个单纯的人。
  - type: paragraph
    initial:
      ru: 'Лк 18:39. '
      cn: （路加福音 18:39）
    text:
      ru: 'Шедшие впереди заставляли его молчать; но он еще громче кричал: Сын Давидов! помилуй меня.'
      cn: 前行者斥之、使缄默、彼更大呼曰、达微德之子欤、矜怜我、
  - type: paragraph
    text:
      ru: Подивись, пожалуй, и настойчивости его исповедания, как он, несмотря на то, что многие унимали его, не молчал, а еще громче кричал; ибо горячность изнутри двигала им.
      cn: 请看，并留意他告白（*исповедания*）的坚韧不拔（*настойчивости*），他尽管被许多人制止（*унимали*），却并未缄默，反而呼喊得更为响亮；因为来自内在的炙热驱动着他。
  - type: paragraph
    initial:
      ru: 'Лк 18:40. '
      cn: （路加福音 18:40）
    text:
      ru: 'Иисус, остановившись, велел привести его к Себе: и, когда тот подошел к Нему, спросил его:'
      cn: 伊伊稣斯遂止、命导之来、其近就之、问之曰、
  - type: paragraph
    initial:
      ru: 'Лк 18:41. '
      cn: （路加福音 18:41）
    text:
      ru: 'чего ты хочешь от Меня? Он сказал: Господи! чтобы мне прозреть.'
      cn: 尔何愿于我、其曰、主欤、我欲得见、
  - type: paragraph
    text:
      ru: 'Поэтому и Иисус подзывает его к Себе, как поистине достойного приблизиться к Нему, и спрашивает его:«чего ты хочешь от Меня?»Спрашивает не потому, будто бы не знает, но чтобы находящимся тут не показалось, что тот просит о том, а Он подает другое: тот, например, просит денег, а Он, желая показать Себя, исцеляет слепоту. Ибо зависть может клеветать и таким безумным образом. Поэтому Господь спросил, и когда открыл, что он желает прозреть, прозрение ему и дает.'
      cn: 因此，耶稣也将他召唤到自己身边，视他为真正配得亲近祂的人，并询问他：「你想要我为你做什么？」祂并非是因不知情而询问，而是为了不让在场的人认为，那人所求的是一事，而祂所赐予的是另一事：例如，那人求的是钱财，而祂却为了彰显自己，去医治了他的眼盲。因为嫉妒甚至会以这种愚妄的方式进行诽谤中伤。因此，主发问了，当祂得知那人渴望重见光明时，便赐予了他光明。
  - type: paragraph
    initial:
      ru: 'Лк 18:42. '
      cn: （路加福音 18:42）
    text:
      ru: 'Иисус сказал ему: прозри! вера твоя спасла тебя.'
      cn: 伊伊稣斯曰、可得见、尔之信救尔、
  - type: paragraph
    text:
      ru: Смотри и на отсутствие гордости.«Вера твоя, – говорит, –спасла тебя», поскольку ты уверовал, что Я есмь проповедуемый оный Сын Давидов Христос, и высказал такую горячность, что не молчал, несмотря на запрещение. Из сего мы научаемся тому, что когда мы просим с верой, то не так бывает, что мы просим сего, а Господь подает иное, но именно то самое. Если же мы просим сего, а получаем иное, то явный знак, что мы просим не доброго и не с верой.«Про́сите,– сказано, –и не получаете, потому что про́сите не на добро»(Иак. 4, 3). Примечай и власть:«прозри». Кто из пророков исцелял так, то есть с такой властью? Отсюда и глас, происшедший от истинного Света (Ин. 1, 9), стал светом для больного.
      cn: 你也要注意其中没有骄傲。「『你的信心救了你，』他说，」因为你相信我就是那位被宣扬的大卫之子基督，而且你表达出了如此热忱，以至于虽然有人禁止，你却没有保持沉默。由此我们得知：当我们带着信心祈求时，并非如此，即我们祈求此事，而主却赐予彼事，而是恰恰就是那件事本身。倘若我们祈求此事，而获得的却是彼事，那么这明显标志着我们所求的并非是良善的，也并非带着信心。「你们求，却得不着，因为你们妄求（不为着良善）」（亚适乌书 4:3）。也要留意那权能：「你得见吧（复明吧）。」在众先知中，有谁是以这种方式，即带着如此权能进行医治的呢？因此，那源自真光（伊鄂昂福音 1:9）的声音，就成为了病人的光。
  - type: paragraph
    initial:
      ru: 'Лк 18:43. '
      cn: （路加福音 18:43）
    text:
      ru: И он тотчас прозрел и пошел за Ним, славя Бога; и весь народ, видя это, воздал хвалу Богу.
      cn: 其遂得见、且从之行、荣光上帝、众人见之、以赞美归上帝、
  - type: paragraph
    text:
      ru: Заметь и благодарность исцеленного. Ибо он пошел за Иисусом,«славя Бога»и других располагая к прославлению Его.
      cn: 请留意那被治愈者的感恩之心。因为他跟随了耶稣，「颂赞上帝」，并且引导其他人也去赞美祂。
- type: heading1
  text:
    ru: Глава девятнадцатая
    cn: 第十九章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 19:1. '
      cn: （路加福音 19:1）
    text:
      ru: ПотомИисусвошел в Иерихон и проходил через него.
      cn: 〇彼入耶利鸿行过时、
  - type: paragraph
    initial:
      ru: 'Лк 19:2. '
      cn: （路加福音 19:2）
    text:
      ru: И вот, некто, именем Закхей, начальник мытарей и человек богатый,
      cn: 而顾、有人名咂克黑乙、乃为税吏之长而富者、
  - type: paragraph
    initial:
      ru: 'Лк 19:3. '
      cn: （路加福音 19:3）
    text:
      ru: искал видеть Иисуса, кто Он, но не мог за народом, потому что мал был ростом,
      cn: 求见伊伊稣斯为何如人、因民之故不得见、盖其身短也、
  - type: paragraph
    initial:
      ru: 'Лк 19:4. '
      cn: （路加福音 19:4）
    text:
      ru: и, забежав вперед, взлез на смоковницу, чтобы увидеть Его, потому что Ему надлежало проходить мимо нее.
      cn: 遂趋前升无花果树、为见之、因彼过此、
  - type: paragraph
    initial:
      ru: 'Лк 19:5. '
      cn: （路加福音 19:5）
    text:
      ru: 'Иисус, когда пришел на это место, взглянув, увидел его и сказал ему: Закхей! сойди скорее, ибо сегодня надобно Мне быть у тебя в доме.'
      cn: 伊伊稣斯至其处之时、仰视之曰、咂克黑乙速下哉、因我今日、当寓尔家、
  - type: paragraph
    text:
      ru: Господь похищает самые крепкие сосуды у диавола и разрушает его города. Ибо смотри, как Он не только мытарей сделал Своими учениками, но и старшего между мытарями Закхея пленяет во спасение. А что мытарь существо низкое, а старший между мытарями, как начальствующий в злобе, еще более гнусен, в том никто не сомневается. Ибо средства к жизни мытари приобретают не иначе, как от слез бедных. Однако ж этот старший между мытарями не оставляется в презрении, но оказывает гостеприимство и в воздаяние получает спасение. Ибо когда он пожелал увидеть Иисуса и для сего взлез на смоковницу, Господь усматривает его прежде, чем он сам увидел Его. Так Бог везде предваряет нас, лишь только увидит нашу готовность.
      cn: 主从魔鬼手中夺走最坚固的器皿，并摧毁魔鬼的城池。因为请看，祂不仅使税吏成为祂的门徒，而且还将税吏中的头目——匝克黑——掳获，使他得着救恩。至于说税吏是卑微之人，而税吏中的头目作为恶行中的掌权者，更是令人憎恶，对此没有人会怀疑。因为税吏获取生活资料，无非是来自穷人的眼泪。然而，这位税吏中的头目并未被弃于蔑视之中，反而施行款待，并因此获得救恩作为报偿。因为当他渴望看见耶稣，并为此爬上桑树时，主在他尚未看见祂之前，就先察觉到他。因此，只要上帝看见我们的准备，祂就总是在各处走在我们前面。
  - type: paragraph
    initial:
      ru: 'Лк 19:6. '
      cn: （路加福音 19:6）
    text:
      ru: И он поспешно сошел и принял Его с радостью.
      cn: 遂急下、喜接之、
  - type: paragraph
    initial:
      ru: 'Лк 19:7. '
      cn: （路加福音 19:7）
    text:
      ru: И все, видя то, начали роптать, и говорили, что Он зашел к грешному человеку;
      cn: 众见之、怨曰、彼往宿罪人之家矣、
  - type: paragraph
    text:
      ru: Иисус, увидев его, повелевает ему скорее слезть, так как Он имеет быть в дому его. Закхей не умедлил, ибо не должно уклоняться, когда повелевает что-нибудь Христос, но слез и«принял... с радостью,»хотя многие роптали. Посмотрим же, какие он приносит плоды по случаю посещения Христова.
      cn: 耶稣看见他，吩咐他要尽快下来，因为祂打算去他家里。撒该没有耽延，因为当基督吩咐任何事情时，人不应回避，他下来并「欢欢喜喜地接待了祂，」尽管许多人抱怨（或「发怨言」）。那么，让我们看看他因基督的造访所结出的果实是什么。
  - type: paragraph
    initial:
      ru: 'Лк 19:8. '
      cn: （路加福音 19:8）
    text:
      ru: 'Закхей же, став, сказал Господу: Господи! половину имения моего я отдам нищим, и, если кого чем обидел, воздам вчетверо.'
      cn: 咂克黑乙立而向主曰、主欤、顾、我以我所有之半济贫、若曾诬诈人、则四倍偿之、
  - type: paragraph
    text:
      ru: '«Половину имения моего,... Господи,– говорит он, –отдам нищим». Видишь ли горячность? Он начал сеять без пощады и отдал не что-нибудь малое, но все жизненное. Ибо и то самое, что он удержал, удерживал для того, чтобы иметь возможность отдать обиженным. Сим научает и нас, что нет никакой пользы, если кто, имея богатство неправедное, милует иных, а обиженных оставляет без внимания. Смотри, как он и в сем случае поступает.«Если кого чем обидел», он возвращает«вчетверо», сим самым вознаграждая убыток, причиненный обиженному. Ибо истинная милость не просто убыток возвращает, но и с прибавлением, согласно с Законом. Ибо Закон заставлял укравшего уплатить вчетверо (Исх. 22,1). Если даже до точности рассмотрим, то увидим, что у него решительно ничего не осталось из имения. Ибо половину имения он дает нищим, и у него осталась только половина. Из этой оставшейся половины он опять возвращает вчетверо тем, кого он обидел. Поэтому, если жизнь этого старейшины мытарей состояла из неправд, а он за все, что приобрел неправдой, возвращает вчетверо, то смотри, как он всего лишился. В сем отношении он оказывается мудрствующим выше Закона, учеником Евангелия, так как он возлюбил ближнего более чем себя, и это не в обещании только, но и на самом деле. Ибо не сказал: отдам половину, возвращу вчетверо, но: вот я «даю», «возвращаю». Он знает наставление Соломона:«Не говори...: «пойди и приди опять, и завтра я дам»(Притч. 3, 28).'
      cn: 「我所有财产的一半，……主啊，」他说，「我要分给穷人。」你看到那热切了吗？他开始毫不留情地播撒，并且他所给出的不是微小之物，而是所有维生之物。因为他所保留的那部分，也是为了能有能力偿还给那些被他冤屈之人。借此，他也教导我们，如果一个人拥有不义之财，他怜悯他人，却对被冤屈之人置之不理，那是毫无益处的。看，他在这种情况下是如何行事的。「若我曾诬诈过任何人」，他偿还「四倍」，正是以此来补偿被冤屈之人所遭受的损失。因为真实的怜悯不仅仅是归还损失，而且要根据《律法》加上附加部分。因为《律法》要求偷窃者偿还四倍（出埃及记 22:1）。如果我们精确地审视，我们会看到他实际上没有留下任何财产。因为他将财产的一半给了穷人，而他只剩下了一半。他又从这剩下的一半中，四倍偿还给那些被他冤屈的人。因此，如果这位税吏长（старейшины мытарей）的生活是由不义构成的，而他将所有通过不义所获得的都四倍偿还，那么请看他是如何失去了一切。在这方面，他被证明是智虑高于《律法》的，是《福音书》的门徒，因为他爱邻人甚于自己，这不仅是在应许中，而且是在实际行动上。因为他没有说：我将分给一半，我将偿还四倍，而是说：看哪，我「分给」，我「偿还」。他深知所罗门（Соломона）的教诲：「你不可说：『去吧，再来，明天我必给你』」（箴言 3:28）。
  - type: paragraph
    initial:
      ru: 'Лк 19:9. '
      cn: （路加福音 19:9）
    text:
      ru: 'Иисус сказал ему: ныне пришло спасение дому сему, потому что и он сын Авраама,'
      cn: 伊伊稣斯向之曰、今拯救临此家、因彼亦系阿乌拉阿木之子、
  - type: paragraph
    text:
      ru: 'Христос благовествует ему спасение. Ныне, – говорит, – ты даешь, ныне тебе спасение. Ибо словами«дому сему»,без сомнения, указывает на Закхея, получающего спасение. Под домом разумеется Закхей, потому что бездушное здание Господь не назвал бы сыном Авраамовым, а очевидно назвал так одушевленного хозяина дома. Назвал егосыном Авраамовым,быть может, потому, что он уверовал и оправдался верой, а может быть, и потому, что великодушно презрел богатство и возлюбил бедных подобно сему патриарху. Примечай: Господь назвал Закхея сыном Авраамовым теперь, когда увидел в нем сходство в образе жизни. Не сказал Он: потому что и сей сын Авраамовбыл, но нынеесть.Ибо прежде, будучи старейшиной мытарей и сборщиком податей, а с праведником не имея никакого сходства, он не был сыном его.'
      cn: 基督向他传报救恩。祂说：「现今，你施予，现今，救恩临到你。」 因为祂毫无疑问地以「临此家」这句话，指明了正在领受救恩的撒该。这里所说的「家」指的就是撒该，因为主绝不会称一个无生命的建筑为「阿乌拉阿阿木之子」，而显然是称有生命的房主为此。祂称他为「阿乌拉阿阿木之子」，或许是因为他因信称义、得了称许；也或许是因为他像这位先祖一样，心胸宽广地蔑视财富，且爱慕穷人。请注意：主是在此刻、当祂看到撒该的生活方式与之相似时，才称撒该为阿乌拉阿阿木之子。祂没有说：「因为此人曾是阿乌拉阿阿木之子」，而是说：「现今是。」 因为在此之前，他既是税吏长和收税者，与义人没有任何相似之处，他就不是他的儿子。
  - type: paragraph
    initial:
      ru: 'Лк 19:10. '
      cn: （路加福音 19:10）
    text:
      ru: ибо Сын Человеческий пришел взыскать и спасти погибшее.
      cn: 盖人子来、为寻救失亡者、
  - type: paragraph
    text:
      ru: Поскольку же некоторые роптали на то, что Господь пошел в дом к грешному мужу, то, чтобы заградить им уста, Он говорит:«Сын Человеческий пришел взыскать и спасти погибшее». Таков буквальный смысл.
      cn: 既然有些人因主进入那罪人的家而发出抱怨，他为了让他们噤声，便说：「人子来，为要寻找、拯救失丧的人。」此乃字面意义。
  - type: paragraph
    text:
      ru: 'Но удобно можно изъяснять это и иначе, в пользу нравственности. Всяк, кто старше многих в злобе, мал духовным ростом, ибо плоть и дух противоположны между собой, и потому не может увидеть Иисуса за народом; то есть, смущаемый страстями и житейскими делами, не может видеть Иисуса действующего, движущегося и ходящего. Ибо таковой не ощущает никакого действия, приличного христианину. А хождение Иисуса то и означает, когда Христос нечто действует в нас. Такой человек, никогда не видавший Иисуса ходящего и не испытавший никакого действия, приличного Христу, часто от раскаяния приходит в сознание и взлезает на смоковницу, то есть презирает и попирает всякое удовольствие и приятность, которые означаются смоковницей, и таким образом, возвысившись над собой и полагая восхождение в сердце, усматривается Иисусом, и сам усматривает Его. Тогда Господь говорит ему:«сойди скорее», то есть чрез покаяние ты пришел на высшую жизнь, сойди же чрез смирение вниз, чтобы высокомерие не обмануло тебя. Смирись скорее, ибо если ты смиришься, то«Мне... надобно... быть у тебя в доме». Мне, – говорит, – необходимо быть в дому смиренного. Ибо«на кого Я призрю: на смиренного и сокрушенного духом и на трепещущего пред словом Моим»(Ис. 66,2). Такой человек половину имения отдает нищим, то есть бесам. Имение у нас двоякого рода, то есть телесное и душевное. Все телесное праведник уступает бесам, поистине нищим и лишенным всякого блага, но от душевного имения не отступается. Как известно, и Господь говорит об Иове:«только душу его сбереги»(Иов. 2,6). Если таковой обидел кого чем, он уплачивает вчетверо. Сим намекается на то, что всякий, чрез покаяние переходящий на путь, противный прежней злобе, четырьмя добродетелями врачует все прежние грехи и таким образом получает спасение. Называется онсыном Авраамовым, так как, подобно Аврааму, он вышел из своей земли и от сродства прежней злобы, поселился вне дома отца своего, то есть вне себя, и отвергся самого себя (ибо он был домом отца своего диавола (Ин. 8,44), и таким образом, став вне себя и отчуждившись, получает спасение.'
      cn: '然而，也可方便地以另一种方式解释此段经文，以利于道德。


        凡是在恶行上比许多人更年长（*старше*）的人，在灵性上是矮小的，因为肉体与精神相互对立，因此他不能因人群的阻隔而看见耶稣；也就是说，他被情欲和世俗事务所困扰，不能看见耶稣在行动、在移动、在行走。因为这样的人感觉不到任何适合基督徒的作为。而耶稣的行走则意味着，基督在我们里面有所作为。


        这样的人，从未见过耶稣行走，也未曾体验过任何适合基督的作为，他常常因悔改而醒悟，并爬上桑树，即蔑视和践踏一切以桑树为象征的享乐与愉悦，如此，他超脱了自己，在心中立下登攀，就被耶稣所察觉，而他自己也察觉了耶稣。那时，主对他说道：「快下来吧」，也就是说，你通过悔改达到了更高的生命，现在要通过谦卑降下来，以免傲慢欺骗了你。快快谦卑吧，因为如果你谦卑，「我必在你的家停留」。他说，我必需要在谦卑之人的家中。因为「我所看顾的，就是那贫穷和心灵痛悔，因我的话而战兢的人」（以赛亚书 66:2）。


        这样的人将他一半的家产分给穷人，即分给鬼魔。我们的家产有两种，即属肉体的和属灵魂的。正直之人将所有属肉体的都让给鬼魔，鬼魔确实是贫穷的，缺乏一切良善，但他不会放弃属灵魂的家产。众所周知，主也论及约伯：「只留下他的性命」（约伯记 2:6）。


        如果这样的人在某事上亏负了谁，他会四倍偿还。这暗示着：凡是借由悔改而转入与先前恶行相反道路的人，他会用四种美德医治所有先前的罪，如此便可获得救赎。


        他被称为阿乌拉阿阿木之子，正如阿乌拉阿阿木一样，他离开了自己的土地和先前罪恶的同族，居住在他父亲的家之外，即在他自己之外，并否认了自己（因为他曾是他父亲魔鬼的家（伊鄂昂福音 8:44）），如此，他置身于自己之外并被疏远，便获得了救赎。'
  - type: paragraph
    initial:
      ru: 'Лк 19:11. '
      cn: （路加福音 19:11）
    text:
      ru: 'Когда же они слушали это, присовокупил притчу: ибо Он был близ Иерусалима, и они думали, что скоро должно открыться Царствие Божие.'
      cn: 彼等闻此之时、又设譬喻、缘彼已近耶鲁萨利木、彼等意上帝国将即显现、故彼如此曰、
  - type: paragraph
    text:
      ru: Мне кажется, что люди сии, слыша о Царствии Божием, понимали оное чувство о благоволении будто бы Божием на освобождение народа еврейского, поэтому и предполагали, что Иисус, восходя в Иерусалим, примет это царство.
      cn: 我以为这些人，听闻上帝的国，理解那种关于似乎是上帝的恩惠的感觉，乃是关于解放犹太民族的恩惠，因此他们就推测，耶稣升往耶路撒冷，就要接受这个国。
  - type: paragraph
    initial:
      ru: 'Лк 19:12. '
      cn: （路加福音 19:12）
    text:
      ru: 'Итак сказал: некоторый человек высокого рода отправлялся в дальнюю страну, чтобы получить себе царство и возвратиться;'
      cn: 〇有一尊贵人往远地、为得国而归、
  - type: paragraph
    text:
      ru: Но Господь, чтобы показать им, что они рассуждают неразумно, ибо Царствие Его не чувственное, а вместе выразить и то, что Ему как Богу известны их помыслы, говорит настоящую притчу, выводя Себя в лице человека«высокого рода». Ибо хотя Он соделался человеком, но не отступил и от высоты и благородства Божества. Совершив же Таинство Домостроительства во плоти, снова отправился«в дальнюю страну», то есть, чтобы и по человечеству сесть с плотью«одесную престола величия на небесах»(Евр. 8,1). Ибо как Бог – Он всегда восседал с Отцом, а как человек – Он тогда сел, когда вознесся, ожидая, доколе враги положены будут под ноги Его (Евр. 10, 12–13). А это будет в конце мира, когда все, и нежелающие, покорятся Ему, уверовав, что«Господь Иисус Христос в славу Бога Отца»(Флп. 2, 11).
      cn: 但是主，为了向他们表明他们的推理是不明智的——因为祂的国度并非属乎感官的——同时也表达祂作为神是知晓他们的心意的，就说了这个比喻，将自己描绘成一个「尊贵人」。因为祂虽然成了人，但并未偏离神性的崇高和高贵。祂在肉身中完成了道成肉身（*Домостроительства во плоти*）的奥秘后，又「往远地」去了，也就是说，即使按着人性，祂也带着肉身「坐在高天至大者的右边」（希伯来书 8:1）。因为作为神，祂一直与父同坐；而作为人，祂是在升天时才坐下的，等候着，直到仇敌都放在祂的脚下（希伯来书 10:12-13）。这将在世界的末了发生，那时，所有的人，甚至那些不情愿的人，都将服从祂，深信「耶稣基督是主，使荣耀归与父神」（腓立比书 2:11）。
  - type: paragraph
    initial:
      ru: 'Лк 19:13. '
      cn: （路加福音 19:13）
    text:
      ru: 'призвав же десять рабов своих, дал им десять мин и сказал им: употребляйте их в оборот, пока я возвращусь.'
      cn: 遂召其十仆、予彼等银十斤、而命之曰、尔等贸易、以待我归、
  - type: paragraph
    initial:
      ru: 'Лк 19:14. '
      cn: （路加福音 19:14）
    text:
      ru: 'Но граждане ненавидели его и отправили вслед за ним посольство, сказав: не хотим, чтобы он царствовал над нами.'
      cn: 其国民憾之、遣使随其后曰、我侪不愿斯人君我也、
  - type: paragraph
    text:
      ru: '«Граждане»его суть иудеи, ненавидящие Его.«И видели, – говорит Он, –и возненавидели и Меня, и Отца Моего»(Ин. 15, 24). Они не хотели, чтоб Он царствовал над ними. Поэтому, отрекаясь от Его царства, и говорили Пилату:«нет у нас царя», и опять«не пиши: Царь Иудейский»(Ин. 19, 15, 21). Однако же Захария взывает:«Ликуй от радости, дщерь Сиона...: се Царь твой грядет к тебе, праведный и спасающий»(Зах. 9,9); и Исаия:«Вот, Царь будет царствовать по правде»(Ис. 32,1); и Давид:«Я помазал Царя Моего над Сионом»(Пс. 2,6).'
      cn: 「国民」是指那些恨恶祂的犹太人。「祂说，『他们也看见了，又恨恶我，也恨恶我的父』」（伊鄂昂福音 15:24）。他们不愿祂作他们的王。因此，他们摒弃祂的王权，对彼拉多说：「我们没有王」；又说：「不要写『犹太人的王』」（伊鄂昂福音 19:15, 21）。然而，匝哈利亚却呼喊：「锡安的民哪，应当大大喜乐……看哪，你的王来到你这里，祂是公义的，并且施行拯救」（匝哈利亚书 9:9）；以赛亚也说：「看哪，必有一位王凭公义掌权」（以赛亚书 32:1）；大卫也说：「我已经立我的君在锡安」（诗篇 2:6）。
  - type: paragraph
    text:
      ru: 'Иудеи возненавидели Господа, а Он рабам Своим дал десять мин.РабыЕго суть те, коим вверены служения в Церкви. Говорится, что их«десять», по причине совершенства церковного предстоятельства. Ибо порядок в Церкви имеет совершенное устроение предстоятелей, и не было нужды их ни больше, ни меньше. Например, мы видим в Церкви три следующие действия: очищение, просвещение и совершение, три и степени, между которыми разделены эти действия. Диаконы очищают оглашением и учением, пресвитеры просвещают крещением, архиереи на священные степени поставляют и совершают, то есть рукополагают. Видишь ли, степени соразмерены с действиями, и степеней предстоятелей ни больше, ни меньше? Этим-то рабам Господь раздает«десятьмин», то есть дарований, которые каждому даются на пользу (1Кор. 12, 7). Ибо всяк, кому вверено предстоятельство, хотя бы недостоин был, имеет дарование от самого помазания, и это есть поистине великое Таинство человеколюбия и Домостроительства Божия.'
      cn: 犹太人憎恨主，而祂却将十个「弥拿」给了祂的仆人。祂的仆人，就是那些在教会中被赋予服事职责的人。此处说他们是「十个」，是由于教会权柄的完善性。因为教会在前导者（即「权柄者」或「教会领袖」）的建制上是完善的，不多不少正合其需。例如，我们在教会中看到以下三种行动：洁净、光照和成全，这三种行动被分配到三个等级之间。执事通过宣讲和教导来洁净（慕道者），长老通过洗礼来光照（信徒），而主教则通过设立神圣的等级来成全，即按立（圣职）。你是否看到，这些等级与行动是相称的，并且前导者的等级不多也不少？主正是将「十个弥拿」，即恩赐，分给了这些仆人，这些恩赐是为着众人的益处而分赐给每个人的（哥林多前书 12:7）。因为凡被赋予权柄的人，即使不配，也因其受膏本身而拥有恩赐，这确实是人道主义和上帝经纶的一项伟大的奥秘。
  - type: paragraph
    initial:
      ru: 'Лк 19:15. '
      cn: （路加福音 19:15）
    text:
      ru: И когда возвратился, получив царство, велел призвать к себе рабов тех, которым дал серебро, чтобы узнать, кто что приобрел.
      cn: 彼得国而返、命呼予银之我诸仆来、欲知各获利几何、
  - type: paragraph
    initial:
      ru: 'Лк 19:16. '
      cn: （路加福音 19:16）
    text:
      ru: 'Пришел первый и сказал: господин! мина твоя принесла десять мин.'
      cn: 第一者来至、曰、主欤、以尔斤、获十斤、
  - type: paragraph
    initial:
      ru: 'Лк 19:17. '
      cn: （路加福音 19:17）
    text:
      ru: 'И сказал ему: хорошо, добрый раб! за то, что ты в малом был верен, возьми в управление десять городов.'
      cn: 彼对曰、美哉、善仆欤、尔于小者忠、可宰十城、
  - type: paragraph
    initial:
      ru: 'Лк 19:18. '
      cn: （路加福音 19:18）
    text:
      ru: 'Пришел второй и сказал: господин! мина твоя принесла пять мин.'
      cn: 其次者来至、曰、主欤、以尔斤、获五斤、
  - type: paragraph
    initial:
      ru: 'Лк 19:19. '
      cn: （路加福音 19:19）
    text:
      ru: 'Сказал и этому: и ты будь над пятью городами.'
      cn: 彼对之曰、尔亦可宰五城、
  - type: paragraph
    text:
      ru: «Когда возвратится»Христос, благородный и по человечеству (ибо Господь происходил из царского рода) и по Божеству, во второе Свое пришествие, когда Он явится с апостолами Царем, грядущим во славе Отца, и когда поклонится пред Ним всякое колено, тогда точно потребует отчета и от рабов, кои получили дарования. Открывается, что один принес пользу многим и умножил дарование в десять раз; другой также принес пользу, но меньшему числу; а третий решительно никому не был полезен, но время деятельности провел в праздности. Поэтому тот, кто принятое им умножил в десять раз, поставляется над десятью городами, то есть получает власть над десятью городами, следовательно, во много раз награждается. Сообразную награду получает и следующий за ним. А тот, который не принес никакой прибыли, осуждается.
      cn: '「当祂复返之时」——这里的「基督」，无论就人性而言（因为主出身于王室），还是就神性而言，都是尊贵的。祂的第二次降临，将与使徒们一同显现为君王，在父的荣耀中降临，届时万膝都将跪拜在祂面前。那时，祂必将要求那些领受了恩赐的奴仆们交账。


        揭示出：有一个奴仆使许多人受益，并将恩赐增添了十倍；另一个奴仆也使人受益，但数量较少；而第三个奴仆则果断地对任何人都没有益处，他将活动的时间虚度于怠惰之中。


        因此，那个将所领受的恩赐增添了十倍的人，被立于十座城池之上，也就是说，获得了管辖十座城池的权柄，从而获得了多倍的赏赐。紧随其后的人也获得了相应的赏赐。而那个没有带来任何利润的人，则被定罪了。'
  - type: paragraph
    initial:
      ru: 'Лк 19:20. '
      cn: （路加福音 19:20）
    text:
      ru: 'Пришел третий и сказал: господин! вот твоя мина, которую я хранил, завернув в платок,'
      cn: 又其他者来至、曰、主欤、顾尔之斤、我以巾包而藏之、
  - type: paragraph
    text:
      ru: Посмотрим, что он говорит:«господин! вот твоя мина», возьми ее;«я хранил ее, завернув в платок». На главу Господа умершего положен был плат (Ин. 20, 7), и лицо Лазаря во гробе обвязано было платком (Ин. 11, 44). Поэтому нерадивец сей справедливо говорит, что он завернул дарование в платок. Ибо, сделав оное мертвым и бездейственным, он употребления из него не сделал и прибыли не принес.
      cn: 我们来看他说了什么：「主啊！看，这是你的米纳，」拿回去吧；「我将它包在手巾里收藏着。」一块布曾被放在已故主（耶稣）的头上（伊鄂昂福音 20:7），拉撒路在坟墓里的脸也被手巾包裹着（伊鄂昂福音 11:44）。因此，这个不负责任的人公正地宣称，他将恩赐包在了手巾里。因为，他使恩赐变得死寂且无作用，所以他没有使用它，也没有带来任何利润。
  - type: paragraph
    initial:
      ru: 'Лк 19:21. '
      cn: （路加福音 19:21）
    text:
      ru: 'ибо я боялся тебя, потому что ты человек жестокий: берешь, чего не клал, и жнешь, чего не сеял.'
      cn: 因尔为人甚严厉、我惧怕尔、尔未置者取之、尔未播者获之、
  - type: paragraph
    text:
      ru: '«Ибо я боялся тебя,– говорит, –потому..., что ты берешь, чего не клал». Многие отзываются таким предлогом. Не желая быть кому-нибудь полезными, они говорят: где Бог не посеял даровитости и способности, там не ищи жатвы. Такого-то Он не создал даровитым и способным к научению: что же от меня требовать пользы ему?'
      cn: 「因为我惧怕你，——他言道，——乃是因……你拿取你未曾放置的。」许多人用这种借口推脱。他们不愿对任何人生出益处，便说：上帝未曾播下天赋与能力之处，就不要寻求收割。某某人祂未曾创造得有天赋、有能力去受教：那么，为何要向我要求他得到益处呢？
  - type: paragraph
    initial:
      ru: 'Лк 19:22. '
      cn: （路加福音 19:22）
    text:
      ru: 'Господинсказал ему: твоими устами буду судить тебя, лукавый раб! ты знал, что я человек жестокий, беру, чего не клал, и жну, чего не сеял;'
      cn: 彼语之曰、恶哉、仆也、依尔口判尔、尔既知我乃严厉人、我未置者取之、我未播者获之、
  - type: paragraph
    initial:
      ru: 'Лк 19:23. '
      cn: （路加福音 19:23）
    text:
      ru: для чего же ты не отдал серебра моего в оборот, чтобы я, придя, получил его с прибылью?
      cn: 何不以我银寄诸兑钱肆、然我来时、可幷其利而取之、
  - type: paragraph
    text:
      ru: 'Поэтому и Господь говорит: ты учи и отдай серебро Мое труженикам, то есть всем людям, назначенным для получения пользы. Ибо каждый человек поставлен от Бога торжником, чтобы в великой рабочей мира сего делать обороты. И«чтобы я, придя, получил его с прибылью», то есть вытребовал бы обратно с прибылью. Нам должно делать свое дело, а о последующем Бог будет судить тех, кои не пожелают воспользоваться.'
      cn: '因此，主也这样说：你当施教，并将我的银子交给那些劳力者，也就是所有被指派去获取益处的人。因为每一个人都蒙上帝安置为兑钱肆的钱商，好让他们在世间这份伟大的工作中周转运作。


        「以便我来时，可并其利而取之」，也就是说，为了能够连本带利地索要回来。


        我们应当做好自己的本分，至于后续，上帝将审判那些不愿利用之人。'
  - type: paragraph
    initial:
      ru: 'Лк 19:24. '
      cn: （路加福音 19:24）
    text:
      ru: 'И сказал предстоящим: возьмите у него мину и дайте имеющему десять мин.'
      cn: 遂命前立者曰、夺其一斤、而予有十斤者、
  - type: paragraph
    initial:
      ru: 'Лк 19:25. '
      cn: （路加福音 19:25）
    text:
      ru: 'И сказали ему: господин! у него есть десять мин.'
      cn: 彼等曰、主欤、其已有十斤、
  - type: paragraph
    initial:
      ru: 'Лк 19:26. '
      cn: （路加福音 19:26）
    text:
      ru: Сказываю вам, что всякому имеющему дано будет, а у неимеющего отнимется и то, что имеет;
      cn: 我诚告尔等、凡有者将予之、无有者并其所有者亦将夺之、
  - type: paragraph
    text:
      ru: 'Дарование отнимается и дается доброму делателю. Хотя он и имеет, но поэтому-то самому ему полезно получить больше.«Имеющему дано будет», то есть кто чрез хорошие обороты составил богатые средства, тому дано будет и больше. Ибо, если он малое увеличил в десять раз, то, очевидно, удесятерив большее, доставит господину еще больше прибыли. А от нерадивого и ленивого, и не постаравшегося принятое им умножить, и то самое, что он имеет, возьмется, чтобы не лежало без пользы имение господина, когда оно может быть отдано другому и во много раз увеличено. Мы понимаем это не о слове только и учении, но и о нравственных добродетелях. Ибо и в них Бог дал нам дарования, одному – поста, другому – милостыни, иному – кротости, иному – смирения. И если мы будем бодрствовать, то умножим сии дарования; если же будем небрежны и добровольно умрем, то впоследствии будем слагать вину на Бога, как обыкновенно мы говорим: что ж мне делать? если такой-то будет свят, то потому, что Бог благоволит ему, и он свят; а мне не благоволит, и я не свят; и тот был Петр, иной Павел. Безумный человек! Самая мина (данная тебе) делает тебя Петром и Павлом. Делай по силе и принеси что-нибудь Давшему, если не столько, сколько Петр и Павел: ибо они получили по мине, и ты – мину. И потом, нисколько не подвигнувшись на делание добра, ты обвиняешь Бога! Поэтому, оказываясь недостойными дарований, мы лишаемся оных.'
      cn: '恩赐被夺去，并赐予良善的行事者。虽然他已拥有，但正是因此，他获得更多对他有益。「凡有者将予之」，即是说，谁通过良好的周转积累了丰裕的资产，谁将获得更多。因为，如果他将微小之物增添了十倍，那么显然，他将更多之物也增添十倍，就能为主君带来更多的利润。至于不殷勤的、懒惰的、没有努力将所领受的增添的人，连他所拥有的那部分也要被取走，以避免主君的财产无益地闲置，因为这财产可以被交给另一个人，并成倍地增添。


        我们理解，这不仅关乎言语和教导，也关乎道德上的美德。因为在这些方面，上帝也赐予了我们恩赐：给一个人禁食的恩赐，给另一个人施舍的恩赐，给一个人温柔的恩赐，给另一个人谦卑的恩赐。如果我们保持警醒，我们就会增添这些恩赐；如果我们疏忽大意并自愿地死去，那么我们随后就会将罪责归咎于上帝，就像我们通常所说的那样：我该怎么办呢？如果某某人是圣洁的，那是因为上帝喜悦他，他才是圣洁的；但上帝不喜悦我，所以我不是圣洁的；那一位是彼得，另一位是保罗。


        愚昧的人啊！正是那枚弥那（赐予你的）使你成为彼得和保罗。尽你的能力去做，并向那赐予者献上一些东西，即使达不到彼得和保罗的程度：因为他们领受了一枚弥那，而你也领受了一枚弥那。然而，你随后却没有在行善上做出丝毫努力，却反倒指责上帝！因此，我们显出不配领受恩赐，我们就会失去它们。'
  - type: paragraph
    initial:
      ru: 'Лк 19:27. '
      cn: （路加福音 19:27）
    text:
      ru: врагов же моих тех, которые не хотели, чтобы я царствовал над ними, приведите сюда и избейте предо мною.
      cn: 至于我敌、不欲我君之者、可曳之来、诛于我前、
  - type: paragraph
    initial:
      ru: 'Лк 19:28. '
      cn: （路加福音 19:28）
    text:
      ru: Сказав это, Он пошел далее, восходя в Иерусалим.
      cn: 彼言毕、前行上耶鲁萨利木、
  - type: paragraph
    text:
      ru: «Врагов же моих– говорит, –тех,коине хотели, чтоб я царствовал над ними, приведите сюда и избейте предо мною», то есть иудеев, которых Он предаст погибели, послав их в огнь вечный. Да, несчастные и здесь, то есть в мире сем, они избиты были римскими войсками, и еще хранятся и будут храниться на избиение там.
      cn: 「至于我的仇敌——他说——就是那些不愿意我作他们的王的，把他们带到这里，在我面前杀戮。」 这指的是犹太人，祂将把他们交于灭亡，把他们送入永火之中。 是的，这些可怜人在此地，即在这个世界上，已经被罗马军队所杀戮，并且他们仍然被保留着，并将被保留着以待在那里的杀戮。
  - type: paragraph
    initial:
      ru: 'Лк 19:29. '
      cn: （路加福音 19:29）
    text:
      ru: И когда приблизился к Виффагии и Вифании, к горе, называемой Елеонскою, послал двух учеников Своих,
      cn: 〇彼既近微福斯发乞亚及微发尼亚、上橄榄山、即遣其门徒二人、
  - type: paragraph
    initial:
      ru: 'Лк 19:30. '
      cn: （路加福音 19:30）
    text:
      ru: 'сказав: пойдите в противолежащее селение; войдя в него, найдете молодого осла привязанного, на которого никто из людей никогда не садился; отвязав его, приведите;'
      cn: 曰尔等往直前之村、及入、遇见一小驴系焉、乃未经人骑之者、解之即牵来、
  - type: paragraph
    initial:
      ru: 'Лк 19:31. '
      cn: （路加福音 19:31）
    text:
      ru: 'и если кто спросит вас: зачем отвязываете? скажите ему так: он надобен Господу.'
      cn: 倘有人问尔等为何解之、应之曰、主需之、
  - type: paragraph
    initial:
      ru: 'Лк 19:32. '
      cn: （路加福音 19:32）
    text:
      ru: Посланные пошли и нашли, как Он сказал им.
      cn: 奉遣者往、果遇如彼所言者、
  - type: paragraph
    initial:
      ru: 'Лк 19:33. '
      cn: （路加福音 19:33）
    text:
      ru: 'Когда же они отвязывали молодого осла, хозяева его сказали им: зачем отвязываете осленка?'
      cn: 彼等解小驴之时、其主人向之曰、解小驴何为、
  - type: paragraph
    initial:
      ru: 'Лк 19:34. '
      cn: （路加福音 19:34）
    text:
      ru: 'Они отвечали: он надобен Господу.'
      cn: 对曰、主需之、
  - type: paragraph
    initial:
      ru: 'Лк 19:35. '
      cn: （路加福音 19:35）
    text:
      ru: И привели его к Иисусу, и, накинув одежды свои на осленка, посадили на него Иисуса.
      cn: 遂牵之就伊伊稣斯、以己衣置小驴上、扶伊伊稣斯乘之、
  - type: paragraph
    text:
      ru: 'Господь садится на осленка для двух целей в одно и то же время: во-первых, чтоб исполнить пророчество, глаголющее:«се Царь твой грядет», всед на подъяремника (Зах. 9,9); а во-вторых, чтобы образно дать нам знать, что Он покорит Себе новый, неочищенный и необузданный народ язычников. Судя по расстоянию пути, Господь, без сомнения, не нуждался в подъяремнике. Ибо, обойдя пешком всю Галилею и Иудею, как Он возымел нужду в осленке при переходе из Вифании в Иерусалим, где расстояние, как всем известно, незначительное? Итак, Он делает это, как я сказал, с таинственным смыслом. Осленок был привязан и имел много хозяев, но посланными, то есть апостолами, отвязывается. Это имеет такой смысл: Вифания, по толкованию, означаетдом послушания,а Виффагия –дом челюстей,место, приличное священникам. Ибо священникам давались челюсти, как предписано в Законе (Втор. 18,3). Челюстями обозначается учительское слово, которое растирают и утончают душевные челюсти. Итак, где дом учительского слова и покорности сему слову, туда посылаются ученики Господа и разрешают людей, связанных греховными сетями и многими житейскими заботами, и из рабов многих господ и богов делают их почитателями одного Господа Иисуса и одного Бога Отца. А где нет ни дома послушания, ни слово учительское не принимается, там ничего подобного не бывает, и осленок не отвязывается. Посланныхдвое.Сим означается, что приведению язычников ко Христу и покорности Ему служат два чина, пророки и апостолы. Приводят осленка из некоторого«селения»(деревни), чтобы мы знали, что народ языческий был в большой простоте и невежестве. Ибо он никогда не подчинялся ни Моисееву учению, ни пророческому, но он был необученный осленок. Если же, как сказал другой евангелист (Мф. 21, 15), и дети взывали:«осанна Сыну Давидову»,то и они могут означать тот же самый новый народ, который, веруя в Иисуса, явившегося плотью от семени Давидова, воссылал славу Богу, по написанному:«поколение грядущее восхвалит Господа»(Пс. 101, 19).'
      cn: '主在同一时间骑上小驴驹，是为了两个目的：第一，是为了应验那宣称的预言：「看哪，你的王来到」，骑在那驮物者之上（匝哈利亚书 9:9）；第二，是为了以象征的方式让我们知道，祂将使那新的、未受洁净的、未受约束的异教徒民族顺服于祂自己。


        根据路程的距离来判断，主无疑不需要那驮物者。因为祂曾步行走遍了整个加利利和犹太，祂又怎会在从伯大尼前往耶路撒冷的过渡中，需要一头小驴驹呢？那里的距离，正如众人所知，是微不足道的。因此，祂如此行，正如我所说的，是带着一个奥秘的意义。小驴驹曾被捆绑，有许多主人，但祂藉着那被差遣者，即使徒们，而被解开。


        这有如下的意义：根据诠释，伯大尼意指服从之家，而伯法其意指颚骨之家，这是一个适合于祭司们的地方。因为颚骨曾被给予祭司们，正如律法中所规定的（申命记 18:3）。颚骨象征着教导之言，是灵魂的颚骨将其研磨并使之精炼的。因此，在教导之言的家和对这言语的顺服之处，主的门徒们被差遣，去解开那些被罪恶的网罗和许多世俗的忧虑所捆绑的人们，并使他们从许多主人和神祇的奴仆，变成独一的主耶稣和独一的父神的敬拜者。然而，在既没有顺服之家，教导之言也不被接纳之处，就没有类似的事情发生，小驴驹也不会被解开。


        被差遣者有两位。这象征着，将异教徒引向基督并使他们顺服于祂，服务于两种品级，即先知们和使徒们。他们将小驴驹从某个「村庄」（乡村）带来，以便我们知道，异教徒民族曾处于极度的朴素和无知之中。因为他们从未顺服于摩西的教义，也从未顺服于先知的教导，而是一头未受训的小驴驹。


        然而，正如另一位传福音者所说（马太福音 21:15），如果连孩子们也呼喊：「和散那归于大卫的子孙」，那么他们也可能象征着那同一个新的民族，这个民族相信了凭着大卫的后裔以肉身显现的耶稣，并向上帝献上荣耀，正如所记载的：「将来的世代必赞美主」（诗篇 101:19）。'
  - type: paragraph
    initial:
      ru: 'Лк 19:36. '
      cn: （路加福音 19:36）
    text:
      ru: И, когда Он ехал, постилали одежды свои по дороге.
      cn: 彼行时、众以己衣铺道、
  - type: paragraph
    text:
      ru: Постилание одежд, кажется, то означает, что достойные воспевать Иисуса, совлекаясь ветхого человека, подстилают и подчиняют его Иисусу, чтобы, наступив на него, освятил его и чтобы плоть не восставала против духа, так чтобы и сами они могли сказать:«Покорись Господу и надейся на Него»(Пс. 36, 7).
      cn: 铺设衣裳，看来意味着：配得颂赞耶稣的人，当脱去旧人，将他铺设（于道上），使他臣服于耶稣，好让耶稣踏在他身上，使他成圣；如此，肉体就不会对抗灵，以致他们自己也能说：「你要平心静气地依顺主，并仰望他。」（诗篇 36:7）。
  - type: paragraph
    initial:
      ru: 'Лк 19:37. '
      cn: （路加福音 19:37）
    text:
      ru: А когда Он приблизился к спуску с горы Елеонской, всё множество учеников начало в радости велегласно славить Бога за все чудеса, какие видели они,
      cn: 〇彼已近橄榄山下路之时、门徒大众、为其所见之异能、喜而大声赞美上帝、
  - type: paragraph
    initial:
      ru: 'Лк 19:38. '
      cn: （路加福音 19:38）
    text:
      ru: 'говоря: благословен Царь, грядущий во имя Господне! мир на небесах и слава в вышних!'
      cn: 曰被福言者系因主名而来之王、在天安和、在上荣光、
  - type: paragraph
    text:
      ru: 'Говоря, что«все множество учеников»хвалило Бога, Лука называет учениками всех вообще последователей Иисуса, не двенадцать только и не семьдесят, но весь народ, который, или, нуждаясь в чудесах, или по временам увлекаясь учением, следовал за Иисусом. В том числе естественно замечались и дети, как передают прочие евангелисты (Мф. 21, 15). Движимые Богом, дети исповедуют Иисуса Царем, грядущим«во имя Господне», то есть Богом, и говорят:«мир на небесах». Иначе: прежняя вражда, которую мы имели с Богом, прекращена. Ибо не было на земле Царя-Бога. А теперь, когда Бог грядет по земле, поистине мир на небесах, и поэтому«слава в вышних», так как и Ангелы прославляют то единодушие и примирение, которое даровал нам едущий на осле Царь и Бог. Ибо то самое, что на земле является истинный Бог и ходит в нашей стране, стране врагов Своих, показывает, что между Им и нами заключено примирение.'
      cn: 路加称赞美上帝的「所有门徒群体」，是泛指所有跟随耶稣的人，不单指十二使徒，也不单指七十使徒，而是指全部民众——他们或因需要神迹，或时而为教导所吸引，从而跟随耶稣。在其中，自然也注意到了孩童，正如其他福音书作者所记述的（马太福音 21:15）。在上帝的感动下，孩童们承认耶稣是君王，是「奉主名而来」的，即是上帝，并说：「在天安和」（或作：天上的和平）。换言之：我们从前与上帝所存的敌意，已然止息。因为地上不曾有过君王——上帝。而如今，当上帝在地上降临，在天实有安和，因此「荣光在至高之处」，因为天使们也颂赞那乘驴而来的君王与上帝所赐予我们的同心合意与和解。因为真正的上帝出现在地上，并在我们的境内，即祂的仇敌的境内行走，这件事本身就表明了祂与我们之间已达成和解。
  - type: paragraph
    initial:
      ru: 'Лк 19:39. '
      cn: （路加福音 19:39）
    text:
      ru: 'И некоторые фарисеи из среды народа сказали Ему: Учитель! запрети ученикам Твоим.'
      cn: 民中有发利些乙数人向彼曰、师欤、禁尔门徒、
  - type: paragraph
    initial:
      ru: 'Лк 19:40. '
      cn: （路加福音 19:40）
    text:
      ru: 'Но Он сказал им в ответ: сказываю вам, что если они умолкнут, то камни возопиют.'
      cn: 彼答之曰、我告尔等、若彼等缄默、则石将发声而呼、
  - type: paragraph
    text:
      ru: 'Фарисеи роптали на то, что народ называл Иисуса Царем и восхвалял Его как Бога; ибо (по их мнению) торжественное усвоение Ему имени Царя было знаком возмущения и хулы на Господа. Но Иисус говорил:«если они умолкнут,... камни возопиют». Или: люди говорят сие не из угождения Мне, но произносят это славословие потому, что их убеждают к этому и побуждают все те знамения и силы, какие они видели.'
      cn: 法利赛人抱怨民众称呼耶稣为君王，并将祂颂赞为上帝；因为（在他们看来）庄严地将君王之名归于祂，是叛乱的标记，也是对主的亵渎。但是，耶稣说：「如果他们缄默……石头会呼喊。」 亦即：人们说这些话并非出于讨好我，而是因为他们所见的一切神迹与能力，使他们被说服并被激励，从而发出这赞美之辞。
  - type: paragraph
    initial:
      ru: 'Лк 19:41. '
      cn: （路加福音 19:41）
    text:
      ru: И когда приблизился к городу, то, смотря на него, заплакал о нем
      cn: 既近、见城、为之哭曰、
  - type: paragraph
    text:
      ru: Господь, как человеколюбивый, плачет о городе; ибо не желал погибели жителей оного за дерзкий против Него поступок. Итак, плачем Он обнаруживает сострадательное сердце. А что Он жалел их и не только прежде распятия, но и после распятия, жаждал их обращения, это видно из того, что Он предал их римлянам спустя столько лет, ибо протекло тридцать пять лет. Без сомнения, Он отлагал наказание не по другому чему, как по сильному желанию их обращения.
      cn: 主，作为爱人类者，为这座城哭泣；因为祂不愿那里（城）的居民因着对祂的傲慢之举而灭亡。因此，祂借着哭泣显露出怜悯之心。而祂怜惜他们，不仅在祂被钉十字架之前，甚至在祂被钉十字架之后，仍渴望他们悔改，这一点从祂在许多年之后才将他们交予罗马人一事中可见，因为其间流逝了三十五年。毫无疑问，祂之所以推迟惩罚，并非出于别的原因，而是出于渴望他们悔改的强烈愿望。
  - type: paragraph
    initial:
      ru: 'Лк 19:42. '
      cn: （路加福音 19:42）
    text:
      ru: 'и сказал: о, если бы и ты хотя в сей твой день узнал, что служит к миру твоему! Но это сокрыто ныне от глаз твоих,'
      cn: 若尔于尔之斯日、而知所关于尔之安和耶、然今日此隐于尔目矣、
  - type: paragraph
    initial:
      ru: 'Лк 19:43. '
      cn: （路加福音 19:43）
    text:
      ru: ибо придут на тебя дни, когда враги твои обложат тебя окопами и окружат тебя, и стеснят тебя отовсюду,
      cn: 盖日将临于尔、尔诸敌将筑垒围尔、四面攻尔、
  - type: paragraph
    initial:
      ru: 'Лк 19:44. '
      cn: （路加福音 19:44）
    text:
      ru: и разорят тебя, и побьют детей твоих в тебе, и не оставят в тебе камня на камне, за то́, что ты не узнал времени посещения твоего.
      cn: 毁坏尔、灭亡尔之诸子、且于尔中不遗一石于石上、因尔不知眷顾尔之时、
  - type: paragraph
    text:
      ru: 'Итак, Он плачет о бесчувственности Иерусалима и говорит:«о, если бы и ты хотя в сей твой день узнал, что служит к миру твоему». То есть, о если бы ты хотя ныне узнал, что служит к твоей пользе и ведет к миру и спокойствию, именно: что нужно уверовать в Меня и удалиться от злого умысла против Меня! А теперь сокрыто от очей твоих то, что на тебя придут нестерпимые бедствия за твое отвержение Меня и что ты потерпишь вот то и то за то, что не уразумел«времени посещения»твоего, то есть Моего явления, когда Я пришел посетить тебя и спасти. Итак, тебе должно было узнать, что служит к твоему благосостоянию, то есть уверовать в Меня, и ты был бы безопасен со стороны римлян и свободен от всякого повреждения. Ибо все уверовавшие во Христа остались свободными от плена, так что если бы все уверовали, то никто и не попался бы в плен.'
      cn: 因此，祂为耶路撒冷的麻木不仁而哭泣并说道：「巴不得你在这你日子，知道关于你平安的事。」亦即，哦，巴不得你虽然是现在，能够知道什么服事于你的益处，并引向平安与宁静，亦即：必须信仰我，并远离图谋反抗我的邪恶意图！而现在，那对你而言是隐蔽的，就是那不可忍受的灾祸将因你弃绝我而降临于你，并且你将遭受这这那那，因为你没有明白你「眷顾之时」，亦即我的显现，当我来眷顾你并拯救你的时候。因此，你本该知道服事于你的福祉之事，亦即信仰我，而你就会在罗马人那边是安稳的，并且免于任何损伤。因为所有信仰了基督的人都免于被掳，所以如果所有人都信仰了，那么就根本没有人会落入被掳了。
  - type: paragraph
    initial:
      ru: 'Лк 19:45. '
      cn: （路加福音 19:45）
    text:
      ru: И, войдя в храм, начал выгонять продающих в нем и покупающих,
      cn: 〇彼入殿、逐出在其中贸易者、
  - type: paragraph
    initial:
      ru: 'Лк 19:46. '
      cn: （路加福音 19:46）
    text:
      ru: 'говоря им: написано: дом Мой есть дом молитвы, а вы сделали его вертепом разбойников.'
      cn: 谓之曰、经载我室称为祈祷之室、尔曹以之为盗贼之巢窟、
  - type: paragraph
    initial:
      ru: 'Лк 19:47. '
      cn: （路加福音 19:47）
    text:
      ru: И учил каждый день в храме. Первосвященники же и книжники и старейшины народа искали погубить Его,
      cn: 彼日日在殿中教训、诸司祭首学士及民之长老等谋求灭亡之、
  - type: paragraph
    initial:
      ru: 'Лк 19:48. '
      cn: （路加福音 19:48）
    text:
      ru: и не находили, что бы сделать с Ним; потому что весь народ неотступно слушал Его.
      cn: 无可寻求何以行之、因诸民跟守听之、
- type: heading1
  text:
    ru: Глава двадцатая
    cn: 第二十章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 20:1. '
      cn: （路加福音 20:1）
    text:
      ru: В один из тех дней, когда Он учил народ в храме и благовествовал, приступили первосвященники и книжники со старейшинами,
      cn: 〇一日、彼在殿中教训民传福音时、诸司祭首及学士偕长老等来就之、
  - type: paragraph
    initial:
      ru: 'Лк 20:2. '
      cn: （路加福音 20:2）
    text:
      ru: 'и сказали Ему: скажи нам, какою властью Ты это делаешь, или кто дал Тебе власть сию?'
      cn: 曰、请告我等、尔以何权行此、或赐尔此权者谁乎、
  - type: paragraph
    text:
      ru: 'Господь, со славой вошедший во Иерусалим, в доказательство Своей власти творит то, что дом Отца Своего очищает от торгашей (Лк 19, 45–46). Он сделал это и в начале проповеди, как говорит евангелист Иоанн (Ин. 2, 13–18). А теперь снова делает то же, во второй раз. Это служит к большему обвинению иудеев, что они не уцеломудрились от первого Его открытого вразумления, но продолжали торговать в храме и называли Его противником Божиим, тогда как Он почитает Отца и Бога до такой степени, что дом Его очищает от торгашей. В обличение их Он приводит и слова Исаии:«дом Мой назовется домом молитвы»(Ис. 56, 7). А они безумно спрашивают Его:«какою властью Ты это делаешь?»Однако же им можно было понять, что поскольку Он привел слова пророка во свидетельство, что дом Божий есть дом молитвы, а не торжище и вертеп разбойников (ибо любостяжание и торгашество свойственны разбойникам), то какая же, наконец, нужда спрашивать Его, какой властью Он это делает, когда можно прямо заключить, что так повелевает Бог чрез пророка? А они спрашивают:«какою властью Ты это делаешь»? Закон, – говорят, – распоряжаться в храме предоставил происходящим от Левии, как же Ты, не происходящий от Левиина колена, делаешь это и похищаешь священные права? Но, о иудеи, вспомните слова Давида:«Ты священник вовек по чину Мелхиседека»(Пс. 109, 4). Мелхиседек назван священником. А Мелхиседек не был священником ни по Закону, ни по происхождению от Левиина колена. Ибо как быть сему, когда он за столь много лет был прежде Левия? Потом, с чего ты требуешь от Христа порядка законного? Бог законам не подлежит. Когда нужно было, Он повелел, чтобы священники были из колена Левиина, а теперь отменяет тот закон и предызбирает священство Мелхиседека. Поэтому и продающих жертвенных животных, как-то: овец и голубей, Он выгоняет, с одной стороны, чтоб сохранить благолепие и благоприличие храма, а с другой, чтоб и то показать, что не должно уже веровать в умилостивление Бога жертвами животными. Итак, Господу легко было ответить им, что «так сказано», и сказать, что так повелевает пророк, или лучше, Бог.'
      cn: 主（Господь）带着荣耀进入耶路撒冷，为了证明祂的权柄，祂洁净了祂父的家，将商贩驱逐出去（路加福音 19:45-46）。正如传福音者伊鄂昂所言（伊鄂昂福音 2:13–18），祂在讲道之初就曾做过此事。而现在祂第二次又做此事。这更进一步地指控了犹太人，因为他们没有因祂第一次公开的劝诫而有所悔改，反而继续在圣殿中进行贩卖，并称祂为上帝的反对者，然而祂对父和上帝的尊敬达到了这样的程度：祂将祂的家从商贩中洁净出来。为了指责他们，祂还引用了以赛亚的话：「我的殿必称为祷告之殿」（以赛亚书 56:7）。然而他们却愚昧地问祂：「你凭什么权柄做这些事？」然而，他们本可以理解，既然祂引用了先知的话作证，说明上帝的殿是祷告之殿，而不是集市和强盗的巢穴（因为贪婪和贩卖是强盗的习性），那么他们最终又有什么必要去问祂是凭着什么权柄做这些事呢？因为可以直接断定，这是上帝借着先知所吩咐的啊！可他们却问：「你凭什么权柄做这些事？」他们说，律法规定只有利未支派的人才能在圣殿中行使职权，而你并非出自利未支派，你怎敢做此事并窃取神圣的权利呢？但是，噢，犹太人啊，请记住大卫的话：「你永远为祭司，是照着麦基洗德的等次」（诗篇 109:4）。麦基洗德被称为祭司。然而麦基洗德既非凭律法，也非凭着出自利未支派而成为祭司。因为这怎么可能呢？他比利未早了那么多年啊！其次，你为什么要向基督要求律法的秩序呢？上帝不受律法的约束。在需要的时候，祂曾吩咐祭司要出于利未支派，而现在祂废除了那律法，预选了麦基洗德的祭司职分。因此，祂将贩卖祭祀牲畜，如绵羊和鸽子的人赶出去，一方面是为了维护圣殿的美丽和体面，另一方面也是为了表明：不应再相信用牲畜祭品来取悦上帝。因此，主本可以很容易地回答他们说：「经文是这样说的」，并说这是先知所吩咐的，或者更准确地说，是上帝所吩咐的。
  - type: paragraph
    initial:
      ru: 'Лк 20:3. '
      cn: （路加福音 20:3）
    text:
      ru: 'Он сказал им в ответ: спрошу и Я вас об одном, и скажите Мне:'
      cn: 对之曰、我亦有一言问尔、而尔等告我、
  - type: paragraph
    initial:
      ru: 'Лк 20:4. '
      cn: （路加福音 20:4）
    text:
      ru: крещение Иоанново с небес было, или от человеков?
      cn: 伊鄂昂之授洗自天乎、抑自人乎、
  - type: paragraph
    initial:
      ru: 'Лк 20:5. '
      cn: （路加福音 20:5）
    text:
      ru: 'Они же, рассуждая между собою, говорили: если скажем: с небес, то скажет: почему же вы не поверили ему?'
      cn: 伊等互相窃议曰、若云自天、彼必曰、尔等何为不信之、
  - type: paragraph
    initial:
      ru: 'Лк 20:6. '
      cn: （路加福音 20:6）
    text:
      ru: 'а если скажем: от человеков, то весь народ побьет нас камнями, ибо он уверен, что Иоанн есть пророк.'
      cn: 若云自人、众民必以石击我等、然伊鄂昂显为先知也、
  - type: paragraph
    initial:
      ru: 'Лк 20:7. '
      cn: （路加福音 20:7）
    text:
      ru: 'И отвечали: не знаем откуда.'
      cn: 对曰、我等不知奚自、
  - type: paragraph
    initial:
      ru: 'Лк 20:8. '
      cn: （路加福音 20:8）
    text:
      ru: 'Иисус сказал им: и Я не скажу вам, какою властью это делаю.'
      cn: 伊伊稣斯语之曰、我绝不告尔、我以何权行此、
  - type: paragraph
    text:
      ru: Однако ж, чтоб обличить их в постоянном противлении Духу Святому и в том, что они не хотели веровать не только древнему пророку Исаии, быть может, ими и забытому, но и так недавно явившемуся, почти невещественному и бесплотному Иоанну, для сего на вопрос их со своей стороны дает им настоящий, достойный удивления, вопрос. Сим вопросом Он и им заграждает уста, и нам показывает, что если они не поверили такому пророку, каков Иоанн, по их мнению больший Его, когда сей свидетельствовал о Нем, то как же поверили бы они Его ответу на то, какой властью Он это делает? Ибо, что бы Он ни сказал, они, во всяком случае, могли перетолковать это и осмеять, подобно тому, как они презрели и слова Иоанна, бывшего у них в большой славе.
      cn: 然而，为要揭露他们持续地抵挡圣灵，以及他们不愿相信：不仅是古老的先知以赛亚（也许他们甚至已经遗忘了他），还有那如此近来才显现的、几乎是无形质和无肉体的伊鄂昂——为此，针对他们的问题，祂反过来给予他们一个当下（实在）、值得惊叹的问题。藉着这个问题，祂既堵住了他们的口，也向我们表明：既然他们不相信像伊鄂昂这样一位先知（按他们看来，伊鄂昂比祂更大）为祂作的见证，那么他们又怎会相信祂关于祂是凭何权柄行事的回答呢？因为，无论祂说什么，他们无论如何都可以曲解并嘲笑，正如他们轻蔑了在他们中享有盛誉的伊鄂昂的言语一样。
  - type: paragraph
    initial:
      ru: 'Лк 20:9. '
      cn: （路加福音 20:9）
    text:
      ru: 'И начал Он говорить к народу притчу сию: один человек насадил виноградник и отдал его виноградарям, и отлучился на долгое время;'
      cn: 〇乃向民言起此譬语曰、有人树葡萄园、而托之予园丁、即他往许久、
  - type: paragraph
    text:
      ru: 'Притча сия кратка, но научает нас многому и великому, именно: что Бог имел и доказал особенное промышление об евреях, что они издавна склонны к убийству, что один Бог Ветхого и Нового Завета, что язычники будут введены, а иудеи отвергнуты. Виноградник есть самая церковь иудейская, виноградари книжники и фарисеи, эти передовые люди и приставники народные. Или: каждый сам по себе есть виноградник и виноградарь, ибо каждый из нас возделывает самого себя. Человеколюбец, отдав этот виноградник делателям,«отлучился», то есть оставил их действовать по собственному их произволу.'
      cn: 该段文本所对应的经文是：路加福音 20:9这寓言虽然简短，却教导了我们诸多伟大的事，即：上帝曾对犹太人怀有并证明了特别的眷顾；他们自古以来就倾向于谋杀；新旧约的上帝是同一位；外邦人将被引入，而犹太人将被摒弃。葡萄园就是犹太教会本身，园丁是文士和法利赛人，这些是民族的领袖和管理者。或者说：每个人自己就是葡萄园和园丁，因为我们每个人都在耕耘他自己。这位爱人者，将这葡萄园交给做工的人之后，「离开了」，也就是说，他任凭他们按照自己的意愿行事。
  - type: paragraph
    initial:
      ru: 'Лк 20:10. '
      cn: （路加福音 20:10）
    text:
      ru: и в свое время послал к виноградарям раба, чтобы они дали ему плодов из виноградника; но виноградари, прибив его, отослали ни с чем.
      cn: 及期、遣其仆就园丁、为其由葡萄园之果予彼、园丁扑之、而使其空返、
  - type: paragraph
    initial:
      ru: 'Лк 20:11. '
      cn: （路加福音 20:11）
    text:
      ru: Еще послал другого раба; но они и этого, прибив и обругав, отослали ни с чем.
      cn: 复遣他仆、伊等亦扑之、且辱之、使其空返、
  - type: paragraph
    initial:
      ru: 'Лк 20:12. '
      cn: （路加福音 20:12）
    text:
      ru: И еще послал третьего; но они и того, изранив, выгнали.
      cn: 复遣第三者、伊等伤之而逐出、
  - type: paragraph
    text:
      ru: Он посылает разных «рабов», то есть пророков, чтоб иметь хотя малую какую-нибудь прибыль; ибо желал, сказано, получить«плодов», а не все плоды. Какой же от нас Богу плод, как только не Его познание? И оно есть нам прибыток; однако ж Он спасение наше и нашу пользу поставляет Своими. Злые делатели причиняли обиды посланным, избивали их и отсылали ни с чем, то есть дошли до такой неблагодарности, что не только уклонились от добра и не дали никакого доброго плода, но и зло совершили, что заслуживает большего наказания.
      cn: 他派遣不同的「仆人」，也就是先知们，好能获得哪怕一点微小的收益；因为，经上说，他希望得到「果实」，而不是所有的果实。我们能献给上帝的果实，除了认识祂之外，还能是什么呢？而这对我们来说就是所得的利益；然而，祂却将我们的救恩和我们的益处视为祂的益处。邪恶的佃户们侮辱了那些被派遣来的人，殴打他们，并让他们空手而回，也就是说，他们达到了如此不知感恩的地步，不仅躲避了良善，没有献出任何良善的果实，反而还行了恶事，这理应受到更大的惩罚。
  - type: paragraph
    initial:
      ru: 'Лк 20:13. '
      cn: （路加福音 20:13）
    text:
      ru: 'Тогда сказал господин виноградника: что мне делать? Пошлю сына моего возлюбленного; может быть, увидев его, постыдятся.'
      cn: 葡萄园之主人曰、我将何为、我遣我至爱子、或伊等见而愧怍之、
  - type: paragraph
    initial:
      ru: 'Лк 20:14. '
      cn: （路加福音 20:14）
    text:
      ru: 'Но виноградари, увидев его, рассуждали между собою, говоря: это наследник; пойдем, убьем его, и наследство его будет наше.'
      cn: 然园丁见之、相议曰、此乃嗣业者、往而杀之、业则属我矣、
  - type: paragraph
    text:
      ru: 'После того, как пророки перенесли такое ужасное зло, посылается Сын.«Может быть,– говорит, –постыдятся»Сына Моего. Говорит«постыдятся»не потому, будто не знает будущего, именно: что с Ним поступят гораздо хуже, чем с пророками, но потому, что так должно было быть, именно: они должны были устыдиться Его. Если же они до того были бесстыдны, что и убили Его, то это служит к большему их обвинению, потому что и после того, как Бог высказал, что хорошо было устыдиться Сына, они положили приговор противный. Такой оборот речи находится во многих местах Писания, например:«Может быть,... послушают»(Иер. 26, 3);«будут ли они слушать»(Иез. 2:5, 3:11)? В этих местах Бог говорит так не по незнанию будущего, но для того употребляет такой образ выражений, чтобы кто не сказал, что предвидение Божие было необходимой причиной непослушания.'
      cn: '在先知们忍受了如此可怖的恶行之后，圣子被差遣了。经文说：「也许他们会尊敬（马可福音 12:6）」我的儿子。祂说「尊敬」，并非因为祂不知道未来，即不知道他们对祂的对待会比对先知们更加恶劣，而是因为事情本应如此，即他们理应尊敬祂。倘若他们竟然无耻到连祂也杀了，这只会成为对他们更大的控告，因为即使在上帝表明「尊敬圣子乃是善行」之后，他们仍然作出了与之相反的判决。


        这种言辞的转折在圣经的许多地方都可以找到，例如：「或许他们会听从（耶利米书 26:3）」；「他们是听从呢，还是不听从呢（以西结书 2:5，3:11）？」在这些地方，上帝如此说话并非出于对未来的无知，而是为了采用这样一种表达方式，以免有人说上帝的预见是他们不顺服的必然原因。'
  - type: paragraph
    initial:
      ru: 'Лк 20:15. '
      cn: （路加福音 20:15）
    text:
      ru: И, выведя его вон из виноградника, убили.
      cn: 乃曳之出葡萄园外、而杀之、葡萄园主人将何以处之、
  - type: paragraph
    text:
      ru: '«Убили"Сына,«выведя его вон из виноградника». Удобно можно сказать: вон из Иерусалима; ибо Христос«вне врат»пострадал (Евр. 13, 12). Но поскольку выше под виноградником мы разумели народ, а не Иерусалим, то едва ли не ближе к делу сказать, что народ хотя убил Его, но вне виноградника, то есть не своеручно нанес Ему смерть, а предав Его Пилату и язычникам. Итак, Господь пострадал вне виноградника, то есть не от рук народа, ибо ему нельзя было никого убивать, поэтому Он умер от рук воинов. Некоторые под виноградником разумели Писания. Итак, Господь пострадал вне Писаний, то есть Его убили неверующие Моисею. Ибо если бы веровали Моисею и обращались в Писаниях, исследуя оные, то не убили бы Владыку Писаний.'
      cn: 「他们杀害了『子』，是『将祂曳出葡萄园外』。」可以贴切地说：是指出了耶路撒冷城外；因为基督是在「营外」受苦（希伯来书 13:12）。但是，鉴于我们在上文将葡萄园理解为百姓，而非耶路撒冷，那么说百姓虽然杀害了祂，却是在葡萄园外，即不是亲手致祂于死地，而是将祂交给了彼拉多和外邦人，或许更贴近本意。因此，主是在葡萄园外受苦，即不是死于百姓之手，因为百姓不能杀任何人，所以祂是死于兵士之手。有些人将葡萄园理解为《圣经》诸卷。因此，主是在《圣经》诸卷之外受苦，即是那些不信摩西的人杀害了祂。因为如果他们相信摩西，并在《圣经》诸卷中研读、查考它们，他们就不会杀害《圣经》诸卷的主宰。
  - type: paragraph
    text:
      ru: Что же сделает с ними господин виноградника?
      cn: 那么，葡萄园的主人将如何处置他们呢？
  - type: paragraph
    initial:
      ru: 'Лк 20:16. '
      cn: （路加福音 20:16）
    text:
      ru: Придет и погубит виноградарей тех, и отдаст виноградник другим.
      cn: 必来而灭亡该园丁、以葡萄园托付予他人、闻者曰、愿无有哉、
  - type: paragraph
    text:
      ru: 'Сказав это, присовокупляет и тот приговор, который имеет произнести над ними, именно: что«отдаст виноградник другим», то есть другим даст ту благодать, чтоб называться Моим народом. Смотри: те, кои говорят, что виноградник означает Писание, кажется, ближе угадывают смысл, как отсюда оказывается. Ибо Писание, отобранное от евреев, передано нам. А иной смелый, пожалуй, скажет, что виноградник есть все духовное, заключается ли оно в Писании и законах, или в деяниях и историях, чего всего иудеи лишились, а мы тем наслаждаемся.'
      cn: 说了这话，他随即加上了那个判决，就是他将要对他们宣判的，确切地说，就是「必将葡萄园交给别人」，也就是说，他将那被称为我子民的恩典赐予了别人。看哪：那些说葡萄园意指《圣经》的人，似乎更接近于猜中其义，如同由此所显明的那样。因为《圣经》从犹太人那里被夺走，而传给了我们。而或许，另有大胆之人会说，葡萄园就是所有属灵之物，无论是包含在《圣经》和律法之中，还是包含在事迹和历史之中，犹太人失去了所有这一切，而我们却在享受它们。
  - type: paragraph
    initial:
      ru: 'Лк 20:16. '
      cn: （路加福音 20:16）
    text:
      ru: 'Слышавшие же это сказали: да не будет!'
      cn: 必来而灭亡该园丁、以葡萄园托付予他人、闻者曰、愿无有哉、
  - type: paragraph
    text:
      ru: 'Как слышишь, евангелист Лука говорит, что Господь сказал сии слова: господин виноградника погубит неблагодарных виноградарей и отдаст виноградник другим, и что фарисеи, услышав сие, сказали:«да не будет!». А евангелист Матфей говорит иначе, именно: Господь спросил, что сделает с виноградарями теми хозяин виноградника? А иудеи в ответ сказали:«злодеев... предаст... смертиивиноградник отдаст другим»(Мф. 21, 40–41). Не противоречие ли это? Отнюдь нет. Ибо вероятно случилось то и другое: сначала сами они произнесли приговор, как передает евангелист Матфей; а потом, догадавшись, к кому относится притча, именно: что она на них-то и сказана, сказали опять то, что передает теперь евангелист Лука, именно:«да не будет!».'
      cn: '正如你所听闻的，传福音者路加说，主讲了这些话：「葡萄园的主人将毁灭那些忘恩负义的园丁，并把葡萄园交给其他人。」 而法利赛人听见这话，就说：「愿无有哉！」 但传福音者马太的说法有所不同，确切地说：主问葡萄园的主人会如何对待那些园丁？而犹太人回答说：「那些恶人，他要重重地治死；将葡萄园租给其他园丁」（马太福音 21:40-41）。


        这难道不是矛盾吗？绝不是。因为很可能发生了这两件事：首先，如传福音者马太所记载的，他们自己宣判了刑罚；然后，当他们猜到这比喻指的是谁时，确切地说是这比喻就是对他们说的，他们又说了传福音者路加现在所记载的话，确切地说：「愿无有哉！」'
  - type: paragraph
    initial:
      ru: 'Лк 20:17. '
      cn: （路加福音 20:17）
    text:
      ru: 'Но Он, взглянув на них, сказал: что значит сие написанное: камень, который отвергли строители, тот самый сделался главою угла?'
      cn: 彼注目向之曰、经载何谓、工师所弃之石彼将成为隅顶、
  - type: paragraph
    text:
      ru: Что же Христос? Он приводит и другое свидетельство из псалмов Давида (Пс. 117, 22), Себя называя камнем, а самих учителей строящими, подобно как и пророк Иезекииль говорит:«и когда он строит стену, они обмазывают ее грязью»(Иез. 13, 10), то есть говорящие в угоду и прикрывающие недостатки народа, и потому как бы помазывающие грязью повреждения народа, как бы какой стены. Как же«отвергли»сей камень? Когда говорили:«не от Бога этот Человек»(Ин. 9, 16).
      cn: 那基督又如何呢？祂引述了大卫诗篇中的另一处见证（诗篇 117:22），称自己为石头，而将那些教师称为建造者，正如先知以西结所言：「当他建造墙壁时，他们却用污泥涂抹」（以西结书 13:10），意即那些说取悦人的话并掩盖百姓缺点的人，因此仿佛是用污泥涂抹了百姓的损伤，就像涂抹某堵墙壁一样。他们是如何「弃绝」这块石头的呢？就是当他们说：「这不是从神来的」（伊鄂昂福音 9:16）的时候。
  - type: paragraph
    initial:
      ru: 'Лк 20:18. '
      cn: （路加福音 20:18）
    text:
      ru: Всякий, кто упадет на тот камень, разобьется, а на кого он упадет, того раздавит.
      cn: 凡坠此石上者、将见毁坏、而被坠落者、将见糜碎、
  - type: paragraph
    text:
      ru: Господь говорит здесь о двоякой погибели. Одна – погибель душ их, которую они потерпели за то, что соблазнились. Ибо всякий, падающий на сей камень, разобьется. Другая – погибель от пленения, которое навел на них камень сей за свое уничижение от них. Ибо«на кого», сказано,«упадет, того раздавит». Иудеи раздавлены и рассеяны так, как мякина, от одного гумна – Палестины – во весь мир. Примечай же то, что прежде они упали на камень сей, то есть соблазнились, а потом уже камень упал на них и наказал. Ибо прежде совершается мною грех, а потом меня постигает праведное наказание от Бога. Но иудеи отвергли сей камень. А он был так хорош и избран, что положен во главу угла и совокупил и соединил две стены, то есть ветхое и новое. Хотя им должно было послушать Исаии, говорящего:«Его чтите свято, и Он – страх ваш, и Он – трепет ваш! И будет Он освящением и камнем преткновения, и скалою соблазна»(Ис.8,13–14).
      cn: '主在此处论及双重的毁灭。其一是他们灵魂的毁灭，这是他们因受其诱惑而招致的。因为凡坠在此石上者，必将见糜碎（或「破碎」）。其二是由被这块石头因受到他们的轻蔑而施加于他们的、来自被掳的毁灭。因为经文说：「此石落在谁身上，必将将其压碎」。犹太人被压碎并像谷壳一样，从巴勒斯坦——一个打谷场——被驱散到整个世界。


        你要留意，首先是他们跌落在这块石头上，即，受到了诱惑；之后，这块石头才落在他们身上，并惩罚了他们。因为罪总是先由我犯下，然后公义的惩罚才从上帝那里降临于我。


        但犹太人却拒绝了这块石头。而祂却是如此美好且被拣选，以至于被安置在房角石的顶端，并结合和连接了两堵墙，即旧约与新约。尽管他们本应听从以赛亚所言：「你们要尊祂为圣，祂是你们所当畏惧的，是你们所当恐慌的！祂必作为圣所，却要作一块绊脚的石头、跌人的磐石」（以赛亚书 8:13-14）。'
  - type: paragraph
    initial:
      ru: 'Лк 20:19. '
      cn: （路加福音 20:19）
    text:
      ru: И искали в это время первосвященники и книжники, чтобы наложить на Него руки, но побоялись народа, ибо поняли, что о них сказал Он эту притчу.
      cn: 〇司祭首及学士等、谋求以措其手于彼、而惧民、盖彼等觉悟彼设此譬语指己、
  - type: paragraph
    text:
      ru: Но они и тогда, как поняли, что на них говорит Господь притчу сию, злоумышляют против Него и наложили бы на Него руки, если бы не побоялись народа. И Закон говорит:«не умерщвляй невинного и правого»(Исх. 23, 7); но его они не слушают, а боятся гнева людского и, уклоняясь от видимого наложения рук, устрояют иные ковы против Него.
      cn: 然而他们那时，当他们明白主是针对他们说了这比喻时，就恶谋反对祂，若非惧怕百姓，本会向祂下手。而律法说：「不可杀无辜和有义的人」（出埃及记 23:7）；但他们不听从律法，却惧怕众人的愤怒，并规避了可见的下手行为，转而安排了针对祂的其他诡计。
  - type: paragraph
    initial:
      ru: 'Лк 20:20. '
      cn: （路加福音 20:20）
    text:
      ru: И, наблюдая за Ним, подослали лукавых людей, которые, притворившись благочестивыми, уловили бы Его в каком-либо слове, чтобы предать Его начальству и власти правителя.
      cn: 乃窥伺之、遣侦人、而佯为义者、欲因其言罗之、以解之于方伯之权位、
  - type: paragraph
    initial:
      ru: 'Лк 20:21. '
      cn: （路加福音 20:21）
    text:
      ru: 'И они спросили Его: Учитель! мы знаем, что Ты правдиво говоришь и учишь и не смотришь на лице, но истинно пути Божию учишь;'
      cn: 遂问之曰、师欤、我侪知尔所言所教皆正、不以貌取人、乃洵然教上帝之道、
  - type: paragraph
    initial:
      ru: 'Лк 20:22. '
      cn: （路加福音 20:22）
    text:
      ru: позволительно ли нам давать подать кесарю, или нет?
      cn: 我侪纳税予楷萨儿、宜否、
  - type: paragraph
    text:
      ru: Фарисеи приготовили сеть, которой, по их мнению, Господу трудно избежать, но в сети сей«запуталась нога их»(Пс. 9,16). Смотри, какое лукавство! Если Господь скажет, что должно давать подать кесарю, тогда обвинят Его пред народом в том, что Он в рабство приводит народ, который есть«семя Авраамово»и никому не работал (Ин. 8, 33). Если Он запретит давать подать, в таком случае, как возмутителя, поведут Его к правителю.
      cn: 法利赛人备下了一个网，他们认为，主必难以避开，但在这网中，「他们的脚陷住了」（诗篇 9:16）。看啊，何等的诡诈！如果主说应该向凯撒纳税，那么他们就会在百姓面前控告祂，说祂将百姓——这「阿乌拉阿阿木的后裔」，且从未服侍过任何人（伊鄂昂福音 8:33）——引入了奴役。如果祂禁止纳税，那么他们就会将祂当作叛乱分子，带到统治者那里。
  - type: paragraph
    initial:
      ru: 'Лк 20:23. '
      cn: （路加福音 20:23）
    text:
      ru: 'Он же, уразумев лукавство их, сказал им: что вы Меня искушаете?'
      cn: 彼知其诈计、向之曰、何为试探我、
  - type: paragraph
    initial:
      ru: 'Лк 20:24. '
      cn: （路加福音 20:24）
    text:
      ru: 'Покажите Мне динарий: чье на нем изображение и надпись? Они отвечали: кесаревы.'
      cn: 以一银枚示我、此像及号为谁、答曰、为楷萨儿、
  - type: paragraph
    initial:
      ru: 'Лк 20:25. '
      cn: （路加福音 20:25）
    text:
      ru: 'Он сказал им: итак, отдавайте кесарево кесарю, а Божие Богу.'
      cn: 彼语之曰、属楷萨儿者、尔等予楷萨儿、属上帝者、予上帝也、
  - type: paragraph
    text:
      ru: "Но Господь избегает сетей их как«серна\",ибо так назвала Его невеста в Песни Песней (Песн. 2, 9), и научает, что телесная подчиненность владеющему нашими телами, царь ли он, или тиран, нисколько не препятствует нам духовно благоугождать Богу духов.«Итак, отдавайте, – говорит, –кесарево кесарю, а Божие Богу». И смотри, не сказал: «давайте», но«отдавайте».\n     Это, – говорит, – долг, поэтому и уплати должное. Государь твой хранит тебя от неприятелей, жизнь твою делает мирной, за это ты обязан ему податью. И иначе: то самое, что ты вносишь, то есть монету, ты имеешь от него же самого. Итак, монету царскую ему (царю) и возврати опять. Между тем ты и для себя извлек из нее выгоду, разменивая ее и добывая необходимое для жизни."
      cn: '然而，主躲避了他们的陷阱，像一只「母鹿」，因为新娘在《雅歌》（歌罗西书 2:9）中曾如此称呼祂，并且祂教导我们：身体上顺服那位掌控我们肉体的人——无论他是君王还是暴君——丝毫不会妨碍我们以属灵的方式取悦属灵的上帝。「所以，」祂说，「将凯撒的物归给凯撒，将上帝的物归给上帝。」且看，祂没有说「给与」（*давайте*），而是说「归还」（*отдавайте*）。


        祂说，这是一笔债务，因此你要偿付应付之债。你的君王使你免于仇敌，使你的生活安宁，为此你当向他纳税。另有一解：你所缴纳的那物，即钱币，本身就得自于他。因此，将凯撒的钱币再次归还给他（君王）。与此同时，你也为自己从中获得了益处，因为你兑换了钱币，并获取了生活的必需品。'
  - type: paragraph
    text:
      ru: 'Так точно и Божие должно воздавать Богу. Он дал тебе ум: возврати Ему оный разумной деятельностью. Он дал тебе рассудок: возврати Ему оный, не уподобляясь неразумным животным, но поступая во всем как одаренный разумом. И вообще Он дал тебе душу и тело: возврати Ему все и восстанови для Него образ Его, живя по вере, с надеждой, в любви.'
      cn: 同样，上帝之物也当归还给上帝。祂赐予你悟性（ум）：你要以理性的活动将之归还给祂。祂赐予你理性（рассудок）：你要将之归还给祂，不效法不具理性的动物，而是在一切事上都以受惠于理性者的身份行事。总之，祂将灵魂与肉体都赐予了你：你要将全部归还于祂，并为祂重建祂的形象，活出有信、有望、有爱的生命。
  - type: paragraph
    text:
      ru: И в ином смысле должно отдавать кесарево кесарю. Каждый из нас носит на себе или образ Божий, или образ князя мира. Когда мы уподобимся кесарю, становясь сыновьями диавола, мы носим на себе его образ. Сей-то образ должно отдавать ему и отвергать, чтобы он имел свое при себе, а в нас не находил ничего принадлежащего ему. Чрез это и образ Божий может сохраниться у нас в чистоте. Поэтому и апостол Павел убеждает, чтобы мы как носили образ земного, так носили и образ небесного (1Кор. 15, 49); и в другом месте:«отложить прежний образ жизни ветхого человека»(Еф. 4, 22). Что здесь выражено словом «отдавать», то у Павла словом«отложить», и что здесь названо образом«кесаря», то там образом«земного», без сомнения, Адама согрешившего, и«ветхого человека». Ибо образ земного не что иное, как тление и грех, каковой образ мы имеем потому, что уподобились отступнику, а не Царю.
      cn: 还有另一种意义，我们应当把凯撒的物归给凯撒。我们每个人身上都承载着上帝的形象，或是这世界君王的形象。当我们变得像凯撒一样，成为魔鬼的儿子时，我们身上就承载着他的形象。正是这个形象，我们应当归还给他并加以弃绝，这样他就可以拥有属于他自己的东西，而在我们身上找不到任何属于他的事物。通过这样做，上帝的形象就能在我们身上保持纯洁。因此，使徒保罗劝勉我们，既然我们已经戴了属地的形象，也就当戴上属天的形象（哥林多前书 15:49）；在另一个地方又说：「脱去你们从前行为上的旧人」（以弗所书 4:22）。此处用「归还」（отдавать）一词表达的，在保罗那里是用「脱去」（отложить）一词表达的；而此处被称为「凯撒」的形象，在那边则被称为「属地」的形象，毫无疑问，指的是那犯了罪的亚当，以及「旧人」。因为属地的形象无非是朽坏和罪，我们拥有这种形象，是因为我们效法的是那背叛者，而不是君王。
  - type: paragraph
    initial:
      ru: 'Лк 20:26. '
      cn: （路加福音 20:26）
    text:
      ru: И не могли уловить Его в слове перед народом, и, удивившись ответу Его, замолчали.
      cn: 彼等于民前不能因其言罗之、且奇其应对、竟默然、
  - type: paragraph
    text:
      ru: Фарисеи не могли уловить Иисуса в слове пред народом. Ибо особенное старание у них было о том, чтобы оклеветать Его пред народом, как порабощающего народ римлянам. А сего они не могли достигнуть по причине премудрого Его ответа.
      cn: 法利赛人不能在民众面前以言语罗织耶稣。因为他们特别努力于，要在民众面前诽谤他，说他正在奴役民众归于罗马人。但因为他那至为智慧的回答，他们不能达到此目的。
  - type: paragraph
    initial:
      ru: 'Лк 20:27. '
      cn: （路加福音 20:27）
    text:
      ru: 'Тогда пришли некоторые из саддукеев, отвергающих воскресение, и спросили Его:'
      cn: 〇萨督楷乙人言无复活者、中有数人来就之问曰、
  - type: paragraph
    initial:
      ru: 'Лк 20:28. '
      cn: （路加福音 20:28）
    text:
      ru: Учитель! Моисей написал нам, что если у кого умрет брат, имевший жену, и умрет бездетным, то брат его должен взять его жену и восставить семя брату своему.
      cn: 师欤、摩伊些乙为我等书云、若人之兄娶妻死、死而无子者、其弟当娶其妻、为己兄立嗣、
  - type: paragraph
    initial:
      ru: 'Лк 20:29. '
      cn: （路加福音 20:29）
    text:
      ru: Было семь братьев, первый, взяв жену, умер бездетным;
      cn: 盖有兄弟七人、第一娶妻无子而死、
  - type: paragraph
    initial:
      ru: 'Лк 20:30. '
      cn: （路加福音 20:30）
    text:
      ru: взял ту жену второй, и тот умер бездетным;
      cn: 第二娶其妻、亦无子而死、
  - type: paragraph
    initial:
      ru: 'Лк 20:31. '
      cn: （路加福音 20:31）
    text:
      ru: взял ее третий; также и все семеро, и умерли, не оставив детей;
      cn: 第三仍娶之、如是、以及七人、皆未遗子而死、
  - type: paragraph
    initial:
      ru: 'Лк 20:32. '
      cn: （路加福音 20:32）
    text:
      ru: после всех умерла и жена;
      cn: 厥后妇亦死、
  - type: paragraph
    initial:
      ru: 'Лк 20:33. '
      cn: （路加福音 20:33）
    text:
      ru: итак, в воскресение которого из них будет она женою, ибо семеро имели ее женою?
      cn: 故在复活时、彼在其中为谁之妻乎、盖七人皆已娶之为妻矣、
  - type: paragraph
    text:
      ru: Саддукеи, в своих измышлениях утверждаясь на слабом основании, не верили учению о воскресении. Предполагая, что по воскресении будет телесная жизнь, они, естественно, заблуждались. Поэтому, осмеивая учение о воскресении как нелепое, они выдумывают настоящий безрассудный рассказ.
      cn: 撒都该人，在他们的臆想中，立足于一个薄弱的基础之上，不相信关于复活的教义。他们臆测，在复活之后将会有属乎肉体的生命，他们理所当然地陷入了谬误。因此，他们嘲笑复活的教义为荒谬之说，并编造了这一真实的、不理智的故事。
  - type: paragraph
    initial:
      ru: 'Лк 20:34. '
      cn: （路加福音 20:34）
    text:
      ru: 'Иисус сказал им в ответ: чада века сего женятся и выходят замуж;'
      cn: 伊伊稣斯对之曰、此世之诸子有娶有嫁、
  - type: paragraph
    initial:
      ru: 'Лк 20:35. '
      cn: （路加福音 20:35）
    text:
      ru: а сподобившиеся достигнуть того века и воскресения из мертвых ни женятся, ни замуж не выходят,
      cn: 然堪得来世及由死复活者、不娶不嫁、
  - type: paragraph
    text:
      ru: 'Но Господь опровергает их основание и объявляет, что там не телесная жизнь. А вместе с этим слабым основанием и предположением разрушает и учение их, сказав: вы заблуждаетесь, не зная Писаний и превратно толкуя их смысл.«Чада века сего», то есть рождающие и рождающиеся в мире сем,«женятся и посягают», то есть«выходят замуж». А сыны того века ничего такого не делают, ибо и умирать не могут; поэтому нет там и брака, а жизнь ангельская, божественная. Здесь потому и брак, что есть смерть, и потому смерть, что есть брак. А там, когда упразднится смерть, какая нужда в браке? Ибо брак установлен в помощь смертности и в восполнении недостатка. А где нет никакого недостатка, там какая нужда в восполнении?'
      cn: '然则，上主驳斥了他们的根基，并宣告在那里并非肉体（属身体的）生命。且藉着这薄弱的根基和假定，祂也摧毁了他们的教导，说：「你们是犯了错，因你们不明白经文，且曲解了经文的含义。」


        「今世之子」，亦即是在此世中生养并被生养者，「娶妻嫁人」，亦即是「出嫁」。但那世代之子则不会做任何这类事情，因他们也无法死亡；因此，那里就没有婚姻，而是天使般的、神圣的生命。


        此地之所以有婚姻，是因为有死亡；之所以有死亡，是因为有婚姻。然而，在那里，当死亡被废止时，又何需婚姻呢？盖因婚姻的设立，是为了辅助这必朽的生命，并补足其缺陷。既然那里没有任何缺陷，又何需补足呢？'
  - type: paragraph
    initial:
      ru: 'Лк 20:36. '
      cn: （路加福音 20:36）
    text:
      ru: и умереть уже не могут, ибо они равны Ангелам и суть сыны Божии, будучи сынами воскресения.
      cn: 亦不能复死、盖彼等同列天神、为上帝之子、乃为复活之子也、
  - type: paragraph
    text:
      ru: '«Ибо они равны Ангелам и суть сыны Божии». Почему? Потому что суть сыны воскресения. Слова сии такой имеют смысл: Я, – говорит, – назвал их сынами Божиими потому, что в рождении их не усматривается ничего телесного, но все божественное. Ибо в воскресении не предшествует ни соития, ни семени, ни утробы, ни зачатия, но тела наши рождает Бог известным Ему способом. Поскольку же в воскресении действует Бог, то возрождающиеся от воскресения справедливо называются сынами Божиими.'
      cn: 「盖其同侪天神、为上帝之子也」。为何如此？乃因彼等为复活之子。此言有如下之深意：主言：「我称彼等为上帝之子，乃因在其生发中，不见任何属肉体之物，而全属乎神性。盖在复活中，既无交合、无精种、无子宫、亦无受孕先行，但我们的身体乃由上帝以其已知的方式所生。既然在复活中是上帝在作为，故此由复活而重生者，理当被称为上帝之子。」
  - type: paragraph
    initial:
      ru: 'Лк 20:37. '
      cn: （路加福音 20:37）
    text:
      ru: А что мертвые воскреснут, и Моисей показал при купине, когда назвал Господа Богом Авраама и Богом Исаака и Богом Иакова.
      cn: 论死者复活、摩伊些乙于荆棘篇中亦明示之、其称主为阿乌拉阿木之上帝、伊萨阿克之上帝、亚适乌之上帝、
  - type: paragraph
    initial:
      ru: 'Лк 20:38. '
      cn: （路加福音 20:38）
    text:
      ru: Бог же не естьБогмертвых, но живых, ибо у Него все живы.
      cn: 然上帝非系诸死者之上帝、乃系诸生者、因在彼前众皆生、
  - type: paragraph
    text:
      ru: 'К умозаключению Господь присовокупляет и свидетельство от Писания. Моисей говорит, что Бог сказал ему из купины:«Я Бог Авраама»и прочее (Исх. 3,6). Если бы патриархи навсегда уничтожились и не были живы пред Богом по надежде воскресения, то Он не сказал бы: «Я есть», но «Я был». Ибо о вещах поврежденных и потерянных мы обыкновенно говорим: я «был» хозяином такой-то вещи. А теперь, когда Бог сказал: «Я есть», Он показал, что Он есть Господь и Бог живых, а не уничтожившихся совершенно. Ибо хотя они и умерли, но надеждой воскресения живы, подобно как и Адам хотя и жив был, однако ж, был смертен, и о нем говорится, что он умер в то самое время, как вкусил от запрещенного плода.'
      cn: 救主将来自圣经的见证附加到此推论之上。摩西说，上帝从荆棘中对他言说：「我是阿乌拉阿阿木的上帝」等等（出埃及记 3:6）。如果众先祖已被永远消灭，并且若非因复活的盼望而在上帝面前并非活着，那么祂就不会说：「我是（那）存在者」，而会说「我曾是（那）存在者」。因为对于损坏和失落的事物，我们通常会说：我「曾是」某某事物的主人。而如今，当上帝说：「我是（那）存在者」，祂便表明了祂是活人之主、活人之神，而非全然消灭者之主、之神。因为虽然他们死了，但因复活的盼望而活着，正如亚当虽然活着，却仍然是必死的，而论及他，则说他在尝了禁果的那一刻便死了。
  - type: paragraph
    initial:
      ru: 'Лк 20:39. '
      cn: （路加福音 20:39）
    text:
      ru: 'На это некоторые из книжников сказали: Учитель! Ты хорошо сказал.'
      cn: 有学士数人答之曰、师欤、尔所言善矣、
  - type: paragraph
    initial:
      ru: 'Лк 20:40. '
      cn: （路加福音 20:40）
    text:
      ru: И уже не смели спрашивать Его ни о чем.
      cn: 后毫不敢复问之、彼语伊等曰、
  - type: paragraph
    text:
      ru: Когда таким образом саддукеи были пристыжены, книжники, довольные победой над ними, одобрили Иисуса как соперника их.
      cn: 既然如此，撒都该人被使蒙羞，文士们，对于胜过了他们（撒都该人）感到满意，遂赞同了耶稣，视祂为他们的竞争对手。
  - type: paragraph
    text:
      ru: 'Он же сказал им:'
      cn: 他则对他们说：
  - type: paragraph
    initial:
      ru: 'Лк 20:41. '
      cn: （路加福音 20:41）
    text:
      ru: ка́к говорят, что Христос есть Сын Давидов,
      cn: 人何言、合唎斯托斯为达微德之子乎、
  - type: paragraph
    initial:
      ru: 'Лк 20:42. '
      cn: （路加福音 20:42）
    text:
      ru: 'а сам Давид говорит в книге псалмов: сказал Господь Господу моему: седиодеснуюМеня,'
      cn: 盖达微德于圣咏经自称曰、主向我主云、尔坐我右、
  - type: paragraph
    initial:
      ru: 'Лк 20:43. '
      cn: （路加福音 20:43）
    text:
      ru: доколе положу врагов Твоих в подножие ног Твоих?
      cn: 迨我将雠敌置尔足下为足凳、
  - type: paragraph
    initial:
      ru: 'Лк 20:44. '
      cn: （路加福音 20:44）
    text:
      ru: Итак, Давид Господом называет Его; как же Он Сын ему?
      cn: 盖达微德自称为主、而何又系其子乎、
  - type: paragraph
    text:
      ru: 'Вскоре имея идти на страдания, Господь проповедует о Своем Божестве, и то не явно и с гордостью, но очень скромно. Ибо спрашивает их и, приведя в недоумение, предоставляет им самим выводить следствие. Давид, – говорит, – называет Его Господом (Пс. 109, 1): как же Он простой Сын ему? Он был и сын Давиду по плоти, но вместе и Бог его, а они считали Его только сыном Давидовым. Поэтому Он опровергает это мнение их, что Христос есть простой сын Давидов, и объявляет, что Он не противен Отцу, но имеет с Ним большое единомыслие, ибо Отец поборает врагов Его. Это сказал Он книжникам.'
      cn: 主即将受难，祂宣讲着自己的神性，并且不是公然地或带着骄傲，而是极其谦逊地。因为祂向他们发问，并使他们困惑不解，任由他们自己去得出结论。祂说：「大卫称祂为主（诗篇 109:1）：祂又如何只是大卫的儿子呢？」 祂既是按肉体而言的大卫之子，但同时也是他的上帝，而他们只将祂视为大卫的儿子。因此，祂反驳了他们关于基督只是大卫之子的看法，并宣告祂并非与父对立，而是与父拥有极大的同心合意，因为父正在为祂征服仇敌。祂对文士们说了这些话。
  - type: paragraph
    initial:
      ru: 'Лк 20:45. '
      cn: （路加福音 20:45）
    text:
      ru: 'И когда слушал весь народ, Он сказал ученикам Своим:'
      cn: 〇众民听之时、彼向其门徒曰、
  - type: paragraph
    initial:
      ru: 'Лк 20:46. '
      cn: （路加福音 20:46）
    text:
      ru: остерегайтесь книжников, которые любят ходить в длинных одеждах и любят приветствия в народных собраниях, председания в синагогах и предвозлежания на пиршествах,
      cn: 尔谨防学士等、好穿长服游、喜人于市厂问其安、于会堂首位、且于筵间上坐者、
  - type: paragraph
    text:
      ru: Поскольку же учеников Он посылал учителями во вселенную, то справедливо убеждает их не подражать фарисеям в славолюбии, в любви к первенству и вообще в светскости и человекоугодливости. Ибо тщательно соблюдать приветствия на площадях свойственно тем, кои льстят всякому встречному и заискивают доброе о себе мнение или употребляют это средством к собранию денег.
      cn: 鉴于他派遣门徒们作为教师前往普世（教会），他便公正地劝服他们，不要在以下方面效仿法利赛人：在贪图虚荣方面、在爱慕首位方面，以及总体而言，在世俗性和谄媚于人方面。因为在广场上恪守问安礼节，是那些惯于谄媚任何偶遇之人、渴求他人对自己有良好评价，或是利用此法来聚敛钱财者所特有的行为。
  - type: paragraph
    initial:
      ru: 'Лк 20:47. '
      cn: （路加福音 20:47）
    text:
      ru: которые поедают до́мы вдов и лицемерно долго молятся; они примут тем большее осуждение.
      cn: 其吞孀妇之家产、而佯为长祈祷、此辈受刑更重、
  - type: paragraph
    text:
      ru: «Поедают, – говорит, –домы вдов», наполняя чрево и расточая за пределы должного. И предлог к тому как бы благоговейный. Ибо, под предлогом молитвы и душевной пользы, они учат не посту, но пьянству и чревоугодию, и за то, говорит,«примут тем большее осуждение», потому что не только зло делают, но и прикрывают оное молитвой. И вид у них благоговейный, добродетель они делают предлогом к лукавству. Поэтому они заслуживают и большее осуждение, так как добро подвергают порицанию. Вдовиц должно жалеть, а они входят в домы их за тем будто бы, чтобы долгими молитвами благословить их. Между тем вдовицы принуждены бывают по случаю их посещения делать издержки, и таким образом разоряются.
      cn: 「他们『吞食寡妇的家产』，」他说，「装满自己的肚腹，并且过度挥霍，逾越了应有的界限。」而他们以此为借口，似乎是虔敬的。因为，他们以祷告和关乎灵魂之益处为借口，教导的并非禁食，而是醉酒和饕餮。因此，他说，「他们将受到更重的刑罚」，因为他们不仅作恶，还以祷告来掩盖恶行。他们外表看似虔敬，将美德作为他们邪恶的借口。因此，他们理应受到更重的刑罚，因为他们使良善遭受了非议。寡妇是应该被怜悯的，然而他们却进入寡妇的家，表面上是想要借着长久的祷告来为她们祝福。而与此同时，寡妇们却因他们的到访而被迫花费支出，并因此走向败落。
- type: heading1
  text:
    ru: Глава двадцать первая
    cn: 第二十一章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 21:1. '
      cn: （路加福音 21:1）
    text:
      ru: Взглянув же, Он увидел богатых, клавших дары свои в сокровищницу;
      cn: 彼举目见诸富人投其仪物于柜、
  - type: paragraph
    text:
      ru: Было священное сокровище, уделяемое боголюбивыми, которое употребляли на поделки и поправки в храме, и вообще на украшение храма и на пропитание бедных. Но в последнее время священники и это сокровище обратили в торговые обороты, разделяя оное между собой, а, не употребляя на то, на что определено оно первоначально.
      cn: 曾有一笔圣物府库，由爱上帝之人所拨付，用于殿中的制作与修缮，通常也用于装饰圣殿和供养贫穷之人。但到了末后的时期，祭司们连这笔财宝也转作了贸易周转，在他们之间将之瓜分，而没有用之于其最初所定规之用途。
  - type: paragraph
    initial:
      ru: 'Лк 21:2. '
      cn: （路加福音 21:2）
    text:
      ru: увидел также и бедную вдову, положившую туда две лепты,
      cn: 又见一贫嫠亦以二文入之、
  - type: paragraph
    initial:
      ru: 'Лк 21:3. '
      cn: （路加福音 21:3）
    text:
      ru: 'и сказал: истинно говорю вам, что эта бедная вдова больше всех положила;'
      cn: 乃曰、我诚告尔等、此贫嫠所入者、较众尤多、
  - type: paragraph
    initial:
      ru: 'Лк 21:4. '
      cn: （路加福音 21:4）
    text:
      ru: ибо все те от избытка своего положили в дар Богу, а она от скудости своей положила всё пропитание свое, какое имела.
      cn: 盖此众由其盈余中投为上帝之仪物、然此孀妇由其匮乏尽投其所有生计者、
  - type: paragraph
    text:
      ru: 'Господь вдовицу хвалит больше всех прочих, потому что она от скудости своей повергла все свое состояние. Ибо две лепты, по-видимому, и ничтожны, но у кормившейся милостыней они составляли весь живот: ибо вдовица была нищая. Итак, Господь воздает награду, обращая внимание не на то, сколько дается, а на то, сколько остается. В домах богачей, принесших немногое и невеликое, оставалось гораздо больше, а у ней дом весь опустел, и в нем ничего не осталось. Поэтому поистине она достойна похвалы большей, нежели те.'
      cn: 主称赞这位寡妇胜过所有其余的人，因为她由其匮乏中投入了她所有的生计。盖因两个小钱，表面上微不足道，但对于靠施舍为生的人而言，它们构成了全部的生计：因为这位寡妇是个贫穷的人。因此，主赏赐报酬，并非关注投入了多少，而是关注还剩下多少。那些富户的家中，尽管他们献上不多且不丰厚，剩下的仍要多得多；而在她那里，整个家都已清空，什么都没有留下了。所以，她所配得的赞扬，比他们那些人所配得的，确实要大得多。
  - type: paragraph
    text:
      ru: Некоторые думали, что под «вдовою» можно разуметь всякую душу, отказавшуюся от прежнего мужа, то есть Ветхого Закона, но еще неудостоившуюся соединиться с Богом Словом, и что она вместо залога приносит тонкую и возможную для нее веру и добрую совесть. Ибо с верой нужно приносить и добрую совесть, то есть жизнь беспорочную. И кто с ними приходит к Богу, тот, кажется, полагает больше всех тех, кои богаты учением и обилуют языческими добродетелями.
      cn: 有些人认为，「寡妇」可以理解为任何弃绝了她前夫，即《旧约律法》，却尚未被授予与道（上帝之言）联合的资格的灵魂。他们认为，她奉献的是对她而言微小且可能的信心，以及良善的良知，以此作为抵押物。因为，伴随着信心，还需奉献良善的良知，即无可指责的生活。而任何带着这些来到上帝面前的人，似乎比那些富有教义且充溢着异教徒美德的人，奉献得更多。
  - type: paragraph
    initial:
      ru: 'Лк 21:5. '
      cn: （路加福音 21:5）
    text:
      ru: 'И когда некоторые говорили о храме, что он украшен дорогими камнями и вкладами, Он сказал:'
      cn: 〇时有数人论殿、系以美石及贡修饰者、彼曰、
  - type: paragraph
    initial:
      ru: 'Лк 21:6. '
      cn: （路加福音 21:6）
    text:
      ru: придут дни, в которые из того, что вы здесь видите, не останется камня на камне; всё будет разрушено.
      cn: 日将至、在尔此所见之中、无一石遗于一石上、皆见倾圯、
  - type: paragraph
    text:
      ru: 'Господь, как по немногом времени имеющий претерпеть Распятие, прилично пророчествует теперь об Иерусалиме, чтобы мы в этом имели сильное доказательство того, что Он есть истинный Бог. Поэтому и тогда, когда некоторые хвалили здания храма и «вклады» (я думаю, что они говорили о резных и изваянных произведениях, например о пальмах и херувимах (3Цар. 6, 32): это, быть может, и называли), Господь ни на что не обращает внимания, но предсказывает разрушение их.'
      cn: 主，鉴于祂在不久之后就要遭受被钉十字架，祂此刻恰当地预言了有关耶路撒冷的事情，好让我们在此事中得到强有力的证明，即祂是真神。因此，即便当时有些人在称赞圣殿的建筑和「奉献物」（我猜想他们说的是雕刻和塑像作品，例如棕树和基路伯（列王纪上 6:32）：或许他们指的就是这些），主也丝毫没有理会，反而预言了它们的毁灭。
  - type: paragraph
    initial:
      ru: 'Лк 21:7. '
      cn: （路加福音 21:7）
    text:
      ru: 'И спросили Его: Учитель! когда же это будет? и какой признак, когда это должно произойти?'
      cn: 向之曰、师欤、何时有此、此等事将成之期、有何预兆、
  - type: paragraph
    initial:
      ru: 'Лк 21:8. '
      cn: （路加福音 21:8）
    text:
      ru: 'Он сказал: берегитесь, чтобы вас не ввели в заблуждение, ибо многие придут под именем Моим, говоря, что это Я; и это время близко: не ходите вслед их.'
      cn: 〇彼曰、尔等慎勿为人所惑、盖将有多人冒我名而来、言系我也、时已近也、尔等勿从之、
  - type: paragraph
    text:
      ru: Они подумали, что Он говорит о кончине вселенной, хотя Он говорил о пленении Иерусалима римлянами. Поэтому, снисходя им, Он на время оставляет речь о пленении Иерусалима римлянами, намереваясь присоединить ее к последующему, а теперь рассуждает о кончине мира и предостерегает их, чтоб они не слушались лжепророков, имеющих прийти прежде Его пришествия.
      cn: 他们以为祂说的是宇宙的终结（кончине вселенной），尽管祂说的是罗马人对耶路撒冷的劫掠（пленении Иерусалима римлянами）。因此，为了迁就他们（снисходя им），祂暂时搁置了关于罗马人对耶路撒冷劫掠的言论，打算将其附于随后的论述，而现在则开始论述世界的终结，并警告他们不要听信那些将在祂降临之前到来的假先知（лжепророков）。
  - type: paragraph
    initial:
      ru: 'Лк 21:9. '
      cn: （路加福音 21:9）
    text:
      ru: Когда же услышите о войнах и смятениях, не ужасайтесь, ибо этому надлежит быть прежде; но не тотчас конец.
      cn: 尔等闻战鬭及变乱勿惧、盖此先当有、仍未及终、
  - type: paragraph
    initial:
      ru: 'Лк 21:10. '
      cn: （路加福音 21:10）
    text:
      ru: Тогда сказал им; восстанет народ на народ, и царство на царство;
      cn: 谓彼等曰、民将攻民、国亦攻国、
  - type: paragraph
    initial:
      ru: 'Лк 21:11. '
      cn: （路加福音 21:11）
    text:
      ru: будут большие землетрясения по местам, и глады, и моры, и ужасные явления, и великие знамения с неба.
      cn: 处处有大地震、饥馑、瘟疫、自天现危象及大先兆、
  - type: paragraph
    text:
      ru: Будут «войны и смятения», ибо, по прекращении всякой любви, естественно будут иметь место войны и смятения. Вследствие войн наступят «голод и мор»; мор – от испорченности воздуха от трупов, а голод – от невозделывания полей.
      cn: 将有「战争与动乱」，因为既然一切爱都已停止，战争与动乱自然而然就会发生。紧随战争而来的将是「饥荒与瘟疫」；瘟疫是由于尸体使空气腐败所致，而饥荒则是由于田地未被耕种所致。
  - type: paragraph
    text:
      ru: Некоторые принимали так, что голод, мор и прочие бедствия будут не при кончине только века, но и во время пленения Иерусалима. Ибо Иосиф (Флавий) говорит, что по причине голода были ужасные бедствия. Да и Лука в книге Деяний (Деян. 11, 28) говорит, что«голод... был при кесаре Клавдии». Много также было ужасов, указывавших на плен, как повествует тот же Иосиф. Это, то есть «войны, смятения» и прочее, решительно можно понимать вообще о времени кончины мира и пленения Иерусалима.
      cn: 一些人接受此观点，即饥荒、瘟疫及其它灾难不仅发生在世代的终结时，也发生在耶路撒冷被掳期间。因为约瑟夫（弗拉维乌斯）说，由于饥荒发生了可怕的灾难。并且路加在《使徒行传》（使徒行传 11:28）中说，「饥荒……发生于革老丢凯撒在位时」。正如同一位约瑟夫所叙述的，还有许多可怕的事情预示着被掳。因此，这，即「战争、动乱」等等，绝对可以理解为笼统地指代世界的终结和耶路撒冷被掳的时期。
  - type: paragraph
    initial:
      ru: 'Лк 21:12. '
      cn: （路加福音 21:12）
    text:
      ru: Прежде же всего того возложат на вас руки и будут гнатьвас,предавая в синагоги и в темницы, и поведут пред царей и правителей за имя Мое;
      cn: 〇此一切之先、人措其手于尔而窘逐之、即解于会堂及牢狱、而曳于王侯之前、因我名之故、
  - type: paragraph
    initial:
      ru: 'Лк 21:13. '
      cn: （路加福音 21:13）
    text:
      ru: будет же это вам для свидетельства.
      cn: 此为尔等之证、
  - type: paragraph
    text:
      ru: '«Прежде... всего того», что имеет случиться при кончине мира, или и при пленении (ибо, как я сказал, Он с речью о кончине соединяет речь и о пленении),«возложат на вас», то есть учеников Моих,«руки». И действительно, прежде пленения Иерусалима апостолы изгнаны были из него, по особенному усмотрению Божию, именно: чтобы все ужасы обрушились только над распинателями, а они, то есть апостолы, наполнили весь мир проповедью. Были также приводимы апостолы и пред царей и правителей: например, Павла водили к Фесту, к Агриппе, к самому кесарю (Деян. 25:6–23, 26:32). Обратилось же это для них в славу свидетельства.'
      cn: « Прежде... всего того » (« 在...所有那些之前 »), 即在世界末日或甚至在被掳（被俘）发生之际（因为，如我所言，祂将关于末世的言论与关于被掳的言论结合在一起）所必将发生之事, « возложат на вас » (« 将手加在你们身上 »), 即加在我的门徒身上, « руки » (« 手 »)。 确实, 在耶路撒冷被掳之前，使徒们就被逐出城外了，这是基于上帝的特别安排：恰恰是为了让所有的恐怖都降临在那些钉祂十字架的人身上，而他们（即使徒们）则用宣讲充满了整个世界。 使徒们也曾被带到君王和官长面前：例如，保罗曾被引到腓斯都、亚基帕，以及凯撒本人面前（使徒行传 25:6-23，26:32）。 然而，这对他们来说，却转变成了见证的荣耀。
  - type: paragraph
    initial:
      ru: 'Лк 21:14. '
      cn: （路加福音 21:14）
    text:
      ru: Итак положите себе на сердце не обдумывать заранее, что отвечать,
      cn: 故置于诸心、勿先虑何以对
  - type: paragraph
    initial:
      ru: 'Лк 21:15. '
      cn: （路加福音 21:15）
    text:
      ru: ибо Я дам вам уста и премудрость, которой не возмогут противоречить ни противостоять все, противящиеся вам.
      cn: 盖我将赐尔等口齿睿智、使尔等之仇不能辩駮敌对之、
  - type: paragraph
    text:
      ru: 'Поскольку же они были люди простые и неученые, то чтобы они не смущались тем, что от них будут требовать отчета мужи мудрые, говорит, чтоб они об этом нисколько не заботились. Ибо вы от Меня получите вместе премудрость и благоречивость, так что все противящиеся, хотя бы соединились за одно, не возмогут противостоять вам ни по мудрости, то есть силе мыслей, ни по красноречию и непогрешительности языка. Часто иной искусен в составлении умозаключений и находчив в мыслях, но при шуме скоро смущается, и от того во время речи к народу все перемешивает. Но им, то есть апостолам, в обоих отношениях дана была благодать. Поэтому и священники изумлялись необычайной мудрости Петра и Иоанна, зная, что прежде они были люди простые (Деян. 4, 13). А Павлу Фест говорил: С ума сошел ты, Павел!«большая ученость доводит тебя до сумасшествия»(Деян. 26, 24).'
      cn: 既然他们是朴实且未受教育的人，为免他们因着智慧的士人要求他们作出解释而感到困扰，他言明，叫他们对此丝毫不必忧心。因为你们将从我领受智慧和雄辩（或「美言」），以致于所有反对者，即便他们联合为一，也不能以智慧——即思想的力量——或以口才和语言的准确无误来对抗你们。一个人常常精于推理论证和思想敏捷，但在喧哗声中却容易困窘不安，因此在向民众宣讲时，他会将一切混淆错乱。但对他们——即门徒们而言——在上述两方面都已赐予了恩典。因此，祭司们因彼得和伊鄂昂不同寻常的智慧而惊愕，因为他们知道，此前他们都是朴实的人（使徒行传 4:13）。而保罗被非斯都言道：保罗，你疯了！「大学问使你发狂了」（使徒行传 26:24）。
  - type: paragraph
    initial:
      ru: 'Лк 21:16. '
      cn: （路加福音 21:16）
    text:
      ru: Преданы также будете и родителями, и братьями, и родственниками, и друзьями, и некоторых из вас умертвят;
      cn: 尔等将被父母、兄弟、亲戚、朋友所解、且于尔中有见杀者、
  - type: paragraph
    initial:
      ru: 'Лк 21:17. '
      cn: （路加福音 21:17）
    text:
      ru: и будете ненавидимы всеми за имя Мое,
      cn: 尔等将为众所憎因我名之故、
  - type: paragraph
    text:
      ru: 'Сказав это и уменьшив их страх от неучености, Господь высказывает еще обстоятельство, необходимое и могущее поколебать души, именно: что они преданы будут друзьями и сродниками. Предсказывает о сем обстоятельстве для того, чтобы, случившись внезапно, оно не смутило их. Ибо оно сильно поражает душу, как и Давид говорит:«ибо не враг поносит меня, – это я перенес бы;... но ты, который был для меня то же, что я»(Пс. 54, 13–14); и опять:«который ел хлеб мой, поднял на меня пяту»(Пс. 40, 10).'
      cn: 主说完了这话，并借此消除了他们因无知而生的恐惧，祂又指出了另一件必不可少、且可能动摇人心的事情，即：他们将被朋友和亲属出卖。祂预言了这事，是为了避免这事突然发生时令他们感到困惑。因为这事对灵魂的打击极其沉重，正如大卫所说：「原来不是仇敌辱骂我，若是，我还能忍受；……却是你，你与我同等」（诗篇 54:13-14）；又说：「吃我饭的，用脚踢我」（诗篇 40:10）。
  - type: paragraph
    initial:
      ru: 'Лк 21:18. '
      cn: （路加福音 21:18）
    text:
      ru: но и волос с головы вашей не пропадет, –
      cn: 然尔等首之一发亦不丧失、
  - type: paragraph
    initial:
      ru: 'Лк 21:19. '
      cn: （路加福音 21:19）
    text:
      ru: терпением вашим спасайте души ваши.
      cn: 于尔等忍耐护守尔等之灵魂、
  - type: paragraph
    text:
      ru: 'Сказав это и то, что их будут ненавидеть и некоторых из них умертвят, присовокупляет величайшее утешение:«волос с головы вашей не пропадет». Вы, – говорит, – будете спасены, и ни малейшая частичка ваша не пропадет, хотя многим и будет казаться, что пропала; только нужно терпеть. Ибо терпением вы можете приобрести ваши души. Враг приступает, как бы с намерением взять в плен, и старается захватить ваши души, наведя на вас бедствия; но вы вместо серебра дайте терпение, и этим выкупом приобретете ваши души и не потерпите в них вреда. Обрати внимания на выражение:«некоторых из вас умертвят», и ты уразумеешь оное несколько глубже, именно: умертвят вас не всецело. Вы состоите из двух частей: души и тела. Не то и другое, но одно у вас, то есть тело, умертвят, а души ваши вы терпением приобретете, Об этом Он и в другом месте сказал:«И не бойтесь убивающих тело, души́ же не могущих убить»(Мф. 10, 28).'
      cn: '说完这些，以及他们将被憎恨且他们中的一些人将被处死之后，（他）又加上了最大的安慰：「你们的头发连一根也不会失落。」


        他说，你们将得救，你们哪怕是最小的部分也不会失落，尽管在许多人看来似乎已经失落了；但唯一需要的是忍耐。因为借着忍耐，你们可以获取你们的灵魂。仇敌前来，仿佛意图掳掠，并试图通过降祸于你们来攫取你们的灵魂；但你们要以忍耐取代银子，并以此赎金来获取你们的灵魂，且在其中不致受损。


        请注意「你们中的一些人将被处死」这句话，你们将会更深一层地理解它，即：他们不会将你们全部处死。你们由两部分组成：灵魂和身体。他们处死的不是两者，而是你们中的一部分，即身体；而你们则会以忍耐获取你们的灵魂。关于此事，他也在别处说过：「那杀身体，不能杀灵魂的，不要怕他们」（马太福音 10:28）。'
  - type: paragraph
    initial:
      ru: 'Лк 21:20. '
      cn: （路加福音 21:20）
    text:
      ru: 'Когда же увидите Иерусалим, окруженный войсками, тогда знайте, что приблизилось запустение его:'
      cn: 尔等见军围耶鲁萨利木、则知其空虚近矣、
  - type: paragraph
    text:
      ru: 'Теперь самым ясным образом Господь говорит о пленении Иерусалима. Поэтому я думаю, что слова:«прежде же всего того»(Лк. 21, 12) нужно разуметь так: прежде голода и мора, и прочих бед, какие случатся во время кончины мира, вас, апостолов, изгонят и прочее. Потом и для Иерусалима наступят бедствия. Поскольку они думали, что здания храма будут разрушены во время кончины, то Господь говорит: нет! Ибо во время кончины будут лжепророки, голод и мор от постоянных войн, имеющих возгореться вследствие того, что любовь иссякнет. А вы изгнаны будете прежде времени кончины, и Иерусалим будет взят в плен, и камни сии будут разрушены.«Когда... увидитегородИерусалим, окруженныйримскимивойсками, тогда знайте, что приблизилось... его... запустение».'
      cn: 现在，主以最清晰的方式谈论了耶路撒冷的被掳。因此，我认为「在这一切事以先」（路加福音 21:12）这句话应理解为：在饥荒、瘟疫以及世界末日时将要发生的其他灾难以先，你们这些使徒将被驱逐等等。之后，耶路撒冷自身的灾难也会随之而来。因为他们（使徒们）认为圣殿的建筑将在世界末日时被毁坏，所以主说：不！因为在末日时将有假先知、饥荒和瘟疫，这源于因爱心消退而持续爆发的战争。而你们将在末日之前被驱逐，耶路撒冷将被掳，这些石头也将被毁坏。「当你们看见耶路撒冷城被罗马军队围困时，就知道……它的……荒凉近了。」
  - type: paragraph
    initial:
      ru: 'Лк 21:21. '
      cn: （路加福音 21:21）
    text:
      ru: тогда находящиеся в Иудее да бегут в горы; и кто в городе, выходи из него; и кто в окрестностях, не входи в него,
      cn: 其时、在伊屋叠亚者当逃奔于山、在城内者宜外出、在鄕者勿入其中、
  - type: paragraph
    initial:
      ru: 'Лк 21:22. '
      cn: （路加福音 21:22）
    text:
      ru: потому что это дни отмщения, да исполнится всё написанное.
      cn: 盖此是报复之日、为凡所载者应也、
  - type: paragraph
    initial:
      ru: 'Лк 21:23. '
      cn: （路加福音 21:23）
    text:
      ru: 'Горе же беременным и питающим сосцами в те дни; ибо великое будет бедствие на земле и гнев на народ сей:'
      cn: 彼日、祸哉、怀孕者、乳养者、盖有大灾临地、震怒在斯民、
  - type: paragraph
    text:
      ru: За сим оплакивает те бедствия, кои постигнут тогда город.«Находящиеся в Иудее», – говорит, – пусть«бегут в горы»; находящиеся в окрестностях пусть не надеются, что их сберегут стены города, но и те, кои будут внутри города, пусть выходят из него вон. Потому что это будут дни отмщения, чтобы исполнилось написанное, особенно в книге пророка Даниила (Дан. 9, 26–27).«Горе... беременным»(в те дни), ибо они по причине тяжести чрева не могут бежать,«и питающим сосцами», ибо по причине сильной любви к детям не могут они ни оставить их без присмотра, ни увести их с собой. Некоторые говорят, что Господь сим намекает на заклание детей, о котором рассказывает Иосиф и пророчествует Иеремия (Иер.11, 22).
      cn: 继而，他哀叹届时将要临到那城的那些灾祸。他说：「在犹太的，」应「逃到山上去」；那些在外围的人不要指望城市的城墙会保护他们，那些在城内的人也应出来。因为那些日子将是报仇的日子，为要应验所记载的，尤其是在先知但以理的书中所记载的（但以理书 9:26-27）。「祸哉……怀孕的」（在那些日子），因为她们因腹部的沉重无法逃跑，「和乳养的」，因为她们对孩子的强烈的爱，使她们既不能弃之不顾，也不能带着他们一起逃走。有些人说，主借此暗示了约瑟夫（Josephus）所讲述、耶利米（耶利米书 11:22）所预言的屠杀儿童之事。
  - type: paragraph
    initial:
      ru: 'Лк 21:24. '
      cn: （路加福音 21:24）
    text:
      ru: и падут от острия меча, и отведутся в плен во все народы; и Иерусалим будет попираем язычниками, доколе не окончатся времена язычников.
      cn: 有死于刀刃者、有被掳至诸异邦者、耶鲁萨利木为异邦人蹂践、直至异邦人之期满焉、
  - type: paragraph
    text:
      ru: '«И Иерусалим, – говорит, –будет попираем язычниками». Доселе речь была о пленении: потом о кончине.'
      cn: 「耶鲁萨利木，」 他说，「为异邦人蹂践。」 直到此处，言语皆论及被掳之事；随后则论及终结。
  - type: paragraph
    initial:
      ru: 'Лк 21:25. '
      cn: （路加福音 21:25）
    text:
      ru: И будут знамения в солнце и луне и звездах,
      cn: 日月星辰、必有异兆、地上诸邦在颠沛之时、将有困烦、以及踌躇、海涛淜湃、
  - type: paragraph
    text:
      ru: «Будут, – говорит, –знамения в солнце и луне и звездах». Ибо с переменой в твари естественно быть новому порядку и в стихиях.
      cn: 「将有，——他说，——在日、月、星辰上出现的异兆。」因为随着受造物（tvari）的改变，在诸元素中自然会有新的秩序。
  - type: paragraph
    text:
      ru: а на земле уныние народов и недоумение;
      cn: 而 在地上，诸民族的 愁闷 以及 困惑；
  - type: paragraph
    text:
      ru: У народов будет «уныние», то есть скорбь, смешанная с недоумением во всем.
      cn: 在诸民族中，将会有「颓丧」——亦即，混杂着对万事万物的困惑不解的忧伤。
  - type: paragraph
    text:
      ru: и море восшумит и возмутится;
      cn: 和大海将要喧哗，也将要动荡；
  - type: paragraph
    initial:
      ru: 'Лк 21:26. '
      cn: （路加福音 21:26）
    text:
      ru: люди будут издыхать от страха и ожиданиябедствий,грядущих на вселенную,
      cn: 人人由畏惧以俟候降来于普世者、而气绝、盖众天力亦将震动、
  - type: paragraph
    text:
      ru: Море будет страшно шуметь, и наступят боязнь и смущение, так что люди будут издыхать от одного страха и ожидания бедствий, идущих на вселенную. Видишь ли? Он ясно говорит здесь о кончине мира. Ибо выше говорил, что Иерусалим будет окружен и попираем языческими войсками, а здесь говорит о наступлении бедствий для вселенной. Значит, теперь речь у Него о кончине вселенной.
      cn: 海洋将会可怖地喧嚣，恐惧与混乱也必会降临，以至于人们会因对那临到普世的灾祸的恐惧和期待而气绝。你看到了吗？他在此清晰地论及世界的终结。因为上文他论及耶路撒冷将会被异教军队围困和践踏，而在此处，他却在论及灾祸降临于整个普世。这意味着，他现在所谈论的是普世的终结。
  - type: paragraph
    text:
      ru: ибо силы небесные поколеблются,
      cn: 盖因众天力亦将震动、
  - type: paragraph
    text:
      ru: Что Я говорю (говорит Он), что при изменении всей твари смутятся люди? Самые Ангелы и первейшие Силы смутятся и ужаснутся при столь страшных переменах во всем.
      cn: 「我所言说（祂言说），」当整个受造物变动时，世人将要困惑不安吗？最天使们和最初的诸能力都将因万物之中如此可怖的剧变而困惑不安，且惊恐战栗。
  - type: paragraph
    initial:
      ru: 'Лк 21:27. '
      cn: （路加福音 21:27）
    text:
      ru: и тогда увидят Сына Человеческого, грядущего на облаке с силою и славою великою.
      cn: 其时、必见人子以大力大荣乘云而降至、
  - type: paragraph
    text:
      ru: «И тогда увидят Сына Человеческого». Кто? Все верующие и неверующие.«Грядущего на облаке», то есть как Бог, с силой и славой великой. Ибо тогда и Сам Он, и крест Его возблистает лучше солнца, всеми будет признан.
      cn: 「其时、必见人子。」谁呢？所有的信者与不信者。「驾云而降至，」也就是说，作为上帝，以大能和极大的荣光降临。因为那时，他自己和他的十字架将比太阳更加闪耀，为所有人所承认。
  - type: paragraph
    initial:
      ru: 'Лк 21:28. '
      cn: （路加福音 21:28）
    text:
      ru: Когда же начнет это сбываться, тогда восклонитесь и поднимите головы ваши, потому что приближается избавление ваше.
      cn: 〇此等将成起之时、尔等即兴起翘首、因尔等之救赎近矣、
  - type: paragraph
    text:
      ru: 'Как первое пришествие Господа было для воссоздания и возрождения душ наших, так второе – будет для возрождения наших тел. Поскольку души умерли прежде, чрез преслушание, а тела самым делом подверглись смерти спустя девятьсот лет после преслушания, то и возрождаются они и улучшаются последовательно, души – чрез первое пришествие, а тела – чрез второе. Поэтому и Господь говорит: когда это начнет сбываться, вы, отягченные тлением, восклонитесь и пользуйтесь свободой. Ибо настанет искупление ваше, то есть совершенное освобождение обоих, то есть души и тела. Предлог, кажется, именно указывает на совершенное избавление от тления, каковое получит тогда и тело, по благодати Господа, упраздняющего последнего врага – смерть (1Кор. 15:26, 53, 57). Ибо Он упразднил начала и власти и искупил душу. Оставалась еще смерть, которая питалась нашими телами; упразднение оной будет причиной нашей свободы и искупления. При исполнении сего, Царствие Божие тотчас настанет.'
      cn: 正如主的第一次降临是为了我们灵魂的重建与复兴，祂的第二次降临则将是为了我们肉体的重生。因为灵魂是先死的，借由不顺从（преслушание），而肉体则是在不顺从之后九百年才真正遭受死亡，所以它们（灵魂与肉体）是依次复活并得以改善的：灵魂借由第一次降临，肉体借由第二次降临。因此主也说：当这些事开始应验时，你们这些被败坏（тлением）所重压之人，当兴起并享受自由。因为你们的救赎（искупление）近了，即两者的完全解放，亦即灵魂与肉体的完全解放。介词（Предлог，指「救赎」）似乎正指明了对败坏的彻底解脱，肉体那时也将凭藉主的恩典获得这种解脱，因祂要废除那末了的仇敌——死亡（哥林多前书 15:26，53，57）。因为祂已经废除了执政的（начала）和掌权的（власти），并救赎了灵魂。死亡仍存留着，它以我们的肉体为食；废除死亡将成为我们自由与救赎的原因。当此事实现时，上帝的国度便会立即降临。
  - type: paragraph
    initial:
      ru: 'Лк 21:29. '
      cn: （路加福音 21:29）
    text:
      ru: 'И сказал им притчу: посмотрите на смоковницу и на все деревья:'
      cn: 彼设譬喻告伊等曰、尔等见无花果树与诸树、
  - type: paragraph
    initial:
      ru: 'Лк 21:30. '
      cn: （路加福音 21:30）
    text:
      ru: когда они уже распускаются, то, видя это, знаете сами, что уже близко лето.
      cn: 方萌芽时、尔等视之、则自知夏时至矣、
  - type: paragraph
    initial:
      ru: 'Лк 21:31. '
      cn: （路加福音 21:31）
    text:
      ru: Так, и когда вы увидите то сбывающимся, знайте, что близко Царствие Божие.
      cn: 如是尔等迨见此等将成之时、则知上帝之国近矣、
  - type: paragraph
    text:
      ru: Как смоковница, когда на ней распускаются листья, указывает на приближение лета, так и появление сих знамений и преобразование вселенной служат признаком того, что наступает«лето», то есть Царствие Божие, для праведников наступающее именно как лето после зимы и бури. Между тем для грешников тогда настанет зима и буря. Ибо они настоящий век считают летом, а будущий для них – буря.
      cn: 如同无花果树在叶子展开时预示着夏季的临近，同样，这些异象的出现以及宇宙的转变，也标志着「夏天」——即上帝之国——正在降临。对于义人而言，上帝之国正如同冬日和暴风雨后的夏季一般降临。然而，对于罪人来说，那时将是冬季和暴风雨。因为他们将现今的时代视为夏季，而将未来的时代视作他们的暴风雨。
  - type: paragraph
    initial:
      ru: 'Лк 21:32. '
      cn: （路加福音 21:32）
    text:
      ru: 'Истинно говорю вам: не прейдет род сей, как всё это будет;'
      cn: 我诚告尔等、此世代未逝、直至此皆成、
  - type: paragraph
    text:
      ru: '«Истинно говорю вам: не прейдет род сей, как все это будет». Родом называет не тех, кои тогда жили, но все поколения верующих. Ибо Писание называет иногда родом и тех, кои сходны в нравах, например:«Таков род ищущих Его»(Пс. 23, 6).'
      cn: 「我诚告尔等：此世代未逝，直至此皆成」。他称之为「世代」（род），并非指当时活着的人，而是指所有信徒的世代（поколения верующих）。因为圣经有时也将那些在习性上相似的人称为「世代」（род），例如：「这是寻求上主之世代」（诗篇 23:6）。
  - type: paragraph
    initial:
      ru: 'Лк 21:33. '
      cn: （路加福音 21:33）
    text:
      ru: небо и земля прейдут, но слова Мои не прейдут.
      cn: 天地将逝、而我之诸言必不逝、
  - type: paragraph
    text:
      ru: 'Поскольку Он сказал, что имеют быть смятения и войны, и перемены как в стихиях, так и в самых предметах, то, чтобы кто не пришел к мысли, не рушится ли когда-нибудь и христианство, Он говорит: нет! род сей, то есть род христиан, никогда не прейдет. Небо и земля изменятся, а слова Мои и Евангелие Мое не рушатся, а пребудут навсегда, хотя бы и все поколебалось, и вера в Меня не оскудеет. Отсюда видно также, что Церковь Он предпочитает всей твари: ибо тварь изменится, а из Церкви верных, равно из Его слов и Евангелия, ничто не погибнет.'
      cn: 既然祂说过，将会有动乱和战争，以及无论是元素（стихиях）还是事物本身都将发生变化，那么，为了不使任何人产生「基督教是否会终有一日崩溃」的想法，祂说：不会的！这个世代（род сей），也就是说，基督徒的世代（род христиан），永远不会消逝。天地将会改变，而我的话语和我的福音不会崩溃，它们将永远存留，即使万物都动摇，对我的信仰也不会衰竭。由此也可看出，祂将教会置于所有受造物之上：因为受造物将会改变，而教会中的信徒，如同祂的话语和福音一样，任何事物都不会毁灭。
  - type: paragraph
    initial:
      ru: 'Лк 21:34. '
      cn: （路加福音 21:34）
    text:
      ru: Смотрите же за собою, чтобы сердца ваши не отягчались объядением и пьянством и заботами житейскими,
      cn: 尔等当自慎、为恐尔等之心餍饫沉湎及世虑而在累钝时、则其日突然临于尔等、
  - type: paragraph
    text:
      ru: Вы, – говорит, – слышали об ужасах и смятениях. Все они чувственно и предызображают те бедствия, кои постигнут грешников. Но против сих бед есть сильное и противодействующее средство – молитва и внимательность к себе. Ибо всегдашняя готовность и ожидание кончины может все это победить. А она будет у вас под тем условием, – говорит, – если вы будете бодрствовать и сердца ваши не будут отягчаемы«объядением и пьянством, и заботами житейскими».
      cn: 「你们，——祂说，——已经听到了那些恐惧和骚乱。所有这些都在感官上预示并预先描绘着那些将要降临到罪人身上的灾难。但对抗这些灾难，有一种强大且具有抵抗作用的手段——那就是祷告和对自身的警醒。因为持久的准备和对终结的期盼可以战胜这一切。祂说，这（期盼）会在你们身上实现，条件是，你们必须警醒，并且你们的心不被『饕餮、沉湎和世俗的忧虑』所累。」
  - type: paragraph
    text:
      ru: и чтобы день тот не постиг вас внезапно,
      cn: 且使那日不突然临到你们。
  - type: paragraph
    initial:
      ru: 'Лк 21:35. '
      cn: （路加福音 21:35）
    text:
      ru: ибо он, как сеть, найдет на всех живущих по всему лицу земному;
      cn: 盖如网罗来临于一切居普地之面上者也、
  - type: paragraph
    text:
      ru: Ибо день тот не придет с наблюдением, но неожиданно, тайно, как сеть, захватывающая невнимательных к себе. Иной, может быть, станет до тонкости исследовать выражение:«живущих(сидящих)по всему лицу земному». День оный захватит сетью тех, кои ведут жизнь беззаботную и праздную. Ибо они именно суть сидящие, и они попадаются в сеть. Но кто деятелен и трудолюбив, бодр на совершение добра и всегда стремится к добру, не сидит и не успокаивается земными предметами, но возбуждает себя и говорит себе:«Встаньте и уходите, ибостранасия не есть место покоя»(Мих. 2, 10), и желает лучшего отечества, для того день оный не есть сеть и беда, но как бы праздник.
      cn: 盖因那日非带着监察（或：注意）而来临，而是出乎意料、隐秘地，如网罗一般，捕获那些不留意自身者。或许有人会开始细致地探究：「居普地之面上者」（或作：坐于全地面上者）这一措辞。那日将以网罗捕获那些过着无忧无虑、虚度光阴的生活者。盖因他们正是那「坐着」的人，并且他们落入了网罗之中。然而，那勤勉而辛劳、警醒行善且恒常致力于良善之人，不坐着，亦不因属世之物而安息，反倒自我激励，对自己言说：「起来，你们走吧！因为此地并非安息之所」（弥迦书 2:10），并渴求一个更美好的家乡，对于他而言，那日非网罗，亦非灾祸，而是如同一个节期。
  - type: paragraph
    initial:
      ru: 'Лк 21:36. '
      cn: （路加福音 21:36）
    text:
      ru: итак бодрствуйте на всякое время и молитесь, да сподобитесь избежать всех сих будущихбедствийи предстать пред Сына Человеческого.
      cn: 故时时祈祷警醒、为尔等堪得逃避于此一切所将成者、而立于人子之前、
  - type: paragraph
    text:
      ru: Поэтому нужно бодрствовать и молиться Богу, чтобы нам можно было избежать всех будущих бедствий, Каких же? Быть может, во-первых, голода и мора, и прочих, которые избранных не так будут тяготить, как прочих, а напротив, избранных-то ради сократятся и для прочих; может быть, во-вторых, тех, кои навеки наступят для грешников, ибо мы не можем избежать оных иначе, как только бдением и молитвой. Поскольку же для великодушных недостаточно избежать озлобления, но им нужно еще получить благо какое-нибудь, то, сказав, чтобы вы могли избежать всех будущих бедствий, Господь присовокупил:«и предстать пред Сына Человеческого», в чем и состоит наслаждение благами. Ибо христианину должно не только избегать зол, но и стараться получить славу. А то, чтоб стоять пред Сыном Человеческим и Богом нашим, есть ангельское достоинство. Ибо сказано:«Ангелы их на небесах всегда видят лице Отца Моего»(Мф. 18.10).
      cn: 因此，需要警醒并向上帝祈祷，好使我们能够逃脱所有未来的灾祸。是哪些灾祸呢？或许，首先是饥荒、瘟疫以及其他那些不会像困扰其他人那样困扰选民的灾祸，相反，恰恰是为了选民的缘故，这些灾祸也会为其他人而缩短；或许，其次是那些将永远临到罪人身上的灾祸，因为我们无法以其他方式，唯独通过警醒和祈祷方能逃脱它们。既然仅仅逃脱苦害对于心胸宽宏之人而言是不够的，他们还需要获得某种福祉，所以，在说了「使你们可以逃脱所有未来的灾祸」之后，主又添上了：「并立于人子之前」，而这正是享乐福祉之所在。因为，基督徒不仅应当逃避邪恶，而且也当努力获得荣耀。而立于人子即我们的上帝面前，乃是天使的尊严。因为经上说：「他们的天使在天上，时常瞻仰我父的慈颜」（马太福音 18:10）。
  - type: paragraph
    initial:
      ru: 'Лк 21:37. '
      cn: （路加福音 21:37）
    text:
      ru: Днем Он учил в храме, а ночи, выходя, проводил на горе, называемой Елеонскою.
      cn: 〇彼日日在殿教训、夜夜出至山名橄榄而宿、
  - type: paragraph
    initial:
      ru: 'Лк 21:38. '
      cn: （路加福音 21:38）
    text:
      ru: И весь народ с утра приходил к Нему в храм слушать Его.
      cn: 庶民蚤起入殿、就彼以听训之、
  - type: paragraph
    text:
      ru: Евангелисты, особенно три первые, не передали очень многого из того, чему учил Господь. Правда, и сам Иоанн умолчал об очень многом, однако ж, он сверх того, что передали трое, изложил некоторые высшие уроки Господа. Господь, как можно догадываться, многим и высоким истинам учил собирающихся во храме. Что евангелисты сказали немногое, ибо и не желали объявлять всего, это видно как из многого другого, так немало можно заключить о сем и из того, что они, тогда как Господь учил почти три года записали так мало Его уроков, что, по моему мнению, не заслуживает порицания тот, кто сказал бы, что их можно было бы передать менее чем в целый день. Итак, святые евангелисты из многого написали немногое, чтобы лишь только передать вкус сладости. Господь говорил не со всеми одинаково, но каждому предлагал полезное. Поэтому народ с утра приходит к Нему. Ибо благодать изливалась из уст Его. А ночью Господь удалялся на гору, показывая нам, что во время тишины ночной нужно беседовать с Богом, а днем во время столкновений с людьми приносить им пользу, и ночью собирать, а днем раздавать собранное. Сам Он не нуждался в молитве или общении с Богом. Ибо Сам будучи Бог, не имел в чем бы Ему смиряться, но для нас положил это в образец, чтобы мы во время ночи, подобно колодезям, забирали в себя сток из духовных жил – молитвы, а днем из нас вычерпывали бы те, кои нуждаются в полезном. Смотря на то, как тогда народ с утра приходил к Иисусу слушать Его, иной сказал бы, что к Нему идут слова Давида:«Боже! Ты Бог мой, Тебя от ранней зари ищу я; Тебя жаждет душа моя»(Пс. 62, 2).
      cn: 福音书作者们，尤其是前三位，并没有传达出主所教导的许多内容。诚然，伊鄂昂自己也对许多内容保持了缄默，然而，他除了那三位所传达的之外，还阐述了主的一些更高的课程。正如可以推测的，主曾向聚集在圣殿中的人教导了许多高深的真理。福音书作者们所说的内容很少，因为他们并不希望公布一切，这一点从许多其他方面就可以看出；同样，从主教导了近三年，而他们所记录的祂的课程却如此之少，这一点也可以得出不少结论。依我之见，如果有人说这些课程本可以在不到一整天的时间内传达完毕，那他也不应受到指责。因此，圣洁的福音书作者们从许多内容中只写了少部分，目的仅在于传达出甜美的滋味。主说话并非与所有人一律相同，而是向每个人提供有益的内容。因此，民众一大早就来到祂面前。因为恩典从祂的口中流淌出来。而到了晚上，主就独自退到山上，向我们表明，在寂静的夜晚，需要与上帝交谈，而在白天与人发生冲突时，则要造福他们，并在夜间收集，在白天分发所收集的。祂自己并不需要祷告或与上帝交通。因为祂自己就是上帝，没有需要祂谦卑的地方，但祂将此立为我们的典范，好让我们在夜间，如同水井一般，将属灵脉络中的流泉——即祷告——吸纳到我们自身之中，而在白天，那些需要有益事物的人就可以从我们这里汲取。看到那时民众从早上就来到耶稣那里听祂教导，有人会说大卫的话正应验在祂身上：「上帝啊，祢是我的上帝，我从清晨就寻求祢；我的心渴慕祢」（诗篇 62:2）。
- type: heading1
  text:
    ru: Глава двадцать вторая
    cn: 第二十二章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 22:1. '
      cn: （路加福音 22:1）
    text:
      ru: Приближался праздник опресноков, называемый Пасхою,
      cn: 除酵节、名葩斯哈将近、
  - type: paragraph
    initial:
      ru: 'Лк 22:2. '
      cn: （路加福音 22:2）
    text:
      ru: и искали первосвященники и книжники, как бы погубить Его, потому что боялись народа.
      cn: 司祭首及学士等寻求如何杀之、盖彼等惧民、
  - type: paragraph
    text:
      ru: Книжники искали убить Его (Иисуса). Поскольку же наступало время Пасхи, и они, поэтому видели для себя опасность от собирающегося народа, особенно на праздник, то они изыскивали, наконец, способ, как бы убить Его, не подвергаясь никакой опасности.
      cn: 文士们寻求杀害祂（耶稣）。因为逾越节的时间正在临近，并且他们因此预见到聚集的民众（特别是在节日期间）会给自己带来危险，所以他们最终想方设法，要如何杀害祂，而不必冒任何风险。
  - type: paragraph
    initial:
      ru: 'Лк 22:3. '
      cn: （路加福音 22:3）
    text:
      ru: Вошел же сатана в Иуду, прозванного Искариотом, одного из числа двенадцати,
      cn: 萨他那已入于十二中之一伊屋达、称伊斯喀利沃特者、
  - type: paragraph
    text:
      ru: '«Вошел же сатана в Иуду»,«одного из числа двенадцати», то есть одного из приближенных и искренних учеников. Никто не надейся на самого себя, но будь внимателен к своей жизни, потому что имеешь страшного врага. Некоторые же слова:«одного из числа двенадцати»понимали так: дополняющего только собой число апостолов, но не истинного апостола и ученика. Ибо что за истинный ученик тот, кто воровал опускаемое в ящик? (Ин. 12, 6).'
      cn: 「撒但已入于伊屋达」，「十二中之一」，也就是说，他是亲近且真诚的门徒中的一个。没有人应当倚靠自己，而要对自己的人生保持警觉，因为你有一个可怕的仇敌。还有一些人理解「十二中之一」这些话语，认为（伊屋达）只是用自己补足了使徒的数目，却并非真正的使徒和门徒。因为那盗取放入钱箱之物的人，算什么真正的门徒呢？（伊鄂昂福音 12:6）。
  - type: paragraph
    initial:
      ru: 'Лк 22:4. '
      cn: （路加福音 22:4）
    text:
      ru: и он пошел, и говорил с первосвященниками и начальниками, как Его предать им.
      cn: 彼遂往告诸司祭首及庶司如何付之于彼等、
  - type: paragraph
    initial:
      ru: 'Лк 22:5. '
      cn: （路加福音 22:5）
    text:
      ru: Они обрадовались и согласились дать ему денег;
      cn: 而彼等欢喜、约以银钱予之、
  - type: paragraph
    initial:
      ru: 'Лк 22:6. '
      cn: （路加福音 22:6）
    text:
      ru: и он обещал, и искал удобного времени, чтобы предать Его им не при народе.
      cn: 伊诺且寻机、为勿当民付之予彼等、
  - type: paragraph
    text:
      ru: Таким образом Иуда принял вошедшего в него сатану и согласился предать Иисуса ищущим Его. Ибо это означает слово«обещал», то есть окончательно заключил условие и договор. И искал удобного времени, когда бы застать Его (Иисуса) без народа, то есть наедине, и предать им.«Начальниками»называет здесь начальников над зданиями храма, или надзирателей за благочинием. Ибо римляне приставили некоторых надсмотрщиков за народом, чтобы он не возмущался, ибо был мятежен. Этих-то называет начальниками (по церковно-славянски –«воеводами»). А быть может, воеводами названы те, кои, принадлежа к составу священническому, имели военные должности. Ибо, страдая любовью к первенству, они вмешивались и в такие должности. Поэтому и назвал их воеводами храма, быть может, с тем, чтоб чувствительнее задеть их.
      cn: 因此，犹大接受了进入他里面的撒旦，并同意出卖正在寻找祂（耶稣）的人。因为「承诺」这个词正是这个意思，即最终确定了条件和契约。他寻找一个便利的时刻，能够在没有民众在场时，也就是独自一人时，抓住祂（耶稣），并把祂交给他们。这里的「首领们」（начальниками）指的是那些圣殿建筑物的首领，或是负责维持秩序的监督者。因为罗马人曾委派一些监察者管理民众，以防他们造反，因为民众素来好生事。他称这些人作首领们（在教会斯拉夫语中是：「将帅们」）。又或许，被称作将帅们的，是那些隶属于祭司阶层、但拥有军事职位的人。因为他们患有对居首位之位的喜爱，故而也干预此类职位。因此，他称他们为圣殿的将帅们，或许是为了更敏锐地触及他们。
  - type: paragraph
    initial:
      ru: 'Лк 22:7. '
      cn: （路加福音 22:7）
    text:
      ru: Настал же день опресноков, в который надлежало заколать пасхальногоагнца,
      cn: 除酵节期来至、乃当宰葩斯哈时、
  - type: paragraph
    text:
      ru: Что пасха, по-еврейски называемая фасек, означает выход из Египта, об этом многие говорили, и вообще все, что совершалось тогда в этот праздник, святые изъяснили. А нам нужно сказать о том, какой день называется днем опресноков. «Днем опресноков» называет четверток, в вечеру которого нужно было закалать пасху.
      cn: 逾越节，按犹太人的说法称为「法塞克」（Fasek），意味着出埃及。关于这一点，许多人都说过，而且总而言之，那时在这节期中所成就的一切，圣徒们已经阐释了。而我们需要说明的是，哪一天被称为「除酵节期」（「Dnem opresnokov」）。它把星期四称为「除酵节期」，按规定，正是在该日傍晚需要宰杀逾越节羊羔。
  - type: paragraph
    initial:
      ru: 'Лк 22:8. '
      cn: （路加福音 22:8）
    text:
      ru: 'и послалИисусПетра и Иоанна, сказав: пойдите, приготовьте нам есть пасху.'
      cn: 彼遣撇特儿与伊鄂昂曰、前往、预备葩斯哈为我等食之、
  - type: paragraph
    initial:
      ru: 'Лк 22:9. '
      cn: （路加福音 22:9）
    text:
      ru: 'Они же сказали Ему: где велишь нам приготовить?'
      cn: 彼等语之曰、尔欲我侪何处预备、
  - type: paragraph
    initial:
      ru: 'Лк 22:10. '
      cn: （路加福音 22:10）
    text:
      ru: 'Он сказал им: вот, при входе вашем в город, встретится с вами человек, несущий кувшин воды; последуйте за ним в дом, в который войдет он,'
      cn: 彼对之曰、顾、尔等入城之时、有一挈水瓶之人将遇尔等、从之、随入其所入之家、
  - type: paragraph
    text:
      ru: Итак, в четверток, быть может, утром, Господь посылает учеников Петра и Иоанна, одного как любящего, другого как любимого, посылает в «чужой» дом; ибо ни Сам, ни ученики не имели собственного, иначе Он совершил бы пасху у кого-либо из учеников. Смотри, какая бедность! Посылает их к человеку неизвестному, чтобы показать, что Он и страдания воспринимает добровольно. Ибо если бы Он не желал страдать, то, преклонив ум сего неизвестного человека к принятию их (Себя и учеников), Он мог бы и в иудеях произвести то, что Ему угодно. Некоторые говорят, что Господь не сказал имени сего человека и не объявил его, но доводит учеников до дома его по некоторому признаку для того, чтобы предатель, узнав имя, не указал фарисеям дом сей, и они не пришли бы взять Его прежде, нежели Он установит вечерю, прежде чем преподаст духовные Свои тайны. Поэтому Христос, спустя немного, говорит:«очень желал Я есть с вами сию пасху прежде Моего страдания». То есть Я приложил всё старание, чтобы нам укрыться от предателя, чтобы не подвергнуться страданию прежде времени, прежде нежели преподам таинства. Такое объяснение кто хочет, может принимать.
      cn: '因此，在周四，或许是在早晨，主派遣了门徒彼得和伊鄂昂——一个作为爱慕者（施爱者），另一个作为被爱者——派遣他们前往一个「陌生人的」家；因为祂自己和门徒都没有自己的居所，否则祂本可在门徒中的任何一人的家里举行逾越节。看啊，这是何等的贫乏！祂派遣他们去一个不为人知的人那里，是为了表明祂是自愿承受苦难的。因为如果祂不愿意受苦，那么祂本可以促使这位不为人知者的心意接受他们（祂自己和门徒），并且祂本可以在犹太人中行出祂所愿之事。


        有些人说，主没有说出这个人的名字，也没有宣告他，而是通过某种记号引导门徒到达他家，这是为了让那出卖者在得知名字后，不会向法利赛人指出这个家，以防他们在祂设立晚宴之前、在祂传授祂属灵的奥秘之前前来捉拿祂。因此，基督在稍后说：「我非常愿意在受难以前，同你们吃这逾越节的筵席。」（路加福音 22:15）也就是说，我已尽了所有的努力，好让我们能够躲避那出卖者，好让我们不会过早遭受苦难，不会在传授奥秘之前遭受苦难。这样的解释，谁愿意，谁就可以接受。'
  - type: paragraph
    initial:
      ru: 'Лк 22:11. '
      cn: （路加福音 22:11）
    text:
      ru: 'и скажите хозяину дома: Учитель говорит тебе: где комната, в которой бы Мне есть пасху с учениками Моими?'
      cn: 幷告其家主曰、师问尔曰、室安在、乃我偕我门徒食葩斯哈者、
  - type: paragraph
    initial:
      ru: 'Лк 22:12. '
      cn: （路加福音 22:12）
    text:
      ru: И он покажет вам горницу большую устланную; там приготовьте.
      cn: 彼将示尔等以陈设俱备之大厅、在彼预备可也、
  - type: paragraph
    text:
      ru: Для чего же Господь совершает пасху? Для того чтобы всеми Своими действиями до последнего издыхания доказать, что Он не противник Закона. Будем же и мы есть сию пасху разумно, будем под днем опресноков разуметь всю жизнь, проводимую в духовном свете, не имеющую нисколько ветхости прежнего преслушания в Адаме. Проводя поистине такую жизнь, мы должны насыщаться тайнами Иисусовыми. Тайны сии будут приготовлять Петр и Иоанн, деятельность и созерцание, горячая ревность и мирная кротость. Ибо верующий должен быть пламенным на совершение добра, ревностным против зла и кротким к совершающим зло. Ибо должно ненавидеть зло, а не делающего зло. Сего нужно лечить, ибо он страдает. Делать зло то и значит, что быть смущаемым от лукавого и страдать злобой. Если мы будем иметь приготовляющих вечерю Петра и Иоанна, то есть добрую жизнь, которую изображает собой Петр, и истинное учение, которое изображает Иоанн Богослов, то с такими приготовителями встретится«человек», то есть мы найдем тогда истинно человеческое существо, созданное по образу Создателя, или лучше, Творца, носящее«кувшин воды». Вода означает благодать Духа, как учит евангелист Иоанн (Ин. 7, 38–39), а кувшин – удобосокрушимость и размягчимость сердца. Ибо принимающий духовную благодать бывает смирен и сокрушен сердцем, а смиренным Господь дает благодать (Иак. 4, 6). Сознавая себя землей и пеплом и говоря с Иовом:«Ты, как глину, обделал меня». (Иов. 10, 9), он будет носить благодать Духа в удоборазломимом и удобосокрушимом сосуде сердца своего. Последуя за таким настроением, мы войдем в дом ума, которого хозяин – ум, покажет нам большую убранную горницу.«Горница»– это есть высокое помещение ума, то есть божественные и духовные предметы, среди которых он живет и обращается с любовью. Они убраны, ибо у них нет ничего сурового, но и кривое для такого ума делается путем правым, как и Соломон сказал:«все они ясны для разумного и справедливы для приобретших знание»(Притч. 8, 9). Не погрешишь, если и то скажешь, что ум, хотя совершает высокое дело, действия по силе ума, однако ж, знание его еще простерто и очень близко к земле. Но знание поистине высокое, и незнание, превышающее ум, выше всякой высоты, когда ум уже не действует, но воспринимает действие. Прежде нам должно действовать умом своим, потом уже будет в нас действовать благодать Господа, восхищая нас, как и пророков, и отрешая от всякой естественной силы. Поистине говорится, что в таком-то пророке было восхищение от Господа. Подобно как и здесь, когда горница сия убрана, приходит Иисус с учениками Своими и совершает таинства, приходя к нам Сам и являя в нас Собственную Свою силу, а не ожидая нашего к Нему прихода. «Ученики» Бога Слова все суть размышления о сотворенном. Когда таким образом Слово будет действовать в нас, тогда мы уразумеем причастие пасхи и еще более насытимся размышлениями о сотворенном, по сказанному:«взираю на небеса – дело Твоих перстов»(Пс. 8, 4).
      cn: 主为何要守逾越节呢？是为了以祂自己直到最后一口气息的所有行为来证明，祂绝不是律法的反对者。我们也当明智地吃这逾越节宴，我们当将「无酵日」理解为在属灵之光中度过的整个人生，不带有丝毫先前在亚当里悖逆的陈旧（ ветхости）。真正度过这种生活，我们就必须以耶稣的奥秘为饱足。这些奥秘将由彼得和伊鄂昂、即活动（ деятельность）和默观（ созерцание）、炽热的嫉妒心（ ревность）与和平的温柔（ кротость）来预备。因为信徒必须在行善上是热情的，在反对邪恶上是嫉妒心切（ ревностным）的，而在面对行恶之人时则是温柔的。因为我们应当憎恨邪恶，而不是做恶事的人。后者需要被医治，因为他正受着苦。作恶就意味着被那恶者所搅扰，并承受着恶毒的痛苦。如果我们拥有预备晚宴的彼得和伊鄂昂，即彼得所象征的良善生活，以及使徒伊鄂昂（ Иоанн Богослов）所象征的真理教义，那么有如此预备者相遇的，将是「人」，也就是说，我们那时会找到真正的人性存在——是按照造物者，或者说，按照匠者（ Творца）的形象所造的，并「带着一罐水」。水象征着圣灵的恩典，正如传福音的伊鄂昂所教导的（约翰福音 7:38-39），而罐子则象征着心的易碎性和柔顺性（ размягчимость）。因为领受属灵恩典的人，心是谦卑和破碎的，而上帝将恩典赐予谦卑的人（雅各书 4:6）。他将自己视为尘土和灰烬，并与约伯一同说：「你待我如同泥土」（约伯记 10:9），他将把圣灵的恩典装在易碎易破的心之器皿里。跟随这种心境，我们将进入「心智之屋」（ дом ума），那里的主人——心智（ ум），将向我们展示一间布置好的大厅房。「厅房」（ Горница）——这是心智的高处空间，即神圣和属灵的客体，心智在其中以爱生活并与之交往。它们是「布置好」（ убраны）的，因为它们没有任何粗粝之处，甚至弯曲的道路对于这样的心智来说也成为了直路，正如所罗门所言：「它们对于明理的人都是显明的，对于得知识的人都是正直的」（箴言 8:9）。你若说，心智虽然在从事高处之事，即按照心智的能力（ по силе ума）而行动，然而其知识却仍是扩展（ простерто）且非常接近大地，你也不会犯错。但真正崇高的知识，以及超越心智的无知（ незнание, превышающее ум），是超越一切高处的，那时心智不再是行动者，而是接受行动（ воспринимает действие）者。首先我们必须以我们的心智去行动，然后主的恩典才会在我们里面行动，将我们像众先知一样提升（ восхищая），并使我们脱离一切自然的力量。正如经上所说，某位先知被主所提升（ восхищение）。与此类似，在这里，当这厅房布置好时，耶稣便带着祂的门徒前来，并施行奥秘，祂亲自来到我们这里并在我们里面显明祂自己的力量，而不是等待我们前去祂那里。「圣言（ Бога Слова）的门徒」都是对受造之物的思索（ размышления о сотворенном）。当圣言以这种方式在我们里面行动时，我们就会领悟逾越节的共享（ причастие）并且更加饱足于对受造之物的思索，正如经上所说：「我观看你指头所造的天」（诗篇 8:4）。
  - type: paragraph
    initial:
      ru: 'Лк 22:13. '
      cn: （路加福音 22:13）
    text:
      ru: Они пошли, и нашли, как сказал им, и приготовили пасху.
      cn: 彼等往而遇如其所言者、遂预备葩斯哈、
  - type: paragraph
    initial:
      ru: 'Лк 22:14. '
      cn: （路加福音 22:14）
    text:
      ru: И когда настал час, Он возлег, и двенадцать Апостолов с Ним,
      cn: 届时、彼席卧、其十二宗徒亦偕之、
  - type: paragraph
    text:
      ru: 'Пасху ели стоя: как же о Господе говорится, что Он возлег? Говорят, что, съев законную пасху, возлегли уже после, по общему обыкновению, есть прочие какие-нибудь яства.'
      cn: '出自圣奥赫里德的狄奥菲拉克：


        逾越节的食物是站着吃的：那么，为何谈及主时，却说祂「坐席（或「卧席」）」了呢？人们说，祂们在吃完律法上的逾越节羔羊之后，才坐席（或「卧席」）下来，按照通常的习俗，吃其他的一些食物。'
  - type: paragraph
    initial:
      ru: 'Лк 22:15. '
      cn: （路加福音 22:15）
    text:
      ru: 'и сказал им: очень желал Я есть с вами сию пасху прежде Моего страдания,'
      cn: 彼对之曰、我受难之先、意愿偕尔等食此葩斯哈、
  - type: paragraph
    text:
      ru: 'Господь говорит ученикам:«очень желал Я есть с вами сию пасху прежде Моего страдания». Он как бы так говорит: это для Меня последняя с вами вечеря, поэтому она любезна и вожделенна для Меня, ибо в последующее время Я не буду есть с вами. Это подобно тому, как имеющие отправиться в странствование последние речи с родными и друзьями ведут с большей приятностью и любовью. И иначе: Я«очень желал... есть с вами сию пасху», потому что в ней Я имею преподать вам великие таинства – таинства Нового Завета. Сим Он показывает, что Он добровольно будет страдать. Ибо Ему, так как Он знал о предстоящих страданиях, без сомнения, можно было уклониться от оных, подобно тому как и в предшествовавшее время (Ин. 8, 59).'
      cn: '主对门徒说：「我受难之先，极其意愿偕尔等食此逾越节（的晚餐）。」他仿佛如此说：这对我而言是与你们共度的最后一次晚餐，因此，它对我而言是可喜悦且令人渴慕的，因为在随后的时间里，我将不再与你们一同进食。这就如同那些将要踏上旅途的人，与亲友所说的最后的话语，总是带着更大的愉悦和爱意。


        另一种解释：我「极其意愿……偕尔等食此逾越节（的晚餐）」，因为在此晚餐中，我将要向你们传授伟大的奥秘——新约的奥秘。


        借此，他表明他是甘愿受难的。因为他既然知道即将到来的苦难，无疑可以躲避它们，正如在先前的时候那样（伊鄂昂福音 8:59）。'
  - type: paragraph
    initial:
      ru: 'Лк 22:16. '
      cn: （路加福音 22:16）
    text:
      ru: ибо сказываю вам, что уже не буду есть ее, пока она не совершится в Царствии Божием.
      cn: 盖我告尔等、从此我不复食之、直待成于上帝国、
  - type: paragraph
    initial:
      ru: 'Лк 22:17. '
      cn: （路加福音 22:17）
    text:
      ru: 'И, взяв чашу и благодарив, сказал: приимите ее и разделите между собою,'
      cn: 遂执爵、感谢曰、宜取之互分、
  - type: paragraph
    initial:
      ru: 'Лк 22:18. '
      cn: （路加福音 22:18）
    text:
      ru: ибо сказываю вам, что не буду пить от плода виноградного, доколе не придет Царствие Божие.
      cn: 盖我告尔等、由此葡萄之实我不复饮之、直待上帝国临焉、
  - type: paragraph
    text:
      ru: 'Слова:«не буду пить от плода виноградного, доколе не придет Царствие Божие»некоторые из святых разумели так: пока не воскресну. Ибо после воскресения, обращаясь с учениками, Он ел и пил с ними, как и Петр говорит Корнилию:«которые с Ним ели и пили, по воскресении Его из мертвых»(Деян. 10, 41). Что воскресение есть Царствие Божие, это очевидно. Ибо воскресение есть разрушение смерти. Смерть царствовала от Адама до Христа; а с того времени, разрушенная, она уступила победу и царство Господу, как сказано:«Смерть!... где твоя победа?»(Ос. 13, 14). И Давид говорит:«Господь царствует»(Пс. 92, 1), а потом в объяснение, как воцарился, присовокупляет:«облечен величием», когда тело избавилось от тления и украсилось Божеством, как Исаия говорит:«столь величественный в Своей одежде, выступающий в полноте силы Своей»(Ис. 63, 1). И сам Господь по воскресении говорит:«дана Мне всякая власть»(Мф. 28, 18). Итак, когда пришло воскресение, которое, как разрушившее смерть, названо Царствием Божиим, Господь опять пил с учениками в уверение, что Он воскрес не призрачно.'
      cn: '这些话：「从此葡萄的实我不复饮之、直待上帝国临焉」，一些圣者理解为：直到我复活。因为复活之后，祂与门徒相处时，同他们一同吃喝，正如彼得对哥尼流所言：「他们与祂一同吃喝，是在祂从死里复活以后」（使徒行传 10:41）。


        复活就是上帝之国，这是显而易见的。因为复活就是对死亡的毁灭。死亡从亚当到基督一直为王；而从那时起，死亡被毁灭，将胜利和国度让给了主，正如所言：「死亡啊！……你的胜利在哪里？」（何西阿书 13:14）。


        大卫也说：「上主作王」（诗篇 92:1），然后，为了解释祂如何作王，又补充道：「祂以威严为衣」，那时身体脱离了朽坏，并以神性为妆饰，正如以赛亚所言：「这位穿着如此庄严、凭着自己的大能大力前行的」（以赛亚书 63:1）。主自己复活后也说：「天上地下所有的权柄都赐给我了」（马太福音 28:18）。


        因此，当复活来临，这复活因毁灭了死亡而被称作上帝之国时，主又同门徒一同饮酒，以确信祂的复活并非虚假。'
  - type: paragraph
    text:
      ru: Иные же под Царствием Божиим разумели будущее состояние, а под питием Господа с нами в будущем веке – откровение Им тайн. Ибо Он, Человеколюбец, радуя нас, Сам радуется и, питая нас, Сам питается, и наше питье и пищу, то есть учение, вменяет в пищу Себе. Итак, Он будет тогда пить некоторое новое питье с достойными, открывая им всегда нечто новое и необычайное.
      cn: 另一些人理解「上帝国」指的是未来的状态，而将主在未来世代与我们同饮，理解为祂奥秘的启示。因为祂，这位爱人的主（Человеколюбец），在使我们喜悦之时，祂自己也喜悦；在喂养我们之时，祂自己也得喂养；并且将我们的饮宴和食物，也就是教导，算作祂自己的食物。因此，祂届时将与配得的人同饮某种新的饮品，总是向他们启示一些新的、非凡的事物。
  - type: paragraph
    initial:
      ru: 'Лк 22:19. '
      cn: （路加福音 22:19）
    text:
      ru: 'И, взяв хлеб и благодарив, преломил и подал им, говоря: сие есть Тело Мое, которое за вас предается; сие творите в Мое воспоминание.'
      cn: 又取饼感谢擘而予之曰、斯乃我体、代尔众所舍者、尔当行此为我之记忆、
  - type: paragraph
    initial:
      ru: 'Лк 22:20. '
      cn: （路加福音 22:20）
    text:
      ru: 'Также и чашу после вечери, говоря: сия чашаестьновый завет в Моей Крови, которая за вас проливается.'
      cn: 晚筵后、爵、亦如是曰、此爵系新约在我血、乃为尔等所流者、
  - type: paragraph
    text:
      ru: 'Кажется, Лука упоминает о двух чашах. Об одной говорит:«приимите ее и разделите между собою»(Лк. 22, 17), которую иной может назвать образом Ветхого Завета, а о другой говорит после преломления и раздаяния хлеба. Господь Сам разделяет ее между учениками, называет ее новозаветной и говорит, что она обновляется в Его Крови. Ибо, когда был дан Ветхий Закон, то печатью употреблена была кровь неразумных животных (Исх. 24,5–8); а ныне, когда Бог Слово стал Человеком, Новый Завет для нас запечатлевается Его Кровью. Словами:«которое за вас предается»и«которая за вас проливается»не то показывает, что Тело Его предано и Кровь Его пролита за одних только апостолов, но за весь род человеческий. Итак, когда говорит, что«за вас"предается, ты понимай: за ваш род человеческий.'
      cn: 听起来，路加似乎提到了两只爵。关于其中一只，他说：「你们拿去，彼此分着喝罢」（路加福音 22:17），这只爵有人可能会称之为旧约的象征；而关于另一只，他是在擘饼和分发饼之后才说的。主亲自在门徒中间分了这爵，称它为新约的爵，并说这爵是靠着祂的血得以更新的。因为，当旧约律法颁布时，所用的印记是不具理性的动物的血（出埃及记 24:5-8）；而如今，当道成肉身的上帝成为人时，新约便借着祂的血为我们盖上了印记。借着「为你们舍的」（Тело Его предано）和「为你们流的」（Кровь Его пролита）这些话语，他所表明的并非是祂的身体被舍和祂的血被流仅仅是为了使徒们，而是为了全人类。因此，当祂说「为你们」舍的时候，你当理解为：是为你们人类。
  - type: paragraph
    text:
      ru: 'Древняя пасха совершалась во избавление от рабства египетского, и кровь агнца проливалась за сохранение первенцев: а новая пасха – во оставление грехов и в сохранение помыслов, назначенных и посвященных Богу.'
      cn: 古代的逾越节是为了从埃及的奴役中得到救赎，羔羊的血是为了保守长子们：而新的逾越节则是为了赦免罪愆，并保守那些被指定并献给上帝的意念（心意）。
  - type: paragraph
    text:
      ru: Прежде преподается хлеб, а потом – чаша. Ибо прежде бывает деятельность трудная и неудобосовершимая. Добродетели предшествует пот, подобно как и хлеб не только возделывается в поте лица, но и во время употребления требует трудов (Быт. 3, 19). Потом уже, после трудов, бывает радование от благодати Божией, что означается чашей. Ибо кто потрудится в неудобосовершимой добродетели, тот впоследствии удостаивается дарований и испытывает доброе опьянение, отрешаясь от мира сего, как Павел и Давид или, если еще смелее сказать, как Бог у пророка Аввакума.
      cn: 首先赐予的是饼，然后才是杯。因为首先出现的是困难且难以达成的活动。德行之前必有汗水，如同饼食不仅需在额头流汗中耕作，而且在食用之时也需要劳苦（创世记 3:19）。然后，在劳苦之后，才有来自上帝恩典的欢喜，这由杯所象征。因为谁在难以达成的德行上劳苦，谁随后就被授予恩赐，并体验到良善的沉醉，从此世超脱，如同保罗和大卫，或者，如果更大胆地说，如同上帝在先知哈巴谷书中所描述的那样。
  - type: paragraph
    initial:
      ru: 'Лк 22:21. '
      cn: （路加福音 22:21）
    text:
      ru: И вот, рука предающего Меня со Мною за столом;
      cn: 然顾卖我者之手同我在案上、
  - type: paragraph
    text:
      ru: Нет ничего несчастнее души, закосневшей в упорстве. Ибо смотри, что говорит Господь:«вот рука предающего Меня со Мною за столом», а безумный не очувствовался. Господь говорит это не только для того, чтобы показать, что Он знает имеющее случиться, но и для того, чтобы явить нам Свою благость и злобу предателя, по которой сей не устыдился быть на Его вечери, а потом не оставил исполнения и своего намерения. Господь также дает нам этим образец, чтобы мы до конца старались о пользе падающих.
      cn: 没有比灵魂滞留于顽固不化之中更不幸的事了。因为请看，主说了什么：「看哪，那出卖我者的手，正与我同在桌上」，而那愚昧之人却未醒悟。主说这话，不仅是为了表明祂知道将要发生之事，也是为了向我们显明祂的良善，以及那出卖者的恶毒，那恶毒使这人竟不以出席祂的晚宴为耻，此后亦不曾放弃执行他自己的意图。主也以此给我们树立了一个榜样，叫我们当为那跌倒之人的益处努力直至最终。
  - type: paragraph
    initial:
      ru: 'Лк 22:22. '
      cn: （路加福音 22:22）
    text:
      ru: впрочем, Сын Человеческий идет по предназначению,
      cn: 盖人子依预定者而逝、惟卖彼之人祸矣哉、
  - type: paragraph
    text:
      ru: И Сын Человеческий, – говорит, – идет, не потому, что будто бы не может защитить Себя, но потому, что Он предназначил Себе смерть за спасение людей.
      cn: 「人子，」他说道，「去了，并非因为祂似乎不能自卫，而是因为祂已为自己预定了为拯救人类而受死。」
  - type: paragraph
    text:
      ru: но горе тому человеку, которым Он предается.
      cn: 但是，祸哉那个出卖他的人。
  - type: paragraph
    text:
      ru: Хотя Ему предназначено пострадать, но ты зачем оказался так зол, что решился предать Его? За то и достанется тебе в удел«горе», что ты оказался склонным на предательство, так как и змий проклят за то, что он послужил орудием козней диавола.
      cn: 尽管祂注定要受难，但你为何竟然如此邪恶，以致决意要出卖祂？你之所以被分得「祸哉」的份额，是因为你倾向于叛卖，正如同那条蛇因它充当了魔鬼诡计的工具而被诅咒一样。
  - type: paragraph
    initial:
      ru: 'Лк 22:23. '
      cn: （路加福音 22:23）
    text:
      ru: И они начали спрашивать друг друга, кто бы из них был, который это сделает.
      cn: 彼等起互相寻求其中欲行此者为谁、
  - type: paragraph
    text:
      ru: Услышав сие, ученики смутились. Об этом пространнее узнаешь в толковании на Евангелие от Иоанна(см.гл. 13)
      cn: 听闻此事，门徒们烦乱不安了。关于此点，你可在《伊鄂昂福音注释》（参见第十三章）中得知更详尽的内容。
  - type: paragraph
    initial:
      ru: 'Лк 22:24. '
      cn: （路加福音 22:24）
    text:
      ru: Был же и спор между ними, кто из них должен почитаться бо́льшим.
      cn: 彼等中有分争、其中孰为大、
  - type: paragraph
    text:
      ru: 'Они смущаются теперь не только подозрением себя в предательстве, но от сего смятения переходят к спору, спорят о том, кто из них больше. До спора о сем они дошли последовательно. Вероятно, один из них говорил другому: ты хочешь предать, а сей опять тому: нет, ты хочешь предать. Отсюда перешли к тому, что начали говорить: я лучше, я больше и подобное. Что же Господь?'
      cn: 他们此刻的困惑，不仅仅是因为怀疑自己会背叛，更是由这困惑转入了争论，争论着他们之中谁更大。他们循序渐进地发展到这场争论。很可能，他们其中一人对另一人说：你想背叛；而那人又对他说：不，你想背叛。由此，他们转而开始说：我更好，我更大，诸如此类的话。那么，主又是怎么做的呢？
  - type: paragraph
    initial:
      ru: 'Лк 22:25. '
      cn: （路加福音 22:25）
    text:
      ru: 'Он же сказал им: цари господствуют над народами, и владеющие ими благодетелями называются,'
      cn: 彼语之曰、异邦之列王主民、其秉权者称为恩主、
  - type: paragraph
    initial:
      ru: 'Лк 22:26. '
      cn: （路加福音 22:26）
    text:
      ru: 'а вы не так: но кто из вас больше, будь как меньший, и начальствующий – как служащий.'
      cn: 然尔等勿如是、但在尔等中为最大者、当如小、为首者当如役、
  - type: paragraph
    text:
      ru: Он укрощает смятение их двумя примерами. Во-первых, примером язычников, которых они считали скверными, объявляя, что если они будут так думать, то подобны будут язычникам.
      cn: 他用两个例子平息了他们的骚动。首先，他以被他们视为污秽（的）外邦人为例，宣称如果他们这样思考，他们就会与外邦人相似。
  - type: paragraph
    initial:
      ru: 'Лк 22:27. '
      cn: （路加福音 22:27）
    text:
      ru: 'Ибо кто больше: возлежащий, или служащий? не возлежащий ли? А Я посреди вас, как служащий.'
      cn: 谁为最大、席卧者乎、役事者乎、非席卧者乎、然我在尔曹中如役事者也、
  - type: paragraph
    text:
      ru: Во-вторых, Собственным Своим примером, ибо, объяснив, что Он служит им, Он этим приводит их к смиренномудрию. Именно в то время Он, как сказано, разделил им хлеб и чашу. Если Я, Которому поклоняется вся ангельская и разумная тварь, служу посреди вас, то вы как осмеливаетесь думать о себе много и спорить о первенстве? Мне кажется, что Он упомянул об этом возлежании и служении не мимоходом, но чтоб напомнить им, что если вы ели от одного хлеба и пили от одной чаши, то одна трапеза делает вас друзьями и единомысленными. Зачем же вы имеете мысли, недостойные их? Притом и Я не так сделал, чтобы одному послужил, а другому нет, а всем вам равно. Поэтому и вы имейте одни и те же чувствования. Пожалуй, из всего этого ты и то пойми, как ученики были тогда еще несовершенны, а впоследствии так чудно просияли. Да устыдятся манихеи, которые говорят, что некоторые по природе неспособны к обучению, и таковым невозможно перемениться.
      cn: 其次，借由祂自己的榜样，因为祂解释了祂服事他们，祂就以此引导他们进入谦卑心智（смиренномудрию）。正是在那时，如经上所说，祂为他们分了饼和杯。如果我，就是那所有天使和理性受造物所敬拜的那位，在你们中间服事，你们又怎敢自视甚高并争论首位呢？在我看来，祂提及这个席卧与服事并非偶然，而是为了提醒他们，既然你们吃着同一块饼、喝着同一个杯，那么同一张餐桌就使你们成为朋友，心意合一。你们为何怀有不配于此的想法呢？况且，我的做法也不是只服事其中一人，而不服事另一人，而是平等地服事你们所有人。因此，你们也当怀有同样的情感。或许，通过这一切，你也明白了门徒们那时仍是何等不完全，而后来他们又是何等奇妙地光芒四射。愿那些摩尼教徒感到羞愧，他们说有些人天生不具备受教能力，因此不可能改变。
  - type: paragraph
    initial:
      ru: 'Лк 22:28. '
      cn: （路加福音 22:28）
    text:
      ru: Но вы пребыли со Мною в напастях Моих,
      cn: 尔等偕我恒在我患难之中、
  - type: paragraph
    initial:
      ru: 'Лк 22:29. '
      cn: （路加福音 22:29）
    text:
      ru: и Я завещаваю вам, как завещал Мне Отец Мой, Царство,
      cn: 我以国遗尔等、如我父遗我然、
  - type: paragraph
    initial:
      ru: 'Лк 22:30. '
      cn: （路加福音 22:30）
    text:
      ru: да ядите и пиете за трапезою Моею в Царстве Моем,
      cn: 俾尔等在我国饮食于我案、且尔等亦列坐于宝座审判伊斯拉伊泐十二支派、
  - type: paragraph
    text:
      ru: 'Сказав,«горе"предающему Меня, и между тем научив их (учеников), что должно быть смиренномудрым, Господь как предающему предназначает в удел«горе», так, напротив, им говорит: вы же те, которые только пребыли вместе со Мной в искушениях Моих; поэтому и вам Я завещеваю воздаяние, то есть договариваюсь с вами, чтобы, – подобно тому как Отец Мой завещал Мне, то есть назначил Мне Царство, – и вы ели и пили за трапезой Моей. Сказал:«да ядите и пиете»не потому, будто бы там будут яства и будто бы Царство Его чувственное. Ибо ответом Своим саддукеям Он Сам научил, что там жизнь ангельская (Лк. 20, 36); и Павел учит, что Царствие Божие не есть«пища и питие»(Рим. 14, 17). Поэтому, слыша слова:«да ядите и пиете за трапезою Моею», никто да не соблазняется, но пусть понимает так, что они сказаны применительно к тем, кои пользуются почетом от царей мира сего. Ибо тех, кои разделяют трапезу царя, считают первенствующими над всеми. Так и об апостолах Господь говорит, что Он предпочтет их всем.'
      cn: 当祂说出「祸哉」给那将要出卖祂的人，同时又教导他们（门徒）应当谦卑时，主既为那出卖祂的人预定了「祸哉」作为他的份，那么，与此相反，祂对他们说：你们就是那些只与我一同在我试探中始终同在的人；因此，我也将赏报遗赠给你们，也就是说，我与你们约定——就像我的父将产业遗赠给我，即为我指定了国度一样——你们也要在我的宴席上吃喝。祂说：「叫你们吃喝」并非是说在那里会有菜肴，也并非是说祂的国度是感官上的。因为祂以祂对撒都该人的回答亲自教导说，那里的生活是天使般的（路加福音 20:36）；并且保罗教导说，神的国不在乎「吃喝」（罗马书 14:17）。因此，听见「叫你们在我的宴席上吃喝」这句话时，任何人都不要因此跌倒，而应当理解为，这些话是参照那些受此世君王尊荣者而言的。因为那些分享君王筵席的人，被认为是在所有人之上的首位者。主也如此论及祂的使徒们，说祂将使他们优于所有人。
  - type: paragraph
    text:
      ru: и сядете на престолах судить двенадцать колен Израилевых.
      cn: 和你们要坐在宝座上，审判以色列的十二支派。
  - type: paragraph
    text:
      ru: Равно, когда слышишь о сидении«на престолах», разумей не престолы, но славу и честь. Ибо из сотворенных и рожденных никто не будет там сидеть. Сидеть прилично  Единой Святой Троице, Несозданному и Царю всего Богу, а тварь, как раба, должна стоять, и то мы говорим телесно о сидении и стоянии.«Судить», то есть осуждать тех, кои не уверуют из«двенадцати колен». Ибо неуверовавшим израильтянам служат немалым осуждением апостолы, которые и сами суть израильтяне, однако же, уверовали.
      cn: 同样地，当你听到关于坐在「宝座上」时，你当理解的不是宝座，而是荣耀和尊荣。因为在被创造的和被生出的人中，没有人会在那里坐着。坐着，只适合于独一神圣三位一体、未受造的、万有之君的上帝；而受造之物，作为奴仆，则必须站立，况且我们所说的坐着和站立都是指身体而言。「审判」，即是定罪那些将不会相信的「十二支派」中的人。因为对于那些不相信的以色列人来说，使徒们构成了不小的定罪，他们自己也是以色列人，然而却相信了。
  - type: paragraph
    initial:
      ru: 'Лк 22:31. '
      cn: （路加福音 22:31）
    text:
      ru: 'И сказал Господь: Симон! Симон! се, сатана просил, чтобы сеять вас как пшеницу,'
      cn: 主曰、锡孟欤、锡孟欤、顾、萨他那寻求簸尔等若麦然、
  - type: paragraph
    text:
      ru: Поскольку же предателю Он воздал горем, а им, пребывшим в любви к Нему, предсказал в будущем высокую честь, то, чтобы они не возгордились, как бы совершившие нечто великое, что пребыли в любви к Нему и не предали, говорит:«сатана просил, чтобысеятьвас», то есть смущать, портить, искушать; но«Я молился». Не думайте, – говорит, – что все это совершенство от вас самих. Ибо диавол напрягает все силы, чтобы отторгнуть вас от Моей любви и сделать предателями. Господь обращает сию речь к Петру, потому что он был и дерзновеннее прочих, и вероятно возгордился обещаниями Христовыми. Поэтому, смиряя его, Господь говорит, что сатана много усиливался против них.
      cn: 主既然报以背叛者以悲痛，而向那些持守着对祂的爱的人预言了未来崇高的尊荣，为了不让他们因为仿佛成就了什么伟大的事——即持守着对祂的爱且没有背叛——而心生骄傲，祂说：「萨他那寻求簸尔等若麦然（撒旦求得了要筛你们）」，也就是说，搅扰、败坏、试探；但是「我祈祷了」。祂说：「不要以为这一切的完善都是源自你们自己。」因为魔鬼正倾尽全力，要把你们从我的爱中剥夺，使你们成为背叛者。主将此番话转向彼得，是因为他比其余的人更加大胆，并且很可能因基督的应许而心生骄傲。因此，主为了使他谦卑，就说撒旦曾极力与他们作对。
  - type: paragraph
    initial:
      ru: 'Лк 22:32. '
      cn: （路加福音 22:32）
    text:
      ru: но Я молился о тебе,
      cn: 我为尔祈祷、使尔等之信不匮、为尔回转时以坚固尔弟兄、
  - type: paragraph
    text:
      ru: Говорит так по человечеству, ибо, как Бог, какую имел Он нужду молиться?
      cn: 他以其人性如此说，因为，作为神，祂有什么需要祈祷呢？
  - type: paragraph
    text:
      ru: чтобы не оскудела вера твоя;
      cn: 「使尔等之信不匮；」
  - type: paragraph
    text:
      ru: Я, – говорит, – молился,«чтобы не оскудела вера твоя». Хотя ты и поколеблешься несколько, но в тебе сохранятся семена веры, и хотя дух искусителя потрясет листья, но корень жив, и вера твоя не оскудеет.
      cn: 「我，」他说道，「曾祈祷，『使尔等之信不匮』。」 尔纵然有所动摇，但信德的种子必在尔内得以保存；即便试探者的灵摇撼了枝叶，根基却仍存活，尔的信德必不致匮乏。
  - type: paragraph
    text:
      ru: и ты некогда, обратившись, утверди братьев твоих.
      cn: 且你回转时，要坚固你的弟兄们。
  - type: paragraph
    text:
      ru: 'Это удобно понять, именно: так как Я к тебе первому обратился со Своим словом, то, – после того как оплачешь свое отречение от Меня и придешь в раскаяние, – утверди прочих. Ибо это прилично тебе, который первый исповедал Менякамнеми утверждением Церкви (Мф. 16, 16–18). Но можно относить эти слова не к одним только апостолам, которых должен был утвердить тогда Петр, но и ко всем верующим до скончания века. Петр! Ты, обратясь, для всех будешь прекрасным примером покаяния, и никто из верующих в Меня не будет отчаиваться, смотря на тебя, который, будучи апостолом, отрекся и, однако же, чрез покаяние снова получил свое прежнее значение среди всех апостолов и среди избранников Божиих из всей вселенной. Сатана просил, чтобы сеять тебя и испортить как чистую пшеницу, вмешав в нее грязи, потому что он, по своему обыкновению, завидует тебе в любви ко Мне. Так он поступил и с Иовом. Но Я не оставил тебя совсем, чтобы вера твоя не оскудела совершенно. Хотя Я Сам молился за тебя, однако ж ты не падай, но, обратясь, то есть принеся покаяние и слезы, будь и для прочих верующих образцом покаяния и упования. Что же Петр?'
      cn: '圣奥赫里德的狄奥菲拉克


        这易于理解，即：因为我是首先以我的话语对你说的，所以，——在你为自己对我的否认哀哭并悔悟之后，——你要坚固其余的人。因为这对你是恰当的，是你首先宣认我是磐石和教会的根基（马太福音 16:16-18）。但是，这些话语不仅可以归于当时应由彼得坚固的使徒们，也可以归于直到世代终结的所有信徒。彼得！你悔改之后，对所有人来说都将是悔改的绝佳榜样，凡是信我的人，都不会因看着你而绝望，因为你身为使徒却否认了我，然而却通过悔改，在所有使徒之中，并在全宇宙中被上帝拣选的人之中，重新获得了你先前的重要性。撒但求得了权柄，要筛你，要像污损纯净的麦子一样污损你，将泥土混入其中，因为它按着其惯常做法，嫉妒你对我的爱。它对待约伯也是如此。但我没有完全离弃你，以免你的信心完全匮乏。虽然我自己为你祈祷了，然而你不要跌倒，而要悔改，即献上悔改和眼泪，也要成为其余信徒悔改和盼望的榜样。那么彼得做了什么？'
  - type: paragraph
    initial:
      ru: 'Лк 22:33. '
      cn: （路加福音 22:33）
    text:
      ru: 'Он отвечал Ему: Господи! с Тобою я готов и в темницу и на смерть идти.'
      cn: 彼对曰、主欤、我已备偕尔同狱同死、
  - type: paragraph
    text:
      ru: Полагаясь на сильную любовь, он обещает то, что пока невозможно для него.
      cn: 依赖于强烈的爱，他应许了对他来说尚不可能之事。
  - type: paragraph
    initial:
      ru: 'Лк 22:34. '
      cn: （路加福音 22:34）
    text:
      ru: 'Но Он сказал: говорю тебе, Петр, не пропоет петух сегодня, как ты трижды отречешься, что не знаешь Меня.'
      cn: 彼曰、撇特儿、我告尔、今鸡鸣之先、尔将三次避讳不识我、
  - type: paragraph
    text:
      ru: 'Но Господь, видя, что он говорит необдуманно (ибо, однажды услышав от самосущей Истины, сказавшей ему, что подвергнется искушению, он не должен был еще противоречить), объявляет ему и вид искушения, именно: отречение. Отсюда мы научаемся той истине, что произволения человеческого недостаточно без помощи Божией. Петр оставлен был ненадолго и, по-видимому, любил даже горячо, однако ж, когда Бог оставил его, запнут был врагом. Равно и помощи Божией недостаточно без соизволения человеческого. Иуда, хотя Господь все сделал для его пользы, не получил никакой пользы, ибо не имел доброго произволения. Итак, содрогнемся при мысли о кознях диавола, как они сильны против небрежных. Вот и здесь, хотя Петр подкрепляем был Богом, однако ж, когда по особенным целям оставлен был, дошел до отречения. Чему же подвергся бы он, если бы не был храним Богом и не было в нем сокрыто добрых семян? Ибо цель у диавола была, чтоб и его довести до предательства; ибо у диавола«роскошна пища», как говорит пророк (Авв. 1, 16). Благодарение же Богу, не оставляющему святых, праведных и добрых сердцем, каков был Петр, нежно любящий и чуждый всякого подозрения относительно Учителя.'
      cn: 然而主，看见他说得不够深思熟虑（因为他既然已经一次听见了那自存的真理对他说他将要遭受试探，就不应当再反驳），便向他宣告了试探的形式，即：否认。由此我们学得了这一真理，即若无上帝的帮助，人的自由意志便不够用。彼得被暂时地撇下了，表面上看，他甚至热烈地爱着，然而，当上帝撇下他时，他被仇敌绊倒了。同样地，若无人之同心合意（ соизволения человеческого），上帝的帮助也不够用。犹大，尽管主为他益处已做到了一切，却未曾得到任何益处，因为他没有良好的自由意志。因此，我们当因着对魔鬼的诡计的思索而战栗，它们对那些疏忽大意之人是多么的强大。就在这里，尽管彼得曾被上帝加力，然而，当他因着特殊的目的被撇下时，他竟走到了否认的地步。如果他没有被上帝保守，且没有良善的种子隐藏在他里面，他会遭受什么呢？因为魔鬼的目的，是要将他也带向背叛；因为在魔鬼那里，「它的食物甚是丰盛」，正如先知所说（哈巴谷书 1:16）。然而，感谢那不撇下圣徒、公义之人、以及心存良善之人的上帝，彼得便是这样的人，他温柔地爱着，且对他的导师没有任何嫌疑。
  - type: paragraph
    initial:
      ru: 'Лк 22:35. '
      cn: （路加福音 22:35）
    text:
      ru: 'И сказал им: когда Я посылал вас без мешка и без сумы́ и без обуви, имели ли вы в чем недостаток? Они отвечали: ни в чем.'
      cn: 又语彼等曰、其时、我尝遣尔等勿囊、勿袋、勿履、尔等仍有何缺、对曰、无、
  - type: paragraph
    text:
      ru: Господь, в начале проповеди посылая учеников по селениям и городам, повелел им не брать лишнего, не носить с собой ничего даже нужного и ни о чем не заботиться. И в этом случае они должны были познать Его силу. Ибо Сам заботясь о них, как о слабых, Он устроял так, что и без их заботы в обилии текло к ним все нужное.
      cn: 主，在宣讲道义之始，差遣门徒前往村庄与城市，命令他们勿取多余之物，勿携任何随身之物，哪怕是必需之物亦不可，且勿为任何事忧虑。在此境况下，他们必须认识到祂的力量。因为祂亲自照顾他们，视他们为软弱者，祂安排妥当，使得即使他们不忧虑，一切必需之物仍丰盛地流向他们。
  - type: paragraph
    initial:
      ru: 'Лк 22:36. '
      cn: （路加福音 22:36）
    text:
      ru: 'Тогда Он сказал им: но теперь, кто имеет мешок, тот возьми его, также и суму́; а у кого нет, продай одежду свою и купи меч;'
      cn: 又语伊等曰、然今有囊者取之、袋亦如是、惟无有者可售其衣以买刀、
  - type: paragraph
    text:
      ru: 'А теперь Он повелевает противное, не противореча впрочем Себе, но, объявляя им, что доселе Он ухаживал за ними как за детьми и не заставлял их ни о чем заботиться, а отселе они должны считать себя возмужалыми и заботиться сами о себе. Я, – говорит, – заботливый Отец ваш, отхожу уже. Отселе примите сами на себя заботы о своих делах, а не возлагайте всего на Меня; ибо дела ваши будут не таковы, как были легки и не трудны, но вы подвергнетесь и голоду, и жажде, и многим бедствиям. На это намекает словами о мешке, суме и мече. Поэтому будьте бодры, так как вы имеете алкать и нуждаться в пище, на что намекает«сумой», и мужественны, так как впадете во многие опасности, на что указывает«меч». Говорит это, конечно, не для того, чтобы они носили с собою мечи, но чтоб, как я сказал, объявить о войнах и бедствиях и сделать их ко всему готовыми. Чтобы потомки не подумали, что апостолы ничего от себя не принесли для благочестия, но все было от Бога, Господь говорит: нет, да не будет так. Ибо Я не хочу пользоваться Моими учениками, как бездушными орудиями, но требую, чтоб они приложили и то, что могут сами от себя. И действительно, ты найдешь, что апостолы, и особенно Павел, удачно исполняли многие и из человеческих искусств (Деян. 18:3, 20:34); разве только в них не отсутствовала и помощь Божия. Вместе с сим это полезно было и для скромности апостолов. Ибо если бы они, не заботясь сами ни о чем, всего ожидали от Бога и им все давалось бы, то они могли бы возгордиться, как получившие в удел нечто высшее человеческой природы. Сверх того, природа стала бы недеятельной и растлилась бы, если б они ничего не изобретали сами от себя, а ожидали всего именно, как говорится, в измолотом виде. Поэтому Господь говорит им: отселе носите «сумы», то есть так располагайтесь и заботьтесь, как имеющие испытать голод, и купите «мечи», то есть так берегите себя, как имеющие встретить опасности и войны.'
      cn: '现在祂却吩咐了相反之事，然而并未与祂自己相悖，而是向他们宣告：直到此刻，祂一直像照看孩童般照看他们，不让他们为任何事操心；而从今以后，他们必须认为自己已经成年，并且要为自己操心。


        祂说：「我，你们那操心的父亲，已然将要离去。」从今以后，你们要亲自承担自己事务的操心，而不要将一切都交托于我；因为你们的事务将不再像以往那般轻松且不艰难，相反，你们将遭受饥饿、干渴以及许多灾祸。祂正是藉着提及「囊」（*мешке*）、「袋」（*суме*）和「刀」（*мече*）的言语来暗示此事。因此，你们要振作起来，因为你们必将忍受饥饿和对食物的需要，这是祂藉「袋」所暗示的；并且要勇敢，因为你们必将陷入许多危险之中，这是祂藉「刀」所指明的。


        祂说这话，当然不是为了让他们随身携带刀剑，而是如我所言，为了宣告战争和灾祸，并使他们为此做好一切准备。为了不让后世子孙误认为使徒们没有为敬虔贡献任何出于他们自身的东西，而认为一切都来自上帝，主说：不，断然不可如此。因为我不想把我的门徒当作没有灵魂的工具来使用，而是要求他们也要付出他们自身所能贡献的一切。确实，你会发现使徒们，特别是保罗，成功地实践了许多源于人自身的技艺（使徒行传 18:3，使徒行传 20:34）；只不过，上帝的帮助在他们身上也并未缺失。


        与此同时，这对使徒们的谦卑也是有益的。因为如果他们自己不操心任何事，而是一切都指望上帝，并且一切都赐予他们，那么他们可能会变得骄傲，仿佛他们所得的份是超越人性的东西。此外，如果他们自己不发明任何东西，而仅仅是期待一切，就像俗话说的，「磨好了」送到手上一样，那么人性就会变得不作为并遭受腐蚀。因此，主对他们说：从今以后，你们要携带「袋」，也就是说，要像那些即将遭受饥饿的人一样安排和操心自己；并且要买「刀」，也就是说，要像那些即将面临危险和战争的人一样保护自己。'
  - type: paragraph
    initial:
      ru: 'Лк 22:37. '
      cn: （路加福音 22:37）
    text:
      ru: 'ибо сказываю вам, что должно исполниться на Мне и сему написанному: и к злодеям причтен. Ибо то, что о Мне, приходит к концу.'
      cn: 我告尔等、为应指我此所载者、被人算在罪犯中、盖指我者将终、
  - type: paragraph
    text:
      ru: 'Некоторые покупку меча разумели иначе. Сим, – говорят, – Он намекает на имеющее вскоре совершиться нападение на Него и на то, что Его захватят люди – убийцы. Так как пред этим временем они спорили друг с другом о первенстве, то Господь говорит: теперь время не спорам о первенстве, но время опасности и убийств. Ибо и Меня, Учителя вашего, отведут на смерть, и притом на смерть бесчестную. Но чрез это исполнится на Мне сказанное:«и к злодеям причтен был»(Ис. 53, 12). Итак, желая указать на разбойническое нападение, Он упомянул о мече, и не открыл совершенно, чтобы не смутились каким-нибудь ужасом, не умолчал совершенно, чтобы не пришли в смятение в случае внезапного нападения, особенно же для того, чтобы, вспоминая впоследствии, подивились Его предведению и почудились, как Он, однако ж, предал Сам Себя на страдание за спасение людей, а поэтому и сами не убегали ни от каких болезней за спасение некоторых.'
      cn: 一些人对购买刀剑有不同的理解。他们说，主借此暗示着那即将发生在他身上的袭击，以及他将被那些杀人者所擒获。因为在此之前，门徒们彼此争论着谁为首位，所以主说：现在不是争论首位的时候，而是危险与谋杀的时候。因为甚至我，你们的教师，也将被带去受死，而且是受一种不光彩的死。但借由这个，那句经文将应验在我身上：「他也被列在恶人之中」（以赛亚书 53:12）。因此，他想要指明这种强盗式的袭击，便提到了刀剑，但他并没有完全公开，以免他们因某种恐惧而惊慌，但也没有完全沉默，以免他们在突然遭遇袭击时陷入混乱，尤其重要的是，为了让他们事后回忆起来，惊叹于他的预知，并思量他为何仍为人类的救赎将自己交予苦难，因此，他们自己也为拯救某些人而不逃避任何痛苦。
  - type: paragraph
    initial:
      ru: 'Лк 22:38. '
      cn: （路加福音 22:38）
    text:
      ru: 'Они сказали: Господи! вот, здесь два меча. Он сказал им: довольно.'
      cn: 彼等曰、主欤、顾、在此有二刀、彼对曰、足矣、
  - type: paragraph
    text:
      ru: 'Я думаю, что Господь говорит так приточно для того, чтобы получили пользу после, когда вспомнят и поймут. Поскольку тогда они находились в таком недоразумении, что сказали:«Господи, вот здесь два меча», а Он, видя, что они не поняли, говорит:«довольно», хотя и не было довольно. Ибо если бы против пришедших разбойническим образом нужно было употребить человеческую помощь, то не довольно было бы и сотни мечей. Если же не человеческое, но Божественное содействие нужно было, то излишни были и два меча. Однако ж Господь не захотел обличать их в непонимании, но, сказав«довольно», пошел. Это подобно тому, как и мы, когда, беседуя с кем-нибудь, видим, что он не понимает наших слов, говорим: хорошо, оставь; хотя и не хорошо, но, чтобы не оскорбить его, оставляем. Господь поступил так потому, что видел, что ученики не понимают сказанного.'
      cn: '我思忖着，主如此说，是带有一种寓意，为的是让他们事后回想并领悟时能有所受益。因为他们当时正处于一种不解的状态，以至于他们说：「主啊，看，这里有两把刀，」 而祂，看见他们不理解，便说：「足矣，」 尽管这并非「足矣」。


        因为如果对付那些以强盗之姿前来的人，需要动用人间的援助，那么即便是一百把刀也不够。而如果需要的不是人间的，而是神圣的协助，那么两把刀也是多余的。然而，主不愿指责他们的不理解，但说了「足矣」之后，就离开了。


        这正像我们一样，当与某人交谈时，看到他不理解我们的话语，便说：好的，算了；虽然并非「好」，但为了不冒犯他，我们便作罢了。主如此行，是因为祂看到门徒们不明白所说的话。'
  - type: paragraph
    text:
      ru: 'Он идет вперед и оставляет речь, предоставляя уразумение сказанного течению обстоятельств, подобно тому, как Он некогда сказал:«разрушьте храм сей», а ученики поняли уже впоследствии, после Его воскресения (Ин.2,19–22). Некоторые же говорят, что Господь словом«довольно»указал на несообразность слов с обстоятельствами. Ученики сказали:«вот, здесь два меча», а Господь, говорят, указывая на эту несообразность, сказал: если есть два меча, то это очень много и довольно для нас против той толпы, которая придет на нас.'
      cn: 他继续前行，搁置了言论，将所言之事的领悟留待情势的发展，就像他曾经说过：「拆毁这座圣殿」，而门徒们是在他复活之后才领悟的（伊鄂昂福音 2:19–22）。然而有些人说，主以「足矣」一词，指出了言语与情势的不相称。他们说，门徒们说：「看，这里有两把刀剑」，而主指着这种不相称，说：如果有两把刀剑，那么对付那群将要攻击我们的人来说，这就太多了，也足够了。
  - type: paragraph
    initial:
      ru: 'Лк 22:39. '
      cn: （路加福音 22:39）
    text:
      ru: И, выйдя, пошел по обыкновению на гору Елеонскую, за Ним последовали и ученики Его.
      cn: 〇遂出、依常往橄榄山、其门徒从之、
  - type: paragraph
    text:
      ru: После вечери Господь не предается бездействию, удовольствиям и сну, но учит и молится, давая на то нам образец и пример. Поэтому горе тем, кои после ужинов обращаются к постыдным делам блуда. Научив этому учеников, Господь восходит на гору масличную, чтоб помолиться. Он любил это делать наедине, поэтому отлучается и от учеников. Впрочем, Он берет с Собой учеников, но не всех, а только тех троих, кои видели славу Его на горе (Лк. 9, 28).
      cn: 在晚餐之后，主不沉溺于无所事事、享乐与睡眠，而是教导并祈祷，为此给我们提供了楷模与榜样。因此，那些在晚餐之后转向行可耻的淫乱之事的人有祸了。以此教导了门徒之后，主登上橄榄山，为了祈祷。祂喜爱独自进行此事，因此也与门徒们分开。然而，祂带着门徒们，但并非所有人，而只带了那看见祂在山上的荣耀（路加福音 9:28）的那三个人。
  - type: paragraph
    initial:
      ru: 'Лк 22:40. '
      cn: （路加福音 22:40）
    text:
      ru: 'Придя же на место, сказал им: молитесь, чтобы не впасть в искушение.'
      cn: 至其处、语彼等曰、尔等宜祈祷免入于诱感、
  - type: paragraph
    initial:
      ru: 'Лк 22:41. '
      cn: （路加福音 22:41）
    text:
      ru: И Сам отошел от них на вержение камня, и, преклонив колени, молился,
      cn: 而自离之、有投石之远、曲膝祈祷、
  - type: paragraph
    initial:
      ru: 'Лк 22:42. '
      cn: （路加福音 22:42）
    text:
      ru: 'говоря: Отче! о, если бы Ты благоволил пронести чашу сию мимо Меня! впрочем не Моя воля, но Твоя да будет.'
      cn: 曰父欤、尔若肯、则使此爵过我、然勿我意、乃尔旨得成、
  - type: paragraph
    text:
      ru: 'Поскольку Он находится в борении и молится, то, чтобы сие не показалось признаком боязни, Он берет тех, кои сами видели Божескую славу Его и сами слышали свидетельство с неба, чтобы, видя Его в борении, сочли это делом человеческой природы. Ибо для уверения, что Он был воистину Человек, Он сей природе позволил действовать по-своему. Как Человек, Он желает пожить и молится о мимонесении чаши, ибо человек животолюбив; и чрез то ниспровергает ереси, по словам коих Он вочеловечился призрачно. Ибо если и после таких действий (человеческой природы) находили повод подобным образом пустословить, то чего не насказали бы, если бы сих действий не было? Итак, желание, чтоб чаша пронесена была мимо, принадлежит человеческому естеству, а вскоре за тем сказанные слова: однако,«не Моя воля, но Твоя да будет»показывают, что и мы должны иметь такое же расположение и также мудрствовать, подчиняться воле Божией и не уклоняться, хотя бы наша природа влекла и в противную сторону.«Не Моя"человеческая«воля, но Твоя да будет», и эта Твоя не отделена от Моей Божеской воли. Единый Христос, имея два естества, имел, без сомнения, и волю или желания каждого естества, Божеского и человеческого. Итак, человеческое естество сначала желало жить, ибо это ему свойственно, а потом, следуя Божеской воле, чтобы все люди спаслись, воле, общей Отцу и Сыну, и Святому Духу, решилось на смерть, и таким образом одно стало желание – спасительная смерть.'
      cn: 既然祂处于挣扎（борении）之中并且正在祷告，为避免此事被视作胆怯的标志（признаком боязни），祂带上了那些亲眼目睹祂神性荣耀（Божескую славу）并亲自听闻来自天上见证的人，为的是让他们在目睹祂的挣扎时，能将此视为人性的作为（делом человеческой природы）。因为为了确证祂是真实的人（воистину Человек），祂允许这本性按其自身的方式行事。作为一个人，祂渴望活下去（желает пожить），并祷告祈求将此爵（чаши）挪去（мимонесении），因为人是爱惜生命（животолюбив）的；借此，祂推翻了那些异端（ереси），照他们的话说，祂是以幻影（призрачно）的方式成了肉身（вочеловечился）。因为如果（人性）在经历了这些行动之后，他们仍能找到机会以类似的方式空谈（пустословить），那么若是没有这些行动，他们又会说些什么呢？因此，希望此爵能被挪去（пронесена была мимо）的愿望属于人性（человеческому естеству）；而紧接着说出的话——然而，「不要成就我的意思，只要成就祢的旨意」（не Моя воля, но Твоя да будет）——则表明我们也必须有同样的意愿（расположение）和同样的心智（мудрствовать），顺服于上帝的旨意，不偏离（не уклоняться），尽管我们自身的本性可能牵引我们走向相反的方向。「不要成就我的」（Моя）*人性的*（человеческая）「旨意，只要成就祢的旨意」（воля, но Твоя да будет），并且这「祢的旨意」并未与「我的神性旨意」（Моей Божеской воли）分离。独一的基督，拥有两种本性，无疑也拥有每种本性的意志或愿望，即神性的和人性的。因此，人性的本性起初渴望活下去，因为这是它固有的特质；但随后，它顺从了神性的旨意——即愿所有人都得救的旨意，这旨意是圣父、圣子和圣灵所共有的——决意赴死，如此一来，这个愿望就变得单一了——即救赎性的死亡（спасительная смерть）。
  - type: paragraph
    initial:
      ru: 'Лк 22:43. '
      cn: （路加福音 22:43）
    text:
      ru: Явился же Ему Ангел с небес и укреплял Его.
      cn: 有天神自天显现于彼、坚固之、
  - type: paragraph
    initial:
      ru: 'Лк 22:44. '
      cn: （路加福音 22:44）
    text:
      ru: И, находясь в борении, прилежнее молился, и был пот Его, как капли крови, падающие на землю.
      cn: 彼于悲惨中祈祷愈切、其汗如血滴落于地下、
  - type: paragraph
    text:
      ru: 'Что молитва была от человеческого естества, по допущению имевшего общее всем пристрастие к жизни, а не от Божества, как говорят проклятые ариане, это видно из того, что Иисус был в поту и таком борении, что, как говорит присловие, с Него падали капли крови. Ибо о тех, кои сильно трудятся, обыкновенно говорят, что они потеют кровью, подобно как и о тех, кои горько сетуют, говорят, что они плачут кровью. Это-то желая показать, именно: что с Него текла не какая-нибудь тонкая и как бы для видимости показывающаяся жидкость, но падали крупные капли пота, евангелист для изображения действительности употребил капли крови. Отсюда явно, что естество, источавшее пот и находившееся в борении, было человеческое, а не Божеское. Ибо естеству человеческому допущено было испытывать такие состояния, и оно испытывало, чтобы, с одной стороны, показать, что Он не призрачно являлся человеком, а с другой – цель сокровенная, чтоб уврачевать общую человеческому естеству боязливость, истощив оную в Самом Себе и подчинив ее воле Божеской.'
      cn: 这次祷告是出于人性（человеческого естества），因为祂容许（по допущению）自己拥有所有人共通的对生命的依恋（пристрастие к жизни），而非出于神性（Божества），正如那些被诅咒的亚流派信徒（ариане）所言；这一点从耶稣出汗和处于极度挣扎之中即可看出，正如俗语（присловие）所说，从祂身上滴下的汗珠如同血滴。因为对于那些奋力辛劳的人，人们通常会说他们流血汗（потеют кровью），正如对于那些悲苦哀叹的人，人们会说他们流血泪（плачут кровью）一样。福音书作者正是想表明这一点——即从祂身上流下的不是某种稀薄的、仿佛仅为显现而存在的液体，而是大颗的汗珠滴落——因此他用血滴来描绘这种真实性（действительности）。由此可见，那流汗且处于挣扎中的本性是人性（человеческое），而非神性（Божеское）。因为人性被容许经历此类状态，并且它经历了，一来是为了表明祂并非虚幻地显现为人（не призрачно являлся человеком），二来是为了达成一个隐秘的目的（цель сокровенная），即：通过在祂自己里面耗尽（истощив）它，并使之臣服于神圣的意志（воле Божеской），来医治人性共通的恐惧（боязливость）。
  - type: paragraph
    text:
      ru: 'Иной может сказать, что выступающий из тела и падающий на землю пот означает то что, с ободрением и укреплением нашего естества во Христе, источники боязливости в нас испаряются, обращаются в капли и падают с нас. Ибо если бы Он не имел этого в виду, то есть желания излечить нашу человеческую боязливость, то не потел бы так, хотя бы и очень был боязлив и малодушен.«Явился же Ему Ангел с небес и укреплял Его». И это для нашего утешения, именно: чтобы мы узнали укрепляющую силу молитвы и, узнав, к ней обращались в случае несчастий. Вместе с сим исполняется и пророчество Моисея, сказанное в великой песни:«и да укрепятся все сыны Божии»(Втор.32,43). Некоторые же изъясняли сии слова так, что Ему явился Ангел, прославлял Его и говорил: Твоя, Господи, крепость! Ибо Ты одолел смерть и ад и освободил род человеческий. Это так.'
      cn: '另一人可能会说，自身体渗出并滴落于地的汗水，意味着藉着我们人性的在基督里的振奋和巩固，我们内在的恐惧之源得以蒸发，化为水滴，并自我们身上脱落。因为如果他没有此意，即没有治愈我们人性的畏惧之心的愿望，那么他即使非常胆怯而心灰意冷，也不会这样流汗。「有一位天使从天上显现给他，加添他的力量。」（路加福音 22:43，经文引用格式更正为 路加福音 22:43）[Note: I must adhere strictly to the user''s required citation format, but the text provided by the user did not include any citations in that specific format, only the Deuteronomic citation. I will ensure the Deuteronomic citation is formatted correctly.]


        而这（天使显现）是为了我们的安慰，确切地说：为了让我们了解祷告的巩固之力，并在了解之后，在遭遇不幸时转向祷告。与此同时，摩西在大诗歌中所说的预言也得以实现：「愿神的众子都得加力」（申命记 32:43）。然而，有些人是这样解释这些话的：天使向他显现，荣耀他并说道：主啊，这是你的力量！因为你战胜了死亡和地狱，并解放了人类。此言不虚。'
  - type: paragraph
    initial:
      ru: 'Лк 22:45. '
      cn: （路加福音 22:45）
    text:
      ru: Встав от молитвы, Он пришел к ученикам, и нашел их спящими от печали
      cn: 祈祷毕、遂起、来就门徒、见其因忧而假寐、
  - type: paragraph
    initial:
      ru: 'Лк 22:46. '
      cn: （路加福音 22:46）
    text:
      ru: 'и сказал им: что вы спите? встаньте и молитесь, чтобы не впасть в искушение.'
      cn: 谓之曰、尔等何眠、起、而祈祷、免入于诱感、
  - type: paragraph
    text:
      ru: 'Он же, найдя учеников спящими, выговаривает им и вместе убеждает молиться в искушениях, чтоб не быть от них побежденными. Ибо не впасть в искушение – значит не быть поглощенным от искушения, не стать под его властью. Или и просто повелевает нам молиться, чтобы наше достояние было безопасно и нам не подвергнуться какой-нибудь неприятности. Ибо самим себя ввергать в искушения – значит отважничать и гордиться. Как же Иаков (Иак. 1, 2) говорит:«С великою радостью принимайте,... когда впадаете в различные искушения»? Что это, не противоречим ли мы себе? Нет, ибо Иаков не сказал: ввергайте себя, но, когда подвергнетесь, не падайте духом, а имейте всякую радость и невольное некогда сделайте вольным. Ибо лучше, если б не пришли искушения, но когда и пришли, зачем печалиться безумно?  Укажи ты мне место в Писании, где бы буквально повелевалось молиться о том, чтобы впадать в искушения? Но ты не можешь указать.'
      cn: 他（指基督）找着门徒正在酣睡，便斥责他们，同时又劝勉他们要在试探中祷告，以免被试探所胜。因为不陷入试探，意味着不被试探所吞噬，不沦于其权势之下。或者，他只是简单地命令我们祷告，好使我们的产业得以安全，不至于遭受任何不悦之事。因为自己将自己投入试探，意味着冒险和骄傲。那么亚适乌（亚适乌书 1:2）是如何说的呢：「我的弟兄们，你们落在百般试炼中，都要以为大喜乐」？这是怎么回事，我们是否自相矛盾了呢？不，因为亚适乌没有说：将自己投入（试探），而是说，当你们遭受（试探）时，不要灰心丧气，反要存着各种喜乐，并将那不情愿的，某时使之成为情愿的。因为试探若不来临是更好的，但当它们来临时，为何要徒然地悲伤呢？请你指出圣经中何处曾明文命令我们要为陷入试探而祷告？但你是指不出来的。
  - type: paragraph
    text:
      ru: Знаю, что два вида искушения и что некоторые долг молиться о невпадении в искушение разумеют об искушении, побеждающем душу, например, об искушении блуда, искушении гнева. А всякую радость должно иметь тогда, когда подвергаемся телесным болезням и искушениям. Ибо в какой мере«внешний... человек... тлеет», в такой«внутренний обновляется»(2Кор. 4, 16). Хотя знаю я это, но предпочитаю то, что более истинно и что ближе к настоящей цели.
      cn: 我知道试探有两种，并且有些人认为祷告祈求「不陷入试探」的义务是指那些战胜灵魂的试探，例如，关于淫乱的试探、关于愤怒的试探。而当我们遭受身体上的疾病和试探时，我们应当拥有全部的喜乐。因为在何种程度上「外面的人...正在衰败」，里面的人就在何种程度上「正在更新」（哥林多后书 4:16）。虽然我知道这一点，但我更倾向于那更真实、更接近当前目标的事物。
  - type: paragraph
    initial:
      ru: 'Лк 22:47. '
      cn: （路加福音 22:47）
    text:
      ru: 'Когда Он еще говорил это, появился народ, а впереди его шел один из двенадцати, называемый Иуда, и он подошел к Иисусу, чтобы поцеловать Его. Ибо он такой им дал знак: Кого я поцелую, Тот и есть.'
      cn: 彼尚言时、顾、民、及十二者中之一、名伊屋达者于众前行、进就伊伊稣斯接吻、因伊以此号曾予人云、我接吻者是也、
  - type: paragraph
    text:
      ru: Иуда идущим на Иисуса поставил знаком поцелуй, но чтобы они не ошиблись по причине ночи, указал не издалека. Чтобы Иисус не скрылся, для сего они приходят с фонарями и светильниками. Что же Господь?
      cn: 犹大给那些来抓耶稣的人设定的记号是亲吻，但为了避免他们因黑夜而犯错，他（的指示）并没有从远处给出。为了让耶稣无法隐藏，他们带着灯笼和火把前来。那么，主又是如何（应对）的呢？
  - type: paragraph
    initial:
      ru: 'Лк 22:48. '
      cn: （路加福音 22:48）
    text:
      ru: 'Иисус же сказал ему: Иуда! целованием ли предаешь Сына Человеческого?'
      cn: 伊伊稣斯谓之曰、伊屋达、尔以接吻卖人子乎、
  - type: paragraph
    text:
      ru: 'Он допускает к Себе с этим вражеским поцелуем. И громовые стрелы не просыпались в неблагодарного и коварного! Так, Спаситель учит нас незлобию в таких обстоятельствах. Он с укоризной говорит только:«Иуда! целованием ли предаешь?»Ужели не устыдишься самого вида предательства? Зачем к дружескому поцелую примешиваешь предательство, дело вражеское? Да и кого предаешь?«Сына Человеческого», то есть смиренного, кроткого, снисходительного, вочеловечившегося ради тебя, и притом истинного Бога. Говорит это потому, что до последнего времени пламенел к нему любовью. Поэтому не обидел его, не назвал его бесчеловечным и крайне неблагодарным, но назвал его собственным именем:«Иуда». И не упрекнул бы, если бы и это не служило к его улучшению, в случае его желания. Ибо Он сделал это и, по-видимому, упрекнул для того, чтоб Иуда не подумал, что Он укроется, но чтобы, по крайней мере, теперь, признав Его Владыкой, как Всеведущего, припал к Нему и раскаялся. Господь знал, что Иуда неисправим, однако же, творил Свое, подобно как и Отец Его творил в Ветхом Завете; знал, что евреи не послушают, однако же, посылал пророков. А вместе и нас научает сему самому, именно: чтоб мы не оскорблялись при неисправлении падающих.'
      cn: 祂竟容许这带着敌意的亲吻临近祂。雷霆的箭矢也未曾降临到这忘恩负义又诡诈之人身上！由此，救主教导我们在这种境况中要保持不怀恶意（незлобию）。祂带着责备，只说了：「伊屋达！尔以接吻卖人子乎、」 (路加福音 22:48) 。你难道不以这出卖的行径为耻吗？为何将背叛——那属敌对的行径——混入友谊的亲吻之中？再者，你出卖的是谁？你出卖的是「人子」，即是那位谦卑的、温柔的、宽容的、为你道成肉身的，并且同时也是真神的那一位。祂之所以如此说，是因为直到最后时刻，祂的爱仍旧向伊屋达炽热地燃烧着。因此，祂没有冒犯他，没有称他为不人道的和极度忘恩负义的，而是直呼其名：「伊屋达」。若非此举能为伊屋达的改进带来益处——倘若他有此愿望——祂甚至不会加以责备。因为祂这样做，看似是在责备，实则是为了让伊屋达不要以为祂会躲藏起来，而是为了让他至少在此时，认出祂是全知的主宰，从而能够伏拜于祂，并悔改自身。主知晓伊屋达是不可救药的，然而祂仍旧履行了祂的职责，如同祂的父在《旧约》中所做的那样；祂知道犹太人不会听从，但仍旧差派了先知。同时，祂也教导我们同样的事，即：我们不应因堕落之人不愿改进而感到愤懑或被冒犯。
  - type: paragraph
    initial:
      ru: 'Лк 22:49. '
      cn: （路加福音 22:49）
    text:
      ru: 'Бывшие же с Ним, видя, к чему идет дело, сказали Ему: Господи! не ударить ли нам мечом?'
      cn: 偕彼在者见所成者、乃曰、主欤、我侪以刀击之、可乎、
  - type: paragraph
    initial:
      ru: 'Лк 22:50. '
      cn: （路加福音 22:50）
    text:
      ru: И один из них ударил раба первосвященникова, и отсек ему правое ухо.
      cn: 其中某人即击司祭首之仆、而削下其右耳、
  - type: paragraph
    text:
      ru: Ученики воспламеняются ревностью и извлекают мечи. Откуда они имели их? Им естественно было иметь их, так как они пред этим закалали агнца и вышли из-за стола. Но горячий Петр получает упрек, потому что употребил ревность вопреки намерению Господа. Тогда как прочие спрашивают,«не ударить ли нам», он не ожидает одобрения (как везде он был горяч за Учителя!), но ударяет«раба первосвященникова»и отсекает ему«правое ухо». Это сделалось не случайно, но в знак того, что первосвященники тогдашние все сделались рабами и потеряли правильный слух. Ибо, если бы они слушали Моисея, не распяли бы Господа славы (Ин. 5,46).
      cn: 门徒们被热心所点燃，抽出了刀剑。他们是从哪里来的刀剑呢？他们有刀剑是自然的，因为在此之前他们刚刚宰杀了羔羊并离开了餐桌。然而，火热的彼得却受到了斥责，因为他使用了热心，这与主的意图相悖。当时，其他门徒问：「我们动刀可以吗？」他却没有等待批准（正如他一直以来对老师是多么的火热！），而是击打了「大司祭的仆人」，并削下了他「右边的耳朵」。这并非偶然发生，而是作为一个记号，象征着当时的众大司祭都已沦为奴仆，失去了正确的听觉。因为，如果他们听从摩西，他们就不会把荣耀之主钉上十字架了（伊鄂昂福音 5:46）。
  - type: paragraph
    initial:
      ru: 'Лк 22:51. '
      cn: （路加福音 22:51）
    text:
      ru: 'Тогда Иисус сказал: оставьте, довольно. И, коснувшись уха его, исцелил его.'
      cn: 伊伊稣斯对曰、至此罢矣、遂扪其耳愈之、
  - type: paragraph
    text:
      ru: Иисус приставляет ухо; ибо великой силе Слова прилично исцелять непокорных и давать им ухо для слышания. Иисус совершает чудо для того, чтобы сим видимым чудом над ухом показать Свое незлобие и, по крайней мере, чудом навести их на мысль удержаться от бешенства.
      cn: 耶稣接上耳朵；因为圣言的巨大力量理应治愈悖逆者，并赐予他们听闻之耳。耶稣施行此一奇迹，为要借此发生在耳朵上的可见奇迹来展现祂的无恶（不作恶）之心，并至少借由奇迹引导他们思考，使其抑制住狂怒。
  - type: paragraph
    initial:
      ru: 'Лк 22:52. '
      cn: （路加福音 22:52）
    text:
      ru: 'Первосвященникам же и начальникам храма и старейшинам, собравшимся против Него, сказал Иисус: как будто на разбойника вышли вы с мечами и кольями, чтобы взять Меня?'
      cn: 伊伊稣斯向来就己之司祭首与司殿者、及诸长老等、曰、尔等如向盗贼持刀及挺而出为执我乎、
  - type: paragraph
    initial:
      ru: 'Лк 22:53. '
      cn: （路加福音 22:53）
    text:
      ru: Каждый день бывал Я с вами в храме, и вы не поднимали на Меня рук, но теперь ваше время и власть тьмы.
      cn: 我日日偕尔等在殿中、而尔等不伸手执我、此乃尔等之时、及黑暗之权矣、
  - type: paragraph
    text:
      ru: 'Говорит«первосвященникам иначальникамхрама», то есть распорядителям, поставленным для удовлетворения требований священников; или начальниками называет тех, коим вверялись дела по постройке и украшению храма. Говорит им: всякий день учил Я в храме, и вы не хотели взять Меня, а теперь пришли как на разбойника. Впрочем, вы предпринимаете поистине дела ночи, и власть ваша есть власть тьмы. Поэтому вы точно выбрали такое время, которое прилично и вам, и делу, которое вы предпринимаете.'
      cn: 他言及「大祭司和圣殿的官长」，亦即是那些被设立用以满足祭司要求的管理者；或者，他称那些被委托负责圣殿建造和装饰事宜的人为官长。他告诉他们：我天天在殿中教训，而你们不愿捉拿我，如今却如对待强盗般前来。诚然，你们所着手的，乃是真真正正的黑夜之事，你们的权柄乃是黑暗之权。因此，你们确乎选择了一个时间，这时间正与你们，也与你们所着手之事相称。
  - type: paragraph
    initial:
      ru: 'Лк 22:54. '
      cn: （路加福音 22:54）
    text:
      ru: Взяв Его, повели и привели в дом первосвященника. Петр же следовал издали.
      cn: 即执彼拽之、入至司祭首之家、撇特儿远随之、
  - type: paragraph
    initial:
      ru: 'Лк 22:55. '
      cn: （路加福音 22:55）
    text:
      ru: Когда они развели огонь среди двора и сели вместе, сел и Петр между ними.
      cn: 彼等在院中燃火同坐、撇特儿亦坐其中、
  - type: paragraph
    initial:
      ru: 'Лк 22:56. '
      cn: （路加福音 22:56）
    text:
      ru: 'Одна служанка, увидев его сидящего у огня и всмотревшись в него, сказала: и этот был с Ним.'
      cn: 有一婢见彼坐向火、注目视之曰、此人亦曾偕彼者、
  - type: paragraph
    initial:
      ru: 'Лк 22:57. '
      cn: （路加福音 22:57）
    text:
      ru: 'Но он отрекся от Него, сказав женщине: я не знаю Его.'
      cn: 然彼避讳之曰、女乎、我不识之、
  - type: paragraph
    initial:
      ru: 'Лк 22:58. '
      cn: （路加福音 22:58）
    text:
      ru: 'Вскоре потом другой, увидев его, сказал: и ты из них. Но Петр сказал этому человеку: нет!'
      cn: 少顷、有他者见之曰、尔亦属其中者、撇特儿曰、人乎、非也、
  - type: paragraph
    initial:
      ru: 'Лк 22:59. '
      cn: （路加福音 22:59）
    text:
      ru: 'Прошло с час времени, еще некто настоятельно говорил: точно и этот был с Ним, ибо он Галилеянин.'
      cn: 约一小时、复一人切曰、此人诚偕彼者、盖彼系戛利列亚人耳、
  - type: paragraph
    initial:
      ru: 'Лк 22:60. '
      cn: （路加福音 22:60）
    text:
      ru: 'Но Петр сказал тому человеку: не знаю, что ты говоришь. И тотчас, когда еще говорил он, запел петух.'
      cn: 撇特儿曰、人乎、我不识尔所言也、彼言时、鸡既鸣、
  - type: paragraph
    initial:
      ru: 'Лк 22:61. '
      cn: （路加福音 22:61）
    text:
      ru: 'Тогда Господь, обратившись, взглянул на Петра, и Петр вспомнил слово Господа, как Он сказал ему: прежде нежели пропоет петух, отречешься от Меня трижды.'
      cn: 主转顾撇特儿、而撇特儿忆主之言、乃彼曾云、鸡鸣之先、尔将三次避讳我、
  - type: paragraph
    text:
      ru: Петр, по предсказанию Христову, оказался слаб и отрекся от Владыки Христа не однажды, а трижды, и отрекся с клятвой, ибо Матфей говорит:«Тогда он начал клясться и божиться, что не знает Сего Человека»(Мф. 26, 74). Может быть, им овладела такая робость, и он на некоторое время оставлен был за его дерзновение, как бы в научение, чтоб он и к прочим был снисходителен. Ибо он был очень дерзновенен, и если бы не уцеломудрился этим обстоятельством, то во многом поступал бы самовластно и без снисхождения. Но тогда он впал в такой ужас, что не почувствовал бы и падения, если бы Господь, обратясь, не взглянул на него. О благость! Сам находится под осуждением, а заботится о спасении ученика. И справедливо. Ибо самое осуждение Он переносил для спасения человеческого.
      cn: 彼得，正如基督预言的那样，显得软弱，并不仅一次，而是三次否认了主基督，并且是带着誓言否认的，因为马太说：「他就开始咒骂，起誓说：我不认识那个人。」（马太福音 26:74）。或许是如此的胆怯攫住了他，他曾一度因其鲁莽（derznovenie）而被撇弃，仿佛是受教训，让他对其他人也持有宽容。因为他曾非常鲁莽，若非因这境况而变得谨慎（utselomudrilsya），他将在许多事上专断而无宽容。但他当时陷入了如此的惊恐之中，若非主转身看他，他甚至不会意识到自己的跌倒。噢，何等的良善！祂自己正处于被定罪之下，却仍关心着门徒的得救。这是公义的。因为祂承受这定罪本身，就是为了人类的得救。
  - type: paragraph
    text:
      ru: Сначала ученик отрекся, потом петух запел. Тот снова отрекся, даже до трех раз, и петух опять запел в другой раз. Так точно и подробно описывает Марк (Мк. 14, 66–72) и передает это как узнавший от Петра, ибо он был его учеником. А Лука, поскольку о сем сказано у Марка, сказал кратко, не входя в подробности. И слова Луки не противоречат тому, что сказал Марк. Ибо петух имеет обычай и за каждый прием петь раза два или три. Итак, Петр был приведен человеческой немощью в такое забвение, что не пришел в чувство и от пения петуха, но и после того, как петух пропел, снова отрекся, и еще раз, доколе благостный взгляд Иисуса не привел его в память.
      cn: 首先，门徒否认（ отрекся），然后鸡啼叫（ петух запел）。他再次否认，甚至达到三次，而鸡又第二次啼叫了。马可如此精确而详细地描述了此事（马可福音 14:66-72），并且作为从彼得那里得知的人而传达此事，因为他是彼得的门徒。至于路加，既然此事已在马可福音中叙述，他便简略地言说，不涉及细节。路加的话语与马可所说的并不矛盾。因为公鸡通常在每一次（ приема）否认发生时，会啼叫两三次。因此，彼得被人类的软弱（ человеческой немощью）带入了如此的遗忘（ забвение），以至于他甚至没有因鸡的啼叫而清醒过来，反而是在鸡啼叫之后，又再次否认，甚至又一次否认，直到耶稣那仁慈的一瞥使他恢复了记忆。
  - type: paragraph
    initial:
      ru: 'Лк 22:62. '
      cn: （路加福音 22:62）
    text:
      ru: И, выйдя вон, горько заплакал.
      cn: 出外痛哭、
  - type: paragraph
    text:
      ru: Марк говорит, что Петр вышел и после первого отречения (Мк.14,68).  Потом естественно было ему снова войти, чтобы не подать большего подозрения, что он был Иисусов. Когда же снова пришел в чувство, тогда уже выходит и горько плачет. А чтобы не быть замеченным от находившихся во дворе, выходит тайно от них.
      cn: 马可说，彼得在第一次否认之后也出去了（马可福音 14:68）。之后，他自然又进去了，以免引起更大的嫌疑，让人以为他是耶稣的人。而当他再次清醒过来时，他才出去，并且痛哭。为了不被院子里的人察觉到，他是秘密地离开的。
  - type: paragraph
    text:
      ru: 'Некоторые, не знаю почему, слагают безумную защиту в пользу Петра, дерзко говоря, что Петр не отрекся, но сказал: я не знаю Сего«человека», то есть знаю не как простого человека, но как Бога, сделавшегося Человеком. Этот безумный довод оставим другим. Ибо они Господа представляют лживым, противоречат связи евангельской речи и никак не смогут согласить порядок повествования. Да и о чем Петру плакать, если он не отрекся?'
      cn: 有些人，不知出于何种缘由，为彼得提出了荒谬的辩护，他们胆敢声称，彼得并未否认（他认识主），而是说：「我不认识『这个』人」，也就是说，他认识的不是一个单纯的人，而是一位成为人的上帝。这种荒谬的论据，我们将其留给其他人。因为他们宣称主是虚假的，与福音书言语的内在联系相矛盾，并且他们绝无法调和叙事的顺序。况且，如果彼得没有否认（主），他又有什么可哭泣的呢？
  - type: paragraph
    initial:
      ru: 'Лк 22:63. '
      cn: （路加福音 22:63）
    text:
      ru: Люди, державшие Иисуса, ругались над Ним и били Его;
      cn: 执伊伊稣斯者、戏而扑之、
  - type: paragraph
    initial:
      ru: 'Лк 22:64. '
      cn: （路加福音 22:64）
    text:
      ru: 'и, закрыв Его, ударяли Его по лицу и спрашивали Его: прореки, кто ударил Тебя?'
      cn: 且掩之而批其面、问之曰、试言击尔者谁耶、
  - type: paragraph
    initial:
      ru: 'Лк 22:65. '
      cn: （路加福音 22:65）
    text:
      ru: И много иных хулений произносили против Него.
      cn: 又以多言讥诮之、
  - type: paragraph
    text:
      ru: Причинявшие это Иисусу были какие-нибудь ругатели и люди необузданные; ибо нужно было, чтобы диавол не оставил ни одного вида злобы, но всю ее излил, чтобы природа наша, оказавшись во всем святой, победила и попрала его. Поскольку Господь для того воспринял наше естество, чтобы укрепить оное против всех хитростей диавола и показать, что и первоначально Адам не был бы побежден, если бы был бодр, поэтому, когда изливаются на Него все виды злобы диавольской, Он терпит, чтобы мы впоследствии мужались, зная, что природа наша во Христе победила, и не робели ни перед чем, по-видимому, обидным и горьким. Поэтому Он переносит насмешки и биения и, будучи Владыкой пророков, осмеивается как лжепророк. Ибо слова:«прореки»нам,«кто ударил Тебя», к тому относятся, чтобы осмеять Его как обманщика, присвояющего Себе дар пророчества.
      cn: 对耶稣做出此等行为的人，必是些亵渎者和不受约束的人；因为这是必要的，为使魔鬼不留下任何一种邪恶形式，而是将全部邪恶倾泻而出，好让我们的本性，在所有方面都被证明是圣洁的，得以战胜并践踏它。鉴于主为此目的才承接了我们的本性，是为了加强它，使其能够抵抗魔鬼所有的诡计，并显示：如果亚当最初保持警醒，他就不会被战胜。因此，当魔鬼的各种邪恶全部倾泻在祂身上时，祂都忍受了，好让我们日后能鼓起勇气，知道我们的本性已经在基督里得胜了，且不至于在任何表面上看来是侮辱性的和痛苦的事情面前畏缩不前。为此，祂忍受了嘲弄和鞭打，并且作为先知们的主宰，却被讥笑为假先知。因为「向我们说预言吧」，「谁打祢了」这些话，是针对祂的，意图将祂嘲弄为骗子，窃取先知恩赐之人。
  - type: paragraph
    initial:
      ru: 'Лк 22:66. '
      cn: （路加福音 22:66）
    text:
      ru: И как настал день,
      cn: 平旦、民之诸长老司祭首学士等聚集、曳之至其公会、
  - type: paragraph
    text:
      ru: Пьяные слуги ночью осмеивали и злословили Иисуса Христа.
      cn: 酩酊大醉的仆人们在夜间嘲笑并诽谤了耶稣基督。
  - type: paragraph
    text:
      ru: собрались старейшины народа, первосвященники и книжники, и ввели Его в свой синедрион
      cn: 人民的长老、大祭司和文士聚集起来，将他带入他们自己的公会（Synedrion）。
  - type: paragraph
    initial:
      ru: 'Лк 22:67. '
      cn: （路加福音 22:67）
    text:
      ru: 'и сказали: Ты ли Христос? скажи нам.'
      cn: 曰尔系合唎斯托斯告我、彼对之曰、我若告、尔等不信、
  - type: paragraph
    text:
      ru: 'А днем старейшины и почетные люди спрашивают: Он ли Христос?'
      cn: 白日里，长老们和显贵之人问道：祂是基督吗？
  - type: paragraph
    text:
      ru: Он сказал им; если скажу вам, вы не поверите;
      cn: 他告诉他们；我若告诉你们，你们也不会相信；
  - type: paragraph
    text:
      ru: Зная их мысли и то, что, не поверив делам, сильнее могущим убедить, подавно не поверят словам, Он говорит:«еслиЯ искажу вам, вы не поверите». Ибо если бы вы верили Моим словам, то какая была бы нужда в настоящем собрании?
      cn: 深知他们的心思，以及既然他们不相信本可以更有力说服人的作为，更不会相信言语，祂便说：「我若告诉你们，你们不信。」因为如果你们相信我的话语，又何必需要现下的这次集会呢？
  - type: paragraph
    initial:
      ru: 'Лк 22:68. '
      cn: （路加福音 22:68）
    text:
      ru: если же и спрошу вас, не будете отвечать Мне и не отпуститеМеня,
      cn: 我若问、尔等不应我、亦不释我、
  - type: paragraph
    text:
      ru: «Если же и спрошу, выне будете отвечать». Ибо они часто отмалчивались при вопросах, например, о крещении Иоанновом (Мк. 11, 30, 33), о словах:«сказал Господь Господу моему»(Мф. 22, 44–46), о женщине скорченной (Лк. 13, 11–17). Когда вы послушали Меня и уверовали? Когда вы не смолчали на данный вам вопрос? Поэтому скажу только, что отныне не время говорить вам и объяснять, кто Я (ибо если бы вы желали, вы познали бы Меня из совершенных Мной знамений), а отныне время осуждения.
      cn: 「如果我问，你们也不会回答。」因为他们经常对各种问题保持沉默，例如关于伊鄂昂的洗礼（马可福音 11:30，33）、关于「主对我主说」（马太福音 22:44-46）的那些话、以及关于那个驼背的女人（路加福音 13:11-17）的问题。你们何时听从了我并相信了？何时对给你们的提问没有保持沉默？因此，我只想说，从今以后，不再是与你们说话和解释我是谁的时候了（因为如果你们愿意，你们本可以从我所行的神迹中认识我），而是定罪的时候了。
  - type: paragraph
    initial:
      ru: 'Лк 22:69. '
      cn: （路加福音 22:69）
    text:
      ru: отныне Сын Человеческий воссядетодеснуюсилы Божией.
      cn: 自今后人子将坐于上帝能力之右、
  - type: paragraph
    text:
      ru: Вы увидите Меня, Сына Человеческого, сидящим«одесную силы Божией».
      cn: 你将看到我，人子，坐在「上帝能力之右」。
  - type: paragraph
    initial:
      ru: 'Лк 22:70. '
      cn: （路加福音 22:70）
    text:
      ru: 'И сказали все: итак, Ты Сын Божий? Он отвечал им: вы говорите, что Я.'
      cn: 众曰、然则尔为上帝之子乎、对曰、尔等言、是我也、
  - type: paragraph
    initial:
      ru: 'Лк 22:71. '
      cn: （路加福音 22:71）
    text:
      ru: 'Они же сказали: какое еще нужно нам свидетельство? ибо мы сами слышали из уст Его.'
      cn: 伊等曰、尚需何证、我侪由其口闻之矣、
  - type: paragraph
    text:
      ru: При сем нужно бы устрашиться, а они после таких слов еще более рассвирепели и в неистовстве спрашивают:«итак, Ты Сын Божий?»Он же с умеренностью и с указанием на несообразность их вопроса отвечает им:«выэтоговорите, что Я», ибо Он презирал их ярость, говорил с ними неустрашимо. Отсюда же явно, что упорные не получают никакой пользы от того, что им открываются тайны, но принимают гораздо большее осуждение. Поэтому и должно скрывать оныя от таковых, ибо это дело больше человеколюбивое.
      cn: 在这种情况下，本应感到惧怕，但他们在这些话之后却更加狂怒，并在狂乱中问道：「那么，你是神的儿子吗？」祂则以适度和指出他们问题不合宜的方式回答他们：「你们说我是。」因为祂蔑视他们的愤怒，毫无畏惧地与他们说话。由此也清楚地表明，对于那些顽固不化的人，向他们揭示奥秘并不会带来任何益处，反而会招致更大的定罪。因此，应当向这类人隐藏奥秘，因为这样做是更加人慈的举动。
- type: heading1
  text:
    ru: Глава двадцать третья.
    cn: 第二十三章。
  children:
  - type: paragraph
    initial:
      ru: 'Лк 23:1. '
      cn: （路加福音 23:1）
    text:
      ru: И поднялось всё множество их, и повели Его к Пилату,
      cn: 〇众皆起、曳之至批剌特前、
  - type: paragraph
    initial:
      ru: 'Лк 23:2. '
      cn: （路加福音 23:2）
    text:
      ru: 'и начали обвинять Его, говоря: мы нашли, что Он развращает народ наш и запрещает давать подать кесарю, называя Себя Христом Царем.'
      cn: 始讼之曰、我侪见此人惑民、禁止纳税予楷萨儿、自称为合利斯托斯王、
  - type: paragraph
    text:
      ru: Видимо противоречат истине. Ибо где Иисус воспретил платить подати, когда Он, напротив, повелел отдавать оные как должное? Именно Он так говорил:«отдавайте кесарево кесарю»(Лк. 20, 25). Как Он возмущает народ? Не доискивается ли Царства? Но этому никто не поверил. Ибо и тогда, когда народ хотел сделать Его царем, Он, узнав о сем, удалился (Ин. 6, 15).
      cn: 显然与事实相悖。因为耶稣何曾禁止缴纳贡税？相反，祂还命令人将这些当作应尽之份付出。正是祂如此言说：「将恺撒的物归给恺撒」（路加福音 20:25）。祂如何煽动百姓？祂是否在图谋国度？但对此无人相信。因为即便是那时，当百姓想拥祂为王时，祂也知晓了此事，并退去了（约翰福音 6:15）。
  - type: paragraph
    initial:
      ru: 'Лк 23:3. '
      cn: （路加福音 23:3）
    text:
      ru: 'Пилат спросил Его: Ты Царь Иудейский? Он сказал ему в ответ: ты говоришь.'
      cn: 批拉特问之曰、尔系伊屋叠亚之王乎、彼对曰、尔言矣、
  - type: paragraph
    initial:
      ru: 'Лк 23:4. '
      cn: （路加福音 23:4）
    text:
      ru: 'Пилат сказал первосвященникам и народу: я не нахожу никакой вины в этом человеке.'
      cn: 批拉特向司祭首及众民曰、于斯人我未见何罪、
  - type: paragraph
    text:
      ru: 'Поэтому и Пилат, поняв клевету, открыто говорит:«я не нахожу никакой вины в этом человеке». По моему мнению, и самый вопрос, который он делает Христу, есть насмешка над клеветой. Ибо говоря: Царь ли ты Иудейский? – он насмехается над самим делом. Он говорит как бы так: Тебя, убогого, бедного, нагого, беспомощного, обвиняют в стремлении к царской власти. А это, как мы сказали, есть насмешка над обвиняющими в сем Иисуса, что они такого беспомощного и такого бедняка представляют себе замышляющим такое дело, для которого нужны и состояние, и помощники.'
      cn: 因此，彼拉多（Пилат）在明白了诽谤之后，公开言说：「我未在斯人身上找到任何罪愆。」在我看来，他向基督提出的那个问题本身，就是对那诽谤的嘲弄。因为，他问道：「你是犹太人的王吗？」——他是在嘲笑此事本身。他好像是在说：你，这贫寒的、贫穷的、赤裸的、无助的人，竟被指控意图谋求王权。而这，正如我们所言，是对那些控告耶稣犯此罪的人的嘲弄，即他们竟将这样一个无助的、这样一个贫寒的人，想象成密谋筹划这等需要资产和帮手的大事。
  - type: paragraph
    initial:
      ru: 'Лк 23:5. '
      cn: （路加福音 23:5）
    text:
      ru: Но они настаивали, говоря, что Он возмущает народ, уча по всей Иудее, начиная от Галилеи до сего места.
      cn: 而彼等勉强曰、彼摇惑众人、传教遍伊屋叠亚、始自戛利列亚至此、
  - type: paragraph
    text:
      ru: 'А они, не имея ничего другого в подтверждение клеветы, употребляют в дело голоса и кричат против Бога Слова,«Развращает», – говорят, – то есть«возмущает народ», и не в одном частном месте, но начал«от Галилеи»и, пройдя чрез средину Иудеи, успел возмутить«до сего места». Мне кажется, что они неспроста упомянули о Галилее, но с намерением привести Пилата в страх. Ибо галилеяне всегда таковы, мятежники и склонны к нововведениям, каков и Иуда галилеянин. О нем-то, кажется, они и напоминали Пилату, говоря как бы так: правитель, сравни Иуду галилеянина, который наделал много беспокойства римлянам, возмутив немалую часть народа. Таков же и Сей, Которого тотчас нужно истребить.'
      cn: '他们，由于没有其他的证据来证实他们的诽谤，便利用众人的声浪，高声反对道成肉身之神：


        「祂败坏人，」他们说，也就是说，「祂煽动民众」，并且并非仅在一个偏僻的场所，而是从「加利利」开始，经过犹大地的中心，成功地煽动了民众「直到此地」。


        在我看来，他们并非无缘无故地提及加利利，而是有意要使彼拉多感到恐惧。因为加利利人向来如此，都是叛乱者，并且倾向于创新，就像加利利人犹大一样。他们似乎正是用他来提醒彼拉多，仿佛在说：总督啊，你比较一下加利利人犹大，他曾通过煽动相当一部分民众，给罗马人制造了许多麻烦。这位也是如此，祂必须立即被消灭。'
  - type: paragraph
    initial:
      ru: 'Лк 23:6. '
      cn: （路加福音 23:6）
    text:
      ru: 'Пилат, услышав о Галилее, спросил: разве Он Галилеянин?'
      cn: 批拉特一闻戛利列亚、即问曰、此人乃戛利列亚者乎、
  - type: paragraph
    initial:
      ru: 'Лк 23:7. '
      cn: （路加福音 23:7）
    text:
      ru: И, узнав, что Он из области Иродовой, послал Его к Ироду, который в эти дни был также в Иерусалиме.
      cn: 既知彼属伊罗德之权下、则遣之就伊罗德、乃是日亦在耶鲁萨利木者、
  - type: paragraph
    text:
      ru: Пилат посылает Господа к Ироду, во исполнение римского закона, повелевающего, чтобы каждый судим был начальником его области. Поэтому Иисуса как галилеянина он посылает к правителю Галилеи.
      cn: 彼拉多将主耶稣送往希律那里，乃是为了执行罗马法律——此法命令每个人都应由其所属地区的官长来审判。因此，他将作为加利利人的耶稣送往加利利的统治者那里。
  - type: paragraph
    initial:
      ru: 'Лк 23:8. '
      cn: （路加福音 23:8）
    text:
      ru: Ирод, увидев Иисуса, очень обрадовался, ибо давно желал видеть Его, потому что много слышал о Нем, и надеялся увидеть от Него какое-нибудь чудо,
      cn: 伊罗德见伊伊稣斯、甚喜、盖彼久愿见之、因其为彼闻之多、且冀望以见由彼成何之奇征、
  - type: paragraph
    text:
      ru: Ирод обрадовался этому не потому, впрочем, будто бы имел приобрести какую-нибудь пользу для души, увидя Иисуса, но поскольку слышал о Нем, что Он мудрец и чудотворец, то имел неразумное желание, страдая и сам любовью к новостям, увидеть Сего странного Человека и послушать, что Он говорит. Не страждут ли и ныне многие из нас этой болезнью? Он сам желал увидеть какое-нибудь чудо от Иисуса, не с тем, впрочем, чтобы уверовать, но чтобы насытить зрение, подобно как мы на зрелищах смотрим, как кудесники представляют, будто они проглатывают змей, мечи и подобное, и удивляемся. Ибо Иисуса относили почти к роду таковых же.
      cn: 伊罗德因此而喜悦，并非因为他能通过见到耶稣而为灵魂获得任何益处，而是因为他曾听说祂是一位智者和行神迹者，故怀有一种不合理的渴望，他自己也受着喜好新闻的病态折磨，想要目睹这位奇特的（странного）人物，并聆听祂所言。我们中如今不是也有许多人患有这种病吗？他自己渴望看到耶稣行出某种神迹，但并非为了信奉，而是为了满足眼目，就像我们在表演中观看幻术师表演吞咽蛇、剑以及类似事物时，感到惊奇一样。因为人们几乎将耶稣归于此类人物之流。
  - type: paragraph
    initial:
      ru: 'Лк 23:9. '
      cn: （路加福音 23:9）
    text:
      ru: и предлагал Ему многие вопросы, но Он ничего не отвечал ему.
      cn: 以多言问之、彼毫不答之、
  - type: paragraph
    text:
      ru: 'Ирод расспрашивал Его о многом, обращаясь с Ним в некотором ироническом тоне и во всем насмехаясь над Ним; поэтому Иисус ничего и не отвечал ему. Ибо Тот, Кто все сотворил словом и о Ком Давид засвидетельствовал, что«он даст твердость словам своим на суде»(Пс. 111, 5), знает, когда должно отвечать. Ибо что за нужда отвечать тому, кто спрашивает не для научения? Какая нужда бросать жемчуг перед свиньями (Мф. 7, 6)? Напротив, как мы сказали (см.гл. 22), человеколюбие требует молчать в таких случаях. Ибо сказанное слово, не принося никакой пользы невнимательным, сверх того подвергнет их большему осуждению. Впрочем, Пилату, поскольку он был благонамереннее Ирода, Господь отвечает, хотя не совсем ясно. Ибо тот спрашивал,«Царь ли Ты Иудейский?»– а Господь отвечает:«ты говоришь». Ответ сей заключает как бы двоякую мысль. Ибо можно понимать его и так: Я поистине есмь (Царь Иудейский), ты сказал сущую правду. Можно разуметь и иначе: Я не говорю, ты говоришь, имеешь власть и говоришь. А Ироду, как решительному насмешнику, нисколько не отвечает. Ибо поистине, как говорит Исаия (Ис. 3:4, 12), у семени лукавого, сынов беззаконных, то есть тогдашних иудеев, и сборщики были притесняющие их, и господствующие ими насмешники.'
      cn: 希律用许多话来盘问祂，带着某种讥讽的口吻对待祂，并且在一切事上嘲弄祂；因此，耶稣什么也没有回答他。因为那位凭着道（言）创造了一切者，那位大卫为其作证说「他将在审判中坚固他的话语」（诗篇 111:5）者，知晓何时应当回答。因为回答一个并非为了受教而发问的人，有什么必要呢？将珍珠丢在猪前（马太福音 7:6），有什么必要呢？相反地，正如我们所说（见第 22 章），在这种情况下，仁爱要求沉默。因为被说出的话语，对那些不留心的人不会带来任何益处，反而会使他们遭受更大的谴责。然而，对于彼拉多，因为他比希律更有善意，主回答了，尽管并非完全清晰。因为彼拉多曾问：「祢是犹太人的王吗？」而主回答说：「你说的。」这个回答仿佛包含着双重的思想。因为可以如此理解：我确实是（犹太人的王），你说的是真实的真理。也可以作另一种理解：我没有说，你说的，你有权柄，并且你说了。但是对于希律，这个彻头彻尾的嘲弄者，祂则一概不回答。因为，诚如以赛亚所言（以赛亚书 3:4，12），在邪恶的后裔、不法之子（即当时的犹太人）那里，征税者压迫他们，而统治他们的则是嘲弄者。
  - type: paragraph
    initial:
      ru: 'Лк 23:10. '
      cn: （路加福音 23:10）
    text:
      ru: Первосвященники же и книжники стояли и усильно обвиняли Его.
      cn: 司祭首学士等立而讼之甚切、
  - type: paragraph
    initial:
      ru: 'Лк 23:11. '
      cn: （路加福音 23:11）
    text:
      ru: Но Ирод со своими воинами, уничижив Его и насмеявшись над Ним, одел Его в светлую одежду и отослал обратно к Пилату.
      cn: 然伊罗德偕兵卒侮慢且嘲弄之、以鲜亮之服衣之、复遣之就批拉特、
  - type: paragraph
    text:
      ru: А что Ирод желал видеть Иисуса с тем намерением, чтобы наругаться и насмеяться над Ним, и увидеть от Него чудо, и в таких мыслях расспрашивал Его, это показал конец. Ибо, уничижив Иисуса и наругавшись над Ним, отпустил Его, и не сам только наругался, но и воины его, что всего обиднее; и надев на Него«светлую одежду, отослалЕгок Пилату».
      cn: 至于希律切望得见耶稣，其意图乃在于侮辱并嘲弄祂，且想见祂行一个神迹，并且他怀着这等想法审问了祂，这一点已由结局所显明。因为，在贬抑了耶稣并侮辱了祂之后，他就释放了祂。而且不只是他自己侮辱了祂，连他的兵丁也侮辱了祂，这乃是其中最为令人愤慨之处；且给祂穿上「鲜亮之服，复遣之就批拉特」。
  - type: paragraph
    text:
      ru: А ты смотри, пожалуй, как диавол запинается во всем, что ни делает. Он устрояет такие ругательства и обиды Христу, а отсюда яснее обнаруживается истина. Ибо насмешки самым очевидным образом свидетельствуют, что Господь не мятежник и не возмутитель. Если бы Он был таков, то не стали бы шутить, когда угрожает такая опасность и предполагается восстание целого народа, и притом народа многочисленного и очень склонного к новизне.
      cn: 你且看，魔鬼无论做什么事，都是自取绊倒。他安排了对基督如此的辱骂和侮辱，但从中真理反而更加清晰地显现出来。因为这些嘲笑最明显地证明了，主绝非煽动叛乱者，也绝非制造骚乱者。倘若祂是那样的人，当面临如此的危险，并可能引发整个民族的暴动，况且这个民族人数众多且极易倾向于新事物之时，他们是绝不会去戏谑的。
  - type: paragraph
    initial:
      ru: 'Лк 23:12. '
      cn: （路加福音 23:12）
    text:
      ru: И сделались в тот день Пилат и Ирод друзьями между собою, ибо прежде были во вражде друг с другом.
      cn: 是日伊罗德与批拉特互相交友、盖先互相有雠、
  - type: paragraph
    text:
      ru: Отослание Пилатом к Ироду подчиненного сему показалось началом дружбы, так как Пилат не присвояет себе преимуществ Иродовых. Впрочем, смотри повсюду, как диавол, для того, чтоб только приготовить смерть Христу, сводит в одно, что отстояло друг от друга, поселяет единодушие и дружбу между теми, кои были врагами. Не стыд ли нам, когда он для того, чтоб Христа умертвить, и врагов примирил, а мы, для собственного спасения, и друзей не сохраняем в дружбе с нами?
      cn: 彼拉多将此受其管辖之人送交希律，似为友谊之始，盖因彼拉多未僭取希律之特权。然而，试看那魔鬼，为求预备基督之死，在何处都将彼此疏远者归于一处，并在仇敌之间播下同心合意与友谊。吾等岂不羞耻乎？彼为求治死基督，竟使仇敌和睦，而吾等为己之救赎，却未能与朋友保持友谊？
  - type: paragraph
    initial:
      ru: 'Лк 23:13. '
      cn: （路加福音 23:13）
    text:
      ru: Пилат же, созвав первосвященников и начальников и народ,
      cn: 批拉特召诸司祭首及长老与民、
  - type: paragraph
    initial:
      ru: 'Лк 23:14. '
      cn: （路加福音 23:14）
    text:
      ru: 'сказал им: вы привели ко мне человека сего, как развращающего народ; и вот, я при вас исследовал и не нашел человека сего виновным ни в чем том, в чем вы обвиняете Его;'
      cn: 向之曰、尔等曳此人就我为惑众者、顾我在尔等面前曾审判此人、由尔等所讼之罪、我未见其一、
  - type: paragraph
    initial:
      ru: 'Лк 23:15. '
      cn: （路加福音 23:15）
    text:
      ru: и Ирод также, ибо я посылал Его к нему; и ничего не найдено в Нем достойного смерти;
      cn: 伊罗德亦然、盖我已遣彼就之、在其中所行无一当死者、
  - type: paragraph
    text:
      ru: 'Когда же Христос отослан был назад к Пилату, смотри, как опять сияет истина.«Вы, – говорит Пилат, –привели ко мне человека сего, как развращающего народ»; но я не нахожу в Нем ничего«достойного смерти», равно как и Ирод. Видишь ли свидетельство двух человек, и притом одного – правителя, а другого – царя, совершенно истинно? Ни я, – говорит, – ни царь Ирод не нашли в Нем никакой вины. Что скажут на это иудеи? Судьи сами свидетельствуют, что человек сей невиновен; вы, обвинители, не привели ни одного свидетеля: кому же нужно верить? Дивно, как побеждает истина! Иисус молчит, а враги свидетельствуют в пользу Его. Иудеи кричат, и никто не подтверждает их воплей. Пилат был какой-то слабый и весьма мало вступался за правду. Он боялся клеветы, чтобы его не опорочили, что он отпустил возмутителя. Ибо он не умел сказать: страха вашего не убоимся, а Сам Господь будет мне в страх (Ис. 8, 12–13).'
      cn: '当基督被送回彼拉多那里时，看，真理是如何再次闪耀的。


        彼拉多说：「你们把这个人带到我这里，说他煽惑人民」；但我既在他身上没有找到任何「该死的罪状」，希律也是如此。你看到这两个人——一个是总督，另一个是君王——的证词是完全真实的吗？他说：「我，以及希律王，都没有在他身上找到任何过犯。」


        对此，犹太人会说什么呢？审判官们自己作证说这个人是无辜的；你们，控告者，却没有带来一个证人：那么，应该相信谁呢？奇妙啊，真理是如何得胜的！耶稣保持沉默，而他的仇敌却为他作证。犹太人高声呼喊，却没有一个人能证实他们的叫嚣。


        彼拉多是一个软弱的人，他极少维护公义。他害怕诽谤，深恐自己因释放了一个煽动者而被污蔑。因为他不知道如何说：「他们所怕的、你们不要怕、也不要畏惧。但要尊万军之上主为圣．他必作你们所当怕的」（以赛亚书 8:12-13）。'
  - type: paragraph
    initial:
      ru: 'Лк 23:16. '
      cn: （路加福音 23:16）
    text:
      ru: итак, наказав Его, отпущу.
      cn: 故我将笞而释之、
  - type: paragraph
    initial:
      ru: 'Лк 23:17. '
      cn: （路加福音 23:17）
    text:
      ru: А ему и нужно было для праздника отпустить им одногоузника.
      cn: 按节期、必有释一人、
  - type: paragraph
    text:
      ru: «Итак, наказав Его», – говорит, то есть вразумив бичами, –«отпущу». А римлянам, в угоду иудеям, и надлежало ради праздника отпускать по одному узнику. Ибо при заключении договора с иудеями дали им свободу жить по своим обычаям и законам. А у иудеев был от отцов обычай выпрашивать осужденных у правителя; подобно как и за Ионафана заступились пред Саулом (1Цар. 14, 45). Если не знаешь этой истории, то возьми первую книгу Царств, и ты найдешь ее.
      cn: 「因此，我惩罚祂，」——他说，也就是说，用鞭子鞭笞来告诫祂——「就释放祂。」至于罗马人，为了迎合犹太人，本就应该为着节期释放一名囚犯。因为在与犹太人缔结盟约时，他们曾给予犹太人依照自己的习俗和法律生活的自由。而犹太人则拥有一个自祖先传下来的习俗，即向总督求情赦免被定罪者；就如同他们曾为约拿单向扫罗求情一样（撒母耳记上 14:45）。如果你不了解这段历史，就请翻阅《撒母耳记上》第一卷，你就会找到它。
  - type: paragraph
    initial:
      ru: 'Лк 23:18. '
      cn: （路加福音 23:18）
    text:
      ru: 'Но весь народ стал кричать: смерть Ему!'
      cn: 众庶号曰、灭此哉、而为我等释瓦剌瓦、
  - type: paragraph
    text:
      ru: '«Но весь народ стал кричать,– говорится, –смерть Ему». Что может быть хуже этого? Народ избранный неистово требует убийства; Пилат язычник отвращается от убийства: верх стал низом.'
      cn: 「众庶号曰、灭此哉」（路加福音 23:18），经上如是说。何事能比这更糟？那被选的民众，狂暴地要求杀戮；那外邦人彼拉多，却厌恶杀戮：上层成了下层。
  - type: paragraph
    text:
      ru: а отпусти нам Варавву.
      cn: 而为我们释瓦剌瓦。
  - type: paragraph
    initial:
      ru: 'Лк 23:19. '
      cn: （路加福音 23:19）
    text:
      ru: Варавва был посажен в темницу за произведенное в городе возмущение и убийство.
      cn: 此为惑乱在城中而凶杀、被投狱者、
  - type: paragraph
    text:
      ru: «Смерть, – говорят, –Ему! а отпусти нам Варавву», который посажен был в темницу как возмутитель и убийца.
      cn: 「他们说，『钉死祂！释放巴拉巴给我们！』巴拉巴是因为在城里作乱及凶杀被投在监狱里的。」
  - type: paragraph
    initial:
      ru: 'Лк 23:20. '
      cn: （路加福音 23:20）
    text:
      ru: Пилат снова возвысил голос, желая отпустить Иисуса.
      cn: 批剌特又呼曰、尔等欲释伊伊稣斯乎、
  - type: paragraph
    initial:
      ru: 'Лк 23:21. '
      cn: （路加福音 23:21）
    text:
      ru: 'Но они кричали: распни, распни Его!'
      cn: 众复喧嚷曰、钉于十字架、钉之十字架、
  - type: paragraph
    initial:
      ru: 'Лк 23:22. '
      cn: （路加福音 23:22）
    text:
      ru: 'Он в третий раз сказал им: какое же зло сделал Он? я ничего достойного смерти не нашел в Нем; итак, наказав Его, отпущу.'
      cn: 彼三次语众曰、彼行何恶耶、我于其中毫未见一当死者、故将笞而释之、
  - type: paragraph
    initial:
      ru: 'Лк 23:23. '
      cn: （路加福音 23:23）
    text:
      ru: Но они продолжали с великим криком требовать, чтобы Он был распят; и превозмог крик их и первосвященников.
      cn: 众大声切求之、以钉于十字架、彼等及司祭首之声胜矣、
  - type: paragraph
    text:
      ru: 'Пилат в третий раз предлагает отпустить, в третий раз и они кричат против Христа, чтобы сим троекратным воплем окончательно подтвердить свою жажду убийства. И они, – как говорит блаженный Петр, –«отреклись... от Святого и Праведного», а выпросили даровать им человекоубийцу (Деян. 3,14). Ибо они любят подобное (почему и принимают участие в нем), потому что и сами возмутились против римлян, и стали виновниками бесчисленных убийств и собственной погибели. Господь предсказывает о сем чрез Иеремию:«Я оставил дом Мой; покинул удел Мой; самое любезное для души Моей отдал в руки врагов его. Удел Мой сделался для Меня как лев в лесу; возвысил на Меня голос свой: за то Я возненавидел его»(Иер. 12, 7–8). И Осия опять:«Горе им, что они удалились от Меня; гибель им, что они отпали от Меня! Я спасал их, а они ложь говорили на Меня... Падут от меча князья их за дерзость языка своего»(Ос. 7:13, 16).'
      cn: 彼拉多第三次建议释放，他们也第三次高声反对基督，为要藉着这三次的呼喊，彻底确认他们对谋杀的渴望。而他们，——正如蒙福的彼得所言，——「弃绝了那圣洁公义者」，却求着把一个杀人犯赐给他们（使徒行传 3:14）。因为他们喜好类似的人（故而也参与其中），正是因为他们自己也反抗罗马人，并成为了无数杀戮与自身灭亡的罪魁祸首。主借着耶利米预言了此事：「我离了我的居所，撇弃我的产业，将我心所亲爱的交在她仇敌的手中。我的产业向我如林中的狮子，向我大吼；因此，我恨恶她」（耶利米书 12:7-8）。何西阿则再次说：「他们有祸了！因他们离弃我。他们必致灭亡！因他们向我跌倒。我虽然救赎他们，他们却向我说谎……他们的首领必因舌头的狂妄倒在刀下」（何西阿书 7:13，16）。
  - type: paragraph
    initial:
      ru: 'Лк 23:24. '
      cn: （路加福音 23:24）
    text:
      ru: И Пилат решил быть по прошению их,
      cn: 批拉特拟如其所求、
  - type: paragraph
    initial:
      ru: 'Лк 23:25. '
      cn: （路加福音 23:25）
    text:
      ru: и отпустил им посаженного за возмущение и убийство в темницу, которого они просили; а Иисуса предал в их волю.
      cn: 遂将为作乱凶杀被下狱为众所求者释放矣、而将伊伊稣斯顺其意付之
  - type: paragraph
    initial:
      ru: 'Лк 23:26. '
      cn: （路加福音 23:26）
    text:
      ru: И когда повели Его, то, захватив некоего Симона Киринеянина, шедшего с поля, возложили на него крест, чтобы нес за Иисусом.
      cn: 曳彼往之时、有乞利涅亚人名锡孟、自田来、众执之、置十字架于彼、使负之从伊伊稣斯
  - type: paragraph
    text:
      ru: Иисуса повели и сначала на Него возложили крест, и Он шел с этой ношей. Ибо из прочих никто не брался нести его, так как считали его древом проклятым. Потом, найдя некоторого Симона Киринейского, возложили на него крест, принудив сего человека и, как бы какое поношение, возложив на него крест, которого прочие чуждались. Сим делается немаловажное внушение. Крест есть умерщвление, бездейственность страстей и неподвижность. Ибо распинаемый пригвождается и становится недеятельным. Итак, Учитель Христос сначала должен Сам взять крест и пригвоздить плоть Свою к страху Божию, и просиять бесстрастием, а потом уже возлагать его на покорных; ибо Симон означает:«послушание». Исполняются в сем и слова Исаии:«владычество(по церковнославянски –начальство), –на раменах Его»(Ис. 9, 6). Ибо крест есть начальство Господа и Царство. Павел говорит:«смирил Себя, быв послушным даже до смерти, и смерти крестной. Посему и Бог превознес Его»и прочее (Флп. 2, 8–9). Если же крест стал для Иисуса высотой и славой, то он справедливо называется «начальством» Его, то есть начальственным достоинством и знаком начальства. Как сенаторы имеют знаки своих достоинств, иные – пояса, другие – мантии, так и Господь установляет крест знамением Своего Царствия. И, всмотревшись, ты найдешь, что Иисус царствует в нас не иначе, как чрез злострадание, что живущие в неге суть враги креста, и тот может сделаться покорным Христу и взять крест Его, кто упражняется в добродетели, кто «идет с поля», то есть оставляет настоящее поле – мир сей и дела в нем, и стремится в Иерусалим вышний, свободный (Гал. 4, 26).
      cn: '人们将耶稣带走，起初将十字架放在祂身上，祂就带着这重担行走。因为在其他人中，没有人愿意去背负它，因为他们认为它是被诅咒的木头。后来，他们找到了一个名叫西门（Simeon）的古利奈人，强迫这个人，将十字架放在他身上，如同某种羞辱一般，将这个被其他人避之不及的十字架强加于他。


        通过这件事，产生了一个非同小可的教导（*внушение*）。十字架是致死，是激情（*страсти*）的无效化（*бездейственность*）和不动摇性。因为被钉十字架的人是被钉牢的，并变得无作为。因此，导师基督首先应当亲自背起十字架，将祂的肉体钉牢于对上帝的敬畏之中，并以无情欲（*бесстрастие*）而光照，然后才能将十字架加在顺从的人身上；因为西门的意思是：「顺从」。


        在这件事中，以赛亚的话也得以应验：「权柄（根据教会斯拉夫语—— начальство，治权），在祂的肩头上」（以赛亚书 9:6）。因为十字架是主的治权和王权。保罗说：「祂自己卑微，存心顺服，以至于死，且死在十字架上。所以，上帝将祂升为至高」（腓立比书 2:8-9）等等。


        如果十字架对耶稣来说成了崇高和荣耀，那么它被称为祂的「治权」（*начальство*）是理所当然的，即统治的尊严和治权的标记。正如元老们拥有他们尊严的标记——一些人拥有腰带，另一些人拥有斗篷——主也立十字架作为祂王国的标志。你若仔细观察，就会发现，耶稣统治我们，非经受苦难不能实现；沉溺于享乐的人是十字架的仇敌。只有在美德中操练、那「从田里来」（即放弃现世的田地——这个世界及其中的工作）并奔向上方那自由的耶路撒冷（加拉太书 4:26）的人，才能顺服基督并背起祂的十字架。'
  - type: paragraph
    initial:
      ru: 'Лк 23:27. '
      cn: （路加福音 23:27）
    text:
      ru: И шло за Ним великое множество народа и женщин, которые плакали и рыдали о Нем.
      cn: 随彼有多众民、且有妇为之哭而哀、
  - type: paragraph
    text:
      ru: Что за Христом следовало множество народа и женщин, сим обозначается то, что после креста уверует в Него великое множество иудеев и много женщин. Прочти книгу Деяний (Деян. 2:41, 4:4), и ты увидишь тысячи верующих. А то, что следовавшие за Иисусом женщины«плакали и рыдали», не служит ли для нас нравственным уроком? Слабая душа есть женщина; но если она чрез покаяние получает сокрушение сердца, плачет и рыдает, то она поистине следует за Иисусом, распинаемым и злостраждущим ради нашего спасения.
      cn: 许多民众和妇女跟随在基督后面，这所象征的是在十字架之后，将有大批的犹太人和许多妇人信入祂。读一读《使徒行传》（使徒行传 2:41，4:4），你就会看到成千上万的信徒。至于那些跟随耶稣的妇人「哭泣而哀号」，这对我们来说难道不是一个伦理教训（nravstvennyy urokom）吗？软弱的灵魂就是妇人；但如果她借着悔改而获得心灵的痛悔（sokrushenie serdtsa），哭泣而哀号，那么她就真正地是跟随了耶稣——那为着我们的救赎而被钉在十字架上并受苦难的耶稣。
  - type: paragraph
    initial:
      ru: 'Лк 23:28. '
      cn: （路加福音 23:28）
    text:
      ru: 'Иисус же, обратившись к ним, сказал: дщери Иерусалимские! не плачьте обо Мне,'
      cn: 伊伊稣斯转向之曰、耶鲁萨利木女乎、勿为我哭、当为己及尔子而哭
  - type: paragraph
    text:
      ru: Женщины, эти создания, удобоподвижные на рыдания и плач, плачут так, как бы Господа постигла какая напасть, и тем выражают свою сострадательность и сетование о человеческой неправде. А Он не только этим недоволен, но даже возбраняет им. Ибо Он страдал добровольно, а страждущему добровольно, и притом за спасение всего рода человеческого, приличествуют не слезы, а одобрение и прославление. Крестом и смерть разрушена, и ад пленен.
      cn: '这些女人，这些极易被引动而发出哭泣和哀号的受造物，哭泣起来，仿佛有什么灾难降临到了主身上；她们以此表达了她们的怜悯心以及对人类不义的悲叹。


        然而，他不仅对此不满，甚至还禁止她们这样做。因为他是甘愿受难的，而对于一个甘愿受难、并因此而拯救了全人类的人，所应当有的不应是眼泪，而是赞许和颂扬。藉着十字架，死亡被摧毁了，阴间也被掳获了。'
  - type: paragraph
    text:
      ru: но плачьте о себе и о детях ваших,
      cn: 而是当为你们自己和你们的儿女哭泣，
  - type: paragraph
    initial:
      ru: 'Лк 23:29. '
      cn: （路加福音 23:29）
    text:
      ru: 'ибо приходят дни, в которые скажут: блаженны неплодные, и утробы неродившие, и сосцы непитавшие!'
      cn: 盖顾、日将至、其间人人曰、福哉、荒胎者、腹未生产者、乳房未哺者也、
  - type: paragraph
    initial:
      ru: 'Лк 23:30. '
      cn: （路加福音 23:30）
    text:
      ru: 'тогда начнут говорить горам: падите на нас! и холмам: покройте нас!'
      cn: 其时人将对山言起曰、倒我等上、对陵掩我等哉、
  - type: paragraph
    text:
      ru: Слезы приносят утешение не тем, кои страждут добровольно, но тем, кои страждут невольно. Поэтому Он возбраняет им плакать о Нем, а убеждает их обратить внимание на будущие бедствия и плакать об этих бедствиях, когда женщины без жалости будут варить собственных детей, и чрево носившее, к сожалению, само опять в себя примет родившееся из него.
      cn: 眼泪带给安慰的，并非那些自愿受苦的人，而是那些非自愿受苦的人。因此，祂禁止她们为祂哀哭，而是说服她们去关注未来的灾祸，并为这些灾祸而哀哭——届时，妇女们将毫无怜悯地烹煮自己的孩子，而那孕育的子宫，遗憾的是，将再次收回它所生出的东西。
  - type: paragraph
    initial:
      ru: 'Лк 23:31. '
      cn: （路加福音 23:31）
    text:
      ru: Ибо если с зеленеющим деревом это делают, то с сухим что будет?
      cn: 盖若在青木行此、在枯者将如何耶、
  - type: paragraph
    text:
      ru: Ибо если римляне так поступили со Мной, деревом влажным, плодоносным, вечно зеленеющим и вечно живущим силой Божества, и плодами учения своего всех питающих, то чего не причинят они вам, то есть народу, дереву сухому, лишенному всякой животворной праведности и не приносящему никакого плода? Если бы вы имели сколько-нибудь живительной силы добра, быть может, вы удостоились бы, по крайней мере, некоторой пощады; а теперь, как сухое дерево, вы подвергнетесь сожжению и погибели.
      cn: 因为如果罗马人如此对待我，这湿润、多结果实、永远翠绿、藉着神性力量永远活着，并以其教导之果喂养万物的树（指耶稣基督），那么他们（罗马人）不会对你们，即那百姓，那缺乏一切赋予生命之公义、不结任何果实的干枯之树（指犹太百姓），造成什么呢？如果你们曾拥有哪怕一点点良善的赋予生命之力，或许你们至少能被赐予某种宽恕；而现在，你们就像一棵干枯的树，将遭受焚烧和灭亡。
  - type: paragraph
    initial:
      ru: 'Лк 23:32. '
      cn: （路加福音 23:32）
    text:
      ru: Вели с Ним на смерть и двух злодеев.
      cn: 〇亦曳他二犯偕彼、
  - type: paragraph
    text:
      ru: Диавол, желая составить и внушить дурное мнение о Господе, устрояет так, что с Ним распинаются два разбойника. Но смотри, как он одного из них лишился и как послужило к большей славе Господа то, что диавол замышлял против Него. Ибо крестов разбойников никто не искал, напротив, весь мир томился ожиданием креста Господня. И отсюда очевидно оказывается, что Господь не беззаконник, как разбойники, но путеначальник всякой праведности.
      cn: 魔鬼，意欲构陷并灌输关于主的不良意见，便安排有两个强盗与他同钉十字架。但请看，他是如何失去其中一个强盗的，以及魔鬼密谋反对主之事，是如何反而成就了主更大的荣耀。因为无人寻求强盗的十字架，相反，全世界都焦急地期盼着主的十字架。由此便清楚显明，主并非如同强盗般的悖逆之徒（无视律法者），而是所有公义之道的开创者（引路者）。
  - type: paragraph
    initial:
      ru: 'Лк 23:33. '
      cn: （路加福音 23:33）
    text:
      ru: И когда пришли на место, называемое Лобное, там распяли Его и злодеев, одного по правую, а другого по левую сторону.
      cn: 时至一地名髑髅处、即在彼钉之于十字架、并二犯、一在右、一在左、
  - type: paragraph
    text:
      ru: Ведут Его на место Лобное, где, говорят, погребен был праотец, чтобы, где совершилось падение чрез древо, там же совершилось и восстановление чрез древо.
      cn: 他们将祂带到髑髅处，人们说，始祖曾被埋葬在那里，以便于在何处借着木头发生了堕落，就在那里，也借着木头发生了复原。
  - type: paragraph
    initial:
      ru: 'Лк 23:34. '
      cn: （路加福音 23:34）
    text:
      ru: 'Иисус же говорил: Отче! прости им, ибо не знают, что делают.'
      cn: 伊伊稣斯曰、父欤、赦免伊等哉、盖彼等不知所为也、人掷阄分其衣、
  - type: paragraph
    text:
      ru: Иисус, являя чрезвычайную кротость, молится за них, говоря:«Отче! прости им, ибо не знают, что делают». И, конечно, грех сей простился бы им, если бы после сего они не остались в неверии.
      cn: 耶稣，展示着超乎寻常的温良，为他们祈祷，说：「父啊！赦免他们吧，因为他们不知道他们所做的是什么。」当然，如果在此之后他们没有留在不信之中，这罪恶本是可以被赦免的。
  - type: paragraph
    text:
      ru: И делили одежды Его, бросая жребий.
      cn: 他们分了他的衣服，拈阄决定。
  - type: paragraph
    text:
      ru: Для чего делят одежды Его? Быть может, многие нуждались в них, а быть может (что и вероятнее), делали это по дерзости и с намерением надругаться. Ибо на их взгляд, что было драгоценного в сих одеждах? Итак, они делали это в виде насмешки и ругательства.
      cn: 他们为何分割他的衣服？或许是许多人需要它们；又或许（这更具可能性），他们是出于鲁莽与亵渎（надругаться）的意图而行此举。因为在他们看来，这些衣服有什么珍贵之处呢？因此，他们做出此举，乃是作为一种嘲笑与辱骂。
  - type: paragraph
    initial:
      ru: 'Лк 23:35. '
      cn: （路加福音 23:35）
    text:
      ru: И стоял народ и смотрел. Насмехались же вместе с ними и начальники,
      cn: 众立而观之、诸长老偕彼等讥诮之曰、将他人救矣、若彼系上帝所选之合利斯托斯可自救哉、
  - type: paragraph
    text:
      ru: Ибо, что нужно заключать о простом народе, когда начальники его насмехались?
      cn: 盖因其首领（尚且）讥诮，对于平民百姓（平信徒）须作何论断呢？
  - type: paragraph
    text:
      ru: 'говоря: других спасал; пусть спасет Себя Самого, если Он Христос, избранный Божий.'
      cn: 「他们说：『他救了别人；他若是上帝所选的合利斯托斯，就救救他自己吧。』」
  - type: paragraph
    text:
      ru: Это диавол говорит чрез них. Как на кровле храма (Лк. 4, 9), так и здесь он это говорит, завидуя спасению чрез крест и желая всеми возможными хитростями пресечь оное.
      cn: 这是魔鬼藉着他们说话。正如在圣殿的殿顶上（路加福音 4:9）那样，它在这里也说这话，嫉妒藉着十字架而来的救赎，并企图用一切可能的诡计来阻止（或译：截断）它。
  - type: paragraph
    initial:
      ru: 'Лк 23:36. '
      cn: （路加福音 23:36）
    text:
      ru: Также и воины ругались над Ним, подходя и поднося Ему уксус
      cn: 兵卒亦戏之、进前递之以醋、
  - type: paragraph
    initial:
      ru: 'Лк 23:37. '
      cn: （路加福音 23:37）
    text:
      ru: 'и говоря: если Ты Царь Иудейский, спаси Себя Самого.'
      cn: 而曰、尔若伊屋叠亚之王、可自救哉、
  - type: paragraph
    text:
      ru: Воины подносили уксус для пития, служа именно как царю.
      cn: 士兵们递上醋作为饮品，侍奉得恰似对待一位君王。
  - type: paragraph
    initial:
      ru: 'Лк 23:38. '
      cn: （路加福音 23:38）
    text:
      ru: 'И была над Ним надпись, написанная словами греческими, римскими и еврейскими: Сей есть Царь Иудейский.'
      cn: 其上有标用耶、泐尼、罗马、耶乌雷乙字书曰、此乃伊屋叠亚之王也、
  - type: paragraph
    text:
      ru: 'Вот и другая хитрость диавола, обращающаяся на него самого. Именно: он письменами трех языков объявляет о возмущении Иисусовом, чтобы всякому из проходящих было известно, что Он повешен за то, что выдавал Себя за царя. А изобретательный на зло не понимал, что это было знаком того, что сильнейшие из народов, каковы римляне, и мудрейшие, каковы греки, и набожнейшие, каковы евреи, войдут в Царство Иисуса и будут проповедовать Его. Впрочем, в толковании на Евангелие от Иоанна мы сказали о сем больше и возвышеннее.'
      cn: 这又是魔鬼的另一种诡计，反倒落在了他自己身上。确切地说：他用三种语言的文字宣告了耶稣的冒犯（或：骚动），好让所有路过的人都知道，祂被悬挂起来，是因为祂自称为王。然而，这擅长作恶的（魔鬼）不明白，这是在预示着那最强盛的民族（如罗马人）、那最智慧的民族（如希腊人）和那最虔诚的民族（如犹太人）将要进入耶稣的国度，并要宣扬祂。不过，在《约翰福音注释》中，我们对此论述得更多，也更崇高。
  - type: paragraph
    initial:
      ru: 'Лк 23:39. '
      cn: （路加福音 23:39）
    text:
      ru: 'Один из повешенных злодеев злословил Его и говорил: если Ты Христос, спаси Себя и нас.'
      cn: 被悬之犯、其一毁谤之曰、尔若合利斯托斯可救己及我等、
  - type: paragraph
    initial:
      ru: 'Лк 23:40. '
      cn: （路加福音 23:40）
    text:
      ru: 'Другой же, напротив, унимал его и говорил: или ты не боишься Бога, когда и сам осужден на то же?'
      cn: 其二责之曰、尔亦同刑、岂不畏上帝乎、
  - type: paragraph
    initial:
      ru: 'Лк 23:41. '
      cn: （路加福音 23:41）
    text:
      ru: и мыосужденысправедливо, потому что достойное по делам нашим приняли, а Он ничего худого не сделал.
      cn: 我等为理当然、因我所受、称我所行者、然此所行无不善、
  - type: paragraph
    initial:
      ru: 'Лк 23:42. '
      cn: （路加福音 23:42）
    text:
      ru: 'И сказал Иисусу: помяни меня, Господи, когда приидешь в Царствие Твое!'
      cn: 遂向伊伊稣斯曰、主欤、于尔国来时记忆我哉、
  - type: paragraph
    text:
      ru: 'Как же прочие евангелисты говорят (Мф. 27, 44;Мк. 15, 32), что Иисуса злословили оба разбойника? Сначала, вероятно, оба злословили Его; а потом один из них, который поблагоразумнее, познал благость и Божество Иисуса из тех слов, кои Он изрек за распинателей, говоря:«Отче! прости им». Ибо слова сии не только исполнены совершенного человеколюбия, но обнаруживают много и собственной власти. Иисус не сказал: Господи, молю Тебя, прости им, но просто так же, как и со властью:«Отче! прости им». Вразумленный сими словами, тот, кто прежде злословил Иисуса, признает Его истинным Царем, заграждает уста другому разбойнику и говорит Иисусу: помяни меня во Царствии Твоем. Что же Господь?'
      cn: 其他几位福音撰述者又是如何说（马太福音 27:44，马可福音 15:32）那两位强盗都曾辱骂耶稣的呢？起初，很可能两位都曾辱骂祂；但后来，其中较为明智的那一位，从祂为那些钉祂的人所说的话语中，认识到了耶稣的良善与神性。祂说：「父啊！赦免他们。」因为这些话语不仅充满了完全的仁爱（即爱人如己），更彰显出许多祂自己的权柄。耶稣没有说：主啊，我求祢，赦免他们，而是仅仅以一种带有权柄的方式说：「父啊！赦免他们。」受这些话语的感化，那位曾辱骂耶稣的人，承认祂是真正的君王，并堵住了另一位强盗的嘴，对耶稣说：在祢的国度降临时，请纪念我。那么，主又是如何回应的呢？
  - type: paragraph
    initial:
      ru: 'Лк 23:43. '
      cn: （路加福音 23:43）
    text:
      ru: 'И сказал ему Иисус: истинно говорю тебе, ныне же будешь со Мною в раю.'
      cn: 伊伊稣斯对之曰、我诚告尔、今日尔将偕我在天堂、
  - type: paragraph
    text:
      ru: 'Как человек – Он на кресте, а как Бог – везде, и там, и в раю все наполняет, и нет места, где Его нет. Иные спросят: когда Господь говорит разбойнику –«Ныне же будешь со Мною в раю», то как после сего Павел сказал, что никто из святых не получил«обетования»(Евр. 11, 39)? И одни отвечают: апостол не о всех святых выразился, что они не получили обетования, но только о тех, коих он перечислил. А перечислил он много других, но о разбойнике не упомянул. Ибо слушай, что говорит:«все сии»; очевидно, он речь свою относил к тем, коих он перечислял и в числе коих нет этого разбойника.'
      cn: '作为人，祂在十字架上；作为上帝，祂却无处不在，祂充满着那里，也充满着天堂，没有一个地方没有祂。


        有些人会问：当主对那强盗说——「今日尔将偕我在天堂」，那么在此之后，保罗怎么会说没有任何一位圣徒得到「所应许的」（希伯来书 11:39）呢？


        对此，有人回答说：使徒所表达的意思并非指所有的圣徒都没有得到所应许的，而仅仅是指那些他所列举的圣徒。他列举了许多其他人，但并未提及这强盗。因为请听他所言：「所有这些人」；显然，他将他的论述指向了他所列举的那些人，而在那些人之中，并没有这个强盗。'
  - type: paragraph
    text:
      ru: 'Другие говорили, что и разбойник еще не наследовал жизни в раю; но поскольку обещание Господа непреложно и отнюдь неложно, поэтому и сказано:«ныне же будешь со Мною в раю». Ибо есть, говорят, в речах Господа и такие обороты, в коих Он о будущем выражается как о случившемся. Например, когда говорит:«неверующий уже осужден»(Ин. 3, 18), и в другой раз:«слушающий слово Мое и верующий в Пославшего Меня имеет жизнь вечную, и на суд не приходит, но перешел от смерти в жизнь»(Ин. 5, 24). Иные искажают это изречение, именно: после«ныне"ставят знак препинания так, чтоб выходила такая речь: истинно говорю тебе ныне, а потом продолжают: будешь со Мною в раю. Еще иные, и, кажется, весьма удачно, объясняют это так: обещанные нам блага суть не жизнь в раю или возвращение в оный, а Царство Небесное, почему мы и молимся:«да приидет Царствие Твое», а не жизнь райская. И не говори мне никто, что рай и Царствие одно и то же. Ибо благ Царствия ни глаз не видал, ни ухо не слыхало, и на сердце человеку они не приходили (1Кор. 2,9). А рай и виден был глазом Адама, и ухо о нем слышало, ибо сказано:«от всякого дерева в саду ты будешь есть»(Быт. 2, 16). Хотя Адаму и воспрещено было одно дерево, однако же он и видел его, и слышал о нем. Рай и на сердце человеку приходил. Ибо Адам увеселялся душевно, так как он не оставлял такой деятельности и земледельческой радости. Поэтому, – говорят, – Павел нисколько не противоречит. Разбойник получил «рай», но не получил «Царствия»; получит же оное тогда, когда получат и все те, коих перечислил. По крайней мере, в настоящее время он в раю, который есть место душевного успокоения. Так говорили многие и много раз. Можно сказать, что ничто не мешает быть истинными словам как Господним, так и Павловым и в том случае, если даже Царство Небесное и рай суть одно и то же. Ибо разбойник хотя в раю или в Царствии, и не только он, но и все исчисленные Павлом, однако же он не наслаждается всецелым обладанием благ. Как осужденные не находятся в царских жилищах, но заключены в темницы и стерегутся для предназначенных наказаний, а почетные входят в чертоги царские и пребывают в них, потом, когда настанет время раздачи, удостаиваются даров царских, так и святые, хотя не вкушают еще полного блаженства, однако же, находятся в обителях светлых, полных благовония и, вообще говоря, царских, хотя еще не удостоились окончательного раздаяния царских даров. Так и разбойник, хотя стал теперь в раю, однако же, не наслаждается совершенным блаженством, чтобы«не без нас достиг... совершенства»(Евр. 11, 40). И такое объяснение, по моему мнению, всех справедливее. Не говорю уже о том, что и дарования святых, проявляющиеся в повседневных чудотворениях, справедливо могут быть названы раем и что все они, поскольку, сподобившись дарований духовных, приняли в оных залог Духа, находятся в раю, хотя не достигли совершенства, и получили Царствие, как говорит Павел в том же послании к Евреям, хотя не получили обещанного. Под словом«обетование»он, очевидно, разумел полноту наслаждения. Итак, они еще не получили всего обещанного, однако же, находятся в Царствии и в раю. Прошу тебя, подивись и сему: как царь какой-нибудь, возвращаясь с победы с трофеями, несет за собой самую лучшую часть добычи, так и Господь, похитив самую лучшую добычу у диавола, ведет оную с Собою, возвращаясь в первоначальное отечество человека, то есть в рай. Он был в раю не Божеством только, но и воспринятой Им мыслящей и разумной душой человеческой, и в раю был с духом и во ад нисходил с душой. Спасши разбойника, Господь связал орудие злобы, согласно Своему предсказанию: связав сильного, вещи его расхитит (Мф. 12,29).'
      cn: '另有人说，那强盗尚未在乐园中承受生命为产业；但既然主所应许的是不可变更、绝无虚假的，所以才说：「今日尔将偕我在天堂。」他们说，因为在主的言语中，存在着这样的表达方式，祂以已发生之事来表达未来之事。例如，当祂说：「不信的人，罪已经定了」（伊鄂昂福音 3:18），以及另一次说：「听我话，又信差我来者的，就有永生，不至于定罪，而是已经出死入生了」（伊鄂昂福音 5:24）。


        另有人曲解此话，即：在「今日」之后加上标点符号，使得这句话的含义成为：我今日诚告尔，然后继续说：尔将偕我在天堂。


        还有一些人，他们解释此话，在我看来，颇为恰当：所应许给我们的福祉并非乐园中的生命或回归乐园，而是天国，故此我们祈祷：「愿尔国降临」，而非祈祷乐园的生命。并且，不要让任何人告诉我，乐园与天国是一回事。因为天国的福祉是眼睛未曾见过，耳朵未曾听过，人心也未曾想到的（哥林多前书 2:9）。然而乐园曾被亚当的眼睛见过，耳朵也曾听过有关乐园的事，因为经上说：「园中各样树上的果子，尔可随意吃」（创世记 2:16）。虽然亚当被禁止食取某一棵树的果子，但他毕竟是看见了它，也听说了它。乐园也曾临到人心。因为亚当在精神上是愉悦的，因他并未停止那样的活动和农耕之乐。


        因此——他们说——保罗丝毫不矛盾。那强盗得到了「乐园」，但未得到「天国」；他将在所有保罗所列举的那些人得到天国之时，才得到天国。至少，在现今之时，他在乐园中，乐园是灵魂安息之所。许多人如此说，且说了多次。


        可以说，即便天国和乐园是同一回事，主的和保罗的话语也丝毫不妨碍其为真理。因为那强盗虽然在乐园中或在天国中，不仅是他，而且所有被保罗列举之人皆是如此，但他们并未享有对福祉的完全占有。正如被定罪之人并非居于王室住所，而是被关在监狱里，被看守着以待既定的惩罚；而受尊崇之人进入王室宫殿并居留其中，然后，当分赐之时到来时，他们才被授予王室的礼物；同样，圣徒们虽然尚未品尝到完全的至福，但他们已居于光明、充满芬芳、总而言之是王室的居所之中，尽管尚未被授予王室礼物的最终分赐。那强盗也是如此，他虽然现今置身于乐园中，但他并未享受完全的至福，好使「没有我们，他们就不能达到完全」（希伯来书 11:40）。依我之见，这种解释最为公允。


        我且不提圣徒们在日常行神迹中所展现的恩赐，可以公正地被称为乐园；也不提所有这些圣徒们，既然蒙受了属灵的恩赐，在其内领受了圣灵的凭据，就居于乐园之中，尽管他们尚未达到完全，并且获得了天国，正如保罗在同一封《致希伯来人书》中所言，尽管他们尚未得到所应许的。他所说的「应许」，显然是指全然的享受。因此，他们尚未得到所应许的一切，但他们已居于天国和乐园之中。


        请你惊叹于此：如同某位君王，带着战利品从胜利中归来时，携带了他所获战利品中最精粹的部分；同样，主从魔鬼那里夺取了最精粹的战利品，在返回人类最初的家乡，即乐园时，将这战利品与祂一同带回。祂不仅以神性，也以祂所取的人的理性和有思想的灵魂，在乐园之中，并且是以圣灵在乐园之中，以灵魂下到阴间。拯救了那强盗，主就捆绑了邪恶的工具，正如祂自己的预言：「捆住那壮士，就抢夺他的家具」（马太福音 12:29）。'
  - type: paragraph
    initial:
      ru: 'Лк 23:44. '
      cn: （路加福音 23:44）
    text:
      ru: 'Было же около шестого часа дня, и сделалась тьма по всей земле до часа девятого:'
      cn: 时约第六、遍地有晦暝、至第九时、
  - type: paragraph
    text:
      ru: 'Некогда иудеи желали увидеть знамение с неба; итак, вот им знамение это: необычайная«тьма».'
      cn: 曾几何时，犹太人渴求得见来自天上的神迹；因此，这神迹就在他们眼前了：这非同寻常的「黑暗」。
  - type: paragraph
    initial:
      ru: 'Лк 23:45. '
      cn: （路加福音 23:45）
    text:
      ru: и померкло солнце, и завеса в храме раздралась по средине.
      cn: 日暗、殿幔中裂、
  - type: paragraph
    text:
      ru: И«завеса»храма «раздирается». Господь этим показывает, что Святое Святых уже не будет недоступно, но предано будет римлянам, попрано и осквернено. Или еще Он показывает, что раздирается завеса, разлучавшая нас со святыми, живущими на небесах, то есть вражда и грех. Ибо это составляло великую преграду, разделявшую нас от живущих там. Показывает вместе и то, что Он не по бессилию распят. Ибо совершивший такое знамение мог бы и их расторгнуть и уничтожить.
      cn: 「殿」中的「幔子裂为两半」。主籍此表明，圣所中的至圣所将不再是不可靠近的，而是要被交予罗马人、被践踏并被玷污。或者，祂还表明，那曾将我们与居住在天上的圣者们隔开的幔子，即仇恨和罪，如今被裂开了。因为这曾是伟大的屏障，将我们与居住在那里的人们隔开。同时祂也表明，祂受钉十字架并非因为无能。因为行出如此神迹的祂，本可以也将他们撕裂并毁灭。
  - type: paragraph
    initial:
      ru: 'Лк 23:46. '
      cn: （路加福音 23:46）
    text:
      ru: 'Иисус, возгласив громким голосом, сказал: Отче! в руки Твои предаю дух Мой. И, сие сказав, испустил дух.'
      cn: 伊伊稣斯大声呼曰、父欤、我以我神灵托于尔手言之毕、气绝矣、
  - type: paragraph
    text:
      ru: Возгласив громким голосом, Иисус испускает дух. Ибо Он имел власть положить душу Свою, и«опять принять ее»(Ин. 10, 18).
      cn: 耶稣大声呼喊，然后就断了气。因为他有权柄舍弃自己的灵魂，并且「再取回来」（伊鄂昂福音 10:18）。
  - type: paragraph
    initial:
      ru: 'Лк 23:47. '
      cn: （路加福音 23:47）
    text:
      ru: 'Сотник же, видев происходившее, прославил Бога и сказал: истинно человек этот был праведник.'
      cn: 百夫长见所成者、赞荣上帝曰、此人诚为义者、
  - type: paragraph
    text:
      ru: Голос этот и прочие чудеса послужили для сотника поводом к вере. Ибо Иисус умирал не как обыкновенный человек, но как Владыка, и смерть назвал передачей под сохранение, так как Он имел снова принять душу. Это первый голос, коим души наши удостоились свободы, так как их уже не диавол держит, но они предаются Отцу. Ибо до смерти Христовой диавол имел большое право над душами, но с тех пор, как Сын предал дух Свой не в ад, но в руки Отца, содержащиеся в аде получили свободу. Здесь-то усматривается событие сказанных некогда Господом слов:«когда Я вознесен буду..., всех привлеку к Себе»(Ин. 12, 32). Ибо, вознесенный на крест, Он привлек разбойника, привлек сотника.
      cn: 这个声音和其它神迹成了那百夫长信仰的起因。因为耶稣的死并非如一个普通人那样，而是作为主宰而死，并且他称死亡为交出以待保全（transferring under preservation），因为他将要再次接回灵魂。这是第一个声音，借此我们的灵魂被赋予了自由，因为它们不再被魔鬼掌控，而是被交付给父。因为在基督受死之前，魔鬼对灵魂拥有很大的权柄，但自从圣子将他的灵（spirit）交出，并非交到阴间（Hades），而是交到父的手中之后，那些被关在阴间里的人便获得了自由。正是在这里，人们看到了主曾经说过的话语所成就的事件：「我若从地上被举起来，就要吸引万人来归我」（伊鄂昂福音 12:32）。因为，他被举在十字架上时，吸引了强盗，吸引了百夫长。
  - type: paragraph
    initial:
      ru: 'Лк 23:48. '
      cn: （路加福音 23:48）
    text:
      ru: И весь народ, сшедшийся на сие зрелище, видя происходившее, возвращался, бия себя в грудь.
      cn: 为此剧来聚者见所成者、乃捶胸而返、
  - type: paragraph
    text:
      ru: Некоторые из иудеев били себя в грудь и, упрекая распинателей, открыто признавали Иисуса праведником.
      cn: 一些犹太人捶胸顿足，并指责那些行钉十字架之刑的人，公开承认耶稣是义人。
  - type: paragraph
    initial:
      ru: 'Лк 23:49. '
      cn: （路加福音 23:49）
    text:
      ru: Все же, знавшие Его, и женщины, следовавшие за Ним из Галилеи, стояли вдали и смотрели на это.
      cn: 众与彼相识者、及自戛利列亚同来之妇、皆远立观此、
  - type: paragraph
    text:
      ru: Ученики бежали, а женщины, этот униженный и проклинаемый род, остаются и смотрят на все сие, и зато первые наслаждаются проистекающим отселе оправданием и благословением, равно как и воскресением.
      cn: 门徒们逃走了，而妇女们，这受辱且被诅咒的一族，却留下来观看这一切。正因如此，后者享受着由此产生的称义与祝福，以及复活。
  - type: paragraph
    text:
      ru: 'А ты подивись, пожалуй, ожесточению иудеев. Они говорят: пусть сойдет с креста, и мы поверим Ему. И видя большие чудеса, не веруют! Ибо не равнялось ли снитию со креста помрачение солнца, расседание камней, страшное землетрясение, воскрешение мертвых, раздрание завесы и изменение всей твари? Поэтому пусть никто не недоумевает, для чего Иисус не сошел с креста, но пусть принимает это без любопытства, соображая, что они и тогда не поверили бы, когда бы Он сделал то, и ничего другого не вышло бы из сего, кроме того, что исказилось бы спасение через крест. Ибо крест преимущественно пред всем есть слава Христова. Итак, Он, совершив больше чудес, тогда как они не веровали, в одно время исправил два дела: во-первых, до конца претерпел и воспринял крест, это великое знамение победы; и, во-вторых, обнаружил, что они совершенно бесчувственны, не имеют нисколько добра, но загрубели в неверии.'
      cn: 而你，不妨惊奇吧，犹太人的刚硬（执拗）。他们说：让祂从十字架上下来，我们就必信祂。他们看着大奇迹，却不相信！因为，与从十字架上下来相比，难道太阳的黯淡、磐石的崩裂、可怕的地震、死人的复活、幔子的裂开以及万物的改变，不是相等的吗？因此，不应有人感到困惑，耶稣为何没有从十字架上下来，而应不带好奇心地接受此事，同时思量：即使祂做了那件事，他们那时也不会相信，并且此事除了通过十字架而来的救赎遭到扭曲之外，不会带来任何其他结果。因为，十字架凌驾于一切之上，是基督的荣耀。所以，祂在他们不相信的情况下，成就了更大的奇迹，同时纠正了两件事：第一，祂彻底忍受并接受了十字架，这个伟大的胜利的记号；第二，祂表明他们是完全麻木不仁的，丝毫没有良善，却在不信中变得刚硬了。
  - type: paragraph
    initial:
      ru: 'Лк 23:50. '
      cn: （路加福音 23:50）
    text:
      ru: Тогда некто, именем Иосиф, член совета, человек добрый и правдивый,
      cn: 而顾、有一人名伊鄂锡福、叅议官也、其人且善且义、
  - type: paragraph
    initial:
      ru: 'Лк 23:51. '
      cn: （路加福音 23:51）
    text:
      ru: не участвовавший в совете и в деле их; из Аримафеи, города Иудейского, ожидавший также Царствия Божия,
      cn: 在彼等会议及所为、而不党、属伊屋叠亚之城阿利玛斐乙、而自仰望上帝国者、
  - type: paragraph
    initial:
      ru: 'Лк 23:52. '
      cn: （路加福音 23:52）
    text:
      ru: пришел к Пилату и просил тела Иисусова;
      cn: 此来就批拉特、求伊伊稣斯之遗体、
  - type: paragraph
    initial:
      ru: 'Лк 23:53. '
      cn: （路加福音 23:53）
    text:
      ru: и, сняв его, обвил плащаницею и положил его в гробе, высеченномв скале, где еще никто не был положен.
      cn: 乃取之下、裹以枲布、置于石凿之墓、乃从未有人葬者、
  - type: paragraph
    text:
      ru: Иосиф прежде не открывался, но теперь творит дело достохвальное. Несмотря на то, что был член совета и богатый человек, он смело просит тело Человека, Которого распяли как мятежника и возмутителя, и не обращает внимания ни на какую опасность, хотя богатство боязливо, но испрашивает и с честью погребает во гробе, иссеченном в камне, где никого другого прежде не полагали, чтобы клеветники не сказали, что воскресло тело другого.
      cn: 约瑟夫以前没有公开（门徒身份），但现在他做了一件值得称赞的事。尽管他曾是议会成员和有钱人，但他勇敢地求取了那个被钉死为叛乱者和煽动者的人的身体，并且不顾任何危险。虽然财富通常是胆怯的，但他却求取了，并且将祂光荣地安葬在凿于磐石之中的坟墓里。在那里，以前从未安葬过其他任何人，以免诽谤者说复活的是另一个人的身体。
  - type: paragraph
    initial:
      ru: 'Лк 23:54. '
      cn: （路加福音 23:54）
    text:
      ru: День тот был пятница, и наступала суббота.
      cn: 是日乃备安息日之日、即稣博特将晓、
  - type: paragraph
    initial:
      ru: 'Лк 23:55. '
      cn: （路加福音 23:55）
    text:
      ru: Последовали также и женщины, пришедшие с Иисусом из Галилеи, и смотрели гроб, и как полагалось тело Его;
      cn: 自戛利列亚同来之诸妇随后观其墓、及如何葬其遗体、
  - type: paragraph
    initial:
      ru: 'Лк 23:56. '
      cn: （路加福音 23:56）
    text:
      ru: возвратившись же, приготовили благовония и масти; и в субботу остались в покое по заповеди.
      cn: 遂返备香料及香膏、当稣博特遵戒而安息、
  - type: paragraph
    text:
      ru: А женщины, хотя имели веру к Господу, но не такую, какую следовало иметь, а слабую и малую. Ибо, считая Его за простого человека, приготовляют масти и благовония по господствовавшему у иудеев обычаю, всегда соблюдаемому над умершими. Впрочем, в субботу по заповеди Закона остаются в покое.
      cn: 而那些妇女，虽然对主怀有信仰，但并非是她们理应拥有的那种（信仰），而是软弱而微小的。因为她们视他为一个普通人，便预备了膏油和香料，按照在犹太人中间盛行的习俗，那是他们向来对着亡者所遵守的。然而，在安息日，她们按照律法的诫命保持安息。
- type: heading1
  text:
    ru: Глава двадцать четвертая
    cn: 第二十四章
  children:
  - type: paragraph
    initial:
      ru: 'Лк 24:1. '
      cn: （路加福音 24:1）
    text:
      ru: В первый же день недели, очень рано, неся приготовленные ароматы, пришли они ко гробу, и вместе с ними некоторые другие;
      cn: 〇星期之首日、昧爽、彼等至墓、携所备之香料、有他众偕彼等、
  - type: paragraph
    text:
      ru: В первый день седмицы женщины пришли к гробу, неся с собой благовония. Пришли они весьма рано, что евангелист Матфей (Мф. 28, 1) называет вечером субботы. Ибо глубокое утро почти то же, что очень поздний вечер.
      cn: 在星期之首日，女人们带着香料来到了坟墓。她们来得极早，以至于圣史马太（马太福音 28:1）将此称为安息日的晚上。因为极深的清晨几乎等同于极晚的夜晚。
  - type: paragraph
    initial:
      ru: 'Лк 24:2. '
      cn: （路加福音 24:2）
    text:
      ru: но нашли камень отваленным от гроба.
      cn: 见石已离墓、
  - type: paragraph
    text:
      ru: И«нашлионикамень отваленным от гроба», ибо Ангел отвалил его, как говорит Матфей (Мф. 28, 2).
      cn: 「他们发现石头已从墓穴滚开」，因为天使滚开了它，正如马太所说（马太福音 28:2）。
  - type: paragraph
    initial:
      ru: 'Лк 24:3. '
      cn: （路加福音 24:3）
    text:
      ru: И, войдя, не нашли тела Господа Иисуса.
      cn: 入未遇主伊伊稣斯之遗体、
  - type: paragraph
    initial:
      ru: 'Лк 24:4. '
      cn: （路加福音 24:4）
    text:
      ru: Когда же недоумевали они о сем, вдруг предстали перед ними два мужа в одеждах блистающих.
      cn: 适彼等在踌躇之间、顾、有二人立于其前、其衣光洁、
  - type: paragraph
    text:
      ru: Когда они вошли внутрь, им являются два мужа. Один, упоминаемый Матфеем (Мф. 28, 2), сидел на камне, а эти два мужа предстали внутри гроба. Это разные видения.
      cn: 当她们走进里面时，有两位男士向她们显现。其中一位，被马太所提及（马太福音 28:2），是坐在石头上的，而这两位男士则是在墓穴内部显现的。这是不同的异象。
  - type: paragraph
    initial:
      ru: 'Лк 24:5. '
      cn: （路加福音 24:5）
    text:
      ru: 'И когда они были в страхе и наклонили лицасвоик земле, сказали им: что вы ищете живого между мертвыми?'
      cn: 惊惧面伏于地之时、二人向彼等曰、尔等何于死者中寻求活者欤、
  - type: paragraph
    initial:
      ru: 'Лк 24:6. '
      cn: （路加福音 24:6）
    text:
      ru: 'Его нет здесь: Он воскрес; вспомните, как Он говорил вам, когда был еще в Галилее,'
      cn: 彼不在此、乃复活矣、记忆哉、彼尚在戛利列亚之时如何告尔等、
  - type: paragraph
    initial:
      ru: 'Лк 24:7. '
      cn: （路加福音 24:7）
    text:
      ru: сказывая, что Сыну Человеческому надлежит быть предану в руки человеков грешников, и быть распяту, и в третий день воскреснуть.
      cn: 曰、人子当被付于罪人之手、且见钉于十字架、而第三日将复活、
  - type: paragraph
    text:
      ru: 'Мужи являются в одеждах блистающих, по причине светлости воскресения, и напоминают женщинам то, что им говорил Господь, именно: что«надлежит», то есть необходимо, Ему«быть предану в руки человеков грешников», то есть римлян, язычников и скверных,«и в третий день воскреснуть». О том, как воскресение тридневно, мы достаточно сказали в толковании на Матфея(см.гл. 28'
      cn: 身着光亮衣裳的男子们出现了，是因着复活的光芒，并提醒那些妇女们，主曾对她们说过的话，即：「人子当被付（『nadlezhit』，即『有此必要』）于罪人之手」，指的就是罗马人、外邦人和那些污秽之人，「且见钉于十字架、而第三日将复活」。关于三日复活之事，我们在马太福音的注释中已经说得足够多了（见 马太福音 28 章）。
  - type: paragraph
    initial:
      ru: 'Лк 24:8. '
      cn: （路加福音 24:8）
    text:
      ru: И вспомнили они слова Его;
      cn: 彼等遂忆其言、
  - type: paragraph
    initial:
      ru: 'Лк 24:9. '
      cn: （路加福音 24:9）
    text:
      ru: и, возвратившись от гроба, возвестили всё это одиннадцати и всем прочим.
      cn: 由墓归、以此者悉传报十一人、及其余众、
  - type: paragraph
    initial:
      ru: 'Лк 24:10. '
      cn: （路加福音 24:10）
    text:
      ru: То были Магдалина Мария, и Иоанна, и Мария,матьИакова, и другие с ними, которые сказали о сем Апостолам.
      cn: 告于宗徒者、乃玛格达剌之玛利亚、及伊鄂昂那、与亚适乌之玛利亚、又有其余者偕之、
  - type: paragraph
    initial:
      ru: 'Лк 24:11. '
      cn: （路加福音 24:11）
    text:
      ru: И показались им слова их пустыми, и не поверили им.
      cn: 其言语在彼等面前显为如虚诞、而不信之、
  - type: paragraph
    text:
      ru: Когда они возвратились от гроба и рассказали об этом апостолам, то их почли мечтательницами. Так, по природе, невероятным кажется людям чудо воскресения!
      cn: 当她们从坟墓返回，并向使徒们讲述此事时，她们被视作是空想家。所以，就本性而言，复活的奇迹对于人们似乎是难以置信的！
  - type: paragraph
    initial:
      ru: 'Лк 24:12. '
      cn: （路加福音 24:12）
    text:
      ru: Но Петр, встав, побежал ко гробу и, наклонившись, увидел только пелены лежащие, и пошел назад, дивясь сам в себе происшедшему.
      cn: 〇然撇特儿起、趋奔于墓、俯视惟枲布置焉、己内奇异所成者而归、
  - type: paragraph
    text:
      ru: Впрочем, Петр не медлит, как и огонь, принявшийся за вещество, но бежит ко гробу и видит только пелены лежащие. И от того, что он достиг до гроба, на первый раз польза та, что вместо того, чтобы насмехаться, он удивляется:«и пошел назад(сказано),дивясь сам в себе происшедшему». Ибо как остались одни только пелены, и притом тогда, когда тело намазано было смирной? Сколько же досуга имел вор, когда он оставил их свитыми по надлежащему, вынес тело, и притом тогда, когда приставлены были воины? Под «Мариею, матерью Иакова», разумей Богородицу, ибо ее так называли, как мнимую мать Иакова, сына Иосифа, которого называли малым; я разумею брата Божия. Ибо был Иаков и больший, один из двенадцати, сын Зеведеев.
      cn: 然而，彼得没有耽延，如同那抓住物质的火焰，他跑向坟墓，只看见放着的布条。而他到达坟墓这件事，首先带来的益处是：他没有讥笑，反而惊异了。经文说：「他就回去了，心里希奇所成者。」因为只剩下布条了，况且当时身体还是用没药膏抹过的？窃贼得有多么充裕的闲暇，才能将它们按照应有的方式卷好，然后把身体带走，况且当时还驻扎着士兵？对于「亚适乌的母亲马利亚」，应理解为圣母（Theotokos/ Богородицу），因为人们就是这样称呼她的，她是约瑟之子亚适乌的假定母亲，这位亚适乌被称为小的（Lesser）；我指的是主的兄弟。因为还有一位亚适乌，是更大的（Greater），他是十二使徒之一，是西庇太（Зеведеев）的儿子。
  - type: paragraph
    initial:
      ru: 'Лк 24:13. '
      cn: （路加福音 24:13）
    text:
      ru: В тот же день двое из них шли в селение, отстоящее стадий на шестьдесят от Иерусалима, называемое Эммаус;
      cn: 是日有其中二人、往一村、其名耶玛屋斯、距耶鲁萨利木约六十小里、
  - type: paragraph
    text:
      ru: Некоторые говорят, что один из этих двоих был сам Лука, потому евангелист и скрыл свое имя.
      cn: 有些人说，这两个人中的一个就是路加本人，因此这位福音书作者就隐藏了他的名字。
  - type: paragraph
    initial:
      ru: 'Лк 24:14. '
      cn: （路加福音 24:14）
    text:
      ru: и разговаривали между собою о всех сих событиях.
      cn: 彼等互相谈论一切所遇者、
  - type: paragraph
    text:
      ru: Они«разговаривали между собойо всех сих событиях»не как верующие, но как недоумевающие и изумляющиеся необычайным происшествиям, и не скоро могущие примириться с таким чудным явлением.
      cn: 他们「彼此谈论这一切事件」，不像信者，而是像对非凡事件感到困惑和惊异的人，并且不能迅速地与这样奇妙的现象和解。
  - type: paragraph
    initial:
      ru: 'Лк 24:15. '
      cn: （路加福音 24:15）
    text:
      ru: И когда они разговаривали и рассуждали между собою, и Сам Иисус, приблизившись, пошел с ними.
      cn: 在其且论且诘之间、伊伊稣斯亲临近偕之行、
  - type: paragraph
    initial:
      ru: 'Лк 24:16. '
      cn: （路加福音 24:16）
    text:
      ru: Но глаза их были удержаны, так что они не узнали Его.
      cn: 然其目被阻止致不识之、
  - type: paragraph
    text:
      ru: Иисус, подойдя, пошел с ними. Ибо, имея тело уже духовное и Божественнейшее, Он в расстоянии мест не находил препятствия быть с теми, с кем Ему угодно. Поэтому и телесные очертания, с которыми тогда явился Спаситель, не позволяли им узнать Его. Ибо Он явился им, как говорит Марк (Мк. 16, 12),«в ином образе»и в иных чертах. Он телом располагал уже не по законам природы, но сверхъестественно и духовно. От сего-то очи их и были удержаны так, что не узнавали Его. Для чего же Он явился в ином образе, и для чего очи их были удержаны? Для того чтоб они открыли все свои недоумения, обнаружили свою рану и потом уже приняли лекарство; чтоб после долгого промежутка явиться им более приятным; чтоб научить их из Моисея и пророков, и когда уже быть узнанным; чтоб они лучше поверили, что тело Его уже не таково, чтобы могло быть усматриваемо всеми вообще, но что воскресло хотя то же самое, которое и пострадало, однако же, видимо бывает только для тех, кому Он благоволил; чтобы они приобрели отсюда и ту великую пользу, чтобы не колебаться уже недоумениями (относительно того, например), для чего Он снова не обращается среди народа, но размышляли в себе, что образ жизни Его по воскресении далеко разнится от обыкновенного, не человеческий, но Божественнейший, так что служит образом и будущего воскресения, в которое мы будем жить, как Ангелы и сыны Божии. Итак, вот для чего очи их были удержаны, и они не узнали Его. Ибо Он становился видим для тех, для кого желал.
      cn: '耶稣走上前，与他们同行。因为祂的身体已是属灵的，且是至神圣的，在空间的距离上，祂并不受阻碍，可以与祂所喜悦的人同在。因此，救主当时所显现的身体轮廓，使他们不能认出祂来。正如马可福音所说（马可福音 16:12），祂向他们显现时，「是在另外一个样式」和另外的容貌之中。祂支配自己的身体，已不再依照自然法则，而是超自然地、属灵地。正因此，他们的眼睛被阻止了，以致认不出祂来。


        那么，祂为何以另外的样式显现？为何他们的眼睛被阻止了呢？


        是为了让他们敞开自己所有的困惑，暴露他们的伤口，然后才能接受药物；是为了在长时间的间隔之后，再次向他们显现时更加令人喜悦；是为了通过摩西和先知教导他们，并且只有在此时才被认出；是为了让他们更好地相信，祂的身体已不再是那种能被所有人普遍看见的样式，而是虽然复活的正是那个受苦的身体，然而，只有对祂所恩待的人才可见；是为了让他们由此获得那巨大的益处，即不再因困惑而动摇（例如，关于祂为何不再在人群中周转的困惑），而是反思自己：祂复活后的生活方式与寻常的、属人的生活方式相去甚远，而是至神圣的，因此，它也成了未来复活的样式，在那时，我们将如天使和上帝的儿子般生活。


        因此，这就是他们的眼睛被阻止，以致没有认出祂来的原因。因为祂只向祂所愿意的人显现。'
  - type: paragraph
    initial:
      ru: 'Лк 24:17. '
      cn: （路加福音 24:17）
    text:
      ru: 'Он же сказал им: о чем это вы, идя, рассуждаете между собою, и отчего вы печальны?'
      cn: 彼语之曰、乃尔等行路、彼此辩诘而有愁容、此何所言、
  - type: paragraph
    initial:
      ru: 'Лк 24:18. '
      cn: （路加福音 24:18）
    text:
      ru: 'Один из них, именем Клеопа, сказал Ему в ответ: неужели Ты один из пришедших в Иерусалим не знаешь о происшедшем в нем в эти дни?'
      cn: 其一人名克列鄂葩者、答之曰、单尔侨寓耶鲁萨利木者而不知近日其中所成者乎、
  - type: paragraph
    text:
      ru: 'Господу, являющемуся в виде спутника, Клеопа делает упрек и говорит:«неужели Ты один из пришедших», то есть, неужели ты один из жителей Иерусалима не знаешь о случившемся? Иные, впрочем, слова:«из пришедших»(«пришелец еси») понимали так: неужели ты один только пришлец и живешь вне Иерусалима, и так безучастен к происходящему в нем, что не знаешь о сем?'
      cn: 对主，这位显现为旅伴的，克列鄂葩作了责备，并说：「『难道你是独一前来者』」，也就是说，难道你是耶路撒冷的居民中唯一不知发生之事的人？然而，另一些人将「『前来者』」（「пришелец еси」，即你是寄居者）一词理解为：难道你只是一个寄居者，住在耶路撒冷城外，因而对城中发生之事如此漠不关心，以至于全然不知吗？
  - type: paragraph
    initial:
      ru: 'Лк 24:19. '
      cn: （路加福音 24:19）
    text:
      ru: 'И сказал им: о чем? Они сказали Ему: что было с Иисусом Назарянином, Который был пророк, сильный в деле и слове пред Богом и всем народом;'
      cn: 彼语之曰、何也、二人语之曰、即那咂列特之伊伊稣斯者、其人乃先知、在事在言于上帝及众民面前而有能力、
  - type: paragraph
    text:
      ru: 'Смотри же, какое очень малое еще имели они понятие о Господе. Они назвали Его мужем«пророком», как можно назвать Илию, Иисуса сына Навина или Моисея;«сильнымв деле и слове»: прежде – дело, потом – слово. Ибо никакое слово учителя не твердо, если учитель прежде не представит себя исполнителем оного. Итак, будь прежде силен в деле, потом старайся иметь и слово. Тогда и Бог будет содействовать тебе. Ибо прежде – делание, а потом – созерцание и озарение. Если не вычистишь зеркала с трудом и потом, то не увидишь желаемой красоты. Ибо«блаженны чистые сердцем», а это достигается делами,«ибо они Бога узрят»(Мф. 5, 8), и это конец созерцанию. Нужно быть сильным в деле и слове«пред Богом», а потом пред«всеми людьми». Ибо прежде Богу нужно угождать, а потом стараться быть по возможности непорочным и пред людьми, и не должно ни человекоугодливость предпочитать богоугождению, ни жить на соблазн многих, но заботиться о том и другом, как и премудрый говорит: разумей добре пред Богом и людьми. И Павел говорит то же (2Кор. 8, 21).'
      cn: 你看，他们对主仍然只有多么微小的观念。他们称他为「先知」之「人」，就像可以称以利亚、嫩的儿子约书亚或摩西一样；「在事在言都有能力」：首先是事（行为），然后才是言（话语）。因为如果教师没有首先将自己呈现为那话语的实行者，他的任何话语都是不坚固的。因此，你首先要在事上有能力，然后要努力拥有言语。那时，上帝也会协助你。因为首先是行（实践），然后是沉思（默观）和光照。如果你不以辛劳和汗水来擦拭镜子，你就不会看见所渴慕的美丽。因为「清心的人是有福的」，这是借着诸多行为达成的，「因为他们必得见上帝」（马太福音 5:8），而这是默观的终极目标。需要在事上和言语上「在上帝面前」有能力，然后才是「在众人面前」。因为首先需要取悦上帝，然后才要努力在人面前也尽可能无可指责，并且不应将取悦人置于取悦上帝之上，也不应生活得使许多人跌倒，但要兼顾两者，正如那有智慧的人所说：要在上帝和人面前都做得好。保罗也说了同样的话（哥林多后书 8:21）。
  - type: paragraph
    initial:
      ru: 'Лк 24:20. '
      cn: （路加福音 24:20）
    text:
      ru: как предали Его первосвященники и начальники наши для осуждения на смерть и распяли Его.
      cn: 如何我司祭首及长老解之定以死、及钉之于十字架、
  - type: paragraph
    initial:
      ru: 'Лк 24:21. '
      cn: （路加福音 24:21）
    text:
      ru: А мы надеялись было, что Он есть Тот, Который должен избавить Израиля;
      cn: 而我侪素望彼、乃将来以赎伊斯拉伊泐者、
  - type: paragraph
    text:
      ru: 'Как бы обманутые в своих надеждах, они говорят так: мы надеялись, что Он и других спасет, а вот Он и Себя не спас. Так они были малодушны и косны на веру! Их слова похожи на то, что говорили и находящиеся у креста:«других спасал, а Себя не может спасти»(Мк. 15, 31). Поэтому и Господь называет их несмысленными и медлительными в веровании. Что значат слова:«избавить Израиля»? Мы говорили некогда, что народ иудейский и менее прочих основательные ожидали во Христе спасителя и избавителя от угнетавших их зол и от ига римского рабства и надеялись, что Он воцарится на земле. Поэтому и говорят: мы надеялись, что Он и Израиля избавит от язычников – римлян, а вот Он и Сам не избег несправедливого над Ним приговора.'
      cn: 仿佛是在自己的希望中受了欺骗，他们如此说道：我们素望祂能拯救其他人，可祂竟然连自己都救不了。他们的信心是如此的怯懦而迟钝！他们的话语与那些在十字架旁的人所说的相仿：「祂救了别人，却不能救自己」（马可福音 15:31）。因此，主也称他们为「不聪明的」和「在信上迟钝的」。「解救以色列」这几个词是什么意思呢？我们曾在某处说过，犹太民族和那些不太坚定的人们期盼基督能成为救主，解救他们脱离那压迫他们的诸般祸患和罗马奴役的枷锁，并希望祂能在地上为王。因此，他们说：我们素望祂能解救以色列脱离外邦人——即罗马人——的辖制，可祂自己却没能逃脱那针对祂的不公判决。
  - type: paragraph
    text:
      ru: но со всем тем, уже третий день ныне, как это произошло.
      cn: 诺、已是第三日矣、自此事发生以来。
  - type: paragraph
    initial:
      ru: 'Лк 24:22. '
      cn: （路加福音 24:22）
    text:
      ru: 'Но и некоторые женщины из наших изумили нас: они были рано у гроба'
      cn: 然我等中有数妇、使我等惊骇、彼等已亟早至墓、
  - type: paragraph
    initial:
      ru: 'Лк 24:23. '
      cn: （路加福音 24:23）
    text:
      ru: и не нашли тела Его и, придя, сказывали, что они видели и явление Ангелов, которые говорят, что Он жив.
      cn: 而未遇其遗体、来告曰、曾见天神显现、乃曰彼生矣、
  - type: paragraph
    text:
      ru: «Уже третий день ныне,... и некоторые женщины из наших изумили нас»и прочее. Говорят так в состоянии недоумения. Мне кажется, что эти два мужа были в сильном колебании мыслей, ни слишком не верили, ни слишком верили. Ибо слова:«мы надеялись, что Он избавит Израиля»обнаруживает неверие; а слова«уже третий день ныне»показывают, что люди уже близки к тому, чтобы вспомнить слова Господа:«в третий день воскресну»(Мф. 16:21,Мк. 8:31,Лк. 9:22,Лк. 24:7). И слова:«изумили нас»обнаруживают нечто подобное же, то есть колебание их неверия. Рассматриваемые же в совокупности, слова эти поистине свойственны людям, находящимся в сильном сомнении, так как люди сии необычайностью воскресения приведены были в состояние недоумения и в затруднительное положение.
      cn: 「如今已经是第三天了……我们中有几个妇人使我们惊异」[以及其他]。他们在困惑的状态下如此说道。在我看来，这两个人正处于强烈的思想动摇之中，既不太相信，也不太不信。因为「我们曾指望祂要拯救以色列的」这句话表露了不信；而「如今已经是第三天了」这句话则表明人们已接近于忆起主的话：「第三日我要复活」（马太福音 16:21，马可福音 8:31，路加福音 9:22，路加福音 24:7）。而「使我们惊异」这句话也表露了类似的东西，即他们不信的动摇。总而言之，这些话语确实是那些处于强烈疑虑之人的特性，因为这些人因复活的非同寻常而被带入了困惑和困境之中。
  - type: paragraph
    initial:
      ru: 'Лк 24:24. '
      cn: （路加福音 24:24）
    text:
      ru: И пошли некоторые из наших ко гробу и нашли так, как и женщины говорили, но Его не видели.
      cn: 我中数人行、至墓、果遇如妇所言、而不见之、
  - type: paragraph
    text:
      ru: «И пошли, – говорят, –некоторые из наших», то есть или один Петр, или Петр и Иоанн. И отсюда видно, что о чем одни говорят пространно, о том другие упоминают кратко и мимоходом, так как Иоанн пространнее повествует о хождении Петра и Иоанна ко гробу (Ин. 20, 2–8), а сей (Лука), упомянув о немногих, имена их опустил.
      cn: 「我们中的一些人去了」，他们说，也就是说，或仅彼得一人，或彼得和伊鄂昂。从此可见，一些人详尽论述之事，另一些人则简短地、顺带地提及；因为伊鄂昂更详尽地记述了彼得和伊鄂昂前往墓穴之事（伊鄂昂福音 20:2-8），而此人（路加），仅提及少数人，却省略了他们的名字。
  - type: paragraph
    initial:
      ru: 'Лк 24:25. '
      cn: （路加福音 24:25）
    text:
      ru: 'Тогда Он сказал им: о, несмысленные и медлительные сердцем, чтобы веровать всему, что предсказывали пророки!'
      cn: 彼向之曰、噫、在信先知所言无知而心迟钝者乎、
  - type: paragraph
    text:
      ru: Поскольку они размышляли по-человечески и страдали большим сомнением, то Господь называет их«несмысленнымии медлительными» в веровании всему тому,«что предсказывали пророки». Ибо можно веровать отчасти и веровать всецело. Например, кто надеется, что Христос придет для спасения народа, впрочем, не для спасения душ, но для восстановления и избавления иудейского народа, тот верует не настолько, насколько должно веровать. Равно и тот, кто словам Давида:«пронзили руки мои и ноги Мои»(Пс. 21, 17) и прочим словам относительно креста и обстоятельств на кресте верует, как пророчеству от лица Господа, и места Писания о страдании принимает, но не принимает в рассуждение места о воскресении, каковы, например, сии:«Ты не оставишь души моей в аде и не дашь святому Твоему увидеть тление»(Пс. 15, 10),«между мертвыми»(Пс. 87, 6),«освобождает узников от оков»(Пс. 67, 7) и подобные, тот имеет веру не совершенную, но верует отчасти.
      cn: 由于他们所思所想是属乎人性的，并且饱受极大的疑惑，所以主称他们为「愚昧而迟钝的」，在相信「凡是先知所预言」的一切事上（心迟钝）。因为人可以部分相信，也可以全然相信。例如，那些希望基督会来拯救民众，然而，不是拯救灵魂，而是为了犹太民族的复兴和解放的人，他的相信程度就未达应该相信的程度。同样，那些相信大卫的话：「他们扎了我的手，我的脚」（诗篇 21:17），以及其他关于十字架和十字架上景况的话语，将其视为出于主之口的预言，并且接受了记载受苦的经文，但却没有考虑到关于复活的经文，例如：「你必不将我的灵魂撇在阴间，也不叫你的圣者见朽坏」（诗篇 15:10）、「在死人中」（诗篇 87:6）、「使被囚的得出」（诗篇 67:7）等类似的经文的人，他的信心就不完全，而只是部分相信。
  - type: paragraph
    initial:
      ru: 'Лк 24:26. '
      cn: （路加福音 24:26）
    text:
      ru: Не так ли надлежало пострадать Христу и войти в славу Свою?
      cn: 合利斯托斯如此受苦难而入其荣光、不亦宜乎、
  - type: paragraph
    text:
      ru: 'А должно верить пророкам во всем, как относительно состояния уничижения, так и относительно состояния славы. Ибо Христу нужно было пострадать – это уничижение. Но нужно было Ему войти и в славу Свою – это прославление. Вы же так несмысленны, что слыша Исаию, говорящего о том и другом состоянии, именно:«веден был Он на заклание»и«хощет Господь... явить Ему свет»(Ис. 53:7, 11), первое принимаете, а о втором не помышляете: тому, что Он«изъязвлен был», веруете, а того, что«Господь хощет очистити Его от язвы»(Ис. 53:5, 10), и в ум не берете.'
      cn: 凡事都当相信先知们所言，无论是关于被贬抑（unizhizheniya）的状态，还是关于荣耀（slavy）的状态。因为合利斯托斯必须受苦——这是贬抑。但祂也必须进入祂的荣耀——这是得荣。而你们却是如此地不明智（nesmyslenny），听见以赛亚既论及这两种状态，即：「祂被引到宰杀之地」（веден был Он на заклание）以及「主乐意……使祂得见光芒」（хощет Господь... явить Ему свет）（以赛亚书 53:7，11），你们只接受第一种状态，却不思量第二种：对于祂「被击伤」（iz』yazvlen byl）的事，你们相信，而对于「主乐意洁净祂脱离创伤」（Господь хощет очистити Его от язвы）（以赛亚书 53:5，10）的事，你们却从未放在心上。
  - type: paragraph
    initial:
      ru: 'Лк 24:27. '
      cn: （路加福音 24:27）
    text:
      ru: И, начав от Моисея, из всех пророков изъяснял им сказанное о Нем во всем Писании.
      cn: 以始自摩伊些乙、及诸先知凡指己所载者讲予彼等、
  - type: paragraph
    text:
      ru: Но поскольку,   говорит, вы «несмысленны», то есть «медлительны» (ибо если бы они были несмысленны то Он ничего не стал бы и говорить им), поскольку вы медлительны, то Я раскрою ваш ум и сделаю его быстрым в мышлении. Поэтому Он и изъяснил им из Моисея и из всех пророков сказанное о Нем. Таинство жертвоприношения Авраамова, когда он, оставив живым Исаака, принес во всесожжение овна, служило преобразованием относительно Господа, как и Сам Господь говорит, что«Авраам... видел день»Его,«и возрадовался»(Ин. 8, 56). И это место:«жизнь твоя будет висеть пред тобою»(Втор. 28, 66), в одно и то же время указывает и на распятие словом«висеть»и на воскресение словом«жизнь». Рассеяны и в прочих пророчествах изречения о кресте и о воскресении, особенно у важнейших пророков. Таких мест можно набрать и из них. Примечай, пожалуй, и то, что вход в славу зависит от перенесения страданий.
      cn: 祂说，但既然你们「愚拙的」，也就是说，「迟钝的」（因为若是他们愚拙的，祂就根本不会向他们讲话了），既然你们是迟钝的，那么我将开启你们的心智，使它在思维上变得敏捷。因此祂就从摩伊些乙及所有先知中，向他们阐释了那些论及祂的经文。阿拉汉莫的献祭奥秘，即在他让以撒活着、而献上公羊作全燔祭时，是关于主的一个预像，正如主自己所说的，说「阿拉汉莫……看到了」祂的「日子，并欢喜了」（伊鄂昂福音 8:56）。还有此段经文：「你的生命将悬在你面前」（申命记 28:66），它同时以「悬」一词指明了钉十字架，又以「生命」一词指明了复活。散布在其他先知书中的，也有关于十字架和复活的言语，尤其是在那些至关重要的先知中。从此他们也能拾取这类经文。请留心，或许，荣入光耀取决于对苦难的承受。
  - type: paragraph
    initial:
      ru: 'Лк 24:28. '
      cn: （路加福音 24:28）
    text:
      ru: И приблизились они к тому селению, в которое шли; и Он показывал им вид, что хочет идти далее.
      cn: 近所往之村、彼状欲远行、
  - type: paragraph
    text:
      ru: Господь«показываетвид, что хочет идти далее», без сомнения, по человечеству.
      cn: 主「佯装要走得更远」，毫无疑问，是就着他的人性而言。
  - type: paragraph
    initial:
      ru: 'Лк 24:29. '
      cn: （路加福音 24:29）
    text:
      ru: 'Но они удерживали Его, говоря: останься с нами, потому что день уже склонился к вечеру. И Он вошел и остался с ними.'
      cn: 彼等阻止之曰、偕我等留宿哉、因暮日已昃矣、遂入偕之留宿、
  - type: paragraph
    initial:
      ru: 'Лк 24:30. '
      cn: （路加福音 24:30）
    text:
      ru: И когда Он возлежал с ними, то, взяв хлеб, благословил, преломил и подал им.
      cn: 彼偕彼等席卧时、取饼福言擘而予之、
  - type: paragraph
    initial:
      ru: 'Лк 24:31. '
      cn: （路加福音 24:31）
    text:
      ru: Тогда открылись у них глаза, и они узнали Его.
      cn: 其目遂启、即识之、乃不料、为彼等不见、
  - type: paragraph
    text:
      ru: 'Когда Он соизволяет, тогда очи их отверзаются, и они узнают Его. Сим обозначается и нечто другое, именно: что у тех, кои причащаются благословенного хлеба, отверзаются очи для указания Его. Ибо плоть Господа имеет великую и несказанную силу.'
      cn: 当他愿意时，他们的眼睛就被开启，他们便认出了他。这也表明了另外一件事，即：在那些领受了受祝福之饼的人当中，他们的眼睛被开启是为了指明他。因为主的肉身拥有伟大且不可言说的能力。
  - type: paragraph
    text:
      ru: Но Он стал невидим для них.
      cn: 但祂对他们而言却成了隐形的。
  - type: paragraph
    text:
      ru: Он становится им невидимым, потому что имел не такое уже тело, чтоб надолго пребывать с ними телесно, и вместе для того, чтобы таковым действием еще более усилить их любовь.
      cn: 他变得对他们不可见，因为他所拥有的已不再是那样的身体，以致能长久地在肉身中与他们同在；并且与此同时，也是为了藉着这样的行动进一步增强他们的爱。
  - type: paragraph
    initial:
      ru: 'Лк 24:32. '
      cn: （路加福音 24:32）
    text:
      ru: 'И они сказали друг другу: не горело ли в нас сердце наше, когда Он говорил нам на дороге и когда изъяснял нам Писание?'
      cn: 互相曰、彼于途间告于我等言、且为我等讲解所载者时、我等之心岂不热衷乎、
  - type: paragraph
    initial:
      ru: 'Лк 24:33. '
      cn: （路加福音 24:33）
    text:
      ru: И, встав в тот же час, возвратились в Иерусалим и нашли вместе одиннадцатьАпостолови бывших с ними,
      cn: 即时起归耶鲁萨利木、遇十一者、及偕之聚集、
  - type: paragraph
    initial:
      ru: 'Лк 24:34. '
      cn: （路加福音 24:34）
    text:
      ru: которые говорили, что Господь истинно воскрес и явился Симону.
      cn: 曰主真复活矣、已显于锡孟、
  - type: paragraph
    initial:
      ru: 'Лк 24:35. '
      cn: （路加福音 24:35）
    text:
      ru: И они рассказывали о происшедшем на пути, и как Он был узнан ими в преломлении хлеба.
      cn: 其二人亦述于途间所遇者、及如何在擘饼之际、为彼等所识、
  - type: paragraph
    text:
      ru: Они так обрадовались что«в тот же час,встали ивозвратились в Иерусалим», впрочем, возвратились не в тот же час, ибо встали в тот же самый час, а возвратились спустя столь много (времени), сколько нужно было им на переход расстояния в шестьдесят стадий. В эти часы, конечно, Господь явился и Симону, покуда эти два мужа совершали обратный путь в Иерусалим.
      cn: 他们如此欣喜，以至于「就在那个时刻，他们起身回到了耶路撒冷」，然而，他们并非在那个同一时刻返回的，因为他们是在那个同一时刻起身的，但返回却是在经过了如此多的（时间）之后，这段时间是他们走完六十斯塔迪亚距离所必需的。当然，就在这两个人返回耶路撒冷的过程中，主也在这些时间里向西门显现了。
  - type: paragraph
    text:
      ru: '«Сердце»их«горело»или от огня слов Господних, когда при изъяснении Господом они внутренне разгорались и соглашались с Его речами как истинными, или, когда Он изъяснял им Писания, сердце их билось и внутренне говорило: Сей Самый, Который изъясняет нам, есть Господь.'
      cn: 「他们」的「心火热」，或许是因为主话语的烈焰，当时主在解释时，他们内心被点燃，并同意祂的话语是真实的；或许是当祂向他们解释《圣经》时，他们的心悸动，并在内心说道：这位向我们解释的人，祂正是主。
  - type: paragraph
    initial:
      ru: 'Лк 24:36. '
      cn: （路加福音 24:36）
    text:
      ru: 'Когда они говорили о сем, Сам Иисус стал посреди них и сказал им: мир вам.'
      cn: 〇彼等以此述告时、伊伊稣斯亲立其中、曰、安和予尔等、
  - type: paragraph
    initial:
      ru: 'Лк 24:37. '
      cn: （路加福音 24:37）
    text:
      ru: Они, смутившись и испугавшись, подумали, что видят духа.
      cn: 彼等且惊且惧、以为得见神灵矣、
  - type: paragraph
    text:
      ru: Господь, все устрояющий для нашего спасения, становится посреди учеников, с намерением уверить их в воскресении. И, во-первых, обычным приветствием мира утишает их смущение, а потом показывает, что Он Самый есть Учитель их, который любит это приветствие и который вооружал их этим приветствием, когда посылал на проповедь (Мф. 10, 12;Лк. 10, 5). Поскольку же от этого слова не укротилось душевное их смущение, Он иначе показывает им, что Он есть Сын Божий, знающий сердца.
      cn: '主，为我们得救而筹划万物的那一位，立于门徒中间，意在使他们确信复活。


        首先，他以惯常的平安问候，平息了他们的惊惶，随后表明他自己正是他们的导师，他喜爱这一问候，并且曾用这一问候来武装他们，当时他差遣他们去宣讲福音（马太福音 10:12，路加福音 10:5）。


        然而，由于他们心中的惊惶并未因这一言语而平息，他便以另一种方式向他们表明，他是知晓人心的、神的儿子。'
  - type: paragraph
    initial:
      ru: 'Лк 24:38. '
      cn: （路加福音 24:38）
    text:
      ru: 'Но Он сказал им: что смущаетесь, и для чего такие мысли входят в сердца ваши?'
      cn: 彼向伊等曰、何为惊慌者、胡为于尔等心中、起意念
  - type: paragraph
    text:
      ru: А всеми признано, что знать сердца свойственно одному Богу (Пс. 138). Присовокупляет и еще иное доказательство – осязание рук и ног.
      cn: 所有人都承认，唯独上帝才拥有知晓人心（诗篇 138）的特质。祂又添上了另一个证据——触摸手脚。
  - type: paragraph
    initial:
      ru: 'Лк 24:39. '
      cn: （路加福音 24:39）
    text:
      ru: Посмотрите на руки Мои и на ноги Мои; это Я Сам; осяжите Меня и рассмотри́те; ибо дух плоти и костей не имеет, как видите у Меня.
      cn: 视我双手我双足、是我也、扪我而视、盖神灵无骨肉、如尔等见我有之、
  - type: paragraph
    initial:
      ru: 'Лк 24:40. '
      cn: （路加福音 24:40）
    text:
      ru: И, сказав это, показал им руки и ноги.
      cn: 言此毕、示彼等双手双足、
  - type: paragraph
    text:
      ru: 'Вы, – говорит, – считаете Меня за духа или за привидение, каковых обыкновенно много от умерших представляется, особенно при гробах. Но знайте, что дух не имеет ни плоти, ни костей, а Я имею и плоть, и кости, хотя Божественнейшие и духовные. Ибо тело Господа хотя не было духом, но было «духовно», то есть чуждо всякой вещественной грубости, и управлялось духом. Тело, какое мы ныне имеем, «душевно», то есть управляется душой и оживотворяется естественными и душевными свойствами и силами. А тело, каким оно будет по воскресении, Павел называет духовным (1Кор. 15, 44), то есть оно оживотворяется и управляется Духом Божиим, а не душой, быв неизреченным и духовным образом пересоздано для нетления и сохраняясь в оном. Так нужно мыслить о теле Господнем по воскресении, именно как о духовном, тонком, чуждом всякой грубости, не нуждающемся ни в пище, ни в другом чем, хотя Господь и вкушал для уверения. Ибо если Он вкушал, то вкушал не по природе тела Своего, но по особенному устроению, именно: чтобы показать, что воскресло то же самое тело, которое страдало. А в природе этого тела было входить сквозь запертые двери, без труда переходить от места до места.'
      cn: '「你们，」祂说，「认为我是一个灵或是一个幻影，那种通常由死者幻化而出的东西，尤其是在墓穴旁有很多。但你们要知道，灵既没有肉，也没有骨，而我既有肉，也有骨，尽管是极其神圣和属灵的。因为主之身体虽然不是一个灵，但却是『属灵的』，也就是说，它远离一切物质的粗糙性，并由灵所管理。我们现今所拥有的身体是『属魂的』（*душевно*），也就是说，它由魂所管理，并由自然的和属魂的属性和能力所赋予生命。而那按着复活将要拥有的身体，保罗称之为属灵的（哥林多前书 15:44），也就是说，它是由上帝之灵赋予生命和管理的，而非由魂，因其已用不可言喻的、属灵的方式为着不朽而被重新创造，并被保持于其中。


        因此，对主复活后的身体，需作如此设想：它确是属灵的、精微的，远离一切粗糙性，不需要食物，也不需要其他任何东西，尽管主也曾为着确信而吃喝。因为倘若祂吃了，祂并非是出于祂身体的本性而吃，而是出于特殊的安排，即是说：为了表明复活的正是受难的那个身体。而这个身体的本性是能够穿过紧闭的门，不费力地从一处转移到另一处。」'
  - type: paragraph
    initial:
      ru: 'Лк 24:41. '
      cn: （路加福音 24:41）
    text:
      ru: 'Когда же они от радости еще не верили и дивились, Он сказал им: есть ли у вас здесь какая пища?'
      cn: 彼等以喜尚未信、又奇异之时、彼向之曰、尔曹于此有食物否、
  - type: paragraph
    initial:
      ru: 'Лк 24:42. '
      cn: （路加福音 24:42）
    text:
      ru: Они подали Ему часть печеной рыбы и сотового меда.
      cn: 彼等予之炙鱼一片、蜜房一方、
  - type: paragraph
    initial:
      ru: 'Лк 24:43. '
      cn: （路加福音 24:43）
    text:
      ru: И, взяв, ел пред ними.
      cn: 彼取之而食于其前、
  - type: paragraph
    initial:
      ru: 'Лк 24:44. '
      cn: （路加福音 24:44）
    text:
      ru: 'И сказал им: вот то, о чем Я вам говорил, еще быв с вами, что надлежит исполниться всему, написанному о Мне в законе Моисеевом и в пророках и псалмах.'
      cn: 又向之曰、此诸言、是我尚偕尔等所告者、即为满应凡在摩伊些乙法律、及诸先知、与圣咏指我所载者、
  - type: paragraph
    text:
      ru: Когда же ученики еще не верили, ни осязанием не убеждались, то Господь присовокупил и еще доказательство – вкушение пищи, потребляя едомое некоторой божественной силой. Ибо все, что естественно поедается устами, афедроном выходит, а Он, как мы сказали, вкушает не по закону природы, но по особенному устроению.
      cn: 当门徒们仍未相信，也未因触摸而确信时，主又添上了另一个证明——进食，祂以某种神圣的力量消耗了所吃之物。因为所有自然地用口吃下的东西都会通过肛门（aphēdrōn，厕所/排泄口）排出，而祂，正如我们所说，并非按照自然法则进食，而是依凭特殊的安排（oikonomia）。
  - type: paragraph
    text:
      ru: Употребленные Им яства, кажется, имеют и некоторый прикровенный смысл. Вкушая«часть печеной рыбы», Господь дает знать, что Он огнем Своего Божества испек наше естество, плавающее в соленой жизни сей, обсушил всю влагу, приставшую к нему от глубоких вод, а особенно от волн, и таким образом сделал оное Божественной пищей, сделав приятной Богу снедью то, что было прежде скверно. Это означается пчелиным сотом, то есть нынешняя сладость нашего естества, прежде отверженного. Или, я и то думаю, что «печеной рыбой» означается деятельная жизнь, которая с помощью пустыннических и молчальнических углей истребляет в нас большую влажность и тучность, а «сотовым медом» – знание или созерцание, так как речения Божия сладки (Пс. 18, 11). Впрочем, есть мед трутневый – языческая мудрость, и есть мед пчелиный – премудрость Божественная, а пчела есть Христос. Хотя она мала величиной, ибо слово сокращенно и слабо силой, ибо Павел проповедует не в силе слова, чтобы не упразднить креста (1Кор. 1, 17), однако же, она любезна царям и частным людям, кои труды ее употребляют на здоровье душам.
      cn: 祂所食用的食物，似乎也具有某种隐藏的意义。主借着品尝「一部分烤鱼」，使我们知晓祂以其神性的烈火，烘烤了我们那漂浮在这咸涩生活中的本性，并蒸干了附着其上的所有湿气，特别是来自深水和波涛的湿气，从而将它变成了神圣的食物，将先前污秽之物，变成了神所悦纳的食粮。这由蜂巢所象征，即我们本性现今的甘甜，而此本性先前是被唾弃的。或者，我还认为，「烤鱼」象征着进取的生活（деятельная жизнь），这种生活借着隐修和静默的木炭，在我们内部消灭了大部分湿气和肥厚，「蜂巢蜜」则象征着知识或默观，因为上帝的言语是甘甜的（诗篇 18:11）。此外，蜜有雄蜂蜜（трутневый）——即异教的智慧，也有蜂巢蜜——即神圣的智慧，而那蜜蜂就是基督。尽管它体积微小，因为圣言是简略的，力量是微弱的，因为保罗传道不是在言语的力量中，以免使十字架落空（哥林多前书 1:17），然而，它却受到君王和平信徒的喜爱，他们使用它的劳作来滋养灵魂的健康。
  - type: paragraph
    initial:
      ru: 'Лк 24:45. '
      cn: （路加福音 24:45）
    text:
      ru: Тогда отверз им ум к уразумению Писаний.
      cn: 其时启其聪明以悟诸经、
  - type: paragraph
    text:
      ru: Когда Господь умирил и успокоил сердца учеников, удостоверив их в действительности воскресения Своего тела Своими речами, дозволением осязать Себя и вкушением пищи, тогда отверз им ум к разумению Писания. Ибо если бы душа их не утишилась, как бы они уразумели, находясь в состоянии беспорядочном, в состоянии смущения? Ибо«Остановитесь, – сказано, –и познайте»(Пс. 45, 11).
      cn: 当主使门徒的心平定（умирил）而平静（успокоил）下来，藉着祂的话语、准许他们触摸祂、以及祂品尝食物，向他们证实了祂身体复活的真实性之后，那时祂就开启了他们的心智（ум），使他们能够领悟诸经（Писания）。因为倘若他们的灵魂没有平静下来，身处无序（беспорядочном）和困惑（смущения）的状态之中，他们又如何能领悟呢？因为经上说：「你们要止息（Остановитесь），要知道」（诗篇 45:11）。
  - type: paragraph
    initial:
      ru: 'Лк 24:46. '
      cn: （路加福音 24:46）
    text:
      ru: 'И сказал им: так написано, и так надлежало пострадать Христу,'
      cn: 谓之曰、如此所载、而合利斯托斯亦当如此受害、于第三日由死中复活、
  - type: paragraph
    text:
      ru: За сим учит их, что«так надлежало пострадать Христу». Как же это«так»? На древе крестном. Поскольку погибель вошла чрез дерево, то и тлению надлежало быть разрушену чрез дерево, и услаждение деревом надлежало упразднить Господу, непобедимо прошедшему болезни на дереве.
      cn: 接着，他教导他们说，「合利斯托斯应当如此受害」。这「如此」又是怎样呢？乃是在十字架木头上。因为败坏是借由木头而进入的，所以败朽也应当借由木头而被摧毁，那来自木头的愉悦也应当被主所废止，他以不可战胜之姿，在木头上历经了诸般苦楚。
  - type: paragraph
    text:
      ru: и воскреснуть из мертвых в третий день,
      cn: 和复活，由死者之中，在第三日。
  - type: paragraph
    initial:
      ru: 'Лк 24:47. '
      cn: （路加福音 24:47）
    text:
      ru: и проповедану быть во имя Его покаянию и прощению грехов во всех народах,
      cn: 且其因名传悔改及赦罪于万邦中、始自耶鲁萨利木、
  - type: paragraph
    text:
      ru: Здесь Господь говорит о крещении. Ибо в нем совершается покаяние чрез исповедь и отложение прежней злобы и нечестия и последует прощение грехов.
      cn: 此处，主言说的是洗礼。因为悔改藉着认罪和弃绝过往的恶意与不敬虔，在洗礼中得以成就，并随之而来的是罪的赦免。
  - type: paragraph
    text:
      ru: 'Как понимать то, что крещение бывает во имя одного только Христа, когда мы в другом месте научаемся совершать оное во имя Отца и Сына, и Святаго Духа? (Мф. 28, 19). Во-первых, то скажем, что когда мы говорим: крещение бывает во имя Христа, то не то говорим, будто нужно совершать оное в одно имя Христа, но что нужно совершать крещение ни иудейское, ни Иоанново, служившее к одному покаянию, но Христово, которым Христос крестился, то есть духовное, подающее общение Святого Духа и прощение грехов, что Он Сам показал, крестившись ради нас в Иордане и явив Духа Святого в виде голубя.'
      cn: '如何理解，洗礼只奉独一基督之名施洗，而我们在另一处受教要奉父、子、圣灵之名施洗呢？（马太福音 28:19）。


        首先，我们要说，当我们谈论「奉基督之名施洗」时，我们所指的并非是施洗只需奉基督独一之名进行，而是说，所施行的洗礼既非犹太人的洗礼，亦非只导向悔改的伊鄂昂的洗礼，而是基督的洗礼；此乃基督所受的洗礼，即属灵的洗礼，它赐予圣灵的交通和罪的赦免。这正是祂自己所示明的，祂为我们的缘故在约旦河受洗，并以鸽子的形式显明了圣灵。'
  - type: paragraph
    text:
      ru: 'Потом, крещение во имя Христа понимай так: крещение в смерть Христову. Ибо как Он умер и в третий день воскрес, так и мы образно погребаемся в воде, потом выходим из нее нетленными по душе и получаем залог быть нетленными по самому телу.'
      cn: 其次，奉基督之名的洗礼，你当如此领会：浸入基督之死的洗礼。因为正如祂死了，并在第三日复活了，我们亦如此，象征性地在水中被埋葬，接着从水中出来时，我们的灵魂已是不会朽坏的，并且获得了我们肉身本身也不会朽坏的凭据。
  - type: paragraph
    text:
      ru: 'И иначе: имя Христос (помазанник) само в себе предъявляет и Отца помазавшего, и помазание Духа, и Сына помазанного.'
      cn: 且另当别论：基督（受膏者）之名，其本身即展示了施行涂抹膏油之父、圣灵之膏油涂抹，以及受膏之子。
  - type: paragraph
    text:
      ru: Прощение грехов бывает «во имя Господа». Где же скверные языки тех, кои крестят в Монтана и Прискиллу и Максимиллу? Поистине, крестящимся так не бывает никакого прощения, а еще прилагаются грехи, и поэтому они впали в ужасную погибель.
      cn: 罪的赦免是「奉主的名」而有的。那么，那些奉蒙塔诺、普里斯基拉和马克西米拉之名施洗的人，其舌头何等污秽呢？事实上，以这种方式受洗的人，绝不会有任何赦免，反倒会增加罪恶，因此他们陷入了可怕的毁灭之中。
  - type: paragraph
    text:
      ru: начиная с Иерусалима.
      cn: 从耶路撒冷开始。
  - type: paragraph
    text:
      ru: Слово прошло«во всех народах, начиная от Иерусалима». Ибо, когда во Христе соединилось и воспринято все естество человеческое, ему не нужно уже было распадаться на два отдела – евреев и язычников, но, начиная от Иерусалима, слову нужно было вселиться и между язычниками, чтобы объединить весь род человеческий.
      cn: 词语通过了，「在万国中传开，从耶路撒冷开始」。因为，当基督里结合并被接纳了全部的人类本性时，它就不再需要分裂成两个部门——犹太人和外邦人，而是，话语必须从耶路撒冷开始，在万邦中居住下来，从而使整个人类联合起来。
  - type: paragraph
    initial:
      ru: 'Лк 24:48. '
      cn: （路加福音 24:48）
    text:
      ru: Вы же свидетели сему.
      cn: 尔曹为此等之证者、
  - type: paragraph
    text:
      ru: то есть страданиям и воскресению.
      cn: 也就是说，你们是受难和复活的见证者。
  - type: paragraph
    initial:
      ru: 'Лк 24:49. '
      cn: （路加福音 24:49）
    text:
      ru: И Я пошлю обетование Отца Моего на вас; вы же оставайтесь в городе Иерусалиме, доколе не облечетесь силою свыше.
      cn: 而顾、我将以我父所许者遣于尔等、而尔等坐在耶鲁萨利木城、待尔等自上以能力衣之、
  - type: paragraph
    text:
      ru: 'Потом, чтобы они не смутились внутренне помыслами (о том, например), как мы, люди простые, будем свидетельствовать и посланы будем к язычникам, как выступим прямо против иерусалимлян, которые и Тебя убили, Господь для сего говорит: мужайтесь, ибо Я вскоре пошлю (на вас)«обетование Отца Моего», о котором Я сказал чрез Иоиля:«излию от Духа Моего на всякую плоть»и прочее (Иоил. 2,28). Итак, вы, ныне боязливые и немужественные, оставайтесь в городе Иерусалиме, пока не облечетесь силой не человеческой, но небесной. Не сказал: пока не «получите», но: пока«не облечетесь», показывая чрез это, что духовное вооружение будет хранить их со всех сторон.'
      cn: 接着，为了避免他们内心为思虑所困扰（例如，他们会想）：我们这些平信徒，要如何作见证，如何被差遣到异教徒那里去？我们将如何公然对抗那些甚至把祢也杀了的耶路撒冷人？为此，主说：你们要刚强壮胆，因为我将很快派遣（给你们）「我父的应许」，对此我曾借由约珥书说：「我要将我的灵浇灌凡有血气的」以及其余的（约珥书 2:28）。因此，你们这些现今胆怯且不勇敢的人，要留在耶路撒冷城里，直到你们被披上一股非属人而是属天的能力。他没有说：直到你们「获得」，而是说：直到你们「披上」，以此表明属灵的武装将从四面八方护卫他们。
  - type: paragraph
    initial:
      ru: 'Лк 24:50. '
      cn: （路加福音 24:50）
    text:
      ru: И вывел их вониз городадо Вифании и, подняв руки Свои, благословил их.
      cn: 彼导之出、至韦发尼亚、举手福言之、
  - type: paragraph
    text:
      ru: Вывел их до Вифании; думаем, что это случилось в самый сороковой день (от воскресения). Ибо о чем они говорят кратко, то (ты понимай, пожалуй) совершается в течение многих дней, как и сам Лука говорит в Деяниях (Деян. 1, 3), что Господь являлся ученикам в продолжение сорока дней, ибо Он часто являлся им и часто удалялся от них.
      cn: 他领他们出去，到了毕法尼亚；我们认为这发生于（从复活算起的）第四十日。因为他们所简略提及的，（你或许该明白）是在许多天中完成的，正如路加自己也在《使徒行传》（使徒行传 1:3）中所言，主在四十天之内向门徒显现，因为祂频繁地向他们显现，也频繁地离开他们。
  - type: paragraph
    text:
      ru: Господь«благословил»учеников, быть может, для того, чтоб преподать им силу, которая хранила бы их до сошествия Духа, а может быть, и в наше научение, чтобы мы, когда удаляемся куда-нибудь, подчиненных своих вверяли под сохранение благословением.
      cn: 主「赐福」给门徒，或许是为了赋予他们一种能力，好能保守他们，直到圣灵降临；或许也是为了教导我们：当我们去往某处时，要将自己的属员托付给祝福的保守之下。
  - type: paragraph
    initial:
      ru: 'Лк 24:51. '
      cn: （路加福音 24:51）
    text:
      ru: И, когда благословлял их, стал отдаляться от них и возноситься на небо.
      cn: 在其福言之时、离彼等而升天、
  - type: paragraph
    text:
      ru: 'И стал«возноситься на небо». Илия возшел«на небо»(4Цар. 2, 11), ибо казалось, что он возносился как бы на небо; а Спаситель возшел на самое небо предтечею всех, чтобы со святой плотью Своей явиться лицу Божию и посадить ее с Отцом (Евр. 9, 24): и ныне естество наше во Христе принимает поклонение от всякой ангельской силы.'
      cn: 「他便『升天』了。」 以利亚「升到天上」（列王纪下 2:11），因为他似乎是升到天上；而救主则升入了至高之天，作为所有人的先驱者，以便他可以带着他的神圣肉身显现在上帝的面前，并使这肉身与父同坐（希伯来书 9:24）：如今，我们的人性在基督里正接受着来自所有天使力量的敬拜。
  - type: paragraph
    initial:
      ru: 'Лк 24:52. '
      cn: （路加福音 24:52）
    text:
      ru: Они поклонились Ему и возвратились в Иерусалим с великою радостью.
      cn: 彼等拜之、带大喜乐归耶鲁萨利木、
  - type: paragraph
    initial:
      ru: 'Лк 24:53. '
      cn: （路加福音 24:53）
    text:
      ru: И пребывали всегда в храме, прославляя и благословляя Бога. Аминь.
      cn: '常在殿中赞美福言上帝、阿民、 '
  - type: paragraph
    text:
      ru: Смотри, какое мужество! Еще не получили Духа, а живут духовно. Прежде запирались в дому, а теперь живут посреди первосвященников и не заботятся ни о чем житейском, но, презрев все, постоянно пребывают в храме, хвалят и благословляют Бога. О, если бы и мы, став подражателями их, постоянно пребывали в святой жизни, хваля и благословляя Бога такой жизнью! Ибо жизнь святая и добродетельная есть слава и благословение Богу, потому что Ему принадлежит всякая слава вовеки.
      cn: 瞧，这是何等的勇气！他们尚未领受圣灵，却已在属灵地生活了。先前他们闭门在家中，如今却生活在众大祭司之中，毫不担忧任何世俗之事，反而轻视一切，持续不断地待在圣殿里，赞美并称颂上帝。哦，但愿我们也能成为他们的效法者，持续不断地 пребы于圣洁的生活中，用那样的生活赞美并称颂上帝！因为圣洁和有德行的生活就是上帝的荣耀和称颂，因为一切荣耀都永远属于祂。
  - type: paragraph
    text:
      ru: Аминь.
      cn: 阿民。
