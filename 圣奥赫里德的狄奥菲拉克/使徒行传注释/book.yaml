  - type: paragraph
    text:
      ru: Деян.1:1.Первую книгу написал я к тебе, Феофил, о всем, что Иисус делал и чему учил от начала.
      cn: (使徒行传 1:1) 提阿非羅啊，我已經作了前書，論到耶穌開頭一切所行所教訓的，

        提阿非罗啊，关于耶稣从起初所行所教的一切事，我已在第一本书中写给你了。'
  - type: paragraph
    text:
      ru: 'Напоминает (Лука) Феофилу о (своем) евангелии, чтобы указать на свое   весьма тщательное отношение к делу; потому что и в начале того своего   труда говорит:рассудилось и мне по порядку описать тебе, и не как-нибудь, но так,как передали нам то бывшие с самого начала очевидцами и служителями Слова(Лк. 1:2, 3).   Итак напоминает об евангелии с целию напомнить о том, с каким тщанием   оно написано; а об этом вспоминает для того, чтобы, имея в мыслях такое   же тщательное отношение к делу при составлении и настоящей книги, быть   как можно более внимательным к тому, что пишется. Поэтому ему и не было   нужды на этот раз в каком-либо ином одобрении; так как тот, кого   удостоили написать о том, что он слышал, и кому верят в том, что он   написал, по справедливости заслуживает гораздо большей веры, когда   излагает не то, что слышал от других, но то, что сам видел. Посему не   говорит: первое убо евангелие, еже благовестих, но:первое убо слово;   так как он был чужд надменности и смиренномудр и думал, что название:   евангелие выше его (труда), хотя апостол так величает его за этот труд:   братом, «во всех церквах похваляемым за благовествование» (2Кор. 8:18). Но своим выражением:о всехон, кажется, противоречит евангелисту Иоанну. Тот говорит, что описать все не было возможности; а он (говорит):сотворих о всех от началадаже до вознесения. Итак что скажем на это? То, что выражениемо всехЛука указывает на то, что он не опустил ни одной из вещей существенных и   необходимых, из которых познается божественность и истинность   проповеди; потому что и Лука и каждый из евангелистов в своих евангелиях   во главе всего поместили то, из чего познается божественность и   истинность проповеди, и притом в такой точной форме, как бы по какому   образцу. Подобным же образом изложил обо всем этом и сам Иоанн Богослов.   Они не опустили ни одной из тех черт, чрез которые с одной стороны   познается и становится предметом веры служение Слова по плоти, с другой   сияет и открывается величие Его по божеству. Иоанн говорит, что если бы   по частям и вкратце описать все, что сказал и сделал Господь, то и тогдане вместить бы миру пишемых книг(Ин. 21:25);   но тем более не вместить бы, если бы кто пожелал изложить в писании все   дела и слова Господни с исследованием их значения; потому что значения   их и причин, по которым творил и говорил Господь, человеческий разум не   может ни вместить ни познать, по той причине, что все то, что Он творил в   человеческом естестве, творил как Бог; с этой стороны нельзя дел и слов   Христовых ни в слове выразить, ни в писании передать. Впрочем допускаю и   то, что это прибавление есть гиперболический оборот речи и не   безусловно говорит о том, будто мир не вместил бы пишемых книг, если бы   изложение было пространнее. Можно сказать еще и то, что этот евангелист   (Иоанн), как развивавший более, чем другие, теоретическое созерцание,   действительно знает все творения и дела Спасителя, – не только те, какие   Он явил во плоти, но и те, какие Он совершил от века, как без тела, так   и с телом. Если бы кто решился описать черты природы, происхождения,   различия, сущности и проч. каждого из этих дел; то, если и допустить   возможность этого, миру невозможно было бы вместить пишемых книг. Если   же кто под словом  станет разуметь не просто мир, но человека, лежащего   во зле и помышляющего о предметах мирских и плотских, потому что слово    понимается так во многих местах Писания; и в этом случае верно говорит   Иоанн, что, если бы кто захотел описать все чудеса, совершенные Христом,   то таковые люди, расположенные от множества и величия дел Христовых   скорее придти к неверию, чем к вере, не могли бы вместить написанного. И   потому-то именно евангелисты часто проходят молчанием целую толпу   исцеленных и обходят множество чудесных действий, обозначая только общий   факт, что многие избавились от различных болезней, что много было чудес   и т. п., а перечисления их не делают; потому что для людей неспособных   понимать и обольщенных перечисление по частям многих чудес обыкновенно   служило поводом скорее к неверию и к нежеланию слушать (проповедь), чем к   уверованию и к расположению слушать.'
      cn: '（路加）向提阿非罗提及他（所著）的福音，以表明他对这事极其审慎的态度；因为他那著作的开篇就说：我也觉得应该按次序写给你，并且并非以任何方式，而是如同那些从起初就是亲眼见证人和圣道之仆役的人所传给我们的那样（路加福音 1:2，3）。因此，他提及福音，意在提醒人们福音是怀着何等审慎写成的；他之所以回顾此事，是为了在撰写这本现有书籍时，也能以同样审慎的态度对待，从而对所写的内容尽可能地保持警惕和专注。


        因此，这一次他无需任何其他认可；因为那个被认为配得书写他所听闻之事，并且他所写的也得到人们信任的人，当他叙述的不是从他人那里听闻的，而是自己亲眼所见时，理所当然地更值得极大的信任。故此他不说：「第一个福音，就是我所传的」，而是说：「第一个言语」；因为他远离傲慢，心怀谦卑，并认为「福音」这个名称超乎他（的著作）之上，尽管使徒因他这项工作而如此称赞他：是弟兄，「在各教会中因传福音而受称赞的」（哥林多后书 8:18）。但他用「关于所有事」这个表达，似乎与传福音者约翰相矛盾。约翰说，不可能描述所有事；而他（路加）却说：「我从起初直到升天，将关于所有事都写成了。」那么，对此我们该怎么说呢？


        乃是说，路加的「关于所有事」这个表达，表明他没有遗漏任何一项对于认识圣道的属神性和真实性至关重要且必要的事项；因为路加和每一位传福音者，都在自己的福音书中，将那些能让人认识圣道的属神性和真实性的内容放在首位，而且是以一种精确的形式，仿佛是依照某种范本。同样地，神学家约翰本人也叙述了这一切。他们没有遗漏任何一项特征，借此一方面可以认识并信仰圣道在肉身中的侍奉，另一方面则闪耀并显明祂在神性上的伟大。约翰说，如果将上主所说所做的一切，逐一简要地记述下来，那么世上所写的书也容纳不下（约翰福音 21:25）；但如果有人想在著作中阐述上主所有的作为和言语，并深入探究其意义，那就更不可能容纳下了；因为它们的意义，以及上主行事说话的缘由，人类的理性既无法理解也无法认识，原因在于，祂在人性中所行的一切，都是作为上帝而行的；从这个角度来看，基督的作为和言语既无法用言语表达，也无法用文字记载。


        然而，我也承认，这个补充是一种夸张的修辞手法，并非绝对地说，如果叙述更详尽，世界就无法容纳所写的书籍。还可以说，这位传福音者（约翰），由于比其他人更深入地发展了理论性默观，他确实知道救主所有的创造和作为，— 不仅是祂在肉身中显现的那些，也包括祂从亘古以来所成就的，无论是无体还是有体地。如果有人决心描述这些作为中每一项的性质、起源、区别、本质等等；那么，即使假设这是可能的，世界也无法容纳所写的书籍。


        如果谁将「世界」这个词，不单单理解为普通的「世界」，而是理解为躺卧在邪恶中，思虑世俗和肉体事物的人，因为在圣经的许多地方，「世界」这个词就是这样理解的；那么在这种情况下，约翰说的是对的，即如果有人想描述基督所行的一切奇迹，那么那些因基督作为的众多和伟大，反而更容易走向不信而非信仰的人，将无法容纳所写的内容。正因为如此，传福音者们常常对一大群被医治的人和许多奇迹般的作为保持沉默，他们只指出一个普遍的事实，即许多人从各种疾病中得到解脱，有许多奇迹等等，但他们不作具体的列举；因为对于那些不理解且被迷惑的人来说，逐一列举许多奇迹通常更容易导致不信和不愿听（圣道），而非使人信服和愿意倾听。'
  - type: paragraph
    text:
      ru: «О всем, что Иисус делал и чему учил от начала
      cn: 关于耶稣从起初所行并所教导的一切
  - type: paragraph
    text:
      ru: 'Разумеет чудеса и учение, – впрочем не одно это, но и то, что   Иисус учил и делом; потому что не словом только увещевал людей делать то   или другое, сам же не делал этого, но делами, которые сам совершал,   убеждал и их подражать Ему и ревновать о добродетели. Должно знать, что   Феофил был один из обращенных к вере самим Лукою. И не удивляйся, что   Лука явил так много попечения об одном человеке, что написал для него   две полных книги; потому что он был хранителем известного изречения   Господня, в котором говорится: «Нет воли Отца вашего Небесного, чтобы погиб один из малых сих» (Мф. 18:14).   Почему же, пиша одному Феофилу, он написал не одну книгу, но разделил   предметы на две книги? Для ясности и для того, чтобы не затруднить   читателя; да они разделялись и по содержанию; и потому он справедливо   разделил предметы повествования на две книги.'
      cn: '理解神迹和教导——然而，不仅如此，而且耶稣也以行为教导；因为祂不仅用言语劝诫人们做这做那，自己却不去做，而是以祂自己所行的事迹，说服他们效法祂，并热心追求美德。


        应当知道，提阿非罗是路加亲自引领归信的人之一。也不要惊奇路加对一个人倾注如此多的关怀，以至于为他写了两部完整的书；因为他谨守着上主那著名的教训，其中说道：「在你们天上的父，祂的旨意绝不是要让这些小子中任何一个灭亡」（马太福音 18:14）。


        那么，既然是写给提阿非罗一人，他为何没有写成一本书，而是将内容分成两本书呢？为了清晰，也为了不使读者感到困惑；而且它们在内容上也相互独立；因此，他合理地将叙述内容分成了两本书。'
  - type: paragraph
    text:
      ru: Деян.1:2.До того дня, в который Он вознесся, заповедав Святым Духом повеления Апостолам, которых Он избрал».
      cn: (使徒行传 1:2) 直到他藉著　聖靈吩咐所揀選的使徒，以後被接上升的日子為止。
  - type: paragraph
    text:
      ru: '«Заповедав Духом Святым», то есть, изрекши им духовные глаголы;   ничего человеческого тут не было; потому что заповедал им Духом. Как и   сам Господь по смирению и приспособительно к слушателям говорил:аще Аз о Дусе Божии изгоню бесы(Мф. 12:28): так здесьзаповедав Духомговорится не потому, что Сын имел нужду в Духе, но потому, что там, где   творит Сын, там содействует и соприсутствует и Дух как единосущный. Что   же заповедал?Шедше научите вся языки, крестяще их во имя Отца и Сына и Святаго Духа, учаще их блюсти вся, елика заповедах вам(Мф. 28:19–20).'
      cn: 「借圣灵吩咐」，也就是说，向他们发出了属灵的言语；此处毫无属人的成分；因为祂是藉圣灵吩咐他们的。正如上主自己因着谦卑，并为了适应听众而言道：我若靠着上帝的灵赶鬼（马太福音 12:28）：所以在这里「藉圣灵吩咐」这句话，并不是说上帝之子需要圣灵，而是因为在上帝之子行事之处，圣灵也作为同本质者同工并同在。那么，祂吩咐了什么呢？你们要去，使万民作我的门徒，奉父、子、圣灵的名给他们施洗，凡我所吩咐你们的，都教训他们遵守（马太福音 28:19-20）。
  - type: paragraph
    text:
      ru: '"Заповедав, говорится,вознесеся"(По-гречески: ανεληφθη был взят вверх, то есть как бы не сам вознесся, но вознесен был. Ред.). Не сказал:восшел,   но рассуждает еще, как о человеке. Отсюда же видим, что Иисус и по   воскресении своем учил учеников: но времени этого никто точно не   передал. Иоанн проводил с Ним более времени, чем другие; но обо всем   этом никто не возвестил ясно; потому что ученики обращали свое внимание   на другое.'
      cn: 「据载，在吩咐之后，祂被接升天」（希腊文：ανεληφθη 被向上提，意即并非祂自己升天，而是被接升天。编者注）。经文没有说：祂主动升天，而是仍将其视为关乎一个人的事。由此我们看到，耶稣甚至在祂复活之后仍在教导门徒；然而此段时间无人准确地记录下来。约翰与祂相处的时间比其他人更多；然而无人清楚地宣扬这一切；因为门徒们将注意力放在别处了。
  - type: paragraph
    text:
      ru: Деян.1:3.Которым и явил Себя живым, по страдании Своем, со многими верными доказательствами, в продолжение сорока дней».
      cn: (使徒行传 1:3) 他受害之後，用許多無誤的憑據，將自己活活的顯給使徒看，四十天之久向他們顯現，講說　上帝國的事。
  - type: paragraph
    text:
      ru: Сказав прежде о вознесении, говорит потом и о воскресении. Так как ты слышал, что Он вознесся, то, чтобы ты не думал, что Он взят был другими, Лука присовокупил:«которым и явил Себя живым»; потому что если Он предстал перед ними, совершив большее чудо,[8]то гораздо более мог совершить меньшее[9]«В продолжение сорока дней», а не каждый день все сорок дней,[10]потому что не был с ними постоянно, как до воскресения, но являлся и снова удалялся, возвышая их мысли и не позволяя им прилепляться к Себе подобным образом, как и прежде. С большой осторожностью и мудростью Он постепенно развивал в них две стороны – и веру в Свое воскресение и убеждение считать Его выше человека, хотя одно другому противоречило, потому что из веры в воскресение должно было возникнуть представление о многих сторонах человеческих, а из того, что Он выше человека, – противоположное. Однако же то и другое в свое время подтвердилось, именно«в продолжение сорока дней», начиная со дня воскресения и до дня вознесения на небо. В продолжение этих дней Он и ел, и пил с ними, показывая этим, что Он именно Тот, Кто был распят и погребен, и воскрес из мертвых. Почему же Он являлся не всем, а только апостолам? Потому, что многим, не понимавшим этой неизреченной тайны, явление Его показалось бы видением. Если уже и сами ученики сначала не верили и смущались, даже нуждались в прикосновении рукой и в общей с Ним трапезе, то как должно было поразить явление Его толпу? Поэтому-то доказательство Своего воскресения Он делает несомненным и общим посредством чудес, которые совершили апостолы силой полученной ими благодати; так что воскресение стало очевидным фактом не только для них, которые должны были убедиться в этом собственными глазами, но и для всех людей последующих времен.
      cn: 先说了升天的事，接着又说到复活的事。既然你听过祂升天的事，为了避免你以为祂是被别人带走的，路加又补充说：「祂向他们显现，证明自己是活着的」；因为如果祂能向他们显现，完成更大的神迹[8]，那么祂就更能完成较小的神迹[9]。「在四十天之久」[10]，而不是每天都待在那四十天里，因为祂并非像复活前那样一直与他们同在，而是显现后又再次离开，以此提升他们的思想，不让他们像从前一样依恋祂。祂以极大的谨慎和智慧，在他们心中逐步培养出两个方面——对祂复活的信心，以及确信祂超越人类的观念，尽管这两个方面相互矛盾，因为从复活的信仰中，必然会产生对许多人性方面的认识，而从祂超越人类的观念中，则会产生相反的认识。然而，这两者都在适当的时候得到了证实，正是在「四十天之久」这段时间里，从复活之日直到升天之日。在这些日子里，祂与门徒一同吃喝，以此表明祂正是那位曾被钉十字架、安葬，并从死里复活的。那么，祂为何不向所有人显现，而只向使徒显现呢？因为对于许多不明白这不可言喻之奥秘的人来说，祂的显现可能只会被视为异象。如果连门徒自己起初都不相信并感到困惑，甚至需要亲手触摸并与祂一同进餐，那么祂的显现又将如何震惊群众呢？因此，祂藉着使徒们凭着所领受的恩典所行的神迹，使祂复活的证据变得无可置疑且普世皆知；这样一来，复活就不仅仅是那些本应亲眼确信的人的明显事实，也成了所有后世之人的明显事实。
  - type: paragraph
    text:
      ru: 'Деян.1:3–4.Являясь им и говоря о Царствии Божием. И, собрав их, Он повелел им: не отлучайтесь из Иерусалима, но ждите обещанного от Отца, о чем вы слышали от Меня.'
      cn: (使徒行传 1:3-4) 他受害之後，用許多無誤的憑據，將自己活活的顯給使徒看，四十天之久向他們顯現，講說　上帝國的事。 耶穌和他們聚集的時候，囑咐他們說：「不要離開耶路撒冷，要等候　父所應許的，就是你們聽見我說過的。

        向他们显现，并讲论上帝的国。他聚集他们，吩咐他们说：「不要离开耶路撒冷，但要等候父所应许的，就是你们从我这里听见的。'
  - type: paragraph
    text:
      ru: Сам Господь назвал Царство, в котором обещал ученикам пить вместе с ними новую чашу, Царством Отца, называя новым питием то, которое пил вместе с ними после своего воскресения; в это время Он вкушал вместе с ними и пищу новую – вкушал не таким образом, как ел и пил с ними прежде, до воскресения, потому что тогда, сделавшись подобным нам по всему, кроме греха, Он ел и пил, как мы, добровольно предоставляя плоти требовать необходимого употребления пищи; поэтому добровольно допускал состояние алкания. После же воскресения пил и ел уже не по нужде, а только для того, чтобы все уверовали в истинность Его телесного естества, равным образом и в то, что Он пострадал добровольно и воскрес, как подобает Богу. Итак, новой пищей и новым питием назвал ту необыкновенную пищу, которую Он ел, и то необыкновенное питие, которое пил вместе с учениками после воскресения, то есть употребляя общую с ними соль и общую пищу. А как это – объяснять не нам, потому что это было нечто необыкновенное, было не потому, чтобы природа требовала пищи, но по снисхождению, с целью доказать воскресение.
      cn: 上主自己称那应许门徒与祂一同饮新杯的国为父的国，将祂复活后与门徒一同所饮的，称为新饮；在这时，祂也与他们一同享用新食粮——祂享用的方式，不同于祂复活之前与他们一同吃喝的方式，因为那时，祂在凡事上都与我们相似，唯独没有罪，祂像我们一样吃喝，是自愿让肉身要求必需的食物消耗；因此，祂自愿容许饥饿状态的存在。然而，复活之后，祂吃喝已不再是出于需要，而仅仅是为了让所有人相信祂肉身本性的真实性，同样也相信祂是自愿受难并如上帝一般复活。因此，祂称新食粮和新饮品，为祂复活后与门徒一同所食用的那非凡的食物，以及所饮用的那非凡的饮品，也就是说，与他们一同享用同样的盐和食物。至于这是如何发生的，则不应由我们来解释，因为那是非凡之事，并非因为本性要求食物，而是出于俯就，旨在证明复活。
  - type: paragraph
    text:
      ru: 'И открывая им тайны«о Царствии Божием… повелел им: не отлучайтесь из Иерусалима». Почему повелел им так поступать? Прежде, когда они страшились и трепетали, Он вывел их в Галилею, чтобы они могли безбоязненно выслушать то, что Он имел сказать им, так как они готовы были отказаться от дела, на которое были призваны. Теперь, когда они выслушали и провели вместе сорок дней,«Он повелел им: не отлучайтесь из Иерусалима». Почему же это? Потому что как никто не допускает, чтобы воины, имеющие напасть на большую силу противника, вышли против него прежде, чем успеют вооружиться, и как никто не согласится выпустить лошадей прежде, чем сядет возница, так и Господь до сошествия Святаго Духа не позволяет апостолам являться на состязание, чтобы громадное большинство не победило их и не пленило. Впрочем, Господь не позволяет им отлучаться из Иерусалима не поэтому только, но и потому, что и здесь многим предстояло уверовать, а в-третьих, потому, чтобы не сказал кто-либо, что, оставив своих, они отправились искать славы у чужих. Поэтому они распространяют несомненные доказательства воскресения среди тех самых людей, которые убили Господа, которые Его распяли и погребли, и в том самом городе, где имели дерзновение совершить такое беззаконие. Когда же они услышали такое повеление? Тогда, когда Он говорил им:«Лучше для вас, чтобы Я пошел; ибо если Я не пойду, Утешитель не придет к вам»(Ин. 16, 7); и«еще: Я умолю Отца, и даст вам другого Утешителя»(Ин. 14, 16). Отчего же не при Нем и не тотчас по отшествии пришел Утешитель, но спустя восемь или девять дней, то есть в то время, когда настал день Пятидесятницы? Притом, каким образом, когда еще не сошел Дух Святый, Он говорил:«примите Духа Святаго»(Ин. 20, 22)? На это нужно сказать, что Он говорил так с целью возбудить в них желание, готовность и способность к принятию Святаго Духа, а приняли они Его, когда Он сошел; или о том, что имело быть, говорил, как о уже существующем и настоящем, подобно тому, когда Он говорил о возможности«наступать на змей и скорпионов и на всю силу вражью»(Лк. 10, 19).'
      cn: '当祂向他们揭示「关于上帝之国的奥秘……祂命令他们说：『不要离开耶路撒冷。』」


        为何祂命令他们如此行呢？从前，当他们恐惧战兢之时，祂将他们带到加利利，为使他们能无惧地聆听祂所要对他们说的话，因他们已准备好放弃他们所蒙召的事工。如今，当他们聆听并一同度过四十日之后，「祂命令他们说：『不要离开耶路撒冷。』」这又是为何呢？因为，如同没有人会允许那些将要攻打强大敌军的士兵，在他们全副武装之前就出战，也如同没有人会同意在车夫上座之前就放出马匹，同样，上主在圣灵降临之前，不让使徒们出现在这场较量中，以免绝大多数人胜过他们，俘虏他们。


        然而，上主不让他们离开耶路撒冷，不仅为此，也是因为在此地将有许多人要信主；第三，是为了避免有人说，他们舍弃了自己人，去外邦人那里寻求荣耀。因此，他们在那些杀害上主、将祂钉在十字架上并埋葬祂的同一群人中间，传播着复活的无可置疑的证据，并在这同一座城市里，就是他们胆敢施行如此不法之事的地方。


        那么，他们何时听到这个命令的呢？当祂对他们说：「我去是与你们有益的；我若不去，保惠师就不到你们这里来。」（约翰福音 16:7）的时候；又说：「我还要求父，祂就赐给你们另一位保惠师。」（约翰福音 14:16）。那么，保惠师为何不在祂身边时就来，也不是在祂离去后立刻就来呢，而是在八或九日之后，也就是五旬节来临之时呢？此外，圣灵尚未降临之时，祂又怎会说：「你们受圣灵！」（约翰福音 20:22）呢？对此需要说明的是，祂如此说，旨在激发他们对领受圣灵的渴望、准备和能力，而他们是在圣灵降临之时领受了祂；或者，祂所说的是将要发生之事，如同已经存在和正在发生之事，正如祂谈到有能力「践踏蛇和蝎子，又胜过仇敌一切的势力。」（路加福音 10:19）之时。'
  - type: paragraph
    text:
      ru: 'Впрочем, следует сказать и то, что дарования Духа различны и многообразны: есть дар очищения и совершенствования, дар освящения и силы освящающей, дар языков и пророчества, дар чудес и толкования и множество иных даров.'
      cn: 此外，也应指出，圣灵的恩赐各不相同，且丰富多样：有洁净与成全的恩赐，成圣与圣化之力的恩赐，说方言与说预言的恩赐，行奇迹与解释的恩赐，以及诸多其他恩赐。
  - type: paragraph
    text:
      ru: Итак, при различии и многообразии дарований Духа ничто уже не препятствовало апостолам принять благодать Духа различным образом. Но полное, соделавшее апостолов совершенными и способными совершенствовать других, сообщение им Духа было во время Пятидесятницы, когда Он сошел на них в виде огненных языков и всецело исполнил их своей силой. Господь отошел, и тогда уже Дух Святый пришел, и пришел во время Пятидесятницы, а не тотчас, для того, чтобы они прониклись желанием и тогда уже получили благодать. А если бы Дух Святый пришел при Сыне и потом Сын отошел бы, а Дух остался, то для них не было бы столько утешения, потому что они очень неохотно разлучались со своим Учителем. Поэтому Он восходит и Дух приходит не тотчас, чтобы после некоторого уныния пробудить в учениках желание и сознание необходимости данного им обещания и чтобы во время сошествия они испытали чистое и полное удовольствие. Впрочем, следовало сначала явиться плоти нашей на небесах и совершиться полнейшему примирению и тогда уже сойти Духу Святому. Знай же, какую необходимость оставаться в Иерусалиме Господь возложил на них данным обещанием. Чтобы по вознесении они снова не разбежались, этим ожиданием, как бы какими узами, Он удерживает всех их там и обещанием более выгодных надежд располагает их к сильнейшему желанию этих надежд, даже при неизвестности их. Но никто не погрешит, если скажет, что и тогда[11]они получили некоторую силу и благодать Духа, не такую, чтобы воскрешать мертвых, но получили силу отпускать грехи. Поэтому и прибавил:«Кому простите грехи, тому простятся; на ком оставите, на том останутся»(Ин. 20, 23), показывая этим, какой именно род силы дарует им. Тогда Он облек их этой именно силой; а по прошествии сорока дней дарует им силу творить чудеса; поэтому и говорит:«примете силу»(Деян. 1, 8) и проч.
      cn: 所以，既然圣灵的恩赐各有不同且种类繁多，就没有什么能阻碍使徒们以不同的方式领受圣灵的恩典了。但那全然的、使使徒们得以完全并能使他人也达致完全的圣灵倾注，发生在五旬节，那时祂以火焰的舌头形状降临在他们身上，并以祂的能力完全充满他们。上主离去了，圣灵才降临，且是在五旬节时降临，而非立刻，为的是让他们心生渴望，然后才领受恩典。若圣灵在圣子还在时就降临，接着圣子离去，而圣灵留下，对他们来说就没有那么多的安慰了，因为他们非常不情愿与他们的导师分离。因此，祂升天了，圣灵也没有立刻降临，为的是让门徒们在经历一番沮丧之后，唤醒他们对所赐予之应许的渴望与必要性的认知，并使他们在圣灵降临时体验到纯粹而完全的喜悦。此外，理应先让人类的肉身显现在天上，并成就最完全的和解，然后圣灵才降临。那么，要知道上主借着所赐的应许，对他们施加了何等留在耶路撒冷的必要性。为免他们在升天后再次四散，祂借此期待，如同用某种绳索，将他们所有人都留在那里，并以更蒙福的希望之应许，引导他们强烈渴望这些希望，即便其仍未可知。但若有人说，即使在那时[11]，他们也领受了圣灵的某种能力和恩典，并非那种能叫死人复活的能力，而是领受了赦免罪恶的能力，那人也无错。因此祂又补充道：「你们赦免谁的罪，谁的罪就得了赦免；你们留下谁的罪，谁的罪就留下了。」(约翰福音 20:23)，借此显示祂赐予他们的是何种能力。那时祂正是以这种能力装备了他们；而在四十天之后，祂才赐予他们行神迹的能力；因此祂说：「你们必得着能力」(使徒行传 1:8) 等等。
  - type: paragraph
    text:
      ru: Деян.1:5.Ибо Иоанн крестил водою; а вы, через несколько дней после сего, будете крещены Духом Святым.
      cn: (使徒行传 1:5) 約翰是用水施浸，但不多幾日，你們要受　聖靈的浸。」
  - type: paragraph
    text:
      ru: 'Сказав, чтобы они ждали обетования Отчего, которое слышали от Господа, Он прибавил:«ибо Иоанн крестил водою»и т. д., и этим ясно показывает Свое отличие от Иоанна, и уже не так прикровенно, как прежде, когда говорил:«Меньший в Царстве Небесном больше его»(Мф. 11, 11). Теперь же ясно говорит:«Иоанн крестил водою, а вы… будете крещены Духом Святым», – и показывает, что даже и они стали больше Иоанна, так как и они будут крестить Духом Святым. Не сказал: «Я буду крестить вас Духом Святым», но:«будете крещены», всюду оставляя нам образцы смирения; так как из свидетельства Иоаннова известно уже, что крещающим был Господь:«Он будет крестить вас Духом Святым и огнем»(Мф. 3, 11). Как же сказано:«будете крещены», когда воды в горнице не было? Так сказано потому, что здесь разумелось собственно крещение Духом, через Которого становится действенной и сама вода, подобно тому, как и о Самом Господе говорится, что Он помазан, тогда как Он никогда не был помазуем маслом, но принял Духа. Впрочем, можно доказать, что и апостолы крестились не только Духом, но и водой, только в разные времена. Над нами то и другое крещение совершается в одно время, а тогда совершалось и раздельно, потому что апостолы сначала крестились от Иоанна водой, а потом и Духом Святым. Почему же Господь не объявил, когда сойдет Дух Святый, а говорит только:«через несколько дней после сего?»Говорит так для того, чтобы они не впали в уныние; а не сказал определенно, когда сойдет Дух Святый, для того, чтобы, ожидая Его, они постоянно бодрствовали. Итак, что же удивительного в том, что Он не говорит им о конечном мире, когда, по указанной нами причине, не хотел объявить и этого близкого часа? Выражение«будете крещены»означает обилие и как бы богатство общения Духа Святаго, как и крещаемый в воде, погружаясь всем телом, чувственно как бы ощущает это, тогда как просто принимающий воду орошается не всецело, не по всем местам своего тела. Итак, в том, что теперь сказано, нет противоречия с тем, что говорится в Божественных Евангелиях, ибо ясно, что хотя по воскресении Христа из мертвых и сказано апостолам:«примете Духа Святаго», и они приняли Его, но там так и сказано, что они приняли Духа Святаго. Здесь же выражение«будете крещены Духом Святым»означает излияние и богатство благодати руководить других, которую Господь даровал им, взойдя к Отцу. Как, имея веру, они приходят к Нему и говорят:«умножь в нас веру»(Лк. 17, 5), – так и здесь к тому общению Духа, какое уже имели, они получили, по сошествии на них Святаго Духа, возможность более сильного единения с Ним.'
      cn: 祂吩咐他们等候从上主那里听见的父的应许，并加上说：「因为约翰是用水施洗的」等等，以此清楚地显明祂与约翰的区别，不再像先前隐晦地说：「在天国里最小的，也比他大」（马太福音 11:11）。现在祂则清楚地说：「约翰是用水施洗的，而你们……将受圣灵的洗」，并表明甚至他们也比约翰更大了，因为他们也将用圣灵施洗。祂没有说：「我将用圣灵给你们施洗」，而是说：「你们将受洗」，处处为我们留下谦卑的榜样；因为从约翰的见证中我们已知，施洗者是上主：「祂将用圣灵与火给你们施洗」（马太福音 3:11）。那么，为什么说「将受洗」，当时楼上并没有水呢？如此说是指这里实际上是指圣灵的洗，借着圣灵，水本身也变得有功效，正如论到上主自己，也说祂受膏了，而祂从未被油膏抹，却是领受了圣灵。此外，也可以证明使徒们不仅受了圣灵的洗，也受了水的洗，只是在不同的时间。在我们身上，这两种洗礼是在同一时间施行的，而当时则是分开施行的，因为使徒们先是受了约翰的水洗，然后才受了圣灵的洗。那么上主为何没有宣告圣灵何时降临，而只是说：「在这几日之后」呢？祂如此说是为了不让他们陷入沮丧；而没有明确说圣灵何时降临，是为了让他们在等候祂时，能常常警醒。既然祂因我们所指出的原因，不愿宣告这个临近的时刻，那么祂不告诉他们终末又有什么可惊讶的呢？「将受洗」这个表达意味着圣灵交通的丰盛，以及一种财富，正如受水洗者，全身浸入水中，仿佛切身感受到这种丰盛，而仅仅领受水的，并非全身，也并非身体各处都得浇灌。因此，现在所说的，与《神圣福音书》中所言并无矛盾，因为很清楚，尽管基督从死里复活后曾对使徒们说：「你们将领受圣灵」，而他们也确实领受了，但那里所说的就是他们领受了圣灵。而在这里，「你们将受圣灵的洗」这个表达，则意味着引导他人的恩典的倾泻和丰盛，这恩典是上主升到父那里之后赐予他们的。正如他们虽然已有信心，却来到祂面前说：「增加我们的信心吧」（路加福音 17:5），同样，在这里，在圣灵降临到他们身上之后，他们所已有的圣灵交通又获得了更强烈的合一。
  - type: paragraph
    text:
      ru: 'Деян.1:6–8.Посему они, сойдясь, спрашивали Его, говоря: не в сие ли время, Господи, восстановляешь Ты царство Израилю? Он же сказал им: не ваше дело знать времена или сроки, которые Отец положил в Своей власти. Но вы примете силу, когда сойдет на вас Дух Святый.'
      cn: (使徒行传 1:6-8) 他們聚集的時候，就問耶穌說：「　主啊，你再復興以色列？就在這時候嗎？」 耶穌對他們說：「　父憑著自己的權柄所定的時候、日期，不是你們可以知道的。 但　聖靈降臨在你們身上，你們就必得著能力，並要在耶路撒冷、猶太全地，和撒瑪利亞，直到地極，作我的見證。」


        于是他们聚集起来，问祂说：「主啊，祢要在这时候复兴以色列国吗？」 祂对他们说：「父凭着自己的权柄所定的时间或日期，不是你们可以知道的。但圣灵降临在你们身上，你们就必得着能力。」'
  - type: paragraph
    text:
      ru: 'Намереваясь спросить, они приходят к Учителю вместе, чтобы подействовать на Него своим количеством; так как знали, что прежний ответ Его, именно:«о дне… том и часе никто не знает»(Мф. 24, 36), – был таким ответом не вследствие незнания, а из-за того, что Он уклонялся от ответа. Поэтому снова спрашивают. Когда услышали, что имеют получить Духа Святаго, тогда пожелали узнать об этом и избавиться от бедствий уже как достойные, так как не хотели снова подвергать себя крайним опасностям. Не спрашивают: «когда», но:«не в сие ли время… восстановляешь Ты царство Израилю?»«Не теперь ли», говорят – так сильно желали они этого дня. Мне же кажется, что для них и неясно еще было, что такое это царство, так как еще не было Духа Святаго, Который наставил бы их. Не спрашивают: «когда настанет», но:«восстановляешь Ты»Сам? Так высоко уже думали они о Нем. Поэтому и Он беседует с ними без настойчивости, потому что не говорит уже, что о«дне том и часе никто не знает, ни Ангелы небесные, ни Сын»(Мк. 13, 32), – но что говорит:«Не ваше дело знать времена или сроки». Не потому приписал Отцу знание исполнения времен, чтобы Сам не знал, но потому, что сам вопрос был излишним; и посему Он с пользой для них ответил на него молчанием. Целью у Него было при этом то, чтобы пресечь крайнее любопытство Своих учеников, так как Он посылал их проповедовать Царствие Небесное, а не обозначать количество времен. Не говорит им об этом времени, тогда как научил их гораздо большему, – с тою целью, чтобы, как не раз упоминали мы, заставить их бодрствовать, и потому еще, что, не зная об этом, они ничего не теряли, так как Он открыл им истины гораздо высшие, чем эта, – открыл, что Он есть Сын Божий, что Он равен Отцу, что Он воскрес, что будет воскресение мертвых, что настанет суд и что Он восселодеснуюОтца. Скажи же мне, что важнее – знать, что Он будет царствовать или – когда? Моисей узнал начало мира и то, когда и за сколько веков он сотворен, и исчисляет годы, хотя познать начало вообще труднее, чем конец. Впрочем, апостолы спрашивали Господа не об окончательном совершении времен,«говоря: не в сие ли время… восстановляешь Ты царство Израилю?»Но Он и этого не открыл им, а как отвечал прежде, отклоняя их от мысли об этом, чтобы не думали, что близко избавление от бедствий, но знали, что подвергнутся еще многим опасностям, так отвечает и теперь, только мягче:«но вы примете силу». Потом, чтобы снова не спросили Его, тотчас вознесся. Кроме того, чтобы не спросили: «Почему оставляешь нас в недоумении относительно этого предмета?» – Сын говорит:«Которые Отец положил в Своей власти». Но власть Отца есть, конечно, и власть Сына, потому что«как Отец воскрешает мертвых и оживляет, так и Сын оживляет, кого хочет»(Ин. 5, 21). Если же в тех случаях, когда нужно совершить что-либо чрезвычайное и чудесное, Сын творит с такой же властью, как и Отец, то тем более – в случаях, где требуется знание, потому что воскрешать мертвых, и притом со властью, равной власти Отца, гораздо важнее, чем знать день. Почему же Христос не ответил на то, о чем спрашивали ученики, но сказал:«примете силу!»В ответ им Он сказал:«не ваше дело знать»и тогда уже прибавил:«но вы примете силу». Слова эти объясняют некоторым образом сошествие и, так сказать, излияние Святаго Духа.'
      cn: '他们意欲发问，便一同来到夫子面前，想以人数众多而影响祂；因为他们知道，祂先前的回答，即：「至于那日子，那时辰，没有人知道……」（马太福音 24:36），并非出于无知，而是因为祂回避回答。因此他们再次发问。当他们听说将要领受圣灵时，便渴望知晓此事，并作为配得的人，免受苦难，因为他们不愿再次置身于极度的危险之中。


        他们没有问：「何时？」，而是问：「莫非就在这个时候……祢要复兴以色列国吗？」。他们说：「不就是现在吗？」——他们如此强烈地渴望那一天。而我看来，他们那时对这国度是什么还不清楚，因为圣灵尚未降临来教导他们。他们没有问：「何时到来？」，而是问：「是祢亲自复兴吗？」——他们对祂已有如此崇高的看法。因此，祂也和他们和蔼地交谈，因为祂不再说：「至于那日子，那时辰，没有人知道，连天上的使者也不知道，子也不知道」（马可福音 13:32），而是说：「知道时候或日期，并非你们的事。」


        祂将诸时辰的成就归于父的权柄，并非因为祂自己不知晓，而是因为这个问题本身是多余的；因此，祂以沉默来回答，这于他们有益。祂这样做的目的，是为了遏制祂门徒极度的好奇心，因为祂差遣他们去宣讲天国，而非去指定时日长短。祂没有告诉他们关于这时间的事，尽管祂已经教导了他们远为更伟大的事——其目的是，正如我们不止一次提过的，要使他们警醒，也因为他们对此一无所知也并无损失，因为祂已经向他们启示了远超此等问题的真理——祂启示了祂是上帝之子，祂与父同等，祂已经复活，死人将要复活，审判将会降临，并且祂已经坐在父的右边。那么请告诉我，是知道祂将要作王重要，还是知道何时作王重要？摩西知晓世界的开端，以及它何时被造、历经多少世代被造，并计算年份，尽管知晓开端通常比知晓结局更难。


        然而，使徒们所问上主的，并非是关乎诸时辰的最终成就，他们说：「莫非就在这个时候……祢要复兴以色列国吗？」但祂连这点也未向他们启示，而是如同先前一样，使他们打消此念头，以免他们以为脱离苦难的日子近了，却要他们知道仍将面临许多危险；祂如今也是如此回答，只是语气更为温和：「但你们必领受能力。」之后，为了避免他们再次发问，祂随即升天。此外，为了避免他们发问：「为何祢要让我们对此事感到困惑？」——子说：「父凭着自己的权柄所定下的。」


        然而父的权柄，当然也是子的权柄，因为「父怎样叫死人起来，使他们活着，子也照样随自己的意思使人活着」（约翰福音 5:21）。若在需要施行超凡与奇妙之事时，子以与父相同的权柄来行事，那么在需要知晓之事上就更是如此了，因为使死人复活，并且是以与父权柄同等的权柄，远比知晓那日子更重要。那么基督为何不回答门徒所问之事，却说：「你们必领受能力！」呢？祂在回答他们时说：「这不是你们当知道的。」然后才补充说：「但你们必领受能力。」这些话在某种程度上解释了圣灵的降临，或者说，圣灵的倾注。'
  - type: paragraph
    text:
      ru: Здесь следует упомянуть о фригийской ереси, полагавшей, что Дух Утешитель был послан спустя двести лет по вознесении Христовом на жен, считавшихся пророчицами, Прискиллу и Максимиллу, и на зараженного одним и тем же с ними безумием Монтана; тогда, говорят, исполнилось обетование:"пошлю"Утешителя"к вам"(Ин. 16, 7). – Почему же объявляет им то, о чем они не спрашивали, именно:«примете силу!»Потому, что Он есть Учитель; призвание же учителя учить не тому, чего хочет ученик, но тому, что полезно знать.
      cn: 在此应当提及弗吕家异端，他们认为慰藉者圣灵在基督升天两百年后，降临到两位被认为是女先知、名为普莉斯卡和马克西米拉的女子身上，也降临到与她们同样被这狂妄所感染的孟他努身上；于是，他们说，那应许便应验了：「我将差遣慰藉者到你们这里来」（约翰福音 16:7）。——那么，为什么祂要向他们宣告他们并未询问之事，即：「你们必领受能力！」呢？因为祂是教师；而教师的职责并非教导学生所想知道的，而是教导那些有益于他们知晓之事。
  - type: paragraph
    text:
      ru: Деян.1:8.И будете Мне свидетелями в Иерусалиме и во всей Иудее и Самарии и даже до края земли.
      cn: (使徒行传 1:8) 但　聖靈降臨在你們身上，你們就必得著能力，並要在耶路撒冷、猶太全地，和撒瑪利亞，直到地極，作我的見證。」
  - type: paragraph
    text:
      ru: Так как прежде говорил:«На путь к язычникам не ходите, и в город Самарянский не входите»(Мф. 10, 5), – желая, чтобы слово Божие проповедано было прежде иудеям, а теперь оно должно было разлиться уже по всей вселенной, то благовременно присовокупляет«во всей Иудее и Самарии и даже до края земли». Изречение же«будете Мне свидетелями»есть вместе и увещание, и непреложное пророчество, потому что свою проповедь они засвидетельствовали до последних пределов земли.
      cn: 因为祂曾说过：「外邦人的路，你们不要走；撒玛利亚人的城，你们不要进。」(马太福音 10:5)——是希望上帝的圣言首先传给犹太人，而如今，这圣言将要普传于整个宇宙，所以，祂适时地补充道：「在全犹太和撒玛利亚，直到地极。」而「你们要作我的见证人」这句训示，既是劝勉，又是不可更改的预言，因为他们已将自己的宣讲作了见证，直到地的尽头。
  - type: paragraph
    text:
      ru: Деян.1:9–10.Сказав сие, Он поднялся в глазах их, и облако взяло Его из вида их. И когда они смотрели на небо, во время восхождения Его…»
      cn: (使徒行传 1:9-10) 說了這些話，他們正看的時候，他就被取上升，有一朵雲彩把他接去，便看不見他了。 當他往上去，他們定睛望天的時候，忽然有兩個人身穿白衣，站在旁邊；
  - type: paragraph
    text:
      ru: 'Воскрес так, что они не видели, вознесение же Его видели;поеликуи видение на этот раз не все разрешало: видели конец воскресения, но не видели его начала; видели начало вознесения, но не видели его конца. Почему? Потому, что там видеть начало было излишне, так как сам Воскресший был перед ними и говорил об этом и так как самый гроб показывал, что Его в нем нет; здесь же потребно было знать и конец, так как глазам недоступна вся высота и зрение не могло решить, на небо ли Он вознесся или, поднявшись до некоторой высоты, остановился. Поэтому Ангелы, представ перед ними, открывают им то, чего посредством зрения они понять не могли. А облако подняло Его потому, что оно есть символ Господней и Божественной силы, так как в облаке нельзя видеть символа никакой иной силы. Поэтому и Давид говорит об Отце:«Делаешь облака Твоею колесницею»(Пс. 103, 3), и в другом месте:«Вот, Господь восседает на облаке легком»(Ис. 19, 1). И множество других мест говорит о том же. Впрочем, Господь и это сделал не просто и не без цели, но зная, что если Он вознесется невидимо для них, как и сошел и, тем более, как снисшел, то и при явлении Духа они не поверят, что это Тот Самый Дух, Которого за несколько перед сим дней Он обещал послать; зная, что в таком случае Он подготовит в них подозрение, что и Сам Он пришел не с небес; зная, наконец, что в таком случае, если бы, вознесшись невидимо, Он и воззвал потом с неба Павла, если бы и послал оттуда Петру нерукотворенную плащаницу (см.Деян. 10, 11), то они не поверили бы, что творит это Он после Своего удаления от них плотию, – зная все это, Он восшел,«когда они смотрели на небо». От облака Девы Он входит в облако и при посредстве облака восходит туда, где был прежде. Выражение «где был» понимай не в смысле места и не в том смысле, что Он сложил с Себя плоть и воплотившееся Божество Его стало как прежде бесплотным; нет, выражение «где был», – внемли мне, – указывает на высоту бестелесности в телесности, на величие бесплотности в плотяности, на самосущую ценность Его добровольного смирения при воплощении Его неизменяемости, на то, что видимым образом Он уже не обращается или не обитает среди людей.'
      cn: '祂的复活以他们未曾看见的方式发生，但祂的升天他们却亲眼目睹；因为这一次的看见并未完全解答一切：他们看见了复活的结局，却未曾看见其开端；他们看见了升天的开端，却未曾看见其终结。为何如此？因为在那里，看见开端是多余的，因为那复活者亲自在他们面前并论及此事，而且坟墓本身就表明祂不在其中；而在此处，则需要知晓其终结，因为人眼无法企及全部的高度，视力无法判定祂是升入了天上，抑或只升到一定高度便停止了。因此，众天使显现于他们面前，向他们揭示了他们无法通过视力所领会之事。


        而云彩将祂升起，乃因此乃是上主及神圣力量的象征，因为在云彩中无法看见任何其他力量的象征。因此，大卫论及圣父时说：「以云彩为祢的车辇」（诗篇 103:3），在另一处又说：「看哪，上主驾着快云」（以赛亚书 19:1）。还有许多其他经文也论及同样的事。然而，上主行此并非无故或无目的，乃是知晓，倘若祂像降临世间那样——甚至像道成肉身那样——以他们不可见的方式升天，那么即使圣灵显现时，他们也不会相信这正是祂在此前数日所应许要差遣的圣灵；知晓如此一来，祂会在他们心中种下怀疑，以为祂自己也并非来自天上；知晓，最终，如果祂以隐形方式升天，之后即使从天上呼召保罗，即使从那里差遣那非人手所造的布幔给彼得（参使徒行传 10:11），他们也不会相信这事是祂在身体离去之后所行的——知晓这一切，祂便在「他们望着天上」之时升上去了。


        祂从童贞女的「云彩」进入云中，并藉着云彩升入祂原先所在之处。「祂原先所在」这一表达，勿理解为是指一个地方，亦勿理解为祂已卸下肉身，使其道成肉身的神性如同以往般变为无形体；不，——请聆听我的话——「祂原先所在」这一表达，是指在有形体中之无形体的高超，在肉身中之无形体的宏伟，是指祂在道成肉身时那不可改变的、自愿谦卑的固有价值，是指祂已不再以可见的形式在世人中往来或居留。'
  - type: paragraph
    text:
      ru: 'Деян.1:10–11.Вдруг предстали им два мужа в белой одежде и сказали: мужи Галилейские! что вы стоите и смотрите на небо? Сей Иисус, вознесшийся от вас на небо, придет таким же образом, как вы видели Его восходящим на небо.'
      cn: (使徒行传 1:10-11) 當他往上去，他們定睛望天的時候，忽然有兩個人身穿白衣，站在旁邊； 說：「加利利人哪，你們為甚麼站著望天呢？這離開你們被取升天的耶穌，你們見他怎樣往天上去，他還要怎樣來。」
  - type: paragraph
    text:
      ru: 'Не сказали: «поднимаемого» или «несомого», но:«восходящего».'
      cn: 他们没有说「被举起的」或「被抬着的」，而是说「上升的」。
  - type: paragraph
    text:
      ru: Если Он прежде креста, облеченный еще подверженным страданию и тяжелым телом, ходил по водам, то никто не должен сомневаться, что Он после того, как принял тело нетленное, рассекал воздух.
      cn: 如果祂在十字架之前，尚身披着会受苦且沉重的身体，在水面上行走，那么没有人应该怀疑，祂在领受了不朽坏的身体之后，穿梭于空中。
  - type: paragraph
    text:
      ru: '"Придет", говорится, а не «послан будет».«Придет таким же образом», то есть с телом. Вот о чем они желали слышать, а также и о том, что Он снова придет во дни суда на облаке (см.Мф. 24, 30). Мужами же евангелист называет Ангелов, показывая событие в том виде, в каком оно представлялось зрению, так как Ангелы и на самом деле приняли на себя образ мужей, чтобы не устрашить. Два же мужа предстали потому, что«устами двух или трех свидетелей подтвердилось всякое слово»(Мф. 18, 16).'
      cn: 经上说，「祂将要来临」，而非「祂将被差遣」。「将以同样的方式来临」，也就是说，带着肉身。这正是他们渴望听到的，以及关于祂将在审判之日驾着云再次来临的事（参 马太福音 24:30）。福音书作者称天使为「人」，是展现事件呈现在视线中的样子，因为天使们实际上也取了人的形象，以免使人惊恐。之所以是两个人出现，是因为「凭两三个见证人的口，句句都可定准」（马太福音 18:16）。
  - type: paragraph
    text:
      ru: Сказав:«что вы стоите и смотрите на небо?»– они не позволяли им оставаться более на месте и надеяться снова увидеть Его, но побуждали их возвратиться наконец в Иерусалим на дело проповеди. Ангелы везде служат Ему как Господу – и при рождении, и при воскресении, и при вознесении, и прежде этого, перед явлением Его в мире плотью. Но Ангелы являлись так, что люди могли их видеть. Выражение же«в белой одежде»указывает или на чистоту Ангелов, или на то озарение, которое имело быть даровано святым апостолам. Иначе надобно смотреть на выражение«видели Его». Зная, что явятся люди с поврежденным умом, которые будут говорить, что Он не с неба или пришел не с неба и не вознесся на небо, но перемещен в какое-нибудь место за пределы земли, к числу каковых относятся и последователи секты Виталия, – зная это, Господь вознесся перед глазами апостолов, когда они пристально смотрели на небо.
      cn: 他们说：「你们为什么站着望天呢？」他们不许门徒再停留于原地，也不再盼望能再次见到祂，而是促使他们最终回到耶路撒冷去从事宣讲的事工。天使在各处事奉祂，如同事奉主一般——无论是在祂降生时、复活时、升天时，甚至在此之前，在祂以肉身显现于世之前。但天使显现的方式，是人能看见他们的。而「身穿白衣」这个表述则表明，要么是指天使的纯洁，要么是指将要赐予圣使徒们的那种光照。另当别论，当审视「看见祂」这个表述。上主深知将有心智受损之人出现，他们将声称祂并非来自天上，或者说祂并非从天而降，也未升入高天，而是被转移到了某个地外之处——其中就包括维大利派异端（секты Виталия）的追随者——上主深知此情，便在使徒们眼前升天，当他们定睛望天之时。
  - type: paragraph
    text:
      ru: Деян.1:12.Тогда они возвратились в Иерусалим с горы, называемой Елеон, которая находится близ Иерусалима, в расстоянии субботнего пути.
      cn: (使徒行传 1:12) 有一座山，名叫橄欖山，離耶路撒冷不遠，約有安息日可走的路程。當下，門徒從那裏回耶路撒冷去，
  - type: paragraph
    text:
      ru: 'Когда«тогда они возвратились!»Когда услышали сказанное Ангелами, потому что они никак не оторвались бы от места, если бы Ангелы не сообщили им о втором пришествии. И мне кажется, что это случилось в субботу, потому что Лука не указал бы так на расстояние:«с горы, называемой Елеон, которая находится близ Иерусалима, в расстоянии субботнего пути». Длина пути, которую дозволялось иудеям проходить в день субботы, была определенна. Иосиф Флавий в своей двадцатой книге древностей повествует, что гора Елеон отстояла от Иерусалима на восемь стадий.[12]ИОригенв пятой книге говорит: «Путь субботы составлял три[13]локтя». Да и святая скиния с кивотом на таком расстоянии предшествовала стану и на таком расстоянии помещалась от него, какое дозволено было поклонникам проходить в субботу. Это расстояние – одна миля».[14]'
      cn: 这件事，即『那时他们就回来了！』，发生在他们听见天使所说的话时，因为如果天使不告诉他们第二次降临的事，他们无论如何也不会离开那个地方。我以为这事发生在安息日，因为路加不会那样指出距离：「从名叫橄榄山的地方，它离耶路撒冷不远，有一个安息日可走的路程。」犹太人在安息日被允许行走的距离是确定的。约瑟夫斯·弗拉维乌斯在他的《犹太古史》第二十卷中叙述，橄榄山距离耶路撒冷有八个斯塔迪亚。[12]而奥利金在他的第五卷书中说：「安息日可走的路程是三[13]肘尺。」并且圣帐幕与约柜也曾以此距离先行于营地，并以安息日信徒被允许行走的距离与营地相隔。这个距离是一英里。[14]
  - type: paragraph
    text:
      ru: Деян.1:13–14.И, придя, взошли в горницу, где и пребывали, Петр же и Иаков, Иоанн и Андрей, Филипп и Фома, Варфоломей и Матфей, Иаков Алфеев и Симон Зилот, и Иуда, брат Иакова. Все они единодушно пребывали в молитве и молении, с некоторыми женами и Мариею, Материю Иисуса, и с братьями Его.
      cn: (使徒行传 1:13-14) 進了城，就上了所住的一間樓房；在那裏有彼得、約翰、雅各、安得烈、腓力、多馬、巴多羅買、馬太、亞勒腓的兒子雅各、激進黨的西門，和雅各的兄弟猶大。 這些人同著幾個婦人和耶穌的母親馬利亞，並耶穌的弟兄，都同心合意，不住的禱告祈求。
  - type: paragraph
    text:
      ru: Благоразумно перечисляет учеников. Так как один из них предал, другой отрекся, третий не поверил, то показывает, что, кроме предателя, все были налицо. Но как же он говорит:«с Материю Иисуса?»Хотя и сказал евангелист, что«с этого времени ученик… взял Ее к себе»(Ин. 19, 27), но это нисколько не противоречит предыдущему, потому что если сам ученик этот был тут, то ничто не препятствовало соприсутствовать и Ей. Как не упоминает здесь об Иосифе? Не упоминает потому, что Иосиф уже умер, потому что если уверовали и соприсутствовали братья, которые прежде часто выражали недоверие, то гораздо более оказался бы верным и не захотел бы удалиться от лика апостолов, если бы был еще жив, Иосиф, который никогда не выразил никакого сомнения.
      cn: 他明智地列举了门徒们。因为他们中有一个出卖了主，另一个否认了主，第三个不信，这表明除了那个叛徒，所有人都已到场。但他是如何说的呢：「和耶稣的母亲在一起？」虽然福音书作者曾说「从那时起，那门徒就接她到自己家里去了」（约翰福音 19:27），但这与前文丝毫没有矛盾，因为如果那门徒自己当时在场，那么圣母也一同在场就毫无阻碍了。这里为何没有提到约瑟呢？没有提到他，是因为约瑟已经去世了。因为如果那些以前经常表示不信的弟兄们都相信了并一同在场，那么约瑟，这位从未表达过任何怀疑的人，如果他当时还活着，会更显忠诚，并且不会愿意离开使徒们的聚会。
  - type: paragraph
    text:
      ru: 'Деян.1:15–17.И в те дни Петр, став посреди учеников, сказал, – было же собрание человек около ста двадцати: мужи братия! Надлежало исполниться тому, что в Писании предрек Дух Святый устами Давида об Иуде, бывшем вожде тех, которые взяли Иисуса; он был сопричислен к нам и получил жребий служения сего.'
      cn: (使徒行传 1:15-17) 在那些日子，（聚會的人數約有一百二十名，）彼得就在門徒中間站起來，說： 「諸位弟兄。　聖靈藉大衛的口，在聖經上預言領人捉拿耶穌的猶大，這話是必須應驗的。 他本來列在我們數中，並且在使徒的職任上得了一分。
  - type: paragraph
    text:
      ru: '"В те дни", то есть во дни, бывшие до Пятидесятницы,«Петр, став посреди учеников, сказал», как ученик пламенный и такой, которому Христос вверил Свое стадо, и, наконец, как первый. Но обрати внимание: он делает все с общего соизволения и ничего – самовольно и самовластно. Он убеждает даже на основании предсказания и не говорит, что Давид сказал, но:«предрек Дух Святый устами Давида»; потом добавляет«об Иуде, бывшем вожде тех, которые взяли Иисуса». Замечай и здесь мудрость этого мужа, – замечай, как он в повествовании не оскорбляет и не говорит об Иуде презренном и презреннейшем, но просто заявляет то, что было; и не говорит, что иудеи стяжали, но: Иуда«приобрел землю», и справедливо, потому что хозяином по справедливости должен считаться тот, кто внес деньги, хотя бы покупали и другие. А плата была его. Слушай:'
      cn: 「在那些日子里」，也就是说，在圣灵降临节之前的日子里，「彼得站在门徒中间说」，作为一位热切的门徒，也是基督将祂的羊群托付给他的那一位，最终，是作为首位者。但请注意：他所做的一切都得到了大家的共同同意，没有一件事是擅自做主或专横独断的。他甚至根据预言进行劝说，而且不说大卫曾说过，而是：「圣灵借大卫的口预言了」；接着又加上「关于犹大，就是那些逮捕耶稣之人的首领」。在这里也要留意这位使徒的智慧——留意他在叙述中不侮辱人，也不说犹大是可鄙的、最可鄙的，而只是简单地陈述了事实；也不说犹太人得了一块地，而是：犹大「买了一块地」，这是公义的，因为按公义来说，出钱的人才应该被视为主人，尽管买的人是别人。而这报酬是他的。请听：
  - type: paragraph
    text:
      ru: Деян.1:18–19.Но приобрел землю неправедною мздою, и когда низринулся, расселось чрево его, и выпали все внутренности его. И это сделалось известно всем жителям Иерусалима.
      cn: (使徒行传 1:18-19) 這人用他作惡的工價買了一塊田，以後向前仆倒，肚腹崩裂，腸子都流出來。 住在耶路撒冷的眾人都知道這事；甚至按著他們那裏的話給那塊田起名叫亞革大馬，就是「血田」的意思。

        但他用不义的报酬买了田地，然后仆倒，腹部裂开，内脏都流了出来。此事为耶路撒冷所有的居民所知。'
  - type: paragraph
    text:
      ru: 'Говорит о наказании, какое понес Иуда в настоящей жизни, а не о будущем наказании, потому что души людей немощных не так обращают внимание на будущее, как на настоящее. Наблюдай: распространился не о прегрешении, а о наказании за оное, потому что Иуда не умер в петле, но жил еще и потом, так как был захвачен прежде, чем удавился. Об этом яснее рассказывает Папий, ученик Иоанна, в четвертой книге изъяснения словес Господних. Он говорит так: «Великий пример нечестия представлял в этом мире Иуда, тело которого распухло до такой степени, что он не мог проходить там, где могла проезжать повозка, и не только сам не мог проходить, но даже и одна голова его. Веки глаз его настолько, говорят,[15]вспухли, что он вовсе не мог видеть света, а самых глаз его невозможно было видеть даже посредством медицинской диоптры, так глубоко находились они от внешней поверхности… После больших мучений и терзаний он умер, говорят, в своем селе; и село это остается пустым и необитаемым даже доныне; даже доныне невозможно никому пройти по этому месту, не зажав руками ноздрей. Таково зловоние, которое сообщилось от его тела и земле». Это служило для апостолов некоторым облегчением. Но как утроба Иуды излилась, так и утроба еретика Ария.'
      cn: 讲述犹大在今生所受的惩罚，而非将来的惩罚，因为软弱之人的灵魂，不像关注今生那样关注将来。留意：此处所论述的并非罪过本身，而是罪过所招致的惩罚，因为犹大并非在绳索中死去，而是此后仍活着，他是在上吊之前被捕的。关于这一点，约翰的门徒帕皮亚在其《解释上主言语》的第四卷中记载得更清楚。他这样写道：「犹大在这世上呈现了一个极大的不虔敬的例子，他的身体肿胀到如此程度，以至于马车能通行的地方，他却无法通过，不仅他自己无法通过，甚至连他的头也无法通过。他的眼睑，他们说，[15]肿胀到如此地步，以至于他根本无法看到光线；甚至通过医疗目镜也无法看到他的眼睛，因为它们深陷于外部表面之内……在经历了巨大的痛苦和折磨之后，他们说，他在自己的村庄里死去；并且这个村庄至今仍然荒芜人烟；甚至直到今日，没有人能够不捂着鼻子通过这个地方。他的尸体所散发出的恶臭，如此弥漫于土地上。」这对使徒们来说是一种慰藉。然而，犹大的脏腑既然倾泻而出，异端者亚略的脏腑也同样如此。
  - type: paragraph
    text:
      ru: 'Деян.1:19–20.Так что земля та на отечественном их наречии названа Акелдама, то есть «земля крови». В книге же Псалмов написано: «да будет двор его пуст, и да не будет живущего в нем», и: «достоинство его да приимет другой».'
      cn: (使徒行传 1:19-20) 住在耶路撒冷的眾人都知道這事；甚至按著他們那裏的話給那塊田起名叫亞革大馬，就是「血田」的意思。 因為詩篇上寫著，說：『願他的住處變為荒場，無人在內居住。』又說：『願別人得他的職分。』
  - type: paragraph
    text:
      ru: Название селу"Акелдама"дали иудеи по поводу происшедшего с Иудой. Петр же приводит здесь этот факт, представляя в свидетели врагов, давших земле сей такое имя. Слова«да будет двор его пуст»(см. такжеПс. 68, 26) сказаны об этой земле и о доме Иуды, ибо что могло бы быть пустее кладбища, и кладбища общественного, каковым стала эта земля? А слова:«достоинство его да приимет другой»(см. такжеПс. 108, 8) указывают на сан священства.
      cn: 犹太人因着犹大所发生的事，给那地方取名为「亚革大马」。而彼得在此引用此事实，并以那些给这地取此名的仇敌为证。「愿他的院落变为荒场」（参见 诗篇 68:26）这句话，是针对这块地和犹大的家说的；因为有什么能比墓地，尤其是公共墓地——这地正是如此——更荒凉呢？而「愿他的职分有别人得去」（参见 诗篇 108:8）这句话，则指向圣职之位。
  - type: paragraph
    text:
      ru: Деян.1:21–22.Итак надобно, чтобы один из тех, которые находились с нами во все время, когда пребывал и обращался с нами Господь Иисус, начиная от крещения Иоаннова до того дня, в который Он вознесся от нас, был вместе с нами свидетелем воскресения Его.
      cn: (使徒行传 1:21-22) 所以，從　主耶穌在我們中間始終出入的時候那常與我們作伴的人之中， 就是從約翰施浸起，直到主離開我們被接上升的那一天為止，必須立一個與我們同作耶穌復活的見證。」
  - type: paragraph
    text:
      ru: 'Представляет дело общим с братией, чтобы оно не встретило возражений и не подало повода к состязаниям. Поэтому и в начале беседы говорил: «Мужи братие, следует избрать из вас», – предоставляя выбор всем, а вместе с тем и избранным предоставляет честь, и сам освобождается от нарекания со стороны кого бы то ни было. А что так должно было быть, об этом он и сам говорит, и пророка приводит во свидетели. Из кого же следовало избрать?«Из тех, которые находились с нами во все время». Говорит потому, что это необходимо так и должно было быть. И не сказал: «из честных людей, которые с нами», потому что тогда показалось бы, что он оскорбляет прочих. А теперь дело решалось временем.«Был вместе с нами свидетелем воскресения Его», дабы лик учеников не был усечен ни с какой стороны. Говорит:«свидетелем воскресения», а не чего-либо другого, ибо кто явится достойным свидетельствовать о том, что Господь, Который ел и пил с учениками, и был распят, и воскрес, тому гораздо более можно и должно поручить свидетельствовать и о прочих событиях, потому что искомым было воскресение, так как оно совершилось втайне, а прочее – явно.'
      cn: 他将此事与弟兄们共同提出，以免它遭遇反对，也不至于引起争论。因此，他也在谈话开始时说：「诸位弟兄，理当从你们当中选出一人，」——将选择权交给所有人，同时，也赋予被选之人以荣誉，而他自己也免受任何人的指责。至于理当如此，他自己也这样说，并且引用先知的话作证。那么，理当从谁当中选出呢？「从那些一直与我们同在的人当中。」他这样说，是因为这事如此必要，也理当如此。他没有说：「从与我们同在的正直人当中」，因为那样就会显得他是在冒犯其余的人。而如今，此事是由时间来决定的。「与我们一同成为祂复活的见证人，」以免使徒的队伍在任何方面有所缺损。他说：「复活的见证人」，而不是其他任何事物的见证人，因为谁若被证实配作见证，证明上主曾与门徒们一同吃喝，并受了苦难，且已复活，那么，就更可以也更理当委派他去见证其他事件了，因为所求的是复活，因为它是在隐秘中成就的，而其余的事物则是公开的。
  - type: paragraph
    text:
      ru: 'Деян.1:23–26.И поставили двоих: Иосифа, называемого Варсавою, который прозван Иустом, и Матфия. И помолились и сказали: Ты, Господи, Сердцеведец всех, покажи из сих двоих одного, которого Ты избрал принять жребий сего служения и Апостольства, от которого отпал Иуда, чтобы идти в свое место. И бросили о них жребий, и выпал жребий Матфию, и он сопричислен к одиннадцати Апостолам.'
      cn: (使徒行传 1:23-26) 於是選舉兩個人，就是那叫作巴撒巴，又稱呼猶士都的約瑟，和馬提亞。 眾人就禱告說：「　主啊，你知道眾人的心，求你從這兩個人中，指明你所揀選的是誰， 叫他得這使徒的位分。這位分猶大因為犯罪已經丟棄，往自己的地方去了。」 於是眾人為他們出籤；籤落在馬提亞上；他就和十一個使徒同列。


        于是他们选出了两人：约瑟，又名巴撒巴，他又称为犹士都，和马提亚。他们祷告说：「祢，上主啊，鉴察万人心者，求祢从这二人中，指明祢所拣选的那一位，承受这职分和使徒的位分，这职分是犹大背弃了的，为要往他自己的地方去。」于是他们为二人摇签，签落在马提亚身上，他就与那十一个使徒同列了。'
  - type: paragraph
    text:
      ru: '«И поставили двоих». Почему не многих? Чтобы не вышло большого нестроения, притом же и дело касалось немногих. Благовременно взывают в молитве к Сердцеведцу. Не говорят далее: «избери», но:«покажи… которого Ты избрал», зная, что у Бога все определено прежде помышления человеческого. Везде избрание называет«принять жребий», показывая этим, что все происходит по Божию человеколюбию и по Божию избранию, и напоминая им о древних событиях, потому что как левитов, так и их Бог избрал Себе по жребию.'
      cn: 「于是推举了二人。」为什么不是许多人？以免引起巨大的不和，况且这事只关乎少数人。他们适时地向察验人心的上帝祷告求告。他们不再说：「选择」，而是说：「显明……祢所拣选的人」，因为他们知道，在上帝那里，一切都在人思虑之先已被预定。在所有地方，这拣选都被称为「领受签语」，以此表明一切都是按照上帝的慈爱和上帝的拣选而发生，并提醒他们古时的事件，因为上帝拣选利未人归祂自己是藉着签语，同样也藉着签语拣选了他们。
  - type: paragraph
    text:
      ru: Что же за мужи были они? Может быть, они были из числа семидесяти, бывших с двенадцатью апостолами, или из других верующих, но более пламенно веровавшие и более благочестивые, чем прочие. Таковы были и Иосиф, и Матфий. Называет же Иосифа и Варсавою, и Иустом, быть может, и потому, что у них этими именами называлось одно лицо; но, может быть, и вследствие перемены образа жизни давалось новое название; наконец, прозвание, может быть, присваивалось образу занятий. Отчего же не начинает слово Иаков, приявший епископство в Иерусалиме, но право говорить народу уступает Петру? Оттого, что он был проникнут смирением; тогда не думали ни о чем человеческом, но имели в виду пользу общую. По той же самой причине и апостолы уступают ему кафедру и не соревнуют ему, и не спорят с ним.
      cn: 他们究竟是怎样的人呢？也许他们是那七十门徒之一，曾与十二使徒同在，抑或是其他信徒，但比其他人更热切地信仰、更为虔敬的。约瑟夫和马提亚斯便是如此。约瑟夫也被称为巴撒巴和犹士都，也许是因为在他们那里，这些名字指代的是同一个人；但也可能是由于生活方式的改变而获得了新的称谓；最终，这个称谓也许是根据其职业而赋予的。那么，在耶路撒冷领受了主教职位的雅各布为何不开始发言，却将向民众发言的权利让给彼得呢？因为他充满了谦卑；那时，他们不考虑任何属世之事，而是以共同的益处为念。出于同样的原因，使徒们也向他让出主教座，不与他竞争，也不与他争论。
  - type: paragraph
    text:
      ru: Почему предпочитают избрание посредством жребия? Потому, что они еще не считали себя достойными узнать об этом посредством какого-либо знамения и Дух Святый еще не сошел на них; да и не было нужды в знамении, потому что жребий имел великое значение. Если уже в том случае, когда для определения правильного мнения относительно Ионы не помогли ни молитва, ни мудрость мужей, а напротив, так много значил жребий, то тем более – в этом случае.
      cn: 为何选用抽签的方式呢？因为他们尚不认为自己配得借由任何兆头得知此事，并且圣灵也尚未降临在他们身上；再者，也无需兆头，因为抽签具有莫大的意义。如果连在为了就约拿之事做出正确的判断时，祷告与人的智慧都未能奏效，反而抽签却意义非凡，那么在这种情形下更是如此。
  - type: paragraph
    text:
      ru: '«Идти в свое место». Место, которое имел достойно занять Матфий, Лука называет"своим", или «собственным», потому что как Иуда еще прежде, чем ниспал с него, с того времени, как заболел недугом сребролюбия и предательства, был уже отчужден от места сего, так точно еще прежде, чем Матфий занял это место, с того времени, как он соделал себя достойным такого дара, оно стало его собственностью. И иначе:«в свое место»: каждый своими делами приготовляет себе или хорошее, или худое место. Итак, когда Лука говорит это, то говорит, что Иуда пошел«в свое место» –худое, которое он устроил себе предательством Иисуса; потому что места хороши или худы для нас не по природе, но своими делами мы изготовляем себе место. Слово «место» имеет много значений. Оно означает, между прочим, должность какую-либо; так, мы говорим «место епископа или пресвитера». Можно видеть то же самое и из противного, смотря по тому, как каждый уготовляет себе свое место своими делами: так можно иметь место лжеучителя и лжеапостола, равно как тирана и виновника других преступных дел.'
      cn: «前往他自己的位置»。路加称马提亚理应占据的位置为「他自己的」或「专属的」，因为正如犹大在他堕落之前，从他患上贪财和背叛的恶疾之时起，就已与此位置疏远了；同样，在马提亚占据此位置之前，从他使自己配得这份恩赐之时起，它就已成为他的专属。或者说，「到他自己的位置」：每个人都借由自己的行为为自己预备一个或好或坏的位置。因此，当路加说这话时，他指的是犹大去了「他自己的位置」——一个恶劣的位置，这是他借由背叛耶稣而为自己安排的；因为位置的好坏并非出于其本性，而是我们借由自己的行为为自己造就位置。「位置」这个词有多种含义。它尤其可以指某种职务；例如，我们说「主教或司祭的位置」。同样地，从反面也能看出这一点，视乎每个人如何借由自己的行为为自己预备位置而定：这样，一个人可以拥有假教师和假使徒的位置，也可以是暴君和其他罪恶行径的始作俑者。
  - type: paragraph
    text:
      ru: Итак,поеликуи Иуда, увлекшись страстью к сребролюбию, занял место предателя, то справедливо о нем сказано:«идти в свое место». Лишившись за свои действия места в лике апостолов, он устроил себе«свое место.
      cn: 于是，既然犹大也因贪财的私欲所诱惑，占据了叛徒的位置，那么，公义地论到他说：「去他自己的地方」。因他自己的行为，失去了在使徒的圣品中的位置，他为自己预备了「自己的地方」。
- type: heading1
  text:
    ru: Глава вторая
    cn: 第二章
  children:
  - type: paragraph
    text:
      ru: Деян.2:1–4.При наступлении дня Пятидесятницы все они были единодушно вместе. И внезапно сделался шум с неба, как бы от несущегося сильного ветра, и наполнил весь дом, где они находились. И явились им разделяющиеся языки, как бы огненные, и почили по одному на каждом из них. И исполнились все Духа Святаго, и начали говорить на иных языках, как Дух давал им провещевать.
      cn: (使徒行传 2:1-4) 五旬節到了，門徒都同心地在一處。 忽然，從天上有響聲下來，好像一陣大風吹過，充滿了他們所坐的屋子， 又有舌頭如火燄顯現出來，分開落在他們各人頭上。 他們就都被　聖靈充滿，按著　靈所賜的口才說起別國的話來。

        五旬节那日，他们都同心合一地聚在一处。忽然，从天上传来一阵响声，好像猛烈的风吹过，充满了他们所坐的整个屋子。又有舌头如同火焰，分成几片，向他们显现，各自停留在他们每一个人头上。他们都被圣灵充满，并且开始用别种语言讲说，按着圣灵所赐的口才。'
  - type: paragraph
    text:
      ru: Почему случилось это«при наступлении дня Пятидесятницы?»Потому что когда должен был сойти серп на жатву, когда следовало собирать плоды, тогда должен был сойти и серп слова; и как бы вместо серпа слетел изощренный[16]Дух Святый.
      cn: 为何此事发生于「五旬节来临之日」？因为当镰刀本该降于庄稼之上，当本该收聚果实之时，言语的镰刀也当降临；圣灵仿佛替代了镰刀，以其锐利[16]降下。
  - type: paragraph
    text:
      ru: И Христос говорит:«жатвы много, а делателей мало»(Мф. 9, 37), и в другом месте:«Посмотрите на нивы, как они побелели и поспели к жатве»(Ин. 4, 35). Восприняв начатки, Христос Сам первый вознес их, Сам же первый послал и серп. Почему же послал«при наступлении дня Пятидесятницы!»Потому что этому следовало быть, когда снова наступит праздник, чтобы бывшие при кресте Христовом могли видеть и это.
      cn: 基督说：「庄稼多，工人少」（马太福音 9:37），又在另一处说：「看看这些田地，它们已经发白，熟透可以收割了」（约翰福音 4:35）。基督领受了初熟的果子，祂亲自首先献上它们，又亲自首先派出了镰刀。那么，为什么祂要差遣「在五旬节来临之时呢！」因为这事理应发生，在节期再次到来的时候，好让那些曾与基督的十字架同在的人也能看到此事。
  - type: paragraph
    text:
      ru: '«Разделяющиеся языки, как бы огненные». Пострадавший по плоти добровольной страстью и воскресший из мертвых Господь совоскресил с Собой и нас, умерших грехом, и разрушил власть диавола. Поэтому до Пятидесятницы от Пасхи мы на молитве не делаем земных поклонов, воспевая победу над нашими врагами:«Они поколебались и пали, а мы встали и стоим прямо»(Пс. 19, 9). Но, при явлении нам в огненных языках Духа Святаго, мы преклоняем колена, не вынося этого зрелища и показывая, что чрез Святаго Духа мы познали совершенное поклонение Святой Троице, потому что Бог«есть дух, и поклоняющиеся Ему должны поклоняться в духе и истине»(Ин. 4, 24). Сошествие Святаго Духа совершилось в день Пятидесятницы по следующей причине. В день Пятидесятницы в Ветхом Завете дан был закон. Итак, в какой день дан был закон, написанный на скрижалях, в тот же день даровано законоположение Святаго Духа, начертанное не на скрижалях, но на сердцах. В день Пятидесятницы народ израильский получил закон в пустыне Синайской, потому что в четырнадцатый день первого месяца по лунному счислению, когда праздновали опресноки и тайну Пасхи, вышли сыны Израиля из Египта. От четырнадцатого дня считай до конца месяца семнадцать дней, потом тридцать дней следующего месяца и три дня третьего. Вот на сколько дней Пятидесятница позже праздника опресноков или Пасхи. Итак, от четырнадцатого дня первого месяца до третьего дня третьего месяца – пятьдесят дней. Посему говорится:«В третий месяц по исходе сынов Израиля из земли Египетской… сказал Господь Моисею: пойди к народу, [объяви] и освяти его сегодня и завтра»(Исх. 19, 1, 10). Это Господь говорит в новомесячии.«В третий день», говорится далее,«сойдет Господь пред глазами всего народа на гору Синай»(ст. 11). Итак, в какой день дан закон, в тот же нужно было даровать и благодать Духа, потому что как Спаситель, имея понести святое страдание, благоволил предать Себя на это страдание не в иное время, но в то, в которое закалали агнца, чтобы связать истину с самим образом, так и сошествие Святаго Духа, по благоизволению свыше, даровано не в иное время, но в то, в которое дан закон, чтобы показать, что и тогда законополагал и теперь законополагает Дух Святый. Итак, в Ветхом Завете закон дан был в пятидесятый день. А после пришествия в обетованную землю израильтяне в память об этом событии устроили праздник и в это время от начатков новых плодов и от новых колосьев приносили Богу; и это было символом праздника. Так как в день Пятидесятницы сносили снопы новых плодов и разные лица сходились под одно небо, то в этот же день имело быть и то, чтобы начатки от всякого народа всех живущих под небом народов собирались в один сноп благочестия и по слову апостольскому приводились к Богу.'
      cn: '「有舌头如火焰显现。」按肉身因自愿受难而受苦，并从死者中复活的上帝，也使我们这些因罪而死的人与祂一同复活，并摧毁了魔鬼的权势。因此，从复活节到五旬节，我们在祷告时不行俯伏礼，歌颂我们战胜仇敌的胜利：「他们摇摆跌倒，我们却站立，站得正直」（诗篇 19:9）。然而，当圣灵以火焰般的舌头向我们显现时，我们屈膝下跪，无法承受这景象，并表明藉着圣灵，我们认识了对至圣圣三的完美敬拜，因为上帝「是灵，敬拜祂的人必须用心灵和诚实敬拜祂」（约翰福音 4:24）。


        圣灵的降临发生在五旬节，原因如下。在旧约中，律法是在五旬节那天赐下的。因此，刻在石版上的律法是在哪一天赐下的，就在那一天，圣灵的律法也被赐予，不是刻在石版上，而是刻在心版上。在五旬节那天，以色列民在西奈旷野领受了律法，因为在农历正月十四日，当他们庆祝无酵节和逾越节的奥秘时，以色列的子孙出离埃及。从十四日算起，到月底还有十七天，然后是下一个月的三十天，以及第三个月的三天。这就是五旬节比无酵节或逾越节晚的天数。因此，从正月十四日到三月三日，共有五十天。因此经上说：「到了第三个月，以色列人出埃及地以后……上主对摩西说：你往百姓那里去，[宣告]并使他们今天和明天自洁」（出埃及记 19:1，10）。上主在初一说这话。经上接着说：「到第三天，上主要在全体百姓眼前降临在西奈山」（第11节）。因此，律法在哪一天赐下，圣灵的恩典也需在那一天赐予，因为正如救主，为了承担神圣的苦难，祂乐意将自己交付于此苦难，并非在其他时候，而是在宰杀羔羊的时候，以便将真理与形象本身联系起来；同样，圣灵的降临，按照自上的美意，并非在其他时候赐下，而是在律法被赐予的时候赐下，以表明圣灵那时是颁布律法的，现在也是颁布律法的。因此，在旧约中，律法是在第五十天赐下的。在进入应许之地后，以色列人为纪念这一事件设立了一个节日，并在这时，从新收的初熟果实和新麦穗中向上帝献祭；这便是节日的象征。既然在五旬节那天，人们献上新收的禾捆，并且各方人士齐聚一堂，那么就在这一天，所有住在天下各族中的初熟子民，也应被聚集成为一捆虔敬，并按照使徒的教导被带到上帝面前。'
  - type: paragraph
    text:
      ru: Сноп колосьев служил прообразом этого, чтобы предобозначить собой снопы душ, избираемых из разных стран и приводимых к Богу.
      cn: 一捆禾穗是这事的预表，为要预示那些从各处地方被拣选，并被带到上帝面前的灵魂的禾捆。
  - type: paragraph
    text:
      ru: Почему сошествие Святаго Духа было не без чувственных символов? Потому что если и при этом говорили,«что они напились сладкого вина»(Деян. 2, 13), то чего не сказали бы, если бы этого не было? Не просто был шум, но шум с неба и внезапный, чтобы более изумить их.
      cn: 圣灵的降临为何并非不带有可感知的记号？因为既然在此情形下他们尚且说：「他们喝醉了甜酒」（使徒行传 2:13），那假若没有这些，他们岂不更会说什么呢？不仅有响声，而是从天上而来的响声，并且是骤然的，为要使他们更加惊奇。
  - type: paragraph
    text:
      ru: «Как бы от несущегося сильного ветра». Говорит, что сошествие Духа было с большой и сильной быстротой и заставило всех сойтись и сбежаться туда.
      cn: «仿佛是来自一阵猛烈的风». 他说，圣灵的降临带着极大的迅猛，并使所有人聚集并奔赴那里。
  - type: paragraph
    text:
      ru: «Наполнил весь дом». Дух Святый наполнил весь дом, чтобы показать, что дар этот дарован не отдельно кому-нибудь, но всей полноте Церкви, потому что дом был символом Церкви, как купель – символ воды, а это – знак обилия и силы. Но дом наполнился не огнем, потому что это принудило бы их удалиться.
      cn: «充满了全屋». 圣灵充满了全屋，旨在于表明这恩赐并非单独赐予某个个体，而是赐予教会的整全，因为房屋是教会的象征，如同圣洗池是水的象征，而此乃丰盛与能力的标记。然而房屋并非被火充满，因为那会迫使他们离开。
  - type: paragraph
    text:
      ru: 'Что же всего удивительнее, так это то, что языки разделились«и почили по одному на каждом из»Прекрасно говорит, что разделились, дабы ты узнал, что посланная Утешителем сила одна и та же. Прекрасно также говорит:«как бы огненные», и«как бы от несущегося сильного ветра», чтобы ты не помыслил чего-либо чувственного о Духе. Итак, не просто был ветер, не просто огонь, но Дух Святый, являвшийся там. Наблюдай: когда Иоанн видел Святаго Духа, то видел Его в образе голубя, апостолам же нужно было видеть Его в образе огня.«Почили по одному на каждом из них», то есть остались и начали обитать, потому что выражение «почить» есть знак прочного и постоянного пребывания. На ком же почил Святый Дух – на двенадцати ли только или на ста двадцати? Ясно, что на всех, потому что апостол Петр не напрасно приводит слова пророка, когда говорит:«и будет в последние дни, говорит Бог, излию от Духа Моего на всякую плоть»(ст. 17). И они не просто приняли, но«исполнились все Духа Святаго», и притомвсе,а не апостолы только. – Наблюдай: когда они«единодушно пребывали в молитве и молении»(Деян. 1, 14), когда были исполнены любви, тогда сходит Дух. Для чего же Он явился в виде огня? Для того, чтобы показать, что Он одного и того же существа с Тем, Кто над купиною явился также в виде огня. И почил на голове; с головы же исполнил всего человека; и был виден на головах у них огонь не сожигающий, но освящающий и просвещающий. Почему же они приняли языки не на уста, а на голову? Не на язык, то есть не на физический орган дан Дух, чтобы не подумали, что они из своего чрева и из своих уст произносят то, чего не имели. Но как поднимающиеся на небо воды занимают вершины гор и уже с высот спускаются в долины, так благодать Духа, заняв верхнюю часть головы, как бы гору, распространилась потом на мозг, потом – на уста и на сердце и с головы наполнила собой совершенно всего человека. Почему же, еще повторяю, на голову? Потому что апостолы рукополагались в это время в учители вселенной, а рукоположение совершается не иначе, как на голову. Итак, тем, что языки были над головами, показывается образ рукоположения, потому что рукоположение совершается через возложение рук на голову, такой образ рукоположения в силе и доныне. Так как сошествие Святаго Духа бывает ныне невидимым образом, то на голову рукополагаемого архиерея возлагается Евангелие; и когда оно возлагается, тогда следует в этом видеть не иное что, как покоящийся на голове огненный язык – язык ради проповеди огненный – в силу слов«огонь пришел Я низвести на землю»(Лк. 12, 49). Не сказал, что языки утвердились или поместились, но –"почили"; не сказал также «заняли поверхность», но –«почили на каждом из них», чтобы показать, что всякий муж, совершающий священнодействие, есть трон Божий.'
      cn: '最令人惊奇的是，舌头（方言）分开了，「又落在他们各人头上」。他说「分开了」，说得很好，为要让你明白，由保惠师所赐的力量是同一的。他也说「好像火焰」，和「好像一阵大风吹过」，说得很好，为要使你不要对圣灵有任何感官上的想象。所以，那里显现的不是单纯的风，不是单纯的火，而是圣灵。


        留意：当约翰看见圣灵时，他看见的是鸽子的形象；而使徒们则需要看见火的形象。「又落在他们各人头上」，也就是说，它们留下了并开始居住，因为「落在」这一表达是持久和恒定居留的标志。圣灵是降临在十二门徒身上，还是仅仅降临在一百二十人身上呢？显然是降临在所有人身上，因为使徒彼得引用先知的话并非徒劳，他说：「上帝说，在末后的日子，我要将我的灵浇灌在一切属血气的身上」（使徒行传 2:17）。他们并非仅仅接受了，而是「都被圣灵充满」，并且是所有人都被充满，而不仅仅是使徒们。


        留意：当他们「同心合意恒切祷告」（使徒行传 1:14）时，当他们充满爱时，圣灵就降下了。祂为何以火的形象显现呢？是为了表明祂与那位在荆棘丛中同样以火的形象显现者，是同一本体的。祂降临在头上；并从头上充满了整个人；在他们头上所见的火焰，不是焚烧的，而是圣化和启迪的。那么他们为何是头顶而非口舌接受方言呢？圣灵不是赐予舌头，即不是赐予身体的某个器官，以免人们以为他们是从自己的腹中和口中说出他们所不具备的东西。但正如升腾向天的水占据山顶，然后从高处降入山谷一样，圣灵的恩典，占据了头部最上方，如同山巅，随后扩散到大脑，再到口和心，并从头顶完全充满了整个人。


        那么，我再重复一遍，为何是在头顶呢？因为使徒们在此时被按立为全宇宙的教师，而按立仪式无一例外都是在头上进行。因此，舌头（方言）降临在他们头顶之上，乃是按立仪式的象征，因为按立是通过将手按在头上完成的，这种按立方式至今仍然有效。既然圣灵的降临现在是以不可见的方式发生，那么在被按立的主教头上放置《福音书》；当《福音书》被放置时，这其中应被视为不外乎是一个安息在头上的火焰般的舌头——一个为宣讲而火热的舌头——这乃是根据「我来是要把火丢在地上」（路加福音 12:49）这些话语的力量。经文没有说舌头（方言）固定或安置，而是说——「落在」；也未说「占据了表面」，而是——「落在他们各人头上」，为要表明，每一个施行圣礼的男子，都是上帝的宝座。'
  - type: paragraph
    text:
      ru: «И начали говорить на иных языках». Благодать Божия благоволила определить изначально, чтобы слово апостолов было действенно; потому что зачем проповедники, если бы не было слушателей? А так как начаткам из язычников следовало стать участниками в вере с самых первых дней, то Лука прибавляет:«и начали говорить на иных языках». Почему же дар языков апостолы получили прежде других дарований? Потому что должны были разойтись по всем странам; и как во время столпотворения один язык разделился на многие, так теперь многие языки соединились в одном человеке и один и тот же человек, по внушению Святаго Духа, стал говорить и на персидском, и на римском, и на индийском, и на многих других языках. И дар этот назывался даром языков, потому что апостолы могли говорить на многих языках.
      cn: '「便开始说起别国的话来。」上帝的恩典乐意从一开始就决定，使使徒们的话语能有功效；因为如果没有听众，传道人又有何用呢？而既然那些外邦人的初熟果子理应从一开始就成为信仰的参与者，路加便补充说：「便开始说起别国的话来。」

        那么，为什么使徒们在其他恩赐之先就获得了语言的恩赐呢？因为他们必须分散到所有国家去；正如在建造巴别塔时，一种语言分成了多种语言，照样，如今多种语言汇集在一个人身上，同一个人，在圣灵的感动下，能够说波斯语、罗马语、印度语，以及许多其他语言。这种恩赐被称为语言的恩赐，因为使徒们能够说多种语言。'
  - type: paragraph
    text:
      ru: «Как Дух давал им провещевать». Не от себя апостолы говорили, но провещевали от Духа Божия, проповедуя, то есть уразумевая и провозглашая, изреченные святыми пророками свидетельства о Христе.
      cn: 「正如圣灵使他们宣讲」。使徒们不是凭着自己说的，而是藉着上帝的圣灵宣讲，也就是说，他们领悟并宣告圣先知们所论述的，关于基督的见证。
  - type: paragraph
    text:
      ru: Деян.2:5–6.В Иерусалиме же находились Иудеи, люди набожные, из всякого народа под небесами. Когда сделался этот шум, собрался народ, и пришел в смятение; ибо каждый слышал их говорящих его наречием.
      cn: (使徒行传 2:5-6) 那時，有虔誠的猶太人從天下各國來，住在耶路撒冷。 這聲音一響，眾人都來聚集，各人因為聽見門徒用眾人的鄉談說話，就甚納悶。
  - type: paragraph
    text:
      ru: «Люди набожные». Уже то, что, оставив свои отечества, они обитали в Иерусалиме, было знаком их набожности. Особенно еще и потому, что люди, из различных стран отправившиеся на жительство в Иерусалим, оставили дома и родных. Выражение же«из всякого народа»употреблено вместо выражения «от многих языков», потому что в Писании часто употребляется слово «весь» вместо «многие»; так, в этом смысле сказано следующее:«излию от Духа Моего на всякую плоть»(Иоил. 2, 28), и:«все ищут своего, а не того, что угодно Иисусу Христу»(Флп. 2, 21), и:«нет праведного ни одного»(Рим. 3, 10). Выражением всецелости Писание обозначает в этих местах многих.
      cn: 「虔诚的人们」。仅仅是他们离开自己的家园，居住在耶路撒冷，就是他们虔诚的标志。尤其还因为，那些从不同国家前往耶路撒冷居住的人，撇下了房屋和亲人。而「从各民族中」这个表达，是被用来代替「从许多民族中」这个表达的，因为在圣经中，「所有」一词常被用来代替「许多」；例如，在这一意义上，有如下记载：「我要将我的灵浇灌凡有血气的」（约珥书 2:28），又：「人人都求自己的事，并不求耶稣基督的事」（腓立比书 2:21），又：「没有义人，连一个也没有」（罗马书 3:10）。圣经在这些地方，通过表示「所有」的表达方式，指的是许多人。
  - type: paragraph
    text:
      ru: «Когда сделался этот шум, собрался народ, и пришел в смятение», то есть был смущен, изумился. Так как это случилось в доме, то, очевидно, народ сбежался отвне.
      cn: «当这喧哗声起来的时候，众人就聚集了，并且陷入困惑惊异之中»，也就是说，他们困惑不解，惊异不已。既然这事是发生在一个屋子里，那么，显然，众人是从外面跑进来的。
  - type: paragraph
    text:
      ru: «Ибо каждый слышал их говорящих его наречием». Знали, что верующие, и особенно апостолы (так как собравшиеся обращали свои взоры более на апостолов), – галилеяне; и, однако ж, они говорили на удивительно многих языках.
      cn: 「因为每个人都听见他们用自己的方言说话。」人们知道，这些信徒，尤其是使徒们（因为聚集的人群更多地将目光投向使徒们），是加利利人；然而，他们却说着令人惊叹的多种语言。
  - type: paragraph
    text:
      ru: '«Народ… пришел в смятение», естественно, потому что сбежавшиеся полагали, что событие угрожает им за содеянное ими злодеяние против Христа; и совесть их раздирала их души, так как умерщвление Христа было еще живо в памяти и они страшились всего. Но это укрепляло апостолов, так как и сами слушатели давали им знать, что это – чудесный дар, потому что апостолы не понимали, что известное выражение было парфянское, но узнали это от слушателей. Упоминает также и о враждебных народах – критянах, аравлянах и других; это было символом того, что они победят всех, так как в Иерусалиме было много пленных. Итак, свидетельство отовсюду: и от граждан, и от чужестранцев, и от прозелитов.[17]'
      cn: 「百姓…惊惶失措」，自然是因为那些跑来的人认为这事件是因他们对基督所行的恶行而对他们构成了威胁；他们的良心撕裂着他们的灵魂，因为基督被杀的事仍然历历在目，并且他们惧怕一切。但这却坚固了使徒们，因为连听众自己也让他们知道，这是一个奇妙的恩赐，原因在于使徒们不明白那已知的言语是帕提亚语，而是从听众那里得知的。也提及了敌对的民族——克里特人、阿拉伯人和其他人；这是他们将战胜一切的象征，因为在耶路撒冷有许多俘虏。因此，见证来自各处：既来自公民，也来自外邦人，还来自归信者。[17]
  - type: paragraph
    text:
      ru: 'Деян.2:7–13.И все изумлялись и дивились, говоря между собою: сии говорящие не все ли Галилияне? Как же мы слышим каждый собственное наречие, в котором родились, Парфяне, и Мидяне, и Еламиты, и жители Месопотамии, Иудеи и Каппадокии, Понта и Асии, Фригии и Памфилии, Египта и частей Ливии, прилежащих к Киринее, и пришедшие из Рима, Иудеи и прозелиты, Критяне и Аравитяне, слышим их нашими языками говорящих о великих делах Божиих? И изумлялись все и, недоумевая, говорили друг другу: что это значит? А иные, насмехаясь, говорили: они напились сладкого вина.'
      cn: (使徒行传 2:7-13) 都驚訝希奇，彼此對說：「看哪，這說話的不都是加利利人麼？ 我們各人，怎麼聽見他們說我們生來所用的鄉談呢？ 我們帕提亞人、瑪代人、以攔人，和住在美索不達米亞、猶太、加帕多家、本都、亞細亞、 弗呂家、旁非利亞、埃及的人，並靠近古利奈的利比亞一帶地方的人，從羅馬來的客旅中，或是猶太人，或是進猶太教的人， 克里特和阿拉伯人，都聽見他們用我們的鄉談，講說　上帝的大作為。」 眾人就都驚訝猜疑，彼此說：「這是甚麼意思呢？」 還有人譏誚說：「他們無非是新酒灌滿了。」


        他们都惊奇诧异，彼此说：「看哪，这些说话的不都是加利利人吗？我们怎么每个人都听到自己出生的方言呢？帕提亚人、米底亚人、以拦人，以及住在美索不达米亚、犹太、加帕多基亚、本都、亚细亚、弗吕家、旁非利亚、埃及和靠近古利奈的利比亚一带地方的人，并从罗马来的客旅，犹太人和皈依者，克里特人、阿拉伯人，我们都听见他们用我们自己的方言讲说上帝的伟大作为？」他们都惊奇困惑，彼此说：「这到底是什么意思？」另有些人则嘲笑说：「他们是喝多了甜酒。」'
  - type: paragraph
    text:
      ru: 'Везде наряду с добродетелью порок. Одни удивлялись, другие поносили. Первые поистине были набожны; они потому и жили в Иерусалиме, что по закону им позволялось трижды в год являться в иерусалимском храме. Но обрати внимание на безумие других:«они напились», говорят,«сладкого вина», хотя и время было не такое, в которое можно было бы предположить что-либо подобное, потому что был праздник Пятидесятницы и час третий; но злоба не останавливается ни перед чем. А главное: когда одни, бывшие частью из иудеев, частью – из римлян, частью – из пришельцев, а, быть может, частью – и из распинавших, словом, почти из всех народов, слыша проповедь апостолов, удивлялись и утверждали, что апостолы говорят на их языках, нашлось несколько таких, которые, однако ж, поносили апостолов. Поносившие понимали ли, когда апостолы говорили на разных языках, или нет? Если они не понимали, то как выходит, что апостолы говорили на всех языках? Если же понимали, то как осмелились обвинять их в опьянении, имея налицо обличителей – тех самых мужей, которые слышали и понимали, что апостолы говорят на разных языках и что они не пьяны? Это пусть разрешит кто-нибудь другой; я же утверждаю наоборот: если бы они не понимали, то никак не унизили бы чуда до опьянения (не назвали бы чуда пьянством), так как для чего было бы и стараться об унижении того, что не причиняет никому никакой досады? Поэтому и Лука называет их поносителями, как бы хулителями и клеветниками. Итак, они клеветали, понимая то, о чем говорилось, но клеветали потому, что были недовольны тем, что говорилось, так как апостолы прославляли великие дела Божии. Каким же образом, понимая то, что говорилось, они приписывали это опьянению? Вследствие великого безумия и чрезмерной жестокости. Ведь у многих, если они недовольны тем, что говорится, в обычае считать говорящего или беснующимся, или сумасшедшим или обвинять в опьянении и непонимании того, что он говорит, хотя тот, кто говорит, и говорит здраво, а поноситель, при обвинении первого, слушает и понимает его. А эти, обвиняя апостолов в опьянении, выказали еще больше дерзости, потому что хотя сами и слушали их на своем языке, но полагали, что другие люди, люди самых разнообразных наречий, не понимали их. Сами понимали то, что говорилось, а об остальных, из-за которых и оклеветали апостолов в опьянении, думали, что те не понимают чуда. Как в то время, когда Господь изгонял бесов, они хотя и понимали, и видели эти чудесные действия, но вместо должного прославления оклеветали Господа в том, будто Он совершал их силою веельзевула; также видя исцеляемыми всякие болезни и страдания, они эти чудесные действия сделали поводом к зависти, доносам и убиению, – так и теперь, не имея возможности отрицать чудесность и сверхъестественность языков, они, однако же, дерзнули унизить чудо до опьянения. Но обрати внимание и на злоухищрение. Так как было невероятно, чтобы кто-нибудь был пьян в такой час и в особенности люди, испытавшие много опасностей и ужасов, то они приписывают все качеству вина, говоря о нем"сладкого".[18]Здесь наглость домогается уже только того, чтобы сказать что-нибудь, а не того, как бы сказать поосновательнее. Поэтому и то, что высказывается ими, неясно полно глупости и безумия. Заметь, как злоба изобличается и временем года и часом дня. Откуда глевкос в дни Пятидесятницы? Глевкосом называется новое вино.[19]Далее, опьянение дает силу говорить на разных языках – опьянение, которое и природного языка лишает! Посмотри, что устрояет Бог. Иудеи отказались бы войти и послушать, если бы не подозревали, что это клевета. Господь допустил клевету, чтобы собрать многих слушателей.'
      cn: '德行与罪恶总是并存的。有人惊奇，有人毁谤。前者确实虔敬；他们之所以住在耶路撒冷，是因为律法允许他们每年三次到耶路撒冷的圣殿朝见。然而，请注意其他人的狂妄：「他们喝醉了甜酒」，他们说，尽管当时并非可能发生此类事情的时间，因为那是五旬节，且是第三时辰；但恶意无所不为。最重要的是：当一部分人，包括犹太人、罗马人、侨居者，或许还有那些曾将主钉上十字架的人——简而言之，几乎所有民族的人——听到使徒们的宣讲，都感到惊奇并证实使徒们正用他们的语言说话时，却有少数人毁谤使徒们。


        那些毁谤者，当使徒们用各样的语言说话时，他们是否听懂了呢？如果他们没听懂，那么使徒们如何能用所有的语言说话呢？如果他们听懂了，那么他们又怎敢指控使徒们醉酒，眼前明明有那些听见并明白使徒们正用各样语言说话且并未醉酒的见证人呢？这个问题就留给别人去解决吧；而我则持相反观点：如果他们没听懂，那么他们绝不会将这奇迹贬低为醉酒（也不会称这奇迹为醉酒），因为贬低一个对任何人都没有造成任何冒犯的事，又有什么必要呢？因此，路加称他们为毁谤者，如同亵渎者和诽谤者一般。


        因此，他们是在明知所言为何的情况下进行诽谤的，他们诽谤是因为对所言不满，因为使徒们正在颂扬上帝的伟大作为。那么，他们是如何在明知所言为何的情况下，将其归咎于醉酒呢？这是由于极大的狂妄和过度的残忍。因为对许多人来说，如果他们对所说的话不满，通常会认为说话者不是被邪灵附身，就是疯了，或者指责他醉酒且不知道自己在说什么，尽管说话者言辞清晰，而那些毁谤者在指责前者时，其实也听懂并明白了。而这些人，在指控使徒们醉酒时，则表现出更大的胆大妄为，因为他们虽然自己用自己的语言听懂了使徒们的话，却认为其他各样方言的人不理解他们。他们自己理解所说的话，但对于其他人，即那些被他们当作借口诽谤使徒们醉酒的人，却认为他们不明白这奇迹。正如在主驱逐邪灵时，他们虽然理解并看到了这些奇妙的作为，却没有给予应有的颂扬，反而诽谤主，说祂是借着别西卜的能力行事；同样，当他们看到各种疾病和痛苦被治愈时，他们也将这些奇妙的作为当作嫉妒、告发和谋杀的借口——现在也是如此，他们无法否认这些语言的奇妙和超自然性，却仍然胆敢将这奇迹贬低为醉酒。


        然而，也请留意他们的恶毒诡计。因为在那个时辰，尤其对于那些经历过许多危险和恐惧的人来说，醉酒是不可思议的，所以他们将一切归咎于酒的品质，称之为「甜酒」。[18]在这里，他们的无耻仅仅是为了说些什么，而不是为了说得更有根据。因此，他们所说的话语模糊不清，充满愚蠢和狂妄。请注意，恶意是如何被季节和时辰所揭露的。五旬节期间哪来的格列弗科斯呢？格列弗科斯指的是新酒。[19]此外，醉酒竟能使人说各样的语言——醉酒只会让人连本族语言都丧失！看看上帝所成就的。犹太人若非怀疑这是一种诽谤，是绝不会进来听的。上主允许了这诽谤，以便召集许多听众。'
  - type: paragraph
    text:
      ru: 'Деян.2:14–15.Петр же, став с одиннадцатью, возвысил голос свой и возгласил: мужи Иудейские и все живущие в Иерусалиме! сие да будет вам известно, и внимайте словам моим: они не пьяны, как вы думаете, ибо теперь третий час дня.'
      cn: (使徒行传 2:14-15) 彼得和十一個使徒站起，他高聲對他們說：「猶太人和一切住在耶路撒冷的人哪，這件事你們當知道，也當側耳聽我的話。 你們想這些人是醉了；其實不是醉了，因為時候剛到巳初。
  - type: paragraph
    text:
      ru: 'Выше видел ты промышление; здесь замечай мужество, потому что если все слушатели удивлялись, то разве не столь же было удивительно и то, что человек простой и некнижный возвысил голос среди такого множества несмотря на то, что были и клеветавшие, и способные убить? Ужели это не выше человеческих сил? Но посмотри: тотчас по возвышении голоса он (то есть Петр) изобличает обман, доказывая, что они не пьяны. Но они и не в исступлении. Что же такое происходит с ним и с одиннадцатью? Петр произносил общее мнение и общий голос и был устами всех, а одиннадцать предстояли тут, свидетельствуя о том, что он говорил.«Возвысил голос свой», то есть начал речь с большим дерзновением для того, чтобы тотчас, в начале ее, почувствовали благодать Духа. Тот, кто не выдержал вопроса слабой рабы, тот самый среди народа и убийц говорит с таким дерзновением. Прежде чем получил дар языков, Петр устрашился, когда спрашивала его одна только рабыня придверница, и говорил:«не знаю Человека Сего»(Мк. 14, 71). Там одна рабыня и великий страх, здесь – неисчислимое множество и голос, полный великого дерзновения. Не сказал:«они не пьяны, как вы»клевещете, но:«как вы думаете», потому что говорит уже более кротко и не желает доказывать настойчиво, что они говорили это по злобе, но приписывает им незнание, а не обличает в нечестии, предуготовляя для них путь к обращению. И что значит возражение, что не в обычае упиваться в третьем часу? Но Петр не остановился на нем, потому что и сами они не так думали об апостолах, но говорили так только по клевете.'
      cn: 上面你看到了神圣的护理；在这里，请留意他的勇气，因为如果所有听众都感到惊奇，那么一个朴实无华、不学无术的人，在这样的人群中，在有诽谤者和能杀人的人存在的情况下，能够提高声音，这难道不是同样令人惊奇吗？这难道不是超乎人类能力之外的吗？但请看：他（即伯多禄）一提高声音，立刻就揭露了谎言，证明他们并没有醉酒。但他们也没有在狂喜中。那么他和那十一人身上究竟发生了什么呢？伯多禄表达的是共同的意见和共同的声音，他是所有人的口舌，而那十一人则站在那里，为他所说的话作证。「提高自己的声音」，也就是说，他以极大的勇气开始讲话，以便在讲话一开始，人们立刻就能感受到圣灵的恩典。那个连一个软弱的婢女的质问都无法承受的人，竟然在人群和杀人犯中间，以如此的勇气说话。在获得方言恩赐之前，伯多禄曾因一个门房婢女的盘问而恐惧，并说：「我不认识这个人」（马可福音 14:71）。那里只有一个婢女和巨大的恐惧，这里却是无数的人群和充满巨大勇气的言语。他没有说：「他们并没有像你们所诽谤的那样醉酒」，而是说：「正如你们所想的」，因为他说话时已更加温和，并不执意证明他们是出于恶意而说这些话，而是将此归因于他们的无知，而不是指责他们不敬虔，从而为他们悔改归正预备道路。那么，「在第三时（上午九点）醉酒并非惯例」这个反驳又意味着什么呢？但伯多禄并没有止步于此，因为他们自己对使徒们也并非这样认为，而只是出于诽谤才这样说。
  - type: paragraph
    text:
      ru: 'Деян.2:16–18.Но это есть предреченное пророком Иоилем: «И будет в последние дни, говорит Бог: излию от Духа Моего на всякую плоть; и будут пророчествовать сыны ваши и дочери ваши; и юноши ваши будут видеть видения, и старцы ваши сновидениями вразумляемы будут. И на рабов Моих и на рабынь Моих в те дни излию от Духа Моего, и будут пророчествовать.'
      cn: (使徒行传 2:16-18) 這正是先知約珥所說的： 　上帝說：『在末後的日子，我要將我的　靈澆灌凡有血氣的。你們的兒女要說預言；你們的少年人要見異象；老年人要作異夢。 在那些日子，我要將我的　靈澆灌我的僕人和使女，他們就要說預言。

        但这正是先知约珥所预言的：

        「上帝说：在末后的日子，

        我要将我的灵浇灌在所有属血肉的人身上；

        你们的儿女要说预言；

        你们的少年人要看见异象；

        你们的老年人要做异梦。

        在那些日子，我的仆役和我的婢女，我也要将我的灵浇灌在他们身上，

        他们也要说预言。」'
  - type: paragraph
    text:
      ru: 'Ссылается не на Христово имя, не на Христово обетование, но на обетование Отца. Замечай и предусмотрительность Петра. Не умолчал о пророчестве, но и не сказал прямо о том, что касается Христа: что Он после того, как был распят и воскрес, обещал им, апостолам, этот дар. Если бы он, Петр, сказал это, то испортил бы все; хотя это и могло доказать Божественность Христа, но показалось бы невероятным. Вопрос же в том, чтобы поверили тому, что говорится; а то, что показалось бы невероятным, заставило бы их поколебаться. Этих недоумений ничто не в состоянии разрешить, кроме пророческого свидетельства. Итак, когда возникает какой-нибудь сомнительный вопрос, не прибегай к рассуждениям. Рассудочные обсуждения так же опровергаются, как составляются, а глас Божий кто разрушит? Рассуждение разрушается, Писание не разрушается. Не сказано: «излию Дух Мой», но:«от Духа Моего». Не Дух, но дар Духа изливается«на всякую плоть», и именно на уверовавшую, то есть на язычников. Но он еще не открывает им этого, а слова«на всякую плоть»подают им и добрые надежды и не позволяют ожидаемые блага присваивать себе одним; через это самое он подсекает и зависть в самом ее корне. Обрати же внимание на то, как разнообразно откровение Святаго Духа. Один, имея благодать Духа, пророчествует; другой, неспособный на это служение, получает дар видений: так Петр в шестом часу дня видит сосуд, Корнилий в девятом часу видит Ангела. Видение сердцем не называется «взглядом» или «взором», но «видением». Иначе видят видение; иначе видят теорему, когда видят не глазами; иначе поучаются образами, какие представляются во сне.'
      cn: 不引据基督之名，不引据基督的应许，而引据天父的应许。也要留意伯多禄的深谋远虑。他没有对这预言只字不提，但也没有直接提及关乎基督之事：即基督在被钉十字架并复活后，曾将此恩赐应许给他们，即使徒们。倘若他，伯多禄，说了这话，便会坏了大事；尽管这可能证明基督的神性，但会显得不可置信。而问题在于他们是否相信所说的话；凡是会显得不可置信之事，都将令他们动摇。除了先知性的见证，没有任何事物能解开这些困惑。所以，当出现任何可疑问题时，不要诉诸理性推论。理性讨论正如它们被建立一样，也同样会被驳倒，而上帝之声，谁能将其摧毁？理性推论会被摧毁，圣经则不会被摧毁。经文没有说：「我要倾倒我的圣灵」，而是说：「从我的圣灵中」。倾倒的不是圣灵本身，而是圣灵的恩赐，「在凡有血气的身上」，并且是倾倒在信奉的人身上，即倾倒在外邦人身上。但他还没有向他们揭示这一点，而「在凡有血气的身上」这些话语，给予他们美好的盼望，也不允许他们将所盼望的福分独占；借此，他从根源上剪除了嫉妒。请留意，圣灵的启示是多么多样。有人蒙受圣灵的恩典，便宣讲预言；另有人无法胜任这项事奉，则领受异象的恩赐：譬如伯多禄在白日第六时辰看见器皿，哥尔乃流在第九时辰看见天使。心灵的视像不被称为「一瞥」或「注视」，而是「视像」。视像的看见方式不同；不用肉眼看见定理的方式也不同；从梦中显现的图像中受教的方式也不同。
  - type: paragraph
    text:
      ru: 'Деян.2:19–21.И покажу чудеса на небе вверху и знамения на земле внизу, кровь и огонь и курение дыма. Солнце превратится во тьму, и луна – в кровь, прежде нежели наступит день Господень, великий и славный. И будет: всякий, кто призовет имя Господне, спасется»(Иоил. 2, 28–32).'
      cn: (使徒行传 2:19-21) 在天上、我要顯出奇事；在地下、我要顯出神蹟；有血，有火，有煙霧。 日頭要變為黑暗，月亮要變為血；這都在　主大而明顯的日子未到以前。 到那時候，凡求告　主名的，就必得救。』」

        「我要在天上显出奇事，在下地显出异兆，有血，有火，有烟柱。

        日头要变为黑暗，月亮要变为血，这都在上主伟大而荣耀的日子来到以前。

        那时，凡求告上主之名的，就必得救。」（约珥书 2:28-32）'
  - type: paragraph
    text:
      ru: 'Этими словами пророк наперед ясно предсказывает и о будущем суде, и о разрушении Иерусалима, и о плене иудеев, и о событиях, имевших быть при кресте Христовом, и, наконец, о том, что случилось с иудеями вследствие римской войны, когда в Иудее проливалось римлянами множество крови, когда развевался дым от сожигаемых городов и селений. Через это иудеи несли наказание за свою дерзость против Христа, за дерзость, которой не перенесло и самое солнце и смежило свое око, световую силу, и луна свой сребровидный образ изменила в красный свет. Говорят, однако же, будто много подобных явлений было на небе и во время разрушения Иерусалима; так свидетельствует Иосиф Флавий. Впрочем, словами:"луна"превратится"в кровь", пророк указывает и на чрезмерную жестокость заклания (то есть распятия Господа). Но почему происходит это в третьем часу? Чтобы показать чудесность этого явления: блеск огня виден среди светлого дня, когда все на площади! Впрочем, составитель богослужебных песней понимает сказанное пророком так: кровь – воплощение, огонь – Божество, курение дыма – Святый Дух, осенивший наитием Деву и исполнивший мир благовонием, а под днем Господним разумеет день воскресения.'
      cn: 先知借这些话语，清晰地预言了将来的审判、耶路撒冷的毁灭、犹太人的被掳，以及基督十字架下的诸事；最终，也预言了罗马战争后犹太人所遭遇的一切，当时罗马人在犹太地倾流了无数鲜血，焚烧的城镇与村庄浓烟滚滚。借此，犹太人为他们对基督的胆大妄为承受了惩罚，这胆大妄为连太阳都无法忍受，合上了它的眼睛，即它的光明之力，月亮也将其银白之像变为赤红之光。然而，据说在耶路撒冷被毁时，天上也有许多类似的异象发生；约瑟夫·弗拉维为此作证。此外，先知以「月亮将变为血」这些话语，也指出这祭献（即上主的被钉十字架）的极度残酷。然而，这为何发生在第三时辰呢？乃为显明此现象的奇妙之处：火光在白昼之中显现，当时所有人都在广场上！此外，礼仪圣诗的编撰者如此理解先知所言：血——是道成肉身，火——是神性，烟雾——是圣灵，以其降临荫庇了童贞女，并以馨香充满世界，而「上主的日子」则指复活之日。
  - type: paragraph
    text:
      ru: 'Но Господь говорит:«излию от Духа Моего… прежде нежели наступит день Господень». Скажи иудею: «Если одно лицо и одно имя у Божества и если Бог говорит Сам о Себе, то почему не сказал: „прежде чем прийти дню Моему“»? Если, говорит Петр, вы согрешаете теперь безнаказанно, так на это не надейтесь, потому что это только начало того великого и трудного дня. Подвигнув этим и устрашив сердца их, он успокаивает их и дозволяет им питать добрые надежды.«И будет: всякий, кто призовет имя Господне, спасется». Но не просто призовет, потому что говорится:«не всякий говорящий Мне: «Господи! Господи!»(Мф. 7, 21), нет, но – всякий, кто призовет с расположением и с доброй жизнью. Включив теперь в свою речь слово о вере (о необходимости веры), потому что спасение зависит от призывания, он делает свою речь удобопонятной. Имя Господне, по объяснению Павла, призывается во имя Христа, но Петр на этот раз не решился открыть это своим слушателям.'
      cn: 但上主说：「我要将我的灵浇灌… 在上主的日子来临之前。」对犹太人说：「如果神性只有一个位格和一个名字，并且如果上帝说的是祂自己，那么为何不说：『在我的日子来临之前』呢？」彼得说，如果你们现在犯罪却不受惩罚，那么不要指望（这种状况继续），因为这只是那个伟大而艰难的日子的开始。借此感动并震慑了他们的心后，他便使他们平静下来，并让他们怀抱美好的希望。「并且将来，凡求告上主之名的，就必得救。」但不是简单地求告，因为经上说：「不是每一个对我说：『主啊！主啊！』的人，(马太福音 7:21) 不，而是每一个以恳切之心和美好生活求告的人。他现在将关于信德（信德的必要性）的话语纳入他的讲论中，因为救恩取决于求告，他使他的讲论易于理解。上主之名，按照保罗的解释，乃是奉基督之名被求告的，但彼得这次还没有决定向他的听众揭示这一点。
  - type: paragraph
    text:
      ru: 'Деян.2:22–24.Мужи Израильские! выслушайте слова сии: Иисуса Назорея, Мужа, засвидетельствованного вам от Бога силами и чудесами и знамениями, которые Бог сотворил через Него среди вас, как и сами знаете, Сего, по определенному совету и предведению Божию преданного, вы взяли и, пригвоздив руками беззаконных, убили; но Бог воскресил Его, расторгнув узы смерти.'
      cn: (使徒行传 2:22-24) 「以色列人哪，請你們聽我的話，　上帝藉著蒙　上帝悅納、拿撒勒的耶穌在你們中間施行異能、奇事、神跡，將他證明出來，這也是你們自己知道的。 他既按著　上帝的定旨先見被交與人，你們就捉拿他，並藉著惡人的手，把他釘在十字架上，殺了。 　上帝卻將死的痛苦解釋了，叫他復活，因為他原不能被死拘禁。
  - type: paragraph
    text:
      ru: Слово это не есть лесть; но так как Петр сильно укорил их, то теперь снисходит им и напоминает о праотцах, убеждая припомнить их веру, и снова начинает сначала, чтобы не возмутить их, так как намерен был напомнить им об Иисусе. Прежде, слушая пророка, они не могли возмущаться. И посмотри, как он ничего не говорит об истинах возвышенных, но начинает со сторон, которые говорят о великом смирении Иисуса."Назорея", говорит, называя Иисуса по отечеству, которое представлялось очень ничтожным. Как в тех случаях, когда Христос называется Божией Силой и Божией Премудростью, мы относим эти названия к Его Божеству, так в тех случаях, когда Он называется человеком и умершим за грехи наши, мы относим названия эти к Его плоти. И сам Он говорил некогда:«Ищете убить Меня, Человека, сказавшего вам истину»(Ин. 8, 40), а еще некогда говорил:«Я и Отец – одно»(Ин. 10, 30). Отсюда, на основании первого текста, возникла ересь самосатская, полагавшая, что Иисус был простой человек.
      cn: 这话并非谄媚之词；然而，由于彼得严厉地斥责了他们，他现在就屈尊他们，并提醒他们关于列祖的事，劝说他们回忆起列祖的信仰，并再次从头开始，以免激怒他们，因为他打算提醒他们关于耶稣的事。之前，他们听先知说话时，并不能被激怒。并且看啊，他没有谈论任何崇高的真理，而是从那些讲述耶稣伟大谦卑的方面开始。他说：「拿撒勒人」，称呼耶稣是根据祂的家乡，而那家乡被认为是非常微不足道的。正如在基督被称为上帝的能力和上帝的智慧时，我们将这些称谓归于祂的神性，同样，在祂被称为人并为我们的罪而死时，我们将这些称谓归于祂的肉身。祂自己也曾说过：「你们要杀我，就是那把真理告诉了你们的人。」（约翰福音 8:40），而祂也曾说过：「我与父原为一。」（约翰福音 10:30）。由此，基于第一段经文，产生了撒摩撒的异端，它认为耶稣只是一个普通的人。
  - type: paragraph
    text:
      ru: '«Силами и чудесами и знамениями». Эту же мысль выражают и слова апостола Павла, что Он«открылся Сыном Божиим в силе»(Рим. 1, 4), то есть Сыном, Которого дела и чудеса доказали, что Он поистине есть Сын Отца, потому что нет никакого различия между изречением: «открыть Сына Божия в силе» и изречением: «засвидетельствовать о Нем«силами и чудесами и знамениями», которые сотворил через Него Бог». Поистине Бог действует как бы через Сына, потому что через Него и«веки сотворил»(Евр. 1, 2). А выражением"среди вас"призывает их в свидетели того, что говорит;«среди вас» –значит не тайно, не в уголке. Потом, напав на их беззаконие, старается снять с них ответственность за него и говорит:«по определенному совету», показывая этим, что они не своей силой сделали то, на что дерзнули, но потому, что Он Сам соизволил на это и что это определено было свыше.'
      cn: 「异能、奇迹和神迹」。这同样的思想也由使徒保罗的话语表达出来，说祂「以大能显明是上帝的儿子」（罗马书 1:4），也就是说，祂的作为和奇迹证明了祂确实是圣父的儿子，因为「以大能显明上帝的儿子」这句话，与「藉着祂，上帝藉着异能、奇迹和神迹为祂作证」这句话之间，并没有任何区别。上帝确实仿佛是藉着圣子行事，因为也是藉着祂，「创造了诸世界」（希伯来书 1:2）。而「在你们中间」这句话，是呼召他们作祂所说之事的见证人；「在你们中间」——这意味着不是秘密地，也不是在隐秘之处。接着，祂指责他们的不法行为，并试图免除他们对此的责任，说：「按着既定的旨意」，借此表明，他们所胆敢做的事并非出于他们自己的力量，而是因为祂自己对此表示同意，并且此事乃是自上头所定规的。
  - type: paragraph
    text:
      ru: Далее, чтобы не показалось, что они невинны, – так как хотя это и было определено, однако же убийцами были они, – чтобы не показалось так, он прибавляет:«руками беззаконных», то есть или через предателя Иуду, или через распявших Христа воинов. Хотя известно, что пригвоздившие Его ко кресту совершили беззаконие, тем не менее сначала Петр говорит об этом неясно, чтобы не довести их до отчаяния.
      cn: 接下来，为了避免让他们看起来是无辜的——因为虽然这已经被预定，但他们确是凶手——他补充道：「借着不法之人的手」，也就是说，或者借着叛徒犹大，或者借着将基督钉在十字架上的兵士们。虽然众所周知，那些将祂钉在十字架上的人犯下了不法之事，然而彼得起初对此说得不明确，以免使他们陷入绝望。
  - type: paragraph
    text:
      ru: «Бог воскресил Его». Как он решился сказать среди убийц, что Христос воскрес? А если говорится, что Отец воскресил Его, так это по причине немощи слушателей, потому что посредством кого действует Отец? Посредством Своей силы, а сила Отца – Христос. Итак, Он Сам воскресил Себя, хотя и говорится, что Его воскресил Отец.
      cn: «上帝使祂复活了». 他怎敢在那些杀人者中间宣称基督复活了呢？而如果说父使祂复活了，那是因为听众的软弱，因为父借着谁而行动呢？借着祂自己的权能，而父的权能就是基督。所以，祂自己使自己复活了，尽管也说父使祂复活了。
  - type: paragraph
    text:
      ru: '«Расторгнув узы смерти». Показывает, что и смерть мучилась как бы родами и страшно страдала, когда завладела Им, потому что Ветхий Завет болезни как бы рождающей смерти называет опасностью и бедствием для нее. Рождающая не удерживает того, что находится в ней, и не действует, но страдает и спешит освободиться. Прекрасно Петр назвал воскресение разрешением болезней (уз) смерти, так что можно сказать: разорвав беременное и страдающее родами чрево, Христос Спаситель появляется и выходит как бы из какой рождающей утробы, то есть из уз смерти и из среды ада. Поэтому Он и назван перворожденным из мертвых.'
      cn: «挣脱死亡的枷锁»。这表明连死亡也承受着煎熬，仿佛在分娩时剧痛，当它掌控了祂时，便极度痛苦，因为《旧约》将如同分娩中的死亡所经历的痛苦称为对它自身的危险和灾难。正在分娩者无法留住其内部之物，也不起作用，而是受苦并急于解脱。圣彼得精妙地将复活称为解开死亡的苦楚（枷锁），因此可以说：撕裂了那怀孕且承受分娩剧痛的子宫，基督救主显现并出来，仿佛从某个分娩的母腹中，也就是说，从死亡的枷锁和阴间的深渊中。因此祂也被称为死者中的首生者。
  - type: paragraph
    text:
      ru: 'Деян.2:24–28.Потому что ей невозможно было удержать Его. Ибо Давид говорит о Нем: «видел я пред собою Господа всегда; ибо Онодеснуюменя, дабы я не поколебался. Оттого возрадовалось сердце мое и возвеселился язык мой; даже и плоть моя упокоится в уповании; ибо Ты не оставишь души моей в аде и не дашь святому Твоему увидеть тления. Ты дал мне познать путь жизни; Ты исполнишь меня радостью пред лицем Твоим»(Пс. 15, 8–11).'
      cn: (使徒行传 2:24-28) 　上帝卻將死的痛苦解釋了，叫他復活，因為他原不能被死拘禁。 大衛指著他說：『我看見　主常在我眼前；他在我右邊，叫我不至於搖動。 所以，我心裏歡喜，我的舌頭快樂；並且我的肉身要安居在盼望中。 因你必不將我的元魂撇在地獄，也不叫你的　聖者見朽壞。 你已將生命的道路指示我，必叫我因見你的面得著滿足的快樂。』」

        因为死亡不可能拘禁祂。因为大卫论到祂说：

        「我常将上主摆在我面前；

        因祂在我右边，使我永不动摇。

        因此我的心欢喜，我的舌头快乐；

        甚至我的肉身安然居住在指望中；

        因为祢必不将我的灵魂撇弃在阴间，

        也不容祢的圣者见朽坏。

        祢使我得知生命之路；

        祢必使我在祢面前充满喜乐。」

        （诗篇 15:8-11）'
  - type: paragraph
    text:
      ru: Намащенные борцы были неуловимы для противников, и намащенные заклинатели были предохранены и защищены от зубов змия. Когда намащенный таинственно Духом Своим Христос вступил в борьбу со смертью и подчинился этому губителю, тогда появившийся противник был сокрушен, потому что смерти«невозможно было удержать Его». Потому не было возможно, что найдено было, что Он от Бога рожден, и что Ему чужды были всякие перемены или превращения, и что Он так восстал (воскрес), чтобы более уже не умирать.
      cn: 受膏的斗士令敌人难以捕捉，受膏的驱邪者则蒙保佑与保护，免受毒蛇之牙的伤害。当基督以奥秘的方式受圣灵膏抹，与死亡争战并顺服于这毁灭者时，那出现的对手就被击溃了，因为死亡「不能拘禁祂」。因此，祂不可能再被死亡拘禁，因为所被发现的是：祂是从上帝而生，并且不受任何变化或转化影响，而且祂复活了，以至于不再死亡。
  - type: paragraph
    text:
      ru: 'Далее приводит Давида, превышающего всякий человеческий разум, потому что такого рода дело – пророчество, и говорит:«Ибо Давид говорит о Нем», а не о себе; и опять начинает со стороны смирения. Хотя и совершилось это теперь, но предначертано было издревле: Бог соизволял на это изначально и изначально так предначертал.'
      cn: 接下来，（作者）引用大卫，他超越一切人类理性，因为这种事——即预言——，并且说：「因为大卫论到祂，而非论到自己」；并再次从谦卑的角度开始。尽管此事如今才成就，但它自古就被预定：上帝从一开始就对此予以恩准，并且从一开始就这样预先定下。
  - type: paragraph
    text:
      ru: «Видел я пред собою Господа всегда». Называет Отца Господом Иисуса, потому что Иисус принял вид раба. Если же здесь говорится, что Отец"одесную"Сына, а в других местах говорится, что Сын"одесную"Отца, то этим обозначается их равенство.
      cn: 「我常将上主摆在我面前。」这（句）将父称为耶稣的上主，因为耶稣取了奴仆的形像。若此处言及父在子的「右边」，而他处又言及子在父的「右边」，则此表明了他们的平等。
  - type: paragraph
    text:
      ru: «Даже и плоть моя упокоится в уповании.
      cn: 甚至我的肉身，也将在盼望中安息。
  - type: paragraph
    text:
      ru: Так как Иисус, восприяв смерть, совлек ту плоть, какую принял по плану домостроительства, чтобы снова воскресить ее от смерти, то справедливо, что плоть Его питала себя упованием в ожидании воскресения.
      cn: 既然耶稣承受了死亡，脱去了祂按着救赎的经纶所取用的那具肉身，为要使她再次从死里复活，那么理所当然地，祂的肉身在等候复活中，以盼望滋养着自己。
  - type: paragraph
    text:
      ru: Хотя слова:«Ты не оставишь души моей в аде»некоторые и принимают за слова от лица Давида, не имея, впрочем, возможности доказать свою мысль, однако же они верно и благочестиво говорят, что тело воскресло, чтобы быть нетленным и духовным, так как воскресшая плоть после воскресения есть тело духовное и нетленное.«Путь жизни», то есть тот путь, который души праведников прошли вместе с Искупителем, выходя из преисподних мест. В словах«Ты исполнишь меня радостью пред лицем Твоим»под лицом следует разуметь явление Господа в Божественном образе и призрение на нас, которым Он ближе призрел нас.
      cn: 尽管「祢不将我的灵魂遗弃在阴间」这些话，有些人认为出自达味之口，然而他们无法证明自己的观点，但他们正确且虔敬地论述，肉身复活是为了不朽坏和属灵，因为复活后的血肉是属灵且不朽坏的身体。「生命之路」意指义人的灵魂与救赎主一同走出阴间之地所经过的道路。在「祢必使我在祢面前满有欢欣」这些话中，「面前」应理解为上主以神圣形象的显现，以及祂对我们的眷顾，借此祂更亲近地垂顾了我们。
  - type: paragraph
    text:
      ru: Деян.2:29–31.Мужи братия! да будет позволено с дерзновением сказать вам о праотце Давиде, что он и умер и погребен, и гроб его у нас до сего дня. Будучи же пророком и зная, что Бог с клятвою обещал ему от плода чресл его воздвигнуть Христа во плоти и посадить на престоле его(2Цар. 7, 12;Пс. 131, 11),он прежде сказал о воскресении Христа, что не оставлена душа Его в аде, и плоть Его не видела тления(Пс. 15, 10).
      cn: (使徒行传 2:29-31) 「諸位弟兄們。先祖大衛的事，我可以明明的對你們說；他死了，也葬埋了，並且他的墳墓直到今日還在我們這裏。 大衛既是先知，又曉得　上帝曾向他起誓，要從他的後裔中，按著肉身，要興起　基督坐在他的寶座上； 他預先看明這事，講論　基督復活，說他的元魂不撇在地獄，他的肉身也不見朽壞。


        弟兄们！请容我坦然无惧地对你们说论到先祖大卫的事，他死了，也葬埋了，他的坟墓直到今日还在我们这里。他既是先知，又知道上帝曾向他起誓应许，要从他的后裔中兴起基督，按肉体而生，坐在他的宝座上（撒母耳记下 7:12，诗篇 131:11），就预先论到基督的复活，说祂的灵魂不被撇在阴间，祂的肉身也不见朽坏（诗篇 15:10）。'
  - type: paragraph
    text:
      ru: 'Изложив свидетельство Давида, присовокупляет«мужи братия». Когда намерен сказать что-либо великое, предварительно пользуется этим оборотом воодушевляя их и примиряя. А где не представлялось ничего такого, что могло бы быть вредным, там говорит с большой умеренностью. Если бы таким образом он сказал просто: «Это сказано Давидом», то показался бы суровым и скорее возбудил бы в них гнев, чем соделал бы их послушными. Оказанием же большой чести блаженному Давиду он достигает того, что является удобоприемлемой мысль, что пророчество это сказано о Христе. В таком духе построена и вся эта речь его.'
      cn: 阐明了大卫的见证后，他又加上了「诸位弟兄」。当他打算说些重要的事情时，他预先采用此说法，以此激励他们并使他们彼此和睦。而凡未显现任何可能有害之事时，他便极其谦和地说话。如果他仅仅如此说：「这话是大卫说的」，那他便显得严厉，并且更可能激起他们的愤怒，而非使他们顺服。然而，通过向蒙福的大卫致以崇高敬意，他使得「此预言是论及基督的」这一思想变得易于接受。他这整个讲论也是本着此种精神构筑的。
  - type: paragraph
    text:
      ru: 'Так, сказав, что Давид«и умер и погребен», не сказал: «и не воскрес», но:«и гроб его у нас до сего дня». Это равняется выражению «и не воскрес». Далее не прямо переходит ко Христу, но снова прославляет Давида, и этими прославлениями Давида достигается цель слова, потому что для того и говорится это, чтобы иудеи ради чести, оказываемой ими Давиду, и ради его рода приняли слово о воскресении Христа, так что если бы этого не было (то есть если бы они не приняли слова о воскресении), то и оказали бы пренебрежение к пророчеству, и подорвали бы уважение к себе самим.'
      cn: 这样，说了大卫「既已死，又已埋葬」，却没有说：「又没有复活」，而是说：「他的坟墓在我们这里，直到今日。」这等同于「又没有复活」这句话。接着，他没有直接转到基督身上，而是再次颂扬大卫，藉着这些对大卫的颂扬，话语的目的就达到了；因为这样说，是为了让犹太人为了他们给予大卫的尊荣，并为了他的族裔，接受关于基督复活的话语。这样，如果不是这样的话（也就是说，如果他们不接受关于复活的话语），那么他们就会轻蔑预言，并且也会损害他们自身的尊严。
  - type: paragraph
    text:
      ru: '«Бог с клятвою обещал». Не сказал: «обещал», но:«с клятвою обещал», указывая этим на непреложность обетования.'
      cn: «上帝凭着誓言承诺了》。他没有说「承诺了」，但说「凭着誓言承诺了」，借此指出应许的不可更改性。
  - type: paragraph
    text:
      ru: «Посадить на престоле». Престол употребляется вместо Царства во многих местах Божественного Писания; например:«Престол Твой, Боже, вовек»(Пс. 44, 7).
      cn: 「『坐于宝座之上』」。在神圣经文的许多地方，宝座被用以指代国度；例如：「祢的宝座，上帝，永永远远。」（诗篇 44:7）
  - type: paragraph
    text:
      ru: «Воздвигнуть Христа во плоти». Говорит так потому, что по Божеству Он от века и всегда сидит вместе с Отцом; приписывает же все Отцу, чтобы слушатели легче могли принять то, что говорится.
      cn: «高举基督在肉身中»。祂这样说，是因为按着祂的神性，祂自亘古便与圣父同坐，并永远如此；祂却将一切归于圣父，好让听者能更容易地接受所说的话。
  - type: paragraph
    text:
      ru: Но каким образом Он сидит на престоле Давидовом? Таким, что Он есть Царь и иудеев, и тем более тех, которые распяли Его.
      cn: 但是，祂是怎样坐在大卫的宝座上的呢？如此，就是祂既是犹太人的君王，更是那些将祂钉死在十字架上之人的君王。
  - type: paragraph
    text:
      ru: 'Деян.2:32–36.Сего Иисуса Бог воскресил, чему все мы свидетели. Итак Он, быв вознесен десницею Божиею и приняв от Отца обетование Святаго Духа, излил то, что вы ныне видите и слышите. Ибо Давид не восшел на небеса; но сам говорит: «сказал Господь Господу моему: седиодеснуюМеня, доколе положу врагов Твоих в подножие ног Твоих»(Пс. 109, 1).«Итак твердо знай, весь дом Израилев, что Бог соделал Господом и Христом Сего Иисуса, Которого вы распяли.'
      cn: (使徒行传 2:32-36) 這耶穌，　上帝已經叫他復活了，我們都為這事作見證。 他既被高舉在　上帝的右邊，又從　父受了所應許的　聖靈，就把你們現在所看見所聽見的，澆灌下來。 大衛並沒有升進諸天；但他自己說：『　耶和華對我　主說：你坐在我的右邊， 等我使你仇敵作你的腳凳。』」 「故此，以色列全家當確實的知道，你們釘在十字架上的這位耶穌，　上帝已經立他為　主，為　基督了。」

        上帝使这个耶稣复活了，对此我们所有人都作见证。所以，祂既已被上帝的右手高举，又从父那里领受了圣灵的应许，就将你们现在所看见和听见的倾泻出来。因为大卫并未升到天上，但他自己说：「上主对我的上主说：祢坐在我的右边，等我使祢的仇敌作祢脚下的脚凳。」（诗篇 109:1）所以，全以色列家当确知，你们所钉十字架的这位耶稣，上帝已使祂为主为基督了。'
  - type: paragraph
    text:
      ru: 'Снова указывает на Отца, хотя достаточно было и прежнего указания. Но он знал, как полезно было это для слушателей в деле принятия ими того, что особенно необходимо. Выражением быв"вознесен"Давид указал на вознесение и на то, что Он (Иисус) – на небесах, но и это сначала не ясно. Смотри: в начале слова, когда и пророка Иоиля привел в свидетели, не говорил, что Христос послал Духа Святаго, но говорил, что послал Его Отец. А когда напомнил и о знамениях Христовых, и о том, что сделано было против Христа, и когда с дерзновением высказал истину об Его воскресении, тогда, наконец, говорит уже, что Христос излил Духа Святаго, что, следовательно, пророк о Нем говорил:«И будет в последние дни»(ст. 17).«Обетование»же разумеет или то, которое обещал Сам апостолам, или то, которое обетовал Иисусу Отец прежде креста и страданий. А так как Петр имел сказать великую и высокую истину – что Духа Святаго излил Христос, – то затеняет ее, сказав, что Отец дал Ему это обетование, потому что кто бы что ни говорил, но если слово свое оканчивает без пользы, то говорит напрасно и попусту. Петр показывает также, что крест не только не унизил Иисуса, но придал Ему еще более блеска. Если тогда, по гласу Иоанна:«Он будет крестить вас Духом Святым и огнем»(Мф. 3, 11), – Отец дал Ему обетование, то теперь исполнил обетование.'
      cn: 再次指向父，尽管先前的指明已经足够。但他知道这对听众在领受那尤其必要之事上是何等有益。达味藉着「被高举」的表达，指明了升天，以及祂（耶稣）在天上；但起初这也并不清楚。看哪：在话语的开端，当他甚至引约珥先知为证时，并未说基督差遣了圣灵，却说父差遣了祂。而当他提及基督的诸般神迹，以及那对抗基督所行之事，又当他带着胆量说出关于祂复活的真理时，那时，他最终才说基督倾流了圣灵，因而先知正是论及祂说：「在末后的日子，必有此事发生」（使徒行传 2:17）。而「应许」则指，要么是祂自己应许给使徒们的，要么是父在十字架和苦难之前应许给耶稣的。又因为伯多禄将要说出一个伟大而崇高的真理——即基督倾流了圣灵——他便通过说父将这应许赐给了祂而遮蔽了它，因为无论何人说什么，若他的话语无益地结束，便是徒然空说。伯多禄还表明，十字架不仅没有贬低耶稣，反而使祂更加光辉耀眼。如果那时，依循若望的声音：「祂要用圣灵与火给你们施洗」（马太福音 3:11），父将应许赐给了祂，那么如今祂已成就了这应许。
  - type: paragraph
    text:
      ru: '«Сам говорит: «сказал Господь Господу моему…»Здесь Петр говорит уже без опасения, так как сказанное выше ободрило его. Но какое значение в словах«сказал Господь Господу моему!»Если уже Давид называет Его (Иисуса) Господом, то тем более иудеи не должны отрицать этого.'
      cn: 他自己说：「上主对我主说……」在这里，彼得已经毫无畏惧地说话，因为上面所说的已经鼓励了他。但「上主对我主说！」这些话有什么意义呢？如果连大卫都已经称祂（耶稣）为上主，那么犹太人就更不应该否认这一点。
  - type: paragraph
    text:
      ru: Словами же Давида«доколе положу врагов Твоих в подножие ног Твоих»навел Петр на них страх как средство победить их. А чтобы не подорвать веры в себя, он приписывает все Отцу. После того как сказал о предметах великих, он слово свое снова сводит на дела смирения Иисуса.
      cn: 达味（大卫）的话说：「直到我使祢的仇敌作祢脚下的脚凳」，伯多禄（彼得）就以此使他们心生恐惧，作为征服他们的手段。而为了不损害对自己的信心，他将一切都归于圣父。在讲述了那些伟大的事物之后，他再次将自己的言语引回到耶稣的谦卑之行上。
  - type: paragraph
    text:
      ru: А кто сии враги, это объясняет апостол, взывая:«Последний… враг истребится – смерть, потому что все покорил под ноги Его»(1Кор. 15, 26–27). В словах«седиодеснуюМеня»мы уразумеваем равночестность Отца и Сына, так как понятия «правый» или «левый» немыслимы по отношению к бестелесной сущности.
      cn: 而这些仇敌是谁，使徒呼喊着解释说：「那最后的仇敌，就是死亡，也要被毁灭，因为祂已将万物都放在祂的脚下。」 (哥林多前书 15:26-27) 在「坐在我右边」这些话语中，我们理解为圣父与圣子是同尊的，因为「右边」或「左边」的概念对于无形体的本质来说是不可思议的。
  - type: paragraph
    text:
      ru: «Бог соделал Господом и Христом Сего Иисуса». Выражение"соделал"употреблено вместо «поставил», потому что речь идет не о существовании и не об ипостасности. <…>
      cn: 「上帝使这位耶稣成为主和基督。」词语「соделал」被使用，而非「поставил」，因为这里所谈论的并非关乎祂的存在，也非关乎祂的位格。
  - type: paragraph
    text:
      ru: 'Деян.2:37–40.Услышав это, они умилились сердцем и сказали Петру и прочим Апостолам: что нам делать, мужи братия? Петр же сказал им: покайтесь, и да крестится каждый из вас во имя Иисуса Христа для прощения грехов; и получите дар Святаго Духа. Ибо вам принадлежит обетование и детям вашим и всем дальним, кого ни призовет Господь Бог наш. И другими многими словами он свидетельствовал и увещевал, говоря: спасайтесь от рода сего развращенного.'
      cn: (使徒行传 2:37-40) 眾人聽見這話，覺得扎心，就對彼得和其餘的使徒說：「諸位弟兄們，我們當怎樣行？」 彼得說：「你們各人要悔改，奉耶穌　基督的名受浸，叫你們的罪得赦，就必領受所賜的　聖靈； 因為這應許是給你們和你們的兒女，並一切在遠方的人，就是凡　主─我們　上帝所召來的。」 彼得還用許多話作見證，勸勉他們說：「你們當救自己脫離這彎曲的世代。」


        听了这话，他们心里扎心，就对彼得和其余的使徒说：「弟兄们，我们当怎样行？」


        彼得对他们说：「你们当悔改，并且你们各人要奉耶稣基督的名受洗，使罪得赦；你们就必领受圣灵的恩赐。因为这应许是给你们的，也是给你们的儿女，并给一切在远方的人，就是上主我们的上帝所要召来的。」


        彼得还用许多别的话作见证，劝勉他们说：「你们当救自己脱离这弯曲悖谬的世代。」'
  - type: paragraph
    text:
      ru: 'Видишь, сколько благоснисхождения и как оно более, чем суровость, способно проникать в сердца людей и смягчать их. Хотя блаженный Петр и напоминает им в этом месте об их дерзновениях, но напоминает кротко, не прибавляя ничего оскорбительного для них. Устыдились благоснисхождения Петрова, то есть того, что с ними, предавшими смерти Самого Господа, поднимавшими руки на апостолов и желавшими истребить их, Петр говорил с заботливостью, как отец и учитель.«Умилились», говорится: не просто убедились, но познав себя, потому что говорят:«что нам делать, мужи братия?»– как бы недоумевая и беспокоясь за свои дерзновения. Кого прежде называли обманщиками, тех называют теперь братьями и при этом не дерзают употреблять этого названия перед лицом тех, кого так называют, но желают заявить через это свою любовь и то, как сильно иудеи стали расположены к апостолам. Поэтому, как показывает начало речи Петровой, и сами апостолы называли их этим именем.'
      cn: 你看，这是何等的宽容与俯就，它比严厉更能穿透人心，并使其软化。尽管蒙福的彼得在此处提醒他们关于他们的僭妄，但他提醒得温和，没有加添任何冒犯他们的话。他们因彼得的宽容与俯就而感到羞愧，也就是说，尽管他们曾将上主亲身置于死地，对使徒们举手相向，并意欲消灭他们，彼得却以父亲和教师般的关怀与他们交谈。经文说：「他们心被扎，并非仅仅信服，而是认识了自己，因为他们说：「弟兄们，我们当怎样行？」——仿佛困惑不解，并为他们的僭妄而忧虑。那些先前被他们称为骗子的人，如今被他们称为弟兄，而且他们并不敢在那些被如此称呼的人面前使用这个称呼，而是希望通过此举表达他们的爱，以及犹太人对使徒们是多么亲近。因此，正如彼得讲道的开篇所表明的，使徒们自己也曾以这个名称称呼他们。
  - type: paragraph
    text:
      ru: Хотя вопрос был предложен всем апостолам, однако же снова отвечает"Петр", – так как сами апостолы предпочитали его уста, – и говорит:«покайтесь, и да крестится каждый из вас во имя Иисуса Христа». Слова эти не противоречат следующим словам Евангелия:«Крестя их во имя Отца и Сына и Святаго Духа»(Мф. 28, 19), потому чтоЦерковьисповедует Святую Троицу нераздельной, так что, вследствие единства трех ипостасей по существу, крещаемый во имя Христа крещается в Троицу, так как Отец и Сын и Святый Дух нераздельны по существу. Если бы имя Отца было не Бог и имя Сына – не Бог, и имя Святаго Духа – не Бог, то следовало бы сказать «во имя Бога Иисуса Христа», или даже просто – только «в Сына». Но Петр говорит во«имя Иисуса Христа», зная, что имя Иисуса есть Бог, равно как и имя Отца, и имя Святаго Духа.
      cn: 尽管问题是向众使徒提出的，彼得却再次回答——因为众使徒本身更偏爱由他发言——并说：「你们各人当悔改，奉耶稣基督的名受洗。」这些话语与福音书中的下列话语并不矛盾：「奉父、子、圣灵的名给他们施洗」（马太福音 28:19），因为教会宣认圣三位一体是不可分离的，因此，由于三位位格在本性上的合一，奉基督之名受洗者即是在受洗归入三位一体，因为父、子和圣灵在本性上是不可分离的。如果父的名不是上帝，子的名不是上帝，圣灵的名也不是上帝，那么就应该说「奉上帝耶稣基督的名」，甚至仅仅说「归入子」就行了。但彼得说「奉耶稣基督的名」，因为他知道耶稣的名就是上帝，正如父的名也是上帝，圣灵的名也是上帝一样。
  - type: paragraph
    text:
      ru: '«И получите дар Святаго Духа». Заметь: Петр показал, что дар Христов и дар Святаго Духа – один и тот же дар, так как одно и то же и достоинство их. Беседуя выше, он назвал этот дар обетованием, которое«вам принадлежит… и детям вашим», потому что дар ценнее, когда блага переходят и к наследникам,«и всем дальним». Если же этот дар – для дальних, то тем более – для вас, близких. Обрати внимание на то, когда указал иудеям на призвание язычников, сказав:"и дальним". Когда? Тогда, когда нашел их умилившимися и познавшими себя. Когда душа осуждает себя саму, тогда она уже не может завидовать.'
      cn: 「并要领受圣灵的恩赐。」请注意：彼得指出，基督的恩赐与圣灵的恩赐是同一个恩赐，因为它们的尊荣是同一的。在上文中谈论时，他称这恩赐为「应许」，这「应许属于你们……和你们的儿女」，因为当福泽也传承给继承人时，恩赐便更显宝贵，「并属于所有远方的人」。若这恩赐是给远方的人，那就更不用说——是给你们这些近处的人了。请注意，彼得是在何时向犹太人指出对外邦人的召叫，说：「并属于远方的人」。何时呢？那时，他发现他们已悔悟并认识了自己。当灵魂谴责自身时，它便不再能嫉妒。
  - type: paragraph
    text:
      ru: Деян.2:41–47.Итак охотно принявшие слово его крестились, и присоединилось в тот день душ около трех тысяч. И они постоянно пребывали в учении Апостолов, в общении и преломлении хлеба и в молитвах. Был же страх на всякой душе; и много чудес и знамений совершилось через Апостолов в Иерусалиме. Все же верующие были вместе и имели всё общее. И продавали имения и всякую собственность, и разделяли всем, смотря по нужде каждого. И каждый день единодушно пребывали в храме и, преломляя по домам хлеб, принимали пищу в веселии и простоте сердца, хваля Бога и находясь в любви у всего народа. Господь же ежедневно прилагал спасаемых к Церкви.
      cn: (使徒行传 2:41-47) 於是歡喜領受他話的人就受了浸。那一天，門徒約添了三千人。 都恆心遵守使徒的道理，彼此相交，擘餅，祈禱。 眾人都懼怕；使徒又行了許多奇事神蹟。 信的人都在一處，凡物公用； 並且賣了田產，家業，照各人所需用的分給各人。 他們天天同心合意恆切的在殿裏，且在家中擘餅，存著歡喜、誠實的心用飯， 讚美　上帝，得眾百姓的喜愛。　主將得救的人天天加給教會。


        于是，那些欣然领受他话语的人都受了洗，那一天约有三千灵魂归入。他们恒常遵守使徒的教训，团契相通，擘饼聚餐，并恒切祷告。敬畏之心临到各人；使徒们在耶路撒冷行了许多奇迹与神迹。凡信者都聚在一处，凡物公用。他们变卖产业和一切所有，照各人所需用的分给众人。他们每日同心合意恒常在圣殿，又挨家挨户擘饼，存着欢喜和诚朴的心领受食物，赞美上帝，蒙全体民众的喜爱。上主每日将得救者加添给教会。'
  - type: paragraph
    text:
      ru: Здесь исполнение пророчества, в котором говорится:«кто слыхал таковое? кто видал подобное этому? возникала ли страна в один день? рождался ли народ в один раз, как Сион, едва начав родами мучиться, родил сынов своих?»(Ис. 66, 8).
      cn: 这是预言的应验，其中说：「谁曾听闻此事？谁曾见过类似之景？岂有一国一日而生？岂有一族一时而诞，如同锡安，才经产难，就生下众子？」(以赛亚书 66:8)
  - type: paragraph
    text:
      ru: «Был… страх на всякой душе», потому что не пренебрегали происходившим, как бы чем-либо случайным. Так как Петр был преисполнен обильной благодатью и открывал обетования и будущее, то очень естественно, что они были объяты страхом, тем более что свои слова он подтверждал и совершаемыми чудесами, и знамениями. Как при Христе прежде – знамения, потом – учение, потом – чудеса, так и теперь.
      cn: 「……恐惧临到各人的灵魂上，」因为他们没有轻视所发生的一切，仿佛是某种偶然之事。因为彼得被丰盛的恩典所充满，并揭示着应许和未来，所以他们被恐惧笼罩是非常自然的，更何况他所说的话也由所行的神迹和异兆所证实。正如基督在世时，首先是异兆，然后是教导，然后是神迹，如今也是如此。
  - type: paragraph
    text:
      ru: '«Все… верующие были вместе», то есть не по месту, но по расположению и по мыслям, по постоянному согласию между собой и по любви. А слова«смотря по нужде каждого»употребляет не просто, но в смысле «экономии», потому что это выражение показывает, что апостолы поступали не так, как у эллинов мудрецы, из которых одни оставили свои поля, другие побросали в море много золота. Но это было не презрение богатства, а глупость и безумие: диавол постарался очернить творения Божии. Благоразумно пользоваться богатством – не пустая вещь.'
      cn: 「凡……信徒都在一处」，即不是按着地方，而是按着心志和思想，按着彼此间恒常的合一与爱。而「照各人的需要」这些话，并非随便使用，而是按着「安排」的意思，因为这句话表明使徒们行事，并非如希腊人的智者那般，其中有些人离弃自己的田地，有些人将许多黄金扔入海中。但这并非轻蔑财富，而是愚蠢和疯狂：魔鬼试图玷污上帝的创造。明智地使用财富，并非无益之事。
  - type: paragraph
    text:
      ru: '«Каждый день единодушно пребывали в храме». Не один день или два, или три, но ежедневно и единодушно, как бы в одной душе. Замечай: уверовавшие иудеи ничего другого не делали, только постоянно пребывали в храме, так как, став внимательнее к истинной вере, они исполнились большого благоговения и к этому священному месту. И апостолы не отвлекали их оттуда, чтобы не повредить им.'
      cn: 「每日同心合意地常在圣殿里。」不只是一两天，或三两天，而是每日且同心合意地，仿佛一个灵魂。请注意：信主的犹太人什么别的都没做，只是不住地常在圣殿里，因为他们对真信仰更上心后，也对这神圣之地充满了极大的敬畏。众使徒也没有把他们从那里引开，以免伤害他们。
  - type: paragraph
    text:
      ru: «Преломляя по домам хлеб». Дом священный разумеет и теперь, потому что ели они в этом доме. А выражение«преломляя… хлеб»показывает их великое воздержание и умеренность в пище, потому что«принимали пищу»говорится, а не «пресыщались пищей». Таким образом, по вере они и самую жизнь свою изменяли к лучшему. А каким же образом они имели благодать у всех людей? Лука говорит:«находясь в любви у всего народа». Как же это? Своими действиями – милостыней и чистотой обращения. Священники по ненависти и зависти отступили от них и нападали на них, но у народа они имели любовь.
      cn: 「在家中擘饼」。这里所说的「家」，乃是指神圣的家，即使在如今也是如此，因为他们是在这个家中进食。而「擘……饼」这个表达方式，表明了他们在饮食上的极大节制和适度，因为经文说他们「领受食物」，而不是「饱食过度」。如此，他们凭着信心，将自己的生命也改变得更美好。那么，他们是如何得到所有人的恩宠呢？路加说：「在全体百姓中得到爱戴。」这又是如何呢？是借着他们的行为——施舍和纯洁的品行。众祭司因着仇恨和嫉妒而疏远他们并攻击他们，但在百姓中他们却得到爱戴。
- type: heading1
  text:
    ru: Глава третья
    cn: 第三章
  children:
  - type: paragraph
    text:
      ru: 'Деян.:1–7.Петр и Иоанн шли вместе в храм в час молитвы девятый. И был человек, хромой от чрева матери его, которого носили и сажали каждый день при дверях храма, называемых Красными, просить милостыни у входящих в храм. Он, увидев Петра и Иоанна перед входом в храм, просил у них милостыни. Петр с Иоанном, всмотревшись в него, сказали: взгляни на нас. И он пристально смотрел на них, надеясь получить от них что-нибудь. Но Петр сказал: серебра и золота нет у меня; а что имею, то даю тебе: во имя Иисуса Христа Назорея встань и ходи. И, взяв его за правую руку, поднял.'
      cn: '（使徒行传 3:1-7）


        彼得和约翰一同上圣殿，在申初献祭的时候。


        有一个人，生来是瘸腿的，每天被人抬来，放在圣殿的门口，称为「美门」的，向进圣殿的人求施舍。


        他看见彼得和约翰将要进圣殿，就求他们施舍。


        彼得和约翰定睛看他，说：「你看我们。」


        那人就留意看他们，指望从他们得着什么。


        彼得说：「金银我都没有，我所有的，给你：奉拿撒勒人耶稣基督的名，起来行走罢！」


        于是拉着他的右手，扶他起来。'
  - type: paragraph
    text:
      ru: 'Эти два апостола всюду показаны как имеющие большое единодушие: Петр делает знак Иоанну (см.Ин. 13, 24); оба вместе пришли ко гробу (см.Ин. 20, 3). К слову сказать, писавший эту книгу опускает прочие знамения, а об этом знамении, как таком, которое подействовало на всех, говорит. А«шли… в храм»зачем? Ужели они жили еще по-иудейски? Этого быть не могло. Они поступали так, приспособляясь к народу и считая это делом полезным. Смотри, как постоянно пребывали они на молитве и в девятом часу молились вместе. Точное же упоминание и о месте, и о времени Лука делает, чтобы дать отчет в том, что он описывает. Если так, то как же не называет он имени хромого? Это потому, что апостолы и не знали его имени, так как человек этот вовсе был неизвестен им. А быть может, потому, чтобы не показалось, что они делают исцеления в знак признательности (благодарности) и по пристрастию. Или чтобы никто даже из самых наглых людей не мог подозревать их в обмане, подозревать, будто из благодарности к апостолам некоторые из их знакомых придумывали исцеления, которые будто бы совершены были над ними самими. Но как они не узнали имени хромого после его исцеления? Это потому, что у них не было времени заниматься тем, что не приносит никакой пользы. А мне кажется, что и многие не знали имени этого человека и называли его, по характеру его болезни, просто хромым, потому что болезнь его была так замечательна и так известна, что когда кто слышал упоминание о хромом, то, несмотря на то, что, быть может, были и другие хромые, тотчас воображал этого хромого. Но откуда они знали, что он«хромой от чрева матери?»Из всеобщей молвы, по общему всех свидетельству, так как его все знали вследствие постоянного пребывания при храме. Но апостолы могли узнать об этом и от него самого, по исцелении его. Почему его не приводили для исцеления ко Христу? Быть может, некоторые из усердных посетителей храма не верили в исцеления Христовы. Они не подвели его и к апостолам, несмотря на то, что видели, как они входили, и, конечно, знали, какие чудеса они совершали.'
      cn: 这两位使徒处处都显出有极大的同心合意：彼得向约翰示意（参阅 约翰福音 13:24）；二人一同到了坟墓那里（参阅 约翰福音 20:3）。顺便说一句，撰写此书者省略了其他神迹，而对于这个神迹，他则提及了，因为它对所有人都产生了影响。那么，「他们去了……圣殿」是为了什么呢？难道他们仍然按照犹太人的方式生活吗？这不可能是真的。他们这样做是为了适应民众，并认为这是有益处的。看哪，他们是如何恒常地留在祷告中，并在第九时辰一同祷告的。而路加精准地提及地点和时间，是为了对他所记述之事作出交代。既然如此，他为什么不提跛子的名字呢？这是因为使徒们也不知道他的名字，因为这个人对他们来说完全是陌生的。或者，也许是为了免得显得他们所行的医治是出于感谢和偏爱。或者，为了使哪怕是最厚颜无耻的人也无法怀疑他们是在欺骗，无法怀疑说，仿佛是出于对使徒们的感谢，他们的一些熟人编造了医治事件，这些医治似乎是发生在他们自己身上的。但他们怎会在他被医治之后，仍然不知道跛子的名字呢？这是因为他们没有时间去处理那些毫无益处的事情。而在我看来，许多人也不知道这个人的名字，只是根据他病情的特点称他为跛子，因为他的病情是如此引人注目和众所周知，以至于当有人听到提及跛子时，尽管可能还有其他的跛子，也会立刻想到这位跛子。但他们如何知道他是「从母腹里就瘸腿的」呢？是从普遍的传闻中，根据所有人的共同见证，因为他因长期待在圣殿旁而广为人知。但使徒们也可能在他被医治之后，从他本人那里得知此事。为什么没有人带他到基督那里求医治呢？也许圣殿里一些热心的访客不相信基督所行的医治。他们也没有把他带到使徒们那里，尽管他们看到使徒们进来，而且当然也知道他们行了哪些神迹。
  - type: paragraph
    text:
      ru: '«Серебра и золота нет у меня». Не сказал «нет при себе», как обыкновенно мы говорим, но сказал «вовсе не имею». Смотри: Иоанн всюду молчит, а Петр говорит и за него. Итак, что же? Не имея серебра, ты оставляешь без всякого внимания твоего просителя? Нет.«Что имею, то даю тебе»говорит Петр. Так поступал и Христос, исцеляя больных часто одним словом, а часто, когда Он окружаем был людьми очень немощными по вере, и прикосновением, чтобы не показалось, что совершившееся исцеление произошло само собой.'
      cn: '「『我没有金银。』」

        他没有说「我身上没有」，像我们平常所说的那样，而是说「我丝毫没有」。看哪，约翰处处保持沉默，而彼得也替他说话。那么，又如何呢？没有银子，你难道就置你的求助者于不顾了吗？不。彼得说：「『我有什么，就给你什么。』」基督也是这样行事，医治病人时，常常只用一句话；而有时，当祂被那些信心非常软弱的人围绕时，祂也用触摸，以免显得所成就的医治是自行发生的。'
  - type: paragraph
    text:
      ru: «И, взяв его за правую руку, поднял». Этот способ исцеления указывал на воскресение, так как был образом воскресения.
      cn: 「他便拉着他的右手，扶他起来。」这种医治的方式指向复活，因为它乃是复活的表征。
  - type: paragraph
    text:
      ru: Деян.3:7–10.И вдруг укрепились его ступни и колени. И, вскочив, стал, и начал ходить, и вошел с ними в храм, ходя и скача, и хваля Бога. И весь народ видел его ходящим и хвалящим Бога; и узнали его, что это был тот, который сидел у Красных дверей храма для милостыни; и исполнились ужаса и изумления от случившегося с ним.
      cn: (使徒行传 3:7-10) 於是拉著他的右手，扶他起來；他的腳和踝子骨立刻健壯了， 就跳起來，站著，又行走，同他們進了殿，走著，跳著，讚美　上帝。 百姓都看見他行走，讚美　上帝； 認得他是那素常坐在殿的美門口求賙濟的，就因他所遇著的事滿心希奇、驚訝。

        忽然，他的脚和膝盖得了力量。他就跳起来，站着，开始行走，并和他们一同进了殿，边走边跳，赞美上帝。所有的百姓都看见他又走又赞美上帝；他们也认出他，就是那素常坐在殿的红门乞求施舍的人；他们就因着发生在他身上的事，充满了惊奇和诧异。'
  - type: paragraph
    text:
      ru: '«Ходя и скача», то есть испытывая себя и как можно более удостоверяясь, действительно ли стал здоров. Так как исцеление было необычайно и сверх ожидания, то естественно было и самому ему сомневаться относительно себя же самого. А иные говорят, что он и не умел ходить, поэтому и передвигал ногами как бы прискакивая. Смотри: он не успокаивается. Это частью от удовольствия, частью чтобы заградить уста и воспрепятствовать счесть это исцеление за обман. Скакал для того, чтобы в конце концов не оставалось никого, кто не знал бы об этом факте. По своему же расположению и по своей восторженной любви к апостолам Петру и Иоанну, а может быть, и по чувству благодарности к ним или из желания доставить им больше удовольствия, он не отлучался от них. Что же касается того, что чудо это совершилось в храме, так это для большей пользы и спасительности.'
      cn: «边走边跳»，即是说，他在试验自己，并尽可能地确信自己是否真的康复了。鉴于此次痊愈非同寻常，且出乎意料，他自己对自己产生怀疑也是很自然的。另有一些人说，他甚至都不会走路，所以他移动双腿时就像是跳跃着。看哪！他不停歇。这其中一部分是出于欢喜，一部分是为了堵住众人的口，防止他们将这次痊愈看作是欺骗。他跳跃是为了最终没有一人不知道这个事实。按照他自己的性情，以及他对使徒彼得和约翰那份热情洋溢的爱，也许还是出于对他们的感恩之情，或是出于想要给他们带来更多喜乐的心愿，他没有与他们分开。至于这个神迹是在圣殿中发生的，这乃是为了更大的益处与救恩。
  - type: paragraph
    text:
      ru: 'Деян.3:11–16.И как исцеленный хромой не отходил от Петра и Иоанна, то весь народ в изумлении сбежался к ним в притвор, называемый Соломонов. Увидев это, Петр сказал народу: мужи Израильские! что дивитесь сему, или что смотрите на нас, как будто бы мы своею силою или благочестием сделали то, что он ходит? Бог Авраама и Исаака и Иакова, Бог отцов наших, прославил Сына Своего Иисуса, Которого вы предали и от Которого отреклись перед лицом Пилата, когда он полагал освободить Его. Но вы от Святаго и Праведного отреклись, и просили даровать вам человека убийцу; а Начальника жизни убили. Сего Бог воскресил из мертвых, чему мы свидетели. И ради веры во имя Его, имя Его укрепило сего, которого вы видите и знаете, и вера, которая от Него, даровала ему исцеление сие перед вами.'
      cn: (使徒行传 3:11-16) 那被治好的瘸子正在稱為所羅門的廊下，拉著彼得、約翰；眾百姓一齊跑到他們那裏，很覺希奇。 彼得看見，就回答百姓說：「以色列人哪，你們為甚麼把這事當作希奇呢？為甚麼如此注看我們，以為我們憑自己的能力和虔誠使這人行走呢？ 亞伯拉罕、以撒、雅各的　上帝，就是我們列祖的　上帝，已經榮耀了他的　兒子耶穌；你們卻把他交付彼拉多。彼拉多定意要釋放他，你們竟在彼拉多面前棄絕了他。 你們棄絕了那　聖者、那　義者，反求著釋放一個兇手給你們。 你們殺了那生命之　君，　上帝卻叫他從死裏復活了；我們都是為這事作見證。 我們因信他的名，他的名便叫你們所看見所認識的這人健壯了；正是他所賜的信心，叫這人在你們眾人面前全然好了。


        当那得医治的瘸子不离开彼得和约翰时，全体百姓就都惊异地涌到他们那里，到那称为所罗门的廊下。彼得看见了，就对百姓说：「以色列人哪！你们为什么对这事感到惊奇呢？又为什么看着我们，好像我们是凭自己的能力或虔诚使他行走呢？亚伯拉罕、以撒、雅各的上帝，我们列祖的上帝，荣耀了祂的儿子耶稣，就是你们所出卖的，又在彼拉多面前背弃的；彼拉多本有意释放祂。可是你们却背弃了那圣者和义者，竟求赐给你们一个杀人犯；反而杀了生命的元首。这位，上帝却使祂从死里复活了，我们就是这事的见证人。又因着对祂名的信心，祂的名坚固了你们所看见所认识的这人；并且那从祂而来的信心，在你们众人面前赐给了他这完全的医治。」'
  - type: paragraph
    text:
      ru: Что значит выражение«исцеленный хромой не отходил от Петра и Иоанна!»То, что он боялся отставать от них, так как думал, что он до тех пор будет свободен от своего недуга, пока будет держаться и касаться их. В особенности же думал так потому, что Петр исцелил его, взяв за руку и подняв его. А в притворе случилось это потому, что один только этот притвор остался от храма Соломонова, так как Навуходоносор разрушил здание и возобновил его Кир Персидский.
      cn: 这个说法「被医治的瘸子不离开彼得和约翰！」是什么意思呢？意思是，他害怕离开他们，因为他以为，只要他一直依附并触摸着他们，他就能一直免于自己的病症。他之所以特别这么想，是因为彼得拉着他的手，扶他起来，医治了他。这事发生在廊下，是因为这是所罗门圣殿唯一留存的廊下部分，因为尼布甲尼撒摧毁了那座建筑，后来波斯王居鲁士又将其重建。
  - type: paragraph
    text:
      ru: «Мужи Израильские! что дивитесь сему.
      cn: 以色列人哪！你们为什么对此感到惊奇呢？
  - type: paragraph
    text:
      ru: Эта речь к народу исполнена большего дерзновения, чем прежняя, не потому, чтобы в прежней он боялся говорить смело, но потому, что тогда иудеи как люди лукавившие и дерзкие не могли еще вынести такого тона. Поэтому, начиная прежнюю речь, он в самом начале ее располагает их к вниманию следующими словами:«Сие да будет вам известно, и внимайте словам моим»(Деян. 2, 14). А здесь он не нуждается уже в таких оборотах, так как иудеи не выходили уже из себя, но внимание всех их обращается на знамение и они исполнились страха и изумления. Смотри, как он уклоняется говорить о славе самих апостолов, потому что ничто так не полезно для слушателей, как то, чтобы говорящий не только не говорил бы ничего о своем величии, но запрещал бы и всякому другому говорить об этом. Итак, презрев славу, какой могли достигнуть у людей, апостолы еще более прославили себя, показав людям, что то, что случилось, было делом не человеческим, но Божеским.
      cn: 这篇对民众的讲论，比先前的更充满胆量，并非因为在先前的讲论中他不敢大胆发言，而是因为那时犹太人作为诡诈又刚硬之人，还不能承受那样的语气。因此，当他开始先前的讲论时，他在讲论的开头，用以下的话语使他们留心：「这事你们当知道，也当留心听我的话。」（使徒行传 2:14）而在这里，他已不再需要那样的言辞技巧，因为犹太人已不再激动失态，而是他们所有人的注意力都集中在神迹上，并且他们充满了恐惧和惊奇。看啊，他如何避免谈及使徒们自身的荣耀，因为没有什么比这更能有益于听众的了，即，让讲者不只不谈及自己的伟大，而且也禁止任何其他人谈论此事。因此，使徒们轻看他们可能在人面前获得的荣耀，更是荣耀了他们自己，向世人表明，所发生之事并非人的作为，而是上帝的作为。
  - type: paragraph
    text:
      ru: «Бог отцов наших… прославил Сына Своего Иисуса». Все еще придерживается в речи сторон уничижения Христова, однако же дерзость иудеев выставляет на вид, а не затеняет, как прежде. Делает же это более из желания подействовать на них; и последнее достигалось тем более, чем более Петр обнаруживал их виновность.
      cn: 「我们列祖的上帝……荣耀了祂的儿子耶稣。」他仍旧在言语中持守基督的降卑受辱，然而却将犹太人的胆大妄为显露出来，而非像以前那样遮掩。他这样做，更多是出于希望触动他们；而后者越发能够达成，彼得越是显明他们的罪责。
  - type: paragraph
    text:
      ru: «Которого вы предали и от Которого отреклись перед лицом Пилата, когда он полагал освободить Его».
      cn: 你们所出卖、又在彼拉多面前弃绝的祂，当时彼拉多原有意释放祂。
  - type: paragraph
    text:
      ru: 'Два обвинения на иудеев: одно состоит в том, что Пилат, родом эллин, – человек, не видевший ни одного знамения и не знавший ни одного из пророков, хотел отпустить Иисуса, а другое – в том, чтовы,по происхождению иудеи, – народ, воспитанный среди знамений и посвященный в пророчества о Христе, вы не хотели отпустить Его, тогда как хотел этого Пилат.'
      cn: 两个对犹太人的指控：其一，彼拉多，一个希腊裔之人——一个未曾见过任何神迹，也不认识任何先知的人——却想释放耶稣；其二，你们，按着出身是犹太人——一个在神迹中受教养、并熟悉关于基督的预言的民族——你们却不愿释放祂，而彼拉多却想这样做。
  - type: paragraph
    text:
      ru: «От Святаго и Праведного отреклись, и просили даровать вам человека убийцу».
      cn: 「你们弃绝了圣者和义者，又求把一个杀人犯赐给你们。」
  - type: paragraph
    text:
      ru: Сказав же, что вместо Христа иудеи испросили разбойника, Петр объяснил дело вполне, потому что этим доказывается, что они имели возможность отпустить Его. Если уже они отпустили разбойника, то тем более могли отпустить мужа неповинного. А они освободили злодея и убили благодетеля, так как убили«Начальника жизни». Если же Он – Начальник жизни, то, как имеющий жизнь в Себе Самом и как Виновник жизни, Он воскресил Себя Сам,«чему мы свидетели». Более не прибегает уже к пророчеству, но так как ему уже доверяли, то приводит в свидетели лик апостолов:"чему", говорит,«мы свидетели».
      cn: 彼得说，犹太人竟求释放强盗以替代基督，他便将这事彻底解释清楚，因为这证明了他们原可以释放祂。既然他们已经释放了强盗，就更可以释放那无辜之人。然而他们却释放了作恶之人，却杀了那赐福者，因为他们杀了「生命的君王」。既然祂是生命的君王，那么，作为生命在祂自己之内者，并且作为生命的肇始者，祂就必是自己复活，「我们就是这事的见证」。彼得不再引用预言，但因人们已经信任他，他便引使徒团作证：「我们就是这事的见证。」
  - type: paragraph
    text:
      ru: '«Ради веры во имя Его, имя Его укрепило сего». Говорит так, потому что исцеленный уверовал вследствие исцеления. Значит ли это, что хромой твердо стал на ноги, уверовав во имя Христово? Еще прежде, чем он уверовал, имя Христово, быв призвано, уже"укрепило"его. Такую великую имеет оно силу и столько источает благодатных даров.«И вера, которая от Него». А что это за вера, Господь Сам объясняет так:«Да знают Тебя, единого истинного Бога, и посланного Тобою Иисуса Христа»(Ин. 17, 3). Чтобы не сказал кто-нибудь: «Если таким образом одно призвание"укрепило"хромого, то исцеление не менее скоро последует, хотя бы и неверный призвал имя Его и хотя бы призвал это имя для исцеления человека также неверующего», – итак, чтобы не сказал кто-нибудь этого, Петр прибавил:«и вера, которая от Него». То есть хотя велико и страшно имя это и хотя оно источает исцеления, но для этого нужно, чтобы души исцеляемых были достойны такой милости и чтобы молитвенники, предстательствующие за них, были способны умилостивить Дарователя исцелений, потому что если испрашивающий исцеления намерен оставаться неверным, то исцеление ни в каком случае не последует так легко и имя это никак не сделает своего дела, если призывается неверными: сыны Скевы не только другим не принесли пользы, но и себе повредили (см.Деян. 19, 13–16).'
      cn: '「「因着信靠祂的名，祂的名使此人强健了。」」如此说，是因为被医治之人因着医治而相信了。这是否意味着，瘸子是因着信靠基督之名才坚定地站了起来呢？甚至在他相信之前，基督之名一经被呼求，就已经「使他强健了」。它拥有如此巨大的力量，并倾泻出如此多的恩典之恩赐。


        「「以及那出于祂的信。」」至于这信是什么，上主祂自己如此解释说：「「使他们认识祢，独一的真上帝，以及祢所差遣的耶稣基督」」（约翰福音 17:3）。以免有人会说：「如果如此，单单呼求就能『使瘸子强健』，那么医治也会同样迅速地发生，即使不信者呼求祂的名，即使是为了医治一个同样不信的人而呼求这个名。」——所以，为免有人会如此说，彼得补充道：「「以及那出于祂的信。」」也就是说，尽管这个名是伟大且可畏的，尽管它倾泻出医治，但为此需要被医治之人的灵魂配得上这样的慈悲，以及那些为他们代祷的祷告者能够使赐予医治者施恩。因为如果求取医治者意欲继续不信，那么医治绝不会轻易发生；如果被不信者呼求，这个名也绝不会成就其功用：士基瓦的儿子们不仅未能使他人得益，反而伤及自身（参阅使徒行传 19:13-16）。'
  - type: paragraph
    text:
      ru: Деян.3:17–18.Впрочем я знаю, братия, что вы, как и начальники ваши, сделали это по неведению. Бог же, как предвозвестил устами всех Своих пророков пострадать Христу, так и исполнил.
      cn: (使徒行传 3:17-18) 弟兄們，我曉得你們作這事是出於不知，你們的官長也是如此。 但　上帝曾藉眾先知的口，預言　基督將要受害，就這樣應驗了。

        然而我知道，弟兄们，你们和你们的官长，都是因无知而做了这事。但上帝，正如祂藉着所有祂的先知之口预言基督将要受苦，祂也照样成就了。'
  - type: paragraph
    text:
      ru: 'Так как Петр сильно укорил иудеев, то снова смягчает речь свою, чтобы дать им возможность одуматься; и в оправдание их соизволил выставить два обстоятельства: одно – их незнание, другое – то, что все сказанное им было возвещено прежде. Но как же Петр не приводит о распятии Иисуса свидетельства из Писания? Впрочем, он и выше говорит, что«по определенному совету и предвестию Божию преданного… взяли»(Деян. 2, 23), и теперь излагает то же, только пространнее, говоря:«Бог… как предвозвестил устами всех Своих пророков». Прямого же свидетельства не приводит потому, что вместе с объявлением иудеям обвинений и наказания высказаны им и все свидетельства, как, например:«Ему назначали гроб со злодеями, но Он погребен у богатого»(Ис. 53, 9). А в утешение их говорится, что они сделали это по«неведению; Бог же… так и исполнил». Это в то же время ответ и на слова всех иудеев, на слова, которые они в поношение Его говорили даже при кресте:«Пусть теперь Бог избавит Его [Иисуса], если Он угоден Ему»(Мф. 27, 43), и:«Если Ты Сын Божий, сойди с креста»(Мф. 27, 40) и тому подобное. Одного только Петр не говорил им: «Неразумные, это были пустые слова, потому что если так должно было быть и если все пророки свидетельствуют об этом, то очевидно, что это распятие случилось не по бессилию Христову, а скорее по неизреченному могуществу и премногой власти и по бесконечному Его человеколюбию».'
      cn: 由于彼得严厉地斥责了犹太人，他便再次缓和自己的言语，以便给他们反省的机会；并乐意提出两个情况来为他们开脱：其一，他们的无知；其二，他所说的一切都已预先宣示。但彼得为何没有引用有关耶稣被钉十字架的经文见证呢？然而，他上面也说过：「按着上帝既定的谋略和预知，祂被交与……并被拿走」（使徒行传 2:23），而现在他只是更详细地阐述了同样的事情，说道：「上帝……正如祂借着祂所有先知的口所预先宣告的」。之所以没有引用直接的见证，是因为在向犹太人宣布指控和惩罚的同时，也向他们宣示了所有的见证，例如：「祂与恶人同分一墓，但他却被葬于富者之家」（以赛亚书 53:9）。而为了安慰他们，说道他们是因「无知」而做了这件事；「上帝……却就这样成就了」。这同时也是对所有犹太人的言语的回应，对他们甚至在十字架旁辱骂祂时所说的那些话语的回应：「祂若蒙祂喜悦，现在就让上帝救祂[耶稣]吧」（马太福音 27:43），以及：「祢若是上帝之子，就从十字架上下来吧」（马太福音 27:40）以及诸如此类的话。彼得只是没有对他们说：「你们这些无知的人，这些都是空话，因为如果事情本应如此发生，并且所有的先知都为此作证，那么显然，这次钉十字架并非由于基督的软弱无力，而更是出于祂那不可言喻的大能、至高的权柄以及无限的仁爱。」
  - type: paragraph
    text:
      ru: Деян.3:19–21.Итак покайтесь и обратитесь, чтобы загладились грехи ваши, да придут времена отрады от лица Господа, и да пошлет Он предназначенного вам Иисуса Христа, Которого небо должно было принять до времен совершения всего, что говорил Бог устами всех святых Своих пророков от века.
      cn: (使徒行传 3:19-21) 所以，你們當悔改歸正，使你們的罪得以塗抹，這樣，那安舒的日子就必從　主面前來到； 主也必差遣所傳講給你們的耶穌　基督降臨。 天必留他，等到一切復原的時候，就是　上帝從創世以來、藉著眾聖先知的口所說的。


        那么，你们当悔改归正，使你们的罪得以涂抹，使安舒的时期从上主的面容而来，并差遣那为你们所预定的耶稣基督，祂是天必须接纳的，直到万事成全的时期，就是上帝从古以来借着祂众圣先知之口所说的一切。'
  - type: paragraph
    text:
      ru: 'Говорит не о том прегрешении иудеев, на которое они дерзнули во время распятия, так как выше сказал:«Впрочем я знаю, что вы, как и начальники ваши, сделали это по неведению»(ст. 17). Какое же значение имело то, что он сказал там«я знаю! Я знаю», говорит, то есть считаю полезным сказать так, чтобы устроить спасение ваше. А что«сделали это по неведению», знаю потому, что многие из вас обращаются и спасаются. Очевидно, он говорит это к обратившимся уже из них и уверовавшим. Как же так«по неведению»сделали они это? Какое незнание в том, чтобы испросить на свободу разбойника и не принять в свое общество Того, Кого присудил Пилат отпустить, а, напротив, убить Его? Но он говорил так, отворяя для них двери обращения; поэтому он не говорит: «Покайтесь в том, на что дерзнули вы во дни распятия», но –«покайтесь и обратитесь, чтобы загладились»и прочие«грехи ваши».'
      cn: （他）说的并非是犹太人在钉十字架时胆敢犯下的罪过，因为他上面已经说过：「然而，我知道，你们和你们的官长，都因无知而做了这事」（使徒行传 3:17）。那么，他当时说「我知道！我知道」又有什么意义呢？他说，这意思是，我以为这样说是对你们有益的，为要成就你们的救恩。至于你们「因无知而做了这事」，我之所以知道，是因为你们中有许多人正在悔改并得救。显然，他这话是对他们当中那些已经悔改并信主的人说的。他们怎么会「因无知」而做了这事呢？央求释放强盗，却不接纳彼拉多判决释放的那一位，反而杀害祂，这其中有什么无知呢？然而，他这样说，是为了为他们敞开悔改之门；因此他没有说：「为你们在钉十字架之日所胆敢做的事而悔改」，而是说：「你们要悔改并归正，使你们的罪得以涂抹」以及其余的话。
  - type: paragraph
    text:
      ru: 'Итак,«покайтесь», говорит,«да придут времена»обновления. Но тут же показывает присутствующим, что они имеют подвергнуться многим скорбям, потому что такая речь может быть обращена только к тому, кому предстоят слезы и кто ожидает какого-либо утешения. Посмотри, как постепенно приближается к цели. В первой беседе указал на воскресение Иисуса и сидение Его на небесах; а здесь указывает уже на Его славное пришествие, которое называет временами«отрады от лица Господа», или обновления, потому что какие еще могли быть другие времена обновления или воскресения? И апостол Павел ставит вопрос об этих временах, когда говорит: и мы«воздыхаем под бременем»(2Кор. 5, 4). Если же кто временами обновления вздумает называть времена, следовавшие после завоевания Иерусалима, то не встретит никакого препятствия, потому что и времена озлобления и пленения иудеев Бог сократил ради избранных, то есть для того, чтобы уверовавшие обрели обновление и освободились от этого сильного угнетения.'
      cn: 于是，他说：「悔改吧，好叫更新的时期来到。」但随即他向在场的人指出，他们必将遭遇许多苦难，因为这样的话只能向那些将要面对眼泪、并期待某种安慰的人说。你看，他如何循序渐进地接近目标。在第一次讲道中，他指出了耶稣的复活以及祂在天上的坐席；而在这里，他已然指出了祂荣耀的降临，他称之为「从上主面前来的舒畅时期」，或更新的时期，因为除了这些，还有什么其他的更新或复活的时期呢？使徒保罗也论及这些时期，当他说：「我们都在重担下叹息」（哥林多后书 5:4）。如果有人将更新的时期指作耶路撒冷被攻占之后的时期，那也不会有任何阻碍，因为即使是犹太人遭受苦害和被掳的时期，上帝也为了选民而缩短了，也就是说，为了让那些信主的人获得更新，并从这强大的压迫中解脱出来。
  - type: paragraph
    text:
      ru: «Да пошлет Он предназначенного вам Иисуса Христа, Которого небо должно было принять до времен совершения всего».
      cn: 他必差派那预定给你们的耶稣基督，祂必须被天所容纳，直到万物成全的时候。
  - type: paragraph
    text:
      ru: 'Петр говорит так вместо того, чтобы сказать: «Небу необходимо принять Его, так как Он – Бог и должен сидеть всегда вместе с Отцом». Показывает причину, почему Он не приходит теперь, говорит, что следует прийти всему к концу, тогда и Он придет. Но как же Петр говорит:«Которого небо должно было принять?»Ужели оно еще не приняло Иисуса? Приняло, без всякого сомнения. Но отчего же он не сказал: «приняло»? Так говорит он, как человек, беседующий о прежних временах.  Итак, смысл этого текста тот, что многое из предсказанного пророками еще не исполнилось, но исполняется и имеет исполняться до скончания мира, потому что вознесшийся на небеса Христос пребудет там до скончания мира и придет с силою тогда, когда исполнится, наконец, все, что предсказали пророки, то есть когда настанет конец и прекратится все чувственное, тогда Христос будет превыше небес.'
      cn: 彼得这样说，而不是说：「天必须接纳祂，因为祂是上帝，并且必须永远与父同坐。」这显示了祂现在不来的原因，说道一切都应在末了来到，届时祂也会来。但彼得为何说：「天必当接纳祂？」难道天还没有接纳耶稣吗？接纳了，毫无疑问。但他为何不说：「接纳了」呢？他这样说，是如同一个谈论往昔之人。所以，这段经文的意义是：先知们所预言的许多事尚未应验，但正在应验，并将应验直到世界的末了，因为升入天国的基督将留在那里直到世界的末了，并将在先知们所预言的一切最终应验之时，带着能力降临，也就是说，当末期来到，一切属感官之事停止时，届时基督将超越诸天。
  - type: paragraph
    text:
      ru: 'Деян.3:22–26.Моисей сказал отцам: «Господь Бог ваш воздвигнет вам из братьев наших Пророка, как меня; слушайтесь Его во всем, что Он ни будет говорить вам. И будет, что душа, которая не послушает Пророка того, истребится из народа»(Втор. 18, 15, 18–19).«И все пророки, от Самуила и после него, сколько их ни говорили, также предвозвестили дни сии. Вы сыны пророков и завета, который завещавал Бог отцам вашим, говоря Аврааму: «и в семени твоем благословятся все племена земные»(Быт. 12, 3).Бог, воскресив Сына Своего Иисуса, к вам первым послал Его благословить вас, отвращая каждого от злых дел ваших.'
      cn: (使徒行传 3:22-26) 摩西曾對祖宗說：『　主─你們的　上帝要從你們弟兄中間給你們興起一個先知像我，凡他向你們所說的，你們都要聽從。 凡不聽從那先知的，必要從民中滅絕。』 從撒母耳以來的眾先知，凡說預言的，也都說到這些日子。 你們是先知的子孫，也承受　上帝與我們祖宗所立的約，就是對亞伯拉罕說：『地上各族都要因你的後裔得福。』 　上帝既興起他的　兒子耶穌，就先差他到你們這裏來，賜福給你們，叫你們各人回轉，離開罪惡。」


        摩西对祖先说：「你们的上主上帝要从你们弟兄中给你们兴起一位先知，像我一样；凡他所对你们说的一切，你们都要听从。凡不听从那先知的人，必从民中剪除。」（申命记 18:15，18-19）


        「并且，从撒母耳起，以及此后凡说话的众先知，都预言了这些日子。你们是先知的子孙，也是上帝与你们祖先所立之约的子孙，这约是上帝与你们的祖先立的，他对亚伯拉罕说：『地上万族都必因你的后裔得福。』」（创世记 12:3）


        上帝既已使祂的儿子耶稣复活，就先差遣祂到你们这里来，为要祝福你们，叫你们各人回转，离开你们的恶行。'
  - type: paragraph
    text:
      ru: Сказал«воздвигнет… Пророка, как меня». Выражение"как меня"следует понимать не в смысле природы, а в смысле действия. Моисей уподобил себя Христу не по природе, но по действиям, потому что если бы выражение"как меня"он употребил в смысле природы, то воскрес бы не один, а многие. Пророком назван по человечеству Еммануил – посредник, как в свое время Моисей, Бога и человеков. Уподобляя Его в переносном смысле Моисею, я позволяю себе назвать Его даже Моисеем – истину позволяю себе сопоставить с тенью. Христос рождается в Вифлееме, Моисей родился в Египте. Моисей израильтянин, Христос по плоти тоже. Моисей из рода священнического, Христос – через Деву из рода Давидова. При Моисее – фараон, при Христе – Ирод. Фараон убивает детей, Ирод истребляет младенцев; тот избивает детей мужеского пола, и этот истребляет мужеский же пол. Моисей спасается при посредстве матери; Матерью же и вместе с Ней спасен и Христос.
      cn: 他说：「必兴起……一位先知，像我一样。」 「像我一样」这个表达，不应理解为本性，而应理解为行动。摩西将自己比作基督，并非按着本性，而是按着行动，因为如果他将「像我一样」这个表达用于本性，那么复活的就不会是一个人，而是许多人。厄玛奴耳被称为先知，是就其人性而言——祂是如同昔日摩西那样，是上帝与人之间的中保。我在转义中将祂比作摩西，我甚至允许自己称祂为摩西——我允许自己将真理与影儿相比。基督降生于白冷，摩西生于埃及。摩西是以色列人，基督按肉身而言也是。摩西出于祭司的家族，基督——通过贞女出于达味家族。摩西之时有法老，基督之时有黑落德。法老杀害孩童，黑落德残杀婴孩；那个杀害男性孩童，而这个也残害男性。摩西藉着母亲而得救；基督也藉着母亲并与祂一同得救。
  - type: paragraph
    text:
      ru: «Истребится из народа». Будучи бессмертной, душа человеческая не совершенно истребляется, но ниспадает из какого-либо благого состояния, в какое прежде была поставлена. Так и Иуда истребился, то есть исключен из лика апостолов. Итак,поеликудуша бессмертна, то под истреблением ее мы разумеем лишение ее тех благ, какие она имела бы вкусить, если бы жила богоугодно.
      cn: 「必从民中剪除。」人的灵魂既是不朽的，便不会完全被剪除，而是从它先前所被安立的某个美好境况中坠落。犹大也是如此被剪除的，也就是说，他被排除于使徒之列。所以，既然灵魂是不朽的，那么我们所理解的灵魂被剪除，指的是它丧失了那些恩福——如果它活出蒙上帝喜悦的生命，它本应品尝到的恩福。
  - type: paragraph
    text:
      ru: «Вы сыны пророков». Говорит«сыны пророков»вместо того, чтобы сказать «не должно ни унывать, ни думать, что вы лишились обетований».«Вы сыны пророков», так что они"к вам"говорили и радивасвсе это совершилось. А что значит:«сыны… завета?»Это сказано вместо «наследники», но наследники, не приписанные только, а такие же, как сыны."Сыны"сказал, между прочим, и для того, чтобы показать, что они – наследники по сыноположению. Итак, если вы сами этого хотите, то вы – наследники. Вот почему говорит Петр:«вы сыны пророков и завета… Иисуса», Которого Бог«воскресив… к вам первым послал… благословить вас». Послал Бог и к другим народам, но к вам, распявшим и убившим Его, послал прежде. Когда же? Только с креста? Нет, и после того, и после воскресения. Что сотворить?«Благословить вас»и спасти, если вы и сами действительно пожелаете отвратиться«от злых дел».
      cn: 「你们是先知之子。」他说「先知之子」，而不是说「不应沮丧，也不应认为你们已失去了应许」。「你们是先知之子」，所以他们是「向你们」说话，并且这一切都是为了你们而成就的。那么，「圣约之子」是什么意思呢？这句话是取代「继承人」而说的，但这些继承人不仅仅是被指定的，而是如同亲生儿子一般的。他说「儿子」，顺便也是为了表明他们是因蒙收纳为子而成为继承人的。因此，如果你们自己愿意，你们就是继承人。这就是为什么彼得说：「你们是先知和耶稣圣约的子嗣」，上帝「使祂复活……首先差遣祂到你们这里……来祝福你们」。上帝也差遣祂到其他民族那里，但却首先差遣祂到你们这些将祂钉死并杀害祂的人这里。那么是什么时候呢？仅仅是从十字架上吗？不，在那之后，也在复活之后。要做什么呢？「祝福你们」并拯救你们，如果你们自己也确实愿意「离弃邪恶之事」。
- type: heading1
  text:
    ru: Глава четвертая
    cn: 第四章
  children:
  - type: paragraph
    text:
      ru: Деян.4:1–3.Когда они говорили к народу, к ним приступили священники и начальники стражи при храме и саддукеи, досадуя на то, что они учат народ и проповедуют в Иисусе воскресение из мертвых. И наложили на них руки и отдали их под стражу до утра; ибо уже был вечер.
      cn: (使徒行传 4:1-3) 使徒對百姓說話的時候，祭司們和守殿官，並撒都該人忽然來了。 因他們教訓百姓，本著耶穌，傳說死人復活，就很煩惱， 於是下手拿住他們；因為天已經晚了，就把他們押到第二天。
  - type: paragraph
    text:
      ru: Еще не успели апостолы вздохнуть от прежних искушений, как впадают в другие. И смотри, как располагаются события. Сначала апостолы осмеяны все вместе; потом они впадают в опасности, но не вдруг. Прежде они оправдываются в народных собраниях и совершают после этого великое чудо, потом уже, после того, как стали смелее, вступают, по допущению Божию, в подвиги. А ты обрати взор свой на преуспеяния иудеев в лукавстве и бесстыдстве. Прежде, при Христе, они искали человека, который бы предал Его; теперь уже сами налагают руки, сделавшись после креста дерзновеннее и бесстыднее. А с ними, говорится,«были и начальники стражи при храме». Это для того, чтобы такой обстановкой придать делу характер публичного обвинения и выдать его как не свое. Так стараются делать они всегда.
      cn: 使徒们还未从先前的试探中得以喘息，便又陷入了另一些试探。你且看，事件是如何安排的。首先，使徒们全体遭到嘲笑；然后他们陷入危险，但这并非突然。他们首先在民众大会中为自己辩解，此后行了一个大神迹；然后，在他们变得更加勇敢后，蒙上帝允许，投入到属灵的奋斗中去。而你将你的目光投向犹太人在诡诈和无耻上的长进。从前，当基督尚在之时，他们寻找要出卖祂的人；现在他们却亲自动手，在十字架事件之后，变得更加胆大妄为和无耻。并且，经上说，和他们在一起的「还有殿里的守卫官长」。这是为了藉着这种排场，使此事带有公开指控的性质，并将其呈现为并非他们自己的事。他们总是这样设法去做。
  - type: paragraph
    text:
      ru: «И отдали их под стражу до утра». Так поступили иудеи с апостолами и стерегли их, желая смирить, между тем продленное время сделало апостолов более неустрашимыми.
      cn: 「并把他们拘禁到第二天早晨。」犹太人就是这样对待使徒们，看守他们，意图使他们降服；然而，延长的时光却使使徒们更加无畏。
  - type: paragraph
    text:
      ru: Деян.4:4.Многие же из слушавших слово уверовали; и было число таковых людей около пяти тысяч.
      cn: (使徒行传 4:4) 但聽道之人有許多信的，男丁數目約到五千。
  - type: paragraph
    text:
      ru: Что это? Разве они не видели, что апостолы оправдались? И, несмотря на то, однако же, их связали. Как же они уверовали? Видишь явное содействие Божие? И нужно же было случиться тому, чтобы те, которые уверовали, были из числа более немощных. Но споспешествуемая Божественным Духом Петрова беседа бросила семя в глубь мысли и коснулась самой души их. Связали же апостолов священники перед лицом народа, чтобы и самих смотревших сделать более трусливыми, но вышло наоборот. А допрашивали апостолов наедине – из опасения, чтобы дерзновение их не произвело влияния на слушателей.
      cn: 这是怎么回事？难道他们没有看到使徒们已蒙称义吗？然而，尽管如此，他们还是被捆绑了。那么他们是如何信的呢？你看到上帝显而易见的襄助了吗？而且，竟然是那些信了的人，是那些较为软弱的人。但是，蒙圣灵襄助的彼得的讲道将种子撒入了思想深处，并触及了他们灵魂的根本。祭司们在众人面前捆绑了使徒们，为的是要使那些旁观者也变得更加胆怯，但结果却恰恰相反。而他们是在私下审问使徒们的，是出于担心，唯恐他们的无畏精神不会影响到听众。
  - type: paragraph
    text:
      ru: 'Деян.4:5–10.На другой день собрались в Иерусалим начальники их, и старейшины, и книжники, и Анна первосвященник, и Каиафа, и Иоанн, и Александр, и прочие из рода первосвященнического; и, поставив их посреди, спрашивали: какою силою или каким именем вы сделали это? Тогда Петр, исполнившись Духа Святаго, сказал им: начальники народа и старейшины Израильские! Если от нас сегодня требуют ответа в благодеянии человеку немощному, как он исцелен, то да будет известно всем вам и всему народу Израильскому, что именем Иисуса Христа Назорея, Которого вы распяли, Которого Бог воскресил из мертвых, Им поставлен он перед вами здрав.'
      cn: (使徒行传 4:5-10) 第二天，官長、長老，和文士在耶路撒冷聚會， 又有大祭司亞那和該亞法、約翰、亞歷山大，並凡大祭司的親族都在那裏。 叫使徒站在當中，就問他們說：「你們用甚麼能力，奉誰的名作這事呢？」 那時彼得被　聖靈充滿，對他們說：「治民的官長和以色列的長老啊， 倘若今日因為在殘疾人身上所行的善事查問我們他是怎麼得了痊癒， 你們眾人和以色列百姓都當知道，站在你們面前的這人得痊癒是因你們所釘十字架、　上帝叫他從死裏復活、拿撒勒的耶穌　基督之名。

        第二天，他们的官长、长老和文士都聚集在耶路撒冷，

        还有大祭司亚那、该亚法、约翰、亚历山大，以及凡属大祭司家族的人。

        他们把使徒们带到中间，问他们说：「你们是凭什么能力，或凭什么名做的这事呢？」

        那时，彼得被圣灵充满，对他们说：

        「以色列的官长和长老啊！

        如果今天因着我们对一个软弱之人所行的善事，就是他如何得医治的事，而要求我们给出答复，

        那么，愿你们众人和以色列全族都知道，

        是靠着你们所钉十字架、上帝使他从死人中复活的拿撒勒人耶稣基督的名，

        靠着祂，这人健全地站在你们面前了。'
  - type: paragraph
    text:
      ru: 'Кроме других неправд по отношению к апостолам, они (начальники, старейшины, книжники и первосвященники иудейские) не соблюдали даже и требований закона. Обрати внимание хотя бы на множество первосвященников, между тем по закону должен быть один, пока он жив. И на этот раз придали делу форму суда, чтобы потребовать апостолов к ответу перед неправедным судом. Разузнавали,«какою силою или каким именем». И, однако же, сами знали, потому что задержали апостолов вследствие того именно, что тяготились проповедью их о воскресении во Христе. Итак, для чего же допрашивают? Они ожидали, что апостолы, убоявшись суда и множества судей, откажутся от своих слов, – и думали исправить этим все дело, потому что, посмотри, как коварно спрашивают:«каким именем вы сделали это?»Да, они более желали, чтобы апостолы провозгласили исцеление делом своим, чем делом силы Христовой. Но посмотри, в какое затруднение ставили они апостолов. Они не хотели даже, чтобы произнесены были слова «исцеление хромого», ибо почему же они не говорят: что именно, а говорят«сделали это?»'
      cn: 除了对使徒们的其他不公之外，他们（犹太人的官长、长老、文士和祭司长）甚至连律法的要求都没有遵守。至少请注意，当时有多位祭司长，然而按律法规定，只要祭司长在世，就只能有一位。这次他们把这事弄成审判的形式，目的是要在不义的法庭上，传唤使徒们为他们所做的事负责。他们盘问：「你们是凭什么能力，或奉谁的名做这事？」然而，他们自己是知道的，因为他们拘捕使徒们，正是由于恼恨使徒们传讲在基督里的复活。那么，他们为何还要审问呢？他们期待使徒们会因惧怕这审判和众多的审判官而收回他们的话——他们以为这样就能了结整件事，因为你看，他们是多么诡诈地问：「你们是奉谁的名做这事？」是的，他们更希望使徒们声称这医治是他们自己的作为，而不是基督能力所行的。但你看，他们让使徒们陷入了何等困境。他们甚至不希望说出「医治瘸子」这样的字眼，因为他们为何不说：具体是什么事，却说「做了这事」呢？
  - type: paragraph
    text:
      ru: '«Начальники народа и старейшины Израильские». Замечай, какая философия. Там, где требует нужда, Петр очень укоряет их. Так, он назвал их почетными именами; но когда приступил к самому делу, тогда уже не отступает от подобающего обличения, косвенно напоминая им, что по поводу таковых дел они всегда и спорили в суде, и выходили, не радуясь. А что он говорит, так это вот что: «скорее следовало увенчать нас за это и провозгласить как благодетелей». А так как«от нас сегодня требуют ответа… как он исцелен, то да будет известно всем вам и всему народу Израильскому, что именем Иисуса Христа Назорея», – что особенно тяжело было для иудеев. А это и есть то, что Христос говорил им: «что вы выслушали ушами, о том проповедуйте по домам».'
      cn: 「百姓的首领和以色列的长老们。」注意，这是何等的智慧啊。在必要之时，彼得严厉地斥责他们。他用尊贵的称谓称呼他们；但当他论及核心之事时，便不再回避当行的责备，间接地提醒他们，关于这类事情，他们总是在公堂上争辩，并且不欢而散。他所说的，无非是这样的话：「反而理当为此事为我们加冕，并宣扬我们为恩人。」然而，既然「今日有人要求我们对此作出解释……关于他是如何被治愈的」，那么，愿你们所有人以及全以色列民族都知道，乃是凭着拿撒勒人耶稣基督的名——这对于犹太人而言尤其难以接受。这正是基督对他们所说的话：「你们所亲耳听见的，要在家中宣扬。」
  - type: paragraph
    text:
      ru: '«Именем Иисуса Христа Назорея». Не подумайте, говорит, что мы скрываем отечество Его; нет, мы и отечество объявляем; этого мало: мы и страдания Его исповедуем, и воскресение проповедуем.'
      cn: 「奉拿撒勒人耶稣基督的名。」他说，不要以为我们隐藏祂的故乡；不，我们连祂的故乡也宣告；这还不够：我们连祂的苦难也宣认，祂的复活也宣讲。
  - type: paragraph
    text:
      ru: «Которого вы распяли». Произнес и такое слово, которое способно было устрашить иудеев, потому что, как ты думаешь, какой удар наносится им этими словами?
      cn: 「你们所钉死的祂」。祂也说出这样的话，足以使犹太人惊惧，因为，你认为这些话对他们造成了何等打击呢？
  - type: paragraph
    text:
      ru: Деян.4:11–12.Он есть камень, пренебреженный вами зиждущими, но сделавшийся главою угла, и нет ни в ком ином спасения»(Пс. 117, 22).«Ибо нет другого имени под небом, данного человекам, которым надлежало бы нам спастись».
      cn: (使徒行传 4:11-12) 這是你們匠人所輕棄的石頭，成為房角的頭塊石頭。 除他以外，別無拯救；因為在天下人間，沒有賜下別的名，我們必可靠著得救。」
  - type: paragraph
    text:
      ru: Таков – то есть тщательно испробован – тот камень, который стал главой этих двух, сплоченных через него в одно здание Церкви, народов – уверовавшего народа иудейского и всего уверовавшего язычества.
      cn: 如此——也就是说，经过仔细检验的——那块石头，祂成为了这两个民族的房角石，这两个民族借着祂联合成为教会这一建筑：已信的犹太民族和所有已信的外邦人。
  - type: paragraph
    text:
      ru: «И нет ни в ком ином спасения». Здесь возвещаются уже и высокие истины. Да, как только настал час научить, то и пророчества обходят апостолы; и когда наступало время говорить с дерзновением, тогда они излагали уже одни свои мысли, потому что тогда не было ничего такого, чем бы можно было подействовать на слушателей с целью исправления их. Но когда следовало смело возвестить истину, тогда апостолы уже не щадят слушателей. Да теперь Петр и не боялся запугать их и потому поступает не так, как поступает в других случаях, направляя свою речь приноровительно к ним, ради спасения их. Известно, говорит, всем, что не нам одним даровано это имя, но и всем, так как и иудеи признавали воскресение, но поверхностно и по-детски.
      cn: «在任何其他人里面都没有救恩。」在这里，已经宣扬着崇高的真理。是的，一旦教导的时刻到来，使徒们也越过了预言；而当坦然无惧地讲话的时刻到来时，那时他们就只阐述自己的思想，因为那时没有什么可以用来影响听众以改正他们。但是当需要勇敢地宣扬真理时，那时使徒们就不再顾惜听众了。是的，现在彼得甚至不怕恐吓他们，因此，他不再像在其他场合那样，为了他们的救恩而调整自己的言论以适应他们。他说，众所周知，这个名字不仅仅赐予了我们，也赐予了所有人，因为甚至连犹太人也承认复活，但却是肤浅且孩子气的。
  - type: paragraph
    text:
      ru: Деян.4:13–14.Видя смелость Петра и Иоанна и приметив, что они люди некнижные и простые, они удивлялись; между тем узнавали их, что они были с Иисусом. Видя же исцеленного человека, стоящего с ними, ничего не могли сказать вопреки.
      cn: (使徒行传 4:13-14) 他們見彼得、約翰的膽量，又看出他們原是沒有學問的小民，就希奇，認明他們是跟過耶穌的； 又看見那治好了的人和他們一同站著，就無話可駁。
  - type: paragraph
    text:
      ru: Возможно быть и неграмотным (некнижным) и непростым, и простым и небезграмотным; но тут совпадало то и другое (то есть и неграмотность, и простота). Поэтому иудеи и удивлялись, когда Петр и Иоанн говорили и ораторствовали. Откуда же они получили это сведение, что Петр и Иоанн – таковы? Из слов их же самих – Петра и Иоанна. Ведь не просто говорит Лука «знали их», но –«узнавали их, что они были с Иисусом»во время страдания Его. Тогда они одни были с Ним. И видели иудеи тогда их смиренными и униженными; и эта именно неожиданная перемена особенно поразила их, ибо тот, кто тогда не мог снести взгляда вопрошавшей рабыни, тот теперь приходит в среду самих первосвященников и в синедрион и говорит с дерзновением.
      cn: 一个人可能不识字（未曾读书）而复杂，也可能质朴而不不识字；但在这里，二者并存（即不识字与质朴）。因此，当彼得和约翰讲说和雄辩时，犹太人感到诧异。他们是从哪里得知彼得和约翰是这样的人呢？来自他们自己——彼得和约翰——的话语。因为路加并非仅仅说「认识他们」，而是——「认出他们曾与耶稣同在」，是在祂受难之时。那时，只有他们与祂同在。犹太人那时看到他们谦卑而卑微；正是这意想不到的转变尤其震惊了他们，因为那时连一个婢女的盘问都无法承受的人，如今却来到大祭司们和公议会面前，并且坦然无惧地说话。
  - type: paragraph
    text:
      ru: 'Деян.4:15–22.И, приказав им выйти вон из синедриона, рассуждали между собою, говоря: что нам делать с этими людьми? Ибо всем, живущим в Иерусалиме, известно, что ими сделано явное чудо, и мы не можем отвергнуть сего. Но, чтобы более не разгласилось это в народе, с угрозою запретим им, чтобы не говорили об имени сем никому из людей. И, призвав их, приказали им отнюдь не говорить и не учить о имени Иисуса. Но Петр и Иоанн сказали им в ответ: судите, справедливо ли пред Богом – слушать вас более, нежели Бога? Мы не можем не говорить того, что видели и слышали. Они же, пригрозив, отпустили их, не находя возможности наказать их, по причине народа; потому что все прославляли Бога за происшедшее. Ибо лет более сорока было тому человеку, над которым сделалось сие чудо исцеления.'
      cn: (使徒行传 4:15-22) 於是吩咐他們從公會出去，就彼此商議說： 「我們當怎樣辦這兩個人呢？因為他們誠然行了一件明顯的神蹟，凡住耶路撒冷的人都知道，我們也不能說沒有。 唯恐這事越發傳揚在民間，我們必須嚴嚴的恐嚇他們，叫他們不再奉這名對人講論。」 於是叫了他們來，吩咐他們總不可奉耶穌的名講論教訓人。 彼得、約翰說：「聽從你們，不聽從　上帝，這在　上帝眼前合理不合理，你們自己酌量吧。 我們所看見所聽見的，不能不說。」 官長為百姓的緣故，想不出法子刑罰他們，又恐嚇一番，把他們釋放了。這是因眾人為所行的奇事都歸榮耀與　上帝。 原來藉著神蹟醫好的那人有四十多歲了。


        然后，命令他们走出公会，彼此商议，说：


        我们该如何处置这些人呢？因为凡住在耶路撒冷的人都知道，他们行了一个显而易见的奇迹，我们无法否认这一点。但为要叫这事不再在民间传开，我们要严厉禁止他们，不许他们奉这名对任何人说话。于是，他们召了使徒来，吩咐他们绝对不可奉耶稣的名讲论或教导。彼得和约翰回答说：「你们自己判断，在上帝面前，听从你们过于听从上帝，这是否公义呢？我们不能不说我们所看见和所听见的。」于是，他们又恐吓一番，就放了他们，因为百姓的缘故，他们找不到办法惩罚他们；因为众人都为这所发生的事赞美上帝。因为那得了这医治奇迹的人，已经四十多岁了。'
  - type: paragraph
    text:
      ru: Почему их не приводят священники к Пилату, но судят сами? Потому что стыдились и краснели за прежнее и опасались, чтобы апостолы не обвинили их.
      cn: 为什么司祭们不把他们带到彼拉多那里，却自己审判呢？因为他们为着自己先前的行径感到羞愧和脸红，并且害怕使徒们会指控他们。
  - type: paragraph
    text:
      ru: 'Деян.4:23–28.Быв отпущены, они пришли к своим и пересказали, что говорили им первосвященники и старейшины. Они же, выслушав, единодушно возвысили голос к Богу и сказали: Владыко Боже, сотворивший небо и землю, и море и всё, что в них! Ты устами отца нашего Давида, раба Твоего, сказал Духом Святым: что мятутся язычники, и народы замышляют тщетное? Восстали цари земные, и князи собрались вместе на Господа и на Христа Его(Пс. 2, 1–2).Ибо поистине собрались в городе сем на Святаго Сына Твоего Иисуса, помазанного Тобою, Ирод и Понтий Пилат с язычниками и народом Израильским, чтобы сделать то, чему быть предопределила рука Твоя и совет Твой.'
      cn: (使徒行传 4:23-28) 二人既被釋放，就到會友那裏去，把祭司長和長老所說的話都告訴他們。 他們聽見了，就同心合意的，高聲向　上帝說：「　主啊，你是造天、地、海、和其中一切的　上帝。 你曾藉著你僕人大衛的口，說：『異教的民為甚麼爭鬧？百姓為甚麼謀算虛妄的事？ 世上的君王一齊起來，臣宰也聚集，要敵擋　主，並他的　基督。』 希律和本丟．彼拉多，外邦人和以色列民，果然在這城裏聚集，要攻打你所膏的聖子耶穌。 成就你手和你意旨所預定必有的事。

        获得释放后，他们回到自己人那里，将祭司长和长老们对他们所说的话都转告了。众人听见了，就同心合意地高声向上帝祷告说：「主宰上帝啊，祢是创造了天、地、海和其中所有一切的！祢曾藉着祢的仆人——我们的祖先大卫的口，藉着圣灵说：『外邦为何喧哗？列国为何空谋妄想？地上的君王起来，臣宰一同聚集，敌对上主和祂的基督。』（诗篇 2:1-2）因为确实地，在这城里，希律和本丢彼拉多带着外邦人和以色列民聚集了，敌对祢所膏立的圣子耶稣，为要成就祢的手和祢的筹算预定要发生的一切。」'
  - type: paragraph
    text:
      ru: Апостолы Петр и Иоанн«пришли к своим и пересказали»все происшедшее с ними. Пересказали не по честолюбию, но чтобы показать явные свидетельства благодати Христовой.
      cn: 使徒彼得和约翰「回到自己人那里，并把一切所遭遇的事都述说出来」。他们述说，不是为了自显，而是为了显明基督圣恩的明显见证。
  - type: paragraph
    text:
      ru: «Владыко Боже, сотворивший». Смотри, как целесообразны молитвы апостолов. Когда они просили Господа указать им мужа, способного к апостольскому служению, то молились так:«Ты, Господи, Сердцеведец всех»(Деян. 1, 24), потому что тогда была нужда в предведении. А теперь, когда нужно было заградить уста противникам, взывают:«Владыко Боже, сотворивший небо и землю…»Но многие из еретиков разделяют Божество, говоря, что иной Бог – Творец мира и иной – Отец Христов. Поэтому разделяют и Писание и говорят, что Ветхий Завет есть Писание Бога Творца мира, а Новый – Отца Христова. Следуя далее своему нечестивому мнению, утверждают, что Боги эти и Их Писания противоположны, так что прибегающие к Господу суть враги Творца мира и находятся в лучшем состоянии, чем люди последнего. Итак, люди Творца мира предубеждены против Христа и Его учения. Поэтому святые апостолы, искореняя эту ересь, своей молитвой дают разуметь, что и Творец мира, и Отец Спасителя – Один и Тот же Бог, потому что Им дарованы оба Завета.
      cn: 「主宰上帝，创造万有的。」看哪，使徒们的祷告是何等恰当。当他们请求上主指示他们一人，能胜任使徒事奉的时候，他们如此祷告说：「祢，上主，是洞察众人心肠的」（使徒行传 1:24），因为那时需要预知。而现在，当需要堵住反对者之口时，他们呼求道：「主宰上帝，祢创造了天地……」然而许多异端分子分离神性，声称有一位上帝是世界的创造者，而另一位则是基督的父。因此他们也分离圣经，并声称旧约是创造世界之上帝的圣经，而新约则是基督之父的（圣经）。他们进一步依照自己不敬虔的观点，主张这些上帝和祂们的圣经是对立的，以至于那些归向上主的人，是世界创造者的仇敌，并处于比后者的子民更佳的境况中。因此，世界创造者的子民对基督和祂的教导存有偏见。所以，众圣使徒为要根除此异端，藉着他们的祷告表明，世界的创造者和救主的父，是同一位上帝，因为新旧两约皆由祂所赐予。
  - type: paragraph
    text:
      ru: '«Ты устами отца нашего Давида, раба Твоего, сказал Духом Святым: «что мятутся язычники, и народы замышляют тщетное?»'
      cn: 祢借着我们父大卫，祢的仆人的口，借圣灵说过：「为何列邦喧嚷？万民图谋虚妄？」
  - type: paragraph
    text:
      ru: Выставляют на вид пророчество это, как бы прося Бога об исполнении договора и вместе с тем утешая себя тем, что напрасно помышляют об этом враги.
      cn: 他们将此预言陈明出来，仿佛在向上帝祈求盟约的成就，同时以此自慰，因为仇敌对此的思虑尽属徒劳。
  - type: paragraph
    text:
      ru: «Сделать то, чему быть предопределила рука Твоя и совет Твой»,то есть не они имели в себе самих такую силу, но Ты, Господи, Который на все даруешь соизволение и приводишь все к концу, Ты, благий и мудрый Художник, Который дело врагов обращаешь во исполнение воли Твоей, потому что священники и прочие иудеи сошлись, как враги, а делали то, что Тебе угодно было. А что за выражение«предопределила рука Твоя?»Выражение это, по моему мнению, означает здесь власть и волю; оно однозначаще с выражением «достаточно восхотеть Тебе одному, потому что никто не предопределяет того, что Ты установляешь».
      cn: «去做祢的手和祢的谋划所预定的事，»也就是说，他们自身并没有这样的能力，而是祢，上主，祢赐予一切以允准，并使一切得以完成；祢，良善而智慧的造物主，祢将仇敌的行径转变为祢旨意的成就，因为祭司和其余的犹太人虽然如同仇敌般聚集，却行了祢所喜悦的事。而«祢的手所预定»这说法是什么意思呢？这个说法，在我看来，在这里意味着权柄和旨意；它与「只要祢独自意愿就已足够，因为无人能预定祢所确立的」这一说法同义。
  - type: paragraph
    text:
      ru: Деян.4:29–31.И ныне, Господи, воззри на угрозы их, и дай рабам Твоим со всею смелостью говорить слово Твое, тогда как Ты простираешь руку Твою на исцеления и на соделание знамений и чудес именем Святаго Сына Твоего Иисуса. И, по молитве их, поколебалось место, где они были собраны, и исполнились все Духа Святаго, и говорили слово Божие с дерзновением.
      cn: (使徒行传 4:29-31) 他們恐嚇我們，現在求　主鑒察。一面叫你僕人大放膽量，講你的道。 一面伸出你的手來，醫治疾病，並且使神蹟奇事，因你聖子耶穌的名行出來。」 禱告完了，他們聚集的地方震動，他們就都被　聖靈充滿，放膽講論　上帝的道。


        现今，主啊，求祢垂顾他们的恐吓，并赐祢的仆人以凡百的胆量讲说祢的圣言，同时祢伸出祢的手行医治，并奉祢圣子耶稣的名施行神迹与奇事。他们祷告之后，聚会的地方就震动了，众人就都充满了圣灵，并大胆地讲说上帝的圣言。'
  - type: paragraph
    text:
      ru: '«И ныне… воззри». Замечай: не сказали «порази их и низрини», но что же сказали?«Воззри на угрозы их, и дай рабам Твоим со всею смелостью говорить слово Твое…»'
      cn: 「况且如今……垂顾。」留意：他们并未说「击打并倾覆他们」，但他们说了什么呢？「鉴察他们的威吓，并赐祢的仆人满有胆量宣讲祢的圣言……」
  - type: paragraph
    text:
      ru: «И, по молитве их, поколебалось место, где они были собраны». Это было свидетельством Божия посещения и того, что они были услышаны, потому что иногда это бывает признаком гнева, а иногда знамением посещения. Молились же апостолы не о том, чтобы избавиться от перенесения трудностей, но об успехе проповеди. Но для чего же Бог потряс дом? Чтобы на угрожавших навести страх, а апостолам придать бодрости, так как было еще начало проповеди, то необходимо было чувственное знамение. Итак,«поколебалось место»и еще более утвердило апостолов.«И исполнились все Духа Святаго»,то есть воспламенились и возжгли в себе благодатный дар.
      cn: 而待他们祈祷完毕，他们聚集之处便震动了。这是上帝亲临的见证，也是他们祷告蒙垂听的见证，因为有时这可能是（上帝）震怒的标记，而有时则是亲临的预兆。然而，使徒们祷告，并非为摆脱磨难，而是为宣讲的成功。但为何上帝要震动那屋子呢？是为使那些威胁者心生畏惧，并给予使徒们勇气，因为宣讲刚开始，所以需要可见的兆头。于是，「这地方便震动了」，便更坚固了使徒们的心。「他们就都被圣灵充满」，亦即被点燃，并在自身内燃起了恩赐。
  - type: paragraph
    text:
      ru: Деян.4:32–35.У множества же уверовавших было одно сердце и одна душа; и никто ничего из имения своего не называл своим, но всё у них было общее. Апостолы же с великою силою свидетельствовали о воскресении Господа Иисуса Христа; и великая благодать была на всех их. Не было между ними никого нуждающегося; ибо все, которые владели землями или домами, продавая их, приносили цену проданного и полагали к ногам Апостолов; и каждому давалось, в чем кто имел нужду.
      cn: (使徒行传 4:32-35) 那許多信的人都是一心一意的，沒有一人說他的東西有一樣是自己的，都是大家公用。 使徒大有能力，見證　主耶穌復活；眾人也都蒙大恩。 內中也沒有一個缺乏的，因為人人將田產房屋都賣了，把所賣的價銀拿來，放在使徒腳前， 照各人所需用的，分給各人。


        众多信徒都同心同魂；他们中没有人称自己的财物为私有，而是凡物公用。使徒们则以大能为上主耶稣基督的复活作见证；极大的恩典临到他们众人身上。他们中间没有一个缺乏的人；因为凡有田产房屋的，都卖了，把所卖的价银拿来，放在使徒脚前；照各人所需用的，就分给各人。'
  - type: paragraph
    text:
      ru: В словах«было одно сердце и одна душа» «сердце»и"душа"означают одно и то же.
      cn: 在「有一个心和一个灵魂」这句话中，「心」和「灵魂」意指相同。
  - type: paragraph
    text:
      ru: «С великою силою свидетельствовали о воскресении». Лука выставляет апостолов как людей, которым поручено что-то, и говорит как бы об обязанности – вот что значит«свидетельствовали».
      cn: 「他们大有能力地见证了复活。」 路加将使徒们描绘成受托承担某事的人，并且如同在谈论一项义务——这正是「他们作见证」的含义。
  - type: paragraph
    text:
      ru: «Не было между ними никого нуждающегося». Потому«благодать великая»,что не было ни одного бедного, то есть не было ни одного нуждающегося, вследствие особенной щедрости отдававших свое имущество, потому что отдавали не часть, чтобы другую часть удержать у себя, а всё; и всё отдавали не как свое, а как бы не свое; и все уверовавшие питались как бы от одного дома.
      cn: «他们中间没有一个需要的人»。因此，「伟大的恩典」，因为没有一个贫穷的人，也就是说，没有一个需要的人，这乃是由于那些交出自己财产之人的特别慷慨，因为他们交出的不是一部分以期为自己保留另一部分，而是全部；他们交出一切，不视作自己的，而仿佛不属于自己的；所有信者都如同从一个家中得食。
  - type: paragraph
    text:
      ru: «Продавая, приносили цену проданного». Это свидетельствует о великом достоинстве и великом благочестии приносивших, потому что не дерзали даже отдавать в руки, но«полагали к ногам Апостолов»и делали их господами и распорядителями над приносимым, чтобы издерживаться как бы не из своего, а как бы из общего. А это и дававших избавляло от тщеславия, и получавшим представляло двоякую радость – облегчение бедности и освобождение от стыда.
      cn: 「卖了，把所卖的价银拿来。」这证明了奉献者极大的尊严和极大的虔诚，因为他们甚至不敢亲手交予，而是「放在使徒的脚前」，使使徒们成为所献之物的主人与管理者，以便支出时仿佛不是出于自己的，而是出于公共的。而这既使施予者免于虚荣，又使接受者获得双重喜乐——贫困的纾解和羞耻的免除。
  - type: paragraph
    text:
      ru: Деян.4:36–37.Так Иосия, прозванный отАпостолов Варнавою, что значит «сын утешения», левит, родом Кипрянин, у которого была своя земля, продав ее, принес деньги и положил к ногам Апостолов.
      cn: (使徒行传 4:36-37) 有一個利未人，生在塞浦路斯，名叫約瑟，使徒稱他為巴拿巴（巴拿巴翻出來就是勸慰子）。 他有地，也賣了，把錢拿來，放在使徒腳前。
  - type: paragraph
    text:
      ru: Мне кажется,«Иосия» –это не то лицо, которое упоминается вместе с Матфием (см.Деян. 1, 23), потому что тот называется и Иустом, а этот Варнавой, что значит«сын утешения». Кажется также мне, что этот Иосия получил такое название за свою добродетель. Каким же образом он был и левитом, и кипрянином? Это потому, что закон был уже нарушаем и левиты переселялись в чужие страны и там извлекали себе выгоды.
      cn: 我认为，『约西亚』并非与马提亚（参阅 使徒行传 1:23）一同被提及的那个人，因为那人也称为犹士都，而这个人则称为巴拿巴，其意为『安慰之子』。在我看来，这位约西亚之所以得此称谓，乃因其美德。那么，他怎会既是利未人，又是塞浦路斯人呢？这是因为律法那时已被违犯，利未人迁徙到异国他乡，并在那里为自己牟取利益。
- type: heading1
  text:
    ru: Глава пятая
    cn: 第五章
  children:
  - type: paragraph
    text:
      ru: 'Деян.5:1–6.Некоторый же муж, именем Анания, с женою своею Сапфирою, продав имение, утаил из цены, с ведома и жены своей, а некоторую часть принес и положил к ногам Апостолов. Но Петр сказал: Анания! Для чего ты допустил сатане вложить в сердце твое мысль солгать Духу Святому и утаить из цены земли? Чем ты владел, не твое ли было, и приобретенное продажею не в твоей ли власти находилось? Для чего ты положил это в сердце твоем? Ты солгал не человекам, а Богу. Услышав сии слова, Анания пал бездыханен; и великий страх объял всех, слышавших это. И, встав, юноши приготовили его к погребению и, вынеся, похоронили.'
      cn: (使徒行传 5:1-6) 有一個人，名叫亞拿尼亞，同他的妻子撒非喇賣了田產， 把價銀私自留下幾分，他的妻子也知道，其餘的幾分拿來放在使徒腳前。 彼得說：「亞拿尼亞，為甚麼撒但充滿了你的心，叫你欺哄　聖靈，把地的價銀私自留下幾分呢？ 田地還沒有賣，不是你自己的嗎？既賣了，價銀不是你作主嗎？你怎麼心裏起這意念呢？你不是欺哄人，是欺哄　上帝了。」 亞拿尼亞聽見這些話，就仆倒，斷了氣；聽見的人都甚懼怕。 有些少年人起來，把他包裹，抬出去埋葬了。

        有一个人，名叫亚拿尼亚，他的妻子撒非喇，卖了田产，私自留下了几分价银，他的妻子也知道这事，却把一部分带来，放在使徒脚前。彼得说：「亚拿尼亚！你为什么容许撒旦充满你的心，叫你欺哄圣灵，私自留下了几分地价呢？田产没有卖掉以前，不是你自己的吗？既卖了，价银不也是归你作主吗？你为什么心里起了这意念呢？你欺哄的不是人，乃是上帝。」亚拿尼亚听见这些话，就仆倒，气绝了。凡听见这事的人，都甚惧怕。有些少年人起来，把他包裹好，抬出去埋葬了。'
  - type: paragraph
    text:
      ru: Намереваясь повествовать о том, что случилось с Ананией и Сапфирой, и желая показать, что они согрешили, Лука сперва упоминает о человеке, поступившем по правде, – об Иосии. Несмотря на такое множество лиц, которые поступали так же – продавали имущество и деньги отдавали апостолам, несмотря на столь великие знамения и на такое обилие благодати, Анания из всего этого не вынес никакого назидания и навлек на себя погибель. Но удивительно то, что прегрешение было по соглашению с женой и никто другой не был очевидцем продажи. Вот откуда у этого несчастного возникла мысль поступить так, как он поступил. Некоторые говорят, что если сатана исполнил сердце Анании, то за что же он понес наказание? За то, что он сам был виновником того, что сатана исполнил сердце его, так как он сам подготовил себя к принятию действия сатаны и к подчинению себя его силе. А то, что верующие сносили имения свои апостолам, неужели было следствием насилия? Неужели мы привлекаем вас против вашей воли?
      cn: 意欲叙述亚拿尼亚和撒非喇所遭遇的事，并愿显明他们所犯的罪，路加首先提到了一位按公义行事的人，就是约西亚。尽管有如此众多的人照样行事——变卖产业，把钱交给使徒们，尽管有如此大的神迹和如此丰盛的恩典，亚拿尼亚从这一切中没有得到任何教训，反而自取灭亡。但令人惊奇的是，这罪过是与妻子合谋而犯，且没有人是变卖的见证者。这就是这个不幸之人产生如此行事的想法的根源。有些人说，如果撒但充满了亚拿尼亚的心，那么他为何受到惩罚呢？因为他自己是导致撒但充满他心的原因，因为他自己预备好自己去接受撒但的作为并顺服其权势。至于信徒们把他们的产业交给使徒们这件事，难道是出于强迫的结果吗？难道我们是违背你们的意愿来吸引你们吗？
  - type: paragraph
    text:
      ru: '«Для чего ты положил это в сердце твоем?»Три чуда в одном и том же случае: одно состояло в том, что Петр узнал то, что совершено было тайно, другое – в том, что он определил мысленное настроение Анании, и третье – в том, что Анания лишился жизни по одному лишь повелению. Многие из нечестивых, выставляя на вид то, что случилось с Ананией и Сапфирой, присуждают верховного из апостолов к смерти. Но обвинение касается не Петра, а скорее Духа Святаго, произнесшего на них справедливый приговор: потому что Петр только изобличил их во лжи, а жизни лишил их обоих, как одинаково согрешивших, имеющий власть над жизнью и смертью Дух Святый. То же нужно сказать и о Сапфире, потому что не Петр убил ее, но так как прегрешение было делом обоих, то Судия одинаково наказал того и другую. Поэтому-то Петр, как знавший об этом и всегда вещавший Духом Святым, и изрек этот, принятый им от Того же Духа, глас.'
      cn: '「你为什么把这事放在心里呢？」


        在同一事件中，有三件奇迹：其一，彼得知晓了那暗中行事之事；其二，他洞察了亚拿尼亚的心思意念；其三，亚拿尼亚仅凭一道命令就失去了生命。许多不敬虔之人，举出亚拿尼亚和撒非拉所发生之事为证，判定众使徒之首死罪。然而，这指控并非指向彼得，而是指向圣灵，是圣灵对他们宣判了公义的刑罚；因为彼得只是揭露了他们的谎言，而剥夺他们二人生命的，是掌管生死之权的圣灵，因为他们同样犯了罪。对撒非拉也当如此说，因为并非彼得杀了她，而是因为这过犯是他们二人所为，那审判者便同样地惩罚了他们二人。因此，彼得作为知晓此事的，且一向借着圣灵发言的，便宣告了这由他从同一圣灵所领受的声音。'
  - type: paragraph
    text:
      ru: 'Деян.5:7–11.Часа через три после сего пришла и жена его, не зная о случившемся. Петр же спросил ее: скажи мне, за столько ли продали вы землю? Она сказала: да, за столько. Но Петр сказал ей: что это согласились вы искусить Духа Господня? вот, входят в двери погребавшие мужа твоего; и тебя вынесут. Вдруг она упала у ног его и испустила дух. И юноши, войдя, нашли ее мертвою и, вынеся, похоронили подле мужа ее. И великий страх объял всюцерковьи всех слышавших это.'
      cn: (使徒行传 5:7-11) 約過了三小時，他的妻子進來，還不知道這事。 彼得應她說：「你告訴我，你們賣地的價銀就是這些嗎？」她說：「就是這些。」 那時，彼得對她說：「你們怎麼同心試探　主的　靈呢？看哪，埋葬妳丈夫之人的腳已到門口，他們也要把妳抬出去。」 婦人立刻仆倒在彼得腳前，斷了氣。那些少年人進來，見她已經死了，就抬出去，埋在她丈夫旁邊。 全教會和凡聽見這些事的人都甚懼怕。

        大约过了三小时之后，他的妻子也来了，不知道所发生的事。彼得就问她：「告诉我，你们卖地真是只得了这个价钱吗？」她说：「是的，就是这么多。」彼得对她说：「你们为何竟同心试探主的圣灵呢？看哪，埋葬你丈夫的人正进门；他们也要把你抬出去。」忽然，她仆倒在他脚前，就断了气。那些青年人进来，发现她已死了，就把她抬出去，埋在她丈夫身旁。于是，极大的恐惧临到全教会和所有听见这事的人身上。'
  - type: paragraph
    text:
      ru: 'Прошло три часа, и жена не узнала о том, что случилось с мужем, и никто из присутствовавших не сказал ей, потому что боялись. Итак, удивляясь этому, Лука изложил то и другое: и то, что прошло три часа, и то, что она вошла, не зная о том, что случилось. Заметь: Петр не зовет ее, но скорее выжидает, чтобы она вошла, когда захочет, давая ей время добровольно одуматься. Что же касается того, что никто не осмелился сказать ей о случившемся, так это произошло из страха к учителю и из послушания ему.'
      cn: 过了三个小时，妻子并不知道丈夫身上发生了什么事，也没有在场的任何人告诉她，因为他们害怕。因此，路加为此感到惊讶，便记述了这两件事：一是三个小时过去了；二是她进来时，并不知道所发生的事。请留意：彼得没有叫她，而是等待着，让她按自己的意愿进来，给她时间自愿地反省悔悟。至于没有人敢告诉她所发生的事，那是因为对老师的敬畏以及对他的顺服。
  - type: paragraph
    text:
      ru: «Скажи мне, за столько ли продали вы землю?»Петр хотел спасти ее, потому что муж был зачинщиком греха. Поэтому-то он и дает ей время оправдаться и раскаяться. Быть может, скажет кто-нибудь, что Петр поступил с ними жестоко, но какая тут жестокость? Если был побит камнями собиравший вопреки закону дрова (см.Чис. 15, 32–36), то много более должен быть наказан святотатец, потому что деньги эти были священны. Почему она упала у ног Петровых? Потому что стояла близ него. А стояла она близ него для того, чтобы, если пожелает раскаяться и исповедать свое прегрешение, могла исполнить это, не стыдясь посторонних, которые в противном случае слышали бы ее исповедь.
      cn: 「告诉我，你们卖地所得，是不是就这么多钱？」彼得想要救她，因为是她丈夫首先犯了罪。正是因此，他才给她时间为自己辩护并悔改。也许有人会说，彼得待他们残酷无情，但这又何来残酷呢？如果那违反律法拾柴火的人（参阅民数记 15:32-36）被乱石砸死，那么亵渎圣物者就更理当受到惩罚了，因为这些钱是神圣的。为什么她倒在彼得的脚下？因为她就站在他附近。而她站在他附近，是为了如果她愿意悔改并承认自己的过犯，就能如此行，而不必在旁人面前感到羞耻，否则旁人就会听到她的忏悔了。
  - type: paragraph
    text:
      ru: '«Нашли ее мертвою и, вынеся, похоронили». Смотри: более не остерегаются уже, в силу закона, касаться нечистых предметов, а прямо и без всякой осторожности касались мертвых. Обрати внимание и на то, что среди своих апостолы строги, а среди чужих удерживаются от наказаний; то и другое естественно. Последнее нужно было для того, чтобы не подумали, что они страхом наказания принуждают людей против их желания обращаться к истинной вере, а первое – для того, чтобы обратившимся уже к вере и удостоившимся небесного учения и духовной благодати не позволить стать людьми презренными и святотатцами, и в особенности в начале, потому что это послужило бы поводом к поношению их проповеди.'
      cn: 「他们发现她死了，就抬出去埋葬了。」看哪：他们不再依照律法规避触摸不洁之物，而是直接地、毫无顾忌地触摸死人了。请注意，使徒们在自己人中间是严厉的，而在外人中间则避免施加惩罚；这两者都是自然的。后者是为了免得人以为他们以惩罚之惧强迫人违背他们的意愿归向真信仰；而前者是为了不容那些已经归信、并已蒙受天上的教导和属灵恩典的人成为可鄙之人及亵渎圣物者，尤其是在初期，因为这会成为毁谤他们宣讲的把柄。
  - type: paragraph
    text:
      ru: «И великий страх объял всюцерковь». Анания и Сапфира были наказаны, а другим послужило это на пользу. Прежде хотя и были знамения, но не было такого страха. Итак, истинно, что Господь познается, суды творя.
      cn: 「莫大的惊惧临到全教会。」亚拿尼亚和撒非拉受到了惩罚，而这事对其他人则有益处。此前虽然有神迹，却没有这样的惧怕。因此，诚然，上主藉着施行审判而被认识。
  - type: paragraph
    text:
      ru: Деян.5:12–16.Руками же Апостолов совершались в народе многие знамения и чудеса; и все единодушно пребывали в притворе Соломоновом. Из посторонних же никто не смел пристать к ним, а народ прославлял их. Верующих же более и более присоединялось к Господу, множество мужчин и женщин, так что выносили больных на улицы и полагали на постелях и кроватях, дабы хотя тень проходящего Петра осенила кого из них. Сходились также в Иерусалим многие из окрестных городов, неся больных и нечистыми духами одержимых, которые и исцелялись все.
      cn: (使徒行传 5:12-16) 主藉使徒的手在民間行了許多神蹟奇事；（他們都同心合意的在所羅門的廊下。 其餘的人沒有一個敢貼近他們，百姓卻尊重他們。 信徒歸　主的人越發增添，連男帶女很多。） 甚至有人將病人抬到街上，放在床上或榻上，指望彼得過來的時候，或者得他的影兒照在甚麼人身上。 還有許多人帶著病人和被污靈纏磨的，從耶路撒冷四圍的城邑出來，全都得了醫治。


        使徒们的手在百姓中行了许多神迹奇事；他们都同心合意地聚集在所罗门的廊下。但其他外人没有一个敢与他们为伍，百姓却尊崇他们。更多信主的人，就是许多男男女女，加入了主，甚至把病人抬到街上，放在床上或褥子上，为的是彼得走过时，他的影子能遮盖他们当中的某一个人。也有许多从周围城镇来的人聚集到耶路撒冷，带着病人和被污鬼附着的人，他们所有人都得了医治。'
  - type: paragraph
    text:
      ru: С того времени, как начали бояться их, Петр и прочие апостолы творили больше чудес.
      cn: 自从人们开始惧怕他们那时起，彼得和其余的使徒施行了更多的神迹。
  - type: paragraph
    text:
      ru: «Пребывали в притворе Соломоновом». Пребывали апостолы уже не в доме, но в храме. Так как Лука сказал«в притворе Соломоновом», то, чтобы ты не удивлялся, каким образом дозволяла это толпа, он говорит, что«никто не смел пристать к ним, а народ»иудейский«прославлял»апостолов.
      cn: 「他们常在所罗门的廊下。」使徒们不再住在家里，而是住在圣殿里。因为路加说「在所罗门的廊下」，所以为了让你不惊讶于众人如何容许此事，他说「没有人敢附从他们，而犹太百姓」则「尊荣」使徒们。
  - type: paragraph
    text:
      ru: '«Выносили больных на улицы». При Христе не было того, чтобы больные получали исцеления на улицах и от тени. А если«никто не смел пристать к ним», то каким же образом совершается в этом случае исцеление? Это было делом Того, Кто сказал:«Верующий в Меня дела, которые Я творю, и он сотворит, и больше сих сотворит»(Ин. 14, 12). Со всех сторон возрастало удивление апостолам: и со стороны уверовавших, и со стороны исцеленных, и со стороны наказанных, и со стороны дерзновения их во время проповеди, и со стороны добродетельной и безукоризненной жизни. Да, это удивление проистекало не только из чудес, но и потому, что самая жизнь и добродетели этих мужей были великие и поистине апостольские.'
      cn: 「把病人抬到街上。」在基督在世时，病人并非在街上或借由影子获得医治。而如果「没有人敢与他们亲近」，那么医治在这种情况下是如何成就的呢？这是那位曾说：「信入我的人，我所行的事，他也要行，并且要行更大的事」（约翰福音 14:12）之主所成就的。众人对使徒们的惊奇从四面八方涌现：既有来自信徒们的，也有来自蒙医治者的，还有来自受惩罚者的，以及来自他们在讲道时所显出的胆量，和他们那德行高尚、无可指摘的生活。是的，这种惊奇不仅源于神迹，更因为这些圣徒们的生活与美德是如此伟大，且真正具有使徒风范。
  - type: paragraph
    text:
      ru: 'Деян.5:17–25.Первосвященник же и с ним все, принадлежавшие к ереси саддукейской, исполнились зависти, и наложили руки свои на Апостолов, и заключили их в народную темницу. Но Ангел Господень ночью отворил двери темницы и, выведя их, сказал: идите и, став в храме, говорите народу все сии слова жизни. Они, выслушав, вошли утром в храм и учили. Между тем первосвященник и которые с ним, придя, созвали синедрион и всех старейшин из сынов Израилевых и послали в темницу привести Апостолов. Но служители, придя, не нашли их в темнице и, возвратившись, донесли говоря: темницу мы нашли запертою со всею предосторожностью и стражей стоящими перед дверями; но, отворив, не нашли в ней никого. Когда услышали эти слова первосвященник, начальник стражи и прочие первосвященники, недоумевали, что бы это значило. Пришел же некто и донес им, говоря: вот, мужи, которых вы заключили в темницу, стоят в храме и учат народ.'
      cn: (使徒行传 5:17-25) 大祭司和他的一切同人，（就是撒都該教門的人，）都起來，滿心忌恨， 就下手拿住使徒，收在外監。 但　主的天使夜間開了監門，領他們出來， 說：「你們去站在殿裏，把這生命的道都講給百姓聽。」 使徒聽了這話，天將亮的時候就進殿裏去教訓人。大祭司和他的同人來了，叫齊公會的人，和以色列族的眾長老，就差人到監裏去，要把使徒提出來。 但差役到了，不見他們在監裏，就回來稟報說： 說：「我們看見監牢實在關鎖，盡是妥當，看守的人也站在門外；及至我們開了門，裏面一個人都不見。」 大祭司和守殿官和祭司長聽見這些事，心裏犯難，不知這事將來如何。 有一個人來稟報說：「看哪，你們收在監裏的人，現在站在殿裏教訓百姓。」


        大祭司和所有与他一道，属于撒都该教派（异端）的人，心中充满了嫉妒，就下手抓住使徒们，把他们关在民众的监狱里。然而在夜间，上主的使者打开了监狱的门，领他们出来，说：「你们去，站在圣殿里，把一切这些生命的话语告诉百姓。」他们听了这话，清早进了圣殿，就教训人。


        同时，大祭司和与他一道的人来了，召集了公会和以色列子民的所有长老，并且派人去监狱里提使徒们来。但是，差役们去了，却没有在监狱里找到他们。他们回来报告说：「我们发现监狱门紧锁，防范严密，并且有卫兵站在门外；但开门进去，却在里面一个人也没有找到。」大祭司、守卫长和其余的大祭司们听了这话，都困惑不解，不知道这事会是何意。恰巧这时有一个人来了，报告他们说：「瞧，你们关在监狱里的那些人，正站在圣殿里教训百姓呢！」'
  - type: paragraph
    text:
      ru: Что значит«исполнились зависти?»Это значит, что они были возбуждены, взволнованы тем, что говорили. Теперь нападают на апостолов с большим ожесточением, но не тотчас начинают судить их, думая, что общественная стража сильнее поразит их. Посмотри, пожалуйста, как слагается жизнь апостолов. Сначала – печаль по причине вознесения Христова, потом – радость по причине сошествия Святаго Духа; снова – печаль от людей, ругавшихся над ними, и снова радость – от умножения верующих и от знамения (чуда); далее – опять печаль вследствие заключения Петра и Иоанна (см.Деян. 4, 3), и опять – радость вследствие оправдания; наконец теперь от блеска при явлении Ангела в темнице и знамений – радость, а от первосвященника и от тех, что схватили их, – печаль. Да, их жизнь, можно сказать, такова, какова жизнь всех, живущих по Богу.
      cn: '「充满了嫉妒」是什么意思？这意味着他们被使徒们所说的话激动和搅动了。现在他们以极大的凶猛攻击使徒们，但没有立刻审判他们，因为他们认为公共的卫兵能更猛烈地打击使徒们。


        请看，使徒们的生活是如何构成的。先是因基督升天而忧伤，然后是因圣灵降临而喜乐；再次是因辱骂他们的人而忧伤，再次是因信徒增多和神迹（奇迹）而喜乐；接着，又是因彼得和约翰被监禁而忧伤（使徒行传 4:3），又是因得蒙辩护而喜乐；最后，现在是因天使在监狱中显现的光辉和神迹而喜乐，而因大祭司和那些逮捕他们的人而忧伤。是的，可以说，他们的生活正是如此，如同所有按上帝旨意生活之人的生活。'
  - type: paragraph
    text:
      ru: «Ангел Господень ночью отворил двери темницы». Ангел вывел их и на радость им, и на пользу иудеев.
      cn: «上主的使者夜间开启了监狱的门». 使者领他们出来，既使他们喜乐，也为了犹太人的益处。
  - type: paragraph
    text:
      ru: 'Деян.5:26–32.Тогда начальник стражи пошел со служителями и привел их без принуждения потому что боялись народа, чтобы не побили их камнями. Приведя же их, поставили в синедрионе; и спросил их первосвященник, говоря: не запретили ли мы вам накрепко учить о имени сем? и вот, вы наполнили Иерусалим учением вашим и хотите навести на нас кровь Того Человека. Петр же и Апостолы в ответ сказали: должно повиноваться больше Богу, нежели человекам. Бог отцов наших воскресил Иисуса, Которого вы умертвили, повесив на древе. Его возвысил Бог десницею Своею в Начальника и Спасителя, дабы дать Израилю покаяние и прощение грехов. Свидетели Ему в сем мы и Дух Святый, Которого Бог дал повинующимся Ему.'
      cn: (使徒行传 5:26-32) 於是守殿官和差役去帶使徒來，並沒有用強暴，因為怕百姓用石頭打他們。 帶到了，便叫使徒站在公會前；大祭司問他們說： 「我們不是嚴嚴的禁止你們，不可奉這名教訓人嗎？看哪，你們倒把你們的道理充滿了耶路撒冷，想要叫這人的血歸到我們身上。」 彼得和眾使徒回答說：「順從　上帝，過於順從人，是應當的。 你們所殺害，所掛在木頭上的耶穌，我們祖宗的　上帝已經叫他復活。 　上帝用右手將他高舉，叫他作　君王，作　救主，為要將悔改和恕罪的恩賜給以色列。 我們為這些事作見證；　上帝賜給順從之人的　聖靈也為這些事作見證。」


        于是卫队官长和差役一同去，把使徒们带来，没有用强迫的手段，因为他们怕民众，恐怕被民众用石头打死。他们把使徒们带来后，将他们安置在公议会中；大祭司审问他们，说：「我们岂不是严严地吩咐过你们，不可奉这名教训人吗？你们看，你们倒把你们的教导传遍了耶路撒冷，并且想要把那个人的血的责任归到我们身上。」彼得和众使徒回答说：「我们理当顺从上帝，胜于顺从人。我们祖宗的上帝使耶稣复活了，就是你们所钉在木头上杀害的。上帝用祂自己的右手将祂高举，使祂作君王，作救主，为要赐给以色列人悔改和罪的赦免。我们为这些事是祂的见证人，还有圣灵也是见证，就是上帝赐给顺从祂之人的。」'
  - type: paragraph
    text:
      ru: После этого следовало бояться Бога, охранявшего апостолов, как птенцов, от рук их. И двойное укрепление темницы, то есть и печать, и люди, и вообще все достаточно было, чтобы убедить, что случившееся было действием силы Божественной. А они говорят:«Не запретили ли мы вам..?»Что же, если вы и запретили? Вот если бы и апостолы согласились тогда с вами и решили повиноваться вам, то теперешние ваши требования были бы справедливы; если же они сказали тогда, что не будут повиноваться, то какой смысл в ваших теперешних требованиях?
      cn: 在此之后，人就当敬畏上帝，祂守护使徒如同保护雏鸟，免遭那些人的手。还有，监牢的双重加固——即封印和看守的人，以及所有的一切——都足以令人确信，所发生的一切乃是上帝神圣力量的作为。然而他们却说：「我们不是已经禁止过你们了吗……？」那么，即便你们禁止了，又如何呢？假若那时使徒们同意了你们，并决定顺从你们，那么你们现在所提出的要求才算公正；但如果他们那时就已经表明不愿顺从，那么你们现在所提出的要求又有什么意义呢？
  - type: paragraph
    text:
      ru: «И хотите навести на нас кровь Того Человека». И теперь думают еще, что Христос был простой человек. Говорят же так, желая показать этим, что запрещение было необходимо для них и что они распорядились так, щадя свою жизнь, а скорее говорили это для того, чтобы раздражить против них толпу.
      cn: 「你们想要把那人的血归到我们头上。」而今，他们仍然以为基督只是一个普通人。他们如此说，是想要以此表明禁令对他们来说是必要的，并且他们如此行是为保全自己的性命；不如说，他们说这话是为了煽动人群，使之反对他们。
  - type: paragraph
    text:
      ru: «Должно повиноваться больше Богу, нежели человекам». Без жестокости отвечают апостолы как потому, что они были учителями, так и потому, что не гневались на иудеев, но сожалели о них и хотели освободить их от обольщения и гордости.
      cn: «应当顺从上帝，过于顺从人。» 使徒们不带一丝残忍地回应，既因为他们是教师，也因为他们没有对犹太人发怒，而是怜悯他们，并渴望将他们从迷惑和骄傲中解救出来。
  - type: paragraph
    text:
      ru: «Свидетели Ему в сем мы и Дух Святый». О воскресении более не было уже речи. А что дарует Господь отпущение, тому свидетели«и мы и Дух Святый», Который никак не сошел бы, если бы прежде не были отпущены грехи. И смотри, как к упоминанию о злодеянии апостолы присовокупляют слово об отпущении грехов, показывая, что поступки их заслуживали смерти, а то, что они получили, получали как от благодетеля. Что же касается выражения:«Его возвысил Бог… в Начальника и Спасителя», так они употребили его, приписывая все Отцу, чтобы не подумали, что Сын чужд Отца. Но почему о том, что апостолы вышли из темницы, узнали первосвященники и прочие не тотчас? Это для того, чтобы, оставаясь некоторое время в недоумении, они легче могли понять и уразуметь, что это было действием силы Божественной.
      cn: 「我们和圣灵都是这些事的见证。」关于复活之事，已无需再言。而上主所赐予的赦免，我们和圣灵都是其见证，因为若非罪孽先蒙赦免，圣灵绝不会降临。你看，使徒们如何将罪行与罪的赦免一并提及，以此表明，他们的行为本该招致死亡，而他们所蒙受的，却是作为蒙受施恩者的恩赐。至于「上帝将祂高举……作君王和救主」这一说法，使徒们之所以如此使用，乃是将一切都归于圣父，以免世人以为圣子与圣父是疏离的。然而，为何大祭司和其余人并非立即得知使徒们已走出监牢呢？这是为了让他们在困惑不解中停留一段时间，从而更容易明白并领悟，这乃是出于神圣力量的作为。
  - type: paragraph
    text:
      ru: '«И Дух Святый, Которого Бог дал повинующимся Ему». Не сказали: «Дух Святый, Которого Бог дал нам», но –«Которого Бог дал повинующимся Ему», вместе и показывая смирение, и открывая великие истины, а кроме того, и объявляя, что и сами иудеи могли получить Духа, потому что для того именно и допускал Бог то, что апостолы были водимы в судилище, чтобы и иудеи поучались и сами апостолы приобретали более дерзновения, и все вообще получали назидание.'
      cn: 「圣灵，是上帝赐予顺从祂的人的。」他们没有说：「上帝赐予我们的圣灵」，而是说：「上帝赐予顺从祂的人的圣灵」，这既展现了谦卑，也揭示了伟大的真理，此外，也宣告了犹太人自身也能领受圣灵，因为上帝正是为此才允许使徒们被带到公庭受审，好让犹太人受教，使徒们自己也能获得更大的坦然无惧，并且使所有人都得到训诲。
  - type: paragraph
    text:
      ru: 'Деян.5:33–36.Слышав это, они разрывались от гнева и умышляли умертвить их. Встав же в синедрионе, некто фарисей, именем Гамалиил, законоучитель, уважаемый всем народом, приказал вывести Апостолов на короткое время, а им сказал: мужи Израильские! подумайте сами с собою о людях сих, что вам с ними делать. Ибо незадолго перед сим явился Февда, выдавая себя за кого-то великого, и к нему пристало около четырехсот человек; но он был убит, и все, которые слушались его, рассеялись и исчезли.'
      cn: (使徒行传 5:33-36) 公會的人聽見就極其惱怒，商議要殺他們。 但有一個法利賽人，名叫迦瑪列，是眾百姓所敬重的教法師，在公會中站起來，吩咐人把使徒暫且帶到外面去， 就對眾人說：「以色列人哪，論到這些人，你們應當小心怎樣辦理。 從前杜達起來，自誇為大；附從他的人約有四百。他被殺後，凡附從他的全都散了，歸於無有。
  - type: paragraph
    text:
      ru: Другие, слушая апостолов, смущались, а первосвященник и бывшие с ним«разрывались от гнева и умышляли умертвить их». Что же касается Гамалиила, он был учителем Павла; и достойно удивления, как он, будучи законоучителем и человеком по уму рассудительным, не уверовал еще до сих пор. Это потому, что и Павел еще не уверовал.
      cn: 其他人聆听使徒们时感到困惑，而大祭司和与他同在的人则「怒不可遏，并图谋杀害他们」。至于迦玛列，他是保罗的老师；令人惊奇的是，他作为一个律法教师和心思缜密之人，至今仍未信主。这是因为连保罗也还没有信主。
  - type: paragraph
    text:
      ru: «Подумайте сами с собою о людях сих, что вам с ними делать». Обрати внимание на мудрую приспособительность речи, – на то, как Гамалиил тотчас поверг их в страх, и чтобы не подать подозрения, что он разделяет мысли апостолов, беседует с иудеями как с людьми одних убеждений и не особенно резко выражается, а говорит:«подумайте… что вам с ними делать».
      cn: 「你们自己思量一下这些人，你们该如何处置他们。」 请留意他言语中智慧的适应性——伽马列如何立刻使他们心生畏惧，并且为了避免让他们怀疑他与使徒们思想一致，他与犹太人交谈时如同与那些有着相同信念的人，并没有特别严厉地表达，而是说：「你们自己思量……你们该如何处置他们。」
  - type: paragraph
    text:
      ru: '«Ибо незадолго перед сим». Приводит два примера и упоминает не о древних, но о последних событиях, потому что эти последние сильнее в деле убеждения. Поэтому, указывая на них, Гамалиил и говорил«незадолго перед сим». Зная и другие примеры, он удовольствовался этими двумя, то есть примером Февды и Иуды Галилеянина (см. ст. 37), потому что«устами двух или трех свидетелей»подтверждается«всякое слово»(Мф. 18, 16). Не сказал, кем были убиты, но говорит, что все разошлись. О Февде упоминает и Иосиф Флавий в девятнадцатой книге древностей, как говорит Евсевий в четвертой книге церковной истории. Вот слова последнего: «Во время наместничества в Иудее Фада, один лжеучитель, по имени Февда, убеждал народ взять имущество и следовать за ним к реке Иордан; Февда говорил, что он – пророк, и утверждал, что рассечет реку и сделает ее удобопроходимой, и многих обольстил. Впрочем, Фад не допустил, чтобы они осуществили свою неразумную мысль, но послал отряд конницы, который многих из них избил и многих взял живыми; а самому Февде отрубили голову и принесли в Иерусалим».'
      cn: 「因为不久之前。」加玛列（Gamaliel）引用了两个例子，提及的不是古老的事件，而是最近发生的，因为后者在说服力方面更强。因此，加玛列在提及这些事件时说「不久之前」。尽管知道其他例子，他只引用了这两个，即提乌达（Theudas）和加利利人犹大（Judas the Galilean）的例子（参阅 使徒行传 5:37），因为「凭两三个见证人的口，句句都可定准」（马太福音 18:16）。（文本）没有说他们是被谁杀害的，但却说，众人就都散了。提乌达也被约瑟夫斯（Josephus Flavius）在《犹太古史》第十九卷中提及，正如优西比乌（Eusebius）在《教会史》第四卷中所述。以下是后者的话：「在法杜斯（Fadus）任犹太巡抚期间，有一个名叫提乌达（Theudas）的假教师，劝说百姓带着财物跟随他到约旦河；提乌达自称是先知，声称他能将河流劈开，使之易于通行，并且诱惑了许多人。然而，法杜斯没有允许他们实施其愚蠢的念头，而是派出一队骑兵，骑兵击杀了他们中的许多人，也活捉了许多人；而提乌达本人则被斩首，首级被带到耶路撒冷。」
  - type: paragraph
    text:
      ru: Деян.5:37–42.После него во время переписи явился Иуда Галилеянин и увлек за собою довольно народа; но он погиб, и все, которые слушались его, рассыпались. И ныне, говорю вам, отстаньте от людей сих и оставьте их; ибо если это предприятие и это дело – от человеков, то оно разрушится; а если от Бога, то вы не можете разрушить его; берегитесь, чтобы вам не оказаться и богопротивниками. Они послушались его; и, призвав Апостолов, били их и, запретив им говорить о имени Иисуса, отпустили их.
      cn: (使徒行传 5:37-42) 此人以後，當上稅的時候，又有加利利的猶大起來，引誘許多百姓跟從他。他也滅亡；凡附從他的人也都四散了。 現在，我勸你們不要管這些人，任憑他們吧。他們所謀的、所行的，若是出於人，必要敗壞； 若是出於　上帝，你們就不能敗壞他們，恐怕你們倒是攻擊　上帝了。」 公會的人聽從了他，便叫使徒來，把他們打了，又吩咐他們不可奉耶穌的名講道，就把他們釋放了。 他們離開公會，心裏歡喜，因被算是配為這名受辱。 他們就每日在殿裏、在家裏、不住的教訓人，傳耶穌是　基督。


        在他以后，在人口普查的时候，加利利人犹大兴起，迷惑了许多百姓跟随他；但他灭亡了，凡听从他的，都烟消云散了。如今，我告诉你们，你们避开这些人，让他们去吧；因为这计划或这工作若是出于人，就会自行瓦解；倘若是出于上帝，你们就不能毁灭它；你们要小心，恐怕你们反而成了与上帝作对的人。他们听从了他的话；于是把使徒们召了来，鞭打了他们，又禁止他们奉耶稣的名讲论，就把他们释放了。'
  - type: paragraph
    text:
      ru: «Они же пошли из синедриона, радуясь, что за имя Господа Иисуса удостоились принять бесчестие. И всякий день в храме и по домам не переставали учить и благовествовать об Иисусе Христе.
      cn: 他们就从公会里出来，欢喜，因为他们配为着主耶稣的名受凌辱。并且他们天天在圣殿里，又在各人的家里，不住地施教，传扬耶稣基督的福音。
  - type: paragraph
    text:
      ru: Во времена правления Пилата случилось, кажется, восстание галилеян, увлекшихся учением Иуды Галилеянина. Учение же Иуды состояло в следующем. Он говорил, что «господином»[20]не следует называть никого ни ради чести, ни за любомудрие, что не следует называть так даже царя. И многие из последователей его подверглись жестоким наказаниям за то, что не называли господином кесаря, и за их учение, что не следует возносить Богу никаких других жертв, кроме установленных в законе Моисеевом. Следуя этому учению, они запрещали приносить жертвы о спасении царя и римского народа. Пилат, естественно, вознегодовал за это на галилеян и приказал, чтобы в то время, когда они будут приносить законные, по их мнению, жертвы, убивали и их самих, так что с приносимыми жертвами смешивалась кровь и приносящих, как это видно и из Евангелия от Луки (см.Лк. 13, 1–3).
      cn: 在彼拉多执政时期，似乎发生了一件事：加利利人因受加利利人犹大的教导所吸引，发动了叛乱。犹大的教导如下：他说，无论是因为尊荣，还是因为智慧，都不应当称呼任何人作「主」[20]，甚至连君王也不应如此称呼。他的许多追随者，因不称凯撒为「主」，以及因他们的教导，即除了摩西律法中所规定的祭献以外，不应当向上帝献上任何其他的祭献，而遭受了严酷的惩罚。遵照这个教导，他们禁止为君王和罗马人民的得救献祭。彼拉多对此自然而然地对加利利人感到愤怒，并下令，在他们按照自己的观点献上合乎律法的祭献时，也要将他们自己杀死，以致于献上的祭献与献祭者的鲜血混杂在一起，正如路加福音所记载的（参路加福音 13:1-3）。
  - type: paragraph
    text:
      ru: '«Отстаньте от людей сих». Указав на примеры погибших лжеучителей, Гамалиил советует им подумать и о себе: опасайтесь, чтобы среди стараний погубить других самим не погибнуть, потому что тот, кто идет против того, что угодно Богу, губит не противника, а себя.'
      cn: «不要管这些人了». 在指出了那些灭亡的假教师的例子后，迦玛列建议他们也为自己考虑：你们当心，不要在竭力毁灭他人的时候，自己反而灭亡，因为凡是与上帝所喜悦的作对的人，毁灭的不是敌人，而是他自己。
  - type: paragraph
    text:
      ru: '«Если это предприятие и это дело – от человеков», то какая нужда в ваших домогательствах? А"если"оно"от Бога", то и при всем старании вашем вы не можете разорить его. Не сказал прямо, что дело это"от Бога", но не сказал и того, что оно – дело человеческое, потому что если бы сказал, что оно"от Бога", то первосвященник и бывшие с ним стали бы возражать, а если бы сказал, что оно –«от человеков», то предал бы апостолов в их руки. Таким мудрым построением речи Гамалиил принуждает их ждать ее конца. Но, смотри, не сказал: «если оно не разорится, то оно – от Бога», но сказал: «если оно – от Бога, то не разорится».'
      cn: 「如果这事业和这事情——是出于人的」，那你们何必自寻烦恼呢？而「如果」它是「出于上帝的」，那么即便你们倾尽全力也无法将其摧毁。他没有直说这事是「出于上帝的」，也没有说它是出于人的事，因为如果他说它是「出于上帝的」，那么大祭司和与他在一起的人就会提出反对，而如果他说它是「出于人的」，他就会将使徒们交到他们手中。伽马列以此智慧的言辞结构，迫使他们等待其结果。但，你看，他没有说：「如果它不被摧毁，那么它——就是出于上帝的」，而是说：「如果它——是出于上帝的，那么它就不会被摧毁。」
  - type: paragraph
    text:
      ru: «Они послушались его». Послушались потому, что он говорил это не при апостолах. Как же иудеи били апостолов, если послушались его? Послушались его в том отношении, что отказались от намерения убить их, потому что они хотели этого и потом оставили это свое желание, но били их, удовлетворяя свой гнев.
      cn: «他们听从了他。» 他们听从了，因为他是在使徒们不在场时说的。既然他们听从了他，犹太人又怎会殴打使徒呢？他们听从了他，是在于他们放弃了杀害使徒们的意图，因为他们曾有此愿望，之后又放弃了此愿望；但他们殴打使徒们，是为了发泄他们的怒气。
- type: heading1
  text:
    ru: Глава шестая
    cn: 第六章
  children:
  - type: paragraph
    text:
      ru: Деян.6:1.В эти дни, когда умножились ученики, произошел у Еллинистов ропот на Евреев за то, что вдовицы их пренебрегаемы были в ежедневном раздаянии потребностей.
      cn: (使徒行传 6:1) 在那些日子，門徒數目增多，有希臘人向希伯來人發怨言，因為在天天的供給上忽略了他們的寡婦。
  - type: paragraph
    text:
      ru: Не в те же самые дни, когда Ангел освободил апостолов из темницы, но через несколько дней после этих, – такой оборот речи обычен Писанию. А эллинистами, по моему мнению, называет лиц, говоривших по-эллински.
      cn: 并非在天使将使徒们从监狱中释放出来的那些日子里，而是在这之后的几天——这种表达方式在圣经中是常见的。而依我之见，他将「希腊化信徒」称为那些讲希腊语的人。
  - type: paragraph
    text:
      ru: «В ежедневном раздаянии потребностей».
      cn: 在每日所需的分派中。
  - type: paragraph
    text:
      ru: Итак, служение вдовицам было делом каждодневным. Служением называет дело милостыни. Презрение же вдовиц произошло не от худых качеств, но от оплошности народа. Поэтому как только забота о них была народу предложена, прекратилось и горе их.
      cn: 如此，服事寡妇们是每日的事务。「服事」指的是施舍之事。然而，对寡妇们的轻忽并非源于恶劣的品德，而是由于民众的疏忽。因此，一旦对她们的关照被提议给民众，她们的忧伤也就止息了。
  - type: paragraph
    text:
      ru: 'Деян.6:2–7.Тогда двенадцать Апостолов, созвав множество учеников, сказали: нехорошо нам, оставив слово Божие, пещись о столах. Итак, братия, выберите из среды себя семь человек изведанных, исполненных Святого Духа и мудрости; их поставим на эту службу. А мы постоянно пребудем в молитве и служении слова. И угодно было это предложение всему собранию; и избрали Стефана, мужа, исполненного веры и Духа Святого, и Филиппа, и Прохора, и Никанора, и Тимона, и Пармена, и Николая Антиохийца, обращенного из язычников; их поставили перед Апостолами, и сии, помолившись, возложили на них руки. И слово Божие росло, и число учеников весьма умножалось в Иерусалиме; и из священников очень многие покорились вере.'
      cn: (使徒行传 6:2-7) 十二使徒叫眾門徒來，對他們說：「我們撇下　上帝的道去管餐桌的事，原是不合宜的。 所以弟兄們，當從你們中間選出七個有好名聲，被聖靈充滿，智慧充足的人，我們就派他們管理這事。 但我們要專心以祈禱、傳道為事。」 大眾都喜悅這話，就揀選了司提反，乃是大有信心、　聖靈充滿的人，又揀選腓利、伯羅哥羅、尼迦挪、提門、巴米拿，並進猶太教的安提阿人尼哥拉， 叫他們站在使徒面前。使徒禱告了，就按手在他們頭上。 　上帝的道興旺起來；在耶路撒冷門徒數目加增的甚多；也有一大幫祭司順從了這道。
  - type: paragraph
    text:
      ru: Не сами апостолы избирают, но предоставляют избрание народу, который и имел получить пользу от служения диаконов; он и избирает, и назначает.
      cn: 使徒们自己并不拣选，而是将拣选权交予民众；这些民众将从执事的服侍中获益；他们负责拣选，也负责委任。
  - type: paragraph
    text:
      ru: «Нехорошо нам, оставив слово Божие, пещись о столах».Потому что необходимое следует предпочитать тому, что не необходимо.
      cn: «我们不当撇下上帝之道去管理饭食。»因为，必需的事物理当优先于非必需的事物。
  - type: paragraph
    text:
      ru: «Выберите из среды себя семь человек изведанных, исполненных Святого Духа и мудрости».Называет писатель их не просто духовными, но исполненными Духа и премудрости, потому что принимать жалобы вдовиц было делом величайшей мудрости.
      cn: «从你们中间选出七位有良好见证的、被圣灵充满且有智慧的人来。» 作者称他们不只是属灵的，更是被圣灵充满且有智慧的，因为受理寡妇们的抱怨乃是需要极大智慧的事。
  - type: paragraph
    text:
      ru: '«Помолившись, возложили на них руки».Смотри, как Лука немногословен: не говорит, как были рукоположены, но говорит только, что были рукоположены с молитвой. На мужа возлагается рука – вот в чем состоит хиротония, но все совершает Бог. Какую же хиротонию получили эти семь мужей? Диаконскую ли? Они рукоположены были именно на это дело, то есть на доставление верующим необходимых потребностей.'
      cn: 「他们祷告后，就按手在他们身上。」看，路加多么言简意赅：他没有说他们是如何被按立的，只说他们是藉着祷告被按立的。手按在人身上——这便是按立礼的组成，但一切都是上帝成就的。这七位男子所领受的是何种按立礼呢？是执事职的按立礼吗？他们被按立正是为了这项工作，即向信徒供给所需。
  - type: paragraph
    text:
      ru: «Число учеников весьма умножалось в Иерусалиме».. Не просто сказал об этом, но так, что показал, как велика сила милостыни и этого учреждения диаконов.
      cn: 「在耶路撒冷，门徒的数目大大增加了。」.. 这并非仅仅论及此事，而是借此显明了施舍与执事职分设立所具有的何等浩大的力量。
  - type: paragraph
    text:
      ru: 'Деян.6:8–15.А Стефан, исполненный веры и силы, совершал великие чудеса и знамения в народе. Некоторые из так называемой синагоги Либертинцев и Киринейцев и Александрийцев и некоторые из Киликии и Асии вступили в спор со Стефаном; но не могли противостоять мудрости и Духу, Которым он говорил. Тогда научили они некоторых сказать: мы слышали, как он говорил хульные слова на Моисея и на Бога. И возбудили народ и старейшин и книжников и, напав, схватили его и повели в синедрион. И представили ложных свидетелей, которые говорили: этот человек не перестает говорить хульные слова на святое место сие и на закон. Ибо мы слышали, как он говорил, что Иисус Назорей разрушит место сие и переменит обычаи, которые передал нам Моисей. И все, сидящие в синедрионе, смотря на него, видели лице его, как лице Ангела.'
      cn: (使徒行传 6:8-15) 司提反滿得信心能力，在民間行了大奇事和神蹟。 當時有稱利百地拿會堂的幾個人，並有古利奈、亞力山太、基利家、亞細亞、各處會堂的幾個人，都起來和司提反辯論。 司提反是以智慧和靈說話，眾人敵擋不住， 就買出人來說：「我們聽見他說褻瀆摩西和　上帝的話。」 他們又聳動了百姓、長老，並文士，就忽然來捉拿他，把他帶到公會去， 設下假見證，說：「這個人說褻瀆的話，不住的蹧踐聖所和律法； 我們曾聽見他說：『這拿撒勒的耶穌要毀壞此地，也要改變摩西所交給我們的規條。』」 在公會裏坐著的人都定睛看他，見他的面貌，好像天使的面貌。
  - type: paragraph
    text:
      ru: 'Смотри, как из семи один был предпочтен прочим: хотя хиротония и была общей, однако же этот стяжал большую благодать. Обрати взор и на то, что до этого времени он не творил чудес, но стал творить чудеса, когда сделался известным как избранный и рукоположенный, чтобы показать, что одной благодати недостаточно, но необходима и хиротония. Итак, через рукоположение сообщилось приращение Духа, потому что еще до хиротонии, при избрании, о нем было засвидетельствовано, как исполненном Духа, но дары Духа различны.'
      cn: 看哪，七人中有一人蒙拣选超越众人：虽然按手礼是普遍的，然而这人却领受了更大的恩典。也请留意，在此之前他并未行神迹，但当他显明为蒙拣选并受按立之人时，就开始行神迹了，为要表明仅有恩典是不够的，按手礼也是不可或缺的。因此，通过按手礼，圣灵得了增益，因为在按手礼之前，当他蒙拣选时，已被见证为充满圣灵之人，但圣灵的恩赐各有不同。
  - type: paragraph
    text:
      ru: '«Вступили в спор со Стефаном». В раздражении и гневе спорят для того, чтобы вынудить его сказать что-нибудь. А он, быть может, беседовал очень откровенно и говорил о прекращении закона, или, вернее, не говорил, а намекал, потому что если бы он говорил ясно, то эти«некоторые»не имели бы нужды в лжесвидетелях. Но замечай: он не предоставляет себе права учить, но вынуждается к этому теми, кто спорит с ним.'
      cn: 「与司提反起了争辩。」他们带着恼怒和愤怒争辩，是为了要强迫他说出什么话来。而他，或许曾极其坦诚地交谈，并谈及律法的废止；或者，更确切地说，并非明说，而是暗示，因为如果他明说的话，那么这些「某些人」就不需要假见证人了。但请留意：他并非自行获取教导的权利，而是被那些与他争辩的人所强迫如此。
  - type: paragraph
    text:
      ru: «Тогда научили они некоторых сказать». Спорщики свидетельствуют не сами, – потому что их тотчас изобличили бы, что они клевещут на Стефана по зависти, – но подкупают других, чтобы не сочли это дело неправым, – потому что они не Бога боялись, оскверняя себя убийством, но взор свой обращали на мнение людей.
      cn: 那时他们教唆一些人说。争论者们不亲自作证，——因为他们会立刻被揭露是出于嫉妒而诬蔑司提反——而是收买他人，以免这事被视为不义，——因为他们在以谋杀玷污自己的时候，并不敬畏上帝，而是将目光投向人们的看法。
  - type: paragraph
    text:
      ru: '«И представили ложных свидетелей, которые говорили». Всюду лжесвидетельство. Не хотели убить просто, но по приговору, рассчитывая на то, что этим они подорвут доброе мнение о тех, кого убивали. Не сказали о Стефане: «говорит», но –«не перестает. Ибо мы слышали, как он говорил, что Иисус Назорей («Назорей»говорится в поношение)«разрушит место сие». Это говорили и о Христе:«Разрушающий храм»(Мф. 27, 40). Велика была между ними боязнь зацерковь, но обвинение было двойное – обвинение в том, что он намерен изменить обычаи, и в том, что намерен ввести иные обычаи.'
      cn: 「他们带来假证人，这些假证人说。」到处都是假证。他们并非仅仅想要杀死，而是要通过判决，指望以此败坏人们对那些被杀之人的良好声誉。他们论及司提反时，没有说：「他正在说」，而是说：「他不住地说。」因为我们听见他说，拿撒勒人耶稣（「拿撒勒人」一词带有羞辱之意）将要毁坏这地方。他们也曾论及基督说：「毁坏圣殿者」（马太福音 27:40）。他们对教会的惧怕甚大，但指控却是双重的——指控他意图改变既有习俗，并意图引入新的习俗。
  - type: paragraph
    text:
      ru: «Все, сидящие в синедрионе, смотря на него, видели лице его, как лице Ангела». Бог соделал Стефана приятным; так как он имел еще что-то сказать, то, чтобы тотчас поразить их его взором, Бог осиял его лицо, потому что и к лицам людей, исполненных духовной благодати, любящие их относятся с вожделением, а враги с почтением.
      cn: 「凡在公会里坐着的人，都定睛看他，见他的面貌，好像天使的面貌。」上帝使司提反成为蒙悦纳的；因为他还有话要说，所以，为了立刻以他的容貌震慑他们，上帝光照了他的面容，因为即使是对于充满属灵恩典之人的面貌，爱他们的人也会以渴慕之心对待，而仇敌则以敬意对待。
- type: heading1
  text:
    ru: Глава седьмая
    cn: 第七章
  children:
  - type: paragraph
    text:
      ru: 'Деян.7:1–7.Тогда сказал первосвященник: так ли это? Но он сказал: мужи братия и отцы! послушайте. Бог славы явился отцу нашему Аврааму в Месопотамии, прежде переселения его в Харран, и сказал ему: «выйди из земли твоей и из родства твоего и из дома отца твоего, и пойди в землю, которую покажу тебе»(Быт. 12, 1).«Тогда он вышел из земли Халдейской и поселился в Харране; а оттуда, по смерти отца его, переселил его Бог в сию землю, в которой вы ныне живете. И не дал ему на ней наследства ни на стопу ноги, а обещал дать ее во владение ему и потомству его по нем, когда еще был он бездетен. И сказал ему Бог, что потомки его будут переселенцами в чужой земле и будут в порабощении и притеснении лет четыреста. «Но Я, – сказал Бог, – произведу суд над тем народом, у которого они будут в порабощении; и после того они выйдут и будут служить Мне на сем месте».'
      cn: (使徒行传 7:1-7) 大祭司就說：「這些事果然有嗎？」 司提反說：「諸位父兄請聽。當日我們的祖宗亞伯拉罕在美索不達米亞還未住哈蘭的時候，榮耀的　上帝向他顯現， 對他說：『你要離開本地和親族，往我所要指示你的地去。』 他就離開迦勒底人之地，住在哈蘭。他父親死了以後，　上帝使他從那裏搬到你們現在所住之地。 在這地方，　上帝並沒有給他產業，連立足之地也沒有給他；但應許要將這地賜給他和他的後裔為業；那時他還沒有孩子。 　上帝這樣曉諭說：『他的後裔必寄居外邦；那裏的人要叫他們作奴僕，苦待他們四百年。』 　上帝又說：『使他們作奴僕的那國，我要懲罰。以後他們要出來，在這地方事奉我。』

        那时大祭司说：「难道不是这样吗？」但他说：「弟兄们和父老们，请听！荣耀的上帝向我们的先祖亚伯拉罕显现，当时他在美索不达米亚，在他迁居哈兰之前，并对他说：「离开你的本地、你的亲族和你父的家，到我所要指示你的地去。」(创世记 12:1)他于是离开迦勒底人的地，住在哈兰；后来，在他父亲去世以后，上帝将他从那里迁到你们现今所居住的这片土地。祂并没有在这地上赐给他任何产业，连立足之地都没有，却应许要将这地赐给他和他的后裔为业，当时他还没有儿女。上帝又对他说，他的后裔必在异地作客旅，并且要被奴役和受压迫四百年。「但上帝说，我必审判那奴役他们的民族；之后他们将出来，并在此地事奉我。」'
  - type: paragraph
    text:
      ru: 'Сами они и не думали о том, что позволяли себе богохульные действия, а его обвиняют в богохульстве за слова. На уме у них всегда был Моисей – они не столько заботились о делах Божиих, сколько о постановлениях Моисея. Но Стефан в самом начале речи опровергает их мнение и доказывает, что ни храм, ни обряды не имеют значения и что они не превозмогут проповеди евангельской, что Бог трудное и невозможное делает легким и возможным. Замечай: обвинения их именно в том, что, пользуясь постоянно Божиим человеколюбием, они заплатили своему Благодетелю противным и домогаются невозможного. Стефан показывает также, что обетование было дано прежде, чем эта земля, прежде обрезания, прежде жертвы, прежде храма, что они получили эту землю, равно как и обрезание и закон, не по заслугам, но земля была наградой за послушание, что, когда дано было обрезание, обетование еще не было приведено в исполнение и что все это были прообразы. Прекрасно именует Бога в начале речи"Бог славы", потому что Он соделал славными тех, кого поносили. Говорит также, что еще не было храма, а Авраам удостоился видеть Бога, что он своими предками имел персов и жил в чужой земле. Замечай, как Стефан отводит их мысль от чувственного, начав с местности, так как и речь была о месте. Если же Бог есть Бог"славы", то Он не нуждается в том, чтобы иметь славу от вас посредством вашего храма, потому что Он Сам – источник всякой славы и всякого добра.'
      cn: 他们自己根本没有意识到，他们所做的是亵渎上帝的行为，而他却因为言语被指控为亵渎上帝。在他们心中，始终只有摩西——他们关心的不是上帝的事工，而是摩西的典章。但司提反在讲道之初就驳斥了他们的观点，并证明无论是圣殿还是祭祀礼仪都毫无意义，并且它们无法胜过福音的宣讲，因为上帝能使艰难和不可能的变为轻省和可能。留意：对他们的指控正是因为，他们持续蒙受上帝的慈爱，却以悖逆偿还他们的恩主，并追求那不可能之事。司提反也指出，应许先于这片土地、先于割礼、先于祭祀、先于圣殿而赐下；他们得到这片土地，以及割礼和律法，并非因为他们的功劳，而是这片土地是顺服的奖赏；并且，割礼赐下之时，应许尚未实现，所有这些都只是预表。他在讲道之初，美妙地将上帝称为「荣耀的上帝」，因为祂使那些曾受辱骂的人变得荣耀。他还说，当时圣殿尚未存在，而亚伯拉罕却蒙受殊荣，得以看见上帝，并且他自己的祖先是波斯人，生活在异地。留意，司提反如何将他们的思想从感官事物上引开，他从地域开始论述，因为他所说的正是关于地方。既然上帝是「荣耀的上帝」，那么祂就不需要通过你们的圣殿从你们那里获得荣耀，因为祂自己就是一切荣耀和一切良善的源泉。
  - type: paragraph
    text:
      ru: «Выйди из земли твоей и из родства твоего». Как же Писание говорит, что пожелал выйти отец Авраама (см.Быт. 11, 31), а здесь говорится, что Аврааму было сказано«выйди из земли твоей?»Отсюда мы заключаем, что явление Бога Аврааму подействовало на отца его и он пожелал выйти из земли Халдейской. Но этим самым Стефан показывает, что иудеи не дети Авраамовы, потому что тот, покинув и отечество, и родных, явил послушание, а они непослушны.
      cn: 「离开你的本地和你的亲族。」那么圣经如何说亚伯拉罕的父亲愿意离开（参见创世记 11:31），而这里又说亚伯拉罕被吩咐「离开你的本地」呢？由此我们推断，上帝向亚伯拉罕的显现影响了他的父亲，并且他愿意离开迦勒底的土地。但斯德望以此表明，犹太人并非亚伯拉罕的子孙，因为亚伯拉罕既离开了家园，也离开了亲族，展现了顺从，而他们却不顺从。
  - type: paragraph
    text:
      ru: '«И не дал ему на ней наследства ни на стопу ноги». Наблюдай, как беседой об обетованной земле наводит их на истину. Почему не дал Господь наследия Аврааму? Потому, что земля эта была прообразом другой земли.«А обещал дать ее». Замечаешь ли, что не без причины снова повторяет: не говорит «дал», но –«обещал дать». Если Авраам был чужеземцем и пришельцем и через некоторое время должен был переселиться, то как мог он иметь эту землю во"владение!"Итак, наследие Авраама сохраняется через семя его, которое есть Христос, так как с Ним будут царствовать и святые, по слову Писания:«Ибо приидет Сын Человеческий во славе Отца Своего»(Мф. 16, 27; 25, 31), царствуя над всеми народами.'
      cn: 「并且没有赐给他在那地上的产业，连立足之地也没有。」当留意，他是如何藉着谈论应许之地，引导他们明白真理的。为何上主没有赐给亚伯拉罕产业？因为这地是预表另一片土地的。「却应许要赐给他。」你是否注意到，他再次重复并非没有原因：没有说「赐给了」，而是——「应许要赐给」。如果亚伯拉罕是异乡人与寄居者，并且在一段时间后必须迁徙，那么他怎能拥有这地为「产业！」因此，亚伯拉罕的产业是藉着他的后裔得以保存的，这后裔就是基督，因为圣徒也将与祂一同作王，按照圣经的话：「因为人子要降临在祂父的荣耀里」 (马太福音 16:27，25:31)，祂将作王，统管万民。
  - type: paragraph
    text:
      ru: «И потомству его по нем, когда еще был он бездетен». Снова указывает, что Бог из невозможного силен сделать возможное, потому что сказано, что Он сделает господином Палестины того, кто был в Персии и находился на таком далеком расстоянии. Но тут же заключается указание и на великое человеколюбие Божие, и на великую веру Авраама, потому что выражение«когда еще был он бездетен»показывает повиновение Авраама и веру, хотя то, что с ним было тогда, склоняло его к противоположному мнению, так как после того как пришел, не имел чего-либо«ни на стопу ноги», да и потом не имел.
      cn: 「他的后裔在他之后，当他尚无子嗣时」。这再次指出，上帝有能力使不可能变为可能，因为所言显示，祂将使一个身在波斯、相距遥远之人，成为巴勒斯坦的掌管者。但其中也立刻包含着对上帝伟大的仁爱，以及亚伯拉罕伟大的信心的指明，因为「当他尚无子嗣时」这句表达，显示了亚伯拉罕的顺从与信心，尽管当时他所处的境况，却倾向于使他持相反的看法，因为他来到之后，连「一脚之地」都没有拥有，而且之后也没有拥有。
  - type: paragraph
    text:
      ru: «И сказал ему Бог, что потомки его будут переселенцами в чужой земле». Смотри, за сколько лет дано обетование и существовал его образ, и никогда не было образа жертвы, никогда – образа обрезания. Но этим показывает также, как Бог попускал израильтянам переносить несчастья, хотя не было ничего такого, в чем бы они были виновны.
      cn: 「上帝对他说，他的后裔将是寄居在异地的人。」看哪，这应许在多少年前赐下，并存在着它的预象，却从未有过祭献的预象，也从未有过割礼的预象。但这同样显明，上帝如何容许以色列人承受苦难，尽管他们并没有犯下任何使他们有罪的事。
  - type: paragraph
    text:
      ru: '«И будут в порабощении и притеснении лет четыреста». Написанное в книге Исход не противоречит этому месту. Там сказано:«По прошествии четырехсот тридцати лет… вышло все ополчение Господне из земли Египетской»(12, 41), а здесь говорится приблизительно: через«лет четыреста». Но нужно помнить, что не сказано: «вышли, когда исполнилось четыреста лет», сказано: через лет«четыреста», чем не исключаются и остальные тридцать лет. Двадцать пять лет – от семьдесят пятого года до сотого Авраамовых, шестьдесят лет Исааковых, девяносто один год Иакова, сто десять лет Иосифовых, сто сорок четыре года в Египте – всего вместе четыреста тридцать лет. В выражении:«И после того они выйдут и будут служить Мне»можно видеть указание и на эти тридцать лет.'
      cn: 「他们必被奴役和压迫四百年。」出埃及记中所记载的，与此段经文并不矛盾。那里说：「四百三十年满了……上主的全军都出了埃及地」（出埃及记 12:41），而这里大约说：「四百年之后」。但须记住，经文并非说：「四百年满时他们便出来了」，而是说：「四百年之后」，这并不排除其余的三十年。从亚伯拉罕七十五岁到一百岁，共二十五年，以撒六十年，雅各九十一年，约瑟一百一十年，在埃及一百四十四年——总共四百三十年。在「此后他们必出来事奉我」的表达中，也可以看到对这三十年的指明。
  - type: paragraph
    text:
      ru: '""Но Я, – сказал Бог, – произведу суд над тем народом, у которого они будут в порабощении…»Те, которые озлобляли их, делали это не безнаказанно, потому что иудеи переносили горькое и тяжкое рабство, так как египтяне смотрели на них не как на рабов, а как на врагов и противников.'
      cn: '「然而我，」 上帝说，「将要审判那奴役他们的民族……」


        那些苦待他们的人，并非没有受到惩罚，因为犹太人忍受了痛苦而沉重的奴役，以至于埃及人看待他们，不像是奴隶，倒像是仇敌和对手。'
  - type: paragraph
    text:
      ru: Деян.7:8–16.И дал ему завет обрезания. По сем родил он Исаака и обрезал его в восьмой день; а Исаак родил Иакова, Иаков же двенадцать патриархов. Патриархи, по зависти, продали Иосифа в Египет; но Бог был с ним, и избавил его от всех скорбей его, и даровал мудрость ему и благоволение царя Египетского фараона, который и поставил его начальником над Египтом и над всем домом своим. И пришел голод и великая скорбь на всю землю Египетскую и Ханаанскую, и отцы наши не находили пропитания. Иаков же, услышав, что есть хлеб в Египте, послал туда отцов наших в первый раз. А когда (они пришли) во второй раз, Иосиф открылся братьям своим, и известен стал фараону род Иосифов. Иосиф послав, призвал отца своего Иакова и все родство свое, душ семьдесят пять. Иаков перешел в Египет, и скончался сам и отцы наши; и перенесены были в Сихем и положены во гробе, который купил Авраам ценою серебра у сынов Еммора Сихемова.
      cn: (使徒行传 7:8-16) 　上帝又賜他割禮的約。於是亞伯拉罕生了以撒，第八天給他行了割禮。以撒生雅各，雅各生十二個先祖。 先祖嫉妒約瑟，把他賣到埃及去；　上帝卻與他同在， 救他脫離一切苦難，又使他在埃及王法老眼前得恩典，有智慧。法老就派他作埃及國的宰相兼管全家。 後來埃及和迦南全地遭遇饑荒，大受艱難，我們的祖宗就絕了糧。 雅各聽見在埃及有糧穀，就打發我們的祖宗先往那裏去。 第二次約瑟與他弟兄們相認；他的親族也被法老知道了。 約瑟就打發弟兄請父親雅各和全家七十五個人都來。 於是雅各下了埃及，後來他和我們的祖宗都死在那裏； 又被帶到示劍，葬於亞伯拉罕在示劍用錢從示劍的父哈抹子孫買來的墳墓裏。


        并且赐给他割礼之约。此后，他生了以撒，并在第八日给他行了割礼；以撒生了雅各，雅各则生了十二位列祖。列祖们因着嫉妒，把约瑟卖到了埃及；但上帝与他同在，并救他脱离了一切苦难，赐给他智慧，并在埃及王法老面前蒙恩，法老就立他作埃及的宰相，和他全家的总管。饥荒和巨大的苦难降临在埃及和迦南全地，我们的列祖们寻不到粮食。雅各却听闻埃及有粮食，便首次打发我们的列祖们前往。而当他们第二次前往时，约瑟就向他的弟兄们显明了他自己，约瑟的家世也为法老所知晓。约瑟打发人去，召了他的父亲雅各和他所有的亲眷，共七十五人。于是雅各下到埃及，他自己和我们的列祖们都在那里去世了；并被运往示剑，安葬在坟墓里，这坟墓是亚伯拉罕用银子向示剑的哈抹子孙买的。'
  - type: paragraph
    text:
      ru: Потомкам предоставляются обетования, а предкам – бедствия. А обрезывать крайнюю плоть поведено отцам законом потому, что Авраам вышел из земли Халдейской; халдеям же, равно как и мидянам и персам, по обычаям отцов их, позволялось жениться на матерях и сестрах. Таким образом, Авраам обрезывается в знак того, что он отказывается от плотского смешения и отрицает незаконные родственные браки. А иные утверждают, что Аврааму и его потомкам заповедано было обрезание для того, чтобы было явно, что от них имеет быть Христос по плоти, так как мы знаем, что обрезание, бывшее в Ветхом Завете прообразом, заключало в себе образ спасительного крещения и отбрасыванием плоти знаменовало отречение от жизни по плоти, и обрезанных делая сынами Божиими.
      cn: 后裔获得应许，而先祖则遭遇灾祸。至于律法吩咐父辈们行割礼，是因为亚伯拉罕从迦勒底之地出来；而迦勒底人，以及米底亚人和波斯人，按照他们先祖的习俗，都允许娶母亲和姐妹。如此一来，亚伯拉罕受割礼是作为一种记号，表明他拒绝肉体的淫乱，并否认非法的近亲婚姻。而另有人主张，亚伯拉罕和他的后裔被吩咐行割礼，是为了清楚表明基督将要按肉身从他们而出，因为我们知道，割礼，在旧约中是预像，包含着救赎性洗礼的形象，并且借着割除肉体，象征着弃绝属肉体的生命，并使受割礼的人成为上帝的众子。
  - type: paragraph
    text:
      ru: «По сем родил он Исаака и обрезал его в восьмой день». Сначала обрезывается в восьмой день Исаак; отсюда и иудеи обрезываются в восьмой же день. А Измаил обрезывается будучи тринадцати лет (см.Быт. 17, 25), поэтому и потомки его, измаилиты, обрезываются, как говорит Иосиф Флавий, также в тринадцатый год.
      cn: «此后他生了以撒，并在第八日给他行了割礼»。首先，以撒是在第八日受割礼的；因此，犹太人也同样在第八日受割礼。而以实玛利是在十三岁时受割礼的（参阅创世记 17:25），因此，他的后裔，即以实玛利人，正如约瑟夫斯·弗拉维乌斯所说，也同样是在第十三年受割礼的。
  - type: paragraph
    text:
      ru: «Продали Иосифа в Египет». Не зная за братом никакой вины, они так нехорошо поступили с ним, и притом в то время, когда он пришел к ним с пищей для них, и своим поступком содействовали пророчеству, не сознавая этого и невольно сделавшись виновниками его благополучия, хотя и после многих для него испытаний. Сами же навлекли на себя великий страх и несносный стыд, хотя Иосиф и не помнил зла и ничего ужасного не замышлял против них, а, напротив, и напитал их, томившихся голодом, и сделал их известными фараону.
      cn: 「约瑟被卖到埃及去了。」他们明明不知道他兄弟有任何罪过，却如此恶待他，而且当时他正带着食物来给他们。他们的举动促成了预言的实现，虽然他们并未意识到，并且无意中成了他蒙福的缘由，尽管他为此经历了许多考验。他们自己却招致了巨大的恐惧和难以忍受的羞耻，尽管约瑟并未记恨，也没有对他们设下什么可怕的计谋；相反地，他不仅养活了饥荒中的他们，还使他们在法老面前得蒙器重。
  - type: paragraph
    text:
      ru: «И скончался сам и отцы наши; и перенесены были в Сихем». Авраам со своим семейством и патриархи погребены в Сихеме, который, быть может, назывался «Сикема». Авраам купил это место сам, чтобы похоронить Сарру.
      cn: 「他自己和我们的列祖都去世了；他们被迁葬于示剑。」亚伯拉罕和他的家人以及列祖都被安葬在示剑，那里或许曾被称为「示基马」。亚伯拉罕自己买下了这个地方，是为了安葬撒拉。
  - type: paragraph
    text:
      ru: «И положены во гробе». Сказав это, Стефан показывает, что Авраам даже до погребения не был господином земли.
      cn: «并被安葬于坟墓中。» 说了这话，司提反表明亚伯拉罕甚至在下葬之前，都不是这片土地的主人。
  - type: paragraph
    text:
      ru: 'Деян.7:17–28.А по мере, как приближалось время исполниться обетованию, о котором клялся Бог Аврааму, народ возрастал и умножался в Египте, до тех пор, как восстал иной царь, который не знал Иосифа. Сей, ухищряясь против рода нашего, притеснял отцов наших, принуждая их бросать детей своих, чтобы не оставались в живых. В это время родился Моисей, и был прекрасен пред Богом. Три месяца он был питаем в доме отца своего. А когда был брошен, взяла его дочь фараонова и воспитала его у себя, как сына. И научен был Моисей всей мудрости Египетской, и был силен в словах и делах. Когда же исполнилось ему сорок лет, пришло ему на сердце посетить братьев своих, сынов Израилевых. И, увидев одного из них обижаемого, вступился и отмстил за оскорбленного, поразив Египтянина. Он думал, поймут братья его, что Бог рукою его дает им спасение; но они не поняли. На следующий день, когда некоторые из них дрались, он явился и склонял их к миру, говоря: «вы братья; зачем обижаете друг друга?» Но обижающий ближнего оттолкнул его, сказав: «кто тебя поставил начальником и судьею над нами? Не хочешь ли ты убить и меня, как вчера убил Египтянина?»'
      cn: (使徒行传 7:17-28) 及至　上帝應許亞伯拉罕的日期將到，以色列民在埃及興盛眾多， 直到有不曉得約瑟的新王興起。 他用詭計待我們的宗族，苦害我們的祖宗，叫他們丟棄嬰孩，使嬰孩不能存活。 那時，摩西生下來，俊美非凡，在他父親家裏撫養了三個月。 他被丟棄的時候，法老的女兒拾了去，養為自己的兒子。 摩西學了埃及人一切的學問，說話行事都有大能。 他滿了四十歲，心中起意去看望他的弟兄以色列人。 到了那裏，見他們一個人受冤屈，他就護庇他，為那受欺壓的人報仇，打死了那埃及人； 他以為弟兄必明白　上帝是藉他的手搭救他們；他們卻不明白。 第二天，遇見兩個以色列人爭鬥，就勸他們和睦，說：『你們兩個是弟兄，為甚麼彼此欺負呢？』 那欺負鄰居的把他推開，說：『誰立你作我們的首領和審判官呢？ 難道你要殺我，像昨天殺那埃及人嗎？』


        随着上帝向亚伯拉罕所起誓的应许实现的时候临近，百姓在埃及滋生繁茂，人数增多，直到另有一位不认识约瑟的君王兴起。这人诡计多端，与我们的民族为敌，压迫我们的列祖，强迫他们抛弃自己的婴孩，不使他们存活。就在那时，摩西诞生了，他在上帝眼中是俊美的。他在他父亲家里被喂养了三个月。当他被抛弃时，法老的女儿收养了他，并把他养育在自己身边，如同自己的儿子一样。摩西学得了埃及人的一切智慧，在言语和行事上都有能力。当他年满四十岁时，他心里就动念要去看望他的弟兄，就是以色列的子孙。他看见他们中间有一个人受欺压，就上前替受欺压的伸冤报仇，击杀了一个埃及人。他以为他的弟兄会明白上帝要藉着他的手赐给他们拯救，可是他们却没有明白。第二天，当他们中间有人彼此争斗时，他就出现，劝他们和睦，说：「你们是弟兄，为什么要彼此欺压呢？」可是那欺压邻人的却把他推开，说：「谁立你作我们的官长和审判官呢？难道你想要杀我，就像你昨天杀那个埃及人一样吗？」'
  - type: paragraph
    text:
      ru: Выражение«по мере, как приближалось время исполниться обетованию»указывает не на то, что они умножились в течение четырехсот лет, но на то, что имел приблизиться конец, так как четыреста и больше лет уже прошло в Египте.
      cn: 这句话「当应许应验的时候临近」并非指他们（以色列人）在四百年间增多，而是指末期即将来临，因为四百多年已经在埃及过去了。
  - type: paragraph
    text:
      ru: «Народ возрастал и умножался в Египте». Если относительно Иосифа достойно удивления то, что он продан был братьями и, быв продан, избавил их от голода, то еще удивительнее то, что царь воспитывал того, кто должен был подорвать его власть (то есть Моисея); тот, кто должен был быть умерщвлен лицом, осудившим его на смерть, – тот образовывался и воспитывался для низвержения воспитателя.
      cn: «百姓在埃及滋生繁茂，人数增多.» 如果就约瑟而言，他被兄弟们出卖，而他被出卖后，反而将他们从饥荒中解救出来，这已是令人惊叹的了；那么，更令人惊奇的是，那位注定要颠覆他王权的人（即摩西），竟然是由这位君王亲自抚养长大的；那位被下令处死，本该被处决之人——却被培养、被抚养，以推翻他的抚养者。
  - type: paragraph
    text:
      ru: '«Принуждая… бросать детей своих, чтобы не оставались в живых». Это выражение намекает на то, что царь не хотел, чтобы умерщвление младенцев совершалось явно. И замечай: обетование Божие упрочивалось посредством тех самых обстоятельств, посредством которых диавол силился подорвать его, потому что был озлобляем народ израильский, но возрастал и умножался. Поэтому-то и Моисей принимается и воспитывается, и образовывается в доме царя и снова бежит; но во время бегства удостаивается видения и ему поручается народное предводительство. Таким образом Бог производит то, что и проданный в рабы становится царем там, где был рабом.'
      cn: 「强迫……抛弃自己的孩子，使其不得存活。」这个表达暗示着国王不希望杀害婴孩的事公开进行。并且请注意：上帝的应许正是通过魔鬼企图破坏它的那些环境而得以巩固的，因为以色列民受尽苦楚，但他们却增长繁衍。正因如此，摩西在国王家中被接纳、抚养并受教育，又再次逃离；但在逃亡期间，他蒙受异象，并被托付了引领民众的使命。就这样，上帝成就了甚至被卖为奴的人，在他曾为奴之地成为国王。
  - type: paragraph
    text:
      ru: '«Моисей… был прекрасен пред Богом». Родители родили и увидели, что дитя прекрасно, потому что благодать процветала в нем. Увидев же, что оно прекрасно, пощадили, но, испугавшись повеления, скрыли его. Страх победил; и из-за страха они решились бросить дитя, но по чувству родительского сострадания употребляют в этом деле хитрость – умудряются обойти повеление: сделав ковчег, в подражание ковчегу, бывшему при Ное, и призвав Бога Ноева, они бросили дитя с ковчегом в реку, чтобы и явиться повинующимися повелению, и спасти дитя. И вот они бросают, а Бог не знавшей об этом дочери фараона внушает выйти на реку. Вышла она, ничего не зная, и нашла то, чего не искала, – приняла из ковчега младенца. И спасен был Моисей символами общего спасения Церкви, потому что кивот был из дерева, а дерево было от воды, и спасение было безнадежному, и взявшая Моисея была не иудеянка, а из язычниц и египтянка.'
      cn: 「《摩西……在上帝面前俊美。》」（使徒行传 7:20）他的父母生下他，看见这孩子俊美，因为恩宠在他里面丰盛。他们看见孩子俊美，便加以爱惜，但因害怕这命令，便把他藏起来。恐惧战胜了他们；因着这恐惧，他们决定抛弃孩子，但出于父母的怜悯之情，他们在这件事上运用巧计，巧妙地规避了命令：他们做了一个方舟，仿效挪亚时代的方舟，并呼求挪亚的上帝，将孩子和这方舟一同放入河中，如此既能显得顺从了命令，又能拯救孩子。他们就这样抛弃了孩子，而上帝却感动了法老那对此毫不知情的女儿，让她下到河边。她什么都不知道就出去了，找到了她所未曾寻找的——她从方舟中抱起了婴儿。摩西就这样得救了，藉着普世教会救恩的象征，因为方舟是由木头制成的，而木头来自水，并且这救恩是赐给无望之人的，并且抱起摩西的不是犹太女子，而是出自外邦人中的一位埃及女子。
  - type: paragraph
    text:
      ru: «И научен был Моисей всей мудрости Египетской». Ни Моисей, ни Анания и Даниил с бывшими с ними не получили бы иностранного образования, если бы нужда и насилие деспотов не принудили их к этому, потому что оно не было им нужно ни на что, разве, быть может, кто-нибудь скажет, что получить образование хорошо было для того, чтобы искоренить заблуждения египтян.
      cn: 「摩西学尽了埃及人一切的智慧。」无论是摩西，或是亚拿尼亚、但以理以及与他们同在的那些人，如果不是暴君的困迫与强迫迫使他们如此行，他们都不会获得外邦教育，因为这教育对他们毫无用处。除非，或许有人会说，获得这样的教育是为了根除埃及人的错谬。
  - type: paragraph
    text:
      ru: «Поразив египтянина», Моисей отомстил ему за угнетаемого им. Не по исступлению и не по гневу убил он египтянина, но по ревности о Боге. А то, что совершается по ревности о Боге, хотя бы и было убийством, не есть убийство. Вот что услышал Моисей от Господа о Финеесе, убившем двух одной рукой:«Финеес… взял в руку свою копье. И вошел вслед за Израильтянином в спальню, и пронзил обоих их… и прекратилось поражение сынов Израилевых»(Чис. 25, 7–8). А то, что сделал Моисей, было неразгаданной загадкой, потому что было знамением того, что через Моисея Бог имеет погубить египтян и спасти израильтян. Моисей же думал, что братия его понимают, что через него Бог дает им избавление. Впрочем, Божеское покровительство видно было из самых дел – какое еще нужно было понимание? Однако же и при этом они не понимали.
      cn: '「击杀那埃及人」，摩西为那受他欺压之人报了仇。他并非出于狂怒，也并非出于愤怒而杀了那埃及人，而是出于对上帝的热忱。凡是出于对上帝的热忱所行的事，即使是杀戮，也不是杀戮。关于亲手杀了二人的非尼哈，摩西从上主那里听到了以下的话：

        「非尼哈……手里拿着枪，跟随那以色列人进入了卧室，刺透了他们两个人……于是以色列人中的瘟疫止住了。」（民数记 25:7-8）

        摩西所做的事曾是一个未解之谜，因为那是一个征兆，预示着上帝要通过摩西毁灭埃及人并拯救以色列人。然而摩西以为他的弟兄们明白，上帝正通过他赐予他们救赎。不过，上帝的护佑从这些行动本身就已经显明了——还需要怎样的理解呢？然而即便如此，他们也不明白。'
  - type: paragraph
    text:
      ru: «На следующий день, когда некоторые из них дрались, он явился и склонял их к миру». Смотри, как благосклонно разговаривает тот, кто обнаружил такой гнев на египтянина:«вы братья; зачем обижаете друг друга?»Но обрати внимание на ответ:«кто тебя поставил начальником и судьею над нами?»Те же самые слова, какие говорили потом Христу. Платить за добро обидой – это в духе иудеев.
      cn: 「第二天，当他们中间有些人争斗时，他出现了，并劝导他们和睦。」看哪，那个曾对埃及人显出如此怒气的人，说话是何等仁慈：「你们是弟兄；为什么要彼此伤害呢？」但请留意那回答：「谁立你作我们的官长和审判官呢？」这正是后来人们对基督所说的话。以怨报德——这是犹太人的本性。
  - type: paragraph
    text:
      ru: 'Деян.7:29–34.От сих слов Моисей убежал и сделался пришельцем в земле Мадиамской, где родились от него два сына. По исполнении сорока лет явился ему в пустыне горы Синая Ангел Господень в пламени горящего тернового куста. Моисей, увидев, дивился видению; а когда подходил рассмотреть, был к нему глас Господень: «Я Бог отцов твоих, Бог Авраама и Бог Исаака и Бог Иакова». Моисей, объятый трепетом, не смел смотреть. И сказал ему Господь: «сними обувь с ног твоих; ибо место, на котором ты стоишь, есть земля святая. Я вижу притеснение народа Моего в Египте, и слышу стенание его, и нисшел избавить его: итак пойди, Я пошлю тебя в Египет».'
      cn: (使徒行传 7:29-34) 摩西聽見這話就逃走了，於米甸地作過客旅，在那裏生了兩個兒子。 過了四十年，在西奈山的曠野，有　主的一個天使，從荊棘火焰中，向摩西顯現。 摩西見了那異象，便覺希奇；他正進前觀看的時候，有　主的聲音對他說： 『我是你列祖的　上帝，就是亞伯拉罕的　上帝，以撒的　上帝，雅各的　上帝。』摩西戰戰兢兢，不敢觀看。 　主對他說：『把你腳上的鞋脫下來；因為你所站之地是聖地。 我的百姓在埃及所受的困苦，我實在看見了，他們悲歎的聲音，我也聽見了。我下來要救他們。你來。我要差你往埃及去。』

        因这些话，摩西就逃走了，在米甸地成了寄居的，在那里生了两个儿子。过了四十年，在西奈山的旷野，上主的使者在荆棘丛的火焰中显现给他。摩西看见了，就希奇这景象；正当他走上前去细看的时候，有上主的声音临到他：「我是你列祖的上帝，是亚伯拉罕的上帝，以撒的上帝，雅各的上帝。」摩西战战兢兢，不敢观看。上主对他说：「把你脚上的鞋脱下来，因为你所站的地方是圣地。我看见我的百姓在埃及所受的欺压，也听见他们的哀叹，我下来是要拯救他们。所以，你来吧，我要差你往埃及去。」'
  - type: paragraph
    text:
      ru: 'Но и бегство его не нарушило Божиих планов, потому что говорится:«по исполнении сорока лет явился ему в пустыне горы Синая Ангел Господень», –явился, когда Моисей был в бегстве, когда и не надеялся возвратиться, так как имел уже двух сыновей. Но заметь: Ангелом, как и человеком, называет теперь Стефан Сына Божия. Является же Ангел Моисею не в храме, но в пустыне, и не в самой пустыне, но – в купине – в пламени горящего тернового куста. Вот и гласа удостаивается Моисей:"Я", говорит глас,«Бог отцов твоих».'
      cn: '但他的逃亡也未能打乱上帝的计划，因为经上说：「满了四十年的时候，在西奈山的旷野，主的使者向他显现，」——

        显现的时候，摩西正在逃亡中，当他已不指望回去的时候，因为他已经有了两个儿子。但请注意：司提反现在称上帝之子为天使，也称他为人。使者向摩西显现，并非在圣殿，而是在旷野，而且并非在旷野的任何地方，而是在荆棘中——在燃烧的荆棘丛火焰中。于是摩西也配得聆听那声音：声音说：「我是你列祖的上帝。」'
  - type: paragraph
    text:
      ru: «Сними обувь с ног твоих, ибо место, на котором ты стоишь, есть земля святая». Место свято ради явления Христова и достойно большего удивления, чем то, которое было во Святом Святых, потому что там никогда не было такого явления. Далее видно и великое попечение Божие, потому что говорится:«Я вижу притеснение народа Моего… и слышу стенание его, и нисшел избавить его».
      cn: 「摘下你脚上的鞋，因为你所站之地是圣地。」(出埃及记 3:5) 此地因基督的显现而神圣，其配得的惊叹远超至圣所，因为至圣所中从未有过如此的显现。此外，也可见上帝莫大的眷顾，因为经上说：「我看见我百姓的困苦……也听见他们的哀声，我降临是要救拔他们。」(出埃及记 3:7-8)
  - type: paragraph
    text:
      ru: 'Деян.7:35–41.Сего Моисея, которого они отвергли, сказав: «кто тебя поставил начальником и судьею?», сего Бог чрез Ангела, явившегося ему в терновом кусте, послал начальником и избавителем. Сей вывел их, сотворив чудеса и знамения в земле Египетской, и в Чермном море, и в пустыне в продолжение сорока лет. Это тот Моисей, который сказал сынам Израилевым: «Пророка воздвигнет вам Господь Бог ваш из братьев ваших, как меня; Его слушайте»(Втор. 18, 15).«Это тот, который был в собрании в пустыне с Ангелом, говорившим ему на горе Синае, и с отцами нашими, и который принял живые слова, чтобы передать нам, которому отцы наши не хотели быть послушными, но отринули его и обратились сердцами своими к Египту, сказав Аарону: «сделай нам богов, которые предшествовали бы нам; ибо с Моисеем, который вывел нас из земли Египетской, не знаем, что случилось». И сделали в те дни тельца, и принесли жертву идолу, и веселились перед делом рук своих.'
      cn: (使徒行传 7:35-41) 這摩西，就是被百姓所拒，說：『誰立你作我們的首領和審判官的？』　上帝卻藉那在荊棘中顯現之天使的手差派他作首領、作救贖的。 這人領百姓出來，在埃及地，在紅海、在曠野，四十年間行了奇事神蹟。 那曾對以色列人說『　主─你們的　上帝要從你們弟兄中間，給你們興起一個先知像我』的，就是這位摩西，你們當聽他的話。 這人曾在曠野教會中和西奈山上，與那對他說話的天使同在，又與我們的祖宗同在，並且領受活潑的聖言傳給我們。 我們的祖宗不肯聽從，反棄絕他，心裏歸向埃及， 對亞倫說：『你且為我們造些神像，在我們前面引路；因為領我們出埃及地的這個摩西，我們不知道他遭了甚麼事。』 在那些日子，他們造了一個牛犢，又獻祭給那偶像，歡喜自己手中的工作。


        这位摩西，就是他们曾弃绝，说：「谁立你作官长和审判官？」的；这位摩西，上帝却藉着那在荆棘丛中显现给他的天使，差遣他作官长和拯救者。这位摩西领他们出来，在埃及地、在红海、在旷野四十年，施行奇事和神迹。这就是那对以色列子民说：「上主你们的上帝要从你们的兄弟中，给你们兴起一位先知像我；你们要听从他。」的摩西(申命记 18:15)。


        「这就是那在旷野的会众中，与在西奈山上对他说话的天使同在，也与我们的祖先同在，并且领受了活的圣言，好传给我们的。我们的祖先不愿顺从他，反而弃绝了他，心里却转向埃及，对亚伦说：「为我们造些神明，可以在我们前面引路；因为这把我们从埃及地领出来的摩西，我们不知道他遭遇了什么事。」于是那些日子他们造了一头牛犊，又献祭给那偶像，并且因自己手所作的而欢乐。'
  - type: paragraph
    text:
      ru: 'Того Моисея, который подвергался опасности за свою жизнь, которого израильтяне ни во что поставили и отринули, Бог воздвиг и«чрез Ангела, явившегося ему в терновом кусте, послал». Кого Стефан называет Ангелом, того Моисей видел и называет Богом.«Это тот Моисей, который сказал сынам Израилевым: «Пророка воздвигнет вам Господь Бог ваш из братьев ваших, как меня», то есть подобно мне поставленного ни во что за то, за что гораздо скорее следовало удостоить чести. Фараон хотел убить Моисея, и Моисей бежал; и Господа хотел убить Ирод, и Господь спасся в Египте. И фараон, и Ирод замышляли на младенца; и тот и другой издали повеление; и ни то, ни другое повеление не нашло повиновения.'
      cn: 那个曾为自己的性命遭受危险，曾被以色列人看为无物并弃绝的摩西，上帝兴起他，并「藉着在荆棘丛中向他显现的天使，差遣了他」。司提反称作天使的，摩西却看见他并称他为上帝。「这正是那个摩西，他对以色列子民说：『上主你们的上帝要从你们的兄弟中，给你们兴起一位先知，像我一样』」，也就是说，一个像我一样，因着本该更受尊荣的事而被看为无物的人。法老想要杀害摩西，摩西便逃走了；希律也想杀害上主，上主便逃往埃及。法老和希律都企图谋害婴孩；他们俩都颁布了命令；然而这两个命令都没有得到顺从。
  - type: paragraph
    text:
      ru: «Это тот, который был в собрании в пустыне с Ангелом, говорившим ему на горе Синае». Находящиеся перед нами слова показывают, что люди становятся лучшими или худшими не от места, потому что те, о ком идет речь, быв уже вне Египта по месту, по расположению были в Египте и не оставляли помышления об египетских обычаях, как говорит и Евангелие:«Где сокровище ваше, там и сердце ваше»(Лк. 12, 34). Многие, будучи еще на земле, собирают сокровище на небе; там и сердце их. Но преступившие Божию волю ангелы, будучи на небе, возымели расположение к тому, что на земле; вследствие чего последовало низриновение их на землю.
      cn: 「这就是那在旷野的会众中，与在西奈山上对他说话的天使同在的。」摆在我们面前的这些话语表明，人的好坏并非取决于地点，因为那些被提及的人，虽然按着地点已经离开了埃及，但在心意上却仍在埃及，并未放弃对埃及习俗的思念，正如福音书所说：「你们的财宝在哪里，你们的心也在那里」（路加福音 12:34）。许多人，虽然仍活在地上，却把财宝积蓄在天上；他们的心也在那里。然而，那些违背上帝旨意的天使们，虽然身在天上，却对地上的事物心生依恋；因此他们被驱逐到地上。
  - type: paragraph
    text:
      ru: «Который принял живые слова».
      cn: 那领受了活泼言语的。
  - type: paragraph
    text:
      ru: Живыми называет слова особого рода, значение которых выясняется обыкновенными словами, или пророчества.
      cn: 称那些特殊种类的言语为活泼的言语，其意义通过普通的言语或预言得以阐明。
  - type: paragraph
    text:
      ru: «Сделай нам богов». Не Бога, но богов.
      cn: «给我们造些神吧。» 不是上帝，而是诸神。
  - type: paragraph
    text:
      ru: '«И сделали в те дни тельца». То же и у Давида:«и сделали тельца у Хорива»(Пс. 105, 19). И не без цели указывается на Хорив, но для того, чтобы показать крайнее безумие израильтян: здесь Бог явился Моисею, здесь же они делали идолов и приносили им жертвы.'
      cn: 「他们在那几日做了金牛犊。」大卫那里也是如此：「他们在何烈山做了金牛犊」(诗篇 105:19)。提及何烈山并非毫无缘故，而是为了显明以色列人极端的愚妄：上帝在此向摩西显现，而他们却在此地制造偶像并向偶像献祭。
  - type: paragraph
    text:
      ru: 'Деян.7:42–50.Бог же отвратился и оставил их служить воинству небесному, как написано в книге пророков: «дом Израилев! приносили ли вы Мне заколения и жертвы в продолжение сорока лет в пустыне? Вы приняли скинию Молохову и звезду бога вашего Ремфана, изображения, которые вы сделали, чтобы поклоняться им: и Я переселю вас далее Вавилона»(Ам. 5, 25–27).«Скиния свидетельства была у отцов наших в пустыне, как повелел Говоривший Моисею сделать ее по образцу, им виденному. Отцы наши с Иисусом, взяв ее, внесли во владения народов, изгнанных Богом от лица отцов наших. Так было до дней Давида. Сей обрел благодать пред Богом и молил, чтобы найти жилище Богу Иакова. Соломон же построил Ему дом. Но Всевышний не в рукотворенных храмах живет, как говорит пророк: «Небо престол Мой, и земля подножие ног Моих. Какой дом созиждете Мне, говорит Господь, или какое место для покоя Моего? Не Моя ли рука сотворила всё сие?»(Ис. 66, 1–2).'
      cn: (使徒行传 7:42-50) 　上帝就轉臉不顧，任憑他們敬拜天上的日月星辰；正如先知書上所寫的說：『以色列家啊，你們四十年間在曠野，豈是將犧牲和別的祭獻給我嗎？ 你們抬著摩洛的帳幕和理番神的星，就是你們所造為要敬拜的像。因此，我要把你們擄到巴比倫外去。 我們的祖宗在曠野，有作證的帳幕，是　上帝曉諭摩西叫他照所看見的樣式作的。 這帳幕，又是我們的祖宗相繼承受，當　上帝在他們面前趕出外邦人去的時候，他們同耶穌把帳幕搬進承受為業之地，直存到大衛的日子； 大衛在　上帝面前蒙恩，祈求為雅各的　上帝預備帳幕。 卻是所羅門為　上帝造成殿宇。 其實，　至高者並不住人手所造的殿；就如先知所言： 　主說：『天是我的座位，地是我的腳凳；你們要為我造甚麼的殿宇？或哪裏是我安息的地方呢？ 這一切不都是我手所造的嗎？』


        上帝却转离他们，任凭他们去侍奉天象，正如先知书上所写：


        「以色列家啊！你们在旷野四十年，曾献祭牲和祭物给我吗？你们抬着摩洛的帐幕和你们的神利芬的星，就是你们为自己所造的像，好去敬拜它们：所以我要把你们迁徙到巴比伦以外！」（阿摩司书 5:25-27）


        我们祖先在旷野有作证的帐幕，正如吩咐摩西的那位所命令，照他所见的样式建造。我们的祖先与约书亚一同带着它，进入了上帝从我们祖先面前赶出的列邦领地。直到大卫的日子。大卫在上帝面前蒙恩，恳求为雅各的上帝寻得居所。所罗门却为祂建造了殿宇。然而至高者不住在人手所造的殿宇里，正如先知所说：


        「天是我的宝座，地是我的脚凳。你们能为我建造怎样的殿宇呢？上主说，或是我安息的居所呢？这一切不都是我的手所造的吗？」（以赛亚书 66:1-2）'
  - type: paragraph
    text:
      ru: 'Изречение«оставил… служить»поставлено вместо «допустил», как и у апостола Павла«предал их Бог превратному уму»(Рим. 1, 28) поставлено вместо «допустил предаться». Итак, говорит: так как иудеи имели такую страсть – служить твари вместо Творца, Бог часто укорял их через пророков за такое произволение, а потом, когда они оказались упорными, допустил их делать то, что они хотели. А слово«отвратился»поставлено вместо изречения «отвратив от другого хотения», потому что иное показывает хотение Божие, и иное то, что попущено по снисхождению. Ибо Его хотение есть то же, что и закон:«Господу Богу твоему поклоняйся, и Ему одному служи»(Лк. 4, 8). Но упорствовавших в нечестии Он допустил в нечестии и оставаться, потому что Он не хочет, чтобы Ему служили по необходимости, чтобы не стеснить того, кто имеет свободную волю.'
      cn: 语句「任凭……事奉」被置于「允许」之处，正如使徒保罗所言：「上帝将他们交给败坏的心」(罗马书 1:28) 被置于「允许他们沉溺」之处。因此，经文说：因为犹太人有这样的痴迷——事奉受造物而非造物主，上帝屡次藉着先知斥责他们这种随己意的行为，其后，当他们显出顽固不化时，便允许他们行其所愿。而「离弃」一词被置于「转离另一种意愿」之处，因为上帝的意愿是一回事，而因屈尊俯就所允许的又是另一回事。因为祂的意愿与律法无异：「当敬拜祢的上主上帝，并惟独事奉祂」(路加福音 4:8)。但对于那些执意行不敬虔之事的人，祂也允许他们继续停留在不敬虔之中，因为祂不愿人因强迫而事奉祂，以免束缚那拥有自由意志的人。
  - type: paragraph
    text:
      ru: 'Выражение«воинству небесному»некоторые думают, равносильно «Ангелам».«Через Ангелов возвещенное слово»(Евр. 2, 2). Но Стефан говорит не об Ангелах, а о звездах, которым иудеи воздавали почитание, а именно: Тельцу, заменявшему утреннюю звезду – денницу, и луне, как царице неба. Это выражение употребляется почти повсюду, где речь идет о светилах и звездах.'
      cn: 有些人认为，「天上众军」这一表达等同于「天使」。「藉着天使所传的话」（希伯来书 2:2）。但司提反所说的并非关乎天使，而是关乎犹太人曾向其敬拜的星辰，具体来说是曾替代晨星——启明星的金牛星，和作为天之女王的月亮。这个表达几乎在所有谈论到发光体和星辰之处都被使用。
  - type: paragraph
    text:
      ru: '«Дом Израилев! приносили ли вы Мне заколения и жертвы в продолжение сорока лет в пустыне?»Заметь, что сначала упоминает о том, что они приносили жертвы Ему Самому, а потом уже жертвы идолам. Это потому, что до этого нигде не встречается название «жертва», но – только «заповеди» и «живые слова». Притом это свидетельство он приводит не без причины, но чтобы показать, что не было надобности в жертвах. Он говорит«приносили ли вы Мне заколения и жертвы»вместо того, чтобы сказать: «Вы не можете сказать, что приносите жертвы идолам оттого, что приносили их Богу; напротив, вы сначала приносили жертвы им, и это в пустыне, где Я в особенности покровительствовал вам. Потому если Я и сказал, что этот храм будет разрушен, а обряды и жертвы будут изменены, то Я не сказал ничего нового. Ибо Моисей, о котором, кажется, вы имеете высокое мнение, в течение сорока лет ни жертвы не приносил, ни храма не воздвигал, а также не делал этого и Давид, хотя вы уже владели этой землей, разделенной по жребию. Также и пророки говорят о них, как о ненужных. Но как вы можете в свое оправдание ссылаться на Моисея, когда его отринули отцы ваши и вы?»'
      cn: 「以色列家啊！你们在旷野四十年，曾将祭牲和祭物献给我吗？」当留意，经文首先提到他们将祭物献给祂自己，然后才献给偶像。这是因为在此之前，『祭物』这个名称在任何地方都未曾出现，唯有『诫命』和『活泼的言语』。此外，祂引述这见证并非没有原因，而是为了表明，献祭并非必要。祂说「你们曾将祭牲和祭物献给我吗」，并没有说：「你们不能说，你们向偶像献祭是因为你们曾向上帝献祭；相反，你们是先向它们献祭，而这正是在旷野，在那里我特别庇护了你们。」因此，如果我曾说这圣殿将被拆毁，而仪轨和祭物将被改变，那我并没有说什么新事。因为摩西，你们似乎对他评价很高，在四十年间既没有献祭，也没有建造圣殿；大卫也没有这样做，尽管你们那时已经拥有这片按阄分定的土地。先知们也论及它们，认为它们是不必要的。但当你们的列祖和你们都弃绝了他时，你们又怎能引用摩西来为自己辩护呢？
  - type: paragraph
    text:
      ru: «Вы приняли скинию Молохову и звезду бога вашего Ремфана». Божественный Моисей удалился на гору, чтобы получить закон, а они, израильтяне по крови, предстали перед Аароном, говоря:«Сделай нам бога»(Исх. 32, 1). Итак, они в пустыне сделали тельца, и этот телец был явным идолом; устроили постепенно и многих других идолов. В особенности же они преданы были поклонению звездам. Кроме тельца, они"приняли"и«скинию Молохову». Создав скинию, они поставили в ней идола и назвали его Молохом. Это идол моавитский. Он имел прозрачный камень на верхней части лба в виде утренней звезды – денницы. А слово «Молох» в переводе значит «царь их». Ибо так изъясняют его Акила и Феодотион. А изображение денницы было приготовлено художниками. Итак,«приняли скинию Молохову», то есть скинию царя вашего. И какой он был царь?«Звезду бога вашего Ремфана», имя которого в переводе значит «помрачение» или «ослепление». Итак, они воздавали поклонение деннице, восходящей до появления сияния солнечного. Впрочем, с этими поклонниками сделалось ослепление, или ремфан, не потому, что звезда производила это ослепление, но потому, что это почитание сделалось причиной такого помрачения.
      cn: 「你们抬着摩洛的帐幕，并你们的神伦芬的星。」神圣的摩西登上山，领受律法，而他们这些按血脉的以色列人，却来到亚伦面前，说：「给我们造神」（出埃及记 32:1）。于是，他们在旷野里造了一只牛犊，这牛犊是显而易见的偶像；他们也逐渐地又制造了许多其他偶像。尤其，他们沉迷于星辰崇拜。除了牛犊，他们还「抬着」摩洛的帐幕。建造了帐幕之后，他们在其中安置了一个偶像，并称其为摩洛。这是摩押人的偶像。它前额上部镶嵌着一块透明的宝石，形似晨星——启明星。而「摩洛」一词，翻译过来意为「他们的王」。因为阿奎拉和提奥多田就是如此解释的。而启明星的形象是由艺术家们制作的。于是，「抬着摩洛的帐幕」，也就是说，你们的王的帐幕。而他是怎样的王呢？「你们的神伦芬的星」，他的名字翻译过来意为「蒙昧」或「蒙蔽」。于是，他们敬拜那在太阳光芒出现之前升起的启明星。然而，这些崇拜者身上发生了蒙蔽，也就是伦芬，这并非因为星辰造成了这种蒙蔽，而是因为这种敬拜成为了如此蒙昧的原因。
  - type: paragraph
    text:
      ru: '«Я переселю вас далее Вавилона». Пророк сказал:«Я переселю вас за Дамаск»(Ам. 5, 27). А Стефан сказал«далее Вавилона», следуя изложению евреев или потому, что Вавилон есть предел земли дамаскитян. Семьдесят толковников сказали: «Далее Дамаска».'
      cn: 「我必使你们迁徙到巴比伦以外。」先知说：「我必使你们迁徙到大马士革以外。」(阿摩司书 5:27)。而司提反说「巴比伦以外」，是遵循了犹太人的记载，或者因为巴比伦是大马士革人土地的界限。七十译士说：「大马士革以外。」
  - type: paragraph
    text:
      ru: «Скиния свидетельства была у отцов наших в пустыне». Они имели ее для того, чтобы иметь свидетелем Бога. Называет ее скинией свидетельств, то есть чудес и повелений.
      cn: 「见证的帐幕曾与我们的父辈同在旷野中。」他们拥有它，为的是要让上帝成为他们的见证者。他称之为「众见证的帐幕」，也就是说，是神迹和诫命的（帐幕）。
  - type: paragraph
    text:
      ru: «Как повелел Говоривший Моисею». Утверждение скинии состоялось на горе, и она в пустыне была переносной, а не находилась на одном месте. Если и Ангел был тот, кто говорил с Моисеем на горе, то он все-таки говорил с ним от лица Божия. И много есть такого в Божественном Писании. Так, в книге Исход говорится, что Ангел Господень сказал Моисею:«Моисей, Моисей!.. Не подходи сюда»(Исх. 3, 45). И несколько далее этот Ангел говорит:«Я Бог отца твоего, Бог Авраама, Бог Исаака и Бог Иакова»(Исх. 3, 6).
      cn: 「正如那对摩西说话者所命令的。」会幕的建立是在山上进行的，并且它在旷野是可移动的，而非固定于一处。即便与摩西在山上说话的是天使，他仍然是从上帝而来对他说话的。在神圣的经文中，这样的情况有很多。例如，出埃及记中记载，上主的使者对摩西说：「摩西，摩西！... 不要走近这里！」(出埃及记 3:45) 稍后，这位使者又说：「我是你父亲的上帝，是亚伯拉罕的上帝，以撒的上帝，雅各布的上帝。」(出埃及记 3:6)
  - type: paragraph
    text:
      ru: Деян.7:51–53.Жестоковыйные! люди с необрезанным сердцем и ушами! вы всегда противитесь Духу Святому, как отцы ваши, так и вы. Кого из пророков не гнали отцы ваши? Они убили предвозвестивших пришествие Праведника, Которого предателями и убийцами сделались ныне вы, вы, которые приняли закон при служении Ангелов и не сохранили.
      cn: (使徒行传 7:51-53) 你們這硬著頸項、心與耳未受割禮的人，常時抗拒　聖靈。你們的祖宗怎樣作了，你們也怎樣作。 那一個先知不是你們祖宗逼迫呢？他們也把預先傳說那　義者要來的人殺了；如今你們又把他賣了，殺了。 你們受了天使所傳的律法，竟不遵守。」

        你们这硬着颈项、心和耳未受割礼的人哪！你们常常抗拒圣灵，你们的祖宗怎样，你们也怎样。你们的祖宗哪一个先知没有逼迫呢？他们杀了那预先传报义者降临的人，如今你们却成了这义者的出卖者和杀害者。你们就是那受了天使传达的律法却不遵守的人。'
  - type: paragraph
    text:
      ru: 'Почему до сих пор говоривший к народу кротко здесь употребляет слова жестокие? Потому что он увидел, что они не обращают внимания на то, что говорится.«Вы всегда противитесь Духу Святому» –не только теперь. Этим он показывает:'
      cn: 为什么直到现在仍对民众温和说话的（他），在这里却使用严厉的言辞？因为他看见他们不理会所说的话。「你们时常抗拒圣灵」——不只是现在。借此他表明：
  - type: paragraph
    text:
      ru: 'что он сказал, было от Святаго Духа, в особенности же тогда, когда приближался час смерти его, потому что он, конечно, знал это, будучи исполнен Святаго Духа. Он обнаружил великое и безбоязненное дерзновение, и то, что он сказал им, было не его, но слова пророков."Всегда", говорит,«противитесь». Когда Бог не хотел, чтобы были жертвы, вы приносили жертвы, а потом, когда Он хочет жертвы, вы ее не приносите. Опять, когда существовал храм, вы служили идолам, а когда Он хочет, чтобы вы отрешились от храма, вы делаете противное. Притом не сказал: «Богу противитесь», но"Духу".'
      cn: 他所说的，是出于圣灵，尤其是在他临近死亡之时，因为他当然知道这一点，他已充满圣灵。他显露出极大的、无畏的坦然，而他所说的，并非出于他自己，乃是先知们的话。他说：「你们总是抵挡。当上帝不愿献祭时，你们却献祭；而当祂愿献祭时，你们却不献。又当圣殿存在时，你们却侍奉偶像；而当祂愿你们离弃圣殿时，你们却做相反的事。」此外，他没有说：「你们抵挡上帝」，而是说：「抵挡圣灵。」
  - type: paragraph
    text:
      ru: Ибо нет никакого различия между Духом и Богом.
      cn: 因为圣灵与上帝之间，没有丝毫分别。
  - type: paragraph
    text:
      ru: «Противитесь… как отцы ваши, так и вы». Показывает, что это зло более падает на них потому, что оно дошло до них издавна. Так делал и Христос, потому что они сильно хвалились предками своими.
      cn: «你们抵挡……你们的父辈如此，你们也如此》。这表明这恶事更深地落在他们身上，因为它自古以来就临到了他们。基督也如此行，因为他们极力夸耀他们的祖先。
  - type: paragraph
    text:
      ru: «Кого из пророков не гнали отцы ваши?»Если отцы ваши убивали этих предвозвестников, то нет ничего удивительного, что я, проповедующий Предвозвещенного ими, буду убит вами, которые слишком гордитесь своими предками.
      cn: '«你们的祖先没有逼迫过哪一位先知呢？»

        既然你们的祖先杀害了这些预告者，那么，我这位传扬他们所预告的祂的，竟会被你们这些过于以自己的祖先为荣的人所杀害，就毫不稀奇了。'
  - type: paragraph
    text:
      ru: '«Они убили предвозвестивших пришествие Праведника». Говорит«Праведника», показывая, что Он неправедно убит ими, потому что если Он праведен, то очень неправы убившие Его. Называет Его праведным, потому что этого не могли отрицать и они. Они нигде не осуждали Его как неправедного, ибо как они стали бы осуждать в этом не имеющего даже крова? Но он выставляет им на вид два преступления их: убийство и предательство. Ибо говорит:«Предателями и убийцами сделались ныне вы… которые приняли закон при служении Ангелов и не сохранили», то есть устроенного Ангелами и врученного Явившимся в купине. Показывает, что они не покорялись и не покоряются ни Богу, ни Ангелам, ни пророкам, ни Духу.'
      cn: 「他们杀了预告义者降临的人。」他说「义者」，显示他被他们不正义地杀害了，因为如果他是义者，那么杀害他的人就非常不正义。称他为义者，是因为连他们也无法否认这一点。他们从未在任何地方以不义者的身份定他的罪，因为他们怎能定一个连居所都没有的人的罪呢？但他向他们指出他们的两项罪行：谋杀和背叛。因为他说：「如今你们成了背叛者和杀人犯……你们这些领受了在天使侍奉下的律法，却不遵守的人。」也就是说，由天使安排的，并由在荆棘丛中显现的那位所赐予的。显示他们既不服从上帝，也不服从天使，也不服从先知，也不服从圣灵。
  - type: paragraph
    text:
      ru: 'Деян.7:54–56.Слушая сие, они рвались сердцами своими и скрежетали на него зубами. Стефан же, будучи исполнен Духа Святаго, воззрев на небо, увидел славу Божию и Иисуса, стоящегоодеснуюБога, и сказал: вот, я вижу небеса отверстые и Сына Человеческого, стоящегоодеснуюБога.'
      cn: (使徒行传 7:54-56) 眾人聽見這些話，就心如刀剖，向司提反咬牙切齒。 但司提反被　聖靈充滿，定睛望天，看見　上帝的榮耀，又看見耶穌站在　上帝的右邊， 就說：「我看見諸天開了，　人子站在　上帝的右邊。」
  - type: paragraph
    text:
      ru: Если иудеи хотели умертвить Стефана, то почему не умертвили его тотчас же? Потому что хотели представить благовидный предлог своей дерзости, так как оскорбление, какое он причинил им, не было благовидным предлогом к умерщвлению его; притом же то, что они сочли за оскорбление себе, не было его собственное оскорбление, но это было обличение, сделанное иудеям пророком. С тем вместе они и не хотели, чтобы о них думали, что они умертвили его за то, что относилось к ним лично, как это было и при осуждении на смерть Христа, но что будто они умерщвляют за нечестие. Потому что они не довольствовались тем, чтобы осквернить себя убийством, но надеялись и заботились запятнать и честь убиваемого. Ибо они боялись, чтобы он не стал пользоваться большим почитанием, если они умертвят его за личное оскорбление им.
      cn: 如果犹太人想要处死司提反，那么他们为什么不立刻将他处死呢？因为他们想要为自己的胆大妄为找一个冠冕堂皇的借口，毕竟他给他们造成的冒犯，并非处死他的正当理由；况且，他们认为是冒犯他们的，并不是他自己的冒犯，而是先知对犹太人所作的责备。与此同时，他们也不希望别人认为他们处死他是因为与他们个人有关的事情，就像在基督被判死刑时一样，而是（希望别人认为）他们是因不敬虔而将他处死。因为他们不满足于通过杀戮玷污自己，他们还希望并致力于玷污被杀者的名誉。因为他们担心，如果他们仅仅因为对他们个人的冒犯而将他处死，他反而会获得更大的尊崇。
  - type: paragraph
    text:
      ru: '«Иисуса, стоящегоодеснуюБога». Стоянием означает твердость и непоколебимость. Причем это допускали уже и они: они тогда уже считали Его стоящим.'
      cn: «耶稣，站立在上帝的右边». 站立意指坚定和不动摇。而且他们那时也已经承认这一点：他们那时就已认为祂是站立着的。
  - type: paragraph
    text:
      ru: 'Деян.7:57–60.Но они, закричав громким голосом, затыкали уши свои, и единодушно устремились на него. И, выведя за город, стали побивать его камнями. Свидетели же положили свои одежды у ног юноши, именем Савла. И побивали камнями Стефана, который молился и говорил: Господи Иисусе! приими дух мой. И, преклонив колени, воскликнул громким голосом: Господи! не вмени им греха сего. И, сказав сие, почил.'
      cn: (使徒行传 7:57-60) 眾人就大聲喊叫，掩著耳朵，齊心向他衝上前去， 把他推到城外，用石頭打他；作見證的人把衣服放在一個少年人名叫掃羅的腳前。 他們正用石頭打的時候，司提反呼求　上帝說：「求　主耶穌接收我的靈。」 他又跪下大聲喊著說：「　主啊，不要將這罪歸於他們。」他說了這話，就睡了。

        但他们大声喊叫，掩塞他们的耳朵，并且一同冲向他。于是，他们把他推出城外，用石头打他。那些见证人把他们的衣服放在一个名叫扫罗的少年人脚前。他们用石头打司提反，他祷告说：「主耶稣啊！接纳我的灵魂！」并且屈膝，大声呼喊说：「主啊！不要将这罪归于他们！」说完这话，他便安息了。'
  - type: paragraph
    text:
      ru: 'Когда Христос сказал:«Узрите Сына Человеческого, сидящегоодесную»(Мф. 26, 64), иудеи назвали это богохульством и напали на Него. Так и теперь: услышав слова Стефана, устремились на него. Но тогда раздирали одежды, а здесь«затыкали уши».'
      cn: 当基督说：「你们将看见人子，坐在右边」（马太福音 26:64）时，犹太人称此为亵渎，并攻击祂。如今亦是如此：听见司提反的话，他们便冲向他。但那时他们撕裂衣服，而此刻却「掩住了耳朵」。
  - type: paragraph
    text:
      ru: «И, выведя за город, стали побивать его камнями». Оказавшись решительно не в состоянии положить конец речи Стефана, они«стали побивать его камнями». Если бы даже он говорил неправду, его надобно было отпустить как безумного. Если же говорил истину, надобно было скорее удивляться.«И выведя за город», убивают его, как это сделали и с Иисусом.
      cn: 「于是把他带到城外，用石头打他。」他们发现自己完全无法终止司提反的言语，于是「用石头打他」。即使他所言不实，也当把他当疯子释放。若他所言为真，则更应感到惊奇。「把他带到城外」杀害了他，正如他们对待耶稣所做的那样。
  - type: paragraph
    text:
      ru: '«Свидетели же положили свои одежды у ног юноши». Свидетелями Лука называет тех, кого иудеи выдвинули с целью произнести ложное свидетельство против Стефана. Этим евангелист делает намек на два обстоятельства: что и те, которых считали свидетелями, были скорее готовы совершить убийство, когда они сняли одежды, чтобы свободнее и беспрепятственнее бросать камни, – и что имеющий впоследствии быть проповедником вселенной и сам тогда оказывал содействие в убийстве, и что таким образом в нем произошло какое-то Божественное, удивительное и несвойственное человеку изменение.'
      cn: «见证人把自己的衣服放在一个少年人的脚前。» 路加称那些被犹太人推举出来，旨在对司提反作假见证的人为「见证人」。借此，这位福音书作者暗示了两个情况：那些被视为见证人的人，当他们脱下衣服以便更自由、更无阻碍地投掷石块时，反而更乐意实施谋杀 — 并且，那后来要成为普世传道者的人，他自己那时也协助了谋杀，并且，以这种方式，在他身上发生了一种神圣的、奇妙的、非人性的转变。
  - type: paragraph
    text:
      ru: Изречение же«Господи Иисусе, приими дух мой»есть изречение научающего и показывающего им, что он не погибнет.
      cn: 而这言语：「主耶稣，求祢接收我的灵」，乃是那教导并向他们表明他不会灭亡的言语。
  - type: paragraph
    text:
      ru: «Побивали камнями Стефана». Так как оправдание совершается верой в Христа и в Нем человеческое естество в изобилии получило невинность и даровало нам новое право, в силу которого души наши уже не идут во ад, но, как и прежде, посылаются в руки Бога Живого, то, зная это, святой Стефан сказал:«Господи Иисусе! приими дух мой». И блаженный Петр пишет:«Итак страждущие по воле Божией да предадут Ему, как верному Создателю, души свои»(1Пет. 4, 19).
      cn: '«司提反被石头打死»。

        因为称义是借着信靠基督而成就的，并且在祂里面，人性丰盛地领受了无罪，并赐予了我们新的权柄，借此我们的灵魂不再下到阴间，而是如往常一样，被送到永生上帝的手中。因此，圣徒司提反明白这一点，便说：「主耶稣啊！求祢接收我的灵。」蒙福的彼得也写道：「所以，那照着上帝旨意受苦的人，愿他们将自己的灵魂交托给祂，如同交托给信实的创造主。」(彼得前书 4:19)。'
  - type: paragraph
    text:
      ru: '«Преклонив колени, воскликнул громким голосом: Господи! не вмени им греха сего». Не просто, говорит, молится, но с усердием, так как Бог допустил, чтобы до сих пор душа его оставалась в теле. Заметь голос и чрезмерность терпеливости в страданиях. Этим он показывает, что то, что он сказал им прежде, сказал не вследствие гнева, но чтобы их поставить в затруднение, обличить и упрекнуть.'
      cn: 「屈膝跪下，他大声呼喊说：『上主啊！不要将这罪归于他们。』」 他说，他并非仅仅是祈祷，而是怀着热忱，因为上帝允许他的灵魂直到那时仍留在肉身之中。请留意他的声音，以及他在受难中那超乎寻常的忍耐。他以此表明，他先前对他们所说的话，并非出于愤怒，而是为了使他们陷入困境，指责并训斥他们。
- type: heading1
  text:
    ru: Глава восьмая
    cn: 第八章
  children:
  - type: paragraph
    text:
      ru: Деян.8:1–4.Савл же одобрял убиение его. В те дни произошло великое гонение нацерковьв Иерусалиме; и все, кроме Апостолов, рассеялись по разным местам Иудеи и Самарии. Стефана же погребли мужи благоговейные, и сделали великий плач по нем. А Савл терзалцерковь, входя в домы и влача мужчин и женщин, отдавал в темницу. Между тем рассеявшиеся ходили и благовествовали слово.
      cn: (使徒行传 8:1-4) 掃羅也喜悅他被害。從這日起，耶路撒冷的教會大遭逼迫，除了使徒以外，門徒都分散在猶太和撒瑪利亞各處。 有虔誠的人把司提反埋葬了，為他捶胸大哭。 掃羅卻殘害教會，進各人的家，拉著男女下在監裏。 故此，那些分散的人往各處去傳道。
  - type: paragraph
    text:
      ru: Сами апостолы, говорит Лука, не рассеялись, но остались в Иерусалиме, потому что где сильнее нападение, там должны находиться и лучшие борцы и быть для других примером мужества и смелости.
      cn: 使徒们自己，路加说，没有四散，却留在耶路撒冷，因为在攻击最猛烈之处，最优秀的斗士们也应在那里，并为他人树立勇气和胆量的榜样。
  - type: paragraph
    text:
      ru: «Стефана же погребли мужи благоговейные». Если они были«благоговейные», то как же они«сделали великий плач?»Это потому, что они не были еще совершенны. С другой стороны, кто бы и не заплакал, лишившись такого учения, такой защиты и таких чудес и видя этого праведного, лежащего мертвым и побитого камнями?
      cn: 「虔诚的人们埋葬了司提反。」倘若他们是「虔诚的」，那他们怎能「大大地哀哭」呢？这乃是因为他们尚未完全。另一方面，失去了这样的教导、这样的保护以及这样的奇迹，又看见这位义人躺卧着死了，且被石头打死，谁又不会哭泣呢？
  - type: paragraph
    text:
      ru: «А Савл терзалцерковь». Великое бешенство и быть одному, и врываться в дома. Это потому, что он душу свою предал за закон.
      cn: 《但扫罗却残害教会。》极大的狂怒，并且独自一人，闯入民宅。这是因为他为律法献出了自己的灵魂。
  - type: paragraph
    text:
      ru: Деян.8:5–8.Так Филипп пришел в город Самарийский, и проповедовал им Христа. Народ единодушно внимал тому, что говорил Филипп, слыша и видя, какие он творил чудеса. Ибо нечистые духи из многих, одержимых ими, выходили с великим воплем, а многие расслабленные и хромые исцелялись. И была радость великая в том городе.
      cn: (使徒行传 8:5-8) 腓利下撒瑪利亞城去，宣講　基督。 百姓聽見了，又看見腓利所行的神蹟，就同心合意的聽從他那些話。 因為有許多人被污靈附著，那些污靈大聲呼叫，從他們身上出來；還有許多癱瘓的，瘸腿的，都得了醫治。 在那城裏，就大有歡喜。

        于是腓利来到撒马利亚城，向他们传讲基督。众人同心合意地专心听腓利所说的话，因为他们听见并看见了他所行的神迹。因为有许多被不洁之灵附着的人，不洁之灵大声呼喊着从他们身上出来；还有许多瘫痪的和瘸腿的也得了医治。那城里就大有喜乐。'
  - type: paragraph
    text:
      ru: 'Не тот апостол Филипп, что считается в числе двенадцати, но один из семи, избранных для попечения о вдовицах, а также крестивший евнуха и огласивший Симона. Послушай, что говорит евангелист Лука: по убиении Стефана«произошло великое гонение нацерковьв Иерусалиме; и все, кроме Апостолов, рассеялись по разным местам Иудеи и Самарии»(8, 1). Отсюда ясно, что апостол Филипп с прочими апостолами находился в Иерусалиме. Лука сделал это замечание для того, чтобы показать, что Филипп крестил тех, которым было преподано христианское учение в Самарии. Апостолы же Петр и Иоанн, придя к ним из Иерусалима, преподали им благодать Духа. А если бы он был из числа двенадцати апостолов, то он имел бы власть и преподавать дары Духа. Он крестит только как ученик, а завершительную благодать преподают те апостолы, которым дана власть преподавать такой дар. Иные говорят, что Филипп потому не низвел на крещеных Духа, что он был только диакон, выдвинутый теми, которые находились со Стефаном, а не имел ни пресвитерского, ни епископского сана, как избранные ученики Господни. А что он был диакон, об этом свидетельствует Павел в «Правилах» – он свидетельствует не только о нем, но и об Анании, который крестил самого Павла. А будучи диаконом, он крестил по недостатку пресвитеров в Самарии, потому что в случае необходимости, когда нет пресвитера, позволено крестить и диаконам, как этому научил Сам Дух, внушивший тому же Филиппу мысль приблизиться к евнуху. Надобно заметить, что после крещения на крещаемых через возложение рук в силу молитвы во имя Господа Иисуса нисходит Святый Дух. Поэтому и до сих пор этот чин соблюдается в том же виде.'
      cn: 非彼十二使徒之一的使徒腓力，而是七位被拣选照管寡妇者之一，亦是为太监施洗并向西门宣讲福音者。且听福音书作者路加所言：司提反遇害后，「耶路撒冷的教会大受迫害；除了使徒们，众人都分散到犹太和撒玛利亚各地」（使徒行传 8:1）。由此可见，使徒腓力与其余使徒同在耶路撒冷。路加做出此番评论，意在表明腓力为那些在撒玛利亚领受了基督徒教义的人施洗。然而，使徒彼得和约翰从耶路撒冷来到他们那里，将圣灵的恩典赐予他们。如果他属于十二使徒之列，那么他便有权柄赐予圣灵的恩赐。他仅以门徒身份施洗，而赐予这终极恩典的，是那些被赋予赐予此等恩赐权柄的使徒们。另有人说，腓力之所以未能使圣灵降于受洗者身上，是因为他仅仅是一名执事，是由那些与司提反在一起的人推举出来的，而不具备长老职分或主教职分，不像那些蒙主拣选的门徒。至于他是一名执事，保罗在《教规》中为此作证——他不仅为此作证，也为那给保罗本人施洗的亚拿尼亚作证。作为一名执事，他在撒玛利亚因缺乏长老而施洗，因为在必要时，若没有长老，执事也被允许施洗，正如圣灵亲自教导的，圣灵也曾启发腓力去接近那太监。必须留意，在受洗之后，圣灵借着奉主耶稣之名的祷告和按手，降临到受洗者身上。因此，直到如今，此仪式仍以同样的形式被遵守。
  - type: paragraph
    text:
      ru: 'Деян.8:9–21.Находился же в городе некоторый муж, именем Симон, который перед тем волхвовал и изумлял народ Самарийский, выдавая себя за кого-то великого. Ему внимали все, от малого до большого, говоря: сей есть великая сила Божия. А внимали ему потому, что он немалое время изумлял их волхвованиями. Но, когда поверили Филиппу, благовествующему о Царствии Божием и о имени Иисуса Христа, то крестились и мужчины и женщины. Уверовал и сам Симон и, крестившись, не отходил от Филиппа; и, видя совершающиеся великие силы и знамения, изумлялся. Находившиеся в Иерусалиме Апостолы, услышав, что Самаряне приняли слово Божие, послали к ним Петра и Иоанна, которые, придя, помолились о них, чтобы они приняли Духа Святаго. Ибо Он не сходил еще ни на одного из них, а только были они крещены во имя Господа Иисуса. Тогда возложили руки на них, и они приняли Духа Святаго. Симон же, увидев, что через возложение рук Апостольских подается Дух Святый, принес им деньги, говоря: дайте и мне власть сию, чтобы тот, на кого я возложу руки, получал Духа Святаго. Но Петр сказал ему: серебро твое да будет в погибель с тобою; потому что ты помыслил дар Божий получить за деньги. Нет тебе в сем части и жребия, ибо сердце твое неправо пред Богом.'
      cn: (使徒行传 8:9-21) 有一個人，名叫西門，向來在那城裏行邪術，妄自尊大，使撒瑪利亞的百姓被蠱惑； 無論大小都聽從他，說：「這人就是那稱為　上帝的大能者。」 他們聽從他，因他久用邪術，使他們被蠱惑。 及至他們信了腓利所傳　上帝的國的福音和耶穌　基督的名，連男帶女就受了浸。 西門自己也信了；既受了浸，就常與腓利在一處，看見他所行的神蹟和異能，就甚驚奇。 使徒在耶路撒冷聽見撒瑪利亞人領受了　上帝的道，就打發彼得、約翰往他們那裏去。 兩個人到了，就為他們禱告，要叫他們受　聖靈。 （因為他還沒有降在他們一個人身上，他們只奉　主耶穌的名受了浸。） 於是使徒按手在他們頭上，他們就受了　聖靈。 西門看見使徒按手，便有聖靈賜下，就拿錢給使徒。 說：「把這權柄也給我，叫我手按著誰，誰就可以受　聖靈。」 彼得卻對他說：「你的錢財和你一同滅亡吧，因你想　上帝的恩賜是可以用錢買的。 你在這道上無分無關；因為在　上帝眼前，你的心不正。


        城里有一个人，名叫西门，他素来行邪术，迷惑撒玛利亚的百姓，自称是那伟大的人。从最小的到最大的，众人都听从他，说：「这就是上帝那被称为『大能』的。」他们听从他，因为他长久用邪术迷惑他们。但当他们信了腓利，传讲上帝的国和耶稣基督之名时，无论男女都受了洗。西门自己也信了，既受了洗，就常与腓利相随；又看见所行的大异能和神迹，就甚惊奇。


        在耶路撒冷的众使徒，听见撒玛利亚人领受了上帝的道，就差派彼得和约翰往他们那里去。两人到了，就为他们祷告，要他们领受圣灵。因为圣灵还没有降在他们任何人身上，他们只奉主耶稣的名受了洗。于是使徒按手在他们头上，他们就领受了圣灵。西门看见藉着使徒按手便赐下圣灵，就拿钱给使徒，说：「也请把这权柄给我，叫我按手在谁身上，谁就可以领受圣灵。」彼得对他说：「你的银子和你就一同灭亡罢！因为你以为上帝的恩赐是可以用钱买的。你在这道上无分无关，因为你的心在上帝面前不正。」'
  - type: paragraph
    text:
      ru: 'Посмотри и на другое покушение, сделанное Симоном. Лука говорит, что его почитали за великую силу. Таким образом, в то время были и обольщенные волхвованиями, пока не пришел Филипп и вывел их из заблуждения, потому что Симон иудеям говорил: «Я – отец», а самарянам: «Я – Христос».«Уверовал и сам Симон». Не ради веры он уверовал, но чтобы и ему творить чудеса. Как он думал творить чудеса? Сам он обольщал, а также укрощал беснуемых, а потому думал, что и апостолы подобно ему пользуются каким-либо искусством. Поэтому он и деньги давал. Опять потому же, чтобы не лишиться этого дара, он постоянно находился при Филиппе.'
      cn: 看看西门所做的另一个诡计。路加说，他被尊为大能。因此，当时也有被巫术迷惑的人，直到腓利来到并使他们脱离迷误，因为西门对犹太人说：「我是父」，对撒玛利亚人则说：「我是基督」。「西门自己也信了」。他相信并非为了信心，而是为了自己也能行神迹。他以为自己如何才能行神迹呢？他自己迷惑人，也制服被鬼附的，因此他以为使徒们也像他一样，是运用某种方术。因此他也给了钱。同样地，为了不失去这恩赐，他一直常伴在腓利身边。
  - type: paragraph
    text:
      ru: 'Деян.8:22–25.Итак покайся в сем грехе твоем, и молись Богу: может быть, отпустится тебе помысел сердца твоего. Ибо вижу тебя исполненного горькой желчи и в узах неправды. Симон же сказал в ответ: помолитесь вы за меня Господу, дабы не постигло меня ничто из сказанного вами. Они же, засвидетельствовав и проповедав слово Господне, обратно пошли в Иерусалим и во многих селениях Самарийских проповедали Евангелие.'
      cn: (使徒行传 8:22-25) 所以你當懊悔你這罪惡，祈求　上帝，或者你心裏的意念可得饒恕。 我看出你正在苦膽之中，被罪惡捆綁。」 西門說：「願你們為我求　主，叫你們所說的，沒有一樣臨到我身上。」 使徒既證明　主道，而且傳講，就回耶路撒冷去，一路在撒瑪利亞許多村莊傳揚福音。


        所以，你当为你这罪悔改，并向上帝祷告：或许你心中的意念，可以得蒙赦免。因为我看见你充满了苦毒的胆汁，并且被不义的捆绑缠绕。西门回答说：「请你们为我向主祈求，免得你们所说的，有一样临到我身上。」他们作了见证，并传讲了主的话语之后，便回耶路撒冷去，并在撒玛利亚的许多乡村里传扬了福音。'
  - type: paragraph
    text:
      ru: 'По баснословию еретиков, излишне было говорить Симону:"покайся",потому что он таким дурным был создан. Они говорят, что человек, будучи злым по природе, неспособен измениться по желанию. Но не напрасно сказано:«итак покайся», потому что и он имел свободную волю,«и молись Богу: может быть, отпустится тебе помысел сердца твоего». Петр сказал это Симону, как будто бы не было оказано ему снисхождение, если бы он стал плакать и покаялся. Но этот образ выражения был обычным и у пророков. Особенно же Петр и предвидел, что он не обратится к покаянию. Поэтому он и говорит:«может быть, отпустится тебе». Потому что слова«помолитесь вы за меня Господу»Симон сказал не потому, что он покаялся и обратился, но ради одного только приличия. Потому что иначе где рыдание? где раскаяние и исповедание грехов?'
      cn: 照异端者的谬论，对西门说「悔改」是多余的，因为他就是被造得如此邪恶。他们说，人既然本性是邪恶的，就无法凭意愿改变。但并非徒然地说：「所以，悔改吧！并向上帝祈祷：或许你心中的意念会蒙赦免。」彼得对西门这样说，仿佛如果他开始哭泣并悔改，就不会得到赦免。但这种表达方式在先知那里也是常见的。彼得尤其预见到，他不会转向悔改。因此他说：「或许会蒙赦免。」因为西门说「请你们为我向上主祈祷」这句话，并非因为他悔改并回转了，而仅仅是为了体面。因为不然的话，他的哭泣在哪里呢？他的懊悔和认罪又在哪里呢？
  - type: paragraph
    text:
      ru: «Ибо вижу тебя исполненного горькой желчи и в узах неправды».
      cn: 因为我看见你充满苦胆，并在不义的捆绑之中。
  - type: paragraph
    text:
      ru: Слова полные гнева. Но Петр не наказывает его, чтобы потом вера его не показалась вынужденной силою необходимости и страха и это дело не показалось жестоким.
      cn: 言语充满怒气。然而彼得不惩罚他，以免他的信心日后显得是出于必然的强制与恐惧，并且使这事不致显得残酷。
  - type: paragraph
    text:
      ru: «Они же, засвидетельствовав и проповедав слово Господне, обратно пошли в Иерусалим». Может быть, они возвратились из-за Симона, чтобы не обольститься и чтобы потом быть твердыми. Заметь, что не с самого начала идут в Самарию, но когда их гонят в Иудее, как это было и со Христом.
      cn: 他们则在作了见证并宣讲了主的话语之后，回到了耶路撒冷。也许他们因着西门而返回，是为了不被迷惑，并为了之后能坚定不移。请注意，他们并非从一开始就去了撒玛利亚，而是在他们于犹太地受到逼迫之时，正如基督所经历的那样。
  - type: paragraph
    text:
      ru: 'Деян.8:26–33.А Филиппу Ангел Господень сказал: встань и иди на полдень, на дорогу, идущую из Иерусалима в Газу, на ту, которая пуста. Он встал и пошел. И вот, муж Ефиоплянин, евнух, вельможа Кандакии, царицы Ефиопской, хранитель всех сокровищ ее, приезжавший в Иерусалим для поклонения, возвращался и, сидя на колеснице своей, читал пророка Исайю. Дух сказал Филиппу: подойди и пристань к сей колеснице. Филипп подошел и, услышав, что он читает пророка Исайю, сказал: разумеешь ли, что читаешь? Он сказал: как могу разуметь, если кто не наставит меня? И попросил Филиппа взойти и сесть с ним. А место из Писания, которое он читал, было сие: «как овца, веден был Он на заклание, и, как агнец пред стригущим его безгласен, так Он не отверзает уст Своих. В уничижении Его суд Его совершился. Но род Его кто разъяснит? ибо вземлется от земли жизнь Его»(Ис. 53, 7–8).'
      cn: (使徒行传 8:26-33) 有　主的一個天使對腓利說：「起來。向南走，往那從耶路撒冷下迦薩的路上去。」那路是荒漠。 腓利就起身去了，不料，有一個埃塞俄比亞人，是個有大權的太監，在埃塞俄比亞女王甘大基的手下總管銀庫，他上耶路撒冷敬拜去了。 現在回來，在車上坐著，念先知以賽亞的書。 　靈對腓利說：「你去。貼近那車走。」 腓利就跑到太監那裏，聽見他念先知以賽亞的書，便問他說：「你所念的，你明白嗎？」 他說：「沒有人指教我，怎能明白呢？」於是請腓利上車，與他同坐。 他所念的那段聖經，說：「他像羊被牽到宰殺之地，又像綿羊羔在剪毛的人手下無聲；他也是這樣不開口。 他卑微的時候，他的審判被奪去；誰能述說他的世代？因為他的生命從地上奪去。」


        上主的使者对腓利说：「起来，向南去，到那从耶路撒冷下迦萨的路上去。那是一条旷野的路。」他就起来去了。看哪，有一个埃塞俄比亚人，是太监，是埃塞俄比亚女王干大基手下总管，掌管她一切财宝的；他曾上耶路撒冷去敬拜，现在正回去，坐在自己的车上读着先知以赛亚的书。


        圣灵对腓利说：「上前去，靠近那车。」腓利跑过去，听见他念先知以赛亚的书，就说：「你所读的，你明白吗？」他回答说：「若没有人教导我，我怎能明白呢？」于是他请腓利上车，与他同坐。他所念的经文是这段：「他像羊羔被牵到宰杀之地，又像羊在剪毛的人手下无声，他也是这样不开口。在祂的卑微中，祂的审判被剥夺了。祂的世代谁能述说呢？因为祂的性命从地上被夺去了。」（以赛亚书 53:7-8）'
  - type: paragraph
    text:
      ru: Мне кажется, что этот Филипп был из числа семи, потому что иначе из Иерусалима он шел бы не на полдень (юг), но на север, а из Самарии, где находился и учил Филипп, принадлежавший к числу семи, путь идет на полдень.
      cn: 我以为，这位腓利乃是七人之一，因为否则他若从耶路撒冷出发，就不是向南，而是向北而行。而从撒玛利亚——那属于七人之一的腓利曾居留并教导之地——路途是向南的。
  - type: paragraph
    text:
      ru: «На дорогу, идущую из Иерусалима в Газу, на ту, которая пуста». Это Ангел сказал для того, чтобы Филипп не боялся нападения иудеев.
      cn: 「『到那条从耶路撒冷通往加沙、空无一人的路上。』」这是天使说的，为的是让腓利不惧怕犹太人的袭击。
  - type: paragraph
    text:
      ru: '«Он встал и пошел». Заметь послушание. Филипп не спросил и не сказал: «для чего?», но вместе с повелением«встал и пошел».'
      cn: «他起身，就走了》。留意他的顺服。腓力没有问，也没有说：「为何？」而是伴随着「起身，就走了」这命令。
  - type: paragraph
    text:
      ru: «Евнух, вельможа Кандакии, царицы Ефиопской, хранитель всех сокровищ ее, приезжавший в Иерусалим для поклонения».Женщины властвовали в этой Эфиопии; одна из них по праву наследства была Кандакия; у нее евнух был казнохранителем. Заметь, что не было праздника, однако он ехал в Иерусалим, и что ехал из города, преданного суеверию, и на пути читал, и притом Исайю, величайшего из пророков, к тому же читал, не понимая того, что читал, и так усердно был занят чтением.
      cn: 「宦官，埃塞俄比亚女王坎大基的大臣，掌管她一切财宝的司库，曾前往耶路撒冷敬拜。」女人在这埃塞俄比亚掌权；其中一位凭着继承权是坎大基女王；宦官是她的司库。请留意，当时并非节期，然而他却前往耶路撒冷；而且他从一个充斥着迷信的城邑而来，并在路上阅读，阅读的还是先知中至大的以赛亚书；此外，他阅读时并不明白所读的内容，却如此勤恳地专注阅读。
  - type: paragraph
    text:
      ru: «Разумеешь ли, что читаешь?»Удивительным образом спрашивает, потому что и не льстит, и не хвалит, и не упрекает в невежестве. Но спрашивает так, чтобы возбудить большее желание и показать, что в читаемом находится великое сокровище. А евнух со всей откровенностью признается:«как могу разуметь, если кто не наставит меня?»Потом просит Филиппа научить его.
      cn: '«你可领悟你所读的吗？»

        他奇妙地发问，既不奉承，不赞美，也不斥责那人无知。但他的发问方式，旨在激发更大的渴望，并显明所读之中蕴藏着巨大的宝藏。那太监全然坦白地承认道：«若没有人指引我，我怎能领悟呢？»于是请求腓利教导他。'
  - type: paragraph
    text:
      ru: «Как овца, веден был Он на заклание». Очень понятен смысл приведенных слов, потому что в известное время овцы отводятся для стрижки и пастухи возлагают на них орудия стрижки, однако же овцы терпят это и не нападают на тех, кто это делает. Так и Христос, терпя поношения, не платил поношением за поношение.
      cn: «祂如同羊羔，被牵往宰杀之地。» 引述之言的含义非常明了，因为在特定时候，羊群被带去剪毛，牧羊人将剪毛工具加诸它们身上，然而羊群却忍受着这一切，并不攻击那些这样做的人。基督亦是如此，祂忍受着辱骂，没有以辱骂还辱骂。
  - type: paragraph
    text:
      ru: «В уничижении Его суд Его совершился». Указывает на противозаконный суд над Ним, произведенный тогда, как была скрыта истина.
      cn: «在祂的受辱中，祂的审判得以成就》。这指的是对祂进行的非法审判，是在真理被掩盖之时所施行的。
  - type: paragraph
    text:
      ru: '«Но род Его кто разъяснит?»То есть обнаружившееся после воскресения высокое Его достоинство, доказательством которого служит то, что было Им сделано в деле домостроительства. Кто будет в состоянии выразить словами, когда придет на мысль: «Кто это и Какой Такой, да еще Сын Божий Единородный претерпел все это?»'
      cn: 「但祂的本源，谁能阐明呢？」这就是说，祂复活之后所显现出的崇高尊严，其明证即是祂在神圣经纶中所成就的一切。当这念头浮现时，谁又能以言语来表达呢：「这究竟是谁，这位如此这般的，竟然是上帝的独生子，却忍受了这一切？」
  - type: paragraph
    text:
      ru: «Вземлется от земли жизнь Его». Вместо выражения «отнимается и возносится выше земного жизнь Его», то есть поприще деятельности и существование Единородного, когда Он созерцается вне плоти и уже не как находящийся среди нас.
      cn: 「祂的生命将从地上被取走。」这取代了「祂的生命被取走并升到超乎地上之境」的说法，指的是当独生者在肉身之外被默观，不再身处我们中间时，其活动的领域与存在。
  - type: paragraph
    text:
      ru: 'Деян.8:34–40.Евнух же сказал Филиппу: прошу тебя сказать: о ком пророк говорит это? о себе ли, или о ком другом? Филипп отверз уста свои и, начав от сего Писания, благовествовал ему об Иисусе. Между тем, продолжая путь, они приехали к воде; и евнух сказал: вот вода; что препятствует мне креститься? Филипп же сказал ему: если веруешь от всего сердца, можно. Он сказал в ответ: верую, что Иисус Христос есть Сын Божий. И приказал остановить колесницу, и сошли оба в воду, Филипп и евнух; и крестил его. Когда же они вышли из воды, Дух Святый сошел на евнуха, а Филиппа восхитил Ангел Господень, и евнух уже не видел его, и продолжал путь, радуясь. А Филипп оказался в Азоте и, проходя, благовествовал всем городам, пока пришел в Кесарию.'
      cn: (使徒行传 8:34-40) 太監對腓利說：「請問，先知說這話是指著誰？是指著自己呢？是指著別人呢？」 腓利就開口從這聖經上起，對他傳講耶穌。 二人正往前走，到了有水的地方，太監說：「看哪，這裏有水，我受浸有甚麼妨礙呢？」 腓利說：「你若是一心相信，就可以。」他回答說：「我信耶穌　基督是　上帝的　兒子。」 於是吩咐車站住，腓利和太監二人同下水裏去，腓利就給他施浸。 從水裏上來，　主的　靈把腓利提了去，太監也不再見他了，就歡歡喜喜的走路。 後來有人在亞鎖都遇見腓利；他走遍那地方，在各城傳揚福音，直到凱撒利亞。
  - type: paragraph
    text:
      ru: '«Прошу тебя сказать: о ком…?»Знать, что пророки иногда говорят и о других, или о себе самих в другом лице, потому что это показывает вопрос его, свойство человека очень наблюдательного.'
      cn: '«我求你告诉我：关于谁……？»

        他知道先知有时论及他人，或以第三人称论及自己，因为他所提出的问题，显明了这位极其敏锐之人的特质。'
  - type: paragraph
    text:
      ru: «Вот вода; что препятствует мне креститься?»Посмотри, как благоразумно он поступает. Сначала читает и не понимает, потом читает то же пророчество; в нем содержится учение о страдании, воскресении Иисуса Христа и о даровании благодати Святаго Духа. Затем просит крестить; Филипп изъясняет ему по порядку, начав с этого пророчества. А окрылившись готовностью, он постепенно приводится к крещению. Но он не сказал «крести меня», но:«что препятствует?»Этим вопросом он показал сильное желание принять крещение.
      cn: '「看哪，这里有水；有什么妨碍我受洗呢？」


        你看，他是何等明智地行事啊。他起初阅读，却不明白，然后他读了同一段预言；其中包含了关于耶稣基督的苦难、复活以及圣灵恩赐的教义。随后他请求受洗；腓利便按着次序向他解释，从这段预言开始讲起。而他因着这份热诚备受鼓舞，便逐渐被引领至受洗。但他没有说「给我施洗」，而是：「有什么妨碍呢？」他借由这个问题，显示出接受洗礼的强烈渴望。'
  - type: paragraph
    text:
      ru: '«Филиппа восхитил Ангел Господень». Его берет Ангел, тем самым придавая случившемуся больше чудесности, а вместе доставляя радость и Филиппу, что он удостаивается того же, чего и пророки, как например Аввакум. Хорошо, что он был взят от евнуха, потому что евнух стал бы просить Филиппа, чтобы он отправился с ним, и Филипп опечалил бы его, если бы по требованию обстоятельств отказался. Так все устроилось Божественным образом: Филипп оказался в Азоте. Здесь он и должен был затем проповедовать.'
      cn: «主的使者提去腓利»。他被使者提去，如此一来，这事便更添奇妙；同时，也给腓利带来喜乐，因为他蒙此恩典，与先知们，例如哈巴谷一样。他被提离宦官身边，乃是美善的安排，因为宦官本会请求腓利与他同行，而腓利若因情势所需而拒绝，便会使他忧伤。如此，一切都以神圣的方式安排妥当：腓利便在亚锁都现身。他便在此传讲福音。
- type: heading1
  text:
    ru: Глава девятая
    cn: 第九章
  children:
  - type: paragraph
    text:
      ru: Деян.9:1–2.Савл же, еще дыша угрозами и убийством на учеников Господа, пришел к первосвященнику и выпросил у него письма в Дамаск к синагогам, чтобы, кого найдет последующих сему учению, и мужчин и женщин, связав, приводить в Иерусалим.
      cn: (使徒行传 9:1-2) 掃羅仍然向　主的門徒口吐威嚇兇殺的話，去見大祭司， 求文書給大馬士革的各會堂，若是找著信奉這道的人，無論男女，都准他捆綁帶到耶路撒冷。
  - type: paragraph
    text:
      ru: Объясняя неистовство Павла – Савла, в будущем великого апостола Павла, – против верных и против Церкви, Лука показывает, что он увлекся нечистой ревностью, потому что на нем исполнилось сказанное Христом:«Всякий, убивающий вас, будет думать, что он тем служит Богу»(Ин. 16, 2). Потому что он делал это не так, как другие иудеи. Да не будет! Что он делал это по ревности, это очевидно из того, что он отправился и во внешние города, а иудеи не обращали внимания и на находящихся в Иерусалиме. Они об одном только и заботились, то есть о том, чтобы пользоваться почестями. Савл идет в Дамаск потому, что это был великий и царствующий город и он боялся, чтобы этот город не увлекся христианскою проповедью. Не идет он с просьбой к претору, но идет к первосвященнику, потому что имел намерение делать все законно.
      cn: 解释保罗——即未来伟大的使徒保罗——在扫罗时期对信徒和教会的狂热，路加表明他被一种不洁的狂热所驱使，因为基督所说的话在他身上应验了：「凡杀你们的，就以为是事奉上帝。」 (约翰福音 16:2)。因为他这样做，与其他犹太人不同。绝非如此！他出于狂热而这样做，这从他甚至前往外邦城市中显而易见，而其他犹太人甚至不理会那些在耶路撒冷的人。他们只关心一件事，那就是享受尊荣。扫罗前往大马士革，因为那是一个伟大且居于统治地位的城市，他担心这个城市会被基督教的宣讲所吸引。他不是向罗马总督提出请求，而是去见大祭司，因为他有意按律法行事。
  - type: paragraph
    text:
      ru: «Чтобы, кого найдет последующих сему учению, и мужчин и женщин, связав, приводить в Иерусалим». Что такое«последующих сему учению?»Может быть, так называли себя веровавшие, так как одна только их вера была такой, посредством которой мы возносимся на небо. Или же Павел называл их последователями сего учения – пути, возможно, из чувства презрения и в насмешку над ними, потому что бесчестного человека они обыкновенно называли «сбившимся с пути». Он искал власти не тут же наказывать христиан, но вести их в Иерусалим, потому что он хотел действовать с большей властью.
      cn: 「为要将他所寻得的、奉行这教训的、无论男女，捆绑起来，带到耶路撒冷。」什么叫做「奉行这教训的」？或许，信徒们如此称呼自己，因为唯有他们的信仰是如此的，借此我们得以升入天堂。抑或，保罗称他们为这教训、即这道路的追随者，也许是出于轻蔑和嘲弄他们，因为他们通常称呼不名誉的人为「偏离正道的人」。他寻求权力，不是立即惩罚基督徒，而是将他们带到耶路撒冷，因为他想以更大的权力行事。
  - type: paragraph
    text:
      ru: 'Деян.9:3–9.Когда же он шел и приближался к Дамаску, внезапно осиял его свет с неба. Он упал на землю и услышал голос, говорящий ему: Савл, Савл! что ты гонишь Меня? Он сказал: кто Ты, Господи? Господь же сказал: Я Иисус, Которого ты гонишь. Трудно тебе идти против рожна. Он в трепете и ужасе сказал: Господи! что повелишь мне делать? И Господь сказал ему: встань и иди в город; и сказано будет тебе, что тебе надобно делать. Люди же, шедшие с ним, стояли в оцепенении, слыша голос, а никого не видя. Савл встал с земли, и с открытыми глазами никого не видел. И повели его за руки, и привели в Дамаск. И три дня он не видел, и не ел, и не пил.'
      cn: (使徒行传 9:3-9) 掃羅行路，將到大馬士革，忽然從天上發光，四面照著他； 他就仆倒在地，聽見有聲音對他說：「掃羅。掃羅。你為甚麼逼迫我？」 他說：「　主啊，你是誰？」　主說：「我就是你所逼迫的耶穌，你用腳踢刺是難的。」 他就戰兢希奇，說：「　主啊，你要我作甚麼？」　主對他說：「起來。進城去，你所當做的事，必有人告訴你。」 同行的人站在那裏，說不出話來，聽見聲音，卻看不見人。 掃羅從地上起來；睜開眼睛，竟不能看見一人。有人拉他的手，領他進了大馬士革。 他三日不能看見，也不吃也不喝。


        他行路将近大马士革的时候，忽然从天上发光，四面照着他。他仆倒在地，听见有声音对他说：「扫罗，扫罗！你为什么逼迫我？」他说：「祢是谁，上主？」上主说：「我就是你所逼迫的耶稣。你用脚踢刺是难的。」他又战又兢地问道：「上主，祢要我做什么？」上主对他说：「起来！进城去，必有人告诉你所当作的事。」同行的人惊呆了，听见声音，却看不见人。扫罗从地上起来，眼睛虽然睁着，却什么也看不见。别人拉着他的手，领他进了大马士革。三日不能看见，也不吃，也不喝。'
  - type: paragraph
    text:
      ru: Видение произошло не в городе, но на пути и в тишине, потому что толпа не поверила бы, а только посмеялась бы, так как и при Иисусе Христе слышавшие голос с неба«говорили, что это гром»(Ин. 12, 29). А Савл заслуживал веры, потому что рассказывал о том, что с ним случилось. Итак, не в Иерусалиме и не в Дамаске, но на пути«внезапно осиял его свет», чтобы то, что с ним случилось, иные не стали объяснять иначе, но чтобы сам он объяснил это, так как он заслуживал веры, так как он и видение видел, и болезнь претерпел. Это говорит Павел и защищаясь перед Агриппой (см.Деян. 26, 12–18).
      cn: 异象发生不在城中，而是在路上和寂静中，因为人群不会相信，只会嘲笑，正如在耶稣基督身边时，听见天上声音的人「说那是雷声」（约翰福音 12:29）。而扫罗配得相信，因为他讲述了发生在他身上的事。因此，不是在耶路撒冷，也不是在大马士革，而是在路上，「忽然有光照亮了他」，为了不让其他人对发生在他身上的事作出不同的解释，而是让他自己来解释，因为他配得相信，他既看见了异象，也经受了病痛。这是保罗在亚基帕面前为自己辩护时所说的（参阅 使徒行传 26:12-18）。
  - type: paragraph
    text:
      ru: '«Савл, Савл! что ты гонишь Меня?»Христос не говорит ему: «веруй!», но упрекает его, говоря:«что ты гонишь Меня?»Почти что говорит: «Что малое или великое ты потерпел от Меня, что ты Мне делаешь это?»'
      cn: '「扫罗，扫罗！你为什么逼迫我？」


        基督没有对他说：「相信罢！」，却责备他，说：「你为什么逼迫我？」


        几乎是说：「你从我这里受了什么或大或小的苦，以至于你这样对待我？」'
  - type: paragraph
    text:
      ru: «Я Иисус, Которого ты гонишь». Это сказано вместо «не думай, что ты враждуешь против людей, но – против Меня, Господа твоего». Для чего это явление и вразумление Савлу не было сделано вначале? Для того, чтобы показать, что Христос действительно воскрес. Потому что как уверовал бы гонитель Его и неверующий Его воскресению, неистово преследующий верующих, если бы сила воскресения Его не была велика? А почему не тотчас же после воскресения? Чтобы очевиднее обнаружилась вражда против учения о воскресении и более Божественной явилась перемена в образе мыслей Павла.
      cn: 「我就是你所逼迫的耶稣。」这话乃是说：「不要以为你是在与人作对，而是与我——你的上主——作对。」为何这次的显现与对扫罗的训诲没有在起初就发生呢？是为了表明基督确实已经复活。因为，若非祂复活的大能伟大，一个逼迫祂、不信祂复活、并狂热迫害信徒的人，又怎会相信呢？那么，为何不在复活之后立刻发生呢？为了更清楚地显明对复活教义的敌意，并使保罗思想上的转变显得更具神性。
  - type: paragraph
    text:
      ru: '«Люди же, шедшие с ним, стояли в оцепенении, слыша голос, а никого не видя». Всех бывших с ним осиявает свет, чтобы они свидетельствовали об этом явлении, но ослепляет он не всех, а одного только Павла, чтобы не подумали, что это было общее и как бы случайное несчастье, но чтобы открылось, что это было вполне действие Божественного Промысла. Почему же не уверовали бывшие с ним? Чтобы они могли быть достоверными свидетелями того, что случилось с Павлом. Потому что если бы они уверовали, то показалось бы, что они свидетельствуют по пристрастию. А чей голос слышали бывшие с Павлом? Голос самого Павла, когда он отвечал, а голос небесный слышал один он. Поэтому-то здесь и сказано:«Люди… шедшие с ним, стояли в оцепенении, слыша голос», то есть голос Павла,«а никого не видя», кому он отвечал. Позже, в Иерусалиме, Павел рассказывал: Бывшие…«со мною свет видели, и пришли в страх; но голоса Говорившего мне не слыхали»(Деян. 22, 9).'
      cn: 「与他同行的人都站在那里，惊呆了，听见声音，却看不见一人。」随他同去的人都被光照耀，为要让他们为此异象作证，但这光并非使所有人都失明，而只使保罗一人失明，免得人们以为这是一次普遍的、似乎是偶然的灾祸，而是要显明这完全是神圣普施天恩的作为。那么，随他同去的人为何没有信奉呢？是为了让他们能够成为保罗所遭遇之事的可信见证人。因为倘若他们信奉了，就会显得他们是出于偏爱而作证。那么，与保罗同行的人听见的是谁的声音呢？是保罗自己回答时的声音，而天上的声音只有他一人听见。因此，这里才说：「与他同行的人都站在那里，惊呆了，听见声音」，也就是保罗的声音，「却看不见一人」，即他回答的对象。后来，在耶路撒冷，保罗讲述道：「与我同行的人，确实看见了光，也甚是惧怕；但那对我说话者的声音，他们却没有听见」（使徒行传 22:9）。
  - type: paragraph
    text:
      ru: «Савл встал с земли, и с открытыми глазами никого не видел». Очи Павла пострадали, потому что избыток света обыкновенно действует болезненно, так как и глаза имеют меру. Говорят также, что чрезмерный звук делает глухими и бесчувственными.
      cn: «扫罗从地上站起来，眼睛虽睁开，却什么也看不见。» 保罗的眼睛受了损害，因为光线过强通常会造成疼痛，正如眼睛也有其限度。人们也说，过于巨大的声音会使人失聪，甚至失去感觉。
  - type: paragraph
    text:
      ru: «И три дня он не видел, и не ел, и не пил». Для чего он сделал это? Потому что он очень раскаивался в том, что преследовалЦерковь, и печалился, и молился, и просил Бога, чтобы было прощено ему это.
      cn: 「并且他三天没有看见，也没有吃，也没有喝。」他为何如此行？因为他极其悔改，为他逼迫教会一事，并且忧伤，祷告，恳求上帝，求祢赦免他所行之事。
  - type: paragraph
    text:
      ru: 'Деян.9:10–16.В Дамаске был один ученик, именем Анания; и Господь в видении сказал ему: Анания! Он сказал: я, Господи. Господь же сказал ему: встань и пойди на улицу, так называемую Прямую, и спроси в Иудином доме Тарсянина, по имени Савла; он теперь молится, и видел в видении мужа, именем Ананию, пришедшего к нему и возложившего на него руку, чтобы он прозрел. Анания отвечал: Господи! я слышал от многих о сем человеке, сколько зла сделал он святым Твоим в Иерусалиме; и здесь имеет от первосвященников власть вязать всех, призывающих имя Твое. Но Господь сказал ему: иди, ибо он есть Мой избранный сосуд, чтобы возвещать имя Мое перед народами и царями и сынами Израилевыми. И Я покажу ему, сколько он должен пострадать за имя Мое.'
      cn: (使徒行传 9:10-16) 當下，在大馬士革有一個門徒，名叫亞拿尼亞。　主在異象中對他說：「亞拿尼亞。」他說：「　主，請看，我在這裏。」 　主對他說：「起來。往直街去，在猶大的家裏，尋訪一個大數人，名叫掃羅。他正禱告， 便在異象中看見了一個人，名叫亞拿尼亞，進來按手在他身上，叫他能看見。」 亞拿尼亞回答說：「　主啊，我聽見許多人說：『這人怎樣在耶路撒冷多多苦害你的聖徒， 並且他在這裏有從祭司長得來的權柄捆綁一切求告你名的人。』」 　主對亞拿尼亞說：「你只管去。他是我所揀選的器皿，要在外邦人和君王，並以色列人面前宣揚我的名。 我也要指示他，為我的名必須受何等大的苦難。」


        在大马士革，有一个门徒，名叫亚拿尼亚；主在异象中对他说道：亚拿尼亚！他说：我在这里，主啊。主又对他说：起来，往那称为「直街」的路上去，在犹大的家里寻找一个大数人，名叫扫罗；他现在正在祷告，并且在异象中看见一个名叫亚拿尼亚的人，进来给他按手，使他能复明。亚拿尼亚回答说：主啊！我从许多人那里听闻过这个人，他在耶路撒冷向祢的圣徒作了多少恶事；并且他在这里也得了祭司长的权柄，要捆绑所有呼求祢名的人。但主对他说：你去吧！因为他是我所拣选的器皿，为要在外邦人、君王和以色列子民面前宣扬我的名。我也要指示他，为了我的名他将要受多少苦。'
  - type: paragraph
    text:
      ru: 'Почему Анания, не будучи из числа достопамятнейших и известных учеников Спасителя, получает власть огласить и уврачевать Павла, имевшего сделаться таким великим проповедником Евангелия? Потому что Павел должен был быть наставлен в истинах веры не человеком, но самим Христом. Потому и Анания его окрестил и уврачевал, но ничему не учил. А что он не был из числа очень известных, это очевидно из его опасения и страха, что открывается из его слов. Он так боялся преследования со стороны Павла, что был поражен и пришел в ужас, когда только услышал от Господа имя его. Он не обратил внимания даже и на то, что было сказано затем: что Савл"молится", что он видел видение, что он слеп и что Анания посылается к нему для того, чтобы оказать ему благодеяние и спасти его.'
      cn: 为什么亚拿尼亚，不属于救主最值得纪念和最著名的门徒之列，却得到权柄向那后来要成为如此伟大的福音传道者的保罗宣告，并治愈他？因为保罗应该在信仰真理上受教导，不是由人，而是由基督自己。因此亚拿尼亚为他施洗并治愈了他，但没有教导他任何事。而他并非属于非常著名的人物之列，这从他言语中显露出的担忧和恐惧中显而易见。他如此惧怕来自保罗的迫害，以至于当他仅仅从主那里听到保罗的名字时，就震惊并陷入了恐惧。他甚至没有留意到随后所说的话：扫罗「正在祷告」，他看见了异象，他是瞎眼的，并且亚拿尼亚被差遣到他那里，是为了施恩于他并拯救他。
  - type: paragraph
    text:
      ru: «Видел в видении мужа, именем Ананию», потому что он не мог видеть наяву, так как был слеп.
      cn: 「在异象中看见一个名叫亚拿尼亚的男人」，因为他当时失明，无法凭肉眼看见。
  - type: paragraph
    text:
      ru: '«Здесь имеет от первосвященников власть вязать всех». Откуда было это им известно? Естественно было находящимся в страхе допытываться и узнавать то, что против них замышляется. Посмотри на страх, каков он, потому что он не допустил, чтобы дошло до его слуха имя «Павел», и уже говорит: «Боюсь, чтобы как-либо он не отвел меня в Иерусалим».'
      cn: '「他在这里，拥有从大祭司那里得来的捆绑所有人的权柄。」

        他们从何处得知此事？身处恐惧之中的人，自然会追问并打听针对他们的阴谋。

        看看这恐惧是何等强大，因为它甚至还没等「保罗」这个名字传到他耳中，就已开口说：「我恐怕他会以某种方式把我带到耶路撒冷去。」'
  - type: paragraph
    text:
      ru: '«Иди, ибо он есть Мой избранный сосуд». Не только, говорит, он сделается верующим, но и учителем, и будет иметь великое дерзновение,«перед народами и царями»и перед иудеями предстанет. Этим Господь ободряет Ананию, а вместе и пристыжает его, как бы говоря: «Если он так неистовствовал из-за Меня и убивал, и однако же будет терпеть все, то неужели ты не хочешь даже и крестить его? Потому повелеваю тебе идти к нему, что«он есть Мой избранный сосуд»и что пронесет имя Мое». Анания, услышав, что Павел слеп, возрадовался, и смысл его слов был таков: «Это хорошо, оставь его слепым, зачем повелеваешь мне отверсть очи его? Чтобы он опять стал вязать? Или чтобы он снова стал наказывать нас?» На это Господь говорит: «Он не только не будет делать ничего ужасного, но и будет терпеть многое за Меня».'
      cn: 「去吧，因为他是我的蒙拣选的器皿。」他不仅会成为信徒，而且会成为教师，并且将拥有极大的胆量，「在万民和君王面前」，并将在犹太人面前站立。上主以此鼓励亚拿尼亚，同时也在羞辱他，仿佛在说：「如果他曾因我的缘故如此狂暴并杀害人，然而他仍将忍受一切，那么你难道连给他施洗都不愿吗？因此我命令你到他那里去，因为『他是我蒙拣选的器皿』，并且他将传扬我的名。」亚拿尼亚听闻保罗瞎了眼，就欢喜了，他话语的意思是这样：「这很好，让他继续瞎着吧，你为何命令我开他的眼睛呢？好让他再次捆绑人吗？抑或让他再次惩罚我们吗？」对此，上主说：「他不仅不会做任何可怕的事，而且将为我忍受许多苦难。」
  - type: paragraph
    text:
      ru: 'Деян.9:17–19.Анания пошел и вошел в дом и, возложив на него руки, сказал: брат Савл! Господь Иисус, явившийся тебе на пути, которым ты шел, послал меня, чтобы ты прозрел и исполнился Святого Духа. И тотчас как бы чешуя отпала от глаз его, и вдруг он прозрел; и, встав, крестился, и, приняв пищи, укрепился. И был Савл несколько дней с учениками в Дамаске.'
      cn: (使徒行传 9:17-19) 亞拿尼亞就去了，進入那家，把手按在掃羅身上，說：「兄弟掃羅，在你來的路上向你顯現的　主，就是耶穌，打發我來，叫你能看見，又被　聖靈充滿。」 掃羅的眼睛上，好像有鱗立刻掉下來，他就能看見。於是起來受了浸； 吃過食物就健壯了。掃羅和大馬士革的門徒同住了些日子，

        亚拿尼亚便去了，进了那家，按手在他身上，说：「弟兄扫罗！那在你所行的路上向你显现的主耶稣差遣我来，是要叫你能够看见，并且被圣灵充满。」扫罗的眼睛立刻好像有鳞片掉下来，他就立刻能看见了；于是他站起来受了洗，又领了食物，就得了力量。扫罗在大马士革与门徒们同住了几日。'
  - type: paragraph
    text:
      ru: Посмотри, какое послушание после величайшего страха. Итак, эти слова Анании были изречены им не вследствие неверия, но вследствие страха и трепета.
      cn: 看啊，在极大的恐惧之后，何等顺服！因此，亚拿尼亚说出这些话，并非由于不信德，而是由于恐惧和战兢。
  - type: paragraph
    text:
      ru: '«Брат Савл! Господь Иисус, явившийся тебе на пути, которым ты шел, послал меня». Тотчас знакомит его с именем Господа. И притом Христос не сказал Анании: «Я явился Савлу», но сказал: «он научен Духом»; и действительно, Иисус Христос не являлся ему лично, но, конечно, явился делами и действиями. Говорит«явившийся тебе»; не сказал: «ослепивший тебя и отклонивший поношение». Говорит:«послал меня». Не мое, говорит, это дело. Я слуга благодати. Таким образом, они не могли ничего вымышлять от себя.'
      cn: 「弟兄扫罗！上主耶稣，就是在你所行的路上向你显现的那位，差遣了我来。」立刻使他认识上主之名。并且基督没有对亚拿尼亚说：「我曾向扫罗显现」，却说：「他受了圣灵的教导」；而且，实际上，耶稣基督并没有亲自向他显现，但无疑地，祂藉着祂的作为和行动显现了。（经文）说：「向你显现的」；而没有说：「使你眼瞎的、并消除羞辱的」。（经文）说：「差遣了我来」。这不是我的事，（他）说。我是恩典的仆役。如此一来，他们就不能从自己发明任何东西。
  - type: paragraph
    text:
      ru: «И тотчас как бы чешуя отпала от глаз его». Чешуи отпадают и показывают, что воспаление сильно и что исцеление не подлежит сомнению.
      cn: «随即好像有鳞片从他眼中脱落了». 鳞片脱落，并显明炎症严重，且医治是不容置疑的。
  - type: paragraph
    text:
      ru: «Встав, крестился, и, приняв пищи, укрепился», потому что силы его ослабели отчасти от путешествия, отчасти от страха, отчасти от голода, а отчасти от малодушия. Заметь, что он не решился принять пищу до тех пор, пока не получил великих даров.
      cn: 「他站起来，划了十字圣号，领受了食物，便得了力量」，因为他的气力衰弱了，一部分是由于旅途劳顿，一部分是由于恐惧，一部分是由于饥饿，还有一部分是由于心志怯弱。请注意，他不敢领受食物，直到他获得了伟大的恩赐。
  - type: paragraph
    text:
      ru: Деян.9:20–22.И тотчас стал проповедывать в синагогах об Иисусе, что Он есть Сын Божий.
      cn: (使徒行传 9:20-22) 他隨即在各會堂裏傳揚　基督，說他是　上帝的　兒子。 凡聽見的人都驚奇，說：「在耶路撒冷殘害求告這名的，不是這人嗎？並且他到這裏來，豈不是特要捆綁他們，帶到祭司長那裏。」 但掃羅越發有能力，駁倒住大馬士革的猶太人，證明耶穌是那位　基督。
  - type: paragraph
    text:
      ru: '«И все слышавшие дивились и говорили: не тот ли это самый, который гнал в Иерусалиме призывающих имя сие? да и сюда за тем пришел, чтобы вязать их и вести к первосвященникам. А Савл более и более укреплялся и приводил в замешательство Иудеев, живущих в Дамаске, доказывая, что Сей есть Христос».'
      cn: 「所有听见的人都感到诧异，说：『这不是那个在耶路撒冷逼迫呼求这名的人吗？并且他到这里来也是为此，要捆绑他们，并把他们带到大祭司那里去。』但扫罗却越发刚强起来，并使住在大马士革的犹太人困惑不已，证明这位就是基督。」
  - type: paragraph
    text:
      ru: Не говорит Павел, что Иисус воскрес, что Он жив, но что? Тотчас тщательно доказывает, что«Он есть Сын Божий». Тотчас он сделался учителем, потому что он не стыдился того, что в нем произошла перемена по отношению к тому, что сделалось для него ясно.
      cn: 保罗没有说耶稣复活了，祂活着，而是说什么？他立刻仔细地证明「祂是上帝之子」。他立刻就成了一位教师，因为他不以自己身上关于对他而言变得清晰的事所发生的改变为耻。
  - type: paragraph
    text:
      ru: «Савл более и более укреплялся и приводил в замешательство Иудеев». Иудеи смущены, потому что чему он научен был из закона Моисеева, о том спрашивал и их. Они думали, что, избавившись от Стефана, они избавились и от этих рассуждений, а между тем нашли другого совопросника, более сильного, чем Стефан. Он, доказывая это, преподавал и изъяснял из тех писаний, которые им были известны.
      cn: 「扫罗越发刚强，使犹太人困窘。」犹太人困惑不解，因为他从摩西律法中所学到的，也以此质问他们。他们原以为，摆脱了司提反，也就能摆脱这些论辩了，不料却找到了另一个善辩者，比司提反更为强劲。他在证明此事时，就从他们所熟知的经文教导并阐明。
  - type: paragraph
    text:
      ru: Деян.9:23–26.Когда же прошло довольно времени, Иудеи согласились убить его. Но Савл узнал об этом умысле их. А они день и ночь стерегли у ворот, чтобы убить его. Ученики же ночью, взяв его, спустили по стене в корзине. Савл прибыл в Иерусалим и старался пристать к ученикам; но все боялись его, не веря, что он ученик.
      cn: (使徒行传 9:23-26) 後來滿了許多日子，猶太人商議要殺掃羅； 但他們埋伏的事被掃羅知道了。他們又晝夜在城門守候，要殺他。 眾門徒就在夜間用籃子把他從城牆上縋下去。 掃羅到了耶路撒冷，想與門徒結交，他們卻都怕他，不信他是門徒。


        当过了不少时日，犹太人就商议要杀害扫罗。但扫罗知道了他们的这个阴谋。他们却昼夜在城门守候，要杀害他。门徒们却在夜里，带着他，用筐子沿着城墙把他缒了下去。扫罗到了耶路撒冷，设法要与门徒们亲近；但众人都害怕他，不相信他真是门徒。'
  - type: paragraph
    text:
      ru: Иудеи опять приходят к своему крепчайшему помыслу, но теперь они уже не ищут клеветников и лжесвидетелей, а сами стремятся совершить убийство. Так как они увидели, что это дело получило силу, то они не передают уже его и в суд.
      cn: 犹太人再次陷入他们那最坚固的意念中，但现在他们不再寻找诽谤者和假见证人，而是他们自己力图施行谋杀。因为他们看见这事已然获得力量，他们便不再将其交由法庭。
  - type: paragraph
    text:
      ru: «Ученики же ночью, взяв его, спустили по стене в корзине». Заметь, что Павел спасается не благодатью, но человеческой мудростью, чтобы ты научился, что добродетель мужа сияет и без чудес.
      cn: 「门徒们于夜间带走他，用筐子把他沿城墙缒下。」 (使徒行传 9:25) 请留意，保罗的得救并非靠着恩典，而是靠着人的智慧，好让你学习到，人的德行即使没有神迹也一样闪耀。
  - type: paragraph
    text:
      ru: «Савл прибыл в Иерусалим и старался пристать к ученикам». Избавясь от опасности, он не только не скрывается, но, напротив, идет туда, где более их преследовали. И заметь, что он даже ищет учеников Спасителя, так он весь воспламенился и переполнился ревностью о проповеди, и то, что он позже других пришел ко Христу, его сделало еще более ревностным.
      cn: 「扫罗抵达耶路撒冷，并努力与门徒们亲近。」 摆脱了危险，他不仅没有躲藏，反而去了门徒们遭受更剧烈迫害的地方。并且请注意，他甚至寻找救主的门徒，他如此完全地被点燃，并充满了传道的炽热心志，而他比其他人更晚归向基督这一事实，使他变得更加热心。
  - type: paragraph
    text:
      ru: Справедливо может возникнуть недоумение, как апостол Павел в послании говорит:«Не пошел в Иерусалим… а пошел в Аравию, и опять возвратился в Дамаск. Потом, спустя три года, ходил… в Иерусалим видеться с Петром… Другого же из апостолов… не видел никого, кроме Иакова, брата Господня»(Гал. 1, 17–19), – а здесь говорится, что он пришел в Иерусалим и Варнава привел его к апостолам. Итак, или в Послании к Галатам апостол Павел сказал:"не пошел"в том смысле, что он ходил не затем, чтобы представить свое учение на одобрение апостолов, или же, если это не так, надобно допустить предположение, что злоумышление против него в Дамаске было сделано не тотчас по обращении его к вере христианской, но по возвращении его из Аравии спустя три года по обращении. И таким образом совершилось его путешествие во Иерусалим. Итак, он не пошел к апостолам, но«старался пристать к ученикам». Это он делал, будучи одновременно и учителем, и учеником. Или Павел в Послании к Галатам не говорит об этом путешествии в Иерусалим, потому что его историограф[21]многое сокращает и сводит события, бывшие в разные времена."Старался"же, говорит Лука,«пристать к ученикам». Шел к ним не смело, но с робостью.
      cn: 可能会合理地产生困惑，为什么使徒保罗在书信中说：「没有上耶路撒冷去……却往阿拉伯去，后又回到大马士革。过了三年，才上耶路撒冷去见彼得……至于别的使徒，除了主的兄弟雅各，我都没有看见。」（加拉太书 1:17-19），而这里却说他到了耶路撒冷，巴拿巴把他领到使徒那里。因此，或者在《加拉太书》中，使徒保罗说「没有去」是指他去的目的不是为了将自己的教义呈交使徒们认可，又或者，如果不是这样，就必须假设在大马士革对他的恶意阴谋并非在他皈依基督信仰后立即发生，而是在他从阿拉伯回来，即皈依后三年才发生。这样，他的耶路撒冷之行就完成了。因此，他没有去找使徒们，而是「设法与门徒们亲近」。他这样做，同时既是老师也是学生。又或者保罗在《加拉太书》中没有提到这次耶路撒冷之行，因为他的史学家[21]删减了许多内容，并将发生在不同时期的事件归结在一起。路加说，他「设法与门徒们亲近」。他走到他们那里并非大胆，而是带着几分畏怯。
  - type: paragraph
    text:
      ru: «Все боялись его, не веря, что он ученик». Боялись, конечно, ученики, а апостолы не верили его обращению, потому что для человеческого разумения поистине невероятно, чтобы такой жаркий гонитель обратился в проповедника.
      cn: 「所有人惧怕他，不相信他是一个门徒。」 惧怕的，当然是门徒们；而使徒们不相信他的皈依，因为在人的理解看来，这样一个狂热的迫害者竟然会转变为一个宣讲者，这确实是难以置信的。
  - type: paragraph
    text:
      ru: Деян.9:27–31.Варнава же, взяв его, пришел к Апостолам и рассказал им, как на пути он видел Господа, и что говорил ему Господь, и как он в Дамаске смело проповедовал во имя Иисуса. И пребывал он с ними, входя и исходя, в Иерусалиме, и смело проповедовал во имя Господа Иисуса. Говорил также и состязался с Еллинистами; а они покушались убить его. Братия, узнав о сем, отправили его в Кесарию и препроводили в Тарс. Церкви же по всей Иудее, Галилее и Самарии были в покое, назидаясь и ходя в страхе Господнем; и, при утешении от Святого Духа, умножались.
      cn: (使徒行传 9:27-31) 唯有巴拿巴接待他，領去見使徒，把他在路上怎麽看見　主，他怎麽向他說話，他在大馬士革怎麽奉耶穌的名放膽傳道，都述說出來。 於是掃羅在耶路撒冷和門徒出入來往， 他奉　主耶穌的名放膽傳道，並與希臘人講論辯駁；他們卻想法子要殺他。 弟兄們知道了就送他下凱撒利亞，打發他往大數去。 那時，猶太、加利利、撒瑪利亞各處的教會都得平安，被造就；行事敬畏　主，蒙　聖靈的安慰，人數就增多了。
  - type: paragraph
    text:
      ru: 'Что Варнава человек кроткий и снисходительный, это видно и из этого, и из того, что им сделано после этого. Может быть, он и прежде знал Павла, будучи другом его. К каким апостолам привел он Павла? Может быть, к Петру и Иакову, о которых и сам Павел в Послании к Галатам говорит, что знал их. Обрати внимание на Павла: он не идет к апостолам, как человек скромно о себе думающий, но идет к ученикам, как будто бы и он только ученик. А Варнава ведет его и к апостолам и рассказывает о том, какое Павел имел дерзновение.'
      cn: 巴拿巴为人温顺宽厚，这从这件事和之后他所做的事中都可以看出。也许他早已认识保罗，是他的朋友。他把保罗带到哪些使徒那里呢？也许是彼得和雅各，保罗自己在《加拉太书》中也提到认识他们。请注意保罗：他没有像一个谦卑自持的人那样直接去找使徒，而是去找门徒，仿佛他自己也只是个门徒。然而巴拿巴却把他带到使徒那里，并讲述了保罗曾有过的胆量。
  - type: paragraph
    text:
      ru: «Говорил также и состязался с Еллинистами»или с теми иудеями, которые говорили по-гречески. Потому что другие евреи, закоренелые, не могли и смотреть на него или, вернее, даже решились убить его.
      cn: 「他也与希腊人讲论并辩驳」——或与那些说希腊语的犹太人。因为其他的犹太人，那些顽固不化的，甚至不能看他一眼，或者，更确切地说，他们甚至决意要杀他。
  - type: paragraph
    text:
      ru: «Братия, узнав о сем, отправили его в Кесарию». Напуганные тем, что случилось со Стефаном, отправляют его в Кесарию, а потом также и в Тарс, чтобы он там и учил, и находился в безопасности, как в собственном отечестве, потому что иудеи не бесились против других так, как против него. Ибо других апостолов они уже знали и бешенство, направленное против них, в них уже ослабело от времени; знали также, как они часто находили себе защиту и каким уважением пользовались они в народе.
      cn: 「弟兄们得知此事后，便打发他往凯撒利亚去。」他们鉴于司提反所遭遇之事，深感惊惧，便将他送往凯撒利亚，之后又送往大数，为要使他能在那里教导，并如同在自己的故乡一般安然无恙，因为犹太人对其他人的狂怒，不如对他的狂怒那般强烈。因为其他的使徒他们早已熟识，且针对他们的狂怒，已随着时间而减弱；他们也深知使徒们常得蒙保护，以及他们在民众中所得的敬重。
  - type: paragraph
    text:
      ru: «Церкви же по всей Иудее, Галилее и Самарии были в покое». Лука хочет сказать, что оттуда пришел Петр. Итак, чтобы ты не подумал, что он сделал это из страха, он сначала сказал, что эти церкви имели мир, потому что когда в Иерусалиме был разгар вражды, апостолы пребывали в нем, а когда там настал мир, они отправились проповедовать и в другие места.
      cn: «在全犹太、加利利、撒玛利亚的众教会都得了平安。» 路加意欲表明，彼得是从那里来的。因此，为免你认为他是出于惧怕而行此事，他先说这些教会得了平安。因为当耶路撒冷处于猛烈的敌对之中时，使徒们仍留在其中；而当那里有了平安，他们便前往别处宣讲。
  - type: paragraph
    text:
      ru: 'Деян.9:32–35.Случилось, что Петр, обходя всех, пришел и к святым, живущим в Лидде. Там нашел он одного человека, именем Энея, который восемь уже лет лежал в постели в расслаблении. Петр сказал ему: Эней! исцеляет тебя Иисус Христос; встань с постели твоей. И он тотчас встал. И видели его все, живущие в Лидде и в Сароне, которые и обратились к Господу.'
      cn: (使徒行传 9:32-35) 彼得周流四方的時候，也到了居住呂大的聖徒那裏； 他在那裏遇見一個人，名叫以尼雅，得了癱瘓，在褥子上躺臥八年。 彼得對他說：「以尼雅，耶穌　基督醫好你了；起來。收拾你的褥子。」他就立刻起來了。 凡住呂大和沙崙的人都看見了他，就歸服　主。


        恰巧彼得巡行各方，也来到了住在吕大的圣徒那里。他在这里找到一个人，名叫埃涅阿斯，已经八年因瘫痪躺在床上。彼得对他说：「埃涅阿斯！耶稣基督医治你；从你的床上起来吧！」他就随即起来了。住在吕大和沙仑的所有人都看见了他，他们也都归向上主。'
  - type: paragraph
    text:
      ru: 'Почему Петр не ожидал обнаружения веры этого мужа и не спросил, желает ли он быть исцелен? Это чудо было совершено, конечно, в особенности в назидание многих. Потому что Лука говорит:«И видели его все, живущие в Лидде и в Сароне, которые и обратились к Господу». А с другой стороны, чудеса здесь не обнаруживали еще своей силы. А потому здесь и неуместно было бы требовать веры в них. Потому-то апостолы и хромого не спрашивали. Как Христос, полагая начало чудес, не требовал веры, так и они не требуют. А в Иерусалиме вера в них, конечно, распространилась раньше: так многие желали,«дабы хотя тень проходящего Петра», говорит Лука,«осенила кого из них»(Деян. 5, 15). Потому-то там и было сотворено много чудес, а здесь тогда только было положено начало им.'
      cn: 为什么彼得没有料到这位男子显现出的信心，也没有问他是否愿意得医治？这个奇迹的成就，当然，尤其是为了教诲许多人。因为路加说：「所有住在吕大和沙仑的人都看见了他，并且他们都归向了上主。」而另一方面，这里的神迹奇事尚未显明其能力。因此，在这里要求人们对这些神迹有信心也是不合宜的。正因如此，使徒们也没有问那瘸子。正如基督在祂开始行神迹奇事时没有要求人有信心，他们也同样没有要求。然而在耶路撒冷，对使徒们行神迹的能力的信心当然早就传开了：以至于许多人渴望，路加说，「巴不得彼得走过时，至少他的影子能落在他们身上」（使徒行传 5:15）。正因如此，在那里也就行了许多奇迹；而在这里，那时只是刚刚开始行神迹奇事。
  - type: paragraph
    text:
      ru: 'Деян.9:36–43.В Иоппии находилась одна ученица, именем Тавифа, что значит: «серна»; она была исполнена добрых дел и творила много милостынь. Случилось в те дни, что она занемогла и умерла. Ее омыли и положили в горнице. А как Лидда была близ Иоппии, то ученики, услышав, что Петр находится там, послали к нему двух человек просить, чтобы он не замедлил придти к ним. Петр, встав, пошел с ними; и когда он прибыл, ввели его в горницу, и все вдовицы со слезами предстали перед ним, показывая рубашки и платья, какие делала Серна, живя с ними. Петр выслал всех вон и, преклонив колени, помолился, и, обратившись к телу, сказал: Тавифа! встань. И она открыла глаза свои и, увидев Петра, села. Он, подав ей руку, поднял ее, и, призвав святых и вдовиц, поставил ее перед ними живою. Это сделалось известным по всей Иоппии, и многие уверовали в Господа. И довольно дней пробыл он в Иоппии у некоторого Симона кожевника.'
      cn: (使徒行传 9:36-43) 在約帕有一個女徒，名叫大比大，翻希臘話就是多加；她廣行善行，多施賙濟。 當那些日子，她患病而死；有人把她洗了，停在樓上。 呂大原與約帕相近；門徒聽見彼得在那裏，就打發兩個人去見他，央求他說：「快到我們那裏去，不要耽延。」 彼得就起身和他們同去；到了，便有人領他上樓。眾寡婦都站在彼得旁邊哭，拿多加與她們同在時所作的裏衣外衣給他看。 彼得叫她們都出去，就跪下禱告，轉身對著死人說：「大比大，起來。」她就睜開眼睛，見了彼得，便坐起來。 彼得伸手扶她起來，叫眾聖徒和寡婦進去，把多加活活的交給他們。 這事傳遍了約帕，就有許多人信了　主。 此後，彼得在約帕一個硝皮匠西門的家裏住了多日。


        在约帕有一位门徒，名叫大比大，翻出来就是「羚羊」；她广行善事，多施周济。那些日子，她病了，就死了。人们洗了她，安置在楼上。吕大靠近约帕，门徒听见彼得在那里，就打发两个人去见他，恳求他不要耽延到他们那里去。彼得起身，同他们去了；到了那里，他们就领他上到楼上，所有的寡妇都含泪站在彼得身边，给他看大比大活着的时候与她们同住，所做的汗衫和外衣。彼得叫她们都出去，屈膝祷告，转身对着尸体说：大比大，起来！她就睁开眼睛，见了彼得，就坐了起来。彼得伸手扶她起来，又叫了圣徒和寡妇进来，把活着的她交给他们。这事传遍了整个约帕，很多人信了主。他在约帕住了很多天，在一个名叫西门，做皮匠的人家里。'
  - type: paragraph
    text:
      ru: 'Лука называет имя ученицы«Тавифа, что значит: «серна»,»показывая, что она соответствовала своему имени: была так бдительна и бодра, как серна. Потому что часто многие имена даются по Божественному домостроительству.'
      cn: 路加称呼那位女门徒的名字「大比大，意思是『羚羊』」，表明她名副其实：她像羚羊一样警醒敏捷。因为许多名字常常是依照上帝的经纶所赐予的。
  - type: paragraph
    text:
      ru: «Случилось в те дни, что она занемогла и умерла. Ее омыли и положили в горнице». То есть сделали все, что следовало сделать над умершим. Послали же бывшие в Иоппии ученики к Петру«просить, чтобы он не замедлил придти к ним». Заметь простоту прочих и отсутствие всякого высокомерия в Петре. Не сами идут, но просят через двоих об исцелении, и он приходит. Почему они не позвали его, пока та не умерла? Считали недостойным утруждать этим учеников и отвлекать их и навязывать им затруднения в деле проповеди. Поэтому-то Лука и говорит, что было близко.
      cn: 「那些日子里，她生病死了。他们给她洗了身体，把她安放在楼上房间里。」也就是说，他们做了所有对亡者该做的事。住在约帕的门徒们派人去请彼得，「求他不要迟延，到他们那里去」。请注意其他门徒的纯朴，以及彼得毫无骄傲。他们没有亲自去，而是通过两个人请求医治，彼得就来了。为什么他们没有在她去世之前就召他来呢？他们认为不值得因此而麻烦门徒，使他们分心，并在传道事工上给他们带来困难。这就是为什么路加说，那里是近处。
  - type: paragraph
    text:
      ru: «Вдовицы со слезами предстали перед ним, показывая рубашки и платья, какие делала Серна, живя с ними». Выражение«живя с ними»показывает великое смирение ее, потому что она находилась с ними и жила с ними и обращалась со всеми как одна из них, а не так, как мы теперь.
      cn: «寡妇们含着泪站在他面前，拿出瑟纳与她们同住时所做的衬衣和衣裳。»「与她们同住」这个表达显示了她极大的谦卑，因为她与她们同在，与她们一同生活，并待所有人都如同她们中的一员，而不像我们现在这样。
  - type: paragraph
    text:
      ru: «Петр выслал всех вон и, преклонив колени, помолился». Для чего он изгоняет всех вон? Для того, чтобы не тронуться слезами и не потерять спокойствие духа.«Преклонив колени», усердную совершает молитву. Затем поддерживает ожившую; потом понемногу возвращаются жизнь и силы ее.
      cn: 「彼得将众人叫出去，就屈膝祷告了。」他为何将众人叫出去呢？为的是免得流泪动容，也不失去心神的宁静。「他屈膝」，是恳切地祷告。然后他扶起那已复活的；接着，她的生命和力量才渐渐地恢复。
  - type: paragraph
    text:
      ru: «Призвав святых и вдовиц, поставил ее перед ними живою», –одним в утешение, а другим в покровительство. Заметь отсутствие всякого высокомерия в Петре. Совершив такое великое чудо, он ищет пристанища не у нее и не у другого какого-либо знаменитого человека, но у кожевника Симона; он не стыдится людей ничтожных и не дает великим повода превозноситься.
      cn: 「召集了圣徒和寡妇，使她活生生地站在他们面前，」——对一些人是安慰，而对另一些人是庇护。请留意彼得身上毫无傲慢。行了如此伟大的奇迹之后，他没有在她那里寻求居所，也没有在其他任何一位著名人物那里，而是住在革匠西门的家里；他不耻于卑微之人，也不给显赫之人任何自高自傲的机会。
- type: heading1
  text:
    ru: Глава десятая
    cn: 第十章
  children:
  - type: paragraph
    text:
      ru: 'Деян.10:1–8.В Кесарии был некоторый муж, именем Корнилий, сотник из полка, называемого Италийским, благочестивый и боящийся Бога со всем домом своим, творивший много милостыни народу и всегда молившийся Богу. Он в видении ясно видел около девятого часа дня Ангела Божия, который вошел к нему и сказал ему: Корнилий! Он же взглянув на него и испугавшись, сказал: что, Господи? Ангел отвечал ему: молитвы твои и милостыни твои пришли на память пред Богом. Итак пошли людей в Иоппию и призови Симона, называемого Петром. Он гостит у некоего Симона кожевника, которого дом находится при море; он скажет тебе слова, которыми спасешься ты и весь дом твой. Когда Ангел, говоривший с Корнилием, отошел, то он, призвав двоих из своих слуг и благочестивого воина из находившихся при нем и, рассказав им все, послал их в Иоппию.'
      cn: (使徒行传 10:1-8) 在凱撒利亞有一個人，名叫哥尼流，是「意大利營」的百夫長。 他是個虔誠人，他和全家都敬畏　上帝，多多賙濟百姓，常常禱告　上帝。 有一天，約在申初，他在異象中明明看見　上帝的一個天使進去，到他那裏，說：「哥尼流。」 哥尼流定睛看他，驚怕說：「　主啊，甚麼事呢？」天使說：「你的禱告和你的賙濟達到　上帝面前，已蒙記念了。 現在你當打發人往約帕去，請那稱呼彼得的西門來。 他住在海邊一個硝皮匠西門的家裏。房子在海邊上，他要告訴你所當行的。。」 向他說話的天使去後，哥尼流叫了兩個家僕和常伺候他的一個虔誠兵來； 把這些事都述說給他們聽，就打發他們往約帕去。
  - type: paragraph
    text:
      ru: Этот Корнилий не был ни иудеем, ни из подзаконных, а между тем уже вел такой же образ жизни, как и мы. Вот двое уже из людей, облеченных почестями, веруют во Христа – казнохранитель эфиоплянки и этот,«благочестивый и боящийся Бога со всем домом своим». Мы не заботимся о своих домашних, а этот заботился и о воинах. Он был«сотник из полка, называемого Италийским». Этого человека он для того делает известным и сообщает о нем подробные сведения, чтобы кто-либо не сказал, что в Священном Писании встречаются погрешности против истории. (Надобно знать, что полк – спира – состоял из двухсот воинов, а кустадия из шестидесяти.)
      cn: 这位哥尼流既非犹太人，亦非律法之下的人，然而他已经过着与我们同样的生活方式。看哪，两位身居要职之人已经信奉基督——埃塞俄比亚女皇的财务总管，以及这位，「虔诚敬畏上帝，并与他全家一同敬畏上帝的人」。我们不关心自己的家人，而这位却也关心士兵。他是「意大利营」的百夫长。作者之所以详细地记载并使此人为人所知，是为了不让人说圣经记载与历史有误。(须知：「营」——亦即「斯皮拉」——由两百名士兵组成，而「库斯塔迪亚」则由六十名士兵组成。)
  - type: paragraph
    text:
      ru: «Он в видении ясно видел около девятого часа дня Ангела Божия, который вошел к нему». Видит Ангела для восполнения веры Петра. Или, лучше, не для него, но для других, более слабых в вере.«Около девятого часа дня»,когда он оставил заботы и находился в тишине и покое.
      cn: «他在异象中清楚地看见，大约在白日第九时辰，一位上帝的使者进入到他那里。» 他看见使者，是为了补足彼得的信心。或者，更准确地说，不是为了他自己，而是为了那些在信心上更为软弱的其他人。「大约在白日第九时辰」，当他放下各种忧虑，处于宁静与安息之中时。
  - type: paragraph
    text:
      ru: Так как Истинное Око и Великий Судия знает, что и великие дела, не имея веры, мертвы, то Он и посылает Ангела, который утверждает за делами их значение, чтобы увенчались верой тех, которые хорошо подвизаются. От видения же в Корнилии возбудился страх, впрочем, умеренный, сколько было необходимо только для того, чтобы возбудить внимание его. Потом слова Ангела уничтожили страх.
      cn: 因为真实的眼目和伟大的审判者知道，即使是伟大的事功，若没有信心，便是死的，所以祂就派遣一位天使，来确立这些事工的意义，好使那些美好争战者能以信心加冕。而从那异象，在哥尼流心中激起了恐惧，然而这恐惧是适度的，恰好是所必需的，仅仅是为了唤起他的注意力。随后天使的话语消除了恐惧。
  - type: paragraph
    text:
      ru: '«Молитвы твои и милостыни твои пришли на память пред Богом». Посмотри, куда идет молитва – на высшее небо и становится пред самым престолом царским. Обрати внимание и на Ангела: он сначала возвышает и возносит мысли Корнилия к высшему, потом уже говорит:«Пошли людей в Иоппию и призови Симона, называемого Петром. Он гостит у некоего Симона кожевника». Чтобы они не пошли к кому-либо другому, он определяет этого человека не только по имени, но и по месту, где он находится:«которого дом находится при море». Апостолы избирали места, отдаленные от городов, они любили пустыню и тишину. Что если случится, что есть и другой Симон кожевник? Вот признак: этот живет при море. Ангел не сказал, для чего надобно сделать это, чтобы переполнить его радостью.'
      cn: 「你的祷告和你的施舍已在上帝面前蒙垂念。」看哪，祷告前往何处——直达至高之天，并立于君王的宝座前。也要注意天使：他首先将哥尼流的思想提升并高举至更高之处，然后才说：「派人往约帕去，召请西门，就是那称为彼得的。他正寄居在某个硝皮匠西门家里。」为避免他们去到别处，他不仅通过姓名，也通过此人所处之地来指定他：「他的家就在海边。」使徒们选择远离城市的地方，他们喜爱旷野和宁静。若是碰巧还有另一个硝皮匠西门呢？这就是记号：此人住在海边。天使没有说明为何必须这样做，以便使他充满喜乐。
  - type: paragraph
    text:
      ru: «Призвав двоих из своих слуг и благочестивого воина». Смотри, недаром сказано, что это были люди, постоянно при нем находившиеся.
      cn: 「召集了他自己的两个仆人和一位虔诚的兵士。」看啊，这话并非没有缘由，这些是常常在他身边的人。
  - type: paragraph
    text:
      ru: «Рассказав им все, послал их в Иоппию». Заметь отсутствие высокомерия. Не сказал «призовите мне Петра», но все рассказал, чтобы тем побудить его прийти к нему, потому что он считал делом неприличным звать его в силу своего авторитета. Потому-то и рассказал все посланным.
      cn: 「将这一切告诉他们以后，就差他们往约帕去。」请注意，此处毫无傲慢之态。（他）没有说「给我把彼得叫来」，而是将一切都告诉他们，以此来促使他（彼得）前来找他，因为他认为凭借自己的权威去召唤他（彼得），是一件不合宜的事。正因如此，他才将一切都告诉了被差遣的人。
  - type: paragraph
    text:
      ru: 'Деян.10:9–16.На другой день, когда они шли и приближались к городу, Петр около шестого часа взошел на верх дома помолиться. И почувствовал он голод, и хотел есть. Между тем, как приготовляли, он пришел в исступление и видит отверстое небо и сходящий к нему некоторый сосуд, как бы большое полотно, привязанное за четыре угла и опускаемое на землю; в нем находились всякие четвероногие земные, звери, пресмыкающиеся и птицы небесные. И был глас к нему: встань, Петр, заколи и ешь. Но Петр сказал: нет, Господи, я никогда не ел ничего скверного или нечистого. Тогда в другой раз был глас к нему: что Бог очистил, того ты не почитай нечистым. Это было трижды; и сосуд опять поднялся на небо.'
      cn: (使徒行传 10:9-16) 第二天，他們行路將近那城的時候，彼得約在午正上房頂去禱告； 覺得極其餓了，想要吃。那家的人正預備用餐的時候，彼得魂遊象外， 看見天開了，有一物降到彼得那裏，好像一塊大布，繫著四角，縋在地上， 裏面有地上各樣四足的走獸、野獸和爬物，並天上的飛鳥。 又有聲音向他說：「彼得，起來，宰了吃。」 彼得卻說：「　主啊，這是不可的。凡俗物和不潔淨的物，我從來沒有吃過。」 第二次有聲音向他說：「　上帝所潔淨的，你不可當作俗物。」 這樣一連三次，那物隨即收回天上去了。


        第二天，当他们赶路，临近那城的时候，彼得约在第六时辰登上房顶去祷告。他觉得饿了，想吃东西。正在预备饭食的时候，他魂游象外，看见天开了，有一件器皿降到他那里，好像一块大布，系着四角，缒向地上；里面有各样地上的四足牲畜、野兽、爬虫和天空的飞鸟。又有声音向他说：「彼得，起来，宰了吃。」彼得却说：「不，主啊，我从来没有吃过任何污秽不洁之物。」第二次又有声音向他说：「上帝所洁净的，你不可当作不洁净的。」这样一连三次，那器皿就立刻被收回天上去了。'
  - type: paragraph
    text:
      ru: Посмотри, как Дух сводит времена и делает, что это совершается ни раньше, ни позже.
      cn: 看啊，圣灵如何统合时日，使其成就，不早不晚。
  - type: paragraph
    text:
      ru: «Петр около шестого часа взошел на верх дома помолиться». То есть в особом месте и в тишине.
      cn: 彼得约在第六时辰上了房顶祷告。也就是说，在一个特别的地方和在寂静中。
  - type: paragraph
    text:
      ru: «Он пришел в исступление». Это означает и изумление при виде чуда, и то состояние, когда человек не владеет своими чувствами, будучи восхищен в мир духовный. Итак, ему было как бы духовное видение.
      cn: «他进入了出神状态». 这既意味着在见到奇迹时产生的惊叹，也意味着当一个人不能掌控自己的情感，被提升到灵性世界时的那种状态。因此，他仿佛得到了一个属灵的异象。
  - type: paragraph
    text:
      ru: «Сходящий к нему некоторый сосуд, как бы большое полотно». Первейший из апостолов, Петр, имел нужду в Божественном откровении о призвании к христианской вере язычников, потому что не знал, что обрезание и необрезание не делают разницы по отношению к вере. Петр, конечно, не знал ясно, что Господь сказал, чтобы, когда открылось служение верой, то были научаемы этой вере и язычники, не знал до тех пор, пока неизреченная воля Его посредством этого явления не открыла эту тайну, убедив его в этом, с одной стороны, примером с сошедшим полотном, а с другой стороны, тем, что и язычникам была преподана благодать Святаго Духа по обращении их к вере, убедив, что во Христе нет различия между иудеем и эллином.
      cn: 「有器皿降在他那里，好像一块大布。」众使徒之首，彼得需要神圣的启示，关于召叫外邦人归信基督信仰，因为他不知道割礼与非割礼对信仰而言并无区别。彼得当然不清楚上主曾说过，当信仰的侍奉显明时，外邦人也当受教于这信仰，直到祂那不可言喻的旨意借由这异象揭示了这奥秘，使他对此确信，一方面是借由那降下的布的例子，另一方面是借由外邦人归信后，圣灵的恩典也已赐予他们，从而确信在基督里，犹太人与希腊人并无区别。
  - type: paragraph
    text:
      ru: '«Привязанное за четыре угла и опускаемое на землю». Четыре края показывают четыре стихии, явившийся сосуд означает грубейший мир, а различные животные суть символы состояния людей. Символом всей вселенной был этот человек, Корнилий, с крайней плотью, потому что он не имел ничего общего с иудеями. Петра все стали бы обвинять как законопреступника, и потому Духом устрояется, чтобы он имел защиту; поэтому-то он и возражает Ангелу. Ибо он должен был вполне соблюдать закон. Итак, это устрояется для того, чтобы его не стали обвинять. Может быть, он, преклонив колена, видел видение. И Божественным делом было случившееся, то есть то, что он видел высшее и был в состоянии исступления, и слышал оттуда голос и что трижды исповедовал, что там животные нечистые. А то, что сосуд с неба снисшел и туда вознесся, – это великое доказательство чистоты. Итак, это совершается для тех, кому имеет быть рассказанным. Потому что Петр сам слышал повеление Господне:«на путь к язычникам не ходите»(Мф. 10, 5). Если имел нужду в обрезании и в принесении жертвы даже Павел, то тем более тогда, в начале проповеди, когда они были очень немощны. Но не обо всех Петр сказал, что они скверны и нечисты, а только о тех, которых и закон назвал скверными и нечистыми. А Бог, начертавший образ Своей Церкви, сказал, чтобы она не считала для себя ничего нечистым. Потому что человеку все чисто, что он принимает с благодарением и благословением Божиим. Но если здесь содержалось притчевое указание относительно призвания народов, чтобы не считать имеющих необрезанной крайнюю плоть скверными и нечистыми, то все-таки речь Петра содержала указание не на людей, но на животных, запрещенных законом Моисеевым. Потому что виды животных принимаются вместо свойств человеческих, а из описания видения Петрова известно, что в сосуде, сшедшем с неба, были все роды животных: пресмыкающихся, птиц и четвероногих. Это потому, что слово прикровенно изображает, что имеющие обратиться к вере находятся под владычеством разных грехов, что они уподобились или четвероногим по жестокости, или пресмыкающимся – по ядовитости, или птицам – по легкости и непостоянству своей природы. И притом змеи принимаются за символ саддукеев и фарисеев, а лисица – за символ Ирода, и возбужденные страстью к половому сближению кони – за символ людей сладострастных; овцы – за людей незлобивейших, козлята – за необщительных и безучастных, а ежи – за богатых; о них Господь сказал, что они своими колючками прокалывают слово и делают его бесплодным.'
      cn: 「系于四角，降到地上。」四边象征着四种元素，显现的器皿指粗鄙的世界，而各种动物则是人类境况的象征。这人哥尼流，带着包皮，是整个宇宙的象征，因为他与犹太人毫无共同之处。众人都会指控彼得是犯法者，因此，圣灵安排他能有辩护；正因如此，他才反驳天使。因为他本应完全遵守律法。所以，这被安排，是为了使他免遭指控。或许，他跪着看到了异象。所发生的一切都是上帝的作为，即他看到了至高的景象，并处于狂喜状态，从那里听到了声音，并且三次宣称那里的动物是不洁的。而那器皿从天而降，又升回天上——这是纯洁的伟大证据。所以，这事是为那些将要听到它的人而成就的。因为彼得亲自听过主的命令：「外邦人的路，你们不要走」（马太福音 10:5）。如果连保罗都需要行割礼和献祭，那么在传道的初期，当他们非常软弱的时候，就更不用说了。但彼得并非说所有的人都污秽不洁，而只是说那些连律法都称为污秽不洁的人。而上帝，勾勒出祂教会的形像，说教会不应视任何事物为不洁。因为对人而言，凡他以感恩和上帝的祝福领受的一切，都是洁净的。然而，如果这里包含着关于召集万民的寓言性指示，即不应将那些未受割礼的人视为污秽不洁，那么彼得的话仍然不是指人，而是指摩西律法所禁止的动物。因为动物的种类被用来代替人类的特性，而从彼得异象的描述中可知，从天而降的器皿里有各种动物：爬行类、鸟类和四足动物。这是因为这言语隐秘地描绘了那些将要归信的人正处于各种罪恶的辖制之下，他们或因残忍而像四足动物，或因毒辣而像爬行类，或因本性轻浮善变而像鸟类。此外，蛇被视为撒都该人和法利赛人的象征，狐狸则被视为希律的象征，而因性欲冲动而兴奋的马匹——被视为好色之人的象征；羊——被视为最纯良无害的人，小山羊——被视为不合群和漠不关心的人，而刺猬——被视为富人；主论及他们说，他们用自己的刺扎穿圣言，使其归于虚空。
  - type: paragraph
    text:
      ru: '«В другой раз был глас к нему: что Бог очистил, того ты не почитай нечистым». По-видимому, голос относится к Петру, а между тем все говорится к иудеям. Потому что если терпит порицание этот учитель, то тем более они заслуживают этого.'
      cn: 「又一次，有声音对他说道：『上帝所洁净的，你不可当作不洁净的。』」显然地，这声音是针对彼得的，然而，这一切话语却是对犹太人说的。因为如果这位教师受到谴责，那么他们就更理当如此。
  - type: paragraph
    text:
      ru: 'Деян.10:17–20.Когда же Петр недоумевал в себе, что бы значило видение, которое он видел, – вот, мужи, посланные Корнилием, расспросив о доме Симона, остановились у ворот, и, крикнув, спросили: здесь ли Симон, называемый Петром? Между тем, как Петр размышлял о видении, Дух сказал ему: вот, три человека ищут тебя; встань, сойди и иди с ними, нимало не сомневаясь; ибо Я послал их.'
      cn: (使徒行传 10:17-20) 彼得心裏正在猜疑之間，不知所看見的異象是甚麼意思。不料，哥尼流所差來的人已經查問到西門的家，站在門外， 喊著問：「有稱呼彼得的西門住在這裏沒有？」 彼得還思想那異象的時候，　靈向他說：「看哪，有三個人來找你。 所以，你當起來下去，和他們同往，不要疑惑；因為是我差他們來的。」


        当彼得独自思量他所看见的异象是什么意思的时候——看哪，哥尼流所差来的人，询问到了西门的家，就站在门口，喊着问道：「名叫彼得的西门住在这里吗？」 彼得还在思量那异象的时候，圣灵对他说：「看哪，有三个人来找你；起来，下去，和他们一同去，不要疑惑；因为是我差遣了他们。」'
  - type: paragraph
    text:
      ru: Полотно (плащаница) означает землю, а находящиеся в нем звери – язычников. Изречение же«заколи и ешь»(ст. 13) означает то, что и они должны прийти ко Христу, а то, что это повторяется трижды, означает крещение. Итак, истинный смысл видения указывает ему на учение о Троице, равно как и вера в Троицу представляет истинное Богопочитание.
      cn: 大布（裹尸布）意指大地，而其上的野兽们则意指异教徒。而这句「宰了吃吧」（使徒行传 10:13）的诫命，意指他们也当来到基督面前，而这重复了三次，则意指洗礼。因此，这异象的真正意义，向他指明了关于三位一体的教义，同样地，对三位一体的信仰也构成了真正的敬拜上帝。
  - type: paragraph
    text:
      ru: «Вот, мужи, посланные Корнилием». Благовременно приходят эти мужи, чтобы разрешить недоумение. Ибо и Иосифу Христос допустил сначала устрашиться, а потом послал Ангела, потому что душа легко принимает разрешение от испытанного прежде недоумения. И притом ему недолго пришлось оставаться в недоумении и не прежде оно возбудилось, но в то самое время, когда о нем спрашивали, тут ли он гостит.
      cn: 「看哪，哥尼流所差遣的那些人。」这些人适时来到，为要解决（彼得的）疑虑。因为基督也曾允许约瑟先是感到恐惧，然后才差遣天使，因为灵魂更容易接受对先前所经历的疑虑的解决。况且，他并未在疑虑中停留太久，那疑虑也并非预先产生，而是在人们问及他是否在此寄居的同一时刻才产生的。
  - type: paragraph
    text:
      ru: '«Между тем, как Петр размышлял о видении, Дух сказал ему: вот, три человека ищут тебя». Опять и это служит апологией Петра перед учениками, чтобы они увидели, что он размышлял и получил наставление не размышлять. Потому что ему сказано было:«Иди с ними, нимало не сомневаясь; ибо Я послал их». Велика власть у Духа, потому что то, что делает Бог Отец, то же делает и Дух Святый. Ангел сказал:«молитвы твои и милостыни твои»(ст. 4), чтобы показать, что он оттуда послан; а Дух делает не так, но говорит:«Ибо Я послал их». Итак, нужно повиноваться Духу.'
      cn: 彼得正在思想那异象的时候，圣灵对他说：「看哪，有三个人来找你。」 这再次成为彼得在门徒面前的辩护，好让他们看到，他曾为此思想，并领受了不要再多加思虑的训示。因为有话对他说：「你与他们同去，毫无疑虑；因为是我差遣了他们。」 圣灵的权能是大的，因为上帝圣父所行的，圣灵也照样行。天使说：「你的祷告和你的施舍」（第4节），是为了表明他（指天使）是从那里奉差遣的；而圣灵却不如此行，祂却说：「因为是我差遣了他们。」 因此，我们必须顺从圣灵。
  - type: paragraph
    text:
      ru: 'Деян.10:21–24.Петр, сойдя к людям, присланным к нему от Корнилия, сказал: я тот, которого вы ищете; за каким делом пришли вы? Они же сказали: Корнилий сотник, муж добродетельный и боящийся Бога, одобряемый всем народом Иудейским, получил от святаго Ангела повеление призвать тебя в дом свой и послушать речей твоих. Тогда Петр, пригласив их, угостил. А на другой день, встав, пошел с ними, и некоторые из братий Иоппийских пошли с ним. В следующий день пришли они в Кесарию.'
      cn: (使徒行传 10:21-24) 於是彼得下去見哥尼流派來見他的那些人，說：「看哪，我就是你們所找的人。你們來是為甚麼緣故？」 他們說：「百夫長哥尼流是個義人，敬畏　上帝，為猶太通國所稱讚。他蒙　上帝藉一個聖天使警戒，叫他請你到他家裏去，聽你的話。」 彼得就請他們進去，住了一宿。次日，起身和他們同去，還有約帕的幾個弟兄同著他去； 又次日，他們進入凱撒利亞，哥尼流已經請了他的親屬密友等候他們。


        彼得下到革利免差来的人那里，说：「我就是你们所找的人。你们是为什么事来的呢？」他们说：「百夫长哥尼流是个正直敬畏上帝的人，受犹太全民族称赞。他蒙一位圣天使指示，请你到他家里去，听你的话语。」彼得就请他们进去，款待他们。第二天，彼得起身和他们同去，还有几个约帕的弟兄与他同去。又次日，他们到了凯撒利亚。'
  - type: paragraph
    text:
      ru: Сначала Петр признался, что он есть тот, кого они ищут, и потом уже спрашивает о причине их прихода, чтобы или тотчас быть готовым и идти с ними, или, если это не нужно, устроить их в доме. А посланные говорят похвалы Корнилию, чтобы убедить Петра, что тому являлся Ангел. Начальство над народом бывает в руках человека благочестивого, по своим заслугам оказавшегося достойным этого.
      cn: 首先，彼得承认他就是他们所寻找的那个人，然后才询问他们到来的原因，以便立即做好准备与他们同去，或者，如果不需要，就安顿他们在家中。而那些被派来的人则称赞哥尼流，为要使彼得确信，天使曾向那人显现。统管民众的权柄，往往落在一个虔诚之人手中，他因自身的功德而被证明配得此位。
  - type: paragraph
    text:
      ru: Правда, бывает все-таки, что имеющие власть не соответствуют своему положению; но если бы не было этого, то о чем бы тогда говорить?
      cn: 确实，有时还是会发生，掌握权柄者不符合其地位；但若是没有这些，那还有什么可说的呢？
  - type: paragraph
    text:
      ru: '«Призвать тебя в дом свой». Не из чувства пренебрежения, говорят, он послал, но потому, что ему так повелено. Итак, не оставь в пренебрежении: хорошо, что Петр сначала дружелюбно обходится с этими мужами, так как они утомились, и таким образом располагает их к себе. А что с ним пошли некоторые из Иоппии, это случилось домостроительно, чтобы потом они были свидетелями, когда Петру нужно было оправдываться.'
      cn: 「召见你到他家中去。」他们说，他差派人不是出于轻蔑之情，而是因为他受命如此行。因此，不要轻忽：彼得先是友善地对待这些人，因为他们已经疲惫，并以此赢得他们的好感，这是好的。至于一些来自约帕的人与他同行，这乃是出于神的经纶安排，以便他们日后可以作证，当彼得需要为自己辩解时。
  - type: paragraph
    text:
      ru: 'Деян.10:24–27.Корнилий же ожидал их, созвав родственников своих и близких друзей. Когда Петр входил, Корнилий встретил его и поклонился, пав к ногам его. Петр же поднял его, говоря: встань; я тоже человек. И, беседуя с ним, вошел в дом, и нашел многих собравшихся.'
      cn: (使徒行传 10:24-27) 又次日，他們進入凱撒利亞，哥尼流已經請了他的親屬密友等候他們。 彼得一進去，哥尼流就迎接他，俯伏在他腳前敬拜他。 彼得卻拉他，說：「你起來，我也是人。」 彼得和他說著話進去，見有許多人在那裏聚集，


        哥尼流却等候着他们，已经召集了他的亲属和密友们。彼得进来的时候，哥尼流迎接他，并俯伏在他脚前下拜。彼得却扶起他，说：「起来罢；我也同是人。」于是，彼得与他交谈着，进了屋子，便发现许多人已聚集在那里。'
  - type: paragraph
    text:
      ru: Славный это был человек и в славном городе имел жилище.
      cn: 他是一位有荣耀的人，并在荣耀之城中拥有居所。
  - type: paragraph
    text:
      ru: '«Созвав родственников». Это свойство совершенно благочестивого друга: Корнилий, будучи окружен столькими благами, всех делает общниками и близкими друзьями. Близкими друзьями они названы потому, что он мог надеяться на них, когда ему предстояли труды и заботы о стольких подчиненных. И друзья, и родственники, мне кажется, питались его пищей. Посмотри, как Корнилий был уверен, что Петр непременно придет. Это потому, что Ангел явился ему не во сне, но в то время, когда он находился в состоянии бодрствования и днем.'
      cn: «召集了亲属». 这是全然虔敬的朋友的特质：哥尼流被如此多的美善环绕，他使所有人都成为共享者和亲密的朋友。他们被称为亲密的朋友，是因为当他面临为如此多的下属操劳和担忧时，他能够依靠他们。朋友和亲属，在我看来，都享用他的食物。看哪，哥尼流是多么确信伯多禄一定会来。这是因为天使向他显现，并非在梦中，而是在他清醒的白日。
  - type: paragraph
    text:
      ru: '«Петр же поднял его, говоря: встань; я тоже человек». Этим он научает и прочих и приносит благодарение Богу, показывая свое смирение. Посмотри: прежде всего другого он научает тому, чтобы они ничуть не думали о себе много.'
      cn: 彼得却扶起他，说：「起来，我也是人。」借此他教导众人，并将感谢献给上帝，显明他的谦卑。看哪：他首先教导他们，不要丝毫地自视甚高。
  - type: paragraph
    text:
      ru: 'Деян.10:28–33.И сказал им: вы знаете, что Иудею возбранено сообщаться или сближаться с иноплеменником; но мне Бог открыл, чтобы я не почитал ни одного человека скверным или нечистым. Посему я, будучи позван, и пришел беспрекословно. Итак спрашиваю: для какого дела вы призвали меня? Корнилий сказал: четвертого дня я постился до теперешнего часа, и в девятом часу молился в своем доме, и вот, стал предо мною муж в светлой одежде, и говорит: «Корнилий! услышана молитва твоя, и милостыни твои воспомянулись пред Богом. Итак пошли в Иоппию и призови Симона, называемого Петром; он гостит в доме кожевника Симона при море; он придет и скажет тебе». Тотчас послал я к тебе, и ты хорошо сделал, что пришел. Теперь все мы предстоим пред Богом, чтобы выслушать все, что повелено тебе от Бога.'
      cn: (使徒行传 10:28-33) 就對他們說：「你們知道，猶太人和別國的人親近來往本是不合例的，但　上帝已經指示我，無論甚麼人都不可看作俗而不潔淨的。 所以我被請到你們那裏去的時候，就不推辭而來。現在請問：『你們叫我來有甚麼意思呢？』」 哥尼流說：「前四天我禁食，直到這個時候；在申初我在家中禱告，忽然有一個人穿著光明的衣服，站在我面前， 說：『哥尼流，你的禱告已蒙垂聽，你的賙濟達到　上帝眼前已蒙記念了。 所以，你當打發人往約帕去，請那稱呼彼得的西門來；他住在海邊一個硝皮匠西門的家裏。當他來的時候，便會對你說話。』 所以我立時打發人去請你；你來了很好。現今我們就都在　上帝面前，要聽　上帝所吩咐你的一切話。」


        他对他们说：「你们知道，一个犹太人是被禁止与外邦人交往或亲近的；但上帝向我显明，叫我不要视任何人是污秽或不洁的。所以我蒙召之后，便毫无异议地来了。那么我问：你们是为哪一件事召了我来呢？」


        哥尼流说：「四天前，我禁食到现在的时刻，并在第九时辰在自己家中祷告，忽然，有一个身穿光明衣服的男子站在我面前，说：『哥尼流！你的祷告已被垂听，你的施舍已在上帝面前蒙记念。所以，你派人去约帕，召那名叫彼得的西门；他正住在海边制皮匠西门的家中；他来了，会告诉你。』我立刻就派人去请你，你来得真好。现在我们都在上帝面前，等候聆听一切上帝所吩咐你的话。」'
  - type: paragraph
    text:
      ru: 'Рассуждает о человеколюбии Божием и показывает, что Бог даровал им великие дары, а вместе и говорит о великом, и говорит со смирением. Потому что он не сказал: «Люди! Мы пришли к вам, хотя мы считаем недостойным прикасаться к кому-либо», но сказал: «Вы знаете, что Бог изрек такое повеление чтобы считалось беззаконием«Иудею… сообщаться или сближаться с иноплеменником; но мне Бог открыл, чтобы я не почитал ни одного человека скверным или нечистым».'
      cn: 论及上帝的仁爱，并表明上帝赐予了他们伟大的恩赐；并且，他既论及伟大之事，又以谦卑言说。因为他没有说：「诸位！我们到你们这里来，尽管我们认为不配与任何人接触」，而是说：「你们知道，上帝曾颁布过这样的诫命，即犹太人与外邦人来往或亲近，是视为悖逆的；但上帝却启示了我，不可称任何人为污秽或不洁净。」
  - type: paragraph
    text:
      ru: Замечательно, что Сам Бог повелел народу христианскому, чтобы он«не почитал ни одного человека скверным или нечистым»,но жил с ними, потому что и они, быть может, будут с особенной силой веровать во Христа.
      cn: 令人称奇的是，上帝亲自命令基督徒百姓，不要看任何一个人是污秽的或不洁净的，而是与他们一同生活，因为他们或许会带着格外强大的信心信靠基督。
  - type: paragraph
    text:
      ru: '«Итак спрашиваю: для какого дела вы призвали меня?»Петр обо всем слышал уже и от воинов, но он желает, чтобы они исповедались и сделались правыми в вере.'
      cn: 「那么我问：你们召我前来是为了何事？」彼得已经从兵士那里听说了所有的事情，但他希望他们忏悔，并使自己在信仰上成为正直的。
  - type: paragraph
    text:
      ru: «В девятом часу молился в своем доме». Что это значит? Мне кажется, что у него при аккуратнейшем порядке в жизни время было распределено, и притом в известные дни, поэтому он и сказал:«четвертого дня». Посмотри, как сильна молитва. Когда он преуспевал в деле благочестия, тогда и явился ему Ангел, это один день; когда отправились посланные Корнилием, это тоже один; когда они шли, – один, а четвертый оказывается с третьего часа, когда он молился.
      cn: 「在第九时辰，他在自己的家中祷告。」这作何解？在我看来，他的生活井然有序，时间被分配妥当，且在特定的日子里；因此他才说：「第四日」。你看，祷告何其有力！当他在虔敬的善行上有所成就时，那时天使便向他显现，那是一天；当哥尼流所差遣的人出发时，那又是另一天；当他们行路时，又是一天；而第四日则始于他祷告的第三时辰。
  - type: paragraph
    text:
      ru: '«Стал предо мною муж в светлой одежде». Не говорит: «Ангел», но –"муж". Так он далек от гордости. Видите вытекающую отсюда мысль, видите, как он достоин был всего этого.'
      cn: '「有一个男子站在我面前，身穿光明的衣裳。」

        （经文）没有说「天使」，却说「男子」。由此可见，他远离骄傲。你们看到由此流淌出的思想了吗？你们看到他多么配得上这一切了吗？'
  - type: paragraph
    text:
      ru: '«Теперь все мы предстоим пред Богом, чтобы выслушать все, что повелено тебе от Бога». Не сказал: «пред человеком», но –«пред Богом». Итак, надобно со вниманием слушать рабов Божиих.'
      cn: «如今我们所有人侍立在上帝面前，为要听取所有上帝吩咐你的一切»。他没有说：「在人面前」，但说——「在上帝面前」。因此，我们应当留心聆听上帝的仆人。
  - type: paragraph
    text:
      ru: 'Деян.10:34–43.Петр отверз уста и сказал: истинно познаю, что Бог нелицеприятен; но во всяком народе боящийся Его и поступающий по правде приятен Ему. Он послал сынам Израилевым слово, благовествуя мир чрез Иисуса Христа; Сей есть Господь всех. Вы знаете происходившее по всей Иудее, начиная от Галилеи, после крещения, проповеданного Иоанном: как Бог Духом Святым и силою помазал Иисуса из Назарета, и Он ходил, благотворя и исцеляя всех, обладаемых диаволом, потому что Бог был с Ним. И мы свидетели всего, что сделал Он в стране Иудейской и в Иерусалиме, и что наконец Его убили, повесив на древе. Сего Бог воскресил в третий день, и дал Ему являться не всему народу, но свидетелям, предызбранным от Бога, нам, которые с Ним ели и пили, по воскресении Его из мертвых. И Он повелел нам проповедывать людям и свидетельствовать, что Он есть определенный от Бога Судия живых и мертвых. О Нем все пророки свидетельствуют, что всякий верующий в Него получит прощение грехов именем Его.'
      cn: (使徒行传 10:34-43) 彼得就開口說：「我真看出　上帝是不偏待人。 原來，各國中那敬畏主、行義的人都為主所悅納。 　上帝藉著耶穌　基督（他是一切的　主）傳和平的福音，將這道賜給以色列人。 這道在約翰傳揚浸禮以後，從加利利起，傳遍了猶太。 　上帝怎樣以　聖靈和能力膏拿撒勒的耶穌，這都是你們知道的。他周流四方，行善事，醫好凡被魔鬼壓制的人；因為　上帝與他同在。 他在猶太人之地，並耶路撒冷，所行的一切事，有我們作見證；他們竟把他掛在木頭上殺了。 第三天，　上帝叫他復活，顯現出來； 不是顯現給眾人看，乃是顯現給　上帝預先所揀選為他作見證的人看，就是我們這些在他從死裏復活以後和他同吃同喝的人。 他吩咐我們傳道給人，證明他是　上帝所立定的，要作活人、死人的　審判官。 眾先知也為他作見證說：『凡信他的人必因他的名得蒙赦罪。』」

        彼得开口说：「我确实知道上帝是不偏待人的；但在各民族中，敬畏祂并行公义的都蒙祂悦纳。祂将话语传给以色列子孙，借着耶稣基督传扬和平的福音；这一位是万有的上主。你们知道在犹太全境所发生的事，从加利利开始，在约翰所传的洗礼之后：上帝怎样以圣灵和能力膏立了拿撒勒人耶稣，祂周游各处，行善事，医治所有被魔鬼辖制的人，因为上帝与祂同在。我们是这一切的见证人，就是祂在犹太地和耶路撒冷所做的一切，并且他们最终把祂挂在木头上杀了。上帝使这一位在第三日复活，并且不是让祂显现给所有百姓看，而是显现给那些蒙上帝预先拣选的见证人，就是我们，祂从死里复活之后与祂一同吃喝的人。祂吩咐我们向世人宣讲并作见证，祂是上帝所命定，审判活人死人的审判者。众先知都为祂作见证，凡信入祂的人，都将因祂的名获得罪的赦免。」'
  - type: paragraph
    text:
      ru: «Истинно познаю…»Познаю, что Бог смотрит не на качество лица, но на различие дел. Тем, что Петр говорит, он ясно показывает, что Бог, Которого боялся Корнилий, о Котором он получил наставление из закона и пророков, ради Которого он и милостыни творил, что этот Бог есть воистину Бог. Недоставало ему познания о Сыне. Смотри, как он не дает волю превозноситься своей мысли.
      cn: '«我真正地认识到……»

        我认识到，上帝所看的不是人的外貌，而是行为的差异。彼得所说的话清楚地表明，哥尼流所敬畏的、从律法和先知书领受教诲的、并为之施舍钱财的那位上帝，确实是上帝。他所缺乏的是对上帝之子的认识。看哪，他如何不让自己的思想自高自大。'
  - type: paragraph
    text:
      ru: «Во всяком народе». Так говорит, чтобы ты не подумал, что язычники принадлежат к разряду отверженных.
      cn: «在各民族中». 这样说，免得你以为外邦人属于被弃绝者之列。
  - type: paragraph
    text:
      ru: «Поступающий по правде приятен Ему». Выражение"по правде"употреблено вместо «со всякой добродетелью». Не сказал «спасается», но –«приятен Ему», то есть достоин того, чтобы быть принятым Богом.
      cn: «行事合乎真理者，蒙祂喜悦》。«按真理»这个表达，代替了«带着诸般美德»。经文没有说«得救»，而是说«蒙祂喜悦»，也就是说，他配得蒙上帝接纳。
  - type: paragraph
    text:
      ru: «Он послал сынам Израилевым слово». Дает сынам израилевым предпочтение. Это говорит ради присутствующих, чтобы убедить их.
      cn: «祂赐下圣言给以色列子民». 祂给予以色列子民以偏爱。此话是说，为着在场之人，为要说服他们。
  - type: paragraph
    text:
      ru: «Как Бог Духом Святым и силою помазал Иисуса из Назарета». Разумеется – по человечеству. Так как Он уничижил Самого Себя и воспринял нашу плоть и нашу кровь (см.Евр. 2, 14), то о Нем говорится, что Он как человек принимает то, что Он имеет по естеству как Бог. Потому что Он принимает не Самому Себе, но нам, как вначале это делал для Самого Себя, или, лучше, так как Он есть Бог Слово, то это у Него было Свое. Выражение«обладаемых диаволом»указывает на многие, зависевшие от диавола, увечья и происшедшие от него повреждения в телах.
      cn: 「上帝怎样以圣灵和能力膏抹了拿撒勒人耶稣。」当然——就其人性而言。因为祂虚己，取了我们的肉身和血（参阅希伯来书 2:14），所以论到祂，就说祂作为人，接受了祂按着本性作为上帝所拥有的一切。因为祂接受不是为祂自己，而是为我们，如同祂起初为祂自己所做的那样，或者，更确切地说，因为祂是上帝之道，这原是祂自己的。「被魔鬼附着」这一表达，指向了许多源于魔鬼的伤残，以及由此在身体上造成的损伤。
  - type: paragraph
    text:
      ru: «Его убили, повесив на древе». Опять говорит об уничижении. Показавши, что Он Богом послан, апостол Петр говорит, что Он и убит. Чтобы ты не счел чего-либо несоответствующим, заметь, что они никогда не скрывают учения о кресте, но вместе с прочим предлагают и образ смерти.
      cn: '«祂被杀害了，悬挂在木头上。」

        这再次谈论着祂的降卑。使徒彼得在指出祂是上帝所差遣的之后，又说祂也被杀害了。为免你认为有什么不合宜之处，请留意他们从不隐藏关于十字架的教义，但与其余的一切一同，也提出了祂死亡的方式。'
  - type: paragraph
    text:
      ru: «Свидетелям… предызбранным». Хотя Сам Иисус Христос их избрал, но выражение«предызбранным»присвояет Богу Отцу.
      cn: «致见证人……预先拣选的»。虽然耶稣基督亲自拣选了他们，但「预先拣选的」这一表达归于父上帝。
  - type: paragraph
    text:
      ru: «Которые с Ним ели и пили». Посмотри, чем подтверждает истину воскресения. Почему Иисус Христос, воскреснув, не сотворил никакого чуда, но ел и пил? Потому что самое воскресение было великим чудом. Притом нет и не могло быть в этом случае чуда большего, как то, что Он ел и пил.
      cn: 「那些与祂同吃同喝的人。」看看，祂以何事来证实复活的真理。为什么耶稣基督复活之后，没有行任何神迹，却又吃又喝呢？因为复活本身就是一个伟大的神迹。再者，在此情形下，没有也不可能有比祂又吃又喝更大的神迹了。
  - type: paragraph
    text:
      ru: «И свидетельствовать». Свидетельствовать, говорит, ясно, чтобы не впали в неведение.
      cn: «并作见证». 见证，他说，要清晰明了，以免他们陷入无知。
  - type: paragraph
    text:
      ru: «О Нем все пророки свидетельствуют». Какие пророки только ни говорили об отпущении грехов, все они говорили, что грехи отпускаются в Этом Иисусе. Так и Исайя от Его лица говорит:«Я Сам изглаживаю преступления твои ради Себя Самого и грехов твоих не помяну»(Ис. 43, 25). Петр, однако, не сказал, что Он есть Сын Божий, но, что больше их устрашало, соответствующее времени приготовление заимствуется из пророков, потому что они пользовались великой славой. Но, поколебав людей страхом, он делает им снисхождение, впрочем, изреченное не им, а пророками. Итак, страшное он говорит от себя, а проникнутое кротостью – от лица пророков.
      cn: 「关于祂，众先知都作见证。」 凡论及罪得赦免的先知，无不言明罪过是在这位耶稣里得蒙赦免的。以赛亚亦从祂的位格如此说：「我，惟有我，为我自己的缘故涂抹你的过犯，我也不再记念你的罪恶。」（以赛亚书 43:25） 然而，彼得并没有说祂是上帝之子，而是，为了更令他们心生恐惧，采纳了先知们合乎时宜的论述，因为先知享有极大的荣耀。然而，在使众人因恐惧而颤栗之后，他便对他们施以宽容，这宽容却非出自他本人之口，而是出自众先知。因此，那令人恐惧之言，是他自口而出；而那充满温柔宽仁之言，则出自众先知。
  - type: paragraph
    text:
      ru: 'Деян.10:44–48.Когда Петр еще продолжал эту речь, Дух Святый сошел на всех, слушавших слово. И верующие из обрезанных, пришедшие с Петром, изумились, что дар Святаго Духа излился и на язычников, ибо слышали их говорящих языками и величающих Бога. Тогда Петр сказал: кто может запретить креститься водою тем, которые, как и мы, получили Святаго Духа? И велел им креститься во имя Иисуса Христа. Потом они просили его пробыть у них несколько дней.'
      cn: (使徒行传 10:44-48) 彼得還說這些話的時候，　聖靈降在一切聽道的人身上。 那些奉割禮、和彼得同來的信徒，見　聖靈的恩賜也澆在外邦人身上，就都希奇； 因聽見他們說方言，稱讚　上帝為大。於是彼得說： 「這些人既受了　聖靈，與我們一樣，誰能禁止用水給他們施浸呢？」 就吩咐奉　主的名給他們施浸。他們又請彼得住了幾天。


        彼得还在讲这些话的时候，圣灵降在所有听道的人身上。从受割礼的信徒中与彼得同来的人，都惊奇圣灵的恩赐竟然倾泻在外邦人身上，因为他们听见这些外邦人说方言，并颂赞上帝。于是彼得说：「这些人既然和我们一样领受了圣灵，谁能禁止他们用水受洗呢？」他就吩咐他们奉耶稣基督的名受洗。后来他们恳求彼得在他们那里多住几天。'
  - type: paragraph
    text:
      ru: Заметь Божие домостроительство. Бог не допустил, чтобы речь Петра была доведена до конца и чтобы крещение было совершено по распоряжению Петра; но как только Он увидел, что мысль их исполнена изумления и было положено начало научению, и они вполне уверовали, что крещение есть отпущение грехов, то и сошел Дух. Притом они начали говорить разными языками, что изумило собравшихся. Между тем Бог заблаговременно устроял в этом великую апологию Петру.
      cn: 请注意上帝的神圣经营。上帝未曾允许彼得的讲论完全讲完，也未曾允许洗礼按彼得的吩咐举行；但祂一见他们的心思充满惊奇，且训诲已然开始，他们也完全深信洗礼是罪的赦免，圣灵就降下了。此外，他们开始说起别种语言，这令聚集者大为惊异。与此同时，上帝早已为此为彼得作了极大的申辩。
  - type: paragraph
    text:
      ru: '«Кто может запретить креститься водою тем, которые, как и мы, получили Святаго Духа?»И какая нужда была в воде, когда Дух Святый нисшел на них? Итак, я покажу ее и объясню тебе это сокровенное таинство. В нем вполне выражаются Божественные символы: гроб и умирание, воскресение и жизнь. Как нам легко погружаться и выныривать, так Богу удобно погребать ветхого человека и показывать нового. А трижды это бывает для того, чтобы ты научился, что все это совершается силою Отца и Сына и Святаго Духа. А что сказанное не есть одна лишь простая догадка, послушай Павла, который говорит:«погреблись с Ним крещением в смерть»(Рим. 6, 4). И опять:«Ветхий наш человек распят с Ним»(Рим. 6, 6). И опять:«Мы соединены с Ним подобием смерти»(Рим. 6, 5).'
      cn: '「谁能禁止那些像我们一样领受了圣灵的人受水洗呢？当圣灵降临在他们身上时，又何需用水呢？那么，我将向你显明并解释这奥秘的圣事。其中充分地表达了神圣的象征：坟墓与死亡，复活与生命。正如我们轻而易举地沉入水中又浮出水面，上帝也同样便利地将旧人埋葬，并显明新人。而这三次的浸没，是为了让你明白，这一切都是藉着圣父、圣子和圣灵的能力所成就的。而我所说的并非仅仅是简单的猜测，请听保罗所说的话：


        「我们藉着洗礼与祂一同埋葬，归于死」（罗马书 6:4）。


        又说：「我们的旧人已经与祂同钉十字架」（罗马书 6:6）。


        又说：「我们若在祂死的样式上与祂联合」（罗马书 6:5）。」'
- type: heading1
  text:
    ru: Глава одиннадцатая
    cn: 第十一章
  children:
  - type: paragraph
    text:
      ru: 'Деян.11:1–10.Услышали Апостолы и братия, бывшие в Иудее, что и язычники приняли слово Божие. И когда Петр пришел в Иерусалим, обрезанные упрекали его, говоря: ты ходил к людям необрезанным и ел с ними. Петр же начал пересказывать им по порядку, говоря: в городе Иоппии я молился, и в исступлении видел видение: сходил некоторый сосуд, как бы большое полотно, за четыре угла спускаемое с неба, и спустилось ко мне. Я посмотрел в него и, рассматривая, увидел четвероногих земных, зверей, пресмыкающихся и птиц небесных. И услышал я голос, говорящий мне: «встань, Петр, заколи и ешь». Я же сказал: «нет, Господи, ничего скверного или нечистого никогда не входило в уста мои». И отвечал мне голос вторично с неба: «что Бог очистил, того ты не почитай нечистым». Это было трижды, и опять поднялось всё на небо.'
      cn: (使徒行传 11:1-10) 使徒和在猶太的眾弟兄聽說外邦人也領受了　上帝的道。 及至彼得上了耶路撒冷，那些奉割禮的門徒和他爭辯說： 「你進入未受割禮之人的家和他們一同用餐了。」 彼得就開口把這事從起頭按次序給他們講解，說： 「我在約帕城裏禱告的時候，魂遊象外，看見異象，有一物降下，好像一塊大布，繫著四角，從天縋下，直來到我跟前。 我定睛察看，見內中有地上四足的牲畜和野獸、爬物，並天上的飛鳥。 我且聽見有聲音向我說：『彼得，起來，宰了吃。』 我說：『　主啊，這是不可的。凡俗而不潔淨的物從來沒有入過我的口。』 又有聲音從天上說：『　上帝所潔淨的，你不可當作俗物。』 這樣一連三次，就都收回天上去了。


        在犹太的使徒和弟兄们听见外邦人也领受了上帝的道。当彼得来到耶路撒冷时，受割礼的人责备他，说：「你竟进了未受割礼之人的家，又和他们一同吃饭了。」彼得便按着次序向他们讲解说：「我在约帕城里祷告的时候，魂游象外，看见异象：有一件器皿降下，好像一块大布，系着四角从天降下，直降到我面前。我定睛观看，仔细思想，看见地上的四足走兽、野兽、爬虫和空中的飞鸟。我也听见有声音对我说：『彼得，起来，宰了吃吧！』我却说：『主啊，绝对不可！凡污秽不洁之物，我从未入我口中。』那声音第二次从天上回答我说：『上帝所洁净的，你不可当作不洁净的。』这样一连三次，随后这一切都收回天上去了。」'
  - type: paragraph
    text:
      ru: Видишь, какую ревность они имели относительно закона. Не постыдились ни достоинства Петра, ни чудес бывших, ни того прекрасного приготовления, какое сделано было для принятия слова, но стали рассуждать о таких мелочах. Рассуждали бывшие от обрезания, а не апостолы. И не говорят «зачем проповедовал?», но – «зачем ел?». Петр не остановился на этой мелочи, но основался на том, что имело великое значение. Если, говорит, они получили Духа, то как было не преподать им этого? Этой апологией он показывает, что он ни в чем не виновен, но виновник всего и повсюду Бог, к Которому он и относит все. Потому что, говорит, Он показал сосуд, а я возражал Ему. И опять Он сказал, а я и этого не послушался. Дух повелел идти. Я шел не торопясь, и не тотчас совершил крещение, но опять все совершил Дух.
      cn: 你看，他们对于律法怀着何等的热心。他们不顾彼得的尊严，不顾所行的神迹，也不顾为接受圣言所做的美好预备，却开始讨论这等琐事。参与讨论的是那些受割礼的信徒，而不是使徒们。他们不说「为何传道？」，却说：「为何吃？」彼得没有纠缠于这琐事，而是立足于那具有重大意义的。他说：「如果他们领受了圣灵，那么怎能不将这施予他们呢？」借着这番申辩，他表明自己绝无过失，而一切事物的肇因与遍在的主乃是上帝，他也将一切都归于祂。因为他说：「祂指示了我那器皿，而我却反对祂。」祂又说了，我甚至连这也不顺从。圣灵吩咐我去。我去得并不匆忙，也没有立刻施行洗礼，而是圣灵又成就了一切。
  - type: paragraph
    text:
      ru: «Услышал я голос, говорящий мне». Довольно было и того, что явилось полотно, чтобы убедить его; но к этому, однако же, присоединился и голос:«Встань, Петр, заколи и ешь.
      cn: «我听见有声音对我说»。那布幔的显现已足以使他信服了；然而，除此之外，还有声音加入：「彼得，起来，宰了吃吧。」
  - type: paragraph
    text:
      ru: '«Я же сказал: нет, Господи». Видишь, говорит Петр, я сделал свое. Это апология против того, что они сказали:«ты ходил к людям необрезанным и ел с ними». И он, однако же, защищается, а не пользуется авторитетом учителя. Потому что чем более кротко он отвечает им, тем более успокаивает их.'
      cn: «我却说：不，上主啊！» 彼得说：「你看，我做了我的事。」这是为反驳他们所说的：「你竟到未受割礼的人那里，和他们一同吃饭了。」然而，他为自己申辩，而不是凭着为师的权威。因为他越是温和地回答他们，就越是使他们平静下来。
  - type: paragraph
    text:
      ru: 'Деян.11:11–18.И вот, в тот самый час три человека стали перед домом, в котором я был, посланные из Кесарии ко мне. Дух сказал мне, чтобы я шел с ними, нимало не сомневаясь. Пошли со мною и сии шесть братьев, и мы пришли в дом того человека. Он рассказал нам, как он видел в доме своем Ангела святаго, который стал и сказал ему: «пошли в Иоппию людей и призови Симона, называемого Петром; он скажет тебе слова, которыми спасешься ты и весь дом твой». Когда же начал я говорить, сошел на них Дух Святый, как и на нас вначале. Тогда вспомнил я слово Господа, как Он говорил: «Иоанн крестил водою, а вы будете крещены Духом Святым». Итак, если Бог дал им такой же дар, как и нам, уверовавшим в Господа Иисуса Христа, то кто же я, чтобы мог воспрепятствовать Богу?»'
      cn: (使徒行传 11:11-18) 看哪，隨即有三個人已經到我所在的屋子那裏，是從凱撒利亞差來見我的。 　靈吩咐我和他們同去，不要疑惑。同著我去的，還有這六個弟兄；我們都進了那人的家， 那人就告訴我們，他如何看見一個天使，站在他屋裏，說：『你打發人往約帕去，請那稱呼彼得的西門來； 他有話告訴你，可以叫你和你的全家得救。』 我一開講，　聖靈便降在他們身上，正像當初降在我們身上一樣。 我就想起　主的話說：『約翰是用水施浸，但你們要受　聖靈的浸。』 　上帝既然給他們恩賜，像在我們信　主耶穌　基督的時候給了我們一樣；我是誰，能攔阻　上帝呢。」 眾人聽見這些話，就不言語了，只歸榮耀與　上帝，說：「這樣看來，　上帝也賜恩給外邦人，叫他們悔改得生命了。」

        正在那时，有三个人站在我所在的屋子前，他们是从凯撒利亚奉差遣到我这里来的。圣灵对我说，要我与他们同去，毫无疑虑地。这六位弟兄也与我同去，我们便进了那人的家。他告诉我们，他如何在自己家里看见一位圣天使，站着对他说：「当差人往约帕去，召请那称为彼得的西门；他要对你说的话，可以使你和你的全家得救。」我正开始讲话的时候，圣灵就降在他们身上，正如起初降在我们身上一样。我就想起上主的话，他曾说：「约翰是用水施洗，但你们要受圣灵的洗。」既然如此，如果上帝赐给他们相同的恩赐，像赐给我们这些信了主耶稣基督的人一样，我是谁呢，竟敢拦阻上帝呢？」'
  - type: paragraph
    text:
      ru: '«Выслушав это, они успокоились и прославили Бога, говоря: видно, и язычникам дал Бог покаяние в жизнь.'
      cn: 听了这话，他们就平静了，并且荣耀上帝，说：「这样看来，上帝也赐予了外邦人悔改以得生命。」
  - type: paragraph
    text:
      ru: 'Ничего он не мог сказать, что более обнаруживало бы его смирение, как то, что он сослался на свидетельство братии. Он не говорит о том, что Ангел сказал Корнилию:«молитвы твои и милостыни твои»(Деян. 10, 14), – не повествует о правоте этого мужа, не сообщает, что он сделал так потому, что Дух послал его, что Бог повелел ему, призвавши его оттуда через Ангела, но подтверждает словами«пошли со мною и сии шесть братьев». Потому что это и само по себе было несомненным доказательством. Но не довольствуется и тем, что выше сказано, припоминает и изречение Господа:«Вы будете крещены Духом Святым». Ничего, говорит, нового не случилось, но только то, что Он предсказал. Но, скажут, не нужно было и крестить; а между тем крещение было совершено. И не говорит он «я повелел их крестить», но показывает, что он не сделал ничего нового. Что имели мы, говорит, то получили и они, ибо«Бог дал им такой же дар, как и нам». Чтобы заградить уста их, он говорит:"как и нам". Бог не допускает, говорит он, чтобы они имели меньше, если Он дал равный дар уверовавшим. И не говорит: «как и вам», но –"как и нам". Что находите вы недостойным, когда мы называем их общниками?'
      cn: 他再说不出什么更能显明他谦卑的话了，莫过于他引用了弟兄们的见证。他没有提到天使对哥尼流说的话：「你的祷告和你的施舍」(使徒行传 10:14)，他也没有讲述这人的正直，也没有说他之所以这样做是因为圣灵差遣了他，是上帝吩咐了他，通过天使从那里召了他来，而是用「这六位弟兄也和我同去」这些话来证实。因为这本身就是一个毋庸置疑的证据。但他并不满足于上面所说的，他还想起主的话语：「你们将受圣灵的洗。」他说，没有什么新鲜事发生，只是应验了祂所预言的。但是，他们会说，根本就不需要施洗；然而，洗礼却已经完成了。他也没有说「我吩咐他们施洗」，而是表明他没有做任何新鲜的事。他说，我们所拥有的，他们也得到了，因为「上帝赐给他们与我们一样的恩赐」。为了堵住他们的口，他说：「和我们一样。」他说，既然上帝赐予了信徒同样的恩赐，祂就不允许他们得到的更少。他没有说：「和你们一样」，而是——「和我们一样」。当我们称他们为同伴时，你们认为有什么不配的呢？
  - type: paragraph
    text:
      ru: «Кто же я, чтобы мог воспрепятствовать Богу?»Защищаясь против обвинителей, он сильно и жестоко пристыжает их. Не мог, говорит, я возбранить этого. От этих слов они сделались кроткими и замолчали. Видишь, что благодаря речи Петра к народу все сделалось хорошо, когда он рассказал, что случилось? С этого времени, наконец, открылись двери язычникам для вступления вЦерковь.
      cn: 「我又是谁，竟能拦阻上帝呢？」他在抵挡指控者时，严厉地使他们蒙羞。他说，我无法禁止这事。因着这些话，他们变得柔和并住了口。你看，借着彼得向民众所作的讲话，当他讲述所发生的事时，一切都变得美好了，不是吗？从那时起，进入教会的大门终于向外邦人敞开了。
  - type: paragraph
    text:
      ru: Деян.11:19–26.Между тем рассеявшиеся от гонений бывшего после Стефана, прошли до Финикии и Кипра и Антиохии, никому не проповедуя слово, кроме Иудеев. Были же некоторые из них Кипряне и Киринейцы, которые, придя в Антиохию, говорили Еллинам, благовествуя Господа Иисуса. И была рука Господня с ними, и великое число, уверовав, обратилось к Господу. Дошел слух о сем до церкви Иерусалимской, и поручили Варнаве идти в Антиохию. Он, прибыв и увидев благодать Божию, возрадовался и убеждал всех держаться Господа искренним сердцем. Ибо он был муж добрый и исполненный Духа Святаго и веры. И приложилось довольно народа к Господу. Потом Варнава пошел в Тарс искать Савла и, найдя его, привел в Антиохию. Целый год собирались они в церкви и учили немалое число людей; и ученики в Антиохии в первый раз стали называться Христианами.
      cn: (使徒行传 11:19-26) 那些因司提反的事遭患難四散的門徒直走到腓尼基和塞浦路斯，並安提阿；他們不向別人講道，只向猶太人講。 但內中有塞浦路斯和古利奈人，他們到了安提阿也向希臘人傳講　主耶穌。 　主的手與他們同在；信而歸　主的人數就很多了。 這風聲傳到耶路撒冷教會人的耳中，他們就打發巴拿巴出去，走到安提阿為止。 他到了那裏，看見　上帝所賜的恩就歡喜，勸勉眾人，立定心志，恆久靠　主。 這巴拿巴原是個好人，被　聖靈充滿，大有信心。於是有許多人歸服了　主。 他又往大數去找掃羅， 找著了，就帶他到安提阿去。他們足有一年和教會一同聚集，教訓了許多人。門徒稱為「基督徒」是從安提阿起首。


        然而，那些因司提反殉道后所兴起的逼迫而分散的人，远达腓尼基、塞浦路斯和安提阿，不向任何人传讲这道，唯独向犹太人传讲。其中有几位塞浦路斯人和古利奈人，他们来到安提阿后，也向希腊人宣讲，传扬主耶稣的福音。并且上主的手与他们同在，于是有许多人相信了，归向上主。这消息传到了耶路撒冷的教会，他们就打发巴拿巴往安提阿去。他到了那里，看见上帝的恩典就欢喜了，并且劝勉众人要以真诚的心持守上主。因为他是一个善良的人，并且充满着圣灵和信心。于是有许多人归向上主。后来，巴拿巴到大数去寻找扫罗，找到了他，就带他到了安提阿。他们二人在教会里一同聚会有一整年，教导了许多人；门徒们在安提阿首次被称为基督徒。'
  - type: paragraph
    text:
      ru: Немалую услугу христианству оказало гонение против христиан, потому что«любящим Бога… все содействует ко благу»(Рим. 8, 28). Потому что когда убивали Стефана, когда Павел дважды находился в опасности, когда апостолы были бичуемы, тогда язычники были принимаемы вЦерковь. Это и Павел говорит:«Вам первым надлежало быть проповедану слову Божию, но как вы отвергаете его и сами себя делаете недостойными вечной жизни, то вот, мы обращаемся к язычникам»(Деян. 13, 46).
      cn: 迫害基督徒一事为基督教带来了不小的益处，因为「爱上帝的人，万事都互相效力，使他们得益」（罗马书 8:28）。因为当司提反被杀害时，当保罗两次身处险境时，当使徒们被鞭打时，外邦人就被接纳进入教会。保罗也这样说：「上帝之道本该先传给你们，但既然你们弃绝了它，又自己判自己不配得永生，那么，看哪，我们转向外邦人去」（使徒行传 13:46）。
  - type: paragraph
    text:
      ru: «Говорили к Еллинам». Может быть, потому называли их эллинами, что они не знали по-еврейски.
      cn: «他们向希腊人说话». 也许是因为他们不识希伯来语，所以才称他们为希腊人。
  - type: paragraph
    text:
      ru: Выражение«была рука Господня с ними»показывает то, что они творили чудеса. Видишь, почему и теперь нужны были чудеса? Чтобы уверовали.
      cn: 表达「上主的手与他们同在」，表明他们施行了奇迹。你看，为什么甚至在那时也还需要奇迹呢？为使他们相信。
  - type: paragraph
    text:
      ru: «Поручили Варнаве идти в Антиохию». Почему не написали об этом Павлу, но послали Варнаву? Потому что еще не знали о добродетели этого мужа.
      cn: 「他们差遣巴拿巴去安提阿。」 为何没有将此事告知保罗，却差遣了巴拿巴呢？因为他们尚不知晓此人的美德。
  - type: paragraph
    text:
      ru: «Он был муж добрый и исполненный Духа Святаго и веры». Не одно и то же значит, что Бог благ и что муж благ. Первый благ по существу, будучи началом и источником всех благ, а муж благ не по существу, но в силу добродетели.
      cn: «他是一个良善的男子，并充满圣灵与信心。» 「上帝是良善的」和「一个人是良善的」并非意味着同一件事。前者按其本质是良善的，是所有良善的开端和源泉；而一个人并非按其本质是良善的，而是因着美德。
  - type: paragraph
    text:
      ru: «Потом Варнава пошел в Тарс искать Савла». Очень добрый и простой, и снисходительный человек был Варнава. Искал, говорит Лука, подвижника, военачальника.
      cn: 「然后巴拿巴去了大数寻找扫罗。」巴拿巴是一个非常善良、单纯、宽厚的人。路加说，他寻找的是一位苦行者，一位将军。
  - type: paragraph
    text:
      ru: «Целый год собирались они в церкви и учили немалое число людей». Немалая похвала для города, что он прежде всех прочих в течение такого периода времени наслаждался устами его.
      cn: 「『他们整整一年聚集在教会里，教导了为数不少的人。』对于这座城市而言，这是莫大的赞美，因为它在所有其他城市之前，在这段时期里得享他的教诲。」
  - type: paragraph
    text:
      ru: «Ученики в Антиохии в первый раз стали называться Христианами». И это говорит об успехе проповеди Павла, когда он поднял здесь христианство на такую высоту, что можно было дать христианам это имя как бы какой отличительный знак. Где уверовало три тысячи, где – пять тысяч, где – такое множество; но, впрочем, не было ничего такого вроде этого имени, а просто«Христианами»назывались люди «этого пути». Здесь же впервые они удостоились этого имени. Замечательно, что Антиохия потому особенно и удостоилась главного начальнического престола, что там впервые христиане названы этим именем.
      cn: 「在安提阿，门徒们首次被称为基督徒。」这表明了保罗宣讲的成功，因他在此地将基督教提升到了如此高度，以至于可以将这个名字赐予基督徒，作为一种独特的标志。在有些地方有三千人信主，有些地方有五千人，有些地方有如此众多的人；但，总而言之，并没有什么像这个名字那样的称谓，而人们只是被称为「基督徒」，即「这道上的人」。而正是在这里，他们首次配得了这个名字。值得注意的是，安提阿因此特别配得了首要宗主教座，因为基督徒首次在那里被称为这个名字。
  - type: paragraph
    text:
      ru: Деян.11:27–30.В те дни пришли из Иерусалима в Антиохию пророки. И один из них, по имени Агав, встав, предвозвестил Духом, что по всей вселенной будет великий голод, который и был при кесаре Клавдии. Тогда ученики положили, каждый по достатку своему, послать пособие братьям, живущим в Иудее; что и сделали, послав собранное к пресвитерам через Варнаву и Савла.
      cn: (使徒行传 11:27-30) 當那些日子，有幾位先知從耶路撒冷下到安提阿。 內中有一個，名叫亞迦布，站起來，藉著　靈指明普世將有大饑荒。這事到克勞第凱撒年間果然有了。 於是門徒定意照各人的力量捐錢，送去供給住在猶太的弟兄。 他們就這樣行，把捐項託巴拿巴和掃羅送到眾長老那裏。


        在那些日子里，有几位先知从耶路撒冷来到安提阿。其中一位名叫亚迦布的，站起来，借着圣灵预言普天下将有大饥荒，这事果然在革老丢皇帝在位时发生了。于是门徒们决定，各人按着自己的能力，送去援助给那些住在犹大的弟兄们；他们也这样做了，借着巴拿巴和扫罗的手把所收集的送去给长老们。'
  - type: paragraph
    text:
      ru: В каком смысле Христос говорит, что«все пророки и закон прорекли до Иоанна»(Мф. 11, 13)? Он говорит о тех пророках, которые предвозвестили явление Его.
      cn: 基督所说的「众先知和律法，直到约翰，都说了预言」(马太福音 11:13)，是何意义？祂说的，是那些预先宣告了祂显现的先知。
  - type: paragraph
    text:
      ru: «Предвозвестил Духом». Чтобы не подумали, что голод сделался потому, что явилось христианство, Дух Святый и предсказывает это, потому что и Христос предсказал это. Не потому«по всей вселенной будет голод», чтобы он должен был быть в силу предопределения, изреченного изначала, но по причине зол, которые были нанесены святым апостолам. А так как они продолжались, то и является«великий голод», предвещая иудеям о имеющих быть несчастьях.
      cn: 「圣灵预先宣告」。为免有人以为饥荒是因基督教的出现而产生，圣灵预先宣告此事，因为基督也曾预言过它。并非因「普世将有饥荒」是始初所颁布的预定，故它必须发生，而是由于圣使徒们所遭受的恶行。而由于这些恶行持续不断，于是便出现了「大饥荒」，预示着犹太人即将面临的苦难。
  - type: paragraph
    text:
      ru: '«Тогда ученики положили, каждый по достатку своему». Посмотри: для них и голод делается поводом ко спасению, случаем к милосердию. Посмотри: они делаются верующими и приносят плоды, достойные веры, – оказывают милосердие не только близким, но и дальним.'
      cn: 「于是门徒就按着各人的能力捐献了。」你看：对他们而言，饥荒甚至成了得救的缘由，成为了施行怜悯的机会。你看：他们成为信者，并结出与信仰相称的果实——他们施予怜悯，不只给亲近之人，也给远方之人。
  - type: paragraph
    text:
      ru: «Послать пособие братьям». Из этого становится ясно, что апостолы имели достоинство и старцев, хотя, кроме этого, они находились на степени диаконов и епископов.
      cn: 「将补助送给弟兄们。」由此可知，使徒们具有长老的职分，尽管除此之外，他们也身兼执事和主教的位分。
- type: heading1
  text:
    ru: Глава двенадцатая
    cn: 第十二章
  children:
  - type: paragraph
    text:
      ru: Деян.12:1–5.В то время царь Ирод поднял руки на некоторых из принадлежащих к церкви, чтобы сделать им зло, и убил Иакова, брата Иоаннова, мечом. Видя же, что это приятно Иудеям, вслед за тем взял и Петра. Тогда были дни опресноков. И, задержав его, посадил в темницу, и приказал четырем четверицам воинов стеречь его, намереваясь после Пасхи вывести его к народу. Итак Петра стерегли в темнице; между темцерковьприлежно молилась о нем Богу.
      cn: (使徒行传 12:1-5) 那時，希律王下手苦害教會中幾個人， 用刀殺了約翰的哥哥雅各。 他見猶太人喜歡這事，又去捉拿彼得。（那時正是除酵節的日子。） 希律拿了彼得收在監裏，交付四班兵丁看守，每班四個人，意思要在依絲翠節後，把他提出來，當著百姓辦他。 於是彼得被囚在監裏；教會卻為他不住的禱告　上帝。


        彼时，希律王下手苦害教会中几个人，用刀杀了约翰的兄弟雅各。他见这事为犹太人所喜悦，随即又拿了彼得。那时正是除酵节的日子。他拿住彼得，下在监里，交给四队兵丁看守，想要在逾越节后把他提出来，当着百姓办他。于是彼得被囚在监里；教会却为他切切地向上帝祷告。'
  - type: paragraph
    text:
      ru: 'В какое«то время?»При Клавдии императоре. Потому что римский император Каий назначил Агриппу царем иудейским, определив Ирода вместе с Иродиадой в Лугдон, город галилейский. Это тот самый Ирод, при котором пострадал Иоанн, как об этом повествуют Иосиф и Евсевий. Итак, это разногласие в имени, то есть вместо Агриппы сказано – Ирод, произошло или потому, что он носил два имени, или от ошибки писца. Заметь: из двенадцати учеников Господних прежде всех пострадал Иаков.'
      cn: 在什么「时候」呢？在皇帝克劳狄乌斯在位时。因为罗马皇帝该犹立亚基帕为犹太人的王，将希律与希罗底一同安置在加利利城吕格敦。这正是那位希律，在位时约翰受难，正如约瑟夫斯和优西比乌所记载的。所以，这个名字上的差异，即是用希律取代了亚基帕，要么是因为他拥有两个名字，要么是抄写员的错误所致。请注意：在主的十二门徒中，雅各伯是第一个受难的。
  - type: paragraph
    text:
      ru: «На некоторых из принадлежащих к церкви». Заметь, что верные мужи и состоящее из них общество называют церковью.
      cn: 「对于一些属于教会的人。」请注意，忠信之人以及由他们组成的社群，被称为教会。
  - type: paragraph
    text:
      ru: «Видя же, что это приятно Иудеям, вслед за тем взял и Петра». Чтобы никто не сказал, что апостолы потому бестрепетно и безбоязненно идут навстречу смерти, что Бог восхищает их из рук ее, для того Бог и допустил, чтобы были преданы смерти и старейшие из них – Стефан и Иаков. Этим Бог показывает самим убийцам, что Он и от этого не удаляет их и здесь не препятствует им. Делом приятным было для их неуместных страстей убийство, и убийство беззаконное. Надобно было положить конец их стремлению, а Ирод как палач больных, а не как врач их, подстрекает их, хотя тысячи примеров видел он и в жизни деда и отца своего Ирода.
      cn: '「他既见此事令犹太人喜悦，便随后拿了彼得。」


        为免有人说使徒们之所以能无畏无惧地奔赴死亡，乃是因上帝将他们从死亡手中救出，所以上帝才允许他们中间为首的——司提反和雅各——被交付死亡。借此，上帝向凶手们自己显明，祂并未将他们从这恶事上移开，亦不在此处阻碍他们。对他们不合宜的私欲而言，这杀戮，这不法之杀戮，是一件愉悦之事。本该制止他们的这股冲动，但希律却像一个病人的刽子手，而非他们的医生，反而煽动他们，尽管他已亲见祖父与父亲希律生平中的千百事例。'
  - type: paragraph
    text:
      ru: '«Тогда были дни опресноков… задержав его, посадил в темницу». Опять обнаруживается излишняя щепетильность иудеев: убить они не препятствовали, а препятствовали сделать это в такое время.'
      cn: 「那时正是除酵节……把他捉住，收在监里。」犹太人再次显露出他们过度的恪守规条：他们不阻拦杀人，却阻拦在那个时候杀人。
  - type: paragraph
    text:
      ru: «Приказал четырем четверицам воинов стеречь его». Это происходило и от гнева, и от боязни. Чем тщательнее была стража, тем более удивительно обнаружение силы Божией. А это случилось ради апостола Петра, который был весьма известен.
      cn: 「吩咐四队兵丁，每队四人，看守他。」这既是出于忿怒，也是出于惧怕。看守越严密，上帝之大能的彰显便越是奇妙。而这事乃是因使徒彼得之故，他当时声名远扬。
  - type: paragraph
    text:
      ru: '«Между темцерковьприлежно молилась о нем Богу». Послушайте, как они ходатайствовали за учителей: они не возмутились, не взбунтовались, но обратились к истинной сподвижнице – молитве.'
      cn: 「与此同时，教会为他向上帝殷勤祈祷。」 请听，他们是如何为教师们代求的：他们没有愤怒，没有反抗，而是转向了真正的助伴——祷告。
  - type: paragraph
    text:
      ru: 'Деян.12:6–10.Когда же Ирод хотел вывести его, в ту ночь Петр спал между двумя воинами, скованный двумя цепями, и стражи у дверей стерегли темницу. И вот, Ангел Господень предстал, и свет осиял темницу. Ангел, толкнув Петра в бок, пробудил его и сказал: встань скорее. И цепи упали с рук его. И сказал ему Ангел: опояшься и обуйся. Он сделал так. Потом говорит ему: надень одежду твою и иди за мною. Петр вышел и следовал за ним, не зная, что делаемое Ангелом было действительно, а думая, что видит видение. Пройдя первую и вторую стражу, они пришли к железным воротам, ведущим в город, которые сами собою отворились им: они вышли, и прошли одну улицу, и вдруг Ангела не стало с ним.'
      cn: (使徒行传 12:6-10) 希律將要提他出來的前一夜，彼得被兩條鐵鏈鎖著，睡在兩個兵丁當中；看守的人也在門外看守。 忽然，有　主的一個天使站在旁邊，監裏有光照耀；天使拍彼得的肋旁，拍醒了他，說：「快快起來。」那鐵鏈就從他手上脫落下來。 天使對他說：「束上帶子，穿上鞋。」他就那樣作。天使又說：「披上外衣，跟著我來。」 彼得就出來跟著他，不知道天使所作是真的，只當見了異象。 過了第一層第二層監牢，就來到通往城內的鐵門，那門自己開了。他們出來，走過一條街，天使便離開他去了。

        当希律想要带他出来的时候，那一夜，彼得睡在两名士兵中间，被两条铁链锁着，门前的守卫看守着监牢。忽然，上主的使者显现，光照亮了监牢。使者推了彼得的肋旁一下，叫醒了他，说：「赶快起来！」他的铁链就从手上脱落了。使者又对他说：「束上你的腰带，穿上你的鞋。」他照做了。然后又对他说：「穿上你的衣服，跟着我走。」彼得就出来跟着他，不知道使者所做的是真实的，却以为自己是在看异象。经过第一层和第二层岗哨，他们来到通往城市的铁门那里，这门就自动为他们开了。他们出去，走过了一条街，忽然使者就离开他不见了。'
  - type: paragraph
    text:
      ru: 'Петр не был ни в смущении, ни в страхе, но в"ту"самую"ночь",когда его намеревались вывести из темницы,"спал",предоставив все на волю Господа. Обрати внимание и на то, как тщательна стража: спали с ним и стражи.'
      cn: 彼得既不慌乱，也不惧怕，但就在「那」个「夜」晚，当他们打算将他从监狱中带出时，「睡着了」，将一切都交托给上主的旨意。也要注意守卫是多么地严密：守卫们也和他一同睡着了。
  - type: paragraph
    text:
      ru: Но для чего«свет осиял темницу?»Чтобы Петр мог и видеть, и слышать Ангела и чтобы не подумал, что это – воображение. Ангел даже толкнул его, – так крепко он спал. Что же касается выражения«толкнув Петра в бок», – так оно указывает не на смущение Ангела, а на побуждение не затягивать время.
      cn: 但为何「光照亮了牢房」？为了让彼得能够看见，也能听见天使，并且不至于认为这只是幻觉。天使甚至推了他一下——他睡得如此沉。至于「推彼得的肋旁」这个说法——这并非指天使的困惑或慌乱，而是指催促他不要拖延时间。
  - type: paragraph
    text:
      ru: '«Опояшься и обуйся». Как это Петр поступал вопреки повелению не брать с собой«ни золота, ни серебра, ни меди в поясы свои, ни сумы на дорогу, ни двух одежд, ни обуви, ни посоха»(Мф. 10, 910)? А у него были и одежда и обувь, хотя в то время следовало ходить без обуви, потому что особенная нужда в ней бывает зимой. Но и Павел, написав Тимофею:«постарайся придти до зимы»,говорит ему:«Когда пойдешь, принеси фелонь, который я оставил в Троаде у Карпа»(2Тим. 4, 13,21). Никто не может сказать, что Павел не имел другой одежды, которую он носил. Они не противились повелению Христову: да не будет! Напротив, они даже очень следовали повелению, потому что повеление это было дано на время, а не навсегда. К тому же и Лука говорит, что Христос сказал ученикам:«Когда Я посылал вас без мешка и без сумы и без обуви, имели ли вы в чем недостаток? Они отвечали: ни в чем. Тогда Он сказал им: но теперь, кто имеет мешок, тот возьми его, также и суму»(Лк. 22, 35–36). Христос дал в то время такое повеление, желая показать Свое могущество, потому что, скажи мне, какая важность была в том, чтобы иметь одну лишь одежду? Итак, какая же? Когда нужно было ее мыть, то ужели следовало ходить нагим или сидеть дома? А когда наступал сильный холод и стужа стягивала тело, то ужели следовало отогреваться и не проповедовать? Ведь тела у них были не алмазной крепости.'
      cn: 「束上腰，穿上鞋。」 彼得怎会违背「不要带金子，不要带银子，也不要带铜钱在腰带里，路上也不要带口袋，也不要带两件里衣，不要带鞋子，也不要带手杖」的命令呢？(马太福音 10:9-10) 可他有衣服也有鞋，虽然在当时，人们应该不穿鞋走路，因为冬天对鞋子的需求尤为强烈。但保罗写信给提摩太说：「你务要在冬天以前赶来」，又对他说：「你来的时候，要把我在特罗亚留于加布的袍子带来。」(提摩太后书 4:13，21) 没人能说保罗没有别的衣服可穿。他们并没有违背基督的命令，绝不是这样！相反，他们甚至非常遵从这命令，因为这命令是暂时的，而非永久的。此外，路加也说，基督对门徒说：「我差遣你们的时候，没有钱囊，没有口袋，没有鞋，你们缺少什么没有？」他们说：「什么都没有缺。」于是祂对他们说：「但如今，有钱囊的，可以拿着，有口袋的，也可以带着。」(路加福音 22:35-36) 基督在当时给出这样的命令，是为了展现祂的大能。因为，请告诉我，只带一件衣服有什么重要性呢？那么，这又如何呢？当需要洗衣服时，难道应该光着身子走路或坐在家里吗？而当严寒来临，寒冷侵袭身体时，难道应该去取暖而不去传道吗？毕竟他们的身体并非金刚不坏。
  - type: paragraph
    text:
      ru: «Не зная, что делаемое Ангелом было действительно, а думая, что видит видение». Это очень естественно при изумительной необычайности того, что случилось, потому что необычайность знамений поражает зрителя. Петр думал, что видит видение, а сам опоясывался и обувался. Что же другое мог он чувствовать, как не изумление?
      cn: 「不知道天使所做的乃是真实的，却以为自己是看见异象。」这是非常自然的，鉴于所发生之事那令人惊叹的非凡性，因为神迹的非凡性会震撼观看者。彼得以为自己是看见异象，而他自己正在束腰和穿鞋。除了惊异，他又能感受到什么呢？
  - type: paragraph
    text:
      ru: 'Деян.12:11–18.Тогда Петр, придя в себя, сказал: теперь я вижу воистину, что Господь послал Ангела Своего и избавил меня из руки Ирода и от всего, чего ждал народ Иудейский. И, осмотревшись, пришел к дому Марии, матери Иоанна, называемого Марком, где многие собрались и молились. Когда же Петр постучался у ворот, то вышла послушать служанка, именем Рода; и, узнав голос Петра, от радости не отворила ворот, но, вбежав, объявила, что Петр стоит у ворот. А те сказали ей: в своем ли ты уме? Но она утверждала свое. Они же говорили: это Ангел его. Между тем Петр продолжал стучать. Когда же отворили, то увидели его и изумились. Он же, дав знак рукою, чтобы молчали, рассказал им, как Господь вывел его из темницы, и сказал: уведомьте о сем Иакова и братьев. Потом, выйдя, пошел в другое место. По наступлении дня между воинами сделалась большая тревога о том, что сделалось с Петром.'
      cn: (使徒行传 12:11-18) 彼得醒悟過來，說：「我現在確知道　主差遣他的天使，救了我脫離希律的手和猶太百姓一切所指望的。」 想了一想，就往那稱呼馬可的約翰、他母親馬利亞家去，在那裏有許多人聚集禱告。 彼得敲外門，有一個女子，名叫羅大，出來探聽， 聽得是彼得的聲音，就歡喜的顧不得開門，跑進去告訴眾人說：「彼得站在門外。」 他們說：「你是瘋了。」使女不斷地說：「真是他。」他們說：「必是他的天使。」 彼得不住的敲門。他們開了門，看見他，就甚驚奇。 彼得用手示意他們不要作聲，就告訴他們　主怎樣領他出監；又說：「你們把這些事告訴雅各和眾弟兄。」於是他離開，往別處去了。 到了天亮，兵丁間擾亂不小，不知道彼得往那裏去了。


        那时彼得醒悟过来，说：「现在我确实知道，上主差遣了祂的使者，救我脱离了希律的手，和犹太民族所期望的一切。」他四下张望，来到马利亚家，这马利亚是称呼马可的约翰的母亲，在那里有许多人聚集祷告。彼得敲门的时候，有一个使女，名叫罗大，出来听。她认出彼得的声音，欢喜得没有开门，反倒跑进去告诉众人说，彼得站在门外。众人对她说：「你疯了！」她却坚持说是真的。他们说：「那必是他的使者。」


        彼得不住地敲门。他们开了门，看见他，就都惊奇。彼得用手势叫他们不要作声，向他们讲述上主如何把他从监牢里带出来。又说：「要把这些事告诉雅各和众弟兄。」于是他出去，往别处去了。天亮的时候，兵丁中起了不小的骚乱，不知彼得出了什么事。'
  - type: paragraph
    text:
      ru: Теперь, говорит, узнал,«теперь я вижу воистину»,а не тогда. Ангелу угодно было, чтобы сердце Петрово наполнилось радостью вдруг и чтобы он понял то, что случилось, уже по освобождении.
      cn: 现在，他说，他明白了，«现在我真真切切地看到了»，而不是在那时。天使乐意如此，好使彼得的心倏然充满喜乐，并且让他在获释之后才明白所发生的一切。
  - type: paragraph
    text:
      ru: «Осмотревшись». По размышлении, он увидел, что следует не прямо продолжать путь, а возблагодарив Благодетеля.
      cn: «审视». 经思忖后，他看到不应径直前行，而是当先感谢恩主。
  - type: paragraph
    text:
      ru: «Иоанна, называемого Марком». Иоанн, быть может, был не тот, который постоянно пребывал с апостолами. Поэтому-то писатель и присовокупил его отличие, так как сказал:«называемого Марком». Быть может, это – евангелист Марк, через которого, говорят, передал свое Евангелие Петр, так как о Евангелии от Марка говорится, что оно – Петрово Евангелие. Это предположение оправдывается тем, что Петр и прочие апостолы проводили у него довольно времени.
      cn: 「约翰，又名马可」。约翰或许并非那一位常与使徒们同在的人。正因如此，作者才特意附加上他的区别，正如他所说的：「又名马可」。也许，他就是传福音者马可，人们说，彼得是通过他传下了自己的福音，因为马可福音被称为彼得的福音。这个假设得到了证实，因为彼得和其余使徒曾在他那里度过了相当长的时间。
  - type: paragraph
    text:
      ru: «От радости не отворила ворот». Обрати внимание на благоговение отроковицы:«от радости»,говорится,«не отворила». Но это вышло прекрасно, иначе прочие, изумленные его неожиданным явлением, пожалуй, не поверили бы, что это – он, так как и при этом не хотели верить.
      cn: 「因喜乐未曾打开大门。」请留意那婢女的虔敬心：「因喜乐，」经上说，「未曾打开门。」然而这事恰恰是极好的，否则，其他人惊诧于他的突然显现，或许不会相信那就是他，因为即便如此，他们仍然不愿相信。
  - type: paragraph
    text:
      ru: '«Они же говорили: это Ангел его». Это верно, потому что у каждого есть Ангел. Со всяким верующим в Господа постоянно пребывает Ангел, если только мы не отгоняем его злыми делами, ибо как дым заставляет удаляться пчел и как зловоние отгоняет голубей, так и смрадный и причиняющий много слез грех отдаляет от нас Ангела. А они ожидали, что это – Ангел, соображаясь со своим положением, потому что говорится:«Где двое или трое собраны во имя Мое, там Я посреди них»(Мф. 18, 20). А где Христос, там необходимо быть и Архангелам, и прочим силам.'
      cn: 「他们说：这是他的天使。」这是真的，因为每个人都有天使。与每个信奉上主的人，天使常住同在，除非我们用恶行将他赶走；因为就像烟使蜜蜂离去，就像恶臭赶走鸽子一样，同样，那恶臭并引致诸多泪水的罪使天使远离我们。而他们期待着这是天使，是根据他们自身的情况，因为经上说：「无论在哪里，有两三个人奉我的名聚会，那里就有我在他们中间。」(马太福音 18:20) 而基督在哪里，那里就必然有大天使以及其他众能者。
  - type: paragraph
    text:
      ru: '«Сказал: уведомьте о сем Иакова и братьев». Как он нетщеславен! Не сказал «известите всюду», но– «уведомьте… братьев».'
      cn: 「他说：『把这事告知雅各和弟兄们。』」他是何等不慕虚荣！他没有说『通告各处』，而是说——『告知……弟兄们』。
  - type: paragraph
    text:
      ru: «Выйдя, пошел в другое место». Это потому, что он не хотел испытывать Бога и вводить себя самого в искушения. Ангел же не говорил ему об этом; но тем, что оставил его молча и ночью извел его из темницы, дал ему позволение удалиться, так как апостолы сделали уже то, что было им повелено – идти в храм проповедовать народу.
      cn: 他「出来后，便去了另一个地方。」这是因为他不想试探上帝，也不想使自己陷入诱惑。天使却对此没有言明；而是借着默默地离开他，并在夜里将他从监狱中领出来，给了他离开的许可，因为使徒们已经完成了他们受命要做的事——到圣殿里向百姓传讲。
  - type: paragraph
    text:
      ru: Деян.12:19–20.Ирод же, поискав его и не найдя, судил стражей и велел казнить их. Потом он отправился из Иудеи в Кесарию и там оставался. Ирод был раздражен на Тирян и Сидонян; они же, согласившись, пришли к нему и, склонив на свою сторону Власта, постельника царского, просили мира, потому что область их питалась от области царской.
      cn: (使徒行传 12:19-20) 希律找他，找不著，就審問看守的人，吩咐要把他們拉去治死。後來希律離開猶太，下凱撒利亞去，住在那裏。 希律甚不喜歡推羅、西頓的人。他們那一帶地方是從王的地土得供養，因此就託了他們的朋友王的內侍臣伯拉斯都的情，一心來求和。

        希律王寻找他，却寻不见，便审问了卫兵，并下令处决他们。随后他从犹太下到凯撒利亚，并在那里住下。希律王恼怒推罗和西顿的人；他们就联合起来，到他那里，说服了王室内侍臣布拉斯都，请求和睦，因为他们的地域从王的地域得粮食。'
  - type: paragraph
    text:
      ru: Для Бога возможно было вместе с Петром избавить и"стражей".
      cn: 对于上帝来说，与彼得一同解救甚至『守卫们』，原本也是可能的。
  - type: paragraph
    text:
      ru: Но если бы Ангел вывел и воинов вместе с Петром, то событие сочли бы бегством. Ирода же более печалило то, что он был осмеян, подобно тому, как и деда его, обманутого волхвами, также более терзало то, что его обманули.
      cn: 但如果天使把兵丁也和彼得一同带出来，那么这事就会被看作是逃跑。而希律更悲伤的是他被嘲弄了，正如他的祖父被术士们欺骗了，同样，更令他痛苦的是他被欺骗了。
  - type: paragraph
    text:
      ru: «Ирод был раздражен на Тирян и Сидонян…»Лука упомянул об этой истории, из которой видно, как тотчас же Ирода постигло наказание.
      cn: '«希律恼怒推罗和西顿人……»（使徒行传 12:20）

        路加提及此事，从中可见惩罚随即临到了希律身上。'
  - type: paragraph
    text:
      ru: 'Деян.12:21–24.В назначенный день Ирод, одевшись в царскую одежду, сел на возвышенном месте и говорил к ним; а народ восклицал: это голос Бога, а не человека. Но вдруг Ангел Господень поразил его за то, что он не воздал славы Богу; и он, быв изъеден червями, умер. Слово же Божие росло и распространялось.'
      cn: (使徒行传 12:21-24) 希律在所定的日子，穿上朝服，坐在位上，對他們講論一番。 百姓喊著說：「這是神的聲音，不是人的聲音。」 希律不歸榮耀給　上帝，所以　主的天使立刻擊打他，他被蟲所咬，氣就絕了。 　上帝的道日見興旺，越發廣傳。
  - type: paragraph
    text:
      ru: 'Иосиф говорит, что Ирод, при наступлении следующего дня, прибыл в театр, одетый в удивительную по тканью, всю сделанную из серебра«царскую одежду». Серебро, засиявшее при первом падении на него солнечных лучей, удивительно блистало каким-то поражающим и ужасающим зрителей переливом лучей света; и льстецы сейчас же стали называть его богом, прибавляя: «Будь милостив; если до сих пор мы боялись тебя как человека, то с этого времени признаем, что ты выше человеческой природы». Заметь, как они льстили, но обрати свой взор и на величие духа апостолов. Кого так почитал целый народ, того они презирали. Однако же если льстецы и кричали так, то какое же отношение это имеет к Ироду? То, что он принял этот крик, что счел себя достойным такой лести. Им же главным образом они и научены такой безрассудной лести. Итак, и тот, и другие заслуживали наказания, но так как еще не время суда, то наказывается только тот, кто особенно виноват. Если он, дозволивший себе выслушать лишь такое о себе мнение:«голос Бога, а не человека»,потерпел такое посрамление, то гораздо более был бы наказан Христос, если бы не был самим Богом, Христос, постоянно говоривший: «Слова эти – не Мои» и: «Ангелы служат Мне».'
      cn: 约瑟夫说，次日希律来到剧场，身着一件织造精美、通体由银丝织成的「王袍」。银丝在第一缕阳光照耀其上时，便奇妙地闪耀着，焕发出一种令人惊叹、使观众心生敬畏的光芒变幻；于是谄媚者们立刻称他为神，并补充道：「施恩吧！如果直到现在我们仍像对待凡人一样敬畏祢，那么从现在起，我们承认祢超越人类的本性。」请注意他们是何等谄媚，但也请将目光投向使徒们伟大的精神。整个民族如此崇敬的人，却被他们所蔑视。然而，即使谄媚者们如此呼喊，这与希律又有何干呢？在于他接受了这呼喊，认为自己配得上如此的谄媚。而他们也正是主要受他教导，才学会了这种愚妄的谄媚。因此，他（希律）和那些谄媚者都该受惩罚；但由于审判的时候还未到，所以只有那些尤其有罪的人才受到惩罚。如果他仅仅因为容许自己听到别人称他为「神的声音，而非人的声音」，就遭受了如此的羞辱，那么，倘若基督并非上帝本身，祂就更应遭受惩罚。基督曾不断地说：「这些话不是我说的」，以及「天使们服侍我」。
  - type: paragraph
    text:
      ru: Деян.12:25.А Варнава и Савл, по исполнении поручения, возвратились из Иерусалима [в Антиохию], взяв с собою и Иоанна, прозванного Марком.
      cn: (使徒行传 12:25) 巴拿巴和掃羅辦完了他們供給的事，就從耶路撒冷回來，帶著稱呼馬可的約翰同去。
- type: heading1
  text:
    ru: Глава тринадцатая
    cn: 第十三章
  children:
  - type: paragraph
    text:
      ru: 'Деян.13:1.В Антиохии, в тамошней церкви были некоторые пророки и учители: Варнава, и Симеон, называемый Нигер, и Луций Киринеянин, и Манаил, совоспитанник Ирода четвертовластника, и Савл.'
      cn: (使徒行传 13:1) 在安提阿的教會中，有幾位先知和教師，就是巴拿巴和稱呼尼結的西面、古利奈人路求，與分封之王希律同養的馬念，並掃羅。
  - type: paragraph
    text:
      ru: О Варнаве упоминает прежде, так как Павел еще не прославился и не совершил еще никакого знамения. Но следует заметить, что и Павел и Варнава причтены были к лику апостолов.
      cn: 他首先提到巴拿巴，因为保罗尚未显赫，也未曾行过任何神迹。但值得注意的是，保罗和巴拿巴都被列入使徒之列。
  - type: paragraph
    text:
      ru: '«Манаил, совоспитанник Ирода четвертовластника». Вот что значит характер каждого, и воспитание не оказывает влияния: посмотри, каким нечестивцем остался Ирод, а его совоспитанник Манаил так изменился, что удостоился даже дара пророчества.'
      cn: 「马奈尔，分封王希律的伴读。」这说明了各人的品格，以及教养不起作用：看哪，希律仍旧是个何等不敬虔的人，而他的伴读马奈尔却如此转变，甚至蒙受了预言的恩赐。
  - type: paragraph
    text:
      ru: 'Деян.13:2–8.Когда они служили Господу и постились, Дух Святый сказал: отделите Мне Варнаву и Савла на дело, к которому Я призвал их. Тогда они, совершив пост и молитву и возложив на них руки, отпустили их. Сии, быв посланы Духом Святым, пришли в Селевкию, а оттуда отплыли в Кипр; и, быв в Саламине, проповедовали слово Божие в синагогах Иудейских; имели же при себе и Иоанна для служения. Пройдя весь остров до Пафа, нашли они некоторого волхва, лжепророка, Иудеянина, именем Вариисуса, который находился с проконсулом Сергием Павлом, мужем разумным. Сей, призвав Варнаву и Савла, пожелал услышать слово Божие. А Елима волхв, – ибо то значит имя его, – противился им, стараясь отвратить проконсула от веры.'
      cn: (使徒行传 13:2-8) 他們事奉　主、禁食的時候，　聖靈說：「要為我分派巴拿巴和掃羅，去作我召他們所作的工。」 於是禁食禱告，按手在他們頭上，就打發他們去了。 他們既被　聖靈差遣，就下到西流基，從那裏坐船往塞浦路斯去。 到了撒拉米，就在猶太人各會堂裏傳講　上帝的道，也有約翰作他們的幫手。 經過海島，直到帕弗，在那裏遇見一個有法術，假充先知的猶太人，名叫巴．耶穌。 這人常和省長士求．保羅同在。士求．保羅是個通達人，他請了巴拿巴和掃羅來，要聽　上帝的道。 只是那行法術的以呂馬（這名翻出來就是行法術的意思）敵擋使徒，要叫省長轉離信仰。


        当他们事奉上主并禁食的时候，圣灵说：「将巴拿巴和扫罗分别为我，去作我已召他们去作的工。」于是他们，禁食祷告之后，并按手在他们头上，就打发他们去了。


        这些人，既被圣灵差遣，就下到西流基，从那里坐船往居比路；到了撒拉米，在犹太人的会堂里宣讲上帝的道；也有约翰作他们的帮手。走遍全岛，直到帕弗，遇见一个犹太人，是个行法术的假先知，名叫巴耶稣，他与方伯士求保罗同在，士求保罗是个聪明人。这方伯召了巴拿巴和扫罗来，想要听上帝的道。但行法术的以吕马——因为他的名字就是这个意思——敌挡他们，想要叫方伯不信真道。'
  - type: paragraph
    text:
      ru: Что значит«когда они служили?»Это значит «проповедовали». А выражение«на дело»употреблено вместо «на апостольство». Кем рукополагается Павел? Луцием и Манаилом, а вернее – Духом Святым. Хиротонисуется же он, чтобы проповедовать со властью. Как же сам Павел говорит:«избранный не человеками и не через человека»(Гал. 1,1)? Это в том отношении, что не человек призвал его и обратил. Рукополагали не так, как диаконов, но«возложив на них руки»после предварительного поста и молитвы, так что из этого можно заключить, что Варнава и Павел через такое рукоположение получили высшую иерархическую степень, чем диаконская.
      cn: 「当他们事奉时」是什么意思？这意思是「他们宣讲了」。而「为这事工」这个表达，是替代「为使徒职分」而使用的。保罗是由谁按立的？是由路求和马念，更确切地说，是由圣灵（按立的）。他被按立是为了带着权柄宣讲。那么保罗自己又是如何说的：「作使徒的，不是由于人，也不是藉着人」（加拉太书 1:1）呢？这指的是没有人召叫他并使他回转。按立他们并非像按立执事那样，而是「按手在他们身上」，此前有禁食和祷告，因此可以得出结论，巴拿巴和保罗通过这样的按立获得了比执事更高的圣统品级。
  - type: paragraph
    text:
      ru: «Пришли в Селевкию, а оттуда отплыли». В Селевкии они не останавливаются, зная, что жители ее могли стяжать много пользы от соседнего с нею города, а спешат исполнить неотложное.
      cn: «他们来到塞琉西亚，又从那里开船去了》。他们在塞琉西亚不停留，因为知道那里的居民可以从邻近的城市获得许多益处，而他们则急于去完成当务之急。
  - type: paragraph
    text:
      ru: '«С проконсулом Сергием Павлом, мужем разумным. Сейпроконсул,призвав Варнаву и Савла, пожелал услышать слово Божие». Удивительно в проконсуле то, что он, быв ранее уже увлечен магией волхва, пожелал послушать апостолов. Но обрати внимание и на волхва: когда апостолы проповедовали прочим людям, он не очень негодовал; вознегодовал же особенно тогда, когда они пришли к проконсулу.'
      cn: 「与明达之人，总督色尔吉·保罗同在。这位总督召请了巴拿巴和扫罗，愿聆听上帝的圣言。」这位总督令人惊奇之处在于，他先前已被那术士的魔法所迷惑，竟愿聆听使徒们的话语。然而，请留意那术士：当使徒们向其他人传讲时，他并未十分恼怒；而当他们来到总督面前时，他才尤其恼怒。
  - type: paragraph
    text:
      ru: 'Деян.13:9–12.Но Савл, он же и Павел, исполнившись Духа Святаго и устремив на него взор, сказал: о, исполненный всякого коварства и всякого злодейства, сын диавола, враг всякой правды! перестанешь ли ты совращать с прямых путей Господних? И ныне вот, рука Господня на тебя: ты будешь слеп и не увидишь солнца до времени. И вдруг напал на него мрак и тьма, и он, обращаясь туда и сюда, искал вожатого. Тогда проконсул, увидев происшедшее, уверовал, дивясь учению Господню.'
      cn: (使徒行传 13:9-12) 掃羅，（又名保羅，）被　聖靈充滿，定睛看他， 並說：「你這充滿各樣詭詐奸惡，魔鬼的孩子，眾義的仇敵啊。你混亂　主的正道還不止住嗎？ 現在　主的手加在你身上，你要瞎眼，暫且不見日光。」他的眼睛立刻昏蒙黑暗，周圍求人拉著手領他。 省長看見所作的事，很希奇　主的道，就信了。
  - type: paragraph
    text:
      ru: «Савл, он же и Павел». Здесь вместе с рукоположением Савла меняется и имя его. Переименован же он для того, чтобы и с этой стороны быть не ниже апостолов. А что касается преимущества, какое имел корифей учеников Христовых Петр, так и Павел, кажется, пользовался таким же уважением и имел случай снискать даже большее расположение.
      cn: 扫罗，他就是保罗。在此，扫罗在按立圣职之际，其名也随之更改。他被改名，是为了在此方面不逊于众使徒。而至于基督众门徒之首彼得所享有的优越之处，保罗似乎也获得了同样的敬重，甚至有机会赢得更大的爱戴。
  - type: paragraph
    text:
      ru: «Исполненный всякого коварства». Никакого рода коварства, говорит, не оставалось, которого бы ты не имел. Верно сказал:«всякого коварства»,потому что волхв был льстецом и лжецом. А«сын диавола»называет его потому, что он делал диавольское дело.
      cn: 「充满各样诡诈的。」他说，没有任何一种诡诈是你所不具备的。他准确地说：「各样诡诈」，因为这术士是个谄媚者和骗子。而称他为「魔鬼之子」，是因为他行了魔鬼的作为。
  - type: paragraph
    text:
      ru: 'Не с нами, говорит Павел, воюешь и сражаешься, но совращаешь«с прямых путей Господних. И ныне вот, рука Господня на тебя: ты будешь слеп и не увидишь солнца до времени». Тем же средством, каким был обращен сам, хотел и его обратить. Итак, это было не наказание, но врачевание, потому что Павел говорил: «Не я творю это, но«вот, рука Господня на тебя». А«до времени»,очевидно, было словом не наказывающего, а обращающего, потому что если бы оно было словом наказывающего, то Павел сделал бы его слепым навсегда; а здесь не то, но –«до времени». Говорит так, чтобы подействовать на проконсула, ибо дает этим знать, что от самого волхва зависит получить снова зрение: нужно изменить образ жизни на лучший.'
      cn: 保罗说，你争战、搏斗的不是我们，而是使人偏离「上主的直道。现在看哪，上主的手要临到你：你要瞎眼，暂时看不见日光。」保罗借着他自己被归化的同样方式，也想让他归化。所以，这并非惩罚，而是医治，因为保罗说：「这不是我做的，而是『看哪，上主的手要临到你』。」而「暂时」，显然并非惩罚者的话语，而是旨在使人归化者的话语，因为如果那是惩罚者的话语，保罗就会让他永远瞎眼；而这里并非如此，而是——「暂时」。他这样说，是为了影响方伯，因为这表明，术士能否恢复视力，取决于他自己：必须改变生活方式，变得更好。
  - type: paragraph
    text:
      ru: «Обращаясь туда и сюда, искал вожатого». Это – доказательство слепоты. Нужно было посредством такого именно наказания вразумить того, кто прежде был увлечен магией. Таким образом, наказания как бы вразумляли и волхвов.
      cn: 「他来回张望，寻找向导。」这便是失明的证明。必须借由这样一种惩罚，使那从前沉迷于魔法的人醒悟过来。如此一来，惩罚仿佛也使那些术士们醒悟了。
  - type: paragraph
    text:
      ru: 'Деян.13:13–15.Отплыв из Пафа, Павел и бывшие при нем прибыли в Пергию, в Памфилии. Но Иоанн, отделившись от них, возвратился в Иерусалим. Они же, проходя от Пергии, прибыли в Антиохию Писидийскую и, войдя в синагогу в день субботний, сели. После чтения закона и пророков, начальники синагоги послали сказать им: мужи братия! если у вас есть слово наставления к народу, говорите.'
      cn: (使徒行传 13:13-15) 保羅和他的同人從帕弗開船，來到旁非利亞的別加，約翰就離開他們，回耶路撒冷去。 他們離了別加往前行，來到彼西底的安提啊，在安息日進會堂坐下。 讀完了律法和先知的書，管會堂的，叫人過去，對他們說：「諸位弟兄，若有甚麼勸勉眾人的話，請說。」


        从帕弗开船，保罗和与他同在的人来到旁非利亚的别加。但约翰离开他们，回到耶路撒冷。他们经过别加，来到彼西底的安提阿，在安息日进了会堂，就坐下。宣读律法和先知书以后，会堂的官长差人去对他们说：「弟兄们！你们若有什么劝勉百姓的话，都可以说。」'
  - type: paragraph
    text:
      ru: 'Иоанн, называемый Марком, сопутствовал им в евангельском шествии от Палестины до Пергии Памфилийской. Потом, когда апостолы ускорили свое шествие и с твердым, непреклонным духом стали вооружаться на подвиги, Марк, как человек слабый и не решавшийся на такое путешествие и на те подвиги, опасности и борьбу, какие представлялись в каждом городе, отстав от апостолов, возвратился в Палестину, не отрицаясь Христа, но отказываясь от дальнейшего путешествия, так как оно было трудно для него. Павел и Варнава возвратились в Иерусалим с обильными плодами веры и благовествовали находившейся в Иерусалиме церкви об обращении и покаянии язычников. И когда все стали воздавать Павлу и Варнаве хвалу за их полные успеха подвиги, Марк опечалился, смутился душою и, быть может, подумал: «Если бы и я был с апостолами, то и я сделался бы участником в их славе», – и снова пожелал выступить вместе с апостолами на проповедь.'
      cn: 约翰，人称马可，在传福音的旅途中与他们同行，从巴勒斯坦直到旁非利亚的别加。后来，当使徒们加快了行程，并以坚定不移的精神预备好投入圣工的劳苦时，马可却是一个软弱之人，不敢承担这样的旅行以及在每个城市所面临的劳苦、危险和争战，于是他离开了使徒们，回到了巴勒斯坦，他并没有否认基督，只是拒绝继续旅行，因为这对他来说太过艰难。保罗和巴拿巴带着丰硕的信仰果实回到了耶路撒冷，并向在耶路撒冷的教会传达了关于外邦人归信与悔改的佳音。当众人开始称赞保罗和巴拿巴因他们满载成功的圣工时，马可感到悲伤，内心不安，并且，也许他想道：「如果我也与使徒们同在，那么我也会分享他们的荣耀。」他又渴望与使徒们一同出去传道了。
  - type: paragraph
    text:
      ru: «Прибыли в Пергию, в Памфилии». Снова приходят в Пергию, потому что спешили в антиохийскую митрополию.
      cn: 「抵达了旁非利亚的别加。」他们再次来到别加，因为他们急于赶往安提阿都主教区。
  - type: paragraph
    text:
      ru: «Войдя в синагогу в день субботний, сели.»
      cn: «进入犹太会堂，在安息日，他们坐下了。»
  - type: paragraph
    text:
      ru: В синагоги они входили в одежде иудейской, чтобы не встретить сопротивления и не быть выгнанными, и достигали, таким образом, во всем своей цели.
      cn: 他们穿着犹太人的服饰进入会堂，以免遭遇抵制和被逐出，这样，他们便能在一切事上达到目的。
  - type: paragraph
    text:
      ru: 'Деян.13:16–24.Павел, встав и дав знак рукою, сказал: мужи Израильтяне и боящиеся Бога! послушайте. Бог народа сего избрал отцов наших и возвысил сей народ во время пребывания в земле Египетской, и мышцею вознесенною вывел их из нее; и около сорока лет времени питал их в пустыне. И, истребив семь народов в земле Ханаанской, разделил им в наследие землю их. И после сего, около четырехсот пятидесяти лет, давал им судей до пророка Самуила. Потом просили они царя, и Бог дал им Саула, сына Кисова, мужа из колена Вениаминова. Так прошло лет сорок. Отринув его, поставил им царем Давида, о котором и сказал, свидетельствуя: «нашел Я мужа по сердцу Моему, Давида, сына Иессеева, который исполнит все хотения Мои»(1Цар. 13, 14;Пс. 88, 21).«Из его-то потомства Бог по обетованию воздвиг Израилю Спасителя Иисуса. Перед самым явлением Его Иоанн проповедовал крещение покаяния всему народу Израильскому».'
      cn: (使徒行传 13:16-24) 保羅就站起來，用手示意，說：「以色列人和一切敬畏　上帝的人，請聽。 這以色列民的　上帝揀選了我們的祖宗，當民在埃及地作客旅的時候抬舉他們，用大能的手領他們出來。 又在曠野容忍他們，約有四十年。 既滅了迦南地七族的人，就把那地分給他們為業； 此後他給他們設立士師，約有四百五十年，直到先知撒母耳的時候。 後來他們求一個王；　上帝就將便雅憫支派中基士的兒子掃羅，給他們作王四十年之久。 既廢了掃羅，就選立大衛作他們的王，又為他作見證說：『我尋得耶西的兒子大衛，他是合我心意的人，凡事要遵行我的旨意。』 從這人的後裔中，　上帝已經照著所應許的，為以色列立了一位　救主，就是耶穌； 在他沒有出來以先，約翰向以色列眾民宣講悔改的浸禮。
  - type: paragraph
    text:
      ru: 'Павел проповедует здесь в первый раз, и посмотри, с каким благоразумием: те места, где идет речь о Боге Слове, обходит и останавливается на местах, не упоминавших о семени Давида, как сам он говорит, когда пишет римлянам:«Я старался благовествовать не там, где уже было известно имя Христово»(Рим. 15, 20). Посмотри: и Варнава уступает Павлу, как и Иоанн уступает везде Петру. Хотя Варнава пользовался большим уважением, но он поступал так, имея в виду общую пользу.'
      cn: 保罗在这里第一次宣讲，你看他何等明智：他避开了提及上帝圣言之处，而驻足于那些没有提及大卫后裔之处，正如他自己写信给罗马人时所言：「我努力传扬福音，不是在基督的名已被知晓之处」(罗马书 15:20)。你看，巴拿巴也逊于保罗，正如约翰在各处都逊于彼得。尽管巴拿巴受到极大的尊敬，但他这样做是为了顾及整体的益处。
  - type: paragraph
    text:
      ru: «Бог народа сего избрал отцов наших». Напомнив о древних событиях, указывает, как и Стефан, на бывшие тогда великие благодеяния Божии.
      cn: 「这民族的上帝拣选了我们的父辈。」（这番话）回顾了古老的事件，指出，正如司提反一样，那时上帝所赐予的伟大恩惠。
  - type: paragraph
    text:
      ru: «Нашел Я мужа по сердцу Моему, Давида, сына Иессеева». Нужно заметить, что слова эти в книге Царств находятся не в том виде, как здесь; там только пророчески сказано Самуилом Саулу:«Господь найдет Себе мужа по сердцу Своему, и повелит ему Господь быть вождем народа Своего, так как ты не исполнил того, что было повелено тебе Господом»(1Цар. 13, 14). Из этих слов Павел составил такое положение:«нашел Я мужа по сердцу Моему…»Что же касается слов«мужи братия! если у вас есть слово наставления к народу, говорите»(ст. 15), – так они сказаны были потому, что у иудеев был обычай читать в субботу закон Моисеев и пророков и после чтения обращаться с речью к народу и объяснять прочитанное. Поэтому начальники синагоги и предлагают бывшим с Павлом говорить в синагоге.
      cn: 「我寻见了合我心意之人，就是大卫，耶西的儿子。」需指出的是，这些话语在撒母耳记上中并非以这里的形式出现；在那里，撒母耳只是以预言的形式对扫罗说：「上主将为自己寻得合祂心意之人，且上主将命他作祂百姓的领袖，因为你没有遵行上主所吩咐你的」（撒母耳记上 13:14）。保罗由此话语引申出以下论述：「我寻见了合我心意之人……」。至于「诸位弟兄！若你们有训诫之言可讲给百姓，请说」（第 15 节）——这些话之所以被说出，是因为犹太人有在安息日诵读摩西律法和先知书的习俗，并在诵读后向百姓发表言论并解释所读经文。因此，会堂的管事们便请保罗及其同伴在会堂中讲论。
  - type: paragraph
    text:
      ru: «Из его-то потомства Бог по обетованию воздвиг Израилю Спасителя Иисуса». Имя Давида было особенно любимым иудеями; поэтому говорится, что воцаряется царь от его племени.
      cn: 「上帝按着应许，从他的后裔中为以色列兴起了救主耶稣。」大卫的名字特别为犹太人所喜爱；因此有此一说，必有君王出自他的宗族作王。
  - type: paragraph
    text:
      ru: «Перед самым явлением Его Иоанн проповедовал». Под явлением разумеет воплощение.
      cn: «在祂显现之前，约翰就传道了。此处的显现，意指道成肉身。»
  - type: paragraph
    text:
      ru: 'Деян.13:25–37.При окончании же поприща своего, Иоанн говорил: «за кого почитаете вы меня? я не тот; но вот, идет за мною, у Которого я недостоин развязать обувь на ногах». Мужи братия, дети рода Авраамова, и боящиеся Бога между вами! вам послано слово спасения сего. Ибо жители Иерусалима и начальники их, не узнав Его и осудив, исполнили слова пророческие, читаемые каждую субботу. И, не найдя в Нем никакой вины, достойной смерти, просили Пилата убить Его. Когда же исполнили всё написанное о Нем, то, сняв с древа, положили Его во гроб. Но Бог воскресил Его из мертвых. Он в продолжение многих дней являлся тем, которые вышли с Ним из Галилеи в Иерусалим и которые ныне суть свидетели Его перед народом. И мы благовествуем вам, что обетование, данное отцам, Бог исполнил нам, детям их, воскресив Иисуса, как и во втором псалме написано: «Ты Сын Мой: Я ныне родил Тебя»(Пс. 2, 7).«А что воскресил Его из мертвых, так что Он уже не обратится в тление, о сем сказал так: «Я дам вам милости, обещанные Давиду, верно»(Ис. 55, 3).«Посему и в другом месте говорит: «не дашь Святому Твоему увидеть тление»(Пс. 15, 10).«Давид, в свое время послужив изволению Божию, почил, и приложился к отцам своим, и увидел тление. А Тот, Которого Бог воскресил, не увидел тления».'
      cn: (使徒行传 13:25-37) 約翰行盡了他的程途說：『你們以為我是誰？我不是他；只是看哪，有一個在我以後來的，我解他腳上的鞋帶也是不配的。』 諸位弟兄，亞伯拉罕的子孫和你們中間敬畏　上帝的人哪，這救世的道是傳給你們的。 耶路撒冷居住的人和他們的官長，因為不認識　基督，也不明白每安息日所讀眾先知的書，就把　基督定了死罪，正應了先知的話； 雖然查不出他有當死的罪來，還是求彼拉多殺他； 既應驗了經上指著他所記的一切話，就把他從木頭上取下來，放在墳墓裏。 　上帝卻叫他從死裏復活。 那從加利利同他上耶路撒冷的人多日看見他，這些人如今在民間是他的見證。 我們也報好信息給你們，就是那應許祖宗的話， 　上帝已經向我們這作兒女的應驗，叫耶穌復活了。正如詩篇第二篇上記著說：『你是我的　兒子，我今日生你。』 論到　上帝叫他從死裏復活，不再歸於朽壞，就這樣說：「我必將所應許大衛那可靠的恩典賜給你們。 又有一篇上說：『你必不叫你的　聖者見朽壞。』 大衛按　上帝的旨意服事了他那世代的人，就睡了，歸到他祖宗那裏，已見朽壞； 唯獨　上帝所復活的，他並未見朽壞。


        在他传道生涯的末了，约翰说：「你们认为我是谁？我不是那一位；但是看哪，有一位在我以后而来，我连给祂解鞋带都不配。」诸位弟兄，亚伯拉罕族的子孙，以及你们中间敬畏上帝的人！这救恩之道是传给你们的。因为耶路撒冷的居民和他们的首领，虽然不认识祂，却定祂的罪，成就了每安息日所诵读的先知的话语。既然在祂身上找不到任何当死的罪，就求彼拉多将祂处死。当他们成就了关于祂的一切记载时，就把祂从木头上取下来，安放在坟墓里。但上帝使祂从死人中复活了。祂在许多日子里向那些与祂一同从加利利上耶路撒冷的人显现，这些人如今在民众面前是祂的见证。我们也向你们传报福音，就是那赐给列祖的应许，上帝已向我们，他们的子孙，藉着使耶稣复活而成就了，正如在第二篇诗篇中所记载的：「祢是我的儿子：我今日生了祢。」（诗篇 2:7）「至于祂使祂从死人中复活，以致祂不再归于朽坏，论到此事，祂是这样说的：「我必将应许大卫的、可靠的恩典赐给你们。」（以赛亚书 55:3）「因此在另一处也说：「祢必不容祢的圣者见朽坏。」（诗篇 15:10）大卫在自己的时代服事了上帝的旨意，就安息了，归到他列祖那里，并且见了朽坏。但那位被上帝使祂复活的，却没有见朽坏。」'
  - type: paragraph
    text:
      ru: Иоанн не просто свидетельствует, но отрицает саму славу, которую все приписывали ему. Не одно и то же – отказываться от чести, когда никто не оказывает ее, и – тогда, когда ее предоставляют все.
      cn: 约翰不仅作见证，反而否认了众人归于他的荣耀本身。拒绝一项无人施予的尊荣，与在众人皆施予时拒绝尊荣，并非一回事。
  - type: paragraph
    text:
      ru: «Мужи братия, дети рода Авраамова». Указывает здесь на именитое происхождение иудеев.
      cn: 《诸位弟兄，亚伯拉罕的子孙们。》此处指出犹太人显赫的出身。
  - type: paragraph
    text:
      ru: '«Не узнав Его». Некоторым образом извиняет их: распяли, говорит, не зная, кто Он; потому что злодеяние совершено вследствие неведения.'
      cn: «不认识祂». 在某种程度上，这为他们开脱：他说，他们不认识祂是谁，便将祂钉了十字架；因为这恶行乃是出于无知而为的。
  - type: paragraph
    text:
      ru: «Не найдя в Нем никакой вины, достойной смерти, просили Пилата убить Его». Говорит, что смертная казнь была желательна им. Выводит на сцену Пилата, чтобы, с одной стороны, сделать общеизвестным страдание, с другой – подвергнуть себя большему обвинению как предавших Христа мужу иноплеменному. И не сказал «потребовали», но –"просили". Испросили, говорит, позволение на убиение, хотя Пилат как бы не желал этого. Об этом яснее говорит Петр:«Когда он полагал освободить Его»(Деян. 3, 13).
      cn: 「在祂身上查不出什么该死的罪来，却求彼拉多将祂处死。」话说，对他们而言，死刑是合他们心意的。将彼拉多带到舞台上，一方面是为了使这苦难昭告天下，另一方面则是为了让自己遭受更大的指控，作为将基督交付与异邦人之罪行。并且没有说「要求」，而是说——「请求」。话说，他们求得了杀害的许可，尽管彼拉多似乎并不情愿。关于这一点，彼得说得更清楚：「当彼拉多决意释放祂的时候」（使徒行传 3:13）。
  - type: paragraph
    text:
      ru: «Но Бог воскресил Его из мертвых». Да не смущает тебя то, что об Иисусе говорится, что Он воскрешен Богом, потому что если Иисус есть не иной Кто, как воплотившееся Слово, а Слово, по свидетельству Писания, Христос, Божия Сила и Божия Премудрость, есть сила Отца, которой Он совершает все, то следует разуметь, что Иисус Сам воскресил Себя. И если говорится, что Он воскрешен Отцом, так говорится в том смысле, что Отцу, как такому началу и такой причине, которые – вне времени, приписывается все. Да и Сам Иисус говорит:«Разрушьте храм сей, и Я в три дня воздвигну его»(Ин. 2, 19).
      cn: 「然而上帝使祂从死里复活。」愿你不要困惑，因为提及耶稣是由上帝使祂复活；因为如果耶稣并非旁人，乃是道成肉身的圣言，而圣言，按着圣经的见证，即是基督，上帝的德能与上帝的智慧，是父的德能，父籍此成就万有，那么就应当明白，是耶稣亲自使自己复活的。并且如果说祂是由父使祂复活，如此说乃是这个意思：一切都归因于父，因为父是超越时间的那样的本原和那样的肇因。再者，耶稣自己也说：「你们拆毁这殿，我三日内要再建立起来。」(约翰福音 2:19)
  - type: paragraph
    text:
      ru: «Которые вышли с Ним из Галилеи в Иерусалим и которые ныне суть свидетели Его перед народом». Чем они никак не могли бы быть, если бы не подкрепляла их сила Божия.
      cn: '「那些与祂一同从加利利到耶路撒冷，并且如今在民众面前是祂见证人的人。」

        如果不是上帝的力量坚固他们，他们绝不可能如此。'
  - type: paragraph
    text:
      ru: «Нам, детям их, воскресив Иисуса». Имя «Иисус» братья богоубийц принимают за имя человека. Сказав выше, что Слово положено было во гробе, Павел, – чтобы кто не подумал, что он назвал Слово бесплотным, – снова называет Его Иисусом и ни на один момент, по соединении двух естеств, не допускает в воплотившемся Слове разделения.
      cn: 「对我们这些他们的子孙，祂使耶稣复活了。」弑神者的弟兄们将「耶稣」这个名字认作是一个人的名字。上文提到圣言被安放在墓中，保罗——为免有人以为他称圣言为无形体的——再次称祂为耶稣，并且在两性结合之后，丝毫没有容许道成肉身的圣言中有任何分裂。
  - type: paragraph
    text:
      ru: '«Ты Сын Мой: Я ныне родил Тебя». Слова эти понимай по отношению к вочеловечению Христа, бывшему во времени, так как выражения «сегодня и завтра» заключают в себе значение дней. А от Отца Сын рождается, как признают это даже еретики, безвременно.'
      cn: 「祢是我的儿子，我今日生了祢。」这些话语，你们应当理解为关乎基督的道成肉身，后者是在时间中发生的，因为「今日与明日」这样的措辞包含着日子的意义。然而，圣子是从圣父而生，即使是异端也承认这一点，是超越时间的。
  - type: paragraph
    text:
      ru: «Не дашь Святому Твоему увидеть тление». Тело Господа и Спасителя Христа называется нетленным и бессмертным, потому что ясно, что оно обладало свойством нетления со времени самого воплощения, так как Христос был безгрешен.
      cn: «不让祢的圣者看见朽坏». 主和救主基督的身体被称为不朽不灭的，因为显而易见，它自道成肉身的那一刻起就拥有不朽坏的特质，因为基督是无罪的。
  - type: paragraph
    text:
      ru: «Тот, Которого Бог воскресил, не увидел тления». Тот, Кого воздвиг Бог, не видел тления, но место гроба соделал местом нетления, потому что воскресший собственной силой Христос поистине воссиял как начальник нетления, дабы и мы восстали из гробов и вышли«в сретение Господу»(1Фес. 4, 17), когда, в день ожидаемого воскресения, Он придет во второй раз со славой на облаках.
      cn: 「那位被上帝复活的，没有见到朽坏。」那位被上帝兴起的，没有见到朽坏，却将坟墓之处变为不朽之处，因为那凭着自身能力复活的基督，确确实实地光芒四射，成为不朽的元首，好使我们也能从坟墓中复起，并出来「迎接上主」(帖撒罗尼迦前书 4:17)，当在那被期盼的复活之日，祂带着荣耀驾云第二次降临之时。
  - type: paragraph
    text:
      ru: 'Деян.13:38–41.Итак, да будет известно вам, мужи братия, что ради Него возвещается вам прощение грехов; и во всем, в чем вы не могли оправдаться законом Моисеевым, оправдывается Им всякий верующий. Берегитесь же, чтобы не пришло на вас сказанное у пророков: «Смотрите, презрители, подивитесь и исчезните; ибо Я делаю дело во дни ваши, дело, которому не поверили бы вы, если бы кто рассказывал вам»(Авв. 1, 5).'
      cn: (使徒行传 13:38-41) 所以，諸位弟兄，你們當曉得，恕罪的道是由這人傳給你們的。 你們靠摩西的律法，在一切不得稱義的事上信靠這人，就都得稱義了。 所以，你們務要小心，免得先知書上所說的臨到你們。 主說：『你們這輕慢的人要觀看，要驚奇，要滅亡；因為在你們的時候，我行一件事，雖有人告訴你們，你們總是不信。』」

        所以，弟兄们，愿你们须知，借着祂，罪的赦免向你们传扬；凡在一切你们不能靠摩西的律法得称义的事上，一切相信的人都借着祂得称义。你们务要小心，免得先知书上所说的话临到你们：

        「你们要看，轻蔑的人啊，你们要惊奇并且消逝；因为在你们的日子，我行一事，这事即便有人告诉你们，你们也绝不会相信。」

        (哈巴谷书 1:5)'
  - type: paragraph
    text:
      ru: Смотри, как не договаривает о сущности дела, об обетованном семени. Не привел свидетельства, на которое они могли бы полагаться в том, что отпущение грехов совершается через Иисуса, а это не подлежало сомнению. Пророк Аввакум восклицает:«Смотрите, презрители, подивитесь и исчезните», – а Бог отвечает людям беззакония, что им угрожают несчастия и теперь, и в будущем. И великого удивления достойно было то, как Израиль, зачисленный в сонм детей Божиих и наименованный первородным, – тот Израиль, ради которого погиб Египет, – предается вавилонянам, предается не только мечу их, но даже и плену, и рабству, и всевозможным страданиям.
      cn: 看啊，他未能充分说明事情的要旨，关于那所应许的后裔。他没有提出见证，让他们可以依凭罪的赦免是借着耶稣得以成全的，而这本是无可置疑的。先知哈巴谷高呼：「看啊，轻蔑的人，你们要惊奇，并要消逝！」——而上帝回应不法之人，说灾祸将临到他们，无论今世，还是来世。尤其令人称奇的是，以色列，被归入上帝儿女的群体，并被称作是头生的，——那以色列，为着他，埃及灭亡了，——却被交付给巴比伦人，被交付不仅是他们的刀剑，而且是交付给掳掠、为奴，以及各式各样的苦难。
  - type: paragraph
    text:
      ru: «Не поверили бы вы, если бы кто рассказывал». Дело столь величественно, что покажется даже невероятным, если кто сообщит вам о нем.
      cn: 「即使有人告诉你们，你们也不会相信。」这事如此庄严宏伟，以至于若有人将它告知你们，它甚至会显得难以置信。
  - type: paragraph
    text:
      ru: 'Деян.13:42–48.При выходе их из Иудейской синагоги язычники просили их говорить о том же в следующую субботу. Когда же собрание было распущено, то многие Иудеи и чтители Бога, обращенные из язычников, последовали за Павлом и Варнавою, которые, беседуя с ними, убеждали их пребывать в благодати Божией. В следующую субботу почти весь город собрался слушать слово Божие. Но Иудеи, увидев народ, исполнились зависти и, противореча и злословя, сопротивлялись тому, что говорил Павел. Тогда Павел и Варнава с дерзновением сказали: вам первым надлежало быть проповедану слову Божию, но как вы отвергаете его и сами себя делаете недостойными вечной жизни, то вот, мы обращаемся к язычникам. Ибо так заповедал нам Господь: «Я положил Тебя во свет язычникам, чтобы Ты был во спасение до края земли»(Ис. 49, 6).«Язычники, слыша это, радовались и прославляли слово Господне, и уверовали все, которые были предуставлены к вечной жизни».'
      cn: (使徒行传 13:42-48) 當猶太人出會堂的時候，外邦人請他們到下安息日，再講這些話給他們聽。 散會以後，猶太人和敬虔進猶太教的人多有跟從保羅、巴拿巴的。二人對他們講道，勸他們務要恆久在　上帝的恩中。 到下安息日，合城的人幾乎都來聚集，要聽　上帝的道。 但猶太人看見人這樣多，就滿心嫉妒，硬駁保羅所說的話，並且褻瀆。 保羅和巴拿巴放膽說：「　上帝的道先講給你們原是應當的；只因你們棄絕這道，斷定自己不配得永生，看哪，我們就轉向外邦人去。 因為　主曾這樣吩咐我們說：『我已經立你作外邦人的光，叫你施行救恩，直到地極。』」 外邦人聽見這話，就歡喜了，讚美　主的道；凡預定得永生的人都信了。
  - type: paragraph
    text:
      ru: Ты видел мудрую сообразительность Павла. Чтобы привязать и расположить к себе язычников, а также чтобы сообщением им всего вдруг не рассеять их внимания, он высказал сначала несколько намеков и не разрешил их и этим вызвал в язычниках желание послушать его в другой раз. Сказал, что возвещается оставление грехов, а как совершится это оставление, не объяснил. Не крестил же их тотчас, потому что это было неблаговременно.
      cn: 你看到了保罗智慧的机敏。为了吸引并争取外邦人，同时也为了不因突然告知他们所有一切而分散他们的注意力，他先是给出了一些暗示，却没有解释清楚，这样做就激发了外邦人下次再听他宣讲的愿望。他说，罪孽的赦免已被宣告，至于这赦免将如何成就，他并未解释。他也没有立刻为他们施洗，因为那是不合时宜的。
  - type: paragraph
    text:
      ru: «Иудеи, увидев народ, исполнились зависти». Столь велика нетерпимость зависти! Многие совершенно изнемогают и умирают от того, что видят других в чести. А такого рода люди способны противиться не только человеку, но и воле Божией.
      cn: '«犹太人看到众人，就充满了嫉妒»。

        嫉妒的这种不容忍是何等巨大！许多人因为看到他人受到尊荣，就完全衰弱不堪，甚至因此而死。而这类人不仅能反抗人，而且还能反抗上帝的旨意。'
  - type: paragraph
    text:
      ru: «Как вы отвергаете его». Чтобы слова«сами себя делаете недостойными вечной жизни»не истолковал кто-нибудь в пользу их смирения, Павел сказал сначала«как вы отвергаете его». Потом прибавил«обращаемся к язычникам». Не говорит «оставляем вас», но выражается так, что допускает возможность своего возвращения в Антиохию.
      cn: «既然你们弃绝他»。为免有人将「你们自己使自己不配得永生」这些话误解为是出于他们的谦卑，保罗便先说了「既然你们弃绝他」。接着又说：「我们转向外邦人。」他没有说「我们离开你们」，而是这样表达，以至于仍容许他返回安提阿的可能性。
  - type: paragraph
    text:
      ru: «Я положил Тебя во свет язычникам»,то есть в познание язычниками спасения, и не только язычниками, но и всеми.
      cn: «我已立祢作外邦人的光》，即是说，是为了使外邦人认识救恩，并且不单是外邦人，更是所有的人。
  - type: paragraph
    text:
      ru: «Которые были предуставлены к вечной жизни». Предуставлены не по насилию, потому что говорится, что«кого Он предузнал, тем и предопределил»(Рим. 8, 29). Итак, род Господень, в сущности, есть весь вообще род человеческий, но Израиль есть особенно близкий род Его. И так как Он пришел к Израилю, а прочие народы просветил через апостолов, то и говорится:«Бог по обетованию воздвиг Израилю Спасителя Иисуса»(Деян. 13, 23), а язычники через Него озарены просвещением (см.Лк. 2, 32) и всем даровано спасение, потому что это именно означается словами«до края земли»,и положен конец договорам, сделанным отцам их.
      cn: 「那些被预定归向永生的人」。被预定并非出于强迫，因为经上说：「他预先所知道的，就预先命定」（罗马书 8:29）。因此，上主之族本质上乃是全人类，但以色列是祂特别亲近的民族。又因为祂来到以色列，并借由使徒们光照了其他民族，所以经上说：「上帝照着应许，为以色列兴起了一位救主耶稣」（使徒行传 13:23），而外邦人则借由祂得到光照（参见路加福音 2:32），并将救恩赐予了所有人，因为这正是「直到地极」这些话所蕴含的意义，并废止了与他们祖先所立的盟约。
  - type: paragraph
    text:
      ru: «Уверовали все, которые были предуставлены к вечной жизни». Хотя они предназначены или предопределены были в жизнь вечную по предведению, но уверовали по собственному желанию, по собственной воле. Предведение же Божие не уничтожает свободы нашей воли. До сложения мира предназначенный, по предведению Божиему, быть избранным сосудом, Павел стал им не вдруг по рождении и не в юности, но спустя довольно времени, когда у него составилось понятие о своем значении и своих доблестях.
      cn: 「所有被预定得享永生的人，都相信了。」虽然他们是因着预知被预定或预先注定得享永生，但他们是凭着自己的意愿，凭着自己的自由意志而相信的。然而，上帝的预知并不消除我们自由意志的自由。保罗在创世以前，按照上帝的预知，被预定成为蒙拣选的器皿；但他并非一出生或在青年时期就立刻成为了他，而是在相当长的一段时间之后，当他形成了关于自己的意义和自己的美德的概念时。
  - type: paragraph
    text:
      ru: Деян.13:49–52.И слово Господне распространялось по всей стране. Но Иудеи, подстрекнув набожных и почетных женщин и первых в городе людей, воздвигли гонение на Павла и Варнаву и изгнали их из своих пределов. Они же, отрясши на них прах от ног своих, пошли в Иконию. А ученики исполнялись радости и Духа Святаго.
      cn: (使徒行传 13:49-52) 於是　主的道傳遍了那一帶地方。 但猶太人挑唆虔敬、尊貴的婦女和城內有名望的人，逼迫保羅、巴拿巴，將他們趕出境外。 二人對著眾人抖下腳上的塵土，就往以哥念去了。 門徒滿心喜樂，又被　聖靈充滿。
  - type: paragraph
    text:
      ru: Иудеи не ограничились чувством зависти, но прибегли и к действиям. Под «набожными женщинами» разумеет не верующих женщин, но иудейских или эллинских, а под «почетными» – богатых. Видишь, на какой гнусный поступок склонили они женщин? Стараются преградить людям путь ко спасению при содействии женщин в подражание древнему обольстителю – диаволу, который орудием для преграждения людям входа в рай избрал Еву.
      cn: 犹太人不仅限于嫉妒之情，而且诉诸于行动。「虔诚的妇女」并非指信主的妇女，而是指犹太人或希腊人；而「尊贵的」是指富有的。你瞧，他们唆使妇女做出了何等可憎的行径？他们试图借助妇女的力量，阻挡人们走向救恩的道路，效法那古老的诱惑者——魔鬼，它曾选择夏娃作为工具，阻碍人们进入乐园。
  - type: paragraph
    text:
      ru: «Они же, отрясши на них прах от ног своих». Не без причины поступили так, но потому, что были изгнаны иудеями.
      cn: «他们就跺下脚上的尘土，以示对抗»。他们并非没有原因如此行，而是因为被犹太人驱逐了。
  - type: paragraph
    text:
      ru: '«А ученики исполнялись радости и Духа Святаго». Учителей гнали, а они радовались: такова сила Евангелия. Страдание учителя не отнимает дерзновения у ученика, но делает его более бодрым.'
      cn: 「而门徒充满喜乐和圣灵。」(使徒行传 13:52) 教师们遭受逼迫，而他们喜乐着：这就是福音的力量。教师的苦难不夺去门徒的胆量，反使他更加振奋。
- type: heading1
  text:
    ru: Глава четырнадцатая
    cn: 第十四章
  children:
  - type: paragraph
    text:
      ru: Деян.14:1–3.В Иконии они вошли вместе в Иудейскую синагогу и говорили так, что уверовало великое множество Иудеев и Еллинов.
      cn: (使徒行传 14:1-3) 二人在以哥念同進猶太人的會堂，在那裏講的，叫猶太人和希臘人信的很多。 但那不信的猶太人聳動外邦人，叫他們心裏惱恨弟兄。 於是二人在那裏住了多日，倚靠　主放膽講道，　主藉他們的手施行神蹟奇事，證明他的恩道。
  - type: paragraph
    text:
      ru: «А неверующие Иудеи возбудили и раздражили против братьев сердца язычников. Впрочем они пробыли здесь довольно времени, смело действуя о Господе, Который, во свидетельство слову благодати Своей, творил руками их знамения и чудеса.
      cn: 然而，不信的犹太人煽动并激怒了外邦人的心，使其反对弟兄们。虽然如此，他们在这里居住了相当长的时间，在主里大胆地行事；主为祂恩典的话语作证，藉着他们的手行神迹奇事。
  - type: paragraph
    text:
      ru: Не сделались боязливее, но опять«вошли вместе в Иудейскую синагогу». С речью обращались они обыкновенно как к иудеям, так и к эллинам.
      cn: 他们没有变得更加畏惧，却又「一同进入了犹太会堂」。他们通常向犹太人以及希腊人发表演说。
  - type: paragraph
    text:
      ru: «Неверующие Иудеи возбудили и раздражили против братьев сердца язычников». Возбудили и язычников, не довольствуясь тем, что сами восставали. Но апостолы не вышли из синагоги, так как их не гнали, а только состязались с ними.
      cn: «不信的犹太人激动并激怒了外邦人的心，使他们反对弟兄们。» 他们不仅自己起来反对，还不满足于此，又激动了外邦人。但使徒们没有离开会堂，因为他们没有被驱逐，而只是与他们辩论。
  - type: paragraph
    text:
      ru: «Впрочем они пробыли здесь довольно времени, смело действуя». Дерзновение происходило от преданности апостолов делу проповеди. А то, что слушавшие их уверовали, было следствием чудес, но этому несколько способствовало и самое дерзновение апостолов.
      cn: 然而他们在此地停留了相当长的时间，大胆地作为。这种坦然无惧源于使徒们对宣讲事工的委身。至于那些听他们宣讲而信的人，是神迹的结果，但使徒们本身的坦然无惧也对此有所促进。
  - type: paragraph
    text:
      ru: 'Деян.14:4–7.Между тем народ в городе разделился: и одни были на стороне Иудеев, а другие на стороне Апостолов. Когда же язычники и Иудеи со своими начальниками устремились чтобы посрамить и побить их камнями, они, узнав о сем, удалились в Ликаонские города Листру и Дервию и в окрестности их, и там благовествовали.'
      cn: (使徒行传 14:4-7) 城裏的眾人就分了黨，有附從猶太人的，有附從使徒的。 那時，外邦人和猶太人，並他們的官長，一齊擁上來，要凌辱使徒，用石頭打他們。 使徒知道了，就逃往呂高尼的路司得、特庇兩個城和周圍地方去， 在那裏傳福音。

        城中的众人分裂了：有的附从犹太人，有的附从使徒。当外邦人同犹太人带着他们的官长，企图羞辱他们并用石头打死他们的时候，他们得知这事，就退到吕高尼的城路司得和特庇，以及周围的乡镇，并在那里传扬福音。'
  - type: paragraph
    text:
      ru: Случилось то, о чем говорил Христос:«Не мните, что Я пришел принести мир на землю; не мир пришел Я принести, но меч»(Мф. 10, 34).
      cn: 基督所说的应验了：「你们不要以为我来，是给地上带来和平；我来不是带来和平，而是带来刀剑。」(马太福音 10:34)
  - type: paragraph
    text:
      ru: «Узнав о сем, удалились». Ничего нет странного в том, что святые бегут от людей, намеревающихся учинить им козни, и считают за лучшее уклониться от брани, которую они считали, согласно приведенному свидетельству, недозволенной им.
      cn: 「得知这事，他们便退去了。」圣徒们避开那些意图设计陷害他们的人，并认为最好是避开争战——这争战，根据所引证的见证，他们认为是不被允许他们参与的。此举实无任何稀奇之处。
  - type: paragraph
    text:
      ru: 'Деян.14:8–12.В Листре некоторый муж, не владевший ногами, сидел, будучи хром от чрева матери своей, и никогда не ходил. Он слушал говорившего Павла, который, взглянув на него и увидев, что он имеет веру для получения исцеления, сказал громким голосом: тебе говорю во имя Господа Иисуса Христа: стань на ноги твои прямо. И он тотчас вскочил и стал ходить. Народ же, увидев, что сделал Павел, возвысил свой голос, говоря по-Ликаонски: боги в образе человеческом сошли к нам. И называли Варнаву Зевсом, а Павла Ермием, потому что он начальствовал в слове.'
      cn: (使徒行传 14:8-12) 路司得城裏坐著一個兩腳無力的人，生來是瘸腿的，從來沒有走過。 他聽保羅講道，保羅定睛看他，見他有信心，可得痊癒， 就大聲說：「你起來，兩腳站直。」那人就跳起來，而且行走。 百姓看見保羅所作的事，就用呂高尼的話大聲說：「有眾神藉著人形降臨在我們中間了。」 於是稱巴拿巴為朱庇特，稱保羅為墨丘利，因為他說話領首。
  - type: paragraph
    text:
      ru: Для чего Павел«сказал громким голосом!»Чтобы уверовал народ. Что же касается слов«взглянув на него и увидев, что он имеет веру для получения исцеления», так словами этими, кажется мне, выражается мысль, что Павел проник в душу его, потому что внимать тому, что говорил Павел, было возможно лишь для философской души.
      cn: 保罗「大声说！」是为了什么呢？是为了让百姓相信。至于「注视着他，看出他有信心可以得医治」这句话，在我看来，它表达了这样一个意思：保罗洞察了他的灵魂，因为只有具有哲学性灵魂的人，才有可能领会保罗所说的话。
  - type: paragraph
    text:
      ru: «И он тотчас вскочил и стал ходить». Что хромой вскочил, – это доказательство совершенного исцеления.
      cn: 「他立刻跳起来，开始行走。」瘸子跳起来，这是他彻底痊愈的证据。
  - type: paragraph
    text:
      ru: «Народ же, увидев, что сделал Павел». Замечай, с одной стороны, простодушие язычников, с другой – коварство иудеев. Первые чествовали апостолов как богов, последние преследовали их как разрушителей порядка.
      cn: 「百姓看见保罗所行的事。」注意，一方面是外邦人的纯朴，另一方面则是犹太人的诡诈。前者尊崇使徒们如同神明，后者却迫害他们如同秩序的破坏者。
  - type: paragraph
    text:
      ru: «И называли Варнаву Зевсом, а Павла Ермием». Видишь, как у эллинов было в обычае делать богами людей. Запомни происхождение идолослужения, чтобы дать ответ, когда будут спрашивать, откуда идолослужение. Таким же точно образом эллины из людей делали богами и апостолов. И диавол вначале подобным же образом старался ввести в мир это нечестие, говоря:«Будете как боги»(Быт. 3, 5). И так как тогда ему это не удалось, то с тех пор он домогается этого и доселе, всюду стараясь вводить многобожие.
      cn: 「又称巴拿巴为宙斯，称保罗为赫尔墨斯。」祢看，希腊人素来有将人奉为神的习俗。要记住偶像崇拜的起源，以便当人们询问偶像崇拜从何而来时，能够给出答案。希腊人也正是以同样的方式，将使徒们也奉为神。魔鬼最初也以同样的方式，试图将这不虔敬之事引入世界，它说：「你们便如神」（创世记 3:5）。既然那时它未能成功，那么从那时起直到如今，它都在极力图谋此事，处处试图引入多神论。
  - type: paragraph
    text:
      ru: 'Деян.14:13–18.Жрец же идола Зевса, находившегося перед их городом, приведя к воротам волов и принеся венки, хотел вместе с народом совершить жертвоприношение. НоАпостолы Варнаваи Павел, услышав о сем, разодрали свои одежды и, бросившись в народ, громогласно говорили: мужи! что вы это делаете? И мы – подобные вам человеки, и благовествуем вам, чтобы вы обратились от сих ложных к Богу живому, Который сотворил небо и землю, и море, и все, что в них; Который в прошедших родах попустил всем народам ходить своими путями, хотя и не переставал свидетельствовать о Себе благодеяниями, подавая нам с неба дожди и времена плодоносные и исполняя пищею и веселием сердца наши. И, говоря сие, они едва убедили народ не приносить им жертвы и идти каждому домой. Между тем, как они, оставаясь там, учили.'
      cn: (使徒行传 14:13-18) 有城外朱庇特的祭司牽著牛，拿著花圈，來到門前，要同百姓向使徒獻祭。 巴拿巴、保羅二使徒聽見，就撕開衣服，跑進百姓中間，喊著說： 「諸君，為甚麼作這些事呢？我們也是人，性情和你們一樣。我們傳福音給你們，是叫你們轉離這些虛妄，歸向那創造天、地、海、和其中一切的永生　上帝。 在從前的世代，他容忍列國各行其道； 然而為自己未嘗不顯出證據來，就如常施恩惠，從天降雨，賞賜豐年，叫我們飲食飽足，滿心喜樂。」 二人說了這些話，僅僅的攔住百姓不獻祭與他們。
  - type: paragraph
    text:
      ru: 'Смотри: всюду они чисты и чужды тщеславия; не только не домогаются славы, но даже отклоняют ее от себя, когда воздают им прославление. Так и Петр говорил:«Что смотрите на нас, как будто бы мы своею силою или благочестием сделали то, что он ходит»(Деян. 3, 12)? И эти апостолы говорят то же самое, но поступают с некоторой горячностью:«разодрали свои одежды и, бросившись в народ, громогласно говорили: мужи! что вы это делаете? И мы – подобные вам человеки». Мы – люди, говорят, но мы – выше идолов, потому что они – мертвы. Видишь, каким обыкновенным явлением было у эллинов делать из людей богов? Да и в их книгах, где описана их древняя история, ты найдешь, что Зевс, будучи человеком, сделал себя богом, говоря, что он – бог. Точно так же и многие из римских и македонских царей назывались божественными. Поэтому нет никакого основания не верить древним сказаниям о том, что некоторые из народов были обольщены и назвали некоторых из людей богами, как и эти люди обольстились Варнавой и Павлом. И Симона волхва жители Самарии называли великой силой божией.'
      cn: 看啊：随处可见，他们纯洁无私，没有虚荣心；他们不仅不追求荣耀，甚至当人们向他们致以赞美时，他们也会推开它。彼得也曾说：「为什么定睛看我们，以为我们是凭自己的能力或虔诚使他行走呢？」(使徒行传 3:12)？这些使徒也说同样的话，但他们的举动带着某种激昂：「他们就撕裂衣服，跳入众人中间，大声喊着说：『诸位！你们为什么做这事呢？我们也是和你们一样性情的人』。」他们说，我们是人，但我们高于偶像，因为偶像是死的。你看，在希腊人中，将人奉为神是多么普遍的现象？况且在他们的书中，记载着他们的古老历史，你会发现宙斯本是人，却自称是神，把自己变成了神。同样地，许多罗马和马其顿的君王也被称为神圣的。因此，没有理由不相信那些古老的传说，即有些民族被迷惑，将一些人称为神，正如这些人也被巴拿巴和保罗所迷惑一样。撒玛利亚的居民也称行邪术的西门为上帝的伟大能力。
  - type: paragraph
    text:
      ru: «Разодрали свои одежды». У иудеев был обычай разрывать на себе одежды, когда они слышали богохульные слова. Так, когда Христос говорил, что Он – Сын Божий, Каиафа разорвал на себе одежду, говоря, что Христос произнес хулу на Бога. А так как то, что случилось теперь, было некоторым образом богохульством, то, следуя иудейскому обычаю, и апостолы сделали то же самое. Отвергнут же этот обычай потому, что он не был постановлением закона. И Господь говорил иудеям, когда они поступали подобным образом:«Обратитесь ко Мне всем сердцем своим в посте, плаче и рыдании. Раздирайте сердца ваши, а не одежды ваши»(Иоил. 2, 12–13).
      cn: '「他们撕裂了自己的衣服」


        犹太人有一个习俗，当他们听到亵渎上帝之言时，就会撕裂自己的衣服。因此，当基督说祂是上帝之子时，该亚法就撕裂了自己的衣服，说基督说出了亵渎上帝的话。而由于现在所发生之事在某种程度上也是亵渎上帝，所以，使徒们也依循犹太人的习俗，照样行了。然而，这个习俗被舍弃了，因为它并非律法的规定。当犹太人以同样方式行事时，上主曾对他们说：「你们当以全心归向我，以禁食、哭泣和悲号。撕裂你们的心，而非你们的衣服」（约珥书 2:12-13）。'
  - type: paragraph
    text:
      ru: «Который в прошедших родах попустил всем народам ходить своими путями. Попустил», сказано, но почему попустил, апостол еще не говорит, так как останавливается преимущественно на том, что настоятельно было необходимо, и нигде еще не упоминает имени Христова.
      cn: 指祂在过去的世代中，任凭所有民族各行其道。「任凭」，经文如此说，但为何任凭，使徒尚未说明，因为他主要集中于那迫切必需的，并且尚未在任何地方提及基督的名。
  - type: paragraph
    text:
      ru: «Хотя и не переставал свидетельствовать о Себе». Так говорит, потому что в каждом поколении совершал такие дела, которые приводили людей к правде. Не насилуя свободной воли, Господь позволял всем людям ходить по собственному их усмотрению, но Сам постоянно совершал такие дела, из которых они, как существа разумные, могли уразумевать Создателя. Свидетелями Его апостол называет даже ежегодные дожди.
      cn: 「虽未曾止息为自己作见证。」如此说，是因为在每一个世代，祂都施行了这样的作为，引领人们归向真理。不强迫人的自由意志，上主允许所有人按着他们自己的意愿行事，但祂自己却不断地施行这样的作为，借此，他们作为有理性的受造物，便能认出造物主。使徒甚至将每年的降雨称为祂的见证。
  - type: paragraph
    text:
      ru: 'Деян.14:19–28.Из Антиохии и Иконии пришли некоторые Иудеи и, когда Апостолы смело проповедовали, убедили народ отстать от них, говоря: они не говорят ничего истинного, а все лгут. И, возбудив народ, побили Павла камнями и вытащили за город, почитая его умершим. Когда же ученики собрались около него, он встал и пошел в город, а на другой день удалился с Варнавою в Дервию. Проповедав Евангелие сему городу и приобретя довольно учеников, они обратно проходили Листру, Иконию и Антиохию, утверждая души учеников, увещевая пребывать в вере и поучая, что многими скорбями надлежит нам войти в Царствие Божие. Рукоположив же им пресвитеров к каждой церкви, они помолились с постом и предали их Господу, в Которого уверовали. Потом, пройдя через Писидию, пришли в Памфилию. И, проповедав слово Господне в Пергии, сошли в Атталию; а оттуда отплыли в Антиохию, откуда были преданы благодати Божией на дело, которое и исполнили. Прибыв туда и собравцерковь, они рассказали всё, что сотворил Бог с ними и как Он отверз дверь веры язычникам. И пребывали там немалое время с учениками.'
      cn: (使徒行传 14:19-28) 但有些猶太人從安提阿和以哥念來，挑唆百姓，就用石頭打保羅，以為他是死了，便拖到城外。 門徒正圍著他，他就起來，走進城去。第二天，同巴拿巴往特庇去， 對那城裏的人傳了福音，並且教導了許多人，就回路司得、以哥念、安提阿去， 堅固門徒的心，勸他們恆守所信的道；又說：「我們進入　上帝的國，必須經歷許多患難。」 二人在各教會中選立了長老，又禁食禱告，就把他們交託所信的　主。 二人經過彼西底，來到旁非利亞。 他們在別加傳了道，就下亞大利去； 從那裏坐船，往安提阿去。當初，他們被眾人所託、蒙　上帝之恩，要辦現在所完之工，就是在這地方。 到了那裏，聚集了教會，就述說　上帝藉他們所行的一切事，並　上帝怎樣為外邦人開了信道的門。 二人就在那裏同門徒住了多日。


        从安提阿和以哥念来了一些犹太人，当使徒们放胆宣讲的时候，他们说服了众人离开他们，说：「他们不讲任何真理，而尽说谎话。」 并且，煽动了众人，用石头打保罗，把他拖到城外，以为他死了。可是，当门徒们聚集在他身边的时候，他就站起来，进了城；第二天，他与巴拿巴一同去了特庇。向那城传了福音，并得了许多门徒后，他们又回到路司得、以哥念和安提阿，坚固门徒的灵魂，劝勉他们恒久住在信仰中，又教导说，我们必须经过许多苦难才能进入上帝的国。他们在各教会为他们按立了长老，并且禁食祷告，将他们交托给他们所信的上主。随后，他们经过彼西底，来到旁非利亚。在别加宣讲了上主的话，下到亚大利；从那里乘船往安提阿，他们就是从这地方被交付于上帝的恩典，去完成他们所完成的工的。他们到了那里，聚集了教会，就述说上帝与他们同工所做的一切事，以及祂如何为外邦人打开了信仰的门。并且在那里与门徒们一同住了不短的时日。'
  - type: paragraph
    text:
      ru: 'Посмотри на бешенство иудеев: проникли в народ, который оказал такую честь апостолам, и"убедили"его побить Павла камнями. А вытащили его вон из города, потому что боялись. Да притом они старались лишь подорвать проповедь. Но видишь ли ты пламенную ревность Павла? После того как его выбросили вон из города, он снова пришел в тот же самый город, чтобы показать, что если где, в подобных случаях, он и удалялся, так потому, что должен был сеять слово Божие и что разжигать гнев не следовало…'
      cn: 且看犹太人之狂怒：他们渗透到曾给予使徒们如此尊荣的人民中间，并「说服」他们用石头掷击保罗。他们把他拖出城外，因为惧怕。再者，他们所做的只是设法破坏宣讲。然而，你可曾看到保罗那炽热的热忱？他被逐出城外后，他又回到那同一个城市，为要显明，若在类似的情况下他有所退避，乃是因为他理当播撒上帝的圣言，且不应煽动怒火……
  - type: paragraph
    text:
      ru: '«Многими скорбями надлежит нам войти в Царствие Божие». Смотри: без труда и скорбей никто не оправдывается. Поэтому врата, ведущие в Царство Небесное, и Господь назвал узкими и тесными (см.Мф. 7, 13), то есть полными стеснений. Но в Царство Небесное вводит не всякая, какая только встретится, теснота или скорбь, но скорбь из-за веры в Бога.'
      cn: 「我们必须经历许多苦难才能进入上帝的国度。」看哪：若没有劳苦和苦难，无人能蒙称义。因此，通往天国的门，主称之为狭窄和困苦的（马太福音 7:13），也就是说，充满了困苦。但并非任何偶然遇到的困苦或苦难都能引导人进入天国，而是因着信仰上帝而来的苦难。
  - type: paragraph
    text:
      ru: «Рукоположив… им пресвитеров… они помолились с постом». Научали поститься даже во время испытаний; постом сопровождались и хиротонии. Но в Кипре не поставили пресвитеров, тоже и в Самарии, она находилась близ Иерусалима и апостолов, да и в самой Антиохии слово Божие укреплялось. А здесь новоуверовавшие, и в особенности те из язычников, которым необходимо было назидание, нуждались в большой поддержке. Но обрати внимание на то, что Павел и Варнава имели сан епископский, потому что рукополагали не только диаконов, но и пресвитеров.
      cn: 「按立……为他们设立司祭……他们禁食祷告。」他们教导人们即使在试炼期间也要禁食；圣职授任礼亦伴随着禁食。然而，在塞浦路斯，他们并未设立司祭；在撒马利亚也未设立，那地方靠近耶路撒冷和使徒们；甚至在安提阿本身，上帝的圣言也已得到巩固。而在这里，新信者，尤其是那些来自异教徒，需要教导的人，则需要巨大的支持。但请注意，保罗和巴拿巴拥有主教圣品，因为他们不仅按立了辅祭，也按立了司祭。
  - type: paragraph
    text:
      ru: '«Прибыв туда»(в Антиохию)«и собравцерковь, они рассказали всё, что сотворил Бог с ними». Не сказал апостол: «что сотворили они», но –«что сотворил Бог с ними.'
      cn: «抵达那里（安提阿），并召集了教会，他们讲述了上帝在他们身上所行的一切。» 使徒并没有说：「他们所行的」，而是——「上帝在他们身上所行的一切」。
  - type: paragraph
    text:
      ru: «Бог… отверз дверь веры язычникам». Отверзением двери называет учение, которое приняли через апостолов язычники.
      cn: «上帝……打开了信德之门给外邦人。» 『打开这门』指的是外邦人通过使徒们所领受的教义。
  - type: paragraph
    text:
      ru: «И пребывали там немалое время с учениками». Так как город был велик, то там была нужда в учителях.
      cn: 「他们和门徒在那里住了不少时候。」因为那座城很大，所以那里需要教师。
- type: heading1
  text:
    ru: Глава пятнадцатая
    cn: 第十五章
  children:
  - type: paragraph
    text:
      ru: 'Деян.15:1–4.Некоторые, пришедшие из Иудеи, учили братьев: если не обрежетесь по обряду Моисееву, не можете спастись. Когда же произошло разногласие и немалое состязание у Павла и Варнавы с ними, то положили Павлу и Варнаве и некоторым другим из них отправиться по сему делу к Апостолам и пресвитерам в Иерусалим. Итак, быв провожены церковью, они проходили Финикию и Самарию, рассказывая об обращении язычников, и производили радость великую во всех братиях. По прибытии же в Иерусалим они были приняты церковью, Апостолами и пресвитерами, и возвестили всё, что Бог сотворил с ними и как отверз дверь веры язычникам.'
      cn: (使徒行传 15:1-4) 有幾個人從猶太下來，教訓弟兄們說：「你們若不按摩西的規條受割禮，不能得救。」 那時，保羅、巴拿巴與他們的紛爭辯論不小，他們就定意叫保羅、巴拿巴和本會中幾個人，為所辯論的，上耶路撒冷去見使徒和長老。 於是教會送他們起行。他們經過腓尼基、撒瑪利亞，隨處傳說外邦人歸主的事，叫眾弟兄都甚歡喜。 到了耶路撒冷，教會和使徒並長老都接待他們，他們就述說　上帝同他們所行的一切事。


        一些从犹大来的人教导弟兄们说：「若不按摩西的规矩受割礼，就不能得救。」 当保罗和巴拿巴与他们发生了不小的纷争和辩论后，便议定保罗和巴拿巴，并他们中间的另几个人，为这事上耶路撒冷去见使徒和长老们。于是，他们被教会送行，经过腓尼基和撒马利亚，述说外邦人如何归主，叫众弟兄都大大地欢喜。及至到了耶路撒冷，他们受到教会、使徒和长老们的接纳，并述说上帝与他们同在所行的一切事，以及祂如何向外邦人敞开信仰之门。'
  - type: paragraph
    text:
      ru: 'Видишь, апостолы подвергались испытаниям и внешним, и внутренним. Не просто говорилось о необходимости обрезания, но:«если не обрежетесь по обряду Моисееву, не можете спастись». Противоположным этому мнением было то, будто, обрезываясь, верующие не могли спастись. Но Павел не сказал: «Да почему же это? Ужели я не заслуживаю доверия после того, как совершил столько знамений?», а рассудил отправиться ради них в Иерусалим. Как же он в Послании к Галатам говорит:«не пошел в Иерусалим к предшествовавшим мне апостолам»(1, 17)? В первый раз он пришел в Иерусалим не сам, а был послан другими; во второй раз прибыл туда не с тем, чтобы научиться, но с тем, чтобы склонить к своему мнению других, потому что сам он от начала обращения был того мнения, какое постановил потом и собор апостолов, то есть что обращаемых язычников обрезывать не следует. А так как некоторым христианам из иудеев казалось, что Павлу одному доверять решение вопроса нельзя, и так как они обращали свои взоры на апостолов, бывших в Иерусалиме, то Павел пошел туда, пошел не с тем, чтобы научиться большему, но с тем, чтобы убедить тех, которые говорили противное, что и бывшие в Иерусалиме апостолы решают вопрос этот в согласии с ним и Варнавой.'
      cn: 你看，使徒们经受了无论是外部的，还是内部的考验。并非只是谈论割礼的必要性，而是说：「你们若不依照摩西的规矩受割礼，就不能得救。」与此相反的观点是，认为信徒们如果受了割礼，就不能得救。但保罗没有说：「这到底是为什么？难道在我行了如此多的神迹之后，我还不值得信任吗？」，而是决定为了他们前往耶路撒冷。他怎么会在《致加拉太人书》中说：「没有上耶路撒冷去见那些比我先作使徒的」（加拉太书 1:17）呢？他第一次去耶路撒冷并非是自己去的，而是受他人差遣；第二次抵达那里，并非是为了学习，而是为了使他人倾向于自己的观点，因为他自己从归信之初就持守着同样的观点，这也是使徒会议后来所确立的观点，也就是说，归信的异教徒不应该受割礼。又因为一些犹太裔基督徒认为，不能仅仅信任保罗一人来决定此事，而且他们将目光转向了在耶路撒冷的使徒们，所以保罗去了那里，他去并非是为了学习更多，而是为了说服那些持相反观点的人，即便是那些在耶路撒冷的使徒们，在解决这个问题上也是与他及巴拿巴的意见一致的。
  - type: paragraph
    text:
      ru: 'Деян.15:5–12.Тогда восстали некоторые из фарисейской ереси уверовавшие и говорили, что должно обрезывать язычников и заповедывать соблюдать закон Моисеев. Апостолы и пресвитеры собрались для рассмотрения сего дела. По долгом рассуждении Петр, встав, сказал им: мужи братия! вы знаете, что Бог от дней первых избрал из нас меня, чтобы из уст моих язычники услышали слово Евангелия и уверовали. И Сердцеведец Бог дал им свидетельство, даровав им Духа Святаго, как и нам; и не положил никакого различия между нами и ими, верою очистив сердца их. Что же вы ныне искушаете Бога, желая возложить на выи учеников иго, которого не могли понести ни отцы наши, ни мы? Но мы веруем, что благодатию Господа Иисуса Христа спасемся, как и они. Тогда умолкло все собрание и слушало Варнаву и Павла, рассказывавших, какие знамения и чудеса сотворил Бог через них среди язычников.'
      cn: (使徒行传 15:5-12) 唯有幾個信徒、是法利賽教門的人，起來說：「必須給外邦人行割禮，吩咐他們遵守摩西的律法。」 使徒和長老聚會商議這事； 辯論已經多了，彼得就起來，說：「諸位弟兄，你們知道　上帝早已在我們中間揀選了我，叫外邦人從我口中得聽福音之道，而且相信。 知道人心的　上帝也為他們作了見證，賜　聖靈給他們，正如他給我們一樣； 又藉著信潔淨了他們的心，並不分他們我們。 既是這樣，現在你們為甚麼試探　上帝，要把我們祖宗和我們所不能負的軛放在門徒的頸項上呢？ 我們得救，乃是因　主耶穌　基督的恩，和他們一樣，這是我們所信的。」 眾人都默默無聲，聽巴拿巴和保羅述說　上帝藉他們在外邦人中所行的神蹟奇事。
  - type: paragraph
    text:
      ru: Верующие не из язычников, но из иудеев требовали, чтобы принявшие веру обрезывались и исполняли прочие заповеди закона, имевшие отношение к плотской природе человека. С ними, рассуждавшими на основании древнего закона, не согласились прочие ученики, хотя и сами были от обрезания, потому что старались сделать постановление не по своему желанию, но соображаясь с общей пользой.
      cn: 那些并非来自外邦人，而是来自犹太人的信徒要求，那些接受了信仰的人接受割礼，并遵守律法的其余诫命，那些诫命关乎人肉身本性。其他门徒不同意这些根据古老律法来论证的人，尽管他们自己也曾受割礼，因为他们努力制定一项并非出于自己意愿，而是顾及普遍利益的规定。
  - type: paragraph
    text:
      ru: «Апостолы и пресвитеры собрались для рассмотрения сего дела». И из этого места также можно заключать, что апостолы имели какое-то особенное достоинство, по которому стояли выше пресвитеров, иначе Лука обозначил бы всех их одним общим с пресвитерами именем.
      cn: 「使徒和长老聚集，为要审议这件事。」从此处也可以推断出，使徒拥有某种特殊的尊严，因而凌驾于长老之上，否则路加就会用与长老相同的、一个普遍的名称来称呼他们所有人。
  - type: paragraph
    text:
      ru: '«Мужи братия! вы знаете». Заметь: благодать на решение вопроса получает Петр, в котором и до сих пор оставались элементы иудейства."Вы, – говорит он, –знаете". Быть может, здесь были и обвинявшие его некогда за Корнилия, а быть может, и входившие с ним в дом Корнилия, поэтому-то он и выставляет их свидетелями.'
      cn: 「弟兄们！你们知道。」请留意：彼得获得了解决这问题的恩典，而他身上直到那时仍保留着犹太教的元素。「你们，」他说，「知道。」或许，这里有昔日因哥尼流的事而指责他的人，或许也有曾与他一同进入哥尼流家中的人；正因如此，他便引他们为证。
  - type: paragraph
    text:
      ru: «Бог от дней первых избрал из нас меня». Что значит выражение«избрал из нас?»Это значит «в Палестине» или «в присутствии вашем». Словами же«из уст моих»показывает, что через него говорил Бог и что тут ничего не было человеческого.
      cn: 「上帝从起初之日就从我们中间拣选了我。」 「『从我们中间拣选』这个说法是什么意思？这意指『在巴勒斯坦』，或『在你们的临在中』。而借着『从我口中』这些话，显明了上帝是借着他说话，并且其中没有任何属人的成分。
  - type: paragraph
    text:
      ru: «И Сердцеведец Бог дал им свидетельство». Указывает им на духовное свидетельство.
      cn: «并且鉴察人心的上帝给了他们见证。这指示他们所领受的是属灵的见证。»
  - type: paragraph
    text:
      ru: '«Что же вы ныне искушаете Бога, желая возложить на выи учеников иго..?»Там, где вера очищает грехи, исходящие от сердца, нет никакого различия между верными, иудеи ли они или эллины. А очищение это заменило обрезание; вместо плотского обрезания даруется обрезание духовное, которое верой во Христа очищает и тайные грехи. Что значит«искушаете Бога?»Это значит: «Почему вы не верите Богу? Как будто Бог не силен спасти человека по вере». Вводить закон есть знак неверия. Известно всем, что закон был обременителен для израильтян. Это признавали и ученики. Да и сам Спаситель указал нам на это, говоря:«Придите ко Мне все труждающиеся и обремененные, и Я успокою вас»(Мф. 11, 28). Труждающимися и обремененными называет бывших под законом, а Себя назвал кротким, какового свойства закон не имел. Есть и еще место, подобное этому:«Благодатью вы спасены»(Еф. 2,5). Итак, прежде закон спасал тех, кто соблюдал все, что написано в законе, а ныне благодать Господня и без соблюдения закона спасает чрез веру.'
      cn: '「你们如今为何试探上帝，情愿把轭加在门徒的颈项上呢？」


        凡信德洁净人心所发之罪之处，信徒之间就没有任何区别，无论他们是犹太人还是希腊人。这种洁净取代了割礼；属肉的割礼被属灵的割礼所取代，这属灵的割礼，借着对基督的信德，洁净隐秘的罪。


        「『试探上帝』是什么意思？」这意味着：「你们为何不信靠上帝？仿佛上帝无力借着信德来拯救世人。」引进律法乃是不信的标记。众所周知，律法对以色列人来说是沉重的负担。门徒们也承认这一点。就连救主自己也向我们指出了这一点，祂说：「凡劳苦担重担的，都到我这里来，我必使你们得安息。」(马太福音 11:28) 祂称那些在律法之下的人为劳苦担重担的，而称自己是温柔的，律法并不具有这种性质。


        还有一处经文与此类似：「你们得救是本乎恩。」(以弗所书 2:5) 所以，从前律法拯救那些遵守律法所载一切之人，而如今，上主的恩典即使不遵守律法，也借着信德施行拯救。'
  - type: paragraph
    text:
      ru: 'Деян.15:13–23.После же того, как они умолкли, начал речь Иаков и сказал: мужи братия! послушайте меня. Симон изъяснил, как Бог первоначально призрел на язычников, чтобы составить из них народ во имя Свое. И с сим согласны слова пророков, как написано: «Потом обращусь и воссоздам скинию Давидову падшую, и то, что в ней разрушено, воссоздам, и исправлю ее, чтобы взыскали Господа прочие человеки и все народы, между которыми возвестится имя Мое, говорит Господь, творящий все сие»(Ам. 9, 11–12).«Ведомы Богу от вечности все дела Его. Посему я полагаю не затруднять обращающихся к Богу из язычников, а написать им, чтобы они воздерживались от оскверненного идолами, от блуда, удавленины и крови, и чтобы не делали другим того, чего не хотят себе. Ибо закон Моисеев от древних родов по всем городам имеет проповедующих его и читается в синагогax каждую субботу. Тогда Апостолы и пресвитеры со всею церковью рассудили, избрав из среды себя мужей, послать их в Антиохию с Павлом и Варнавою, именно: Иуду, прозываемого Варсавою, и Силу, мужей, начальствующих между братиями, написав и вручив им следующее: «Апостолы и пресвитеры и братия – находящимся в Антиохии, Сирии и Киликии братиям из язычников: радоваться».'
      cn: (使徒行传 15:13-23) 他們住了聲，雅各就說：「諸位弟兄，請聽我的話。 方才西門述說　上帝當初怎樣眷顧外邦人，從他們中間選取百姓歸於自己的名下。 眾先知的話也與這意思相合，正如經上所寫的：『 此後，我要回來，重新修造大衛倒塌的帳幕，把那破壞的重新修造建立起來， 叫餘剩的人，就是凡稱為我名下的外邦人，都尋求作這些事的　主。」這話是行這些事的　主說的。 　上帝從世界的起頭已知曉他一切的工。 「所以據我的意見，我們不可難為那歸服了　上帝的外邦人； 只是我們要給他們寫信，叫他們禁戒偶像的污穢和姦淫，並勒死的牲畜和血。 因為從古以來，摩西的書在各城有人傳講，每逢安息日，在會堂裏誦讀。」 那時，使徒和長老並全教會定意從他們中間揀選人，差他們和保羅、巴拿巴同往安提阿去；所揀選的就是稱呼巴撒巴的猶大和西拉。這兩個人在弟兄中是作首領的。 於是寫信交付他們，內中說：「使徒和作長老的弟兄們問安提阿、敘利亞、基利家外邦眾弟兄的安。


        于是，使徒和长老以及全体教会一致认为，应从他们中间选派几位弟兄，和保罗、巴拿巴一同前往安提阿，他们就是：称呼巴撒巴的犹大，和西拉——这两位都是弟兄中为首的。并由他们写信并亲手交给他们如下：「使徒和长老并众弟兄，写信给在安提阿、叙利亚和基利家，从外邦归主的众弟兄：愿你们喜乐！」'
  - type: paragraph
    text:
      ru: 'Этот Иаков был епископом, поэтому и говорит после. Обрати внимание и на его мудрость: свое слово он подтверждает и новым свидетельством, и ветхозаветными пророчествами.'
      cn: 这个雅各是主教，所以他之后才发言。也请留意他的智慧：他用新的见证和旧约的预言证实他的话语。
  - type: paragraph
    text:
      ru: «Симон изъяснил». Это тот Симеон, который в Евангелии от Луки пророчествует:«Ныне отпускаешь раба Твоего, Владыко»(Лк. 2, 29).
      cn: 西门解释道。这是那位在路加福音中预言的西缅：「主啊，如今祢照祢的话，释放祢的仆人安然离世」(路加福音 2:29)。
  - type: paragraph
    text:
      ru: «Составить из них народ во имя Свое». Благоволил принять Господь людей из язычников не просто, но«во имя Свое»,то есть во имя славы Своей.
      cn: «从他们中建立一个归祂名下的子民。» 上帝欣然接纳外邦人，并非仅仅如此，乃是「归祂名下」，也就是说，是为了祂的荣耀之名。
  - type: paragraph
    text:
      ru: «И с сим согласны слова пророков». Симон был известен как муж близкий по времени, но он не имел авторитета, так как не был древний муж. Поэтому Иаков приводит древнее пророчество:«Потом обращусь и воссоздам скинию Давидову падшую». Падение это было так велико, что казалось непоправимым. Что же? Разве был восстановлен Иерусалим? Не был ли он еще более разорен? О каком же восстановлении говорит пророчество? О восстановлении после вавилонского плена, когда Иерусалим снова стал иметь значение.
      cn: «与此相符的是先知的话语》。西门以一位近时之人而著称，但他缺乏权威，因为他不是一位古人。因此，雅各引用了一个古老的预言：「此后我将转回，并重建大卫已倾塌的帐幕。」这倾塌如此之大，以至于看似无可挽回。那么呢？难道耶路撒冷被重建了吗？难道它不是更加荒芜了吗？那么，预言所说的重建是指什么呢？指的是巴比伦之囚后的重建，当时耶路撒冷再次变得有重要意义。
  - type: paragraph
    text:
      ru: «Посему я полагаю не затруднять». То есть не расстраивать дела, потому что если Бог призвал их, а эти навязывания расстраивают призвание, то мы противимся Богу. Говорит со властью я"полагаю".
      cn: «因此我主张不加添为难»。也就是说，不扰乱事务，因为如果上帝召叫了他们，而这些强加扰乱了召叫，那么我们就是反抗上帝。他带着权柄说：「我主张。」
  - type: paragraph
    text:
      ru: «Написать им, чтобы они воздерживались от оскверненного идолами». Предостережения эти, хотя и касаются чувственных вещей, но необходимы. Так как эти вещи были причиной многих зол, то преимущественно от них Иаков и удерживал верующих.
      cn: «写信给他们，让他们远避被偶像所污秽的。»这些告诫，虽然关乎感官之事，却是必要的。因为这些事物是诸多罪恶的根源，所以雅各伯着重地使信徒远避它们。
  - type: paragraph
    text:
      ru: '«Закон Моисеев от древних родов». До пришествия Спасителя читали Моисея каждую субботу в одних синагогах, но после пришествия Его закон Моисеев читался невозбранно и в церквах Христовых. И это видно из того, что он читается постоянно даже до сего дня. Притом же, если бы ветхозаветное Писание не читалось в церквах, то апостол не написал бы так нерассудительно в Послании к Галатам:«Скажите мне вы, желающие быть под законом: разве вы не слушаете закона?»(Гал. 4, 21).'
      cn: 「摩西律法自古以来」。在救主降临之前，各会堂在每个安息日诵读摩西；但在祂降临之后，摩西律法便也在基督的教会中畅通无阻地被诵读。这一点，从它甚至直到今日仍被持续不断地诵读中可见。此外，如果旧约圣经未在教会中被诵读，那么使徒就不会在《致加拉太人书》中如此不合情理地写道：「告诉我你们，那些愿意在律法之下的人：难道你们没有听从律法吗？」(加拉太书 4:21)
  - type: paragraph
    text:
      ru: Деян.15:24–27.Поелику мы услышали, что некоторые, вышедшие от нас, смутили вас своими речами и поколебали ваши души, говоря, что должно обрезываться и соблюдать закон, чего мы им не поручали, то мы, собравшись, единодушно рассудили, избрав мужей, послать их к вам с возлюбленными нашими Варнавою и Павлом, человеками, предавшими души свои за имя Господа нашего Иисуса Христа. Итак мы послали Иуду и Силу, которые изъяснят вам то же и словесно.
      cn: (使徒行传 15:24-27) 我們聽說，有幾個人從我們這裏出去，用言語攪擾你們，惑亂你們的心，說：『你們必須受割禮，守律法。其實我們並沒有吩咐他們。 所以，我們同心定意，揀選幾個人，差他們同我們所親愛的巴拿巴和保羅往你們那裏去。 這二人是為我們　主耶穌　基督的名不顧性命的。 我們就差了猶大和西拉，他們也要親口訴說這些事。

        因为我们听说，有些出自我们的人，用他们的话语扰乱了你们，动摇了你们的灵魂，说你们必须受割礼并遵守律法，这并非我们所吩咐他们的。于是我们聚集起来，一致同意，拣选一些人，差他们到你们那里去，与我们所亲爱的巴拿巴和保罗一同；他们是为我们主耶稣基督的名舍弃了性命的人。因此，我们差遣了犹大和西拉，他们也会口头向你们说明同样的事。'
  - type: paragraph
    text:
      ru: Говорит, что«мы, собравшись, единодушно рассудили»,потому что все так определили и пишут это по тщательном обсуждении. Замечательно, что ни Петр, ни Иаков не дерзали, без всей церкви, постановить определение об обрезании, хотя признавали это нужным. Но и все вместе не положились бы на себя самих, если бы не были убеждены, что так благоугодно и Духу Святому. А чтобы посольство Иуды и Силы не было сочтено за знак неудовольствия Павлом и Варнавой, следуют похвалы им:«человеками, предавшими души свои за имя Господа нашего Иисуса Христа.
      cn: 他说：「我们聚集一处，同心合意地决定」，因为众人如此确定，并在仔细讨论后写下此事。值得注意的是，彼得和雅各都不敢在没有全教会的情况下颁布关于割礼的规定，尽管他们承认这是必要的。但他们所有的人在一起，也不会依靠他们自己，如果他们不确信这乃是圣灵所喜悦的。而为了不让犹大和西拉的使团被保罗和巴拿巴视为不悦的迹象，接着是对他们的赞扬：「这些人，献出了他们的生命，为了我们主耶稣基督的名。」
  - type: paragraph
    text:
      ru: 'Деян.15:28–38.Ибо угодно Святому Духу и нам не возлагать на вас никакого бремени более, кроме сего необходимого: воздерживаться от идоложертвенного и крови, и удавленины, и блуда, и не делать другим того, чего себе не хотите. Соблюдая сие, хорошо сделаете. Будьте здравы». Итак, отправленные пришли в Антиохию и, собрав людей, вручили письмо. Они же, прочитав, возрадовались о сем наставлении. Иуда и Сила, будучи также пророками, обильным словом преподали наставление братиям и утвердили их. Пробыв там некоторое время, они с миром отпущены были братиями к Апостолам. Но Силе рассудилось остаться там. А Иуда возвратился в Иерусалим. Павел же и Варнава жили в Антиохии, уча и благовествуя, вместе с другими многими, слово Господне. По некотором времени Павел сказал Варнаве: пойдем опять, посетим братьев наших по всем городам, в которых мы проповедали слово Господне, как они живут.'
      cn: (使徒行传 15:28-38) 因為　聖靈和我們定意不將別的重擔放在你們身上；唯有幾件事是不可少的， 就是禁戒祭偶像的食物和血，並勒死的牲畜和姦淫；這幾件你們若能保守自己不犯就好了。願你們平安。』」 他們既奉了差遣，就下安提阿去，聚集眾人，交付書信。 眾人念了，因為信上安慰的話就歡喜了。 猶大和西拉也是先知，就用許多話勸勉弟兄，堅固他們。 住了些日子，弟兄們打發他們平平安安的回到使徒們那裏去。 唯有西拉定意仍住在那裏。 但保羅和巴拿巴仍住在安提啊，和許多別人一同教訓人，傳　主的道。 過了些日子，保羅對巴拿巴說：「我們可以再到從前傳揚　主道的各城，看望弟兄們景況如何。」 巴拿巴有意要帶稱呼馬可的約翰同去； 但保羅因為馬可從前在旁非利亞離開他們，不和他們同去作工，就以為不可帶他去。


        因为圣灵和我们都认为不该再加给你们别的重担，除了这些必须的：禁戒祭偶像的物、血、勒死的和淫乱，并且不将你们不愿人加给你们的，加给人。你们若遵守这些，就必好。你们平安吧。」


        于是，被派遣的人来到安提阿，召集了众人，递上书信。众人读了之后，就因这训诲而欢喜了。犹大和西拉自己也是先知，用许多话训诲了弟兄们，并坚固了他们。在那里住了些日子，弟兄们就平安地打发他们回去见使徒们。但西拉情愿留在那里。犹大却回耶路撒冷去了。


        保罗和巴拿巴却住在安提阿，和许多别的人一起教导并传扬主的话语。过了一些时候，保罗对巴拿巴说：「我们再回去，探望我们在传过主话语的各城里的弟兄们，看看他们景况如何。」'
  - type: paragraph
    text:
      ru: «Варнава хотел взять с собою Иоанна, называемого Марком. Но Павел полагал не брать отставшего от них в Памфилии и не шедшего с ними на дело, на которое они были посланы».
      cn: 巴拿巴想要带上约翰，又称马可的。但保罗认为，不应带上那在旁非利亚离弃了他们，并且没有与他们一同去完成他们受差派去做的工的人。
  - type: paragraph
    text:
      ru: Говорит, что было«угодно Святому Духу»,чтобы не подумали, что это дело человеческое. Что же касается того, что прибавлено"и нам",так это для того, чтобы узнали все, что и они, обрезанные, этого именно мнения относительно вопроса об обрезании.
      cn: 这是说，那是『圣灵所乐意』的，以免人以为这乃是出于人的作为。至于增添了『和我们』这句话，那是为了让所有人都明白，他们这些受过割礼的人，对于割礼的问题，也正是抱持这个意见。
  - type: paragraph
    text:
      ru: «Кроме сего необходимого». Показывается, что нет ничего такого, чего недоставало бы верующим, напротив, с них довольно того, чтобы«воздерживаться от идоложертвенного»и так далее. Выражением«же воздерживаться от… удавленины»запрещается убийство.
      cn: 「除了这些必需的。」这表明，信徒们没有什么可缺乏的；相反地，对于他们而言，只要「禁戒祭偶像的物」等等，就已足够。而「禁戒……勒死的牲畜」这一说法，则禁止了杀戮。
  - type: paragraph
    text:
      ru: «Собрав людей, вручили письмо». Преуспеяние учеников – вот в чем утешение для учителей!
      cn: 「召集众人，递交书信。」门徒的长进——这便是师者的安慰！
  - type: paragraph
    text:
      ru: «Пойдем опять, посетим братьев наших». Следует заметить, что долгом руководителей было заботиться о тех, кого они просветили светом Евангелия, – испытывать, здравы ли они верой, не хромают ли и не следует ли их исправить.
      cn: «我们再回去，看望我们的弟兄们吧。» 应当指出，指导者的责任是照管那些被他们以福音之光照亮的人，考查他们在信仰上是否健全，是否蹒跚，以及是否需要纠正他们。
  - type: paragraph
    text:
      ru: Деян.15:39–41.Отсюда произошло огорчение, так что они разлучились друг с другом; и Варнава, взяв Марка, отплыл в Кипр; а Павел, избрав себе Силу, отправился, быв поручен братиями благодати Божией, и проходил Сирию и Киликию, утверждая церкви.
      cn: (使徒行传 15:39-41) 於是二人起了爭論，甚至彼此分開。巴拿巴帶著馬可，坐船往塞浦路斯去； 保羅揀選了西拉，也離開，蒙弟兄們把他交於　上帝之恩中。 他就走遍敘利亞、基利家，堅固眾教會。
  - type: paragraph
    text:
      ru: 'Между Павлом и Варнавой произошло некоторое недоразумение: один стоял на почве справедливости, а другой хотел поступиться справедливостью но каждый имел одну цель – служение вере. Причина недоразумения следующая. На евангельском пути сопутствовал им от Палестины до Пергии Памфилийской некто Марк, который, как человек слабый, отстав от апостолов, возвратился в Палестину, не отрицаясь, однако же, Христа, но отказываясь от дальнейшего путешествия как трудного для него. Между тем Павел и Варнава возвратились с обильными плодами веры и благочестия и благовествовали находившейся в Иерусалиме церкви об обращении и покаянии язычников. Когда же стали воздавать Павлу и Варнаве хвалу за их подвиги, Марк опечалился, смутился душой, потому что подумал: если бы и он был с апостолами, то сделался бы участником в их славе. И потому снова пожелал сопутствовать им. Варнава принимал его, как раскаявшегося, а Павел настаивал, что не следует брать с собой на дело Господне человека, который не мог сопутствовать им прежде. Итак, разномыслие имело характер не несправедливости, а правды, и проистекало от недоразумения. Павел требовал правды, Варнава – человеколюбия. Расходясь во мнениях, они сходились в чувстве благочестия и разделились не по вере и убеждениям, а по человеческому недоразумению. Случилось же это по Божиему устроению, потому что как только они расстались, Варнава взял с собой Марка и пошел своим особым путем. Но строгая точность Павла принесла и Марку свою пользу, так как своим рвением он старался загладить прежнюю оплошность. Павел советовал в церквах не принимать Марка не с тем, чтобы опечалить его, но чтобы сделать его ревностнее, и когда увидел, что Марк явил успехи ревности и оправдал себя своими последующими действиями, начинает одобрять его и говорить:«Приветствует вас… Марк, племянник Варнавы (о котором вы получили приказания: если придет к вам, примите его)»(Кол. 4, 10).'
      cn: '保罗和巴拿巴之间发生了一些误解：一人站在公义的立场上，另一人则愿意对公义有所宽容，但他们每个人都只有一个目标——服侍信仰。误解的原因如下。在传福音的旅途中，从巴勒斯坦到旁非利亚的别加，一个名叫马可的人曾陪伴他们。他作为一个软弱的人，离开了使徒们，返回了巴勒斯坦，然而并没有否认基督，而是因为旅途对他而言过于艰难而拒绝继续前行。与此同时，保罗和巴拿巴带着丰硕的信仰和虔敬的果实返回，并向耶路撒冷的教会宣报了外邦人的归信和悔改。当人们开始称赞保罗和巴拿巴的功绩时，马可感到悲伤，心中不安，因为他心想：如果他当初也与使徒们在一起，他就能分享他们的荣耀。因此他又希望与他们同行。巴拿巴接纳了他，视他为已悔改之人；而保罗则坚持认为，不应将一个先前未能与他们同行的人带到上主的事工中。


        因此，他们的意见分歧并非不公义，而是出于公义，且源于误解。保罗要求公义，巴拿巴则主张仁爱。尽管意见相左，但他们在虔敬的感受上是一致的；他们的分离并非因信仰或信念，而是出于人性的误解。这事的发生是出于上帝的安排，因为他们一分开，巴拿巴就带着马可，走了自己独特的道路。然而，保罗的严格精确也给马可带来了益处，因为他以自己的热忱努力弥补了先前的过失。保罗建议众教会不要接纳马可，并非为了使他悲伤，而是为了让他更加热忱；当他看到马可在热忱上取得了进步，并以其后来的行动证明了自己时，便开始称赞他并说：


        「问候你们的是……马可，巴拿巴的外甥（你们已经得了他的命令：他若到你们那里去，你们就要接待他）」（歌罗西书 4:10）。'
  - type: paragraph
    text:
      ru: 'Различие во мнениях и нравах замечаем и между пророками. Так, Илия – строг, Моисей – кроток. Точно так же и здесь: Павел настойчивее Марка. Но посмотри: он в то же время и снисходителен. Он не горячился, но требовал настойчиво не брать Марка. Итак, что же? Павел и Варнава разлучились врагами? Да не будет! В посланиях Павла ты находишь, что Варнава имел после этого много похвал от Павла. Мне кажется даже, что они разлучились по взаимному согласию, сказав друг другу: «Так как ты не хочешь, чего я хочу, и наоборот, то, чтобы не спорить, изберем для проповеди различные местности». Так они и поступили, вполне уступив друг другу. А написано это в наше назидание, чтобы предостеречь нас от падения, потому что нам, людям, нельзя обойтись без распрей, но в распрях следует делать взаимные уступки. Но для Марка распря эта была как нельзя более полезна. Павлова строгость исправила его, а Варнавина снисходительность ободряла его не оставлять еще призвания. Итак, Павел и Варнава спорят; но из спора выходит одно следствие – польза. Смотря на Павла, решающегося разлучиться с Варнавой, Марк сильно испугался и обвинил себя; а смотря на Варнаву, который так защищал его, Марк сильно полюбил последнего. И ученик исправляется распрею учителей – так далека была эта распря от того, чтобы послужить соблазном.'
      cn: 意见和性情上的差异，我们也在先知之间注意到。例如，以利亚严厉，摩西温柔。同样，在这里：保罗比马可更坚决。但请看：他同时也是宽容的。他没有发怒，但坚决地要求不带马可。那么，究竟如何？保罗和巴拿巴是作为仇敌而分离的吗？断乎不可！在保罗的书信中，你会发现巴拿巴在此之后得到了保罗许多的赞扬。我甚至认为，他们是依照双方的同意而分离的，彼此对说：「既然你不想我所想的，反之亦然，那么，为了避免争执，我们不如选择不同的地方宣讲福音吧。」他们就这样做了，完全彼此相让。而这被写下来是为了训诲我们，以警惕我们，免得我们跌倒，因为我们人类无法避免争执，但在争执中应该彼此让步。但对马可而言，这场争执再有益不过了。保罗的严厉纠正了他，而巴拿巴的宽容鼓励他不要放弃呼召。如此，保罗和巴拿巴争执；但争执只产生了一个结果——益处。看着保罗——他决定与巴拿巴分离——马可非常害怕并自责；而看着巴拿巴——他如此地为马可辩护——马可深爱后者。甚至门徒也因着老师们的争执而得到纠正——这场争执丝毫没有成为绊脚石。
  - type: paragraph
    text:
      ru: '«Проходил Сирию и Киликию, утверждая церкви». Прежде чем идти в другие города, посещает те, которые приняли уже слово Божие. Так поступаем и мы: первых людей прежде наставляем, чтобы они не послужили препятствием для наставления последующих.'
      cn: «他经过叙利亚和基利家，坚固众教会》。在去往其他城市之前，他拜访那些已经领受了上帝之道的人。我们也是如此行：首先我们教导最先领受的人，以免他们阻碍对后来者的教导。
- type: heading1
  text:
    ru: Глава шестнадцатая
    cn: 第十六章
  children:
  - type: paragraph
    text:
      ru: Деян.16:1–3.Дошел он до Дервии и Листры. И вот, там был некоторый ученик, именем Тимофей, которого мать была Иудеянка уверовавшая, а отец Еллин, и о котором свидетельствовали братия, находившиеся в Листре и Иконии. Его пожелал Павел взять с собою; и, взяв, обрезал его ради Иудеев, находившихся в тех местах; ибо все знали об отце его, что он был Еллин.
      cn: (使徒行传 16:1-3) 保羅來到特庇，又到路司得。在那裏有一個門徒，名叫提摩太，是信主之猶太婦人的兒子，他父親卻是希臘人。 路司得和以哥念的弟兄都稱讚他。 保羅要帶他同去，只因那些地方的猶太人都知道他父親是希臘人，就給他行了割禮。

        他到了特庇和路司得。在那里有一个门徒，名叫提摩太，他母亲是信主的犹太妇人，他父亲却是希腊人。路司得和以哥念的弟兄们都称赞他。保罗想带他同去，就因为那些地方的犹太人，给他行了割礼；因为他们都知道他父亲是希腊人。'
  - type: paragraph
    text:
      ru: Замечательно, что иудеи так пренебрегали законом, что своих дочерей выдавали за эллинов и женились на эллинках.
      cn: 令人震惊的是，犹太人如此蔑视律法，以至于把他们的女儿嫁给希腊人，并娶希腊女子为妻。
  - type: paragraph
    text:
      ru: «Взяв, обрезал его ради Иудеев». Достойна великого удивления мудрость Павла. Он, который так ратовал против обрезания язычников и который давал толчок всему, пока не решили вопроса, обрезал своего ученика. Он не только другим не запрещал этого, но даже сам делает это. В каждом деле он имел в виду пользу и ничего не делал без цели. И тому нужно удивляться, как еще Павел расположил его к обрезанию.
      cn: 「他带着他，为了犹太人的缘故给他行了割礼。」保罗的智慧堪当极大的惊奇。他，就是那个如此极力反对给外邦人行割礼，并且在问题未解决之前推动了所有事情的人，却给自己的门徒行了割礼。他不仅没有禁止其他人这样做，甚至自己也这样做了。在每一件事上，他都以益处为念，并且没有一件事是漫无目的的。并且令人称奇的是，保罗又是如何使他心甘情愿地接受割礼的呢？
  - type: paragraph
    text:
      ru: «Ради Иудеев, находившихся в тех местах». Потому что они никак не решились бы слушать слово Божие от необрезанного. И что же?
      cn: 「为了那些地方的犹太人。」因为他们绝不会愿意从一个未受割礼之人那里听上帝之道。那又如何呢？
  - type: paragraph
    text:
      ru: 'Обрати внимание на оправдание этого поступка. Павел обрезал Тимофея для того, чтобы уничтожить обрезание; он не поддерживал обрезания, а хотел выполнить величайшую и всем апостолам приятную задачу, потому что если бы Тимофей не был обрезан и в то же время был бы учителем иудеев, то все отшатнулись бы от него. Если уже иудеи так сильно обвиняли Павла за Трофима Ефесского, так как думали, что Павел ввел его в храм (а он был из эллинов), то что пришлось бы перенести самому Павлу, если бы при нем находился учителем же человек необрезанный? Но посмотри: он оправдан и во мнении апостолов, и говорит в храме об исполнении этого оправдания. Все он делал ради спасения иудеев. Пожалуй, можно указать, что и Петр прикрывался личиной иудейства… И это нисколько не вредило апостолам, а напротив, то, что иудеи имели таких учителей, которые, по их мнению, соблюдали закон, послужило поводом к их обращению и началом их веры во Христа.'
      cn: 请注意这一举动的合理解释。保罗给提摩太行了割礼，是为了废除割礼；他并不支持割礼，而是想完成一项至高无上、令众使徒都欣悦的任务，因为如果提摩太没有受割礼，同时又是犹太人的教师，那么所有人都将弃绝他。如果犹太人已经如此强烈地指责保罗，为了以弗所人特罗非摩，因为他们认为保罗带他进入了圣殿（而他是一个希腊人），那么如果他身边有一位未受割礼的人作教师，保罗自己又将面临何等境况呢？但请看：他在使徒们看来也是被认可的，并在圣殿中谈论这一正当理由的实现。他所做的一切都是为了犹太人的救赎。或许可以指出，彼得也曾假借犹太教的外衣……而这丝毫没有损害使徒们，相反地，犹太人拥有这样的教师——在他们看来，这些教师遵守律法——这促成了他们的归信，并成为他们对基督信仰的开端。
  - type: paragraph
    text:
      ru: 'Деян.16:4–12.Проходя же по городам, они предавали верным соблюдать определения, постановленные Апостолами и пресвитерами в Иерусалиме. И церкви утверждались верою и ежедневно увеличивались числом. Пройдя через Фригию и Галатийскую страну, они не были допущены Духом Святым проповедывать слово в Асии. Дойдя до Мисии, предпринимали идти в Вифинию; но Дух не допустил их. Миновав же Мисию, сошли они в Троаду. И было ночью видение Павлу: предстал некий муж, Македонянин прося его и говоря: приди в Македонию и помоги нам. После сего видения, тотчас мы положили отправиться в Македонию, заключая, что призывал нас Господь благовествовать там. Итак, отправившись из Троады, мы прямо прибыли в Самофракию, а на другой день в Неаполь, оттуда же в Филиппы: это первый город в той части Македонии, колония. В этом городе мы пробыли несколько дней.'
      cn: (使徒行传 16:4-12) 他們經過各城，把耶路撒冷使徒和長老所定的條規交給門徒遵守。 於是眾教會信心越發堅固，人數天天加增。 那時，他們經過弗呂家、加拉太一帶地方，　聖靈禁止他們在亞細亞傳道， 後來他們到了每西亞，想要往庇推尼去；　靈卻不許他們。 他們就越過每西亞，下到特羅亞去。 在夜間有異象現與保羅。有一個馬其頓人站著求他說：「請你過到馬其頓來幫助我們。」 保羅既看見這異象，我們隨即想要往馬其頓去，以為　主召我們傳福音給那裏的人聽。 於是從特羅亞開船，一直行到撒摩特喇，第二天到了尼亞波利。 從那裏來到腓立比，就是馬其頓這一方首要的城，也是羅馬的駐防城。我們在這城裏住了幾天。


        他们经过各城，把使徒和长老在耶路撒冷所定的规条交给平信徒遵守。于是众教会就在信仰上得以坚固，并且人数天天增加。他们经过弗吕家和加拉太地区，圣灵不许他们在亚细亚传讲圣道。到了每西亚的边界，他们曾尝试往庇推尼去，但圣灵不许他们。他们就越过每西亚，下到特罗亚。夜间，保罗得了一个异象：有一个马其顿人站着，求他，说：「请你过到马其顿来帮助我们！」 保罗看见这异象以后，我们立刻决定前往马其顿，因为我们断定，是上主呼召我们去那里传福音。


        于是，我们从特罗亚开船，直航撒摩特喇，第二天到尼亚波利，从那里到腓立比。这城是马其顿那一地区的头一个城，是个罗马的殖民地。我们在这城里住了几天。'
  - type: paragraph
    text:
      ru: Говорится, что«они предавали верным соблюдать определения», передавали не тайны воплощения, но наставления«воздерживаться от идоложертвенного и крови, и удавленины, и блуда»(Деян. 15, 29), – все, что касается устройства правильной жизни.
      cn: 经记载，他们「将规条交托给信徒遵守」，传达的并非道成肉身之奥秘，而是「禁戒祭偶像之物、血、勒死的牲畜和奸淫」(使徒行传 15:29) 的教导——这关乎一切正当生活的规整。
  - type: paragraph
    text:
      ru: «Они не были допущены Духом Святым проповедывать слово в Асии». Почему воспрещено было им проповедовать в Асии, об этом не говорит, но о том, что воспрещено было это им, сказал, научая этим нас повиноваться и не требовать отчета и показывая, что часто они действовали и по-человечески. Дух запрещает апостолам проповедовать в Асии и Вифинии, так как предвидел, что тамошними жителями овладеет ересь духоборцев.
      cn: 「他们不蒙圣灵许可在亚细亚宣讲圣道。」至于为何禁止他们在亚细亚宣讲圣道，经文并未说明，但却说了他们被禁止的事，借此教导我们顺服，不要求交待，并显明他们常常也按着人的方式行事。圣灵禁止使徒们在亚细亚和庇推尼宣道，因为祂预见到当地居民将要被抗灵派异端所掌控。
  - type: paragraph
    text:
      ru: '«Было ночью видение Павлу: предстал некий муж, Македонянин, прося его и говоря». Уже не через Ангела, как Филипп и Корнилий, но в видении Павел получает откровение, – уже более человеческим образом. Где легко убедить, там – более человеческим образом, а где требуется большое усилие, там откровение бывает в форме более Божественной. Нужно заметить, что в этих городах с Павлом был и Лука. Это видно из того, что последний объединяет свою личность с первым, когда говорит:«мы положили отправиться… мы прямо прибыли… мы пробыли.'
      cn: 「保罗夜间得了异象：有一个马其顿人站着，求他，说。」不再是像腓利和哥尼流那样透过天使，而是保罗在异象中获得启示，——这已经是一种更合乎人的方式。在易于说服之处，启示便以更合乎人的方式显现；而在需要极大努力之处，启示则以更属神圣的形式出现。需要注意的是，在这些城市中，路加也与保罗同在。这可以从以下事实看出：后者将自己与前者联系在一起，当他说：「我们决定动身……我们直接抵达……我们逗留。」
  - type: paragraph
    text:
      ru: 'Деян.16:13–15.В день же субботний мы вышли за город к реке, где, по обыкновению, был молитвенный дом, и, сев, разговаривали с собравшимися там женщинами. И одна женщина из города Фиатир, именем Лидия, торговавшая багряницею, чтущая Бога, слушала; и Господь отверз сердце ее внимать тому, что говорил Павел. Когда же крестилась она и домашние ее, то просила нас, говоря: если вы признали меня верною Господу, то войдите в дом мой и живите у меня. И убедила нас.'
      cn: (使徒行传 16:13-15) 當安息日，我們出了城，到了河邊，那裏有一個常為禱告的地方；我們就坐下對常在那裏的婦女講道。 有一個賣紫色布疋的婦人，名叫呂底亞，是推雅推喇城的人，素來敬拜　上帝。她聽見了，　主就開導她的心，叫她留心聽保羅所講的話。 她和她一家既領了浸，便求我們說：「你們若以為我是忠心事　主的，請到我家裏來住。」於是強留我們。
  - type: paragraph
    text:
      ru: Там, по причине малочисленности иудеев, не было синагоги, и особенно набожные из них тайно собирались вне города"при реке". Как народ более плотской, иудеи там, где не было синагоги, молились и вне ее, определяя для этого какое-либо место, – молились и по субботам, когда обыкновенно собирался и народ.
      cn: 在那里，因为犹太人数量稀少，没有会堂，其中特别虔诚的人便秘密地在城外「在河边」聚集。作为一个更属肉体的民族，犹太人在没有会堂的地方，也会在会堂外祷告，为此指定某个地方——他们也在安息日祷告，那时百姓通常也会聚集。
  - type: paragraph
    text:
      ru: '«Если вы признали меня верною Господу». Посмотри, как любомудра жена: сначала сама засвидетельствовала, что Бог призвал ее. Обрати также внимание и на ее скромность. Это – женщина простая, она продавала материи, окрашенные в пурпур. И Лука не стыдится упомянуть о ее ремесле. Она не сказала: «Если вы увидели, что я великая женщина», или «я благочестивая женщина», но говорит:«Если вы признали меня верною Господу». Если Господу, то тем более – вам. Не просто просила их к себе в дом, но предоставила дело на их волю, хотя и сильно настаивала на своем желании.'
      cn: 「如果你们认为我忠于上主」。看这位妇人多么爱慕智慧：她先是亲自作证，上帝召叫了她。也要留意她的谦逊。她是一位简单的妇人，她贩卖紫色的布料。路加也不以提及她的手艺为耻。她没有说：「如果你们看见我是一位伟大的妇人」，或「我是一位虔敬的妇人」，而是说：「如果你们认为我忠于上主」。如果忠于上主，那么更不用说对你们了。她并非只是简单地邀请他们到自己家中，而是将此事交由他们的意愿决定，尽管她强烈坚持自己的愿望。
  - type: paragraph
    text:
      ru: 'Деян.16:16–21.Случилось, что, когда мы шли в молитвенный дом, встретилась нам одна служанка, одержимая духом прорицательным, которая через прорицание доставляла большой доход господам своим. Идя за Павлом и за нами, она кричала, говоря: сии человеки – рабы Бога Всевышнего, которые возвещают нам путь спасения. Это она делала много дней. Павел, вознегодовав, обратился и сказал духу: именем Иисуса Христа повелеваю тебе выйти из нее. И дух вышел в тот же час. Тогда господа ее, видя, что исчезла надежда дохода их, схватили Павла и Силу и повлекли на площадь к начальникам. И, приведя воеводам, сказали: сии люди, будучи Иудеями, возмущают наш город и проповедуют обычаи, которых нам, Римлянам, не следует ни принимать, ни исполнять.'
      cn: (使徒行传 16:16-21) 後來，我們往那禱告的地方去。有一個女子迎著面來，她被巫靈所附，是占卜的，叫她主人們大得財利。 她跟隨保羅和我們，喊著說：「這些人是至高　上帝的僕人，指示我們救人的道。」 他一連多日這樣喊叫，保羅就心中愁煩，轉身對那靈說：我奉耶穌　基督的名，吩咐你從他身上出來。牠當時就出來了。 使女的主人們見得利的盼望沒有了，便揪住保羅和西拉，拉他們到市上去見首領， 又帶到官長面前說：「這些人原是猶太人，竟大大騷擾我們的城， 傳我們羅馬人所不可受不可行的規矩。」
  - type: paragraph
    text:
      ru: 'Каким духом была одержима служанка? Называют его, по месту, богом Пифоном. Он хотел ввести апостолов в искушение. Иначе, это та женщина, Пифия, о которой говорят, что она садилась на треножник Аполлона, раздвинув ноги, и что злой дух, поднимаясь из углубления, находившегося под треножником, проникал в нее и приводил ее в исступление; тогда она приходила в бешенство, испускала из рта пену и в состоянии такого исступления произносила бессвязные слова.«Идя за Павлом и за нами, она кричала, говоря: сии человеки – рабы Бога Всевышнего». О дух нечистый! Если ты знаешь, что они«возвещают… путь спасения», то почему не удаляешься от них?'
      cn: 那使女是被什么灵附着呢？依照当地的说法，人称它为彼得灵神。它想要使使徒们受试探。换言之，她就是那个皮提亚的女人，人们说她张开双腿坐在阿波罗的三足鼎上，有恶灵从三足鼎下方的凹陷处升起，进入她体内，使她陷入狂乱；那时她就发狂，口吐白沫，并在那样的狂乱状态下说出语无伦次的话。「她跟随保罗和我们，大声喊叫说：『这些人是至高上帝的仆人』。」哦，不洁的灵啊！既然你知道他们「传扬……救赎之道」，那你为何不离开他们呢？
  - type: paragraph
    text:
      ru: «Павел, вознегодовав», то есть будучи возбужден и взволнован. Заградив ей уста, хотя она и говорила истину, он научает нас не допускать к себе демонов, хотя бы они принимали вид, что защищают истину, но преграждать им всякий повод к соблазну и не слушать ничего, что они говорят. Если бы Павел обратил внимание на свидетельство этого духа, то последний обольстил бы многих из верующих. Поэтому Павел на первый раз не только не принял, но отверг его свидетельство, не желая увеличивать числа своих знамений. Но когда дух упорствовал, тогда Павел повелел ему выйти из женщины. Итак, дух действовал коварно, Павел же – разумно.
      cn: 「保禄，心生恼怒」，意即心神激动而不安。他堵住她的口，即便她所说的是真理，他教导我们不要接纳魔鬼，即使它们摆出维护真理的样子，反而要阻绝它们一切诱惑人的机会，且不听它们所说的任何话。如果保禄听信了这灵的见证，那么后者就会迷惑许多信徒。因此，保禄起初不仅没有接受，反而拒绝了它的见证，不愿增添他神迹的数目。但当这灵顽固不化时，那时保禄就吩咐它从那女人身上出来。由此可见，那灵是诡诈行事，而保禄则是明智地行事。
  - type: paragraph
    text:
      ru: '«Господа ее, видя, что исчезла надежда дохода их». Везде виною зла – деньги. В видах обогащения господа женщины желали, чтобы она одержима была бесом. Посмотри: они и демона не хотят знать, но поглощены одной своей страстью – сребролюбием. Демон говорил:«Сии человеки – рабы Бога Всевышнего», а они говорят, что«сии люди… возмущают наш город», демон говорил, что они«возвещают нам путь спасения», а господа служанки говорят, что они«проповедуют обычаи, которых… не следует… принимать».'
      cn: «她的主人，见他们得利的指望没有了»。邪恶的祸根处处皆是金钱。为了发财，这妇人的主人巴不得她被邪魔附身。看哪：他们连邪魔也不愿知晓，只被自己唯一的激情——贪爱钱财所吞噬。邪魔曾说：「这些人是至高上帝的仆人」，而他们却说：「这些人……搅扰我们的城市」，邪魔曾说他们「向我们宣讲救赎之道」，而这婢女的主人却说他们「宣讲的规矩……是我们不应许接受的」。
  - type: paragraph
    text:
      ru: 'Деян.16:22–34.Народ также восстал на них, а воеводы, сорвав с них одежды, велели бить их палками. И, дав им много ударов, ввергли в темницу, приказав темничному стражу крепко стеречь их. Получив такое приказание, он ввергнул их во внутреннюю темницу и ноги их забил в колоду. Около полуночи Павел и Сила, молясь, воспевали Бога; узники же слушали их. Вдруг сделалось великое землетрясение, так что поколебалось основание темницы; тотчас отворились все двери, и у всех узы ослабели. Темничный же страж, пробудившись и увидев, что двери темницы отворены, извлек меч и хотел умертвить себя, думая, что узники убежали. Но Павел возгласил громким голосом, говоря: не делай себе никакого зла, ибо все мы здесь. Он потребовал огня, вбежал в темницу и в трепете припал к Павлу и Силе. И, выведя их вон, сказал: государи мои! что мне делать, чтобы спастись? Они же сказали: веруй в Господа Иисуса Христа, и спасешься ты и весь дом твой. И проповедали слово Господне ему и всем, бывшим в доме его. И, взяв их в тот час ночи, он омыл раны их и немедленно крестился сам и все домашние его. И, приведя их в дом свой, предложил трапезу и возрадовался со всем домом своим, что уверовал в Бога.'
      cn: (使徒行传 16:22-34) 眾人就一同起來攻擊他們。官長吩咐剝了他們的衣服，用棍打； 打了許多棍，便將他們下在監裏，囑咐禁卒嚴緊看守。 禁卒領了這樣的命，就把他們下在內監裏，兩腳上了木狗。 約在半夜，保羅和西拉禱告，唱詩讚美　上帝，眾囚犯也側耳而聽。 忽然，地大震動，甚至監牢的地基都搖動了，監門立刻全開，眾囚犯的鎖鏈也都鬆開了。 禁卒一醒，看見監門全開，以為囚犯已經逃走，就拔刀要自殺。 保羅大聲呼叫說：「不要傷害自己。我們都在這裏。」 禁卒叫人拿燈來，就跳進去，戰戰兢兢的俯伏在保羅、西拉面前； 又領他們出來，說：「兩位先生，我務要怎樣行，才可以得救？」 他們說：「當信　主耶穌　基督，你和你一家都必得救。」 他們就把　主的道講給他和他全家的人聽。 當夜，就在那時候，禁卒把他們帶去，洗他們的傷；他和屬乎他的人立時都受了浸。 於是禁卒領他們上自己家裏去，給他們擺上食物。他和全家，因為信了　上帝，都很喜樂。


        民众也起来攻击他们，而官长们则剥去他们的衣服，下令用棍子打他们。打了他们许多棍子以后，就把他们投入监狱，吩咐狱卒严加看守。狱卒领了这命令，就把他们下在内监里，把他们的脚上了木狗。


        约在半夜，保罗和西拉祷告歌颂上帝；众囚犯也侧耳听着他们。忽然地大震动，甚至监狱的地基都摇动了；立刻所有的门都开了，所有人的锁链都松了。狱卒一醒过来，看见监狱的门都开了，就拔出刀来，想要自杀，以为囚犯都逃走了。但保罗大声喊着说：「不要伤害自己，我们都在这里！」 狱卒叫人拿了灯，冲进监狱，战战兢兢地俯伏在保罗和西拉面前。又把他们带出来，说：「二位大人哪！我该做什么才能得救呢？」 他们说：「当信主耶稣基督，你和你一家都必得救。」 他们就把上主的话传讲给他以及他全家的人听。就在那一夜的那个时辰，狱卒带他们去洗了伤口，他和他全家就立刻受了洗。他又领他们到自己家里，摆上筵席款待他们；他和他全家，因为信了上帝就都喜乐了。'
  - type: paragraph
    text:
      ru: Творить чудеса и учить было делом Павла, а в опасностях принимал участие с ним и Сила. Прими к сведению, что и демоны знают о том, что распятый Иисус есть Вышний Бог, а Павел – раб Его, что сам он утверждал, говоря:«Павел раб Иисуса Христа»(Рим. 1,1).
      cn: 行神迹和教导是保罗的职事，而西拉也与他一同分担危险。请留意，甚至恶魔也知道，被钉十字架的耶稣是至高上帝，而保罗是祂的仆人；这正是他自己所声明的，他说：「保罗，耶稣基督的仆人。」（罗马书 1:1）
  - type: paragraph
    text:
      ru: «Вдруг сделалось великое землетрясение».
      cn: 忽然，发生了一场猛烈的地震。
  - type: paragraph
    text:
      ru: Отворились двери, темничный страж пробудился. Случившееся изумило его. Но узники не видели этого, иначе все они бежали бы. А чтобы стражу не показалось, что это произошло само собой, двери отворились вслед за землетрясением.
      cn: 门开了，狱卒醒了过来。发生的一切令他惊奇不已。但囚犯们都没有看见，否则他们所有的人都会逃走。而为了使狱卒不至于觉得这件事是自然发生的，门是紧随地震之后才开的。
  - type: paragraph
    text:
      ru: «Веруй в Господа Иисуса Христа, и спасешься ты и весь дом твой». И в темнице не давал себе покоя Павел, и тут он привлек к себе темничного стража и совершил это прекрасное пленение.
      cn: 「相信主耶稣基督，你和你一家就必得救。」保罗在狱中也不安歇，就在那里他吸引了狱卒，并完成了这美好的俘获。
  - type: paragraph
    text:
      ru: «Взяв их в тот час ночи, он омыл раны их». Им страж омыл раны, а сам омыт был от грехов.
      cn: 「就在那夜间，他带着他们，洗净了他们的伤口」。狱卒为他们洗净了伤口，而他自己则被洗净了罪过。
  - type: paragraph
    text:
      ru: «И возрадовался со всем домом своим, что уверовал в Бога», хотя и ничего не получил, кроме благих слов и благих надежд.
      cn: 于是他和他全家都喜乐，因为他信了上帝，尽管他除了良言和良善的盼望之外，什么也没有得到。
  - type: paragraph
    text:
      ru: 'Деян.16:35–40.Когда же настал день, воеводы послали городских служителей сказать: отпусти тех людей. Темничный страж объявил о сем Павлу: воеводы прислали отпустить вас; итак выйдите теперь и идите с миром. Но Павел сказал к ним: нас, Римских граждан, без суда всенародно били и бросили в темницу, а теперь тайно выпускают? нет, пусть придут и сами выведут нас. Городские служители пересказали эти слова воеводам, и те испугались, услышав, что это Римские граждане. И, придя, извинились перед ними и, выведя, просили удалиться из города. Они же, выйдя из темницы, пришли к Лидии и, увидев братьев, поучали их, и отправились.'
      cn: (使徒行传 16:35-40) 到了天亮，官長打發差役來，說：「釋放那兩個人吧。」 禁卒就把這話告訴保羅說：「官長打發人來叫釋放你們；因此如今可以出監，平平安安的去吧。」 保羅卻說：「我們是羅馬人，並沒有定罪，他們就在眾人面前打了我們，又把我們下在監裏，現在要私下趕我們出去嗎？這誠然是不行的。叫他們自己來領我們出去吧。」 差役把這些話回稟官長。官長聽見他們是羅馬人，就害怕了， 於是來勸他們，領他們出來，請他們離開那城。 二人出了監，往呂底亞家裏去；見了弟兄們，勸慰他們一番，就走了。


        到了天亮的时候，地方长官差派城里的差役来说：「释放那些人吧。」狱卒把这话告诉保罗说：「地方长官差人来释放你们；所以，你们现在可以出来，平安地去吧。」保罗却对他们说：「我们是罗马公民，未经审讯，就当众鞭打我们，又把我们下在监里，现在要秘密地释放我们吗？不，他们应该亲自来，把我们领出去。」差役们把这话回禀了地方长官，那些长官就害怕了，因为他们听说这些人是罗马公民。于是，他们来了，向他们赔罪，并且把他们领出来，求他们离开那城。他们出了监牢，来到吕底亚的家，见了弟兄们，勉励他们，就离开了。'
  - type: paragraph
    text:
      ru: 'И после того, как приказали воеводы, Павел не выходит из темницы, но, в назидание Лидии, торговавшей багряницей, и других, устрашает воевод, чтобы не подумали, что они освобождены по чьей-либо просьбе. Он даже обвиняет воевод в том, что они публично били их, – их, ни в чем не обвиненных и притом римских граждан. Видишь: часто поступали они так, как свойственно обыкновенным людям. Высказал же Павел это (что они римские граждане и ни в чем не обвинены) для того, чтобы не показалось, что его освобождают как человека вредного и в чем-либо обвиненного. Что же касается темничного стража, так это – Стефан, о котором упоминает Павел в Послании к Коринфянам:«крестил… также Стефанов дом»(1Кор. 1, 16).'
      cn: 即使在官长们下令之后，保罗也没有立刻出狱，而是为了教诲卖紫色布的吕底亚以及其他人，震慑了官长们，以免他们以为自己是因某人的请求才被释放的。他甚至指责官长们在公众面前鞭打他们——他们是未受任何指控的罗马公民。你看：他们常常如此行事，就如普通人一般。保罗说出这些话（即他们是罗马公民，且未受任何指控），是为了不让人以为他作为一个有害的或受了某种指控的人而被释放。至于那狱卒，那就是司提反，保罗在《哥林多前书》中提到他：「我也施洗了……司提反一家」（哥林多前书 1:16）。
  - type: paragraph
    text:
      ru: «Выйдя из темницы, пришли к Лидии и, увидев братьев, поучали их, и отправились». Не следовало оставлять в состоянии беспокойства и заботы женщину, которая оказала им гостеприимство; и они, несмотря на побуждения воевод, не хотели удалиться, не посетив простой женщины и других лиц, которых они называли братьями. О, сколь велики их смирение и любовь!
      cn: '「从监牢里出来，他们来到吕底亚那里，见到弟兄们，教诲他们，就离开了。」


        他们不应将接待过他们的女子，撇在不安与挂虑之中；他们，尽管受军官们催促，也不愿离去，不探望这位普通的女子，以及他们称之为弟兄的其他人。啊，他们的谦卑和爱是何等伟大！'
- type: heading1
  text:
    ru: Глава семнадцатая
    cn: 第十七章
  children:
  - type: paragraph
    text:
      ru: Деян.17:1–9.Пройдя через Амфиполь и Аполлонию, они пришли в Фессалонику, где была Иудейская синагога. Павел, по своему обыкновению, вошел к ним и три субботы говорил с ними из Писаний, открывая и доказывая им, что Христу надлежало пострадать и воскреснуть из мертвых и что Сей Христос есть Иисус, Которого я проповедую вам. И некоторые из них уверовали и присоединились к Павлу и Силе, как из Еллинов, чтущих Бога, великое множество, так и из знатных женщин немало. Но неуверовавшие Иудеи, возревновав и взяв с площади некоторых негодных людей, собрались толпою и возмущали город и, приступив к дому Иасона, домогались вывести их к народу. Не найдя же их, повлекли Иасона и некоторых братьев к городским начальникам, крича, что эти всесветные возмутители пришли и сюда, а Иасон принял их; и все они поступают против повелений кесаря, почитая другого царем, Иисуса. И встревожили народ и городских начальников, слушавших это. Но сии, получив удостоверение от Иасона и прочих, отпустили их.
      cn: (使徒行传 17:1-9) 保羅和西拉經過暗妃坡里、亞波羅尼亞，來到帖撒羅尼迦，在那裏有猶太人的會堂。 保羅照他素常的規矩進去，一連三個安息日，本著聖經與他們辯論， 講解陳明　基督必須受害，從死裏復活；又說：「我所傳與你們的這位耶穌就是　基督。」 他們中間有些人信了，就附從保羅和西拉，並有許多虔敬的希臘人，尊貴的婦女也不少。 但那不信的猶太人心裏嫉妒，招聚了些市井匪類，搭夥成群，聳動合城的人闖進耶孫的家，要將保羅、西拉帶到百姓那裏。 找不著他們，就把耶孫和幾個弟兄拉到地方官那裏，喊叫說：「那攪亂世界的也到這裏來了， 耶孫收留他們。這些人都違背凱撒的命令，說另有一個王耶穌。」 百姓和地方官聽見這些話，就驚慌了； 於是取了耶孫和其餘之人的保狀，就釋放了他們。


        经过暗非波立和亚波罗尼亚，他们来到帖撒罗尼迦，在那里有犹太人的会堂。保罗照例进去，一连三个安息日，本着圣经与他们辩论，解释引证基督必须受难，从死里复活；又说：「我所传给你们的这位耶稣，就是基督。」他们中间有些人信了，就与保罗和西拉为伴；又有许多敬拜上帝的希腊人，和不少尊贵的妇女。但不信的犹太人，心怀嫉妒，招聚了市面上一些匪徒，聚众滋事，骚扰城里的人；又冲到雅孙的家，想要把他们拉出来交给民众。找不到他们，就把雅孙和几个弟兄拉到地方官那里，喊着说：「这些骚动天下的人，也来到这里了！雅孙竟接待他们；并且这些人都违背凯撒的命令，说另有一个王，就是耶稣。」众人和地方官听见这话就都慌乱了。于是，他们叫雅孙和其余的人交了保状，就释放了他们。'
  - type: paragraph
    text:
      ru: Небольшие города«Амфиполь и Аполлонию»проходят мимо и спешат в большие, так как из последних слово Божие должно было распространяться по ближним городам.
      cn: 小城「安菲波利」和「阿波罗尼亚」被略过，（宣教士们）急速前往大城，因为上帝的道理应从后者传播到附近的城镇。
  - type: paragraph
    text:
      ru: «Пришли в Фессалонику, где была Иудейская синагога». Хотя Павел и сказал:«Но как вы… сами себя делаете недостойными вечной жизни, то вот, мы обращаемся к язычникам»(Деян. 13, 46), но он не оставлял и иудеев, потому что очень сожалел о них.
      cn: 「他们来到帖撒罗尼迦，那里有一座犹太会堂。」虽然保罗也曾说过：「但因你们……自己使自己不配得永生，那么，看啊，我们转向外邦人。」（使徒行传 13:46），但他并没有离弃犹太人，因为他非常惋惜他们。
  - type: paragraph
    text:
      ru: «Павел… говорил с ними из Писаний, открывая и доказывая им, что Христу надлежало пострадать и воскреснуть из мертвых». Прежде всего проповедует о страдании, так как признавал это спасительным.
      cn: 「保罗……与他们依据圣经讲论，开启并向他们证明，基督必须受苦，并从死里复活。」首先，他宣讲受难，因为他认定这具有救赎意义。
  - type: paragraph
    text:
      ru: «Еллинов, чтущих Бога, великое множество». Эллинами называет иудеев, говоривших по-гречески, или же разумеет причисленных к иудеям пришельцев, из эллинов. Называет их чтущими Бога потому, что они соблюдали закон.
      cn: 「『敬拜上帝的希腊人，人数众多。』」他将说希腊语的犹太人称为希腊人，或者他指的是那些从希腊人中归化，并被算作犹太人的外邦人。他称他们为敬拜上帝的，因为他们遵守了律法。
  - type: paragraph
    text:
      ru: «Все они поступают против повелений кесаря, почитая другого царем, Иисуса». Точно так же и Иисуса обвиняли отцы их, говоря, что царем Себя называет. Но те имели хотя несколько правдоподобный предлог, так как обвиняемый был еще жив. А эти на что рассчитывали в своей лжи, когда говорили об апостолах, что они называют царем Иисуса, Который, по их мнению, умер и бояться Которого земным царям было уже нечего, так как они видели, что Он вовсе уже не появлялся?
      cn: 「他们都违抗凯撒的命令，尊奉另一位为王，就是耶稣。」同样地，他们的先祖也曾控告耶稣，说祂自称为王。然而，那些人还有多少有些貌似有理的借口，因为被控告者当时还活着。而这些人，在他们的谎言中指望的是什么呢？当他们谈论使徒时，说使徒称耶稣为王，而照他们看来，耶稣已经死了，尘世的君王已无需再惧怕祂，因为他们看见祂根本不再显现了。
  - type: paragraph
    text:
      ru: 'Деян.17:10–15.Братия же немедленно ночью отправили Павла и Силу в Верию, куда они прибыв, пошли в синагогу Иудейскую. Здешние были благомысленнее Фессалоникских: они приняли слово со всем усердием, ежедневно разбирая Писания, точно ли это так. И многие из них уверовали, и из Еллинских почетных женщин и из мужчин немало. Но когда Фессалоникские Иудеи узнали, что и в Верии проповедано Павлом слово Божие, то пришли и туда, возбуждая и возмущая народ. Тогда братия тотчас отпустили Павла, как будто идущего к морю; а Сила и Тимофей остались там. Сопровождавшие Павла проводили его до Афин и, получив приказание к Силе и Тимофею, чтобы они скорее пришли к нему, отправились.'
      cn: (使徒行传 17:10-15) 弟兄們隨即在夜間打發保羅和西拉往庇哩亞去。二人到了，就進入猶太人的會堂。 這地方的人比帖撒羅尼迦的人更顯為貴，甘心領受這道，天天考查聖經，要曉得這道是與不是。 所以他們中間多有相信的，又有希臘尊貴的婦女，男子也不少。 但帖撒羅尼迦的猶太人知道保羅又在庇哩亞傳　上帝的道，也就往那裏去，聳動百姓。 當時，弟兄們便隨即打發保羅像是往海邊去；只是西拉和提摩太仍住在庇哩亞。 送保羅的人帶他到了雅典，既領了保羅的命，叫西拉和提摩太速速到他這裏來，就回去了。


        于是弟兄们当夜立刻打发保罗和西拉往庇哩亚去；他们到了那里，便进入犹太人的会堂。这里的人比帖撒罗尼迦的人心胸更宽广，他们以全副热忱领受了这道，天天查考圣经，要看这话是否如此。于是他们中有许多人信了，也有希腊尊贵的妇女，和不少男子。可是帖撒罗尼迦的犹太人一知道保罗也在庇哩亚传扬了上帝的道，就又到那里去煽动搅扰百姓。于是弟兄们立刻打发保罗去，好像要往海边去；而西拉和提摩太仍留在那里。护送保罗的人带他到了雅典，又得了命令，叫西拉和提摩太赶紧到他那里去，他们就走了。'
  - type: paragraph
    text:
      ru: Когда говорит«ежедневно разбирая Писания, точно ли это так», разумеет, что они исследовали Писание не как неверующие (потому что они уже уверовали), но как не знавшие пророческих преданий. Исследуя Писание и находя, что события, касавшиеся воплощения Господня, согласуются со словами древних пророков, они через это еще более укреплялись в вере.
      cn: 当说「每日查考圣经，是否确实如此」时，意指他们查考圣经并非作为不信者（因为他们已经信了），而是作为不熟悉先知预言之人。他们查考圣经并发现上主道成肉身之事与古时先知之言相符，便因此在信德上更加坚固。
  - type: paragraph
    text:
      ru: '«Тогда братия тотчас отпустили Павла… до Афин». Избегали опасностей апостолы не из боязни, а по Божиему внушению, потому что в этот, например, раз они перестали уже проповедовать и более уже не раздражали врагов. Из того же, что Павел удалился, вышла двоякая польза: и гнев врагов угасал, и проповедование распространялось далее. А что касается того, что посылают одного Павла, так это потому, что за него только боялись, чтобы не случилось что-нибудь, так как он был во главе. Таким образом, не всегда благодать содействовала им, но предоставляла их и себе самим, – то как бы пробуждая их, то ввергая в заботы.'
      cn: 「那时弟兄们立刻打发保罗……往雅典去。」使徒们躲避危险，并非出于惧怕，而是因为上帝的默示，因为，例如这一次，他们已经停止了传道，并且不再激怒敌人。保罗的离开产生了双重益处：一是敌人的怒气消退了，二是传道传播得更远了。至于只差遣保罗一人，那是因为他们只为他担心，恐怕他遭遇不测，因为他居于首位。如此一来，恩典并非总是与他们同工，而是也让他们依靠自己——有时是唤醒他们，有时是让他们陷入忧虑。
  - type: paragraph
    text:
      ru: 'Деян.17:16–21.В ожидании их в Афинах Павел возмутился духом при виде этого города, полного идолов. Итак он рассуждал в синагоге с Иудеями и с чтущими Бога, и ежедневно на площади со встречающимися. Некоторые из эпикурейских и стоических философов стали спорить с ним. И одни говорили: «что хочет сказать этот суеслов?», а другие: «кажется, он проповедует о чужих божествах», потому что он благовествовал им Иисуса и воскресение. И, взяв его, привели в ареопаг и говорили: можем ли мы знать, что это за новое учение, проповедуемое тобою? Ибо что-то странное ты влагаешь в уши наши. Посему хотим знать, что это такое? Афиняне же все и живущие у них иностранцы ни в чем охотнее не проводили время, как в том, чтобы говорить или слушать что-нибудь новое.'
      cn: (使徒行传 17:16-21) 保羅在雅典等候他們的時候，看見滿城都是偶像，就靈裏著急； 於是在會堂裏與猶太人和虔敬的人，並每日在市上所遇見的人，辯論。 還有伊壁鳩魯和斯多亞兩門的學士，與他爭論。有的說：「這胡言亂語的要說甚麽？」有的說：「他似乎是傳說外邦眾神的。」這話是因保羅傳講耶穌與復活的道。 他們就把他帶到亞略巴古，說：「你所講的這新道，我們也可以知道嗎？ 因為你有些奇怪的事傳到我們耳中，我們願意知道這些事是甚麼意思。」 （雅典人和住在那裏的客人都不顧別的事，只將新聞說說聽聽。）


        保罗在雅典等候他们的时候，看见这座城满是偶像，就心神激愤。于是他在会堂里与犹太人和敬畏上帝的人讲论，并且每天在广场上与偶然遇见的人讲论。有些伊壁鸠鲁派和斯多葛派的哲学家开始与他争辩。有些人说：「这胡言乱语者想说什么呢？」另一些人则说：「他似乎在宣讲异邦的神祇」，因为他向他们传讲耶稣和复活的事。于是他们拉着他，把他带到亚略巴古，说：「我们能否知道你所宣讲的这新教训是什么？因为你把一些奇特的事物传入我们耳中。所以我们想知道这是什么。」雅典人以及所有住在他们那里的外邦人，没有别的事更乐意去做，只爱讲说或听闻什么新鲜事。'
  - type: paragraph
    text:
      ru: Под выражением«возмутился духом»разумеется здесь не гнев, потому что дар благодати далек от гнева и негодования. Итак, что же значит«возмутился?»Был возбужден, не мог сносить, тревожился.
      cn: 对于「心神激动」这个表述，在此所指的并非愤怒，因为恩典的恩赐远离愤怒与怨恨。那么，「激动」是什么意思呢？祂被激动了，无法忍受，感到不安。
  - type: paragraph
    text:
      ru: «Некоторые из эпикурейских и стоических философов стали спорить с ним». Эпикурейцы говорили, что все существует без Божественного Промысла. Направляя свою речь преимущественно против них, Павел говорит, что Бог дает«всему жизнь и дыхание»(ст. 25),«назначив предопределенные времена и пределы их обитанию»(ст. 26), и доказывает таким образом Промышление Божие. Философы не смеялись над ним, когда он говорил это, потому что они и не понимали ничего из того, что говорилось. Да и как могли понимать апостола люди, видевшие Бога в теле, а блаженство – в плотских удовольствиях?
      cn: 「一些伊壁鸠鲁派和斯多葛派的哲学家开始与他辩论。」伊壁鸠鲁派认为，万物存在皆非出于上帝的护理。保罗主要针对他们发表言论，他说上帝赐予「万物生命和气息」（第25节），又「预先定准他们的年限和所住的疆界」（第26节），以此证明上帝的护理。当他讲这些话时，哲学家们并没有嘲笑他，因为他们根本不理解所说的一切。况且，那些把神看作肉身，将福乐视为肉体享乐的人，又怎能理解这位使徒呢？
  - type: paragraph
    text:
      ru: «Взяв его, привели в ареопаг». Не с тем, чтобы научиться от него, но с тем, чтобы наказать его, вели его на то место, где производится суд над убийцами. Ареопагом, или Ареевым (Марсовым) холмом, называлось это место потому, что здесь Арей (или Марс) был наказан за прелюбодеяние. Пагом же называлось возвышенное место, так как судилище это находилось на холме. Следует заметить, что философы эти, хотя все время проводили в беседах и слушании других, считали, однако же, сообщаемое Павлом новостью, которой они еще не слыхали. Если бы он проповедовал, что распят человек, то слово его было бы не новостью, а так как он говорил, что был распят и воскрес Бог, то говорил действительно новое.
      cn: 「将他抓住，带到亚略巴古。」带他去，不是为了向他学习，而是为了惩罚他，他们将他带到那审判杀人犯的地方。这地方被称为亚略巴古，或称亚略（或马尔斯）山，是因为亚略（或马尔斯）曾在此地因通奸受罚。而「巴古」则指高地，因为这个审判庭位于山上。值得注意的是，这些哲学家虽然终日沉浸于交谈和听取他人的言论，却认为保罗所传讲的是他们从未听过的新事。如果他宣讲被钉十字架的是一个人，那么他的话便不是新事；然而他所说的是，被钉十字架又复活的是神，那么他所说的确实是新事。
  - type: paragraph
    text:
      ru: 'Деян.17:22–29.И, став Павел среди ареопага, сказал: Афиняне! по всему вижу я, что вы как бы особенно набожны. Ибо, проходя и осматривая ваши святыни, я нашел и жертвенник, на котором написано: «неведомому Богу». Сего-то, Которого вы, не зная, чтите, я проповедую вам. Бог, сотворивший мир и все, что в нем, Он, будучи Господом неба и земли, не в рукотворенных храмах живет и не требует служения рук человеческих, как бы имеющий в чем-либо нужду, Сам дал всему жизнь и дыхание и всё. От одной крови Он произвел весь род человеческий для обитания по всему лицу земли, назначив предопределенные времена и пределы их обитанию, дабы они искали Бога, не ощутят ли Его и не найдут ли, хотя Он и недалеко от каждого из нас. Ибо мы Им живем и движемся и существуем, как и некоторые из ваших стихотворцев говорили: «мы Его и род». Итак мы, будучи родом Божиим, не должны думать, что Божество подобно золоту, или серебру, или камню получившему образ от искусства и вымысла человеческого.'
      cn: (使徒行传 17:22-29) 保羅站在馬爾斯山中，說：「眾位雅典人哪，我看你們凡事很迷信的。 我經過的時候，觀看你們所敬拜的，遇見一座壇，上面寫著『給那未識之神』。你們所不認識而敬拜的，我現在把他告訴你們。 創造宇宙和其中一切的　上帝，既是天地的　主，就不住人手所造的殿， 也不用人手敬拜，好像缺少甚麼；自己倒將生命、氣息、一切，賜給眾人。 他從一血脈造出列國的人住在全地上，並且預先定準他們的年限，和所住的疆界。 要叫他們尋求　主或者可以揣摩而得，其實他離我們各人不遠； 我們生活、動作、存留，都在乎他。就如你們作詩的，有人說：『我們也是他所生的。』 我們既是　上帝所生的，就不當以為　上帝的本性像人用手藝、心思，所雕刻的金、銀、石。
  - type: paragraph
    text:
      ru: 'Представляется, что апостол как бы хвалит афинян, говоря, что«они как бы особенно набожны», вместо того, чтобы назвать благочестивыми. А назвал их так по поводу жертвенника, поставленного ими по следующей причине. Однажды у афинян вспыхнула война с неприятелем; потерпев поражение, они удалились. И так как у них было в обычае праздновать игры в честь демонов, то один из демонов явился к ним и сказал, что он не видел еще от них никакой себе почести, поэтому он осердился на них и был причиной этого их поражения. Этому демону они построили храм, и как бы из опасения, чтобы и еще когда-нибудь не случилось с ними того же, если они обойдут какого-либо неведомого им Бога, поставили жертвенник с надписью«неведомому Богу», говоря этим, что если есть еще какой-либо иной Бог, Которого они не знают, то пусть жертвенник этот будет посвящен Ему; быть может, Он милостив будет к нам, хотя мы не почитаем Его, так как не знаем. Полная же надпись на жертвеннике была следующая: «Богам Азии и Европы и Ливии; Богу неведомому и чужому».'
      cn: 看来，使徒似乎是在称赞雅典人，说「他们似乎特别虔诚」，而不是称他们为敬虔的。他这样称呼他们，是因为他们所立的那个祭坛，是出于以下原因。有一次，雅典人与敌人爆发战争；他们遭受失败后便败退了。由于他们有举行敬拜鬼魔庆典的习俗，于是有一个鬼魔显现给他们，并说他从未从他们那里得到任何尊崇，因此他对他们发怒，并且是他们此次失败的原因。他们为这个鬼魔建造了一座庙宇，并且似乎是出于担忧，恐怕有朝一日同样的事情再次发生在他们身上，如果他们忽略了任何一个他们所不认识的上帝，他们就立了一个刻着「献给未识之上帝」铭文的祭坛，借此表示：如果还有任何其他上帝是他们所不认识的，那么这个祭坛就献给祂；也许祂会对我们施恩，尽管我们不尊崇祂，因为我们不认识祂。祭坛上完整的铭文如下：「献给亚洲、欧洲和利比亚诸神；献给未识之上帝与异邦之神。」
  - type: paragraph
    text:
      ru: '«Проходя и осматривая ваши святыни, я нашел и жертвенник». Нашел в городе не книгу Божественную, а жертвенник; и, воспользовавшись надписью на жертвеннике, разрушил его. Да что же и оставалось ему делать? Эллины все были неверующими. Если бы он стал беседовать с ними на основании евангельского учения, они стали бы смеяться над ним; если бы – на основании пророков, не имели бы доверия к нему. Он оружие неприятеля покорил его же оружием, – вот это-то и есть то, что он говорит: был«для чуждых закона – как чуждый закона»(1Кор. 9, 21). Увидел жертвенник – и надпись на нем обратил в свою пользу, а что еще важнее, так это то, что он изменил мнение афинян. На жертвеннике, говорится,«было написано: «неведомому Богу». Кто же был этот неведомый Бог, как не Христос? Неужели афиняне написали это во имя Христа? Если бы они написали это во имя Христа, то успех Павла в их обращении не представлял бы ничего удивительного. Нет, они написали это с иной целью, а Павел сумел придать надписи совершенно новое значение. Но следует сказать, ради какого Бога они написали«неведомому Богу». Много было у них богов и своих, и чужих. Об одних из них они получили сведения от матерей, а о других – от соседних народов. Итак, поскольку сначала не все боги сразу были приняты ими, а вводились мало-помалу, одни – их отцами, другие – дедами, а иные – уже в их время, то, собравшись вместе, они сказали: «Как этих богов прежде мы не знали, а потом впоследствии узнали их, так, быть может, есть и еще какой-либо Бог, Которого мы не знаем, и так как не знаем Его, хотя Он и Бог, то делаем ошибку, пренебрегая Им и не почитая Его». Поэтому они поставили жертвенник и сделали на нем надпись«неведомому Богу», говоря этой надписью, что если и еще есть какой-либо иной Бог, Которого они не знают, так и Его будут чтить. Обрати внимание на избыток бесобоязненности. Поэтому Павел говорит:«По всему вижу я, что вы как бы особенно набожны», потому что почитаете не только тех демонов, которые вам известны, но и тех, которых вы не узнали, и, пленив их умы, направил их умственные взоры на Христа.'
      cn: 「我巡行并仔细察看你们的敬拜之物时，也发现了一座祭坛。」在城中，他所发现的并非属神的书卷，而是一座祭坛；于是，他利用祭坛上的铭文，推翻了它。那么，他还能做什么呢？希腊人全都是不信者。倘若他开始以福音的教导与他们交谈，他们便会嘲笑他；倘若以先知的教训，他们也不会信任他。他以敌人的武器征服了敌人自己，——这正是他所说的：「对没有律法的人，我就作没有律法的人」（哥林多前书 9:21）。他看见了祭坛，便将坛上的铭文转为己用，而更重要的是，他改变了雅典人的观念。据说，祭坛上「写着：『献给未识之神』」。那么，这位未识之神是谁，岂不正是基督吗？难道雅典人是奉基督之名写下此语的吗？倘若他们真是奉基督之名写下此语，那么保罗使他们归信的成功便不足为奇了。不，他们写下此语另有目的，而保罗则巧妙地赋予了这铭文一个全新的意义。然而，有必要说明，他们是为了哪位神而写下「献给未识之神」的。他们有许多神祇，既有自己的，也有外来的。他们关于其中一些神的知识得自母亲的教导，而另一些则来自邻近的民族。如此，由于并非所有的神祇都一下子就被他们接受，而是逐渐被引入，有的是由他们的父辈，有的是由他们的祖辈，还有一些则是在他们自己的时代，于是，他们聚集一堂，说道：「正如这些神祇我们以前不认识，后来才认识了他们，也许还有一些我们不认识的神，而且既然我们不认识祂，尽管祂是神，我们却忽略祂、不尊敬祂，那就是犯错了。」因此，他们便设立了一个祭坛，并在上面写着「献给未识之神」，藉着这铭文表示，倘若还有他们不认识的任何其他神，他们也会敬奉祂。请留意他们对鬼神的过度畏惧。因此，保罗说：「我凡事察看，见你们甚是敬虔」，因为你们不仅敬奉那些已知晓的鬼神，连那些你们所未认识的也敬奉，于是，他俘获了他们的心智，将他们思想的目光引向了基督。
  - type: paragraph
    text:
      ru: '«Сего-то, Которого вы, не зная, чтите, я проповедую вам». Афиняне намеревались обвинить Павла, говоря: «Ты вводишь новое учение, вводишь Бога, Которого мы не знаем». Поэтому, желая освободиться от подозрения и показать, что он проповедует не нового Бога, но Того, Которого они прежде него почтили уже служением, говорит: «Вы предупредили меня, ваше служение Ему упредило мою проповедь, потому что я возвещаю вам Того Бога, Которого вы почитаете не зная».'
      cn: 「就是这位，你们不认识却敬拜的，我传给你们。」雅典人打算控告保罗，说：「你引进新学说，引进一位我们不认识的上帝。」因此，他想摆脱嫌疑，并表明他所宣讲的并非一位新的上帝，而是那一位，在保罗之前他们就已经以事奉尊崇了祂的，便说：「你们走在我前面，你们对祂的事奉先行于我的宣讲，因为我向你们宣讲的正是那一位上帝，你们不认识却敬拜的。」
  - type: paragraph
    text:
      ru: «Бог, сотворивший мир и всё, что в нем». Сказал одно слово и подорвал все положения философов. Эпикурейцы утверждают, что все произошло само собой и из атомов, а он говорит, что мир и все, что в нем, – дело Божие.
      cn: «上帝，祂创造了世界和其中一切凡物。» 祂只说了一句话，便推翻了所有哲学家的论点。伊壁鸠鲁主义者主张一切事物皆自行发生并源于原子，而祂却说世界及其中的一切都是上帝的作为。
  - type: paragraph
    text:
      ru: «Не в рукотворенных храмах живет и не требует служения рук человеческих». Чтобы не подумали, что проповедуется один из многих их богов, Павел дополняет сказанное:«не в рукотворенных храмах живет», но в человеческой душе. Итак, что же? Он не жил в иерусалимском храме? Да, не жил, но действовал. Как же иудеи почитали Его при содействии рук? Не при содействии рук, но мыслью, потому что Он не требовал чувственного, не нуждаясь в этом:«Ем ли Я мясо волов и пью ли кровь козлов?»(Пс. 49, 13)
      cn: 「祂不住在人手所造的殿里，也不用人手服事。」为了避免人们认为他所宣讲的不过是他们众多神祇中的一个，保罗补充说：「祂不住在人手所造的殿里」，而是住在人的灵魂中。那么，这是什么意思呢？祂没有住在耶路撒冷的圣殿里吗？是的，祂没有住在那里，但却在那里行动。那么犹太人是如何用人手的服事敬拜祂的呢？不是用人手的服事，而是借着意念，因为祂不需要这些感官之物，对此毫无所求：「我岂吃公牛的肉，喝山羊的血吗？」(诗篇 49:13)
  - type: paragraph
    text:
      ru: '«Не требует… Сам дая всему жизнь и дыхание и всё». Два доказательства Божественности, именно: что Бог ни в чем не нуждается и всем дарует все. Но здесь же Павел показывает и то, что Бог не отец, а Творец души.'
      cn: 「祂不需要……祂亲自赐予万物生命、气息以及一切。」这是上帝神性的两个证据，即：上帝在任何事上都无所需求，并且赐予万物一切。然而，保罗在此也揭示了，上帝并非灵魂的父亲，而是灵魂的创造者。
  - type: paragraph
    text:
      ru: «Назначив предопределенные времена». Назначил, чтобы«искали Бога», но не навсегда, а на«предопределенные времена». Павел показывает, что, и не отыскав Господа, они обрели Его. А так как, отыскивая Его, они не находили, то он показывает также, что Господь так очевиден, как какой-нибудь предмет, рассматриваемый на видном месте, потому что невозможно, чтобы небо было здесь, а в другом месте его не было; невозможно также, чтобы оно было в это время, а в другое – нет. Итак, во всякое время и во всяком месте можно обрести Господа. Бог так устроил, что мы не встречаем препятствия в этом ни со стороны места, ни со стороны времени. То, что небо находится везде и установлено (предопределено) на все времена, особенно сильно действовало на слушателей. Господь так близок к нам, говорит апостол, что без Него невозможно жить.
      cn: «预定好的时节»。祂设定，为的是«寻求上帝»，但不是永远，而是为了«预定好的时节»。保禄指出，即便没有主动寻求上主，他们也已获得了祂。又因为，他们在寻求祂时未能寻得，所以他也指出，上主是如此显而易见，如同在显眼之处被观察的任何事物，因为天不可能只在这里，而在别处就没有；同样，天也不可能只在这个时候存在，而在另一个时候就不存在。因此，在任何时候和任何地方都能获得上主。上帝如此安排，以致我们在这方面不会遇到障碍，无论是从空间方面，还是从时间方面。天无处不在，且为所有时节所设定（预定），对听众产生了特别强大的影响。使徒说，上主是如此地临近我们，没有祂，就无法生存。
  - type: paragraph
    text:
      ru: '«Им живем и движемся и существуем». Близость Господа доказывает посредством чувственного примера: невозможно, говорит, не знать, что воздух разлит всюду и находится не только близ каждого из нас, но и в нас самих. То, что мы от Бога получили жизнь, что действуем и не погибаем, – все это называет промышлением и попечением Божиим о нас.'
      cn: 「靠祂我们生活、动作、存留。」 上帝的亲近，借着一个可感知的例子来证明：他说，不可能不知道空气弥漫各处，不仅存在于我们每个人身旁，而且在我们自身之内。我们从上帝领受了生命，我们有动作，并且不灭亡——这一切，他都称作上帝对我们的护理与眷顾。
  - type: paragraph
    text:
      ru: '«Как и некоторые из ваших стихотворцев говорили». Один мудрец, Арат, сказал о Зевсе: «Наш род от него». А апостол говорит о Творце:«Мы – Его… род», – не утверждая, что Творец и Зевс – одно и то же, – да не будет! – но прилагая это выражение собственно к Творцу, как и жертвенник назвал жертвенником Его (Творца), а не того, кого чтили афиняне. Назвал нас родом Божиим, то есть самыми близкими родственниками, так как от нашего рода Бог благоволил на земле родиться. Не сказал:"не должны"вы«думать, что Божество подобно золоту или серебру, или камню», но употребил более смиренный оборот:«мы… не должны». Заметь, как внес в свою речь предмет сверхчувственный, потому что с представлением о теле мы соединяем и представление о расстоянии.'
      cn: 「正如你们中间有些诗哲曾说。」一位智者阿拉特曾论及宙斯说：「我们乃从他而出。」而使徒论及造物主说：「我们是祂的……族类」——并非主张造物主与宙斯乃是同一位，—断乎不是！—而是将此表达专门用于造物主，正如他称祭坛为祂（造物主）的祭坛，而非雅典人所敬拜的那位。他称我们为上帝的族类，亦即最亲近的亲属，因为上帝曾乐意从我们的族类中在世上降生。他并未说「你们不应该」去「思想神性如同金银或石头」，而是使用了一种更为谦卑的说法：「我们……不应该。」请注意，他如何将一个超感官的客体引入自己的言语中，因为我们在对身体的观念中，也结合了对距离的观念。
  - type: paragraph
    text:
      ru: 'Деян.17:30–34.Итак, оставляя времена неведения, Бог ныне повелевает людям всем повсюду покаяться. Ибо Он назначил день, в который будет праведно судить вселенную, посредством предопределенного Им Мужа, подав удостоверение всем, воскресив Его из мертвых. Услышав о воскресении мертвых, одни насмехались, а другие говорили: об этом послушаем тебя в другое время. Итак Павел вышел из среды их. Некоторые же мужи, пристав к нему, уверовали; между ними былДионисий Ареопагити женщина, именем Дамарь, и другие с ними.'
      cn: (使徒行传 17:30-34) 世人蒙昧無知的時候，　上帝視若不見，如今卻吩咐各處的人都要悔改。 因為他已經定了日子，要以他所設立的人按公義審判世界；他已叫他從死裏復活，給眾人作可信的憑據。」 眾人聽見從死裏復活的話，就有譏誚他的；又有人說：「我們再聽你講這個吧。」 於是保羅從他們當中離開去了。 但有幾個人貼近他，信了主，其中有亞略巴古的官丟尼修，並一個婦人，名叫大馬哩，還有別人一同信從。


        于是，上帝忽略了那些无知的时代，如今却吩咐各处的所有人悔改。因为他已经定下了一个日子，在那日，他要藉着他所预定的一位男子，按公义审判普世，他已向众人提供了确据，就是使他从死人中复活。


        当他们听见死人复活的事，有的就嗤笑，另有的说：「关于这事，我们以后再听你讲吧。」于是保罗就离开了他们。但有一些男子附从他，就信了，其中有亚略巴古的丢尼修，还有一位妇人，名叫达玛丽，以及其他一些人。'
  - type: paragraph
    text:
      ru: 'В виду имеет не умерших, когда говорит времена«неведения», но тех, кому проповедал. Не говорит также: «Вы добровольно совершили злодеяние», но – «Вы не знали». Итак, он объявляет это слушателям, не требуя наказания их как достойных наказания, но призывая их к покаянию.'
      cn: 意指的不是那些已死之人，当他说到「蒙昧时期」的时候，而是那些他曾向其传道的人。他也没有说：「你们是自愿作恶的」，而是说——「你们是蒙昧无知的」。因此，他向听众宣告此事，不是要求惩罚他们，如同他们是当受惩罚的，而是召叫他们悔改。
  - type: paragraph
    text:
      ru: «Ибо Он назначил день, в который будет праведно судить вселенную». Непременно, говорит, будет судить за все дела и помышления через"Мужа", Которого определил быть Судиею живых и мертвых. Это – вочеловечившийся Господь. Выслушав великую и высокую истину, они не сказали Павлу ни слова, но воскресение осмеивали:«Душевный человек не принимает того, что от Духа Божия»(1Кор. 2, 14).
      cn: 「因为祂已经定下了日子，在那日，祂要凭公义审判普世。」经文说，祂必藉着祂所定规作活人死人审判者的「那人」，审判一切的行为和思想。这「那人」就是道成肉身的上主。他们听了这伟大而崇高的真理后，没有对保罗说一句话，却嘲笑复活的道理：「属血气的人不领会上帝圣灵的事」(哥林多前书 2:14)。
  - type: paragraph
    text:
      ru: «Итак Павел вышел из среды их». Как? Одних убедив, а другими будучи осмеян.
      cn: 「于是保罗从他们中间出来了。」如何？劝服了一些人，却受到另一些人的嘲笑。
  - type: paragraph
    text:
      ru: «Некоторые же мужи, пристав к нему, уверовали; между ними былДионисий Ареопагит». Судилище находилось на Марсовом холму, вне города. Ареопагиты разбирали все обиды и все преступления. Поэтому Павла, как проповедника чужих богов, влекут в собрание ареопага; но один из тогдашних членов ареопага, божественный Дионисий, по праву судии подал голос за истину и, раскланявшись с неразумным торжественным собранием ареопагитов, удостоился просвещения светом истины. Хотя Греция и была в то время под владычеством римлян, но Афинам и Лакедемону они предоставили автономию. Поэтому должности судей в Афинах и занимали ареопагиты. Учение о спасении сообщается Дионисию через Павла, а руководится он, как ученик учителем, великим Иерофеем.
      cn: 然而，有些男子归附于他，并相信了；其中有亚略巴古的丢尼修。审判所位于马尔斯山丘上，在城外。亚略巴古议员审理一切伤害和一切罪行。因此，保罗作为异邦神祇的宣讲者，被引到亚略巴古的集会中；但当时亚略巴古的一位成员，神圣的丢尼修，凭着法官的权利为真理发声，并辞别了那不理智的亚略巴古庄严集会后，蒙受了真理之光的启迪。虽然当时希腊处于罗马人的统治之下，但他们却赋予雅典和拉刻代蒙自治权。因此，雅典的法官职位便由亚略巴古议员担任。救恩的教义透过保罗传授给丢尼修，而他则像学生受老师引导一般，受伟大的耶罗提乌斯指导。
- type: heading1
  text:
    ru: Глава восемнадцатая
    cn: 第十八章
  children:
  - type: paragraph
    text:
      ru: 'Деян.18:1–6.После сего Павел, оставив Афины, пришел в Коринф. И, найдя некоторого Иудея, именем Акилу, родом Понтянина, недавно пришедшего из Италии, и Прискиллу, жену его, – потому что Клавдий повелев всем Иудеям удалиться из Рима, – пришел к ним; и, по одинаковости ремесла, остался у них и работал; ибо ремеслом их было делание палаток. Во всякую же субботу он говорил в синагоге и убеждал Иудеев и Еллинов. А когда пришли из Македонии Сила и Тимофей, то Павел понуждаем был духом свидетельствовать Иудеям, что Иисус есть Христос. Но как они противились и злословили, то он, отрясши одежды свои, сказал к ним: кровь ваша на главах ваших; я чист; отныне иду к язычникам.'
      cn: (使徒行传 18:1-6) 這些事以後，保羅離了雅典，來到哥林多。 遇見一個猶太人，名叫亞居拉，他生在本都；（因為克勞第命猶太人都離開羅馬；）新近帶著妻百基拉，從意大利來。保羅就投奔了他們。 他們本是製造帳棚為業。保羅因與他們同業，就和他們同住作工。 每逢安息日，保羅在會堂裏辯論，勸化猶太人和希臘人。 西拉和提摩太從馬其頓來的時候，保羅靈裏迫切，向猶太人證明耶穌是　基督。 他們既抗拒、褻瀆，保羅就抖著衣服，對他們說：「你們的血歸到你們自己頭上；我是乾淨的。從今以後，我要往外邦人那裏去。」


        此后，保罗离开雅典，来到哥林多。在那里遇见一个犹太人，名叫亚居拉，生在本都，从意大利新近来的，还有他妻子百基拉，（因为革老丢曾谕令所有犹太人离开罗马，）保罗就到他们那里去；因为职业相同，便和他们同住，并且一同作工，原来他们是以制造帐篷为业的。每逢安息日，他就在会堂里讲论，劝化犹太人和希腊人。及至西拉和提摩太从马其顿下来的时候，保罗就被圣灵催逼，向犹太人证明耶稣是基督。可是他们抗拒并亵渎的时候，他就抖着自己的衣服，对他们说：「你们的血归到你们自己的头上，我是清白的。从今以后，我要往外邦人那里去了。」'
  - type: paragraph
    text:
      ru: Павел был приведен Духом в Коринф; и в Коринфе должен был он оставаться, потому что афиняне, несмотря на то, что любили слушать новости, не внимали истине, так как заботились не о существе дела, а о том, чтобы всегда быть в состоянии сказать что-нибудь. Итак, Павел признал достаточным бросить там только семя.
      cn: 保罗被圣灵带领到哥林多；并且他必须留在哥林多，因为雅典人，尽管喜欢听新奇的事，却不留意真理，他们不关注事情的实质，而是为了总能说出些什么。因此，保罗认为在那里只播撒种子就足够了。
  - type: paragraph
    text:
      ru: «Потому что Клавдий повелел». При Нероне Павел достиг совершенства, а при Клавдии загоралась война против иудеев, и они, как люди опасные, изгонялись из Рима. Поэтому Промысл устрояет, что он был отведен туда узником, чтобы не быть изгнанным ему, как иудеянину.
      cn: «因为克劳狄下令。»在尼禄在位时，保罗达到了至善，而在克劳狄在位时，一场针对犹太人的战争爆发了，他们，作为危险分子，被逐出罗马。因此，上帝的旨意安排他作为囚犯被带到那里，以免他作为犹太人被逐出罗马。
  - type: paragraph
    text:
      ru: «По одинаковости ремесла, остался у них и работал». Потому остался, что нашел пристанище у них удобным, так как оно было для него удобнее многих царских чертогов, как и для атлета арена более полезна, чем мягкие ковры, и для воина необходим железный меч, а не золотой.
      cn: «因着手艺相通，便与他们住下并劳作了》。他之所以留下，是因为他觉得在他们那里找到的安身之所是便利的，因为它对他而言，比许多君王的殿宇更为适宜，正如竞技场对于一名竞技者而言，比柔软的地毯更有益处，而对于一名战士而言，所必需的乃是铁剑，而非金剑。
  - type: paragraph
    text:
      ru: «Отрясши одежды свои, сказал к ним»,чтобы устрашить их не словом только, но и делом.
      cn: «抖落自己的衣裳，对他们说»，为要不单用言语，也用行动来惊吓他们。
  - type: paragraph
    text:
      ru: '«Кровь ваша на главах ваших». Неясное изречение. Думаю, что Павел говорит: «Каждый, кто отступает от Христа, Который есть жизнь, представляется убивающим себя самого, так как переходит от жизни к смерти и через наносимое себе самому убийство проливает некоторым образом собственную кровь». Или он говорит следующее: «За то, что через неверие вы убиваете себя самих, отвечать перед судом будете вы же сами, так как я невиновен в этом». Отсюда можно заключить, что самоубийца наказывается Богом как убийца.'
      cn: 「你们的血在你们头上。」一句含义不清的说法。我认为保罗的意思是：「凡是离弃基督——祂是生命——的人，就好像是在自我戕害，因为他从生命转向了死亡，并借着这种自我戕害的方式，在某种意义上流了自己的血。」或者他是在说以下的话：「因为你们因不信而自我毁灭，你们将亲自在审判台前负责，因为我对此是无辜的。」由此可以得出结论，自杀者将受到上帝的惩罚，如同杀人犯一般。
  - type: paragraph
    text:
      ru: 'Деян.18:7–11.И пошел оттуда, и пришел к некоторому чтущему Бога, именем Иусту, которого дом был подле синагоги. Крисп же, начальник синагоги, уверовал в Господа со всем домом своим, и многие из Коринфян, слушая, уверовали и крестились. Господь же в видении ночью сказал Павлу: не бойся, но говори и не умолкай, ибо Я с тобою, и никто не сделает тебе зла, потому что у Меня много людей в этом городе. И он оставался там год и шесть месяцев, поучая их слову Божию.'
      cn: (使徒行传 18:7-11) 他於是離開那裏，到了一個人的家中，這人名叫猶士都，是敬拜　上帝的，他的家靠近會堂。 總管會堂的基利司布和全家都信了　主；還有許多哥林多人聽了，就相信受浸。 夜間，　主在異象中對保羅說：「不要怕，你只管講，不要閉口； 有我與你同在，必沒有人下手害你，因為在這城裏我有許多的百姓。」 保羅在那裏住了一年零六個月，將　上帝的道教訓他們。

        他便离开那里，来到一个敬畏上帝的人那里，名叫犹士都，他的家毗连着会堂。管会堂的基利司布，与他全家都信了主；许多哥林多人听了，也信了主，并且受了洗。夜间，主在异象中对保罗说：「不要惧怕，只管讲说，不要缄默，因为我与你同在，必没有人能害你，因为在这城里，我有许多子民。」保罗在那里住了一年零六个月，将上帝的圣道教训他们。'
  - type: paragraph
    text:
      ru: Многие воспламенились от того, что Павел находился по соседству.
      cn: 许多人因保罗就在附近，心被火热。
  - type: paragraph
    text:
      ru: «Крисп… начальник синагоги, уверовал в Господа». Это тот самый Крисп, о котором говорит Павел:«никого из вас не крестил, кроме Криспа и Гаия»(1Кор. 1, 14).
      cn: 「居士布……会堂总管，信了主。」 这就是保罗所说的那一位居士布：「除了居士布和该犹以外，我没有给你们中的任何人施洗」(哥林多前书 1:14)。
  - type: paragraph
    text:
      ru: «Не бойся, но говори и не умолкай». Наконец Господь говорит Павлу то, в чем он особенно нуждался, потому что ничто его так не печалило, как неверие.
      cn: «不要惧怕，只管讲，不要闭口不言！» 最终，主对保禄说了他尤其需要的话，因为没有什么比不信更令他忧伤了。
  - type: paragraph
    text:
      ru: 'Деян.18:12–18.Между тем, во время проконсульства Галлиона в Ахаии, напали Иудеи единодушно на Павла и привели его пред судилище, говоря, что он учит людей чтить Бога не по закону. Когда же Павел хотел открыть уста, Галлион сказал Иудеям: Иудеи! если бы какая-нибудь была обида или злой умысел, то я имел бы причину выслушать вас, но когда идет спор об учении и об именах и о законе вашем, то разбирайте сами; я не хочу быть судьею в этом. И прогнал их от судилища. А все Еллины, схватив Сосфена, начальника синагоги, били его перед судилищем; и Галлион нимало не беспокоился о том. Павел, пробыв еще довольно дней, простился с братиями и отплыл в Сирию, – и с ним Акила и Прискилла, – остригши голову в Кенхреях, по обету.'
      cn: (使徒行传 18:12-18) 到迦流作亞該亞省長的時候，猶太人同心起來作亂，攻擊保羅，拉他到公堂， 說：「這個人勸人不按著律法敬拜　上帝。」 保羅剛要開口，迦流就對猶太人說：「你們這些猶太人啊。如果是為不義或奸惡的事，我理當耐性聽你們。 但所爭論的，若是關乎言語、名目，和你們的律法，你們自己去辦吧。這樣的事我不願意審問。」 他就把他們趕出公堂。 眾希臘人便揪住總管會堂的所提尼，在堂前打他。那些事迦流都不管。 此事以後，保羅仍住了好一段時候，就辭別了弟兄，坐船往敘利亞去；百基拉，亞居拉和他同去。他因為許過願，就在堅革哩剪了頭髮。


        在此期间，在迦流作亚该亚方伯的时候，犹太人同心合意地攻击保罗，将他带到审判台前，说他教人以不合律法的方式敬拜上帝。当保罗开口要说话时，迦流对犹太人说：「犹太人哪！若有任何不法行为或恶劣诡计，我自会合理地审理你们的案件；但若是关乎教义、名号以及你们的律法，你们自己解决吧；我不愿作这些事的审判官。」于是将他们从审判台前赶走。所有的希腊人，抓住了管会堂的所司提尼，在审判台前殴打他；迦流对此毫不在意。保罗又住了多日，辞别了弟兄们，船往叙利亚去，——同行的有亚居拉和百基拉，——在坚革哩剃了头发，因为他许过愿。'
  - type: paragraph
    text:
      ru: Как же, спросит кто-нибудь,«напали Иудеи единодушно на Павла?»Внезапно схватив его. И однако ж ничего не осмелились сделать, но привели его к проконсулу. А он изгнал их из судилища. Кажется мне, это был один из гуманных людей.
      cn: 那么，有人会问，「犹太人是怎样同心协力攻击保罗的呢？」猛地抓住他。然而他们却不敢做任何事，而是把他带到方伯那里。而方伯把他们驱逐出审判厅。在我看来，这人是一位仁慈的人。
  - type: paragraph
    text:
      ru: '«А все Еллины, схватив Сосфена». Что же касается того, что они били Сосфена, так это или потому, что и он, как и начальник синагоги Крисп, предан был более Павлу, или уже они так далеко зашли в неистовстве, что, забыв свои планы, вместо Павла стали бить Сосфена, или же били его потому, что хотели убить Павла, а Сосфен не позволил им. Били Сосфена, поступали противозаконно в виду самого начальника, говоря этим: если всякий делает то, что хочет, если закона более не существует, так вот и мы бьем его. Проконсул же не останавливал их, но позволял им бить друг друга. Если бы они поступили так не по отношению к себе самим, а по отношению к кому-нибудь из другой нации, то он, конечно, образумил бы их.'
      cn: 「众希腊人就揪住所提尼。」至于他们殴打所提尼一事，这要么是因为他，就像会堂主管基利司布一样，更加忠于保罗；要么是因为他们已狂暴到如此地步，以至于忘记了他们的初衷，转而殴打所提尼而不是保罗；又或者是他们殴打他，因为他们想杀害保罗，而所提尼阻止了他们。他们殴打所提尼，在巡抚本人面前非法行事，以此表明：「如果人人都随心所欲，如果法律已不复存在，那么我们也要殴打他。」而巡抚却没有阻止他们，反而任凭他们彼此殴打。如果他们这样做不是针对自己人，而是针对其他民族的人，那么他当然会加以训诫。
  - type: paragraph
    text:
      ru: «Отплыл в Сирию, – и с ним Акила и Прискилла, – остригши голову в Кенхреях». Так как иудеям казалось, что Павел учит отступничеству от закона, и так как многие гнушались его и не принимали его проповеди, то и здесь, и в храме иерусалимском делает это с высокой целью. Это – то же, что он говорил:«был для чуждых закона… как чуждый закона, чтобы приобрести чуждых закона»(1Кор. 9, 20).
      cn: 「启程往叙利亚——与他同行的有亚基拉和百基拉——在坚革哩剃了头。」因为犹太人认为保罗教导人背弃律法，又因为许多人厌弃他，不接受他的宣讲，所以，他无论在这里，还是在耶路撒冷圣殿，这样做都是出于崇高的目的。这与他所说的相同：「向没有律法的人……就作没有律法的人，为要得着没有律法的人。」(哥林多前书 9:20)。
  - type: paragraph
    text:
      ru: '"По обету". Разумеет обет отречения. Дал обет остричь волосы, чтобы свою деятельность более не посвящать уже мирским делам, подобно мирским людям, но чтобы, подобно человеку, живущему по Боге, посвятить себя Церкви. И Акила, также по обету, остриг свои волосы, потому что это делалось теми, кто хотел жить богоугодно, но вместе с тем это был древний обычай у иудеев. Поэтому и пострижение монахов целесообразно.'
      cn: 「根据誓愿」。意指弃绝的誓愿。他立誓剪去头发，是为了不再像世俗之人那样，将自己的活动献给世俗之事，而是要像活在上帝里的人那样，将自己献给教会。亚基拉也按着誓愿剪去头发，因为这是那些想要按上帝旨意而活的人所行的，但与此同时，这也是犹太人中的一项古老习俗。因此，修士的剪发（受戒）也是合宜的。
  - type: paragraph
    text:
      ru: Деян.18:19–20.Достигнув Ефеса, оставил их там, а сам вошел в синагогу и рассуждал с Иудеями. Когда же они просили его побыть у них долее, он не согласился.
      cn: (使徒行传 18:19-20) 保羅到了以弗所，就把他們留在那裏；自己卻進了會堂，和猶太人辯論。 眾人請他同他們多住些日子，他卻不允；
  - type: paragraph
    text:
      ru: Акилу и Прискиллу оставил в Ефесе, без сомнения, с тем, чтобы они учили, ибо, пробыв с Павлом так много времени, они научились многому.
      cn: 亚基拉和百基拉被留在以弗所，无疑是为了让他们教导，因为与保罗相处了如此长的时间，他们学到了很多。
  - type: paragraph
    text:
      ru: 'Деян.18:21–23.А простился с ними, сказав: мне нужно непременно провести приближающийся праздник в Иерусалиме; к вам же возвращусь опять, если будет угодно Богу. И отправился из Ефеса. (Акила же и Прискилла остались в Ефесе.) Побывав в Кесарии, он приходил в Иерусалим, приветствовалцерковьи отошел в Антиохию. И, проведя там несколько времени, вышел, и проходил по порядку страну Галатийскую и Фригию, утверждая всех учеников.'
      cn: (使徒行传 18:21-23) 卻辭別他們，說：「我務要在耶路撒冷守這將到的節期。　上帝若許我，我還要回到你們這裏。」於是開船離了以弗所。 他在凱撒利亞下了船，就上耶路撒冷去問教會安，隨後下安提阿去。 他住了些日子，又離開那裏，按次序走遍加拉太和弗呂家各地，堅固眾門徒。


        与他们辞别，说：「我必须在耶路撒冷度过这即将到来的节期；如果上帝乐意，我还会再回到你们这里。」于是他从以弗所出发了。（亚居拉和百基拉则留在了以弗所。）他在凯撒利亚停留后，来到耶路撒冷，问候了教会，便前往安提阿。他在那里待了些时候，就离开了，按次序经过了加拉太和弗吕家地区，坚固所有的门徒。'
  - type: paragraph
    text:
      ru: «К вам возвращусь опять». Будучи пророком и зная, что ему следовало возвратиться, Павел дал обещание снова возвратиться в Ефес. А чтобы никто не делал того же самого по неразумию, давая безотчетное обещание сделать то или другое, Павел научил нас не давать никакого обещания в будущем без присовокупления слов«если будет угодно Богу»,потому что никто не знает, что принесет следующий день. Поэтому безумен тот, кто не ограничивает своего обещания словами«если будет угодно Богу»;потому что если кто будет обещать с самоуверенностью, что непременно сделает, тот часто будет выслушивать следующие слова:«Безумный! в сию ночь душу твою возьмут у тебя; кому же достанется то, что ты заготовил»(Лк. 12, 20)?
      cn: «我必再回到你们那里去。» 保罗作为先知，知道他必将回去，便应许再次返回以弗所。为免有人因不智而做出同样的事，许下不加思索的诺言去做这或去做那，保罗教导我们，在未来不应许下任何诺言，除非附带「如果蒙上帝喜悦」这几个字，因为无人知晓次日将带来什么。因此，那不以「如果蒙上帝喜悦」之言限制其诺言的人，乃是愚妄的；因为若有人自恃必能成就某事而许诺，他常常会听到以下的话：「愚妄人哪，今夜必要你的灵魂；你所预备的，要归谁呢？」（路加福音 12:20）
  - type: paragraph
    text:
      ru: Посещать верующих и укреплять их было всегдашним правилом Павла, чтобы, если найдет их ослабевшими, облегчить их бремя наставническим назиданием.
      cn: 拜访信徒并坚固他们，一直是保罗的常例，以便，如果发现他们软弱了，就藉着教诲性的训导减轻他们的重担。
  - type: paragraph
    text:
      ru: Деян.18:24–25.Некто Иудей, именем Аполлос, родом из Александрии, муж красноречивый и сведущий в Писаниях, пришел в Ефес. Он был наставлен в начатках пути Господня и, горя духом, говорил и учил о Господе правильно, зная только крещение Иоанново.
      cn: (使徒行传 18:24-25) 有一個猶太人，名叫亞波羅，來到以弗所。他生在亞力山太，是有口才的，最能講解聖經。 這人已經在主的道上受了教訓，靈裏火熱，將　主的事竭力講論教訓人；只是他單曉得約翰的浸禮。
  - type: paragraph
    text:
      ru: Некоторые утверждают, что«Аполлос»этот есть Аполлос, епископ Коринфский, о котором Павел пишет:«Что до брата Аполлоса, я очень просил его»(1Кор. 16, 12); также:«Я насадил, Аполлос поливал, но возрастил Бог»(1Кор. 3, 6).
      cn: 有些人主张，这位「亚波罗」就是哥林多的主教亚波罗，保罗论及他时写道：「至于弟兄亚波罗，我曾恳切地请求他」（哥林多前书 16:12）；又说：「我栽种了，亚波罗浇灌了，唯有上帝使其生长」（哥林多前书 3:6）。
  - type: paragraph
    text:
      ru: Деян.18:26–28.Он начал смело говорить в синагоге. Услышав его, Акила и Прискилла приняли его и точнее объяснили ему путь Господень. А когда он вознамерился идти в Ахаию, то братия послали к тамошним ученикам, располагая их принять его; и он, прибыв туда, много содействовал уверовавшим благодатью. Ибо он сильно опровергал Иудеев всенародно, доказывая Писаниями, что Иисус есть Христос.
      cn: (使徒行传 18:26-28) 他在會堂裏放膽講起道來；百基拉，亞居拉聽見，就接他來，將　上帝的道給他講解更加完備。 他想要往亞該亞去，弟兄們就寫信勸門徒接待他。他到了那裏，多多幫助那蒙恩信主的人； 因他在眾人面前大大駁倒猶太人，引聖經證明耶穌是　基督。

        他开始在会堂里大胆地讲论。亚居拉和百基拉听见他，就接他来，将上帝之道给他讲解得更加准确。及至他有意去亚该亚，弟兄们就写信给那里的门徒，劝他们接待他。他到了那里，就藉着恩典，多多帮助了那些已信之人。因为他在众人面前极力驳倒犹太人，引证圣经，证明耶稣是基督。'
  - type: paragraph
    text:
      ru: Если Аполлос крещен был только крещением Иоанновым, то каким образом он пламенеет Духом? Дух Святый не сообщался таким образом. И если его последователи нуждались в крещении Христовом, то гораздо более нуждался в нем он сам. Итак, что сказать на это? Мне кажется, что Аполлос из числа ста двадцати, крещенных вместе с апостолами, или, если не так, то и с ним было то же, что и с Корнилием. Крещение Иоанново призвало к покаянию, но не доставляло в то же время очищения от греха, так что различие между крещением Иоанновым и крещением верующих заключается в том, что крещение верующих дарует оставление грехов, так как верующий крещается во имя Отца и Сына и Святаго Духа и омывается от предшествовавших крещению заблуждений. Если же крещенные Иоанном не имели Святаго Духа, то каким образом Аполлос, крещенный только Иоанновым крещением, пламенел Духом? Но в таком случае, если он и пламенел Духом, все же не имел Святаго Духа, потому что не говорил разными языками, не пророчествовал; иное дело пламенеть Духом, и иное – иметь Святаго Духа. Имеющий Святаго Духа имеет Его обитающим в себе, и Сам Дух вещает ему из сердца его, как вещал апостолам – то запрещая, то повелевая им глаголати (произносить) слово. А пламенеющий Духом совершает что-либо под руководством Духа через освящение и наставление внешнее; так как от чувственного следует заключать к невидимому.
      cn: 如果亚波罗仅受了约翰的洗礼，那么他怎能灵里火热呢？圣灵不会以这种方式赐予。如果他的门徒需要受基督的洗礼，那么他自己则更需要。那么，对此该如何解释呢？我认为亚波罗属于与使徒们一同受洗的那一百二十人之一，又或者，如果不是这样，那么他所经历的，与哥尼流所经历的相同。约翰的洗礼呼召人悔改，但同时并不带来罪的洁净，因此，约翰的洗礼与信徒的洗礼之间的区别在于，信徒的洗礼赐予罪的赦免，因为信徒是奉父、子、圣灵之名受洗，并洗净了受洗前的一切谬误。如果受约翰洗礼的人没有圣灵，那么仅受约翰洗礼的亚波罗，怎能灵里火热呢？但在这种情况下，即便他灵里火热，仍然没有圣灵，因为他没有说方言，也没有说预言；灵里火热是一回事，拥有圣灵是另一回事。拥有圣灵的人，有圣灵内住于自己之中，圣灵亲自从他心中向他说话，正如祂向使徒们说话一样——或禁止，或吩咐他们宣讲（说出）圣言。而灵里火热的人，则在圣灵的引导下，借着外在的圣化与教导而行事；因为应当从可见的推断不可见的。
  - type: paragraph
    text:
      ru: «Сильно опровергал Иудеев всенародно, доказывая Писаниями». Обличать«всенародно» –значит показывать дерзновение; обличать сильно – значит являть силу; а обличать«доказывая Писаниями» –значит свидетельствовать о своем знании. Ни дерзновение ничего не достигает без силы, ни сила – без дерзновения.
      cn: '「他有力地在众人面前驳斥犹太人，引用圣经加以证明。」

        公开指责「在众人面前」，意味着显露胆量；有力地指责，意味着彰显力量；而引用圣经加以证明地指责，则意味着见证自己的知识。

        无论胆量，没有力量就一无所成；无论力量，没有胆量也一无所成。'
- type: heading1
  text:
    ru: Глава девятнадцатая
    cn: 第十九章
  children:
  - type: paragraph
    text:
      ru: 'Деян.19:1–5.Во время пребывания Аполлоса в Коринфе Павел, пройдя верхние страны, прибыл в Ефес и, найдя там некоторых учеников, сказал им: приняли ли вы Святаго Духа, уверовав? Они же сказали ему: мы даже и не слыхали, есть ли Дух Святый. Он сказал им: во что же вы крестились? Они отвечали: во Иоанново крещение. Павел сказал: Иоанн крестил крещением покаяния, говоря людям, чтобы веровали в Грядущего по нем, то есть во Христа Иисуса. Услышав это, они крестились во имя Господа Иисуса.'
      cn: (使徒行传 19:1-5) 亞波羅在哥林多的時候，保羅經過了上邊一帶地方，就來到以弗所；在那裏遇見幾個門徒， 他對他們說：「自你們信了這道以來，受了　聖靈沒有？」他們對他說：「我們未曾聽見有甚麼　聖靈。」 保羅對他們說：「這樣，你們受的是甚麼浸呢？」他們說：「是約翰的浸。」 保羅說：「約翰所行的原是悔改的浸，告訴百姓當信那在他以後要來的，就是　基督耶穌。」 他們聽見這話，就奉　主耶穌的名受浸。
  - type: paragraph
    text:
      ru: Эти, из«некоторых учеников», не знавшие даже того, что есть Дух Святый, во многом отличались от прочих учеников, потому что из слов«чтобы веровали в Грядущего по нем»видно, что они не веровали и во Христа. Не сказал, что крещение Иоанново – ничто, но что оно несовершенно. Как же они, будучи в Ефесе, приняли крещение Иоанново? Быть может, они путешествовали в то время в Иерусалим и возвратились оттуда, не получив даже сведений о Христе. Не говорит им «веруете вы во Иисуса?» Но что же говорит:«Приняли ли вы Святаго Духа, уверовав?»Павел знал, что они не имели Духа Святаго, но у него является желание сказать так, чтобы, узнав, чего они лишаются, они сами потребовали этого.
      cn: 这些「某些门徒」中的人，甚至不知道有圣灵，他们与其余的门徒有诸多不同，因为从「叫他们信那在他以后要来的」这句话看来，他们甚至不信基督。他没有说约翰的洗礼是虚无的，而是说它不完全。他们既在以弗所，怎么会接受约翰的洗礼呢？或许他们当时去耶路撒冷旅行，从那里返回时，甚至没有得到关于基督的消息。他没有问他们：「你们信耶稣吗？」但他说了什么呢？「你们信了以后，领受了圣灵没有？」保罗知道他们没有圣灵，但他愿意这样说，是为了让他们明白自己所缺乏的，好让他们自己去要求这圣灵。
  - type: paragraph
    text:
      ru: Деян.19:6–7.И, когда Павел возложил на них руки, нисшел на них Дух Святый, и они стали говорить иными языками и пророчествовать. Всех их было человек около двенадцати.
      cn: (使徒行传 19:6-7) 保羅按手在他們頭上，　聖靈便降在他們身上，他們就說方言，又說預言。 一共約有十二個人。
  - type: paragraph
    text:
      ru: 'Не видели Духа, потому что Он невидим; но некоторое подлежащее чувствам доказательство Его присутствия представлял дар языков: один говорил по-персидски, другой – по-римски, третий – на каком-либо ином языке; и по внешним признакам видно было, что в каждом говорит Дух.'
      cn: 没有看见圣灵，因为祂是无形的；然而，说方言的恩赐，提供了祂临在的、某些可被感官察觉的证据：有人说波斯语，另一个人说罗马语，第三人则说其他语言；并且从外在的迹象可以看出，在每个人里面都是圣灵在说话。
  - type: paragraph
    text:
      ru: Деян.19:8.Придя в синагогу, он небоязненно проповедовал три месяца, беседуя и удостоверяя о Царствии Божием.
      cn: (使徒行传 19:8) 保羅進會堂，放膽講道，一連三個月，辯論　上帝國的事，勸化眾人。
  - type: paragraph
    text:
      ru: "Что значит«небоязненно»?\n\t\t\t\tПодвергал себя опасностям или стал говорить еще яснее, не затеняя своего учения. Посмотрите: везде Павел проникает в синагоги и всегда выходит одинаково, так как всюду желал воспользоваться случаем."
      cn: '«不惧怕»是什么意思？

        使自己面临危险，或是开始说得更清楚，不掩盖自己的教导。请看：保罗无论走到哪里都进入会堂，并且总是以同样的方式离开，因为他处处都想利用机会。'
  - type: paragraph
    text:
      ru: Деян.19:9–10.Но как некоторые ожесточились и не верили, злословя путь Господень перед народом, то он, оставив их, отделил учеников, и ежедневно проповедовал в училище некоего Тиранна. Это продолжалось до двух лет, так что все жители Асии слышали проповедь о Господе Иисусе, как Иудеи, так и Еллины.
      cn: (使徒行传 19:9-10) 後來，有些人心裏剛硬不信，在眾人面前毀謗這道，保羅就離開他們，也叫門徒與他們分離，便在推喇奴的學房天天辯論。 這樣有兩年之久，叫一切住在亞細亞的，無論是猶太人，是希臘人，都聽見　主耶穌的道。
  - type: paragraph
    text:
      ru: Путем называет Лука Христа, о Котором и говорится, что Он есть путь (см.Ин. 14, 6). Или же путем называет истинную веру, которую проповедовал Павел. А словами«отделил учеников»преподается наставление, чтобы верующие в Сына Божия удалялись от тех, которые поносят Его.
      cn: 路加称基督为道路，祂也被称为道路 (参阅 约翰福音 14:6)。或者将道路指为保罗所宣讲的真信仰。而「使门徒离开」这句话给予了教导，使信奉上帝之子的人远离那些诋毁祂的人。
  - type: paragraph
    text:
      ru: Деян.19:11–12.Бог же творил немало чудес руками Павла, так что на больных возлагали платки и опоясания с тела его, и у них прекращались болезни, и злые духи выходили из них
      cn: (使徒行传 19:11-12) 　上帝藉保羅的手行了些非常的奇事； 甚至有人從保羅身上拿手巾或圍裙放在病人身上，病就退了，惡靈也出去了。
  - type: paragraph
    text:
      ru: Не только в то время, когда Павел носил«платки и опоясания», прикасались к ним, но и брали с собой и возлагали на недужных. Но обрати внимание на ожесточение иудеев. Их не трогало то, что одежды учеников Христовых производят чудеса, хотя чудеса от платков и опоясаний и от теней учеников больше тех чудес, которые сотворил Христос. Платки и главотяжи, и убрусцы были льняные; главотяжи набрасывались на голову, а убрусцы держали в руках те, кто не мог носить главотяжей; назначение тех и других – вытирать с лица пот, слюну, слезы и прочее.
      cn: 不仅在保罗使用「手巾和围裙」的时候，人们触摸这些物品，而且还带走，并放在病人身上。但请注意犹太人的刚硬之心。他们不为基督门徒的衣物能行神迹所动，尽管那些来自手巾、围裙和门徒影子的神迹，比基督所行的神迹更大。手巾、头巾和方巾都是亚麻的；头巾是戴在头上的，而那些不能戴头巾的人，则手持方巾；这两者的用途是擦拭脸上的汗水、唾液、泪水以及其他污物。
  - type: paragraph
    text:
      ru: 'Деян.19:13.Даже некоторые из скитающихся Иудейских заклинателей стали употреблять над имеющими злых духов имя Господа Иисуса, говоря: заклинаем вас Иисусом, Которого Павел проповедует.'
      cn: (使徒行传 19:13) 那時，有幾個流離飄蕩、裝作趕鬼魔的猶太人，向那被惡靈所附的人擅自稱　主耶穌的名，說：「我們奉保羅所傳的耶穌勒令你們出來。」
  - type: paragraph
    text:
      ru: Уверовать не хотели, а желали изгонять демонов именем Иисуса, потому что слова эти явно изобличают, что заклинатели эти заклинали нечистых духов именем Господа нашего Иисуса Христа не как верующие во Иисуса, но как испытывающие Его. А выражение«стали употреблять»показывает, что они, хотя не надеялись на успех, однако ж налагали руки, чтобы достигнуть цели испытания. Поэтому спустя немного и поплатились за свое безрассудство.
      cn: 他们不愿相信，却渴望奉耶稣之名驱魔，因为这些话语清楚显明，这些施咒者奉我们主耶稣基督之名咒逐不洁之灵，不像信奉耶稣的人，却像试探祂的人。而「开始使用」这个说法表明，他们虽不指望成功，然而仍按手，为了达到试探的目的。因此不久之后，他们便为自己的鲁莽付出了代价。
  - type: paragraph
    text:
      ru: 'Деян.19:14–17.Это делали какие-то семь сынов Иудейского первосвященника Скевы. Но злой дух сказал в ответ: Иисуса знаю, и Павел мне известен, а вы кто? И бросился на них человек, в котором был злой дух, и, одолев их, взял над ними такую силу, что они, нагие и избитые, выбежали из того дома. Это сделалось известно всем живущим в Ефесе Иудеям и Еллинам, и напал страх на всех их, и величаемо было имя Господа Иисуса.'
      cn: (使徒行传 19:14-17) 作這事的，有猶太祭司長士基瓦的七個兒子。 惡靈回答他們說：「耶穌我認識，保羅我也知道。你們卻是誰呢？」 惡靈所附的人就跳在他們身上，制伏他們，勝了他們，叫他們赤露受傷，從那房子裏逃出去了。 凡住在以弗所的，無論是猶太人，是希臘人，都知道這事，也都懼怕；　主耶穌的名從此就尊大了。

        有几个犹太祭司长士基瓦的七个儿子也做这事。但那恶灵回答说：「耶稣我认识，保罗我也知道，你们是谁呢？」于是那被恶灵附着的人扑到他们身上，制伏了他们，并得了他们如此大的权势，以致他们赤身带伤地逃出了那房子。这事传遍了住在以弗所的犹太人和希腊人，众人都惧怕，主耶稣的名也被尊为大。'
  - type: paragraph
    text:
      ru: Хотя сыновья Скевы делали это скрытно, но бессилие их обнаруживается. Достойно удивления то обстоятельство, что злой дух не содействовал обольщению этих заклинателей, но изобличил и обнаружил их обман. Мне кажется, что он был сильно раздражен, подобно тому, как кто-нибудь, притесняемый в крайней опасности каким-нибудь жалким и ничтожным существом, хочет излить на это существо весь свой гнев.
      cn: 尽管司基瓦的儿子们隐秘地做着这事，但他们的无能却显露无遗。令人称奇的是，那邪灵非但没有协助这些咒术士的迷惑，反而揭露并显明了他们的欺诈。我想，它当时极其恼怒，就像某人在极度危险中被某种卑微不足道之物所困扰，便想将所有的怒气倾泻在这生物身上。
  - type: paragraph
    text:
      ru: Деян.19:18.Многие же из уверовавших приходили, исповедуя и открывая дела свои.
      cn: (使徒行传 19:18) 那已經信的，多有人來承認訴說自己所行的事。
  - type: paragraph
    text:
      ru: Всякому верующему следует сказывать свои грехи и обличением себя самого зарекаться творить то же самое снова, чтобы получить оправдание в силу сказанного в Писании:«Говори… чтоб оправдаться»(Ис. 43, 26).
      cn: 每一个信徒都应当告明自己的罪，并借着自责立誓不再重犯同样的罪，以便获得称义，因着经文所说的：「述说你的理，使你可称为义」（以赛亚书 43:26）。
  - type: paragraph
    text:
      ru: 'Деян.19:19–21.А из занимавшихся чародейством довольно многие, собрав книги свои, сожгли перед всеми, и сложили цены их, и оказалось их на пятьдесят тысяч драхм. С такою силою возрастало и возмогало слово Господне. Когда же это совершилось, Павел положил в духе, пройдя Македонию и Ахаию, идти в Иерусалим, сказав: побывав там, я должен видеть и Рим.'
      cn: (使徒行传 19:19-21) 平素行邪術的，也有許多人把書拿來，堆積在眾人面前焚燒。他們算計書價，便知道共合五萬塊銀子。 　上帝的道大大興旺，而且得勝，就是這樣。 這些事完了，保羅靈裏定意經過了馬其頓、亞該亞，就往耶路撒冷去；又說：「我到了那裏以後，也必須往羅馬去看看。」

        那些行邪术的人中，有好些人把他们的书都拿来，在众人面前烧毁了。他们算了书的价值，发现总共是五万德拉克马。主的道就这样大有能力地兴旺起来，而且越发强盛。这事成就以后，保罗在心里定意，要经过马其顿和亚该亚，然后往耶路撒冷去，他说：「我到了那里以后，也必须去罗马看看。」'
  - type: paragraph
    text:
      ru: Видя, что книги эти более ни на что уже не полезны, занимавшиеся чародейством их«сожгли перед всеми». Так преданы были ефесяне кумирам и волшебству, что книги волшебнические ценили очень высоко как такие, в которых заключается самое лучшее в жизни. Уверовав во Христа, они книги эти не продали, но сожгли для того, во-первых, чтобы кто-нибудь не заразился их душегубительной язвой, а также и для того, чтобы не приобрести чего-нибудь за их продажу. Так как деньги, вырученные за собаку или доход от идолопоклонства запрещено было приносить Богу, то они не признали делом праведным повергнуть к ногам апостолов и серебро, вырученное этим путем.
      cn: 见这些书再无任何益处，行巫术的人便「当众烧毁了它们」。以弗所人原是如此沉溺于偶像和巫术，以至于他们非常珍视那些巫术书籍，认为其中蕴含着生命中最美好的事物。归信基督后，他们没有卖掉这些书，而是烧毁了它们，首先是为了不让任何人沾染上它们那毁灭灵魂的瘟疫，其次也是为了不因出售它们而获得任何好处。既然因狗或偶像崇拜所得的收益被禁止献给上帝，那么他们也就不认为将通过此途径所获的银钱掷于使徒脚下是公义之举。
  - type: paragraph
    text:
      ru: Деян.19:22.И, послав в Македонию двоих из служивших ему, Тимофея и Ераста, сам остался на время в Асии.
      cn: (使徒行传 19:22) 他於是從幫助他的人中打發提摩太、以拉都二人往馬其頓去；唯獨自己暫時等在亞細亞。
  - type: paragraph
    text:
      ru: Послал в Македонию учеников возвестить, что он придет, и поселить в македонянах более сильное желание видеть его. Что же касается того, что сам он остается на время в Асии, то это так было нужно, потому что в Асии была тирания философов.
      cn: 他差遣门徒往马其顿，宣告他将要来临，并使马其顿人心中生发更强烈的愿望来见他。至于他自己暂留在亚细亚，这乃是必需的，因为在亚细亚有哲学家的暴政。
  - type: paragraph
    text:
      ru: Деян.19:23–24.В то время произошел немалый мятеж против пути Господня, ибо некто серебряник, именем Димитрий, делавший серебряные храмы Артемиды и доставлявший художникам немалую прибыль.
      cn: (使徒行传 19:23-24) 當時，因為那道起的擾亂不小。 有一個銀匠，名叫底米丟，是製造戴安娜神銀龕的，他使這樣手藝人得利不少。

        在那时，因主的道起了不小的骚乱。因为有一个银匠，名叫底米丢，是制造亚底米女神银龛的，他给众工匠带来了丰厚的利润。'
  - type: paragraph
    text:
      ru: 'Под серебряными храмами подразумеваются, быть может, небольшие кивоты. Посмотри: всюду идолослужение отстаивали из-за денег. И этот Димитрий хлопотал из-за денег. Хлопотал не потому, что их нечестивая религия в опасности, но потому, что лишался средств к приобретениям; потому что он знал, что обольщал людей, делая им серебряных богов и серебряные кивоты, и боялся, как бы его хитрость не была изобличена истинным учением Павла; боялся также, как бы и вовсе не исчез храм Артемиды, бывший в Ефесе, и таким образом предсказывал исчезновение храма, что и случилось.'
      cn: 所谓「银殿」，也许意指小神龛。且看：到处都有人为了金钱而维护偶像崇拜。连这位底米丢，也是为了金钱而奔走。他奔走并非因为他们那不敬虔的宗教处于危险之中，而是因为他将失去生财之道；因为他知道自己一直在迷惑人，为他们制造银神像和银神龛，他也害怕他的伎俩会被保罗的真理教导所揭穿；他也害怕位于厄弗所的亚底米神庙会完全消失，这样他就预言了神庙的消失，这后来也果真如此。
  - type: paragraph
    text:
      ru: 'Деян.19:25–27.Собрав их и других подобных ремесленников, сказал: друзья! вы знаете, что от этого ремесла зависит благосостояние наше. Между тем вы видите и слышите, что не только в Ефесе, но почти во всей Асии этот Павел своими убеждениями совратил немалое число людей, говоря, что делаемые руками человеческими не суть боги. А это нам угрожает тем, что не только ремесло наше придет в презрение, но и храм великой богини Артемиды ничего не будет значить, и испровергнется величие той, которую почитает вся Асия и вселенная.'
      cn: (使徒行传 19:25-27) 他聚集他們和同行的工人，說：「眾位，你們知道我們是倚靠這手藝得財。 這保羅不但在以弗所，也幾乎在亞細亞全地，引誘迷惑許多人，說：『人手所作的，不是神。』這是你們所看見所聽見的。 這樣，不獨我們這手藝被人輕棄，就是大女神戴安娜的廟也要被人輕看，連亞細亞全地和普世上所敬拜的大女神之威榮也要消滅了。」
  - type: paragraph
    text:
      ru: 'Обратил внимание их на опасность: мы, говорит, находимся в опасности впасть от нашего ремесла в голод. Однако то, что он сказал, могло привести их к истинному богопочтению. Если, как он говорит, человек этот (Павел) так силен, что есть опасность, как бы он и всех не обратил, и если от него грозит опасность тому, что принадлежит богам, то следует подумать о том, каков же его Бог. Везде свою речь сводит этот Димитрий на ремесло.'
      cn: 他提醒他们注意一个危险：他说，我们正面临因我们的手艺而陷入饥饿的危险。然而他所说的话，却可能引导他们归向真正的敬拜上帝。如果，正如他所说，这个人（保罗）如此强大，以至于有危险，他会使所有人都归信，并且如果从他那里，那些属于诸神的事物面临危险，那么就应该思考，他的上帝究竟是怎样的。这个底米丢处处将他的言论归结于手艺。
  - type: paragraph
    text:
      ru: «Своими убеждениями совратил немалое число людей». Не насилием, а так именно следует убеждать. Достаточно и того, что Павел сказал«не суть боги». Если так удоборазоблачаема несостоятельность этого культа, то его давно следовало отвергнуть; если же он имеет в себе силу, то так скоро искоренить его невозможно.
      cn: 「他凭着自己的信念惑乱了为数不少的人。」不是凭暴力，而是正当以这种方式去劝服。仅凭保罗所说的「它们并非神明」就已足够。倘若这种邪教的虚妄性是如此容易被揭露的，那么它早就该被弃绝了；若是它自身具有力量，那么就不可能如此迅速地将其根除。
  - type: paragraph
    text:
      ru: 'Деян.19:28–29.Выслушав это, они исполнились ярости и стали кричать, говоря: велика Артемида Ефесская! И весь город наполнился смятением. Схватив Македонян Гаия и Аристарха, спутников Павловых, они единодушно устремились на зрелище.'
      cn: (使徒行传 19:28-29) 眾人聽見這些話，就怒氣填胸，喊著說：「大哉，以弗所人的戴安娜啊。」 滿城都轟動起來。眾人拿住與保羅同行的馬其頓人該猶和亞里達古，齊心擁進戲園裏去。

        他们听见了这话，就满了烈怒，并大声喊着说：「大哉！以弗所的亚底米！」于是全城充满了混乱。他们抓住保罗的同行者，马其顿人该犹和亚里达古，就同心合意地冲向戏园。'
  - type: paragraph
    text:
      ru: Пришли в ярость, услышав об Артемиде и о подрыве ремесла, потому что черни свойственно возбуждаться и воспламеняться от всякой, даже пустой, вещи. В городе у них были боги; и они приняли угрожающее положение, чтобы криком восстановить как-нибудь уважение к богам и заглушить то, что произошло. Кричали не переставая, как бы опасаясь, чтобы вовсе не угасло почитание богов.
      cn: 当他们听闻亚底米之事以及他们的行业受损时，怒不可遏，因为这群乌合之众素来容易为了任何事物，哪怕是微不足道的小事，而激动不已，怒火上冲。在城里他们有他们的诸神；他们便采取了威胁性的举动，意图借由呼喊来某种程度地恢复对诸神的敬意，并压制住所发生之事。他们不停地呼喊，仿佛深恐对诸神的崇敬会完全熄灭。
  - type: paragraph
    text:
      ru: Деян.19:30–32.Когда же Павел хотел войти в народ, ученики не допустили его. Также и некоторые из Асийских начальников, будучи друзьями его, послав к нему, просили не показываться на зрелище. Между тем одни кричали одно, а другие другое, ибо собрание было беспорядочное, и большая часть собравшихся не знали, зачем собрались.
      cn: (使徒行传 19:30-32) 保羅想要進去，到百姓那裏，門徒卻不許他去。 還有亞細亞幾位首領，是保羅的朋友，打發人來勸他，不要冒險到戲園裏去。 聚集的人紛紛亂亂，有喊叫這個的，有喊叫那個的，大半不知道是為甚麼聚集。

        当保罗想要进入人群中时，门徒们却不许他去。

        亚西亚省的几位官长，也是他的朋友，打发人到他那里，请求他不要到戏场里去。

        那时，有的喊叫这个，有的喊叫那个，因为会众一片混乱，并且大部分聚集的人，都不晓得为何聚集。'
  - type: paragraph
    text:
      ru: Ученики не позволили Павлу вторгаться в возбужденную толпу – так любили его все верующие. И Павел слушает их, так как не был честолюбив.
      cn: 门徒不让保罗闯入激动的人群——所有信徒都深爱着他。保罗听从了他们，因为他不慕虚荣。
  - type: paragraph
    text:
      ru: '«Большая часть собравшихся не знали, зачем собрались». Таково уже свойство толпы: она устремляется туда или сюда безотчетно, подобно огню, брошенному в лес.'
      cn: 「大部分聚集的人并不知道他们为何聚集。」这正是人群的本性：它盲目地奔向这里或那里，如同投入林中的火。
  - type: paragraph
    text:
      ru: 'Деян.19:33–34.По предложению Иудеев, из народа вызван был Александр. Дав знак рукою, Александр хотел говорить к народу. Когда же узнали, что он Иудей, то закричали все в один голос, и около двух часов кричали: велика Артемида Ефесская!'
      cn: (使徒行传 19:33-34) 有人把亞歷山大從眾人中帶出來，猶太人推他往前，亞歷山大就用手示意，要向百姓分訴。 只因他們認出他是猶太人，就大家同聲喊著說：「大哉。以弗所人的戴安娜啊。」如此約有兩小時。
  - type: paragraph
    text:
      ru: Почему Александр хотел«говорить к народу»в оправдание? Ведь его не обвиняли? Чтобы улучить минуту, дать всему другой оборот и утишить гнев народа.
      cn: 亚历山大为何想要「向民众讲话」以求辩白？难道他并未受人指控吗？（他这样做）是为了抓住时机，扭转局面，并平息民众的愤怒。
  - type: paragraph
    text:
      ru: 'Деян.19:35–36.Блюститель же порядка, утишив народ, сказал: мужи Ефесские! какой человек не знает, что город Ефес есть служитель великой богини Артемиды и Диопета? Если же в этом нет спора, то надобно вам быть спокойными и не поступать опрометчиво.'
      cn: (使徒行传 19:35-36) 那城裏的書記，安撫了百姓，就說：「以弗所人哪，誰不知道以弗所人的城，是敬拜大女神戴安娜，和從朱庇特那裏落下來的像呢。 這些事既是駁不倒的，你們就當安靜，不可造次。
  - type: paragraph
    text:
      ru: Справедливо и с укоризной отвечает книжник; не сказал «какой человек не знает Артемиды?», но – «кто не знает, что наш город«есть служитель великой богини Артемиды..?» Так что же вы шумите, как будто это неизвестная вещь? Выражение«служитель»означает, собственно, служителя, выметающего или очищающего храм. Диопетом же называет куполообразный храм Зевса или изображение Афины Паллады, называвшееся Палладиум, относительно которого у эллинов существовал миф, будто оно было сброшено Зевсом с неба, а не людьми сделано; это для изумления людей наивных.
      cn: '公正且带着责备，那书记官回答说；他没有说「何人不知亚底米？」，而是说——「何人不知我们的城是伟大女神亚底米的侍役…？」那么，你们为何喧哗，仿佛这是一件不为人知之事？「侍役」一词，严格而言，是指打扫或清洁殿宇之人。


        而所谓「迪奥佩特」（Diopetom），是指宙斯穹顶神庙，或是被称为「帕拉狄翁」（Palladium）的雅典娜·帕拉斯神像，希腊人对此有一个神话，说它是由宙斯从天上掷下，而非人手所造；此乃为使无知者惊奇。'
  - type: paragraph
    text:
      ru: 'Деян.19:37–40.А вы привели этих мужей, которые ни храма Артемидина не обокрали, ни богини вашей не хулили. Если же Димитрий и другие с ним художники имеют жалобу на кого-нибудь, то есть судебные собрания и есть проконсулы: пусть жалуются друг на друга. А если вы ищете чего-нибудь другого, то это будет решено в законном собрании. Ибо мы находимся в опасности – за происшедшее ныне быть обвиненными в возмущении, так как нет никакой причины, которою мы могли бы оправдать такое сборище. Сказав это, он распустил собрание.'
      cn: (使徒行传 19:37-40) 你們把這些人帶來，他們並沒有搶奪教會之物，也沒有褻瀆你們的女神。 若是底米丟和他同行的工匠有控告人的事，自有公堂，也有眾省長可以彼此對告。 你們若問別的事，就可以按著律法聚集斷定。 今日的擾亂本是無緣無故，我們難免被查問。論到這樣聚眾，我們也說不出所以然來。」


        你们把这些人带来，他们既没有抢劫亚底米神庙，也没有亵渎你们的女神。若是底米丢和与他同在的匠人对谁有控诉，则有公庭可去，也有方伯在此，他们可以彼此控告。倘若你们寻求别的什么事，这就当在合法的集会中解决。因为我们正有被指控的危险，因今日所发生的事，被指控为骚乱，因为我们没有任何理由可以为这样的聚众辩解。说完这话，他就遣散了会众。'
  - type: paragraph
    text:
      ru: Кротко порицает их, показывая, что они поступили опрометчиво и что не следовало делать общей сходки из-за частных причин.
      cn: 祂温和地责备他们，指出他们行事鲁莽，不应因私人原因而举行公共集会。
- type: heading1
  text:
    ru: Глава двадцатая
    cn: 第二十章
  children:
  - type: paragraph
    text:
      ru: Деян.20:1–6.По прекращении мятежа Павел, призвав учеников и дав им наставления и простившись с ними, вышел и пошел в Македонию. Пройдя же те места и преподав верующим обильные наставления, пришел в Елладу. Там пробыл он три месяца. Когда же, по случаю возмущения, сделанного против него Иудеями, он хотел отправиться в Сирию, то пришло ему на мысль возвратиться через Македонию. Его сопровождали до Асии Сосипатр Пирров, Вериянин, и из Фессалоникийцев Аристарх и Секунд, и Гаий Дервянин и Тимофей, и Асийцы Тихик и Трофим. Они, пойдя вперед, ожидали нас в Троаде. А мы, после дней опресночных отплыли из Филипп и дней в пять прибыли к ним в Троаду, где пробыли семь дней.
      cn: (使徒行传 20:1-6) 亂定之後，保羅請門徒來，抱了他們，就辭別離開，為要往馬其頓去。 他走遍了那一帶地方，用許多話勸勉眾人，然後來到希臘， 在那裏住了三個月。保羅將要坐船往敘利亞去，猶太人埋伏要害他，他就定意從馬其頓回去。 同他到亞細亞去的，有庇哩亞人所巴特，帖撒羅尼迦人亞里達古和西公都，還有特庇人該猶，並提摩太，又有亞細亞人推基古和特羅非摩。 這些人先走，在特羅亞等候我們。 過了除酵節的日子，我們從腓立比開船，五天到了特羅亞，和他們相會；我們在那裏住了七天。


        骚乱平息之后，保罗召集门徒，给他们训示，又与他们告别，便出去往马其顿去了。他走遍了那些地方，给信徒们丰富而饱满的训示后，就来到了希腊。他在那里住了三个月。当时，因犹太人对他制造了骚乱，他想要往叙利亚去，便打算经马其顿回去。陪伴他直到亚细亚的，有庇里亚人比罗斯的儿子所西帕特；帖撒罗尼迦人亚里达古和西公都；特庇人该犹和提摩太；以及亚细亚人推基古和特罗非摩。他们先行，在特罗亚等候我们。我们在除酵节后从腓立比开船，过了五天到达特罗亚与他们会合，在那里住了七天。'
  - type: paragraph
    text:
      ru: Павел наставил учеников, потому что после смятения они нуждались в большом утешении.
      cn: 保罗教导门徒，因为在纷扰之后，他们需要极大的安慰。
  - type: paragraph
    text:
      ru: Деян.20:7–8.В первый же день недели, когда ученики собрались для преломления хлеба, Павел, намереваясь отправиться в следующий день, беседовал с ними и продолжил слово до полуночи. В горнице, где мы собрались, было довольно светильников.
      cn: (使徒行传 20:7-8) 七日的第一日，門徒聚會擘餅的時候，保羅次日快要起行，就向他們傳道；直講到半夜。 他們聚會的那座樓上，有許多亮光。

        当周的第一日，门徒聚集擘饼的时候，保罗因他次日要动身，就与他们交通，并将话语讲到半夜。在楼房上我们聚集的那屋子里，有许多灯火。'
  - type: paragraph
    text:
      ru: Тогда был праздник Пятидесятницы и день воскресный. И ночью не успокоивался Павел, но беседовал тогда более, так как было досужное время. Посмотри, как долго говорил он даже после ужина.
      cn: 那时是五旬节，也是主日。保罗在夜里没有安歇，而是当时讲论得更多，因为那时是闲暇时间。你看，甚至在晚餐之后，他讲论了多长时间。
  - type: paragraph
    text:
      ru: Деян.20:9.Во время продолжительной беседы Павловой один юноша, именем Евтих, сидевший на окне, погрузился в глубокий сон и, пошатнувшись, сонный упал вниз с третьего жилья, и поднят мертвым.
      cn: (使徒行传 20:9) 有一個少年人，名叫猶推古，坐在窗臺上，困倦沉睡。保羅講了多時，少年人睡熟了，就從三層樓上掉下去；扶起他來，已經死了。
  - type: paragraph
    text:
      ru: Отягчив сном слушателя, диавол нарушил праздник. Юноша сидел на окне ночью – так велико было желание слушать. И достойно удивления, что, будучи юношей, он не был беззаботен и, отягчаемый сном, не ушел, даже не испугался того, что его могут столкнуть, потому что он заснул не от невнимательности, а по требованию природы.
      cn: 魔鬼使听者沉睡，扰乱了庆典。少年夜里坐在窗台上——他聆听的渴望如此强烈。值得惊奇的是，作为一个少年，他并非漫不经心，并且，虽然被睡意困扰，却没有离开；他甚至不曾惧怕自己可能被推下（窗台），因为他入睡并非出于疏忽大意，而是出于自然的需要。
  - type: paragraph
    text:
      ru: 'Деян.20:10–13.Павел, сойдя, пал на него и, обняв его, сказал: не тревожьтесь, ибо душа его в нем. Взойдя же и преломив хлеб и вкусив, беседовал довольно, даже до рассвета, и потом вышел. Между тем отрока привели живого, и немало утешились. Мы пошли вперед на корабль и поплыли в Асс, чтобы взять оттуда Павла.'
      cn: (使徒行传 20:10-13) 保羅下去，伏在他身上，抱著他，說：「你們不要發慌；他的命還在他裏頭。」 保羅又上去，擘餅，吃了，談論許久，直到天亮，這才走了。 有人把那少年人活活的領來，得的安慰不小。 我們先上船，開往亞朔去，意思要在那裏接保羅；因為他是這樣安排的，他自己打算要步行。


        保罗下去，伏在他身上，抱着他，说：「你们不要惊慌，因为他的灵魂仍在他里面。」保罗于是上去，擘开饼，尝了，谈论了很久，甚至直到天亮，然后才出去。同时，人们把那孩童活着地带了来，并且大大得着安慰。我们往前走到船上，并开船往亚朔去，为要从那里接保罗。'
  - type: paragraph
    text:
      ru: Не сказал «воскреснет, ибо я воскрешу его», но –«душа его в нем есть». Обрати внимание на смирение его и на его желание утешить.
      cn: 他没有说「他会复活，因为我要使他复活」，而是说「他的灵魂在他里面」。请留意他的谦卑，以及他想要安慰的心愿。
  - type: paragraph
    text:
      ru: Деян.20:13–15.Ибо он так приказал нам, намереваясь сам идти пешком. Когда же он сошелся с нами в Ассе, то, взяв его, мы прибыли в Митилину. И, отплыв оттуда, в следующий день мы остановились против Хиоса, а на другой пристали к Самосу и, побывав в Трогиллии, в следующий день прибыли в Милит.
      cn: (使徒行传 20:13-15) 我們先上船，開往亞朔去，意思要在那裏接保羅；因為他是這樣安排的，他自己打算要步行。 他既在亞朔與我們相會，我們就接他上船，來到米推利尼。 我們從那裏開船，次日到了基阿的對面；又次日，到了撒摩，就在特基林停泊；又次日，來到米利都。


        因为他这样吩咐我们，自己打算步行前往。当他在亚朔与我们会合时，我们便接他上船，抵达米推尼。我们从那里启航，次日，在基阿斯对面停泊；又次日，我们停靠撒摩，并在特罗基里稍作停留；再次日，我们抵达米利都。'
  - type: paragraph
    text:
      ru: Сам пошел пешим, предоставляя им то, что легче, а себе выбирая то, что труднее, и с тем вместе поучая многому и приучая их разлучаться с собою.
      cn: 他自己徒步而行，让众人选择较轻松的，而自己则选择较艰难的，并借此教导他们许多，又使他们习惯于与自己分离。
  - type: paragraph
    text:
      ru: Деян.20:16.Ибо Павлу рассудилось миновать Ефес, чтобы не замедлить ему в Асии; потому что он поспешал, если можно, в день Пятидесятницы быть в Иерусалиме.
      cn: (使徒行传 20:16) 乃因保羅早已定意沿著以弗所，因他不願在亞細亞耽延；他急忙前走，巴不得趕五旬節能到耶路撒冷。
  - type: paragraph
    text:
      ru: Видишь, и при желании и при старании Павел часто не достигал желаемого, чтобы мы не подумали, что он был выше человеческой природы. Святые и великие мужи были одной с нами природы, но не одной воли, поэтому и имели много благодати.
      cn: 你看，即便保罗有意愿、肯努力，他常常未能达到他所希望的，以免我们认为他超越了人性。圣徒和伟人们与我们有相同的本性，但却没有相同的意志，因此他们也拥有许多恩典。
  - type: paragraph
    text:
      ru: 'Деян.20:17–21.Из Милита же послав в Ефес, он призвал пресвитеров церкви. И, когда они пришли к нему, он сказал им: вы знаете, как я с первого дня, в который пришел в Асию, все время был с вами, работая Господу со всяким смиренномудрием и многими слезами, среди искушений, приключавшихся мне по злоумышлениям Иудеев; как я не пропустил ничего полезного, о чем вам не проповедовал бы и чему не учил бы вас всенародно и по домам, возвещая Иудеям и Еллинам покаяние пред Богом и веру в Господа нашего Иисуса Христа.'
      cn: (使徒行传 20:17-21) 保羅從米利都打發人往以弗所去，請教會的長老來。 他們來了，保羅就對他們說：「你們知道，自從我到亞細亞第一日以來，在你們中間始終為人如何， 服事　主，凡事謙卑，眼中多多流淚，又因猶太人的謀害，經歷試探。 你們也知道，凡與你們有益的，我沒有一樣避諱不說的，或在眾人面前，或在各人家裏，我都教導你們； 又對猶太人，和希臘人，證明當向　上帝悔改，信靠我們的　主耶穌　基督。

        保罗从米利都差人往以弗所，召了教会的众长老来。他们来到他那里，他就对他们说：「你们知道，我从头一日踏足亚细亚以来，怎样一直与你们同在，凡事谦卑，多有眼泪，服事上主，又在我因犹太人的恶意谋算所遭遇的试探之中；凡有益于你们的，我没有不宣讲的，也没有不公开地、或挨家挨户地教导你们的，向犹太人和希腊人宣扬在上帝面前的悔改，以及对我们主耶稣基督的信心。'
  - type: paragraph
    text:
      ru: '«Со всяким смиренномудрием». Не просто со смиренномудрием, но со"всяким", потому что много видов смиренномудрия: в слове, в деле, по отношению к начальникам, по отношению к подчиненным.'
      cn: 「以各样的谦卑。」不仅仅是以谦卑，而是以「各样的」，因为谦卑有许多种类：在言语上，在行为上，对待上司，对待下属。
  - type: paragraph
    text:
      ru: «Призвал пресвитеров церкви». Многим неизвестен обычай Писания, особенно Нового Завета, – называть епископов пресвитерами и пресвитеров епископами; между тем это видно и из этого места, и из Послания к Титу, а также и из Послания к Филиппинцам. Мы могли бы также узнать, не то ли самое следует, хотя по заключению, выводить и из Первого послания к Тимофею.
      cn: 「召集教会长老。」许多人不知道圣经的习俗，尤其是新约的习俗，即称主教为长老，称长老为主教；然而，这从此处、从提多书、以及从腓立比书都可见得。我们也可以得知，即使是通过推断，是否同样可以从提摩太前书得出相同的结论。
  - type: paragraph
    text:
      ru: «Не пропустил ничего полезного, о чем вам не проповедовал бы». Было, значит, и такое, что не следовало знать. Как скрывать что-нибудь есть признак зависти, так высказывать все есть признак неблагоразумия. Поэтому прибавил«ничего полезного.
      cn: 「我没有遗漏任何有益的事，也没有不向你们传讲的。」 这意味着，也有些事是不应该知道的。正如隐瞒一些事是嫉妒的迹象，同样，和盘托出一切是不智的迹象。因此，他加上了「没有什么有益的」（这限定语）。
  - type: paragraph
    text:
      ru: Деян.20:22–24.И вот, ныне я, по влечению Духа, иду в Иерусалим, не зная, что там встретится со мною. Только Дух Святый по всем городам свидетельствует, говоря, что узы и скорби ждут меня. Но я ни на что не взираю и не дорожу своею жизнью, только бы с радостью совершить поприще мое и служение, которое я принял от Господа Иисуса, проповедать Евангелие благодати Божией.
      cn: (使徒行传 20:22-24) 現在我往耶路撒冷去，心靈被捆綁，不知道在那裏要遇見甚麼事； 但知道　聖靈在各城裏向我指證，說有捆鎖與患難等待我。 但這些事都沒有動搖我，我卻不以性命為念，也不看為寶貴，只要歡歡喜喜行完我的路程，成就我從　主耶穌所領受的職事，證明　上帝恩典的福音。」

        如今，看哪，我被圣灵催促着，往耶路撒冷去，不知道在那里会遭遇什么事。只是圣灵在各城里向我作证，说有捆锁和患难等着我。我却不看重这些事，也不爱惜自己的性命，只要我能欢喜地跑完我的路程，完成我从主耶稣所领受的事奉，就是为上帝恩典的福音作证。'
  - type: paragraph
    text:
      ru: '«Аз связан Духом».Слово «связан» следует отделить запятою, чтобы вышла следующая мысль: иду во Иерусалим, будучи связан, не узнав предварительно от Духа, что будет со мной. Замечательно, что пророки знают не все, но только то, что внушает им Дух Святый. Вот и Павел, предсказав, как пророк, обо всем, что имело случиться с ним, и о том, что среди ефесян будут плохие верующие и еретики, сказал, что одного не знает, – какой конец будет всего этого, потому что, объявив ему все, Господь скрыл от него одно это, именно: что будет с ним после уз и скорбей. Это для того, чтобы, зная, что именно ему следует преследовать, и возгордившись, он не пал от гордости. Святый Дух оставил его в сомнении, чтобы, страшась плотской немощи, он молил Бога об избавлении от искушений.'
      cn: «我被圣灵所捆绑。» 『捆绑』一词应该用逗号隔开，以便引出以下意思：我前往耶路撒冷，被捆绑着，事先并未从圣灵那里得知我将会遭遇什么。值得注意的是，先知并非无所不知，而只知道圣灵所启示他们的。因此，保罗以先知的身份预言了他将遭遇的一切，以及以弗所人中将出现不良信徒和异端分子，却说有一件事他不知道，即这一切的结局将如何，因为上主在向他宣告了一切之后，却向他隐瞒了这一点，即：在捆锁和苦难之后，他将会怎样。这样做是为了，他若确切知道自己将要经历的一切，并因此心生骄傲，就不至于因骄傲而堕落。圣灵使他处于疑惑之中，以便他因惧怕肉体的软弱，便能祈求上帝使他脱离试探。
  - type: paragraph
    text:
      ru: «Узы и скорби ждут меня». Что ждут меня искушения, это я знаю, а какие искушения, того не знаю, потому что это было труднее. Зачем же ты идешь, если ожидают тебя«узы и скорби?»Для того, чтобы быть узником ради Христа, чтобы умереть ради Него.
      cn: 「捆锁和患难等候着我。」我晓得有试探等候着我，但至于是什么样的试探，那我就不知道了，因为那事更加困难。既然「捆锁和患难」等候着你，那你为何还要去呢？是为了作基督的囚徒，为了祂而死。
  - type: paragraph
    text:
      ru: Деян.20:25–27.И ныне, вот, я знаю, что уже не увидите лица моего все вы, между которыми ходил я, проповедуя Царствие Божие. Посему свидетельствую вам в нынешний день, что чист я от крови всех, ибо я не упускал возвещать вам всю волю Божию.
      cn: (使徒行传 20:25-27) 「我素常在你們中間來往，傳講　上帝國的道，如今看哪，我曉得你們以後都不得再見我的面了。 所以我今日向你們證明，你們中間無論何人死亡，我於眾人的血是潔淨的。 因為　上帝的旨意，我並沒有一樣避諱不傳給你們的。


        如今，看哪，我知道，你们所有在我中间往来、传扬上帝之国的人，必不再见到我的面了。所以我今日向你们作证，我在众人流血的事上是清白的，因为我并没有退缩不把上帝的全部旨意宣讲给你们。'
  - type: paragraph
    text:
      ru: '"Чист", говорит,«я от крови всех», если вы будете отягчены сном и умрете от рук убийцы душ, потому что я исполнил обязанность учителя,«ибо я не упускал возвещать вам всю волю Божию.'
      cn: 「洁净，」他说，「我免于众人的血债，」如果你们被睡意缠身，死于那灵魂杀手之手，因为我已尽到教师的职责，「因为我没有遗漏地向你们宣讲上帝的全部旨意。」
  - type: paragraph
    text:
      ru: 'Это значит: кто не говорит всей воли Божией, тот виновен в крови, то есть в убийстве. По видимости оправдываясь, он, однако же, заставляет их остерегаться.'
      cn: 这意味着：凡不宣讲上帝全部旨意者，便有流血之罪，亦即杀人之罪。他表面上为自己开脱，但实际上，却让他们心生警惕。
  - type: paragraph
    text:
      ru: Деян.20:28.Итак внимайте себе и всему стаду, в котором Дух Святый поставил вас блюстителями, пастиЦерковьГоспода и Бога, которую Он приобрел Себе Кровию Своею.
      cn: (使徒行传 20:28) 　聖靈立你們作全群的監督，你們就當為自己謹慎，也為全群謹慎，餵養　上帝的教會，就是他用自己血所買來的。
  - type: paragraph
    text:
      ru: «Внимайте себе и всему стаду», потому что спасительная польза состоит не в том только, чтобы исправлять других, – боюсь, говорит апостол,«дабы, проповедуя другим, самому не остаться недостойным»(1Кор. 9, 27), но и не в том, чтобы заботиться только о себе, потому что таковой – самолюбец, ищет только своей выгоды и подобен зарывшему свой талант в землю.
      cn: 「要谨慎自己和全群羊」，因为救赎性的益处不仅仅在于纠正他人——使徒说，我恐怕，我传福音给别人，自己反被弃绝了（哥林多前书 9:27），也不在于只顾念自己，因为这样的人是自爱者，只求自己的益处，并如同把自己的才干埋在地里的人。
  - type: paragraph
    text:
      ru: «Внимайте себе». Не потому, что спасение себя предпочтительнее спасения стада, но потому, что когда мы внимаем себе, тогда и стадо получает пользу.
      cn: 「『省察自己。』并非因为自己的救恩优先于羊群的救恩，而是因为当我们省察自己时，羊群也因此受益。」
  - type: paragraph
    text:
      ru: «Дух Святый поставил вас блюстителями, пастиЦерковь». Вы получили, говорит, хиротонию от Духа. И на вас лежит обязанность наблюдать за словесными стадами Церкви, наблюдать, чтобы не ослабел кто верой, не томится ли кто голодом или жаждой, не нуждается ли кто в каком-либо замечании или обличении, как заповедует сам же Павел:«обличай, запрещай, увещевай»(2Тим. 4, 2).
      cn: 「圣灵设立你们为监督，牧养教会。」他说，你们领受了从圣灵而来的圣秩。你们肩负着责任，照管教会内属灵的羊群，留意是否有人信心软弱，是否有人饥渴交迫，是否有人需要任何劝诫或责备，正如保罗自己所吩咐的：「责备、警戒、劝勉」（提摩太后书 4:2）。
  - type: paragraph
    text:
      ru: «Которую Он приобрел Себе Кровию Своею». Немаловажным вещам угрожала опасность если Господь не пощадил даже Крови Своей. Да, чтобы примирить врагов, Он пролил даже собственную Кровь; ты же можешь удержать их, когда они сделались уже друзьями.
      cn: '«祂用自己的血为自己所取得的。」


        倘若上主甚至不惜自己的宝血，那必然是极其重要的事物面临着危险。是的，为了使仇敌和睦，祂甚至倾流了自己的血；你却可以在他们已成为朋友时维系他们。'
  - type: paragraph
    text:
      ru: Деян.20:29–31.Ибо я знаю, что, по отшествии моем, войдут к вам лютые волки, не щадящие стада; и из вас самих восстанут люди, которые будут говорить превратно, дабы увлечь учеников за собою. Посему бодрствуйте, памятуя, что я три года день и ночь непрестанно со слезами учил каждого из вас.
      cn: (使徒行传 20:29-31) 我知道，我去之後必有兇暴的豺狼進入你們中間，不愛惜羊群。 就是你們中間，也必有人起來說悖謬的話，要引誘門徒跟從他們。 所以你們應當警醒，記念我三年之久晝夜不住的流淚、勸戒你們各人。
  - type: paragraph
    text:
      ru: 'Двоякое несчастье: с одной стороны, то, что его не будет, с другой – то, что иные будут нападать, и притом, – что особенно горько, –«из вас самих». Тяжело бывает, когда происходит междоусобная война.'
      cn: 双重的不幸：一方面，是他的不在；另一方面，是其他人将会攻击，并且，——尤其苦涩的是，——「出自你们自己」。当内讧发生时，那将是何等沉重啊。
  - type: paragraph
    text:
      ru: «Увлечь учеников за собою». Цель еретиков стараться привлечь народ не к Господу, а к себе, чтобы польстить своему тщеславию, когда привлеченные ими будут носить имя того или другого еретика, как, например, от Манеса – манихеи, от Ария – ариане. Вот что значит«увлечь учеников за собою». Поэтому, умеряя, еще ранее, их ревность, Павел поносит и прощает тех, которые говорили:""я Павлов»; «я Аполлосов»(1Кор. 1, 12).
      cn: 「吸引门徒归于自己。」异端者的目的，是努力吸引民众不是归向上主，而是归向他们自己，为了满足他们的虚荣心，因为那些被他们吸引的人，将会以这一个或那一个异端者的名字相称，例如，源于摩尼的摩尼教徒，源于亚略的亚略派信徒。这正是「吸引门徒归于自己」的意思。因此，早在先前为了抑制他们的热心，保罗斥责并原谅那些说：「我是属保罗的」；「我是属亚波罗的」的人（哥林多前书 1:12）。
  - type: paragraph
    text:
      ru: Деян.20:32–34.И ныне предаю вас, братия, Богу и слову благодати Его, могущему назидать вас более и дать вам наследие со всеми освященными. Ни серебра, ни золота, ни одежды я ни от кого не пожелал. Сами знаете что нуждам моим и нуждам бывших при мне послужили руки мои сии.
      cn: (使徒行传 20:32-34) 弟兄們，如今我把你們交託　上帝和他恩典的道；這道能建立你們，叫你們和一切成聖的人同得基業。 我未曾貪圖一個人的金、銀、衣服。 我這兩隻手常供給我和同人的需用，這是你們自己知道的。


        如今我把你们，弟兄们，交托给上帝和祂恩典的道，这道能建造你们，并赐给你们在一切成圣的人中的基业。我未曾贪图任何人的金银或衣服。你们自己知道，我这双手供给我的需要，也供给与我同在之人的需要。'
  - type: paragraph
    text:
      ru: Увещание оканчивается молитвой. Так как он сильно устрашил их, то, чтобы не поразить окончательно, вот и утешение."И ныне", говорит,«предаю вас… Богу и слову благодати Его», то есть самой благодати Его.
      cn: '劝诫以祷告结束。

        既然他已使他们大为惊惧，为了不至使其彻底丧志，这便是安慰了。

        「而今，」他说，「我将你们……交托于上帝和祂恩典的圣言，」也就是说，交托于祂本身的恩典。'
  - type: paragraph
    text:
      ru: 'Не сказал:""ни серебра, ни золота, ни одежды»не взял», но даже и«не пожелал». А еще возвышеннее сказал далее:«Сами знаете, что нуждам моим и нуждам бывших при мне послужили руки мои сии». Да, истинная милостыня в том, чтобы подавать из собственных трудов. Но обрати внимание на то, что трудился человек, который постоянно беседовал: и днем и ночью.'
      cn: 他没有说：「我没有取任何银子、金子、衣服」，而是甚至说：「我也没有贪图。」他接着又说了更崇高的话：「你们自己知道，我的需要和与我同在之人的需要，都是我这双手供给了。」是的，真正的施舍在于从自己的劳作中施与。但请注意，那位劳作的人，是一个无论白天黑夜都不断宣讲的人。
  - type: paragraph
    text:
      ru: 'Деян.20:35.Во всем показал я вам, что, так трудясь, надобно поддерживать слабых и памятовать слова Господа Иисуса, ибо Он Сам сказал: «блаженнее давать, нежели принимать».'
      cn: (使徒行传 20:35) 我凡事給你們指示了，叫你們知道應當這樣勞苦，扶助軟弱的人，又當記念　主耶穌的話，說：『施比受更為有福。』」
  - type: paragraph
    text:
      ru: Не можете укрываться незнанием. Я показал вам самим делом, что нужно трудиться и памятовать это слово Господа Иисуса. Но где сказал Господь это? Быть может, апостолы передали это неписьменно или это ясно по умозаключению. Одна степень – отказаться от всего, другая – доставлять себе необходимое, третья – доставлять не только себе, но и другим, четвертая – не брать и тогда, когда проповедуешь и имеешь возможность брать. Не сказано, однако же, что брать – худое дело, но – что лучше не брать.
      cn: 你们不能以无知为遁词。我已亲自向你们示明，当劳作并谨记主耶稣的这句训言。然而，主在何处说过此话呢？或许使徒们以口传方式传下此言，抑或此言可凭推理而明晰。其一境界是舍弃一切，其二是只为自己提供必需，其三是不仅为自己，也为他人提供必需，其四是即便在宣讲且有能力收取时也不收取。然而，经文并未言明收取是恶事，而是说不收取更佳。
  - type: paragraph
    text:
      ru: Деян.20:36–38.Сказав это, он преклонил колени свои и со всеми ими помолился. Тогда немалый плач был у всех, и, падая на выю Павла, целовали его, скорбя особенно от сказанного им слова, что они уже не увидят лица его. И провожали его до корабля.
      cn: (使徒行传 20:36-38) 保羅說完了這話，就跪下同眾人禱告。 眾人痛哭，抱著保羅的頸項，和他親嘴。 叫他們最傷心的，就是他說，以後不能再見我的面那句話。他們於是送他上船去了。
  - type: paragraph
    text:
      ru: Заметить нужно, что тому, кто расстается, следует сотворить коленопреклонение и молитву со всеми присутствующими и тогда уже удаляться. Сила расположения к Павлу обнимавших его в последний раз и от последней беседы его почувствовавших сильную любовь и дружбу видна в словах:«падая на выю Павла.
      cn: 应当注意，凡是告别的人，都应与所有在场的人一同跪拜祷告，然后再离开。那些在最后一次拥抱他、并从他最后的谈话中感受到强烈爱和友谊的人，他们对保罗的深厚情感，从以下的话语中可见一斑：「扑在保罗的颈项上。」
- type: heading1
  text:
    ru: Глава двадцать первая
    cn: 第二十一章
  children:
  - type: paragraph
    text:
      ru: Деян.21:1–3.Когда же мы, расставшись с ними, отплыли, то прямо пришли в Кос, на другой день в Родос и оттуда в Патару. И, найдя корабль, идущий в Финикию, взошли на него и отплыли. Быв в виду Кипра и оставив его слева, мы плыли в Сирию, и пристали в Тире; ибо тут надлежало сложить груз с корабля.
      cn: (使徒行传 21:1-3) 我們離別了眾人，就開船一直行到哥士。第二天到了羅底，從那裏到帕大喇， 遇見一隻船要往腓尼基去，就上船起行。 望見塞浦路斯，就從南邊行過，往敘利亞去，我們就在推羅上岸，因為船要在那裏卸貨。


        当我们与他们告别，启航之后，我们直航至哥士，次日抵达罗底，并从那里去了帕大喇。在那里找到了一艘开往腓尼基的船，我们就上船启航了。我们望见塞浦路斯，将它留在左边，继续航行往叙利亚，在推罗靠岸；因为在那里必须卸下船上的货物。'
  - type: paragraph
    text:
      ru: Лука употребляет сильное выражение, говоря«расставшись с ними»(отторгшимся от них«ц. – слав. – Ред.)». И это вполне выразительно, потому что после отторжения они не могли войти в море. Что значит:«прямо пришли?»Это значит, что все другие места прошли мимо, не останавливаясь в них.
      cn: 卢卡使用了强烈的表达，说「与他们分别」（从他们当中被隔绝——教会斯拉夫语——编者注）。这表达颇具深意，因为在隔绝之后，他们便无法进入海中。这「直抵」是什么意思？这意味着所有其他地方都被径直越过，没有在其中停留。
  - type: paragraph
    text:
      ru: «Найдя корабль, идущий в Финикию». Быть может, корабль этот имел здесь, в Патаре, стоянку; и они, не найдя корабля, отправлявшегося в Кесарию а найдя корабль, отходивший в Финикию, на нем и отправились и оставили в стороне Кипр и Сирию, так как выражение«оставив слева»не без цели прибавлено, но чтобы показать, что они не думали даже и подойти к Сирии.
      cn: «寻见一只船往腓尼基去»。这艘船也许在帕塔拉有停靠；他们没有寻见一只开往凯撒利亚的船，却寻见了一只开往腓尼基的船，就乘它出发了，把塞浦路斯和叙利亚撇在了一旁。因为「留在左边」这个表达并非无故加上，而是为了表明他们甚至没想过靠近叙利亚。
  - type: paragraph
    text:
      ru: Деян.21:4–7.И, найдя учеников, пробыли там семь дней. Они, по внушению Духа, говорили Павлу, чтобы он не ходил в Иерусалим. Проведя эти дни, мы вышли и пошли, и нас провожали все с женами и детьми даже за город; а на берегу, преклонив колени, помолились. И, простившись друг с другом, мы вошли в корабль, а они возвратились домой. Мы же, совершив плавание, прибыли из Тира в Птолемаиду, где, приветствовав братьев, пробыли у них один день.
      cn: (使徒行传 21:4-7) 找著了門徒，就在那裏住了七天。他們被　靈感動，對保羅說：「不要上耶路撒冷去。」 過了這幾天，我們就起身前行。他們眾人同妻子兒女，送我們到城外，我們都跪在岸上禱告。 彼此既辭別了，我們便取船；他們就回家去了。 我們從推羅行盡了水路，來到多利買，就問那裏的弟兄安，和他們同住了一天。

        于是寻得门徒，在那里住了七天。他们受圣灵感动，告诉保罗不要上耶路撒冷去。过了这些日子，我们起身去了，众人同妻子儿女送我们直到城外；在海边上，我们屈膝祷告了。互相辞别了，我们便上了船，他们就回去了。我们航行完毕，从推罗来到托勒迈，在那里问了弟兄们安，和他们同住了一天。'
  - type: paragraph
    text:
      ru: Если Павлу повелевал Дух, то почему же он воспротивился? Ведь ученики говорили, зная от Духа об угрожавших ему опасностях. Да, они не убеждали его«по внушению Духа», не предсказывали ему прямо предстоящие ему опасности, а, щадя его, просто говорили,«чтобы он не ходил в Иерусалим». <…>
      cn: 如果圣灵吩咐保罗，那他为何要违抗呢？毕竟门徒们曾说过，他们是藉着圣灵得知有临到他的危险。是的，他们并没有「受圣灵启示而」说服他，也未曾直接预言临到他的危险，而是，怜惜他，只是说「叫他不要去耶路撒冷」。<…>
  - type: paragraph
    text:
      ru: Деян.21:8–9.А на другой день Павел и мы, бывшие с ним, выйдя, пришли в Кесарию и, войдя в дом Филиппа благовестника, одного из семи диаконов, остались у него. У него были четыре дочери девицы, пророчествующие.
      cn: (使徒行传 21:8-9) 第二天，我們作保羅同伴的人離開那裏，來到凱撒利亞，就進了傳福音的腓利家裏，和他同住。他是那七個執事裏的一個。 他有四個女兒，都是處女，是說預言的。

        次日，保罗和与他同行的我们，出去，到了凯撒利亚，进了传福音者腓利普的家，他是七位执事中的一位，就住在他那里。他有四个女儿，都是童贞女，她们都作先知说预言。'
  - type: paragraph
    text:
      ru: У диакона Филиппа были дочери. Но заметь, что дочери его были девицы и пророчицы и что они более всего благочестием достигли того, что удостоились даже дара пророчества. Писатель не присовокупил бы, что они были девицы, если бы это не стоило внимания.
      cn: 执事腓利有女儿。但请注意，他的女儿们是贞女和女先知，而且她们最重要的是藉着虔诚达到了被赋予预言恩赐的程度。作者若非认为她们是贞女这一点值得关注，就不会特意附加说明。
  - type: paragraph
    text:
      ru: 'Деян.21:10–11.Между тем как мы пребывали у них многие дни, пришел из Иудеи некто пророк, именем Агав; и, войдя к нам, взял пояс Павлов и, связав себе руки и ноги, сказал: так говорит Дух Святый: мужа, чей этот пояс, так свяжут в Иерусалиме Иудеи и предадут в руки язычников.'
      cn: (使徒行传 21:10-11) 我們在那裏多住了幾天，有一個先知，名叫亞迦布，從猶太下來， 到了我們這裏，就拿保羅的腰帶捆上自己的手腳，說：「　聖靈說：『猶太人在耶路撒冷，要如此捆綁這腰帶的主人，把他交在外邦人手裏。』
  - type: paragraph
    text:
      ru: 'Это тот Агав, который раньше предсказал голод. Но горько то, что«предадут в руки язычников». Заметь: как только услышал, что ему предстоит перенести множество бедствий, начинает торопиться. Агав не сказал, что свяжут Павла, чтобы не подумали, что он говорит, условившись заранее, нет, он сказал:«мужа, чей этот пояс.'
      cn: 这正是先前预言饥荒的那位亚迦布。然而，令人痛苦的是，他将『被交在外邦人手中』。请留意：他一听到自己将要遭受诸多苦难，便开始匆忙行动。亚迦布没有说『他们将捆绑保罗』，以免人们以为他与保罗事先约定；不，他是这样说的：『这腰带的主人』。
  - type: paragraph
    text:
      ru: 'Деян.21:12–14.Когда же мы услышали это, то и мы и тамошние просили, чтобы он не ходил в Иерусалим. Но Павел в ответ сказал: что вы делаете? что плачете и сокрушаете сердце мое? я не только хочу быть узником, но готов умереть в Иерусалиме за имя Господа Иисуса. Когда же мы не могли уговорить его, то успокоились, сказав: да будет воля Господня!»'
      cn: (使徒行传 21:12-14) 我們和那本地的人聽見這些話，都苦勸保羅不要上耶路撒冷去。 保羅說：「你們為甚麼這樣痛哭，使我心碎呢？我為　主耶穌的名，不但被人捆綁，就是死在耶路撒冷也是願意的。」 保羅既不聽勸，我們便住了口，只說：「願　主的旨意成就。」便了。


        当我们听见这话时，我们和当地的信徒都请求他不要上耶路撒冷去。保罗却回答说：「你们在做什么呢？为什么哭泣，破碎我的心呢？我不但预备好被囚禁，而且预备好在耶路撒冷为了主耶稣的名舍命。」当我们无法说服他时，我们便息了声，说：「愿主的旨意成就吧！」'
  - type: paragraph
    text:
      ru: 'Прочие плакали, а Павел утешал их: и тот, кто не страшился собственных испытаний, скорбел по поводу их слез. О вас плачу, говорит он, а не о страданиях, какие мне предстоят, потому что ради Господа Иисуса я готов и умереть. Когда же не могли убедить его, то замолчали, потому что осознали, что на это была воля Божия. Нужно заметить, что следует останавливать тех, кто препятствует кому-нибудь сделать какое-нибудь благородное дело, хотя бы они и плакали. А эти слезы и самого Павла трогали, и ослабляли его силу. Поэтому он их и порицает.'
      cn: 其他人哭泣着，而保罗则安慰他们；那不惧怕自身试炼的人，却因他们的眼泪而悲伤。「我为你们哭泣，」他说，「而不为我将要面临的苦难，因为为了主耶稣，我甚至愿意受死。」当他们无法说服他时，便沉默了，因为他们意识到这是上帝的旨意。值得注意的是，应当阻止那些妨碍他人成就高尚之事的人，即使他们哭泣。而这些眼泪既触动了保罗自己，也削弱了他的力量。因此他责备他们。
  - type: paragraph
    text:
      ru: Деян.21:15–19.После сих дней, приготовившись, пошли мы в Иерусалим. С нами шли и некоторые ученики из Кесарии, провожая нас к некоему давнему ученику, Мнасону Кипрянину, у которого можно было бы нам жить. По прибытии нашем в Иерусалим братия радушно приняли нас. На другой день Павел пришел с нами к Иакову; пришли и все пресвитеры. Приветствовав их, Павел рассказывал подробно, что сотворил Бог у язычников служением его.
      cn: (使徒行传 21:15-19) 過了幾日，我們收拾行李上耶路撒冷去。 有凱撒利亞的幾個門徒和我們同去，帶我們到一個老門徒的家裏，叫我們與他同住；他名叫拿孫，是塞浦路斯人。 到了耶路撒冷，弟兄們歡歡喜喜的接待我們。 第二天，保羅同我們去見雅各；長老們也都在那裏。 保羅問了他們安，便將　上帝用他傳教，在外邦人中間所行之事，一一的述說了。


        这些日子以后，我们预备好了，就往耶路撒冷去。有几个凯撒利亚的门徒和我们同去，领我们到一个素识的门徒家里去，他名叫拿孙，是居比路人，我们就在他家里住宿。我们到了耶路撒冷，弟兄们欢喜地接待我们。第二天，保罗同我们去见雅各；众长老也都在那里。保罗问了他们的安，就把上帝藉着他的事奉，在外邦人中间所行的一切事，都一一地告诉他们。'
  - type: paragraph
    text:
      ru: Слово«приготовившись»означает «взяв все необходимое для путешествия».
      cn: 词«приготовившись»意为«备妥旅程所需的一切»。
  - type: paragraph
    text:
      ru: «На другой день Павел пришел с нами к Иакову». Иаков был иерусалимским епископом; это брат Господа, муж великий и достойный удивления. Рассказывает им Павел, что случилось у язычников, не по тщеславию, но желая показать Божие человеколюбие.
      cn: 第二天，保罗与我们一同来到雅各那里。雅各是耶路撒冷的主教；他是主的兄弟，一位伟大且值得惊叹的人。保罗向他们讲述在外邦人那里所发生的一切，并非出于虚荣，而是渴望显明上帝的仁爱。
  - type: paragraph
    text:
      ru: «Служением его», то есть проповеданием евангельского учения.
      cn: «他的服侍», 也就是说宣讲福音的教义。
  - type: paragraph
    text:
      ru: 'Деян.21:20–23.Они же, выслушав, прославили Бога и сказали ему: видишь, брат, сколько тысяч уверовавших Иудеев, и все они ревнители закона. А о тебе наслышались они, что ты всех Иудеев, живущих между язычниками, учишь отступлению от Моисея, говоря, чтобы они не обрезывали детей своих и не поступали по обычаям. Итак что же? Верно соберется народ; ибо услышат, что ты пришел. Сделай же, что мы скажем тебе.'
      cn: (使徒行传 21:20-23) 他們聽見，就歸榮耀與　主，對保羅說：「兄台，你看猶太人中信　主的有多少萬，並且都為律法熱心。 他們聽見人說：「你教訓一切在外邦的猶太人離棄摩西，對他們說：「不要給孩子行割禮，也不要遵行條規。 這可怎麼辦呢？眾人必要一同聚集；因他們要聽見你來了。 你就照著我們所告訴你的行吧。我們這裏有四個人，都有願在身；


        他们听了，就荣耀上帝，对他说：「弟兄，你看，成千上万信主的犹太人，他们都是律法的热心者。关于你，他们听说你教导所有住在外邦人中的犹太人离弃摩西，告诉他们不要给他们的孩子行割礼，也不要遵行那些规矩。那么怎么办呢？众人必定聚集，因为他们会听说你来了。照我们所告诉你的去做吧。」'
  - type: paragraph
    text:
      ru: Эти тысячи иудеев уверовавших – из тех, которые кричали:«Кровь Его на нас и на детях наших»(Мф. 27, 25). Однако же Человеколюбец и из них и из детей их принял многих и даровал им неисчислимые блага.
      cn: 这些归信的数千犹太人，正是那些曾呼喊「祂的血归到我们和我们的子孙身上」（马太福音 27:25）的人。然而，爱人之主却从他们和他们的子孙中接纳了许多人，并恩赐了他们无数的福分。
  - type: paragraph
    text:
      ru: Деян.21:23–24.Есть у нас четыре человека, имеющие на себе обет. Взяв их, очистись с ними, и возьми на себя издержки на жертву за них, чтобы остригли себе голову, и узнают все, что слышанное ими о тебе несправедливо, но что и сам ты продолжаешь соблюдать закон.
      cn: (使徒行传 21:23-24) 你就照著我們所告訴你的行吧。我們這裏有四個人，都有願在身； 你帶他們去，與他們一同行潔淨的禮，替他們拿出規費，叫他們得以剃頭。這樣，眾人就可知道，先前所聽見你的事都是虛的；並可知道，你自己為人，循規蹈矩，遵守律法。
  - type: paragraph
    text:
      ru: 'Много видов обетов: одни обещали жертвы, другие – деньги, третьи – себя самих, а четвертые – не пить вина и не стричь головы известное число дней. К разряду последних принадлежали и эти мужи. Волосы были символом умерщвления, потому что они, как мертвые, не ощущают боли.'
      cn: 有很多种类的誓愿：有的许诺献上祭物，有的许诺奉献钱财，有的许诺奉献自身，还有的许诺在特定天数内不饮酒、不剪发。这些许愿之人就属于最后一类。头发是治死肉体的象征，因为它们如同死物，不觉疼痛。
  - type: paragraph
    text:
      ru: «Взяв их, очистись с ними, и возьми на себя издержки на жертву за них». То есть, говорит, жертвы, какие, по закону, должны быть принесены за них, представь ты, чтобы уничтожить всякое подозрение. Защитись, говорится, делом, а не словом.
      cn: 「领了他们，与他们一同洁净自己，并承担为他们献祭的费用。」也就是说，他说，那些按律法当为他们献上的祭物，要由你来献上，以消除一切疑虑。意思是说，要凭着行为，而非言语，来证明自己清白。
  - type: paragraph
    text:
      ru: «Чтобы остригли себе голову, и узнают все, что слышанное ими о тебе несправедливо». Было в обычае, что давшие обет, по очищении, стригли голову и в таком виде в продолжение семи дней делали приношения за себя. Нечто такое же сделали Акила и Прискилла, чтобы было явно, что они стригли голову как почитатели Бога.
      cn: 「他们要剃头，众人便会知道他们所听闻关于你的事是不公的。」按着习俗，那些许下誓愿的人，在洁净之后剃头，并在此种状态下连续七日为自己献上祭物。亚居拉和百基拉也同样行了，为要显明他们剃头是作为上帝的敬拜者。
  - type: paragraph
    text:
      ru: Деян.21:25.А об уверовавших язычниках мы писали, положив, чтобы они ничего такого не наблюдали, а только хранили себя от идоложертвенного, от крови, от удавленины и от блуда.
      cn: (使徒行传 21:25) 至於信主的外邦人，我們已經寫信擬定，叫他們不必遵守這樣的規矩，只謹忌那祭偶像之物，和血，並勒死的牲畜，與姦淫。」
  - type: paragraph
    text:
      ru: Как мы заповедуем язычникам, хотя проповедуем иудеям, так и ты содействуй нам, хотя проповедуешь язычникам. Не бойся, дело – в снисхождении.
      cn: 正如我们教诲外邦人，尽管我们向犹太人宣讲，你也要照样与我们同工，尽管你向外邦人宣讲。不要害怕，要务在于俯就。
  - type: paragraph
    text:
      ru: Деян.21:26.Тогда Павел, взяв тех мужей и очистившись с ними, в следующий день вошел в храм и объявил окончание дней очищения, когда должно быть принесено за каждого из них приношение.
      cn: (使徒行传 21:26) 於是保羅帶著那四個人，第二天與他們一同行了潔淨的禮，進了殿，報明潔淨的日期滿足，只等祭司為他們各人獻祭。
  - type: paragraph
    text:
      ru: Остригся Павел и исполнил все иудейские обряды, но не потому, что изменил свое мнение (так как это было бы делом нечистым от порока), а потому, что любовь снисходительна.
      cn: 保罗剃发并遵守了所有犹太教的礼仪，但不是因为他改变了心意（因为那将是出于罪恶的不洁之事），而是因为爱是迁就的。
  - type: paragraph
    text:
      ru: «Объявил окончание дней очищения», то есть сам объявлял о себе, что очищение закончено.
      cn: 宣告了净化日子的完结，也就是说，他自己宣告说，净化已经完成了。
  - type: paragraph
    text:
      ru: 'Деян.21:27–29.Когда же семь дней оканчивались, тогда Асийские Иудеи, увидев его в храме, возмутили весь народ и наложили на него руки, крича: мужи Израильские! помогите: этот человек всех повсюду учит против народа и закона и места сего; притом и Еллинов ввел в храм и осквернил святое место сие. Ибо перед тем они видели с ним в городе Трофима Ефесянина и думали, что Павел его ввел в храм.'
      cn: (使徒行传 21:27-29) 那七日將完，從亞細亞來的猶太人看見保羅在殿裏，就聳動了眾百姓，下手拿他， 喊叫說：「以色列人來幫助，這就是在各處教訓眾人蹧踐我們百姓和律法，並這地方的。他又帶著希臘人進殿，污穢了這聖地。」 （這話是因他們曾看見以弗所人特羅非摩同保羅在城裏，以為保羅帶他進了殿。）
  - type: paragraph
    text:
      ru: 'Замечай Божие устроение: после того как одни разубедились, другие, из опасения, чтобы не разубедились и остальные, нападают на Павла. Беспокойный характер их виден везде.'
      cn: 留心上帝的安排：在一些人失去确信之后，另一些人，因为担心其余的人也会失去确信，便攻击保罗。他们那不安分的性情处处可见。
  - type: paragraph
    text:
      ru: 'Деян.21:30–34.Весь город пришел в движение, и сделалось стечение народа; и, схватив Павла, повлекли его вон из храма, и тотчас заперты были двери. Когда же они хотели убить его, до тысяченачальника полка дошла весть, что весь Иерусалим возмутился. Он, тотчас взяв воинов и сотников, устремился на них; они же, увидев тысяченачальника и воинов, перестали бить Павла. Тогда тысяченачальник, приблизившись, взял его и велел сковать двумя цепями, и спрашивал: кто он, и что сделал. В народе одни кричали одно, а другие другое. Он же, не могши по причине смятения узнать ничего верного, повелел вести его в крепость.'
      cn: (使徒行传 21:30-34) 合城都震動，百姓一齊跑來，拿住保羅，拉他出殿，殿門立刻都關了。 他們正想要殺他，有人報信給營裏的軍長說：「耶路撒冷合城都亂了。」 軍長立時帶著兵丁和幾個百夫長，跑下去到他們那裏。他們見了軍長和兵丁，就止住不打保羅。 於是軍長上前拿住他，吩咐用兩條鐵鏈捆鎖；又問他是甚麼人，他所作的是甚麼事。 眾人有喊叫這個的，有喊叫那個的；軍長因為這樣亂嚷，得不著實情，就吩咐人將保羅帶進營樓去。
  - type: paragraph
    text:
      ru: Хотели убить и тащили его из храма, чтобы с большим бесстрашием совершить убийство.
      cn: 他们想要杀害他，并将他从圣殿里拖出去，好能更加肆无忌惮地实施杀害。
  - type: paragraph
    text:
      ru: 'Деян.21:35–38.Когда же он был на лестнице, то воинам пришлось нести его по причине стеснения от народа, ибо множество народа следовало и кричало: смерть ему! При входе в крепость Павел сказал тысяченачальнику: можно ли мне сказать тебе нечто?»'
      cn: (使徒行传 21:35-38) 到了臺階上，百姓擠得兇猛，兵丁只得將保羅抬起來。 眾人跟在後面，喊著說：「除掉他。」 將要帶他進營樓，保羅對軍長說：「我對你說句話可以不可以？」他說：「你懂得希臘話嗎？ 你不是從前作亂、帶領四千兇徒往曠野去的那埃及人嗎？」
  - type: paragraph
    text:
      ru: '«А тот сказал: ты знаешь по-Гречески? Так не ты ли тот Египтянин, который перед сими днями произвел возмущение и вывел в пустыню четыре тысячи человек разбойников?»'
      cn: 那人说：「你懂得希腊文吗？莫非你就是那个前些日子煽动叛乱，并带领四千强盗到旷野的埃及人？」
  - type: paragraph
    text:
      ru: Говорят«смерть ему!»применительно к римскому обычаю, так как у иудеев было в обычае кричать эту фразу против праведников, как кричали они и против Господа:«Смерть Ему»(Лк. 23, 18).
      cn: 人们说「处死他！」，这是指罗马的习俗，因为犹太人素来有此习俗，向义人呼喊这句话，正如他们也曾对主呼喊：「处死他！」（路加福音 23:18）。
  - type: paragraph
    text:
      ru: «Не ты ли тот Египтянин?»Явился один египтянин, производивший нововведения, бунтовщик, обольститель и чародей. Диавол и польстил себя надеждой воспользоваться этим человеком и представить как Христа, так и апостолов участниками в тех преступлениях, какие были учинены последователями этого египтянина.
      cn: '«你莫非就是那埃及人吗？»

        出现了一位埃及人，此人行异端，是叛乱者、迷惑者，亦是巫师。魔鬼便心存妄念，欲利用此人，将基督和使徒们都描绘成那些由这位埃及人的追随者所犯下的罪行的共犯。'
  - type: paragraph
    text:
      ru: 'Деян.21:39.Павел же сказал: я Иудеянин, Тарсянин, гражданин небезызвестного Киликийского города; прошу тебя, позволь мне говорить к народу.'
      cn: (使徒行传 21:39) 保羅說：「我本是猶太人，生在基利家的大數城，並不是無名小城的人。求你准我對百姓說話。」
  - type: paragraph
    text:
      ru: Мы, христиане, – истинные иудеи, как исповедующие истинную веру, потому что имя «Иуда» значит «исповедание». Так как тысяченачальник спросил, не он ли тот египтянин, то Павел прежде всего отклоняет его от этого подозрения. А чтобы тот не подумал, что он по происхождению иудей, объявляет потом свою веру. Итак, что же? Он не отрекся? Да не будет! Он был иудей и христианин.
      cn: 我们基督徒是真正的犹太人，因为我们宣认真信仰，而「犹大」这个名字意为「宣认」。既然千夫长问他是否是那个埃及人，于是保罗首先打消了他的这个怀疑。为了使他（千夫长）不以为他按出身是犹太人，（他）接着宣告自己的信仰。那么，又如何呢？他没有否认吗？断乎不可！他是犹太人，也是基督徒。
  - type: paragraph
    text:
      ru: «Позволь мне говорить к народу». Это самое сильное доказательство того, что он не был ни в чем виноват, – так готов был он к защите себя и так хотел обратиться со словом к народу иудейскому.
      cn: 「请允许我向百姓讲话。」 这是他没有任何过错的最有力证据，– 他如此准备好为自己辩护，并且如此渴望向犹太百姓发言。
  - type: paragraph
    text:
      ru: Деян.21:40.Когда же тот позволил, Павел, стоя на лестнице, дал знак рукою народу; и, когда сделалось глубокое молчание, начал говорить на еврейском языке так.
      cn: (使徒行传 21:40) 軍長准了。保羅就站在臺階上，向百姓用手示意，他們都靜默無聲，保羅便用希伯來話對他們說：
  - type: paragraph
    text:
      ru: Много способствовало ему само место – лестница, – именно то, что он говорил, стоя высоко и будучи связан. Видеть связанного двумя цепями Павла говорящим к народу – что может быть равное этому зрелищу? Как не устрашился он, глядя на такое множество возбужденного народа!
      cn: 他所处之地——那阶梯——助益良多，尤其是他站在高处、身受捆绑时所讲的话语。看到身被两道铁链捆绑的保罗向民众讲话——还有什么能与这景象匹敌呢？他看着如此众多激动不已的民众，怎能不感到恐惧呢！
- type: heading1
  text:
    ru: Глава двадцать вторая
    cn: 第二十二章
  children:
  - type: paragraph
    text:
      ru: Деян.22:1–2.Мужи братия и отцы! выслушайте теперь мое оправдание перед вами. Услышав же, что он заговорил с ними на Еврейском языке, они еще более утихли. Он сказал.
      cn: (使徒行传 22:1-2) 「諸位父兄請聽，我現在對你們分訴。」 （眾人聽他說的是希伯來話，就更加安靜了。）
  - type: paragraph
    text:
      ru: Выражение"отцы" –знак уважения, а выражение«братия» –указание на родство. Посмотри, его слово и чуждо лести, и исполнено кротости. Не сказал «господа», но – «братья», что особенно было приятно народу. Я не чужой вам, говорит, и не против вас.
      cn: 表达「父老们」是尊敬的标志，而表达「弟兄们」是指明亲属关系。你看，他的话语既没有谄媚，又充满了温柔。他没有说「先生们」，而是「弟兄们」，这尤其令百姓感到欣喜。「我不是你们的陌生人，」他说，「也不是与你们作对的。」
  - type: paragraph
    text:
      ru: «Услышав же, что он заговорил… на Еврейском языке». Видишь, как подействовало на них то, что он говорил одним с ними языком, – они имели некоторого рода уважение к этому языку.
      cn: «当他们听见他用希伯来语说话……» 你看，他用与他们相同的语言说话，这对他们产生了怎样的影响——他们对这种语言抱有某种敬意。
  - type: paragraph
    text:
      ru: Деян.22:3–4.Я Иудеянин, родившийся в Тарсе Киликийском, воспитанный в сем городе при ногах Гамалиила, тщательно наставленный в отеческом законе, ревнитель по Боге, как и все вы ныне. Я даже до смерти гнал последователей сего учения, связывая и предавая в темницу и мужчин и женщин.
      cn: (使徒行传 22:3-4) 保羅說：「我誠然是猶太人，生在基利家的大數城，長在這城裏，在迦瑪列門下，按著我們祖宗嚴緊的律法受教，熱心事奉　上帝，像你們眾人今日一樣。 我也曾逼迫奉這道的人，直到死地，無論男女都鎖拿下監。

        我是一个犹太人，出生在基利家的大数，在这城里，在迦玛列门下长大，严格按照祖宗的律法受教，为上帝大发热心，正如你们今日所有的人一样。我曾逼迫这道的跟随者，甚至置他们于死地，捆绑，下在监里，无论男女。'
  - type: paragraph
    text:
      ru: Таким началом пролагает путь к речи:"Я", говорит,"Иудеянин". Слышать это для них было приятней всего. Но чтобы снова не подумали, что он иудей по народности, а не по вере, присовокупляет:«родившийся в Тарсе Киликийском, воспитанный в сем городе». Показывает большое внимание свое к вере, так что, оставив так далеко и такое славное отечество свое, пожелал изучить здесь закон. Не просто говорит «у Гамалиила», но –«при ногах Гамалиила»,указывая этим на постоянное, неослабное прилежание и внимание и на большое уважение к этому мужу.
      cn: 以此为开篇，为言语铺平道路，他说：「我是一个犹太人。」对他们而言，听到这句是最令人欣悦的。但为免他们再次认为他仅是民族上的犹太人，而非信仰上的犹太人，他补充说：「我出生在基利家的大数，在这城里长大。」这显示了他对信仰的极大热忱，以至于他舍弃如此遥远而光荣的故土，渴望在此地学习律法。他并非仅仅说「在迦玛列门下」，而是说「在迦玛列脚前」，这表明了他持续不懈的勤勉、专注，以及对这位人物的极大敬意。
  - type: paragraph
    text:
      ru: «Наставленный в отеческом законе», – наставлен не просто закону, но отеческому закону. Итак, что же? Ты изучил прекрасно закон, а не защищаешь его и не любишь?
      cn: 「被教导了先祖的律法」——不是仅仅被教导了律法，而是被教导了先祖的律法。那么，又当如何？你已经出色地研习了律法，却不捍卫它，也不爱它吗？
  - type: paragraph
    text:
      ru: '«Ревнитель»,говорит. Так как Павел много уже высказал себе похвал, то обобщает:«Как и все вы ныне». Но обрати внимание, на скольких свидетелей ссылается он: и на старцев, и на первосвященника, и на городских жителей. До сих пор имеет он свидетелей; но последующее содержание речи не находит уже свидетелей.'
      cn: 「热心者，」他说。既然保罗已经对自己多有称赞，他便概括地说：「就像你们所有人现在这样。」但请注意，他引用了多少见证人：有长老、有大祭司，还有城里的居民。直到现在他都有见证人；但之后的话语内容就再没有见证人了。
  - type: paragraph
    text:
      ru: 'Деян.22:5–8.Как засвидетельствует о мне первосвященник и все старейшины, от которых и письма взяв к братиям, живущим в Дамаске, я шел, чтобы тамошних привести в оковах в Иерусалим на истязание. Когда же я был в пути и приближался к Дамаску около полудня вдруг осиял меня великий свет с неба. Я упал на землю и услышал голос, говоривший мне: «Савл, Савл! что ты гонишь Меня?» Я отвечал: «кто Ты, Господи?» Он сказал мне: «Я Иисус Назорей, Которого ты гонишь».'
      cn: (使徒行传 22:5-8) 這是大祭司和眾長老都可以給我作見證的。我又領了他們達與弟兄的書信，往大馬士革去，要把在那裏奉這道的人鎖拿，帶到耶路撒冷受刑。」 「我將到大馬士革，正走的時候，約在正午，忽然從天上發大光，四面照著我。 我就仆倒在地，聽見有聲音對我說：『掃羅。掃羅。你為甚麼逼迫我？』 我回答說：『　主啊，你是誰？』他對我說：『我就是你所逼迫、拿撒勒的耶穌。』


        正如大祭司和众长老都可以为我作证。我也从他们那里领了书信，带给住在大马士革的弟兄们，我前去，是要把那里的人捆绑起来，带回耶路撒冷受刑罚。当我行路，临近大马士革的时候，大约在中午，忽然有大光从天上四面照着我。我扑倒在地，也听见有声音对我说：「扫罗，扫罗！你为什么逼迫我？」我回答说：「主啊，祢是谁？」他对我说：「我就是你所逼迫的拿撒勒人耶稣。」'
  - type: paragraph
    text:
      ru: Чтобы не подумали, что это выдумка, Павел показывает, что он делал все по любви и ревности, а не по тщеславию.
      cn: 为了不让人认为这是捏造，保罗表明，他所做的一切都是出于爱和热忱，而不是出于虚荣。
  - type: paragraph
    text:
      ru: 'Деян.22:9–13.Бывшие же со мною свет видели, и пришли в страх; но голоса Говорившего мне не слыхали. Тогда я сказал: «Господи! что мне делать?» Господь же сказал мне: «встань и иди в Дамаск, и там тебе сказано будет всё, что назначено тебе делать». А как я от славы света того лишился зрения, то бывшие со мною за руку привели меня в Дамаск. Некто Анания, муж благочестивый по закону, одобряемый всеми Иудеями, живущими в Дамаске, пришел ко мне и, подойдя, сказал мне: «брат Савл! прозри». И я тотчас увидел его.'
      cn: (使徒行传 22:9-13) 與我同行的人實在看見了那光，並且害怕，卻沒有聽明那位對我說話的聲音。 我說：『　主啊，我當作甚麼？』　主說：『起來，進大馬士革去，在那裏，要將所派你作的一切事告訴你。』 我因那光的榮耀不能看見，同行的人就拉著我手進了大馬士革。 那裏有一個人，名叫亞拿尼亞，按著律法是虔誠人，為一切住在那裏的猶太人所稱讚。 他來見我，站在旁邊，對我說：『兄弟掃羅，你可以看見。』我當時往上一看，就看見了他。


        与我同行的人看见了光，并且甚是惧怕；却听不见那对我说话者的声音。于是我说：「上主啊！我当作什么？」上主对我说：「你起来，往大马士革去，在那里，凡指定你所当作的一切，都将指示你。」又因那光的荣耀，我失去了视力，于是与我同行的人，就拉着我的手，把我领进大马士革。有一个名叫亚拿尼亚的人，是按律法敬虔的人，为所有住在大马士革的犹太人所称赞，他来到我这里，站在我身旁对我说：「扫罗弟兄！你复明罢！」我立刻就看见了他。'
  - type: paragraph
    text:
      ru: Это было с целью, так как он один должен был выслушать глас оный. А так как люди довольно посредственные доверяют более зрению, то бывшие с Савлом только«свет видели, и пришли в страх; но голоса Говорившего мне не слыхали». И свет произвел такое действие не для них, а для Савла; поэтому и зрения лишил его, а не их; но в то время, когда свет изливался на него, и им дозволялось смотреть на этот свет, если хотели. Мне же кажется, что они не уверовали по особенному Божественному устроению, чтобы быть такими свидетелями события, которым иудеи не могли не верить.
      cn: 这是有目的的，因为唯独他一人必须聆听那声音。又因为那些相当平庸的人更相信眼见，于是与扫罗同在的人只「看见光，并感到惊恐；但没有听见对我说话者的声音。」这光所产生的这种作用不是为了他们，而是为了扫罗；因此也使他失明，而非他们失明；但在光倾泻在他身上时，如果他们愿意，也允许他们观看这光。而在我看来，他们没有相信，是出于特别的属上帝的安排，目的是要他们成为这事件的见证人，而犹太人无法不相信这些见证。
  - type: paragraph
    text:
      ru: «Бывшие со мною за руку привели меня в Дамаск». Прекрасно прилагается упоминание о городе, чтобы знали иудеи, что Савл был гонителем. Павел-Савл переплетает свидетельства лиц со свидетельствами обстоятельств, бывших с ним самим и с другими; свидетелями являются священники, старцы, спутники. Факты свидетельствуются фактами, а не только личностью. Свидетели – Анания, человек посторонний, далее – самый факт, то есть прозрение.
      cn: «与我同在的人，牵着我的手，把我带进了大马士革城。» 这处提及这座城市，运用得极好，以便犹太人知晓扫罗曾是迫害者。保罗-扫罗将个人的见证与发生在他自己和他人身上的事件的见证交织在一起；见证人有祭司、长老和他的同伴们。事实是由事实所见证，而不仅仅是凭借个人。见证人有亚拿尼亚，一个外人，再者，是事实本身，即重获视力。
  - type: paragraph
    text:
      ru: 'Деян.22:14.Он же сказал мне: «Бог отцов наших предызбрал тебя, чтобы ты познал волю Его, увидел Праведника и услышал глас из уст Его.'
      cn: (使徒行传 22:14) 他又說：『我們祖宗的　上帝揀選了你，叫你明白他的旨意，又得見那　義者，聽他口中所出的聲音。
  - type: paragraph
    text:
      ru: Прекрасно сказал:«Бог отцов наших»,чтобы показать, что они не иудеи, а отступники от закона и поступают не по ревности о Боге.
      cn: 说得真好：「我们列祖的上帝」，为了表明他们不是犹太人，而是离弃律法者，并且他们的行为并非出于对上帝的热忱。
  - type: paragraph
    text:
      ru: «Увидел Праведника». Прямо говорит так сильно, потому что если Иисус – Праведник, то они – преступники.
      cn: 「『看见了义者。』」这话直白而如此有力，因为如果耶稣是义者，那么他们就是罪犯了。
  - type: paragraph
    text:
      ru: 'Деян.22:15–18.Потому что ты будешь Ему свидетелем пред всеми людьми о том, что ты видел и слышал. Итак, что ты медлишь? Встань, крестись и омой грехи твои, призвав имя Господа Иисуса». Когда же я возвратился в Иерусалим и молился в храме, пришел я в исступление. И увидел Его, и Он сказал мне: «поспеши и выйди скорее из Иерусалима, потому что здесь не примут твоего свидетельства о Мне».'
      cn: (使徒行传 22:15-18) 因為你要將所看見的，所聽見的，對著眾人為他作見證。 現在你為甚麼耽延呢？起來，求告　主的名受浸，洗去你的罪。』」 「後來，我再到耶路撒冷，在殿裏禱告的時候，魂遊象外， 看見主向我說：『你趕緊的離開耶路撒冷，不可遲延；因你為我作的見證，這裏的人必不領受。』
  - type: paragraph
    text:
      ru: По той причине, что ты не изменишь тому и не забудешь того, что видел и слышал.
      cn: 正因你不会背弃，也不会忘记你所看见和听见的。
  - type: paragraph
    text:
      ru: «Что ты видел и слышал».Господь убеждает Савла посредством того и другого чувства, то есть посредством зрения и слуха.
      cn: 「你所看见和听见的。」主借着这两种感官，也就是说，借着视觉和听觉，说服扫罗。
  - type: paragraph
    text:
      ru: «Потому что ты будешь Ему свидетелем пред всеми людьми».
      cn: 因为你将是祂在所有人面前的见证人。
  - type: paragraph
    text:
      ru: Не перед единоплеменниками только, но и иноплеменниками, потому что свидетели на то и свидетели, чтобы свидетельствовать не перед теми, которые знают, но перед теми, которые не знают. Но это – и великое пророчество; и посмотри – оно исполнилось, потому что своими делами, своими страданиями, своими словами Павел действительно стал свидетелем у всех людей.
      cn: 不仅是向着同族人，更是向着外族人，因为证人的目的正在于此，证人是要向那些不知道的人作证，而不是向那些知道的人。但这是一个伟大的预言；看哪——它已经应验了，因为保罗确实通过他的行为、他的苦难、他的言语，成为了所有人的证人。
  - type: paragraph
    text:
      ru: 'Деян.22:19–22.Я сказал: «Господи! им известно, что я верующих в Тебя заключал в темницы и бил в синагогах; и когда проливалась кровь Стефана, свидетеля Твоего, я там стоял, одобрял убиение его и стерег одежды побивавших его». И Он сказал мне: «иди; Я пошлю тебя далеко к язычникам». До этого слова слушали его; а за сим подняли крик, говоря: истреби от земли такого! ибо ему не должно жить.'
      cn: (使徒行传 22:19-22) 我就說：『　主啊，他們知道我從前把信你的人收在監裏，又在各會堂裏鞭打他們。 並且你的殉道者司提反被害流血的時候，我也站在旁邊歡喜他的死；又看守害死他之人的衣服。』 主向我說：『你去吧。我要差你遠遠的往外邦人那裏去。』」 眾人聽他說到這句話，就高聲說：「這樣的人，從世上除掉他吧。他是不當活著的。」

        我说：「主啊！他们知道我将信靠祢的人投入监狱，并在会堂里鞭打；并且，当祢的见证人司提反的血流出时，我也在那里站着，赞同杀害他，并看守那些用石头打死他之人的衣服。」祂对我说：「你去吧；我要差遣你远远地往外邦人那里去。」众人一直听到这句话；在这之后，他们就大声喊叫说：「将这等人从地上除灭吧！因为他是不当活着的。」'
  - type: paragraph
    text:
      ru: Для чего сказал«им известно?»Сказал это, не противореча Христу, но желая понять такую непонятную вещь. Но Христос не объяснил ему, а сказал только, чтобы он шел.
      cn: 他为何说「他们知道？」他说了这话，并非与基督相悖，而是渴望明白这样一件令人费解的事。但基督并未向他解释，而只是吩咐他去。
  - type: paragraph
    text:
      ru: «И когда проливалась кровь Стефана». Напомнил им об одном жестоком убийстве, когда Стефан обличал их в то время, а они не вынесли.
      cn: «当司提反的血流出之时》。他提醒他们一起残忍的谋杀案，当时司提反正在指责他们，而他们无法忍受。
  - type: paragraph
    text:
      ru: 'Деян.22:23–29.Между тем как они кричали, метали одежды и бросали пыль на воздух, тысяченачальник повелел ввести его в крепость, приказав бичевать его, чтобы узнать, по какой причине так кричали против него. Но когда растянули его ремнями, Павел сказал стоявшему сотнику: разве вам позволено бичевать Римского гражданина, да и без суда? Услышав это, сотник подошел и донес тысяченачальнику, говоря: смотри, что ты хочешь делать? этот человек – Римский гражданин. Тогда тысяченачальник, подойдя к нему, сказал: скажи мне, ты Римский гражданин? Он сказал: да. Тысяченачальник отвечал: я за большие деньги приобрел это гражданство. Павел же сказал: а я и родился в нем. Тогда тотчас отступили от него хотевшие пытать его. А тысяченачальник, узнав, что он Римский гражданин, испугался, что связал его.'
      cn: (使徒行传 22:23-29) 眾人喧嚷，摔掉衣服，把塵土向空中揚起來。 軍長就吩咐將保羅帶進營樓去，叫人用鞭子拷問他，要知道他們向他這樣喧嚷是為甚麼緣故。 剛用皮條捆上，保羅對旁邊站著的百夫長說：「人是羅馬人，又沒有定罪，你們就鞭打他，有這個例嗎？」 百夫長聽見這話，就去見軍長，告訴他說：「你要謹慎行事，因這人是羅馬人。」 軍長就來問保羅說：「你告訴我，你是羅馬人嗎？」保羅說：「是。」 軍長說：「我用許多銀子才得了這自由。」保羅說：「我生來就有。」 於是那些要拷問保羅的人隨即離開他去了；軍長既知道他是羅馬人，又因為捆綁了他，也害怕了。


        当他们喊叫、抛掷衣服、并向空中扬尘之时，千夫长便命令将他带入营楼，吩咐用鞭子拷打他，以查明他们为何这样呼喊反对他。但当他们用皮条捆绑他时，保罗对站在旁边的百夫长说：你们拷打一个罗马公民，而且未经审判，这岂是合法的吗？百夫长听见这话，便上前禀告千夫长说：你看，你要做什么？这人是个罗马公民。于是千夫长来到他身边，说：告诉我，你是罗马公民吗？他说：是的。千夫长回答说：我是花了大笔钱才获得这公民身份的。保罗却说：而我生来就是。于是那些想要拷问他的人，立刻就离开了。而千夫长得知他是罗马公民后，便因捆绑了他而感到害怕。'
  - type: paragraph
    text:
      ru: Но ведь у них – так как они вопили, – следовало узнать, их спросить, что они подозревали в словах Павла; но тысяченачальник просто угождает власти и делает в угоду им, потому что не о том заботился он, как бы посправедливее поступить, но о том, как бы утишить их гнев, хотя и несправедливый.
      cn: 然而，既然他们大声喧哗，就应该去问他们，查明他们怀疑保罗的话中有什么；但千夫长只是取悦当权者，为了讨好他们而行事，因为他所关心的，不是如何更公正地行事，而是如何平息他们的怒气，尽管这怒气是不公的。
  - type: paragraph
    text:
      ru: '«Разве вам позволено бичевать Римского гражданина, да и без суда?»Не солгал Павел, сказав, что он – римлянин, потому что отец его, ради представительства, купил себе это имя за деньги, так как великим почетом пользовались удостоившиеся называться этим именем. Говорит же это Павел, чтобы, в случае наказания его, не стали относиться к нему с презрением. Если бы его наказали, то делу дали бы иной оборот и убили бы его; а теперь, хотя и не по иной причине, а по той самой, что он – римлянин, не только не наказали его, но и отпустили. Два преступления полагает Павел в наказании себя: одно – то, что хотели наказать его без суда, другое – то, что хотели наказать римлянина; поэтому и больше страха навел на них.'
      cn: 「难道你们被允许鞭打罗马公民，而且未经审判吗？」保罗说自己是罗马公民，并没有撒谎，因为他的父亲为了显赫的地位，花钱给自己买了这名号，因为那些配得上这名号的人享有极大的尊荣。保罗说这话，是为了万一他受到惩罚，他们就不会以轻蔑的态度对待他。如果他被惩罚了，那么事情就会有不同的结局，甚至会杀了他；然而现在，尽管不是出于别的理由，而是正因为他是罗马公民，他们不仅没有惩罚他，反而放了他。保罗认为，惩罚他存在两宗罪：一是他们想未经审判就惩罚他，另一是他们想惩罚一名罗马公民；因此也给他们带来了更大的恐惧。
  - type: paragraph
    text:
      ru: '«Павел же сказал: а я и родился в нем». Смотри: и отец его был римлянин. Прежде чем родился Павел, Киликия перешла уже под власть римлян, поэтому и отцу его, как перешедшему под их власть, необходимо было быть римлянином. Павел же, согласно пророчеству, связан был в Иерусалиме, и исполнилось пророческое слово. Что же происходит потом? Тысяченачальник развязывает Павла и приводит к иудеям. Итак, не ложь, что он римлянин, потому что тысяченачальник испугался того, что он римлянин, то есть человек знатного рода.'
      cn: «保罗说：『我却是生来就是的。』» 你看：他的父亲也是罗马公民。在保罗出生之前，基利家已经归于罗马人的统治之下，因此他的父亲，作为已经归于他们统治之下的人，也必然是罗马公民。然而保罗，按照预言，在耶路撒冷被捆绑，预言的话就应验了。那么后来发生了什么呢？千夫长解开了保罗的捆绑，并把他带到犹太人面前。如此一来，他是罗马公民并非谎言，因为千夫长害怕他是罗马公民这件事，也就是说，他是一个出身显赫的人。
  - type: paragraph
    text:
      ru: Деян.22:30.На другой день, желая достоверно узнать, в чем обвиняют его Иудеи, освободил его от оков и повелел собраться первосвященникам и всему синедриону и, выведя Павла, поставил его перед ними.
      cn: (使徒行传 22:30) 第二天，軍長為要知道猶太人控告保羅的實情，便解開他，吩咐祭司長和全公會的人都出席，將保羅帶下來，叫他站在他們面前。
- type: heading1
  text:
    ru: Глава двадцать третья
    cn: 第二十三章
  children:
  - type: paragraph
    text:
      ru: 'Деян.23:1–5.Павел, устремив взор на синедрион, сказал: мужи братия! я всею доброю совестью жил пред Богом до сего дня. Первосвященник же Анания стоявшим перед ним приказал бить его по устам. Тогда Павел сказал ему: Бог будет бить тебя, стена подбеленная! ты сидишь, чтобы судить по закону, и, вопреки закону, велишь бить меня. Предстоящие же сказали: первосвященника Божия поносишь? Павел сказал: я не знал, братия, что он первосвященник; ибо написано: «начальствующего в народе твоем не злословь»(Исх. 22, 28).'
      cn: (使徒行传 23:1-5) 保羅注目看著公會的人，說：「諸位弟兄，我在　上帝面前行事為人都是憑著良心，直到今日。」 大祭司亞拿尼亞就吩咐旁邊站著的人打他的嘴。 保羅對他說：「你這粉飾的牆，　上帝要打你。你坐堂為的是按律法審問我，你竟違背律法，吩咐人打我嗎？」 站在旁邊的人說：「你辱罵　上帝的大祭司嗎？」 保羅說：「弟兄們，我不曉得他是大祭司；經上記著說：『你不可毀謗你百姓的官長。』」


        保罗定睛看着公会，说：「诸位弟兄！我在上帝面前行事为人，都是凭着纯全的良心，直到今日。」大祭司亚拿尼亚就吩咐旁边站着的人打他的嘴。于是保罗对他说：「你这粉饰的墙！上帝必击打你！你坐堂要按律法审判我，反而违背律法吩咐人打我。」旁边站着的人说：「你辱骂上帝的大祭司吗？」保罗说：「弟兄们，我不知道他是大祭司；因为经上记着说：『不可毁谤你百姓的首领。』」(出埃及记 22:28)'
  - type: paragraph
    text:
      ru: Павел говорит уже не к народу и не к толпе,«устремив взор на синедрион», что«всею доброю совестью жил», то есть не сознает себя в своих поступках ни в чем виновным перед ними и достойным этих оков.
      cn: 保罗已不再是对民众或人群说话，他「定睛注视着公会」，说「自己行事为人是凭着完全正直的良心」，也就是说，他不认为自己在任何行为上对他们有罪，也不认为自己配得这些锁链。
  - type: paragraph
    text:
      ru: '«Ты сидишь, чтобы судить по закону, и, вопреки закону, велишь бить меня». То есть преступая закон, становясь виновным в беззаконии; как бы говорит: «Будучи достоин весьма многих наказаний».'
      cn: 「祢坐着，为要按律法审判，却违背律法，吩咐人打我。」也就是说，他干犯了律法，犯下了不法之罪；他仿佛在说：「（你）理当遭受极多惩罚。」
  - type: paragraph
    text:
      ru: '«Первосвященника Божия поносишь? Павел сказал: я не знал, братия, что он первосвященник». Как же он говорил:«ты сидишь, чтобы судить по закону?»Да, Павел принимает вид, что не знает, но это было не вредно, а полезно для слушателей. Но я (блж. Феофилакт. –Ред.) очень убежден, что Павел действительно не знал, что Анания – первосвященник, так как Павел прибыл недавно в Иерусалим, с иудеями не обращался и видел Ананию среди многих других лиц. Да среди многих и разнообразных лиц первосвященник был и незаметен.'
      cn: 「你辱骂上帝的大祭司吗？保罗说：弟兄们，我不知道他是大祭司。」他怎么会说：「你坐在这里是为要按律法审判吗？」是的，保罗装作不知道，但这并非有害，反而对听者有益。但我（圣奥赫里德的狄奥菲拉克。——编者注）深信，保罗确实不知道亚拿尼亚是大祭司，因为保罗刚到耶路撒冷不久，没有与犹太人打交道，并且是在众多人中看见亚拿尼亚的。是的，在众多形形色色的人群中，大祭司也并不显眼。
  - type: paragraph
    text:
      ru: «Тебя, стена подбеленная!»так называет его потому, что хотя Анания принимал светлый образ человека, который как бы защищает закон и судит по закону, но мысль его была полна беззакония. Поэтому Павел и изобличает в нем лицемерный вид наружного расположения к закону.
      cn: 「你这粉饰的墙！」如此称呼他，因为虽然亚拿尼亚披着一副光鲜的形象，仿佛是维护律法、按律法审判的人，但他的意念却充满了不法。因此，保罗揭露了他对律法表面恭顺的伪善面目。
  - type: paragraph
    text:
      ru: 'Деян.23:6–8.Узнав же Павел, что тут одна часть саддукеев, а другая фарисеев, возгласил в синедрионе: мужи братия! я фарисей, сын фарисея; за чаяние воскресения мертвых меня судят. Когда же он сказал это, произошла распря между фарисеями и саддукеями, и собрание разделилось. Ибо саддукеи говорят, что нет воскресения, ни Ангела, ни духа; а фарисеи признают и то и другое.'
      cn: (使徒行传 23:6-8) 保羅看出大眾一半是撒都該人，一半是法利賽人，就在公會中大聲說：「諸位弟兄，我是法利賽人，也是法利賽人的子孫。我現在受審問，是為盼望死人復活。」 說了這話，法利賽人和撒都該人就爭論起來，會眾分為兩黨。 因為撒都該人說，沒有復活，也沒有天使和靈；法利賽人卻說，兩樣都有。
  - type: paragraph
    text:
      ru: Опять говорит по-человечески:"Я фарисей", но всюду богат благодатью. Не обманывает, однако, и здесь, потому что по предкам он –«сын фарисея». А так как иудеи не хотели сказать, за что обвиняют его, то он считает себя вынужденным высказать это сам:«за чаяние о воскресении мертвых меня судят», и оправдывает себя и обвинением и клеветой их. Саддукеи же, будучи несмысленными, не знали, быть может, даже Бога, поэтому не верят и тому, что будет воскресение.
      cn: 又凭着人的方式说：「我是法利赛人」，但他处处都充满恩典。然而，他在此也并无欺瞒，因为按着他的祖先，他是一个「法利赛人的儿子」。又因犹太人不愿说出他们为何控告他，于是他认为自己不得不亲自说出这一点：「他们审判我，是因为我对死人复活的盼望」，并藉着他们的控告和诽谤为自己辩白。而撒都该人则因其无知，甚至或许不认识上帝，因此他们也不相信死人会复活。
  - type: paragraph
    text:
      ru: «Фарисеи признают и то и другое». Однако же саддукеи не признают трех положений (воскресения, бытия Ангела и бытия Духа). Как же писатель говорит«и то и другое?»Но Дух и Ангел одно и то же; кроме того,«и то и другое»говорится и о трех предметах. Писания людей некнижных и рыбарей не следует измерять мерой изящной внешней отделки, какой отличаются сочинения писателей специалистов, – от этого рождаются ереси.
      cn: «法利赛人承认两者»。然而，撒都该人却不承认三项立场（复活，天使的存在和灵的存在）。那么，作者为何说«两者»呢？但灵与天使是一回事；此外，«两者»也可指三项事物。不通文墨者和渔夫们的著作不应以专业作家的作品所特有的那种华美外在修饰为标准来衡量——否则会由此滋生异端。
  - type: paragraph
    text:
      ru: 'Деян.23:9–10.Сделался большой крик; и, встав, книжники фарисейской стороны спорили, говоря: ничего худого мы не находим в этом человеке; если же дух или Ангел говорил ему, не будем противиться Богу. Но как раздор увеличился, то тысяченачальник, опасаясь, чтобы они не растерзали Павла, повелел воинам сойти взять его из среды их и отвести в крепость.'
      cn: (使徒行传 23:9-10) 於是大大的喧嚷起來，有幾個法利賽黨的文士站起來，爭辯說：「我們看不出這人有甚麼惡處，倘若有靈，或是天使，對他說過話，怎麼樣呢？我們不要攻擊　上帝了。」 那時大起爭吵，軍長恐怕保羅被他們扯碎了，就吩咐兵丁下去，把他從眾人當中搶出來，帶進營樓去。

        于是起了大大的喧哗；有些法利赛派的文士站起来，争辩说：「我们在这人身上找不到任何恶行；倘若有灵或天使曾对他说话，我们不要抵挡上帝。」 但当争吵变得更加激烈时，千夫长恐怕保罗会被他们撕碎，就吩咐兵丁下去，从他们中间把保罗抢出来，带进营楼。'
  - type: paragraph
    text:
      ru: 'Чего-то недостает здесь для полноты мысли. Дух, говорится, или Ангел внушал ему содержание речи – неизвестно. Или это сказано от лица фарисеев, и в таком случае слова«если же дух или Ангел говорил ему»следует понимать так: «Вот он говорит о воскресении; очевидно, или Дух, или Ангел преподал ему учение о воскресении».'
      cn: 这里缺少一些东西，未能使思想完整。据说，是圣灵或天使默示了他言语的内容——这不得而知。或者这话是从法利赛人看来而说的，在这种情况下，『如果真是圣灵或天使对他说了话』这些话应当理解为：『看哪，他讲论复活之事；显然，或是圣灵，或是天使，将复活的教义传授给了他。』
  - type: paragraph
    text:
      ru: «Тысяченачальник, опасаясь». Боялся, чтобы не растерзали Павла, так как он сказал, что он – римлянин, и дело было недалеко от опасности. Наконец воины похищают его, думаю, как свою собственность.
      cn: «千夫长，因惧怕.» 他惧怕保罗被撕裂，因为保罗说自己是罗马人，并且事态已近危境。最后，士兵们将他带走，我想，如同自己的产业。
  - type: paragraph
    text:
      ru: 'Деян.23:11–14.В следующую ночь Господь, явившись ему, сказал: дерзай, Павел; ибо, как ты свидетельствовал о Мне в Иерусалиме, так надлежит тебе свидетельствовать и в Риме. С наступлением дня некоторые Иудеи сделали умысел, и заклялись не есть и не пить, доколе не убьют Павла. Было же более сорока сделавших такое заклятие. Они, придя к первосвященникам и старейшинам, сказали.'
      cn: (使徒行传 23:11-14) 當夜，　主站在保羅旁邊，說：「放心吧。你怎樣在耶路撒冷為我作見證，也必怎樣在羅馬為我作見證。」 到了天亮，幾個猶太人同謀發咒起誓，說他們若不先殺保羅就不吃不喝。 這樣同心密謀的有四十多人。 他們來見祭司長和長老，說：「我們已經發咒起了一個大誓，若不先殺保羅就不吃甚麼。

        次夜，主向他显现说：「放心吧，保罗！你怎样在耶路撒冷为我作证，也必照样在罗马为我作证。」

        天亮之后，有些犹太人密谋，并起誓不吃不喝，直到杀了保罗。结此誓者有四十多人。他们去见众祭司长和长老们，说：'
  - type: paragraph
    text:
      ru: Господь явился Павлу, так как Он – утешитель в скорбях. Но Он не являлся Павлу прежде, чем тот не впал в опасность (Господь укрепляет нас и посредством скорбей), и по явлении Своем соизволяет спасти жизнь его человеческими средствами.
      cn: 上主向保罗显现，因为祂是患难中的安慰者。但祂没有在保罗陷入危险之前向他显现（上主也藉着患难坚固我们），并且在祂显现之后，祂允许藉着人的方法来拯救他的生命。
  - type: paragraph
    text:
      ru: Деян.23:14–15.Мы клятвою заклялись не есть ничего, пока не убьем Павла. Итак ныне же вы с синедрионом дайте знать тысяченачальнику, чтобы он завтра вывел его к вам, как будто вы хотите точнее рассмотреть дело о нем; мы же, прежде нежели он приблизится, готовы убить его.
      cn: (使徒行传 23:14-15) 他們來見祭司長和長老，說：「我們已經發咒起了一個大誓，若不先殺保羅就不吃甚麼。 因此，現在你們和公會要知會軍長，叫他明天帶下保羅到你們這裏來，假作要詳細察考他的事；我們已經預備好了，不等他來到跟前就殺他。」

        我们起誓发咒，在杀死保罗以前，什么也不吃。所以，现在你们和公会要告诉千夫长，让他明天把保罗带到你们这里来，假装你们想更仔细地审查他的案子；我们则在他未接近之前，已准备好杀害他。'
  - type: paragraph
    text:
      ru: 'Говорит, что они«клятвою заклялись»вместо того, чтобы сказать: они отрекутся от веры в Бога, если не сделают того, что задумали. Таким образом, если давали они ложное обещание – они находились под клятвою как обманщики; если бы удалось им убить Павла – они снова подвергали себя проклятию как убийцы, или предал бы их анафеме Бог.'
      cn: 所言是他们「以誓言咒诅了自己」，而不是说：如果他们不完成他们所谋划的事，他们就会弃绝信仰上帝。因此，如果他们曾作出了虚假的承诺——他们就作为欺骗者处于誓言之下；如果他们成功杀害了保罗——他们又作为杀人犯使自己遭受咒诅，或者上帝会把他们革除教籍。
  - type: paragraph
    text:
      ru: 'Деян.23:16–24.Услышав о сем умысле, сын сестры Павловой пришел и, войдя в крепость, уведомил Павла. Павел же, призвав одного из сотников, сказал: отведи этого юношу к тысяченачальнику, ибо он имеет нечто сказать ему. Тот, взяв его, привел к тысяченачальнику и сказал: узник Павел, призвав меня, просил отвести к тебе этого юношу, который имеет нечто сказать тебе. Тысяченачальник, взяв его за руку и отойдя с ним в сторону, спрашивал: что такое имеешь ты сказать мне? Он отвечал, что Иудеи согласились просить тебя, чтобы ты завтра вывел Павла пред синедрион, как будто они хотят точнее исследовать дело о нем. Но ты не слушай их; ибо его подстерегают более сорока человек из них, которые заклялись не есть и не пить, доколе не убьют его; и они теперь готовы, ожидая твоего распоряжения. Тогда тысяченачальник отпустил юношу, сказав: никому не говори, что ты объявил мне это. И, призвав двух сотников, сказал: приготовьте мне воинов пеших двести, конных семьдесят и стрелков двести, чтобы с третьего часа ночи шли в Кесарию. Приготовьте также ослов, чтобы, посадив Павла, препроводить его к правителю Феликсу.'
      cn: (使徒行传 23:16-24) 保羅的外甥聽見他們設下埋伏，就來到營樓裏告訴保羅。 保羅請一個百夫長來，說：「你領這少年人去見軍長，他有事告訴他。」 於是把他領去見軍長，說：「被囚的保羅請我到他那裏，求我領這少年人來見你；他有事告訴你。」 軍長就拉著他的手，走到一旁，私下問他說：「你有甚麼事告訴我呢？」 他說：「猶太人已經約定，要求你明天帶下保羅到公會裏去，假作要詳細查問他的事。 你切不要隨從他們；因為他們有四十多人埋伏，已經起誓說：『若不先殺保羅就不吃不喝。現在預備好了，只等你應允。』」 於是軍長打發少年人走，囑咐他說：「不要告訴人你將這些事報給我了。」 他便叫了兩個百夫長來，說：「預備步兵二百，馬兵七十，長槍手二百，今夜亥初往凱撒利亞去； 也要預備牲口叫保羅騎上，護送到巡撫腓力斯那裏去。」
  - type: paragraph
    text:
      ru: По Божию устроению иудеи не заметили, как«сын сестры Павловой»мог их слышать. Снова спасается Павел вследствие человеческой предусмотрительности, так как он всех, даже сотника, оставляет в неведении, чтобы не обнаружилось дело. Не следует ставить в осуждение Павлу того, что он боялся опасности, – это свидетельствует лишь о слабости его природы (так как он был человек) и должно служить в похвалу его воли, так как, даже страшась ударов и смерти, он не сделал из-за страха этого ничего недостойного себя.
      cn: 出于上帝的安排，犹太人未曾察觉「保罗姊妹的儿子」能够听到他们的话。保罗再次获救，是由于人的预见，因为他让所有的人，甚至包括那百夫长，都蒙在鼓里，以免事情败露。不应将保罗惧怕危险一事视为他的罪过——这只显明他本性的软弱（因为他也是人），反倒应赞扬他的意志，因为他即使惧怕鞭打和死亡，也未曾因这惧怕而做出任何不配己身之事。
  - type: paragraph
    text:
      ru: 'Деян.23:25–35.Написал и письмо следующего содержания: «Клавдий Лисий достопочтенному правителю Феликсу – радоваться. Сего человека Иудеи схватили и готовы были убить; я, придя с воинами, отнял его, узнав, что он Римский гражданин. Потом, желая узнать, в чем обвиняли его, привел его в синедрион их и нашел, что его обвиняют в спорных мнениях, касающихся закона их, но что нет в нем никакой вины, достойной смерти или оков. А как до меня дошло, что Иудеи злоумышляют на этого человека, то я немедленно послал его к тебе, приказав и обвинителям говорить на него перед тобою. Будь здоров». Итак воины, по данному им приказанию, взяв Павла, повели ночью в Антипатриду. А на другой день, предоставив конным идти с ним, возвратились в крепость. А те, придя в Кесарию и отдав письмо правителю, представили ему и Павла. Правитель, прочитав письмо, спросил, из какой он области, и, узнав, что из Киликии, сказал: я выслушаю тебя, когда явятся твои обвинители. И повелел ему быть под стражею в Иродовой претории.'
      cn: (使徒行传 23:25-35) 他又寫了文書，大略說： 「克勞第呂西亞，請巡撫腓力斯大人安。 這人被猶太人拿住，將要殺害，我得知他是羅馬人，就帶兵丁下去救他出來。 因要知道他們告他的緣故，我就帶他下到他們的公會去， 便查知他被告是因他們律法的辯論，並沒有甚麼該死該綁的罪名。 後來有人把猶太人怎樣埋伏那人的計謀告訴我，我就立時解他到你那裏去，又吩咐告他的人在你面前告他。再見。」 於是，兵丁照所吩咐他們的，將保羅夜裏帶到安提帕底。 第二天，讓馬兵護送，他們就回營樓去。 馬兵來到凱撒利亞，把文書呈給巡撫，便叫保羅站在他面前。 巡撫看了文書，問保羅是那省的人，既曉得他是基利家人， 就說：「等告你的人來到，我要細聽你的事。」便吩咐人把他看守在希律的審判廳裏。

        又写了一封信，内容如下：

        「克劳狄·吕西亚斯，致尊敬的巡抚腓力斯，愿你喜乐。这个人被犹太人抓住，他们正要杀他；我带着兵丁去救了他，因为我得知他是罗马公民。后来，我想要知道他们控告他什么罪名，就把他带到他们的公会里，发现他们控告他的，都是有关他们律法的争议，并没有任何值得判处死刑或囚禁的罪过。但因为我得知犹太人密谋要害这个人，我便立刻把他送去你那里，并吩咐他的控告者也在你面前控告他。愿你平安。」

        于是，兵丁们遵照所受的命令，带着保罗，连夜前往安提帕特。第二天，他们让骑兵与保罗一同前往，自己则返回营楼。那些人到了凯撒利亚，把信交给巡抚，也把保罗呈献给他。巡抚读了信，问保罗是从哪个省来的，得知他是基利家省的人后，便说：「等你的控告者到了，我再审理你。」并且吩咐把他关押在希律的衙门里。'
  - type: paragraph
    text:
      ru: 'Вот письмо, написанное в защиту его и в обвинение иудеев. Посмотри: Павел признается невинным не иудеями, а иноплеменниками, как и Христос – Пилатом.'
      cn: 这是一封为他辩护并指控犹太人而写的信。看：保罗被宣判无罪，不是被犹太人，而是被外邦人，正如基督被彼拉多一样。
  - type: paragraph
    text:
      ru: «В Иродовой претории». Замечательно, что в Кесарии была претория Ирода.
      cn: «在希律的总督府里». 值得注意的是，在凯撒利亚曾有希律的总督府。
- type: heading1
  text:
    ru: Глава двадцать четвертая
    cn: 第二十四章
  children:
  - type: paragraph
    text:
      ru: 'Деян.24:1–4.Через пять дней пришел первосвященник Анания со старейшинами и с некоторым ритором Тертуллом, которые жаловались правителю на Павла. Когда же он был призван, то Тертулл начал обвинять его, говоря: всегда и везде со всякою благодарностью признаём мы, что тебе, достопочтенный Феликс, обязаны мы многим миром, и твоему попечению благоустроением сего народа. Но, чтобы много не утруждать тебя, прошу тебя выслушать нас кратко, со свойственным тебе снисхождением.'
      cn: (使徒行传 24:1-4) 過了五天，大祭司亞拿尼亞同幾個長老，和一個辯士帖土羅下來，向巡撫控告保羅。 保羅被提了來，帖土羅就告他說：「腓力斯大人，我們因你得以大享太平，並且這一國因著你的先見，作了甚大的貢獻； 我們隨時隨地滿心感謝不盡。 唯恐多說，你嫌煩絮，只求你寬容聽我們說幾句話。
  - type: paragraph
    text:
      ru: 'Снова недостает чего-то в словах«жаловались правителю на Павла»для полноты мысли, которая должна быть такова: они представили обвинительную против Павла записку.'
      cn: 在「向总督控告保罗」这些话语中，某些内容再次有所欠缺，以达到思想的完整性，而这思想本应是：他们提交了一份针对保罗的控告书。
  - type: paragraph
    text:
      ru: «Тебе… обязаны мы многим миром». Видишь, как с первого раза предрасполагает похвалами в свою пользу судью и как старается выдать Павла за нововводителя и возмутителя.
      cn: «你……我们亏欠你诸多平安。」你看，他如何一开始就用赞美博取法官的好感，并如何试图将保罗描绘成新派别的鼓吹者和煽动者。
  - type: paragraph
    text:
      ru: Деян.24:5–9.Найдя сего человека язвою общества, возбудителем мятежа между Иудеями, живущими по вселенной, и представителем Назорейской ереси, который отважился даже осквернить храм, мы взяли его и хотели судить его по нашему закону. Но тысяченачальник Лисий, придя, с великим насилием взял его из рук наших и послал к тебе, повелев и нам, обвинителям его, идти к тебе. Ты можешь сам, разобрав, узнать от него о всем том, в чем мы обвиняем его. И Иудеи подтвердили, сказав, что это так.
      cn: (使徒行传 24:5-9) 我們看這個人，如同瘟疫一般，是鼓動普世上眾猶太人生亂的，又是拿撒勒教黨裏的一個頭目， 連聖殿他也想要污穢；我們把他捉住了，要按我們的律法審問。 不料軍長呂西亞前來，甚是強橫，從我們手中把他奪去， 如今可以吩咐告他的人到你這裏來，你自己究問他，就可以知道我們告他的一切事了。」 眾猶太人也隨著告他說：「事情誠然是這樣。」

        我们寻得此人，乃为社会的祸害，是普世各地犹太人中间煽动叛乱者，并为拿撒勒派异端之首领，他甚至胆敢亵渎圣殿。我们便拿住他，欲按我们的律法审判他。但千夫长吕西亚来到，用极大的暴力将他从我们手中夺去，并派他到祢这里来，又命令我们这些控告他的人，也到祢这里来。祢可以亲自审问，从他那里得知关于这一切我们所控告他的事。于是犹太人也附和，肯定说确是如此。'
  - type: paragraph
    text:
      ru: Принадлежать к числу Назореев было делом позорным; поэтому Тертулл унижал Павла и с этой стороны, так как Назарет был ничтожным городом.
      cn: 归属于拿撒勒人，乃是可耻之事；因此，帖土罗也从这方面贬损保罗，因为拿撒勒是个微不足道的城镇。
  - type: paragraph
    text:
      ru: Называет назореев еретиками, как будто и такая секта существовала у иудеев. Но Тертулл был эллин, поэтому он именно и ораторствовал или обвинял Павла.
      cn: 将拿撒勒派称为异端，仿佛犹太人中也存在这样一个宗派。但是特土罗是希腊人，所以他正是演说或控告保罗。
  - type: paragraph
    text:
      ru: 'Деян.24:10–15.Павел же, когда правитель дал ему знак говорить, отвечал: зная, что ты многие годы справедливо судишь народ сей, я тем свободнее буду защищать мое дело. Ты можешь узнать, что не более двенадцати дней тому, как я пришел в Иерусалим для поклонения. И ни в святилище, ни в синагогах, ни по городу они не находили меня с кем-либо спорящим или производящим народное возмущение, и не могут доказать того, в чем теперь обвиняют меня. Но в том признаюсь тебе, что по учению, которое они называют ересью, я действительно служу Богу отцов моих, веруя всему, написанному в законе и пророках, имея надежду на Бога, что будет воскресение мертвых, праведных и неправедных, чего и сами они ожидают.'
      cn: (使徒行传 24:10-15) 巡撫示意叫保羅說話，他就回答說：「我知道你在這國裏斷事多年，所以我樂意為自己分訴； 你查問就可以知道，從我上耶路撒冷敬拜到今日不過有十二天。 他們並沒有看見我在殿裏，或是在會堂裏，或是在城裏，和人辯論，聳動百姓； 他們現在所告我的事並不能對你證實了。 但有一件事，我向你承認，就是他們所稱為異端的道，我正按著那道敬拜我祖宗的　上帝，又信合乎律法的，和先知書上一切所記載的。 並且靠著　上帝，盼望死人，無論善惡，都要復活，就是他們自己也有這個盼望。


        保罗则，当方伯示意他说话时，回答说：「我知道你多年以来秉公判断这个民族，我就更自由地为自己申辩了。你可以查明，不过是十二天以前，我到耶路撒冷去敬拜。他们既没有在圣殿里，也没有在会堂里，也没有在城里发现我与任何人争辩，或煽动民众骚乱；他们现在所控告我的事，也无法证明。但我向你承认这一点，我却按照他们所称为异端的道，确实侍奉我列祖的上帝，又信从律法和先知书上所写的一切；并且靠着上帝有盼望，盼望死人，无论义人或不义的人，都将复活；这也是他们自己所期望的。」'
  - type: paragraph
    text:
      ru: Настолько, говорит Павел, далек я от того, чтобы воздвигать возмущения, что пришел в Иерусалим для поклонения. Останавливается на этой мысли потому, что она представляла сильное доказательство его невиновности.
      cn: 保罗说，我远非挑起骚乱，甚至我是为了敬拜才来到耶路撒冷。他停留在这一思想上，因为这构成了他清白的有力证据。
  - type: paragraph
    text:
      ru: «Действительно служу Богу отцов моих, веруя». Когда, после призвания быть Христовым апостолом, Павел говорит, что он служит отеческому Богу, то он показывает этим, что Бог Ветхого и Нового Завета – Один и Тот же.
      cn: «确实地事奉我列祖的上帝，相信着。» 当保罗在被呼召成为基督的使徒之后，他说他事奉着列祖的上帝，他便以此表明，旧约与新约的上帝是同一位。
  - type: paragraph
    text:
      ru: Деян.24:16–21.Посему и сам подвизаюсь всегда иметь непорочную совесть пред Богом и людьми. После многих лет я пришел, чтобы доставить милостыню народу моему и приношения. При сем нашли меня, очистившегося в храме не с народом и не с шумом. Это были некоторые Асийские Иудеи, которым надлежало бы предстать пред тебя и обвинять меня, если что имеют против меня. Или пусть сии самые скажут, какую нашли они во мне неправду, когда я стоял перед синедрионом, разве только то одно слово, которое громко произнес я, стоя между ними, что за учение о воскресении мертвых я ныне судим вами.
      cn: (使徒行传 24:16-21) 我因此自己勉勵，對　上帝對人，常存無虧的良心。 過了幾年，我帶著賙濟本國的捐項和供獻的物上去。 正獻的時候，他們看見我在殿裏已經潔淨了，並沒有聚眾，也沒有吵嚷，唯有幾個從亞細亞來的猶太人。 他們若有告我的事，就應當到你面前來告我。 即或不然，這些人若看出我站在公會前的時候，我有不法的地方，他們自己也可以當面說明。 縱然有，也不過一句話，就是我站在他們中間大聲說：『我今日在你們面前受審，是為死人復活的提問。』」


        所以，我常常尽力，在上帝和世人面前，持守无瑕的良心。过了多年之后，我来是为了给我的民族带来施舍和供献。当时他们发现我，是在圣殿里洁净自己，并非与众人同在，也并非喧闹。这些是一些来自亚细亚的犹太人，他们本该到祢面前，如果他们有什么反对我的事，就来控告我。或者让这些人自己来说，当我站在公议会面前时，他们在我的身上发现了什么不义之处，除非是我站在他们中间，大声说出的那句话：就是为了死人复活的教义，我今日在祢们面前受审。'
  - type: paragraph
    text:
      ru: Совершенную добродетель являем мы тогда, когда и людям не подаем поводов к соблазнам, и пред Богом стараемся быть непорочными.
      cn: 我们何时才显明全备的德行呢？乃是当我们既不给人制造跌倒的缘由，又在上帝面前力求纯全无瑕的时候。
  - type: paragraph
    text:
      ru: «Пусть сии самые скажут, какую нашли они во мне неправду». Обрели неправду на собрании, когда сделано было дознание. А что я говорю правду, так об этом свидетельствуют сами обвиняющие меня. Не избегать обвинителей, но быть готовым дать ответ всякому знак несомненной правоты. Сначала они и обиделись, что я проповедовал воскресение, потому что после этой проповеди удобно было присовокупить и то, что относится ко Христу, – что Он воскрес.
      cn: 「就让他们这些人自己说，在我身上发现了什么不义。」他们在查问期间的集会中找到了不义之处。而我说的是真理，为此作证的正是那些控告我的人。不回避控告者，而是准备好回答每一个人，这正是无可置疑的正直的标志。起初他们感到冒犯，因为我宣讲复活，因为在这宣讲之后，便可顺理成章地附带提及那关乎基督的——即祂已复活。
  - type: paragraph
    text:
      ru: 'Деян.24:22–23.Выслушав это, Феликс отсрочил дело их, сказав: рассмотрю ваше дело, когда придет тысяченачальник Лисий, и я обстоятельно узнаю об этом учении. А Павла приказал сотнику стеречь, но не стеснять его и не запрещать никому из его близких служить ему или приходить к нему.'
      cn: (使徒行传 24:22-23) 腓力斯聽見這些事，本是詳細曉得這道，就支吾他們說：「且等軍長呂西亞下來，我要徹查你們的事。」 於是吩咐百夫長看守保羅，並且寬待他，也不攔阻他的親友來供給他。

        费利克斯听了这话，就延缓了他们的案件，说：「等到千夫长吕西亚斯来了，我要审理你们的案件，更详细地了解这教义。」他命令百夫长看守保罗，但不可拘束他，也不可禁止他的任何亲友服侍他或来探望他。'
  - type: paragraph
    text:
      ru: С намерением отложил дело – не для того, чтобы изучить его, но чтобы удалить иудеев и дать облегчение Павлу, так как не хотел ради них наказывать его.
      cn: 他有意地搁置了此事——并非为了审查此案，而是为了打发走犹太人，并给保罗一个解脱，因为他不愿为了犹太人而惩罚保罗。
  - type: paragraph
    text:
      ru: «Рассмотрю ваше дело, когда придет тысяченачальник Лисий». Феликс, наставленный из Ветхого Завета тому, что относилось ко Христу, хорошо знал веру Павла и не освободил его по человекоугодливости, как говорится ниже:«желая доставить удовольствие Иудеям»(ст. 27). А может быть, он думал получить от Павла и денег. Знал же Феликс о том, что относилось ко Христу, как имевший жену иудеянку, от которой он часто слышал об этом.
      cn: 「我将审理你的案件，等千夫长吕西亚到来时。」腓力斯，他从旧约中受教，得知那关乎基督的一切事，清楚了解保罗的信仰，并没有因取悦于人而释放他，正如后面所说：「愿讨犹太人的喜欢」（27节）。也许，他还想从保罗那里得到钱。腓力斯知道那些关乎基督的事，因为他娶了一位犹太妻子，他常常从她那里听到这些事。
  - type: paragraph
    text:
      ru: 'Деян.24:24–27.Через несколько дней Феликс, придя с Друзиллою, женою своею, Иудеянкою, призвал Павла, и слушал его о вере во Христа Иисуса. И как он говорил о правде, о воздержании и о будущем суде, то Феликс пришел в страх и отвечал: теперь пойди, а когда найду время, позову тебя. Притом же надеялся он, что Павел даст ему денег, чтобы отпустил его: посему часто призывал его и беседовал с ним. Но по прошествии двух лет на место Феликса поступил Порций Фест. Желая доставить удовольствие Иудеям, Феликс оставил Павла в узах.'
      cn: (使徒行传 24:24-27) 過了幾天，腓力斯和他夫人─猶太的女子土西拉─一同來到，就叫了保羅來，聽他講論信　基督的道。 保羅講論公義、節制，和將來的審判。腓力斯甚覺恐懼，說：「你暫且去吧，等我得便再叫你來。」 腓力斯又盼望保羅為得釋放而送他錢財；所以屢次叫他來，和他談論。 過了兩年，波求非斯都接了腓力斯的任；腓力斯要討猶太人的喜歡，就留保羅在監裏。
  - type: paragraph
    text:
      ru: Будучи иудеянкой, Друзилла, против закона, вышла за эллина; или, быть может, она, хотя и была иудеянкой, но, выйдя замуж, стала эллинкой. Поэтому-то она, желая обратить мужа, и сообщила ему свою веру.
      cn: 德鲁西拉身为犹太人，却违背律法嫁给了一位希腊人；或者，也许她虽是犹太人，但出嫁后便成了希腊人。正因为如此，她渴望感化自己的丈夫，便将自己的信仰告知了他。
  - type: paragraph
    text:
      ru: «Феликс пришел в страх». Такая сила заключалась в словах Павла, что и начальник испугался.
      cn: 《腓力斯心生惧怕》。保罗的话语蕴含着如此大的能力，以致连那位官长也惧怕了。
  - type: paragraph
    text:
      ru: «Посему часто призывал его и беседовал с ним». Видишь, какой правдой дышит то, что пишется? Часто призывал Павла не потому, что удивлялся ему или что одобрял его речи, и не потому, что желал уверовать, но потому, что надеялся, что ему дадут денег.
      cn: 「因此常常召见他，并与他交谈。」你看，这所写下的充满着何等真实？他常常召见保罗，不是因为他惊奇于保罗或赞同保罗的言论，也不是因为他想要相信，而是因为他希望有人会给他钱。
- type: heading1
  text:
    ru: Глава двадцать пятая
    cn: 第二十五章
  children:
  - type: paragraph
    text:
      ru: 'Деян.25:1–12.Фест, прибыв в область, через три дня отправился из Кесарии в Иерусалим. Тогда первосвященник и знатнейшие из Иудеев явились к нему с жалобою на Павла и убеждали его, прося, чтобы он сделал милость, вызвал его в Иерусалим; и злоумышляли убить его на дороге. Но Фест отвечал, что Павел содержится в Кесарии под стражею и что он сам скоро отправится туда. Итак, сказал он, которые из вас могут, пусть пойдут со мною, и если есть что-нибудь за этим человеком, пусть обвиняют его. Пробыв же у них не больше восьми или десяти дней, возвратился в Кесарию, и на другой день, сев на судейское место, повелел привести Павла. Когда он явился, стали кругом пришедшие из Иерусалима Иудеи, принося на Павла многие и тяжкие обвинения, которых не могли доказать. Он же в оправдание свое сказал: я не сделал никакого преступления ни против закона Иудейского, ни против храма, ни против кесаря. Фест, желая сделать угождение Иудеям, сказал в ответ Павлу: хочешь ли идти в Иерусалим, чтобы я там судил тебя в этом? Павел сказал: я стою перед судом кесаревым, где мне и следует быть судиму. Иудеев я ничем не обидел, как и ты хорошо знаешь. Ибо, если я неправ и сделал что-нибудь, достойное смерти, то не отрекаюсь умереть; а если ничего того нет, в чем сии обвиняют меня, то никто не может выдать меня им. Требую суда кесарева. Тогда Фест, поговорив с советом, отвечал: ты потребовал суда кесарева, к кесарю и отправишься.'
      cn: (使徒行传 25:1-12) 非斯都到了任，過了三天，就從凱撒利亞上耶路撒冷去。 大祭司和猶太人的首領向他控告保羅， 又央告他，求他的情，將保羅提到耶路撒冷來，他們要在路上埋伏殺害他。 非斯都卻回答說，應當將保羅仍押在凱撒利亞，他自己快要往那裏去。 他說：「你們中間能夠同去的人，可以與我一同下去，這人若有甚麼惡行，就可以告他。」 非斯都在他們那裏住了十多天，就下凱撒利亞去；第二天坐堂，吩咐將保羅提上來。 保羅來了，那些從耶路撒冷下來的猶太人周圍站著，將許多重大的事控告他，都是不能證實的。 保羅分訴說：「無論猶太人的律法，或是聖殿，或是凱撒，我都沒有干犯。」 但非斯都要討猶太人的喜歡，就問保羅說：「你願意上耶路撒冷去，在那裏聽我審斷這些事嗎？」 保羅說：「我站在凱撒的堂前，這就是我應當受審的地方。我向猶太人並沒有行過甚麼不義的事，這也是你明明知道的。 我若成了罪犯，或犯了甚麼該死的罪，就是死，我也不拒；他們所告我的事若都不實，就沒有人可以把我交給他們。我要上告於凱撒。」 非斯都和議會商量了，就說：「你既上告於凱撒，可以往凱撒那裏去。」


        腓斯都到了该省，三日后，从凯撒利亚上耶路撒冷去。那时，大祭司和犹太人中的首领向他控告保罗，并劝他，求他施恩，将保罗提到耶路撒冷来；他们原是埋伏在路上，想要杀害他。但腓斯都回答说，保罗仍押在凯撒利亚，他自己也要快到那里去。于是他说，你们中间有权势的人，可以同我下去，若这人有什么不是，就可控告他。腓斯都在他们那里住了不过八到十日，就下凯撒利亚去；第二天，他坐上审判位，吩咐人将保罗提上来。保罗来了，从耶路撒冷下来的犹太人就站在周围，提出许多严重罪名控告保罗，只是都不能证实。保罗申辩说，我并没有犯罪，无论是犯犹太人的律法，或是犯圣殿的规矩，或是犯凯撒的法律。腓斯都愿意讨好犹太人，就对保罗说，你愿意上耶路撒冷去吗？在那里我可以在这些事上审断你。保罗说，我是站在凯撒的审判台前，这是我应当受审的地方。我没有得罪犹太人，这也是你清楚知道的。我若有不义之处，犯了什么该死的罪，我并不拒绝受死；倘若他们所告我的，没有一件是真实的，就没有人可以把我交给他们。我要上告于凯撒。腓斯都和公会商议后回答说，你既上告于凯撒，你就要到凯撒那里去。'
  - type: paragraph
    text:
      ru: 'Вот ясное и открытое показание: я, говорит Павел, соблюл себя чистым во всем, не согрешил ни против Бога,«ни против закона Иудейского»,ни против человека, ни против храма, то есть я никогда не бесчестил храмов иудейских, построенных из камней, хотя знаю и проповедую, что Бог живет не в рукотворенных храмах; также никогда не оскорблял совести иудеев поношением их первосвященника, хотя более уже не внемлю и первосвященникам иудейским.'
      cn: 这是一个清晰而公开的表白：我，保罗说，在一切事上保守自己清洁，既未曾得罪上帝，「也未曾得罪犹太人的律法」，也未曾得罪人，也未曾得罪圣殿，也就是说，我从未亵渎过犹太人那些用石头建造的圣殿，尽管我知道并宣讲上帝不住在人手所造的殿里；也从未冒犯过犹太人的良心，通过诋毁他们的祭司长，尽管我已不再听从犹太人的祭司长。
  - type: paragraph
    text:
      ru: 'А выражение«я стою перед судом кесаревым»означает: хочу идти в Рим к кесарю и там принять суд. Требую, говорит, этого от тебя.'
      cn: 而「我站在凯撒的审判台前」这个表达，意思是：我想去罗马见凯撒，并在那里接受审判。他说：「我向你要求此事。」
  - type: paragraph
    text:
      ru: 'Деян.25:13–15.Через несколько дней царь Агриппа и Вереника прибыли в Кесарию поздравить Феста. И как они провели там много дней, то Фест предложил царю дело Павлово, говоря: здесь есть человек, оставленный Феликсом в узах, на которого, в бытность мою в Иерусалиме, с жалобою явились первосвященники и старейшины Иудейские, требуя осуждения его.'
      cn: (使徒行传 25:13-15) 過了些日子，亞基帕王和百尼基氏來到凱撒利亞，問非斯都安。 在那裏住了多日，非斯都將保羅的事告訴王，說：「這裏有一個人，是腓力斯所捆鎖的。 我在耶路撒冷的時候，祭司長和猶太的長老將他的事稟報了我，求我定他的罪。

        过了几天，亚基帕王和百妮基来到凯撒利亚，问候腓斯都。他们在那里住了多日，腓斯都就把保罗的事向王提起，说：这里有一个人，是腓力斯留在捆锁中的，我在耶路撒冷的时候，犹太人的祭司长和长老们前来控告他，要求判他有罪。'
  - type: paragraph
    text:
      ru: Агриппа был или наместником царя в восточных провинциях и потому назывался царем, или, быть может, он был и сам царем на востоке, тогда как Нерон владычествовал на западе и имел резиденцию в Риме. «Кесарь» по-римски означает «император», так как все римские императоры, пока были императорами, назывались кесарями; однако же названия эти не были собственными их именами. Я заметил это, чтобы кто-либо, на основании тождества этого общего названия с именем собственным, не подумал, что при одном и том же императоре и Господь наш родился, и Павел умер. Господь родился, как показывает хронология, при кесаре Августе, а умер через тридцать три года при Тиверии Августе. Павел же умер при Нероне, спустя тридцать четыре года после смерти Господа. Да и Ирод был наместником царя, поэтому и сам назывался царем.
      cn: 亚基帕要么是东方行省的王之总督，因此被称为王；要么，或许他自己就是东方的王，而尼禄则在西方掌权，且以罗马为都城。「凯撒」在罗马语中意为「皇帝」，因为所有罗马皇帝，只要他们是皇帝，都曾被称为凯撒；然而这些称谓并非他们自己的名字。我指出这一点，以免有人依据这通用称谓与专有名词的同一性，误以为我们的主既在同一位皇帝在位时诞生，且保罗亦在同一位皇帝在位时离世。正如编年史所示，主诞生于凯撒奥古斯都之时，而在三十三年后离世，于提庇留奥古斯都之时。而保罗则在主离世三十四年后，于尼禄之时离世。此外，希律也曾是王的总督，因此他自己也曾被称为王。
  - type: paragraph
    text:
      ru: Деян.25:16–18.Я отвечал им, что у Римлян нет обыкновения выдавать какого-нибудь человека на смерть, прежде нежели обвиняемый будет иметь обвинителей налицо и получит свободу защищаться против обвинения. Когда же они пришли сюда, то, без всякого отлагательства, на другой же день сел я на судейское место и повелел привести того человека. Обступив его, обвинители не представили ни одного из обвинений, какие я предполагал.
      cn: (使徒行传 25:16-18) 我回答他們說：『無論甚麼人，被告還沒有和原告對質，未得允准分訴所告他的事，就先定他死罪，這不是羅馬人的條例。』 所以，及至他們來到這裏，我就不耽延，第二天便坐堂，吩咐把那人提上來。 告他的人站著告他；所告的，並沒有我所逆料的那等惡事。
  - type: paragraph
    text:
      ru: Ясно, что Пилат, выдав Иисуса иудеям, сделал это со злодейской целью, так как он и суд Божий, и закон римский презрел для того, чтобы, предав кровь неповинную на смерть, угодить убийцам, хотя за такой противозаконный поступок и подвергался ответственности перед императором римским, который и послал его начальником в пределы Иерусалима.
      cn: 显然，彼拉多将耶稣交给犹太人，这样做是出于恶意，因为他蔑视了上帝的审判和罗马的法律，为的是将无辜者的血置于死地，以取悦那些杀人者，尽管他因此非法行径要向罗马皇帝负责，正是这位皇帝派他作耶路撒冷地区的总督。
  - type: paragraph
    text:
      ru: «Обступив его, обвинители не представили ни одного из обвинений». Клеветники возводили на него обвинение, но не доказали его, потому что их клевета и дерзость казались подозрительными, а разбирательство дела не подтвердило ничего.
      cn: «控告者围住他，却没有提出任何一项指控。»诽谤者诬告他，但未能证实，因为他们的诽谤和狂妄显得可疑，而案件的审理也没能证实任何事。
  - type: paragraph
    text:
      ru: 'Деян.25:19–24.Но они имели некоторые споры с ним об их Богопочитании и о каком-то Иисусе умершем, о Котором Павел утверждал, что Он жив. Затрудняясь в решении этого вопроса, я сказал: хочет ли он идти в Иерусалим и там быть судимым в этом? Но как Павел потребовал, чтобы он оставлен был на рассмотрение Августово, то я велел содержать его под стражею до тех пор, как пошлю его к кесарю. Агриппа же сказал Фесту: хотел бы и я послушать этого человека. Завтра же, отвечал тот, услышишь его. На другой день, когда Агриппа и Вереника пришли с великою пышностью и вошли в судебную палату с тысяченачальниками и знатнейшими гражданами, по приказанию Феста приведен был Павел. И сказал Фест: царь Агриппа и все присутствующие с нами мужи! вы видите того, против которого всё множество Иудеев приступали ко мне в Иерусалиме и здесь и кричали, что ему не должно более жить.'
      cn: (使徒行传 25:19-24) 不過是有幾樣辯論，為他們自己迷信的事，又為一個人名叫耶穌，是已經死了，保羅卻說他是活著的。 這些事當怎樣究問，我心裏作難，所以問他說：『你願意上耶路撒冷去，在那裏為這些事聽審嗎？』 但保羅求我留下他，要聽奧古斯都審斷，我就吩咐把他留下，等我解他到凱撒那裏去。」 亞基帕對非斯都說：「我自己也願聽這人辯論。」非斯都說：「明天你可以聽他。」 第二天，亞基帕和百尼基大張威勢而來，同著眾軍長和城裏的尊貴人進了公廳。非斯都吩咐一聲，就有人將保羅帶進來。 非斯都說：「亞基帕王和在我們這裏的諸位啊，你們看這人，就是一切猶太人，在耶路撒冷和這裏，曾向我懇求、呼叫說：『不可容他再活著。』
  - type: paragraph
    text:
      ru: Естественно говорит«о каком-то Иисусе»,так как был человек со властью и не обращал внимания на Господа.
      cn: 自然地会说「某个耶稣」，因为他是个有权势的人，并且不理会主。
  - type: paragraph
    text:
      ru: «Затрудняясь в решении этого вопроса». Разбор такого дела поставил в недоумение судью, так как дело было выше его понимания.
      cn: «在解决此问题上感到困惑». 对这样一个案件的审理使法官感到困惑，因为案情超出了他的理解。
  - type: paragraph
    text:
      ru: «На рассмотрение Августово». Августом, равно как и кесарем, называет императора; его же называет и господином (государем).
      cn: «呈奥古斯都审阅». 称皇帝为奥古斯都，亦称他为凯撒；他亦称其为君主（或曰元首）。
  - type: paragraph
    text:
      ru: Деян.25:25–27.Но я нашел, что он не сделал ничего, достойного смерти; и как он сам потребовал суда у Августа, то я решился послать его к нему. Я не имею ничего верного написать о нем государю; посему привел его пред вас, и особенно пред тебя, царь Агриппа, дабы, по рассмотрении, было мне что написать. Ибо, мне кажется, нерассудительно послать узника и не показать обвинений на него.
      cn: (使徒行传 25:25-27) 但我查明他沒有犯甚麼該死的罪，並且他自己上告於奧古斯都，所以我定意把他解送。 論到這人，我沒有確實的事可以奏明我主。因此，亞基帕王啊，我帶他到你們面前，也特意帶他到你亞基帕王面前，為要在查問之後有所陳奏。 據我看來，解送囚犯，不指明他的罪案是不合理的。」


        然而我查明他没有做任何值得死罪的事；并且既然他自己请求凯撒审判，我便决定将他送往他那里。我没有什么确实的事可写关于他呈报给君主；因此我带他来了在你们面前，尤其是带到你面前，亚基帕王，好让经过审查之后，我能有可以写的东西。因为，我认为，送一个囚犯去，却不说明对他的指控，是不合理的。'
  - type: paragraph
    text:
      ru: Наконец сам судья свидетельствует о Павле, что он был невинен; однако же он не освободил Павла. Господь устроил, что Павел упомянул кесаря (а назвавших кесаря необходимо было посылать в Рим), чтобы исполнилось предсказание самого Павла, именно:«Я должен видеть и Рим»(Деян. 19, 21). Наблюдай, как Павел, оставив все – и родителей, и воспитателей, – приходит в Рим чистым от всякого подозрения.
      cn: 最终，连审判官自己也为保罗作证，说他是无辜的；然而他却没有释放保罗。上主安排让保罗提及凯撒（凡呼求凯撒的，都必须送往罗马），以便成就保罗自己的预言，就是：「我必须也要去罗马。」(使徒行传 19:21)。你看，保罗如何舍弃了一切——包括父母和教养者——来到罗马时，清白，没有任何嫌疑。
- type: heading1
  text:
    ru: Глава двадцать шестая
    cn: 第二十六章
  children:
  - type: paragraph
    text:
      ru: 'Деян.26:1–8.Агриппа сказал Павлу: позволяется тебе говорить за себя. Тогда Павел, простерши руку, стал говорить в свою защиту: царь Агриппа! почитаю себя счастливым, что сегодня могу защищаться перед тобою во всем, в чем обвиняют меня Иудеи, тем более, что ты знаешь все обычаи и спорные мнения Иудеев. Посему прошу тебя выслушать меня великодушно. Жизнь мою от юности моей, которую сначала проводил я среди народа моего в Иерусалиме, знают все Иудеи; они издавна знают обо мне, если захотят свидетельствовать, что я жил фарисеем по строжайшему в нашем вероисповедании учению. И ныне я стою перед судом за надежду на обетование, данное от Бога нашим отцам, которого исполнение надеются увидеть наши двенадцать колен, усердно служа Богу день и ночь. За сию-то надежду, царь Агриппа, обвиняют меня Иудеи. Что же? Неужели вы невероятным почитаете, что Бог воскрешает мертвых?»'
      cn: (使徒行传 26:1-8) 亞基帕對保羅說：「准你為自己辯明。」於是保羅伸手分訴，說： 「亞基帕王啊，猶太人所告我的一切事，今日得在你面前分訴，實為萬幸； 更可幸的，是你熟悉猶太人的規矩和他們的辯論；所以求你耐心聽我。 我從起初在本國的民中，並在耶路撒冷，自幼為人如何，猶太人都知道。 他們若肯作見證就曉得，我從起初是按著我們教中最嚴緊的教門作了法利賽人。 現在我站立受審，是因為盼望　上帝向我們祖宗所應許的； 這應許，我們十二個支派，晝夜切切的事奉　上帝，都盼望臨到。亞基帕王啊，我被猶太人控告，就是因這盼望。 　上帝叫死人復活，你們為甚麼以為不可信的呢？


        亚基帕王啊！我今日能在你面前，为犹太人控告我的一切事申辩，实感荣幸。况且你深知犹太人的一切规矩和争论。因此，我恳求你宽宏大量地听我陈述。我的生活，从我年幼之时起，就是我在耶路撒冷我本族中度过的，所有犹太人都知道；他们早已认识我，如果他们愿意作证，便可证明我曾是法利赛人，按照我们信仰中最严格的教训生活。而今我受审，正是为了那对上帝赐予我们祖先的应许之盼望，我国十二支派日夜殷勤事奉上帝，希望得见其实现。亚基帕王啊，犹太人控告我，正是为了这个盼望。为什么呢？你们竟认为上帝使死人复活是不可信的吗？'
  - type: paragraph
    text:
      ru: Павел говорил:«Почитаю себя счастливым, что сегодня могу защищаться перед тобою во всем, в чем обвиняют меня Иудеи». Говорил не с лестью (да не будет!), но желая доставить пользу царю. И тот, кого только что трактовали находящимся под судом, частью подействовал на судью и пленил его, потому что Агриппа в присутствии всех говорил:«Ты немного не убеждаешь меня сделаться Христианином»(ст. 28).
      cn: 保罗说：「我看自己是幸福的，今天可以在您面前为自己辩护，关于犹太人控告我的一切事。」他说这话不是出于谄媚（绝非如此！），而是希望给君王带来益处。于是，方才被视为受审判之人，部分地影响了审判官，并俘获了他，因为亚基帕在众人面前说：「你差一点就说服我作基督徒了。」(使徒行传 26:28)
  - type: paragraph
    text:
      ru: «Тем более, что ты знаешь все обычаи и спорные мнения Иудеев». Сознавая это, Павел должен был бы бояться того, что его судит человек, знающий все; но не отклонять такого судью, который подробно знает все бывшее, значит иметь чистую совесть.
      cn: 「况且你知道犹太人的一切规矩和有争议的意见。」意识到这一点，保罗本该害怕被一个无所不知的人审判；但不拒绝这样一位详细了解所有发生过之事的主审者，就意味着拥有清洁的良心。
  - type: paragraph
    text:
      ru: '«Знают все Иудеи; они издавна знают обо мне». Это значит: иудеи знают истину, но не хотят засвидетельствовать ее, а самовольно лгут и погрешают против него.'
      cn: «所有犹太人都知道；他们自古以来就知道我。» 这意味着：犹太人知道真理，但他们不愿为真理作证，却任意撒谎并悖逆于祂。
  - type: paragraph
    text:
      ru: «Я жил фарисеем по строжайшему в нашем вероисповедании учению». Замечательно, что и фарисеи были еретики, хотя Писания они исследовали и понимали лучше, чем все другие иудейские секты. Понимали лучше, но не истинно, потому что истинного разумения Писаний они не имели. Итак, прилежание может обследовать и обсудить дело с тонкостью, однако же понять вполне его сущность не может, напротив, бывает, что человека обманывает его же ум.
      cn: 「我曾是法利赛人，按照我们信仰中最严格的教训生活。」值得注意的是，法利赛人也是异端，尽管他们研读并理解圣经，比所有其他犹太教派都更透彻。理解得更透彻，却并非真实，因为他们没有对圣经的真实领悟。因此，勤勉可以细致地考察和讨论事物，然而却不能完全理解其本质，相反，有时人反而会被自己的心智所欺骗。
  - type: paragraph
    text:
      ru: 'Деян.26:9–11.Правда, и я думал, что мне должно много действовать против имени Иисуса Назорея. Это я и делал в Иерусалиме: получив власть от первосвященников, я многих святых заключал в темницы, и, когда убивали их, я подавал на то голос; и по всем синагогам я многократно мучил их и принуждал хулить Иисуса и, в чрезмерной против них ярости, преследовал даже и в чужих городах.'
      cn: (使徒行传 26:9-11) 從前我自己原以為應當多方攻擊拿撒勒耶穌的名。 我在耶路撒冷也曾這樣行了。既從祭司長得了權柄，我就把許多聖徒囚在監裏。他們被殺，我也出名定案。 在各會堂，我屢次用刑強逼他們說褻瀆的話；又向他們大發癲狂，我追逼他們，直到外邦的城邑。」

        诚然，我也曾以为我应当竭力行事，敌挡拿撒勒人耶稣的名。这正是我在耶路撒冷所行的：从祭司长们得了权柄，将许多圣徒关入监狱，当他们被处死时，我投了赞成票；并且在各会堂里，我多次折磨他们，强迫他们亵渎耶稣，且怀着对他们过度的狂怒，甚至在外邦城市中也迫害他们。'
  - type: paragraph
    text:
      ru: Павел говорит«правда, и я думал», ибо казалось ему, что это так должно было быть.
      cn: 保罗说：「确实，我原以为」，因为在他看来，事情本该如此。
  - type: paragraph
    text:
      ru: «Многократно мучил их». Подстрекаемые диаволом и демонами, говорит, многие, как бешеные, делали много нелепостей; а я, быть может, бесновался больше их, когда по своей воле причинял зло.
      cn: 「屡次折磨他们」。他说，被魔鬼和邪灵所唆使，许多人，如同疯癫一般，做了许多荒谬之事；而我，或许比他们行事更为癫狂，当我凭己意作恶之时。
  - type: paragraph
    text:
      ru: 'Деян.26:12–18.Для сего, идя в Дамаск со властью и поручением от первосвященников, среди дня на дороге я увидел, государь, с неба свет, превосходящий солнечное сияние, осиявший меня и шедших со мною. Все мы упали на землю, и я услышал голос, говоривший мне на Еврейском языке: «Савл, Савл! что ты гонишь Меня? Трудно тебе идти против рожна». Я сказал: «кто Ты, Господи?» Он сказал: «Я Иисус, Которого ты гонишь. Но встань и стань на ноги твои; ибо Я для того и явился тебе, чтобы поставить тебя служителем и свидетелем того, что ты видел и что Я открою тебе, избавляя тебя от народа Иудейского и от язычников, к которым Я теперь посылаю тебя открыть глаза им, чтобы они обратились от тьмы к свету и от власти сатаны к Богу, и верою в Меня получили прощение грехов и жребий с освященными».'
      cn: (使徒行传 26:12-18) 「那時，我領了祭司長的權柄和命令，往大馬士革去。 王啊，我在路上，正午的時候，看見從天發光，比日頭還亮，四面照著我並與我同行的人。 我們都仆倒在地，我就聽見有聲音用希伯來話向我說：『掃羅。掃羅。為甚麼逼迫我？你用腳踢刺是難的。』 我說：『　主啊，你是誰？』　主說：『我就是你所逼迫的耶穌。 你起來站著，我特意向你顯現，要派你作執事，作見證，將你所看見的事和我將要顯明與你的事證明出來； 我也要救你脫離百姓和外邦人的手。我差你到他們那裏去， 要叫他們的眼睛得開，從黑暗中歸向光明，從撒但權下歸向　上帝，使他們得蒙恕罪，和那些因所信之道而成聖的人同得基業，，這道也在我裏面。』」
  - type: paragraph
    text:
      ru: 'Сообщая о сиянии светлейшем чувственного света и считая невозможным уподобить свет Иисусов солнечному свету, Павел, чтобы передать явление так, как может принять человеческий слух, говорит: свет этот далеко превосходит солнечный свет.'
      cn: 当述及感官之光最明亮的光辉，并认为耶稣之光无法与太阳之光相比拟时，保罗为以人耳所能领受的方式来传达此一现象，说道：「这光远远超越了太阳之光。」
  - type: paragraph
    text:
      ru: Деян.26:19–20.Поэтому, царь Агриппа, я не воспротивился небесному видению, но сперва жителям Дамаска и Иерусалима, потом всей земле Иудейской и язычникам проповедовал, чтобы они покаялись и обратились к Богу, делая дела, достойные покаяния.
      cn: (使徒行传 26:19-20) 「亞基帕王啊，我故此沒有違背那從天上來的異象； 先在大馬士革，後在耶路撒冷和猶太全地，以及外邦，勸勉他們應當悔改歸向　上帝，行出與悔改相稱的行為。
  - type: paragraph
    text:
      ru: Я убедился через это явление, говорит Павел. Видением этим Господь обратил меня и убедил таким образом не отлагать дела. Видение это – чистое созерцание, превышающее человеческие силы, его нельзя видеть плотскому человеку, если очи его не будут отверсты нечеловеческой силой.
      cn: 保罗说，我通过这个异象确信了。上帝通过这个异象使我回转，并以此方式说服我不要耽延这事。这个异象是纯粹的默观，超越人类的力量，属肉体的人不能看见它，除非他的眼睛被非凡之力所开启。
  - type: paragraph
    text:
      ru: Деян.26:21–23.За это схватили меня Иудеи в храме и покушались растерзать. Но, получив помощь от Бога, я до сего дня стою, свидетельствуя малому и великому, ничего не говоря, кроме того, о чем пророки и Моисей говорили, что это будет, то есть что Христос имел пострадать и, восстав первый из мертвых, возвестить свет народу (Иудейскому) и язычникам.
      cn: (使徒行传 26:21-23) 因此，猶太人在殿裏拿住我，想要殺我。 既得蒙　上帝的幫助，我就存留直到今日，對著尊貴、卑賤、老幼作見證，所講的並不外乎眾先知和摩西所說將來必成的事； 就是　基督必須受害，並且因從死裏首先復活，要光照百姓和外邦人。」

        为此，犹太人在殿里抓住我，并企图置我于死地。但蒙上帝的帮助，我直到今日还站着，向小民和大人作证，没有讲别的，只是讲众先知和摩西所说必将成就的事，就是说：基督必受苦，并且从死人中首先复活，向这百姓（犹太人）和外邦人宣告光明。'
  - type: paragraph
    text:
      ru: Что пророки говорили о страдании Христовом, известно, и излишне говорить об этом; а что Моисей предсказывал, видно из сказанного им как бы от лица Иакова – Иуде:«Преклонился… лег, как лев… кто поднимет его?»(Быт. 49, 9). Здесь разумеет смерть и воскресение Христово. Но Моисей и о страдании предсказывал:«Жизнь твоя будет висеть пред тобою»(Втор. 28, 66).
      cn: 先知们论及基督的受难，是众所周知的，无须赘言；至于摩西所预言的，可从他仿佛以雅各之口对犹大所说的话中看出：「他屈身……蹲伏如狮……谁敢惊动他呢？」（创世记 49:9）。这里所指的是基督的死亡与复活。但摩西也曾预言受难：「你的性命必悬于你面前」（申命记 28:66）。
  - type: paragraph
    text:
      ru: «Восстав первый из мертвых». Иисус первый восстал и уже не умирает, а воскрешенные Им или Его учениками снова умерли в ожидании будущего общего воскресения.
      cn: «从死者中首先复活». 耶稣是首先复活的，并且不再死亡；而那些被祂或祂的门徒复活的人，却再次死去，等候着未来普遍的复活。
  - type: paragraph
    text:
      ru: 'Деян.26:24–26.Когда он так защищался, Фест громким голосом сказал: безумствуешь ты, Павел! большая ученость доводит тебя до сумасшествия. Нет, достопочтенный Фест, сказал он, я не безумствую, но говорю слова истины и здравого смысла. Ибо знает об этом царь, перед которым и говорю смело. Я отнюдь не верю, чтобы от него было что-нибудь из сего скрыто…»'
      cn: (使徒行传 26:24-26) 保羅這樣分訴，非斯都大聲說：「保羅，你癲狂了吧。你的學問太大，反叫你癲狂了。」 保羅說：「非斯都大人，我不是癲狂，我說的乃是真實清醒的話。 王也曉得這些事，所以我向王放膽直言；我深信這些事沒有一件向王隱藏的，因這事不是在角落之處作的。
  - type: paragraph
    text:
      ru: Так как Павел речь свою постоянно обращал к царю, то Фест, обидевшись несколько и видя дерзновение Павлово, сказал от досады и гнева:«безумствуешь ты, Павел!»Павел же объясняет ему причину, почему он обратил свое слово к царю.
      cn: 因为保罗不断地对君王说话，于是非斯都感到有些恼怒，并看见保罗的大胆，便因着恼怒与愤怒说：「你发狂了，保罗！」保罗却向他解释原因，为何他要对君王说话。
  - type: paragraph
    text:
      ru: 'Деян.26:26–32.…ибо это не в углу происходило. Веришь ли, царь Агриппа, пророкам? Знаю, что веришь. Агриппа сказал Павлу: ты немного не убеждаешь меня сделаться Христианином. Павел сказал: молил бы я Бога, чтобы мало ли, много ли, не только ты, но и все, слушающие меня сегодня, сделались такими, как я, кроме этих уз. Когда он сказал это, царь и правитель, Вереника и сидевшие с ними встали; и, отойдя в сторону, говорили между собою, что этот человек ничего, достойного смерти или уз, не делает. И сказал Агриппа Фесту: можно было бы освободить этого человека, если бы он не потребовал суда у кесаря. Посему и решился правитель послать его к кесарю.'
      cn: (使徒行传 26:26-32) 王也曉得這些事，所以我向王放膽直言；我深信這些事沒有一件向王隱藏的，因這事不是在角落之處作的。 亞基帕王啊，你信先知嗎？我知道你是信的。」 亞基帕對保羅說：「你這樣勸我，幾乎叫我作基督徒了。」 保羅說：「我向　上帝所求的，不但你一個人，就是今天一切聽我的，都要像我一樣，只是不要像我有這些捆鎖。」 當他說完了話的時候，王和巡撫並百尼基與同坐的人都起來。 退到裏面，彼此談論說：「這人並沒有犯甚麼該死該綁的罪。」 亞基帕又對非斯都說：「這人若沒有上告於凱撒，就可以釋放了。」

        ……因为这事不是在暗中发生的。亚基帕王，你相信众先知吗？我知道你相信。亚基帕对保罗说：「你差一点儿就说服我成为基督徒了。」保罗说：「我向上帝祈求，无论是少是多，不仅是你，还有今天所有听我讲的人，都能成为像我一样的人，除了这些锁链以外。」他说了这话后，王、巡抚、贝珥妮基和与他们同坐的人就站起来了；他们离开后，彼此商议说：「这人没有做什么值得处死或囚禁的事。」亚基帕对腓斯都说：「如果这人没有要求在凯撒面前受审，他本来可以被释放的。」因此，巡抚就决定将他送往凯撒那里。'
  - type: paragraph
    text:
      ru: 'Говоря, что«это не в углу происходило», Павел имеет в виду крест и воскресение, так как учение об этом разнеслось по всей вселенной. Говорит же это в доказательство того, что Агриппа все знал; и едва не говорит и прочим присутствовавшим: «И вам следовало знать это», потому что таков смысл следующих слов:'
      cn: 论及「此事并非在隐秘处发生」时，保罗意指十字架与复活，因为关于此事的教训已传遍了整个宇宙。他如此说，是为了证明亚基帕对这一切都了然于心；他几乎也是对其他在场者说：「你们本该知道此事。」因为接下来的话语即是此意：
  - type: paragraph
    text:
      ru: «Молил бы я Бога, чтобы мало ли, много ли, не только ты, но и все, слушающие меня сегодня, сделались такими, как я, кроме этих уз». Хотя узы за имя Христово и достойны славы, но Павел«прибавил кроме этих уз», приноравливаясь к пониманию присутствовавших. – Что говоришь ты, блаженный Павле,«кроме этих уз?»Какое же и дерзновение у тебя, если ты стыдишься и избегаешь уз? Не везде ли в своих посланиях ты хвалишься узами и называешь самого себя узником? И не везде ли выставляешь нам на вид кандалы вместо диадемы? Итак, что же такое случилось, что ты отстраняешь от себя узы? Сам я, говорит он, не отстраняю их от себя, не стыжусь их, но говорю так по снисхождению к немощи слушателей, потому что они не могут еще вместить похвалы моей. От Господа же узнал я, что«никто к ветхой одежде не приставляет заплаты из небеленой ткани»(Мк. 2, 21). Вот почему я так сказал.
      cn: 我会向上帝祈祷，无论或多或少，不仅是你，还有今天所有听我说话的人，都能像我一样，除了这些枷锁。虽然因基督之名所受的枷锁配得荣耀，但保罗「补充了除了这些枷锁」这一句，以适应在场听众的理解力。——蒙福的保罗啊，你说「除了这些枷锁？」你怎能如此大胆，如果你羞耻并逃避枷锁？你不是在你的书信中无处不夸耀枷锁，并称自己为囚徒吗？你不是也无处不向我们展示镣铐以取代冠冕吗？那么，究竟发生了什么事，让你将枷锁推开呢？他说，我本人并未将它们推开，也并未以它们为耻，但我如此说，是出于对听众软弱的体恤，因为他们尚不能领受我对它们的称赞。我从上主那里得知，「没有人会把未经漂洗的新布补在旧衣服上」（马可福音 2:21）。这就是我如此说的原因。
- type: heading1
  text:
    ru: Глава двадцать седьмая
    cn: 第二十七章
  children:
  - type: paragraph
    text:
      ru: Деян.27:1–3.Когда решено было плыть нам в Италию, то отдали Павла и некоторых других узников сотнику Августова полка, именем Юлию. Мы взошли на Адрамитский корабль и отправились, намереваясь плыть около Асийских мест. С нами был Аристарх, Македонянин из Фессалоники. На другой день пристали к Сидону. Юлий, поступая с Павлом человеколюбиво, позволил ему сходить к друзьям и воспользоваться их усердием.
      cn: (使徒行传 27:1-3) 非斯都既然定意了，叫我們坐船往意大利去，便將保羅和別的囚犯交給奧古斯都御營裏的一個百夫長，名叫猶流。 有一隻亞大米田的船，要沿著亞細亞一帶地方的海邊走，我們就進了那船開行；有馬其頓的帖撒羅尼迦人亞里達古和我們同去。 第二天，到了西頓；猶流寬待保羅，准他往朋友那裏去，受他們的照應。
  - type: paragraph
    text:
      ru: Аристарх с пользой присутствует и сопутствует Павлу, так как должен возвестить в Македонии обо всем, что случилось с Павлом.
      cn: 亚里达古有益地同在并随行保罗，因为他理应在马其顿传报所有发生在保罗身上的事。
  - type: paragraph
    text:
      ru: «Юлий, поступая с Павлом человеколюбиво». Да и естественно было вести и поддерживать Павла, угнетенного узами и страхом. Посмотри, как писатель не скрывает и того, что Павел нуждался в попечении о себе.
      cn: 「尤利乌以仁爱之心对待保罗。」而照料并扶持身负锁链与恐惧重压的保罗，乃是理所当然的。你看，作家甚至没有隐瞒保罗需要被照看的事实。
  - type: paragraph
    text:
      ru: Деян.27:4–8.Отправившись оттуда, мы приплыли в Кипр, по причине противных ветров, и, переплыв море против Киликии и Памфилии, прибыли в Миры Ликийские. Там сотник нашел Александрийский корабль, плывущий в Италию, и посадил нас на него. Медленно плавая многие дни и едва поровнявшись с Книдом, по причине неблагоприятного нам ветра, мы подплыли к Криту при Салмоне. Пробравшись же с трудом мимо него, прибыли к одному месту, называемому Хорошие Пристани, близ которого был город Ласея.
      cn: (使徒行传 27:4-8) 從那裏又開船，因為風不順，就貼著塞浦路斯背風岸行去。 過了基利家、旁非利亞前面的海，就到了呂家的每拉。 在那裏，百夫長遇見一隻亞歷山大的船，要往意大利去，便叫我們上了那船。 一連多日，船行得慢，僅僅來到革尼土的對面。因為被風攔阻，就貼著克里特背風岸，從撒摩尼對面行過。 我們沿岸行走，僅僅來到一個地方，稱為佳美的港口；離那裏不遠，有拉西亞城。
  - type: paragraph
    text:
      ru: Корабль, говорит,«Александрийский, плывущий в Италию». Вероятно, и они отправились в Малую Азию, чтобы возвестить о том, что случилось с Павлом, как Аристарх – в Македонию.
      cn: 「船，」他说，「是亚历山大港的船，正驶往意大利。」或许，他们也前往小亚细亚，为了宣扬关于保罗所遭遇的事，就像亚里达古前往马其顿一样。
  - type: paragraph
    text:
      ru: 'Деян.27:9–10.Но как прошло довольно времени, и плавание было уже опасно, потому что и пост уже прошел, то Павел советовал, говоря им: мужи! я вижу, что плавание будет с затруднениями и с большим вредом не только для груза и корабля, но и для нашей жизни.'
      cn: (使徒行传 27:9-10) 走的日子多了，已經過了禁食的節期，行船又危險，保羅就勸眾人說： 「眾位，我看這次行船，不但貨物和船要受傷損，大遭破壞，連我們的性命也難保。」
  - type: paragraph
    text:
      ru: Думаю, Павел говорит здесь о посте иудейском, так как он отправился много времени спустя после Пятидесятницы, так что в пределы Крита прибыл почти к зиме. Но чтобы показать, что он не пророчествует, а говорит по догадке, выражается так:"вижу", – потому что ему не тотчас поверили бы и в том случае, если бы он сказал это как пророк.
      cn: 我认为保罗在这里谈论的是犹太人的禁食，因为他是在五旬节后过了很久才启程的，因此他抵达克里特岛时已临近冬季。但为了表明他并非在预言，而是在根据推测说话，他这样表达：「我看出」——因为即使他以先知的身份说出这话，人们也不会立刻相信他。
  - type: paragraph
    text:
      ru: Деян.27:11–13.Но сотник более доверял кормчему и начальнику корабля, нежели словам Павла. А как пристань не была приспособлена к зимовке, то многие давали совет отправиться оттуда, чтобы, если можно, дойти до Финика, пристани Критской, лежащей против юго-западного и северо-западного ветра, и там перезимовать. Подул южный ветер, и они, подумав, что уже получили желаемое, отправились, и поплыли поблизости Крита.
      cn: (使徒行传 27:11-13) 但百夫長信從掌船的和船主，過於信從保羅所說的。 且因在這海口過冬不便，船上的人就多半說：「不如開船離開這地方，或者能到非尼基過冬。」非尼基是克里特的一個海口，一面朝西南，一面朝西北。 這時，微微起了南風，他們以為得意，就起了錨，貼近克里特行去。
  - type: paragraph
    text:
      ru: Евангелист говорит, что«сотник более доверял кормчему и начальнику корабля». Сделал он это в том предположении, что скорее следует послушать людей опытных в плавании, чем пассажира, неопытного в этом деле. Таким образом, это было ошибкой его ума, а не судьбы.
      cn: 传道者说：「百夫长更信赖舵手和船长。」他这样做，是基于一个设想，即宁可听从那些在航海方面有经验的人，而不是一位对此事没有经验的乘客。如此一来，这是他判断上的错误，而非命运的错误。
  - type: paragraph
    text:
      ru: 'Деян.27:14–33.Но скоро поднялся против него ветер бурный, называемый эвроклидон. Корабль схватило так, что он не мог противиться ветру, и мы носились, отдавшись волнам. И, набежав на один островок, называемый Клавдой, мы едва могли удержать лодку. Подняв ее, стали употреблять пособия и обвязывать корабль; боясь же, чтобы не сесть на мель, спустили парус и таким образом носились. На другой день, по причине сильного обуревания, начали выбрасывать груз, а на третий мы своими руками побросали с корабля вещи. Но как многие дни не видно было ни солнца, ни звезд и продолжалась немалая буря, то наконец исчезала всякая надежда к нашему спасению. И как долго не ели, то Павел, став посреди них, сказал: мужи! надлежало послушаться меня и не отходить от Крита, чем и избежали бы сих затруднений и вреда. Теперь же убеждаю вас ободриться, потому что ни одна душа из вас не погибнет, а только корабль. Ибо Ангел Бога, Которому принадлежу я и Которому служу, явился мне в эту ночь и сказал: «не бойся, Павел! тебе должно предстать пред кесаря, и вот, Бог даровал тебе всех плывущих с тобою». Посему ободритесь, мужи, ибо я верю Богу, что будет так, как мне сказано. Нам должно быть выброшенными на какой-нибудь остров. В четырнадцатую ночь, как мы носимы были в Адриатическом море, около полуночи корабельщики стали догадываться, что приближаются к какой-то земле. И, вымерив глубину, нашли двадцать сажен; потом на небольшом расстоянии, вымерив опять, нашли пятнадцать сажен. Опасаясь, чтобы не попасть на каменистые места, бросили с кормы четыре якоря, и ожидали дня. Когда же корабельщики хотели бежать с корабля и спускали на море лодку, делая вид, будто хотят бросить якоря с носа, Павел сказал сотнику и воинам: если они не останутся на корабле, то вы не можете спастись. Тогда воины отсекли веревки у лодки, и она упала. Перед наступлением дня Павел уговаривал всех принять пищу, говоря: сегодня четырнадцатый день, как вы, в ожидании, остаетесь без пищи, не вкушая ничего.'
      cn: (使徒行传 27:14-33) 不多幾時，狂風從島上撲下來；那風名叫「友羅革屯」。 船被風抓住，敵不住風，我們就任風颳去。 貼著一個島的背風岸奔行，那島名叫高大，在那裏僅僅收住了小船。 既然把小船拉上來，就用纜索捆綁船底，又恐怕墜入流沙裏，就落下篷來，任船飄去。 我們被暴風吹蕩太甚，第二天他們就把船重減輕了。 到第三天，我們又親手把船上的器具拋棄了。 太陽和星辰多日不顯露，催逼我們的狂風大浪又不小，我們得救的盼望就都絕了。 眾人多日沒有吃甚麼，保羅就出來站在他們中間，說：「眾位，你們本該聽我的話，不離開克里特，免得遭這樣的傷損破壞。 現在我還勸你們放心，你們的性命一個也不失喪，唯獨失喪這船。 因我所屬所事奉的　上帝，他的天使這夜站在我旁邊，說： 『保羅，不要害怕，你必定站在凱撒面前，看哪，並且與你同船的人，　上帝都賜給你了。』 所以眾位可以放心，我信　上帝他怎樣對我說：『事情也要怎樣成就。』 只是我們必要撞在一個島上。」 到了第十四天夜間，船在亞德里亞海飄浮。約到半夜，水手以為漸近旱地， 就探深淺，探得有二十法賀；稍往前行，又探深淺，探得有十五法賀。 恐怕撞在石頭上，就從船尾拋下四個錨，盼望天亮。 水手想要逃出船去，把小船放在海裏，假作要從船頭拋錨的樣子。 保羅對百夫長和兵丁說：「這些人若不等在船上，你們必不能得救。」 於是兵丁砍斷小船的繩子，由她飄去。 天漸亮的時候，保羅勸眾人都拿食物吃，說：「你們等著忍餓不吃甚麼，已經十四天了。


        众人多日未进食，保禄便站在他们中间说：「诸位！你们本该听从我的建议，不从革哩底开船，这样就能免去这些困境和损害了。现在我劝你们振作起来，因为你们没有人会丧生，只有船会损失。因为我所敬奉、所事奉的上帝，祂的使者在昨夜向我显现说：『保禄，不要害怕！你必须站在凯撒面前，看哪，上帝已将所有与你同船的人赐给你了。』所以，诸位，振作起来！因为我信赖上帝，祂对我所说的一切，必定会照样成就。我们必会漂流到一个岛屿上。」


        到了第十四夜，当我们在亚得里亚海漂流的时候，大约在午夜时分，船员们开始猜想他们正接近某片陆地。于是他们测水深，发现有二十㖊；稍往前行，再测量，发现有十五㖊。他们恐怕会撞到岩石上，就从船尾抛下四个锚，等待天明。当船员们想要弃船逃走时，他们把救生艇放下海，假装要从船头抛锚。保禄便对百夫长和兵士们说：「如果这些人不留在船上，你们就无法获救。」于是兵士们砍断了救生艇的绳索，它就掉了下去。天快亮的时候，保禄劝众人用餐，说：「今天已是第十四天了，你们在等待中一直没有进食，什么也没有吃。」'
  - type: paragraph
    text:
      ru: 'После столь продолжительной бури не с укоризной обращается к ним, но желает, чтобы на будущее время они верили ему, и то, что случилось, представляет как свидетельство истинности того, что сказано было им. Потом предсказывает две вещи, именно: что корабль погибнет, а находившиеся на нем спасутся, и что они будут выброшены на остров.'
      cn: 在如此漫长的风暴之后，他并非带着责备对他们说话，而是希望他们将来能相信他，并把所发生的事情呈现为对他所说过的话的真实性的见证。接着他预言了两件事，即：船只将沉没，而船上的人将得救，并且他们将被抛到一座岛上。
  - type: paragraph
    text:
      ru: '«Вот, Бог даровал тебе всех плывущих с тобою». Вот, если бы не Павел, то все находившиеся в корабле должны были бы погибнуть. Итак, ложно то, что сказано Гомером:'
      cn: «看哪，上帝已将所有与你同船的人赐予了你»（使徒行传 27:24）。可见，倘若没有保罗，那么所有在船上的人都必会丧生。因此，荷马所言乃是虚假的：
  - type: paragraph
    text:
      ru: Но судьбы, как я мню, не избег ни один земнородный, Муж ни отважный, ни робкий, как скоро на свет он родится.
      cn: '然命运，依我之见，世间凡人无一能免，

        无论勇毅之士抑或怯懦之人，自其降生伊始。'
  - type: paragraph
    text:
      ru: (Илиада.«Перевод П. Гнедича)»
      cn: 伊利亚特（P. 格涅季奇译本）
  - type: paragraph
    text:
      ru: 'Гомер говорит, что невозможно избежать смертного рока, вместе с рождением определяющего час смерти человеческой. Но вот: если всем определено было погибнуть, то, судя по-обыкновенному, и Павел должен был бы погибнуть, пробыв столько дней на море без пищи! Да, ложный ум сказал: «Судьбы не избег муж ни отважный (то есть доблестный), ни робкий"… Совершенно иное сказано в Писании, именно:«Праведник спасается от беды, а вместо него попадает в нее нечестивый»(Притч. 11, 8). Итак, души Бог даровал Павлу, а корабль со всем находившимся на нем погиб. Таким образом, нечестивые спасаются в этот раз ради праведника. Бывает также, когда и нечестивый преждевременно гибнет от своего нечестия, как говорит Екклесиаст:«Не предавайся греху, и не будь безумен: зачем тебе умирать не в свое время?»(7, 18).'
      cn: 荷马说，凡人无法避免必死之劫，这劫数与生俱来地决定着人死亡的时辰。然而，如果所有人都注定要灭亡，那么按常理推断，保罗在海上多日未进食，也应当灭亡才是！是的，虚妄的心思说：「无论勇敢的（即是说，英勇的）还是怯懦的，都无法逃脱命运。」圣经中却说了截然不同的事，即是说：「义人得脱患难，恶人却代替他陷入其中。」(箴言 11:8)。因此，上帝将众人的性命恩赐予保罗，而船及其上的一切却都灭亡了。如此一来，不敬虔者这一次是因着义人而得救。也常常有这样的情况：不敬虔者因其不敬虔而过早地灭亡，正如传道书所说：「不要沉溺于罪恶，也不要作愚昧人：你何必在未到之时而死呢？」(传道书 7:18)。
  - type: paragraph
    text:
      ru: '«Тогда воины отсекли веревки у лодки». Бог устроил так, чтобы Павлу сначала не верили, но поверили, проверив его слова опытом; что и случилось. Посмотри: сотник верит Павлу так, что позволяет погубить лодку; корабельщики же еще не верили, но поверили после, так как люди эти мало развиты.'
      cn: 于是兵士们砍断了船上的绳索。上帝如此安排，使保罗起初不被人相信，但在用经验验证了他的话之后，人们便相信了他；事情也正是如此。看哪！百夫长如此相信保罗，以至于允许毁坏小船；而船员们仍然不相信，但后来相信了，因为这些人（的）心智不发达。
  - type: paragraph
    text:
      ru: 'Деян.27:34–39.Потому прошу вас принять пищу: это послужит к сохранению вашей жизни; ибо ни у кого из вас не пропадет волос с головы. Сказав это и взяв хлеб, он возблагодарил Бога перед всеми и, разломив, начал есть. Тогда все ободрились и также приняли пищу. Было же всех нас на корабле двести семьдесят шесть душ. Насытившись же пищею, стали облегчать корабль, выкидывая пшеницу в море. Когда настал день, земли не узнавали, а усмотрели только некоторый залив, имеющий отлогий берег, к которому и решились, если можно, пристать с кораблем.'
      cn: (使徒行传 27:34-39) 所以我勸你們吃些食物，這是關乎你們救命的事；因為你們各人連一根頭髮也不至於掉落。」 保羅說了這話，就拿著餅，在眾人面前感謝了　上帝；就擘開吃。 於是他們都放下心，也就吃了。 我們在船上的共有二百七十六個人。 他們吃飽了，就把船上的麥子拋在海裏，為要叫船輕一點。 到了天亮，他們不認識那地，但見一個海灣，有岸可登，就想能把船泊進去不能。

        所以，我求你们用餐，这有助于保全你们的生命，因为你们中间没有一人会失落头上的一根头发。说完这话，他又拿起饼来，在众人面前向上帝感恩，然后掰开，开始吃。于是，众人都得了鼓励，也用餐了。原来，我们船上共有二百七十六人。众人吃饱了，就着手减轻船的负荷，把小麦抛到海里。天亮的时候，他们认不出那地，只看见一个有缓坡海岸的海湾，他们就决定，如果可能，就把船靠上去。'
  - type: paragraph
    text:
      ru: 'Что Павел начал есть, так это для того, чтобы не умереть с голоду.«Взяв хлеб, он возблагодарил Бога»за случившееся. Говорить то же самое научает нас и чин Евхаристии: «Благодарим Тя, Боже, яко удостоил еси нас…»'
      cn: 保罗开始进食，是为了不至于饿死。「他拿起饼，感谢了上帝，」为了所发生的一切。圣体圣事礼仪也教导我们说同样的话：「我们感谢祢，上帝啊，祢使我们配得……」
  - type: paragraph
    text:
      ru: Деян.27:40–44.И, подняв якоря, пошли по морю и, развязав рули и подняв малый парус по ветру, держали к берегу. Попали на косу, и корабль сел на мель. Нос увяз и остался недвижим, а корма разбивалась силою волн. Воины согласились было умертвить узников, чтобы кто-нибудь, выплыв, не убежал. Но сотник, желая спасти Павла, удержал их от сего намерения, и велел умеющим плавать первым броситься и выйти на землю, прочим же спасаться кому на досках, а кому на чем-нибудь от корабля; и таким образом все спаслись на землю.
      cn: (使徒行传 27:40-44) 於是收起纜索，棄錨在海裏；又鬆開舵繩，拉起主篷，順著風向岸行去。 但遇著兩水夾流的地方，就把船擱了淺；船頭膠住不動，船尾被浪的猛力衝壞。 兵丁的意思要把囚犯殺了，恐怕有洑水脫逃的。 但百夫長要救保羅，不准他們任意而行，就吩咐會洑水的，跳下水去先上岸； 其餘的人可以用板子或船上的零碎東西上岸。這樣，眾人都得了救，上了岸。


        于是，他们起了锚，航行在海上，解开了舵索，升起小帆顺风而行，朝着岸边驶去。却遇上了一道沙洲，船便搁浅了。船头陷入其中，纹丝不动，而船尾却被海浪的冲击力打碎。兵丁们原打算杀掉囚犯，以免有人游出去逃脱。但百夫长，因想救保罗，就阻止了他们的这个意图，又吩咐会游泳的人，要先跳下水，上岸；其余的人，或抓住木板，或抓住船上别的物件，自救上岸；这样，所有人都安全地上了岸。'
  - type: paragraph
    text:
      ru: Ослабили привязи, когда настал день; днем же снимается и корабль, чтобы бывшие на нем не погибли от страха и чтобы видели исполнение пророчества.
      cn: 绳索松开，当时天已破晓；白昼，船只启航，以免船上之人因恐惧而灭亡，并使他们得以看见预言的应验。
  - type: paragraph
    text:
      ru: Следует заметить, что убивают кого-нибудь добровольно и судьба не может воспрепятствовать совершению убийства. Так вот, добровольно решаются на дело убийства воины и приступают к нему; однако же, послушавшись сотника, снова и также добровольно оставляют свое намерение. Им можно было не послушать сотника, так как их было много и на их стороне была сила, но воля и свободное желание делают то, что хотят, и не делают того, чего не хотят.
      cn: 应当指出的是，杀人是出于自愿的，命运无法阻止谋杀的发生。于是，士兵们自愿决定谋杀并付诸行动；然而，在听从了百夫长的话后，他们再次并且同样自愿地放弃了他们的意图。他们本可以不听从百夫长的话，因为他们人数众多且力量占优势，但意志和自由意愿做其所愿，不做其所不愿。
- type: heading1
  text:
    ru: Глава двадцать восьмая
    cn: 第二十八章
  children:
  - type: paragraph
    text:
      ru: 'Деян.28:1–5.Спасшись же, бывшие с Павлом узнали, что остров называется Мелит. Иноплеменники оказали нам немалое человеколюбие, ибо они, по причине бывшего дождя и холода, разложили огонь и приняли всех нас. Когда же Павел набрал множество хвороста и клал на огонь, тогда ехидна, выйдя от жара, повисла на руке его. Иноплеменники, когда увидели висящую на руке его змею, говорили друг другу: верно этот человек – убийца, когда его, спасшегося от моря, суд Божий не оставляет жить. Но он, стряхнув змею в огонь, не потерпел никакого вреда.'
      cn: (使徒行传 28:1-5) 我們既已得救，才知道那島名叫馬耳他。 土人看待我們，有不少的恩情；因為當時下雨，天氣又冷，他們就生火接待我們眾人。 那時，保羅拾起一捆柴，放在火上，有一條毒蛇，因為熱了出來，咬住他的手。 土人看見那毒蛇掛在他手上，就彼此說：「這人必是個兇手，雖然從海裏救上來，天理還不容他活著。」 保羅竟把那毒蛇甩在火裏，並沒有受傷。

        获救之后，那些与保罗同在的人才知道，那岛名叫米利大。那些土著对我们显出极大的仁慈，因为他们因着下雨和寒冷，生了火，并接待了我们所有人。当保罗拾了一捆柴，放到火里的时候，一条蝮蛇因着热气出来，缠在他的手上。那些土著看见那条蛇缠在他的手上时，就彼此说：「这人必定是个杀人凶手，纵然他从海上获救，上帝的审判也不容他活着。」但他把那条蛇抖入火中，却丝毫没有受伤。'
  - type: paragraph
    text:
      ru: Когда Павел собирал хворост, ехидна укусила его руку и не причинила ему никакого вреда, потому что святой муж был совершителем веры. Впустив жало в руку апостола и не нашедши в ней греховной язвы, ехидна тотчас отскочила и бросилась в огонь, как бы ища наказания себе самой. Мы же боимся зверей, так как не имеем всеоружия добродетели.
      cn: 当保罗拾柴火的时候，一条蝮蛇咬了他的手，却没有对他造成任何伤害，因为这位圣人是信德的实行者。蝮蛇将毒刺刺入使徒的手中，却没有在其中找到罪的创伤，便立刻跳开，投入火中，仿佛是在为自己寻求惩罚。而我们却惧怕野兽，因为我们没有美德的全副武装。
  - type: paragraph
    text:
      ru: '«Говорили друг другу». Смотри: естественное суждение полно правдивости и у варваров не просто осуждают, но с чувством сострадания переговорив между собой.'
      cn: «他们彼此说。» 看哪：天然的判断充满真理，即便在蛮族那里，他们并非仅仅是定罪，而是在彼此带着怜悯之心商议之后才作出判断。
  - type: paragraph
    text:
      ru: Деян.28:6.Они ожидали было, что у него будет воспаление, или он внезапно упадет мертвым; но, ожидая долго и видя, что не случилось с ним никакой беды, переменили мысли и говорили, что он Бог.
      cn: (使徒行传 28:6) 土人想他必要腫起來，或是忽然仆倒死了；看了多時，見他無害，就轉念，說：「他是個神。」
  - type: paragraph
    text:
      ru: Они думали, что Павлово тело разорвется.
      cn: 他们以为保罗的身体会裂开。
  - type: paragraph
    text:
      ru: «Ожидая долго». Чудо обнаружилось не вдруг, но люди несколько времени выжидали его. Таким образом, явление это не было обманом или простой ловкостью.
      cn: «长久地等待着»。奇迹并非突然显现，而是人们等候了一段时间。这样一来，这显现便不是欺骗或简单的伎俩。
  - type: paragraph
    text:
      ru: «Говорили, что он Бог». Так как имели обычай всякого, кто сделает что-либо необыкновенное, называть богом, подобно тому как древние называли богами тех, кто, физической ли силой, как Геракл, совершал более великие подвиги, чем его современники, или сводил зрителей с ума искусством магии, как Симон в Самарии.
      cn: «他们说他是上帝》。因为他们有一个习俗，称呼任何做出非凡之事的人为神，如同古人称那些人如同神，他们或凭借体力，如赫拉克勒斯，成就了比他同代人更伟大的功绩，或如撒玛利亚的西门，以魔术使观众疯狂。
  - type: paragraph
    text:
      ru: Деян.28:7–10.Около того места были поместья начальника острова, именем Публия; он принял нас и три дня дружелюбно угощал. Отец Публия лежал, страдая горячкою и болью в животе; Павел вошел к нему, помолился и, возложив на него руки свои, исцелил его. После сего события и прочие на острове, имевшие болезни, приходили и были исцеляемы; и оказывали нам много почести и при отъезде снабдили нужным.
      cn: (使徒行传 28:7-10) 離那地方不遠，有田產是島長部百流的；他接納我們，款留我們住宿三日。 當時，部百流的父親患熱病和痢疾躺著。保羅進去，為他禱告，按手在他身上，治好了他。 從此，島上其餘的病人也來，得了醫治。 他們又多方的尊敬我們；到了離開的時候，也把我們所需用的送到船上。


        在那个地方附近，有岛长部百流的产业；他接待了我们，并三天之久友善地款待我们。部百流的父亲正躺着，患发热病和腹痛；保罗进去，为他祈祷，按手在他身上，治愈了他。这事以后，岛上其余患病的人也来，都被治愈了；他们也多方尊敬我们，并且在我们开船的时候，把我们所需用的都送给我们了。'
  - type: paragraph
    text:
      ru: Публий был человеком гостеприимным, потому что принял их, не зная ничего о них, а только по состраданию к их участи, и дал покой двумстам восьмидесяти человекам, видя в этом пользу для себя.
      cn: 普布利乌斯是个好客的人，因为他接待了他们，对他们一无所知，而仅仅是出于对他们遭遇的怜悯，并让二百八十个人得到了安歇，看到这对自己有益处。
  - type: paragraph
    text:
      ru: «Отец Публия лежал, страдая горячкою и болью в животе». Дизентерия, болезнь трудноизлечимая, исцеленная Павлом, обратила к вере во Христа многих.
      cn: «步百流的父亲躺卧着，忍受着热病和腹痛.» 痢疾，一种难以治愈的疾病，蒙保罗治愈，使许多人归信基督。
  - type: paragraph
    text:
      ru: Деян.28:11–14.Через три месяца мы отплыли на Александрийском корабле, называемом Диоскуры, зимовавшем на том острове, и, приплыв в Сиракузы, пробыли там три дня. Оттуда отплыв, прибыли в Ригию; и как через день подул южный ветер, прибыли на второй день в Путеол, где нашли братьев, и были упрошены пробыть у них семь дней, а потом пошли в Рим.
      cn: (使徒行传 28:11-14) 過了三個月，我們上了亞歷山大的船離開；這船以卡斯托爾與波呂克斯為記，是在那海島過了冬的。 到了敘拉古，我們停泊三日； 又從那裏繞行，來到利基翁。過了一天，起了南風，第二天就來到部丟利。 在那裏遇見弟兄們，請我們與他們同住了七天。這樣，我們來到羅馬。
  - type: paragraph
    text:
      ru: Почти всегда, особенно на кораблях александрийских, было в обычае делать такие изображения около носа корабля справа и слева.
      cn: 几乎总是，尤其是在亚历山大港的船只上，通常的惯例是在船头左右两侧制作这样的图像。
  - type: paragraph
    text:
      ru: А так как, при тогдашнем господстве идолослужения, изображены были, вероятно, на этом корабле"Диоскуры", то из этого заключим, что корабельщиком на нем был иноземец и идолопоклонник.
      cn: 又因在当时偶像崇拜盛行之时，这艘船上大概绘有「狄俄斯库里」的形象，由此我们断定，其船主是一位异邦人，也是一位偶像崇拜者。
  - type: paragraph
    text:
      ru: Деян.28:15–16.Тамошние братья, услышав о нас, вышли нам навстречу до Аппиевой площади и трех гостиниц. Увидев их, Павел возблагодарил Бога и ободрился.
      cn: (使徒行传 28:15-16) 那裏的弟兄們一聽見我們的信息就出來，到亞比烏市和三館地方迎接我們。保羅見了他們，就感謝　上帝，放心壯膽。 到了羅馬城，百夫長把眾囚犯交給禦營的統領，唯有保羅蒙准，和一個看守他的兵，另住在一處。
  - type: paragraph
    text:
      ru: Когда говорит«до Аппиевой площади и трех гостиниц», обозначает некоторые местности перед Римом. Первая, Аппиева площадь – местность, где находилась статуя Аппия; от этого, вероятно, местность эта и названа площадью перед статуей.
      cn: 当提到「直到亚比乌市集和三旅店」时，指的是罗马城前的一些地方。首先，亚比乌市集——这是有亚比乌雕像的地方；因此，这地方很可能就因其位于雕像前方而被命名为「广场」。
  - type: paragraph
    text:
      ru: «Увидев их, Павел возблагодарил Бога и ободрился». Хотя и сотворил столько чудес Павел, однако же получил больше дерзновения от того, что увидел братию. Отсюда мы узнаем, что он по-человечески принимал и утешение, и противоположные отношения к нему.
      cn: 「看见他们，保罗就感谢上帝，得了鼓励。」尽管保罗行了如此多的神迹，然而他因见到弟兄们而获得了更大的勇气。由此我们得知，他以人之常情接受安慰，也接受对他相反的态度。
  - type: paragraph
    text:
      ru: 'Деян.28:16–18.Когда же пришли мы в Рим, то сотник передал узников военачальнику, а Павлу позволено жить особо с воином, стерегущим его. Через три дня Павел созвал знатнейших из Иудеев и, когда они сошлись, говорил им: мужи братия! не сделав ничего против народа или отеческих обычаев, я в узах из Иерусалима предан в руки Римлян. Они, судив меня, хотели освободить, потому что нет во мне никакой вины, достойной смерти.'
      cn: (使徒行传 28:16-18) 到了羅馬城，百夫長把眾囚犯交給禦營的統領，唯有保羅蒙准，和一個看守他的兵，另住在一處。 過了三天，保羅請猶太人的首領來。他們來了，就對他們說：「諸位弟兄，我雖沒有犯甚麼事干犯本國的百姓和我們祖宗的規條，卻被囚禁，從耶路撒冷解在羅馬人的手裏。 他們審問了我，就願意釋放我；因為在我身上，並沒有該死的罪。


        当我们来到罗马时，百夫长便将囚犯们交给卫队长，但保罗获准与看守他的一个兵士独自居住。过了三天，保罗召集了犹太人中那些最有名望的。当他们聚集在一起时，保罗对他们说：「诸位弟兄！我并没有做任何冒犯我民族或祖宗习俗的事，却在耶路撒冷被捆绑，交付在罗马人手中。他们审判了我之后，本想释放我，因为在我身上找不出任何该死的罪状。'
  - type: paragraph
    text:
      ru: Павел был уважаем настолько, что ему дозволено было пребывать отдельно; так как если до сих пор сотник относился к нему благосклонно, то теперь стал еще благосклонней.
      cn: 保罗受到如此的尊重，以至于他被允许单独居住；因为如果说在此之前百夫长对他怀有善意，那么现在则变得更加善意了。
  - type: paragraph
    text:
      ru: «С воином, стерегущим его», чтобы предотвратить возможность новых козней против Павла так что воин не за ним наблюдал, а за тем, чтобы не было с ним какой-либо неприятности.
      cn: 「有一个士兵守护着他」，这是为了防止有人再次对保罗施展诡计，所以这士兵并非是在监视保罗，而是为了确保他不会遇到任何不测。
  - type: paragraph
    text:
      ru: Деян.28:19–20.Но так как Иудеи противоречили, то я принужден был потребовать суда у кесаря, впрочем не с тем, чтобы обвинить в чем-либо мой народ. По этой причине я и призвал вас, чтобы увидеться и поговорить с вами, ибо за надежду Израилеву обложен я этими узами.
      cn: (使徒行传 28:19-20) 無奈猶太人不服，我不得已，只好上告於凱撒，並非有甚麼事要控告我本國的百姓。 因此，我請你們來見面說話；我原為那以色列所盼望的，被這鏈子捆鎖。」

        但因犹太人反驳，我不得不向凯撒要求审判，并非要控告我的百姓有任何事。因此我召集你们来，与你们相见并交谈，因为为着以色列的盼望，我被这些锁链捆绑。'
  - type: paragraph
    text:
      ru: 'Так как Павел знал, что совершенно неуместно было оказаться под судом, особенно у человека неверующего, то защищает себя с той и другой стороны, именно: что он поступил не против закона, а, напротив, сам заведомо несправедливо осужден иудеями и что не по своей воле назвал кесаря, а потому, что сами иудеи дали ему к тому повод, так как не заблагорассудили ни судить его по закону Церкви, ни подчиниться законному мнению властей. Власти хотели отпустить его; не отпустили же потому, что иудеи воспротивились этому. Итак, что же? Чтобы обвинить иудеев, ты сделал то, что назвал кесаря? Нет, говорит, чтобы избежать опасности.'
      cn: 保罗知道，自己受审，尤其是在一个不信者面前受审，是完全不合宜的，他便从两方面为自己辩护，即是说：他并非是行事违背了律法，反而是他自己被犹太人明知故犯地不公正定罪；并且他呼吁凯撒并非出于自己的意愿，而是犹太人自己给了他这个理由，因为他们既不愿按教会律法审判他，也不愿服从当局的合法意见。当局本想释放他；但未能释放，是因为犹太人对此反对。那么，怎么说呢？你为了控告犹太人，才呼吁凯撒的吗？「不是的，」他说，「是为了避免危险。」
  - type: paragraph
    text:
      ru: «За надежду Израилеву обложен я этими узами». То есть Писаниями предоставлена иудеям одна надежда – Христос, проповедуя которую, Павел и очутился в этом состоянии узника.
      cn: 「为着以色列的希望，我被这些锁链捆绑着。」这就是说，圣经为犹太人提供了一个希望——基督；保罗就是因为宣讲这希望，才身陷这囚徒的境地。
  - type: paragraph
    text:
      ru: 'Деян.28:21–22.Они же сказали ему: мы ни писем не получали о тебе из Иудеи, ни из приходящих братьев никто не известил о тебе и не сказал чего-либо худого. Впрочем желательно нам слышать от тебя, как ты мыслишь.'
      cn: (使徒行传 28:21-22) 他們說：「我們並沒有接著從猶太來論你的信，也沒有弟兄到這裏來報給我們說你有甚麼不好處。 但我們願意聽你的意見如何；因為這教門，我們曉得是到處被毀謗的。」


        他们就对他说：「我们没有从犹太收到关于你的信件，也没有从前来这里的弟兄中，有人向我们报告你的事，也没有说你有什么不好。不过，我们倒是很乐意听你亲口说出你的见解。」'
  - type: paragraph
    text:
      ru: Еще до прибытия Павла в Рим было внушено иудеям не принимать проповеди о Христе, и не только римским иудеям, но и всем иудеям по всей земле. Но откуда известно это? В сочинениях древних писателей мы находим, что обитавшие в Иерусалиме священники, книжники и старцы, написав послания, разослали их по всем странам к живущим в них иудеям; в этих посланиях они поносили учение Христово как учение, чуждое Богу, и убеждали не принимать его. То же самое, по-видимому, означает следующее пророчество Исайи:«Горе земле, осеняющей крыльями по ту сторону рек Ефиопских, посылающей послов по морю, и в папировых суднах по водам!»(18, 1–2). Этим означается, что нечестивый голос людей, населявших Иудею, разнесся на быстролетных кораблях за пределы земли эфиопской и до последних концов земли и что «послы» их, плавая по водам и переплывая море, проникали во все страны, разнося послания и понося учение о нашем Спасителе. У иудеев и до сих пор в обычае называть послами, вестниками, – лиц, разносящих окружные грамоты от их начальников.
      cn: 甚至在保罗抵达罗马之前，犹太人就被教唆不接受关于基督的宣讲，不仅是罗马的犹太人，而且是普世各地的犹太人。但这从何得知呢？在古代作家的著作中，我们发现，住在耶路撒冷的司祭、经师和长老们写了书信，并将它们发往各国，寄给住在那些国家里的犹太人；在这些书信中，他们诋毁基督的教训是一种与上帝相悖的教训，并劝说他们不要接受它。同样的事情，似乎也由以赛亚的以下预言所预示：«祸哉，那地！它以翅膀荫庇着埃塞俄比亚诸河彼岸，从海上差遣使者，又乘坐纸莎草船在水面上行进！»(以赛亚书 18:1-2)。这预示着，居住在犹太地的人们那不敬虔的声音，乘坐快船传遍了埃塞俄比亚地以外，直至地极，并且他们的「使者」漂浮于水面之上，横渡海洋，进入了所有国家，传播着书信，并诋毁着我们救主的教训。犹太人直到如今仍有这样的习俗，称那些从他们的首领们那里传播通函的人为使者、报信者。
  - type: paragraph
    text:
      ru: Следующая часть пророчества –«идите, быстрые послы, к народу крепкому и бодрому» –(там же, 2) – говорит об учениках Спасителя, которых пророчество называет«быстрыми послами» –в отличие от упомянутых им иудейских и в силу того, что они – благовестники всем людям.
      cn: 预言的下一部分——「去吧，快速的使者，到那强壮而充满活力的人民那里去」——(同上, 2)——指的是救主的门徒，预言称他们为「快速的使者」——这与（预言）所提及的犹太使者不同，也因为他们是向所有人传福音的使者。
  - type: paragraph
    text:
      ru: Деян.28:23–24.И, назначив ему день, очень многие пришли к нему в гостиницу; и он от утра до вечера излагал им учение о Царствии Божием, приводя свидетельства и удостоверяя их о Иисусе из закона Моисеева и пророков. Одни убеждались словами его, а другие не верили.
      cn: (使徒行传 28:23-24) 他們和保羅約定了日子，就有許多人到他的寓處來。保羅從早到晚，對他們講論這事，證明　上帝國的道，引摩西的律法和先知的書，以耶穌的事勸勉他們。 他所說的話，有信的，有不信的。


        于是，他与他们约定了一日，有许多人来到他的客店；他从早到晚，向他们讲论上帝的国之教训，引证并且向他们确证关于耶稣，从摩西的律法和先知书而来。一些人因他的话而信服，另一些人则不相信。'
  - type: paragraph
    text:
      ru: Веру во Христа иудеи называют ересью. Но вот и они свидетельствуют, что Христос проповедуется всюду, хотя и не все принимают эту проповедь, а некоторые из иудеев и эллинов даже противодействуют ей.
      cn: 犹太人称对基督的信仰为异端。然而，他们自己也见证说，基督在各处被宣讲，尽管并非所有人都接受这宣讲，而一些犹太人和希腊人甚至抵制它。
  - type: paragraph
    text:
      ru: 'Деян.28:25–26.Будучи же не согласны между собою, они уходили, когда Павел сказал следующие слова: хорошо Дух Святый сказал отцам нашим через пророка Исайю.'
      cn: (使徒行传 28:25-26) 他們彼此不合，就散了；未散以先，保羅說了一句話，說：「　聖靈藉先知以賽亞向我們祖宗所說的話是不錯的。 他說：『你去告訴這百姓說：『你們聽是要聽見，卻不明白；看是要看見，卻不曉得；
  - type: paragraph
    text:
      ru: 'Наблюдай, как теперь иудеи строят козни против Павла: в Иудее они были как бы тиранами, а здесь, даже порицаемые Павлом, они ничего не осмеливаются сказать против него, потому что дело о нем более не предоставлялось уже их власти.'
      cn: 你看，犹太人现在如何图谋对抗保罗：在犹太地，他们仿佛是暴君；而在这里，即便受到保罗的斥责，他们也不敢说任何反对他的话，因为有关他的事情已不再受制于他们的权柄。
  - type: paragraph
    text:
      ru: «Хорошо Дух Святый сказал». Здесь Павел благовременно наносит поражение тем, которые утверждают, что Дух Святый – лицо служебное Отцу, потому что он называет Святаго Духа Господом, сидящим«на престоле высоком и превознесенном», Которого видел Исайя (Ис. 6, 1), так как Дух Святый единосущен Отцу и Сыну и имеет равную с Ними власть.
      cn: 「圣灵说得好。」在此，保罗适时地驳斥了那些主张圣灵是服事圣父之位格的人，因为他称圣灵为以赛亚所见的（以赛亚书 6:1）「坐着高高在上的宝座」的上主，因为圣灵与圣父和圣子同质，并与祂们拥有同等权能。
  - type: paragraph
    text:
      ru: 'Деян.28:26–29.«Пойди к народу сему и скажи: слухом услышите, и не уразумеете; и очами смотреть будете, и не увидите. Ибо огрубело сердце людей сих, и ушами с трудом слышат, и очи свои сомкнули, да не узрят очами, и не услышат ушами, и не уразумеют сердцем, и не обратятся, чтобы Я исцелил их»(Ис. 6, 9–10).«Итак да будет вам известно, что спасение Божие послано язычникам: они и услышат. Когда он сказал это, Иудеи ушли, много споря между собою.'
      cn: (使徒行传 28:26-29) 他說：『你去告訴這百姓說：『你們聽是要聽見，卻不明白；看是要看見，卻不曉得； 因為這百姓油蒙了心，耳朵發沉，眼睛閉著；恐怕他們眼睛看見，耳朵聽見，心裏明白，歸正過來，我就醫治他們。』 所以你們當知道，　上帝這救恩，如今傳給外邦人，他們也必聽受。」 保羅說了這些話，猶太人彼此議論紛紛的就走了。
  - type: paragraph
    text:
      ru: Сделали это, говорит, люди, зажавшие уши и закрывшие глаза, которые«не обратятся, чтобы Я исцелил их». Указывается на сильное нечестие и упорное отвращение этих людей. Говорится же это с тем, чтобы привлечь и расположить их и чтобы показать, что если они обратятся, будут исцелены.
      cn: 做了这事，说，是那些捂住耳朵、闭上眼睛的人，他们「不肯回转，使我医治他们」。这表明了这些人的深重不虔敬和顽固的抗拒。而说这话的目的，是为了吸引他们并使他们回转，并要表明，如果他们回转，就会得医治。
  - type: paragraph
    text:
      ru: «Ибо огрубело сердце людей сих». Говорится это не в том смысле, будто Бог, Который хочет всем спастись и в разум истины прийти, содействует тому, чтобы они не видели, будто ревнуя о том, как бы они не услышали, но мы привыкли так говорить о людях, которые удаляются и не хотят слышать слова спасения. Такой человек бежит и отворачивается, чтобы не услышать слово, которое могло бы обратить его и удержать от зла.
      cn: 「因为这些人的心麻木了。」这话的意思并非是说，上帝，祂愿人人得救，并得以认识真理，助长他们看不见，或仿佛妒嫉他们听不见，而是我们习惯这样去说那些退避、不愿听从救恩之道的人。这样的人逃跑、转过身去，以免听到那句话，那句话本可使他回转，并使他远离邪恶。
  - type: paragraph
    text:
      ru: Деян.28:30–31.И жил Павел целых два года на своем иждивении и принимал всех, приходивших к нему, проповедуя Царствие Божие и уча о Господе Иисусе Христе со всяким дерзновением невозбранно.
      cn: (使徒行传 28:30-31) 保羅在自己所租的房子裏住了足足兩年。凡來見他的人，他全都接待， 放膽傳講　上帝國的道，將　主耶穌　基督的事教導人，並沒有人禁止。
  - type: paragraph
    text:
      ru: Павел действовал не как тот Диоген, который одевался в лохмотья и жил в бочке, который многих удивлял тем, в чем они не имели никакой нужды, а пользы не приносил никому. Павел ничего подобного не делал, потому что обращал свои взоры не на честолюбие. Напротив, Павел одевался со всевозможным приличием, жил постоянно в доме и показывал всяческое попечение о приличии, которым упомянутый циник пренебрегал, нарушая его публично, живя невоздержно и увлекаясь страстью к славе. Если кто вздумает искать причины обитания его в бочке, так никакой другой причины не найдет, кроме одного тщеславия. А Павел даже платил за помещение, какое занимал в Риме.
      cn: 保罗行事不像那个第欧根尼，他身披破烂衣衫，住在一个木桶里，令许多人惊讶于他们所不需要的事物，却对任何人都没有益处。保罗绝不做类似的事，因为他从不将目光投向虚荣。相反地，保罗穿着得体，举止合宜，始终住在房舍里，尽力展现一切合乎礼节的举止，而上述的犬儒学者却对此不屑一顾，公开地违背它，生活放荡不羁，并沉溺于对名声的渴慕。若有人试图探究他住在木桶里的原因，就不会找到任何其他原因，除了纯粹的虚荣。而保罗甚至为他在罗马所占据的居所支付租金。
  - type: heading4
    text:
      ru: notes
      cn: 笔记
    children: []
