  '[4]':
    ru: Здесь оканчиваются сказания о Павле, заключающиеся в Деяниях, дальнейшее – из других источников. – Примеч. ред.
    cn: 关于保罗的记述，收录于《使徒行传》的部分到此结束，接下来的内容则来源于其他文献。——编者注。
  '[5]':
    ru: Календами римляне называли первое число каждого месяца; предыдущий день, то есть последний день предыдущего месяца, назывался день перед календами; предпоследний же день предыдущего месяца назывался третьим днем перед календами. Итак, третий день перед календами июльскими был предпоследний, то есть 29?й день июня. – Примеч. ред.
    cn: 罗马人称每个月的第一天为卡连德；前一天，即上个月的最后一天，称为卡连德前一天；上个月的倒数第二天则称为卡连德前第三天。因此，七月卡连德前第三天是倒数第二天，即六月二十九日。– 编者注。
  '[6]':
    ru: 'На поле: освобождение Ангелом Петра из темницы.'
    cn: 画面：天使释放彼得于牢狱。
  '[7]':
    ru: 'Здесь опущено более половины шестнадцатой главы: повествование о Лидии, об исцелении отроковицы, одержимой духом пытливым, о заключении за это исцеление апостолов в темницу и Божественном освобождении их и об обращении к вере темничного стража. – Примеч. ред.'
    cn: 这里省略了第十六章超过一半的内容：关于吕底亚的记述，关于治愈那被探究之灵附着的使女，关于使徒们因这次治愈而被囚禁在监里并受神圣解救，以及那个狱卒归信。– 编者注。
  '[8]':
    ru: То есть восстав из мертвых. – Примеч. ред.
    cn: 即从死里复活。——编者注。
  '[9]':
    ru: То есть вознесшись на небо. – Примеч. ред.
    cn: 亦即升天。– 编者注。
  '[10]':
    ru: То есть не каждый день в продолжение сорока дней. – Примеч. ред.
    cn: 亦即，并非在四十天期间每天如此。——编者注
  '[11]':
    ru: 'То есть когда Иисус Христос говорил им: примите Духа Святаго (Ин. 20, 22) и т. д. – Примеч. ред.'
