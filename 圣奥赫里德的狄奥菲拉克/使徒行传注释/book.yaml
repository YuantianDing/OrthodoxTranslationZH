      ru: Введение[1].  Содержание книги Деяний святых апостолов
      cn: 引言[1]. 圣使徒行传的内容
  - type: paragraph
    text:
      ru: Книга эта называется «Деяния святых апостолов» потому, что содержит деяния всех апостолов. А лицо, повествующее об этих деяниях, есть евангелист Лука, написавший и эту книгу. Будучи родом антиохиянин, а по занятиям – врач, он сопутствовал прочим апостолам, особенно Павлу, и пишет о том, что знает вполне основательно. Повествует в этой книге также и о том, как вознесся на небо Господь при явлении Ангелов; повествует далее о сошествии Святаго Духа на апостолов и на всех, присутствовавших тогда, равно как об избрании Матфия вместо Иуды предателя, об избрании семи диаконов, обращении Павла и о том, что он претерпел. Кроме сего, повествует о том, какие чудеса сотворили апостолы с помощью молитвы и веры во Христа и о путешествии Павла в Рим. Итак, Лука излагает деяния апостолов и чудеса, совершенные ими. Описываемые же им чудеса следующие:1) Петр и Иоанн исцеляют именем Господним хромого от рождения, сидевшего при дверях,[2]называемых Красными. 2) Петр изобличает Ананию и жену его Сапфиру, утаивших часть из того, что они обещали Богу, и они тотчас умерли. 3) Петр подымает на ноги расслабленного Енея. 4) Петр в Иоппии молитвой воскрешает умершую Тавифу. 5) Петр видит сходящий с неба сосуд, наполненный животными всякого рода. 6) Петрова тень, падая на немощных, исцеляет их. 7) Петр, содержимый узником в темнице, освобождается Ангелом, так что стражи не видят этого, а Ирод, изъеденный червями, испускает дух. 8) Стефан творит знамения и чудеса. 9) Филипп в Самарии изгоняет многих духов и исцеляет хромых и расслабленных. 10) Павел, приближаясь к Дамаску, видит явление и тотчас становится проповедником Евангелия. 11) Тот же Филипп встречает на пути читающего евнуха и крестит его. 12) Павел в Листре именем Господним исцеляет хромого от рождения. 13) Павел видением призывается в Македонию. 14) Павел в Филиппах исцеляет женщину (отроковицу), одержимую духом пытливым. 15) Павел и Сила заключаются в темницу, и ноги их закрепляются в колодки; но среди ночи происходит землетрясение и узы их спадают. 16) На немощных и бесноватых возлагали убрусцы – опоясания – с тела Павла, и они исцелялись. 17) Павел в Троаде воскрешает упавшего с окна и умершего Евтиха, говоря:«Душа его в нем»(Деян. 20, 10). 18) Павел в Кипре осуждает волхва Елиму, и волхв этот становится слепым. 19) Павла и всех бывших с ним на корабле застигает на пути в Рим четырнадцатидневная буря. И когда все ожидали смерти, Ангел, явившись Павлу, сказал:«Вот, Бог даровал тебе всех плывущих с тобою»(Деян. 27, 24), – и все спаслись. 20) Когда сошел Павел с корабля,[3]его ужалила ехидна, и все думали, что он умрет. А так как он остался невредим, то сочли его за Бога. 21) Павел возложением рук исцеляет на острове отца начальника Поплия, страдавшего от дизентерии; врачует и многих других больных.
      cn: '这本书被称作《圣使徒行传》，因为它包含了所有使徒的事迹。而叙述这些事迹的人，乃是福音使徒路加，他也撰写了这本书。他是安提阿人，职业是一名医生，曾与其他使徒同行，尤其是与保罗同行，并以十分确凿的根据书写他所知道的。在这本书中，他还叙述了上主在天使显现之际如何升天；接着叙述了圣灵降临在使徒们身上以及降临在当时所有在场者身上；还有，叙述了选立马提亚代替卖主者犹大，选立七位执事，保罗的悔改以及他所遭受的苦难。除此之外，还叙述了使徒们借着祷告和对基督的信仰行了哪些奇迹，以及保罗前往罗马的旅程。因此，路加阐述了使徒的事迹以及他们所行的奇迹。他所描述的奇迹如下：


        1) 彼得和约翰奉上主的名，医治了生来瘸腿、坐在名为「美门」[2]旁的病人。

        2) 彼得指责了亚拿尼亚和他的妻子撒非喇，他们隐瞒了向 上帝许诺奉献的一部分财产，他们随即死去。

        3) 彼得使瘫痪的以尼雅起来。

        4) 彼得在约帕借着祷告使已故的大比大复活。

        5) 彼得看见一个从天降下的器皿，里面盛满了各种动物。

        6) 彼得的影子落在病人身上，就医治了他们。

        7) 彼得被囚禁在监牢里，被天使释放，以致看守的人看不见；而希律被虫子咬噬，气绝身亡。

        8) 司提反行了神迹和奇事。

        9) 腓利在撒玛利亚赶出了许多污灵，并医治了瘸腿的和瘫痪的人。

        10) 保罗在临近大马士革时，看见了异象，并随即成了福音的宣讲者。

        11) 同一位腓利在路上遇见了一位正在阅读的太监，并给他施洗。

        12) 保罗在路司得奉上主的名医治了生来瘸腿的人。

        13) 保罗借着异象被召请往马其顿。

        14) 保罗在腓立比医治了一位被探求之灵（占卜之灵）所附的妇女（少女）。

        15) 保罗和西拉被囚禁在监牢里，他们的双脚被上了木狗；但在半夜发生了地震，他们的锁链都脱落了。

        16) 在病人和被魔鬼附身的人身上，放置了从保罗身上取下的手巾和围裙，他们就得了医治。

        17) 保罗在特罗亚使从窗户上掉下去并死去的犹推古复活，说：「他的灵魂仍在他身上。」(使徒行传 20:10)

        18) 保罗在居比路斥责了术士以吕马，这术士就成了瞎子。

        19) 保罗和船上所有与他同行的人，在前往罗马的途中遭遇了十四天的风暴。当所有人都以为必死无疑时，天使向保罗显现，说：「看哪，上帝已将所有与你同船的人赐给了你。」(使徒行传 27:24) — 于是所有人都得救了。

        20) 当保罗下船后，[3]一条毒蛇咬了他，所有人都以为他会死去。但由于他安然无恙，众人便将他当作 上帝了。

        21) 保罗借着按手医治了在岛上患有痢疾的总督部百流的父亲；并医治了许多其他病人。'
  - type: paragraph
    text:
      ru: Путешествия святого апостола Павла
      cn: 圣使徒保罗的旅程
  - type: paragraph
    text:
      ru: Начал Павел путешествие из Дамаска и пришел в Иерусалим; отсюда отправился в Тарс, а из Тарса в Антиохию и потом снова в Иерусалим, и снова, во второй раз, в Антиохию; отсюда, будучи определен вместе с Варнавою на дело апостольства, прибыл в Селевкию, потом на Кипр, где и начал называться Павлом; далее отправился в Пергию, потом – в Антиохию Писидийскую, в Иконию, в Листру, в Дервию и Ликаонию, потом – в Памфилию, потом снова в Пергию, затем в Атталию, потом снова, в третий раз, в Антиохию Сирийскую, в третий раз – в Иерусалим по поводу обрезания, далее снова, в четвертый раз, прибыл в Антиохию, потом снова, вторично, в Дервию и Листру, затем во Фригию и страну Галатийскую, потом – в Мизию, потом – в Троаду и оттуда в Неаполь, далее – в Филиппы, город Македонский; потом, пройдя Амфиполь и Аполлонию, пришел в Фессалонику, потом – в Берию, в Афины, в Коринф, в Ефес, в Кесарию, потом, во второй раз, в Антиохию Писидийскую, потом в страну Галатийскую и во Фригию, потом снова, во второй раз, в Ефес; затем, пройдя Македонию, снова, во второй раз, прибыл в Филиппы и из Филипп – снова в Троаду, где и воскресил упавшего Евтиха.Потом прибыл в Ассон, потом – в Митилену; потом пристал к берегу против Хия; затем прибыл в Самос и оттуда в Мелит, куда призвал ефесских пресвитеров и беседовал с ними; потом отправился в Кон (Коос), потом – в Родос, отсюда – в Патару, потом – в Тир, в Птолемаиду и отсюда в Кесарию, откуда снова, в четвертый раз, возвратился в Иерусалим.Из Иерусалима послан был в Кесарию и, наконец, быв отправлен узником в Рим, прибыл таким образом из Кесарии в Сидон, потом – в Миры Ликийские, потом – в Книд и отсюда, после многих лишений, прибыл на остров, на котором его ужалила ехидна; потом направился в Сиракузы, затем – в Ригию Калабрийскую, потом в Потиолы и отсюда уже пешком пришел в Рим. Здесь, у Аппиева торжища и трех корчемниц, встретили его верующие. Прибыв таким образом в Рим, он учил здесь достаточное время[4]и, наконец, в самом же Риме принял мученическую смерть после доброго подвига, которым подвизался здесь. Римляне же на останках его воздвигли прекрасное здание и базилику, ежегодно празднуя день памяти его в третий день перед июльскими календами.[5]И прежде этот блаженный муж много преподал советов относительно честности жизни и добродетели, дал также много и практических наставлений; притом же, что особенно важно, в своих четырнадцати посланиях он изложил все правила жизни человека.
      cn: '保罗从大马士革开始旅程，抵达耶路撒冷；从那里启程往大数，又从大数往安提阿，然后再次回到耶路撒冷，又再次，是第二次，前往安提阿；从那里，他与巴拿巴一同被拣选承担使徒的事工，抵达西流基，然后前往塞浦路斯，在那里他开始被称为保罗；接着他前往别加，然后是彼西底的安提阿，以哥念，路司得，特庇和吕高尼，然后是旁非利亚，然后又回到别加，再到亚大利，然后再次，是第三次，来到叙利亚的安提阿，第三次因割礼问题前往耶路撒冷，之后再次，是第四次，抵达安提阿，然后又再次，是第二次，前往特庇和路司得，接着是弗吕家和加拉太地区，然后是每西亚，然后是特罗亚，从那里到尼亚波利，接着是马其顿的腓立比城；然后，经过暗非波利和亚波罗尼亚，来到帖撒罗尼迦，然后是庇哩亚，雅典，哥林多，以弗所，凯撒利亚，然后是第二次，前往彼西底的安提阿，然后是加拉太地区和弗吕家，然后又再次，是第二次，前往以弗所；接着，经过马其顿，又再次，是第二次，抵达腓立比，并从腓立比再次前往特罗亚，在那里他使跌落的犹推古复活。


        然后抵达亚朔，然后是米推利尼；然后靠岸在基阿对面；接着抵达撒摩，又从那里前往米利都，他召集了以弗所的长老们，并与他们交谈；然后前往哥士（科斯），然后是罗得，从那里前往帕大喇，然后是推罗，多利买，又从那里前往凯撒利亚，从那里又再次，是第四次，返回耶路撒冷。


        他从耶路撒冷被送往凯撒利亚，最终作为囚犯被送往罗马，于是他从凯撒利亚抵达西顿，然后是吕家的每拉，然后是革尼土，又从那里，在经历许多艰难之后，抵达了一个岛屿，在那里他被一条毒蛇咬伤；然后前往叙拉古，接着是卡拉布里亚的利基翁，然后是部提奥利，又从那里，步行抵达罗马。在这里，在亚比乌市集和三馆客店，信徒们迎接了他。他就这样抵达罗马，在那里教导了相当长的一段时间[4]，最终，就在罗马城，他以殉道者的身份受死，完成了他在那里所奋斗的美好善工。罗马人则在他的遗骸上修建了一座宏伟的建筑和一座大殿，每年在七月朔望节前的第三天庆祝他的纪念日。[5]


        早在之前，这位蒙福的圣徒就已经传授了许多关于正直生活和美德的建议，也给予了许多实际的教诲；此外，尤其重要的是，在他的十四封书信中，他阐述了人类生活的所有准则。'
  - type: paragraph
    text:
      ru: Главные предметы книги Деяний святых апостолов
      cn: 圣使徒行传的主要主题
  - type: paragraph
    text:
      ru: Об учении Христовом после воскресения, о явлении Его ученикам и обетовании им дара Духа Святаго, о виде и образе вознесения Господа и о славном втором Его пришествии. Речь Петра к ученикам о смерти и отвержении Иуды предателя. О Божественном сошествии Святаго Духа на верующих в день Пятидесятницы. Об исцелении именем Христовым хромого от рождения; сделанное по этому поводу Петром благосклонное, увещательное и располагающее к спасению назидание. О единодушном и всецелом общении верующих. О том, как заключенных в темницу апостолов вывел из нее ночью Ангел Божий, заповедав им проповедовать невозбранно Иисуса. Об избрании и посвящении семи диаконов. Восстание и клеветы иудеев против Стефана; его речь о завете Бога с Авраамом и о двенадцати патриархах. О гонении наЦерковьи о смерти Стефана. Об уверовавшем и крестившемся со многими другими волхве Симоне. О том, что дар Духа Святаго сообщается не за серебро и не лицемерам, но верующим по вере их. О том, что Бог ущедряет спасение людям добрым и верным, как это видно из примера евнуха. О Божественном с неба призвании Павла на дело апостольства Христова. О расслабленном Енее, исцеленном в Лидде Петром. О том, как явился Корнилию Ангел и как снова было с неба воззвание Петру. О том, как Петр, осуждаемый апостолами за общение с необрезанными, рассказывает им по порядку все, что случилось, и как тогда же посылает Варнаву к братиям, бывшим в Антиохии. Пророчество Агава о голоде, имевшем быть по всей вселенной, и помощь, оказанная антиохийскими верующими братиям в Иудее. Убиение апостола Иакова[6]здесь же о наказании стражей и о горькой и гибельной смерти нечестивого Ирода. О Варнаве и Савле, посланных Божественным Духом в Кипр, и о том, что сделали они именем Христовым с волхвом Елимою. Богатое назидание Павлове о Христе на основании закона и пророков, с историческими и евангельскими характеристиками. О том, как, проповедуя Христа в Иконии, апостолы были изгнаны оттуда после того, как многие уверовали. Об исцелении апостолами в Листре хромого от рождения; вследствие чего они приняты были жителями за сошедших к ним богов; Павла побивают камнями. О том, что не должно обрезывать обращавшихся язычников; рассуждения и постановление апостолов. О наставлении Тимофея и об откровении Павлу отправиться в Македонию.[7]О возмущении, происшедшем в Фессалонике вследствие евангельской проповеди, и о бегстве Павла в Берию и оттуда – в Афины. О надписи на жертвеннике в Афинах и о мудрой проповеди Павла. Об Акиле и Прискилле, о скором уверовании коринфян и о бывшем по предведению благоволении Божием к ним, что сообщено было Павлу чрез откровение. О крещении уверовавших в Ефесе, о сообщении им дара Духа Святаго по молитве Павла и о совершенных Павлом исцелениях. О смерти и воззвании к жизни Евтиха молитвой Павла в Троаде; пастырское увещание пресвитерам ефесским. Пророчество Агава о том, что имеет случиться с Павлом в Иерусалиме. Иаков увещевает Павла не запрещать евреям обрезываться. О возбужденном в Иерусалиме возмущении против Павла и о том, как тысяченачальник отнял его из рук толпы. О том, что перенес Павел, явившись в синедрион, что говорил и что сделал. О злодеяниях, какие замышляли иудеи против Павла, и об их доносе на него Лисию. Об обвинении Павла Тертиллом перед игемоном и об его оправдании. О преемнике Феликса Фисте и образе действий последнего. Прибытие Агриппы и Вереники и сообщение им сведений о Павле. Исполненное весьма многих и весьма великих опасностей морское путешествие Павла в Рим. О том, как Павел прибыл в Рим из Мелита. О беседе Павла с иудеями, бывшими в Риме.
      cn: 关于基督复活后的教训，关于祂向门徒的显现，以及应许他们圣灵的恩赐，关于上主升天的景象与方式，以及祂荣耀的第二次降临。彼得对门徒的讲话，关于叛徒犹大的死与被弃。关于圣灵在五旬节神圣降临于信徒。关于奉基督之名治愈生来瘸腿之人；彼得为此所作的善意、劝诫并引人归向救恩的训诲。关于信徒的一心一意和完全共融。关于被囚禁的使徒如何被上帝的使者在夜间从监狱中领出，嘱咐他们毫无阻碍地宣讲耶稣。关于七位执事的拣选和祝圣。犹太人反抗并诽谤司提反；他关于上帝与亚伯拉罕所立之约以及十二位宗主教的讲话。关于对教会的迫害以及司提反的死。关于与许多其他人一同相信并受洗的术士西门。关于圣灵的恩赐不是用银子买来的，也不是赐予假冒为善之人，而是按着信徒的信心赐予他们。关于上帝慷慨地赐予良善忠信之人以救恩，正如太监的例子所表明的。关于保罗从天上受到的神圣呼召，承担基督的使徒职分。关于彼得在吕大治愈了瘫痪的埃涅阿斯。关于天使如何向哥尼流显现，以及彼得如何再次从天上得到召唤。关于彼得因与未受割礼之人交往而被使徒们谴责，他便按次序向他们讲述所发生的一切，以及他如何立即差派巴拿巴前往安提阿的弟兄们那里。亚迦布预言普天下将要发生饥荒，以及安提阿的信徒们如何援助犹大的弟兄们。使徒雅各的被杀害[6]；同时提到看守者的受惩罚，以及邪恶的希律王痛苦而毁灭性的死亡。关于巴拿巴和扫罗被神圣的圣灵差派到塞浦路斯，以及他们奉基督之名对术士以吕马所行的事。保罗基于律法和先知书所作的关于基督的丰富训诲，具有历史和福音的特征。关于使徒们如何在以哥念宣讲基督，许多人相信之后，使徒们便被从那里赶走。关于使徒们在路司得治愈了生来瘸腿之人；因此他们被当地居民当作降临的众神；保罗被石头打。关于归信的外邦人不必受割礼；使徒们的讨论和决议。关于提摩太受到的训示，以及保罗受启示前往马其顿[7]。关于因福音宣讲而在帖撒罗尼迦发生的骚乱，以及保罗逃往庇哩亚，再从那里前往雅典。关于雅典祭坛上的碑文，以及保罗智慧的宣讲。关于亚居拉和百基拉，关于哥林多人的迅速相信，以及上帝预先知道并对他们施予的恩惠，这事是借着启示告知保罗的。关于在以弗所相信之人的受洗，关于保罗祷告后他们领受了圣灵的恩赐，以及保罗所行的医治。关于保罗在特罗亚祷告后，犹推古的死亡与复生；针对以弗所长老们的牧者劝诫。亚迦布关于保罗在耶路撒冷将要遭遇之事的预言。雅各劝诫保罗不要禁止犹太人受割礼。关于在耶路撒冷煽动起来针对保罗的骚乱，以及千夫长如何将他从暴民手中夺走。关于保罗在公会中忍受的苦难，他所说所行的事。关于犹太人图谋针对保罗的恶行，以及他们向吕西亚斯告发他。关于特土罗在总督面前对保罗的控告，以及他的开脱。关于腓力斯的继任者非斯都，以及非斯都的行事方式。亚基帕和百妮基的到来，以及向他们传达关于保罗的消息。保罗前往罗马的海上旅程，充满了许多极大的危险。关于保罗如何从米利大抵达罗马。关于保罗与在罗马的犹太人的交谈。
  - type: paragraph
    text:
      ru: Святого отца нашего Иоанна, архиепископа Константинопольского, Златоустого, предуведомление к Деяниям святых апостолов
      cn: 我们圣父约翰，君士坦丁堡大主教，金口，致圣使徒行传的导言
  - type: paragraph
    text:
      ru: 'Многим, а не одному кому-нибудь, не были известны ни сама книга, ни тот, кто составил и написал ее. Посему я признал необходимым приняться за это толкование с целью и научить незнающих, и не допустить, чтобы такое сокровище было неизвестно и скрывалось под спудом, потому что не меньше, чем сами Евангелия, может доставить нам пользы проникновение таким любомудрием и таким правым учением и особенно тем, что совершено Духом Святым. Итак, не будем опускать из внимания этой книги, напротив, со всевозможным тщанием изучим ее, потому что в ней можно видеть исполнившимися на самом деле те предсказания Христовы, какие заключаются в Евангелиях; в ней можно видеть также истину, блистающую в самих делах, и большую перемену к лучшему в учениках, произведенную над ними Духом Святым. В ней можно найти догматы, которые никем не были бы так ясно понимаемы, если бы не было этой книги; без нее сущность нашего спасения осталась бы сокровенной и некоторые из догматов учения и из правил жизни остались бы неизвестными. Но большую часть содержания этой книги составляют деяния апостола Павла, более всех потрудившегося. Причиной этого было и то, что писатель этой книги, блаженный Лука, был учеником Павла. Его любовь к учителю видна и из многого другого но в особенности из того, что он неотлучно был при своем учителе и постоянно следовал за ним, тогда как Димас и Гермоген оставили его: один отправился в Галатию, другой – в Далматию. Послушай, что говорит о Луке сам Павел:«Один Лука со мною»(2Тим. 4, 10); и, в Послании к Коринфянам, говорит о нем:«Послали… брата, во всех церквах похваляемого за благовествование»(2Кор. 8, 18); также, когда говорит, что«явился Кифе, потом двенадцати; напоминаю… Евангелие, которое я благовествовал вам, которое вы и приняли»(1Кор. 15, 1, 5), разумеет его Евангелие; так что никто не погрешит, если этот труд Луки (книгу Деяний святых апостолов) будет относить к Нему; говоря «к Нему», я разумею Христа. Если же кто скажет: «Почему же Лука, находясь при Павле до конца жизни, описал не все?» – то мы ответим, что для ревнующих достаточно было и этого, что он всегда останавливался на том, что особенно нужно, и что преимущественная забота апостолов заключалась не в писании книг, так как многое передали они и без писания. Но все, что содержится в этой книге, достойно удивления, особенно же приспособительность апостолов, которую Дух Святый внушил им, приготовляя их к делу домостроительства. Поэтому, рассказывая о Христе так много, они немного говорили об Его Божестве, а более об Его вочеловечении, Его страданиях, воскресении и вознесении. Ибо цель, к которой они стремились, заключалась в том, чтобы заставить слушателей уверовать, что Он воскрес и вознесся на небеса. Как Сам Христос более всего старался доказать, что Он от Отца пришел, так и Павел более всего старался доказать, что Христос воскрес, вознесся, отошел к Отцу и от Него приходил. Ибо если прежде иудеи не поверили тому, что Он от Отца пришел, то гораздо более невероятным казалось им все учение Христово после того, как к нему прибавилось сказание о воскресении и вознесении Его на небеса. Поэтому Павел незаметно, мало-помалу, доводит их до понимания более возвышенных истин; а в Афинах Павел называет Христа даже просто человеком, не прибавив более ничего, и это не без цели, потому что если Самого Христа, когда Он говорил о Своем равенстве со Отцом, часто покушались побить камнями и называли за это хулителем Бога, то с трудом могли принять учение это от рыбаков, и притом после распятия Его на кресте. И что говорить об иудеях, когда и сами ученики Христовы, слушая учение о предметах более возвышенных, смущались и соблазнялись? Поэтому Христос и говорил:«Еще многое имею сказать вам; но вы теперь не можете вместить»(Ин. 16, 12). Если же они не могли"вместить", они, которые были с Ним столько времени, которые посвящены были в столь многие тайны и видели столько чудес, то каким образом язычники, отказавшись от жертвенников, от идолов, от жертв, от кошек и крокодилов (потому что в этом состояла языческая религия) и от других нечестивых обрядов, вдруг могли принять возвышенное слово о догматах христианских? Каким образом и иудеи, ежедневно читавшие и слышавшие следующее изречение из закона:«Слушай, Израиль: Господь Бог наш, Господь един есть»(Втор. 6, 4), Я и нет Бога, кроме Меня» (Втор. 32, 39), и при этом видевшие Христа распятым на кресте, а главное – распявшие Его и положившие во гроб и не видевшие Его воскресения, – каким образом эти люди, слыша, что этот Самый муж есть Бог и равен Отцу, могли не смутиться и не отпасть совершенно, и притом скорее и легче всех? Поэтому апостолы постепенно и незаметно подготовляют их и являют большое искусство приспосабливаться, а сами получают более обильную благодать Духа и именем Христовым творят большие чудеса, чем какие совершены Самим Христом, чтобы тем и другим способом поднять их, распростертых на земле, и пробудить в них веру в слово о воскресении. И потому книга эта есть по преимуществу доказательство воскресения, потому что по уверовании в воскресение удобно воспринималось и все остальное. И всякий, основательно изучивший эту книгу, скажет, что по преимуществу в этом заключается ее содержание и вся ее цель. Выслушаем же сперва самое начало ее.'
      cn: '对许多人而非仅对某一人而言，无论是这本书本身，还是它的编纂者和作者，都是不为人知的。因此，我认为有必要着手这项注释工作，目的是教导那些不了解的人，不让这样的宝藏不为人知并被掩藏起来，因为领悟如此的爱智与纯正教义，特别是那由圣灵所成就的一切，所能带给我们的益处，绝不亚于福音书本身。因此，我们不要忽视这本书，相反，要尽一切可能认真研读它，因为在这本书中，人们可以看到福音书中所包含的那些基督的预言真正地得以实现；在这本书中，人们也可以看到真理在实际行动中闪耀，以及门徒们在圣灵的引领下所产生的巨大向好转变。在其中可以找到一些教义，若没有这本书，这些教义就不会被任何人如此清晰地理解；没有它，我们救赎的精髓就会隐藏不现，一些教义和生活准则也会不为人知。然而，这本书的大部分内容是关于使徒保罗的事迹，他是劳苦最多的一位。其原因在于，这本书的作者，蒙福的卢卡，是保罗的门徒。他对老师的爱，从许多其他方面也可见一斑，但尤其体现在他与老师形影不离，并且持续跟随他，而底马和赫摩根却离开了保罗：一个去了加拉太，另一个去了达马提亚。请听保罗自己如何论及卢卡：「只有卢卡在我这里」（提摩太后书 4:10）；在致哥林多人的书信中，保罗论及他时说：「我们派了……这位弟兄，他在各教会因着福音广受称赞」（哥林多后书 8:18）；同样，当保罗说：「基督显现给矶法看，然后是十二使徒；我要提醒你们……我传给你们的福音，你们也接受了」（哥林多前书 15:1，5）时，他指的是卢卡的福音书；因此，如果有人将卢卡的这项工作（《圣使徒行传》）归于祂，那他便没有错；我说「归于祂」，指的是基督。如果有人说：「为何卢卡与保罗相伴至生命尽头，却没有记述所有事迹？」那么我们回答说，对于热心的人来说，这些已足够了，因为他总是侧重于那些特别重要的，而且使徒们最主要的关切并非著书立说，因为他们也在没有写作的情况下传达了许多事物。但这本书中所有内容都令人惊叹，特别是使徒们的适应性，那是圣灵为了预备他们承担救世的圣工而启发他们的。


        因此，当他们如此详细地讲述基督时，他们很少提及祂的神性，更多地是关于祂的道成肉身、祂的受难、复活和升天。因为他们所追求的目标，在于使听者相信祂已经复活并升入天堂。正如基督自己最努力证明祂是从父而来，保罗也最努力证明基督已经复活、升天、归到父那里去，并且是从父而来。因为，如果犹太人以前不相信祂是从父而来，那么在基督的教导中又加上祂复活和升天的记载后，所有关于基督的教义对他们来说就显得更加不可思议了。


        因此，保罗悄无声息地，一点一点地，引导他们理解更高深的真理；而在雅典，保罗甚至只是称基督为人，没有再添其他，这并非没有目的，因为如果基督自己论及祂与父平等时，人们常常试图用石头砸祂，并因此称祂为亵渎上帝者，那么在祂被钉十字架之后，他们就更难以接受来自渔夫的这一教导了。当基督自己的门徒，在聆听更高深道理时，尚且感到困惑和跌倒，更何况犹太人呢？因此基督也曾说：「我还有许多事要告诉你们，但你们现在担当不了」（约翰福音 16:12）。如果连他们——那些与祂相处如此之久，被启示了如此多奥秘，并目睹了如此多奇迹的人——都不能「担当」，那么外邦人又怎能突然放弃祭坛、偶像、献祭、猫和鳄鱼（因为异教信仰就包含这些），以及其他不敬虔的仪式，而接受关于基督教教义的崇高话语呢？那么犹太人又怎能呢？他们每天诵读并聆听律法中的以下箴言：「以色列啊，你要听！上主是我们的上帝，上主是独一的」（申命记 6:4），「我是，除我以外并无上帝」（申命记 32:39），同时他们又亲眼看到基督被钉在十字架上，更重要的是，他们是亲手将祂钉死并安葬在坟墓里，却未曾目睹祂的复活——这些人在听到这同一位男子就是上帝，并且与父平等时，又怎能不感到困惑，不完全跌倒，而且比所有人都更快、更容易地跌倒呢？因此，使徒们逐渐而悄无声息地预备他们，并展现出极大的适应技巧，而他们自己也领受了圣灵更丰盛的恩典，奉基督之名行了比基督自己所行的更大的神迹，以便通过这两种方式，扶起那些匍匐在地的人，并在他们心中唤起对复活之道的信仰。因此，这本书最主要的是复活的证明，因为一旦相信了复活，其他的一切就容易被接受了。凡是深入研读过这本书的人都会说，它的内容和全部目的主要就在于此。那么，我们首先来听听它的开头吧。'
