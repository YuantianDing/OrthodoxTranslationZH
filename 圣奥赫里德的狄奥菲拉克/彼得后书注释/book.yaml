  - type: paragraph
    text:
      ru: Оглавление второго послания святого апостола Петра
      cn: 圣使徒彼得第二书信目录
  - type: paragraph
    text:
      ru: О призвании в вере, утверждаемом делами добродетели, и о надежде будущих благ.  – Увещание помнить учение после смерти его и о том, что он на горе Фаворе слышал глас Божий о Христе.  – Предсказание о том, что явятся еретики обольстители, об их нечестии и будущем наказании. – Повторение о злобе еретиков; здесь же о том, что Христос внезапно придет при кончине века сего и что посему должно украшать себя всякой добродетелью.
      cn: 关于信仰中的蒙召，藉善行所确立，以及对未来福乐的盼望。— 劝勉在他去世后仍要记念他的教导，以及关于他在他泊山上听见了上帝论及基督的声音。— 预言诱惑人的异端将要出现，关于他们的不敬虔以及未来的刑罚。— 再次论及异端的邪恶；在此也论及基督将在这世代末期忽然降临，因此人当以各样美德来装饰自己。
  - type: paragraph
    text:
      ru: Содержание второго послания святого апостола Петра
      cn: 圣使徒彼得第二书信的内容
  - type: paragraph
    text:
      ru: И это послание пишет апостол Петр к тем, которые уже уверовали. Он напоминает о том, что прежде писано. Зная, что скоро разрешится от тела, апостол старался всем напомнить то учение, которым они были оглашены. И во-первых, говорит о вере, показывая, что она возвещена пророками, и что пророчества, относящиеся ко Спасителю, изрекаемы были не человеками, но Богом. Потом, убеждает не внимать обольстителям, говоря, что они погибнут, как случилось это и с согрешившими ангелами. Предсказывает, что придет время, когда ругатели будут обходить всюду и стараться обольстить некоторых, говоря, что мы напрасно проповедуем второе пришествие Спасителя, потому что всегда говорим об этом, а Он все еще не пришел. Таковых в особенности заповедует удаляться, и учит не унывать по случаю медлительности; ибо все время пред Господом ничто, потому что у Него«один день, как тысяча лет, и тысяча лет, как один день»(2Петр. 3, 8). Впрочем, утверждает и доказывает, что день Господень придет скоро, и заповедует всем быть готовыми к нему добрыми делами и любить писания апостола Павла, а не внимать тем, которые извращают их, потому что они извращают и все Священное Писание. Напомнив это и научив всех заботиться о своих делах, убеждает не отпадать от цели веры, и таким образом оканчивает послание.
      cn: 这封书信是使徒彼得写给那些已经相信的人的。他提醒他们之前所写下的事。知道自己很快将解脱肉身，使徒努力提醒所有人他们曾领受过的教诲。首先，他谈到信仰，表明这信仰是先知所宣扬的，并且那些关乎救主的预言并非由人所说出，而是由上帝所说出。接着，他劝诫不要听从诱惑者，说他们将灭亡，正如那些犯罪的天使所遭遇的一样。他预言会有时候，亵渎者将到处游走，并试图诱惑一些人，说我们徒然地宣讲救主的第二次降临，因为我们总是谈论此事，而祂却仍未降临。对于这样的人，他特别吩咐要远离，并教导不要因耽延而灰心；因为在主面前，所有时间都微不足道，因为在祂那里，「一日如千年，千年如一日」（2彼路得记 3:8）。然而，他确认并证明主的日子将很快降临，并吩咐所有人要藉着善行为此做好准备，并要爱使徒保罗的书信，而不要听从那些歪曲书信的人，因为他们也歪曲了所有圣经。提醒了这些事，并教导所有人要顾好自己的事务，他劝诫不要偏离信仰的目标，并以此结束了这封书信。
- type: heading1
  text:
    ru: Феофилакт БолгарскийТолкование на 2-е послание святого апостола Петра
    cn: 圣奥赫里德的狄奥菲拉克《彼得后书注释》
  children: []
- type: heading1
  text:
    ru: Глава первая
    cn: 第一章
  children:
  - type: paragraph
    text:
      ru: '2Пет.1:1.Симон Петр, раб и Апостол Иисуса Христа, принявшим с нами равно драгоценную веру по правде Бога нашего и Спасителя Иисуса Христа:'
      cn: 彼得后书 1:1. 西门·彼得，耶稣基督的仆人与使徒，写信给那些因我们上帝和救主耶稣基督的公义，得与我们同受同样宝贵信心的人：
  - type: paragraph
    text:
      ru: Симон есть сокращенное имя Симеона, как и Митр – Митродора, Мина – Минодора, Февда – Феодосия. С самого начала апостол пробуждает помыслы и души верующих, побуждая их стараться в деле проповеди равняться апостолам. Ибо тогда, как все получили равно драгоценную благодать, несправедливо было бы иметь недостаток в чем-нибудь таком, в чем все оказались равными. Апостол постоянно желает верующим мира, который дал им Христос по воскресении Своем из мертвых и при отхождении к Отцу, взывая:"мир вам"(Ин. 20, 19, 21, 26;Лк. 24, 36). И в церкви мы молим Господа, чтобы дал нам «ангела мирна»,  и священник от святого жертвенника подает народу «мир»; потому что мир есть мать всяких благ. Поэтому и Господь заповедал ученикам Своим, чтобы они при входе в дома прежде всего подавали"мир"(Мф. 10, 12;Лк. 10, 5).
      cn: 西蒙是西缅的缩写，就像米特是米特罗多的缩写，米那 是 米诺多的缩写，忒弗达 是 狄奥多西的缩写。从一开始，使徒就唤醒信徒的思虑与灵魂，敦促他们努力在传道事工上与使徒看齐。因为既然所有人都领受了同样宝贵的恩典，那么，在所有人都平等的某方面却有所欠缺，就是不公的。使徒不断地祝愿信徒得享平安，这平安是基督在祂从死里复活并升到父那里时赐予他们的，祂曾呼唤说：「愿你们平安！」（约翰福音 20:19，21，26，路加福音 24:36）。在教会中，我们祈求上主赐予我们「和平的天使」，并且司祭从圣祭坛赐予民众「平安」；因为平安是万福之母。因此，上主也曾吩咐祂的门徒，当他们进入家宅时，首先要赐予「平安」（马太福音 10:12，路加福音 10:5）。
  - type: paragraph
    text:
      ru: 2Пет.1:2.благодать и мир вам да умножится в познании Бога и Христа Иисуса, Господа нашего.
      cn: (彼得后书 1:2) 愿恩典与平安，在你们认识上帝和基督耶稣，我们的主中，丰盛地加给你们。
  - type: paragraph
    text:
      ru: 'Связь такая: вам, которые в познании Бога и Христа Иисуса, Господа нашего, приняли с нами равно драгоценную веру, по правде Бога нашего, благодать и мир да умножатся.'
      cn: 此相通如此：致你们这些，在认识上帝和我们的主基督耶稣中，与我们一同领受了同样贵重信仰的人。愿恩典与平安，按照我们上帝的公义，丰盛地加增给你们。
  - type: paragraph
    text:
      ru: 2Пет.1:3.Как от Божественной силы Его даровано нам все потребное для жизни и благочестия, через познание Призвавшего нас славою и благостью,
      cn: 彼得后书 1:3. 因他神圣的能力，已将一切关乎生命和虔敬的事物赐给我们，借着认识那以荣耀和美善召我们的。
  - type: paragraph
    text:
      ru: 2Пет.1:4.которыми дарованы нам великие и драгоценные обетования,
      cn: (彼得后书 1:4) 借此，祂已将伟大而宝贵的应许赐予我们，
  - type: paragraph
    text:
      ru: 'Связь такая: да умножатся вам благодать и мир, так как все, потребное для жизни и благочестия, в познании Бога и Господа нашего Иисуса, Его божественной силой, этой благодатью, даровано вам для познания славы и добродетели, за которые дарованы величайшие обетования, дабы вы, удалясь от мирского растления, совершающегося чрез похоть, сделались причастниками Божественного естества. Иначе. Изложение растянуто, но мысль такая: силой Христовой получив бесчисленные блага, мы можем и сделаться причастниками Божественного естества и достигнуть жизни и благочестия; посему должны жить так, чтобы к вере присовокупить добродетель и чрез добродетель преуспевать в благочестии, доколе достигнем совершеннейшего блага, которое есть любовь. Причастниками же Божественного естества мы сделались чрез явление Господа и Бога, Который начаток нашего естества соединил в Самом Себе и чрез восприятие освятил; если же начаток свят, то и целое свято.'
      cn: '其关联如下：愿恩典与平安多多加给你们，因为一切关乎生命与虔敬所需用的，都在认识上帝和我们的主耶稣中。借着祂神圣的能力，这恩典已赐给你们，使你们得认识祂的荣耀和美德；为了这荣耀和美德，已赐下了最伟大的应许，好叫你们既脱离世上从情欲来的败坏，就得与上帝的性情有份。

        换言之。论述虽长，但其思想是：借着基督的能力，我们得了无数的恩惠，得以与上帝的性情有份，并达到生命和虔敬；因此，我们当如此生活：在信心之外，还要加上美德，并借着美德，在虔敬中长进，直到我们达到那最完全的善，就是爱。

        我们之所以与上帝的性情有份，乃是借着主与上帝的显现，祂将我们性情的初熟之果联合于祂自身，并借着取受而将其分别为圣；既然初熟之果是圣的，那么整体也必是圣的。'
  - type: paragraph
    text:
      ru: 'дабы вы через них соделались причастниками Божеского естества, удалившись от господствующего в мире растления похотью:'
      cn: 使你们藉着这些得以分享神性，远离世上因情欲而盛行的败坏：
  - type: paragraph
    text:
      ru: 'Связь такая: чтобы вы, освободившись от мирского растления, совершающегося в плотской похоти, сделались причастниками Божеского естества, ибо«удалившись»значит то же, что «освободившись». Следствие мирской похоти называет«растлением»  потому, что она слагается и вращается около предметов растленных.'
      cn: 这种关联在于：你们既从那在肉体情欲中进行的世俗败坏中解脱出来，得以成为上帝性情的分享者，因为「远离」之意即是「解脱」。他将世俗情欲的后果称为「败坏」，因为它（指世俗情欲）是由败坏的事物构成并围绕着它们运转的。
  - type: paragraph
    text:
      ru: 2Пет.1:5.то вы, прилагая к сему все старание, покажите в вере вашей добродетель, в добродетели рассудительность,
      cn: 彼得后书 1:5. 为此，你们自己也要竭尽全力，在你们的信德上加添德行，在德行上加添见识，
  - type: paragraph
    text:
      ru: 2Пет.1:6.в рассудительности воздержание, в воздержании терпение, в терпении благочестие,
      cn: 彼得后书 1:6. 在明辨中节制，在节制中忍耐，在忍耐中虔敬，
  - type: paragraph
    text:
      ru: 2Пет.1:7.в благочестии братолюбие, в братолюбии любовь.
      cn: （彼得后书 1:7）在敬虔中，要加上弟兄友爱；在弟兄友爱中，要加上爱。
  - type: paragraph
    text:
      ru: 'Показывает степени преуспеяния. На первом местевера, так как она есть основание и опора добра. На втором местедобродетель, то есть дела, ибо без них, как говорит апостол Иаков:«вера мертва»(Иак. 2, 26). Далеерассудителъность. Какая же рассудительность? Знание сокровенных тайн Божиих, которое доступно не для всякого, но для того только, кто постоянно упражняется в добрых делах. Затемвоздержание. Ибо и оно нужно достигшему до означенной меры, чтобы не возгордился величием дара. А как при кратковременном воздержании нельзя упрочить за собой дар (ибо страсти, несмотря на сдерживающую их свободу, всегда любят стремиться к худшему), то должно превзойти терпение. Оно произведет все, иблагочестиеумиротворит, и упование на Бога усовершит. К благочестию присоединитсябратолюбие, а к всему этомулюбовь, которую апостол Павел называет«совокупностьюсовершенства»(Кол. 3, 14). Ибо любовь явила силу свою и над Сыном Божиим и над Отцом Его: Отца расположила отдать Возлюбленного Своего (Ин. 3, 16), а Сына пролить Кровь Свою за нас (1Ин. 3, 16).'
      cn: '此文展现了灵性长进的阶梯：


        首要的是信德，因为它乃是良善的基础与支柱。


        其次是美德，亦即善行，因为没有它们，正如使徒雅各伯所言：「信德是死的」（雅各书 2:26）。


        接着是明辨。何谓明辨？乃是对上帝隐秘奥秘的认识，这并非人人可得，唯有那恒常操练善行者方能企及。


        再者是节制。因为对于已达此境界者，节制亦属必要，以免因恩赐之宏大而生骄傲。然而，短暂的节制无法使恩赐稳固（因为情欲，虽受自由意志约束，却总喜趋向更糟），因此必须超越而达至忍耐。忍耐将成就一切，使虔敬得享平安，并使对上帝的仰望臻于完善。


        在虔敬之外，将加上弟兄之爱；而在此所有一切之上，则是爱，使徒保罗称之为「全德的联络」（歌罗西书 3:14）。因为爱彰显了祂在上帝之子及祂的父之上所拥有的能力：爱促使父赐下祂的爱子（约翰福音 3:16），并促使子为我们倾流祂的宝血（约翰一书 3:16）。'
  - type: paragraph
    text:
      ru: 2Пет.1:8.Если это в вас есть и умножается, то вы не останетесь без успеха и плода в познании Господа нашего Иисуса Христа.
      cn: 彼得后书 1:8. 如果这些在你们里面有并且增长，那么你们在认识我们的主耶稣基督上，就必不至于徒然，也不至于不结果子。
  - type: paragraph
    text:
      ru: Что –"это"? Вера, добродетель, знание, воздержание, терпение, благочестие, братолюбие, любовь, которые должны не только быть, но и умножаться. Ибо если полезно приобретение их, то гораздо полезнее приумножение. Какая же польза от них? Та, что имеющий их безопасен во второе пришествие Господа. Ибо кто не имеет их, с тем последует слепота, когда Судия придет во славе и облистает как солнце; если же зрение и уцелеет как-нибудь, то оно не сможет безвредно смотреть на безмерный блеск, ибо чрезмерный блеск света обыкновенно помрачает слабый глаз, смотрящий на него.
      cn: 「这」是什么？信德、德行、知识、节制、忍耐、虔敬、弟兄之爱、爱，这些不仅应当存在，更当增多。因为如果获取它们是有益的，那么使它们增多则更有益处。它们有什么益处呢？那就是，拥有它们的人，在上主第二次降临时是平安稳妥的。因为，凡没有它们的人，当审判者驾着荣耀降临并如太阳般闪耀光芒时，必将伴随着盲目；并且，即使视力侥幸得以保全，也无法无碍地注视那无限的光辉，因为光的过分耀眼，通常会使看着它的微弱眼睛变得昏暗。
  - type: paragraph
    text:
      ru: 2Пет.1:9.А в ком нет сего, тот слеп, закрыл глаза, забыл об очищении прежних грехов своих.
      cn: （彼得后书 1:9）凡没有这些的，就是瞎眼的，看不清远处的，忘记了自己往昔罪恶的洁净。
  - type: paragraph
    text:
      ru: 2Пет.1:10.Посему, братия, более и более старайтесь делать твердым ваше звание и избрание;
      cn: (彼得后书 1:10) 所以，弟兄们，更当殷勤，使你们的蒙召和拣选坚定不移；
  - type: paragraph
    text:
      ru: Слеп (μυωπάζων). Выражение это подразумевает мышей (μυων), которые под землею постоянно остаются в слепоте. Изречение апостола Петра подобно сказанному апостолом Иаковом, именно:«кто слушает слово и не исполняет, тот подобен человеку, рассматривающему природные черты лица своего в зеркале»(Иак. 1,23). Ибо узнав, что чрез очищение святым крещением он омыт от множества грехов, он должен знать, что вместе с очищением он получил и святость, должен бодрствовать, чтобы таким образом сохранить то освящение, без которого никто не увидит Господа; а он забыл. Посему, говорит, братия мои,«более и более старайтесь делать твердым ваше звание и избрание»(2Петр. 1, 10); то есть то огласительное учение, которое вы слышали при вашем избрании, и быть неукоризненными в звании, чтобы не быть вам осужденными в забвении дара Божия, но пребыть твердыми в вашем звании.
      cn: 瞎眼 (μυωπάζων)。这个词语暗指老鼠 (μυων)，它们在地下长期处于失明状态。圣使徒彼得的这句教诲类似于圣使徒雅各所说的，即：「凡听道而不行道的，就好像一个人对着镜子察看自己生来的面貌」(雅各书 1:23)。因为他得知自己藉着圣洗礼的洁净，已洗净了众多罪孽，他就当知道，他与洁净一同获得了圣洁，他就当警醒，以便如此持守那圣化，没有它无人能得见上主；然而他却忘记了。所以，他说，「我的弟兄们，你们要更加殷勤地努力，使你们的蒙召和蒙选坚定不移」(彼得后书 1:10)；也就是说，你们在蒙选时所听到的慕道教诲，并且在蒙召中无可指摘，以免你们因忘记上帝的恩赐而被定罪，而是坚守你们的蒙召。
  - type: paragraph
    text:
      ru: так поступая, никогда не преткнетесь,
      cn: 如此行事，永不跌倒，
  - type: paragraph
    text:
      ru: 2Пет.1:11.ибо так откроется вам свободный вход в вечное Царство Господа нашего и Спасителя Иисуса Христа.
      cn: (彼得后书 1:11) 因为这样，进入我们主和救主耶稣基督永恒国度的自由通道，便将向你们开启。
  - type: paragraph
    text:
      ru: 2Пет.1:12.Для того я никогда не перестану напоминать вам о сем,
      cn: (彼得后书 1:12) 为此，我绝不停止提醒你们这些事，
  - type: paragraph
    text:
      ru: 'О чем –"о сем"? О вышесказанном, именно: добродетели, знании и прочем. Примечай, как прежде апостол хотел побудить страхом – пришествием Судии, а теперь убеждает обещанием благ – входом в вечное Царство Божие.'
      cn: 「「这事」——是指什么？」是指上文所说的，具体而言是：德行、知识以及其他。请留意，使徒先前想要用恐惧——即审判者的来临——来激励人，而现在则是用恩福的应许——即进入永恒的上帝之国——来劝服人。
  - type: paragraph
    text:
      ru: хотя вы то и знаете, и утверждены в настоящей истине.
      cn: 尽管你们确实知道，并已在这真正的真理中得以确立。
  - type: paragraph
    text:
      ru: 2Пет.1:13.Справедливым же почитаю, доколе нахожусь в этойтелеснойхрамине, возбуждать вас напоминанием,
      cn: (彼得后书 1:13) 我以为是合宜的，只要我还在这肉身帐幕里，就藉着提醒来激发你们，
  - type: paragraph
    text:
      ru: 2Пет.1:14.зная, что скоро должен оставить храмину мою, как и Господь наш Иисус Христос открыл мне.
      cn: （彼得后书 1:14）因为我深知我这帐幕将速速脱下，正如我们的主耶稣基督所指示我的。
  - type: paragraph
    text:
      ru: 'Чтобы при постоянном напоминании об одном и том же не подумали, будто их осуждают в праздности, и не опечалились, апостол прибавил: «хотя вы знаете и утверждены в настоящей истине». А в объяснение причины постоянного напоминания прибавил то, что он знает, что скоро последует разрешение его от тела.'
      cn: 以免他们因不断被提醒同一件事，就以为自己被定罪为怠惰，不至于因此而忧伤，使徒补充道：「虽然你们已然知晓，并在这真理中得以坚立。」而为解释不断提醒的原因，他又补充说，他知道自己很快就会从身体中解脱。
  - type: paragraph
    text:
      ru: 2Пет.1:15.Буду же стараться, чтобы вы и после моего отшествия всегда приводили это на память.
      cn: (彼得后书 1:15) 我必竭力，使你们在我离世之后，仍能时常记念这些事。
  - type: paragraph
    text:
      ru: 'Некоторые понимают это с такой перестановкой слов: «буду стараться и после моего отшествия приводить вас всегда на память», то есть каждодневно и непрерывно вспоминать, и отсюда выводят мысль, что святые и по смерти помнят остающихся здесь и молятся за живущих. Справедливость сего каждодневно усматривают те, которые призывают божественную благодать святых. Так понимают одни; но другие понимают иначе. Последние читают и понимают сей стих просто: буду стараться, чтобы вы и после моего отшествия всегда помнили это, то есть мы непрерывно повторяем вам одно и то же для того, чтобы обратить вам это в привычку, чтобы вы чрез постоянное и неизменное усвоение сего избавились от обвинения в непослушании и незнании, но и после смерти моей завещание о сем хранили твердо и неизменно.'
      cn: 有些人以这种词语顺序的重排来理解：「我将努力，甚至在我离世之后，也要常常记念你们」，也就是说，每日不间断地记念；并由此引申出一种想法，即圣徒们即使在离世之后，也记念留在这里的人，并为在世者祷告。那些呼求圣徒们神圣恩典的人，每日都可察觉到此事的正当性。有些人如此理解；但另一些人则以不同的方式理解。后者则简单地阅读和理解这节经文：「我将努力，使你们即使在我离世之后，也常常记住这件事」，也就是说，我们不断地向你们重复同一件事，以便让你们对此养成习惯，好使你们藉着持续不变地领受此事，得以免于不顺从和无知的指责，并且，即使在我死后，你们也能坚定不移地持守这一遗训。
  - type: paragraph
    text:
      ru: 2Пет.1:16.Ибо мы возвестили вам силу и пришествие Господа нашего Иисуса Христа, не хитросплетенным басням последуя, но быв очевидцами Его величия.
      cn: (彼得后书 1:16) 因为我们向你们传扬了我们主耶稣基督的权能和降临，不是随从那些巧妙编造的虚言，而是亲眼见过祂的威荣。
  - type: paragraph
    text:
      ru: 'Требуя со стороны верующих строгого внимания к своему благовествованию и долго настаивая на этом, хотя они знают и не раз слышали, апостол говорит теперь: не напрасно я останавливаюсь на этом, но потому, что сознаю всю важность этого. Почему же? Потому что, когда мы возвещали вам силу и пришествие Господа, мы не пользовались человеческой мудростью в отношении к вам и не обольщали вашего слуха красноречием, как язычники и еретики. Ибо язычники обольщают красотой и поэмами, а еретики – вымыслами (вероятно, они уже начинали и тогда появляться). Ничего такого нельзя подозревать в нас. Ибо мы преподали вам учение простым, безыскусным словом, как и Павел говорит коринфянам (1Кор. 2, 4, 13), и преподали то, что своими глазами видели, когда вместе с Ним восходили на святую гору. Апостол говорит о славе Единородного, которая явлена была апостолам в Преображении, и о гласе Отца, который слышали они сошедшим на Господа с неба от Отца. А как мы из самых дел узнали предвозвещенное пророками, то и почитаем пророчество их вернейшим. Ибо слова оправдались событиями. Поэтому и вы хорошо делаете, что внимаете пророчеству, то есть предсказаниям пророков, хотя пророки в свое время говорили и не совсем ясно.'
      cn: '使徒要求信徒们严谨地关注他的福音，并长久地坚持这一点，尽管他们知道且不止一次听过，他现在说：「我并非徒然地在此驻足，而是因为我深知这一切的重要性。」


        为什么呢？因为当我们向你们宣讲上主的能力和降临之时，我们并未对你们使用人的智慧，也未以花言巧语诱惑你们的听觉，像异教徒和异端那样。因为异教徒以美感和诗歌诱惑人，而异端则以虚构之说（或许那时他们已开始出现）。在我们身上，绝不能怀疑有任何此类行径。因为我们以朴实无华的言语向你们传授了教义，正如保罗对哥林多人所说（哥林多前书 2:4，13），并传授了我们亲眼所见的，就是当我们与祂一同登上圣山之时。使徒所说的是独生子的荣耀，这荣耀在变容时向使徒们显现，以及他们所听见从天上父那里降临到上主身上的声音。而既然我们从实际的事迹中得知了先知们预先宣告的，所以我们也认为他们的预言是最可靠的。因为言语已被事件所证实。因此，你们也做得很好，就是关注预言，亦即先知们的预言，尽管先知们在他们那个时代说话并非完全清晰。'
  - type: paragraph
    text:
      ru: '2Пет.1:17.Ибо Он принял от Бога Отца честь и славу, когда от велелепной славы принесся к Нему такой глас: Сей есть Сын Мой возлюбленный, в Котором Мое благоволение.'
      cn: 彼得后书 1:17。因为祂从父上帝领受了尊荣与荣耀，那时有极大的荣光向祂发出了这样的声音：「这是我的爱子，我所喜悦的。」
  - type: paragraph
    text:
      ru: 2Пет.1:18.И этот глас, принесшийся с небес, мы слышали, будучи с Ним на святой горе.
      cn: (彼得后书 1:18) 而这从天上传来的声音，我们听见了，当时我们正与祂同在圣山上。
  - type: paragraph
    text:
      ru: 'Не потому, что есть какое-либо пророчество о сошедшем с неба гласе Отца, но потому, что из этого гласа Отца с неба, засвидетельствовавшего сыновство Иисуса Христа, мы убедились, что все открытое чрез пророков непререкаемо относится к Тому, о ком свидетельствует Отец. А свидетельство Отца о сыновстве Господа нашего Иисуса Христа мы знаем троекратно: одно – при Крещении (Мф. 3, 17), другое – пред страданиями, когда сказано:«и прославил, и еще прославлю»(Ин. 12, 28). И третье – на горе Фавор (Мф. 17, 5).'
      cn: 并非因为有任何关于从天上降下的圣父之声的预言，而是因为从天上降下的圣父之声，见证了耶稣基督的子性，我们得以确信凡是藉着先知所启示的一切，都无可辩驳地归属于圣父所见证的祂。而圣父关于我们主耶稣基督子性的见证，我们知道有三次：第一次是在受洗时（马太福音 3:17），第二次是在受难之前，当时有话语说：「我已经荣耀了，并且还要再荣耀。」（约翰福音 12:28）。而第三次是在他泊山上（马太福音 17:5）。
  - type: paragraph
    text:
      ru: 2Пет.1:19.И притом мы имеем вернейшее пророческое слово; и вы хорошо делаете, что обращаетесь к нему, как к светильнику, сияющему в темном месте, доколе не начнет рассветать день и не взойдет утренняя звезда в сердцах ваших.
      cn: 彼得后书 1:19。并且我们有更确切的预言之言；你们做得好，因你们留意它，如同在暗处发光的灯，直到天发亮，晨星在你们心里升起之时。
  - type: paragraph
    text:
      ru: Внимая, говорит, предсказаниям пророков, вы не обманетесь в своей надежде. Ибо в свое время они оправдаются самыми делами, которые и назвал апостол"днем", продолжая переносную речь, ибо тут же сказал о светильнике, о темном месте, которое и есть ночь. Итак, когда, говорит, наступит"день", то есть явление событий, тогда«в сердцах ваших взойдет утренняя звезда», то есть пришествие Христово, предвозвещенное пророками, и как истинный свет осветит сердца ваши.
      cn: 他说道，倾听先知们的预言，你们的希望就不会落空。因为届时这些预言将由实际事件证实，使徒称之为「白昼」，他继续使用这种比喻的说法，因为他随即提到了灯，提到了黑暗的地方，那正是黑夜。那么，他说，当「白昼」来临，亦即事件显现之时，那时「晨星将在你们心中升起」，这便是先知们所预言的基督的降临，它将如真光般照亮你们的心。
  - type: paragraph
    text:
      ru: 2Пет.1:20.зная прежде всего то, что никакого пророчества в Писании нельзя разрешить самому собою.
      cn: (彼得后书 1:20) 首先你们该知道，经上所有的预言都不可凭人私意解释。
  - type: paragraph
    text:
      ru: 2Пет.1:21.Ибо никогда пророчество не было произносимо по воле человеческой, но изрекали его святые Божии человеки, будучи движимы Духом Святым.
      cn: (彼得后书 1:21) 因为预言从未凭着人的意思发出，而是上帝的圣人受圣灵感动而说出的。
  - type: paragraph
    text:
      ru: 'Пророки понимали, что и о чем внушал им Дух пророческий, однако не так ясно и точно, как все в частности исполнилось. Посему и"желалионивидеть", исполнение, как сказал Господь (Лк. 10, 24). Апостол объясняет, почему пророки не истолковывали своих изречений, и одновременно показывает отличие истинного пророчества от бесовского и вымышленного, каковое принимается у еретиков.«Ибо никогда пророчество не было произносимо по воле человеческой»(2Петр. 1, 21), это значит: пророки получают пророчество от Бога, но не как они хотят, а как действует Дух Божий; они сознавали и уразумевали ниспосылаемое им пророческое слово, но объяснения его не делали. Что пророки во время действия на них Духа Божия сознавали, что им ниспосылается слово от Духа Божиего, видно из того, что они подчинялись добровольно, и что хотели, то высказывали, а чего не хотели, о том умалчивали. У лжепророков не так. Они во время действия не владели сознанием, но приведенные в неистовство, как пьяные, не знали, что с ними происходило. Святые пророки, хотя и понимали, но не имели нужды изъяснять свои предсказания, как потому, что они служили другим, именно нам, так и для того, чтобы пришествие Господа было сокрыто и не подвергалось наветам от нечестивых. Наветов оно могло бы избежать силой Господнею; но, вероятно, дело совершившегося вочеловечения показалось бы призрачным, если бы несколько раз такое избежание было способом необыкновенным. Что это истинно, видно из примера новозаветных пророков, которые пророчествовали и объясняли сами себя, хотя не все. Ибо ничего такого не следует опасаться в Новом Завете. А что пророки прорицали не в исступлении, видно и из следующего. Пророки Ветхого и Нового Завета пророчествовали одним Духом. А апостол Павел говорит:«если же другому из сидящих будет откровение, то первый молчи»(1Кор. 14, 30). Из этого ясно, что пророки добровольно пророчествовали, оставаясь в естественном состоянии. Посему, когда вставал другой вдохновенный, прежде говорившему повелевалось молчать, чего никто не найдет в беснующихся. Ибо как будет молчать тот, кто сам не знает, что делает? Что в пророках действует Дух Святый, об этом говорит тот же апостол Павел:«одному дается Духом слово мудрости... иному пророчество»(1Кор. 12, 8, 10).'
      cn: '先知们理解预言之灵默示给他们什么以及关于什么，但不如所有事情究竟如何应验的那样清楚和精确。因此，「他们切愿看见」这应验，正如上主所说（路加福音 10:24）。使徒解释了为何先知们不解释他们的预言，并同时指出真实预言与邪灵的和虚构的预言的区别，后者为异端所接受。「因为预言从来没有出于人意」（彼得后书 1:21），这意味着：先知们从上帝领受预言，但不是按照他们自己的意愿，而是按照上帝之灵的运行；他们领悟并明白默示给他们的预言之言，但不对此作出解释。


        先知们在上帝之灵作用于他们之时，意识到了有来自上帝之灵的话语默示给他们，这可以从以下事实看出：他们是自愿顺服的，并且他们愿意说的就说，不愿意说的就保持缄默。假先知则不然。他们在（邪灵）作用之时并不拥有意识，而是被带入狂乱，如同醉酒之人，不知自己身上发生了什么。圣先知们，尽管他们理解，却不需要解释他们的预言，一方面是因为他们是为他人，也就是我们服务的，另一方面也是为了使上主的降临得以隐藏，不致遭受不虔敬之人的诽谤。它本可凭上主的能力避开诽谤；但若多次以非凡的方式避免诽谤，则已然成全的道成肉身之事，很可能会显得虚幻。这是否属实，可以从新约时代的先知们看出，他们预言并自我解释，尽管并非全部。因为在新约中，没有什么这样的事情需要担心。至于先知们并非在狂喜状态下预言，这也可以从以下看出。旧约和新约的先知们借着同一位圣灵预言。使徒保罗说：「若有另一位坐着的得了启示，那先说话的就当闭口不言」（哥林多前书 14:30）。由此可见，先知们是自愿预言的，且是在自然状态下。因此，当另一位受默示者站起来时，先说话的就被命令保持缄默，这在被邪灵附身之人身上是找不到的。因为一个连自己所做之事都不知道的人，又怎能保持缄默呢？圣灵在先知们身上运行，同一位使徒保罗对此说道：「有人蒙圣灵赐予智慧的言语……又有人得预言」（哥林多前书 12:8，10）。'
- type: heading1
  text:
    ru: Глава вторая
    cn: 第二章
  children:
  - type: paragraph
    text:
      ru: 2Пет.2:1.Были и лжепророки в народе, как и у вас будут лжеучители, которые введут пагубные ереси и, отвергая искупившего их Господа, навлекут сами на себя скорую погибель.
      cn: 彼得后书 2:1在百姓中曾有假先知兴起，正如在你们中间也将有假教师，他们将引入毁灭性的异端，甚至否认那买赎他们的主，自招迅速的毁灭。
  - type: paragraph
    text:
      ru: 2Пет.2:2.И многие последуют их разврату, и через них путь истины будет в поношении.
      cn: 彼得后书 2:2. 并且许多人将随从他们的淫荡，而藉着他们，真理的道将受亵渎。
  - type: paragraph
    text:
      ru: 2Пет.2:3.И из любостяжания будут уловлять вас льстивыми словами;
      cn: 并且出于贪婪，他们将用捏造的言语在你们身上取利。（彼得后书 2:3）
  - type: paragraph
    text:
      ru: Под лжеучителями апостол разумеет единомышленников Николая и Керинфа, а именем пророчества, общепридаваемого и пророкам и лжеучителям, предостерегает верующих, чтобы не внимали лжепророкам. Какое же различие между теми и другими, этому научил Павел, когда сказал, что никто не называет Иисуса Господом,«как только Духом Святым»(1Кор. 12, 3). Затем начинает обличать ересь николаитов, говоря, что они вдвойне худы. Ибо в учении они крайне нечестивы, так как хулят Владыку Христа; в жизни они весьма порочны, что и теперь он выражает, упоминая об их «разврате», а немного ниже объяснит еще более. Словом«из любостяжания»показывает, что они приобретают постыдным образом. Ибо любостяжание означает иногда несправедливость, а иногда вообще гнусность приобретения. Почему прилично употреблено слово"уловлять". Чтобы показать, что они совершенно чужды божественного учения, говорит, что они употребляют льстивые слова. Но, говорит, они получат должное за свое нечестие, именно смерть.
      cn: 使徒称假教师为尼古拉和克林妥的同党；他又借着「预言」之名——此名通常施予先知和假教师——告诫信徒不要听从假先知。至于这两者有何区别，保罗曾教导说，没有人称耶稣为主，「除非是被圣灵感动」（哥林多前书 12:3）。接着，他开始斥责尼古拉派的异端，说他们是双重邪恶的。因为他们在教义上极其不虔敬，亵渎主基督；在生活中他们则非常邪恶，他现在提到他们的「淫乱」就表达了这一点，稍后还会进一步解释。借着「出于贪婪」这个词，他表明他们是以可耻的方式获取财物的。因为贪婪有时意味着不义，有时则指获取财物的普遍可憎性。因此，「诱捕」这个词用得恰当。为了表明他们完全远离神圣教义，他说他们使用奉承之语。但是，他说，他们将为自己的不虔敬受到应得的报应，即死亡。
  - type: paragraph
    text:
      ru: Суд им давно готов, и погибель их не дремлет.
      cn: 审判早已为他们预备好了，并且他们的灭亡不打盹。
  - type: paragraph
    text:
      ru: 2Пет.2:4.Ибо, если Бог ангелов согрешивших не пощадил, но, связав узами адского мрака, предал блюсти на суд для наказания;
      cn: (彼得后书 2:4) 因为如果上帝未曾宽容犯罪的天使，反而用阴间幽暗的锁链捆绑他们，交付看守，以待审判受刑；
  - type: paragraph
    text:
      ru: 2Пет.2:5.и если не пощадил первого мира, но в восьми душах сохранил семейство Ноя, проповедника правды, когда навел потоп на мир нечестивых;
      cn: (彼得后书 2:5) 倘若祂未曾怜惜第一个世界，却保守了挪亚一家八口，就是那位公义的宣讲者，当祂降洪水于不敬虔者的世界时；
  - type: paragraph
    text:
      ru: 2Пет.2:6.и если города Содомские и Гоморрские, осудив на истребление, превратил в пепел, показав пример будущим нечестивцам,
      cn: 彼得后书 2:6. 又如果祂将所多玛和蛾摩拉城定为灭绝，使它们变为灰烬，以此显明后来不虔敬之人的鉴戒，
  - type: paragraph
    text:
      ru: 2Пет.2:7.а праведного Лота, утомленного обращением между людьми неистово развратными, избавил
      cn: (彼得后书 2:7) 并且解救了义人罗得，他因与那些狂暴淫乱的人交往而疲惫不堪。
  - type: paragraph
    text:
      ru: 2Пет.2:8.(ибо сей праведник, живя между ними, ежедневно мучился в праведной душе, видя и слыша дела беззаконные)–
      cn: (彼得后书 2:8) (因为这义人住在他们中间，每日看见并听见那些不法之事，就在他公义的灵魂中受折磨。)
  - type: paragraph
    text:
      ru: 2Пет.2:9.то, конечно, знает Господь, как избавлять благочестивых от искушения, а беззаконников соблюдать ко дню суда, для наказания.
      cn: (彼得后书 2:9) 那么，主当然知道如何拯救敬虔之人脱离试探，又如何将不法之人留到审判之日，等候刑罚。
  - type: paragraph
    text:
      ru: 'Слово«давно готов»означает предведение Божие. Ибо Бог по предведению как добрым приготовил блага, так и злым свойственное им место. Ибо суд давно готов. Не без причины начинает апостол с верующих, более почтенных, но желает показать, что они за свои грехи повинны большему осуждению. Они имеют то преимущество, что первые призваны к апостольству. Посему и за совращение с правого пути подвергнутся большему осуждению. С намерением представив доказательство в примерах, не вывел следствия одного вида, но соединил вместе пример и воздаяния праведникам. И ему нужно было бы сделать заключение о том, что выше предложено, то есть о грешниках, из-за которых и представлен пример, и сказать: если тех не пощадил, то ужели пощадит настоящих нечестивцев? или утвердительно: тем более не пощадит этих. Но апостол не так делает. Почему? Потому, что заключение само открывается, когда предложены два примера, добра и зла. Что идет к одному только злу, то не относится еще к добру. Ибо за добро не воздается злом. Итак, поскольку не достаточно было одним заключением закончить предложение, то он употребил иное выражение, и восклицанием закончил нужное. Для чего же к примерам худых людей он присовокупляет примеры добрых? Об этом скажем в соответстующем месте. Как мы выше сказали, по форме ясной речи не вытекает мысль из предложений, ибо не прибавлено заключения, какое обыкновенно следует за подобным словосочинением, но просто доказывается примером, что за грехи бывает наказание, а за правду награда. Апостол как бы так говорит: Бог умеет неизбежно наказывать без пощады живущих во грехах, как наказал ангелов согрешивших, людей предпотопных, города содомские. Умеет награждать и делающих правду, как наградил Ноя, Лота. Ход речи такой: сказано, что лжеучители наказаны будут за хуления свои и за развратную жизнь; представляются примеры: Бог не пощадил ангелов согрешивших, не пощадил и первого мира. Потом упоминаются подвизавшиеся в правде, и говорится, что Бог и Ноя, и Лота за их целомудрие сохранил от погибели современных им людей. Ибо Ной не увлекся нечестием людей предпотопных, и Лот нимало не подражал разврату жителей содомских, а когда они требовали на нечистоту Ангелов, принятых им в виде людей как странников, он не выдал их, хотя и вытерпел весьма много обидного от наступавшей на него толпы. На это и указывается словом«утомленного»(2Петр. 2, 7). О Лоте же говорится и это:«знает Господь, как избавлять благочестивых от искушения»(2Петр. 2, 9) и проч. Выше апостол ничего не говорил о праведниках; он говорил только о нечестивцах и о наказании их, а о праведниках упомянул в примерах. Это для того, во-первых, чтобы воспомянуть историю о погибели нечестивых и спасения праведных; во-вторых, для того, чтобы чрез сопоставление их выставить ужасную злобу грешников и светлые совершенства добродетельных; наконец, для того, чтобы убедить своих слушателей возненавидеть нечестие одних по причине наказаний за оное и возлюбить добродетель других по причине ее спасительности.'
      cn: 「早已预备」一词意指上帝的预知。因为上帝凭着预知，既为善人预备了福乐，也为恶人预备了他们当得之处。因为审判早已预备。使徒并非无缘无故地从那更受尊崇的信徒开始，而是希望表明他们因自己的罪，当受更大的谴责。他们拥有首先蒙召领受使徒职分的优势。因此，他们若偏离正道，也将受到更大的谴责。使徒有意借着例子提出证明，并未只推导出一种结果，而是将例子与义人的报偿结合在一起。他本应就上文所提出的内容，即因罪人而引用的例子，作出结论，并说：「如果那些他都不曾宽恕，难道他会宽恕现在这些不敬虔的人吗？」或者肯定地说：「他更不会宽恕这些人。」但使徒并非如此行。为何？因为当善恶两个例子被提出时，结论就不言自明了。仅仅指向恶的，尚未涉及善。因为善不会以恶报偿。因此，既然不足以仅以一个结论来结束此论述，他就采用了另一种表达方式，并以感叹句结束了所需的论点。那么，他为何在恶人的例子中加入善人的例子呢？我们将在适当之处讨论这一点。正如我们上文所说，在清晰的言语形式中，思想并未从论述中推导出来，因为没有加上通常随此类句法而来的结论，而是简单地借着例子证明：犯罪必有惩罚，行义必有赏赐。使徒似乎是这样说的：上帝懂得如何无情地、不可避免地惩罚活在罪中的人，正如他惩罚了犯罪的天使、洪水前的人们、所多玛城一样。他也懂得赏赐行公义的人，正如他赏赐了挪亚和罗得一样。论述的进程是这样的：宣称假教师将因他们的亵渎和败坏的生活而受惩罚；接着提出例子：上帝没有宽恕犯罪的天使，也没有宽恕起初的世界。然后提到在公义中努力的人，并说上帝因挪亚和罗得的纯洁，将他们从当时之人的毁灭中保守下来。因为挪亚没有被洪水前之人的不敬虔所诱惑，罗得也丝毫不效法所多玛居民的败坏；当他们要求对以人的形式被他接待为客旅的天使行污秽之事时，他没有交出他们，尽管他忍受了逼近他的暴民所施加的许多侮辱。这也正是「困乏的」（彼得后书 2:7）一词所指的。至于罗得，经文也说：「主知道如何搭救敬虔的人脱离试探」（彼得后书 2:9）等等。使徒先前并未提及义人；他只谈及不敬虔的人及其惩罚，而对义人则是在例子中提及。这首先是为了回顾不敬虔之人毁灭和义人得救的历史；其次是为了通过将他们作比较，展现罪人可怖的邪恶和有德之人光辉的完善；最后，是为了劝服听众，因不敬虔所受的惩罚而憎恨不敬虔，并因德行的救赎性而爱慕德行。
  - type: paragraph
    text:
      ru: 2Пет.2:10.а наипаче тех, которые идут вслед скверных  похотей плоти, презирают начальства, дерзки, своевольны и не страшатся злословить высших,
      cn: 彼得后书 2:10. 尤其是那些随从污秽的肉体情欲，轻蔑管辖他们的，胆大妄为，任性，并且不惧怕毁谤在上掌权的。
  - type: paragraph
    text:
      ru: Теперь от вышеприведенных примеров апостол искусно перешел к главному предмету. Он говорит о проклятых николаитах, наасянах и кердониянах; ибо злоба их многоименна и рассматривается слитно, как сходная по скверным делам и именам. Они представляли начатками бытия мира Бездну и Молчание и некоторые из этих начатков странно называли матерями и веками (αἰώνας); отсюда же и Маркион взял дурные семена. Затем, отвергнув участие Господа в творении мира и промышлении, они бесстрашно вдались во всякую плотскую нечистоту. Кто желает полнее узнать об этом, тот пусть возьмет в руки книгу Иринея Кельтского, составленную о них и надписанную «Против лжеименного знания»; в ней описаны грехи их, особенно развратнейшего Марка и растленных им женщин, и прочие гнусности, совершенные прочими, которых, по их зловредности, никто не сможет изложить письменно, ни вспомянуть. Неудивительно, что те, которые презирают и не боятся господства, бесстрашно поведут себя и пред всякой славой. Яснее скажет об этом святой апостол Иуда Фаддей, когда упомянет и о теле Моисеевом. А Петр только намекнул на это, коснулся и кончил речь. Но получив от него повод, мы говорим и о предлежащем.
      cn: 现在，使徒从上述例子巧妙地转向了主要议题。他谈论那些被咒诅的尼哥拉派、拿阿西派和克尔多尼派；因为他们的邪恶名目繁多，因其卑鄙的行径和名称相似，故被视为一个整体。他们认为世界的开端是深渊和静默，并奇怪地称其中一些开端为母亲和众世代 (αἰώνας)；马吉安也正是在此处汲取了恶劣的种子。接着，他们否认主在世界创造和护理中的参与，就毫无畏惧地陷入各种肉体上的不洁。凡欲更详细了解此事者，可取阅里昂的伊里奈乌所著，为驳斥他们而撰写，题为《驳斥伪称之知识》一书；书中记载了他们的罪行，特别是极其淫荡的马库斯以及被他败坏的妇女，和由其余人所犯的其他可憎之事，鉴于其恶毒，无人能用文字阐述，亦无人能记起。毫不奇怪，那些蔑视并无视权柄的人，甚至在一切荣耀面前也会毫无畏惧地行事。圣使徒犹大·达太会更清楚地阐明此事，当他提及摩西的尸体时。彼得则只是暗示了此事，略作提及便结束了论述。但我们从他那里得到启发，也谈论摆在面前的事情。
  - type: paragraph
    text:
      ru: 2Пет.2:11.тогда как и Ангелы, превосходя их крепостью и силою, не произносят на них пред Господом укоризненного суда.
      cn: (彼得后书 2:11) 而天使，虽然他们的力量与权能远胜于他们，却不在上主面前对他们宣判斥责的审判。
  - type: paragraph
    text:
      ru: 'Желая удержать их от такой дерзости, говорит: тогда как и ангелы, превосходя их крепостью и силой, не произносят на них пред Господом укоризненного суда. Апостол, как мы заметили, говорит одно и то же с апостолом Иудой; ибо и он, удерживая дерзких на язык, убеждает их этим же самым примером. Впрочем, он говорит обширнее:«Михаил Архангел, не смел произнести укоризненного суда»(Иуд. 1, 9). Подобное хочет сказать теперь и Петр, что эти злобесные не имеют никакой пощады в хуле на славы, тогда как и ангелы, превосходящие этих скверных силой и крепостью, не произносят против них, то есть начальства, укоризненного суда пред Господом. А как диавол причастен некоторой славы, потому что он«начаток творения Господня»(Иов. 40, 14), то Архангел не произнес на него укоризненного слова. Если же более достойный хулы, то есть диавол, как причастный славе, не получил от Михаила хулы пред Господом; то весьма неразумны те, которые поспешно хулят начальства, тогда как сами гораздо ниже достоинства ангелов. Под«начальствами»разумеет божественные силы, или и церковные начальства, против которых они восстают и которые они непрестанно злословят.'
      cn: 为了阻止他们这种狂妄，（他）说：甚至天使，他们的能力和力量都远胜于这些人，却不在上主面前对他们发出指责性的审判。正如我们所注意到的，这位使徒，与使徒犹大所说的是同一件事；因为他也，为了阻止那些口出狂言的人，也用同样的例子来劝诫他们。然而，他说的更详尽些：「天使长米迦勒，尚且不敢发出指责性的审判」（犹大书 1:9）。彼得现在也想表达类似的意思，即这些邪恶之人，肆无忌惮地亵渎荣耀者，然而天使，他们的力量和能力都远胜于这些污秽之人，却不在上主面前对他们，即对那些掌权者，发出指责性的审判。又因为魔鬼也分享了某种荣耀，因为它是「上主受造之物的开端」（约伯记 40:14），所以天使长没有对他发出指责的话语。如果连那更该受亵渎的，即魔鬼，既然分享着荣耀，都没有在上主面前受到米迦勒的亵渎；那么，那些仓促亵渎掌权者的人，是极其不明智的，因为他们自己远远低于天使的尊严。「掌权者」一词指的是神圣的力量，或是教会的掌权者，他们反抗这些掌权者，并且不断地诽谤他们。
  - type: paragraph
    text:
      ru: 2Пет.2:12.Они, как бессловесные животные, водимые природою, рожденные на уловление и истребление, злословя то, чего не понимают, в растлении своем истребятся.
      cn: 彼得后书 2:12. 他们如同无理性的畜类，凭本性行事，生来就是被捕捉、被毁灭的，却诽谤他们所不明白的事物，终必在自己的败坏中灭亡。
  - type: paragraph
    text:
      ru: 2Пет.2:13.Они получат возмездие за беззаконие, ибо они полагают удовольствие во вседневной роскоши;
      cn: （彼得后书 2:13）他们必因不法受报应，因为他们以白昼的奢华宴乐为乐。
  - type: paragraph
    text:
      ru: 'Некоторые объясняли это так: они истребятся в растлении своем, как бессловесные животные, родившиеся естественно, то есть нисколько не различаясь от скотов, которые рождаются на одно истребление.«Как бессловесные животные, водимые природою», то есть живущие одной только чувственностью, а не умом и жизнью разумной. Посему они и удоболовимы для ведения по жизни растленной, водятся и увлекаются гневом и похотью, злословят то, чего не знают, то есть со свойственным им незнанием, почему и истребятся в заслуженном ими растлении, получая возмездие за беззаконие, которое они сами приготовили себе добровольно.«Полагают удовольствие во вседневной роскоши», то есть в каждодневном услаждении горла полагают истинную цель, истинное и любимое благоразумие и удовольствие. Однако должно знать, что Священное Писание, когда порицает то, что находится в людях по естеству, то есть что присуще животным, уподобляет их бессловесным. Оно говорит, например:«человек, который в чести и неразумен, подобен животным, которые погибают»(Пс. 48, 13); а также:«Не будьте как коньилошак"(Пс. 31, 9); еще:"Это–откормленные кони»(Иер. 5, 8); и еще:«будьте мудры, как змии, и просты, как голуби»(Мф. 10, 16). Писание говорит это, не переменяя природы, а только убеждая удерживаться от природных наклонностей. Когда возвещает оно что-нибудь спасительное, то подобие заимствует от высшего, например:«будьте милосерды, как и Отец ваш милосерд»(Лк. 6, 36). И здесь не претворяет природу, а только повелевает делать это, насколько станет силы.'
      cn: 有些人如此解释：他们将在自身的败坏中灭亡，如同那些自然出生的无言动物，也就是说，与那些生来只为被毁灭的牲畜毫无分别。「如同被本性驱使的无言动物」，也就是说，他们只凭感官而活，而非凭理智和理性生命而活。因此，他们很容易被引入败坏的生活，被愤怒和情欲所引导和诱惑，诽谤他们所不知道的事物，也就是说，带着他们固有的无知，因此，他们将在他们应得的败坏中灭亡，为他们自己自愿预备的罪恶承受报应。「他们在每日的奢华中寻求快乐」，也就是说，他们在每日的口腹之乐中，将此视为真实的目标、真实的、可爱的智慧和快乐。然而应当知道，当《圣经》谴责人本性中的事物时，也就是说，当它谴责动物所固有的事物时，便将人比作无言的动物。它例如说：「人居尊贵而不醒悟，就如灭亡的走兽一样」(诗篇 48:13)；又说：「不要像无知的骡马」(诗篇 31:9)；还有：「这是喂肥的马」(耶利米书 5:8)；又说：「你们要灵巧像蛇，纯良像鸽子」(马太福音 10:16)。《圣经》如此说，并非要改变本性，而只是劝导人克制本性的倾向。当它宣扬任何救赎之事时，它就从更高的事物中借用比喻，例如：「你们要慈悲，像你们的父也是慈悲的」(路加福音 6:36)。在此，它也并非转变本性，而只是吩咐人尽其所能地去行。
  - type: paragraph
    text:
      ru: cрамники и осквернители, они наслаждаются обманами своими, пиршествуя с вами.
      cn: 可耻之人与玷污者，他们享受着自己的欺骗，与你们一同宴乐。
  - type: paragraph
    text:
      ru: '2Пет.2:14.Глаза у них исполнены любострастия и непрестанного греха; они прельщают неутвержденные души; сердце их приучено к любостяжанию: это сыны проклятия.'
      cn: 彼得后书 2:14. 他们的眼睛满了淫欲和不止息的罪；他们诱惑不坚固的灵魂；他们的心惯于贪婪：这是咒诅之子。
  - type: paragraph
    text:
      ru: 2Пет.2:15.Оставив прямой путь, они заблудились, идя по следам Валаама, сына Восорова, который возлюбил мзду неправедную,
      cn: (彼得后书 2:15) 他们离弃了正路，就走迷了路，随从了比珥之子巴兰的道路，他喜爱不义的工价，
  - type: paragraph
    text:
      ru: '2Пет.2:16.но был обличен в своем беззаконии: бессловесная ослица, проговорив человеческим голосом, остановила безумие пророка.'
      cn: （彼得后书 2:16）但他因自己的不法被指摘：那不能言语的母驴，用人声开口，阻止了先知的愚妄。
  - type: paragraph
    text:
      ru: 'Порядок такой: срамники и осквернители;«сердце их приучено к любостяжанию», то есть искусные в любостяжании; сыны проклятия; пирующие вместе с вами; имеющие глаза, исполненные любострастия и непрестанного греха; они прельщают неутвержденные души, которые и Павел назвал«женщинами, утопающими во грехах»(2Тим. 3, 6); они, оставив прямой путь, пошли путем Валаама, сына Восорова, и прочее; голоса их суть безводные источники, облака, гонимые бурею, и прочее. А за что предлежит им в будущем веке мрак? За чрезмерную их суетность, по которой они нечистотами и плотскими похотями прельщают бывших прежде в заблуждении и искренно оставивших его возвратиться, как пес, на свою блевотину. Что вставлено, то объясняет и подтверждает их суетность. Смысл же такой: они, говорит, не имеют ничего, свойственного чистоте, но пристают к чистому обществу, как пятна на чистой одежде. Когда обольстят кого-нибудь и успеют сделать попавшихся в их сети мужей и жен нечистыми, почитают это дело наслаждением, дополняя свое развращение. Они, и пиршествуя с вами, делают это не по любви и общению с другими, но потому, что находят это время удобным для обольщения женщин. Ибо они, имея глаза, смотрят не на что иное, как на любострастие, и непрестанно имея это в виду и греша, как сыны проклятия, прельщают неутвержденные души. Ибо сердце их не приучено ни к чему другому, как только к любостяжанию, то есть к разврату или к корысти, и чрез то и другое оставив путь, могший привести их ко спасению, они заблудились от него и подверглись тому же, чему и Валаам, сын Восоров, потому что и он по любви к подаркам возлюбил и награду неправедную. Но он был обличен в своем беззаконии.«Бессловесная ослица, проговорив человеческим голосом, остановила безумие пророка»(2Петр. 2, 16). Отсюда научаемся, что Валаам, получив однажды запрещение от Бога идти к Валаку, снова побуждаем был к тому надменной своей страстью, которую он откармливал своим неистовым чародейством, но, обузданный страхом Божиим и страшными знамениями, бывшими во время пути, не переменил слово благословения, которое было делом не чародейства. Ибо пророки с сознанием произносят свои вещания. Посему-то и апостол назвал его"пророком", как сознававшего, что он говорил. Ибо, если бы он не сознавал своих слов, то не мог бы выбрать того, что лучше. Итак, благословение его было делом не волхвования, но силы Божией.'
      cn: 顺序是这样的：可耻者和玷污者；「他们的心惯于贪婪」，即精于贪婪者；被咒诅之子；与你们一同宴饮者；他们的眼目充满淫欲和不辍之罪；他们诱惑那不坚固的灵魂，保罗也称之为「沉溺于罪恶的妇人」(提摩太后书 3:6)；他们离弃了正直的路，走了比珥之子巴兰的路，等等；他们的言语是无水的泉源，是被暴风吹逐的云雾，等等。在未来的世代中，有什么样的黑暗等着他们呢？因为他们过度的虚浮，他们借此用污秽和肉体的情欲诱惑那些先前在迷误中并真心离弃迷误之人，使他们如同狗一样，转去吃自己所吐的。所插入的内容，解释并证实了他们的虚浮。其意义是这样的：他说，他们不具备任何属于洁净之物，却附着于洁净的群体，如同洁净衣裳上的污点。当他们引诱了某人，并成功地使那些落入他们网罗中的男女变得不洁时，便视此事为享乐，以此增添自己的败坏。他们与你们一同宴饮时，并非出于爱和与他人的交谊，而是因为他们发现此时便于引诱妇人。因为他们有眼睛，却不看别的，只看淫欲，并且持续怀着此念而犯罪，如同被咒诅之子，诱惑那不坚固的灵魂。因为他们的心不惯于别的，只惯于贪婪，即是说，惯于败坏或贪图私利，并通过这两者，离弃了本可引他们得救的道路，他们偏离了这条路，并遭遇了比珥之子巴兰所遭遇的同样下场，因为他也因爱礼物而贪爱不义的赏赐。但他却因自己的罪孽而受责备。「那不能言语的驴，竟发出人言，制止了先知的狂妄」(彼得后书 2:16)。由此我们得知，巴兰在一次领受了上帝禁止他去见巴勒的命令之后，又被他傲慢的私欲所驱使，而这私欲是他以自己狂妄的巫术所滋养的；然而，他被对上帝的敬畏以及路途中发生的骇人异象所制止，没有改变那祝福的话语，因为那并非巫术之作为。因为先知们是带着意识说出他们的预言的。所以使徒称他为「先知」，因为他知道自己所说的是什么。因为如果他没有意识到自己的话语，他就无法选择更好的。因此，他的祝福并非巫术之作为，而是上帝的能力。
  - type: paragraph
    text:
      ru: '2Пет.2:17.Это безводные источники, облака и мглы, гонимые бурею: им приготовлен мрак вечной тьмы.'
      cn: (彼得后书 2:17) 这等人是无水的泉源，是被暴风催逼的密云和幽暗的雾气；有永远幽暗的黑暗为他们存留。
  - type: paragraph
    text:
      ru: 2Пет.2:18.Ибо, произнося надутое пустословие, они уловляют в плотские похоти и разврат тех, которые едва отстали от находящихся в заблуждении.
      cn: 彼得后书 2:18因为，他们宣讲夸大的虚妄空谈，就以肉体的私欲和淫荡诱惑那些刚刚脱离活在谬误中的人。
  - type: paragraph
    text:
      ru: 2Пет.2:19.Обещают им свободу, будучи сами рабы тления; ибо, кто кем побежден, тот тому и раб.
      cn: (彼得后书 2:19) 他们应许他们自由，自己却作了败坏的奴仆；因为人被谁制服，就给谁作奴仆。
  - type: paragraph
    text:
      ru: 'Вставивши многое в средину речи, между прочим пример Валаама, апостол опять начинает говорить о нечистых гностиках. Уподобляет их безводным источникам, потому что они утратили чистоту проповеди и сладкую воду жизни. Сравнивает их с облаками, гонимыми ветром, разумея ветер противный, почему и назвал его бурею, так как буря приводит гонимое ею в совершенный беспорядок. Они, говорит, облака не светлые, каковы святые, но темные, полные мрака. Приводит и причину сему, именно то, что они по суетности произносят речи надутые, привлекая плотской похотью в разврат тех, которые совершенно избегли его, или, если некогда и находились в заблуждении, то впоследствии покорили себя Господу. Сами, говорит, будучи рабами упомянутой нечистоты, которую по справедливости и назвал тлением, обещают обольщаемым свободу. А почему они иным обещают свободу, сами будучи рабами греха, приводит на это прекрасное доказательство: кто какой страстью побежден, тот и раб ее. Но это пространнее уяснится далее.'
      cn: 使徒在论述中插入了许多内容，其中包括巴兰的例子，之后又再次开始谈论那些不洁的诺斯替派。他将他们比作无水的泉源，因为他们失落了宣讲的纯洁和生命的甘甜活水。他将他们比作被风吹逐的云，指的是逆风，所以称之为暴风，因为暴风将它所吹逐之物带入完全的混乱中。他说，他们不是明亮的云，像圣徒那样，而是黑暗的，充满昏昧。他也给出此原因，就是他们出于虚妄，口出狂言，以肉体的贪欲引诱那些人陷入淫乱，这些人已完全摆脱了这淫乱，或者，如果他们曾经身陷迷途，后来也已顺服了主。他说，他们自己既是所述不洁的奴仆，他公正地称之为败坏，却应许那些受迷惑之人以自由。至于他们为何应许他人以自由，而自己却是罪的奴仆，他对此提出一个绝佳的论证：凡被何种情欲所胜者，便是那情欲的奴仆。但此事将在下文更详尽地阐明。
  - type: paragraph
    text:
      ru: 2Пет.2:20.Ибо если, избегнув скверн мира чрез познание Господа и Спасителя нашего Иисуса Христа, опять запутываются в них и побеждаются ими, то последнее бывает для таковых хуже первого.
      cn: （彼得后书 2:20）因为如果他们，藉着认识我们的主和救主耶稣基督，得以避免了世上的污秽，却又再被它们缠住，且被它们胜过，那么，他们末后的景况就比先前更不好了。
  - type: paragraph
    text:
      ru: 2Пет.2:21.Лучше бы им не познать пути правды, нежели, познав, возвратиться назад от преданной им святой заповеди.
      cn: 彼得后书 2:21倒不如他们不认识公义的道路，胜于既已认识，又从所传给他们的圣洁诫命退转。
  - type: paragraph
    text:
      ru: '2Пет.2:22.Но с ними случается по верной пословице: пес возвращается на свою блевотину, и вымытая свиньяидетваляться в грязи.'
      cn: (彼得后书 2:22) 然而，他们所遭遇的，正是应验了那句真实的谚语：狗转回到它所吐的污秽，洗净的猪又到泥里去打滚。
  - type: paragraph
    text:
      ru: 'Сими словами подтверждает два предмета: во-первых, то, что побежденный по необходимости работает своему победителю, и, во-вторых, то, что познавшие истину, но опять придерживающиеся прежнего нечестия, впадают в зло, худшее прежнего. Присовокупляет и притчу, подтверждающую то же (Притч. 26, 11). Смысл речи такой: если те, которые чрез познание Господа и Спасителя Иисуса Христа избегли скверн мира, опять запутываются в них и побеждаются ими, то они, без сомнения, и порабощаются ими, и положение их становится хуже, чем было до познания о рабстве, ибо сатана старается, чтобы они впали в большее зло. Посему-то апостол и говорит, что при такой будущности для тех, кто добровольно возвращается на зло, лучше было бы им не познавать правды, нежели, познав, впадать в большее зло. Потому что и пес, возвращающийся на свою блевотину, бывает еще отвратительнее, подобно как и свинья, ищущая омыться от грязи, если делает это в грязи же, оказывается еще грязнее прежнего.'
      cn: '这些话证实了两件事：第一，被征服者必然为其征服者效劳，第二，那些认识了真理，却又再依附旧有不敬虔行为的人，会陷入比先前更糟的邪恶之中。接着又引用了一则比喻来证实这一点（箴言 26:11）。


        这段话的意思是：那些通过认识上主和救主耶稣基督而逃避了世上污秽的人，若再次陷入其中并被它们所胜，那么他们无疑也必受其奴役，他们的境况会比认识这奴役之前更糟，因为撒旦会竭力让他们陷入更大的邪恶。因此，使徒说，对于那些自愿回归邪恶的人来说，在这样的未来面前，倒不如不认识真理，免得认识了之后，反而陷入更大的邪恶。因为狗回到自己的呕吐物中，会变得更加令人厌恶，正如猪想要洗净身上的污泥，如果它在污泥中打滚，就会比先前更加肮脏。'
- type: heading1
  text:
    ru: Глава третья
    cn: 第三章
  children:
  - type: paragraph
    text:
      ru: 2Пет.3:1.Это уже второе послание пишу к вам, возлюбленные; в них напоминанием возбуждаю ваш чистый смысл,
      cn: 彼得后书 3:1. 这已经是我写给你们的第二封书信了，蒙爱者们；在这些信中，我借着提醒激发你们纯净的理智，
  - type: paragraph
    text:
      ru: 2Пет.3:2.чтобы вы помнили слова, прежде реченные святыми пророками, и заповедь Господа и Спасителя, преданную Апостолами вашими.
      cn: （彼得后书 3:2）为要叫你们记念圣先知们从前所说的话语，以及你们的使徒所传达的主和救主的诫命。
  - type: paragraph
    text:
      ru: 'Отсюда узнаем, что посланий апостола Петра всего два.«В них напоминанием возбуждаю»значит: в этих посланиях или этими посланиями я возбуждаю ваш чистый смысл. Ибо чистому смыслу свойственно помнить, что выслушано или заповедано спасительного, и возбуждаться к исполнению сего на деле со всею силой и усердием. А заповедано это чрез проповедь пророков и апостолов. Посему и Павел говорит:«бывши утверждены на основании Апостолов и пророков»(Ефес. 2, 20). Ибо все они возвещали о пришествии Господа. И нельзя не верить столь многим свидетелям. Почему же говорю о пророках и апостолах? Потому, что они возвещали и о первом и о втором пришествии Самого Господа и Спасителя нашего. Порядок речи такой:«чтобы вы помнили слова, прежде реченные(ὑπό)святыми пророками»,«заповедь(ὑπό)апостолов своих», «по (ὑπό)заповедиГоспода и Спасителя». Ибо предлогὑπό(от) относится ко всем. Почему же заповедует оживлять память о сем? Потому, присовокупляет, что страстно живущие по своим похотям бесстыдно нападают на верующих и насмехаются над ними, видя, что некоторые страшатся пришествия Господня, о котором вместе с пророками предвозвестил и Сам Господь, и посему гнушаются нечистой жизнью их, и особенно потому, что за предсказанием не тотчас следует событие, но для спасения вписанных в книге спасаемых допущен промежуток.'
      cn: 从此我们得知，使徒彼得的书信共有两封。「在这些书信中，我藉提醒来唤醒」意即：在这些书信中，或藉着这些书信，我唤醒你们纯洁的悟性。因为纯洁的悟性本该牢记所听闻的或所领受的救赎之道，并被激发，竭尽全力、满怀热忱地在行动中去实践这一切。而这一切的教导是藉着先知和使徒的宣讲。因此保罗也说：「被建造在使徒和先知的根基上」（以弗所书 2:20）。因为他们所有人都宣扬了主的降临。并且不可能不相信如此众多的见证者。那么，为何我提及先知和使徒呢？因为他们宣扬了关于我们主和救主第一次和第二次的降临。话语的顺序是这样的：「好使你们记起圣先知们（ὑπό）从前所说的话」，「祂的使徒们（ὑπό）的诫命」，「依照（ὑπό）主和救主的诫命」。因为介词 ὑπό（意为「从」或「藉着」）适用于所有这些情况。那么，祂为何吩咐要唤醒对这些事的记忆呢？作者接着说，这是因为那些随从私欲、纵情生活的人，竟无耻地攻击并嘲笑信徒们。他们之所以如此，是因为他们看到有些信徒惧怕主的降临（这降临是上主祂自己与先知们一同预言过的），并且（信徒们）因此厌恶他们（指那些纵情生活者）不洁的生活。尤其又因为预言之后事件并未立即发生，而是为了拯救那些记在得救者之书中的人，才有了这一段宽限期。
  - type: paragraph
    text:
      ru: 2Пет.3:3.Прежде всего знайте, что в последние дни явятся наглые ругатели, поступающие по собственным своим похотям
      cn: （彼得后书 3:3）首先你们当知道，在末后之日，必有狂妄的讥诮者出现，顺着他们自己的私欲行事。
  - type: paragraph
    text:
      ru: '2Пет.3:4.и говорящие: где обетование пришествия Его? Ибо с тех пор, как стали умирать отцы, от начала творения, всё остается так же.'
      cn: （彼得后书 3:4）并说：「祂降临的应许在哪里呢？因为自从列祖去世以来，从创造之初起，万物依然如故。」
  - type: paragraph
    text:
      ru: 'Из-за того, что для спасения многих, написанных в книге живых, не наступает вслед за словами само пришествие Господа, наглые люди нападают на верных с насмешками и говорят:«где обетование пришествия Его?»Но из-за того, что не исполнилось еще, по вышеупомянутой причине, одно обетование, несправедливо не верить и прочим спасительным заповедям Господа, как желают и домогаются люди злонамеренные. Так пустословили гностики того времени, именно: наасяне и лампетиане и евхиты. Все они, говорит, не знают; ибо добровольно смежают глаза свои перед истиной. Чего же не знают они? Того, что небеса, согласно книге Бытия Моисея, были из воды, – ибо, по словам его, Сам Бог повелел"бытьтвердипосреди воды»(Быт. 1, 6), – равно и земля по повелению Его явилась из вод же, в которых прежде была погружена, что поскольку небо и земля состоят из вод, то неожиданно настал потоп, и что как во время потопа последовало разрушение чрез воду, так и теперь предлежит разрушиться всему чрез огонь, с чем вместе погибнут и нечестивые. Две главные стихии вселенной: вода и огонь, от которых получают бытие еще две стихии: воздух от испаряющихся вод, а земля – от вод сгущающихся, испарение же и сгущение сие производится огнем, чему поверит всякий, имеющий ум, ибо такую силу получила природа огня от Самого Творца Бога. Итак, если две только стихии, и первое истребление нечестивых было чрез воду, то совершенно необходимо, говорит, чтобы второе погубление нечестивых совершилось чрез огонь.'
      cn: '因为许多记载在生命册上的人的得救，主的降临并没有在话语之后随即到来，于是那些傲慢的人便用嘲笑攻击信徒，说：「祂降临的应许在哪里呢？」然而，仅仅因为上述原因，一个应许尚未成就，就不公正地不相信主其他的救赎性诫命，正如那些心怀恶意的人所希望并企图的那样。那时期的诺斯替主义者就是这样空谈的，确切地说，有拿撒恩派、兰佩提安派和欧奇特派。他说，所有这些人都不明白；因为他们是自愿在真理面前闭上眼睛的。那么他们不知道什么呢？他们不知道的是：根据摩西《创世记》所载，诸天是由水造成的——因为，按照他的话，上帝亲自命令「要有穹苍在水之间」（创世记 1:6）——同样，大地也照着祂的命令从水中出现，先前大地曾浸没在水中。并且，由于天地都由水构成，洪水就意外地降临了；又正如在洪水时期，毁灭是通过水而发生的，现在万物也必将通过火而被毁灭，与此一同灭亡的还有不虔敬的人。


        宇宙的两大主要元素是水和火，由它们又衍生出另外两种元素：空气由蒸发的水生成，而大地则由凝结的水生成。这种蒸发和凝结是由火产生的，任何有理性的人都会相信这一点，因为火的本性从造物主上帝那里获得了这样的能力。因此，他说，如果只有这两大元素，并且对不虔敬者的第一次毁灭是通过水发生的，那么对不虔敬者的第二次毁灭就必然会通过火来完成。'
  - type: paragraph
    text:
      ru: '2Пет.3:5.Думающие так не знают, что вначале словом Божиим небеса и земля составлены из воды и водою:'
      cn: (彼得后书 3:5) 这样想的人并不知道，起初藉着上帝的言语，诸天和地构成自水，并因水而立：
  - type: paragraph
    text:
      ru: '"Из воды", как причины вещественной,"водой"же, как причиной совершительной, ибо вода содержит землю, связуя пыль оной и доставляя ей твердость, а если бы этого не было, то земля превратилась бы в пыль и воздух. Иной пустослов, быть может, возразит нам: почему же Бог, создавший видимый мир, не создал его от начала твердым, от чего и нужно возводить его к совершенству при Ное чрез потоп, а при кончине мира, как говорит теперь Петр, чрез огонь? Такому скажем, во-первых, то, что миру нельзя быть неизменяемым. Ибо как будет иметь неизменяемость то, что получило бытие чрез перемену (ибо он приведен в бытие из небытия, чего ни один благоразумный не назовет непеременою)? Поскольку же изменение к худшему дошло до самого худого, то Творец мира, чтобы возвести к лучшему, по необходимости совершил очищение его при Ное посредством воды, а при кончине совершит посредством огня. И мы имеем обыкновение подвергать некоторые вещи действию огня, не для того, чтобы уничтожить их, но для того, чтобы придать им чистоту и блеск. В этом, вероятно, никто не усомнится. Подобное и Бог обещает сделать при кончине века посредством огня: лишнее и бесполезное для будущего состояния людей Он уничтожит, например, растения, скот, лес. Так существа, не нужные для нетленной жизни, уничтожатся. Если же так, то напрасно пустословят те, которые утверждают, будто этот видимый мир от начала был нетленным. Если бы кто вздумал так же рассуждать и о существах мысленных, поскольку и они приведены в бытие из небытия, таковой пусть поймет, что самая простота (несложность) их ручается за неразрушимость и за близость их, по самому бытию, к блаженному и божественному естеству.'
      cn: 「从水而出」，作为物质的原因；而「水」本身，则作为成全的原因，因为水承载着大地，结合其尘土并赋予其坚固，若非如此，大地将化为尘土和空气。也许有空谈者会反驳我们：为何那创造了可见世界的上帝，起初不将其造得坚固，以致于在挪亚时代需要通过洪水将其引向完善，而在世界末了，正如彼得现在所说，却要通过火来完成呢？对此，我们首先要说，世界不可能是不变的。因为那通过改变而获得存在的事物，怎能不变呢（因为它从无有中被带入存在，任何明智之人都不会称之为不变）？既然恶劣的改变已达到极致，那么世界的创造者，为了使其提升至更佳状态，必然地在挪亚时代通过水对其进行了洁净，而在末了将通过火来完成。我们也常常将某些事物置于火的作用之下，并非为了消灭它们，而是为了赋予它们纯净和光泽。对此，想必无人会怀疑。同样地，上帝也应许在世代末了通过火来做相似的事：对于人类未来的状态而言多余无用的事物，祂将予以消灭，例如植物、牲畜、森林。因此，那些对不朽生命而言不必要的存在，将被消灭。倘若如此，那么那些主张这个可见世界从起初就是不朽之人，便白白空谈了。如果有人也想如此论及那些思辨的存在，既然它们也从无有中被带入存在，那人便当明白，它们那极度的单纯（非复杂性）担保了它们的不朽坏，并担保它们就其存在本身，与那受福的及神圣的本性相近。
  - type: paragraph
    text:
      ru: 2Пет.3:6.потому тогдашний мир погиб, быв потоплен водою.
      cn: (彼得后书 3:6) 因此，那时的世界被水淹没而灭亡了。
  - type: paragraph
    text:
      ru: 'Мир погиб чрез небо и землю. Земля выпустила из недр своих воду, а хляби небесные ниспустили воду на землю."Погиб"разумей не обо всем мире, но об одних только животных, которые представляют собой как бы весь мир: ибо созданный без них мир не был бы и миром.'
      cn: 世界经由天和地而毁灭了。大地从其深处涌出水来，而天上的窗户则将水降下到地上。"毁灭"一词，不要理解为整个世界，而要理解为仅指那些动物，它们可以说代表了整个世界：因为一个没有它们的被造之界，便不能称为世界。
  - type: paragraph
    text:
      ru: 2Пет.3:7.А нынешние небеса и земля, содержимые тем же Словом, сберегаются огню на день суда и погибели нечестивых человеков.
      cn: 彼得后书 3:7但现今的天地，藉着那同一的圣言而存留，被保守以待火烧，直到审判之日和不虔敬之人的灭亡。
  - type: paragraph
    text:
      ru: 'Что будет разрушение настоящего мира посредством огня – это мысль не одних только христиан, но и языческих мудрецов. Но скажет иной: зачем созидать мир, если он опять должен обратиться в тление? Такому скажем, что мир не уничтожится совершенно, но разрушится, чтобы обновиться, почему и пророк говорит:«и Ты обновишь лице земли»(Пс. 103, 30). Чувственная тварь, по создании Богом, была"хорошавесьма"(Быт. 1, 31), а за преступление человека и сама эта тварь«покорилась суете»(Рим. 8, 20), то есть утратила твердость бытия своего. Потом, когда во время потопа стало на земле мало людей богочестивых, мир как бы вторично восстановился и получил начало чрез Ноя и прочие живые существа, сохранившиеся в ковчеге для того, чтобы послужить семенем нового состояния мира. Между тем род человеческий и тогда не улучшился, но пошел на худшее прежнего, от чего не отвратил его ни закон, данный чрез Моисея, ни пришествие Господне. Итак, поскольку и призвание ко спасению было многообразно, и погибель от непокорности была многоразлична, то необходим будет огненный потоп, то есть разрушение, хотя и не всецелое, разрушение не душ, но и не тел.«Ибо всем нам должно явиться пред судомХристовым"(2Кор. 5, 10), не без тел, с одними только душами, но вместе с нетленными телами. Ибо как может быть наказана одна душа без тела, когда она носит на себе сделанное ею чрез тело? Ибо праведному Судии не свойственно, когда двое погрешили в одном и том же, одного прощать, а на другого слагать всю тяжесть вины. Скажем, во-вторых, и то, что и мы посредством огня обыкновенно очищаем нечистые вещи от примеси и восстановляем их светлость.«Сберегаются на день суда и погибели»(2Петр. 3, 7)."Суда"– то же, что осуждения.'
      cn: 现世将通过火被毁灭——这不仅是基督徒的思想，也是异教徒智者的思想。但或许有人会说：既然世界终将再次归于朽坏，为何还要创造它呢？对这样的人，我们会说，世界不会彻底消灭，而是被毁灭以获得更新，因此先知说：「祢必更新大地的面貌」（诗篇 103:30）。感官可见的被造物，在上帝创造之初，「甚好」（创世记 1:31），但由于人的罪过，这被造物本身也「服在虚空之下」（罗马书 8:20），也就是说，它失去了其存在的稳固性。接着，当洪水时期，地上虔敬之人稀少时，世界仿佛第二次重建并借由挪亚和方舟中保存下来的其他活物得到了新的开端，以作为世界新状态的种子。然而，那时人类并未因此改善，反而变得比从前更糟，摩西所传的律法，以及主的降临，都未能使他们回转。因此，既然救赎的呼召是多样的，而不顺服所带来的灭亡也是多方面的，那么火的洪灾，也就是毁灭（虽然不是彻底的），将是必然的，这毁灭既非灵魂的毁灭，也非身体的毁灭。「因为我们众人必要在基督的审判台前显露出来」（哥林多后书 5:10），并非没有身体，仅仅带着灵魂，而是连同不朽的身体一起显露。因为，当灵魂借由身体所行之事担在其身时，灵魂怎能独自在没有身体的情况下受惩罚呢？因为，当二者犯了同样错误时，赦免其中一个，却将全部罪责加诸于另一个，这并非公义的审判者所为。其次，我们也要说，我们也常常借着火来净化不洁之物中的杂质，并使其恢复光泽。「存留到审判和灭亡的日子」（彼得后书 3:7）。「审判」——亦即定罪。
  - type: paragraph
    text:
      ru: 2Пет.3:8.Одно то́ не должно быть сокрыто от вас, возлюбленные, что у Господа один день, как тысяча лет, и тысяча лет, как один день.
      cn: '彼得后书 3:8: 蒙爱者啊，有一件事你们不可不知，就是在主那里，一日如千年，千年如一日。'
  - type: paragraph
    text:
      ru: 2Пет.3:9.Не медлит Господьисполнениемобетования, как некоторые почитают то медлением; но долготерпит нас, не желая, чтобы кто погиб, но чтобы все пришли к покаянию.
      cn: 彼得后书 3:9. 主不迟延祂所应许的事，好像有些人以为祂是迟延；其实是宽容我们，不愿有一人沉沦，乃愿人人都悔改。
  - type: paragraph
    text:
      ru: Заключив слово о кончине века, что она непременно будет и будет чрез огонь (что и мы пространно разъяснили), апостол перешел к протяжению времени кончины мира и говорит, что«Не медлит Господьисполнениемобетования, как некоторые почитают то медлением; но долготерпит»(2Петр. 3, 9), ожидая спасения нашего и полноты имеющих спастись, и что пред Ним, бесконечным, ни какое время не продолжительно, но что у Него«и тысяча лет, как один день»(2Петр. 3, 8); даже, по словам Давида, нет и множества дней, ибо он так говорит:«тысяча лет пред очами Твоими, как день вчерашний, когда он прошел, икакстража в ночи»(Пс. 89, 5). Когда тысячу лет уподобляет страже ночной, то имеет в виду самый краткий срок. А ночь делится на четыре промежутка. Так Господь, по словам Евангелия (Мф. 14, 25), предстал Своим апостолам«в четвертую стражу ночи».
      cn: 论及世代的终结必将来临，且将通过火而来（我们也已详尽阐明）之后，使徒转而论述世界终结的时间长度，并说：「上主不耽延祂的应许之实现，像有些人认为那是耽延；乃是恒久忍耐」（彼得后书 3:9），等待我们的救恩和将要得救之人的数目满足，并且在祂这无限者面前，没有任何时间是漫长的，乃是祂「千年如一日」（彼得后书 3:8）；甚至，按达味所说，连许多日子也没有，因为他这样说：「在祢眼前，千年如已过的昨日，又如夜间的一更」（诗篇 89:5）。当他将千年比作夜间的一更时，乃是指最短暂的时期。而一夜分为四更。于是上主，按福音所说（马太福音 14:25），显现于祂的使徒们「在夜里的第四更」。
  - type: paragraph
    text:
      ru: 2Пет.3:10.Придет же день Господень, как тать ночью, и тогда небеса с шумом прейдут, стихии же, разгоревшись, разрушатся, земля и все дела на ней сгорят.
      cn: (彼得后书 3:10) 主的日子将如夜间之盗贼而来临；那时，诸天必轰然废去，元素也必炽热销化，大地和其上一切的工程都将烧尽。
  - type: paragraph
    text:
      ru: 2Пет.3:11.Если так всё это разрушится, то какими должно быть в святой жизни и благочестии вам,
      cn: (彼得后书 3:11) 既然这一切都要如此毁坏，那么你们在圣洁生活和虔敬上当是怎样的人呢，
  - type: paragraph
    text:
      ru: 2Пет.3:12.ожидающим и желающим пришествия дня Божия, в который воспламененные небеса разрушатся и разгоревшиеся стихии растают?
      cn: (彼得后书 3:12) 期望并切望上帝之日的来临，在那日，被火燃着的天必瓦解，炽热的元素必融化？
  - type: paragraph
    text:
      ru: Чтобы объяснить неизвестность и неожиданность пришествия Господня, апостол сравнивает оное с приходом вора и ночи. Ночь указывает на неизвестность, а вор – на неожиданность; ибо никто, ожидающий вора, не бывает ограблен. Посему и Господь говорит, что«ка́к во дни Ноябыли люди, пристрастные к пирам и к бракам,пока незастиг ихпотоп, – так и пришествиеГоспода застигнет нечестивых неожиданно» (Мф. 24, 37–39)."С шумом"значит с треском, а такой треск обыкновенно бывает, когда что-нибудь горит. Примечай. Апостол сказал:«земля и... дела на ней сгорят», а не «люди»; следовательно, он говорит только о погибели нечестивых или их дел нечестивых; ибо«путь нечестивых погибнет»(Пс. 1, 6), а не сам нечестивый.
      cn: '为要解释主降临的未知性和出乎意料，使徒将其比作窃贼和黑夜的到来。黑夜指示着未知性，而窃贼则指示着出乎意料；因为凡预料到窃贼到来的人，就不会被抢劫。因此主也说：「就如挪亚的日子，人沉溺于宴乐和嫁娶，直到洪水临到他们，——同样，主的降临也将出乎意料地临到不敬虔之人。」(马太福音 24:37-39)


        「轰然」意即伴随着爆裂声，而这种爆裂声通常是在有东西燃烧时才会出现。请注意。使徒说：「地和其上的所有工程都要被烧尽」，而不是「人」；因此，他所说的只是不敬虔之人的灭亡，或是他们不敬虔行为的灭亡；因为「不敬虔之人的道路必灭亡」(诗篇 1:6)，而不是不敬虔之人本身。'
  - type: paragraph
    text:
      ru: 2Пет.3:13.Впрочем мы, по обетованию Его, ожидаем, нового неба и новой земли, на которых обитает правда.
      cn: 彼得后书 3:13. 然而我们，按照祂的应许，等候着新天新地，其中有义居住。
  - type: paragraph
    text:
      ru: 2Пет.3:14.Итак, возлюбленные, ожидая сего, потщитесь явиться пред Ним неоскверненными и непорочными в мире;
      cn: （彼得后书 3:14）所以，蒙爱的，既然你们等候这些事，就当竭力，使自己呈现在祂面前，无可玷污，无可指摘，在平安之中。
  - type: paragraph
    text:
      ru: 2Пет.3:15.и долготерпение Господа нашего почитайте спасением,
      cn: (彼得后书 3:15) 并且我们的上主之恒忍，你们要视为救恩，
  - type: paragraph
    text:
      ru: Господь устроит новое небо и новую землю,"новые"не по сущности и веществу; ибо если кто строит новый дом, то это не значит уже, что он строит его и из вещества, не существовавшего прежде. Нет, Бог однажды создал вещество и образовал его во всевозможные виды и составы, и что было необходимо для здешней лишь жизни, а для тамошней нетленной бесполезно и излишне, то Он отменит, а что полезно, тому даст новый образ с красотой нетленной и неувядающей, и дозволит наполнять другой и нетленный мир.
      cn: 上主将建立新天新地，「新的」并非在于本质和物质；因为如果有人建造新房子，这并不意味着他要用以前不存在的物质去建造它。不，上帝曾一次性地创造了物质，并将其塑造成各种形态和构成，凡是仅仅为今生所需，而对于那不朽的来世而言是无用且多余的，祂便会废除；而凡是有益的，祂则会赋予其新形象，以不朽且永不衰残的美丽，并允许其充满另一个不朽的世界。
  - type: paragraph
    text:
      ru: как и возлюбленный брат наш Павел, по данной ему премудрости, написал вам,
      cn: 正如我们蒙爱的弟兄保罗，照着他所得的智慧，曾写信给你们，
  - type: paragraph
    text:
      ru: 2Пет.3:16.как он говорит об этом и во всех посланиях, в которых есть нечто неудобовразумительное, что невежды и неутвержденные, к собственной своей погибели, превращают, как и прочие Писания.
      cn: (彼得后书 3:16) 正如他在他所有的书信中，也论及这事，其中有些难明白的，那无知和不坚定的人，如同曲解其他的经文一样，为了他们自己的灭亡，曲解了这些。
  - type: paragraph
    text:
      ru: 2Пет.3:17.Итак вы, возлюбленные, будучи предварены о сем, берегитесь, чтобы вам не увлечься заблуждением беззаконников и не отпасть от своего утверждения,
      cn: (彼得后书 3:17) 所以，你们这蒙爱的，既然预先得知这些事，就当谨慎，免得被不法之人的错谬所引诱，以致从自己的坚固根基上坠落。
  - type: paragraph
    text:
      ru: 2Пет.3:18.но возрастайте в благодати и познании Господа нашего и Спасителя Иисуса Христа. Ему слава и ныне и в день вечный. Аминь.
      cn: (彼得后书 3:18) 但要在我们的主和救主耶稣基督的恩典和认识中增长。愿荣耀归于祂，从今时直到永远。阿们。
  - type: paragraph
    text:
      ru: 'Павел написал об этом, когда сказал:«благость Божия ведет тебя к покаянию»(Рим. 2, 4). Если же долготерпение Божие ведет к покаянию, а покаяние для нас спасительно, то очевидно, что долготерпение Божие служит к нашей же пользе и спасению. Говорит«неудобовразумительное», что нечестивые проповедуют в извращенном смысле, ибо это значит«превращают». Представим один пример из всех их лжетолкований. Апостол Павел сказал:«когда умножился грех, стала преизобиловать благодать»(Рим. 5, 20). Извратители придали словам апостола Павла такой смысл: будем больше грешить, чтобы большее получить прощение. Делают они это на собственную погибель. Ибо как те, которые убивали пророков и апостолов, так и те, которые превратно толкуют речи их, подлежат одному и тому же осуждению. Как их убивали те, которые не желали пользы и спасения ученикам их, так и речи их извращают те, которые не желают, чтобы кто-нибудь получил чрез них спасение. «Своим утверждением» называет веру в Господа. Наконец, как первое послание заканчивает молитвой, так и во втором просит им возрастания в вере Господней.'
      cn: 保罗对此写道，他说：「上帝的恩慈引领你悔改」（罗马书 2:4）。既然上帝的恒忍引领人悔改，而悔改对我们是救赎性的，那么显然，上帝的恒忍正是为了我们的益处和救赎。[彼得]说「难以明白的」，即不虔敬之人以扭曲的意义宣讲，因为这指的是「歪曲」[经文]。我们举一个他们所有谬解的例子。使徒保罗说：「罪在哪里显多，恩典就更显多了」（罗马书 5:20）。那些歪曲者赋予使徒保罗的话这样的意义：让我们更多犯罪，以便得到更多的赦免。他们这样做是为了自取灭亡。因为那些杀害先知和使徒的人，以及那些歪曲他们言语的人，都受到同样一个定罪。正如杀害他们（指先知和使徒）的人，是不愿他们的门徒得益处和救赎；同样，歪曲他们言语的人，是不愿任何人借此获得救赎。[彼得]称「自己的坚固」为信靠上主。最后，正如（彼得的）第一封书信以祷告结束，同样，在第二封书信中也祈求他们（指读者）在上主的信仰中成长。
