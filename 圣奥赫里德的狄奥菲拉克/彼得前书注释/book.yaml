- type: heading1
  text:
    ru: Глава первая
    cn: 第一章
  children:
  - type: paragraph
    text:
      ru: 1Пет.1:1.Петр, Апостол Иисуса Христа, пришельцам, рассеянным в Понте, Галатии, Каппадокии, Асии и Вифинии, избранным,
      cn: (彼得前书 1:1) 耶穌　基督的使徒彼得寫信給那分散在本都、加拉太、加帕多家、亞細亞、庇推尼寄居的，
  - type: paragraph
    text:
      ru: '1Пет.1:2.по предведению Бога Отца, при освящении от Духа, к послушанию и окроплению Кровию Иисуса Христа:'
      cn: (彼得前书 1:2) 就是照　父─　上帝的先見被揀選、藉著　靈得成聖潔，以致順服耶穌　基督，又蒙他血所灑的人。願恩典、平安多多的加給你們。
  - type: paragraph
    text:
      ru: 'Сказал«пришельцам»или потому, что они рассеяны, или потому, что все живущие по Боге называются пришельцами на земле, как, например, говорит Давид:«ибо странник я у Тебяипришлец, как и все отцы мои»(Пс. 38, 13). Имя пришельца не то же, что имя пришлого. Последнее означает пришедшего из чужой страны и даже нечто более несовершенное. Ибо как постороннее дело(πάρεργον)ниже дела настоящего(τοΰ εργου), так и пришлый(παρεπίδημος)ниже переселенца(έπιδήμου). Эту надпись нужно читать с перестановкой слов, именно так; Петр, Апостол Иисуса Христа, по предведению Бога Отца, при освящении от Духа, к послушанию и окроплению Кровью Иисуса Христа. Остальные слова должно поставить после сего; ибо в них обозначаются те, кому пишется послание.«По предведению Бога». Сими словами апостол хочет показать, что он, за исключением времени, ничем не ниже пророков, которые и сами были посланы, а что и пророки посланы, об этом говорит Исаия:«благовествовать нищим, послал Меня»(Ис. 61, 1). Но если он ниже по времени, то не ниже по предведению Бога. В этом отношении он объявляет себя равным Иеремии, который, прежде образования во чреве, был познан и освящен и назначен:«пророком для народов»(Иер. 1, 5). И как пророки, вместе с прочим, предвозвещали пришествие Христово (ибо для сего они были посылаемы), то объясняет служение апостольства, и говорит: я при освящении от Духа послан к послушанию и окроплению Кровию Иисуса Христа. Объясняет то, что дело его апостольства состоит в том, чтобы отделять. Ибо это означает слово«освящение», например, в словах:«ибо ты народ святой у Господа, Бога твоего»(Втор. 14, 2), то есть отделенный от прочих народов. Итак, дело его апостольства – посредством дарований духовных отделять народы, покорные кресту и страданиям Иисуса Христа, окропляемые не пеплом тельца, когда нужно очищать осквернение от общения с язычниками, но Кровию от страданий Иисуса Христа. Словом«Кровию»одновременно предсказывает мучение за Христа верующих в Него. Ибо кто с покорностью идет по следам Учителя, тот, без сомнения, сам не откажется пролить собственную кровь за Того, Кто пролил Свою за весь мир.'
      cn: '他说「致寄居者」，或因他们分散各地，或因凡敬虔度日之人，在地皆被称为寄居者，正如大卫所言：「因我在祢面前是客旅，是寄居的，像我列祖一般」（诗篇 38:13）。「寄居者」一名，与「客旅」一名不同。后者意指从异乡而来之人，甚至带有某种更不完全之意。因如旁务（πάρεργον）低于正务（τοΰ εργου），故旁寓者（παρεπίδημος）低于寓居者（έπιδήμου）。


        此开篇词需颠倒词序阅读，正如此：彼得，耶稣基督的使徒，凭着父上帝的预知，借着圣灵的圣化，以致顺服，并蒙耶稣基督的宝血洒净。其余的话应置于此后；因其中指明了书信所写给的对象。「凭着上帝的预知。」使徒借此言语欲表明，他除时间之外，在任何方面都不逊于先知，而先知亦蒙差遣，以赛亚就此言道：「报好信息给贫穷的人，祂差遣了我」（以赛亚书 61:1）。然而，若他在时间上居后，但在上帝的预知上则不居后。在此方面，他宣称自己与耶利米平等，后者在母腹中成形之前，已蒙认识，并被圣化和指定：「作列国的先知」（耶利米书 1:5）。又如先知们，除其他外，预言了基督的降临（因他们为此被差遣），故此，（他）解释了使徒的职事，并说：我借着圣灵的圣化，蒙差遣以致顺服，并蒙耶稣基督的宝血洒净。（他）解释说，他使徒职事的功用在于分别为圣。因「圣化」一词意为此，例如在以下经文中：「因你归上主，你的上帝为圣洁的民」（申命记 14:2），意即从其他民族中被分别出来。因此，他使徒职事的功用，是借着属灵的恩赐，将那些顺服于耶稣基督的十字架与苦难的民族，分别出来；这些民族并非以母牛犊的灰洒净（当需洁净因与外邦人交通而来的玷污时），乃是借着耶稣基督受苦的宝血洒净。藉着「宝血」一词，（使徒）同时预示了信靠祂之人为基督所受的苦难。因凡顺服地跟随夫子足迹者，必不拒绝为那位为全世界流血之主倾洒自己的鲜血。'
  - type: paragraph
    text:
      ru: благодать вам и мир да умножится.
      cn: 愿恩典与平安，丰盛地赐给你们。
  - type: paragraph
    text:
      ru: «Благодать», потому что мы спасаемся даром, не привнося ничего от себя.«Мир», потому, что, оскорбив Владыку, мы были в ряду врагов Его.
      cn: '«恩典», 因为我们是白白得救，不加添任何出于我们自己的东西。

        «和平», 因为我们冒犯了主宰者，曾列于祂仇敌的行列之中。'
  - type: paragraph
    text:
      ru: 1Пет.1:3.Благословен Бог и Отец Господа нашего Иисуса Христа, по великой Своей милости возродивший нас воскресением Иисуса Христа из мертвых к упованию живому,
      cn: (彼得前书 1:3) 願頌讚歸與我們　主耶穌　基督的　父上帝。他曾照自己的大憐憫，藉耶穌　基督從死裏復活，重生了我們，叫我們有活潑的盼望，
  - type: paragraph
    text:
      ru: 1Пет.1:4.к наследству нетленному, чистому, неувядаемому,
      cn: (彼得前书 1:4) 可以得著不能朽壞、不能玷污、不能衰殘、為你們存留在天上的基業。
  - type: paragraph
    text:
      ru: Благословляет Бога, благодаря Его за все те блага, которые Он подает. Что же подает Он? Упование, но не то, какое было чрез Моисея, о поселении в земле ханаанской, и которое было смертно, а упование живое. Откуда оно имеет жизнь? От воскресения Иисуса Христа из мертвых. Ибо Он как Сам воскрес, так и приходящим к Нему чрез веру в Него дает тоже силу воскреснуть. Итак, дар есть упование живое,«нетленное наследство», не на земле отложенное, как например, отцам, но на небесах, от чего и имеет свойство вечности, чем и преимуществует пред наследством земным. При этом уповании еще дар – сохранение и соблюдение верных. Потому что Господь и об этом молился, когда сказал:«Отче Святый! соблюди их»(Ин. 17, 11),«Силой». Какая же сила? – до явления Господня. Ибо если бы соблюдение не было сильно, то не простерлось бы до такого предела. А когда столько и таких даров, то принимающим их естественно радоваться.
      cn: 赞美上帝，感谢祂所赐予的一切恩惠。那么祂赐予什么呢？是盼望，但不是藉着摩西所给予的、关于在迦南地定居的、且是必朽坏的盼望，而是活泼的盼望。它从何处获得生命？从耶稣基督从死人中复活而来。因为祂自己怎样复活了，也照样将复活的力量赐予那些藉着信靠祂而归向祂的人。所以，这恩赐就是活泼的盼望，一个「不能朽坏的基业」，不是在地上积存的，如同给列祖的，而是在天上的，由此也具有永恒的特质，并且优于属地的基业。伴随着这盼望，还有另一份恩赐——就是对信徒的保守和看顾。因为主也曾为此事祷告，祂说：「圣父啊！求祢保守他们」（约翰福音 17:11），藉着能力。那么，是何种能力呢？——直到主显现为止。因为若非这保守是强大有力的，就不会延续到如此地步。当有如此众多且如此的恩赐时，领受它们的人自然会喜乐。
  - type: paragraph
    text:
      ru: хранящемуся на небесах для вас,
      cn: 为你们存留在天上的，
  - type: paragraph
    text:
      ru: 1Пет.1:5.силою Божиею через веру соблюдаемых ко спасению, готовому открыться в последнее время.
      cn: (彼得前书 1:5) 你們這因信蒙　上帝能力保守的人，必能得著所預備，到末時要顯現的救恩。
  - type: paragraph
    text:
      ru: Если наследство на небесах, то открытие тысячелетнего царства на земле – ложь.
      cn: 如果基业在天上，那么地上千年王国的建立就是谎言。
  - type: paragraph
    text:
      ru: 1Пет.1:6.О сем радуйтесь, поскорбев теперь немного, если нужно, от различных искушений,
      cn: (彼得前书 1:6) 因此，你們是大有喜樂；但如今，因百般的試探暫時憂愁，
  - type: paragraph
    text:
      ru: 1Пет.1:7.дабы испытанная вера ваша оказалась драгоценнее гибнущего, хотя и огнем испытываемого золота,
      cn: (彼得前书 1:7) 叫你們的信心既被試驗，就比那被火試驗仍然能壞的金子更顯寶貴，可以在耶穌　基督顯現的時候得著稱讚、榮耀、尊貴。
  - type: paragraph
    text:
      ru: 'Как Учитель в обещании Своем объявляет не одну радость, но и скорбь, говоря:«в мире будете иметь скорбь»(Ин. 16, 33); так и апостол к слову о радости прибавил:«поскорбев». Но как и это прискорбно, то присовокупляет«теперь», и это согласно с своим Предводителем. Ибо и Он говорит:«вы печальны будете, но печаль ваша в радость будет»(Ин. 16, 20). Или слово«теперь»должно быть отнесено к радости, поскольку ее сменит будущая радость, не кратковременная, но продолжительная и бесконечная. А поскольку речь об искушениях производит смущение, то апостол указывает цель искушений: потому, что чрез них опытность ваша становится очевиднейшею и драгоценнейшею золота, как и золото, испытываемое огнем, дороже ценится людьми. Прибавляет:«если нужно», научая, что не всякий верный, ни всякий грешный испытывается скорбями, и ни тот ни другой не оставляется в них навсегда. Праведники скорбящие страдают для получения венцев, а грешники в наказание за грехи. Не все праведники испытывают скорби, чтобы ты не почел злобу похвальной и не возненавидел добродетель. И не все грешники испытывают скорби – для того, чтобы не подверглась сомнению истина воскресения, если бы здесь еще все получали должное.'
      cn: '正如导师在祂的应许中宣告的不仅是喜乐，也有忧患，祂说：「在世上你们有苦难」（约翰福音 16:33）；同样，使徒在论及喜乐的言语中又加上了「忧伤」。然而，既然这（忧伤）也是令人痛苦的，他便补充说「如今」，这与他的领袖相符。因为祂也说：「你们将要忧愁，但你们的忧愁将变为喜乐」（约翰福音 16:20）。或者，「如今」一词应归于喜乐，因为未来的喜乐将取代它，这喜乐不是短暂的，而是持久而无穷的。


        鉴于谈论试炼会引起困惑，使徒指明了试炼的目的：因为通过它们，你们的经验变得比金子更加明显和宝贵，正如金子经过火的试炼，更受人珍视。他补充说：「若是必须」，教导说并非所有忠信的人，也并非所有罪人都会经受苦难的试炼，并且无论哪一方都不会永远被留在其中。受苦的义人受难是为了获得冠冕，而罪人受苦则是为了惩罚他们的罪行。并非所有义人都经历苦难，以免你将邪恶视为值得称赞的，以免你憎恶美德。并非所有罪人都会经历苦难——这是为了不使复活的真理受到质疑，如果每个人都在今世得到了应得的报应。'
  - type: paragraph
    text:
      ru: к похвале и чести и славе в явление Иисуса Христа,
      cn: 为赞美、尊荣和荣耀，在耶稣基督显现之时，
  - type: paragraph
    text:
      ru: 1Пет.1:8.Которого, не видев, любите, и Которого доселе не видя, но веруя в Него, радуетесь радостью неизреченною и преславною,
      cn: (彼得前书 1:8) 你們雖然沒有見過他，卻是愛他；如今雖不得看見，卻因信他就有說不出來、滿有榮光的大喜樂；
  - type: paragraph
    text:
      ru: 1Пет.1:9.достигая наконец верою вашею спасения душ.
      cn: (彼得前书 1:9) 並且得著你們信心的果效，就是你們元魂的救恩。
  - type: paragraph
    text:
      ru: Этими словами апостол указывает причину, почему праведники здесь претерпевают зло, и частью утешает их тем, что они чрез скорби становятся славнее, частью ободряет их прибавлением«в явлении Иисуса Христа»,что именно тогда-то Он чрез обнаружение трудов доставит подвижникам великую славу. Присовокупляет он и нечто иное, увлекающее к перенесению скорбей. Что же такое? следующее:«Которого, не видев, любите». Если, говорит, не видев Его телесными глазами, любите Его по одному слуху, то какую почувствуете любовь, когда увидите Его, и притом являющегося в славе? Если так привязали вас к Нему страдания Его, то какую привязанность должно произвести на вас явление Его в невыносимом блеске, когда и вам в награду подастся спасение душ? Если же вы имеете явиться пред Ним и удостоиться такой славы, то ныне покажите соответственное ей терпение, и вполне достигнете предположенной цели.
      cn: 使徒以这些话指明义人在此地遭受苦难的原因，一方面安慰他们，借着忧患他们将变得更为荣耀；另一方面则勉励他们，藉着补充「在耶稣基督显现的时候」，就在那时，祂借着显明苦修者的劳作，将赐予他们极大的荣耀。使徒又增添了另一些话，引人去忍受忧患。那么是何呢？乃是下文：「祢们虽未曾看见祂，却爱祂。」 使徒说，倘若祢们虽未曾用肉眼见过祂，却单凭耳闻而爱祂，那么当祢们看见祂时，将感受到何等大的爱呢，并且看见祂在荣耀中显现？倘若祂的受难已使祢们如此依恋于祂，那么祂在无可忍受的光辉中显现，将会在祢们身上产生何等的依恋呢，当祢们也将获得灵魂的救恩作为奖赏之时？倘若祢们将要在祂面前显现，并配得如此的荣耀，那么现在祢们就当表现出与此相称的忍耐，如此便能完全达到所预期的目标。
  - type: paragraph
    text:
      ru: 1Пет.1:10.К сему-то спасению относились изыскания и исследования пророков, которые предсказывали о назначенной вам благодати,
      cn: (彼得前书 1:10) 論到這救恩，那預先說你們要得恩典的眾先知早已詳細的尋求考察，
  - type: paragraph
    text:
      ru: 'Поскольку апостол упомянул о спасении души, а оно неизвестно и странно для слуха, то свидетельствуется пророками, которые изыскивали и исследовали о нем. Они изыскивали будущее, как, например, Даниил, которого являвшийся ему ангел назвал за это«муж желаний»(Дан. 10, 11)! Они исследовали то, на которое и на какое время указывал сущий в них Дух.«На которое», то есть время исполнения,«на какое», то есть когда иудеи чрез различные плены дойдут до совершенного богопочтения и сделаются способны к принятию таинства Христова. Примечай, что, назвав Духа«Христовым», апостол исповедует Христа Богом. Дух же Сей указывал на страдания Христовы, говоря через Исаию:«как овца, веден был Он на заклание»(Ис. 53, 7), и через Иеремию:«положимядовитоедерево в пищу его»(Иер. 11, 19), а на воскресение через Осию, сказавшего:«оживит нас через два дня, в третий день восставит нас, и мы будем жить пред лицем Его»(Ос. 6, 2). Им, говорит апостол, открыто было не для них самих, а для нас. Этими словами апостол совершает двоякое дело: доказывает и предведение пророков, и то, что призванные ныне к вере Христовой известны были Богу прежде сотворения мира. Словом о предведении пророков он внушает им, чтобы они с верой принимали предвозвещенное им пророками, потому что и дети благоразумные не пренебрегают трудами отцев. Если пророки, не имевшие ничем воспользоваться, изыскали и исследовали, и, нашедши, заключили то в книги и передали нам как наследство, то мы были бы несправедливы, если бы стали относиться к трудам их презрительно. Посему, когда и мы возвещаем вам это, вы не пренебрегайте, и благовестие наше не оставляйте тщетным. Такой урок из предведения пророков! А тем, что верующие предузнаны Богом, апостол устрашает, чтобы они не показали себя недостойными предузнания Божия и звания от Него, но друг друга побуждали бы к тому, чтобы сделаться достойными дара Божия.'
      cn: '既然使徒提到了灵魂的救赎，而这救赎对于人的听闻是未知且陌生的，便有先知们为此作证，他们曾寻求并探究过这救赎。他们寻求那将要来临的事，例如但以理，曾向他显现的天使因此称他为「大蒙眷爱的人」（但以理书 10:11）！他们探究了住在他们里面的圣灵所预示的时间和具体时刻。「在何日」，意即应验的时机；「何时」，意即犹太人要如何经历各种被掳，以达到完全的敬虔，并变得有能力接受基督的奥秘。请注意，使徒称圣灵为「基督的灵」，便是宣认基督为上帝。而这圣灵指明了基督的受难，藉着以赛亚说：「他像羊羔被牵到宰杀之地」（以赛亚书 53:7），又藉着耶利米说：「将有毒的树木放在他的食物里」（耶利米书 11:19）；而藉着何西阿，则指明了祂的复活，他说：「祂二日后必使我们活过来，第三日必使我们兴起，我们就在祂面前得以存活」（何西阿书 6:2）。使徒说，这些事向他们显明，并非为他们自己，而是为我们。


        使徒借由这些话语成就了两件事：既证明了先知们的预知，也证明了如今蒙召归信基督的人，在创世以前就已蒙上帝所知。借由提及先知们的预知，他规劝他们务要以信心接受先知们所预先宣告之事，因为即使是明智的儿女，也不会轻视父辈的劳作。如果先知们，他们自己并无所得益，却寻求并探究了这些事，寻得之后将其载入书籍，并作为遗产传承给我们，那么，如果我们对他们的劳作心存蔑视，我们便是不公正的了。因此，当我们向你们传报这些事时，你们不可轻视，也不可使我们的福音归于徒然。这是从先知们的预知中得到的教训！至于信徒蒙上帝预知一事，使徒借此警示他们，务要避免表现出不配蒙受上帝的预知和祂的召选，而是要彼此激励，好使自己配得上帝的恩赐。'
  - type: paragraph
    text:
      ru: 1Пет.1:11.исследуя, на которое и на какое время указывал сущий в них Дух Христов, когда Он предвозвещал Христовы страдания и последующую за ними славу.
      cn: (彼得前书 1:11) 就是考察在他們心裏　基督的　靈，預先證明　基督受苦難，後來得榮耀，是指著甚麼時候，並怎樣的時候。
  - type: paragraph
    text:
      ru: 1Пет.1:12.Им открыто было, что не им самим, а нам служило то,
      cn: (彼得前书 1:12) 他們得了啟示，知道他們所服事的一切事，不是為自己，乃是為我們。那靠著從天上差來的　聖靈傳福音給你們的人，現在將這些事報給你們；天使也願意詳細察看這些事。
  - type: paragraph
    text:
      ru: Если и апостолы и пророки действовали Духом Святым, возвещая одни пророчества, а другие Евангелие, то, очевидно, между ними нет никакой разности. Итак, вы должны, говорит апостол, иметь к нам такое же внимание, какое имели к пророкам современники их, чтобы не подвергнуться наказанию, постигшему непокорных пророкам. Нужно заметить и то, что в этих словах апостол Петр открывает таинство Троицы. Когда он сказал:«Дух Христов», то указал на Сына и Духа, а на Отца указал он, когда сказал:«с неба». Ибо слово«с неба"должно понимать не о месте, а преимущественно о Боге, посылающем в мир Сына и Духа.
      cn: 如果使徒与先知都是借着圣灵行事，宣讲的，一些是预言，另一些是福音，那么，显而易见，他们之间没有任何区别。所以，使徒说，你们应当对我们抱有同样的敬重，就像他们的同代人对先知所抱有的那样，以免遭受那临到不顺从先知之人的惩罚。还需要注意的是，在这些话语中，使徒彼得揭示了圣三一的奥秘。当他说「基督的灵」时，他就指明了圣子与圣灵；而当他说「从天上」时，他就指明了圣父。因为「从天上」这个词语，不应理解为指地点，而应主要理解为指那位差遣圣子与圣灵进入世界的上帝。
  - type: paragraph
    text:
      ru: что ныне проповедано вам благовествовавшими Духом Святым, посланным с небес, во что желают проникнуть Ангелы.
      cn: 那如今由传福音者，藉着从天上差来的圣灵，向你们所宣讲的，正是众天使也切望深究的事。
  - type: paragraph
    text:
      ru: 'Здесь предлагается увещание, выводимое из высокого достоинства предмета. Изыскания пророков о нашем спасении служили нам, а дело нашего спасения так чудно, что оно стало вожделенно и для ангелов. А что наше спасение ангелам приятно, видно из той радости, какую они выразили при Рождестве Христовом. Они пели тогда:«слава в вышних Богу»(Лк. 2, 14). Сказав об этом, апостол приводит причину сего и говорит: так как это спасение наше любезно для всех, не только для людей, но и для ангелов, то и вы не относитесь к нему с небрежением, но сосредоточьтесь и мужайтесь. На это указывают слова:«препоясав чресла»(1Пет. 1, 13), что Бог повелевал сделать и Иову (Иов. 38:3, 40:2). Какие чресла?«ума вашего», говорит далее апостол. Приготовьтесь таким образом, бодрствуйте, и совершенно надейтесь на предстоящую вам радость, радость во второе пришествие Господа, о которой он говорил немного прежде (1Пет. 1, 7).'
      cn: 这里提出一个劝勉，源于这主题崇高的尊贵。众先知对我们救恩的探究是为我们服务的，而我们救恩之事是如此奇妙，甚至连天使也渴慕它。至于我们的救恩令天使欢喜，可从他们在基督诞生时所表达的喜悦中看出。他们那时歌唱道：「在至高之处荣耀归于上帝」（路加福音 2:14）。使徒谈到此事后，提出了原因并说道：既然这救恩对所有人而言都是可爱的，不仅是对人，也是对天使，那么你们也不要对它漫不经心，而是要集中精神，刚强起来。话语「束上你们的腰」（彼得前书 1:13）指向这一点，这亦是上帝曾吩咐约伯去做的（约伯记 38:3，40:2）。束上什么腰呢？使徒接着说：「你们心中的」。你们就这样预备好，警醒，并完全寄望于那将要临到你们的喜乐，那在主第二次降临时所赐予的喜乐，他之前已略微提及过（彼得前书 1:7）。
  - type: paragraph
    text:
      ru: 1Пет.1:13.Посему, (возлюбленные,)препоясав чресла ума вашего, бодрствуя, совершенно уповайте на подаваемую вам благодать в явлении Иисуса Христа.
      cn: (彼得前书 1:13) 所以要束上你們思想的腰，謹慎自守，盼望耶穌　基督顯現的時候所帶來給你們的恩，一直到底；
  - type: paragraph
    text:
      ru: 1Пет.1:14.Как послушные дети, не сообразуйтесь с прежними похотями, бывшими в неведении вашем,
      cn: (彼得前书 1:14) 你們既作順命的兒女，就不要效法從前蒙昧無知的時候那放縱私慾的樣子。
  - type: paragraph
    text:
      ru: 1Пет.1:15.но, по примеру призвавшего вас Святаго, и сами будьте святы во всех поступках.
      cn: (彼得前书 1:15) 那召你們的既是聖潔，你們在一切行為上也要聖潔。
  - type: paragraph
    text:
      ru: '1Пет.1:16.Ибо написано: будьте святы, потому что Я свят.'
      cn: (彼得前书 1:16) 因為經上記著說：「你們要聖潔，因為我是聖潔的。」
  - type: paragraph
    text:
      ru: Сообразованным апостол называет увлечение настоящими обстоятельствами. Ибо и ныне некоторые безумцы говорят, что нужно приноравливаться к обстоятельствам. Но поскольку отдавать себя в волю обстоятельств легкомысленно, то апостол заповедует, чтобы они, в ведении ли, или в неведении придерживались этого доселе, но отныне сообразовались с Призвавшим их, Который воистину Свят, и сами делались святыми.
      cn: 使徒称『与世俗同化』乃是对现时境况的痴迷。因为甚至如今，一些愚人仍说，人必须顺应境况。但因为将自己交付境况的摆布是轻率之举，故使徒诫命，让他们无论在明知或无知中迄今仍依附于此，但从今以后，当效法那召叫他们者，祂是真正圣洁的，并且他们自己也成为圣洁的。
  - type: paragraph
    text:
      ru: 1Пет.1:17.И если вы называете Отцем Того, Который нелицеприятно судит каждого по делам, то со страхом проводи́те время странствования вашего,
      cn: (彼得前书 1:17) 你們既稱那不偏待人，按各人行為審判人的主為　父，就當存敬畏的心度你們在世寄居的日子，
  - type: paragraph
    text:
      ru: 1Пет.1:18.зная, что не тленным серебром или золотом искуплены вы от суетной жизни, преданной вам от отцов,
      cn: (彼得前书 1:18) 知道你們得贖，脫去你們祖宗遵照遺傳所傳流虛妄的行為，不是憑著能壞的金銀等物，
  - type: paragraph
    text:
      ru: 1Пет.1:19.но драгоценною Кровию Христа, как непорочного и чистого Агнца,
      cn: (彼得前书 1:19) 乃是憑著　基督的寶血，如同無瑕疵、無玷污的綿羊羔之血。
  - type: paragraph
    text:
      ru: 'Писание различает двоякий страх, один – первоначальный, другой – совершенный[1]. Страх первоначальный, он же и основный, состоит в том, когда кто-нибудь обращается к честной жизни из боязни ответственности за свои дела, а совершенный – в том, когда кто для совершенства любви к другу, для ревности любимому, боится, чтобы не остаться пред ним в долгу ничем, что требуется сильной любовью. Пример первого, то есть первоначального страха находится в словах псалма:«да боится Господа вся земля»(Пс. 32, 8); то есть те, которые нисколько не заботятся о небесном, а только суетятся о земном. Ибо что им придется потерпеть, когда Господь«восстанет сокрушить землю»(Ис. 2, 19, 21). Пример второго, то есть совершенного, страха можно находить также у Давида, например в следующих словах:«бойтесь Господа, [все] святые Его, ибо нет скудости боящимся Его»(Пс. 33, 10). и еще в словах:«страх Господень чист, пребывает вовек»(Пс. 18, 10). В таком совершенном страхе жить убеждает апостол Петр тех, которые слушают его, и говорит: по неизреченному милосердию Создателя Бога вы приняты в число детей Его; посему всегда пусть с вами будет этот страх, так как вы стали такими по любви Творца своего, а не по делам своим. Много доводов употребляет апостол при убеждении. Он убеждает, во-первых, тем, что в нашем спасении принимают искреннее и живое участие ангелы; во-вторых, изречениями священного Писания; в-третьих, необходимостью: ибо кто называет Бога Отцом, тот, чтобы удержать за собой право усыновления, необходимо должен творить достойное Этого Отца; и, в-четвертых, тем, что они получили бесчисленные блага чрез внесенную за них цену, то есть Кровь Христову, пролитую в выкуп за грехи людей. Посему заповедует им во все время жизни иметь спутником этот совершенный страх. Ибо люди, стремящиеся к совершенству, всегда боятся, чтобы не остаться без какого-нибудь совершенства. Примечай. Христос сказал, что Отец не судит никого, но«весь суд отдал Сыну»(Ин. 5, 22), но апостол Петр говорит теперь, что Отец судит. Как же это? На это отвечаем также словами Христа:«Сын ничего не может творить Сам от Себя, если не увидит Отца творящего»(Ин. 5, 19). Из этого же видно единосущие святой Троицы, совершенное в Ней тождество, и мирное и невозмутимое согласие.«Отец судит»– сказано безразлично, потому что все, что скажет кто-нибудь об Одном из трех Лиц, должно относить обще ко всем Им. С другой стороны, поскольку Господь и апостолов называет«Дети!"(Ин. 13, 33) и расслабленному говорит:«чадо! прощаются тебе грехи твои»(Мк. 2, 5), то нет никакой несообразности, что и Он называется Отцом тех, которых Он возродил, сообщив им святость.'
      cn: 圣经区分两种敬畏，一种是初始的，另一种是完全的[1]。初始的敬畏，也是基本的敬畏，是指当一个人因惧怕对其行为的责任，而转向正直的生活；而完全的敬畏，是指一个人为了朋友之爱的完全，为了对所爱之人的热切，唯恐自己在他面前，在强烈的爱所要求的一切上，不留下任何亏欠。第一个，即初始的敬畏的例子，见于圣咏的这些话语：「愿全地都敬畏上主」（诗篇 32:8）；即那些丝毫不顾念天上之事，只为地上之物奔波劳碌之人。因为当上主「兴起震动大地」（以赛亚书 2:19，21）时，他们将要承受什么呢？第二个，即完全的敬畏的例子，也可以在大卫那里找到，例如以下的话语：「上主的众圣者啊，你们当敬畏上主，因为敬畏祂的，一无所缺」（诗篇 33:10）。又有话语：「上主的敬畏是洁净的，存留直到永远」（诗篇 18:10）。使徒彼得劝导那些听他话语的人，要活在这种完全的敬畏之中，他说：你们因着创造者上帝那不可言喻的怜悯，被接纳为祂的儿女；因此，愿这敬畏常与你们同在，因为你们成为这样是出于你们创造者的爱，而非出于你们的作为。使徒在劝导时运用了许多理由。首先，他劝导说，天使们真诚而活泼地参与了我们的救赎；其次，藉着圣经的训示；第三，藉着必要性：因为凡称上帝为父的，为了保有被收纳为嗣子的权利，就必须行出与这位父相称的事；第四，藉着他们因所付出的代价，即为赎人类罪孽而流出的基督之血，获得了无数的恩惠。因此，他吩咐他们要让这完全的敬畏成为他们一生中的伴侣。因为那些追求完全的人，总是担心自己会缺少任何一种完全。请注意。基督曾说，父不审判任何人，而是「将一切审判都交给了子」（约翰福音 5:22），但使徒彼得现在却说，父审判。这如何解释呢？我们同样用基督的话语来回答：「子凭着自己什么都不能做，除非祂看见父在做」（约翰福音 5:19）。从这之中，可见圣三一的同质性，祂们之内完全的同一性，以及平和且不紊乱的合一。「父审判」——这样说是无差别的，因为凡人所说的关于三位格中任何一位的，都应普遍地归于祂们全体。另一方面，既然上主也称使徒们为「孩子们！」（约翰福音 13:33），又对瘫痪者说：「孩子啊！你的罪赦了」（马可福音 2:5），那么，祂被称为那些祂藉着赐予圣洁而重生之人的父，也毫无不妥之处。
  - type: paragraph
    text:
      ru: 1Пет.1:20.Предназначенного еще прежде создания мира, но, явившегося в последние времена для вас,
      cn: (彼得前书 1:20) 他在創世以前固然是預先被　上帝所定的，卻在這末時才為你們顯現，
  - type: paragraph
    text:
      ru: 1Пет.1:21.уверовавших чрез Него в Бога, Который воскресил Его из мертвых, и дал Ему славу,
      cn: (彼得前书 1:21) 你們也因著他，信那叫他從死裏復活、又給他榮耀的　上帝，叫你們的信心和盼望都在於　上帝。
  - type: paragraph
    text:
      ru: Сказав о смерти Христовой, апостол присоединил к этому слово и о воскресении. Ибо опасается, чтобы новообращенные не преклонились опять к неверию из-за того, что страдания Христовы уничижительны. Прибавляет он и то, что таинство Христово не ново (потому что неразумных и это возмущает), но от начала, прежде создания мира, сокрыто было до приличного ему времени. Впрочем, оно явлено было и пророкам, которые изыскивали это, как немного выше сказал. И теперь говорит, что предназначенное прежде создания мира ныне явлено или совершилось. И для кого совершилось? Для вас. Ибо для вас, говорит, Бог воскресил Его из мертвых. К чему же для вас? Для того, чтобы, очистив себя послушанием истине чрез Духа, вы имели веру и упование на Бога. Почему«очистив»? Потому, что веруя в Того, Кто воскресением из мертвых положил начало вашей нетленной жизни, вы и сами должны:«ходить в обновленной жизни»(Рим. 6, 4), по примеру Призвавшего вас к нетлению. Не смущайся тем, что здесь апостол Петр и неоднократно апостол Павел говорит, что Господа«воскресил»Отец (Деян. 13, 37, 31). Так говорит он, употребляя обычный образ учения. Но выслушай, как Христос говорит, что Он Сам Себя воскресил. Он говорил:«разрушьте храм сей, и Я в три дня воздвигну его»(Ин. 2, 19). И в другом месте:«имею власть отдатьжизнь,и власть имею опять принять ее»(Ин. 10, 18). Не без цели усвояется воскресение Сына Отцу; ибо сим показывается единое действие Отца и Сына.
      cn: 提及基督之死后，使徒又将复活之道附于其上。因为他唯恐新近归主者因基督所受之苦是卑微的，再次倾向不信。他又补充说，基督之奥秘并非新鲜事物（因为这亦会困扰不明事理者），而是从起初，在创世以先，便已隐藏，直至其合宜之期。然而，这奥秘也曾显现给先知们，他们曾寻求探究此事，正如他稍早所言。而今，他言说那在创世以先所预定之事现已显明或成就。又是为谁成就的呢？是为你们。因为，他说，上帝为你们使祂从死里复活。那么，是为着你们的什么呢？是为着你们藉着圣灵顺从真理，洁净了自己，就能对上帝怀有信心与盼望。为何是「洁净了」呢？因为，你们信靠那位藉着从死里复活，为你们不朽坏的生命奠定开端者，你们自己也当「在生命的新样中生活」（罗马书 6:4），效法那召你们进入不朽坏者。不要为此困扰，以为使徒彼得和使徒保罗在此及多处言及，上主是为父所「复活」的（使徒行传 13:37，31）。他如此言说，是采用了寻常的教导方式。然而，请听基督如何言说祂亲自使自己复活。祂曾说：「你们拆毁这殿，我三日内要再建立起来」（约翰福音 2:19）。又在另一处：「我有权柄舍弃生命，也有权柄再取回来」（约翰福音 10:18）。将圣子之复活归于圣父并非无故；因为这显明了圣父与圣子是同一作为。
  - type: paragraph
    text:
      ru: чтобы вы имели веру и упование на Бога.
      cn: 使你们对上帝有信心和仰望。
  - type: paragraph
    text:
      ru: 1Пет.1:22.Послушанием истине чрез Духа, очистив души ваши к нелицемерному братолюбию, постоянно люби́те друг друга от чистого сердца,
      cn: (彼得前书 1:22) 你們既因藉著　靈順從真理，潔淨了自己的心，以致愛弟兄沒有虛假，就當以純淨的心彼此切實相愛。
  - type: paragraph
    text:
      ru: 'Сказав, что христиане возрождены не от тленного семени, но от нетленного, словом Божиим живым и пребывающим вовеки, апостол выставляет на вид ничтожность и крайнюю непрочность славы человеческой, побуждая тем слушателя сильнее держаться прежде преподанного учения, так как оно постоянно и простирается навек, а земное скоро истлевает по самому существу. Для подтверждения сего здесь приводятся«трава"и«цвет на траве», слабейший по бытию, нежели«трава»; им и Давид уподобляет нашу жизнь (Пс. 102, 15). Показав малоценность славы нашей, апостол снова возвращается к объяснению того, что же именно возродило их словом Божиим, живым и пребывающим вовек, и говорит: это есть то слово, которое вам проповедано. Утверждает о сем слове, что оно пребывает вовек, потому что и Сам Господь сказал:«небо и земля прейдут, но слова Мои не прейдут»(Мф. 24, 35). Должно знать, что слова«к нелицемерному братолюбию»нужно читать в таком порядке: от чистого сердца любите друг друга постоянно, к нелицемерному братолюбию. Ибо окончание дела обыкновенно следует за тем, что производилось для него. А как за постоянной любовью друг к другу от чистого сердца следует нелицемерное братолюбие; то справедливо, чтобы слова«от чистого сердца»и прочие стояли впереди, а слова«нелицемерное братолюбие»после них. Нужно заметить и то, что предлог«к"(είς) должно принимать вместо предлога «по причине, для» (διά).'
      cn: '使徒说，基督徒重生并非借着会朽坏的种子，而是借着不会朽坏的，即借着活泼长存的上帝之道。使徒以此指出人类荣耀的虚无和极度脆弱，从而激励听者更坚固地持守先前所传的教导，因为这教导是恒常的，且永无穷尽，而地上的事物按其本质而言很快就会朽坏。为证实此点，此处引用了「草」和「草上的花」，后者在存在上比「草」更为脆弱。大卫也以此比喻我们的生命（诗篇 102:15）。在指出我们荣耀的微不足道之后，使徒再次回到解释究竟是什么借着活泼长存的上帝之道使他们重生，并说：「这正是那传给你们的道。」他肯定这道是永存的，因为上主自己也曾说：「天地要废去，我的话却不能废去」（马太福音 24:35）。


        应当知道，「至于无伪的弟兄之爱」这句话应按以下顺序理解：你们要从清洁的心，恒久地彼此相爱，以至于无伪的弟兄之爱。因为事情的结局通常是跟着为之所做的工而来的。既然无伪的弟兄之爱是发自清洁之心的恒久彼此相爱所随之而来的；那么，「从清洁的心」等词语置于其前，而「无伪的弟兄之爱」等词语置于其后，是恰当的。此外还应注意，「к」 (εις) 这个前置词应当理解为「因为，为了」 (δια) 这个前置词的含义。'
  - type: paragraph
    text:
      ru: 1Пет.1:23.каквозрожденные не от тленного семени, но от нетленного, от слова Божия, живаго и пребывающего вовек.
      cn: (彼得前书 1:23) 你們蒙了重生，不是由於能壞的種子，乃是由於不能壞的種子，是藉著　上帝活潑永存的道。
  - type: paragraph
    text:
      ru: '1Пет.1:24.Ибо всякая плоть – как трава, и всякая слава человеческая – как цвет на траве: засохла трава, и цвет ее опал;'
      cn: (彼得前书 1:24) 因為凡有血氣的，盡都如草；他的美榮都像草上的花。草必枯乾，花必凋謝；
  - type: paragraph
    text:
      ru: 1Пет.1:25.но слово Господне пребывает вовек; а это есть то слово, которое вам проповедано.
      cn: (彼得前书 1:25) 唯有　主的道是永存的。所傳給你們的福音就是這道。
  - type: paragraph
    text:
      ru: Апостол показал преимущество духовного возрождения пред рождением плотским, и выставил на вид малоценность славы смертной, именно, что рождение соединено с растлением и нечистотой, а слава не отличается ничем от весенних растений, между тем как слово Господне ничего такого не испытывает. Ибо всякое мнение человеческое скоро прекращается, а слово Божие не так, оно имеет вечное пребывание. С такой целью у него прибавлено:«то слово, которое вам проповедано».
      cn: 使徒显明了属灵的重生对比肉身的出生的优越性，并揭示出必死之荣耀的微不足道，确切地说，即是出生与败坏和不洁相连，而荣耀则与春天的植物毫无二致，然而上主的话绝无此类经历。因为凡人的意见很快就终止，而上帝的话并非如此，它拥有永远的存留。出于此目的，他补充道：「就是那传给你们的道。」
- type: heading1
  text:
    ru: Глава вторая
    cn: 第二章
  children:
  - type: paragraph
    text:
      ru: 1Пет.2:1.Итак, отложив всякую злобу и всякое коварство, и лицемерие, и зависть, и всякое злословие,
      cn: (彼得前书 2:1) 所以，你們既除去一切的惡毒、詭詐，並偽善、嫉妒，和一切毀謗的話，
  - type: paragraph
    text:
      ru: 1Пет.2:2.как новорожденные младенцы, возлюби́те чистое словесное молоко, дабы от него возрасти вам во спасение;
      cn: (彼得前书 2:2) 就要愛慕那純淨話語的靈奶，像才生的嬰孩愛慕奶一樣，叫你們因此漸長。
  - type: paragraph
    text:
      ru: 1Пет.2:3.ибо вы вкусили, что благ Господь.
      cn: (彼得前书 2:3) 因為你們已經體驗過　主是滿有恩典的。
  - type: paragraph
    text:
      ru: 1Пет.2:4.Приступая к Нему, камню живому, человеками отверженному, но Богом избранному, драгоценному,
      cn: (彼得前书 2:4) 主乃活石，固然是被人所棄的，卻是被　上帝所揀選、所寶貴的。
  - type: paragraph
    text:
      ru: 1Пет.2:5.и сами, как живые камни, устрояйте из себя дом духовный, священство святое, чтобы приносить духовные жертвы, благоприятные Богу Иисусом Христом.
      cn: (彼得前书 2:5) 你們來到主面前，也就像活石，被建造成為靈宮，作聖潔的祭司，藉著耶穌　基督奉獻　上帝所悅納的靈祭。
  - type: paragraph
    text:
      ru: '1Пет.2:6.Ибо сказано в Писании: вот, Я полагаю в Сионе камень краеугольный, избранный, драгоценный; и верующий в Него не постыдится.'
      cn: (彼得前书 2:6) 所以，聖經上也說：「看哪，我把所揀選、所寶貴的房角石安放在錫安；信靠他的人必不至於抱愧。」

        看哪！我将要在锡安安设一块房角石，是蒙拣选的，是宝贵的；凡信靠祂的，必不蒙羞。'
  - type: paragraph
    text:
      ru: Итак, говорит,«отложив всякую злобу и всякое коварство, и лицемерие, и зависть, и всякое злословие». Этими немногими словами он обнимает все множество и разнообразие зла. Ибо возрожденные к нетленной жизни не должны впадать в сети злобы и предпочитать несуществующее действительному. Ибо зло не есть сущность, но заключается в погрешности рожденной сущности. А большое различие между жизнью самоличной и тем, что только сопривходит к ней. Они, говорит, должны явиться свободными от коварства и лицемерия и зависти и всякого злословия. Ибо коварство и злословие далеки от истины и проповеданного вам учения. Коварство ищет погибели обманываемого им, лицемерие преуспевает в разности с действительностью, между тем спасительное учение, которым вы оглашены, преуспевает в противоположном. А какое место в вас зависти и злословию, – в вас, которые, связуясь неразрывным союзом братолюбия, можете не потерпеть вреда ни от кого из разлучающих вас? Что зависть и злословие служат причиной ссоры и взаимной ненависти, этого не знает разве тот, кто не знает печальной истории Каина, который через зависть разорвал братский союз, затем впал в коварство, лицемерие и убийство (Быт. 4). А что завистливый нечист от злословия, в этом можно удостовериться из примера братьев Иосифа, которые весьма много наговаривали на него отцу своему (Быт. 37). Посему, говорит, очистившись от всех этих зол, приступите как новорожденные младенцы,«ибо таковых, – сказал Господь, –есть Царствие Божие»(Лк. 18, 16). И, питаясь бесхитростным учением, растите в«меру полного возраста Христова»(Еф. 4, 13);«Ибо вы вкусили», то есть чрез упражнение в священных заповедях евангельских вы осязательно узнали, сколь благо это учение. А чувство в деле знания сильнее всякого слова, как и испытываемое на деле приятнее всякого слова. Итак, опытно познав на себе благость Господа, и сами показывайте доброту и милость друг другу, и возложите себя на живой краеугольный камень, человеками отверженный, но Богом почтенный и избранный, и сущий и пророками предсказанный. Теснее дружитесь между собой чрез единение любви, и сочленяйтесь в полноту духовного дома, нимало не заботясь о презрении со стороны людей, потому что ими отвержен и краеугольный камень – Христос. Достигнув единомыслия между собой, и устроивши из себя духовный дом, и приобретши святое священство, приносите жертвы духовные. И не думайте, что можете приносить Богу жертвы непорочные тогда, когда не храните между собой союза любви. Воздевайте, сказано,«чистые руки без гнева и сомнения»(1Тим. 2, 8); как же желающий соединиться с Богом чрез молитву достигнет сего, когда сам отторгает себя от своего брата чрез гнев и злые сомнения?
      cn: 所以，他说，「除掉一切的恶毒、诡诈、虚伪、嫉妒，和一切毁谤的话」。他用这寥寥数语，便涵盖了诸恶的繁多与各异。因为那些蒙再生，得享不朽生命的人，不应落入恶毒的网罗，并偏爱虚无而非真实。因为恶并非本质，而是存在于受造本质的偏离之中。而自生自存的生命，与仅仅附随于其的事物之间，存在巨大差异。他说，他们应显明自己免于诡诈、虚伪、嫉妒和一切毁谤。因为诡诈和毁谤，与真理及传授给你们的教训相去甚远。诡诈寻求其所欺骗之人的毁灭，虚伪则因与现实相悖而兴盛，然而，你们所领受的救赎教训，却在相反的方面兴盛。那么，嫉妒和毁谤在你们里面，还有何立足之地呢？——在你们这些因弟兄相爱的不可拆散的结合而联结的人之中，又怎会受任何企图分裂你们之人所害呢？嫉妒和毁谤乃是争吵与互相憎恨的根源，这一点，除了那些不了解该隐悲惨故事的人，谁会不知道呢？他因嫉妒而撕裂了兄弟之情，随后便陷入诡诈、虚伪和谋杀之中（创世记 4）。至于嫉妒之人不免于毁谤，这一点可从约瑟兄弟的例子中得到证实，他们曾向自己的父亲说了他许多坏话（创世记 37）。因此，他说，你们既已洁净自己脱离这一切邪恶，就当如同初生的婴孩，前来靠近，「因为在这样的人，上帝的国是他们的。」（路加福音 18:16）并且，以纯朴的教训为食，成长，以达到「基督丰满长成的身量」。（以弗所书 4:13）「因为你们已经尝过」，这就是说，借着实践神圣的福音诫命，你们真实地认识到这教训是何等美好。而知识之事中的感受，胜过一切言语，正如实际体验到的，也比任何言语更令人愉悦。所以，你们既然亲自体验到上主的良善，自己也要彼此彰显良善和怜悯，并将自己安置在那块活的房角石上，就是那被人弃绝，却为上帝所尊崇和拣选，且是真实存在，并为众先知所预言的。借着爱的合一，彼此更加亲密地结合，并结合为灵性居所的完全，丝毫不要顾虑来自世人的藐视，因为那房角石——基督，也曾被他们弃绝。你们彼此达成一致思想，并从自身建造起一座灵性居所，且获得圣洁的司祭职分，便当献上灵性的祭品。不要以为，当你们彼此不维系爱的结合时，便能向上帝献上无瑕的祭品。经上说，「要举起圣洁的手，没有忿怒和疑惑。」（提摩太前书 2:8）那么，一个渴望借着祷告与上帝结合的人，又怎能达到这一点呢，当他自己却因忿怒和邪恶的疑惑，将自己与弟兄隔绝？
  - type: paragraph
    text:
      ru: 1Пет.2:7.Итак Он для вас, верующих, драгоценность, а для неверующих камень, который отвергли строители, но который сделался главою угла, камень претыкания и камень соблазна,
      cn: (彼得前书 2:7) 所以，他在你們信的人就為寶貴；在不順從的人，就為匠人所棄的石頭，正作了房角的頭塊石頭，
  - type: paragraph
    text:
      ru: 1Пет.2:8.о который они претыкаются, не покоряясь слову,
      cn: (彼得前书 2:8) 又作了絆腳的石頭，跌人的磐石，正是那些既不順從，就在道理上絆跌之人；他們這樣絆跌也是預定的。
  - type: paragraph
    text:
      ru: 'Неверующим Бог и ныне говорит следующее: Я полагаю вам в Сионе камень претыкания и камень соблазна. Он бывает камнем претыкания для неверующих, которые и претыкаются, не покоряясь слову, на что они и положены. Полная мысль – такая: вот, Я полагаю в Сионе камень краеугольный, драгоценный, избранный; и верующий в Него не постыдится; для вас, верующих, драгоценный, а для неверующих – камень претыкания. Они претыкаются о слово Евангелия,'
      cn: 对不信者，上帝如今仍然如此说：「我在锡安给你们安放一块绊脚石和一块使人跌倒的石头。这对他不信者而言是一块绊脚石，他们不顺从圣言，因此跌倒，这正是他们所被命定的。这完整的思想是这样的：看哪，我把一块房角石，宝贵的，蒙拣选的，安放在锡安；信祂的人必不蒙羞；对你们信者而言，祂是宝贵的，而对不信者而言，祂是绊脚石。他们因着福音的圣言而跌倒，
  - type: paragraph
    text:
      ru: на что они и оставлены.
      cn: 他们正是为此而被留下。
  - type: paragraph
    text:
      ru: Сим не то говорится, будто они определены на это от Бога. Ибо от Того, Кто«хочет, чтобы все люди спаслись»(1Тим. 2, 4), никак не может быть причины погибели. Но как они сами из себя устроили сосуды гнева, присовокупив к сему еще непокорность, то какое положение сами себе приготовили, в том и оставлены. Ибо если человек, как существо разумное, сотворен свободным, и свободу принуждать нельзя, то несправедливо было бы обвинять Того, кто отдает человеку ту именно честь, какую он сам себе приготовил своими делами. Христос назван краеугольным камнем потому, что Он обе стены, составляющие духовный дом, то есть язычников и иудеев, соединяет Своими объятиями и связывает в одно согласие, уничтожая бесполезные жертвы одних, и пременяя в благочестие бесовское суеверие других.
      cn: 这并非是说他们被上帝预定为此。因为从那位「愿所有的人都得救」（提摩太前书 2:4）的上帝那里，绝不可能有导致灭亡的原因。但既然他们自己从自身造就了愤怒的器皿，又在此之上添上了悖逆，那么他们为自己预备了怎样的境况，就在那境况中被任凭了。因为，如果人作为理性的受造物，被造是自由的，且自由是不能被强迫的，那么，若指责那位将人自己以其行为所预备的尊荣归予人的上帝，便是不公义的。基督被称为房角石，因为祂将构成属灵居所的两面墙，即外邦人和犹太人，以祂的怀抱联合，并联结成一个合一，同时废除其中一些人无益的献祭，并将另一些人魔鬼般的迷信转变为敬虔。
  - type: paragraph
    text:
      ru: 1Пет.2:9.Но вы – род избранный, царственное священство, народ святой, люди, взятые в удел, дабы возвещать совершенства Призвавшего вас из тьмы в чудный Свой свет;
      cn: (彼得前书 2:9) 唯有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是特選的子民；要叫你們傳揚讚美他，就是那召你們出黑暗進入他奇妙之光的。
  - type: paragraph
    text:
      ru: 1Пет.2:10.некогда не народ, а ныне народ Божий;некогданепомилованные, а ныне помилованы.
      cn: (彼得前书 2:10) 你們從前算不得子民，現在卻作了　上帝的子民；從前未曾蒙憐恤，現在卻蒙了憐恤。
  - type: paragraph
    text:
      ru: 'Не одобрив худое поведение неверующих, сказав, что они сами стали виновны в своем неверии, апостол переходит теперь к одобрению правильно поступивших и говорит: вы, поступившие правильно, – род избранный, царственное священство. Он как бы так говорит: те по своей жестокости и упорству преткнулись о краеугольный камень, а не вошли вместе с ним в состав здания; вы же чрез свою благопокорность стали частью царственного священства, как род избранный, как народ святый. Впрочем, чтобы не расслабить их лишней похвалой и чтобы они не подумали, что стали народом святым по наследству, что удостоились такой чести потому, что происходят от Авраама и никогда не претыкались, апостол, дабы удержать их от такой мысли, прибавляет и говорит: не думайте много о роде; вы избраны в царственное священство не ради Авраама, ибо происшедшие от него имели священство, отдельное от царства; вы народ святой и род избранный и назначены в царственное священство не ради Авраама, но ради Христа, Который назван и«священником по чину Мелхиседекову»(Пс. 109, 4). И«Царемкротким,праведными спасающим» (Зах. 9, 9). Итак, от Него, имевшего и то и другое (и священство и царство), вы, возрожденные чрез святое крещение, справедливо называетесь и родом избранным и царственным священством. Это вы имеете по милости Его, призвавшего вас из тьмы в чудный Свой свет, посему делами света возвещайте совершенства Его и прочим людям. Это, говорит, вы имеете по Его человеколюбию. Посему к вам прилично приложить сказанное:«некогда не народ, а ныне народ Божий; некогда непомилованные, а ныне помилованные»(ср.Ос. 2, 23). Чтобы речь эта не показалась тяжелой, он укоризненные слова приводит из пророка Осии. Итак, возвещайте совершенства Его своею добродетелью. А как им возвещать их? Этому научает сам Господь, когда говорит:«так пусть светит свет ваш пред людьми, чтобы они видели ваши добрые дела, и прославляли Отца вашего Небесного»(Мф. 5, 16).«Люди, взятые в удел»(είςπεριποίησιν), то есть народ взятый во владение, или в наследство. Ибо создание Божие – все, а удел Божий – одни только те, которые удостоились этого за свою добродетель.'
      cn: 使徒不赞成不信之人的恶劣行为，认为他们自己要为他们的不信负责；他现在转而称赞那些行事正确的人，他说：「你们，行事正确的人，是蒙拣选的族类，是君尊的祭司。」他仿佛是这样说的：那些人因着他们的残忍和顽固，在房角石上跌倒了，没有与它一同构成建筑的一部分；而你们因着你们的顺服，成为了君尊祭司职分的一部分，作为蒙拣选的族类，作为圣洁的国民。然而，为了不让他们因过度的称赞而松懈，为了不让他们以为自己是因世袭而成为圣洁的国民，以为他们因源自亚伯拉罕且从未跌倒而获得此等荣耀，使徒为制止他们产生这种想法，又补充说：「不要过分看重自己的族裔；你们被拣选成为君尊的祭司，并非因着亚伯拉罕，因为凡出自他的人，其祭司职分是与王权分离的；你们是圣洁的国民，蒙拣选的族类，被委任为君尊的祭司，并非因着亚伯拉罕，而是因着基督，祂被称为『照着麦基洗德的等次永远为祭司』（诗篇 109:4），又被称为『公义并施行拯救的谦和之君』（撒迦利亚书 9:9）。」因此，从祂，那位同时拥有这二者（祭司职分和王权）的你们，这些借由圣洗而重生的人，理所当然地被称为蒙拣选的族类和君尊的祭司。你们拥有这一切是因着祂的恩典，祂曾召你们出黑暗入祂奇妙的光明，因此，要藉着光明的行为，向其余的人宣扬祂的完美。他说，你们拥有这一切是因着祂的爱人。因此，将所说的话应用于你们是恰当的：「从前不是我的子民，现在却是上帝的子民；从前未蒙怜恤，现在却蒙了怜恤」（参何西阿书 2:23）。为了不让这段话显得沉重，他引用了先知何西阿书中的责备之语。因此，要藉着你们的德行宣扬祂的完美。他们又如何宣扬呢？主亲自教导了这一点，祂说：「你们的光也当这样照在人前，叫他们看见你们的好行为，便将荣耀归与你们在天上的父」（马太福音 5:16）。「被拣选的子民」（希腊文 εις περιποίησιν），也就是说，被视为产业或继承的国民。因为所有的受造物都属上帝，而上帝的产业，仅限于那些因着自己的德行而配得此份的人。
  - type: paragraph
    text:
      ru: 1Пет.2:11.Возлюбленные! прошу вас, как пришельцев и странников, удаляться от плотских похотей, восстающих на душу,
      cn: (彼得前书 2:11) 親愛的弟兄啊，你們是客旅，是寄居的。我勸你們要禁戒肉體的私慾；這私慾是與元魂爭戰的。
  - type: paragraph
    text:
      ru: 1Пет.2:12.и провождать добродетельную жизнь между язычниками,
      cn: (彼得前书 2:12) 你們在外邦人中，應當品行端正，叫那些毀謗你們是作惡的，因看見你們的好行為，便在鑒察的日子歸榮耀給　上帝。
  - type: paragraph
    text:
      ru: У учителей веры есть обычай к догматическому учению присовокуплять уроки нравственности. Так поступает теперь и святой апостол Петр. Он называет их «возлюбленными», а не просто любезными, потому что они приятны ему во всех отношениях; ибо приятные в одном только каком-либо отношении называются любезными, а не возлюбленными. Говорит он, что плотские похоти восстают на душу, потому что, и по словам блаженного апостола Павла,«плоть желает противного духу»(Гал. 5, 17), ибо желания плоти вращаются около чувственных наслаждений и чрез то помрачают память и порабощают душу.
      cn: 信德的导师们有一个习俗，就是在教义教导中附上道德训诫。圣使徒彼得现在也是如此行。他称他们为「蒙爱者」，而非仅仅是「可喜者」，因为他们在所有方面都令他欣喜；因为那些仅在某一特定方面令人欣喜的人，才被称为「可喜者」，而非「蒙爱者」。他说，肉体的私欲起来攻击灵魂，因为，按着福哉的使徒保罗的话，「情欲与圣灵相争」(加拉太书 5:17)，因为肉体的欲望围绕着感官的享乐打转，并借此蒙蔽记忆，奴役灵魂。
  - type: paragraph
    text:
      ru: дабы они за то, за что злословят вас, как злодеев, увидя добрые дела ваши, прославили Бога в день посещения.
      cn: 好使他们，就着他们诽谤你们如同恶人的事，借由看见你们的美善之行，在眷顾之日荣耀上帝。
  - type: paragraph
    text:
      ru: Злословящими нас апостол называет язычников, а днем посещения – наследование по законам мира сего. Ибо когда они исследуют нашу жизнь и находят, что их понятие о нас противоречит действительности, то сами исправляются в постыдных делах своих и таким образом прославляют Бога.
      cn: 使徒称毁谤我们的人为外邦人，而称访问之日为按今世律法所得的产业。因为当他们审视我们的生活，并发现他们对我们的看法与事实不符时，他们便在自己可耻的行为上纠正过来，并以此方式荣耀上帝。
  - type: paragraph
    text:
      ru: '1Пет.2:13.Итак будьте покорны всякому человеческому начальству, для Господа: царю ли, как верховной власти,'
      cn: (彼得前书 2:13) 你們為　主的緣故，要順服人的一切制度，或是在上的君王，
  - type: paragraph
    text:
      ru: 1Пет.2:14.правителям ли, как от него посылаемым для наказания преступников и для поощрения делающих добро, –
      cn: (彼得前书 2:14) 或是君王所派罰惡揚善的臣宰。
  - type: paragraph
    text:
      ru: 1Пет.2:15.ибо такова есть воля Божия, чтобы мы, делая добро, заграждали уста невежеству безумных людей, –
      cn: (彼得前书 2:15) 因為　上帝的旨意原是要你們行善，可以堵住那糊塗無知人的口。
  - type: paragraph
    text:
      ru: 'Человеческим созданием называет начальников, поставленных царями, и даже самих царей, поскольку и они избираются или поставляются людьми, а писание называет иногда созданием и установление, как, например, в следующем месте:«дабы из двух создать одного нового человека»(Еф. 2, 15). Итак, говорит, будьте покорны мирским начальникам, но будьте покорны для Господа, как Господь заповедал. Что же Господь заповедал?«Отдавайте кесарево кесарю, а Божие Богу»(Мф. 22, 21). Посему, если они приказывают что-либо противное установлению Божию, им не должно повиноваться. Так заповедовал Христос; то же заповедует теперь и ученик Его. Это для того, чтобы язычники не могли говорить, будто христианство привносит ниспровержение жизни гражданской, будто в нем причина неурядицы и возмущения.«Для Господа». Делает это прибавление и для верных. Некоторые из них могли сказать: сам же апостол обещает нам Царство Небесное (1Петр. 1, 4), и чрез то приписывает нам великое достоинство. Зачем же опять унижает нас, подчиняя нас мирским начальникам? Итак, если кто-нибудь скажет это, тот пусть знает, говорит, что эта заповедь не от меня собственно, но от Самого Господа. Сам апостол Петр и указал, которым и каким начальникам должно повиноваться, именно тем, которые воздают должное. Прибавляет и причину: во-первых, такова воля Божия; во-вторых, наша покорность начальникам доказывает наше благоповедение и, сверх сего, посрамляет неверных. Ибо когда они злословят нас как гордых, а видят, что мы смиренны и, в чем следует, покорны, то чрез это более пристыжаются.'
      cn: 它称那些由君王所设立的官员，甚至君王本身为人的受造物，因为他们也是由人拣选或设立的。圣经有时也将设立本身称为受造物，例如在以下经文：「好使这两个成为一个新人」（以弗所书 2:15）。于是，他说，你们要顺服世俗的官员，但你们要为主而顺服，正如主所命令的。那么主命令了什么呢？「凯撒的物当归给凯撒，上帝的物当归给上帝」（马太福音 22:21）。因此，如果他们命令任何与上帝的设立相悖的事，就不应顺从他们。基督如此命令了；祂的门徒现在也命令着同样的事。这是为了使外邦人不能说，仿佛基督教带来了对公民生活的颠覆，仿佛它是不安和叛乱的原因。「为主」。他也为信徒们加上了这一句。他们中有些人可能会说：使徒自己向我们应许天国（彼得前书 1:4），并借此赋予我们极大的尊严。那么为何又贬低我们，使我们顺服于世俗的官员呢？于是，如果有人说这话，他就当知道，他说，这条诫命并非源于我本身，而是源于主自己。使徒彼得本人也指明了，应当顺服哪类官员和怎样的官员，即那些公正行事的人。他也加上了原因：首先，这是上帝的旨意；其次，我们对官员的顺服证明了我们的良好行为；并且，除此之外，它使不信者蒙羞。因为当他们诽谤我们是骄傲的，却看到我们是谦卑的，并在当顺服之处是顺从的，那么他们会因此更加羞愧。
  - type: paragraph
    text:
      ru: 1Пет.2:16.как свободные,
      cn: (彼得前书 2:16) 你們雖是自由的，卻不可藉著自由遮蓋惡毒，總要作　上帝的僕人。
  - type: paragraph
    text:
      ru: 'Связь речи такая. Будьте покорны, как свободные, как рабы Божии. Не только начальников, но и всех почитайте, братство любите, Бога бойтесь, царя чтите.«Как свободные». Слова этиИоанн Златоустобъясняет так: «Дабы не сказали: мы освободились от мира, стали гражданами неба; зачем опять подчиняешь нас начальникам и велишь повиноваться им? Для сего и говорит: покоряйтесь как свободные, то есть как верующие в Освободившего вас, и однако же Заповедавшего подчинение. Ибо этим вы покажете, что свободу, по которой отказываетесь от покорности, вы не употребляете для прикрытия намеренной злобы, то есть непокорности и непослушания». Можно об этом выражении («как свободные») сказать нечто и в другом смысле. Свободен в Господе тот, кто не подчиняется ничему безнравственному. Жить лицемерно свойственно не свободному, а тому, кто в рабстве у страстей, например, предан человекоугодию или иной какой-либо постыдной страсти. А рабы Божии должны быть далеки и чужды страстей. Посему ныне заповедует оказывать подчинение властям добродушное и искреннее, без неприязни к ним и не по принуждению, не питая в сердце злобы, не прикидываясь искренними и простыми, оказывать повиновение не наружно только, а с расположением сердечным.'
      cn: '这段话的联系是这样的。你们要顺服，如同自由人，如同上帝的奴仆。不仅要尊敬在上掌权者，也要尊敬所有人，爱众弟兄，敬畏上帝，尊敬君王。


        「如自由人。」金口圣约翰这样解释这些话：「免得有人说：『我们已从世俗中得到自由，成了天国的子民；你为何又让我们顺服在上掌权者，并命令我们服从他们呢？』因此他才说：『你们要顺服，如同自由人』，也就是说，你们是相信那位使你们得自由者的信徒，但祂仍然命令顺服。因为借此你们将表明，你们借以拒绝顺服的自由，并非用来掩盖蓄意的恶意，也就是悖逆和不听从。」


        关于这个表达（「如自由人」），我们还可以从另一个意义上来说。在上主里自由的人，是不屈从于任何不道德之事的人。过虚伪的生活，不是自由人的本性，而是被情欲所奴役者的本性，例如，专心取悦于人，或沉溺于其他任何可耻的情欲。而上帝的奴仆则应当远离和摆脱情欲。因此，现在他命令我们对掌权者表现出和善而真诚的顺服，不对他们心怀敌意，也不是被迫的，心中不怀恶意，不假装真诚和朴实，表现出的顺服不仅仅是外在的，而是发自内心的。'
  - type: paragraph
    text:
      ru: не как употребляющие свободу для прикрытия зла,
      cn: 不像将自由当作遮盖恶事的人，
  - type: paragraph
    text:
      ru: 'Это кратко может быть выражено так: наружно представляясь простыми и искренними, как бы под прикрытием свободы, а при испытании оказываясь страшными и совсем другими, чем каковы по наружности.'
      cn: 这可以简要地概括为：外表呈现出简朴和真诚，仿佛在自由的掩护下，但在受考验时，却显露出可怕，并与外表全然不同。
  - type: paragraph
    text:
      ru: но как рабы Божии.
      cn: 但作为上帝的奴仆。
  - type: paragraph
    text:
      ru: 1Пет.2:17.Всех почитайте, братство любите, Бога бойтесь, царя чтите.
      cn: (彼得前书 2:17) 務要尊敬眾人，愛弟兄，敬畏　上帝，尊敬君王。
  - type: paragraph
    text:
      ru: 1Пет.2:18.Слуги, со всяким страхом повинуйтесь господам, не только добрым и кротким, но и суровым.
      cn: (彼得前书 2:18) 你們作僕人的，凡事要存敬畏的心順服主人；不但順服那善良溫和的，就是那乖僻的也要順服。
  - type: paragraph
    text:
      ru: 1Пет.2:19.Ибо то угодно Богу, если кто, помышляя о Боге, переносит скорби, страдая несправедливо.
      cn: (彼得前书 2:19) 倘若人為叫良心對得住　上帝，就忍受冤屈的苦楚，這是可喜愛的。
  - type: paragraph
    text:
      ru: 1Пет.2:20.Ибо что за похвала, если вы терпите, когда вас бьют за проступки? Но если, делая добро и страдая, терпите, это угодно Богу.
      cn: (彼得前书 2:20) 你們若因犯錯受責打，能忍耐，有甚麼可誇的呢？但你們若因行善受苦，能忍耐，這在　上帝看是可喜愛的。
  - type: paragraph
    text:
      ru: 1Пет.2:21.Ибо вы к тому призваны, потому что и Христос пострадал за нас, оставив нам пример, дабы мы шли по следам Его.
      cn: (彼得前书 2:21) 你們蒙召原是為此；因　基督也為我們受過苦，給我們留下榜樣，叫你們跟隨他的腳蹤行。
  - type: paragraph
    text:
      ru: 1Пет.2:22.Он не сделал никакого греха, и не было лести в устах Его.
      cn: (彼得前书 2:22) 他並沒有犯罪，口裏也沒有詭詐。
  - type: paragraph
    text:
      ru: 'Смотри, какая точность. Богу говорит, воздавайте страх, а царю честь. Если же должно иметь страх пред Богом, могущим погубить«и душу и тело»(Мф. 10, 28), то мы не должны повиноваться царям, когда они, приказывают нам что-либо безнравственное. Ибо страх Божий умеет побеждать и почтение к царям, а когда принуждают его к худому, то он даже и лишает их чести, по словам святого:«уничижен пред ним лукавнующий»(Пс. 14, 4). Слово«страх»употребляется в различных значениях. Страхом называется, во-первых, страх сознательный; его апостол же называет теперь совестью; он же называется и благоговением. Страхом называется, во-вторых, страх, исполненный страсти, испытываемый при предстоящем наказании; этот страх замечается и в зверях. Страхом, в-третьих, называется страх первоначальный, который бывает у приступающих к Господу вследствие сознания, что за многие свои, проступки они достойны наказания; таким страхом побуждаемая, пришла ко Господу упоминаемая в Евангелии блудница (Лк. 7). Страхом еще называется страх совершенный, который всегда присущ всем святым. Ибо они боятся, чтобы у них не оказалось недостатка в чем-либо таком, что должно быть у проникнутых совершенной любовью. Апостол, убеждающий слуг повиноваться господам«со всяким страхом», не устраняет той мысли, что слуги должны относиться к господам«со страхом»во всех помянутых значениях. Ибо первоначальный и совершенный страх, если они имеют оный, располагает их к хорошему поведению: первый побуждает их остерегаться проступков, чтобы не потерпеть за них чего-либо неприятного; другой внушает, чтобы они и не думали сделать своим господам что-либо неприятное. Итак, здесь апостол говорит о страхе по совести, то есть по сознанию долга. Он наводится бесчестными господами на слуг их даже и тогда, когда сии ни в чем не виноваты. Одобряя сей страх, апостол заповедует переносить все с терпением. Поскольку боящиеся потерпеть за грехи, совершенные на деле или от совершения которых убереглись, если что-нибудь пострадают за оные, обнаруживают в себе рабов благоразумных и склонных к исправлению. Но несравненно выше любомудрие того, кто, не сознавая сам за собой ничего худого, переносит все с благодарностью. Это великий подвиг, совершаемый немногими и низводящий особенное благоволение Божие, так как человек сей соревнует страданиям Христовым, так как и Христос страдал не за Свои Собственные грехи, ибо Он«не сделал греха»(Ис. 53, 9), но страдал за нас и за наши грехи.«За преступления народа Моего претерпел казнь», говорит пророк (Ис. 53, 8). Сей похвальный страх предлагает апостол, но не менее желает, чтобы слуги водились и прочими страхами. И это видно из слов его:«со всяким страхом». Впрочем, выше прочих страхов поставил страх за совесть, и самым ясным образом выразил, что только этот страх достоин хвалы; поскольку прочие страхи имеют причину для гнева господ на слуг, а этот не имеет ее.'
      cn: '看，多么准确啊。对上帝说，要敬畏；对君王说，要尊敬。若我们理当敬畏那位能「毁灭灵魂和身体」的上帝（马太福音 10:28），那么当君王命令我们做任何不道德的事时，我们就不应顺从他们。因为敬畏上帝能胜过对君王的尊敬，而当君王强迫人做坏事时，敬畏上帝甚至会剥夺他们的尊荣，正如圣人所言：「邪恶之人在他眼中是卑贱的」（诗篇 14:4）。


        「 страх」一词用法多样。首先，称之为「 страх」的是自觉的敬畏；使徒此刻称之为良心；它也被称为虔敬。其次，称之为「 страх」的是充满激情的恐惧，在预期的惩罚面前所体验到的；这种恐惧甚至在野兽身上也能观察到。第三，称之为「 страх」的是最初的敬畏，这是那些接近上主的人所拥有的，因为他们意识到自己因众多过犯而应受惩罚；福音书中所提到的那个罪妇（路加福音 7章）就是受此敬畏驱使而来到上主面前的。此外，还有完美的敬畏，这敬畏总是存在于所有圣徒之中。因为他们担心自己会有所缺失，未能拥有那些完全之爱所应具备的。


        使徒劝告仆人要「凡事敬畏」地顺从主人，这并不排除仆人应在上述所有意义上「敬畏」主人。因为最初的敬畏和完美的敬畏，如果仆人拥有它们，就会促使他们行为良好：前者促使他们警惕过犯，以免因此遭受不悦之事；后者则教导他们，甚至不要想着给主人带来任何不悦。所以，使徒在此所说的，是出于良心的敬畏，亦即出于对责任的自觉。这种敬畏，即使仆人没有任何过错，也会被无良的主人加诸于他们。使徒赞许这种敬畏，并命令凡事忍耐。因为那些担心因所犯的罪，或因其已设法避免的罪而遭受苦难的人，如果因此而受苦，便显明自己是明智且乐于悔改的仆人。


        然而，那自己问心无愧却怀着感恩之心忍受一切的人，其智慧远超凡俗。这是一项伟大的苦行，仅有少数人能做到，并能带来上帝特别的恩宠，因为这人效法了基督的受难，正如基督并非为祂自己的罪受苦，因为祂「没有犯过罪」（以赛亚书 53:9），而是为我们和我们的罪受苦。「因我百姓的过犯，他受了刑罚」，先知说（以赛亚书 53:8）。使徒提倡这种值得称赞的敬畏，但也同样希望仆人被其他种类的敬畏所引导。这从他的话语「凡事敬畏」中可见一斑。


        然而，他将出于良心的敬畏置于其他所有敬畏之上，并以最清楚的方式表明，唯有这种敬畏才配受赞扬；因为其他敬畏可能成为主人对仆人发怒的原因，而这种敬畏则不然。'
  - type: paragraph
    text:
      ru: 1Пет.2:23.Будучи злословим, Он не злословил взаимно; страдая, не угрожал, но предавал то Судии Праведному.
      cn: (彼得前书 2:23) 他被罵不還口；受害不說威嚇的話，只將自己交託那按公義審判人的主。
  - type: paragraph
    text:
      ru: '1Пет.2:24.Он грехи наши Сам вознес телом Своим на древо, дабы мы, избавившись от грехов, жили для правды:'
      cn: (彼得前书 2:24) 他被掛在木頭上，親身擔當了我們的罪，使我們既然在罪上死，就得以在義上活。因他受的鞭傷，你們便得了醫治。
  - type: paragraph
    text:
      ru: 'Быть может, кто-нибудь скажет: «Как апостол Петр говорит здесь, что Господь, когда Его злословили, не злословил взаимно, и когда страдал, не угрожал, когда мы видим, что Он называет иудеев псами, глухими, фарисеев – слепыми (Мф. 15, 14), Иуде говорит:«лучше было бы этому человеку не родиться»(Мф. 26, 24), и в иной раз:«отраднее будет Содому,нежели городу тому»(Мф. 10, 15). Отвечаем. Апостол не то говорит, что Господь никогда не укорял или не угрожал, но что, когда Его злословили, Он не злословил взаимно, и, когда страдал, не угрожал. Ибо если Он иногда укорял, то не в отмщение тем, которые злословили Его, но поносил и укорял упорных в неверии. Злословящие Его говорили:«бес в Тебе»(Ин. 7, 20)?«Он изгоняет бесовсилоюкнязя бесовского»(Мф. 12, 24). И:«вот, человек, который любит есть и пить вино»(Мф. 11, 19), когда Он слышал это, злословил ли взаимно? Отнюдь нет. Но одним сказал:«если Ясилоювеельзевула изгоняю бесов, то сыны ваши чьеюсилоюизгоняют?»(Мф. 12, 27). Тех же, которые называли Его любящим есть и пить вино, он уподоблял«детям», играющим на торжище и говорящим товарищам:«мы играли вам на свирели, и вы не плясали; мы пели вам печальные песни, и вы не рыдали»(Мф. 11, 16–17). А когда Он висел на кресте и страдал, то не только не угрожал, но еще молился за злодеев:«Отче! прости им, ибо не знают, что делают»(Лк. 23, 34). Иуде угрожал Он для того, чтобы отвлечь его от предательства. Равно и тем, которые не будут принимать учеников Его, объявил, что им будет хуже, чем Содомлянам, для того, чтобы слушателей хотя бы страхом преклонить к странноприимству и к тому, что для них спасительно. Посему слово апостола Петра, убеждающего к незлобию примером Господа, весьма истинно.«ПредавалвсеСудии Праведному»(1Петр. 2, 23); то есть Богу, Который на будущем суде воздаст каждому«по делам»его, без всякого«лицеприятия», по сущей справедливости (1Петр. 1, 17).'
      cn: '也许有人会说：「使徒彼得在此处说，主在被辱骂时，不以辱骂还击；在受苦时，不施威胁。然而我们看到，祂称犹太人为犬类、聋子，称法利赛人为瞎子 (马太福音 15:14)，又对犹大说：『那人没有生下来倒好。』 (马太福音 26:24)，另一次说：『所多玛所受的，比那城所受的，倒要好过得多。』 (马太福音 10:15)。我们回答说。


        使徒并不是说主从不责备或不施威胁，而是说，当祂被辱骂时，祂不以辱骂还击；当祂受苦时，祂不施威胁。因为如果祂有时责备，那也不是为了报复那些辱骂祂的人，而是斥责和责备那些在不信中顽固不化的人。


        那些辱骂祂的人说：「祢有鬼附身」 (约翰福音 7:20)？「祂赶鬼是靠着鬼王别西卜的能力」 (马太福音 12:24)。又说：「看哪，这人贪食好酒」 (马太福音 11:19)。当祂听到这些时，祂有以辱骂还击吗？绝没有。但祂对一些人说：「我若靠着别西卜赶鬼，你们的子孙又靠着谁赶鬼呢？」 (马太福音 12:27)。对于那些称祂为贪食好酒的人，祂则将他们比作在市上玩耍、对同伴说：「我们向你们吹笛，你们不跳舞；我们唱哀歌，你们不捶胸哀哭」 的「孩童」 (马太福音 11:16-17)。而当祂被钉在十字架上受苦时，祂不仅没有威胁，反而为那些作恶的人祷告说：「父啊！赦免他们，因为他们所做的，他们不晓得。」 (路加福音 23:34)。


        祂威胁犹大，是为了使他远离背叛。同样，对于那些不接待祂门徒的人，祂宣称他们所受的将比所多玛人更糟，这是为了使听者至少因惧怕而转向好客之道，并转向对他们有益的事。


        因此，使徒彼得劝人以主的榜样保持不恶意的话，是极其真实的。「祂将自己的一切都交托给那按公义审判的上帝。」 (彼得前书 2:23)；也就是说，交给上帝，祂在将来的审判中，将「照各人所行的」报应各人，不偏待任何人，乃是按着实实在在的公义 (彼得前书 1:17)。'
