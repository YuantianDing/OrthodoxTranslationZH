  - type: paragraph
    text:
      ru: Оглавление первого послания святого апостола Петра
      cn: 圣使徒彼得第一书信内容
  - type: paragraph
    text:
      ru: 'О возрождении во Христе. – О терпении в испытаниях и о спасительной вере, предвозвещенной пророками. – О надежде и освящении, и о твердом поведении, требуемом усыновлением. – О жизни, достойной усыновления во Христе на пользу и внешних (язычников) в славу Божию. – О подчинении начальникам, братолюбии и богочестии, где: а) о подчинении рабов господам и незлобивом терпении ради Христа, б) о повиновении жен, их единомыслии с мужьями, и спасении, подаваемом от Духа, по образу Сарры,  в) об обязанности мужей к женам,  г) о кротком незлобии ко всем, образец которого представляет человеколюбие Божие, явленное при Ное, и сострадание Христово к нам, являемое в крещении. – Об отложении худых дел, и о принесении плодов Духа по различию дарований. – О том, что по общению со Христом должно побеждать чувственные страсти и с упованием на Него переносить вред от других. – Увещания пастырям заботиться о стаде. – Об общем всем смиренномудрии в отношении ко всякому для победы над диаволом. – Молитва о совершенстве верующих.'
      cn: '论在基督里的重生。

        论在试炼中的忍耐，以及论为先知所预言的得救的信心。

        论盼望与成圣，以及论为蒙受嗣子名分所要求的坚定行为。

        论配得上在基督里蒙受嗣子名分的生活，为着那些外邦人（异教徒）的益处，并为着上帝的荣耀。

        论顺服长官、弟兄之爱与敬虔，其中：

        甲）论仆役对主人的顺服，以及论为基督缘故的无恶意忍耐，

        乙）论妇人的顺从，她们与丈夫的同心同德，以及论由圣灵所赐的救恩，效法撒拉的榜样，

        丙）论丈夫对妻子的责任，

        丁）论对所有人的温柔与不怀恶意，其榜样乃是上帝在挪亚时代所显明之爱人的心，以及基督对我们所怀的怜悯，显明在洗礼之中。

        论弃绝恶行，以及论按照恩赐的不同而结出圣灵的果子。

        论借着与基督相通，当战胜肉体的私欲，并带着对祂的盼望忍受来自他人的伤害。

        牧者们的劝谕：当照顾群羊。

        论所有人对每一个人的普遍谦卑，为着战胜魔鬼。

        为信徒的成全所献的祷告。'
  - type: paragraph
    text:
      ru: Содержание первого послания святого апостола Петра
      cn: 圣使徒彼得的第一书信内容
  - type: paragraph
    text:
      ru: Апостол Петр, как сам говорит, пишет иудеям, находящимся в рассеянии и сделавшимся христианами. Послание его учительное. Так как некоторые из иудеев уверовали, то апостол утверждает их в вере. Прежде всего он объясняет и доказывает, что вера во Христа предвозвещена была пророками, как и искупление Кровию Его было предсказано чрез них, и что иудеям и язычникам возвещено все то, во что желают проникнуть ангелы. Потом он убеждает тех, к кому пишет, вести себя достойно Призвавшего их, увещевает их почитать правителей, а женам и мужьям заповедует единомыслие. Предложив далее несколько нравственных увещаний, объявляет, что Господь во аде проповедовал о спасении и воскресении, для того, чтобы прежде умершие воскресли, и судимы были в теле, и в благодати воскресения пребыли; присовокупляет, что всему приблизился конец, и все должны быть готовы отдать отчет Судии, и затем оканчивает послание.
      cn: 圣使彼得，如他自己所言，致书与身在离散之地且已成为基督徒的犹太人。他的书信具有教诲性。既然有些犹太人已经信主，所以圣使坚固他们的信仰。首先，他解释并证明，对基督的信仰已由先知们预先宣告，正如祂宝血的救赎亦借由他们被预言，且犹太人和外邦人已被宣告了一切连天使都渴望洞悉的事。接着，他劝勉那些他致书的对象，行为举止要配得上那呼召他们者，劝诫他们要敬重执政者，并嘱咐妻子和丈夫要同心合意。随后提出几项道德上的劝诫，他宣称，上主在阴间宣讲了关于救恩与复活的事，为了使先前已死者复活，并在肉身中受审判，且留在复活的恩典中；他又补充说，万物的结局已经临近，且所有人应当准备好向审判者交账，然后结束了他的书信。
