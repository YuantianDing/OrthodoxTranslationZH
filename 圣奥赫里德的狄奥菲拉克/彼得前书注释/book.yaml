  '[*]':
    ru: Этот стих в церковнославянском тексте:«иже естьодеснуюБога, возшед на небо, покоршымся ему ангелом и власте́м и силам».– Редакция «Азбуки веры»
    cn: '这一位在上帝的右边，升上高天，天使、掌权者和有能者都已顺服了祂。

      —— «信仰字母»编辑部'
