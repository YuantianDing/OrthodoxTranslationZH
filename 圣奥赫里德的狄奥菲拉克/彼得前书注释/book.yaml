- type: heading1
  text:
    ru: Глава третья
    cn: 第三章
  children:
  - type: paragraph
    text:
      ru: 1Пет.3:1.Также и вы, жены, повинуйтесь своим мужьям, чтобы те из них, которые не покоряются слову, житием жен своих без слова приобретаемы были,
      cn: (彼得前书 3:1) 照樣，妳們作妻子的要順服自己的丈夫；這樣，若有不順從道理的丈夫，作妻子的也可以不藉著道理，乃藉著妻子的品行嬴得他們；
  - type: paragraph
    text:
      ru: 1Пет.3:2.когда увидят ваше чистое, богобоязненное житие.
      cn: (彼得前书 3:2) 這正是因看見你們有貞潔的品行和敬畏的心。
  - type: paragraph
    text:
      ru: 1Пет.3:3.Да будет украшением вашим не внешнее плетение волос, не золотые уборы или нарядность в одежде,
      cn: (彼得前书 3:3) 你們不要以外面的辮頭髮，戴金飾，穿美衣為妝飾，
  - type: paragraph
    text:
      ru: 'Апостол изложил нравственное учение для всех: для царей, правителей, господ и рабов. Для подначальных поставил законом, чтобы они повиновались царям и правителям, которым должно и в чем должно, и тем показал, что сами правители имеют некоторое предначертание и побуждение к правде в законах, и за все, что ни делают по законам, не будут осуждены, а за все, что учинят вопреки им, беззаконно, несправедливо и самовольно, погибнут. Ибо закон дан им на пользу народов, как говорит апостол Павел (Рим. 13, 4). Подобно законам, и правители даны на некоторую пользу, а не так, как некоторые худо рассуждают, будто существующая на земле власть – от диавола, соглашаясь в этом деле с диаволом, который сказал Господу: «все этопреданомне, и я, кому хочу, даюсие» (Лк. 4, 6); не по воле диавола поставляются цари; ибо они даны для исправления зол, а диавол не заботится ничего такого вводить между людьми. Власти же и правители даны от Бога, с одной стороны, для того, чтобы охранять правого и устроять пользу подчиненных, с другой – для того, чтобы погрешающих удерживать страхом наказания и обличением, наконец – для того, чтобы производить должное наказание причинившим неправду. Показав это, именно, что повиновение властям – добро, а неповиновение – зло, и предписав подобные отношения рабам и господам, апостол обращает теперь речь свою к женщинам. Жены, говорит он, должны быть заняты двумя делами: повиноваться своим мужьям, и удаляться всякого украшения и убранства, подражая святым женам. Ибо они, говорит, знали одно только украшение, то, что повиновались своим мужьям. Какая же польза от этого? Та, что язычники получают доброе понятие о вере и ревность по ней, что производит и наша покорность властям, и ради нас благодарят Христа, а для христиан великая похвала, когда ради нас и ради нашего доброго поведения и язычники благословляют имя Божие. Слова«без слова приобретаемы»значат или то, что приобретаемы бывают без всякого рассуждения и противоречия, или то, что доказательство от дел сильнее слова и искусности, как и святый муж сказал: «Дело, не сопровождаемое словом, лучше слова, не сопровождаемого делом».'
      cn: '使徒阐明了为所有人而设的道德教导：为君王、官长、主人和奴仆。对于受管辖者，使徒定下律法，使他们顺服君王和官长，在应当时和在应得之处。使徒以此表明，官长们自身在法律中拥有某种预定和寻求公义的动机；凡他们按照法律所行的，不会被定罪；而凡他们违背法律，非法、不公和专横所行的，都将灭亡。因为法律赐予他们是为了民众的益处，正如使徒保罗所说（罗马书 13:4）。类似法律，官长也是为了某种益处而被赐予，而不像某些人错误地论断，认为地上现存的权柄是来自魔鬼，在此事上与魔鬼同调，魔鬼曾对上主说：「这一切都交给了我，我要给谁就给谁」（路加福音 4:6）。君王并非凭魔鬼的意愿被设立；因为他们被赐予是为了匡正邪恶，而魔鬼并不关心在人中间引入任何此类事物。权柄和官长是上帝所赐，一方面，是为了保护公义者并安排好受管辖者的益处；另一方面，是为了藉着惩罚的恐惧和责备来制止犯错者；最后，是为了对行不义之人施以应得的惩罚。


        在表明了这一点，即顺服权柄是善，而不顺服是恶之后，并且为奴仆和主人规定了类似的关系之后，使徒现在将他的话转向妇女。妇女，他（使徒）说，应当专注于两件事：顺服她们的丈夫，并远离一切装饰和打扮，效法圣洁的妇女。因为她们，他说，只知道一种装饰，那就是顺服她们的丈夫。这有什么益处呢？益处是：外邦人对信仰有了好的认识并为此生发热心，我们的顺服权柄也产生同样的效果，并因我们而感谢基督；对基督徒而言则是极大的称赞，当因我们和我们良好的行为，甚至外邦人也颂赞上帝之名时。「不凭言语而得」这句话的意思，要么是她们在没有任何争辩和反驳的情况下被赢得，要么是行为的证明比言语和技巧更有力，正如那位圣洁的人所说：「没有行为相伴的言语，胜过没有言语相伴的行为。」'
  - type: paragraph
    text:
      ru: 1Пет.3:4.но сокровенный сердца человек в нетленнойкрасотекроткого и молчаливого, духа, что драгоценно пред Богом.
      cn: (彼得前书 3:4) 只要以裏面存著長久溫柔，安靜的心靈為妝飾；這在　上帝眼前是極寶貴的。
  - type: paragraph
    text:
      ru: Ибо:«Вся славадочериЦаря внутри; одежды ееубранызолотом;испещре́нные»(Пс. 44, 14). То есть сокровенное наше расположение и внешнее положение должны в точности соответствовать одно другому. Убранство золотом означает собой внешнюю деятельность. Называет же одежды убранными золотом и испещренными потому, что и обнаруживаемое изнутри является не как случится, но честно и важно.
      cn: 因为：「君王之女的全然荣耀在内；她的衣裳镶嵌着金饰，斑斓的。」(诗篇 44:14) 也就是说，我们内在的心意与外在的表现必须精确地彼此对应。金饰象征着外在的行动。而将其衣裳称为镶嵌着金饰、斑斓的，因为那从内在显明出来的，并非随意而为，而是端庄而隆重。
  - type: paragraph
    text:
      ru: 1Пет.3:5.Так некогда и святые жены, уповавшие на Бога, украшали себя, повинуясь своим мужьям.
      cn: (彼得前书 3:5) 因為古時仰賴　上帝的聖潔婦人，正是以此為妝飾，順服自己的丈夫。
  - type: paragraph
    text:
      ru: 1Пет.3:6.Так Сарра повиновалась Аврааму, называя его господином. Вы – дети ее, если делаете добро и не смущаетесь ни от какого страха.
      cn: (彼得前书 3:6) 就如撒拉聽從亞伯拉罕，稱他為主。你們若行善，不因恐嚇而害怕，便是撒拉的女兒了。
  - type: paragraph
    text:
      ru: 1Пет.3:7.Также и вы, мужья, обращайтесь благоразумно с женами, как с немощнейшим сосудом, оказывая им честь, как сонаследницам благодатной жизни, дабы не было вам препятствия в молитвах.
      cn: (彼得前书 3:7) 你們作丈夫的，也要按知識和妻子同住；因她是較軟弱的器皿，與你一同承受生命之恩的，所以要敬重她。這樣，便叫你們的禱告沒有阻礙。
  - type: paragraph
    text:
      ru: 'Здесь украшением называет повиновение, говоря: они украшали себя, повинуясь своим мужьям. Сказав неопределенно«святые жены», называет их дочерями Сарры или по вере, или по происхождению. Ибо дочери необходимо должны подражать матерям. При украшении, приличном христианкам, убеждает их быть и милостивыми, не опасаясь за то взыскания от своих мужей. Это хочет выразить словами:«не смущаетесь ни от какого страха». Ибо естественно, что мужья потребуют иногда от них отчета в издержках. Такой возвышенной речью убеждая бережливых и малодушных женщин к тому, чтобы они щедрее раздавали домашние вещи, апостол удерживает и мужей от строгости к ним, и говорит:«мужья, обращайтесь благоразумно с женами», то есть примите во внимание слабость и склонность женского пола к малодушию и будьте к женам великодушны, не требуя с раздражительностью отчета в том, что вверено им по домашнему хозяйству. Убеждает мужей не взыскивать строго с жен для того, как мы сказали, что они были щедрее в подаянии бедным. А мне кажется, что этими словами апостол сокровеннее и важнее, чем Павел, намекает на пользование правами супружества. Ибо Павел прямо говорит:«Не уклоняйтесь друг от друга, разве по согласию», и проч. (1Кор. 7, 5). А Петр, важнее сказав:«благоразумно»и чрез то намекнув на дело, убеждает мужей, так как женский пол и к этому склоннее, не отлучаться от жен с запрещением и строгостью, но сначала снисходительно, как к слабейшим, пользоваться ими, потом с некоторой осторожностью убеждать их привыкать к воздержанию от сего. Ибо на это, то есть на снисходительность, хочет указать словами:«оказывая им честь». Ибо тому, на кого не обращают внимания, не бывает ни чести, ни пощады. Потом, так должно пользоваться ими в отношении сообщения, как слабейшими, или и как сонаследницами живой благодати. И что мы придали такой смысл предлежащему изречению не без основания, на это указывает дальнейшее прибавление:«дабы не было вам препятствия в молитвах».  Ибо какое препятствие молитве может быть от суровости мужа к жене своей? Между тем как оставление сообщения доставляет во время молитвы большую внимательность и усердие. Такова моя мысль об этом.'
      cn: 在此，他将顺服称为装饰，说：「她们顺服自己的丈夫，以此为装饰。」在模糊地说了「圣洁的妇女」之后，他称她们为撒拉的女儿，或因着信心，或因着血统。因为女儿们必须效法母亲。在基督徒妇女相称的装饰上，他劝勉她们也要行怜悯，不必担忧因此受到丈夫的追究。他想用「不因任何恐惧而心烦意乱」这些话来表达这一点。因为丈夫有时会自然地向她们要求开支的账目。使徒以如此高尚的言语，劝勉那些节俭而胆怯的妇女，让她们更慷慨地分发家中的物品；同时他也制止丈夫们对她们的严苛，并说：「丈夫们，要按情理与妻子同住」，也就是说，要考虑到女性的软弱和倾向于胆怯的性情，并且对妻子要宽宏大量，不要因家务所托付之事，烦躁地要求她们交账。他劝勉丈夫们不要严厉地追究妻子，正如我们所说，是为了让她们在施舍穷人时更慷慨。而在我看来，使徒用这些话，比保罗更隐秘、更重要地暗示了夫妻权利的使用。因为保罗直言不讳地说：「夫妻不可彼此亏负，除非两厢情愿」，等等。（哥林多前书 7:5）而彼得，更重要地说了「按情理」并借此暗示了那件事，劝勉丈夫们，因为女性对此也更倾向，不要以禁止和严苛与妻子分离，而是首先要宽容地对待她们，如同对待较弱者一般与她们同房，然后要以某种谨慎劝导她们逐渐习惯于对此节制。因为他想用「敬重她们」这些话来指明这一点，即指明宽容。因为对那些不被重视的人，既无敬重，也无怜悯。然后，在同房之事上，应当这样对待她们，如同对待较弱者，或是如同活泼恩典的同受产业者。而我们赋予眼前这句话如此的意义并非没有根据，后面的补充说明指出了这一点：「好叫你们的祷告没有阻碍」。因为丈夫对妻子的严苛，会对祷告造成什么障碍呢？然而，暂停同房在祷告时会带来更大的专心和热诚。这是我对这事物的看法。
  - type: paragraph
    text:
      ru: 1Пет.3:8.Наконец будьте все единомысленны, сострадательны, братолюбивы, милосерды, дружелюбны, смиренномудры;
      cn: (彼得前书 3:8) 總而言之，你們都要同心，彼此體恤，相愛如弟兄，存慈憐謙讓的心。
  - type: paragraph
    text:
      ru: 1Пет.3:9.не воздавайте злом за зло или ругательством за ругательство; напротив, благословляйте, зная, что вы к тому призваны, чтобы наследовать благословение.
      cn: (彼得前书 3:9) 不以惡報惡，以辱罵還辱罵，倒要祝福；因你們是為此蒙召，好叫你們承受福氣。
  - type: paragraph
    text:
      ru: 'Связь с предыдущим наставлением такая: наконец, или сказать кратко, будьте все единомысленны и проч., зная, что вы к тому призваны, чтобы благословлять всех. Ибо и Павел говорит:«Благословляйте гонителей ваших»(Рим. 12, 14); поступая таким образом, вы от всех будете слышать наименование вас «благословляющими»  (Пс. 36, 20). Ибо Жаждущему вечной жизни не следует никого злословить языком. Посему и Давид тех, которые сильно желают достигнуть истинной жизни, убеждает«удерживатьязык от зла»(Пс. 33, 14). Когда вы так устроите себя, то Всемогущий будет к вам милостив. А в таком случае кто может сделать вам зло? Но если вам и при делании добра и ревности по нем будет нанесено оскорбление, то не горюйте, но радуйтесь, во-первых, потому, что это не зло, а во-вторых, потому, что вы чрез это блаженны. Посему святите в сердцах ваших Бога, а страха человеческого не бойтесь, и не смущайтесь. Иначе. Окончив частные наставления, касающиеся мужей и жен, обобщает убеждение ко всем, мужьям и женам, и говорит:«наконец».  К чему частные наставления? Говорю всем вообще. Ибо это конец, у всех одна цель – спасение, у всех один закон – любовь. Отсюда рождается всякая добродетель, смиренномудрие, сострадание, милосердие, и проч. Из нихединомыслиеесть совершенное согласие в чем-нибудь.Сострадание– сожаление к страждущим такое же, как и к самим себе.Братолюбие– расположение к ближним такое, какое должно быть к братьям.Милосердие– душевное стремление к благотворению однородным.Дружелюбие– кротость со всеми, как со знакомыми и друзьями. Смирение илисмиренномудрие– перенесение хулы от другого, сознание своей греховности, перенесение обвинений, что можно бы назвать благомыслием. Сими-то добродетелями украшайтесь; при чем не поддавайтесь злобе (ругательство есть происходящая от дурной привычки наклонность к злословию), но ревнуйте по добре, проводя жизнь святую и совершенную. Ибо благословляемый всеми есть и ревнитель.'
      cn: '与之前的教诲相关联的是：最终，或者简而言之，你们都要同心合意，等等，须知你们蒙召是为了祝福所有人。因为保罗也说：「要为那逼迫你们的祝福」（罗马书 12:14）；如此行，你们就会被众人称为「祝福人的」（诗篇 36:20）。因为渴慕永生之人不应口出恶言诽谤任何人。因此，大卫也劝勉那些切切渴望得着真正生命的人「禁止舌头不出恶言」（诗篇 33:14）。当你们这样自我约束时，全能者就会对你们施慈爱。既然如此，谁能加害于你们呢？但即使你们在行善并为此热心时遭到侮辱，也不要忧愁，反要欢喜，首先，因为这不是恶事，其次，因为你们因此而蒙福哉。因此，要在你们心里尊崇上帝为圣，不要惧怕人的，也不要惊慌。


        换言之。在结束了针对夫妻的个别教诲后，将劝勉泛化给所有人，包括丈夫和妻子，并说：「最终」。为何有个别的教诲呢？我是对所有人都说的。因为这是结局，所有人都有一个共同的目标——救赎，所有人都有一个共同的法则——爱。由此生出一切美德：谦卑、怜悯、慈悲，等等。其中，同心合意是在某事上完全一致的。怜悯，是对受苦之人如同对自己一样感到惋惜。弟兄之爱，是对邻人应有的如同对弟兄一般的态度。慈悲，是灵魂上渴望对同类行善。友爱，是对待所有人，如同对待相识者和朋友一样温柔。谦卑或谦逊，是承受他人的毁谤，意识到自己的罪过，承受指责，这可称之为善意。你们要以这些美德来装饰自己；同时不要屈服于恶意（咒骂是源于坏习惯的诽谤倾向），而要热心于善行，过着圣洁和完美的生活。因为蒙所有人祝福之人也是热心之人。'
  - type: paragraph
    text:
      ru: 1Пет.3:10.Ибо, кто любит жизнь и хочет видеть добрые дни, тот удерживай язык свой от зла и уста свои от лукавых речей;
      cn: (彼得前书 3:10) 因為經上說：「人若愛生命，願見美好的日子，須要禁止舌頭不出惡言，嘴唇不說詭詐的話；
  - type: paragraph
    text:
      ru: 1Пет.3:11.уклоняйся от зла и делай добро; ищи мира и стремись к нему,
      cn: (彼得前书 3:11) 也要離惡行善；尋求和睦，一心追趕。
  - type: paragraph
    text:
      ru: Что выводимое им наставление не ложно, в том удостоверяет указанием на слова Давида, и говорит:«кто любит жизнь»,  то есть кто преобразовывает себя для истинной жизни и хочет показать ее достолюбезной (ибо на это указывает выражение«любит», хочет показать ее вожделенной для людей), тот пусть неуклонно держится того, что вместе со мной предлагает и пророческое слово.
      cn: '他藉着援引达味的话语，以此证实他所提出的教诲并非虚假，并说：

        「谁爱生命」，也就是说，谁为真生命而改变自己，并希望将其展现为值得爱的（因为「爱」这个词语正指明了这一点，即希望将它展现为世人所渴望的），那么，他当坚定不移地持守那与我一同、并由先知之言所提出的。'
  - type: paragraph
    text:
      ru: 1Пет.3:12.Потому что очи Господа обращены к праведным и уши Его к молитве их, но лице Господне против делающих зло (чтобы истребить их с земли).
      cn: (彼得前书 3:12) 因為，　主的眼看顧義人；　主的耳聽他們的祈禱。唯有行惡的人，　主向他們變臉。」
  - type: paragraph
    text:
      ru: 1Пет.3:13.И кто сделает вам зло, если вы будете ревнителями доброго?
      cn: (彼得前书 3:13) 你們若是效法良善，有誰害你們呢？
  - type: paragraph
    text:
      ru: 1Пет.3:14.Но если и страдаете за правду; то вы блаженны; а страха их не бойтесь и не смущайтесь.
      cn: (彼得前书 3:14) 你們就是為義受苦，也是有福的。不要怕人的威嚇，也不要驚慌；
  - type: paragraph
    text:
      ru: 1Пет.3:15.Господа Бога святите в сердцах ваших.
      cn: (彼得前书 3:15) 只要心裏尊　主　上帝為聖。有人問你們心中盼望的緣由，就要常作準備，以溫柔敬畏的心回答各人。
  - type: paragraph
    text:
      ru: 'Из приведенных им слов пророка делает заключение. Там сказано:«очи Господни на праведных, а лице Господне против делающих зло»(1Петр 3, 12), апостол прибавляет к сему: если будете так жить, то к вам Бог будет благосклонен и милостив. А при таком положении, кто вам нанесет зло? Ибо все в руке Его,«жизнь и смерть» (Прем. 16, 13). Но как некоторые почитали злом страдания за веру, то апостол Петр, для исправления такого мнения, говорит: не почитайте этого злом, напротив, почитайте это залогом блаженства. Ибо страх от людей не стоит никакого внимания, но однодневен. Ибо если очи Господа обращены к праведным и уши Его к молитве их, но против делающих зло лице Господне, угрожающее злым погибелью, то, если бы это было зло, Податель благ, без сомнения, за любовь нашу к Нему не воздал бы злом. Ибо зло Он наводит на злых:«Скорбь и теснота всякой душе человека, делающего злое»(Рим. 2, 9), посему скорби за благочестие не суть зло. Вместе с Исаией (Ис. 8, 13) заповедует святить Господа в сердцах, то есть не превозноситься видимыми делами, но в тайной клети сердца совершать освящение Господа, которое состоит в удалении от скверн, то есть от злых нравов языческих. Так Его святите. А святится Он чрез ваше доброе поведение, когда прочие люди прославляют Его, как и Сам Богочеловек повелевает:«Так да светит свет ваш пред людьми, чтобы они видели ваши добрые дела»(Мф. 5, 16).'
      cn: 他从所引用的先知言语中得出结论。那里写道：「上主的眼目看顾义人，上主的脸面却敌对作恶的人」（彼得前书 3:12），使徒对此补充说：如果你们如此生活，上帝就会对你们施予恩惠和怜悯。在这样的境况下，谁能加害于你们呢？因为一切都在祂的手中，「生命与死亡」（智慧篇 16:13）。但由于有些人将为信仰受苦视为恶事，使徒彼得为了纠正这种观点，说：不要把这看作恶事，反之，要把它看作蒙福的凭证。因为来自人的恐惧不值一提，并且转瞬即逝。因为如果上主的眼目看顾义人，祂的耳朵垂听他们的祷告，而上主的脸面却敌对作恶的人，威胁恶人以灭亡，那么，如果这真是恶事，那位赐福者，无疑不会因我们对祂的爱而报以恶事。因为祂将恶事降给作恶的人：「患难与困苦临到一切作恶之人的灵魂」（罗马书 2:9），因此，为敬虔所受的苦难并非恶事。祂与以赛亚一同（以赛亚书 8:13）命令要在心中尊主为圣，也就是说，不要因可见的善行而自高，而要在心灵的隐秘之处完成对上主的圣化，这包括远离污秽，即远离异教的邪恶风俗。你们当如此圣化祂。而祂则借着你们的良好行为得以圣化，当其他人因此而荣耀祂时，正如神人自己所吩咐：「你们的光也当这样照在人前，叫他们看见你们的好行为」（马太福音 5:16）。
  - type: paragraph
    text:
      ru: 1Пет.3:15.будьтевсегда готовы всякому, требующему у вас отчета в вашем уповании, дать ответ с кротостью и благоговением.
      cn: (彼得前书 3:15) 只要心裏尊　主　上帝為聖。有人問你們心中盼望的緣由，就要常作準備，以溫柔敬畏的心回答各人。
  - type: paragraph
    text:
      ru: 1Пет.3:16.Имейте добрую совесть, дабы тем, за что злословят вас, как злодеев, были постыжены порицающие ваше доброе житие во Христе.
      cn: (彼得前书 3:16) 存著無虧的良心，叫你們在何事上被毀謗為作惡的，就在何事上可以叫那誣告你們在　基督裏有好品行的人自覺羞愧。
  - type: paragraph
    text:
      ru: 'Слова«готовы... дать ответ»и проч. должно соединить с словами: «являть добрую деятельность» («иметьдобрую совесть»). Ибо когда будете делать это с кротостью и приличием, тогда и сами уверитесь, что вы имеете добрую совесть, и имеющих дурное понятие о вас постыдите. Апостол повелевает верному человеку всегда быть готовым к отчету в вере, чтобы, когда бы ни стали спрашивать нас о вере, мы всегда могли легко отвечать, и делать это с кротостью, как и все вообще, как бы в присутствии Самого Бога. Ибо в присутствии своего господина ни один благоразумный раб не бывает дерзок. Польза от сего та, что неверные узнают, каковы мы, и будут справедливы к нам. Нужно заметить, что эти слова апостола не противоречат изречению Господа. Когда Господь говорит, чтобы мы, когда поведут нас к начальникам и властям, не заботились о том,«чтонамотвечать»(Лк. 21, 14), а Петр заповедует теперь готовиться к ответу, то Господь, говорит о свидетельстве, а апостол Петр – об учении. Ибо кто думает, что знает что-нибудь без разумения и исследования, тот вызывает на себя хулу. Ибо знание неразумных – неисследимые слова. Иначе. Поскольку обвиняли нас во многих беззакониях и выставляли надежды наши напрасными, то апостол заповедует готовить обдуманные ответы и иметь жизнь достохвальную, которую и называет совестью.'
      cn: 『预备...作出回答』等语，应当与『显明良善的行为』（『拥有良善的良知』）等语结合理解。因为当你们带着温柔与端庄如此行事时，那时你们自己也会确信你们拥有良善的良知，并使那些对你们持恶见的人蒙羞。使徒命令信徒，随时预备为自己的信仰作出辩护，好使无论何时有人向我们询问信仰之事时，我们总能轻而易举地回答，并以温柔行事，如同一切事物一般，仿佛在上帝亲自临在之下。因为在主人面前，没有一个明智的奴仆会傲慢无礼。这样做的好处是，不信者会认识我们是怎样的人，并会公平对待我们。需要指出的是，使徒的这些话语，并不与上主的话语相矛盾。当上主说，当我们被带到首领和执政者面前时，不要为『要说什么来回答』而忧虑（路加福音 21:14），而彼得使徒现在却命令我们预备回答，那么上主所说的是关于见证，而彼得使徒所说的是关于教义。因为凡以为自己懂得某事却不加理解和探究的人，那便是自招非议。因为愚者的知识，是未经探究的话语。换言之，鉴于有人指控我们犯下诸多不法行为，并宣称我们的盼望是徒劳的，因此使徒命令我们准备深思熟虑的回答，并拥有值得称赞的生活，他将此称为良知。
  - type: paragraph
    text:
      ru: 1Пет.3:17.Ибо, если угодно воле Божией, лучше пострадать за добрые дела, нежели за злые;
      cn: (彼得前书 3:17) 　上帝的旨意若是叫你們因行善受苦，總勝過因行惡受苦。
  - type: paragraph
    text:
      ru: 1Пет.3:18.потому что и Христос, чтобы привести нас к Богу, однажды пострадал за грехи наши, праведник за неправедных,
      cn: (彼得前书 3:18) 因　基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到　上帝面前。在肉體中，他被治死；然而藉著　靈，他復活了。
  - type: paragraph
    text:
      ru: 'Представляется причина, не на то впрочем, что перед этим сказано, но на то, что сказано немного выше, именно на слова:«если и страдаете за правду, то вы блаженны»(1Петр 3:14); потому что лучше терпеть зло за добрые дела, нежели за злые. Если же кто захочет относить причину эту к ближайшей предшествующей речи, то слова«добрые дела»нужно понимать не о благотворительности другому, но вообще о добродетели; так же нужно понимать и слово«злые». Прибавляет:«если угодно воле Божией», показывая этим, что с нами ничего не бывает без попущения Божия, но бывает или для облегчения нас от грехов, или для обнаружения и славы нашей, или даже для спасения других. И это двояким образом. Или какой-нибудь праведник терпит зло для уцеломудрения иных грешников, по сказанному:«если праведник едва спасается, то грешный где явится?»(1Петр 4, 18). И отсюда двоякая польза: для страждущего праведника – приумножение праведности чрез терпение, а для грешника – обращение, как сказано. Или праведник страдает и для собственной своей славы и для обращения и спасения других, как и Христос. Посему Петр полагает здесь в пример Христа, потому что и Христос однажды пострадал не за Свои грехи, но за наши; почему и прибавляет:«праведник за неправедных», ибо Сам Христос«не сделал никакого греха»(1Петр. 2, 22), чтобы показать могущество Страдавшего, прибавил«однажды». А как Он пострадал для того, чтобы привести нас к Богу и Отцу Своему, то и показал, что не все страждущие страдают за грехи. И как Христос и Бог, и Человек, то страданиями Своими доставил нам и благодать двоякую. Умерши, как человек, Он освободил нас от смерти, положив начало нашему воскресению, и в Самом Себе дав пример, что умирающие умирают не без надежды воскресения. Ожив, то есть воскреснув из мертвых силой Божественности (ибо Он воскрес из мертвых не как человек, но как Бог), всех сущих во аде сооживил, совоскресив с Собой. Ибо, по словам евангелиста:«многие тела усопших святых воскресли... и явились многим»(Мф. 27, 52–53).'
      cn: '这可以解释为——但不是针对前面所说的，而是针对稍微上面所说的，确切地说是针对这句话：「你们若是为义受苦，就是福哉」（彼得前书 3:14）；因为为善行受苦好过为恶行受苦。但若有人想要将此理由联系到最近的先行话语，那么「善行」一词不应理解为对别人的慈善，而应普遍理解为美德；「恶」一词也应如此理解。


        又补充说：「若是照上帝的旨意」，借此表明，我们所遭遇的一切无一不是出于上帝的允许，而是为了减轻我们的罪孽，或为了显明我们的荣耀，甚至是为了拯救他人。而且这有双重的方式。一种情况是，某个义人受苦是为了使其他罪人受到管教，正如所说的：「若是义人仅仅得救，那不敬虔和犯罪的人将会在哪里显现呢？」（彼得前书 4:18）。从中得到双重益处：对受苦的义人而言，是借着忍耐增加义德；对罪人而言，是悔改，正如所说。或义人受苦也是为了他自己的荣耀，并为了他人的悔改和拯救，正如基督一样。


        因此彼得在此以基督为例，因为基督也曾一次受苦，不是为祂自己的罪，而是为我们的罪；这也是为什么他又补充说：「义者为不义之人」，因为基督自己「没有犯过任何罪」（彼得前书 2:22）。为了显示受苦者的权能，他补充了「一次」。又因为祂受苦是为了将我们引到上帝和祂的父那里，所以也表明并非所有受苦者都是为了罪而受苦。


        既然基督既是上帝也是人，那么祂借着自己的苦难，也为我们带来了双重的恩典。作为人，祂死了，使我们从死亡中得自由，开启了我们的复活，并在祂自己身上立下榜样，表明死者并非没有复活的希望而死。祂活过来，也就是说，借着神性的力量从死里复活（因为祂从死里复活不是作为人，而是作为神），使所有在阴间的人一同活过来，与祂一同复活。因为，根据福音书作者的话：「许多已故圣徒的身体复活了……并且向许多人显现」（马太福音 27:52-53）。'
  - type: paragraph
    text:
      ru: Быв умерщвлен по плоти, но ожив духом,
      cn: 按肉体被治死，但因灵而得生，
  - type: paragraph
    text:
      ru: 1Пет.3:19.которым Он и находящимся в темнице духам, сойдя, проповедал,
      cn: (彼得前书 3:19) 他藉此也曾去傳道給那些在監獄裏的靈聽；
  - type: paragraph
    text:
      ru: 'Быв умерщвлен«по плоти», то есть как человек; но ожив«духом», как Бог. Под словом«Духом»разумеют Бога, а под«плотью»– человека. О первом свидетельствует евангелист, когда повествует, что Христос, истинная Премудрость, беседуя с самарянкой, сказал:«Бог есть дух»(Ин. 4, 24), а о втором свидетельствует все Священное Писание. Отсюда ясно, что Христос сугуб (двоичен) не Лицем, но естеством.«Которым»поставлено вместо «почему». Ибо сказав, что Он умер за нас, неправедных, апостол говорит затем, что Он проповедовал и содержимым во аде. Дойдя до сего, апостол должен был еще объяснить, как смерть Христова полезна была для прежде усопших, и решить вопрос: если вочеловечение Господа было для спасения всех, то какое спасение получили прежде умершие?» Он сразу разрешает то и другое и говорит, что смерть Христова произвела то и другое вместе, надежду воскресения чрез Его воскресение и спасение усопших прежде. Ибо те, которые хорошо провели время своей жизни, и тогда получили спасение чрез сошествие Господа во ад, как думает святой Григорий. Он говорит: «Христос, явившись к находящимся во аде, спасает не всех без изъятия, но одних верующих»[2]. Ибо от произволения каждого зависело (как требовала разумность) не оставаться бесчувственным к богатому дару Творца, но представить самого себя достойным благости Подателя.'
      cn: 按着肉身被治死，就是作为一个人；却按着灵活了，就是作为上帝。「灵」这个词指的是上帝，而「肉身」指的是人。关于前者，福音书作者作证，当他叙述基督这位真正的智慧与撒玛利亚妇人交谈时，曾说：「上帝是灵」（约翰福音 4:24）；而关于后者，则有全部圣经作证。由此可见，基督是双重的（二元的），并非在位格上，而是在本性上。「藉着这个」（Которым）一词，在这里代替了「为什么」（почему）。因为使徒在说完祂为我们这些不义之人而死之后，接着说祂也向被囚于阴间的人传道了。谈到这里，使徒还需解释基督的死对那些早已安息的人有何益处，并解决这个问题：如果上主的道成肉身是为了所有人的救赎，那么那些先于祂而死的人获得了怎样的救赎呢？他立即解决了这两个问题，并说基督的死同时成就了两件事：藉着祂的复活带来的复活的盼望，以及对那些早已安息之人的救赎。因为那些生前行善的人，在那时也藉着上主降入阴间而获得了救赎，正如圣格里高利所认为的。他说：「基督显现于阴间的人，并非无一例外地拯救所有人，而只拯救那些信靠祂的人。」[2]因为这取决于每个人的自由意志（正如理性所要求的那样），不对造物主丰厚的恩赐无动于衷，而是使自己配得上赐予者的美善。
  - type: paragraph
    text:
      ru: 1Пет.3:20.некогда непокорным ожидавшему их Божию долготерпению, во дни Ноя, во время строения ковчега, в котором немногие, то есть восемь душ, спаслись от воды.
      cn: (彼得前书 3:20) 就是那從前在挪亞預備方舟、　上帝容忍等待的時候，不順從的人。當時進入方舟，藉著水得救的不多，只有八個人。
  - type: paragraph
    text:
      ru: 'Это положил в разрешение возражения. Иной мог сказать: «кто же другой проповедовал прежде Христа, и кому непокорившиеся осуждены»? Подобно апостолу Павлу (Рим. 2, 15), он мог бы указать на врожденные нам разумные силы: ибо те, которые созданы способными различать добро и зло и, несмотря на это, не творили добра, достойны осуждения. Но он не указывает на это. Почему? Потому, что это понятно для ума высшего и рассуждения более любомудрого, чем ум иудеев, привязанный к земле. Апостол подтверждает непокорность из Писания, и не со времен пророков, но почти от самого сотворения мира. Отсюда он представил, что спасение проповедовалось людям от начала, но они по наклонности своей к суете пренебрегали им, и в то время, как людей было бесчисленное множество, только восемь душ покорились проповеди и спаслись в устроенном ковчеге. Так как спасение было в воде, то он кстати относит это к святому крещению и говорит, что вода эта указывала на наше крещение, ибо и оно погубляет непокорных бесов, и спасает с верой приходящих в ковчег, то есть вЦерковь, и как вода смывает нечистоту, так и крещение, только оно производит отложение нечистоты не плотской, а при посредстве внешнего знака производит омытие скверны душевной. Оно есть как бы залог и вручение доброй совести пред Богом.'
      cn: 这番话是为了解答一个异议。其他人可能会说：「在基督降世之前，还有谁曾宣讲呢？那些不顺从者又是因何受定罪的呢？」他本可如同使徒保罗（罗马书 2:15）那样，指出我们与生俱来的理性能力：因为那些被造能分辨善恶，却仍不践行善行的人，是配得受定罪的。然而，他并未指出这一点。为何呢？因为这对于一个更崇高、更具哲思的悟性而言，是显而易见的，而犹太人的心智则依恋于尘世。使徒从圣经中证实了人类的不顺从，而且这并非始于先知时代，而是几乎自创世之初便已如此。由此他表明，救恩自始便已向世人宣讲，但人们因其趋向虚妄的习性而将其轻忽；当世人多如繁星之时，唯有八个灵魂顺服了这宣讲，并在所造的方舟中得以保全性命。既然救恩是在水中成就的，他便恰当地将此与圣洗圣事联系起来，并言明那水预示着我们的洗礼；因为洗礼同样毁灭那悖逆的邪魔，并拯救那些凭信进入方舟，即进入教会的人。如同水能洗去污秽，洗礼亦然，只不过它所涤除的并非肉身的污秽，而是借由一个外在的标记，洗净灵魂的污秽。它如同一个在上帝面前对纯善良心的保证和交付。
  - type: paragraph
    text:
      ru: 1Пет.3:21.Так и нас ныне подобное сему образу крещение, не плотской нечистоты омытие, но обещание Богу доброй совести, спасает воскресением Иисуса Христа,
      cn: (彼得前书 3:21) 這水所表明的浸禮，現在藉著耶穌　基督復活也拯救我們（這浸禮本不在乎除掉肉體的污穢，只求在　上帝面前有無虧的良心。）。
  - type: paragraph
    text:
      ru: 1Пет.3:22.Который, восшед на небо,
      cn: (彼得前书 3:22) 耶穌已經進入天堂，在　上帝的右邊；眾天使和有權柄的，並有能力的，都服從了他。
  - type: paragraph
    text:
      ru: 'Связь такая: так и нас спасает ныне подобное сему образу крещение, не плотской нечистоты омытие, но вопрошение или выпрашивание доброй совести пред Богом. Ибо сознающие за собой доброе, то есть привязанные к жизни непорочной, они-то и прибегают ко святому крещению. Что же делает крещение спасительным? Воскресение Христово. Ибо прежде страданий и воскресения Своего Христос объявил:«если кто не родится от воды и Духа, не может войти в Царствие Божие»(Ин. 3, 5), а по воскресении заповедал крестить все приходящие народы«во имя Отца и Сына и Святого Духа»(Мф. 28, 19),'
      cn: 连接是这样的：现今，这类似此形式的洗礼也拯救我们，并非肉体不洁的洗涤，而是向上帝寻求良善的良心。因为那些意识到自己是良善的，也就是说，那些忠于无瑕生活的人，他们才投奔圣洗。那么，是什么使洗礼具有拯救性呢？是基督的复活。因为在祂受难和复活之前，基督曾宣告：「人若不是从水和圣灵生的，就不能进入上帝的国」（约翰福音 3:5），而在祂复活之后，祂吩咐要给所有前来的人们施洗，「奉父、子、圣灵之名」（马太福音 28:19）。
  - type: paragraph
    text:
      ru: пребываетодеснуюБога и Которому покорились Ангелы и Власти и Силы.
      cn: 住在上帝的右边，并且天使、掌权者和有能者都已顺服了祂。
  - type: paragraph
    text:
      ru: Кому это"ему»?[*]Принятому Им в единение с Собой человеку.
      cn: 这个「他」指的是谁？[*]指被祂接纳，与祂自身合一的人。
- type: heading1
  text:
    ru: Глава четвёртая
    cn: 第四章
  children:
  - type: paragraph
    text:
      ru: 1Пет.4:1.Итак, как Христос пострадал за нас плотию, то и вы вооружитесь тою же мыслью;
      cn: (彼得前书 4:1) 　基督既為我們在肉身受苦，你們也當將這樣的心志作為兵器。因為在肉身受過苦的，就已經與罪斷絕了。
  - type: paragraph
    text:
      ru: '«Тою же мыслью»вместо: по тому же стремлению, по той же цели. Ибо недостает предлогаκατά, потому что сказано с опущением. Рассказав о домостроительстве спасения, о сошествии Господа во ад, и о том, для чего Он сходил туда, именно – для спасения содержимых во аде, апостол находит в смерти Господа иной повод к увещанию к добродетели. Если Христос умер за нас плотью (ибо, без сомнения, не бессмертным и Божественным Своим естеством), то и мы, в отплату Ему, должны для Него умереть греху, не вдаваться более в человеческие похоти, но остальное во плоти время жить только по воле Божией.'
      cn: 「以同一思想」（代替：按同一倾向，按同一目的）。因缺乏前置词 κατά，此乃省略之故。使徒在讲述了救恩的经纶、上主降下阴间、以及祂下阴间的原因——即为拯救被拘禁在阴间的人后，便在上主的死亡中找到了另一个劝勉人归于美德的契机。如果基督为我们受肉身之死（因为毫无疑问，祂并非以其不朽与神圣的本性受死），那么我们作为对祂的报答，也当为祂向罪而死，不再沉溺于属人的私欲，而将余下的肉身之生，唯独按上帝的旨意而活。
  - type: paragraph
    text:
      ru: Ибо страдающий плотью перестает грешить,
      cn: 因为在肉身中受苦的就不再犯罪了。
  - type: paragraph
    text:
      ru: 1Пет.4:2.чтобы остальное во плоти время жить уже не по человеческим похотям, но по воле Божией.
      cn: (彼得前书 4:2) 你們存這樣的心，從今以後就可以不從人肉體的情慾，只從　上帝的旨意在世度餘下的光陰。
  - type: paragraph
    text:
      ru: «Страдающий»вместо «умерший». Петр говорит подобно Павлу:«если мы с Ним умерли, то с Ним и оживем»(2Тим. 2, 11); и:«почитайте себя мертвыми для греха, живыми же для Бога»(Рим. 6, 11).
      cn: «受苦»代替«死去»。彼得如同保罗所说：«如果我们与祂同死，我们也必与祂同活»（提摩太后书 2:11）；并且：«你们也当这样，算自己向罪是死的，向着上帝却是活的»（罗马书 6:11）。
  - type: paragraph
    text:
      ru: 1Пет.4:3.Ибо довольно, что вы в прошедшее время жизни поступали по воле языческой, предаваясь нечистотам, похотям (мужеложству, скотоложству, помыслам), пьянству, излишеству в пище и питии и нелепому идолослужению;
      cn: (彼得前书 4:3) 因為往日隨從外邦人的心意行邪淫、惡慾、醉酒、荒宴、群飲，並可惡拜偶像的事，時候已經夠了。
  - type: paragraph
    text:
      ru: 'Апостол как бы так говорит: ужели вы не насытились, проведши столько времени в житейских удовольствиях? Разве вы жили не в такой нечистоте, в какой и язычники? И затем называет некоторые виды нечистоты.'
      cn: 使徒仿佛这样说：难道你们在世俗享乐中度过了如此长久的时间，却仍未满足吗？难道你们所过的生活，不也和外邦人一样污秽吗？接着，他列举了一些不洁之事。
  - type: paragraph
    text:
      ru: 1Пет.4:4.почему они и дивятся, что вы не участвуете с ними в том же распутстве, и злословят вас.
      cn: (彼得前书 4:4) 他們在這些事上，見你們不與他們同奔那放縱無度的路，就以為怪，毀謗你們。
  - type: paragraph
    text:
      ru: Язычники будут удивляться (ξενίζονται) вам, что вы не участвуете с ними в том же нечестии. Посему, после удивления вашей перемене и недоумении, они не только посрамятся, но и станут злословить; ибо благочестие для грешника отвратительно. Но они не останутся безнаказанными за такое злословие, а дадут ответ Судии всех, Который для этого и сидит непреложно и твердо. А как Судия есть судия живых и мертвых, об этом пишет апостол далее.
      cn: 异教徒必会因你们不与他们同流合污于那同样的不敬虔中而感到诧异（ξενίζονται）。故此，在对你们的转变感到惊奇和困惑之后，他们不仅会蒙羞，还会开始毁谤；因为虔敬对罪人而言是可憎恶的。然而，他们不会因这等毁谤而免受惩罚，却要向万有的审判者交账，祂为此而坚定不移、稳固地坐着。至于这位审判者如何是活人与死人的审判者，使徒在下文对此有所记述。
  - type: paragraph
    text:
      ru: 1Пет.4:5.Они дадут ответ Имеющему вскоре судить живых и мертвых.
      cn: (彼得前书 4:5) 他們必在那將要審判活人死人的主面前交帳。
  - type: paragraph
    text:
      ru: 'Связь такая: эти, злословящие вас, дадут ответ Судящему всех живых и мертвых. Судятся и мертвые. Это видно из сошествия Господа во ад. Ибо, явившись туда после крестной смерти, Он проповедал и там, как на земле, проповедал не словом, а делом. И как пребывание Его в мире для тех, которые с готовностью признали Его, послужило в оправдание, а для тех, которые не признали Его, в осуждение: так и из содержимых во аде тем, которые жили по плоти, Он явился на осуждение, а тем, которые жили по духу, т.е. вели жизнь духовную и добродетельную – на славу и спасение. Посему и справедливо называется Судиею живых и мертвых. Иначе объясняет св. Кирилл. Мертвыми здесь он называет тех между язычниками, которые умертвили себя названными (в 3 ст.) грехами, о которых и молит апостол, чтобы они обратились и отдали неукоризненный ответ Имеющему судить живых и мертвых. Живыми и мертвыми называет также праведных и грешных, которым Бог Слово, явившись во плоти, благовествовал Царство Небесное. Те грешники, которые приняли Его заповеди, сами как люди судят себя плотью, то есть осуждают в настоящей человеческой жизни плоть свою на посты, повержения на землю, слезы и прочие злострадания, чтобы жить по Богу духом, одушевляясь в этом случае изречением апостола:«если внешний наш человек и тлеет, то внутренний со дня на день обновляется»(2Кор. 4, 16).'
      cn: '这关联是如此：这些恶言诽谤你们的人，将要向那审判一切活人与死人者交账。死人也要受审判。这从上主降下阴间之事可见。因为，祂在十字架受死之后显现于彼，也在那里宣讲，如同在地上一样，并非以言语，而是以行动宣讲。正如祂在世间的居留，对于那些乐意承认祂的人，成为称义，而对于那些不承认祂的人，成为定罪；照样，在阴间被拘禁者中，祂向那些按肉体生活的人显现为定罪，而向那些按着圣灵生活的人——即过着属灵和有德生活的人——则显现为荣耀与救恩。因此，祂也公义地被称为活人与死人的审判者。


        圣济利禄则另有解释。在此他称死人为那些在异教徒中，因（第3节）所提之罪而使自己死灭的人；使徒也为他们祷告，愿他们能回转，并向那将要审判活人与死人者交出无可指摘的答复。他也称活人与死人为义人与罪人，上帝圣言道成肉身显现时，向他们传扬了天国福音。那些接受了祂诫命的罪人，他们自己，作为人，用肉体审判自己，也就是说，他们在现世的人间生活中，以禁食、俯伏在地、眼泪以及其他苦难来定肉体之罪，以便能按着上帝以灵生活，在此情况下，受到使徒这番话的激励：「我们外面的人虽然毁坏，里面的人却日日更新。」(哥林多后书 4:16)。'
  - type: paragraph
    text:
      ru: 1Пет.4:6.Ибо для того и мертвым было благовествуемо,
      cn: (彼得前书 4:6) 為此，就是死人也曾有福音傳給他們，要叫他們的肉體按著人受審判，他們的靈性卻靠　上帝活著。
  - type: paragraph
    text:
      ru: 'Некоторые из древних отцов слова«мертвым было благовествуемо»объясняли как особый отдел, нисколько не обращая внимания на связь их с предыдущей речью, – на то, что представляемое в причину нужно относить к тому, что предшествует. Ибо слова эти должно понимать как причину. Но они, как сказано, объясняли их отдельно, именно так: мертвыми, говорили они, Священное Писание называет людей двоякого рода: или тех, которые умерли во грехах, которые и не знали жизни никогда, или тех, которые сообразовались со смертью Христовой и умерли для мира сего, то есть для мирских похотей, а живут для Одного только Христа, как и Павел говорит:«А что ныне живу во плоти, то живу верой в Сына Божия»(Гал. 2, 20), Итак, говорят, те, которые умерли таким образом для Христа, плотью сами осуждают себя в прежней беспечной и рассеянной жизни, а живут они духом, то есть жизнью по примеру Христа. Ибо осуждение прежнего поведения делает их более благодушными и заботливыми относительно настоящего. Так они объясняют. Иной может и одобрить такое объяснение, но изречение еще не совершенно выяснено. Так как выше сказано о находящихся во аде, что«Он проповедал и находящимся в темнице духам»(1Петр 3, 19), то туда и нужно относить настоящее изречение, выраженное в качестве причины, а не смотреть на него, как на новое изречение. Посему мы говорим: так как перед этим апостол сказал:«Имеющему судить живых и мертвых»(1Петр 4, 5), а на это могли возразить: где же судятся живые, и где мертвые, – то он и подтверждает это сказанным выше, тем, что Он и находящимся в темнице духам проповедал, и что проповедь эта была в суде, то есть в осуждение. Одни, те, которые сознавали свою жизнь доброй, когда явилась туда Благость, тотчас соединились с Нею; а те, которые злы, от этого наполнились стыдом, и приняли себе осуждение. Вот что значит: Судия«мертвых». Судия«живых»: когда Господь пришел в тленную жизнь сию, то люди нашли в пришествии Его осуждение себе. Одни, добрые, с усердием приняли Его учение, а другие, злые, отказались от истины и сами сомкнули себе глаза от нее. Почему и сказано:«на суд», то есть на осуждение,«пришел Я в мир сей»(Ин. 9, 39), Так Христос есть Судия живых и мертвых!'
      cn: '一些古代教父将「福音曾传给死人」这些话解释为一个独立的段落，丝毫没有留意它们与前文的关联，——也没有留意到作为原因而提出的内容应该与前文相关联。因为这些话语应该被理解为原因。但他们，正如所说，单独解释这些话，具体如下：他们说，圣经将「死人」指代两类人：一是那些死于罪中，从未认识生命的人，二是那些与基督的死合一，为这世界，即为世俗的私欲而死，却只为基督而活的人，正如保罗所说：「我如今在肉身活着，是因信上帝之子而活。」（加拉太书 2:20）所以，他们说，那些如此为基督而死的人，在肉身中自我谴责过去那漫不经心和放荡的生活，而他们却在灵里活着，也就是说，是照着基督的榜样生活。因为对过往行为的谴责，使他们对现在更加宽和与谨慎。他们如此解释。旁人或许会赞同这种解释，但这个说法尚未完全阐明。既然上文提到地狱中的灵魂，说「他曾去向那些在监狱里的灵宣讲」（彼得前书 3:19），那么现在这个作为原因提出的说法就应该与那段话相关联，而不是将它看作一个新的说法。


        因此我们说：既然在此之前，使徒曾说：「他要审判活人死人」（彼得前书 4:5），而对此可能有人会反驳说：活人在哪里受审判？死人又在哪里受审判？——那么使徒就用上文所说的来证实这一点，即他曾向那些在监狱里的灵宣讲，并且这宣讲是在审判中，也就是说，是在定罪中进行的。有些人，那些自觉生活良善的，当恩善降临那里时，立刻与恩善联合；而那些邪恶的，则因此充满了羞耻，并接受了对自己的定罪。这就是「死人的审判者」的含义。「活人的审判者」：当上主降临到这必朽坏的生命中时，人们在他的降临中找到了对自己的定罪。有些人，良善的，热切地接受了他的教导；而另一些人，邪恶的，却拒绝了真理，并亲自对真理闭上了眼睛。所以才说：「我到这世上来，是为了审判」，也就是为了定罪（约翰福音 9:39）。如此，基督就是活人死人的审判者！'
  - type: paragraph
    text:
      ru: Чтобы они, подвергшись суду по человеку плотию, жили по Богу духом.
      cn: 为了使他们，在肉身中按着人受了审判，却能在灵里按着上帝活着。
  - type: paragraph
    text:
      ru: '«Подвергшись суду плотию». Полная мысль такая: когда Господь посетил находящихся во аде, то одни, которые в мире сем жили по плоти, осуждены, а другие, которые жили духовно, или воскресли вместе с Господом, ибо«многие тела усопших святыхвосстали» (Мф. 27, 52), или оживились доброй надеждой.'
      cn: 「按肉身受审判」。完整的思想是这样的：当主造访在阴间里的人之时，那些在这世上按肉身活着的人，他们被定罪了；而另一些按灵性活着的人，他们要么与主一同复活了，因为「许多睡了的圣徒的身体都复活了」（马太福音 27:52），要么被美好的希望所苏醒。
  - type: paragraph
    text:
      ru: 1Пет.4:7.Впрочем близок всему конец.
      cn: (彼得前书 4:7) 一切事物的結局近了；所以，你們要謹慎自守，警醒禱告。
  - type: paragraph
    text:
      ru: То есть и тем, которые оправданы при жизни, и тем, которые оправданы во аде. Ибо во второе пришествие Господа каждому воздастся должное вполне. Если кто-нибудь станет отвергать проповедь Господа во аде, говоря, что находящимся во аде, умершим, никакой нет пользы от нее, по сказанному:«во гробе кто будет славить Тебя?»(Пс. 6, 6); то такой человек грубо понимает проповедь, бывшую во аде, и под исповеданием разумеет не похвалу Богу, а исповедь, не понимая изречения:«Ни мертвые восхвалятТебя,Господа»(Пс. 113, 25). Поскольку настоящей жизнью совершение всех дел заканчивается (ибо все умрет без деятельности), то справедливо сказано:«во гробе кто будет славить Тебя?», потому что никто не совершит ничего такого, за что бы быть освобожденным и благодарить.
      cn: 也就是说，既指那些在生时已蒙称义的，也指那些在阴间蒙称义的。因为在主第二次降临时，每个人都将获得充分的报偿。若有人否认主在阴间的宣讲，说那些在阴间的死者，从宣讲中得不到任何益处，依据所说的：「在坟墓里，谁会赞美祢呢？」(诗篇 6:6)；那么这个人就粗糙地理解了在阴间的宣讲，并且将「认信」理解为告解，而非赞美上帝，没有理解这句经文：「死人不能赞美祢，上主」(诗篇 113:25)。由于今生是所有事务完成的终点（因为一切都将在无所作为中死去），所以有理由说：「在坟墓里，谁会赞美祢呢？」，因为没有人能完成任何足以获得解脱并感恩的事。
  - type: paragraph
    text:
      ru: «Конец»– то же, что исполнение, совершение.«Всему, – говорит, –близок конец»(1Петр 4, 7), а«конец»этот в истинном смысле есть Христос. Ибо Он есть совершенство всего, а не то, что напрасно почитают концом всего язычники, когда говорят одни, например, Эпикур, что конец всего – удовольствие, другие – знание или созерцание, иные – добродетель.
      cn: 「终结」即是成全、完成。「万物的结局近了，」——圣经说——(彼得前书 4:7)，而这「终结」在真正的意义上乃是基督。因为祂是万物的圆满，而并非那异教徒所徒然奉为万物之终结的，当他们中的一些人，例如伊壁鸠鲁，说万物的终结是享乐时，另一些人说是知识或默观，还有一些人说是美德。
  - type: paragraph
    text:
      ru: Итак, будьте благоразумны и бодрствуйте в молитвах.
      cn: 所以，要清醒，并在祷告中警醒。
  - type: paragraph
    text:
      ru: И как совершенство всего, Христос, пришло, и вы сообразуетесь с этим совершенством, то пусть не оказывается в вас самих недостатка ни в чем, ни в целомудрии, ни в трезвости, ни в бодрствовании на молитве (ибо молитва свойственна бодрствующим), ни в любви друг ко другу.
      cn: 并且，既然万有的全备——基督——已经降临，并且你们与这全备相称，那么，就愿你们自身在任何事上都毫无缺乏：无论在贞洁上，无论在警醒上，无论在祷告中的警醒上（因为祷告乃是警醒者所固有），无论在彼此相爱上。
  - type: paragraph
    text:
      ru: 1Пет.4:8.Более же всего имейте усердную любовь друг ко другу, потому что любовь покрывает множество грехов.
      cn: (彼得前书 4:8) 最要緊的是彼此熱切相愛；因為愛必遮掩許多的罪。
  - type: paragraph
    text:
      ru: 'Апостол Павел назвал любовь«исполнение закона»(Рим. 13, 10), а Петр называет ее могущею покрывать грехи: это потому, что милость к ближнему делает милостивым к нам Бога.'
      cn: 使徒保罗称爱为「律法的成全」（罗马书 13:10），而彼得称它能遮盖众罪：这是因为怜悯近人使上帝怜悯我们。
  - type: paragraph
    text:
      ru: 1Пет.4:9.Будьте страннолюбивы друг ко другу без ропота.
      cn: (彼得前书 4:9) 你們要互相款待，不發怨言。
  - type: paragraph
    text:
      ru: Сказав о любви, прибавляет и то, что в тесной связи с любовью,«страннолюбие», которое повелевает совершать без ропота, и тем, кои обилуют всяким даром, повелевает делиться с братом неимущим, например, имеющий учительское слово (ибо на это указывает«как слова Божии»(1Петр 4, 11); пусть преподает оное нуждающемуся в нем; имеющий обилие яств пусть подает не имеющему оных, подает без скупости, но сколько позволяет сила дарования Божия. К этому, говорит, я убеждаю вас для того, чтобы Бог прославлялся во всех, будут ли то язычники или близкие ваши.
      cn: 讲到爱之后，又补充了与爱紧密相关的一点，就是「好客」，吩咐我们要毫无怨言地行出来，并吩咐那些拥有各种恩赐的人，要与贫乏的弟兄分享，例如，拥有教导之言的人（因为「如同上帝的圣言」（彼得前书 4:11）指的就是这个），就当把这恩赐教导给需要它的人；拥有丰盛食物的人，就当把食物分给缺乏的人，要慷慨施予，不吝啬，而是按照上帝恩赐的能力所允许的程度。他说，我劝勉你们这样做，是为了让上帝在所有人中得荣耀，无论是外邦人还是你们的亲近之人。
  - type: paragraph
    text:
      ru: 1Пет.4:10.Служите друг другу, каждый тем даром, какой получил, как добрые домостроители многоразличной благодати Божией.
      cn: (彼得前书 4:10) 各人要照所得的恩賜彼此服事，作　上帝百般恩賜的好管家。
  - type: paragraph
    text:
      ru: 1Пет.4:11.Говорит ли кто,говорикак слова Божии; служит ли кто,служипо силе, какую дает Бог, дабы во всем прославлялся Бог через Иисуса Христа, Которому слава и держава во веки веков. Аминь.
      cn: (彼得前书 4:11) 若有講道的，要按著　上帝的聖言講；若有服事人的，要按著　上帝所賜的力量服事，叫　上帝在凡事上因耶穌　基督得榮耀。原來頌讚、權柄都是他的，直到永永遠遠。阿們。
  - type: paragraph
    text:
      ru: Не делать должного употребления из того, что принадлежит нам и чему мы господа, есть дело крайне несправедливое. Ибо не тот только должен делиться с неимеющим, кто имеет деньги, но и тот, кто имеет и прочие естественные дары, ибо сам тот, кто не имел их, получил их от Бога для того, чтобы делился с неимеющим.
      cn: 未能善用我们所拥有并由我们掌管之物，是极不公正之事。因为，不仅是拥有金钱的人才应该与匮乏者分享，拥有其他天然恩赐的人也当如此，因为即使是原本不拥有这些恩赐的人，也是从上帝那里领受的，为要与匮乏者分享。
  - type: paragraph
    text:
      ru: 1Пет.4:12.Возлюбленные! огненного искушения, для испытания вам посылаемого, не чуждайтесь, как приключения для вас странного,
      cn: (彼得前书 4:12) 親愛的弟兄啊，有火煉的試驗臨到你們，不要以為奇怪，似乎是遭遇非常的事，
  - type: paragraph
    text:
      ru: 1Пет.4:13.но как вы участвуете в Христовых страданиях, радуйтесь, да и в явление славы Его возрадуетесь и восторжествуете.
      cn: (彼得前书 4:13) 倒要歡喜；因為你們是與　基督一同受苦，使你們在他榮耀顯現的時候，也可以歡喜快樂。
  - type: paragraph
    text:
      ru: Это добавил апостол к сказанному пред сим. Он замечал, что некоторые соблазняются постигающими их скорбями, так как в законе обещается работающим Господу мир (Рим. 2, 10); и хотя выше, когда давал правила слугам, кратко утешал подобным образом, но теперь дает простор речи, и говорит:«возлюбленные!»Самым наименованием сим тотчас показывает, что скорби бывают с ними не потому, что Бог ненавидит их, но потому, что очень любит их.«Не чуждайтесь»– то же, что «не удивляйтесь» (ξενίζεσθε). Потом, скорби назвал«огненным искушением»(обжиганием), и тем показал, что они ниспосылаются на них для испытания. А испытание делает испытуемый предмет весьма ценным, подобно как золото и серебро. К этому прибавил нечто, блаженнейшее всего, именно, что претерпевающие это подобны своему Учителю Христу, и ныне терпят вместе с Ним бесчестие, для того, чтобы вместе с Ним же прославиться в будущем веке. Этим оканчиваются все стремления.
      cn: 使徒在前面所说的话之上又补充了这些。他注意到，有些人因临到他们的苦难而跌倒，因为律法应许事奉上主的人必得平安（罗马书 2:10）；并且虽然在上面，当他给予仆人规条时，曾以类似的方式简短地安慰过，但现在他展开论述，并说：「亲爱的！」仅凭这个称呼，他立刻表明苦难临到他们，并非因为上帝憎恨他们，而是因为祂非常爱他们。「不要将这事看作怪事」——与「不要感到惊讶」（ξενίζεσθε）是同一个意思。接着，他将苦难称为「火炼的试炼」（灼烧），并以此表明它们降临在他们身上是为了试验。而试验使被试验之物变得极其宝贵，就像金子和银子一样。除此之外，他还补充了一件至福的事，那就是，那些忍受这一切的人与他们的导师基督相似，并且现在与祂一同忍受羞辱，以便将来在来世与祂一同得荣耀。至此，一切的追求都告一段落。
  - type: paragraph
    text:
      ru: 1Пет.4:14.Если злословят вас за имя Христово, то вы блаженны, ибо Дух славы, Дух Божий почивает на вас. Теми Он хулится, а вами прославляется.
      cn: (彼得前书 4:14) 你們若為　基督的名受辱罵，便是有福的。因為　上帝榮耀的靈，常住在你們身上。他們毀謗　基督，你們卻榮耀　基督。
  - type: paragraph
    text:
      ru: 1Пет.4:15.Только бы не пострадал кто из вас, как убийца, или вор, или злодей,
      cn: (彼得前书 4:15) 你們中間卻不可有人因為殺人、偷竊、作惡、好管閒事而受苦。
  - type: paragraph
    text:
      ru: Нечестивыми Он хулится, а вами прославляется. Почему? Потому что, когда обвинение их на вас окажется ложным, их постигнет стыд, а вам будет слава.
      cn: 祂受不虔敬之人亵渎，却受你们荣耀。为什么？因为，当他们对你们的控告显为虚谎时，他们将蒙受羞辱，而你们将得荣耀。
  - type: paragraph
    text:
      ru: или как посягающий на чужое;
      cn: 或如侵犯他人所有者；
  - type: paragraph
    text:
      ru: 1Пет.4:16.а если как Христианин, то не стыдись, но прославляй Бога за такую участь.
      cn: (彼得前书 4:16) 若為作基督徒受苦，卻不要羞恥，倒要因這名歸榮耀給　上帝。
  - type: paragraph
    text:
      ru: «Посягающий на чужое»– тот, кто излишне любопытствует о чужих делах, чтобы иметь повод к злословию. Но такое занятие свойственно душе нечистой, злодейственной и готовой на всякое зло.
      cn: 《窥探他人者》——是指那些对他人事务过度好奇，以便有借口搬弄是非的人。然而，这样的行为是不洁、恶毒的灵魂所固有的，并随时预备行各样的恶。
  - type: paragraph
    text:
      ru: 1Пет.4:17.Ибо время начаться суду с дома Божия; если же прежде с насначнется,то какой конец непокоряющимся Евангелию Божию?
      cn: (彼得前书 4:17) 因為時候到了，審判必要從　上帝的家起首。若是先從我們起首，那不順從　上帝福音的人將有何等的結局呢？
  - type: paragraph
    text:
      ru: '«Судом» называет здесь апостол не осуждение, но исследование, рассмотрение. Наводит на них страх, чтобы отклонить их от жизни рассеянной. Почему и прибавляет: если прежде исследуется ваша жизнь, то какой конец будет непокорным? Начинается суд прежде с дома Божия. Ибо, по словамВасилия Великого, мы естественно негодуем на домашних своих, когда они провинятся пред нами. А Богу Свои суть не кто иные, как верные, наполняющие дом Его, то есть Церковь. Посему и Спаситель говорил: «преждескажет тем, которые по правую сторону Его»(Мф. 25, 34). Судом или рассмотрением называет здесь скорби, причиняемые верным от нечестивых, о наступлении коих предвозвещал Господь, говоря:«будут отдавать вас в судилища»и т. д. (Мф. 10, 17). Потом, как бы в утешение их, говорит: если вас, так близких к Нему, не щадит; то представьте себе, какой конец будет нечестивым? и подтверждает это местом из Писания: «если праведник едва спасается, то нечестивый и грешный где явится?» (ср.Притч. 11, 31). Смысл речи такой: если праведник получает спасение с трудом и напряжением: «ибоЦарствие Небесное силою берется»(Мф. 11, 12), и если кто получает оное, то со«многими скорбями»(Деян. 14, 22). То какую долю получат проводящие жизнь в неге и наслаждениях, – нужно подразумевать – нечестивые, в будущем веке? Посему и мы, страждущие по воле Божией, не должны унывать, но должны предавать Ему души свои, как верному Создателю, делая добро.'
      cn: '使徒在此称「审判」并非指定罪，而是指查究与审察。他使他们生发惧怕，为要使他们偏离散漫的生活。为此他又补充道：若是你们的生活首先被查究，那么那些悖逆者的结局将会如何呢？审判首先从上帝的家开始。因为，按照大圣瓦西里的言论，当我们的家人在我们面前犯错时，我们自然会对他们感到愤怒。而对于上帝，祂的「自己人」无非是那些充满祂的家，即教会的信徒。因此，救主也曾说：「（祂）首先会对那些在祂右边的人说」（马太福音 25:34）。


        他在此处称「审判」或「审察」是指由不敬虔之人加诸信徒的苦难，上主曾预言这些苦难的来临，说：「他们要把你们交给公会」等等（马太福音 10:17）。随后，他仿佛是为安慰他们，说道：如果连你们这些与祂如此亲近之人，祂都不宽容；那么请设想一下，那些不敬虔者的结局将会如何呢？并以一段经文证实了这一点：「若是义人仅仅得救，那不敬虔之人与罪人又将在何处显现呢？」（参阅箴言 11:31）。这段话的意义是这样的：若是义人要靠着劳苦与竭力才能获得救恩：「因为天国是努力进入的」（马太福音 11:12），而且若是有人获得它，那也是藉着「许多苦难」（使徒行传 14:22）。那么那些生活在安逸与享乐之中——这里指的是不敬虔之人——在未来的世代里将会得到怎样的结局呢？因此，我们这些按着上帝旨意受苦之人，不应沮丧，而应在行善之时，将自己的灵魂交托于祂，作为一位信实的造物主。'
  - type: paragraph
    text:
      ru: 1Пет.4:18.И если праведник едва спасается, то нечестивый и грешный где явится?
      cn: (彼得前书 4:18) 若是義人僅僅得救，那不虔敬和犯罪的人將有何地可站呢？
  - type: paragraph
    text:
      ru: 1Пет.4:19.Итак страждущие по воле Божией да предадут Ему, как верному Создателю, души свои, делая добро.
      cn: (彼得前书 4:19) 所以那照　上帝旨意受苦的人要一心為善，將自己元魂交與那信實的　創造主。
  - type: paragraph
    text:
      ru: Словом«воля Божия»апостол показывает или то, что страдания наши бывают не без промысла Божия, но посылаются от Него в качестве испытания, или то, что, страдая за волю Его, мы Ему же должны предоставлять и окончание страданий. Ибо Он верен и неложен в обещаниях Своих, и«не попуститнамбыть искушаемыми сверх сил»(1Кор. 10, 13). Как же должно предавать самого себя Богу?«Делая добро», говорит. Что же значит это? Значит полагаться на Бога со смиренномудрием, не придавать много цены своим страданиям, но чем более кто страждет, тем более должен почитать себя непотребным, говоря ко Господу:«праведен Ты во всем, что соделал с нами»(Дан. 3, 27).«Нечестивый»и«грешный»разнятся между собой тем, что нечестивый вовсе не признает Бога, а грешный, имея веру в Бога, презирает закон Его. Впрочем, и один и тот же человек может быть нечестивым и грешным. Ибо, совершая беззаконие, он, без сомнения, нечествует, не помышляя, во время греха, о бытии Божием (Пс. 9,25).
      cn: 使徒以「上帝的旨意」一词表明，我们的苦难并非没有上帝的护理，而是由祂作为考验而降临；或者，为祂的旨意受苦时，我们也当把苦难的终结交托于祂。因为祂信实无伪，在祂的应许上绝不虚假，并且「不让你们受试探过于所能受的」（哥林多前书 10:13）。那么，人当如何将自己交托于上帝呢？祂说：「要行善。」这又是什么意思呢？意思是带着谦卑的心倚靠上帝，不要过多地看重自己的苦难，而是谁受苦越多，就越当认为自己是不配的，向着上主说：「祢在一切所行之事上都是公义的」（但以理书 3:27）。「不虔敬的」和「罪人」之间的区别在于，不虔敬的人完全不承认上帝，而罪人虽然信上帝，却藐视祂的律法。然而，同一个人也可以既是不虔敬的又是罪人。因为，当他行不法之事时，他无疑是不虔敬的，在犯罪时没有思想上帝的存在（诗篇 9:25）。
- type: heading1
  text:
    ru: Глава пятая
    cn: 第五章
  children:
  - type: paragraph
    text:
      ru: '1Пет.5:1.Пастырей ваших умоляю я, сопастырь и свидетель страданий Христовых и соучастник в славе, которая должна открыться:'
      cn: (彼得前书 5:1) 我這作長老、作　基督受苦的見證、同享後來所要顯現之榮耀的，勸你們中間與我同作長老的人：
  - type: paragraph
    text:
      ru: 1Пет.5:2.пасите Божие стадо, какое у вас, надзирая за ним не принужденно, но охотно и богоугодно, не для гнусной корысти, но из усердия,
      cn: (彼得前书 5:2) 務要餵養在你們中間　上帝的群羊，按著　上帝旨意照管他們；不是出於勉強，乃是出於甘心；也不是因為貪財，乃是出於樂意；
  - type: paragraph
    text:
      ru: 1Пет.5:3.и не господствуя над наследиемБожиим,но подавая пример стаду;
      cn: (彼得前书 5:3) 也不像作　上帝產業之主，乃是作群羊的榜樣。
  - type: paragraph
    text:
      ru: 1Пет.5:4.и когда явится Пастыреначальник, вы получите неувядающий венец славы.
      cn: (彼得前书 5:4) 到了大　牧者顯現的時候，你們必得那永不衰殘的榮耀冠冕。
  - type: paragraph
    text:
      ru: 1Пет.5:5.Также и младшие, повинуйтесь пастырям.
      cn: (彼得前书 5:5) 你們年幼的，也要順服年長的。就是你們眾人也都要穿上謙卑，彼此順服；因為　上帝阻擋驕傲的人，賜恩給謙卑的人。
  - type: paragraph
    text:
      ru: 'Апостолу предлежало говорить о смиренномудрии, о котором он уже и упомянул, сказав:«делая добро»(1Петр 4, 19). Он называет себя«пастырем»(пресвитером) или по возрасту, или по достоинству епископа; ибо и книга Деяний (Деян 20, 17) называет пресвитерами и епископов. Потом, желая показать, что он преимуществует пред ними и что называет себя«сопастырем»по смиренномудрию, выставляет свое достоинство, именно то, что он«свидетель страданий Христовых». Он говорит как бы так: если я, изъяснивший вам такие видения, не нахожу низким называть себя сопастырем, то и вам несправедливо возноситься над подчиненными своими. Так же о смиренномудрии и Господь говорит:«если Я, Господь и Учитель, умыл ноги вам»(Ин. 13, 14). Апостол прибавляет, что он«соучастник в славе, которая должна открыться»,  для того, чтобы представить преимущество смиренномудрия, подобно как и Павел говорит:«когда явится Христос, жизнь ваша, тогда и вы явитесь с Ним»(Кол. 3, 4).«Не принужденно»пасет тот, кто в самом себе предлагает своим пасомым пример доброй деятельности, и тем побуждает их друг пред другом соревновать учителю.«Не для гнусной корысти»пасет тот, кто не выступает вперед с гордостью и не высится над подчиненными, но живет нероскошно, или кто не домогается драгоценных одежд и роскошных яств, которые производят гордость и служат поводом к гнусной корысти.«Наследием»называет священное собрание. Прибавление«подавая пример стаду»означает то же, что«пасите не принужденно». В словах«и когда явится Пастыреначальник»союз«и»поставлен вместо«дабы», то есть чтобы, когда явится Пастыреначальник, вам получить венец нетления.'
      cn: '使徒接下来要谈论谦卑，他已经提到过，就是说：「行善」（彼得前书 4:19）。他称自己为「牧者」（长老），或因年长，或因主教的尊严；因为使徒行传（使徒行传 20:17）也称主教为长老。接着，他想表明自己比他们更优越，并且出于谦卑称自己为「同牧」，同时展示了自己的尊严，即他「是基督受苦的见证人」。他仿佛是说：如果我，曾向你们阐明如此异象的人，不认为称自己为同牧是卑微的，那么你们高举自己凌驾于下属之上也是不公的。同样，上主也谈论谦卑，说：「如果我——上主和夫子，尚且洗了你们的脚」（约翰福音 13:14）。使徒补充说，他「是那将要显现之荣耀的同受者」，为了展现谦卑的优越性，正如保罗也说：「当基督——你们的生命显现时，那时你们也要与祂一同显现」（歌罗西书 3:4）。


        「并非出于勉强」牧养的人，是那在自己身上为自己的牧群提供良好行为的榜样，并因此激励他们彼此效法那位教师的。「并非为着可耻的贪婪」牧养的人，是那不骄傲自大，也不凌驾于下属之上，而是过着简朴生活的人；或者是不贪求华丽的衣裳和奢华的食物的人，这些事物会产生骄傲，并成为可耻贪婪的诱因。他称神圣的聚会为「产业」。附加的「给羊群作榜样」意即「牧养并非出于勉强」。在「当牧长显现时」这句话中，连词「和」是替代「以便」而用的，也就是说，为了当牧长显现时，你们能得到那不朽的冠冕。'
  - type: paragraph
    text:
      ru: все же, подчиняясь друг другу, облекитесь смиренномудрием, потому что Бог гордым противится, а смиренным дает благодать.
      cn: 总要彼此顺服，披戴谦卑，因为上帝抵挡骄傲的人，却赐恩典于谦卑的人。
  - type: paragraph
    text:
      ru: '«Облекитесь»значит: опояшьтесь, оденьтесь, или наложите на себя, окружите себя со всех сторон.'
      cn: 「『披戴』意即：束腰，穿上，或加诸己身，从各方环绕自己。」
  - type: paragraph
    text:
      ru: 1Пет.5:6.Итак смиритесь под крепкую руку Божию, да вознесет вас в свое время.
      cn: (彼得前书 5:6) 所以，你們要謙卑，服在　上帝大能的手下，到了時候他必叫你們升高。
  - type: paragraph
    text:
      ru: Апостол говорит о «времени своем», как и Давид говорит:«которое(древо)приносит плод свой во время свое»(Пс. 1, 3), словом«во...время»намекается на возвышение в будущем веке, каковое возвышение, и оно только одно, неизменно и прочно. Ибо здешнее возвышение не безопасно и не твердо, но скорее унижается, нежели возвышается. А что смирение возвышает, об этом Сам Господь говорит:«всякий, возвышающий сам себя унижен будет, а унижающий себя возвысится»(Лк. 14, 11). И:«ктоиз васхочет быть первым, будь из всех последним»(Мк. 9, 35). Словом«в свое время»апостол указал на то, что возвышение от смирения обещается в будущем веке. Ибо время неизменчивых благ – в будущем веке.
      cn: 使徒谈论「自己的时候」，正如达味所说：「它（树）按时结果」(诗篇 1:3)，藉着「……时候」一词，暗示着来世的升高，这种升高，而且唯有它，是不变且坚固的。因为此世的升高既不安全也不坚实，反而贬低，而非升高。至于谦卑使人升高，主亲自论及此事：「凡高举自己的，必被贬抑；凡贬抑自己的，必被高举。」(路加福音 14:11) 又：「你们中谁若想为首，就当做众人中的末位。」(马可福音 9:35) 藉着「在自己的时候」一词，使徒指出了谦卑所带来的升高是应许在来世的。因为不变之福祉的时刻，是在来世。
  - type: paragraph
    text:
      ru: 1Пет.5:7.Все заботы ваши возложи́те на Него, ибо Он печется о вас.
      cn: (彼得前书 5:7) 你們要將一切的憂慮卸給　上帝，因為他顧念你們。
  - type: paragraph
    text:
      ru: 'Потом, чтобы удалить страх, бывающий при смирении, говорит: не бойся, но всю заботу свою возложи на Господа, ибо Он печется, то есть заботится обо всем этом.'
      cn: 之后，为了消除伴随谦卑而来的恐惧，它说：不要害怕，但把你所有的忧虑都卸给上主，因为祂顾念，也就是说，祂关怀这一切。
  - type: paragraph
    text:
      ru: 1Пет.5:8.Трезвитесь, бодрствуйте, потому что противник ваш диавол ходит, как рыкающий лев, ища, кого поглотить.
      cn: (彼得前书 5:8) 務要謹守，警醒。因為你們的仇敵魔鬼，如同吼叫的獅子，遍地行走，尋找可吞吃的人。
  - type: paragraph
    text:
      ru: 1Пет.5:9.Противостойте ему твердою верою,
      cn: (彼得前书 5:9) 你們要用堅固的信心抵擋他，因為知道你們在世上的眾弟兄也是經歷這樣的苦難。
  - type: paragraph
    text:
      ru: На тех, которые привыкли спать душевно (а это значит быть поглощенными суетой) и чрез то обременяют трезвость души, нападает лукавый зверь отчаяния. Предостерегая от сего, ученик Христов убеждает всегда бодрствовать и беречься сеятеля плевелов, чтобы, когда мы спим, то есть ведем жизнь беспечную и ленивую, он тайно не насеял лукавых помыслов и не отвлек от истинной жизни. Потому что он, говорит, непрестанно обходит, как рыкающий лев, ища кого поглотить. Святой Иустин-мученик причину такого неослабного коварства и наветов со стороны диавола полагает в том, что диавол до пришествия Господня ясно не знал, сколь сильно его наказание, так как святые пророки выражались об этом загадочно (так Исаия всю печальную историю и судьбу диавола прикровенно изобразил в лице ассириянина (Ис. 18, 4–7)), а когда с пришествием Господа диавол ясно узнал, что ему и ангелам его предлежит и уготован«огонь вечный»(Мф. 25, 41), с тех пор он непрестанно строит верующим ковы, желая многих сделать общниками своего отступления, чтобы не одному терпеть бесславие осуждения, и в этом находить холодное и злобное утешение.[3]
      cn: 对于那些习惯于灵魂沉睡（这意味着被世俗的虚妄所吞噬），并因此加重了灵魂警醒的人，绝望的狡猾恶兽便会攻击他们。为此，基督的门徒劝诫我们常常警醒，并提防那撒稗子的，以免当我们沉睡，也就是说，当我们过着无忧无虑、懒惰的生活时，他暗中播撒邪恶的意念，并使我们偏离真实生命。因为经上说，他如同咆哮的狮子，不停地游走，寻找可吞噬的人。殉道者圣尤斯丁将魔鬼这种不懈的诡计和诱惑的原因归结为：魔鬼在主降临之前，并不清楚他的惩罚会是何等严重，因为圣先知们对此的表述是隐晦的（例如，以赛亚曾借亚述人的形象隐晦地描绘了魔鬼整个悲惨的历史和命运（以赛亚书 18:4-7）），而当主降临之后，魔鬼清楚地知道了永火已经为他及其使者预备好了（马太福音 25:41），从那时起，他便不停地向信徒设下诡计，渴望让许多人成为他背叛的同伙，为的是不让他独自承受被定罪的耻辱，并从中找到一种冷酷而恶毒的慰藉。[3]
  - type: paragraph
    text:
      ru: зная, что такие же страдания случаются и с братьями вашими в мире.
      cn: 知道，同样的苦难也临到你们在世上的弟兄们身上。
  - type: paragraph
    text:
      ru: Вероятно, много скорбей за Христа претерпевали те, которым писал это апостол Петр; потому-то он и утешает их в начале и в конце послания, – в начале тем, что они становятся общниками в страданиях Господа и наследниками имеющей открыться славы, а здесь тем, что страдают не они только одни, но и все верующие, живущие в мире.
      cn: 使徒彼得致信的那些人，很可能为基督忍受了诸多磨难；正因如此，他在书信的开头和结尾都安慰他们，——在开头，他藉着指出他们成为主基督苦难的共同领受者，以及那将要显现之荣耀的继承者来安慰他们；而在此处，他藉着指出受苦的不单单是他们自己，还有所有生活在世上的信徒来安慰他们。
  - type: paragraph
    text:
      ru: 1Пет.5:10.Бог же всякой благодати, призвавший нас в вечную славу Свою во Христе Иисусе, Сам, по кратковременном страдании вашем, да совершит вас, да утвердит, да укрепит, да соделает непоколебимыми.
      cn: (彼得前书 5:10) 然而那賜諸般恩典的　上帝，就是那曾召我們因　基督耶穌得享他永遠的榮耀，等你們暫受苦難之後，必使你們得以完全，堅固你們，賜力量給你們，使你們立穩。
  - type: paragraph
    text:
      ru: 1Пет.5:11.Ему слава и держава во веки веков. Аминь.
      cn: (彼得前书 5:11) 願榮耀與權柄歸給他，直到永永遠遠。阿們。
  - type: paragraph
    text:
      ru: И в начале послания (1Петр. 1:2–3) апостол сказал, что Отец помиловал нас чрез Сына, и теперь, в конце оного, учит, что тот же Отец призвал нас чрез Сына. Ибо в том и цель апостолов, чтобы проповедовать таинство, хотя бы они делали это вместе с увещанием.
      cn: 在书信的开头（彼得前书 1:2-3），使徒说过父借着子怜悯了我们；而如今，在该书信的末尾，他教导说，那位父借着子召叫了我们。因为这正是使徒们的目标，要宣讲奥秘，即使他们这样做是伴随着劝诫。
  - type: paragraph
    text:
      ru: 1Пет.5:12.Сие кратко написал я вам чрез Силуана, верного, как думаю, вашего брата, чтобы уверить вас, утешая и свидетельствуя, что это истинная благодать Божия, в которой вы стоите.
      cn: (彼得前书 5:12) 我略略的寫了這信，託我所看為忠心的兄弟西拉轉交你們，勸勉你們，又證明你們所站立的這恩典，是　上帝的真恩。
  - type: paragraph
    text:
      ru: Этот Силуан превосходно верует и усердно подвизается в деле проповеди. О нем и Павел упоминает, и вместе с Тимофеем называет, в посланиях, сотрудником; так, он пишет:«Павел и Силуан и Тимофей»(1Фес. 1, 1).
      cn: 这位西路安信心卓越，并在宣讲圣道的事业上殷勤竭力。保罗在书信中也提及他，并与提摩太一同称他为同工；他如此写道：「保罗和西路安和提摩太」（帖撒罗尼迦前书 1:1）。
  - type: paragraph
    text:
      ru: 1Пет.5:13.Приветствует вас избранная, подобновам, церковьв Вавилоне и Марк, сын мой.
      cn: (彼得前书 5:13) 在巴比倫與你們同蒙揀選的教會問你們安。我兒子馬可也問你們安。
  - type: paragraph
    text:
      ru: «Вавилоном» называет Рим по причине его знатности, которой и Вавилон пользовался долгое время. «Избранной» называет Церковь Божию, составившуюся в Риме. Марком называет евангелиста, именуя его и сыном по Духу, а не по плоти. Ему-то он и повелел написать Евангелие.
      cn: 称罗马为『巴比伦』，是由于它拥有如同巴比伦城曾长久享有的显赫地位。称在罗马建立起来的上帝的教会为『蒙拣选的』。称马可为圣史，并称他为按着圣灵而非按着肉身的儿子。而正是他吩咐马可写福音书的。
  - type: paragraph
    text:
      ru: 1Пет.5:14.Приветствуйте друг друга лобзанием любви.
      cn: (彼得前书 5:14) 你們要用愛心彼此親嘴問安，願平安歸與你們凡在　基督耶穌裏的人。阿們。
  - type: paragraph
    text:
      ru: 'Тогда как Павел пишет (Рим. 16, 16;1Кор. 16,20),  чтобы верующие приветствовали друг друга«лобзанием святым», Петр говорит: приветствуйте«целованием любви». Но у обоих мысль одна и та же. Павел знает, что любовь о Господе больше всех добродетелей, даже мученичества за Христа, и потому целованием святым называет то, которое дается в Боге. И Петр, когда говорит о целовании любви, разумеет: истинной любви. Посему и прибавляет:'
      cn: 保罗写道（罗马书 16:16，哥林多前书 16:20），要信徒彼此以「圣洁的亲吻」问安，而彼得说：要以「爱的亲吻」问安。但他们二人的意旨是相同的。保罗深知，在上主里的爱超乎一切美德，甚至超乎为基督殉道，因此他称在上帝里所给予的亲吻为圣洁的亲吻。彼得亦是如此，当他谈及爱的亲吻时，他所指的乃是真实的爱。因此他便补充道：
  - type: paragraph
    text:
      ru: Мир вам всем во Христе Иисусе.
      cn: 愿你们众人在基督耶稣里平安。
  - type: paragraph
    text:
      ru: Говорит не об обычном, человеческом мире, но желает им получить тот мир, которого удостоил их Христос, отходя на страдания и говоря:«мир оставляю вам», и замечая о различии:«не так, как мир даёт»(Ин. 14, 27). Ибо должно хранить мир не по пристрастию, но потому, что вы связаны любовью, так что должно переносить удары от соперников. Ученики Господа везде, в конце посланий, прилагают молитву, как бы печать, и тем показывают искреннюю свою святость. Некоторые из бывших прежде нас думали, что Марк, о котором говорит святой Петр, был сыном его и по плоти. Догадку эту они основывали на том, что в Деяниях апостольских Лука говорит, что после того, как ангел Божий чудесно освободил апостола Петра из темницы, в которую он посажен был Иродом, и перестал руководить его, он, апостол Петр,«пришел к дому матери Иоанна, называемого Марком»(Деян. 12, 12). Они полагали, что он пришел к собственному дому и к законной своей супруге.
      cn: 这里谈论的并非普通的、属人的平安，而是愿他们获得基督所赐予的平安。在祂即将受难离去之际，曾说：「我将平安留给你们」，并指出其间的不同：「我所赐的，不像世人所赐的」（约翰福音 14:27）。因为你们当保守这平安，并非出于偏爱，而是因为你们被爱所维系，如此一来，就当忍受来自敌手的打击。上主的门徒们在各处书信的末尾，都附上祷告，如同印记，借此显明他们真诚的圣洁。我们之前的一些人曾认为，圣彼得所提及的马可，乃是他的亲生儿子。他们将这一推测建立在以下事实之上：在《使徒行传》中，路加提及，在上帝的天使奇迹般地将使徒彼得从希律王囚禁他的监牢中释放出来，并且不再引导他时，他，使徒彼得，「来到那称呼马可的约翰的母亲的家」（使徒行传 12:12）。他们认为，他是来到自己的家，并来到他合法的妻子那里。
  - type: paragraph
    text:
      ru: Первое соборное послание апостола Петра написано из Рима.
      cn: 使徒彼得第一大公书信写自罗马。
footnotes:
  '[1]':
    ru: '«Есть два страха: один первоначальный, а другой совершенный, и один свойствен, так сказать, начинающим быть благочестивыми, другой же есть страх святых совершенных, достигших в меру совершенной любви».Авва Дорофей. «Душеполезные поучения и послания», 4.'
    cn: '「有两种畏惧：一种是最初的，另一种是完全的；一种可说是初蒙恩典、开始敬虔之人所具有的，而另一种是那些达到完全的爱之尺度的圣徒、完全人所具有的畏惧。」


      阿爸多罗斐。《有益灵修的教诲与书信》，第四篇。'
  '[2]':
