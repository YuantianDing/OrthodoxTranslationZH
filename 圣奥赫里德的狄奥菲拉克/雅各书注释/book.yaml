  - type: paragraph
    text:
      ru: Содержание соборного послания Святого апостола Иакова
      cn: 圣使徒雅各公函内容
  - type: paragraph
    text:
      ru: Апостол Иаков написал послание свое к двенадцати коленам, находящимся в рассеянии и уверовавшим в Господа нашего Иисуса Христа, а написал он его с целью учительной. В нем он поучает, что искушения различны, одни от Бога, а другие от собственного сердца человеческого, что веру должно показывать не в слове только, но и на деле и что оправдываются не слушатели закона, но исполнители его. Потом он предписывает относительно богатых, чтобы в собраниях богатые не предпочитались бедным, но были вразумляемы как надменные, а далее предлагает он утешение обижаемым, увещевает их долготерпеть до явления Судии, поучает терпению, указывает пользу терпения из примера Иова, заповедует призывать к больным пресвитеров, стараться обращать заблудших к истине, говорит, что в награду за это Господь подает прощение грехов, и таким образом оканчивает послание.
      cn: 使徒雅各写了他的书信，致散居各地并信了我们主耶稣基督的十二支派，他写此信是为了教导。在其中他教导说，试探有各种各样，有些来自上帝，另一些则来自人自己的心；信心不应只显于言语，也应显于行动；以及称义的不是律法的听者，而是律法的遵行者。之后，他针对富人规定，在聚会中富人不可受优待胜过穷人，反而要被劝诫，因他们是傲慢的。接着，他向受欺压者提供安慰，劝勉他们恒久忍耐，直到审判者显现；他教导忍耐，指出约伯的榜样中忍耐的益处；他吩咐为病人召请长老们，努力使迷失者归向真理；他说，作为这事的回报，上帝赐予罪的赦免；他如此结束了这书信。
  - type: paragraph
    text:
      ru: Оглавление соборного послания Святого апостола Иакова
      cn: 圣使徒雅各大公书信目录
  - type: paragraph
    text:
      ru: О терпении, о нелицемерной вере, о смирении в отношении к ближнему, о внутреннем разжжении нашем и происходящих от него страстях, чему причиной не Бог, но от Него все, что ни есть у нас доброго. О кротости и непорочности, о доброй деятельности, доставляющей блаженство. О благоразумии и сдержанности в слове, о нелицеприятной, по закону, любви ко всем, о том, что человек оправдывается не верою только, но и делами, и не тем или другим отдельно, но обоими вместе. О том, что опрометчивый и необузданный язык умерщвляет своего владетеля, почему необходимо направлять оный к благохвалению и прославлению Бога. О добром обращении друг с другом, без спора из-за славолюбия и мнения человеческого. О мудрости Божественной, о том, что от беспечности и сладострастия происходят споры, распри и вражда с Богом. О нужде покаяния для спасения. О неосуждении ближнего. О том, что не от человека, но от Бога зависит исправление поведения мужа. О любостяжании богатых и наслаждении их в мире и о праведном осуждении от Бога. О долготерпении и перенесении страданий и об истине; частные наставления каждому, сообразные с верой, и о том, что нужно служить спасению ближнего.
      cn: 论忍耐、论无伪的信心、论对待邻人的谦卑，论我们内在的炽热及其所产生的情欲，其原因并非上帝，而是我们所拥有的一切美善都来自祂。论温顺与纯洁无瑕，论带来福乐的美善行为。论审慎与言语上的克制，论依循律法、不偏待人的爱众生，论人得以称义并非仅凭信心，也凭着行为，并非二者择一，而是二者兼具。论轻率放纵的舌头致其主人于死地，因此有必要将其导向赞美与荣耀上帝。论彼此间的美善相处，不因爱慕虚荣与人的意见而争执。论神圣的智慧，论争论、纷争以及与上帝为敌源于疏忽和纵情享乐。论为了救恩而悔改的必要性。论不论断邻人。论丈夫行为的改进并非取决于人，而是取决于上帝。论富人的贪婪及其在世上的享乐，以及来自上帝的公义审判。论恒忍、承受苦难与真理；符合信仰的个人教导，以及论必须为邻人的救恩效力。
- type: heading1
  text:
    ru: Феофилакт БолгарскийТолкование на соборное послание апостола Иакова
    cn: 圣奥赫里德的狄奥菲拉克《雅各书注释》
  children: []
- type: heading1
  text:
    ru: Глава первая
    cn: 第一章
  children:
  - type: paragraph
    text:
      ru: Иак.1:1.Иаков, раб Бога и Господа Иисуса Христа, двенадцати коленам, находящимся в рассеянии, – радоваться.
      cn: (雅各书 1:1) 作　上帝和　主耶穌　基督僕人的雅各請散住十二個支派之人的安。
  - type: paragraph
    text:
      ru: Иаков, Богу и Господу Иисусу Христу раб, обеманадесяте коленома, и́же в разсеянии, радоватися.
      cn: 雅各，上帝与主耶稣基督的仆，写信给散居的十二支派，愿你们喜乐。
  - type: paragraph
    text:
      ru: Раб Бога, то есть Отца и Господа – Иисуса; а если равно раб Отца и Сына, то Сын равен Отцу и по существу, и по чести. Апостолы Господа выше всякого мирского достоинства поставляют то, что они рабы Христа.
      cn: 上帝的仆人，即父和主——耶稣的仆人；若同样是父与子的仆人，那幺子在本质和尊荣上都与父平等。主的使徒们将他们是基督的仆人这一点置于一切世俗尊荣之上。
  - type: paragraph
    text:
      ru: Иак.1:2.С великою радостью принимайте, братия мои, когда впадаете в различные искушения,
      cn: (雅各书 1:2) 我的弟兄們，你們落在諸般試探中，都要以為大喜樂；
  - type: paragraph
    text:
      ru: Всяку радость имейте, братие моя, егда́ во искушения впадаете различна,
      cn: 我的弟兄们，当你们落在百般试炼中时，当以为全然的喜乐，
  - type: paragraph
    text:
      ru: Искушения и печаль ради Бога апостол признает похвальными и достойными радости, потому что они – самые крепкие узы и возращение любви и сокрушения, почему и сказано:«Сын мой! если ты приступаешь служить Господу Богу, то приготовь душу твою к искушению»(Сир. 2, 1), и Христос сказал:«в мире будете иметь скорбь; но мужайтесь»(Ин. 16, 33), ибо без подвигов нельзя получить венцов ни в мире, ни от Бога.
      cn: 圣使徒认为，为上帝所受的诱惑和悲伤是值得称赞并配得喜乐的，因为它们是最坚固的纽带，也是爱与痛悔的增长。这就是为什么经上说：「我的孩子！如果你前来事奉上主上帝，就要预备你的心经受诱惑。」(德训篇 2:1) 基督也说：「你们在世上将有苦难；但要刚毅。」(约翰福音 16:33) 因为若没有苦修，就不能获得冠冕，无论是世上的还是来自上帝的。
  - type: paragraph
    text:
      ru: 'Называет их не детьми, но братьями – по смиренномудрию. Искушения доставляют рачительным всякую радость потому, что через них обнаруживается испытание таковых, а испытание приводит к совершенному действию. Но тогда кто-нибудь скажет: если таково действие искушений, то как Христос научает нас в молитве просить Бога:«и не введи нас в искушение»(Мф. 6, 13)? Отвечаем: искушения бывают двоякого рода. Одни происходят от нас, а другие посылаются на нас Богом для упражнения и прославления нашего. И от нас происходящие искушения двоякого же рода. Одни бывают от нерассудительной храбрости, которую мы называем дерзостью и от которой заповедует нам Господь беречься, потому что хотя и бодр дух, но во время подвигов бодрость угасает, почему храбрость та не оканчивается добром для имеющих ее. Другие искушения, как, например, гибель содомлян (Быт. 19, 13), посылаются за грехи. Этих искушений всеми силами должно избегать через жизнь безгрешную; искушений же от Бога, каковы были Иову, Аврааму, не только не должно избегать, но, если возможно, нужно привлекать их терпением и благодарением, потому что они удостаивают прославления и венцов. Сказал«искушения различна»потому, что одни искушения, как объяснили мы, бывают от Бога, а другие от нас.'
      cn: 称他们为弟兄，而非子女——因着谦卑。试探给殷勤的人带来各样喜乐，因为藉着它们，这类人的受试验之处得以显明，而受试验引向全然的行动。但那时会有人说：如果试探的作用是这样，那么基督如何在祷告中教导我们祈求上帝：「不要让我们陷入试探」（马太福音 6:13）？我们回答说：试探有两种。一种源于我们自身，另一种则由上帝降临于我们，为要操练我们并荣耀我们。源于我们自身的试探也有两种。一种源于不明智的勇敢，我们称之为鲁莽，主命令我们要警惕这种鲁莽，因为虽然心灵是警醒的，但在苦修之时，这种警醒会消退，因此，那种勇敢不会给拥有它的人带来好结果。另一种试探，例如所多玛人的毁灭（创世记 19:13），是因罪孽而被降下的。应该尽一切力量避开这类试探，借着无罪的生活；而那些来自上帝的试探，例如临到约伯、亚伯拉罕的，不但不可逃避，而且，如果可能，当以忍耐和感恩去迎接它们，因为它们使人配得荣耀和冠冕。他说「试探是不同的」，是因为正如我们所解释的，一些试探来自上帝，另一些则来自我们自身。
  - type: paragraph
    text:
      ru: Иак.1:3.зная, что испытание вашей веры производит терпение;
      cn: (雅各书 1:3) 因為知道你們的信心經過試驗，就生忍耐。
  - type: paragraph
    text:
      ru: 'Ведяще, яко искушение вашея веры соделовает терпение:'
      cn: 因为你们知道，你们信德的试炼生出忍耐：
  - type: paragraph
    text:
      ru: Хотя искушения, как сказали мы, двоякого рода, но терпение полезно в каждом их роде. В искушениях от Бога оно полезно тем, что через них мы получаем прославление, как получили оное Авраам, Иов, а в искушениях от нас – тем, что перенесением их с благодарностью мы делаем как бы вознаграждение за свои грехи, ибо кто сознает свои грехи, тот положил начало своему спасению и приобрел себе черту праведника, так как праведный муж первый обвиняет сам себя.
      cn: 虽然诱惑，正如我们所说，分为两类，但忍耐对每一种诱惑都有益处。在来自上帝的诱惑中，忍耐之所以有益，是因借着它们我们得以领受荣耀，正如亚伯拉罕、约伯所领受的；而在来自我们自身的诱惑中，忍耐之所以有益，是因借着带着感恩忍受它们，我们仿佛为自己的罪过作出弥补。因为凡是承认自己罪过的人，就是为他的救赎奠定了开端，并为自己赢得了义人的特质，因为义人首先谴责他自己。
  - type: paragraph
    text:
      ru: Иак.1:4.терпение же должно иметь совершенное действие
      cn: (雅各书 1:4) 但忍耐也當成功，使你們成全、完備，毫無缺欠。
  - type: paragraph
    text:
      ru: Терпение же дело совершенно да и́мать,
      cn: 而忍耐当有完全的工，
  - type: paragraph
    text:
      ru: 'Примечай: апостол не сказал в определенном наклонении: «терпение имеет совершенное действие», но в повелительном:"да имать", ибо он не возвещает готовую уже добродетель, но заповедует такую, которая ныне должна быть совершаема.'
      cn: 注意：使徒并非以陈述语气说：「忍耐有完全的作为」，而是以命令语气说：「使之有」。因为他所宣示的并非一种已然完备的美德，而是命令一种现在必须被实践的美德。
  - type: paragraph
    text:
      ru: чтобы вы были совершенны во всей полноте, без всякого недостатка.
      cn: 愿你们在一切的丰盛中得以完全，毫无缺乏。
  - type: paragraph
    text:
      ru: Яко да будете совершении и всецели, ни в чемже лишени.
      cn: 为使你们完全、全然、无何或缺。
  - type: paragraph
    text:
      ru: Причиной совершенного действия называет мудрость, ибо знает, что испытание веры и терпения в искушениях не есть удел всех людей, но мудрых о Боге, почему желающих выказать веру и терпение возбуждает к молитве о мудрости.
      cn: 他将智慧称为完善行动的缘由，因为他知道，在试探中考验信心和忍耐，并非所有人的份，而是那些在上帝里有智慧之人的份；因此他劝勉那些愿显明信心和忍耐之人，去祈祷以求得智慧。
  - type: paragraph
    text:
      ru: Иак.1:5.Если же у кого из вас недостает мудрости, да просит у Бога, дающего всем просто и без упреков, – и дастся ему.
      cn: (雅各书 1:5) 你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的　上帝，主就必賜給他。
  - type: paragraph
    text:
      ru: Аще же кто от вас лишен есть премудрости, да просит от дающаго Бога всем нелицеприемне и не поношающаго, и дастся ему.
      cn: 你们中若有人缺乏智慧，当向那施予众人、不偏待人、且不斥责人的上帝祈求，就必赐给他。（雅各书 1:5）
  - type: paragraph
    text:
      ru: Говорит не о человеческой мудрости, но о духовной, ибо в ней указывает нам причину совершенного действия, а причина эта – небесная мудрость, укрепляясь которой мы сможем совершить добро вполне.
      cn: 它所言说的并非人类的智慧，而是属灵的智慧；因为在其中，它指示我们完善行动的原因，而这原因就是属天的智慧，借着它蒙受坚固，我们就能完全地行善。
  - type: paragraph
    text:
      ru: Иак.1:6.Но да просит с верою, нимало не сомневаясь
      cn: (雅各书 1:6) 只要憑著信心求，一點不疑惑；因為那疑惑的人，就像海中的波浪，被風吹動翻騰。
  - type: paragraph
    text:
      ru: 'Да просит же верою, ничтоже сумняся:'
      cn: 他只管凭着信心求，毫无疑惑。
  - type: paragraph
    text:
      ru: Если верит, пусть просит, а если не верит, пусть и не просит, ибо не получит ничего из просимого. Сомневающийся и тот, кто просит с высокомерием. Но очевидно, что кто просит сомневаясь, тот есть обидчик, ибо если ты не уверен, что Бог исполнит просьбу твою, то вовсе не приступай к прошению, чтобы не оказаться тебе через неразумное двоедушие обвинителем Того, Кто все может. Посему нужно умолять об избавлении от такой постыдной болезни.
      cn: 如果相信，就当祈求；如果不信，就不要祈求，因为所求的一无所得。这指的是怀疑者，以及以傲慢之心祈求的人。但显而易见，以怀疑之心祈求的人，乃是冒犯者，因为如果你不确信上帝会应允你的祈求，就根本不要开始祈求，以免你因着不明智的两心二意，成了那位全能者的控告者。因此，需要恳求摆脱这种可耻的疾病。
  - type: paragraph
    text:
      ru: сомневающийся подобен морской волне, ветром поднимаемой и развеваемой.
      cn: 那疑惑的人如同海浪，被风扬起又摇荡。
  - type: paragraph
    text:
      ru: Сумняйся бо уподобися волнению морскому, ветры возметаему и развеваему.
      cn: 因为凡疑惑的，如同海中的波涛，被风扬起，又被吹散。
  - type: paragraph
    text:
      ru: Иак.1:7.Да не думает такой человек получить что-нибудь от Господа.
      cn: (雅各书 1:7) 這樣的人不要想從　主那裏得甚麼。
  - type: paragraph
    text:
      ru: Да не мнит бо человек он, яко приимет что от Бога.
      cn: 因为那人切莫以为他将从上帝那里领受什么。
  - type: paragraph
    text:
      ru: Сомневающийся – тот, кто далек от твердого действования и недоумевает, сбудется то или иное или нет. Такой не получит, как не уверенный относительно того, чего ожидает.
      cn: 疑惑者，乃是远离坚定行动，并对某事或彼事能否成就而犹豫不决之人。此人将不得所愿，因其对自己所期待的并无确信。
  - type: paragraph
    text:
      ru: Иак.1:8.Человек с двоящимися мыслями не тверд во всех путях своих.
      cn: (雅各书 1:8) 心懷二意的人，在他一切所行的路上都沒有定見。
  - type: paragraph
    text:
      ru: Муж двоедушен неустроен во всех путех своих.
      cn: 心怀二意的人，在他一切的道路上，都没有定见。
  - type: paragraph
    text:
      ru: 'Двоедушный – находящийся в замешательстве, неустроенный, несовершенный, двоящийся мыслями, лицемер, а путями называет апостол душевные движения, которыми возвышаются надежды, добрые ли то или недобрые, как и Давид сказал:«пути мояТыпровидел еси»(«пути мои известны Тебе») (Пс. 138, 3). Иначе: мужем двоедушным апостол называет неустановившегося, который не стремится крепко ни к будущему, ни к настоящему, но носится туда и сюда и придерживается то будущего, то настоящего. Такого уподобляет он морской волне, не имеющей постоянства, и цвету травы, цвету, остающемуся не долго, но засыхающему с восходом солнечным, почему и сравнил его не с травой, которая продолжительнее, но с цветом ее, чтобы представить его кратковременность.'
      cn: '心怀二意者——是指身处困惑、不安稳、不完全、思虑纷歧、伪善的人；使徒称「道路」为灵魂的动向，无论善恶，希望借此而生，正如达味圣王所说：「我的道路，上主都预见。」（上主深知我的行径。）（诗篇 138:3）


        换言之，使徒称心怀二意之人为无定之人，他既不坚定地追求未来，也不坚定地追求当下，却摇摆不定，一会儿依附未来，一会儿依附当下。


        他将这种人比作没有恒常的海浪，以及草之花，这花不能久留，却随着日出而枯萎；因此，他将其与草之花相比，而非与持续更久的草相比，以呈现其短暂性。'
  - type: paragraph
    text:
      ru: 'Почему же назвал его двоедушным? Потому что он не стремится с уверенностью ни к настоящей, ни к будущей жизни, ибо в Писании душой называется и жизнь, например:«вся, елика и́мать человек, даст за душу свою»(«за жизнь свою отдаст человек все, что есть у него») (Иов. 2, 4). Удали от себя двоедушие и нисколько не сомневайся просить у Бога, не говори в себе: «Как я могу просить от Господа и получить, когда столько согрешил против Него?» Не думай так, но от всего сердца своего исповедуйся и обращайся к Господу и проси у Него без сомнения, и ты познаешь Его благоутробие, потому что Он не оставит тебя, но:«исполнит желания сердца твоего»(Пс. 36, 4), ибо Бог непамятозлобив и милостив к Своим созданиям.'
      cn: 为什么称他为心怀二意的人呢？因为他既不坚定地追求今生，也不坚定地追求来生，因为在圣经中，「灵魂」也指「生命」，例如：「人所拥有的一切，都会为自己的生命而舍弃」（约伯记 2:4）。除去你心中的二意，并且毫无疑虑地向上帝祈求，不要对自己说：「我如何能向上主祈求并获得呢？我曾如此多地得罪了祢。」不要这样想，却要全心向上主认罪悔改，并毫无疑虑地向祂祈求，你就会认识祂的慈心，因为祂不会离弃你，却要「成就你心中的愿望」（诗篇 37:4），因为上帝不记仇，且怜悯祂的受造物。
  - type: paragraph
    text:
      ru: Иак.1:9.Да хвалится брат униженный высотою своею,
      cn: (雅各书 1:9) 卑微的兄弟升高，就該喜樂；
  - type: paragraph
    text:
      ru: Да хвалится же брат смиренный в высоте своей.
      cn: 愿谦卑的弟兄在他的崇高之中夸耀。
  - type: paragraph
    text:
      ru: 'Так как смирение признает апостол хранителем всего доброго и ничто не совершается без него у рачительных, то прибавляет: «Смиренный пусть хвалится высотою своею». Сомневающегося он уподобляет морской волне, а она от дуновения ветра поднимается и скорее, чем возвысится, опускается. Подобное испытывает и сомневающийся, когда по надмению не утверждает прошений своих ни на чем непременяемом. Поэтому апостол прибавляет: «Пусть хвалитсябрат смиренный». Он говорит как бы так: кто хочет просить чего-нибудь, тот пусть, во-первых, просит необходимого, относительно испрошения чего он не может обмануться, то есть:«Царства Божия и правды Его»(Мф. 6, 33). Потом пусть просит этого постоянно, – не так, что немного помолился, да тотчас и отступился, ибо это свойственно гордым, но пусть просит неотступно, терпеливо ожидая получения со смирением душевным.'
      cn: 既然使徒承认谦卑是保守一切美善的，且殷勤的人若没有谦卑就一无所成，所以他补充道：「谦卑的弟兄要因他的高升而夸口。」他将心存疑惑的人比作海中的波浪，这波浪被风吹动，时而兴起，尚未达到高处便已落下。心存疑惑的人也是如此，当他因傲慢而不将自己的祈求建立在任何永恒不变的事物上时，他也会经历同样的事。因此使徒又补充道：「谦卑的弟兄要因他的高升而夸口。」他仿佛是这样说的：凡愿祈求什么的人，首先当祈求那不可或缺的，关于这祈求，他绝不会受骗，就是说：「上帝的国和他的义」（马太福音 6:33）。其次，当持续不断地祈求，而不是稍微祷告片刻便立刻退缩，因为这是骄傲者的特点；而是要不懈地祈求，带着谦卑的心灵，耐心等候蒙允。
  - type: paragraph
    text:
      ru: Иак.1:10.а богатый – унижением своим, потому что он прейдет, как цвет на траве.
      cn: (雅各书 1:10) 富足的降卑，也該如此；因為他必要過去，如同草上的花一樣。
  - type: paragraph
    text:
      ru: 'Богатый же во смирении своем, зане я́коже цвет травный мимоидет:'
      cn: 至于富人，在他自己的谦卑里，因为他必如同草上的花一样消逝：
  - type: paragraph
    text:
      ru: Иак.1:11.Восходит солнце, настает зной, и зноем иссушает траву, цвет ее опадает
      cn: (雅各书 1:11) 太陽出來，熱風颳起，草就枯乾，花也凋謝，美容就消沒了；那富足的人，在他所行的事上也要這樣衰殘。

        日头一出，酷热即至，以酷热使草枯干，其花便凋谢了。'
  - type: paragraph
    text:
      ru: возсия бо солнце со зноем и изсуши траву, и цвет ея отпаде, и
      cn: 因为日头带着炎热升起，并使草枯干，且其花朵凋谢，并且
  - type: paragraph
    text:
      ru: Богатство уподобляет апостол цвету травы, желая представить, сколь оно скоропреходяще.
      cn: 使徒将财富比作草色，意欲呈现其何等转瞬即逝。
  - type: paragraph
    text:
      ru: исчезает красота вида ее;
      cn: 她的容貌之美消逝了；
  - type: paragraph
    text:
      ru: благолепие лица ея погибе;
      cn: 她容颜的荣光消逝了；
  - type: paragraph
    text:
      ru: Слово «лицо» он употребил не в настоящем значении его, ибо оно употребляется только о человеке, а о других предметах не употребляется.
      cn: 他使用「位格」一词，并非出于其本来意义，因为它只用于人，而不用于其他事物。
  - type: paragraph
    text:
      ru: так увядает и богатый в путях своих.
      cn: 照样，富者也在他的道路上枯萎。
  - type: paragraph
    text:
      ru: сице и богатый в хождении своем увядает.
      cn: 照样，富人亦会在他的生命旅程中凋零。
  - type: paragraph
    text:
      ru: Хождениями называет предприятия в настоящей жизни.
      cn: 将今生的事业称为「行走」。
  - type: paragraph
    text:
      ru: Иак.1:12.Блажен человек, который переносит искушение, потому что, быв испытан, он получит венец жизни, который обещал Господь любящим Его.
      cn: (雅各书 1:12) 忍受試探的人是有福的，因為他經過試驗以後，必得生命的冠冕，這是　主應許給那些愛他之人的。
  - type: paragraph
    text:
      ru: Блажен муж, иже претерпит искушение; зане́ искусен быв, приимет венец жизни,егожеобеща Бог любящим Его.
      cn: 福哉那忍受试探的人；因为他既受了试验，必得生命的冠冕，这是上帝应许给爱祂之人的。
  - type: paragraph
    text:
      ru: 'Мы сказали, что искушения двоякого рода и что терпение полезно в каждом их роде. Апостол, помня о молитве Господней, внушающей нам безопаснейшее, то есть чтобы мы молились, дабы не впасть нам в искушение, возвращается к объяснению того, какое искушение от Бога и какое от нас, от нашего произволения. Впрочем, хорошо и следующее: Господь и Бог, взирая на большую немощь человеческой природы, предложил молиться об удалении от нас искушений, так как ученики Его были еще далеко не совершенны; но когда познанием Его воскресения и вознесением на небо немощная природа наша укрепилась, то брат Его по плоти научает уже не бояться искушений.'
      cn: '我们说过，试探有两种，并且忍耐对于每种试探都是有益的。使徒记着主的祷告，这祷告启示我们最安全的教导，即我们应当祷告，免得我们陷入试探，他回到解释哪种试探来自上帝，哪种来自我们，来自我们的自由意志。


        然而，以下所述也很好：主与上帝，鉴于人类本性的极大软弱，建议我们祷告，求使试探远离我们，因为祂的门徒那时还远未达到完全；但是，当藉着对祂复活的认识和祂的升天，我们这软弱的本性得以坚固之后，祂肉身之兄弟就教导我们不再惧怕试探了。'
  - type: paragraph
    text:
      ru: 'Иак.1:13.В искушении никто не говори: Бог меня искушает'
      cn: (雅各书 1:13) 人被試探，不可說：「我是被　上帝試探。」因為　上帝不能被惡試探，他也不試探人。
  - type: paragraph
    text:
      ru: 'Никтоже искушаемь да глаголет, яко от Бога искушаем еcмь:'
      cn: 无人受试探时，不可说：我是被上帝试探的。
  - type: paragraph
    text:
      ru: 'Если искушения двоякого рода, то почему апостол поставляет теперь всякое искушение вне воли Божией? Но примечай: он не сказал: «искушенный», но – «искушаемый». Кто через грех и невоздержную жизнь сам изобретает себе искушения и как бы в постоянной буре погружается в опасности, тот говорит апостол, искушается не"от Бога", но от собственной похоти. Ибо кто победил нашедшее искушение и сделался тверже, тот уже нелегко поддается искушениям, особенно находящим от него самого, потому что на свободе от искушений постоянно склоняется к жизни более любомудрой.'
      cn: 如果诱惑有两种，那为何使徒将一切诱惑置于上帝的旨意之外呢？但请留意：他没有说「受诱惑的」，而是说「正在受诱惑的」。谁通过罪和不节制的生活，自己给自己制造诱惑，仿佛在持续的暴风雨中沉溺于危险，使徒说，这样的人受诱惑不是「来自上帝」，而是来自他自己的私欲。因为谁战胜了临到的诱惑，变得更加坚韧，这样的人就不再轻易屈服于诱惑，尤其是那些来自他自身的诱惑，因为在脱离诱惑的状态中，他持续倾向于一种更加爱智的生活。
  - type: paragraph
    text:
      ru: потому что Бог не искушается злом и Сам не искушает никого,
      cn: 因为上帝不被恶试探，祂自己也不试探任何人，
  - type: paragraph
    text:
      ru: Бог бо несть искуситель злым, не искушает же Той ни когоже,
      cn: 因为上帝不是恶事的试探者，祂也不试探任何人，
  - type: paragraph
    text:
      ru: 'Бог не искушается злом, как сказано: «Что Божественно и блаженно, то ни само ничего не делает, ни другим не дает дела»[1]. Все это свойственно естеству смертному и земному, в котором усматриваются изменение и переменчивость, эти первичные свойства нашей природы. Похоть же и грех и рождающаяся от нее смерть для души стали как бы ступенями погибели человеческой. Ибо похоть, найдя место пристанища, соделала грех, который родил смерть, и только искоренив оный через покаяние мы полагаем начало другой нашей жизни.'
      cn: 上帝不受恶所试探，正如所言：「凡属神圣并蒙福者，其自身一无所为，也不使他者有所作为」[1]。这一切都属于凡属必死与尘世之本性，在其中可见到变化与变迁，这些乃是我等本性的初始属性。而情欲、罪以及从它所生的死亡，对灵魂而言，仿佛成了人类沉沦的阶梯。因为情欲寻得安歇之所后，便造成了罪，这罪又生出死亡；而唯有借着悔改将这罪根除，我们方可开启我们另一种生活。
  - type: paragraph
    text:
      ru: Иак.1:14.но каждый искушается, увлекаясь и обольщаясь собственною похотью;
      cn: (雅各书 1:14) 但各人被試探，乃是被自己的私慾牽引誘惑的。
  - type: paragraph
    text:
      ru: Кийждо же искушается, от своея похоти влекомь и прельщаемь;
      cn: 各人受试探，乃被己之私欲牵引勾引。
  - type: paragraph
    text:
      ru: Иак.1:15.похоть же, зачав, рождает грех, а сделанный грех рождает смерть.
      cn: (雅各书 1:15) 私慾既懷了胎，就生出罪來；罪既長成，就生出死來。
  - type: paragraph
    text:
      ru: таже похоть заченши раждает грех, грех же содеян раждает смерть.
      cn: 私欲既怀了胎，就生出罪来；罪既长成，就生出死亡。(雅各书 1:15)
  - type: paragraph
    text:
      ru: Пoелику о Божеской природе доказано, что Бог ни Сам не искушается, ни других не искушает, то здесь искушениями называет помыслы, смущающие душу, ибо искушения от Бога не смущают, но утверждают душу, озаряя ее, почему говорит:«всяко даяние благо и всяк дар совершен свыше есть, сходяй от Отца светов»(Иак.1:17), тогда как все, происходящее от нас, имеет несовершенство.
      cn: 既然关于上帝的神性已被证明，上帝祂自己不受试探，也不试探别人，那么这里所说的「试探」指的是那些搅扰灵魂的意念，因为来自上帝的考验不搅扰，反而坚固灵魂，光照她，所以经上说：「一切美善的恩赐和一切全备的赏赐，都是从上头来的，从众光之父那里降下的。」(雅各书 1:17) 然而一切由我们自身而来的，都带有不完全。
  - type: paragraph
    text:
      ru: Иак.1:16.Не обманывайтесь, братия мои возлюбленные.
      cn: (雅各书 1:16) 我親愛的弟兄們，不要看錯了。
  - type: paragraph
    text:
      ru: Не льститеся, братие моя возлюбленная;
      cn: 我所亲爱的弟兄们，不要受迷惑；
  - type: paragraph
    text:
      ru: Иак.1:17.Всякое даяние доброе и всякий дар совершенный нисходит свыше, от Отца светов,
      cn: (雅各书 1:17) 各樣美善的恩賜和各樣全備的賞賜都是從上頭來的，從眾光之　父那裏降下來的；在他並沒有改變，也沒有轉動的影兒。
  - type: paragraph
    text:
      ru: всяко даяние благо и всяк дар совершен свыше есть, сходяй от Отца светов,
      cn: 各样美善的恩赐，和各样全备的赏赐，都是从上头来的，从众光之父那里降下的。
  - type: paragraph
    text:
      ru: Под Отцом светов разумей Бога, а под светами или силы ангельские, или просвещенных Духом Святым людей.
      cn: 对于众光之父，当理解为上帝；而对于诸光，则可理解为天使的权能，或是蒙圣灵光照的人们。
  - type: paragraph
    text:
      ru: у Которого нет изменения и ни тени перемены.
      cn: 在祂没有改变，也没有转动的影儿。
  - type: paragraph
    text:
      ru: у Негоже несть пременение, или преложения стень.
      cn: 在祂没有改变，也没有转动的影儿。
  - type: paragraph
    text:
      ru: У Бога светов нет изменения, ибо Он Сам взывает через пророка:«Аз Господь Бог ваш, и не изменяюся»(«Ибо Я – Господь, Я не изменяюсь») (Мал. 3, 6), а выражение«преложения стень»означает, что в Боге нельзя даже помыслить какой-либо перемены.
      cn: 在万光之父上帝那里，没有丝毫改变，因为祂亲自通过先知呼吁道：「因为我是上主，我永不改变」（玛拉基书 3:6），而「变动之影」一词，意指在上帝那里，甚至不可设想有任何改变。
  - type: paragraph
    text:
      ru: Иак.1:18.Восхотев, родил Он нас словом истины, чтобы нам быть некоторым начатком Его созданий.
      cn: (雅各书 1:18) 他按自己的旨意，用真理的道生了我們，叫我們在他的造物中好作初熟的果子。
  - type: paragraph
    text:
      ru: Восхотев бо породи нас словом истины, во еже быти нам начаток некий созданием Его.
      cn: 祂既愿意，就用真理的道生了我们，为要使我们成为祂所造之物中某种初熟的果子。
  - type: paragraph
    text:
      ru: 'Сказал «восхотев», потому что есть люди, которые по наваждению беса умствуют, что мир составился как бы случайно. Выше сказал: у Негоже несть пременения и тем показал, что Божество неизменяемо; теперь присовокупляет:«восхотев бо породи нас». Если мы произошли, то явно, что мы не неизменяемы, ибо возможно ли, чтобы неизменяемым было то, что из небытия пришло в бытие через изменение?'
      cn: 祂说「祂旨意所愿」，因为有些人受邪魔的诱惑而心想，世界乃是偶然形成的。前文说过：在祂并没有改变，借此表明神性是不变的；现在又补充说：「祂旨意所愿，生了我们。」如果我们是受生的，那么显然，我们并非不变的，因为怎可能那不变的会是从虚无经由改变而进入存在的事物呢？
  - type: paragraph
    text:
      ru: А чтобы по поводу слова «породил» не подумал кто, что Бог и Сына родил так же, как нас, апостол присовокупил:«словом истины», ибо, по словам Иоанна Богослова:«все чрез Него начало быть»(Ин. 1, 3), то есть через Слово истины; посему, если мы произошли через Слово, то не однородны с Тем, от Кого произошли по бытию. Слова«начаток некий»означают преимущество и высшее достоинство, а«созданием»называет видимую природу.
      cn: 为免有人因「生」一词而误以为上帝生子与生我们相同，使徒又补充说：「以真理的道」。因按神学家约翰所言：「万物是借着祂造的」(约翰福音 1:3)，亦即，借着真理的道；因此，若我们是借着道而产生，则我们与那使我们产生者，在存有上并非同类。「某种初熟的果子」一词意指优越性与至高无上的尊严，而「受造物」则称呼可见的本性。
  - type: paragraph
    text:
      ru: Иак.1:19.Итак, братия мои возлюбленные, всякий человек да будет скор на слышание, медлен на слова, медлен на гнев,
      cn: (雅各书 1:19) 因此，我親愛的弟兄們，你們各人要快快的聽，慢慢的說，慢慢的動怒。
  - type: paragraph
    text:
      ru: Темже, братие моя возлюбленная, да будет всяк человек скор услышати [и] косен глаголати, косен во гнев
      cn: 因此，我亲爱的弟兄们，愿每个人都敏于听，[且] 迟于言，迟于怒。
  - type: paragraph
    text:
      ru: 'Скорым нужно быть на слышание не простое, но деятельное, возбуждающее прилагать выслушанное к делу, ибо известно, что кто слушает прилежно и внимательно, тот готов будет и исполнять слышанное, а кто, напротив, медленно располагается к чему-нибудь и откладывает то, тот впоследствии может и совсем отстать от предприятия. Посему относительно изучения Божественных предметов апостол заповедует скорость, а относительно того, совершение чего соединено с опасностью, медленность. Таковы слова, гнев. Ибо говорливость в гневе не оканчивается добром. Посему один богомудрый муж часто раскаивался в том, что он говорил, а в том, что молчал, никогда не раскаивался[2].  Так и блаженный Давид заповедует:«гневайтеся, и не согрешайте»(Пс. 4,5), то есть не гневайтесь скоро и не впадайте от гнева в бешенство. Подобна этой и настоящая заповедь о словах и о гневе, особенно о гневе, который, быв допущен до безрассудства, лишает правды Божией. Почему и говорит апостол:'
      cn: '要敏于聆听，不是普通的，而是积极的，要激发人将所听付诸实践，因为众所周知，凡是勤勉而专注聆听的，就必乐意遵行所听到的；反之，凡是迟迟不决，一再拖延的，日后甚至可能完全放弃这项事业。


        因此，至于研习神圣事物，使徒吩咐要迅速；而至于那些与危险相伴的事情，则要缓慢。比如言语和愤怒。因为在愤怒中的饶舌不会有好结果。因此，一位敬虔智慧的男子常常为自己所说的话感到懊悔，而为自己所保持的沉默，则从未懊悔[2]。


        同样，蒙福的大卫也如此吩咐：「你们发怒，却不要犯罪。」(诗篇 4:5) 也就是说，不要轻易发怒，也不要因愤怒而陷入狂暴。关于言语和愤怒的这条诫命，也与此类似，尤其是关于愤怒，如果任由其达到无理智的境地，就会剥夺人对上帝公义的认识。这也是使徒所说的：'
  - type: paragraph
    text:
      ru: Иак.1:20.ибо гнев человека не творит правды Божией.
      cn: (雅各书 1:20) 因為人的怒氣並不成就　上帝的義。
  - type: paragraph
    text:
      ru: Гнев бо мужа, правды Божия не соделовает.
      cn: 因为人的怒气，不成就上帝的公义。
  - type: paragraph
    text:
      ru: 'Правда есть свойство души, воздающее каждому должное, а:«гнев губит и разумных»(Притч. 15, 1). Как же он, в страстном размере помрачая ум, составит добродетель, которая рассудительно воздает каждому должное? Примечай и то, что апостол сказал не просто о том, кто«правды Божия не соделовает», но о том, кто мужается в пагубном для него самого[3]. А что у него такая мысль, видно из выражения:«блажен муж, который не ходит на совет нечестивых»(Пс. 1, 1), ибо прибавление приставочного члена показывает, что слово «муж» означает имеющего склонность к тому или другому, к добру или к злу. Нужно приметить и то, что апостол не просто сказал: «делает», но с предлогом, в значении «исполняет». Это значит, что гнев не совершенно чужд правды, ибо в гневе можно усматривать некоторую пользу, поскольку в нем, как и во всяком душевном движении, за неимением похвального можно находить не одно худое, но нечто и полезное.'
      cn: 公义是灵魂的一种属性，将当得的归还给每个人。然而，『忿怒也毁灭明智人』（箴言 15:1）。那么它（忿怒），在情欲的限度内使理智昏暗，又如何能构成一种审慎地将当得的归还给每个人的德行呢？还请注意，使徒所言并非仅仅关于那些『不行上帝之义』的人，而是关于那些在对他自身有害的事上变得勇敢的人[3]。他有此意图，可从『福哉那不随从恶人计谋的男子』（诗篇 1:1）这句话中看出，因为定冠词的添加表明，『男子』这个词指的是有倾向于某一方、倾向于善或倾向于恶的人。还需注意，使徒并非简单地说『做』（делает），而是用了带前置词的说法，意为『实行』（исполняет）。这意味着忿怒并非完全与公义格格不入，因为在忿怒中可以发现某种益处，正如在任何灵魂的运动中一样，即使没有值得称赞之处，我们也能找到并非只有坏处，亦有益处。
  - type: paragraph
    text:
      ru: Иак.1:21.Посему, отложив всякую нечистоту и остаток злобы, в кротости примите насаждаемое слово, могущее спасти ваши души.
      cn: (雅各书 1:21) 所以你們要脫去一切的污穢和盈餘的邪惡，存溫柔的心領受那所栽種的道，就是能救你們元魂的道。
  - type: paragraph
    text:
      ru: Сего ради отложше всяку скверну и избыток злобы, в кротости приимите всажденное слово, могущее спасти душы вашя.
      cn: 因此，脱去一切污秽和过度的恶毒，以温柔领受那能拯救你们灵魂的所栽种的圣言。
  - type: paragraph
    text:
      ru: Сказав «нечистоту», апостол прибавляет:«избыток злобы», желая внушить, чтобы если кто-нибудь и впадал часто в нечистоту, скорее отставал бы от нее, дабы, оставаясь в ней, не дать злу усилиться через привычку, ибо совершаемое нами часто и в обилии становится обыкновенно как бы природой, получая свойство природы.«В кротости», сказал апостол, имея в виду  учительное"слово", которое не принимается среди шума и возмущения; а всажденным называет он то слово, по которому мы явились на свет разумными и способными различать добро и зло.
      cn: 使徒在提到「不洁」时，又加上了「过度的恶毒」，意在劝导，即使有人常常陷入不洁，也要尽快摆脱，以免滞留其中，让恶因习惯而滋长；因为我们常常且大量所行的事，通常会变得如同本性，获得本性的特质。使徒说「在温柔中」，指的是教诲性的「言语」，它在喧嚣和骚乱中是无法被接受的；而他称之为「内植的道」的，是指借此我们来到世上，成为有理智并能分辨善恶的。
  - type: paragraph
    text:
      ru: Иак.1:22.Будьте же исполнители слова, а не слышатели только, обманывающие самих себя.
      cn: (雅各书 1:22) 只是你們要行道，不要單單聽道，自己欺哄自己。
  - type: paragraph
    text:
      ru: Бывайте же творцы слова, а не точию слышатели, прельщающе себе самех.
      cn: 所以你们要成为话语的实行者，而不单单是听者，欺骗自己。
  - type: paragraph
    text:
      ru: «Прельщающе себе самех»значит обманывающие самих себя, ни во что ставящие собственное свое спасение.
      cn: «Прельщающе себе самех»意指自欺，丝毫不重视自己救赎的人。
  - type: paragraph
    text:
      ru: 'Иак.1:23.Ибо, кто слушает слово и не исполняет, тот подобен человеку, рассматривающему природные черты лица своего в зеркале:'
      cn: (雅各书 1:23) 因為聽道而不行道的，就像人對著鏡子看自己本來的面目，
  - type: paragraph
    text:
      ru: Занеащекто есть слышатель слова, а не творец, таковый уподобися мужу смотряющу лице бытия своего в зерцале.
      cn: 因为若有人是话语的听者，而非行者，这样的人便如同一个男子，在镜子里看着他自己本相的脸。
  - type: paragraph
    text:
      ru: '«Лице бытия»означает познание самого себя через закон. Посему-то к слову«лице"и прибавил апостол слово"бытия", ибо через закон мы узнаем, какими явились мы на свет, и уразумеваем, в какое состояние перерождает нас духовный закон через баню возрождения. Потом, не пребывая в таком созерцании через деятельность, мы забываем о полученном даре духовном, ибо кто предается злым делам, тот не помнит, чем он облагодетельствован от Бога, ибо если бы помнил, что он рожден свыше, оправдан и причислен к сынам Божиим, то не предавался бы делам, отвергающим дарованную благодать. От обыкновенного зеркала апостол переводит речь к зеркалу мысленному, ничего не выведя из представленного в кратких словах примера. Ему надлежало бы сказать так: «Кто слушает закон и не исполняет, тот подобен человеку, рассматривающему лицо свое в зеркале. Как этот посмотрел на себя, отошел и тотчас забыл, каков он, так и тот, усмотрев из закона Моисеева, для чего он сотворен, а именно для славы Божией и для жизни по образу создавшего его Бога, ничего из виденного не исполнил, но поступил точно так же, как и смотревшийся в зеркало: ему следовало воспользоваться виденным, а он, как и тот, не воспользовался». И не без цели поступает так апостол (умалчивает нечто): он сосредоточивает слушателя и напрягает его слушать это не между делом, ибо блаженны не такие слушатели, но соединяющие с слушанием дело. И фарисеи были слушателями, но так как они не были исполнителями, то и не блаженны они.'
      cn: '「生命的面容」意味着借着律法认识自己。正因如此，使徒才在「面容」一词后又加上了「生命」一词，因为借着律法我们得知我们是以何种面貌来到世上，并领悟属灵的律法如何借着重生的洗礼将我们重塑成何种状态。之后，若不在行动中持守这种默观，我们便会遗忘所领受的属灵恩赐，因为凡沉溺于恶行的人，必不记得自己从上帝那里得了何等的恩惠。因为如果他记得自己是蒙重生、称义并被列入上帝之子的行列，他就不会沉溺于那些拒绝所赐恩典的行为。


        使徒从普通的镜子将话题转向了心灵的镜子，却没有从这简短的例子中引出任何结论。他本应这样说：「凡听见律法却不遵行的人，就像一个在镜子里察看自己面容的人。正如这个人照了照自己，就走开了，随即忘记自己是何等模样；照样，那人虽然从摩西律法中看出自己受造的目的是什么，也就是为了上帝的荣耀，并按照创造他的上帝的形象而生活，但对所见的一切却没有去实行，却做得与照镜子的人一模一样：他本应利用所看到的，但他，像那个人一样，却没有利用。」使徒这样做并非没有目的（他有所省略）：他使听者集中注意力，并促使他们不是敷衍了事地听，因为蒙福的并非这样的听者，而是将聆听与行动结合起来的人。法利赛人也是听者，但因为他们并非遵行者，所以他们也不蒙福。'
  - type: paragraph
    text:
      ru: Иак.1:24.он посмотрел на себя, отошел и тотчас забыл, каков он.
      cn: (雅各书 1:24) 看見，走後，隨即忘了他的相貌如何。
  - type: paragraph
    text:
      ru: Усмотри бо себе и отиде, и абие забы, каков бе.
      cn: 因为他察看了自己，就离开了，便立刻忘记了他本来的样式。
  - type: paragraph
    text:
      ru: К слышанию прибавил апостол исполнение, потому что для душевного спасения недостаточно одного слышания закона, но слышание должно быть еще подтверждено исполнением.
      cn: 使徒在听闻之外又加上了实行，因为为了灵魂的救赎，仅仅听闻律法是不够的，但听闻必须还要借着实行来加以确证。
  - type: paragraph
    text:
      ru: Иак.1:25.Но кто вникнет в закон совершенный, закон свободы, и пребудет в нем, тот, будучи не слушателем забывчивым, но исполнителем дела, блажен будет в своем действии.
      cn: (雅各书 1:25) 唯有詳細察看那全備、使人自由之律法的，並且時常如此，這人既不是聽了就忘，乃是實在行出來，就在他所行的事上必然得福。
  - type: paragraph
    text:
      ru: Приникий же в закон совершен свободы, и пребыв, сей не слышатель забытлив быв, но творец дела, сей блажен в делании своем будет.
      cn: 但那详细考察那全备的自由之律法，并持守的，这人不是听而忘记的，乃是实行其道的，这人必在他所行的事上蒙福。
  - type: paragraph
    text:
      ru: Апостол сказал «кто приникнет», а не «войдет», ибо духовный закон, везде имея преимущество и величие, умеет привлекать и самым кратким чтением его.
      cn: 使徒说：「谁若倾心于」，而非「进入」，因为属灵的律法，处处彰显其优越与崇高，甚至借着最短暂的阅读，也能够吸引人。
  - type: paragraph
    text:
      ru: К словам«закон совершен»прибавил«свободы»чтобы указать на отличительную его черту – свободу, ибо закон Христов, освободив от рабства плотского, поставляет приходящего к Нему в свободе, делает его через эту свободу более внимательным и освобождает его от забвения, вредного для всего доброго.
      cn: 在「全备的律法」这几个字之后，又加上了「自由」一词，以指出其独特之处——即自由。因为基督的律法，将人从肉体的奴役中释放出来，使来到祂面前的人置于自由之中，并借着这份自由使人更为警醒，并且使其脱离有害于一切美善的遗忘。
  - type: paragraph
    text:
      ru: Иак.1:26.Если кто из вас думает, что он благочестив, и не обуздывает своего языка, но обольщает свое сердце, у того пустое благочестие.
      cn: (雅各书 1:26) 你們中間若有人自以為虔誠，卻不勒住他的舌頭，反欺哄自己的心，這人的虔誠是虛的。
  - type: paragraph
    text:
      ru: Аще кто мнится верен быти в вас, и не обуздовает языка своего, но льстит сердце свое, сего суетна [есть] вера.
      cn: 如果你们中间有人自以为是忠信的，却不勒住自己的舌头，反而欺哄自己的心，这人的信心是虚妄的。
  - type: paragraph
    text:
      ru: По понятию иудеев, благочестив тот, кто оказывает верность в делах, потому что таковой кажется не принадлежащим к толпе. Иудеи, исполняя предписанные законом наблюдения, высоко думали о себе, сосредоточивали в этих наблюдениях все благочестие по отношению к Богу и, занимаясь только этим, мечтали стяжать через то блаженство, а к другим относились с большим осуждением, как видно из евангельской притчи о самохвале фарисее и мытаре (Лк. 18, 10–14).
      cn: 按照犹太人的观念，虔诚的人是那些在行为中表现出忠诚的人，因为这样的人似乎不属于大众。犹太人，在遵守律法所规定的规条时，自视甚高，将所有对上帝的虔诚都集中在这些规条中，并且，只专注于此，梦想着通过这些获得福乐，而对其他人则大加谴责，正如福音中关于自夸的法利赛人和税吏的寓言所显示的（路加福音 18:10-14）。
  - type: paragraph
    text:
      ru: 'Удерживая от такого мнения, апостол и дает настоящее наставление. Упомянув об исполнителе дела и назвав его блаженным, он тотчас исправляет зло, рождающееся у многих при исполнении. Он как бы говорит: «Хвалящийся исполнением закона, не думай получить блаженство за одно исполнение!» – ибо это неприятно Богу, но приятен Ему тот, кто исполняет и с тем вместе далек от самомнения и не относится к неисполняюшим с осуждением.'
      cn: 使徒为了抑制这种观点，于是给予了现今的教诲。在提及行为的实行者并称他为有福的之后，他立刻纠正了许多人在实行时所产生的弊病。他仿佛在说：「夸耀自己遵行律法的人，不要以为单凭实行就能获得福份！」因为这并不为上帝所悦纳；他所悦纳的，是那些实行，同时又远离自负，并且不对不实行的人加以论断的人。
  - type: paragraph
    text:
      ru: Льстит сердце свое– как бы душит и по самомнению, как исполнитель закона, обольщает свою совесть, ибо сердце означает здесь то же, что и в словах:«сердце сокруше́нно и смире́нно»(Пс. 50, 19).
      cn: 自欺其心——这如同扼杀着良知，并出于自负，作为律法的遵行者，迷惑了自己的良心。因为在此处，「心」所指的与「破碎而谦卑的心」（诗篇 50:19）中的「心」是同一意义。
  - type: paragraph
    text:
      ru: Иак.1:27.Чистое и непорочное благочестие пред Богом и Отцем есть то, чтобы призирать сирот и вдов в их скорбях
      cn: (雅各书 1:27) 在　上帝我們的　父面前，那純潔沒有玷污的虔誠，就是看顧在患難中無父的和寡婦，並且保守自己不為世俗玷污。
  - type: paragraph
    text:
      ru: Вера бо чиста и нескверна пред Богом и Отцем сия есть, еже посещати сирых и вдовиц в скорбех их, [и]
      cn: 虔敬，在上帝和父面前纯洁无玷的，这便是：看顾在她们患难中的孤儿和寡妇，[及]
  - type: paragraph
    text:
      ru: 'Благочестие, кажется, подразумевает нечто больше, нежели вера. Слово это обещает знание сокровенного, твердость в созерцаемом верою[4]. Посему и употребил апостол такое слово в речи о благочестивом. Он как бы говорит: «Ты почитаешь себя знатоком тайн закона и точным хранителем его. Как так? Так думаешь ты, не умеющий обуздать языка, осуждающий ближнего, живущий высокомерно и не оказывающий сострадания никому из бедных! Между тем закон не одобряет даже того, кто злословит, но повелевает оказывать сострадание и врагам. Итак, если хочешь быть благочестивым, обнаруживай благочестие не в чтении, но в исполнении закона, которое состоит особенно в оказывании сострадания ближнему. Ибо сострадание ближнему есть своего рода уподобление Богу. Будьте, сказано:«милосерды, как и Отец ваш милосерд»(Лк. 6, 36). Только милосердие ваше должно быть чуждо лицеприятия, потому что и Бог оказывает свои благодеяния не каким-нибудь лицам отдельно, но:«повелевает солнцу Своему восходить над злыми и добрыми и посылает дождь на праведных и неправедных»(Мф. 5, 45).'
      cn: 虔诚，似乎意味着比信仰更多。这个词应许着对奥秘的知识，以及在信仰所默观之事中的坚固[4]。因此使徒在论及虔诚者时也使用了这样的词。他仿佛在说：「你自认为知晓律法的奥秘，是律法的精确遵守者。怎么会这样呢？你竟然这样想，你不能约束自己的舌头，谴责近人，生活狂妄自大，且不向任何贫困者施予怜悯！然而律法甚至不认可那些说人坏话的人，反而命令要向敌人施予怜悯。所以，如果你想成为虔诚者，就当显明你的虔诚，不在于诵读，而在于遵守律法，这尤其在于向近人施予怜悯。因为向近人施予怜悯，是一种效法上帝。经上说：「你们要怜恤人，像你们的父怜恤人一样」（路加福音 6:36）。只是你们的怜悯应当远离偏袒，因为上帝也施予祂的恩惠，不是偏袒某些人，而是「叫祂的日头照好人，也照歹人，降雨给义人，也给不义的人」（马太福音 5:45）。
  - type: paragraph
    text:
      ru: и хранить себя неоскверненным от мира.
      cn: 并保守自己不沾染世俗。
  - type: paragraph
    text:
      ru: нескверна себе блюсти от мира.
      cn: 谨守自身不被世界玷污。
  - type: paragraph
    text:
      ru: Под миром здесь должно разуметь народ простой и черный, растлевающий себя в обольстительных похотях своих.
      cn: 在这里，「世人」应当理解为粗俗愚昧、在自身诱惑人的情欲中败坏自己的人民。
- type: heading1
  text:
    ru: Глава вторая
    cn: 第二章
  children:
  - type: paragraph
    text:
      ru: Иак.2:1.Братия мои! имейте веру в Иисуса Христа нашего Господа славы, не взирая на лица.
      cn: (雅各书 2:1) 我的弟兄們，你們信奉我們　主耶穌　基督，榮耀的　主，便不可偏待人。
  - type: paragraph
    text:
      ru: Братие моя, не на лица зряще имейте веру Господа нашего Иисуса Христа славы.
      cn: 我的弟兄们，你们持有我们荣耀的主耶稣基督的信仰，不可凭外貌待人。
  - type: paragraph
    text:
      ru: Кто делает что-нибудь с лицеприятием, тот навлекает на себя большой позор как не уважающий однородного и прежде него самого себя, потому что обхождение с подобным препосылается и к самому делающему.
      cn: 谁若怀着偏私行事，他便给自己招致极大的羞辱，如同不尊重同类，并且首先是不尊重他自己，因为对同类的对待也会反作用于行事者本人。
  - type: paragraph
    text:
      ru: Иак.2:2.Ибо, если в собрание ваше войдет человек с золотым перстнем, в богатой одежде, войдет же и бедный в скудной одежде,
      cn: (雅各书 2:2) 若有一個人帶著金戒指，穿著華美衣服，進你們的會堂去；又有一個窮人穿著骯髒衣服也進去；
  - type: paragraph
    text:
      ru: Аще бо внидет в сонмище ваше муж, злат перстень нося, в ризе светле, внидет же и нищ в худе одежди,
      cn: 倘若一人戴着金戒指，穿着华丽的衣裳，走进你们的会堂，又有一个穷人穿着破旧的衣服也进来，
  - type: paragraph
    text:
      ru: 'Иак.2:3.и вы, смотря на одетого в богатую одежду, скажете ему: тебе хорошо сесть здесь, а бедному скажете: ты стань там, или садись здесь, у ног моих, –'
      cn: (雅各书 2:3) 你們就重看那穿華美衣服的人，說：「請坐在這好位上。」又對那窮人說：「你站在那裏。」或「坐在我腳凳下邊。」
  - type: paragraph
    text:
      ru: 'и воззрите на носящаго ризу светлу, и речете ему: ты сяди зде добре; и нищему речете: ты стани тамо, или сяди зде на подножии моем:'
      cn: 并且你们要注目那穿着光明衣裳的人，对他说：「你坐在这里的佳位。」又对那贫穷人说：「你站在那里，或者坐在我的脚凳旁边。」
  - type: paragraph
    text:
      ru: У евреев, кажется, особенно в обычае было носить перстни. Но при этом иной скажет, может быть, что если Иаков есть учитель завета Христова, то почему не прекращает подзаконного, но еще возвышает оное, принимая остающихся в благочестии подзаконном, а не порицая их? Такому мы отвечаем, что теперь Иаков беседует с ними поближе и снисходит их немощи, чтобы, тотчас отменив закон, не заставить их отступиться от него по новости учения. Но он ведет дело с основательным расчетом, уступив, насколько это было безвредно для него, в Новом Завете и подзаконным обрядам. Ибо чем отвращало его от веры Христовой соблюдение субботы или пост и воздержание от снедей? Через эту уступчивость завладев их вниманием к своим собственным словам, он мало-помалу убеждает их отставать от подзаконных обрядов как бесполезных и ведущих к рабству, а не к свободе, подаваемой о Христе.
      cn: 犹太人似乎特别有佩戴戒指的习俗。但与此同时，也许另有人会说：如果雅各是基督之约的教师，那他为何不废止律法下的规条，反而还提升了它，接纳那些仍留在律法下的虔诚之中的人，而不责备他们呢？对这样的人，我们回应说，雅各此刻是与他们更亲近地交谈，并迁就他们的软弱，以免立刻废止律法，会因教义的新颖而使他们离弃他。但他行事深思熟虑，在新约的范畴内，对律法下的礼仪作出了让步，只要这对新约无害。因为遵守安息日，或禁食并节制饮食，又怎会使其偏离基督的信仰呢？通过这种让步，他获得了他们对自己话语的关注，便渐渐说服他们放弃律法下的礼仪，因为它们是无益的，并且是导向奴役，而非在基督里所赐的自由。
  - type: paragraph
    text:
      ru: Итак, мудро пользуясь небольшими уступками, он предложил приличное христианам как раз тогда, когда они беспрепятственно внимали его словам.
      cn: 于是，他智慧地运用些微的让步，恰恰在基督徒们毫无障碍地聆听他的话语之时，向他们提出了合乎基督徒体统之事。
  - type: paragraph
    text:
      ru: Иак.2:4.то не пересуживаете ли вы в себе и не становитесь ли судьями с худыми мыслями?
      cn: (雅各书 2:4) 這豈不是你們偏心待人，用惡意斷定人嗎？
  - type: paragraph
    text:
      ru: И не разсмотристе в себе и бысте судии помышлений злых.
      cn: 你们没有省察自己，却成了恶念的审判者。
  - type: paragraph
    text:
      ru: 'Союз «и» поставлен здесь по обычаю древнего образа выражения, ибо здесь продолжение вышесказанного, почему союз «и» излишен. Ход речи такой: «Если кто войдет в собрание ваше» и прочее, потом – «не пересуживаете ли вы между собою» – это вторая часть предложения, почему и смысл речи должен быть таким: пoелику вы не рассудили, как должно, то стали судьями с худыми мыслями. Не пересуживаете ли, то есть вы испортили приговор свой, не сделав наперед никакого исследования о том, рачителен ли бедный или ленив богатый. Но ваше неразличение привело вас к лицеприятию, заставило вас одного похвалить, как богатого, а другого презреть, как бедного.'
      cn: 连词「和」在此被置入，是依照古老的表达方式，因为此处是上文的延续，因此连词「和」是多余的。句子的脉络是这样的：「如果有人进入你们的会堂」等等，然后——「你们岂不是在你们中间彼此论断」——这是句子的第二部分，因此句子的意思应当是这样的：因为你们没有按应有的方式判断，就成了怀有邪恶思想的审判者。你们岂不是论断，也就是说，你们败坏了你们的判断，没有事先进行任何调查，来判断穷人是殷勤的，还是富人是懒惰的。但是你们的不辨是非使你们陷入了偏袒，迫使你们赞扬一人，因为他富有，而轻视另一人，因为他贫穷。
  - type: paragraph
    text:
      ru: «И бысте судии помышлений злых», то есть стали судьями несправедливыми, поддавшимися лукавству из лицеприятия.
      cn: 「你们成了邪恶思想的审判者」，也就是说，成了不义的审判者，因着偏袒而屈服于诡诈。
  - type: paragraph
    text:
      ru: 'Иак.2:5.Послушайте, братия мои возлюбленные: не бедных ли мира избрал Бог быть богатыми верою и наследниками Царствия, которое Он обещал любящим Его?'
      cn: (雅各书 2:5) 我親愛的弟兄們，請聽，　上帝豈不是揀選了世上的貧窮人，叫他們在信上富足，並承受他所應許給那些愛他之人的國嗎？
  - type: paragraph
    text:
      ru: Слышите, братие моя возлюбленная, не Бог ли избра нищыя мира сего богаты в вере и наследники царствия, еже обеща любящым Его?
      cn: 听啊，我蒙爱的众弟兄，难道不是上帝拣选了这世上的贫穷人，使他们因着信仰而富足，并作了祂应许给爱祂之人的国度的继承人吗？
  - type: paragraph
    text:
      ru: Иак.2:6.А вы презрели бедного. Не богатые ли притесняют вас, и не они ли влекут вас в суды?
      cn: (雅各书 2:6) 你們反倒藐視貧窮人。那富足人豈不是欺壓你們，拉你們到公堂去嗎？
  - type: paragraph
    text:
      ru: вы же укористе нищаго. Не богатии ли насилуют вам, и тии влекут вы на судища?
      cn: 你们却羞辱了穷人。岂不是富人欺压你们，又把你们拉到公堂吗？
  - type: paragraph
    text:
      ru: Пoелику для многих тяжко даже слышать о бедности, то, сказав«нищыя мира сего», тотчас прибавил:"богаты". Чем же богаты? Верою. Ибо неотъемлемый мир бедных, когда они перейдут к вере, делает их сильнейшими богатых. Посему и Господь избрал таковых в ученики и явил наследниками Царства.
      cn: 因为对许多人来说，甚至听到贫穷都很难，所以，在说「这世上的贫穷人」之后，立刻补充说：「是富足的。」 他们因何富足？因着信德。因为贫穷人那不可剥夺的平安，当他们归入信德时，使他们比富足的人更加强大。因此，上主也拣选了这样的人作门徒，并显明他们为天国的继承人。
  - type: paragraph
    text:
      ru: Иак.2:7.Не они ли бесславят доброе имя, которым вы называетесь?
      cn: (雅各书 2:7) 他們不是褻瀆你們所稱呼的尊名嗎？
  - type: paragraph
    text:
      ru: Не тии ли хулят доброе имя нареченное на вас?
      cn: 难道不是他们亵渎那称在你们身上的尊名吗？
  - type: paragraph
    text:
      ru: 'Иак.2:8.Если вы исполняете закон царский, по Писанию: возлюби ближнего твоего, как себя самого, – хорошо делаете.'
      cn: (雅各书 2:8) 聖經上記著說：「要愛鄰如己。」你們若全守這至尊的律法，才是好的。
  - type: paragraph
    text:
      ru: 'Аще убо закон совершаете царский, по писанию: возлюбиши искренняго своего якоже себе самаго, добре творите:'
      cn: 如果你们遵行那君尊的律法，照着圣经所写：『爱你的邻舍如同你自己』，你们就做得很好。
  - type: paragraph
    text:
      ru: Иак.2:9.Но если поступаете с лицеприятием, то грех делаете, и перед законом оказываетесь преступниками.
      cn: (雅各书 2:9) 但你們若偏待人，便是犯罪，被律法定為犯法的。
  - type: paragraph
    text:
      ru: аще же на лица зрите, то грех содеваете, обличаеми от закона якоже преступницы.
      cn: 但若你们偏待人，便是犯了罪，被律法指证为犯法的人。
  - type: paragraph
    text:
      ru: Имя новое – по словам пророка:«работающым же мне наречется имя новое, еже благословится на земли, благословят бо Бога истиннаго»(«рабов Своих назовет иным именем, которым кто будет благословлять себя на земле, будет благословляться Богом истины») (Ис. 65,15–16).
      cn: '新名——按着先知的话说：

        «然而事奉我的，必蒙称新名，这名必在地上蒙福，因为他们必称颂真上帝»

        （«祂将以另一个名字称呼祂的仆人；凡在地上以这名求福的，必蒙真上帝赐福»）

        (以赛亚书 65:15-16)'
  - type: paragraph
    text:
      ru: Иак.2:10.Кто соблюдает весь закон и согрешит в одном чем-нибудь, тот становится виновным во всем.
      cn: (雅各书 2:10) 因為凡遵守全律法的，只在一條上犯罪，他就是犯了眾條。
  - type: paragraph
    text:
      ru: Иже бо весь закон соблюдет, согрешит же во единем, бысть всем повинен.
      cn: 因为凡遵守全律法的，若在一条上犯了罪，就成了犯全体律法的。
  - type: paragraph
    text:
      ru: 'Иак.2:11.Ибо Тот же, Кто сказал: не прелюбодействуй, сказал и: не убей; посему, если ты не прелюбодействуешь, но убьешь, то ты также преступник закона.'
      cn: (雅各书 2:11) 原來那說「不可姦淫」的，也說「不可殺人」；你就是不姦淫，卻殺人，仍是成了犯律法的。
  - type: paragraph
    text:
      ru: 'Рекий бо: не прелюбы сотвориши, рекл есть и: не убиеши.Ащеже не прелюбы сотвориши, убие́ши же, был еси преступник закона.'
      cn: 因为他说：不可奸淫，他也说：不可杀人。你若不奸淫，却杀人，你就成了违犯律法的人。
  - type: paragraph
    text:
      ru: Иак.2:12.Так говорите и так поступайте, как имеющие быть судимы по закону свободы.
      cn: (雅各书 2:12) 你們既然要按使人自由的律法受審判，就該照這律法說話行事。
  - type: paragraph
    text:
      ru: Тако глаголите и тако творите, яко законом свободным имущии суд прия́ти.
      cn: 你们当这样言说，也当这样行事，如同你们将要按那使人自由的律法受审判。
  - type: paragraph
    text:
      ru: Иак.2:13.Ибо суд без милости не оказавшему милости; милость превозносится над судом.
      cn: (雅各书 2:13) 因為那不憐憫人的，也要受無憐憫的審判；憐憫原是向審判誇勝。
  - type: paragraph
    text:
      ru: Суд бо без милости не сотворшему милости; и хвалится милость на суде.
      cn: 因为对未曾施予怜悯者，审判乃是无怜悯的；怜悯在审判中夸胜。
  - type: paragraph
    text:
      ru: Кто согрешает в одном чем-нибудь, тот становится виновным во всем, потому что не имеет совершенной любви, ибо любовь есть глава всего доброго, а когда нет головы, и все остальное тело ничего не значит. А что об этом он говорит, видно из предыдущего наставления. Заповеди «не прелюбодействуй», «не убий» указаны для примера. Примечай, что и они взяты из закона, относящегося к совершенству любви, ибо кто любит ближнего, тот не будет ни прелюбодействовать, ни убивать, потому что такие дела свойственны врагу. Если бы не так, то никто из людей не уцелел бы, потому что никто не соблюдает всех заповедей, но кто соблюл чистоту, тот побеждается иногда гневом, кто творит милостыню, тот нередко имеет зависть. Посему говорится не о том, чтобы вовсе не было недостатка в добродетелях, но о любви, что ее не должно совершать с недостатком, с лицеприятием, но всецело. То же можем сказать и о прочих добродетелях. Кто несовершенно придерживается целомудрия или справедливости, но нечто опускает, тот, хромая в исполнении, вредит всему делу добродетели.
      cn: 凡在某一点上犯罪的，就成了在一切事上有罪的，因为他没有完满的爱；因为爱是所有美善之事的首要，而当没有头时，身体其余的一切就毫无意义了。至于他为何如此说，从先前的教训中可以明白。诫命「不可奸淫」、「不可杀人」是作为例子提出的。请留意，它们也是从关乎爱之完满的律法中取出的，因为凡爱邻人者，就既不会奸淫，也不会杀人，因为此类行为是仇敌的本性。若非如此，则没有人能够幸存，因为无人能遵守所有的诫命；然而，守住贞洁的人，有时却被怒气所胜；行施舍的人，却常常心存嫉妒。因此，这里所说的并非完全没有德行上的缺失，而是关于爱，即不应以欠缺、以偏私来实践爱，而应是全心全意地。对于其余的德行，我们也可以这样说。凡不完满地持守贞洁或公义之人，却有所遗漏，他，在实践中跛足，就损害了整个德行之事。
  - type: paragraph
    text:
      ru: Итак, под словами«весь закон»должно разуметь закон о любви, о которой речь у апостола по преимуществу, а«законом свободным»он называет нелицеприятие, ибо действующий по лицеприятию не свободный, но раб, потому что:«кто кем побежден, тот тому и раб»(2Пет. 2, 19).
      cn: 故此，所谓「全律法」，应当理解为使徒所着重论述的爱的律法；而他将不偏待人称为「自由的律法」，因为按偏私行事的人没有自由，乃是奴仆，因为：「人被谁制伏，就是谁的奴仆」(彼得后书 2:19)。
  - type: paragraph
    text:
      ru: Иак.2:14.Чтo пользы, братия мои, если кто говорит, что он имеет веру, а дел не имеет? может ли эта вера спасти его?
      cn: (雅各书 2:14) 我的弟兄們，若有人說自己有信心，卻沒有行為，有甚麼益處呢？這信心能救他嗎？
  - type: paragraph
    text:
      ru: Ка́я польза, братие моя,ащеверу глаголет кто имети, дел же не имать? еда может вера спасти его?
      cn: 我的弟兄们，倘若有人说自己有信德，却没有行为，这信德能救他吗？
  - type: paragraph
    text:
      ru: Если мы простили ближним согрешения их против нас и из имения своего уделяем часть нищим, то и нас восприимет милость Божия, когда будет судить наши поступки. Совершение сего важно. Напротив, тяжкое осуждение тем, которые не оказали благорасположения к подобным себе. Тех, которые не сжалились над ближними, согрешившими против них, постигнет осуждение злого раба (Мф. 18, 32–35). С воздаянием по молитве, в которой мы просим Бога простить нам:«как и мы прощаем»согрешившим против нас (Мф. 6, 12), а тех, которые немилостивы или жестоки к нуждающимся в телесной помощи, встретит суд без милости. Хвалится милость на суде, ибо милостивые, по изречению Господа:«помилованы будут»(Мф. 5, 7).
      cn: 如果我们饶恕了那冒犯我们之邻人的过犯，并从我们的财物中分一部分给穷人，那么上帝的怜悯也必临到我们，当祂审判我们的行为时。做到这一点至关重要。相反地，严厉的审判将临到那些不善待与自己同类的人。那些不怜悯冒犯他们的邻人的人，必遭遇那恶仆的审判 (马太福音 18:32-35)。根据我们祷告中的回报，我们恳求上帝饶恕我们：「如同我们饶恕了那冒犯我们的人」 (马太福音 6:12)；而那些对肉身有需要者不施怜悯或残忍的人，必遭受无怜悯的审判。怜悯在审判中得以夸胜，因为怜悯人的人，按照上主的教诲，「必蒙怜悯」 (马太福音 5:7)。
  - type: paragraph
    text:
      ru: Или иначе:«милосердием к бедным»могло доставить прощение даже идолослужителям, как мы слышим от пророка (Дан. 4, 24). Чего же не доставит оно людям верующим? Мне кажется, действие милосердия сходно с тем, что производит елей древесный на борющихся на поприще. Борцы, намащаемые елеем, легко ускользают от захватывания своими противниками. Так и наше милосердие к бедным даст нам на суде возможность избежать нападений со стороны бесов.
      cn: 或者换句话说：「施怜悯于贫者」能带来宽恕，甚至对于拜偶像者，正如我们从先知那里听到的（但以理书 4:24）。它又怎能不带来给信德之人呢？我认为，怜悯的行为类似于膏油对角斗场上搏斗者所产生的作用。角斗者被膏油涂抹后，就能轻易地滑脱，免受对手的擒拿。同样，我们施怜悯于贫者，将在审判时给我们避免来自魔鬼攻击的机会。
  - type: paragraph
    text:
      ru: Иак.2:15.Если брат или сестра наги и не имеют дневного пропитания,
      cn: (雅各书 2:15) 若是兄弟或是姊妹，赤身露體，又缺了日用的飲食；
  - type: paragraph
    text:
      ru: Аще же брат или сестра нага будета и лишена будета дневныя пищи,
      cn: 若弟兄或姊妹赤身露体，并且缺少日常的食粮，
  - type: paragraph
    text:
      ru: 'Иак.2:16.а кто-нибудь из вас скажет им: «идите с миром, грейтесь и питайтесь», но не даст им потребного для тела: что пользы?'
      cn: (雅各书 2:16) 你們中間有人對他們說：「平平安安的去吧。願你們穿得暖，吃得飽。」只是你們不給他們身體所需用的，這有甚麼益處呢？
  - type: paragraph
    text:
      ru: 'речет же има кто от вас: идита с миром, грейтася и насыщайтася: не даст же и́ма требования телеснаго: кая польза?'
      cn: 然而你们中间若有人对他们说：「平平安安地去吧，愿你们得温暖，得饱足！」却不给他们身体所需用的，这有什么益处呢？
  - type: paragraph
    text:
      ru: 'Примечай духовный смысл. Не сказал только: «если имеешь веру», но –«что пользы?»Говорит как бы так: покажи мне дело, по которому я придал бы тебе название верующего, ибо в этом дело веры. Слова же его значат: если кто делом не докажет, что он верен Богу, то такого не нужно и называть верным, ибо не тот верен, кто просто называет себя Господним, но тот, кто любит Господа так, что за веру в Него готов и на смерть. А что такая у него мысль, это видно из примеров, ибо он говорит, что Авраам делом показал, что верен Богу, когда первородного своего принес во всесожжение; подобно и Раав, веруя, презрела смерть.'
      cn: 注意属灵的意义。 他不仅说：「如果你有信心」，而是说：「有什么益处呢？」他似乎是这样说的：请你用行为向我显明，好让我能称你为信者，因为信心的事工就在于此。他的话语意指：如果有人不能用行为来证明他忠于上帝，那么就不应称他为忠信之人，因为忠信之人并非仅仅是自称属乎上主的人，而是那些爱上主，甚至为祂的信仰甘愿赴死的人。至于他有此等想法，可以从以下事例中看出，因为他说，亚伯拉罕藉着行为显明了他对上帝的忠信，当时他将自己的长子献上为燔祭；同样地，喇合也因着信而轻蔑死亡。
  - type: paragraph
    text:
      ru: Иак.2:17.Так и вера, если не имеет дел, мертва сама по себе.
      cn: (雅各书 2:17) 這樣，信心若沒有行為就只是死的。
  - type: paragraph
    text:
      ru: Такожде и вера,ащедел не и́мать, мертва есть о себе.
      cn: 同样，信心若没有行为，自身就是死的。
  - type: paragraph
    text:
      ru: 'Иак.2:18.Но скажет кто-нибудь: «ты имеешь веру, а я имею дела»: покажи мне веру твою без дел твоих, а я покажу тебе веру мою из дел моих.'
      cn: (雅各书 2:18) 必有人說：「你有信心，我有行為；你將你沒有行為的信心指給我看，我便藉著我的行為，將我的信心指給你看。」
  - type: paragraph
    text:
      ru: 'Но речет кто: ты веру имаши, аз же дела и́мам; покажи ми веру твою от дел твоих, и аз тебе покажу от дел моих веру мою.'
      cn: 但有人会说：『你有信心，我有行为；请你借你的行为将你的信心指示我，我便借我的行为将我的信心指示你。』
  - type: paragraph
    text:
      ru: 'Иак.2:19.Ты веруешь, что Бог един: хорошо делаешь; и бесы веруют, и трепещут.'
      cn: (雅各书 2:19) 你信是有一位　上帝；你信的不錯。鬼魔也信，卻是戰驚。
  - type: paragraph
    text:
      ru: 'Ты веруеши, яко Бог един есть: добре твориши: и беси веруют и трепещут.'
      cn: 你信上帝是独一的；你做得好。连恶魔也信，并且战栗。
  - type: paragraph
    text:
      ru: Это не противоречит словам блаженного Павла, ибо слово «вера» употребляется в двояком значении, иногда означая простое согласие ума с явлением, так как мы обыкновенно и это называем верой (почему и бесы веруют о Христе, что Он Сын Божий), и, опять же, именем веры мы называем сердечное последование, соединенное с твердым согласием.
      cn: 这并不与蒙福的保罗的话语相悖，因为「信德」一词被用于双重含义：有时意指理智对显现的简单认同，因为我们惯常也将此称为信德（因此甚至魔鬼也相信基督是上帝之子），而另一方面，我们又将「信德」之名赋予那与坚定的认同相结合的心灵的追随。
  - type: paragraph
    text:
      ru: Божественный Иаков называет мертвой верой простое согласие как не имеющее одушевляющих оное дел. А Павел говорит о вере сердечной, которая отнюдь не лишена дел, ибо в не имеющем честных дел ее и не было бы. И Авраам получил ее не прежде, чем решился отвергнуть отцовскую немощь, за каковой подвиг и дана вера в награду. Но Павел почитает ее выше дел закона, выше покоя субботнего, обрезания и прочих очищений. Ибо и в слове «дела» усматриваются два значения. Делами называются дела, подтверждающие веру, не имея которых она остается мертвой. Делами называются также и дела закона, без которых оправдывается Авраам и все христиане, ибо кто станет противоречить тому, что к нечистому не приступит вера (разумею веру дел)? Как миро не может сохраниться в сосуде, полном грязи, так и в человеке нечистом не будет находиться вера Божия. Итак, Божественные апостолы не разноречат друг другу, но, принимая слова в различных значениях, каждый употребляет оные в своем значении, где нужно.
      cn: 圣哉雅各称仅仅的认同为死去的信德，因其没有使之活泼的善功。而保罗论及发自内心的信德，这信德绝非缺乏善功，因为在没有正直善功的人心中，这信德便也不会存在。亚伯拉罕获得信德，并非在他决定摒弃父辈的软弱之前；因着这份功绩，信德便作为奖赏赐予了他。但保罗视其高于律法的善功，高于安息日的歇息、割礼以及其他的洁净礼。因为在「善功」这个词中，也可见到两种含义。一种是指证实信德的善功，没有它们，信德便仍是死的。另一种则指律法的善功，没有它们，亚伯拉罕和所有基督徒仍被称义，因为谁会反驳这一点呢：信德（我所指的是行为之信德）是不会临近不洁之人的？正如膏油无法保存于一个充满污秽的器皿中，同样，在不洁之人心中，上帝的信德便不会存在。所以，圣哉众使徒彼此之间并无分歧，而是对词语采取了不同的含义，每个人都在需要之处，按其含义使用这些词语。
  - type: paragraph
    text:
      ru: Иак.2:20.Но хочешь ли знать, неосновательный человек, что вера без дел мертва?
      cn: (雅各书 2:20) 虛浮的人哪，你願意知道沒有行為的信心是死的嗎？
  - type: paragraph
    text:
      ru: Хощеши же ли разумети, о, человече суетне, яко вера без дел мертва есть?
      cn: 哦，虚妄的人啊，你岂不愿明白，那没有善行的信德是死的呢？
  - type: paragraph
    text:
      ru: Пустым называет человека, который хвалится одной только верой, потому что, не осуществляя ее в делах, он не приобрел никакой полноты.
      cn: 将只以信心自夸之人称为虚空，因为他不以行为实践信心，便未曾获得任何圆满。
  - type: paragraph
    text:
      ru: Иак.2:21.Не делами ли оправдался Авраам, отец наш, возложив на жертвенник Исаака, сына своего?
      cn: (雅各书 2:21) 我們的祖宗亞伯拉罕把他兒子以撒獻在壇上，豈不是因行為稱義嗎？
  - type: paragraph
    text:
      ru: Авраам отец наш не от дел ли оправдася, вознес Исаака сына своего на жертвенник?
      cn: 亚伯拉罕，我们的父，岂不是因行为称义，将自己的儿子以撒献在祭坛上吗？
  - type: paragraph
    text:
      ru: Иак.2:22.Видишь ли, что вера содействовала делам его, и делами вера достигла совершенства?
      cn: (雅各书 2:22) 可見信心是與他的行為並行，而且信心因著行為才得成全。
  - type: paragraph
    text:
      ru: Видиши ли, я́ко вера поспешествоваше делом его, и от дел совершися вера?
      cn: 你岂不见信德与他的功业偕作，并且信德因着功业而得以成全吗？
  - type: paragraph
    text:
      ru: 'Оба апостола приводят Авраама в подтверждение учения своего о вере. Один примером Авраама доказывает, что вера выше дел, а другой, что дела выше веры. Но выше сказано, что каждый принимает слова («вера» и «дела») в своем значении и берет полезное для него в подтверждение своих мыслей. Впрочем, некоторые отцы понимали это таким образом: Авраам, удаленный временами, есть образ той и другой веры – и той, которая до крещения, которая не требует дел, а только одной веры, исповедания спасения и слова, которым оправдываемся мы, верующие во Христа; и той, которая после крещения и которая соединена с делами. Так Дух Святый, говоривший в них, оказывается не противоречащим Себе. Одна вера оправдывает приходящего одним только исповеданием, если он тотчас отрешился от жизни, ибо у него нет дел, но для него достаточно очищения через крещение, а другая требует выказывания добрых дел от уже крещенного. С этим согласен и Павел. В другом месте он говорит и учит, что вера после крещения требует усовершенствования через дела, когда говорит:«не имеет силы ни обрезание, ни необрезание, но вера, действующая любовью»(Гал. 5, 6). Но любовь для своей полноты требует много мудрости.'
      cn: 两位使徒都引用亚伯拉罕来证实他们关于信德的教导。一位以亚伯拉罕为例证明信德高于行为，而另一位则证明行为高于信德。但如前所述，每个人都以自己的理解来接受「信德」和「行为」这两个词，并选取于己有益的来证实自己的思想。然而，一些教父是这样理解的：亚伯拉罕在不同时期，是两种信德的形象——一种是领洗前的信德，它不要求行为，只要求一种信德，即承认救恩和使我们这些信靠基督者得以称义的圣言；另一种是领洗后的信德，它与行为结合在一起。这样，在他们里面说话的圣灵就不会自相矛盾。一种信德仅凭认信就使归信者称义，如果他立刻舍弃此生，因为他没有行为，但对他而言，借由领洗而来的洁净已足够；而另一种则要求已领洗者展现善行。保罗也认同此观点。在另一处他教导说，领洗后的信德需要借由行为来完善，当他说：「受割礼与不受割礼都无关紧要，要紧的乃是藉着爱而生发效用的信德」（加拉太书 5:6）。但爱要达到其圆满，需要许多智慧。
  - type: paragraph
    text:
      ru: 'Иак.2:23.И исполнилось слово Писания: «веровал Авраам Богу, и это вменилось ему в праведность, и он наречен другом Божиим».'
      cn: (雅各书 2:23) 這就應驗聖經上所說：「亞伯拉罕信　上帝，這就算為他的義。」他又得稱為　上帝的朋友。
  - type: paragraph
    text:
      ru: 'И совершися писание глаголющее: верова же Авраам богови, и вмени́ся ему в правду, и друг Божий наре́чеся.'
      cn: 遂成就了所记的经文说：亚伯拉罕相信上帝，就给他算为义，他被称为上帝的朋友。
  - type: paragraph
    text:
      ru: Авраам был образом оправдания через одну веру тогда, когда:"поверили это вменилосьему в праведность»(Быт. 15, 6), а образом оправдания через дела был он тогда, когда возложил сына на жертвенник, ибо он не только сделал дело, но и не отпал от веры относительно Исаака, что потомство его умножится, как звезды, но помыслил,«что Бог... воскресит его из мертвых»(Евр. 11, 19).
      cn: 亚伯拉罕是因独一的信德称义的典范，那时：「他信了，这就算为他的义」（创世记 15:6）。而当他将儿子献在祭坛上时，他就是因着行为称义的典范，因为他不仅做了那件事，而且没有放弃对以撒的信德，即他的后裔将如星辰般繁多，反而思想：「上帝……能使他从死里复活」（希伯来书 11:19）。
  - type: paragraph
    text:
      ru: Подобным образом Павел свидетельствуется и Давидом, ибо Давид Духом Божиим знал, что некогда придет вера о Христе, почему говорит:«Блажен человек, которому Господь не вменит греха»(Пс. 31, 2).
      cn: 同样地，保罗也受到大卫的见证，因为大卫靠着上帝的灵知道，某时基督的信仰将要来临，因此他说：「福哉那人，上主不将罪归于他」（诗篇 31:2）。
  - type: paragraph
    text:
      ru: Иак.2:24.Видите ли, что человек оправдывается делами, а не верою только?
      cn: (雅各书 2:24) 這樣看來，人稱義是因著行為，不是單因著信。
  - type: paragraph
    text:
      ru: Зрите ли убо, яко от дел оправдается человек, а не от веры единыя?
      cn: 你们岂没有看见吗，因此，人称义是藉着行为，而不是单单藉着信德？
  - type: paragraph
    text:
      ru: От дел не закона, как сказано, например обрезанием и подобными, но от дел правды и подобных добродетелей.
      cn: 不是因着律法的行为，正如所说，例如割礼及类似之事，而是因着义行和类似的德行。
  - type: paragraph
    text:
      ru: Иак.2:25.Подобно и Раав блудница не делами ли оправдалась, приняв соглядатаев и отпустив их другим путем?
      cn: (雅各书 2:25) 妓女喇合接待使者，又放他們從別的路上出去，不也是一樣因行為稱義嗎？
  - type: paragraph
    text:
      ru: Такожде и Раав блудница не от дел ли оправдася, приемши сходники и иным путем изведши их?
      cn: 照样，妓女喇合，岂不是因接待了使者，又把他们从别的路送走了，就称义了吗？
  - type: paragraph
    text:
      ru: Иак.2:26.Ибо, как тело без духа мертво, так и вера без дел мертва.
      cn: (雅各书 2:26) 身體沒有靈是死的，信心沒有行為也是死的。
  - type: paragraph
    text:
      ru: Я́коже бо тело без духа мертво́ есть, тако и вера без дел мертва есть.
      cn: 正如身体没有灵是死的，照样，信德没有行为也是死的。
- type: heading1
  text:
    ru: Глава третья
    cn: 第三章
  children:
  - type: paragraph
    text:
      ru: Иак.3:1.Братия мои! не многие делайтесь учителями, зная, что мы подвергнемся большему осуждению,
      cn: (雅各书 3:1) 我的弟兄們，不要多人作師傅，因為曉得我們要取更大的罪名。
  - type: paragraph
    text:
      ru: Не мнози учи́телие бывайте, братие моя, ведяще, яко болшее осуждение приимем,
      cn: 我的弟兄们，不要有许多人作教师，因为你们知道我们将承受更重的审判。
  - type: paragraph
    text:
      ru: Выше апостол говорил и учил, что верные должны иметь веру не одну, но вместе с добрыми делами. Теперь он переходит к другой равнозначительной заповеди. Некоторые берутся учить тому, чего сами не совершали. Такие учители, говорит, не получают никакой пользы, но подлежат большему осуждению. Ибо кто учит тому, чего сам не имеет, как имеющий будто бы это, тот достоин осуждения за то, что грешит своим языком.
      cn: 上文使徒曾言教道，信徒们信心不应是单独的，而应与善行并存。如今他转向另一条同等重要的诫命。有些人竟敢教导他们自己并未实践之事。他（使徒）说，这样的教师不会获得任何益处，反而要承受更大的定罪。因为凡是教导自己不具备之物，却仿佛自己拥有此物的人，他理当受定罪，因为他用言语犯罪。
  - type: paragraph
    text:
      ru: 'Чтобы обстоятельнее подтвердить это, говорит, что если в ином случае язык обыкновенно и грешит от невнимательности, за что не избежит осуждения впавший в оную, как учит Соломон:«за грех усте́н впадает в сети грешник»(«Нечестивый уловляется грехами уст своих») (Притч. 12,13): то как избежит неизбежного наказания тот, кто намеренно грешит языком, кто учит тому, чего не изучил на опыте?'
      cn: 为了更详尽地证实这一点，（他）说，如果在其他情况下，舌头通常因不谨慎而犯罪，陷入其中者因此无法避免谴责，正如所罗门教导的：「罪人因口舌之罪陷入网罗」（「不敬虔者被其口舌之罪所俘获」）（箴言 12:13）：那么，故意用舌头犯罪，教导自己未曾亲身学习过之事的人，又怎能避免这不可避免的惩罚呢？
  - type: paragraph
    text:
      ru: Иак.3:2.ибо все мы много согрешаем. Кто не согрешает в слове, тот человек совершенный, могущий обуздать и все тело.
      cn: (雅各书 3:2) 原來我們在許多事上都有過失；若有人在話語上沒有過失，他就是完全人，也能勒住自己的全身。

        因为我们众人都多有跌倒。凡在言语上不跌倒的，他就是完全人，也能勒住自己的全身。'
  - type: paragraph
    text:
      ru: Много бо согрешаем вси.Ащекто в слове не согрешает, сей совершен муж, си́лен обузда́ти и все тело.
      cn: 因为我们人人在许多事上都多有犯错。若有人在言语上没有犯错，他就是完全的人，也能勒住全身。
  - type: paragraph
    text:
      ru: Много бо согрешаем вси, проводя жизнь невнимательно и нерадиво. Что ни один человек не избегает греха, это подтверждается удобоподвижностью языка. Отсюда же видно, что ни у кого нет совершенства, ибо кто не согрешил языком своим? Если же кто преодолеет удобоподвижность языка своего, тот способен хорошо управлять и всем телом. Ибо кто удержал очень склонное к падению, тот с меньшим трудом при внимании возгосподствует над тем, что падает медленно.
      cn: 我们所有人都多有犯罪，因为我们生活得疏忽和懈怠。没有一个人能避免犯罪，这由舌头的易动性所证实。由此也可看出，没有人拥有完全，因为谁没有用自己的舌头犯过罪呢？如果有人克服了他舌头的易动性，他就能很好地驾驭自己的全身。因为凡是能够约束住那极易堕落之物的人，就能以较小的努力，在警醒中胜过那缓慢堕落之物。
  - type: paragraph
    text:
      ru: Иак.3:3.Вот, мы влагаем удила в рот коням, чтобы они повиновались нам, и управляем всем телом их.
      cn: (雅各书 3:3) 看哪，我們若把嚼環放在馬嘴裏，叫牠順服，就能調動牠的全身。
  - type: paragraph
    text:
      ru: Се [бо и] ко́нем узды́ во уста влагаем, да повинуются нам, и все тело их обращаем.
      cn: 看哪，[因为甚至]我们将嚼环套在马的口中，好叫它们顺服我们，并且调动它们的全身。
  - type: paragraph
    text:
      ru: 'Упомянутая возможность обуздать все тело подтверждается примерами: удилами на конях, рулями на кораблях."Се"поставлено вместо «посмотри».«Конем узды»нужно сочетать в таком порядке: «влагаем удила в рот коням». Без такого сочетания слов речь не будет иметь смысла. Посмотри: мы полагаем узду на коней, а корабли небольшим рулем, как и коней небольшой уздой, направляем, куда хотим. Так и язык должно управлять здравым разумом, хотя он бывает миром неправды в употреблении черни. Ибо миром называет здесь апостол множество.'
      cn: '所提及的勒住全身的可能性，借着例子得到证实：譬如马匹口中的嚼环，以及船上的舵。


        「看哪」是用来代替「看」。「马的嚼环」需要以「我们把嚼环放入马口中」这样的顺序组合，若没有这样的词语组合，话语将毫无意义。你们看：我们给马勒上嚼环，而船只则用小小的舵，正如用小小的嚼环控制马匹一样，将它们导向我们所愿的方向。照样，舌头也应受健全的理性管理，尽管在俗众的运用中，它有时会成为一个不义的世界。因为使徒在此所说的「世界」，乃是指「众多」。'
  - type: paragraph
    text:
      ru: 'Или: хотя язык есть украшение естества человеческого, ибо мы посредством него сообщаем друг другу свои мысли (в таком значении некоторые желают понимать слово «мир»), но он в употреблении простого народа несправедлив, оскверняет все тело и воспаляет весь круг жизни, будучи сам воспаляем от геенны. Однако не трудно заставить его двигаться благословно и так, как пожелает распоряжающийся им. Ибо если всякое естество зверей, пресмыкающихся, птиц и морских животных укрощено и укрощается естеством человеческим, то я не могу сказать, что язык есть неудержимое зло, что он полон смертоносного яда и что никто из людей не может укротить его, ибо если язык неукротим и не направляется ни к чему доброму, то как мы им благословляем Бога и Отца и им проклинаем человеков? Вот он направляется по воле пользующегося. Но сему, братия мои, не должно быть так. Ибо если мы им благословляем, то не стыдно ли нам проклинать человеков, сотворенных по подобию Божию? Несправедливо из одних и тех же уст выходить благословению и проклятию. Итак, сохраняй язык паче зеницы ока! Язык есть царский конь. Если ты наложишь на него узду и научишь его ходить равномерно, то царь спокойно будет сидеть на нем; если же пустишь его бежать и скакать без узды, то он сделается колесницей диавола.'
      cn: 或者说：尽管舌头是人性的装饰，因为我们借着它彼此交流思想（在这种意义上有些人愿理解「世界」一词），但它在普通百姓的使用中是不公义的，玷污了全身，并点燃了生命的整个进程，因为它自己也被地狱所点燃。然而，使它合宜地运行，并按着驾驭它的人所愿的方式运行，这并不难。因为如果走兽、爬虫、飞鸟和海中生物的一切本性都已经被驯服，并且正在被人类驯服，那么我不能说舌头是无法遏制的恶，它充满了致命的毒药，并且没有人能驯服它；因为如果舌头是无法驯服的，并且不导向任何善事，那么我们怎能用它来称颂上帝和父，又用它来咒诅人类呢？看哪，它被按照使用它之人的意愿所引导。但我的弟兄们，此事不应如此。因为如果我们用它来称颂，那么我们咒诅人类岂不羞愧吗？他们是照着上帝的形像所造的。从同一张口中发出称颂和咒诅是不公义的。所以，要保守你的舌头，胜过眼中的瞳仁！舌头是君王的马匹。如果你给它套上缰绳，并教导它平稳地行走，那么君王就会安稳地坐在上面；如果你让它脱缰奔跑跳跃，那么它就会变成魔鬼的战车。
  - type: paragraph
    text:
      ru: Иак.3:4.Вот, и корабли, как ни велики они и как ни сильными ветрами носятся, небольшим рулем направляются, куда хочет кормчий;
      cn: (雅各书 3:4) 看哪，船隻雖然甚大，又被大風催逼，只用小小的舵，就隨著掌舵的意思轉動。
  - type: paragraph
    text:
      ru: 'Се, и корабли вели́цы суще и от жестоких ветров заточаеми, обращаются малым кормилцем, а́може стремление правящаго хо́щет:'
      cn: 看哪，甚至巨大的船只，虽被狂风吹逼，却由一个小小的舵转向，随着驾驭者的心意所愿。
  - type: paragraph
    text:
      ru: 'И это говорится к тому же, то есть что язык должно двигать не как случится, но направлять его на лучшее. Ибо как мы уздой сдерживаем порывы коня и рулем переменяем течение корабля, так должны и язык направлять к лучшему. Выражение:«такожде же и язык»(Иак.3:5) то и значит, что язык должен быть направляем здравым разумом, ибо хотя он мал, но делает великое: он зажигает нам великий костер, потому что и сам есть огонь. И что еще делает? Прикрашивает неправду красноречием и изяществом; оскверняет тело, убеждая женщин приманками; через соблазн совершает убийства; клятвопреступлениями присвояет чужое; воспаляет круг геенны, будучи сам воспаляем от геенны, как видно на богаче,«страждущем в пламени»языко́м (Лк. 16, 24).'
      cn: 这也是说到，舌头不应随意动，而应引向美善。因为正如我们用缰绳勒住马的奔腾，用舵改变船的方向，同样，我们也要把舌头引向美善。「舌头也是这样」（雅各书 3:5）这句表达的意思是，舌头当由健全的理性引导，因为它虽小，却能做大事：它能为我们点燃大火，因为它本身就是火。它还做了什么呢？它用口才和优雅修饰不义之事；用引诱之言说服妇女，玷污身体；通过诱惑犯下杀戮；借着背誓侵占他人之物；它点燃了地狱之圈，因为它自己就被地狱点燃，正如在那个「在火焰中」舌头受苦的财主身上所见（路加福音 16:24）。
  - type: paragraph
    text:
      ru: Иак.3:5.так и язык – небольшой член, но много делает. Посмотри, небольшой огонь как много вещества зажигает!
      cn: (雅各书 3:5) 照樣，舌頭在百體裏是很小的，也能說大話。看哪，一點的火能點著何等大的樹林。
  - type: paragraph
    text:
      ru: Та́кожде же и язык мал у́д есть, и вельми́ хвалится. Се, мал огнь, [и] коль вели́ки вещи сожигает.
      cn: 同样地，舌头也是个小肢体，却大大地夸耀。看哪，小小的火，竟能点燃何等大的事物！
  - type: paragraph
    text:
      ru: Такожде, то есть таким же образом, по разумному направлению, должен двигаться и язык, ибо он небольшой член, а делает много, то есть зла и добра.«Вельми хвалится»сказано вместо «производит великие дела».
      cn: 同样地，也就是说以同样的方式，舌头也当依照理性的方向而运作，因为它虽是小小的肢体，却能行出许多事，也就是说，善事与恶事。「Вельми хвалится」意指「成就伟大的事」。
  - type: paragraph
    text:
      ru: Иак.3:6.И язык – огонь, прикраса неправды; язык в таком положении находится между членами нашими, что оскверняет все тело и воспаляет круг жизни, будучи сам воспаляем от геенны.
      cn: (雅各书 3:6) 舌頭就是火，在我們百體中，舌頭是個罪惡的世界，能污穢全身，也能把生命的輪子點起來，並且是從地獄裏點著的。

        舌头就是火，不义的世界；舌头在我们的百体中，居于这样的地位，以致玷污全身，并使生命的轮子着火，它自己也被地狱之火点燃。'
  - type: paragraph
    text:
      ru: И язык о́гнь, ле́пота неправды; сице и язык водворя́ется во удех наших, скверня все тело, и паля́ ко́ло рождения нашего, и опаля́яся от геенны.
      cn: 舌头是火，是不义的华美；如此，舌头安置在我们肢体之中，玷污全身，焚烧我们生命的轮子，自己也被地狱之火焚烧。
  - type: paragraph
    text:
      ru: Так и язык, мир неправды, есть огонь, ибо как огонь все истребляет, так и он. Некоторые под миром разумеют здесь множество, как и в словах:«мир Его не познал»(Ин. 1,10). Язык есть мир, то есть скопище неправды.
      cn: 舌头亦是如此，是不义的世界，它就是火，因为它如同火一样焚毁一切。有些人将此处的「世界」理解为「众多」，正如经文所言：「世界却不认识祂」（约翰福音 1:10）。舌头就是世界，也就是说，是不义的积聚。
  - type: paragraph
    text:
      ru: Итак, язык, опаляя колесо рождения, оскверняет жизнь. Жизнь называет венцом и псалмопевец, когда говорит к Богу:«благословиши́ венец лета благости твоея»(«венчаешь лето благости Твоей») (Пс. 64, 12). Венец же и колесо не разнятся между собой по виду как круглые. Жизнь есть колесо в том отношении, что вращается сама в себе. Так должно объяснять это место, если в тексте читать «коло геенны», как в некоторых списках и есть; но если читать «коло рождения», то под колесом рождения нужно разуметь нашу жизнь.
      cn: 所以，舌头焚烧着生命之轮，玷污了生命。诗篇作者也称生命为冠冕，当他向上帝言说时：「祢以祢的恩惠为年岁加冕」（诗篇 64:12）。冠冕和轮子在外形上并无二致，都是圆的。生命是一个轮子，因为它自身在旋转。如果文本中读作「地狱之轮」，正如在某些抄本中确有此句，那么应当如此解释这一段；但如果读作「生命之轮」，那么「生命之轮」就应当理解为我们的生命。
  - type: paragraph
    text:
      ru: Иак.3:7.Ибо всякое естество зверей и птиц, пресмыкающихся и морских животных укрощается и укрощено естеством человеческим,
      cn: (雅各书 3:7) 各類的走獸，飛禽，蛇類，水族，本來都可以制伏，也已經被人制伏了；

        因为各类的走兽、飞禽、爬虫和海物，可以被驯服，且已被驯服，是藉着人类的本性；'
  - type: paragraph
    text:
      ru: Вся́ко бо естество зверей же и птиц, гад же и рыб, укрощается и укротится естеством человеческим,
      cn: 因为凡走兽、飞禽、爬虫和鱼类的本性，都被人的本性所驯服，并将被驯服，
  - type: paragraph
    text:
      ru: 'Эту причину должно относить к вышесказанному. Апостол сказал и примером удил и руля объяснил, что хотя они малы, но при хорошем управлении производят великое, и прибавил, что так и язык должен быть управляем разумно. Теперь предложенными примерами он объясняет, что заповедует не невозможное. Он как бы так говорит: иной скажет, что язык, хотя небольшой член, но производящий много добра и зла, трудно покорить нашей воле. Но это не оправдание, ибо если человек укрощает зверей, отличных от него по природе, то тем более может он укротить свой собственный член.'
      cn: 这个原因应当归结到前面所说的。使徒说，并用辔头和舵的例子解释了，它们虽然微小，但若管理得好，就能产生伟大的作用；他又补充说，照样，舌头也应当受到理性的管理。现在他用所提出的例子解释道，他所吩咐的并非不可能。他似乎是这样说的：有人会说，舌头虽是一个小小的肢体，但却能产生许多善和恶，难以顺服我们的意志。但这并非开脱，因为如果人能够驯服在天性上与他不同的野兽，那么他更能够驯服自己的肢体。
  - type: paragraph
    text:
      ru: Иак.3:8.а язык укротить никто из людей не может
      cn: (雅各书 3:8) 唯獨舌頭沒有人能制伏，是難以駕馭的惡物，滿了害死人的毒液。
  - type: paragraph
    text:
      ru: языка же никто́же может от человек укроти́ти;
      cn: 然而，舌头没有人能制伏；
  - type: paragraph
    text:
      ru: 'Это должно читать не в утвердительной, но в вопросительной форме, именно так: человек, если укрощает и делает ручными неукротимых зверей, то ужели не укротит он собственного языка? Так должно читать это. Ибо если читать это в утвердительной форме, то несправедливо было бы давать потом следующее наставление:«Не подобает, брати́е моя, возлюбленная, си́м та́ко быва́ти»(Иак. 3:10),  ибо если невозможно укрощать язык, то напрасно апостол убеждает исполнять невозможное. А выражение'
      cn: 这应当以非肯定句，而是以疑问句的形式来阅读，确切地说，是这样：人若驯服并制服了野兽，难道不能驯服他自己的舌头吗？这应当如此阅读。因为如果以肯定句的形式来阅读，那么随后给出以下教导便是不公的：「我蒙爱的弟兄们，这些事不应当如此。」(雅各书 3:10)，因为如果驯服舌头是不可能的，那么使徒劝说人去行不可能之事，便是徒劳的。而这个说法
  - type: paragraph
    text:
      ru: Иак.3:8.это – неудержимое зло; он исполнен смертоносного яда.
      cn: (雅各书 3:8) 唯獨舌頭沒有人能制伏，是難以駕馭的惡物，滿了害死人的毒液。
  - type: paragraph
    text:
      ru: не удержи́мо [бо] зло, испо́лнь яда смертоносна.
      cn: 不可遏制，因恶充满致命的毒。
  - type: paragraph
    text:
      ru: должно понимать как пояснение.
      cn: 应当理解为解释。
  - type: paragraph
    text:
      ru: Иак.3:9.Им благословляем Бога и Отца, и им проклинаем человеков, сотворенных по подобию Божию.
      cn: (雅各书 3:9) 我們用舌頭頌讚　上帝，就是　父，又用舌頭咒詛那照著　上帝形像被造的人；
  - type: paragraph
    text:
      ru: 'Тем благословляем Бога и Отца, и тем кленем человеки бы́вшыя по подобию Божию:'
      cn: 以此称颂上帝与父，并以此咒诅照着上帝形象所造的人。
  - type: paragraph
    text:
      ru: 'И это должно разуметь в форме вопросительной, как и нижеследующее:'
      cn: 并且这应当作为疑问句来理解，如同以下内容。
  - type: paragraph
    text:
      ru: 'Иак.3:10.Из тех же уст исходит благословение и проклятие: не должно, братия мои, сему так быть.'
      cn: (雅各书 3:10) 頌讚和咒詛從一個口裏出來。我的弟兄們，這是不應當的。
  - type: paragraph
    text:
      ru: от техже уст исходит благословение и клятва. Не подобает, братие моя возлюбленная, сим тако бывати.
      cn: 从同一张口发出祝福和咒诅。我蒙爱的弟兄们，这不当如此。
  - type: paragraph
    text:
      ru: Иак.3:11.Течет ли из одного отверстия источника сладкая и горькая вода?
      cn: (雅各书 3:11) 泉源從一個眼裏能發出甜苦兩樣的水嗎？
  - type: paragraph
    text:
      ru: Еда ли источник от единаго у́стия источает сладкое и горькое?
      cn: 岂能有泉源从一个口涌出甜水和苦水呢？
  - type: paragraph
    text:
      ru: Иак.3:12.Не может, братия мои, смоковница приносить маслины или виноградная лоза смоквы. Также и один источник не может изливать соленую и сладкую воду.
      cn: (雅各书 3:12) 我的弟兄們，無花果樹能生橄欖嗎？葡萄樹能結無花果嗎？鹹水裏也不能發出甜水來。
  - type: paragraph
    text:
      ru: Еда́ мо́жет, братие моя, смоковница маслины твори́ти, или виноградная лоза смоквы? та́кожде ни един источник сла́ну и сла́дку твори́т воду.
      cn: 我的弟兄们，无花果树岂能结出橄榄，或是葡萄树岂能结出无花果呢？照样，没有一个泉源能同时发出苦涩和甘甜的水。
  - type: paragraph
    text:
      ru: Апостол хочет тронуть слушателей. Если нам повелевается всех благословлять, ибо злоречивые не наследуют Царства Божия (1Кор. 6, 10), то как не стыдно употреблять одно и то же орудие на зло и на добро? Никто из благоразумных не будет мешать одним и тем же орудием грязь и миро. Молишься ли? Не проклинай врага, ибо между молитвой и проклятием большое расстояние. Если не простишь оскорбившего тебя, то и сам не получишь прощения, и проклятие сам на себя привлечешь, когда будешь молиться, чтобы тебе прощены были долги так же, как сам ты прощаешь должникам своим (Мф. 6, 12).
      cn: '使徒想要打动听众。如果我们被吩咐要祝福所有的人，因为毁谤者不能承受上帝的国（哥林多前书 6:10），那么，用同一件器具既作恶又作善，岂不羞耻？任何有理智的人，都不会用同样的器具去搅混污秽和香膏。


        你在祷告吗？不要咒骂敌人，因为祷告与咒骂之间有很大的距离。如果你不饶恕得罪你的人，那么你自己也不会得到赦免；当你祷告说「求祢赦免我们的亏欠，如同我们赦免了亏欠我们的人」（马太福音 6:12）时，你反而会将咒诅引到自己身上。'
  - type: paragraph
    text:
      ru: Иак.3:13.Мудр ли и разумен кто из вас, докажи это на самом деле добрым поведением с мудрою кротостью.
      cn: (雅各书 3:13) 你們中間誰是有智慧有見識的呢？他就當在智慧的溫柔上顯出他的善行來。
  - type: paragraph
    text:
      ru: Кто премудр и худо́г в вас, да покажет от добраго жития́ дела своя́ в кротости и премудрости.
      cn: 你们中间谁是智慧的、有悟性的，就当从他良善的品行，在温柔与智慧中显明他的作为。
  - type: paragraph
    text:
      ru: Иак.3:14.Но если в вашем сердце вы имеете горькую зависть и сварливость, то не хвалитесь и не лгите на истину.
      cn: (雅各书 3:14) 你們心裏若懷著苦毒的嫉妒和紛爭，就不可自誇，也不可說謊話抵擋真理。
  - type: paragraph
    text:
      ru: 'Аще же зависть го́рьку и́мате и рвение в сердца́х ваших, не хвали́теся, ни лжи́те на и́стину:'
      cn: 然而若你们心中存有苦毒的嫉妒和争竞，就不要夸口，也不要违背真理说谎：
  - type: paragraph
    text:
      ru: Иак.3:15.Это не есть мудрость, нисходящая свыше, но земная, душевная, бесовская,
      cn: (雅各书 3:15) 這樣的智慧不是從上頭來的，乃是屬地的，屬情慾的，屬鬼魔的。
  - type: paragraph
    text:
      ru: 'несть сия́ премудрость свы́ше низходя́щи, но зе́мна, душевна, бесо́вска:'
      cn: 这并非是从上而降的智慧，而是属地的、属魂的、属鬼魔的。
  - type: paragraph
    text:
      ru: Иак.3:16.ибо где зависть и сварливость, там неустройство и всё худое.
      cn: (雅各书 3:16) 在何處有嫉妒、紛爭，就在何處有擾亂和各樣的壞事。
  - type: paragraph
    text:
      ru: идеже бо за́висть и рве́ние, ту нестрое́ние и всяка зла́ вещь.
      cn: 因为凡有嫉妒和争竞之处，那里就有不和与各样邪恶的事。
  - type: paragraph
    text:
      ru: Люди, любящие начальствовать и хвалящиеся мудростью мира сего, проповедовали наперекор православным учителям, завидуя им и примешивая человеческое к Божественному, чтобы привлечь к себе слушателей новизной учения, отчего и ереси произошли. Посему, окончив слово об опрометчивости и необузданности языка, апостол обращает речь на"зависть", которая рождается в людях от подобной же безрассудности, и говорит, что такие учения не свойственны истинным учителям, потому что истекают не от Божественной мудрости, но от бесовской. Сказал же он это, предварительно похвалив доброго учителя. А так как ревность может иметь приложение и к доброму и к худому, ибо ревность есть пламенное стремление души к чему-нибудь с некоторым уподоблением тому, к чему есть рвение, то апостол прибавил:"горьку", чтобы показать, о какой ревности говорит он. Сварливость же есть неодобрительная страсть к спорам. Называется так и оговор со злоречием.
      cn: 那些喜爱掌权、夸耀世俗智慧的人，嫉妒正教教师，将属人的与属神的混杂，宣讲与他们相悖的道理，以教义的新颖吸引听众，由此产生了异端。因此，使徒在论述完言语的轻率与放纵之后，将话题转向「嫉妒」——这嫉妒是由于人们同样的鲁莽而产生的——并说，这样的教义不属于真正的教师，因为它们不是源于属神的智慧，而是源于邪魔的。他是在预先称赞了良善的教师之后才说了这番话。而由于热心一词既可指善，亦可指恶——因为热心是灵魂对某种事物炽热的追求，且带有些许模仿所追求之物的倾向——因此使徒加上了「苦毒的」，以表明他所指的是何种热心。至于争吵，则是一种不被认可的争辩之癖好。诽谤与恶语中伤亦被称为争吵。
  - type: paragraph
    text:
      ru: Иак.3:17.Но мудрость, сходящая свыше, во-первых, чиста, потом мирна, скромна, послушлива, полна милосердия и добрых плодов, беспристрастна и нелицемерна.
      cn: (雅各书 3:17) 唯獨從上頭來的智慧，先是純潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。
  - type: paragraph
    text:
      ru: А я́же свыше прему́дрость, пе́рвее убо чи́ста есть, потом же мирна, кротка́, благопокорлива, испо́лнь милости и плодов благи́х, несуменна и нелицемерна.
      cn: 然而从上而来的智慧，首先是纯洁的，其次是和平的，温柔的，易受劝化的，满有怜悯和美好果子的，无有偏私的，和不虚伪的。
  - type: paragraph
    text:
      ru: Иак.3:18.Плод же правды в мире сеется у тех, которые хранят мир.
      cn: (雅各书 3:18) 並且使人和平的，是用和平所栽種的義果。
  - type: paragraph
    text:
      ru: Плод же правды в ми́ре сеется творя́щым мир.
      cn: 并且，公义的果实，在和平中由缔造和平之人播种。
  - type: paragraph
    text:
      ru: '"Чиста", то есть беспорочна, не привязана ни к чему плотскому.«Несуменна», то есть не наблюдает разбора в пище и различных омовений. Но об этом подробно рассуждает Павел в Послании к колоссянам.'
      cn: 「纯洁」，意即无瑕，不依恋任何属肉体的事物。「不分别」，意即不分别饮食以及各种洁净礼。然而，保罗在《致歌罗西人书》中对此有详细论述。
- type: heading1
  text:
    ru: Глава четвёртая
    cn: 第四章
  children:
  - type: paragraph
    text:
      ru: Иак.4:1.Откуда у вас вражды и распри? не отсюда ли, от вожделений ваших, воюющих в членах ваших?
      cn: (雅各书 4:1) 你們中間的爭戰鬥毆是從哪裏來的呢？不是從你們百體中戰鬥之私慾來的嗎？
  - type: paragraph
    text:
      ru: Отку́ду брани и сва́ры в вас? не отсю́ду ли, от сласте́й ваших, воюющих во у́дех ваших?
      cn: 在你们中间的争战和纷争是从何而来呢？岂不是从你们在你们肢体中交战的私欲而来吗？
  - type: paragraph
    text:
      ru: 'Апостол показывает, что хотя упомянутые люди присваивают себе звание учителей, однако они совершенно плотские. Они делают много весьма противного, изобретают себе удовольствия: одни ищут пышного стола, что осуждает и Павел, говоря, что"такиелюдислужат не Господу нашему Иисусу Христу, а своему чреву»(Рим. 16, 18), другие желают приобрести поместья; иные – богатых домов; иной еще иного, что внушает им лукавый, старающийся лишить их спасения.'
      cn: 使徒表明，尽管提及的那些人自称教师，然而他们却是完全属肉体的。他们行出许多极其悖逆之事，为自己寻觅享乐：有些人追求丰盛的筵席，这正是保罗所谴责的，他说：「这样的人不是服事我们的主耶稣基督，乃是服事自己的肚腹」（罗马书 16:18），另一些人渴望购置田产；还有些人则贪图豪宅；另一些人则各有其所求，这些都是那恶者所鼓动他们的，企图剥夺他们的救恩。
  - type: paragraph
    text:
      ru: Иак.4:2.Желаете – и не имеете; убиваете и завидуете – и не можете достигнуть; препираетесь и враждуете – и не имеете, потому что не прoсите.
      cn: (雅各书 4:2) 你們貪戀，還是得不著；你們殺害嫉妒，又鬥毆爭戰，也不能得。你們得不著，是因為你們不求。
  - type: paragraph
    text:
      ru: 'Жела́ете, и не имате: убиваете и зави́дите, и не мо́жете улучи́ти: сваря́етеся и бо́рете, и не и́мате, зане́ не про́сите:'
      cn: 你们贪求，却得不着；你们杀害、嫉妒，却不能得着；你们争吵、争斗，却得不着，因为你们不求。
  - type: paragraph
    text:
      ru: Здесь убеждает через положение и отрицание. Впрочем, положение умолчано как неприличное. Неприличие в том, что подразумеваемое в положении составляет разжжение похоти, ибо похоть оканчивается исполнением чувственного удовольствия. Убийство и зависть, препирательство и вражда – не добрые дела, почему и не достигают того, к чему стремятся. Нужно, впрочем, знать, что здесь говорится не о плотском убийстве и вражде, ибо это тяжело слышать даже о разбойниках, тем более о верующих (хотя некоторых) и приходящих к Господу. А мне кажется, что убийцами называет тех, которые убивают свои души такими предприятиями, за которые у них и возникает вражда против благочестия. Так и далее (Иак.4:4) назвал прелюбодеями и прелюбодейцами не тех, конечно, которые таковы на самом деле, но тех, которые грешат против Божественных заповедей, примешивая к ним свои вымыслы, ибо никто не стал бы терпеть учителя блудника, хотя бы сам был грязнее свиньи. Так и о убийствах и войнах говорит не о телесных, но о душевных.
      cn: 在这里，它通过肯定与否定来劝说。然而，该肯定因其不合宜而被缄默不言。其不合宜之处在于，该肯定中所暗示的构成对情欲的煽动，因为情欲以感官享乐的实现告终。杀戮与嫉妒，争执与仇恨——并非善行，因此也无法达成它们所渴望的。然而，需要明白的是，这里所谈论的并非肉体的杀戮与仇恨，因为这即使是对强盗来说也难以启齿，更何况是对信徒（尽管是少数）以及那些归向上主的人呢。而在我看来，它称那些人为凶手，他们用这样的行径杀害自己的灵魂，因这些行径，他们心中生出对虔敬的仇恨。同样，在接下来（雅各书 4:4）它将那些人称为奸夫和淫妇，当然，并非指那些实际上如此的人，而是指那些违背神圣诫命、将自己的虚构混入其中的人，因为没有人会容忍一个奸淫的教师，即使他自己比猪还肮脏。同样，关于杀戮和战争，它所说的也不是指肉体的，而是指灵魂的。
  - type: paragraph
    text:
      ru: Иак.4:3.Прoсите, и не получаете, потому что прoсите не на добро, а чтобы употребить для ваших вожделений.
      cn: (雅各书 4:3) 你們求也得不著，是因為你們妄求，要浪費在你們的私慾中。
  - type: paragraph
    text:
      ru: Про́сите, и не прие́млете, зане́ зле́ про́сите, да в сласте́х ваших иждиве́те.
      cn: 你们祈求，却不得到，因为你们妄求，为要将它耗费在你们的淫乐之中。
  - type: paragraph
    text:
      ru: 'Так было с фарисеем, упоминаемым в Евангелии (Лк. 18, 10–14). Чем более перечислял он добродетели свои, тем более заграждал Божественный слух, и высокопарная речь была праздной в устах его и обратилась в пену, как бушующая волна. Но скажет иной: если истинно обещание Господа Иисуса, этого неложного Учителя,«всякий просящий получает»(Мф. 7, 8), то как же говорит это теперь настоящий апостол? Отвечаем. Для того, кто приступает к молитве должным путем, упомянутое обещание истинно; он не обманется ни в чем просимом. А кто, удалившись от цели преданной молитвы, будет по видимости просить, но просить не так, как должно, тот на самом деле и не просит, а потому и не получит. Представь, например, что учитель грамматики обещает научить грамматическому знанию всякого, приходящего к нему, а пожелавший учиться будет приходить не так, как должно, и не будет напрягать себя к усвоению преподаваемого, почему окажется на деле несоответствие с обещанным. Ужели справедливо кто-нибудь припишет ложь в этом случае самому учителю? Таковой поступит неразумно, ибо желавший учиться приходит не так, как требовал учитель. Как же и чего нужно просить, скажет иной. Выслушай Самого Того, Кто дал вышеупомянутое обещание:«ищи́те же пре́жде ца́рствия Бо́жия и правды его́»(Мф. 6, 33). Очевидно, кто просит так и преимущественно этого, тот не обманется и в прочем, получение чего не отторгнет его от спасения. А кто просит вредного и пагубного, тому не станет подавать Тот, от Кого«всякое даяние доброе»(Иак. 1, 17). Даже и тот, кто просит знания Божественного или другого какого-нибудь дара духовного, но просит для своих вожделений, не получит, потому что просит худо и на погибель себе, а Бог не подает худого.'
      cn: '福音书中所提及的法利赛人（路加福音 18:10-14）便是如此。他越是列举自己的美德，就越是堵塞了上帝的圣听；他那夸大的言辞在他口中归于虚空，变成了泡沫，如同汹涌的波涛。但或许有人会说：如果主耶稣，这位从不虚妄的导师所作的应许——「凡祈求的，就得着」（马太福音 7:8）——是真实的，那么这位使徒现在所说的又当如何解释呢？


        我们回答说：对于那些以当行之道进到祷告前的人，上述应许是真实的；他在所求之事上必不致落空。但若有人偏离了虔敬祷告的目的，表面上是在祈求，却未按当行之道祈求，那么他实际上并未祈求，因此也必不得着。试想，例如，一位语法教师应许教导每一个来到他面前的人语法知识，而那渴望学习的人却未按当行之道前来，亦不努力去领会所教导的，故而实际上与所应许的并不相符。在此情形下，难道有人能公允地将谎言归咎于这位教师本人吗？这样的人行事是不明智的，因为那渴望学习的人并未按教师的要求前来。


        那么，应当如何祈求，又当祈求什么呢？或许有人会问。请听那位赐下上述应许的，祂亲自所言：「你们要先求上帝的国和祂的义」（马太福音 6:33）。显然，凡如此祈求并主要祈求这些的，他在其余之事上也不会落空，得到这些并不会使他偏离救恩。但若有人祈求有害且致人败坏之物，那么那位「各样美善的恩赐」（雅各书 1:17）的源头必不会施予他。甚至那祈求神圣知识或任何其他属灵恩赐的，若是为了自己的私欲而祈求，也必不得着，因为他祈求的方式是恶劣的，并会给自己带来败坏，而上帝不赐予恶劣之物。'
  - type: paragraph
    text:
      ru: Иак.4:4.Прелюбодеи и прелюбодейцы! не знаете ли, что дружба с миром есть вражда против Бога? Итак, кто хочет быть другом миру, тот становится врагом Богу.
      cn: (雅各书 4:4) 你們這些淫亂的男女啊，豈不知與世俗為友就是與　上帝為敵嗎？所以凡想要與世俗為友的，就是與　上帝為敵了。
  - type: paragraph
    text:
      ru: Прелюбоде́е и прелюбодейцы, не ве́сте ли, я́ко любы́ мира сего вражда Богу есть, и́же бо восхо́щет друг быти ми́ру, враг Божий быва́ет.
      cn: 淫夫淫妇啊，你们不知道吗？爱这世界的心就是与上帝为敌；所以凡愿意作世界之友的，就成了上帝的仇敌了。
  - type: paragraph
    text:
      ru: 'Выше апостол лишь слегка обличил некоторых ложных мудрецов, искажающих Божественное Писание и по своей воле в превратном виде употребляющих оное, чтобы иметь повод к своей сладострастной жизни, а это есть не другое какое-нибудь зло, но вид гордости. Теперь же он выступает против них строже и, как бы вопреки своей кротости, употребляет слова укоризненные, называя таких людей прелюбодеями и прелюбодейцами, и делает почти такие обличения: «Скажи-ка мне, легкомысленный, ты хочешь выдавать себя за мудреца? Но откуда в вашей жизни распри и постоянная вражда? Отчего всегдашняя привязанность к настоящему? Отчего беспрерывное стремление к удовольствиям настоящей жизни? Это свойственно не мудрецам, но людям простым и склонным к дружбе с миром, что и показывает, что вы прелюбодеи, ибо вы сокрытой внутри Божественной и целомудренной красоте предпочитаете красоту обыкновенную, постыдную и скверную и стремлением к настоящему воздымаете вражду против Бога. Ужели не знаете, что дружба с миром есть вражда против Бога, удаляющая от любви Божией и показывающая нас врагами Его?»'
      cn: 之前使徒只是稍微指责了一些虚假的智者，他们歪曲神圣经文，并按照自己的意愿，扭曲地使用它，以便为自己的淫逸生活找到借口，而这并非其他邪恶，乃是一种骄傲。而现在，他更严厉地反对他们，仿佛违背了他自己的温和，使用了责备的话语，称这些人是奸夫和淫妇，并进行了几乎是这样的指责：「告诉我，轻浮的人啊，你想把自己冒充为智者吗？但你们的生活中为何有争吵和持续的仇恨？为何总是依恋现世？为何总是不断地追求今生的享乐？这不是智者的特征，而是那些简单且倾向于与世界为友的人的特征，这也表明你们是奸夫，因为你们宁愿选择普通、可耻和污秽的美，而不是内在隐藏的、神圣而贞洁的美，并且因着对现世的追求而挑起对上帝的敌意。难道你们不知道，与世界为友就是与上帝为敌，这会使我们远离上帝的爱，并表明我们是祂的仇敌吗？」
  - type: paragraph
    text:
      ru: 'Миром называет здесь всю вещественную жизнь как матерь тления, приобщающийся которой немедленно становится врагом Бога, ибо при рвении к бесполезному он небрежно и презрительно относится к предметам Божественным, каковые отношения мы допускаем к людям ненавистным и враждебным для нас. Так как есть два предмета, которыми занимаются люди, – Бог и мир, и к каждому из этих двух предметов обращаются с любовью или ненавистью, то коль скоро мы сильно привяжемся к одному, очевидно, явимся нерадящими о другом, ибо внимание производит любовь, а небрежение – ненависть. Итак, кто прилепится к предметам Божественным, тот есть и называется другом Божиим, а кто вознерадел о Боге и возлюбил мир, тот в числе врагов Божиих. Пoелику же все это происходит от надмения и гордости ложных мудрецов, то апостол употребляет еще другое обличение, желая таких людей отрезвить от опьянения и возбудить от усыпления. Он говорит:'
      cn: 这里所称的「世俗」是指整个物质生命，乃是败坏之母。凡沾染上它的，立刻就成了上帝的敌人；因为当他热衷于无益之事时，他就会对神圣之物漠不关心并轻蔑以待，这种态度正是我们对待那些我们憎恨和敌视之人所持的。既然人所关注的有两类事物——上帝与世俗，并且对这两类事物中的每一类，人都会以爱或恨的态度去对待，那么，一旦我们强烈依恋其中之一，显然就会对另一类漠不关心，因为关注会生出爱，而漠视则会生出恨。因此，凡是依附于神圣之物的人，他就是，也被称为上帝的朋友；而凡是漠视上帝并爱恋世俗的人，他就在上帝敌人的行列之中。既然所有这一切都源于虚妄智者的傲慢与骄矜，那么使徒就又使用另一种斥责，意图使这类人从酩酊中清醒过来，从沉睡中振作起来。他说：
  - type: paragraph
    text:
      ru: 'Иак.4:5.Или вы думаете, что напрасно говорит Писание: «до ревности любит дух, живущий в нас»?'
      cn: (雅各书 4:5) 你們想聖經上所說是徒然的嗎？住在我們裏面的靈，是貪慾至於嫉妒嗎？
  - type: paragraph
    text:
      ru: 'Или́ мните́, я́ко всу́е писание глаго́лет: к зависти желает дух, и́же всели́ся в ны́?'
      cn: 或你们以为圣经所说的徒然吗？「那住在我们里面的灵，切慕以至于嫉妒。」
  - type: paragraph
    text:
      ru: 'Иак.4:6.Но тем большую дает благодать; посему и сказано: Бог гордым противится, а смиренным дает благодать.'
      cn: (雅各书 4:6) 但他賜更多的恩典，所以經上說：「　上帝阻擋驕傲的人，賜恩給謙卑的人。」
  - type: paragraph
    text:
      ru: 'Бо́лшую же дае́т благода́ть: темже глаголет: Господь го́рдым проти́вится, смире́нным же да́ет благодать.'
      cn: 然而祂赐下更大的恩典：因此经上说：主抵挡骄傲的人，却赐恩典给谦卑的人。
  - type: paragraph
    text:
      ru: 'Здесь употреблена фигура опущения – принятый обычаем оборот сокращенной речи. Апостол как бы так говорит: «Я собственными словами убеждал вас пользоваться своей мудростью правильно и неосужденно, чтобы вы по гордости не злоупотребляли ею, не подделывали и не извращали истинного учения. Если же вы желаете наставления и от Писания, то слушайте:«Господь гордым противится». Если Он«гордым противится»(а мы противимся обыкновенно врагам), то, без сомнения, гордые должны быть причислены к врагам, ибо Писание напрасно, без основания или по зависти, не заповедует нам невозможного, но сильно желает, чтобы через его увещания вселилась в нас благодать. Поэтому если вы покорны Писанию, то смиритесь перед Богом и получите благодать через возвышение от Него. Гордость есть надменная до крайности злоба, но отлична от самомнения. Гордость воздымается над подчиненными ей, а самомнение над тем, чего вовсе не существует. Отличается и скромность от смирения[5]. Скромность или смирение, прямо противоположное гордости, есть великое благо. И так как то и другое бывает в нас по нашему произволению, то всякий, возвышающий себя по гордости, осужден уже и уничижается от Господа, тогда как того, кто сам уничижил себя по скромности, Он возвышает в свое время, ибо самое упражнение в смирении возводит приобретшего оное на духовную высоту.'
      cn: '这里运用了修辞手法中的省略——一种惯用的缩略表达。使徒仿佛是这样说的：「我曾亲口劝服你们正确且无罪地运用你们的智慧，以免你们因骄傲而滥用它，不伪造也不扭曲真理的教义。倘若你们也渴望来自圣经的教导，那么请听：『上主抵挡骄傲的人。』」倘若祂「抵挡骄傲的人」（而我们通常抵挡敌人），那么，毫无疑问，骄傲的人应当被归入敌人之列，因为圣经绝不会无故、无凭或出于嫉妒而命令我们做不可能之事，反而强烈期望，藉着它的劝诫，恩典能充满我们。因此，倘若你们顺服圣经，就当在上帝面前谦卑，并藉着祂的升高而领受恩典。


        骄傲是一种极其傲慢的恶，但与自负不同。骄傲凌驾于其下属之上，而自负则凌驾于根本不存在的事物之上。谦逊也与谦卑不同[5]。谦逊或谦卑，与骄傲截然相反，是极大的美德。由于这两者皆出于我们的自由意志，那么凡因骄傲而自高的人，已被定罪，并被上主所贬抑；而那因谦逊而自卑的人，祂必在适当的时候将其升高，因为谦卑的操练本身就能将获得它的人提升到属灵的高度。'
  - type: paragraph
    text:
      ru: Иначе объясняет святой Кирилл. Если смерть вошла в мир через зависть диавола (Прем. 2, 24) и если Христос, по Писанию, вселился во внутреннего нашего человека (Еф. 3, 16–17), то вселился для того, чтобы упразднить смерть, происшедшую от зависти. Но Он не только это подает, но и большую благодать."Я, – говорит Он, –пришел для того, чтобы имели жизнь и имели с избытком»(Ин. 10, 10). А что Бог вселился в нас по великой любви к нам, это ясно выразил пророк, когда сказал, что ни Ангел, ни посредник, но Сам«Госпо́дь то́й нас спасе́т»(Ис. 33, 22). по любви к нам и попечению о нас. Как же Спаситель даровал и большую благодать? Низложив наветника нашего сатану, почему и прибавлено:«Бог гордым противится». Ибо как не горд тот, кто возглашает:«и вселе́нную всю́ обиму́ руко́ю мое́ю яко гнездо»(«и рука моя захватила богатство народов, как гнезда») (Ис. 10, 14).
      cn: 圣基利尔另有解释。若死亡是因魔鬼的嫉妒进入世界（智慧篇 2:24），且基督按圣经所示，已内住于我们内在的人（以弗所书 3:16-17），那么祂内住是为了废除那由嫉妒而来的死亡。但祂所赐予的不仅止于此，还有更大的恩典。祂说：「我来了，是要叫人得生命，并且得的更丰盛。」（约翰福音 10:10）。上帝因着对我们的大爱而内住于我们，先知清楚地表达了这一点，他说：不是天使，也不是使者，乃是「上主亲自拯救我们」（以赛亚书 33:22），是因着祂对我们的爱和对我们的眷顾。那么，救主又是如何赐予更大的恩典呢？祂击败了我们的控告者撒旦，因此又补充说：「上帝抵挡骄傲的人。」因为那宣告说的人怎能不骄傲呢：「我手如取鸟窝般夺取了整个世界」（我的手抓住了列国的财富，如同鸟窝）（以赛亚书 10:14）。
  - type: paragraph
    text:
      ru: Иак.4:7.Итак покоритесь Богу; противостаньте диаволу, и убежит от вас.
      cn: (雅各书 4:7) 故此你們要順服　上帝。務要抵擋魔鬼，魔鬼就必離開你們逃跑了。
  - type: paragraph
    text:
      ru: Повини́теся у́бо Богу, проти́витеся же диа́волу, и бежи́т от вас.
      cn: 所以你们当顺服上帝，抵挡魔鬼，它就必离开你们逃跑了。
  - type: paragraph
    text:
      ru: Иак.4:8.Приблизьтесь к Богу, и приблизится к вам; очистите руки, грешники, исправьте сердца, двоедушные.
      cn: (雅各书 4:8) 你們親近　上帝，他就必親近你們。有罪的人哪，要潔淨你們的手；心懷二意的人哪，要潔淨你們的心。
  - type: paragraph
    text:
      ru: 'Прибли́житеся Богу, и прибли́жится вам: очистите руце, грешницы, испра́вите сердца́ ва́ша, двоеду́шнии:'
      cn: 你们亲近上帝，上帝就必亲近你们。罪人哪，要洁净你们的手；心怀二意的人哪，要纯净你们的心。
  - type: paragraph
    text:
      ru: Иак.4:9.Сокрушайтесь, плачьте и рыдайте; смех ваш да обратится в плач, и радость – в печаль.
      cn: (雅各书 4:9) 你們要愁苦、悲哀、哭泣，將喜笑變作悲哀，歡樂變作愁悶。
  - type: paragraph
    text:
      ru: 'постражди́те и слези́те и пла́читеся: смех ваш в пла́чь да обратится, и радость в сетование:'
      cn: 受苦吧，流泪吧，哀哭吧：你们的笑声当变为哀哭，你们的喜乐当变为哀恸。
  - type: paragraph
    text:
      ru: Иак.4:10.Смиритесь пред Господом, и вознесет вас.
      cn: (雅各书 4:10) 你們務要在　主眼前謙卑，　主就必叫你們升高。
  - type: paragraph
    text:
      ru: смири́теся пред Го́сподем, и вознесет вы́.
      cn: 你们要谦卑在主面前，祂必高举你们。
  - type: paragraph
    text:
      ru: Двоедушными называет апостол тех, которые не хотят жить однообразно, но постоянно водятся и увлекаются насилием людей, и не живут в доме Господнем единомысленно, ибо Бог вселяет«единомы́сленныя в дом»(«одиноких вводит в дом») (Пс. 67, 7), А что и жизнь называется душою, это видно из слов пророка:«ко́жу за ко́жу, и вся, ели́ка и́мать человек, даст за ду́шу свою»(«кожу за кожу, а за жизнь свою отдаст человек все, что есть у него»), то есть за жизнь (Иов. 2, 4).
      cn: 使徒称那些不愿过一律生活，却常常受人的暴力引导和诱惑，并且不在上主的家中同心合意地生活的人为心怀二意者。因为上帝使「同心者居于家中」（「使孤独者进入家室」）（诗篇 67:7）。至于生命亦被称为灵魂，这可从先知的话中看出：「以皮抵皮，人所有的一切，都必为他的灵魂舍弃」（「以皮抵皮，人为自己的生命，必舍弃他所有的一切」），即为生命（约伯记 2:4）。
  - type: paragraph
    text:
      ru: 'Иак.4:11.Не злословьте друг друга, братия: кто злословит брата или судит брата своего, тот злословит закон и судит закон; а если ты судишь закон, то ты не исполнитель закона, но судья.'
      cn: (雅各书 4:11) 弟兄們，你們不可彼此毀謗。人若毀謗兄弟，論斷兄弟，就是批評律法，論斷律法。你若論斷律法，就不是遵行律法，乃是判斷人的。
  - type: paragraph
    text:
      ru: 'Не оклевета́йте друг друга, бра́тие; оклевета́яй бо брата или осужда́яй брата своего́, оклевета́ет закон и осуждает закон: а́ще же закон осужда́еши, неси творец закона, но судия́.'
      cn: 弟兄们，不要彼此诽谤；因为凡诽谤弟兄的，或论断他弟兄的，就是诽谤律法，并论断律法。然而你若论断律法，你就不是律法的颁布者，而是审判者了。
  - type: paragraph
    text:
      ru: Иак.4:12.Един Законодатель и Судия, могущий спасти и погубить;
      cn: (雅各书 4:12) 設立律法的有一位，就是那能救人也能滅人的；你是誰，竟敢論斷別人呢？
  - type: paragraph
    text:
      ru: 'Един есть Законополо́жник и Судия́, моги́й спасти и погуби́ти: ты же кто еси́ осуждаяй друга?'
      cn: 独一的立法者与审判者，祂能拯救，亦能毁灭；你又是谁，竟敢论断你的弟兄？
  - type: paragraph
    text:
      ru: Апостол знает, что гордость, начиная презрением и злословием, доводит тех, которые наступают на кротких, до совершенного уничижения. Отвлекая их от сего, он хочет настоящим предложением уцеломудрить их.
      cn: 使徒知道，骄傲始于轻蔑和诽谤，使那些欺压谦和之人者陷入完全的卑贱。为使他们脱离此境，他想以这番建议使他们回归节制。
  - type: paragraph
    text:
      ru: «Осуждает закон»значит презирает, ибо осуждающий делает это из презрения. Какой же закон осуждает он? Во-первых, тот, который повелевает:«не суди́те, и не будете судимы»(Лк. 6, 37). Во-вторых, тот, который высказан в псалме:«тайно клевещущего на ближнего своего изгоню»(Пс. 100, 5). А так как это происходит от презрения, прибавляет, что если ты судишь закон, то ты не исполнитель закона, ибо захочет ли кто жить под властью того, кого презирает? Итак, не располагайся, говорит, уничижать и как бы противоузаконять, ибо это не отпустится тебе, потому что один только Законодатель – Бог, могущий«спасти и погубити»преступников Своего закона, ибо наказывать преступников закона властен закон и Законодатель, а ты не имеешь ничего более пустословия и сам навлекаешь на себя приговор осуждения, ибо делая то же самое, что осуждаемый тобой, ты насколько его осуждаешь, настолько осуждаешь и самого себя.
      cn: 「论断律法」意谓藐视律法，盖因论断者乃出于藐视而如此行。究竟他论断的是何律法呢？其一，是那吩咐说：「你们不要论断人，就必不被论断」（路加福音 6:37）的律法。其二，是那在诗篇中言及的律法：「那暗中诽谤其邻舍者，我必剪除」（诗篇 100:5）。且因这行径乃出于藐视，故又补充道，若你论断律法，你便不是律法的遵行者，盖因岂有人愿意活在被其藐视者之权柄下呢？是故，他说，你切莫倾向于贬损，甚或犹如与律法对抗，盖因这必不蒙赦于你，因惟独上帝方为颁律者，祂能「拯救与毁灭」祂律法的犯罪者；盖因惩罚律法犯罪者，乃律法与颁律者之权柄，而你除空言外别无他物，且你自身亦招致论断之判决，盖因你所行与你所论断之人相同，你论断他多少，便论断自己多少。
  - type: paragraph
    text:
      ru: Иак.4:12.а ты кто, который судишь другого?
      cn: (雅各书 4:12) 設立律法的有一位，就是那能救人也能滅人的；你是誰，竟敢論斷別人呢？
  - type: paragraph
    text:
      ru: ты же кто еси́ осуждаяй друга?
      cn: 你，又是谁，竟 осу判弟兄呢？
  - type: paragraph
    text:
      ru: Говорит уничижительно. Когда ты сам таков, то как смеешь судить подобострастного?
      cn: 他贬低地说：「当你自己也是如此时，你怎敢论断一个与你同样卑屈的人呢？」
  - type: paragraph
    text:
      ru: 'Иак.4:13.Теперь послушайте вы, говорящие: «сегодня или завтра отправимся в такой-то город, и проживем там один год, и будем торговать и получать прибыль»'
      cn: (雅各书 4:13) 來吧，你們有話說：「今天明天我們要往某城裏去，在那裏住一年，作買賣得利。」
  - type: paragraph
    text:
      ru: 'Слышите ныне, глаголющии: днесь или утре по́йдем во он гра́д и сотвори́м ту ле́то едино, и куплю деем и приобретение:'
      cn: 你们如今听着，你们这些说：『今日或明日，我们将往某城去，并在那里住一年，作买卖并得利』的人！
  - type: paragraph
    text:
      ru: Не уничтожает произволение, но показывает, что не все зависит от самого человека – нужна и благодать свыше, ибо можно бегать, и торговать, и совершать все нужное для жизни, но должно приписывать это не собственным трудам, а только человеколюбию Божию. И Иеремия говорит:«знаю, Господи, что не в воле человека путь его»(Иер. 10, 23), и Приточник:«не хвались завтрашним днем, потому что не знаешь, что́ родит тот день»(Притч. 27, 1).
      cn: 它不摧毁自主意志，而是表明并非一切都取决于人自身——还需要来自上天的神恩，因为人可以奔跑，可以经商，可以做一切生活所需之事，但这不应归因于自己的劳苦，而只应归因于上帝的仁慈。耶利米也说：「上主啊，我深知人的道路不由自己」（耶利米书 10:23）。箴言书说：「不要为明日夸口，因为你不知道一日要生出什么来」（箴言 27:1）。
  - type: paragraph
    text:
      ru: Иак.4:14.вы, которые не знаете, что случится завтра
      cn: (雅各书 4:14) 其實明天如何，你們還不知道。你們的生命是甚麼呢？你們原來是一片雲霧，出現少時就不見了。
  - type: paragraph
    text:
      ru: 'И́же не ве́сте, что у́тре случи́тся:'
      cn: '你们不晓得明日将有何事发生：

        （雅各书 4:14）'
  - type: paragraph
    text:
      ru: 'Показывает суетность нашей жизни и пристыждает нас за то, что всю жизнь проводим в суете, что весь труд наш истощается на привременное зло. То же и Давид говорит:«у́бо образом ходит человек, оба́че всу́е мяте́тся»(«Подлинно, человек ходит подобно призраку; напрасно он суетится») (Пс. 38, 7): то есть суетится над тем, что не существует, а представляется как бы в призраке, или над тем, что не самостоятельно, но составляет как бы подобие и изображение истинно преуспевающей жизни.'
      cn: 揭示了我们生命的虚妄，并使我们感到羞愧，因为我们一生都在虚妄中度过，我们全部的劳作都耗费在短暂的世俗之事上。大卫也如此说：「人确实如同幻影般行走；他枉然劳碌」（诗篇 38:7）。即是说，他劳碌于那不存在却如幻影般显现之物，或劳碌于那不独立自主，却构成了仿佛是真实兴盛生命之表象与形像的事物。
  - type: paragraph
    text:
      ru: ибо что такое жизнь ваша? пар, являющийся на малое время, а потом исчезающий.
      cn: 因为你们的生命是什么呢？不过是一片雾气，显现片时，随即消散。(雅各书 4:14)
  - type: paragraph
    text:
      ru: Ка́я бо жизнь ваша, пара бо есть, я́же вма́ле является, потом же исчезает.
      cn: 你们的生命是什么呢？原来是蒸气，出现少时，然后就消逝了。
  - type: paragraph
    text:
      ru: 'Иак.4:15.Вместо того, чтобы вам говорить: «если угодно будет Господу и живы будем, то сделаем то или другое»,'
      cn: (雅各书 4:15) 你們只當說：「　主若願意，我們就可以活著，也可以作這事，或作那事。」
  - type: paragraph
    text:
      ru: 'Вместо е́же бы глаго́лати вам:ащеГоспо́дь восхо́щет, и живи бу́дем, и сотворим сие́ или́ о́но:'
      cn: 你们本该说：若是上主愿意，我们得以存活，就做这事或那事。
  - type: paragraph
    text:
      ru: 'Пар есть мрачный состав, происходящий от сильного жара и влажности и имеющий самое краткое бытие, ибо по причине крайней тонкости скоро"изчезает"от соприкосновения с окружающим, вступая в оное и разлагаясь, подобно тому как небольшая часть влаги в воду. Вот чему уподобил апостол"жизнь"нашу, и весьма прилично. Прервав на половине речь этим сравнением, он опять возвращается к ней и продолжает ее. Вот связь ее:«Теперь послушайте вы, говорящие: «Сегодня или завтра отправимся в такой-то город и проживем там один год и будем торговать и получать прибыль»(Иак.4:13)... между тем вам следовало быговорить: «Если угодно будет Господу и живы будем, то сделаем то или другое»(Иак.4:15)".'
      cn: 蒸汽是一种晦暗的构成物，源于强烈之热与湿气，且存有极其短暂的生命；因为它极其稀薄，很快便从与周遭的接触中消散，与之融合并分解，犹如一小部分湿气融入水中。这便是使徒所比喻的我们的「生命」，且非常贴切。他以这个比喻打断了话语，随即又回到原话并继续说。以下是其关联之处：「如今你们这些说：『我们今天或明天将往某城去，并在那里住一年，做买卖得利』的人，请听！」（雅各书 4:13）……然而，你们本该说：「上主若愿意，我们活着，就可以做这事或那事。」（雅各书 4:15）
  - type: paragraph
    text:
      ru: 'Прервав связь речи примером, которым апостол разительнее хотел показать суетность мирских забот, происходящую от гордости, он потом присовокупляет опущенное. Ход речи такой: «Вы, по своей надменности, тщеславитесь». Кто?«Вы, которые не знаете, что случится завтра, ибо что такое жизнь ваша...»и так далее. Словами«что такое жизнь ваша?»приготовил он себе путь для этого тонкого предписания; потом прибавляет и самое наставление, делая это весьма кстати.'
      cn: 使言语的连接被一个例子打断，借此使使徒更深刻地揭示出源于骄傲的世俗忧虑之虚妄，他随后补充了被省略的部分。言语的走向是这样的：「你们凭着自己的狂妄而自夸。」谁呢？「你们这些不知道明天会发生什么事的人，因为你们的生命是什么呢……」等等。他用「你们的生命是什么呢？」这些话，为这一精微的训示铺平了道路；随后他补充了这教诲本身，这样做是极其适时的。
  - type: paragraph
    text:
      ru: 'Иак.4:16.вы, по своей надменности, тщеславитесь:'
      cn: (雅各书 4:16) 現今你們竟以誇口為樂；凡這樣作樂都是惡的。
  - type: paragraph
    text:
      ru: 'Ны́не же хва́литеся в горды́нех ваших:'
      cn: 如今你们却在你们的骄傲中自夸。
  - type: paragraph
    text:
      ru: Гордый и гордость занимаются ненастоящими предметами, почему и называется «гордый», что значит «живущий в заблуждении или обольщении».
      cn: 骄傲之人与骄傲，皆执着于虚妄之物，故被称为「骄傲之人」，意即「活在迷误或迷惑之中」。
  - type: paragraph
    text:
      ru: всякое такое тщеславие есть зло.
      cn: 一切这样的虚荣都是恶。
  - type: paragraph
    text:
      ru: вся́ка хвала́ такова́ зла́ е́сть.
      cn: 一切这样的赞美都是恶的。
  - type: paragraph
    text:
      ru: '"Всякоеподобноетщеславие есть зло».'
      cn: 一切类似的虚荣都是恶。
  - type: paragraph
    text:
      ru: Иак.4:17.Итак, кто разумеет делать добро и не делает, тому грех.
      cn: (雅各书 4:17) 所以，人若知道行善，卻不去行，這就是他的罪了。
  - type: paragraph
    text:
      ru: Ведущему у́бо добро твори́ти, и не творя́щему, грех ему́ е́сть.
      cn: 凡知道行善，却不去行的，于他便是罪。
  - type: paragraph
    text:
      ru: 'Опять заводит речь о суетной надменности, которая обыкновенно рождается от гордости, и, как бы заключая речь, говорит, что тщеславие есть зло. Если же оно зло, то происходит, без сомнения, от лукавого. Но тем, которые через святое крещение предали себя Господу, не следует принимать посеваемое лукавым. Прибавляет и сие:«кто разумеет делать добро и не делает, тому грех»(Иак. 4, 17). Опять вразумляет лжеучителей, чтобы не смели тому учить, чего не исполнят прежде сами, ибо блажен, сказано, не тот, кто научит, но тот,«кто сотворит и научит»(Мф. 5, 19), так как дела должны предшествовать словам, чем и возвещает праведник веру являемую. Ибо кто, говорит Господь, нарушит одну из заповедей сих малейших и научит так людей, то есть тому, над чем сам не трудился, тот малейшим наречется...«а кто сотворит и научит, тот великим наречется»(Мф. 5, 19). Посему и Сам Богочеловек сначала стал творить, а потом учить (Деян. 1, 1). Такая, по моему мнению, мысль и в сих словах:«хвалящийся хвались Господом»(1Кор. 1, 31). то есть подобным Господу, в Нем имея учителя и пример. Сходно с тем и Давид говорит:«о Господе похвалится душа моя»(«Господом будет хвалиться душа моя») (Пс. 33, 3), – не иное что говорит, как сие: желал бы я похвалиться тем, что хожу по заповедям Господним.'
      cn: 再次谈到虚妄的傲慢，它通常源于骄傲，并且，仿佛是在总结陈词，它说虚荣是恶。若它为恶，那么毫无疑问，它来自那恶者。然而，那些通过神圣的洗礼将自己奉献给上主的人，不应接受那恶者所播撒的。又加上了这句：「人若知道行善却不去行，这就是他的罪了」（雅各布书 4:17）。再次告诫假教师们，不要胆敢去教导那些他们自己尚未实践的事，因为经上说，福哉，不是那教导的人，而是那「遵行并教导的人」（马太福音 5:19），因为行为当先于言语，圣者借此也宣示出所显明的信德。因为上主说：「凡违犯这诫命中最小的一条，又这样教导人的，也就是说，教导那些他自己尚未努力实践的事，他在天国里必称为最小的了……但凡遵行并教导的，他在天国里必称为大的」（马太福音 5:19）。因此，神人祂自己也是先开始行事，然后才教导（使徒行传 1:1）。依我之见，这种思想也体现在以下这些话中：「夸口的当指着上主夸口」（哥林多前书 1:31）。也就是说，当效法上主，以上主为师表和榜样。与此相似，达味也说：「我的灵魂必因上主而夸耀」（诗篇 33:3），——这话无非是说：我愿以上主的诫命而行作为我的夸耀。
- type: heading1
  text:
    ru: Глава пятая
    cn: 第五章
  children:
  - type: paragraph
    text:
      ru: 'Иак.5:1.Послушайте вы, богатые: плачьте и рыдайте о бедствиях ваших, находящих на вас.'
      cn: (雅各书 5:1) 來吧，你們這些富足人哪，應當哭泣、哀號，因為將有苦難臨到你們身上。
  - type: paragraph
    text:
      ru: Прииди́те ны́не бога́тии, пла́читеся и рыда́йте о лютых ско́рбех ва́ших гряду́щих на вы́.
      cn: 现今来吧，富足人哪！为你们那将临于你们的深重忧患哀哭痛号吧！
  - type: paragraph
    text:
      ru: 'Бережливость и скупость богачей нередко заставляет их плакать. Но апостол заставляет их рыдать, то есть сильно плакать о том, что они собирают богатство свое на истление и не раздают его нищим, ибо богатство не погибает только в том случае, когда издерживают его на бедных. Посему и Приточник говорит:«поcли́ хлеб тво́й на лице́ воды́»(«Отпускай хлеб твой по водам») (Еккл. 11, 1), то есть на мнимое разрушение и тление. Ибо так бывает с хлебом, бросаемым на воду: он не погибает, но разложением своим доставляет нам прохлаждение, – прохлаждение тогда, когда язык наш будет мучиться в тамошнем пламени.'
      cn: 富人的节俭和吝啬常常令他们哭泣。但使徒令他们号啕大哭，也就是说，痛哭他们积攒财富归于朽坏，却不分给穷人；因为财富唯有在花费于穷人时才不会灭亡。因此传道者也说：「当将你的粮食撒在水面」（让你的粮食随水漂流）（传道书 11:1），也就是说，归于看似的毁灭和朽坏。因为扔在水上的粮食就是如此：它不会灭亡，而是通过其分解为我们带来清凉——当我们的舌头在那里的火焰中受苦时，这份清凉便会到来。
  - type: paragraph
    text:
      ru: Иак.5:2.Богатство ваше сгнило, и одежды ваши изъедены молью.
      cn: (雅各书 5:2) 你們的財物壞了，衣服也被蟲子咬了。
  - type: paragraph
    text:
      ru: Богатство ва́ше изгни́, и ри́зы вашя мо́лие поядо́ша.
      cn: 你们的财宝腐朽了，你们的衣服也被蛀虫蛀了。（雅各书 5:2）
  - type: paragraph
    text:
      ru: Иак.5:3.Золото ваше и серебро изоржавело, и ржавчина их будет свидетельством против вас и съест плоть вашу,
      cn: (雅各书 5:3) 你們的金銀都壞蝕了；那鏽要控告你們的不是，又要吃你們的肉，如同火燒。你們在這末後的日子只知積聚錢財。
  - type: paragraph
    text:
      ru: Зла́то ваше и сре́бро изоржа́ве, и ржа́ их в послу́шество на ва́с бу́дет, и сне́сть пло́ти ва́шя
      cn: 你们的金子和银子都生了锈，它们的锈将作证对抗你们，并且将吞噬你们的肉体。
  - type: paragraph
    text:
      ru: Гниение богатства, говорит, съедение одежд молью и ржавчина серебра и золота будут свидетельствовать против вас, обличая вас в том, что вы ничего не подавали. Посему и в последние дни, то есть в пришествие Господне, богатство ваше окажется как бы огнем, собранным на погибель вашу, что и испытал богач, упоминаемый в Евангелии.
      cn: 他说，财富的朽坏，衣服被虫蛀蚀，以及金银的锈蚀，将作证指控你们，责备你们一无所施。因此，在末世，也就是在主的降临之时，你们的财富将如同火焰，为毁灭你们而积攒的，这也是福音书中所提及的那个财主所经历的。
  - type: paragraph
    text:
      ru: 'Иак.5:3.как огонь: вы собрали себе сокровище на последние дни.'
      cn: (雅各书 5:3) 你們的金銀都壞蝕了；那鏽要控告你們的不是，又要吃你們的肉，如同火燒。你們在這末後的日子只知積聚錢財。
  - type: paragraph
    text:
      ru: 'А́ки о́гнь: его́же сниска́сте в после́дния дни́'
      cn: 如火：你们在末后的日子所寻得的。
  - type: paragraph
    text:
      ru: '– это нужно соединить со словами«богатство ваше», чтобы речь имела такой вид: «богатство ваше, которое вы собрали, как огонь, и на земле тратили на удовольствия и расточали».'
      cn: 你们的财富，你们所积蓄的，如同火焰一般，并在地上将它耗费于享乐，又任意挥霍。
  - type: paragraph
    text:
      ru: Иак.5:4.Вот, плата, удержанная вами у работников, пожавших поля ваши, вопиет, и вопли жнецов дошли до слуха Господа Саваофа.
      cn: (雅各书 5:4) 看哪，工人給你們割下田稼、被你們詐扣的工錢，這工錢有聲音呼叫；並且那些收割之人的冤聲已經入了大軍之　主的耳了。
  - type: paragraph
    text:
      ru: Се́, мзда де́лателей де́лавших нивы вашя, удержа́ная от ва́с, вопие́т, и вопие́ния жа́вших во у́ши Го́спода Савао́фа внидо́ша.
      cn: 看哪，那为你们收割田地的工人的工钱，就是被你们扣留的，正在呼喊；那收割之人的呼喊，已进入上主撒巴俄特的耳中。
  - type: paragraph
    text:
      ru: Иак.5:5.Вы роскошествовали на земле и наслаждались; напитали сердца ваши, как бы на день заклания.
      cn: (雅各书 5:5) 你們在世上享宴樂，好淫逸；你們嬌養了心，如在宰殺的日子一樣。
  - type: paragraph
    text:
      ru: 'Возвесели́стеся на земли́, и наслади́стеся: упита́cте сердца́ ва́ша а́ки в день заколе́ния.'
      cn: 你们在地上欢欣，又尽情享乐；你们养肥了你们的心，如同宰杀之日。
  - type: paragraph
    text:
      ru: Это обличение и посрамление начальникам иудейским, которые пасли бедных и пресыщались почестями от всех, но сами готовились на заклание римским властям от рук их, особенно за то, что осудили единственного Праведника – Господа и убили Его, когда Он не противоречил, не вопиял.
      cn: 这是对犹太人首领们的责备和羞辱，那些牧养穷人却从众人那里饱享尊荣的首领们，但他们自己却在为着被罗马政权从他们手中宰杀作预备，尤其因为他们定罪了那唯一的义者——上主，并杀害了祂，当祂不反驳、不呼喊之时。
  - type: paragraph
    text:
      ru: Иак.5:6.Вы осудили, убили Праведника; Он не противился вам.
      cn: (雅各书 5:6) 你們定了義人的罪，把他殺害；他也不抵擋你們。
  - type: paragraph
    text:
      ru: 'Осуди́сте, уби́сте пра́веднаго: не проти́вится ва́м.'
      cn: 你们定了罪，杀了那义人：他不抵挡你们。
  - type: paragraph
    text:
      ru: Словами«убисте Праведнаго»апостол, бесспорно, имеет в виду Самого Христа. Однако же, прибавлением«не противится вам»он обобщает речь, простирая ее на прочих, потерпевших от иудеев подобное, и, может быть, пророчески говорит о собственном страдании.
      cn: 使徒毫无疑问地，借由「你们杀害了义者」这些话语，指的是基督本身。然而，借由加上「他不抵挡你们」，他将此言论泛化，将其延及其他遭受犹太人类似苦难的人，并且，也许是预言性地谈及他自己的苦难。
  - type: paragraph
    text:
      ru: Иак.5:7.Итак, братия, будьте долготерпеливы до пришествия Господня.  Вот, земледелец ждет драгоценного плода от земли
      cn: (雅各书 5:7) 所以弟兄們，你們要忍耐，直到　主來。看哪，農夫等候地裏寶貴的出產，為此長久忍耐，直到得了秋雨春雨。
  - type: paragraph
    text:
      ru: 'Долготерпи́те у́бо, бра́тие моя́, до прише́ствия Госпо́дня. Се́ земледелец ждет честна́го плода́ от земли́, долготерпя́ о не́м,дóндежеприи́мет до́ждь ра́н и по́зден:'
      cn: 所以，我的弟兄们，你们要恒忍，直到主的来临。看哪，农夫等候着地里宝贵的果实，为它恒忍着，直到它领受早雨和晚雨。
  - type: paragraph
    text:
      ru: 'Осудив роскошь начальников иудейских и жестокость их в отношении к бедным, апостол обращает речь к верным и говорит: братия! не соблазняйтесь при виде сего и не унывайте, будто бы не будет отмщения. Говорит о нашествии римлян и о пленении ими иудеев, которое и называет пришествием Господним, подобно как и приклонившийся к груди Господа Иоанн, когда говорит о своей кончине, представляет Самого Господа говорящим:«если Я хочу, чтобы он пребыл, пока приду»(Ин. 21, 22), ибо здешняя жизнь его простиралась до взятия Иерусалима и немного далее. А что пришествие Господне как здесь, так и у Иоанна означает истребление Иерусалима, это видно и из слов пророка:«вот, Он идет, говорит Господь Саваоф. И кто выдержит день пришествия Его»(Мал. 3, 1–2), то есть когда пришествие Божие наведет наказание на нечестивых.Иоанн Златоуств некоторых своих толкованиях, когда разбирает слова«пока приду», видит в них также указание на разрушение Иерусалима и подтверждает это молитвой трех отроков, которые говорят:«та́ко да будет жертва наша пред тобо́ю дне́сь, и да соверши́тся по тебе»(«так да будет жертва наша пред Тобою ныне благоугодною Тебе») (Дан. 3, 40). При сем он говорит, что значит по Тебе: после того как пройдет гнев Твой. А когда он пришел? Когда Навуходоносор разрушил Иерусалим. Это о слове пришествия. Некоторые же из отцов говорят и то, что долготерпением апостол называет здесь сносливость по отношению друг к другу, а терпением – сносливость по отношению к внешним, ибо человек долготерпелив к тому, кому может и мстить, а кому не может мстить, от того терпит. Посему о Боге никогда не употребляется слово «терпение», но «долготерпение», а о людях – «терпение».'
      cn: 使徒谴责了犹太首领的奢华及其对穷人的残忍之后，转而对信徒们说：「弟兄们！不要因此而跌倒，也不要沮丧，仿佛没有报应似的。」他谈到罗马人的入侵和他们对犹太人的掳掠，并称之为「上主的来临」，正如那位曾依偎在主胸膛的约翰，当他谈到自己的结局时，也呈现出主亲自说：「我若要他存留，直到我来」（约翰福音 21:22），因为他的现世生命延续到耶路撒冷被攻陷之后不久。而上主的来临，无论在此处还是在约翰的记载中，都意味着耶路撒冷的毁灭，这一点也可见于先知的话语：「看哪，他来了，万军之主上帝说。谁能经受得住他来临的日子呢？」（玛拉基书 3:1-2），也就是说，当上帝的来临将惩罚带给不虔敬之人时。约翰·金口在他的一些释经中，当他解析「直到我来」这句话时，也认为其中指明了耶路撒冷的毁灭，并以三位青年人的祷告来证实这一点，他们说：「这样，愿我们的祭献今日在你面前蒙悦纳，并在你之后得以成全」（「这样，愿我们的祭献今日在你面前蒙你悦纳」）（但以理书 3:40）。对此他说，所谓「在你之后」的意思是：在你的怒气消逝之后。那么，这怒气何时到来呢？当尼布甲尼撒毁灭耶路撒冷之时。这是关于「来临」一词的阐释。然而，一些教父也认为，使徒在此处所说的「恒忍」是指彼此之间的容忍，而「忍耐」则指对外界的容忍，因为人对能报复的对象会恒忍，而对无法报复的对象则会忍耐。因此，「忍耐」一词从不用于上帝，而用「恒忍」；至于人，则用「忍耐」。
  - type: paragraph
    text:
      ru: и для него терпит долго, пока получит дождь ранний и поздний.
      cn: 并为它恒久忍耐，直到他得到早雨和晚雨。
  - type: paragraph
    text:
      ru: 'Долготерпя́ о не́м, до́ндеже прии́мет до́ждь ра́н и по́зден:'
      cn: 为着它恒久忍耐，直到它领受早雨和晚雨。
  - type: paragraph
    text:
      ru: 'Дождем ранним означается слезное покаяние в молодости, а поздним – в старости. Все же зависит от человеколюбия Божия, почему говорит: «пока получит».'
      cn: 早期雨水象征着青年时期的泪水忏悔，而晚期雨水则象征着老年时期的泪水忏悔。然而这一切都取决于上帝的仁爱，故说：「直到（人）领受。」
  - type: paragraph
    text:
      ru: Иак.5:8.Долготерпите и вы, укрепите сердца ваши, потому что пришествие Господне приближается.
      cn: (雅各书 5:8) 你們也當忍耐；堅固你們的心。因為　主來的日子近了。
  - type: paragraph
    text:
      ru: Долготерпи́те у́бо и вы, утверди́те сердца́ ва́ша, яко пришествие Госпо́дне приближи́ся.
      cn: 因此，你们也当恒久忍耐，坚定你们的心，因为主的降临临近了。
  - type: paragraph
    text:
      ru: 'Иак.5:9.Не сетуйте, братия, друг на друга, чтобы не быть осужденными: вот, Судия стоит у дверей.'
      cn: (雅各书 5:9) 弟兄們，不要彼此懷怨，免得你們被定罪；看哪，那審判的站在門前了。
  - type: paragraph
    text:
      ru: 'Не воздыха́йте друг на друга, бра́тие, да не осужде́ни бу́дете: се́, cудия́ пред две́рьми стои́т.'
      cn: 不要彼此抱怨，弟兄们，免得你们被定罪：看哪，审判者站在门前。
  - type: paragraph
    text:
      ru: Иак.5:10.В пример злострадания и долготерпения возьмите, братия мои, пророков, которые говорили именем Господним.
      cn: (雅各书 5:10) 我的弟兄們，你們要把那先前奉　主名說話的眾先知當作能受苦能忍耐的榜樣。
  - type: paragraph
    text:
      ru: О́браз приими́те, братие моя, злострада́ния и долготерпе́ния проро́ки, иже глаго́лаша и́менем Господним.
      cn: 我的弟兄们，你们要把那些奉上主之名说话的先知们，当作苦难与恒忍的榜样。
  - type: paragraph
    text:
      ru: Иак.5:11.Вот, мы ублажаем тех, которые терпели. Вы слышали о терпении Иова и видели конец оного от Господа, ибо Господь весьма милосерд и сострадателен.
      cn: (雅各书 5:11) 看哪，那忍耐的人，我們以他們為有福的。你們聽見過約伯的忍耐，也看見　主給他的結局；明顯　主甚是慈悲，大有憐憫。
  - type: paragraph
    text:
      ru: Се́, блажи́м терпя́щая. Терпение И́овле слы́шасте, и кончи́ну Госпо́дню видесте, я́ко многоми́лостив е́сть Госпо́дь и щедр.
      cn: 看哪，我们称那忍耐的人为有福的。你们已经听见约伯的忍耐，并且你们已经看见上主的结局，因为上主是大有慈悲且仁慈的。
  - type: paragraph
    text:
      ru: 'Иак.5:12.Прежде же всего, братия мои, не клянитесь ни небом, ни землею, и никакою другою клятвою, но да будет у вас: «да, да» и «нет, нет»,'
      cn: (雅各书 5:12) 我的弟兄們，最要緊的是不可起誓，不可指著天起誓，也不可指著地起誓，無論何誓都不可起；你們說話，是倒要說是；不是，就說不是；免得你們陷在罪裏。
  - type: paragraph
    text:
      ru: 'Прежде же всех, братие моя́, не клени́теся ни не́бом, ни земле́ю, ни ино́ю ко́ею кля́твою: бу́ди же ва́м е́же е́й, е́й, и е́же ни́, ни́:'
      cn: 首先，我的弟兄们，既不要指着天，也不要指着地，也不要指着任何别的誓言起誓；你们的言语当是：是就说是，不就说不，
  - type: paragraph
    text:
      ru: 'Утверждение ваше пусть будет твердо в твердом и отрицание ваше пусть будет такое же. Иначе: пусть свидетельство вашей жизни будет тверже клятвы. Если кто-нибудь бесстыдный, не уважая вашей жизни, настоятельно будет требовать от вас клятвы, то вместо клятвы пусть будет у вас «да, да» и «нет, нет».'
      cn: 你们的肯定当坚实而坚定，你们的否定亦当如此。换言之，你们生命的见证当比誓言更坚实。如果有人厚颜无耻，不尊重你们的生命，执意要求你们起誓，那么，你们就当以「是，是」和「不是，不是」代替誓言。
  - type: paragraph
    text:
      ru: дабы вам не подпасть осуждению.
      cn: 免得你们遭受定罪。
  - type: paragraph
    text:
      ru: да не в лицемерие впаде́те.
      cn: 免得你们陷入伪善。
  - type: paragraph
    text:
      ru: 'Лицемерием называет или то осуждение, которое постигнет нещадно клянущихся и от привычки к клятве доходящих до клятвопреступления, или и самое лицемерие, которое иное есть и иным кажется. Каким же образом клянущийся впадет в лицемерие? Следующим: как клянущийся, он признается утверждающим истину, а когда последует преступление клятвы, он оказывается сущим лжецом. Клясться Богом апостол запрещает во избежание клятвопреступления, а небом и прочими предметами – для того, чтобы им не усвоить чести Божеской, ибо все клянущиеся клянутся высшим (Евр. 6, 16).'
      cn: 伪善指的是：要么是那将无情地降临在那些轻率起誓并因习惯起誓而沦为违誓者身上的审判，要么是指伪善本身，即表里不一（言行不一）的行为。那么，起誓者将如何陷入伪善呢？如下所述：作为起誓者，他被认为是宣称真理的；而当违誓行为发生时，他就显明自己是个彻头彻尾的骗子。使徒禁止凭着上帝起誓，为的是避免违誓；至于凭着天和其它事物起誓，则是为了不将神圣的尊荣归于它们，因为所有起誓的人都是凭着更高的（事物）起誓的（希伯来书 6:16）。
  - type: paragraph
    text:
      ru: 'Но скажет иной: что делать, если иного принуждают клясться? Отвечаем: страх Божий сильнее насилия принуждающего. Иной, имея в виду ветхий закон, будет и так недоумевать: если ветхий закон одобряет клянущегося именем Господним, то как возбраняет делать это благодать? Отвечаем: ветхий закон повелел иудеям клясться Богом, чтобы отвратить их от клятвы идолами, подобно тому как повелел он им приносить жертвы Богу, чтобы отвлечь их от принесения жертв идолам. Но когда он достаточно научил иудеев благочестию, тогда отменил и жертвы, как бесполезные, стал требовать в жертву не заклания животных, но души сокрушенной. Какой же это? Такой, которая через смирение вся сожигается огнем любви, подобно Павлу, который в высшей степени воспламенялся, когда некоторые из верных соблазнялись (2Кор.11, 29).'
      cn: 但有人会说：如果有人被强迫起誓，该怎么办呢？我们回答：敬畏上帝的心强于强迫者的暴力。另有人，考虑到旧约律法，会这样困惑：如果旧约律法认可奉上主之名起誓的人，那么恩典又如何禁止这样做呢？我们回答：旧约律法命令犹太人奉上帝起誓，以便使他们脱离对偶像的起誓，正如它命令他们向上帝献祭，以便使他们脱离向偶像献祭。但当它充分教导了犹太人敬虔之后，便废除了祭祀，认为它们是无益的，开始要求献上的祭不是宰杀动物，而是破碎的心灵。这是怎样的一种心灵呢？这样一种，它通过谦卑，完全被爱的火焰所燃烧，就像保罗一样，当一些信徒被绊倒时，他极度地被激发（哥林多后书 11:29）。
  - type: paragraph
    text:
      ru: Иак.5:13.Злостраждет ли кто из вас, пусть молится. Весел ли кто, пусть поет псалмы.
      cn: (雅各书 5:13) 你們中間有受了苦的麼？他可以禱告。有喜樂的麼？他可以唱詩歌頌。
  - type: paragraph
    text:
      ru: 'Злостра́ждет ли кто в ва́с? да молитву де́ет: благоду́шствует ли кто? да поет.'
      cn: 你们中间若有人受苦，他就当祷告；若有人心境舒畅，他就当歌唱。
  - type: paragraph
    text:
      ru: Злостраданию пусть сопутствует молитва, чтобы для искушаемого легче был выход из искушений. Потом, когда волнения наши через молитву умолкнут и душа достигнет свойственного ей состояния, тогда пусть поет, чтобы блаженство ее приумножилось, ибо пение псалмов, по словамВасилия Великого, производит мирное и беспечальное состояние души. Кто не достиг такого состояния, которое Давид называет святостью, побуждая святых петь Господу (Пс. 29, 5), молитва того долго бывает пустословием.
      cn: 苦难当伴随着祷告，好使受试探者更容易从中解脱。此后，当我们的骚动藉着祷告而平息，灵魂达到其固有的状态时，那时，当歌唱，好使其福乐加增；因为据圣巴西略大教父所言，诵唱圣咏能产生灵魂平安无忧的状态。凡未达到达味称之为圣洁，并劝勉圣者向上主歌唱（诗篇 29:5）的那种状态者，其祷告久久都是空话。
  - type: paragraph
    text:
      ru: Иак.5:14.Болен ли кто из вас, пусть призовет пресвитеров Церкви, и пусть помолятся над ним, помазав его елеем во имя Господне.
      cn: (雅各书 5:14) 你們中間有病了的麼？他可以請教會的長老來；他們可以為他禱告，奉　主的名用油抹他。
  - type: paragraph
    text:
      ru: 'Боли́т ли кто в вас, да призове́т пресви́теры церко́вныя, и да молитву сотворя́т над ним, пома́завше его́ еле́ем во и́мя Господне:'
      cn: 你们中间若有人患病，就当请教会的长老来，让他们在他身上祷告，奉主的名用油膏抹他。
  - type: paragraph
    text:
      ru: 'Это апостолы совершали уже и в то время, когда Господь жил еще между людьми: они помазывали больных елеем (Мк. 6, 13).'
      cn: 此举使徒们那时就已经实行了，当上主尚且生活在世人中间时：他们用油膏抹病人 (马可福音 6:13)。
  - type: paragraph
    text:
      ru: Иак.5:15.И молитва веры исцелит болящего, и восставит его Господь; и если он соделал грехи, простятся ему.
      cn: (雅各书 5:15) 出於信心的祈禱要救患病的人，　主必叫他起來；他若犯了罪，它們也必蒙饒恕。
  - type: paragraph
    text:
      ru: И моли́тва веры спасе́т боля́щаго, и воздви́гнет его́ Госпо́дь; и а́ще грехи́ сотворил е́сть, отпу́стятся ему́.
      cn: 并且信心的祷告必拯救患病的人，上主必使他起来；并且倘若他犯了罪，就必得赦免。
  - type: paragraph
    text:
      ru: 'Иак.5:16.Признавайтесь друг пред другом в проступках и молитесь друг за друга, чтобы исцелиться: много может усиленная молитва праведного.'
      cn: (雅各书 5:16) 你們要彼此認錯，互相代求，使你們可以得醫治。義人熱切祈禱所發的力量，是大有功效的。
  - type: paragraph
    text:
      ru: 'Испове́дайте у́бо друг другу согрешения и моли́теся друг за друга, я́ко да иcцеле́ете: мно́го бо мо́жет моли́тва пра́ведного поспешеству́ема.'
      cn: 所以，你们要彼此告白罪过，并互相代祷，好使你们得医治：因为义人蒙助的祷告，大有功效。
  - type: paragraph
    text:
      ru: 'Иак.5:17.Илия был человек, подобный нам, и молитвою помолился, чтобы не было дождя: и не было дождя на землю три года и шесть месяцев.'
      cn: (雅各书 5:17) 以利亞像我們一樣是順著性情的人，他懇切禱告，求不要下雨；雨就三年零六個月之久不下在地上。
  - type: paragraph
    text:
      ru: 'Илиа́ человек бе́ подобостра́стен нам, и моли́твою помоли́ся, да не бу́дет дождь, и не одожди́ по земли́ ле́та три и ме́сяц ше́сть:'
      cn: 以利亚是一个与我们有一样性情的人，他恳切地祷告，求不下雨，雨就不降在地上三年零六个月。
  - type: paragraph
    text:
      ru: 'Иак.5:18.И опять помолился: и небо дало дождь, и земля произрастила плод свой.'
      cn: (雅各书 5:18) 他又禱告，天就降下雨來，地也生出土產。
  - type: paragraph
    text:
      ru: и па́ки помоли́ся, и небо до́ждь даде́, и земля́ прозябе́ пло́д сво́й.
      cn: 他又祷告，天就降下雨来，地也生出自己的果实。
  - type: paragraph
    text:
      ru: Молитва праведника имеет большую силу тогда, когда и тот, за кого он молится, содействует его молитве душевной скорбью, ибо если тогда, когда за нас молятся другие, сами мы проводим время в роскоши, неге и невоздержании, то мы через это ослабляем силу молитвы подвизающегося за нас, и сбывается на нас слово блаженного Петра.«Когда один строит, а другой разрушает, то что они получат для себя кроме утомления»(Сир. 34, 23)?
      cn: 义人的祷告大有能力，当被代祷者也以灵魂的忧伤配合其祷告时。因为如果当旁人为我们祷告时，我们自己却将时间花费在奢华、安逸和不节制之中，那么我们便借此削弱了为我们竭力祷告者的力量，于是蒙福的彼得的话就应验在我们身上了：「一人建造，一人拆毁，他们除了疲乏，还能得到什么呢？」(德训篇 34:23)
  - type: paragraph
    text:
      ru: Иак.5:19.Братия! если кто из вас уклонится от истины, и обратит кто его,
      cn: (雅各书 5:19) 弟兄們，你們若有人偏離真理，有人使他歸正；
  - type: paragraph
    text:
      ru: Бра́тие, а́ще кто в ва́с заблу́дит от пути́ и́стины, и обрати́т кто́ его́,
      cn: 弟兄们，如果你们中间有人迷失真理之道，而有人使他回转，
  - type: paragraph
    text:
      ru: Иак.5:20.пусть тот знает, что обративший грешника от ложного пути его спасет душу от смерти и покроет множество грехов.
      cn: (雅各书 5:20) 這人該知道，叫一個罪人從走差的路上轉回便是救一個元魂不死，並且隠藏許多的罪。
  - type: paragraph
    text:
      ru: да ве́сть, я́ко обрати́вый грешника от заблужде́ния пути́ его, спасе́т ду́шу от сме́рти и покры́ет мно́жество грехо́в.
      cn: 须知，凡使罪人回转其迷途的，必拯救灵魂脱离死亡，并遮盖许多罪。
  - type: paragraph
    text:
      ru: 'То же говорит и Иеремия:«а́ще изведе́ши честно́е от недосто́йного, я́ко уста́ моя́ бу́деши»(«и если извлечешь драгоценное из ничтожного, то будешь как Мои уста») (Иер. 15, 19): ибо всякий, возвещающий слова Божии, бывает устами Божиими. Ибо что говорит?«Не вы будете говорить, но Дух Отца вашего будет говорить в вас»(Мф. 10, 20). Поэтому-то через Давида и воспрещает Он грешнику поведать оправдания его (Пс. 49, 16).'
      cn: 耶利米也如此说：「你若从卑贱中取出宝贵的，就必如同我的口一样」（耶利米书 15:19）：因为凡宣扬上帝话语的人，就是上帝的口。因为祂说什么呢？「因为不是你们说的，而是你们父的圣灵在你们里面说的」（马太福音 10:20）。因此，祂也藉着大卫禁止罪人宣说祂的公义（诗篇 49:16）。
footnotes:
  '[1]':
    ru: Изречение это принадлежит Эпикуру, который положил его в основание для отрицания Промысла Божия. Но блж. Феофилакт понял его в добром смысле и потому употребил здесь для объяснения мысли святого апостола.
    cn: 这箴言属于埃庇鸠鲁，他将其作为否定上帝护理的基础。但福哉者提奥菲拉科特以善意理解其，因此在此处使用它，用于解释圣使徒的思想。
  '[2]':
    ru: Разумеется, вероятно, преподобный Арсений (см. История православного монашества на Воcтоке. Ч. 2. М., 1854. С. 134).
    cn: 当然，很可能是圣阿谢尼（参阅《东方正教修道史》第二卷，莫斯科，1854年，第134页）。
  '[3]':
    ru: Латинский переводчик толкования блж. Феофилакта предполагает, что отселе до стиха 21 сделана вставка каким-нибудь тонким грамматиком, и находит это место довольно темным.
    cn: 拉丁译者认为，圣奥赫里德的狄奥菲拉克的释经中，从此处到第21节，是由某个高明的语法学家插入的，并认为此段相当晦涩。
  '[4]':
    ru: Приписывая такое значение слову «вера», блж. Феофилакт почитал корнем его, вероятно, слово, которое значит «смотреть», «рассматривать», «созерцать» и прочее. Но иные, и притом очень многие, в понимании слова «вера» следуют фракиянам, от которых, говорит святительГригорий Богослов, перешло к грекам-язычникам служение богам, «как может удостоверить в этом самое слово «вера» (св. Григорий Богослов, Слово 4. – Творения. Ч. 1. М., 1851. С. 163).
    cn: 圣奥赫里德的狄奥菲拉克在将这样的意义归于「信心」一词时，他或许认为其词根源自一个意为「观看」、「审察」、「默观」等等的词语。然而，另有一些人，而且为数众多，在理解「信心」一词时遵循色雷斯人的观点。圣师格里高利神学家（Gregory the Theologian）说，异教徒的希腊人对诸神的侍奉正是由色雷斯人那里传承而来，「正如『信心』一词本身即可证实这一点」（圣格里高利神学家，《讲道 4》。——《著作集》。第1卷。莫斯科，1851年。第163页）。
  '[5]':
    ru: 'Здесь чего-то недостает в подлиннике, а именно: речи о том, чем отличается скромность от смирения.'
    cn: 此处原文本中有所缺失，即关于谦逊与谦卑有何区别的论述。
