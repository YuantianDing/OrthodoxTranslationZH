title:
  ru: Толкование на 3-е послание святого апостола Иоанна
  cn: 约翰三书注释
languages:
- ru
- cn
authors:
- ru: Блаженный Феофилакт Бо́лгарский, архиепископ Охридский
  cn: 圣奥赫里德的狄奥菲拉克
document:
- type: heading1
  text:
    ru: Феофилакт БолгарскийТолкование на 3-е послание святого апостола Иоанна
    cn: 圣奥赫里德的狄奥菲拉克《约翰三书注释》
  children:
  - type: heading2
    text:
      ru: Оглавление послания
      cn: 书信目录
    children:
    - type: paragraph
      text:
        ru: Молитва о преуспевании Гаия и благодарность ему за принятие странствующих братьев ради Христа. – Здесь же о неблагородстве  Диотрефа и ненависти его к братьям. – Прекрасный отзыв о Димитрии. – О том, что апостол сам вскоре придет к ним на пользу.
        cn: '祷告加约的兴盛，并感谢他为基督的缘故接待客旅的弟兄们。

          ——亦论及丢特腓的卑劣行径以及他对弟兄们的憎恨。

          ——关于底米丢的极好评价。

          ——论及使徒本人不久将亲自去他们那里，对他们有益。'
  - type: heading2
    text:
      ru: Содержание послания
      cn: 书信内容
    children:
    - type: paragraph
      text:
        ru: Апостол пишет о странноприимстве. Во-первых, он одобряет Гаия, о котором все свидетельствуют, что он с любовью принимает странников; убеждает его и впредь пребывать в таком же расположении, отпускать и принимать братьев; снова хвалит его за усердие, и не одобряет Диотрефа за то, что он сам ничего не делает бедным и другим запрещает делать, и много злословит; говорит, что такие люди далеки от истины и не знают Бога; упоминает еще о Димитрии, о котором отзывается с отличной похвалою.
        cn: 使徒论及接待客旅一事。首先，他称赞该犹，众人为他作证说他以爱心接待客旅；劝勉他今后也保持同样的心志，送行并接待弟兄们；又称赞他的殷勤，并且不称许丢特腓，因他自己不为穷人做任何事，又禁止别人去做，并且多方说人坏话；说这样的人远离真理，并且不认识上帝；还提到低米丢，众人都对他有极佳的称赞。
    - type: paragraph
      text:
        ru: 3Ин.1:1.Старец – возлюбленному Гаию, которого я люблю по истине.
        cn: 约翰三书 1:1.长老致那蒙爱的该犹，就是我按真理所爱的。
    - type: paragraph
      text:
        ru: 3Ин.1:2.Возлюбленный! молюсь, чтобы ты здравствовал и преуспевал во всем, как преуспевает душа твоя.
        cn: (约翰三书 1:2) 亲爱的！我祷告，愿你身体健壮，凡事兴盛，正如你灵魂的兴盛一样。
    - type: paragraph
      text:
        ru: По истине любит тот, кто любит по Господе. Апостол пишет это послание с целью воздать похвалу некоторым братьям. Пишет к Гаию, о котором свидетельствует, что он принимает много странников, и за то воздает ему великую похвалу. Ибо«кто делает добро, тот, – говорит, –от Бога»(3Ин.1:11). Еще более поощряет его тем, что не одобряет Диотрефа, который не хочет так поступать. Хвалит Димитрия, который поступает так же, как Гаий, и дает верное свидетельство о его добродетели. «Как преуспевает душа твоя»; а преуспевает она в жизни по Евангелию.
        cn: 真正爱的人，是在上主里爱的人。使徒写这封书信，目的是为了称赞几位弟兄。他写给该犹，并为他作见证，说他接待了许多客旅，为此大大称赞他。因为「行善的，是出于上帝」（约翰三书 1:11）。他更进一步鼓励该犹，通过不赞同不愿这样行的丢特腓。他称赞底米丢，说他行事与该犹一样，并为他的美德作了忠实的见证。「你的灵魂兴盛」；而它兴盛在于依照福音而生活。
    - type: paragraph
      text:
        ru: 3Ин.1:3.Ибо я весьма обрадовался, когда пришли братия и засвидетельствовали о твоей верности, как ты ходишь в истине.
        cn: (约翰三书 1:3) 因为我甚是喜乐，当弟兄们来的时候，并且为你的忠信作了见证，正如你行在真理中一样。
    - type: paragraph
      text:
        ru: В истине ходит тот, кто ходит по простоте евангельской. Под словом «ходить» нужно разуметь не передвижение стоп, ибо такое переступательное с места на место движение свойственно всякому животному, имеющему ноги, но стройное и целомудренное преспеяние в душевных стремлениях, которого достигают немногие и из тех, кои имеют разум.
        cn: 依照福音的纯朴而行的人，方是行走在真理之中。对于「行走」一词，我们不应理解为双脚的移动，因为这种从一处到另一处的步进式移动乃是所有有腿动物所共有的；而应理解为在灵魂渴慕中和谐而贞洁的进益，能达到此境界的人不多，即便是在那些拥有理性的人之中，也是如此。
    - type: paragraph
      text:
        ru: 3Ин.1:4.Для меня нет большей радости, как слышать, что дети мои ходят в истине.
        cn: (约翰三书 1:4) 我没有比听见我的儿女们行在真理中更大的喜乐了。
    - type: paragraph
      text:
        ru: 3Ин.1:5.Возлюбленный! ты как верный поступаешь в том, что делаешь для братьев и для странников.
        cn: (约翰三书 1:5) 亲爱的！你为你众弟兄和为客旅所行的，是忠信的。
    - type: paragraph
      text:
        ru: 3Ин.1:6.Они засвидетельствовали перед церковью о твоей любви. Ты хорошо поступишь, если отпустишь их, как должно ради Бога,
        cn: (约翰三书 1:6) 他们在教会面前见证了你的爱。你若按着合乎上帝的方式送他们启程，就做得好。
    - type: paragraph
      text:
        ru: 3Ин.1:7.ибо они ради имени Его пошли, не взяв ничего от язычников.
        cn: (约翰三书 1:7) 因为他们为了祂的名而出，没有向外邦人收取任何东西。
    - type: paragraph
      text:
        ru: Выражениеμειζοτέρανне согласно с изяществом греческого языка; ибо к сравнительной степени (μείζονα) прибавлен еще один суффикс сравнительной степени (-τερ).
        cn: 表达 μειζοτέραν 不符合希腊语的优雅；因为在比较级 (μείζονα) 上又添加了一个比较级后缀 (-τερ)。
    - type: paragraph
      text:
        ru: 3Ин.1:8.Итак мы должны принимать таковых, чтобы сделаться споспешниками истине.
        cn: (约翰三书 1:8) 所以，我们应当接待这样的人，好使我们成为真理的协力者。
    - type: paragraph
      text:
        ru: 3Ин.1:9.Я писал церкви; но любящий первенствовать у них Диотреф не принимает нас.
        cn: (约翰三书 1:9) 我曾写信给教会；但那在他们中间爱居首位的丢特腓不接待我们。
    - type: paragraph
      text:
        ru: «Принимать» употреблено вместо «занимать», «захватывать». Этим апостол научает нас не выжидать прихода к нам нуждающихся, но самим бежать к ним навстречу и упрашивать их к себе, как поступали Авраам и Лот (Быт. 18,2–3, 19:1–2).
        cn: «接受» 被用来代替 «占据», «夺取»。借此，使徒教导我们不要坐等有需要的人来到我们这里，而是要我们自己跑上前去迎接他们，并恳请他们到自己家里，正如亚伯拉罕和罗得所做的 (创世记 18:2-3，19:1-2)。
    - type: paragraph
      text:
        ru: 3Ин.1:10.Посему, если я приду, то напомню о делах,  которые он делает, понося нас злыми словами, и не довольствуясь тем,  и сам не принимает братьев, и запрещает желающим, и изгоняет из церкви.
        cn: (约翰三书 1:10) 因此，我若来，就必追究他所行的事，就是他用恶言毁谤我们；还不以此为满足，他自己不接待弟兄，又禁止那些愿意的，并将他们逐出教会。
    - type: paragraph
      text:
        ru: 'Если запрещено воздавать злом за зло (Рим. 12,17), то как объяснить настоящую угрозу апостола? Отвечаем: заповедь говорит о невоздаянии злом за зло тому, кто грешит против нас, а когда грех против нас причиняет вред и вере, то совершающего такой грех должно наказывать, как и Павел навел зло на Елиму, совращавшего с путей Господних (Деян. 13,8–11).'
        cn: 如果禁止以恶报恶（罗马书 12:17），那么如何解释使徒这真正的威胁呢？回答是：诫命是指不以恶报恶那些冒犯我们之人，而当冒犯我们的罪也损害了信仰之时，就应当惩罚犯下此等罪行之人，正如保罗对以利马降下恶报，因他曾引诱人偏离上主的道（使徒行传 13:8-11）。
    - type: paragraph
      text:
        ru: 3Ин.1:11.Возлюбленный! не подражай злу, но добру. Кто делает добро, тот от Бога; а делающий зло не видел Бога.
        cn: 约翰三书 1:11. 亲爱的！不要效法恶，却要效法善。行善的，是出于上帝的；然而作恶的，没有见过上帝。
    - type: paragraph
      text:
        ru: Так как нет ничего общего у света с тьмой, никакого согласия между Христом и Велиаром (2Кор. 6,14–15); то просвещенный познанием Христа не должен чрез подражание нечестивым сливаться с тьмой, то есть с гнусными делами их. Ибо как тот, кто делает добро, от Бога и усовершил мысленное око свое светом познания Его, почему весь стал светом, видит истинный свет, Бога, и бывает для других светилом в мире, содержащим слово жизни (Фил. 2,16), так и тот, кто делает злое, ходя во тьме, ни сам не может видеть Бога, то есть делать угодное Богу, ни для других быть руководителем, но ненавистен и отвратителен для всех.
        cn: 因为光与黑暗毫无共通之处，基督与彼列之间也毫无相合之处（哥林多后书 6:14-15）；所以，被基督的认识所光照的人，不应借由模仿不敬虔之人而与黑暗，亦即与他们可憎的行径混为一谈。因为正如那行善之人，是来自上帝并已用祂认识的光完善了他的心眼，所以他全然成了光，能看见那真正的光，即上帝，并成为世上的光，为他人照耀，持守生命之道（腓立比书 2:16），照样，那作恶之人，行在黑暗中，他自己既不能看见上帝，亦即行上帝所喜悦之事，也不能为他人做引导，反而为众人所憎恶与厌弃。
    - type: paragraph
      text:
        ru: 3Ин.1:12.О Димитрии засвидетельствовано всеми и самою истиною; свидетельствуем также и мы, и вы знаете, что свидетельство наше истинно.
        cn: 约翰三书 1:12. 关于迪米特里，人人为他作证，真理本身也为他作证；我们也为他作证；你们也知道，我们的见证是真实的。
    - type: paragraph
      text:
        ru: 3Ин.1:13.Многое имел я писать; но не хочу писать к тебе чернилами и тростью,
        cn: (约翰三书 1:13)我本有许多事要写给你；但我不想用墨水和笔写给你，
    - type: paragraph
      text:
        ru: 3Ин.1:14.а надеюсь скоро увидеть тебя и поговорить устами к устам.
        cn: (约翰三书 1:14) 我希望很快见到你，并面对面交谈。
    - type: paragraph
      text:
        ru: 3Ин.1:15.Мир тебе. Приветствуют тебя друзья; приветствуй друзей поименно. Аминь.
        cn: (约翰三书 1:15) 愿你平安。朋友们问候你；你要按名问候众朋友。阿们。
    - type: paragraph
      text:
        ru: «Всеми», то есть имеющими истину, «и самою истиною», то есть на словах и на деле; ибо хотя о добродетели иных и свидетельствуют, но свидетельство оказывается ложным, потому что словам не соответствует действительность. Если же кто под «всеми», по обширности значения слова «весь», будет разуметь верных и неверных, то и его понимание не несправедливо; ибо апостол Павел заповедует всем верным:«не подавайте соблазна ни Иудеям, ни Еллинам, ни церкви Божией, так, как и я угождаю всем во всем»(1Кор. 10,32–33).
        cn: 「所有人」，即拥有真理的人，「和真理本身」，即在言语和行为上；因为虽然有人为他人的美德作证，但这见证却是虚假的，因为言语与实际不符。如果有人鉴于「所有」一词广阔的含义，将「所有人」理解为信者与非信者，那么他的理解也并非不公正；因为使徒保罗吩咐所有信者：「不叫人跌倒，无论是犹太人，是希腊人，是上帝的教会，就如我凡事都叫众人喜欢一样」(哥林多前书 10:32-33)。
    - type: paragraph
      text:
        ru: Конец третьего послания св. ап. Иоанна.
        cn: 圣使徒约翰第三书信完
footnotes: {}
