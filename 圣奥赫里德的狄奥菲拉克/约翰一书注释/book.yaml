  - type: paragraph
    text:
      ru: Оглавление первого послания святого апостола Иоанна
      cn: 圣使徒约翰约翰一书纲要
  - type: paragraph
    text:
      ru: Евангельское богословие о Христе; здесь же об исповеди и хранении себя от грехов и о том, что познание Бога подтверждается соблюдением заповедей. – О любви, без которой нет благочестия, здесь же о благодати, свойственной каждому возрасту, и об оставлении любви к миру. – О лжебратиях, отрицающих Бога, о том, что благочестие христианское непременно исповедует Отца, ибо прославление Отца условливается признанием Сына за Бога; здесь же о божественном и духовном даре в освящении, в надежде на познание Бога, и о том, что всякий, пребывающий во Христе, не согрешает, ибо кто грешит, тот от диавола. – О любви к ближнему и о склонности к вспомоществованию; здесь же о доброй совести, подаваемой верой в Иисуса Христа, о различении духов чрез исповедание вочеловечения Господня. – О необходимости братской любви для богопочтения. – О Божественности Сына в славе Отца, и о победе над диаволом чрез веру в Иисуса Христа для жизни вечной. – О вспоможении согрешающему брату молитвой за него, и о том, что не должно грешить; здесь же и об удалении от служения бесам.
      cn: 福音神学论基督；此外，论告解和保守自己脱离罪，并论对上帝的认识借由遵守诫命得以证实。– 论爱，没有爱则无虔敬；此外，论适合于每个年龄的恩典，以及论离弃对世界的爱。– 论否定上帝的假弟兄；论基督徒的虔敬必然宣认圣父，因为对圣父的荣耀取决于承认圣子为上帝；此外，论在成圣中、在认识上帝的希望中的神圣与属灵的恩赐，并论凡是住在基督里的就不犯罪，因为凡犯罪的，就是出于魔鬼。– 论爱近人，并论乐于助人；此外，论借由信靠耶稣基督而赐予的美好良心，论借由宣认主的道成肉身而辨别诸灵。– 论弟兄之爱对于事奉上帝的必要性。– 论圣子在圣父荣耀中的神性，并论借由信靠耶稣基督为得永生而胜过魔鬼。– 论借由为犯罪的弟兄祈祷而帮助他，并论不应当犯罪；此外，并论远离事奉邪灵。
  - type: paragraph
    text:
      ru: Содержание первого послания святого апостола Иоанна
      cn: 圣使徒约翰第一书信的内容
  - type: paragraph
    text:
      ru: Тот же Иоанн, который написал Евангелие, писал и это послание, с целью утвердить тех, которые уже уверовали в Господа. И как в Евангелии, так и в настоящем послании прежде всего богословствует о Слове, показывает, что Оно всегда в Боге, и учит, что Отец есть свет, чтобы мы и отсюда познали, что Слово есть как бы отблеск Его. Продолжая богословствовать, объясняет, что таинство нашего спасения не новость, но что оно от начала и всегда было, а теперь только открылось в Господе, Который есть вечная жизнь и истинный Бог. Выставляет и причину Его пришествия и явления, говоря, что Он явился разрушить дела диавола, освободить нас от смерти и научить нас познанию Отца и Его Сына, Господа нашего Иисуса Христа. Апостол пишет людям всякого возраста, детям, юношам, старцам, потому что познан Бог, а сила диавола преодолена и смерть упразднена. Чрез все послание поучает о любви, заповедует, чтобы мы любили друг друга, и долг взаимной любви основывает на том, что и Христос возлюбил нас. Объясняет различие между страхом и любовью, между детьми Божиими и детьми диавола, между грехом смертным и не смертным, и между духами. Раздельно объясняет, какой дух от Бога, и какой дух заблуждения; когда мы признаемся детьми Божиими, и когда детьми диавола; о каком грехе мы должны молиться за согрешающих и о каком не должны молиться. Говорит, что кто не любит ближнего, тот не достоин звания и не может называться Христовым. Показывает, что Сын един с Отцом и что отрекающийся от Сына не имеет и Отца. В этом же послании рассуждает, что антихристу свойственно говорить, будто Иисус Христос не есть истинный Сын, чтобы показать, что Он лжет, называя Самого Себя Сыном, однако не будучи Им поистине. Чрез все послание убеждает верующих в Господа не унывать от того, что мир ненавидит их, а лучше радоваться, потому что ненависть со стороны мира показывает, что верующие отступили от самого мира и принадлежат уже к гражданству небесному. В конце послания опять напоминает, что Сын Божий есть вечная Жизнь и истинный Бог, и что мы должны Ему служить, а от идолов хранить себя.
      cn: 同一位约翰，即写了福音书的使徒，也写了这封书信，旨在坚固那些已经信靠上主的人。正如在福音书中，也在这封书信中，他首先阐述圣道的神学奥秘，表明圣道常在上帝之中，并教导说父是光，以便我们由此也认识到圣道是祂的反照。他继续阐述神学奥秘，解释说我们救赎的奥秘并非新事，而是从起初就已存在，如今只是在上主里面显明，这位上主是永恒的生命和真上帝。他也揭示了祂降临和显现的原因，说祂的显现是为了摧毁魔鬼的作为，使我们脱离死亡，并教导我们认识父和祂的儿子，我们的上主耶稣基督。使徒向各个年龄层的人写作：孩子、青年和老年人，因为上帝已被认识，魔鬼的权势已被战胜，死亡已被废除。整封书信都教导关于爱，吩咐我们彼此相爱，并将这种彼此相爱的义务建立在基督爱了我们这一事实之上。他解释了恐惧与爱之间的区别；上帝的儿女与魔鬼的儿女之间的区别；致死之罪与不致死之罪之间的区别；以及各种灵之间的区别。他分别解释了哪种灵是出于上帝，哪种灵是出于谬误；我们何时被承认为上帝的儿女，何时被承认为魔鬼的儿女；针对何种罪，我们应为犯罪者祷告，针对何种罪则不应祷告。他说凡不爱邻人者，便不配拥有此名号，也不能被称为基督徒。他表明圣子与圣父原为一体，凡否认圣子者，也无圣父。在这封书信中，他也论及敌基督的本性是宣称耶稣基督并非真儿子，以此表明祂（耶稣基督）在谎言，祂自称为圣子，却并非真正是圣子。整封书信都劝勉信靠上主的人，不要因世界憎恨他们而沮丧，倒要欢喜快乐，因为来自世界的憎恨表明信徒已与世界本身分离，且已属于天上的公民身份。在书信的末尾，他再次提醒，上帝之子是永恒的生命和真上帝，我们应当事奉祂，并远离偶像，保守自己。
- type: heading1
  text:
    ru: Феофилакт БолгарскийТолкование на 1-е послание святого апостола Иоанна
    cn: 圣奥赫里德的狄奥菲拉克《约翰一书注释》
  children: []
- type: heading1
  text:
    ru: Глава первая
    cn: 第一章
  children:
  - type: paragraph
    text:
      ru: 1Ин.1:1.О том, что было от начала, что мы слышали, что видели своими очами.
      cn: 约翰一书 1:1。论到那从起初就有的，我们所听见的，我们亲眼所看见的。
  - type: paragraph
    text:
      ru: Это он говорит и к иудеям, и к язычникам, которые порочат таинство спасения нашего как позднейшее. Апостол показывает, что оно и древнее, ибо оно от начала и современно представляемому в уме началу, или что оно древнее не только закона, но и самой видимой твари, ибо она имела начало, а оно было и прежде самого начала. Ибо что может кто-нибудь сказать о языческих таинствах, которые появились вчера и третьего дня? Они, сопровождаемые развратом, произошли поздно, тогда, когда уже в людях жила нечистота, которой разврат тот служит как бы верхом и памятником, и чрез которую мы из хорошего состояния дошли до самой темной ночи. Представляя величие нашего таинства в сравнительной его древности, апостол прибавляет, что оно есть еще и Жизнь, – Жизнь, не измеряемая сроком времени, но самобытная, как всегда сущая у Отца, как и в Евангелии сказано:«и Слово было у Бога»(Иоан. 1,1). Слово"было"означает не временное существование, но самобытное бытие известного предмета, начало и основание всего, что получило бытие, такое, без которого последнее и не могло бы прийти в бытие. Хотя и о каждом сотворенном существе говорится, что оно есть, например, есть ангел, есть небо, есть солнце, и прочее; но собственно и совершенно есть Один только Сын, при участии Которого все приходит в бытие. Посему и Павел говорит:«мы Им живем, и движемся, и существуем»(Деян. 17,28). Кто прежде слышал об этом из начального учения, тот переходит к видению Его, не телесно, но разумно, и не телесными глазами, но мысленными.«Осязали»сказано о Слове Жизни, сказавшем:«Я есмь жизнь»(Иоан. 14,6). Может быть, сказано так и о Слове, сущем в начале, потому что мы слышали от закона и пророков, что Оно придет. Когда Оно пришло явно с плотью, мы видели Его и осязали. Ибо Бога, как Он есть Сам в Себе,«не видел никто никогда»(Иоан. 1,18). И мы присоединились к явившемуся Слову не легкомысленно, но, как уже сказано, после осязания, то есть после изыскания в законе и пророках мы поверили явившемуся во плоти Слову. Мы увидели и осязали не то, чем Оно"было"(ибо«род Его кто изъяснит?»(Ис. 53,8)), но то, чем Оно"стало",  осязали и умственным прикосновением, и вместе чувственным, как, например, Фома сделал по воскресении. Ибо Он был Один и неразделен, Один и Тот же – зримый и невидимый, объемлемый и необъятный, неприкосновенный и осязаемый, вещающий как человек, и чудотворящий как Бог. Так говорим мы о Слове по причине теснейшего единения Бога с плотью.
      cn: '这是他向犹太人和外邦人所说的，因为他们亵渎我们救赎的奥秘，视之为晚近的。使徒指出，它也是古老的，因为它自始便有，并与意念中的开端同期。或者说，它不仅比律法古老，也比一切可见的受造物古老，因为受造物有其开端，而它甚至在开端之前便已存在。因为，对于那些昨天和前天才出现的外邦奥秘，一个人又能说些什么呢？它们伴随着堕落，出现得很晚，那时不洁已然居于人心，那堕落仿佛是其极致和纪念，借此我们从美好境况堕入至暗之夜。


        使徒借着我们奥秘的相对古老性来呈现其伟大，并补充道，它更是生命——是不受时间衡量的生命，却是自生自存的，如同那永恒存在于父那里，正如福音书所说：「道与上帝同在。」(约翰福音 1:1)。「是」这个词，指的不是时间性的存在，而是某一事物的自存本体，是凡已得存在之物的开端和基础，离开了它，后者便不能存在。尽管对于每一个受造物，我们都说它「是」（例如，有天使，有天，有太阳，等等）；但本质上且完全地「是」的，唯有圣子，万物都借着祂而得以存在。因此，保罗也说：「我们生活、行动、存留都在乎祂。」(使徒行传 17:28)。凡是先前从初步教导中听闻此事的，便能进而看见祂，不是身体上的，而是理智上的，不是用肉眼，而是用心眼。「触摸」这个词是针对生命之道说的，祂曾说：「我就是生命。」(约翰福音 14:6)。也许，这也是针对那在起初就存在的「道」说的，因为我们从律法和先知那里听闻祂要降临。当祂带着肉身显现时，我们看见了祂，也触摸了祂。因为上帝，就其本体而言，「从来没有人见过。」(约翰福音 1:18)。我们与那显现的道联合，并非轻率，而是如前所述，在触摸之后，也就是说，在律法和先知书中探求之后，我们才相信了那以肉身显现的道。我们所看见和触摸的，并非祂「本来所是」的（因为「祂的世代谁能述说？」(以赛亚书 53:8)），而是祂「所成为」的。我们以理智的触摸和感官的触摸一同触摸了祂，正如多马在复活后所做的那样。因为祂是独一且不可分割的，是同一位——既可见又不可见，既可被把握又不可被测度，既不可触碰又可被触摸，既如人般说话，又如上帝般行神迹。我们如此谈论道，是因为上帝与肉身之间最紧密的结合。'
  - type: paragraph
    text:
      ru: Что рассматривали и что осязали руки наши, о Слове жизни, –
      cn: 哦，生命之言，我们手所察看的，和所摸过的，——
  - type: paragraph
    text:
      ru: 1Ин.1:2.ибо жизнь явилась, и мы видели и свидетельствуем, и возвещаем вам сию вечную жизнь, которая была у Отца и явилась нам.
      cn: (约翰一书 1:2) 因为这生命已然显现，我们曾亲眼看见，并且为它作证，又向你们宣扬这永恒的生命；它原是与父同在的，并已向我们显现了。
  - type: paragraph
    text:
      ru: '«Рассматривали»– то же, что видели собственными глазами и удивлялись; ибоθεάσασθαιпроисходит отθαυμάζεινи значит: с удивлением смотреть.«Осязали»– то же, что исследовали. Связь речи такая: что было от начала, что мы слышали, и видели, и рассматривали своими глазами, и что осязали руки наши о Слове жизни, которая явилась, и которую мы видели, и свидетельствуем, и возвещаем вам, то есть вечную жизнь, которая есть у Отца и явилась нам; итак, что мы видели, то и возвещаем вам,'
      cn: 「考察」——意即亲眼所见并为此惊奇；因为 θεάσασθαι 源自 θαυμάζειν，其意为：以惊奇之心观看。「触摸」——意即探究。此段言语的关联在于：那从起初就有的，我们所听见的，我们亲眼所看见并考察的，以及我们双手所触摸的关于生命之道（它已显现，我们已看见它，并为此作见证，且向你们传扬，即那在父那里并已向我们显现的永生）；所以，我们所看见的，也就向你们传扬。
  - type: paragraph
    text:
      ru: Апостол возвестил не так, как мы, во-первых, для краткости речи, потом из неуважения к эллинскому пустословию, далее, чтобы показать, что спасение наше не в словах, но в делах, наконец, чтобы сделать нас внимательнейшими, дабы мы, находя предлагаемое удобно и как бы само собой, не рассеялись. Сверх сего Богослов хотел неясностью прикрыть то, что выше нечистого слуха и чем небезопасно огласить его;«ибо давать святыню псам и бросать жемчуг пред свиньями»(Матф. 7,6) несогласно со здравым смыслом.
      cn: 使徒的宣告不像我们这样，首先是为了言语的精炼，其次是出于对希腊空谈的不屑，再次是为了表明我们的救恩不在于言语，而在于行为，最后，是为了使我们更加警醒，以免我们因发现所呈奉的教导过于轻易，仿佛唾手可得，便分散了心神。此外，这位神学家意欲以晦涩之言，掩盖那些远超不洁之耳所能听闻，且将其公之于众实属不妥的事物；因为「不要把圣物给狗，也不要把你们的珍珠丢在猪前」（马太福音 7:6），这有悖常理。
  - type: paragraph
    text:
      ru: 1Ин.1:3.О том, что мы видели и слышали, возвещаем вам.
      cn: （约翰一书 1:3）论我们所看见、所听见的，我们向你们宣扬。
  - type: paragraph
    text:
      ru: Что же именно? То, что Жизнь, будучи вечной, явилась нам, и мы были очевидцами ее и до креста и после воскресения. Ибо Один и Тот же и пригвожден был плотью ко кресту и воскрес тою же плотью. А какая вам, говорит, польза от того, что мы возвещаем вам это? Та, что как чрез слово мы принимаем вас в общники виденного и слышанного нами, так мы имеем вас общниками и Отца и Сына Его Иисуса Христа, а получив это, мы как прилепившиеся к Богу можем исполниться радостью.
      cn: 究竟是什么呢？就是那永恒的生命向我们显现了，并且我们亲眼目睹了它，无论是在受难之前还是复活之后。因为是同一位，祂曾被肉身钉在十字架上，也以同样的肉身复活了。他说，我们向你们宣扬这些，对你们有什么益处呢？就是借着这道，我们接纳你们成为我们所见所闻之事的分享者，同样，我们也使你们成为父和祂的儿子耶稣基督的分享者；而当我们获得了这些之后，我们这些与上帝紧密联合的人，就能够充满喜乐。
  - type: paragraph
    text:
      ru: '1Ин.1:4.Чтобы и вы имели общение с нами: а наше общение – с Отцем и Сыном Его, Иисусом Христом. И сие пишем вам, чтобы радость ваша была совершенна.'
      cn: (约翰一书 1:4) 使你们也能与我们相交：而我们所相交的，是与父并与祂的子，耶稣基督。我们写这些给你们，是要叫你们的喜乐得以完全。
  - type: paragraph
    text:
      ru: Ибо когда мы в общении с вами, то испытываем величайшую приятность, подобную той, какую радующийся сеятель доставляет жнецам при раздаче платы, когда и они радуются тому, что их трудами наслаждаются другие.
      cn: 因为当我们与你们交通时，我们就感受到至高的愉悦，犹如那欢喜的撒种者在分发工钱时带给收割者们的愉悦一样，那时他们也因着他们的劳碌成果被他人享用而欢喜。
  - type: paragraph
    text:
      ru: '1Ин.1:5.И вот благовестие, которое мы слышали от Него и возвещаем вам: Бог есть свет, и нет в Нем никакой тьмы.'
      cn: (约翰一书 1:5) 这就是我们从祂那里听见的，并传给你们的福音：上帝是光，在祂里面毫无黑暗。
  - type: paragraph
    text:
      ru: 1Ин.1:6.Если мы говорим, что имеем общение с Ним, а ходим во тьме, то мы лжем и не поступаем по истине;
      cn: 约翰一书 1:6. 如果我们说我们与祂相通，却在黑暗中行走，那么我们就是说谎，不行真理；
  - type: paragraph
    text:
      ru: 1Ин.1:7.если же ходим во свете, подобно как Он во свете, то имеем общение друг с другом, и Кровь Иисуса Христа, Сына Его, очищает нас от всякого греха.
      cn: (约翰一书 1:7) 如果我们行在光中，如同祂在光中，我们就彼此相交，并且祂儿子耶稣基督的宝血洗净我们一切的罪。
  - type: paragraph
    text:
      ru: 1Ин.1:8.Если говорим, что не имеем греха, – обманываем самих себя, и истины нет в нас.
      cn: (约翰一书 1:8) 如果我们说自己没有罪，就是欺骗自己，真理就不在我们里面了。
  - type: paragraph
    text:
      ru: 'Апостол опять возвращается к прежней речи, и объясняет, какое он слышал благовестие, именно следующее: Бог есть свет, и тьмы в Нем нет. От кого это слышал он? От Самого Христа, Который говорил:«Я свет миру»(Иоан. 8,12), и еще:«Я свет пришел в мир»(Иоан. 12,46). Итак, Он есть свет, и тьмы в Нем нет, но свет духовный, привлекающий очи души к зрению Его, а от всего вещественного отвращающий и возбуждающий стремление к Нему одному с самой сильной любовью. Под «тьмой» разумеет или незнание, или грех; ибо в Боге нет ни незнания, ни греха, потому что незнание и грех имеют место в веществе и в нашем расположении. Если же сказано негде:«мрак сделал покровом Своим»(Псал. 17,12); то сказано, что"сделал"тьму, а не"есть"тьма, как сказано"есть свет". Ибо полагающий и полагаемое не одно и то же. Итак, здесь"тьма"означает наше незнание о Боге, по причине Его непостижимости, а это незнание наше есть, а не Божие. Ибо иному придается нечто такое, чего нет в нем, не для него самого, но для кого-нибудь из имеющих отношение к нему. А что апостол называет тьмой грех, это видно из евангельского изречения его:«и свет во тьме светит, и тьма не объяла его»(Иоан. 1,5), где тьмой он называет нашу греховную природу, которая по своей склонности к падению уступает завистнику нашему диаволу, увлекающему ко греху. Итак, свет, соединившийся с нашим, существом, весьма удобоуловимым, стал совершенно неуловим для искусителя. Ибо«Он не сделал греха»(Ис. 53,9). Итак, когда мы принимаем вас в общники с Богом, Который есть свет, а в этом свете, как показано, не может быть тьмы; то и мы, как общники света, не должны принимать в себя тьму, чтобы не понести наказания за ложь и вместе с ложью не быть отторгнутыми от общения со светом. Посему, держась общения друг с другом, то есть с нами и со светом, мы должны поставить себя непобедимыми для греха. Но как это будет, когда мы прежде погрязли уже во многих грехах? Ибо никто, любящий истину и старающийся быть истинным, не осмелится сказать, что он безгрешен. Итак, если кем овладевает это опасение, тот пусть не унывает: ибо кто вступил в общение с Сыном Его Иисусом Христом, тот очищен Кровью Его, пролитой за нас. Примечай, что по причине теснейшего единения называет Его Сыном Отца и по тому, что воспринято Им от нас; ибо кровь, без сомнения, принадлежит нашему естеству, а не Богу. И Несторий, очевидно, безумен и нечестив, когда отделяет плоть от Сына и не позволяет называть Матерь Его Богородицею. Нужно знать также, что вся мысль этого изречения ниспровергает и хулу иудеев, которые говорили:«мы знаем, что Человек Тот грешник»(Иоан. 9,24). Итак, говорит, если мы творим дела света, то мы в общении с Ним, а если не делаем их, то мы чужды Ему. И как же Он не свет истинный и не безгрешен совершенно, когда«к злодеям причтен был»за вас (Ис. 53,12)? Итак, если мы, кричавшие некогда:«кровь Его на нас и на детях наших»(Матф. 27,25), бесстыдно скажем, что мы не согрешили; то мы«обманываем самих себя», как будто распять Христа не грех. Апостол не сказал: мы лжем, но: обманываем себя, потому что обман вне истины. Если же сознаем грех и исповедаем, Он простит нам.'
      cn: '使徒再次回到先前的言论，并解释了他所听到的福音，即如下所述：上帝是光，在祂里面没有黑暗。他从谁那里听到的呢？从基督自己那里，祂曾说：「我就是世界的光」（约翰福音 8:12），又说：「我到世上来，乃是光」（约翰福音 12:46）。因此，祂是光，在祂里面没有黑暗，却是属灵的光，吸引灵魂的眼睛看见祂，并使之远离一切物质之物，激发起以最强烈爱慕单单归向祂的渴望。「黑暗」所指的是无知或罪；因为在上帝里面，既没有无知，也没有罪，因为无知和罪存在于物质和我们的性情之中。倘若某处经文说：「祂以幽暗为藏身之处」（诗篇 17:12），那是说祂「制造」了黑暗，而不是「是」黑暗，正如经文说祂「是光」。因为设定者与被设定者并非同一。因此，此处「黑暗」意味着我们因上帝的不可测度而对祂的无知，而这无知是我们自身的，并非属于上帝。因为有时会将某物归因于某主体，而该物并非存在于主体之中，此举并非为该主体本身，而是为了某个与该主体相关的人。而使徒将罪称为黑暗，这可见于祂的福音言语：「光照在黑暗里，黑暗却不接受光」（约翰福音 1:5），其中祂称黑暗为我们有罪的本性，这本性因其堕落的倾向而屈服于我们那嫉妒的仇敌魔鬼，被其引诱犯罪。因此，那与我们极易受诱的本性结合的光，对那试探者而言，变得完全无法捉摸。因为「祂没有犯过罪」（以赛亚书 53:9）。所以，当我们接纳你们与作为光的上帝同享交通，而在这光中，正如已然显示，不可能有黑暗；那么我们作为光的同伴，也不应当接纳黑暗进入自身，以免因谎言而受惩罚，并与谎言一同被隔绝于光的交通之外。


        因此，持守彼此间的交通，即与我们和光的交通，我们必须使自己对罪而言是不可战胜的。然而，当我们早已深陷诸多罪恶之中时，这又如何可能呢？因为任何热爱真理并努力成为真实的人，都不敢说自己是无罪的。因此，如果有人被这种担忧所占据，就不要沮丧：因为凡与祂的儿子耶稣基督建立交通的人，都已藉着为我们所流的祂的宝血得了洁净。请注意，因着最紧密的合一，经文称祂为天父的儿子，也是因为祂从我们所承接的；因为血无疑属于我们的人性，而非属于上帝。而聂斯脱利显然是疯狂而不敬虔的，因为他将肉身从上帝之子分离，并且不允许称祂的母亲为诞神女。还需知晓，此言论的整个思想也驳斥了犹太人的亵渎，他们曾说：「我们知道这个人是个罪人」（约翰福音 9:24）。所以，经文说，如果我们行光明的事，我们就在与祂的交通中；如果我们不行，我们就与祂疏离。当祂「被列在罪犯之中」是为了你们（以赛亚书 53:12）时，祂又怎会不是真光、不完全无罪呢？所以，如果我们，这些曾高喊：「祂的血归到我们和我们的子孙身上」（马太福音 27:25）的人，厚颜无耻地说我们没有犯罪；那么我们就是「自欺」，仿佛将基督钉十字架不是罪一样。使徒没有说：我们说谎，而是说：我们自欺，因为自欺是与真理背离的。如果我们认罪并悔改，祂就会赦免我们。'
  - type: paragraph
    text:
      ru: 1Ин.1:9.Если исповедуем грехи наши, то Он, будучи верен и праведен, простит нам грехи наши и очистит нас от всякой неправды.
      cn: (约翰一书 1:9) 如果我们认自己的罪，祂是信实的，是公义的，必赦免我们的罪，并洁净我们脱离一切的不义。
  - type: paragraph
    text:
      ru: 1Ин.1:10.Если говорим, что мы не согрешили, то представляем Его лживым, и слова Его нет в нас.
      cn: (约翰一书 1:10) 如果我们说我们没有犯罪，就是使祂成为说谎的，祂的话就不在我们里面了。
  - type: paragraph
    text:
      ru: 'Апостол повторяет несколько раз свою речь, дабы чрез обильные и частые обличения представить им всю тяжесть преступления и преклонить их к исповеди. Сколь великое благо рождается от исповеди, видно из следующих слов:«говори ты»грехи свои,«чтобы оправдаться»(Ис. 43,26); а что для начинающего ученика учитель часто повторяет одно и то же, сначала кратко, потом пространнее, чтобы сообщить познание яснейшее, это дело обыкновенное. Бог, говорит апостол,"верен". Это то же, что истинен; ибо слово"верен"употребляется не о том только, кому вверяют что-нибудь, но и о том, кто сам весьма верен, кто собственной своею верностью может и других делать такими. В таком смысле Бог верен, а«праведен»Он в том смысле, что приходящих к Нему, как бы ни были они грешны, не прогоняет (Иоан. 6,37). Итак, тем, которые чрез покаяние прибегают ко святому крещению, Он, несомненно, прощает грехи, хотя бы они согрешили против Него и против других. Если, говорит, исповедуем, то получим соответствующее исповеди прощение. Если же бесстыдно скажем, что мы не согрешили, то совершим двоякое зло: покажем себя лжецами и изречем хулу на Бога. Ибо Он говорит чрез пророка:«воздают Мне злом за добро»(Псал. 34,12), и Сам лично:«если Я сказал худо, покажи, что худо; а если хорошо, что ты бьешь Меня?»(Иоан. 18,23). Если и при этом мы говорим, что не согрешили, то отвергаем Его слова, которые суть дух и жизнь; ибо сказано:«слова, которые говорю Я вам, суть дух и жизнь»(Иоан. 6,63).'
      cn: 使徒屡次重申他的话语，以便藉着丰沛而频繁的责备，向他们呈现罪行的全部沉重，并使他们悔改认罪。认罪所产生的福益是何等巨大，从以下经文可见一斑：「你要述说你的罪孽，使你可得称义。」（以赛亚书 43:26）；而对于初学之门徒，导师常屡次重复同一事物，先是简略，后则详尽，为要传授更清晰之知识，此乃常事。使徒说：「上帝是信实的。」这与「真实」之意相同；因为「信实」一词不仅指那受人托付之人，亦指那自身极其信实之人，凭借其自身之信实亦能使他人信实者。在此意义上，上帝是信实的；而祂「公义」之意则在于：凡到祂面前者，无论其罪孽如何深重，祂总不将他们弃绝（约翰福音 6:37）。是故，凡藉悔改而归向圣洗者，祂无疑赦免其罪，纵使他们得罪了祂以及他人。倘若我们认罪，祂说，就必得到与认罪相符之赦免。倘若我们恬不知耻地说我们未曾犯罪，便会犯下双重之恶：即：显明我们是说谎者，并对上帝出言亵渎。因祂藉着先知说：「他们以恶报善于我。」（诗篇 34:12），又祂亲身说：「我若说的不好，你可以指证那不好；我若说得好，你为什么打我呢？」（约翰福音 18:23）。即使在此情形下我们仍说我们未曾犯罪，便是弃绝祂的话语，这些话语是灵与生命；因为经上说：「我所对你们说的话，就是灵，就是生命。」（约翰福音 6:63）。
- type: heading1
  text:
    ru: Глава вторая
    cn: 第二章
  children:
  - type: paragraph
    text:
      ru: 1Ин.2:1.Дети мои! сие пишу вам, чтобы вы не согрешали; а если бы кто согрешил, то мы имеем ходатая пред Отцем, Иисуса Христа, праведника;
      cn: (约翰一书 2:1) 孩子们哪！我写这些给你们，为要叫你们不犯罪；若有人犯了罪，我们有一位代求者在父面前，就是耶稣基督，那义者。
  - type: paragraph
    text:
      ru: 1Ин.2:2.Он есть умилостивление за грехи наши, и не только за наши, но и за грехи всего мира.
      cn: (约翰一书 2:2) 他为我们的罪作了挽回祭，不但是为我们的罪，也是为全世界的罪。
  - type: paragraph
    text:
      ru: Апостол, зная, что природа наша непостоянна и греховна, что влечение к злу мы всегда носим в себе, что завистник диавол препятствует своими ковами спасению нашему, что посему и примирившиеся уже с Богом чрез исповедь, если живут невнимательно, не избегнут греха, внушает теперь, что если мы и пали после прощения грехов наших, то не должны отчаиваться. Ибо если обратимся, то можем и опять получить спасение чрез посредничество Господа Иисуса Христа, потому что Он, ходатайствуя о нас пред Отцом, умилостивит за грехи наши, и не только за наши, но и за грехи всего мира. Апостол сказал это потому, что писал иудеям, сказал для того, чтобы показать, что благотворность покаяния не ограничивается только ими одними, но простирается и на язычников, или что обещание это относится не к одним только современникам, но и ко всем людям последующих веков. Иисуса Христа он называет ходатаем за нас, умоляющим или уговаривающим Отца. Это уподобление Бога человеку употребляется с особенной целью, как и следующие слова:«Сын ничего не может творить Сам от Себя»(Иоан. 5,19). Последнее сказано для того, чтобы не сочли Его богопротивником. А что и Сын имеет власть отпускать грехи, это Он показал на примере расслабленного (Матф. 9,6). Также, когда дал ученикам власть отпускать грехи, ясно показал, что Он дает такое право самовластно. Но апостол, как мы сказали, говорит так теперь с особенной целью, именно – представить, что Сын имеет одно естество и одну силу со Отцом, и что действия Одного из трех пресвятых Лиц общи и прочим Лицам.
      cn: 使徒深知，我们的本性反复无常且有罪，我们内心常存向恶的倾向，嫉妒的魔鬼以其诡计阻碍我们的救恩，因此，即便已经借由告解与上帝和好之人，若生活疏忽大意，也无法避免罪恶，现今他劝勉我们，即便在罪过蒙赦免之后我们又跌倒了，也不应绝望。因为如果我们回转，就能再次借由我主耶稣基督的居间代求而获得救恩，因为祂在父面前为我们代求时，会为我们的罪过，甚至不仅仅是我们的罪过，也为全世界的罪过施行和解。使徒这样说，是因为他写信给犹太人，这样说，是为了表明悔改的益处不仅限于他们自己，也延及外邦人，或是说，这个应许不仅适用于当时的世代，也适用于所有后世的人。他称耶稣基督是为我们代求的代祷者，是恳求或说服父的那一位。这种将上帝比作人的做法有着特殊的意图，正如接下来的话：「子凭着自己不能做什么」(约翰福音 5:19)。后者这样说，是为了避免祂被视为与上帝为敌者。至于子也有赦罪的权柄，这是祂借由医治瘫痪病人所显示的（马太福音 9:6）。同样，当祂将赦罪的权柄赐给门徒时，清楚表明祂是凭着自己的权柄赐予这样的权利。但使徒，如我们所言，现今这样说有着特殊的意图，即是要阐明子与父拥有同一的性体和同一的能力，并且三位至圣位格中任何一位的行动，也是其他位格所共享的。
  - type: paragraph
    text:
      ru: 1Ин.2:3.А что мы познали Его, узнаем из того, что соблюдаем Его заповеди.
      cn: (约翰一书 2:3) 我们若遵守祂的诫命，就可知道我们认识祂。
  - type: paragraph
    text:
      ru: У блаженного сего мужа в обычае употреблять одинаковые слова для обозначения разных предметов, как например, в стихе:«в мире был, и мирпроизошел чрезНего, и мир Его не познал»(Иоан. 1,10). Так и теперь он употребил слово"знать"в разных значениях. Ибо словом знать выражается и знание чего-нибудь, и весьма тесное знакомство с кем-нибудь. Такое значение в словах:«познал Господь Своих»(2Тим. 2,19), и:«не знавшего греха Он сделал для нас жертвою за грех»(2Кор. 5,21).
      cn: 这位蒙福的人有个习惯，喜欢用相同的词语来指称不同的事物，比如在经文中：「祂在世界，世界也是藉着祂造的，世界却不认识祂」（约翰福音 1:10）。同样，他现在也用了「知道」这个词来表达不同的含义。因为「知道」这个词既可以表达对某事物的知晓，也可以表达与某人非常亲密的认识。这样的含义体现在话语中：「上主认识属祂的人」（提摩太后书 2:19），以及：「祂使那未曾知道罪的，替我们成为赎罪祭」（哥林多后书 5:21）。
  - type: paragraph
    text:
      ru: '1Ин.2:4.Кто говорит: «я познал Его», но заповедей Его не соблюдает, тот лжец, и нет в нем истины;'
      cn: (约翰一书 2:4) 凡说「我认识祂」，但却不遵守祂诫命的，这人是说谎的，真理就不在他里面；
  - type: paragraph
    text:
      ru: '1Ин.2:5.а кто соблюдает слово Его, в том истинно любовь Божия совершилась: из сего узнаем, что мы в Нем.'
      cn: (约翰一书 2:5) 凡遵守祂话语的，上帝的爱就在他里面确实成全了：由此我们得知，我们是在祂里面。
  - type: paragraph
    text:
      ru: И от противного подтверждает то же, употребляя самое полное доказательство.
      cn: 并且从反面确认了同样的道理，采用了最充分的证明。
  - type: paragraph
    text:
      ru: 1Ин.2:6.Кто говорит, что пребывает в Нем, тот должен поступать так, как Он поступал.
      cn: （约翰一书 2:6）凡说自己住在祂里面的，就当照祂所行的去行。
  - type: paragraph
    text:
      ru: Совершенная любовь, говорит, доказывается делами. Но как бывает, что иной по видимости правильно и точно соблюдает заповеди, а внутреннее его расположение нечисто, почему он далеко от Бога, то апостол и говорит, что присвоившийся Богу должен жить так, как требует близость к Богу.
      cn: 经上说，全备的爱由行为来证实。但有时会发生这样情况，有人表面上正确且精确地遵守诫命，但他内心的意向却不洁净，因此他远离上帝，所以使徒也说，与上帝联合的人，应当照着与上帝的亲密关系所要求的去生活。
  - type: paragraph
    text:
      ru: 1Ин.2:7.Возлюбленные! пишу вам не новую заповедь, но заповедь древнюю, которую вы имели от начала, заповедь древняя есть слово, которое вы слышали от начала.
      cn: (1约翰福音 2:7) 蒙爱者啊！我写给你们的不是一条新诫命，而是一条古老的诫命，就是你们从起初就有的；这古老的诫命就是你们从起初就听见的那话语。
  - type: paragraph
    text:
      ru: Начинает речь о любви к ближнему. Говорит, что близость или любовь к Богу прежде всего узнается из любви к ближнему. Ибо невозможно, чтобы освещенный познанием Бога и исполненный любви к Нему имел тьму ненависти к брату своему; потому что свет и тьма в одно и то же время в одном и том же предмете не могут быть вместе. Посему освещенный любовью к Богу и имеющий Бога и по отношению к брату имеет свет, который возжигается от любви к брату. И кто говорит, что он любит Бога, между тем ненавидит брата, тот находится в постоянной тьме, у того разумные очи всегда помрачены, потому что он утратил свет общения с Богом и с братом. Он не знает уже и того, что для него самого может быть полезно.
      cn: 展开论述爱邻如己。他说，亲近上帝或对上帝的爱首先从爱邻如己中得以知晓。因为不可能，一个被对上帝的认识所光照且充满对祂之爱的人，会对自己的弟兄心怀仇恨的黑暗；因为光明与黑暗不可能在同一时间、于同一个主体中同时存在。因此，被对上帝的爱所光照且拥有上帝的人，就对待弟兄而言也拥有光明，这光明是因爱弟兄而被点燃的。而凡是宣称他爱上帝，却同时憎恨自己弟兄的人，那人就深陷持续的黑暗中，他的心眼总是蒙蔽的，因为他丧失了与上帝和与弟兄交通的光明。他甚至已不明白什么对他自身是有益的。
  - type: paragraph
    text:
      ru: '1Ин.2:8.Но притом и новую заповедь пишу вам, что есть истинно и в Нем и в вас: потому что тьма проходит и истинный свет уже светит.'
      cn: (约翰一书 2:8) 然而，我给你们写一条新诫命，这乃是真实的，在祂里面，也在你们里面：因为黑暗正在消逝，真光已经照耀。
  - type: paragraph
    text:
      ru: 1Ин.2:9.Кто говорит, что он во свете, а ненавидит брата своего, тот еще во тьме.
      cn: (约翰一书 2:9) 凡说自己在光中，却恨自己的弟兄的，那人仍然在黑暗中。
  - type: paragraph
    text:
      ru: 1Ин.2:10.Кто любит брата своего, тот пребывает во свете, и нет в нем соблазна.
      cn: (约翰一书 2:10) 爱他弟兄的，就住在光中，在他心里没有绊脚石。
  - type: paragraph
    text:
      ru: 1Ин.2:11.А кто ненавидит брата своего, тот находится во тьме, и во тьме ходит, и не знает, куда идет, потому что тьма ослепила ему глаза.
      cn: (约翰一书 2:11) 凡憎恨自己弟兄的，他是在黑暗里，并在黑暗中行走，也不知道往哪里去，因为黑暗弄瞎了他的眼睛。
  - type: paragraph
    text:
      ru: Так как послание это соборное, писано обще ко всем, к иудеям и к язычникам, то по отношению к иудеям можно сказать, что апостол пишет им заповедь о любви не новую, а древнюю. Ибо и на скрижалях Моисеевых написано было:"люби", после Бога, и«ближнего своего, как самого себя»(Лев. 19,18). Но как, скажет иной, по отношению к язычникам апостол пишет о древней заповеди, когда нигде ничего такого у них не находится? Отвечаем. Закон о любви к ближним написан и у язычников. Как так? Он написан у них на скрижали сердца естественными помыслами. А что помыслы, насажденные в нас с природой, называются естественным законом, в этом может удостоверить апостол Павел, который говорит:«вижу иной закон, противоборствующий закону ума моего»(Рим. 7,23). Итак, и язычники приняли закон или заповедь древнюю, так как сама природа предписывает нам быть кроткими друг ко другу и ко всему сродному; вследствие сего человек есть животное общественное, а это невозможно без любви. В древних историях записано даже много свидетельств о людях, которые умирали за других, а это есть знак высочайшей любви, как объяснил Спаситель наш, говоря:«нет больше той любви, как если кто положит душу свою за друзей своих»(Иоан. 15,13). Поскольку же заповедь о любви к ближним дана была и иудеям и язычникам, то апостол и говорит, что при древней заповеди, которую вы слышали, о любви к ближнему, пишу вам еще новую заповедь, которая истинна и в Том, Кто присвоил вас Богу чрез общение с Ним, и в вас, которые вступили в общение с Ним; ибо Он говорит:«Я свет пришел в мир»(Иоан. 12,46), и истинный Свет, по слову Его, уже светит, а во свете нет тьмы. Пусть же светит истинный свет любви в истинном и нелицемерном расположении к братьям, и тьма ненависти пройдет, то есть исчезнет; ибо такое значение придает слову"проходит"и апостол Павел, когда говорит:«ибо проходит образ мира сего»(1Кор. 7,31).
      cn: 既然这封信是致全体的，是写给所有人，包括犹太人和外邦人的，那么对于犹太人而言，可以说使徒写给他们的爱之诫命并非新的，而是古老的。因为在摩西的石版上曾写着：「爱上帝之后，以及爱你的邻人如同你自己」（利未记 19:18）。但或许有人会问，对于外邦人而言，使徒怎会写古老的诫命呢？当他们那里什么也没有这样的记载时，这又如何解释呢？我们回答。爱邻人的律法也写在外邦人那里。这是怎么回事呢？它写在他们的心版上，凭借着自然的意念。至于那些与生俱来根植于我们之中的意念被称为自然律，使徒保罗可以为此作证，他说道：「我又看见我肢体中另有个律，和我的心智的律交战」（罗马书 7:23）。因此，外邦人也接受了古老的律法或诫命，因为本性本身就要求我们彼此温柔，对待一切同类；因此，人是群居的动物，而这没有爱是无法实现的。在古代史中，甚至记录了许多关于为他人而死的人的见证，而这是至高之爱的标志，正如我们的救主所解释的，祂说：「人为朋友舍命，爱没有比这更大的了」（约翰福音 15:13）。既然爱邻人的诫命已赐予犹太人和外邦人，使徒便说，除了你们所听到的那关于爱邻人的古老诫命之外，我还写给你们一条新的诫命，这诫命在那位藉着与祂相通使你们归属于上帝的祂身上是真实的，也在你们这些已与祂相通的人身上是真实的；因为祂说：「我到世上来，乃是光」（约翰福音 12:46），并且，按照祂的话语，真光已经照耀，而在光中没有黑暗。愿真爱的光在对弟兄真诚无伪的态度中照耀，仇恨的黑暗便会过去，也就是说，会消失；因为使徒保罗在谈到「过去」一词时，也赋予它这样的意义，他说道：「因为这世界的景象正在过去」（哥林多前书 7:31）。
  - type: paragraph
    text:
      ru: 1Ин.2:12.Пишу вам, дети, потому что прощены вам грехи ради имени Его.
      cn: (约翰一书 2:12) 我写给你们，小子们，因为你们的罪因祂的名蒙了赦免。
  - type: paragraph
    text:
      ru: 'Сказав, что пишет им новую заповедь, апостол обозначает и расположение тех, которые примут его послание; обозначает теми степенями, которые бывают при возрастании телесном. Ибо он знал, что не все примут слова его с одинаковым уважением и вниманием, но одни примут поверхностно, как дети, которым он и усвояет прощение грехов чрез веру в Иисуса Христа. Другие примут, как достигшие«в мужа совершенного, в меру полного возраста Христова»(Ефес. 4,13), так что могут быть для других отцами: таким приписывает познание Сущего от начала. Кто же это, как не Слово Божие, которое и в начале«было у Бога»(Иоан. 1,1)? Иные примут, как юноши: им, как цветущим и полным, приписывает честь победы над бесчестными страстями. Потом снова повторяет то же самое в другом порядке, применяя учительное слово свое к мере духовного возраста. Так как я, говорит, знаю, что примете вы послание мое к вам по различию возрастов, то необходимо и мне соразмерять учение свое с расположением возраста вашего и с одними из вас беседовать, как с детьми, познавшими Отца, то есть Бога; с другими, как с отцами, которые имеют познание большее, нежели дети, именно – познали не только то, что Он Отец, но и то, что Он от вечности и неизъясним, ибо Он был от начала: таковым нужно и совершеннейшее учение о Боге; с иными, как с юношами, сильными и способными к борьбе и подвигам. Воздавая последним славу победы, показывает, что им и речи нужны отважные и воинственные.'
      cn: '使徒说他给他们写的是一条新的诫命，借着身体成长所经历的阶段，他指明了那些接受他书信之人的心境。因为他知道并非所有人都以同等的敬意和专注接受他的话语，但有些人会像孩童一样肤浅地接受，他把借着信靠耶稣基督而来的罪的赦免也归于他们。另一些人则会像那些达到了「长大成人，达到基督丰满的成熟身量」（以弗所书 4:13）的人一样接受，以至于可以成为他人的父辈：这样的人被归予那从起初就有的知识。这不是别的，正是上帝的圣言，它在起初「与上帝同在」（约翰福音 1:1）。还有一些人则会像少年人一样接受：对他们这些充满活力、血气方刚的人，他归予他们战胜不体面情欲的荣耀。


        之后，他再次以不同的顺序重复同样的话，将他的教诲之言应用于属灵成长的程度。他说，既然我知道你们会根据年龄差异来接受我给你们的书信，那么我也必须使我的教导与你们年龄的心境相称，与你们中的一些人对话，就像与认识父——即上帝——的孩童一样；与另一些人对话，就像与那些拥有比孩童更深知识的父辈一样，确切地说，他们不仅认识到祂是父，而且认识到祂是永恒且不可言喻的，因为祂从起初就存在：这样的人也需要关于上帝更完美的教义；与还有一些人对话，就像与那些强壮且能够投入争战和苦修的少年人一样。赋予后者以胜利的荣耀，表明他们也需要勇敢和富有战斗性的言辞。'
  - type: paragraph
    text:
      ru: 1Ин.2:13.Пишу вам, отцы, потому что вы познали Сущего от начала.
      cn: 约翰一书 2:13我写信给你们，父老们，因为你们认识了那从起初就有的。
  - type: paragraph
    text:
      ru: '«Дети» – те, кои погрешают по незрелости и неосновательности детской, почему апостол и говорит им: вы удостоились прощения, когда вам довелось познать, что«благ Господь ко всем и щедроты Его на всех делах Его»(Псал. 144,9)."Отцы"– те, кои с преспеянием в возрасте получили познание Сущего от начала."Юноши"– те, которые по своей зрелости искусно могут и готовы носить знаки победы над неприятелями.'
      cn: 孩童们 – 指那些因着孩童般的不成熟和轻率而犯错的人，因此使徒对他们说：当你们得以认识到「上主善待万有，祂的怜悯遍及祂一切的受造物」（诗篇 144:9）时，你们便蒙受了赦免。父老们 – 指那些在年龄上不断长进，并从起初就认识了那「自有者」的人。青年们 – 指那些因着自身的成熟，能熟练地并准备好佩戴战胜仇敌的胜利标志的人。
  - type: paragraph
    text:
      ru: 1Ин.2:13.Пишу вам, юноши, потому что вы победили лукавого. Пишу вам, отроки, потому что вы познали Отца. Я написал вам, отцы, потому что вы познали Безначального.
      cn: 约翰一书 2:13我写信给你们，青年人，因为你们已经战胜了那恶者。我写信给你们，孩童们，因为你们已经认识了父。我写信给你们，父老们，因为你们已经认识了那无始者。
  - type: paragraph
    text:
      ru: 1Ин.2:14.Я написал вам, юноши, потому что вы сильны, и слово Божие пребывает в вас, и вы победили лукавого.
      cn: (约翰一书 2:14) 我写信给你们，少年人，因为你们刚强，上帝的道住在你们心里，你们也胜了那恶者。
  - type: paragraph
    text:
      ru: Эти самые имена от возраста апостол выше приноровил к нравственному учению, а теперь повторяет от расположения, не прерывая своего наставления.
      cn: 这些同样的名字，使徒在上面曾就着年龄/阶段，将之适用于道德教导；但现在他出于其心境重复这些，不中断他的教导。
  - type: paragraph
    text:
      ru: '1Ин.2:15.Не любите мира, ни того, что в мире: кто любит мир, в том нет любви Отчей.'
      cn: (约翰一书 2:15) 不要爱世界，也不要爱世界上的事；人若爱世界，爱父的心就不在他里面了。
  - type: paragraph
    text:
      ru: 'Применив учение к возрастам духовным, апостол присовокупляет увещание.«Не любите мира». Это говорит как бы детям; ибо дети всегда трепещут от радости пред тем, что кажется приятным. Потом высказывает причину, почему никто не должен любить мира, ни того, что в мире. Затем предлагает учение отцам и юношам, которые более способны и совершенны. Чтобы ты не разумел под миром совокупность неба и земли, апостол объясняет, что такое мир и находящееся в мире. И, во-первых, под миром разумеет порочных людей, которые не имеют в себе любви Отчей. Во-вторых, под находящимся в мире, разумеет то, что совершается по похоти плотской, что, действуя чрез чувства, возбуждает похоть. Ибо под очами, главным орудием из чувств, он подразумевал и остальные чувства. Под похотью же разумеется всякое зло: прелюбодеяние, пьянство, неприличные любезности, убийства (совершаются ли они из корыстолюбия, или для уничтожения соперников), коварство, под которым нужно разуметь и всякое противодействие, – вообще все, враждебное Богу, а нами совершаемое чрез похоть плотскую.'
      cn: '使徒将这教导应用于属灵的阶段，又加上了劝勉：「不要爱世界」。这好像是对孩子们说的；因为孩子们总是为那些看似美好的事物而欢欣雀跃。接着，他阐明了原因，为什么没有人应该爱世界，也不应该爱世界上的任何事物。随后，他向父亲们和青年人提出了教导，他们更具能力和更为完善。


        为了让你不把「世界」理解为天地万物的总和，使徒解释了什么是世界以及在世界上的事物。首先，他将「世界」理解为邪恶之人，他们心中没有天父的爱。其次，他将「在世界上的事物」理解为那些依照肉体私欲而行之事，它们借着感官的作用，激发起私欲。因为他借着眼睛——感官中主要的工具——也指代了其他的感官。而「私欲」则指一切邪恶：奸淫、醉酒、不合宜的谄媚、杀戮（无论是出于贪婪，抑或为铲除对手而为之）、诡计，其下也应理解为一切的对抗，——总而言之，一切与上帝为敌，并由我们借着肉体私欲所行之事。'
  - type: paragraph
    text:
      ru: '1Ин.2:16.Ибо все, что в мире: похоть плоти, похоть очей и гордость житейская, не есть от Отца, но от мира сего.'
      cn: 约翰一书 2:16因为凡世界上的事，就是肉体的私欲，眼目的私欲，并今生的骄傲，都不是从父来的，乃是从世界来的。
  - type: paragraph
    text:
      ru: 1Ин.2:17.И мир проходит, и похоть его, а исполняющий волю Божию пребывает вовек.
      cn: (约翰一书 2:17) 世界和它的情欲都将过去，但遵行上帝旨意的人永远长存。
  - type: paragraph
    text:
      ru: Мы сказали уже, что миром апостол называет порочных людей, как и Господь говорил ученикам:«вы не от мира, как и Я не от мира»(Иоан. 15:19, 17:16). Отец же сего мира, то есть мирского сладострастия и нестроения – диавол. Поэтому и Господь говорит об учениках Своих Отцу:«не молю, чтобы Ты взял их из мира, но чтобы сохранил их от зла»(Иоан. 17,15), то есть мира, о котором и в другом месте (1Иоан. 5, 19) говорит апостол, что он во зле лежит. Иначе. Если злой противоположен благому Отцу, а служащий похотям мира не от Отца, но от мира, – очевидно, что кто не от Отца, но от мира, тот от диавола. Так и в Евангелии говорится иудеям:«ваш отец диавол»(Иоан. 8,44), то есть у вас наклонности плотские, которые сеет и возращает диавол. И эти мирские похотения непродолжительны и непостоянны, а что совершается по воле Божией, то продолжительно и вечно. Но благоразумным несвойственно обегать постоянное и хвататься за мгновенное; ибо поступать так значит то же, что строить дом на песке.
      cn: 我们已经说过，使徒所称的「世界」是指有罪之人，正如上主曾对门徒说：「你们不属世界，正如我也不属世界」（约翰福音 15:19，17:16）。而这世界的父，即世俗的纵欲和混乱之父，就是魔鬼。因此，上主论及祂的门徒，向上帝说：「我不求祢把他们从世界中取走，只求祢保守他们脱离那恶者」（约翰福音 17:15），也就是指使徒在另一处（约翰一书 5:19）所说的，世界卧在邪恶之中。换言之。如果恶者与良善的父相对立，而服事世界情欲的，不属父，乃属世界——显然，凡不属父而属世界的，就是属魔鬼的。福音中也如此对犹太人说：「你们的父是魔鬼」（约翰福音 8:44），也就是说，你们有肉体的倾向，是魔鬼所播种并滋养的。而这些世俗的欲望是短暂且不恒久的，凡是按上帝旨意而行的，则是长久且永远的。但对明智之人而言，不应舍弃恒久之物而抓住转瞬即逝之物；因为这样做就如同在沙土上建造房屋。
  - type: paragraph
    text:
      ru: 1Ин.2:18.Дети! последнее время. И как вы слышали, что придет антихрист, и теперь появилось много антихристов, то мы и познаем из того, что последнее время.
      cn: 约翰一书 2:18. 孩子们！这是末时了。并且你们曾听见敌基督要来，现在却有许多敌基督出现了，由此我们就知道这是末时了。
  - type: paragraph
    text:
      ru: '«Последнее время». Легче объяснить так. Поскольку соборное послание направлено ко всякому человеку, а предел жизни не для всех один, собственная же кончина никому не известна, то апостол прилично напоминает каждому о его кончине, чтобы каждый чувствовал, что наступает последнее время его жизни, и непрестанно был трезвен, и чтобы таким образом все христиане всегда проводили жизнь непорочную и совершали дела чистые. Иное объяснение, смеяться над которым было бы неуместно и безумно. Всякая вещь может быть разделена на три части: начало, середину и конец. Без сомнения, нет ничего несообразного назвать концом все то, что следует далее середины. Посему, если Господь пришел в середине десяти тысячелетий (ибо Его пришествие на землю было почти в 5500 году), то все следующее за сим время, без всякого спора, может быть названо последним. И как порядок тысячелетий в пришествие Господне переступил за середину, то все последующее за сим время прилично может быть названо последним. Истинность такого объяснения принимает иИоанн Златоуст.'
      cn: '«末时». 更容易这样解释：既然公函是写给每一个人的，而生命的界限并非人人相同，自己的寿终也无人知晓，那么使徒便适宜地提醒每个人关于他的寿终，好让每个人都感受到他生命的末时即将来临，并持续保持警醒，如此，所有基督徒方能始终过着纯洁无瑕的生活，并行出洁净的善工。


        另一种解释，嘲笑它是不适宜且愚蠢的。万物都可以分为三部分：开始、中间和结束。毫无疑问，将所有在中间之后的事物称为「结束」并无不当。因此，如果上主是在一万个千年的中间降临（因为祂降临地上大约是在公元5500年），那么，此后所有的时间，毫无争议地，可以被称为末时。而且，既然在主降临之时，千年的顺序已经越过了中间，那么此后所有的时间，适宜地，可以被称为末时。这种解释的真实性也为金口圣若望所接受。'
  - type: paragraph
    text:
      ru: '1Ин.2:19.Они вышли от нас, но не были наши: ибо если бы они были наши, то остались бы с нами; но они вышли, и через то открылось, что не все наши.'
      cn: (约翰一书 2:19) 他们从我们中间出去了，但他们不属于我们；因为如果他们属于我们，他们就会与我们同在；但他们出去了，为要显明他们不都属于我们。
  - type: paragraph
    text:
      ru: 'Упомянув об антихристах, присовокупляет о том, откуда они, и говорит: они от нас. Присовокупляет это, нисколько не мешая ясности речи. Он как бы сам себя спросил: откуда эти антихристы? И ответил: они от нас. Так следовало бы сделать, но он поступил не так, быть может, для того, чтобы слитностью речи показать неприятность, возбуждаемую ими. Для чего же антихристы из учеников Господних? Для того, чтобы иметь доверие от обольщаемых, чтобы обольщаемые думали, что они, как из числа учеников, проповедуют учение по мыслям Учителя, а не совершенно противны Его проповеди. Посему, говорит,«вышли от нас»,  то есть хотя были учениками, но отстали от истины и выдумали собственные хулы.«Не были наши», то есть из части спасаемых. Ибо в противном случае они остались бы в союзе со своими. Теперь же они«вышли от нас»,  чтобы сделалось явным, что они совершенно стали чужды нам. Есть между ними и такие, которые и не от нас, но к которым присоединились вышедшие от нас. Ради них-то апостол и сказал: «не все от нас».'
      cn: 提到敌基督者时，使徒补充说明他们从何而来，并说：「他们出自我们。」他补充此言，丝毫没有妨碍言语的清晰。他仿佛自问：「这些敌基督者从何而来？」并回答说：「他们出自我们。」本应如此，但他并未这样做，也许是为了以言语的连贯性来显示他们所引起的厌恶。那么为何敌基督者出自上主的门徒呢？是为了获得被迷惑者的信任，好让被迷惑者认为，他们既然出自门徒之列，所宣讲的教义是依照夫子的思想，而非完全与祂的教诲相悖。所以，他说道：「他们出自我们」，也就是说，他们虽然曾是门徒，但却偏离了真理，并编造了自己的亵渎言论。「他们不属于我们」，也就是说，不属于蒙拯救的一部分人。因为否则的话，他们就会留在与自己人的联合之中。而现在他们「出自我们」，是为了使之显明，他们已完全与我们疏远。他们当中也有这样的人，他们并非出自我们，但那些出自我们的人却加入了他们。正是为此，使徒才说：「并非所有人都出自我们」。
  - type: paragraph
    text:
      ru: 1Ин.2:20.Впрочем, вы имеете помазание от Святаго и знаете все.
      cn: (约翰一书 2:20) 然而，你们有从圣者而来的恩膏，并且知道一切。
  - type: paragraph
    text:
      ru: 1Ин.2:21.Я написал вам не потому, чтобы вы не знали истины, но потому, что вы знаете ее, равно как и то, что всякая ложь не от истины.
      cn: (约翰一书 2:21) 我写给你们，不是因为你们不知道真理，而是因为你们知道真理，也知道一切谎言都不是出于真理。
  - type: paragraph
    text:
      ru: 1Ин.2:22.Кто лжец, если не тот, кто отвергает, что Иисус есть Христос? Это антихрист, отвергающий Отца и Сына.
      cn: 1约翰福音 2:22.谁是骗子呢？岂不是那否认耶稣是基督的吗？这是敌基督，他否认父与子。
  - type: paragraph
    text:
      ru: 1Ин.2:23.Всякий, отвергающий Сына, не имеет и Отца; а исповедующий Сына имеет и Отца.
      cn: （约翰一书 2:23）凡弃绝子的，就没有父；凡宣认子的，也有父。
  - type: paragraph
    text:
      ru: 1Ин.2:24.Итак, что вы слышали от начала, то и да пребывает в вас; если пребудет в вас то, что вы слышали от начала, то и вы пребудете в Сыне и в Отце.
      cn: （约翰一书 2:24）因此，你们从起初所听见的，愿它常存在你们里面；如果你们从起初所听见的常存在你们里面，你们也就常存在子和父里面。
  - type: paragraph
    text:
      ru: 1Ин.2:25.Обетование же, которое Он обещал нам, есть жизнь вечная.
      cn: (约翰一书 2:25) 而祂所应许给我们的应许，乃是永生。
  - type: paragraph
    text:
      ru: 'Чтобы после того, как апостол высказал предшествующее, кто-нибудь не подумал, что он усвояет знание этого только себе одному и потому хвалится им пред прочими верующими, он прилично прибавляет: и вы имеете помазание. Он как бы так говорит: но что я рассуждаю об этом с вами, как будто бы вы не знаете сего? нет, вы сами знаете это. Ибо при святом крещении вы приняли священное помазание, и чрез оное Святого Духа. Если же так, то знайте, что я написал вам об этом не как незнающим, но как знающим, что теперь последнее время, что сильно действуют антихристы, что все полны лжи. Так как умножилась ложь, то и сказал я, что появилось много антихристов. Ибо если Христос есть истина (Иоан. 14,6), и вы, познавшие Его, имеете истину в себе; то, очевидно, лжец, противящийся истине, то есть Христу, есть антихрист. А кто лжец? Тот, кто говорит, что Иисус не Христос. Так прескверный Симон пустословил, что Иной – Иисус, и Иной – Христос; Иисус – родившийся от Девы Марии, а Христос – нисшедший с неба на Иордан. Итак, кто соглашается с этой ложью, тот антихрист. Лжец же и антихрист и тот, кто отвергает Отца и Сына. Ибо иные еретики (из которых выродился проклятый Валентин) говорили, что Иной – Отец безымянный, и Иной – называемый Отцом Христа. Сии же самые отвергают и Сына, когда говорят, что Он простой человек, а не Бог по естеству, Бог от Бога. Поэтому апостол присовокупляет: всякий, отвергающий Сына, не имеет и Отца. Иудеи, например, отвергают Сына и присвояют себе знание Отца. Но пусть они знают, что они и Отца еще не познали; ибо если бы узнали Его, то узнали бы и Сына, потому что Он есть Отец и Сына Единородного. То же пустословили и единомышленники Симона. Таковы мнения еретиков. Но вы храните у себя то, что слышали от начала, именно, что Христос есть Бог; ибо это значат слова: в вас да пребывает. Если пребудет в вас то, что вы слышали от начала, то и вы пребудете в Сыне и в Отце, то есть будете в общении с Ним. Ибо обетование Его таково:«как Ты, Отче во Мне, и Я в Тебе, так и они да будут в Нас едино»(Иоан. 17,21); и еще: да имеют жизнь вечную,«сия же есть жизнь вечная, да знают Тебя, единого истинного Бога, и посланного Тобой Иисуса Христа»(Иоан. 17,3).'
      cn: 使徒在阐明了前面的话之后，免得有人以为他将这知识只归给自己独有，因而向其余的信众夸耀，他恰当地补充说：「你们也都有恩膏。」他仿佛是这样说的：我为何要与你们论述此事，好像你们不明白一样吗？不，你们自己明白。因为在圣洗礼中，你们领受了神圣的恩膏，并借此领受了圣灵。若是如此，那么要知道，我写这些给你们，并非将你们当作无知之人，而是将你们当作知晓之人，知道如今是末世，敌基督者正猛烈作祟，且一切都充满谎言。既然谎言增多，故我才说，出现了许多敌基督者。因为若基督是真理（约翰福音 14:6），而你们这些认识祂的人，心中有真理；那么，显然，那抵挡真理，即抵挡基督的撒谎者，便是敌基督者。谁是撒谎者呢？就是那说耶稣不是基督的人。譬如，那极可憎的西门妄言，说耶稣是一回事，基督是另一回事；耶稣是童贞玛利亚所生，而基督是从天降至约旦河的。所以，凡认同此谎言者，便是敌基督者。那否认父与子的，也是撒谎者和敌基督者。因为有些异端（那可咒诅的瓦伦丁便是其后代）曾说，那无名的父是一回事，而那被称为基督之父的，又是另一回事。这些人也否认子，当他们说祂是单纯的人，而非本性是上帝，由上帝所出的上帝时。因此使徒补充说：「凡否认子的，也就没有父。」比如，犹太人否认子，却自称认识父。但愿他们知道，他们甚至尚未认识父；因为如果他们认识了祂，也就会认识子，因为祂是独生子的父。西门的同伙也曾如此妄言。这些便是异端的观点。但你们要持守那从起初所听见的，就是基督是上帝；因为「让它在你们里面存留」这句话就是此意。如果你们从起初所听见的存留在你们里面，那么你们也必存留在子与父里面，也就是说，将与祂相通。因为祂的应许是：「父啊，祢在我里面，我亦在祢里面，愿他们也在我们里面合而为一」（约翰福音 17:21）；又说：愿他们得享永生，「认识祢独一的真上帝，并认识祢所差来的耶稣基督，这就是永生」（约翰福音 17:3）。
  - type: paragraph
    text:
      ru: 1Ин.2:26.Это я написал вам об обольщающих вас.
      cn: (约翰一书 2:26) 我将这些写给你们，是关于那些引诱你们的人。
  - type: paragraph
    text:
      ru: Окончив речь, веденную выше, апостол прибавляет о тех, которые обольщают их появившимися во множестве ересями. Потом, чтобы отдалить от них грусть, снова повторяет:«и помазание, которое вы получили от Него». Под помазанием, как уже сказано, разумеется Дух Святый. Итак, если вы твердо храните у себя Духа Святого, которого вы приняли, то не имеете нужды, чтобы кто учил вас. Но как Этот Самый Дух научает вас всему, то в том и пребывайте, чему Он научил вас; ибо то, чему Он научил вас, истинно и неложно.
      cn: 讲完上面所说的话，使徒又论及那些以蜂拥而出的异端邪说诱惑他们的人。然后，为了驱散他们的忧愁，使徒再次重申：「并且你们从祂所领受的恩膏。」诚如之前所言，在此「恩膏」一词之下，意指圣灵。那么，倘若你们坚定地保守着你们所领受的圣灵，就不需要任何人来教导你们了。然而，既然这同一位圣灵教导你们一切，你们就当持守祂所教导你们的；因为祂所教导你们的，是真实不虚的。
  - type: paragraph
    text:
      ru: 1Ин.2:27.Впрочем, помазание, которое вы получили от Него, в вас пребывает, и вы не имеете нужды, чтобы кто учил вас; но как самое сие помазание учит вас всему, и оно истинно и неложно, то, чему оно научило вас, в том пребывайте.
      cn: (约翰一书 2:27) 然而，你们从祂所领受的恩膏，住在你们里面，你们就不需要任何人教导你们；但正如这恩膏本身教导你们一切，并且它是真实的，没有虚假，所以，它所教导你们的，你们就住在其中。
  - type: paragraph
    text:
      ru: 'Порядок такой: как полученное вами от Него помазание пребывает в вас, то нет нужды, чтобы кто учил вас; но вам должно пребывать в том, чему оно научило вас.'
      cn: 既然你们从祂所领受的恩膏住在你们里面，就无需有人教导你们；但你们应当持守它所教导你们的。
  - type: paragraph
    text:
      ru: 1Ин.2:28.Итак, дети, пребывайте в Нем, чтобы, когда Он явится, иметь нам дерзновение и не постыдиться пред Ним в пришествие Его.
      cn: 约翰一书 2:28. 所以，小子们哪，你们要常在祂里面，好在祂显现的时候，我们就可以有坦然无惧，不至于在祂来临的时候在祂面前蒙羞。
  - type: paragraph
    text:
      ru: 1Ин.2:29.Если вы знаете, что Он праведник, знайте и то, что всякий, делающий правду, рожден от Него.
      cn: (约翰一书 2:29) 如果你们知道他是义者，也要知道，凡行公义的，都是从他而生。
- type: heading1
  text:
    ru: Глава третья
    cn: 第三章
  children:
  - type: paragraph
    text:
      ru: 1Ин.3:1.Смотрите, какую любовь дал нам Отец, чтобы нам называться и быть детьми Божиими.
      cn: (约翰一书 3:1) 看哪，父赐给我们何等的爱，使我们得称为上帝的儿女，也真是如此。
  - type: paragraph
    text:
      ru: 'Сказав о появлении антихристов, и о том, что все учение их развращенно, и достаточно убедив верующих непреложно содержать то учение, которым они оглашены, апостол упоминает потом о назначенной за это награде, чтобы светлостью награды как бы еще более укрепить их, и говорит:«пребывайте в Нем». Для чего? Для того, чтобы, когда Он явится, иметь нам дерзновение о Нем. Ибо что может быть славнее или желательнее дерзновения, то есть того, чтобы, когда мы будем открывать труды наши в настоящей жизни, могли это делать с дерзновением, нисколько не стыдясь, в пришествие Его? А как иные могли спросить, что же делать, чтобы сделаться благоугодными Ему, то апостол и этому научает, говоря: если вы познали, что Он праведен, то, без сомнения, знаете и то, что делающий правду рожден от Него; ибо праведный рождает праведных. А сколь великую честь и дерзновение доставляет это, всякий из вас знает, равно как и то, какова любовь и благость, которую Он подает вам. Ибо вы знаете, что Он дал вам право быть и почитаться детьми Его. Если же принадлежащие миру не знают сего, то есть того, что вы дети Божии, сему не удивляйтесь; ибо они не знают вас потому, что не познали и Того, Кто усыновил вас. Миром называет людей порочных. Потом, поскольку доказал сыновство, яснее говорит о предлежащей славе и дерзновении усыновленных:«возлюбленные! мы теперь дети Божии».'
      cn: 使徒在谈及敌基督者的出现，以及他们的一切教导都是败坏的，并充分说服了信徒们要坚定不移地持守他们所受的教训之后，接着提到了为此所定的赏赐，旨在通过这赏赐的光辉，进一步坚固他们，并说：「住在祂里面。」为何如此？是为了当祂显现时，我们可以在祂面前拥有坦然无惧的心。因为还有什么比拥有坦然无惧的心更荣耀或更可欲的呢？也就是说，当我们在今生显露我们的劳苦时，在祂的再来之时，我们能够坦然无惧地这样做，丝毫不感到羞愧？而有些人可能会问，要做什么才能蒙祂喜悦，使徒对此也教导说：你们若知道祂是公义的，那么，毫无疑问，你们也知道凡行公义之人都是由祂所生；因为公义者生公义者。至于这会带来何等大的尊荣和坦然无惧，你们每个人都知道，同样也知道祂赐予你们的爱与良善是何等大。因为你们知道，祂赐予你们权利，可以成为并被尊为祂的儿女。若世上的人不晓得这事，也就是说，不晓得你们是上帝的儿女，对此不要感到惊讶；因为他们不认识你们，是由于他们也不认识那收养你们为子的主。这里用「世人」指称那些邪恶败坏的人。接着，既然他已论证了儿女的名分，便更清楚地谈及摆在蒙收养为子之人面前的荣耀与坦然无惧之心，说：「蒙爱者啊！我们现在是上帝的儿女。」
  - type: paragraph
    text:
      ru: Мир потому не знает нас, что не познал Его.
      cn: 世人所以不认识我们，因为不认识祂。
  - type: paragraph
    text:
      ru: Мир – это люди порочные и нечистые, привязанные к одной только страстной жизни, как свинья к грязи.
      cn: 这世界是指那些败坏不洁的人，他们仅仅执着于情欲生活，如同猪恋泥沼。
  - type: paragraph
    text:
      ru: 1Ин.3:2.Возлюбленные! мы теперь дети Божии; но еще не открылось, что будем. Знаем только, что, когда откроется, будем подобны Ему, потому что увидим Его, как Он есть.
      cn: （约翰一书 3:2）亲爱的！我们如今是上帝的儿女，但我们将来如何，还未显明。我们只知道，当祂显现的时候，我们必要像祂，因为我们将看见祂的本相。
  - type: paragraph
    text:
      ru: 1Ин.3:3.И всякий, имеющий сию надежду на Него, очищает себя так, как Он чист.
      cn: （约翰一书 3:3）凡怀着这盼望在他里面的人，就洁净自己，如同他洁净一样。
  - type: paragraph
    text:
      ru: 'Апостол как бы так говорит: из предыдущего вы, без сомнения, узнали, что мы приняты Богом как дети. Хотя это еще не открылось, однако не смущайтесь. Ибо неизвестное ныне сделается явным, когда Он откроется. И мы, оказавшись подобными Ему, наглядно представим свое усыновление; ибо дети, конечно, подобны Отцу. Имея же дерзновение пред Ним, как дети, мы увидим Его как Он есть, впрочем – не по естеству, ибо это невозможно для сотворенного существа, а так, что чистые увидят Чистого, праведные Праведного; ибо подобные пристанут к Подобному. Посему-то перед этим и сказал я только, что мы будем подобны Ему, а не одинаковой природы с Ним; ибо тогда я сказал бы не"подобны", а такие же точно; а как этого не будет, то я и сказал:"подобны", то есть по качеству славы. Заметить также нужно, что апостол не сказал выше: всякий, кто сделал или сделает правду, но – делающий; ибо добродетели деятельны и имеют бытие только во время совершения, а когда прекратятся или остаются только в намерении, то не имеют и бытия.'
      cn: 使徒仿佛如此说：从前文你们无疑已然得知，我们蒙上帝接纳为子女。虽然这尚未显明，然而不要困惑。因为如今未可知晓的，当祂显现时将要显明。而我们，既已与祂相似，将显明我们的被收纳为嗣子；因为子女，无疑地，与父亲相似。既有孩童般的坦然无惧在祂面前，我们将看见祂的本相，然而并非按其本性，因为这对于受造之物是不可能的；而是洁净的将看见洁净者，公义的将看见公义者；因为相似的将亲近相似者。正因如此，在此之前我才只说，我们将与祂相似，而非与祂同性同质；因为那样我就会说「一样」，而不是「相似」；而既然这不会发生，我便说「相似」，即按荣耀的品格。另需注意的是，使徒未曾以上文说：「凡行了或将要行公义的」，而是「行公义的」；因为美德是主动的，唯有在实行时才具实体，而当其停止，或只停留在意图中时，便不具实体。
  - type: paragraph
    text:
      ru: 1Ин.3:4.Всякий, делающий грех, делает и беззаконие; и грех есть беззаконие.
      cn: （约翰一书 3:4）凡犯罪的，也犯了不法；并且罪就是不法。
  - type: paragraph
    text:
      ru: 1Ин.3:5.И вы знаете, что Он явился для того, чтобы взять грехи наши, и что в Нем нет греха.
      cn: (约翰一书 3:5) 你们知道，祂显现是为了除去我们的罪，在祂里面并没有罪。
  - type: paragraph
    text:
      ru: 'Подтвердив речь о правде благами от правды, апостол хочет теперь показать то же от противного и что есть в оном, и говорит:«всякий, делающий грех». Он говорит как бы так: вы, усыновленные, делайте правду и не показывайте себя праздными от нее. Ибо как в отношении греха не тот грешник или беззаконник, кто совершил или совершит грех, но тот, кто держится зла и делает зло, так и праведен не тот, кто не действует, но тот, кто делает правду. Грех даже и неуместен в вас; ибо Христос явился для разрушения греха, и как Сам был непричастен греху, так и вам, соединившимся с Ним и утвержденным верой в Него, не остается уже места грешить. Это и означают слова:«всякий, пребывающий в Нем, не согрешает»(1Ин.3:6). Нужно также знать, что грехом называется отпадение от добра, а беззаконием нарушение положительного закона. То и другое имеют началом: одно – отпадение от добра, а другое – преступление положительного закона; но в сущности оба сходятся: грешник уклонился от цели, назначенной по природе и в природе (ибо цель человеческой природы – жить по разуму, далеко устранив неразумие); точно так же и беззаконник, неудержимо стремясь к злу, преступает закон, вложенный в природу.'
      cn: '在以公义所带来的善果来证实公义的教导后，使徒现在希望从反面，以及反面所包含的内容来展现同样的真理，他说道：


        「凡犯罪的」。他仿佛在说：你们这些蒙上帝收纳为子女的，当行公义，且不要对此表现出怠惰。因为在罪的问题上，那犯了罪或将要犯罪的人，并非罪人或不法之徒；而是那执着于恶并作恶的人，才是罪人或不法之徒。同样，那不行善的人并非义人，而是那行公义的人，才是义人。罪甚至在你们当中也是不合宜的；因为基督显现，为要除灭罪恶。且正如祂自己未曾沾染罪恶，同样，对于你们这些与祂联合，并藉着对祂的信仰而得以坚固的人，已不再有犯罪的余地。这正是经文所说的意思：「凡住在祂里面的，就不犯罪」（约翰一书 3:6）。此外，还需知晓，罪被称为偏离良善，而不法被称为违犯成文法。这两者都始于：其一是偏离良善，其二是触犯成文法；但本质上两者是相通的：罪人偏离了按其本性及在其中所设定的目标（因为人性的目标是依循理性而活，远远摒弃不理性）；同样，不法之徒，无法自制地趋向邪恶，触犯了赋予本性的法则。'
  - type: paragraph
    text:
      ru: 1Ин.3:6.Всякий, пребывающий в Нем, не согрешает.
      cn: (约翰一书 3:6) 凡住在祂里面的，就不犯罪。
  - type: paragraph
    text:
      ru: То есть кто неослабно следует за добродетелями и никогда не перестает совершать их.
      cn: 也就是说，谁若不懈地遵行美德，并且从未停止实践它们。
  - type: paragraph
    text:
      ru: Всякий согрешающий не видел Его и не познал Его.
      cn: 凡犯罪的，未曾见过祂，也未曾认识祂。
  - type: paragraph
    text:
      ru: 1Ин.3:7.Дети! да не обольщает вас никто. Кто делает правду, тот праведен, подобно как Он праведен.
      cn: 约翰一书 3:7. 孩子们！叫没有人欺骗你们。凡行公义的，他就是义的，正如祂是义的。
  - type: paragraph
    text:
      ru: 'Сказав, что Сын Божий явился и что Он явился для того, чтобы, не сотворивши Своего греха, взять, то есть уничтожить наш грех, прибавляет:«всякий согрешающий не видел Его». Если вы, говорит, когда Он явился, увидели Его, и вследствие видения Его получили силу не уступать греху, как совершенно утвердившиеся в Нем, то очевидно, что те, которые грешат, не видели Его, и потому не познали Его. Под видением Его разумеет не видение простым прикосновением глаза или легким воспроизведением в своем воображении чего-либо известного, но нежелание сколько-нибудь обсудить и разузнать дело и присоединиться к Нему, как мы выше говорили. Сказав же это, утвердительно заповедует:«да не обольщает вас никто». Смысл такой: кто делает правду, тот познал Праведного и праведен, как и Он, то есть Бог. Напротив, кто делает грех, тот от грешника, то есть от диавола, так как он грешит от начала. Посему Бог, пекущийся о создании Своем, Сам, будучи правдой и святостью, открылся, то есть явился в мир, чтобы уничтожить дела диавола.'
      cn: 说了上帝之子显现了，并且祂显现是为了，在没有犯自己罪的情况下，取走，也就是消灭我们的罪，便补充说：「凡犯罪的，都未曾见过祂。」他说，如果你们在祂显现时看见了祂，并且因着看见祂而获得了不向罪屈服的力量，如同完全在祂里面被坚固了的人，那么很明显，那些犯罪的人没有见过祂，因此也不认识祂。他所说的看见祂，并非指用眼睛简单的触碰（看见），也非指在自己的想象中轻易地重现某个已知事物，而是指不愿意丝毫地讨论、了解此事并与祂结合，正如我们上面所说的。说了这话之后，便肯定地训诫说：「不要让任何人欺骗你们。」意思如下：行公义的，就认识了那公义者，并且是公义的，正如祂，也就是上帝。相反地，凡犯罪的，就是出于罪人，也就是出于魔鬼，因为魔鬼从起初就犯罪。因此，上帝，祂眷顾着祂的受造物，祂自己，既是公义又是圣洁，便显现了，也就是在世上显明了，为了要消灭魔鬼的作为。
  - type: paragraph
    text:
      ru: 1Ин.3:8.Кто делает грех, тот от диавола, потому что сначала диавол согрешил. Для сего-то и явился Сын Божий, чтобы разрушить дела диавола.
      cn: (约翰一书 3:8) 凡犯罪的，是出于魔鬼，因为魔鬼从起初就犯了罪。为此，上帝之子才显现出来，为要除灭魔鬼的作为。
  - type: paragraph
    text:
      ru: 'Так как диавол постоянно обращается в грехе, то всякий, кто грешит, становится сторонником диавола; ибо диавол предначинает в человеке грех, внушая ему лукавые помыслы, как Иуде (Иоан. 13,2). Иной скажет: как диавол бывает в тех, которые грешат, когда они прежде него согрешили уже тем, что дали ему место? Такому должно сказать, что делать грех и давать место диаволу одно и то же; ибо дает ему место тот, кто грешит, подчинившись похоти, а с принятием его уже и на деле совершает грех, ибо это значит«делать грех». Хорошо сказано:«кто делает», а не«сделавший», и в том отношении, что покаявшийся уже не от диавола, но от него только тот, кто совершает грех. Так и раб греха есть тот, кто делает, а не тот, кто сделал грех; ибо«всякий, делающий грех, есть раб греха»(Иоан. 8,34).'
      cn: 既然魔鬼常在罪中，那么凡是犯罪的，就成了魔鬼的同伙；因为魔鬼在人里面发动罪，藉着灌输他邪恶的意念，如同对犹大一样（约翰福音 13:2）。或有人会说：当他们已经先于魔鬼犯罪，因为他们给了它地方的时候，魔鬼怎能住在那些犯罪的人里面呢？对这样的人应当说，犯罪和给魔鬼留地步是一回事；因为屈服于情欲而犯罪的人，就是给了它地方，而接受了它的，就在行为上犯了罪，因为这就是「犯罪」的意思。说得好：「行罪的」，而不是「已行罪的」；从这个角度看，悔改的人就不再属于魔鬼了，但只有那些正在行罪的人，才属于它。同样，罪的奴仆是那行罪的，而不是那已行罪的；因为「凡是行罪的，就是罪的奴仆」（约翰福音 8:34）。
  - type: paragraph
    text:
      ru: 1Ин.3:9.Всякий, рожденный от Бога, не делает греха, потому что семя Его пребывает в нем; и он не может грешить, потому что рожден от Бога.
      cn: （约翰一书 3:9）凡由上帝而生者，不犯罪，因祂的种子常在他里面；他不能犯罪，因为他是由上帝而生的。
  - type: paragraph
    text:
      ru: '1Ин.3:10.Дети Божии и дети диавола узнаются так: всякий, не делающий правды, не есть от Бога, равно и не любящий брата своего.'
      cn: (约翰一书 3:10) 上帝的儿女和魔鬼的儿女，由此可以认出来：凡不行公义的，就不是出于上帝，同样，不爱他弟兄的，也不是。
  - type: paragraph
    text:
      ru: Всяк, кто делает грех, потому, что грешит, есть от диавола и называется сыном диавола, как апостол Павел сказал Елиме:«сын диавола! перестанешь ли ты совращать с прямых путей Господних?»(Деян. 13,10). Очевидно, и тот, кто рожден от Бога, будучи сыном Божиим, не грешит; потому что семя его – Божие, то есть или Дух, Которого мы получили чрез дар, которого удостоились, и Который, пребывая в нас, соделывает ум наш не допускающим греха, или же Сам Христос, Который, обитая в верующих, соделывает их сынами Божиими, как и Сам Христос в семени Авраама есть сын Авраамов (Матф. 1,1). И в семени Авраама, сказано, то есть во Христе, благословятся народы (Быт. 12,3;Гал. 3,16).
      cn: 凡是犯罪的，因为他犯罪，是出于魔鬼，并被称为魔鬼之子，正如使徒保罗对以吕马所说：「你这魔鬼之子啊！难道你还不停止弯曲上主的正直道路吗？」(使徒行传 13:10)。显然，那由上帝而生、身为上帝之子的人，是不犯罪的；因为他的种子是上帝的，也就是说，或者就是圣灵，我们借着我们所蒙受的恩赐而领受了祂，而祂，住在我们里面，使我们的心智不容许犯罪；或者就是基督祂自己，祂住在信徒里面，使他们成为上帝之子，正如基督祂自己在亚伯拉罕的后裔中是亚伯拉罕的子孙 (马太福音 1:1)。并且在亚伯拉罕的后裔中，就是基督里，万民将蒙福 (创世记 12:3，加拉太书 3:16)。
  - type: paragraph
    text:
      ru: Объяснение Златоуста. Всякий раз, как мы грешим, мы рождаемся от диавола; а всякий раз, как совершаем добродетель, рождаемся от Бога, потому что«семя Его пребывает в нем»(1Иоан. 3,9). Семенем называет Духа, Которого мы получаем чрез крещение, и Который, пребывая в нас, делает ум наш не допускающим греха. Если же кто не родится от Бога, тот не получает Духа Святого.
      cn: 金口圣徒的解释。 每次我们犯罪，便是从魔鬼而生；而每次我们实行德行，便是从上帝而生，因为「他的种子存在他里面」（约翰一书 3:9）。他将这种子称为圣灵，我们通过洗礼所领受的圣灵，并且，祂住在我们里面，使我们的心智不容许罪恶。若是有人不是从上帝而生，他便不领受圣灵。
  - type: paragraph
    text:
      ru: Иное объяснение. Семя Божие есть Христос, Который, обитая в верующих, соделывает их сынами Божиими. Так в семени Авраама, которое есть Христос, благословляются все народы. Иначе, семенем называет первое поколение родоначальника, отличающееся добродетелями. Родоначальник своими добродетелями как бы орошает свое племя, и чем сам приобрел славу, тем и своим преемникам дает возможность быть в славе, особенно если они соблюдут достоинства предка своего неомраченными, ибо они доставляют славу не всякому без разбора. Почему иудеи, хотя и напрасно, говорили Христу:«мы семя Авраамово»(Иоан. 8,33).
      cn: 另一种解释。上帝的种子是基督，祂居住在信徒之中，使他们成为上帝的众子。如此，在亚伯拉罕的种子（这种子就是基督）中，所有的民族都蒙受祝福。或者说，祂将种子称为始祖以美德著称的第一代后裔。始祖以自己的美德，仿佛浇灌自己的宗族；祂自己所获得的荣耀，也使祂的继承者们有可能拥有荣耀，特别是当他们能保持自己祖先的品德不受玷污时，因为这些品德并非毫无区别地赐予每个人荣耀。因此，犹太人，虽然是徒然地，对基督说：「我们是亚伯拉罕的后裔」（约翰福音 8:33）。
  - type: paragraph
    text:
      ru: 1Ин.3:11.Ибо таково благовествование, которое вы слышали от начала, чтобы мы любили друг друга,
      cn: (约翰一书 3:11) 因为你们从起初所听见的信息，就是我们应当彼此相爱。
  - type: paragraph
    text:
      ru: 1Ин.3:12.не так, как Каин, который был от лукавого и убил брата своего. А за что убил его? За то, что дела его были злы, а дела брата его праведны.
      cn: (约翰一书 3:12) 不像该隐，他是属那恶者的，并杀害了他的兄弟。为什么杀害了他呢？因为他自己的行为是邪恶的，而他兄弟的行为是义的。
  - type: paragraph
    text:
      ru: 1Ин.3:13.Не дивитесь, братия мои, если мир ненавидит вас.
      cn: (约翰一书 3:13) 我的弟兄们，若是世界恨你们，不要诧异。
  - type: paragraph
    text:
      ru: 1Ин.3:14.Мы знаем, что мы перешли из смерти в жизнь, потому что любим братьев; не любящий брата пребывает в смерти.
      cn: 约翰一书 3:14我们知道，我们已经出死入生了，因为我们爱弟兄；不爱弟兄的，仍住在死亡中。
  - type: paragraph
    text:
      ru: Апостол примером подтверждает, сколь великое зло – ненавидеть брата. Смотрите, говорит, вот Каин возненавидел брата и убил его, несмотря на то, что он родной брат его. Каин творил злые дела отца своего диавола, Авель же, делая правду, был сыном в отношении к Богу. Здесь диавол противопоставляется Богу, а злые дела добрым. Посему-то Каин, противоположный брату, убил его. Таково объяснение по ходу речи. Но апостол Иоанн изменил этот порядок, имея особое побуждение. Ибо ему, после того, как упомянул о диаволе и о том, что делающие зло становятся детьми его, естественно было выставить в пример того, кто в начале мира поспешил сделаться сыном диавола чрез злые дела. Высказав нужное о Каине и об участи, которую наследуют подражающие ему, опять переходит к любви.
      cn: 使徒以实例证实，憎恨弟兄是何等大的恶。他说：「看哪，该隐憎恨并杀害了他的兄弟，尽管那是他的亲兄弟。」该隐行了他父亲魔鬼的恶行，亚伯却行公义，在上帝面前为子。在此，魔鬼与上帝对立，而恶行与善行对立。因此，该隐，与他兄弟对立，杀害了他。这便是依循此论述的解释。然而使徒约翰改变了这个顺序，怀着特殊的动机。因为对他而言，在提及魔鬼以及行恶者成为其子女之事后，很自然地便会提出那个在世界之初急于藉着恶行成为魔鬼之子的例子。在阐明了关于该隐的必要之处，以及效法他之人所继承的结局之后，他又再次转回论述爱。
  - type: paragraph
    text:
      ru: 1Ин.3:15.Всякий, ненавидящий брата своего, есть человекоубийца; а вы знаете, что никакой человекоубийца не имеет жизни вечной, в нем пребывающей.
      cn: (约翰一书 3:15) 凡恨自己弟兄的，就是杀人的；你们知道，凡杀人的，没有永生常存在他里面。
  - type: paragraph
    text:
      ru: '1Ин.3:16.Любовь познали мы в том, что Он положил за нас душу Свою: и мы должны полагать души свои за братьев.'
      cn: 约翰一书 3:16。我们由此认识了爱：祂为我们舍弃自己的性命；我们也当为弟兄们舍弃自己的性命。
  - type: paragraph
    text:
      ru: '1Ин.3:17.А кто имеет достаток в мире, но, видя брата своего в нужде, затворяет от него сердце свое, – как пребывает в том любовь Божия?:'
      cn: (约翰一书 3:17) 凡在世上拥有财物，但看见自己的弟兄身处困苦，却向他关闭自己的心，上帝的爱怎能住在这样的人里面呢？
  - type: paragraph
    text:
      ru: 1Ин.3:18.Дети мои! станем любить не словом или языком, но делом и истиною.
      cn: (约翰一书 3:18) 我的孩子们！我们当爱，不是用言语或口舌，而是用行为和真理。
  - type: paragraph
    text:
      ru: 'Закончив о Каине и о злых делах, подобных его делу, опять обращается к любви, и говорит, что любовь преклонила Господа положить душу Свою за нас, и что по Его примеру и мы должны полагать души за братьев. Но как это делается редко и немногими, то апостол, как бы пристыжая верных, начиная с небольшого, убеждает к братолюбию. Он говорит как бы так: что говорить о положении души за брата, когда мы видим, что не удовлетворяют братьев своих в необходимом для жизни, и притом не бедные средствами жизни, – об этих я не говорю, – но владеющие богатством целого мира? Посему да постыдятся! Ибо если затворили сердце в этом малом и явились недостойными любви Божией, то что показали бы, когда бы потребовалось большее – умереть за брата? Потом еще продолжает обличать тех, которые ограничивают любовь словом и обнаруживают ее только на языке."Станем", говорит,«любить не словом или языком, но делом и истиною».'
      cn: 讲完了关于该隐和他类似其恶行的事情之后，（使徒）又转回到爱的话题，并说，爱使上主情愿为我们舍弃祂的生命，又说，我们应当效法祂的榜样，为弟兄舍弃生命。但由于这事罕有人行，也罕为少数人所行，所以使徒，仿佛在使信友们蒙羞，从小处着手，劝勉他们要友爱弟兄。他仿佛是这样说的：若是谈到为弟兄舍弃生命，那又何须谈论呢？当我们看到有人甚至不能满足弟兄们生活上的必需时，而且这些人并非缺乏生活所需，——我不是说穷人——而是拥有全世界财富的人呢？因此，愿他们蒙羞吧！因为若是在这小事上关上心门，并且显出不配得上帝之爱，那么当需要更大的事情——为弟兄而死时，他们又能表现出什么呢？接着又继续责备那些将爱局限于言语，只在舌头上表达爱的人。他说：「我们爱，不要只在言语或舌头上，而要在行为和真理上。」
  - type: paragraph
    text:
      ru: 1Ин.3:19.И вот по чему узнаем, что мы от истины, и успокаиваем пред Ним сердца наши;
      cn: (约翰一书 3:19) 凭此我们得知我们是属乎真理的，并在祂面前安抚我们的心；
  - type: paragraph
    text:
      ru: По тому, что любим брата не словом, но делом и истиной. Как узнаем? Так, что говорящий одно, а делающий другое, не соглашающий дела с словом, есть лжец, а не истинен.
      cn: 因为我们爱弟兄，不单凭言语，更凭行为和真理。我们如何能知道呢？即是说，那言行不一，不使行为与言语相符的人，是个说谎者，而非真诚的。
  - type: paragraph
    text:
      ru: 1Ин.3:20.ибо если сердце наше осуждает нас, то кольми паче Бог, потому что Бог больше сердца нашего и знает все.
      cn: 约翰一书 3:20. 因为我们的心若定罪我们，上帝更是如此，因为上帝比我们的心更大，并且知道一切。
  - type: paragraph
    text:
      ru: 1Ин.3:21.Возлюбленные! если сердце наше не осуждает нас, то мы имеем дерзновение к Богу,
      cn: (约翰一书 3:21) 亲爱的！如果我们的心不定罪我们，那么我们就可以在上帝面前坦然无惧。
  - type: paragraph
    text:
      ru: 1Ин.3:22.и, чего ни попросим, получим от Него, потому что соблюдаем заповеди Его и делаем благоугодное пред Ним.
      cn: (约翰一书 3:22) 并且，凡我们所求的，必从祂得着，因为我们遵守祂的诫命，并行祂所喜悦的事。
  - type: paragraph
    text:
      ru: 'Это значит: чрез истинность (а истина будет в нас тогда, когда словам нашим будут соответствовать дела) мы успокоим совесть свою. Ибо словом«сердце»он называет совесть. Как же успокоим? Поставив себя в такое положение, чтобы произносить нам слова пред Свидетелем Богом; ибо это значат слова:"пред Ним". Если, говорит, не будем делать так, и совесть или сердце наше осуждает нас, то, очевидно, мы согрешаем. Если же мы во время греха не можем укрываться от совести своей, которая ограниченна, как и человек существо ограниченное, то тем более не можем укрыться от Бога, беспредельного и вездесущего. Смысл этого изречения такой: дети! не будем лжецами друг пред другом, любя одним только языком, но докажем любовь и делом. Поэтому узнаем, что мы от истины, то есть от Бога. И что говорим, будем говорить как бы перед Богом; а кто, хотя бы он был бесстыднее бесов, позволит себе лгать пред свидетелем Богом? Если же не будем делать так, но тогда, как говорим, что любим, сердце наше осуждает нас во лжи, то мы грешим. Как так? Потому что думаем укрыться от вездесущего Бога. Посему, возлюбленные, настроим себя так, чтобы быть нам неосужденными перед самими собой, будем ходить в истине друг пред другом, и тогда получим дерзновение пред Богом, а при этом дерзновении несомненно получим все, чего ни попросим у Него. Почему? Потому что соблюдаем заповеди Его. Ибо кого просят, того весьма много преклоняет к слушанию благопокорность просителей, только бы просили не сомневаясь. А как мы соблюдаем заповеди Его и делаем угодное пред Ним, то и будем надеяться, что молитвы наши будут не напрасны; потому что при искреннем взаимном расположении двоих один обыкновенно действует немедленно на пользу другого. Какую же заповедь Его мы соблюли? Ту, которая повелевает нам«любить друг друга»(Иоан. 13,34).'
      cn: 这意思是：借着真实（而真实在我们里面，便是当我们的言语与行为相符时），我们便使自己的良心得享平安。因为他以「心」这个词称呼良心。我们如何才能使之得享平安呢？通过使我们自己处于这样一种境地：在见证者上帝面前说出我们的话语；因为「在祂面前」就是这个意思。他说，如果我们不这样做，而我们的良心或我们的心定我们的罪，那么，显然我们便犯了罪。如果我们在犯罪之时不能躲避我们自己的良心，而这良心是有限的，正如人是有限的受造物一样，那么，我们更不能躲避那无限且无所不在的上帝。这番话语的含义是：孩子们啊！我们彼此之间不要作说谎者，不要仅用舌头去爱，而要用行动来证明爱。因此我们将知道，我们是属于真理的，也就是属于上帝的。我们所说的，也要如同在上帝面前所说的一样；谁会，即便他比魔鬼更无耻，竟敢在见证者上帝面前说谎呢？如果我们不这样做，而当我们说我们爱的时候，我们的心却因着虚谎而定我们的罪，那么我们便犯了罪。何以如此？因为我们以为能躲避那无所不在的上帝。因此，蒙爱者们啊，使我们自己调整到这样一种境地，好使我们在自己面前不被定罪，我们彼此在真理中行事为人，如此便在上帝面前获得坦然无惧；而借着这份坦然无惧，我们无疑地将从祂那里得到我们所祈求的一切。为何如此？因为我们遵守祂的诫命。因为，被祈求者，祈求者的顺从极大程度地使他乐意垂听，只要他们祈求时不带疑虑。既然我们遵守祂的诫命并做祂所喜悦的事，那么，我们便当盼望我们的祷告不会徒然；因为当两个人彼此真诚相待时，一方通常会立即为另一方行动以造福对方。我们遵守了祂哪一条诫命呢？就是那命令我们「彼此相爱」（约翰福音 13:34）的诫命。
  - type: paragraph
    text:
      ru: 1Ин.3:23.А заповедь Его та, чтобы мы веровали во имя Сына Его Иисуса Христа.
      cn: 约翰一书 3:23. 而祂的诫命就是：我们当相信祂的儿子耶稣基督的名。
  - type: paragraph
    text:
      ru: Слово«та"должно разуметь в значении причины, именно так:«потому что»заповедь Его есть веровать. Так как мы имеем заповедь веровать во имя Иисуса Христа, Сына Его, и любить друг друга, и мы сделали это, то отсюда и узнаем, что благодать Духа Его, Которого Он дал нам, утвердилась в нас. Нужно знать, что выражение«веровать во имя»Господа нашего употребляется во многих местах Писания. Что же значит«имя"? Конечно, не иное что, как волю Его, славу, честь. Например, в словах«велико имя Твое по всей земле»(Псал. 8,2) оно означает славу и честь, а в словах«покайтесь, и да крестится каждый из вас во имя Иисуса Христа»(Деян. 2,38) означает волю Его. Какая же воля Господа Иисуса? Крестить все народы«во имя Отца и Сына и Святого Духа»(Матф. 28,19).
      cn: 词语「та」应理解为表原因，即：「因为」祂的诫命是去相信。既然我们领受了去相信祂的儿子耶稣基督之名，以及彼此相爱的诫命，并且我们已经这样做了，那么由此我们就知道，祂所赐给我们的圣灵的恩典，已在我们里面得以确立。须知，「相信我们上主之名」这一表达在圣经中多处被使用。那么「名」是什么意思呢？当然，不外乎是祂的旨意、光荣、尊贵。例如，在「祢的名在全地何等伟大」（诗篇 8:2）这句话中，它指的是光荣和尊贵；而在「你们各人当悔改，奉耶稣基督的名受洗」（使徒行传 2:38）这句话中，它指的是祂的旨意。那么上主耶稣的旨意是什么呢？就是要使万民受洗，奉父、子、圣灵的名（马太福音 28:19）。
  - type: paragraph
    text:
      ru: И любили друг друга, как Он заповедал нам.
      cn: 并彼此相爱，正如祂吩咐我们。
  - type: paragraph
    text:
      ru: 1Ин.3:24.И кто сохраняет заповеди Его,  тот пребывает в Нем, и Он в том. А что Он пребывает в нас, узнаем по духу, который Он дал нам.
      cn: (约翰一书 3:24) 凡遵守祂诫命的，他就住在祂里面，祂也住在他里面。而祂住在我们里面，我们是借着祂所赐给我们的圣灵来知道的。
  - type: paragraph
    text:
      ru: 'Господь заповедал нам любить друг друга с истинным расположением. Когда же? Когда сказал:«как хотите, чтобы поступали с вами люди, так и вы поступайте с ними»(Лук. 6,31). Если мы любим, чтобы ближние наши имели к нам истинное и бесхитростное расположение, то и сами должны иметь к ним совершенно такое же расположение. А как это заповедь Господня, то, когда мы пребываем в Нем, тем более Он дарует нам Самого Себя. Ибо Он не может отречься Сам от Себя, то есть нельзя допустить, что Он напрасно дает нам заповеди Свои, и не оправдает их прежде всех Сам. Если же так, то, когда мы исполняем заповеданное Им, без сомнения, и Он послушает нас в прошениях наших, и дарование Его будет твердо в нас. Целая мысль такая: мы должны веровать во имя Сына Его Иисуса Христа, и любить друг друга истинно, как Он заповедал. Ибо соблюдающий заповеди Его в Нем пребывает, и Он в нем. А что Он пребывает в нас, это мы узнаем по духу или дарованию, которое Он дал нам. И если оно пребывает в нас ненарушимо, то, без всякого противоречия, даяние Его будет неотъемлемо. Когда же оно бывает ненарушимо? Когда мы из заповеданного Им нам о любви ничего не нарушаем по нерадению своему.'
      cn: 主吩咐我们以真挚的心意彼此相爱。什么时候呢？就是祂说：「你们愿意人怎样待你们，你们也要怎样待人」（路加福音 6:31）的时候。如果我们希望我们的近人对我们有真诚无伪的心意，那么我们自己也当对他们有完全同样的心意。既然这是主的吩咐，那么，当我们住在祂里面时，祂就更要将祂自己赐给我们。因为祂不能背弃自己，也就是说，不能容许祂白白地赐给我们祂的吩咐，并且不首先亲自成全它们。既然如此，那么，当我们遵行祂所吩咐的，毫无疑问，祂也必垂听我们的祈求，并且祂的恩赐必在我们里面坚定不移。其要旨是：我们当信祂的儿子耶稣基督的名，并且要真诚地彼此相爱，正如祂所吩咐的。因为遵守祂的吩咐的人住在祂里面，祂也住在那人里面。而祂住在我们里面，我们由此可知是借着祂赐给我们的圣灵或恩赐。而且，如果这恩赐在我们里面不被破坏地存留，那么，毫无抵触地，祂的赐予就必是不可剥夺的。什么时候它才是不被破坏的呢？就是当我们不因自己的疏忽，而违背祂所吩咐我们关于爱的一切时。
- type: heading1
  text:
    ru: Глава четвертая
    cn: 第四章
  children:
  - type: paragraph
    text:
      ru: 1Ин.4:1.Возлюбленные! не всякому духу верьте, но испытывайте духов, от Бога ли они, потому что много лжепророков появилось в мире.
      cn: (约翰一书 4:1) 亲爱的！不要相信每一个灵，但要试验诸灵，看他们是否出于上帝，因为世上已经出现了许多假先知。
  - type: paragraph
    text:
      ru: '1Ин.4:2.Духа Божия (и духа заблуждения)узнавайте так: всякий дух, который исповедует Иисуса Христа, пришедшего во плоти, есть от Бога.'
      cn: 约翰一书 4:2. 上帝的灵（以及那谬妄的灵）你们当这样辨认：凡是承认耶稣基督是成了肉身而来的灵，就是从上帝而来的。
  - type: paragraph
    text:
      ru: Разъяснив учение о любви к ближнему, указав в этой любви признак пребывания Духа, которого мы получили, апостол теперь присовокупляет признак для различия истинных братьев и ближних, дабы мы, имея в виду это различие, по поводу заповеди о любви не вошли в близкие отношения с лжебратиями, лжеапостолами и лжепророками, и тем не причинили себе великого вреда. Ибо, имея общение с ними, как единонравными, мы, во-первых, повредим самим себе, без опасения сообщая учение веры нечестивым и повергая святыню псам; потом – повредим тем, которые преданы нам. Ибо любовь наша к лжебратиям, лжеапостолам и лжепророкам многих расположит принимать их за учителей и без осторожности верить их учению, причем они вдадутся в обман из нашего обращения с ними. Какой же признак их?
      cn: 在阐明了爱邻人之教导，并指明在这爱中，有我们所领受的圣灵同在的标记之后，使徒现在附加一个标记，以便辨别真实的弟兄和邻人，以免我们，顾及到这区别，因着爱的诫命，不与假弟兄、假使徒和假先知建立亲密关系，并且因此不给自己造成巨大的损害。因为，与他们交往，如同与同心之人，我们，首先，会伤害我们自己，无所畏惧地将信仰的教导传给不敬虔之人，并把圣物丢给狗；其次——会伤害那些托付给我们的人。因为我们对假弟兄、假使徒和假先知的爱，会让许多人倾向于把他们当作教师，并毫无谨慎地相信他们的教导，并且他们会因我们与他们交往而被引入欺骗。那么他们的标记是什么呢？
  - type: paragraph
    text:
      ru: 'Следующий: всякий дух, то есть всякий, носящий звание пророка или апостола, который исповедует Господа Иисуса, пришедшего во плоти, есть от Бога, а который не исповедует этого, тот не от Бога, но достоинство его от антихриста, что вы и слышали.'
      cn: 凡灵，即凡身负先知或使徒职衔者，凡宣认主耶稣道成肉身而来者，是出于上帝的；而凡不宣认此者，就不是出于上帝的，他的权柄乃是出于敌基督的，这正是你们所听见的。
  - type: paragraph
    text:
      ru: Апостол немного выше (1Ин.2:18) говорил, что в мире появилось много антихристов, то есть предтечей антихриста. А исповедание пришествия Христова во плоти должно совершаться не на языке только, но и в делах, как говорит апостол Павел:«всегда носим в теле мертвость... Иисуса, чтобы и жизнь Иисусова открылась в теле нашем»(2Кор. 4,10). Итак, кто имеет в себе Иисуса действующего, умер для мира, живет уже не для мира, но для Христа, и носит Его не в Христовой только плоти, но и в своей собственной, тот от Бога. А кто живет не для Христа, но для самого себя и для мира, то есть для удовольствий мирских, тот не от Бога. Посему Павел и опять говорит:«если между вами зависть, споры и разногласия, то не плотские ли вы? и не по человеческому ли обычаю поступаете?»(1Кор. 3,3). Поступающий по обычаю человеческому не имеет Духа Христова; а кто не имеет Духа Христова, то есть не живет по учению Христову, тот не есть Христов.
      cn: 使徒在稍早前（约翰一书 2:18）曾说，世上已出现许多敌基督者，亦即敌基督者的前驱。而承认基督道成肉身之降临，不仅当在口舌上，亦当在行为中成就，正如使徒保罗所言：「我们身上常带着耶稣的死，好使耶稣的生也在我们肉身上显明出来」（哥林多后书 4:10）。因此，凡心中有耶稣行事作工的，已向世界而死，不再为世界，乃为基督而活，且不仅在基督的肉身中，亦在自己的肉身中承载祂的，便是属上帝的。而凡不为基督，却为自己和世界而活，亦即为世俗享乐而活的，便不属上帝。因此保罗又说：「你们中间既有嫉妒、纷争、分门别类，岂不是属肉体的吗？岂不是照着世人的样子行吗？」（哥林多前书 3:3）。照世人样式行事的，没有基督的圣灵；而凡没有基督的圣灵的，亦即不按基督的教导而活的，便不属基督。
  - type: paragraph
    text:
      ru: 1Ин.4:3.А всякий дух, который не исповедует Иисуса Христа, пришедшего во плоти, не есть от Бога, но это дух антихриста, о котором вы слышали, что он придет и теперь есть уже в мире.
      cn: (约翰一书 4:3) 凡不认耶稣基督是成了肉身而来的，那灵就不是出于上帝；这就是敌基督者的灵。你们曾听见说它要来，现在它已在世上了。
  - type: paragraph
    text:
      ru: Апостол говорит, что антихрист уже в мире; разумеется, не самолично, а в лице лжепророков, лжеапостолов и еретиков, предваряющих и приготовляющих его пришествие. А сам антихрист будет человек, носящий в себе сатану,«превозносящийся выше всего, называемого Богом или святынею»(2Фес. 2,4). Почему и запретит служить идолам (их разумел апостол под"святынею"), а себя одного будет выдавать за Бога.
      cn: 使徒说，敌基督已经在世上了；当然，他不是亲自降临，而是借着预示并预备他降临的假先知、假使徒和异端。而敌基督本人将是一个里面住着撒但的人，「高抬自己，超过一切称为上帝的，或受人敬拜的物」(2帖撒罗尼迦书 2:4)。因此，他将禁止敬拜偶像（使徒所指的「受人敬拜的物」就是偶像），而他自己将只称自己为上帝。
  - type: paragraph
    text:
      ru: 1Ин.4:4.Дети! вы от Бога, и победили их; ибо Тот, Кто в вас, больше того, кто в мире.
      cn: (约翰一书 4:4) 孩子们！你们是出于上帝的，并且已经胜过了他们；因为那在你们里面的，比那在世界里的更大。
  - type: paragraph
    text:
      ru: 1Ин.4:5.Они от мира, потому и говорят по-мирски, и мир слушает их.
      cn: (约翰一书 4:5) 他们属乎世界，所以说属世的话，世人便听从他们。
  - type: paragraph
    text:
      ru: 1Ин.4:6.Мы от Бога; знающий Бога слушает нас; кто не от Бога, тот не слушает нас.
      cn: (约翰一书 4:6) 我们属于上帝；认识上帝的，听从我们；不属于上帝的，不听从我们。
  - type: paragraph
    text:
      ru: 'Выше апостол указал признак пророков и апостолов Господних. Теперь прибавляет: вы, будучи детьми Божиими, победили их, то есть лжепророков. Почему? Потому, что Бог, сущий в вас, больше того, кто в мире, по духу которого решились жить лжепророки. Потом дает им еще другой признак лжепророков, в том, что немало печалило простецов из самих верных. Некоторые из них естественно могли скорбеть, видя, что тех многие принимают весьма усердно, а их презирают.'
      cn: 上文使徒指明了上主的诸先知和诸使徒的标记。现在他补充道：你们，作为上帝的儿女，已经战胜了他们，也就是假先知们。为什么呢？因为那在你们里面的上帝，大于那在世上的，假先知们正是按照其灵而活的。接着他给了他们假先知们的另一个标记，在于此，即这令真信徒中的不少平信徒感到忧伤。他们中的一些人，自然会感到悲伤，因为他们看到许多人非常热切地接纳那些人，而他们自己却被轻视。
  - type: paragraph
    text:
      ru: 'Апостол и говорит: не скорбите, если многие вас презирают, а их принимают; ибо подобное стремится к подобному: они от мира и говорят мирское, то есть учат плотским пожеланиям, почему и слушателей имеют таких же, то есть развратные – развратных. А мы, будучи от Бога и удалившись от мирских похотей, становимся для них неприятными. Нас же слушает тот, кто живет целомудренно, и посему знает Бога, и готов слушать нас. Об этом и Христос говорит:«кто имеет уши слышать, да слышит»(Матф. 11,15), то есть Он свидетельствует, что тот имеет уши, кто приготовился слушать с покорностью.'
      cn: 使徒说：「如果许多人藐视你们，却接纳他们，不要忧伤；因为同类相吸：他们属于世界，说属世的话，也就是说，教导肉体的私欲，因此他们的听众也是如此，也就是说，放荡的人吸引放荡的人。而我们，既然属于上帝，又远离了世俗的私欲，对他们来说就变得不悦了。听我们的人，是那些生活贞洁、因此认识上帝、并准备好顺服聆听我们的人。关于这一点，基督也说：「有耳可听的，就应当听」（马太福音 11:15），也就是说，他见证拥有耳朵的人，是那些准备好顺服聆听的人。」
  - type: paragraph
    text:
      ru: 1Ин.4:6.Посему-то узнаем духа истины и духа заблуждения.
      cn: (约翰一书 4:6) 因此我们认出真理的灵和谬妄的灵。
  - type: paragraph
    text:
      ru: 1Ин.4:7.Возлюбленные! будем любить друг друга, потому что любовь от Бога, и всякий любящий рожден от Бога и знает Бога.
      cn: (约翰一书 4:7) 亲爱的！我们当彼此相爱，因为爱是从上帝而来；凡爱人的，都是从上帝而生，并且认识上帝。
  - type: paragraph
    text:
      ru: 1Ин.4:8.Кто не любит, тот не познал Бога, потому что Бог есть любовь.
      cn: （约翰一书 4:8）不爱的，就未曾认识上帝，因为上帝是爱。
  - type: paragraph
    text:
      ru: 1Ин.4:9.Любовь Божия к нам открылась в том, что Бог послал в мир Единородного Сына Своего, чтобы мы получили жизнь через Него.
      cn: 约翰一书 4:9. 上帝对我们的爱，在此显明了：就是上帝将祂的独生子差遣到世上，使我们藉着祂得生命。
  - type: paragraph
    text:
      ru: 1Ин.4:10.В том любовь, что не мы возлюбили Бога, но Он возлюбил нас и послал Сына Своего в умилостивление за грехи наши.
      cn: (约翰一书 4:10) 爱就在此：不是我们爱上帝，而是祂爱了我们，并差遣了祂的儿子，为我们的罪作挽回祭。
  - type: paragraph
    text:
      ru: 'Выше апостол показал, с кем нужно обращаться и с кем не нужно; теперь как бы прилагает печать к сказанному: посему-то узнаем, кто имеет Духа истины, и кто – духа заблуждения, лжепророчества. Затем опять начинает речь о любви. Показав, что нужно любить некоторых, именно единонравных, возвращается к тому, что говорил в начале. Говорит, что любовь и любящий от Бога, что любящий, и один только он, рожден от Бога и знает Бога, а не имеющий любви не знает и Бога. Отчего же тот, кто не любит, не познает Бога? Это подтверждает следующим образом. Бог есть любовь. Это видно из того, что Он Сына Своего Единородного послал в мир, чтобы Он доставил нам истинную жизнь и мы ожили чрез Него. Ибо как благостью называется Бог потому, что по благости создал мир мысленный и чувственный, так, из любви к нам послав Единородного Сына Своего в мир, показал чрез сие, что Он есть и любовь. Посему и прибавляет:«в том любовь», то есть сим и доказывается, что Бог есть любовь. Потом, показывая превосходство любви Божией, говорит: Бог сделал это, то есть предал за нас Собственного Сына Своего, не потому, что мы любили Его, но первый начал благодетельствовать нам по любви и послал Сына Своего, и не только послал, но и собственной Его кровью соделал очищение наших грехов. Если же, говорит, Бог так возлюбил нас, хотя мы отнюдь не одинаковой с Ним природы, то гораздо более мы должны любить, любить сродных нам, и, узнав превосходство любви, оказывать ее другим. Ибо как виновен тот, кто не избирает достойное избрания, так похвала принадлежит тем, которые любят достойных любви, потому что они возлюблены. Мы же, расположив себя так, имеем то и другое: мы и любимы, потому что нас любит и воспринял к себе (в дети) Бог; мы и возлюблены, потому что любим ближних.'
      cn: 早前使徒已指明当与何人往来，不当与何人往来；如今似为所言加盖印记：因此可知晓，谁拥有真理的圣灵，谁拥有谬误与假预言的灵。接着，又复谈及爱。指明了当爱某些人，即是性情相同的人之后，便回溯到其开篇所言。他说，爱以及有爱的人皆源自上帝，有爱的人，且唯独他，是蒙上帝所生并认识上帝的；而不拥有爱的人则不认识上帝。那么，为何那不爱的人不认识上帝呢？他如此加以确证。上帝是爱。这可见于祂差遣祂的独生子降世，为要使祂赐予我们真生命，使我们藉着祂得生。盖因上帝被称为良善，乃是因祂以良善创造了可思议的世界与可感知的世界；同样，祂因爱我们而差遣祂的独生子降世，便借此显明祂也是爱。因此他补充说：「爱在此中」，亦即，借此便可证明上帝是爱。随后，他指出上帝之爱的卓越，言道：上帝行此，即为我们舍弃了祂自己的儿子，并非因为我们爱祂，而是祂首先因爱而开始施恩于我们，并差遣了祂的儿子，不仅差遣，更以祂自己的宝血成就了我们罪孽的洁净。那么，他说道，既然上帝如此爱我们，尽管我们绝非与祂本性相同，我们就更当去爱，爱与我们同类之人，并在认识到爱之卓越后，将爱施予他人。盖因不选择那值得选择之物的人是有罪的；同样，赞美属于那些爱慕那值得被爱之人的人，因为他们是被爱的。我们若如此安顿自身，便两者兼得：我们既是被爱的，因为上帝爱我们，并接纳我们为（祂的）儿女；我们也是被爱戴的，因为我们爱我们的近人。
  - type: paragraph
    text:
      ru: 1Ин.4:11.Возлюбленные! если так возлюбил нас Бог, то и мы должны любить друг друга.
      cn: 约翰一书 4:11。亲爱的！如果上帝如此爱我们，那么我们理当彼此相爱。
  - type: paragraph
    text:
      ru: 1Ин.4:12.Бога никто никогда не видел. Если мы любим друг друга, то Бог в нас пребывает, и любовь Его совершенна есть в нас.
      cn: (约翰一书 4:12) 任何人都从未见过上帝。如果我们彼此相爱，上帝就住在我们里面，祂的爱在我们里面是完全的。
  - type: paragraph
    text:
      ru: 1Ин.4:13.Что мы пребываем в Нем и Он в нас, узнаем из того, что Он дал нам от Духа Своего.
      cn: (约翰一书 4:13) 我们知道我们住在他里面，他也在我们里面，乃是因他将自己的圣灵赐给了我们。
  - type: paragraph
    text:
      ru: 1Ин.4:14.И мы видели и свидетельствуем, что Отец послал Сына Спасителем миру.
      cn: 约翰一书 4:14. 我们也看见了，并且作证，父差遣了子，为世界的救主。
  - type: paragraph
    text:
      ru: 'Мы и прежде замечали, что у апостола Иоанна в обычае повторять одно и то же об одном и том же. Так он и теперь поступает. Бога, говорит, никто никогда не видал. Говоря о любви к братьям, он в пример любви указал Бога, Который по любви к нам предал Единородного Сына Своего на смерть. Иной, выслушав сие, мог спросить: на каком же основании говоришь ты о предметах невидимых? В ответ на такой вопрос он говорит: я и сам говорю, что Бога никто никогда не видел; но из любви друг к другу мы узнаем, что Бог есть в нас. И говорит это справедливо, потому что многие невидимые для нас предметы мы познаем из их действий.'
      cn: 我们也曾注意到，使徒约翰惯常反复论述同一件事。他现在也正是如此。他说，从未有人见过上帝。谈及对弟兄的爱时，他将上帝作为爱的典范，上帝因爱我们，将祂的独生子舍于死地。有人听了这话，可能会问：你凭什么谈论不可见的事物呢？对此疑问，他说：我自己也说从未有人见过上帝；但从彼此相爱中，我们便得知上帝在我们里面。他这样说是公正的，因为许多对我们而言不可见的事物，我们都是从它们的作为中得知的。
  - type: paragraph
    text:
      ru: Например, души никто не видал, но из действий и движений мы убеждаемся, что она в нас есть и действует. Так и любовь Божию к нам мы узнаем чрез некоторое движение и действие. Если в этом нет ничего несообразного, то и сей святой муж прилично от действия доказывает, что Бог есть в нас. Какое же это действие? Чистая любовь к ближним нашим. Она есть признак нашего пребывания в Нем и Его в нас и потому еще, что Он дал нам от Духа Своего. Ибо чистый рождает чистое и непорочное. И как чрез чистую любовь мы имеем общение с Ним, то отсюда мы, видевшие Его по плоти, познали и свидетельствуем, что Отец послал Его, Спасителя миру. Чтобы совершеннее утвердить нас в таком нашем познании, Он и Сам давал объяснение о Своем Лице.
      cn: 例如，灵魂无人得见，但从其行动和动向，我们确信它在我们里面存在并运行。照样，上帝对我们的爱，我们藉着某些动向和行动而得知。若这并无不妥之处，那么这位圣者便恰当地从行动来证明上帝在我们里面。那么这是何种行动呢？是对我们近人的纯洁之爱。这是我们住在他里面、他也在我们里面的标志，并且还因为他将自己的圣灵赐给了我们。因为纯洁者生出纯洁无瑕之物。并且，正如我们藉着纯洁之爱与他相通，那么由此，我们这些曾按肉身见过他的人，便认识并作证父差遣了他，即世界的救主。为了更完全地坚固我们这种认识，他也亲自对自己的位格作了解释。
  - type: paragraph
    text:
      ru: Иногда говорил:«Я исшел от Отца, и пришел в мир»(Иоан. 16,28), то есть Отец из любви к нам послал с неба в мир Единородного Сына Своего. Иногда еще яснее:«так возлюбил Бог мир, что отдал Сына Своего Единородного, дабы всякий, верующий в Него, не погиб»(Иоан. 3,16); и:«Я пришел не судить мир, но спасти мир»(Иоан. 12,47). Итак, мы и сами видели, и от Единородного, сущего в недре Отчем (Иоан. 1,18), слышали, и из действия – взаимной любви познаем, что Бог в нас, и дал нам от Духа Своего, и мы в общении с Ним.
      cn: 有时他说：「我从父出来，来到世界」(约翰福音 16:28)，也就是说，父出于对我们的爱，从天上差遣祂的独生子到世上。有时他更清楚地说：「上帝爱世人，甚至将祂的独生子赐给他们，叫一切信祂的，不至灭亡」(约翰福音 3:16)；又说：「我来不是要审判世界，而是要拯救世界」(约翰福音 12:47)。因此，我们自己亲眼看见，也从那在父怀里的独生子（约翰福音 1:18）亲耳听闻，也从那行为——彼此相爱——中得知，上帝在我们里面，并已将祂的灵赐给我们，并且我们与祂相通。
  - type: paragraph
    text:
      ru: 1Ин.4:15.Кто исповедует, что Иисус есть Сын Божий, в том пребывает Бог, и он в Боге.
      cn: (约翰一书 4:15) 凡宣认耶稣是上帝之子的人，上帝就住在他里面，他也住在上帝里面。
  - type: paragraph
    text:
      ru: 1Ин.4:16.И мы познали любовь, которую имеет к нам Бог, и уверовали в нее. Бог есть любовь, и пребывающий в любви пребывает в Боге, и Бог в нем.
      cn: (约翰一书 4:16) 我们认识了上帝对我们所怀有的爱，并且相信了这爱。上帝是爱，那住在爱里的，就住在上帝里面，上帝也住在他里面。
  - type: paragraph
    text:
      ru: 'Это относится к сказанному немного выше (ст. 2): всякий дух, который исповедует Господа Иисуса, пришедшего во плоти. Апостол достаточно доказал, что верующие суть дети Божии и что Бог в них пребывает; а доказал это любовью друг к другу, потому что дан им Дух Святый. После сего и возвращается к упомянутой речи и говорит: кто исповедует, что Иисус есть Сын Божий, в том Бог пребывает, потому что, как выше сказано, всякий дух, исповедающий Иисуса Христа, пришедшего во плоти, есть от Бога. Этими словами апостол выражает и другую истину, что те, которые так исповедуют и имеют в себе пребывающего Духа, то есть Бога, и сами пребывают в Боге. Каким образом? Чрез любовь друг к другу. А вспомнив о любви, он повторяет все высказанное им о любви, для того, чтобы более утвердить учение о любви.'
      cn: 这指的是稍微前面所说的（第2节）：凡承认主耶稣是成了肉身而来的灵。使徒已充分证明，信者是上帝的儿女，并且上帝居住在他们里面；他以彼此相爱来证明了这一点，因为圣灵已赐予他们。此后，他便回到前面所提及的话题并说：凡承认耶稣是上帝之子的人，上帝就居住在他里面，因为，如上所述，凡承认耶稣基督是成了肉身而来的灵，都是出于上帝。使徒借此言语也表达了另一个真理：凡如此承认并拥有居住在他们里面的圣灵，即上帝的人，他们自己也居住在上帝里面。以何种方式呢？借由彼此相爱。当他回想起爱时，他便重复他所说过的一切关于爱的话语，为要更加坚固爱的教导。
  - type: paragraph
    text:
      ru: 1Ин.4:17.Любовь до того совершенства достигает в нас, что мы имеем дерзновение в день суда, потому что поступаем в мире сем, как Он.
      cn: （约翰一书 4:17）爱在我们里面得以完全，以致我们在审判日可以坦然无惧，因为我们在这世上行事为人，如同祂一样。
  - type: paragraph
    text:
      ru: 1Ин.4:18.В любви нет страха, но совершенная любовь изгоняет страх, потому что в страхе есть мучение.
      cn: (约翰一书 4:18) 爱里没有惧怕，但完全的爱驱逐惧怕，因为惧怕里有刑罚。
  - type: paragraph
    text:
      ru: 'Бог есть свет, и святые Его, по изречению Евангелия (Матф. 5,14), суть свет мира и чужды страха мучения, потому что исполнены любовью к Богу. Хочу, говорит апостол, чтобы вы усовершились в любви так, чтобы в день суда нам иметь дерзновение пред Богом, потому что и Он есть Судия, по собственному Его изречению:«Отец не судит никого, но весь суд отдал Сыну»(Иоан. 5,22). И что наше дерзновение будет пред Богом вочеловечившимся, апостол выразил в следующих словах:«поступаем в мире сем, как Он», то есть когда уже доказали, что Бог в нас и мы в Нем, то мы сами себе свидетели о совершенстве любви. Как Он в мире был непорочен и чист, почему и говорил:«идет князь мира сего, и во Мне не имеет ничего»(Иоан. 14,30); так и мы будем в Боге и Бог в нас. Если Он есть учитель и податель нашей чистоты, то мы должны носить Его в мире чисто и непорочно,«всегда нося в теле своем мертвость Его»(2Кор. 4,10). Если будем так жить, то будем иметь дерзновение пред Ним и будем свободны от всякого страха. Ибо, достигши добрыми делами совершенства в любви, будем далеки от страха. В подтверждение сего и прибавляет: совершенная любовь изгоняет страх. Какой же страх? Сам он говорит, что страх мучения.'
      cn: 上帝是光，而祂的圣徒，依据福音书的教训（马太福音 5:14），是世上的光，且远离受苦的惧怕，因为他们充满了对上帝的爱。使徒说，我愿你们在爱里得以完全，以致在审判之日，我们能对上帝有坦然无惧的心，因为祂也是审判者，依据祂自己的教诲：「父不审判任何人，却将一切的审判都交给了子」（约翰福音 5:22）。并且，我们的坦然无惧将是在降生为人的上帝面前，使徒在以下的话语中表达了这一点：「我们在此世生活，如同祂一样」，也就是说，当我们已经证明上帝在我们里面，我们也在祂里面时，我们自己就是爱之完全的见证。如同祂在世上是无瑕无玷、洁净的，因此祂也曾说：「这世界的王将到；他在我里面一无所有」（约翰福音 14:30）；照样，我们也将住在上帝里面，上帝也住在我们里面。如果祂是我们的纯洁的教师和赐予者，那么我们就应当在世上洁净无瑕地承载祂，「常常在我们身体上带着祂的死」（哥林多后书 4:10）。如果我们如此生活，那么我们就会在祂面前有坦然无惧的心，并且免于一切的惧怕。因为，借由善行在爱里达到完全，我们将远离惧怕。为证实此点，他接着说：完全的爱驱除惧怕。是哪种惧怕呢？他自己说，是受苦的惧怕。
  - type: paragraph
    text:
      ru: 'Ибо можно иного любить и по страху наказания. Но такой страх не есть совершенный, то есть несвойствен совершенной любви. Сказав это о совершенной любви, обязательно говорит, что мы должны любить Бога, потому что Он прежде возлюбил нас, и как Он прежде сотворил нам благо, то мы тем усерднее должны принуждать себя к воздаянию за оное. Основываясь на словах Давида:«бойтесь Господа, святые Его, ибо нет скудости у боящихся Его»(Псал. 33,10), иные спросят: как теперь Иоанн говорит, что совершенная любовь изгоняет страх? Неужели святые Божии так несовершенны в любви, что им заповедуется бояться? Отвечаем. Страх двоякого рода. Один – предначинательный, к которому примешивается мучение.'
      cn: '因为人可以因惧怕惩罚而爱人。但这种惧怕不是完全的，即它不属于完全的爱。


        在谈到完全的爱时，必然提到我们应该爱上帝，因为祂首先爱了我们，并且祂首先赐予了我们恩惠，因此我们更当努力强迫自己去回报祂。基于大卫的话语：「你们当敬畏上主，祂的圣者啊，因为敬畏祂的，一无所缺。」(诗篇 33:10)，有人会问：既然如此，约翰现在又怎么说完全的爱能驱除惧怕呢？难道上帝的圣者们在爱里是如此不完全，以至于他们被吩咐要惧怕吗？


        我们回答说：惧怕有两种。一种是初步的惧怕，其中夹杂着折磨。'
  - type: paragraph
    text:
      ru: Человек, совершивший худые дела, приступает к Богу с боязнью, и приступает для того, чтобы не быть наказанным. Это – страх предначинательный. Другой страх – совершенный. Этот страх свободен от такой боязни; почему и называется чистым и пребывающим вовек (Псал. 18,10). Что же это за страх, и почему он совершенный? Потому, что имеющий его совершенно восхищен любовью и всячески старается о том, чтобы у него ничего не недоставало такого, что сильно любящий должен сделать для любимого.
      cn: 行恶之人，带着惧怕趋近上帝，是为了免受惩罚。这便是初阶的畏惧。另一种畏惧是全备的。这种畏惧没有那种惧怕；因此被称为纯全的，并永存不朽的（诗篇 18:10）。那么，这是一种怎样的畏惧，它为何是全备的呢？因为拥有它的人完全被爱所吸引，并竭尽所能地去努力，务使深爱者当为所爱者所做的一切，他都毫无欠缺。
  - type: paragraph
    text:
      ru: 1Ин.4:18.Боящийся несовершен в любви.
      cn: （约翰一书 4:18）有惧怕的，在爱中未臻全备。
  - type: paragraph
    text:
      ru: 1Ин.4:19.Будем любить Его, потому что Он прежде возлюбил нас.
      cn: (约翰一书 4:19) 我们爱祂，因为祂首先爱了我们。
  - type: paragraph
    text:
      ru: Под страхом здесь разумеется страх предначинательный. Кто искренно любит Бога, тот творит угодное Ему не по страху наказания, а по влечению к добродетели и по любви к Богу, не ограждая себя даже законным страхом, заключающимся в любви к хорошему. И тот страх, который делает что-нибудь для того, чтобы не подпасть наказанию, тождествен с первым. Посему и прибавлено:«в страхе есть мучение».
      cn: 在此，「恐惧」指的是最初的恐惧。凡是真心爱上帝的人，行祂所喜悦的事，不是因为害怕惩罚，而是出于对美德的向往和对上帝的爱，甚至不以包含在对良善之爱中的合乎律法的恐惧来约束自己。而那种为了不遭受惩罚而做事的恐惧，与最初的恐惧是相同的。因此又加上：「在恐惧中，有苦楚。」
  - type: paragraph
    text:
      ru: '1Ин.4:20.Кто говорит: «я люблю Бога», а брата своего ненавидит, тот лжец: ибо не любящий брата своего, которого видит, как может любить Бога, Которого не видит?'
      cn: （约翰一书 4:20）谁说：「我爱上帝」，却恨他的弟兄，他就是说谎的；因为不爱他所看见的弟兄，怎能爱他所看不见的上帝呢？
  - type: paragraph
    text:
      ru: 'Выше апостол с настойчивостью доказал, что любовь должна быть взаимная, переходящая от Бога к нам и от нас к Богу; присовокупил к сему, что если Бог так возлюбил нас, то и мы должны любить друг друга. Теперь – снова возводит речь к тому же и говорит: так как на нас лежит долг любить брата, по примеру любви Бога к нам, и, воздавая любовью Богу, мы удовлетворяем этому долгу; то нам непременно должно любить брата для совершеннейшего доказательства любви к Богу. Ибо если этого не будет, то не сохранится и любовь наша к Богу, так как будет нарушен долг по отношению к ближним, долг, вытекающий из любви к Богу. Прибавляет и еще более сильное слово на обличение тех, которые хотят извращать божественную любовь.'
      cn: 上文，使徒坚定地证明，爱应当是相互的，从上帝到我们，也从我们到上帝；他又补充说，如果上帝如此爱了我们，那么我们也应当彼此相爱。现在，他又回到同一主题，并说：既然我们有责任爱弟兄，效法上帝爱我们的榜样，并且，当我们以爱回报上帝时，我们便履行了这项责任；那么我们务必爱弟兄，为了更完全地证明我们对上帝的爱。因为如果缺乏这一点，我们对上帝的爱也无法维系，因为对近人的责任会被违背，而这项责任是源于对上帝的爱。他又加上了更强烈的话语，斥责那些想要扭曲神圣之爱的人。
  - type: paragraph
    text:
      ru: 'Апостол говорит как бы так: любовь, очевидно, образуется чрез обращение друг с другом; обращение же предполагает, что человек видит своего брата и по обращению с ним еще более привязывается к нему любовью; ибо видение весьма много привлекает к любви. Если же так, то кто ни во что ставит гораздо более влекущее к любви, не любит брата, которого видел, как может быть признан истинным, когда говорит, что любит Бога, Которого не видел, Который ни в обращении с ним, ни объемлется никаким чувством? Если кто-нибудь бесстыдно будет говорить, что Бога любит, а брата ненавидит, тот, извращая божественную любовь, оказывается сверх сего и преступником следующей Его заповеди:«по тому узнают все, что вы Мои ученики, если будете иметь любовь между собою»(Иоан. 13,35). Посему, кто любит Бога и старается быть Его учеником, тот, по заповеди Его, любит и брата своего.'
      cn: 圣使仿佛这样说：爱显然是通过彼此相处而形成的；而相处则意味着人看见他的弟兄，并通过与他相处，会更深地以爱与他结合；因为看见能极大地引人向爱。既然如此，那轻视更能引人向爱的事物，不爱他所看见的弟兄的人，当他说他爱那未曾看见，既无法与他相处，也无法为任何感官所感知的上帝时，又怎能被承认为真实呢？若有人不知羞耻地说他爱上帝却恨恶弟兄，那这人，除了歪曲了神圣之爱外，还成了祂以下诫命的冒犯者：「你们若彼此相爱，众人因此就认出你们是我的门徒了」（约翰福音 13:35）。因此，凡爱上帝并努力成为祂门徒的人，都必照着祂的诫命，爱他自己的弟兄。
  - type: paragraph
    text:
      ru: 1Ин.4:21.И мы имеем от Него такую заповедь, чтобы любящий Бога любил и брата своего.
      cn: （约翰一书 4:21）我们从祂领受了这样一条诫命：爱上帝的，也当爱自己的弟兄。
- type: heading1
  text:
    ru: Глава пятая
    cn: 第五章
  children:
  - type: paragraph
    text:
      ru: 1Ин.5:1.Всякий верующий, что Иисус есть Христос, от Бога рожден, и всякий, любящий Родившего, любит и Рожденного от Него.
      cn: 约翰一书 5:1凡相信耶稣是基督的，都是从上帝所生；并且凡爱那生他的，也爱那由祂所生的。
  - type: paragraph
    text:
      ru: 1Ин.5:2.Что мы любим детей Божиих, узнаем из того, когда любим Бога и соблюдаем заповеди Его.
      cn: (约翰一书 5:2) 我们爱上帝的儿女，由此可知，乃是当我们爱上帝并遵守祂的诫命的时候。
  - type: paragraph
    text:
      ru: И это говорится в подтверждение вышесказанного. Если мы от Учителя получили заповедь любить друг друга, то, без сомнения, если веруем, что Учитель наш Иисус есть Христос, а Христос Он в том смысле, что есть Бог и вместе человек, должны соблюдать и заповеди Его, как Учителя и как Бога. Веруя же, что Он есть Бог, мы получаем имя детей Его, как и в Евангелии сказано:«тем, которые приняли Его, дал власть быть чадами Божиими»(Иоан. 1,12), то есть, которые уверовали в Него, те и стали детьми Его. Если же мы родились от Него, то, без сомнения, должны и оказывать должное Родителю, то есть любить Родившего. Если же все мы, уверовавшие, родились от Него, то мы должны любить и друг друга и как братья, и как рожденные от Него.
      cn: 而这正是为证实以上所言。如果我们从导师那里领受了彼此相爱的诫命，那么，毫无疑问，如果我们相信我们的导师耶稣是基督，而基督祂是上帝且同时是人，我们就必须遵守祂的诫命，既是作为导师的，也是作为上帝的。而我们相信祂是上帝，我们就获得了作祂子女的名分，正如福音书所言：「凡接待祂的，祂就赐他们权柄作上帝的儿女」（约翰福音 1:12），也就是说，凡信祂的，都成了祂的子女。既然我们是从祂而生，那么，毫无疑问，我们也当对生育者尽应尽之责，也就是爱生育者。既然我们所有信祂的人都是从祂而生，那么我们就必须彼此相爱，既是作为弟兄姊妹，也是作为从祂而生的人。
  - type: paragraph
    text:
      ru: В подтверждение сего апостол и говорит, что любящий родившего любит и рожденного от него. Потом опять говорит, что любовь к братьям или чадам Божиим доказывает любовь к Родившему. Выше он говорил, что любящий Бога любит и брата своего, а теперь говорит, что любящий детей Божиих любит и Бога, и любовь к брату поставляет доказательством любви к Богу.
      cn: 为证实此言，使徒也说，爱生者的也爱从他所生者。然后他又说，对弟兄或上帝儿女的爱证明了对生者的爱。早先他说过，爱上帝的也爱自己的弟兄，而现在他说，爱上帝的儿女的也爱上帝，并将对弟兄的爱视为爱上帝的证据。
  - type: paragraph
    text:
      ru: 1Ин.5:3.Ибо это есть любовь к Богу, чтобы мы соблюдали заповеди Его. И заповеди Его не тяжки.
      cn: 约翰一书 5:3. 因为这就是爱上帝，就是要我们遵守祂的诫命；并且祂的诫命并不沉重。
  - type: paragraph
    text:
      ru: 1Ин.5:4.Ибо всякий, рожденный от Бога, побеждает мир; и сия есть победа, победившая мир, вера наша.
      cn: (约翰一书 5:4) 因为凡从上帝而生的，必胜过世界；这就是那胜过世界的胜利，我们的信德。
  - type: paragraph
    text:
      ru: 'Связь такая: любовь состоит в том, чтобы мы соблюдали заповеди Его, потому что всякий, рожденный от Бога, побеждает мир. Поскольку полным доказательством любви к Богу апостол указал соблюдение заповедей, а некоторым думалось, что заповеди Божии тяжелы, то и говорит: и заповеди Его не тяжки. Ибо что тяжелого в деле любви к брату? Что, например, тяжелого в том, чтобы посетить узника в темнице? Ибо повелевается не выпустить из темницы, что было бы трудно, а только посетить. И больного повелевается не освободить от болезни, а только посетить. И голодному не повелевает предложить стол из многих блюд, или нагому подать одежду, приготовленную из драгоценной материи, но доставить крайне нужное, чего ищет голодный и нагой. Сказав это, указывает и другое побуждение к любви. Какое? Победу. Говорит, что, чрез любовь к брату соделывая себя детьми Божиими, вы имеете уже и воздаяние за это доброе качество, – победу над миром; ибо рожденный от Бога побеждает мир. Потом объясняет, в чем состоит победа и чрез что она совершается; тем и другим называет веру, то есть веру в Бога, которая, родившись от Бога, победила и прогнала всякое неверие, и ни иудей, ни эллин, ни еретик, не силен против нее. А как вера побеждает не одна, сама по себе, а вместе с имеющим ее, то прибавляет: и кто побеждает мир, как не тот, кто верует, что Иисус есть Сын Божий? Кто же сей Иисус? Иисус Христос, пришедший водой и кровию.'
      cn: 这种关联是：爱在于我们遵守祂的诫命，因为凡由上帝所生者，必能胜过世界。既然使徒指出遵守诫命是爱上帝的完全证据，而有些人认为上帝的诫命是沉重的，因此他说道：祂的诫命并不沉重。因为爱弟兄之事有何沉重呢？例如，探访狱中囚犯有何沉重呢？因为所命令的并非释放囚犯出狱（那将是困难的），而只是探访。同样，所命令的并非解除病患的疾病，而只是探访。亦未命令向饥者摆设多道菜肴的宴席，或向赤身者提供用珍贵材料制成的衣裳，而是提供饥者和赤身者所急需的。说了这些之后，他指出了另一个爱的动机。是什么？胜利。他说，借着爱弟兄而使自己成为上帝的儿女，你们就已获得这美好品德的报偿，——即胜过世界；因为凡由上帝所生者，必能胜过世界。随后他解释胜利包含什么，以及它如何实现；他将这两者都称为信德，亦即对上帝的信德，这信德既由上帝所生，便已胜过并驱逐了所有不信，无论是犹太人、希腊人还是异端，都不能胜过它。然而，信德并非独自（凭自身）取胜，而是与拥有它的人一同取胜，于是他补充道：谁能胜过世界呢？岂不是那信耶稣是上帝之子的人吗？那么，这位耶稣是谁呢？耶稣基督，借着水与血而来的。
  - type: paragraph
    text:
      ru: 1Ин.5:5.Кто побеждает мир, как не тот, кто верует, что Иисус есть Сын Божий?
      cn: (约翰一书 5:5) 谁能胜过世界呢？岂不是那相信耶稣是上帝之子的人吗？
  - type: paragraph
    text:
      ru: 1Ин.5:6.Сей есть Иисус Христос, пришедший водою и кровию и Духом, не водою только, но водою и кровию.
      cn: (约翰一书 5:6) 这就是耶稣基督，他是藉着水、血和圣灵而来的；不只是藉着水，更是藉着水和血而来的。
  - type: paragraph
    text:
      ru: 'В словах«всякий, рожденный от Бога», апостол упомянул об усыновлении Богу и о рождении. А это вместе совершается чрез святое крещение. Посему говорит: Сей есть пришедший водой и кровию Иисус Христос, возрождающий и делающий нас сынами Божиими. Ибо это подразумевается и как следствие в словах:«рожденный от Бога»побеждает мир. Как«рожденный»? Водой и кровию. Ибо пришедший Иисус Христос возрождает водой и кровию. И опять прибавляет с повторением слова: не водой только возрождающий, но водой и кровию. Ибо хочет прежде доказать прославление усыновляющего нас Христа, потому что прежде усыновлен Богом человек, сущий во Христе, а потом Христос чрез Свое усыновление даровал и нам такое достоинство. А сыновство Его объявлено трижды: один раз при крещении на Иордане, когда Отец свыше свидетельствовал, что крещаемый есть Сын возлюбленный. Итак, Иисус пришел"водой", то есть объявлен Сыном Божиим чрез свидетельство Отца при крещении в воде."Кровию", когда, идя на крест, говорил:«прославь Меня Ты, Отче!»и когда принесся глас:«и прославил, и еще прославлю», который слышавшие приняли за гром (Иоан. 17:5,Иоан.12:28, 29)."Духом", когда как Бог воскрес из мертвых; ибо воскрешать Самому Себя свойственно одному только Богу, а словом Дух называется Бог, как можно видеть в изречении:«Бог есть дух»(Иоан. 4,24).'
      cn: '在「凡从上帝而生」的话语中，使徒提到了被上帝收纳为义子以及重生。而这两者是藉着圣洗一同成就的。因此说：「这正是藉水和血而来的耶稣基督，祂使我们重生，并使我们成为上帝之子们。」因为这含义以及其结果都隐含在「凡从上帝而生，就胜过世界」这句话中。如何「重生」？是藉着水和血。因为降临的耶稣基督是藉着水和血使人重生的。又再次强调说：不是单单藉水使人重生，而是藉着水和血。因为（使徒）首先要证明那收纳我们为义子的基督的荣耀，因为首先是那在基督里的人被上帝收纳为义子，然后基督又藉着祂自己被收纳为义子，也将这份尊贵赐予了我们。而祂的这种子身份被宣明了三次：一次是在约旦河受洗之时，那时圣父从上亲证，受洗者是祂的爱子。因此，耶稣是「藉着水」而来的，也就是说，祂在水中受洗时，藉着圣父的见证被宣明为上帝之子。


        「藉着血」，是当祂走向十字架时说：「父啊，愿祢荣耀我！」以及有声音发出：「我已经荣耀了，还要再荣耀。」那些听见的人以为是打雷。（约翰福音 17:5，约翰福音 12:28-29）「藉着灵」，是当祂作为上帝从死里复活时；因为使自己复活唯独是上帝所特有的，而「灵」这个词指的是上帝，正如在「上帝是灵」这句话中可见。（约翰福音 4:24）'
  - type: paragraph
    text:
      ru: Итак, при свидетельстве трех (крещения, креста и воскресения) о сыновстве Иисуса, сыновство Господа непререкаемо. А чрез Свое сыновство, как начаток всего рода человеческого, Он даровал и нам право быть сынами Божиими. И сии три в одном Христе. Ибо это значит выражение:«и сии три едино», то есть по отношению к свидетельству о Христе. Нужно знать, что некоторые из отцов слово Дух разумели не о воскресении Христа, но об Отце, когда Он воззвал на Иордане:«Сей есть Сын Мой возлюбленный, в Котором Мое благоволение»(Матф. 3,17), так как Бог есть Дух, как мы выше сказали.
      cn: 所以，有三项见证（洗礼、十字架和复活）论及耶稣的子性，主的子性是无可争议的。藉着祂的子性，作为全人类的初熟果，祂也赐予了我们成为上帝儿子的权利。这三项都在一位基督里。因为这正是「这三者合一」这表达的含义，也就是说，就对基督的见证而言。需知，一些教父将「圣灵」一词理解为并非指基督的复活，而是指父，当祂在约旦河边呼喊：「这是我的爱子，我所喜悦的」（马太福音 3:17）时，因为上帝是灵，正如我们上文所述。
  - type: paragraph
    text:
      ru: 'Сказав это, подтверждает слова свои доказательством от меньшего. Если мы принимаем свидетельство человеческое о чем-либо, не тем ли справедливее должны принять свидетельство большее, от Бога? Ибо это свидетельство о Сыне Божием, то есть Христе, не от Самого ли Бога? Итак, верующий в Сына Божия, что Он есть Бог, как Сын Божий, имеет свидетельство в самом себе, потому что верующий и сам усыновлен чрез Иисуса, усыновленного Богом. А неверующий виновен в двух отношениях: в неверии, представляя Бога лжецом, и в том, что лишает себя усыновления, а чрез это – жизни вечной, которую и Христос имеет в Самом Себе, как в Евангелии сказано:«в Нем была жизнь»(Иоан. 1,4). Посему кто имеет в себе Сына чрез крещение, тот имеет и жизнь, ибо все мы, крестившиеся во Христа,«облеклись во Христа»(Гал. 3,27). А кто не имеет Сына Божия чрез крещение, тот не имеет и жизни, тот мертв. Ибо принимая нас, мертвых прегрешениями, Он воскрешает чрез святое крещение. Каким образом? Потому что кто чрез погружение в крещении спогребся со Христом, тот мертв для мира, то есть для мирских прихотей, и живет уже не для мира, но для Христа.'
      cn: 说完这些，他借着由小及大的论证，证实了自己的话语。如果我们接受关于某事的属人的见证，那么岂不更当接受那更大的、来自上帝的见证吗？因为这关于上帝之子、即基督的见证，难道不是出自上帝祂自己吗？因此，凡相信上帝之子、即祂是上帝、是上帝之子的人，在他自己里面就有了这见证，因为信徒自己也借着那被上帝收纳为子的耶稣而获得嗣子的名分。而不信者则有双重罪过：一是他的不信，将上帝视作说谎者；二是他剥夺了自己嗣子的名分，且因此失去了永生，而基督也拥有这永生在祂自己里面，正如福音书所说：「在祂里面有生命」(约翰福音 1:4)。因此，凡借着洗礼而在自己里面拥有圣子的人，他就拥有生命，因为我们所有受洗归入基督的人，都「披戴了基督」(加拉太书 3:27)。而凡借着洗礼而没有上帝之子的人，他就没有生命，他是死的。因为祂接纳我们这些因罪而死的人，祂借着圣洗使我们复活。是以何种方式呢？因为凡借着洗礼中的浸没与基督同被埋葬的人，他就向世界死了，也就是说，向世俗的欲求死了，并且不再为世界而活，而是为基督而活。
  - type: paragraph
    text:
      ru: И Дух свидетельствует о Нем, потому что Дух есть истина.
      cn: 而圣灵为祂作见证，因为圣灵就是真理。
  - type: paragraph
    text:
      ru: 'Блж. Феофилакт опустил здесь следующий (седьмой) стих:'
      cn: 圣奥赫里德的狄奥菲拉克在此处省略了以下（第七）节：
  - type: paragraph
    text:
      ru: '1Ин.5:7.Ибо три свидетельствуют на небе: Отец, Слово и Святый Дух; и Сии три суть едино.'
      cn: 约翰一书 5:7. 因为在天上有三位作见证的：父、道和圣灵；并且这三位乃是一。
  - type: paragraph
    text:
      ru: Причиной этого, конечно, то, что у него был под руками такой текст Нового Завета, в котором нет этого стиха. Между тем стих этот есть во многих других списках Нового Завета, употреблялся св. отцами и писателями церковными, необходимо требуется составом речи апостольской, короче говоря, этот стих, несомненно, подлинный. –Макар.  Прав. догм. богосл. т. 1, с. 235–241. Спб.1850.
      cn: '这当然是因为他手头有这样一份新约文本，其中没有这一节经文。然而，这一节经文却出现在许多其他的新约抄本中，为圣教父和教会作家所引用，为使徒言论的结构所必需，简而言之，这一节经文，无疑是真实的。


        —马卡里，《正统教义神学》，卷一，页235–241。圣彼得堡，1850年。'
  - type: paragraph
    text:
      ru: '1Ин.5:8.И три свидетельствуют на земле: дух, вода и кровь, и сии три об одном.'
      cn: (约翰一书 5:8) 又有三样在地上作见证：就是圣灵、水与血，这三样也都归于一。
  - type: paragraph
    text:
      ru: 1Ин.5:9.Если мы принимаем свидетельство человеческое, свидетельство Божие – больше, ибо это есть свидетельство Божие, которым Бог свидетельствовал о Сыне Своем.
      cn: 约翰一书 5:9。如果我们接受人的见证，上帝的见证更大，因为这正是上帝的见证，就是上帝为祂的儿子所作的见证。
  - type: paragraph
    text:
      ru: 1Ин.5:10.Верующий в Сына Божия имеет свидетельство в себе самом; не верующий Богу представляет Его лживым, потому что не верует в свидетельство, которым Бог свидетельствовал о Сыне Своем.
      cn: 约翰一书 5:10. 信上帝之子的人，在他自己里面就有见证；不信上帝的人，将祂当作说谎的，因为他不信那上帝为祂自己的儿子所作的见证。
  - type: paragraph
    text:
      ru: 1Ин.5:11.Свидетельство сие состоит в том, что Бог даровал нам жизнь вечную, и сия жизнь в Сыне Его.
      cn: (约翰一书 5:11) 这见证就是：上帝赐予我们永生，这生命是在祂的圣子里。
  - type: paragraph
    text:
      ru: 1Ин.5:12.Имеющий Сына Божия имеет жизнь; не имеющий Сына Божия не имеет жизни.
      cn: 约翰一书 5:12凡有上帝之子的，便有生命；凡没有上帝之子的，便没有生命。
  - type: paragraph
    text:
      ru: И сии три суть во едино, то есть по отношению к свидетельству о Христе показывают, что Он усыновлен Богом Отцом, и что Сам получил, то передал и достойным, верующим во имя Его.
      cn: 这三者合而为一，也就是说，就着对基督的见证而言，它们表明祂被父上帝收纳为子，并且祂自己所领受的，便传授给了配得之人，即那些信祂名的人。
  - type: paragraph
    text:
      ru: 1Ин.5:13.Сие написал я вам, верующим во имя Сына Божия, дабы вы знали, что вы, веруя в Сына Божия, имеете жизнь вечную.
      cn: 约翰一书 5:13我将这些事写给你们，信上帝之子之名的人，为要使你们知道，你们信上帝之子的人，有永生。
  - type: paragraph
    text:
      ru: 1Ин.5:14.И вот какое дерзновение мы имеем к Нему, что, когда просим чего по воле Его, Он слушает нас.
      cn: (约翰一书 5:14) 我们向祂有这样的坦然无惧，就是，凡我们所求的，若按照祂的旨意，祂就垂听我们。
  - type: paragraph
    text:
      ru: 1Ин.5:15.А когда мы знаем, что Он слушает нас во всем, чего бы мы ни просили, – знаем и то, что получаем просимое от Него.
      cn: (约翰一书 5:15) 当我们知道祂垂听我们所求的一切，我们也知道我们从祂得着所求的。
  - type: paragraph
    text:
      ru: Здесь выводится как бы заключение. Я, говорит, написал это вам как наследникам жизни вечной. Ибо для тех, которые не живут по надежде жизни вечной, это не могло бы быть написано, потому что давать святыню псам и бросать жемчуг пред свиньями – не похвально (Матф. 7,6). Напоминая сказанное, повторяет, во-первых, что должно несомненно веровать во имя Сына Божия, то есть в преданное нам от Него богопочтение, ибо это значит, как мы говорили, имя Сына Божия.
      cn: 这里引出仿佛是结论。他说，我把这写给你们，作为永生生命的继承者。因为对于那些不怀永生生命之望而生活的人，这无法被写下，因为把圣物给狗，又把珍珠丢在猪前，是不宜的（马太福音 7:6）。提醒已说过的，他首先重复说，必须毫不怀疑地相信上帝之子的名，也就是说，相信祂所传授给我们的敬神之道，因为正如我们所说过的，这意谓着上帝之子的名。
  - type: paragraph
    text:
      ru: 'Потом говорит, что знаком этой несомненной веры служит не иное что, как дерзновение, которое мы находим пред Ним чрез непорочную веру, как и выше мы говорили, и что опять знаком такого дерзновения служит получение всего, просимого нами. Но как не все получают все просимое, и не все просьбы выслушиваются, то прибавляет:«по воле Его», то есть кто просит противного воле Учителя, тот не будет и услышан. В этом случае он говорит подобно святому Иакову:«просите, и не получаете», говорит он,«потому что просите не на добро»(Иак. 4,3). Обращая этот знак в яснейший признак, говорит: и если мы знаем, что Он слушает нас во всем, чего бы мы ни попросили, то знаем и то, что мы получаем от Него все, просимое у Него. Говорит как бы так: если мы просим у Бога сообразного с волей Его, то Он слушает нас; если же выслушивает нас в просьбах наших, то мы знаем, что приносим просьбы, согласные с Его волей, и просимое нами имеем сами у себя. Такие предметы суть Царство Божие и правда Его, которых просить Он и Сам заповедал нам в Евангелии (Матф. 6,33).'
      cn: 接着说，这无疑的信心的标志，不是别的，正是我们借着无瑕的信心在祂面前所获得的坦然无惧，正如我们上面所说的；而这种坦然无惧的标志，又是获得我们所祈求的一切。但由于并非所有人都得到所祈求的一切，也并非所有的祈求都被垂听，便补充说：「按着祂的旨意」，也就是说，凡祈求与上主旨意相悖之事的人，就不会被垂听。在这种情况下，他正如圣雅各伯所说：「你们祈求，却得不着，」他说，「因为你们祈求不是为着美善」(雅各书 4:3)。将此标志转化为更清晰的凭据，他说道：如果我们知道，祂垂听我们所祈求的一切，我们就知道，我们从祂那里得到了我们所祈求的一切。他仿佛是这样说：如果我们向上帝祈求符合祂旨意的事，那么祂就会垂听我们；如果祂垂听了我们的祈求，我们就知道，我们所献上的祈求是合乎祂旨意的，并且我们所求的，我们自己就拥有了。这样的事物就是上帝的国和祂的义，祂自己也在福音书中吩咐我们去祈求这些 (马太福音 6:33)。
  - type: paragraph
    text:
      ru: '1Ин.5:16.Если кто видит брата своего согрешающего грехом не к смерти, то пусть молится, и Бог даст ему жизнь, то есть согрешающему грехом не к смерти. Есть грех к смерти: не о том говорю, чтобы он молился.'
      cn: (约翰一书 5:16)若有人看见自己的弟兄犯了不至于死的罪，就当祈祷，上帝必将生命赐给他，就是给那犯了不至于死的罪的人。有至于死的罪：我不是说要为这罪祈祷。
  - type: paragraph
    text:
      ru: 1Ин.5:17.Всякая неправда есть грех; но есть грех не к смерти.
      cn: (约翰一书 5:17) 凡不义都是罪；但有不至于死的罪。
  - type: paragraph
    text:
      ru: 'Сказав, что Бог исполняет прошения наши, согласные с Его волей, апостол теперь ясно высказывает желание свое о том, чего бы мы просили по воле Божией. И как он много, почти чрез все послание, говорил о любви к брату и о том, что Бог желает, чтобы мы соблюдали любовь к брату нелицемерно; то теперь одним из желаний Его и самым лучшим называет то, что когда кто видит брата своего, согрешающего грехом не смертным, то пусть просит, и даст ему. Что даст? Жизнь вечную. Кому? Согрешающим не к смерти. Вообще он разделяет грех так: всякая неправда есть грех, и один грех к смерти, другой не к смерти. Но о грехе к смерти говорит: пусть не просит, то есть не молится: ибо не будет услышан, потому что просит не на добро. Разумеет того, кто не показывает никакого обращения. Ибо грех к смерти тот и есть только, в котором не приносят раскаяния. Этим грехом недуговал Иуда, и подвергся вечной смерти. Злопамятные также грешат к смерти; ибо Соломон говорит:«пути злопомнящих в смерть»(Притч. 12,28). Ибо те, кои помнят зло и не прекращают гнева на ближнего, не обращаются к покаянию, но согрешают непростительно.'
      cn: 既然使徒已说过上帝会按照祂的旨意成就我们的祈求，他现在就清楚地表达了他的愿望：我们当按照上帝的旨意祈求什么。他在几乎整篇书信中都多次提及对弟兄的爱，以及上帝愿我们真诚地持守对弟兄的爱；那么现在，他将上帝的愿望之一，也是最好的愿望，称为：当有人看见自己的弟兄犯了不至于死的罪，就当祈求，上帝必赐给他。赐予什么？永生。赐予谁？那些犯了不至于死的罪的人。总之，他如此区分罪：凡不义之事都是罪，有的罪至于死，有的罪不至于死。但关于至于死的罪，他说：不必祈求，也就是说，不必为此祷告：因为祷告将不蒙垂听，因为所求并非出于良善。他所指的是那些没有表现出任何悔改的人。因为至于死的罪，唯独是那些不带来悔改的罪。犹大就犯了这种罪，并遭受了永死。心怀怨恨之人也犯了至于死的罪；因为所罗门说：「心怀怨恨之人的道路通向死亡」（箴言 12:28）。因为那些心怀恶意、不停止对近人发怒的人，不转向悔改，反而犯下了不可赦免的罪。
  - type: paragraph
    text:
      ru: 1Ин.5:18.Мы знаем, что всякий, рожденный от Бога, не грешит; но рожденный от Бога хранит себя, и лукавый не прикасается к нему.
      cn: (约翰一书 5:18) 我们知道，凡从上帝而生的，就不犯罪；但从上帝而生的，保守自己，那邪恶者就无法触碰他。
  - type: paragraph
    text:
      ru: 1Ин.5:19.Мы знаем, что мы от Бога и что весь мир лежит во зле.
      cn: （约翰一书 5:19）我们知道，我们是属上帝的，并且全世界都卧在那恶者手下。
  - type: paragraph
    text:
      ru: 1Ин.5:20.Знаем также, что Сын Божий пришел и дал нам свет и разум, да познаем Бога истинного и да будем в истинном Сыне Его Иисусе Христе. Сей есть истинный Бог и жизнь вечная.
      cn: 约翰一书 5:20。我们也知道，上帝之子已降临，并赐予我们光明和悟性，使我们能认识真上帝，并能在于祂的真子耶稣基督里。这乃是真上帝和永生。
  - type: paragraph
    text:
      ru: 'Наставив нас тому, какой грех к смерти и какой не к смерти, затем обозначает, кто может грешить к смерти, и говорит: усыновленный Богом никогда не может болеть грехом ни к смерти, ни не к смерти. Ибо однажды предав самого себя Христу, обитающему в нем чрез усыновление, он остается неприкосновенным для греха. Однако, чтобы кто-нибудь не подумал, что природа его претворяется и становится уже неуловимой для греха, прибавляет:«хранит себя», то есть если не будет хранить и беречь себя от лукавого, то, без сомнения, согрешит. Итак, он не по природе достигает безгрешности, но по великому дару Божию. Бог, усыновив нас, удостоил нас такой благодати, что мы, сохраняя и соблюдая поданный нам от Него дар, можем и не грешить. В противном случае, так как мир (под миром разумеет тех, которые не поставили себя в отношении к Богу в положение сынов чрез правые дела) во зле лежит, ничто не воспрепятствовало бы нам пристать к погибающим, потому что мысль человека от юности его усердно прилежит на зло (Быт. 8,21), как Бог показал это при потопе. Но как пришел Сын Божий и дал нам разум к познанию Его, истинного Бога, и пребыванию в Нем, истинном Сыне Его, Иисусе Христе; то чрез этот великий дар мы познали, что Он есть истинный Бог и жизнь вечная, и, познав, пребываем неискушенными от лукавого и соблазнов его.'
      cn: 在教导我们何为至于死的罪，何为不至于死的罪之后，随后指明谁能犯至于死的罪，并说：被上帝收养为子的人，绝不会沾染至于死的罪，或是不至于死的罪。因为他一旦将自己献给基督，基督藉着收养为子住在他的里面，他便能免受罪恶侵扰。然而，为免有人以为他的本性已然转变，变得不再为罪恶所能捕捉，便补充说：「保守自己」，也就是说，如果他不保守自己、不防范那恶者，那么他无疑会犯罪。因此，他并非凭着本性达致无罪，而是凭着上帝的伟大恩赐。上帝收养我们为子，使我们蒙受如此洪恩，叫我们藉着保守并遵守祂所赐予我们的恩赐，便能不犯罪。反之，既然世界（这里所指的世界，是指那些藉着正直的行为，未能将自己置于与上帝为子的关系中的人）卧在恶者之下，就没有什么能阻止我们与那些将要灭亡的人为伍，因为人从幼年时候，心中就怀着恶念（创世记 8:21），正如上帝在洪水时期所显明的。但当上帝之子降临，赐予我们心智，使我们认识祂这位真上帝，并住在祂里面，这位祂真实的儿子，耶稣基督里面；那么藉着这伟大的恩赐，我们便认识到祂是真上帝和永生，并且，在认识之后，我们便能免受那恶者及其诱惑的试探。
  - type: paragraph
    text:
      ru: 1Ин.5:21.Дети! храните себя от идолов. Аминь.
      cn: 约翰一书 5:21. 孩子们！保守自己脱离偶像。阿们。
  - type: paragraph
    text:
      ru: Так как апостол писал настоящее послание к совершенным верующим, то некоторые спрашивали, для чего он заповедует им хранить себя от идолов. Отвечаем. Апостол писал это всей Церкви, которая не вся наполнена была людьми избранными, а между ними иные были и с неправым расположением. Таким и дает он заповедь эту, опасаясь за их слабость.
      cn: '既然使徒是写这封书信给那些已达臻善境地的信徒，便有人发问，他为何嘱咐他们要远避偶像呢？


        我们答复。使徒写这书信给全教会，这教会并非尽是蒙拣选的人，在他们中间，也有心志不正者。他正是向这样的人发出这诫命，惧怕他们的软弱。'
  - type: paragraph
    text:
      ru: Конец соборного послания ап. Иоанна. Писано из Ефеса.
      cn: 使徒约翰大公书信之末。写于以弗所。
