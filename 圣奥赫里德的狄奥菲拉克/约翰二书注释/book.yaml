title:
  ru: Толкование на 2-е послание святого апостола Иоанна
  cn: 约翰二书注释
languages:
- ru
- cn
authors:
- ru: Блаженный Феофилакт Бо́лгарский, архиепископ Охридский
  cn: 圣奥赫里德的狄奥菲拉克
document:
- type: heading1
  text:
    ru: Феофилакт БолгарскийТолкование на 2-е послание святого апостола Иоанна
    cn: 圣奥赫里德的狄奥菲拉克《约翰二书注释》
  children:
  - type: heading2
    text:
      ru: Оглавление послания
      cn: 书信目录
    children:
    - type: paragraph
      text:
        ru: После вступления говорится о правой жизни в любви к Богу, при неизменном сохранении благочестивой веры; здесь же и о том, что еретика не должно принимать в дом или приветствовать, чтобы не сделать греха. – Обещание лично прибыть, в надежде быть полезным.
        cn: 在导言之后，提及了在对上帝的爱中过正当的生活，并坚定不移地保守虔诚的信仰；这里也提及，不应接纳异端者进家门或向其问候，以免犯罪。—— 承诺亲自前来，盼望能有所助益。
  - type: heading2
    text:
      ru: Содержание послания
      cn: 书信内容
    children:
    - type: paragraph
      text:
        ru: Апостол пишет это послание как старец (пресвитер) избранной госпоже и детям ее. Повод к посланию был следующий. Апостол видел, что дети госпожи той хорошо живут по вере, а между тем многие обманщики обходят и говорят, что пришествия Христова во плоти нет. Посему апостол пишет настоящее послание. В нем он, во-первых, хвалит детей госпожи той за то, что они хорошо ведут себя; потом учит, что таинство нашей веры не ново; снова убеждает к любви и к тому, чтобы они пребывали в преподанном им учении; наконец, учит, что кто говорит, будто Христос не пришел во плоти, тот антихрист, и заповедует, чтобы никто не принимал таких людей в дом и не говорил им приветствий, и затем оканчивает послание.
        cn: 使徒约翰以一位长老的身份，写了这封书信给蒙拣选的太太和她的孩子们。这封书信的缘由如下：使徒看到那位太太的孩子们很好地凭信仰生活，然而同时，许多欺骗者四处游走，声称基督没有以肉身降临。因此，使徒写了这封书信。在信中，他首先称赞那位太太的孩子们行为端正；其次教导说，我们信仰的奥秘并非新生事物；再次劝勉他们要彼此相爱，并要持守所传授给他们的教义；最后，教导说，凡是说基督没有以肉身降临的，就是敌基督者，并吩咐任何人不要接待这样的人进屋，也不要向他们问安。然后，他结束了这封书信。
    - type: paragraph
      text:
        ru: 2Ин.1:1.Старец – избранной госпоже и детям ее, которых я люблю по истине, и не только я, но и все, познавшие истину,
        cn: (约翰二书 1:1) 作長老的寫信給蒙揀選的太太和她的兒女，就是我在真理中所愛的；不但我愛，也是一切知道真理之人所愛的。
    - type: paragraph
      text:
        ru: 2Ин.1:2.ради истины, которая пребывает в нас и будет с нами вовек.
        cn: (约翰二书 1:2) 愛你們是為真理的緣故，這真理住在我們裏面，也必永遠與我們同在。
    - type: paragraph
      text:
        ru: Некоторые думали, что настоящее послание, как и следующее за ним, принадлежит не Иоанну – возлюбленному ученику Господа, но другому лицу, ему соименному; потому что в том и другом послании писатель называет сам себя пресвитером, и одно послание пишет к одной женщине, а другое – к Гаию, снова к одному, что не подходит посланию, называемому соборным; притом начало этого послания не такое, какое в первом послании. На это мы скажем следующее. В первом послании он не сделал такого начала, какое здесь, потому, что писал его не к определенному лицу или к церкви известного места (как сделал апостол Петр, определенно означив, что он пишет к иудеям, находящимся в рассеянии, и прежде него апостол Иаков), но обращался с речью ко всем вообще верным, собранным ли или находящимся в рассеянии, и потому опустил это начало. Здесь называет себя пресвитером, а не апостолом, ни рабом Иисуса Христа, как прочие апостолы. Не называет себя апостолом, быть может, потому, что он не первый проповедовал Евангелие в Азии, но после Павла, и не проходом, как тот, но постоянно оставаясь там. Не назвал себя рабом Иисуса Христа, потому что при сильной своей любви надеялся быть вне страха рабства. Пресвитером же (старцем) только он соизволил назвать себя или потому, что писал эти послания уже в старости или потому, что именем пресвитера обозначил свое епископство, так как в то время имя пресвитера обыкновенно употреблялось и о епископах. Пишет к верной женщине, и этим нисколько не унижает себя, потому что во Христе Иисусе не имеет различия «нимужеский пол, ни женский»(Гал. 3,28). Пишет к одному Гаию, по примеру апостола Павла, который пишет к Титу, к Тимофею и к частному лицу – Филимону. Это о начале послания.
        cn: 有些人认为，这封书信以及其后的那封，并不属于约翰——主所爱的门徒，而是属于另一个与他同名的人；因为在这两封书信中，执笔者称自己为长老，其中一封是写给一位妇女的，另一封是写给该犹，同样是写给一个人的，这与被称为「公函」的书信不符；此外，这封书信的开头与第一封书信的开头不同。对此，我们作如下说明。在第一封书信中，他没有像这里一样采用这种开头，因为他写那封书信并非写给某个特定的人或某个特定地方的教会（如同使徒彼得明确指出他写给散居的犹太人，以及在他之前的使徒雅各所做的那样），而是向所有一般的信徒讲话，无论他们是聚集在一起还是散居各地，因此省略了这种开头。在这里他称自己为长老，而不是使徒，也不是耶稣基督的仆人，如同其他使徒那样。他或许不称自己为使徒，因为他并非第一个在亚细亚传扬福音的人，而是在保罗之后，并且不像保罗那样只是路过，而是常年住在那里。他没有称自己为耶稣基督的仆人，因为他带着强烈的爱，希望自己能摆脱为奴的恐惧。而他只愿意称自己为长老（或作「长者」），要么是因为他写这些书信时已届老年，要么是因为他用长老这个名称来指明自己的主教职分，因为在那个时代，长老这个名称通常也用于指主教。他写给一位信实的妇女，这样做丝毫没有贬低自己，因为在耶稣基督里，「不分男或女」（加拉太书 3:28）。他写给一个人，就是该犹，效法使徒保罗的榜样，保罗曾写信给提多、提摩太，以及一位私人——腓利门。以上是关于书信开头部分的说明。
    - type: paragraph
      text:
        ru: 'Подлинность этих посланий обнаруживается из образа выражения и прочего строя речи. Ибо и здесь писатель часто повторяет свою речь, говоря одно и то же об одном и том же, при малом к тому поводе, чтоб утвердить речь. О двух предметах просит апостол избранную ту: о том, чтобы она ходила в любви, и о том, чтобы отвращалась еретиков. Называет ее избранной (έκλεκτη) или по имени, или по любви к добродетели. Говорит, что любит ее по истине, и не только ее, но и всех единонравных ей, имеющих истину, утвержденную в самих себе. Говорит, что любит по истине, ибо можно любить притворно, одними устами, как сам он в первом послании (1Ин.3:18) обличил некоторых верующих, но лицемерных. Сказав:«которая пребывает в нас», прибавил:«и будет с нами вовек». К этому опять присовокупил, что будет с нами благодать и милость, показывая, какие блага произрастают от совершенной любви.'
        cn: 这些书信的真实性，从其表达方式和言语结构中显明出来。因为在此，笔者常常重复他的话语，就同一主题，反复言说同样的话语，即便是微小缘由，为要坚固此言。使徒嘱咐那蒙拣选者两件事：一为愿她行在爱中，二为愿她拒斥异端者。他称她为蒙拣选者 (έκλεκτη)，或因其名，或因其爱慕德行。他说他凭真实爱她，不仅爱她，也爱所有与她同心同德之人，他们自身之内有确立的真理。他说他凭真实而爱，因为人可以虚伪地爱，仅仅用口，正如他自己曾在第一书信（约翰一书 3:18）中责备过一些信徒，那些信徒却只是伪善的。在说完：「那住在我们里面的」，他又补充道：「并要永远与我们同在。」他再次对此补充道，恩典和怜悯将与我们同在，借此表明，何等美善的福乐皆源于全备的爱。
    - type: paragraph
      text:
        ru: 2Ин.1:3.Да будет с вами благодать, милость, мир от Бога Отца и от Господа Иисуса Христа, Сына Отчего, в истине и любви.
        cn: (约翰二书 1:3) 恩典，憐憫，平安，從　父─　上帝和　父的　兒子　主耶穌　基督，在真理和愛心上，必常與你們同在。
    - type: paragraph
      text:
        ru: К словам:«от Бога Отца и от Господа Иисуса Христа»,  прибавил еще:«Сына Отчего». Ибо один только Бог в собственном смысле есть Отец Сына. Посему и Павел говорит:«от Которого именуется всякое отечество на небесах и на земле»(Ефес. 3,15). В истине и любви. Этими словами придает достоверность речи и указывает признак любви, о которой говорит."Мир"– то есть мир истинный и твердый, а не по одному только виду.
        cn: 对于「从上帝父，和从主耶稣基督」这几句话，他另外加上了「父的圣子」。因为唯有上帝在确切的意义上，是圣子的父。所以保罗也说：「天上地上所有的族类，都是从祂得名的」（以弗所书 3:15）。在真理和爱中。他用这些话赋予言语以确凿性，并指出他所说的爱的特征。「和平」——即真实而稳固的和平，而非徒具形式的和平。
    - type: paragraph
      text:
        ru: 2Ин.1:4.Я весьма обрадовался, что нашел из детей твоих, ходящих в истине, как мы получили заповедь от Отца.
        cn: (约翰二书 1:4) 我見你的兒女，有照我們從　父所受的一條命令遵行真理的，就甚歡喜。
    - type: paragraph
      text:
        ru: 'Поистине дело весьма радостное – найти человека, непреткновенно идущего поприщем веры во Христа по Его заповеди. Какая же это заповедь? Та, о которой Христос говорит в Евангелии:«кто любит Меня, тот соблюдетзаповеди Мои» (Ин. 14,23). Отцом называет здесь Христа, потому что Он есть и отец тех сыновей, которые по домостроительству даны Ему Отцом, как сказано:«вот я и дети, которых дал мнеБог"(Ис. 8,18). Примечай и здесь подлинность настоящего послания. В этом случае оно согласно со сказанным в первом послании (1Ин.5,2–3): знаем, что любящий Бога соблюдает«заповеди Его». Ибо поступать по заповедям – то же, что соблюдать их. Добродетели деятельны, и бытие имеют тогда, когда совершаются. Посему, кто перестал ходить в добродетелях, тот и не хранит их."Ходящих"сказано с мыслью указать на преуспеяние. Ибо чем более кто действует в добродетели, тем далее уходит вперед, тем больший приобретает навык к добру. Посему, думаю, сказано и сие:«во что желают проникнуть Ангелы»(1Петр. 1,12). Ибо блага, дарованные нам вочеловечившимся Словом, столь велики, что и ангелам желательно получить хотя некоторое понятие о них. Ибо так нужно понимать«проникнуть»(παρακύψαι). Всякий благоразумный желает того, что не прекратится, но продолжится навсегда. И как неисчерпаемое нельзя всецело обнять, то желательно по крайней мере, насколько возможно, сделаться участником в нем.'
        cn: 确实是一件非常喜乐的事，能找到一个人，毫无阻碍地在对基督的信德之路上，遵照祂的诫命而行。这诫命是什么呢？就是基督在福音书中所说的：「爱我的人必遵守我的诫命」（约翰福音 14:23）。这里称基督为父，因为祂也是那些儿女的父，他们是依照救赎的计划，由父赐予祂的，正如经上所说：「看哪，我和上帝所赐给我的儿女」（以赛亚书 8:18）。请注意，在这里也能看到这篇书信的真确性。在此它与约翰一书中所说的相符（约翰一书 5:2-3）：「我们知道，凡爱上帝的必遵守祂的诫命。」因为按照诫命行事，等同于遵守它们。德行在于行动，并且只有在被实行时才存在。因此，凡停止在德行中行进的人，也就不再保守它们。说「行进的人」是为了指明灵性上的长进。因为一个人越是在德行中行动，就越是向前迈进，越是培养对善的更深习性。因此，我认为也有此言：「天使也渴望察看的事情」（彼得前书 1:12）。因为那些由成为肉身的圣言赐予我们的福祉是如此之大，以至于天使们也渴望至少能对它们有一些概念。因为「察看」（παρακύψαι）应当如此理解。每一个明智的人都渴望那不会停止，而是永远持续的事物。并且因为那无法穷尽的不能被完全掌握，那么至少是可取的，尽可能地成为它的参与者。
    - type: paragraph
      text:
        ru: 2Ин.1:5.И ныне прошу тебя, госпожа, не как новую заповедь предписывая тебе, но ту, которую имеем от начала, чтобы мы любили друг друга.
        cn: (约翰二书 1:5) 太太啊，我現在勸你，我們大家要彼此相愛。這並不是我寫一條新命令給你，乃是我們從起初所受的命令。
    - type: paragraph
      text:
        ru: 2Ин.1:6.Любовь же состоит в том, чтобы мы поступали по заповедям Его.
        cn: (约翰二书 1:6) 我們若照他的命令行，這就是愛。你們從起初所聽見當行的，就是這命令。
    - type: paragraph
      text:
        ru: '"Не какновую заповедь».  И это согласно с тем, что говорится в первом послании (1Ин.2,7). Прибавляет и требование заповеди:«чтобы мы любили друг друга». И объясняет о любви, что сущность ее заключается в хождении по ней, и заповедь о ней есть заповедь от начала, и дана не для чего иного, как для того, чтобы вы поступали по ней.'
        cn: 「并非一条新诫命。」 这与经上所言相符（约翰一书 2:7）。它又加上了这诫命的要求：「使我们彼此相爱」。并解释说，关于爱，其本质在于按照它而行，且关于它的诫命是起初就有的诫命，而赐下它，并非为了别的，乃是为了让你们依照它去行。
    - type: paragraph
      text:
        ru: Это та заповедь, которую вы слышали от начала, чтобы поступали по ней.
        cn: 这就是你们从起初所听见的那诫命，好叫你们遵行它。
    - type: paragraph
      text:
        ru: '2Ин.1:7.Ибо многие обольстители вошли в мир, не исповедующие Иисуса Христа, пришедшего во плоти:'
        cn: (约翰二书 1:7) 因有許多迷惑人的已經進到世界，不認耶穌　基督是成了肉身來的。這就是迷惑人、敵基督的。
    - type: paragraph
      text:
        ru: 'Постоянно говорит об одном и том же. Заповедью о любви убеждает к единению, к тому, чтобы они не переходили к обольстителям. Которые уже ходят по миру и отвергают пришествие Господа во плоти. Говоря о хождении по заповеди, данной от начала, показывает, что мнение заблудившихся еретиков ново, и убеждает верных держаться этой изначальной заповеди, а не увлекаться обманом еретиков. Ибо и Христос Своим ученикам относительно обольстителей заповедал:«многие придут под именем Моим, говоря, что это Я... не ходите вслед их»(Лк. 21,8). Итак, всем, соблюдающим заповеди, повелевает не обманываться, но почитать антихристом того, кто скажет это. В греческом тексте сказано:«не исповедающие Иисуса Христагрядущего (ἐρχόμενον,  а не«пришедшего»–ἐλθόντα)во плоти", из чего видно, что были некоторые, отвергавшие второе пришествие Христово. И Сам Господь, когда говорит, что многие придут под именем Его, говорит не о первом Своем пришествии, а о втором. Впрочем, совершенно справедливо, что отвергающие второе пришествие не признают и первого. Ибо если Господь приходил уже во плоти и обещал еще прийти; то, очевидно, отвергающий второе пришествие отвергает и первое. Кто верует, что Господь приходил, тот с верой примет и обещание Его. А кто отвергает обещание, тому ничто не препятствует отрицать и первое пришествие. Посему-то, полагаю, и выразился апостол: «грядущего», а не «пришедшего», чтобы одним словом обнять отвергающих оба пришествия Господня.'
        cn: 始终谈论着同一个主题。他以爱的诫命劝人合一，以免他们转向那些迷惑者。这些人已然遍行世界，并弃绝上主道成肉身的降临。他提到要遵行从起初所赐的诫命，以此表明那些迷失的异端邪说乃是新近的观点，并劝导信徒持守这原初的诫命，而非为异端者的欺骗所诱惑。因为基督也曾就迷惑者一事对祂的门徒颁下诫命：「许多人要冒我的名来，说『我就是』……你们不要跟随他们」（路加福音 21:8）。因此，祂命令所有遵守诫命的人不要受骗，而要将说这话的人视为敌基督。希腊原文中写道：「不承认耶稣基督即将道成肉身降临（ἐρχόμενον，而非『已经降临』–ἐλθόντα）的人」，由此可见，当时确有一些人弃绝基督的第二次降临。而上主自己，当祂说到许多人要冒祂的名而来时，祂所指的并非祂的第一次降临，而是第二次降临。然而，那些弃绝第二次降临的人，自然也不会承认第一次降临，这完全是合理的。因为如果上主已经道成肉身降临，并应许再次降临；那么，显然，弃绝第二次降临的人，也等于弃绝了第一次降临。凡信上主已经降临的，必会带着信心接受祂的应许。而弃绝这应许的人，也就没有任何障碍会阻止他们否认第一次降临。因此，我认为，使徒便这样表达了：「即将降临」，而非「已经降临」，以便用一个词来涵盖那些弃绝上主两次降临的人。
    - type: paragraph
      text:
        ru: Такой человек есть обольститель и антихрист.
        cn: 这样的人是迷惑者和敌基督者。
    - type: paragraph
      text:
        ru: 'Для большей ясности, перед этим нужно подразумевать: «кто не исповедует сего», а потом уже читать: «тотесть обольститель и антихрист». Без этого добавления речь неполна.'
        cn: 为了更清楚起见，在此之前，需假定为：「凡不承认此者」，然后才能读作：「意即迷惑人的和敌基督的」。若无此补充，论述便不完整。
    - type: paragraph
      text:
        ru: 2Ин.1:8.Наблюдайте за собою, чтобы нам не потерять того, над чем мы трудились, но чтобы получить полную награду.
        cn: (约翰二书 1:8) 你們要小心，使我們不致失去那些我們做工所得的，乃要得著滿足的賞賜。
    - type: paragraph
      text:
        ru: 2Ин.1:9.Всякий, преступающий учение Христово и не пребывающий в нем, не имеет Бога;
        cn: (约翰二书 1:9) 凡違背、不常守　基督道理的，就沒有　上帝。常守　基督道理的，就有　父又有　子。
    - type: paragraph
      text:
        ru: 'Заповедует тем, кому пишет, остерегаться людей, отвергающих оба пришествия Господня. Представляет и причину, именно то, чтобы, приставши к ним, вам не потерять того, что вы сделали, но получить полную награду. Иной из такого рода людей, быть может, скажет: если я не верую в пришествие Христово во плоти, но проведу жизнь в добрых делах, ужели с этими делами не могу стать вместе с благочестивыми? Ужели не могу получить награды за свои дела? Апостол вперед уничтожает такое возражение. Он говорит: кто отвергает пришествие Христа во плоти, тот пусть и не думает ни о получении полного воздаяния за дела, какое предлежит истинно верующим, ни о причтении себя к совершенно благочестивым. Напротив, всякий, преступающий заповедь Его, то есть Христа, пришедшего во плоти, и не пребывающий в учении Его, не имеет Бога. Ибо если на Того, Кто пришел научить людей совершенному богопознанию, смотрит с пренебрежением, то как может быть еще благочестивым, когда презирает Самого Учителя? Нет, такой человек – безбожник; равно как тот, кто тверд в учении Христовом, есть Божий и боголюбезен, и имеет в себе всю полноту Божества, то есть Отца и Сына и Святого Духа. Ибо Христос учит об Отце, когда говорит:«все, что имеет Отец, есть Мое»(Ин. 16,15); во многих местах учит о Себе Самом и об Отце, что один Отец, а другой – Сын; учит о Духе, когда говорит:"ДухСвятый,Который от Отца исходит»(Ин. 15:26); еще яснее, когда говорит:«крестя их во имя Отца и Сына и Святого Духа»(Мф. 28,19).  Если ученик Господа сказал здесь только об Отце и Сыне, а о Духе Святом умолчал, то этим нисколько не соблазняйся. Ибо здесь и следовало сказать только об этом, то есть об Отце и Сыне.'
        cn: 嘱咐那些他写信给的人，要警惕那些否认上主两次降临的人。并说明其原因，就是为了使你们不至于因依附他们而失去你们所做的，反而获得圆满的赏报。这种人中的某一个或许会说：如果我不信基督道成肉身的降临，但我一生行善，难道我不能凭着这些善行与虔敬的人同列吗？难道我不能获得我行为的赏报吗？使徒提前驳斥了这种异议。他说：凡弃绝基督道成肉身降临的，就不要指望获得行为的圆满酬报（这圆满酬报是为真信徒所预备的），也不能被算作全然虔敬的人。相反地，凡是违犯祂（也就是那道成肉身降临的基督）诫命，并且不常住在祂教训中的人，就没有上帝。因为如果人对那前来教导人们认识圆满上帝者报以轻蔑，当他轻视教师本人时，他怎能仍然是虔敬的呢？不，这种人是无神之人；正如凡坚定于基督教训中的人，乃是属上帝的，且为上帝所爱，并在他自身拥有整个神性的丰满，也就是父、子和圣灵。因为基督论及父时说：「凡父所有的一切，都是我的」（约翰福音 16:15）；在许多地方论及祂自己和父时说，一位是父，另一位是子；论及圣灵时说：「圣灵，祂从父发出」（约翰福音 15:26）；更清楚的是，当祂说：「奉父、子、圣灵之名给他们施洗」（马太福音 28:19）。如果上主的门徒在此只提及父和子，而对圣灵缄口不言，那么对此你丝毫不要跌倒。因为在此处也只应提及这两位，也就是父和子。
    - type: paragraph
      text:
        ru: пребывающий в учении Христовом имеет и Отца и Сына.
        cn: 恒常住在基督的教训中者，便有父又有子。
    - type: paragraph
      text:
        ru: 'Пребывает в учении Христовом, то есть в евангельском, тот, кто мыслит в соответствии с ним, учит, действует, соображает с ним всю жизнь внутреннюю и внешнюю. А кто удаляется от него, тот безбожник. Ибо как тот, кто живет в точности по сему учению, усвояет себя Богу, подобно Аврааму, который посему и услышал от Него:"Я Богтвой"(Быт. 17,1); так тот, кто живет не по заповеди евангельской, живет без Бога, потому что сам удалил себя от Бога. Но тогда как сей, то есть отчуждавшийся божественного учения, живет без Бога, пребывающий в этом учении имеет и Отца и Сына. Об этом и Сын сказал:«Мы придем к нему и обитель у него сотворим», то есть вместе с Отцом (Ин. 14,23). Ибо чрез соблюдение заповедей он сделал себя храмом и жилищем Божиим, и Бог вселился в него. Слова иметь Бога употребляются в двояком смысле. Говорится, что и все твари имеют Бога, как апостол Павел выразился:«мы Им живем и движемся, и существуем»(Деян. 17,28). Так говорится в отношении к бытию. Опять, когда кто служит Богу добродетелями, говорится, что он имеет Бога. В этом значении и называется Бог Богом Авраама, Исаака и вообще боголюбезных евреев. К сказанному теперь надобно приставить: кто имеет Сына, тот имеет и Отца. Ибо"видевшийСына, – как Сам Он сказал, –виделиОтца". Он же сказал:«Я в Отце, и Отец во Мне»(Ин. 14,9–10). Поэтому и отсюда познается единосущие Отца и Сына.  А если кто скажет: в таком случае и тот, кто принимает учеников,  имеет Отца и Сына, потому что сказано:«принимающий вас принимает Меня, а... принимающий Меня, принимает Пославшего Меня»(Мф. 10,40); такой пусть знает, что он говорит худо и понимает  неправильно. Ибо это сказано об учении. Кто добровольно принял апостолов и учение их, тот чрез них принял учителями и Отца и Сына. И иначе: пребывающий в учении имеет и Отца и Сына, а апостолы пребывали в учении, потому что и проповедовали его; посему принявший их, храмы Божии, чрез самое принятие их имеет пребывающего в них Сына и Отца.'
        cn: 住在基督的教训中，也就是福音的教训中，就是那按着这教训思想、教导、行动、并使他整个内在和外在的生命都与这教训相符的人。而那偏离这教训的，就是无神之人。因为，正如那严格按照这教训生活的人，使自己归属于上帝，正如亚伯拉罕，因此从祂那里听见说：「我是你的上帝」（创世记 17:1）；同样，那不按福音诫命生活的人，就是活在没有上帝的光景中，因为他自己使自己远离了上帝。然而，当此人，即那疏远神圣教训的人，活在没有上帝的光景中时，住在这教训中的人则同时拥有圣父和圣子。关于这一点，圣子也曾说：「我们要到他那里去，与他一同建立居所」，也就是说，与圣父一同（约翰福音 14:23）。因为借着遵守诫命，他使自己成为上帝的殿和居所，上帝就住在他里面。「拥有上帝」这个词有两种用法。一方面，是指所有受造之物都拥有上帝，正如使徒保罗所说：「我们生活、动作、存留，都在乎祂」（使徒行传 17:28）。这是就存在的意义而言。另一方面，当一个人以美德服侍上帝时，也可以说他拥有上帝。在这个意义上，上帝被称为亚伯拉罕的上帝，以撒的上帝，以及所有蒙上帝所爱的犹太人的上帝。现在，还需要补充一点：凡拥有圣子的人，也拥有圣父。因为「凡看见圣子的人」，——正如祂自己所说，——「就看见了圣父」。祂也曾说：「我在父里面，父在我里面」（约翰福音 14:9-10）。因此，由此亦可知圣父与圣子是同本体的。如果有人说：照这样看来，那接待门徒的人也拥有圣父和圣子，因为经上说：「接待你们的，就是接待我；接待我的，就是接待那差我来的」（马太福音 10:40）；这样的人当知道，他说得不对，理解也错误。因为这话是关于教训说的。凡是自愿接受使徒及其教训的人，就是藉着他们接受了圣父和圣子作为教师。也可以从另一方面理解：住在教训中的人拥有圣父和圣子，而使徒们也住在教训中，因为他们也宣讲这教训；因此，凡接受他们（即上帝的圣殿）的人，便是藉着接受他们，就拥有了住在他们里面的圣子和圣父。
    - type: paragraph
      text:
        ru: 2Ин.1:10.Кто приходит к вам и не приносит сего учения, того не принимайте в дом и не приветствуйте его.
        cn: (约翰二书 1:10) 若有人到你們那裏，不是傳這道理，不要接他到你們家裏，也不要說　上帝祝福他；
    - type: paragraph
      text:
        ru: 2Ин.1:11.Ибо приветствующий его участвует в злых делах его.
        cn: (约翰二书 1:11) 因為說　上帝祝福他的，就在他的惡行上有分。
    - type: paragraph
      text:
        ru: 2Ин.1:12.Многое имею писать вам, но не хочу на бумаге чернилами, а надеюсь прийти к вам и говорить устами к устам, чтобы радость ваша была полна.
        cn: (约翰二书 1:12) 我還有許多事要寫給你們，卻不願意用紙墨寫出來；但相信我到你們那裏，與你們當面談論，叫我們的喜樂得以滿足。
    - type: paragraph
      text:
        ru: Тех, кому пишет послание, апостол предостерегает, чтобы они приходящего к ним без исповедания учения Христова не только не принимали под кров свой, но и не удостаивали приветствия, потому что приветствие от нас должно быть делаемо только тем, кои единонравны и единоверны с нами. Ибо кому мы должны молить благополучия, как не единонравным и единоверным с нами? Если же будем приветствовать нечестивых, что прилично только в отношении к единонравным и единоверным; то этим показываем, что мы в общении с ними, и что они уже увлекли нас в свое нечестие. Причиной, почему настоящее и следующее за ним послание изложены кратко, апостол поставляет то, что надеется прийти сам и при личном свидании восполнить недостающее.
        cn: 使徒告诫那些他写信的对象，不要接纳那些不承认基督教义而来到他们这里的人，不仅不要接待到家中，而且不要给予问候，因为我们的问候只应给予那些与我们志同道合、信仰一致的人。因为除了与我们志同道合、信仰一致的人之外，我们还能为谁祈求福祉呢？若我们问候不虔敬之人（这本是只适用于与我们志同道合、信仰一致之人的），这就表明我们与他们有所交往，且他们已将我们诱入其不虔敬之中。使徒解释当前以及其后的书信之所以简短的原因，是希望他能亲自前来，并在面谈时补足所缺之处。
    - type: paragraph
      text:
        ru: 2Ин.1:13.Приветствуют тебя дети сестры твоей  избранной. Аминь.
        cn: (约翰二书 1:13) 你那蒙揀選之姊妹的兒女都問你安。阿們。
    - type: paragraph
      text:
        ru: Некоторые на основании этих слов думают утверждать, что послание сие писано не к женщине, а к Церкви. С тем, кто так думает, я нисколько не спорю.
        cn: 有些人根据这些话语，认为并主张这封书信不是写给一个女人，而是写给教会的。对于持此想法的人，我丝毫不争辩。
    - type: paragraph
      text:
        ru: Конец второго послания ап. Иоанна.
        cn: 使徒约翰第二书信的结束。
