    cn: 1947年6月27日，穆卡切沃与乌日哥罗德主教涅斯托尔（西多鲁克，任期1945年10月22日至1948年6月3日）颁布第344号谕令，向修道院长瓦西里再次颁布了一份重申前令的谕令，任命其为乌日哥罗德市俄罗斯战士纪念教堂的院长。/ 司祭长瓦西里（普罗宁）的个人档案 // AMPE。
