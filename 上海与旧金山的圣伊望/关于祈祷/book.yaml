title:
  ru: О молитве
  cn: 关于祈祷
authors:
- ru: Святитель Иоанн (Максимович)
  cn: 圣伊望（马克西莫维奇）
document:
- type: heading4
  text:
    ru: Введение
    cn: 引言
  children:
  - type: paragraph
    text:
      ru: Содержание
      cn: 目录
  - type: paragraph
    text:
      ru: 'В Сан-Франциско увидела свет рукопись святителяИоанна Шанхайскогои Сан-Францисского, которую с сербского перевёл архимандрит Василий (Пронин). Этим летом трудами протоиерея Петра Перекрёстова из Сан-Франциско (штат Калифорния, США) вышел в свет сборник с ранее неопубликованными текстами, которые принадлежат перу известного святого XX века – святителяИоанна (Максимовича), архиепископа Шанхайского и Сан-Францисского. В частности в сборник вошли два рукописных произведения святого: «О молитве» и «О причастии», которые перевёл с сербского архимандрит Василий (Пронин). Объём издания 73 с. Книга была напечатана по благословению владыки Виктора, митрополита Тверского и Кашинского.'
      cn: 圣主教约翰（上海与旧金山）的一部手稿在旧金山得以出版，该手稿由掌院瓦西里（普罗宁）从塞尔维亚语翻译。今夏，在旧金山（美国加利福尼亚州）的教长彼得·佩列克廖斯托夫的努力下，一部收录了此前未发表文本的文集得以出版，这些文本出自20世纪著名圣徒——上海与旧金山总主教圣主教约翰（马克西莫维奇）之笔。具体而言，该文集收录了圣人的两部手稿作品：《论祷告》和《论圣餐》，由掌院瓦西里（普罗宁）从塞尔维亚语翻译。该出版物共73页。该书的出版蒙特维尔与卡申都主教维克多主教的祝福。
  - type: paragraph
    text:
      ru: 'Напомним, что впервые, ещё в 2012 году, выявив в архивных документах отца Василия (Пронина) рукопись «О молитве» мы, проработав документ, уже написали небольшой исследовательский очерк и опубликовали впервые рукопись в одном из периодических изданий УПЦ: Монич Александр, иерей. О молитве // Живой Родник (Православный собеседник). №–11–12 (99–100); Монич Александр, иерей. О молитве (Продолжение) // Живой Родник (Православный собеседник). – №–1–2 (101–102).'
      cn: 值得一提的是，我们早在2012年，在瓦西里（普罗宁）神父的档案文献中发现了手稿《论祷告》后，便已研读了这份文献，并撰写了一篇小型研究性文章，首次将其发表在乌克兰东正教会的一份期刊中：莫尼奇·亚历山大，司祭。《论祷告》//《活泉》（东正教对话者）。第11-12期（99-100）；莫尼奇·亚历山大，司祭。《论祷告》（续）//《活泉》（东正教对话者）。第1-2期（101-102）。
- type: heading1
  text:
    ru: О молитве
    cn: 论祈祷
  children:
  - type: heading2
    text:
      ru: Предисловие
      cn: 序言
    children:
    - type: paragraph
      text:
        ru: Прежде чем ознакомиться с текстом слова «О молитве» в двух словах остановимся на нововыявленном рукописном документе.
        cn: 在阅读《论祷告》这篇讲论的文本之前，我们简要地谈一谈新发现的手稿文献。
    - type: paragraph
      text:
        ru: Во-первых, этот труд уже публиковался в вышеприведённых источниках. Автором слова «О молитве» является известный мировому Православию святитель и подвижник благочестия XX века, ныне уже причисленный к лику святых Иоанн (в миру Михаил Максимович) (04.06.1896 – † 02.07.1966)[1].
        cn: 首先，这部著作已经出版于上述来源中。《论祷告》这篇训言的作者是为全世界东正教所熟知的二十世纪圣主教和虔敬的苦修者，如今已荣列圣品的圣约翰（俗名米哈伊尔·马克西莫维奇）（1896年6月4日 – † 1966年7月2日）[1]。
  - type: heading2
    text:
      ru: Предыстория появления рукописи
      cn: 手稿问世的背景
    children:
    - type: paragraph
      text:
        ru: Предыстория возникновения рукописи слова «О молитве» непосредственно связана с известным подвижником Православной Церкви, но уже в Закарпатье – архимандритом Василием (Прониным) (08.09.1911 – † 05.01.1997).
        cn: 「论祷告」这部著述手稿的缘起，直接与东正教会一位著名的苦行修士相关，他便是身处外喀尔巴阡地区的掌院司祭瓦西里（普罗宁）（1911年9月8日生 – 1997年1月5日卒）。
    - type: paragraph
      text:
        ru: Из биографии студента Битольской семинарии (1929–1931), а впоследствии богословского факультета Белградского университета (1931–1937) Владимира Пронина известно, что его духовным отцом был иеромонах, а впоследствии епископ и архиепископИоанн (Максимович)[2].
        cn: 从弗拉基米尔·普罗宁（Vladimir Pronin）的生平中得知，他曾于比托拉神学院（1929–1931）求学，后又就读于贝尔格莱德大学神学系（1931–1937），他的神师是修士司祭，后晋升为主教和大主教的约安（马克西莫维奇）[2]。
    - type: paragraph
      text:
        ru: Последний, как известно с 1929 года был преподавателем и воспитателем в Сербской семинарии Охридской епархии в городе Битоле, а 28 мая 1934 года был посвящён в епископы и назначен в Шанхайскую епархию.
        cn: 后者，众所周知，自1929年起，在比托拉市奥赫里德教区的塞尔维亚神学院担任教师和训导员，而于1934年5月28日被祝圣为主教，并被任命至上海教区。
    - type: paragraph
      text:
        ru: Видимое общение между ними продолжалось всего пять лет, с 1934 года, когда (Несмотря на то, что видимое общение между ними продолжалось всего пять лет, с 1934 года общение между ними приняло эпистолярный вид. Хотя в 1934 году)  отца Иоанна возводят в сан епископа, и он уезжает в далёкий Шанхай, сердечное общение между ними продолжалось до самой смерти святителя, теперь уже в письменной форме[3]. В архиве Мукачевской епархии сохранилась уникальная и глубокая по своему духовному содержанию переписка между святителем Иоанном и тогда ещё иеромонахом Василием (Прониным)[4].
        cn: 他们之间的显见交通仅持续了五年，从1934年起，当时（尽管他们之间的显见交通从1934年起仅持续了五年，但他们之间的交通便采取了书信往来的形式。虽然在1934年）伊望神父被祝圣为主教，并前往遥远的上海，但他们心与心的交通却一直持续到这位圣主教离世，此时已是书信形式[3]。在穆卡切沃教区档案馆中，保存着一份独特且在属灵内容上极其深刻的信件往来，乃是圣主教伊望与当时还是修士司祭瓦西里（普罗宁）之间[4]。
    - type: paragraph
      text:
        ru: Как известно помимо подвижнических трудов святитель Иоанн оставил после себя уникальные аскетические, гомилетические и богословские статьи, труды, книги. Одним из таких трудов является слово «О молитве».
        cn: 众所周知，圣约安主教除了苦修著述之外，还留下了独特的灵修、讲道学和神学文章、著述和书籍。其中一篇这样的著述是题为《论祷告》的篇章。
    - type: paragraph
      text:
        ru: После краткого пребывания на сельских приходах (После кратких пребываний на приходах ) Мукачевской епархии, в апреле 1940 года иеромонах Василий (Пронин) был переведён для пастырского служения в Покровский храм-памятник русским воинам города Ужгорода[5].
        cn: 在穆卡切沃教区乡村堂区短暂逗留之后（在各堂区短暂逗留之后），1940年4月，耶罗蒙克瓦西里（普罗宁）被调往乌日霍罗德市献给俄罗斯战士的圣母帡幪纪念教堂从事牧灵事奉[5]。
    - type: paragraph
      text:
        ru: Испытывая нужду в духовном руководстве и совете, иеромонах Василий постоянно поддерживал связь с епископом Шанхайским Иоанном (Максимовичем), который кроме всего прочего всегда живо интересовался положением церковных дел в Подкарпатской Руси.
        cn: 修道司祭瓦西里感到缺乏灵修指导和建议，持续保持与上海主教约翰（马克西莫维奇）的联系。此外，主教总是对外喀尔巴阡罗斯的教会事务状况极感兴趣。
    - type: paragraph
      text:
        ru: '15 февраля 1941 года отец Василий получил (получает второе сохранившееся ) письмо от епископа Иоанна, которое проливает (первый ) свет на рукопись слова «О молитве». Учитывая важность этого письма для нашей публикации, приводим его полностью, в оригинале:'
        cn: 1941年2月15日，父亲瓦西里收到了（现存的第二封）来自伊奥安主教的信件，这封信为《论祷告》手稿投下了（第一道）光芒。考虑到这封信对我们出版物的重要性，我们在此全文引述其原文：
    - type: paragraph
      text:
        ru: 'В нем читаем:'
        cn: 其中我们读到：
    - type: paragraph
      text:
        ru: «Дорогой отец Василий! Давно получил Вашу открытку, но за разными делами всё откладывал писание ответа, хотя и имел открытку всё почти время перед глазами. […] Да поможет Вам Господь и дальше трудиться в Его Святое Имя и принесёт пользу душам тех, которые будут вверены Вашему попечению.
        cn: 亲爱的瓦西里神父！许久前收到了您的明信片，但因诸事缠身，一直耽搁着回信，尽管那张明信片几乎一直在我眼前。[…] 愿上主帮助您继续在祂的圣名中劳作，并使那些被托付于您照管的灵魂得益处。
    - type: paragraph
      text:
        ru: Не ослабевайте духом, если будут трудности.«Претерпевый же до конца, той спасён будет» (Мф. 10:22)и в нынешнее время без искушений не хороший пастырь. Борьба против веры идёт везде. Да подаст Вам Господь успех в Вашей работе. Карпаторусский край столетиями хранил веру и народность, несмотря на все попытки заменить их другими. Он был всегда и останется близким моему сердцу и любовь великая своих учеников, которых подготавливал на служение Церкви. Передайте пожелания прочим кого из них увидите.Я буду очень рад, если переведёте на русский и издадите моё слово «О молитве». Очень Вас прошу прислать тогда и мне несколько экземпляров.Как внутренне живёте и спасаетесь? Господь да наставляет и да поможет Вам! Да будет на Вас Божие благословение.
        cn: '遇到困难时，不要心灵软弱。「唯有忍耐到底的，必然得救。」（马太福音 10:22）在现今时代，没有经历试探的，不是一位好牧人。针对信仰的争战无处不在。愿上主赐予您事工上的顺利。喀尔巴阡-俄罗斯地区数世纪以来守护着信仰和民族性，尽管一切企图都想用其他来取代它们。它一直并将永远贴近我的心，以及（我对）那些我预备为教会服务的门徒们的伟大爱意。请代我向您见到的他们中间的其他人转达问候。


          我会非常高兴，如果您能把我的著作《论祷告》翻译成俄语并出版。我恳请您届时也寄几本给我。


          您内在的生活如何？您如何行救赎之道？愿上主指引并帮助您！愿上帝的祝福降临在您身上。'
    - type: paragraph
      text:
        ru: С любовью Иоанн, епископ Шанхайский»[6].
        cn: 带着爱，约翰，上海主教»[6]。
    - type: paragraph
      text:
        ru: 'В том же году 15 апреля владыка Иоанн написал ещё одно письмо, в котором поздравил отца Василия с праздником Пасхи, вкратце описал своё положение и интересовался церковными делами в Карпатской Руси. И опять же упомянул о слове «О молитве»:'
        cn: 同年4月15日，约安主教又写了一封信，在信中祝贺瓦西里神父逾越节快乐，简述了自己的处境，并关心喀尔巴阡罗斯的教会事务。并且再次提到了「论祈祷」一文：
    - type: paragraph
      text:
        ru: «Христос Воскресе! Дорогой отец Василий. Благодарю Вас за поздравление со Светлым Праздником. Очень был рад получить от Вас весть, а также виды храмов. […] Рад был некоторое время назад получить письмо от о. Василия Гречки. Большую мне радость доставило известие об избрании во епископы о. Феофана Сабова. Рукоположен ли он уже, где и когда? Рад за епархию и за своего хорошего ученика. Вспоминаю всех своих учеников – карпаторусов и душою пребываю с ними. Да даст Господь Вам и всем им поработать для края, где русский народ так нуждается в пастырях с пользой для святой Церкви и нашей Родины.Вы спрашивали меня об издании моего слова „О молитве“ в русском переводе. Очень буду рад, если удастся Вам его сделать.Беспокоюсь очень за своих учеников в других странах, а также о всех, кого только знаю. […] Крепитесь, не падайте духом, если когда бывает тяжело уповайте на Воскресшего Христа, всегда служите Ему. Господь да благословит и хранит Вас!
        cn: '基督复活了！亲爱的瓦西里神父。


          感谢您祝贺我光明节日。非常高兴收到您的消息，以及教堂的景象。[…] 前一阵子很高兴收到格列奇卡神父瓦西里的来信。令我大感喜悦的是关于萨博夫神父西奥凡当选主教的消息。他是否已经祝圣了？在何处，何时？我为教区感到高兴，也为我那位优秀的学生感到高兴。我忆念着所有我的学生们——喀尔巴阡罗斯人，我的灵魂与他们同在。愿上主赐予您和他们所有人工作，为了那个俄罗斯人民如此需要牧者的地方，为圣教会和我们的祖国带来益处。


          您曾询问我关于出版我的著作《论祷告》的俄文译本。如果您能完成此事，我将非常高兴。


          我非常担忧我在其他国家的学生们，以及所有我认识的人。[…] 请坚强，不要灰心丧志，如果有时遇到困难，要仰赖复活的基督，永远事奉祂。愿上主降福并保守您！'
    - type: paragraph
      text:
        ru: С любовью Иоанн, епископ Шанхайский»[7].
        cn: 以爱，约翰，上海主教»[7]。
    - type: paragraph
      text:
        ru: Таким образом, в двух письмах, датированных 15 февраля и 15 апреля 1941 года епископ Иоанн просит два раза иеромонаха Пронина перевести на русский язык и издать его слово «О молитве».
        cn: 因此，在两封日期为1941年2月15日和4月15日的信中，约安主教两次请求普罗宁修士司祭将其讲论《论祷告》翻译成俄语并出版。
  - type: heading2
    text:
      ru: О самой рукописи.
      cn: 关于手稿本身。
    children:
    - type: paragraph
      text:
        ru: Рукопись слова «О молитве» разделена (дешифратором, а соответственно и ее автором на девять частей. ) на 9 частей, (Последние, написаны ) написанных на 9 страницах бумаги формата А4. К большому сожалению, дата написания слова «О молитве» (- отсутствует. ) остаётся неизвестной. В конце рукописи подпись –Иеромонах Иоанн. (Подпись говорит о том, что труд был написан ещё в бытность его иеромонахом. Сан священства он принял в 1926 году, на праздник Введения Пресвятой Богородицы в храм. ) Священнический сан Иоанн (Максимович) принял в 1926 году, на праздник Введения Пресвятой Богородицы в храм.
        cn: 手稿《论祷告》被（由解密者，也即其作者，将其分为九个部分。）分为九个部分，（最后的部分，写于）写在九页A4纸上。非常遗憾的是，这篇《论祷告》的写作日期（——缺失。）仍然不详。手稿末尾的署名是——修士司祭约安。（署名表明此作写于他尚为修士司祭之时。他于1926年，在圣母进堂节，领受了圣品。）约安（马克西莫维奇）于1926年，在圣母进堂节，领受了司祭圣品。
    - type: paragraph
      text:
        ru: Таким образом, это был период, когда Пронин и Максимович были в качестве студента и воспитателя соответственно. Однако, по известным причинам, ни в этот период, ни в период обучения на богословском факультете Пронин не мог заниматься изданием этой рукописи. Скорее всего, рукопись попала к Пронину уже в Закарпатье. На это указывают косвенные обстоятельства. Во-первых, датируемые письма 1941 года. Во-вторых, будучи в подчинении епископа Мукачевско-Пряшевского Владимира (Раича), который был родом из Сербии и который, несомненно, знал епископа Иоанна, возможность публикации труда удваивалась. Возможно, что именно в этот период Максимович просит Пронина опубликовать его труд.
        cn: 如此一来，这是普罗宁和马克西莫维奇分别以学生和导师身份共处的一段时期。然而，由于众所周知的原因，无论是在此期间，还是在神学系学习期间，普罗宁都无法着手出版这份手稿。最有可能的是，这份手稿是普罗宁在外喀尔巴阡地区时才得到的。有旁证表明了这一点。其一，是1941年的信件。其二，普罗宁当时隶属于穆卡切沃-普里亚舍夫主教弗拉基米尔（赖伊奇），而这位主教来自塞尔维亚，并且无疑认识约安主教，这使得出版其著作的可能性增加了一倍。有可能正是在这一时期，马克西莫维奇请求普罗宁出版他的著作。
  - type: heading2
    text:
      ru: Почерк.
      cn: 笔迹。
    children:
    - type: paragraph
      text:
        ru: Судя по личному делу, сотням рукописей, а также сохранившимся оригиналам писем иеромонаха Василия (Пронина) епископу Иоанну (Максимовичу) и их анализу – почерк выявленного перевода  рукописи слова «О молитве» – это почерк отца Василия (Пронина). Подлинность документа не вызывает абсолютно никаких сомнений.
        cn: 根据个人档案、数百份手稿以及保存下来的耶罗蒙克瓦西里（普罗宁）致主教约安（马克西莫维奇）的书信原件及其分析，所发现的题为《论祷告》的翻译手稿的笔迹，是瓦西里神父（普罗宁）的笔迹。该文件的真实性毫无疑问。
  - type: heading2
    text:
      ru: Перевод рукописи.
      cn: 我已准备好，请您提供手稿内容。
    children:
    - type: paragraph
      text:
        ru: Интригующий интерес вызывает лишь одно обстоятельство. В обоих письмах епископ Иоанн просит отца Василия «перевести на русскийи издать» слово «О молитве». Дело в том, что выявленная рукопись написана нарусскомязыке. Вопрос, с какого языка переводил Пронин эту рукопись? Когда? Помогал ли ему в этом кто-нибудь? Вопрос перевода, остаётся загадкой. Ведь речь идёт не о стилистической или же орфографической корректуре рукописи, а о конкретном переводе.
        cn: 唯有一个情况引人深思。在两封信中，伊阿尼主教都请瓦西里神父「将其翻译成俄语并出版」著作《论祈祷》。然而，已发现的手稿是用俄语写成的。问题是，普罗宁是从何种语言翻译的这份手稿？何时翻译的？是否有旁人协助他完成？翻译之谜，至今未解。因为这并非关乎手稿的文体或拼写校正，而是关于具体的翻译工作。
    - type: paragraph
      text:
        ru: Факт написания оригинала рукописи на сербском, английском или же учитывая служение епископа Иоанна в Шанхае, на шанхайском диалекте китайского языка  не исключается. Если отец Василий переводил оригинал этой рукописи с сербского, английского или китайского языка, то это обстоятельство только усиливает важность её публикации. С биографии отца Пронина мы знаем, что он владел многими иностранными языками, в том числе английским и сербским, увлекался восточными языками.
        cn: 不排除手稿原稿系以塞尔维亚语、英语，或考虑到约翰主教在上海的事奉，以汉语上海方言撰写。如果瓦西里神父是从塞尔维亚语、英语或汉语翻译的这份手稿原稿，那么这一情况只会更加凸显其出版的重要性。我们从普罗宁神父的生平中得知，他精通多种外语，包括英语和塞尔维亚语，并对东方语言抱有浓厚兴趣。
    - type: paragraph
      text:
        ru: В тех местах, где были вырваны небольшие клочки страниц или же полностью утерян текст перевода мы ставили квадратные скобки в которых приводим (печатали)  слова или выражения, как нам кажется, подходящие по смыслу текста.
        cn: 在那些页面有小块残缺或译文文本完全遗失的地方，我们以方括号 [ ] 标示，并在其中加入（印制）我们认为契合文本含义的词语或表达。
    - type: paragraph
      text:
        ru: Таким образом, мы впервые публикуем чистовой перевод слова отца Иоанна (Максимовича) «О молитве» в редакции иеромонаха Василия (Пронина).
        cn: 因此，我们首次出版了圣父约翰（马克西莫维奇）的训言《论祷告》的最终修订版译本，此译本经由修士司祭瓦西里（普罗宁）修订。
    - type: paragraph
      text:
        ru: Уважаемые читатели! Публикацией этой рукописи мы не хотим сделать какую-то сенсацию или же открытие, но хотим сказать, что помимо прочего монах Василий (Пронин) был духовным чадом (духовником)  святителя Иоанна Шанхайского. И сегодня, когда рукописи святителя только становятся предметом скрупулезного изучения, думается это слово «О молитве» займёт достойную нишу в деле собирания трудов Сан-Францисского святого.
        cn: 尊敬的读者们！我们出版这份手稿，并非想制造什么轰动或发现，而是想说，瓦西里修士（普罗宁）除了其他方面，还是圣约翰（上海的）的属灵儿女（告解师）。而今天，当这位圣人的手稿正成为严谨研究的对象时，我们相信这篇《论祷告》将在收集这位旧金山圣人著作的事业中占据一席之地。
    - type: paragraph
      text:
        ru: Пусть не осудит нас читатель в том, что мы не сократили или же урезали труд по каким-то стилистическим, орфографическим или иным причинам. Труд написан одним святым, переведён другим не менее известным подвижником и исповедником и достоин публикации.
        cn: 愿读者勿因我们没有出于任何文体、拼写或其它原因而缩减或删节这部著作，就论断我们。这部著作由一位圣人所著，并由另一位同样著名的苦修者和宣信者翻译，且值得出版。
    - type: paragraph
      text:
        ru: Протоиерей Александр Монич
        cn: 司祭长 亚历山大·莫尼奇
  - type: heading2
    text:
      ru: О молитве
      cn: 论祷告
    children: []
  - type: heading2
    text:
      ru: Глава I
      cn: 第一章
    children:
    - type: paragraph
      text:
        ru: Чтобы христианин всегда получал благодатную помощь Божию, надо чтобы он находился в непрерывном общении с Богом и постоянно был в связи с внешним миром. Средством для этого является молитва. Молитва есть разговор человека с Богом, благочестивый разговор человеческой души с её Творцом.
        cn: 为了基督徒能常蒙受上帝的恩典帮助，就需要他与上帝保持不间断的交通，并持续与外在世界保持联系。达到此目的的途径是祷告。祷告是人与上帝的对话，也是人类灵魂与她的造物主之间虔敬的对话。
    - type: paragraph
      text:
        ru: Молитва разделяется на внешнюю и внутреннюю. Внешняя молитва выражается словами или знаками; внутренней молитвой человек молится в своей душе.
        cn: 祷告分为外部祷告和内部祷告。外部祷告通过言语或记号来表达；借由内部祷告，人是在自己的灵魂中祷告。
    - type: paragraph
      text:
        ru: 'Внешняя молитва без внутренней не имеет цены, потому что это фарисейская, лицемерная молитва. Внутреннюю молитву Бог слышит и тогда, когда она ничем не выражается. Но в большинстве случаев наша внутренняя молитва как-то выражается. Все движения нашей души влияют на наше тело. И как сразу видно весел человек или [печален], так как тело принимает впечатление от души, [так точно] и благочестивое настроение стремится, чтобы [ему] подчинялось тело. А также выражение нашей религиозности движениями или другими знаками [выражается] потребностью нашей души. Поэтому неправы те, которые говорят, что достаточна только внутренняя молитва: такие люди в большинстве случаев никак не молятся. Можем молиться только внутренней молитвой, но кроме неё время от времени нужна и внешняя молитва. Она необходима, чтобы усилилось наше молитвенное настроение, потому что всякое выраженное чувство усиливается. Поэтому, обычно, наша внутренняя молитва соединена с внешней, или общественной, или частной молитвой.'
        cn: 外在祷告若无内在祷告便毫无价值，因为那是法利赛式的虚伪祷告。内在祷告，即便它丝毫无所表露，上帝亦垂听。然而在多数情况下，我们的内在祷告总会以某种方式表现出来。我们灵魂的所有活动都会影响我们的身体。正如一个人是喜乐还是悲伤，立刻便可看出，因为身体会接受灵魂的印记，同样，虔敬的心境也渴望身体顺服于它。此外，我们宗教虔敬的表达，无论是通过姿态还是其他标记，乃源于我们灵魂的需求。因此，那些声称仅有内在祷告就已足够的人是错误的：这样的人在多数情况下根本就不祷告。我们固然可以只用内在祷告来祈祷，但除了它之外，我们偶尔也需要外在祷告。外在祷告是必要的，以便我们的祷告心境得以增强，因为任何表达出来的情感都会增强。因此，通常我们的内在祷告是与外在的、公共的或私人的祷告相结合的。
  - type: heading2
    text:
      ru: Глава II
      cn: 第二章
    children:
    - type: paragraph
      text:
        ru: Общественное Богослужение есть молитва, которая совершается от имени собора, от имени Церкви. Частная молитва есть моление одного или нескольких людей без посредства Божиих слуг. Частную молитву может совершать всякий. И в его воле, будет ли он читать определённые молитвы или будет молиться так, как ему душевное настроение указывает.
        cn: 公共礼拜是一种祷告，它以会众的名义，以教会的名义举行。私人祷告则是一个或几个人在没有上帝仆役居间的情况下所作的祈求。任何人都可以进行私人祷告。他可以自行决定是诵读既定祷词，抑或按其内心光景所指引的方式祷告。
    - type: paragraph
      text:
        ru: Общественная молитва, особенно молитва в Церкви важнее частной молитвы. Христос сказал«Идеже бо еста два, или трие собрани во Имя Мое, ту есмь посреди их» (Мф. 18:20).
        cn: 公共祈祷，尤其是在教会中的祈祷，比个人祈祷更重要。基督说：「因为无论在哪里，有两三个人奉我的名聚会，那里就有我在他们中间。」（马太福音 18:20）
    - type: paragraph
      text:
        ru: Бог любит, чтобы люди спасались вместе и поэтому основалЦерковь, т. е. общество всех, которые правильно веруют в Бога, которые имеют главой Христа, которые имеют целью перерождение и совершенство членов на земле и их блаженство на небе. Для этого спасения надо быть членом Церкви и принимать участие в её жизни. Члены Церкви должны собираться на общую молитву по храмам – местам посвящённым Богу, где всё напоминает о небесном.
        cn: 上帝爱世人一同得救，因此创立了教会，即所有正确信仰上帝之人的团体，以基督为首，以地上成员的重生与成全为目的，以及他们在天上的福乐。为了这份救恩，必须成为教会的成员并参与其生活。教会成员应当在共同祷告中聚集于圣殿——这些奉献给上帝的地方，在那里，一切都使人联想到天上的事。
    - type: paragraph
      text:
        ru: В храмах мы легче можем освободиться от земных попечений и всё своё внимание устремить на молитву.
        cn: 在教堂里，我们更容易摆脱地上的挂虑，并把我们全部的注意力专注于祈祷。
    - type: paragraph
      text:
        ru: Молясь вместе, мы выражаем этим любовь друг ко другу, и поэтому во время общественных Богослужений не надо читать частные молитвы, но надобно следить за Богослужением, вместе выражать знаки Богопочитания (метания, поклоны и т. д.). Такая молитва увеличивает благочестивое настроение и одушевление молящихся, потому что передаётся от одного к другому. Бог, хотя и слышит всякого на каждом месте, особенно присутствует своей благодатью в храмах, что явлено людям во многих видениях (св. Андрей Юродивый видел Покров Богородицы; св.Серафим Саровскийвидел Христа во время малого Входа; служение ангелов со св. Спиридоном Тримифунтским и т. д.). «Богу мила домашняя молитва, но ещё милее молитва в церкви», было явлено святой праведной Иулиании (жила в XVII веке).
        cn: 共同祈祷时，我们以此表达彼此相爱。因此，在公共礼拜时，不应诵读私祷，而应专注于礼拜，一同表达敬拜上帝的记号（包括大拜、鞠躬等等）。如此的祈祷，增进祈祷者的虔敬心境与热忱，因为它从一人传递至另一人。上帝，虽然在每个地方都垂听众人，却尤其以其恩典临在于圣堂中，这在许多异象中显现于世人（圣安德烈·尤罗迪维伊曾见过圣母的圣幔；圣塞拉芬·萨罗夫斯基在小入场时曾见过基督；天使与圣斯彼里东·特里米丰特斯一同侍奉等等）。「家庭祷告蒙上帝喜悦，而圣堂中的祷告则更蒙喜悦」，这曾显现给圣义女尤利安妮（她生活在十七世纪）。
    - type: paragraph
      text:
        ru: По церковным канонам (80-е Правило, Трульского собора), христианин, который в продолжение трёх воскресных дней не приходил в церковное собрание на Литургию, должен быть отлучён от Церкви, а если священное лицо, то извержен от клира. Только те, которые жили совсем уединённо в пустыне, не собирались на общую молитву, но где было несколько пустынников поблизости, то субботу и неделю они проводили вместе, собравшись на Богослужение.
        cn: 按照教会规章（特鲁洛大公会议第八十条规章），基督徒若连续三个主日没有参加教会的崇拜聚会（礼仪），就应被逐出教会；若是圣职人员，则应被革除圣职。只有那些完全独居在旷野中的人，不聚集进行公共祈祷；但若附近有几位隐修士，他们就会一同度过安息日和主日，聚集起来举行事奉圣礼。
    - type: paragraph
      text:
        ru: Участие в общественном Богослужении является доказательством, что мы принадлежим к Церкви, а удаление от Богослужения – знак отступничества от Церкви. Посещать Богослужения во храме надобно не только по воскресениям и праздникам, но по возможности и каждый день.
        cn: 参与公共崇拜是我们属于教会的证明，而远离崇拜则是背离教会的标志。在圣殿内参加崇拜是必要的，不仅在主日和节庆日，而且若有可能，每天都应如此。
  - type: heading2
    text:
      ru: Глава III
      cn: 第三章
    children:
    - type: paragraph
      text:
        ru: Важно присутствовать на общественном Богослужении, но не смеют из-за этого опускаться частные молитвы. Эти два вида молитв дополняют друг друга. Отдельная молитва необходимо надобна, потому что часто, а особенно при сокращённом Богослужении, человек не может удовлетвориться только молитвой в храме.
        cn: 重要的是参与公共礼拜，但不可因此而忽略个人祷告。这两种祷告互相补充。个人祷告是绝对必要的，因为常常，尤其是在精简的礼拜中，人无法仅凭在圣堂中的祷告而感到满足。
    - type: paragraph
      text:
        ru: Кроме того, отдельная молитва имеет некоторые добрые особенности, которых не имеет молитва общая.
        cn: 此外，单独祷告具有某些公共祷告所没有的美好特点。
    - type: paragraph
      text:
        ru: Уединённый человек может лучше углубиться в молитву. Когда никто не присутствует, человек думает, что его никто не видит, кроме Того, Который видел Нафанаила под смоковницей (Ин. 1:48), – и поэтому вполне отдаётся молитве, говоря Богу всё, что у него на сердце. Поэтому угодники Божии значительную часть времени определили для молитвы, не только совместной, но и отдельной.
        cn: 独处之人能更好地深入祷告。当无人同在时，人以为无人看见他，除了那在无花果树下看见拿但业的祂以外（约翰福音 1:48），因此便完全投入祷告，将心中一切向上帝倾诉。因此，上帝的圣者将大部分时间定下用于祷告，不仅是共祷，也是独祷。
    - type: paragraph
      text:
        ru: Молитвенное расположение, говорит один подвижник, является термометром душевного состояния человека. Поскольку человек больше стремится к молитве, постольку лучше стоит духовно.
        cn: 一位修道者说，祈祷的心境是人灵魂状态的温度计。人越是倾向于祈祷，灵性上就站立得越好。
    - type: paragraph
      text:
        ru: Быть нерасположенным и не иметь желания молиться значит быть духовно заспанным и духовно мёртвым.
        cn: 不情愿祷告，也没有祷告的意愿，便是在灵性上沉睡的，并在灵性上死亡的。
  - type: heading2
    text:
      ru: Глава IV
      cn: 第四章
    children:
    - type: paragraph
      text:
        ru: О чём надо молиться? Молитвы делятся на славословные, благодарственные и просительные.
        cn: 关于什么需要祷告？祷告分为颂赞的、感恩的和祈求的。
    - type: paragraph
      text:
        ru: На первом месте стоит молитва славословная, когда славим Бога и величаем Его за Его совершенства подобно небесным ангелам. Тогда человек совсем не думает о себе и о своих потребностях, но весь свой духовный взгляд устремляет к Богу.
        cn: 首先是颂赞祷告，当我们赞美上帝并因祂的完美而尊崇祂，犹如天上的天使。那时，人完全不思想自己和自己的需求，而是将他全部的属灵目光投向上帝。
    - type: paragraph
      text:
        ru: 'Благодарственная молитва есть потребность человеческой души, которая ощущает Божественную заботу о себе. В ней человек признаёт Бога за своего добродетеля и, не ища ничего больше для себя, выражает перед Богом свои чувства благодарности за полученные милости. Христос похвалил самарянина, который вернулся благодарить за исцеление и выразил порицание его друзьям, которые это не сделали (Лк. 17:12–19).«О всём благодарите: сия бо есть воля Божия о Христе Иисусе в вас», пишет апостол Павел (1Фес. 5:18).'
        cn: 感恩祷告是人类灵魂的需要，这灵魂感受着上帝对自身的眷顾。在其中，人承认上帝是他的施恩者，并且不为自己寻求更多，只是在上帝面前表达他对所领受恩典的感恩之情。基督称赞了那个为着痊愈而回来感恩的撒玛利亚人，并斥责了那些没有这样做的他的同伴们（路加福音 17:12-19）。「凡事谢恩，因为这是上帝在基督耶稣里向着你们的旨意。」使徒保罗写道（帖撒罗尼迦前书 5:18）。
    - type: paragraph
      text:
        ru: Просительная молитва отличается от первых двух молитв тем, что в ней человек просит нечто у Бога.
        cn: 祈求祷告不同于前两种祷告，在于在其中人向上帝祈求某物。
    - type: paragraph
      text:
        ru: 'Молятся часто не только из чистой любви к Богу, но и в ожидании блага, которое надеются получить от Него. Но и эта молитва угодна Богу и очень полезна человеку, возвышая его дух к Богу. Молясь такой молитвой, человек ощущает свою зависимость от Бога и укрепляет свою надежду на Него. Этим учится просить помощь от всемогущего Бога, от человека или своего разума и силы. Господь заповедал, чтобы мы обращались к Нему не только с славословием или благодарностью, но и с просьбой о наших потребностях:«ищите, и обрящите» (Мф. 7:7); «Доселе не просисте ничесоже во Имя Мое: просите, и приимете, да радость ваша исполнена будет» (Ин. 16:24). Сам Господь дал нам образец частной молитвы, и Он сам молился такой молитвой к Богу Отцу.'
        cn: 人们常常祷告，不仅仅是出于对上帝纯粹的爱，也是出于对他们希望从祂那里得到的福祉的期盼。但即便这样的祷告，也蒙上帝悦纳，并对人非常有益，将他的灵魂提升到上帝面前。当人以这样的祷告时，他感受到自己对上帝的依赖，并坚固他对上帝的希望。借此，人学会向全能的上帝、向人或自己的理智与力量祈求帮助。上主命令我们，要向祂祈求，不仅带着颂赞或感恩，也要带着我们所需的祈求：「寻找，就寻见」(马太福音 7:7)；「向来你们没有奉我的名求什么，如今你们求就必得着，好叫你们的喜乐得以满足」(约翰福音 16:24)。上主亲自给了我们私人祷告的榜样，并且祂自己也以这样的祷告向天父祈祷。
    - type: paragraph
      text:
        ru: Бог не ждёт, чтобы мы являли Ему свои потребности, так как Он их Сам знает. Но то для нас самих потребно, чтобы мы чаще вспоминали Бога и яснее видели, что всё добро, которое имеем, от Него приходит. Поэтому часто Бог нам даёт Свои блага только после нашей тёплой молитвы. А об изгнании злых духов из человека Христос определённо сказал:«Сей же род не исходит, токмо молитвою и постом» (Мф. 17:21).
        cn: 上帝不要求我们向祂显明我们的需要，因为祂自己知道这些。但这对我们自身是必要的，为了让我们更频繁地忆念上帝，并更清楚地看到我们所拥有的一切良善都来自祂。因此，上帝常常只在我们热切的祷告之后才将祂的恩典赐给我们。至于把邪灵从人里面赶出去，基督明确地说：「这一类若不藉着祷告和禁食，它就不出来。」（马太福音 17:21）
    - type: paragraph
      text:
        ru: Молиться к Богу надо обо всех наших потребностях, как духовных, так и телесных. Много лучше молитва, когда молимся о духовном благе. Всякий христианин должен в первую очередь молиться о своём спасении и о спасении своих близких. Его любовь по отношению к ближним должна охватить целый свет, и он должен молиться за всех людей. Это должен делать особенно пастырь, который обязан заботиться о человеческих душах, потому что пастырство соединено со священством, посредничеством между Богом и людьми. Апостол Павел пишет Тимофею:«Молю убо прежде всех творити молитвы, моления, прошения, благодарения за вся человеки» (1Тим. 2:1).
        cn: 我们应当向上帝祷告，为了我们所有的需要，无论是属灵的，还是身体的。当我们为属灵的益处祷告时，这样的祷告更为美好。每一位基督徒首先应当为自己的救赎祷告，也为自己亲近之人的救赎祷告。他对邻人的爱应当遍及整个世界，并且他应当为所有人祷告。牧者尤其应当如此行，因为他们负有照料人类灵魂的责任。牧职与圣职相连，是上帝与人类之间的中保。使徒保罗写信给提摩太说：「所以我劝勉，首先要为众人献上恳求、祷告、代求和感恩。」（提摩太前书 2:1）
    - type: paragraph
      text:
        ru: Священник должен особенно молиться о своей пастве, чтобы Бог помог ему водить её по правому пути. Богу эти молитвы самые милые. Когда Соломон молился Богу, чтобы Бог дал ему премудрость для управления народом, Господь подарил ему кроме премудрости также земную славу и богатство.
        cn: 司祭尤其应当为他的羊群祈祷，好使上帝帮助他引领它们行走在正道上。对上帝而言，这些祈祷最蒙悦纳。当所罗门向上帝祈祷，求上帝赐予他智慧以治理子民时，上主除智慧以外，也赐予他地上的荣耀和财富。
    - type: paragraph
      text:
        ru: И христианам заповедано, чтобы не заботились о земном, но«Ищите же прежде царствия Божия, и правды его, и сия вся приложатся вам» (Мф. 6:33).
        cn: 基督徒也被诫命，不要为地上之事忧虑，而是：你们要先寻求上帝的国和祂的义，所有这些都必加给你们了（马太福音 6:33）。
    - type: paragraph
      text:
        ru: Потому первая молитва должна быть о духовных потребностях. Когда пастырь молит Бога о помощи в своём труде, Господь – Верховный пастырь – очень скоро эту молитву исполнит. Но она должна быть с полной верой и любовью к Богу и людям, о которых молимся.
        cn: 因此，首要的祷告应当是关于属灵的需要。当牧者为他的事工向 上帝 祈求帮助时，上主——至高的牧者——必会很快应允这祷告。但它必须是满怀对 上帝 和我们所祷告之人的完全信心和爱。
  - type: heading2
    text:
      ru: Глава V
      cn: 第五章
    children:
    - type: paragraph
      text:
        ru: Молитва должна всегда заканчиваться преданием себя воле Божией. Часто мы ошибаемся в выборе вредного и полезного для нас и просим Бога о вредном и для нас и для другого. Поэтому мы иногда не получаем от Бога то, что просим. Но это не значит, что Бог нас не слышит.
        cn: 祷告应当始终以将自己全然交托于上帝的旨意为结束。我们常常在区分何为对我们有害、何为对我们有益的事物上犯错，并向上帝祈求那些对我们自己和对他人都有害的事物。因此，我们有时得不到从上帝那里所祈求的。但这并不意味着上帝不垂听我们。
    - type: paragraph
      text:
        ru: Бог нас слышит и даст нам другое, более полезное, вместо того, о чём мы молились. Получивши это, мы наполняемся душевным миром и чувствуем в сердце, что это ответ на нашу просьбу.
        cn: 上帝垂听我们，并赐予我们另一样更为有益的，以取代我们所祈祷的。领受了这之后，我们便被心灵的平安充满，并在心中感受到，这是对我们祈祷的回应。
    - type: paragraph
      text:
        ru: Случалось, не получали просимого в молитвах  и великие святители, и самому апостолу Павлу Бог открыл в видении, что ему полезно, чтобы его молитва не исполнилась (2Кор. 12:9). Иногда Господь исполняет нашу молитву позднее, чтобы мы усилили нашу ревность в молитве и показали нашу веру.
        cn: 曾有的时候，甚至伟大的圣主教们在祷告中所求也未蒙应允，甚至连使徒保罗自己，上帝也在异象中启示他，他的祷告不蒙应允对他反而有益处（哥林多后书 12:9）。有时上主会延迟应允我们的祷告，是为了使我们加增祷告的热忱，并显明我们的信心。
    - type: paragraph
      text:
        ru: Не должно ослабевать в молитве даже тогда, когда нам кажется, что Бог отвернул Свое лице от нас и не слышит нашу молитву. Христос Свою притчу о неправедном судии закончил словами:«Бог же не имать ли сотворити отмщение избранных Своих, вопиющих к Нему день и нощь, и долготерпя о них? Глаголю вам, яко сотворит отмщение их вскоре» (Лк. 18:7–8).
        cn: '不应在祷告中懈怠，即使当我们觉得上帝向我们掩面，并且不垂听我们的祷告。基督以祂那关于不义的审判官的比喻结束时，说了这些话：


          「上帝岂不为祂所拣选的人伸冤呢？他们昼夜呼求祂，祂又为他们忍耐许久吗？我告诉你们，祂必快快地为他们伸冤了。」 (Лк. 18:7–8)'
    - type: paragraph
      text:
        ru: 'Господь похвалил хананеянку, которая Его неотступно просила, и исполнил её просьбу(Мф. 15:21–28;Мк. 7:24–30). Так и мы никогда не должны терять надежду, что Бог исполнит нашу просьбу: будем молиться, пока не получим или не почувствуем, что наша молитва не в воле Божией.'
        cn: 主称赞了那恳切地向祂祈求的迦南妇人，并应允了她的请求（马太福音 15:21-28，马可福音 7:24-30）。照样，我们绝不可失去希望，相信上帝会应允我们的请求：我们要不断祈祷，直到我们得着，或直到我们感觉到我们的祈祷不合上帝的旨意。
  - type: heading2
    text:
      ru: Глава VI
      cn: 第六章
    children:
    - type: paragraph
      text:
        ru: Молиться надо не только тогда, когда ощущаем нужду в чём-либо, но вся жизнь христианина должна быть молитвой, особенно жизнь пастыря. Апостол Павел говорит:«Непрестанно молитеся» (1Сол. 5:17). Это не значит, что человек должен только молиться и ничего больше не делать. Но это означает, что человек всегда должен иметь молитвенное настроение и в каждый момент иметь в уме, что он находится перед лицом Божиим и в душе своей разговаривает с Ним. Заповедуется, следовательно, непрерывная внутренняя молитва. В это состояние нельзя сразу войти. Неправы те, которые говорят, что кроме внутренней молитвы не нужны никакие другие, так как в постоянной молитве может находиться только тот, который обучен внешней молитве.
        cn: 我们不应只在感受到有所需求时才祷告，但基督徒的整个生命都应当是祷告，尤其是牧者的生命。使徒保罗说：「不住地祷告」（帖撒罗尼迦前书 5:17）。这并非意味着人只应祷告而什么也不做。但这表示人应当常常怀有祷告的心情，并且在每一个时刻都铭记于心，他是在上帝面前，并在灵魂深处与祂交谈。因此，所吩咐的是持续不断的内在祷告。这种状态无法立刻进入。那些说除了内在祷告之外，不需要任何其他祷告的人是错误的，因为只有那些接受过外在祷告训练的人，才能处于持续不断的祷告中。
  - type: heading2
    text:
      ru: Глава VII
      cn: 第七章
    children:
    - type: paragraph
      text:
        ru: Молитва имеет различные степени. Чаще всего случается, что не имеем желания молиться, несмотря на то, что пришло время молитвы. В этом случае надо себя побороть и читать определённые молитвы, со вниманием выговаривая или читая каждое слово. В начале это будет лишь механический труд, и молитва будет только внешняя. Но это не есть молитва лицемера и фарисея, о которых Христос сказал, что они его почитают только устами, а что сердце их далеко от Него (Мф. 15:8). Фарисеи и не старались приблизиться духовно к Богу, и молились только для того, чтобы показаться благочестивыми перед людьми. А здесь человек желает молиться, не думая о людской похвале, но молится только внешней молитвой потому, что его дух в тот час не приготовлен для молитвы.
        cn: 祷告具有不同的程度。最常发生的是，我们没有祷告的意愿，尽管祷告的时间已经到来。在这种情况下，我们必须战胜自己，并诵读特定的祷告文，专注地念出或读出每一个字。起初，这只是机械性的劳作，祷告也仅仅是外在的。但这并非伪君子和法利赛人的祷告，基督曾论及他们说，他们只是口头上尊敬祂，他们的心却远离祂（马太福音 15:8）。法利赛人也从未努力在灵性上亲近上帝，他们祷告只是为了在人前显得虔诚。然而，在这里，人是真心想祷告的，并非为了寻求人的赞扬，而只是进行外在的祷告，因为在那一刻，他的心灵尚未为祷告做好准备。
    - type: paragraph
      text:
        ru: 'За время этой внешней молитвы приходит настроение для искренней молитвы. Надо только желать этого и следить за молитвами, которые читаем. В этом случае не надобно заставлять себя что-либо ощущать или вызывать в себе чувство: оно бы было неискренно. Если внимательно читаем молитвы, тогда мы приготовимся для молитвы.'
        cn: 在进行这种外在的祷告时，会产生适合真诚祷告的心境。只需要渴望如此，并留意我们所诵读的祷文。在这种情况下，不必强迫自己感受任何事物，也不必在自身激起任何感受：那将是不真诚的。如果我们专心诵读祷文，那么我们就会为祷告做好准备。
    - type: paragraph
      text:
        ru: Сначала получим интерес о том, что читаем, и уже не должны заставлять себя быть внимательными. После этого мы получаем желание к молитве, находим в том духовное удовлетворение.
        cn: 首先，我们要对所阅读的内容产生兴趣，这样一来，我们就不必强迫自己保持专注了。此后，我们便会生发出祷告的渴望，并在其中找到属灵的满足。
    - type: paragraph
      text:
        ru: 'Затем мы отдаёмся молитве, забываем о всём земном, переносясь мыслию к Богу. Наконец, достигаем высшей степени молитвы, когда наш ум всегда направлен к небесам, и когда наш дух находится в непрерывном разговоре с Богом. Человек всё сознаёт: может всё делать и о всём думать, но в это же время его ум молится Богу и просит от Него руководства. Это уже непрерывная молитва, к которой должны все стремиться, но её могут иметь только великие молитвенники и ревнители благочестия.'
        cn: 然后，我们全心投入祷告，忘却一切尘世之事，心思意念转向上帝。最终，我们达到祷告的最高境界，那时我们的心智始终仰望天堂，我们的灵与上帝持续对话。人能完全清醒，能做一切事，也能思虑一切事，但与此同时，他的心智仍在向上帝祷告，并向祢祈求指引。这已是不住的祷告，众人皆当竭力追求，但唯有伟大的祈祷者和热心敬虔者方能拥有。
    - type: paragraph
      text:
        ru: Иногда, когда они отдаются не только внутренней, но и внешней молитве, они ощущают такое блаженство, что забывают всё мирское и предчувствуют блаженство вечной жизни с Богом. Такое состояние не продолжается долго.«Отними от меня волны Твоей благодати, чтобы я не умер от полноты блаженства», – молился один подвижник.
        cn: 有时，当他们全然投入不仅是内祷，而且是外祷时，他们感受到如此的福乐，以至于他们忘却了一切世俗之事，并预尝了与上帝同在的永生福乐。这样的状态并不会持续很久。「求祢收回祢恩典的波涛，免得我因福乐满溢而死去。」——一位苦行修士如此祷告。
    - type: paragraph
      text:
        ru: Но и в остальное время такие подвижники так одушевлены, что никакие тяжести этой мирской жизни не в состоянии победить мир и блаженство, которое царствует в их душах. Они радостно всё переносят ради имени Христова. Вера – их твёрдая опора. Они в постоянном общении с горним светом.
        cn: 但即便在其他时候，这样的虔修者也如此充满生气，以至于世俗生活的任何重负都无法战胜在他们灵魂中掌权的平安与至福。他们欢欣地承受一切，为了基督的圣名。信仰是他们坚实的依靠。他们不断地与那属天之光交通。
    - type: paragraph
      text:
        ru: Однажды пришли к преподобному Серафиму Саровскому (2 июня 1833 г.) люди из его края и спрашивали у него, что передать его родственникам. Преподобный посмотрел тогда на иконы и сказал:«Эти – мои родственники». Это не были только слова, но постоянное общение со святыми стало причиной того, что они в действительности стали самые лучшие и самые дорогие приятели великого молитвенника.
        cn: 有一次，来自萨罗夫的圣塞拉芬长老（1833年6月2日）家乡的人们来到他那里，询问他要给他的亲属们带什么口信。圣长老当时看着圣像，说：「这些是我的亲属。」这不只是言语，而是他与圣人们持续不断的交通，使得他们确实成为了这位伟大的祈祷者最好和最亲爱的挚友。
    - type: paragraph
      text:
        ru: Разумеется, этого состояния могут достигнуть только некоторые. Но каждый христианин должен трудиться сам и направлять своих ближних на молитву; должен потрудиться сам, сколько в силах, чтобы получить благодатные дары, которые получаются через молитву.
        cn: 当然，只有一些人能够达到这种状态。但每一位基督徒都应该自己努力，并引导自己的近人去祷告；都应该尽其所能地努力，以期获得那些通过祷告才能得到的神恩恩赐。
  - type: heading2
    text:
      ru: Глава VIII
      cn: 第八章
    children:
    - type: paragraph
      text:
        ru: Крепость веры, душевный мир, укрепление душевных способностей, ощущение непосредственной близости Бога и Его святых – это сопутствует молитве.
        cn: 信仰的坚固，心灵的平安，灵魂能力的巩固，对上帝和祂的圣者们直接亲近的感受——这些都伴随着祷告。
    - type: paragraph
      text:
        ru: Кроме того, молитвою получаются многочисленные дары для наших духовных и земных потребностей, особенно для первых.
        cn: 此外，藉着祷告，我们能获得众多的恩赐，以满足我们属灵的和属世的需要，尤其是为了前者。
    - type: paragraph
      text:
        ru: Когда молимся о чём-нибудь, что полезно нам или нашим близким, часто Господь так быстро исполняет наши просьбы, что не успеваем молитву выговорить словами или мысленно, а ум получает то, о чём мы молились. Это должно нас убедить в том, что Бог заботится о нас и тогда, когда мы не получаем сразу просимое.
        cn: 当我们为对自己或亲人有益的事物祈祷时，圣主常常如此迅速地回应我们的请求，以至于我们来不及用言语或意念说出祷告，而心智已领受了我们所祈求的。这应当使我们确信，上帝关照着我们，甚至当我们没有立即得到所求之事时亦然。
    - type: paragraph
      text:
        ru: Бог даёт нам в молитве и многие дары о которых мы не молились, так как сила молитвы не состоит в выговоренных словах или мыслях, но сила молитвы есть общение с Духом Святым. Дух помогает нам в наших слабостях, так как не знаем о чём молиться, как полагается,«но Сам Дух ходатайствует о нас, воздыхании неизглаголанными» (Рим. 8:26).
        cn: 上帝在祷告中赐予我们许多我们未曾祈求的恩赐，因为祷告的力量不在于说出的言语或思想，而在于与圣灵的交通。圣灵在我们的软弱中帮助我们，因为我们不知道当怎样按着理当祷告，「只是圣灵亲自用不可言喻的叹息替我们代求」（罗马书 8:26）。
    - type: paragraph
      text:
        ru: Молитва есть также средство для укрепления любви и примирения с врагами. Когда мы молимся за кого-нибудь, у нас создаётся расположение к нему, и тот, не зная этого, ощущает проявленную ему любовь, и его сердце становится мягче. Поэтому надо всегда молиться не только о себе, но и о других живых и умерших.
        cn: 祷告也是坚固爱、并与仇敌和解的方法。当我们为某人祷告时，我们心里会对他生出爱意，而那人，虽不知情，却感受到向他显明的爱，他的心也会变得柔软。所以，应当常常祷告，不仅是为自己，也是为其他活着的和已故的。
    - type: paragraph
      text:
        ru: Особенно пастырь должен молиться о своей пастве, так как это одна из главных его обязанностей по отношению к ней. Если он запустит эту свою обязанность, тогда не может успешно исполнять и остальные. В молитве он черпает силу для своей работы.
        cn: 尤其，牧者应当为其牧群祈祷，因为这是他对他们首要的职责之一。如果他疏忽这项职责，那么他也无法成功地履行其他职责。在祈祷中，他汲取力量以完成自己的工作。
  - type: heading2
    text:
      ru: Глава IX
      cn: 第九章
    children:
    - type: paragraph
      text:
        ru: 'Всякий христианин должен молиться хотя бы три раза в день: вечером, утром и в полдень, особенно если он – духовное лицо. Должен определить себе на каждый день определённое время для молитвы и без особенной надобности не оставлять это.'
        cn: 每一位基督徒都应当每日至少祈祷三次：在晚上、早上和中午。尤其若他是一位神职人员，更当如此。他应当为自己每日定下固定的祈祷时间，且无特殊必要，不可间断。
    - type: paragraph
      text:
        ru: Когда пробудится утром, первая его мысль должна быть обращена к Богу; когда встанет, должен провести в молчании столько времени, сколько ему обстоятельства разрешают.
        cn: 当他清晨醒来时，他的第一个念头应转向 上帝；当他起身时，他应在静默中度过其境况所允许的时间。
    - type: paragraph
      text:
        ru: Также и перед сном, каждый христианин должен молиться Богу, каясь в грехах и молиться Богу, чтобы наступающий день больше преуспевал в доброй жизни и Божием законе.
        cn: 同样，在睡前，每一位基督徒都应当向上帝祈祷，忏悔自己的罪孽，并向上帝祈告，愿来日更能活出良善的生命，并在上帝的律法中大有进展。
    - type: paragraph
      text:
        ru: 'Если кроме определённого времени христианин ощутит желание молиться, не надо воздерживаться. Пусть молится только внутренней молитвой, если в том [есть нужда, и он] находится в обществе. Если свободен, должен оставить другие заботы [и продолжить] молитву, пока продолжается настроение. СвятойИоанн Златоуст[говорит: «Если ты] пробудишься ночью и ощутишь желание молиться, стань на [колени] и ангел хранитель будет молиться вместе с тобой.Если же [уснёшь] и не встанешь, отступит ангел от тебя, и дьявол придёт [?]».'
        cn: 如果在规定时间之外，基督徒感到想要祷告，不应克制。他可仅以内心祷告，如果对此有需要，且身处人群之中。如果有空闲，应放下其他事务，并继续祷告，直到这种心境持续。圣金口约安说：「如果你在夜间醒来，感到想要祷告，就跪下，你的守护天使就会与你一同祷告。如果你睡去却不起来，天使就会离你而去，魔鬼就会到来[？]。」
    - type: paragraph
      text:
        ru: '[Древние] отцы советуют, если во время молитвы какое-[нибудь] слово или выражение особенно привлечёт наше внимание и вызовет ощущение, не должно читать дольше, пока оно продолжается. Лучше меньше прочесть с чувством, нежели больше и без чувства. Должны определить и [долю], какие молитвы будем читать, но это не должно быть лишь формальное исполнение правила и без цели.'
        cn: '[古]教父们建议，如果在祷告时，某个词语或表达特别吸引我们的注意并引发某种感受，只要那种感受持续着，就不应继续读下去。宁可带着感受少读一些，也不要多读却毫无感受。我们应当确定要读哪些祷文，以及读祷文的[分量]，但这不应只是形式上地遵守规矩，而没有目标。'
    - type: paragraph
      text:
        ru: Надо сначала немного успокоиться и тогда внимательно прочесть молитвы, а потом дать некоторое время душе остаться под влиянием совершённой молитвы. И тогда с верой в Божию помощь приступить к своим занятиям. Аминь.
        cn: 应先稍微平静下来，然后仔细诵读祷文，而后给灵魂一些时间，让其停留在已完成的祷告的影响之下。这样，带着对上帝帮助的信心，着手进行自己的事务。阿们。
    - type: paragraph
      text:
        ru: Подготовил к публикациипротоиерей Александр Монич, кандидат богословия, учёный секретарь «Богословско-исторического научно-исследовательского центра имени архимандрита Василия (Пронина)
        cn: 编订：大司祭 亚历山大·莫尼奇，神学副博士，«以大修士 瓦西里（普罗宁）命名的神学历史科学研究中心» 学术秘书
