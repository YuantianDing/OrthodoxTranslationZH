    - type: paragraph
      text:
        ru: 'Кроз опроштај грехова Господ даје силе човеку да се бори са гресима, и да их савлада и победи. А побеђујући грехе човек кроз њих побеђује и творца њиховог: ђавола. У нашем човечанском свету грех изгледа нека безлична сила, тако и зло. Отуда у многих лакомислено уверење да је лако победити грех и зло. Али чим се тога подухвати, човек одмах и увиди како је грех нека страшна сила, иза које стоји нешто много јаче од њега. А кад се озбиљно протрага за кореном греха, сваког греха, увек нас сваки грех одводи своме корену: ђаволу. Тако, иза сваког зла таји се зли: ὁ πονηρός = нечастиви. Ко се једанпут озбиљно борио са својим грехом, сазнао је да га не може савладати без помоћи Безгрешнога. Поготову ако се борио са многим гресима, јер се кроз њих борио са творцем њиховим, и браниоцем, и апологетом: ђаволом. Само Христом човек постаје свемоћан у борби против греха и ђавола. Ту важи апостолска благовест: «Све могу у Христу Исусу који ми моћ даје» (Флп.4:13). Зато свети Богослов благовести: «Пишем вам, оци, јер познасте онога који је од почетка. Пишем вам, младићи, јер надвладасте нечастивога – νενικήκατε τὸν πονηρόν (= злог). Пишем вам, децо, јер познасте Оца».'
        cn: 借着罪的赦免，主赐予人力量，去与罪争战，并克服和战胜它们。当人战胜罪时，也借着它们战胜了它们的创造者：魔鬼。在我们人类的世界中，罪看起来像某种无个性的力量，邪恶亦是如此。因此，许多人抱有轻率的信念，认为战胜罪和邪恶是容易的。但人一旦着手去做，立刻就会明白罪是一种可怕的力量，在其背后站立着比它强大得多的事物。而当人们认真追溯罪的根源时，每一种罪总会将我们引向它的根源：魔鬼。因此，在每一种邪恶的背后，都隐藏着那恶者：ὁ πονηρός = 不洁者。凡是认真与自己的罪争战过一次的人，都明白了若没有那无罪者的帮助，便无法克服它。尤其是当他与许多罪争战时，因为他借着这些罪与它们的始作俑者、辩护者以及辩解者：魔鬼争战。唯独借着基督，人才能在对抗罪和魔鬼的争战中变得全能。在此，使徒的喜讯适用：「我靠着那加给我力量的基督耶稣，凡事都能做」（腓立比书 4:13）。因此，圣神学家宣告说：「父老啊，我写信给你们，因为你们认识那从起初就有的。少年人哪，我写信给你们，因为你们胜了那恶者 – νενικήκατε τὸν πονηρόν (= 恶的)。小子们哪，我写信给你们，因为你们认识父。」（约翰一书 2:13-14）
