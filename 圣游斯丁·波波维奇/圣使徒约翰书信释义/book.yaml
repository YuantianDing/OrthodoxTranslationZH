    - type: paragraph
      text:
        ru: '"И знамо да Син Божји дође, и дао нам је разум – διάνοιαν – да познамо Бога истинога; и ми смо у истинитом Сину његовом Исусу Христу. Ово је истинити Бог и живот вечни – ὁ ἀληθινὸς Θεὸς καὶ ζωὴ αἰώνιος«. У овом стиху сажето целокупно Еванђеље светог Богослова, и целокупно његово богословље. Син Божји је дошао, и дао нам је разум, те смо у Њему познали истинитог Бога; и дао нам је и силе, којом смо постали Његови, којом смо се настанили у Њему, те смо свим бићем унутра у Њему: у истинитом Богу, и кроза Њ у вечном животу. Јер је Он и истинити Бог и живот вечни. »Ми смо у Исусу Христу«, то је прави одговор правих хришћана на питање: где сте, где се налазите? Иако живимо у свету који »сав у злу лежи" – "ми смо у Исусу Христу«: у истинитом Богу и вечном животу. Да нам истинити Бог није дао «разум», ми не бисмо познали правог Бога, заувек бисмо остали незнабошци. Јер само је Богочовек Христос – истинити Бог. Ко то не види и не исповеда – незнабожац је, јер не зна истинитог Бога. А признаје ли ма кога другог или ма шта друго за бога, опет је незнабожац, јер не познаје једино истинитог Бога и Господа Исуса Христа. А да је Он – истинити Бог показао је и доказао тиме што не само има вечни живот него је Он сам живот вечни, и даје га свима који верују у Њега. По томе се познаје истинити Бог, што је Сам живот вечни и даје га свима својим следбеницима. То је најсигурније мерило за разликовање истинитог Бога од лажних богова. Лажан је сваки бог који не може људима да да и осигура живот вечни. А то не може нико ко није у стању да победи смрт. Богочовек је једини победио смрт васкрсењем. Зато је Он – истинити Бог и живот вечни. Све је друго – небог и лажни бог. Признавање, исповедање, проповедање ма ког другог бога сем Христа није друго до незнабоштво, идолопоклонство. Да, идолопоклонство. Јер је свако идолопоклонство уствари незнабоштво, јер клањање ма ком идолу и јесте незнабоштво. У идолопоклонство спада све: од најгрубљег фетишизма до најтананијег симболизма. Идолопоклонство је клањати се као Богу не само: камењу, дрвећу, животињама, планетама, киповима, него и људима, и херојима, и генијима, и проналасцима, и идејама, и страстима, и култури, и цивилизацији, и науци, и философији, и уметности, или ма чему што собом хоће да замени истинитог Бога и Господа – Исуса Христа. Стога свети Громовник новозаветне истине и завршава своју чудесну благовест речима: «Дечице! чувајте се од идола» – φυλάξατε ἑαυτοὺς ἀπὸ τῶν εἰδώλων: чувајте се од идолопоклонства, чувајте се од незнабоштва. «Амин".'
        cn: 我们也知道神的儿子已经来到，并且赐给我们悟性（διάνοιαν），使我们认识那位真实的上帝；我们也在他真实的儿子耶稣基督里。这位就是真实的上帝，也是永生（ὁ ἀληθινὸς Θεὸς καὶ ζωὴ αἰώνιος）。(约翰一书 5:20) 在这节经文中概括了神学家圣约翰的全部福音，以及他全部的神学。神的儿子已经来到，并赐给我们悟性，使我们在他里面认识了真实的上帝；他也赐予我们能力，借此我们成为了属他的，借此我们住在他里面，以致我们整个生命都在他里面：在真实的上帝里面，并借着他进入永生。因为他既是真实的上帝，也是永生。「我们在耶稣基督里」，这是真正的基督徒对「你们在哪里？你们身在何处？」这个问题的正确回答。尽管我们生活在一个「全然卧在恶者手下」的世界里——「我们在耶稣基督里」：在真实的上帝和永生里。如果真实的上帝没有赐予我们「悟性」，我们就不会认识那位真正的上帝，我们将永远是异教徒了。因为只有神人基督——才是真实的上帝。凡是不看见、不承认这一点的，就是异教徒，因为他不认识真实的上帝。而如果有人承认任何其他的人或任何其他的事物为神，他仍然是异教徒，因为他不认识独一真实的上帝和主耶稣基督。而他——真实的上帝——他显示并证明了这一点，因为他不仅拥有永生，他本身就是永生，并且他将其赐予所有信他的人。真实的上帝因此而被认识：他本身就是永生，并将其赐予所有跟随他的人。这是区分真实的上帝与虚假之神的最终确凿标准。任何不能赐予并确保人类得享永生的神都是虚假的。而任何不能战胜死亡的都无法做到这一点。只有神人借着复活战胜了死亡。因此他——就是真实的上帝和永生。其他的一切都不是神，而是虚假之神。承认、宣认、传扬基督以外的任何其他神，无异于异教主义和偶像崇拜。是的，就是偶像崇拜。因为任何偶像崇拜实际上都是异教主义，因为敬拜任何偶像就是异教主义。偶像崇拜包含一切：从最粗糙的拜物教到最精微的象征主义。偶像崇拜就是将下列事物当作神来敬拜，不仅是：石头、树木、动物、行星、雕像，也包括：人类、英雄、天才、发明、思想、情欲、文化、文明、科学、哲学和艺术，或任何企图取代真实的上帝和主——耶稣基督的事物。因此，新约真理的圣雷子以这句告诫结束了他奇妙的福音信息：「孩子们哪！你们要自守，远避偶像（φυλάξατε ἑαυτοὺς ἀπὸ τῶν εἰδώλων）！」 (约翰一书 5:21) 要远避偶像崇拜，远避异教主义。「阿们。」
