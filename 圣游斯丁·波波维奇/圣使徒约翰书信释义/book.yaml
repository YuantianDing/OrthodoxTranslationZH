  - type: heading2
    text:
      ru: Тумачење друге посланице Светог Jована Богослова
      cn: 圣约翰神学家第二书信诠释
    children:
    - type: paragraph
      text:
        ru: 2 Јованова 1–13
        cn: 约翰二书 1-13
    - type: paragraph
      text:
        ru: '2Ин.1–13:1Старјешина изабраној госпођи и дјеци њезиној, коју ја волим у истини, и не само ја, него и сви који су познали истину, 2 Ради истине која остаје у нама и с нама ће бити вавијек: 3 Да буде с вама благодат, милост, мир од Бога Оца и од Господа Исуса Христа, Сина Очева, у истини и љубави. 4 Обрадовах се веома што сам нашао неке од дјеце твоје да ходе у истини, као што примисмо заповијест од Оца. 5 А сад, молим те, госпођо, не као да ти нову заповијест пишем, него коју имадосмо од почетка, да љубимо једни друге. 6 А ово је љубав: да ходимо по заповијестима његовим. Ово је заповијест, како чусте од почетка, да по њој ходите. 7 Јер многе варалице изиђоше у свијет, који не признају Исуса Христа да је дошао у тијелу; такав је варалица и антихрист. 8 Чувајте се, да не изгубимо оно што урадисмо, него да примимо потпуну плату. 9 Сваки који преступа и не остаје у учењу Христовом, тај Бога нема; а који остаје у учењу Христовом, он има и Оца и Сина. 10 Ако неко долази к вама и ово учење не доноси, не примајте га у кућу и не поздрављајте се. 11 Јер ко се поздравља с њим, учествује у његовим злим дјелима. 12 Имао бих много да вам пишем, али не хтједох на хартији и мастилом, него се надам да ћу вам доћи и усмено вам говорити, да радост наша буде потпуна. 13 Поздрављају те дјеца сестре твоје изабране. Амин.'
        cn: '(约翰二书 1:1-13)

          1 长老写信给蒙拣选的夫人和她的儿女，就是我按真理所爱的，不但我爱，凡认识真理的也都爱你们； 2 这是为真理的缘故，这真理常存在我们里面，也必与我们同在，直到永远。

          3 愿恩惠、怜悯、平安从父神和父的儿子主耶稣基督那里，在真理和爱中与你们同在。

          4 我大大地欢喜，因我遇见你的儿女中，有人按真理而行，正如我们从父所受的命令一样。 5 夫人哪，我现在恳求你，我写给你的，不是一条新命令，而是我们从起初就有的命令，就是我们彼此相爱。 6 这就是爱：就是要我们遵行他的命令。这就是命令，你们从起初所听见的，就是要你们照着去行。

          7 因为世上有许多欺骗者已经出来，他们不承认耶稣基督是道成了肉身而来的；这样的人就是欺骗者，也是敌基督的。 8 你们要谨慎，免得我们失去所作的工，反而要得着完全的赏赐。 9 凡越过基督的教导，不常守着的，就没有神；凡常守着这教导的，就有父又有子。 10 若有人到你们那里，不传这教导，不要接待他到家里，也不要向他问安。 11 因为向他问安的，就是在他的恶行上有份了。

          12 我还有许多事要写给你们，但我不想用纸墨来写，反而盼望能到你们那里，亲口与你们谈论，好使我们的喜乐得以满足。 13 你那蒙拣选的姊妹的儿女向你问安。阿门。'
    - type: paragraph
      text:
        ru: '2:1'
        cn: '2:1'
    - type: paragraph
      text:
        ru: 'Нема сумње, нико није тако савршено знао и тако савршено поседовао љубав Христову као апостол љубави – свети Богослов. Она је из њега засењујуће зрачила, као светлост из сунца. Ученик »кога Исус љубљаше« знао је тајну божанске љубави савршеније него ико од људи, ваљда најсавршеније после Бога љубави – чудесног Господа Христа. Зато је његово Еванђеље првенствено Еванђеље љубави. И са њим – истине, вечне божанске Истине, онако чаробно оличене у Сладчајшем. Љубав и Истина су једносушне; оне се међусобно проничу, прожимају до у све бескрајности и бесконачности. За њих се може рећи: Љубав живи Истином; Истина живи Љубављу. Ако Љубав има језик, онда је то Истина; и обратно: ако Истина има језик, онда је то Љубав. Истину има ко Љубави има.'
        cn: 毫无疑问，没有人像那位爱的使徒——圣约翰神学家那样完美地认识和完美地拥有基督的爱。这份爱从他身上耀眼地放射出来，犹如阳光。这位「耶稣所爱的」门徒比世上任何人都更完美地认识神圣之爱的奥秘，或许仅次于爱的上帝——奇妙的主基督，是最完美的。因此，他的福音首先是爱的福音。与之俱来的还有真理，永恒的神圣真理，那般奇妙地体现在至甘甜者（耶稣）身上。爱与真理是同本体的；它们彼此穿透，相互渗透直至所有的无边无际和无限。对于它们，可以说：爱借真理而活；真理借爱而活。如果爱有语言，那么那便是真理；反之亦然：如果真理有语言，那么那便是爱。凡拥有爱的人，便拥有真理。
    - type: paragraph
      text:
        ru: '2:2'
        cn: '2:2'
    - type: paragraph
      text:
        ru: 'Истина не може живети у души у којој Љубав не обитава, јер је Љубав – живот Истине, ваздух Истине, срце Истине. Колико Истине има у човеку показује његова Љубав. Где нема Истине, нема ни Љубави. Пример: ђаво. Он је изван Истане, јер је изван Љубави. Он »не остаде у Истини« (Ин.8:44), већ отпаде од Истине и испаде из Истине, зато је »лажа, и отац лажи", и "кад говори лаж, своје говори« (Ин.8:44). Зато је ђаво оличење мржње према Истини. Лаж и мржња су једносушни, као што су Истина и Љубав. За прво: пример – ђаво и његови следбеници; за друто: пример – Господ Христос и његови следбеници. Господ Христос је у исто време и савршена Истина и савршена Љубав; оне су у Њему неодвојиве као зеница од ока. Без Истине Љубав би била без вида, потонула би у мрак и ослепила; без Љубави Истина би се спарушила и занавек умрла.'
        cn: 真理不能存活于一个没有爱居住的灵魂中，因为爱是真理的生命、真理的气息、真理的核心。一个人拥有多少真理，由他的爱来显明。没有真理的地方，也没有爱。例证：魔鬼。它在真理之外，因为它在爱之外。它「不守真理」（约翰福音 8:44），反而是从真理中堕落并脱离了真理，因此它是「说谎者，也是谎言之父」，「它说谎是出于自己」（约翰福音 8:44）。因此，魔鬼是对真理的仇恨的化身。谎言与仇恨本质相同，正如真理与爱一样。对于前者：例证是魔鬼及其跟随者；对于后者：例证是主基督及其跟随者。主基督同时是完美的真理和完美的爱；在祂里面，二者如瞳孔与眼睛般不可分离。没有真理，爱将失去视力，沉入黑暗并失明；没有爱，真理将枯萎并永远死亡。
    - type: paragraph
      text:
        ru: '2:3'
        cn: '2:3'
    - type: paragraph
      text:
        ru: Истина и Љубав су свети и несломљиви сасуди благодати Божје, и милости Божје, и мира Божјег. Душа која њих има, брзо се испуњује благодаћу, милошћу и миром Божјим. Јер се ово троје даје за Љубав и Истину које су у човеку. И то даје од саме Пресвете Тројице.
        cn: 真理和爱是神圣的、坚不可摧的器皿，盛载着上帝的恩典、上帝的怜悯和上帝的平安。拥有它们的灵魂，迅速被上帝的恩典、怜悯和平安充满。因为这三者是因着人里面所存的爱和真理而被赐予的。而这由至圣三位一体亲自赐予。
    - type: paragraph
      text:
        ru: '2:4'
        cn: '2:4'
    - type: paragraph
      text:
        ru: 'Шта значи бити хришћанин? – Ходити у Истини, бити сав у Истини и од Истине. То осигурава човеку бесмртност и живот вечни, јер га спасава од греха, од те основне и главе лажи, свелажи. Грех у свима својим безбројним облицима само једно ради: лаже човека да му може дати живот а сурвава га у смрт, да му може дати рај а одводи га у пакао, да га може учинити богом а претвара га у ђавола. Који то грех није лаж, и којим то грехом човек не лаже себе? Ето гордости. Зар гардошћу не лаже човек себе, јер сматра себе великим, а уствари је прах и пепео? Ето славољубље. Зар славољубљем не лаже човек себе, јер сматра себе славним, а уствари је буњиште, пуно црва и смрада? Ето властољубље. Зар човек не лаже себе властољубљем, јер сматра да је силан и моћан, а уствари је бедни роб смрти и гроба? Ето сластољубље. Зар човек не лаже себе сластољубљем, јер сматра да ће му дати рајска уживања, а уствари свака се сласт завршава горчином? Тако, грех до греха – лаж до лажи, и све се оне сливају у једну бескрајну лаж, која увек одводи човека »оцу лажи«, том човекоубици »од почетка« (Ин.8:44). Зато основна заповест Тројичног Божанства јесте: ходити у истини. Јер само они »који ходе у истини« Христови су, и лаж нема власти над њима.'
        cn: 成为基督徒意味着什么？——行在真理中，完全浸润于真理之中，并由真理所构成。这确保了人的不朽和永恒的生命，因为它将他从罪中，从那根本的、主要的谎言，那一切谎言的总和中拯救出来。罪以其无数的形式只做一件事：它欺骗人说能给他生命，却将他推入死亡；它欺骗人说能给他天堂，却将他引向地狱；它欺骗人说能使他成为神，却将他变为魔鬼。哪一种罪不是谎言呢？人又何尝不因哪种罪而欺骗自己呢？比如骄傲。人难道不是因骄傲而欺骗自己吗？因为他自以为伟大，而实际上却是尘土和灰烬？比如好名。人难道不是因好名而欺骗自己吗？因为他自以为荣耀，而实际上却是粪堆，满是蛆虫和臭气？比如权欲。人难道不是因权欲而欺骗自己吗？因为他自以为强大而有权势，而实际上却是死亡和坟墓的悲惨奴仆？比如贪图享乐。人难道不是因贪图享乐而欺骗自己吗？因为他自以为会得到天堂般的享受，而实际上每一种享乐都以苦涩告终？如此，罪连着罪——谎言连着谎言，它们都汇聚成一个无尽的谎言，总是把人引向「谎言之父」，那「从起初就是杀人犯」的（约翰福音 8:44）。因此，三一上帝的基本诫命是：行在真理中。因为只有「行在真理中的人」才属于基督，谎言对他们没有权柄。
    - type: paragraph
      text:
        ru: '2:5'
        cn: '2:5'
    - type: paragraph
      text:
        ru: Они "који ходе у истини» доказују то међусобном љубављу. Истина која је у једноме потстиче га на Љубав према Истини која је у другима. А то је једна и иста божанска Истина, која све «који ходе у истини» сједињује у једну целину, у јеедно биће, у једно тело – Цркву, каја је стога «стуб и тврђава Истине» (1Тим.3:15). Тако се заповест о хођењу у истини и заповести о љубави међусобној стапају у једну заповест, због важности своје увек нову и увек стару.
        cn: 那些「行走在真理中」的人，借着彼此的爱来证明这一点。在一个人里面的真理，促使他去爱在其他人里面的真理。而这正是同一个神圣的真理，它将所有「行走在真理中」的人联合为一个整体，一个生命，一个身体——教会，教会因此是「真理的柱石和根基」（提摩太前书 3:15）。如此，关于行走在真理中的诫命和关于彼此相爱的诫命融合成一道诫命，因其重要性而永远新鲜又永远古老。
    - type: paragraph
      text:
        ru: '2:6'
        cn: '2:6'
    - type: paragraph
      text:
        ru: 'И ова је љубав да живимо по заповестима његовим – κατὰ τὰς ἐντολὰς αὐτοῦ (= да ходимо по …). Ова је заповест, као што чусте из почетка, да у њој живите – περιπατῆτε (= да у њој ходите)». – Божанска Истина се садржи и налази у заповестима Еванђеља. А божанска љубав нам даје воље, и силе, и истрајности «да живимо по заповестима" Божјим, "да ходимо» у њима и са њима. Наша љубав и према Господу Христу и према људима састоји се у живљењу по заповестима Христовим. Јер се све оне, на крају крајева, своде на двоједну заповест: заповест о љубави према Богу и ближњему. Зато свети Богослов све заповести своди на ову једну заповест: «Ова је заповест, … да у њој живите». Сад знамо да се цело Христово Еванђеље своди на једну заповест, заповест о љубави. Ко у њој живи, живи у Христу Богу. И тако испуњује Еванђеље Божје, које важи и за небо и за земљу.'
        cn: 「这便是爱，要我们活出他的诫命——κατὰ τὰς ἐντολὰς αὐτοῦ（即按照……而行）。这诫命，正如你们从起初所听见的，就是要你们活在其中——περιπατῆτε（即在其中而行）。」——神圣真理包含并存乎于福音的诫命之中。而神圣之爱赐予我们意志、力量和坚忍，去「活出」上帝的诫命，并在其中、与诫命同行。我们对主基督的爱，以及对人的爱，在于活出基督的诫命。因为归根结底，它们都归结为二合一的诫命：爱上帝和爱邻人的诫命。因此，圣神学家将所有诫命归结为这唯一诫命：「这诫命……就是要你们活在其中。」现在我们知道，基督的整个福音都归结为一条诫命，即爱的诫命。凡活在其中之人，便活在基督上帝里。如此便成全了上帝的福音，这福音对天对地都有效力。
    - type: paragraph
      text:
        ru: 2:7–8
        cn: 2:7–8
    - type: paragraph
      text:
        ru: 'Треба утврдити себе у Истини Христовој живећи по заповестима његовим. На тај начин ћемо сачувати себе од обмане која пустоши свет и убија душе људске и савести људске. Та је обмана у овоме: Исус Христос није Богочовек, није оваплоћени Бог Логос, није Бог и Спаситељ. У овој обмани је сав антихрист. А сва је истина у супротноме: Исус Христос је оваплоћени Бог Логос, Богочовек, Господ и Спаситељ. На безброј начина антихрист ради, да би својим учењем о Христу саблазнио што више људи. Хришћани се бране од тога, чувају од тога живећи по заповестима Христовим, живећи у Љубави његовој и у Истини његовој. За њих је Господ Христос – све богатство њихово, живот њихов, вечност њихова, рај њихов. То они зарађују својим еванђелским подвизима. И још на земљи осећају чудесну радост од тога, предосећају оно неисказано блаженство које ће они у потпуности уживати у ономе свету вечито и неизменљиво. Имајући то у виду, свети Воанергес саветује хришћане да се чувају од антихристовске обмане: «Јер многе варалице изиђоше на свет који не признају да је Исус Христос дошао у телу; ово је варалица и антихрист. Чувајте се да не изгубимо што смо зарадили – ἃ εἰργασάμεθα -, него да примимо потпуну награду – μισθὸν πλήρη".'
        cn: 人必须通过遵守基督的诫命，在祂的真理中确立自己。如此，我们便能保守自己，免受那荒芜世界、杀害人类灵魂和良心的迷惑。这种迷惑在于：耶稣基督不是神人，不是道成肉身的神圣言，不是神和救主。一切敌基督都存在于这迷惑之中。而一切真理则在于其反面：耶稣基督是道成肉身的神圣言，是神人，是主和救主。敌基督以无数种方式运作，企图以其关于基督的教导，诱惑更多的人。基督徒藉着活在祂的爱与真理中，并遵行祂的诫命，来抵御并保守自己免受其害。对他们来说，主基督是他们的一切财富、他们的生命、他们的永恒、他们的天堂。他们藉着福音的属灵操练获得这些。他们甚至在地上就能感受到由此而来的奇妙喜乐，预尝着那无法言喻的福乐，这福乐是他们将在那个世界中永恒不变地完全享受的。鉴于此，圣波阿涅革斯建议基督徒提防敌基督的迷惑：「因为世上有许多迷惑人的出来，他们不认耶稣基督是成了肉身来的；这就是那迷惑人的，也是那敌基督的。你们要小心，不要失去你们所做的工，乃要得着满足的赏赐。」（约翰二书 1:7-8）
    - type: paragraph
      text:
        ru: '2:9'
        cn: '2:9'
    - type: paragraph
      text:
        ru: '"Који год преступа и не стоји у науци Христовој – μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ, нема Бога – Θεὸν οὐκ ἔχει -; који стоји – ὁ μένων – у науци Христовој, онај има и Оца и Сина". "Нема Бога» онај који не живи по науци Христовој; «нема Бога» онај који не стоји у Истини Христовој; «нема Бога» онај који умом и разумом не стоји у Господу Христу. Сматра ли пак неко да, и не признавајући Христа за Бога, верује у Бога, има Бога, тај себе вара, јер је неког лажног бога, неког небога прогласио за Бога. И тако је он уствари идолопоклоник, незнабожац, безбожац. Ко Христову науку прима и стоји у њој срцем и умом, тај васцелог истинитог Бога има: Оца и Сина и Светога Духа. Стога је само хришћанин прави богопоклоник, богозналац, богоималац.'
        cn: 凡是越轨且不住在基督的教训中的人——μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ，就没有上帝——Θεὸν οὐκ ἔχει -；凡是住在——ὁ μένων——基督的教训中的人，就既有父，又有子。「没有上帝」的人，是那个不按照基督的教训生活的人；「没有上帝」的人，是那个不住在基督真理中的人；「没有上帝」的人，是那个在心思和理性上不住在主基督里的人。若是有人认为，即使不承认基督是上帝，就相信上帝，拥有上帝，那他就是在欺骗自己，因为他将某个虚假的「神」，某个非神之物宣称为上帝。这样，他实际上就是偶像崇拜者、异教徒、无神论者。凡是领受基督的教训，并以心和灵住在其中之人，那人就拥有整全的、真实的上帝：父、子和圣灵。因此，唯有基督徒才是真正的敬拜上帝者、认识上帝者、拥有上帝者。
    - type: paragraph
      text:
        ru: 2:10–13
        cn: 2:10–13
    - type: paragraph
      text:
        ru: '"Ако ко долази к вама и ове науке не доноси, не примајте га у кућу, и не питајте се с њим. Јер ко се пита с њим, прима удела у његовим злим делима – κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς (= суделује у његовим злим делима)«. – Обратити сву пажњу на ове речи, јер их говори апостол Љубави. Али он их баш зато и говори што је у исто време и апостол Истине. А Љубав стоји и постоји Истином; без Истине она пада и пропада. У љубави према Истини је и сва ревност његова за Истину. А Љубав према Истини и ревност за Истину су до савршенства оличене у светом Воанергесу. Он је у исто време највећи Громовник новозаветне Истине и највећи Громовник новазаветне Љубави. У своме христољубљу он је потпуно сјединно савршену божанску Љубав и савршену божаннску Истину, зато га је свезнајући Господ још унапред назвао Воанергесом. А то своје ново име, коме је кумовао сам свезнајући Господ, свети Син Грома је потпуно оправдао. Од сусрета са њим, тако необичним Апостолом, морала се по душама људским рађати и у све бескрајности разливати нека изузетна радост и изузетно усхићење.'
        cn: '"凡到你们这里来，不传此教训的，不要接他到家中，也不要与他问安。因为凡与他问安的，就在他的恶行上有份——κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς（意即：分担他的恶行）。" – 请务必留意这些话语，因为这些话语出自爱之使徒之口。但他之所以说这些话，是因为他同时也是真理的使徒。爱藉真理而立而存；没有真理，爱便倾覆消逝。他对真理的一切热忱，都源于他对真理的爱。他对真理的爱和对真理的热忱，在圣沃阿涅格斯身上得到了完美的体现。他同时是新约真理最伟大的雷子，也是新约之爱最伟大的雷子。在他的爱基督之心（христољубљу）中，他全然结合了完美的属神之爱与完美的属神真理，因此全知的上主早已预先称他为沃阿涅格斯。这个由全知的上主亲自赐予的新名，这位圣雷子已完全地实证了其名。与他这位如此非凡的使徒相遇时，在人的灵魂中必然会诞生某种非凡的喜乐和非凡的狂喜，并无止境地扩散开来。'
    - type: paragraph
      text:
        ru: Спасовдан
        cn: 升天节
