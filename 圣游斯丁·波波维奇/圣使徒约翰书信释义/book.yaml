    - type: paragraph
      text:
        ru: '1Ин.2:1–17:1Дјечице моја, ово вам пишем да не сагријешите; и ако неко сагријеши, имамо Заступника код Оца, Исуса Христа Праведника. 2 А он је жртва помирења за гријехе наше, и не само за наше него и свега свијета. 3 И по томе знамо да смо га познали, ако заповијести његове држимо. 4 Онај који говори: Познао сам га, а заповијести његове не држи, лажа је, и у њему истине нема; 5 А који држи ријеч његову, заиста је у њему љубав Божија достигла савршенство; по томе знамо да у њему јесмо. 6 Онај који говори да у њему пребива, дужан је да као што Он поживје и сам тако живи. 7 Браћо, не пишем вам заповијест нову, него заповијест стару коју имасте од почетка. Заповијест стара јесте ријеч коју чусте од почетка. 8 Опет вам пишем заповијест нову, оно што је истинито у њему и у вама: да тама пролази и свјетлост истинита већ сија. 9 Онај који говори да је у свјетлости, а мрзи брата својега, у тами је све до сада. 10 Онај који љуби брата својега, у свјетлости пребива, и саблазни у њему нема; 11 А који мрзи брата својега, у тами је, и у тами ходи, и не зна куда иде, јер му тама заслијепи очи. 12 Пишем вам, дјечице, да су вам опроштени гријеси ради Имена његова. 13 Пишем вам, оци, јер сте познали Онога који је од почетка. Пишем вам, младићи, јер сте побиједили нечастивога. Писах вам, дјецо, јер сте познали Оца. 14 Писах вам, оци, јер сте познали Онога који је од почетка. Писах вам, младићи, јер сте јаки и ријеч Божија у вама пребива и побиједили сте нечастивога. 15 Не љубите свијета ни што је у свијету. Ако неко љуби свијет, љубави Очеве нема у њему; 16 Јер све што је у свијету: похота тјелесна, и похота очију, и надменост живљења, није од Оца, него је од свијета. 17 И свијет пролази и похота његова; а онај који твори вољу Божију остаје вавијек.'
        cn: 约翰一书 2:1-171 我的孩子们，我将这些写给你们，使你们不犯罪。若有人犯罪，我们有一位在父那里的中保，就是耶稣基督，那义者。2 祂就是为我们的罪作了挽回祭，不只为我们的罪，也为普世人的罪。3 我们因此知道我们已认识祂，如果我们遵守祂的诫命。4 那说「我认识祂」，却不遵守祂诫命的，就是说谎的，真理就不在他里面。5 凡遵守祂话语的，上帝的爱在他里面确实达到了完全。我们因此知道我们是在祂里面。6 那说他住在祂里面的，就当祂怎样行事为人，他自己也当怎样行事为人。7 弟兄们，我写给你们的不是一条新诫命，而是一条旧诫命，就是你们从起初就有的。这旧诫命就是你们从起初所听见的话。8 我再写给你们一条新诫命，这真理在祂里面也在你们里面，因为黑暗正在消逝，真光已经照耀。9 那说他自己在光明中，却恨他的弟兄的，他到现在仍在黑暗里。10 爱他弟兄的，住在光明中，在他里面就没有绊脚石。11 恨他弟兄的，是在黑暗里，也在黑暗里行，也不知道往哪里去，因为黑暗弄瞎了他的眼睛。12 孩子们，我写给你们，你们的罪因祂的名得了赦免。13 父老们，我写给你们，因为你们认识了那位从起初就有的。青年们，我写给你们，因为你们胜过了那恶者。孩子们，我曾写给你们，因为你们认识了父。14 父老们，我曾写给你们，因为你们认识了那位从起初就有的。青年们，我曾写给你们，因为你们刚强，上帝的道住在你们里面，并且你们胜过了那恶者。15 不要爱世界，也不要爱世界上的事。若有人爱世界，爱父的心就不在他里面。16 因为凡世界上的事，就是肉体的情欲，眼睛的贪恋，并今生的骄傲，都不是从父来的，而是从世界来的。17 这世界和其上的情欲正在消逝；惟独遵行上帝旨意的，却永远长存。
    - type: paragraph
      text:
        ru: 2:1–2
        cn: 2:1–2
    - type: paragraph
      text:
        ru: 'Што јаче осећање и сазнање греха у човеку, то јача чежња за Спаситељем од греха. И Он – «веран и праведан» – долази и «очишћава нас од свакога греха», и даје нам божанске силе за живљење у светом и праведном животу. Христов човек плаши се греха као живе ватре. Јер је грех заиста огањ који спаљује у човеку оно што је добро и богочежњиво. Главно је: не дати у души својој места грехољубљу. Онда ће човек и моћи избегавати веће грехове. А наилазиће на њега, и он ће каткад и падати у оне који се чине несвесно, новољно. Падне ли и у већи грех, христољубив човек ће покајнички прибећи човекољубивом Спаситељу, који је увек готов да нас очисти од греха, да нам опрости грех, и да посредује за нас код Бога Оца. Главно је: носити и гајити у души христољубље. А човекољубиви Господ зна слабости људске природе, стога и опрашта грехове ономе који признаје, који иоповеда своје грехе, тј. који се каје за њих. Покајање и јесте мржња на грехе, борба са гресима до њиховог потпуног уништења благодатном помоћу човекољубивог Спаситеља. Богослов пише: «Дечице моја, ово вам пишем, да не грешите, и ако ко сагреши, имамо заступника – Παράκλητον – код Оца, Исуса Христа праведника. И Он је умилостивљење за грехе наше – ἱλασμός ἐστι[5]περὶ τῶν ἁμαρτιῶν ἡμῶν, и не само наше него и свега света». Господ Христос је умилостивљење Оца за грехе наше: јер молећи се Оцу за нас грешне телоносце, Он указује на савоје ране ради нас, на своје тело, људско тело, које је било на земљи безгрешно, и занавек такво и остало. Он је умилостивљење Оца и за грехе целога света: јер је ради нас свих, и место нас свих, и у име нас свих поднео безбгројна страдања од колевке па све до крсне смрти, те свежртве; и то поднео из бескрајног човекољубља. Да није тог Спаситељевог умилостивљења за грехе света, свет би досада по правди Божјој требало да буде много пута уништен због грехова својих.'
        cn: 人对罪的感觉和认识越强烈，对摆脱罪恶的救主的渴望就越强烈。祂——「信实而公义的」——来到，并「洁净我们脱离一切的罪」，赐给我们神圣的力量，使我们活出圣洁公义的生活。属基督的人畏惧罪恶，如同畏惧活火。因为罪恶确实是烈火，它焚烧掉人里面所有良善和渴慕神的心。最重要的是：不要在自己的灵魂中给爱罪之心留地步。这样人才能避免更大的罪恶。然而，罪恶仍会临到他，他有时也会无意识地、非自愿地陷入罪中。即便堕入更大的罪中，爱基督的人也会悔改地投奔慈爱世人的救主，祂总是预备好洁净我们的罪，赦免我们的罪，并为我们在父神面前代求。最重要的是：在灵魂中怀抱并培养爱基督之心。慈爱世人的主深知人性的软弱，因此祂也赦免那些承认并认自己的罪之人，即为罪悔改之人。悔改正是对罪恶的憎恨，是与罪恶的争战，直至借着慈爱世人的救主恩典的帮助，将罪恶彻底毁灭。神学家写道：「我亲爱的孩子们，我把这些写给你们，是要你们不犯罪。若有人犯罪，我们有一位中保——Παράκλητον——在父那里，就是那义者耶稣基督。祂为我们的罪作了挽回祭——ἱλασμός ἐστι[5]περὶ τῶν ἁμαρτιῶν ἡμῶν，不单是为我们的罪，也是为普世人的罪。」主基督是父神为我们的罪所做的挽回祭：因为祂为我们这些有罪的肉身者向父神祷告时，祂为我们的缘故，指出祂自己的伤痕，指出祂的身体，那在世上曾是无罪的、且永远保持无罪的属人的身体。祂也是父神为全世界的罪所做的挽回祭：因为祂为了我们所有人，代替我们所有人，并以我们所有人的名义，从降生到十字架上的死，忍受了无数的苦难，那全备的牺牲；祂忍受这一切，是出于无尽的爱世之心。若非救主为世人的罪做了那挽回祭，按照神的公义，世界至今本应因自己的罪恶被多次毁灭。
    - type: paragraph
      text:
        ru: '2:3'
        cn: '2:3'
    - type: paragraph
      text:
        ru: '"И по томе знамо да га познасмо – ἐγνώκαμεν, ако заповести његове држимо«. Мерило нашег христознања је просто и једноставно, мерило и провера: држање заповести Христових. Држи ли човек заповести његове, значи: познао је у Њему Бога и Спаситеља. Човеково познање Христа развија се творењем заповести Христових. Свака испуњена заповест повећава човеково знање о Христу. Најбоље Христа зна, ко највише заповести Његове испуњава. А најсавршеније Га зна, ко заповести најсавршеније испуњава. То су Светитељи. Христа не зна ко не држи заповести Његове. Пут је по свачему строго експерименталан, прагматичан, опитан. У то се сваки може уверити само личним опитом.'
        cn: 我们因此知道我们认识他——ἐγνώκαμεν，如果我们遵守他的诫命。我们对基督的认知准则简单又直接，这准则和检验就是：遵守基督的诫命。如果一个人遵守祂的诫命，这意味着：他已在祂里面认识了上帝和救主。人对基督的认知借着实践基督的诫命而发展。每条被实现的诫命都增进人对基督的认识。最能认识基督的，是那些遵行祂最多诫命的人。而最完美地认识祂的，是那些最完美地遵行诫命的人。他们就是圣徒。不遵守祂诫命的人，就不认识基督。这条道路在各方面都是严格的实验性、实用性、经验性的。对此，每个人都只能通过亲身经历来确信。
    - type: paragraph
      text:
        ru: '2:4'
        cn: '2:4'
    - type: paragraph
      text:
        ru: 'Без држања заповести Христових, Христос се не може истински познати. Ко тврди да може, неистину тврди, »лажа је«. Зато што се држањем заповести Христових долази до познања Христа, њега подједнако лако може познати и учењак и простак, и школован и нешколован, и писмен и неписмен, и богат и сиромах, и цар и говедар. Јер је за творење заповести Христових потребна: љубав према Христу. Свети Богослов благовести: »Који говори: познајем га, а заповести његове не држи, лажа је – ψεύστης ἐστί – и у њему нема истине». Истина о Христу расте у човеку држањем заповести Христових. Зато истину о Христу знају само «творци речи», а не «слушачи" (Иак.1:22).'
        cn: 若不遵守基督的诫命，就无法真正认识基督。凡声称能者，所声称的乃是虚假，「他是说谎的」。因为借由遵守基督的诫命才能达致对基督的认识，故无论是学者或平民、受过教育或未受教育、识字或不识字、富裕或贫穷、君王或牧牛人，都能同样轻易地认识祂。因为遵行基督的诫命所需要的，是对基督的爱。圣神学家宣告说：「人若说：我认识他，却不遵守他的诫命，便是说谎的——ψεύστης ἐστί——真理也就不在他心里了。」关于基督的真理，借由遵守基督的诫命而在人心中成长。因此，只有「行道者」而非「听道者」才能认识关于基督的真理（雅各书 1:22）。
    - type: paragraph
      text:
        ru: '2:5'
        cn: '2:5'
    - type: paragraph
      text:
        ru: 'Љубав према Христу је она сила која подстиче, одушевљава и даје моћи човеку да држи заповести његове (Ин.14:21). Христопознање је плод христољубља. А христољубље се изражава у држању заповести Христових, Еванђеља његовог. Јер, Еванђеље од почетка до краја и сачињава све заповести његове. Еванђелски практичар, еванђелски прагматичар зна Христа и истину о Христу, јер љуби Христа. Ко хоће да провери, и измери себе, своје знање о Христу, нека погледа на своја еванђелска дела; а ко хоће да провери колико воли Христа, нека опет погледа на дела своја еванђелска. Она ће му тачно казати и колика је љубав његова према Христу и колико је знање његово о Христу. Зато свети Богослов благовести: »А који држи реч његову, у њему је заиста љубав Божја савршена – τετελείωται; по томе познајемо да смо у њему«. – Сва из љубави, еванђелска дела јој се на тај начни достојно одужују што се она кроз њих усавршава и достиже своје савршенство. А савршена је љубав – када? Када сву душу човекову кроз еванђелски живот унесе у Христа, и она свим бићем живи у Њему и ради Њега. Савршена љубав држи све заповести Христове: »По томе познајемо да смо у Њему«. Нема ли тога у нама – нисмо у Њему, већ у себи или у супротном Њему.'
        cn: 爱基督是那激励、鼓舞并赋予人能力去遵守他的诫命的力量（约翰福音 14:21）。认识基督是爱基督的果实。而爱基督则体现在遵守基督的诫命，即他的福音。因为福音从始至终构成了他所有的诫命。福音的实践者，福音的实干家，认识基督和关于基督的真理，因为他爱基督。凡想检验并衡量自己对基督的认识的人，就让他看看自己的福音行动；而凡想检验自己爱基督有多少的人，就让他再看看自己的福音行动。这些行动会准确地告诉他，他的爱基督有多少，以及他对基督的认识有多少。因此，圣神学家宣报：「凡遵守他话语的，在他里面，神的爱确实是完全的 – τετελείωται；我们就因此知道我们是在他里面。」所有出于爱的福音行动，都以此方式当之无愧地回报这份爱，即爱藉着它们得以完善并臻于完美。而完全的爱——是何时呢？当它藉着福音生活将人的整个灵魂带入基督，并且那灵魂以其全部存在活在祂里面并为祂而活之时。完全的爱遵守基督的所有诫命：「我们就因此知道我们是在他里面。」如果我们里面没有这些——我们就不在他里面，而是在我们自己里面，或在与他对立的事物里面。
    - type: paragraph
      text:
        ru: '2:6'
        cn: '2:6'
    - type: paragraph
      text:
        ru: '"Који говори да у Њему обитава – αὐτῷ μένειν – и тај треба тако да ходи – οὕτω περιπατεῖν – као што је Он ходио – περιεπάτησε». Божански јасно речено. Заиста, свака реч по гром истине божанске. Сад савршано знамо шта је хришћанин: хришћанин је који ходи као што је Христос ходио. Друкчије се не може ни постати ни остати хришћанин. Рашчлањена та истина, гласила би: хришћанин је ко живи као што је Христос живео; ко воли као што је Он волео; ко истинује као што је Он истиновао; ко је праведан, и свет, и кротак, и смирен, и милостив, и благ, и дуготрпељив, и богољубив, и човекољубив, и жалостив, и добар као – Он. Јер је Он све то био, и све то остао, да бисмо и ми то постали. Јер Он није дошао у наш свет само да нам покаже своја божанска савршенства, па да их онда сва повуче у онај свет, а нас остави задивљене и – разочаране. Него их је показао, и заувек на земљи оставио, да би она постала наша, те да бисмо помоћу њих ходили као што је Он ходио, живели као што је Он живео.'
        cn: 凡是说自己住在他里面的——αὐτῷ μένειν——那人也应该这样行事为人——οὕτω περιπατεῖν——像他所行的一样——περιεπάτησε»。神性地清楚说明。确实，每一句话都像神圣真理的雷霆。现在我们完美地知道基督徒是什么：基督徒就是像基督所行事为人的人。否则，人既不能成为基督徒，也不能保持基督徒。如果将这真理分解，它将是：基督徒是像基督所生活的人；像他所爱的人；像他所秉持真理的人；像他一样公义、圣洁、温柔、谦卑、仁慈、良善、恒久忍耐、爱神、爱人、慈悲和美好的人。因为他就是这一切，并且一直保持这一切，为了让我们也能成为这一切。因为他来到我们的世界，不仅仅是为了向我们展示他神性的完满，然后将它们全部带回另一个世界，而留下我们惊叹却又——失望。相反，他展示了它们，并永远留在了地上，以便它们成为我们的，从而我们能够借助它们，像他所行事为人一样行事为人，像他所生活一样生活。
    - type: paragraph
      text:
        ru: '2:7'
        cn: '2:7'
    - type: paragraph
      text:
        ru: 'Заповест, или боље, свезаповест за хришћане јесте «реч» Христова – Еванђеље Христово. Како је пошла од Христа, та реч непрестано тече, не прекида се, не престаје. Јер је она у исто време и божанска сила, благодатна и бесмртна и вечна. Шта је Еванђеље? Заповест Христова, која сама даје човеку силе да је остварује. То није реч књишка, сува, параграфска, већ реч – жива сила, која је «од почетка» иста, и трајући непрестано као иста, постала је живо предање, које се каналима живе вере предаје с једног на другог, из века у век, тако – до краја векова. Зато је то «стара заповест". И још је "стара» зато што је остала онаква каву ју је Христос дао, нико ништа јој није додао ни одузео. Она се прелива као жива стваралачка сила, божанска сила, из једног поколења вере у друго, и тако док траје рода људског. Божанском Истином својом, Божанском Правдом својом, Божанском Мудрошћу својом, Божанском Силом својом Еванђеље је старо као и Бог, а на земљи – као и Богочовек. Зато је та стара Истина увек и нова, и та стара Правда увак и нова, те и Богочовеков завет чини Новим Заветом, вечито новим, у коме никада не старе вечне божанске силе, које спасавају свет од греха, смрти и ђавола. Чувати «реч» Христову онаквом какву ју је дао сам Господ Христос, то је прва и највећа дужност најпре светих Апостола а затим и свих хришћана. Сви су они имаоци, чувари и проповедници једног истог Еванђеља, једне исте «старе заповести». По томе се и распознају. Свети Боогослов благавести: «Љубљени, не пишем вам нову заповест, него заповест стару коју имасте од почетка – ἣν εἴχετε ἀπ’ ἀρχῆς. Заповест стара јесте реч коју чусте од почетка".'
        cn: 对于基督徒来说，诫命，或者说，更准确地讲，全备的诫命，就是基督的「话语」——基督的福音。因其源自基督，这话语便持续不断地流淌，从不中断，永不止息。因为它同时也是一股神圣的力量，充满恩典，不朽且永恒。福音是什么？它是基督的诫命，它本身就赋予人实践它的力量。它不是一本枯燥无味的、如同章条款例的文字，而是一句话语——一股活生生的力量，它「从起初」就是一样的，并且始终如一地持续存在，已成为活生生的圣传，它通过活泼信心的渠道代代相传，从一个世纪到另一个世纪，如此直到万世之末。因此，这是「古老的诫命」。它之所以「古老」还因为她始终保持基督所赐予的原貌，没有任何人给它增添或减少什么。它作为一股活生生的创造力，一股神圣的力量，从一个信心的世代流向另一个，如此直到人类世代的终结。凭借其神圣的真理、神圣的公义、神圣的智慧和神圣的能力，福音与上帝一样古老，在地上则与神人（道成肉身者）一样古老。因此，这古老的真理总是新颖的，而这古老的公义也总是新颖的，因此神人的约构成了新约，永远是新的，在其中，永恒的神圣力量永不衰老，这些力量将世界从罪恶、死亡和魔鬼中拯救出来。保守基督的「话语」，使其正如主基督亲自所赐予的那样，这是首要且最大的职责，首先是圣使徒们的，然后是所有基督徒的。他们都是同一福音，同一「古老诫命」的持有者、守护者和宣讲者。凭此即可辨认出他们。圣神学家宣告说：「亲爱的弟兄们，我写给你们的，不是一条新诫命，而是你们从起初就有的旧诫命——ἣν εἴχετε ἀπ』 ἀρχῆς。这旧诫命就是你们从起初所听见的话语。」
    - type: paragraph
      text:
        ru: '2:8'
        cn: '2:8'
    - type: paragraph
      text:
        ru: 'Али по сили божанској која ствара нови живот у људима, нове мисли, нова осећања, новог човека, та »стара заповест« је увек нова. Јер стално извире из Бога и навире у људе кроз свете врлине. Нема сумње: »Исус Христос јуче је и данас онај исти и вавек« (Евр.13:8): тј. исти Богочовек, Исус из Назарета, али су спасилачке силе његове увек исте, увек свеже, увек и старе и нове, јер су вечне. Вечно не стари; оно је увек ново и младо, зато животворно и стваралачко. Када човек нашега века вером усвоји Богочовека, кроз њега одмах заструје и разлију се божанске животворне силе, које човека обнављају потпуно: дају му мисли нове, осећања нова, живот нов; а то су мисли бесмртне, осећања бесмртна, живот бесмртни и вечни. И уколико човек помоћу светих тајни и светих врлина више усељује у себе божанске силе Христове, утолико оне више потискују грех и таму греха из њега, потискују их својом божанском светошћу и светлошћу. Тада човек доживљује и себе и свет око себе као нешто истински ново, божански ново, јер и себе и свет око себе гледа и види у логосној светлости: и доживљује их као логосну творевину. Свети Богослов благовести: «Опет вам пишем нову заповест, што је истинито у њему и у вама; јер тама пролази, и светлост истинска већ светли – τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.» «Истинита светлост» улази у човека вером у Богочовека, и васцелог човека рађа Богом (Ин.1:9–13), препорађа Богом помоћу божанских сила које су у светим врлинама: љубави, правди, молитви, посту, кротости, смерности. Кроз оваку од њих «светлост истинита» се разлива по целом бићу човековом и «светли», светли и самом њему и људима око њега.'
        cn: 但是，凭着那在人里面创造新生命、新的思想、新的情感、新的人的神圣力量，那「旧的诫命」却常是新的。因为它不断地从上帝涌出，并借着神圣的美德涌入人里面。毫无疑问：「耶稣基督，昨日、今日、一直到永远，是一样的」（希伯来书 13:8）：即同一位神人，拿撒勒的耶稣，但他救赎的力量始终如一，始终新鲜，始终既古老又新鲜，因为它们是永恒的。永恒之物不会老旧；它总是新的和年轻的，因此是赋予生命的和创造性的。当我们这个时代的人凭着信心领受神人时，借着他，神圣的赋予生命的力量便立即涌流并弥漫开来，彻底更新了人：赋予他新的思想、新的情感、新的生命；而这些是不朽的思想、不朽的情感、不朽而永恒的生命。并且，人越是借着神圣的圣事和神圣的美德越多地将基督的神圣力量内住于自身，那些力量就越多地将罪和罪的黑暗从他里面驱逐出去，凭着它们神圣的圣洁和光照将它们驱逐出去。那时，人就体验到自身和周围的世界是真实的新事物，是神圣的新事物，因为他以道（逻各斯）的光照来看待和理解自身和周围的世界：并将它们体验为道（逻各斯）的创造物。圣神学家宣报说：「我又写一条新诫命给你们，这事在他里面是真的，也在你们里面是真的；因为黑暗正在消逝，真光已经照耀了——τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει。」「真光」借着对神人的信心进入人里面，并使整个人由上帝而生（约翰福音 1:9-13），借着存在于神圣美德中的神圣力量，即爱、公义、祷告、禁食、温柔、谦卑，使人由上帝而重生。借着它们中的每一种，「真光」便弥漫于人的整个存在中，并「照耀」着，照耀着他自身，也照耀着他周围的人。
    - type: paragraph
      text:
        ru: 2:9–11
        cn: 2:9–11
    - type: paragraph
      text:
        ru: 'Шта је тама? – Грех, сваки грех. Већи грех је већа тама, мањи – мања. Када се човек налази у тами? – Када живи у греху. А када се човек налази у светлости? – Када живи Еванђељем Христовим, еванђелским; врлинама Христовим. Свака од њих је спроводник «истините светлости» из Христа у душу човекову. Што више врлина, то више спроводника «истините светлости». Еванђелска љубав према људима испуњује човека «истинитом светлошћу», и помоћу ње он осветљује бића људска, и открива у њима боголику браћу своју. Он види осветљене све путеве који душу људску везују са Богом. А пре свега види јасно пут који душу његову везује са Богом, води Богу. Он онда јасно зна божански циљ и смисао свога бића, и остварује их помоћу свог еванђелског живљења. Он зна куда људско биће иде: кроз овај свет путем еванђелских врлина – у онај, божански свет; из овог живота – у онај, божански живот, надсмртни и вечни. Не верује ли човек у Господа Христа, у ту једину «истиниту светлост», он не зна куда иде, не зна прави циљ и смисао свога живота на земљи, нити види нити зна прави животни циљ и смисао и осталих људи, јер нема «истините светлости», која једино осветљава сва људска бића до дна, до његовог божанског циља, тако и свет. На пример: мржња је тама; мрзи ли човек некога, он га уствари мрзи, јер га не види као божанско створење, не распознаје као боголико биће; није нашао пут у његову душу, јер нема «истините светлости» у себи која би му осветлила биће брата кога мрзи, и показала са његове вечне, бесмртне стране. У тој тами, у том незнању о човеку живе сви који своде човека на смртно биће, или на тело, или на животињског потомка, или на животињу. А то уствари и јесте права мржња према човеку: одрицати му небеско, божанско порекло, боголику душу, и сводити га на смрдљиву и црвљиву лешину. Свети Богослов пише: «Који говори да је у светлости, а мрзи на свога брата, још је у тами». Права, једина права и једина истинска љубав према човеку јесте: сматрати човека за боголико и вечно биће; видети у њему свога бесмртног и вечног брата, брата не само у овом него и у оном свету. Само таква љубав зна човека истински; само се таква љубав не саблажњава о човека. Свети Богослов благовести: «Који љуби брата свога, у светлости живи – ἐν τῷ φωτὶ μένει, и саблазни у њему нема». Љубав еванђелска и јесте најбоље и најсигурније средство за правилно познање човека. У човекољубљу је метод човекопознања. А у човекомржњи – узрок човеконезнања. Љубав отвара очи на све светове, те човек помоћу «истините светлости» види логосна језгра свих створења и твари, види и зна куда иде. А мржња заслепљује очи, те човек не види у човеку ни логосно биће, ни брата; тако ни у свету, у природи, не види Божју творевину, већ дело или случаја, или слепе силе, или неке неопходности. А све су то лажни богови, идоли: идеје = идоди, идеје = богови, тако су то уствари идолопоклоници, поклоници мртвим и лажним боговима. Они заиста у тами ходе, и не знају куда иду и сами, и овај чудни свет Божји. Еванђелист изјављује: «Који мрзи на свога брата, у тами је и у тами ходи, и не зна куда иде, јер му тама заслепи очи – ἡ σκοτία ἐτύφλωσε τοὺς ὀφθαλμοὺς αὐτοῦ.» Као што је љубав жива стваралачка сила божанска, тако је и мржња жива стваралачка сила демонска. Што важи за љубав, важи за све еванђелске врлине; али исто тако, што важи за мржњу, важи за све грехе. Као што свака врлина лучи светлост, тако сваки грех лучи таму. Стога врлине отварају очи човеку, а греси их заслепљују.'
        cn: 什么是黑暗？——是罪，是每一个罪。更大的罪是更大的黑暗，更小的罪是更小的黑暗。人何时处于黑暗之中？——当他活在罪中之时。而人何时处于光明之中？——当他活在基督的福音中，活在福音里；活在基督的德行中之时。它们每一项都是将基督的「真光」导入人灵魂的导管。德行越多，「真光」的导管就越多。福音中的爱人如己，使人充满「真光」，并借此光照人类个体，在他（她）们里面发现自己那肖乎神的弟兄姐妹。他看见所有照亮的道路，这些道路将人的灵魂与上帝连接起来。而首先，他清楚地看见那条将他的灵魂与上帝连接、通向上帝的道路。那时，他便清楚地知晓自身存在的属天目的和意义，并借由他那福音般的生活将其实现。他知晓人类个体将往何处去：借由福音中的德行，穿过今世——进入那属天的世界；从今生——进入那属天的、超越死亡且永恒的生命。如果一个人不信靠主基督，不信靠那唯一的「真光」，他就不知道自己将往何处去，不知道自己地上生命的真正目的和意义，也看不见、不知道其他人的真正生命目的和意义，因为他没有「真光」，而唯有这光才能彻底照亮所有人类个体，直到其属天的目的，也照亮世界。例如：仇恨是黑暗；如果一个人恨某人，他实际上是在恨他，因为他没有将他视为一个属天的受造物，没有认出他是一个肖乎神的个体；他没有找到进入其灵魂的道路，因为他自身没有「真光」来照亮他所恨的那个弟兄的本质，并显明他永恒、不朽的一面。所有将人贬低为必死的存在、或仅为肉身、或为动物后代、或为动物的人，都活在这种黑暗、这种对人的无知之中。而这实际上就是对人真正的仇恨：否认他属天、属神的源头，否认他肖乎神的灵魂，并将其贬低为一具恶臭且虫蛀的尸体。圣神学家写道：「那说自己在光明中，却恨他弟兄的，仍在黑暗里。」对人真正、唯一真正且唯一真诚的爱是：将人视为肖乎神且永恒的个体；在他（她）里面看到自己不朽且永恒的弟兄姐妹，不仅是在今世，也在来世的弟兄姐妹。唯有这样的爱才真正认识人；唯有这样的爱才不会因人而跌倒。圣神学家宣告：「爱弟兄的，住在光明中 – ἐν τῷ φωτὶ μένει，在他（她）里面就没有绊脚石。」福音中的爱是正确认识人的最好、最可靠的方法。在爱人如己中，蕴含着认识人的方法。而在恨人如敌中，则蕴含着不认识人的原因。爱能开启通往万有世界的眼睛，使人借由「真光」看见所有受造物和万物的道性内核，看见并知晓自己将往何处去。而仇恨则蒙蔽双眼，使人在人里面既看不见理性存在，也看不见弟兄；同样地，在世上、在自然界中，也看不见上帝的创造，而只看到偶然、盲目力量或某种必然性的产物。而所有这些都是虚假的上帝，偶像：观念 = 偶像，观念 = 上帝，因此他们实际上是偶像崇拜者，是崇拜死寂虚假上帝的人。他们确实在黑暗中行走，既不知道自己将往何处去，也不知道这个上帝奇妙的世界将往何处去。福音书作者宣称：「恨他弟兄的，是在黑暗里，且在黑暗里行，也不知道往哪里去，因为黑暗弄瞎了他的眼睛 – ἡ σκοτία ἐτύφλωσε τοὺς ὀφθαλμοὺς αὐτοῦ。」正如爱是一种活的、具创造性的属神力量，仇恨也是一种活的、具创造性的属魔力量。适用于爱的，也适用于所有福音中的德行；同样地，适用于仇恨的，也适用于所有的罪。正如每一种德行都散发光明，每一个罪也散发黑暗。因此，德行开启人的眼睛，而罪恶则蒙蔽它们。
