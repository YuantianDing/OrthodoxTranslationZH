    - type: paragraph
      text:
        ru: 'Шта разуме под »светом«, свети Богослов нам објашњава: »Јер све што је на свету (πᾶν τὸ ἐν τῷ κόσμῳ) – телесна жеља (ἡ ἐπιθυμία τῆς σαρκὸς), и жеља очију (ἡ ἐπιθυμία τῶν ὀφθαλμῶν), – и гордост живота (ἡ ἀλαζονεία τοῦ βίου), – није од Оца, него је од света«. Свет – ὁ κόσμος који свети Еванђелист мисли јесте грехољубље: жеља, похота тела; похота очију; гордост живота: главни греси, и главни органи греха. Својим грехољубљем тело је постало жариште греха, обиталиште греха, расадник греха. А очи? Ненаситне очи су увукле род људски у грех; и највише га оне и увлаче. Очи – то су најгладнији и најпрождрљивији шакали греха. Ако их човак не обузда целомудријем, и не обнови умилењем, укроти покајањем, разнежи сажаљењем, оне тако халапљиво гутају грехе, да они ипуне и опустоше сву душу његову. Тешко човеку све док очи своје даје греху »за оружје неправде« (Рим.6:13). Али је срећа његова што он може сва своја чула, па и очи, дати Богу »за оружје правде« (Рим.6:1З). Трећи грех, који синтезира све грехе света, јесте: »гордост живота«. То је први грех у свима световима: грех Сатане. И извор свих грехова. То је био, то и занавек остао. Могло би се рећи: гордост је свегрех. Сваки грех својим животним нервом излази из ње, и држи се њоме. »Гордост живота« – саткана је од безброј најразноврснијих гордости, великих и малих, малотрајних и дуготрајних. Да споменемо најглавније: гордост због славе (научничке, државничке, уопште положајне), гордост због лепоте, гордост због богатства, гордост због доброчинства, гордост због смерности (да! због смерности), гордост због милостивости, гордост због успеха … Која је то врлина, коју гордост не претвори у порок. Ено, гордост због молитве, претвара молитвеника у фарисеја, и испосника у – самоубицу. Тако, сваки грех је уствари грех гордошћу, јер је Сатана уствари Сатана гордошћу. Да није гордости, не би било греха ни у анђелском ни у човечанском свету. Све то »није од Оца«. Од Оца је – јединородни Син Божји. А Он је – оваплоћена и оличена смерност при свима својим божанским савршенствима. И у његовом Еванђељу почетна врлина, свеврлина је – смерност (ср.Мф.5:3). Да, смерност, као једини лек од гордости, и свих осталих грехова.'
        cn: 圣神学家向我们解释他所理解的「世界」：「因为凡世界上的事（πᾶν τὸ ἐν τῷ κόσμῳ）——肉体的私欲（ἡ ἐπιθυμία τῆς σαρκὸς），眼目的私欲（ἡ ἐπιθυμία τῶν ὀφθαλμῶν），并今生的骄傲（ἡ ἀλαζονεία τοῦ βίου）——都不是从父来的，乃是从世界来的。」圣福音书作者所说的世界（ὁ κόσμος），就是爱罪：肉体的情欲；眼目的情欲；今生的骄傲：这些是主要的罪，也是罪的主要器官。凭借其爱罪之心，身体已成为罪的温床，罪的居所，罪的滋生地。那么眼睛呢？贪婪的眼睛将人类引入罪中；并且最主要地，是它们引人犯罪。眼睛是罪最饥饿、最贪婪的豺狼。如果一个人不用贞洁来约束它们，不用柔和来更新它们，不用悔改来驯服它们，不用怜悯来使其温柔，它们就会如此贪婪地吞噬罪孽，以至于它们充满并使他的整个灵魂荒芜。只要人将自己的眼睛「作不义的器具献给罪」（罗马书 6:13），他就有祸了。但他的幸福在于他能将自己所有的感官，包括眼睛，献给上帝，「作义的器具」（罗马书 6:13）。第三种罪，即那综合了世上所有罪的，是：「今生的骄傲」。这是所有世界中的第一种罪：撒旦的罪。也是所有罪的根源。它曾经是这样，也永远是这样。可以说：骄傲是万罪之源。每一种罪都以其生命之「神经」源于它，并依附于它。「今生的骄傲」是由无数种各异的骄傲编织而成的，有大的，有小的，有短暂的，也有长久的。让我们提及最重要的几种：因荣耀（学术上的、政治上的、或普遍的地位上的）而骄傲，因美貌而骄傲，因财富而骄傲，因善行而骄傲，因谦卑而骄傲（是的！因谦卑而骄傲），因仁慈而骄傲，因成功而骄傲……有哪一种美德，是骄傲不能将其变为恶习的呢？例如，因祷告而骄傲，将祷告者变为法利赛人，将禁食者变为——自杀者。如此，每一种罪实际上都是因骄傲而生的罪，因为撒旦实际上是因骄傲而成为撒旦的。若没有骄傲，天使世界中不会有罪，人类世界中也不会有罪。所有这些都「不是从父来的」。从父来的，是上帝的独生子。而祂是具肉身、具人格的谦卑，连同祂所有的神圣完美。在祂的福音中，起初的美德，那众德之首，就是谦卑（参马太福音 5:3）。是的，谦卑是唯一能治愈骄傲和所有其他罪的良药。
    - type: paragraph
      text:
        ru: '2:17'
        cn: '2:17'
    - type: paragraph
      text:
        ru: '"И свет пролази, и жеља његова; а који твори вољу Божју остаје занавек». Свет греховних сласти је пролазан, јер грех и јесте сила мрачна која једина усмрћује биће људско, тј. чини га смртним, пролазним. Кроз све грехе човек уствари испуњује вољу творца свих грехова – ђавола, која и одвлачи човака у све смрти, у све пролазности. Грех најпре разори у човеку, преврне и изврне, мисаоне органе: и човек залуди, те почне пролазне ствари, и идеје, и страсти, да проглашује за своја божанства, за свају главну бригу, циљ и смисао живота. Ту је главни узрок свих идолопоклонстава људских: и културних, и научних, и философских, и уметничких, и политичких, и религиозних.'
        cn: 「世界和其上的情欲都要过去；唯独遵行上帝旨意的人，才能存到永远。」罪恶欢愉的世界是短暂的，因为罪恶本身就是一股黑暗的力量，它独自致人于死地，也就是说，使人变得必死无疑、转瞬即逝。通过所有罪恶，人实际上是在遵行所有罪恶的创造者——魔鬼的旨意，这旨意也将人拖入所有的死亡、所有的转瞬即逝之中。罪恶首先在人里面摧毁、颠覆并扭曲人的思维器官，人于是变得愚昧，开始将转瞬即逝的事物、思想和情欲宣告为自己的神明，视为自己主要的忧虑、生活的目的和意义。这就是人类所有偶像崇拜的主要根源：包括文化的、科学的、哲学的、艺术的、政治的和宗教的偶像崇拜。
    - type: paragraph
      text:
        ru: 'Насупрот томе стоји Богочовек, који показује како човек савлађује све пролазности и све смрти, и постаје бесмртан и вечан. Како? – Творећи вољу Божју: «Који твори вољу Божју остаје занавек». Воља Божја где је изражена? – У Богочовеку Христу и у његовом светом Еванђељу. Испуњујући Еванђеље човек испуњује себе бесмртношћу, вечним животом, и постаје непролазан. Ко је истински бесмртник? – Само прави хришћанин.'
        cn: 与此相对的则是神人，他展示了人如何克服一切短暂性和一切死亡，并变得不朽和永恒。如何？——借着遵行神的旨意：「凡遵行神旨意的人，必永远长存。」神的旨意在哪里得以表达？——在神人基督里和在他的圣福音里。借着履行福音，人便使自己充满不朽、永生，并变得不朽坏。谁是真正不朽的？——唯有真正的基督徒。
    - type: paragraph
      text:
        ru: 1 Јованова 2:18–29
        cn: '约翰一书 2:18-2918 孩子们，现在是末时了；你们曾听见说，敌基督者要来，现在有许多敌基督者已经来了，由此我们就知道是末时了。

          19 他们从我们中间出去，却不是属我们的；若是属我们的，就必仍旧与我们同在；他们出去，是为要显明他们都不是属我们的。

          20 你们却有从圣者而来的恩膏，并且你们都知道。

          21 我写信给你们，不是因为你们不知道真理，而是因为你们知道真理，又知道凡谎言都不是出于真理。

          22 谁是说谎者呢？不正是那不认耶稣是基督的吗？那不认父与子的，就是敌基督者。

          23 凡不认子的，就没有父；凡认子的，也有父。

          24 至于你们，从起初所听见的，要常存在你们心里。如果从起初所听见的常存在你们心里，你们就必住在子里面，也住在父里面。

          25 他向我们所应许的，就是这永生。

          26 我将这些话写给你们，是指着那些迷惑你们的人说的。

          27 你们从他所受的恩膏，常存在你们心里，就不需要人教导你们；但正如这恩膏在凡事上教导你们，这恩膏是真的，不是虚假的，它怎样教导了你们，你们就要住在他里面。

          28 如今，孩子们，你们要住在他里面，这样，当他显现的时候，我们就可以坦然无惧，在他来临的时候不至于羞愧。

          29 你们若知道他是公义的，就知道凡实行公义的，都是从他而生的。'
    - type: paragraph
      text:
        ru: 1Ин.2:18–29:18Дјецо, посљедњи је час, и као што чусте да Антихрист долази, и сада су се појавили многи антихристи; отуда знамо да је посљедњи час. 19 Од нас изиђоше, али не бијаху од нас; јер да бијаху од нас, остали би с нама; али да се покажу да нису сви од нас. 20 А ви имате Помазање од Светога и знате све. 21 Не писах вам зато што не знате истину, него што је знате, и да никаква лаж није од истине. 22 Ко је лажљивац ако не онај ко пориче да Исус јесте Христос. Тај је антихрист, који одриче Оца и Сина. 23 Сваки који одриче Сина, ни Оца нема; а који признаје Сина, има и Оца. 24 Ви, дакле, што чусте од почетка, то у вама нека остане; ако у вама остане то што од почетка чусте, и ви ћете остати у Сину и у Оцу. 25 А ово је обећање које нам Он обећа, живот вјечни. 26 Ово вам написах о онима који вас варају. 27 А ви, Помазање које примисте од Њега, у вама остаје, и нема потребе да вас ико учи; него како вас то исто Помазање учи о свему, и истинито је и није лаж, и као што вас научи, останите у њему. 28 И сада, дјечице, останите у њему да када се јави имамо свјетлост, и да се не постидимо пред њим о Доласку његовом. 29 Ако знате да је Он праведан, знајте да је сваки који твори правду од њега рођен.
        cn: '(约翰一书 2:18-29)


          18 小子们哪，现今是末时了。你们曾听见敌基督要来，现在有许多敌基督者出现了，由此我们就知道现今是末时了。

          19 他们从我们中间出去，却不是属我们的；若是属我们的，就必仍与我们同在；乃是要显明他们都不是属我们的。

          20 你们有恩膏从那圣者而来，并且知道一切的事。

          21 我写信给你们，不是因为你们不知道真理，而是因为你们知道真理，并且知道没有谎言是出于真理的。

          22 谁是说谎的呢？若不是那否认耶稣是基督的，还有谁呢？这就是敌基督者，他否认父和子。

          23 凡否认子的，就没有父；凡承认子的，也有父。

          24 那么你们从起初所听见的，就让它存在你们心里。如果你们从起初所听见的仍存在你们心里，你们也就必住在子和父里面。

          25 这就是应许，是他应许给我们的，就是永远的生命。

          26 我将这些事写给你们，是关于那些迷惑你们的人。

          27 至于你们，你们从他所领受的恩膏常存在你们心里，也不需要任何人教导你们；只有这恩膏在凡事上教导你们，这恩膏是真的，不是虚假的；这恩膏怎样教导你们，你们就当存在其中。

          28 如今，小子们哪，你们要住在他里面，这样，当他显现的时候，我们就可以坦然无惧，当他来的时候，在他面前就不至于羞愧。

          29 你们若知道他是公义的，也就知道凡行公义的都是从他而生。'
    - type: paragraph
      text:
        ru: 'Свети богослов мисли у антитезама, јер су његова сагледавања најдубља, и откривења највећа; Он јасно види те антитезе; његово је Еванђеље пуно њих: Бог и ђаво, Христос и Антихрист, Истина и лаж, љубав и мржња, светлост и тама, правда и неправда, добро и зло, живот и смрт, врлина и грех. Све то он види до у корен; види и у свима размерама; види сваку тезу и антитезу у њиховој савршености и довршености, у његовој апсолутности и свеконкретности. У њега све је то: визија, откривење, опит, доживљај. Највећи тајновидац – «ученик кога љубљаше Исус», зато и први Богослов, прави Богослов. А са њим, и за њим још двојица: СветиГригорије Богослови Свети Симеон Нови Богослов.'
        cn: 圣神学家在对立中思考，因为他的洞察力最深刻，并且他的启示最伟大；他清楚地看到这些对立；他的福音书充满着它们：上帝与魔鬼，基督与敌基督，真理与谎言，爱与恨，光明与黑暗，公义与不义，善与恶，生命与死亡，美德与罪恶。所有这一切，他都看透其根源；并以其所有的维度看待；他看到每一个命题和反命题在其完美与完备中，在其绝对性与普遍具体性中。在他那里，这一切都是：异象，启示，经验，体验。他——最伟大的奥秘洞见者——《耶稣所爱的门徒》，因此他也是第一位神学家，真正的神学家。与他一起，在他之后，还有两位：圣格里高利神学家和圣西美翁新神学家。
    - type: paragraph
      text:
        ru: '2:18'
        cn: '2:18'
    - type: paragraph
      text:
        ru: 'Против Христовог добра у свету је устало све сатнско зло, против његове Истине – сва сатанска лаж, против његове Љубави – сва сатанска мржња, против његовог Бога – сав ђаво. Речју: насупрот Христу јавља се Антихрист. Анти-Христ = ἀντί-χριστος: место Христа, уместо Христа, против Христа. Да, Антихристова главна жеља, и суштина његовог бића: да замени Христа, да заузме његово место. Ради остварења тога он се служи свима средствима. Најпре – лукавим, маскираним, тобож еванђелским средствима: има изглед побожности, а силе се њезине одрекао; има изглед смирености, а њоме покрива и сакрива гордост; има изглед добротвора, а у срцу је злотвор; има изглед човекољупца, а у ствари је човекоубица. Све је он то само да би саблазнио изабране, саблазнио што већи број људи, све људе. Антихрист ће бити као неко оваплоћење ђавола, јер је Христос – оваплоћење Бога; Антихрист ће бити оличење зла, мржње, лажи, гордости, неправде, јер је Христос – оличење добра, љубави, истине, смирености, правде. Такав ће бити онај главни Антихрист, који ће се јавити пред Други долазак Господа Христа, стати на место Божје и прогласити себе за Бога (ср.2Сол.2:4). А пре њега – безброј је његових претеча, безброј антихриста. Јер је антихрист сваки који жели да заузме Христово место; антихрист је сваки који хоће да место Христове Истине стави своју истину, место Христове Правде – своју правду, место Христове Љубави – своју љубав, место Христовог Добра – своје добро, место Христовог Еванђеља – своје еванђеље. Поготову је антихрист сваки противник Христов: сваки који се бори против Христове Личности, против Христове Истине, Љубави, Правде; једном речју: против Христовог Еванђеља = против Христове Цркве, јер је Црква – оваплоћено Еванђеље. Да, оваплоћено Еванђеље, пошто је она – Тело Христово. Свети Тајновидац благовести: «Децо, последње је време, и као што чусте да ће доћи Антихрист, и сад многи антихристи посташе; по том познајемо да је последњи час".'
        cn: 世上一切撒旦的邪恶都起来对抗基督的良善，一切撒旦的谎言都起来对抗祂的真理，一切撒旦的仇恨都起来对抗祂的爱，整个魔鬼都起来对抗祂的上帝。简而言之：基督的对立面就是敌基督者。敌基督者（Анти-Христ = ἀντί-χριστος）：意为取代基督、代替基督、对抗基督。是的，敌基督者的主要愿望及其存在的本质就是：取代基督，占据祂的位置。为了实现此目的，他会使用一切手段。首先——通过狡猾、伪装、貌似福音的手段：他有敬虔的外貌，却否认了敬虔的能力；他有谦卑的外貌，却以此遮盖并隐藏了骄傲；他有慈善家的外貌，内心却是作恶者；他有爱人的外貌，实则却是杀人者。他做这一切，无非是为了迷惑选民，迷惑尽可能多的人，迷惑所有人。敌基督者将如同魔鬼的某种化身，因为基督是上帝的化身；敌基督者将是邪恶、仇恨、谎言、骄傲、不义的化身，因为基督是良善、爱、真理、谦卑、公义的化身。那主要的敌基督者，就是要在主基督第二次降临之前显现，站在上帝的位置上，并宣告自己为上帝的那一位，他将是如此这般（参看 帖撒罗尼迦后书 2:4）。而在他之前，有无数他的先驱，无数的敌基督者。因为每一个渴望取代基督位置的人都是敌基督者；每一个想用自己的真理取代基督的真理，用自己的公义取代基督的公义，用自己的爱取代基督的爱，用自己的良善取代基督的良善，用自己的福音取代基督的福音的人，都是敌基督者。尤其，每一个基督的反对者都是敌基督者：每一个与基督位格、基督的真理、爱、公义作斗争的人；简而言之：反对基督的福音就是反对基督的教会，因为教会就是道成肉身的福音。是的，道成肉身的福音，因为她就是基督的身体。圣启示者宣告说：「孩子们，这是末时了，你们曾听见那敌基督者要来，现在有许多敌基督者已经出现了，因此我们知道，现在是末时了。」（约翰一书 2:18）
    - type: paragraph
      text:
        ru: '2:19'
        cn: '2:19'
    - type: paragraph
      text:
        ru: 'Откуда антихристи? »Од нас изиђоше, али не бише од нас – ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν – ; кад би били од нас онда би остали с нама; али да се јаве да нису сви од нас«. Хришћанин се постаје, и хришћанин се остаје, једино по слободној вољи. А слободна воља тиме је слободна што увек има и моћи и права да се определи за добро или зло, за истину или лаж, за љубав или мржњу, за правду или неправду, за Бога или ђавола, за Христа или антихриста. Хришћани који отпадну од Христа показују да се нису помоћу светих тајни и светих врлина укоренили и утемељили и учврстили у Христу. А то нису зато што су тако хтели по својој слободној вољи. Прави хришћани су утемељени у Христу, сутелесници су Тела Његовог Богочовечанског – Цркве, заједничари су Божји, »домаћи су Богу« (Еф.2:19), живе са светима (Еф.2:19), и то «са свима светима» (Еф.3:18), удови су међу собом, удови једног Тела: Христовог Тела, иако су многи – «једно су тело» (1Кор.12:12): «јер смо један хлеб, једно тело многи» (1Кор.10:17), зато они што отпадају од Христа: «не бише од нас", јер "кад би били од нас – остали би с нама".'
        cn: '敌基督者从何而来？「他们从我们中间出去，却不是属我们的——ἀλλ』 οὐκ ἦσαν ἐξ ἡμῶν——；若是属我们的，就必仍旧与我们同在；他们出去，显明都不是属我们的。」


          人成为基督徒，并作为基督徒持守，唯独是凭着自由意志。而自由意志之所以自由，在于它总有能力和权利选择善或恶，选择真理或谎言，选择爱或恨，选择公义或不义，选择上帝或魔鬼，选择基督或敌基督者。


          那些离弃基督的基督徒表明他们没有借着圣事和圣德在基督里扎根、立定和坚固。他们之所以没有如此，是他们凭着自己的自由意志如此选择。


          真正的基督徒是扎根于基督的，是祂神人两性之身体——即教会——的肢体，是与上帝共享团契的，是「与上帝同家的」 (以弗所书 2:19)，与圣徒同活 (以弗所书 2:19)，并且是「与众圣徒一同」 (以弗所书 3:18)，他们彼此是肢体，是一个身体的肢体：基督的身体，尽管他们众多——「仍是一个身体」 (哥林多前书 12:12)： 「因为我们是一个饼，一个身体，虽有多人」 (哥林多前书 10:17)，所以那些离弃基督的人：「不是属我们的」，因为「若是属我们的，就必仍旧与我们同在。」'
    - type: paragraph
      text:
        ru: '2:20'
        cn: '2:20'
    - type: paragraph
      text:
        ru: '"И ви имате помазање од Светога – ἀπὸ τοῦ ἁγίου – и знате све". "Знате све»: и Бога и Сатану, и Христа и Антихриста, и Добро и зло, и живот и смрт, и правду и неправду. За вас су решена сва главна питања; у вас нема колебања, недоумице, сумње. Ви знате све путеве који воде Богу, као и оне који воде ђаволу. Откуда знате? – «Од Светога». Јер се само Светим зна ове. «Помазање од Светога», то је – освећење васцелог бића човековог, а на првом месту његових органа познања: ума, разума, душе, срца. Испуни ли себе светошћу Светога, човек и долази до правог, истинског знања о Светоме, тј. о Богу, а помоћу Њега и о свему осталоме што је човековом бићу потребно. Само живећи светим животом; само живећи Светим и у Светоме – човек се оспособљује за истинско знање о свему што је потребно човеку у свима световима његовог постојања. Отуда су само Светитељи – истински зналци и света, и човека, и Бога, и Истине, и Правде, и Живота; исто тако и ђавола, и свега што је од њега. «Ми знамо шта Сатана мисли» (2Кор.2:11), изјављује свети Апостол. А светост чува Светитеље да се они, знајући зло и све саблазни његове, не саблазне.'
        cn: 你们有从圣者而来的恩膏—— ἀπὸ τοῦ ἁγίου ——且知一切。「知一切」：知上帝与撒旦，知基督与敌基督，知善与恶，知生命与死亡，知公义与不义。对你们而言，所有主要问题都已解决；你们心中没有动摇、困惑、疑惑。你们知晓所有引向上帝的道路，以及那些引向魔鬼的道路。你们何以知晓？——「从圣者而来」。因为唯有藉着圣者方能知晓这些。「从圣者而来的恩膏」，即是人整个存有的圣化，首要的是其认知器官：心智、理智、灵魂、心灵。人若以圣者的圣洁充满自己，便可达到对圣者，即对上帝的真正、真实的认识，并藉着祂认识人类存有所需的一切。唯有活出圣洁的生命；唯有活在圣者之中，并藉着圣者——人方能获得对人类在其所有存在界域所需的一切的真实认识。因此，唯有圣徒——方是世间、人类、上帝、真理、公义、生命的真正知晓者；同样，也知晓魔鬼以及一切源自魔鬼的事物。圣使徒宣告：「我们知道撒旦所思」（哥林多后书 2:11）。而圣洁保守圣徒，使他们在知晓邪恶及其一切诱惑之时，不致被诱惑。
    - type: paragraph
      text:
        ru: '2:21'
        cn: '2:21'
    - type: paragraph
      text:
        ru: 'Они до последњих танчина знају и тајну добра и тајну зла, и тајну истине и тајну лажи; они са највећом сигурношћу и јасношћу знају да нема никакве заједнице између Светлости и таме, Бога и ђавола, Истине и лажи, Добра и зла. Зато свети Тајновидац благовести: «Не писах вам као да не знате истине, него што је знате, и да никаква лаж (πᾶν ψεῦδος) – није од истине".'
        cn: 他们深入细微之处，知晓善的奥秘与恶的奥秘，真理的奥秘与谎言的奥秘；他们以最大的确信和清晰知晓，光与暗之间，神与魔鬼之间，真理与谎言之间，善与恶之间，绝无任何相通之处。因此，圣启示者宣告说：「我写信给你们，不是因你们不知道真理，而是因你们知道，并且知道一切谎言（πᾶν ψεῦδος）都不是出于真理。」
    - type: paragraph
      text:
        ru: '2:22'
        cn: '2:22'
    - type: paragraph
      text:
        ru: 'Хришћани су тиме хришћани што знају Истину. А шта је Истина? – Богочовек Христос. А шта је лаж? – Ђаво, »јер је лажа и отац лажи« (Ин.8:44). У чему се састоји главана лаж његова? – У одрицању Богочовека Христа: у тврђењу да Исус није Бог, није Месија = Христос, није Спаситељ. Стога је то исти посао и Антихриста. Главни лажљивац у свету је ђаво, а са њим – Антихрист. Разуме се, лажљивац је сваки који ма на који начин пориче да је Исус – Бог, Месија, Спаситељ. То је главна лаж у свету; а ове остале лажи, или су од ње, или су на путу да то постану. Када би се ове лажи слиле у јадну лаж, у свелаж, она би гласила: Исус Назарећанин није Бог, није Месија, није Спаситељ. Свети Тајноводац са божанским правом тврди: »Ко је лажљивац – ὁ ψεύστης – осим онога који одриче – ὁ ἀρνούμενος – да Исус није Христос. Ово је антихрист, који одриче Оца и Сина«. У чему је Антихрист и цело антиеванђеље његово? – У одрицању Тројичног Божанства: Оца и Сина и Светога Духа.'
        cn: 基督徒之所以是基督徒，在于他们认识真理。真理是什么？——是神人基督。谎言是什么？——是魔鬼，『因为它说谎，是说谎之人的父』（约翰福音 8:44）。它主要的谎言是什么？——是否认神人基督：坚称耶稣不是上帝，不是弥赛亚 = 基督，也不是救主。因此，这也是敌基督的同样行径。世上主要的说谎者是魔鬼，与它同伙的是敌基督。不言而喻，任何以任何方式否认耶稣是上帝、是弥赛亚、是救主的人，都是说谎者。这是世上主要的谎言；而所有其他的谎言，要么源于它，要幺正在成为它的路上。如果这些谎言汇聚成一个可悲的谎言，一个彻头彻尾的谎言，它就会是：拿撒勒人耶稣不是上帝，不是弥赛亚，不是救主。圣启示者以神圣的权利宣称：『谁是说谎者（ὁ ψεύστης）呢？除非是那否认（ὁ ἀρνούμενος）耶稣不是基督的人。这就是敌基督，他否认父与子。』敌基督及其整个反福音的要旨是什么？——是否认三一神性：圣父、圣子和圣灵。
    - type: paragraph
      text:
        ru: '2:23'
        cn: '2:23'
    - type: paragraph
      text:
        ru: 'Нема Бога сем Тројичног Божанства. Ко не признаје Христа за Бога, тај је и незнабожац и безбожник. Зна Бога, зна све, који Христа за Бога признаје. А ко то признаје, он у Тројично Божанство верује, јер Господ Христос, као Син Божји, сваког следбеника свог приводи Оцу свом небеском. Порекне ли се Син, пориче се у исто време и Отац, јер је Отац тиме Отац што има Сина. А Господ Христос целокупним својим животом на земљи најочигледније доказује да је све у Њему божанско, да је по свима особинама – сав од Бога Оца, и сав на Оца. Свети Богослов благовести: »Који год одриче – ὁ ἀρνούμενος – Сина, ни Оца нема; а који признаје – ὁ ὁμολογῶν – Сина, и Оца има«. Однос према Христу одређује однос човеков према Богу. Јер нема Бога осим Христа ни на небу, ни на земљи, ни под земљом.'
        cn: 除了三一神性，别无他神。凡不承认基督是神的人，就是异教徒，也是无神论者。凡承认基督是神的人，就认识神，也认识一切。凡承认这一点的人，他便相信三一神性，因为主基督作为神的儿子，将祂的每个跟随者都引向祂在天上的父。若否认子，就同时否认了父，因为父之所以为父，是因祂有子。而主基督藉着祂在地上完整的一生，最清楚地证明了祂里面的一切都是神圣的，并且在所有属性上——祂全然来自父神，也全然像父。圣神学家宣称：「凡否认——ὁ ἀρνούμενος——子的，就没有父；凡承认——ὁ ὁμολογῶν——子的，就也有父。」人与基督的关系决定了人与神的关系。因为除了基督，无论是天上、地上，还是地下，再无他神。
    - type: paragraph
      text:
        ru: '2:24'
        cn: '2:24'
    - type: paragraph
      text:
        ru: '"Ви дакле што чусте из почетка нека стоји у вама (ἐν ὑμῖν μενέτω); ако у вама остане што чусте из почетка, и ви ћете остати у Сину и у Оцу». Од самог почетка Еванђеље Христово је Еваиђеље Свете Тројице и о Светој Тројици. Човек постаје хришћанин ако прими то Еванђеље, а остаје хришћанин ако живи њиме, и ако оно стоји у њему. А кроз Еванђеље у човеку стоји, борави, живи сама Света Тројица; Она и даје човеку силе да живи еванђелски. Шта је живот хришћанинов? – Стално лично општење његово са Оцем и Сином и Светим Духом помоћу светих тајни и светих врлина. Утројичење и отројичење је непрекидан благодатни подвиг хришћанинов.'
        cn: 那么，你们从起初所听见的，让它常存在你们里面（ἐν ὑμῖν μενέτω）；如果你们从起初所听见的常存在你们里面，你们就必住在子里面，也住在父里面»。从一开始，基督的福音就是圣三一的福音，也是关于圣三一的福音。人若接受这福音，便成为基督徒；若靠着福音生活，并让福音常存他里面，他便仍是基督徒。而藉着福音，圣三一本身就常存、居住、活在人里面；祂也赐予人力量，使其能按福音而活。基督徒的生命是什么？——是他借着圣事和圣德与父、子、圣灵持续的个人交通。圣三一的内住与圣三一化，是基督徒一项持续的蒙恩功修。
    - type: paragraph
      text:
        ru: '2:25'
        cn: '2:25'
    - type: paragraph
      text:
        ru: 'А таквим подвигом постиже се главтни циљ човекова постојања у свету: живот вечни. И тиме испуњује главно обећање Господа Христа и Његовог Еванђеља. Јер све што је био, чинио и учио, и био је и чинио је и учио је да би људима осигурао и дао живот вечни. Зато свети Благовесник благовести: «И ово је обећање које нам он обећа, живот вечни".'
        cn: 并且，藉着这样的属灵努力，达成了人在世上存在的主要目标：永生。并且，借此实现了主基督和祂福音的主要应许。因为凡是祂所是、所行、所教的一切，都是为了确保并赐予人们永生。因此，圣史宣示：「这就是祂应许我们的应许：永生。」（约翰一书 2:25）
    - type: paragraph
      text:
        ru: 2:26–27
        cn: 2:26–27
    - type: paragraph
      text:
        ru: 'Само живећи Истином човек се оспособљава да се брани, и увек одбрани, од свих саблазни које налећу на њега. Истина сама себе брани, само човек треба да је, живећи њоме и ради ње, претвори у своју природу. Онда ће га она сама бранита, и увек одбранити, од сваке неистине и лажи. Истинита је реч Истине: »Истина ће вас ослобдити« (Ин.8:32): ослободити од сваког греха, од сваког зла, сваког ђавола. Сама Истина, борави ли у нама, учи нас истини, свакој истини. Учи нас кроз свете врлине, и борави у нама помоћу светих врлина и светих тајни. Нема сумње, Свети живи у нама помоћу светих тајни и светих врлина, које све наше мисли и осећања и жеље претварају у свете. И кроз њих свете Свети нас учи свему што нам је потребно за побожност и живот вечни и у овом и у оном свету. Свете ствари сазнају се светошћу. Јер са Светим се ошпти светошћу, који нас преко светости непосредно учи свакој истини. Стога свети Тајнозналац благовести: «И ви помазање што примисте од Њега, у вама стоји – ἐν ὑμῖν μένει, и немате потребе да вас ко учи; него како вас то само помазање учи о свему, и истинито је, и није лаж, и као што вас научи останите у њему – μενεῖτε ἐν αὐτῷ.'
        cn: 唯有活出真理，人才能得以防御，并总能抵御临到他的一切诱惑。真理本身会自我防御，只是人需要借着活出它并为它而活，将它转化为自己的本性。那么它自己就会保护他，并总能将他从一切不真之事和谎言中解救。真理之言是真实的：「真理必叫你们得以自由」（约翰福音 8:32）：使你们脱离一切罪恶、一切邪恶、一切魔鬼。真理本身，如果它居住在我们里面，就会教导我们真理，每一种真理。它借着圣洁的德行教导我们，并借着圣洁的德行和圣事居住在我们里面。毫无疑问，圣者借着圣事和圣洁的德行居住在我们里面，这些将我们所有的思想、情感和愿望都转化为圣洁。圣者借着这些圣洁之物教导我们，在今世和来世敬虔与永生所需的一切。圣洁之事借着圣洁得以知晓。因为人借着圣洁与圣者相交，祂借着圣洁直接教导我们每一种真理。因此，通晓奥秘的圣者宣报：「你们从祂所领受的恩膏，常住在你们里面 – ἐν ὑμῖν μένει, 就不需要有人教导你们；但正如这恩膏在凡事上教导你们，而且这恩膏是真的，不是假的，你们要照它所教导的，住在祂里面 – μενεῖτε ἐν αὐτῷ。」 (约翰一书 2:27)
    - type: paragraph
      text:
        ru: '2:28'
        cn: '2:28'
    - type: paragraph
      text:
        ru: 'Нема живота, ни истине ван Њега – Христа. Свети Богослов не престаје благовестити главну истину Божјег Еванђеља: борављење човеково у Њему и Његово у човеку и јесте сав хришћанинов живот и у овом и у оном свету. Сва је новозаветна истина у овоме: Богочовек да буде у нама и ми у Њему. А са тим биће и Истина у нама и ми у њој, и Правда у нама и ми у њој, и Љубав у нама и ми у њој, и Вечност у нама и ми у њој, и сва савршенства Божја у нама и ми у њима. То је оно што нас чини децом Божјом, те као деца имамо слободу пред Оцем: »И сад, дечице, останите у Њему – μένετε ἐν αὐτῷ ( = обитавајте у њему) -, да имамо слободу кад се јави, и да се не осрамотимо пред Њим о доласку његовом".'
        cn: 在祂——基督之外，没有生命，也没有真理。圣神学家不断宣讲上帝福音的主要真理：人的住在于祂里面，以及祂在人里面，这就是基督徒今世和来世的全部生命。全部新约的真理都在于此：神人当在我们里面，而我们当在祂里面。如此，真理就将在我们里面，我们也在真理里面；公义就将在我们里面，我们也在公义里面；爱就将在我们里面，我们也在爱里面；永恒就将在我们里面，我们也在永恒里面；以及上帝的一切完美都将在我们里面，我们也在这些完美里面。这就是使我们成为上帝儿女的，这样，作为儿女，我们在父面前有坦然无惧的自由：「小孩子们哪，现在要住在祂里面——μένετε ἐν αὐτῷ（即：居住在祂里面），——使祂显现的时候，我们就可以坦然无惧，不至于在祂降临的时候在祂面前蒙羞。」
    - type: paragraph
      text:
        ru: '2:29'
        cn: '2:29'
    - type: paragraph
      text:
        ru: '"Ако знате да је праведник, знате (γινώσκετε) да је сваки који твори правду – ὁ ποιῶν τὴν δικαιοσύνην, од Њега рођен«. Правда је у Праведнику, и праведност је од Праведника. Само Праведник има правду и зна правду; а сву правду, Божанску Правду, Свеправду има и зна Божански Праведник, Свеправедник – Господ Христос. Ко у Њему стоји, у правди стоји; и опет: у коме Он стоји – стоји свом Правдом својом; – и то човек показује својом праведношћу, јер се из Праведника лије правда и праведност као из сунца светлоет, из босиљка мирис. Правду има, правду зна само онај који се са Јединим Праведником помоћу светих врлина сроди, и од Њега духовно роди. Стога сваки праведник личи на Њега – Свеправедника: «који правду твори праведник је, као што је Он праведан» (1Ин.3:7).'
        cn: 如果你们知道那公义者是公义的，你们就知道凡行公义的——ὁ ποιῶν τὴν δικαιοσύνην，都是由他而生。公义在公义者里面，正直从公义者而来。唯有公义者拥有公义并认识公义；而一切公义，神圣的公义，全备的公义，唯有神圣的公义者，全备的公义者——主基督拥有并认识。凡在他里面站立的，就站立在公义之中；并且，再次：他在谁里面站立，谁就以他所有的公义站立着；而人则藉着自己的正直彰显出这一点，因为公义和正直从公义者流溢而出，如同光从太阳流溢而出，香气从罗勒流溢而出。唯有那藉着圣洁的德行与独一的公义者结为亲缘，并由他属灵地生出的人，才拥有公义、认识公义。因此，每一个义人都像他——全备的公义者：「凡行公义的，才是公义的，正如他（是）公义的。」 (约翰一书 3:7)
  - type: heading2
    text:
      ru: Трећа глава
      cn: 第三章
    children:
    - type: paragraph
      text:
        ru: 1 Јованова 3:1–10
        cn: 约翰一书 3:1-10
    - type: paragraph
      text:
        ru: '1Ин.3:1–10:1Видите колику нам је љубав дао Отац, да се дјеца Божија назовемо и будемо; зато нас свијет не познаје, јер њега не позна. 2 Љубљени, сада смо дјеца Божија, и још се не откри шта ћемо бити; а знамо да када се открије, бићемо слични Њему, јер ћемо га видјети као што јесте. 3 И сваки који ову наду има у њега, очишћава себе, као Он што је чист. 4 Сваки који чини гријех и безакоње чини; а гријех јесте безакоње. 5 И знате да се Он јави да гријехе наше узме; и гријеха у њему нема. 6 Сваки који у њему пребива не гријеши; сваки који гријеши није га видио нити га је познао. 7 Дјечице, нико да вас не вара: који твори правду праведан је, као што је Он праведан; 8 Онај који твори гријех од ђавола је, јер ђаво гријеши од почетка. Ради тога се јави Син Божији да разори дјела ђавоља. 9 Сваки који је рођен од Бога не чини гријех, јер сјеме Његово остаје у њему, и не може гријешити, јер је од Бога рођен. 10 По овоме се познају дјеца Божија и дјеца ђавоља: Сваки који не твори правду није од Бога, ни онај који не воли брата својега.'
        cn: '（约翰一书 3:1-10）


          1 你们看，父赐给我们何等的爱，使我们得称为神的儿女，我们也真是如此。世界不认识我们，是因为它不认识祂。

          2 亲爱的，我们现在是神的儿女，将来如何，还未显明；但我们知道，祂若显现，我们必要像祂，因为我们必得见祂的真体。

          3 凡对祂有这盼望的，就洁净自己，正如祂是洁净的。

          4 凡犯罪的，就是犯了不法的事；罪就是不法。

          5 你们知道，主曾显现，是要除掉我们的罪；在祂里面并没有罪。

          6 凡住在祂里面的，就不犯罪；凡犯罪的，是未曾看见祂，也未曾认识祂。

          7 小子们哪，不要被人迷惑。行义的才是义人，正如祂是义的。

          8 犯罪的是属魔鬼，因为魔鬼从起初就犯罪。为此，神的儿子显现出来，为要除灭魔鬼的作为。

          9 凡从神生的，就不犯罪，因为祂的种子常存在他里面；他也不能犯罪，因为他是由神生的。

          10 从此就显明谁是神的儿女，谁是魔鬼的儿女。凡不行义的就不属神，不爱他弟兄的也是如此。'
    - type: paragraph
      text:
        ru: '3:1'
        cn: '3:1'
    - type: paragraph
      text:
        ru: '«Видите какву нам је љубав– ποταπὴν ἀγάπην (= какве врсте, начина љубави) –дао Отац, да се деца Божја – τέκνα Θεοῦ – назовемо и будемо;зато свет не познаје нас, јер Њега не позна». Христова, богочовечанска љубав је изузетна, јединствана врста љубави: по свему божанска, савршена, па ипак оваплоћена, очигледна стварност: «видите». Та се љубав да видети, размотрити, чути, опипати. Суштина је њена у овоме: Бог Отац нам је кроз Сина свог Јединца дао силе да постанемо и назовемо се деца Божја, ми који смо гресима постали деца ђавола чинећи «дела оца свога» (Ин.8:41). Другим речима, дао нам богоусиновљење. То наше усиновљење Богу бива Сином Божјим, Гасподом Христом. Он који је Син Божји по природи, постао је Сии Човечји, да би нас учинио Синовима Божјим по благодати. Сила којом Он то остварује јесте божанска љубав, света љубав, благодатна љубав. Она васцело биће људско препорађа, и од Бога рађа. Ако је мисао, ова је тако препорађа, да се она увек од Бога рађа, рађа као богомисао; ако је воља, она је тако препорађа, да се она увек од Бога рађа, рађа као боговоља: јер увек хоће оно што и Бог; ако је осећање, расположење, душа, ум – исто тако. На тај начин постајемо деца Божја. Та љубав је стваралачка, обожујућа сила: остварење «прве и највеће заповести» свим срцем, свом душом, свом мишљу, свом снагом. Тиме се испуњује Богом цело срце, цела душа, цео ум, сва снага, и Он их онда прерађује, пречишћава, преображује, препорођује, поново рађа, и сав човек постаје дете Божје. Једиом речју: Бог обожује човека боготворећом силом своје божанске љубави. Човек проходи свим бићем својим сав процес спасења: од самоодречења до обожења, од богорођења до богообожења. То је дубоко и свестрано лични доживљај, или боље: лично доживљавање Бога човеком, уживљавање у Бога, живљење Богом. Зато свет то не види, нити познаје, нити може. Све је то зато што «Њега не позна». А Он се упознаје само личним доживљавањем његове љубави као своје: као живота свога живота, као душе своје душе, као срца свога срца, као савести сваје савести. Другим речима: Христос се може познати ухристовљењем и охристовљењем: најпре човек путем светих тајни и светих врлина уноси себе у Христа, ухристовљује себе, а затим непрекидно живи Њиме и ради Њега, охристовљује себе. Зато свети Богослов с правом вели: «свет не познаје нас, јер Њега не позна». А ми смо од Њега: деца Божја.'
        cn: 「你们看父赐给我们是何等的爱——ποταπὴν ἀγάπην（=何种、何样的爱）——使我们得称为神的儿女，我们也真是如此；为此，世人不认识我们，因为不认识祂。」基督的神人二性的爱是卓越非凡、独一无二的爱：它在各方面都是神圣的、完美的，然而却是道成肉身、显而易见的真实：「你们看」。这爱是可看、可思、可听、可触摸的。其精髓在于此：父神藉着祂的独生子，赐予我们能力，使我们得以成为并被称为神的儿女——我们这些曾因罪孽成为魔鬼的儿女，行「你们父所行的事」（约翰福音 8:41）的人。换言之，祂赐予我们被神收养的恩典。我们被神收养，是藉着神的儿子、主基督而成就的。祂本是按着本性为神的儿子，却成为人子，为要使我们藉着恩典成为神的儿子。祂成就此事的力量，便是神圣的爱、圣洁的爱、恩典之爱。它使整个人性得到重生，并由神而生。如果是思想，这爱便如此地使其重生，使其总是由神而生，生出神思；如果是意志，这爱便如此地使其重生，使其总是由神而生，生出神旨：因为它总是意愿神所意愿的；如果是情感、性情、灵魂、心智——亦是如此。通过这种方式，我们成为神的儿女。这爱是一种创造性的、使人神化的力量：它以全心、全灵、全意、全力来成就「第一条和最大的诫命」。由此，全心、全灵、全意、全力都被神充满，然后祂将它们精炼、洁净、转化、更新、重生，于是整个人都成为神的儿女。简而言之：神藉着祂神圣之爱的使人成神的力量，使人神化。人以其整个生命经历救赎的全部过程：从自我舍弃到神化，从由神而生到被神神化。这是一个深刻而全面的个人体验，或者更确切地说：是人对神个人的经历、融入神、活在神里面。因此，世人看不见它，也不认识它，更不能做到。所有这一切都是因为「不认识祂」。而认识祂，唯独通过个人将祂的爱体验为自己的爱：如同自己生命的生命，自己灵魂的灵魂，自己内心的内心，自己良知的良知。换言之：认识基督可通过与基督合一和活出基督：首先，人藉着圣奥秘和圣美德将自己融入基督，使自己与基督合一；然后，人持续地靠祂而活，并为祂而活，使自己活出基督。因此，圣神学家（指圣约翰）有理由说：「世人不认识我们，因为不认识祂。」而我们是从祂而来：是神的儿女。
    - type: paragraph
      text:
        ru: '3:2'
        cn: '3:2'
    - type: paragraph
      text:
        ru: '"Љубљени, сад смо деца Божја«, а деца су Божја тиме деца Божја што »расту растом Божјим" (Кол.2:19) "у човека савршена", "у меру раста висине Христа« (Еф.4:13), и то расту у Цркви и Црквом, расту у телу Цркве заједно «са свима светима» (Еф.4:11–16:18;Кол.2:19). Спаситељ нам је у телу свом Богочовечанском дао све божанске животворне силе, које су нам потребне ради ухристовљења и охристовљења, ради уцрквљења и оцрквљења: «бићемо као и Он = ὅμοιοι αὐτῷ ἐσόμεθα. То охристовљење, то Христоуподобљење даје човеку потпуну визију Богочовека, у васцелом блеску свих Његових богочовечанских савршенстава: «јер ћемо Га видети као што јесте – καθώς ἐστι». Најпотпуније и најреалније, и једино могућно христопознање бива кроз ухристовљење, кроз охристовљење, кроз христоликост. Јер само ходећи «као што је Он ходио» (1Ин.2:6), ми постајемо «као и Он".'
        cn: 亲爱的，我们现在是神的儿女，神的儿女之所以是神的儿女，是因他们「按着神的增长而增长」（歌罗西书 2:19），以至于长成「完全的人」，达到「基督丰满长成的身量」（以弗所书 4:13），并且是在教会中、并借着教会而增长，在教会的身体中与「众圣徒一同」增长（以弗所书 4:11-16:18;歌罗西书 2:19）。救主在祂的神人身体中，赐予我们一切神圣的、赐生命的能力，这些能力是我们为了与基督合一并成为基督样式，为了融入教会并成为教会一部分所必需的：「我们必像他一样」= ὅμοιοι αὐτῷ ἐσόμεθα。这种基督化，这种肖似基督，使人得以完全地看见神人，在其所有神人两性的完美中的全然荣耀里：「因为我们必得见他，正如他所是」– καθώς ἐστι。最完全、最真实，也是唯一可能的基督认知，是借着与基督合一、基督化以及肖似基督而实现的。因为只有「正如他所行的而行」（约翰一书 2:6），我们才能成为「像他一样」。
    - type: paragraph
      text:
        ru: '3:3'
        cn: '3:3'
    - type: paragraph
      text:
        ru: '«И сваки који ову наду има у њега, чисти се, као и Он што је чист (ἁγνός). Ко има за циљ христоликост, ухристављење: чисти себе помоћу божанских сила светих тајни и светих врлина. Његов је стални идеал: постати »као и Он што је«. Да то оствари, он сву наду полаже у Њега – бескрајно човекољубивог и снисходљивог. Очистити себе »као и Он што је чист«; осветити себе «као и Он што је свет» (ср.1Пет.1:15–16); ољуботворити себе «као и Он што је"Љубав; омилостивити себе «као и Он што је милостив». Јер је Он и постао као што смо ми, да бисмо ми постали «као што је Он». Он је «пуноћа Божанства телесно» (Кол.2:9), да бисмо ми постали пуноћа Божанства духовно, благодатно. Он се очовечио, да бисмо се ми обожили. Он нас «очишћава од свакога греха» (1Ин.1:7), да бисмо постали чисти «као и Он што је чист». То је чистота коју Он даје и тражи од нас. Биће људско није за грех и његову прљавштину, већ за Бога и његову чистоту.'
        cn: 「凡在他里面有这盼望的，就洁净自己，正如他自己是洁净的（ἁγνός）一样。凡以效法基督、与基督联合为目标的人，便藉着圣事和圣德的属神能力洁净自己。他不变的理想是：变得「正如他自己是」那样。为了实现此目标，他将所有的盼望都寄托在他身上——那位无限地爱人并谦卑降临的。洁净自己，「正如他自己是洁净的」；使自己成圣，「正如他自己是圣洁的」（参 1彼路得记 1:15-16）；使自己成为爱，「正如他自己是」爱；使自己成为怜悯，「正如他自己是怜悯的」。因为他成了我们，为要使我们成为「正如他一样」。他是「神性的一切丰盛都有形有体地居住在他里面」（歌罗西书 2:9），为要使我们藉着恩典在灵里成为神性的丰盛。他道成肉身，为要使我们得以成神。他「洁净我们，使我们脱离一切的罪」（约翰一书 1:7），为要使我们成为洁净的，「正如他自己是洁净的」一样。这就是他所赐予并向我们要求的洁净。人类的本性不是为了罪及其污秽，而是为了上帝及其洁净。」
    - type: paragraph
      text:
        ru: '3:4'
        cn: '3:4'
    - type: paragraph
      text:
        ru: 'Грех скрнави човека, његово богоздано и боголико биће. То је основна нечистота, пранечистота, и извор свих нечистота. Чистота је уствари чистота од греха и његове прљавштине. А то је светост. Јер само помоћу светих божанских сила, које добија преко светих тајни и светих врлина, човек држи себе чиста од греха. Та чистота, света чистота је божански закон људског бића. Та чистота се постиже и одржава живљењем у доброти, у љубави, у молитви, у правди, у кротости, у посту, у уздржљивости, и осталим еванђелским врлинама; једном речју: у светости, као синтези и јединству свих светих врлина и благодатних сила. Насупрот чистоти, светости као закону, божанском закону људског бића, стоји грех као прво и основно безакоње. Грех свим својим бићем као да вели пркосно Богу: Нећу твој закон; нећу да знам за њега ни за тебе; хоћу да будем далеко од тебе, и ван свега твога. Чинећи грех, човек нарушава све Божје законе, и заводи безакоње, и кроз безакоње – безвлашће, неред, хаос. «Грех је безакоње», безакоње према закону Божјем. Закон је од Бога, безакоње од ђавола. Закон Божји је Еванђеље; безакоње је грех. Његов је једини закон: бити без закона Божјег, и против закона Божјег. У суштини, закон, и законито, је само оно што је Божанско, еванђелско; безакоње је све што је супротно томе, што није божанско, еванђелско. А то је грех, и отац греха – ђаво. Он је једини прави безаконик; а безакоње међу људима дошло је од греха и преко греха. Шта је закон и за самог Бога? – Светост, Љубав, Правда, Доброта, Мудрост, и остала савршенства. То је закон и за људе, јер су боголика бића. Један је закон и за Бога и за људе: Еванђеље. Зато наш народ и назива Еванђеље законом; и главну боговаплотитељску силу: свето Причешће – законом: «примио сам закон», каже наш народ кад се причести. Ко не живи по том закону, већ је безаконик. «Грех је безакоње», врлина је закон. «Сваки који чини грех и безакоње чини".'
        cn: 罪玷污人，玷污他那蒙神所造、肖似神的生命本质。它是根本的污秽，原始的污秽，以及一切污秽的源头。洁净实际上是指脱离罪及其污秽的洁净。而这便是圣洁。因为人唯有借助神圣的、属神的诸能力——他借由神圣的奥秘（圣事）和神圣的诸美德而领受这些能力——才能使自己免于罪恶而保持洁净。那种洁净，即圣洁的洁净，是人类生命本质的属神之律法。这种洁净借由活出良善、爱、祷告、公义、温柔、禁食、节制以及其他福音美德而得以实现和保持；一言以蔽之：即在圣洁之中，圣洁是所有神圣美德与恩典之力的综合与统一。与洁净和圣洁（作为律法，人类生命本质的属神之律法）形成对比的，是罪，它作为首要且根本的无法无天。罪以其全部存在，仿佛在公然反抗地对神说：我不要你的律法；我不要认识它，也不要认识你；我就是要远离你，并且置身于你的一切之外。犯下罪恶，人就破坏了神的一切律法，并引入无法无天，又通过无法无天引入——无政府状态、混乱、混沌。「罪就是无法无天」，这是对神律法的无法无天。律法源自神，无法无天源自魔鬼。神的律法就是福音；无法无天就是罪。它的唯一律法就是：没有神的律法，并且与神的律法作对。从本质上讲，律法和合乎律法的，唯有属神的、福音性的东西；无法无天则是所有与之相反的、不属神的、非福音性的东西。而这便是罪，以及罪的父——魔鬼。他是唯一真正的无法无天者；而人类中的无法无天则源于罪并通过罪而来。即使对神自己而言，律法又是什么呢？——是圣洁、爱、公义、良善、智慧，以及其他诸般完全。这也是人的律法，因为人是肖似神的生命本质。对神和对人而言，只有一条律法：福音。因此，我们的人民也称福音为律法；并将那主要的、使神道成肉身的能力——圣洁的圣餐——称为律法：「我领受了律法，」我们的人民在领受圣餐时说。凡不按照那律法而生活的人，已经是无法无天者了。「罪就是无法无天」，美德就是律法。「凡犯罪的，也行了无法无天。」
    - type: paragraph
      text:
        ru: '3:5'
        cn: '3:5'
    - type: paragraph
      text:
        ru: '«И знате да се Он јави да грехе наше узме; и греха у њему нема (οὐκ ἔστι). Циљ оваплоћења Бога Логоса: »да грехе наше узме«: да нас ослободи безакоња и страшне силе његове. Једино што у нама није од Бога јесу греси; они нам и спречавају да општимо са Богом, да видимо Бога, да познамо Бога. Зато се Бог Логос и јавио »да грехе наше узме«, и тако нам омогући да познамо Бога, да Га видимо, да општимо са Њим. Греси су једина човекоубилачка сила; да није њих, човек би био сав бесмртан. Они усмрћују и осмрћују све што је људско. Како их онда Господ Христос може »узети«, а да се не огрехови, не усмрти и осмрти. Тако, што је без греха: »греха у њему нема«. Зато грех не може разлити по бићу његовом своју човекоубилачку силу: смрт. Грех је жалац смрти; чим убоде човека, он разлије по њему отров смрти. Он то није могао учинити са Богочовеком, јер је својом савршеном светлошћу јачи од сваког греха и силе његове. У Богочовеку нема безакоња, јер нема греха. То је прави човек: сав у закону Божјем – сав у Божанској Љубави, Истини, Правди, Доброти, Мудрости и осталим Божанским Савршенствима.'
        cn: 你们也知道，他曾显现，为要除掉我们的罪；在他并没有罪（οὐκ ἔστι）。上帝道（Logos）道成肉身的目标是：「为要除掉我们的罪」，即是要使我们脱离不法之事及其可怕的权势。在我们里面，唯一不属于上帝的，就是罪；它们也阻碍我们与上帝相交，看见上帝，认识上帝。因此，上帝道（Logos）显现，「为要除掉我们的罪」，并以此使我们能够认识上帝，看见他，与他相交。罪是唯一致人死命的力量；若没有它们，人就会全然不朽。它们致死并朽坏一切属人的东西。那么，主基督如何能「除掉」它们，而不受罪玷污，不被致死和朽坏呢？这就是因为他是无罪的：「在他并没有罪」。因此，罪无法将它致人死命的力量——死亡——倾注到他的存有之中。罪是死亡的毒钩；它一旦刺入人，就会将死亡的毒液倾注于他。它无法对道成人身者（Theanthropos）如此行，因为他以其完美的圣光，比一切罪及其权势更强。在道成人身者（Theanthropos）中没有不法之事，因为没有罪。这就是真正的人：全然处于上帝的律法之中——全然处于神圣的爱、真理、公义、良善、智慧以及其他神圣的完美之中。
    - type: paragraph
      text:
        ru: '3:6'
        cn: '3:6'
    - type: paragraph
      text:
        ru: '"Који год у њему обитава – ὁ ἐν αὐτῷ μένων -, не греши», јер му даје своје божанске силе које га чувају од греха. Он је дошао у наш свет, не да остане усамљен у својој праведности и светости, него да их и нама додели, дa, саопшти. Постао је човек, да би све то предао човеку, људима. Постао је тело, и то – Богочовечанско тело: Црква, да би све саоваплотио себи, унео у себе, учланио у тело своје, накалемио на себе као лозе на Чокот, Божански Чокот. Отуда и све његове божанске силе, ти животворни сокови светости, љубави, правде, доброте, мудрости, кротости, смирености струје из Њега кроз све лозе, кроз све «који год у Њему стоје», обитавају. «У Њему обитава» ко у Божанској Љубави обитава, у Божанској Доброти = у Еванђељу Његовом. Ко обитава: ὁ μένων = борави, стоји, живи у Њему и Њиме – «не греши». Јер се у Њему борави помоћу светости, која неће грех, одгони га, убија га. А светост није друго до живот у вери, у љубави, у молитви, у посту, у правди, и осталим врлинама. «Који год греши, не виде га, нити га позна – οὐχ ἑώρακεν, αὐτὸν[6]οὐδὲ ἔγνωκεν αὐτόν."'
        cn: 「凡住在他里面的——ὁ ἐν αὐτῷ μένων——就不犯罪，」因为他赐予他神圣的力量，保守他脱离罪恶。他来到我们的世界，不是要独自留在他的公义和圣洁中，而是要将它们也分赐给我们，是的，宣示给我们。他成了人，为要把这一切都传给个人，传给众人。他成了身体，而且——是神人性的身体：教会，为要把一切都与他一同道成肉身，纳入自身，使其成为他身体的一部分，像葡萄枝子嫁接到葡萄树上、神圣的葡萄树上那样，嫁接到自己身上。因此，他一切神圣的力量，那些生命之源泉，即圣洁、爱、公义、良善、智慧、温柔、谦卑的汁液，从他那里流出，流经所有的枝子，流经所有「住在他里面」的人，所有居住的人。「住在他里面」的，是那些住在神圣的爱里的人，住在神圣的良善里的人，即住在他的福音里的人。谁住在里面：ὁ μένων——即是：居留、站立、活在他里面并靠他而活——「就不犯罪」。因为住在他里面是借助圣洁，这圣洁不悦纳罪，驱逐它，杀死它。而圣洁无非是在信仰、爱、祷告、禁食、公义以及其他美德中的生命。「凡犯罪的，就没有看见他，也没有认识他——οὐχ ἑώρακεν, αὐτὸν[6]οὐδὲ ἔγνωκεν αὐτόν。」
    - type: paragraph
      text:
        ru: 'Грех је жива тама, жива тамна сила која не да човеку да види Бога и Божје, Христа и Христово, и да Га позна. Грех држи човека у незнабоштву, у безбоштву. Он је сила која обезбожује, онезнабожује. Он не зна Бога, и не признаје Бога: без Бога је: »нема Бога«. Да, нема Бога у греху; он се стога и труди да и свима људима докаже како «нема Бога», и да им то сазнање и убеђење наметне. «Чисти срцем» виде Бога, нечисти Га не виде, нити познају. Грех квари, разара, умртвљује душу, ум, срце, сав човеков инструментаријум осећања и сазнања, те човек нити осећа Бога, нити Га види, нити познаје. Значи: познање Бога је чисто морални плод, етички подвиг и процес. Због живљења у греху човек не види и не зна Бога: незнабожац је, безбожник је: «Који год греши – не види, не зна» ни Бога ни Божје. Значи: за здраво сазнање и осећање, и расуђивање неопходно је најпре морално оздравити. А човек морално оздрављује када творењем светих врлина исцељује себе од сверазорне моралне болести: греха. За правилно и нормално мишљење нужна је морална чистота: «као и Он што је чист»; а она се постиже светим еванђелским животом.'
        cn: 罪是活生生的黑暗，是活生生的黑暗势力，不让人看见上帝和属于上帝的事物，看见基督和属于基督的事物，也不让人认识祂。罪使人停留在不认识上帝的状态中，停留在不敬虔的状态中。它是一种使人远离上帝、使人陷入不认识上帝境地的力量。它不认识上帝，也不承认上帝：它是没有上帝的：「没有上帝」。是的，罪中没有上帝；因此它也竭力向所有人证明「没有上帝」，并把这种认知和信念强加给他们。「清心的人」看见上帝，不洁的人看不见祂，也不认识祂。罪败坏、破坏、使灵魂、心智、心灵以及人类所有的感知和认知能力死亡，因此人既不感知上帝，也不看见祂，也不认识祂。这意味着：认识上帝是纯粹的道德果实，是伦理的功修和过程。由于活在罪中，人看不见也不知道上帝：他是不认识上帝的人，他是不敬虔的人：「凡犯罪的——既看不见，也不认识」上帝和属于上帝的事物。这意味着：为了健康的认知、感受和判断，首先必要的是道德上的痊愈。而人道德上痊愈，是当他通过实行圣洁美德，医治自己摆脱那毁灭一切的道德疾病：罪。为了正确和正常的思想，道德上的纯洁是必要的：「正如祂是洁净的」；而这要通过圣洁的福音生活来实现。
    - type: paragraph
      text:
        ru: '3:7'
        cn: '3:7'
    - type: paragraph
      text:
        ru: '"Дечице, нико да вас не вара: који правду твори – ὁ ποιῶν τὴν δικαιοσύνην, праведник је, као што је Он праведан«. Мерило правде: Богочовек. Он – савршени Праведник, зато правда у Њему. Правду зна само Праведник, јер је он и има. Људска мисао и савест не може без Христа – Праведника ни знати ни имати правду. Без Њега и изван Њега она може постојати као појам, као теорија, као апстракција. Али тек у Њему ми видимо само лице Правде, оличење, оваплоћење савршене правде. Шта је правда? – Богочовек Христос, јер је Он »правда Божја«, Он – и Његово Еванђеље. Стога, ко Еванђеље твори праведник је »као што је Он праведник«. Само се праведношћу може сазнати и познати правда. Људи постају праведници »као што је Он праведник«, јер им Он даје силе за то. А човек уноси у тај подвиг све силе своје: и срце, и душу, и ум, и снагу. Али главна је сила коју Он даје. Она чини те се човек, творећи Еванђеље Христово, срођује са Христом, и рађа од Христа Праведника: »Сваки који твори правду од Њега је рођен« (1Ин.2:29). Да, духовно срођавање са Христом, и духовно рађање од Христа бива творењем еванђелске правде.'
        cn: 「小子们，不可让人迷惑你们：行公义的——ὁ ποιῶν τὴν δικαιοσύνην，是义人，正如祂是公义的。」公义的标准：神人。祂是完美的义者，因此公义在祂里面。只有义者知道公义，因为祂也拥有公义。人的思想和良心，若没有基督——义者，既不能知道也不能拥有公义。没有祂且在祂之外，它能够作为一个概念、一种理论、一种抽象而存在。但唯独在祂里面，我们才看见公义的真面目，是完美的公义的化身、道成肉身。什么是公义？——神人基督，因为祂是「神的公义」，祂——以及祂的福音。因此，凡遵行福音的，是义人，「正如祂是义人」。唯有借着公义，才能得知并认识公义。人成为义人，「正如祂是义人」，因为祂赐予他们为此所需的力量。而人将自己所有的力量投入到这项属灵的操练中：包括心、魂、智、力。但主要的却是祂所赐予的力量。它使人，借着遵行基督的福音，与基督建立亲缘关系，并从基督——义者而生：「凡行公义的都是从祂生的」（约翰一书 2:29）。是的，与基督建立属灵的亲缘关系，并从基督而来的属灵新生，是通过遵行福音的公义而实现的。
    - type: paragraph
      text:
        ru: '3:8'
        cn: '3:8'
    - type: paragraph
      text:
        ru: 'У овом свету човек је или у духовном сродству са Богом или са ђаволом, те је по духовном пореклу свом и рођењу или од Бога или од ђавола. Творећи правду, а правда није друго до скуп свих еванђелских врлина, човек се рађа од Бога; творећи пак грех – рађа се од ђавола. »Који твори грех, од ђавола је – ἐκ τοῦ διαβόλου ἐστίν – јер ђаво греши од почетка«. И кад човек греши, он уствари ђаволом греши, јер нема греха да није од ђавола, посредно или непосредно. Кроз сваки свој грех човек се директно везује духом са ђаволом, те тако рађа од њега. Јер нема греха који није од ђавола. Сваки грех човеков је увек и ђаволов. Човек и твори грех због духовне сарадње са ђаволом. Јер је прасуштина, прасила сваког људског греха у ђаволу; а човек је само његов сарадник у томе. Ђаво ради, човек сарађује. Најочигледнији пример: Јуда Искариотски. Тек пошто је ђаво ушао у њега, они су заједнички извели најстрашнији грех у историји ове планете. Греси и јесу дела ђавоља. Свети Богослов благовести: »Зато се јави Син Божји да разори дела ђавоља«. Дела ђавола су: злоба, пакост, мржња, блуд, и остали пороци и греси од првог до последњег. Кроз све њих ђаво директно ради у човеку као у некој својој радионици (»дјелателишче диаволе«). Спас разара све те центре ђаволове делатности у човеку; уништава дела његова, а спасава човека.'
        cn: 在这个世界上，人要么与上帝有属灵的亲缘关系，要么与魔鬼有属灵的亲缘关系，因此，按其属灵的根源和出生，他要么是来自上帝，要么是来自魔鬼。实践公义——而公义不过是所有福音美德的集合——人就由上帝而生；然而实践罪恶——他就由魔鬼而生。「凡犯罪的，是出于魔鬼——ἐκ τοῦ διαβόλου ἐστίν——因为魔鬼从起初就犯罪。」当人犯罪时，他实际上是靠魔鬼犯罪，因为没有哪种罪恶不是来自魔鬼的，无论是间接还是直接。通过他的每一个罪，人在灵性上直接与魔鬼联系，从而由它而生。因为没有哪种罪恶不是来自魔鬼的。人的每一个罪恶也总是魔鬼的。人之所以犯罪，是因为与魔鬼有属灵上的合作。因为所有人类罪恶的本源、原始力量都在魔鬼那里；而人只是魔鬼在这方面的合作者。魔鬼行动，人则合作。最明显的例子是：加略人犹大。直到魔鬼进入他里面，他们才共同犯下了这个星球历史上最可怕的罪恶。罪恶就是魔鬼的作为。圣神学家宣告说：「为此，神的儿子显现，是要除灭魔鬼的作为。」魔鬼的作为是：恶意、恶毒、仇恨、淫乱，以及从第一个到最后一个的所有其他邪恶和罪恶。通过所有这些，魔鬼直接在人里面作工，就像在它自己的某个作坊里（「дјелателишче диаволе」）。救主摧毁了魔鬼在人里面所有那些活动的中心；摧毁了它的作为，而拯救了人。
    - type: paragraph
      text:
        ru: '3:9'
        cn: '3:9'
    - type: paragraph
      text:
        ru: '"Који год је рођен до Бога не чини греха, јер његово семе стоји у њему – σπέρμα αὐτοῦ ἐν αὐτῷ μένει -, и не може грешити, јер је рођен од Бога». Творећи врлине човек се рађа од Бога, твори ли љубав, он се рађа од Бога, јер љубав изгони из њега мржњу, те је он не чини («не чини греха»); тако се рађа од Бога помоћу осталих светих тајни и светих врлина, које све изгоне грехе, сатиру их, те их човек не чини. Првобитно «семе Божје» налази се у боголикости душе, ума, воље људске. Но нарочито се много семена Божјег посеје у човеку кроз свете тајне и свете врлине еванђелске. Свете тајне и свете врлине и јесу «семе Божје» у човеку, које кроз дела клија, расте и сазрева. Пример: свето Причешће – семе Божје, у коме сав Богочовек; човеков је подвиг да то семе узрасте кроз цело биће своје, кроз све мисли, кроз сва осећања, кроз целокупну природу своју, да прожме сву душу, све срце, сав ум, сву снагу своју ревносном и неуморном делатношћу еванђелском. Негујући еванђелске врлине у себи, човек «семе» њихово води од клијања до потпуне зрелости, до рода врлина, и при томе уништава у себи сваки грех и силу греховну – «и не може грешити". "Не може грешити», јер је рођен од Бога: сав припада Богу, и свим се бићем рађа непрестано од Бога: свака његова мисао рађа се од Бога и преображава у богомисао, свако осећање – у богоосећање, свако дело – у богодело. «Не може грешити» зато што неће; а неће зато што сву вољу своју (1Ин.5:18), сва хтења њена, непрестано рађа, изводи из Бога, преображавајући их у богохтења, у боговољу. За богорођаног човека сасвим је природно и логично чинити оно што је Божје; као што је опет за ђаворођеног човека природно и логично чинити оно што је ђавоље.'
        cn: 「凡从神生的，就不犯罪，因为他的种子存在他里面——σπέρμα αὐτοῦ ἐν αὐτῷ μένει——他不能犯罪，因为他是从神生的。」人若行美德，便是从神而生；若实行爱，他便是从神而生，因为爱将仇恨从他里面驱逐出去，以致他不再行仇恨（「不犯罪」）；同样，人也借着其余的圣事和圣美德从神而生，这些圣事和圣美德都能驱逐罪恶，将其摧毁，使人不再犯罪。最初的「神的种子」存在于人灵魂、心智和意志的肖神性中。然而，尤其通过圣事和福音的圣美德，许多神的种子被播撒在人里面。圣事和圣美德就是人里面的「神的种子」，它借着行为发芽、生长并成熟。例如：圣餐——神的种子，其中蕴含着全然的神人；人的努力在于让这颗种子通过其整个存在，通过所有的思想，通过所有的感受，通过其全部本性而生长，以热忱不倦的福音性活动渗透其全部灵魂、全部心灵、全部心智、全部力量。在自身中培育福音性美德，人将这些美德的「种子」从发芽引导至完全成熟，直至结出美德的果实，并在此过程中摧毁自身内的一切罪恶和罪恶的权势——「他就不能犯罪」。「他不能犯罪」，因为他是从神而生的：他全然属于神，并且以其整个生命不断地从神而生：他的每一个意念都是从神而生，并被转化为属神的意念；每一个情感都被转化为属神的情感；每一个行为都被转化为属神的行为。「他不能犯罪」是因为他不愿意；他不愿意是因为他将自己的全部意志（约翰一书 5:18），以及其所有的意愿，不断地从神而生、从神而出，将其转化为属神的意愿、转化为神的旨意。对于从神而生的人来说，行属神之事是完全自然和合乎逻辑的；正如对于从魔鬼而生的人来说，行属魔鬼之事是自然和合乎逻辑的。
    - type: paragraph
      text:
        ru: '3:10'
        cn: '3:10'
    - type: paragraph
      text:
        ru: '"По томе се познају деца Божја и деца ђавоља: који год не твори правде, није од Бога, и који не љуби брата свога«. По правди и љубави распознају се деца Божја у овом свету од деце ђавоље. А деца ђавоља распознају се по неправди и мржњи, по греху и безакоњу. Уствари, постоје у свету две породице: Божја и ђавоља. Сваки човек мора припадати једној од њих. Ако је пвравдољубив, припада Божјој; ако је грехољубив – ђавољој. »Није од Бога« не само који твори неправду, него и »који год не твори правде»; «није од Бога» не само који мрзи брата свога, него и «који не љуби брата свога». То је непогрешиво еванђелско богочовечанско мерило које тачно показује којој од двеју породица припада сваки човек: Божјој или ђавољој. Правда и љубав: правда као скуп свих еванђелских врлина, љубав – као божанска сила која их остварује, – и јесу ознаке деце Божје, синова Божјих у овом свету; за њих и у њима они живе, ради њих и умиру. Неправда и мржња ознаке су деце ђавоље у овом свету; за њих и у њима она живе, ради њих и умиру. Људско биће улази у породицу Божју, у царство Божије, само ако је правда његова «већа него правда књижевника и фарисеја» (Мф.5:20), тј. ако је божанска, богочовечанска, а не људска, хуманистичка, хоминистичка.'
        cn: 「凭此便可知晓上帝的儿女和魔鬼的儿女：凡不行公义的，就不是出于上帝，凡不爱他弟兄的，也不是出于上帝。」 凭着公义和爱，上帝的儿女在这世上便可从魔鬼的儿女中被分辨出来。而魔鬼的儿女，则凭着不公义和仇恨，凭着罪和不法被分辨出来。事实上，世上存在着两个家庭：上帝的家和魔鬼的家。每个人都必须属于其中一个。如果他爱公义，就属于上帝的家；如果他爱罪，就属于魔鬼的家。「不是出于上帝的」，不仅是那些行不义的人，也是那些「凡不行公义的人」；「不是出于上帝的」，不仅是那些恨他弟兄的人，也是那些「凡不爱他弟兄的人」。这是那绝无错误的福音的、神人一体的衡量标准，它精确地显示出每个人属于这两个家庭中的哪一个：上帝的还是魔鬼的。公义和爱：公义作为所有福音美德的总和，爱——作为实现这些美德的神圣力量——正是上帝儿女的标记，是世上上帝众子的标记；他们为它们而活，也在它们里面而活，也为它们而死。不公义和仇恨是这世上魔鬼儿女的标记；他们为它们而活，也在它们里面而活，也为它们而死。人类个体进入上帝的家庭，进入上帝的国度，只有当他的公义「胜于文士和法利赛人的公义」（马太福音 5:20），也就是说，如果它是神圣的，神人一体的，而不是人类的、人本主义的、以人为中心的。
    - type: paragraph
      text:
        ru: 1 Јованова 3:11–24
        cn: '约翰一书 3:11-243:11 因为这就是你们从起初就听见的信息：我们应当彼此相爱。

          3:12 不像该隐，他是属那恶者的，并且杀了他的兄弟。他为什么杀他呢？因为他自己的行为是恶的，而他兄弟的行为是义的。

          3:13 我的弟兄们，世人若恨你们，不要稀奇。

          3:14 我们知道我们已经出死入生了，因为我们爱弟兄。那不爱弟兄的，仍旧住在死中。

          3:15 凡恨他兄弟的，就是杀人犯。你们知道，凡杀人犯，没有永生住在他里面。

          3:16 我们因此就知道爱了：就是他为我们舍命。我们也当为弟兄舍命。

          3:17 凡有世上财物，看见自己的弟兄穷乏，却塞住怜恤的心，爱神的心怎能住在他里面呢？

          3:18 我的孩子们，我们不要只用言语和舌头去爱，乃要用行为和真理去爱。

          3:19 从此我们就知道我们是属真理的，并且在他面前可以安心。

          3:20 我们的心若责备我们，神比我们的心大，并且他知道一切。

          3:21 亲爱的，我们的心若不责备我们，就可以向神坦然无惧了。

          3:22 并且我们无论求什么，就能从他得着，因为我们遵守他的诫命，行他所喜悦的事。

          3:23 他的诫命就是：要我们相信他儿子耶稣基督的名，并且彼此相爱，正如他所命令我们的。

          3:24 凡遵守他诫命的，就住在他里面，他也住在那人里面。我们所以知道他住在我们里面，是因为他所赐给我们的圣灵。'
    - type: paragraph
      text:
        ru: '1Ин.3:11–24:11Јер ово је порука, коју чусте од почетка, да љубимо једни друге. 12 Не као што Каин бјеше од нечастивога и закла брата својега. А због чега га закла? Јер дјела његова бијаху зла, а брата му праведна. 13 Не чудите се, браћо моја, ако вас свијет мрзи. 14 Ми знамо да смо прешли из смрти у живот, јер љубимо браћу; јер ко не љуби брата остаје у смрти. 15 Сваки који мрзи брата својега јесте човјекоубица; а знате да ниједан човјекоубица нема вјечни живот који остаје у њему. 16 По томе смо познали љубав што Он за нас живот свој положи; и ми смо дужни полагати живот за браћу. 17 А који има богатства овога свијета, и види брата својега у невољи, и затвори срце своје од њега, како онда љубав Божија борави у њему? 18 Дјечице моја, не љубимо ријечју ни језиком, него дјелом и истином. 19 И по томе знамо да смо од истине, и успокојићемо пред њим срца своја: 20 Јер ако нас осуђује срце, Бог је већи од срца нашег и зна све. 21 Љубљени, ако нас срце наше не осуђује, смјелост имамо пред Богом; 22 И што год иштемо, примамо од њега, јер заповијести његове држимо и чинимо што је угодно њему. 23 А ово је заповијест његова: да вјерујемо у име Сина његова Исуса Христа, и да љубимо једни друге као што нам је дао заповијест. 24 И онај који држи заповијести његове у њему пребива, и Он у њему. И по томе знамо да Он пребива у нама, по Духу којега нам је дао.'
        cn: '约翰一书 3:11-24:

          11 因为你们从起初所听见的信息，就是我们当彼此相爱。12 不像该隐，他是属那恶者的，并且杀了他的兄弟。为什么杀他呢？因为他自己的行为是恶的，而他兄弟的行为是义的。13 我的弟兄们，世人若恨你们，不要希奇。14 我们知道我们是已经出死入生了，因为我们爱弟兄。凡不爱弟兄的，仍住在死中。15 凡恨他弟兄的，就是杀人的。你们知道，凡杀人的，就没有永生存在他里面。16 从此我们知道何为爱，就是主为我们舍命；我们也当为弟兄舍命。17 凡有世上财物的，看见他的弟兄穷乏，却向他关闭了怜悯的心，上帝的爱怎能住在他里面呢？18 我的孩子们哪，我们相爱，不要只在言语和舌头上，而要落在行为和真理上。19 从此我们就知道我们是属真理的，并且在他面前，我们的心可以安稳：20 因为我们的心若责备我们，上帝比我们的心大，并且他知道一切。21 亲爱的，我们的心若不责备我们，就可以在上帝面前坦然无惧了；22 并且我们无论求什么，就从他得着，因为我们遵守他的命令，并行他所喜悦的事。23 他的命令就是：要我们信他儿子耶稣基督的名，且彼此相爱，正如他所吩咐我们的。24 遵守他命令的，就住在他里面，他也住在那人里面。从此我们就知道他是住在我们里面，是借着他所赐给我们的圣灵。'
    - type: paragraph
      text:
        ru: '3:11'
        cn: '3:11'
    - type: paragraph
      text:
        ru: 'По светом Богослову, рајска заповест, празаповест, заповест ἀπ’ ἀρχῆς јесте љубав међусобна. Та љубав показује да је човек од Бога, и да су људи од Бога, по пореклу и по поновном, духовном рођењу. Нема ли човекољубља тог, онда се не може ни знати право, онтолошко, истинско порекло човека; онда се лута по тами и тражи његово порекло међу животињама, стихијама, стварима овога света. А човекољубље, а љубав активна одводи човеково осећање и сазнање Богу: и он и себе и брата кога воли види у Богу и Богом, и открива да је и његово порекло и порекло његовог брата у Богу, од Бога. Зато је заповост о љубави – празаповест, свезаповест и за Господа Христа. По самој природи својој љубав је логосна, божанска; а и човек је по природи својој логосан, боголик; зато је и та божанска, логосна, богочовечанска љубав за њега нешто конгенијално, сродно, природно. А Бог Логос је и постао човек, да би показао сву ту сродност између Бога и човека, то јединство при свој разноликости природа и бића. Ако је реч о роду људском, онда је «заповест да љубимо један другога" "од почетка» самог рода људског. Ако је реч о новом човечанству, о човечанству Христовом, о богочовечанству, онда је опет та заповест «од почетка». И то све зато, да бисмо били свесни овога божанског порекла, јер «није од Бога који не љуби брата свога» (1Ин.3:10). Љуби ли брата свога, човек одмах осети да су и он и брат његов «од Бога». Стога и поступа са братом својим божански, јер љубав и јесте божанско поступање љубећег са љубљеним. Мрзи ли човек брата свога, изгубио је осећање и сазнање и о његовоме божанском пореклу, те и себе, па и душу своју, изводи, свесно или несвесно, од ђавола, јер «који год твори грех – од ђавола је" (1Ин.3:8).'
        cn: '根据圣神学家所言，天国的诫命、太初的诫命、以及始自太初的诫命（ἀπ』 ἀρχῆς），便是彼此之爱。这爱显明人源自上帝，世人亦皆源自上帝，无论就其本源而言，或就其重生的属灵生命而言。若无此种仁爱，便无法得知人类真正、本体论上、真实的本源；如此便在黑暗中游荡，在其本源上将其归于动物、诸元素以及此世之物。然而，仁爱，即实践的爱，将人的感受与认知引向上帝：他既在上帝里面，也透过上帝，看见自己和所爱的弟兄，并发现他自己的本源和他弟兄的本源都在上帝里面，源自上帝。因此，关于爱的诫命便是——太初诫命，总括一切的诫命，乃至主基督的诫命。


          爱就其本质而言，是具道性、神圣的；而人就其本质而言，亦是具道性、肖乎神的；因此，这份神圣的、具道性的、神人性的爱，于他而言，是性情相投、亲近、自然而然的。圣言者上帝亦道成肉身，为要显明上帝与人之间所有的亲近，那在诸性情和诸存有之多样性中的合一。若论及人类，那么「要彼此相爱」的诫命，「始自太初」，即自人类本身之太初。若论及新人类，基督的人类，即神人性的群体，那么这诫命也再次是「始自太初」的。所有这一切，都是为使我们能意识到这神圣的本源，因为「凡不爱他弟兄的，就不是出于上帝」（约翰一书 3:10）。人若爱他的弟兄，便立刻感受到他与他的弟兄都「是出于上帝的」。因此，他亦以神圣的方式对待他的弟兄，因为爱正是爱者与被爱者之间神圣的作为。人若恨他的弟兄，便失去了对其神圣本源的感受与认知，他便自觉或不自觉地将自己，甚至自己的灵魂，归结于魔鬼，因为「凡犯罪的是属魔鬼」（约翰一书 3:8）。'
    - type: paragraph
      text:
        ru: '3:12'
        cn: '3:12'
    - type: paragraph
      text:
        ru: 'Такав човек не сматра ни себе ни људе за створења Божја, за децу Божју, стога и поступа с њима као са маловредносним или безвредносним бићима, а често их и лако уништава. Пример: Каин. Заклао невиног брата, јер му мржња помрачила духовни вид, те у своме брату није видео ни свога брата по телу ни свога божанског сабрата по духу. Пореклом од ђавола, мржња га је и сродила с ђаволом, и духовно породила од ђавола, те је све мисли и хтења изводио из ђавоље лабораторије зла. Отуда је против свег Божјег у брату свом: најпре против праведности његове. И он убија невиног брата свог: »јер дела његова беху зла, а брата му праведна«. Зло је постало не само главна стваралачка сила његовог сазнања и логике, него и врховни критериј свега, отуда је Каин свесни убица, убица са »разумских", "логичких« разлога: свесни братоубица, а тиме и богоубица. Јер хоће да убије оно што је од Бога у његовом брату: праведност његову, »праведна дела« његова. Нико као свети Богослов није тако јасно и свеобухватно осећао и сагледао да се све у нашим људским световима своди на два праизвора, на два праначела: Бога и ђавола. Сва добра у нашем човечанском свету имају свој праизвор у Богу, а сва зла – у ђаволу. Продужено до краја, свако добро одводи Богу; продужено до краја, свако зло одводи ђаволу. Кроз своја »зла дела« Каин је претворио зло у своју навику, у своју природу, у своју логику; и то га је ородило и сродило са Злим, са ђаволом. Тако је он добровољно родио себе духовно од ђавола, постао «дете ђавола». Насупрот томе, кроз добра дела човек претвара добро у своју навику, у своју природу, у своју логику, у свој карактер; и то га орођује и срођује са Добрим, са Богом. На тај начин човек се добровољно рађа духовно од Бога, постаје «дете Божје», Син Божји.'
        cn: 这样的人不把自身或他人看作是神的受造物，是神的儿女，因此就对待他们如同低价值或无价值的生命，而且常常轻易地毁灭他们。例子：该隐。他屠杀了无辜的兄弟，因为仇恨蒙蔽了他的属灵视力，使得他在自己的兄弟身上既没有看到他肉身的兄弟，也没有看到他在灵里的神圣弟兄。仇恨源于魔鬼，它使他与魔鬼有了亲缘关系，并在灵里由魔鬼而生，于是他所有的思想和意愿都出自魔鬼的邪恶实验室。因此，他反对他兄弟身上所有属神的一切：首先是反对他的公义。他杀害了他无辜的兄弟：「因为他自己的行为是恶的，他兄弟的行为是义的。」邪恶不仅成为他认知和逻辑的主要创造力，而且也成为衡量一切的最高标准，因此该隐是一个有意识的杀人犯，一个基于「理性的」、「逻辑的」原因而杀人的人：一个有意识的弑兄弟者，也因此是一个弑神者。因为他想要杀死在他兄弟身上属神的一切：他的公义，他的「公义的行为」。没有人像圣神学家那样，如此清晰而全面地感受到并洞察到，在我们人类的世界中，一切都归结为两个原始源头，两个原始原则：神和魔鬼。在我们人类世界中的所有良善都源于神，而所有的邪恶都源于魔鬼。推至极致，每一个良善都引向神；推至极致，每一个邪恶都引向魔鬼。通过他的「邪恶行为」，该隐将邪恶转化为他的习惯、他的本性、他的逻辑；这使他与那恶者，与魔鬼有了亲缘关系。这样，他自愿地在灵里由魔鬼而生，成为了「魔鬼的儿女」。与此相反，通过善行，人将良善转化为自己的习惯、自己的本性、自己的逻辑、自己的品格；这使他与那良善者，与神有了亲缘关系。这样，人就自愿地在灵里由神而生，成为了「神的儿女」，神的儿子。
    - type: paragraph
      text:
        ru: '3:13'
        cn: '3:13'
    - type: paragraph
      text:
        ru: '"Не чудите се, браћо моја, ако свет мрзи на вас«, мрзи без разлога као и Каин брата свог. Или боље: мрзи свесно, са свесних разлога, јер су дела његова зла, а ваша праведна. Зло је тиме зло што мрзи на све што је добро, и хоће да га уништи. Јер је крајња жеља зла: да не буде добра. У природи је зла бити увек противник добра. Јер је у природи ђавола бити увек противник Бога. Јер чим би то престао бити, ђаво би престао бити ђаво, и зло – зло. Зато свети Богослов вели: »Не чудите се«, што зло мрзи на добро, и неправедник на праведника, јер је то у самој природи и у самој логици зла. Свет је усвојио зло као метод свога живота (modus vivendi); а логику зла прогласио за метод мишљења (modus cognoscendi), и онда – за мерило свега и свачега. То је разлог што свет мрзи на све што је добро, праведно, божанско, еванђелско, богочовечанско: »на вас« који сте оваплоћење, оличење тога. Иако сте у овом свету, ви сте од оног света, од Бога, од Христа.'
        cn: 弟兄们，如果世人恨你们，不要觉得希奇，它像该隐无缘无故地恨他的兄弟一样。或者更确切地说：它带着自觉的意识，有自觉的理由去恨，因为它（世人）的行为是邪恶的，而你们的行为是公义的。邪恶之所以是邪恶，就在于它恨恶一切良善，并想要将其毁灭。因为邪恶的终极渴望就是：不让良善存在。邪恶的本性就是永远与良善为敌。因为魔鬼的本性就是永远与上帝为敌。因为一旦它不再是这样，魔鬼就不再是魔鬼，邪恶也就不再是邪恶。因此，圣神学家说：「不要觉得希奇」，邪恶恨恶良善，不义之人恨恶义人，因为这正是在邪恶的本质和其内在逻辑之中。世人已经将邪恶视为其生活方式（modus vivendi）；并将邪恶的逻辑宣称为其认知方式（modus cognoscendi），然后——将其视为衡量一切事物的标准。这就是世人恨恶一切良善、公义、神圣、福音性、神人性的原因：「恨你们」这些道成肉身、体现这一切的人。尽管你们身处这个世界，但你们是属于那个世界的，属于上帝，属于基督。
    - type: paragraph
      text:
        ru: '3:14'
        cn: '3:14'
    - type: paragraph
      text:
        ru: '"Ми знамо да пређосмо из смрти у живот, јер љубимо браћу». – Ето васцеле тајне хришћанске: љубављу се прелази из смрти у живот бесмртни и вечни. Љубав је једини мост преко провалије смрти из овог у онај свет, из овог привременог у вечни живот. По природи својој богочовечанска љубав је вечна; сва је од Вечнога; из Њега и црпе силу којом обесмрћује, овечнује. Љубав силом Бесмртнога савлађује све смрти и уводи у живот вечни. Њоме се уствари васкрсава из духовне смрти, из грехољубља, и оживљује за Бога и живи Богу. Хришћани љубављу постају «мртви греху а живи Богу у Христу Исусу Господу нашем" (Рим.6:11). "Ми знамо», ми смо свесни да смо прешли из смрти у живот, тј. да смо бесмртни и вечни. Хришћани имају ново осећање и себе и браће, ново сазнање: осећају и себе и браћу као бесмртна и вечна бића. То испуњује њихово срце божанском радошћу, јер је еванђелска љубав сила која живот претвара у божанску радост. Зар има веће радости од ове: осећати и знати да је биће које волиш – бесмртно и вечно, а и ти сам? На тај начин, једино на тај начин живот престаје бити терет, очајање, проклетство, и постаје благослов, усхићење, блаженство. «Ми знамо» тајну смрти и живота, јер савладасмо смрт и уђосмо у живот божанском љубављу. Љубав нас најпре сједини са Богом, који је извор свеживота, па онда са браћом која су такође вечна у Богу.'
        cn: '「我们知道我们已经出死入生了，因为我们爱弟兄。」——这就是基督信仰的全部奥秘：藉着爱，人便从死亡进入不朽的永生。爱是跨越死亡深渊、从此世到彼世、从这暂时的生命到永恒生命的唯一桥梁。按其本性，神人两性的爱是永恒的；它全然源于那永恒者；也从中汲取使万物不朽、使万物永恒的力量。爱藉着那不朽者的力量，战胜一切死亡，并引入永恒的生命。实际上，藉着爱，人便从属灵的死亡，从对罪的贪恋中复活，并为神而活，向神而生。基督徒藉着爱，成为「向罪是死的，向神在我们的主基督耶稣里却是活的」（罗马书 6:11）。


          「我们知道」，我们意识到自己已经出死入生了，也就是说，我们是不朽的、永恒的。基督徒对自身和弟兄都有一种新的感受、新的认知：他们感觉到自己和弟兄都是不朽而永恒的生命体。这使他们的心充满神圣的喜乐，因为福音之爱是能将生命转化为神圣喜乐的力量。岂有比这更大的喜乐吗：感觉到并知道你所爱的生命体——和你自己——都是不朽而永恒的？如此一来，也唯有如此，生命才不再是重担、绝望、咒诅，而成为祝福、狂喜、至福。「我们知道」死亡与生命的奥秘，因为我们藉着神圣的爱战胜了死亡，进入了生命。爱首先使我们与神联合，神是一切生命的泉源，然后又使我们与弟兄联合，他们在神里面也是永恒的。'
    - type: paragraph
      text:
        ru: 'Ван љубави је смрт, мртвило, смртност: «јер ко не љуби брата остаје у смрти – μένει ἐν τῷ θανάτῳ». Зашто? Зато што једино љубав разбија тамннцу себичности, изводи душу из саможивости, и самозатворености, из себичне усамљености, и доводи у везу са братом, као живим бићем, као носиоцем живота. «Ко не љуби – остаје у смрти», у себичним, уским, пролазним осећањима, мислима, расположењима, увек затворен у себе, у тамницу своје себичности, саможивости, због чега и трули душа у њему, труле мисли, труле осећања, и умиру, умиру, умиру. И он сав заудара на смрт: «smells of mortalitу». Душа која «остаје у смрти» заудара на смрт; тако и све њене мисли, осећања, жеље, расположења. Из те свеосмрћености само божанска љубав васкрсава душу и преводи је у живот вечни. Тада сва душа замирише бесмртношћу. Једино љубав мирише на бесмртност, јер мирише на Бога. Живећи еванђелском љубављу, хришћани постају «Христов мирис Богу», јер Господ Христос, који је сав – Љубав, сав мирише на бесмртност, на љубав којом бесмртност постоји и живи. Стога свети Апостол благовести: «Ми смо Христов мирис Богу» (2Кор.2:15). Љубав – победитељ смрти; љубав – спаситељ од смрти. Љубави, како ти је име, ако не Христос? Јер Он и јесте победитељ смрти, који љубављу побеђује смрт у људима. Љубав обесмрћује људско биће, јер га испуњује божанским животом. Она: обожујућа, боготворећа сила. Хоћеш ли да се осетиш бесмртан у овом свету? – Љуби браћу; љуби људе као браћу. У томе се и састоји истинска радост живота, радост коју нико не може одузети човеку ни у овом ни у оном свету: «радости ваше нико неће узети од вас» (Ин.16:22). – «Остаје у смрти»: остаје у ономе што смрти претходи и смрт произвади. А то су греси; и у њима пакао; и у паклу ђаво. Јер он упорно и непрестано тарди: смрт је нешто природно и логично, нешто са чим се треба помирити, са чим се не треба борити, јер је смрт – природни закон, неопходност. – А хришћанин је сав на супротној страни: он љубављу савлађује смрт, и све њене претече, произвођаче и пратиоце: грехе, ђаволе и пакао. Јер љубав је свеврлина; као «прва и највећа» врлина она живи и постоји кроз остале свете врлине: молитву, пост, кротост, смерност, трпљење, милостивост, и др. Стога који љуби брата, он се и моли за њега, и пости за њега, и милостив је према њему, и кротак, и смеран, и трпељив. Тако љубав помоћу свих тих врлина савлађује у човеку све што је смртно, тј. греховно, демонско, зло.'
        cn: 离开了爱，就是死亡、死寂、必朽：「因为那不爱他弟兄的，是住在死里——μένει ἐν τῷ θανάτῳ。」为什么？因为唯有爱能打破自私的牢笼，将灵魂从自我中心、自我封闭、自私的孤独中引出，使其与弟兄——一个活生生的存在，一个生命的承载者——建立联系。「那不爱的人——是住在死里」，住在自私的、狭隘的、短暂的情感、思想、情绪中，总是封闭在自身里，封闭在他自私、自我中心的牢笼中，正因为如此，他的灵魂在他里面腐烂，思想腐烂，情感腐烂，并死去，死去，死去。而他整个人都散发着死亡的气味：「smells of mortalitу」。灵魂若「住在死里」就会散发着死亡的气味；它所有的思想、情感、愿望、情绪也是如此。从那全然的死亡之中，唯有神圣之爱能使灵魂复活，并将其带入永生。那时，整个灵魂都散发着不朽的芬芳。唯有爱散发着不朽的芬芳，因为它散发着神的芬芳。基督徒借着福音的爱而生活，就成为「基督献给神的馨香」，因为主基督——祂全然是爱——全然散发着不朽的芬芳，散发着那使不朽得以存在和活着的爱的芬芳。因此圣使徒宣告：「因为我们是在神面前基督馨香之气」（哥林多后书 2:15）。爱——是死亡的胜利者；爱——是死亡的救主。爱啊，你的名字若不是基督，那会是什么呢？因为祂确实是死亡的胜利者，祂以爱战胜了人心中的死亡。爱使人类不朽，因为它使人充满神圣的生命。她：是使人成神的力量，使人敬拜神的力量。你想在此世感受不朽吗？——爱你的弟兄；爱世人如同爱弟兄。真正的生命喜乐也就在于此，这种喜乐，无人能从人身上夺去，无论是在今世还是在来世：「你们的喜乐没有人能夺去」（约翰福音 16:22）。——「住在死里」：是住在那些先于死亡并产生死亡的事物中。而这些就是罪；在罪中有地狱；在地狱中有魔鬼。因为他顽固而持续地坚持：死亡是自然而合乎逻辑的，是必须接受、不必与之抗争的，因为死亡——是自然法则，是必然。——而基督徒则全然站在对立面：他以爱战胜死亡，以及所有它的前奏、制造者和伴随者：罪、魔鬼和地狱。因为爱是万德之首；作为「首要和最大」的美德，它通过其他圣洁的美德而存在和彰显：祷告、禁食、温柔、谦卑、忍耐、怜悯，等等。因此，那爱弟兄的，也会为他祷告，为他禁食，对他施怜悯，待他温柔、谦卑、忍耐。如此，爱借着所有这些美德，战胜人里面一切属于必死的，即：罪恶的、魔鬼的、邪恶的事物。
    - type: paragraph
      text:
        ru: '3:15'
