        ru: 5:11–12
        cn: 5:11–12
    - type: paragraph
      text:
        ru: '"И ово је сведочанство, да нам је Бог дао живот вечни; и овај живот вечни у Сину је његовом. Ко има Сина Божјег, има живот; ко нема Сина Божјег, нема живота«. – Сва благовест о животу је у овим речима; и у њој – сва сведочанства сажета у једно сведочанство. Доказ да је Исус – Бог и Спаситељ јесте у томе што је роду људском дао живот вечни. Уништио смрт и дао живот вечни. Јер живот вечни који Он даје и јесте доказ и сведочанство да је смрт заиста побеђена, уништена, разорена. У Богочовеку нема смрти, нема греха, јер је у Њему живот вечни. Док не поверује у Господа Христа, човек је стално у смрти, мртвује, мртав је за све што сачињава прави живот. Тек са вером у Њега човек оживи, просто васкрсне из мртвих, и осети божанску радост живота, божанску осмишљеност и циљност живота. Дотле, човек нити зна шта је живот уствари, нити схвата његову божанску вредност. »И овај живот вечни у Сину је његовом«, да би га човек осетио, треба да буде »у Сину Божјем«, унутра у његовом Богочовечанском бићу, у Цркви, као сутелесник, као ћелијица жива и њиме храњена. Ван Њега, ван Цркве – све сама смрт, све сами мртваци: царство смрти, греха и ђавола. Док човек не стекне живо осећање Богочовека Христа, он и нема живота и не зна шта је уствари живот. Само живо осећање Бога сведочи човеку да је заиста жив. То се осећање стиче вером у Господа Христа, а усавршава се љубављу и осталим светим врлинама, усавршава и преображава у вечно осећање вечнога живота. Такав човек у сваком тренутку свога земаљског живота осећа да је вечан, да је пун вечнога живота, стога и побеђује све што је смртно и што вуче у смрт. Хоћеш да знаш, јеси ли жив или мртав, пре смрти мртав, можеш лако проверити: ако верујеш у Христа Бога, жив си; не верујеш ли – мртав си. Немаш ли Христа Бога у души, мртав си најкобнијим мртвилом, па ма сматрао ти себе бесмртним; на тебе се онда с правом може применити она прекорна реч апокалиптичка: »имаш име да си жив, а мртав си" (Откр.3:1).'
        cn: 「这便是见证，神已赐给我们永生；这永生是在祂的圣子里面。拥有神子者，便拥有生命；没有神子者，便没有生命。」——关于生命的一切福音皆在于这番话语之中；而在这番话语里，一切见证都浓缩成了一个见证。耶稣是神与救主的证明，在于祂赐予人类永生。祂毁灭了死亡，并赐予了永生。因为祂所赐的永生，正是死亡确已被战胜、被毁灭、被摧毁的证明与见证。在神人之中没有死亡，没有罪，因为在祂里面有永生。在人相信主基督之前，他始终处于死亡之中，如同行尸走肉，对构成真正生命的一切都是死的。唯有凭着对祂的信仰，人才能活过来，简直是从死里复活，感受到生命的神圣喜悦、神圣意义和目的。在此之前，人既不知道生命究竟是什么，也不明白其神圣价值。「这永生是在祂的圣子里面」，为了让人感受到它，人就必须「在神子里面」，深入祂的神人合一的存有之中，在教会里，作为同体肢体，作为被祂滋养的活细胞。在祂之外，在教会之外——尽是死亡，尽是死人：死亡、罪和魔鬼的国度。除非人获得对神人基督的鲜活感受，否则他既没有生命，也不知道生命究竟是什么。唯有对神的鲜活感受，才能向人证明他确实是活着的。这种感受是借着对主基督的信仰而获得的，并借着爱与其他圣洁美德得以完善，它完善并转化成为对永恒生命的永恒感受。这样的人在世俗生命的每个时刻，都感受到自己是永恒的，充满永恒的生命，因此也战胜了一切属乎死亡和牵引人走向死亡的事物。你若想知道自己是活是死，是否在死前已是死人，可以轻易验证：如果你信仰基督神，你便是活的；若不信——你便是死的。你若灵魂中没有基督神，你便陷于最致命的死亡，即便你自认为是不朽的；那么，那句启示录中带有斥责意味的话语便可正当地适用于你：「你按名是活的，其实是死的。」 (启示录 3:1)。
    - type: paragraph
      text:
        ru: '5:13'
        cn: '5:13'
    - type: paragraph
      text:
        ru: '"Ово – ταῦτα – писах вама који верујете у име Сина Божјега, да знате да имате живот вечни, и да верујете у име Сина Божјег«. – Најважније је знати, да веровати у Христа значи: имати живот вечни. То је прво и најглавније сазнање сваког хришћанина. Верујем, и зато имам живот вечни. Имам живот вечни, јер верујем. Из тог сазнања рађа се неустрашивост и исповедништво вере, готовост на сваку жртву за Христа, трпљење и радосно страдање за Христа. То сазнање постаје руководно, и то врховно руководно морално начело хришћанину. Он све и сва нормира и регулише њиме. Он осећа и зна да је врховна брига његова: стицати живот вечни сваким осећањем, сваком мишљу, сваким поступком, сваким делом. А то сачињава непрекидни подвиг, непрекидно доживљавање еванђелских врлина, непрекидно прерађивање себе у све новијег и новијег, у све бољег и бољег човека, гледајући увек на Оснивача и Завршитеља наше вере, Господа Исуса, и његове свете трудбенике и следбенике (ср.Евр.12:1–4). Тада се увек има у виду онај еванђелски ратни поклич, и правило: »Бори се у доброј борби вере, мучи се за вечни живот на који си и позван« (1Тим.6:12). Хришћанин си, твој је позив – стећи живот вечни, борити се даноноћно за живот вечни; ради тога треба с радошћу поднети сваку муку, сваку тегобу, сваки подвиг. »Јер наша лака садашња брига доноси нам вечну и од свега претежнију славу« (2Кор.4:17), нама који гледамо на вечно и тражимо оно што је вечно, јер је наш главни циљ: живот вечни (ср.2Кор.4:18).'
        cn: 「我将这些 – ταῦτα – 写给你们信奉上帝儿子之名的人，使你们知道自己有永生，并且使你们继续信奉上帝儿子之名。」 – 最重要的是要知道，相信基督意味着：拥有永生。这是每一位基督徒首要且最重要的认知。我信，因此我拥有永生。我拥有永生，因为我信。从这一认知中诞生了无畏和信仰的告白，为基督献上一切牺牲的准备，以及为基督忍受苦难和乐意受难。这一认知成为指导性的，并且是基督徒至高无上的指导性道德原则。他用它来规范和调整所有事物。他感受并知道他最高的关切是：通过每一个感受、每一个思想、每一个行为、每一个行动来获取永生。而这构成了不间断的苦修，不间断地体验福音的美德，不间断地将自己重塑成一个更新更好的人，始终仰望我们信心的创始者与成终者——主耶稣，以及祂的圣徒劳苦者和追随者 (参希伯来书 12:1-4)。那时，他心中常存那福音的战斗口号和法则：「要为信仰打那美好的仗，竭力争取永生，你为此蒙召」 (提摩太前书 6:12)。你是基督徒，你的呼召是——获取永生，日夜为永生而战；为此，应以喜乐之心忍受一切痛苦、一切艰难、一切苦修。「因为我们这短暂而轻微的苦楚，要为我们成就极重无比、永远的荣耀」 (哥林多后书 4:17)，我们这些仰望永恒并寻求永恒事物的人，因为我们主要的目标是：永生 (参哥林多后书 4:18)。
    - type: paragraph
      text:
        ru: '5:14'
        cn: '5:14'
    - type: paragraph
      text:
        ru: '"И ово је слобода коју имамо к њему да ако што молимо по вољи његовој (κατὰ τὸ θέλημα αὐτοῦ), послуша нас». – Истинска је слобода људска у слободи Божјој, тј. када је сва у тој слободи Божјој; онда је и бескрајна, и спасоносна, и свекорисна. Њени су оквири: «али не како ја хоћу него како Ти; нека буде воља твоја» (Мф.26:39–42). Шта је воља Божја према нама људима? – Да вером у Сина Божјег стекнемо живот вечни. Та је воља Божја потпуно и савршено изражена у Богочовеку Христу, Његовом Еванђељу, Његовом делу спасења (Еф.1:9–10). Стога је наша слобода у томе да молимо оно што је Христово, еванђелско, и – добијемо од Бога. Јер би била не слобода већ безочност и слепо робовање греху молити од Бога оно што је нееванђелско, и очекивати да нам Он то испуни. На крају крајева, то би значило, хтети и Бога учинити саучесником у нашем греху, и приволети Га на наше грехољубље. Разлог што многе молитве наше Господ свеблаги и свезнајући не испуњује јесте у томе што нису «по вољи Његовој». Услов да буду испуњене молбе наше јесте: да буду «по вољи Његовој». Могло би се као правило поставити: Ишти оно што је по вољи Божјој, и добићеш. А по вољи Божјој је оно што је од Еванђеља и у сагласности с Еванђељем. Тиме је слободи људској осигурано кретање и живљење у бескрајном Добру Божјем, у бескрајној Истини Божјој, у бескрајној Правди Божјој, речју: у свима бескрајностима Божјим. А то је и најсавршенија и најслађа сдобода. Све је остало, посредно и непосредно, робовање греху, смрти, ђаволу, злу.'
        cn: 「我们向他所存的坦然无惧，就是如果我们照他的旨意（κατὰ τὸ θέλημα αὐτοῦ）求什么，他就听我们。」——人的真正自由在于神的自由之中，即当人完全处于神的自由之中时；这自由便是无限的、救赎性的、且有益于一切的。这自由的范畴是：「然而，不要照我的意思，只要照你的意思；愿你的旨意成就。」（马太福音 26:39-42）神对我们人类的旨意是什么？——乃是藉着信靠神的儿子，使我们获得永生。这神的旨意已然完全且完美地表达在神人基督里，在他的福音里，在他的救赎工作里。（以弗所书 1:9-10）因此，我们的自由在于祈求那些属基督的、合乎福音的事物，并且——从神那里得着。因为向神祈求那些不合乎福音的事物，并期望他来满足我们，就不是自由，而是放肆和盲目地为罪所奴役。归根结底，那意味着我们试图让神也成为我们罪恶的同谋，并诱使他屈从于我们对罪的爱好。我们许多祷告未能蒙主——那至善全知的神——应允的原因，就在于这些祷告并非「按着他的旨意」。我们祈求蒙应允的条件是：这些祈求必须「按着他的旨意」。我们可以确立这样一个原则：求那按着神旨意的事物，你就必得着。而按着神旨意的事物，就是那源于福音且与福音相符的。借此，人的自由得以保障，使其能够在神的无限美善、神的无限真理、神的无限公义中行事为人、生活存有，一言以蔽之：在神的一切无限性之中。而这，也是最完美、最甘美的自由。其他的一切，无论是间接还是直接地，都是对罪、对死亡、对魔鬼、对邪恶的奴役。
    - type: paragraph
      text:
        ru: '5:15'
        cn: '5:15'
    - type: paragraph
      text:
        ru: '"И кад знамо да нас слуша што год молимо – ὃ ἂν αἰτώμεθα -, знамо да ће нам дати што иштемо у њега – τὰ αἰτήματα (= прошења, искања)" – "Знамо да нас слуша«, из искуства знамо. Наше богоугодне молитве су наша најсвеснија и најчвршћа убеђења; ту нема колебања, двоумљења, сумње. »Јер који сумња, нека не мисли да ће примити што од Бога« (Иак.1:6–7). Ми испуњујемо вољу Божју, зато Он испуњује вољу нашу. Правило је еванђелско: испуњуј вољу Божју, да би Он испуњавао вољу твоју. Што год Бог жели теби и другима, то исто и ти жели и себи и другима, и буди уверен да ће Бог испунити сваку твоју молитвену жељу. А шта Бог жели и теби и другима казао нам је у свом Еванђељу. Живиш ли по Еванђељу, Господ ће ти испунити сваку жељу.'
        cn: '"当我们知道我们所祈求的一切，祂都垂听——ὃ ἂν αἰτώμεθα——，我们就知道祂必将我们所求的赐给我们——τὰ αἰτήματα (= прошења, искања)。"『我们知道祂垂听我们』，我们是从经验中知道的。我们蒙神悦纳的祷告，是我们最清醒、最坚定的信念；其中没有犹豫、踌躇、怀疑。『因为那疑惑的人，不要想从神那里得什么』（雅各书 1:6-7）。我们遵行神的旨意，因此祂也成全我们的心愿。这是一条福音的原则：你要遵行神的旨意，好叫祂成全你的心愿。凡神所愿赐给你和他人的一切，你也当同样愿赐给自己和他人，并要确信神必成全你每一个祷告的愿望。至于神愿赐给你和他人什么，祂已在祂的福音中告诉了我们。如果你按照福音生活，主就会成全你每一个愿望。'
    - type: paragraph
      text:
        ru: '5:16'
        cn: '5:16'
    - type: paragraph
      text:
        ru: 'Еванђелски је: желети свакоме спасење, и радити на томе. То је жеља Христова према свакоме, то треба да буде и жеља наша. А то значи: не желети никоме грех и оно што је греховно, него увек желети добро и оно што води Сведобру; не желети никоме смрт и оно што је смртоносно, него увек желети бесмртност и оно што води бесмртности; не желети никоме ђавола и оно што је ђаволско, него свакоме желети Христа и оно што је Христово. Људи који воле грех, желе себи смрт. Ако је неко бесповратно заљубљан у грехе своје, он је већ убио себе, већ извршио самоубиство. Жели ли неко грех другоме, он му жели смрт. Јер »грех рађа смрт« (Иак.1:15). Постоје две врсте греха: »грех не к смрти" и "грех к смрти". "Грех не к смрти« је онај грех за који се човек каје. Сваки грех наноси души по једну малу смрт; а покајањем човек изгони грех из себе, изгони смрт, васкрсава душу своју из мртвих. Покајање је не само друго крштење, него и прво васкрсење. Јер је васкрсење душе из мртвих. Покајање разорава гроб душе, убија духовну смрт уводећи човека у живот вечни. Ма какве грехе имао човек, покаје ли се – устао је из мртвих: «мртав беше, и оживе; изгубљен беше, и нађе се» (Лк.16:24–32). Тако, сваки покајан грех је «грех не к смрти», па макар «седам пута на дан» био учињен, и «седам пута на дан» учинилац његов дошао и рекао: «кајем се» (Лк.17:3–4). А «грех к смрти» је сваки непокајан грех, тј. сваки грех при коме и у коме остаје човек свесно, добровољно и упорно. Такав грех изазива смрт душе. А смрт душе није друго до одвајање душе од Бога, лишавање душе Бога и његових благодатних дарова и сила. Свети Богослов благовести: «Ако ко види брата свога где греши грех не к смрти (ἁμαρτίαν μὴ πρὸς θάνατον), нека моли, и даће му живот, онима који греше не к смрти. Има грех к смрти – ἁμαρτίαν πρὸς θάνατον -: за тај не говорим да моли". – "Нека моли, и даће му живот»: учинио је грех, и тиме умро, умртвио себе, убио себе; узмоли ли се, даће му покајање, и покајањем – васкрсење из мртвих, живот. Тако, молитва, покајање је победитељ смрти, васкрситељ мртвих. А то постаје сваки који се искрено моли, искрено каје. «За грех к смрти" нека "не моли». Зашто? Зато што је човек свим бићем, свом душом, свом свешћу, свом вољом ушао у грех, и остаје свесно и добровољно у њему; неће да га се одрекне, да га омрзне. То је већ она «друга смрт», из које се не васкрсава. Таквоме човеку Бог не жели, нити хоће да насилу наметне покајање. Не жели, нити хоће, нити може јер је Бог – љубав, и љубављу богује, и живи, и постоји. Бог је из љубави створио човека са боголиком слободом. Када би насилу наметнуо човеку своју вољу, своје Еванђеље, своје спасење, своје царство, Себе, Он би уништио човекову слободну вољу. И човек би престао бити човек, и постао аутомат, машина, робот. А Бог зато што је љубав, не би могао то учинити, јер то није у природи љубави. Учини ли то, Он би престао бити Љубав. А престајући бити љубав, Бог би престао бити Бог. То је разлог што свети Тајнозналац саветује да се не треба молити «за грех к смрти». И на тај начин нам даје упутство Божје о томе шта треба да молимо од Бога а шта не.'
        cn: '按照福音的教导，是愿望人人得救，并为此努力。这是基督对每个人的愿望，这也应该是我们的愿望。这意味着：不愿任何人犯罪以及那些属罪的，而是永远愿望善良和那引向上善的；不愿任何人死亡以及那些致死的，而是永远愿望不朽和那引向不朽的；不愿任何人落入魔鬼以及那些属魔鬼的，而是愿望每个人都得着基督和那些属基督的。


          爱罪的人，是为自己求死。如果有人无可挽回地爱上自己的罪，他已经杀死了自己，已经自杀了。如果有人希望他人犯罪，他就是希望那人死亡。因为「罪生出死」（雅各书 1:15）。罪有两种：「不至于死的罪」和「至于死的罪」。「不至于死的罪」是人为此悔改的罪。每一个罪都会给灵魂带来一次小小的死亡；而藉着悔改，人将罪从自己里面驱逐出去，驱逐死亡，使其灵魂从死里复活。悔改不仅是第二次洗礼，也是第一次复活。因为这是灵魂从死里复活。悔改摧毁灵魂的坟墓，杀死属灵的死亡，将人引入永生。无论人犯了什么罪，只要他悔改，他就从死里复活了：「他曾是死的，又活了；曾是失丧的，又被寻见了」（路加福音 16:24-32）。如此，每一个悔改的罪都是「不至于死的罪」，即使是「一天七次」犯的罪，并且「一天七次」犯罪者前来并说：「我悔改了」（路加福音 17:3-4）。


          而「至于死的罪」是每一个不悔改的罪，即，人有意识地、自愿地、顽固地停留在其中的每一个罪。这样的罪会导致灵魂的死亡。而灵魂的死亡无非是灵魂与上帝的分离，灵魂被剥夺了上帝及其恩典的恩赐和能力。圣神学家宣告说：「人若看见弟兄犯了不至于死的罪（ἁμαρτίαν μὴ πρὸς θάνατον），就要为他祈求，上帝必将生命赐给他，就是赐给那些犯了不至于死的罪的人。有至于死的罪——ἁμαρτίαν πρὸς θάνατον——：我不说当为这罪祈求。」——「要为他祈求，上帝必将生命赐给他」：他犯了罪，因此死了，使自己死，杀死了自己；如果有人为他祈求，上帝就会赐予他悔改，并藉着悔改——从死里复活，得着生命。如此，祷告和悔改是死亡的征服者，是使死人复活者。每一个真诚祷告、真诚悔改的人都成为这样的人。


          「至于死的罪，就不必为他祈求了。」为什么？因为人以其全部的存在、全部的灵魂、全部的意识、全部的意志进入罪中，并有意识地、自愿地停留在其中；他不愿放弃它，不愿憎恨它。这已经是那「第二次的死」，从中无法复活。对这样的人，上帝不希望，也不愿强加悔改。祂不希望，也不愿，也不能，因为上帝是爱，并藉着爱而为主，而活着，而存在。上帝出于爱，创造了拥有神圣自由的人。如果祂强行将自己的旨意、自己的福音、自己的救赎、自己的国度、祂自己强加于人，祂就会摧毁人的自由意志。于是人就不再是人，而成为一个自动机、一台机器、一个机器人。而上帝因为是爱，就不能这样做，因为这不符合爱的本性。如果祂这样做，祂就不再是爱了。而不再是爱，上帝就不再是上帝了。这就是圣奥秘知晓者建议不应该为「至于死的罪」祈祷的原因。祂以此方式给我们提供了上帝的指示，关于我们应该向上帝祈求什么，不应该祈求什么。'
