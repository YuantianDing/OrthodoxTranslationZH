    - type: paragraph
      text:
        ru: 'А ми хришћани, одакле смо ми? «Ми смо од Бога – ἐκ τοῦ Θεοῦ ἐσμεν -; који познаје Бога – ὁ γινώσκων τὸν Θεὸν – слуша нас, а који није од Бога не слуша нас. По овоме познајемо духа истине и духа преваре – τὸ πνεῦμα τῆς πλάνης. »Ми смо од Бога« боголиком душом; а светим крштењем »ми смо од Бога« поново рођени, свим бићем рођени. Или тачније: ми се непрестано рађамо од Бога. Верујемо ли, волимо ли, молимо ли се, постимо ли, творимо ли ма који еванђелски подвиг, ми се кроз сваки рађамо од Бога, постајемо Божји: изводимо из Бога све мисли своје, сву душу своју, све срце своје, сву снагу своју, сав живот свој. И заиста с правом тврдити: »Ми смо од Бога«. Живећи у светим тајнама и у светим врлинама ми уствари живимо у Богу: »јер у Њему живимо, и мичемо се, и јесмо« (Деян.17:28). Стога и смело тврдимо: »Ми смо од Бога«. Све што имамо -Божје је: и дух, и душа, и срце, и тело, и имање, и учење, и мисли, и дела, и живот, и постојање. Отуда, који познаје истинитог Бога »слуша нас«, јер се слично познаје сличним. Који год дух не слуша Бога, не признаје Бога, ни богоносце, није од Бога, није од Истине, него је дух преваре. Дух преваре вара људе учећи их лажно о пореклу света и човека, о смислу живота и смрти, о добру и злу, уопште о свему и свачему. »Кад лаж говори, своје говори« (Ин.8:44), и слушају га сви који воле лаж. А основна је лаж »оца лажи« да Христос није Бог. А из ње се изводи друга главна лаж: нема Бога. Од ових двеју лажи изројиле су се све остале лажи у свима световима: »Дух преваре« је сав саткан од њих.'
        cn: 而我们基督徒，我们从何而来？「我们是属神的（ἐκ τοῦ Θεοῦ ἐσμεν）；凡认识神的（ὁ γινώσκων τὸν Θεὸν）就听从我们，凡不是属神的就不听从我们。由此我们认出真理的灵和欺骗的灵（τὸ πνεῦμα τῆς πλάνης）。」「我们是属神的」因着那肖似神的灵魂；而藉着圣洗，「我们是属神的」被重新生出，全人被生出。或者更准确地说：我们不断地从神而生。我们是否相信、是否爱、是否祷告、是否禁食、是否行出任何一项福音的功修，我们都藉着每一次从神而生，成为神的：我们将自己所有的思想、自己所有的灵魂、自己所有的心、自己所有的力量、自己所有的生命都从神引出。因此确实有权宣称：「我们是属神的」。活在圣奥秘中和圣美德中，我们实际上是活在神里面：「因我们生活、动作、存留，都在乎他」（使徒行传 17:28）。因此我们也敢于宣称：「我们是属神的」。我们所有的一切都是属神的：无论是灵、魂、心、身体，还是财产、教导，还是思想、行为，还是生命、存有。因此，凡认识真神的就「听从我们」，因为相似者与相似者相知。任何不听从神的灵，不承认神，也不承认负神者，就不是属神的，不是属真理的，而是欺骗的灵。欺骗的灵欺骗世人，错误地教导他们关于世界和人类的起源，关于生命和死亡的意义，关于善与恶，总之是关于一切事物。「他说谎是出于自己的本性」（约翰福音 8:44），所有喜爱谎言的人都听从它。而「谎言之父」的根本谎言是基督不是神。而从这个谎言又衍生出另一个主要的谎言：没有神。从这两个谎言中，在所有世界里诞生了所有其他的谎言：「欺骗的灵」完全是由它们编织而成。
    - type: paragraph
      text:
        ru: 4:7–8
        cn: 4:7–8
    - type: paragraph
      text:
        ru: '"Ми смо од Бога», – на који начим? – Љубављу. Јер љубав и јесте божанска морална сила која нас рађа од Бога, усињује Богу, обожује, чини Божјима. «Бог је љубав», зато је љубав боготворна морална сила, обожујућа сила. Прожме ли човеково биће, љубав га прожме божанским силама, које човека препорађају, преображавају у ново биће, у нову душу, у ново срце, у нов разум, у нов живот. У њега су онда и све мисли од Бога, и сва осећања, и сва дела. И он зна Бога на један нови начин: најстварнији и најубедљивији. Само то стварно, органско јединство са Богом, које се постиже рађањем од Бога љубављу, даје истинско познање о Богу. Не роди ли се човек љубављу од Бога, он и не може познати Бога. Не познаје ли пак човек Бога, он Га обично и не признаје. Пошто је Бог љубав, то нас љубав веже и духовно приближава, сједињује са свима Божјим створењима, најпре са људима. Који љуби браћу, има Бога, зна Бога, јер је рођен од Бога. Који не љуби браћу, нема Бога, не зна Бога, не види божанска, боголика бића у људима, јер није рођен од Бога. Свети Богослов благовести: «Љубљени, да љубимо један другога; јер је љубав од Бога, и сваки који има љубав – ὁ ἀγαπῶν (= који љуби, који воли) од Бога је рођен, и познаје Бога. А који нема љубави – ὁ μὴ ἀγαπῶν – не позна Бога – οὐκ ἔγνω τὸν Θεόν -; јер је Бог љубав – ὁ Θεὸς ἀγάπη ἐστίν». Од љубави је и човеково богорођење и његово богопознање. Без љубави нити се човек рађа од Бога, нити зна Бога: незнабожац је, безбожник је.'
        cn: '「我们源于上帝。」——以何种方式？——以爱。因为爱确是神圣的道德力量，它使我们由上帝而生，收纳我们为上帝的儿女，使我们成神，使我们归属上帝。「上帝是爱」，因此爱是造就上帝的道德力量，是使人成神的力量。如果爱渗透人的存在，它就会以神圣的力量渗透他，这些力量使人重生，将他转化成一个新的存在，一个新的灵魂，一颗新的心，一种新的理智，一种新的生命。那时，他所有的思想、所有的感受、所有的行为都源于上帝。他以一种新的方式认识上帝：最真实、最确凿的方式。唯有通过爱由上帝而生所达成的这种真实、有机地与上帝合一，才能带来对上帝的真正认识。如果人不是通过爱由上帝而生，他就无法认识上帝。如果人不能认识上帝，他通常也不会承认祂。


          既然上帝是爱，那么爱将我们连接起来，并在灵性上使我们亲近，使我们与上帝所有的受造物，首先是与人合一。凡爱弟兄的，就拥有上帝，认识上帝，因为他是由上帝而生的。凡不爱弟兄的，就没有上帝，不认识上帝，在他身上看不到人里面的神圣的、肖似上帝的存在，因为他不是由上帝而生的。圣神学家宣报：「亲爱的，我们当彼此相爱；因为爱源于上帝，凡有爱的——ὁ ἀγαπῶν （即：爱的人，喜爱的人）——是由上帝而生，且认识上帝。凡没有爱的——ὁ μὴ ἀγαπῶν——不认识上帝——οὐκ ἔγνω τὸν Θεόν——；因为上帝是爱——ὁ Θεὸς ἀγάπη ἐστίν。」 人的神性诞生和神性认识都源于爱。没有爱，人既不是由上帝而生，也不认识上帝：他是异教徒，他是无神论者。'
    - type: paragraph
      text:
        ru: '4:9'
        cn: '4:9'
    - type: paragraph
      text:
        ru: '"У томе се показа љубав Божја к нама што Бог Сина свог Јединородног посла на свет да живимо кроза Њ – ἵνα ζήσωμεν δι’ Αὐτοῦ«. Заиста се љубав Божја према људима није могла ничим боље испољити него тиме: послати у свет Бога Логоса да би људи живели Њиме. Божји живот оваплоћењем Логоса постао је наш, људски живот; Логос је постао човек, да би човеку дао живот Божји, научио га томе животу и дао му силе да може остваривати тај живот у земаљским и човечанским условима. Шта је божански живот? – Живот Исуса Христа на земљи. У чему се састоји тај божанаки живот? – У живљењу божанском Истином, божанском Љубављу, божанском Правдом, божанском Светошћу, и осталим божанским особинама. Све те божанске животне силе Богочовек је пренео у наш човечански свет и претворио их у наш људски живот. Он је ушао у наш живот, унео у њега силе божанског живота, и тако наш људски живот претворио у богоживот. Бог Логос је постао Богочовек, да би наш живот учинио богоживотом. У томе је сва тајна; у томе сва љубав Божја према нама људима. Тако је Богочовек на најсавршенији начин решио проблем живота људског. Људи су ради таквог богоживота и саздани боголикима. Да су људи живели силама боголикости и богочежњивости, они би све више и све потпуније остваривали богоживот, и тако занавек остали у рају. Јер рај није друго до живот у Богу, живљење Богом: богоживот. Чим је човек унео грех у себе, у свој живот, он је почео претварати свој живот у ђавоживот. Јер живети грехом значи живети ђаволом, јер ђаво и живи само грехом. Хоћеш да сазнаш чиме живи ђаво? – Чини грех и – сазнаћеш. Јер је у греху сва тајна његовог живота. Ђаво је сав у греху, и нимало га нема ван греха. А где је ђаво, ту је и пакао. Пакао и није друго до живљење у гресима. Уствари, богоживот и ђавоживот, богољубље и ђавољубље, су једина два начина људског живота на земљи и у осталим световима, једине две категорије људског постојања у ма коме свету. То су две вечне детерминанте људског бића; човек никако не може ван њих. Када би их се могао ослободити, он би престао бити људско биће.'
        cn: 「上帝爱我们，在此就显明了：上帝差祂的独生子到世上来，使我们借着祂得生——ἵνα ζήσωμεν δι』 Αὐτοῦ。」确实，上帝对人类的爱，再没有比这更好的方式来显明了：差上帝圣言到世上来，好让人类借着祂而活。借着圣言道成肉身，神的生命成了我们人类的生命；圣言成为人，是为了赐予人神的生命，教导他这种生命，并赐予他力量，使他能够在地上和人类的条件下实现这种生命。什么是神圣的生命？——是耶稣基督在世上的生命。这种神圣的生命包含什么？——包含活在神圣的真理、神圣的爱、神圣的公义、神圣的圣洁以及其他神圣的品德之中。所有这些神圣的生命力量，神人都将它们带入我们人类世界，并将其转化为我们人类的生命。祂进入我们的生命，将神圣生命的力量注入其中，从而将我们人类的生命转化为神性生命。上帝圣言成为神人，是为了使我们的生命成为神性生命。这便是全部的奥秘；这便是上帝对我们人类的全部爱。就这样，神人以最完美的方式解决了人类生命的难题。人类正是为了这种神性生命而被创造为肖神性的。如果人类活在肖神性和渴慕神性的力量中，他们就会越来越完全地实现神性生命，并因此永远留在乐园里。因为乐园并非别的，乃是在上帝里生命，以上帝而活：即神性生命。人类一旦将罪带入自身、带入自己的生命，他便开始将自己的生命转化为魔鬼式生命。因为活在罪中，就意味着活在魔鬼里，因为魔鬼也只活在罪中。你想知道魔鬼靠什么而活吗？——犯罪吧，你就会知道。因为罪中蕴含着它生命的一切奥秘。魔鬼全然活在罪中，丝毫不脱离罪。而魔鬼在哪里，地狱就在哪里。地狱并非别的，乃是活在罪恶之中。事实上，神性生命与魔鬼式生命，爱神与爱魔鬼，是人类在地上和在其他世界中唯有的两种生活方式，是人类在任何世界中存在的唯有的两种范畴。这是人类存在的两个永恒决定因素；人类绝不可能脱离它们。如果他能够摆脱它们，他就不再是人类的存在了。
    - type: paragraph
      text:
        ru: '"Да живимо кроза Њ», «да живимо Њиме» = Христом: δι’ Αὐτοῦ. А ми живимо Њиме, када? – Када живимо његовом Истином, његовом Љубављу, његовом Правдом, његовом Добротом; једном речју: када живимо његовим Еванђељем, његовом Црквом. Јер је не само његово Еванђеље у Цркви, већ и Он сам, чудесни Богочовек, са свима својим савршенствима, и свима својим светим силама и врлинама. И још је нешто више посреди: Црква је вечноживо Тело Богочовека Христа, вечноживи организам његов, а чланови Цркве су молекули и ћелијице тог организма, и сви живе Њиме – Богочовеком, живе од Њега и кроз Њега. Отуда се велика благовест св. Воанергеса: «да живимо Њиме» – стално остварује у Цркви, у свима њеним члановима, од почетка па до данас: јер сви они живе Њиме и кроз Њега; то је један непрекидни процес богоживота. У њега се улази светим тајнама; у њему се занавек остаје светим врлинама. Јер Црква и није друго до Богочовек – продужен кроза све векове, а у Њему – богоживот.'
        cn: '「我们藉着他而活」，「我们靠他而活」= 基督：δι』 Αὐτοῦ。而我们何时靠他而活呢？——当我们活出他的真理、他的爱、他的公义、他的良善时；一言以蔽之：当我们活出他的福音、他的教会时。因为不仅是他的福音在教会中，他自己，这位奇妙的神人，带着他所有的完美、和他所有神圣的力量与美德，也在其中。


          还有更深远的意义：教会是神人基督永恒的活体，是他永恒的活机体，而教会的成员是那个机体的分子和细胞，所有人都靠他——神人而活，从他而活，也藉着他而活。因此，圣沃阿涅格斯的伟大福音信息：「我们靠他而活」——持续不断地在教会中，在其所有成员中，从始至今得以实现：因为他们都靠他并藉着他而活；这是一个不间断的神圣生命过程。藉着圣事进入这生命；藉着圣洁的美德永远留在这生命中。因为教会无非就是神人——在所有世代中得以延续，而在他里面——是神圣生命。'
    - type: paragraph
      text:
        ru: '4:10'
        cn: '4:10'
    - type: paragraph
      text:
        ru: '"У овоме је љубав: не да ми показасмо љубав к Богу, него да Он показа љубав к нама – ἠγάπησεν ἡμᾶς, и посла Сина свог – умилостивљење за грехе наше – ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν«. – Не би било ништа нарочито да смо ми, грешни и порочни људи, показали најпре љубав према Богу, који нам очигледно стално чини безбројна доброчинства. Јер љубав према неуморном и свеиздашном Добротвору наша је прва дужност. Али ни то нисмо учинили, јер су нас греси учинили непријатељима Божјим и огорчили на све што је Божје. Грех је непријатељство према Богу. И још: грех је мржња према Богу. Понесени грехољубљем, људи љубе грехе и сласти њихове, а мрзе Бога и светиње његове. Који воли грех, не може волети Бога, јер грех је по природи својој противбожја сила, богопротивна и богоборна. Потчињавајући себе гресима добровољно, људи уносе у себе силу која стално ратује са Богом, непријатељствује против Бога, мрзи Бога. Са временом та сила толико парализује душу људску, да она не осећа Бога, па чак и не признаје Бога, и почне тврдити како нема Бога. Грехољубље увек, на крају крајева, одведе безбожништву и богоборству: одриче Бога и ратује против Бога и свега Божјег.'
        cn: 「爱在此：不是我们爱神，而是他爱我们——ἠγάπησεν ἡμᾶς，并差遣他的儿子——为我们的罪作挽回祭——ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν。」——如果说我们这些有罪和败坏的人，首先向神显示了爱，那也没什么特别的，因为他显然不断地赐予我们无数的恩惠。因为爱那不倦且慷慨赐予的施恩者，是我们的首要职责。但我们连这也没做到，因为罪使我们成为神的敌人，并使我们对一切属神的事感到愤恨。罪是对神的敌意。还有：罪是对神的仇恨。被爱罪之心所驱使，人们喜爱罪及其乐趣，却恨神和祂的圣物。喜爱罪的人不能爱神，因为罪按其本性是一种反神的力量，敌对神的并与神争战。自愿顺服于罪，人们就将一种力量引入自身，这种力量不断与神争战，敌对神，仇恨神。随着时间的推移，这力量如此麻痹人的灵魂，以至于灵魂感受不到神，甚至不承认神，并开始声称没有神。爱罪之心最终总是导致无神论和与神争战：否认神，并与神以及一切属神的事物争战。
    - type: paragraph
      text:
        ru: 'Љубав Божја према грешним људима јесте највеће чудо милосрђа Бажјег. Јер је само она могла послати Сина Божјег у богоборни свет људски, да спасе људе од греха својим безгранично човекољубивим подвигом. Целокупном личношћу својом, Господ Христос претставља и јесте једино истинско човекољубље, због чега се и назива Јединим Човекољупцем и Богом човекољубља. Јер се љубав у томе и састоји: смиловати се на грешника, а осудити грех; спасти грешника, а уништити грех; одвојити грех од човека, па помиловати човека а осудити грех. У томе се састоји једино право човекољубље. Богочовек је из човекољубља свог сав ἱλασμὸν, умилостивљење за грехе наше: сав милост, сав саучешће, сав сажаљење. И помоћу тога, и ради тога – спасење. Он се смиловао на род људски, као што нико никада није могао замислити. Јер је само Бог човекољубља могао измислити и остварити тако савршени начин спасења људи од греха: Богочовеком, његовим животом од рођења па све кроз крсну смрт, васкрсење и вазнесење спасти људе од греха, смрти и ђавола. То је заиста љубав којој нема равне; заиста човекољубље које с правом носи то име. То је заиста једина стварна милост према људима. Зато је то и једино умилостивљење пред Богом за грешни род људски. Само је бескрајно човекољубива жртва Христова за грешни род људски могла умилостивити Бога према упорно и безумно грехољубивом роду људском. Својим безгранично човекољубивим подвигом спасења људи од греха, Богочовек је постао и заувек остао »умилостивљење за грехе наше".'
        cn: 上帝对罪人的爱是上帝怜悯的最大奇迹。因为唯有它能差遣上帝之子进入与上帝为敌的人类世界，藉着祂无限热爱人类的功绩，来拯救人们脱离罪恶。凭着祂的整个位格，主基督代表着并且就是唯一真实的仁爱，因此祂被称为唯一的爱人者和仁爱的上帝。因为爱就在于此：怜悯罪人，却定罪罪恶；拯救罪人，却消灭罪恶；将罪恶与人分离，然后怜悯人，却定罪罪恶。这就是唯一真实的仁爱。神人出于祂的仁爱，是完全的ἱλασμὸν，是我们罪的挽回祭：完全的怜悯，完全的同情，完全的悲悯。借着这一切，也为了这一切——就是救赎。祂怜悯了人类，犹如无人曾能想象。因为唯有仁爱的上帝能构想并实现如此完美的救人脱罪之法：藉着神人，祂从降生到受难死亡、复活和升天的一生，将人们从罪恶、死亡和魔鬼中拯救出来。这确实是无可比拟的爱；确实是名副其实的爱人如己。这确实是唯一真实的对人类的怜悯。因此，它也是在上帝面前为有罪的人类唯一的挽回祭。唯有基督无限热爱人类的牺牲，为了有罪的人类，才能使上帝息怒，对顽固而愚蠢地热爱罪恶的人类。藉着祂无限热爱人类的功绩，拯救人类脱离罪恶，神人成为了并永远是「我们罪的挽回祭」。
    - type: paragraph
      text:
        ru: '4:11'
        cn: '4:11'
    - type: paragraph
      text:
        ru: '"Љубљени, кад је Бог тако показао љубав к нама – ἠγάπησεν ἡμᾶς -, и ми смо дужни љубити један другога – ὀφείλομεν ἀλλήλους ἀγαπᾶν«. Образац љубави и човекољубља, и то савршени и свесавршени образац, јесте Господ Христос. Пошто смо ми доживели, и непрестано доживљујемо ту љубав Христову, коју ничим не заслужујемо, то смо дужни њоме, из ње и ради ње, љубити један другога. То је нова љубав, и нова заповест о љубави; нова, јер љуби човека и у греху његовом; нова, јер милује грешника а осуђује грех његов; нова, јер не убија грешника због греха, него убија грех а спасава грешника. Зато што је ова Христова љубав тако савршена и тако спасоносна, она је постала првом дужношћу хришћана: »Ми смо дужни љубити један другога«. Јер вршећи ову дужност ми продужавамо Богочовеково дело спасења људи: спасавамо себе и друге, или тачније: спасавамо себе кроз друге. Спасење, то је продужење Христове љубави кроза све људе који верују у Њега. Спасавамо се од греха, смрти и ђавола Христовом љубављу, Христовим човекољубљем.'
        cn: 亲爱的，既然上帝如此爱我们—— ἠγάπησεν ἡμᾶς ——我们也理当彼此相爱—— ὀφείλομεν ἀλλήλους ἀγαπᾶν«。爱与仁爱的典范，并且是完全且全然完全的典范，就是主基督。既然我们已经经历，并持续经历那基督的爱——我们丝毫不配得的爱——所以我们理当藉着它，源于它并为了它，彼此相爱。这是一份新的爱，也是一条关于爱的新诫命；之所以新，是因为它爱世人，甚至在他们的罪中也爱他们；之所以新，是因为它怜悯罪人，却定罪其罪；之所以新，是因为它不因罪而杀灭罪人，而是杀灭罪恶并拯救罪人。正因为基督的这份爱如此完全且如此具有救赎性，它已成为基督徒的首要职责：「我们理当彼此相爱」。因为履行此职责，我们延续了神人（基督）拯救人类的工作：我们拯救自己和他人，或更确切地说：我们藉着他人拯救自己。救赎，乃是基督之爱在信靠祂的所有人身上的延续。我们藉着基督的爱，基督的仁爱，从罪、死亡和魔鬼中得蒙拯救。
    - type: paragraph
      text:
        ru: '4:12'
        cn: '4:12'
    - type: paragraph
      text:
        ru: '"Бога нико није видео никад; ако љубимо један другога, Бог у нама обитава – ὁ Θεὸς ἐν ἡμῖν μένει -, и љубав је његова савршена у (τετελειωμένη) нама». Љубав низводи Бога у душу, те /чо/век[8]живи Њиме, и на тај начин види Бога, који је иначе невидљив. Бог је љубављу постао човек, оваплотио се, очовечио се. Тако и човек: љубављу се обожује, обоготворава, постаје «бог по благодати». Невидљиви Бог љубављу пастаје оваплотљив, видљив. Јер је божанска љубав оваплотитељска сила: она љубећег преноси у љубљеног, оваплоћује га у њему: њихови се животи стапају у један живот, њихове душе у једну душу, њихова срца у једно срце. И они осећају себе као једно, иако остају две посебне личности. То важи за све чланове Цркве: они се међусобном љубављу оваплоћују један у другоме, један у свима, и сви у једноме; живе један у другоме: један у свима, и сви у једноме; исто тако и мисле, и осећају, и делају заједнички, саборно, «са свима светима» (Еф.3:18). То је оно што је речено у Делима Апостолоким: «А у народа који верова беше једно срце и једна душа; и све им беше заједничко» (Деян.4:32). – Доживљавањем Христове љубави, човек усељује Бога у душу своју, живи Њиме, мисли Њиме, осећа Њиме, дела Њиме; једном речју: «Бог у њему обитава». Зато је Бог за њега најнепосреднији доживљај његов, најнепосреднија стварност, најочигледнији опит, најексперименталније искуство. А кад Бог у човеку обитава, Он и љубав човекову усавршава. Јер из Њега се постепено разлива по души човековој божанска љубав, расте у све савршенију љубав кроз остале свете врлине, док најзад не ољуботвори цело биће његово. И оно онда не зна за границу љубави, јер «Бог је љубав», зато божанска љубав и нема граница. Бог љубављу обитава у души људској. Зато је она и савршена.'
        cn: 曾没有人见过上帝；如果我们彼此相爱，上帝就住在我们里面——ὁ Θεὸς ἐν ἡμῖν μένει——他的爱就在我们里面得以完全（τετελειωμένη）。」爱将上帝引入灵魂，使人[8]靠祂而活，并以此方式看见那本来不可见的上帝。上帝因爱成为人，道成肉身，化为人形。同样，人也是如此：因爱而成神，被神化，成为「按恩典而成为的神」。不可见的上帝因爱而变得可受肉身，变得可见。因为神圣的爱是使之道成肉身的力量：它将爱者融入被爱者，使爱者在被爱者中道成肉身：他们的生命融为一体，他们的灵魂合为一灵，他们的心合为一心。他们感到自己合而为一，尽管仍是两个独立的位格。这适用于教会的所有成员：他们借着彼此的爱，一人在另一人中道成肉身，一人在众人中，众人都在一人中；他们彼此居住：一人在众人中，众人都在一人中；同样，他们也共同思考、感受和行动，以公议的方式，「与众圣徒一同」（以弗所书 3:18）。这就是使徒行传中所说的：「那信的人都一心一意，凡物公用」（使徒行传 4:32）。——通过体验基督的爱，人将上帝引入自己的灵魂，靠祂而活，靠祂思想，靠祂感受，靠祂行动；一言以蔽之：「上帝在他里面居住。」因此，上帝对他而言是其最直接的体验，最直接的实在，最显明的经历，最具实验性的经验。而当上帝居住在人里面时，祂也使人的爱得以完全。因为神圣的爱逐渐从祂倾注到人的灵魂中，通过其他圣洁美德，成长为日益完全的爱，直到最终使他整个存有充满爱。那时，他便不知爱的界限，因为「上帝就是爱」，所以神圣的爱也没有界限。上帝以爱居住在人的灵魂中。因此，这份爱也是完全的。
    - type: paragraph
      text:
        ru: 4:13–15
        cn: 4:13–15
    - type: paragraph
      text:
        ru: '"По томе дознајемо да у њему обитавамо (μένομεν), и Он у нама, јер нам је дао од Духа свога – ἐκ τοῦ Πνεύματος αὐτοῦ«. Опет непосредно искуство о Духу Светом. Ушавши сам у наш живот, Богочовек је увео у њега и Духа Светог. Спаситељ је на Тајној Вечери обећао својим светим Ученицима, а кроз њих и свима својим следбеницима да ће Дух Свети сведочити за Њега (Ин.15:26). И заиста, обећање се испунило: Господ Христос даје Духа Светог следбеницима својим, и Он их испуњује осећањем, и сазнањем, и убеђењем: да је Христос – Богочовек и Спаситељ; да је свим бићем, и свим светињама својим, и свим светим силама својим, остао у Цркви, борави у њој; и да ми, боравећи у Цркви, боравимо у Њему кроз светиње његове и свете силе његове. Зато свети Богослов благовести да је живот у Христу – живот у Духу Светом, живот у Светој и нераздељивој Тројици. Дух Свети нам даје духовни вид, којим видимо да Бог Отац посла Сина да спасе свет. Тако сва Света Тројица учествује у спасењу света. Ма како приступали Господу Христу и његовом домостроју спасења, увек се осећа и види да је Он – Син Божји, послан од самог Бога Оца, да изврши дело спасења света. То су нарочито осетили и видели очевици оваплоћеног Сина Божјег, због чега и овај свети очевидац изјављује: »И ми видесмо, и сведочимо да Отац посла Сина да спасе свет – (= посла Сина – Спаситеља света)«. Господ Христос је у бескрајном човекољубљу свом извршио спасење света благовољењем Оца и сарадњом Духа. Али, то је дело ипак толико његово лично дело, да му је и име Спаситељ – Σωτήρ, јер то значи Исус. Зато Исусом није назван ни Бог Отац, ни Бог Дух Свети. Очигледно је из целокупног домостроја спасења, извршеног Исусом, да је Он заиста Син Божји, заиста Друго Лице Свете Тројице, заиста Бог Логос. Који то увиђа, и то исповеда – сав је у Богу Спаситељу, и Бог у њему. Јер га то увиђање одушевљава те радосно испуњава све заповести спасења. А у заповестима спасења присутан је својим светим свеспасилачким силама сам Бог Спаситељ. Стога свети Богослов благовести: »Који год призна – ὁμολογήσῃ (= исповеди) да је Исус Син Божји, Бог у њему обитава (μένει), и он у Богу".'
        cn: 因此我们得知我们住在他里面（μένομεν），他也在我们里面，因为他已将他的灵赐给我们——「ἐκ τοῦ Πνεύματος αὐτοῦ」。这又是关于圣灵的直接经验。神人亲自进入我们的生命，也将圣灵引入其中。救主在最后的晚餐上应许他的圣门徒，也通过他们向他所有的追随者，圣灵将为他作见证（约翰福音 15:26）。果然，应许实现了：主基督将圣灵赐给他的追随者，圣灵使他们充满感受、认知和确信：基督是神人与救主；他以他全部的存有，以及他一切的圣物和他一切的神圣能力，留在了教会中，并居于其中；而我们，通过居住在教会中，就通过他的圣物和他的神圣能力居住在他里面。因此，这位神圣的神学家宣告，在基督里的生命，就是圣灵里的生命，就是在神圣而不可分割的三位一体中的生命。圣灵赐予我们属灵的视力，借此我们看到圣父上帝差遣圣子来拯救世界。如此，整个圣三位一体都参与在世界的救赎之中。无论我们如何接近主基督和他的救赎计划，总是能感受到并看到他是上帝之子，由圣父上帝亲自派遣，来完成拯救世界的工作。这尤其被道成肉身的上帝之子的目击者们所感受到和看到，因此，这位神圣的目击者宣告：「我们看见了，也作见证，父差遣子来拯救世界——（即：差遣子——世界的救主）。」主基督以他无限的爱人之心，凭着圣父的恩悦和圣灵的合作，完成了世界的救赎。然而，这工作仍然是他如此个人的工作，以至于他的名字就是救主——Σωτήρ，因为这正是耶稣的含义。因此，无论是圣父上帝，还是圣灵上帝，都没有被称作耶稣。从耶稣所完成的整个救赎计划中，显而易见，他确实是上帝之子，确实是圣三位一体的第二个位格，确实是上帝的道（Logos）。凡是领悟这一点并宣认的人，就完全在救主上帝里面，上帝也在他里面。因为这种领悟激励着他，使他喜乐地遵行所有救赎的诫命。而在救赎的诫命中，救主上帝本身以他神圣的全能救赎之力临在其中。因此，这位神圣的神学家宣告：「凡承认——ὁμολογήσῃ（即：宣认）耶稣是上帝之子的人，上帝住在他里面（μένει），他也在上帝里面。」
    - type: paragraph
      text:
        ru: '4:16'
        cn: '4:16'
    - type: paragraph
      text:
        ru: '"И ми познасмо и веровасмо љубав коју Бог има к нама«: познасмо љубав Божју кроз Спаситеља. Дотле, ми уствари ни знали нисмо шта је права љубав. Тек у Спаситељу смо сазнали да је права љубав; у спасењу људи од греха, смрти и ђавола. До Њега су постојале приче и бајке о божанској љубави; она је тек са Њим ушла први пут стварно у наш земаљски свет. Ми познасмо божанску љубав и поверовасмо у њу. Јер ушта бисмо ми, кукавни заробљеници смрти, греха и ђавола, поверовали, и веровали, ако не у Онога који нас спасава од те сверушилачке и свеубилачке троједне силе: греха, смрти и ђавола? Спаситељ нам је показао да је Бог љубав; и да само из љубави и љубављу обитава у човеку и спасава га од смрти, греха и ђавола, и тако даје силе човеку да и он љубављу борави у Богу и доприноси своме спасењу живећи из љубави по Божјим заповестима. До појаве Богочовека Христа, и спасења света које је Он извршио, није се могло показати ни доказати да је Бог Љубав. Али са Богочовеком и кроз Богочовека то постаје најочигледнија истина, прва истина и прва стварност. Истина коју сваки може проверити својим личним искустовом, личним опитом. Бог љубављу у човеку обитава и љубављу га спасава; тако и човек љубављу у Богу обитава и љубављу се спасава. Свети Благовесник објављује највећу, но и најконкретнију, благовест новозаветну: »Бог је љубав, и који обитава у љубави – ὁ μένων ἐν τῇ ἀγάπῃ -, у Богу обитава – ἐν τῷ Θεῷ μένει – и Бог у њему".'
        cn: 「我们已认识并相信神对我们所怀的爱」：我们借着救主认识了神的爱。在此之前，我们实际上并不知道何为真爱。唯独在救主里，我们才明白什么是真爱；这真爱就是将人类从罪恶、死亡和魔鬼中拯救出来。在祂降临之前，关于神圣之爱只存在于传说和神话中；唯独与祂一道，神圣之爱才第一次真实地进入我们的尘世。我们认识了神圣之爱并相信了它。因为我们这些可怜的、被罪恶、死亡和魔鬼所囚禁的人，若不相信那位将我们从那毁灭一切、致死一切的三重势力——罪恶、死亡和魔鬼——中拯救出来的那一位，我们还能相信什么，又该信谁呢？救主向我们显明，神就是爱；并且唯有出于爱并借着爱，祂才住在人里面，将人从死亡、罪恶和魔鬼中拯救出来，从而赐予人力量，使人也能凭着爱住在神里面，并借着按神的诫命出于爱而生活，来成就自己的救恩。在神人基督显现并成就了世界的救恩之前，神是爱这一事实既无法显明也无法被证明。但借着神人并透过神人，这成为最显而易见的真理，成为首要的真理和首要的现实。这是一个每个人都能通过自己的亲身经验和切身体会来验证的真理。神借着爱住在人里面，并借着爱拯救人；同样地，人也借着爱住在神里面，并借着爱获得救恩。圣传福音者宣扬新约中最伟大、同时也是最具体的好消息：「神就是爱；住在爱里的——ὁ μένων ἐν τῇ ἀγάπῃ——就是住在神里面——ἐν τῷ Θεῷ μένει——神也住在他里面。」
    - type: paragraph
      text:
        ru: '4:17'
        cn: '4:17'
    - type: paragraph
      text:
        ru: '"Тиме се љубав у нама усаврши (τετελείωται ἡ ἀγάπη) да имамо слободу на дан суда". "Тиме« што Бог у нама обитава, Бог који је љубав; и ми обитавајући у Богу растемо непрестано у љубави, усавршавамо се у њој бескрајно и безгранично. Као свемоћна божанска сила, љубав изгони из нас сваки грех, држи нас у светом животу, богоживоту, те нам то и даје слободу да се не плашимо судњег дана. Да, ми смо у свету зла и греха, али се не бојимо ни зла ни греха, јер Христом Богом живимо; Он је тај који у нама божанском силом својом побеђује свако зло, савлађује сваки грех. Нисмо од света, али живимо Христом у свету, и тако савлађујемо грехе своје и зла своја: »јер као што је Он и ми смо у свету овом«. Његов живот у овом свету образац је и углед и пример за наш живот у овом свету. Иако је ово писао далеко после вазнесења Спаситељеваг на небо, свети Богослов употребљава садашње време: »Као што је Он и ми смо у свету овом«. Тиме нам открива једну велику тајну: Господ Христос је непрестано у овом свету Црквом. Јер боравећи у њај, Он непрестано борави у овом свету са нама; савреманик је сваком члану Цркве земаљске у току свих векова. Стога свако поколење верних може са светим Воанергесом рећи: »Као што је Он и ми смо у свету овом«. У свету овом живимо Њиме: »као што је Он« у Истини, у Правди, у Љубави – и ми смо. Све што је његово – наше је. Јер нам је Он свега Себе оставио у Цркви, и стално нам даје Себе, нарочито кроз свету тајну Причешћа, и остале свете тајне и свете врлине. Даје нам свега Себе, те можемо живети у овом свету на начин на који је Он живео: еванђелски, богочовечански. Основно је еванђелско правило за следбенике Христове: »као Он = καθὼς ἐκεῖνός« – тако и ми живимо; »као Он« – тако и ми мислимо; »као Он« – тако и ми осећамо; »као Он« – тако и ми поступамо; »као Он« – тагсо и ми гледамо на овај свет и на све светове.'
        cn: 「借此，爱在我们里面得以成全（τετελείωται ἡ ἀγάπη），使我们在审判日可以有自由。」借此，就是因为那爱之神住在我们里面；我们住在神里面，便在爱中不断成长，无限无尽地在其中得以成全。作为全能的神圣力量，爱将一切罪恶从我们里面驱逐出去，使我们得以持守在圣洁的生活中，一种与神联合的生活，因此也赐予我们自由，使我们不惧怕审判之日。是的，我们身处邪恶与罪恶的世界，但我们既不惧怕邪恶也不惧怕罪恶，因为我们藉着基督神而活着；祂就是那藉着祂的神圣力量在我们里面战胜一切邪恶、克服一切罪恶的。我们不属于这世界，但我们藉着基督活在这世界，如此便战胜了我们自己的罪恶和邪恶：「因为祂如何，我们在这世上也如何。」祂在此世的生活是我们在此世生活的典范、榜样和楷模。尽管在救主升天许久之后才写下这些，这位圣者神学家仍使用了现在时：「祂如何，我们在这世上也如何。」借此，祂向我们揭示了一个伟大的奥秘：主基督藉着教会，持续不断地存在于这个世界。因为祂住在教会里面，就持续不断地与我们一同住在世上；祂是地上教会每一个成员在所有世代的同代人。因此，每一代的信徒都可以与圣者波阿涅革斯一同说：「祂如何，我们在这世上也如何。」在这世上我们藉着祂而活：「祂如何」在真理中、在公义中、在爱中——我们也是如此。凡是祂的，都是我们的。因为祂将祂自己全然留在教会中赐予我们，并持续不断地将祂自己赐予我们，尤其藉着圣奥秘圣餐，以及其他的圣奥秘和圣美德。祂将祂自己全然赐予我们，使我们得以像祂那样生活在这世上：福音性的，神人性的。基督追随者的基本福音性法则就是：「像祂一样 = καθὼς ἐκεῖνός」——我们也要如此生活；「像祂一样」——我们也要如此思想；「像祂一样」——我们也要如此感受；「像祂一样」——我们也要如此行事；「像祂一样」——我们也要如此看待这个世界和所有世界。
    - type: paragraph
      text:
        ru: '4:18'
        cn: '4:18'
    - type: paragraph
      text:
        ru: 'Кроз све то води нас, и у свему томе држи нас, божанска љубав Христова. Зато нема страха за нас: нас не плаши ни смрт, ни грех, ни ђаво, ни муке, ни патње, ни страдања. У Христовој љубави су присутне све божанске силе Христове, – а шта је то што њих може уплашити? да ли смрт, или грех, или пакао, или све силе зла и пакла? Та љубав, увек савршена, ако је у нама – изгони сваки страх из нас. Зато су хришћани једини истински хероји у свету, једини неустрашиви победници на свима бојиштима у свима световима. Само је пут којим се љубав Христова усавршава у нама врло дугачак и тежак. Јер тај пут сачињавају све еванђелске врлине: јер еванђелска љубав расте, и живи, и усавршава се само кроз остале еванђелске врлине: молитву, пост, кротост, смиреност, трпљење, наду, веру и др. То је пут на коме бива и сустајања и посртања, али једини пут који одводи савршеној љубави. Зато св. Богослов благавести: »У љубави нема страха, него савршена љубав – ἡ τελεία ἀγάπη – изгони страх напоље; јер страх има муку. А ко се боји није савршен у љубави – οὐ τετελείωται ἐν τῇ ἀγάπῃ".'
        cn: 基督的圣爱引领我们穿越这一切，并在这一切中扶持我们。因此我们无所畏惧：死亡、罪恶、魔鬼、苦难、磨难、以及折磨都不能使我们惧怕。在基督的爱中，基督所有的神圣能力都同在，——那有什么能使这些能力惧怕呢？是死亡，还是罪恶，还是地狱，亦或是所有邪恶和地狱的势力？那爱，总是完全的，若在我们里面，便驱逐我们里面一切的恐惧。因此，基督徒是世上唯一真正的英雄，是所有世界上所有战场上唯一无所畏惧的胜利者。只是基督的爱在我们里面得以成全的道路，却漫长而艰难。因为那条道路由所有福音的德行所构成：福音之爱唯有通过其他的福音德行才能成长、存活并臻于完美：即祷告、禁食、温柔、谦卑、忍耐、盼望、信心等等。这是一条路上会有疲惫和跌倒的道路，但却是唯一通往完全之爱的道路。因此，圣约翰神学家传扬道：「在爱里没有惧怕，完全的爱——ἡ τελεία ἀγάπη——必把惧怕驱逐出去；因为惧怕里含有刑罚。惧怕的人在爱里尚未完全——οὐ τετελείωται ἐν τῇ ἀγάπῃ。」
    - type: paragraph
      text:
        ru: '4:19'
        cn: '4:19'
    - type: paragraph
      text:
        ru: '«Ми имамо љубав к Њему (ἀγαπῶμεν αὐτόν) у јер Он најпре показа љубав к нама (ἠγάπησεν ἡμᾶς). Ето одговора на питање: зашто волимо Христа? Волимо Га, јер Он најпре показа љубав према нама. На који начин? – Што за нас и место нас победи смрт, грех и ђавола, и дарова нам бесмртност и живот вечни. То и јасте једина истинска љубав; све остале љубави су истинске уколико су од ње, и уколико су као она. Наше христољубље је природни одговор на Христово човекољубље. Ниједна љубав на земљи није тако потпуно оправдана и заслужена као љубав наша према Христу. Нема ли човек љубави за Христа, зар је уопште човек? и зар је остао човек? То је знак да се у њему спарушило оно што је највредносније, најузвишеније, најчовечније, оно што га је чинило човеком, те је дегенерисао у неку наказу, у неко чудовиште, и сав се отиснуо у неку проклетост, у неку демонскост, у којој је сав пакао и све смрти. Тако нам постаје јасна она необична реч великог Апостола: »Ако ко не љуби Господа Исуса Христа – да буде проклет« (1Кор.16:22). Јер ван христолуубља нема благослова за људско биће, нема мира, нема радости, нема Истине, нема Правде, нема Бесмртности, нема Вечности, нема раја, нема блаженства.'
        cn: 我们爱祂 (ἀγαπῶμεν αὐτόν)，因为祂先爱了我们 (ἠγάπησεν ἡμᾶς)。这就是对「我们为什么爱基督？」这个问题的回答。我们爱祂，因为祂先爱了我们。以何种方式？——祂为我们、并代替我们战胜了死亡、罪恶和魔鬼，并赐予我们不死和永生。这才是唯一真实的爱；所有其他的爱，只有当它们源于这种爱，并与这种爱相仿时，才是真实的。我们爱基督之心是基督的人爱的自然响应。世上没有任何一种爱，能像我们对基督的爱那样，是如此完全地被证实和配得的。如果一个人没有对基督的爱，他还是人吗？他还能算是人吗？这表明在他里面，那最有价值的、最崇高的、最人性的、那使他成为人的东西已经枯萎，从而堕落成一个畸形物，一个怪物，并且完全陷入了某种诅咒、某种魔性之中，其中包含着所有的地狱和所有的死亡。如此，我们就明白了大宗徒那句非凡的话：「若有人不爱主耶稣基督，他就是可咒可诅的」（哥林多前书 16:22）。因为在爱基督之心之外，人类就没有祝福，没有平安，没有喜乐，没有真理，没有公义，没有不死，没有永恒，没有天堂，没有福乐。
    - type: paragraph
      text:
        ru: 4:20–21
        cn: 4:20–21
    - type: paragraph
      text:
        ru: 'Христољубље се грана у братољубље, у истинољубље, у правдољубље, у добротољубље, у светољубље, у мирољубље, у чистољубље, у љубав за све што је божанско, у љубав за све што је бесмртно, у љубав за све што је вечно. Све су ове љубави божанске, свете и вечне, јер им је корен – божански, свет и вечан. Корен: христољубље. Све су оне и природне и неопходне манифестације христољубља. Његове објективације, пројекције, реализације. Његова оваплоћења и остварења. Његови животи и начини постојања. Нема ли њих, нема христољубља. Нема ли христољубља, нема ни истинског богољубља ни истинског човекољубља. Христос је Богочовак, и љубав према Њему увек је и љубав према Богу и љубав према човеку: богољубље и човекољубље. У хришћанству: човекољубље је доказ богољубља, а богољубље – доказ човекољубља. Љубав према Богу се природно пројављује у љубави према човеку као боголиком бићу; а то значи: као божанском брату и вечном сабрату. Стога свети Богослав изузетно истиче ову благовест: »Ако ко рече: ја љубим Бога, а мрзи на брата свога, лажа је; јер који не љуби брата свога, кога види, како може љубити Бога, кога не види? И ову заповест имамо од Њега: који љуби Бога да љуби и брата свога«. Само осећан Богом, гледан из Бога, човек је човеку божански брат, бесмртни сабрат. А тако осећа, и тако гледа и види људе само човек који је у Христу Богу, у његовој божанској љубави.'
        cn: 基督之爱分支为兄弟之爱、真理之爱、公义之爱、良善之爱、圣洁之爱、和平之爱、纯洁之爱，以及对一切神圣、不朽和永恒之事的爱。所有这些爱都是神圣的、圣洁的、永恒的，因为它们的根是神圣的、圣洁的、永恒的。其根源：基督之爱。它们都是基督之爱的自然且必要的体现。它的客观化、投射和实现。它的具体化和实现。它的生命和存在方式。若没有它们，就没有基督之爱。若没有基督之爱，就没有真正的爱上帝之心，也没有真正的爱人之心。基督是神人，对祂的爱总是既是对上帝的爱也是对人的爱：爱上帝之心和爱人之心。在基督教中：爱人之心是爱上帝之心的证明，而爱上帝之心是爱人之心的证明。对上帝的爱自然地显现为对人的爱，视人为肖似上帝的存有；而这意味着：视人为一位神圣的弟兄和一位永恒的同胞。因此，圣约翰神学家格外强调这一福音：「若有人说：我爱上帝，却恨他的弟兄，他就是说谎的；因为那不爱他所看见的弟兄的，怎能爱他所看不见的上帝呢？我们从祂得了这条诫命：爱上帝的，也要爱他的弟兄。」 (约翰一书 4:20-21) 唯有在上帝中被感受，从上帝处被看待时，人对人而言才是神圣的弟兄，不朽的同胞。而唯有在基督上帝里，在祂的神圣之爱中的人，才能这样感受，这样看待和看见人。
  - type: heading2
    text:
      ru: Пета глава
      cn: 第五章
    children:
    - type: paragraph
      text:
        ru: 1 Јованова 5:1–21
        cn: 约翰一书 5:1-21
    - type: paragraph
      text:
        ru: '1Ин.5:1–21:1Сваки који вјерује да Исус јесте Христос, од Бога је рођен; и сваки који љуби родитеља, љуби и рођеног од њега. 2 По томе знамо да љубимо дјецу Божију кад Бога љубимо и заповијести његове држимо. 3 Јер ово је љубав Божија – да заповијести његове држимо; а заповијести његове нису тешке. 4 Јер све што је рођено од Бога побјеђује свијет; и ово је побједа која побиједи свијет – вјера наша. 5 Ко је тај који побјеђује свијет до онај који вјерује да Исус јесте Син Божији? 6 Он је тај што дође водом и крвљу, Исус Христос; не само водом, него водом и крвљу; и Дух је онај који свједочи, јер Дух је истина. 7 Јер је троје што свједочи на небу: Отац, Логос (Ријеч), и Свети Дух; и ова тројица су једно. 8 И троје је што свједочи на земљи: дух, и вода, и крв; и ово троје су уједно. 9 Ако примамо свједочанство човјечије, свједочанство је Божије веће; јер ово је свједочанство Божије које је посвједочио о Сину својему. 10 Који вјерује у Сина Божијега има свједочанство у себи; који не вјерује Богу начинио га је лажом, јер није вјеровао свједочанству којим је Бог посвједочио о Сину својему. 11 И ово је свједочанство да нам је Бог дао живот вјечни; и овај живот је у Сину његовом. 12 Онај који има Сина има живот; ко нема Сина Божијега нема живота. 13 Ово написах вама који вјерујете у име Сина Божијега, да знате да имате живот вјечни и да вјерујете у име Сина Божијега. 14 И ово је смјелост коју имамо према њему да нас послуша ако што молимо по вољи његовој. 15 И кад знамо да нас слуша што год молимо, знамо да имамо тражено што смо искали од њега. 16 Ако неко види брата својега гдје гријеши гријехом не на смрт, нека се моли, и даће му живот; онима који гријеше не на смрт. Има гријех на смрт, за њега не кажем да се моли. 17 Свака неправда је гријех; а има гријех не на смрт. 18 Знамо да сваки рођени од Бога не гријеши, него који је рођен од Бога чува себе, и нечастиви га се не дотиче. 19 Знамо да смо од Бога, и да свијет сав у злу лежи. 20 А знамо да је Син Божији дошао и дао нам разум да познајемо Истинитога; и јесмо у Истинитоме, у Сину његовом Исусу Христу. Он је истинити Бог и живот вјечни. 21 Дјечице, сачувајте себе од идола! Амин.'
        cn: '（约翰一书 5:1-21）


          1 凡相信耶稣是基督的，都是由上帝而生；凡爱生他的，也必爱那由他所生的。

          2 我们所以知道爱上帝的儿女，是因我们爱上帝，又遵守他的诫命。

          3 因为爱上帝，就是遵守他的诫命；并且他的诫命并不是难守的。

          4 因为凡由上帝而生的，就胜过世界；使我们胜过世界的，就是我们的信心。

          5 谁是胜过世界的呢？不是那相信耶稣是上帝儿子的吗？

          6 这藉着水和血而来的，就是耶稣基督；不只是藉着水，更是藉着水和血；并且作见证的是圣灵，因为圣灵就是真理。

          7 因为在天上作见证的有三位，就是父、道（圣言）、与圣灵；这三位乃是一。

          8 在地上作见证的有三者，就是灵、水与血；这三者是合一的。

          9 我们若领受人的见证，上帝的见证更是大的；因为这是上帝的见证，就是他为自己的儿子所作的见证。

          10 凡相信上帝儿子的，自己心里就有见证；凡不相信上帝的，就是把上帝当作说谎的，因为他不相信上帝为他儿子所作的见证。

          11 这见证就是上帝赐给我们永生；这永生也是在他儿子里面。

          12 凡有这儿子的，就有生命；凡没有上帝儿子的，就没有生命。

          13 我将这些事写给你们这些相信上帝儿子之名的人，要叫你们知道自己有永生，并且叫你们相信上帝儿子之名。

          14 我们向他所存坦然无惧的心是：凡我们照着他的旨意求什么，他就听我们。

          15 既然知道他听我们一切所求的，我们就知道必得着所求于他的。

          16 人若看见弟兄犯了不至于死的罪，就要为他祈求，上帝必赐他生命；就是为那些犯不至于死的罪的人。有至于死的罪，我不是说要为那罪祈求。

          17 凡不义的事都是罪；也有不至于死的罪。

          18 我们知道凡由上帝而生的，就不犯罪；却要保守自己，那恶者也就无法触碰他。

          19 我们知道我们是属上帝的，并且整个世界都卧在那恶者的权势之下。

          20 我们也知道上帝的儿子已经来到，并且赐给我们悟性，使我们认识那位真实的；我们也在那位真实的里面，就是在他的儿子耶稣基督里面。这位就是真上帝，也是永生。

          21 小子们哪，你们要远避偶像！阿们。'
    - type: paragraph
      text:
        ru: '5:1'
        cn: '5:1'
    - type: paragraph
      text:
        ru: '"Који год верује да је Исус – Христос, од Бога је рођен; и који год љуби онога који је родио, љуби и онога који је рођен од њега». Вера у Исуса као Месију, као Спаситеља света, вера је у Њега као Бога и Господа. А у таквој вери су сви разлози за безграничну љубав према Христу. Тако су вера и љубав уствари двоједна сила, двоједна врлина. Вера у Христа као Бога и Спаситеља, (она) и љуби Христа као Бога и Спаситеља. А љубав према Христу као Богу и Спаситељу, (она) и верује у Христа као Бога и Спаситеља. Да, само је то вера у Христа; и само се то може назвати вером у Христа, хришћанством, Христоверјем. Исто тако, истински љуби Христа ко Га љуби као Бога и Спаситеља, а не као нешто мање од тога. Само таква љубав је право хритољубље. Помоћу таквог христоверја и христољубља човек се заиста овим бићем рађа од Бога, јер свим бићем живи у Богу и ради Бога. У томе је благовест ових светих речи светог Благовесника (1Ин.5:1).'
        cn: 凡信耶稣是基督的，都是由神而生；凡爱生他之神的，也必爱从神生的。相信耶稣是弥赛亚，是世界的救主，就是相信祂是神和主。而在这等信仰中，包含着对基督无尽之爱的一切理由。因此，信仰与爱实际上是一体两面的力量，一体两面的美德。相信基督是神和救主，也爱基督是神和救主。而爱基督是神和救主，也相信基督是神和救主。是的，这才是对基督的信仰；也只有这才能被称为对基督的信仰、基督教、基督信德。同样，真正爱基督的，是那些爱祂为神和救主的人，而不是那些将其视为不及此者的人。只有这样的爱，才是真正的基督之爱。藉着这等基督信德和基督之爱，人才能真正以其全人由神而生，因为他以其全人活在神中并为神而活。这正是圣使徒这些圣言的福音 (约翰一书 5:1)。
    - type: paragraph
      text:
        ru: '5:2'
        cn: '5:2'
    - type: paragraph
      text:
        ru: '"По томе знамо да љубимо децу Божју кад Бога љубимо и његове заповести држимо«. – Ово је допуна горњих речи (1Ин.4:20–21): објашњава свети Богослов зашто треба љубити људе, браћу. Треба их љубити зато што су »деца Божја«, тј. што су боголика, божанска бића, носиоци божанских светиња и вредности; што су рођени од Бога, и зато личе на Бога. Љубећи Христа Бога, ми Њиме и због Њега љубимо и у људима све што је божанско, бесмртно, христолико, вечно и богочовечно. Не можемо љубити људе истинском љубављу, ако их не љубимо са тих разлога. Свака друга љубав је псевдољубав, назовиљубав, која се лако извија у нељубав, у мржњу према људима. Право човекољубље се извија из богољубља. А богољубље се развија држањем заповести Божјих. Само Бог даје божанске силе и истрајности човеку да може љубити људе и у гресима њиховим, љубити их без имало презирања и гађења. Јер ништа лакше него згадити се на човека због његове порочности, због његове смрдљивости, због његове црвљивости.'
        cn: 「我们知道我们爱上帝的孩子，当我们爱上帝并遵守祂的诫命时。」——这是对上面话语（约翰一书 4:20-21）的补充：圣神学家解释了为什么需要爱人，爱弟兄。爱他们是因为他们是「上帝的孩子」，即，他们是肖神性的、神圣的生命，是神圣圣物和价值的承载者；因为他们由上帝而生，因此肖似上帝。爱基督上帝，我们借着祂、因为祂而爱人里面一切神圣的、不朽的、肖似基督的、永恒的和神人性的。如果不是因为这些原因，我们就无法以真实的爱去爱人。其他一切的爱都是伪爱，所谓爱，它很容易扭曲成不爱，扭曲成对人的憎恨。真正的人爱源于神爱。而神爱则通过遵守上帝的诫命而发展。唯有上帝赐予人神圣的力量和坚韧，使人能够爱人，即便在他们的罪过中，也能爱他们而毫无轻蔑和厌恶。因为没有什么比因为一个人的堕落、他的恶臭、他的腐朽而厌恶他更容易的事了。
    - type: paragraph
      text:
        ru: '5:3'
        cn: '5:3'
    - type: paragraph
      text:
        ru: '"Јер је ово љубав Божја да заповести његове држимо; и заповести његове нису тешке». Љубити Бога значи живети по заповестима Бажјим. Без помоћи Божје, то је тешко и, скоро, немогуће. Али за напор, за труд Бог даје силе човеку да може испуњавати заповести његове. И то даје по мери труда. Што се више труди у испуњавању заповести Божјих, Бог му даје све више благодатне силе, док најзад за њега не постане сасвим лако држати заповести Божје. Код највећих трудбеника, подвижника то бива овако: сам Бог испуњава у њима своје заповести. Дословно се у њих испуњује реч светог Апостола: «Бог је што чини у вама да хоћете и чините што му је угодно» (Флп.2:13). Љубав увек ствара у души радосно расположење, те љубећи с радошћу испуњује жеље љубљенога, често и по цену највећих жртава. За човека који воли Господа Христа, заповести његове нису тешке. А воли Га ко истински верује у Њега као Бога и Господа. И човекољубиви Бог и Господ Христос увек обилно даје таквом човеку своје божанске силе, помоћу којих он лако испуњује божанске заповести његове.'
        cn: 「因为神的爱就是我们遵守祂的诫命；并且祂的诫命并非是难以遵守的。」爱神意味着按照神的诫命生活。没有神的帮助，这是困难的，并且几乎是不可能的。但是，对于人的努力和辛劳，神赐予人力量，使他能够遵行祂的诫命。并且这赐予是按照他的辛劳程度。他越是努力遵行神的诫命，神就赐给他越多恩典的力量，直到最终对他而言，遵守神的诫命变得完全容易。对于最伟大的劳苦者、苦修者而言，情况是这样的：神亲自在他们里面成就祂的诫命。圣使徒的话语真实地在他们身上应验了：「因为是神在你们心里运行，使你们立志行事，为要成就他的美意」（腓立比书 2:13）。爱总是在灵魂中产生喜乐的心境，于是以喜乐的心成就蒙爱者的愿望，常常甚至不惜付出最大的牺牲为代价。对于爱主基督的人而言，祂的诫命并非是难以遵守的。而爱祂的，是那些真正相信祂是神和主的人。并且那爱世人的神和主基督总是丰盛地赐予这样的人祂神圣的力量，借着这力量，他得以轻易地遵行祂的神圣诫命。
    - type: paragraph
      text:
        ru: 5:4–5
        cn: 5:4–5
    - type: paragraph
      text:
        ru: '"Јер сваки који је рођен од Бога побеђује свет – νικᾷ τὸν κόσμον; и вера је наша ова победа која победи свет. Ко је који свет побеђује (ὁ νικῶν τὸν κόσμον), осим онога који верује да је Исус – Син Божји?« – Свет као роб греха, смрти и ђавола, као »држава ђавола", као "држава смрти« (Евр.2:14), и јесте нешто противбожје, нешто што стално ратује против Бога. Нема сумње, савез греха, смрти и ђавола је страшна сила, јача од свега људског: јача од сваког човека посебно, и свих људи укупно. У нашем човечанском свету само се Богочовек Христос показао јачи од овог тројног савеза, јер је само Он разорио »државу смрти«, сатро ђавола, уништио грех. Ту свепобедну богочовечанску силу Он и даје свакоме који верује у Њега као у Бога и Господа, те побеђује »државу смрти«, греха и ђавола – свет. Тако је уствари само хришћанин једини прави победник у свету. Јер побеђује највећег непријатеља рода људског, троглавог непријатеља: грех, смрт и ђавола. Без Господа Исуса и његових следбеника овај свет би био, и занавек остао »држава смрти«, у којој влада најљудождерскија диктатура греха, зла и ђавола. Он то уствари и јесте за све који не верују у Христа као јединог истинитог Бога и јединог истинитог Спаситеља рода људског.'
        cn: 「因为凡是那由上帝而生的人都战胜世界——νικᾷ τὸν κόσμον；而我们的信仰就是这战胜世界的胜利。除了那相信耶稣是上帝之子的人吗，有谁是那战胜世界的人呢（ὁ νικῶν τὸν κόσμον）？」——世界，作为罪、死亡和魔鬼的奴仆，作为「魔鬼的国度」，作为「死亡的国度」（希伯来书 2:14），确实是某种敌对上帝之物，某种不断与上帝交战之物。毫无疑问，罪、死亡和魔鬼的联盟是一股可怕的力量，比一切属人的都更强大：比每个个体的人都更强大，也比所有人加起来更强大。在我们这个人类世界里，唯有神人基督显明比这三位一体的联盟更强大，因为唯有祂摧毁了「死亡的国度」，击败了魔鬼，消灭了罪。这股全然得胜的神人力量，祂也赐予每个相信祂是上帝和主的人，从而战胜了「死亡的国度」、罪和魔鬼——即是这世界。如此一来，事实上唯有基督徒才是世上唯一的真正胜利者。因为他战胜了人类最强大的敌人，这三头（三方面）的敌人：罪、死亡和魔鬼。没有主耶稣和祂的追随者，这个世界将会，并且永远是「死亡的国度」，在其中，罪、邪恶和魔鬼实行着最残暴的独裁统治。对于所有不相信基督是人类唯一的真上帝和唯一的真救主的人来说，这个世界事实上就是如此。
    - type: paragraph
      text:
        ru: '5:6'
        cn: '5:6'
    - type: paragraph
      text:
        ru: '"Ово је Исус Христос што дође водом и крвљу и Духом, не само водом него водом и крвљу; и Дух је који сведочи, јер Дух је истина – τὸ Πνεῦμά ἐστιν ἡ ἀλήθεια». Ето чиме Исус посведочује да је, иако човек, Син Божји: водом, крвљу и Духом. Уједно човек и Син Божји. Он је ујединио у себи Најглавније на небу са најглавнијим на земљи: Духа Истине са водом и крвљу. И тако је постао Спаситељ: Небеским је осветио земаљско, Божјим – људско, и на тај начин спасао род људски од греха, смрти и ђавола. Вода је најраспрострањенија стихија у свету; осветивши њу, Спас је осветио најглавнију стихију тела људског; показавши њу непокварљивом, кад се освети Духом Светим у име његово, показао је тиме да то важи и за тело људско. Крв је символ живота и сама сила живота; сматра се да је у крви и сама душа; поставши човек, тј. крв и тело, Спас је осветио ту главну стихију живота, учинио је крвљу Божјом, крвљу Господњом, нарочито у светој тајни Евхаристије, и тако показао да је и тело «за Господа», за бесмртност, за вечни живот. Кад се узнео са својим светим телом на небо да буде вечито с десне стране Оца славе, Он је то коначно посведочио и остварио. Све је то Он учинио Духом Својим, Духом Светим, Духом Истине. Њиме Он то непрестано посведочава у животу Цркве, јер је Дух Свети – душа Цркве. Он је носилац главног сведочанства о Исусу као Сину Божјем и Спаситељу, јер Он непрестано, кроза све векове, спасава у Цркви све који верују у Господа Христа. Он, Дух Истине, открива нам, казује нам, посведочава вам сву истину о Исусу, Богочовеку и Спаситељу. Да је Дух Свети – Дух Истине, и сама Истина, и сам Бог и Господ Животворни, показује својом осветитељском силом: освећује мртву стихију воде и чини је некварљивом; и вино претвара у крв Господа Христа у светој тајни Евхаристије. Акамоли да неће, или не може, осветити човека, живу душу, боголико створење. – О Исусу Истини сведочи сама Истина: Дух Свети. Јер су и Друго и Треће Лице Првсвете Тројице подједнако Истина, једна и иста вечна Истина, оличена у два вечна Лица Божанска. Та Истина и чини истинитима сва сведочанства сводока Исусових на земљи, јер се она сва и састоје «у доказивању Духа и силе» (= у показивању, у обелодањивању Духа и силе)» (1Кор.2:4). Стога духоносни Апостоли изјављују: «Ми смо његови (тј. Исусови) сведоци и Дух Свети кога Бог даде онима који се Њему покоравају» (Деян.5:32). «Сам Дух сведочи – συμμαρτυρεῖ – духу нашем" (Рим.8:16).'
        cn: 「这就是用水、血和圣灵而来的耶稣基督，不是单用水，乃是用水和血；并且有圣灵作见证，因为圣灵就是真理——τὸ Πνεῦμά ἐστιν ἡ ἀλήθεια。」看哪，耶稣以此见证他虽然是人，却是神的儿子：借着水、血和圣灵。他是同时为人，又是神的儿子。他将天上最主要的与地上最主要的联合在自己里面：将真理的圣灵与水和血联合。如此，他成了救主：用属天的圣化属地的，用神圣的圣化属人的，并借此将人类从罪恶、死亡和魔鬼中拯救出来。水是世上最普遍的元素；救主圣化了它，也圣化了人身体中最重要的元素；当水因他的名被圣灵圣化而成为不朽时，他借此表明这也适用于人的身体。血是生命的象征和生命本身的力量；人们认为灵魂也在血中；救主成为人，即血肉之躯，圣化了生命这一主要元素，使之成为神的血，主之血，尤其是在圣体圣事中，并因此表明身体也是「为主而有」，为着不朽，为着永生。当他带着自己圣洁的身体升天，永远坐在荣耀之父的右边时，他最终见证并实现了这一切。所有这一切，他都是借着自己的灵、圣灵、真理的灵而成就的。他借着圣灵在教会生活中不断地见证这一切，因为圣灵是教会的灵魂。他是关于耶稣作为神的儿子和救主的主要见证的承载者，因为他（圣灵）在历世历代中，在教会里不断地拯救所有信靠主基督的人。他，真理的圣灵，向我们启示、告知、并向你们见证关于耶稣、神人、救主的一切真理。圣灵是真理的灵，是真理本身，是赐生命的上帝和主，这都借着他圣化的能力显明出来：他圣化死寂的水元素，使之成为不朽；他也在圣体圣事中将酒变为主基督的血。他又怎会或怎能不圣化人，这活的灵魂，这肖乎神的受造物呢？——关于真理耶稣，真理本身即圣灵作见证。因为至圣三一的第二位格和第三位格同样是真理，是同一永恒的真理，体现于两位永恒的神圣位格之中。这真理也使地上所有耶稣见证人的见证真实可信，因为这些见证都包含在「圣灵和能力」的证明中（即，在圣灵和能力的显现、彰显中）(哥林多前书 2:4)。因此，蒙圣灵感动的使徒们宣称：「我们是这些事（即耶稣的事）的见证，圣灵也是，就是神赐给那些顺从他之人的。」(使徒行传 5:32)。「圣灵亲自与我们的灵同证——συμμαρτυρεῖ——」 (罗马书 8:16)。
    - type: paragraph
      text:
        ru: '5:7'
        cn: '5:7'
    - type: paragraph
      text:
        ru: '"Јер је троје што сведочи на небу: Отац, Логос и Свети Дух: и ово је троје једно – οἱ τρεῖς ἕν εἰσι». – Ето целе истине о Тројичином Божанству, разумски недокучљиве, али емпирички дате. Божанска стварност је безгранично и дубља и шира и вишља од свих људских способности мишљења, сазнања и осећања. То је и природно, кад је и сама вештаствена стварност овог земаљског, материјалног света несхватљиво шира и дубља и пространија од људског сазнања. Сам живот, као стварност коју ми жива људска бића доживљујемо, много је и шири и дубљи и вишљи од људске логике и разума, иако је то наша најнепосреднија и најстварнија стварност. Од огромног, свестраног океана живота тек нешто-нешто залази у људске сићушне капиларе сазнања. А сам океан се прелива и разлива кроз ко зна какве бескрајности и бесконачности. Ово у највећој мери важи за живот и божанске стварности Пресветог Тројичног Божанства. О Њему знамо колико нам је конкретно, емпиријски дано. А дано нам је врло много оваплоћењем Бога Логоса и борављењем Духа Светог у Богочовечанском телу Цркве. Дано нам је од Тросунчаног Божанства све што треба о Њему да знамо, и од Њега да имамо, како бисмо своје људско биће спасли греха, смрти и ђавола, и кроз свете тајне и свете врлине одвели га божанском савршенству: охристовљењу, одуховљењу, обожењу; једном речју: отројичењу. Да је Бог Тролично Биће, то је стварност коју људи непрестано доживљавају у Цркви, јер непрестано живе од Оца кроз Сина у Духу Светом. То је истина свестрано у Богочовеку откривена, а у Цркви потпуно остварена. О томе сведочи сав благодатни, али увек стварни, живот Цркве. И то сведочи материјалним, опипљивим, очигледним чињеницама, које су земаљски стварне и логички неоспориве. О њима благовести свети Благовесник:'
        cn: '因为在天上作见证的有三：圣父、道和圣灵；这三者乃是一 – οἱ τρεῖς ἕν εἰσι»。– 这就是关于三位一体神性的全部真理，它理智上不可企及，却经验性地被赐予。神圣的实在无限深广高远，超越了人类所有思维、认知和情感的能力。这也很自然，因为即使这个尘世物质世界的本体实在，也远超乎人类认知所能理解的宽广、深邃和浩瀚。生命本身，作为我们这些活生生的人类所体验的实在，也远比人类的逻辑和理性更广、更深、更高，尽管它是我们最直接、最真实的实在。从浩瀚、包罗万象的生命之洋中，只有极小一部分进入到人类认知那微小的毛细血管里。而这海洋本身则在不知名的无垠与永恒中满溢、流淌。


          这在最大程度上适用于至圣三位一体神性的生命和神圣实在。关于祂，我们所知的，仅限于具体、经验性地赐予我们的部分。借着道上帝的道成肉身，以及圣灵在教会的神人身体中的居住，我们被赐予了极多。三光之神性已将我们所需了解祂的一切，以及从祂那里所需拥有的一切赐予我们，好使我们的人性摆脱罪恶、死亡和魔鬼，并通过圣事和圣德将之引向神圣的完美：基督化、圣灵化、神化；总而言之：三一化。上帝是三位一体的存有，这是人们在教会中不断体验的实在，因为他们不断地在圣灵里，借着圣子，从圣父那里获得生命。这是在神人基督里全面启示，并在教会中完全实现的真理。教会所有充满恩典，却又总是真实的生命为此作证。它也以物质的、可触的、明显的史实作证，这些史实在尘世中真实存在且逻辑上无可辩驳。圣福音使者对此宣告说：'
    - type: paragraph
      text:
        ru: '5:8'
        cn: '5:8'
    - type: paragraph
      text:
        ru: '"И троје је што сведочи на земљи: дух, и вода, и крв; и троје је у једно – οἱ τρεῖς εἰς τὸ ἕν εἰσιν«. То је троје постало савршено једно најпре у Богочовеку: Бог, вечни Дух, постао је човек, сјединио се са телом и крвљу; и показао да је прави човек, савршен човек само у потпуном сједињењу са Богом. То је Господ Христос не само за себе био, него ради васцелог рода људског: претворивши себе у Цркву, Он је дао свима људима све потребне силе помоћу којих могу, ако хоће, да себе постепено преображавају у савршена људска бића живећи Богочовеком и у Богочовеку, нарочито у светој тајни Причешћа. Јер свето Причешће и није друго до света Тајна у којој се Бог конкретно и стварно оваплоћује у човека. На тај начин човек добија најстварније и најубедљивије сведочанство: да је човек – прави човек кроз сједињење са Богом, кроз живот у Богу, кроз стално оваплоћавање у себи светих, божанских, благодатних сила Божјих.'
        cn: 「地上有三样作见证的：就是圣灵，水，与血；这三样都归于一 — οἱ τρεῖς εἰς τὸ ἕν εἰσιν。」这三样首先在神人身上成为完美的合一：上帝，即永恒的圣灵，成为人，与身体和血合一；并显明唯有与上帝完全合一的人，才是真正的、完美的人。主基督这样做不仅是为了祂自己，也是为了全人类：祂将自己转化为教会，赐予所有人一切必需的能力，借此，他们若愿意，就能借由神人并在神人里面，尤其是在圣餐圣事中，逐渐将自己转化成完美的人。因为圣餐圣事无非是这样一种神圣的奥秘，上帝在此奥秘中具体而真实地道成肉身于人。如此，人就获得了最真实、最有说服力的见证：人之所以是真正的、完全的人，是透过与上帝的合一，透过在上帝里的生命，透过上帝神圣的、属神的、恩典的力量不断地在自身中道成肉身。
    - type: paragraph
      text:
        ru: 5:9–10
        cn: 5:9–10
    - type: paragraph
      text:
        ru: 'Такво је Божје сведочанство о Богочовеку, а кроза Њ о Пресветој Тројици. Сваки га човек, ако хоће, може проверити својим личним искуством, личним опитом, личним доживљајем. Све чиме је свемоћни и свезнајући Бог могао посведочити да је Исус заиста Бог и Спаситељ, посведочио је. Све друге стварности и истине у човечанском свету мање су посведочене од те Богочовекове стварности и истине. А када човек не прима ни тако савршено и убедљиво сведочанство Божје о Исусу, онда значи сматра Бога лажовом. То је највећи пад којим може пасти душа људска. У суштини сличан Јудином паду. Јер он, поред свих тако убедљивих и свеубедљивих сведочанстава, није хтео да поверује у Исуса као Бога и Спаситеља. Очигледна је истина: сви божански и човечански разлози за веровање у Христа као Бога и Спаситеља дати су роду људском у личности и раду Богочовека, у његовом Еванђељу, у његовој Цркви, у његовим Светитељима. Заиста, нема људима извињења за неверовање у Христа (ср.Ин.15:22–24). А који поверује у Христа, он свим срцем, свом душом, свим умом, свом снагом доживљује као највећу стварност сва Божја и људска сведочанства о Исусу као Богу и једином Спаситељу људи. Та стварност постаје у души његовој свестварност: он њоме живи, њоме мисли, њоме осећа. Његове све мисли сливају се у једну свемисао, његова сва осећања – у једно свеосећање; у ову свемисао, у ово свеосећање: Христос је Господ мој и Бог мој, Спаситељ мој, рај мој, живот мој, истина моја, љубав моја, радост моја, вечност моја, моје све и сва у свима световима. Да, потребан је само искрен лични сусрет са Господом Христом, па да човек поверује у Њега, и доживи све то. Као што су то доживели при личном додиру са Господом Христом Самарјани, и изјавили Самарјанки која их је упутила Исусу: »Сад ми верујемо, не због твојих речи, јер сами чусмо и познасмо да је овај заиста Спаситељ света, Христос« (Ин.4:42). Човек који живи вером у Господа Христа, стиче у себи свеубедљиво и свемоћно сведочанство о Исусу као Богу и Спаситељу, да му га никаква сила одузети не може. Свети Богослов благовести: »Који верује у Сина Божјег има сведочанство у себи; који не верује Богу, начинио га је лажом – ψεύστην -, јер не верова сведочанству које сведочи Бог за Сина свог".'
        cn: 这就是上帝对神人的见证，并藉着祂对至圣三位一体的见证。每个人，如果他愿意，都可以通过他个人的经验、亲身的体验、切身的感受来验证它。全能全知的上帝凡是能用来见证耶稣确实是上帝和救主的一切，祂都见证了。人世间所有其他的真实和真理，其受到的见证都少于这位神人的真实和真理。然而，当人连上帝对耶稣如此完美且有说服力的见证都不接受时，那就意味着他认为上帝是个骗子。这是人类灵魂可能遭遇的最大堕落。本质上与犹大的堕落相似。因为他，尽管有所有那些如此有说服力、完全令人信服的见证，却不愿相信耶稣是上帝和救主。真理显而易见：所有相信基督是上帝和救主的属神与属人的理由，都已藉着神人的位格和事工、藉着祂的福音、藉着祂的教会、藉着祂的圣者们赐予了人类。确实，人不信基督是无可推诿的（参 约翰福音 15:22-24）。然而，凡是信基督的人，他会全心、全灵、全意、全力地将所有关于耶稣是上帝和人类唯一救主的属神与属人的见证，体验为至高的真实。这份真实在他的灵魂中成为全部的真实：他靠它而活，靠它思想，靠它感受。他所有的思想汇聚成一个总思想，他所有的感受汇聚成一个总感受；这个总思想、这个总感受就是：基督是我的主，我的上帝，我的救主，我的乐园，我的生命，我的真理，我的爱，我的喜乐，我的永恒，我在万有中的一切和所有。是的，人只需与主基督进行一次真诚的个人相遇，就能相信祂并体验这一切。正如撒马利亚人在亲身接触主基督时所体验到的那样，他们向那位引领他们归向耶稣的撒马利亚妇人宣告说：「现在我们相信，不是因为你的话，而是因为我们亲耳听见，并且知道这人真是世界的救主，就是基督。」（约翰福音 4:42）凡是凭着对主基督的信仰而活的人，他就在自己里面获得了关于耶稣是上帝和救主的全然令人信服、全能的见证，没有任何势力能将它从他那里夺走。圣神学家宣告说：「信上帝儿子的，就有这见证在他心里；不信上帝的，就是将上帝当作说谎的（ψεύστην），因他不信上帝为祂儿子作的见证。」（约翰一书 5:10）
    - type: paragraph
