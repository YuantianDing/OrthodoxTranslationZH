      cn: 第四章
    children:
    - type: paragraph
      text:
        ru: 1 Јованова 4:1–21
        cn: '约翰一书 4:1-211 亲爱的弟兄啊，一切的灵，你们不可都信，总要试验那些灵是出于神的不是，因为世上有许多假先知已经出来了。

          2 凡灵认耶稣基督是成了肉身来的，就是出于神的，从此你们可以认出神的灵来。

          3 凡不认耶稣基督是成了肉身来的，就不是出于神，这是那敌基督者的灵。你们从前听见他要来，现在他已经在世上了。

          4 小子们哪，你们是属神的，并且胜了他们，因为那在你们里面的，比那在世界上的更大。

          5 他们是属世界的，所以说世界上的话，世人也听从他们。

          6 我们是属神的，认识神的就听从我们；不认识神的就不听从我们。从此我们可以认出真理的灵和谬妄的灵来。

          7 亲爱的弟兄啊，我们应当彼此相爱，因为爱是从神来的。凡有爱心的，都是由神而生，并且认识神。

          8 没有爱心的，就不认识神，因为神就是爱。

          9 神差他独生子到世间来，使我们借着他得生，神爱我们的心在此就显明了。

          10 不是我们爱神，乃是神爱我们，差他的儿子为我们的罪作了挽回祭，这就是爱了。

          11 亲爱的弟兄啊，神既是这样爱我们，我们也当彼此相爱。

          12 从来没有人见过神，我们若彼此相爱，神就住在我们里面，爱他的心在我们里面得以完全了。

          13 神将他的灵赐给我们，从此就知道我们是住在他里面，他也是住在我们里面。

          14 父差子作世人的救主，这是我们所看见也作见证的。

          15 凡认耶稣为神儿子的，神就住在他里面，他也住在神里面。

          16 神爱我们的心，我们也知道也信。神就是爱，住在爱里面的，就是住在神里面，神也住在他里面。

          17 这样，爱在我们里面得以完全，我们就可以在审判的日子坦然无惧；因为他如何，我们在这世上也如何。

          18 爱里没有惧怕；爱既完全，就把惧怕除去。因为惧怕里含着刑罚，惧怕的人在爱里未得完全。

          19 我们爱，因为神先爱我们。

          20 人若说「我爱神」，却恨他的弟兄，就是说谎话的；不爱他所看见的弟兄，怎能爱他没有看见的神呢？

          21 爱神的，也当爱弟兄，这是我们从神所受的命令。'
    - type: paragraph
      text:
        ru: '1Ин.4:1–21:1Љубљени, не вјерујте свакоме духу, него испитујте духове јесу ли од Бога; јер многи су лажни пророци изишли у свијет. 2 По овоме распознавајте Духа Божијег: Сваки дух који признаје да је Исус Христос у тијелу дошао, од Бога је; 3 А сваки дух који не признаје да је Исус Христос у тијелу дошао, није од Бога; и то је дух Антихриста, за којега сте чули да долази, и сада је већ у свијету. 4 Ви сте од Бога, дјечице, и побиједили сте их, јер је већи Онај који је у вама неголи који је у свијету. 5 Они су од свијета, зато говоре од свијета, и свијет их слуша. 6 Ми смо од Бога; који познаје Бога слуша нас, који није од Бога не слуша нас. По овоме познајемо духа истине и духа обмане. 7 Љубљени, љубимо једни друге; јер је љубав од Бога, и сваки који љуби од Бога је рођен, и познаје Бога. 8 Који не љуби не познаде Бога; јер Бог је љубав. 9 У томе се показа љубав Божија према нама што је Бог Сина својега Јединороднога послао у свијет да живимо Њиме. 10 У томе је љубав, не што ми завољесмо Бога, него што Он завоље нас, и посла Сина својега, као жртву помирења за гријехе наше. 11 Љубљени, кад овако Бог заволи нас, и ми смо дужни љубити једни друге. 12 Бога нико никада није видио; ако љубимо једни друге, Бог у нама пребива, и љубав је његова савршена у нама. 13 По овоме знамо да у Њему пребивамо, и Он у нама, што нам је дао од Духа својега. 14 И ми смо видјели и свједочимо да је Отац послао Сина – Спаситеља свијета. 15 Који призна да је Исус Син Божији, Бог у њему пребива и он у Богу. 16 И ми смо познали и повјеровали љубав коју Бог има према нама. Бог је љубав, и који пребива у љубави, у Богу пребива и Бог у њему. 17 Тиме се љубав показала савршеном у нама, да бисмо имали смјелости на Дан суда; јер као што је Он, и ми смо у овоме свијету. 18 У љубави нема страха, него савршена љубав изгони страх напоље; јер је у страху мучење, а ко се боји, није се усавршио у љубави. 19 Ми љубимо њега, јер Он први заволи нас. 20 Ако ко рече: Љубим Бога, а мрзи брата својега, лажа је; јер који не љуби брата својега којега види, како може љубити Бога, којега није видио? 21 И ову заповијест имамо од њега: Који љуби Бога, да љуби и брата својега.'
        cn: '(约翰一书 4:1-21)


          1 亲爱的，不要相信每一个灵，倒要试验那些灵是否出于神；因为有许多假先知已经来到世上。2 你们可以借此认出神的灵：凡是承认耶稣基督是道成肉身而来的灵，就是出于神；3 凡不承认耶稣基督是道成肉身而来的灵，就不是出于神。这就是那敌基督者的灵，你们曾听见它要来，如今它已经在世上了。4 你们是属神的，小子们，并且已经胜过了他们，因为在你们里面的，比那在世界上的更大。5 他们是属世界的，所以他们讲论世界的事，世人就听从他们。6 我们是属神的；认识神的就听从我们，不属神的就不听从我们。借此我们可以辨认出真理的灵和错谬的灵。


          7 亲爱的，我们应当彼此相爱，因为爱是出于神；凡有爱的都是由神而生，并且认识神。8 不爱的人就不认识神，因为神就是爱。9 神对我们显明了他的爱，就在于此：神差遣他的独生子来到世上，好叫我们藉着他得生。10 爱就在于此：不是我们爱神，而是神爱我们，并且差遣他的儿子，为我们的罪作了挽回祭。11 亲爱的，既然神这样爱我们，我们也应当彼此相爱。12 从来没有人见过神；如果我们彼此相爱，神就住在我们里面，他的爱就在我们里面得以完全了。13 借此我们知道我们住在他里面，他也住在我们里面：因为他把他的灵赐给了我们。14 我们也见过，也作证，父差遣了他的儿子作世人的救主。15 凡承认耶稣是神儿子的，神就住在他里面，他也住在神里面。16 我们也已经认识并相信神对我们所怀的爱。神就是爱；凡住在爱里的，就住在神里面，神也住在他里面。


          17 这样，爱就在我们里面得以完全了，好使我们在审判的日子可以坦然无惧；因为他怎样，我们在这世上也怎样。18 爱里没有惧怕，完全的爱能把惧怕驱逐出去；因为惧怕里有刑罚，惧怕的人，爱在他里面就没有得以完全。19 我们爱他，因为他先爱了我们。20 如果有人说：我爱神，却恨自己的弟兄，他就是说谎的；因为不爱自己看得见的弟兄，怎能爱自己看不见的神呢？21 我们从他那里领受了这条诫命：凡爱神的，也当爱自己的弟兄。'
