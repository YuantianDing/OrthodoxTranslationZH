    - type: paragraph
      text:
        ru: '"Победисте нечастивога", "победисте Злог« и сва његова зла. Чиме? Силом еванђелском; силом доживљеног Еванђеља, речи Божје. Јер свака доживљена еванђелска врлина испуњује човека божанском свепобедном силом. Живе ли у човеку све еванђелске врлине, ето – свепобедне божанске силе. Њој се не може супротставити никаква сила греха и зла, па ни сам творац њихов. Човек је јак Богом. Јак и непобедив Богочовеком. То објашњава свети Богослов: »Писах вам, младићи, јер сте јаки, и реч Божја, ὁ λόγος τοῦ Θεοῦ – у вама борави, и надвладасте нечастивога".'
        cn: 「你们战胜了那不虔者」，「你们战胜了那恶者」及其一切邪恶。靠什么？靠着福音的力量；靠着所体验的福音、上帝的道的力量。因为每一种被活出来的福音美德，都以神圣的全胜力量充满人。如果人里面住着所有的福音美德，看哪——那就是全胜的神圣力量。任何罪恶和邪恶的力量都无法抵挡它，甚至连它们的创造者本身也不能。人因上帝而刚强。因着神人而刚强且不可战胜。圣神学家解释说：「我写信给你们，少年人哪，因为你们刚强，上帝的道，ὁ λόγος τοῦ Θεοῦ – 在你们里面，你们也胜了那恶者。」 (约翰一书 2:14)
