    - type: paragraph
      text:
        ru: '"Не љубите свет ни што је на свету – τὰ ἐν τῷ κόσμῳ«. Зашто? Зато што »сав свет лежи у злу« (1Ин.5:19), што се помешао и изједначио са злом. Грех се тако вешто, помоћу најневидљивијих капилара, размрежио у свету, да их је тешко, и немаогуће, разлучити, раздвојити. И кроз капиларе своје пустио отров свој кроз природу и биће света. Грехољубљем својим свет се толико изједначио са злом, да су зло и свет постали синоними. Отуда је љубав према свету уствари љубав према греху и злу. Зато свети Богослов пише: »Ако ко љуби свет, нема љубави Очине (ἡ ἀγάπη τοῦ πατρὸς) у њему«. А љубав Очева = Очина? То је љубав према свему божанском, бесмртном, вечном: према Божанском Добру, према Божанској Истини, Правди, Љубави, Мудрости. То је засебан свет, сав изграђен од онога што је божанско, бесмртно, истинито, праведно, свемудро, вечно.'
        cn: 不要爱世界，也不要爱世界上的事物——тὰ ἐν τῷ κόσμῳ。为什么呢？因为「全世界都卧在那恶者手下」（约翰一书 5:19），它与邪恶混淆并等同起来。罪恶如此巧妙地，借助最微不可见的毛细血管，在世上蔓延成网，以至于难以，甚至不可能，将其分辨、分离。并透过其毛细血管，将其毒素释放，遍及世界的本质和存在。世界因其对罪的爱，与邪恶如此等同，以至于邪恶和世界成了同义词。因此，爱世界实质上是爱罪和爱恶。所以圣神学家写道：「人若爱世界，父的爱（ἡ ἀγάπη τοῦ πατρὸς）就不在他里面。」那么，父的爱等同于父爱吗？那是对一切神圣的、不朽的、永恒的爱：对神圣的良善、神圣的真理、公义、爱、智慧的爱。那是一个独特的世界，完全由神圣的、不朽的、真实的、公义的、全智的、永恒的事物所构成。
