    - type: paragraph
      text:
        ru: 'Као што је Светлост у Христу, тако је тама у нама. Тама од греха. Тама греха је разливена по сваком људском бићу без изузетка, зато ниједан човек, па ни «највећи између рођених од жена" није "светлост истинита". "Светлост истинита» је само оно људско биће које је потпуно без греха: безгрешно. А такво једино биће у роду људском јесте Богочовек Христос (ср.Ин.1:8–9). Штавише, због присутности таме у природи ниједан човек није не само «истинита светлост», него «светлост» уопште. Зато се и за Претечу вели: «Он не беше светлост» (Ин.1:8). То осећање и то сазнање да је све људско под грехом и у греху, основно је у истинском човекопознању, поготову у хришћанској антропологији. Ко супротно учи, себе вара, и нема истине у њему. Свако друго учење о човеку – лажно је. А такво је хуманистичко учење о човеку: оно апотеизира човека у његовој датости, непрочишћеној и неочишћеној од греха и његових злосила. Хуманизам је уопште идолопоклонство најгоре врсте, јер је човекопоклонство. Заснован на начелу: човек је по природи добар и сам себи довољан, – он заступа најтрагичнију неисстину, која је толике трагедије изазвала у свету хуманистичке науке, просвете, културе. Јер их је то одвело до таквог гордог самохвалисања, и величања човека као таквог, да су одрекли и само постојање греха. «Нема греха», – то је једна од основних етичких максима хуманистичких. А сама људска стварност толико је препуна недостатака, мана, пукотина, трагедија, да најречитије сведочи о присуству негативних, рушилачких сила у човеку, које и нису друго до силе греха. То и хуманизам признаје посредно својом теоријом о прогресу, који треба да људе излечи од свих негативитета, недостатака, мана, злосила. Само, такав лек, такво спасавање човека самим собом, личи на дављеника који себе хоће да спасе на тај начин што диже себе за косу. И – брзо се удави, разуме се. Нема трагичнијег схватања човека, и поступања са човеком, од хуманистичког. Јер одводи људе у најстрашније катастрофе. Стога свети Философ, истински познавалац човека и природе људске, саветује: «Ако речемо да греха – ἁμαρτίαν – немамо, себе варамо, и истине нема у нама – ἡ ἀλήθεια ἐν ἡμῖν οὐκ ἔστιν».[4]– И заиста, нико тако не вара себе, као хуманисти, као човекопоклоници свих врста. У њима нема истине о човеку.'
        cn: '正如基督里有光明，照样我们里面有黑暗。这黑暗源于罪。罪的黑暗毫无例外地弥漫在每一个人身上，因此没有人，甚至连「妇人所生最大的」也不是「真光」。「真光」唯独是那完全没有罪，即无罪的人。而在人类中，这样唯一的存在就是神人基督（参阅 约翰福音 1:8-9）。更甚者，由于本性中存在黑暗，没有人不仅不是「真光」，甚至根本就不是「光」。因此，对于施洗约翰也说：「他不是那光」（约翰福音 1:8）。这种所有人类都处于罪之下和罪之中的感受与认知，是真正认识人性（特别是基督教人类学）的基础。凡教导与此相反的，就是欺骗自己，他里面没有真理。任何其他关于人的教导都是虚假的。而人文主义关于人的教导就是如此：它将处于其既定状态，未被洁净、未被罪及其恶势力净化的人神化。人文主义普遍来说是种类最糟糕的偶像崇拜，因为它是一种人崇拜。它建立在「人本性善良且自给自足」的原则上，主张着最悲剧性的不真理，这在人文主义的科学、教育、文化世界中引发了如此多的悲剧。因为这把他们引向了如此骄傲的自夸，以及对人本身的颂扬，以至于他们甚至否认了罪的存在。「没有罪」——这是人文主义伦理学的基本准则之一。然而，人类的现实却充满了缺陷、缺点、裂痕、悲剧，最雄辩地证明了人里面存在着消极的、破坏性的力量，而这些力量正是罪的力量。连人文主义也通过其关于进步的理论间接承认这一点，该理论认为进步应该治愈人类所有消极性、缺陷、缺点、恶势力。然而，这样的疗法，这种人靠自己拯救自己的方式，就像一个溺水者想通过抓住自己的头发来救自己一样。而——不言而喻——他会很快溺毙。没有比人文主义更悲剧性的人类观，也没有比人文主义更悲剧性的人际相处之道。因为它将人们引向最可怕的灾难。


          因此，圣哲人，这位真正了解人及其人性的，建议道：「我们若说自己没有罪——ἁμαρτίαν——便是自欺，真理就不在我们里面——ἡ ἀλήθεια ἐν ἡμῖν οὐκ ἔστιν」。[4]——确实，没有人像人文主义者，像各种类型的人崇拜者那样自欺。他们里面没有关于人的真理。'
    - type: paragraph
      text:
        ru: '1:9'
        cn: '1:9'
    - type: paragraph
      text:
        ru: 'Истина о човену је на супротној страни: у осећању и сазнању и признању да су сви људи под грехом и у греху. Јер само то осећање, то сазнање, то признање побуђује људе да траже спасење од греха и његових злосила, да траже Спаситеља. А Спаситељ од греха може бити само онај који је без греха. Такав није нико од људи; такав је у роду људском само Бог и Гопод наш Исус Христос. Сведок тога је – свеколико искуство рода људског. Сви остали такозвани «спасиоци» човечанства, самозванци су, самохвалисавци су, јер сви без изузетка спасавају и лече ћовека од његових површинских, кожних обољења, али не и од његове главне, суштинске болести, болести бића његовог: греха, и у греху – смрти. Зато је за све њих: смрт – неопходност људског бића. А ово тврђење укључује у себи још и ово: грех је неопходност. На таким апсурдностима градити дом човекова бића и просперитета, трагичан је подухват, који се увек завршава катастрофом. Излаз из тога је један: непристрасно гледање у човека, у његове стварности, и сагледање конкретно присутних у њему, и разливених по бићу његовом, злосила греха; констатовање тога, и признање да нас од тога може спасити само безгрешни Богочовек Христос. Такво признање, такво исповедање побуђује човекољубивог и свеправедног Господа, да нам притекне у помоћ и – спасе нас од греха. Без тог признања Он не долази, да не би наметао Себе силом, и тиме уништио у човеку слободу и љубав, на којима човек стоји, и ради којих и постоји. Богочовек је савршено праведан; то Му даје и право и власт да опрашта грехе. А усто, савршена богочовечанска праведност даје Му моћ те може опраштати грехе, и отпуштати. А то је моћ коју има само Безгрешни Богочовек. Свети Богослов благовести: «Ако признајемо – ὁμολογῶμεν – грехе своје, веран је и праведан (πιστός ἐστι καὶ δίκαιος) да нам опрости грехе наше, и очисти нас од сваке неправде». Πιστός: веран, чему? веран човеку, из љубави веран: веран боголикој души човековој; верује да она ослобођена греха, може човека одвести кроз еванђелске подвиге у божанско савршенство; верује да човек може израдити из себе «човека савршена», да може бити диван: и побожан, и праведан, и истинољубив, и добар, и кротак, и свим светим врлинама украшен. Од нас се тражи једно: признање да смо грешни, а све остало чини Он, човекољубац једини, и Спаситељ једини: отпушта грехе, очишћава нас од сваке неправде; и као «праведан и веран» даје нам божанске силе да истрајемо у новом животу, животу «у правди и светињи истине" (Еф.5:24).'
        cn: '关于人的真理，存在于对立的一面：在于感觉、认识和承认所有人都处于罪之下，并在罪中。因为唯有这种感觉、这种认识、这种承认，才能促使人们去寻求脱离罪及其邪恶势力的拯救，去寻求救主。而罪的救主只能是那位无罪的。人类中无一人如此；这样的一位，在人类中唯有神和我们的主耶稣基督。对此的见证是全人类的经验。其他所有所谓人类的「救主」，都是冒牌货，都是自夸者，因为他们无一例外地拯救并医治人脱离其表面的、皮肤的疾病，但却不能使其脱离其主要的、本质的疾病，即其存在的疾病：罪，以及在罪中的——死亡。因此，对所有这些人来说：死亡是人类存在的必然。而这种论断还包含这一点：罪是必然的。在这样的荒谬之上，建造人类存在与繁荣的殿堂，是一项悲剧性的事业，它总是以灾难告终。


          走出困境的途径只有一个：客观公正地审视人，审视他的现实，并洞察具体存在于他之内，且弥漫于他整个存在中的罪的邪恶势力；确认这一点，并承认唯有无罪的神人基督能将我们从中拯救出来。这样的承认，这样的告白，促使那位爱人且全然公义的主，来帮助我们，并——将我们从罪中拯救出来。没有这种承认，他便不来，免得他强行施加自己，从而摧毁人里面的自由和爱，人赖以生存，并因此而存在的一切。


          神人是全然公义的；这赋予他赦免罪的权利和权柄。此外，全然的神人公义赋予他赦免和宽恕罪的权能。而这权能唯有无罪的神人方能拥有。圣神学家宣扬道：「如果我们承认——ὁμολογῶμεν——我们的罪，他是信实且公义的（πιστός ἐστι καὶ δίκαιος），为要赦免我们的罪，并洁净我们脱离一切的不义。」（约翰一书 1:9） Πιστός：信实的，信实于什么？信实于人，出于爱而信实：信实于人那神似的灵魂；他相信，那脱离了罪的灵魂，能引导人通过福音的苦修进入神圣的完全；他相信人能将自己塑造成「完全的人」，能变得美好：既虔敬，又公义，又爱真理，又善良，又温柔，并以一切圣洁美德为妆饰。我们被要求做一件事：承认我们是有罪的，而其他一切都由他来成就，他——那唯一爱人者，和唯一的救主：他赦免罪，洁净我们脱离一切的不义；并且作为「公义和信实的」，他赐予我们神圣的力量，使我们能在新生命中，在「公义和真理的圣洁」中持守（以弗所书 5:24）。'
