    - type: paragraph
      text:
        ru: '"Ако речемо да не сагрешисмо, градимо га лажом – ψεύστην ποιοῦμεν αὐτὸν, – и реч његова није у нама». Спаситељ је дошао у наш свет, да нас спасе од греха. Он то сам непрестано наглашава у своме Еванђељу. Ако пак ми станемо тврдити да не сагрешисмо, да немамо греха, онда Спаситеља правимо лажљивцем. Јер каже да је дошао да нас спасе од греха, а ми грехе немамо. Он је дошао у свет, зато што смо грешни, робави греха и смрти. Признајемо ли грешност своју, ми признајемо потребу за Спаситељем и спасењем. Онда је «реч Његова у нама». А реч Његова је Еванђеље његово, Еванђеље спасења. Човекопоклоници говоре: ми греха немамо, какав нам је Спаситељ потребан? Није нам потребан Спасистељ, јер нема од чега да нас спасава. Ако имамо неке недостатке, ми ћемо то исправити просветом, културом, науком, техником. Бог нам уопште није потребан. – Тако човекопоклоници оглашују Спаситеља за самохвалисавог лажљивца, и тиме за непријатеља човечанства.'
        cn: 「如果我们说没有犯过罪，我们就使他成为说谎者——ψεύστην ποιοῦμεν αὐτὸν——他的话语就不在我们里面。」救主来到我们的世界，是为了将我们从罪中拯救出来。他亲自在他的福音中不断强调这一点。然而，如果我们开始声称我们没有犯过罪，我们没有罪，那么，我们就使救主成为说谎者。因为他说他来是为了将我们从罪中拯救出来，而我们却没有罪。他来到世上，是因为我们有罪，是罪和死亡的奴隶。如果我们承认自己的罪性，我们就承认了对救主和救恩的需求。那么，「他的话语就在我们里面」。而他的话语就是他的福音，救恩的福音。崇拜人者说：「我们没有罪，我们需要什么样的救主呢？我们不需要救主，因为没有什么可从其中拯救我们。如果我们有一些缺点，我们会通过启蒙、文化、科学、技术来纠正它们。我们根本不需要上帝。」——如此，崇拜人者宣告救主是自夸的骗子，从而也是人类的敌人。
