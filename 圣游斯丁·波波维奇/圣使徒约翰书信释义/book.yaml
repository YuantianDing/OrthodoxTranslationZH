    - type: paragraph
      text:
        ru: '"Свака је неправда грех – πᾶσα ἀδικία ἁμαρτία ἐστί -; и има грех не к смрти«. – Шта је неправда можемо знати само ако знамо шта је правда. Род људски никад не би јасно, одређено и тачно знао шта је правда, да се сама »правда Божја« није јавила у лицу Богочовека Христа. Тек смо у Њему сагледали праву, целцату правду, и од Њега сазнали шта је правда. Шта је, дакле, правда? – Богочовек Христос и Његово Еванђеље. А неправда? – Све што није Он, и што није од Њега; све што није његово Еванђеље, и од његовог Еванђеља. Зато је вера у Христа – »служба правде« (2Кор.3:9) и служба правди. Ко не служи Њему, служи неправди. Као што је свака неправда грех, тако је и сваки грех неправда. Неправедник је обавезно грешник; и обратно: грешник је обавезно неправедник. Само живот по Еванђељу Христовом преображава неправедника у праведника; једино са Христом и у Христу човек постаје и сам »правда Божја« (2Кор.5:21). Само који је вером »рођен од Њега" – "твори правду« (1Ин.2:29), а »који твори правду праведник је, као што је Он праведан" (1Ин.3:7).'
        cn: 所有不义都是罪—— πᾶσα ἀδικία ἁμαρτία ἐστί ——且有不至于死的罪。——什么是不义，我们只有知道什么是公义才能知晓。人类永远无法清晰、确定而准确地知晓什么是公义，除非「上帝的公义」亲自显现于神人基督的位格之中。唯独在祂里面，我们才看到了真正、完全的公义，并从祂那里知晓了什么是公义。那么，什么是公义呢？—— 就是神人基督和祂的福音。那不义呢？—— 就是一切不属于祂的，以及一切非源于祂的；一切不属于祂的福音的，以及一切非源于祂的福音的。因此，对基督的信仰——就是「公义的职事」（哥林多后书 3:9）和对公义的服事。不服事祂的，就是服事不义。正如所有不义都是罪，同样，所有罪也是不义。不义之人必然是罪人；反之亦然：罪人必然是不义之人。唯有按照基督的福音生活，才能将不义之人转化为义人；唯独与基督同在并内在于基督，人才能自己也成为「上帝的公义」（哥林多后书 5:21）。唯有那借着信心「由祂而生」的人——才「行公义」（约翰一书 2:29），而「行公义的，就是义人，正如祂是公义的」（约翰一书 3:7）。
