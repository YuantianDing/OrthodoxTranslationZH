      text:
        ru: 'Шта је дух? Суштину духа не знамо, али његове пројаве знамо и на оонову њих закључујемо: дух је бестелесно биће, личност која располаже разумом и слободом; и као личност поступа и пројављује се. Суштину духа исто тако мало знамо као и суштину материје. Оне су обавијене непрозирним велом тајанствености. Нема сумње, и суштина духа и суштина материје казују себе делимично, донекле, преко својих пројава. Човек је духотеласно биће. Али, иако дух сачињава оно што је битно у човеку, ипак ни сам човек не зна суштину свога духа. Он њиме мисли, осећа, живи, гледа, чује, па ипак не зна шта је суштина духа. Не зна његову грађу, од чега је. Духом сазнаје и себе и свет око себе, а не зна суштину сазнања, од чега је, од какве грађе. На таквој је тајанствености саграђено људско биће. На основу свога духа човек закључује и о постојању других духова, и на основу њихових пројава. Различни су духови, јер су различне и пројаве њихове. Тек од силаска Светова Духа на дан св. Педесетнице људима је конкретно показан Дух Божји, шта је и какав је. И на тај начин први пут им дата могућност и мерило за правилну оријентацију у свету духовног. Од св. Педесетнице ми знамо шта је Дух Божји. Знајући то, ми у исто време знамо и шта није Дух Божји: све што није као Он, што не личи на Њега већ има супротне особине, тај дух није од Бога. То је најсигурније мерило. Дух Божји, Дух Свети сав је у сведочењу да је Исус – Син Божји, Бог и Господ, Спаситељ света. Сва његова делатност у свету своди се на то сведочанство: да је Исус – Богочовек. Дух Свети то сведочи свима својим пројавама, делима, чудесима, благодатним силама. И то у Цркви преко духоносних људи. Нарочито преко светости њиховог живота.'
        cn: 什么是灵？我们不知道灵的本质，但我们知道它的显现，并根据它们得出结论：灵是一种无形体的存有，一个拥有理性和自由的位格；并且作为一个位格行事并显现。正如我们对物质的本质所知甚少一样，我们对灵的本质也所知甚少。它们都被一层不透明的神秘面纱所笼罩。毫无疑问，灵的本质和物质的本质都通过它们的显现，部分地、某种程度上展现自身。人是灵肉一体的存有。然而，尽管灵构成了人的本质部分，但人自己仍然不知道他自身灵的本质。他藉着灵思想、感受、活着、观看、聆听，然而他仍然不知道灵的本质是什么。他不知道它的构造，不知道它由何构成。人藉着灵认识自己和周围的世界，却不知道认知的本质，它由何构成，由何种构造组成。人类的存有就是建立在这种奥秘之上。人根据他自身的灵，推断出其他灵的存在，并根据它们的显现。灵是各不相同的，因为它们的显现也是各不相同的。直到在圣五旬节那天圣灵降临，上帝的灵才具体地向世人显明，祂是什么以及祂是怎样的。通过这种方式，他们才第一次获得在属灵世界中正确定位的可能性和衡量标准。自圣五旬节以来，我们知道上帝的灵是什么。知道这一点，我们同时也知道什么不是上帝的灵：凡是不像祂的，不与祂相似的，反而具有相反特性的，那灵就不是来自上帝的。这是最可靠的衡量标准。上帝的灵，即圣灵，祂的一切都在于见证耶稣是——上帝之子、上帝和主、世界的救主。祂在世上的一切作为都归结为这一见证：即耶稣是——神人。圣灵通过祂所有的显现、作为、神迹、恩典的能力来见证这一点。并且在教会中通过那些有灵的人。尤其是通过他们生命的圣洁。
    - type: paragraph
      text:
        ru: '4:1'
        cn: '4:1'
    - type: paragraph
      text:
        ru: 'Наш земаљски свет је обиталиште духова, разноврсних и многих. За хришћанско сазнање он је просто пробалиште, кушалиште духова. И врло је тешко снаћи се. Јер разликовање духова у исто време је и дар Светога Духа и подвиг човеков. То је читава наука. Дух Свети даје човеку дар «да разликује духове – διακρίσεις πνευμάτων» (1Кор.12:10). И то даје га за веру и остале врлине, које сачињавају један недељив еванђелски подвиг. Тај подвиг је истовремено и дело благодати Божје и дело слободног труда човековог. Дуго се човек обучава и вежба у разликовању духова; постепено се усавршава; и само савршени имају дар за разликовање духова, за сасвим јасно оријентисање, за сасвим јасно знање и сагледање добра и зла у њиховој суштини. Зато духоносни Апостол и благовести: «Савршених је тврда храна, који имају осећања – τὰ αἰσθητήρια (= чула, чувства) дугим вежбањем обучена – γεγυμνασμένα (= извежбана) за разликовање – πρὸς διάκρισιν – и добра и зла» (Евр.5:14). Значи: способност за разликовање добра и зла, добрих и злих духова се стиче духовним вежбањем, духовном «гимнастиком», духовним подвигом. То је пре свега благодатна пракса, којом се постиже благодатна мудрост која једина и уме да се правилно снађе у човечанском свету духова, и да тачно разликује духове јесу ли од Бога или нису. Зато свети Богослов са много љубави и бриге саветује хришћанима: «Љубљени, не верујте свакоме духу, него кушајте духове – δοκιμάζετε τὰ πνεύματα (пробајте духове) јесу ли од Бога; јер многи лажни пророци изиђоше на свет». – Блатодатним подвизима извежбана чула, и спољашња и унутрашња, могу са сигурношћу одредити је ли неки дух од Бога или није. Τὰ αἰσθητήρια[7]се вежбају помоћу свих благодатних еванђелских врлина; молитвом, да би сва чула постала омолитвљена (омолитвљено око); љубављу, да би сва била ољуботворена; милостивошћу, да би сва била омилостивљена, итд. Неизвежбана, необлагодаћена чула лако заведу и саблазне лажни пророци.'
        cn: 我们的尘世是诸灵的居所，各式各样，数目繁多。对于基督教的认知而言，它简直就是试炼场，是考验诸灵之地。要明辨方向非常困难。因为分辨诸灵同时既是圣灵的恩赐，也是人的功修。这是一门完整的学问。圣灵赐予人「分辨诸灵——διακρίσεις πνευμάτων」的恩赐（哥林多前书 12:10）。祂将这恩赐赐给信德以及其他构成一项不可分割的福音性功修的美德。这项功修同时既是上帝恩典的工作，也是人自由努力的成果。人长久地在分辨诸灵方面接受训练和操练；他逐渐趋于完善；只有那完善的人才拥有分辨诸灵的恩赐，以求完全清晰的辨明方向，完全清晰地认识和洞察善与恶的本质。因此，荷负圣灵的使徒宣告说：「完善的人当吃干粮，他们藉着长久的操练，使感官——τὰ αἰσθητήρια（= 感官，知觉）受过训练——γεγυμνασμένα（= 受过操练的），为要分辨——πρὸς διάκρισιν——善与恶」（希伯来书 5:14）。这意味着：分辨善与恶，分辨良善之灵与邪恶之灵的能力，是藉着属灵的操练，属灵的「体操」，属灵的功修而获得的。这首先是一种恩典性的实践，借此获得恩典的智慧，唯有它才能正确地应对人类的灵性世界，并准确地分辨诸灵是否来自上帝。因此，圣神学家带着极大的爱与关怀建议基督徒：「亲爱的，不要相信每一个灵，却要试验那些灵——δοκιμάζετε τὰ πνεύματα（试验那些灵），看它们是否来自上帝；因为有许多假先知已经来到世上。」藉着恩典的功修所操练的感官，无论外在的还是内在的，都可以确定地判定某个灵是否来自上帝。感官[7]藉着所有恩典性的福音美德得到操练；借着祷告，使所有感官都变得充满祷告（如祷告的眼睛）；借着爱，使所有感官都变得充满爱；借着怜悯，使所有感官都变得充满怜悯，等等。未受操练的、未蒙恩典的感官，容易被假先知诱惑和迷惑。
    - type: paragraph
      text:
        ru: 4:2–3
        cn: 4:2–3
    - type: paragraph
      text:
        ru: 'Уствари, сви се духови своде на две врсте: на оне од Бога и оне од ђавола. Од Бога су они који признају, исповедају да је Исус – оваплоћени Бог Логос, Господ и Спаситељ; а од ђавола су они ,који то не признају. Ђаволова је философија сва у овоме: не признати Бога у свету: не признати његово присуство у свету; не признати његово оваплоћење у свету; тврдити и проповедати: нема Бога ни у свету, ни у човеку; нема Бога ни у Богочовеку; бесмислица је веровати да се Бог оваплотио у човека, и да може живети у човеку; човек је сав без Бога, биће у коме нема Бога, нити ишта Божје, ишта божанско, бесмртно, вечно; човек је сав пролазан, сав смртан; по свему он припада животињском свету, и готово се ни по чему не разликује од њих, зато је и природно да живи као животиње, које су му једини законити претци и прапретци а и природна сабраћа. Таква је уствари философија Антихриста, који по сваку цену хоће да замени Христа, да заузме његово место у свету и у човеку. Свети Богослов јасно показује ту истину: «По овоме познајте Духа Божјега, и духа лажнога: сваки дух који признаје – ὁμολογεῖ (= исповеда) да је Исус Христос у телу дошао, од Бога је. А сваки дух који не признаје да је Исус Христос у телу дошао, није од Бога: и овај је антихристов, за кога чусте да ће доћи, и сад је већ на свету – ἐν τῷ κόσμῳ". "Сваки дух»: дух може бити личност, или учење, или идеја, или мисао. Свако учење, свака идеја, свака мисао која не признаје да је Исус – Бог и Спаситељ, оваплоћени Бог, Богочовек, – води порекло од антихриста, антихристовска је. А таквих је и личности, и учења, и идеја било од саме појаве Христове у свету, зато свети Тајновидац и вели за Антихриста: «и сад је већ у свету». Сваки човек, свака идеја у свету која одриче Цркву Христову од антихриста је. Сваке антихришћанске идеологије творац је антихрист, посредно или непосредно. Уствари, све се идеологије могу свести на две врсте: оне за Христа и оне за антихриста. Човек је у овом свету да реши један проблем уствари: да ли је за Христа или против Христа? И сваки човек, хтео или не, само тај проблем и решава. Он је или Христољубац или Христоборац, – трећега нема. Христопоклоник или Христоненавидник.'
        cn: '实际上，所有的灵都归结为两种：属神的和属魔鬼的。属神的灵，是那些承认并宣认耶稣是道成肉身的神——逻各斯，是主和救主的；而属魔鬼的灵，则是不承认这些的。魔鬼的哲学全部在于此：不承认神在世上；不承认祂在世上的临在；不承认祂在世上的道成肉身；坚称并宣讲：在世上无人里面都没有神；在神人里面也没有神；相信神道成肉身为人，并能住在人里面是荒谬的；人完全没有神，是一个没有神，也没有任何属神、神圣、不朽、永恒之物的存有；人完全是短暂的，完全是必死的；从各方面看，他都属于动物界，几乎与它们没有任何区别，因此他像动物一样生活是自然的，因为动物是他唯一的合法祖先、先祖，也是他自然的同类。这实际上就是敌基督的哲学，他（敌基督）不惜一切代价要取代基督，要在世上和人里面占据祂的位置。圣神学家清晰地指出了这个真理：「你们可以从这一点认出神的灵和虚谎的灵：凡灵承认——ὁμολογεῖ （即：宣认）耶稣基督是成了肉身来的，就是属神的。凡灵不承认耶稣基督是成了肉身来的，就不是属神的；这就是那敌基督者的灵，你们曾听见说它要来，现在它已经在世上了——ἐν τῷ κόσμῳ。」（约翰一书 4:2-3）

          「凡灵」：灵可以是人格，可以是教义，可以是思想，也可以是念头。凡不承认耶稣是神和救主，是道成肉身的神，是神人的教义、思想和念头，都源自敌基督，是敌基督性的。而像这样的人格、教义和思想，自基督在世上显现以来就一直存在，所以圣启示者（约翰）论到敌基督时也说：「现在它已经在世上了。」世上凡是弃绝基督教会的每一个人，每一个思想，都源自敌基督。每一反基督教意识形态的创造者都是敌基督，无论是间接的还是直接的。实际上，所有的意识形态都可以归结为两种：拥护基督的和拥护敌基督的。人活在世上，实际上只为解决一个问题：他是拥护基督，还是反对基督？无论他愿意与否，每个人都只在解决这个问题。他要么是爱基督者，要么是与基督为敌者——没有第三种。他是崇拜基督者，抑或是憎恨基督者。'
    - type: paragraph
      text:
        ru: '4:4'
        cn: '4:4'
    - type: paragraph
      text:
        ru: 'Овај је свет бојиште на коме се стално бије бој за Христа и против Христа, ратиште на коме се стално ратује за Христа и против Христа. Они који су «од Бога» боре се за Христа, и надвлађују оне што су против Христа, надвлађују их Христом Богом који је у њима. А Он је у нашим човечанским световима једини Победитељ греха, смрти и ђавола, и свега шго је од њих и ради за њих, па била то наука, или култура, или религија, или уметност, или философија, или која друга делатност људска. Робље антихришћанских (а то је увек антихристовских) идеја је разноврсно и многобројно, и оно се свим средствима бори против Христа. Заиста, «наш рат није са крвљу и са телом, него с поглаварима и властима и управитељима таме овога света, с духовима зла ипод неба» (Еф.6:12). Оружје нашег војевања су еванђелске врлине: трпљење, љубав према непријатељима, молитва, пост, истина, правда, доброта, кротост, смерност и др. (ср.Еф.6:13–18). Војујући тим оружјем ми увек односимо победу помоћу Господа Христа који нас љуби (Рим.8:37). Стога свети Богослов благовести: «Ви сте од Бога – ἐκ τοῦ Θεοῦ ἐστε -, дечице, и надвладасте – νενικήκατε – их (= победисте их), јер је већи који је у вама него ли који је у свету».'
        cn: 这个世界是一个战场，在其中不断地进行着为基督而战和与基督为敌的争战；也是一个战区，在其中不断地发动着为基督而战和与基督为敌的战争。那些「属乎神」的人为基督而战，并胜过那些与基督为敌的人，借着在他们里面的基督神胜过他们。而祂在我们的人类世界中，是罪、死亡和魔鬼，以及一切源于它们并为它们效力之事物——无论是科学、文化、宗教、艺术、哲学，还是任何其他人类活动——的唯一得胜者。那些受反基督教（这始终是敌基督的）思想奴役的人，是多样且众多的，并且他们使用一切手段与基督争战。确实，「我们的争战并非对抗血肉之躯，而是对抗那些执政的、掌权的、这幽暗世界的统治者，以及天空属灵气的恶魔」（以弗所书 6:12）。我们争战的武器是福音的德行：忍耐、爱仇敌、祷告、禁食、真理、公义、良善、温柔、谦卑等（参阅以弗所书 6:13-18）。借着这些武器争战，我们总是借着爱我们的主基督得胜（罗马书 8:37）。因此，圣神学家宣告说：「孩子们，你们是属乎神的 — ἐκ τοῦ Θεοῦ ἐστε —，并且你们已经胜过了 — νενικήκατε — 他们（=战胜了他们），因为在你们里面的比在世界上的更大。」
    - type: paragraph
      text:
        ru: '4:5'
        cn: '4:5'
    - type: paragraph
      text:
        ru: '"Они су од света – ἐκ τοῦ κόσμου εἰσί: зато говоре од света, и свет их слуша«. Знамо им порекло: од света су и духом и учењем, и васцелим бићем својим и делатностима својим. Све што је њихово – заудара на свет, мирише на земљу. Све што живи у свету они изводе »од света«; све што постоји у свету они изводе из стихија света: и биље, и животиње, и људе, и дух, и тело, и мисао, и осећање, и хтење. Одакле је човек? »од света«, од стихија света, »од природе«. А остала бића? – сва су »од природе«, од света. А дух човеков, а мисао, а свест, а савест? – опет «од природе», од земље, од материје: све се то лучи из разних стихија света, из њихових комбинација, релација, асоцијација. Све што говоре «говоре од света», уроњеви у свет и поробљени светом; све им заудара на иловачу, на земљу, на земаљскост, пролазност. «И свет их слуша», јер му говоре оно што му годи, што га не замара, не плаши ни дубинама ни висинама ни бескрајностима. Мисли су им уске као свет, плитке као свет, кратке као свет, ограничене као свет, зато су и лако схватљиве. У свему овоме свет се замишља као нешто ван Бога, без Бога; као нешто у чему нема Бога, и чему не треба Бог; као нешто што је против Бога.'
        cn: '他们是属世界的——ἐκ τοῦ κόσμου εἰσί: 所以他们讲论世界的事，世界就听从他们。」 我们知道他们的源头：他们无论是从灵性上、教导上，乃至他们的整个存在和他们的行为活动，都是属世界的。他们的一切——都散发着世俗的臭味，弥漫着泥土的气息。凡在世上存活的一切，他们都将其溯源于「世界」；凡在世上存在的一切，他们都将其溯源于世界的元素：包括植物、动物、人类、精神、身体、思想、情感和意志。人从何而来？「属世界」，来自世界的元素，「来自自然」。那其他的存在呢？——它们都「来自自然」，属世界。那人的精神、思想、意识和良心呢？——仍然是「来自自然」，来自泥土，来自物质：所有这些都是从世界各种元素中分离出来的，从它们的结合、关联、联想中产生的。他们所说的一切都「是从世界发出的」，他们浸没于世界并被世界所奴役；他们的一切都散发着黏土、泥土、世俗性、转瞬即逝的气息。「世界就听从他们」，因为他们说的是世界喜欢听的，不会让它感到疲惫的，不会因深邃、高远或无限而使其感到恐惧的。他们的思想狭隘如世界，肤浅如世界，短促如世界，局限如世界，因此也易于理解。在所有这一切中，世界被设想为某种在神之外、没有神的存在；某种其中没有神、也不需要神的存在；某种是与神为敌的存在。'
