    - type: paragraph
      text:
        ru: 'Као што је љубав – свеврлина, тако је мржња – свепорок. Јер мржња чини свако зло брату. Све што је зло уствари је њено. Она живи кроз пакост, злобу, оговарање, злопамћење, клеветање, свађу, лукавство, убиство, и остала зла. Кроз сва та зла она врши једно: убија и духовно и физички. Као што љубав обесмрћује, тако мржња убија, усмрћује. И то најпре убија самог свог носиоца и гајитеља: убија му душу. Тако човек који мрзи већ је убица, и то самоубица, јер је мржњом убио душу своју. А кад се мржња излије и у убиство мрженога, ето двоструког убице. У сваком случају, мржња је ова увек против свега бесмртнога. Она је по природи сејач смрти, убица, човекоубица, јер из њеног носиоца, човека, увек истера све што је бесмртно, божанско, вечно, и тако у човеку створи осећање и сазнање да је сав смртан, и да уствари нема бесмртне душе. А када човек не признаје у себи бесмртну душу, онда је не признаје ни у осталим људима. За њега су људи – смртна бића; нема у њима ни бесмртне душе, ни бесмртног, вечног живота. Стога је мрзилац заиста човекоубица: убија и себе и све људе, убија их јер им пориче бесмртну душу и живот вечни. А то је ваистину прави човекоубица, прави крвник људски. Стога свети Богослов пише: «Сваки који мрзи на брата свога човекоубица је – ἀνθρωποκτόνος ἐστί – ; и знате да ни један човекоубица нема у себи вечнога живота». Немајући «у себи вечнога живота», мрзилац га одриче и у другим људима. И тако их све своди на пролазна, смртна бића, и на тај начин их све убија. Али човекоубица је увек и богоубица. Јер за кога не постоји бесмртна душа, не постоји ни Бог. Када би постојала бесмртна душа, она би могла бити творевина само бесмртног Бога. Но пошто нема бесмртне душе, то нема ни Бога. Таква је философија живота сваког човекоубице, па био он идејни, духовни човекоубица или физички. Идејни, духовни човекоубица је сваки који одриче Бога и бесмртност душе. Човекоубица је сваки који не признаје у људима ништа вечно, божанско, бесмртно. А такав је «сваки који мрзи на брата свога». Но такав човекоубица је увек најпре самоубица: «нема у себи вечнога живота». А нема га у себи, јер су му мржња и остала зла парализовала осећање божанског, бесмртнога, вечнога, избацила све то из његовог сазнања, те он нити осећа нити признаје ишта божанско, бесмртно, вечно. У своме осећању и у своме сазнању он је убио и Бога и душу. Зато је он и богоубица и човекоубица, а пре свега – самоубица.'
        cn: '正如爱是全德，仇恨便是全恶。因为仇恨会给弟兄造成一切邪恶。实际上，一切邪恶都源于仇恨。它借着恶意、怨毒、诽谤、怀恨、诬蔑、争吵、诡计、谋杀以及其他邪恶而存在。借着所有这些邪恶，它只做一件事：杀害，无论是精神上还是肉体上。正如爱使人永生，仇恨则杀害，致人于死地。而且它首先杀害的，是它自身的承载者和滋养者：它杀害了他的灵魂。这样，一个心怀仇恨的人，就已经是一个杀人者，而且是自杀者，因为他用仇恨杀害了自己的灵魂。而当仇恨倾泻为谋杀被憎恨者时，那便是一个双重杀人者。无论如何，这种仇恨总是对抗一切不朽之物。它本质上是死亡的播种者，是杀手，是杀人者，因为它总是从它的承载者，即人身上，驱逐一切不朽的、神圣的、永恒的东西，从而在人心中造成一种感觉和认知：他完全是必死的，实际上没有不朽的灵魂。而当一个人不承认自己拥有不朽的灵魂时，他便也不会承认其他人拥有不朽的灵魂。对他而言，人是必死的受造物；在他们里面既没有不朽的灵魂，也没有不朽的、永恒的生命。因此，心怀仇恨者确实是杀人者：他杀害自己也杀害所有的人，他杀害他们，因为他否定了他们不朽的灵魂和永恒的生命。而这确实是真正的杀人者，真正的人类刽子手。因此，圣神学家写道：「凡恨他弟兄的，就是杀人犯——ἀνθρωποκτόνος ἐστί——；你们也知道，凡杀人犯里头，没有永生」（约翰一书 3:15）。由于「在自己里面没有永生」，心怀仇恨者也否定了其他人的永生。这样，他将所有人都简化为瞬逝的、必死的受造物，并以此方式杀害了所有人。


          然而，杀人者也总是弑神者。因为对他而言，既然不朽的灵魂不存在，那么上帝也不存在。如果不朽的灵魂存在，它只能是不朽的上帝的创造物。然而，既然没有不朽的灵魂，也就没有上帝了。这就是每个杀人者的生命哲学，无论他是思想上的、精神上的杀人者，还是肉体上的杀人者。思想上的、精神上的杀人者是指一切否定上帝和灵魂不朽的人。杀人者是指一切不承认在人里面有任何永恒的、神圣的、不朽的东西的人。而这样的人就是「凡恨他弟兄的」。然而，这样的杀人者总是首先是自杀者：「在自己里面没有永生」。而他在自己里面没有永生，因为仇恨和其余的邪恶已经使他对神圣的、不朽的、永恒的感受麻痹了，将这一切从他的认知中驱逐出去，以致他既不感受也不承认任何神圣的、不朽的、永恒的东西。在他的感受和认知中，他既杀害了上帝，也杀害了灵魂。因此，他既是弑神者也是杀人者，而首先是自杀者。'
