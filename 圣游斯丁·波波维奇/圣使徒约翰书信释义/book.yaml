    ru: 'При корекцији ових авиних «Тумачења посланица Св. Јована Богослова» користили смо издање манастира Ћелије код Ваљева, Београд 1982; а за корекцију старо-грчког текста посланицa користили смо: Η ΚΑΙΝΗ ΔΙΑΘΗΚΗ, ΕΓΚΡΙΣΕΙ ΤΗΣ ΜΕΓΑΛΗΣ ΤΟΥ ΧΡΙΣΤΟΥ ΕΚΚΛΗΣΙΑΣ, ΑΔΕΛΦΟΤΗΣ ΘΕΟΛΟΓΩΝ «Ο ΣΩΤΗΡ» ΑΘΗΝΑΙ – ΙΑΝΟΥΑΡΙΟΣ 1980, и интернет издање Myriobiblos – Home of the Greek Bible – Library of the Church of Greece, на линку: http://www.myriobiblos.gr/bible/nt2/default.asp (Зор. А. Ст.).'
    cn: 在校对这位阿爸的《圣约翰神学家书信诠释》时，我们使用了1982年贝尔格莱德瓦列沃附近的采利耶修道院的版本；而为了校对这些书信的古希腊语文本，我们使用了：《新约》，蒙基督大教会批准，神学家兄弟会《救主》，雅典 – 1980年1月，以及Myriobiblos – 希腊圣经之家 – 希腊教会图书馆的互联网版本，链接地址：http://www.myriobiblos.gr/bible/nt2/default.asp (参见 А. Ст.)。
  '[2]':
    ru: 'На одговарајућим местима смо убацили текст посланица Св. ап. Јована (пошто је у штампаном издању из неких разлога изостављен), а према преводу Комисије Св. Архијер. Синода СПЦ, исправљено издање, Београд 1997. год., и интернет издању Библиотеке Светосавље.орг, на линку:

      http://svetosavlje.org/biblioteka/Svetopismo/NoviZavet/NoviZavet.htm (Зор. А. Ст.).'
    cn: '在适当位置，我们插入了圣使徒约翰书信的文本（因为在印刷版中因某些原因被遗漏了），该文本根据塞尔维亚正教会圣主教会议委员会的译本，修正版，贝尔格莱德，1997年，以及Svetosavlje.org图书馆的互联网版，链接如下：

      http://svetosavlje.org/biblioteka/Svetopismo/NoviZavet/NoviZavet.htm (Зор. А. Ст.).'
  '[3]':
    ru: 'Ова два места у изворном грчком тексту који смо користили при корекцији гласе: ἡ ἐπαγγελία (обећање) … ἀναγγέλλομεν ὑμῖν; вероватно није у питању штампарска грешка, него авино наглашавање смисла речи ангелиа – вест, јављаљње (Зор. А. Ст.).'
    cn: 这两处地方，在我们用于校正的希腊语原文中，是这样表述的：ἡ ἐπαγγελία (应许) … ἀναγγέλλομεν ὑμῖν; 这很可能并非印刷错误，而是对「ανγγελια」一词的意义——信息，告知——的明显强调（Зор. А. Ст.）。
  '[4]':
    ru: Овде је унеколико испомеран ред речи у односу на изворни грчки текст – ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν (Зор. А. Ст.).
    cn: 此处词序与原文希腊文本相比略有改动——ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν (Зор. А. Ст.)。
  '[5]':
