    - type: paragraph
      text:
        ru: 'Шта је љубав? – обесмрћење онога кога љубиш; давање божанскога, бесмртнога, љубљеноме; давање вечнога живота љубљеноме. То пак значи: давање љубљеноме вечне Божанске Истине, Божанске Правде, Божанске Љубави, Божанеке Вечности, и осталих Божанских савршенстава. То је права, божанска вечна љубав. Њу нам је у савршенству, па ипак у свакодневној човечанској стварности, показао Господ Христос. И усто дао нам силе да је и ми доживљујемо као своју. Свети Богослов благовести: «По томе познасмо љубав што Он за нас душу своју положи; и ми смо дужни – καὶ ἡμεῖς ὀφείλομεν – полагати душе за браћу». Богочовек је душу своју положио за нас: из човекољубља предао себе добровољно на крсну смрт, да би нам, победивши смрћу смрт, васкрсењем даровао живот вечни и бесмртност. То је у нашем свету једина истинска, једина божанска, једина бесмртна љубав. Стога «и ми смо дужни полагати душе за браћу», тј. све жртвовати, да бисмо у њима изазвали и развили осећање божанског, бесмртног, вечног; да бисмо им кроз своје христолико самопожртвовање дали Бога, бесмртност, живот вечни, убедивши их у све то.'
        cn: 什么是爱？——使你所爱的人得享不朽；将神圣、不朽之物赐予所爱之人；将永生赐予所爱之人。这又意味着：将永恒的神圣真理、神圣公义、神圣之爱、神圣永恒以及其他神圣的完满赐予所爱之人。这便是真实、神圣、永恒的爱。主基督在完满中，却又在日常的人类现实中，向我们展现了这种爱。此外，祂也赐予我们能力，使我们也能将它体验为我们自己的。圣神学家宣报说：「我们所以知道什么是爱，是因为祂为我们舍弃自己的性命；我们也是应当——καὶ ἡμεῖς ὀφείλομεν——为弟兄舍弃性命。」（约翰一书 3:16）神人（指基督）为我们舍弃了自己的性命：出于对人类的爱，祂自愿地将自己交于十字架上的死亡，目的是为了通过以死亡战胜死亡，并藉着复活，赐予我们永生和不朽。这在我们的世界中是唯一真实、唯一神圣、唯一不朽的爱。因此，「我们也是应当为弟兄舍弃性命」，即牺牲一切，以便在他们心中唤醒并发展出对神圣、不朽、永恒的感受；藉着我们基督般的自我牺牲，赐予他们上帝、不朽和永生，并使他们确信这一切。
    - type: paragraph
      text:
        ru: '3:17'
        cn: '3:17'
    - type: paragraph
      text:
        ru: 'Права је љубав она која љубљеноме даје, осигурава бесмртност и живот вечни. А то је само она која у човеку изазива и развија осећање Бога и осећање бесмртности. Таква љубав је увек жртвена, увек самопожртвована: увек полаже душу за браћу. Скала љубави је огромна: полази од најмање, завршава највећом жртвом. Главно је у свакој тој жртви да је живо осећање љубави за брата. А то осећање лако нађе саосећање у љубљеноме, лако изазове саљубав. Таква је права љубав, «љубав Божја»: љубав Христова, љубав еванђелска. Она потстиче човака на сваку жртву за браћу. Свети Богослов вели: «Који дакле има богатства овога света, и види брата свога у невољи, и затвори срце своје од њега, како љубав Божја обитава у њему»? Када «љубав Божја» обитава у срцу, онда је оно отворено за сву браћу: да им послужи имањем, и молитвом, и постом, и правдом, и добротом, и истином, и милостињом, и трпљењем, и кротошћу, и смерношћу, и сваком личном жртвом која иде до полагања за браћу и највеће вредности човекова бића: душе.'
        cn: 真正的爱，是那给予所爱之人，确保他获得不朽和永恒的生命。而唯有那种在人心中激起并发展出对神的感受和对不朽的感受的爱，才是真正的爱。这样的爱永远是牺牲的，永远是自我牺牲的：永远为弟兄舍弃生命。爱的尺度是巨大的：始于最小的，终于最大的牺牲。在每一次这样的牺牲中，重要的是对弟兄的爱是活泼的感受。而这种感受很容易在所爱之人心中找到共鸣，很容易激发出互爱。这就是真正的爱，「神的爱」：基督的爱，福音的爱。它激励人为弟兄做出一切牺牲。圣神学家说：「凡有世上财物的，看见弟兄穷乏，却向他关闭心门，神的爱怎能住在他里面呢？」(约翰一书 3:17) 当「神的爱」住在心中时，心就向所有弟兄敞开：用财产、用祷告、用禁食、用公义、用良善、用真理、用怜悯、用忍耐、用温柔、用谦卑，以及任何个人的牺牲来服事他们，甚至为弟兄舍弃人存在的最大价值：灵魂。
    - type: paragraph
      text:
        ru: 3:18–19
        cn: 3:18–19
    - type: paragraph
      text:
        ru: 'Јер "љубав Божја« живи у човеку и дела у њему и око њега кроз остале божанске врлине и свете силе. Она се кроз њих пројављује, реализује, конкретизује; то су дела њена, сведочанства њена, истинитост њена. По тој богочовечанској делотворности и истинитости она се и разликује од осталих назовиљубави, псевдољубави: апстрактних, пролазних, уобразиљних, хуманистичких, хоминистичких. Љубав је онда истинита када чини за браћу сва еванђелска дела: правду, милостињу, молитву и др. То су њене ознаке, њени знаци распознавања, њен живот. Јер она живи и постоји кроз њих и помоћу њих. Стога свети Богослов благовести: »Дечице моја, да се не љубимо речју ни језиком, него делом и истином – ἐν ἔργῳ καὶ ἀληθείᾳ. И по томе дознајемо да смо од истине – ὅτι ἐκ τῆς ἀληθείας ἐσμέν, и пред њим тешимо срца своја«. Божанска Истина је душа Божанске љубави; а у њој има од свих божанских савршенстава, јер су у њој присутне и Божанска правда, и Божанска доброта, и сва остала савршенстсва. То је оно што заиста теши срце људско, срце које воли и жртвује се за браћу. Јер сва та божанска савршенства преко својих божанских сила развијају, обогаћују, обезграничују човеково самоосећање личне бесмртности и вечнога живота, а тиме и осећање бесмртности и вечнога живота браће.'
        cn: 因为「上帝的爱」活在人里面，并借着其他的神圣美德和圣洁能力，在他里面并借着他运作。它借着它们显现、实现、具体化；这些都是它的行为、它的见证、它的真实。凭借这种神人性的有效性和真实性，它区别于其他的所谓爱、伪爱：抽象的、瞬逝的、虚幻的、人道主义的、人本主义的。爱只有在为弟兄们行一切福音性的行为时才是真实的：公义、施舍、祷告等等。这些是它的标志、它的识别记号、它的生命。因为它借着它们并借由它们而存活并存在。因此，圣神学家宣讲道：「我的孩子们，我们不要以言语和舌头相爱，乃要用行为和真实——ἐν ἔργῳ καὶ ἀληθείᾳ。借此我们得知我们是属乎真理的——ὅτι ἐκ τῆς ἀληθείας ἐσμέν，并且在他面前安慰我们的心。」神性真理是神圣之爱的灵魂；而在它里面，包含着所有神圣的完美，因为神圣的公义、神圣的良善以及所有其他的完美皆在其中呈现。这才是真正安慰人心的，即那爱并为弟兄们牺牲的心。因为所有这些神圣的完美，借着它们的神圣能力，发展、丰富并拓宽了人对个人不朽和永恒生命的自我感受，也同样拓宽了弟兄们对不朽和永恒生命的感受。
    - type: paragraph
      text:
        ru: 3:20–22
        cn: 3:20–22
    - type: paragraph
      text:
        ru: 'Зазире ли срце наше пред величином подвига божанске љубави, и рекне ли себи прекорно и осудилачки: не, ја нисам способно за такву божанску љубав, – треба се тешити мишљу и сазнањем: »Бог је већи од срца нашег и зна све«; – као већи даће нашем малом срцу потребне силе и храбрости да истраје у саможртвеном подвигу љубави; као свезнајући Он зна кад и шта треба дати срцу човечјем, да би се у њему множила божанска љубав, расла растом Божјим, и водила човека из подвига у подвиг, из једне свете врлине у другу. Али све то Бог даје на молитву, тј. када се љубав наша омолитви, и молитва јој притиче у помоћ. Јер љубав нарочито расте и усавршава се молитвом. Што већа молитвеност у човека, то и љубав савршенија. Отуда најсавршенију љубав имају најмолитвенији људи – Светитељи. Истинита је реч св. Исака Сирина: »Љубав је од молитве«. Да, она се измоли од Бога као најсавршенији дар. Јер »Бог је љубав«, и дајући љубав своју човеку Бог му уствари даје себе сама. У божанској, еванђелској љубави све зависи од молитвености љубећих. Зато свети Богослов благовести: »Слободу имамо пред Богом; и што год заиштемо – ὃ ἐὰν αἰτῶμεν -, примићемо од њега, јер заповести његове држимо и чинимо што је Њему угодно – τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν«. Бог испуњује човекове молитве, када човек испуњује његове заповести: »Послушај Бога у заповестима, вели Свети Златоуст, да би Он послушао тебе у молитвама«. Човек који држи заповести Божје, увек је и мудар и истрајан и искрен у молитвама: зна шта треба, кад треба, и како треба да иште од Бога. И увек иште само оно што је корисно по спасење душе, тј. оно што је еванђелско, божанско, бесмртно, вечно. Свети Богослов нам је казао; сад знамо тајну молитве. Она је: у држању заповести Божјих. Еванђелско је правило: Који држи заповести Божје, Бог му испуњује сваку молитву. Пример: Светитељи држе заповести Божје, зато Бог испуњује њихове молитве, били они на небу или на земљи.'
        cn: 如果我们的心在神圣之爱的伟大修行面前感到畏缩，并且自责地和定罪地对己言说：「不，我没有能力拥有那样的神圣之爱」，——那么我们当以思想和认知自慰：「神比我们的心更大，祂知晓一切」；——作为更伟大的神，祂会赐予我们弱小的心所需的力量和勇气，使我们在舍己之爱的修行中坚持不懈；作为全知的神，祂知道何时以及当赐予人心什么，以便神圣的爱在其中增多，以神的增长而成长，并引领人从一个修行到另一个修行，从一种圣德到另一种圣德。然而，这一切神都因祷告而赐予，即，当我们的爱融入祷告，并且祷告前来帮助它时。因为爱尤其借着祷告而增长并臻于完善。人越是虔诚祷告，爱就越是完善。因此，那些最虔诚祷告的人——圣徒们——拥有最完善的爱。圣伊萨克·叙利亚的教言是真实的：「爱源于祷告。」是的，爱是作为最完善的恩赐，借祷告从神求得的。因为「神是爱」，并且神将祂的爱赐予人时，祂实际上是将祂自己赐予了人。在神圣的、福音性的爱中，一切都取决于爱者的祷告虔诚度。因此，圣神学家宣示说：「我们在神面前有坦然无惧的心；并且我们无论求什么——ὃ ἐὰν αἰτῶμεν——都必从祂得着，因为我们遵守祂的命令，行祂所喜悦的事——τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν。」当人遵守神的诫命时，神就成就人的祷告。圣金口若望说：「在诫命中顺服神，这样祂就会在祷告中垂听你。」那遵守神诫命的人，在祷告中总是智慧的、恒切的、真诚的：他知道当向神求什么，何时当求，以及如何当求。并且他总是只求那些对灵魂救赎有益的事，即，那些福音性的、神圣的、不朽的、永恒的事。圣神学家已经告诉了我们；现在我们知晓了祷告的奥秘。这奥秘就是：遵守神的诫命。福音性的法则乃是：凡遵守神诫命的，神就成就他的每一个祷告。例如：圣徒们遵守神的诫命，因此神成就他们的祷告，无论他们在天上或地上。
    - type: paragraph
      text:
        ru: '3:23'
        cn: '3:23'
    - type: paragraph
      text:
        ru: '"И ово је заповест његова да верујемо у име Сина његова Исуса Христа, и да љубимо један другог као што нам је дао заповест». – Ето скраћеног Еванђеља спасења: вера у Христа и божанска љубав. То двоје уствари је једна заповест, јер сачињава једно осећање и једно расположење: ко верује у Христа, верује зато што Га љуби. Из вере израста љубав, и из љубави вера. Јер једно кроз друго расте и усавршава се. То су духовни близанци. Љубав расте вером, али и вера љубављу. Који љуби Господа Христа он и верује у Њега, у све његово, јер има повероње у Њега, поверење које му улива љубав. Вера казује човеку тајну Богочовекову: и уколико више човек вером упознаје Господа Христа, утолико Га више и љуби; и уколико Га више љуби, утолико му се више открива тајна Христова. Посведочено је еванђелско искуство: Христос се вером усељује у човека, а човек се љубављу укорењује у Христу (Еф.3:17). Ова двоједна врлина (љубав и вера) порађа у души остале еванђелске врлине; а кроз све њих Господ обитава у човеку и човек у Господу. Стога Св. Богослов благовести:'
        cn: 「他的诫命是：我们要信他儿子耶稣基督的名，也要我们彼此相爱，正如他所赐的诫命。」——这就是简明的救恩福音：对基督的信和神圣的爱。这二者实际上是一条诫命，因为它们构成了一种情感和一个心境：凡信基督的，是因为爱他才信他。爱从信中生长出来，信也从爱中生长出来。因为它们彼此藉着对方成长并臻于完善。它们是属灵的双生子。爱藉着信成长，而信也藉着爱成长。凡爱主基督的，他也信他，信他的一切，因为他信任他，这信任是由爱注入他心里的。信向人揭示了道成肉身的奥秘：人越藉着信认识主基督，就越爱他；人越爱他，基督的奥秘就越向他显明。福音的经验已经证实：基督藉着信住在人里面，而人藉着爱在基督里扎根（以弗所书 3:17）。这双重美德（爱与信）在灵魂中孕育出其他的福音美德；藉着所有这些美德，主居住在人里面，人也居住在主里面。因此，圣神学家宣称：
    - type: paragraph
      text:
        ru: '3:24'
        cn: '3:24'
    - type: paragraph
      text:
        ru: '"И који држи заповести његове у Њему обитава, и Он у њему«. Јер Он је благодатном силом присутан у свакој заповести («Господ је скривен у заповестима својим», вели Св.Марко Подвижник), и свакоме трудбенику помаже у држању заповести. При томе се увек одржава еванђелско начело богочовечанске сарадње: Богочовек сарађује човеку, а човек остаје самостална личност, иако је свим бићем у Господу Христу, иако «у Њему обитава». Исто тако и Господ Христос обитава у човеку, не губећи ништа од пуноће своје Личности. Но то живљење човека у Христу, и Христа у човеку, та богочовечанска симбиоза бива Духом Светим и у Духу Светом. Дух Свети и даје човеку благодатне силе за тај живот. Господ Христос је Духом Светим присутан у човеку. Стога Св. Богослов благовести: «И по томе познајемо да обитава у нама – μένει ἐν ἡμῖν -, по Духу кога нам је дао». – Значи: хришћанин никад није сам, он је обиталиште и радионица Трисветог Божанства. Све томе води. Држање заповести утројичује човека, јер га ухристовљује и удуховљује. Сав је хришћанинов живот један непрекидан недељиви подвиг охристовљења, одуховљења, обожења = отројичења.'
        cn: 「凡遵守他诫命的，就住在他里面，他也住在那人里面。」因为他以恩典之能临在于每条诫命中（「主隐藏在他的诫命中，」圣马可·波德维日尼克说道），并帮助每一个勤勉遵守诫命的人。在此，福音的「神人合作」原则始终得到保持：神人与人合作，而人仍保持其独立的位格，尽管人以其全部存在在主基督里，尽管「住在他里面」。同样地，主基督也住在人里面，丝毫未失其位格的丰满。然而，人住在基督里，以及基督住在人里面这种生命，这种神人共生（symbiosis），乃是借着圣灵并在圣灵里发生的。圣灵也赐予人恩典之能以活出这种生命。主基督借着圣灵临在于人里面。因此，圣神学家宣称：「我们所以知道他住在我们里面——μένει ἐν ἡμῖν——是因他所赐给我们的圣灵。」这意味着：基督徒从不孤单，他是三一神性的居所和工场。一切都导向这一点。遵守诫命使人被三一化，因为这使他基督化并圣灵化。基督徒的整个生命是一场不间断、不可分割的苦修，旨在基督化、圣灵化、神化 = 三一化。
