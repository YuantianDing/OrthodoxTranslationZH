    - type: paragraph
      text:
        ru: '"Знамо, благовести свети Богослов, да ни један који је рођен од Бога не греши – οὐχ ἁμαρτάνει, него који је рођен од Бога чува се, и нечастиви се не дохвата до њега – ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ«. Свете божанске силе изливају се у хришћане, који су, светим тајнама и светим врлинама, рођени од Бога, те се чувају греха и не греше. »И нечастиви се не дохвата до њих«, јер се он дохвата човека само грехом, и захвата човека грехом, и улази у човека грехом, и поробљава човека грехом. Јер је грех сила која се лучи из нечастивог, из злог; зато је и зла, и ђаволска, и нечастива. Кроз сваки грех ђаво прокријумчари помало од себе, од духа свог, и унесе у човека. Зато је хришћанин увек на опрези од греха: »Чува се«. Чувајући се греха, он се чува извиднице, за којом наступа сам војсковођа зла са свим својим црним армијама. Како »се чува«? – Чува се еванђелским врлинама, живећи у њима даноноћно. Јер само тако може сачувати себе од погибије у страшном и непрекидном ратовању свом »са поглаварима, и властима, и управитељима таме овога света, с духовима зла испод неба« (Еф.6:12). Сви ови војници и војсковође зла беже од светлих божанских врлина; и »нечастиви се не дохвата« Христова војина. »Не греши" онај "који је рођен од Бога" и који "се чува«. Једно је од Бога, а друго од њега. Рођење од Бога је дар Божји, али у њему он остаје само чувајући се од греха живљењем у светињама светих тајни и светих врлина.'
        cn: 我们知道，圣神学家宣报说，「凡从神而生的人不犯罪 – οὐχ ἁμαρτάνει，反之，从神而生的人保守自己，那恶者就不能沾着他 – ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ。」圣洁的神圣力量倾注于基督徒，他们借着圣奥秘和圣美德，从神而生，于是他们保守自己脱离罪，且不犯罪。「那恶者就不能沾着他们」，因为他唯独藉着罪才能沾着人，藉着罪俘虏人，藉着罪进入人里面，藉着罪奴役人。因为罪是从那恶者、从邪恶中分泌出来的一种力量；因此罪是邪恶的、魔鬼般的和不洁的。藉着每一个罪，魔鬼都私自夹带一些他自己，带着他自己的灵，并将其带入人里面。因此基督徒总是对罪保持警惕：「保守自己」。保守自己脱离罪，他就是保守自己脱离那侦察兵，而那邪恶的统帅则带着他所有的黑暗军队尾随其后。如何「保守自己」呢？——他借着福音的美德，昼夜活在其中，保守自己。因为只有这样他才能在可怕且不间断的战争中保守自己免于毁灭，「与那些执政的、掌权的、管辖这幽暗世界的，以及天空属灵气的恶魔争战」（以弗所书 6:12）。所有这些邪恶的士兵和统帅都逃避光明的神圣美德；「那恶者就不能沾着」基督的战士。「从神而生」并「保守自己」的人「不犯罪」。一是来自神，二是来自人本身。从神而生是神的恩赐，但人唯有藉着活在圣奥秘和圣美德的圣洁中，保守自己脱离罪，才能持守在这恩赐里。
    - type: paragraph
      text:
        ru: '5:19'
        cn: '5:19'
    - type: paragraph
      text:
        ru: '"Знамо да смо од Бога, и сав свет лежи у злу – ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται». – «Знамо да смо од Бога», то је перманентно сазнање хришћана. Све што нас чини хршћанима, а то значи правим људима, од Бога је. По свему ми смо пореклом од Бога. Хришћани знају откуда долазе, где се налазе, и куда одлазе. Они једини знају прави пут људскога бића од почетка до краја. Знајући да су од Бога, они и живе Богом и ради Бога, и тако живе Вечним и ради Вечнога, живе вечним животом. Пошго је у њима све од Бога, они јасно распознају и виде граничне линије између онога што је Божје и што није Божје: између добра и зла, правде и неправде, истине и лажи, живота и смрти, Бога и ђавола. Зато што им је и вид и сазнање од Бога, они и виде и знају да «сав свет лежи у злу". "Лежи», јер су га греси обарили, а он не жели нити хоће да устане. И у таквом свету хришћани живе, али живе светим силама онога света, чувајући се од зла и греха. «Сав свет у злу лежи»: сав је потопљен у зло, прожет злом, поплављен злом. А тај свет сачињавају људи, добровољно потчињени гресима и пороцима. Подвиг, анђелски подвиг хришћана састоји се у томе што они живе у свету који «сав у злу лежи», то значи: у паклу, надвлађују зло света и не даје да их претвори у ђаволе. Још нешто: под светом се овде разуме и творевина Божја: земља, људи и све што је на земљи. Сав тај богоздани свет преплављен је злом, оборен злом, у коме лежи као тежак болесник. То је највећа мука за творевину Божју; то је оно због чега она непрестано «уздише и тужи» (Рим.8:21), чекајући «да се јаве синови Божји», који ће је ослободити од робовања греху, злу, пропадљивости, смрти, ђаволу (Рим.8:19–20). А «синови Божји» су хришћани; они су Богом ослободили себе зла и греха, и свим се силама труде да и свет ослободе зла и греха у којима он лежи и којима робује.'
        cn: 我们知道我们是属神的，并且全世界都卧在恶者手下——ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται。『我们知道我们是属神的』，这是基督徒持久的认知。所有使我们成为基督徒的——这意味着真正的人——都是从神而来的。就一切而言，我们都是源于神的。基督徒知道他们从何而来，他们身在何处，以及他们将往何处去。唯有他们知道人类存在从始至终的正确道路。他们知道自己是属神的，因此他们活在神里面，也为神而活；如此他们活在永恒里，也为永恒而活，活出永恒的生命。因为他们里面的一切都源于神，他们清晰地辨别并看见属神的与不属神的界限：在善与恶、公义与不义、真理与谎言、生命与死亡、神与魔鬼之间。因为他们的视觉和认知都来自神，他们因此也看见并知道『全世界都卧在恶者手下。』『卧着』，因为罪恶使它跌倒，而它既不愿也不想站起来。基督徒就生活在这样的世界里，但他们凭着那世界的圣洁力量生活，保守自己脱离邪恶和罪。『全世界都卧在恶者手下』：整个世界都沉浸在邪恶之中，被邪恶渗透，被邪恶淹没。而这个世界由人类组成，他们自愿顺服于罪恶和恶习。基督徒的苦修，他们天使般的苦修，在于他们生活在一个『全世界都卧在恶者手下』的世界里——这意味着：在地狱里——他们战胜了世界的邪恶，并且不让世界的邪恶将他们变成魔鬼。还有一点：这里所说的世界也指神的创造物：大地、人类以及地上的一切。所有这个神所造的世界被邪恶淹没，被邪恶击倒，它在其中卧着，如同一个重病患者。这是对神的创造物最大的痛苦；这就是它不住地『叹息、劳苦』的原因（罗马书 8:21），等候『神的众子显现』，他们将把它从罪、邪恶、败坏、死亡、魔鬼的奴役中解放出来（罗马书 8:19-20）。而『神的众子』就是基督徒；他们靠神将自己从邪恶和罪中解脱出来，并且竭尽全力也要将世界从它所卧着并被奴役的邪恶和罪中解脱出来。
