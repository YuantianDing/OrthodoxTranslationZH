    - type: paragraph
      text:
        ru: 'Нема страшније силе од греха, јер једино он производи смрт. А шта је страшније од смрти? Сигурно, само творац греха и смрти. Над овим троглавим чудовиштем ко може имати власти? Само онај који је стварно без греха. А као такав показао се у роду људском само један: Богочовек Христос. Иако стварни човек, Њега нико није могао окривити за грех: ни људи међу којима је живео (Ин.8:46), ни ђаволи на чије је очи радио (Ин.14:30). Значи: први и једини човек у чијем васцелом бићу нема ни клице, ни трунке греха, ни атома греховне силе. Зато што је такав, Он – «Син Човечји има власт на земљи опраштати грехе» (Мф.9:6). И заиста, Он је, у начелу, опростио роду људском грехе својим целокупним богочовечанским подвигом на земљи: од рођења, па кроз крштење, проповед, чудотворство, преображење, крсну смрт, страдање, васкрсење и вазнесење. И то учинио из неизмерног човекољубља, које врхуни у крсној смрти и васкрсењу. Да Он има право, и може, опраштати људима грехе, доказ је то што је својом добровољном смрћу и васкрсењем победио свесилу греха – смрт. А да је стварно опраштао грехе, доказ је Закхеј, који је у томе и кроз то добио силу да препороди себе (Лк.19:1–10); Марија Магдалина, Савле, Кифа. А по силаску Светога Духа, у Цркви и кроз Цркву – безброј доказа о томе. Зато свети Богослов благовести: «Пишем вам, дечице, да вам се опраштају греси имена његова ради – διὰ τὸ ὄνομα αὐτοῦ".'
        cn: '没有比罪更可怕的力量，因为唯有它能产生死亡。而有什么比死亡更可怕呢？当然，只有罪与死亡的创造者。谁能对付这三头怪物呢？唯有那真正无罪之人。而在人类中，只有一位显现为这样的人：就是神人基督。祂虽然是真正的凡人，却没有人能指摘祂有罪：无论是与祂同住的人（约翰福音 8:46），还是在祂眼前工作的魔鬼（约翰福音 14:30）。这意味着：祂是第一个也是唯一一个，在其完整生命中没有罪的萌芽，没有一丝一毫的罪恶，也没有罪恶力量的原子。正因如此，祂——「人子在地上有赦罪的权柄」（马太福音 9:6）。


          祂确实，在原则上，借着祂在地上完整的神人功绩，赦免了人类的罪：从降生，经过洗礼、宣讲、行神迹、登山变像、十字架上的死亡、受难、复活和升天。祂这样做是出于无限的爱人之心，这种爱在十字架上的死亡和复活中达到了顶点。祂有权柄，也能赦免人的罪，证据就是祂借着自愿的死亡和复活，战胜了罪的万能——死亡。而祂确实赦免了罪的证据，就是撒该，他借此并从中获得了重塑自我的力量（路加福音 19:1-10）；还有抹大拉的马利亚、扫罗、矶法。而在圣灵降临之后，在教会内，并借着教会，有无数的证据证明这一点。因此，圣神学家宣告说：「孩子们，我写信给你们，是要你们的罪因祂的名而得赦免—— διὰ τὸ ὄνομα αὐτοῦ。」'
