  - type: heading2
    text:
      ru: Тумачење треће посланице светог Јована Богослова
      cn: 圣约翰神学家第三书信释义
    children:
    - type: paragraph
      text:
        ru: 3 Јованова 1–15
        cn: 约翰三书 1-15
    - type: paragraph
      text:
        ru: 3Ин.1–15:1Старјешина Гају љубљеноме, којега ја заиста љубим. 2 Љубљени, молим се да у свему добро напредујеш, и здрав да будеш, као што ти добро напредује душа. 3 Јер се обрадовах веома када дођоше браћа свједочећи о истини твојој, како ти у истини живиш. 4 Од тога немам веће радости него да чујем како моја дјеца живе у истини. 5 Љубљени, вјерно чиниш што год радиш за браћу и за намјернике, 6 Који посвједочише твоју љубав пред Црквом; и добро ћеш учинити ако их испратиш достојно Бога. 7 Јер Имена његова ради изиђоше, не примајући ништа од незнабожаца. 8 Ми смо, дакле, дужни примати такве, да будемо сарадници Истини. 9 Писах Цркви; али Диотреф, који жели да буде први међу њима, не прима нас. 10 Зато, ако дођем, споменућу његова дјела која твори, ружећи нас злим ријечима; и није му то доста, него сам браће не прима, и забрањује онима који би хтјели да их примају, и изгони их из Цркве. 11 Љубљени, не угледај се на зло, него на добро. Који добро чини од Бога је, а који зло чини није видио Бога. 12 О Димитрију су посвједочили сви, и сама истина; а и ми свједочимо; и знате да је свједочанство наше истинито. 13 Много имадох да пишем, али нећу мастилом и пером да ти пишем; 14 Него се надам да ћу те ускоро видјети и усмено ћемо говорити. 15 Мир ти! Поздрављају те пријатељи. Поздрави пријатеље по имену. Амин.
        cn: '约翰三书 1:1-151 长老写信给亲爱的盖犹，就是我诚心所爱的。

          2 亲爱的，我祷告，愿你在凡事上亨通，身体健壮，正如你的灵魂兴盛一样。

          3 因有弟兄们来，为你的真理作见证，就是你怎样按真理而行，我就大大喜乐。

          4 我听见我的儿女们按真理而行，我的喜乐就没有比这更大的了。

          5 亲爱的，凡你为弟兄们所做的，特别是为远人所做的，你都是忠实地行事。

          6 他们在教会面前见证了你的爱；你若以合乎神的方式送他们一程，就做得很好。

          7 因为他们为主的名出了门，并没有从外邦人那里接受什么。

          8 所以，我们应该接待这样的人，好叫我们与真理一同作工。

          9 我曾写信给教会，但丢特腓在他们中间好为首，不接待我们。

          10 所以，我若去，必要提及他所做的事，就是他用恶言毁谤我们。这还不算，他自己不接待弟兄，又禁止那些愿意接待的人，并且把他们从教会中赶出去。

          11 亲爱的，不要效法恶，只要效法善。行善的属乎神；行恶的未曾见过神。

          12 关于底米丢，众人都为他作了见证，连真理也为他作见证。我们也作见证，你们也知道我们的见证是真的。

          13 我有许多事要写给你，但我不想用墨水和笔写给你；

          14 我却盼望很快能见到你，我们就口头交谈。

          15 愿你平安！众朋友都问候你。请你按名问候众朋友。阿门。'
    - type: paragraph
      text:
        ru: '3:1'
        cn: '3:1'
    - type: paragraph
      text:
        ru: 'Ево љубави која је сва заснована на истини, сва ограђена истином, сва стоји »у истини«. Свети Благовесник благовести о ономе што је у њему самом жива благовест, жива стварност, жива истина. Он пише о новазаветној љубави која је у исто време његово лично искуство: божанска љубав која се претворила у човечанско осећање, у човечанско искуство, у човечанску стварност. Такве су уствари све божанске благовести еванђелске: претворене у људско искуство, у људску стварност, оваплоћене и увек оваплотљиве, остварене и увек остварљиве, учовечене и увек учовечљиве. Ако је реч о љубави, хришћанин треба да љуби «делом и истином» (1Ин.З:18); ако је реч о молитви, треба да се моли «делом и истином»; исто тако, ако је реч о посту, о смерности, о трпљењу, о доброти, о правди, – све се то има изражавати «делом и истином".'
        cn: 这爱全然奠基于真理之上，全然受真理围护，全然立于「真理之中」。圣传福音者所传报的，正是他自身之内活生生的福音，活生生的现实，活生生的真理。他所书写的新约之爱，同时也是他个人的经验：那神圣之爱转化为人性的感受，转化为人性的经验，转化为人性的现实。事实上，所有福音中的神圣宣报莫不如此：它们已转化成人的经验，转化成人的现实；已道成肉身且永远能道成肉身；已实现且永远能实现；已具人性且永远能具人性。若是论及爱，基督徒就当「凭行为和真理」去爱（约翰一书 3:18）；若是论及祷告，就当「凭行为和真理」祷告；同理，若是论及禁食，论及谦卑，论及忍耐，论及良善，论及公义——这一切都当「凭行为和真理」来表达。
    - type: paragraph
      text:
        ru: '3:2'
        cn: '3:2'
    - type: paragraph
      text:
        ru: '"Љубљени, молим се Богу да у свему напредујеш – εὔχομαί σε εὐοδοῦσθαι – и да будеш здрав, као што душа твоја напредује – εὐοδοῦταί σου ἡ ψυχή». Хришћанин у свему напредује Богом, расте силом Божјом. Он никад није довољан сам себи, аутаркичан, већ увек потребује за све своје помоћ Божју, силу Божју. У свему он напредује помаган, подржаван, одушевљаван благодаћу Божјом: и у љубави, и у молитви, и у посту, и у кротости, и у правди, и у трпљењу, и у свакој врлини и светињи еванђелској. Само тако и «напредује душа» његова. Али, ево наставак те благовести: само тако напредује и телесно здравље његово. Јер и за њега је неопходна помоћ Божја, сила Божја, благодат Божја, поред старања његовог. И у томе он није сам себи довољан, аутаркичан. Еванђелске врлине сачињавају здравље душе, али исто тако и у многоме здравље тела. Не само у многоме, него потпуно. Јер наши прародитељи нису знали за болести тела док нису унели грех у себе. А Еванђеље и стоји на тој истини: све болести и душе и тела дошле су од греха; и људска их се природа ослобођава ослобођавајући се од грехова Спаситељем. Неоспорна је еванђелска истина: људска природа назадује кроз грехе до у смрт и пакао, а напредује кроз врлине до у бесмртност и рај.'
        cn: 蒙爱者啊，我祈求上帝使你凡事兴盛——εὔχομαί σε εὐοδοῦσθαι——身体健壮，正如你的灵魂兴盛一样——εὐοδοῦταί σου ἡ ψυχή»。基督徒凡事借着上帝而兴盛，借着上帝的能力而成长。他从不自给自足，不自足的（autarkičan），而是凡事始终都需要上帝的帮助、上帝的能力。他凡事都蒙上帝恩典的帮助、扶持与激励而兴盛：无论是在爱、祷告、禁食、温柔、公义、忍耐上，以及在每一项福音的德行和圣洁上。唯有如此，他的灵魂方能「兴盛」。然而，这福音的喜讯还有后续：唯有如此，他的身体健康也能兴盛。因为，除了他自身的照护之外，上帝的帮助、上帝的能力、上帝的恩典对身体健康也是必不可少的。在这方面，他同样不能自给自足，自足的（autarkičan）。福音的德行构成了灵魂的健康，但同样在很多方面也构成了身体的健康。不仅仅是在很多方面，而是完全地。因为我们的始祖在未将罪带入自身之前，并不认识身体的疾病。而福音正立足于这一真理：灵魂与身体的一切疾病都源于罪；而人类的本性唯有借着救主脱离罪恶，才能摆脱这些疾病。这是一项不容置疑的福音真理：人类的本性借着罪恶退步，以致走向死亡与地狱，却借着德行进步，以致走向不朽与天堂。
    - type: paragraph
      text:
        ru: 3:3–4
        cn: 3:3–4
    - type: paragraph
      text:
        ru: '"Душа напредује« када човек живи истином, ходи у истини. А он то чини када живи Господом Христом и у Госиоду Христу, јер је у Њаму сва Истина, и Он је сама Истина. Божанска Истина се његова грана кроз заповести његовог светог Еванђеља, кроз еванђелске свете тајне и свете врлине. Ко у њима живи – у истини живи; ко у њима ходи – у истини ходи. Све су то сведоци који непоречно сведоче да је у души његовој жива Истина Христова. А она увек живи хранећи се светим врлинама и светим расположењима, светим мислима и светим осећањима душе. Где њих има, ту истинске радости има. Свети апостол Истине се топи од радости када види децу своју где живе у Истини Христовој и Истина у њима. Он пише своме љубљеном ученику: »Обрадовах се врло кад дођоше браћа и посведочише твоју истину – σου τῇ ἀληθείᾳ -, како ти у истини живиш – καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς. Немам веће радости од ове да чујем да деца моја у истини ходе – τὰ ἐμὰ τέκνα ἐν ἀληθείᾳ περιπατοῦντα". "Твоју истину«, јер живећи Истином Христовом ти си је учинио својом, претворио у своју Истину. А циљ је вере еванђелске да све што је Христово претворимо у Своје, у наше, у људско.'
        cn: 「灵魂得以进益，」是当一个人活在真理中，行在真理中时。他如此行，是因为他靠主基督而活，并在主基督里生活，因为一切真理都在祂里面，祂就是真理本身。神圣的真理透过他圣福音的诫命，透过福音的神圣圣事和神圣美德而得以彰显。凡活在其中者，即活在真理中；凡行在其中者，即行在真理中。所有这些都是无可辩驳的见证，见证着他灵魂中活生生的基督真理。而它，则借由圣洁美德和圣洁性情，圣洁思想和灵魂的圣洁感受，始终活泼存留。凡有这些之处，便有真实的喜乐。真理的圣使徒欢喜若狂，当他看见自己的孩子们活在基督的真理中，并且真理活在他们里面时。他写信给他所亲爱的门徒说：「我大大地欢喜，因为有弟兄来，作证你的真理 – σου τῇ ἀληθείᾳ -, 正如你活在真理中一样 – καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς. 我没有比这更大的喜乐，就是听见我的孩子们行在真理中 – τὰ ἐμὰ τέκνα ἐν ἀληθείᾳ περιπατοῦντα。」「你的真理」，因为你借由活出基督的真理，使其成为你自己的，将其转化成了你自己的真理。而福音信仰的目标是，将凡属基督的一切，都转化为我们自己的，成为我们的，成为人性的。
    - type: paragraph
      text:
        ru: 3:5–6
        cn: 3:5–6
    - type: paragraph
      text:
        ru: 'Истина живи љубављу и сведочи о себи љубављу. То је врховни закон у богочовечанском бићу Цркве. У томе је суштина вере еванђелске. Христова се истина најуспешније проповеда љубављу. Љубав је најбољи благовесник. Она нађе пут и у најокорелију душу за Истину Христову. Раскрави је, разнежи је и оспособи за живот у светој заједници Цркве. Врховно је правило у саборном животу Цркве: све радити »достојно Бога«. Свака мисао члана Цркве треба да буде достојна Христа, Бога и Господа; тако и свако осећање, и свако дело, и свако расположење. Ако је гостољубље, нека буде достојно Христа Бога: на спасење душе и гостопримцу и гостима. Свети Воанергес благовести: »Љубљени, верно радиш што чиниш браћи и гостима, који посведочише твоју љубав пред Црквом; и добро ћеш учинити ако их спремиш као што треба пред Богом – ἀξίως τοῦ Θεοῦ (= достојно Бога)".'
        cn: 真理藉爱而活，并藉爱彰显自身。这是教会神人性的存有中的至高法则。在此之中，有福音信仰的精髓。基督的真理藉着爱得到最成功的宣讲。爱是最好的传道者。它能为基督的真理在最刚硬的灵魂中找到道路。它融化它，使其柔和，并使其能适于在教会的神圣团契中生活。教会共融生活中的至高规则是：做所有事都要「配得上上帝」。教会每个成员的每个意念都应配得上基督、上帝和主；同样，每个感受、每个行为、每个心境也应如此。如果是款待，就让它配得上基督上帝：为了主人和客人的灵魂得救。圣博阿涅格斯宣讲：「亲爱的，你向弟兄和客旅所做的，是忠实的，他们已在教会面前见证了你的爱；你若照着上帝所喜悦的方式预备他们，就做对了——ἀξίως τοῦ Θεοῦ（= 配得上上帝）。」
    - type: paragraph
      text:
        ru: 3:7–8
        cn: 3:7–8
    - type: paragraph
      text:
        ru: 'Хришћани су «сарадници Истине». То је њихов позив и њихова дужност. Нехришћани су, свесно или несвесно, сарадници лажи. Јер ако човек не служи истинитом Богу – Христу, он служи ма ком другом богу, другом «идеалу»; а сваки је други бог, други идеал – лажни бог. Незнабоштво је, идолопоклонство је служити ма коме или ма чему сем Христу Богу, па служио као богу ма ком људском бићу: хероју, пророку, мудрацу, генију, војсковођи, научнику; или ма ком живом бићу: од црва до Анђела; или ма којој твари: од атома до васионе; или ма каквој идеји, култури, цивилизацији, философији, науци, уметности, техници. Види ли човек циљ и смисао свога живота ма у чему другом сем у Христу – идолопоклоник је, незнабожац је. А самим тим сарадник је лажи. Хришћани се тиме и одликују од осталих људи што знају Истину, имају Истину, сарађују Истини, те на тај начин знају смисао и циљ и човека и света, и као «сарадници Истине» раде на томе дан и ноћ. Свети Богослав и вели зато: «Ми смо дужни … да будемо сарадници Истине – συνεργοὶ τῇ ἀληθείᾳ".'
        cn: 基督徒是「真理的同工」。这是他们的呼召和职责。非基督徒，无论有意识还是无意识，都是谎言的同工。因为如果人不安侍奉真神——基督，他就侍奉任何其他神，另一个「理想」；而每一个其他的神，另一个理想——都是假神。异教主义，偶像崇拜，就是侍奉除了基督上帝之外的任何人或任何事物，即使是把任何人类存在当作神来侍奉：英雄、先知、智者、天才、将军、科学家；或任何活物：从虫子到天使；或任何受造物：从原子到宇宙；或任何理念、文化、文明、哲学、科学、艺术、技术。如果人生命的意义和目的在基督之外的任何事物中——他就是拜偶像者，他就是异教徒。而因此他就是谎言的同工。基督徒因此而与其他人不同，因为他们知道真理，拥有真理，与真理同工，从而知道人与世界的目的和意义，并作为「真理的同工」日日夜夜为此而工作。圣波戈斯拉夫因此说道：「我们有责任……成为真理的同工——συνεργοὶ τῇ ἀληθείᾳ。」
    - type: paragraph
      text:
        ru: 3:9–10
        cn: 3:9–10
    - type: paragraph
      text:
        ru: 'Нигде властољубље није тако страшан грех као у Цркви. Увуче ли се у срце човеку, оно прогони из њега љубав, и са љубављу истину. И на место њих зацари свако зло. А у Цркви се влада љубављу и истином: највећи с љубављу служи најмањом; најстарији је свима слуга, увек по угледу на свесавршеног Господа Исуса који није дошао у наш земаљски свет «да му служе, него да служи и да душу своју да у откуп за многе» (Мф.20:26–28). То издваја Цркву од свих организација у свету; то је оно што је чини не од овога света и што показује да је сва од онога света, од света божанске љубави и истине Христове.'
        cn: 在任何地方，贪恋权势都没有像在教会中那样是如此可怕的罪。一旦它潜入人心，它便将爱逐出，连同爱，真理也随之被逐出。一切邪恶便取而代之，作王掌权。然而，在教会中，是以爱与真理为主导的：至大的怀着爱心服事至小的；最年长的也是所有人的仆人，永远效法着全然完美的主耶稣，祂来到我们这个尘世，「不是要受人的服事，乃是要服事人，并且要舍命，作多人的赎价。」(马太福音 20:26-28)。这将教会与世上所有组织区分开来；这使其不属于这个世界，并表明它完全属于那个世界，属于神圣之爱和基督真理的世界。
    - type: paragraph
      text:
        ru: '3:11'
        cn: '3:11'
    - type: paragraph
      text:
        ru: '"Љубљени, не угледај се на зло него на добро – μὴ μιμοῦ τὸ κακόν, ἀλλὰ τὸ ἀγαθόν -. Који добро чини од Бога је – ὁ ἀγαθοποιῶν ἐκ τοῦ Θεοῦ ἐστιν; а који зло чини не виде Бога«. Иза сваког добра стоји Добри, Сведобри. Он и даје силе, Он и побуђује човека да чини добро. Чини ли човек добро, знак је да се духовно сјединио са Једино Добрим, са Богом, толико сјединио, да се у Њему све духовне силе рађају од Бога, исходе од Бога. Нема добра у човеку да није од Бога; али исто тако нема зла у човеку да није од ђавола. Од чињења зла у души се диже нека црна магла, која заклања Бога од духовног вида, те човек не види Бога ни у себи ни над собом, ни у свету ни над светом. »Који зло чини«, чини га зато што је увек, свесно или несвесно, у духовној вези са творцем зла. Чињење зла ослепи човека, те не види Бога, па често почне и тврдити како нема Бога. Рђави људи су по правилу безбожници, јавни или тајни. Веле: има и безбожника добрих људи. Да, безбожници могу бити: привремено добри, површно добри, фарисејски добри. Али, безбожник не може бити истински добар, трајно добар, дубоко добар, бесмртно добар, јер је за то потребно бити у духовној вези, у духовном сродетву са стварно Једино Добрим и Вечно Добрим: Богом и Господом Христом. Истинита је кроза све векове божанска реч Спаситељева: »Без мене не можете чинити ништа" (Ин.15:5).'
        cn: 「『亲爱的，不要效法恶，而要效法善 — μὴ μιμοῦ τὸ κακόν, ἀλλὰ τὸ ἀγαθόν —。行善的，是属神的 — ὁ ἀγαθοποιῶν ἐκ τοῦ Θεοῦ ἐστιν；行恶的，未曾见过神。』（约翰三书 1:11）」在每一个善的背后，都站着那良善者，那至善者。祂赐予力量，祂也感动人去行善。人若行善，乃是其与独一的良善者——神——在灵里合一的标志，如此合一，以至于在他里面所有的属灵力量都由神而生，由神而出。人里面没有不来自神的善；但同样，人里面也没有不来自魔鬼的恶。因着行恶，灵魂中升起一片黑雾，这黑雾遮蔽了属灵的视线，使人看不见神，以致于人既不能在自己里面、也不能在自己之上、既不能在世界里面、也不能在世界之上看见神。『行恶的』，之所以行恶，是因为他总是，无论有意识还是无意识地，与邪恶的创造者处于属灵的联系之中。行恶使人盲目，以致看不见神，甚至常常开始宣称没有神。恶人通常是无神论者，无论是公开的还是隐秘的。他们说：无神论者中也有好人。是的，无神论者可以是：暂时性良善的，表面性良善的，法利赛式良善的。但是，无神论者不可能是真正良善的，持久良善的，深刻良善的，不朽良善的，因为为此需要与真正独一的良善者和永恒的良善者——神和主基督——建立属灵的联系，处于属灵的亲缘关系之中。救主的圣言，历世历代都是真实的：「离了我，你们就不能做什么」（约翰福音 15:5）。
    - type: paragraph
      text:
        ru: 3:12–15
        cn: 3:12–15
    - type: paragraph
      text:
        ru: 'У Цркви сама Истина сведочи за себе, а сведоче за њу и сведоци Истине. Сама Истина је Господ Христос, а сведоци Истине су Апостоли, Светитељи и сви верници. Уствари, Црква и није друго до непрекидно сведочанство о Христу – Богу и Спаситељу света и човека. Јер у њој непрекидно живи и дела Богочовек Христос и сва његова божанска савршенства са свима божанским силама: «Исус Христос јуче је и данас онај исти и увек» (Евр.13:8): увек је иста и његова животворна и чудотворна сила, увек је иста и његова Љубав, и Његова Истина, и Његова Правда, и Његова Доброта, и Његова Вечност; увек је исто и Његово Еванђеље. Ко има очи да види, може то и данас видети, као што су то и пре две хиљаде година видели они који су хтели да виде.'
        cn: '在教会中，真理本身为自己作证，真理的见证人也为她作证。真理本身是主基督，真理的见证人是使徒们、圣人们以及所有的信徒。实际上，教会不过是对基督——世界的上帝和人类的拯救者——的不间断见证。因为在其中，神人基督以及他所有的神圣完美连同所有的神圣力量不间断地生活和运行：


          「耶稣基督昨日、今日、直到永远、是一样的。」（希伯来书 13:8）


          他的赐生命和行神迹的力量始终如一，他的爱也始终如一，他的真理、他的公义、他的良善、他的永恒也始终如一；他的福音也始终如一。凡有眼能看的，今天也能看见，正如两千年前那些愿意看见的人所看见的。'
