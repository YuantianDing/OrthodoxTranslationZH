      ru: Прва глава[1]
      cn: 第一章[1]
    children:
    - type: paragraph
      text:
        ru: 1 Јованова 1:1–10[2]
        cn: 约翰一书 1:1-10[2]
    - type: paragraph
      text:
        ru: 1Ин.1:1–10:1Што бјеше од почетка, што смо чули, што смо видјели очима својима, што сагледасмо и руке наше опипаше, о Логосу (Ријечи) живота; 2 И Живот се јави, и видјели смо, и свједочимо, и објављујемо вам Живот вјечни, који бјеше у Оца и јави се нама; 3 Што смо видјели и чули објављујемо вама да и ви с нама имате заједницу, а наша заједница је са Оцем и са Сином његовим Исусом Христом. 4 И ово вам пишемо да радост наша буде потпуна. 5 И ово је обећање које смо чули од њега и јављамо вама, да је Бог свјетлост, и таме у њему нема никакве. 6 Ако речемо да имамо заједницу с њим и у тами ходимо, лажемо и не творимо истину. 7 Ако ли у свјетлости ходимо, као што је Он сам у свјетлости, имамо заједницу једни са другима, и крв Исуса Христа, Сина његова, очишћава нас од свакога гријеха. 8 Ако речемо да гријеха немамо, себе варамо, и истине нема у нама. 9 Ако исповиједамо гријехе своје, вјеран је и праведан да нам опрости гријехе, и очисти нас од сваке неправде. 10 Ако речемо да нисмо сагријешили, правимо га лажом и ријеч његова није у нама.
        cn: 约翰一书 1:1-101 从起初就有的，我们所听见的，我们亲眼所看见的，我们所瞻望、我们双手所抚摸过的，论到生命的道（圣言）；2 这生命已经显现，我们也看见了，也作见证，将这永远的生命传报给你们；这生命原是与父同在，现今向我们显现了；3 我们所看见、所听见的，我们传报给你们，为要使你们也与我们有相交，而我们的相交是与父，并与他儿子耶稣基督的。4 我们写这些事给你们，为要使我们的喜乐得以满足。5 这就是我们从他那里所听见的应许，现在传报给你们，就是神是光，在他里面毫无黑暗。6 我们若说与他相交，却仍在黑暗里行，就是说谎话，不行真理。7 我们若在光中行，像他（神）在光中一样，就彼此相交，他儿子耶稣基督的血就洗净我们一切的罪。8 我们若说自己没有罪，就是自欺，真理就不在我们心里了。9 我们若认自己的罪，神是信实的，是公义的，他必赦免我们的罪，洗净我们一切的不义。10 我们若说没有犯过罪，就是以神为说谎的，他的道就不在我们心里了。
    - type: paragraph
      text:
        ru: '1:1'
        cn: '1:1'
    - type: paragraph
      text:
        ru: 'Основна благавест, и мисао, и истина: Бог Логос се оваплотио, да бисмо се ми Њему саоваплотили; Он се очовечио, да би нас обожио; Он – Живот вечни – јавио се на земљи, да бисмо имали заједницу са Њим живећи Њиме. «Περὶ τοῦ Λόγου τῆς ζωῆς =О Логосу живота», то је тема овог Еванђеља. Као да свети Богослов жели да нам да ново објашњење основне благовести свога Еванђеља: «Логас постаде тело» (Ин.1:14). Бог Логос, који је Вечни Живот, прешао је к нама: то «што беше од почетка – Ὃ ἦν ἀπ’ ἀρχῆς», тј. Вечно, сиђе на земљу, пастаде тело, постаде наша земаљска стварност, приступачно нашим чулима, нашем сазнању и осећању; и то је оно «што чусмо»: чусмо благовест Бога Логоса; то је оно «што видесмо очима својим»: видесмо Бога у телу, Бога у свету, Бога међу нама; то је оно «што расмотрисмо – ὃ ἐθεασάμεθα»: разгледасмо, посматрасмо Бога у човеку; то је оно «што руке наше опипаше»: опипаше тело Бога Логаса, како пре његове крсне смрти, тако и после васкрсења његовог из мртвих. «Чусмо, видесмо, размотрисмо, опипасмо» – Реч живота, Логос живота, Бога живота. Бог Логос је постао наша најближа стварност; и ми то проверавамо на најочигледнији, најексперименталнији начин. Метод је чисто екеперимеиталан, опитан. «Логос живота» је уствари Логика живота, Мудрост живота, Реч живота. До Њега – живот је био алогосан, бесмислен; до Њега – живот је био алогичан, и стога нелогичан, у њему није било неке сношљиве логичности, све – хаос, све – «сајам бесмислени»; до Њега – Речи живота – живот је био нем и немушт, није умео да говори, да каже, да изрази, да изрече себе, своју тајну, своју муку, свој бол, своју радост. Са Њим – живот све то добија; живот је проговорио, јер се ологосио; живот се осмислио, јер се ологосио; живот се освемудрио, јер се ологосио. А живот је био постао алогосан, алогичан – бесмислен, бесциљан, глуп – грехом и због греха.'
        cn: 核心的福音、思想和真理是：上帝圣言道成肉身，是为了让我们与祂一同道成肉身；祂取了人性，是为了使我们神化；祂——永生——显现于世，是为了让我们借着祂而活，并与祂相交。「论生命的道 =关于生命之道」，这是这部福音的主题。仿佛圣使徒约翰（这位神学家）想给我们对他的福音之基本信息，即「道成了肉身」（约翰福音 1:14），一个新的解释。上帝圣言，即永恒的生命，降临到我们这里：那「从起初原有的」（Ὃ ἦν ἀπ』 ἀρχῆς），即永恒者，降临于世，成为肉身，成为我们属世的实相，可被我们的感官、我们的认知和感受所触及；而那就是「我们所听见的」：我们听见了上帝圣言的福音；那就是「我们亲眼所看见的」：我们看见了肉身中的上帝，世上的上帝，我们中间的上帝；那就是「我们所瞻望的」（ὃ ἐθεασάμεθα）：我们审视、观察了人中的上帝；那就是「我们手所摸过的」：我们触摸了上帝圣言的肉身，无论是在祂十字架上的死亡之前，还是在祂从死里复活之后。「我们听见了，我们看见了，我们瞻望了，我们摸过了」——生命的言语，生命的圣言，生命的上帝。上帝圣言已成为我们最切近的实相；我们以最显而易见、最具经验性的方式来验证这一点。这种方法纯粹是实验性的，是经验性的。「生命之圣言」实际上就是生命的逻辑，生命的智慧，生命的言语。在祂到来之前——生命是无理性的，无意义的；在祂到来之前——生命是不合逻辑的，因此是不合理的，在其中没有一丝可忍受的逻辑性，一切——都是混乱，一切——都是「无意义的集市」；在祂到来之前——生命的言语——生命是哑口无言、无法表达的，它不知道如何开口，如何述说，如何表达，如何道出自己，自己的奥秘，自己的苦楚，自己的痛苦，自己的喜乐。与祂同在——生命获得了这一切；生命开口说话了，因为它因道而有了逻辑；生命获得了意义，因为它因道而有了逻辑；生命获得了全备的智慧，因为它因道而有了逻辑。而生命之所以曾变得无理性、不合逻辑——无意义、无目标、愚蠢——是因着罪并由于罪。
    - type: paragraph
      text:
        ru: Оно што је за људску мисао, била она грчка, римска, индијска или која друга, било и остало идеал или идеја, апстракција и оностраност, оваплоћењем Бога Логоса постало је живот, наш земаљски живот. За Логосом и Логиком живота не треба ,ићи у онај свет, јер је Логика и Логос живота ту, међу нама. Ми имамо Логос живота, зато знамо Логику живота, циљ живота, смисао живота. Ако нисмо знали почетак живота, ево га Бог Логас, јер је то оно «што беше од почетка– ἀπ’ ἀρχῆς». Живот није нешто бесмислено, већ од самог почетка нешто божански логично. А грех је сила која све делогосира, лишава божанске логике и логичности, божанског смисла и осмишљености. Уствари, грех је једини обесмислитељ живота.
        cn: 人类思想，无论是希腊的、罗马的、印度的还是其他的，所曾是或所仍然是理想、理念、抽象和彼岸之物，通过上帝道（逻各斯）的道成肉身，成为了生命，我们尘世的生命。为寻求生命的道（逻各斯）和逻辑，我们无需「去往彼世」，因为生命的逻辑和道（逻各斯）就在我们中间。我们拥有生命的道（逻各斯），因此我们知晓生命的逻辑、生命的目的、生命的意义。如果我们曾不知生命的开端，看哪，上帝道（逻各斯）就是生命的开端，因为祂正是「从起初就有—— ἀπ』 ἀρχῆς」的那一位。生命并非毫无意义，而是从起初就具有神性的逻辑。而罪恶，则是一种力量，它使一切事物脱离了道（逻各斯）的统摄，剥夺了其神性的逻辑和理性，以及神性的意义和旨趣。实际上，罪恶是唯一使生命失去意义之物。
    - type: paragraph
      text:
        ru: '1:2'
        cn: '1:2'
    - type: paragraph
      text:
        ru: 'До оваплоћења Бога Логоса као да није било живота на земљи. Уколико га је било, то је било наличје живота, сурогат живота, фалсификат живота; просто: псевдоживот. Јер какав је то живот, у коме има смрти, и који се завршава смрћу? То је пре неко постепено умирање. А то значи – постепено мучење. Само онај живот је достојан назива живота који не умире, који се не завршава смрћу, већ савлађује смрт и васкрсењем прави мост у бесмртност. Уствари живот је једино Живот Вечни. А тај живот се први пут јавио у нашем човечанском свету са Богом Логосом: Богочовеком Христом. Зато свети Богослов благовести: «И живот се јави, и видесмо, и сведочимо, и јављамо вам живот вечни, који беше у Оца, и јави се нама». Живот и Вечни живот су синоними. Нема живота без Вечнога живота. Са Богочовеком «живот се јави» у нашем свету смрти и псевдоживота. Тек у Њему «видесмо» прави живот, «видесмо» шта је живот; видесмо и видимо да је само вечни живот – прави живот. То је оно што је најочигледније у Богочовеку. Сав Богочовек, и све његово, дише и зрачи вечним животом: нема његове мисли која не извире из вечног живота и не увире у њега; тако и свака његова реч, и дело, и осећање. У свему његовом осећа се присуство Вечнога; и валови вечнога живота запљускују нас из свега његовог. Хоћеш да видиш како живи Вечни у времену, – гледај Исуса. Из свега његовог кључа вечни живот, и то сав – онакав какав је и у оном свету; не, какав је у самом Богу Оцу, јер Он «тако и Сину даде да има живот у себи» (Ин.5:26). То је сведочанство очевидаца. Они и изјављују са бескрајном сигурношћу: «сведочимо, и јављамо вам живот вечни, који беше у Оца, и јави се нама». До његове пајаве смрт је била у нама и око нас; људи нису могли ни знати ни стећи живот вечни док се Он сам није спустио у наш свет и јавио нам се.'
        cn: 在上帝圣言道成肉身之前，地上仿佛没有生命。即便有，那也只是生命的假象，生命的替代品，生命的伪造品；简言之：伪生命。因为那其中有死亡、并以死亡告终的生命，算是什么样的生命呢？那倒不如说是一种逐渐的死亡。而那意味着——逐渐的折磨。唯有不死的、不以死亡告终的生命，反而战胜死亡，并以复活建造通往不朽之桥梁的生命，才配得上生命的称谓。事实上，生命唯独是永恒生命。而那生命第一次显现在我们人类世界中，是与上帝圣言、即神人基督一同显现的。因此，圣神学家宣报：「生命已经显现了，我们也看见了，现在又作见证，将原与父同在、已经向我们显现的永恒生命传报给你们。」生命与永恒生命是同义词。没有永恒生命，就没有生命。与神人同在，「生命显现」在我们这死亡与伪生命的世界中。唯独在祂里面，我们「看见」了真正的生命，我们「看见」了什么是生命；我们看见了，也正看见，唯有永恒生命才是真正的生命。那是神人身上最显而易见的。整个神人，以及祂的一切，都呼吸并放射着永恒的生命：祂没有哪一个思想不是源于永恒生命，又归于永恒生命的；祂的每一句话、每一个行动、每一种感受亦是如此。在祂的一切之中，都能感受到永恒者的临在；永恒生命的波涛从祂的一切之中冲刷着我们。如果你想看见永恒者如何在时间中生活——就看耶稣吧。从祂的一切之中涌出永恒的生命，并且是那样的——如同在彼世的生命一般；不，是如同在上帝圣父本身之中的生命，因为祂「照样也赐给子在自己有生命」（约翰福音 5:26）。那是目击者的见证。他们也以无限的确定性宣称：「我们作见证，并将原与父同在、已经向我们显现的永恒生命传报给你们。」在祂显现之前，死亡在我们里面和周围；人们既无法认识也无法获得永恒生命，直到祂亲自降临我们的世界并向我们显现。
    - type: paragraph
      text:
        ru: '1:3'
        cn: '1:3'
    - type: paragraph
      text:
        ru: 'Откуда у светог Богослова овакво смело сведочанство? Од личног искуства: јер је сам окусио вечни живот, ступио у заједницу са њим, узео учешћа у њему преко Господа Исуса. Живети у заједници са Господом Исусом, имати заједницу – κοινωνίαν – са Њим, и јесте налазити се у вечном животу. Тај живот је уствари заједница са Тројичним Божанством. Утројичити се преко Богочовека, и отројичити се, и није друго него живети вечним животом. И онда човек у себи самом осећа и види вечни живот. И стално се налази у заједници вечних људских бића. Јер хришћани се тиме одликују од осталих људи што имају вечни живот, и живе њиме овде на земљи. Стога и јављају живот вечни. Све је код њих у том погледу засновано на личном искуству, на личном општењу са Вечним. Стога очевидац свети и истинити благовести: «Што видесмо и чусмо то јављамо вама да и ви имате заједницу с нама – κοινωνίαν … μεθ’ ἡμῶν, а наша је заједница са Оцем и са Сином његовим Исусом Христом». Живот хришћана је живот са Божанском Тројицом: заједница, општење са Њом, са њеним животворним, стваралачким, вечним силама и светињама. Општење са Вечним и даје људима вечни живот. То није неко спољашње посматрање, већ унутрашње доживљавање Свете Тројице. То је уистини κοινωνία – заједничарење човека са Богом, саоваплоћавање Богу. Све је ту лично, опитно, животно, све ново. Сав Бог Логос ушао је у човека, учовечио се; ушао је у тело, оваплотио се. Логос је у телу, у човеку, ту с нама и међу нама и у нама; а са Њим и сав Живот вечни, и сва Истина вечна, и сва Љубав вечна, и сва Светлост вечна, и сва савршенства његова вечна; да бисмо преко Њега имали заједницу са свима божанским, вечним савршенствима. Свети Богослов је јасан: живот хришћана је сав у Светој Тројици – од Оца кроз Сина у Духу Светом; то је заједница са Светом Тројицом: «наша је заједница са Оцем и са Сином Његовим Исусом Христом». Јер Бог је међу нама, да би био у нама; Он је и са нама, да би био у нама.'
        cn: 圣神学家何以作出如此大胆的见证？源于亲身经历：因为他自己尝到了永生，进入了与永生的相通，借着主耶稣而参与了永生。活在与主耶稣的相通中，拥有与祂的相通——κοινωνίαν——就是置身于永生之中。那生命实际上就是与三一神性的相通。借着道成肉身的神人而与三一神性合一，并由此而被三一化，无非就是活出永生。于是人便在自身中感受并看见永生。并恒常地置身于永恒人类的相通之中。因为基督徒以此区别于其他人：他们拥有永生，并在此世就活出永生。因此他们也宣告永生。在这方面，他们的一切都建立在亲身经历上，建立在与永恒者的亲身相通上。因此，圣洁而真实的目击者传扬福音说：「我们将所看见、所听见的传给你们，使你们也与我们相通——κοινωνίαν … μεθ』 ἡμῶν，而我们的相通是与父并与祂的儿子耶稣基督的。」基督徒的生命是与神圣三一的生命：与祂、与祂那赐生命的、创造性的、永恒的能力和圣性相通。与永恒者的相通也赐予人们永生。这并非某种外在的观察，而是对圣三一的内在体验。这确确实实是κοινωνία——人与神的相通，与神同道成肉身。在此，一切都是个人的、经验的、生命的、一切都是新的。整全的神性逻格斯进入了人里面，使自己人化；祂进入了肉身，道成肉身。逻格斯在肉身中，在人里面，在此与我们同在，在我们之间，并在我们里面；而与祂同在的，还有整全的永恒生命，整全的永恒真理，整全的永恒爱，整全的永恒光，以及祂一切永恒的完美；好使我们通过祂与一切神圣的、永恒的完美相通。圣神学家言明：基督徒的生命全然在圣三一之中——从父借着子在圣灵里；这便是与圣三一的相通：「我们的相通是与父并与祂的儿子耶稣基督的。」因为神在我们中间，是为了在我们里面；祂也与我们同在，是为了在我们里面。
    - type: paragraph
      text:
        ru: '1:4'
        cn: '1:4'
    - type: paragraph
      text:
        ru: 'Од тог живота у Светој Тројици, од те заједнице са Оцем и Сином и Св. Духом биће се људско испуњује истинском радошћу, која и није друго до божанско блаженство. Без тога, људско је биће испуњено тугом, чемером, јадом. А чиме би га, ако не тиме, и могла испунити смрт, а пре ње грех? Кроз сваки грех у душу навре, ако не бујица горчине, оно бујица греховне сласти која се постепено претвара у горчину. У сваком случају, сваки учињен грех спусти у душу бар кап горчине која се неосетно разлије по души, и кад дође време разраста се у огромну тугу. И често пута, човек и не зна откуда му тута у души, у срцу. А заједница са Христом, и његовим светим врлинама, испуњује биће људско непролазном радошћу. Од живљења љубављу Христовом – душа се људска испуни неисказаном радошћу; тако и од живљења правдом Христовом, добротом Христовом, смерношћу и кротошћу Христовом. И кад човек погледа у себе, а оно – гле, сав је испуњен божанском радошћу, и у Њему нема ни туге од греха, ни страха од смрти. Стога свети Богослов благовести: «И ово вам пишем да радост ваша буде испуњена – πεπληρωμένη».'
        cn: '从圣三一中的那种生命，从与父、子和圣灵的团契，人的生命就充满真正的喜乐，而这喜乐无非就是神圣的福乐。若非如此，人的生命便充满忧伤、苦涩和悲痛。那么，除了那（喜乐），死亡，以及在死亡之前的罪恶，还能用什么来充满它呢？通过每一个罪，涌入灵魂的，如果不是一股苦涩的洪流，那便是一股罪恶的甜美之流，而这甜美逐渐转化为苦涩。无论如何，每一个所犯的罪，都会在灵魂中留下至少一滴苦涩，这苦涩不知不觉地弥漫整个灵魂，待时机成熟时，便会蔓延成巨大的忧伤。而且，常常，人甚至不知道这忧伤从何而来，弥漫在他的灵魂深处，在他的心里。


          然而，与基督的团契，以及祂的神圣美德，使人的生命充满不朽的喜乐。通过活出基督的爱，人的灵魂便充满无法言喻的喜乐；同样，通过活出基督的公义、基督的良善、基督的谦卑与温柔，人的灵魂也是如此。当人审视自己时，看哪，他便发现自己全然充满神圣的喜乐，在他里面，既没有因罪而生的忧伤，也没有对死亡的恐惧。因此，圣神学家宣报说：「我将这些写给你们，是要叫你们的喜乐得以充满 – πεπληρωμένη。」'
    - type: paragraph
      text:
        ru: '1:5'
        cn: '1:5'
    - type: paragraph
      text:
        ru: '"И ово је вест – ἡ ἀγγελία – коју чусмо од њега и јављамо вама – ἀγγέλλομεν ὑμῖν[3]– да је Бог светлост φῶς и таме у њему нема никакве«. У томе је изузетна благовест Богочовекова: «Бог је светлост». Значи: Он је узрок и извор свега светлог, свега истинитог, свега доброг, свега праведног, свега бесмртног; а нипочему није ни узрок ни саузрок, ни извор ни саизвор – зла, греха, смрти, лажи. Ову вест је Христос казао и животом својим показао да је Бог заиста светлост, и да у Њему нема никакве таме. Где је тама у Богочовеку? где је грех у Њему? Покаже ли неко грех у Њему, показао је таму. Али то није у стању нико показати. Тама је од греха, а грех је од ђавола, који је сав тама. Јер ђаво је тиме ђаво што је у свему и по свему сушта супротност Богу. «Бог је светлост», ђаво је тама; Бог је живот, ђаво је смрт; Бог је истина, ђаво је лаж. Зато је Господ Христос, као истинити Бог, и могао рећи за себе: «Ја сам светлост света", "Ја сам светлост живота». А ђаво би могао с пуним правом рећи за себе: ја сам тама света; ја сам тама живота. Само због њега, људи не виде смисао света и циљ живота. Он тамом својом чини те очи људске не виде ни шта је уствари свет, ни шта живот. Јер да би очи могле видети, потребна је светлост. А њу има, и стога и даје, само Богочовек Христос. Ми светлошћу видимо. Узалуд су нам очи без светлости.'
        cn: 这就是我们从他那里听到的信息——ἡ ἀγγελία——并向你们宣报——ἀγγέλλομεν ὑμῖν[3]——说神是光 φῶς，在他里面毫无黑暗。」 在此乃是神人非凡的喜讯：「神是光。」 这意味着：他是使一切光明之物、一切真实之物、一切美好之物、一切公义之物、一切不朽之物得以存在的起因和源泉；而他绝非罪恶、罪、死亡、谎言的起因或共同起因，也绝非其源泉或共同源泉。 基督宣讲了这信息，并以其生命表明神确实是光，且在他里面毫无黑暗。 在神人里面何处有黑暗？在他里面何处有罪？ 若有人指出他里面有罪，就等同于指出了黑暗。 但无人能指出这一点。 黑暗源于罪，而罪源于魔鬼，魔鬼本身就是全然的黑暗。 因为魔鬼之所以是魔鬼，乃因他在一切事上、在各方面都与神全然对立。 「神是光」，魔鬼是黑暗；神是生命，魔鬼是死亡；神是真理，魔鬼是谎言。 因此，主基督作为真神，才能如此论及自身：「我是世界的光」，「我是生命的光」。 而魔鬼则可以理直气壮地论及自身说：我是世界的黑暗；我是生命的黑暗。 仅仅因为他，人们看不见世界的意义和生命的目的。 他以其黑暗使人的眼睛看不见世界的真实面貌，也看不见生命的真谛。 因为眼睛若要能看见，就需要光。 而唯有神人基督拥有光，因此也赐予光。 我们藉着光看见。 我们的眼睛若没有光，便是徒然。
    - type: paragraph
      text:
        ru: '1:6'
        cn: '1:6'
    - type: paragraph
      text:
        ru: 'И ова благовест о Богу као светлости је посведочена искуством, опитом. И то искуством и личним опитом свих правих хришћана. Јер су се лично осведочили да живећи Христом и у Христу они стварао живе светлошћу и у светлости. Нема таме из које их Христос не изведе; нема греха који они Христом не победе. Као што испред сунца иде праскозорна светлост, тако и испред Христа – Светлости света и живота – иде праскозорна светлост његових светих врлина. Почне ли их човек упражњавати, оне по души његовој разливају праскозорну светлост која најављује рађање вечног Сунца правде, које кад се роди у души, никад више не заходи. Али, исто тако, тама грехова иде испред таме творца грехова. Навру ли у душу, они разлију по њој таму, све гушћу и гушћу, те човак и не примети када се у њу увуче сам творац таме и греха – ђаво. Ко живи у греху, у тами живи, те не зна куда иде. Сваки грех вуче у царство греха -смрт; и свака тама вуче у царство таме – пакао. А и у царству смрти и у царству таме један је цар, један господар – ђаво. Свети Еванђелист благовести: «Ако речемо да имамо заједницу с њим а у тами ходимо, лажемо и не творимо истине – οὐ ποιοῦμεν τὴν ἀλήθειαν".'
        cn: '这关于上帝是光的福音，是经过经验和实践所证实的。它是由所有真正的基督徒的经验和个人实践所证实的。因为他们亲身证实，藉着基督并活在基督里，他们就真正地活在光明之中，并以光而活。没有基督不能将他们从中领出的黑暗；没有他们藉着基督不能战胜的罪。正如黎明之光先于太阳而至，照样，在基督——世界和生命之光——之前，是祂圣洁美德的黎明之光。人若开始实践这些美德，它们便会在他的灵魂中倾泻出黎明之光，预示着公义永恒之日的诞生，这日一旦在灵魂中升起，便永不落下。


          然而，同样地，罪恶的黑暗也先于罪恶之创造者的黑暗而至。它们若涌入灵魂，便会向其倾泻出越来越浓密的黑暗，以至于人甚至没有察觉到黑暗和罪恶的创造者——魔鬼——何时潜入其中。凡活在罪中的人，就是活在黑暗中，也不知道自己往哪里去。每一种罪都将人拖入罪恶的国度——死亡；每一种黑暗都将人拖入黑暗的国度——地狱。而在死亡的国度里，以及在黑暗的国度里，只有一个君王，一个主宰——魔鬼。


          圣福音传道者宣报说：「我们若说与他有相交，却仍在黑暗里行，就是说谎话，不行真理了 – οὐ ποιοῦμεν τὴν ἀλήθειαν。」(约翰一书 1:6)'
    - type: paragraph
      text:
