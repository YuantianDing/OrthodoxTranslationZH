        cn: '1:7'
    - type: paragraph
      text:
        ru: 'Бог Логос, који је Светлост, постао је човек, да би своју Божанску Светлост дао људима, учинио је приступачном за њих; да би она постала њиховом својином. Уопште, својим оваплоћењем Бог Логос хоће да све што је Божје учини заједничким за људе, оваплотљивим у људском животу и свету. Гесло је: »као што је Он сам« – тако и ми треба да будемо. Као што је Он сам светлост, тако и ми треба да постанемо светлост; као што је Он сам у светлости, тако треба и ми да будемо. Исто тако, као што је Он сам у Истини, тако и ми треба у њој да будемо. Све што је његово оваплоћењем постало је наше. Сам вечни Живот Он је снео с неба на земљу, а са њим и све оно чиме вечни живот живи; а то је: вечна Истина, вечна Светлост, вечна Правда, вечна Љубав, вечна Доброта, вечна Мудрост, и сва остала вечна савршенства божанска. И то је снео с неба на земљу, да би све то постало наше, људско. Јер вечни Живот постаје наш, ако живимо у свима овим вечним савршенствима богочовечанским. Живимо ли тако, божанске силе тих вечних савршенстава изгоне из нас сваки грех, очишћују нас од сваке нечитоте. Разуме се, сва та савршенства сачињавају суштину Богочовекове Личности; она су крв његова, тело његово; а где је света крв његова – ту је и сав вечни живот; јер је у крви Његовој Богочовечанској – живот његов. А кроз Њега, и од Њега, и због Њега – и наш. Богочовак је тај који раздајући вечни живот људима, и своја вечна савршенства, помоћу њих сједињује људе у једну нову заједницу, бесмртну, богочовечанску, вечну: у једно тело – Цркву, кроз које струји и тече богочовечанска крв Христова која очишћава од свакога греха све заједничаре, све сутелеснике његовог Богочовечанског тела. Крв пресвета умива нас Светлошћу, умива Истином, умива Правдом, Љубављу. И људско биће заблиста у невиђеној чистоти. Стога Еванђелист и благовести: »Ако ли у светлости ходимо, као што је Он сам у светлости – ἐν τῷ φωτὶ, имамо заједницу један с другим – κοινωνίαν ἔχομεν μετ’ ἀλλήλων, и крв Исуса Христа, Сина Његова, очишћава нас од свакога греха".'
        cn: 上帝道（逻格斯），祂是光，成为了人，为要将祂的神圣之光赐予人们，使其对他们而言是可接近的；为要使这光成为他们的产业。总而言之，藉着祂的道成肉身，上帝道（逻格斯）愿意使一切属于上帝的事物成为人们所共有的，使其在人类生命和世界中得以 вопло。其座右铭是：「正如祂自己一样」——我们也当如此。正如祂自己是光，我们也当成为光；正如祂自己在光中，我们也当在光中。同样地，正如祂自己在真理中，我们也当在其中。凡属祂的一切，都藉着道成肉身成为了我们的。祂亲自将永恒的生命从天上带到地上，并与这生命一同带来了永恒生命所赖以生存的一切；那就是：永恒的真理，永恒的光，永恒的公义，永恒的爱，永恒的良善，永恒的智慧，以及所有其他的神圣永恒的完美。祂将这一切从天上带到地上，为要使这一切成为我们的，成为人类的。因为如果我们活在所有这些神人合一的永恒完美之中，永恒的生命就成为我们的。如果我们如此生活，那些永恒完美的属神力量就会将我们里面的一切罪恶驱逐出去，洁净我们脱离一切不洁。不言而喻，所有这些完美构成了神人位格的本质；它们是祂的血，祂的身体；而在祂的圣血所在之处——那里也有所有永恒的生命；因为在祂神人合一的血中——有祂的生命。而藉着祂，源于祂，并为了祂——也有我们的生命。是这位神人，祂将永恒的生命和祂的永恒完美分赐给人们，借此将人们联合成一个全新的、不朽的、神人合一的、永恒的团契：一个身体——教会。基督神人合一的宝血流淌并涌动于其中，洁净一切团契成员，一切祂神人合一身体的同肢，使其脱离一切罪恶。这至圣的宝血以光洗涤我们，以真理洗涤我们，以公义洗涤我们，以爱洗涤我们。于是，人类的生命在前所未有的纯洁中闪耀。因此，传福音者也宣扬说：「如果我们行在光中，正如祂自己在光中 – ἐν τῷ φωτὶ，我们便彼此相交 – κοινωνίαν ἔχομεν μετ』 ἀλλήλων，祂儿子耶稣的宝血就洁净我们脱离一切的罪。」 (约翰一书 1:7)
    - type: paragraph
