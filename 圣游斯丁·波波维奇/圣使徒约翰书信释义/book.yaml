    ru: Тумачење посланица Светог Jована Богослова
    cn: 圣约翰神学家的书信注解
  children:
  - type: heading2
    text:
      ru: Реч о овом издању
      cn: 关于本版
    children:
    - type: paragraph
      text:
        ru: Ово Тумачење Посланица Св. Апостола Јована Богослова– издавано сада о трогодишњици блаженог престављења (+ Благовести, 1979–82) преподобног Оца Јустина – писао је овај неуморни Благовесник Христов пре скоро 40 година, у околностима донекле сличним онима у којима је писао своја света Писма Свети Еванђелист Христов Јован. Ово Тумачење рађено је негде у Овчарским манастирима (писано је такорећи на колену, са обичном оловком, ситно и сабијено, у простој свесци са коцкама), да ли са претходним концептом или директно – тешко бисмо могли са сигурношћу сада рећи. Тек, писано је «од сувишка срца», са надахнућем свише («у Духу» Св. Јована Богослова – ср.Откр.1:9–10), а писано је у дане Господње, између Пасхе и Спасовдана. Тачније речено, за свега 17 дана (од среде 4. недеље по Ускрсу до Спасовдана, на који је те године падао и Св. Јустин Мученик и Философ) завршено је тумачење све Три Пославнице Светог Јована. Пре тога пак, око самог Ускрса исте године, Ава Јустин је протумачио укратко и Еванђеље истог Светог Еванђелиста (завршивши пре тога Тумачење Матејевог Еванђеља, које смо штампали 1979 г.). Затим, по завршетку тумачења Треће Посланице Св. Јована, прешао је даље на тумачење Посланица Св. Апостола Павла (Ефесцима, па Филибљанима, итд.).
        cn: 此《圣使徒约翰神学家书信注释》，于备受尊崇的尤斯廷教父蒙福安息（+ 圣母领报节，1979-82年）三周年之际出版。这部作品是这位不知疲倦的基督报喜者，在近40年前写下的，其时的境况，与基督的圣福音传道者圣约翰书写其圣卷时的境况，有几分相似。此注释是在奥夫查尔修道院的某个地方完成的（可以说是就地伏案，用普通铅笔，密密麻麻地写在一本简单的方格笔记本上），至于它是否有预先构思的草稿，抑或是直接写成，如今我们已很难确切断言。只是，它乃是「发自内心丰盛之处」所写，带着来自天上的灵感（「在灵里」——出自圣约翰神学家，参启示录 1:9-10），并且是在主的日子里，在逾越节和升天节之间写成的。更确切地说，仅用了17天（从复活节后第四周的周三，直到升天节——那一年，升天节也恰逢圣尤斯廷殉道者和哲学家纪念日），就完成了圣约翰所有三封书信的注释。然而在此之前，就在同一年复活节前后，阿瓦·尤斯廷还简要注释了同一位圣福音传道者的福音书（在此之前，他已完成了马太福音的注释，此注释于1979年出版）。随后，在完成圣约翰第三封书信的注释之后，他接着开始注释圣使徒保罗的书信（以弗所书，然后是腓立比书等）。
    - type: paragraph
      text:
        ru: На већину од својих ранијих тумачења Еванђеља и Посланица Отац Јустин се касније поново враћао и проширивао их. На тумачење пак Посланица Св. Јована Богослова није се више враћао нити допуњавао, као обично, светоотачким тумачењима (рукопис је само прекуцан машиницом у манастиру Ћелијама пред Ускрс 1958 г., без икаквих измена или допуна). А није се на ово тумачење враћао, сигурно, не зато што није имао љубави према Светом Апостолу Љубави. Напротив, управо радећи на опширнијем тумачењу његовог Светог Еванђеља нови српски Благовесник се и пре-ставио (израз μετα-στασις је из службе Апостолу Јовану, 26. септембра) и преселио у бољи свет, ка омиљеном «Ученику кога Исус љубљаше», то јест ка заједничком им Љубљеноме и Љубећем – Једином Човекољупцу Христу.
        cn: 对于他早年对福音书和使徒书信的大部分诠释，尤斯廷教父（Отац Јустин）后来都重新审阅并加以扩充。然而，对于圣约翰神学家（Св. Јована Богослова）的使徒书信的诠释，他没有再回去修订，也没有像往常一样用教父的诠释进行补充（该手稿仅于1958年复活节前在采利耶修道院（манастиру Ћелијама）用打字机打出，没有任何改动或补充）。而他没有回到这个诠释进行修订，当然不是因为他对圣爱使徒（Светом Апостолу Љубави）没有爱。相反，正是当这位新的塞尔维亚福音使者（нови српски Благовесник）在撰写他（指圣约翰）圣福音书的更详尽诠释时，他被「移置」（μετα-στασις 一词出自9月26日使徒约翰纪念日敬拜）并迁往更美好的世界，前往那位蒙爱的「耶稣所爱的门徒」那里，也就是说，前往他们共同的被爱者与施爱者——独一的爱世人者基督（Једином Човекољупцу Христу）那里。
    - type: paragraph
      text:
        ru: Биће пре да Ава Јустин није ништа мењао од свог првог тумачења Посланица Светог Воанергеса зато што је, можда, хтео да остане неизмењено оно прво надахнуће, као сведочанство апокалиптичких збивања и догађаја, проживљених и преживљених заједно са народом својим, са Црквом Божјом (у Ефесу ли? у Смирни ли? у Пергаму ли?). Какво је било, и до данас остало, то надахнуће, читалац ће и сам видети.
        cn: 更可能的是，阿瓦·尤斯丁未曾更改他首次对圣沃阿涅尔格斯书信的阐释，或许是因为他想让那最初的灵感保持原样，作为他与他的人民、与上帝的教会（无论是在以弗所？在士每拿？还是在别迦摩？）一同经历并幸存下来的启示性事态与事件的见证。那种灵感，它曾经是怎样的，并且至今依然是怎样的，读者自会明了。
    - type: paragraph
      text:
        ru: 'Примера ради, навешћемо само један одломак: «Свети Богослов благовести: «Љубљени, да љубимо један другога; јер је љубав од Бога, и сваки који има љубав од Бога је рођен, и познаје Бога. А који нема љубави, не позна Бога, јер је Бог љубав» (1Ин.4:8). – Љубав је божанска морална сила која нас рађа од Бога, усињује Богу, обожује, чини Божјима. Бог је љубав, зато је љубав боготворна морална сила, обожујућа сила. Прожме ли човеково биће, љубав га прожме божанским силама које човека препорађају, преображавају у ново биће, у нову душу, у ново срце, у нов разум, у нов живот. У њега су онда и све мисли од Бога, и сва осећања, и сва дела. И он зна Бога на један нови начин: најстварније и најубедљивије. Само то стварно, органско јединство са Богом, које се постиже рађањем од Бога љубављу, даје истинско познање о Богу. Не роди ли се човек љубављу од Бога, он и не може познати Бога. Не познаје ли пак човек Бога, он Га обично и не признаје. Пошто је Бог љубав, то нас љубав веже и духовно приближава, сједињује са свима Божјим створењима, најпре са људима. Који љуби браћу, има Бога, зна Бога, јер је рођен од Бога. Који не љуби браћу, нема Бога, не зна Бога, не види божанска, боголика бића у људима, јер није рођен од Бога … Љубав низводи Бога у душу, те човек живи Њиме, и на тај начин види Бога, који је иначе невидљив. Бог је љубављу постао видљиви човек, оваплотио се, очовечио се. Тако и човек: љубављу се обожује, обоготворава, постаје бог по благодати. Невидљиви Бог постаје љубављу оваплотљив, видљив. Јер је божанска љубав оваплотитељска сила: она љубећег преноси у љубљеног … Тако живе сви чланови Цркве Богочовека Христа. То је оно што је речено у Делима Апостолским: «А у народа који верова (тј. у првој Цркви) беше једно срце и једна душа; и све им беше заједничко" (Деян.4:32).'
        cn: '举例来说，我们仅引用其中一段话：


          「圣神学家约翰宣扬道：『亲爱的，让我们彼此相爱；因为爱是从上帝而来的，凡有爱的，都是由上帝而生，并且认识上帝。没有爱的，就不认识上帝，因为上帝就是爱。』 (约翰一书 4:8)


          爱是一种神圣的道德力量，它使我们由上帝而生，被上帝收养，使我们成神，使我们成为属上帝的。上帝就是爱，因此爱是成神的道德力量，是使人成神的力量。如果爱渗透了人的生命实体，爱就会以神圣的力量充满他，这些力量使人重生，将他蜕变为新的生命实体，新的灵魂，新的心，新的心智，以及新的生命。那时，他所有的思想、所有的感受、所有的行为都来自上帝。他以一种全新的方式认识上帝：最真实、最确凿无疑的方式。唯有这种真实的、有机的与上帝合一，这种合一是通过爱由上帝而生所达成的，它才给予对上帝的真正认识。如果人不是因爱由上帝而生，他就无法认识上帝。如果人确实不认识上帝，他通常也不会承认上帝。


          既然上帝就是爱，那么爱将我们维系在一起，使我们属灵上亲近，并使我们与上帝所有的受造物结合，首先是与人结合。爱弟兄的人，拥有上帝，认识上帝，因为他是由上帝而生。不爱弟兄的人，就没有上帝，不认识上帝，在人里面看不到神圣的、肖似上帝的生命实体，因为他不是由上帝而生……


          爱将上帝带入灵魂，使人靠祂而活，并以此方式看到上帝，而上帝本来是不可见的。上帝借着爱成为可见的人，祂道成肉身，祂成为人。人也是如此：借着爱而受成神化，受成神，因恩典而成为神。不可见的上帝借着爱而变得可道成肉身，变得可见。因为神圣的爱是使人道成肉身的力量：它将爱者转移到被爱者之中……


          所有神人基督教会的成员都是这样生活的。这正是使徒行传中所说的：『在那些信的人中间（即在初期教会中），他们都是一心一意的；一切所有的都是大家公用。』 (使徒行传 4:32)」'
    - type: paragraph
      text:
        ru: 'Своје тумачење на II Пославницу Св. Јована завршава Отац Јустин речима посвећеним самом Апостолу и Еванђелисту, »највећем Громовнику новозаветне Истине и новозаветне Љубави": "Од сусрета са њим, са тако необичним Апостолом Христовим, мора да се по душама људским рађала и у све бескрајности разливала нека изузетна радост и изузетно усхићење«. Верујемо и заједничком љубављу осећамо да је такав био и небески сусрет блаженог Оца Јустина, ретког Христољупца и Богољупца у нашем роду и нашем веку, са Првоврховним Апостолом богочовечанске Љубави, у Христу Богочовеку – Богу Љубави и Једином Човекољупцу. И још, верујемо и надамо се да ће понешто од тог сусрета доживети и љубављу руковођени читаоци ових светих Писама и овог надахнутог тумачења.'
        cn: 尤斯丁神父以他献给这位使徒和福音传道者——「新约真理与新约之爱的至大雷鸣者」——的话语，结束了他对圣约翰第二书信的注释：「从与他——这位如此不凡的基督使徒——的相遇中，一种非凡的喜乐与极度的狂喜必在人们的灵魂中诞生，并倾泻流淌至无尽之处。」我们相信，并以共同的爱感受到，蒙福的尤斯丁神父——我们民族和时代中罕见的基督挚爱者与上帝挚爱者——与那神人相之爱的首要使徒，在神人基督——即爱之神和独一的爱世人者中——的属天相遇，也正是如此。再者，我们相信并希望，由爱引导的这些圣经书卷和这份受启示的注释的读者，也能体验到那次相遇的一些体验。
    - type: paragraph
      text:
        ru: Издавач и уредници
        cn: 出版者与编辑们
