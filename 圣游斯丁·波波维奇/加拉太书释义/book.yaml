    - type: paragraph
      text:
        ru: 'Гал.3:1–29:1О неразуни Галати! ко вас је опчинио да се не покоравате истини, вас којима је Исус Христос пред очима насликан, разапет међу вама? 2 Ово једно хоћу од вас да знам: да ли примисте Духа кроз дела закона или кроз чујење вере? 3 Тако ли сте неразумни? Почевши Духом, сад телом завршујете? 4 Зар узалуд толико пострадасте – ἐπάθετε? И кад би било само узалуд! 5 Онај дакле који вам даје Духа и чини чудеса међу вама, чини ли то делима закона или чујењем вере? 6 Као што Авраам верова Богу, и прими му се у праведност (ἐλογίσθη αὐτῷ εἰς δικαιοσύνην = и урачуна му се у праведност), познајте тако и ви да су синови Авраамови они који су од вере. 8 А Писмо, предвиђајући да ће Бог вером оправдати незнабошце, унапред објави Аврааму: «У теби ће се благословити сви народи». 9 Тако се они који су од вере благосиљају с верним Авраамом. 10 Јер који су год од дела закона, под клетвом су, јер је писано: «Проклет сваки који не остане у свему што је написано у књизи закона да то чини». 11 А да се законом нико не оправдава пред Богом, јасно је, јер «праведник ће од вере живети». 12 А закон није од вере, него «човек који то твори живеће у томе». 13 Христос нас искупи од клетве законске, поставши за нас клетва, (јер је писано: «Проклет сваки који виси на дрвету»), 14 да на незнабошце дође благослов Авраамов кроз Исуса, да обећање Духа примимо кроз веру.'
        cn: '（加拉太书 3:1）

          唉，无知的加拉太人哪！谁迷惑了你们，叫你们不顺从真理呢？你们的眼前，耶稣基督钉十字架的景象已经活生生地描绘出来，在你们中间。(加拉太书 3:1)

          我只要知道这一件事：你们领受圣灵，是因行律法呢，还是因听信福音呢？(加拉太书 3:2)

          你们是这样地无知吗？你们既以圣灵开始，如今反倒要凭肉身成全吗？(加拉太书 3:3)

          难道你们所受的许多苦都是徒然的吗？但愿那仅仅是徒然的呢！(加拉太书 3:4)

          那么，那赐给你们圣灵，又在你们中间施行神迹的，是因行律法呢，还是因听信福音呢？(加拉太书 3:5)

          正如亚伯拉罕信了上帝，这就算为他的义（ἐλογίσθη αὐτῷ εἰς δικαιοσύνην = 这就算为他的义），你们也当知道，那因信而得的人，才是亚伯拉罕的子孙。(加拉太书 3:6)

          圣经预先看见上帝要凭着信心称外邦人为义，就预先传福音给亚伯拉罕，说：「万国都必因你得福。」(加拉太书 3:8)

          可见那因信而得的人，就和有信心的亚伯拉罕一同得福。(加拉太书 3:9)

          因为凡是靠行律法的人，都在咒诅之下；因为经上记着说：「凡不常照律法书上所写的一切去行的人，都是受咒诅的。」(加拉太书 3:10)

          显然，没有人能在上帝面前凭律法称义，因为「义人必因信得生。」(加拉太书 3:11)

          律法不是基于信心，而是说：「行这些事的人，就必因此活着。」(加拉太书 3:12)

          基督已经把我们从律法的咒诅中赎出来，为我们成了咒诅；（因为经上记着说：「凡挂在木头上的，都是受咒诅的。」）(加拉太书 3:13)

          为要使亚伯拉罕的福藉着耶稣基督临到外邦人，叫我们因信得着所应许的圣灵。(加拉太书 3:14)'
    - type: paragraph
      text:
        ru: '15 Браћо, по човеку говорим: ни човечјега потврђена завета нико не одбацује нити му што домеће. 16 А Аврааму и семену његову речена бише обећања. Не вели: «и семенима», као за многа, него као за једно: «и семену твоме», које је Христос. 17 Ово пак велим: завета, који је од Бога раније потврђен за Христа, не уништава закон који је постао после четири стотине и тридесет година, да укине обећање. 18 Јер ако је наследство од закона, онда већ није од обећања; а Бог обећањем дарова то Аврааму. 19 Шта ће онда закон? Ради преступа додаде се, док не дође семе коме је обећање дато, и поставили су га анђели руком посредника. 20 Но посредник није једнога, а Бог је један.'
        cn: 15 弟兄们，我是照人的规矩说：人所确认的盟约，无人能废弃或添改。16 应许是向亚伯拉罕和他的后裔说的。并非说「众后裔」，好像指许多人；而是指一个人：「你的后裔」，这后裔就是基督。17 我是这样说：那先前蒙神为基督确认的盟约，不能被四百三十年以后才颁布的律法所废除，以致废掉应许。18 因为如果产业是从律法来的，那就不是从应许来的了；然而，神是藉着应许将它赐给亚伯拉罕的。19 那么，律法是为什么呢？是为了过犯而加添的，直到那蒙应许的后裔来到；并且律法是由天使藉着一位中保的手设立的。20 然而，中保并非只为一方，但神只有一位。
    - type: paragraph
      text:
        ru: '21 Је ли онда закон противан обећањима Божјим? Боже сачувај! Јер да је дат закон који може живот дати (ζῳοποιῆσαι = животворити), заиста би од закона била праведност. 22 Али Писмо затвори све под грех, да би се обећање дало кроз веру Исуса Христа онима који верују. 23 А пре доласка вере ми бесмо чувани под законом, затворени за веру која се имала показати . 24 Тако нам закон би вас питач ка Христу (παιδαγωγὸς εἰς Χριστόν = водитељ, руководитељ ка Христу), да се вером оправдамо. 25 А пошто дође вера, нисмо више под васпитачем. 26 Јер сте ви сви синови Божји вером у Христа Исуса: 27 јер који се год у Христа крстисте, у Христа се обукосте. 28 Нема више Јеврејина ни Грка; нема више роба ни слободњака; нема више мушкога рода ни женскога: јер сте сви ви једно у Христу Исусу. 29 А кад сте ви Христови, онда сте семе Авраамово и наследници по обећању.'
        cn: 21 那么律法是与神的应许相悖吗？绝不是！因为如果赐下了一个能赐生命的律法（ζῳοποιῆσαι = 使人活过来），那么公义就真是从律法而得了。22 但圣经把万物都圈在罪里，为要使应许藉着耶稣基督的信，赐给那些相信的人。23 但在信来到之前，我们被看管在律法之下，被封闭起来，直到那将要显明的信。24 这样，律法就成了我们的训蒙师傅（παιδαγωγὸς εἰς Χριστόν = 引导者，引领者到基督那里），引我们到基督那里，为要使我们因信称义。25 但信既然来到，我们就不再在训蒙师傅之下了。26 因为你们藉着信基督耶稣，都是神的儿子。27 因为凡是受洗归入基督的，都披戴了基督。28 不再分犹太人或希腊人；不再分奴隶或自由人；不再分男性或女性：因为你们在基督耶稣里都成为一了。29 既然你们属基督，那么你们就是亚伯拉罕的后裔，并且是照着应许承受产业的人。
