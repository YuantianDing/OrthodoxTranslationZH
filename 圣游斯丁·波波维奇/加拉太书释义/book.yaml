    - type: paragraph
      text:
        ru: 'Видите колико вам написах руком својом! Зашто? Зато што је у питању ваше спасење; а тиме – ваша душа, ваш вечни живот. А ваше спасење и ваш вечни живот и ваша душа зависе од праве вере у Јединог Спаситеља рода људског под небом: Господа и Бога Исуса Христа. Све што одваја, одводи, одвлачи од те праве вере – одваја вас од спасења и гура у пропаст, у погибао. И још више: гура вас у сами пакао, у само наручје душеубице ђавола и његових црних анђела. Зато је за вас најважније: знати и држати праву веру у Господа Христа. А знаћете је и држаћете је једино ако угађате само Њему кроз свети живот у светим тајнама и светим врлинама, а не ако угађате људима.'
        cn: 你们看我亲手写了这么多给你们！为什么？因为这关系到你们的救恩；而因此——也关系到你们的灵魂、你们的永生。而你们的救恩、你们的永生、你们的灵魂，都取决于对天下人类独一救主——主、神耶稣基督的真信。凡是使你们偏离、引离、拉离那真信的一切，都会使你们与救恩分离，并把你们推入沉沦、推入灭亡。更有甚者：它把你们推入地狱本身，推入那残害灵魂的魔鬼及其黑暗天使的怀抱。所以对你们来说，最重要的是：认识并持守对主基督的真信。你们唯有通过圣事和圣洁德行中的圣洁生活来取悦祂，而非取悦于人，才能认识并持守它。
    - type: paragraph
      text:
        ru: '6:12'
        cn: '6:12'
    - type: paragraph
      text:
        ru: 'Ваша вера је у опасности од људи који хоће да се хвале по телу. Такви човекоугодници нагоне вас да се обрезујете: да спасење сведете на један чисто спољашњи акт и поступак. А спасење није нешто што сам ја измислио, или ви, или ма ко од људи, већ оно што је Спаситељ одредио: спасење је свеобухватни благодатни подвиг доживљавања Спаситеља у васцелој пуноћи Његове Богочовечанске Личности и живота и смрти и васкрсења и вазнесења. Подвиг огроман, свеобухватан, богочовечански, у коме учествује Господ Христос са свима Својим божанским силама и човек са свима својим човечанским силама: сав Бог и сав човек. Зато је и Спаситељ рода људског Богочовек. А лажни учитељи своде спасење на обрезање! Каква лакомисленост! какво плиткоумље! какво безумље! најувредљивије безумље! Спасење је неисказано тајанствен и чудесан подвиг: величанствен и страшан. То је непрекидно сараспињање себе Спаситељу, и саваскрсавање с Њим. А они хоће да обиђу и избегну крст Спаситељев. Међутим, у безмерном човекољубљу Свом Спаситељ је добровољно распео себе на крсту, да би нас спасао, и спасење у крст ставио, и крстом условио. А човекоугодницима и обрезањепоклоницима се неће да буду гоњени за крст Христов. Но спасења нема без крста, и хришћанства нема. Христос и крст, то је све и сва у свима човечанским световима. Без крста нема спасења, као ни хришћанства без Христа Богочовека.'
        cn: 您的信仰正处于危险之中，来自那些想在肉体上夸耀自己的人。这些讨人喜悦者强迫你们行割礼：将救恩简化为一个纯粹外在的行为和举动。然而，救恩并非是我、是你们，或任何世人所发明，而是救主所预定的：救恩乃是全面性的、恩典的属灵功修，即在祂神人二性位格、以及祂的生、死、复活和升天的全然丰满中经历救主。这是一项巨大的、全面的、神人二性的功修，在其中，主基督以祂所有的神圣力量参与，而人也以他所有的人类力量参与：全然是神，全然是人。因此，人类的救主是神人。但假教师却将救恩简化为割礼！这是何等的轻率！何等的肤浅！何等的愚妄！最是侮辱性的愚妄！救恩是难以言喻、奥秘且奇妙的功修：宏伟且可畏。它乃是与救主不停地同钉十字架，并与祂一同复活。而他们却想绕过并避免救主的十字架。然而，在祂无限的爱人如己中，救主甘愿将自己钉在十字架上，为了拯救我们，并将救恩置于十字架之中，也以十字架为条件。而讨人喜悦者和割礼崇拜者，却不愿为基督的十字架受迫害。然而，没有十字架就没有救恩，也就没有基督教。基督与十字架，是所有人类世界的一切核心。没有十字架就没有救恩，正如没有神人基督就没有基督教一样。
