    - type: paragraph
      text:
        ru: 'Ми хришћани не припадамо себи ни у овоме ни у ономе свету, нисмо своји већ Христови (ср.1Кор.6:19, 4:7, 3:23;Рим.14:7–9). То сте осетили и ви сви: нисте своји већ Христови. Живот ваш, није ли Христов? и душа ваша, а савест ваша, и истина ваша, и бесмртност ваша, и вечност ваша, и љубав ваша, и правда ваша, и ум ваш, и добро ваше, нису ли Христови? А када сте Христови, онда сте семе Авраамово и наследници по обећању. Поставши Христови вером у Христа, вером у испуњено обећање, дато Богом Аврааму, онда сте и деца Авраамова, духовна деца његова, јер: нису сви деца Авраамова који су семе Авраамово (Рим.9:7), који су телесни потомци Авраамови. Духовна деца Авраамова су они који верују у обећање Авраамово – у Месију Христа, као што је Авраам веровао, и прими му се у правду. Вером у Христа сви постају синови Божји, и самим тим наследници по обећању: наследници са Христом и у Христу; вером Христовом наслеђују сва вечна блага, која оваплоћени Бог доноси Собом и даје за веру у Њега. Какво богатство! Вером у Христа ми постајемо наследници Божји: «наследник си Божји кроз Исуса Христа» (Гал.4:7), наследник свих богатстава Божјих: Вечна Истина Божја припада теби као сину Божјем и наследнику Божјем кроз Христа; исто тако припада теби и Вечни Живот Божји, и Вечна Правда Божја, и Вечна Љубав Божја, и све, све, све што је Божје у свима световима. И то све постајемо по обећању датом Аврааму, а не по Закону Мојсијевом: јер ми то постајемо вером у остварено обећање, дато Аврааму, у лицу Господа Христа: и ми Јевреји, и ви јелини, незнабошци. Неисказано је богатство Христово: незнабошци кроз Еванђеље постају сутелесници и сунаследници и заједничари тог богатства у Христу (ср.Еф.3:8:7). Зато у Христу нема разлике између вас хришћана из незнабожаца и хришћана из Јевреја: вера у Христа благодаћу Божјом вас изједначује и уједињује у Вечној Истини и Вечној Правди и Вечној Љубави и Вечном Животу, и сви ми свим бићем осећамо да смо једно у Христу Исусу Господу нашем, који је вечна радост наша у свима животима нашим.'
        cn: 我们基督徒不属于自己，无论是在今世还是在来世，我们不属于自己，而是属于基督（参阅 哥林多前书 6:19，4:7，3:23，罗马书 14:7-9）。你们所有人都感受到了这一点：你们不属于自己，而是属于基督。你们的生命，难道不属于基督吗？你们的灵魂、你们的良心、你们的真理、你们的不朽、你们的永恒、你们的爱、你们的公义、你们的心智、你们的良善，难道不都属于基督吗？既然你们属于基督，那么你们就是亚伯拉罕的后裔，并是按着应许承受产业的。借着对基督的信仰，借着对上帝赐予亚伯拉罕的、已实现的应许的信仰而属于基督，那么你们也是亚伯拉罕的儿女，是他的属灵儿女。因为：不是所有亚伯拉罕的后裔，即肉身的子孙，都是亚伯拉罕的儿女（罗马书 9:7）。亚伯拉罕的属灵儿女是那些相信亚伯拉罕的应许——即弥赛亚基督的人，正如亚伯拉罕所相信的，这就算为他的义了。借着对基督的信仰，所有人都成为上帝的儿女，因此也成为按着应许承受产业的：是与基督一同、并在基督里承受产业的；借着基督的信仰，他们承受所有的永恒福益，这些福益是道成肉身的上帝亲自带来并赐予那些相信祂的人的。何等丰盛的财富！借着对基督的信仰，我们成为上帝的继承人：「你是上帝的后嗣，借着耶稣基督」（加拉太书 4:7），是上帝所有财富的继承人：上帝永恒的真理属于你，因为你是上帝的儿女，并借着基督是上帝的继承人；同样，上帝永恒的生命、上帝永恒的公义、上帝永恒的爱，以及在诸世界中一切属于上帝的，一切，一切，一切，也都属于你。这一切我们都是按着赐予亚伯拉罕的应许而成为的，而不是按着摩西律法；因为我们是借着对在主基督身上所实现的、赐予亚伯拉罕的应许的信仰而成为的：无论是我们犹太人，还是你们希腊人、外邦人。基督的财富是无法言喻的：外邦人借着福音，在基督里成为这财富的同体、共同继承人，并一同有份（参阅 以弗所书 3:8:7）。因此，在基督里，你们这些从外邦人中来的基督徒与从犹太人中来的基督徒之间没有区别：对基督的信仰，借着上帝的恩典，使你们在永恒的真理、永恒的公义、永恒的爱和永恒的生命中平等并合一，我们所有人都以我们的全心全意感受到，我们在主耶稣基督里是一体的，祂是我们所有生命中永恒的喜乐。
  - type: heading2
    text:
      ru: Четврта глава
      cn: 第四章
    children:
    - type: paragraph
      text:
        ru: 4:1–31
        cn: 4:1–31
    - type: paragraph
      text:
        ru: 'Гал.4:1–31:1Али велим: док је наследник дете ништа се не разликује од роба, иако је господар од свега; 2 него је под стараоцима и управитељима све до рока који је отац одредио. 3 Тако и ми, кад бејасмо млади, бејасмо под стихијама света заробљени; 4 а кад се наврши време, посла Бог Сина свога, који је рођен од жене и рођен под законом, 5 да искупи оне који су под законом, да примимо посинаштво. 6 А пошто сте синови, посла Бог Духа Сина свога у срца ваша, који виче: Ава! Оче! 7 Тако ниси више роб него син; а ако си син, и наследник си Божји кроз Христа.'
        cn: （加拉太书 4:1）我是说，只要继承人是孩童，他与奴仆毫无分别，尽管他是万物的主人；2 他却是在监护人和管家之下，直到他父亲所预定的日期。3 这样，我们也是如此，当我们是孩童的时候，被世上的蒙昧元素所捆绑；4 及至时候满足，神就差遣他的儿子，由女子所生，且生在律法之下，5 为要救赎那些在律法之下的人，使我们得着儿子的名分。6 你们既是儿子，神就差遣他儿子的灵进入你们的心，呼叫：「阿爸！父！」 7 所以你不再是奴仆，而是儿子；既是儿子，就借着基督也是神的后嗣。
    - type: paragraph
      text:
        ru: '8 Али тада, не знајући Бога, служисте боговима који то нису по природи својој. 9 Но сад, познавши Бога, или боље: познати бивши од Бога, како се враћате опет на слабе и убоге стихије, којима опет изнова хоћете да служите? 10 Ви гледате на дане и месеце, на времена и године! 11 Бојим се за вас да се нисам узалуд трудио око вас.'
        cn: '8 然而那时，你们不认识神，服事了那些本质上并非神明的。

          9 但如今，你们既然认识了神，或者更确切地说，已经被神所认识，怎么又再回到那些软弱贫乏的蒙昧之物那里，再次想要服事它们呢？

          10 你们遵守日子、月份、节期、年份！

          11 我为你们害怕，恐怕我为你们所做的劳苦是白费了。'
    - type: paragraph
      text:
        ru: 12 Браћо, молим вас, будите као ја, јер сам и ја као ви. Ништа ми ви не учинисте нажао. 13 А знате да вам у слабости тела први пут проповедах еванђеље. 14 И напасти моје која беше на телу моме ви не презресте, нити попљувасте, него ме примисте као анђела Божјега, као Христа Исуса. 15 Какво бејаше онда ваше блаженство! Јер вам сведочим да бисте, да је то било могуће, извадили очи своје и дали мени. 16 Тиме ли вам постадох непријатељ што вам истину говорим? 17 Они не ревнују добро за вас, него хоће да вас одвоје, да ви ревнујете за њих. 18 А добро је ревновати свагда у добру, и не само кад сам ја код вас. 19 Дечице моја, коју опет у мукама рађам док Христово обличје не постане у вама (ἄχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν = док се Христос не уобличи у вама; док се Христос не образује у вама); 20 хтео бих да сам код вас, и да изменим свој глас, јер сам у недоумици односно вас (ὅτι ἀποροῦμαι ἐν ὑμῖν = јер не знам шта бих с вама).
        cn: 12 弟兄们，我恳求你们，要像我一样，因为我也像你们一样。你们没有丝毫亏负我。13 你们知道，我第一次向你们传福音，是在肉体软弱的时候。14 你们也没有轻看我肉体上的试炼，没有厌弃，反而接待我如同神的使者，如同基督耶稣。15 你们那时何等的喜乐啊！因为我为你们作证，若有可能，你们甚至会把自己的眼睛挖出来给我。16 难道我因为告诉你们真理，就成了你们的仇敌吗？17 他们对你们的热心并非出于善意，而是想离间你们，好让你们热心于他们。18 常常在善事上热心是好的，不只在我与你们同在的时候。19 我的孩子们，我为你们再次经历产难，直到基督的形像在你们里面成形（希腊语：ἄχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν = 直到基督在你们里面成形；直到基督在你们里面形成）；20 我巴不得此刻在你们那里，可以改变我的语气，因为我为你们感到困惑（希腊语：ὅτι ἀποροῦμαι ἐν ὑμῖν = 因为我不知该如何是好；因为我不知该拿你们怎么办）。
    - type: paragraph
      text:
        ru: '21 Кажите ми ви који хоћете да будете под законом, не слушате ли закона? 22 Јер је писано да Авраам имаде два сина, једнога од робиње а другога од слободне. 23 Али онај од робиње, роди се по телу; а онај од слободне, по обећању. 24 То је речено у преносном смислу: јер су те две жене два завета, један од горе Синајске, који рађа за робовање, а то је Агара; 25 јер Агар је гора Синај у Арабији, и она одговара садашњем Јерусалиму који робује са децом својом; 26 а горњи Јерусалим слободан је, и он је мати свима нама. 27 Јер је писано: Развесели се, нероткињо која не рађаш; кликни и повичи ти која не трпиш порођајне муке; јер остављена има много више деце него она која има мужа. 28 А ми смо, браћо, као и Исак, деца обећања. 29 Но као што онда онај који се роди по телу гоњаше онога који се роди по духу, тако и сада. 30 Али шта говори писмо? Отерај робињу и сина њезина, јер син робиње неће наследити са сином слободне. 31 Тако, браћо, нисмо деца робиње него слободне.'
        cn: 21 告诉我，你们这些想要在律法之下的人，难道不听律法吗？22 因为经上记着说，亚伯拉罕有两个儿子，一个是从婢女生的，另一个是从自主之妇生的。23 但那婢女所生的，是按着血气生的；那自主之妇所生的，是凭着应许生的。24 这些事都是寓意的：因为这两个妇人就是两个约，一个是出于西奈山，生子为奴，这便是夏甲；25 因为夏甲就是阿拉伯的西奈山，她和现在的耶路撒冷同类，这耶路撒冷和她的儿女都是为奴的；26 但那在上的耶路撒冷是自主的，她是我们的母亲。27 因为经上记着说：「不生育的妇人，你要欢乐；未曾经过产难的，你要高声欢呼；因为没有丈夫的，儿女比有丈夫的更多。」28 弟兄们，我们是凭着应许作儿女的，如同以撒一样。29 当时，那按着血气生的，怎样逼迫了那按着圣灵生的，现在也是这样。30 然而经上是怎么说的呢？「把婢女和她的儿子赶出去！因为婢女的儿子，绝不能与自主之妇的儿子一同承受产业。」31 所以，弟兄们，我们不是婢女的儿女，而是自主之妇的儿女。
    - type: paragraph
      text:
        ru: 4:1–2
        cn: 4:1–2
    - type: paragraph
      text:
        ru: Својом препородном и преображајном силом благодат Христова изједначује све људе у Христу, даје им богочовечански дух и обличје, и међу њима нема ни роба ни слободњака, ни Јеврејина ни Грка, већ су сви једно у Њему. Али до доласка Господа Христа у свет, и Јевреји под Законом и незнабошци под стихијама света, не разликују се у суштини међу собом, јер су подједнако робови греха. Наследник, све док је непунолетан, не разликује се од роба иако је господар од имовине свога оца, јер не управља њоме, него је под туторством и старатељством старалаца и тутора. Јеврејски народ, иако наследник по обећању, због своје грешности налазио се под старатељством и туторством Закона, јер се показао непунолетан и недорастао да упражњава наследничку власт над имовином Оца Небеског.
        cn: 基督的恩典借着祂使人重生并改造更新的能力，使所有人在基督里都归于平等，赐予他们神人同形同性的精神和形象，在他们中间，没有为奴的，也没有自主的，没有犹太人，也没有希腊人，而是在祂里面，他们都是一体。然而，在主基督降临世界之前，无论是律法之下的犹太人，还是世俗元素之下的外邦人，在本质上彼此并无不同，因为他们同样都是罪的奴仆。继承人，在他未成年期间，与奴仆并无二致，尽管他是他父亲财产的主人，因为他无法管理那财产，而是处于监护人和管家的监护与管理之下。犹太民族，尽管是按应许的继承人，因其罪性而处于律法的管家和监护之下，因为他们表现出未成年且不成熟，无法行使对天父财产的继承权。
    - type: paragraph
      text:
        ru: '4:3'
        cn: '4:3'
    - type: paragraph
      text:
        ru: 'Али исто тако и незнабошци, робови греха, робовали су греху обожавајући место Творца разне стихије овога света: сунце, месец, звезде, људе, животиње, и друга створења и твари. Нарочито их је обожавање људи као богова одвело обожавању људских духовних сила и њихове делатности: обожавању разума, страсти, философије, науке, уметности. То обожавање човека у разним видовима било је ништа друго до робовање разним неистинама и обманама и преварама «по казивању човечјему», «по стихијама света» (Кол.2:8). То духовно детињство, непунолетство, незрелост, држало је у заробљеништву греха и Јевреје и незнабошце: и једни и други подједнако робље греха, смрти и ђавола. Јевреји кроз своје грехе, незнабошци опет кроз своје, детињски су поробљавали себе смрти, а преко ње ђаволу и његовом царству зла. Заробљеници смрти, то су сви људи, били Јевреји или незнабошци, до оваплоћења Бога Логоса. Заробљеници смрти, беспомоћни као нејака деца у нераскидљивим оковима смрти.'
        cn: 然而，异教徒，作为罪的奴仆，也同样奴役于罪，他们崇拜这世上的各种元素——太阳、月亮、星星、人类、动物以及其他的受造物和万物，而非造物主。尤其，他们将人当作神来崇拜，这导致了对人的精神力量及其活动的崇拜：即对理性、情欲、哲学、科学、艺术的崇拜。这种以各种形式崇拜人的行为，无非是奴役于各种虚假、欺骗和诡诈，正如「照着人的遗传」、「照着世上的小学」（歌罗西书 2:8）所说。这种属灵的幼稚、未成年和不成熟，将犹太人和异教徒都囚禁在罪的辖制中：双方都同样是罪、死亡和魔鬼的奴仆。犹太人通过他们的罪，异教徒又通过他们自己的罪，幼稚地奴役自己于死亡，并通过死亡，又奴役于魔鬼和它邪恶的国度。所有人，无论是犹太人还是异教徒，在上帝圣言道成肉身之前，都是死亡的囚犯。死亡的囚犯，他们像无助的婴孩一样无能为力，深陷于死亡不可挣脱的镣铐之中。
    - type: paragraph
      text:
        ru: 4:4–5
        cn: 4:4–5
    - type: paragraph
      text:
        ru: И то све тако док се не наврши време. «А кад се наврши време» господарења греха, смрти и ђавола над родом људским, да се људи не би потпуно огреховили, осмртили, ођаволили, «посла Бог Сина свог» да освети, осмисли време и спасе људе. Јер шта је смисао и циљ времена? Да се освети и преобрази у вечност, да постане увод и уводитељ у вечност. А оно може постати то, ако се испуни Вечним Богом. Једино сједињујући се кроз Богочовека Христа са вечношћу божанском време постиже своје божанско назначење и циљ, јер и само постаје саставни део богочовечанске вечности у Цркви; и у светој тајни Цркве и чудесног богочовечанског домостроја спасења налази своје освећење и преображење (ср.Еф.1:10). Падом својим у грех, жена је прва обесветила време, обесмислила га, унела ђаволску стихију у њега, опоганила га, и оно је постало као неко обиталиште смрти, ђавола и свакога зла. Син Божји, Господ Христос рађа се «од жене», која претставља сав род људски, сву природу људску, да искупи и спасе све људе, као потомке те прве жене, једне и једине родитељке васцелог рода људског, који је «семе женино» (Быт.3:15), «семе Давидово» (Рим.1:3). Он се рађа «под законом», да спасе и оне који су «под законом», Јевреје, изабрани народ Божји, да они не би уобразили да њима није потребно спасење, и да се Спаситељ родио само за незнабошце, неизабране народе Божје. Поред тога, као изабрани народ Божји, Јевреји су одговорнији за царовање греха и смрти у свету него незнабошци, пошто су имали Закон и дарове од Бога које незнабошци имали нису.
        cn: '这一切都如此，直到时候满足。「及至时候满足」，即罪、死亡和魔鬼统治人类的时间满足，为了不让人类完全陷入罪恶、死亡和魔性， 「上帝就差遣祂的儿子」，来圣化时间，赋予时间意义，并拯救人类。因为时间的意义和目标是什么呢？就是要被圣化并转变为永恒，成为进入永恒的序幕和引导者。而它只有被永恒的上帝充满，才能成为如此。唯有通过神人基督与神圣的永恒结合，时间才能实现其神圣的旨意和目标，因为它本身也成为教会中神人永恒的组成部分；并且在教会的神圣奥秘和奇妙的神人救赎经纶中，时间找到了它的圣化和转变（参阅以弗所书 1:10）。


          女人因堕入罪中，首先亵渎了时间，使其失去意义，将魔性势力引入其中，玷污了它，于是时间便成了死亡、魔鬼和一切邪恶的居所。上帝的儿子，主基督「由女子所生」，她代表着全人类、整个人性，为要救赎和拯救所有人，作为那第一个女人的后裔，即整个人类唯一的母亲，也就是「女人的后裔」（创世记 3:15），「大卫的后裔」（罗马书 1:3）。祂「生在律法之下」，为要拯救那些「在律法之下」的人，即犹太人，上帝的选民，以免他们自以为不需要救恩，以为救主只为外邦人，即上帝非选民而生。此外，作为上帝的选民，犹太人比外邦人对罪和死亡在世上的统治负有更大的责任，因为他们拥有外邦人所没有的律法和来自上帝的恩赐。'
    - type: paragraph
      text:
        ru: 'Бог Логос се рађа на наш земаљски свет ради усиновљења људи Богу: «да примимо посинаштво». Јер Бог је и саздао род људски, са крајњим и јединим циљем, да Му људи буду синови (ср.Еф.1:5). Кроз грех и смрт и ођавољење људи су се удаљили од Бога, и толико одродили од Њега да су изгубили своје божанске, боголике одлике и постали «деца ђавола» (1Ин.3:10). Син Божји се рађа као човек, да би људи вером у Њега постали синови Божји (ср.Гал.3:26), и тако постали оно ради чега их је Бог и створио. И они то постају Господом Христом, једино Њиме, зато што је Он, Богочовек, као истинити Бог имао силе да природу људску спасе од греха, смрти и ђавола, и као истинити човек – да то спасење преда људима у светој Цркви Својој, у Богочовечанском телу Свом. Постајући синови Божји вером у Јединородног Сина Божјег, Господа Христа, људи постају Његови сутелесници и заједничари Његове свемоћне благодати (ср.Еф.3:6), којом савлађују сваки грех, сваку смрт, сваког ђавола, и добијају снаге да још овде на земљи живе вечним животом и ради вечнога живота.'
        cn: 圣言上帝降生于我们的尘世，是为了使人被上帝收养为义子：「叫我们得着儿子的名分」。因为上帝创造人类，其最终也是唯一的目标，就是要使人成为祂的儿子（参 以弗所书 1:5）。通过罪、死亡和被魔鬼奴役，人类远离了上帝，并与祂疏远到如此地步，以至于他们失去了神圣的、肖似上帝的特质，并成了「魔鬼的儿女」（约翰一书 3:10）。上帝的圣子降生为人，为了使人通过对祂的信仰而成为上帝的儿子（参 加拉太书 3:26），从而成为上帝创造他们的目的。他们借着主基督而成就此事，唯独借着祂；因为祂，即神人，作为真上帝，拥有大能将人类的本性从罪、死亡和魔鬼中拯救出来，并且作为真人——将这救赎在祂神人的身体，即祂的圣教会中传给人。借着信仰上帝的独生子主基督而成为上帝的儿子，人类成为祂的同体肢和祂全能恩典的有份者（参 以弗所书 3:6），借此恩典，他们战胜了所有的罪、所有的死亡和所有的魔鬼，并获得能力，能够在此世间就活出永恒的生命，并为永恒的生命而活。
    - type: paragraph
      text:
        ru: '4:6'
        cn: '4:6'
    - type: paragraph
      text:
        ru: 'Васцели богочовечански подвиг Господа Христа има један циљ: «да примимо посинаштво». А са посинаштвом Богу, ми као синови Божји, примамо од Бога као од Оца све дарове, сва богатства, сва блага Божја. Па и несравњено више од тога: примамо највише што се може примити у свима световима, и што се може замислити и пожелети: примамо саму Пресвету Тројицу. Јер кроз Христа постајемо потпуно Њени, и Она потпуно наша. Ми – деца Њена, ми – синови Њени! Сва душа наша отворена за сва божанска савршенства, за све божанске тајне, за све божанске свете силе, за сву Божанску Свету Тројицу. Више нисмо затворени под грех, под смрт, под проклетство, да не бисмо могли примити Тросунчаног Бога и Господа у себе, у срце своје. Очишћено вером у Господа Христа, наше срце постаје храм Духа Светога; загрејани љубављу према Господу Христу и Небеском Оцу, ми отварамо синовска срца своја к Богу да се Њиме испуне. И ви, некадањи незнабошци, вером у Јединородног Сина Божјег постајете синови Божји. «А пошто сте синови, посла Бог Духа Сина свога у срца ваша, који виче: Ава! Оче!» Ради Сина Дух Свети се даје свима који вером у Сина кроз крштење постају синови Божји. Својим очовечењем Господ Христос је сву природу људску, која је у основи иста и код Јевреја и код незнабожаца, у начелу обожио, и тиме осветио, и тиме оспособио да постане прималиште и обиталиште Светога Духа. А Дух Свети, уселивши се у срца ваша вером и љубављу и крштењем, и осталим светим тајнама и светим врлинама, разлива по целом бићу вашем осећање, сазнање и убеђење да сте и ви синови Божји, и све се то слива у клик вашега духа, испуњеног Духом Светим: Ава! Оче! Све ваше претставе о Богу, све ваше мисли о Богу, стапају се у радосно, мило, усхићено осећање – свеосећање, мисао – свемисао: да је Бог – наш Отац, а ми – деца Његова, синови Његови. Иза свега и сврх свега остаје једно, свеобухватно осећање и сазнање: Бог је твој Отац, а ти Његов син. Дух Свети који ради Сина Божјег обитава у вама, у вашим срцима, излива у срца ваша божанску љубав и све остале свете врлине и свете силе (ср.Рим.5:5); и ви Духом Светим – духовно мислите (ср.Рим.8:5), а Духом Светим и осећате, и волите, и делате, и живите. Дух човечји без Духа Божјег, шта је? Привиђење, утвара, необјашњива загонетка, језива тајна, неуловљива сенка, усплахирени слепи миш, плен демонa, игралиште страшилa. А са Духом Божјим, Духом Светим, Духом Сина Божјег Јединородног, Господа нашег Исуса Христа, дух човечји шта је? Радост над радостима, усхићење над усхићењима, савршенство над савршенствима: јер га Дух Свети води из савршенства у савршенство, водећи га из једне свете тајне у другу, из једне свете врлине у другу, док га потпуно не обожи, не обогочовечи, не испуни светим и светлим богомислима, богоосећањима, богоблаговестима, богорасположењима, која се непрекидно преображавају из силе у силу, из савршенства у савршенство, и тако кроз овај земаљски живот, а после њега и кроз онај у свима божанским вечностима свију Божјих светова.'
        cn: '救主基督完全的神人功行（*подвиг*）只有一个目标：「使我们得着儿子的名分」。我们既得了神的儿子的名分，作为神的儿子，便从神，如同从父亲那里，领受祂一切的恩赐，一切的财富，一切的福泽。甚至比这更无可比拟的是：我们领受那在诸世界中可领受的、可想象的、可企盼的至高无上之物：我们领受至圣三一本身。因为借着基督，我们完全属乎祂，而祂也完全属乎我们。我们——祂的儿女，我们——祂的众子！我们全副的灵魂向一切神圣的完美、一切神圣的奥秘、一切神圣的圣能、向整个神圣的圣三一敞开。我们不再被罪、死亡、咒诅所禁锢，以致无法将那三光之神和主接纳到我们自身，接到我们的心中。


          借着对主基督的信仰而蒙洁净，我们的心成为圣灵的殿；被对主基督和天父的爱所温暖，我们向神敞开我们为子的心，以便被祂充满。而你们，昔日的外邦人，借着对神独生子的信仰，成为神的儿子。「你们既为儿子，神就差他儿子的灵进入你们的心，呼叫：阿爸！父！」为了圣子，圣灵赐予所有那些借着对圣子的信仰，并借由洗礼成为神儿子的人。


          借着祂的道成肉身，主基督原则上已使全人类的本性——这本性在犹太人和外邦人那里都是一样的——成神，并因此使其圣化，使其有能力成为圣灵的接受之所和居所。而圣灵，借着信仰、爱、洗礼，以及其余的圣事和圣德，居于你们心中，将你们也是神的儿子的感受、认知和确信倾注于你们全副生命之中，这一切都汇聚在你们充满圣灵之灵的呼喊中：阿爸！父！你们一切关于神的观念、一切关于神的思想，都融合成一种喜乐、慈爱、狂喜的感受——一种全然的感受，一种思想——一种全然的思想：即神是我们的父亲，而我们是祂的儿女，祂的众子。在这一切之外和之上，留下一个包罗万象的感受和认知：神是你的父亲，而你，是祂的儿子。


          圣灵为了神的儿子住在你们里面，在你们心中，将神圣的爱以及一切其他的圣德和圣能倾注到你们心里（罗马书 5:5）；而你们借着圣灵——属灵地思想（罗马书 8:5），并且借着圣灵，你们也感受、也爱、也行动、也生活。


          没有神之灵的人之灵，是什么？是幻象，是幽灵，是无法解释的谜团，是令人毛骨悚然的奥秘，是难以捕捉的影子，是惊慌失措的蝙蝠，是魔鬼的猎物，是恶鬼的玩物。而有了神之灵，圣灵，神独生子——我们的主耶稣基督之灵，人之灵又是什么呢？是喜乐中的喜乐，狂喜中的狂喜，完美中的完美：因为圣灵带领它从完美进入完美，引导它从一种圣事进入另一种圣事，从一种圣德进入另一种圣德，直到将它完全成神，将它完全神人化，并以圣洁和光明的神性思想、神性感受、神性佳音、神性性情充满它，这些都不断地从能力转变为能力，从完美转变为完美，如此贯穿此世俗生命，并在其后，在神一切世界的所有神圣永恒中亦复如是。'
    - type: paragraph
      text:
        ru: '4:7'
        cn: '4:7'
    - type: paragraph
      text:
        ru: 'Све је то истина над истинама, и нека то не чуди твоју мајушну мисао људску: јер си постао син Божји. А поставши син Божји, ниси више роб, него си као син Божји и «наследник Божји кроз Христа». Наследник Божји! – има ли ишта веће, и више, и узвишеније, и вредносније, и драгоценије од тога за тебе, човека, некадањег беспомоћног роба греха, смрти и ђавола? Шта је то што би људи могли пожелети као нешто боље и узвишеније и драгоценије од онога што им Господ Христос даје очовечивши се и вером пруживши им васцелог Бога, са свима савршенствима и богатствима? Христом постајеш наследник свега Божјег, – има ли ишта веће од тога, ишта славније, богатије, бесмртније, вечније? Ко ти то други може дати? Нико, јер нико није то што Господ Христос, те нико и нема оно што Он има и што Он даје. Да, то је једини Бог у свима световима који из неисказаног човекољубља као Једини прави Човекољубац даје човеку, роду људском све Своје: сву пуноћу Свога Божанског бића (ср.Кол.2:9–10;Еф.3:19). Без Христа, и до Христа, шта си, и шта си био? роб – не само стихија овога света, него још и горе, још и најгоре: роб страсти, роб грехова, роб зала, роб смрти, роб ђавола. О, човече без Христа, твоје је ропство неисказано и свеужасно; ти си неодробљиво заробљен! Јер ко те од људи могао, и може, ослободити тога ропства: ко од мудраца, ко од учењака, ко од војсковођа, ко од царева, ко од тирана? Нико! нико! нико! Па не само то, него и сви људи скупа, сав род људски, од Адама тја до последњег човека на земљи, када би се решио да тебе једног ослободи од смрти, да ли би могао? Сигурно да не би, јер је смрт јача, неизмерно јача од свих људи свих времена и раса. Један је у роду људском јачи од ње, само један: Богочовек, Господ Исус Христос. А са Њим и у Њему и кроз Њега сви они који верују у Њега, и вером у Њега постају наследници свих Његових божанских моћи и сила, па и Његове божанске моћи над смрћу: победа над смрћу, над грехом, над ђаволом. Можеш и ти, и са тобом сви хришћани скупа, потрошити све душе своје да бисте мишљу прозрели и сагледали и обухватили она божанска богатства и блага која Господ Христос даје људима и има за њих и у овом и у оном свету, па ипак нећете моћи ни издалека наслутити њихов сјај и неизмерност и сладост и радост (ср.1Кор.2:9). Какво величанство постаје човек са Христом! божанско величанство! божански престолонаследник! Гле, Господ Христос – истинити човек, са истинитим човечанским телом, вазнесен на небо, седи вечито с десне стране Богу Оцу на престолу свебожанске славе! А Он је савазнео, и непрестано савазноси са Собом и држи крај Себе све оне који верују у Њега: «изабрани род, свети народ, народ добитка, народ Божји» (1Пет.2:9–10).'
        cn: 这都是真理中的真理，愿这不使你渺小的人类思想感到惊奇：因为你已成为上帝的儿子。既已成为上帝的儿子，你就不再是奴隶，而是作为上帝的儿子，且是「借着基督成为上帝的后嗣」。上帝的后嗣！对你这个曾经无助地沦为罪恶、死亡和魔鬼奴隶的人来说，还有什么比这更伟大、更崇高、更尊贵、更有价值、更宝贵的事物呢？人们还能奢望什么比基督主道成肉身，并借着信仰将整全的上帝，连同祂的一切完美和丰盛，赐予他们，所得到的更好、更崇高、更宝贵的事物呢？借着基督，你成为上帝一切的后嗣——还有什么比这更伟大、更荣耀、更丰盛、更不朽、更永恒的呢？还有谁能将这些赐给你呢？没有人，因为没有人是基督主那样的，也没有人拥有祂所拥有的，并能赐予祂所赐予的。是的，祂是万有中唯一的上帝，祂出于不可言喻的仁爱，作为唯一真正的爱人者，将祂的一切——祂神性本体的全部丰盛——赐予人类，赐予世人（参阅歌罗西书 2:9-10，以弗所书 3:19）。没有基督，在基督降临之前，你是什么，你曾是什么？奴隶——不仅是这世上元素的奴隶，而且更糟，甚至是最糟的：情欲的奴隶，罪恶的奴隶，邪恶的奴隶，死亡的奴隶，魔鬼的奴隶。哦，没有基督的人啊，你的奴役是无法言喻且极其可怕的；你被不可救药地囚禁了！因为在人当中，谁能，现在又能，将你从那种奴役中解救出来呢？是智者？是学者？是将军？是君王？是暴君？没有人！没有人！没有人！不仅如此，即使所有的人，全人类，从亚当直到地上最后一个人，如果他们决定要将你一人从死亡中解救出来，他们能做到吗？肯定不能，因为死亡远比所有时代、所有种族的人都要强大，强大到无可估量。在人类当中，只有一位比它更强大，只有一位：那就是神人，主耶稣基督。而与祂同在，在祂里面，并借着祂，所有相信祂的人，借着对祂的信仰，成为祂一切神圣权能和力量的后嗣，甚至包括祂超越死亡的神圣权能：战胜死亡，战胜罪恶，战胜魔鬼。你，以及所有基督徒与你一同，可以耗尽你们所有的心神，用思想去洞察、领悟并包罗基督主赐予人们，并为他们预备在今世和来世的那些神圣的财富和宝藏，然而你们仍无法遥远地预感到它们的光辉、浩瀚、甘甜和喜悦（参阅哥林多前书 2:9）。一个人与基督同在，将变得何等荣耀！神圣的荣耀！神圣的王位继承人！看哪，基督主——真实的人，拥有真实的人类身体，升入天堂，永远坐在上帝父的右边，在祂充满神性荣耀的宝座上！而祂已一同升天，并不断地将所有相信祂的人一同升天并持守在自己身边：「蒙拣选的族类，圣洁的国民，上帝的产业，上帝的子民」（彼得前书 2:9-10）。
    - type: paragraph
      text:
        ru: То је вера наша, то је визија наша, то је бесмртна стварност наша, то је вечни живот наш. «Јер је наше живљење на небесима» (Флп.3:20). Зато «тражите оно што је горе где Христос седи с десне стране Бога. Мислите о ономе што је горе а не што је на земљи» (Кол.3:1–2). Ви «умресте с Христом стихијама света»; иако живите у телу на земљи – «ваш је живот сакривен с Христом у Богу» на небесима (ср.Кол.2:20, 3:4). Да, то је вечни живот наш, који почиње још овде на земљи, обавезно овде на земљи. Ето, ради тога је чудесни Господ и дошао међу нас, и постао као један од нас, да нас Собом и у Себи узнесе изнад свих смрти и светова! о, и изнад свих небеса, изнад свих Херувима и Серафима, на вечни престо вечне славе Тросунчаног Божанства! То је једино истинско човекољубље! – и нема другог! То је Једини Човекољубац – и нема другог! Свако друго човекољубље, није ли самозванство, неистина, лаж? И авај – људождерство! Јер се човекољубљем не може назвати ништа што оставља човека робом смрти. Нити се човекољупцем може назвати ико који човека оставља робом смрти.
        cn: 这是我们的信仰，这是我们的异象，这是我们的不朽实相，这是我们的永恒生命。「因为我们的家乡在天上」（腓立比书 3:20）。因此，「要寻求上面的事，就是基督坐在上帝右边的地方。你们要思念上面的事，不要思念地上的事」（歌罗西书 3:1-2）。你们「与基督一同向着世上的小学死了」；尽管你们活在地上——「你们的生命与基督一同藏在上帝里面」在天上（参阅 歌罗西书 2:20，3:4）。是的，这是我们的永恒生命，它甚至在这里，就在地上开始，是必定要在这里，就在地上开始的。看哪，正是为此，奇妙的上帝降临在我们中间，并成为我们中的一员，好通过祂自己并在祂里面将我们提升到一切死亡和诸世界之上！哦，甚至超越一切诸天，超越一切基路伯和撒拉弗，登上三日神性永恒荣耀的永恒宝座！这才是唯一真正对人类的爱！——别无其他！这才是唯一爱人类的那一位！——别无其他！任何其他对人类的爱，难道不是僭越、不真、谎言吗？唉——食人主义！因为凡是让人沦为死亡奴隶的，都不能被称为对人类的爱。也没有人，若让人沦为死亡奴隶，能被称为爱人类者。
    - type: paragraph
      text:
        ru: 'Док човек вером у Богочовека Христа не постане син Божји, он занавек остаје роб смрти, роб греха, роб ђавола, па макар био не знам какав философ, или војсковођа, или научник, или мудрац, или геније, или све то скупа заједно. Јер све то без Христа само је мука на муку, оков на оков, тамница на тамницу, ропство на ропство, терет на терет, ужас на ужас, варка на варку, страхота на страхоту, смрт на смрт, пакао на пакао. Проклети били! јер ме чине, посредно и непосредно, многоструким робом смрти, смрти, смрти – смрдљиве, страшне, наказне, језиве, одвратне, свепагубне, свељудождерске, сверазорне! А бити такав робчовек – зар је у томе икакво задовољство, и радост, и утеха? Па то је проклетство над проклетствима, језива поворка црних проклетстава. Да, проклетство је над проклетствима бити човек а не веровати у Христа. О! убијте у мени по стопут, по хиљадопут свако самосазнање и самоосећање, само ме не одвајајте од чудесног Господа Христа! Ни под којим условом нећу да сам човек без Њега, нећу да сам биће које има свести и самосвести, осећање и самоосећање, јер све то без Њега – пакао је, пакао је, и само пакао! Самоосећање човеково, самосазнање – чист је пакао без Христа, и проклетство. Тек у Христу, и са Њим, оно се постепено ослобађа своје проклете паклености, и благодаћу Његовом преображава у рај, по коме бујно ниче и расте и успева неувенљиво и миомирисно цвеће бесмртности: божанске мисли, божанска осећања, божанске жеље, божанска расположења, божанска дела. Испуњујући Христом Богом душу своју кроз веру у Њега и љубав к Њему, човек постепено претвара биће своје у рајско биће; и онда је радост над радостима и блаженство над блаженствима бити човек. Јер бити Христов човек уствари и значи бити истински човек.'
        cn: 除非人藉着对神人基督的信仰成为神的儿子，否则他将永远是死亡的奴隶、罪恶的奴隶、魔鬼的奴隶，即便他是一位多么了不起的哲学家、军事统帅、科学家、智者、天才，或是所有这些身份的集合。因为所有这一切，若没有基督，就只是苦上加苦，轭上加轭，牢狱上加牢狱，奴役上加奴役，重担上加重担，恐怖上加恐怖，虚妄上加虚妄，惊骇上加惊骇，死亡上加死亡，地狱上加地狱。愿他们受咒诅！因为他们或直接或间接地，使我成为多重死亡的奴隶，死亡，死亡——那恶臭的、可怖的、丑陋的、阴森的、可憎的、尽毁一切的、吞噬万人的、遍地摧残的死亡！而成为这样一个奴隶般的人——其中又有何满足、喜乐和安慰可言呢？这简直是咒诅中的咒诅，一道阴森可怖的黑色咒诅长列。是的，生而为人却不信基督，这真是咒诅中的咒诅。哦！即便将我百次、千次地杀死，将我的一切自我认知和自我感受尽皆消灭，但求不要将我与奇妙的、主基督分隔开！我绝不愿在没有祂的情况下做人，绝不愿成为一个拥有意识和自我意识、情感和自我感受的生灵，因为所有这一切，若没有祂——便是地狱，便是地狱，而且仅仅是地狱！人的自我感受、自我认知——若没有基督，便是纯粹的地狱，是咒诅。唯有在基督里，并与祂同在，人的自我感受和自我认知才能逐渐摆脱其被咒诅的地狱本性，借由祂的恩典转化成乐园，其中蓬勃生长着永不凋谢、芬芳馥郁的不朽之花：神的思想、神的情感、神的愿望、神的心境、神的作为。人藉着对神基督的信仰和爱，将自己的灵魂充满祂，便能逐渐将自己的生命本质转化为乐园般的本质；那时，生而为人，便是喜乐中的喜乐，福乐中的福乐。因为成为基督的人，实际上也就意味着成为真正的人。
    - type: paragraph
      text:
        ru: 4:8–9
        cn: 4:8–9
    - type: paragraph
      text:
        ru: 'Пакао је сваки човек без вере у Христа, јединог истинитог Бога у свима световима. Не верује ли у Христа, човек је увек роб лажних богова: лажних богова око себе или у себи. Јер човек: или обоготворава бића и ствари око себе, или обоготворава своје мисли, своје идеје, своје страсти у себи. А за све те богове којима човек робује свесно и несвесно, провера је једна: смрт. Проверите их смрћу: ако не могу да је победе, онда су то лажни богови, лажни сви од реда, од првог до последњег. Све што није јаче од смрти, а проглашује себе за бога, лажан је то бог, несумњиво лажан. И сваки који није јачи од смрти, а предлаже себе за бога, или сматра себе богом, или хоће да собом замени истинитог Бога, лажан је то бог, лаже и себе и све око себе. Људи несумњиво служе лажним боговима, ако не служе једином истинитом Богу – Господу Христу. Јер сви такозвани богови нису то по природи, тојест немају у себи оно што истинитог Бога чини истинитим Богом, а то је: Вечни Живот, Вечна Истина, Вечна Правда, Вечна Љубав, Вечна Свемоћ, Вечно Блаженство. Ко то има – тај је истинити Бог, и тиме је јачи од смрти. А по чему можемо знати да то неко има? По томе, ако нама људима да – Вечни Живот, Вечну Правду, Вечну Љубав, Вечно Блаженство. А то роду људском даје само Господ Исус Христос – Богочовек. Зато је Он једини истинити Бог рода људског, посведочен непобитно свеопштим искуством рода људског. Ту нема ничег измишљеног, већ све сама богочовечанска стварност, опипљива за све људе, за свако људско биће: опипљив је и очигледан је и Живот Вечни и Љубав Вечна и све што Богочовек Христос као једини истинити Бог даје људима поставши човек и боравећи у телу Свом – Цркви (ср.1Ин.1:1–3, 5:20, 11–12, 4:9).'
        cn: 地狱是每一个没有信靠基督的人，祂是诸世界中唯一的真神。若不信靠基督，人就永远是假神的奴隶：或是围绕他自身的假神，或是他自身里面的假神。因为人：要么神化自身周围的生灵与事物，要么神化他自身的思想、理念、他自身里面的情欲。而对于人或自觉或不自觉地为之奴役的所有这些神明，只有一个检验：死亡。用死亡检验他们：如果他们不能战胜死亡，那么他们就是假神，从第一个到最后一个，全都是假神。凡是不强于死亡，却自称是神的，都是假神，无疑是假神。并且，凡是不强于死亡，却自荐为神，或自认是神，或想用自己取代真神的，都是假神，他欺骗了自己，也欺骗了身边所有的人。如果人们不事奉唯一的真神——主基督，他们无疑就是在事奉假神。因为所有所谓的假神，其本质并非如此，也就是说，他们自身不具备使真神成为真神的一切，即：永恒的生命、永恒的真理、永恒的公义、永恒的爱、永恒的全能、永恒的福乐。谁拥有这些——谁就是真神，并因此而强于死亡。我们又如何能知道某位拥有这些呢？凭此可知，如果祂赐予我们人类——永恒的生命、永恒的公义、永恒的爱、永恒的福乐。而唯有主耶稣基督——这神人，将这些赐予人类。因此，祂是人类唯一的真神，这一点由人类普遍的经验无可辩驳地证实。在此没有什么虚构之物，而是完全的神人实相，对所有人、对每一个人类个体都是可触摸的：永恒的生命和永恒的爱，以及神人基督作为唯一的真神，在成为人并居于祂的身体——教会之中时赐予人类的一切，都是可触摸且显而易见的（参阅 约翰一书 1:1-3，5:20，11-12，4:9）。
    - type: paragraph
      text:
        ru: Богочовек је човечански очигледно и стварно показао и доказао да је истинити Бог, али је и божански свеубедљиво показао и доказао да је у исто време и истинити човек. Зато мимо Богочовека нема истинитог Бога. И Јеврејство, без Месије Богочовека – мртва је сенка, неостварено обећање, непотврђена и непосведочена вера победом над смрћу. По слабости и немоћи Јеврејство се изједначује са незнабоштвом када одбацује Месију Богочовека, или када хоће да Богочовека потчини слабим и убогим стихијама својим, да Га преправи и дотера по слици и прилици својој. А то чините и ви, некадањи незнабошци у Галати, подајући се саблазнима, на које вас маме јеврејски обредољупци и законски буквалисти. Све у овоме свету добија свој смисао, прави смисао, само у светлости онога света, у светлости Вечности, коју је Господ Христос снео с неба на земљу поставши човек.
        cn: 基督神人以人的方式明显并真实地显明并证明祂是真实的神，但祂也以神的方式极具说服力地显明并证明祂同时也是真实的人。因此，离了基督神人就没有真实的神。而犹太教，若没有弥赛亚基督神人，便是一个死去的影子，一个未实现的应许，一份未经战胜死亡所证实和见证的信仰。因着软弱和无力，当犹太教拒绝弥赛亚基督神人时，或者当它想要使基督神人屈从于它那软弱和贫乏的本原，按着它自己的形象和样式重塑并修饰祂时，它就等同于异教。而你们这些昔日加拉太的异教徒们，也如此行，屈服于那些诱惑，就是犹太律法仪文主义者和律法字句主义者引诱你们陷入的诱惑。世上的一切唯独在那世界的亮光中，在永恒的亮光中，才能获得它的意义，它真正的意义——这永恒的亮光是主基督借着成为人，从天上带到地上的。
    - type: paragraph
      text:
        ru: '4:10'
        cn: '4:10'
    - type: paragraph
      text:
        ru: Тако, и дани и месеци и времена и године добијају свој прави, вечни смисао једино у Христу и Христом. Све је то човека ради, а човек – Богочовека ради. Ето вам сигурног еванђелског, богочовечанског мерила за то. А не прихватите ли ово једино истинско и сигурно мерило,
        cn: 如此，无论是日子，还是月份，还是季节，还是年份，唯独在基督里并藉着基督，才能获得其真正的、永恒的意义。这一切是为了人，而人是为了神人。这就是你们对此所拥有的、确凿无疑的、福音性的、神人性的衡量标准。但若你们不接受这唯一真实而稳妥的衡量标准，
    - type: paragraph
      text:
        ru: '4:11'
        cn: '4:11'
    - type: paragraph
      text:
        ru: 'бојим се за вас да се нисам узалуд трудио око вас: јер ће узалуд бити мој труд око вас, ако вас нешто или неко опет одвуче од јединог истинитог Бога и Господа – Исуса Христа. А одвуче ли вас од Њега, авај – одвучени сте у неистину, у лаж, у смрт, у пакао. И опет постајете робље и плен греха, смрти и ђавола. А ко ће вас онда избавити? Та ви знате да од тога избавља само Он – Једини Победитељ смрти и Васкрситељ, Господ Христос. Зашто се онда враћате на слабе и убоге стихије, ви свебогати и свемоћни богаташи, ви свемоћни синови Божји, ви свебогати наследници Божји? Та те ће вас стихије осиромашити и оголити: отеће вам и бесмртност и живот вечни и сва блага вечна, божанска, небеска! Опомените се, тргните се, ви сте над амбисом свесмрти, свегреха, свепакла! Још мало, још мало, па ће вас искушења и саблазан стровалити у пакао, из кога нема повратка, сем кроз мучни и тешки подвиг покајања и самоиспаштања крвавог и знојавог. Не дајте се поново у ропство смрти, јер вас у њега вуку сви лажни богови; а од њега вас спасава само једини истинити Бог и Господ – Исус Христос Богочовек.'
        cn: 我为你们惧怕，免得我在你们身上所付的劳苦是徒然的；因为如果有什么事物或某人再次将你们引离独一的真神和主——耶稣基督，我在你们身上的劳苦就将是徒然的。而如果你们被祂引开，唉——你们就被引入了虚妄，引入了谎言，引入了死亡，引入了地狱。你们就再次成为罪恶、死亡和魔鬼的奴仆和掳物。那时谁能将你们拯救呢？你们岂不知，只有祂——独一的死亡征服者与复活者，主基督——才能将你们从其中拯救出来。你们这些全然富足且全然有能的富者，你们这些全然有能的上帝之子，你们这些全然富足的上帝的继承者，为何那时还要回归那些微弱而贫乏的世俗原则呢？那些世俗原则将使你们贫瘠与赤裸：它们将夺去你们的不朽和永生，以及所有永恒的、神圣的、属天的财富！警醒吧，猛醒吧，你们正悬在全然的死亡、全然的罪恶、全然的地狱的深渊之上！片刻之间，片刻之间，试探和诱惑就将把你们投入地狱，从那里永无回头之路，除非通过那血汗交织的，苦痛而艰辛的悔改和自我赎罪的属灵挣扎。不要再次将自己交付于死亡的奴役，因为所有假神都将你们拉入其中；而只有独一的真神和主——神人耶稣基督——才能将你们从其中拯救出来。
    - type: paragraph
      text:
        ru: '4:12'
        cn: '4:12'
    - type: paragraph
      text:
        ru: 'Браћо, мислите ли да сте пронашли нову истину и нов пут спасења, када хоћете да приступите Закону Мојсијевом. Молим вас, погледајте на мене, и узмите мене за пример: ја сам био велики ревнитељ Закона, а то је оно што ви сада хоћете да будете; али сам ја, познавши Христа, истинитог Месију и Спаситеља, одбацио Закон, и сав пошао за Спаситељем ради спасења душе своје, – стога будите као и ја. Користите се мојим искуством. Но ако и даље останете упорни у тој жељи да следујете Закону Мојсијевом, знате ли коме ћете учинити нажао? Не мени, већ себи. Да, себи: јер ћете себе лишити Спаситеља и спасења; изгубићете Господа Христа, јединог Спаситеља рода људског под небом. Изгубивши Њега, ви ћете изгубити: Вечну Истину, Вечну Правду, Вечну Љубав, Вечни Живот, Царство Небеско; изгубићете јединог истинитог Бога у свима световима, и тиме Јединог Победитеља смрти. А каква вам је онда корист, макар задобили све светове? Јер сви ти светови, шта су човеку који нема истинитог Бога, него мука на муку и јад на јад и леш на леш! То је најстрашније што вам се може десити: изгубити Христа Спаситеља. А шта је страшније за човека него – немати јединог истинитог Спаситеља, и тако остати бедни роб греха, смрти и ђавола?'
        cn: 弟兄们，当你们想要依附摩西律法的时候，你们以为自己找到了新的真理和新的救赎之路吗？我恳请你们，看看我，以我为榜样：我曾是律法的大热心者，而那正是你们现在想要成为的；但我，在认识了基督、这位真正的弥赛亚和救主之后，便弃绝了律法，并全身心地跟随了救主，为了我灵魂的救赎——因此，要像我一样。借用我的经验吧。然而，如果你们仍然执意想要遵循摩西律法，你们知道会伤害谁吗？不是我，而是你们自己。是的，你们自己：因为你们将剥夺自己获得救主和救赎的机会；你们将失去主基督，这位在天下人类唯一的救主。失去祂，你们将失去：永恒的真理，永恒的公义，永恒的爱，永恒的生命，天国；你们将失去万有中唯一的真神，并因此失去那唯一的死亡战胜者。那么，即便你们赢得了全世界，对你们又有什么益处呢？因为所有这些世界，对于一个没有真神的人来说，除了苦上加苦、悲上加悲、尸上加尸，又能是什么呢！那是可能发生在你们身上最可怕的事：失去基督救主。对人而言，还有什么比这更可怕呢——没有唯一的真救主，从而沦为罪恶、死亡和魔鬼的可怜奴隶？
    - type: paragraph
      text:
        ru: '4:13'
        cn: '4:13'
    - type: paragraph
      text:
        ru: 'Благовест о једином Спаситељу ја вам први донесох: и показах и доказах вам не само речима него и чудесима, да је Исус Христос заиста једини Спаситељ људи у нашем земаљском свету. Ту истину ви свим бићем и осетисте и примисте, иако сам вам је проповедао будући болестан телом. Зашто ви, због слабости и болести тела мог, не одбацисте онда ту благовест и истину? Зато што сте увидели да Господ свеспасоносни кроз слабост моју показује сву силу Своју: обелодањује и дарује вам сва божанска блага Своја и све божанске силе Своје. И још зато што сте осетили да је болест моја на мени по промислу Божјем: да ме опомиње да се не погордим што се преко мене објављују и дарују вама тако неисказана блага Божја и силе Божје; да ме потсећа на милу немоћ моју, и на пролазност и смртност тела; да не уобразим да је ишта од тога моје, већ да најпре ја, а и ви после мене и због мене, знамо да је спасење само од Спаситеља, и све што спасење доноси: победу над грехом, смрћу и ђаволом, васкрсење, вечни живот, вечну истину, вечну љубав, вечно блаженство, вечни рај.'
        cn: 关于独一救主的福音，我首先向你们传达：我不仅用言语，也用神迹向你们表明并证明了，耶稣基督确实是我们这世间人类独一的救主。尽管我向你们传讲这个真理时身体病弱，你们却全心感受并接受了它。那么，为什么你们没有因为我肉身的软弱和疾病而拒绝那福音和真理呢？因为你们领悟到，普施救恩的主借着我的软弱彰显祂全部的能力：祂启示并赐予你们祂所有神圣的福益和祂所有神圣的能力。而且，因为你们感受到，我的病痛临到我，是出于上帝的护理：为的是提醒我，不要因借着我向你们宣示并赐予如此不可言喻的上帝的福益和能力而自大；使我记起我亲爱的软弱，以及肉身的短暂和必死性；我不至于臆想其中任何一部分是我的，而是首先让我，以及在我之后并因为我的缘故，你们也知道，救恩唯独来自救主，以及所有救恩所带来的：胜过罪恶、死亡和魔鬼，复活，永生，永恒的真理，永恒的爱，永恒的福乐，永恒的天堂。
    - type: paragraph
      text:
        ru: '4:14'
        cn: '4:14'
    - type: paragraph
      text:
        ru: 'Због свега тога ви не презресте ту напаст моју, нити ме попљувасте, него ме примисте као анђела Божјег: јер само анђео Божји могао вам је донети такву невиђену благовест и показати вам небо на земљи, Бога међу људима, Победитеља смрти међу робљем смрти, безгрешног Богочовека у царству греха. И ви сте осетили да нисам ту главно ја већ Он – Господ и Спаситељ, и све оно што Он оличава и доноси преко мене ништавног, болесног, сиромашног. Човек? Зар човек, икоји човек, а камоли ја – болестан човек, може људима давати такво здравље, и духовно и физичко, пуно вечне истине, вечне правде, вечне љубави, пуно неба, Бога, бесмртности, вечности? Загледани у чудесне божанске дарове које вам је једини Бог и Господ, Исус Христос Богочовек – нудио и давао преко мене болесна, ви ме не само примисте као анђела Божјег него као Христа Исуса. Толико сам ја постао неприметан за вас, ја – Савле и Павле, јер вам ништа своје нисам давао, већ само оно што је Његово, а кроз све то Њега самог – чудесног и незаменљивог? Господа Христа, Спаситеља и Богочовека. У томе је и неисказана радост моја што ја себе не проповедам већ Њега – јединог Спаситеља, и што себи не живим већ Њему, и што себе нећу и не желим већ само Њега: да сав будем у Њему и Он у мени. Радост над радостима је за мене: што ја не живим већ у мени живи Господ Христос; и ви ме примисте као Христа Исуса. И с правом, јер вам ништа своје нити нудим нити дајем; јер сам давно умро себи, давно је умро Савле, да би у мени могао живети вечни Бог и Господ – Исус Христос.'
        cn: 因此这一切，你们没有轻看我的那次患难，也没有唾弃我，反而接待了我，如同上帝的使者：因为只有上帝的使者才能给你们带来如此前所未闻的福音，并向你们显明天堂在地上，上帝在人间，死亡奴役中的死亡得胜者，罪恶王国中的无罪神人。你们也感觉到，在那里主要的不是我，而是祂——主和救主，以及祂通过我这微不足道、病弱、贫乏之人所体现并带来的一切。人？难道人，任何一个人，更何况我——一个病弱的人，能赐予人们那样的健康，无论是属灵的还是身体的吗？充满永恒的真理、永恒的公义、永恒的爱，充满天堂、上帝、不朽、永恒？凝视着那唯一之上帝和主，神人耶稣基督，通过我这病弱之人向你们提供并赐予的奇妙神圣恩赐，你们不仅接待了我，如同上帝的使者，更如同基督耶稣。我——扫罗和保罗，在你们看来变得如此不显眼，因为我没有给你们任何属于我自己的东西，而只给了祂的，并且通过这一切，是祂自己——那位奇妙而无可替代的？主基督，救主和神人。这就是我那不可言喻的喜乐，因为我不宣讲自己，而是宣讲祂——那位唯一的救主，并且我不为自己而活，而是为祂而活，并且我不寻求自己，也不渴望自己，而只寻求祂：使我完全在祂里面，祂也在我里面。对我而言，这是喜乐中的喜乐：不是我活着，而是主基督在我里面活着；并且你们接待了我，如同基督耶稣。这是理所当然的，因为我既不向你们提供也不赐予任何属于我自己的东西；因为我早已向自己死了，扫罗早已死了，好让永恒的上帝和主——耶稣基督能够在我里面活着。
    - type: paragraph
      text:
        ru: '4:15'
        cn: '4:15'
    - type: paragraph
      text:
        ru: 'И због свега тога, какво бејаше онда ваше блаженство! Ваистину неупоредиво и посве изузетно блаженство на земљи: познати јединог истинитог Бога и Спаситеља, добити кроз Њега спасење и живот вечни и све божанске силе и радости. Уствари, то једино и заслужује да се назове блаженством човековим у свом свету. Све друго, упоређено са тим, није ли проклетство? Проклетство је и савест човекова без Бога, јер раније или касније она неизоставно постане роб саблазни, лакеј греха, плен смрти. Тако и душа човекова без Бога, тако и ум, тако и воља, тако и истина човекова без Бога, и правда човекова без Бога, и добро човеково без Бога, и живот човеков без Бога – све само проклетство до проклетства. Насупрот томе, блаженство је савест човекова када је испуњена Христом Богом; блаженство је и душа, и ум, и срце, и воља, када су испуњени Христом Богом; блаженство је и истина човекова, и правда, и добро, и живот, и смрт, и све што је човеково – када је испуњено Христом Богом: блаженство за блаженством, непрекидна поворка бесмртних блаженстава. Осетивши то у Христу кога сам вам проповедао, и видевши да вам то блаженство дајем, ви сте ме толико заволели, да сте били готови дати ми очи своје. Еванђељем Христовим ја сам вам дао други вид, друге очи: духовне и бесмртне и свевидеће; њима видите јединог истинитог Бога, и вечну Истину, и вечни живот, и сва небеска блага: видите невидљиво! кроз видљиво видите невидљиво, као душу и срце свега видљивога (ср.2Кор.4:18).'
        cn: '因此，因为所有这一切，那时你们的福分是何等大啊！诚然，这是地上无与伦比且全然超凡的福分：认识独一的真神和救主，并藉着祂得着救赎和永生，以及一切神圣的能力和喜乐。实际上，唯有此才配称为人在其世上的福分。其它一切，与此相比，岂不是咒诅吗？人的良知若没有神，也是咒诅，因为它迟早必然会成为诱惑的奴隶，罪恶的走狗，死亡的猎物。照样，人的灵魂若没有神，人的心智，人的意志；照样，人的真理若没有神，人的公义若没有神，人的良善若没有神，人的生命若没有神——所有这些都只是咒诅，接连不断的咒诅。


          与此相反地，人的良知若被基督上帝充满，便是福分；人的灵魂、心智、心和意志若被基督上帝充满，也便是福分；人的真理、公义、良善、生命、死亡，以及人的一切若被基督上帝充满，也便是福分：福分接踵而至，永不间断的不朽福分之队列。当你们在我所传扬的基督里感受到了这一点，并看到我将这福分赐予你们时，你们是如此爱我，甚至愿意将你们的眼睛给我。借着基督的福音，我给了你们另一种视力，另一双眼睛：属灵的、不朽的和洞察一切的；借着它们，你们看见独一的真神，并永恒的真理，并永生，并天上的一切福益：你们看见了那不可见的！借着可见之物，你们看见了那不可见的，如同看见一切可见之物的灵魂和心。（参阅哥林多后书 4:18）'
    - type: paragraph
      text:
        ru: 4:16–17
        cn: 4:16–17
    - type: paragraph
      text:
        ru: 'И ја који вам Христом Исусом казах сву истину неба и земље, тиме ли вам постадох непријатељ што вам истину казах, и што вам и сада истину казујем? Да, и сада вам без околишења казујем сву истину, сву без остатка. Шта је истина? Богочовек Христос, и све што је у Њему и од Њега. А ја вама само то и говорим. Ништа људско, ништа човечије, већ само и једино оно што је Богочовечије. А у томе не може бити ни трунке неистине. Све сама истина од врха до дна. А све што није од ње, и што је против ње, и што удаљује од ње, ето – то је неистина, то лаж, то сам ђаво: јер је лажа и отац лажи, и као такав не стоји унутар Истине, сав је испао из Ње и отпао од Ње, и зато у њему нема истине (Ин.8:44). А они који хоће да вас одвоје од Једине Истине, Свеистине, и јесу деца лажи, деца оца лажи, лажни учитељи; њихова ревност је на зло њима, и на погибао вама. И станете ли ревновати у њиховим лажима, шта ће остати од ваше вере у Христа Спаситеља? шта ће остати од вашег спасења? шта од ваше неспасене душе? Смрт, смрт, смрт. Не варајте се: и грех има свој огањ, свој жар, којим се душе грехољубаца запаљују и распаљују у пожар. Захвати ли вам тај пожар сву душу, сву савест, ко ће га угасита, ако не Једини Спаситељ од греха, смрти и ђавола – Господ Христос, кога хоћете да се отуђите, заведени од лажних учитеља?'
        cn: 并且我，借着基督耶稣向你们宣讲了天地间的一切真理，难道就因为向你们宣讲了真理，而且甚至现在仍在向你们宣讲真理，就成了你们的敌人吗？是的，甚至现在我仍毫无保留地向你们宣讲一切真理，一切毫无遗漏。什么是真理？是神人基督，以及一切在他里面并源于他的一切。而我只向你们讲说这些。没有什么属人的，没有什么人性的，而只有且仅仅是那神人性的。而在这其中，不可能有一丝一毫的虚假。从头到尾，尽是真理本身。而一切不源于它、与它相悖、并使人远离它的，看哪——那就是虚假，那就是谎言，那就是魔鬼本身：因为他是说谎者，也是谎言之父，并且作为这样的一种存在，他并不在真理之内，他完全从真理中跌落并离弃了真理，因此在他里面没有真理（约翰福音 8:44）。而那些企图使你们与独一真理、全备真理分离的人，他们就是谎言之子，谎言之父的儿女，假教师；他们的热心对他们自己是祸患，对你们却是灭亡。假如你们在他们的谎言中也变得热心起来，你们对基督救主的信心还会剩下什么呢？你们的救恩还会剩下什么呢？你们那未蒙拯救的灵魂还会剩下什么呢？死亡，死亡，死亡。不要自欺：罪恶也有它自己的火焰，它自己的炽热，借此，那些爱罪者的灵魂被点燃并燃烧成一场大火。假如那场大火吞噬了你们的整个灵魂，整个良心，谁能熄灭它呢？如果不是那独一的救主，将人从罪恶、死亡和魔鬼中拯救出来——主基督，而你们却想离弃他，被假教师所迷惑？
    - type: paragraph
      text:
        ru: '4:18'
        cn: '4:18'
    - type: paragraph
      text:
        ru: 'Знајте више свега што се треба знати: нужно је свагда ревновати у добру, да се оно не би угасило у вама. Јер нам је Господом Христом дато божанско добро, да би оно прожело и захватило и оплодило све биће наше: квасац божански у три копање брашна нашег бића – уму, срцу, вољи. Све то треба да ускисне божанским добром, да сташе, да постане свакодневна храна, хлеб живота који силази с неба и даје вечни живот свему човековом: и срцу и уму и вољи и живљењу. Ђаво пак неуморно ревнује у злу; ви се браните од њега непрекидно ревнујући у добру, у Христовом добру. Сву вољу своју унесите у добро, и тиме је ојачајте, охристовите, обогочовечите. Не учините ли то, лажни вас учитељи могу ласно саблазнити и претворити у неразумне ревнитеље зла. Стојте и умом и вољом и срцем у Христу Исусу, да вам паклена сила зла кроз лажне учитеље не украде сва Христова добра. Јер ђаво само то и ради: невидљиво обилази срца људска и «краде посејано у срцу» човечијем, посејано Христом семе небеских истина (ср.Мф.13:19;Лк.8:12). А кад украде из срца вашег оно што је посејао Небески Сејач – Христос, шта онда остаје у вама осим неистине, смрти и греха?'
        cn: 须知一切当知之事：务必常常热切地行善，以免善在你里面熄灭。因为藉着主基督，神圣的善已赐予我们，为要使其渗透、掌握并使我们的整个存在结出果实：即，神圣的酵母在我们存在的三「升」面粉中——在悟性、在心里、在意志中。所有这一切都必须被神圣的善所发酵，使其膨胀，成为我们日常的食粮，成为从天而降并赐予人的一切——心、悟性、意志以及生命——永恒的生命之粮。魔鬼却在邪恶中不知疲倦地热心作恶；你们当藉着不断地热心行善，即在基督的善中，抵挡他。将你们全部的意志投入善中，借此使其刚强，使其基督化，使其神人化。若不如此行，假教师就可能轻易地引诱你们，并把你们变成不明事理的邪恶热心者。在基督耶稣里，以悟性、意志和心站稳，以免地狱的邪恶势力借由假教师，将基督的一切美善从你们那里偷走。因为魔鬼所做的无非就是：他暗中巡视人心，并且「将那撒在人心里」的，即基督所撒下的天国真理的种子「夺了去」（参看马太福音 13:19，路加福音 8:12）。当他从你们心里窃取了那由天上的撒种者——基督——所撒下的种子时，那么除了虚假、死亡和罪，还有什么留在你们里面呢？
    - type: paragraph
      text:
        ru: '4:19'
        cn: '4:19'
    - type: paragraph
      text:
        ru: 'Хришћанинов живот је непрекидни подвиг: подвиг охристовљења, подвиг обогочовечења. У чему је он? У томе: да Господ Христос постане у теби не само жива истина и жива правда и жива љубав; не само да Његове истине живе у теби, и расту, и множе се; него да Он сав буде у теби пуноћом Своје Богочовечанске Личности, да лик Његов буде на свему твоме и у свему; да ти више не живиш, него да у теби живи Христос: да душом својом постанеш сав христолик; да се Христов лик огледа у свему твоме, и буде на свему твоме. А Христово се обличје образује у нама, како? Помоћу светих тајни и светих врлина. Свака од њих мала Христов лик у нама, док га оне заједнички, све скупа живећи у нама, потпуно не измалају, те се у нама добије живо, вечно живо обличје Богочовека Христа. Почиње се светом тајном крштења: она најпре живопише лик Спасов у човеку хришћанину. После се тај лик одржава, и употпуњује, и усавршава кроз остале свете тајне и свете врлине: причешће, исповест, веру, љубав, молитву, пост, кротост, и друге редом, и то све тако, целог живота тако – «док Христово обличје не постане у вама», док се Христос не образује у вама. Да, Христос се образује у вама место свега другог, и место тебе самог. Јер без лика Христовог у себи човек је чудовиште и страшилиште. Зато све старање скрените на то: да се Христос образује у вама. Дате ли место греху и гресима, страсти и страстима, они ће постепено и неприметно образовати у вама, знате ли чији лик? – Ђаволов. Јер је сваки грех кичица којом ђаво у души твојој мала'
        cn: 基督徒的生命是一场不间断的苦修：一场基督化的苦修，一场神人化的苦修。它在于何处呢？它在于：主基督在你里面不仅成为活的真理、活的公义和活的爱；不仅是祂的诸真理在你里面活着、成长、增多；而是祂以其神人位格的丰满，全然在你里面；祂的形象在你的一切之上，也在你的一切之内；使你不再活着，而是基督在你里面活着：使你的灵魂完全肖似基督；使基督的形象映照在你的一切之中，也在你的一切之上。那么，基督的形像如何在我们里面形成呢？借着圣事和圣德。它们每一个都在我们里面描绘着基督的形象，直到它们共同地、全部一起活在我们里面，将其完全描绘出来，这样，我们里面便获得了神人基督活泼的、永恒活泼的形像。它始于圣洗圣事：它首先在基督徒里面生动描绘出救主的形象。之后，这形象借着其他的圣事和圣德得以保持、得以完善、得以成全：圣体血、告解、信心、爱、祷告、禁食、温柔，以及其他依序的圣事和圣德，这一切都是如此，一生都是如此——「直到基督的形像在你们里面形成」，直到基督在你们里面形成。是的，基督在你们里面形成，取代一切，也取代你们自己。因为人若没有基督的形象在自己里面，便是怪物和可怖之物。因此，将一切关注转向于此：使基督在你们里面形成。如果你们给罪和诸罪、情欲和诸情欲留有余地，它们就会逐渐地、不知不觉地在你们里面形成，你们知道是谁的形象吗？——是魔鬼的。因为每一个罪都是魔鬼在你灵魂中描绘的画笔。
    - type: paragraph
      text:
        ru: себе, док кроз многе грехе и страсти потпуно не измала себе у теби, и тако ликом својим замрачи и заклони лик Божји који ти је дат Богом при стварању. А ви Галати, некадањи незнабошци, знате како страшну и огромну силу има ђаво над душом људском све док је Господ Христос не посети и не испуни.
        cn: 自己，直到它通过众多的罪恶和情欲在你里面彻底磨灭了自己，并因此以其自己的样式使那在你受造时由上帝所赐予的上帝的形象黯淡并遮蔽。而你们，加拉太人，曾是异教徒的，知道魔鬼对人的灵魂拥有何等可怕而巨大的力量，直到主基督前来探访并充满它为止。
    - type: paragraph
      text:
        ru: '4:20'
        cn: '4:20'
    - type: paragraph
      text:
        ru: И ја сам сада у недоумици односно вас, хтео бих да сам код вас, да вас лично и усмено упозорим на опасност која прети вери вашој од лажних учитеља, а кроз веру прети и самом Господу Христу који је вером и љубављу у вама. О, шта кажем? Прети не Њему, јер Њега никакав грех ваш не може убити ни уништити, само Га може уклонити из вас, лишити вас Њега, пошто Он ни у коме не обитава на силу. А ви без Њега? без лика Његовог, шта сте? и шта ћете бити? О, та ви ћете се опет вратити у свој пређашњи пакао, у свет без Христа, у живот без Христа. А то, зар није пакао, и царство свакога зла и свакога греха и свакога ђавола?
        cn: 我现在对你们感到忧虑，我想在你们身边，亲自并口头警告你们，警惕那来自假教师、正威胁着你们信心的危险；并且，这危险也透过信心，威胁到那借着信心与爱住在你们里面的主基督。哦，我说了什么？不是威胁祂，因为你们的任何罪恶都不能杀死或毁灭祂，只能将祂从你们里面移走，使你们失去祂，因为祂从不住在任何勉强的人里面。可是你们没有祂呢？没有祂的形象，你们是什么？你们将成为什么？哦，你们会再次回到你们从前的地狱，回到一个没有基督的世界，回到一种没有基督的生活。而那，难道不是地狱，难道不是一切邪恶、一切罪恶、一切魔鬼的国度吗？
    - type: paragraph
      text:
        ru: '4:21'
        cn: '4:21'
    - type: paragraph
      text:
        ru: 'Ако хоћете да докучите божански, промислитељски смисао старозаветног Закона, његових догађаја и личности, онда побожно зароните у његове дубине, зађите иза завесе видљивога у божанска тајанства невидљивога. И тада ћете, уз помоћ Божју, за ваше смирење и смиреноумље, разумети духовни смисао историских збивања и догађаја. Узмите овај историски догађај:'
        cn: 如果你们想要领悟旧约律法、其事件和人物的神圣的、神导的意义，那么就虔敬地深入其深处，穿过可见之物的帷幕，进入不可见之物的神圣奥秘。届时你们就将，借着上帝的帮助，为了你们的谦卑和谦逊，领悟历史性的发生和事件的属灵意义。请看这个历史事件：
    - type: paragraph
      text:
        ru: 4:22–23
        cn: 4:22–23
    - type: paragraph
      text:
        ru: Авраам је имао два сина, Исмаила и Исака; Исмаила од робиње Агаре, Исака од слободне Саре. Исмаил се родио од робиње по телу, по природним законима телесног рођења; а Исак се родио од Саре по обећању, дејством натприродне благодати Божје, по сили духовног дејства Божјег у утроби нероткиње престареле Саре, по обећању које је Бог дао Аврааму. Само обећање Божје је овде делотворно и стваралачко, пуно свемоћне силе свемоћнога Бога.
        cn: 亚伯拉罕有两个儿子，以实玛利和以撒；以实玛利是婢女夏甲所生，以撒是自由妇人撒拉所生。以实玛利是按着肉体，凭着肉身生育的自然律，由婢女所生；而以撒是按着应许，借着上帝超自然的恩典的作为，凭着上帝属灵作为的能力，在不生育且年迈的撒拉的子宫里所生，是照着上帝赐给亚伯拉罕的应许。在此，唯独上帝的应许是具有功效且具创造性的，充满着全能上帝的全能大能。
    - type: paragraph
      text:
        ru: 4:24–26
        cn: 4:24–26
    - type: paragraph
      text:
        ru: 'Али ова два историска догађаја имају свој преносни, духовни, шири смисао свеисториски, свевременски, свечовечански: јер прасликују два Завета, Стари и Нови. Ове две мајке, две жене: Агара и Сара, праслике су двају Завета: Агара – Завета датог на гори Синају, који рађа децу за робовање. Јер Синај, који се зове и Агар, јесте гора у Арабији где живе потомци Агаре. Она прасликује земаљски Јерусалим, коме је дат закон Синајски; овај Јерусалим робује са житељима својим, попут Агаре која је била робиња и рађала робове а не слободне. Сара пак, слободна и мати слободног сина и по обећању, сина рођеног на натприродан начин, јесте праслика горњег Јерусалима и његове слободне деце, тојест мати свих хришћана. Јер и ми се хришћани рађамо духовно натприродним дејством благодати Духа Светога; и као деца Божја и синови Божји, ми смо слободни небеском слободом: слободни од греха, смрти и ђавола. Јер где је Дух Свети, онде је и слобода од свега тога.'
        cn: 但是，这两个历史事件拥有其象征性、属灵的、更广阔的意义，它们是贯穿历史的、跨越时空的、普世性的；因为它们预表着两个约，即旧约和新约。这两位母亲，两位妇女：夏甲和撒拉，是两个约的预表：夏甲——是那在西奈山上所赐的约，那生下为奴之子的。因为西奈，那也被称为夏甲的，是阿拉伯的一座山，夏甲的后裔居住在那里。她预表着地上的耶路撒冷，西奈山的律法就是赐给她的；这耶路撒冷与她的居民一同为奴，就像夏甲曾是奴隶，生下的是奴隶而非自由人一样。而撒拉，是自由的，并且是自由之子和应许之子的母亲，一个以超自然方式诞生的儿子，她是在上的耶路撒冷以及她自由的儿女们的预表，也就是说，是所有基督徒的母亲。因为我们基督徒也是在属灵上诞生的，借着圣灵恩典的超自然作用；作为上帝的儿女和上帝的儿子，我们拥有属天的自由：脱离了罪、死亡和魔鬼的捆绑。因为哪里有圣灵，哪里就有从这一切中而来的自由。
    - type: paragraph
      text:
        ru: 4:27–28
        cn: 4:27–28
    - type: paragraph
      text:
        ru: 'Богонадахнути Исаија Духом Светим открива нам тајну, свету тајну Христове Цркве, која Духом Светим рађа духовну децу, чега је била праслика Сара рађајући Исака по дејству свемоћног обећања Божјег. Пре доласка Господа Христа и пре силаска Светога Духа Црква је била нероткиња, али од тада: она без икаквих порођајних мука, дејством Светога Духа, радосно и блажено рађа безбројну духовну децу, којима нема броја. Стога смо и ми, сви хришћани, као Исак – деца обећања. Јер се рађамо од Бога Духом Светим, не по природним законима телеснога рађања већ по натприродном дејству благодати Божје, свемоћне, свепрепородне, свеосвећујуће, свеобожујуће, свечудотворне. Сваки је хришћанин – дете Божје, син Божји, и тиме натприродно чудо Божје у овом земаљском свету. Зар није чудо, дивно чудо Божје: родити се од Бога, постати син Божји – вером у Христа, Јединородног Сина Божјег? Све је ту натприродно: вера те сједињује са наднебесним Богом и Господом, преноси те на небо, рађа те и чини грађанином неба, те је твоје «живљење на небесима», где Христос седи с десне стране Оца (ср.Флп.3:20;Кол.3:1–3).'
        cn: 神所默示的以赛亚，借着圣灵向我们启示一个奥秘，基督教会的神圣奥秘。这教会借着圣灵生出属灵的儿女，而撒拉因着上帝全能应许的作为生下以撒，正是这奥秘的预象。在主基督降临和圣灵降下之前，教会是不育的；但从那时起：她借着圣灵的作为，没有丝毫生产的痛苦，喜乐而蒙福地生出无数属灵的儿女，其数目无法计量。因此，我们所有基督徒，也像以撒一样，是应许之子。因为我们借着圣灵从上帝而生，不是依照属肉体出生的自然法则，而是依照上帝恩典的超自然作为——这恩典是全能的，使万物重生的，使万物成圣的，使万物成神的，全然施行奇迹的。每一位基督徒都是上帝的儿女，上帝的儿子，从而成为上帝在此地上世界的超自然奇迹。这岂不是一个奇迹，上帝一个奇妙的奇迹吗：从上帝而生，借着信靠基督，上帝的独生子，成为上帝的儿子？在此一切都是超自然的：信心使你与超乎诸天之上的上帝和主联合，将你带到天上，生出你，并使你成为天上的国民，因此你的「生活在天上」，基督坐在父的右边（参阅腓立比书 3:20，歌罗西书 3:1-3）。
    - type: paragraph
      text:
        ru: '4:29'
        cn: '4:29'
    - type: paragraph
      text:
        ru: 'И баш зато што је у нас хришћана све натприродно, божанско, небеско, људи чулнога ума и чулнога схватања не могу то да разумеју и схвате, те гоне и прогоне и хришћане и хришћанство. Ви, некадањи незнабошци, а сада – небески житељи и синови Божји, слободни грађани небеског Јерусалима, зар хоћете да се вратите у Агарино ропство, да робујете чулном схватању и света и човека и живота? Прогледајте на све очи душе: вас старим невидљивим мрежама лове они који живе «по телу», и делају «по телу»; штавише, они гоне нас хришћане, јер наш живот «по духу», по Светом Духу, они не разумеју, виде у њему неки грех, неку страхоту. Али ваша сила и моћ је сва у Богу, Господу Христу, Победитељу греха, смрти и ђавола; не бојте се никог од људи!'
        cn: 正因为在我们基督徒这里，一切都是超自然的、神圣的、属天的，属肉体心智和理解的人无法理解和领悟这些，因而逼迫和迫害基督徒和基督教。你们，曾是外邦人，而今却是属天的居民和神的儿女，天上耶路撒冷的自由公民，难道你们想回到夏甲的奴役中，奴役于对世界、对人、对生命的属肉体理解吗？睁开你们灵魂的所有眼睛：那些「凭肉体」而活、并「凭肉体」行事的人，正用古老而无形的网罗捕捉你们；更有甚者，他们逼迫我们基督徒，因为我们「凭圣灵」的生命，他们不理解，反而在其中看到某种罪恶，某种恐怖。但你们的力量和权能全然在于神，在于主基督，祂是罪恶、死亡和魔鬼的胜利者；不要惧怕任何人！
    - type: paragraph
      text:
        ru: '4:30'
        cn: '4:30'
    - type: paragraph
      text:
        ru: 'Ено, и Свето Писмо вам казује да сте ви под неприкосновеном заштитом Божјом: ослобођени Господом Христом од сваког духовног ропства, ви сте синови Божји, и као такви – наследници Божји, сунаследници Христови; нико вас не може поробити греху и смрти и ђаволу ако ви то нећете, ако и ум и душу и срце своје вером, љубављу и надом пренесете у Господа Христа, којим увек и свагда и сада и кроза све векове и вечности можете побеђивати све и свакога који се дрзне и насрне на вашу духовну слободу коју од Господа Христа добисте. По наређењу Божјем, Авраам је отерао робињу Агару и сина њеног, и тиме извршио велико историско претсказање и пророштво; да син робиње не може бити наследник са сином слободне, тојест да нехришћани и ванхришћани не могу наследити Божја обеђања, која су одређена и уготовљена за синове Божје, вером у Христа, синове слободе од сваког робовања греху и злу.'
        cn: 看哪，圣经也向你们告知，你们是在上帝不可侵犯的保护之下：藉着主基督从一切属灵的奴役中获得释放，你们是上帝的儿女，并且这样一来——是上帝的继承人，基督的共同继承人；没有人能把你们奴役给罪恶、死亡和魔鬼，如果你们不愿意，如果你们凭着信心、爱和盼望，将你们的心思、灵魂和心全然献给主基督，靠着祂，你们永远、时时刻刻、现今并贯穿所有的世代和永恒之中，都能战胜一切胆敢并侵犯你们从主基督所得属灵自由的人和事。遵照上帝的吩咐，亚伯拉罕赶走了使女夏甲和她的儿子，并以此成就了一个重大的历史预言和预示；这就是说，使女的儿子不能与自主妇人的儿子一同作继承人；也就是说，非基督徒和在基督信仰之外的人不能继承上帝的应许，这些应许是指定并预备给那些藉着对基督的信心而成为上帝的儿女，成为脱离一切罪恶和邪恶奴役的自由之子的人。
    - type: paragraph
      text:
        ru: '4:31'
        cn: '4:31'
    - type: paragraph
      text:
        ru: 'Радост бесмртна и вечна радост нас хришћана је у томе што нисмо деца робиње него слободне: тојест нисмо деца земаљског Јерусалима, већ деца небеског Јерусалима – Цркве, која је наша духовна мати, мати наше бесмртности, наше вечности, наше слободе.'
        cn: 我们基督徒不朽的喜乐和永恒的喜乐在于，我们不是婢女的儿女，而是自由妇人的儿女：也就是说，我们不是地上耶路撒冷的儿女，而是天上耶路撒冷的儿女——教会，她是我们属灵的母亲，是我们不朽、永恒与自由的母亲。
  - type: heading2
    text:
      ru: Пета глава
      cn: 第五章
    children:
    - type: paragraph
      text:
        ru: 5:1–26
        cn: 5:1–26
    - type: paragraph
      text:
        ru: Гал.5:1–26:1Стојте дакле чврсто у слободи којом нас Христос ослободи, и не дајте се опет у јарам ропства ухватити. 2 Ево ја Павле кажем вам да ако се обрежете, Христос вам неће помоћи. 3 А опет сведочим свакоме човеку који се обрезује, да је дужан сав закон творити (ποιῆσαι = чинити, извршивати, испуњавати). 4 Изгубисте Христа ви који хоћете законом да се оправдате, и отпадосте од благодати. 5 Јер ми Духом чекамо од вере наду праведности. 6 Јер у Христу нити шго вреди обрезање ни необрезање, него вера која кроз љубав дёла – ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη. 7 Добро трчасте; ко вас спречи да се не покоравате истини? 8 То одвраћање није од онога који вас позива. 9 Мало квасца укисели све тесто. 10 Ја се уздам у вас у Господу, да не ћете друкчије мислити. А који вас смућује, понеће осуду, ма ко био. 11 А ја, браћо, ако још проповедам обрезање, зашто ме још гоне? Укиде се дакле саблазан крста! 12 О да би отсечени били они који вас буне!
        cn: 加拉太书 5:1-121 你们当站立得稳，在基督使我们得自由的自由里，不要再被奴役的轭挟制。2 看哪，我保罗告诉你们，如果你们受割礼，基督就对你们毫无益处。3 并且我再次向每一个受割礼的人作证：他就当遵行（ποιῆσαι = 行、执行、成就）全律法。4 你们这些想靠律法称义的人，就与基督隔绝了，也从恩典中坠落了。5 因为我们借着圣灵，凭着信心等候那所盼望的义。6 因为在基督耶稣里，割礼或未受割礼都毫无益处，唯独那借着爱心运作的信心 – ἀλλὰ πίστις δι』 ἀγάπης ἐνεργουμένη。7 你们曾跑得很好；谁拦阻了你们，使你们不顺从真理呢？8 这劝诱不是出于那召你们的。9 一点面酵能使全团面发起来。10 我在主里深信你们必不怀有别的思想。但那搅扰你们的，必担当他的审判，无论他是谁。11 弟兄们，我若仍在传讲割礼，为什么我仍旧受逼迫呢？那么，十字架的绊脚石就废除了！12 巴不得那些扰乱你们的人被剪除！
    - type: paragraph
      text:
        ru: '13 Ви сте на слободу позвани, браћо; само ту слободу немојте употребити на живљење по телу, него љубављу служите један другоме. 14 Јер се сав закон испуњује у једној речи, у овој: «Љуби ближњег свог као себе самог». 15 Али ако се међу собом кољете и једете, гледајте да један другога не истребите. 16 Кажем вам дакле: Духом ходите, и нећете извршивати жеље телесне. 17 Јер тело жели против Духа, а Дух против тела: ово се противи једно другоме, да не чините оно што хоћете. 18 Ако вас Дух води, нисте под законом. 19 А позната су дела телесна, која су: прељубочинство, блуд, нечистота, бесрамност, 20 идолопоклонство, чарања, непријатељства, свађе, пакости, срдње, пркоси, распре, подвојености, јереси, 21 зависти, убиства, пијанства, преједања, и томе слично. Унапред вам казујем, као што и казах напред, да они који тако чине, неће наследити царства Божјега. 22 А род Духа је љубав, радост, мир, дуготрпељивост, благост, доброта, вера, 23 кротост, уздржање; против таквих ствари нема закона. 24 Који су Христрови, распеше тело са страстима и жељама. 25 Ако Духом живимо, Духом и да ходимо. 26 Немојмо тражити лажне славе, изазивајући један другога, завидећи један другоме.'
        cn: 13 弟兄们，你们蒙召得了自由；只是不可将这自由当作放纵肉体的机会，总要凭着爱心彼此服事。14 因为全部的律法都包含在这一句话之内，就是：「要爱邻舍如同自己。」15 但你们若彼此相咬相吞，就要小心，免得彼此消灭。16 所以，我告诉你们：当顺着圣灵而行，就绝不会满足肉体的私欲。17 因为肉体与圣灵为敌，圣灵也与肉体为敌；这两者彼此对立，使你们不能做自己愿意做的事。18 但你们若被圣灵引导，就不在律法之下。19 肉体的行为是显而易见的，包括：奸淫、淫乱、污秽、放荡、20 拜偶像、行邪术、仇恨、争竞、恶意、恼怒、结党、纷争、分裂、异端、21 嫉妒、凶杀、醉酒、荒宴，以及诸如此类的事。我预先告诉你们，正如我从前所说过的，行这些事的人，必不能承受神的国。22 圣灵的果子却是：爱、喜乐、和平、忍耐、恩慈、良善、信实、23 温柔、节制。对于这样的事，是没有律法的。24 凡属基督耶稣的人，都已把肉体连同肉体的邪情私欲同钉十字架了。25 我们若靠圣灵活着，也当靠圣灵行事。26 我们不要贪图虚浮的荣耀，彼此惹气，互相嫉妒。
    - type: paragraph
      text:
        ru: '5:1'
        cn: '5:1'
    - type: paragraph
      text:
        ru: Слобода у Христу? То је слобода од греха, од смрти, од ђавола, која живи Вечном Истином, Вечном Правдом, Вечном Љубављу, свим оним што је Христово, божанско, богочовечанско. Стога је Христова слобода једина истинска слобода коју биће људско може имати у овоме свету. Све такозване слободе су назовислободе, ако нису слободе од греха. Јер грех неизоставно поробљује човека смрти и ђаволу. А зар то ропство није ропство најгоре врсте, јер је свемрачно, свеужасно, вечно, и тиме сверопство? Робовање греху, уствари је једино истински страшно и убитачно ропство. А слобода од греха, уствари је једина истински стварна, свеспасоносна и сверадосна слобода, јер је никаква смрт не може заробити. Једино је слобода Христова јача од смрти, док су све остале слободе беспомоћно робље смрти. И једино је слобода Христова јача од ђавола, док су све остале слободе посредне или непосредне робиње ђавола.
        cn: 在基督里的自由？这是摆脱罪恶、死亡、魔鬼的自由，活在永恒真理、永恒公义、永恒之爱中，活在一切属于基督、属于神性、属于神人两性的事物中。因此，基督的自由是人类个体能在此世拥有的唯一真正的自由。所有所谓的自由，如果不是摆脱罪恶的自由，就都是假自由。因为罪必然将人奴役于死亡和魔鬼。难道这种奴役不是最坏的奴役吗？因为它是全然黑暗的、全然可怖的、永恒的，从而也是全然的奴役？奴役于罪，实际上是唯一真正可怕和致命的奴役。而摆脱罪恶的自由，实际上是唯一真正真实、全然救赎、全然喜乐的自由，因为没有任何死亡能将它奴役。唯有基督的自由比死亡更强大，而所有其他的自由都是死亡无助的奴隶。并且，唯有基督的自由比魔鬼更强大，而所有其他的自由都是魔鬼或直接或间接的奴隶。
    - type: paragraph
      text:
        ru: Зато до Господа Христа у овом нашем земаљском свету није било истинске слободе. Тек Он, Једини Безгрешни, одробио је род људски од греха; тек Он, Једини Бесмртни, одробио је род људски од смрти; тек Он, Једини Истинити Бог, одробио је род људски од ђавола. Слобода од греха, слобода од смрти, слобода од ђавола, то је троједна слобода, једина истинска слобода у свима људским световима. Сав богочовечански подвиг Спаситељев састојао се у том ослобођењу, и у даровању роду људском те слободе. Тај јединствени подвиг ослобођења рода људског од свеубитачног ропства Једини Човекољубац је извршио васцелом Личношћу Својом и целокупним животом Својим, у коме врхуни крст са васкрсењем. Окусивши Безгрешног Господа – грех се распаде; окусивши безгрешно тело Спасово – смрт се умртви;[11]окусивши безгрешног Богочовека – свегрешни ђаво се разболе на смрт, и сав се осмрти и усмрти.
        cn: '然而，直到主基督降临，在我们这尘世间，并没有真正的自由。唯独祂，那独一无罪者，将人类从罪恶中解脱出来；唯独祂，那独一不朽者，将人类从死亡中解脱出来；唯独祂，那独一真神，将人类从魔鬼中解脱出来。


          脱离罪恶的自由，脱离死亡的自由，脱离魔鬼的自由，这三重合一的自由，是人类所有世界中唯一真正的自由。救主的全部神人功绩就在于这项解放，以及将这份自由恩赐予人类。


          这项独一无二的功绩，即将人类从那致死的奴役中解放出来，是那独一爱人者以祂完整的位格和祂全部的生命来完成的，其中以十字架与复活为最高峰。


          尝过那无罪的主——罪恶就瓦解了；尝过救主无罪的身体——死亡就被致死；[11]尝过那无罪的神人——那全然有罪的魔鬼就病入膏肓，以至死亡，并且完全地走向死亡，并且死去了。'
    - type: paragraph
      text:
        ru: 'Безгрешни Ослободитељ једини има моћи и власти ослободити од греха свакога човека. А сваки је човек роб греха, јер нема човека без греха. Безгрешна уста Спасова објавила су: Сваки који чини грех роб је греха (Ин.8:34). Од тог ропства ослобађа само онај који је јачи од греха; а јачи је од греха само онај који је јачи од смрти, која је плод греха; а јачи је од смрти само онај који је јачи од ђавола, који је творац и отац и греха и смрти. Све пак то у васцелом роду људском јесте само и једино Безгрешни Господ Христос: Одробитељ, Откупитељ, Ослободитељ рода људског од греха, смрти и ђавола. Зато Он и изјављује, да Он једини даје истинску слободу људима: Ако вас Син ослободи, заиста ћете бити ослобођени – ὄντως ἐλεύθεροι ἔσεσθε (Ин.8:36). Он ослобађа Својом истином, Својом љубављу, Својим крстом, Својом смрћу, Својим васкрсењем, свим богочовечанским силама Својим, које се лију из Његове Богочовечанске Личности кроз свету Цркву Његову, која је тело Његово.'
        cn: 唯有无罪的救主拥有权能和权柄，使每个人脱离罪。而每个人都是罪的奴仆，因为没有无罪的人。救主无罪的口曾宣告说：「所有犯罪的，就是罪的奴仆。」（约翰福音 8:34）唯有比罪更强者才能从这奴役中解救出来；而唯有比死亡更强者才比罪更强，死亡是罪的果实；而唯有比魔鬼更强者才比死亡更强，魔鬼是罪和死亡的创始者和父。而在整个人类中，这一切唯有且仅仅是无罪的主基督：祂是使人类从罪、死亡和魔鬼中脱离奴役者、救赎者、以及救主。因此祂也声明，唯有祂赐予人类真正的自由：「所以天父的儿子若叫你们自由，你们就真自由了」 – ὄντως ἐλεύθεροι ἔσεσθε（约翰福音 8:36）。祂藉着祂的真理、祂的爱、祂的十字架、祂的死亡、祂的复活、以及祂所有的神人性的能力来施行解救，这些能力从祂的神人位格中，借着祂的圣教会（祂的身体）流淌而出。
    - type: paragraph
      text:
        ru: 'Слобода у Христу ослобађа човека од робовања распадљивости, трулежности, смртности (Рим.8:21), ослобађајући га богочовечанским силама Христовим од свега смртног, греховног, трулежног, осмрћеног, усмрћујућег. У Христу Исусу човек се ослобађа «духа ропства» – πνεῦμα δουλείας (Рим.8:15), који је дух греха, дух смрти, дух ђавола. Над таквим човеком нема више власти ни грех, ни смрт, ни ђаво (ср. Ерв.2:14–15). Благодаћу сједињени са Господом Христом, ми више не робујемо греху (ср.Рим. 6:6). Ослобођени Господом, ми Духом Његовим живимо у истинској слободи помоћу богочовечанске истине, љубави и правде, јер где је Дух Свети – онде је слобода (ср.2Кор.3:17). Али наша слобода у Христу увек зависи од нашег добровољног живљења у њој и служења њој. Ми стојимо у Христовој слободи, када стојимо у Христовој истини и правди и љубави, и у свему Христовом; и ми живимо у њој, када живимо у ономе што је Христово. Али та наша слобода је у опасности једино од нас самих: јер окренемо ли се греху, и почнемо ли служити њему, онда губимо ту слободу и поново падамо у ропство греху; а њиме – у ропство смрти; а кроз ропство греху и смрти – у ропство ђаволу. Зато: «Стојте чврсто у слободи, и не дајте се опет у јарам ропства ухватити». А у Христовој слободи се чврсто стоји, када се чврсто стоји у Његовој вери, у Његовој истини, у Његовој правди, у Његовој љубави, у Његовом животу, у Његовом Еванђељу, у Његовој благодати, речју: када се свим срцем, свом душом, свим умом, свом снагом живи у његовој светој Цркви њеним светим тајнама и светим врлинама. Међутим вас хоће поново у јарам ропства да ухвате лажни учитељи који вам нуде повратак на старозаветни Закон као на средство спасења од греха, од смрти, од ђавола. Тиме они посредно одбацују Господа Христа који нам је Својом свеспасавајућом благодаћу даровао слободу од робовања слову и закону. Јер где је Спаситељ, ту је и спасење; где Њега нема, нема ни спасења. Хоћете ли да спасење своје пренесете на обрезање, и да у обрезању тражите спасење, – изгубисте Спаситеља, а са Њим и спасење.'
        cn: '在基督里的自由，使人从朽坏、败坏、死亡的奴役中获得自由（罗马书 8:21），借着基督神而人性的能力，将他从一切必死的、有罪的、腐朽的、已然死亡的、致死的事物中释放出来。在基督耶稣里，人得以摆脱「为奴的灵」（πνεῦμα δουλείας）（罗马书 8:15），这灵就是罪的灵、死亡的灵、魔鬼的灵。在这样的人身上，罪、死亡、魔鬼都再没有权势了（参 希伯来书 2:14-15）。因恩典与主基督联合，我们便不再作罪的奴仆了（参 罗马书 6:6）。蒙主释放的我们，借着祂的灵，靠着神而人性的真理、爱与公义活在真正的自由中，因为主的灵在哪里，哪里就有自由（参 哥林多后书 3:17）。


          然而，我们在基督里的自由，始终取决于我们是否甘心乐意地活在这自由中并事奉这自由。当我们站立在基督的真理、公义、爱以及基督的一切之中时，我们便站立在基督的自由中；当我们活在基督的一切之中时，我们也就活在祂的自由中。但我们这自由的唯一危险来自我们自己：因为如果我们转向罪，并开始服事罪，那么我们便失去那自由，并再次沦为罪的奴仆；并且通过罪——沦为死亡的奴仆；又通过罪和死亡的奴役——沦为魔鬼的奴仆。因此：「你们要站立得稳，不要再被奴役的轭挟制。」而要在基督的自由中站立得稳，就要坚定地站立在祂的信仰中，祂的真理中，祂的公义中，祂的爱中，祂的生命中，祂的福音中，祂的恩典中；简言之：就是当人全心、全魂、全意、全力地活在祂的圣教会中，活在教会的神圣奥秘和神圣美德之中。


          然而，有些假教师想要再次用奴役的轭来挟制你们，他们向你们提议，回到旧约律法，以此作为脱离罪、脱离死亡、脱离魔鬼的救赎手段。借此，他们间接地拒绝了主基督，主基督以祂那普世救赎的恩典，将我们从文字和律法的奴役中解放出来。因为救主在哪里，救赎就在哪里；祂若不在，就没有救赎。如果你们想把自己的救赎寄托于割礼，并在割礼中寻求救赎，——你们就失去了救主，也与祂一同失去了救赎。'
    - type: paragraph
      text:
        ru: '5:2'
        cn: '5:2'
    - type: paragraph
      text:
        ru: Ево ја Павле кажем вам да ако се обрежете, Христос вам ништа неће помоћи. Јер Он помаже онима, и спасава оне који верују да је Он – Једини Спаситељ рода људског под небом и да нема другог који може спасти човека од греха, смрти и ђавола. Чим те вере немате, немате ни спасења. Ко год сматра да спасење Христом треба допунити и употпунити обрезањем или старозаветним Законом, тај је већ пао у ропство греха, у проклетство исконско. Јер само вера у Христа ослобађа од проклетства старозаветног и свеопштег, под којим је род људски био док нас Господ Христос није ослободио својим крсним подвигом и васкрсењем. Ово вам кажем ја Павле, који сам пре вас био највећи ревнитељ и бранитељ Закона, и осетио сву његову неспасоносност и беспомоћност, и вером примио Господа Христа – јединог Спаситеља и једино спасење.
        cn: 我保罗现在告诉你们，如果你们受割礼，基督对你们将毫无益处。因为祂帮助并拯救那些相信祂是天下人类唯一救主的人，并且再没有别的能够将人从罪、死亡和魔鬼中拯救出来。只要你们没有那样的信心，你们就没有救恩。凡是认为基督所赐的救恩需要借着割礼或旧约律法来补充和完善的，他就已经堕入罪的奴役之中，堕入那原始的咒诅之中。因为唯独信靠基督才能使人脱离旧约和普世性的咒诅，人类曾处于其下，直到主基督借着祂的十字架受难和复活将我们解放。我保罗对你们说这些，我在你们以前曾是律法最大的热心者和捍卫者，并且感受到了它完全的无济于事和无助，并借着信心领受了主基督——唯一的救主和唯一的救恩。
    - type: paragraph
      text:
        ru: '5:3'
        cn: '5:3'
    - type: paragraph
      text:
        ru: Обрезање је саставни део старозаветног Закона. Признате ли обрезање као неопходно средство спасења, ви сте се тиме већ дали у ропство васцелом Закону старозаветном. Јер ако је обрезање обавезно и неопходно, самим тим постаје обавезан и неопходан сав Закон, и ви сте дужни сав Закон творити. А знате да нико није могао испунити сав Закон, зато је сваки био под проклетством, сваки у неподношљивом јарму греха, смрти и ђавола. Тако и ви постајете поново робови греха, смрти и ђавола. У Закону је све међусобно повезано. Вратите ли се на обрезање, морате се вратити и на жртвоприношење и на све многобројне прописе старозаветног Закона. А тада, шта остаје од ваше вере у Христа? и имате ли је? О, не варајте се!
        cn: 割礼是旧约律法的构成部分。如果你们承认割礼是得救的必要手段，你们就此已将自己置于整个旧约律法的奴役之下。因为如果割礼是强制性的和必要的，那么整个律法就因此变得强制性和必要，并且你们有义务遵行整个律法。你们却知道没有人能完全遵守所有律法，因此每个人都在咒诅之下，每个人都在罪、死亡和魔鬼那无法承受的轭下。这样，你们也再次成为罪、死亡和魔鬼的奴隶。在律法中，一切都是相互关联的。如果你们回到割礼，你们也必须回到献祭，以及旧约律法中所有众多的规条。那么那时，你们对基督的信心还剩下什么呢？你们还有信心吗？哦，不要自欺！
    - type: paragraph
      text:
        ru: '5:4'
        cn: '5:4'
    - type: paragraph
      text:
        ru: 'Изгубисте Христа ви који хоћете Законом да се оправдате, и отпадосте од благодати. Изгубисте Христа зато што хоћете да Га Законом замените, и да се Законом оправдате. Христос и Закон? Закон је само један једини зрак Сунца – Христа. За оправдање ваше, и уопште за оправдање човека, рода људског, потребан је сав Богочовек Христос, са целокупном Својом Богочовечанском Личношћу, животом, подвигом, са свим оним што се назива благодат, јер је пад човеков неизмеран, а неизмерна и сила греха и сила смрти и сила ђавола. А ви хоћете да се оправдате Законом? И то после толиких сведочанстава и старих и нових, старих у Старом Завету, и нових – међу данашњим незнабошцима, и садашњим Јеврејима који упорно остају при своме Закону, сведочанстава која необориво потврђују да нема оправдања ни у јеврејском Закону ни у незнабожачком ванзакоњу, већ једино у вери Исуса Христа Спаситеља и Бога. Желећи да Господа Христа и Његов богочовечански подвиг спасења ма чим или ма ким допуните или исправите, – «отпадосте од благодати», тојест од свега онога што је Христос и што је Христово. Јер благодат и јесте сам Господ Христос са свима Својим божанским дарима и силама. Отпавши пак од благодати, отпали сте од једине свесиле која може човека, људе, род људски спасти од греха, смрти и ђавола. А тиме сте отпали од свих оних божанских сила Христових, које кроз свете тајне и свете врлине оплођују у души човековој божанску правду и праведност, које му дају оправдање пред Богом. Не мислите да је спасење и оправдање мала ствар, мали, једноставан подвиг. Не, за спасење, за оправдање потребно је учешће и делање васцеле Пресвете Тројице Божанске: царство Оца и Сина и Светога Духа. Само тако престаје и нестаје у вама царство црне тројице: греха, смрти и ђавола.'
        cn: '你们这些想靠律法称义的人，失去了基督，并且从恩典中坠落了。你们失去了基督，因为你们想用律法取代祂，并且靠律法称义。


          基督与律法？律法只是太阳——基督——的唯一一道光芒。为了你们的称义，以及普遍而言，为了人类、人类的称义，需要完整的神人基督，带着祂完整的神人位格、生命、功绩，带着所有被称为恩典的一切；因为人类的堕落是无法估量的，罪恶的力量、死亡的力量和魔鬼的力量也同样无法估量。而你们却想靠律法称义？


          竟然在如此多的古老和新兴的见证之后，古老的在旧约中，新兴的在今天的异教徒和现今坚持自己律法的犹太人之中——这些见证无可辩驳地证实了称义既不在犹太律法中，也不在异教徒的无法无天中，而只在对救主和上帝耶稣基督的信心之中。你们想要用任何事物或任何人来补充或纠正主基督和祂神人救赎的功绩，——「你们从恩典中坠落了」，也就是说，从一切属于基督和基督的一切中坠落了。因为恩典就是主基督本身，连同祂所有的神圣恩赐和能力。然而，从恩典中坠落，你们就从唯一能将人、众人、人类从罪、死亡和魔鬼中拯救出来的全能中坠落了。这样，你们就从基督所有那些神圣的能力中坠落了，那些能力通过圣事和圣德在人的灵魂中结出神圣的公义和正直，给予他在上帝面前的称义。


          不要以为救赎和称义是件小事，一项微小、简单的功绩。不，为了救赎，为了称义，需要完整至圣神圣三位一体的参与和行动：圣父、圣子和圣灵的国度。唯有如此，在你们里面，黑暗三位一体的国度才会停止并消失：罪、死亡和魔鬼。'
    - type: paragraph
      text:
        ru: '5:5'
        cn: '5:5'
    - type: paragraph
      text:
        ru: 'Зато ми Духом Светим чекамо од вере у Христа не од Закона ону свету силу која ће у нама породити и усавршити праведност. Само та вера даје нам наду у ту праведност, која се никаквим законом не може ни прописати ни остварити. Вама је неопходно да дух свој благодаћу сједините са Духом Божјим, Духом Светим. Једино тако дух човечији може наћи свој пут из греха у спасење, из смрти у бесмртност, из времена у једину блажену вечност. Од Духа Светог је вером у Господа Христа светост и освећење наше, правда и праведност наша, и истина наша, и молитва, и смиреност, и љубав, и кротост, и пост, и све свете врлине еванђелске и све свете тајне. Зато је духу нашем Он потребнији од нас самих. Јер, шта је дух наш без Духа Светога кога нам даје вера у Христа Господа? Ништа друго до страшилно привиђење и језиво неко сновиђење. Све је мука духу човечијем, све, а пре свега он је сам себи неуспављива мука. Без Духа Светога нема духу човечијем излаза из самоубиствене муке и очајања: он се стално дави из муке у муку, и никако да се удави; он стално понире из смрти у смрт, и никако да умре; он стално тражи себе, и никако да нађе себе; стално бежи од себе, и никако да побегне; стално иште сан којим да успава себе, и никако да пронађе. Мука на муку, смрт на смрт, немоћ на немоћ, очај на очај, бесмислица на бесмислицу, ужас на ужас, пакао на пакао, – ето то је дух човечији без Духа Божија. Једино се Духом Светим он развија из силе у силу, из знања у знање, из мудрости у мудрост, из савршенства у савршенство, из вечности у вечност, из благовести у благовест, из радости у радост.'
        cn: 因此，我们不凭律法，而凭着对基督的信仰，借着圣灵等候那将在我们里面生出并成全公义的圣洁力量。唯有那信仰赐予我们对那公义的盼望，而那公义是任何律法都无法规定也无法实现的。你们必须借着恩典，使你们的灵与上帝的灵，即圣灵联合。唯有如此，人的灵才能找到从罪进入救恩、从死亡进入不朽、从时间进入那唯一蒙福的永恒的道路。借着对主基督的信仰，我们的圣洁与成圣、正义与公义、真理、祷告、谦卑、爱、温柔、禁食以及一切福音的圣德和一切圣事，都源于圣灵。因此，我们的灵对祂的需要甚至超过我们自己。因为，我们的灵若没有圣灵（这圣灵是藉着对主基督的信仰赐予我们的），那会是什么呢？不过是一个可怕的幻象和某种令人毛骨悚然的梦境。一切都是人的灵的痛苦，一切都是；而最重要的是，他自己就是自己无法平息的痛苦。没有圣灵，人的灵就没有出路，无法摆脱那自我毁灭的痛苦和绝望：他不断地从一种痛苦溺入另一种痛苦，却永远无法被溺死；他不断地从一种死亡沉沦入另一种死亡，却永远无法真正死去；他不断地寻找自己，却永远无法找到自己；他不断地逃离自己，却永远无法逃脱；他不断地寻求能让自己入睡的睡眠，却永远无法找到。痛苦叠加痛苦，死亡叠加死亡，无力叠加无力，绝望叠加绝望，荒谬叠加荒谬，恐惧叠加恐惧，地狱叠加地狱——这就是没有上帝之灵的人的灵。唯有借着圣灵，他才能从力量进入力量，从知识进入知识，从智慧进入智慧，从完美进入完美，从永恒进入永恒，从福音进入福音，从喜乐进入喜乐。
    - type: paragraph
      text:
        ru: '5:6'
        cn: '5:6'
    - type: paragraph
      text:
        ru: 'Зато у Христу Исусу нити што вреди обрезање ни необрезање, него вера која кроз љубав дёла. Не заборавите никада: Христос је све и сва, и оно што је од Њега. Он је једини истинити Бог и Спаситељ, вера нас предаје Њему, и Он нам због вере у Њега даје и Своју божанску љубав и Своју божанску правду и све своје божанске силе, које заједнички образују у нама нови, еванђелски, богочовечански, благодатни живот, који свим струјама отиче у живот вечни. У Њему су, и од Њега су све свете врлине богочовечанске: и вера, и љубав, и нада, и молитва, и кротост, и смерност, и трпљење, и остале редом. И зато што се кроз нашу веру у Њега изливају непосредно благодаћу из Њега у нас, ове свете врлине су у нама и бескрајне и бесмртне и божанске. Шта ради наша вера у Њега? Она кроз љубав дёла. А наша љубав? Она кроз молитву дёла, и расте, и множи се. А молитва? Она кроз пост расте и успева. И тако свака врлина дёла кроз све остале врлине, и расте кроз њих, и усавршава се помоћу њих, и доноси родове преко њих. Свака је у свима, и све у свакој. Јер су све од Једнога, и воде ка Једноме. Чим се нека откине од осталих, она изумире, и умре: откине ли се вера од љубави, она изумре; откине ли се љубав од молитве, она изумре; откине ли се молитва од поста, она изумре; и тако редом: свака без осталих – осуђена је на смрт. А свака са осталима – увек је сва бесмртна; тако и све са сваком. Како ћеш проверити своју веру је ли спасоносна? Љубављу. А љубав? Молитвом. А молитву? Постом. А пост? Трпљењем. А трпљење? Надом. А наду? Вером. И тако, редом у круг: све се врлине проверавају сваком, и свака свима. Јер све оне сачињавају један недељив круг, један непрекидан ланац, један савршен прстен. Свака се врлина проверава осталим врлинама: свака – сваком, и још: свака – свима. Али и обрнуто: све се проверавају сваком, јер све сачињавају једно тело духовно. Као што круг нема краја, тако и врлине немају краја, нити икоја врлина има краја, јер свака и извире и увире у све остале, утапа се и претапа се у њих.'
        cn: '然而，在基督耶稣里，割礼或未受割礼都毫无价值，唯有那藉着爱而行动的信心。永不忘记：基督是一切的一切，以及一切源于祂的。祂是独一的真神和救主，信心将我们交托给祂，祂也因我们对祂的信心而赐予我们祂神圣的爱、祂神圣的公义，以及祂所有的神圣能力。这些共同在我们里面形成了一种新的、福音的、神人一体的、恩典的生命，这生命以其所有的涌流汇入永生。在祂里面，也源于祂的是一切神人一体的神圣美德：信心、爱、盼望、祷告、温柔、谦卑、忍耐，以及其余所有。正因为这些美德藉着我们对祂的信心，直接从祂那里以恩典的形式倾泻到我们里面，所以这些神圣美德在我们里面既是无限的，也是不朽的，更是神圣的。


          我们对祂的信心是做什么的呢？它藉着爱而行动。那么我们的爱呢？它藉着祷告而行动，并且增长、增多。那么祷告呢？它藉着禁食而成长、兴盛。因此，每一种美德都藉着所有其他美德而行动，藉着它们而成长，藉着它们而得以完全，并藉着它们而结出果实。每一个都在所有之中，所有也都在每一个之中。因为所有美德都源于那一位，并引向那一位。一旦其中任何一个美德与其他美德脱离，它就会枯萎，继而死去：信心若与爱脱离，便会枯萎；爱若与祷告脱离，便会枯萎；祷告若与禁食脱离，便会枯萎；以此类推：任何一个美德若没有其他美德，就注定死亡。然而，每一个美德若与其他美德同在，便永远是不朽的；所有美德与每一个美德同在亦然。


          你如何检验你的信心是否具有拯救性？藉着爱。那么爱呢？藉着祷告。那么祷告呢？藉着禁食。那么禁食呢？藉着忍耐。那么忍耐呢？藉着盼望。那么盼望呢？藉着信心。因此，如此循环往复：所有美德都藉着每一个美德得以检验，每一个美德也藉着所有美德得以检验。因为所有美德共同构成一个不可分割的圆，一个不间断的链条，一个完美的环。每一个美德都藉着其他美德得以检验：每一个都藉着另一个来检验，并且：每一个都藉着所有美德来检验。但反之亦然：所有美德都藉着每一个美德得以检验，因为所有美德共同构成一个属灵的身体。正如圆没有尽头，美德也没有尽头，也没有任何一个美德有尽头，因为每一个美德都从所有其他美德中流出，也流回到它们之中，沉浸并融入其中。'
    - type: paragraph
      text:
        ru: '5:7'
        cn: '5:7'
    - type: paragraph
      text:
        ru: 'Отуда свака од њих носи у себи сву истину еванђелску, јер је све скупа носе васцелу. Наше је душе живот: стално кружити кроз све свете врлине, хранећи се помоћу њих Вечном Истином, која је Христос Господ – Једини истинити Бог свих светова (ср.Ин.14:6, 1:17). У том нашем непрекидном кружењу светим врлинама кроз свету истину Христову, шта нас омета, шта спречава? Наше гордоумље и самоумље, које каткад, по дејству ђавола, хоће да замени наше христоумље и смиреноумље. Пример? Ето ви, ваше самочино и самоглаво освртање на Закон и жеља да прибегнете Закону, напуштајући Христа и свеспасоносну веру у Њега. Досад добро трчасте путевима вечнога живота које вам пропућују свете еванђелске врлине и тајне; и у свесмерном христоумљу свом ви се радосно покоравасте спасоносној Истини – Свеистини Христовој. Али лажни учитељи већ су заратили против вашег смиреног христоумља и почињу вас спречавати да се покоравате јединој спасоносној Истини – Победитељки, јединој Победитељки троједне лажи: греха, смрти и ђавола.'
        cn: 因此，它们每一个都在自身中承载着整全的福音真理，因为它们共同承载着这整全的真理。我们灵魂的生命，在于持续地循环于所有神圣的美德之中，借着它们滋养自己，以那永恒的真理，这真理就是基督主——万有的独一真神（参 约翰福音 14:6，1:17）。在我们借着基督的神圣真理，不间断地循环于神圣美德之中时，是什么阻碍我们，是什么妨碍我们呢？是我们的骄傲自大和自以为是，这有时在魔鬼的作用下，想要取代我们的基督心智和谦卑心智。例子？瞧你们，你们自行其是和自作主张地回溯律法，并渴望投靠律法，离弃了基督和对祂的普世救赎信仰。迄今为止，你们在由神圣的福音美德和奥秘为你们开辟的永生之路上跑得很好；并且在你们全然顺服的基督心智中，你们曾欣然顺服那救赎性的真理——即基督的全然真理。但是，假教师们已经向你们谦卑的基督心智宣战，并开始阻止你们顺服那唯一的救赎性真理——那得胜者，那唯一得胜三位一体之谎言（即罪恶、死亡和魔鬼）的得胜者。
    - type: paragraph
      text:
        ru: '5:8'
        cn: '5:8'
    - type: paragraph
      text:
        ru: То одвраћање од Истине, одвраћање је од самог Господа Истине – Христа Богочовека, који вас Еванђељем Својим позива спасењу, и даје вам спасење, и осигурава вам спасење, које вам не може дати, ни давши осигурати, никакав Закон. Позивајући вас спасењу, Господ и Спас наш позива вас кроз спасење животу, вечном животу у Вечној Истини, у Вечној Правди, у Вечној Љубави, у Вечној Радости, у Вечном Блаженству. А све што није од Господа и Спаса, не води ни спасењу ни вечном животу. Стога је и опасно по вас, па макар било мало, и најмање.
        cn: 这种偏离真理，便是偏离真理的主宰本身——即神人基督。他用祂的福音召唤你们得救，并赐予你们救恩，并确保你们得救，这是任何律法都不能赐予你们，也不能在赐予之后确保你们得救的。我们的主和救主在召唤你们得救时，通过救恩召唤你们进入生命，这生命就是永生，在永恒的真理、永恒的公义、永恒的爱、永恒的喜乐、永恒的福乐之中。而凡不属于主和救主的事物，既不导向救恩，也不导向永生。因此，这对你们来说是危险的，哪怕只有一点点，哪怕是最小的一点。
    - type: paragraph
      text:
        ru: '5:9'
        cn: '5:9'
    - type: paragraph
      text:
        ru: 'Пазите, мало квасца укисели све тесто. Обрезање, то је мали квасац. Али у тесту душе ваше, мисли ваших, он може брзо нарасти и ускиснути све биће ваше жељом да се кроз обрезање вратите на сав Закон, на све његове прописе. А то значи: да се вратите на неспасење, не беспомоћно робовање греху, смрти и ђаволу. Лажно учење је као мали квасац, који својом лажју може затровати сву вашу душу, сав ваш ум, и ви ћете бити неспособни да останете унутар Истине, већ ћете испасти из ње, и отпасти од ње, као што је испао из ње и отпао од ње Лажа, и отац лажи – ђаво (ср.Ин.8:44). Ниједна лаж није мала, јер је и најмања лаж својом најунутрашњијом невидљивом артеријом везана за само срце оца лажи – ђавола, и води, вуче ка њему. Тако и лаж лажних учитеља да је обрезање неопходно за ваше спасење, и за спасење уопште. Пазите се, не дајте се преварити: ви знате сву истину о спасењу. А она је? – Христос Господ јесте Једини Спаситељ, и спасење је једино у Њему. То је темељ, то основ на коме стоји сва зграда вере наше, спасења нашег, вечности наше.'
        cn: 你们要谨慎，一点面酵能使全团发起来。割礼，就是那一点面酵。但在你们灵魂的面团里，在你们思想的面团里，它能迅速膨胀，并以通过割礼回归全部律法、回归其所有规条的欲望，使你们的整个生命发酵。而那意味着：回归不救赎，回归对罪、死亡和魔鬼的无助奴役。虚假教义就像一点面酵，它能以其虚假毒害你们的整个灵魂，你们的整个心思，而你们将无法留在真理之内，反而会从真理中坠落，并从真理中背弃，如同说谎者，以及说谎者的父——魔鬼（参约翰福音 8:44）从真理中坠落并从真理中背弃一般。没有一个谎言是小的，因为即便是最小的谎言，也以其最内在的、无形的动脉与说谎之父——魔鬼的心脏本身相连，并引向、牵向他。虚假教师的谎言也是如此，即割礼对你们的救赎以及普遍的救赎是必需的。你们要当心，不要被欺骗：你们知道关于救赎的一切真理。而那真理是什么呢？——基督主是唯一的救主，而救赎唯独在他里面。那是根基，那是基础，我们信仰的整座大厦、我们救赎的整座大厦、我们永恒的整座大厦都立于其上。
    - type: paragraph
      text:
        ru: '5:10'
        cn: '5:10'
    - type: paragraph
      text:
        ru: Ја се уздам у вас, док сте у Господу, да нећете друкчије мислити. Ако сте у Господу, онда – вером мислите, љубављу мислите, молитвом мислите, и мисли ваше неће одлутати у заблуду, неће отпасти и испасти из Господа; оне ће се у Њему увек рађати и усавршавати и бесмртовати, да им никаква смрт, која би им приступила кроз какво лажно учење, неће наудити. А ко вас у томе омета и смућује, понеће осуду, ма ко био. Ви сте хришћани, зато свака ваша мисао нека се молитвом и вером преобрази у христомисао, и свако ваше осећање – у христоосећање. Тако ћете од душе своје начинити тврђаву, коју никакво лажно учење неће моћи освојити. И ви ћете бити сигурни у бесмртности својој и у истини својој, јер сте опкољени вечношћу коју вам нико отети не може.
        cn: 我信赖你们，只要你们在主内，就不会作他想。倘若你们在主内，那么——你们要凭着信心思想，凭着爱心思想，凭着祷告思想，你们的思想就不会偏离，陷入谬误，就不会从主内坠落和失丧；它们将在祂里面永远诞生、完善并得以不朽，以至于任何死亡，即使借着某种虚假教义临近它们，也无法伤害它们。凡是在这事上阻碍和扰乱你们的，无论他是谁，都将承受审判。你们是基督徒，因此，你们的每个思想都当借着祷告和信心，转化成基督思想，你们的每个感受——转化成基督感受。这样，你们将把自己的灵魂变成一座坚固的堡垒，任何虚假教义都无法攻占它。你们将在自己的不朽和真理中得以安稳，因为你们被永恒所环绕，这永恒是无人能从你们手中夺走的。
    - type: paragraph
      text:
        ru: '5:11'
        cn: '5:11'
    - type: paragraph
      text:
        ru: 'Знам шта Сатана мисли: мисли увек оно што је антихристовско. По томе га и ви можете увек познати и распознати. Његова је лаж најчешће маскирана истином. Али ви сте зато да је проверите, и то са сигурношћу проверите. Како? чиме? – Крстом. Све што не може одстојати крст Христов, и силу крста Христова – од Сатане је. Све што не воли крст Христов, од ђавола је. Све што је против крста Христова – од ђавола је по стопут. Зашто? Зато што је крст Христов и знак и средство и сила, једини знак, једино средство, једина сила победе над грехом, смрћу и ђаволом. Да, и ђаволом! У свету човечанском нема другог начина, ни средства, ни силе, којим људи могу победити ђавола, и његове претече: грех и смрт. Ко је противу Господа Христа, увек је најпре против Његовог крста. Зато је крст Христов – саблазан за Јевреје и безумље за Јелине, незнабошце (ср.1Кор.1:23). И кад вам лажни учитељи долазе, проверите њихово учење крстом, и силом крста. Када бејах у јеврејству, ја као ревнитељ Закона гоних крст Христов, и бејах за обрезање, и за све што иза њега следи. Сада сам сав за крст Христов, који је на спасење свима који верују, били они Јевреји или Јелини (ср.1Кор.1:18–24). Како онда можете веровати лажним учитељима који вам чак и то говоре, да ја још проповедам обрезање као средство спасења. Ако је то тачно, зашто ме онда Јевреји гоне? Нема сумње, они ме гоне зато што сам сав за крст Христов, а против обрезања. Јер у крсту Христовом је све и сва што је неопходно за спасење човека, сваког човека, био он Јеврејин или незнабожац. Да, јер је у крсту и на крсту сав Господ и Спаситељ мој: Исус Христос. До Спаситељевог распећа крст је био знак срама и стида и покварености: јер су на крст распињани најгори злочинци. Откако је свесвети и безгрешни Господ распет на њему, крст је добио све божанске силе од Господа свесветог и безгрешног, и зато постао знак славе и светлости и спасења. Најсрамнијем оруђу Господ свемоћни и свебожанствени даровао је најславнију силу, свесилу спасења – од греха, смрти и ђавола; свесилу која побеђује сваки грех и све грехе, сваку смрт и све смрти, сваког ђавола и све ђаволе. Таква је сила свемилостивог Спаситеља и Господа нашег Исуса Христа. Против ње је сав ђаво и сви ђаволи, сав грех и сви греси, сва смрт и све смрти, и њихово добровољно или невољно робље – крстоборни људи.'
        cn: '我知道撒但的想法：他总是想着敌基督的事。你们也总能由此认识并辨别他。他的谎言最常被真理伪装。但你们的存在是为了验证它，并且要确凿地验证它。如何？靠什么？——靠十字架。


          凡是不能抵挡基督的十字架和基督十字架能力的一切，都来自撒但。凡是凡是不爱基督的十字架的一切，都来自魔鬼。凡是反对基督十字架的一切，百倍地来自魔鬼。为什么？因为基督的十字架既是标记，又是方法，又是能力，是唯一战胜罪恶、死亡和魔鬼的标记、唯一的方法、唯一的能力。是的，还有魔鬼！在人类世界中，没有别的方式、别的手段、别的能力，能让人类战胜魔鬼及其先驱：罪恶与死亡。凡是反对主基督的，总是首先反对祂的十字架。因此，基督的十字架——是犹太人的绊脚石，是希腊人、外邦人的愚拙（参 哥林多前书 1:23）。并且，当假教师来到你们中间时，要用十字架和十字架的能力来检验他们的教导。当我处于犹太教中时，我作为一个律法的热心者，曾逼迫基督的十字架，并支持割礼以及随之而来的一切。现在我全然支持基督的十字架，这十字架是为所有相信之人带来救恩的，无论他们是犹太人还是希腊人（参 哥林多前书 1:18-24）。那么你们怎能相信那些假教师呢？他们甚至告诉你们，我仍在宣讲割礼是得救的手段。如果这是真的，那犹太人为何要逼迫我呢？毫无疑问，他们逼迫我是因为我全然支持基督的十字架，并反对割礼。因为在基督的十字架上，有一切人——每个人的救恩所需的一切，无论他是犹太人还是外邦人。是的，因为在十字架里，在十字架上，有我的全然的主和救主：耶稣基督。


          在救主被钉十字架之前，十字架是羞耻、耻辱和败坏的标记：因为最邪恶的罪犯都被钉在十字架上。自从至圣无罪的主被钉在上面，十字架就从至圣无罪的主那里获得了所有神圣的能力，因此成了荣耀、光明和救恩的标记。主将最荣耀的能力、救恩的全能——脱离罪恶、死亡和魔鬼的能力——赐予了这最羞耻的工具；这全能战胜每一个罪和所有罪，战胜每一种死亡和所有死亡，战胜每一个魔鬼和所有魔鬼。这就是我们全然仁慈的救主和主耶稣基督的能力。与祂为敌的是所有的魔鬼和所有魔鬼，所有的罪和所有罪恶，所有的死亡和所有死亡，以及他们自愿或不自愿的奴隶——那些与十字架为敌的人。'
    - type: paragraph
      text:
        ru: '5:12'
        cn: '5:12'
    - type: paragraph
      text:
        ru: 'Сваки који покуша да умањи силу и славу крста Господњег – противник је вечне истине Божје и вашег спасења; сваки који вас буни и одваја од крста Спасова – противник је ваше душе упоредо с ђаволом; сваки вас квари који ма чим и ма ким хоће да умањи или укине значај светог крста Господњег. О, да би сви такви отсечени били! сви који се саблажњавају о крст Христов, па и вас хоће да поробе тој саблазни. Крсту Христовом није потребно ни обрезање ни необрезање. Крст одбацује и једно и друго. То саблажњава Јевреје; а они хоће сада да и вас саблазне тиме. Али у спасењу, и делу спасења, не помаже не само обрезање него и само ушкопљеништво, евнуштво, па макар било и најдобровољније. А Еванђеље спасења, једино Еванђеље спасења под небом јесте ово, само ово: Распети и Васкрсли Господ и Бог Исус Христос; Њега веровати, Њега љубити, Њиме живети и у овом и у оном свету кроза све векове.'
        cn: 每一个试图贬低主的十字架的力量与荣耀的人——都是上帝永恒真理和你们救赎的仇敌；每一个搅扰你们并使你们与救主的十字架分离的人——都是如同魔鬼一般，你们灵魂的仇敌；每一个想用任何事物或任何人来贬低或废除主的圣十字架重要性的人，都是败坏你们的人。哦，愿所有这样的人都被剪除！所有被基督的十字架绊倒，甚至想让你们也沦为那种绊脚石的奴役的人。基督的十字架既不需要割礼也不需要未受割礼。十字架拒绝两者。这使犹太人绊倒；而他们现在想用这个也使你们绊倒。但在救赎中，以及救赎的事工中，不单割礼无益，甚至阉割本身，即太监身份，也无益，即便它是最自愿的。而救赎的福音，天下唯一的救赎福音就是这个，唯独这个：被钉十字架并复活的主和上帝耶稣基督；信靠祂，爱祂，靠祂而活，在今世和来世，永永远远。
    - type: paragraph
      text:
        ru: '5:13'
        cn: '5:13'
    - type: paragraph
      text:
        ru: 'Благовест Христова сва је позив на божанску слободу, која ослобађа од сваког робовања греху, смрти и ђаволу. Божанска слобода Христова увек носи у себи божанску силу која свемоћно и свепобедно ослобађа сваког христољупца од сваког греха, од сваке смрти, од сваког ђавола. У тој слободи се добровољно живи божански светим животом, јер се живи божанском истином, божанском правдом, божанском љубављу. Живљење божанском истином увек свемоћно савлађује и одбацује од вас сваку лаж и заблуду; живљење божанском правдом увек свемоћно савлађује и одбацује од вас сваку неправду; живљење божанском љубављу увек свемоћно савлађује и одбацује од вас и из вас свако самољубље и сваку самоугодничку и грехоугодничку љубав. Божанска слобода Христова се стално и увек доживљује као божанска љубав Христова; јер једна у другој живи, и једна помоћу друге креће се, постоји и бива. Ако ослаби љубав Христова у вама, знајте ослабила је са њом и ваша слобода у Христу. Раслаби ли еванђелску љубав вашу нека себична жеља, она тиме раслабљује и божанску слободу вашу, и на видицима ваше душе појављује се ропство за вас. Јер оно место у вашој души из кога се повуче љубав Христова, неминовно се поробљује нечим греховним, смртоносним, злољубивим. И најмање самољубље, које се зачне у вама, постепено се претвара у дивљег тиранина душе ваше и убија божанску слободу вашу којом вас Христос ослободи. Све што у вама није за Христа, од Христа, по Христу, ка Христу, неизоставно вас вуче у ропство греху, смрти и ђаволу. Проверите све што се креће и миче и збива у вашој души, у вашем срцу, у вашем уму: проверите љубављу Христовом. Оно што је против ње, уствари је против вас самих, против душе ваше, против спасења вашег, против бесмртности ваше. Самољубље ма у ком облику, увек је против вас самих најпре и највише и најсмртоносније; и увек мање шкодљиво за друге неголи за вас саме. И кроз најмање самољубље које се појави у вама, грех вас зове и мами у свој загрљај, у своје ропство. Браните се од њега христољубљем, јер је христољубље једино свепобедно и свемоћно оружје против сваког самољубља. Самољубље хоће да живи по телу, да угађа свима сластољубивим жељама тела, и кроз то да вас пороби смрти и греху, а преко њих ненаситом ђаволу. А ви, ослобођени Христом свакога робовања греху, смрти и ђаволу, употребите све оружје Христово којим вас Он наоружа подаривши вам божанску слободу. Које оружје? Молитву, пост, бдење, љубав, милостивост, трпљење, истину, правду, веру, – ето вам свеоружја Христова, које свемоћно савлађује не само све грехе и сва искушења, него и саме творце сваког греха и сваког искушења: духове зла испод неба, управитеље таме овога света (ср.Еф.6:12–18). А знак, а доказ, а сведочанство да заиста живите у божанској слободи Христовој од греха, смрти и ђавола, и да је не злоупотребљујете за живљење по телу јесте: ваше служење ближњима љубављу еванђелском. Служите ли један другоме из љубави еванђелске, онда ће од вас побећи сваки грех, свака смрт, сваки ђаво; побећи као од неподношљивог огња. Јер је љубав Христова огањ који спаљује сваки грех, сваку смрт, сваког ђавола. Јер је љубав Христова не бамо Христова врлина и особина, већ и сама Христова суштина. Још више: као једини истинити Бог и Господ, Христос је сав љубав. јер – «Бог је љубав» (1Ин.4:16:8). Отуда, ко има ту љубав, има Бога; и ко има Христа Бога, има ту љубав; ко у тој љубави живи, у Богу живи, у Богу бесмртује, у Богу истинује, у Богу вечнује, у Богу блаженствује; сав је Божји у васцелом бићу свом: сав у Богу, од Бога, по Богу, са Богом, ка Богу.'
        cn: 基督的福音完全是呼召人进入神圣的自由，这自由将人从罪、死亡和魔鬼的一切奴役中释放出来。基督的神圣自由总是内蕴着神圣的力量，这力量能全能地、全然得胜地释放每一个爱基督之人，使他们脱离一切罪恶、一切死亡、一切魔鬼。在这种自由中，人自愿活出神圣圣洁的生命，因为人是藉着神圣的真理、神圣的公义、神圣的爱而生活。藉着神圣真理生活，总是全能地战胜并从你身上驱除一切谎言和谬误；藉着神圣公义生活，总是全能地战胜并从你身上驱除一切不义；藉着神圣的爱生活，总是全能地战胜并从你身上和你里面驱除一切自爱、一切自悦和悦罪的爱。基督的神圣自由始终如一地被体验为基督的神圣之爱；因为二者彼此共存，彼此借助而运行、存在、生成。如果基督的爱在你里面减弱，要知道你里面在基督里的自由也随之减弱了。若有任何自私的欲望削弱你的福音之爱，它就削弱你的神圣自由，你灵魂的视野中就会出现奴役。因为你灵魂中基督之爱退去的地方，必然会被某种罪恶的、致命的、爱恶的事物所奴役。在你里面滋生出来的最小的自爱，逐渐变成你灵魂的残暴暴君，并扼杀基督赐予你的神圣自由。你里面一切不为基督、不由基督、不依照基督、不归向基督的事物，都必然将你拖入罪、死亡和魔鬼的奴役之中。检视你灵魂里、你心里、你意念里一切的活动、波动和发生的事：用基督的爱来检视它。凡是与这爱相悖的，实际上就是与你自己、与你灵魂、与你的救恩、与你的不朽相悖。无论何种形式的自爱，首先、也最主要、最致命地是与你自己相悖；并且对他人造成的伤害总是比对你自己造成的伤害要小。即便在你里面出现最小的自爱，罪也会呼唤你，引诱你进入它的怀抱，进入它的奴役。用爱基督之心来抵御它，因为爱基督之心是唯一能全然得胜、全能的武器，可对抗一切自爱。自爱想要按着肉体生活，取悦肉体一切贪恋享乐的欲望，并借此使你被死亡和罪奴役，再通过它们被永不满足的魔鬼奴役。但你们，已蒙基督从罪、死亡和魔鬼的一切奴役中释放出来，当使用基督赐给你们的神圣自由所武装你们的一切武器。什么武器呢？祈祷、禁食、警醒、爱、怜悯、忍耐、真理、公义、信心——这便是基督的全副军装，它全能地战胜，不仅是所有的罪和所有的试探，更是每一桩罪和每一次试探的始作俑者：就是天空属灵气的恶魔，以及这黑暗世界的执政者（参以弗所书 6:12-18）。而那标志、那证据、那见证，表明你确实活在基督的神圣自由中，脱离罪、死亡和魔鬼，并且没有滥用这自由来依循肉体生活，那就是：你以福音之爱服侍邻人。若你们彼此以福音之爱相待，那么一切罪、一切死亡、一切魔鬼都将从你们面前逃跑；如同躲避无法忍受的火焰一样逃跑。因为基督的爱是一团火焰，它焚烧一切罪恶、一切死亡、一切魔鬼。因为基督的爱不仅是基督的美德和属性，更是基督的本体自身。更甚者：作为独一的真神和主，基督完全是爱。因为——「神就是爱」（1 约翰福音 4:16:8）。因此，凡拥有这爱的人，就拥有神；凡拥有基督神的人，就拥有这爱；凡活在这爱中的人，就活在神里面，在神里面得享不朽，在神里面得享真理，在神里面得享永恒，在神里面得享至福；在他整个存有中，他完全属于神：完全在神里面，来自神，依照神，与神同在，归向神。
    - type: paragraph
      text:
        ru: '5:14'
        cn: '5:14'
    - type: paragraph
      text:
        ru: 'Стога су у љубави божанској сви закони неба; и више: сви закони који су и за самог Бога закони. Љубав је уствари свезакон, обавезан за Бога и за сва створења Божја. Отуда се сав закон за анђеле на небу и за људе на земљи садржи у божанској љубави Христовој. Стога се сав тај закон, сав тај свезакон, испуњује у једној речи, у овој: «Љуби ближњег свог као себе самог».'
        cn: 因此，天上的一切律法都在神圣的爱中；并且更甚：连对上帝自己而言，都是律法的一切律法，亦在其中。爱实际上是全律法，对上帝和上帝的一切受造物都具有约束力。因此，天上天使和地上人类的全部律法，都包含在基督的神圣之爱中。因此，这全部的律法，这全部的全律法，都成全于一句话之中，即是这一句：「爱你的邻舍如同爱你自己。」
    - type: paragraph
      text:
        ru: 'Божанском љубављу љубећи ближњег свог као себе самог, ти ћеш сваког човека осетити као свог ближњег, и у свакоме видети бесмртног брата свог. Јер божанска љубав Христова има ту силу: да ти отвори душу ближњега твог, и саму суштину њену – боголикост, и у тој боголикости – божанско величанство и лепоту и сјај ближњега твог. И ти, љубећи човека божанском љубављу Христовом, љубиш у њему све оно што је боголико, божанско, богочежњиво, богољубиво, бесмртно, вечно, богочовечно. И на тај начин, једино на тај начин, опитно дознајеш шта је човек у суштини својој, долазиш до једино истинског знања о човеку, до једино истинског човекопознања. А кроз то – до једино истинског самопознања. Да, једино љубављу Христовом се долази и до истинског човекопознања и до истинског самопознања. Јер њоме ти опитно и стварно упознајеш и себе сама као биће боголико, богочежњиво, бесмртно и вечно. Ту нема ни трунке самољубља. Јер љубећи ближњег «као себе самог», и кроз ближњега љубећи себе, ти уствари љубиш оно што је божанско, Божје и у теби, што је бесмртно и вечно, што је од Бога и увек припада Богу у свима животима и у свима световима. Ко љуби човека, тај познаје човека. Али пре тога и испред тога иде она еванђелска истина: Који љуби Бога – познаје Бога (ср.1Ин.4:7). Тако и: који љуби човека – познаје човека. Ми смо људи један другоме ближњи само Богом, само боголикошћу. Једино преко Бога ми смо блиски један другоме. Без Бога – ми смо удаљени један од другога, одвојени непремостивим амбисима егоцентричне самозатворености и несагледним понорима мрачних бесконачности.'
        cn: 以神圣的爱爱你的邻人如同你自己，你便会感受到每个人都是你的邻人，并在每个人身上看见你那不朽的弟兄。因为基督神圣的爱拥有这样的力量：开启你邻人的灵魂，以及其本质——神性形像，并在那神性形像中——看见你邻人神圣的威严、美丽与光辉。并且，你以基督神圣的爱爱人，你在他里面所爱的是一切神性形像的、神圣的、渴慕神的、爱神的、不朽的、永恒的、神人一体的。并且唯有通过这种方式，你才能经验性地认识到人在其本质上是什么，达到唯一真实的关于人的知识，达到唯一真实的人类认识。而通过这一点——达到唯一真实的自我认识。是的，唯有借着基督的爱才能达到真实的对人的认识和真实的自我认识。因为借着它，你经验性地真实认识到你自己也是一个神性形像的、渴慕神的、不朽的、永恒的生命。这里没有丝毫自私。因为爱邻人「如同你自己」，并借着邻人爱你自己，你实际上所爱的是在你里面那神圣的、属神的，那不朽的、永恒的，那源于神并永远属于神，在一切生命和一切世界中的部分。谁爱人，谁就认识人。但在此之前，在此之上，有那福音的真理：爱神的，就认识神（约翰一书 4:7）。同样地：爱人的，就认识人。我们人类彼此是邻人，唯独借着神，唯独借着神性形像。唯独通过神，我们才能彼此亲近。没有神——我们彼此疏远，被以自我为中心的封闭所造成的不可逾越的深渊所隔绝，以及被黑暗的无穷所造成的深不可测的鸿沟所隔绝。
    - type: paragraph
      text:
        ru: Шта је то у нашем људском бићу, сем боголикости, што би нас људе могло учинити блискима и ближњима једног другоме, што би нас суштински везивало и уједињавало? Да ли тело? Оно је иловача која се распада у себи и од себе, која ни себе не може да држи у јединству. Како онда може нас држати у јединству са људима око нас? Тако и дух у нама, без боголикости, тако и ум и савест и воља – све су то беспомоћни усамљеници, који се ничим не могу истински и суштински повезати са људима око себе, и осетити их као блиске и ближње, као једну Божју породицу. Сваки – као суво зрно песка; а сви – гомила ничим неповезаних безбројних зрна песка. Међутим, само љубав Христова, сједињујући човека најпре са Богом преко боголикости, у исто време сједињује га преко Бога са осталим људима, као са боголиким бићима, као са боголиком браћом, бесмртном и вечном браћом, који су нам ближњи боголикошћу, и то вечито ближњи кроза све бесконачне векове векова.
        cn: 在我们的人性中，除了神的样式，还有什么能使我们人类彼此亲近、彼此成为邻舍，从本质上将我们联系并联合起来呢？难道是身体吗？它不过是泥土，自行瓦解，甚至连自己都无法保持合一。那么它又怎能使我们与周围的人保持合一呢？同样，我们内在的灵，若没有神的样式，还有我们的心思、良知和意志——所有这些都是无助的孤独者，无法真正和本质上与周围的人联系起来，也无法将他们视为亲近的、邻舍般的，视为上帝的一个家庭。每个人都如同干燥的沙粒；而所有人则是一堆毫无关联的无数沙粒。然而，唯有基督的爱，首先借着神的样式将人与上帝联合起来，同时又借着上帝将人与其他人联合起来，视他们为具有神的样式的生命，为具有神的样式的弟兄姐妹，是那不朽且永恒的弟兄姐妹，他们在神的样式上与我们是邻舍，并且在所有无限的世代中永远是邻舍。
