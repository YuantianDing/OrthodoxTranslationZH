        cn: '6:10'
    - type: paragraph
      text:
        ru: 'Зато дакле док имамо времена, чинимо добро свима, а особито онима који су с нама у вери. Јер временим стичемо вечно, краткотрајним – непролазно, земаљским – небеско. У овом свету ми морамо наше божанско добро, тај наш небески усев, штитити и бранити од сваке непогоде зла, које су тако честе, и скоро непрекидне, на њивама нашег земаљског живота. Како бранити? Бранити, даноноћно се трудећи око свог еванђелског добра са великом ревношћу у вери, у љубави, у молитви, у посту, у бдењу, у трпљењу, у чистоти, у кротости, у смирености, и у осталим светим врлинама, и не дати да нам то дотужи. Јер знамо да ће свебрижни и свемоћни Господ учинити да узрасту жита правде наше. Наше је да се неуморно трудимо: да копамо, да оремо, да сејемо, да заливамо, а Бог даје силе семену те расте, зри и сазрева у плодове (ср.1Кор.3:6–7). Но и тај наш даноноћни труд постаје нам лак и радостан када га чинимо у заједници са браћом по вери: јер су и они у истом подвигу и труду. И помажу нас својом вером, својом љубављу, својом молитвом, својом ревношћу. Стога смо дужни да с радошћу чинимо добро, особито онима који су с нама у вери. И то «док имамо времена»: јер што сејемо у времену, пожњећемо у вечности, што сејемо на земљи – пожњећемо на небу, што сејемо у овом свету – пожњећемо у оном. У сваком тренутку живота свог ми смо земаљсконебеска бића: све што чинимо, мислимо, осећамо, одмах се невидљиво преноси са земље на небо, одјекује тамо, одражава се тамо, продужује се тамо. Зато је од вечне важности све што човек чини, што човек мисли, што човек хоће. У сваком тренутку постојања свог човек је времевечно биће: и све што је његово има вечни значај и вечни смисао. Зато, пази како живиш! пази како мислиш! пази како осећаш! пази како радиш! пази како гледаш! пази како слушаш! Јер свим тим ти одређујеш и предодређујеш вечну судбу своју у оном свету.'
        cn: 因此，趁着我们还有时间，要对所有人行善，尤其是对那些与我们在信仰里的人。因为藉着暂时的，我们获得永恒；藉着短暂的，我们获得不朽；藉着属地的，我们获得属天的。在这个世界上，我们必须保护和捍卫我们那神圣的良善，我们那属天的庄稼，免受邪恶的各种灾祸，这些灾祸在我们属世生命的田野里是如此频繁，几乎不曾间断。如何捍卫？要日夜劳作，以极大的热忱在信仰、爱、祷告、禁食、警醒、忍耐、洁净、温柔、谦卑及其他圣善美德中，捍卫我们那福音的良善，并且不要让这劳作使我们厌倦。因为我们知道，全能又眷顾万有的主，必使我们公义的禾稼生长。我们当不倦劳作：挖掘、耕耘、播种、浇灌；而上帝则赐予种子力量，使其生长、成熟并结出果实（参阅哥林多前书 3:6-7）。然而，当我们与信仰里的弟兄们在团契中进行这日夜的劳作时，它便变得轻松而喜乐：因为他们也在同样的苦修和劳作中。他们以他们的信仰、他们的爱、他们的祷告、他们的热忱帮助我们。因此，我们有义务喜乐地行善，尤其是对那些与我们在信仰里的人。这便是「趁着我们还有时间」：因为我们在时间里所播种的，将在永恒里收割；我们在地上所播种的，将在天上收割；我们在这个世界上所播种的，将在那个世界收割。在我们生命的每一个时刻，我们都是属地又属天的生命：我们所做、所思、所感的一切，都立刻无形地从地上转移到天上，在那里回响，在那里反映，在那里延续。因此，人所做、所思、所愿的一切都具有永恒的重要性。在他存在的每一个时刻，人都是一个时间与永恒交织的生命：他的一切都具有永恒的意义和永恒的价值。因此，要留意你如何生活！留意你如何思想！留意你如何感受！留意你如何行事！留意你如何观看！留意你如何聆听！因为藉着这一切，你正在决定并预先决定你在那个世界的永恒命运。
    - type: paragraph
      text:
