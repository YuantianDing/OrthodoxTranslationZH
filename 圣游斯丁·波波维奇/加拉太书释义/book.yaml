        cn: '3:24'
    - type: paragraph
      text:
        ru: 'Намена је Мојсијевог закона да људе води ка Христу, као ка једином правом циљу њиховог постојања, не само у овом свету него и у свима световима: јер све што је вредносно у људском бићу, налази своју божанску и човечанску пуноћу и остварење у Христу Богочовеку. Водећи и приводећи ка Христу, Закон потпуно испуњује своју дужност. Јер шта је његова дужност? Привести Спаситељу, и у Њему – спасењу, оправдању. Извршивши ту дужност, Закон престаје, јер «Христос је свршетак закона: који га верује, оправдан је» (Рим.10:4). Тако нам Закон би водитељ ка Христу, васпитач ка Христу – παιδαγωγὸς εἰς Χριστόν, да се вером оправдамо. Вером Христовом. А шта садржи у себи вера Христова? Спасење од греха, смрти и ђавола; а спасење се постиже човековим охристовљењем, обожењем, обогочовечењем, отројичењем помоћу светих еванђелских тајни и светих еванђелских врлина. А у томе, једино у томе је оправдање људског бића, људског живота, људске савести, свега што се човек зове. Савест је зато у теби, човече, да ти буде водитељ ка Христу; и разум је зато у теби, и воља, и срце – да ти буду водитељи ка Христу, и? да те предаду Њему вером у Њега: да би те Он обновио и преобразио и учинио новим, небеским човеком, човеком по Богочовеку и Богочовеком, по Његовом лику и облику (ср.Кол.3:10). Јер се само Богочовеком постаје прави човек, истински човек, потпун човек, бесмртни човек, вечни човек, савршени човек. Јер само Богочовеком и савест човекова постаје чиста, савршена, те тако способна да га води путевима божанског усавршавања. Јер само Богочовеком и разум човеков постаје чист и здрав и обновљен, те тако способан да мисли о ономе што је на небу, у Христу Исусу, и да човека води свему вечном и бесмртном. Тако и воља и срце, и све што је човеково само Богочовеком постаје свето, бесмртно, савршено, вечно.'
        cn: '摩西律法的目的是将人引向基督，作为他们存在的唯一真正目的，不仅在这个世界，也在所有世界：因为人一切有价值的存在，都在基督——这位神人——里找到其神圣与人性的丰满和实现。引导并带领人归向基督，律法就完全履行了它的职责。因为它的职责是什么呢？是将人带到救主那里，并在他里面——获得救恩，称义。履行了这项职责，律法便止息了，因为「基督是律法的总结：凡信他的，都得称义」（罗马书 10:4）。如此，律法就成了我们引向基督的向导，归向基督的训蒙师——παιδαγωγὸς εἰς Χριστόν，使我们因信称义。凭着对基督的信。


          那么，对基督的信包含着什么呢？从罪、死亡和魔鬼中得救；而救恩的实现，是通过人的「基督化」、「成神化」、「神人化」、「成三一化」，借由神圣的福音奥秘和神圣的福音美德。而在这其中，也唯有在这其中，才有人的存在、人的生命、人的良心、以及人所称的一切的称义。良心在你里面，人啊，是为要成为你归向基督的向导；同样，理智在你里面，意志也在你里面，心也在你里面——是要成为你归向基督的向导，并且……？是要通过你对他的信，将你交托给他：使他更新你、转化你，使你成为一个新人、一个属天的人，一个效法神人基督并藉着他（基督），按照他的形象和样式而成为神人（参歌罗西书 3:10）。因为唯有通过神人，人才能成为真正的人、真实的人、完全的人、不朽的人、永恒的人、完美的人。因为唯有通过神人，人的良心才能变得纯洁、完美，从而有能力引导他走上神圣的完善之路。因为唯有通过神人，人的理智才能变得纯洁、健全、更新，从而有能力思想属天之事，在基督耶稣里，并能引导人归向一切永恒和不朽之事。同样，人的意志、心，以及人的一切，唯有通过神人才能成为圣洁的、不朽的、完美的、永恒的。'
    - type: paragraph
      text:
