    - type: paragraph
      text:
        ru: 'Шта је Еванђеље? Еванђеље је све што је Господ Христос, сишавши с неба на земљу, донео с неба као Бог, и учинио за нас као Богочовек, и дао нам као Спаситељ у Своме Богочовечанском телу – Цркви. Ето, то је Еванђеље. Другим речима: Еванђеље је сав Бог, сва Истина Божја, сва Правда Божја, сва Љубав Божја, сав Живот Божји, сва савршенства Божја, објављена и дарована нам оваплоћеним Богом и Господом Христом. Назвавши Своју науку Еванђељем = Благовешћу, Господ Христос речју Еванђеље обухвата све што је Он као Богочовек учинио за спасење рода људског од греха, смрти и ђавола. Све што је Он, и све што је Његово, и јесте благовест за род људски: и рођење Његово, и крштење, и преображење, и страдање, и крст, и смрт, и васкрсење, и вазнесење; и свако дело Његово, и свака реч Његова, и свака мисао Његова, и сваки покрет Његов, и сваки поглед Његов – јесте благовест. Јер кроза све то Он нас испуњује божанским силама Својим, обожује нас, и тако спасава од смрти, греха и ђавола, и дарује нам живот вечни и блаженство вечно. Богочовек Христос, сав у свој пуноћи Своје Богочовечанске Личности, и јесте једино истинско Еванђеље, једина истинска Благовест за род људски. Да, једина истинска Благовест, јер је једини Он победио нашу смрт; – зар ико може бити благовест за род људски, ако није победио нашу смрт? Да, једина истинска Благовест, јер је једини Он победио наш грех; – зар ико може бити благовест за род људски, ако није победио наш грех? Да, једина истинска Благовест, јер је једини Он победио ђавола; – зар ико може бити благовест за род људски, ако није победио ђавола? Да, једина истинска Благовест за род људски, јер је једини Он подарио роду људском: васкрсење, живот вечни, истину вечну, правду вечну, блаженство вечно; речју: подарио јединог истинитог Бога, и сва савршенства и блаженства Његова.'
        cn: 什么是福音？福音是主基督，降临人间，作为神从天上带来的一切，作为神人为我们所做的一切，以及作为救主在祂的神人一体之身——教会中赐予我们的一切。这，就是福音。换句话说：福音是全然的神，神全然的真理、神全然的公义、神全然的爱、神全然的生命、神全然的完美，由道成肉身的神和主基督向我们启示并赐予的。主基督称祂的教导为福音 = 喜讯，祂以「福音」一词涵盖了祂作为神人为拯救人类脱离罪、死亡和魔鬼所做的一切。祂所是的一切，以及祂所有的一切，都是人类的喜讯：祂的降生，祂的受洗，祂的变容，祂的受难，祂的十字架，祂的死亡，祂的复活，祂的升天；祂的每一个行动，祂的每一句话，祂的每一个意念，祂的每一个举动，祂的每一个眼神——都是喜讯。因为借着这一切，祂用祂的神圣力量充满我们，使我们神化，从而将我们从死亡、罪和魔鬼中拯救出来，并赐予我们永生和永恒的福乐。神人基督，以祂神人一体位格的全然丰满，是唯一真实的福音，是人类唯一真实的喜讯。是的，唯一真实的喜讯，因为唯有祂战胜了我们的死亡；——若非战胜了我们的死亡，谁能成为人类的喜讯呢？是的，唯一真实的喜讯，因为唯有祂战胜了我们的罪；——若非战胜了我们的罪，谁能成为人类的喜讯呢？是的，唯一真实的喜讯，因为唯有祂战胜了魔鬼；——若非战胜了魔鬼，谁能成为人类的喜讯呢？是的，人类唯一真实的喜讯，因为唯有祂赐予了人类：复活、永生、永恒的真理、永恒的公义、永恒的福乐；一言以蔽之：赐予了唯一真神，以及祂的一切完美与福乐。
    - type: paragraph
      text:
        ru: 'Због свега тога, нико други од људи нема права да своју науку, и себе, назове благовешћу. Сваки други човек, ма ко био, ма где живео, и ма када постојао, не може бити благовест за род људски, јер је неминовно сам роб смрти, греха и ђавола. За јадни род људски нема благовести сем победе над смрћу, над грехом, над ђаволом. А то даје једино и само Богочовек Христос. Зато је Он – једино Еванђеље, једина Благовест за род људски. Све што на земљи није Он и није од Њега, уствари је горковест; и још: горчина; и још: отров, смртоносни отров. А из Њега, Бога и Господа Исуса Христа, и из свега Његовог непрестано се лије Божанска Истина, Божанска Правда, Божанска Љубав, Божански Живот, све божанске милине, зрачи Једини истинити Бог, и у Њему једина истинита Истина, Једина истинита Правда, једина истинита Љубав, једини истинити Живот.'
        cn: 因此，除了祂以外，任何人都没有权利称自己的教导和自己为福音。任何其他的人，无论他是谁，无论他身在何处，无论他何时存在，都不能成为人类的福音，因为他自己必然是死亡、罪恶和魔鬼的奴仆。对于可怜的人类而言，除了战胜死亡、战胜罪恶、战胜魔鬼的胜利以外，没有福音。而这唯有并仅有神人基督才能赐予。所以，祂是唯一的福音，人类唯一的佳音。世上凡不属于祂、不源于祂的一切，实际上都是苦音；不仅如此，更是苦涩；不仅如此，更是毒药，致命的毒药。然而从祂——即上帝与主耶稣基督——以及祂的一切之中，神圣的真理、神圣的公义、神圣的爱、神圣的生命以及一切神圣的甘美，不断涌流而出；唯一的真神从中放射光芒，并且在祂里面有唯一的真真理，唯一的真公义，唯一的真爱，唯一的真生命。
    - type: paragraph
      text:
        ru: 'По свему, од почетка до краја, Еванђеље Христово је Еванђеље јединог истинитог Бога и јединог истинитог човека, јер је Еванђеље јединог истинитог Богочовека. Зато на земљи нема нити може бити другог Еванђеља. Али, исто тако ни на небу не може бити другог Еванђеља. Еванђеље Христово је у исто време и Еванђеље за небеске светове, за свете анђеле Божје. Зато се оно с правом назива: «вечно Еванђеље» (Откр.14:6). А кад људи ма кога или ма шта друго проглашују за Еванђеље на земљи, они то чине у греховном бунилу и лудилу. Јер је грех мрачна духовна сила која залуђује човеков ум, помрачује савест, квари срце, те човек нити нормално види, нити нормално расуђује, нити нормално осећа. Живећи у човеку, грех мисли човеком, грех осећа човеком, грех дёла човеком. А када кроз грехољубље и сластољубље и самољубље грех захвати целог човека и овлада њиме, онда се ум његов потпуно изопачи и иструли (ср.2Тим.3:8). Такав човек онда измишља лажне спасиоце рода људског, лажне месије, лажне пророке, лажна еванђеља, или злонамерно изврће Еванђеље Христово, прилагођава га себи, својим жељама, својим схватањима, својим идејама, својим страстима, својим сластима. Такав човек, такви људи и јесу они људи «који свагда уче, и никад не могу да дођу к познању истине» (1Тим.3:7), јер им неда грех који живи у њима и разлива лаж по уму њиховом, по срцу њиховом, по мислима њиховим, по савести њиховој, зато што је грех у суштини увек лаж, којој је у природи да мрзи истину и да одвраћа од ње и да хули на њу.'
        cn: 综观全局，从始至终，基督的福音是独一真神的福音，也是独一真人的福音，因为它是独一真神人的福音。因此，地上没有，也不可能有别的福音。然而，天上同样也没有别的福音。基督的福音同时也是为天上诸世界、为神圣天使们预备的福音。因此，它被恰当地称为：「永远的福音」（启示录 14:6）。而当人们在地上宣称任何人或任何事物为福音时，他们是在罪恶的错乱和疯狂中这样做。因为罪是一种黑暗的属灵力量，它迷惑人的心智，蒙蔽良知，败坏心灵，以致人不能正常地观看，不能正常地判断，也不能正常地感受。罪住在人里面，罪借着人思想，罪借着人感受，罪借着人行动。而当罪通过恋罪、贪图享乐和自爱，占据并辖制了整个人时，那么他的心智就完全被扭曲和腐朽了（参提摩太后书 3:8）。这样的人就会编造人类虚假的救主，虚假的弥赛亚，虚假的先知，虚假的福音，或者恶意歪曲基督的福音，使其适应自己，适应自己的欲望、自己的理解、自己的观念、自己的情欲、自己的私欲。这样的人，这样的人们，正是那些「常常学习，却总不能明白真道」的人（提摩太前书 3:7），因为住在他们里面的罪不允许他们这样做，并将谎言倾倒在他们的心智中、他们的心里、他们的思想中、他们的良知里，因为罪在本质上永远是谎言，而谎言的本性就是憎恨真理，使人偏离真理，并亵渎真理。
    - type: paragraph
      text:
        ru: Свако одвраћање од Еванђеља Христова није друго до одвраћање од јединог истинитог Бога – Господа Исуса Христа и Његове Истине, која је једина у свима световима, иста и за анђеле и за људе. Христово Еванђеље је једино «Еванђеље спасења» (Еф.1:13) и к њему позива људе «благодаћу Христовом» сам Бог Отац. А од јединог истинитог Бога, и од јединог истинитог Еванђеља одвраћа, ко? Несумњиво ђаво, и његови вољни и невољни подвижници. Умножавајући назовиистине кроз изопачене умове самољубивих и гордих људи, ђаво и ствара забуну код многих односно Еванђеља Христова, еда би изврнули Еванђеље Христово, и тако онемогућили спасење заводљивима, лишивши их божанских благодатних сила, помоћу којих људи једино и побеђују грех, смрт и ђавола, и осигуравају себи живот вечни кроз истину вечну. Нема језивије страхоте за људе него извртати Еванђеље Христово, изопачавати га, или одвраћати од њега, зато што је оно једино «Еванђеље спасења» и у њему једино спасење рода људског. Ко год изврће Еванђеље Христово, непријатељ је спасењу, једином спасењу рода људског, а најпре свом, па онда свачијем.
        cn: 任何偏离基督福音的行为，无非是偏离独一真神——主耶稣基督及其真理，这真理在所有世界中是独一的，对天使和对人类都是一样的。基督的福音是独一的「救恩福音」（以弗所书 1:13），圣父上帝亲自藉着「基督的恩典」召呼人们归向这福音。那么，是谁使人偏离独一真神和独一真福音呢？毫无疑问是魔鬼，以及它自愿和非自愿的侍从。藉着败坏自私和骄傲之人的心思意念，魔鬼散布假冒的真理，在许多人心中制造关于基督福音的混乱，为的是要扭曲基督的福音，从而使那些被诱惑的人无法得救，剥夺他们的神圣恩典能力——而这些能力是人们唯一能藉以战胜罪、死亡和魔鬼的，并通过永恒的真理确保自己获得永生。对人类而言，没有什么比扭曲、败坏基督福音或偏离它更可怕的了，因为它是唯一的「救恩福音」，人类唯一的救恩就在其中。任何扭曲基督福音的人，都是救恩的敌人，是人类唯一救恩的敌人，首先是自己救恩的敌人，然后是所有人的敌人。
    - type: paragraph
      text:
        ru: '1:8'
        cn: '1:8'
    - type: paragraph
      text:
        ru: 'И анђео престаје бити анђео ако изврће Еванђеље Христово, а камоли апостол да не престане бити апостол ако то учини. Нема сумње, апостоли престају бити апостоли ако изврћу Еванђеље Христово. Све је у Еванђељу божански савршено, неприкосновено, свевредносно, свеспасоносно, јер је све од свесавршеног и свебезгрешног Бога и Господа Исуса Христа. Па ко смо ми апостоли, ко сте ви – анђели с неба, да друкчије јављамо Еванђеље Христово него што га сам Господ Христос објави! И преко мене непосредно објави. Та знате ли, да у страху и трепету великом, ја не смем ни слова да додам ни јоте да изменим од онога што ми сам Господ Исус откри о Еванђељу Свом. Ко сам ја? Црв. А ви? Црв до црва. Како бих се онда усудио да изврћем Еванђеље Спасово? Та то је једина Вечна Истина, једина Вечна Правда, једина Вечна Љубав, једини Вечни Живот, једина Вечна Свевредност у свима човечанским и анђелским световима. Стога: «проклет да буде» и апостол, и анђео с неба, и сваки човек, и сваки створ, који «друкчије јави Еванђеље него што вам га ми јависмо». Нема благослова роду људском сем у Еванђељу Христовом. Изван њега, и без њега, све само проклетство до проклетства. Јер без Еванђеља Христова: проклетство је не само грех, смрт, и ђаво, већ и цео овај свет је проклетство, и све у њему: живот, човек, сва бића и све ствари, јер се све гуши у смрти, у сатанизму, у ђаволизму: све непрестано умире у бесконачним и бесмртним мукама. Једино, једино, једино у Христу и кроз Христа Бог и Отац Небесни «благословио нас је сваким благословом духовним» (Еф.1:3), и скинуо проклетство са природе људске (ср.Гал.3:13).'
        cn: 连天使若扭曲基督的福音，就不再是天使了，更何况使徒若这样做，怎会不停止作使徒呢？毫无疑问，使徒若扭曲基督的福音，就不再是使徒了。福音中的一切都是神圣完美、不可侵犯、全然宝贵、全然救赎的，因为一切都源自全然完美且全然无罪的上帝和主耶稣基督。那么，我们使徒算什么？你们天上来的天使又算什么？竟敢传扬与主基督亲自所宣扬的基督福音不同！祂也亲自藉着我宣扬了。你们可知，我在极大的恐惧和战兢中，不敢增添一个字，也不敢改动一点一画，对于主耶稣亲自向我启示的关于祂福音的一切。我是谁？一条虫。你们呢？不过是一条又一条的虫罢了。我又怎敢扭曲救主的福音呢？因为这福音是所有人类和天使世界中，唯一的永恒真理、唯一的永恒公义、唯一的永恒之爱、唯一的永恒生命、唯一的永恒全然宝贵。因此，凡是传扬与我们所传给你们的福音不同的，无论是使徒，是天上来的天使，是每一个人，是每一个受造物，都「当受咒诅」。除了在基督的福音里，人类便没有祝福。在其之外，没有它，一切都除了咒诅还是咒诅。因为没有基督的福音：咒诅不仅是罪恶、死亡和魔鬼，而且整个世界都是咒诅，以及其中所有的一切：生命、人类、所有生灵和所有事物，因为一切都在死亡中窒息，在撒但主义中窒息，在魔鬼主义中窒息：一切都在永无止境和不朽的痛苦中持续死去。唯独、唯独、唯独在基督里并藉着基督，上帝和天父「曾赐给我们天上各样属灵的福气」（以弗所书 1:3），并挪去了人类本性上的咒诅（参阅加拉太书 3:13）。
    - type: paragraph
      text:
        ru: '1:9'
        cn: '1:9'
    - type: paragraph
      text:
        ru: 'Зато, зато, зато – као што вам пре рекосмо кад бејасмо међу вама, и сад опет велим: ако вам ко јави Еванђеље друкчије него што га примисте, проклет да буде! Ви примисте Еванђеље од мене, а ја од Господа Христа. У њему нема ничег мог, ничег људског: од почетка до краја у њему је све Христово, Божје, Богочовеково. У то сте се уверили и ви сами, посматрајући живљење моје и дела моја, кроз која дела сила свемоћног Богочовека. Као што је Господ Христос, Богочовек, савршени Бог и савршени човек, те се Његовом двоструком савршенству ништа не може ни додати ни одузети, тако је и Његово Еванђеље савршено у свему и по свему. Одузме ли ко нешто Еванђељу Његовом, одузео је себи спасење и живот вечни: унаказио је душу своју унаказивши Еванђеље Спасово. Не само то, него је унаказио једини извор спасења људског, одузео људима једино средство којим се могу спасти од смрти, греха, и ђавола и стећи живот вечни у блаженству вечном. Стога, проклет да буде! Мисли ли ко да ишта недостаје Еванђељу Христовом и да га људи могу допунити по своме нахођењу и додати му ишта по својим жељама, равно је безумљу. Зар човек да исправља и поправља Богочовека? зар човек да допуњује Еванђеље Богочовека? Ко се дрзне да то учини – руши палату спасења људског. Стога, проклет да буде! Унакаженог Христа проповеда кроз унакажено Еванђеље сваки који ишта дода или одузме свесавршеном Еванђељу Христовом. А ја нећу престати говорити вам, као што сам вам говорио када сам први пут код вас био, и сада говорим, и увек ћу говорити и на земљи и на небу кроза све векове и вечности: Исус Христос је исти јуче и данас и вавек (Евр.13:8). Тако је и Његово Еванђеље исто јуче и данас и вавек. А у њему је увек исти јуче и данас и вавек: Истина Божја, Правда Божја, Љубав Божја, Дух Божји, дарови Божји, савршенства Божја, кроз које се добија и изграђује спасење људско, спасење сваког човека посебно и свих људи скупа. Зато проклет да буде сваки који Вечном Еванђељу Христовом ишта одузме или дода, или га измени и унакази. Људи – немирни и немоћни скакавци! Шта су људи, да би исправљали и поправљали Бога и Господа Исуса Христа и Његово Свето Еванђеље? Сетите се, први Светлоносац кад је покушао да исправи Бога, претворио се у Мраконосца, у Сатану, у ђавола! А шта ли тек постаје човек који у гордоумљу свом поправља Господа Христа и Његово свесавршено Еванђеље! Човек – исправља Богочовека! Безумље над безумљима, како ти је име ако не човек? Без Богочовека, човек, сваки човек у роду људском од првог до последњег, сав је слабост и немоћ и смрт и грех и пакао и ђаво. Само Богочовеком и помоћу Богочовека човек постаје свемоћ и бесмртност и анђео и рај и бог по благодати. И ви људи усуђујете се исправљати, мењати, преиначавати Еванђеље Христово! Знајте, то је увек био, и остао, главни посао ђавола. А ви, радећи тако, сарађујете ђаволу. И тиме навлачите на себе сва проклетства свих светова.'
        cn: 因此，因此，因此——正如我们之前在你们当中时对你们说过，现在我再次说：如果有人向你们传讲的福音与你们所领受的不同，他当受咒诅！你们从我领受了福音，而我从主基督领受。其中没有我的任何东西，也没有人的任何东西：从始至终，其中一切都是基督的，是神的，是神人（上帝之子道成肉身）的。你们自己也已确信了这一点，通过观察我的生活和我的行为，那全能的神人（上帝之子道成肉身）的力量通过这些行为而彰显。正如主基督，这位神人（上帝之子道成肉身），是完全的神和完全的人，祂的双重完美无增无减，同样，祂的福音在一切事上、在各方面也都是完全的。若有人从祂的福音中取走任何东西，他就剥夺了自己得救和永生：他玷污了救主的福音，从而玷污了自己的灵魂。不仅如此，他更是玷污了人类唯一的救赎之源，剥夺了人们唯一能借以从死亡、罪恶和魔鬼中得救，并在永恒的福乐中获得永生的途径。因此，他当受咒诅！若有人认为基督的福音有任何不足，且人们可以根据自己的判断来补充它，或根据自己的愿望添加任何东西，这等同于疯狂。人竟然要纠正和修补神人（上帝之子道成肉身）吗？人竟然要补充神人（上帝之子道成肉身）的福音吗？谁胆敢这样做——就是拆毁人类救赎的殿堂。因此，他当受咒诅！凡是给基督完全的福音增添或删减任何东西的人，都是通过被玷污的福音传讲一位被玷污的基督。但我不会停止对你们说，就像我第一次在你们那里时对你们说过的那样，我现在也这样说，并且在地上和天上，在所有时代和永恒中，我将永远这样说：耶稣基督昨日、今日、直到永远，是一样的（希伯来书 13:8）。因此，祂的福音昨日、今日、直到永远，也是一样的。而其中永远是昨日、今日、直到永远不变的：神的真理、神的公义、神的爱、神的灵、神的恩赐、神的完美，通过这些，人类的救赎得以获得和建立，即每个个体以及所有人类共同的救赎。因此，凡是给基督的永恒福音增添或删减任何东西，或篡改和玷污它的人，他当受咒诅。世人——不安分而无能的蝗虫！人算什么，竟然要去纠正和修补上帝、主耶稣基督和祂的圣福音？请记住，第一位光明使者在试图纠正上帝时，变成了黑暗使者，变成了撒旦，变成了魔鬼！那么，一个在自己的骄傲中修补主基督和祂完全的福音的人，又会变成什么呢！人——竟然纠正神人（上帝之子道成肉身）！疯狂之至！如果你不是人，你的名字又是什么呢？没有神人（上帝之子道成肉身），人，人类中从第一个到最后一个的每一个人，都完全是软弱、无能、死亡、罪恶、地狱和魔鬼。唯有藉着神人（上帝之子道成肉身）并依靠神人（上帝之子道成肉身），人才能成为全能、不朽、天使、天堂，并因恩典而成为神。而你们世人竟敢纠正、改变、歪曲基督的福音！须知，这向来是，并且仍然是魔鬼的主要工作。而你们，这样做，就是在与魔鬼合作。因此，你们将所有世界的咒诅招致到自己身上。
    - type: paragraph
      text:
        ru: '1:10'
        cn: '1:10'
    - type: paragraph
      text:
        ru: 'Говорећи ово, зар ја сад људе наговарам или Бога? Нити наговарам људе за нешто своје, нити помишљам да ма шта своје предлажем свесавршеном Богу и Господу и задобијам Га за неки свој предлог. Ништа своје немам, и нећу, само да Христа добијем и да се у Њему нађем – на сву вечност! Или тражим да људима угађам? Та шта су људи? Језива поворка губавих робова смрти, греха и ђавола. И зар да од њих тражим бесмртност и истину и живот и правду и вечност? Зар да од трулих робова смрти тражим спасење од смрти? Зар да од сладострасних крпеља греха тражим спасење од греха? Зар да од безумних лакеја ђаволових тражим спасење од ђавола? Не, не, не! Јер кад бих ја још људима угађао, не бих био слуга Христов. Христу Богу служи се: вером, љубављу, надом, молитвом, постом, смиреношћу, милосрђем, трпљењем, и осталим светим врлинама еванђелским. А ђаволу се служи, чиме? – неверјем, безверјем, безбожношћу, мржњом, очајањем, гордошћу, неуздржањем, мрзовољом, леношћу, охолошћу, завишћу, пакошћу, похотом, самољубљем, сластољубљем, саможивошћу, себичношћу, и осталим страстима, пороцима и гресима. Ја не бих био слуга Христов, када бих угађао људским слабостима, и гресима, и сластима, и страстима, и жељама, и измишљотинама. Служећи Истини Христовој, ја уистињујем и оистињујем своје биће Вечном Истином, и сам постајем вечан; служећи Љубави Христовој, ја ољуботворавам душу своју Вечном Љубављу, и сам постајем блажен у живљењу свом овога и онога света; служећи Правди Христовој, ја се сав испуњујем Вечном Правдом и жртвујем себе за њу непрестано, и кроз то жртвовање непрестано васкрсавам себе у живот вечни; служећи васкрслом Господу Христу, ја побеђујем све смрти у свима световима, и постајем бесмртан божанском бесмртношћу. Слуга сам Христов, свепослушни слуга свему Христовом, и тиме се спасавам од свих лудила људских, која сластима, страстима, гресима, смртима, ђаволима пустоше и упропашћују нехристове и ванхристове људе.'
        cn: 说这话，难道我现在是劝服人还是劝服神呢？我既不是在劝服人接受我自己的什么，也未曾想过要向全德全能的神和主提出我自己的任何建议，并争取祂同意我的任何提议。我一无所有，也别无所求，只愿得着基督，并被祂寻见——直到永恒！难道我寻求取悦于人吗？人又是什么呢？是一支可怖的队伍，是一群麻风般的奴仆，受制于死亡、罪恶和魔鬼。难道我要向他们寻求不朽、真理、生命、公义和永恒吗？难道我要向那些腐朽的死亡奴仆寻求从死亡中得救吗？难道我要向那些沉溺于享乐的罪恶蜱虫寻求从罪恶中得救吗？难道我要向那些愚昧无知的魔鬼走狗寻求从魔鬼中得救吗？不，不，不！因为如果我还在取悦于人，我就不是基督的仆人了。事奉基督神，是借着信心、爱心、盼望、祷告、禁食、谦卑、慈悲、忍耐，以及其他一切福音的神圣美德。那么事奉魔鬼呢，是借着什么呢？——是借着不信、无信仰、不敬虔、仇恨、绝望、骄傲、不节制、倦怠、懒惰、傲慢、嫉妒、恶意、淫欲、自爱、贪恋享乐、自我中心、自私，以及其他一切情欲、恶习和罪恶。如果我取悦于人的软弱、罪恶、享乐、情欲、欲望和虚妄，我就不是基督的仆人了。事奉基督的真理，我以永恒的真理使我的存在变得真实和纯正，我自己也变得永恒；事奉基督的爱，我以永恒的爱使我的灵魂充满爱，我自己也在这今生和来世的生活中成为有福的；事奉基督的公义，我全身充满永恒的公义，并不断为它牺牲自己，借着这不断的牺牲，我将自己复活进入永生；事奉复活的主基督，我战胜了所有世界中的一切死亡，借着神圣的不朽，我变得不朽。我是基督的仆人，凡基督所吩咐的，我全然顺从的仆人，借此我得以摆脱人类一切的疯狂，这些疯狂借着享乐、情欲、罪恶、死亡和魔鬼，摧毁并毁灭了那些不属于基督和远离基督的人。
    - type: paragraph
      text:
        ru: 1:11–12
        cn: 1:11–12
    - type: paragraph
      text:
        ru: 'Људи, сви људи свих времена без изузетка, када би решили да измисле Еванђеље спасења, не би то никада могли учинити. Но и када би измислили Еванђеље спасења од греха, смрти и ђавола, како би могли наћи у себи силе која ће то Еванђеље остварити: победити смрт, грех и ђавола? Те им силе уопште недостаје, нити је могу пронаћи у себи. Пред смрћу, пред ђаволом, пред грехом људи су потпуно немоћни и беспомоћни, како сви људи скупа, тако и сваки човек понаособ. Само је Богочовек Христос ту свемоћан и свепобедан: Он једини у роду људском побеђује смрт, грех и ђавола; Он и они који су с Њим и у Њему. Стога Он једини и има и даје Свето Еванђеље спасења; и оно је васцело по Богочовеку, ни најмање по човеку.'
        cn: 人类，古往今来所有的人，无一例外，如果他们决定要发明一套救赎的福音，他们将永远无法做到。然而，即使他们发明了一套从罪、死亡和魔鬼中得救的福音，他们又怎能在自己里面找到能实现这福音的力量呢：战胜死亡、罪和魔鬼？他们根本缺乏这些力量，也无法在自己里面找到。在死亡、魔鬼和罪面前，人类是完全无能为力和无助的，无论是全体人类，还是每一个人。唯有神人基督在此是全能且全胜的：他是人类中唯一战胜死亡、罪和魔鬼的；他以及那些与他同在、在他里面的人。因此，他唯独拥有并赐予圣洁的救赎福音；这福音完全是出自神人，丝毫不出自人。
    - type: paragraph
      text:
        ru: 'Нека ово буде ваше свезнање: Еванђеље које сам вам јавио није по човеку већ по Богочовеку; јер га ја не примих од човека, нити научих, него откривањем Исуса Христа. Све што је човеково, заудара на смрт, на грех, на лаж, на трулеж, зато у мом Еванђељу нема ничега од човека, ничега по човеку, и у њему све мирише на бесмртност, на светост, ни истину, на вечност, на небо, на рај, на Бога, на Богочовека. У моме Еванђељу све је божанско све вечно, све спасоносно, све свевредносно, све божански истинито, божански праведно, божански непогрешиво, божански свето. Разгрните ма коју реч у њему, у свакој је Бог Логос = Бог Реч, Бог Мудрост, Бог Логика. А у свима Његовим речима, у свима Његовим истинама, у свима Његовим делима – сав Бог и Господ, једини истинити Бог и Господ у свима световима: Богочовек Исус Христос. Да, моје је Еванђеље сво од Богочовека, и по Богочовеку; и ја га непосредно од Њега примих откривењем. А човек? Та сваки човек је тако патуљачки мали и ништаван, да не може ни наслутити Еванђеље спасења, а камоли имати га, па га и другоме дати. Хтети добити Еванђеље спасења од човека, хтети га научити од човека, то је: хтети добити бесмртност и живот вечни од лешине. Од безумне вере у човека, у његову моћ и силу и мудрост, пате сви многобошци, па и ви Галати, некадашњи многобошци, идолопоклоници и човекопоклоници. Само, уразумите се и прогледајте, па сагледајте човека у васцелом бићу његовом. Где је та сила у њему која може победити смрт и дати живот вечни? Нема је, нема, нема, нити је може бити у ма ком човеку ма ког времена. А кад је то очигледна истина, како се онда уздати у човека, у његову моћ и силу и мудрост, и веровати у њега? Такво човекопоклонство је лудило; вера у човека је лудило, јер одводи у сваку смрт, у сваку немоћ, у сваки грех, у сваки пакао. Ниједно божанство није тако лажно као човек, и тако немоћно као човек, и тако беспомоћно као човек. И како онда човеком заменити Богочовека, тог јединог истинитог Бога и Господа? Очигледна је стварност данашњице, јучерашњице, а и сутрашњице: чим људи човеком замене Богочовека, човекопоклонством богопоклонство, њихове се све творевине на крају свих крајева завршавају сломом, тону и пропадају у амбисе безбројних смрти, ужаса и очајања.'
        cn: 请把以下作为你的全知：我所传给你们的福音不是从人来的，而是从神人来的；因为我不是从人领受的，也不是从人学来的，而是借着耶稣基督的启示。凡属人的，都散发着死亡、罪恶、谎言和朽坏的气息，所以在我的福音里没有任何属人的东西，没有任何出于人的东西，其中一切都散发着不朽、圣洁、真理、永恒、天堂、乐园、上帝和神人的气息。在我的福音里，一切都是神圣的，一切都是永恒的，一切都是救赎的，一切都是有最高价值的，一切都是神圣真实的，神圣公义的，神圣无误的，神圣圣洁的。展开其中任何一句话，每一句都有上帝圣言 = 上帝道，上帝智慧，上帝逻辑。而在祂所有的言语、所有的真理和所有的作为中——都有完整的上帝和主，在所有世界中唯一的真上帝和主：神人耶稣基督。是的，我的福音完全是出于神人，并且是按照神人而来的；我直接借着祂的启示领受了它。而人呢？每个人都是如此矮小和虚无，以至于他甚至无法预料救恩的福音，更不用说拥有它，并把它给予他人。想要从人那里获得救恩的福音，想要从人那里学习它，这无异于：想要从尸体那里获得不朽和永生。所有多神论者，甚至你们加拉太人，曾经的多神论者、偶像崇拜者和拜人者，都因对人、对人的权能和智慧的盲目信仰而受苦。但是，你们要清醒过来，睁开眼睛，看清人在其整个存在中的真相。他身上有什么力量可以战胜死亡并赐予永生？没有，没有，没有，在任何时候的任何一个人身上都不可能有。既然这是显而易见的真理，那么我们怎能信赖人、信赖他的权能和智慧，并相信他呢？这种拜人行为是疯狂的；相信人是疯狂的，因为它把人引向各种死亡，各种软弱，各种罪恶，各种地狱。没有任何神性像人一样虚假，像人一样无能，像人一样无助。那么，我们又怎能用人来取代神人——那位唯一的真上帝和主呢？今日、昨日乃至明日的现实都是显而易见的：一旦人们用人取代神人，用拜人取代拜神，他们的一切创造最终都会以崩溃告终，沉沦并消亡在无数的死亡、恐怖和绝望的深渊中。
    - type: paragraph
      text:
        ru: '1:13'
        cn: '1:13'
    - type: paragraph
      text:
        ru: 'Ако је ико био против Христа и Његовог Еванђеља, био сам ја; ако је ико желео да уништи Христа и Његово Еванђеље, желео сам ја; ако је ико гонио Цркву Христову и раскопавао је, гонио сам је и раскопавао ја. И то не из пакости, не из злобе, не из лакомислености, не из зависти, не из човекоугодништва, не из сујете, не из славољубља, већ из ревности за предање отаца својих:'
        cn: 如果曾有人与基督和祂的福音为敌，那就是我；如果曾有人想毁灭基督和祂的福音，那就是我；如果曾有人迫害基督的教会并拆毁它，那就是我迫害并拆毁了它。而这并非出于恶意，并非出于怨毒，并非出于轻率，并非出于嫉妒，并非出于取悦于人，并非出于虚荣，并非出于贪慕虚名，而是出于对我列祖传统的热忱：
    - type: paragraph
      text:
        ru: '1:14'
        cn: '1:14'
    - type: paragraph
      text:
        ru: 'за истине Богом откривене преко Мојсија и осталих светих предака мојих. Ревновао сам не из плиткоумља, већ што сам свестрано био изучио предање отаца наших, и осећао их као истиниту реч Божију. Неуморан у томе, ја сам напредовао у јеврејству већма од многих вршњака својих у народу своме. У пламеној ревности за јеврејство своје ја сам све жеље своје стопио у једну жељу, у једну свежељу: да из љубави према својој вери уништим Христа и Његово Еванђеље. И ја сам не само живео, него дисао претњом и смрћу на све што је Христово. И почео сам смишљено, плански и немилосрдно да гоним Христове следбенике и њихово Еванђеље.'
        cn: 为着神藉摩西和我其他圣祖所启示的真理。我怀着热诚，并非出于肤浅，而是因为我曾全面研习我们先祖的传统，并认为它们是真实的上帝话语。对此不知疲倦，我在犹太教中比我本族许多同龄人都更有长进。在我为犹太教的炽热热情中，我将自己所有的渴望融合成一个愿望，一个包罗万象的愿望：出于对我信仰的热爱，要毁灭基督和祂的福音。我不仅活着，更以威胁和死亡的气息对待所有属基督的事物。我开始蓄意、有计划且毫不留情地迫害基督的追随者和他们的福音。
    - type: paragraph
      text:
        ru: 1:15–16
        cn: 1:15–16
    - type: paragraph
      text:
        ru: 'Али, све је то пало, и бесповратно пропало, када угледах васкрслог Господа Исуса у неисказаној светлости који ми се изненада јави на путу за Дамаск. Тада? Тада сам свим бићем осетио: да је сва истина у васкрслом Господу Исусу, сва правда, сва бесмртност, сва сила, сва моћ, сав Бог, сва вечност, све вредности, све оно ради чега стоји и постоји и човек, и земаљски свет, и сви светови. Тим јављањем, и многим другим јављањима својим мени недостојном, Господ Христос ме је освојио заувек, за све животе и за све вечности. Он ме је не само научио Своме Еванђељу и улио га у мене, већ је са свима Својим божанским силама, божанским свесилама, ушао у мене, уселио се у мене вером мојом у Њега (ср.Еф.3:17), љубављу мојом за Њега, и ја више не живим, него у мени живи Христос (Гал.2:20). О! та шта ћу ја себи, када је ту чудесни Господ Христос? Тек са Њиме и кроз Њега ја сам осетио свеслатку радост живота и постојања, радост што сам човек. А дотле? Не, нећу ништа своје! ни себе нећу без Њега! нећу живот без Њега, нећу истину без Њега, нећу љубав без Њега, нећу правду без Њега, нећу бесмртност без Њега, нећу вечност без Њега, нећу свет без Њега, нећу човека без Њега, нећу небо без Њега, нећу рај без Њега, нећу Бога без Њега! О, и истина, и љубав, и правда, и бесмртност, и вечност, и небо, и рај, и свет, и човек, и Бог – све су то тамнице, тамнице, тамнице, ако у њима нема сладчајшег Господа Исуса да вечном сладошћу заслади њихово биће, њихово срце: срце истине, срце љубави, срце вечности … И да божанским смислом осмисли њихово биће и постојање. Без чудесног Господа Христа: и истина је мука и проклетство, и правда је мука и проклетство, и вечност је мука и проклетство, и сав живот је мука и проклетство, сав живот на земљи, сав живот на небу, сви животи колико их има у видљивим и невидљивим световима. А то, све то ја сам занавек осетио «откривењем Исуса Христа»: Он ми је открио и вечну природу истине, и вечну природу правде, и вечну природу вечности, и вечну природу човека и свих светова видљивих и невидљивих. А у свему томе и кроза све то – оно најважније и најглавније: вечну природу Јединог истинитог Бога и Господа. И у мене слабог и бедног човека Он је свемилостиво уселио сву Своју божанску љубав, и истину, и правду, и вечност. И ја сам прогледао свим очима душе и ума и срца и савести и тела, и угледао, занавек угледао и увидео: да је Христова истина – Једина Истина, једина Свеистина; Христова правда – Једина Правда, једина Свеправда; Христова љубав – једина Љубав, једина Свељубав; Христова вечност – једина Вечност, једина Свевечност; Христово Еванђеље – једино Еванђеље, једино Свееванђеље. И у њима – једини прави живот и људи и анђела, и Бога. Да, и Бога. Јер њиме живи и сам Бог = Господ Исус Христос. Све је то искључиво Његово, а постало је и наше, откако је Он, наднебесни Бог, постао човек, и живео међу нама на земљи као Богочовек, и остао такав у Цркви као Богочовечанском телу Свом. Очовечивиш се, Он је природи људској дао све Своје божанске силе и савршенства. И једино Њиме и у Њему природа људска је нашла свој вечни божански смисао, и циљ, и живот, и бесмртност, и вечност.'
        cn: 但是，所有这一切都已坍塌，无可挽回地毁坏了，当我看见复活的主耶稣在那不可言喻的光中突然向我显现，在去大马士革的路上。那时？那时我以我全部的生命感受到了：所有的真理、所有的公义、所有的不朽、所有的力量、所有的权能、所有的神性、所有的永恒、所有的价值，以及所有使人、使尘世、使万有得以站立和存在的一切，都在复活的主耶稣里。借着那次的显现，以及他向我这不配之人所作的许多其他显现，主基督永远地征服了我，为了所有的生命和所有的永恒。他不仅教导了我他的福音，并将它倾注于我，而且他带着他所有的神圣力量，带着他神圣的全能，进入了我，因着我对他的信仰（参 以弗所书 3:17），因着我对他的爱，住在我里面，我不再是我，而是基督在我里面活着（加拉太书 2:20）。哦！当奇妙的主基督在此，我自身算得了什么呢？唯有与他同在并借着他，我才感受到了生命和存在的全甜美喜乐，作人的喜乐。而在那之前呢？不，我不要任何属于我自己的东西！甚至没有他，我也不要我自己！我不要没有他的生命，我不要没有他的真理，我不要没有他的爱，我不要没有他的公义，我不要没有他的不朽，我不要没有他的永恒，我不要没有他的世界，我不要没有他的人，我不要没有他的天堂，我不要没有他的乐园，我不要没有他的上帝！哦，真理，爱，公义，不朽，永恒，天堂，乐园，世界，人，以及上帝——所有这一切都是监牢，监牢，监牢，如果其中没有那至甘甜的主耶稣，用永恒的甘甜使它们的本质，它们的心——真理的心，爱的心，永恒的心——变得甘甜，并以神圣的意义赋予它们的本质和存在以意义。没有奇妙的主基督：真理也是痛苦和咒诅，公义也是痛苦和咒诅，永恒也是痛苦和咒诅，所有的生命都是痛苦和咒诅，地上所有的生命，天上所有的生命，以及可见和不可见世界中所有的生命。而所有这一切，我都借着「耶稣基督的启示」永远感受到了：他向我启示了真理的永恒本质，公义的永恒本质，永恒的永恒本质，以及人与所有可见和不可见世界的永恒本质。而在所有这一切之中，并通过所有这一切——那最重要和最主要的——是独一真神和主宰的永恒本质。他极恩慈地在我这软弱又贫困的人里面，安置了他全部的神圣之爱、真理、公义和永恒。我以灵魂、心智、心、良知和身体的所有眼睛都看到了，永远看到了并领悟到：基督的真理是——独一的真理，独一的全真理；基督的公义是——独一的公义，独一的全公义；基督的爱是——独一的爱，独一的全爱；基督的永恒是——独一的永恒，独一的全永恒；基督的福音是——独一的福音，独一的全福音。而在它们之中——是人、天使和上帝独一的真正生命。是的，也是上帝的。因为上帝自己，即主耶稣基督，也借此而活。所有这一切都专属他，但也成了我们的，自从他，那超乎诸天之上的上帝，成为人，并作为道成肉身的神人，居住在我们中间，在地上，且以神人合一的身体，留在教会中，作为他的神人教会。当他道成肉身时，他将自己所有神圣的力量和完全性赋予了人类本性。并且唯有借着他并在他里面，人类本性才找到了其永恒的神圣意义、目标、生命、不朽和永恒。
    - type: paragraph
      text:
        ru: 'Све сам то доживео кроз откривење Господа Исуса Христа: и ево, све је то у мени живо и делатно. Бог ме призива благодаћу Својом, да јави Сина Свога у мени – Господа нашег Исуса Христа, Бога: да јави у мени Њега, вечнога Бога, не само Његову Истину, јер Он као Богочовек – и јесте сва Истина, јер Он – и јесте сва Правда, јер Он – и јесте сва Љубав, јер Он – и јесте сва Вечност. Васцело чудо Његовог јединственог човекољубља и састоји се у томе што је Он, бескрајни Бог и Господ, постао човек, и што се по смерности Својој, а ради вере наше, благодаћу усељује сав у нас људе. Па и у мене недостојног. А кад је Он у човеку, је ли онда ишта друго потребно човеку? Са Њиме, ја имам све и сва што ми као људском бићу треба за живот у овоме свету, и за вечни живот у свима световима кроз које Он води. За вечни живот имам сву вечну истину = Њега Богочовека; за вечни живот имам сву вечну правду = Њега, сву вечну љубав = Њега, све вечне божанске силе = Њега. Нашта ми онда људи? Зашто бих ја питао људе, питао тело и крв о истини, о правди, о животу, када је са мном и у мени једини истинити Бог и Господ = Он: Пут и Истина и Живот (Ин.14:6). Као Бог истинити и живи, Господ Христос ми је при првом јављању дао све то, и ја сам одмах свим бићем својим осетио да ми ништа више не треба сем Њега и Његовог Еванђеља. Зато ни тада не питах тела и крви, не питах људе,'
        cn: 我这一切都藉着主耶稣基督的启示而经历过；看哪，这一切在我里面是活泼且运行的。上帝以祂的恩典呼召我，使祂的儿子在我里面显现——我们的主耶稣基督，上帝：使祂，永恒的上帝，在我里面显现，不仅仅是祂的真理，因为祂作为道成肉身的神人，祂就是全部的真理，因为祂就是全部的公义，因为祂就是全部的爱，因为祂就是全部的永恒。祂独特爱人之心的全部奇迹就在于，祂，无限的上帝与主，成了人，又因着祂的谦卑，并为着我们的信心，祂以恩典完全居住在我们人类里面。甚至在我这不配的人里面也是如此。那么当祂在人里面时，人还需要什么别的吗？与祂同在，我拥有一切，拥有一切作为一个人，今生在这个世上所需的一切，以及祂所引领进入的一切世界中的永生。为了永生，我拥有全部永恒的真理 = 祂，神人；为了永生，我拥有全部永恒的公义 = 祂，全部永恒的爱 = 祂，全部永恒的神圣能力 = 祂。那么人们于我何用？我为何要去询问人们，询问血肉之躯关于真理、关于公义、关于生命的事呢，当独一真实的上帝与主 = 祂，与我同在，并且在我里面时：祂是道路、真理、生命 (约翰福音 14:6)。作为真实而活泼的上帝，主基督在祂第一次显现时就赐予了我这一切，我立刻以我全部的生命感受到了，除祂和祂的福音之外，我再不需要任何其他。因此，那时我也没有询问血肉之躯，没有询问人们，
    - type: paragraph
      text:
        ru: '1:17'
        cn: '1:17'
    - type: paragraph
      text:
        ru: 'не изиђох ни у Јерусалгш да питам апостоле који пре мене постадоше апостоли, него отидох у Арабију, да у посту и молитви усамљеничкој васцелог Христа пронесем кроз сво биће своје: кроз сву душу, и сво срце, и сву савест, и сво тело. Ништа ми није било потребно сем Њега: свесавршеног, свеблагог, свемилог, свеслатког, свеистинитог, свеправедног, свебесмртног, свевечног, сведовољног, свебожанственог. И још: да тамо у Арабиској пустињи и даље примам откривења од Господа Христа. Зато ми нису били потребни људи, нити икоји човек, да ме уче Евађељу Христовом, или нечему што ја нисам могао добити путем непосредног откривења од јединог истинитог Бога и Господа – Исуса Христа. Насамо са Богом мојим: у коме је све што треба људском бићу у свима световима.'
        cn: 我既没有去耶路撒冷请教那些在我以前成为使徒的人，而是去了阿拉伯，为要在禁食和独处的祷告中，将整全的基督遍及我全部的存在：遍及我全部的灵魂，我全部的心灵，我全部的良知，以及我全部的身体。我除了祂别无所求：全然完美、全然慈爱、全然可爱、全然甘甜、全然真实、全然公义、全然不朽、全然永恒、全然充足、全然神圣的祂。并且，为了在那阿拉伯的旷野中继续领受主基督的启示。因此，我不需要人们，也不需要任何一个人来教导我基督的福音，或是教导我任何我无法通过从独一的真神和主——耶稣基督那里所得到的直接启示而获得的东西。我只与我的上帝独处：在祂里面，人类在所有世界里所需的一切都已具备。
    - type: paragraph
      text:
        ru: '1:18'
        cn: '1:18'
    - type: paragraph
      text:
        ru: 'Дотле нисам познавао апостола Петра; тада изиђох у Јерусалим да се упознам са њим. Иако сам Еванђеље примио непосредно с неба од самог Господа Христа, ја сам знао по откривењу да се моје Еванђеље ни по чему не разликује од оног које су на земљи пре мене примили његови старији апостоли који су Га као ученици пратили још за Његова живота на земљи. Ја остадох петнаест дана у Петра, као брат у брата, као апостол у апостола, и ми свестрано расмотрисмо и видесмо да је у нас једно и исто Еванђеље, иста вера, иста истина, исте свете тајне, исте свете врлине, исти живот, све исто: јер и он и ја добили смо све то од једног и истог Бога и Господа – Исуса Христа. И не само он и ја, него'
        cn: 那时我还不认识使徒彼得；后来我去了耶路撒冷，为要与他相识。尽管我直接从天上，从主基督自己那里领受了福音，但我凭着启示知道，我的福音与那些早在我之前在地上领受福音的、在他地上生命中就作为门徒跟随他的那些资深使徒们的福音，没有任何不同。我在彼得那里住了十五天，如同弟兄与弟兄，使徒与使徒一般。我们全面审视后发现，我们拥有的是同一个福音，同样的信仰，同样的真理，同样的圣奥秘，同样的圣美德，同样的生活，一切都相同：因为他与我都是从同一位上帝和主——耶稣基督那里领受这一切的。不仅是他和我，而且
    - type: paragraph
      text:
        ru: '1:19'
        cn: '1:19'
    - type: paragraph
      text:
        ru: и сви остали апостоли, од којих тада видех само Јакова, брата Господњег. У том заједничком светом Еванђељу ништа није «по човеку», ништа од људи, од нас апостола, или других, који би измислили Еванђеље или што у њему, него је све и сва у нас од Господа Христа.
        cn: 以及所有其他的使徒，其中我那时只看到了雅各，主的兄弟。在那共同的神圣福音中，没有任何事物是「出于人」的，没有任何事物是出自人、出自我们使徒、或出自其他会编造福音或其中任何内容的人的，而是我们所拥有的一切皆来自主基督。
    - type: paragraph
      text:
        ru: '1:20'
        cn: '1:20'
    - type: paragraph
      text:
        ru: Да је тако, сведок је сам свеистинити Бог у Светој Тројици. У Јерусалиму ја ништа не добих од Петра и Јакова што нисам већ био добио од васкрслог Господа Исуса; нити они ишта рекоше против Еванђеља које ја проповедам, нити што супротставише. Да се тако нешто догодило, они би имали начина да то доставе свима хришћанима, па и вама Галатима.
        cn: 这样，圣三一中那全然真实的上帝本身就是见证。在耶路撒冷，我从彼得和雅各那里并没有得到任何我尚未从复活的主耶稣那里得到的东西；他们既没有对我所传的福音说任何反对的话，也没有提出任何异议。如果那样的事情发生过，他们本会有办法将它告知所有基督徒，包括你们加拉太人。
    - type: paragraph
      text:
        ru: '1:21'
        cn: '1:21'
    - type: paragraph
      text:
        ru: После боравка у Јерусалиму ја одох у Сирију и Киликију (ср.Деян.9:30), да тамо благовестим истину и радост о Христу. Јер Господ Христос није Спаситељ само за мене, него и за свако друго људско биће, и за све људе уопште. Радост спасења – то ме је носило на својим крилима из места у место, из града у град, из земље у земљу. Нема граница спасењу Христовом, јер нема граница злу које Сатана кроз грехе и страсти сеје по људским душама широм целе земље.
        cn: 在耶路撒冷停留之后，我去了叙利亚和基利家（参阅使徒行传 9:30），在那里宣扬关于基督的真理和喜乐。因为主基督不仅仅是我的救主，也是每一个其他人，以及所有人的救主。救恩的喜乐——是它托着我，展开翅膀，从一地到一地，从一城到一城，从一国到一国。基督的救恩没有界限，因为撒旦通过罪和情欲在全地的人类灵魂中所播撒的邪恶也没有界限。
    - type: paragraph
      text:
        ru: '1:22'
        cn: '1:22'
    - type: paragraph
      text:
        ru: 'У то време ја не бејах лично познат црквама Христовим у Јудеји, које су биле организоване од Јевреја који се из јеврејства обратише Христу. Али оно што је било главно о мени и у мени они су знали:'
        cn: 在那时，我个人并不被犹大地的基督教会认识，这些教会是由从犹太教归信基督的犹太人组建的。但关于我和在我里面主要的事情，他们都知道：
    - type: paragraph
      text:
        ru: 1:23–24
        cn: 1:23–24
    - type: paragraph
      text:
        ru: 'да сам ја онај који је некад лично гонио следбенике Христове, а сада проповедам веру коју сам некад раскопавао и хтео да уништим. И слављаху Бога због мене: што ја, некадањи гонитељ Цркве Христове, постадох апостол њен; што ја који некад гоњах оне који исповедаху васкрслог Исуса, постадох и сам исповедник те најрадосније истине за све људе свих времена. И заиста, нико као ја не слави Бога због тога што ме Он исцели од духовног слепила, те прогледах, и угледах једину истину земље и неба: чудесног Господа Исуса, у коме је сва истина свих небеса и свих светова, сва правда, сва доброта, сва љубав, сва милина, сва лепота, сав живот вечни, сва блаженства вечна, све вредности вечне, све радости вечне. И све то даровано нама, људима, од Јединог Човекољупца – Спаса Христа, тог јединог бића под небом и на небу, и на земљи, ради којега човеку и вреди живети не само један живот на земљи него и безброј хиљада живота у свима Божјим световима и Божјим вечностима.'
        cn: 我就是那个曾亲自迫害基督追随者的人，而现在，我宣讲我曾挖掘并意欲摧毁的信仰。他们因我而赞美上帝：因为我，这个曾迫害基督教会的人，成为了它的使徒；因为我，这个曾迫害那些承认复活的耶稣之人的人，自己也成了那对所有时代的所有人而言最喜乐真理的承认者。事实上，没有人像我这样赞美上帝，因为祂医治了我的属灵盲目，使我重见光明，并看见了天地间唯一的真理：奇妙的主耶稣，在祂里面有所有天堂和所有世界的一切真理，一切公义，一切良善，一切爱，一切甜美，一切美丽，一切永恒的生命，一切永恒的福乐，一切永恒的价值，一切永恒的喜乐。所有这一切都由独一爱人之主——救主基督——赐予我们人类，祂是天地间、在地上和天上唯一的存有，为了祂，人类才值得活，不仅是地上的一生，而且是在上帝所有世界和所有永恒中的无数万个生命。
  - type: heading2
    text:
      ru: Друга глава
      cn: 第二章
    children:
    - type: paragraph
      text:
        ru: 2:1–21
        cn: 2:1–21
    - type: paragraph
      text:
        ru: Гал.2:1–21:1Четрнаест година после тога, опет изиђох у Јерусалим са Варнавом, узевши са собом и Тита; 2 и то изиђох по откривењу, и изложих им еванђеље које проповедам међу незнабошцима, а нарочито угледнима, да не трчим или да не трчах узалуд. 3 Али ни Тит, који беше са мном, и беше Грк, не би натеран да се обреже, 4 и то због лажне браће која се тајно беху увукла и дошла да уходе слободу нашу коју имамо у Христу Исусу, да нас заробе. 5 Овима ми ни за часак не попустисмо, да истина еванђеља остане међу вама. 6 А угледни – какви били да били раније, мени је свеједно, јер Бог не гледа ко је ко – мени ти угледни ништа не дадоше, 7 него, напротив, видевши да је мени поверено еванђеље међу незнабошцима, као Петру међу обрезанима, 8 (јер онај који даде снаге Петру за апостолство међу обрезанима, онај даде снаге и мени за апостолство међу незнабошцима), 9 и познавши благодат која је мени дана, Јаков и Кифа и Јован, који се сматрају за стубове, дадоше мени и Варнави деснице заједнице, да ми идемо необрезанима а они обрезанима; 10 само да се сећамо сиромашних, што сам се и старао да чиним.
        cn: 加拉太书 2:1-101 十四年之后，我又与巴拿巴一同上耶路撒冷去，也带上了提多。2 我是奉启示上去的，把我在外邦人中所传的福音对他们陈述了，尤其是对那些有名望的人，免得我所奔跑的或已经奔跑的是徒然的。3 但是，连同我在一起的提多，他是个希腊人，也没有被强迫受割礼，4 只是因为有偷着引进来的假弟兄，他们偷偷地进来，为要窥探我们在基督耶稣里的自由，为要叫我们作奴仆。5 我们连一刻也没有向他们屈服，为要使福音的真理存留在你们中间。6 至于那些有名望的人，他们以前是怎么样，这与我无关紧要，因为上帝不以貌取人；那些有名望的人并没有加增我什么。7 反而，他们看见那传福音给外邦人的使命是托付给我了，就像传福音给受割礼之人的使命是托付给彼得一样；8 (因为那感动彼得，使他为受割礼之人作使徒的，也感动我，使我为外邦人作使徒。) 9 又知道所赐给我的恩典，雅各、矶法、约翰，那被视为教会柱石的，就向我和巴拿巴伸出友谊的右手，同意我们去传给未受割礼的人，他们去传给受割礼的人。10 只是要求我们记念穷人，这也是我一直努力去行的。
    - type: paragraph
      text:
        ru: '11 А кад Петар дође у Антиохију, у очи њему противстадох, јер беше зазоран. 12 Јер пре, док не дођоше неки од Јакова, он јеђаше с незнабошцима; а кад они дођоше, устручаваше се и одвајаше се, бојећи се оних из обрезања. 13 И дволичаху с њим и остали Јудејци, тако да и Варнава приста у њихово дволичење. 14 А кад видех да не иду право к истини еванђеља, рекох Петру пред свима: Кад ти, који си Јеврејин, незнабожачки а не јеврејски живиш, зашто нагониш незнабошце да живе јеврејски? 15 Ми који смо по рођењу Јевреји а не грешници из незнабожаца, 16 па знајући да се човек не оправдава делима закона, него само вером Исуса Христа, и ми поверовасмо у Христа Исуса, да се оправдамо вером Христовом, а не делима закона, јер се делима закона никакво тело неће оправдати. 17 Ако се пак ми, који тражимо да се оправдамо Христом, нађемо и сами грешници, је ли зато Христос слуга греху? Боже сачувај! 18 Јер ако опет зидам оно што развалих, показујем се да сам преступник. 19 Јер ја законом закону умрех, да Богу живим. С Христом се разапех: 20 и ја више не живим, него живи у мени Христос. А што сад живим у телу, живим вером Сина Божјега, који ме заволе и предаде себе за мене. 21 Не одбацујем благодати Божије; јер ако праведност кроз закон долази, онда Христос узалуд умре.'
        cn: 11 当彼得来到安提阿的时候，我当面抵挡了他，因为他是有可责之处的。12 因为他从前，在雅各那里的人未来以先，与外邦人一同吃饭；后来他们来了，他就退去与外邦人隔开了，因为他害怕那些奉割礼的人。13 其余的犹太人也跟着他一同假冒为善，甚至连巴拿巴也被他们的假冒为善所引诱。14 但我一看见他们行的不正，与福音的真理不合，就在众人面前对彼得说：「你既是犹太人，却像外邦人一样生活，不像犹太人一样生活，为何强迫外邦人像犹太人一样生活呢？」 15 我们这些生来就是犹太人，不是从外邦人中出来的罪人，16 既然知道人称义不是因律法的行为，乃是因信耶稣基督，我们也就信了基督耶稣，为要使我们因信基督称义，而不是因律法的行为；因为凡有血气的，都不能因律法的行为称义。17 倘若我们寻求在基督里称义的人，自己也发现是罪人，难道基督是罪的仆役吗？断乎没有！18 因为我若重新建造我所拆毁的，就证明自己是犯罪之人了。19 因为我藉着律法，对律法是死了的，为要使我为神而活。我已与基督同钉十字架，20 现在活着的不再是我，乃是基督在我里面活着。并且我如今在肉身活着，是因信神的儿子而活；他爱我，为我舍己。21 我不废弃神的恩典；因为如果称义是藉着律法而来，那么基督就是白白死了。
    - type: paragraph
      text:
        ru: '2:1'
        cn: '2:1'
    - type: paragraph
      text:
        ru: Еванђеље које сам добијао с неба непосредно од вазнесеног Господа, и откривења кроз која сам га добијао, ето то ме је водило и руководило у благовешћењу јединог Спаситеља и јединог спасења роду људском. Иако сам телом ходао по земљи, слухом сам, очима сам, душом сам, савешћу сам стално био на небу предстојећи чудесном Господу свеспасоносног Еванђеља, у беспрекорној и сверадосној послушности свему Његовом. Сав мој живот пуних четрнаест година био је Еванђеље у мени и око мене, Еванђеље не од човека ни по човеку већ васцело по Богочовеку, и свесрдно испуњавање благодаћу Божјом воље Господа Христа. Еванђеље у мени и ја у Еванђељу, ето то сам сав ја, и мене нема ван тога. Све што није од Христова Еванђеља, све што је ван њега – смрт је, пакао је, страшилиште је. У мом Еванђељу све је јасно, јер све обасјано незалазном светлошћу васкрслог Господа; у њему нема ничег подметнутог ни од анђела, а камоли од људи; све је у њему од Господа свевишњег. Али да се неки не би саблазнили о ово небеско Еванђеље, откривено ми и поверено ми с неба васкрслим Господом Христом, ја после четрнаест година опет изиђох у Јерусалим са Варнавом и Титом, са два сведока о небескости мога Еванђеља.
        cn: 我直接从升天的主那里，从天上领受的福音，以及我借此领受的启示，这引导并指引了我，在向人类传扬独一的救主和独一的救恩时。尽管我身体行走在地上，但我的听觉、视觉、灵魂、良知却一直都在天上，侍立在奇妙的、赐予全人类救恩的福音之主面前，在无可指摘、充满喜乐地顺服祂的一切之中。我整整十四年的人生，都是福音在我里面、在我周围，这福音不属乎人，也不藉着人，而是完全藉着神人，并且全心全意地藉着神的恩典来遵行主基督的旨意。福音在我里面，我在福音里面，这就是我的全部，我除此之外别无所有。凡不属基督福音的，凡在其之外的——都是死亡，都是地狱，都是可怖之处。在我的福音中，一切都是明晰的，因为一切都被复活之主那永不落的亮光所照耀着；其中没有任何掺杂的，既非来自天使，更非来自人类；其中一切都来自至高无上的主。然而，为免有人因这天上来的福音——这福音是复活的主基督从天上启示并托付给我的——而跌倒，我在十四年后，再次上耶路撒冷，与巴拿巴和提多一同，他们是我福音之属天性的两位见证人。
    - type: paragraph
      text:
        ru: '2:2'
        cn: '2:2'
    - type: paragraph
      text:
        ru: 'И то изиђох по откривењу, јер свезнајући Господ који зна срца свих, нађе за добро да изложим у Јерусалиму Еванђеље које проповедам међу незнабошцима, да би сви увидели да је оно исто са Еванђељем које проповедају и остали апостоли, и они најугледнији међу њима. И ја изложих своје Еванђеље нарочито најугледнијим апостолима. И моје Еванђеље, упоређено са њиховим, показа се потпуно исто, јер је од истог Господа, свемудрог и свеспасоносног. Иако сам од самог Господа знао, ја и од осталих апостола сазнадох, да нисам узалуд трчао, нити трчим: јер проповедам Вечно Еванђеље спасења.'
        cn: 我又是凭着启示上去的，因为全知的主深知万人的心，祂认为我应当在耶路撒冷陈明我在外邦人中所传的福音，好让众人看出，这福音与其余使徒，甚至他们当中最受尊崇的使徒所传的福音，是相同的。我特别向那些最受尊崇的使徒陈明了我的福音。我的福音与他们的福音相比较，证明是完全一致的，因为它来自同一位主，即全智全救的主。尽管我从主自己那里得知，我也从其余使徒那里得知，我没有徒然奔跑，现在也没有徒然奔跑：因为我所宣讲的是永恒的救赎福音。
    - type: paragraph
      text:
        ru: 2:3–4
        cn: 2:3–4
    - type: paragraph
      text:
        ru: 'У Христовом Еванђељу све је вечно; у њега су ушле и све вечне истине, уколико их је Господ открио у Старом Завету. А остало из Старог Завета, што је привремено и пролазно, не улази. Не улази обрезање, ни обредни закон и прописи. Међутим неким хришћанима из јеврејства хоће се да обрезање учине у хришћанству неопходним условом спасења. А то? То би обесланило со хришћанства, и претворило хришћанство у прање џбанова и чаша споља. Међутим, хришћанство је жива унутрашња духовна сила божанска, која преображава цело биће човеково изнутра ка споља, и спасава га Спаситељем Христом од греха, смрти и ђавола. Ту обрезање не помаже ништа, него Дух Свети који кроз свете тајне и свете врлине из основа препорађа човека и чини га новим бићем, и то богочовечанским бићем. Са тих разлога ни Тит, хришћанин из незнабожаца, који беше са мном, није могао бити натеран да се обреже, јер му обрезање није потребно за спасење. Стојећи сав за Еванђеље Христово, ја нисам ни хтео ни могао допустити да јеврејство постане услов за ступање у хришћанство, а најмање – услов за спасење хришћанина. И то не зато што презирем обрезање. Како могу презирати обрезање када знам да је и оно од Бога; када сам и сам доцније обрезао Тимотеја из обзира према слабијој браћи, али који то нису сматрали као неопходни услов спасења? Међутим у случају Тита нисам допустио обрезање због лажне браће који су хтели да обрезање учине неопходним условом спасења за хришћане, и на тај начин вас хришћане из незнабожаца заробе и поробе обредном закону јеврејском, и тако униште слободу коју имамо у Христу Исусу. Ко су та лажна браћа? Уходе од Јевреја који желе да униште Цркву Христову, и да је сву потчине и поробе јеврејству и њиховом закону. А ми знамо да тамо нема спасења, јер нема Спаситеља; тамо је све само припрема за Спаситеља и упућивање ка Спаситељу; а спасење је једино у Спаситељу, Господу Исусу Христу, Богочовеку. Спасење? – Ослобођење од греха, смрти и ђавола, које нам је само Господ Христос дао, и непрекидно даје. То је слобода, једина права слобода човекова у свима световима: слобода од греха, смрти и ђавола. И ту слободу, од које зависи човеков вечни живот, вечна истина, вечна правда, вечна љубав, вечна радост, вечно блаженство, ту слободу хоће да нам узму они који предлажу обрезање као неопходни услов спасења за хришћане из незнабоштва.'
        cn: '在基督的福音里，一切都是永恒的；其中也包含了所有永恒的真理，只要是主在旧约中启示的。而旧约中其余那些暂时且会消逝的，并不包含在内。割礼不包含在内，仪式的律法和规条也不包含在内。然而，一些从犹太教归信的基督徒，却想让割礼成为基督信仰中得救的必要条件。这样一来？这将使基督信仰失去其盐味，并将其变成徒有其表的清洗壶罐和杯子。然而，基督信仰是一种活的、内在的、属神的精神力量，它从内到外地改变了人的整个本性，并藉着救主基督将人从罪、死亡和魔鬼中拯救出来。在此，割礼毫无帮助，而是圣灵藉着圣事和圣洁的德行，从根本上重生了人，使他成为一个新造的生命，而且是神人性的生命。


          基于这些理由，提多——一位与我同在的外邦基督徒——未能被迫受割礼，因为割礼对他得救而言并非必需。我完全站在基督福音这一边，既不愿也不能允许犹太教成为加入基督信仰的条件，更不用说成为基督徒得救的条件。这并非因为我轻视割礼。我怎能轻视割礼，当我深知它也源自上帝？何况我后来自己也给提摩太行了割礼，是出于对软弱弟兄们的考虑，但他们并没有将此视为得救的必要条件。然而，在提多的案例中，我没有允许割礼，是因为那些假弟兄想使割礼成为基督徒得救的必要条件，并以此方式奴役和束缚你们这些外邦基督徒，使你们服从犹太人的仪式律法，从而摧毁我们在基督耶稣里所拥有的自由。


          这些假弟兄是谁？他们是犹太人派来的探子，想要摧毁基督的教会，并使其完全臣服并奴役于犹太教及其律法。而我们知道，在那里没有救恩，因为没有救主；那里的一切都只是为救主做的准备和指向救主；而救恩唯独在救主，主耶稣基督，这位神人之中。救恩是什么？——是从罪、死亡和魔鬼中得着释放，这是唯有主基督赐予我们，并持续赐予的。这就是自由，是人在所有世界中唯一的真正自由：即脱离罪、死亡和魔鬼的自由。而这种自由——人永恒的生命、永恒的真理、永恒的公义、永恒的爱、永恒的喜乐、永恒的福乐都仰赖于它——那些主张割礼是外邦基督徒得救的必要条件的人，正想夺走我们的这种自由。'
    - type: paragraph
      text:
        ru: '2:5'
        cn: '2:5'
    - type: paragraph
      text:
        ru: 'Зато ми, и ја и Тит, ни за тренутак не попустисмо, да би истина Еванђеља остала са вама и међу вама, хришћанима из незнабожаца. Да смо попустили, ми бисмо отерали истину Еванђеља од себе, а тиме и само спасење, а са спасењем и самог Спаситеља Господа Христа, у коме је сва Вечна Истина неба и земље, и сав истинити Бог свих светова, који једини спасава од ђавола и смрти и греха. У Христу Исусу сви смо једно, али не обрезањем, нити ичим јеврејским, већ Духом Светим који и гради од нас нове људе. Старо прође, све ново настаде. Прође стари човек, и настаде нови; пролазе стари људи, и настају нови, али у Богочовеку и Богочовеком, у Његовом Богочовечанском телу, у коме сви сачињавамо живе органске делове. Само тако ми осигуравамо слободу коју имамо у Христу Исусу: живећи у Њему и Њиме, по светим заповестима и светим врлинама Његовог Еванђеља, које је увек ново, и ми увек нови, ако смо у њему и живимо по њему и њиме. Знајући да је истинска слобода једино у Господу Христу, ми хришћани и јесмо хришћани само дотле док живимо у тој слободи и за ту слободу, и док смо увек готови умрети за њу.'
        cn: 因此，我们，我与提图斯，片刻也不妥协，好让福音的真理与你们这些外邦人基督徒同在，并存留在你们中间。如果我们妥协了，我们就会将福音的真理从我们自己赶走，随之也将赶走救恩本身，并随着救恩，也将赶走救主主基督本人。祂是天地间一切永恒真理的所在，也是诸世界全然真实的上帝，祂是唯一能将人从魔鬼、死亡和罪中拯救出来的。在基督耶稣里，我们都合而为一，但并非藉着割礼，也不是藉着任何犹太人的事物，而是藉着圣灵，祂将我们塑造成新的人。旧的过去了，一切都变成新的了。旧人过去了，新人诞生了；旧的人们正在过去，新的人们正在诞生，但皆在神人中，并藉着神人，在祂的神人身体中，我们所有人都构成活的有机肢体。唯有如此，我们才能确保在基督耶稣里所拥有的自由：活在祂里面，并藉着祂，按照祂福音中的神圣诫命和神圣美德。这福音永远是新的，而我们，若是在其中，并按其生活，藉着它生活，我们也永远是新的。深知真实的自由唯独在主基督里，我们基督徒，之所以是基督徒，仅仅在于我们活在那自由中并为那自由而活，并且只要我们时刻准备着为那自由而死。
    - type: paragraph
      text:
        ru: '2:6'
        cn: '2:6'
    - type: paragraph
      text:
        ru: 'Лажна браћа подмукло сеју лаж међу вама, лаж као да постоји неслагање између мене и осталих апостола у проповедању Еванђеља спасења. Међутим неслагања сада нема, иако га је нешто било пре Сабора у Јерусалиму (Деян.15:1–33). Сабор је једном занавек решио: да за Еванђеље Христово не постоји разлика између обрезаних Јевреја и необрезаних незнабожаца; пред њим они су једнаки; спасење почиње и завршава се Христом Спаситељем, зато су и услови спасења подједнаки за све људе, били они из Јевреја или из незнабожаца; незнабошцима није потребно да пролазе кроз јеврејство у хришћанство, него одмах непосредно ступају у хришћанство, као и Јевреји. Лажна браћа протурају вести против мене и Христовог Еванђеља које ја проповедам и о мом тобожњем неслагању са најугледнијим апостолима. То је њихова мила самообмана; уствари, међу нама нема не само никаквог спора него ни разлике откако је Сабор у Јерусалиму решио спорно питање о обрезању. У погледу Еванђеља мени истакнути апостоли ништа не дадоше, нити ја њима, јер смо и ја и они само слуге Господу Еванђеља, и Он исто Еванђеље даје и њима и мени. Ту ништа није од нас, осим нашег труда; а Еванђеље, од почетка до краја, од алфе до омеге, сво је од Господа Христа.'
        cn: 假弟兄阴险地在你们中间散布谎言，谎称我与其余使徒在传扬救恩的福音上存在分歧。然而，现在并无分歧，尽管在耶路撒冷会议（使徒行传 15:1-33）之前曾有过一些。会议一劳永逸地解决了：基督的福音不分受割礼的犹太人与未受割礼的外邦人；在祂面前，他们是平等的；救恩始于并终于基督救主，因此救恩的条件对所有人都是平等的，无论他们是犹太人还是外邦人；外邦人不需要借道犹太教而进入基督教，而是直接立即进入基督教，就像犹太人一样。假弟兄散布消息攻击我以及我所传扬的基督的福音，并且散布我与最受尊敬的使徒们所谓的不和。那是他们心爱的自我欺骗；实际上，自从耶路撒冷会议解决了关于割礼的争议问题以来，我们之间不仅没有任何争议，也没有任何分歧。在福音方面，那些杰出的使徒们没有给我任何东西，我也没有给他们任何东西，因为我与他们都只是福音之主的仆人，祂将同样的福音赐予他们，也赐予我。在这方面，没有任何东西是出自我们，除了我们的劳苦；而福音，从开始到结束，从阿尔法到欧米伽，完全是来自主基督。
    - type: paragraph
      text:
        ru: '2:7'
        cn: '2:7'
    - type: paragraph
      text:
        ru: 'Апостоли у Јерусалиму јасно су видели да је мени поверено Еванђеље међу незнабошцима,, као Петру међу обрезаним Јеврејима. Исто Еванђеље, јер један исти Спаситељ, и два апостола и две средине. Но ни моје ни Петрово апостолство није од нас самих већ од Господа Христа:'
        cn: 耶路撒冷的使徒们清清楚楚地看见，福音被托付给了我，使我在外邦人中传扬，就像彼得被托付在受割礼的犹太人中传扬一样，，这是同样的福音，因为有同一位救主，以及两位使徒和两个群体。但是，无论是我的使徒职分，还是彼得的使徒职分，都不是出自我们自己，而是出自主基督：
    - type: paragraph
      text:
        ru: '2:8'
        cn: '2:8'
    - type: paragraph
      text:
        ru: Он даје снаге Петру за апостолство међу обрезанима као што и мени даје снаге за апостолство међу незнабошцима. Јер ко сам ја Павле, да бих имао од себе снаге васкрсавати мртве, изгонити нечисте духове, отпуштати грехе, ослобађати свих смрти, побеђивати Сатану, исцељивати од свих болести? Те снаге нема нико од људи по себи, па ни Петар. Све божанске силе, сва божанска мудрост и љубав и правда и живот, све што сачињава апостолство, све је то потпуно и само од Господа Христа. А од нас, шта? Вера, љубав, молитва, пост, смиравање пред свим тим до црва.
        cn: 他赐予彼得在受割礼者中宣教的力量，也同样赐予我在外邦人中宣教的力量。因为我保罗算什么，竟能凭自己拥有使死人复活、赶逐污鬼、赦免罪孽、脱离一切死亡、战胜撒旦、医治一切疾病的力量呢？这种力量，无人能凭自己拥有，彼得也不能。一切神圣的能力，一切神圣的智慧、爱、公义和生命，一切构成使徒职分的，都完全且唯独来自主基督。而我们呢，又有什么呢？唯有信、爱、祷告、禁食，以及在这一切面前谦卑到如虫一般。
    - type: paragraph
      text:
        ru: '2:9'
        cn: '2:9'
    - type: paragraph
      text:
        ru: 'Благодат апостолства је иста у свих апостола, не изузимајући ни мене: сва им је дана од Господа Христа. Шта је благодат апостолства? Све оне божанске силе које су потребне за успешно проповедање Еванђеља: божанска мудрост, дар чудотворства, дар пророштва, дар исцељивања, дар речи; све оно што апостоле од људи чини апостолима, и што они као људи никада не би могли имати по себи и од себе. Ту благодат апостолства видеше у мени Јаков, Кифа и Јован, који се сматрају за стубове међу апостолима, и познаше да ми је она дата од самог Господа, зато се једнодушно сложише и пружише руку мени и Варнави да ми проповедамо Еванђеље необрезанима а они обрезанима. И ми и они увек у сагласности међу собом о Еванђељу спасења, под једним Господом и Спаситељем – Исусом Христом, и увек самостални: живећи у слободи Христовој смирено и у беспрекорној покорности Господу Спаситељу – творцу и извршитељу спасења и Еванђеља.'
        cn: 使徒职分的恩典在所有使徒身上都是一样的，也不例外地包括我：这恩典都是由主基督赐予他们的。什么是使徒职分的恩典呢？所有那些成功宣讲福音所必需的神圣能力：神圣的智慧、行神迹的恩赐、说预言的恩赐、医治的恩赐、讲道的恩赐；所有那些使使徒们从常人变为使徒的事物，以及他们作为人绝不能凭着自己和靠着自己拥有的事物。雅各、矶法和约翰在我身上看到了这使徒职分的恩典，他们被认为是使徒中的柱石，并且知道这恩典是由主亲自赐予我的。因此他们一致同意，并向我和巴拿巴伸出右手，让我们向未受割礼的人宣讲福音，而他们则向受割礼的人宣讲。我和他们总是在救恩的福音上彼此和谐一致，在同一位主和救主——耶稣基督之下，并且总是独立的：谦卑地活在基督的自由中，并无可挑剔地顺服主救主——救恩和福音的创造者和完成者。
    - type: paragraph
      text:
        ru: '2:10'
        cn: '2:10'
    - type: paragraph
      text:
        ru: Стубови апостола нам само препоручише да се сећамо сиромаха Јерусалимске цркве, хришћана из Јевреја, који су много патили од својих сународника Јевреја који су остали у јеврејству, и били због тога у великој оскудици. То сам се и старао да чиним са ревношћу, и чиним.
        cn: 使徒中的柱石仅仅建议我们，要记念耶路撒冷教会中那些犹太裔的基督徒穷人，他们因着留在犹太教中的同胞犹太人而遭受了许多苦难，因此他们极其贫困。我一直努力以热诚去这样做，并且我正在这样做。
    - type: paragraph
      text:
        ru: '2:11'
        cn: '2:11'
    - type: paragraph
      text:
        ru: 'У мени ништа није веће од Христове Истине, која ми је свемилостиво дарована чудесним Господом Исусом; ја ништа у себи не видим сем ње; и ако има у мени ревности и љубави и самопрегора, онда је све то за њу и ради ње. А та Истина, а та Свеистина јесте Еванђеље Христово, Еванђеље спасења и обожења рода људског. Без Њега – род људски није ништа друго сем лешина до лешине, које не знају за васкрсење из свога смрада, из својих безбројних смрти, из својих одвратних црвињака. Кад је у питању Еванђеље Христово, онда је све у питању, све и на земљи и на небу: у питању је и сам Бог. Јер како би бедни род људски могао знати за јединог истинитог Бога и Господа, да није Еванђеља Христовог? Кад је у питању Еванђеље Христово, онда је у питању не само наш земаљски свет, већ сви светови видљиви и невидљиви, јер сви они на њему стоје и ради њега постоје. Оно је једина свевредност, од које све остале вредности добијају своју вредност. Зато је оно једино непогрешиво мерило свих бића и ствари. Све што нема у себи духа његова лакше је од ништа, мртвије од смрти, немоћније од сенкине сенке. Апостол је њиме апостол, душа је њиме душа, спасење је њиме спасење, обожење је њиме обожење, истина је њиме истина, правда је њиме правда, љубав је њиме љубав, човек је њиме човек, вечност је њиме вечност, Христос је њиме Христос. Шта кажем? Бог је њиме Бог. Зато кад првоврховни апостол Петар дође у Антиохију, ја и њему у очи противстадох, јер беше заслужио осуду – ὅτι κατεγνωσμένος ἦν. Осуду? Да, јер је хтео да из човекоугодништва доведе у опасност Еванђеље спасења: да обредни закон јеврејски учини условом спасења за све хришћане.'
        cn: 在我里面，没有什么比基督的真理更大，这真理是奇妙的主耶稣满有恩慈地赐予我的；我在我里面除了它之外，什么也看不见；如果我里面有热忱、有爱和自我牺牲，那么这一切都是为了它并因它而有。而那真理，那全备的真理，就是基督的福音，是人类救赎和成神的福音。没有祂——人类无非是累累的尸骸，这些尸骸不知如何从自身的恶臭、从无数的死亡、从可憎的虫蛆中复活。当基督的福音事关重大时，一切都事关重大，地上和天上的一切；就连上帝本身也事关重大。因为若没有基督的福音，可怜的人类怎能认识独一的真神和主宰呢？当基督的福音事关重大时，事关的就不只是我们地上的世界，而是所有可见和不可见的世界，因为所有这些世界都建立在它之上，并为了它而存在。它是唯一的全备价值，所有的其他价值都从它那里获得其价值。因此，它是衡量所有存有和事物的唯一无误标准。一切自身没有其精神的，比虚无更轻，比死亡更死寂，比影子的影子更无力。使徒因它而成为使徒，灵魂因它而成为灵魂，救赎因它而成为救赎，成神因它而成为成神，真理因它而成为真理，公义因它而成为公义，爱因它而成为爱，人因它而成为人，永恒因它而成为永恒，基督因它而成为基督。我说什么呢？上帝因它而成为上帝。因此，当首席使徒彼得来到安提阿时，我当面抵挡了他，因为他已受定罪——ὅτι κατεγνωσμένος ἦν。定罪？是的，因为他想出于取悦人的动机，危害到救赎的福音：将犹太人的礼仪律法作为所有基督徒得救的条件。
    - type: paragraph
      text:
        ru: '2:12'
        cn: '2:12'
    - type: paragraph
      text:
        ru: Јер пре но што дођоше неки јерусалимски хришћани из Јевреја, он јеђаше са хришћанима из незнабоштва; а кад ови дођоше, он се устручаваше и одвајаше, бојећи се њих из обрезања, да их не саблазни.
        cn: 因为在一些原为犹太人的耶路撒冷基督徒来到之前，他曾与原为外邦人的基督徒一同吃饭；而当这些人来到时，他就退缩并且疏远了他们，害怕那些行割礼的人，以免使他们跌倒。
    - type: paragraph
      text:
        ru: '2:13'
        cn: '2:13'
    - type: paragraph
      text:
        ru: 'И дволичаху с њим и остали у Антиохији хришћани из Јевреја, тако да чак и Варнава приста у њихово дволичење. А то дволичење, куда води? Да ли к истини Еванђеља? Знам ја, знају и сви они, на челу са првоврховним, шта је истина у том погледу: Сабор у Јерусалиму казао нам је ту истину, и донео одлуку о односу обредног закона Мојсијевог према хришћанству (Деян.15:23–29). Знају они ту истину, јер на њој стоји спасење света незнабожачког.'
        cn: 在安提阿，其余的犹太籍基督徒也与他一同装假，以至于连巴拿巴也加入了他们的装假行为。而这种装假行为会引向何方？难道会引向福音的真理吗？我知道，他们所有人都知道，以首席使徒为首的他们都明白在这方面什么是真理：耶路撒冷公会议已经向我们阐明了这真理，并就摩西的礼仪律法与基督教的关系作出了决定（使徒行传 15:23-29）。他们知道那真理，因为外邦世界的救恩就建立在这真理之上。
    - type: paragraph
      text:
        ru: '2:14'
        cn: '2:14'
    - type: paragraph
      text:
        ru: 'Али њихово дволичење доводи у опасност ту истину; зато, када видех да не иду право к истини Еванђеља, рекох Петру пред свима: када ти, који си по рођењу Јеврејин, поставши ученик и апостол Христов живиш као и хришћани из незнабоштва а не по обредном закону, зашто хришћане из незнабоштва нагониш да живе по јеврејски: да испуњују прописе обредног закона о чистом и нечистом, и остала предања јеврејска? Ти си на Сабору говорио: Што кушате Бога, и хоћете да хришћанима метнете јарам обредног закона, који ни оцеви наши ни ми не могосмо понети. Ми верујемо да ћемо се спасти благодаћу Господа Исуса Христа као и они (Деян.15:10–11). Ти знаш одлуку Сабора: обрезање, и обредни закон, нису услов спасења; а сада, бојећи се ових хришћана из обрезања, хоћеш да и хришћане из незнабожаца саблазниш и спасење њихово доведеш у питање, поступајући као да је обредни закон Мојсијев обавезан за хришћане.'
        cn: 但是，他们的虚伪危及那真理；因此，当我看到他们没有直行福音的真理时，我当着所有人的面对彼得说：当你，一个生来是犹太人，成为基督的门徒和使徒之后，像外邦基督徒一样生活，而不按照礼仪律法时，为什么却强迫外邦基督徒像犹太人一样生活：去遵行关于洁净与不洁净的礼仪律法规定，以及其他的犹太传统？你在公会议上曾说：「为什么试探上帝，却想把礼仪律法的轭加在基督徒身上，是我们列祖和我们都不能承受的？我们相信，我们得救是借着主耶稣基督的恩典，正如他们一样。」（使徒行传 15:10-11）你知道公会议的决定：割礼和礼仪律法都不是得救的条件；而现在，你却惧怕这些受割礼的基督徒，想使外邦基督徒跌倒，并使他们的救恩受到质疑，你的行为仿佛摩西的礼仪律法对基督徒是强制性的。
    - type: paragraph
      text:
        ru: 2:15–16
        cn: 2:15–16
    - type: paragraph
      text:
        ru: 'Ми као Јевреји по рођењу знамо истинитог Бога, док незнабошци не знају истинитог Бога (ср.Еф.2:12), и на свету су робови греха и незнања (ср.Еф.2:3). И ми знајући истинитог Бога, знамо и Његов закон, и шта Он тражи од нас. Ми из искуства знамо да нам закон Мојсијев не даје спасење, не оправдава нас пред Богом за грехе наше, не скида их с нас, јер нема моћи. А поставши хришћани, ми опет из искуства знамо: да нас вера у Исуса Христа спасава од греха, смрти и ђавола. Да вера у Исуса Христа а не дела Мојсијевог закона, јер се делима Мојсијевог закона никакво тело не може оправдати, тојест постати праведно пред Богом и у души својој. Само вера Христова испуњује биће људско праведношћу и светошћу, и чини човека праведним и оправданим пред Богом. Јер нам само вера Христова дарује све божанствене силе које су бићу људском потребне за вођење побожног, вечног живота овде на земљи и горе на небу. Цео Стари Завет само води и приводи ка Христу, једином Спаситељу рода људског, јер ни у коме другом нема спасења, пошто нема другога имена под небом данога људима којим би се могли спасти (Деян.4:11–12), зато што Он као Богочовек једини има моћи да спасе, и спасава, свако људско биће од греха, смрти и ђавола. Стари Завет само води ка спасењу, ка светости, ка праведности, ка оправдању, које се једино у Господу Христу остварује, и то нашом вером у Њега и нашим животом по тој вери.'
        cn: 我们作为生来的犹太人，认识真神，而外邦人却不认识真神（参以弗所书 2:12），并且在世上是罪和无知的奴仆（参以弗所书 2:3）。我们既然认识真神，就也认识祂的律法，以及祂对我们的要求。我们从经验中得知，摩西的律法不能赐予我们救恩，不能为我们的罪在神面前称义，也不能将罪从我们身上除去，因为它没有能力。而当我们成为基督徒后，我们又从经验中得知：对耶稣基督的信仰能将我们从罪、死亡和魔鬼中拯救出来。是对耶稣基督的信仰，而非摩西律法的行为，因为靠摩西律法的行为，没有任何血肉之躯可以在神面前称义，也就是说，在神面前和在自己的灵魂中都无法成为公义的。唯有基督的信仰能使人的存在充满公义和圣洁，并使人在神面前成为公义并蒙称义。因为唯有基督的信仰赐予我们一切神圣的能力，是人类存在所必需的，以便在此世和天上过虔敬的、永恒的生命。整个旧约唯独引领并导向基督，人类唯一的救主，因为在除祂以外，别无拯救，因为在天下人间，没有赐下别的名，我们可以靠着得救（使徒行传 4:11-12），又因为祂作为神人，是唯一有能力拯救，并拯救每一个人类存在脱离罪、死亡和魔鬼的。旧约只导向救恩、圣洁、公义、称义，而这一切唯独在主基督里得以实现，并且是藉着我们对祂的信仰以及我们按此信仰而活的生命。
    - type: paragraph
      text:
        ru: '2:17'
        cn: '2:17'
    - type: paragraph
      text:
        ru: 'Ми смо апостоли свесни, и ми хришћани из јеврејства, да је једино у Христу оправдање наше, спасење наше, и не само наше него и сваког човека уопште, и свих људи скупа. И зато смо оставили Мојсијев закон. Међутим, ако се сада поново будемо вратили Мојсијевом закону као неопходном за спасење људи, онда тиме признајемо да смо се огрешили о Мојсијев закон пошто смо примили Христа као јединог Спаситеља. И још нешто: је ли због тог нашег греха према Мојсијевом закону крив и сам Христос? је ли зато и Он слуга томе греху? Боже сачувај! Јер Христос је дошао да нам буде Спаситељ зато што старозаветни закон то није могао бити. И Господ Христос је Собом испунио и заменио Закон, и дао себе за спасење света, и као Богочовек постао једини Спаситељ рода људског под небом. И сада, ако ми сматрамо себе да смо грешници зато што држимо да нас закон Мојсијев не може спасти, је ли због тога Христос слуга том нашем греху? Боже сачувај! Него је тај грех – наш трех, а не Христов.'
        cn: 我们这些使徒深知，我们这些从犹太教出来的基督徒也深知，唯独在基督里才有我们的称义和救赎，不仅是我们的，也是所有世人以及全人类的称义和救赎。因此，我们已经放弃了摩西律法。然而，如果我们现在再次回到摩西律法，认为它是人类得救所必需的，那么，我们就是承认，因为我们接受了基督为唯一的救主，所以我们犯了摩西律法的罪。还有一点：难道基督本人也因我们对摩西律法所犯的罪而有罪吗？难道他也因此成为那罪的仆人吗？断乎不可！因为基督来作我们的救主，是因为旧约律法无法做到这一点。主基督已亲自成全并取代了律法，并为世界的救赎献上了自己，并作为神人成为天下人类唯一的救主。那么现在，如果我们认为自己是罪人，因为我们坚持摩西律法无法拯救我们，基督是否因此成为我们那罪的仆人呢？断乎不可！相反，那个罪是我们的罪，而不是基督的罪。
    - type: paragraph
      text:
        ru: '2:18'
        cn: '2:18'
    - type: paragraph
      text:
        ru: 'Шта ми у том случају радимо? Безуман посао: зидамо оно што развалисмо; васпостављамо Мојсијев закон који је Христом испуњен и замењен. А то је већ преступ, и ја се показујем као преступник: јер после Христа, који је уклонио Закон, враћамо Закон и приписујемо му силу спасења и силу оправдања, које он у себи нема. После Господа Христа и Његовог Еванђеља држати Закон – преступ је не само према Еванђељу, него је преступ и према самом Мојсијевом закону који је као немоћан и беспомоћан довео до Христа и Еванђеља и онда им уступио место. Желећи да обредни закон старозаветни наметнемо незнабошцима који прелазе у хришћанство, да га учинимо саставним делом Христовог Еванђеља спасења, ми уствари рушимо Еванђеље а поново из рушевина дижемо обредни закон који је и постојао зато да нас припреми за Еванђеље спасења, и када се оно јави, да нас потпуно препусти њему. Штавише, ми смо преступници и према самом том Закону који је нашао своје испуњење и свој завршетак у Христу Исусу (ср.Рим.10:4).'
        cn: 在那种情况下，我们做了什么呢？我们做了一件愚蠢的事：我们重建了我们所拆毁的；我们重新确立了那已被基督成全并取代的摩西律法。而那已经是逾越了，我自己也显明为一名逾越者：因为在基督——祂已废除了律法——之后，我们又恢复律法，并将其不具备的救赎之力和称义之力归于它。在主基督和祂的福音之后仍然遵守律法——这不仅是对福音的逾越，也是对摩西律法本身的逾越，因为摩西律法作为无能为力且软弱的，已将我们引向基督和福音，然后便将自己的位置让给了它们。我们若想将旧约的仪文律法强加于归信基督教的异教徒，使之成为基督救赎福音不可分割的一部分，那么我们实际上是在摧毁福音，并再次从废墟中重建了那原本是为了预备我们迎接救赎福音而存在的仪文律法，而当福音显现时，它就应将我们完全托付给福音。不仅如此，我们也是对那已在基督耶稣里找到其成全和终结的律法本身的逾越者（罗马书 10:4）。
    - type: paragraph
      text:
        ru: '2:19'
        cn: '2:19'
    - type: paragraph
      text:
        ru: 'Старозаветни закон је имао за циљ: да ме приведе Христу, који је «свршетак закона» (Рим.10:4). Извршивши ту дужност, Закон је престао да ме води, јер то сада чини сам вечни Бог и Господ – Исус Христос; зато сам ја мртав Закону, и то на захтев самог Закона који ме привео Христу и предао Њему заувек, и тако ја уствари Законом Закону умрех. Међутим, ако бих се сада поново враћао Закону, ја бих се огрешио о сам Закон, који је зато и дат Богом да нас припреми и приведе Христу, па да онда престане. Ја Законом Закону умрех, да Христу Богу живим и у овом временском и у оном вечном животу, јер је Он ради тога и дошао: да људима да живот вечни (ср.Ин.17:2–3, 3:15–16:36, 5:24, 6:47;1Ин.3:15, 5:11–20). И тај живот вечни Господ Христос даје целокупним Својим Богочовечанским подвигом спасења, који врхуни у Његовом животворном и животодавном крсту. И вечни живот је живот у Христу, Христом и са Христом; спасење је у доживљавању Њега у Његовом Богочовечанском животу; спасење је живот у Спаситељу и по Спаситељу. А сврх свега, спасење је сараспињање себе распетом Христу; и ја се с Христом разапех, да бих с Христом васкрсао у живот вечни, победивши све смрти, све грехе, све ђаволе. Несумњива је истина: ко се сараспиње с Њим, тај и саваскрсава с Њим; јер кад смо једнаки с Њим једнаком смрћу, бићемо и васкрсењем (Рим.6:6). Свепобедним крстом Својим Господ је убио и смрт и грех и ђавола (ср.Кол.2:13–15); тако их и ми убијамо само сараспињући се Христу. Отуда, који су Христови – распињу тело са страстима и жељама, а живе и ходе Духом Светим (ср.Гал.5:24–25). С Христом се разапех, и тако умртвих грех, умртвих смрт, умртвих ђавола, и саваскрснух са Христом у нови, вечни живот, који је сав у Христу и од Христа:'
        cn: 旧约律法的目的是：要把我引到基督那里，他是「律法的总结」（罗马书 10:4）。履行了这项职责后，律法就不再引导我了，因为现在做这件事的是永恒的上帝和主——耶稣基督自己；所以我向律法死了，而且这是应律法本身的要求，是律法把我引到基督那里，并把我永远地交给了祂，这样，我实际上是「借着律法向律法死了」。然而，如果我现在再次转向律法，我就会违背律法本身，律法正是为此目的由上帝赐予的，即预备我们并引我们到基督那里，然后便止息。我借着律法向律法死了，为要向基督上帝活着，在这现世的生命中和那永恒的生命中，因为祂正是为此而来的：要赐予人们永生（参约翰福音 17:2-3，3:15-16:36, 5:24, 6:47；约翰一书 3:15，5:11-20）。而这永生，主基督借由祂那完全的、神人一体的救赎功迹赐予，这功迹以祂赐予生命、赋予生命的十字架为顶峰。永生是「在基督里」、「借着基督」并「与基督同在」的生命；救赎在于在祂神人一体的生命中体验祂；救赎是「在救主里」并「效法救主」的生活。最重要的是，救赎是将自己与被钉十字架的基督一同钉死；我已与基督同钉十字架，为要与基督一同复活进入永生，战胜了一切死亡、一切罪恶、一切魔鬼。毫无疑问的真理是：凡与祂一同被钉十字架的，也必与祂一同复活；因为我们既然与祂一同经历同等的死，也必一同经历复活（罗马书 6:6）。主借由祂那全然得胜的十字架，击杀了死亡、罪和魔鬼（参歌罗西书 2:13-15）；我们也唯有藉着与基督一同钉十字架来击杀它们。因此，那些属基督的人——就把肉体连同肉体的邪情私欲一同钉在十字架上，而靠着圣灵而活并生活行事（参加拉太书 5:24-25）。我已与基督同钉十字架，如此就使罪死了，使死亡死了，使魔鬼死了，并与基督一同复活进入新的、永恒的生命，这生命完全在基督里，并源于基督：
    - type: paragraph
      text:
        ru: '2:20'
        cn: '2:20'
    - type: paragraph
      text:
        ru: 'и ја више не живим, него живи у мени Христос. Како? Кроз Своје свете тајне и свете врлине, преко којих ме свемилостиво испуњује Вечном Истином, Вечном Правдом, Вечном Љубављу, Вечним Животом: Собом – јединим истинитим Богом и Господом. А све то ја сам никада не бих могао дати себи, нити би ми ико од људи то могао дати. Где је та сила у људима, у човеку уошпте, која им може дати Живот Вечни, Истину Вечну? Кратке су и немоћне мисли човекове, кратка и немоћна осећања, кратак и немоћан живот, кратка и немоћна снага, јер их непрестано нагризају, смањују, умртвљују греси, страсти, смрти, ђаволи. Једино са Господом Христом све се у човеку мења: из пролазног у непролазно, из смртног у бесмртно, из временског у вечно, из човечјег у богочовечно. Јер једини Он, Вечни Бог и Господ, човекову мисао преображава у богомисао, и тако је чини вечном; и човеково осећање у богоосећање, и тако га чини вечним; и човеков живот у богоживот, и тако га чини вечним; и човекову снагу у богоснагу, и тако је чини вечном. И када у мени благодаћу живи Христос, Он живи у мени Својом Вечном Истином, – а ко ће њу усмртити? Он живи у мени Својом Вечном Љубављу, – а ко ће њу умртвити? Он живи у мени Својим Вечним Животом, – а ко ће њега убити? Он живи у мени Својом Вечном Правдом, – а ко ће њу уништити? Он живи у мени пуноћом Свога Божанства, – а ко ће ту пуноћу окрњити? Васцела тајна живота је у Њему, и у њој васцела тајна Истине и Правде и Бога, јединог истинитог Бога у свима световима. А ван Њега – све сама смрт, језива, ужасна, наказна. Јер без Њега и ван Њега живот није друго до постепено или нагло умирање у мукама, у страстима, у гресима; умирање кроз мисли, кроз осећања, кроз жеље, кроз дела; умирање које се неминовно завршава вечном духовном смрћу, у којој вечито? – Непрекидно самоубијање, самопрождирање, самовијање обезбожене самосвести. Мој живот без Њега? Та то је непрекидно вихорење свих вихора смрти кроз све урвине мога људског бића. Чиме ћу зауставити то моје језиво умирање кроз све мисли, кроз сва осећања, кроз сва дела, кроз све животе? Ничим, ничим, ничим! и никим, никим, никим! до само – Њиме, чудесним Богочовеком, сладчајшим Господом Исусом. Јер само Он, сјединивши у Себи васцелог Бога са васцелим човеком, Својим Божанством дао је природи људској вечни живот и вечну истину. И у Богочовечанском телу Његовом, Цркви, ми се приопштавамо томе вечном животу, и живимо њиме стварно и истински још овде на земљи, да се то продужи и кроз сву вечност на небу. Само као сутелесници Богочовекови ми постајемо поседници тог истински вечног живота (ср.Еф.3:6), и испуњујемо се «сваком пуноћом Божијом» (Еф.3:19), и тиме побеђујемо сваку смрт и – све смрти, сваки грех и – све грехе, сваког злодуха и – све злодухе, доживљујући божанску пуноћу људскога бића у свима њеним савршенствима. И тако Христови људи постају «богови по благодати», богољуди по благодати, и на тај начин испуњују главно назначење човекова бића у овом свету. Јер шта је човеково главно, Богом одређено, назначење? Да путем светих еванђелских тајни и врлина порасте «у човека савршена, у меру раста висине Христове – εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ» (Еф.4:13; ср.Кол.1:28), да васцело биће своје испуни Господом Христом, свим Његовим богочовечанским силама, и тако живи богочовечанским животом и у овом и у оном свету. И Христов човек свим бићем осећа да је сав живот људски од почетка до краја дар Христов, па и сам живот у телу сав је тајном својом и силом својом од Њега. И што ја сад живим у телу, живим вером Сина Божјег који ме заволе и предаде себе за мене, иначе би ми хиљаде смрти досад украле и душу и тело. Но свемилостиви Господ, Једини Човекољубац, који једини потпуно зна немоћ природе људске, предаде себе за мене, да би ме избавио од вечне смрти у коју ми васцело биће уваљују греси. Вера ме духовно сједињује са Господом Христом, извором живота, и ја њоме црпим из Њега живот, прави живот и телу моме. Јер шта је живот у телу људском ако у њему нема Бога? Пакао један, и два и три и четири и хиљаде паклова: свака ноћ у телу без Бога – пакао, сваки дан; и не само то, него и сваки час и сваки тренутак – пакао. Да, то је био, и то би занавек остао живот човеков у телу, да у тело људско није сишао и оваплотио се чудесни Бог и Господ Исус Христос, да га испуни Собом, и тако претвори у храм, у обиталиште истинитога Бога, и на тај начин истера из њега све смрти, све грехе, све злодухе, и учини га достојним божанске бесмртности и блаженства и раја у Својој Божанској вечности. Господ се са телом вазнео на небо, и вечито живи у телу на небу с десне стране Бога Оца, изнад свих сунцезрачних Серафима и Херувима; и на тај начин уздигао и узвеличао тело славом коју ум људски ни замислити не може, и зацарио га у вечном царству Тросунчаног Божанства. И ја, што живим у телу, живим вером Сина Божјег, јер ми је једино та вера открила смисао, божански смисао тела људског: да је и оно за Господа и за Његову Божанску вечност, и да је Господ за тело (1Кор.6:13). Тек у Богочовеку тело је добило своју вечност кроз богочовечност, и добија је кроз благодатно обогочовечење у Богочовечанском телу Христовом – Цркви.'
        cn: '不再是我活著，乃是基督在我里面活著。如何？藉著祂的神圣奥秘和神圣美德，祂借此以永恒真理、永恒公义、永恒之爱、永恒生命，即祂自己——独一的真神与主——充满我，满有慈悲。而这一切，我本身从未能够给予自己，世上也没有任何人能将其给予我。在人们之中，在普遍意义上的人类之中，哪里有那种能给予他们永恒生命、永恒真理的力量呢？人类的思想短暂而无力，情感短暂而无力，生命短暂而无力，力量短暂而无力，因为罪恶、情欲、死亡、魔鬼持续不断地侵蚀、削弱、置之于死地。


          唯有与主基督同在，人的一切才会改变：从必朽坏的到不朽坏的，从必死的到不死的，从时间性的到永恒的，从人性的到神人性的。因为唯有祂，永恒的上帝与主，将人的思想转变为神性思想，并使之成为永恒；将人的情感转变为神性情感，并使之成为永恒；将人的生命转变为神性生命，并使之成为永恒；将人的力量转变为神性力量，并使之成为永恒。


          当基督藉著恩典活在我里面时，祂以祂的永恒真理活在我里面——谁能使之灭亡呢？祂以祂的永恒之爱活在我里面——谁能使之枯萎呢？祂以祂的永恒生命活在我里面——谁能将之杀死呢？祂以祂的永恒公义活在我里面——谁能将之毁灭呢？祂以祂神性的丰盛活在我里面——谁能削减这丰盛呢？生命的全部奥秘都在祂里面，而在这奥秘中，真理、公义和上帝，即普世独一的真神，的全部奥秘也都在其中。而在祂之外——一切尽是死亡，可怖、骇人、畸形。因为没有祂，在祂之外，生命不过是在痛苦、情欲、罪恶中，或渐进或突然的死亡；是透过思想、情感、欲望、行为而来的死亡；是必然以永恒的精神死亡告终的死亡，在其中永恒地是什么？——是去神化的自我意识不断地自我毁灭、自我吞噬、自我折磨。


          我没有祂的生命？那是不断地有死亡的漩涡，穿过我人性的所有深渊而呼啸盘旋。我将用什么来阻止这可怖的死亡，它穿过我的所有思想、所有情感、所有行为、所有生命？什么也不能，什么也不能，什么也不能！任何人都不能，任何人都不能，任何人都不能！唯有——祂，那奇妙的神人，最甜美的主耶稣。因为唯有祂，在祂自己里面将完全的上帝与完全的人结合，以祂的神性赋予人性永恒的生命和永恒的真理。而在祂的神人合一的身体——教会中，我们得以分享那永恒的生命，并在此世真实且确切地活出这生命，使之延续到天上的一切永恒。唯有作为神人的同肢体（以弗所书 3:6），我们才成为那真正永恒生命的拥有者，并充满「上帝一切的丰盛」（以弗所书 3:19），从而战胜一切死亡——以及所有的死亡，一切罪恶——以及所有的罪恶，一切恶灵——以及所有的恶灵，在人类存在的全部完美中体验神性的丰盛。


          因此，属基督的人们藉著恩典成为「神」，藉著恩典成为神人，并以此方式完成人类存在于此世的主要使命。因为人类主要且由上帝所定的使命是什么？是藉著神圣的福音奥秘和美德，成长「直到满有基督长成的身量 – εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ」（以弗所书 4:13；参阅歌罗西书 1:28），用主基督、祂所有神人合一的力量充满自己的全部存在，并以此在今世和来世都活出神人合一的生命。


          属基督的人以全部的存在感受得到，从始至终人类的一切生命都是基督的恩赐，甚至身体中的生命也完全以其奥秘和力量来自于祂。而我现在活在肉身中，是凭借著上帝之子的信心而活，祂爱我并为我舍弃自己，否则至今已有千百种死亡会窃走我的灵魂和身体。然而，那满怀慈悲的主，独一的爱人者，唯独祂完全深知人性的软弱，祂为我舍弃自己，为要将我从永恒的死亡中拯救出来，因罪恶将我的全部存在推入其中。


          信心在灵性上将我与生命之源主基督联合，我借此从祂那里汲取生命，这真正的生命也赐予我的身体。因为如果人的身体中没有上帝，那样的生命是什么？那是单单一个地狱，甚至两个、三个、四个、千百个地狱：每个没有上帝的夜晚在身体中——是地狱，每个白天也是；不仅如此，甚至每个小时和每个片刻——都是地狱。是的，这曾经是，而且将永远是人身体中的生命，如果奇妙的上帝与主耶稣基督没有降临并道成肉身于人体之中，用祂自己充满它，并因此将它转变为一座圣殿，成为真神的居所，并以这种方式将其中所有的死亡、所有的罪恶、所有的恶灵驱逐出去，使它在祂的神圣永恒中配得神性的不朽、至福和天堂。


          主带著身体升上高天，在天上，祂永远以身体活在父上帝的右边，超越所有如阳光般耀眼的撒拉弗和基路伯；并以此方式提升和荣耀了身体，以人类心智甚至无法想像的荣耀，并使它在三一上帝的永恒国度中作王。而我，既然活在身体中，是凭借著上帝之子的信心而活，因为唯独这信心向我揭示了人体的意义，即神圣的意义：它也为著主和祂的神圣永恒，并且主也为著身体（哥林多前书 6:13）。唯有在神人基督里，身体才藉著神人合一的本质获得了它的永恒，并透过在基督的神人合一的身体——教会中藉著恩典的神人合一化而获得它。'
    - type: paragraph
      text:
        ru: '2:21'
        cn: '2:21'
    - type: paragraph
      text:
        ru: 'За сваког човека који очима нормално гледа, и ушима нормално чује, и умом нормално расуђује, и срцем нормално осећа, очигледно је до најопипљивије, до вечне убеђености, да је једино у Господу Христу спасење и оправдање рода људског, и сваког човека посебно. То је благодат Божја, изливена на нас спасоносним богочовечанским подвигом Господа Исуса. Одбацити ту благодат, исто је што и одбацити спасење рода људског од греха, смрти и ђавола, и осудити га на живот у хиљаде и хиљаде паклова. Старозаветни закон је био немоћан да нас спасе од троглавог но троједног чудовишта: греха, смрти и ђавола. Он нас је само привео к Спаситељу, а Спаситељ нас је спасао Својим чудесним богочовечанским подвигом. Јер да је Закон могао спасти род људски, Господ Христос не би ни сишао с неба на земљу, не би постао човек, не би умро за нас, не би васкрсао за нас, за спасење наше, за оправдање наше. А када је човекољубиви Господ Христос већ дошао и извршио спасење рода људског, онда је безумље враћати се Старозаветном закону и од њега очекивати спасење.'
        cn: 对于每一个眼睛正常视物，耳朵正常听闻，思想正常判断，心灵正常感受的人来说，都显而易见，直至最真切可感、达致永恒的笃信：唯有在主基督里，才有全人类以及每个个体的人的救赎与称义。这是上帝的恩典，借由主耶稣那拯救性的神人功绩倾注在我们身上。拒绝那恩典，等同于拒绝全人类从罪、死亡和魔鬼中得到的救赎，并将其判入千千万万地狱的生活。旧约律法无法拯救我们脱离那三头却又是三位一体的怪物：罪、死亡和魔鬼。它只是将我们引向救主，而救主则以祂奇妙的神人功绩拯救了我们。因为如果律法能拯救全人类，主基督就不会从天上降到地上，也不会成为人，不会为我们而死，不会为我们而复活，为了我们的救赎，为了我们的称义。既然那位爱人的主基督已经降临，并已完成了全人类的救赎，那么再回到旧约律法并从中期望救赎，便是愚昧。
