    - type: paragraph
      text:
        ru: 'Хришћани смо, ако Духом Светим живимо. Јер тада у духу нашем и у телу нашем неће бити места ни за какав грех, ни за какво зло, ни за какву смрт, ни за каквог ђавола. Ако Духом Светим живимо, нема смрти у нама; све је у нама живо за сваку Божју истину и правду и добро. Ако Духом Светим живимо, нема ничег смртног у нама: а смртан је само грех, и све што вуче у грех или долази од греха. Но ми можемо Духом Светим живети, ако Духом Светим и ходимо; а ходимо Њиме, ако свете заповести Његове држимо, ако свете врлине Његове творимо, ако нам све бива по светој вери, по светој љубави, по светој кротости, по светој смерности, по светом посту, по светом уздржању, по светом трпљењу. Ми кроз овај свет ходимо Духом Светим, ако ходимо Његовим светим тајнама и светим врлинама. Тада ум наш мисли – Њиме, срце наше осећа – Њиме, савест наша суди – Њиме, воља наша хоће – Њиме, чула наша делају – Њиме; једном речју: сав живот и духа и тела нашег бива – Њиме. У самој ствари ми хришћани нисмо своји већ Божји. А постајемо себи своји, једино Духом Светим. Јер Он нас помоћу светих тајни и светих врлина враћа нама самима, дајући нашем боголиком бићу божанску праведност, божанску светост, божанску бесмртност, божанску вечност. И тек тада дух наш осећа да је заиста свој, бесмртно свој, вечито свој, божански свој, свето свој, радосно свој. Не треба се варати: ми не припадамо себи, све док припадамо греху. Јер припадамо ли њему – припадамо туђинцу; а преко њега – још свирепијем туђинцу: смрти; а преко смрти – најсвирепијем туђинцу бића људског: ђаволу, свемоћном цару и господару у царству греха и смрти – паклу.'
        cn: 我们是基督徒，如果靠着圣灵而活。因为那时，在我们灵里和我们身体里，将没有容纳任何罪、任何恶、任何死亡、任何魔鬼的地方。如果我们靠着圣灵而活，在我们里面就没有死亡；我们里面的一切都为着神的每一份真理、公义和良善而活着。如果我们靠着圣灵而活，在我们里面就没有什么是会死的：因为会死的唯有罪，以及一切引人犯罪或源于罪的事物。然而，如果我们靠着圣灵而行，我们就能靠着圣灵而活；我们靠祂而行，如果遵守祂的圣诫命，如果践行祂的圣美德，如果我们的一切都顺从圣洁的信心，顺从圣洁的爱，顺从圣洁的温柔，顺从圣洁的谦卑，顺从圣洁的禁食，顺从圣洁的节制，顺从圣洁的忍耐。我们若靠着祂的圣奥秘和圣美德而行，便是在这世上靠着圣灵而行。那时，我们的心思由祂而思，我们的心感受由祂而感，我们的良心判断由祂而断，我们的意志意愿由祂而愿，我们的感官运作由祂而动；一言以蔽之：我们灵和身体的全部生命都由祂而成。实际上，我们基督徒不属于自己，而是属于神的。我们唯有靠着圣灵，才能真正地成为我们自己。因为祂藉着圣奥秘和圣美德，使我们回归我们自己，赐予我们这神圣肖像的存有以神圣的公义、神圣的圣洁、神圣的不朽和神圣的永恒。唯有到那时，我们的灵才感受到自己真是自己的，是不朽地属于自己的，是永恒地属于自己的，是神圣地属于自己的，是圣洁地属于自己的，是喜乐地属于自己的。不要自欺：只要我们仍属于罪，我们就不是属于自己的。因为如果我们属于它（罪），我们就属于一个陌生者；而透过它（罪），则属于一个更残忍的陌生者：死亡；而透过死亡，则属于人类存在最残忍的陌生者：魔鬼，它在罪和死亡的国度——地狱中，是全能的君王和主宰。
    - type: paragraph
      text:
        ru: '5:26'
        cn: '5:26'
    - type: paragraph
      text:
        ru: 'Живот човеков се састоји несравњено више из невидљивих доживљавања и збивања неголи из видљивих. И врлине човекове делају више невидљиво него видљиво; а исто тако и греси човекови. Јер од врлина човекових, шта видимо? Видимо само завршетак њихов, само дела њихова, само плод и род њихов. А сав пут врлине у души и телу човековом: њено зачеће, клијање, ницање, растење, оплођавање, сазревање, њену унутрашњу борбу са искушењима, сушама, олујама, бурама, непогодама, нечистим дусима, – све то ми не видимо. То важи и за грех, и његово растење и развијање у души човековој и телу. Да би у души човековој порасла и сазрела једна врлина, например, еванђелска љубав, колико унутрашњих невидљивих напора човек мора да учини, и колико борби да води са безброј невидљивих непријатеља те љубави; па онда колико спољних непријатеља нападају на њу, а човек се из себе и у себи бори са свима њима, бори на живот и смрт, и то скоро увек невидљиво за људе око њега, за ближње. И још нешто: колико је еванђелској љубави у твојој души потребно за њено напредовање, усавршавање, сазревање, да је невидљиво помажу невидљиве духовне сестре њене: вера, молитва, нада, кротост, смерност, благост, доброта, целомудреност, бестрасност; и невидљива духовна браћа њена: пост, уздржање, трпљење! И поред тога: колико је невидљиве анђелске и светитељске помоћи из оног света потребно нашој невидљивој души у овом свету, да би у њој расла наша еванђелска љубав ка своме божанском савршенству!'
        cn: 人的生命，其组成远超有形的，绝大部分是由无形的经历与事件构成的。人的美德，其作用更多是无形的而非有形的；人的罪恶亦是如此。论及人的美德，我们能看到什么呢？我们所见的，不过是它们的结果、它们的行为，以及它们的果实与产物。然而，美德在人的灵魂和身体中的整个历程：它的萌生、发芽、破土、成长、结实、成熟，它与试探、干旱、风暴、狂风、困厄、不洁之灵的内在争战——这一切我们都看不到。这同样适用于罪恶，以及它在人的灵魂与身体中的滋长与演变。为了让一种美德，例如福音之爱，在人的灵魂中成长并成熟，人必须付出多少内在的无形努力，并与那爱的无数无形敌人进行多少争战；此外，又有多少外在的敌人攻击它，而人则从自身而发，于自身之内与所有这些敌人进行生死搏斗，并且这几乎总是对周围的人、对他的近人来说是无形的。还有一点：你灵魂中的福音之爱，为了它的进步、完善、成熟，需要多少来自其无形的属灵姊妹们：信德、祷告、望德、温柔、谦卑、仁慈、良善、贞洁、超脱情欲，以及其无形的属灵弟兄们：禁食、节制、忍耐——的无形协助啊！此外：我们的灵魂在此世需要多少来自彼世的无形天使与圣徒的帮助，才能使我们灵魂中的福音之爱成长，趋向其神圣的完美啊！
    - type: paragraph
      text:
        ru: 'Тако бива и са грехом. Сваки грех у нама далеко је више невидљив него видљив: расте у нама кроз невидљива духовна збивања у нашој души; и ко све, и шта све ту не доприноси његовом порасту! На првом месту: налети и најезда невидљивих злих сила, које стварају повољну духовну климу за успевање грехова. Например: у мени се зачиње и помаља гордост. Ено је клија, ено је ниче, и већ са свих страна навиру неке црне магле које је хране, а кроз њих – ко зна каква невидљива бића, црна и ужасна! Ено како се око клице моје гордости шуња славољубље, па самољубље, па сластољубље, па властољубље; и хране је својим црним млеком. А ко то од вас види, о људи! Многобројне невидљивости крију од вас грех мој, док он расте и сазрева у мени. И тек кад груне кроз неко зло дело, ви га угледате. А све дотле, он је моја невидљива сила. Сем тога, колико је грехова који занавек остану невидљива својина човекова! Својина која му невидљиво сву душу потапа у смрт, и у царство зла и ђавола – пакао! Зато поступај са сваким човеком као са бићем више невидљивим него видљивим. Јер је у сваком човеку несравњено више што ти не видиш него што видиш. Зато и не суди брзо и олако човека, ниједног! Јер несравњено мање видиш од њега него што не видиш. Заиста је и величанствено и страшно, и узвишено и опасно – бити човек. И мудрост је, која одише божанском бесмртношћу и вечношћу: не тражити лажне славе, изазивајући један другога, завидећи један другоме. Људи! та ви сте у овом свету само на путу ка својој вечној постојбини, вечној постојбини или у царству Божјем или у царству ђавољем. Трећега царства нема у које би могао одвести ваш земаљски пут.'
        cn: 罪也是如此。我们里面的每一个罪远比可见的更加不可见：它在我们里面通过我们灵魂中不可见的属灵事件而增长；谁，又是什么，不都助长了它的增长呢！首先是：不可见的邪恶势力的冲击和侵袭，它们为罪的滋长创造了有利的属灵气候。例如：在我里面，骄傲正在萌芽和显现。看哪，它正在发芽，它正在生长，并且已经有黑色的迷雾从四面八方涌来滋养它，而通过这些迷雾——谁知道是什么不可见的、黑暗而可怕的生灵！看哪，围绕着我骄傲的萌芽，名誉欲、自爱欲、享乐欲、权势欲正在悄悄潜伏；并用它们的黑色乳汁喂养它。哦，世人啊，你们当中谁能看见这些呢！无数的不可见之物向你们隐藏了我的罪，而它却在我里面成长和成熟。直到它通过某个恶行爆发出来时，你们才看得见它。而在此之前，它都是我不可见的力量。此外，有多少罪是永远作为人不可见的财产而存在的呢！这种财产不可见地将他整个灵魂浸没在死亡、以及罪恶和魔鬼的国度——地狱之中！因此，对待每一个人，都应当将其视为一个远比可见的更加不可见的生灵。因为在每一个人身上，你所看不见的比你所看见的要多得多，无可比拟。因此，不要快速地、轻率地评判任何一个人！因为你所看见的他的部分，远比你所看不见的要少得多，无可比拟。做一个人类，确实既是宏伟的又是可怕的，既是崇高的又是危险的。那散发着神圣不朽和永恒气息的智慧是：不寻求虚假的荣耀，不彼此挑衅，不彼此嫉妒。世人啊！你们在这个世界上，不过是通往你们永恒归宿的旅途上，这永恒的归宿或是在上帝的国度里，或是在魔鬼的国度里。没有第三个国度可以导向你们的尘世之路。
  - type: heading2
    text:
      ru: Шеста глава
      cn: 第六章
    children:
    - type: paragraph
      text:
        ru: 6:1–18
        cn: 6:1–18
    - type: paragraph
      text:
        ru: Гал.6:1–18:1Браћо! ако и упадне човек у какав грех, ви духовни исправљајте таквога духом кротости, чувајући себе да и ти не будеш искушан. 2 Носите бремена један другога, и тако ћете испунити закон Христов. 3 Јер ако ко мисли да је што, а није ништа, умом вара себе. 4 Нека сваки испита своје дело, и тада ће сам у себи имати похвалу, а не у другоме. 5 Јер ће сваки своје бреме носити. 6 Који се учи речи, нека даје део од свакога добра ономе који га учи.
        cn: '(加拉太书 6:1)

          弟兄们，如果人偶然被过犯所胜，你们属灵的人，就当用温柔的心挽回这样的人；你们自己也要小心，免得也被引诱。2 你们要彼此担当重担，这样，你们就完全了基督的律法。3 因为人若自以为是什么，其实却是什么都不是，就是自欺。4 各人应当察验自己的行为，这样，他所夸的就只在自己，不在别人。5 因为各人必担当自己的重担。6 在道理上受教的，当把一切美好的东西与教导他的人分享。'
    - type: paragraph
      text:
        ru: '7 Не варајте се: Бог се не да исмејати: јер што човек посеје оно ће и пожњети. 8 Јер који сеје у тело своје, од тела ће пожњети трулеж; а који сеје у Духа, од Духа ће пожњети живот вечни. 9 А добро чинити да нам се не досади: јер ћемо у своје време пожњети, ако не сустанемо. 10 Зато дакле док имамо времена, чинимо добро свима, а особито онима који су с нама у вери.'
        cn: 7 不要自欺：神是不可戏弄的；因为人种的是什么，收的也是什么。8 顺着肉体撒种的，必从肉体收败坏；顺着圣灵撒种的，必从圣灵收永生。9 我们行善不可丧志，因为到了时候必有收成，若不灰心。10 因此，趁着有机会，就当向众人行善，尤其向那与我们在信仰里的人。
    - type: paragraph
      text:
        ru: 11 Видите колико вам написах руком својом. 12 Који год хоће да се хвале по телу, они вас нагоне да се обрезујете, само да не буду гоњени за крст Христов. 13 Јер ни они сами који се обрезују, не држе закона, него хоће да се ви обрезујете, да се вашим телом хвале. 14 А ја Боже сачувај да се чим другим хвалим осим крстом Господа нашег Исуса Христа, којим се мени разапе свет и ја свету. 15 Јер у Христу Исусу нити што вреди обрезање нити необрезање, него нова твар. 16 И колико их год по овоме правилу живе, нека је на њима мир и милост, и на Израиљу Божјему! 17 Вшие да ми нико не досађује, јер ја ране Господа Исуса на телу своме носим. 18 Благодат Господа нашега Исуса Христа са духом вашим, браћо! Амин.
        cn: 11 你们看我亲手给你们写了多少字。12 凡是想在肉体上自夸的，他们强迫你们受割礼，只为免受为基督的十字架而来的迫害。13 因为那些受割礼的人，他们自己也不遵守律法，他们却要你们受割礼，为要以你们的肉体自夸。14 我绝不以别的什么夸耀，只夸耀我们主耶稣基督的十字架；借着他，世界对我来说已经被钉在十字架上，我对于世界来说也是如此。15 因为在基督耶稣里，割礼或未受割礼都算不得什么，唯有新造的人才算数。16 凡是按这准则生活的，愿平安和怜悯临到他们，也临到神的以色列！17 从今以后，谁都不要再烦扰我了，因为我身上带着主耶稣的印记。18 愿我们主耶稣基督的恩典与你们的心灵同在，弟兄们！阿门。
    - type: paragraph
      text:
        ru: '6:1'
        cn: '6:1'
    - type: paragraph
      text:
        ru: 'Земља је бојиште на коме човек стално бије битку или за царство Божије или за царство ђавоље. Битка се бије на живот и смрт: или се гине кроз грехе и упада у царство зла – пакао, или се односи победа кроз свете врлине и узлеће у царство Божије – рај. На том бојишту је много рањеника, јер се о душу човекову боре и анђели и ђаволи. Наш земаљски свет није издвојен од небеског и подземног света; у њему су са људима измешани и анђели и ђаволи. Ђаволи се боре са људима помоћу грехова, а анђели бране људе помоћу својих небеских врлина. Људи се по својој слободној вољи опредељују или за грехе или за свете врлине. Греси се облаче и пресвлаче у безброј заводљивих одора, само да би људе намамили на своје сласти, које су у почетку увек само неки свилени конци, да би се затим страховитом брзином претворили у свилене конопце који неминовно одвлаче човека у своје царство зла, ако их човек благовремено не покида покајањем, вером, љубављу, молитвом, постом. На земаљском бојишту хришћани стоје обучени у свеоружје Божје, у анђелско оружје – свете врлине: веру, љубав, наду, молитву, пост, и остале. Али се дешава да понеки задобије ране у тој борби када му малакше која од светих врлина, или је он одбаци. У таквом случају греси навале на ту страну његове душе која није ограђена врлином и рањавају је. Чим се то догоди са ма којим од хришћана, ви духовни, који сте чврсти у врлинама и светом животу и пуни дарова Светога Духа и опробани јунаци на бојном пољу противу грехова, одмах притекните у помоћ таквом рањеном брату. Увек му притекните као немоћном и беспомоћном рањенику, и дајте му еванђелске лекове који су безбројни. Ако је рањен гневом – лечите га еванђелском благошћу; ако је рањен гордошћу – лечите га еванђелском смиреношћу; ако је рањен мржњом – лечите га еванђелском љубављу; сластољубље лечите постом, похоту – целомудријем, лаж – истином. Против сваког нашег греха у Еванђељу Спасовом има по безброј лекова. Само те лекове ви духовни употребљавајте као мудри, као богомудри духовни лекари. «Духом кротости» исправљајте брата који «упадне у какав грех», упадне вучен саблазнима и искушењима које роје око нас и туткају на нас и видљиви и невидљиви непријатељи наши. Са таквим братом увек поступајте као са болесником, јер грех и јесте болест људске душе, најстрашнија болест, од које умире душа. А има ли што драгоценије од душе, и стога – страшније од смрти душе? У наш земаљски свет као у огромну болницу дошао је Господ Христос, Божански Лекар, са свима божанским лековима, да нас лечи од главне болести наше, хроничне и неизлечиве људским, земаљским лековима. «Не требају здрави лекара него болесни» (Мф.9:12). А ко је здрав од греха сем Господа Христа? Зато је Он и дошао, зато и остао међу нама у Цркви Својој са свима божанским лековима Својим. И Он нам даје лекове против свих грехова уопште; нема неизлечивог греха; за сваки грех има лек; за сваку смрт – васкрсење. Лек од смрти? Свето причешће, и остале свете тајне и свете врлине: свака света тајна и свака света врлина – по једно васкрсење душе; а све оне скупа – безброј васкрсења душе. Лек од греха, од свакога греха? Ено их у Цркви. Само треба умети лечити тим лековима, бити искусан духовни лекар. У питању је најсложеније и најтајанственије биће под небом: душа човечија. Лечити њу која је небеског порекла и од исте материје од које и анђели, врло је тешка и одговорна дужност. А како се постаје искусан духовни лекар? Духом Светим: испунивши се Њиме, Његовим даровима, Његовом мудрошћу и богомудрошћу (ср.1Кор.2:10–15), и тако стећи «ум Христов» који једини зна шта је душа човекова, и како се лечи од свих болести и смрти (ср.1Кор.2:16).'
        cn: 大地是战场，人不断地争战，或为上帝的国度，或为魔鬼的国度。这是一场生死之战：或因罪孽而消亡，坠入邪恶的国度——地狱；或通过圣洁的德行取得胜利，升入上帝的国度——天堂。在这战场上，伤者众多，因为天使和魔鬼都为人的灵魂争战。我们的尘世并非与天上和地下的世界隔绝；天使和魔鬼都与人混杂其中。魔鬼借着罪孽与人争战，而天使则借着他们天上的德行守护着人。人凭着自己的自由意志抉择，或选择罪孽，或选择圣洁的德行。罪孽披戴上无数诱惑的华服，只为引诱人们沉溺于它们的甘美；起初，这甘美总是如丝线般纤弱，却能以惊人的速度转变为丝绳，不可避免地将人拖入它们的邪恶国度，除非人能及时通过悔改、信心、爱、祷告、禁食将它们挣断。在这尘世战场上，基督徒身披上帝的全副军装，亦即天使般的武器——圣洁的德行：信心、爱、盼望、祷告、禁食以及其他德行。但有时，在这争战中，有人会受伤，当他们圣洁的德行有所衰弱，或将其抛弃时。在这种情况下，罪孽会猛攻他们灵魂中未被德行环绕的那一部分，并将其击伤。一旦这事发生在任何一位基督徒身上，你们属灵之人，在德行和圣洁生活中坚定不移，且充满圣灵恩赐，又是战场上抵御罪孽的久经考验的勇士，务必立即援助这受伤的弟兄。总要将他视为软弱无助的伤者来帮助他，并给他无数的福音良药。若他被愤怒所伤——当以福音的温柔医治他；若他被骄傲所伤——当以福音的谦卑医治他；若他被仇恨所伤——当以福音的爱医治他；以禁食医治贪食，以贞洁医治淫欲，以真理医治谎言。在救主的福音中，针对我们的每一种罪孽，都有无数的良药。你们属灵之人，当如明智者般使用这些良药，亦当如同蒙受神性智慧的属灵医者。以「温柔的心」纠正「偶然得罪」的弟兄，他们被我们身边蜂拥而至的诱惑和试探所牵引而跌倒，被我们看得见的和看不见的仇敌所鼓动。对待这样的弟兄，总要如同对待病人一般，因为罪孽正是人类灵魂的疾病，最可怕的疾病，灵魂因此而死亡。还有什么比灵魂更宝贵呢？因此，还有什么比灵魂的死亡更可怕呢？主基督降临我们的尘世，如同进入一间巨大的医院，祂是神圣的医者，带着一切神圣的良药，为要医治我们那主要的疾病，那用人类的、尘世的药物无法治愈的慢性绝症。「康健的人用不着医生，有病的人才用得着。」（马太福音 9:12）除了主基督，谁能免于罪孽而康健呢？因此祂降临世间，因此也带着祂所有的神圣良药，留在我们中间，在祂的教会里。祂赐予我们针对所有罪孽的良药；没有无法医治的罪孽；每一种罪孽都有良药；每一种死亡都有复活。医治死亡的良药是什么？圣餐，以及其他的圣事和圣洁的德行：每一件圣事和每一种圣洁的德行，都是灵魂的一次复活；而所有这些加起来，则是灵魂的无数次复活。医治罪孽的良药，医治所有罪孽的良药呢？它们就在教会里。只是需要懂得如何使用这些良药进行医治，成为一位经验丰富的属灵医者。我们所谈论的，是天下最复杂、最奥秘的生灵：人类的灵魂。医治那源于天上、与天使由同样物质构成的灵魂，是一项极其艰难而重大的职责。那么，如何才能成为一名经验丰富的属灵医者呢？靠着圣灵：充满祂，充满祂的恩赐，充满祂的智慧和神圣智慧（参阅哥林多前书 2:10-15），如此便能获得「基督的心」，唯有这心才明白人的灵魂是什么，以及如何医治它所有的疾病和死亡（参阅哥林多前书 2:16）。
    - type: paragraph
      text:
        ru: 'Посреди је духовна медицина: наука најсложенија, најтајанственија, најсветија. Да, најсветија и најодговорнија, јер је у њеним рукама вечна судба човекове душе, а тиме – вечна судба човекова бића. Она лечи од свих заблуда, од свих лажи, од свих грешних мисли, од свих злих жеља, од свих рђавих навика, од свих лоших нарави; речју: лечи од свих духовних болести, иза којих стоје све духовне смрти, па и сама духовна свесмрт. А шта је то? Одвојеност душе од Бога, који је једини и неисцрпни извор душе, њене божанске бесмртности и вечности. А греси и јесу мрачне силе које одвајају душу човекову од Бога. Отуда духовна медицина мора лечити од сваког греха, и дати лек за исцељење од сваког греха. Зато је неопходно да духовни лекари богомудро располажу и рукују лековима које им Господ Христос пружа у Цркви Својој. Исправљати грешника, то је увек – лечити болесника. Јер грешник и јесте најнежнији и најосетљивији и најопаснији болесник, кога увек треба лечити «духом кротости». И кад му најболнију операцију вршите, вршите је «духом кротости», из које зрачи свебрижна љубав еванђелска, братољубље еванђелско. Ваља «с кротошћу поучавати оне који се противе: еда би им Бог дао покајање за познање истине, и да се ишчупају из замке ђавола, који их је уловио за своју вољу» (2Тим.2:25–26). Јер сваким грехом ђаво уствари улови човека «за своју вољу», и човек грешећи, уствари твори вољу ђаволову, пошто грех и јесте воља и хтење ђаволово. Отуда при лечењу грешника, увек се мора спасавати воља његова од робовања ђаволу; у томе воља његова мора сама суделовати: лекар даје лекове, а грешник их употребљује. Он је тај коме при лечењу припада главна улога, као и при операцијама душе: «Ако те око твоје саблажњава, ископај га и баци од себе» (Мф.5:29), и то ти сам, јер нико место тебе не може ишчупати из тебе твој најмилији грех, који ти је постао као око душе. Ишчупај га покајањем, вером у Господа Христа, надом у Његову свемилост. А како ћеш и на који начин то учинити, показаће ти духовни лекари.'
        cn: 居其核心的是属灵医学：一门最为复杂、最为奥秘、最为神圣的学问。是的，最为神圣也最为责任重大，因为人类灵魂的永恒命运，并由此，人类存在的永恒命运，都掌握在它的手中。它医治一切的错谬、一切的谎言、一切罪恶的思想、一切邪恶的欲望、一切恶劣的习惯、一切不好的性情；简而言之：它医治一切属灵的疾病，而一切属灵的死亡，乃至属灵的全然死亡，皆潜伏在这些疾病的背后。这又是什么呢？是灵魂与上帝的分离，而上帝正是灵魂、其神圣不朽和永恒的唯一且不竭的源泉。罪正是将人的灵魂与上帝分离的黑暗势力。因此，属灵医学必须医治一切的罪，并为医治一切的罪提供良药。因此，属灵的医者必须以神圣的智慧运用和处置主基督在祂教会中赐予他们的药物。纠正罪人，这永远——就是医治病人。因为罪人正是一个最脆弱、最敏感、也最危险的病人，他总是需要以「温柔的心灵」来医治。即使当你对他进行最痛苦的手术时，也要以「温柔的心灵」来执行，因为从中散发出福音中无微不至的爱和福音中的弟兄之爱。应该「存温柔的心教导那些抵挡的人，或许上帝能赐给他们悔改的心，使他们得以认识真理，并从那已为己意掳获他们的魔鬼网罗中挣脱出来」（提摩太后书 2:25-26）。因为魔鬼实际上是以每一个罪恶将人「为己意」掳获，而人犯罪，实际上就是遵行魔鬼的意愿，因为罪正是魔鬼的意愿和欲望。因此，在医治罪人时，总要将他的意愿从对魔鬼的奴役中拯救出来；在此过程中，他的意愿必须亲自参与：医者提供药物，而罪人则使用它们。他是在医治中扮演主要角色的人，就像在灵魂的手术中一样：「若是你的右眼叫你跌倒，就剜出来丢掉」（马太福音 5:29），而且是你自己动手，因为没有人能代替你将你那最宝贵的罪从你里面拔除，它对你来说已如同你灵魂的眼睛一般。以悔改、以对主基督的信仰、以对祂全然怜悯的盼望来拔除它。至于你将如何、以何种方式去做，属灵的医者会向你指明。
    - type: paragraph
      text:
        ru: 'Велика је «тајна безакоња», тајна зла, увек по тајанственом деловању ђавола (ср.2Сол.2:7–9); и располаже тако префињеним саблазнима, да је и најдуховнијем човеку потребно бити увек будан за њих и опрезан против њих. Лечећи човека од греха, пази да се и сам не заразиш његовим грехом. Лечиш ли човека од среброљубља, чувај се да се и сам не заразиш њиме; лечиш ли га од гнева, пази да и сам не упаднеш у исту болест. Уопште, при исправљању ма ког човека од ма каквог греха, треба се чувати «да и ти сам не будеш искушан» тим истим грехом, или поводом тог истог греха. Ево, опасност је ту, прва опасност: ти си духовни лекар, лечиш тешке болеснике, но да се због тога и кроз то не увуче утебеневидљиви црв охолости, самохвалисавости, високоумља? Деси ли се то, ти си већ «упао» у грех, већ си искушан. На најпрепреденије и најнеприметније начине грех се увлачи у човека, и у најдуховнијег човека. Зато се увек мора стражити, еванђелски стражити, јер око нас стално круже помрчине греха и магле искушења. И ту увек важи она истина: «Ко мисли да стоји нека се чува да не падне» (1Кор.10:12). Стојиш у вери? А колико је непријатеља Христове вере у овом свету; чувај се да те не оборе! Стојиш у љубави еванђелској? Пази да не испаднеш из ње, саблажњен неком световном љубављу и несветим пристрашћем.'
        cn: 宏大的是「不法之奥秘」，是邪恶的奥秘，总是凭着魔鬼奥秘的作为 (参帖撒罗尼迦后书 2:7-9)；它具备如此诡诈的诱惑，以至于即便最属灵的人也需要始终警醒防备它们。在医治一个人脱离罪恶时，小心不要自己也被他的罪所感染。你若医治一个人脱离贪爱钱财，谨防自己也被它感染；你若医治他脱离愤怒，小心不要自己也陷入同样的疾病。总之，在纠正任何人脱离任何罪恶时，都应当谨防「你自己也被试探」，被那同一个罪，或因那同一个罪而受试探。看哪，危险就在那里，第一个危险是：你是属灵的医生，医治重病患者，但要小心，不要因此并通过此事，让那无形的、傲慢、自夸、高傲的蠕虫爬进你里面？若发生这种情况，你就已「陷入」罪中，已经受了试探。罪以最狡猾和最不易察觉的方式悄悄潜入人的心中，甚至是最属灵的人。因此，人必须始终警醒，以福音的教导警醒，因为在我们周围，罪的黑暗和试探的迷雾不断盘旋。在这里，那句真理始终适用：「自己以为站得稳的，务要小心，免得跌倒」(哥林多前书 10:12)。你坚定在信仰中吗？然而这世上有多少基督信仰的敌人；小心不要让他们击倒你！你坚定在福音的爱中吗？小心不要从其中跌落，被某种世俗的爱和不圣洁的偏执所诱惑。
    - type: paragraph
      text:
        ru: '6:2'
        cn: '6:2'
    - type: paragraph
      text:
        ru: 'Сви смо ми под слабостима, али нас зато вера Христова и љубав Христова вежу у једно «тело», у једну Цркву Христову, да бисмо лакше носили себе, своје слабости, укопчани једни у друге, сваки у све и сви у свакога, сједињени у једно духовно тело, учлањени у Богочовечанско тело Христово. И као што у нашем телесном телу око помаже нози да лакше носи свој терет, јер је води видом; и као што опет нога помаже руши да лакше носи свој терет носећи је; и као што сваки уд помаже другоме уду у његовом раду и вршењу дужности; тако и у духовном животу нашем, у духовном телу Цркве Христове: једни су ноге, други руке, трећи очи, итд., али сваки неопходан свакоме уду, сви свакоме и сваки свима, јер сви они помажу један другоме у вршењу посебних дужности; а од тих посебних дужности састоји се свеукупни живот духовног тела Цркве, које они сваки посебно сачињавају као органски, саставни делови, увек неопходни један другоме. Живећи у духовном телу Христовом – Цркви, ми носимо бремена један другога. А не носимо ли, зар смо Христови? зар смо у Цркви? Сав Господ Христос Богочовек, са свима Својим божанским даровима и силама присутан је у Цркви Својој, и у Њему сав закон Његов. И ко живи у Цркви и Црквом, тај увек носи бремена другога и других, и тако испуњује закон Христов. Али у исто време он свим бићем осећа да и други носе бремена његова.'
        cn: 我们都身负软弱，但因此，基督的信仰和基督的爱将我们联结成一个「身体」，一个基督的教会，好让我们更容易地背负自己、自己的软弱，彼此紧密相连，每个人都在众人之中，众人也在每个人之中，联合成一个属灵的身体，成为基督神人身体的肢体。正如在我们肉身的身体中，眼睛通过视觉引导，帮助腿更容易地承载其负担；又正如腿通过承载手臂，帮助手臂更容易地承载其负担；又正如每个肢体都在其工作和履行职责中帮助其他肢体；同样在我们属灵的生命中，在基督教会的属灵身体中也是如此：有些人是腿，有些人是手，有些人是眼睛，等等，但每个肢体都对其他肢体必不可少，众人对每个人都必不可少，每个人对众人也必不可少，因为他们都在履行各自特殊的职责中彼此帮助；而教会属灵身体的整体生命，正是由这些特殊的职责所构成，他们每个人都作为有机、组成部分单独地构成它，并且总是彼此不可或缺。生活在基督的属灵身体——教会中，我们彼此分担重担。如果我们不分担，我们还算基督徒吗？我们还在教会中吗？神人主基督，带着他所有神圣的恩赐和力量，临在于他的教会中，并且在他里面有他全部的律法。凡在教会中、并借着教会而生活的人，他总是背负着他人的重担，如此便成全了基督的律法。但与此同时，他全心全意地感觉到，其他人也在背负着他的重担。
    - type: paragraph
      text:
        ru: 'Гле, зар светитељи Христови, видљиво или невидљиво, не носе наша бремена? бремена наших слабости, грехова, искушења? То непрекидно посведочавају њихове свете мошти, њихова чудеса, њихове молитве, њихова јављања. Јак си вером, јак љубављу, јак молитвом, јак трпљењем, јак постом, онда – носи бремена слабије у вери браће, слабије у љубави, слабије у молитви, слабије у посту, слабије у другим подвизима, јер «ми јаки дужни смо слабости слабих носити, и не себи угађати» (Рим.15:1). Нама је благодаћу Божјом дата јакост у вери, јакост у љубави, јакост у молитви, да бисмо их као таланте употребљавали на корист ближњих својих, јер су нам ради тога дати. А не употребљавамо ли их, они ће се узети од нас, као талант од лењог и злог злуге. Тако ће вера наша, и љубав наша, и молитва наша, бити на погибао нашу, ако их не употребљавамо на добро ближњих наших. Јер наше врлине постају спасоносне за нас само преко наших ближњих, када помоћу њих служимо себи преко ближњих. Само преко других оне постају наше! Опет и опет, наше врлине само преко целог духовног тела Цркве постају наше: као што ваздух преко органа за дисање постаје не само њихова својина, својина плућа, него и целога тела: ногу, руку, очију, костију, крви, и сваког најситнијег делића у телу, – тако и у духовном телу Цркве. Свака врлина, која је храна наше душе, постаје саставним делом нашег бића тек преко свих осталих органа у духовном телу Цркве, постајући у исто време колико њихова својина толико и наша. И наша само као њихова! У самој ствари у Цркви Христовој све је прво «наше», па тек онда моје: моје само преко нашег. Таква је чудесна и света и чудотворна тајна Богочовечанског тела Христовог – Цркве Христове у свету. Али при томе и тиме она није нешто неприродно у нашем човечанском свету, јер је ту наше физичко тело, у коме владају исти закони живота и самоодржања. Само то у Цркви добија своју савршену пуноћу, своје богочовечанско савршенство; а кроз то и сваки од нас као личност доживљује тек у Цркви савршену пуноћу своје личности и свога богочовечанског савршенства.'
        cn: 看哪，基督的圣徒们，或可见地，或不可见地，不都背负着我们的重担吗？我们软弱、罪过、试探的重担？他们的圣髑、神迹、祷告、显现，都在不断地为此作证。你若在信仰上坚强，在爱德上坚强，在祷告上坚强，在忍耐上坚强，在禁食上坚强，那么，就当背负信仰上软弱的弟兄们、爱德上软弱的弟兄们、祷告上软弱的弟兄们、禁食上软弱的弟兄们以及在其他属灵苦修上软弱的弟兄们的重担；因为「我们刚强的人，应该担当不刚强之人的软弱，不求自己的喜悦」（罗马书 15:1）。我们蒙受神的恩典，得赐在信仰上的坚强，在爱德上的坚强，在祷告上的坚强，为要我们将它们当作才干来使用，以造福我们的近人，因为它们为此而被赐予我们。而我们若不使用它们，它们将从我们这里被取走，如同才干从那又懒又恶的仆人手中被取走一样。如此，我们的信仰、我们的爱德和我们的祷告，如果我们不将它们用于我们近人的益处，将成为我们的灭亡。因为我们的德行，只有通过我们的近人，才能对我们具有救赎性，即当我们借由这些德行，通过近人来事奉我们自己时。只有通过他人，它们才能成为我们自己的！一次又一次地，我们的德行，只有通过教会的整个属灵身体，才能成为我们自己的：正如空气通过呼吸器官，不仅成为它们的财产，成为肺的财产，而且也成为整个身体的财产：腿、手、眼睛、骨骼、血液以及身体中每一个最微小的部分——在教会的属灵身体中也是如此。每一种德行，作为我们灵魂的食粮，只有通过教会属灵身体中的所有其他器官，才能成为我们存在的组成部分，同时既成为他们的财产，也成为我们自己的财产。并且我们的（德行）也只是作为他们的（德行）！事实上，在基督的教会里，一切首先是「我们的」，然后才是我的：我的只是通过「我们的」而成为我的。这就是基督的神人身体——在世上的基督教会——奇妙、圣洁、能行神迹的奥秘。然而，在此过程中，教会并非我们人类世界中某种不自然的事物，因为我们的肉身，也受着同样的生命和自我维系法则的支配。唯有在教会中，这才能达到其完美的丰满，其神人的完美；并且通过它，我们每个人作为一个人格，也唯有在教会中才能体验到他自身人格的完美丰满及其神人的完美。
    - type: paragraph
      text:
        ru: '6:3'
        cn: '6:3'
    - type: paragraph
      text:
        ru: 'Знаш ли, ко си ти? Не можеш знати, тачно и истински знати, док себе не погледаш богочовечанским оком Цркве, док себе не измериш богочовечанском мером Цркве. Тек као органски део тела Цркве, тек као «сутелесник» тела Христова (Еф.3:6) можеш сазнати ко си, шта си, откуда долазиш, куда идеш, колико вредиш. Без тога, тебе ће увек варати ум твој, и лажно претстављати тебе сама теби самом. Зашто? Зато што ни наш ум не претставља непогрешиво мерило и непогрешивог судију. И он је под многим слабостима и несавршенствима и манама и помрчинама. Њему је неопходно, знаш ли шта? Да себе добровољно принесе на жртву Господу Христу – Божанском Логосу, Божанском Уму, принесе кроз самоодречни подвиг вере, љубави, молитве. И онда? Онда ће га чудесни Господ у Богочовечанском телу Цркве Своје преобразити, обновити, осветити, присајединити саборном богочовечанском уму Цркве. И тек ту, у том богочовечанском уму Цркве твој ће ум наћи себе, своју пуноћу, своје савршенство, своју светост, своју непогрешивост. И ти ћеш радосно моћи са свима који су свим бићем, свим срцем, свим умом у Цркви Христовој Рећи: «Ми ум Христов имамо» (1Кор.2:16). «Ми» ум Христов имамо: ми сви заједно, са свима светима, а не ја сам; мој издвојени, осамљени, неоцрквењени ум је увек немоћан, слаб, бедан, погрешив, заблудан, варљив, преварљив; вара и себе и друге око себе, вара вољно или невољно, свесно или несвесно. Једино «са свима светима» (Еф.3:18), у Цркви Христовој, мој ум осаборњен, оцрквењен, обогочовечен, добија силу и моћ и јасно види, опет «са свима светима», кроз њих и помоћу њих – свој вечни пут, свој вечни смисао, своју вечну вредност, свој вечни живот, своју вечну радост.'
        cn: 你知道你是谁吗？你无法准确而真实地知道，除非你用教会神人同性的眼光审视自己，除非你用教会神人同性的尺度衡量自己。只有作为教会身体的有机部分，只有作为基督身体的「一同为肢体者」（以弗所书 3:6），你才能明白你是谁，你是什么，你从何而来，你往何而去，你有多大价值。没有它，你的心智将永远欺骗你，并错误地将你自己呈现给你自己。为什么？因为即使是我们的心智，也不是一个无误的尺度和无误的审判者。它也处于许多软弱、不完美、缺陷和昏暗之中。它需要什么，你知道吗？它需要通过信、爱、祷告的舍己修道苦行，甘心乐意地将自己献祭给主基督——那神圣的道，那神圣的心智。然后呢？那时，奇妙的主将在祂教会的神人同性身体里，改变、更新、圣化它，并使它与教会大公的神人同性心智联合。只有在那里，在教会那神人同性的心智中，你的心智才会找到它自己，它的丰盛，它的完美，它的圣洁，它的无误。那时你将能喜乐地与所有全心、全意、全灵都在基督教会里的人一同说：「我们有基督的心了」（哥林多前书 2:16）。「我们」有基督的心：是我们所有人在所有的圣徒中一同拥有，而不是我独自一人拥有；我那与教会分离、孤立、未融入教会的心智，永远是无能的、软弱的、可怜的、易错的、迷失的、欺骗的、充满诡计的；它欺骗自己也欺骗周围的人，无论是自愿还是非自愿，有意识还是无意识。唯有「与众圣徒一同」（以弗所书 3:18），在基督的教会中，我那融入大公性、融入教会性、神人同性的心智才能获得力量和权能，并再次「与众圣徒一同」，透过他们并藉着他们的帮助，清晰地看见它永恒的道路，它永恒的意义，它永恒的价值，它永恒的生命，它永恒的喜乐。
    - type: paragraph
      text:
        ru: 'Уствари, мој ум је штуро, иако бесконачно «ништа»; и сав ја, са васцелом својом душом и телом и савешћу, непрекидно сам бескрајно метафизичко, а и физичко «ништа», док год сам одвојен од Онога који је све и сва за свако биће: од Господа Христа, Бога Логоса, васцелог оваплоћеног у Цркви Његовој. Јер ван Богочовека Христа, ја сам сав смртан, сав сам «ништа», и физички сав сам «ништа», пошто сам баш физичком страном свога бића и најподложнији видљивој смртности и смрти. Док моја људска мисао не ологоси себе, она увек остаје фантастично привиђење, најпре, за себе саму. При томе, бесмисленост мисли је увредљиво очигледна. Да, мисао је људска бесмислена све док се не осмисли, не ологоси Богом Логосом – Господом Христом у Цркви Његовој: док се не оцрквени, осаборни, освети, облагодати, обогочовечи. Тек онда мисао људска позна себе, своју природу, своју божанску намену, свој божански смисао и циљ и вредност и бесмртност и вечност милу и блажену. А дотле, нема веће муке него што је мисао сама себи! и нема већег пакла: мисао сама у себи и сама са собом, потпуно откинута од Творца и Бога мисли – Господа Христа, Бога Логоса. Мисао људска без Господа Христа не може познати ни себе ни свет око себе, нити знати себе или свет око себе. А кад у уображењу свом мисли да што зна – «не зна још ништа као што треба знати» (1Кор.8:2). Уствари, сва способност мисли није у њој самој већ у Богу Логосу и од Бога Логоса (ср.2Кор.3:5). У томе је разумност мисли, и смисао мисли, и логичност мисли, и логосност мисли. Без тога – она је увек алогосно привиђење, алогосно чудовиште, које само себе непрестано вија по пустињама бесмисленог постојања и бића, које је на крају свих крајева небиће.'
        cn: 事实上，我的心智是贫瘠的，尽管它是无限的「虚无」；而我整个人，连同我完整的灵魂、身体和良知，不断地、无限地成为形而上和形而下的「虚无」，只要我与那对万有而言是一切的那一位分离：与主基督、道成肉身于祂教会中的圣言之神分离。因为在神人基督之外，我是全然必死的，我是全然的「虚无」，并且在身体上我也是全然的「虚无」，因为我的存在正是通过我的肉体一面而最易受可见的必死性和死亡的支配。除非我的属人思想将自身化为圣言，它总是停留在一种虚幻的幻象，首先，对自己而言。此外，思想的无意义性是令人不悦的显而易见。是的，属人思想是无意义的，直到它被赋予意义，被圣言之神——在祂教会中的主基督所化为圣言：直到它被教会化，被大公化，被圣化，被恩典化，被神人化。只有那时，属人思想才能认识自己，认识其本性，认识其神圣的旨意，其神圣的意义、目标、价值、不朽，以及可爱的和蒙福的永恒。而在此之前，没有比思想本身更巨大的痛苦了！也没有更大的地狱：思想在自身之内，且与自身独处，完全脱离了思想的创造者和上帝——主基督，圣言之神。没有主基督的属人思想，既不能认识自己，也不能认识周围的世界，更不能了解自己或周围的世界。而当它在自己的想象中认为自己知道些什么时，「他仍不知道所当知道的」（哥林多前书 8:2）。事实上，思想的一切能力不在于它自身，而在于圣言之神，并源于圣言之神（参阅哥林多后书 3:5）。思想的理性在于此，思想的意义也在于此，思想的逻辑性也在于此，思想的圣言性也在于此。没有它——它便永远是一个非圣言的幻象，一个非圣言的怪物，不断在无意义的存在和本质的荒漠中追逐自己，最终，在一切的尽头，归于非存在。
    - type: paragraph
      text:
        ru: '6:4'
        cn: '6:4'
    - type: paragraph
      text:
        ru: 'Да је тако, сваки може проверити на себи самом: ако марљиво и свестрано и искрено испита природу своје мисли; и не само мисли него и васцелог бића свог што се човек зове: све што он јесте и све што он ради. И то испита скраја накрај. На свима странама свога бића човек ће пронаћи и увидети: да је он сам по себи, без Бога и Логоса Господа Христа, ништа, и то страшилно ништа, увек страшно и најстрашније за себе сама; и да тек са Господом Христом он уствари улази у истинско биће, у истинско постојање, у истински живот, у истински смисао свога постојања, у истинску бесмртност и вечност. Једино у Богочовеку Христу човек налази своју блажену и радосну бесмртност, налази себе боголиког и богочежњивог и богоносног. А у томе је и једина похвала и хвала и слава људског бића. И само Христом и у Христу човек ствара бесмртна дела: оно што се неће узети од њега ни у овом ни у оном свету, оно што му никаква смрт не може ни отети ни украсти ни одузети, јер је од Христове вечности и богочовечности. И над тим, једино над тим у човеку никаква смрт нема власти ни у овом ни у оном свету. Само она дела човекова која су у Христу учињена имају вечну славу и хвалу. А таква дела чини сваки Христов човек живећи у Богочовечанском телу Христовом – Цркви, која му непрекидно и даје божанске силе да чини таква дела: даје му као живом органском делу свом, кроз који сасвим природно пројављује своју богочовечанску силу и моћ. Али му увек даје као личности која свесно и драговољно живи у њој творећи Христове заповести, које су божански закони Цркве и свих чланова њених.'
        cn: 是否如此，人人皆可在自身上验证：如果殷勤、全面、真诚地省察他思想的本质；不仅是思想，更是他那被称为人的整个存有：他所是的一切，以及他所做的一切。并且从头到尾地省察。在他存有的各个层面，人将发现并领悟：他靠他自己，没有上帝和主基督圣言，便一无所有，而且是可怕的虚无，对他自己而言永远是可怕的、最可怕的；而只有与主基督同在，他才真正进入真实的存有、真实的存在、真实的生命、他存在真实的意义、真实的永生和永恒。唯独在道成人身的基督里，人才能找到他有福而喜乐的永生，找到自身是像上帝的、渴慕上帝的、承载上帝的。这便是人类存有的唯一赞美、称颂和荣耀。并且只有藉着基督并在基督里，人才能创造不朽的功业：那无论在此世或彼世都不能从他那里被夺走的，那任何死亡都不能从他手中抢夺、偷窃或剥夺的，因为那是源于基督的永恒和道成人性。而且，对此，唯独对此，死亡在人身上无论在此世或彼世都无权柄。唯独那些在基督里成就的人的功业，才拥有永恒的荣耀和称颂。而所有属基督的人，借着活在基督那道成人身的身体——教会中，便能成就这样的功业，教会不断地赐予他神圣的能力去成就这样的功业：赐予他，如同赐予它活生生的有机肢体，通过这个肢体，教会极其自然地彰显其道成人身的能力和权能。然而，教会总是将这能力赐予那些自觉自愿地活在其中、遵行基督诫命的人，这些诫命是教会及其所有成员的神圣法则。
    - type: paragraph
      text:
        ru: '6:5'
        cn: '6:5'
    - type: paragraph
      text:
        ru: 'Самохвала, то је велики грех, и зато велико бреме. Уопште, сваки грех је бреме. И сваки од нас мора носити бреме својих грехова, докле? Док се у бескрајној покајничкој самоосуди не смири пред Оним који узима на себе грехе света, па и твој, па и мој (ср.Ин.1:29). Јер једино Њему, Једино Безгрешном, бреме грехова наших није тако тешко да Га обори у смрт, у немоћ, у пораз, у ропство. Као свејак и свемоћни Бог – «Он немоћи наше узе и болести понесе» (Мф.8:17). Али Га никаква немоћ наша не може онемоћати да пада у грех, нити икаква болест наша оболестити да пада у очајање. Тешко бреме грехова мојих постаће мени лако, само када га због покајничке свесмирености моје свемоћни Господ свемилостиво узме на себе. Зато свежалостиви Спас и позива к себи све који су уморни од греха и смрти и натоварени њиховим бременима, да приђу к Њему да их Он одмори, узевши на себе бремена њихова (ср.Мф.11:28–30). Пошто се грех разлио по целом бићу људском, и огреховио и душу нашу и савест и вољу и мисао и срце и тело, није ли зато све то човеку постало терет и бреме: и сама душа, и сама савест, и сама мисао, и само постојање? Једино у Господу Христу Богочовеку, и са Њим сва та бремена постају лака. Бреме савести, бреме душе, бреме слободе, бреме постојања, све је то неподношњиво без Христа; а са Њим – лако и благо. Бреме пак непокајаних грехова твојих остаје на теби, знаш ли докле? Све до Страшнога Суда. Јер нико у свету нема права и власти и моћи отпуштати грехе, нико сем Господа Христа. Ми људи можемо опраштати грехе, али отпуштати их, уништавати их може само безгрешни Господ Христос (ср.Мф.9:2–7), и они којима Он даје ту власт и ту силу (ср.Ин.20:22–23). Тако, бреме грехова твојих може и пре Страшнога суда, може и сада, одмах скинути са тебе Господ Христос, само под једним условом: под условом твога добровољног и све смиреног покајања које живи јаком вером, огромном надом, пламеном молитвом. Научити се таквом покајању, и свима осталим светим врлинама које оно за собом носи и води, то је прва дужност нас људи, свих људи, јер смо сви под гресима, под њиховим тешким бременима.'
        cn: 自夸，这是一大罪，因此也是一大重担。总而言之，每一个罪都是重担。我们每个人都必须背负自己罪孽的重担，直到何时呢？直到他在无止境的忏悔式自我谴责中，在那背负世人（包括你的，也包括我的）罪孽者面前谦卑下来（参约翰福音 1:29）。因为唯独祂，这位独一无罪者，我们罪孽的重担并非如此沉重，以至于将祂击垮至死亡、无力、失败、奴役之中。作为全能全力的上帝——「祂担当了我们的软弱，背负了我们的疾病」（马太福音 8:17）。但是，我们任何的软弱都不能使祂软弱无力以至于犯罪，我们任何的疾病也不能使祂病弱以至于陷入绝望。我罪孽的沉重重担将变得对我而言轻省，只有当因着我全然忏悔的谦卑，全能的主以全然怜悯的心将其背负于自身时。因此，全然慈悲的救主也召唤所有因罪与死亡而疲惫、并被其重担所压服的人，到祂这里来，祂好使他们安息，背负他们的重担（参马太福音 11:28-30）。既然罪已蔓延至整个人类存有，使我们的灵魂、良心、意志、思想、心灵和肉体都沾染了罪，那么，所有这些不也因此成了人的重担吗：灵魂本身、良心本身、思想本身，乃至存在本身？唯独在主基督这位神人之中，并与祂同在时，所有这些重担都变得轻省。良心的重担、灵魂的重担、自由的重担、存在的重担，这一切在没有基督的情况下都是无法承受的；而与祂同在时——却是轻省而甘甜的。然而，你那未曾忏悔的罪孽重担仍留在你身上，你知道直到何时吗？直到可怖的审判日。因为世上无人拥有权利、权柄和能力赦免罪孽，除了主基督，无人能如此。我们人类可以宽恕罪孽，但是，赦免它们、毁灭它们唯有无罪的主基督才能做到（参马太福音 9:2-7），以及那些祂将此权柄与能力赋予之人（参约翰福音 20:22-23）。因此，你罪孽的重担甚至可以在可怖的审判日之前，甚至现在，立刻就可以由主基督从你身上卸去，只有一个条件：那就是你自愿且全然谦卑的忏悔，这种忏悔借由坚定的信心、巨大的盼望、炽热的祷告而存活。学习这样的忏悔，以及所有其他它所带来并引导的圣德，这是我们人类，所有人类的首要职责，因为我们都身负罪孽，身负其沉重重担。
    - type: paragraph
      text:
        ru: '6:6'
        cn: '6:6'
    - type: paragraph
      text:
        ru: 'Зато учитељи који нас томе уче, наши су спасиоци. Јер нам кроз покајање дају спасење, а у спасењу сва блага непролазна и вечна, небеска и божанска. Њихов се труд ничим не може исплатити, нити довољно наградити. Њихова је права награда једино на небесима (ср.Мф.5:12–19). Бринући се о највећој вредности бића људског – боголикој души, и дајући човеку највеће и једино вечно благо – спасење душе, учитељи ваши све време живота земаљског троше на то што је вечно, а ви за то узвраћајте додељујући им од својих земаљских добара. Гле, учитељи ваши – спасиоци ваши су у улози просјака! А то је на опомену њима и на поуку вама: јер спасење које вам дају није од њих већ од Спаситеља. Стално заузети преношењем вечних божанских блага од Спаситеља вама спасаванима, они се не брину о храни и одећи, зато је ваша еванђелска дужност да ви ту бригу бринете о њима. Који Еванђеље проповедају, нека од Еванђеља живе (1Кор.8:14). То је на смирење и љубав, и њима и вама: и учитељима и ученицима. Ви зависите од њих у ономе што је вечно за вас и по вас, а они зависе од вас у ономе што је земаљско и потребно за одржавање телесног живота. То је тако, да бисте се међусобно смиравали и једни друге љубили као добротворе. Сви сте ви у исто време и просјаци и дародавци: ви сте просјаци којима они удељују вечну духовну храну, а они су просјаци којима ви удељујете телесну храну. А богатство и њихово и ваше није од вас него од Бога: земља и све што је на њој, од Бога је; спасење и Царство небеско, такође је од Бога. А ваш и њихов је само труд, само ревност. Зато ће се свакоме дати плата по труду његовом (1Кор.3:8).'
        cn: 那些教导我们这些的教师，是我们的拯救者。因为他们借着悔改赐予我们救恩，而在救恩中，是所有不朽、永恒、属天和神圣的福分。他们的劳苦无法用任何事物偿还，也无法得到足够的报答。他们真正的赏赐唯独在天上（参阅马太福音 5:12-19）。你们的教师关心着人类存在之最大的价值——那肖似上帝的灵魂，并赐予人类最大且唯一永恒的福分——灵魂的救恩，他们将此生所有的光阴都花在永恒之事上，你们则当以地上的财物回馈他们。看哪，你们的教师——你们的拯救者们竟然处于乞丐的境地！这既是对他们的警醒，也是对你们的教诲：因为他们所赐予你们的救恩并非来自他们，而是来自那位救主。他们始终忙于将救主永恒的神圣福分传递给你们这些蒙受救恩的人，他们不为食物和衣裳忧虑，因此，你们的福音责任就是为他们操心这些事。传福音的人，就当靠福音养生（哥林多前书 8:14）。这是为了谦卑和爱，对他们和你们而言：既是为了教师，也是为了学生。你们在与你们自身相关的永恒之事上仰赖他们，而他们在地上所需以及维持身体生命之事上则仰赖你们。这样，你们就能彼此谦卑，并将彼此视为恩人而相爱。你们所有人同时都是乞丐和施予者：你们是他们施予永恒属灵食物的乞丐，而他们则是你们施予身体食物的乞丐。而他们和你们的财富并非来自你们，而是来自上帝：大地及其上的一切都来自上帝；救恩和天国也同样来自上帝。而你们和他们的仅仅是劳苦，仅仅是热心。因此，各人都要照自己的劳苦得报酬（哥林多前书 3:8）。
    - type: paragraph
      text:
        ru: '6:7'
        cn: '6:7'
    - type: paragraph
      text:
        ru: 'Смешна је, лакомислена је, убитачна је човекова самообмана: хтети изиграти свемогућег и свеправедног Бога; изиграти ма кад и ма у чему. Јер Бог цени и суди човека по васцелом бићу његовом, видљивом и невидљивом, и по васцелој делатности његовој, видљивој и невидљивој. Биће човеково је више невидљиво него видљиво. Али Бог увек јасно и свепроницљиво види и оно што је невидљиво у човеку. А у човеку је несравњено више невидљивог него видљивог: видљиво је тело, и видљива су дела учињена телом, посредством тела; а невидљива је душа, невидљива савест, невидљива воља, невидљиво срце; невидљиве су мисли, невидљива осећања, невидљиве жеље, намере, хтења, и многа душевна расположења и стања. И у томе невидљивом је прави човек, одговорни човек. То баш невидљиво и условљује и одређује човеков видљиви живот по телу у свету. А свевидећи Господ прати сва збивања у човеку од њихових најневидљивијих заметака, па до потпуне зрелости, до савршене уобличености њихове. Једино Он Свевидећи види како се у човеку зачиње невидљива мисао, како клија, расте, сазрева, како се покаткад облачи у видљиве форме, руха, или како сва невидљива влада свим видљивим, телесним животом човековим. Што човек посеје у себи и у свету око себе, то ће и пожњети, ако не раније, оно сигурно на дан Страшнога суда. Дотле, он и може заборавити себе, а можда и многе око себе, али на Страшном суду, сам ће својим српом на очиглед свима пожњети њиву живота свога. Тада ће све његове обмане и самообмане, којима је варао себе и људе, и мислио да вара свезнајућег и свеправедног Бога, пасти на њега самог, вратити се њему као његова вечна својина, да му оне буду и његова вечност и његов непролазни свет. Тек тада ће он свим очима бића свог сагледати и увидети да је изиграо не Бога већ себе.'
        cn: 荒谬的，轻浮的，致命的是人的自我欺骗：想要愚弄全能又全义的上帝；在任何时候、任何事情上愚弄祂。因为上帝评价并审判人是按照他整个的存有，无论可见的还是不可见的，以及他整个的活动，无论可见的还是不可见的。人的存有更多的是不可见的，而不是可见的。但上帝总是清晰且全知洞察地看见人里面那不可见的一切。而在人里面，不可见的比可见的要多得多：身体是可见的，通过身体所做的行为也是可见的；但灵魂是不可见的，良心是不可见的，意志是不可见的，心灵是不可见的；思想是不可见的，感受是不可见的，欲望、意图、意愿，以及许多心灵的情绪和状态，都是不可见的。正是在这不可见的一切中，住着真正的、负有责任的人。正是这不可见的一切制约并决定着人在世上属肉体的可见生活。而全视的上帝关注着人里面一切的发生，从它们最不可见的萌芽，直到完全的成熟，直到它们完美的成形。唯有祂，全视者，才看见一种不可见思想是如何在人里面孕育的，如何发芽、成长、成熟，有时如何穿上可见的形式、外衣，或者整个不可见的一切如何掌管着人可见的、属肉体的生命。人在自己里面和自己周围的世界里所播种的，他也必收割，如果不是更早，那也肯定是在可怕的审判日。在此之前，他也许会忘记自己，或许也会忘记他身边许多的人，但在可怕的审判日，他自己必在众目睽睽之下，亲手用自己的镰刀收割他生命的田地。那时，他所有的欺骗和自我欺骗，那些他用来欺骗自己和他人，并以为自己欺骗了全知又全义的上帝的一切，都将落到他自己身上，作为他永远的产业归还于他，使它们成为他的永恒和他的不朽世界。唯有那时，他才会用他存有的所有眼睛来审视并明白，他愚弄的不是上帝，而是他自己。
    - type: paragraph
      text:
        ru: '6:8'
        cn: '6:8'
    - type: paragraph
      text:
        ru: 'Човек у овоме свету може сејати из себе или оно што је смртно или оно што је бесмртно: смртно је све што је од греха, што води греху, и што држи у греху; а бесмртно је божанско, боголико, богочежњиво, богољубиво, богоцентрично, тојест све што је од Бога, што води Богу, и што држи у Богу. Сматра ли човек да је он само тело, и живи ли само ради тела и телом, и ради ли све само за тело и ради тела, и сеје ли по њему само телесне жеље и сласти, од тога ће пожњети трулеж. Јер тело човеково, одвојено од боголике душе и од Духа Божјег, не може друкчије завршити него као трулеж. Свака телесна жеља, када сазри, зар не сазри трулежју? Сваки грех, посејан у тело, зар не сазри као смрт? Свака сласт, посејана у тело, зар не завршава трулежју чим се смрт косне тела? Сваки човек који живи ради тела, као завршног циља свога постојања, не може не пожњети од тела трулеж, само трулеж. «Који ору муку и сеју невољу, то и жању. Од дихања Божјег гину, и од даха ноздрва његових нестаје их» (Иов.4:8–9; ср.Притч.22:8).'
        cn: 人在这个世界上可以从自己里面播种，或是那必朽坏的，或是那不朽坏的。必朽坏的是一切源于罪、导向罪并使人陷于罪中的事物；而不朽坏的则是神圣的、肖乎神的、渴慕神的、爱神的、以神为中心的，也就是说，一切源于神、导向神并使人安住在神里面的事物。人若认为自己仅仅是身体，并只为身体而活、靠身体而活，只为身体而做一切事、只为身体的缘故，并在其上只播种肉体的欲望和享乐，就必从中收割腐朽。因为人的身体，一旦脱离了肖乎神的灵魂和神的灵，除了归于腐朽，别无其他结局。每一个肉体的欲望，当它成熟时，岂不以腐朽而告终吗？每一个播种在身体里的罪，岂不成熟为死亡吗？每一种播种在身体里的享乐，一旦死亡触及身体，岂不归于腐朽吗？每一个为身体而活的人，将身体作为自己存在的最终目的，都无法不从身体收割腐朽，只有腐朽。«耕种苦难，撒播祸患的，就必照样收割。他们因神的呼气而灭亡，又因他鼻孔的气而消灭» (约伯记 4:8-9；参阅 箴言 22:8)。
    - type: paragraph
      text:
        ru: 'А како човек сеје себе у Духа Светога? Помоћу светих врлина: вере, љубави, наде, молитве, поста, и других. Зар молитвом својом човек не сеје своје мисли, своја осећања, своја расположења, своје чежње у – Духа Светога? зар кроз њих не предаје душу своју, срце своје, савест своју, живот свој – Духу Светом? Тако и кроз љубав, и кроз веру, и кроз све свете врлине човек сеје себе по вечности Духа Светога: Његове Истине, Његове Правде, Његове Љубави. Хришћанин човек најпре је кроз свету тајну крштења посејао свебиће своје по Духу Светом; и сав каснији живот његов није ништа друго до сејање себе кроз свете тајне и свете врлине по Духу Светом. И Дух Свети живи у њему кроз свете тајне и свете врлине (ср.Рим.8:9–10), и узраста у њему све што је божанско, еванђелско, бесмртно, вечно, богочовечно, зато ће од Духа Светога и пожњети живот вечни.'
        cn: 一个人如何将自己播撒到圣灵之中？借助于圣洁的德行：信、爱、望、祷告、禁食以及其他德行。难道人不是借着自己的祷告，将他的思想、情感、心绪、切慕播撒到圣灵之中吗？难道不是借着它们，将他的灵魂、他的心、他的良知、他的生命献给圣灵吗？同样地，人也借着爱，借着信，并借着所有圣洁的德行，将自己播撒在圣灵的永恒之中：祂的真理，祂的公义，祂的爱。基督徒首先是借着圣洗圣事，将他的全人播撒在圣灵之中；他之后所有的人生，无非是借着圣事和圣洁的德行，将自己播撒在圣灵之中。圣灵借着圣事和圣洁的德行住在他里面（罗马书 8:9-10），并使他里面成长一切神圣的、福音的、不朽坏的、永恒的、神人性的事物，因此他将从圣灵那里收割永生。
    - type: paragraph
      text:
        ru: 'Хришћанин зна да је човек боголиком душом својом биће небеско, бесмртно, вечно, богочовечно; зна да му је живот на земљи дат, да изврши свој вечни задатак, вечни посао: да стекне живот вечни. И сав живот свој на земљи он проводи у сејању по бићу свом онога што је бесмотно и вечно. А то је? Све што је еванђелско, Христово, богочовечанско. Сејући то, он непрестано узраста себе благодаћу ка свему што је вечно, богочовечно, небеско, док не узрасте «у човека савршена, у меру раста висине Христове» (Еф.4:13), и тако стварно и свесавршено постигне у Христу Богочовеку живот вечни, свој живот вечни, јер је Господ Христос ради тога и дошао у наш свет, ради тога управо и постао човек, да човеку, сваком човеку, да живот вечни (ср.Ин.17:2–3). А даје то свакоме који верује у Њега као Богочовека (Ин.3:15–16, 36, 6:47).'
        cn: 基督徒知道，人以其肖似神的灵魂，是天上的、不朽的、永恒的、神人性的存有；他知道，他地上的生命被赐予，是为了完成他永恒的任务，永恒的工作：获得永生。他将他地上所有的生命，都用于在他自身中播种不朽和永恒的事物。而那是什么呢？是凡福音性的、属基督的、神人性的事物。播种这些，他便借着恩典不断地使自己成长，趋向一切永恒的、神人性的、天上的事物，直到他长成「完全人，达到基督身量长成的尺度」（以弗所书 4:13），并因此在神人基督里，真实且全然完美地获得永生，他自己的永生，因为主基督正是为此而来到了我们的世界，正是为此而成为人，为了赐予人，赐予每一个人永生（参阅约翰福音 17:2-3）。而他将这赐予每一个相信祂是神人的人（约翰福音 3:15-16，36，6:47）。
    - type: paragraph
      text:
        ru: '6:9'
        cn: '6:9'
    - type: paragraph
      text:
        ru: 'Дајући живот вечни, вера у Христа је увек делотворна, делатна, увек жива и орна да чини и твори оно што сачињава суштину вечнога живота, оно што је вечно. А то је? На првом месту: добро. Зато да нам се не досади чинити добро, јер чинећи добро ми сејемо оно што је вечно и што доноси вечне плодове који не труле, нити их икаква смрт уништити може. Када на њиви душе наше узрасту плодови посејаног добра, и сазру, њих ће у дан свеопште жетве Анђели Божји пожњети и однети у «житницу Божју» (ср.Мф.13:10). А са њима и у њима и душу нашу, која је сва проклијала, узрасла и сазрела у ономе што је вечно и богочовечно, а то значи: што је истински и стварно добро. Јер шта је то што је истински добро у нашем човечанском свету? Само оно што је од Бога, и што води Богу, и што држи у Богу, који је једини добар, јер «нико није добар осим једнога Бога» (Мф.19:17), тојест нико осим Бога није савршено, вечито, неизменљиво добар. Наше људско добро је само утолико добро, уколико је од Бога и ради Бога и ка Богу; уколико је слика Божјег добра, коју одражава наша боголика душа чинећи добро. Значи: добро је само онда истински добро, ако је божанско. А у нашем човечанском свету ми знамо као јединог истинитог Бога само Богочовека Господа Христа, зато што је у нашем земаљском свету једини Он показао у Својој личности савршено божанско добро, остваривши га савршено у своме богочовечанском животу на земљи. Он је и оличење и оваплоћење и остварење савршеног божанског добра, те тиме једини извор и једино мерило тог добра. И ми људи на земљи не можемо ни имати ни чинити истинско добро без Њега и мимо Њега и против Њега, већ једино и само са Њим, помоћу Њега и ради Њега. Зато је Он и објавио свеистиниту благовест: «Без мене не можете чинити ништа» (Ин.15:5): ништа истински добро, истински божанско, истински бесмртно, истински вечно, истински човечно. Само када се човек благодатним подвизима вере, љубави, наде, а најпре светим крштењем и причешћем, духовно органски сједини са Господом Христом, као лоза са чокотом, може рода родити: истинско добро, божанско и вечно; а без тога, човек остаје бесплодан и неродан за свако истинско добро. И опет по свеистинитој речи Свеистинитога: «Ја сам чокот а ви лозе. Као што лоза не може рода родити сама од себе ако не буде на чокоту, тако и ви ако у мени не будете. Који буде у мени и ја у њему он ће родити многи род: јер без мене не можете чинити ништа» (Ин.15:4–5).'
        cn: 赐予永生，对基督的信心始终是有效、有力的，始终鲜活且乐于行事和创造那构成永生本质的事物，即那永恒之物。这又是什么呢？首先是：善。因此，愿我们不要厌倦行善，因为通过行善，我们播种的是永恒之物，它结出永恒的果实，永不朽坏，也无任何死亡能将其摧毁。当我们灵魂的田野里所播种的善结出果实，并成熟时，在普遍收割之日，上帝的众天使会将它们收割，带入「上帝的谷仓」（参 马太福音 13:10）。随同这些果实，在它们之中，还有我们的灵魂，它已完全在永恒和神人（theanthropic）之事上发芽、成长并成熟，这意味着：那是真实且实际的善。因为，在我们的人类世界里，究竟何为真实之善呢？唯有源于上帝、引向（或：导向）上帝、并将我们持守在上帝之中的事物，祂是独一的良善者，因为「除了独一的上帝以外，没有良善的」（马太福音 19:17），也就是说，除了上帝以外，没有谁是全然、永恒、不变地良善的。我们人类的善，只有在以下程度才是善：只要它源于上帝，为着上帝，并导向上帝；只要它是上帝之善的形象，而我们神似的灵魂通过行善来映照它。这意味着：善，唯有当它是神圣的，才是真实之善。而在我们人类世界里，我们仅将神人主基督视作唯一的真上帝，因为在我们的尘世间，唯有祂在自己的位格中展现了完美的、神圣的善，并在祂于地上的神人生命中完美地实现了它。祂既是完美神圣之善的化身、道成肉身，也是其实现，因此祂是这善的唯一源头和唯一尺度。而我们世人，若无祂、离弃祂或对抗祂，便不能拥有或行出真实之善，唯有与祂同在、借着祂、并为着祂，才能如此。因此祂也宣告了全然真实的好消息：「离了我，你们就不能做什么」（约翰福音 15:5）：没有任何真实之善，没有任何真实神圣、真实不朽、真实永恒、真实人性的事。唯有当一个人通过信、爱、望的恩典性苦修，首先通过圣洗和圣餐，属灵地有机地与主基督联合，如同枝子与葡萄树，才能结果子：真实之善，神圣且永恒；而若无此，人便对一切真实之善保持不结果子、毫无生产力。再者，根据那全然真实者的全然真实之言：「我是葡萄树，你们是枝子。枝子若不常在葡萄树上，自己就不能结果子；你们若不常在我里面，也是这样。常在我里面的，我也常在他里面，这人就多结果子；因为离了我，你们就不能做什么」（约翰福音 15:4-5）。
    - type: paragraph
      text:
        ru: Само живећи у Христу помоћу светих тајни и светих врлина, ми можемо увек, без краја и конца, с радошћу чинити добро – «да нам се не досади». Јер Он Својим следбеницима увек даје неисцрпне силе да чине добро и да живе добром и ради добра, свесни да их то добро и држи у заједници и јединству са «Једино Добрим», у коме су сва вечна блага и све вечне радости. Разуме се, наше се добро у овоме свету често мора рађати у мукама и опасностима од зла, које са свих страна напада на наше божанско добро. Али радост је наша у томе што ми знамо да је наше христовско добро увек јаче од сваког ђаволског зла у нашем човечанском свету, и то јаче колико је свемоћни Бог јачи од кукавног ђавола. Хранећи душу своју том вером и том надом, ми нећемо сустати у чињењу добра, које ће на крају свих крајева сазрети и бити пожњевено у дан свеопште жетве, и заједно са нама бити однесено у царство небеско.
        cn: 唯有藉着圣事与圣德在基督里生活，我们才能永远、无始无终地、带着喜乐行善——「使我们不至于厌倦。」因为祂总是赐予祂的追随者们无穷无尽的力量，去行善、去活出良善并为了良善而活，使他们意识到那良善也使他们与「独一的良善」保持着共融和合一，在祂那里有所有永恒的财宝和所有永恒的喜乐。当然，在这个世界上，我们的良善常常必须在痛苦和邪恶的危险中诞生，那邪恶从四面八方攻击我们的神圣良善。但我们的喜乐在于我们知道，我们的基督式良善总是比我们人类世界中任何魔鬼的邪恶更强大，而且这种强大，就像全能的上帝比懦弱的魔鬼更强大一样。以这种信心和这种希望喂养我们的灵魂，我们将不致在行善中懈怠，那良善终将在万物之末成熟，并在普世收割之日被收割，并与我们一同被带入天国。
    - type: paragraph
