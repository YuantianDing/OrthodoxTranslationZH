title:
  ru: Тумачењe посланице Галатима Светог Апостола Павла
  cn: 加拉太书释义
authors:
- cn: 圣游斯丁·波波维奇
  ru: преподобный Иустин (Попович)
document:
- type: heading4
  text:
    ru: Введение
    cn: 引言
  children:
  - type: paragraph
    text:
      ru: ГлаваIIIIIIIVVVI
      cn: 章二三四五六
  - type: paragraph
    text:
      ru: 'При корекцији овог авиног «Тумачења посланице Галатима Св. апостола Павла» користили смо издање манастира Ћелије код Ваљева, Београд 1986; а за корекцију старо-грчког текста посланице користили смо: Η ΚΑΙΝΗ ΔΙΑΘΗΚΗ, ΕΓΚΡΙΣΕΙ ΤΗΣ ΜΕΓΑΛΗΣ ΤΟΥ ΧΡΙΣΤΟΥ ΕΚΚΛΗΣΙΑΣ, ΑΔΕΛΦΟΤΗΣ ΘΕΟΛΟΓΩΝ «Ο ΣΩΤΗΡ» ΑΘΗΝΑΙ – ΙΑΝΟΥΑΡΙΟΣ 1980, и интернет издање Myriobiblos – Home of the Greek Bible – Library of the Church of Greece, на линку: http://www.myriobiblos.gr/bible/nt2/default.asp (Зор. А. Ст.).'
      cn: 在校订这位长老撰写的《圣使徒保罗致加拉太人书信诠释》时，我们采用了位于瓦列沃附近的切利耶修道院于1986年在贝尔格莱德出版的版本；而为校订该书信的古希腊文本，我们采用了： Η ΚΑΙΝΗ ΔΙΑΘΗΚΗ （新约），蒙基督大教会批准，神学家兄弟会《救主》，雅典，1980年1月；以及希腊教会图书馆——希腊圣经之家（Myriobiblos）的在线版本，网址为：http://www.myriobiblos.gr/bible/nt2/default.asp（Зор. А. Ст.）。
  - type: paragraph
    text:
      ru: Увод[1]
      cn: 引言[1]
  - type: paragraph
    text:
      ru: 'У нашем земаљском свету потпуно је ново само оно што је Христово, а све остало је старо, састарено смртношћу и земљосано пролазношћу. Христос је «једино ново под сунцем» тиме што је Богочовек. Као Богочовек Он Својим Божанством чини човека новим, неостариво новим, и све чега се дотакну Његове божанске силе. А човек без Богочовека, и све што је од таквог човека, увек је старо, и то очајнички, језиво, самртнички старо. Међутим, све што је Богочовеково – божански је савршено и човечански стварно, и никада не стари и не застарева. И Његово Еванђеље потпуна је новина у нашем човечанском свету, зато што је од Богочовека и по Богочовеку. Богочовечност је његова главна одлика и ознака, његова вечита категорија и суштина, којом се оно разликује и издваја од свега људског и земаљског. У Христовом Еванђељу нема ништа «по човеку» и «од човека» (Гал.1:11–12); у њему је све од Богочовека и по Богочовеку. Истински благе вести за човечије биће нема без Богочовека и мимо Богочовека: сва Благовест = сво Еванђеље налази се једино у Богочовеку. Блага вест је за човека Вечна Истина; а она је сва у Богочовеку. Блага вест је Вечна Правда, Вечна Љубав, Вечна Лепота, Вечни Живот, Вечно Блаженство; а све је то само у Богочовеку. Победа над смрћу – сваком смрћу, над злом – сваким злом, над ђаволом – сваким ђаволом, само је у Богочовеку. А зар то није истинска благовест, истинско Еванђеље? Блага вест је Бог са свима савршенствима Својим; а такав Бог је само Богочовек Христос.'
      cn: 在我们这属世的世界中，唯有基督的才是全然新的，而其他一切都是旧的，被死亡所腐蚀，被短暂所败坏。基督是「日光之下唯一的新事」，因为祂是神人。作为神人，祂以祂的神性使人成为新的，永不衰老的新，以及凡祂神圣能力所触及的一切。然而，没有神人的人，以及一切源自这样的人的事物，总是旧的，而且是绝望地、可怕地、垂死地陈旧。然而，凡属神人的，都是神性上完美的，人性上真实的，且永不衰老，永不过时。祂的福音在我们的人类世界中是全然的新事，因为它源自神人并依照神人。神人合一性是它的主要特征和标志，是它永恒的范畴和本质，借此它区别并超拔于一切属人的和属世的事物。在基督的福音中，没有什么是「出于人意」和「源于人」的（加拉太书 1:11-12）；在它里面，一切都源自神人并依照神人。对于人类而言，没有神人或脱离神人，就没有真正的好消息：所有的佳音，所有的福音，都只存在于神人之中。佳音是人类的永恒真理；而这真理完全在神人之中。佳音是永恒的公义，永恒的爱，永恒的美善，永恒的生命，永恒的福乐；而这一切都只在神人之中。战胜死亡——一切死亡，战胜邪恶——一切邪恶，战胜魔鬼——一切魔鬼，都只在神人之中。难道这不是真正的佳音，真正的福音吗？佳音是拥有祂一切完美属性的上帝；而这样的上帝唯独是神人基督。
  - type: paragraph
    text:
      ru: 'Зато је сав смисао и сав циљ човекова бића на земљи: обући се у Богочовека Христа (Гал.3:27), и живети Богочовеком Христом у потпуности, заменити себе Њиме, не живети више као човек већ као благодатно богочовечанско биће, у коме је Бог увек на првом а човек увек на другом месту, у коме човек мисли, осећа, дёла, живи Богом (Гал.2:20). Тек са Богочовеком Христом постаје се прави човек, потпун, бесмртан, вечни човек. Бог је тога ради и постао човек, да човека обожи, обогочовечи, учини бесмртним и вечним бићем. Како? Собом, свим Својим божанским особинама и силама. Кроз сједињење себе са Богочовеком, човек се спасава, једино тако спасава свега смртног, свега греховног, свега злог, свега ђавољег. Јер само свемоћни Бог, ушавши у човека, може потиснути и истиснути из њега и сатерати у небиће свако зло, сваки грех, сваку смрт, сваког ђавола. И тако човек постиже једину истинску слободу у овом свету, и кроз овај свет у свима световима: слободу у Христу од сваке смрти и греха и зла и сатанизма.'
      cn: 因此，人类在世上存在的全部意义和全部目标是：穿上神人基督（加拉太书 3:27），并完全地活出神人基督，用他取代自己，不再作为人而活，而是作为蒙恩的神人存在，在其中，上帝永远居于首位，而人永远居于次位，在其中，人思想、感受、行动，并以神而活（加拉太书 2:20）。唯有藉着神人基督，人才能成为真正的人，一个完全的、不朽的、永恒的人。上帝为此道成肉身成为人，为了使人神化，使人神人化，使其成为不朽和永恒的存在。如何做到？藉着祂自己，藉着祂所有神性的属性和力量。藉着使自己与神人合一，人才能得救；唯有如此，才能摆脱一切属死的、一切属罪的、一切属恶的、一切属魔鬼的事物。因为唯有全能的上帝，进入到人里面，才能将一切的邪恶、一切的罪、一切的死亡、一切的魔鬼从人里面压制、驱逐，并驱入虚无。如此，人便在这世上获得了唯一真正的自由，并藉着这个世界，在所有的世界中获得这种自由：即在基督里，摆脱一切死亡、罪恶、邪恶和撒但主义的自由。
  - type: paragraph
    text:
      ru: 'Зато је та христовска слобода најскупоценија вредност, у којој хришћанин треба увек да стоји (Гал.5:1). А како се стоји у тој слободи? Живећи Духом Светим и даровима Духа Светога: љубављу, радошћу, миром, трпљењем, добротом, милошћу, вером, кротошћу, уздржањем, и осталим светим врлинама еванђелским (Гал.5:16–25). Те свете врлине распињу у човеку све страсти и телесне жеље, свако сластољубље и грехољубље, умртвљују их, и човек сав живи Христу и Христом, сав постаје Христов: даноноћно распиње тело своје са страстима и жељама (Гал.5:24). А то распињање себе уствари је стално васкрсавање себе у све што је божанско, бесмртно, вечно, богочовечно; то је стално побеђивање у себи свега смртног, грехочежњивог, ђавоцентричног.'
      cn: 因此，这基督里的自由是基督徒应当常存其中的最宝贵的价值（加拉太书 5:1）。那么，如何在这自由中站立呢？靠圣灵而活，并靠着圣灵的恩赐：仁爱、喜乐、平安、忍耐、恩慈、良善、信实、温柔、节制，以及其他圣洁的福音德行（加拉太书 5:16-25）。这些圣洁的德行，将人里面的一切情欲和肉体的私欲，一切贪恋享乐和贪爱罪恶钉死，将它们治死，使人全然为基督而活，并靠着基督而活，全然属于基督：昼夜将自己的肉体和情欲、私欲同钉十字架（加拉太书 5:24）。而这钉死自己，实际上是不断地使自己在一切神圣的、不朽的、永恒的、神人性的事物中复活；这是不断地战胜自己里面一切必死的、贪慕罪恶的、以魔鬼为中心的事物。
  - type: paragraph
    text:
      ru: 'Само благодатним доживљавањем Богочовека Христа као себе, као биће свога бића, човек се спасава трагичне ништавности и језиве паклености свога ванбожјег постојања, савлађује небиће у себи и у свету око себе, и улази у Свебиће као посебна, света, освећена, обогочовечена, обожена личност. То благодатно-врлинско охристовљење себе је дуг и доживотни подвиг. Богочовеком Христом човек стално распиње себе свету, и свет себи (Гал.6:14); и на тај начин постаје «нова твар» = καινὴ κτίσις (Гал.6:15), ново створење, нови човек. Нови човек: сав од Богочовека, у Богочовеку, по Богочовеку. Тај нови човек је увек нов, јер је у нераздељивом благодатном јединству са Господом Христом, који је неизменљиво и неостариво увек нови човек тиме што је Богочовек. Бог је тај који човеку даје неостариви Живот и Истину и Правду и Љубав и Бесмртност и Вечност. Христов човек никада не стари: јер само смрт и грех и зло састарују човека. А у Богочовеку Христу, и у Христовом човеку – све је увек ново, јер је све вечно, богочовечно: а вечно и јесте оно што не стари и не пролази, што је увек ново, и из дана у дан све новије и новије. Само у јединству са Богом човек не стари: увек је нов животом, нов истином, нов правдом, нов љубављу, јер је Божја правда вечна и бесконачна, и зато се увек доживљује као нешто бесконачно ново и бесмртно; тако исто и Божја љубав, и Божја истина, и Божји живот. Да, са Богочовеком човек се непрекидно обнавља у све новије и новије биће; а ван Њега и без Њега – човек се распада, непрекидно распада у безброј назовибића и злобића, доживљујући себе као проклетство, као ужас, као бесконачну смртност, као бесконачно умирање, као бесмртно издисање, као бесмртни ропац.'
      cn: 唯有通过恩典的体验，将神人基督视为自身，视为自身存有的本质，人才能从他离神的存有中那悲剧性的虚无和可怖的地狱性中得救，克服自己里面和周围世界的虚无，并作为独特的、神圣的、成圣的、被神人化的、被神化的人格，进入万有。这种恩典与美德的自我基督化是一项漫长而终生的修行功绩。借着神人基督，人不断地将自己钉死于世界，也让世界钉死于自己（加拉太书 6:14）；并且以这种方式成为「新造的人」 = καινὴ κτίσις（加拉太书 6:15），一个新受造物，一个新人。新人：完全出自神人，在神人之中，效法神人。这个新人永远是新的，因为他与主基督处于不可分割的恩典合一之中，主基督借着祂是神人，从而不变且不朽地永远是新人。是上帝赐予人那不朽的生命、真理、公义、爱、不朽和永恒。属基督的人永不衰老：因为唯有死亡、罪和邪恶使人衰老。然而，在神人基督里，以及在属基督的人里面——一切永远都是新的，因为一切都是永恒的，神人性的：而永恒的，正是那不衰老、不消逝的，是永远新鲜的，而且日复一日地更加新鲜。唯有与上帝合一，人才能不衰老：永远在生命上是新的，在真理上是新的，在公义上是新的，在爱上是新的，因为上帝的公义是永恒且无限的，因此它总被体验为无限新鲜和不朽的事物；上帝的爱、上帝的真理和上帝的生命也同样如此。是的，与神人同在，人便不间断地更新，进入越来越新的存有之中；然而，离开祂，没有祂——人就会瓦解，不间断地瓦解成无数的所谓存在和邪恶存在，体验到自己是咒诅，是恐惧，是无限的必死性，是无限的死亡，是不朽的叹息，是不朽的临终挣扎。
  - type: paragraph
    text:
      ru: 'У земаљском свету пред човеком стоје само два пута, само два начина живота: охристовљење и ођавољење. Охристовљење бива Богочовеком Христом, и то помоћу благодатних светих тајни и еванђелских светих врлина; а ођавољење бива ђаволом, и то помоћу разноврсних грехова и страсти. Човек, сваки човек се налази на једноме од та два пута, јер трећега нема у нашем земаљском свету. Охристовљење онебесује човека, постепено га обогочовечује, обожује, уводи у божанске светове Вечне Истине, Вечне Правде, Вечне Љубави, док га најзад не уведе у Царство Небеско, Вечно Царство Божије. Ођавољење пак бива постепено кроз грехољубље, кроз живљење у гресима и страстима: човек ођавољује себе блудом, прељубом, нечистотом, срдњом, пркосом, распром, саблазнима, јересима, завишћу, убиством, пијанством, ждерањем, враџбинама, непријатељствима, свађама, и осталим гресима. Тако ођавољеног човека греси одводе у вечно царство греха – пакао, јер он свим бићем својим неће Царство Божје, и зато га не може ни наследити (Гал.5:16–21).'
      cn: 在尘世间，摆在人面前的只有两条道路，只有两种生活方式：基督化和魔鬼化。基督化是由神人基督借着恩典的圣奥秘和福音中的圣洁美德而成就的；而魔鬼化则是由魔鬼借着各种各样的罪和情欲而实施的。人，每一个人都行在这两条道路中的一条上，因为在我们的尘世间没有第三条路。基督化使人属天，逐渐地使他神人化、神化，将他引入永恒的真理、永恒的公义、永恒的爱这些神性的世界，直到最终将他引入天国，永恒的上帝之国。而魔鬼化则通过恋罪，通过活在罪恶和情欲中而逐渐发生：人借着淫乱、奸淫、污秽、愤怒、抗逆、纷争、引人跌倒的罪、异端、嫉妒、凶杀、醉酒、贪食、巫术、仇恨、争执以及其他罪恶而使自己魔鬼化。如此魔鬼化的人，罪恶将他引入永恒的罪恶之国——地狱，因为他以其全人（全部的生命）不愿接受上帝之国，因此也无法继承它（加拉太书 5:16-21）。
- type: heading1
  text:
    ru: Авва Јустин ЋелијскиТумачењe посланице Галатима Светог Апостола Павла
    cn: 长老 尤斯丁·切利耶斯基 圣使徒保罗致加拉太人书释义
  children:
  - type: heading2
    text:
      ru: Прва глава
      cn: 第一章
    children:
    - type: paragraph
      text:
        ru: 1:1–24
        cn: 1:1–24
    - type: paragraph
      text:
        ru: Гал.1:1–24:1Павле, апостол не од људи, нити кроз човека (οὐδὲ δι’ ἀνθρώπου = нити човеком), него кроз Исуса Христа (ἀλλὰ διὰ Ἰησοῦ Χριστοῦ = него Исусом Христом) и Бога Оца, који га васкрсе из мртвих, 2 и сва браћа која су са мном, црквама галатиским. 3 благодат вам и мир од Бога Оца, и Господа нашег Исуса Христа, 4 који даде себе за грехе наше да нас избави од садашњега света злога, по вољи Бога и Оца нашега, 5 коме слава у све векове. Амин.
        cn: '（加拉太书 1:1-5）


          1 保罗，作使徒不是由于人，也不是藉着人（οὐδὲ δι』 ἀνθρώπου = 也不是藉着人），而是藉着耶稣基督（ἀλλὰ διὰ Ἰησοῦ Χριστοῦ = 而是藉着耶稣基督），和使他从死里复活的父神， 2 以及所有与我同在的弟兄们，写信给加拉太的众教会。 3 愿恩惠平安从父神和我们的主耶稣基督归于你们！ 4 他为我们的罪舍己，为要照我们父神的旨意，把我们从这邪恶的世代中拯救出来。 5 愿荣耀归给他，直到永永远远。阿门。'
    - type: paragraph
      text:
        ru: '6 Чудим се да се тако брзо одвраћате од онога који вас позва благодаћу Христовом, на друго Еванђеље, 7 које није друго, него има неки који стварају забуну код вас и хоће да изврну Еванђеље Христово. 8 Али ако вам ми сами, или анђео с неба јави Еванђеље друкчије него што вам га ми јависмо, проклет да буде! 9 Као што пре рекосмо, и сад опет велим: ако вам ко јави Еванђеље друкчије него што га примисте, проклет да буде! 10 Зар ја сад људе наговарам или Бога? Или тражим људима да угађам? Та кад бих ја још људима угађао, не бих био слуга Христов.'
        cn: 6 我很诧异，你们这么快就离弃了那借着基督的恩典呼召你们的，转去从别的福音。7 那并不是别的福音，只是有一些人搅扰你们，并且想要篡改基督的福音。8 但即使是我们自己，或是天上的天使，若是传给你们的福音，与我们先前传给你们的不同，他就当受咒诅！9 正如我们先前所说的，现在我又再说：若有人传给你们的福音，与你们所领受的不同，他就当受咒诅！10 我现在是想取悦于人，还是取悦于神呢？我岂是寻求讨人的喜欢吗？若是我仍然讨人的喜欢，我就不是基督的仆人了。
    - type: paragraph
      text:
        ru: '11 Дајем вам на знање, браћо, да Еванђеље које сам ја јавио није по човеку: 12 јер га ја не примих од човека, нити научих, него откривењем Исуса Христа. 13 Јер сте чули моје некадашње живљење у јеврејству, да сам одвише гонио Цркву Божју и раскопавао је, 14 и напредовао у јеврејству већма од многих вршњака својих у народу своме, пошто сам одвише ревновао за предања отаца својих. 15 А кад би угодно Богу, који ме изабра од утробе матере моје и призва благодаћу својом, 16 да јави Сина свога у мени, да га објавим међу незнабошцима, ја тад не питах тела и крви, 17 нити изиђох у Јерусалим к онима који пре мене беху апостоли, него отидох у Арабију, и опет се вратих у Дамаск. 18 Три године после тога изиђох у Јерусалим да видим Петра, и остадох у њега петнаест дана. 19 Али другога од апостола не видех, осим Јакова, брата Господњег. 20 А што вам пишем ево Бог види да не лажем. 21 Затим дођох у земље Сирске и Киликијске. 22 А лицем бејах непознат црквама Христовим у Јудеји; 23 него само беху чули да онај који нас је некад гонио, сад проповеда веру коју некад раскопаваше. 24 И слављаху Бога због мене.'
        cn: 11 我向你们声明，弟兄们，我所传的福音不是出于人的：12 因为我不是从人领受的，也不是人教导我的，乃是借着耶稣基督的启示。13 你们听过我从前在犹太教中的行为，我曾极力迫害神的教会，并摧毁它；14 又在犹太教中比我本族许多同辈的人更有长进，我为我祖宗的遗传极其热心。15 然而，那把我从母腹里分别出来，又施恩召我的神，既然乐意16 将祂儿子启示在我心里，叫我把祂传在外邦人中，我当下就没有和血肉之人商量，17 也没有上耶路撒冷去见那些比我先作使徒的，反而往亚拉伯去，后来又回到大马士革。18 过了三年，我才上耶路撒冷去见彼得，和他同住了十五天。19 至于别的使徒，我都没有看见，除了主的兄弟雅各。20 我所写给你们的，看哪，神知道我没有说谎。21 后来我到了叙利亚和基利家地区。22 那时，在犹太的基督众教会，他们不认识我的面，23 他们只听说：「那从前迫害我们的，现在竟传扬他从前所要摧毁的信仰。」24 他们就为我荣耀神。
    - type: paragraph
      text:
        ru: '1:1'
        cn: '1:1'
    - type: paragraph
      text:
        ru: Апостол сам, не од људи, јер који ми то од људи може дати Вечну Истину, да је благовестим? Вечну Правду, да је спроводим? Вечну Љубав, да је расађујем? Вечни Живот, да га раздајем? истинитог Бога, да Га роду људском проповедам? чудотворну силу, да мртве васкрсавам? Свете тајне, да људе њима освећујем? свете врлине, да људе њима препорађам? божанске силе, да све смрти побеђујем и све ђаволе изгоним? небеске лекове, да људе од свих грехова лечим? Небеско Царство, да људе у њега уводим? Духа Светога, да људе охристовљујем, и од сваког греха, од сваке смрти, од сваког ђавола спасавам? Својим даровима и силама апостолство надмаша све људе; и људи, сви људи без изузетка, не располажу моћима и силама да човека начине апостолом, зато сам ја – апостол не од људи.
        cn: '我是一个使徒，不是出于人，因为有谁能从人那里把永恒的真理赐给我，使我能传扬它呢？

          永恒的公义，使我能实行它呢？

          永恒的爱，使我能播撒它呢？

          永恒的生命，使我能分赐它呢？

          独一的真神，使我能向人类宣讲祂呢？

          行神迹的能力，使我能使死人复活呢？

          圣奥秘，使我能借此使人成圣呢？

          圣洁的德行，使我能借此使人重生呢？

          神圣的力量，使我能胜过一切的死亡并驱逐一切的魔鬼呢？

          天上的良药，使我能医治人脱离一切的罪恶呢？

          天国，使我能将人引入其中呢？

          圣灵，使我能使人基督化，并使人从一切的罪恶、一切的死亡、一切的魔鬼中得救呢？

          凭着这些恩赐和能力，使徒职分超越了所有的人；而人，所有的人无一例外，都不具备能力和力量使一个人成为使徒，因此我是一个不是出于人的使徒。'
    - type: paragraph
      text:
        ru: 'Људска природа ни у једноме човеку није јача од смрти, није јача од зла, није јача од греха, није јача од ђавола, зато се никаквим човеком не може постати апостол. Ма колико се напрезала људска природа у једноме човеку, или у свима људима скупа, она није у стању да створи Вечну Истину, Вечну Правду, Вечну Љубав, Вечни Живот, зато се ни кроз каквог човека не може постати апостол Вечне Истине, Вечне Правде, Вечне Љубави, Вечног Живота. Христов апостол има, зна и благовести јединог истинитог Бога у свима световима, зато он има, зна и благовести божанске тајне свих светова: и небеског, и земаљског, и преисподњег; зато он има, зна и благовести све божанске силе, и помоћу њих побеђује све смрти, све грехе, све ђаволе, и дарује људским бићима Вечну Истину, Вечну Правду, Вечну Љубав, Вечни Живот.'
        cn: 人的本性，在任何一个人身上，都不比死亡更强大，不比邪恶更强大，不比罪更强大，不比魔鬼更强大，因此，凭任何人都不能成为使徒。无论人的本性在一个个体身上，或是在所有的人身上加起来，如何努力，它都无法创造永恒的真理、永恒的公义、永恒的爱、永恒的生命。因此，凭任何人都不能成为永恒真理、永恒公义、永恒之爱、永恒生命的使徒。基督的使徒拥有、认识并传扬在所有世界中唯一的真神，因此，他拥有、认识并传扬所有世界的奥秘：包括天上的、地上的和阴间的；因此，他拥有、认识并传扬一切神圣的能力，并借助于它们战胜一切死亡、一切罪恶、一切魔鬼，并赐予人类永恒的真理、永恒的公义、永恒的爱、永恒的生命。
    - type: paragraph
      text:
        ru: 'Све то нагони ме да вам одлучно и једном засвагда ставим до знања, да сам ја апостол – не од људи, нити кроз човека, него? – него кроз Исуса Христа, јер се благодат и апостолство добија од Господа Исуса Христа, јединог истинитог Бога. А Он то показа и доказа победивши смрт Својим васкрсењем из мртвих, и Својим вечним Богочовечанским животом после вазнесења Свог на небо. Јер као васкрсли Богочовек, Господ Христос непрестано дёла у небеском и човечанском свету. Сведок тога? Ја сам Павле, јер се мени васкрсли Господ Исус јави на путу за Дамаск, куда сам био кренуо да гоним хришћане, и позва ме на апостолство. И ја сам «апостол Исуса Христа» Богочовека (2Кор.1:1), не никаквог човека. И Он ми лично дарова све Своје богочовечанске дарове и силе, те «јесам што јесам» (1Кор.15:10). Јер Њиме, само Њиме ја и јесам апостол: Он не само живи у мени, него живи у мени место мене (Гал.2:20), живи свим бићем Својим, свим божанским савршенствима и силама Својим, дела из мене и кроз мене на спасење безброј људи, те ја све могу у Њему који ми моћи даје (Флп.4:13). Чујте, ја човек Павле све могу Богочовеком Христом. У томе је сва тајна мога апостолства. Као човек, ја Павле – сав сам слабост и немоћ; са Богочовеком Христом Господом, ја сав постајем сила и свемоћ (2Кор.12:9–11). Богочовек је једина истинска новина у роду људском: у Њему је човек постао свемоћан Богом кроз нераздељиво сједињење људске природе са Божанском. И Божанска природа преноси на човечанску све своје силе и савршенства, иако се природа Божанска не претвара у човечанску, и човечанска у Божанску. Отуда се благодатним духовним сједињењем човека са Богочовеком Христом човек обогаћује Богом, и свим оним што Бог у себи има. А да је Богочовек Христос – вечити Бог, Бог истинити, види се из Његовог свејединства са Богом Оцем: иако је постао човек, Господ Христос је и надаље остао у неизменљивом суштаственом јединству са Богом Оцем, и сав је «по вољи» Бога Оца. И у Његовом делању као Богочовека, Бог Отац непрекидно дёла (Ин.5:17). Бог Отац је најверодостојнији сведок, да је Исус Богочовек – од Њега дошао, да је истинити Син Божји и Бог. У Христу Богочовеку «пребива» Бог Отац и «твори дела» (Ин.14:10): они заједно дају и апостолство апостолима. Ето, ја сам апостол «кроз Исуса Христа и Бога Оца, који га васкрсе из мртвих». По свему, и по садржини и по суштини и по делатности, моје апостолство је сво од Господа Христа и Бога Оца. У таквом апостолству је моје Еванђеље, неизменљиво и савршено: од Бога Оца и од Његовог вечног Сина, Богочовека Христа.'
        cn: 这所有的一切都促使我坚决并一劳永逸地让你们知道，我是使徒——不是由人而来，也不是借着人，而是？——而是借着耶稣基督，因为恩典和使徒职分是从主耶稣基督，独一的真神那里得来的。而祂借此表明并证明了这一点：祂藉着从死里复活战胜了死亡，以及祂升天之后永恒的神人生命。因为作为复活的神人，主基督在天上和人类世界中不断地行动。这一切的见证人是谁？我就是保罗，因为复活的主耶稣在大马士革的路上向我显现，我当时正要前往那里逼迫基督徒，并呼召我承担使徒职分。而我就是神人「耶稣基督的使徒」（哥林多后书 1:1），并非任何人的使徒。祂亲自将祂所有神人的恩赐和能力赐予了我，因此「我成了我今日的光景」（哥林多前书 15:10）。因为借着祂，唯独借着祂，我才得以成为使徒：祂不仅活在我里面，更是替我活在我里面（加拉太书 2:20），祂以祂的整个生命，以祂所有的神性完美和能力活着，从我里面并借着我为无数人的得救而作工，因此「我靠着那加给我力量的，凡事都能做」（腓立比书 4:13）。听着，我，保罗这个凡人，能借着神人基督做一切事。这就是我使徒职分的所有奥秘。作为一个凡人，我保罗——完全是软弱和无力；而与神人基督主同在，我则完全成为能力和全能（哥林多后书 12:9-11）。神人是人类中唯一真正的创新：在祂里面，人通过人类本性与神性不可分割的结合，而藉着上帝变得全能。神性将其所有的能力和完美传递给人类本性，尽管神性并没有转变为人性的，人性也没有转变为神性的。因此，借着人与神人基督的恩典性属灵结合，人就因上帝以及上帝所拥有的一切而得到丰盛。而神人基督是永恒的上帝，是真上帝，这一点从祂与圣父上帝的全一性中显而易见：尽管祂成了人，主基督仍然与圣父上帝保持着不变的本质性合一，并且祂的一切都「依从」圣父上帝的旨意。而在祂作为神人的作工中，圣父上帝也在不断地作工（约翰福音 5:17）。圣父上帝是最可靠的见证人，见证耶稣是神人——从祂那里来，祂是上帝真正的儿子和上帝。在神人基督里面，圣父上帝「居住」并「作工」（约翰福音 14:10）：祂们共同赐予使徒使徒职分。瞧，我就是「借着耶稣基督和叫祂从死里复活的圣父上帝」的使徒。无论从内容、从本质还是从行动来看，我的使徒职分完全来自主基督和圣父上帝。在这样的使徒职分中，有我的福音，不变且完美：它来自圣父上帝和祂的永恒之子，神人基督。
    - type: paragraph
      text:
        ru: '1:2'
        cn: '1:2'
    - type: paragraph
      text:
        ru: Кроз ово Богочовеково Еванђеље ја сам и познат свима хришћанима који су са мном и око мене. Сви они држе исто Еванђеље и сведоци су моје апостолске делатности и живота. Ни ја ни они нисмо измислили ово Еванђеље, већ је оно по свему и у свему од самога Господа Христа – Богочовека. Зато у њему није допуштена никаква самовоља и самочинство. Ту је све са печатом Богочовештва и богочовечанске саборности. Сви су хришћани сведоци тога. И сви они и животом и смрћу стоје за то Еванђеље, и сведоче црквама Галатиским да је то Еванђеље – једино истинито.
        cn: 通过这神人的福音，我被所有与我在一起和在我周围的基督徒所认识。他们所有人都持守着相同的福音，并且是我使徒性事工和生命的见证人。无论是我还是他们，都没有编造这福音，相反，它在各方面、在一切事上都源于主基督——神人本身。因此，在其中不允许有任何专断和自作主张。在那里，一切都带有神人道性与神人性公教会合一性的印记。所有的基督徒都是它的见证人。而且他们所有人都以生或死来维护那福音，并向加拉太的众教会作证，那福音是——唯一真实的。
    - type: paragraph
      text:
        ru: '1:3'
        cn: '1:3'
    - type: paragraph
      text:
        ru: 'Као што је алостолство од Господа Христа, а преко Њега од Бога Оца, тако је исто и благодат и мир: порекло им је, и сва садржина, од Христа Богочовека и Бога Оца. Шта је благодат? Благодат је збир свих божанских милости, божанских дарова и божанских сила, које је Једини Човекољубац, Богочовек Христос, даровао роду људском, извршивши помоћу њих спасење рода људског од греха, смрти и ђавола, и непрестано вршећи помоћу њих спасење сваког човека посебно у Цркви Својој, све тако до Страшног суда. Сав Богочовечански домострој спасења није друго до «благодат Божја која спасава све људе» (Тит.2:11). Та благодат је по природи својој сва богочовечанска, јер је сва од Богочовека Христа, пошто је Он једини Спаситељ рода људског, и нема другог бића међу свима бићима на земљи, на небу, под земљом, које би могло бити Спаситељ роду људском. Зато што је Богочовек једини Спаситељ људи под небом, једина је и благодат која спасава – благодат богочовечанска. Ако би се све благовести које је Господ Христос донео нашем земаљском свету могле сабрати у једну Свеблаговест, онда је та Свеблаговест – благодат Господа Христа. Зато свети тајновидац и благовесник објављује да је та Свеблаговест, изузетно нова и новозаветна стварност у земаљском свету, пореклом и бићем сва од Господа Христа: «Благодат постаде од Исуса Христа» (Ин.1:17). Са тог разлога се благодат и назива «благодат Исуса Христа» (1Кор.16:23;2Кор.13:13;Гал.6:18;Флп.4:23;1Сол.5:28). Уствари, у тој благодати је сво Еванђеље Богочовеково; и обратно: у Богочовековом Еванђељу је сва благодат. Као што нема благодати ван Богочовека, тако нема Еванђеља ван благодати. Благодат је сва еванђелска, Еванђеље је сво благодатно (ср.Кол.1:5–6). Еванђеље се може имати само благодаћу, и благодат се може имати само Еванђељем. Еванђеље је – «Еванђеље благодати Божје» (Деян.20:24). А и једно и друго, и Еванђеље и благодат, може се имати само јединим истинитим Богом и Господом – Богочовеком Христом (ср.2Тим.1:9–10). Отуда и целокупно хришћанство није друго до благодат Господа Исуса Христа (2Тим.1:9–10). Зато се само кроз Господа Христа прима «благодат на благодат» (Ин.1:16): њој нема мере, сва је бескрајна и безгранична, јер је сам Творац њен, Богочовек Христос, бескрајан и безграничан, пошто је истинити Бог (ср.Еф.2:7, 1:7). Сва сила апостолства је у тој благодати, и сва сила свих светих апостола скупа и сваког посебно (ср.Деян.4:33, 14:26, 15:40;Гал.1:15–16, 2:9). Сва вера хришћанска јесте живљење у благодати и по благодати (ср.Деян.13:43, 18:27, 20:32;1Кор.1:4;2Кор.1:12;Еф.4:7); вером се улази у ову благодат (Рим.5:2); спасење бива «благодаћу Господа Исуса Христа» (Деян.15:11). Благодат је сила, свемоћна сила апостолства, а њу има и даје једино Господ Христос (ср.Рим.1:5, 15:15;1Кор.3:10). Богочовечанска благодат је по свему божанска, и зато у свему јача од свакога греха посебно и од свих грехова укупно. И та «благодат Божја изобилно се изли на многе благодаћу једнога човека Исуса Христа» (Рим.5:15): богочовечанским подвигом спасења Господ Христос изли ту благодат на род људски. У тој благодати је сила која побеђује смрт и све смртно и обезбеђује људима бесмртност и живот вечни кроз Исуса Христа Господа нашег (Рим.5:21). Када свети апостол Павле хоће да објасни себе, своје апостолство, и силу и свемоћ свога апостолства, он изјављује: «По благодати Божјој јесам што јесам» (1Кор.15:10). Служба апостолства је «служба благодати Божје» (Еф.3:2; ср. 3:7–8).'
        cn: 正如使徒职分源自主基督，并借着他源自父神，恩典与平安亦然：它们的源头和全部内容，都来自神人基督和父神。何为恩典？恩典是独一的爱人者——神人基督，赐予人类的所有神圣的怜悯、神圣的恩赐和神圣的能力的集合，他借着它们完成了人类从罪、死亡和魔鬼中得救赎，并持续地借着它们在他自己的教会中完成每个个体人类的救赎，直至末日审判。整个神人的救赎计划无非是「神拯救万人的恩典」（提多书 2:11）。这恩典按其本性而言完全是神人性的，因为它完全来自神人基督，他是人类唯一的救主，在地上、天上、地下所有的受造物中，没有其他受造物能成为人类的救主。因为神人是天下人类唯一的救主，唯一能施行救赎的恩典，便是神人性的恩典。如果主基督带给我们这个尘世的所有福音信息能够汇聚成一个「全福音」，那么这个「全福音」就是主基督的恩典。因此，那位神圣的奥秘洞察者和福音宣讲者宣称，这个「全福音」——作为世上极其崭新和新约的实在——其源头和本质都完全来自主基督：「恩典是从耶稣基督来的」（约翰福音 1:17）。出于这个原因，恩典也被称为「耶稣基督的恩典」（哥林多前书 16:23，哥林多后书 13:13，加拉太书 6:18，腓立比书 4:23，帖撒罗尼迦前书 5:28）。事实上，在这一恩典中，蕴含着神人全部的福音；反之亦然：在神人的福音中，蕴含着全部的恩典。正如离开了神人就没有恩典，同样，离开了恩典就没有福音。恩典是完全福音性的，福音是完全恩典性的（参看歌罗西书 1:5-6）。只有借着恩典才能拥有福音，只有借着福音才能拥有恩典。福音是「神恩典的福音」（使徒行传 20:24）。而福音和恩典这两者，只能通过独一的真神和主——神人基督才能获得（参看提摩太后书 1:9-10）。因此，整个基督教信仰无非是主耶稣基督的恩典（提摩太后书 1:9-10）。因此，唯有借着主基督才能领受「恩上加恩」（约翰福音 1:16）：这恩典是无法衡量的，完全是无限无量的，因为它的创造者——神人基督本身就是无限无量的，因为他是真神（参看以弗所书 2:7，1:7）。使徒职分的一切能力都在这恩典中，所有圣使徒集体和个体的一切能力亦然（参看使徒行传 4:33，14:26，15:40，加拉太书 1:15-16，2:9）。整个基督教信仰就是在恩典中并按恩典而生活（参看使徒行传 13:43，18:27，20:32，哥林多前书 1:4，哥林多后书 1:12，以弗所书 4:7）；借着信心进入这恩典（罗马书 5:2）；救赎是「借着主耶稣基督的恩典」而得以成就的（使徒行传 15:11）。恩典是能力，是使徒职分的全能力量，唯有主基督拥有并赐予这恩典（参看罗马书 1:5，15:15，哥林多前书 3:10）。神人性的恩典在各方面都是神圣的，因此在一切方面都比任何个别的罪和所有罪的总和更强大。而这「神的恩典，因着耶稣基督一人的恩典，就格外加给许多人」（罗马书 5:15）：主基督借着神人性的救赎功绩将这恩典倾注于人类。在这恩典中有一种能力，它战胜死亡和一切属乎死亡的事物，并借着我们的主耶稣基督为人带来不朽和永生（罗马书 5:21）。当圣使徒保罗想要解释他自己、他的使徒职分以及他使徒职分的力量和全能时，他宣称：「我今日成了何等人，是蒙神的恩典才成的」（哥林多前书 15:10）。使徒职分是「神恩惠的职分」（以弗所书 3:2；参看 3:7-8）。
    - type: paragraph
      text:
        ru: 'Желећи галатијским црквама «благодат од Бога Оца и Господа нашег Исуса Христа», свети апостол Павле им у исто време жели и «мир од Бога Оца и Господа нашег Исуса Христа». Какав је то мир? То је мир који настаје када престане рат са Богом и Господом Христом. А људи ратују са Богом, чиме? Гресима. Грех је човеково непријатељство према Богу, и рат са Богом. Но у исто време, грех је непријатељство човека самог према себи самом, и рат са самим собом. Рат који је човеку донео, и увек доноси, смрт, јер «грех сазревши рађа смрт» (Иак.1:15). Тако се непријатељство човеково према Богу изврнуло у човеково самоубиство. Али и грех и смрт имају иза себе творца свог – ђавола: јер је грех пореклом и суштином од ђавола, зато што «ђаво греши од почетка» (1Ин.3:8). Грех је изум и творевина ђавола, а кроз грех и смрт. Отуда свети апостол Павле, желећи Галатима «мир од Бога Оца и Господа нашег Исуса Христа», уствари им жели победу над грехом, смрћу и ђаволом, ослобођење од греха, смрти и ђавола. А ту победу, а то ослобођење даје само Једини Победитељ греха, смрти и ђавола – Господ Христос. И тиме ствара мир човека према Богу: човек живи у миру са Богом кроз побожан и свет еванђелски живот. Сав домострој спасења, извршен Богочовеком Христом, састоји се у тој победи над грехом, смрћу и ђаволом, и у том ослобођењу од тог троструког ропства. Црква Христова у свету, као Богочовечанско тело Христово, и има у себи те вечне божанске силе Богочовекове, и даје их вернима да побеђују у себи сваки грех, сваку смрт, сваког злодуха. Те вечне божанске силе у Цркви јесу: свете тајне и свете врлине. Живећи у њима и по њима, хришћани васпостављају мир најпре између себе и Бога, па онда између самих себе.'
        cn: 圣使徒保罗在祝愿加拉太众教会「从父神和我们的主耶稣基督而来的恩典」的同时，也祝愿他们「从父神和我们的主耶稣基督而来的平安」。这是怎样的平安呢？这是当与神和主基督的战争停止时所产生的平安。那么，人们用什么与神作战呢？用罪。罪是人对神的敌意，也是与神的战争。然而同时，罪也是人对自己自身的敌意，以及与自己的战争。这战争给人带来了，并且总是带来死亡，因为「罪既长成，就生出死来」（雅各书 1:15）。如此，人对神的敌意便转变成了人的自我毁灭。然而，罪和死背后都有其创造者——魔鬼：因为罪的起源和本质都来自魔鬼，因为「魔鬼从起初就犯罪」（约翰一书 3:8）。罪是魔鬼的发明和创造，并通过罪带来了死亡。因此，圣使徒保罗在祝愿加拉太人「从父神和我们的主耶稣基督而来的平安」时，实际上是祝愿他们战胜罪、死亡和魔鬼，脱离罪、死亡和魔鬼的捆绑。而那胜利，那自由，唯有罪、死亡和魔鬼的独一得胜者——主基督——才能赐予。如此，便建立了人与神之间的平安：人通过敬虔和圣洁的福音生活，与神和睦相处。整个由道成肉身的神人基督所成就的救恩工程，就在于战胜罪、死亡和魔鬼，并脱离这三重捆绑。世上的基督教会，作为基督的神人身体，自身拥有神人的那些永恒神圣力量，并将其赐予信徒，使他们能够战胜自身的一切罪、一切死亡、以及一切邪灵。教会中的这些永恒神圣力量是：圣事和圣德。基督徒借着活在其中并遵行它们，首先在自己与神之间，然后也在自己与自己之间，重新建立平安。
    - type: paragraph
      text:
        ru: 'Зато што је Својим богочовечанским подвигом спасења дао роду људском тај прави и једини истински мир који ослобађа човека греха, смрти и ђавола, Господ Христос се и назива «мир наш» (Еф.2:14). Зато се Он с правом назива «Бог мира» (Рим.15:35;Флп.4:9;1Сол.5:22;Евр.13:20), «Господ мира» (2Сол.3:16), а Његово Еванђеље – «Еванђеље мира» (Еф.6:15). У самој ствари, Господ Христос је једини истински миротворац у свима човечанским световима: јер Он крстом Својим помири са Богом све, било на земљи или на небу (Кол.1:19–22). Једино Њиме, вером у Њега, животом по Њему, ми имамо мир с Богом, Свети апостол зато и благовести: «ми имамо мир с Богом кроз Господа Исуса Христа» (Рим.5:1). Тај мир по свему «превазилази сваки ум» људски (Флп.4:7), и с правом се назива «мир Божји» (Кол.3:15). Изузетност и јединственост тога мира наглашава сам Господ када на Тајној Вечери откоива и свету тајну богочовечанског мира, и говори: «Мир вам остављам, мир свој дајем вам: не дајем вам га као што свет даје, да се не плаши срце ваше, и да се не боји» – ни греха, ни смрти, ни ђавола. «Ово вам казах да у мени мир имате» (Ин.14:27, 16:33): јер ван мене и без бене на вас војује грех, који вас сваљује у све смрти, а кроз њих у царство свих злих духова – пакао.'
        cn: 因为祂藉着自己神人两性的救赎功绩，将那使人脱离罪、死亡和魔鬼的、真实而唯一的和平赐予了人类，所以主基督也被称为「我们的和平」（以弗所书 2:14）。因此，祂也被恰当地称为「和平之神」（罗马书 15:35，腓立比书 4:9，帖撒罗尼迦前书 5:22，希伯来书 13:20），「和平之主」（帖撒罗尼迦后书 3:16），而祂的福音则是「和平的福音」（以弗所书 6:15）。实际上，主基督是所有人类世界中唯一真正的和平缔造者：因为祂藉着自己的十字架，使天上地下的一切都与上帝和好（歌罗西书 1:19-22）。唯独藉着祂，藉着对祂的信仰，藉着按祂而活，我们才能与上帝和好。因此，圣使徒也宣扬说：「我们藉着我们的主耶稣基督，与上帝相和」（罗马书 5:1）。这种和平在各方面都「超越人类一切的理解」（腓立比书 4:7），并被恰当地称为「上帝的和平」（歌罗西书 3:15）。主自己强调这种和平的非凡性和独特性，当祂在最后的晚餐上揭示这神人两性和平的神圣奥秘时，祂说：「我把和平留给你们，我把我的和平赐给你们：我所赐的，不像世人所赐的。你们心里不要忧愁，也不要胆怯」——既不怕罪，也不怕死亡，更不怕魔鬼。「我把这些事告诉你们，是要使你们在我里面有和平」（约翰福音 14:27，16:33）：因为在我之外，没有我，罪就向你们宣战，它使你们跌入一切死亡，并藉着它们进入一切邪恶的灵的国度——地狱。
