    - type: paragraph
      text:
        ru: 'Али божанска љубав Христова, то је мучна и тешка наука, која се с муком научи, и уствари увек учи: искуством, животом, праксом учи. Безбројне су врсте самољубља, грехољубивог самољубља, које нас на безброј начина одвлачи, отуђује од божанске љубави Христове, те ми ни у себи ни у ближњима својим не можемо јасно ни да видимо ни да осетимо боголика бића, бесмртна бића. Осим тога, безбројне су самољубиве љубави у свету човечанском, љубави себичне, љубави саможиве, осладострашћене, огреховљене, обезбожене, обезбогочовечене. Свака љубав која не љуби ближњега свог ради онога што је божанско, вечно, боголико, бесмртно у њему, јесте назовиљубав, псевдољубав, лажна љубав. Такве су, у већој или мањој мери, све љубави у свету човечанском сем љубави Христове. Свака љубав која храни у човеку оно што је саможиво, самољубиво, себично, пролазно, смртно, уствари је убилачка љубав. И такозвана најсветија љубав на земљи – материнска љубав, постаје убилачка љубав, ако није заснована на божанској љубави Христовој и прожета њоме. Јер материнска љубав без божанске љубави Христове, шта ради са предметом своје љубави – дететом? Припрема га за плен смрти, и греху, и ђаволу. Да, и ђаволу! Јер љубећи своје дете као своје, а не као боголики дар Божји, као бесмртно створење и чедо Божје, она га уствари осуђује на смрт, и спрема за смрт, и тиме убија. Једино божанска љубав Христова даје и осигурава божанску бесмртност бићу људском, сваком бићу људском. Зато је једино и истинита, једино и бесмртна, једино и вечита. Једини Господ Христос има и даје сваком бићу људском: вечни живот, вечну истину, вечну правду, вечну радост, вечно блаженство, зато Он једини и има право захтевати од људи да више љубе Њега неголи децу своју, неголи родитеље своје, неголи браћу своју, сестре своје, или ма ког другог. Јер сва та бића људска, и као појединци и као заједница, не могу дати човеку вечну истину, вечну правду, вечни живот. То даје само Господ Христос. Зато је љубав према Њему – прва и највећа заповест; а остале љубави према ближњима долазе увек после ње и иза ње, и добијају своје биће и вредност и бесмртност и вечност само од ње и из ње. Отуда је љубав према ближњима увек на другом месту, и сачињава «другу заповест». Зато што је тако, љубав Христова се дуго учи: учи молитвом, учи постом, учи смиреношћу, учи кротошћу, учи трпљењем, и свима осталим врлинама еванђелским: јер се она добија помоћу њих, и одржава помоћу њих, и храни помоћу њих, и живи и бесмртује помоћу њих. Стога хришћани никада нису довољно савршени у љубави својој; јер је њихов узор и идеал сам Господ Христос са Својом божанском љубављу. Прави хришћани се непрекидно усавршавају у тој љубави, расту у све њене бескрајности, и никада не могу рећи себи: савршени смо у љубави. На том путу усавршавања бивају застајања, малаксавања, спотицања, збуњивања, падања и отпадања. И то увек, посредно и непосредно, по дејству злодуха мржње, ђавола. Јер је он у томе уметнички вешт и зао: да хришћане наведе да се кољу и једу међу собом, па чак и да се истребљују.'
        cn: '然而，神圣的基督之爱，这是一门艰难困苦的学问，它需要费力学习，并且实际上总是在学习：通过经验，通过生活，通过实践学习。自爱有无数种，贪恋罪恶的自爱有无数种，它们以无数种方式将我们引开，使我们与神圣的基督之爱疏远，以至于我们无论在自己身上还是在邻人身上，都无法清楚地看见或感受到那神似上帝的存在，那不朽的存在。除此之外，在人类世界中，有无数种自爱的形式：自私的爱，只顾自己的爱，沉溺于肉欲的，被罪玷污的，失去了神性的，失去了神人性的爱。凡是不因邻人身上那神圣的、永恒的、神似上帝的、不朽的特质而爱他的爱，都是所谓「爱」，是伪爱，是虚假的爱。在或大或小的程度上，人类世界中的所有爱，除了基督之爱，都是如此。凡是滋养人心中只顾自己的、自爱的、自私的、短暂的、必死的成分的爱，实际上都是杀戮之爱。甚至地上所谓的最高尚的爱——母爱，如果不是以神圣的基督之爱为基础并被其渗透，也会变成杀戮之爱。因为没有神圣的基督之爱的母爱，会对其爱的对象——孩子——做什么呢？它使孩子成为死亡、罪恶和魔鬼的猎物。是的，甚至是魔鬼的！因为当她将自己的孩子视为「她的」，而不是视为一份神似上帝的、来自上帝的赐予，视为一个不朽的受造物和上帝的孩子时，她实际上是在宣判孩子死刑，预备孩子走向死亡，并以此方式杀害了孩子。


          唯有神圣的基督之爱，才能赐予并保障人类，以及每一个人类，神圣的不朽。因此，唯有它才是真实的，唯有它才是不朽的，唯有它才是永恒的。唯有主基督拥有并赐予每个人类：永恒的生命，永恒的真理，永恒的公义，永恒的喜乐，永恒的福乐；因此，唯有祂有权要求人们爱祂胜过爱自己的孩子，胜过爱自己的父母，胜过爱自己的兄弟姐妹，或胜过爱任何其他人。因为所有这些人，无论是作为个体还是作为群体，都无法赐予人永恒的真理、永恒的公义、永恒的生命。唯有主基督才能赐予这些。因此，对祂的爱是第一条也是最大的诫命；而对邻人的其他爱则总是跟在其后，并且只从它那里获得自己的存在、价值、不朽和永恒。因此，对邻人的爱总是排在第二位，构成了「第二条诫命」。正因为如此，基督之爱需要长时间学习：通过祷告学习，通过禁食学习，通过谦卑学习，通过温柔学习，通过忍耐学习，并通过所有其他福音的德行学习；因为它借助这些德行获得，借助这些德行维持，借助这些德行滋养，并借助这些德行得以存活和不朽。


          因此，基督徒在自己的爱中永远不够完美；因为他们的榜样和理想就是主基督和祂神圣的爱。真正的基督徒不断地在这爱中完善自己，成长进入它所有的无限性中，并且永远不能对自己说：「我们在爱中是完美的。」在这条完善的道路上，会有停滞，会有衰弱，会有跌倒，会有困惑，会有堕落和背离。而这一切，总是直接或间接地，出于那仇恨的邪灵——魔鬼的作为。因为他在这方面狡猾且邪恶：他能引诱基督徒彼此残杀，彼此吞噬，甚至彼此毁灭。'
    - type: paragraph
      text:
        ru: '5:16'
        cn: '5:16'
    - type: paragraph
      text:
        ru: 'Један је спас од тога: ходити Духом Светим, Духом Божјим, Духом Христовим. Ходимо ли Духом Светим, живимо ли Њиме – ми нећемо извршивати жеље телесне. Сви путеви Духа воде кроз истину вечну у живот вечни, кроз правду вечну у живот вечни, кроз љубав вечну у живот вечни; а све телесне жеље свима путевима својим воде у смрт вечну, поробљујући нас гресима, сластима и страстима. Ви сте хришћани Духом Светим: Њега примисте у светом крштењу, Њиме се запечатисте (ср.Еф.1:13), Њиме сте Христови (Рим.8:9–10), зато Њиме ходите, јер који су Христови «не ходе по телу него по Духу» (Рим.8:1). Ми хришћани «не живимо по телу него по Духу» (Рим.8:4).'
        cn: 唯一的拯救之道是：行在圣灵里，行在神的灵里，行在基督的灵里。如果我们行在圣灵里，靠祂而活——我们就不会随从肉体的私欲。圣灵的一切道路，都藉着永恒的真理引向永恒的生命，藉着永恒的公义引向永恒的生命，藉着永恒的爱引向永恒的生命；而所有肉体的私欲，借着其一切途径都引向永恒的死亡，用罪恶、享乐和情欲奴役我们。你们是靠着圣灵成为基督徒的：你们在圣洗礼中领受了祂，你们藉着祂受了印记（参阅 以弗所书 1:13），你们藉着祂属于基督（罗马书 8:9-10），所以你们要行在祂里面，因为凡属基督的人「不随从肉体，只随从圣灵」（罗马书 8:1）。我们基督徒「不凭肉体而活，乃凭圣灵而活」（罗马书 8:4）。
    - type: paragraph
      text:
        ru: '5:17'
        cn: '5:17'
    - type: paragraph
      text:
        ru: '«Јер тело жели против Духа, а Дух против тела: ово се противи једно другоме». – Шта, зар Дух Свети, као Треће Лице Пресвете Тројице, није и сам Творац тела човечијег, да се оно противи Њему? Ако је у човеку само душа од Бога, Духа Светог, тело онда од кога је чим је противно Духу Светом, не од ђавола ли? Но, то је бесмислица. Овде је реч не о телу које сачињава вештаствену страну човечијег бића, него о рђавим помислима, рђавим жељама, рђавим мислима, рђавим осећањима, помоћу којих се служи злу и ђаволу. Јер, шта је противно Духу Светом у човеку? Не тело, које је створено Богом као добро и безгрешно, које је створено «за Господа». То је оно што је несвето, нечисто, грешно, смртно, ђавоље. То је оно што се у човеку противи Духу Светоме, а не тело само по себи, као материјална природа. У ствари, шта је тело? Тело је само орган душе; без душе оно је неактивно: нити осећа, нити мисли, нити дејствује; мртво је. Душа је та која телесним оком гледа и види; душа је та која телесним ухом слуша и чује; душа је та која тело креће и телом дёла, ради, хоће, мисли, осећа. Душа сачињава духовну страну човечијег бића, а тело – материјалну. И једно и друго је од Бога, који их је створио као једну целину, која се назива човек. Само у души је извор човекова живота; тело је оруђе живота. У души је извор и свега богочежњивог у човеку, али и свега грехољубивог. И то у њеној слободи: она бира између добра и зла, између врлине и порока, између Бога и ђавола. Она је та која је најпре кроз Евине очи пристала на грех, заволела забрањени плод, и тек онда употребила руке тела да га откину и уста да га окушају. Такав је уопште пут греха: из душе кроз тело у дело. Тако првог греха људског, тако сваког греха уопште. Хотење, жеља припада души, воља, њена слобода, која се може и корисно употребити и злоупотребити. Зло које душа жели, и јесте оно што се противи Богу и свему Божјем, Духу Светом и свему светом. Зла воља је извор свега противљења човековог Духу Светом, као носиоцу свеколиких добара Божјих. Дух Свети је носилац, давалац и надахнитељ сваке врлине, свега светог, свега божанског, свега доброг; зато је грех, и сваки порок, и свако зло против Духа Светог. У природи је зла да се противи добру, као што је у природи добра да се противи злу. Када хоћете да чините зло, онда против њега устаје оно божанско добро које је у вама; а када хоћете да чините добро, онда против њега устаје зло које је у вашој грехољубивој вољи. Ваше је да бирате: или добро које је од Бога Духа Светог, и зато увек божанско, чаробно, свепобедно; или зло које је од ђавола, и зато увек ружно, гадно и човекоубистевно, и свагда немоћније од Божјег добра. Ако душу своју добровољно потчините Духу Светом кроз свете врлине, постаћете непобедиви, и никакво вам зло неће моћи наудити. А када човек душу своју потчини грехољубљу, онда греси и пороци толико порасту у њему, толико се сложе, сједине, уједине у једну органску целину, да просто образују читаво тело, недељиво и једно; и то тело «жели против Духа», и то тело «противи се» свему што је од Бога Духа Светога. Иза тог тела греха и порока увек се скрива творац греха и порока – ђаво. Разгрните ма који грех и испитајте га до краја, на дну његовог бића увек ћете наћи ђавола као главну стваралачку силу његову. Али исто тако, разгрнете ли ма које добро, увек ћете у срцу његовом пронаћи неку божанску силу као главну стваралачку моћ његову.'
        cn: '「因为肉体与圣灵相争，圣灵也与肉体相争：这两个是彼此对立的。」


          ——什么？难道圣灵作为至圣三位一体的第三位格，不正是人体本身的创造者吗，以至于肉体要与祂为敌？如果人里面只有灵魂是源于上帝、源于圣灵的，那么肉体既然与圣灵对立，岂不就是源于魔鬼的吗？然而，这是荒谬的。这里所说的，并非指构成人类存在之物质一面的肉体，而是指那些邪恶的意念、邪恶的欲望、邪恶的思想、邪恶的情感，人正是借助这些来侍奉邪恶和魔鬼的。因为，人里面与圣灵对立的是什么呢？不是肉体——肉体是上帝所创造的，是良善无罪的，是为着「主」而造的。那是不圣洁的、不洁净的、有罪的、属死的、属魔鬼的。正是这些在人里面与圣灵对立，而不是肉体本身，作为物质性的存在。


          事实上，肉体是什么？肉体只是灵魂的器官；没有灵魂，它就是不活动的：既没有感觉，也没有思想，也没有行动；它是死的。正是灵魂用肉眼观看、看见；正是灵魂用肉耳聆听、听见；正是灵魂驱使肉体，并藉着肉体行动、工作、意愿、思考、感受。灵魂构成人类存在的精神一面，而肉体则构成物质一面。两者都来自上帝，祂将它们创造为一个整体，这个整体被称为人。唯独在灵魂里有人类生命的源泉；肉体是生命的工具。在灵魂里，既有人里面一切渴慕上帝之事的源泉，也有人里面一切喜爱罪恶之事的源泉。这取决于它的自由：它在善与恶之间、在美德与罪恶之间、在上帝与魔鬼之间做出选择。正是它首先藉着夏娃的眼睛同意了罪，爱上了禁果，然后才动用肉体的手去摘取，动用嘴巴去品尝。这便是罪恶的普遍途径：从灵魂出发，藉着肉体，最终化为行动。人类的第一个罪是如此，所有的罪大体上也是如此。意愿、欲望属于灵魂，意志、灵魂的自由，这些既可以被有益地使用，也可以被滥用。灵魂所渴望的邪恶，正是与上帝和一切属于上帝的事物、与圣灵和一切圣洁的事物对立的。邪恶的意志是人对圣灵一切对抗的源泉，圣灵是上帝一切恩赐的承载者。圣灵是每一种美德、一切圣洁、一切神圣、一切良善的承载者、赐予者和启发者；因此，罪恶、每一种恶行和一切邪恶都与圣灵为敌。邪恶的本性就是与良善对立，正如良善的本性就是与邪恶对立。当你想要行恶时，你内在的神圣良善就会起来反对它；而当你想要行善时，你喜爱罪恶的意志中的邪恶就会起来反对它。你的选择是：要么选择源于上帝圣灵的良善，因此它永远是神圣的、奇妙的、无往不胜的；要么选择源于魔鬼的邪恶，因此它永远是丑陋的、可憎的、杀害人类的，并且总是比上帝的良善更为软弱。


          如果你自愿通过圣洁的美德使自己的灵魂顺服圣灵，你就会变得无坚不摧，任何邪恶都无法伤害你。而当人让自己的灵魂顺服于喜爱罪恶时，那么罪恶和恶行在他里面就会增长到如此地步，它们如此结合、融合、统一成一个有机整体，以至于它们简直形成了一个完整的肉体，不可分割且单一的；而这个肉体「与圣灵为敌」，这个肉体「对抗」一切源于上帝圣灵的事物。在这个罪恶和恶行的肉体背后，总是隐藏着罪恶和恶行的创造者——魔鬼。剖析任何一项罪恶，并将其彻底审视，在其存在的深处，你总会发现魔鬼是其主要的创造力。但同样地，如果你剖析任何一种良善，你总会在其核心发现某种神圣的力量，作为其主要的创造之能。'
    - type: paragraph
      text:
        ru: '5:18'
        cn: '5:18'
    - type: paragraph
      text:
        ru: Ако вас Дух Свети води, Он вас уводи у таква божанска тајанства, у такве божанске бескрајности, истине, благовести, у таква божанска богатства, да је према њима сав старозаветни закон сенка, танана и сувишна, па чак и непотребна, пошто је Сунце Правде, Христос, изашло небом нашег човечанског света и живота. Да вас Дух Свети води, ви се не бисте освртали на закон Мојсијев, нити бисте слушали лажне учитеље, који хоће да вам обрезање наметну као закон спасења. Знајте, чим себе вером и смиреношћу и љубављу потпуно потчините Духу Светом и Његовом пресветом Еванђељу, одмах ћете осетити да вам старозаветни Закон, на челу са обрезањем, није потребан за спасење. Вама хришћанима неопходан је за спасење Спаситељ Христос, у коме је све и сва; Њега Дух Свети благодаћу усељује и настањује у срцима вашим; и ви «нисте под законом него под благодаћу» (Рим.6:14); вас води Дух Божји (ср.Рим.8:14, 9:10), јер «ко нема Духа Христова – није Његов» (Рим.8:9), није хришћанин.
        cn: 如果圣灵引导你们，祂就将你们引入那样的神圣奥秘、那样的神圣无限、真理、福音、那样的神圣丰盛，以至于与这些相比，所有旧约律法都只是纤弱、多余，甚至是不必要的影子，因为公义的日头——基督，已经升起在我们人类世界和生命的穹苍。如果圣灵引导你们，你们就不会顾念摩西律法，也不会听从那些假教师，他们想要将割礼作为得救的律法强加给你们。你们要知道，一旦你们藉着信心、谦卑和爱，将自己完全顺服于圣灵和祂至圣的福音，你们就会立刻感觉到，旧约律法，包括割礼在内，对你们的得救而言是不必要的。你们基督徒，为着得救所必需的是救主基督，在祂里面有万有；圣灵藉着恩典，将祂安顿并居住在你们心里；而你们「不在律法之下，乃在恩典之下」（罗马书 6:14）；引导你们的是神的灵（参 罗马书 8:14，9:10），因为「人若没有基督的灵，就不是属基督的」（罗马书 8:9），就不是基督徒。
    - type: paragraph
      text:
        ru: 'Ако вас Дух Свети води благодаћу кроз свете тајне и свете врлине, и у вама живе и делају све божанствене силе, потребне за спасење и живот вечни, онда вам више није потребно руководство старозаветног Закона, који је вршио, и завршио, своју улогу водитеља ка Христу. Живећи светим тајнама и светим врлинама еванђелским, ви испуњујете законе Светога Духа, законе божанскога живота, анђелскога живота, небескога живота, који неизмерно превазилазе све што је у Закону старозаветном. Испуњујући еванђелску заповест о негневљењу, вама није потребно понављати старозаветну заповест: «не убиј!» јер ко се не гневи, у корену онемогућује све оно што би га могло потстаћи и повући ка убиству (ср.Мф.5:21–22). Ко испуњује еванђелску заповест Духа Светог о целомудрију, није потребно упозоравати га на старозаветну заповест: «не чини прељубе!» јер целомудрије је свето и бестрасно расположење душе и срца, од кога је далеко само дело прељубе (ср.Мф.5:27–32). Тако дакле ако вас Дух Свети води, ви ћете бити далеко од телесних жеља, и увек ћете своју христовску слободу употребити за живљење по Духу а не за живљење по телу. Живљење пак по телу, то је творење телесних дела.'
        cn: '如果圣灵借着恩典通过圣事和圣德引导你们，并且在你们里面活出并运行着一切为得救和永生所需的神圣力量，那么你们就不再需要旧约律法的引导了，它已完成并结束了其作为引人归向基督的导师的角色。当你们活出福音的圣事和圣德时，你们就成全了圣灵的律法，神圣生命的律法，天使生命的律法，天上生命的律法，这些律法无限地超越了旧约律法中的一切。


          遵守福音关于不发怒的诫命，你们就不需要重复旧约的诫命：「不可杀人！」因为不发怒的人，从根本上杜绝了一切可能促使他或引诱他去杀人的事（参 马太福音 5:21-22）。凡遵守圣灵关于贞洁的福音诫命的人，就不需要再告诫他旧约的诫命：「不可奸淫！」因为贞洁是灵魂和心灵一种圣洁而无情欲的性情，奸淫的行为本身与此相去甚远（参 马太福音 5:27-32）。


          那么，如果圣灵引导你们，你们就会远离肉体的欲望，并且永远会运用你们基督的自由去按着圣灵生活，而不是按着肉体生活。然而，按着肉体生活，就是行肉体的事。'
    - type: paragraph
      text:
        ru: 5:19–21
        cn: 5:19–21
    - type: paragraph
      text:
        ru: 'А «дела телесна» – τὰ ἔργα τῆς σαρκός (= дела тела) – позната су; то су: прељубочинство, блуд, нечистота, бесрамност, идолопоклонство, чарања, непријатељства, свађе, пакости, срдње, пркоси, распре, подвојености, јереси, зависти, убиства, преједања, и томе слично». А сва та «дела телесна» уствари су дела наше зле, наше грехољубиве, наше грехоцентричне воље, не дела саме природе тела. Зато је и лако ослободити их се; јер ми грешимо зато што хоћемо, а не зато што морамо. Јер кад бисмо грешили зато што морамо, не бисмо били одговорни, и никакав суд нас не би осудио, а најмање Божји. Исто тако, када бисмо творили свете врлине зато што морамо, зато што нам то сама природа намеће као неопходно, онда не бисмо заслуживали никакве награде. Међутим, у нашој је власти: да вољу своју преобразимо благодаћу Светога Духа, благодаћу која је увек неизмерно јача од свакога греха и зла; само је потребно вољу своју вером и љубављу предати благодати Христовој, да је она преобрази и преради из грехољубиве у христољубиву, из злоцентричне у доброцентричну, из рђаве у добру, из несвете у свету.'
        cn: 而「肉体的行为」—— τὰ ἔργα τῆς σαρκός （= 身体的行为）——是众所周知的；它们是：奸淫、淫乱、污秽、放荡、拜偶像、邪术、仇恨、争竞、恶毒、忿怒、争执、结党、分裂、异端、嫉妒、凶杀、醉酒，以及诸如此类的事」。而所有这些「肉体的行为」实际上是我们邪恶的、我们爱罪的、我们以罪为中心的意志的行为，而非身体本性自身的行为。因此，摆脱它们是容易的；因为我们犯罪是因为我们愿意，而非因为我们必须。因为如果我们犯罪是因为我们必须，我们就无需负责，没有任何审判会定我们的罪，更不用说上帝的审判了。同样地，如果我们行圣洁的美德是因为我们必须，因为本性自身将其作为必需强加于我们，那么我们就不会赢得任何奖赏。然而，在我们能力范围之内的是：借着圣灵的恩典，来转变我们的意志，这恩典总是比一切罪恶和邪恶强大得多；只需以信心和爱心将我们的意志交托给基督的恩典，让它转变并重塑我们的意志，从爱罪的变为爱基督的，从以恶为中心的变为以善为中心的，从败坏的变为美好的，从不圣洁的变为圣洁的。
    - type: paragraph
      text:
        ru: 'Сва побројана «дела телесна» повезана су међу собом у једну органску целину самом суштином зла, која је иста у свима њима, јер је сва од самог творца зла – ђавола. Сва та дела силом саме природе своје вуку човека у своје бесмртно царство зла – царство ђавола, пакао. Зато они који чине та дела, неће наследити царства Божјега. Јер сама природа зла и ђавола неће вечна добра и вечна блага царства Божјега: као што ђаво неће Бога, тако ни зло неће добра Божјега.'
        cn: 所有列举的「肉体的行为」都因邪恶本身的本质而彼此联系，形成一个有机整体，这本质在所有这些行为中都是相同的，因为它完全源于邪恶的创造者——魔鬼。所有这些行为都凭着其本性的力量，将人拖入其不朽的邪恶国度——魔鬼的国度，地狱。因此，那些行这些行为的人，将不能承受神的国。因为邪恶和魔鬼本身的本性不愿拥有神的国度中永恒的善和永恒的福分：正如魔鬼不愿有神，邪恶也不愿有神的良善。
    - type: paragraph
      text:
        ru: 5:22–23
        cn: 5:22–23
    - type: paragraph
      text:
        ru: 'Насупрот делима телесним стоје дела духовна. Дела Духа Светога су супротна делима тела. Када се Дух Свети благодаћу светих тајни усели у срца наша, онда Он облагодаћеним духом нашим и вољом нашом рађа родове духовне, оплођује људску природу нашу божанским добром, светошћу, истином. А шта је род Духа, плод Духа? Род Духа је љубав, радост, мир, дуготрпљење, благост, доброта, вера, кротост, уздржање, и све остале свете врлине еванђелске. Да, свете врлине су од Духа Светога који живи у нама кроз свете тајне крштења, причешћа, покајања и др. А Дух Свети живи у нама када Му добровољно предајемо и душу своју и савест и вољу и ум и све своје кроз добровољне подвиге своје: подвиге вере, молитве, поста, кротости, смерности, љубави, трпљења … И када ми испуњујемо себе Духом Светим и благодаћу Његовом, и светим врлинама својим рађамо духовне, бесмртне плодове, нама онда није потребно никакво руководство старозаветног Закона. Рађајући вечне родове Духа, ми показујемо да је Дух Свети животворна и делотворна сила нашега духа, који у Духу Светом има и своју вечну истину, и своју вечну правду, и своју вечну љубав, и свој вечни живот, и своје вечно царство, и све своје вечне вредности и силе. Нашта ће му онда прописи старозаветног Закона? Они му нису потребни ни да по њима живи, ни да по њима буде суђен и цењен.'
        cn: 与肉体的行为相对立的是属灵的行为。圣灵的行为与肉体的行为是相对立的。当圣灵借着圣秘的恩典入住我们的心时，祂就与我们蒙恩的灵和我们的意志一同生出属灵的果实，以神圣的良善、圣洁和真理，使我们的人性丰饶。那么什么是圣灵的果实呢？圣灵的果实是爱、喜乐、平安、忍耐、恩慈、良善、信实、温柔、节制，以及所有其他的福音圣德。是的，圣德来自那借着洗礼、圣餐、忏悔等圣秘活在我们里面的圣灵。而当我们将自己的灵魂、良知、意志、心思以及我们的一切都自愿地奉献给祂时——借着我们自愿的苦修努力：信德的努力、祷告的努力、禁食的努力、温柔的努力、谦卑的努力、爱的努力、忍耐的努力……圣灵就活在我们里面。当我们被圣灵和祂的恩典充满，并借着我们的圣德生出属灵的、不朽的果实时，我们就不再需要旧约律法的任何指引。当我们生出圣灵永恒的果实时，我们便表明圣灵是我们灵的赐生命和有效力的力量，我们的灵在圣灵里拥有其永恒的真理，其永恒的公义，其永恒的爱，其永恒的生命，其永恒的国度，以及其一切永恒的价值和能力。那么旧约律法的规条于它又有何益呢？它既不需要靠它们生活，也不需要靠它们受审判和被评估。
    - type: paragraph
      text:
        ru: 'Дух човеков уопште далеко је од своје пуноће и свога савршенства, и неспособан је да их постигне и оствари, док се не сједини са Духом Божјим, Духом Светим. Тек кад се почне испуњавати Њиме кроз свете тајне и свете врлине, он полази путем свог природног и богоназначеног усавршавања; и иде тим путем постепено, по мери свога труда у светом еванђелском животу, животу «по Духу». Постепено испуњујући себе Духом Светим, дух човечји постепено постиже пуноћу свога бића, јер се богати непропадљивим богатствима Духа Светога. Увек се осећајући сиромашан духом, хришћанин се стално труди кроз свете подвиге да себе обогати Духом Светим, јединим богатим и ваистину свебогатим Духом. У самој ствари, хришћанин стално приноси дух свој на жртву Духу Светом, стално врши саможртвени подвиг кроз свете врлине вере, љубави, поста, молитве, уздржања, кротости, благости, доброте, радости; а Утешитељ Благи узвраћа му то стоструко и хиљадоструко, јер му за те његове несавршене подвиге и врлине даје свете, божанске, вечне врлине: божанску љубав, божанску благост, божанску доброту, божанску радост, божански мир. Јер савршена вера, савршена љубав, савршена молитва, савршени пост, савршена смерност, и свака савршена света врлина јесте дар Духа Светога (ср.1Кор.12:1–13), род, плод Духа Светога. Божански плод и род на земаљској њиви духа човекова.'
        cn: 人的灵普遍远离其丰盛与完全，且无力达到并实现它们，除非与上帝的灵，即圣灵联合。只有当它开始通过圣事和圣美德被祂充满时，它才踏上其本性的和神所命定的完善之路；并循序渐进地走这条路，按其在神圣的福音生活，即「按着圣灵」的生活中的劳苦程度。人的灵逐渐使自己充满圣灵，从而逐渐达到其存在的丰盛，因为它被圣灵不能朽坏的财富所丰富。基督徒时刻感到自己灵里贫乏，因此不断地通过圣善的苦修，努力使自己被圣灵，那唯一富足并真实地全然富足的灵所富足。实际上，基督徒不断将自己的灵献给圣灵为祭，通过信心、爱心、禁食、祷告、节制、温柔、恩慈、良善、喜乐等圣善美德，不断地进行自我牺牲的苦修；而那位良善的保惠师，则百倍千倍地回报他，因为祂将圣洁的、神圣的、永恒的美德，即神圣的仁爱、神圣的恩慈、神圣的良善、神圣的喜乐、神圣的平安，赐予他，以报答他那些不完全的苦修和美德。因为完全的信心、完全的仁爱、完全的祷告、完全的禁食、完全的谦卑，以及每一种完全的圣善美德，都是圣灵的恩赐（参看 哥林多前书 12:1-13），是圣灵的产物，是圣灵的果子。这是在人的灵这片属地的田地里，结出的神圣果子和产物。
    - type: paragraph
      text:
        ru: '5:24'
        cn: '5:24'
    - type: paragraph
      text:
        ru: 'Знајући све то, Христови људи непрестано жртвују себе за дарове Светога Духа, непрестано распињу тело са страстима и жељама. Јер страсти и жеље телесне и јесу у нама зле силе које нас вуку у свако зло, и поробљују нас сваком греху, свакој смрти, сваком ђаволу. Прави хришћанин је стално на крсту, од крштења па кроз цео живот. Јер распиње себе сваком греху и злу, умртвљује себе за грех и зло. Како? Помоћу светих врлина: помоћу вере распиње себе, умртвљујући телесно умовање и борећи се против лажних богова, који хоће да му отму јединог истинитог Бога и Господа – Исуса Христа; помоћу љубави распиње себе и умртвљује за сваку телесну, нечисту жељу и љубав и пристрасност; помоћу молитве распиње себе свему што га прикива за земљу и неда му да се вине у небеске светове, где вечне истине и радости живе; помоћу поста распиње себе и умртвљује за свако сластољубље и земљољубље и телољубље; помоћу смирености распиње и умртвљује себе за сваку гордост, охолост, надувеност; помоћу уздржања распиње, умртвљује ум свој – за рђаве и нечисте помисли, срце своје – за рђаве жеље, вољу своју – за рђава хтења и дела, очи своје – за нечисто и недолично гледање, уши своје – за слушање клевете, лажи, празних разговора, тело своје – за страсти, жудње и уживање у јелу. И тако редом помоћу сваке свете врлине он распиње и умртвљује себе за сваки грех, за свако зло, за сваку страст. Хришћани сте, знате ли кад? Кад сте већ распели, умртвили у себи све страсти и грехољубиве жеље. А пре тога, и без тога, да ли сте Христови? Проверите то овом еванђелском истином: «Који су Христови, распеше тело са страстима и жељама». Мртво је тело твоје, хришћанине; мртва и душа твоја за сваки грех, за свако зло, за сваку смрт, за сваког ђавола. Сав си Христов и духом и телом, ако си Духом Светим испунио и душу и тело помоћу светих тајни и светих врлина. И тада си не само хришћанин, већ савршени хришћанин, достигао «у човека савршена, у меру раста висине Христове» (Еф.4:13).'
        cn: 知道这一切，属基督的人不断地为圣灵的恩赐献上自己，不断地将肉体连同私欲和情欲钉在十字架上。因为肉体的情欲和私欲就是我们里面的邪恶势力，它把我们拖入一切邪恶，并奴役我们归向一切罪恶、一切死亡、一切魔鬼。真正的基督徒常常在十字架上，从受洗直到一生。因为他将自己钉死在一切罪恶之上，使自己向罪恶和邪恶死去。如何做到呢？借着圣洁的德行：借着信心，他将自己钉在十字架上，使肉体的思虑死去，并与假神争战，这些假神想要从他那里夺走独一真神和主——耶稣基督；借着爱，他将自己钉在十字架上并使自己死去，为了一切肉体的、不洁的私欲、爱恋和偏爱；借着祷告，他将自己钉在十字架上，对一切将他紧缚于大地之物死去，使他无法飞升至天上的世界，在那里，永恒的真理和喜乐居住；借着禁食，他将自己钉在十字架上并使自己死去，为了一切贪图享乐、贪爱世俗和贪恋肉体；借着谦卑，他将自己钉在十字架上并使自己死去，为了一切骄傲、傲慢、自大；借着节制，他钉死、治死自己的心智——使其向败坏和不洁的思想死去，自己的心——使其向败坏的欲望死去，自己的意志——使其向败坏的意愿和行为死去，自己的眼睛——使其向不洁和不当的观看死去，自己的耳朵——使其向听取诽谤、谎言、空谈死去，自己的身体——使其向情欲、渴望和贪食的享乐死去。如此，借着每一种圣洁的德行，他将自己钉在十字架上并使自己死去，为了一切罪恶、一切邪恶、一切情欲。你们是基督徒，知道是什么时候吗？是当你们已经将自己里面的一切情欲和贪爱罪恶的私欲钉死、治死的时候。在此之前，以及没有做到这一点的时候，你们是属基督的吗？请用这句福音真理来检验：「凡属基督耶稣的人，是已经把肉体连同肉体的邪情私欲同钉在十字架上了。」你的身体是死的，基督徒啊；你的灵魂也已死去，向着一切罪恶、一切邪恶、一切死亡、一切魔鬼。你在灵里和身体上都全然属基督，如果你借着圣灵充满你的灵魂和身体，借着圣礼和圣洁的德行。那时你不仅是基督徒，更是完全的基督徒，达到了「长大成人，满有基督长成的身量」（以弗所书 4:13）。
