    - type: paragraph
      text:
        ru: 'Све нам то даје вера у Христа, зато нема веће и богатије и моћније и бесмртније силе у нашем човечанском свету. Ако је до наше свесиле, ето је у њој; ако је до наше свемоћи, ето је у њој; ако је до наше свевеличине, ето је у њој; ако је до нашег свебогатства, ето га у њој. Јер шта је веће и моћније и силније и богатије за човека него постати брат Христу и сунаследник, и на тај начин све Његово учинити својим занавек, за сву вечност? А све то ми постајемо вером у Господа Христа, сви ми, и ви из незнабожаца и они из Јевреја: «јер који се год у Христа крстисте, у Христа се обукосте». У јединог истинитог Бога се обукосте, и у јединог истинитог човека. Чујте, у Бога се обукосте! и из вас побеже све што је небожје, ванбожје, противбожје; ишчезе и умртви се и уништи се: и грех, и смрт, и ђаво. Погледајте у себе, шта је остало у вама од вашег старог човека? Ништа! Све старо прође, и ново настаде: нови човек – Христов човек, нова савест – Христова савест, ново срце – Христово срце, нови вид – Христов вид, нови слух, нова воља, нови живот – Христов живот, све ново – божански ново, божански неостариво, божански бесмртно, божански вечно. А пре тога, били сте обучени, у кога? У грех, у смрт, у безбројне пороке и зла, а преко њих у самог – ђавола! Да, у ђавола. Јер је и грех и смрт и свако зло – одећа ђаволова, и душа његова, и вид његов, и слух његов, и воља његова. И ви, живећи у гресима, толико сте се духовно ородили и сродили с ђаволом, да сте се потпуно били обукли у њега и постали деца његова (ср.1Ин.3:10); јер «који твори грех од ђавола је» (1Ин.3:9). А крштење вас ослобођава од свега тога. Но то је прва половина његове свете силе, свете свесиле; а друга је: оно вас облачи у Христа, Бога свемоћног, свепобедног, свемудрог, свемилостивог, свеблагог, свечовекољубивог, свезнајућег, свевечног. И стога: ваша мисао постаде богомисао, ваше осећање богоосећање, ваша душа богодуша, ваша савест богосавест, ваша воља боговоља, ваш живот богоживот. И ви више не живите ни себи ни собом, већ живите Господом Христом и Господу Христу, животу вашем бесмртном и вечном. «Јер ни један од нас не живи себи и ни један не умире себи. Јер ако живимо, Господу живимо; а ако умиремо, Господу умиремо. Ако дакле живимо, ако умиремо, Господњи смо» (Рим.14:7–8); и ми нисмо своји, већ Христови, а Христос Божји (ср.1Кор.6:19, 3:23). Све вечноживе, божанске, небеске стварности што су у Христу Богочовеку, постадоше ваше, људске, и то светом тајном крштења. А за све то, шта сте ви дали? Веру. Вером сте се одрекли Сатане, а присајединили Христу; вером сте се одрекли Сатане и свих дела његових, а приљубили Христу и подвизима Његовим; вером сте одбацили живот у греху, а усвојили живот у Богу; вером сте свукли са себе ђавола, а обукли се у јединог истинитог Бога; вером сте престали бити деца ђавоља (ср.1Ин.3:10), а постали сте деца Божја, синови Божји; вером сте престали бити ђавоносци, а постали сте богоносци.'
        cn: 所有这一切都借由对基督的信仰赐予我们，因此在我们人类世界中，没有比这更大、更富有、更有能力、更不朽的力量了。若论及我们的一切能力，它就在信仰之中；若论及我们的一切权能，它就在信仰之中；若论及我们的一切伟大，它就在信仰之中；若论及我们的一切财富，它就在信仰之中。因为对人而言，有什么比成为基督的弟兄和共同继承人，并借此永远地、世世代代地将祂的一切变为自己的，更大、更有能力、更有权柄、更富有呢？所有这一切，我们都借由对主基督的信仰而成为，我们所有人，无论是你们这些外邦人，还是那些犹太人，因为「你们凡是受洗归入基督的，都是披戴基督了」。你们披戴了独一的真神，也披戴了独一的真人。听着，你们披戴了上帝！一切不属上帝的、与上帝无关的、敌对上帝的，都从你们身上逃走了；消逝了，被置于死地了，被毁灭了：罪、死亡和魔鬼。审视一下你们自己，你们旧人身上还剩下什么呢？什么也没有！一切旧的都过去了，新的都来了：新人——基督的人，新良心——基督的良心，新心——基督的心，新视野——基督的视野，新听觉，新意志，新生命——基督的生命，一切都是新的——神圣的新，神圣的不朽，神圣的永生，神圣的永恒。而在此之前，你们披戴的是谁？是罪，是死亡，是无数的恶习和邪恶，并通过它们，披戴了魔鬼本身！是的，披戴了魔鬼。因为罪、死亡和一切邪恶——都是魔鬼的衣裳，也是它的灵魂，它的视野，它的听觉，它的意志。你们，生活在罪中，与魔鬼在灵性上如此亲近和同源，以至于你们完全披戴了他，并成为了他的儿女（参 约翰一书 3:10）；因为「凡犯罪的是属魔鬼的」（约翰一书 3:9）。而洗礼将你们从所有这一切中解放出来。然而，这是它圣洁力量、圣洁全能的第一部分；而第二部分是：它使你们披戴基督，这位全能的、全然得胜的、全智的、全然怜悯的、全善的、全然爱人的、全知的、全然永恒的上帝。因此：你们的思想成为了神思，你们的感受成为了神感，你们的灵魂成为了神魂，你们的良心成为了神良心，你们的意志成为了神意，你们的生命成为了神生。你们不再是为自己而活，也不再凭自己而活，而是借着主基督而活，并为主基督而活，祂是你们不朽而永恒的生命。「因为我们没有一个人为自己活，也没有一个人为自己死。我们若活着，是为主而活；若死了，是为主而死。所以，我们或活或死，总是主的人。」 （罗马书 14:7-8）；我们不再属乎自己，而是属乎基督的，而基督是属乎上帝的（参 哥林多前书 6:19，3:23）。所有那永恒活泼的、神圣的、属天的真实，凡在基督——神人（Theanthropos）里面的一切，都成为了你们的，成为了人的，这一切都借由神圣的洗礼圣事而成就。而为了所有这一切，你们付出了什么？信仰。借着信仰，你们舍弃了撒旦，而与基督结合；借着信仰，你们舍弃了撒旦和它的一切作为，而亲近基督和祂的善功；借着信仰，你们摒弃了罪中的生活，而拥抱了在上帝里的生活；借着信仰，你们脱去了魔鬼，而披戴了独一的真神；借着信仰，你们不再是魔鬼的儿女（参 约翰一书 3:10），而成为了上帝的儿女，上帝的众子；借着信仰，你们不再是负魔者，而成为了负神者。
