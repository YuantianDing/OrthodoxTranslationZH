    - type: paragraph
      text:
        ru: 'Шта је истина у нашем земаљском свету? Исус Христос распети. Да, распети: јер је крст – врхунац Божјег промишљања о земаљском свету. Крстом је Богочовек Христос сишао кроз смрт у пакао, разорио државу смрти, разоружао ђаволе; крстом је кроз васкрсење отворио небеса роду људском, вазнео се на небо савасрксао са Собом и савазнео природу људску, и тако извршио спасење света. Зато је сва истина Христова у Његовом свеживотворном крсту. Не покоравати се тој истини, тој јединој свеистини у свима световима људскога духа, мисли, осећања, живота, није друго до осудити себе, човека, на вечити бесмисао, на вечито робовање безумљу, неразумљу, ђавоумљу. Јер шта је Разум света, Логос света, Логика света? Једино оваплоћени Бог Логос, Богочовек Исус Христос: зато што је крстом и васкрсењем, погребењем и вазнесењем, животом и учењем, уопште Својим Богочовечанским домостројем спасења, спасао род људски од греха, тог стварно јединог безумља у роду људском и у природи људској, тог јединог лудила и бесмисла и неразума. Јер шта је грех? Грех је мрачна, разорна и страшна демонска сила, којом ђаво сеје смрт по животу људском, и тако га обесмишљује, обезумљује, обезлогосује, одузима му божански, логосни и логични смисао и разумност и логачност и циљност. Што је Божје, грех претвара у бесмислено, у безумно, у глупо, и тако лишава и свет и човека у свету оног божанског смисла, ради кога они једино и постоје, и у коме једино и имају свога смисла и свога оправдања. Греху је једина радост – заводити људе да се не покоравају истини: Христу распетом. Успе ли у томе, грех је успео у свему, и његовој радости нема краја у мрачној бесмртности његова бића. А безбројна су маскирана лукавства, којима грех, а преко њега ђаво, покушава да људе одврати од Христа распета. Кроз сва своја христоборна лукавства грех само једно ради: стрмоглављује људе у понор лажи, у понор смрти, у понор сатанизма, ђаволизма, мефистофелизма. И тако их одваја од једине Истине, од једине Свеистине – Христа Господа распета. О неразумни Галати! ко вас је опчинио да се не покоравате Истини – Господу Исусу распетоме? Та опомените се: проповеђу Његовог Еванђеља међу вама, чудесима именом Његовим пред вама, ми Га насликасмо пред вашим очима, и то распета, насликасмо и у вашим душама; и ви осетисте и увидесте, да је Он заиста Божанска Истина и Смисао и Логос и Логика света – Божанска Свеистина, Божански Свесмисао, Божански Свелогос, Божанска Свелогика. А сада, ко вас то опчини и заведе да се не покоравате Њему? Сигурно, сигурно, сигурно – грех! а преко њега онај свелукови обесмислитељ света, и светова: врховни дух зла и уништења – Сатана. Не варајте се, Сатана грехом мисли, грехом осећа, грехом дела, грехом живи, грехом умује, грехом расуђује, грехом бесмртује, грехом вечнује. Грех је и његова истина, и његова правда, и његова логика, и његова радост, и његова бесмртност, и његов живот, и његово добро, и његово срце, и његова љубав, и његова вечност. А суштина греха, у чему је? У непријатељству према Богу и свему Божјем, у ратовању са Богом и свим Божјим. О неразумни Галати, знајте и срцем и умом, и савешћу и разумом: грех је све оно што одводи од Христа распета. А одводећи од Њега, неминовно уводи у смрт, у пакао, у вечно царство Сатанина зла и његових црних анђела. Спасавајте се од греха хитно, самопрегорно, као од пожара! Чиме? Вером у распетог и васкрслог Господа Христа, Јединог Победитеља греха, а преко греха – смрти, и преко смрти – Сатане и свих ђавола његових.'
        cn: '在我们这尘世中，什么是真理？是被钉十字架的耶稣基督。是的，是被钉十字架的：因为十字架是上帝对尘世眷顾的顶峰。借着十字架，神人基督借着死亡降入阴间，摧毁了死亡的国度，解除了魔鬼的权势；借着十字架，又借着复活向人类敞开了天堂，升入天堂，使人类与祂一同复活，并使人类本性与祂一同升天，从而成就了世界的救赎。因此，基督的一切真理都在祂那赋予万物生命的十字架中。不顺从这真理，这在人类精神、思想、情感、生活的所有世界中唯一的全真理，无异于将自己，将人，定罪归于永恒的虚无，归于永恒地奴役于愚蠢、无理和魔鬼的思维。


          因为什么是世界的理性、世界的逻格斯、世界的逻辑？唯有道成肉身的上帝逻格斯，神人耶稣基督：因为祂借着十字架和复活、埋葬和升天、生命和教导，总而言之，借着祂神人合一的救赎计划，拯救了人类脱离罪，那在人类和人类本性中，真正唯一的愚蠢，那唯一的疯狂、虚无和无理。


          因为罪是什么？罪是一种黑暗、毁灭性和可怕的魔鬼力量，魔鬼借此在人类生命中播撒死亡，从而使它失去意义、变得愚蠢、失去逻格斯，夺去其神圣的、逻格斯的、合乎逻辑的意义，以及理智、合理性和目的性。凡是属神的，罪都将其变为无意义的、愚蠢的、笨拙的，从而剥夺了世界和世上之人那神圣的意义，为此他们才得以存在，并且唯有在其中他们才拥有其意义和其存在的理由。罪唯一的喜悦是引诱人不顺从真理：被钉十字架的基督。如果在这方面成功了，罪就在一切事上都成功了，它的喜悦便永无止境，在它存在的黑暗不朽之中。


          而罪有无数伪装的诡计，罪借着这些诡计，并通过它魔鬼，试图使人偏离被钉十字架的基督。罪借着它所有与基督为敌的诡计，只做一件事：将人投入谎言的深渊、死亡的深渊、撒但主义的深渊、魔鬼主义的深渊、墨菲斯托主义的深渊。从而将他们与唯一的真理，唯一的全真理——被钉十字架的主基督隔绝。


          噢，无知的加拉太人！谁迷惑了你们，以致你们不顺从真理——被钉十字架的主耶稣？你们要回想：借着祂福音在你们中间的宣讲，借着祂名在你们面前的奇迹，我们曾将祂描绘在你们眼前，而且是被钉十字架的，也将祂描绘在你们灵魂中；你们感受并看见了，祂确实是神圣的真理、意义、逻格斯和世界的逻辑——神圣的全真理、神圣的全意义、神圣的全逻格斯、神圣的全逻辑。


          但现在，是谁迷惑和引诱了你们，以致你们不顺从祂？确实，确实，确实是——罪！而借着罪，是那极其狡猾的世界（以及诸世界）的虚无制造者：邪恶与毁灭的最高灵——撒但。不要自欺，撒但以罪思考，以罪感受，以罪行动，以罪活着，以罪理解，以罪判断，以罪不朽，以罪永恒。罪是它的真理，它的公义，它的逻辑，它的喜悦，它的不朽，它的生命，它的善，它的心，它的爱，它的永恒。


          那么，罪的本质是什么？在于对上帝和所有属上帝之物的敌意，在于与上帝和所有属上帝之物的争战。噢，无知的加拉太人，你们要用心、用头脑、用良知和理性去知晓：罪是所有使人偏离被钉十字架的基督的事物。而偏离了祂，就必然会引入死亡、阴间，引入撒但之恶及其黑天使的永恒国度。你们要迅速、自我牺牲地从罪中解救自己，就像从火灾中逃脱一样！靠什么？靠着对被钉十字架并复活的主基督的信心，祂是罪唯一的胜利者，并且借着胜过罪——胜过了死亡，借着胜过死亡——胜过了撒但和它所有的魔鬼。'
