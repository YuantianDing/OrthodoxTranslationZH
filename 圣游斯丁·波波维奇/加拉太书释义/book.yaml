    - type: paragraph
      text:
        ru: 'Зло нашег човечанског света је несравњено и веће и јаче од целокупног рода људског, јер је суштином својом од врховног злодуха – Сатане, и његових мрачних сарадника – палих анђела, ђаволa. А људски греси, сви уопште, својим најунутрашњијим нервом, свагда невидљивим, увек су од ђавола, и њихове страхотне злосиле. Кроз грехе Сатана влада родом људским, а главна му је сила смрт. Смрти не би било да није греха; смрт је змија, а грех је њена жаока, кроз коју она точи у људска бића отров свој; и смртношћу трује природу људску. Због тога су људи беспомоћно робље греха и смрти. Преко људи, земаљски свет је и сам постао роб свакојаког зла. Земљаним телом својим органски везани са земљом и свим што је на њој, људи преносе све своје, и добро и зло на земљу и сва створења што су на њој. Човеково је зло постало зло целе земље, целе природе, целокупне твари: зато «сва твар – πᾶσα ἡ κτίσις», потчињена човековом греху, злу и смрти, «уздише и тугује» растргана овим троглавим чудовиштем, и чезне да се ослободи мука које јој је човек наметнуо (ср.Рим.8:19–22). Нашавши у роду људском безбројне капије отворене, сва зла из сатанског света нагрнула су у земаљски свет и потопила га, зато је свети тајновидац, сагледавши свет у целокупности његовој, са болом објавио страшну вест: «сав свет лежи у злу» (1Ин.5:19).'
        cn: 我们人类世界的邪恶是无可比拟的，它远超并大于全人类，也比全人类更强大，因为其本质源自至高的邪灵——撒但，以及它黑暗的同伙——堕落的天使，魔鬼们。而人类所有的罪，其最内在、始终无形的枢纽，总是源自魔鬼及其可怕的邪恶势力。撒但借着罪孽统治人类，而其主要力量就是死亡。若没有罪，便没有死亡；死亡是一条蛇，罪是它的毒刺，它借此将自己的毒液注入人类，并以致命性毒害人类的本性。因此，人类无助地沦为罪和死亡的奴役。借着人类，尘世本身也成了各种邪恶的奴役。人类以其土质的身体，有机地与大地和地上的一切相连，将他们的一切，无论善恶，都传递给大地和其上的一切受造物。人的邪恶已成为整个大地、整个自然界、整个受造物的邪恶：因此，「一切受造物 – πᾶσα ἡ κτίσις」，都服从于人的罪、恶和死亡，被这三头怪兽撕裂，「一同叹息，一同劳苦」，并渴望摆脱人强加给它的痛苦（参看罗马书 8:19-22）。撒但世界的一切邪恶在人类中找到无数敞开的门户，涌入尘世并将其淹没，因此，圣洁的异象者在全面审视世界后，痛苦地宣告了可怕的消息：「全世界都卧在恶者手下」（约翰一书 5:19）。
    - type: paragraph
      text:
        ru: 'Од тако злог света, у коме је зло неизмерно јаче од сваког бића људског, може спасти само Једини Добар, Једини Безгрешан – Господ Христос, Богочовек. Ради тога Он «даде себе за грехе наше, да нас избави од садашњега света злога»: даде себе Богочовека, ушавши као човек у само срце смрти и греха, и изнутра их разоривши Божанством Својим. Смрћу Својом Господ је ушао у царство смрти, ад, али је блеском Божанства Свог умртвио ад, јер је Његова човечанска душа, са којом је сишао у ад, и у смрти била нераздељиво сједињена преко Његове Ипостаси са Његовим Божанством. Тако је у Њему Богочовеку човек победио смрт и ад, и сва њихова зла, и престао бити роб њихов. Све је то Господ Исус учинио «по вољи Бога и Оца, коме слава у све векове», јер иако је постао човек, Господ Христос је занавек остао Бог, увек једносуштан, једновољан, једноприродан са Богом Оцем. Одневши тако победу над злом света Својом смрћу и васкрсењем, Господ је уистини победио зло света, «зли свет», «свет који у злу лежи», и извео род људски на пут Свога Божанског Добра, и повео га Црквом Својом у Царство Небеско путем Своје Вечне Божанске Истине, Вечне Божанске Правде, Вечне Божанске Љубави, Вечног Божанског Живота, и уводи људе у Небеско Царство помоћу светих тајни и светих врлина. Но у свету, и после Спасове победе над злом, има много добровољних љубитеља и подвижника зла, од којих следбеници Христови имају муке и невоље. Али их побеђују свепобедном силом Господа Христа који је објавио остварену благовест: «У свету ћете имати невољу; али не бојте се, јер ја победих свет» (Ин.16:33).'
        cn: 从这样一个邪恶的世界中，其中邪恶的力量远超任何人类个体，唯有那独一的至善者、独一的无罪者——主基督，即上帝人，才能拯救。为此，祂「为我们的罪舍己，为要救我们脱离这现今的邪恶世界」：祂——上帝人——舍弃了自己，以人的身份进入死亡与罪恶的核心，并从内部以祂的神性摧毁了它们。藉着祂的死亡，主进入了死亡的国度——阴间，但祂以其神性的光芒制服了阴间，因为祂的人性灵魂——祂凭此降入阴间——即使在死亡中，也通过祂的位格与祂的神性不可分割地结合在一起。如此，在祂——上帝人——里面，人类战胜了死亡与阴间，以及它们一切的邪恶，并且不再是它们的奴役。主耶稣这一切都是「照着上帝和父的旨意，愿荣耀归于祂，直到永永远远」，因为主基督虽然成了人，却永远是上帝，永远与圣父上帝同本质、同意志、同本性。祂藉着自己的死亡与复活，从而战胜了世界的邪恶，主确实地战胜了世界的邪恶，「邪恶的世界」，「卧在恶中的世界」，并引领人类走上祂神圣至善的道路，通过祂的教会，借着祂永恒的神圣真理、永恒的神圣公义、永恒的神圣爱和永恒的神圣生命之路，将人类带入天国，并借着圣奥秘和圣美德引导人们进入天国。然而在这个世界上，即使在救主战胜邪恶之后，仍有许多甘心乐意的邪恶爱好者和邪恶的苦修者，基督的追随者因此而遭受痛苦和磨难。但他们以主基督那全胜的力量战胜了这些，主基督已经宣告了实现的好消息：「在世上你们有苦难；但你们可以放心，我已经胜了世界」（约翰福音 16:33）。
