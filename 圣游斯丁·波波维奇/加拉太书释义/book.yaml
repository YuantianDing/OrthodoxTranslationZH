    - type: paragraph
      text:
        ru: 'Откако је Господ Христос извршио Свој богочовечански домострој спасења, знате ли, о неразумни Галати, шта је главни посао Сатане и анђела његових? – Одвраћати људе од вере у Христа распета. Зашто? Зато што распети Господ вером дарује човеку, сваком човеку, све Своје божанске силе, помоћу којих човек побеђује сваки грех, сваку смрт, сваког ђавола. Имаш ли веру у распетог Господа, ти све имаш, све што је потребно људском бићу за свети, божански живот у свима световима и у свима вечностима, почевши од нашег земаљског света и од наше земаљске вечности. Да, од наше земаљске вечности, јер време нам је дато на земљи да њиме стекнемо живот вечни. И од нашег живота у времену и простору на земљи, зависи сва наша вечност на небу. Реците, зар време није важно као и вечност, пошто је оно увод у вечност? Наш је позив: да време живота свога на земљи претворимо у вечност кроз – богочовечност. А то можемо учинити само вером у Богочовека Христа, јединог истинитог Бога и Господа. Та богочовечанска вера, шта нам даје? Сва богатства неба и све божанске дарове и силе. И то даје? Духом Светим, који ради човекољубивог крсног подвига Христовог сиђе у свет, и занавек остаде на земљи као душа у Богочовечанском телу Христовом – Цркви. И ви познасте Духа Светога, и примисте Га кроз веру у Господа Исуса. А вери се научисте чувши је од нас, од наше проповеди Еванђеља. Примисте Духом Светим који је «Дух истине» (Ин.15:26, 16:13), Дух вечне Истине – Христа Господа, да вас Он утврди у тој вечној Истини, у тој Свеистини, да Њиме живите, и тако спасавате себе од сваке лажи, од сваке духовне смрти, од сваког греха.'
        cn: 思量一下：在主基督完成了祂的神人救赎计划之后，你们这些无知的加拉太人，可知撒但及其使者的主要工作是什么？——是引诱人背离对被钉十字架的基督的信仰。为什么？因为被钉十字架的主藉着信仰将祂所有的神圣力量赐予人类，赐予每一个人，借此力量人能战胜一切罪恶，一切死亡，以及每一个魔鬼。你若对被钉十字架的主有信心，你便拥有一切，拥有一切人类生命体在所有世界和所有永恒之中，从我们尘世和我们尘世的永恒开始，过上神圣、属神生活所需的一切。是的，从我们尘世的永恒开始，因为时间赐予我们在地上，是为了借此获得永生。我们的永恒在天上，都取决于我们地上在时间和空间里的生命。请问，既然时间是通向永恒的序幕，难道时间不像永恒一样重要吗？我们的召唤是：藉着神人二性，将我们在地上的生命时间转化为永恒。而我们唯有藉着对神人基督——独一的真神和主——的信仰，才能做到这一点。这神人的信仰能给我们什么？天上的所有丰盛和所有神圣的恩赐与力量。又是谁赐予这些呢？是圣灵，祂因着基督为爱人而受难的十字架功绩降临世间，并永远留在地上，作为神人基督之身体——教会——中的灵魂。你们也认识了圣灵，并藉着对主耶稣的信仰接受了祂。你们听了我们对福音的宣讲，从而学会了信仰。你们藉着圣灵接受了祂，这圣灵是「真理的灵」（约翰福音 15:26，16:13），是永恒真理——主基督——的灵，为要使祂将你们坚固在那永恒的真理中，在那全然的真理中，使你们藉着祂而活，从而将自己从一切谎言、一切属灵的死亡、一切罪恶中拯救出来。
    - type: paragraph
      text:
        ru: 'Ово једно хоћу од вас да знам: да ли примисте Господа Христа и Светог Духа Његовог са свима божанским даровима, кроз дела старозаветног Закона или кроз веру коју усвојисте чувши је од мене, апостола Христова? Несумњиво кроз веру. И та ввра постаде слух душе ваше, савести ваше, којим чујете заповести Христове, и стално слушате Његову вечну истину и вечне дарове, и примате их у срце, у савест, и живите по њима и од њих. Упоредите оно што људима даје старозаветни Закон са оним што даје вера Христова, па ћете одмах осетити сву судбоносну разлику између њих, и увидети да вам једино вера Христова Духом Светим дарује све божанске силе и небеске дарове. Но да ли сте то осетили, то увидели? Ако нисте, постарајте се хитно да вера Христова постане вид и слух ваше душе, вашег срца, ваше савести, вашег разума, па ћете сагледати сву ову спасоносну истину. Неко опасно искушење проходи ваше душе, нека страшна саблазан и сеје по вама потајно семе безумља, неразумља. Сагледајте себе са свих страна и по свима безданима вашег бића, шта је у вама, шта је са вама, где сте?'
        cn: 我只想从你们知道一件事：你们是借着旧约律法的行为，还是借着从我，基督的使徒，所听而领受的信，领受了主基督和祂的圣灵，以及祂所有神圣的恩赐？无疑是借着信。这信就成了你们灵魂的听觉，你们良心的听觉，借此你们听见基督的诫命，并持续聆听祂永恒的真理和永恒的恩赐，将它们领受于心，领受于良知，并靠它们而活，因它们而生。你们将旧约律法所赐予人的，与基督的信所赐予人的，进行比较，你们就会立刻感受到它们之间所有宿命性的差异，并明白唯有基督的信借着圣灵，将所有神圣的力量和天上的恩赐赐予你们。然而，你们感受到了吗？你们明白了这些吗？如果没有，请即刻努力，让基督的信成为你们灵魂的视觉和听觉，你们之心的视觉和听觉，你们良心的视觉和听觉，你们理智的视觉和听觉，这样你们就能看清这一切救赎性的真理。某种危险的诱惑正在穿越你们的灵魂，某种可怕的绊脚石，在你们里面秘密播撒着愚昧、无知的种子。从各个方面，从你们存在的每个深渊，审视你们自己，你们里面有什么？你们发生了什么？你们身在何处？
    - type: paragraph
      text:
        ru: '3:3'
        cn: '3:3'
    - type: paragraph
      text:
        ru: 'Тако ли сте неразумни? Почевши Духом Светим кога од Христа примисте крштењем и осталим светим тајнама и светим врлинама, ви сад прелазите на телесне ствари и хоћете да телом завршите! Тело? – Та тело не помаже ништа (Ин.6:63), а ни дух људски не помаже ништа, без Духа Светога, без Духа Христовога. Сваки дух људски, и анђелски, свака душа људска Свјатим Духом живитсја, оживотворава се, оживљује, и живи, а камоли тело! Духом Светим точе се благодатне струје које напајају сваку твар ка оживљењу. Духом Светим се добија све што је Христово: и Вечна Истина, и Вечна Правда, и Вечна Љубав, и Вечни Живот, и Вечна Радост, и Вечно Блаженство, и Вечно Царство Пресвете Тројице. Све се од Христа Њиме и кроз Њега даје хришћанима. Све божанске силе, сви божански дарови дају се једино Духом Светим (ср.1Кор.12:3–4). У Цркви «све чини» – πάντα ἐνεργεἰ Дух Свети, кроз све свете тајне, кроз све свете врлине, кроз сва света чудеса (ср.1Кор.12:11). Он благодаћу Својом извршује спасење у нашим душама, испуњујући наше васцело биће Спаситељем; и Спаситељ, који је Духом Светим у нама, спасава нас од свакога греха, од сваке смрти, од сваког ђавола. Духом Светим бива и наше очишћење, и наше освећење, и наше охристовљење, и наше обожење, и наше отројичење: све и сва што нас приводи Христу, што нам даје Христа, што држи у нама Христа, што нас чини Христовима и у овом свету и на сву вечност. Зато је за нас хришћане најважније: Духом Светим се непрекидно испуњавати помоћу светих тајни и светих врлина, јер се само тако може бити Христов и у овом и у оном животу. А ви, почевши Духом, сад телом завршујете.'
        cn: 你们竟如此愚拙吗？你们从基督领受了圣灵，藉着洗礼和其他圣奥秘以及圣洁的德行而开始，如今却转而追求肉体之事，竟想以肉体来完结！肉体？那肉体毫无益处（约翰福音 6:63），而人的灵若无圣灵，若无基督的灵，也毫无益处。每一个人的灵，乃至天使的灵，每一个人的灵魂，都藉着圣灵而活化、被赋予生命、蒙受滋养，并得以存活，更何况是肉体呢！藉着圣灵，涌流出恩典之流，滋养着一切受造之物，使其达至生命更新。藉着圣灵，便可获得一切属于基督的事物：永恒的真理，永恒的公义，永恒的爱，永恒的生命，永恒的喜乐，永恒的福乐，以及至圣三一的永恒国度。一切皆由基督藉着圣灵并透过圣灵赐予基督徒。一切神圣的能力，一切神圣的恩赐，唯独藉着圣灵才能赐予（哥林多前书 12:3-4）。在教会中，「万事运作」（πάντα ἐνεργεἰ）都由圣灵所为，藉着一切圣奥秘、藉着一切圣洁的德行、藉着一切圣洁的神迹（哥林多前书 12:11）。祂藉着自己的恩典，在我们的灵魂中成就救赎，以救主充满我们整个的生命；而救主，祂藉着圣灵住在我们里面，救我们脱离一切罪恶，脱离一切死亡，脱离一切魔鬼。藉着圣灵，我们的洁净、我们的圣化、我们的基督化、我们的神化、我们的三一化，这一切得以成就：一切的一切，使我们归向基督，赐予我们基督，使基督常驻我们里面，使我们成为基督的，在今世乃至永恒之中。因此，对于我们基督徒而言，最重要的是：藉着圣奥秘和圣洁的德行，持续不断地充满圣灵，因为唯有如此，无论是在今生还是来世，才能属于基督。可是你们，既已靠圣灵开始，如今却以肉体来完结。
    - type: paragraph
      text:
        ru: '3:4'
        cn: '3:4'
    - type: paragraph
      text:
        ru: За веру у Христа ви примисте Духа Светога, да бисте Њиме из духа свог, из душе своје, из срца свог, потиснули све старе мисли, сва стара схватања, све старе навике, све старе обичаје, све старе богове. И ви сте то постигли силном борбом и великим страдањем, јер вас је морало веома болети – одвајати се од старих светова својих, рушити их, спаљивати их, у гробље их претварати, и посахрањивати све своје некада миле богове, сласти и страсти. Борба са сваким грехом је мука и страдање, са сваком страшћу, а камоли са сваком духовном смрћу, и са сваким духом зла у сваком идолу. Много је тешких борби у људском животу на земљи, али је најтежа и најкрвавија и најсудбоноснија борба човека са самим собом при мењању богова. У свакој од тих борби ви силно пострадасте. Зар узалуд толико пострадасте? А биће узалуд, ако се сада вратите на старе богове, на старе грехе, на старе смрти, и поново себе сахраните у гробове, из којих вам више неће бити васкрсења.
        cn: 为了对基督的信仰，你们领受了圣灵，好让你们藉着祂，从你们的灵、你们的魂、你们的心中，驱逐出一切旧思想、一切旧观念、一切旧习惯、一切旧风俗、一切旧神灵。而你们做到了这一点，是藉着激烈的争战和巨大的苦难，因为这必然使你们极其痛苦——与你们的旧世界分离，将其摧毁、焚烧、化为坟墓，并埋葬所有你们曾经钟爱的神灵、享乐和情欲。与每一个罪的争战，与每一个情欲的争战，都是痛苦和苦难，更何况是与每一种属灵的死亡，以及在每一个偶像中的每一个邪恶的灵的争战呢。人生在世，有许多艰难的争战，但最艰难、最血腥、最关乎命运的，是人更换神灵时与自身的争战。在每一次这样的争战中，你们都蒙受了巨大的苦难。难道你们受了这么多苦难是徒然的吗？而这将是徒然的，如果你们现在回到旧神灵、旧罪恶、旧死亡中去，并再次将自己埋葬在坟墓里，从这些坟墓中，你们将不再有复活。
    - type: paragraph
      text:
        ru: 'Вера у Христа, ви сте увидели, то је непрекидно страдање за Христа, јер је то непрекидна борба за живот вечни, борба до смрти, до крвавог зноја са сваким грехом, са сваком страшћу, са сваким духом зла испод неба који хоће да вам украде живот вечни, дарован ван Христом и Духом Светим. Да бисте се могли одржати у тој борби, и однети победу, ви сте наоружани свеоружјем Божјим: светим тајнама и светим врлинама. Али у свима тим окршајима, хрвањима, гушањима са гресима, са страстима, са сластима, са демонима, са смртима, мора се много страдати, много удараца задобијати, много рана и модрица. И у тим борбама ви много страдасте. Зар узалуд толико пострадасте? А биће узалуд, ако сада одбаците свепобедно оружје Божје, а латите се старозаветних жбанова и обрезања. О, онда сте битку за живот вечни изгубили! онда сте се безумно предали у ропство, коме? Смрти, духовној смрти, и то не једној, већ хиљадама смрти, свих врста смрти. А преко њих, предали сте се лудо у ропство – Сатани и мраконосних анђела његових. Прените се! у шта падате? у какве поноре? Живот вечни ћете изгубити, Христа Исуса, јединог истинитог Бога и Господа ћете изгубити, а са њим – Вечну Истину, Вечну Правду, Вечну Љубав, Вечну Радост, Вечно Блаженство. И онда ваша страдања не само да су била узалуд, него су вам на страшан пораз ваш, на духовну осуду вашу, на погибију душе ваше, на вечну смрт вашу и на вечни пакао ваш.'
        cn: 你们已经看清，在基督里的信仰，那是为基督持续的苦难，因为那是为永生持续不断的争战，一场至死方休、汗流如血的争战，与每一个罪、每一个情欲、以及天下一切企图窃取你们由基督和圣灵所赐的永生的邪灵的争战。为了能在那场争战中坚守并赢得胜利，你们蒙受神的全副军装，以圣奥秘和圣美德武装自己。然而在所有这些与罪、情欲、逸乐、邪魔、死亡的冲突、摔跤、搏斗中，人必须承受许多苦难，遭受许多打击，遍体鳞伤。而在那些争战中，你们也承受了许多苦难。难道你们承受了如此多的苦难都是徒劳的吗？而若你们现在抛弃神那战无不胜的武器，却去抓取旧约的坛罐和割礼，那便真是徒劳了。哦，那么你们就失去了为永生而战的这场战斗！那么你们就愚蠢地将自己交入了奴役之中，交给了谁呢？交给了死亡，属灵的死亡，而且不是一种死亡，而是千百种死亡，各种各样的死亡。并且通过它们，你们疯狂地将自己交入了奴役之中——交给了撒旦和它那些带来黑暗的使者。清醒过来！你们正在坠入什么？坠入怎样的深渊？你们将失去永生，将失去基督耶稣，那独一的真神和主，而与祂一同失去的——还有永恒的真理、永恒的公义、永恒的爱、永恒的喜乐、永恒的福祉。那么你们的苦难不仅会是徒劳的，反而会导致你们可怕的失败，导致你们属灵的定罪，导致你们灵魂的毁灭，导致你们的永死和永恒的地狱。
    - type: paragraph
      text:
        ru: '3:5'
        cn: '3:5'
    - type: paragraph
      text:
        ru: 'Станите! отворите све очи душе своје и погледајте себе од врха до дна, и око себе десно и лево; међу вама чудесни Господ Христос непрекидно и сада чини чудеса Духом Светим. Колико се њих чудесно исцељују молитвама! колико њих верни васкрсавају из многих духовних гробова, из безбројних смрти! колико је међу вама душа васкрслих из мртвих! колико и дандањи савести васкрсава из мртвих међу вама! А сетите се шта бејасте, и какви бејасте, пре но што веру Христову примисте и Духа Светога добисте! Мртвац до мртваца, леш до леша, гроб до гроба. А Дух Свети отвори наше гробове, васкрсну ваше мртваце, оживе ваше лешеве, и непрестано чудодејствује међу вама и у вама, водећи вас из врлине у врлину, и проводећи душе ваше из радости у радост ка Царству Небеском. Но ко вам даде Духа Светога? Господ Христос. Зашто? За веру у Њега, у Његово Еванђеље, које чусте од мене. Не добисте ви Духа Светога за дела јеврејског обредног закона, већ једино и само за веру у Христа. Загледајте добро у природу и силу те вере. Шта она чини у вама? Непрекидно чудо, непрекидно чудотвори: јер вам непрекидно и душу и савест и срце и вољу и разум испуњује оним што је божанско, бесмртно, вечно, богочовечно, преображавајући вас и прерађујући вас у бића вечна, у бића богочовечна, у бића праведна.'
        cn: '兴起！打开你们灵魂所有的眼睛，从上到下审视自己，并环顾左右；在你们中间，奇妙的主基督如今正藉着圣灵持续不断地施行神迹。有多少人藉着祷告奇妙地得医治！有多少忠信之人从许多属灵的坟墓中、从无数的死亡中复活！在你们中间有多少从死里复活的灵魂！在你们中间，直到今日又有多少良心从死里复活！


          你们要记住你们曾是什么，你们曾是怎样的人，在你们接受基督的信仰并领受圣灵之前！死人连着死人，尸体连着尸体，坟墓连着坟墓。但圣灵打开了我们的坟墓，使你们的死人复活，使你们的尸体活过来，并在你们中间和你们里面持续不断地施行神迹，引导你们从美德到美德，并引领你们的灵魂从喜乐到喜乐，趋向天国。


          但谁赐给你们圣灵呢？是主基督。为何？因为信祂，信祂的福音，就是你们从我这里所听见的。你们领受圣灵不是因为犹太教仪礼律法的行为，而是单单因为信基督。仔细审视那种信仰的本质和力量。它在你们里面做些什么呢？它持续不断地是奇迹，也持续不断地施行奇迹：因为它持续不断地用那神圣的、不朽的、永恒的、神人性的事物充满你们的灵魂、良心、内心、意志和理性，将你们转化并重新塑造成为永恒的生命、神人性的生命、公义的生命。'
    - type: paragraph
      text:
        ru: '3:6'
        cn: '3:6'
    - type: paragraph
      text:
        ru: 'Вера у Христа увек чини чудо са човеком, и побуђује човека да и сам радосно учествује у том чуду над собом, учествује свом душом и свим срцем. Духовно сједињујући човека са Христом, вера разлива по бићу његовом све божанствене силе Христове, и Његову Правду и Љубав и Истину, и човек постепено преображава себе у биће праведно, и тиме оправдано пред Богом: јер једино као праведно биће, које је победило грех и смрт и лаж и ђавола, и спасло се њих, човек постаје оправдан пред Богом, и његов живот добија беспрекорно оправдање пред Богом. Спасење, праведност, оправдање постиже се само Христом, само вером у Христа који је имао доћи, као што ви и ми постижемо то исто вером у Христа који је већ дошао. «Верова Авраам Богу, и прими му се у правду» (Быт.15:6;Рим.4:3). Верова Авраам у спасење оваплоћеним Богом Христом, верова тако силно и јако, да је том вером и сагледао дане богочовечанског подвига Христовог на земљи, због чега и сам Господ Христос вели за њега: Авраам је био рад да види дан мој, и виде, и обрадова се (Ин.8:56).'
        cn: 信靠基督总是对人施行奇迹，并激励人亲自喜乐地参与在自己身上的这奇迹中，全心全意地参与。借着使人与基督在灵里联合，信仰将基督所有的神圣力量，以及祂的公义、仁爱和真理，倾注在他生命本质中，人便逐渐将自己转变成为公义的生命体，并因此在神面前得蒙称义：因为唯有作为公义的生命体，一个战胜了罪、死亡、谎言和魔鬼，并从中得救的生命体，人才能在神面前得蒙称义，他的生命才能在神面前获得无可指摘的称义。救赎、公义、称义唯独借着基督才能达成，唯独借着信靠那将要降临的基督才能达成，正如你们和我们借着信靠那位已经降临的基督而达成这同样的事一样。「亚伯拉罕信神，这就算为他的义」（创世记 15:6，罗马书 4:3）。亚伯拉罕相信借着道成肉身的神基督而来的救赎，他如此强烈而坚固地相信，以至于他借着这信心也预见了基督在地上神人二性一体的功绩的日子，因此主基督亲自论及他说道：「亚伯拉罕欢喜地盼望看到我的日子；他看到了，就甚喜乐」（约翰福音 8:56）。
    - type: paragraph
      text:
        ru: '3:7'
        cn: '3:7'
    - type: paragraph
      text:
        ru: Та вера је оно што Авраама чини великим пред Богом; суштина његове вере је иста са нашом; та вера усињује Богу; она је усинила Авраама; и они који су од те вере синови су Авраамови, духовни синови Авраамови. И то су прави синови Авраамови, а не они што су по телу деца Авраамова. Тако познајте и ви да су синови Авраамови они који су од вере, а не од закона старозаветног.
        cn: 这信心是让亚伯拉罕在上帝面前伟大的；他信心的实质与我们的相同；这信心使人成为上帝的儿女；它使亚伯拉罕成为上帝的儿女；凡有这信心的，都是亚伯拉罕的儿子，是亚伯拉罕属灵的儿子。这才是亚伯拉罕真正的儿子，而不是那些按肉身而言是亚伯拉罕儿女的人。因此你们也当明白，亚伯拉罕的儿子是那些凭信心的人，而不是凭旧约律法的人。
    - type: paragraph
      text:
        ru: '3:8'
        cn: '3:8'
    - type: paragraph
      text:
        ru: 'Да је тако, потврђује и сам Мојсије, и сам Закон: јер је Бог још онда објавио Аврааму да ће се у тој и таквој вери његовој у Месију – Христа, благословити сви народи (= τὰ ἔθνη) на земљи, а не само изабрани народ, Јевреји. А ту ееру Авраам је показао пре него што је Закон био дат Богом преко Мојсија. Та вера је обавезна за спасење сваког људског бића уопште. И као што је она била обавезна за спасење Аврааму, тако је обавезна и за вас, хришћане из незнабожаца, а не закон о обрезању, и остало што улази у тај закон. Том вером Авраам постаде благослов за све народе; ради те вере његове Бог га и благослови тим свеобухватним благословом спасења. И Бог, који је у свом премудром божанском плану спасења рода људског унапред био одредио да ће се и Јевреји и незнабошци спасти вером у оваплоћеног Месију, објави Аврааму: «У теби ће се благословити сви народи» (ср.Быт.12:3, 18:18, 22:18, 26:4). А благослов, у чему је? У спасењу од греха, смрти и ђавола. А то спасење је једино у Спаситељу Христу. Јер је грех – проклетство рода људског, а преко њега смрт и ђаво. Вера у Спаситеља Христа даје спасење, и кроза њ благослов. Она га је дала Аврааму, она га даје свима који је имају.'
        cn: 摩西本人和律法本身都证实了这一点：因为神在那时就向亚伯拉罕宣告，凡在他对弥赛亚——基督的这种和如此的信心之中，地上所有的民族（= τὰ ἔθνη）都将蒙受祝福，而不仅仅是选民，即犹太人。而亚伯拉罕是在律法由神借着摩西赐下之前，就显明了这种信心。这种信心对于任何人类的普遍救赎都是不可或缺的。并且，它既然对于亚伯拉罕的救赎是不可或缺的，那么对于你们这些从外邦人中出来的基督徒也是不可或缺的，而不是割礼的律法，以及其他属于该律法的一切。借着这种信心，亚伯拉罕成了所有民族的祝福；为了他的这种信心，神也赐给他那普世的救赎祝福。而神，在他拯救人类的至智神圣计划中早已预定犹太人和外邦人都将通过对道成肉身的弥赛亚的信心而得救，就向亚伯拉罕宣告说：「万国都必因你得福。」(参 创世记 12:3，18:18，22:18，26:4)。那么祝福在于什么呢？在于从罪、死亡和魔鬼中得救。而这救赎唯独在救主基督里。因为罪是人类的咒诅，并且借着它而来的是死亡和魔鬼。对救主基督的信心赐予救赎，并借着这信心赐予祝福。这信心曾赐予亚伯拉罕，它也赐予所有拥有它的人。
    - type: paragraph
      text:
        ru: '3:9'
        cn: '3:9'
    - type: paragraph
      text:
        ru: 'Тако се они, из свих народа, који су од те вере, рођени духовно од ње, благосиљају са верним Авраамом, са Авраамом, родитељем те вере у Месију – Христа, а не са њим као са телесним праоцем. Из сваког народа спасавају се они који верују у Христа као што је Авраам веровао: заједничари исте вере – заједничари су истог спасења, истог оправдања, истог благослова.'
        cn: 因此，凡从万民中，属于那信心，并从那信心被属灵地生出的人，都与忠信的亚伯拉罕同蒙祝福；与亚伯拉罕，这位弥赛亚——基督信仰之父同蒙祝福，而不是将他视为肉身的先祖。凡从各民族中，像亚伯拉罕那样信基督的，便蒙拯救；他们既是同一信心的参与者，也是同一救恩、同一称义、同一祝福的参与者。
    - type: paragraph
      text:
        ru: '3:10'
        cn: '3:10'
    - type: paragraph
      text:
        ru: 'Који се год уздају у дела Закона Мојсијева, под клетвом су. Зашто? Зар је Закон рђав? зар је он проклетство? Не, Закон је од Бога: «закон је свет и заповест света и праведна и добра» (Рим.7:12); и такав Закон не чини човека проклетим, него показује човеку да није у стању испунити све његове прописе зато што је грешник, показује да су сви људи под грехом, а на греху је проклетство Божје (ср.Рим.3:10–19, 5:20). Светлошћу својом Закон осветљује људе и обелодањује им њихову грешност, и показује им да су неспособни да се сами ослободе од греха (ср.Рим.7:7–13). Зато што је свет, Закон том светошћу својом баца светлост на грех, раскрива природу греха и показује како је грех страховит и ужасан и проклет, како је грех «одвише грешан» – καθ’ ὑπερβολὴν ἁμαρτωλὸς (Рим.7:13–14). Пошто су сви људи грешници, пошто су «сви под грехом» (Рим.3:9), и нема ни једнога који би испунио све што је написано у Закону, зато је на свима проклетство. Тога ради је и речено у Закону: «проклет сваки који не остане у свему што је написано у књизи Закона да то чини» (Втор.27:26; ср.Иер.11:3). И хришћани који желе повратак на Закон Мојсијев, самим тим желе да се врате под проклетство, које тај Закон изриче на свакога који није у стању да испуни све прописе његове. А живот и искуство показују да то нико није у стању да испуни.'
        cn: 凡信赖摩西律法之行为的，都在咒诅之下。为何？难道律法是败坏的吗？难道它本身是咒诅吗？不，律法是源于神的：「律法是圣洁的，诫命也是圣洁、公义、良善的。」（罗马书 7:12）这样的律法并不使人受咒诅，而是向人显明，因着罪人的本性，人无法遵行其所有规定；它显明所有人都伏在罪下，而罪上带有神的咒诅（参罗马书 3:10-19，5:20）。律法以其光照亮众人，向他们揭示他们的罪性，并显明他们无力自救脱离罪恶（参罗马书 7:7-13）。因为律法是圣洁的，它以其圣洁之光照亮罪，揭示罪的本相，并显明罪是何等可怖、可憎、受咒诅，罪是何等「恶极了的罪」——καθ』 ὑπερβολὴν ἁμαρτωλὸς（罗马书 7:13-14）。既然所有人都是罪人，既然「众人都伏在罪下」（罗马书 3:9），又没有一个人能遵行律法所写的一切，因此咒诅便临到众人。因此，律法中也记载说：「凡不常照律法书上所写的一切事去行的，必受咒诅。」（申命记 27:26；参耶利米书 11:3）而那些渴望回归摩西律法的基督徒，正是希望重新回到那咒诅之下，即律法向所有无法遵行其所有规定之人所宣告的咒诅。而生活与经验均表明，没有人能够遵行这一切。
    - type: paragraph
      text:
        ru: 3:11–12
        cn: 3:11–12
    - type: paragraph
      text:
        ru: 'Зар ни старозаветни праведници? Ни они. Јер они су постали праведни не испуњењем Закона већ вером, и то вером у будућег Месију, који је имао доћи. Таквом је вером Авраам постао праведан и отац свима народима који се имају спасти Месијом; и кроз ту веру, и ради те вере изливен је благослов на њега и на сво његово потомство: на све народе. И Давид, и пророци, и сви старозаветни праведници постали су праведници том вером у Искупитеља, и силом те вере којом су живели свето и праведно. Та вера им је дала праведност, и та праведност их је оправдала пред Богом. А да се Законом нико не оправдава пред Богом, јасно је, јер је свети пророк Божји Духом Светим изрекао и написао: «Праведник ће од вере живети» (Авв.2:4; ср.Рим.1:17;Евр.10:38). Од какве вере? Од вере у будућег Месију. Од вере, не од Закона. Зашто? Зато што Закон заснива и тражи спасење, оправдање – на извршењу свих прописа Закона. А пошто нико од људи није у стању да изврши све прописе Закона, то су сви људи под клетвом. Да би човек живео, треба да их врши, и све изврши. Јер је Богом речено у Закону преко Мојсија: «Држите уредбе моје и законе моје; ко их врши, живеће кроз њих» (Лев.18:5; ср.Иез.20:11–13:21;Рим.10:5). Грешност природе људске је огромна и страховита, те су људи немоћни да испуне Закон Божји; отуда су сви под клетвом, јер је на греху проклетство Божје.'
        cn: 难道连旧约时代的义人也不是吗？他们也不是。因为他们成为义人，不是通过遵行律法，而是通过信心，并且是信靠将要降临的弥赛亚。亚伯拉罕正是凭着这样的信心成为义人，并且是所有将要借着弥赛亚得救之民族的父；也正是通过这信心，并为了这信心的缘故，祝福倾泻在他和他的所有后裔身上：倾泻在所有的民族身上。大卫、众先知以及所有旧约时代的义人，都是借着信靠救赎主的信心，并靠着这信心——他们借此圣洁且公义地生活——的力量，成为义人的。这信心赐予了他们公义，而这公义使他们在上帝面前称义。至于没有人能借着律法在上帝面前称义，这是显而易见的，因为上帝的圣先知藉着圣灵说出并写道：「义人必因信得生」（哈巴谷书 2:4；参罗马书 1:17，希伯来书 10:38）。凭着怎样的信心？是凭着对将要降临的弥赛亚的信心。是凭着信心，而不是凭着律法。为什么？因为律法将救恩、称义——建立并要求在遵守律法的所有规条之上。而既然没有人能够遵行律法所有的规条，所以所有人都处于咒诅之下。人若要存活，就必须遵行这些，并且完全遵行所有规条。因为上帝借着摩西在律法中说过：「你们要谨守我的律例和典章；人若遵行，就必因此活着」（利未记 18:5；参以西结书 20:11-13:21；罗马书 10:5）。人类本性的罪性是巨大且可怕的，以至于人无力遵行上帝的律法；因此所有人都处于咒诅之下，因为上帝的咒诅临到罪上。
    - type: paragraph
      text:
        ru: 3:13–14
        cn: 3:13–14
    - type: paragraph
      text:
        ru: 'Узевши на Себе грех света, Господ Христос је у исто време узео на Себе и проклетство греха, да би Собом спасао свет и од једног и од другог. Шта је главно у проклетсрву греха? Смрт. Добровољно умревши за род људски, безгрешни Господ – Богочовек Христос Својом крсном смрћу спасао нас је смрти као проклетства: искупио нас је, дао је себе Безгрешна за нас грешне. Као човек умро, као Бог спасао нас и искупио: јер је сва тајна Господа Исуса у томе што је Он Богочовек, што је Он Бог – постао човек, и као Богочовек извршио спасење природе људске, и кроз спасење дао јој сва божанска блага. Све што је човеково, има своју вечну вредност и вечни смисао само у Богочовеку. Само и једино у Богочовеку дат је прави, истински човек, човек савршен и довршен: јер је човек само Богом човек, или тачније: само Богочовеком човек, само у Богочовеку човек. Ко је прави, вечни човек? Само Богочовек. Јер једино у Богочовеку човек је сав од вечне истине, од вечне правде, од вечне љубави, од вечног живота. Без Богочовека, човек је, на крају свих крајева, проклетство, и збир свих проклетстава; са Богочовеком, човек је благослов, и збир свих благослова Божјих. У чудесном Господу Исусу, нарочито у Његовој многозначајној смрти за род људски, Бог нас је благословио сваким благословом (Еф.1:3), и ослободио људе проклетства које је било на њима.'
        cn: 主基督担当了世上的罪孽，同时祂也担当了罪的咒诅，为要藉着祂自己将世人从罪和咒诅中拯救出来。罪的咒诅中主要的是什么？死亡。无罪的主——神人基督自愿为人类受死，祂藉着自己的十字架上的死亡将我们从作为咒诅的死亡中拯救出来：祂救赎了我们，祂将无罪的自己赐给了我们这些有罪的人。作为人祂死了，作为神祂拯救并救赎了我们：因为主耶稣的一切奥秘在于祂是神人，在于祂是神——成了人，并作为神人完成了人类本性的救赎，又藉着这救赎赐予了人类一切神圣的福祉。一切属于人的，唯有在神人之中，才拥有其永恒的价值和永恒的意义。唯独在神人之中，才赐予了真正、真实的人，一个完美而圆满的人：因为人唯有藉着神才是人，或更准确地说：人唯有藉着神人才是人，唯有在神人之中人才是人。谁是真正、永恒的人？唯有神人。因为唯独在神人之中，人才是完全由永恒的真理、永恒的公义、永恒的爱、永恒的生命所构成。没有神人，人在一切的终结处就是咒诅，是所有咒诅的总和；有了神人，人就是祝福，是神所有祝福的总和。在奇妙的主耶稣里，特别是在祂为人类所受的意义深远的死亡中，神用各样的祝福祝福了我们（以弗所书 1:3），并使人类脱离了那曾加在他们身上的咒诅。
    - type: paragraph
      text:
        ru: 'Какво је све проклетство било на роду људском до овлаплоћења Господа Христа који га је изобиљем благослова свога богочовечанског подвига скинуо, објашњава свети Златоуст: Адам је био подвргнут великом проклетству, а Господ Христос великом благослову. Адаму би речено: да си проклет у делима својим (Быт.3:17, 4:11); тако и онима што су живели после њега: проклет ко немарно ради дело Господње (Иер.48:10), и још: проклет сваки који не остане на свима речима овога закона (Втор.27:26), и још: проклет сваки онај који виси на дрвету (Втор.21:33). – Ето колико је проклетстава. Од њих нас је ослободио Христос, поставши за нас клетва (Гал.3:13). Као што је Он и понизио себе да би нас узвисио, и умро да би нас учинио бесмртнима, тако је и постао клетва да би нас испунио благословом. Шта се може сравнити са овим благословом, када се преко клетве даје благослов? Није Он сам имао потребу за благословом, него га даје човеку. Као што ја, говорећи да је Он понизио себе, не разумем неку промену у Њему него Његово снисхођење из разлога домостроја спасења, тако и говорећи да је Он добио благослов, ја разумем не то као да је Он имао потребу за благословом, него опет показујем Његово снисхођење из разлога домостроја спасења. Тако дакле, благослов се односи на Његову човечанску природу. Васкрснувши из мртвих, Христос већ више не умире (Рим.6:9) и не подлежи клетви; или, боље рећи, Он и пре тога није подлежао клетви, али ју је примио на себе, да би избавио од ње човекa.[2]'
        cn: 圣金口约翰解释道：在主基督道成肉身之前，人类曾承受了何等多的咒诅，而基督以其神人功绩的丰盛祝福，将这咒诅除去：亚当曾遭受大咒诅，而主基督则享有大祝福。对亚当说：「你必因你的行为受咒诅」（创世记 3:17，4:11）；对那些在他之后生活的人也说：「懈怠做上主事的人必受咒诅」（耶利米书 48:10），又说：「凡不持守这律法一切话语的人，必受咒诅」（申命记 27:26），又说：「凡挂在木头上的，都必受咒诅」（申命记 21:33）。——咒诅何其多也。基督将我们从这些咒诅中释放出来，祂为我们成了咒诅（加拉太书 3:13）。就像祂自卑是为了使我们升高，又为使我们得享不朽而死去，同样，祂成了咒诅，为要使我们充满祝福。有什么能与这祝福相比呢，当祝福是透过咒诅而来的时候？祂自己并不需要祝福，而是将祝福赐予人。就像我谈及祂自卑时，并非指祂自身发生了某种改变，而是指祂因救赎的经纶而降卑；同样，我谈及祂得了祝福时，也并非指祂需要祝福，而是再次显示祂因救赎的经纶而降卑。因此，这祝福是针对祂的人性而言的。基督从死里复活后，就永不再死（罗马书 6:9），也不再受咒诅；或者更确切地说，祂在那之前也未曾受咒诅，但祂将咒诅担在自己身上，为要将人类从咒诅中拯救出来。[2]
    - type: paragraph
      text:
        ru: 'Зашто је, по Мојсијевом закону, проклет пред Богом сваки који виси на дрвету? То објашњава Мојсије у закону: Ко згреши тако да заслужи смрт, те буде осуђен на смрт и обесиш га на дрво, нека не преноћи тело његово на дрвету, него га исти дан погреби, јер је проклет пред Богом ко је обешен (Втор.21:23). То значи, оваква смрт била је знак крајње порочности, због чега је осуђен на такву смрт био проклет пред Богом. Није сваки који виси на дрвету, вели блажени Јероним, проклет пред Богом, него онај који је учинио грех достојан смрти, те убијен зато и обешен на дрвету. Није он проклет стога што виси на дрвету, него стога што је пао у такав грех, да је заслужио да буде распет.[3]'
        cn: 为什么根据摩西的律法，每一个挂在木头上的人，都是在上帝面前被咒诅的？摩西在律法中解释说：凡犯了该死的罪，以致当得死刑，且被判处死刑，你将他挂在木头上，他的尸体不可在木头上过夜，却要在当日将他埋葬，因为被挂的乃是在上帝面前被咒诅的。（申命记 21:23）这意味着，这种死亡是极端邪恶的标志，因此，被判处这种死刑的人，在上帝面前是被咒诅的。蒙福者耶罗尼米说：「不是每一个挂在木头上的人，在上帝面前被咒诅，而是那犯了当死之罪，因而被杀并挂在木头上的人。」他不是因为挂在木头上而被咒诅，而是因为他犯了这样的罪，以至于配得被钉死在十字架上。[3]
    - type: paragraph
      text:
        ru: Господ Христос, примивши крсну смрт, иако безгрешан, примио је на себе проклетство те смрти, и Својом незаслуженом смрћу уништио проклетство које је било на роду људском. Пошто је онај који виси на дрвету проклет, вели свети Златоуст, то је онај који је имао да разреши ту клетву требао бити слободан од ње, и примити на себе ту клетву незаслужену место оне заслужене, стога је Христос и примио на себе такву клетву и њоме уништио ону заслужену. И као што невин човек, који се реши да умре место осуђенога на смрт, избавља овога од казне, тако и Христос учини. Пошто Христос није подлежао проклетству за преступање Закона, то је Он и примио на себе проклетство које смо ми заслужили а не Он, да би све ослободио од заслуженога, јер Он греха не учини, нити се обмана нађе у устима његовим (Ис.5:39). Као што, дакле, онај који је умро место оних који су имали умрети, ослобођава ове од смрти, тако и Онај који је примио на себе проклетство – ослободио је од проклетства.[4]
        cn: 主基督，尽管祂无罪，却接受了十字架上的死亡，并将那死亡的咒诅加于自身，并且借着祂那不应得的死亡，摧毁了曾加诸于人类的咒诅。圣金口约安说，因为那挂在木头上的，是受咒诅的，因此，那将要解除这咒诅的，本该免于这咒诅，并将那不应得的咒诅加于自身，以代替那应得的咒诅，因此，基督也正是将这样的咒诅加于自身，并借此摧毁了那应得的咒诅。并且正如一个无辜的人，他决定替一个被判死刑的人而死，将这个人从惩罚中解救出来，基督也照样做了。既然基督不受因触犯律法而来的咒诅，祂便将那我们应得而非祂应得的咒诅加于自身，为要将所有人从那应得的咒诅中释放出来，因为祂没有犯过罪，祂口中也没有诡诈（以赛亚书 5:39）。因此，正如那替那些本该死去之人而死的人，将这些人从死亡中解救出来，同样，那将咒诅加于自身者，也从咒诅中将人释放出来。[4]
    - type: paragraph
      text:
        ru: 'Невини Господ Христос постао је за нас клетва на тај начин, што је примио на себе проклетство првороднога греха и свих грехова свега света (Ин.1:29), са свима страшним последицама греха: немоћима, мукама, страдањима, смрћу, које и сачињавају тужну и неминовну казну за грех. Спаситељ је, иако безгрешан, те као такав слободан од проклетства за неиспуњење Закона, поднео све муке и казне које због греха леже на роду људском, и тиме нас искупио од проклетства греха. Сви су народи били под проклетством, вели свети Јустин Философ, јер су сви били подложни гресима и пороцима. Господ Христос је примио на себе проклетство свију, за сав род људски поднео понижење и смрт, да би Својом смрћу и васкрсењем победио смрт.[5]'
        cn: 无罪的主基督为我们成了咒诅，其方式是，祂担负了原罪和全世界所有罪孽的咒诅（约翰福音 1:29），连同罪的所有可怕后果：软弱、痛苦、磨难、死亡，这些正是忧伤而不可避免的罪的惩罚。救主虽然无罪，因此免于因不遵守律法而受的咒诅，却承受了因罪而落在人类身上的一切苦难和惩罚，从而将我们从罪的咒诅中救赎出来。圣尤斯廷哲学家说，所有的民族都曾处于咒诅之下，因为他们都屈从于罪恶和恶行。主基督担负了所有人的咒诅，为全人类承受了屈辱和死亡，为的是藉着祂的死与复活战胜死亡。[5]
    - type: paragraph
      text:
        ru: 'Нас је тајна научила и ми верујемо, изјављује свети Григорије Ниски, да је људска природа спасена кроз сједињење са Логосом. Јер Онај који ради нас постаде грех (2Кор.5:21) и клетва (Гал.З:1З), како то вели апостол, и узе на себе немоћи наше, по речи пророка Исаије (Ис.53:4), не остави при себи неизлечене: грех, клетву и немоћ, него смртно би прогутано животом (2Кор.5:4); распет по немоћи, жив је по сили (2Кор.13:4); клетва би претворена у благослов.[6]'
        cn: 圣格列高利·尼萨宣称，秘事教导了我们，我们也相信，人性是藉着与道（Logos）的结合而得救的。因为那为我们成为罪（哥林多后书 5:21）和咒诅（加拉太书 3:13）的，正如使徒所说，并照着先知以赛亚的话（以赛亚书 53:4），担当了我们的软弱，没有让罪、咒诅和软弱在他里面得不到医治，反而让必死的被生命吞灭（哥林多后书 5:4）；他因软弱被钉十字架，却凭着能力活着（哥林多后书 13:4）；咒诅被转化为祝福。[6]
    - type: paragraph
      text:
        ru: 'По светомМаксиму Исповеднику, кроз Адамов преступ проклетство је легло на сву земљу и на сав људски род. Да би твар примила благослов Бога Оца, Син Божји постаје клетва и грех, уништавајући клетву и узимајући грех света на себе. Две су клетве биле на човеку: једна је плод људске слободне воље, тојест грех, а друга – смрт, која је с правом била додељена природи због добровољног греха. Бог, творац природе, у осуђеној природи добровољно узе на себе клетву, тојест смрт, и живећи у човеку по вољи греха клетву уби својом властитом смрћу – крстом.[7]'
        cn: 圣马克西姆宣信者指出，通过亚当的罪过，咒诅降临在全地和全人类身上。为了使受造物领受父神的祝福，圣子成为咒诅和罪，摧毁咒诅，并亲自担当世人的罪。人身上有两种咒诅：一种是人类自由意志的果实，即罪；另一种是死亡，死亡因自愿的罪而理所当然地加诸于本性。神，万物的创造者，在被定罪的本性中自愿担当咒诅，即死亡，并在人里面，按着罪的意志，以他自己的死亡——十字架——杀死了咒诅。[7]
    - type: paragraph
      text:
        ru: 'Грех се разгранао кроз сву природу људску, и у сваком човеку сазрео смрћу, зато су сви људи, сви народи били под грехом, и стога под проклетством греха – смрћу. Господ Христос, узевши на себе природу људску, и тиме јој давши све благослове божанске, Својом крсном смрћу излио је благослов Свој на сав род људски, на све људе, на све народе. И тај благослов доступан је свима људима кроз веру у Христа Спаситеља. Ту нема изузетка: и изабрани народ и незнабошци могу том вером у Богочовека примити све дарове Светога Духа, који у свакоме оплођују, израђују праведност, бесмртност и живот вечни. Тако и на незнабошце долази благослов Авраамов кроз Господа Исуса, јер је Господ Исус дошао на свет ради спасења свих људи, и умро за спасење свих. Објашњавајући ове апостолове речи из Посланице Галатима (Гал.3:13–14), свети Кирил Александриски вели: Смрт Христова постаде спасоносна за свет, јер Он постаде клетва подневши смрт и бивши обешен на дрвету, да би грех уништио, да би благослов Авраамов био на свима народима у Христу Исусу, тојест да би се оправдали народи вером, по обећању датом Аврааму, да обећање Духа примимо кроз веру. Када, дакле, смрт Христова уништи законску клетву и доносе благослов Авраамов народима, тојест благодат кроз веру, и учини нас заједничарима Светога Духа, онда значи да Христова смрт није била смрт обичног човека, него да Логос, поставши тело, пострада телом за свет, и Његово страдање би довољно за искупљење света.[8]'
        cn: 罪恶蔓延遍布于整个人类本性，并在每个人中以死亡成熟，因此所有的人，所有的民族都伏在罪下，因而伏在罪的咒诅下——死亡。主基督，取了属人的本性，并因此赐予了她所有神圣的祝福，祂藉着自己的十字架上的死亡，将祂的祝福倾注在全人类、所有的人、所有的民族身上。而这祝福，借着对基督救主的信仰，对所有人都可得。在此没有例外：选民和外邦人都能借着对这神人的信仰，领受圣灵的一切恩赐，这些恩赐在每个人中结出果实，造就公义、不朽和永生。同样，亚伯拉罕的祝福也借着主耶稣临到外邦人，因为主耶稣来到世上是为了拯救所有人，并为拯救所有人而死。解释使徒在《致加拉太人书》（加拉太书 3:13-14）中的这些话时，圣西里尔·亚历山大这样说：基督的死亡对世界成为救赎，因为祂忍受死亡并被挂在木头上，成了咒诅，为要毁灭罪，为要使亚伯拉罕的祝福借着基督耶稣临到万民，也就是说，使列国借着信仰得称义，根据给亚伯拉罕的应许，好使我们借着信仰领受圣灵的应许。那么，既然基督的死亡摧毁了律法的咒诅，并将亚伯拉罕的祝福带给列国，也就是说，借着信仰的恩典，并使我们成为圣灵的分享者，那么这意味着基督的死亡不是一个普通人的死亡，而是道成肉身，以肉身受苦为世人，祂的受苦足以赎回世界。[8]
    - type: paragraph
      text:
        ru: '«Да на незнабошце дође благослов Авраамов». На који начин? пита свети Златоуст. И одговара: У семену твоме, речено је, благословиће се сви народи (Быт.22:18), тојест у Христу. А ако би се говорило о Јеврејима, како би било у сагласности са здравим разумом, да они који подлеже проклетству због нарушења Закона постану виновници благослова за друге? Та нико од оних који су под проклетством не може дати другоме благослов којега је сам лишен. Отуда је јасно, да је све ово речено о Христу, пошто је Он био семе Авраамово, и кроз Њега се благосиљају народи, те се на тај начин јавља обећање Духа. Указујући управо на то, апостол и каже: да обећање Духа приме кроз веру. А пошто се благодат Духа не може излити на неблагодарног и оног који је у непријатељству, то се благосиљају прво кроз скидање проклетства; а потом, будући оправдани кроз веру, добијају благодат Духа. На тај начин крст је уништио клетву, а вера је увела оправдање, а оправдање је низвело благодат Духа.[9]'
        cn: 「愿亚伯拉罕的祝福临到外邦人。」圣金口约翰问道：「以何种方式呢？」他回答说：「在你的后裔中，万国将蒙福（创世记 22:18），也就是说，在基督里。」但如果这是指犹太人，那么那些因违背律法而受咒诅的人，怎能成为他人蒙福的原因呢？这又如何与健全的理性相符呢？因为凡在咒诅之下的人，无法将自己所缺乏的祝福赐予他人。由此可见，这一切都是指基督而言，因为祂是亚伯拉罕的后裔，万国也藉着祂蒙福，这样，圣灵的应许便得以显明。使徒正是指着这一点说：叫他们藉着信接受圣灵的应许。既然圣灵的恩典不能倾注于忘恩负义和心怀敌意之人，因此他们首先藉着除去咒诅而蒙福；随后，藉着信称义，他们便领受圣灵的恩典。如此，十字架废除了咒诅，信心带来了称义，称义则引来了圣灵的恩典。[9]
    - type: paragraph
      text:
        ru: '3:15'
        cn: '3:15'
    - type: paragraph
      text:
        ru: 'Домострој спасења рода људског сав је од Богочовека и по Богочовеку. Али да бисте боље разумели божанску тајну о спасењу незнабожаца, хоћу да вам говорим «по човеку», узимајући пример из свакидашњег људског живота. Када човек напише и потврди свој тестамент, завет, завештање, нико не одбацује из њега што нити му домеће, иако је то људско писмо. Тако бива кад је реч о људском завету, утолико пре то важи за завет Божји: њему се још мање сме што дометнути или одузети.'
        cn: 人类救赎的经纶，完全是出于神人并依循神人。但是，为了让你们更好地理解关于外邦人救赎的神圣奥秘，我愿「照着人的话」对你们说，举一个来自日常人类生活的例子。当一个人立下并确认他的遗嘱、盟约或遗命时，没有人会从中废弃或增添任何内容，即便那只是一份人的文书。关于人的盟约尚且如此，何况对于神的盟约，就更不容许增添或删减任何内容了。
    - type: paragraph
      text:
        ru: 3:16–17
        cn: 3:16–17
    - type: paragraph
      text:
        ru: 'Бог је начинио завет с Авраамом, давши обећање Аврааму и семену његовом, које је Христос. Христос је Авраамов потомак, у коме се испуњују сва обећања дата Аврааму. То је завет Божји Аврааму, непроменљив и неприкосновен. Све што је касније дошло од Бога, дошло је као објашњење и образложење тога, ни у ком случају као измена. И овај завет не може бити ни измењен, ни допуњен, ни обеснажен, ни укинут законом који је постао после четири стотине и тридесет година. Заветовање Божје Аврааму састоји се у обећању: да ће се у њему благословити, тојест спасти греха и смрти и ђавола сви народи на земљи. А то нити је учинио, нити чини Закон који је дошао касније јер нема силе. То је једини учинио и чини Господ Христос, као потомак Авраамов, и у Њему се, једино у Њему и испуњује обећање дато Аврааму завештањем о спасењу рода људског од греха, смрти и ђавола, тим јединим истинским благословом којим је Бог могао благословити род људски.'
        cn: 上帝与亚伯拉罕立了约，将应许赐给亚伯拉罕和他的后裔，这后裔就是基督。基督是亚伯拉罕的后裔，在祂里面，赐给亚伯拉罕的一切应许都得以成就。这是上帝与亚伯拉罕所立的约，是不变的，也是不可侵犯的。后来一切从上帝而来的，都是对这个约的阐释和说明，绝非更改。而且，这约既不能被更改，也不能被增添，不能被废止，也不能被那在四百三十年之后颁布的律法所废除。上帝与亚伯拉罕所立的约在于这个应许：地上万族都将因他蒙福，亦即从罪、死亡和魔鬼中得救。而这，后来的律法既没有做到，也无法做到，因为它没有能力。唯有主基督，作为亚伯拉罕的后裔，独自成就并正在成就此事；并且，唯有在祂里面，亚伯拉罕所得到的、藉着关于拯救人类脱离罪、死亡和魔鬼的圣约而来的应许才得以实现，而这实现的途径，正是藉着上帝能赐予人类的唯一真正福分。
    - type: paragraph
      text:
        ru: 3:18–19
        cn: 3:18–19
    - type: paragraph
      text:
        ru: 'Јер само се тим благословом добија вечно наслеђе Божје: царство Божје. Авраам је добио то обећање као завештање, као неизменљив и свеважећи завет; и то добио као дар. А све остало што је дошло после тога, дошло је да води ка остварењу тога. И Закон? Да, и Закон. Он је дат, не да се испуњењем њега изврши спасење рода људског, јер он није имао те силе, него да живот старозаветних људи, обасјаван његовом светлошћу, укаже свакоме колико је грех грешан и ужасан, и колико је смрт моћна и бездушна, и колико је ђаво силан и страшан, и колико је сваки човек посебно немоћан, и сви људи скупа беспомоћни да се сами спасу тих страхота и ужаса, и да то може учинити само обећани Аврааму Месија. Закон је дат, да старозаветни човек у њему као у огледалу види своју грешност, своје грехе, своје преступе; и да осети сву своју немоћ да се сам спасе тога, те да због тога што јаче чезне и вапије за Спаситељем, за Христом = Месијом. Закон региструје грехе и преступе и кривице старозаветног света: «јер где нема закона нема ни преступа» (Рим.4:15). Закон казује и показује шта је грех, шта је преступање воље Божје, јер је «грех без закона мртав» (Рим.7:8). Залуђени грехом, његовом привидном сладошћу, људи не би могли без Закона бити свесни своје греховности и њене страхотне убитачности. Закон открива и разголићује грех, али га не уклања, јер нема те силе; открива и разголићује смрт, али је не уклања, јер нема те силе; открива и разголићује ђавола, али га не уклања, јер нема те силе. А дат је људима, да им отвори све очи душе на страхоту и ужасност и убитачност греха, смрти и ђавола, те да се људи свим срцем, свом душом, свим умом, свом снагом пружају ка Месији кроз вапаје и молитве и јауке. Закон до пожара разбуктава муку од греха, од смрти, од ђавола, и човек сав гори за Месијом који га има спасти од тог троједног ужаса и пакла. Закон је будитељ који буди и указује на опасност од тог људождерског пожара; он је стражар који труби на узбуну пред опасностима које непрестано прете бићу људском од греха, смрти и ђавола.'
        cn: 因为唯独藉着这祝福，才能得着神的永恒产业：神的国度。亚伯拉罕得着了这应许，作为一份遗训，一份不变且普世有效的盟约；并且是作为一份恩赐得着的。而在那之后来到的一切，都是为了引导其实现。律法呢？是的，律法也是。它被赐下，并非借由遵行它来成就人类的救赎，因为它没有那样的能力；而是要让旧约之人的生命，被它的光所照耀，向每个人指出罪是何等有罪且可怖，死亡是何等强大且无情，魔鬼是何等强大且可畏，以及每个人个体是何等无力，而所有人集合起来是何等无助，无法自救脱离那些恐怖与惊骇，唯独那应许给亚伯拉罕的弥赛亚才能做到。律法被赐下，为使旧约之人能在其中，如同在镜子里看到自己的罪性、自己的罪行、自己的过犯；并感受到自己完全无力自救脱离这一切，因此能更加强烈地切慕并呼求救主，呼求基督 = 弥赛亚。律法记录了旧约世界的罪行、过犯和罪咎：「因为哪里没有律法，哪里就没有过犯」（罗马书 4:15）。律法述说并显明什么是罪，什么是违背神的旨意，因为「没有律法，罪是死的」（罗马书 7:8）。被罪及其表象的甘甜所迷惑的人们，如果没有律法，就无法意识到自己的罪性及其可怕的致命性。律法揭露并暴露罪，但它无法除去罪，因为它没有那种能力；它揭露并暴露死亡，但它无法除去死亡，因为它没有那种能力；它揭露并暴露魔鬼，但它无法除去魔鬼，因为它没有那种能力。而它被赐给人类，为要向他们全然开启灵魂的双眼，看清罪、死亡和魔鬼的可怖、可憎和致命性，从而使人们能全心、全灵、全意、全力地，藉着哀求、祷告和呻吟，投向弥赛亚。律法将人因罪、因死亡、因魔鬼而来的痛苦煽动得如同烈火，于是人便全然渴慕那将要将他从这三位一体的恐怖与地狱中拯救出来的弥赛亚。律法是唤醒者，它唤醒并指出那吞噬人心的烈火所带来的危险；它是吹响警号的守望者，警示罪、死亡和魔鬼持续不断地威胁着人类生命所带来的危险。
    - type: paragraph
      text:
        ru: Закон је дат, да Јевреји не би живели безбрижно грешећи, него да би их страх од греха, смрти и ђавола задржавао од нарушавања заповести Божјих. Тако дакле, вели свети Златоуст, није мала корист од Закона. Али докле? «Док не дође семе коме је обећање дато; а под семеном се разуме Христос. Стога, ако је Закон дат само до доласка Христова, ради чега га онда ти продужујеш даље и преко одређеног рока?»[10]Закон има привремену улогу и важност. Зато је он и дат преко анђела руком посредника Мојсија (ср.Евр.2:2;Деян.7:53;Исх.20:19;Втор.5:5;Деян.7:38).
        cn: 律法被赐下，是为了不让犹太人无忧无虑地犯罪，而是让罪、死亡和魔鬼的恐惧阻止他们违背上帝的诫命。因此，正如圣金口约翰所说，律法的益处不小。然而，到何时为止呢？「直到那承受应许的『后裔』来到；而这『后裔』指的就是基督。因此，如果律法仅仅是为基督的到来而赐予的，那么你为何还要继续将其延长，超出其既定限期呢？」[10]律法具有暂时的作用和重要性。因此，它才借着天使，通过中保摩西的手被赐予 (参阅 希伯来书 2:2，使徒行传 7:53，出埃及记 20:19，申命记 5:5，使徒行传 7:38)。
    - type: paragraph
      text:
        ru: '3:20'
        cn: '3:20'
    - type: paragraph
      text:
        ru: '«Но посредник није једнога, а Бог је један». Закон је дат преко посредника, човека Мојсија, а обећање Аврааму дато је самим Богом непосредно. И једно и друго је од Бога, само је Закон мање важан. Као мање важан, Закон је дат преко човека, а обећање о благослову и спасењу помоћу Месије дато је самим Богом, зато што је неизмерно важније. Закон је подвременски, обећање има вечни значај и смисао. При давању Закона посредник човек посредовао је између Бога и људи; у обећању спасења рода људског дела сам Бог, који је један. Он један исти и даје обећање, Он један исти и спасава. Истина, спасење је извршено непосредно оваплоћеним Сином Божјим, Господом Исусом Христом, али је Он по бићу и Божанству једно са Богом Оцем и Духом Светим. Уствари, човек посредник према вечноме Богу и Господу тако је мали, до небића мали, да упоређен са Богом он као да не постоји: οὐκ ἔστιν; а Бог је, у самој ствари, једини који стварно постоји, јер непролазно постоји, који стварно јесте, јер је вечан и с обзиром на прошлост и с обзиром на будућност: «А Бог је један». Према Богу, према Његовој реалности, све изгледа призрак, привид. Ниједна твар нема ни изблиза ону реалност коју има Он, Бог Творац. По своме бићу Бог је нешто толико изузетно и јединствено, да је Њему чак и име: ὁ ὦν = Онај који јесте, Постојећи, Сушчиј (Исх.3:14, 6:3). Према Њему, као Једино Свесавршено Постојећем, све остало постојеће је као сенка постојања, и то предалека сенка Једино Постојећег.'
        cn: 「但中保不是一方面的，神却是一位。」律法是藉着中保，人摩西，所赐的；而赐给亚伯拉罕的应许，则是神亲自直接赐下的。两者都源于神，只是律法次要一些。作为次要的，律法是藉着人所赐的；而借着弥赛亚所赐的关于祝福与救恩的应许，则是神亲自赐下的，因为它具有不可估量的更重要的意义。律法是受时间限制的，应许则具有永恒的意义和内涵。在赐下律法时，中保之人居于神与人之间；而在赐下人类救恩的应许时，则由那一位独一的真神亲自行动。祂这位独一者，既赐下应许，也施行拯救。诚然，救恩是由道成肉身的神子——主耶稣基督——直接完成的，但祂就其本质和神性而言，与父神和圣灵是合一的。事实上，中保之人相较于永恒的神和主而言，是如此微小，小到几近虚无，以至于与神相比，他仿佛不存在：οὐκ ἔστιν；而神，在本质上，是唯一真实存在的，因为祂以不朽的方式存在，祂是真实地「是」，因为祂无论是对于过去还是对于将来都是永恒的：「但神却是一位。」相较于神，相较于祂的真实性，一切都显得如同幻影，虚像。没有任何受造物能与祂——造物主神——所拥有的真实性相提并论，甚至无法望其项背。就其本质而言，神是如此卓越和独特，以至于祂甚至拥有一个名字：ὁ ὦν = 祂是那自有永有的，那存在的，那本体（出埃及记 3:14，6:3）。相较于祂，这位独一的、全然完美的存在者，其余一切存在的都如同存在之影，而且是那位独一存在者那遥远至极的影子。
    - type: paragraph
      text:
        ru: '3:21'
        cn: '3:21'
    - type: paragraph
      text:
        ru: Је ли онда Закон противан обећањима Божјим? Боже сачувај! Напротив, обећања Божја потпунце испуњују оно што Закон тражи и хоће. Јер Закон тражи и хоће спасење рода људског од греха, смрти и ђавола, а преко тога благослов вечни од Бога. Али Закон нема у себи силе да то изврши и оствари. Закон нема у себи силе вечнога живота, да би људима, који су робље смрти, могао дати живот вечни. Закон нема у себи свемоћне силе вечнога живота, да би људима, који су робље смрти, могао дати живот вечни. Закон нема у себи свемоћне силе, која може победити страшну силу зла и ђавола, и ослободити људе од њега. Закон нема у себи ону свеосвећујућу силу светости божанске, која може уништити сав грех у васцелој природи људској и дати праведност бићу људском, праведност коју би свеправедни Бог примио као оправдање људске природе због греха и зла. Закон нема у себи вечне божанске животворне силе, зато и не може дати људима вечну животворну праведност, која савлађује све смрти, све грехе, све ђаволе у свима световима.
        cn: 难道律法与神的应许相悖吗？断乎不是！恰恰相反，神的应许完全实现了律法所要求和渴望的。因为律法要求并渴望人类从罪、死亡和魔鬼中得救，并借此从神得着永远的祝福。但是律法本身没有能力去成就和实现这一切。律法本身没有永生的能力，好能将永生赐给那些作为死亡奴仆的人。律法本身没有永生那全能的力量，好能将永生赐给那些作为死亡奴仆的人。律法本身没有全能的力量，能战胜邪恶和魔鬼那可怕的力量，并使人从中得自由。律法本身没有那使万物成圣的神圣圣洁力量，能够毁灭人类整个本性中的所有罪，并赋予人类存在以公义，这种公义是全然公义的神会接受的，作为对人类本性因罪恶而得的称义。律法本身没有永恒的神圣赐生命力量，所以也不能赐给人类永恒的赐生命公义，这种公义能战胜所有世界中的所有死亡、所有罪恶、所有魔鬼。
    - type: paragraph
      text:
        ru: '3:22'
        cn: '3:22'
    - type: paragraph
      text:
        ru: 'Зато је и при Закону сав свет под грехом, и у греху, опкољен грехом са свих страна; зато писани закон Божји, Свето Писмо, и показује да је сав род људски под поклопцем греха, да су сви људи затворени под грех као беспомоћно робље смрти, која је главна сила ђавола и греха. Све – докле? До Господа Христа, оваплоћеног Бога, Богочовека. Он као вечити Бог, поставши човек, донео је васцелој природи људској, васцелом роду људском, све божанске силе, неопходне да људи могу победити грех, смрт и ђавола, и стећи Живот Вечни, Истину Вечну, Правду Вечну, Љубав Вечну, Блаженство Вечно. И тако је Богочовек испунио обећање дато Богом Аврааму о благослову рода људског преко њега. И свих тих блага ми постајемо заједничари и поседници и наследници, како? Вером у Господа Христа, Богочовека и Спаситеља и Искупитеља. Вером у Христа сваки човек, био он незнабожац или Јеврејин, низводи на себе онај благослов који је Бог дао Аврааму кроз обећање да ће се у њему благословити сви народи на земљи, у њему, тојест у потомку његовом: Господу Христу, извршитељу спасења, и тиме раздаваоцу благослова.'
        cn: 因此，甚至在律法之下，整个世界都处于罪中，被罪环绕，从四面八方被罪包围；因此，成文的上帝律法，《圣经》，也表明全人类都处于罪的遮蔽之下，表明所有人都被囚禁在罪中，如同死亡无助的奴役，而死亡正是魔鬼和罪的主要力量。这一切——直到何时？直到主基督，道成肉身的上帝，即那神人。他作为永恒的上帝，成为人，为全人类的本性，为全人类，带来了所有神圣的力量，这些力量是人类战胜罪、死亡和魔鬼所必需的，从而获得永恒的生命、永恒的真理、永恒的公义、永恒的爱和永恒的福乐。于是，这神人就成就了上帝通过亚伯拉罕赐福人类的应许。我们如何成为所有这些恩惠的分享者、拥有者和继承者呢？借着对主基督——那位神人、救主和救赎者的信心。借着对基督的信心，每一个人，无论是外邦人还是犹太人，都将上帝通过应许赐给亚伯拉罕的祝福引到自己身上，即地上的万民都将在他里面蒙福，在他里面，也就是在他的后裔——主基督里面，他是救赎的完成者，并因此是祝福的施予者。
    - type: paragraph
      text:
        ru: '3:23'
        cn: '3:23'
    - type: paragraph
      text:
        ru: До Христова доласка у наш земаљски свет, сви су људи били под грехом, и у греху као у некој тамници, у којој је Закон Божји светлошћу својом јасно осветљавао људима њихову грешност, те су они били свесни своје грешности и одговорности пред Богом, а и своје беспомоћности пред страхотном силом греха и зла. Но тиме им је било дато све, да би они ватрено желели долазак Безгрешног Месије, који ће их ослободити греха и извести их из њихове тамнице, која је уствари пакао и царство смрти, у коме је цар Сатана. Чувани под Законом, и у ланцима Закона, људи су кочени и задржавани да грех не узме маха још у већим размерама; и тако били чувани као затворени за веру која се имала дати Богочовеком Христом, Месијом.
        cn: 在基督降世到我们的尘世之前，所有人都伏在罪的权下，并如同被囚禁在罪的牢狱中。在其中，上帝的律法以其光芒清晰地照亮了人们的罪性，于是他们就清楚地意识到自己的罪性和在上帝面前的责任，以及他们在罪和恶的可怕力量面前的无助。然而，借此他们被赋予了一切，好让他们热切地渴望无罪弥赛亚的降临，祂将把他们从罪中释放出来，并把他们从他们的牢狱中领出来，这牢狱实际上就是地狱和死亡的国度，其中撒旦为王。在律法之下受看守，并被律法的锁链束缚着，人们被抑制和约束着，以免罪恶在更大程度上肆虐；如此，他们被看守着，仿佛被囚禁以等待那将由神人基督、弥赛亚所赐予的信仰。
    - type: paragraph
      text:
        ru: 'Зашто се сав домострој спасења Христовог назива вером, а не знањем, а не законом? Зато што је Господ и Бог Исус Христос донео људима таква божанска блага и таква божанска савршенства, каква огреховљени ум људски и савест и срце ни замислити нису могли, нити могу, а камоли знати их и добити их својим моћима. Победити смрт и дати човеку бесмртност и живот вечни, који је то ум људски могао сматрати за могуће и нормално и логично? Ниједан. Вера у то – вера је у немогуће. А то баш и јесте оно што је Господ Христос учинио за род људски: једини Он учинио је оно што је по свима законима људске огреховљене логике, логике «затворене под грех», апсолутно немогуће. Учинивши немогуће могућим, Он је људима дао веру, веру која обухвата све Његове богочовечанске подвиге на земљи: победу над грехом, победу над смрћу, победу над ђаволом; и све Његове богочовечанске дарове: Вечни Живот, Вечну Истину, Вечну Правду, Вечну Љубав, и све остало што је потребно за човеково бескрајно усавршавање у Богу и ка Богу, за човеково обожење, за човеково обогочовечење, за постигнуће оног јединог достојног циља људског постојања у овом и у свима световима: Будите савршени као што је савршен Отац ваш Небески – Бог (Мф.5:48; ср.Лк.6:36). Имајући све то у виду, Спаситељ је и рекао запрепашћеним поводом тога ученицима Својим: Људима је ово немогуће, а Богу је све могуће (Мф.19:26). Суштина и новина новозаветне богочовечанске благовести и састоји се у томе, што Бог, поставши човек, чини у нашем човечанском свету могућим и остварљивим све што је божанско (ср.Лк.1:37, 18:27). Људска немоћ и Божја свемоћ, ето то је дилема; и то је вера у Христа. Богочовек личношћу и подвигом Својим уклања ту дилему, ту антиномију, и као Бог чини да у човечанском свету немогуће постане могућим, и даје људима ту силу, да и они то исто чине (ср.Ин.14:12). Отуда свети апостол Павле и објављује реч и стварност коју нико од људи није могао без Христа Богочовека ни стећи ни изрећи: «Све могу у Христу Исусу који ми моћи даје» (Флп.4:13).'
        cn: 为什么基督的整个救赎经纶被称为信心，而非知识，亦非律法？因为主和神耶稣基督带给人类的神圣恩惠和神圣的完全，是堕落罪中的人类心智、良知和心灵都无法想象，现在也无法想象，更不用说通过自己的能力去认识它们和获得它们了。战胜死亡，并赐予人不死性与永生，哪个人类心智能够将其视为可能、正常和合乎逻辑的呢？没有一个。对此的信心——就是对不可能之事物的信心。而这正是主基督为人类所做的：唯有他做成了根据人类堕落罪中的逻辑，也就是「被罪所禁锢」的逻辑，绝对不可能之事。他使不可能变为可能，并赐予人类信心，这信心包含了他在地上所有神人一体的功绩：战胜罪恶，战胜死亡，战胜魔鬼；以及他所有神人一体的恩赐：永恒的生命，永恒的真理，永恒的公义，永恒的爱，和所有人类在神里面并朝向神无限完善所必需的一切，为了人类的成神，为了人类的成神为人，为了实现人类在此世和所有世界中唯一值得追求的目标：你们要完全，像你们的天父是完全的一样——神（马太福音 5:48；参 路加福音 6:36）。考虑到这一切，救主也对为此事感到惊愕的门徒们说：在人这是不能的，在神凡事都能（马太福音 19:26）。新约神人一体的福音的精髓和新颖之处就在于此，即神成为人，在我们的人类世界中使一切神圣的事物成为可能和可实现的（参 路加福音 1:37，18:27）。人类的软弱和神的无所不能，这就是困境；这也是对基督的信心。神人一体者以其位格和功绩消除了这个困境，这个二律背反，并作为神，使人类世界中不可能之事变为可能，并赋予人类这种力量，使他们也能做同样的事（参 约翰福音 14:12）。因此，圣使徒保罗宣示了这样的话语和现实，没有神人一体的基督，没有人能够获得或说出这样的话语和现实：「在赐予我力量的基督耶稣里，我凡事都能」（腓立比书 4:13）。
    - type: paragraph
      text:
        ru: 'Када Закон Мојсијев, Закон Божји не може спасти, и нема силе, како онда ти – огреховљена савести људска, и ти – огреховљени разуме људски, и ти – огреховљена вољо људска, можете знати и умети и имати моћи да спасете човека и род људски од греха, смрти и ђавола? Шта вама треба? Једно: да се ослободите греховности своје. Тада ћеш ти, савести људска, божански јасно сагледати и видети разлику између добра и зла, и стећи љубав за добро и мржњу за зло. А то ћеш постићи, ако себе жртвујеш вери Христовој предавши јој се потпуно, да те она преради, прероди, препороди, преобрази, освети, обожи, обогочовечи. Тако и ти, огреховљени разуме људски, и ти огреховљена вољо људска, и ти огреховљена логико људска, и све што се човек зове, – свима је вама само један лек од смрти и греха: вера у Богочовека; и једина победа над грехом, смрћу и ђаволом: вера у Богочовека; и једина бесмртност и вечност и блаженство у Истини Вечној, у Правди Вечној, у Љубави Вечној, у Радости Вечној: вера у Богочовека. Савести моја, шта ћеш ми ти, ако ме не приведеш Христу, да те Он освети, обожи, обогочовечи? Без њега – ти си ми непотребна! без Њега – ти си ми мука и терет! иди од мене, беспомоћна слепице! И ти разуме, шта ћеш ми, ако ме не приведеш Христу који те једини може исцелити од свих твојих немоћи и болести и заблуда? Без Њега, Божанског Сверазума, Свелогоса – не требаш ми! О, проклет, проклет, проклет био! јер си ме безброј пута у заблуде заводио, и у бесмислице потапао, и у смрти сурвавао! Нашта ми све моје, све што мене чини мноме? Не треба ми ни овога ни онога света, ако не постане Христово, и тиме – освећено, обожено, спасено, спасено од смрти, греха и ђавола!'
        cn: '当摩西律法，上帝的律法不能拯救，也无能为力时，你们——哦，被罪玷污的人类良知啊，你啊，被罪玷污的人类理性啊，你啊，被罪玷污的人类意志啊，你们怎能知道、懂得并有能力去拯救人和人类脱离罪、死亡和魔鬼呢？你们需要什么？唯有一事：摆脱你们的罪性。那时，你啊，人类的良知，将会神圣地清晰洞察和看见善与恶之间的区别，并生发对善的爱和对恶的恨。而这，你将能够实现，如果你将自己献祭于基督的信仰，完全地将自己交托于祂，好让祂重塑你，重生你，更新你，改变你，圣化你，神化你，神人化你。


          同样，你啊，被罪玷污的人类理性，你啊，被罪玷污的人类意志，你啊，被罪玷污的人类逻辑，以及所有被称为人的一切，——你们所有人都只有一种摆脱死亡和罪恶的良药：对神人的信仰；唯一的战胜罪、死亡和魔鬼的胜利：对神人的信仰；唯一的永生、永恒和福乐，存在于永恒的真理中，永恒的公义中，永恒的爱中，永恒的喜乐中：对神人的信仰。


          我的良知啊，你对我有什么用，如果你不引我归向基督，好让祂圣化你，神化你，神人化你？没有祂——你对我毫无益处！没有祂——你对我而言是痛苦和重担！离开我吧，无助的盲者！


          还有你啊，理性，你对我有什么用，如果你不引我归向基督，祂是唯一能医治你脱离你一切的软弱、疾病和谬误？没有祂，那神圣的全智，全逻各斯——你对我毫无意义！哦，可诅咒，可诅咒，可诅咒啊！因为你曾无数次将我引入歧途，将我沉浸于荒谬之中，并将我推入死亡！


          我所有的，那使我成为我的一切，对我有什么用呢？我既不需要这个世界，也不需要那个世界，如果它不属于基督，从而——被圣化，被神化，得蒙拯救，从死亡、罪恶和魔鬼中得蒙拯救！'
    - type: paragraph
      text:
