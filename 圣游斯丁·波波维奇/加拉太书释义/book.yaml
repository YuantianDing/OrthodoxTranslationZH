        cn: '3:25'
    - type: paragraph
      text:
        ru: 'Закон, и све што је у њему, само је «сенка» онога што је остварио Христос поставши човек, сишавши у наш земаљски свет и доневши Собом све стварности неба (ср.Кол.2:17). А те су стварности? Божанске стварности. Јер доневши себе, Бога на земљу, Он је донео и свесавршену Свестварност: свестварност Вечне Истине, Вечне Правде, Вечне Љубави, Вечног Добра, Вечног Живота. И све то оваплотио у тело људско, у тело Своје, и учинио човечански реалним и опипљивим за свако људско биће. И основао на себи и собом – Цркву, тело Христово, у коме је сва пуноћа Божанства (Кол.2:9;Еф.1:23); и Њега Бог Отац даде за главу телу Цркве (Еф.1:22). На тај начин «тело Христово» је постало сместилиште и обиталиште свих небеских, божанских стварности. А када је тело тих стварности ту, на земљи, онда «сенка» њихова није ни потребна; више нисмо под Законом; Закон се са радосном смиреношћу уклања, пошто је извршио своју дужност. Закон нас је довео Христу, а Христос нас вером Својом уводи у све божанске дарове и савршенства. Вера у Христа даје сваком људском бићу све што му је потребно за побожан вечни живот и у овом и у оном свету (ср.2Пет.1:2–4). Јер у Христу се спасава, оправдава сваки који верује у Њега (ср.Деян.13:39). Пошто дође вера Христова, и у њој и са њом сав истинити Бог и Господ са свима Својим божанским савршенствима; пошто је Спаситељ, Богочовек Христос већ ту, са нама, заувек међу нама у Цркви Својој, онда нам није више потребан водитељ ка Христу – Закон Мојсијев. Од сада смо непосредно под Богом Господом Христом, под вером Његовом, нисмо више под водитељем, под Законом Мојсијевим. Бог Спаситељ и Месија није више обећање, већ наша земаљска стварност; Он није само на небу, већ је сав и на земљи у Богочовечанском телу Свом – Цркви.'
        cn: 律法及其所有内容，仅仅是基督藉着成为人、降临到我们这地上世界并带来了天上的一切实相（参看歌罗西书 2:17）所成就之事的「影儿」。而那些实相是什么呢？是神圣的实相。因为祂将自己，将神，带到地上，祂也带来了全然完美的实相：永恒真理的实相、永恒公义的实相、永恒之爱的实相、永恒良善的实相、永恒生命的实相。并且将这一切道成肉身在人的身体里，在祂自己的身体里，使之对每个人类个体而言切实真实且可触摸。并且藉着自己并以自己为基础建立了教会——基督的身体，在其中有神性的一切丰盛（歌罗西书 2:9，以弗所书 1:23）；并且父神使祂作教会这身体的头（以弗所书 1:22）。如此一来，「基督的身体」就成了所有天上、神圣实相的居所和住处。而当那些实相的实体在此地，在地上时，那么它们的「影儿」就不再需要了；我们不再处于律法之下；律法便带着喜乐的谦卑退去，因为它已经完成了它的职责。律法把我们引向基督，而基督则藉着对祂的信心将我们带入一切神圣的恩赐和完美之中。对基督的信心赐予每个人类个体在今世和来世过敬虔永生所需的一切（参看彼得后书 1:2-4）。因为在基督里，每个信祂的人都得蒙拯救、得蒙称义（参看使徒行传 13:39）。既然基督的信仰已经降临，并且在这信仰之中并与这信仰同在的，是全然真实的上帝和主，带着祂一切神圣的完美；既然救主，神人基督已经在此，与我们同在，永远在祂的教会中与我们同在，那么我们就不再需要一个引向基督的引导者——摩西律法了。从今以后我们直接在上帝主基督之下，在祂的信仰之下，不再在引导者，在摩西律法之下。上帝救主和弥赛亚不再是一个应许，而是我们地上的实相；祂不仅在天上，而是全然也在地上，在祂的神人身体——教会之中。
    - type: paragraph
      text:
        ru: '3:26'
        cn: '3:26'
    - type: paragraph
      text:
        ru: 'Бог није више далеки, небески Господар и Законодавац, већ наш земаљски сажитељ, Бог оваплоћени, међу нама људима и сам човек – Богочовек, и мили, блиски, жалостиви Отац. Вером Христовом ми постајемо синови Божји, а до ње и без ње ми смо људи само створења Божја. Јер нас вера Христова рађа духовно као синове Божје. Изузетна милост и човекољубље Божје, показани према роду људском, састоје се управо у томе што нам у Христу Бог даје силу и моћ да постанемо синови Божји рађајући се од Бога (ср.Ин.1:12–13). Који год верује да је Исус заиста Месија, заиста Спаситељ, тај је од Бога рођен (ср.1Ин.5:1). Врхунац је Божјег човекољубља то што нам је дао да Христом постанемо деца Божја, и да се назовемо деца Божја (ср.1Ин.3:1–2). А родити се од Бога, постати син Божји, шта значи? Значи: живети животом Божјим у свету, живети Христом, живети Духом Светим, живети Светом Тројицом – од Оца кроз Сина у Духу Светом; живети Вечном Божанском Истином и Правдом и Љубављу и Животом, свим оним што је Божје и божанско и савршено и вечно и богочовечно; сав бити вођен Духом Божјим, «јер синови су Божји они које води Дух Божји» (Рим.8:14); јер Дух Божји и јесте тај који нас усињује Богу (Рим.8:15); Он сведочи нашем духу да смо деца Божја (Рим.8:16). «А кад смо деца, и наследници смо: наследници дакле Божји, а судаследници Христови» (Рим.8:17).'
        cn: '上帝不再是遥远的天上主宰和立法者，而是我们地上的同住者，是道成肉身的上帝，在我们人类中间，祂自己也是人——神人，以及那亲爱、亲近、满有怜悯的父亲。藉着基督的信仰，我们成为上帝的儿子；而在此信仰之前或没有此信仰时，我们人类都只是上帝的受造物。因为基督的信仰在灵里将我们生为上帝的儿子。上帝向人类所彰显的卓越恩典和仁爱，恰恰在于祂在基督里赐给我们力量和权能，使我们藉着从上帝而生，得以成为上帝的儿子（参 约翰福音 1:12-13）。凡相信耶稣确实是弥赛亚，确实是救主的人，都是由上帝而生（参 约翰一书 5:1）。上帝仁爱的顶峰在于祂藉着基督赐予我们成为上帝儿女，并被称为上帝儿女的权利（参 约翰一书 3:1-2）。


          那么，从上帝而生，成为上帝的儿子，这意味着什么呢？这意味着：在世上活出上帝的生命，活出基督，活出圣灵，活出圣三一——即从父藉着子在圣灵里；活出永恒的属神真理、公义、爱与生命，活出一切属上帝的、神圣的、完美的、永恒的以及神人性的事物；全然被上帝的灵引导，因为「凡被上帝的灵引导的，都是上帝的儿子」（罗马书 8:14）；因为上帝的灵正是那使我们被上帝收纳为儿子的（罗马书 8:15）；祂向我们的灵作证，我们是上帝的儿女（罗马书 8:16）。「既然我们是儿女，那么我们也是后嗣：就是上帝的后嗣，并与基督同作后嗣」（罗马书 8:17）。'
