    - type: paragraph
      text:
        ru: 'Обукавши се у Христа, ви сте се обукли у новог човека, вечног човека – Богочовека: Он људе благодаћу претвара у богољуде; Црква је Његова божанска радионица, у којој се људи светим тајнама и светим врлинама прерађују у благодатне богољуде: сви постају синови Божји, и међу собом света божанска браћа. «Нема више Јеврејина ни Грка; нема више роба ни слободњака; нема више мушкога рода ни женскога: јер сте сви ви једно у Христу Исусу». У Богочовеку Христу све земаљске разлике што су међу људима нестају; људи се онебесују, обожују, обогочовечују, охристовљују, и за хришћане Господ Христос постаје све и сва у свима њиховим видљивим и невидљивим световима. Што је Његово, то је њихово: Његов ум – постаје њихов ум (ср.1Кор.2:16), Његова душа – њихова душа, Његова савест – њихова савест, Његова воља – њихова воља, Његова истина – њихова истина, Његова правда – њихова правда, Његова љубав – њихова љубав, Његов живот -њихов живот, Његова смрт – њихова смрт, Његово васкрсење – њихово васкрсење, Његово вазнесење – њихово вазнесење, Његово Царство – њихово Царство, Његов рај – њихов рај, Његова вечност – њихова вечност, Његово блаженство – њихово блаженство. А све то хришћане духовно и благодатно уједињује у једно тело, у један организам, у једну Цркву: у њој сваки живи у свакоме и са сваким, сваки живи за све и за свакога, сваки осећа себе собом у свакоме и у свима: једно срце, једна душа, једна савест (ср.Деян.4:32;1Кор.10:17, 12:12–27;Рим.12:5;Еф.3:18); сви једно у Христу Исусу, и стога сви једно међу собом, и један у другоме, сваки у свакоме, и сви у свакоме. У Христу престаје све што је «по човеку», и настаје све «по Богочовеку»: и вредности и мерила и стварности и мисли и осећања, све бива по Богочовеку, ништа по човеку. Отуда у Христу и небивало и невиђено јединство рода људског, јединство остварено без насиља и принуда, добровољно и благодатно: богочовечанско јединство, и богочовечански ред и поредак. Јер ту је увек и у свему: на првом месту Бог, па човек; никад обратно, и никад човек без Бога. Живећи у Богочовечанском организму, телу Христовом, Цркви, људи саборнизирају и своје душе и своје савести и своја срца и своје мисли, те живе и делају из те саборности, из тог богочовечанског свејединства, и расту један са другим и један кроз другога, сваки кроз све и сви кроз свакога, заједно «са свима светима» растући сваки у човека савршена, у меру раста висине Христове (Еф.3:18, 4:12–13, 1:22–23;Кол.1:24–28). Ми се сви крстимо у једно тело, били Јевреји или незнабошци, били робови или слободњаци, и сви постајемо једно тело, које је Црква; тако смо тело Христово, и уди међу собом (ср.1Кор.12:13, 20:27). У Цркви нема Грка ни Јеврејина, обрезања ни необрезања, дивљака ни Скита, роба ни слободњака, него све и у свему Христос – τὰ πάντα καὶ ἐν πᾶσι Χριστός (Кол.3:11): Христос све у свачијој души, све у свачијем срцу, све у свачијој савести и животу и мислима и осећањима и хтењима, све у свима световима и бесмртностима и вечностима.'
        cn: 穿上基督，你们就穿上了新人，永恒的人——神而人者：祂以恩典使人变为爱神者；教会是祂神圣的作坊，在其中，人们藉着圣事和神圣美德被再造为蒙恩的爱神者：所有人成为上帝的儿女，并在彼此之间成为神圣的弟兄。「不分犹太人或希腊人，不分奴隶或自由人，不分男或女，因为你们在基督耶稣里都成为一了。」（加拉太书 3:28）在神而人者基督里，人们之间所有属世的差异都消失了；人们被属天化，被神化，被神而人者化，被基督化，对基督徒而言，主基督成为他们所有可见和不可见世界中的一切。凡属祂的，就是他们的：祂的心意——成为他们的心意（哥林多前书 2:16），祂的灵魂——他们的灵魂，祂的良知——他们的良知，祂的旨意——他们的旨意，祂的真理——他们的真理，祂的公义——他们的公义，祂的爱——他们的爱，祂的生命——他们的生命，祂的死亡——他们的死亡，祂的复活——他们的复活，祂的升天——他们的升天，祂的国度——他们的国度，祂的乐园——他们的乐园，祂的永恒——他们的永恒，祂的福乐——他们的福乐。而这一切在灵性和恩典上将基督徒联合成一个身体，一个有机体，一个教会：在其中，每个人活在每个人之中并与每个人同在，每个人为所有人而活，也为每个人而活，每个人在每个人之中和所有人之中都感受到自己是自己：一颗心，一个灵魂，一个良知（使徒行传 4:32，哥林多前书 10:17，12:12-27，罗马书 12:5，以弗所书 3:18）；所有人都在基督耶稣里合一，因此所有人在彼此之间合一，并且一个在另一个里面，每个人在每个人里面，所有人都在每个人里面。在基督里，一切「属人的」都止息了，一切「属神而人者」的都兴起了：价值观、尺度、现实、思想和情感，一切都按神而人者的样式存在，没有什么是按人的样式存在的。因此在基督里，人类种族拥有前所未有、前所未见的一体性，这种一体性不是通过暴力和强迫实现的，而是自愿且蒙恩的：是一种神而人者的一体性，以及神而人者的秩序和规章。因为在那里，总是在一切事上：首先是上帝，然后是人；从不颠倒，也从没有人离弃上帝。活在神而人者的有机体，即基督的身体——教会之中，人们将他们的灵魂、良知、心灵和思想会聚起来，并从这种会聚中、从这种神而人者的一体中生活和行动，并在彼此之间成长，一个通过另一个成长，每个人通过所有人成长，所有人通过每个人成长，共同「与众圣徒」一同成长，每个人都成长为一个完美的人，达到基督丰满身量的程度（以弗所书 3:18，4:12-13，1:22-23，歌罗西书 1:24-28）。我们都受洗归入一个身体，无论是犹太人或外邦人，是奴隶或自由人，并且都成为一个身体，就是教会；因此我们是基督的身体，在彼此之间互为肢体（哥林多前书 12:13，20:27）。在教会里没有希腊人或犹太人，没有受割礼或未受割礼的，没有野蛮人或西古提人，没有奴隶或自由人，唯有基督是一切，又在一切之内——τὰ πάντα καὶ ἐν πᾶσι Χριστός（歌罗西书 3:11）：基督在每个人的灵魂中是万有，在每个人的心中是万有，在每个人的良知、生命、思想、情感和意愿中是万有，在所有的世界、不朽和永恒中是万有。
