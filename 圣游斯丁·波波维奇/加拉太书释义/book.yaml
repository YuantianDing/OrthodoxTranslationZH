    - type: paragraph
      text:
        ru: 'Лажни су учитељи они који се обрезују а не држе остале прописе старозаветног Закона: о првинама, о суботи, и осталим стварима. Они нити су хришћани нити Јевреји, па хоће и вас да наведу на то, да би се, ако ничим другим, хвалили вашим обрезањем као својим успехом: они учитељи – а ви ученици! О, ослепљени самољубљем безумних учитеља, који хоће спасење без Спаситеља, и Спаситеља без крста!'
        cn: 假教师就是那些行割礼却不遵守旧约律法中关于初熟之物、安息日以及其他事情的其余规定的人。他们既不是基督徒也不是犹太人，却想引诱你们也那样做，好让他们，即便没有别的可夸，也能以你们的割礼为自己的成功而夸耀：他们是教师——而你们是学生！哦，愚昧的教师们啊，你们被自爱蒙蔽了双眼，你们想要没有救主的救恩，以及没有十字架的救主！
    - type: paragraph
      text:
        ru: '6:14'
        cn: '6:14'
    - type: paragraph
      text:
        ru: 'А ја Боже сачувај да се чим другим хвалим осим крстом Господа нашег Исуса Христа, јер се крстом умртви смрт, уништи грех, усмрти ђаво, и нама дарова живот вечни и истина вечна и правда вечна; речју: крстом се изврши наше спасење. Зато је крст, само крст – истинска хвала наша, истинска хвала сваког правог човека. Јер, зар се може назвати истинском хвалом ма која хвала људска која не спасава од греха, од смрти, од ђавола, и не даје човеку истину вечну и живот вечни? Не, нема хвале за човека сем оне која му даје спасење и осигурава живот вечни. А то даје само крст Спасов. Зато је он – хвала наша у свима световима. Без те хвале – човек је без истинске славе, без истинског живота, без истинске бесмртности; човек је постопут срам, срам, срам, и смрад, смрад, смрад; и човек и човечанство и свако људско биће – беда и очај и срам и смрад! Крст Христов – пре свега и изнад свега! Зато «све држим за штету према преважноме познању Христа Исуса Господа, кога ради све оставих, и држим све да су трице» (Флп.3:8). За човека у земаљском свету, шта је важно, шта једино важно? Да Христа Спаса добије, да се нађе у Њему, да живи Њиме, да се разапне Њему, да васкрсне Њиме, да се вазнесе Њиме, и тако постигне спасење кроз потпуно охристовљење (ср.Флп.3:8–11). Ради тога – «с Христом се разапех. И ја више не живим, него у мени живи Христос» (Гал.2:19–20). Мислите, жив сам? Да, у Христу и са Христом, и за Христа, и за све оне у Христу. А за свет ја сам мртав, и свет је за мене мртав: крстом Христовим разапе се мени свет и ја свету: мртав сам греху и за грех, мртав сам свима сластима овога света, мртав сам смрти и за сваку смрт; но и према мени лежи сав свет мртав, мртве су све његове сласти и сабласти, и не могу ме привући ни завести. Јер знам ко је живот, и ко даје живот: Он, чудесни Свепобедни Победитељ смрти; све су смрти мртве пред Њим и пред нама хришћанима, сви су греси мртви, сви су ђаволи мртви; а ми смо живи вечним животом, вечито живи, и никаква нам смрт не може наудити ни у овом ни у оном свету. Живећи васкрслим Господом, ми од Њега сваког тренутка добијамо свепобедне васкрсне силе којом побеђујемо сваку смрт и савлађујемо све смртно, побеђујемо сваки грех и савлађујемо све греховно, побеђујемо сваког ђавола и савлађујемо све ђаволско. Нема силе ни у једном од постојећих светова која је јача од нас, јер све можемо у Христу Исусу који нам моћи даје (ср.Флп.4:13), моћи божанске, свесилне, свепобедне. По томе ми смо нови људи, богољуди по благодати, и нама не може наудити никаква смрт, никакав грех, никакав ђаво.'
        cn: 我万不可夸耀别的，只夸耀我们主耶稣基督的十字架。因为借着十字架，死亡被置于死地，罪恶被摧毁，魔鬼被处死，并赐予我们永生、永恒的真理和永恒的公义；简言之：借着十字架，我们的救赎得以成就。因此，十字架，唯有十字架——才是我们真正的夸耀，是每一个真正的人的真正夸耀。因为，任何不能使人脱离罪恶、死亡和魔鬼，也不能赐予人永恒真理和永生的属人夸耀，难道还能称之为真正的夸耀吗？不，对人而言，没有别的夸耀，除了那赐予他救赎并确保永生的以外。而这唯有救主的十字架能赐予。因此，它——是我们所有世界中的荣耀。没有这份荣耀——人便没有真正的荣耀，没有真正的生命，没有真正的不朽；人就完全是羞耻，羞耻，羞耻，和恶臭，恶臭，恶臭；人类个体、全人类和每一个人类个体——都是悲惨、绝望、羞耻和恶臭！基督的十字架——在万有之上，超越万有！因此，「我将万事看作损失，相比于对主耶稣基督那超越一切的认识，为祂的缘故我舍弃了一切，并将万事看作粪土」（腓立比书 3:8）。对于身处地上世界的人而言，什么才是重要的，什么才是唯一重要的？就是获得基督救主，在祂里面被寻见，靠祂而活，与祂同钉十字架，靠祂复活，靠祂升天，从而通过完全的基督化来获得救赎（参腓立比书 3:8-11）。为此——「我已经与基督同钉十字架。现在活着的不再是我，乃是基督在我里面活着」（加拉太书 2:19-20）。你们以为，我还活着吗？是的，在基督里，与基督同在，为基督，也为一切在基督里的人。但对于世界，我已死去，世界也对我死去：借着基督的十字架，世界对我而言已被钉死，我对于世界也已被钉死：我向罪而死，向着这世间的一切享乐而死，向着死亡和向着一切死亡而死；然而，整个世界也向我死去，它的一切享乐和诱惑都已死去，不能吸引我，也不能引诱我。因为我知道谁是生命，谁赐予生命：祂，那奇妙的、战胜一切的死亡征服者；在祂面前，在我们基督徒面前，所有的死亡都已死去，所有的罪恶都已死去，所有的魔鬼都已死去；而我们活在永恒的生命中，永远活着，没有任何死亡能伤害我们，无论今世或来世。靠着复活的主而活，我们每时每刻都从祂那里获得战胜一切的复活大能，借此我们战胜一切死亡，克服一切属死的；战胜一切罪恶，克服一切属罪的；战胜一切魔鬼，克服一切属魔鬼的。在现有的一切世界中，没有任何力量比我们更强大，因为我们靠着那加给我们力量的基督耶稣，凡事都能做（参腓立比书 4:13），这力量是神圣的、全能的、战胜一切的。因此，我们是新造的人，蒙受恩典而拥有神性的人，没有任何死亡、没有任何罪恶、没有任何魔鬼能伤害我们。
    - type: paragraph
      text:
        ru: '6:15'
        cn: '6:15'
    - type: paragraph
      text:
        ru: 'Зато у Христу Исусу нити што вреди обрезање нити необрезање, него нова твар. Нова твар – у Њему и Њиме, који је једина новина под сунцем. Једина новина као Победитељ смрти, греха и ђавола; као Спаситељ од греха, смрти и ђавола; као Давалац новог живота – вечног живота. Отуда Он једини и даје нови живот, и ствара новог човека, спасавајући га од греха, смрти и ђавола, који састарују, иструљују човека, и испуњујући га Божанским Животом, Божанском Истином, Божанском Правдом, Божанском Љубављу, и осталим Божанским силама које су увек нове и неостариве, јер су вечне. Оне и прерађују и преображавају и обнављају човека: од старог чине га новим, од смртног чине га бесмртним, од ђавољег чине га Божјим. Стога: «Ко је у Христу – нова је твар = καινὴ κτίσις: старо прође, гле, све ново постаде» (2Кор.5:17): нов ум, ново срце, нова душа, нова савест, нова воља, нов сав човек у свима својим састојцима сем – греха. То је уистини нови човек: благодатни богочовек. Да, хришћанин је благодатни богочовек, хришћани су благодатни богољуди. Зато у Христу Исусу нити што вреди обрезање нити необрезање, него нова твар.'
        cn: 因此，在基督耶稣里，割礼或未受割礼都毫无价值，唯有新造之人。新造之人——在祂里面，并借着祂，祂是天下唯一的更新。这唯一的更新，是作为死亡、罪恶和魔鬼的得胜者；作为从罪恶、死亡和魔鬼中拯救的救主；作为新生命——永恒生命的赐予者。因此，唯有祂赐予新生命，并创造新人，将人从罪恶、死亡和魔鬼中拯救出来，因为这些使人衰老，使人腐朽；祂又以神圣的生命、神圣的真理、神圣的公义、神圣的爱，以及其他永远常新不朽的神圣能力充满人，因为它们是永恒的。它们炼净、改变并更新人：使人从旧的变为新的，从必死的变为不死的，从属魔鬼的变为属神的。因此：「若有人在基督里，他就是新造的人 = καινὴ κτίσις：旧事已过，看哪，一切都变成新的了」（哥林多后书 5:17）：新的心思，新的心，新的灵魂，新的良知，新的意志，整个人连同他所有的组成部分都更新了，除了——罪。这确实是新人：蒙恩的神人。是的，基督徒是蒙恩的神人，基督徒们是蒙恩的神人。因此，在基督耶稣里，割礼或未受割礼都毫无价值，唯有新造之人。
    - type: paragraph
      text:
        ru: '6:16'
        cn: '6:16'
    - type: paragraph
      text:
        ru: 'И колико их год по овоме правилу живе, на њима је мир и милост, као на правом Израиљу Божјем. Израиљу Божјем по вери, аврамовској вери у истинитог и јединог Месију рода људског – Господа Исуса Христа Богочовека. Који су од те вере – добијају благослов са верним патријархом Авраамом (ср.Гал.3:9); и то су прави потомци Авраамови (Гал.3:7); а кад су потомци Авраамови онда су и Христови, и по обећању наследници царства благодати – царства Божјег (Гал.3:29). Онда су: Израиљ Божји, нови Израиљ.'
        cn: 凡是照着这规条而活的，他们身上便有平安和恩典，如同在神的真以色列人身上。这神的以色列，是借着信心，是亚伯拉罕对人类真实而唯一的弥赛亚——主耶稣基督、那神人——所怀的信心。凡是出于这信的，便与那忠信的族长亚伯拉罕一同蒙福（参阅 加拉太书 3:9）；他们也是亚伯拉罕真正的后裔（加拉太书 3:7）；他们既是亚伯拉罕的后裔，便是基督的，并且照着应许，是恩典之国——神的国——的继承人（加拉太书 3:29）。那么他们就是：神的以色列，新以色列。
    - type: paragraph
      text:
        ru: '6:17'
        cn: '6:17'
    - type: paragraph
      text:
        ru: 'Сада знате Спасову благовест спасења, стога више да ми нико не досађује. Сада знате да је спасење једино у Спаситељу, у Његовом свеспасоном крсту, а ни у каквом обрезању или ма чему другом. Немојте више тражити од мене никакве доказе о томе, нити веровати лажним учитељима и њиховим причама било о мени, било о спасењу. Спасење се мора одстрадати крстом; и уколико се страдања Христова умножавају на нама, утолико се и утеха наша умножава кроз Христа (ср.2Кор.1:5). Ми једнако носимо на телу смрт Господа Исуса, да се и живот Исусов на телу нашем покаже. Јер ми живи једнако се предајемо на смрт за Исуса, да се и живот Исусов јави на смртном телу нашем (2Кор.4:10–11). Са тих разлога и ја ране Господа Исуса на телу своме носим: од страдања за Њега, а тиме од страдања ради мога спасења. Спасење се мора извојевати у рату са свима видљивим и невидљивим непријатељима нашега спасења; и у томе рату задобијају се многе ране. Ево и на мени тих рана; оне су сведоци моје крсне вере у Спаситеља крстоносца и васкрситеља; оне су доказ истинитости Еванђеља спасења које проповедам. Још при првом сусрету мом са васкрслим Господом на мом христогонилачком путу за Дамаск, Он ми је објавио да морам много пострадати за Њега. И ето, ја сам страдао; и још страдам, ево рана. Све што је Спасово испуњује се на мени: а Он је сав у Еванђељу спасења, које вам проповедам и речима и чудесима и ранама. Што више рана хришћанин задобије у рату за своје спасење, то је бољи војник Христов, и утолико му је сигурније спасење. Не треба се варати: нама се дарова Христа ради не само да Га верујемо него и да страдамо за Њ, једнако се борећи за своје спасење (ср.Флп.1:29–30). Спасење се постиже непрекидним стајањем у Еванђељу Спасовом, непрекидним живљењем у Еванђељу и по Еванђељу, непрекидним идењем за Спаситељем са крстом у срцу, у мислима, у души, у уму, у телу. Јер без крста – нема спасења бићу што се човек зове. Знајте, знајте, знајте: где је крст, ту је спасење. Јер је чудесни Господ Христос све силе Свог богочовечанског домостроја спасења рода људског стопио, слио у крст. Зато је крст и постао «знак Сина Човечијега» (Мф.24:30), вечити знак, неразориви знак, и на небу и на земљи једини знак. Тим знаком се побеђују сви видљиви и невидљиви непријатељи нашег спасења, и занавек осигурава спасење наше и у овом и у оном свету.'
        cn: 你们现在知道了救主的救恩福音，因此请不要再有人打扰我了。你们现在知道了救恩唯独在救主里面，在于祂那普世拯救的十字架，而不在于任何割礼或任何别的事物。不要再向我寻求任何关于此的证据，也不要相信假教师以及他们关于我或关于救恩的传闻。救恩必须借着十字架来受苦达成；因为基督的苦难如何加增在我们身上，我们的安慰也照样借着基督而加增（参阅哥林多后书 1:5）。我们身上常带着主耶稣的死，好让耶稣的生也在我们身上显明出来。因为我们这些活着的人，为耶稣的缘故常常被交于死地，好让耶稣的生也在我们这必死的身上显明出来（哥林多后书 4:10-11）。基于这些原因，我也在我身上带着主耶稣的伤痕：是因着为祂受苦，也因此是因着为我的救恩受苦。救恩必须在与所有看得见的和看不见的救恩仇敌的争战中争取获得；在那场争战中，会承受许多伤痕。看哪，我身上也有这些伤痕；它们是我对背负十字架并使人复活的救主所怀的十字架信仰的见证；它们是我所传讲的救恩福音之真实性的证据。早在我往大马士革的、迫害基督的路上与复活的主首次相遇时，祂就向我启示，我必为祂受许多苦。瞧，我已受苦；并且仍在受苦，这些就是伤痕。凡属救主的一切都正在我身上实现：祂全然在救恩的福音里，这福音我以言语、神迹和伤痕向你们传讲。基督徒在为自己的救恩而进行的争战中获得的伤痕越多，他就是越好的基督的战士，他的救恩也就越有保障。不要自欺：为了基督的缘故，我们蒙恩，不仅是相信祂，也是为祂受苦，同样为自己的救恩争战（参阅腓立比书 1:29-30）。救恩是借着持续地持守救主的福音、持续地活在福音里并按照福音生活、持续地跟从救主，心、思、灵、意、体都带着十字架而达成的。因为没有十字架，就没有名为「人」的受造物的救恩。你们要知晓，要知晓，要知晓：哪里有十字架，哪里就有救恩。因为奇妙的主基督将祂神人性的救赎人类的经纶的所有能力，都融合、汇入了十字架。因此，十字架也就成了「人子的兆头」（马太福音 24:30），一个永恒的兆头，一个不可摧毁的兆头，在天上和地上唯一的兆头。借着这个兆头，所有看得见的和看不见的救恩仇敌都被战胜，并永远确保了我们今世和来世的救恩。
    - type: paragraph
      text:
        ru: '6:18'
        cn: '6:18'
    - type: paragraph
      text:
        ru: 'Благодат Господа нашега Исуса Христа са духом вашим, браћо! Амин. Када је благодат Господа нашега Исуса Христа са духом вашим, она ће вам дати спасење и објаснити вам сву тајну његову. Дух ваш без те благодати не може ни знати шта је спасење нити га остварити. Благодат Господа Христа и јесте скуп свих богочовечанских сила Спасових, којима се и обавља спасење, када се оне сједине са духом нашим помоћу вере наше, љубави наше, молитве наше, поста нашег, кротости наше, смирености наше, покајања нашег, и осталих наших светих подвига еванђелских. Јер, како се биће наше облагодаћује Христовом благодаћу? Облагодаћује се помоћу светих врлина, а пре њих, и упоредо с њима, помоћу светих тајни: крштења, причешћа, исповести … Тек када се ум наш облагодати Христовом благодаћу, он постаје способан за здраву мисао, за богочовечанско расуђивање, за разумевање божанских тајни у нашем човечанском свету и у горњим световима. И тек када се срце наше облагодати божанском благодаћу Христовом, оно се оспособи да из себе точи света осећања, свете жеље, света расположења, света хтења. Тек када се сав човек облагодати у васцелом бићу свом, он постаје сав – нова твар, ново биће, нови човек: благодатни богочовек, Христов човек. А то је радост изнад свих радости за људско биће: јер је човек на то и за то створен. А спасење се и састоји у потпуном остварењу тога циља: постати богоносац, христоносац у васцелом бићу свом; живети Христом и ради Христа у свима световима и у свима вечностима. Амин! Амин! Амин!'
        cn: 愿我们主耶稣基督的恩典与你们的灵同在，弟兄们！阿们。当我们主耶稣基督的恩典与你们的灵同在时，它将赐予你们救赎，并向你们阐明他的一切奥秘。你们的灵若没有那恩典，既不能知道何为救赎，也不能实现它。主基督的恩典乃是救主一切神人兼具之力的汇聚，借此完成救赎，当这些力量借着我们的信心、我们的爱、我们的祷告、我们的禁食、我们的谦和、我们的谦卑、我们的悔改，以及我们其他圣洁的福音功修，与我们的灵合一时。因为，我们的生命如何被基督的恩典所充满呢？它是借着圣洁的美德，以及在它们之前并与它们并行地，借着圣奥秘——洗礼、圣餐、告解——而被恩典充满的……唯有当我们的心智被基督的恩典充满时，它才能有能力进行健康的思想，进行神人兼具的明辨，理解在我们属人的世界中和更高层世界中的神圣奥秘。唯有当我们的心被基督的神圣恩典充满时，它才能从自身倾泻出圣洁的情感、圣洁的渴望、圣洁的心境、圣洁的意愿。唯有当整个人在他的整个存在中被恩典充满时，他才全然成为——新受造物，新的存在，新人：蒙恩的神人，属基督的人。而这对于人类存在而言是超越一切喜乐的喜乐：因为人正是为此被创造的。而救赎正是在于那个目标的完全实现：在他整个存在中成为一个神载者、基督载者；靠基督而活，并为基督而活，在所有的世界中，以及在所有的永恒中。阿们！阿们！阿们！
    - type: paragraph
      text:
        ru: На преп. и богоносног
        cn: 致可敬的、负神的
