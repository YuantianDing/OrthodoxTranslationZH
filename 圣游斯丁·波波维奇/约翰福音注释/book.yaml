  '[19]':
    ru: 'Довде је стигла рука Аве Јустин, у подне: на Св.Апостола Аристовула (четвртак 29/16. марта 1979.), јер поподне је већ осетио тегове око срца и после 10 дана преминуо – на Благовести када је и рођен. Одавде надаље преписујемо сами из његове бележнице из 1945. године – прим. Уредн.'
    cn: 阿瓦·尤斯丁的手稿写到此处，时间是1979年3月29/16日（星期四）圣使徒阿里斯托布尔瞻礼日的中午。因为当天下午他已感到心脏不适，并在10天后——他出生的圣母领报节——离世。从此处起，我们自行抄录他1945年的笔记。——编者注
